  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition, Scope, and Adjacencies
        blocks:
          - type: paragraph
            body: >-
              The European SMB digital-presence market encompasses four commercially distinct but routinely bundled
              product layers: domain registration (typically €8–30 per domain per year), shared and managed web hosting
              (€3–25 per site per month), website-builder SaaS (€10–30 per month), and ecommerce-enablement platforms
              (€20–100 per month for SMB tiers). team.blue, IONOS Group, OVHcloud, Aruba, and a long tail of regional
              operators compete primarily in shared hosting and domain registration, where annual subscription economics
              and multi-year renewal cycles dominate. Included spend covers annual domain fees, managed WordPress,
              bundled hosting-and-email plans, and compliance SaaS (GDPR consent management, privacy policy generators,
              eIDAS trust services) sold to businesses with no dedicated IT department. Excluded are enterprise
              hyperscale cloud compute (AWS, Azure, GCP), colocation for large enterprises, large-scale Shopify Plus
              deployments for high-volume retailers, and DevOps-focused developer platforms (Vercel, Netlify, Railway).
              Adjacent markets that team.blue actively monetises but that fall outside the core hosting TAM include
              social-media analytics (Metricool), influencer marketing (Kolsquare), bookings SaaS (SimplyBook.me), and
              AI no-code app generation (Macaly). The status-quo substitute for a paid hosting subscription is either a
              freemium website-builder tier (Wix free plan, Webnode) or a dormant legacy shared-hosting account — both
              representing win-back and upsell opportunities. The European market is structurally differentiated from
              the US by language fragmentation across 20+ languages, GDPR and NIS2 regulatory obligations, strong ccTLD
              identity (especially .de, .fr, .it, .nl), and SMB buyer preference for local-language support — factors
              that reduce portability for US-headquartered incumbents and reinforce the moat of European-first operators
              such as team.blue and IONOS.
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM006
              - CM007
