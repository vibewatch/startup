    title: Risk Heatmap — team.blue (Likelihood vs Impact, June 2026)
    type: matrix
    layout: wide
    summary: >-
      Ordinal risk heatmap mapping team.blue's material risks across two axes: Likelihood (High / Medium / Low, columns)
