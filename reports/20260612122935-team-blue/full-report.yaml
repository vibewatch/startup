    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Market Position, and Business Model
        blocks:
          - type: paragraph
            body: >-
              team.blue (legal root: Combell Group NV) is a Belgium-headquartered private technology platform that
              markets itself as the "#1 digital success platform for European SMBs." The company operates more than 60
              brands spanning web hosting, domain registration, e-commerce enablement, online compliance SaaS, social
              media management, influencer marketing, and AI-powered website building. As of July 2024, it served 3.3
              million SMB customers across 22 European countries — Austria, Belgium, Bulgaria, Cyprus, Czechia, Denmark,
              Finland, France, Germany, Greece, Hungary, Ireland, Italy, the Netherlands, Portugal, Serbia, Slovakia,
              Spain, Sweden, Switzerland, Turkey, and the United Kingdom — and held top-10 market positions in 10 of
              those countries. By early 2026, the company described a workforce of over 4,000 experts, up from 2,500 at
              the July 2024 transaction, reflecting active M&A. The business model is subscription-led: customers pay
              recurring fees for hosting, domains, email, and SaaS add-ons, while the platform drives cross-sell of
              compliance, analytics, and AI tools built or acquired through its buy-and-build strategy. PHP — which
              powers roughly 75% of all websites globally — is foundational to team.blue's shared-hosting stack and
              WordPress platforms across Combell, Register.it, and TransIP. The company joined the PHP Foundation as
              Gold Sponsor in January 2026, confirming open-source infrastructure dependencies and community engagement.
              team.blue's vision, stated consistently since the CPP Investments deal in July 2024, is to "make online
              business success simpler with the intelligence of AI at every step," with Macaly (AI no-code app builder,
              acquired December 2025) and Windsor.ai (data integration, acquired January 2026) as the most recent AI
              capability additions.
