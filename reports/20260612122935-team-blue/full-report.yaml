              hosting, domains, and email: brands such as Combell (Belgium), TransIP (Netherlands), one.com
              (UK/Nordics), Register.it and Aruba (Italy), 123-Reg (UK), Loopia (Sweden/Nordics), and ~35 other regional
              brands provide web hosting, domain registration, email hosting, SSL, and entry-level website builders. The
              ecosystem page confirms top-10 market positions in 10 of 22 operating countries. The second cluster —
              WordPress and VPS/cloud infrastructure — targets developers and growing SMBs: TransIP offers five VPS
              packages with performance add-ons, Managed WordPress with an AI Site Assistant (including GPT Image 1
              upgrade), and open-source AI application support (Ollama, n8n, OpenClaw); Aruba.it adds Private AI
