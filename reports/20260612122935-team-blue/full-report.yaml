      - number: '4.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Leveraged Loan Repricing Failure — Financing Risk Confirmed
            body: >-
              A March 23, 2026 Bloomberg report confirmed that team.blue "scrapped a planned two-part deal to amend,
              extend and reprice existing loans" — the same article placing Hg's Visma alongside as a postponed IPO.
              This confirms: (1) a material leveraged capital structure exists; (2) the market rejected team.blue's
              repricing terms in early 2026; (3) the existing loan is on pre-repricing terms. Until total debt,
              maturity, and covenant status are disclosed, interest coverage and free-cash-flow-to-equity cannot be
              reliably estimated.
            calloutType: risk
            claimRefs:
              - CI028
              - CI029
              - CI030
          - type: callout
            title: Partial Revenue Floor from M&A Press Releases
            body: >-
              The three M&A disclosures with revenue data — Loopia (€65M, FY2023), Shoptet (>€30M, Sep 2025), and
              Metricool (€17M ARR, Sep 2024) — together total approximately €112M+ from three entities out of 60+
              brands. This partial-portfolio floor represents 17–25% of the estimated €450–650M revenue range,
              confirming the estimate is plausible but cannot be extrapolated without understanding how representative
              these three brands are of the full portfolio ARPU.
            calloutType: insight
            claimRefs:
              - CI013
              - CI014
              - CI015
          - type: callout
            title: Revenue Estimate Methodology and Limitations
            body: >-
              The €450–650M revenue estimate is derived from customer-count × blended ARPU triangulation using Loopia
              (€100/yr), IONOS (€212/yr), and the partial M&A revenue disclosures as anchors. Key assumptions: (1) 3.3M
              customers reflects the July 2024 CPP deal customer count; post-2024 M&A adds are not fully reflected; (2)
              blended ARPU of €130–200 weights Western EU brands more heavily than CEE additions; (3) no inter-company
              revenue eliminations are modelled; (4) Metricool, iubenda, and SaaS adjacency brands contribute higher
              ARPU per seat but smaller customer volumes. These estimates should be treated as directional only.
            calloutType: assumption
