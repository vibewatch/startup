      - number: '4.2'
        title: Disclosed Financial Signals and M&A Revenue Contribution
        blocks:
          - type: paragraph
            body: >-
              team.blue has never issued a press release or regulatory filing disclosing group-level revenue, EBITDA,
              net income, or debt. All financial intelligence must therefore be assembled from transaction-adjacent
              disclosures and acquired-entity revenue figures. The most material single data point is the €4.8 billion
              enterprise valuation established at the July 2024 CPP Investments transaction, which the press release
              explicitly described as representing "growth of eight-times since Hg first invested in 2019." Hg's
              investment began with the December 2018 succession of Waterland at Combell Group, and the Combell-TransIP
              merger in June 2019 established team.blue at approximately 1.2 million customers. If the 8× growth applies
              to enterprise value, and the 2019 founding EV was approximately €600M (consistent with the combined
              Combell + TransIP scale at formation), then the July 2024 €4.8B represents exactly 8×. Acquired-entity
              revenue disclosures provide the most granular financial evidence: Loopia Group reported 742 MSEK (~€65M at
              period-average exchange rates) in 2023 revenue; Shoptet revenues "well exceeding €30M" at its September
              2025 acquisition; Metricool ARR €17M at its September 2024 acquisition; Saleskit serves 3,000+ customers
              and 25,000+ users in CEE. At the time of the Hg/Waterland succession in December 2018, Waterland described
              growing Combell "more than tenfold" in five years through 17 bolt-on acquisitions, while the founding
              press release described the combined entity as "one-stop partner" with 1.2 million customers. By early
              2026, team.blue's headcount reached 4,000+ experts, up from 2,500 at July 2024 and 2,700 at Loopia
              acquisition close in May 2024. Hg Capital Trust reported its team.blue investment increased in value by
              £16.4 million in 2022 alone, affirming continued equity appreciation without disclosing the absolute
              quantum. The CPP investment was described by Linklaters as acquiring "c.20% stake" — implying a CPP entry
              price of approximately €960M at €4.8B valuation — with Hg retaining the largest single investor position.
              Neither total equity deployed by Hg nor the debt/equity split of the capital structure has been disclosed.
              A bottom-up revenue estimate built on customer count (3.3M) and blended ARPU benchmarked from Loopia (742
              MSEK / 650K customers ≈ €100/ customer/year) and IONOS (€1.316B / 6.2M customers ≈ €212/customer/year)
              implies team.blue's blended ARPU is likely €130–200 per customer per year given its mix of lower-ARPU CEE
              markets and higher-ARPU Western European brands, yielding an estimated revenue range of €430–660M.
