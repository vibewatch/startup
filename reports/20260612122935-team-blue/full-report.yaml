  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Buyer/User/Payer Dynamics
        blocks:
          - type: paragraph
            body: >-
              team.blue's 3.3 million active customers are predominantly micro and small businesses: sole traders,
              first-time entrepreneurs, freelancers, and growing SMBs that need an affordable, fully managed digital
              presence without technical skills. This segment, the company's declared core, is served primarily through
              its 60+ hosting and domain brands such as one.com, TransIP, 123-reg, Combell, Loopia, Webnode,
              Register.it, and more than a dozen local-market brands across 22 European countries. The buyer (who pays)
              and user (who operates the site) are typically the same individual or a small team with no dedicated IT
              function; the payer is also the user in the vast majority of hosting relationships.

              A second distinct segment is the agency and professional: web designers, digital marketing agencies,
              social media managers, and influencer marketing practitioners. team.blue itself cites approximately 30,000
              agencies in its ecosystem, represented most visibly through Kolsquare (2,000+ brand and agency clients
              including Coca-Cola, Netflix, Sony Music, Publicis, Sézane, Sephora, Lush, and Hermès) and Metricool (2M+
              users of whom a significant share are freelance social media managers and agencies). In this segment the
              buyer is often an agency account and the end-user is the brand team or its contracted operators.

              A third and growing segment comprises e-commerce merchants, captured by Shoptet (47K active stores in
              Czechia and Slovakia, revenues exceeding €30M) and partially by hosting brands offering WooCommerce or
              Shopify-adjacent integrations. Service-based SMBs — beauty salons, medical providers, personal trainers,
              educational tutors — represent a fourth distinct sub-segment, served by SimplyBook.me's appointment
              booking platform, with several named case studies demonstrating booking automation and no-show reduction.
              Compliance customers — websites and apps needing GDPR/CCPA/LGPD policy generators — form a fifth
              horizontal segment served by iubenda's 150,000+ customers across all verticals and geographies.
              team.blue's Digital Maturity Report, based on 8,000+ European companies, characterises the core audience
              as overwhelmed by digital complexity: 30% do not know which tools to use, and 26% lack digital skills,
              precisely the pain points team.blue's simplified, bundled offerings address.
