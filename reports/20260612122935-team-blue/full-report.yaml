        title: Exhibits
        blocks:
          - type: callout
            title: Leverage Opacity Is the Single Largest Valuation Risk
            body: >-
              The March 2026 Bloomberg-sourced adverse report — that team.blue scrapped a leveraged loan repricing
              alongside Dedalus — is the single most material data point not captured in any official team.blue
              communication. At a €4.8 billion EV, even €500 million of net debt (a conservative assumption for a
              PE-backed buy-and-build platform of this scale) would reduce equity value to €4.3 billion — below the CPP
              entry mark if any deterioration in EBITDA occurs. The debt quantum, maturity profile, and covenant package
              must be the first diligence priority.
            calloutType: risk
