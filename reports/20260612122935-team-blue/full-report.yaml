              revenue exceeding €30M and 90%+ customer satisfaction in CEE; Shoptet Premium extends to enterprise
              merchants. The compliance SaaS cluster covers iubenda (GDPR/CCPA/LGPD privacy and cookie automation with
              ML-optimised consent banners) and consentmanager (cookie consent management). The marketing and sales SaaS
