  - id: cybersecurity-infrastructure-risk
    title: Cybersecurity, Infrastructure, and Operational Risk
    body: >-
      ENISA's annual Threat Landscape report (2024) identified threats against availability as
      the top-ranked EU cybersecurity threat, followed by ransomware and threats against data.
      ENISA's 2025 Threat Landscape confirmed that threat groups are reusing tools and techniques,
      exploiting vulnerabilities more rapidly, and collaborating to target European digital
      infrastructure with increasing focus on cloud and hosting providers. For team.blue,
      operating 60+ brands across 22 countries — each with independent hosting infrastructure,
      domain systems, and customer databases — the attack surface is materially wider than that
      of a single-brand operator. ENISA's cloud cybersecurity market analysis (2023) highlighted
      the concentration risk in shared infrastructure stacks and the absence of mandatory
      security certifications for many cloud service providers operating in the EU market.

      The March 2021 OVHcloud SBG2 data centre fire in Strasbourg remains the clearest
      precedent for catastrophic single-site risk among European cloud operators: SBG2 was
      destroyed, SBG1 was partly destroyed, and customers who lacked off-site backups suffered
      irreversible data loss. team.blue has not published a data-centre certification or
      business-continuity framework equivalent to ISO 22301, and no independent verification of
      backup-and-recovery SLAs for any of its 60+ brands is publicly available. ENISA data
      shows European hosting and SMB-cloud providers are actively targeted by ransomware groups
      (ENISA ransomware landscape, 2025 update) due to the high-value nature of customer data
      aggregated in multi-tenant hosting environments. A successful ransomware or DDoS attack at
      group scale — disrupting hosting, email, and DNS for millions of SMBs simultaneously —
      could trigger NIS2 mandatory incident reporting, reputational damage, and mass churn of
      price-sensitive customers with low switching costs. team.blue's legal-and-security page
      references DDoS protection and SSL across its portfolio, but no unified security
      certification (ISO 27001 at group level, SOC 2, or equivalent) has been publicly confirmed,
      in contrast to OVHcloud's ISO 27001, ISO 27701, and HDS certifications.
