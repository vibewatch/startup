  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Locus Robotics is consistently identified as a private warehouse-automation company founded in 2014 and
              headquartered in Wilmington, Massachusetts (C001, C003). Its product is not only a robot: the company
              describes a unified platform of intelligent robots, LocusONE orchestration, integrations, deployment, and
              support delivered through Robots-as-a-Service (C004, C005). GlobalData independently describes
              warehouse-control and warehouse-management integration, while the company site states that its API has
              connected to more than 65 WMS/ERP systems (C006). That combination points to an integration-led operating
              model in which software, deployment capability, and recurring service are strategically important
              alongside hardware. The model also creates diligence questions around retained-asset ownership, service
              economics, and implementation capacity that are not answered by public disclosures.
