  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and demand context
        blocks:
          - type: paragraph
            body: >-
              The relevant market is warehouse and fulfillment automation spending that combines mobile robots, fleet
              orchestration, integration, and operating services. It includes collaborative picking, replenishment,
              transport, sorting, and adjacent autonomous fulfillment where a warehouse operator pays to move or process
              inventory. It excludes consumer robotics, drones, fixed automation unrelated to warehouse execution, and
              broad enterprise software not connected to physical material flow. This boundary matters because published
              estimates count different mixes of hardware, software, implementation, and services.       The U.S. Census
              Bureau estimated $340.2 billion of seasonally adjusted retail e-commerce sales in Q2 2026, up 12.2% year
              over year, while e-commerce was 17.1% of total retail sales. That is a demand-environment indicator, not
              an automation TAM. For Locus, the practical status quo is human travel and picking supported by existing
              WMS processes, while fixed goods-to-person systems and other AMRs are substitutes with different capital
              and flexibility trade-offs.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM012
      - number: '2.2'
        title: Sizing lenses and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Three lenses show why a single headline market number would overstate precision. Grand View Research
              estimates the global AMR market at $5.5 billion in 2026 and $14.0 billion in 2033, a 14.4% CAGR; its
              goods-to- person picking-robot segment held 48.3% of 2025 market share. MarketsandMarkets reports a
              narrower $2.75 billion 2026 AMR base and $7.07 billion in 2032 at the same 14.4% CAGR, with logistics/3PL
              forecast to grow at 16.7%. Mordor Intelligence places the broader warehouse-automation market at $34.17
              billion in 2026 and $76.22 billion in 2032, including equipment, control software, implementation, and
              operating services. These are not interchangeable TAM, SAM, and SOM figures: they use different scopes,
              geographies, and forecast methods. The defensible conclusion is that Locus has exposure to a growing AMR
              and warehouse-automation spend pool, but public evidence does not isolate the serviceable share reachable
              by Locus or convert market growth into company revenue.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM009
              - CM015
              - CM016
      - number: '2.3'
        title: Buyer segments, adoption path, and constraints
        blocks:
          - type: paragraph
            body: >-
              Locus sells into enterprise operators whose budget is tied to warehouse throughput, labor availability,
              and peak-season flexibility. Retail and e-commerce operators are the clearest demand pool: Mordor
              estimates they represented 28.29% of warehouse-automation revenue in 2026, while third-party logistics and
              contract warehouses represented 39.11%. MarketsandMarkets identifies logistics/3PL as the fastest-growing
              AMR industry segment in its forecast. The adoption path is usually a site deployment integrated with an
              existing WMS, followed by fleet expansion, additional workflows, or additional buildings. RaaS can lower
              upfront ownership commitment, but integration, change management, safety, reliability, and variable order
              volumes remain gating issues. Polaris explicitly identifies deployment cost across hardware, software,
              navigation, and facility integration as a primary growth challenge, especially for smaller companies. Thus
              the budget case is strongest for large, labor-exposed operators and 3PLs; the main valuation risk is
              assuming that broad warehouse spending converts quickly into repeatable Locus deployments.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
