  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Scale and product expansion support the thesis, while price opacity and execution risks constrain the
      recommendation.
    data:
      nodes:
        - id: scale
          label: ARR and deployment scale
          detail: $180M ARR estimate in June 2026; public deployment counts vary by source.
        - id: expansion
          label: Array / Nexera expansion
          detail: New autonomous workflows could expand revenue per warehouse.
        - id: risks
          label: Capital and execution risks
          detail: RaaS fleet ownership, manipulation reliability, margin, and financing opacity.
        - id: valuation
          label: Price discipline
          detail: Reported 2026 signals of about $1.35B-$1.81B are unverified; the Series G valuation was not disclosed.
        - id: decision
          label: Track / research-more
          detail: Revisit after cap table, cash conversion, unit economics, and Array evidence.
        - id: diligence
          label: Primary diligence
          detail: Obtain financing terms, cash conversion, retention, and production metrics.
      edges:
        - from: scale
          to: expansion
        - from: expansion
          to: risks
        - from: risks
          to: valuation
        - from: valuation
          to: decision
        - from: decision
          to: diligence
    claimRefs:
      - CV001
      - CV005
      - CV009
      - CV010
      - CV012
