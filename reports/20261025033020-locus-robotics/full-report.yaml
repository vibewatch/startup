  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Locus addresses warehouse material movement through a collaborative AMR model in which robots move through
              existing facilities while workers pick, rather than requiring a fixed goods-to-person installation. The
              company describes LocusONE as coordinating Origin, Vector, and Max robots in one fleet, with integrations
              to any WMS and support for sites as large as one million square feet. That positioning creates several
              distinct comparison sets. Collaborative AMR peers compete for brownfield picking and transport;
              software-neutral orchestration vendors compete for the control-plane role; dense goods-to-person and AS/RS
              vendors compete for throughput and storage density; and large incumbents can bundle robotics with broader
              warehouse systems. The status quo remains manual travel and system-directed labor, while internal build is
              plausible for very large operators with software and engineering teams. The buyer therefore evaluates
              deployment disruption, workflow breadth, integration, density, and vendor dependence—not just robot speed.
              Locus's RaaS model can reduce upfront ownership friction, but it does not eliminate integration, training,
              service, or performance risk.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP006
              - CP008
      - number: '3.2'
        title: Capability comparison and moat durability
        blocks:
          - type: paragraph
            body: >-
              Locus's defensible layer is the accumulated operating data and workflow integration around LocusONE, not
              an obviously unique mobile base. The company says its platform can coordinate hundreds or more than a
              thousand robots, dynamically assign tasks, and release over-the-air improvements to an installed base. An
              independent research profile describes the same strategic tension more sharply: Locus's software is the
              primary asset while the hardware is a commodity carrier, and price competition from Geek+ and overlap with
              Fetch/Zebra and 6 River/Ocado remain material. The Array launch expands the addressable workflow from
              human-assisted picking to autonomous picking, putaway, replenishment, and consolidation, but it also
              introduces manipulation reliability as a new gating dependency. Large incumbents such as Zebra can pair
              AMRs with workflow software and a broad enterprise distribution footprint; dense-system vendors can answer
              with higher storage density. Locus can defend through customer-specific integrations, fleet telemetry,
              deployment know-how, and multi-robot orchestration, but those advantages weaken if buyers prioritize
              lowest price, vendor-neutral control, or fully autonomous goods-to-person throughput.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
              - CP009
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP012
              - CP013
              - CP014
      - number: '3.3'
        title: Pricing, packaging, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not establish a comparable realized price for Locus or its peers. Sacra reports an
              approximate all-in RaaS price of $2,000 per robot per month, but that is an analyst estimate rather than a
              published Locus price list; Locus's own release confirms the availability of an all-inclusive RaaS model
              without disclosing contract economics. This makes a like-for-like price matrix inappropriate. Buyers can
              still compare the commercial architecture: subscription access and redeployment flexibility versus capital
              equipment and facility-specific infrastructure. Market research identifies high initial investment,
              integration, and training costs as adoption restraints even where AMRs reduce labor exposure. The
              competitive question is consequently payback under the buyer's workload, not a headline robot price.
              Locus's strongest near-term displacement case is brownfield, variable-demand operations where rapid
              deployment and multi-workflow orchestration matter. Its highest-risk cases are dense, standardized sites
              where fixed automation wins on throughput or buyers can internalize orchestration. Array may broaden
              Locus's share of wallet, but early-access deployment evidence is not the same as repeatable, independent
              proof of pick reliability or unit economics.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Control-plane and deployment wedge
            body: >-
              Locus's strongest competitive wedge is a flexible, multi-form-factor fleet and software layer that can be
              introduced without committing immediately to a fixed storage system.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP005
          - type: callout
            title: Autonomy claims need operating proof
            body: >-
              Array broadens the story but shifts diligence toward SKU-level grasp reliability, human intervention,
              uptime, and realized economics; early-access announcements do not answer those questions.
            calloutType: risk
            claimRefs:
              - CP007
              - CP009
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Locus describes a Robots-as-a-Service model that combines robots, orchestration software, support, and
              continuous optimization rather than a one-time equipment sale. Its official materials say customers can
              begin with one workflow and expand across facilities, regions, and functions through the same connected
              ecosystem. An independent Sacra analysis describes the commercial structure as approximately $2,000 per
              robot per month all-in, but that is an analyst estimate rather than a published price sheet or contract
              sample. This distinction matters: list or estimated monthly pricing is not realized revenue, and neither
              source discloses discounts, implementation fees, renewal terms, hardware depreciation, or the split
              between subscription, services, and equipment. The revenue mechanism is therefore directionally clear
              while revenue quality and unit economics remain only partially observable.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI002
            claimRefs:
