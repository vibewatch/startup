              - CU008
              - CU009
              - CU010
      - number: '6.2'
        title: Adoption trajectory and measurable outcomes
        blocks:
          - type: paragraph
            body: >-
              HelloFresh offers the clearest pilot-to-expansion sequence in the reviewed evidence. Its Factor operation
              began with 13 Locus Origin robots in July 2025, then added 26 robots within three months for a total fleet
              of 39. Two independent trade publications report an average mission time of three minutes and 36 seconds
              from induction to box drop-off, and a chilled assortment expansion from 100 to 500 SKUs. Supply Chain Dive
              also reports that the deployment supports about 12,000 square feet and two meal-kit picking lines. This
              evidence demonstrates a real production expansion tied to a customer operating outcome rather than a logo
              or an unquantified testimonial. DHL provides a second form of durability evidence through repeat
              deployment across many facilities and a billion cumulative picks. However, units picked, sites, robot
              counts, and SKU capacity are different measures with different denominators; they should not be combined
              into a single growth rate or customer funnel.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU008
              - CU009
              - CU010
      - number: '6.3'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              The commercial model appears designed for land-and-expand: a partner profile describes a
              Robots-as-a-Service structure that lets customers adjust fleet capacity, while Sacra attributes growth to
              larger fleets, additional workflows, and new sites inside existing enterprise accounts. DHL and HelloFresh
              make that mechanism plausible in practice. Nevertheless, no reviewed source provides gross retention, net
              retention, churn, renewal rates, contract terms, cohort behavior, or revenue concentration. The evidence
              therefore supports operational expansion, not quantified recurring-revenue durability. An independent
              research profile also reports 2023 and 2024 layoffs and customer deployment pauses after pandemic-era
              e-commerce volumes normalized. That source is explicitly best-effort and should not be treated as
              definitive, but it is a useful adverse signal that demand can pause even when large reference deployments
              remain intact. Investment diligence should obtain customer-level recurring revenue, renewal history, fleet
              changes, and top-account exposure before assigning a retention premium.
            claimRefs:
              - CU011
              - CU014
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU008
              - CU009
              - CU011
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Production evidence exceeds logo-level proof
            body: >-
              DHL's billion-pick milestone and more than 40 facilities, together with HelloFresh's documented 13-to-39
              robot expansion, show repeat use and production scale rather than isolated pilots.
            calloutType: strength
            claimRefs:
              - CU003
              - CU008
          - type: callout
            title: Retention and concentration remain unquantified
            body: >-
              Public deployment scale does not reveal gross retention, net retention, contract duration, customer-level
              revenue, or top-account exposure.
            calloutType: risk
            claimRefs:
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risks and investment implications
        blocks:
          - type: paragraph
            body: >-
              Array commercialization is the leading execution risk because the available record establishes two pilots
              and a first DHL delivery, not repeatable production performance across many sites and SKU families. The
              product also incorporates Nexera's NeuraGrasp technology, making acquisition integration part of the same
              risk. Financing is the second-ranked exposure: trade coverage reports a $41.6 million Series G from
              existing backers and says the round remained open, while an adverse analysis reports an implied valuation
              below the 2022 mark. Those statements describe capital raised, not cash available or runway. RaaS fleet
              ownership, enterprise integrations, and customer concentration complete the top tier because Locus bears
              ongoing hardware and service obligations while the public pool does not disclose contribution margin,
              fleet utilization, or account concentration. Investment should remain conditional on production Array
              metrics and a management-reconciled liquidity package.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR010
              - CR011
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR009
              - CR010
              - CR012
              - CR016
      - number: '7.2'
        title: Legal, regulatory, safety, and security exposure
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does not contain primary regulator, court, recall, incident, privacy, or security
              records for Locus. That absence is an evidence limit, not proof of a clean history. A compiled investor
              tear sheet lists a January 2025 announcement that Vector received CE certification, but it does not
              establish the certification scope, current status, or applicability to Array. Company executives describe
              localization, obstacle avoidance, charging optimization, cloud-native infrastructure, and interaction with
              other material-handling equipment; each capability increases the importance of validated change control,
              human-robot safety testing, access controls, and outage procedures. Before underwriting lower residual
              risk, diligence should obtain current product certificates, technical files, incident and near-miss logs,
              product-liability coverage, litigation schedules, DPAs, subprocessors, security audits, and breach history
              for every material jurisdiction.
            claimRefs:
              - CR008
              - CR009
              - CR012
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR012
              - CR013
      - number: '7.3'
        title: Operational and quality failure modes
        blocks:
          - type: paragraph
            body: >-
              Locus has evidence of operating scale, but scale broadens the surface that must work reliably. The
              official newsroom reports more than 150 customers across more than 360 sites, while a company executive
              described more than 15,000 AMRs and said customer environments differ by workflow, infrastructure, and
              labor conditions. Another company interview says some fleets triple for peak season and that LocusONE
              integrates with more than 75 ecosystem partners. These claims support a mature deployment motion, but also
              identify failure modes: site-specific commissioning errors, integration outages, peak logistics
              bottlenecks, battery or parts constraints, and uneven field service. For Array, the decisive indicators
              are pick success by SKU class, intervention rate, uptime, damage rate, labor substitution, and conversion
              from pilot to repeat production orders. A missed go-live or failure to expand beyond the first sites would
              weaken the platform-extension thesis.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR016
      - number: '7.4'
        title: Financial model and dependency exposure
        blocks:
          - type: paragraph
            body: >-
              Public financial profiles are not directly comparable. Sacra estimates $180 million of ARR in June 2026,
              whereas MGMT Boston lists $110 million of revenue without a stated period; ARR is not revenue, and neither
              figure supplies gross margin or cash burn. Clay's April 2025 financing profile is historical, while newer
              trade coverage describes a $41.6 million Series G that remained open. Locus's RaaS model can reduce
              customer capex, but Sacra says Locus retains ownership and can refurbish and redeploy robots, leaving the
              vendor exposed to hardware funding, utilization, residual values, maintenance, and seasonal logistics.
              Partner concentration is likewise undisclosed: DHL is the first reported Array deployment, Nexera supplies
              acquired manipulation technology, and more than 75 ecosystem integrations expand the operating dependency
              graph. The kill criteria are a runway shortfall, negative per-robot contribution economics, repeated Array
              exceptions, or material customer and partner concentration without contractual protection.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR009
              - CR010
              - CR011
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR009
              - CR010
              - CR011
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Array is the monitorable thesis-break test
            body: >-
              The next proof point is not another launch announcement; it is sustained DHL production performance
              followed by repeat deployments with disclosed pick success, intervention, uptime, and unit-economics
              evidence.
            calloutType: risk
            claimRefs:
              - CR010
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment call
        blocks:
          - type: paragraph
            body: >-
              Locus has a credible scale-and-expansion thesis: Sacra estimates $180 million of ARR in June 2026, up from
              $165 million at the end of 2025, while the company has expanded from collaborative AMR picking toward
              Array autonomous fulfillment. The financing record is substantial, but the latest company-announced
              valuation remains the near-$2 billion Series F mark from November 2022. Third-party sources report lower
              2026 signals of approximately $1.81 billion and $1.35 billion, but the $41.6 million Series G remained
              open and had no company-disclosed valuation. That combination supports a positive operating thesis but not
              a buy recommendation at an unknown price: the decision is highly sensitive to the preferred stack,
              dilution, cash needs, and whether ARR converts into durable gross profit after fleet ownership and support
              costs.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV009
              - CV010
              - CV012
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bull case is a land-and-expand warehouse platform: LocusONE coordinates robots and workers, the RaaS
              model converts customer adoption into recurring fees, and Array plus Nexera-derived grasping could expand
              the addressable workflows within existing buildings. Public evidence also shows meaningful customer and
              deployment scale, although the numbers differ by source and period. The anti-thesis is that the business
              remains capital-intensive and operationally opaque. Locus retains ownership of robots under the RaaS
              model, so growth may require equipment and support investment; Array's commercial value depends on
              production-grade manipulation reliability across irregular SKUs; and competitors offer dense storage,
              orchestration, or public-market scale. Without current unit economics, customer concentration, retention,
              cash burn, or preference terms, a high private-market multiple would leave limited margin for execution
              error.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV008
              - CV009
              - CV014
      - number: '8.3'
        title: Scenarios, entry discipline, and diligence
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis should be treated as a decision framework rather than a precise valuation output because
              the current price and fully diluted share count are not public in the assigned evidence. The base case is
              continued ARR growth and fleet expansion, but with a valuation haircut to the 2022 benchmark until margin,
              cash, and financing terms are verified. The bull case requires Array to expand workflows and preserve
              customer economics without disproportionate fleet capital. The bear case is a down-round or
              preference-heavy financing after slower commercialization, manipulation shortfalls, or multiple
              compression in warehouse robotics. Comparable evidence is directional only: Geekplus disclosed
              public-market proceeds and profitability metrics in its filing, while two dated Symbotic snapshots show
              materially different market capitalizations and a materially different scale. Before entry, obtain the
              current cap table and preference stack, financing documents, monthly cash burn and runway, ARR
              reconciliation to recognized revenue, gross margin by offering, retention and concentration cohorts, and
              Array pilot-to-production metrics.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV010
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Track pending price discovery
            body: >-
              Locus appears investable as an operating story, but public evidence does not support paying the last
              private benchmark without an opacity discount and primary diligence on capitalization, cash conversion,
              and Array commercialization.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV010
              - CV012
          - type: callout
            title: Reported marks are not a verified entry price
            body: >-
              The near-$2 billion Series F mark is from November 2022, while lower 2026 third-party signals remain
              unverified and the reported Series G did not disclose a company valuation.
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
              - CV005
          - type: callout
            title: Scenario outputs remain qualitative
            body: >-
              No assigned source provides a current fully diluted share count, preference stack, cash balance, or
              monthly burn; numerical valuation ranges would imply unsupported precision.
            calloutType: assumption
            claimRefs:
              - CV010
              - CV012
              - CV013
