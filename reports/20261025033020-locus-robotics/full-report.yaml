        title: Exhibits
        blocks:
          - type: callout
            title: Market growth is real but not a company-specific forecast
            body: >-
              Multiple publishers show double-digit AMR or warehouse-automation growth, but their market definitions
              diverge enough that the figures should frame scenario analysis rather than be treated as Locus revenue
