  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Locus's product stack links warehouse systems to orchestration, mobile execution, and newer autonomous
      manipulation.
    data:
      layers:
        - label: Enterprise workflow
          detail: Customer systems and warehouse operators supply orders, inventory context, and exception handling.
          modules:
            - WMS and order inputs
            - Warehouse operations
          items:
            - name: WMS and order inputs
              detail: Orders and inventory work enter the automation workflow through customer systems.
            - name: Warehouse operations
              detail: Supervisors and associates remain part of collaborative deployment and exception handling.
        - label: Orchestration
          detail: LocusONE decomposes work, coordinates the fleet, and exposes operating visibility.
          modules:
            - LocusONE
            - Integration APIs
          items:
            - name: LocusONE
              detail: Mission assignment, fleet coordination, task interleaving, and operational visibility.
            - name: Integration APIs
              detail: Connects the orchestration layer with warehouse management and automation systems.
        - label: Physical execution
          detail: Mobile robots transport inventory while Array adds perception and manipulation.
          modules:
            - Origin and Vector
            - Array and NeuraGrasp
          items:
            - name: Origin and Vector
              detail: Collaborative picking, transport, putaway, and heavier material movement.
            - name: Array and NeuraGrasp
              detail: >-
                Robots-to-Goods movement, perception, and autonomous manipulation; production breadth remains to be
                proven.
        - label: Site operations
          detail: Warehouse layout, charging, safety interaction, and exception workflows shape deployment outcomes.
          modules:
            - Facility map and charging
            - Human exception handling
          items:
            - name: Facility map and charging
              detail: Site layout and charging behavior are operational dependencies for fleet availability.
            - name: Human exception handling
              detail: Associates remain relevant where inventory or system conditions fall outside automation coverage.
        - label: Service delivery
          detail: Robots-as-a-Service packages hardware, software, maintenance, and support.
          modules:
            - RaaS subscription
            - Field support
          items:
            - name: RaaS subscription
              detail: >-
                Subscription structure shifts deployment from an outright equipment purchase toward an operating
                service.
            - name: Field support
              detail: >-
                Maintenance and support are part of the proposed operating model, but service-level terms are not
                public.
        - label: Evidence boundary
          detail: Public materials establish product direction but leave quantitative controls and repeatability open.
          modules:
            - Customer deployment evidence
            - Unverified controls
          items:
            - name: Customer deployment evidence
              detail: DHL is identified as an early-access live-operation customer for Array.
            - name: Unverified controls
              detail: Public sources do not establish security, safety certification, uptime, or SKU-level success rates.
    claimRefs:
      - CE002
      - CE003
      - CE005
      - CE006
      - CE007
      - CE010
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      Observed evidence supports a path from brownfield qualification through pilot, production scaling, workflow
      expansion, and multi-site rollout.
    data:
      items:
        - label: Brownfield qualification
          detail: >-
            Target existing fulfillment sites where reducing associate travel can improve throughput without a major
            redesign.
          touchpoints:
            - Operations assessment
            - WMS integration review
        - label: Focused pilot
          detail: HelloFresh began with 13 Origin robots for its Factor brand in July 2025.
          touchpoints:
            - Virtual testing
            - On-floor validation
        - label: Site-level scale
          detail: HelloFresh added 26 robots within three months, bringing the deployment to 39.
          touchpoints:
            - Fleet expansion
            - Two chilled picking lines
        - label: Workflow expansion
          detail: The HelloFresh deployment was associated with chilled SKU capacity increasing from 100 to 500.
          touchpoints:
            - Temperature-control modifications
            - Assortment expansion
        - label: Multi-site rollout
          detail: DHL operates thousands of Locus robots across more than 40 managed facilities.
          touchpoints:
            - Repeat site deployment
            - Global network operations
        - label: Account expansion
          detail: >-
            Sacra attributes growth to more robots, sites, and workflows inside existing enterprise accounts, but
            retention metrics remain undisclosed.
          touchpoints:
            - Additional robots
            - Additional workflows
            - Additional sites
    approximationNotes: >-
      Stages synthesize observed customer examples and a reported commercial mechanism; they do not represent a measured
      conversion funnel or imply conversion rates.
    claimRefs:
      - CU003
      - CU008
      - CU009
      - CU011
      - CU015
