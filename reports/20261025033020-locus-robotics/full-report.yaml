              - CI009
              - CI012
              - CI013
              - CI014
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Locus is private, and the assigned evidence does not provide a current balance sheet, cash balance,
              monthly burn, debt schedule, lease commitments, or runway. Third-party profiles disagree on current
              revenue and headcount, while historical financing amounts and valuations are not substitutes for cash
              available today. MGMT Boston reports a September 2026 Series G amount of $41.6 million and $457.6 million
              raised across eight rounds, whereas another profile reports a May 2026 Series F-1 financing of $12.04
              million at a $1.81 billion post-money valuation; these are third-party summaries and are not reconciled by
              a company filing in the pool. The capital question is therefore not whether Locus has raised capital, but
              whether retained cash and operating cash generation can fund robot inventory, global deployments, Array
              commercialization, and support before the next financing trigger. A financing dependency assessment
              requires management-provided cash, burn, debt, and forward capex data.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial case has positive operating signals but insufficient public evidence for a precise valuation
              or margin conclusion. Recurring RaaS monetization, cross-workflow expansion, and customer deployment
              evidence are constructive. However, analyst-reported ARR and revenue figures are not audited, realized
              pricing is not disclosed, and public sources do not establish gross margin, cash conversion, customer
              retention, or runway. The most decision-relevant next step is a cohort-level financial package tying robot
              count, site deployments, contracted monthly recurring revenue, implementation revenue, hardware cost,
              service cost, gross margin, churn, expansion, and cash burn together. Until that package is available, the
              appropriate stance is to treat revenue quality as plausible but unverified and capital adequacy as an
              underwriting blocker rather than infer a precise multiple from stale or conflicting third-party figures.
            claimRefs:
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Recurring model with expansion potential
            body: >-
              The RaaS structure and multi-workflow platform can support expansion within existing sites, but public
              sources do not quantify retention or realized pricing.
            calloutType: strength
            claimRefs:
              - CI001
              - CI005
              - CI006
          - type: callout
            title: Capital adequacy is not publicly underwritable
            body: >-
              Current cash, burn, debt, runway, gross margin, and revenue mix are unavailable or conflicting in the
              assigned evidence.
            calloutType: risk
            claimRefs:
              - CI009
              - CI012
              - CI013
              - CI014
          - type: callout
            title: Require a cohort-level financial package
            body: >-
              Before relying on a current valuation or financing runway, obtain contracted revenue, unit economics,
              working-capital needs, and cash-flow forecasts by customer and robot cohort.
            calloutType: recommendation
            claimRefs:
              - CI003
              - CI012
              - CI013
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Locus sells a warehouse-automation system rather than a standalone robot. The operating workflow starts
              with a warehouse management system sending orders and inventory work into LocusONE, which assigns missions
              to a mixed fleet and coordinates robots with human associates. Origin supports collaborative picking;
              Vector extends the fleet to heavier material movement; and Array is intended to execute picking, putaway,
              induction, slotting, and replenishment in the aisle. This is a meaningful workflow expansion from reducing
              picker walking to automating item manipulation. Logiwa describes integration with warehouse management
              software and Locus's three robot families, while Sacra describes LocusONE as the layer that ingests
              orders, breaks them into missions, routes work, and exposes operational dashboards. These descriptions
              support the workflow model, but partner and analyst material is not a substitute for customer-level
              implementation documentation or realized service levels.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE006
              - CE011
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE003
              - CE005
              - CE006
              - CE007
              - CE010
      - number: '5.2'
        title: Architecture, maturity, and differentiation
        blocks:
          - type: paragraph
            body: >-
              The architecture has three practical layers: warehouse-system integration and orchestration, autonomous
              mobile movement, and manipulation/perception for the newer Array product. The strongest differentiator is
              the attempt to add a mobile manipulation layer without requiring a facility redesign. Locus says Array is
              delivered as Robots-as-a-Service and can deploy in weeks; independent coverage describes a Robots-to-Goods
              model in which the robot goes to inventory rather than moving inventory to a fixed station. The Nexera
              acquisition adds NeuraGrasp grasping technology and expands the target item set, but integration into the
              commercial roadmap remains a maturity question: the acquisition announcement says integration follows the
              transaction and availability is expected in coming months. The product therefore looks commercially mature
              in collaborative AMRs and earlier-stage in autonomous manipulation.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE005
              - CE007
              - CE009
              - CE014
      - number: '5.3'
        title: Deployment, trust, and diligence risks
        blocks:
          - type: paragraph
            body: >-
              Deployment evidence is encouraging but mostly promotional or analyst-reported. DHL is identified as an
              early-access customer with Array in live operations, and Locus says its broader platform supports more
              than 150 brands across more than 350 sites; neither source provides a normalized uptime series,
              intervention rate, exception rate, or customer-by-customer production denominator. Public material also
              does not establish security architecture, vulnerability disclosure, privacy controls, formal safety
              certification, or incident history. The principal technical underwriting risk is the gap between a
              controlled deployment and robust handling of long-tail inventory: independent coverage explicitly flags
              irregular SKUs, per-unit economics, and WMS integration depth as unresolved. A buyer should request
              site-level acceptance criteria, SKU coverage and grasp-failure data, safety validation, cyber controls,
              service credits, and rollback procedures before treating Array claims as repeatable.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and production proof
        blocks:
          - type: paragraph
            body: >-
              Locus sells into operationally complex warehouses rather than a single narrow vertical. The available
              evidence places third-party logistics providers, retailers, e-commerce operators, healthcare distributors,
              industrial businesses, and food fulfillment among the served segments, with warehouse operations leaders
              as the likely operational buyers and pickers or material handlers as daily users. DHL is the strongest
              production reference: independent coverage reports that thousands of Locus robots operate in more than 40
              DHL-managed facilities and that the network completed its billionth pick in March 2026. Other named
              examples broaden the proof set but are less independently documented. Locus's own site reports healthcare
              outcomes at DHL, a 200% productivity increase for Carhartt, and multi-site pharmaceutical use at MSK
              Pharma. These are relevant operating signals, but their company-controlled presentation limits their value
              as independent validation. Public footprint summaries also use inconsistent labels such as brands,
              customers, deployments, and sites, preventing a clean current customer-count conclusion.
            claimRefs:
              - CU001
              - CU003
              - CU005
              - CU006
