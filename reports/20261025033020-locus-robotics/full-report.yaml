    columns:
      - Scenario
      - Operating assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Array reaches reliable production deployment; existing accounts expand workflows; ARR growth persists.
        - A premium to the 2022 benchmark could be justified only after current terms and margins support it.
        - Possible, but evidence incomplete.
        - Array intervention or pick-success metrics fail production thresholds.
      - - Base
        - Core AMR/RaaS business grows; Array contributes selectively; financing remains private and opaque.
        - >-
          Treat the reported $1.35B-$1.81B signals only as a screening band and require a discount until capitalization
          and cash conversion are verified.
        - Most defensible public-evidence case.
        - ARR growth does not translate into improving contribution margin or runway.
      - - Bear
        - Commercialization slows, fleet investment rises, or private-market multiples compress.
        - Down-round, preference overhang, or materially lower common-equity value becomes plausible.
        - Material risk, not quantified.
        - New financing is below the 2022 mark or includes punitive preferences.
      - - Entry discipline
        - No current price, diluted share count, or preference stack is disclosed in assigned evidence.
        - No precise target return or per-share valuation should be issued.
        - Required condition.
        - Investment committee cannot obtain financing documents.
      - - Exit readiness
        - Public comparables exist, but Locus has no evidenced IPO timing or audited public-company disclosure here.
        - Treat exit as optional rather than a modeled near-term liquidity event.
        - Low confidence.
        - No credible path to audited scale, margins, and governance readiness.
