          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI013
      - number: '4.2'
        title: Traction proxies and cost drivers
        blocks:
          - type: paragraph
            body: >-
              The strongest current traction evidence is operational rather than accounting-based. A company-issued
              October 2026 release reports more than 150 customers, more than 360 sites, a fleet above 22,000 robots,
              and more than 8.5 billion picks; Supply Chain Dive independently reports a HelloFresh deployment that
              expanded from 13 to 39 Origin robots and from 100 to 500 chilled SKUs. These observations support
              deployment breadth and a plausible land-and- expand motion, but they do not reveal contract value,
              utilization, contribution margin, or customer concentration. Cost drivers likely include robot
              manufacturing or procurement, field maintenance, charging and replacement hardware, deployment labor,
              cloud/software operations, and support; the public sources do not quantify those categories. The chilled
              deployment also shows that service-delivery engineering, such as heated motors and charging modifications,
              can create customer-specific cost and reliability requirements.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
