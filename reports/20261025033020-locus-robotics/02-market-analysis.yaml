company:
  name: Locus Robotics
chapter:
  number: 2
  title: Market Analysis
  summary: Locus Robotics participates in the broader warehouse-automation and autonomous-mobile-robot markets, with a narrower beachhead in flexible fulfillment AMRs and orchestration software. Public estimates disagree materially on market boundaries and totals, so the investable opportunity is better framed through multiple sizing lenses and buyer adoption constraints than through a single TAM.
sections:
  - id: market-boundary
    title: Market boundary and demand context
    body: >-
      The relevant market is warehouse and fulfillment automation spending that
      combines mobile robots, fleet orchestration, integration, and operating
      services. It includes collaborative picking, replenishment, transport,
      sorting, and adjacent autonomous fulfillment where a warehouse operator
      pays to move or process inventory. It excludes consumer robotics, drones,
      fixed automation unrelated to warehouse execution, and broad enterprise
      software not connected to physical material flow. This boundary matters
      because published estimates count different mixes of hardware, software,
      implementation, and services.       The U.S. Census Bureau estimated $340.2 billion of seasonally adjusted
      retail e-commerce sales in Q2 2026, up 12.2% year over year, while
      e-commerce was 17.1% of total retail sales.
      That is a demand-environment indicator, not an automation TAM. For Locus,
      the practical status quo is human travel and picking supported by existing
      WMS processes, while fixed goods-to-person systems and other AMRs are
      substitutes with different capital and flexibility trade-offs.
    claimRefs: [CM001, CM002, CM003, CM004, CM015]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and valuation relevance
    body: >-
      Three lenses show why a single headline market number would overstate
      precision. Grand View Research estimates the global AMR market at $5.5
      billion in 2026 and $14.0 billion in 2033, a 14.4% CAGR; its goods-to-
      person picking-robot segment held 48.3% of 2025 market share. MarketsandMarkets
      reports a narrower $2.75 billion 2026 AMR base and $7.07 billion in 2032
      at the same 14.4% CAGR, with logistics/3PL forecast to grow at 16.7%.
      Mordor Intelligence places the broader warehouse-automation market at
      $34.17 billion in 2026 and $76.22 billion in 2032, including equipment,
      control software, implementation, and operating services. These are not
      interchangeable TAM, SAM, and SOM figures: they use different scopes,
      geographies, and forecast methods. The defensible conclusion is that
      Locus has exposure to a growing AMR and warehouse-automation spend pool,
      but public evidence does not isolate the serviceable share reachable by
      Locus or convert market growth into company revenue.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-adoption
    title: Buyer segments, adoption path, and constraints
    body: >-
      Locus sells into enterprise operators whose budget is tied to warehouse
      throughput, labor availability, and peak-season flexibility. Retail and
      e-commerce operators are the clearest demand pool: Mordor estimates they
      represented 28.29% of warehouse-automation revenue in 2026, while
      third-party logistics and contract warehouses represented 39.11%.
      MarketsandMarkets identifies logistics/3PL as the fastest-growing AMR
      industry segment in its forecast. The adoption path is usually a site
      deployment integrated with an existing WMS, followed by fleet expansion,
      additional workflows, or additional buildings. RaaS can lower upfront
      ownership commitment, but integration, change management, safety,
      reliability, and variable order volumes remain gating issues. Polaris
      explicitly identifies deployment cost across hardware, software,
      navigation, and facility integration as a primary growth challenge,
      especially for smaller companies. Thus the budget case is strongest for
      large, labor-exposed operators and 3PLs; the main valuation risk is
      assuming that broad warehouse spending converts quickly into repeatable
      Locus deployments.
    claimRefs: [CM010, CM011, CM012, CM013, CM014]
    tableRefs: [TM003]
callouts:
  - calloutType: insight
    title: Market growth is real but not a company-specific forecast
    body: Multiple publishers show double-digit AMR or warehouse-automation growth, but their market definitions diverge enough that the figures should frame scenario analysis rather than be treated as Locus revenue guidance.
    claimRefs: [CM005, CM006, CM007]
  - calloutType: risk
    title: Deployment friction can delay conversion
    body: Integration cost, facility constraints, labor economics, and reliability determine whether a market opportunity becomes a funded deployment; public sources do not disclose Locus conversion, retention, or payback cohorts.
    claimRefs: [CM013, CM014]
