company:
  name: Locus Robotics
chapter:
  number: 4
  title: Financials
  summary: Locus appears to monetize warehouse automation primarily through a recurring Robots-as-a-Service model, with evidence of expanding enterprise deployments and workflow coverage. Public evidence does not yet establish current cash, burn, gross margin, realized pricing, revenue mix, or runway, so the financial underwriting case remains dependent on private diligence.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Locus describes a Robots-as-a-Service model that combines robots, orchestration software,
      support, and continuous optimization rather than a one-time equipment sale. Its official
      materials say customers can begin with one workflow and expand across facilities, regions,
      and functions through the same connected ecosystem. An independent Sacra analysis describes
      the commercial structure as approximately $2,000 per robot per month all-in, but that is an
      analyst estimate rather than a published price sheet or contract sample. This distinction
      matters: list or estimated monthly pricing is not realized revenue, and neither source
      discloses discounts, implementation fees, renewal terms, hardware depreciation, or the
      split between subscription, services, and equipment. The revenue mechanism is therefore
      directionally clear while revenue quality and unit economics remain only partially observable.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-cost-drivers
    title: Traction proxies and cost drivers
    body: >-
      The strongest current traction evidence is operational rather than accounting-based. A
      company-issued October 2026 release reports more than 150 customers, more than 360 sites,
      a fleet above 22,000 robots, and more than 8.5 billion picks; Supply Chain Dive independently
      reports a HelloFresh deployment that expanded from 13 to 39 Origin robots and from 100 to
      500 chilled SKUs. These observations support deployment breadth and a plausible land-and-
      expand motion, but they do not reveal contract value, utilization, contribution margin, or
      customer concentration. Cost drivers likely include robot manufacturing or procurement,
      field maintenance, charging and replacement hardware, deployment labor, cloud/software
      operations, and support; the public sources do not quantify those categories. The chilled
      deployment also shows that service-delivery engineering, such as heated motors and charging
      modifications, can create customer-specific cost and reliability requirements.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and financing dependency
    body: >-
      Locus is private, and the assigned evidence does not provide a current balance sheet,
      cash balance, monthly burn, debt schedule, lease commitments, or runway. Third-party
      profiles disagree on current revenue and headcount, while historical financing amounts and
      valuations are not substitutes for cash available today. MGMT Boston reports a September
      2026 Series G amount of $41.6 million and $457.6 million raised across eight rounds, whereas
      another profile reports a May 2026 Series F-1 financing of $12.04 million at a $1.81 billion
      post-money valuation; these are third-party summaries and are not reconciled by a company
      filing in the pool. The capital question is therefore not whether Locus has raised capital,
      but whether retained cash and operating cash generation can fund robot inventory, global
      deployments, Array commercialization, and support before the next financing trigger. A
      financing dependency assessment requires management-provided cash, burn, debt, and forward
      capex data.
    claimRefs: [CI009, CI010, CI011, CI012]
  - id: financial-verdict
    title: Underwriting verdict and diligence blockers
    body: >-
      The financial case has positive operating signals but insufficient public evidence for a
      precise valuation or margin conclusion. Recurring RaaS monetization, cross-workflow
      expansion, and customer deployment evidence are constructive. However, analyst-reported
      ARR and revenue figures are not audited, realized pricing is not disclosed, and public
      sources do not establish gross margin, cash conversion, customer retention, or runway.
      The most decision-relevant next step is a cohort-level financial package tying robot count,
      site deployments, contracted monthly recurring revenue, implementation revenue, hardware
      cost, service cost, gross margin, churn, expansion, and cash burn together. Until that
      package is available, the appropriate stance is to treat revenue quality as plausible but
      unverified and capital adequacy as an underwriting blocker rather than infer a precise
      multiple from stale or conflicting third-party figures.
    claimRefs: [CI013, CI014]

tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Current value or status, Quality, Diligence ask]
    rows:
      - [RaaS subscription, "Monthly per-robot service covering hardware/software/support", "Company describes RaaS; analyst estimate is about $2,000 per robot per month", "Company model plus independent estimate; realized price unknown", "Obtain contracted and realized ARR by cohort, including discounts and renewals"]
      - [Software/orchestration, "LocusONE coordinates robots, people, inventory, and tasks", "Included in the connected platform; standalone price not disclosed", "Official product description; mix unknown", "Separate software revenue, attach rate, and gross margin from hardware and services"]
      - [Deployment and integration, "Site implementation, WMS/ERP integration, and workflow configuration", "Required for enterprise deployments; fees not disclosed", "Operationally plausible; public contract evidence absent", "Provide implementation revenue, implementation labor, and time-to-live by site"]
      - [Support and optimization, "Maintenance, support, and continuous optimization under RaaS", "Included in the described customer journey; cost and margin not disclosed", "Company-described service component", "Provide support cost per robot/site, uptime obligations, and renewal economics"]
    notes: "Sources distinguish a company-described RaaS model from an independent pricing estimate; no public contract or realized-revenue schedule was available."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization visibility
    columns: [Metric, Value or status, Basis, Confidence, Underwriting implication]
    rows:
      - [Estimated all-in robot fee, "$2,000 per robot per month", "Sacra analyst estimate", "medium", "Supports recurring-revenue framing but is not a verified list or realized price"]
      - [Discounting and minimum commitments, null, "Not disclosed in assigned sources", "low", "Could materially change ARR quality and payback"]
      - [Hardware ownership, "Locus retains/operates robots under RaaS description", "Sacra analysis and official RaaS materials", "medium", "Creates working-capital, refurbishment, and asset-utilization exposure"]
      - [Revenue recognition, null, "No audited financial statements or accounting policy in pool", "low", "Cannot distinguish subscription, equipment, implementation, and services revenue"]
    notes: "Null means the assigned public evidence did not disclose the item; the analyst estimate is not treated as realized revenue."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Current ARR, null, "low", "ARR is central to recurring-revenue valuation but public estimates conflict and are unaudited", "Provide monthly recurring revenue bridge by cohort and contract type"]
      - [Gross margin, null, "low", "Robot hardware, deployment, maintenance, and cold-storage modifications can change margin materially", "Provide gross margin by hardware, software, support, and implementation"]
      - [CAC or payback, null, "low", "Enterprise sales and integration cycles determine capital velocity", "Provide sales-cycle length, fully loaded CAC, payback, and channel economics"]
      - ["Cash balance, burn, and runway", null, "low", "Determines financing dependency and downside resilience", "Provide latest cash, monthly burn, debt/leases, capex, and base/downside runway"]
      - ["Customer concentration and retention", null, "low", "Large 3PL and retail accounts can create concentration and expansion risk", "Provide top-customer share, gross retention, net retention, and site expansion cohorts"]
      - ["Robot utilization and service cost", null, "low", "RaaS economics depend on productive deployment and field-support intensity", "Provide utilization, intervention, uptime, maintenance, and refurbishment data"]
    notes: "Every null is an explicit public-data gap, not a zero or an estimate; the diligence asks are required to underwrite unit economics."
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI012, CI013, CI014]

