        - [recurring-contract, service-delivery]
        - [service-delivery, financial-output]
    claimRefs: [CI001, CI002, CI003, CI013]

callouts:
  - calloutType: strength
    title: Recurring model with expansion potential
    body: The RaaS structure and multi-workflow platform can support expansion within existing sites, but public sources do not quantify retention or realized pricing.
    claimRefs: [CI001, CI005, CI006]
  - calloutType: risk
    title: Capital adequacy is not publicly underwritable
    body: Current cash, burn, debt, runway, gross margin, and revenue mix are unavailable or conflicting in the assigned evidence.
    claimRefs: [CI009, CI012, CI013, CI014]
  - calloutType: recommendation
    title: Require a cohort-level financial package
    body: Before relying on a current valuation or financing runway, obtain contracted revenue, unit economics, working-capital needs, and cash-flow forecasts by customer and robot cohort.
    claimRefs: [CI003, CI012, CI013, CI014]

