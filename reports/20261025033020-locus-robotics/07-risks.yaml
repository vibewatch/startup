callouts:
  - calloutType: risk
    title: Array is the monitorable thesis-break test
    body: >-
      The next proof point is not another launch announcement; it is sustained DHL production
      performance followed by repeat deployments with disclosed pick success, intervention,
      uptime, and unit-economics evidence.
    claimRefs: [CR010, CR016]
