company:
  name: Locus Robotics
chapter:
  number: 7
  title: Risks
  summary: >-
    Locus's highest residual risks are Array commercialization, RaaS fleet economics,
    financing opacity, and the absence of primary legal, safety, and security records in
    the assigned evidence. The installed base and initial DHL deployment are meaningful
    mitigants, but they do not establish manipulation reliability, customer concentration,
    liquidity, or incident history.
sections:
  - id: ranked-risk-view
    title: Ranked risks and investment implications
    body: >-
      Array commercialization is the leading execution risk because the available record
      establishes two pilots and a first DHL delivery, not repeatable production performance
      across many sites and SKU families. The product also incorporates Nexera's NeuraGrasp
      technology, making acquisition integration part of the same risk. Financing is the
      second-ranked exposure: trade coverage reports a $41.6 million Series G from existing
      backers and says the round remained open, while an adverse analysis reports an implied
      valuation below the 2022 mark. Those statements describe capital raised, not cash
      available or runway. RaaS fleet ownership, enterprise integrations, and customer
      concentration complete the top tier because Locus bears ongoing hardware and service
      obligations while the public pool does not disclose contribution margin, fleet
      utilization, or account concentration. Investment should remain conditional on
      production Array metrics and a management-reconciled liquidity package.
    claimRefs: [CR001, CR002, CR004, CR005, CR010, CR011, CR016]
    figureRefs: [FR001]
  - id: legal-regulatory-exposure
    title: Legal, regulatory, safety, and security exposure
    body: >-
      The assigned pool does not contain primary regulator, court, recall, incident, privacy,
      or security records for Locus. That absence is an evidence limit, not proof of a clean
      history. A compiled investor tear sheet lists a January 2025 announcement that Vector
      received CE certification, but it does not establish the certification scope, current
      status, or applicability to Array. Company executives describe localization, obstacle
      avoidance, charging optimization, cloud-native infrastructure, and interaction with
      other material-handling equipment; each capability increases the importance of
      validated change control, human-robot safety testing, access controls, and outage
      procedures. Before underwriting lower residual risk, diligence should obtain current
      product certificates, technical files, incident and near-miss logs, product-liability
      coverage, litigation schedules, DPAs, subprocessors, security audits, and breach
      history for every material jurisdiction.
    claimRefs: [CR008, CR009, CR012, CR013]
    tableRefs: [TR001]
  - id: operational-quality-exposure
    title: Operational and quality failure modes
    body: >-
      Locus has evidence of operating scale, but scale broadens the surface that must work
      reliably. The official newsroom reports more than 150 customers across more than 360
      sites, while a company executive described more than 15,000 AMRs and said customer
      environments differ by workflow, infrastructure, and labor conditions. Another
      company interview says some fleets triple for peak season and that LocusONE integrates
      with more than 75 ecosystem partners. These claims support a mature deployment motion,
      but also identify failure modes: site-specific commissioning errors, integration
      outages, peak logistics bottlenecks, battery or parts constraints, and uneven field
      service. For Array, the decisive indicators are pick success by SKU class, intervention
      rate, uptime, damage rate, labor substitution, and conversion from pilot to repeat
      production orders. A missed go-live or failure to expand beyond the first sites would
      weaken the platform-extension thesis.
    claimRefs: [CR006, CR007, CR008, CR009, CR010, CR011, CR016]
    tableRefs: [TR002]
  - id: financial-partner-exposure
    title: Financial model and dependency exposure
    body: >-
      Public financial profiles are not directly comparable. Sacra estimates $180 million
      of ARR in June 2026, whereas MGMT Boston lists $110 million of revenue without a stated
      period; ARR is not revenue, and neither figure supplies gross margin or cash burn.
      Clay's April 2025 financing profile is historical, while newer trade coverage describes
      a $41.6 million Series G that remained open. Locus's RaaS model can reduce customer
      capex, but Sacra says Locus retains ownership and can refurbish and redeploy robots,
      leaving the vendor exposed to hardware funding, utilization, residual values,
      maintenance, and seasonal logistics. Partner concentration is likewise undisclosed:
      DHL is the first reported Array deployment, Nexera supplies acquired manipulation
      technology, and more than 75 ecosystem integrations expand the operating dependency
      graph. The kill criteria are a runway shortfall, negative per-robot contribution
      economics, repeated Array exceptions, or material customer and partner concentration
      without contractual protection.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR009, CR010, CR011, CR014, CR015]
    tableRefs: [TR003]
