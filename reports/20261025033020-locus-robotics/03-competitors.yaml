      - [6 River Systems / Ocado, "Collaborative AMR peer / broader automation platform", "Human-assist picking with an expansion path into denser automation", "Independent analysis describes overlap in fast deployment, cloud orchestration, and brownfield compatibility", "Current commercial scale and pricing for the combined offering are not evidenced"]
      - [GreyOrange, "Software-neutral orchestration competitor", "Control heterogeneous automation estates", "Vendor-agnostic orchestration directly challenges a single-OEM control-plane pitch", "Evidence in the assigned pool does not quantify deployment or customer outcomes"]
      - [Exotec and AutoStore, "Dense goods-to-person / ASRS alternatives", "High-density storage and workstation throughput", "They compete on storage density and fixed-system throughput rather than flexible AMR deployment", "Facility changes, capex, and site fit can raise adoption friction"]
      - [Manual operations, "Status quo substitute", "Human picking, putaway, and replenishment", "No new integration or robot capital is required", "Labor availability, walking time, throughput, and safety remain exposed"]
      - [Internal build, "Customer-built alternative", "Custom orchestration and automation for very large operators", "Can optimize for site-specific workflows and existing engineering capability", "Requires software, robotics, service, and ongoing integration resources"]
    notes: "Sources: PRNewswire, Sacra, Jared Watkins, Zebra/BusinessWire, and Locus glossary; competitor coverage is partial and qualitative, and unknown cells identify missing comparable evidence."
    claimRefs: [CP001, CP003, CP005, CP006, CP008]
  - id: TP002
    title: Feature / capability matrix
    columns: [Buying criterion, Locus Robotics, Collaborative AMR peers, Dense systems or incumbents, Evidence implication]
    rows:
      - [Brownfield deployment, "Designed to integrate with existing WMS; Array is described as deploying in weeks", "Fetch claimed no facility or infrastructure changes; peer terms vary", "Fixed AS/RS can require building and infrastructure changes", "Deployment duration and change-order data are needed"]
      - [Fleet orchestration, "LocusONE coordinates multiple form factors and real-time task allocation", "FetchCore and other platforms also provide cloud workflow software", "Dense systems typically coordinate their own installed architecture", "Software breadth is differentiating only if independently measured"]
      - [Workflow breadth, "Picking, putaway, replenishment, transport, counting, and newer Array workflows", "Collaborative peers emphasize movement and picking", "Dense systems emphasize storage, retrieval, and workstation flow", "Capability labels are not equivalent to production performance"]
      - [Storage density, "Flexible aisle deployment; Array claims higher density in existing layouts", "Brownfield AMRs preserve layout flexibility", "Exotec and AutoStore compete directly on density", "Compare usable cube, throughput, and building modification together"]
      - [Human dependence, "Origin remains collaborative; Array is presented as autonomous", "Most collaborative AMR workflows retain human picking", "Goods-to-person moves work to stations but still needs labor", "Measure interventions, exception handling, and staffing rather than labels"]
      - [Integration surface, "WMS integration and real-time dashboards are explicitly described", "Fetch offered integration with warehouse and manufacturing systems", "Incumbents can bundle broader enterprise workflows", "API scope, implementation time, and support ownership are open"]
      - [Commercial model, "All-inclusive RaaS", "Model varies by vendor and is not evidenced for each peer", "Fixed systems often require larger project commitments", "Contract terms and total cost of ownership are not public"]
      - [Trust and scale proof, "Company cites 250+ sites in its LocusONE release; third parties cite large DHL deployments", "Fetch materials cite global deployments but not a Locus-comparable benchmark", "Incumbents have enterprise distribution and installed bases", "Customer references, uptime, and repeat deployments need independent verification"]
    notes: "This matrix preserves unknowns instead of inferring parity; source evidence describes capabilities and positioning, not a controlled benchmark across vendors."
    claimRefs: [CP002, CP004, CP005, CP006, CP007, CP009, CP012]
  - id: TP003
    title: Pricing / packaging comparison
    columns: [Alternative, Price or contract model, Included capabilities, Known limitation, Buyer implication]
    rows:
      - [Locus RaaS, "All-inclusive RaaS; analyst estimate of about $2,000 per robot per month", "Hardware, software, maintenance, and support are described as bundled", "Estimate is not a published list price and realized discounts are unknown", "Evaluate payback, renewal, redeployment, and minimum commitments"]
      - [Locus Array, "RaaS described; contract economics not disclosed", "Autonomous picking and multiple workflows with LocusONE", "Early-access deployments do not prove mature reliability", "Require pilot acceptance criteria and intervention reporting"]
      - [Fixed AS/RS, "Project-based capital equipment; price not supplied", "High-density storage and retrieval", "Upfront capex, building requirements, and limited flexibility are cited restraints", "Best fit may be stable, high-volume sites with long planning horizons"]
      - [Manual labor, "Operating expense through wages and supervision", "Flexible across exceptions and changing workflows", "Labor shortage, wage exposure, walking, and safety costs remain", "Status quo may win when volume or capital budget is low"]
      - [Internal build, "Internal capex and engineering/service expense", "Site-specific control and workflow customization", "Requires sustained technical and operational ownership", "Large operators can trade vendor margin for execution burden"]
      - [Software-neutral orchestration, "Commercial terms not evidenced", "Potential to coordinate heterogeneous automation", "No assigned-pool benchmark of implementation or outcomes", "Could reduce OEM lock-in if integration quality is proven"]
    notes: "No public like-for-like price schedule was retained for competing vendors; null or qualitative entries are intentional gaps, not zero prices."
    claimRefs: [CP010, CP011, CP012, CP013, CP014]
