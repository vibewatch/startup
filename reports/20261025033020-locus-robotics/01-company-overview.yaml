    title: Operating proof is visible
    body: "The combination of the company's reported 360-plus sites and 8B-plus picks with DHL's independently reported billion-pick milestone supports meaningful deployment scale, even though current fleet and pick totals are not fully reconciled across sources."
    claimRefs: [CO013, CO014]
  - calloutType: risk
    title: Capital and scale metrics need reconciliation
