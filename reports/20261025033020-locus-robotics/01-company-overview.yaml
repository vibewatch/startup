company:
  name: Locus Robotics
chapter:
  number: 1
  title: Company Overview
  summary: Locus Robotics is a Wilmington, Massachusetts private warehouse-automation company combining autonomous mobile robots with LocusONE orchestration software and a Robots-as-a-Service model. Public evidence supports substantial operating scale and a 2026 Series G report, but funding, valuation, revenue, and headcount figures vary by source and require explicit qualification.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Locus Robotics is consistently identified as a private warehouse-automation company founded in 2014 and headquartered in Wilmington, Massachusetts (C001, C003). Its product is not only a robot: the company describes a unified platform of intelligent robots, LocusONE orchestration, integrations, deployment, and support delivered through Robots-as-a-Service (C004, C005). GlobalData independently describes warehouse-control and warehouse-management integration, while the company site states that its API has connected to more than 65 WMS/ERP systems (C006). That combination points to an integration-led operating model in which software, deployment capability, and recurring service are strategically important alongside hardware. The model also creates diligence questions around retained-asset ownership, service economics, and implementation capacity that are not answered by public disclosures.
    claimRefs: [CO001, CO003, CO004, CO005, CO006]
    tableRefs: [TO001]
  - id: leadership-and-stakeholders
    title: Leadership, governance, and stakeholder map
    body: >-
      Publicly available leadership evidence identifies Rick Faulk as chief executive officer, Mike Johnson as president and chief operating officer, Dustin Pederson as chief financial officer, and Sean Johnson as chief technology officer (C007). Tracxn identifies Bruce Welty as the founder; this distinction matters for key-person and founder-market-fit assessment (C009). Investor evidence is broader than a simple cap-table list: reported backers include Tiger Global, Goldman Sachs Asset Management, G2 Venture Partners, Scale Venture Partners, Zebra-related investors, and others (C011). DHL is documented separately as a major commercial deployment partner in the stakeholder table. The current board composition, voting control, preference stack, and any secondary activity remain insufficiently disclosed.
    claimRefs: [CO007, CO009, CO011]
    tableRefs: [TO002, TO003]
  - id: scale-funding-and-milestones
    title: Scale, funding, and milestone record
    body: >-
      Operating-scale claims are strong but not perfectly aligned across sources. The company site currently states 360-plus sites, more than 22,000 robots deployed, operations in more than 20 countries, and more than 8 billion picks, while a March 2026 independent report describes a one-billion-pick DHL milestone and more than 40 DHL-managed facilities (C013, C014). Funding figures also differ: a 2026 trade report describes a $41.6 million Series G, MGMT Boston reports $457.6 million across eight rounds, Clay reports $416 million through the 2022 Series F, and Sacra reports $432.82 million in disclosed primary equity funding (C015, C016, C017, C018). These are not interchangeable: some may reflect different cutoff dates, round definitions, or inclusion of extensions. The latest public valuation benchmark remains the close-to-$2 billion Series F figure reported for November 2022; no current fully diluted valuation or cap table is established here (C019, C020). Locus also announced the Nexera acquisition, but terms were undisclosed (C021).
    claimRefs: [CO013, CO014, CO015, CO016, CO017, CO018, CO019, CO021]
    figureRefs: [FO001]
