figures:
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: "Observed evidence supports a path from brownfield qualification through pilot, production scaling, workflow expansion, and multi-site rollout."
    data:
      items:
        - label: Brownfield qualification
          detail: "Target existing fulfillment sites where reducing associate travel can improve throughput without a major redesign."
          touchpoints: ["Operations assessment", "WMS integration review"]
        - label: Focused pilot
          detail: "HelloFresh began with 13 Origin robots for its Factor brand in July 2025."
          touchpoints: ["Virtual testing", "On-floor validation"]
        - label: Site-level scale
          detail: "HelloFresh added 26 robots within three months, bringing the deployment to 39."
          touchpoints: ["Fleet expansion", "Two chilled picking lines"]
        - label: Workflow expansion
          detail: "The HelloFresh deployment was associated with chilled SKU capacity increasing from 100 to 500."
          touchpoints: ["Temperature-control modifications", "Assortment expansion"]
        - label: Multi-site rollout
          detail: "DHL operates thousands of Locus robots across more than 40 managed facilities."
          touchpoints: ["Repeat site deployment", "Global network operations"]
        - label: Account expansion
          detail: "Sacra attributes growth to more robots, sites, and workflows inside existing enterprise accounts, but retention metrics remain undisclosed."
          touchpoints: ["Additional robots", "Additional workflows", "Additional sites"]
    approximationNotes: "Stages synthesize observed customer examples and a reported commercial mechanism; they do not represent a measured conversion funnel or imply conversion rates."
    claimRefs: [CU003, CU008, CU009, CU011, CU015]
callouts:
  - calloutType: strength
    title: Production evidence exceeds logo-level proof
    body: >-
      DHL's billion-pick milestone and more than 40 facilities, together with HelloFresh's
      documented 13-to-39 robot expansion, show repeat use and production scale rather than
      isolated pilots.
    claimRefs: [CU003, CU008]
  - calloutType: risk
    title: Retention and concentration remain unquantified
    body: >-
      Public deployment scale does not reveal gross retention, net retention, contract duration,
      customer-level revenue, or top-account exposure.
    claimRefs: [CU013, CU014]
