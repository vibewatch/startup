      - [Carhartt via DHL, "Retail and apparel", "Wholesale, retail, e-commerce, and returns fulfillment", Production, "Company reports 200% productivity increase and 110,000 units on one peak day", "Outcome is company-controlled and not independently validated in the reviewed pool"]
