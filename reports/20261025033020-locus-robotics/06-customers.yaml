company:
  name: Locus Robotics
chapter:
  number: 6
  title: Customers
  summary: >-
    Locus has credible production adoption in enterprise logistics, led by DHL's billion-pick
    milestone and more than 40 facilities, while HelloFresh provides unusually concrete evidence
    of a 13-robot pilot expanding to 39 robots and five times the chilled SKU capacity. Public
    evidence does not disclose retention, renewal, or customer-concentration metrics, so adoption
    scale should not be mistaken for proven revenue durability.
sections:
  - id: customer-base-and-production-proof
    title: Customer base and production proof
    body: >-
      Locus sells into operationally complex warehouses rather than a single narrow vertical.
      The available evidence places third-party logistics providers, retailers, e-commerce
      operators, healthcare distributors, industrial businesses, and food fulfillment among the
      served segments, with warehouse operations leaders as the likely operational buyers and
      pickers or material handlers as daily users. DHL is the strongest production reference:
      independent coverage reports that thousands of Locus robots operate in more than 40
      DHL-managed facilities and that the network completed its billionth pick in March 2026.
      Other named examples broaden the proof set but are less independently documented. Locus's
      own site reports healthcare outcomes at DHL, a 200% productivity increase for Carhartt, and
      multi-site pharmaceutical use at MSK Pharma. These are relevant operating signals, but their
      company-controlled presentation limits their value as independent validation. Public
      footprint summaries also use inconsistent labels such as brands, customers, deployments,
      and sites, preventing a clean current customer-count conclusion.
    claimRefs: [CU001, CU003, CU005, CU006, CU007, CU012, CU013]
    tableRefs: [TU001, TU003]
  - id: adoption-trajectory-and-outcomes
    title: Adoption trajectory and measurable outcomes
    body: >-
      HelloFresh offers the clearest pilot-to-expansion sequence in the reviewed evidence. Its
      Factor operation began with 13 Locus Origin robots in July 2025, then added 26 robots within
      three months for a total fleet of 39. Two independent trade publications report an average
      mission time of three minutes and 36 seconds from induction to box drop-off, and a chilled
      assortment expansion from 100 to 500 SKUs. Supply Chain Dive also reports that the deployment
      supports about 12,000 square feet and two meal-kit picking lines. This evidence demonstrates
      a real production expansion tied to a customer operating outcome rather than a logo or an
      unquantified testimonial. DHL provides a second form of durability evidence through repeat
      deployment across many facilities and a billion cumulative picks. However, units picked,
      sites, robot counts, and SKU capacity are different measures with different denominators;
      they should not be combined into a single growth rate or customer funnel.
    claimRefs: [CU002, CU003, CU004, CU008, CU009, CU010]
    tableRefs: [TU002]
  - id: durability-expansion-and-concentration
    title: Durability, expansion, and concentration
    body: >-
      The commercial model appears designed for land-and-expand: a partner profile describes a
      Robots-as-a-Service structure that lets customers adjust fleet capacity, while Sacra
      attributes growth to larger fleets, additional workflows, and new sites inside existing
      enterprise accounts. DHL and HelloFresh make that mechanism plausible in practice.
      Nevertheless, no reviewed source provides gross retention, net retention, churn, renewal
      rates, contract terms, cohort behavior, or revenue concentration. The evidence therefore
      supports operational expansion, not quantified recurring-revenue durability. An independent
      research profile also reports 2023 and 2024 layoffs and customer deployment pauses after
      pandemic-era e-commerce volumes normalized. That source is explicitly best-effort and should
      not be treated as definitive, but it is a useful adverse signal that demand can pause even
      when large reference deployments remain intact. Investment diligence should obtain
      customer-level recurring revenue, renewal history, fleet changes, and top-account exposure
      before assigning a retention premium.
    claimRefs: [CU011, CU014, CU015]
    figureRefs: [FU001]
