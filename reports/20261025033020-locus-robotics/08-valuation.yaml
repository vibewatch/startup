company:
  name: Locus Robotics
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports a scaled warehouse-automation platform with recurring-revenue characteristics,
    but it does not establish a current fully diluted valuation, cap table, cash position, or profitability.
    The appropriate stance is research-more: third-party 2026 valuation signals of approximately $1.35
    billion and $1.81 billion sit below the 2022 near-$2 billion benchmark, but none is a verified current
    entry price.
sections:
  - id: investment-call
    title: Investment call
    body: >-
      Locus has a credible scale-and-expansion thesis: Sacra estimates $180 million of ARR in June 2026,
      up from $165 million at the end of 2025, while the company has expanded from collaborative AMR
      picking toward Array autonomous fulfillment. The financing record is substantial, but the latest
      company-announced valuation remains the near-$2 billion Series F mark from November 2022. Third-party
      sources report lower 2026 signals of approximately $1.81 billion and $1.35 billion, but the $41.6
      million Series G remained open and had no company-disclosed valuation. That combination supports a
      positive operating thesis but not a buy recommendation at an unknown price: the decision is highly
      sensitive to the preferred stack, dilution, cash needs, and whether ARR converts into durable gross
      profit after fleet ownership and support costs.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-antithesis
    title: Thesis and anti-thesis
    body: >-
      The bull case is a land-and-expand warehouse platform: LocusONE coordinates robots and workers,
      the RaaS model converts customer adoption into recurring fees, and Array plus Nexera-derived
      grasping could expand the addressable workflows within existing buildings. Public evidence also
      shows meaningful customer and deployment scale, although the numbers differ by source and period.
      The anti-thesis is that the business remains capital-intensive and operationally opaque. Locus
      retains ownership of robots under the RaaS model, so growth may require equipment and support
      investment; Array's commercial value depends on production-grade manipulation reliability across
      irregular SKUs; and competitors offer dense storage, orchestration, or public-market scale.
      Without current unit economics, customer concentration, retention, cash burn, or preference terms,
      a high private-market multiple would leave limited margin for execution error.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV011]
    tableRefs: [TV002]
  - id: scenarios-and-diligence
    title: Scenarios, entry discipline, and diligence
    body: >-
      Scenario analysis should be treated as a decision framework rather than a precise valuation
      output because the current price and fully diluted share count are not public in the assigned
      evidence. The base case is continued ARR growth and fleet expansion, but with a valuation haircut
      to the 2022 benchmark until margin, cash, and financing terms are verified. The bull case requires
      Array to expand workflows and preserve customer economics without disproportionate fleet capital.
      The bear case is a down-round or preference-heavy financing after slower commercialization,
      manipulation shortfalls, or multiple compression in warehouse robotics. Comparable evidence is
      directional only: Geekplus disclosed public-market proceeds and profitability metrics in its
      filing, while two dated Symbotic snapshots show materially different market capitalizations and
      a materially different scale. Before entry, obtain the current cap table and preference stack, financing documents,
      monthly cash burn and runway, ARR reconciliation to recognized revenue, gross margin by offering,
      retention and concentration cohorts, and Array pilot-to-production metrics.
    claimRefs: [CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Public evidence, Assessment, Decision implication]
    rows:
      - [Recommendation, "Operating traction is credible, but current price and capitalization are not established.", "Track / research-more", "Do not underwrite a buy until price, terms, and cash conversion are verified."]
      - [Confidence, "ARR and financing figures are third-party estimates or reports; the latest valuation is historical.", "Medium", "Confidence should rise only after primary financing and financial evidence."]
      - [Risk rating, "RaaS ownership, autonomous-picking execution, and financing opacity remain material.", "High", "Require downside cases for fleet capital, margin compression, and a down-round."]
      - [Valuation stance, "Third-party 2026 signals are approximately $1.35B and $1.81B; the Series G valuation was not company-disclosed.", "Unknown / unpriced", "Apply an opacity discount rather than treating any reported mark as a verified entry price."]
      - [Decision implication, "A credible platform is not the same as a supportable entry price.", "Conditional diligence", "Revisit after cap-table, cash, unit-economics, and Array evidence are delivered."]
    notes: "Assessment combines dated third-party reporting and public disclosures; the valuation stance is an analytical judgment, not a quoted market price."
    claimRefs: [CV001, CV002, CV003, CV010, CV012]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view, Current implication]
    rows:
      - [Recurring scale, "Sacra estimates $180M ARR in June 2026, up from $165M at end-2025.", "Audited ARR-to-revenue bridge and gross retention by cohort.", "Supports track, not a price-independent buy."]
      - [Expansion option, "Array launched in April 2026 and Nexera grasping technology was added in May 2026.", "Paid production deployments with uptime, pick-success, and intervention data.", "Bull case remains milestone-dependent."]
      - [Capital efficiency, "RaaS charges recurring fees while Locus retains and redeploys robots.", "Fleet capex, refurbishment economics, contribution margin, and cash burn.", "Capital intensity is unresolved."]
      - [Financing support, "Series G reporting describes $41.6M from existing investors, an open round, and a third-party valuation signal below prior marks.", "Signed term sheet, final close, valuation, and investor rights.", "Supportive signal, but not a verified current valuation."]
      - [Competitive pressure, "Geekplus and Symbotic provide public comparables with different scale and disclosure.", "Comparable set normalized for revenue, growth, margin, and business mix.", "Public multiples are directional only."]
    notes: "Rows separate company operating signals from unresolved diligence requirements; no comparable multiple is inferred from unlike business models."
    claimRefs: [CV002, CV006, CV007, CV008, CV009, CV014]
  - id: TV003
    title: Bull / base / bear scenarios
    columns: [Scenario, Operating assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Array reaches reliable production deployment; existing accounts expand workflows; ARR growth persists.", "A premium to the 2022 benchmark could be justified only after current terms and margins support it.", "Possible, but evidence incomplete.", "Array intervention or pick-success metrics fail production thresholds."]
      - [Base, "Core AMR/RaaS business grows; Array contributes selectively; financing remains private and opaque.", "Treat the reported $1.35B-$1.81B signals only as a screening band and require a discount until capitalization and cash conversion are verified.", "Most defensible public-evidence case.", "ARR growth does not translate into improving contribution margin or runway."]
      - [Bear, "Commercialization slows, fleet investment rises, or private-market multiples compress.", "Down-round, preference overhang, or materially lower common-equity value becomes plausible.", "Material risk, not quantified.", "New financing is below the 2022 mark or includes punitive preferences."]
      - [Entry discipline, "No current price, diluted share count, or preference stack is disclosed in assigned evidence.", "No precise target return or per-share valuation should be issued.", "Required condition.", "Investment committee cannot obtain financing documents."]
      - [Exit readiness, "Public comparables exist, but Locus has no evidenced IPO timing or audited public-company disclosure here.", "Treat exit as optional rather than a modeled near-term liquidity event.", "Low confidence.", "No credible path to audited scale, margins, and governance readiness."]
    notes: "Scenario ranges are intentionally qualitative because current valuation, dilution, cash, and margin inputs are missing; probability signals are not numerical probabilities."
    claimRefs: [CV003, CV010, CV012, CV013, CV015, CV016]
