    title: Workflow / use-case table
    columns: [User job, Current workflow, Company solution, Measurable benefit, Limitation]
    rows:
      - [Outbound picking, "Worker walks to storage and picks into a tote", "Origin carries the tote and directs the worker", "Reduced walking and higher reported productivity", "Public sources do not provide independent site-level denominator"]
      - [Putaway and replenishment, "Human-directed movement and replenishment", "LocusONE assigns missions across the fleet", "One orchestration layer can shift work as demand changes", "Exception logic and inventory reconciliation are undisclosed"]
      - [Autonomous item picking, "Robot transports inventory but human grasps item", "Array combines mobile base, arm, and perception", "Potentially fewer manual touches", "Long-tail SKU performance is unresolved"]
      - [Warehouse integration, "WMS and automation systems operate through separate interfaces", "APIs and LocusONE connect orders to robot missions", "Brownfield deployment without claimed facility redesign", "Integration depth, cybersecurity, and rollback controls need diligence"]
    notes: "Benefits are source-reported or analyst-described and should not be read as audited performance; null-like limitations identify missing denominators or controls."
    claimRefs: [CE002, CE003, CE006, CE011, CE013]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer/process/component, Role, Dependency, Risk]
    rows:
      - [Enterprise systems, "Receives orders and inventory work", "Customer WMS and warehouse data quality", "Bad or delayed data can misroute missions"]
      - [LocusONE orchestration, "Decomposes work and coordinates robots and people", "Reliable APIs, telemetry, and control-plane availability", "Integration depth and failover are not publicly documented"]
      - [Mobile robotics, "Navigates aisles and transports totes or loads", "Facility map, charging, layout, and safe human interaction", "Congestion, downtime, and site-specific maintenance"]
      - [Array manipulation, "Perceives and grasps individual inventory", "Vision, end-effector, SKU presentation, and exception handling", "Long-tail SKU and grasp-failure performance"]
      - [RaaS service layer, "Bundles hardware, software, maintenance, and support", "Locus fleet ownership and field service", "Subscription economics and redeployment assumptions are not independently verified"]
    notes: "Architecture is a synthesis of retained product descriptions; the table separates documented roles from dependencies and open risks rather than asserting an undisclosed implementation."
    claimRefs: [CE003, CE005, CE007, CE009, CE014]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Locus's product stack links warehouse systems to orchestration, mobile execution, and newer autonomous manipulation.
    data:
      layers:
        - label: Enterprise workflow
          detail: Customer systems and warehouse operators supply orders, inventory context, and exception handling.
          modules:
            - WMS and order inputs
            - Warehouse operations
          items:
            - name: WMS and order inputs
              detail: Orders and inventory work enter the automation workflow through customer systems.
            - name: Warehouse operations
              detail: Supervisors and associates remain part of collaborative deployment and exception handling.
        - label: Orchestration
          detail: LocusONE decomposes work, coordinates the fleet, and exposes operating visibility.
          modules:
            - LocusONE
            - Integration APIs
          items:
            - name: LocusONE
              detail: Mission assignment, fleet coordination, task interleaving, and operational visibility.
            - name: Integration APIs
              detail: Connects the orchestration layer with warehouse management and automation systems.
        - label: Physical execution
          detail: Mobile robots transport inventory while Array adds perception and manipulation.
          modules:
            - Origin and Vector
            - Array and NeuraGrasp
          items:
            - name: Origin and Vector
              detail: Collaborative picking, transport, putaway, and heavier material movement.
            - name: Array and NeuraGrasp
              detail: Robots-to-Goods movement, perception, and autonomous manipulation; production breadth remains to be proven.
        - label: Site operations
          detail: Warehouse layout, charging, safety interaction, and exception workflows shape deployment outcomes.
          modules:
            - Facility map and charging
            - Human exception handling
          items:
            - name: Facility map and charging
              detail: Site layout and charging behavior are operational dependencies for fleet availability.
            - name: Human exception handling
              detail: Associates remain relevant where inventory or system conditions fall outside automation coverage.
        - label: Service delivery
          detail: Robots-as-a-Service packages hardware, software, maintenance, and support.
          modules:
            - RaaS subscription
            - Field support
          items:
            - name: RaaS subscription
              detail: Subscription structure shifts deployment from an outright equipment purchase toward an operating service.
            - name: Field support
              detail: Maintenance and support are part of the proposed operating model, but service-level terms are not public.
        - label: Evidence boundary
          detail: Public materials establish product direction but leave quantitative controls and repeatability open.
          modules:
            - Customer deployment evidence
            - Unverified controls
          items:
            - name: Customer deployment evidence
              detail: DHL is identified as an early-access live-operation customer for Array.
            - name: Unverified controls
              detail: Public sources do not establish security, safety certification, uptime, or SKU-level success rates.
    claimRefs: [CE002, CE003, CE005, CE006, CE007, CE010]
