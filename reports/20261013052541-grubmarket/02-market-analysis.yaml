callouts:
- calloutType: insight
  title: 'Dual Market Profile: Commodity Logistics vs. High-Margin SaaS'
  body: GrubMarket commands a dual market profile that complicates valuation multiple selection. The bulk of its $2.0B revenue derives from physical produce wholesaling across more than 60 acquired subsidiaries, whereas its software platform WholesaleWare and AI modules represent a much smaller but faster-growing software market segment.
  claimRefs:
  - CM001
  - CM005
  - CM013
- calloutType: risk
  title: Legacy Integration Friction Constrains Software-Only TAM Realization
  body: Adoption of vertical ERP and AI tooling faces significant operational headwinds in the food supply chain due to fragmented colloquial naming conventions, entrenched legacy ERPs like Produce Pro and Famous, and the compliance scrutiny surrounding historical consolidated revenue reporting.
  claimRefs:
  - CM004
  - CM010
  - CM014
  - CM015
