      - number: '1.4'
        title: Operational Scale and Corporate Milestones
        blocks:
          - type: paragraph
            body: >-
              GrubMarket's operational evolution reflects continuous consolidation of the fragmented North American
              produce wholesale sector, completing more than 60 distributor acquisitions over a decade. Key operational
              expansions in 2025 and 2026 include the acquisitions of Coast Citrus Distributors, Delta Fresh Produce,
              and United Kingdom distributor JR Holland, establishing an international operating footprint. Alongside
              physical supply chain expansion, the company released dedicated inventory and reporting AI agents in 2025
              to automate order triage and stock management. However, corporate momentum was punctuated in January 2025
              by an SEC enforcement settlement concerning $550 million in historical revenue overstatements during
              Series D fundraising, emphasizing the critical importance of verifiable financial reporting.
