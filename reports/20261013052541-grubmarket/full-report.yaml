        - Adverse analysis emphasizes more than 60 acquisitions and missing standalone software proof
        - A cohort bridge separating organic, acquired, and software growth
      - - Anti-thesis
        - Reporting complexity can erase confidence in the premium
        - Two outlets report a $550M historical revenue overstatement and $8M SEC penalty
        - Auditor evidence of remediated controls and clean consolidated reporting
    notes: >-
      Company-disclosed product and Procurant metrics are not treated as independently audited; anti-thesis rows
      summarize retained third-party reporting and define evidence that could reverse the view.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: Bull, base, and bear scenario framework
    columns:
      - Scenario
      - Assumptions
      - Valuation or return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Audited software growth is independent, recurring, and margin-accretive; controls are remediated
        - Marketplace IPO yardsticks become relevant, but no upper valuation is supportable yet
        - Public filing shows segment mix and clean controls
        - Software remains immaterial or captive to acquired distributors
      - - Base
        - Distribution remains the majority of revenue while software improves operations
        - Use $4.5B only as a ceiling; require a negotiated discount or verified earnings bridge
        - Audited filing reconciles revenue and acquisition cohorts
        - No discount despite missing mix and preference terms
      - - Bear
        - Acquisition growth slows, software lacks external traction, or controls remain weak
        - Distribution IPO yardsticks of roughly 0.2x-0.4x sales become the relevant reference range
        - Organic growth and margins weaken after acquisition normalization
        - Down round, offering withdrawal, or new reporting exception
    notes: >-
      Multiple ranges are historical IPO yardsticks from unlike businesses, not a GrubMarket target; no probability
      percentages or implied enterprise values are assigned because audited revenue, margin, debt, dilution, and segment
      data are unavailable.
    claimRefs:
      - CV002
      - CV003
      - CV005
      - CV009
      - CV012
      - CV013
      - CV015
      - CV016
