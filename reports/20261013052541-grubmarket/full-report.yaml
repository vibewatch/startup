      - number: '4.2'
        title: Cost Structure, Gross Margin Dynamics, and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              The company cost structure is fundamentally anchored by physical perishable goods distribution, including
              product cost of goods sold, cold-chain warehousing, temperature-controlled transportation logistics, and
              regional driver labor. Although pure software platforms generate gross margins exceeding 70%, regional
              produce wholesale operations historically operate on narrow gross margins between 8% and 15% and net
              profit margins under 3%. GrubMarket aims to expand blended gross margin through automated pricing
              algorithms, AI inventory reordering tools, and proprietary software routing across its warehouse network.
              Nevertheless, because consolidated audited financial breakdowns and gross margin line items remain
              undisclosed pending a formal public S-1 registration statement, public underwriting cannot independently
              confirm whether post-acquisition technology integration has generated durable unit-economic margin
              expansion or whether profitability remains constrained by inflationary physical logistics costs.
            claimRefs:
