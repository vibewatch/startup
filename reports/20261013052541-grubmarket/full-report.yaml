chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Founded in 2014 and headquartered in San Francisco, California, GrubMarket operates as a food technology
              and commerce enterprise connecting food producers, wholesalers, retailers, and commercial foodservice
              providers across the United States and Canada. The company executes a hybrid business model that pairs
              physical wholesale produce distribution—assembled via serial regional acquisitions—with proprietary
              enterprise software including the WholesaleWare ERP suite and automated agentic AI workflows. While
              marketing narratives emphasize high-margin AI software transformation, physical food distribution
              constitutes the overwhelming bulk of operating volume, requiring substantial logistics, cold-chain
              handling, and regional warehouse infrastructure across all fifty states.
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO008
              - CO009
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO005
              - CO008
              - CO009
              - CO010
      - number: '1.2'
        title: Leadership, Governance, and Key-Person Risk
        blocks:
          - type: paragraph
            body: >-
              GrubMarket is led by founder and Chief Executive Officer Mike Xu, a former enterprise software engineer at
              eBay and Oracle who has directed company strategy and its aggressive acquisition agenda since founding the
              business in 2014. Leadership structure balances centralized technology development with decentralized
              operational autonomy for acquired regional distributors, retaining experienced industry operators such as
              Carole Shandler of Shapiro-Gilman Shandler. Because acquisition integration, capital allocation, and
              commercial vision remain heavily concentrated in Xu, GrubMarket carries pronounced key-person dependency.
              Furthermore, corporate governance structures face heightened investor scrutiny following past financial
              reporting discrepancies settled with federal securities regulators.
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO010
