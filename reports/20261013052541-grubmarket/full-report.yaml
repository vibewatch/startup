            tableRef: TO002
            claimRefs:
              - CO001
              - CO003
              - CO004
      - number: '1.3'
        title: Capitalization, Investors, and Valuation History
        blocks:
          - type: paragraph
            body: >-
              GrubMarket has accumulated approximately $600 million in total equity financing across eight venture and
              growth funding rounds. In February 2026, the company completed a $50 million Series H round at a $4.5
              billion pre-money valuation, securing participation from Future Food Fund, Portfolia Funds, Liberty Street
              Funds, and other institutional partners. The company's shareholder base features prominent institutional
              and growth investors including BlackRock, Tiger Global Management, and GGV Capital. In July 2026,
              GrubMarket submitted a confidential draft Form S-1 registration statement to the Securities and Exchange
              Commission, positioning the enterprise for a potential public offering to validate its private $4.5
              billion valuation multiple.
            claimRefs:
              - CO005
              - CO006
