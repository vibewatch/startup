  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Scope and Vertical ERP Core
        blocks:
          - type: paragraph
            body: >-
              GrubMarket offers a specialized software portfolio tailored to the operational demands of fresh produce
              wholesalers, foodservice distributors, and agricultural shippers. At the foundation of this offering lies
              WholesaleWare, a multi-tenant cloud enterprise resource planning (ERP) platform designed to handle complex
              perishable food workflows including real-time inventory management, warehouse picking, grower accounting
              settlements, and lot traceability. In the Spring 2026 product release, GrubMarket upgraded WholesaleWare
              with automated work order generation for produce repacking, rule-based price grouping across customer
              tiers, and automated FIFO lot allocation at shipment to accommodate just-in-time cross-docking operations.
              The core software platform connects with customer-facing ordering channels through Orders IO, a
              white-labeled mobile and web eCommerce application that enables restaurant buyers and grocery managers to
              browse supplier catalogs, receive personalized upsell suggestions, and execute digital payments via
              GrubPay. To support institutional buyers, the company expanded electronic data interchange integrations to
              connect natively with industry purchasing hubs including Produce Alliance and Restaurant365.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE008
