companyProfile:
  summary: >-
    GrubMarket is a private-disclosed B2B food supply chain company that combines physical wholesale produce
    distribution with proprietary vertical software, including WholesaleWare ERP, AI workflows, and payments tooling. It
    was founded in 2014, is headquartered in San Francisco, and has expanded through more than 60 acquisitions while
    also building a software footprint anchored by Procurant and GrubAssist. The latest disclosed financing was a $50
    million Series H at a $4.5 billion pre-money valuation, and the company confidentially filed a draft S-1 in July
    2026, but public segment economics and control remediation remain incomplete.
