  topStrengths:
    - Scaled hybrid platform with both physical distribution reach and proprietary ERP / AI workflow software.
    - Large installed software footprint through acquired distributors and Procurant's trading network.
    - Meaningful capitalization and a live IPO path provide optionality if disclosure quality improves.
  topRisks:
    - Historical SEC revenue-overstatement settlement keeps reporting credibility and controls under scrutiny.
    - Acquisition-led growth makes organic software traction and margin quality difficult to isolate.
    - Audited segment economics, cap-table terms, and post-settlement controls remain undisclosed.
  unresolvedGaps:
