- id: FE001
  title: Product Architecture Map
  type: stack
  summary: Six-layer architectural stack illustrating GrubMarket software interfaces, AI ingestion engines, core ERP modules,
    and fulfillment infrastructure.
  data:
    layers:
    - label: Client Ordering & Commercial Interfaces
      detail: Omnichannel customer interfaces for order placement, catalog browsing, and account management
      modules:
      - Orders IO Branded Mobile Applications
      - White-Labeled Web eCommerce Storefronts
      - B2B Sales Representative Ordering Portal
    - label: Agentic AI & Interaction Layer
      detail: Voice and text-driven AI assistants parsing unstructured natural language and distributor-specific jargon
      modules:
      - GrubAssist AI Voice and Text Assistant
      - Enterprise Dictionary & Slang Mapper
      - Customer-Specific AI Prompt Tuning Profiles
    - label: Intelligent Order Ingestion Engine
      detail: Continuous automated ingestion extracting order lines from incoming emails, voicemails, and text messages
      modules:
      - AI Orders Extraction Pipeline
      - Match Confidence Scoring Indicators
      - Customer Product Code & Unit Recognition
    - label: Core Enterprise ERP (WholesaleWare)
      detail: Cloud vertical ERP system managing produce wholesale operations, inventory accounting, and financials
      modules:
      - Automated FIFO Lot Allocation Engine
      - Repacking & Automated Work Orders
      - Grower Accounting & Cost Management
      - Rule-Based Dynamic Price Groups
    - label: Integration & Partner Connectivity Fabric
      detail: Standardized connectors linking internal ERP to external food networks, distributors, and legacy systems
