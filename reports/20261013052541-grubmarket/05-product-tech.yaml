callouts:
- calloutType: risk
  title: Commercial SaaS Reality Versus Roll-Up Integration Function
  body: While GrubMarket markets itself as an AI-powered enterprise software provider, third-party analysis indicates that
    WholesaleWare and its associated AI modules primarily serve as internal operational infrastructure to consolidate over
    60 acquired food distribution businesses. Investors should treat software capabilities as an efficiency driver for a wholesale
    logistics roll-up rather than underwriting the company at pure-play vertical SaaS revenue multiples.
  claimRefs:
  - CE006
  - CE011
