      - EDI Connectors (Produce Alliance, Restaurant365)
      - Legacy ERP Connectors (Famous, PICS, QuickBooks)
      - Procurant Trading Network Exchange Gateway
    - label: Settlement & Physical Execution Layer
      detail: Digital payment processing workflows and cold-chain logistics routing execution
      modules:
      - GrubPay ACH and Card Payment Processing
      - Automated Route Summaries & Load Planning
      - Cold-Chain Fleet Logistics Coordination
  approximationNotes: Architectural layers represent functional groupings of proprietary and acquired software assets disclosed
