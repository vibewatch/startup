evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headcount-and-financial-metrics
    missingEvidence: >-
      Audited consolidated payroll records and segmented employee counts distinguishing direct GrubMarket technology
      staff from acquired warehouse and distribution logistics personnel.
    whyItMatters: >-
      Public sources report conflicting headcount numbers ranging from ~1,500 to 2,172 to over 12,000 employees across
      historical roll-up entities, obscuring true operating leverage.
    diligencePath: >-
      Review audited payroll schedules and headcount exhibits in confidential S-1 registration statements or detailed
      audited financial disclosures.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: governance-and-leadership
    missingEvidence: >-
      Comprehensive listing of GrubMarket board of directors members, independent committee chairs, and subsidiary
      leadership rosters.
    whyItMatters: >-
      Private company status and rapid acquisition history leave board oversight and independent governance structures
