- calloutType: risk
  title: Financial Reporting Scrutiny and Internal Revenue Controls
  body: The SEC January 2025 civil enforcement action regarding $550 million in historical revenue overstatements necessitates comprehensive institutional diligence into GrubMarket post-settlement internal accounting controls and revenue recognition practices.
  claimRefs:
