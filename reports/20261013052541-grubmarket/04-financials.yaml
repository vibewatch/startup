  - CI016
- calloutType: insight
  title: Valuation Disconnect Between Tech Multiples and Distribution Realities
  body: At a $4.55 billion Series H valuation, GrubMarket trades at a tech-like revenue multiple of approximately 2.25x estimated top-line volume, requiring substantial standalone software profitability to justify public-market valuation benchmarks against traditional food distributors.
