  - CI002
  - CI003
  - CI004
  - CI005
- id: TI002
  title: Pricing / monetization table
  columns:
  - price/unit/contract
  - list vs realized pricing
  - discounts/unknowns
  - source
  rows:
  - - Wholesale Produce Markup (5-15% gross spread over FOB wholesale)
    - Realized pricing varies daily based on commodity terminal markets
    - Volume rebates and spoilage write-downs undisclosed
    - Industry wholesale distributor benchmarks
  - - WholesaleWare Core ERP License (Monthly/Annual SaaS contract)
    - Custom negotiated enterprise quotes based on user seats and modules
    - Contract discounting and bundling with distribution services unknown
    - Company product documentation and industry reports
  - - GrubAssist AI Add-On (Tiered software subscription)
    - Commercial list pricing not published publicly; bundled into ERP deployments
    - Stand-alone adoption pricing vs captive subsidiary usage unverified
    - Company press announcements and product releases
  - - GrubPay Payment Processing (Per-transaction interchange markup)
    - Standard ACH and card processing fees subject to merchant volume tiers
    - Net processing margin after financial partner rev-share undisclosed
    - Company software portal descriptions
  notes: Pricing structures reflect published commercial software capabilities and standard fresh produce wholesale operating models; contract-level realized pricing terms are proprietary.
