  title: Unit economics table
  columns:
  - metric
  - value/null
  - confidence
  - why it matters
  - diligence ask
  rows:
  - - Blended Gross Margin
    - null
    - low
    - Determines whether technology layer overcomes low-margin food distribution
    - Audited GAAP income statement with cost of revenue and segment margins
  - - Wholesale Distribution Gross Margin
    - null
    - low
    - Measures core operational profitability across physical warehouse operations
    - Produce procurement cost, freight-in, and spoilage losses breakdown
  - - Software Gross Margin
    - null
    - low
    - Verifies software operating leverage and hosting cost efficiency
    - Cloud hosting, customer support, and onboarding costs for WholesaleWare
  - - CAC Payback Period
    - null
    - low
    - Validates go-to-market sales efficiency across enterprise wholesale accounts
    - Sales and marketing spend divided by net new customer gross profit
  - - Net Revenue Retention (NRR)
    - null
    - low
    - Indicates customer satisfaction and expansion across software/distribution clients
    - Cohort retention tables across ERP users and wholesale food buyers
  - - Monthly Cash Burn / Free Cash Flow
    - null
    - low
    - Tests management self-sustaining operating claims against working capital needs
    - Audited statement of cash flows with operating and investing activities
  notes: Unit economics metrics are private and undisclosed; null fields highlight critical institutional underwriting gaps requiring audited financial documentation during diligence.
