              而是依靠自有软件架构、商业秘密，以及直接访问其运营子公司网络内部的分销数据。公司通过商业新闻联合发布网络积极传播公开沟通和产品更新，
              以塑造企业科技公司的姿态。但机构投资者要判断技术护城河，仍有重大尽调障碍。独立披露没有提供云 ERP 基础设施和移动支付网关的 SOC 2 Type II 审计报告、ISO 27001
              认证或正式渗透测试结果。更关键的是，公开申报文件和第三方分析没有拆分与非关联第三方分销商产生的 独立软件收入，以及归属于被收购子公司的内部转移分配，因而 WholesaleWare
              作为独立软件业务的商业可行性仍是未解决的尽调问题。
