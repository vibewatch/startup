    title: 乐观、基准与悲观情景框架
    columns:
      - 情景
      - 假设
      - 估值或回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 经审计的软件增长独立、可重复且能增厚利润率；控制已完成整改
        - 市场平台 IPO 估值基准变得相关，但目前仍无法支持上限估值
        - 公开申报显示业务组合和干净的控制
        - 软件仍无关紧要，或被已收购分销商内部消化
      - - 基准
        - 分销仍占收入多数，同时软件改善运营
        - 仅把 $4.5B 作为上限；需要谈判折价或经过验证的盈利桥接
        - 经审计申报调节了收入与收购 cohort
        - 在业务组合和优先权条款缺失的情况下仍不打折
      - - 悲观
        - 收购增长放缓、软件缺乏外部牵引，或控制仍然薄弱
        - 分销 IPO 估值基准约为销售额的 0.2x-0.4x，成为相关参考区间
        - 收购正常化后自然增长和利润率走弱
        - 下轮融资、撤回发行或新的报告例外
    notes: 多个区间是不同类型企业的历史 IPO 估值基准，并非 GrubMarket 的目标；由于缺少经审计的收入、利润率、债务、稀释和业务分部数据，未赋予概率百分比或隐含企业价值。
