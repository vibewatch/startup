        title: 运营规模与公司里程碑
        blocks:
          - type: paragraph
            body: >-
              GrubMarket 的运营演进反映出对北美分散农产品批发行业的持续整合，十年间完成了 60 多起分销商收购。2025 年和 2026 年的关键扩张包括收购 Coast Citrus
              Distributors、Delta Fresh Produce 以及英国分销商 JR Holland， 由此建立国际运营版图。除扩张实体供应链外，公司还在 2025 年推出专用库存和报告 AI
              代理，自动处理订单分流和库存管理。但公司势头在 2025 年 1 月受到 SEC 执法和解的冲击：和解涉及 Series D 募资期间 $550M 历史收入虚增，突出了可验证财务报告的重要性。
