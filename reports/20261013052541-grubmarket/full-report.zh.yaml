  - id: FI001
    title: 收入模型桥接
    type: waterfall
    summary: 概念性利润率瀑布图，展示商品批发分销总量扣除物流成本后，转化为高利润率软件价值捕获的过程。
    data:
      items:
        - label: 分销总量
          value: 100
        - label: 农产品采购成本
          value: -82
        - label: 冷链与仓储
          value: -6
        - label: 配送物流与人工
          value: -4
        - label: 批发实体业务利润率
          value: 8
        - label: ERP 与 AI 软件贡献
          value: 4
        - label: 综合运营利润率潜力
          value: 12
