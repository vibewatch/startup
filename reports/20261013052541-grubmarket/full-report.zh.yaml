        title: 产品范围与垂直 ERP 核心
        blocks:
          - type: paragraph
            body: >-
              GrubMarket 提供专为生鲜批发商、餐饮分销商和农业运输商运营需求打造的软件组合。其基础是 WholesaleWare：一套多租户云端 ERP，
              用于处理实时库存管理、仓库拣选、种植者结算和批次追踪等复杂的易腐食品工作流。2026 年春季产品发布中，GrubMarket 升级了
              WholesaleWare，增加农产品重新包装自动生成工单、客户层级之间的规则定价分组，以及出货时自动 FIFO 批次分配，以支持即时交叉转运。 核心软件平台通过 Orders IO
              连接面向客户的订货渠道；这是一个白标移动和 Web 电商应用，让餐厅买家和杂货店经理浏览供应商目录、 获得个性化加购建议，并通过 GrubPay
