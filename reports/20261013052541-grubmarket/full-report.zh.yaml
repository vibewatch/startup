    type: pyramid
    summary: 从美国食品总支出逐层收窄至可服务食品供应链软件规模的市场规模分层。
    approximationNotes: 分层规模覆盖宏观食品支出、批发分销规模和垂直软件市场潜力。
    claimRefs:
      - CM001
      - CM005
      - CM006
      - CM007
      - CM011
      - CM013
    data:
      nodes:
        - label: 美国食品经济总量（TAM）
          value: $1.3T+
          detail: 美国消费者和商业客户每年通过所有渠道支出的食品金额
          tone: neutral
        - label: 批发食品供应链（SAM）
          value: $300B+
          detail: 易腐与干货商品在国内的批发分销总量
          tone: neutral
        - label: 易腐新鲜农产品批发
          value: $85B+
          detail: 新鲜水果、蔬菜和花卉商品的批发交易量
          tone: neutral
        - label: Procurant 交易网络 GMV
          value: $5.5B
          detail: 覆盖 850 个零售和供应商企业账户的年度新鲜农产品 GMV
          tone: positive
        - label: GrubMarket 合并营收
          value: $2.0B
          detail: 2024 年实体分销和软件业务的估算合并收入
          tone: positive
        - label: 食品供应链垂直 SaaS（SOM）
          value: $500M-$1B
          detail: 云 ERP、AI 订单录入和可追溯合规工具的核心软件 TAM
          tone: opportunity
