  - id: FV001
    title: 从价格锚点到决策的推荐逻辑
    type: flow
    summary: 可观察到的融资估值要先经过业务构成、控制措施和披露情况的检验，之后才会形成“跟踪 / 进一步研究”的建议。
    data:
      nodes:
        - id: round-anchor
          label: $50M H 轮，投前估值 $4.5B
          detail: 可观察的私募市场价格锚点
        - id: scale-test
          label: 分销规模加软件产品组合
          detail: 可能存在平台价值，但缺少分部经济数据
        - id: integration-test
          label: 超过 60 起收购
          detail: 需要拆分判断有机增长与整合质量
        - id: controls-test
          label: 历史 SEC 报告和解
          detail: 提高了对合并口径数据的尽调要求
        - id: disclosure-test
          label: 未留存公开招股说明书
          detail: 股权结构表、经审计的业务构成和退出时点仍未解决
        - id: decision
          label: 跟踪 / 进一步研究
          detail: 只有价格和证据基础重置后才投资
      edges:
        - from: round-anchor
          to: scale-test
        - from: scale-test
          to: integration-test
        - from: integration-test
          to: controls-test
        - from: controls-test
          to: disclosure-test
        - from: disclosure-test
          to: decision
    approximationNotes: 这是定性的决策链，不是概率模型或估值计算；标签保留了当前公开证据中的不确定性。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV008
      - CV009
      - CV011
      - CV014
