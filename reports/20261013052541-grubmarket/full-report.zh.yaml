  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: GrubMarket 2014 至 2026 年运营历史中的关键公司、融资、收购、产品和监管里程碑。
    approximationNotes: 里程碑日期来自公开新闻稿、新闻报道和监管申报；S-1 草案提交日期来自保密申报公告。
