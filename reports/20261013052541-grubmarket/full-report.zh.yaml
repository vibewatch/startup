chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              GrubMarket 成立于 2014 年，总部位于加利福尼亚州旧金山，是一家食品科技与商业企业，把美国和加拿大的食品生产商、
              批发商、零售商及商业餐饮服务商连接起来。公司采用混合商业模式：一边通过连续收购区域企业搭建实体批发农产品分销网络， 一边提供 WholesaleWare ERP 套件和自动化代理式 AI
              工作流等自有企业软件。营销叙事强调高毛利 AI 软件转型， 但实体食品分销占运营规模的绝大部分，因此公司在全美 50 个州都需要大量物流、冷链处理和区域仓储基础设施。
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO008
              - CO009
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO005
              - CO008
              - CO009
              - CO010
      - number: '1.2'
        title: 领导层、治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              GrubMarket 由创始人兼首席执行官 Mike Xu 领导。Mike Xu 曾是 eBay 和 Oracle 的企业软件工程师，自 2014 年创办公司以来，
              一直主导公司战略和激进的收购计划。领导结构把集中式技术开发与被收购区域分销商的分散运营自主权结合起来， 并保留 Shapiro-Gilman Shandler 的 Carole Shandler
              等经验丰富的行业运营者。由于收购整合、资本配置和商业愿景 高度集中在 Xu 身上，GrubMarket 对关键人物存在明显依赖。此外，公司过去的财务报告差异曾与联邦证券监管机构和解，
              这使公司治理结构受到投资者更严格的审视。
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO010
