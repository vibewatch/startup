        - label: 创立与上线
          date: 2014-10
          detail: Mike Xu 在旧金山创立 GrubMarket，旨在改造食品供应链。
          tone: positive
        - label: Series E 融资轮
          date: 2021-11
          detail: 在 BlackRock 领投下完成 $200 million Series E 轮融资，投后估值 $1.2 billion。
          tone: positive
        - label: SEC 营收和解
          date: 2025-01
          detail: 就历史营收虚增 $550M 的 SEC 指控达成和解；支付 $8M 民事罚款。
          tone: critical
        - label: Delta Fresh Produce 收购
          date: 2025-04
          detail: 收购总部位于亚利桑那州 Nogales 的分销商 Delta Fresh Produce，扩大跨境供应。
          tone: neutral
        - label: Coast Citrus Distributors 收购
          date: 2025-06
          detail: 收购圣迭戈热带农产品分销商 Coast Citrus，完成公司历史上最大的一笔收购。
          tone: neutral
        - label: 库存管理 AI Agent 上线
          date: 2025-07
          detail: 发布 AI 智能体，自动化仓库库存流程和采购决策。
          tone: positive
        - label: 报告 AI Agent 发布
          date: 2025-09
          detail: 为食品批发商部署自动化智能体报告工具，按定制计划运行。
          tone: positive
        - label: $4.5B 估值的 Series H 融资
          date: 2026-02
          detail: 从 Future Food Fund 和 Portfolia 筹得 $50 million Series H 融资，投前估值 $4.5 billion。
          tone: positive
        - label: S-1 草案保密提交
          date: 2026-07
          detail: 向 SEC 保密提交 Form S-1 注册声明草案，拟申请公开上市。
          tone: neutral
        - label: 通过 JR Holland 拓展英国
          date: 2026-08
          detail: 收购英国农产品分销商 JR Holland，进入英国餐饮服务供应链。
          tone: neutral
