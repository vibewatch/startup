    claimRefs:
      - CI001
      - CI007
      - CI008
      - CI009
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 六层架构栈，展示 GrubMarket 软件接口、AI 录入引擎、核心 ERP 模块和履约基础设施。
    data:
      layers:
        - label: 客户订购与商业接口
          detail: 用于下单、浏览目录和账户管理的全渠道客户界面
          modules:
            - Orders IO 品牌移动应用
            - 白标 Web 电商店面
            - B2B 销售代表订购门户
        - label: Agentic AI 与交互层
          detail: 由语音和文本驱动的 AI 助手，解析非结构化自然语言和分销商专用术语
          modules:
            - GrubAssist AI 语音与文本助手
            - 企业词典与俚语映射器
            - 客户专属 AI 提示词调优配置
        - label: 智能订单录入引擎
          detail: 持续自动录入，从收到的电子邮件、语音信箱和短信中提取订单行
          modules:
            - AI Orders 提取管线
            - 匹配置信度评分指标
            - 客户产品代码与单位识别
        - label: 核心企业 ERP（WholesaleWare）
          detail: 管理农产品批发运营、库存会计和财务的云端垂直 ERP 系统
          modules:
            - 自动 FIFO 批次分配引擎
            - 重新包装与自动工单
            - 种植者会计与成本管理
            - 基于规则的动态价格组
        - label: 集成与合作伙伴连接层
          detail: 通过标准化连接器，将内部 ERP 连接至外部食品网络、分销商和传统系统
          modules:
            - EDI 连接器（Produce Alliance、Restaurant365）
            - 传统 ERP 连接器（Famous、PICS、QuickBooks）
            - Procurant 交易网络交换网关
        - label: 结算与实体执行层
          detail: 数字支付处理流程与冷链物流路线执行
          modules:
            - GrubPay ACH 与银行卡支付处理
            - 自动路线摘要与装载规划
            - 冷链车队物流协调
    approximationNotes: 架构层代表产品文档披露的自有及收购软件资产的功能分组。
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE005
      - CE006
      - CE010
      - CE012
  - id: FU001
    title: 客户旅程与软件扩展流程
    type: journey-map
    summary: 展示 GrubMarket 如何获取农产品买家并将其转化为持续软件用户的工作流阶段。
    data:
      items:
        - label: 分销商并购接入
          stage: 分销商并购接入
          user: Acquired produce distributor
          touchpoints:
            - 并购交割
            - 传统 ERP 库存审计
          action: Transition existing book of grocery buyers onto GrubMarket platform
          outcome: Instant 1P volume and customer relationships acquired
        - label: 软件部署
          stage: 软件部署
          user: Distributor operations team
          touchpoints:
            - WholesaleWare 接入
            - 库存批次设置
          action: Deploy WholesaleWare ERP for inventory, lot traceability, and accounting
          outcome: Operational modernization and single-pane-of-glass tracking
        - label: AI 工作流集成
          stage: AI 工作流集成
          user: Sales and warehouse staff
          touchpoints:
            - AI Orders 电子邮件与语音信箱解析
            - GrubAssist 企业词典
          action: Automate voice and email order extraction directly into ERP
          outcome: Reduction in manual entry errors and faster order turnaround
        - label: 买家门户采用
          stage: 买家门户采用
          user: Retail grocer and restaurant buyer
          touchpoints:
            - Orders IO 品牌移动应用
            - 数字目录浏览
          action: Retailers place orders via mobile app instead of 6 a.m. phone calls
          outcome: Self-service digital ordering and order tracking transparency
        - label: 支付与财务结算
          stage: 支付与财务结算
          user: Buyer accounts payable
          touchpoints:
            - GrubPay 数字结账
            - ACH 与信用卡结算
          action: Process B2B invoices and payments digitally with reduced friction
          outcome: Shorter days-sales-outstanding and captured fintech transaction revenue
        - label: 网络扩张与第三方交叉销售
          stage: 网络扩张与第三方交叉销售
          user: Third-party supplier and wholesale partner
          touchpoints:
            - GrubMarket 市场卖家门户
            - Procurant 交易平台
          action: Offer supplier catalog to broader wholesale network across 50 states
          outcome: Network density and expansion into third-party SaaS trading ecosystem
    approximationNotes: 工作流阶段反映 GrubMarket 产品架构、WholesaleWare 功能和已收购的运营流程；各旅程步骤的转化率仅为示意且属非公开信息。
    claimRefs:
      - CU004
      - CU007
      - CU013
