        title: 资本结构、投资者与估值历史
        blocks:
          - type: paragraph
            body: >-
              GrubMarket 通过 8 轮风险投资和成长融资累计获得约 $600M 股权融资。2026 年 2 月，公司完成 $50M Series H，投前估值 $4.5B，Future Food
              Fund、Portfolia Funds、Liberty Street Funds 及其他机构伙伴参与其中。 股东包括 BlackRock、Tiger Global Management 和 GGV
              Capital 等知名机构及成长型投资者。2026 年 7 月，GrubMarket 向美国证券交易委员会秘密提交了 Form S-1 注册声明草案，为潜在公开发行铺路，以验证其 $4.5B 私人估值倍数。
