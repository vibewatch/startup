callouts:
  - calloutType: risk
    title: "Organic Software Adoption vs Roll-Up Aggregation"
    body: "GrubMarket's customer growth narrative relies heavily on roll-up arithmetic from acquiring over 60 produce distributors and software platforms like Procurant, rather than organic software adoption by third-party wholesalers. Investors must verify whether acquired buyers remain loyal to the digital platform or experience churn once legacy distributor founders exit."
