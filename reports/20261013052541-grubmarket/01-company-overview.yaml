callouts:
  - calloutType: "risk"
    title: "Roll-up Accounting and SEC Oversight Challenge"
    body: "GrubMarket's aggressive acquisition pace—absorbing more than 60 independent distributors—magnifies accounting and financial integration risks. The January 2025 SEC settlement over historical revenue overstatements highlights that scaling physical wholesale operations requires rigorous consolidated audit controls rather than tech-multiple assumptions."
    claimRefs:
      - "CO009"
      - "CO010"
  - calloutType: "insight"
    title: "Vertical ERP and Agentic AI as Roll-Up Infrastructure"
    body: "While market positioning emphasizes AI software and high SaaS growth, proprietary platforms WholesaleWare and GrubAssist AI primarily serve as the critical operational connective tissue enabling GrubMarket to standardize manual ordering and inventory across acquired regional produce distributors."
    claimRefs:
      - "CO002"
      - "CO014"
