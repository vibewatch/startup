  - id: TP003
    title: Commercial Pricing and Contract Model Comparison
    columns:
      - Provider / Solution Category
      - Pricing & Commercial Model
      - Included Product Modules
      - Known Discounts / Pricing Unknowns
      - Strategic Diligence Implication
    rows:
      - - GrubMarket Software Suite
        - Modular SaaS subscription plus transaction processing fees
        - WholesaleWare ERP, GrubAssist AI, AI Orders, Orders IO, GrubPay
        - Bundling discounts for acquired entities; standalone software list pricing undisclosed
        - Difficult to disaggregate organic software ARR from physical wholesale margin
      - - Legacy Agricultural ERP (Famous, PICS)
        - Perpetual license plus annual maintenance or per-seat SaaS
        - Core ERP, lot traceability, inventory, grower settlement, accounting
        - Implementation fees and custom reporting add-ons vary by warehouse size
        - High upfront switching barrier protects incumbent vendor install base
      - - Specialized Food Supply Chain SaaS
        - Annual enterprise SaaS subscriptions based on user tiers or facility count
        - Specification management, packaging workflows, shop-floor worker analytics
        - Multi-year enterprise contracts with tiered volume discounting
        - High software gross margins (70%+) but lacks physical distribution leverage
    notes: >-
      Pricing terms and contract tiers based on public trade summaries and distributor disclosures; list pricing versus
      realized net subscription contract values remains undisclosed.
