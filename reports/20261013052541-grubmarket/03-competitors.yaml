        - Unsupported / Partner-reliant (Manual entry or standard EDI)
        - Partially supported (Proprietary internal customer ordering portals)
        - Unsupported (Out of scope for manufacturing productivity tools)
      - - Integrated Physical Distribution & Cold Chain
        - Supported (Operates 60+ acquired regional produce distributors)
        - Unsupported (Pure software vendors without physical logistics)
        - Supported (Dominant national refrigerated warehousing and fleets)
        - Unsupported (Pure software vendors without physical distribution)
      - - White-Label eCommerce & Payments for Distributors
        - Supported (Orders IO branded mobile apps and GrubPay)
        - Partially supported (Basic web order entry portals or third-party add-ons)
