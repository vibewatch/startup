callouts:
  - calloutType: insight
    title: The Captive-Deployment Moat vs. Organic Software Adoption
    body: >-
      GrubMarket's unique competitive advantage stems from its acquisition strategy: by purchasing regional produce
      distributors, it guarantees immediate, captive deployment of WholesaleWare and GrubAssist AI. However, this
      creates an analytical dilemma for investors. The software moat is real within owned subsidiaries, but proof that
      independent, non-acquired distributors choose WholesaleWare over entrenched legacy systems remains limited.
    claimRefs:
      - CP003
      - CP007
  - calloutType: risk
    title: Incumbent Re-Platforming and Regulatory Scrutiny Threats
    body: >-
      GrubMarket faces twin risks: first, that broadline giants like Sysco build or acquire comparable AI order
      extraction tools, neutralizing GrubMarket's technological differentiation; and second, that past SEC enforcement
      over $550 million in historical revenue overstatements creates hesitation among enterprise buyers considering
      long-term ERP migration.
    claimRefs:
      - CP004
      - CP013
