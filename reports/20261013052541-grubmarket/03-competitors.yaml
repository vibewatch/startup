    rows:
      - - Sysco & US Foods
        - Broadline Foodservice Distributors
        - Enterprise scale ($50B+ revenue; public)
        - Restaurants, hospitality, institutions
        - Massive national cold-chain logistics and entrenched purchasing power
        - Generic catalog focus; limited specialized farm-to-wholesaler lot traceability software
      - - Famous Software & PICS
        - Legacy Fresh Produce ERP Vendors
        - Established private vendors (thousands of grower seats)
        - Fresh produce packers, shippers, and wholesalers
        - Decades of deep agricultural accounting, lot tracking, and grower return rules
        - Legacy client-server architectures; sluggish cloud modernization and limited native AI tooling
      - - Specright & Redzone
        - Specialized Food Supply Chain SaaS
        - VC/PE-backed scale ($50M+ raised; high-growth SaaS)
        - Food manufacturers, packaging teams, plant operations
        - Modern purpose-built software for specification and shop-floor productivity
        - No physical wholesale trade volume or native produce lot accounting
      - - Internal Spreadsheets & Phone Ordering
        - Status-Quo Workflow Alternatives
        - Universal baseline across fragmented SMB wholesalers
        - Independent regional produce wholesalers and jobbers
        - Zero software subscription cost; familiar manual operational routines
        - Extreme labor inefficiency, error-prone ordering, lack of real-time inventory visibility
    notes: >-
      Data synthesized from trade coverage, competitor integration announcements, and market research; private software
      revenues and exact market shares are unaudited.
