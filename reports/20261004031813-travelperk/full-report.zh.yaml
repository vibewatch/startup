              - CO014
          - type: callout
            title: 利润率不透明之下的高企 SaaS 估值倍数
            body: >-
              TravelPerk 在 Series E 轮后的 $2.7B 估值对应其 $200M 收入运行率，估值倍数约为 13x
              ，但经审计毛利率与净收入留存率（NRR）仍处于完全未披露状态。客户对加价溢价与服务脱节的反馈，进一步加剧了核实底层单店经济模型的尽调必要性。
            calloutType: risk
