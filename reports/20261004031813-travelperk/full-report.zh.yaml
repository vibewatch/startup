      - number: '3.3'
        title: 定价模式、护城河持久度与反向证据
        blocks:
          - type: paragraph
            body: >-
              各家定价体系的分歧决定了迥异的单客经济模型与推广阻力。TravelPerk 采用混合商业模式：固定平台月度订阅费叠加 3% 至 5% 的预订交易手续费。以 50 人的企业为例，TravelPerk Premium
              每月收取约 $99 基础订阅费加交易费；而 Navan 按活跃人头计费，每人每月约 $15 （50 人即每月 $750 ）。若中型团队差旅频次适中，TravelPerk 具备显著的结构性价格优势。然而，Ramp
              与 Brex
              面向达标企业推出完全免费的软件方案，纯靠刷卡手续费分成变现而非收取软件或交易费，这在注重数字化的科技型中小企业客群中直接分流了软件利润。企业差旅的转换成本处于中等水平：尽管预订端迁移极为迅速，但一旦与 ERP
              财务流水、历史出行偏好数据、协议供应商折扣以及细化合规规则深度绑定，壁垒将大幅加固。护城河的稳固性面临不可忽视的负面压力：经实证的客户投诉显示，平台酒店价格常比直采渠道高出 50% 至 100%
              ，偶尔出现未通知即取消预订的事故，且客服响应延迟引发服务脱节，极易导致员工转向体外预订。
            claimRefs:
