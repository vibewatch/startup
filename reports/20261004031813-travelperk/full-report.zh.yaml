    approximationNotes: 组件映射依据工程技术招聘需求、合作伙伴技术公开披露及平台集成审核梳理推断。
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE005
      - CE008
      - CE009
      - CE010
    data:
      layers:
        - label: 客户端交互与展现层
          detail: 跨平台消费级预订与管理交互界面
          modules:
            - React Web 单页应用
            - iOS 与 Android 原生差旅应用
            - 企业管理员与差旅协调人门户
        - label: 企业工作流与差标策略层
          detail: 落实全公司差旅规则的可配置业务逻辑
          modules:
            - 自动化差旅政策与审批引擎
            - FlexiPerk 算法退改退签模块
            - GreenPerk 碳排计算与碳抵消引擎
        - label: 系统集成与数据同步层
          detail: 打通企业业务系统的双向数据交互通道
          modules:
            - HRIS 连接器（Factorial、Workday、BambooHR）
            - 单点登录网关（Okta、Azure AD、OneLogin）
            - 财务与 ERP 发票开具连接器
        - label: 核心服务与业务逻辑层
          detail: 编排差旅交易的高并发后端服务
          modules:
            - Python/Django 应用程序服务
            - 异步预订与票务处理流水线
            - 24/7 人机协同支持调度系统
        - label: 供给聚合与供应商分销通道
          detail: 全球多渠道差旅供给分销网络
          modules:
            - GDS 系统集成（Amadeus、Sabre）
            - OTA 数据源（Booking.com、Expedia 供给）
            - 铁路与航司 NDC 直连网关
        - label: 金融科技、安全与云基础设施底座
          detail: 底层财务账本、合规管控与云托管基础设施
          modules:
            - 发卡与企业支出管理引擎
            - PCI-DSS、SOC 2 与 GDPR 合规框架
            - AWS 可扩展云基础设施与 KMS
  - id: FU001
    title: 客户旅程全景图
    type: journey-map
    summary: 客户全生命周期路径，涵盖差标初始化入驻、行程预订、费用对账及账户扩张全流程。
    data:
      items:
        - label: 需求发现与初始配置
          title: Discovery & Onboarding
          description: 企业配置差旅政策、审批层级及支付方式。
          touchpoints:
            - 管理后台配置
            - 差旅政策参数设定
            - 集成 HRIS 与报销工具
        - label: 搜索与选品
          title: Trip Search & Selection
          description: 员工在政策约束内搜索机票、酒店、火车与租车。
          touchpoints:
            - 消费级预订界面
            - 合规自动化筛选
            - 接入 Expedia 与 Booking.com 库存
        - label: 审批与结算
          title: Approval & Checkout
          description: 出行前自动化审批，支持企业统一账户即时结算。
          touchpoints:
            - 主管通知与一键审批
            - 企业统一发票与账单
            - 动态预算比对
        - label: 行程与支持
          title: In-Transit Support
          description: 针对行程延误与取消提供 24/7 主动旅客支持。
          touchpoints:
            - 移动端行程管理
            - 24/7 多渠道人工支持
            - 员工关怀与安全追踪
        - label: 报销与对账
          title: Expense Audit & Invoicing
          description: 统一对账结算，自动化集成费用管理系统。
          touchpoints:
            - 月度统一账单
            - ERP 费用数据自动同步
            - 差旅支出报表与分析
        - label: 复盘与拓展
          title: Account Expansion
          description: 季度业务复盘推动向更多子公司及支出模块渗透。
          touchpoints:
            - 季度业务复盘 (QBR)
            - 向全球运营实体推广
            - 推广活动管理模块
    approximationNotes: 生命周期阶段反映 SaaS 公开披露的工作流功能及典型的企业差旅管理部署阶段。
    claimRefs:
      - CU001
      - CU002
      - CU007
      - CU008
  - id: FR001
    title: 残余风险热力图
    type: matrix
    summary: 定性残余风险视图区分了已证实的风险敞口与尚未验证的缓解措施成熟度。
    data:
      columns:
        - 发生概率
        - 影响程度
        - 缓解成熟度
      rows:
        - label: 供应商预订或支付失败
          values:
            - 中
            - 高
            - 参差不齐
        - label: 数据隐私或安全事件
          values:
            - Unknown
            - 高
            - 仅限制度规范
        - label: 系统集成或账目核对失败
          values:
            - 中
            - 中
            - 部分落实
        - label: 客服支持与争议解决失效
          values:
            - 中
            - 中
            - 参差不齐
        - label: 流动性、债务或估值不透明
          values:
            - 中
            - 高
            - 程度有限
        - label: Yokoy 整合与美国市场扩张
          values:
            - 中
            - 高
            - 推进中
    approximationNotes: 分类定级基于所引证据的主观分析判断；因缺乏概率、损失金额、事故记录、现金流或集中度数据，本矩阵无法量化。
    claimRefs:
      - CR008
