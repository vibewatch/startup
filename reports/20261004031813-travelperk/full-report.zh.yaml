chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、平台架构与商业模式
        blocks:
          - type: paragraph
            body: >-
              TravelPerk 由 Avi Meir、Javier Suarez 和 Ron Levin 于 2015
              年在巴塞罗那创立，主打面向中小企业及中端市场的一体化企业差旅与费用管理平台。平台整合机票、铁路、住宿和地面交通预订，并内嵌差旅政策自动合规审查、集中统付账单以及全天候差旅支持。区别于传统旅行社或传统企业软件，TravelPerk
              采用软件驱动模式，将全球直接库存对接与工作流自动化相结合，大幅精简差旅行政管理。收购瑞士 AI 费用自动化服务商 Yokoy 后，TravelPerk
              进一步将业务从预订环节延伸至原生报销与支付处理，定位升级为端到端企业支出管理平台。
            claimRefs:
              - CO001
              - CO002
      - number: '1.2'
        title: 资本结构、Series E 估值与规模指标
        blocks:
          - type: paragraph
            body: >-
              自成立以来，TravelPerk 历经多轮股权与债权融资，累计融资约 $731 million 。 2025 年 1 月，公司完成由欧洲风投机构 Atomico 与 EQT Growth 领投的 $200
              million Series E 轮融资，投后估值达 $2.7 billion ，相比 2022 年 1 月 Series D 轮的 $1.3 billion 估值接近翻倍。 2024 年 6
              月，Blackstone 与 Blue Owl 为其提供 $135 million 私募信贷额度，进一步充实资本结构，专项用于支持北美扩张与战略并购。在商业化规模上，公司披露收入运行率已突破 $200
              million ，年度总预订额（GBV）超 $2.5 billion ，全球员工逾 1,500 人，并于 2024 年底自述实现 EBITDA 盈亏平衡。
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
          - type: table
            tableRef: TO001
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
      - number: '1.3'
        title: 高管团队、公司治理与资本阵营
        blocks:
          - type: paragraph
            body: >-
              高管团队以联合创始人兼首席执行官 Avi Meir 为核心，Meir 具备深厚的差旅科技创业经验，曾联合创立 Hotel Ninjas（已被 Booking.com 收购）并执掌 Budgetplaces.com
              产品线。 2023 年 10 月，TravelPerk 重组商业与运营管理架构：原首席营收官 Jean-Christophe Taunay-Bucalo 升任首席运营官；原 Deliveroo 与 Expedia
              营销高管 Yasmine Bratt 出任首席营收官；SaaS 销售资深专家 Stuart Blake 加盟担任北美区副总裁。公司治理与机构股东涵盖 Atomico、EQT Growth、General
              Catalyst、Kinnevik、SoftBank Vision Fund 2 及 Felix Capital 等全球一线投资机构，董事会成员包括 General Catalyst 董事总经理 Joel
              Cutler 与 Booking.com 前首席执行官 Gillian Tans 。
            claimRefs:
