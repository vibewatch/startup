      - number: '5.4'
        title: 专题展品
        blocks:
          - type: callout
            title: 消费级体验掩盖底层运营复杂性
            body: >-
              TravelPerk 最主要的产品成就在于将高度分散且陈旧的差旅供应链网络封装为统一的消费级用户界面。通过对差旅员工屏蔽复杂的 GDS 出票底层交互，同时将后台审批流全自动化，平台实现了极速的企业端用户上线部署
              [CE001, CE003]。
            calloutType: insight
            claimRefs:
              - CE001
              - CE003
          - type: callout
            title: 库存毛利空间与全渠道平价争议
            body: >-
              整合多家批发分销商与 OTA 渠道的酒店库存，导致企业客户直面价格倒挂：平台内酒店报价比酒店直订渠道高出 50% 至 100% 。若价差持续存在，企业财务团队可能绕开平台直接预订，从而破坏差旅政策的集中执行机制
              [CE013]。
            calloutType: risk
            claimRefs:
              - CE013
          - type: callout
            title: 向企业级开发者全面放开 API 编程权限
            body: >-
              为强化大型企业客户的粘性与留存，TravelPerk 需将开发者 API 权限从现有的管理员受限发票导出，进一步扩展至支持符合 OAuth2 规范的完整行程 Webhook 与 ERP 自动化打通管道
              [CE008]。
            calloutType: recommendation
            claimRefs:
              - CE008
