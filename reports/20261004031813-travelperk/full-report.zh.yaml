      - number: '4.3'
        title: 业务进展、资本充足率与投资核保结论
        blocks:
          - type: paragraph
            body: >-
              TravelPerk 展现出强劲的规模扩张轨迹，营收从 2022 年的 $100 million 跃升至 2023 年的约 $200 million ，年化总预订额逼近 $2 billion 。 2024 年 1
              月，公司完成由 SoftBank Vision Fund 2 领投的 $104 million Series D-1 轮融资，估值达 $1.4 billion ；随后在 2025 年 1 月完成由 Atomico
              与 EQT Growth 领投的 $200 million Series E 轮融资，投后估值升至 $2.7 billion 。累计股权与信贷总融资规模约达 $860 million 。公司宣布截至 2024
              年底按年化口径实现 EBITDA 盈亏平衡；此前在 2020 年行业寒冬中，公司削减 40%
              非人力固定开支并发放过桥可转债，避免了大范围裁员。尽管成绩显著，核心财务披露的缺失严重制约了正式投资核保。公司背负大额信贷额度（包含 Series D
              各期配套债务），但债务利率、到期日分布及财务契约条款完全保密。同样，经审计的合并损益表、整合 Yokoy 与 AmTrav
              的现金消耗率以及客户留存分层数据均未公布。尽管企业支出整合带来的高转换成本有助于夯实收入质量，但在投出资金前，面对 ~13.5x 的年化营收估值倍数，投资者必须实质核验其毛利率韧性及并购后的内生现金流健康度。
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: 专题展品
        blocks:
          - type: callout
            title: 双重变现模式锁定基础利润但放大宏观贝塔
            body: >-
              TravelPerk 将固定月度 SaaS 订阅费（$99–$299/月）与每笔预订 3%–5%
              的交易手续费相绑定，在锁定基础可预测软件收入的同时，充分享受客户差旅扩张的增长红利。然而，交易费在总收入中占据绝大比重，导致其经营现金流极易受到经济下行期企业冻结差旅预算的负面冲击。
