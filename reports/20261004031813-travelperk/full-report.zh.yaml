      - CR013
      - CR014
  - id: FV001
    title: 投资建议决策逻辑
    type: flow
    summary: 时序决策链将已披露的业务体量与支持按 2025 年一级市场估值入场所需、但仍缺失的关键证据区分开来。
    data:
      nodes:
        - label: 观察到的估值基准
          detail: 2022 年 $1.3B、2024 年 $1.4B，以及 2025 年 $2.7B
        - label: 经营业绩佐证
          detail: 公司自报年化收入超 $200M、预订交易额超 $2.5B
        - label: 盈利能力边界
          detail: 2024 年底 EBITDA 盈亏平衡不代表已具备现金造血能力
        - label: 资本结构隐忧
          detail: 已披露 $135M 债务；借款条款与清偿优先权仍未公开
        - label: 退出与客户风险
          detail: 短期内无 IPO 计划，客户评价零散且好坏参半
        - label: 投资建议
          detail: 继续跟进研究；待完成财务、法律及客户留存队列尽调后再行定价
    approximationNotes: 本推演流程属定性分析，未赋予概率、转化率或公允价值预估。
    claimRefs:
