  - number: 4
    title: 财务分析
    sections:
      - number: '4.1'
        title: 营收模式、定价架构与变现渠道
        blocks:
          - type: paragraph
            body: >-
              TravelPerk 的收入架构由软件订阅费、基于交易量的手续费分成以及差旅增值服务组成。平台向企业客户提供三档阶梯订阅：Starter（免费版，每笔预订收取 5%
              标准手续费，仅支持基础审批流）、Premium（每月 $99 基础费，预订手续费降至 3% ，支持高阶管控与差旅政策自动合规审查）以及 Pro（每月 $299 ，收取 3%
              预订费，解锁自定义审批层级、企业卡管控及高级分析报表）。除软件订阅和核心机酒火车预订佣金外，TravelPerk 依靠自研差旅保障功能获取高毛利收入：其中 FlexiPerk（对外亦称
              FlexiTravel）对全员覆盖方案按每趟行程加收 10% 费用，或对单次行程平均加收 20% 动态费用，承诺因任何理由取消均可获得 80% 现金退款。增值变现还包括增值税（VAT）退税服务、GreenPerk
              碳足迹抵消收费，以及 OpenAPI 生态的接口调用费。此外，收购瑞士 AI 支出管理公司 Yokoy 将变现链条延伸至全流程差旅与费用（T&E）处理、企业支付卡发卡及自动化发票归类。
