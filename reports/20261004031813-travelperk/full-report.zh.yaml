      - - 基准
        - 高于 $1.4B 但低于 $2.7B
        - 经审计增长达标、留存率尚可、现金转化转正且债务风险可控
        - 未分配数值概率
        - EBITDA 无法勾稽至现金流，或未披露具体证券条款
