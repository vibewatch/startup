      - number: '3.4'
        title: 专题展品
        blocks:
          - type: callout
            title: 刷卡返佣补贴差旅模式冲击交易手续费
            body: >-
              以 Ramp 和 Brex 为代表的新兴支出管理平台，完全依靠企业卡刷卡手续费分成补贴差旅业务，提供零费用差旅预订。随着这类平台不断扩充库存并完善跨境服务能力，TravelPerk 依赖「平台订阅费 + 3% 至
              5% 预订交易手续费」的混合模式正面临财务主管砍除差旅管理费用的严峻压价挑战。
