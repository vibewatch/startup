              - CO015
      - number: '1.5'
        title: 专题展品
        blocks:
          - type: callout
            title: 差旅与费用平台的战略整合
            body: >-
              TravelPerk 连续于 2024 年 6 月收购 AmTrav、 2025 年 1 月收购
              Yokoy，展现出构建原生差旅与支出管理能力的激进战略。公司以统一自研的报销基础设施替代第三方集成，旨在获取更高的软件客单价值，同时抵御单一差旅业务的高波动性。
            calloutType: insight
            claimRefs:
