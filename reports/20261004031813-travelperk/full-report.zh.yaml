      - number: '1.4'
        title: 并购轨迹、全球版图与运营阻力
        blocks:
          - type: paragraph
            body: >-
              TravelPerk 极度依赖系统化并购开拓新地域市场并扩充垂直软件功能。公司于 2021 年收购 Click Travel 确立英国市场领先地位， 2024 年收购总部位于芝加哥的 AmTrav 切入美国市场，
              2025 年收购总部位于苏黎世的 Yokoy 整合自动化费用管理。然而在亮眼的扩张数据背后，公开客户口碑暴露出运营隐患。Trustpilot 独立评价显示差旅端存在明显摩擦：平台酒店价格比供应商直采价高出 50%
              至 100% ，且频发预订遭取消事件以及行程受阻时的客服响应迟滞。
            claimRefs:
              - CO014
              - CO015
