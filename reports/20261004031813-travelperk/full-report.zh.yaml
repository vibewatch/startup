  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范畴与行业相邻赛道
        blocks:
          - type: paragraph
            body: >-
              企业差旅管理市场涵盖商旅预订、合规管控、员工关怀责任及企业费用对账。TravelPerk 将其核心目标客群圈定在欧美中小企业（SME）与中端市场企业，传统差旅管理公司（TMC）历来对该群体服务不足。 2024
              年，全球商旅市场反弹至 $1.5 trillion ，较疫情前水平增长 6% ，其中欧美集中了预估 $200 billion
              的目标市场空间。该品类囊括机票、酒店住宿、铁路差旅、租车支出及相关交易手续费，但不包括无管理的个人休闲旅游以及缺乏软件集成的独立企业信用卡发卡。行业相邻赛道包括企业支出管理、发票处理与自动化应付账款，TravelPerk
              正是通过收购瑞士金融科技服务商 Yokoy 完成了对这些相邻环节的战略整合。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM011
              - CM014
      - number: '2.2'
        title: 市场测算视角与 TAM/SAM/SOM 细分动态
        blocks:
          - type: paragraph
            body: >-
              评估 TravelPerk 的潜在市场空间，需从企业商旅总支出、中小企业差旅管理与支出管理软件三个维度综合拆解。全球广义企业商旅市场规模达 $1.5 trillion
              ，构成宏观总体边界。其中，TravelPerk 的可服务目标市场（SAM）聚焦于欧美中小企业及中端企业共计 $200 billion 的商旅支出池。据 6sense 软件技术图谱监测，TravelPerk
              在费用管理与报销软件品类中的当前市占率约为 0.12% ，在被追踪技术中位列第 34 位（监测到 391 个企业域名），而 QuickBooks、Xero 与 SAP Concur 等传统 ERP
              及财务平台仍占据统治地位。TravelPerk 的可获取市场（SOM）体现为其超 $2.5 billion （超 €2.40 billion ）的年化预订量及超 $200 million （超 €192
              million ）的年化营收，印证其正在欧洲与北美目标区域迅速渗透。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM007
      - number: '2.3'
        title: 买方客群划分、工作流归属与采购触发点
        blocks:
          - type: paragraph
            body: >-
              现代化差旅与费用管理软件的采纳，通常由财务主管、人力资源、行政主管及出差员工等多方共同决策。行业研究表明，当企业依赖无管控的消费级工具或死板的传统 TMC 门户时，历史上约有 50%
              的商旅行为超出公司政策规定，造成严重的预算流失与员工安全保障漏洞。财务高管（CFO 及财务副总裁）掌控差旅与费用总体预算，硬性要求系统对接
              ERP、内置审批流并支持自动化发票处理。差旅经理与行政协调员负责日常政策执行、供应商配置，并借助 TravelCare
              等功能落实员工关怀追踪。一线差旅员工则诉求移动端优先的预订灵活度、覆盖机酒火车的全量库存，以及行程异动时的全天候实时支持。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM012
              - CM016
      - number: '2.4'
        title: 增长驱动力、技术催化剂与普及阻力
        blocks:
          - type: paragraph
            body: >-
              三大核心顺风驱动市场渗透：全球商旅支出的后疫情复苏持续推进；分布式与远程办公团队扩张带来定期线下团建需求；企业对自动化报销对账以及借助 GreenPerk 等 ESG
              方案追踪碳足迹的需求激增。技术层面的持续投入，如用于预订后行程变更的 AI 助手（如
              Juno）及与航空公司的直接新分销能力（NDC）直连，提升了出行体验并优化了运营毛利。但业务普及仍面临显著逆风：宏观经济波动与企业降本增效可能压缩非刚性差旅预算；Amex GBT、BCD Travel 与 SAP
              Concur 等传统巨头深筑大型企业关系壁垒，技术型对手 Navan 在中端市场展开激进争夺；此外，航司与酒店供应商大力扶持直订渠道，加之客户对人工客服的高依赖性，均推高了运营扩张成本。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 专题展品
        blocks:
          - type: callout
            title: 企业差旅预订与支出管理的边界融合
            body: >-
              企业差旅预订（TMC）与费用报销之间的传统界限正加速瓦解。TravelPerk 收购 Yokoy 顺应了整个行业的发展趋势：金融科技平台（如 Brex、Ramp）与现代差旅聚合平台（如
              Navan）纷纷抢滩一体化财务工作流。
            calloutType: insight
            claimRefs:
              - CM004
              - CM015
          - type: callout
            title: 供应商去中介化与直订渠道挤压
            body: 主要航空公司与大型连锁酒店持续发力自有直订门户，并推行新分销能力（NDC）差异化加价政策。一旦供应商收紧库存接口或惩罚第三方聚合平台报价，TravelPerk 的库存优势与价格竞争力将承受严峻压力。
            calloutType: risk
            claimRefs:
              - CM014
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与替代品类
        blocks:
          - type: paragraph
            body: >-
              企业差旅与支出管理行业主要分化为三大竞争阵营：现代数字原生平台、传统跨国差旅管理公司（TMC）以及基于企业信用卡的支出管理服务商。TravelPerk 定位为智能一体化差旅与支出管理平台，重点服务欧美 50 至
              1,000 人规模的中小企业（SMB）及中端市场企业。其最直接的数字原生竞品为 Navan（原 TripActions），同样深度打通预订、企业卡与报销体系。以 SAP Concur 及 American
              Express Global Business Travel（含 Egencia）为代表的传统大型软件巨头，依托传统全球分销系统（GDS）、深厚 ERP
              集成与全球线下差旅顾问网络，牢牢把控跨国大客户渠道。与此同时，Ramp 和 Brex 等新兴支出管理平台推出与企业卡绑定的原生商旅预订模块，对符合资质的成长型企业直接免收差旅软件费。在商业软件之外，直接使用
              Expedia 和 Booking.com 等消费级网站的无序预订仍是 TravelPerk 争夺交易量的主要替代形态；而部分复杂跨国巨头则常依托 Drupal 等企业内容管理系统搭配定制 API
              搭建内部预订流。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP007
              - CP008
              - CP009
              - CP010
      - number: '3.2'
        title: 竞品画像与差异化战略
        blocks:
          - type: paragraph
            body: >-
              各家差旅管理服务商的核心差异化壁垒，取决于库存广度、软件上线速度与费用自动化深度的综合博弈。Navan 构成最直接的结构性挑战：其利用高频预测性 AI
              自动化推荐行程，并提供打通实体卡与虚拟卡的企业卡方案，直接免除员工贴票报销流程。TravelPerk 迎战 Navan 的核心抓手在于欧洲铁路库存深度、接入 25 家航司的 Amadeus
              与新分销能力（NDC）直连，以及透明的固定月费阶梯价格（$0 Starter、$99 Premium 与 $299 Pro），规避了按人头计费的高额席位成本。在大型企业层级，SAP Concur 凭借与 SAP
              S/4HANA、Oracle 和 Workday 的原生协同及多层合规审计流，仍是财富 500 强与高合规要求机构的行业标杆；但 Concur 需耗费数月落地培训并依赖专业服务，而 TravelPerk
              仅需数天即可完成部署。在差旅外包托管领域，Egencia 仰仗 Amex GBT 的全球差旅网络、企业协议价及针对复杂多程出行的智能检索；TravelPerk 则以数字化自主平台为主，搭配全天候人工客服及特有的
              FlexiPerk 随时退票保障形成鲜明差异。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
