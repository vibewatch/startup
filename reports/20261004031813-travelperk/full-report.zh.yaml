companyProfile:
  summary: >-
    TravelPerk 成立于 2015 年，总部位于巴塞罗那，是一家企业差旅及费用管理平台。公司面向中小企业（SMB）及中端市场客户，销售软件驱动的差旅预订、合规审批、支付及支出管理工作流，并先后收购 AmTrav 与 Yokoy
    推进扩张。公开披露数据显示，其年化营收已突破 $200 million ，年度总预订额超过 $2.5 billion ，且自述已实现 EBITDA 盈亏平衡；但公司迄今未公布经审计的合并财务报表或核心留存指标。
