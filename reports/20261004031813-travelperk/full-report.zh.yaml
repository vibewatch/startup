  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台全貌与企业工作流自动化
        blocks:
          - type: paragraph
            body: >-
              TravelPerk 打造了一体化商旅与费用管理平台，自动化执行企业差旅工作流，同时筑牢预算与合规防线 [CE001,
              CE003]。区别于传统差旅服务商或消费级订票网站，该平台将端到端行程规划、自动审批、集中开票支付及实时员工安全保障统一归拢 [CE002,
              CE003]。企业管理员可直接在后台配置精细化差旅政策、员工差旅级别权限、审批层级及成本中心归属
              [CE003]。员工发起预订时，搜索界面实时筛选全球机票、酒店、铁路与租车库存，主动高亮合规选项，在正式出票前杜绝违规支出 [CE001, CE003]。


              在基础预订之外，TravelPerk 融合了多项增值自动化模块，包括允许在出发前两小时随时退票并返还 80% 现金的 FlexiPerk，以及对接环保咨询机构测算并抵消企业差旅碳足迹的 GreenPerk
              [CE002, CE006, CE007]。企业支出工作流延伸至预订后的报销对账，涵盖自动开票、企业卡对接及 HRIS 人力系统数据同步 [CE004, CE005]。TravelPerk 借助双向 API
              接口与 Factorial 等 HR 平台对接，实时同步组织架构、管理汇报链与办公地点等员工核心元数据
              [CE005]。这种底层架构的自动化大幅减轻了财务部门的行政琐耗，同时让分散在各地的差旅员工在既定制度内享有充分的出行自主权 [CE001, CE003]。
