      - number: '5.2'
        title: 技术架构、微服务与集成边界
        blocks:
          - type: paragraph
            body: >-
              TravelPerk 的工程架构将现代 Web 服务与对接外部全球分销系统（GDS）及第三方供应商聚合器的复杂管道融为一体 [CE002, CE008, CE009]。核心产品研发以后端 Python 和
              Django 为基石，前端采用 React 构建 Web 界面，全部托管于 Amazon Web Services (AWS) 云设施之上
              [CE009]。研发团队按跨职能敏捷小组矩阵划分各业务线，落地持续集成、单元测试及自动化 AI 辅助代码审查流程 [CE010,
              CE011]。随着业务纵深跨入支出管理与企业卡领域，专门设立的工程敏捷小组主导企业卡交互、银行接口对接、交易分类账本及穿透各欧洲司法辖区的复杂资金清结算流水 [CE010, CE011]。


              外部生态互联依托公开及合作伙伴 API、Webhook 触发器以及对接主流企业软件的预置插件展开 [CE004, CE005, CE008]。然而第三方 API 评估显示，TravelPerk
              的开放编程接口受到严格受限：管理级 API 密钥仅对专属客户经理开放，细颗粒度调用端点极为有限，且各 SDK 间的 OAuth2 完整实现参差不齐 [CE008]。此外，对接企业遗留 ERP 软件以及适配
              Okta、Azure AD 和 OneLogin 等各异的单点登录（SSO）身份认证服务仍面临反复出现的交付阻碍 [CE004, CE008]。尽管核心平台已支撑逾 10,000
              家企业客户，但其系统级程序化接入仍明显附属于自有的 Web 端与移动端界面 [CE004, CE008, CE011]。
