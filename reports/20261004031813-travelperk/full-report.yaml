chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Platform Architecture, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Founded in 2015 in Barcelona by Avi Meir, Javier Suarez, and Ron Levin, TravelPerk provides an integrated
              corporate travel and expense management platform targeted primarily at small and mid-market enterprises.
              The platform unifies flight, rail, lodging, and ground transportation booking with automated corporate
              travel policy compliance, consolidated billing, and continuous traveler support. Unlike traditional travel
              agencies or legacy enterprise tools, TravelPerk operates a software-led model combining direct global
              inventory integrations with workflow automation to simplify travel administration. Following its
              acquisition of Swiss AI expense automation provider Yokoy, TravelPerk has expanded beyond reservation
              workflows into native expense and payment processing, positioning itself as an end-to-end corporate spend
              platform.
            claimRefs:
              - CO001
              - CO002
      - number: '1.2'
        title: Capitalization Structure, Series E Valuation, and Scale Metrics
        blocks:
          - type: paragraph
            body: >-
              TravelPerk has raised approximately $731 million in cumulative equity and debt capital across multiple
              financing rounds since inception. In January 2025, the company completed a $200 million Series E financing
              round led by European venture capital firm Atomico and EQT Growth, nearly doubling its post-money
              valuation to $2.7 billion from its prior $1.3 billion Series D valuation achieved in January 2022. The
              capital structure was further augmented in June 2024 by a $135 million private credit facility provided by
              Blackstone and Blue Owl to fund North American expansion and M&A. Commercially, the company reported
              exceeding $200 million in annual revenue run-rate and $2.5 billion in annual gross booking volume,
              reaching self-reported EBITDA break-even by late 2024 with a global workforce exceeding 1,500 employees.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
