  - id: TE002
    title: Enterprise Workflow and Use-Case Efficiency Table
    notes: >-
      Evaluates standard corporate travel and spend administration tasks comparing legacy manual approaches with
      TravelPerk automation.
    columns:
      - User Job / Workflow
      - Legacy Corporate Method
      - TravelPerk Solution
      - Measurable Operational Benefit
      - Technical & Workflow Limitation
    rows:
      - - Traveler Booking & Policy Compliance
        - Manual back-and-forth emails with travel agencies or off-platform DIY booking with post-facto audit.
        - In-app automated policy engine applying price caps, cabin restrictions, and pre-trip approvals.
        - Eliminates unauthorized out-of-policy bookings and shortens booking time to minutes.
        - Rigid policy rules can frustrate executive travelers requiring contextual exceptions.
      - - Trip Cancellation & Rescheduling
        - Protracted negotiations with airline desks and non-refundable ticket forfeitures.
        - FlexiPerk automated one-click cancellation up to two hours before departure with guaranteed 80% refund.
        - Recovers substantial trip spend and eliminates administrative cancellation disputes.
        - Carries a fee premium (typically 3%–5% per trip) that inflates total travel budgets.
      - - Expense Reporting & Invoicing
        - Manual receipt scanning, spreadsheet collation, and item-by-item reconciliation.
        - Consolidated monthly billing, digital invoice extraction, and automated accounting sync.
        - Reduces employee expense filing time and streamlines month-end accounting close.
        - Discrepancies arise when third-party hotel incidentals require manual offline submission.
      - - Employee Lifecycle Synchronization
        - Manual employee onboarding and role termination across corporate travel profiles.
        - Automated HRIS connector synchronizing employee profiles, departments, and managerial reporting lines.
        - Prevents orphan travel accounts and ensures immediate access revocation upon departure.
        - Requires standardized HR data schemas; non-standard role mappings require manual intervention.
      - - 24/7 Traveler Emergency Assistance
        - Call-center hold queues and delayed agency response during off-hours flight disruptions.
        - Omni-channel human-in-the-loop support via chat, phone, and email with rapid SLA response.
        - Provides immediate safety reassurance and rapid rebooking during transit crises.
        - Support agents occasionally struggle with complex non-European localized transit connections.
