      - number: '1.4'
        title: M&A Trajectory, Geographic Footprint, and Operational Friction
        blocks:
          - type: paragraph
            body: >-
              TravelPerk's growth strategy relies heavily on programmatic M&A to enter new geographic markets and expand
              vertical software functionality. The company established market leadership in the United Kingdom through
              its 2021 purchase of Click Travel, entered the United States via its 2024 acquisition of Chicago-based
              AmTrav, and integrated automated expense management through its 2025 purchase of Zurich-based Yokoy.
              Despite strong headline expansion, public customer sentiment reveals operational vulnerabilities.
              Independent reviews on Trustpilot highlight traveler friction, specifically noting hotel pricing premiums
              ranging between 50% and 100% above direct supplier rates, alongside reservation cancellation incidents and
              customer service delays during travel disruptions.
            claimRefs:
