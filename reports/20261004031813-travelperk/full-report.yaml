  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Industry Adjacencies
        blocks:
          - type: paragraph
            body: >-
              The corporate travel management market encompasses business travel booking, policy compliance, duty of
              care, and corporate expense reconciliation. TravelPerk defines its core addressable space around small and
              medium-sized enterprises (SMEs) and mid-market corporations across Europe and North America, segments
              historically underserved by traditional travel management companies (TMCs). In 2024, the global corporate
              travel market rebounded to $1.5 trillion, surpassing pre-pandemic levels by 6%, with an estimated $200
              billion addressable opportunity concentrated in North America and Europe. The category includes spend on
              flights, hotel accommodations, rail travel, car rentals, and associated transaction fees, while excluding
              unmanaged consumer leisure travel and standalone corporate card issuing without software integration.
              Industry adjacencies include corporate spend management, invoice processing, and automated accounts
              payable, which TravelPerk integrated through its strategic acquisition of Swiss fintech provider Yokoy.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM011
              - CM014
      - number: '2.2'
        title: Market Sizing Lenses and Segment TAM/SAM/SOM Dynamics
        blocks:
          - type: paragraph
            body: >-
              Evaluating TravelPerk's addressable universe requires multiple sizing lenses across total corporate travel
              spend, SME travel management, and spend management software. The broad global corporate travel market
              stands at $1.5 trillion, representing the overall macro boundary. Within that total, TravelPerk's
              serviceable addressable market (SAM) focuses on the $200 billion corporate travel spend pool across US and
              European SMEs and mid-market companies. A specialized software technographics lens from 6sense estimates
              TravelPerk's current share in the expense management and reporting software category at 0.12%, ranking #34
              among tracked technologies with 391 enterprise domains detected, where legacy ERP and accounting platforms
              such as QuickBooks, Xero, and SAP Concur maintain commanding market shares. TravelPerk's serviceable
              obtainable market (SOM) is represented by its annualized booking volume exceeding $2.5 billion (over €2.40
              billion) and annual revenue surpassing $200 million (over €192 million), demonstrating rapid penetration
              in its target European and North American geographies.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
