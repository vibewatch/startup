            title: Strategic Platform Consolidation Across Travel and Expense
            body: >-
              TravelPerk's back-to-back acquisitions of AmTrav in June 2024 and Yokoy in January 2025 demonstrate an
              aggressive strategy to build native travel and spend management capabilities. By shifting from third-party
              integrations to unified in-house expense infrastructure, the company seeks to capture higher software
              wallet share while insulating against standalone travel volatility.
            calloutType: insight
