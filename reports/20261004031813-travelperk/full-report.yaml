        title: Executive Leadership, Governance, and Capital Sponsors
        blocks:
          - type: paragraph
            body: >-
              Executive leadership is anchored by co-founder and Chief Executive Officer Avi Meir, an experienced travel
              technology entrepreneur who previously co-founded Hotel Ninjas (acquired by Booking.com) and led product
              at Budgetplaces.com. In October 2023, TravelPerk restructured its commercial and operational leadership by
              elevating former Chief Revenue Officer Jean-Christophe Taunay-Bucalo to Chief Operating Officer, while
              recruiting former Deliveroo and Expedia marketing executive Yasmine Bratt as Chief Revenue Officer and
              SaaS sales veteran Stuart Blake as Vice President of North America. Governance and institutional equity
              backing span tier-one global investors including Atomico, EQT Growth, General Catalyst, Kinnevik, SoftBank
              Vision Fund 2, and Felix Capital, with board representation including General Catalyst Managing Director
              Joel Cutler and former Booking.com CEO Gillian Tans.
