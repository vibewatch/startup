  - id: TV001
    title: Recommendation Summary
    columns:
      - Decision dimension
      - Current view
      - Evidence boundary
      - Decision implication
    rows:
      - - Recommendation
        - research-more
        - Observed private financing marks, but no current audited underwriting package
        - Do not commit capital before financial and legal diligence
      - - Confidence
        - medium
        - Financing marks are corroborated; economics and security terms are not
        - Confidence can rise only with primary financial and contractual evidence
      - - Risk rating
        - medium-high
        - $135M debt disclosed without public terms; private securities are illiquid
        - Model debt service, preferences, and exit timing before pricing common equity
      - - Valuation stance
        - stretched at the $2.7B reference mark
        - Headline valuation is less than 13.5x disclosed annualized revenue, not ARR
        - Require substantial proof before accepting the 2025 mark or a premium
      - - Target return / hold
        - not supportable
        - No entry security terms, dilution model, or near-term IPO plan
        - Set return hurdles only after cap-table, preference, and exit analysis
    notes: >-
      Judgment uses January 2022, January 2024, and January 2025 private-round disclosures; annualized revenue is not
      ARR, and funding raised is not cash available.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV008
      - CV010
      - CV011
      - CV016
  - id: TV002
    title: Thesis and Anti-Thesis
    columns:
      - Pillar
      - Thesis evidence
      - Anti-thesis / uncertainty
      - What would change the view
    rows:
      - - Scale
        - Company reported >$2.5B annualized booking volume
        - Booking volume is not revenue and does not establish take rate or margin
        - Audited revenue bridge and take-rate history
      - - Growth
        - Company reported >50% annual growth over the prior two years
        - No current cohort, retention, or organic-versus-acquired growth split
        - Audited organic growth and cohort retention
      - - Profitability
        - Company reported EBITDA break-even at end-2024
        - Accounting EBITDA is not operating cash flow
        - Positive free cash flow after integration and debt service
      - - Product breadth
        - All-equity Yokoy acquisition adds expense and payment capabilities
        - Integration economics and cross-sell evidence are not public
        - Attach, retention, and margin data for combined customers
      - - Customer value
        - Archived review distribution contained a 71% five-star share
        - One reviewer alleged 50%-100% hotel-rate premiums and booking failures
        - Representative win-loss, pricing, support, and churn data
      - - Capital and exit
        - Repeated institutional financings established rising private marks
        - $135M debt terms are undisclosed and management reported no near-term IPO plan
        - Full capitalization, credit agreement, and credible liquidity plan
    notes: >-
      Customer-review evidence is anecdotal and dated to 2024; company operating metrics are management claims for
      periods ending in 2024, not independently audited current results.
