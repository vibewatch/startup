      - "Required assumptions"
      - "Probability signal"
      - "Downside / trigger"
    rows:
      - - "Bear"
        - "At or below $1.4B"
        - "Growth decelerates, cash conversion remains unproven, or integration adds costs"
        - "No numeric probability assigned"
        - "Down round, covenant pressure, or systematic customer-value issues"
      - - "Base"
        - "Above $1.4B but below $2.7B"
        - "Audited growth, acceptable retention, positive cash conversion, and manageable debt"
        - "No numeric probability assigned"
        - "Failure to reconcile EBITDA with cash flow or disclose security terms"
      - - "Bull"
        - "$2.7B or higher"
        - "Current audited scale, durable margins, strong cohorts, successful Yokoy integration, and clear liquidity"
        - "No numeric probability assigned"
        - "Any material miss on growth, margin, retention, leverage, or exit readiness"
    notes: "Analyst entry-discipline bands are anchored to disclosed January 2024 and January 2025 private valuations; they are not fair-value forecasts, enterprise values, or promised returns."
    claimRefs:
