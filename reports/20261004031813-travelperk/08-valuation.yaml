chapter:
  number: 8
  title: "Valuation"
  summary: "The assigned evidence supports a research-more recommendation: TravelPerk's January 2025 financing established a $2.7 billion private valuation, but the public record does not disclose the current audited economics, capital terms, or exit path needed to underwrite that price. Entry should remain contingent on diligence rather than a precise fair-value estimate."
sections:
  - id: "recommendation-and-price-discipline"
    title: "Recommendation and Price Discipline"
    body: >-
      The recommendation is research-more with medium confidence and medium-high
      risk. The strongest price evidence is a January 2025 $200 million financing
      at a $2.7 billion valuation, corroborated by CNBC and the company. Against
      company-reported annualized revenue above $200 million, that mark implies a
      headline valuation-to-annualized-revenue ratio below 13.5x, not an ARR
      multiple and not an enterprise-value multiple. The denominator is dated,
      unaudited public disclosure; the numerator does not adjust for debt, cash,
      preferences, or the all-equity Yokoy consideration. A target return and
      hold period therefore are not supportable from the assigned evidence.
      Investment discipline should be expressed as diligence conditions and
      price bands anchored to observed private rounds, not as a point estimate.
    claimRefs:
      - "CV001"
      - "CV004"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV016"
    tableRefs:
      - "TV001"
  - id: "thesis-and-antithesis"
    title: "Thesis and Anti-Thesis"
    body: >-
      The thesis is operating scale plus product expansion: Perk reported more
      than $2.5 billion of annualized booking volume, annualized revenue above
      $200 million, growth above 50% per year for the preceding two years, and
      EBITDA break-even at the end of 2024. Yokoy was acquired with equity,
      extending the proposition from travel into expense and payments. Those are
      useful proof points, but they remain company-issued and EBITDA break-even
      is not evidence of positive operating cash flow. The anti-thesis is that
      customer value and service quality are uneven. An archived Trustpilot page
      contained both a 71% five-star share and a 16% one-star share, while one
      reviewer alleged hotel rates 50% to 100% above direct booking and booking
      failures. That anecdote is adverse evidence, not a representative churn or
      pricing benchmark.
    claimRefs:
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV009"
      - "CV012"
      - "CV013"
      - "CV014"
    tableRefs:
      - "TV002"
  - id: "scenario-and-capital-context"
    title: "Scenario and Capital Context"
    body: >-
      The financing history offers three observable reference points rather than
      a conventional comparable-company set: $1.3 billion in January 2022, $1.4
      billion in January 2024, and $2.7 billion in January 2025. These marks
      bracket entry-price scenarios but do not establish fair value because each
      round may carry different rights and because no public cap table was
      available in the assigned evidence. CNBC also reported $135 million of
      debt financing in 2024. Funding raised is not cash available, and the
      evidence does not disclose interest, maturity, covenants, cash balance, or
      liquidation preferences. The bear, base, and bull bands therefore are
      decision thresholds: the higher the proposed entry price, the more
      operating proof and contractual transparency are required. No numeric
      scenario probability is defensible from this source set.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV010"
    tableRefs:
      - "TV003"
    figureRefs:
      - "FV001"
  - id: "exit-readiness-and-diligence"
    title: "Exit Readiness and Final Diligence"
    body: >-
      Exit readiness is not demonstrated by the financing mark. In January 2025,
      management told CNBC there was no short-term IPO plan, while a private
      markets source separately cautions that private-company investments are
      illiquid and may face transfer restrictions. The final decision should
      require audited consolidated financials; revenue composition and gross
      margin by booking, subscription, and financial-services stream; cohort
      retention and net revenue retention; free cash flow; the debt agreement;
      the preference stack and fully diluted cap table; Yokoy integration data;
      and a credible liquidity path. Thesis-break triggers are a down round,
      covenant pressure, sustained negative free cash flow despite claimed
      EBITDA break-even, material retention deterioration, or evidence that
      customer pricing and service complaints are systematic rather than
      isolated.
    claimRefs:
      - "CV007"
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV015"
      - "CV016"
