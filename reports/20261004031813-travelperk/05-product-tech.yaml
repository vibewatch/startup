callouts:
  - calloutType: "insight"
    title: "Consumer-Grade Interface Masking Operational Complexity"
    body: "TravelPerk's primary product achievement is presenting a unified consumer-grade interface atop highly fragmented, legacy travel inventory networks. By shielding travelers from complex GDS booking mechanics while automating back-office approval workflows, the platform achieves rapid corporate user onboarding [CE001, CE003]."
    claimRefs:
      - "CE001"
      - "CE003"
  - calloutType: "risk"
    title: "Inventory Margin and Rate Parity Friction"
    body: "Aggregating lodging inventory across multiple wholesale brokers and OTAs exposes corporate clients to rate disparities where in-platform hotel rates exceed direct supplier rates by 50% to 100%. If pricing differentials persist, corporate finance teams risk bypassing the platform, eroding travel policy compliance [CE013]."
    claimRefs:
      - "CE013"
  - calloutType: "recommendation"
    title: "Expand Programmatic API Access for Enterprise Developers"
    body: "To deepen customer retention within enterprise accounts, TravelPerk should expand developer-facing API surfaces beyond basic admin-managed invoice exports to support comprehensive, OAuth2-compliant trip webhooks and automated ERP integration flows [CE008]."
    claimRefs:
      - "CE008"
