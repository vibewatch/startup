  topStrengths:
    - Large and growing corporate travel footprint with more than 12,000 customer organizations
    - Publicly reported scale above $200 million of annualized revenue with EBITDA break-even at the end of 2024
    - Product breadth expanded materially through the Yokoy acquisition
  topRisks:
    - Audited consolidated financials, free cash flow, and retention metrics are still not publicly disclosed
    - Debt terms, cap-table preferences, and liquidity path remain opaque
    - Customer review evidence still shows pricing and service-friction complaints
  unresolvedGaps:
    - Audited consolidated financial statements and cash flow bridge for FY2024-FY2025
