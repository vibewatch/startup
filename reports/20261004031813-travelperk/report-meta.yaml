companyProfile:
  summary: >-
    TravelPerk is a Barcelona-based corporate travel and expense management platform founded in 2015. It sells
    software-led booking, policy, payment, and spend-management workflows to SMB and mid-market customers, and it has
    expanded through acquisitions including AmTrav and Yokoy. Publicly disclosed scale now includes more than $200
    million of annualized revenue, more than $2.5 billion of booking volume, and self-reported EBITDA break-even, but
    the company still does not publish audited consolidated financial statements or core retention metrics.
