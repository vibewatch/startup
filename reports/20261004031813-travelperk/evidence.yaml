evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-reporting-gaps
    missingEvidence: Audited gross margin percentage, net revenue retention (NRR), and operating cash burn details post-Series E.
    whyItMatters: >-
      Without audited gross margin and cohort retention disclosures, assessing the sustainability of the $2.7B valuation
      multiple and underlying SaaS unit economics remains constrained.
    diligencePath: >-
      Request audited consolidated financial statements, subscription cohort retention schedules, and margin bridges
      during confirmatory diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: Full enumeration of executive committee members, board voting seats, and key-person retention agreements.
    whyItMatters: >-
      Evaluating leadership depth and succession planning requires complete visibility into executive contracts and
      board committee governance structures.
    diligencePath: Review company governance charter, cap table voting agreements, and senior executive employment contracts.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Complete share registry, liquidation preference stack, and specific equity ownership percentages for institutional
      investors.
    whyItMatters: >-
      Assessing governance control, shareholder dilution, and downside liquidation protections across Series A through
      Series E requires a verified capitalization table.
    diligencePath: Obtain the certified cap table and shareholder agreement from company counsel during formal diligence.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: market-share-and-customer-count
    missingEvidence: >-
      Reconciliation between technographic web-tracker estimates (391 customer domains detected by 6sense) and company
      disclosures of over 10,000 active accounts.
    whyItMatters: >-
      Technographic scanners fail to observe internal enterprise subdomains and private corporate portals, understating
      actual B2B penetration.
    diligencePath: >-
      Verify customer account definitions, active booking frequency thresholds, and cohort retention directly from
      audited internal management reports.
    relatedQuestionRefs:
      - QM005
      - QM008
  - type: private-evidence-only
    severity: material
    topic: net-revenue-retention-and-take-rate
    missingEvidence: >-
      Segment-level Net Revenue Retention (NRR) and take-rate breakdowns across airline NDC, hotel GDS, and SaaS
      subscription tiers.
    whyItMatters: >-
      Private take-rate economics govern gross margin durability as corporate travel booking converges with spend
      management.
    diligencePath: >-
      Review unaudited transaction ledger cuts and partner supplier agreement commission tiers during confidential
      diligence.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: win-loss-rates
    missingEvidence: Audited head-to-head win/loss rates between TravelPerk and Navan in European and US mid-market sales cycles.
    whyItMatters: >-
      Direct commercial win rates indicate whether TravelPerk's flat SaaS pricing and rail inventory offset Navan's AI
      booking automation.
    diligencePath: Request internal sales enablement win/loss telemetry and churn reason logs from executive management.
    relatedQuestionRefs:
      - QP002
      - QP006
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: minor
    topic: hotel-markup-dispersion
    missingEvidence: >-
      Comprehensive price dispersion audit comparing TravelPerk hotel inventory rates directly against consumer OTAs and
      hotel direct portals.
    whyItMatters: Systematic hotel markup discrepancies undermine customer ROI and drive corporate traveler out-of-policy leakage.
    diligencePath: Conduct secret-shopper automated price comparison across top 100 corporate travel city pairs.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: debt-covenants-and-interest
    missingEvidence: >-
      Audited interest rates, amortization schedules, debt service requirements, and financial covenants for
      TravelPerk's credit facilities.
    whyItMatters: >-
      Debt service commitments and restrictive covenants directly constrain operating cash flow and determine capital
      adequacy during macro travel volume downturns.
    diligencePath: >-
      Review audited statutory accounts filed at UK Companies House and request senior credit facility agreements from
      management.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-nrr
    missingEvidence: >-
      Audited gross margin percentages and historical net revenue retention (NRR) and gross revenue retention (GRR)
      cohorts across client tiers.
    whyItMatters: >-
      Gross margin verification is essential to validate software-like multiple underwriting, while NRR proves whether
      client expansion offsets churn.
    diligencePath: >-
      Request customer cohort revenue bridges and management accounts segmenting cost of goods sold between software
      infrastructure and ticketing operations.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cancellation-underwriting-mechanics
    missingEvidence: >-
      Underwriting loss ratios, claim volumes, and reinsurer backing agreements for the FlexiPerk 80% refund
      cancellation guarantee.
    whyItMatters: >-
      FlexiPerk represents a core commercial differentiator, but private loss ratios determine whether the guarantee is
      sustainably self-funded or subsidized by venture capital.
    diligencePath: >-
      Request audited actuaries or insurance partnership contracts detailing loss ratios and risk-pooling structures for
      FlexiPerk.
    relatedQuestionRefs:
      - QE002
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: inventory-take-rate-and-gds-contracts
    missingEvidence: >-
      Contractual supplier commission schedules, GDS segment incentive rebates, and direct airline NDC connection
      agreements.
    whyItMatters: >-
      Inventory commercial terms explain retail pricing disparities and determine gross margin durability across flight,
      hotel, and rail segments.
    diligencePath: Review vendor distribution agreements with Amadeus, Sabre, and major hotel aggregators under confidentiality.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: public-developer-ecosystem-metrics
    missingEvidence: Public API SDK download metrics, developer portal documentation, and third-party webhook partner volume.
    whyItMatters: Programmatic extensibility influences enterprise stickiness and automated ERP data flow reliability.
    diligencePath: Inspect the restricted developer portal and sample enterprise API telemetry logs during technical due diligence.
    relatedQuestionRefs:
      - QE004
    relatedTableRefs:
      - TE002
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-expansion
    missingEvidence: >-
      Audited Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and annual logo churn rates broken down by SMB
      vs enterprise cohorts.
    whyItMatters: >-
      Without NRR and cohort churn disclosures, underwriters cannot evaluate whether customer lifetime value (LTV) and
      organic account expansion support the company's valuation multiple.
    diligencePath: >-
      Request confidential historical cohort retention tables and quarterly NRR performance data from TravelPerk
      investor relations during management diligence.
    relatedQuestionRefs:
      - QU008
  - type: private-evidence-only
    severity: material
    topic: customer-growth-adoption-trajectory-table
    missingEvidence: Active monthly booking customer counts and average transaction volume per corporate account.
    whyItMatters: >-
      Gross registered customer count numbers (10,000+ to 12,000+) do not differentiate between dormant self-serve
      accounts and active high-volume enterprise spenders.
    diligencePath: Request customer activity distributions and GMV concentration across the top 100 enterprise accounts.
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: minor
    topic: named-customer-proof-table
    missingEvidence: >-
      Contract duration, annual booking spend, and multi-year renewal commitments for named enterprise clients including
      Wise, Adyen, and Breitling.
    whyItMatters: >-
      Verifying whether enterprise clients utilize TravelPerk as their exclusive global travel platform or alongside
      legacy TMCs is vital for assessing wallet-share durability.
    diligencePath: >-
      Conduct reference calls with procurement directors at named customer accounts to evaluate contract exclusivity and
      renewal intentions.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: legal-compliance
    missingEvidence: >-
      Current regulator records, court dockets, licenses where applicable, security certifications, penetration-test
      summaries, DPA terms, subprocessor inventory, and material privacy or security incident history.
    whyItMatters: >-
      A supplier policy shows expected behavior but cannot establish TravelPerk's legal posture, control effectiveness,
      or absence of enforcement and incidents.
    diligencePath: >-
      Obtain counsel's jurisdictional memorandum, regulator and court searches, current certifications,
      security-assurance reports, DPA and subprocessor materials, and a management-certified incident schedule.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-risk
    missingEvidence: >-
      Audited consolidated financials, cash balance, free-cash-flow history, debt principal, interest, maturity and
      covenants, acquisition consideration, and a monthly runway plan.
    whyItMatters: >-
      Funding raised is not cash available, and a press-release EBITDA break-even claim does not establish cash
      generation or covenant headroom.
    diligencePath: >-
      Review audited statements, bank balances, debt and cap-table schedules, covenant certificates, board budgets, and
      actual-versus-plan cash reporting.
    relatedQuestionRefs:
      - QR004
      - QR006
  - type: private-evidence-only
    severity: material
    topic: operational-risk
    missingEvidence: >-
      Uptime and incident history, booking and payment failure rates, refund aging, support SLA attainment, supplier
      concentration, integration error rates, and implementation cohorts.
    whyItMatters: >-
      Public reviews identify plausible failure modes but provide no denominator or trend with which to estimate
      frequency, loss, or mitigation effectiveness.
    diligencePath: >-
      Sample twelve months of incident, support, booking, supplier, refund, and connector data; reconcile the results to
      customer credits, churn, and contractual SLA reports.
    relatedQuestionRefs:
      - QR002
      - QR003
      - QR005
      - QR006
    relatedTableRefs:
      - TR002
      - TR003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-risk-register
    missingEvidence: >-
      A complete jurisdiction-by-jurisdiction inventory of licenses, regulatory obligations, litigation, enforcement,
      privacy registrations, and customer-contract liabilities.
    whyItMatters: >-
      The public-source register covers only evidenced categories and cannot support a claim that all legal and
      regulatory risks have been enumerated.
    diligencePath: >-
      Commission local-counsel and compliance-owner attestations for every material operating jurisdiction and reconcile
      them to entity, customer, and data-flow maps.
    relatedQuestionRefs:
      - QR001
      - QR008
    relatedTableRefs:
      - TR001
  - type: stale
    severity: material
    topic: current-valuation
    missingEvidence: >-
      A current 2026 financing, secondary transaction, or board-approved valuation supported by disclosed security
      terms.
    whyItMatters: >-
      The most recent valuation evidence in the assigned pool dates to January 2025 and cannot establish the price of a
      current security.
    diligencePath: >-
      Request the latest capitalization table, 409A or equivalent valuation, financing documents, and any secondary
      transaction data.
    relatedQuestionRefs:
      - QV009
    relatedTableRefs:
      - TV001
      - TV003
  - type: private-evidence-only
    severity: material
