callouts:
  - calloutType: "insight"
    title: "Dual Monetization Model Shields Margins but Amplifies Macro Beta"
    body: "By pairing fixed monthly SaaS subscription tiers ($99–$299/mo) with a 3%–5% transaction fee on every travel booking, TravelPerk generates baseline predictable software revenue while retaining upside from client corporate travel expansion. However, transaction fees represent the majority of gross revenue, leaving top-line cash flows sensitive to corporate travel freezes during economic downturns."
    claimRefs:
      - "CI001"
      - "CI002"
  - calloutType: "risk"
    title: "Hotel Inventory Price Inflation Threatens Core Value Proposition"
    body: "Independent user reviews document severe pricing disparities where hotel rates booked through TravelPerk are 50% to 100% higher than direct hotel booking channels. For enterprise procurement and travel managers, persistent hotel markup erodes the financial justification of centralized compliance, encouraging out-of-policy leakage and threatening client retention."
    claimRefs:
      - "CI009"
      - "CI010"
