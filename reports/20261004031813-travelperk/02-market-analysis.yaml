callouts:
  - calloutType: "insight"
    title: "Convergence of Corporate Travel Booking and Spend Management"
    body: "The historical boundary between corporate travel booking (TMCs) and expense reporting is collapsing. By acquiring Yokoy, TravelPerk mirrors broader market convergence where fintech platforms (e.g. Brex, Ramp) and modern travel aggregators (e.g. Navan) compete for unified finance workflows."
    claimRefs:
      - "CM004"
      - "CM015"
  - calloutType: "risk"
    title: "Supplier Disintermediation and Direct-Booking Headwinds"
    body: "Major airlines and hotel chains continue investing heavily in proprietary direct-booking portals and New Distribution Capability (NDC) fee differentiation. If suppliers restrict access or penalize third-party aggregator pricing, TravelPerk's inventory advantage and perceived price competitiveness could face pressure."
    claimRefs:
      - "CM014"
      - "CM016"
