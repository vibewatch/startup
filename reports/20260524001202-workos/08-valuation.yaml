  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Status
      - Revenue / ARR anchor
      - Valuation / EV anchor
      - Implied multiple
      - Why relevant
      - Limitation
    rows:
      - - Okta
        - Public
        - ~$2.92B LTM revenue
        - ~$14.07B EV / ~$16.17B market cap
        - ~4.82x EV/sales
        - Workforce and customer identity leader; closest large-cap IAM benchmark for normalized public identity multiples.
        - Mature scale and lower growth make it a floor-like public multiple rather than a ceiling.
      - - CyberArk
        - Public identity-security premium
        - ~$1.36B revenue / ~$1.44B ARR
        - ~$20.63B market cap
        - ~15.2x market-cap/revenue and ~14.3x market-cap/ARR
        - Best current premium identity-security comparable; shows what strong identity urgency can earn in 2026.
        - Product mix includes PAM and broader identity security; not a direct developer-infrastructure peer.
      - - SailPoint
        - Public identity security
        - ~$1.07B LTM revenue
        - ~$8.59B EV / ~$8.93B market cap
        - ~8.02x EV/sales
        - Useful middle multiple for identity software with current public reporting.
        - Governance and identity-security focus differ from WorkOS's developer-led enterprise-auth position.
      - - CrowdStrike
        - Public security ceiling
        - ~$4.81B LTM revenue
        - ~$164.46B EV / ~$168.87B market cap
        - ~34.18x EV/sales
        - Upper-bound security premium reference for mission-critical enterprise software.
        - Too broad and too scaled to be a direct underwriting comp for WorkOS.
      - - Auth0 sale to Okta (2021)
        - Strategic M&A precedent
        - ~$200M expected revenue (2021)
        - ~$6.5B purchase price
        - ~32.5x forward revenue
        - Shows the identity-scarcity premium achieved at the 2021 peak.
        - Peak-cycle transaction; not a safe 2026 baseline.
      - - SailPoint take-private (2022)
        - Strategic / PE precedent
        - Identity-security platform at scale
        - ~$6.9B all-cash price
        - n/a on reviewed public source set
        - Confirms that scaled identity assets can support multi-billion-dollar outcomes even outside the IPO market.
        - Historical transaction during a different rate and software-multiple backdrop.
    enumerationScope:
      coverage: partial
      basis: Public identity and security names plus two historical identity transactions are included because they provide the cleanest disclosed valuation anchors available in the reviewed source set; same-stage private identity rounds remain under-disclosed.
    notes: >-
      The comp set is intentionally partial. It mixes current public benchmarks and historical identity transactions to frame the March 2026 WorkOS round from several angles. Multiples are not normalized for growth, NRR, or margin, which is precisely why WorkOS's undisclosed operating metrics matter so much to the valuation call.
