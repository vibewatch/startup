company:
  name: WorkOS
chapter:
  number: 8
  title: Valuation
  summary: >-
    WorkOS's March 2026 Series C sets a real valuation anchor at $2 billion and is backed by unusually strong AI-customer proof, but public evidence still does not disclose the ARR, NRR, margin, customer concentration, headcount, or preference-stack data needed to underwrite that price with conviction. Against 2026 identity and security comps—Okta at roughly 4.8x EV/sales, SailPoint at roughly 8.0x, CyberArk around the mid-teens on revenue or ARR, and CrowdStrike as a much higher premium ceiling—the current round is defensible only if WorkOS has already reached roughly the mid-$100 million ARR band with elite retention. The chapter therefore lands on TRACK / research-more: buy only with disclosed operating metrics and clean terms, and pass if hidden revenue is materially below the threshold implied by compressed 2026 software multiples.
sections:
  - id: recommendation-price-test
    title: Recommendation and price discipline
    body: >-
      WorkOS deserves investor attention because it has real product urgency and real customer proof rather than only a financing headline. The March 2026 round priced the company at $2 billion, and WorkOS says the fastest-growing AI companies already on the platform include OpenAI, Anthropic, xAI, Cursor, Perplexity, Sierra, Replit, Vercel, and others. The company also says it has expanded from authentication into permissions, integrations, encryption, abuse detection, feature flags, and MCP, while running at five nines uptime across thousands of customers and billions of API requests each month. The customer stories page and homepage reinforce that the value proposition is not just technical elegance: WorkOS markets more than nine months of saved build time for enterprise SSO and SCIM, 50-plus integrations, and customer references that explicitly compare its enterprise-readiness favorably versus building internally or staying with older identity vendors.

      Those positives still do not clear the underwriting bar on their own. In the reviewed public source set, WorkOS does not disclose ARR, revenue growth, NRR, gross margin, exact customer count, headcount, burn, or liquidation preferences. That makes the $2 billion post-money impossible to verify directly. Instead, the round can only be tested indirectly against public comp multiples and algebraic revenue thresholds. On that basis the chapter lands on TRACK / research-more rather than buy: the price can be justified if WorkOS is already operating in the mid-$100 million ARR range with premium retention and a clean cap table, but it looks stretched if the revenue base is still below that band or if financing terms embed heavy preference overhang. The investment question is therefore not whether WorkOS is strategically interesting; it is whether the undisclosed operating base is already large enough to support a premium 2026 identity multiple.
    claimRefs:
