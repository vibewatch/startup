  - id: diligence-gaps
    title: Unresolved disclosure gaps and final diligence asks
    body: >-
      The strongest anti-thesis is not product risk; it is disclosure risk. Public sources reviewed for this chapter show strong customer logos and compelling product-market timing, but they do not show the underlying numbers an investor needs to test whether the $2 billion post-money is fair. There is no public ARR bridge, no disclosed NRR or GRR, no exact customer count or concentration waterfall, no headcount or burn disclosure, and no public view of the cap table or liquidation preferences. Those omissions matter more in 2026 than they did in 2021 because software multiples now reward the combination of growth and durability rather than narrative alone.

      The right diligence path is therefore narrow and practical. Before underwriting a bull or even base case, an investor should require a current ARR and growth bridge, cohort retention data, gross margin disclosure, exact large-customer exposure, and the post-Series-C preference stack. The company should also show whether the AI-agent identity product is already monetizing or is still a roadmap premium layered onto the core enterprise-auth franchise. Without those disclosures the most defensible stance is to keep WorkOS on a high-priority watchlist, not to force a definitive buy call. The exit logic is similar: if later disclosure validates premium economics, the company can compound into the current round; if it does not, the price leaves too little room for compressed 2026 software multiples.
