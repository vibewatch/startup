  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Customer proof
        - WorkOS already serves a rare cluster of AI leaders including OpenAI, Anthropic, xAI, Cursor, and Perplexity, which suggests strong product-market timing for enterprise-ready identity infrastructure.
        - Public customer logos do not reveal contract size, retention quality, or how much revenue is concentrated in a small set of AI breakout winners.
        - Show exact ARR, top-customer concentration, and cohort retention by vintage.
      - - Product breadth
        - The company has expanded beyond auth into permissions, integrations, encryption, abuse detection, feature flags, and MCP, raising switching costs and account value.
        - Product breadth alone does not prove monetization depth; some modules may still be adoption aids rather than material revenue lines.
        - Break out revenue contribution and attach rates by major module.
      - - Enterprise conversion
        - WorkOS markets more than nine months of build-time savings, 50-plus integrations, and faster implementation, which supports a compelling ROI story for fast-scaling software vendors.
        - Faster integration can win pilots without guaranteeing durable expansion or premium pricing power.
        - Provide win-rate, expansion, and payback data for enterprise conversions.
      - - AI tailwind
        - The AI-agent identity narrative could expand the platform from workforce and app identity into a broader permissioning layer for autonomous software.
        - The agent opportunity is still more narrative than audited revenue stream in the reviewed public evidence.
        - Show live agent-related customers, pricing, and revenue contribution.
      - - Comp framework
        - CyberArk and premium AI-native SaaS ranges show that high-quality identity or security assets can still command double-digit revenue or ARR multiples in 2026.
        - Okta and SailPoint show that current public identity multiples are far below 2021 scarcity pricing, making the threshold for a $2B private round materially higher.
        - Disclose enough metrics to place WorkOS credibly within the comp set.
      - - Market regime
        - AI-native assets can still earn a premium in a corrected market.
        - The software sector selloff and post-2021 multiple reset mean investors are less willing to pay for story without proof.
        - Validate Rule-of-40 style economics or insist on lower entry pricing.
    notes: >-
      The thesis table isolates what is already visible in public evidence from what still requires management disclosure. Several thesis points are strategically compelling today, but the anti-thesis remains fundamentally a valuation and disclosure problem rather than a pure product objection.
    claimRefs:
