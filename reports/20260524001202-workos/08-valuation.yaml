  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: operating-metric-disclosure
      missingEvidence: "Current ARR, revenue growth bridge, NRR, GRR, and gross margin by product line are not publicly disclosed."
      whyItMatters: "These metrics determine whether the March 2026 $2B round sits inside a premium but defendable band or above what 2026 identity and SaaS comps can support."
      diligencePath: "Request the latest ARR bridge, cohort retention, gross margin, and Rule-of-40 view directly from management or major investors before underwriting the round."
      relatedQuestionRefs: [QV018, QV019, QV020]
    - type: private-evidence-only
      severity: material
      topic: customer-scale-and-concentration
      missingEvidence: "The public record discloses only thousands of customers and named logos, not exact customer count, top-customer concentration, or renewal schedule."
      whyItMatters: "A logo-rich base can still be economically concentrated, which would weaken the premium multiple argument if a few breakout AI companies drive a large share of ARR."
      diligencePath: "Request exact customer count, top-10 ARR concentration, and renewal timing by cohort."
      relatedQuestionRefs: [QV021, QV029]
    - type: private-evidence-only
      severity: blocking
      topic: cap-table-overhang
      missingEvidence: "The post-Series-C cap table, liquidation preferences, anti-dilution protections, and other investor rights are not publicly disclosed."
      whyItMatters: "Even a sound enterprise-value thesis can produce weak common-equity returns if the preference stack is heavy or senior protections absorb downside proceeds."
      diligencePath: "Review the post-money cap table and liquidation waterfall before making any pricing recommendation."
      relatedQuestionRefs: [QV023, QV024, QV025, QV026]
    - type: private-evidence-only
      severity: material
      topic: headcount-and-burn
      missingEvidence: "No reviewed public source disclosed 2026 headcount, burn rate, or runway assumptions for WorkOS."
      whyItMatters: "Without burn and hiring data, investors cannot judge whether WorkOS can grow into the $2B round without another financing on adverse terms."
      diligencePath: "Request employee count by function, burn, cash balance, and runway under base and bear hiring plans."
      relatedQuestionRefs: [QV022]
    - type: missing-source
      severity: material
      topic: ai-agent-monetization
      missingEvidence: "Independent or audited evidence of paying adoption for WorkOS's AI-agent identity layer was not found in the reviewed public source set."
      whyItMatters: "The current premium is easier to defend if the agent layer is already monetizing; if it is still mainly roadmap optionality, investors should underwrite only the core enterprise-auth business."
      diligencePath: "Ask management for paying customer count, pricing model, pipeline, and attach-rate data for agent-related products."
      relatedQuestionRefs: [QV028]
    - type: enumeration-incomplete
      severity: minor
      topic: comparable-set-coverage
      missingEvidence: "A fuller set of same-stage private identity infrastructure transactions is not publicly disclosed enough to include in the comparable table."
      whyItMatters: "The current comp set is sufficient for directional range-setting but cannot fully resolve the discount or premium that should apply to a private, developer-led identity company like WorkOS."
      diligencePath: "Supplement public sources with investor-side market maps, private transaction comps, and dealer indications before final pricing."
      relatedQuestionRefs: [QV013, QV014]
      relatedTableRefs: [TV004]
