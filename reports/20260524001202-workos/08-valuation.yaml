  - id: TV005
    title: Thesis-break and trigger table
    columns:
      - Trigger or condition
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Buy gate not met
        - Management cannot show ARR of at least roughly $150M plus premium retention and margin quality.
        - The current $2B price remains unsupported by 2026 identity and SaaS comp bands.
        - Stay in track mode or walk away; do not force a buy call.
      - - Preference overhang discovered
        - Series C terms include aggressive liquidation preferences, participating preferred features, or unusually large dilution protection.
        - Common-equity upside compresses even if the enterprise value thesis is directionally right.
        - Pass unless pricing or structure is renegotiated.
      - - Multiple reset persists
        - Public software multiples remain pinned near the corrected 6x-8x zone and identity peers fail to rerate.
        - Private mark support weakens and premium entry pricing loses downside protection.
        - Tighten price discipline and demand stronger operating proof.
      - - Enterprise conversion disappoints
        - AI-customer logos do not convert into repeatable expansion, or customer concentration proves excessive.
        - The premium narrative shifts from durable platform to concentrated exposure.
        - Re-rate the company toward lower private SaaS bands.
      - - AI-agent narrative stays pre-monetization
        - Agent-related identity remains roadmap messaging rather than contracted revenue.
        - A meaningful part of the premium multiple turns into unearned optionality.
        - Underwrite only the core enterprise-auth platform, not the future story.
      - - Hidden metrics disappoint
        - ARR falls below ~$100M or NRR is near 100%.
        - The round starts to resemble peak-cycle overpayment instead of justified premium pricing.
        - Hard pass at the current valuation.
    notes: >-
      The first two rows are pre-investment gates, while the later rows are ongoing thesis-break indicators. Each trigger is designed to force a clear action rather than a vague watch item, consistent with a price-sensitive recommendation.
    claimRefs:
      - CV035
      - CV037
      - CV044
      - CV048
      - CV051

  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Current ARR and growth bridge
        - No public ARR or revenue disclosure for WorkOS in the reviewed 2026 source set.
        - It is the single variable that determines whether $2B is attractive, fair, or stretched.
        - Request the latest ARR, quarterly growth trend, and enterprise revenue mix from management.
      - - NRR, GRR, and gross margin
        - Public sources do not disclose retention or margin quality.
        - Premium AI-native multiples require proof of durable expansion and attractive unit economics.
        - Request cohort retention, gross margin, and payback data by major product line.
      - - Exact customer count and concentration
        - WorkOS discloses only thousands of customers and named logos, not exact count or concentration.
        - A logo-rich base can still be economically concentrated if a handful of AI leaders dominate ARR.
        - Request exact customer count, top-10 concentration, and renewal schedule.
      - - Headcount and burn profile
        - No public 2026 headcount or burn disclosure was found in reviewed sources.
        - Investors need to know whether the company can grow into the round without another capital raise on adverse terms.
        - Request employee count by function, cash burn, and runway under base and bear hiring plans.
      - - Cap table and liquidation preferences
        - The public record does not disclose the post-Series-C preference stack or any investor protections.
        - A good enterprise-value outcome can still produce weak common-equity returns if the stack is heavy.
        - Review the post-money cap table, liquidation waterfall, and any senior security terms.
      - - AI-agent identity monetization
        - Public sources describe the agent-identity opportunity but do not quantify live revenue contribution.
        - Optionality should not be capitalized like proven ARR without proof of paying adoption.
        - Request pipeline, paying-customer count, pricing model, and attach-rate data for agent-oriented products.
    notes: >-
      These asks are ordered by valuation impact rather than by narrative interest. The first four are core underwriting inputs, and the last two determine whether the current premium should be sustained or discounted.
    claimRefs:
      - CV044
      - CV045
      - CV046
      - CV047
