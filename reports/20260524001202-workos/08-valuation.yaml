tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Why it matters
      - Action implication
    rows:
      - - Recommendation
        - Track / research-more
        - WorkOS has unusually strong AI-customer proof and product urgency, but the public record still lacks the ARR, NRR, margin, and cap-table disclosure needed to underwrite the March 2026 $2B anchor.
        - Follow closely and pursue diligence rights; do not assume the current round is investable on public evidence alone.
      - - Confidence
        - Medium
        - Strategic quality is visible; valuation support is not. The main uncertainty is not category attractiveness but hidden operating scale.
        - Confidence can move higher only with disclosed ARR, retention, and gross margin data.
      - - Risk rating
        - High
        - The key risk is valuation overpayment under metric opacity, compounded by a softer 2026 software multiple regime than the 2021 identity peak.
        - Require downside protection or walk away if disclosure remains thin.
      - - Valuation stance
        - Fair-to-stretched pending metrics
        - The price is plausible only if WorkOS has already reached roughly the mid-$100M ARR band and retains premium growth quality.
        - Treat the round as defensible only after the metric threshold test is passed.
      - - Immediate next step
        - Metrics-gated diligence
        - The highest-value questions are operating metrics and preference terms, not product demos or category decks.
        - Ask for ARR, NRR, gross margin, customer concentration, and liquidation preference detail before advancing.
    notes: >-
      This table is intentionally price-sensitive rather than company-quality-sensitive. It summarizes the investment posture implied by the current $2B round using public evidence only, and should be updated as soon as WorkOS discloses operating metrics or financing terms.
    claimRefs:
      - CV001
