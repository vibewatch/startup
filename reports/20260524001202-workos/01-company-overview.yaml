    {
      "id": "founder-footprint-and-organization",
      "title": "Founder, footprint, and organizational profile",
      "body": "The company remains visibly founder-led. WorkOS’s structured data names Michael Grinich as founder, official financing posts are written in his voice, and external profiles link the company’s origin directly to his Nylas experience and the lesson that strong end-user products can still fail if enterprise requirements arrive too late. Corporate-footprint evidence is good enough to anchor the company in San Francisco, though not clean enough to treat the precise mailing address as settled: WorkOS’s own structured data lists 660 Market Street while third-party directory data lists a different Market Street mailbox address. What is more robust is the operating-model signal. WorkOS describes itself as a remote-first team of 100+ builders, while third-party employee bands place it in the 51-200 range, implying a meaningful but still private workforce. Public leadership visibility beyond Grinich is comparatively thin, so diligence should treat key-person dependence and governance transparency as live issues, not closed questions.",
