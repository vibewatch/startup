  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "WorkOS is a San Francisco-anchored, remote-first private company building developer APIs and SDKs for enterprise identity and related trust infrastructure. Official and independent sources support a $100 million Series C on 2026-03-02 at a $2 billion valuation, expansion from SSO and SCIM into AuthKit, FGA, Radar, and AI-era security tooling, and meaningful customer adoption across AI-native software companies. The main diligence caveats are private-company opacity around revenue, governance, and ownership plus a visible execution burden from published security issues and status-page incidents."
  },
  "sections": [
    {
      "id": "identity-positioning-and-product-scope",
      "title": "Identity, positioning, and product scope",
      "body": "WorkOS’s public identity is unusually crisp: it sells developer APIs and SDKs that help software companies become “enterprise ready” faster rather than building identity and compliance plumbing themselves. Across the homepage, founding essay, docs, and later financing post, the company repeatedly frames the problem as crossing the “enterprise chasm” that appears when a product has user pull but lacks IT-admin requirements such as SSO, SCIM provisioning, auditability, permissions, and security controls. By 2026 the product footprint is materially broader than early SSO-plus-directory roots. WorkOS now publicly markets Enterprise SSO, Directory Sync, Audit Logs, AuthKit, MFA, FGA, Radar, and newer agent/auth connectors on the same platform surface. The strategic read is that WorkOS still starts from identity, but it increasingly presents itself as a developer-first trust layer for enterprise and AI software rather than a point product for login alone.",
