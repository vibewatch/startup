    {
      "id": "traction-milestones-and-caveats",
      "title": "Traction, milestones, and company-level caveats",
      "body": "The strongest public traction signal is customer quality and product breadth rather than audited financial disclosure. Official 2026 materials say leading AI companies including OpenAI and Anthropic use WorkOS, the customer-story index names a broad mix of B2B software accounts, and Sacra estimates the company crossed 1,000 paying customers in early 2025 and reached roughly $30 million ARR by October 2025. Milestone cadence also shows steady platform expansion: AuthKit launched in late 2023, Radar in late 2024, and the 2026 Series C messaging recast WorkOS as infrastructure for secure agentic software. The adverse side is real even if not existential. WorkOS has published a Hosted AuthKit MFA-bypass advisory, public vulnerability databases list multiple AuthKit-related issues across 2025 and 2026, and the official status page plus IsDown show recurring operational incidents, including a May 2026 dashboard outage. The diligence conclusion is that WorkOS looks strategically relevant and well-capitalized, but underwriting still depends on confirming operational maturity, customer concentration, and financial quality beneath the strong top-line narrative.",
