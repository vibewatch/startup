    {
      "id": "capital-base-and-stakeholders",
      "title": "Capital base, stage, and stakeholder map",
      "body": "Public financing history supports a clean late-stage private-company read. WorkOS disclosed $19 million raised to date in its March 2021 financing announcement, an $80 million Series B in June 2022 led by Greenoaks, and a $100 million Series C in March 2026 at a $2 billion valuation led by Meritech and Sapphire. Summed mechanically, those official disclosures imply roughly $199 million of disclosed capital by March 2026. The visible investor set is also fairly coherent: early backing included Lachy Groom, Abstract, Lightspeed, and other operators, while later rounds layered on Greenoaks, Meritech, Sapphire, Audacious, and Craft. That profile suggests a company that has moved from early developer-infrastructure conviction capital into broader growth-stage sponsorship. What remains private is just as important as what is public: none of the retained sources gives a full cap table, board-seat map, liquidation stack, or ownership concentration view, so governance and economics still need management-room confirmation.",
