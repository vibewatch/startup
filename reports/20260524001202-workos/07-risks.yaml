chapter:
  number: 7
  title: Risks
  summary: WorkOS's risk profile is led by auth-layer security and reliability exposure, protocol and compliance dependency, and commercial pressure from bundled or cheaper identity alternatives. Public mitigants are real — a separate SLA, a DPA, Trust Center artifacts, and fresh Series C capital — but May 2026 incidents, 2026 SDK breaking or security changes, and incomplete public revenue or contract visibility leave residual risk high until private diligence fills the gaps.
sections:
- id: regulatory-and-contract-risk
  title: Regulatory, Contractual, and Compliance Risk
  body: |-
    WorkOS is a processor and identity middleware vendor, so its downside is not driven by a single sector regulator but by the cumulative weight of privacy law, procurement controls, and customer contract expectations. The public DPA is relatively mature: it acknowledges subprocessors, cross-border transfers, security-incident notice, DPIA support, and customer objections where data-protection law requires them. That is a positive baseline, but it also confirms the company sits directly inside GDPR Article 28 style processor obligations and must manage subprocessor changes, transfer mechanisms, and controller instructions correctly for every enterprise deployment.

    The public risk is that WorkOS exposes only a partial contracting stack without gated customer paper. The website terms disclaim uninterrupted availability and cap liability for website use at $100 under California law, while the production SLA lives in a separate enterprise-only document. The SLA is narrow: it applies only to enterprise-tier covered services in production and excludes staging, alpha, beta, preview, and other non-GA use. That is commercially reasonable for an infrastructure vendor, but it means investors still need the actual MSA, DPA exhibits, audit-rights language, and indemnity terms before assuming downside is well-bounded. If enterprise customers demand data residency or audit rights beyond the public documents, WorkOS may need bespoke concessions that compress margin or slow sales cycles.

    Compliance posture is directionally strong. WorkOS publicly markets SOC 2 Type 2, GDPR and CCPA compliance, annual third-party penetration tests, external code audits, and HIPAA BAAs for enterprise plans; its Trust Center says SOC reports, pentest artifacts, and subprocessors are centralized there. The residual exposure is not a missing badge but a freshness and scope problem: enterprise procurement teams will care whether those artifacts stay current as WorkOS broadens from SSO and SCIM into passkeys, permissions, feature flags, abuse detection, and MCP-related surfaces. Compliance drift, or trust-center detail that remains gated or incomplete, would directly hurt win rates in regulated accounts.
