- id: TR001
  title: Regulatory / Legal Risk Register
  layout: wide
  enumerationScope:
    coverage: exhaustive
    basis: All publicly visible legal, regulatory, processor, and assurance obligations identified for WorkOS as of 2026-05-24, limited to materials fetchable without private customer credentials.
  columns:
  - Rule / Obligation
  - Jurisdiction
  - Public status
  - Likelihood
  - Severity
  - Mitigation
  - Residual exposure
  - Diligence path
  rows:
  - - GDPR Article 28 / DPA processor duties
    - EU / UK / Switzerland
    - Public DPA, legal hub, and Trust Center references are live
    - Medium
    - High
    - Public DPA, subprocessor notice process, security-incident notice terms
    - Cross-border transfer and subprocessor-detail requests can still slow procurement
    - Review customer DPA redlines, SCC mechanics, and controller objection workflow under NDA
  - - Cross-border transfers and data residency
    - EU / UK and global enterprise accounts
    - DPA authorizes international transfers; public region-level commitments are not spelled out in the fetched pages
    - Medium
    - High
    - Public legal terms plus Trust Center and security materials
    - Data-residency commitments may still require bespoke paper or product scoping
    - Request hosting-region map, subprocessor-by-product matrix, and residency exceptions
  - - Enterprise uptime and support commitments
    - Global enterprise contracts
    - 99.99% SLA is public but limited to enterprise production services
    - Medium
    - High
    - Separate SLA, service-credit framework, support plans, status page
    - Staging, beta, preview, and bespoke support expectations remain outside the public guarantee
    - Inspect top customer SLAs, credit claims, carve-outs, and negotiated exceptions
  - - SOC / security assurance freshness
    - Enterprise procurement / audits
    - Security page and Trust Center advertise SOC reports, pen tests, and subprocessors
    - Low-Medium
    - Medium-High
    - Trust Center artifact centralization, annual testing, code audits
    - Badge drift or scope lag would directly hurt regulated-customer conversion
    - Verify latest SOC report period, pen-test remediation status, and product-scope coverage
  - - HIPAA and regulated-workload support
    - US healthcare / regulated buyers
    - WorkOS says BAAs are available on enterprise plans
    - Low-Medium
    - Medium
    - Enterprise-plan BAA support plus broader security controls
    - Public materials do not show which products or data flows are excluded
    - Request BAA template, excluded services, and sample healthcare deployment architecture
  notes: Severity and likelihood are analytical judgments based on public sources as of 2026-05-24; investors still need private customer contracts and gated Trust Center artifacts to fully clear legal exposure.
