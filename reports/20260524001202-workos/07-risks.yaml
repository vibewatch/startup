- id: platform-and-commercial-risk
  title: Platform Dependency, Commercial Pressure, and Concentration Risk
  body: |-
    WorkOS does have more scope than a narrow SSO wrapper, but public evidence still places the company inside one control plane: enterprise identity, authorization, auditability, and adjacent security tooling. The March 2026 Series C post says WorkOS now spans permissions, integrations, encryption, abuse detection, feature flags, and MCP, while the public pricing surface remains anchored on user management, SSO, directory sync, auditability, and adjacent access features. That means the upside of expansion is real, but so is single-stack concentration: if the core auth and directory narrative weakens, the adjacent products likely weaken with it rather than offset it.

    Lock-in cuts both ways. Hosted UI is the easiest onboarding path, but the docs make clear that teams that do not want WorkOS-managed auth screens must own more API and state-management complexity themselves. Passkeys deepen that tradeoff because WorkOS advises customers to set a custom domain before production; once passkeys are registered to that domain, later migration becomes harder. The official Laravel package adds distribution leverage, yet it also means WorkOS adoption can become embedded inside another ecosystem's defaults. Those dynamics help net retention when the product works well, but they also raise the blast radius if pricing, incident response, or product direction changes.

    Competitive pressure is the sharpest commercial risk. Auth0, Clerk, and Stytch all publish generous entry pricing, while Microsoft Entra and AWS Cognito can ride existing cloud or productivity budgets. Open-source alternatives such as Hanko explicitly market against WorkOS. The identity-vendor category also has a reputation problem: Okta's support-system breach showed how damaging IAM-provider incidents can be, because a vendor compromise can turn into a customer-ecosystem compromise. WorkOS's own Series C gives it liquidity and credibility, but public ARR, burn, churn, and product-mix disclosure remain absent. Investors are therefore underwriting a $2 billion valuation with incomplete visibility into whether newer products materially diversify revenue or simply widen execution surface area.
