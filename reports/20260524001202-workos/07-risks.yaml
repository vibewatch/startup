  evidenceGaps:
  - type: access-blocked
    severity: material
    topic: subprocessors and data residency
    missingEvidence: Full Trust Center subprocessor roster by product, region, and data category plus explicit public data-residency commitments.
    whyItMatters: Enterprise privacy reviews and EU or UK customers will care about processor location, transfer paths, and objection mechanics beyond a page title or generic DPA clause.
    diligencePath: Request gated Trust Center export, subprocessor notice archive, and hosting-region matrix under NDA.
    relatedQuestionRefs:
    - QR023
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: customer contract terms
    missingEvidence: Standard customer MSA, security exhibit, indemnity terms, audit-rights language, and liability-cap structure beyond the website terms.
    whyItMatters: The public website terms are not the operative enterprise paper, so downside cannot be sized correctly without the real customer contract stack.
    diligencePath: Review standard MSA, DPA schedules, SLA, and security appendix with counsel during diligence.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: product revenue mix
    missingEvidence: ARR, gross margin, and customer count split across AuthKit, SSO, Directory Sync, Audit Logs, and newer adjacent products.
    whyItMatters: Without product-line mix, investors cannot tell whether WorkOS has true diversification or simply a wider execution surface around one auth-centric thesis.
    diligencePath: Request trailing-12-month revenue mix, gross margin by product, and top-20 customer product bundles.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: liquidity and runway
    missingEvidence: Current ARR, burn, cash balance, hiring plan, and financing terms after the March 2026 Series C.
    whyItMatters: A $2 billion valuation and $100 million round improve optics, but they do not prove efficient growth or long runway without operating metrics.
    diligencePath: Review board deck, financing documents, monthly KPI package, and 12-month operating plan.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: retention and SLA credit history
    missingEvidence: Enterprise renewal rates, net retention, incident-related concessions, and any claimed SLA credits or support escalations.
    whyItMatters: Public uptime and support promises matter only if they translate into durable retention and limited service-credit leakage.
    diligencePath: Request 12-18 month incident ledger, SLA credit claims, and renewal notes for top enterprise accounts.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR005
