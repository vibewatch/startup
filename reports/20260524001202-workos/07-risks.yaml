- id: security-and-reliability-risk
  title: Security, Reliability, and Standards-Dependency Risk
  body: |-
    WorkOS sits at the identity edge, where even short-lived defects can break login, provisioning, or authorization for downstream customers. The May 2026 status feed is a useful reality check. WorkOS showed 100% core-service uptime over the preceding 90 days, yet the same public page logged dashboard and docs unavailability, webhook delivery delays, OIDC errors, and AuthKit email-rendering incidents in the same month. That combination does not prove broad control failure, but it does show that supporting-service and edge-case incidents still reach customers even while headline uptime appears clean.

    The 2026 SDK and issue trail reinforces that risk. WorkOS shipped auth-hardening changes for OAuth state verification, PKCE cookie isolation, raw-byte webhook verification, Python dependency security, and multiple major SDK migrations. Public GitHub issues show more than theoretical edge cases: customers reported feature-flag targeting disagreeing with JWT claims, stale organization IDs causing 400 auth failures, double Cloudflare challenges in hosted sign-in, synchronized token-refresh retries, passkey-enrollment gaps, and hosted-sign-in flows that can auto-create unintended accounts. None of those alone is existential, but together they show a platform still absorbing rapid product expansion while maintaining mission-critical auth paths.

    The standards layer compounds the problem. WorkOS itself documents that SCIM implementations differ by provider and can introduce security vulnerabilities, while its SAML guide bluntly notes that SAML is common yet vulnerability-prone and that OIDC is preferable where possible. That is the right technical framing, but it confirms the dependency: WorkOS does not control SAML, OIDC, or SCIM, and it cannot force Microsoft, Okta, Google, Workday, and customer-specific IdPs to behave uniformly. Standards drift, identity-provider quirks, or changes in regulated-customer expectations under NIST-style identity rules can all create support burden, connector fragility, and slower time to value.
