- id: mitigation-and-kill-criteria
  title: Mitigation Maturity, Residual Exposure, and Kill Criteria
  body: |-
    WorkOS does not look reckless. Public materials show a coherent mitigation stack: a formal DPA, a separate enterprise SLA, a status page, a trust center, current fundraising, and repeated 2026 SDK fixes rather than visible stagnation. Those are the right ingredients for an enterprise-identity vendor. The problem is residual exposure, not absence of controls. The company is still moving fast across auth, feature flags, permissions, abuse detection, and agentic-security use cases while depending on heterogeneous external standards and customer IdPs. That combination raises the likelihood of regressions, migration friction, and bespoke enterprise asks at exactly the moment the company is scaling expectations after a large financing round.

    The chapter's kill criteria therefore focus on measurable signals rather than narrative discomfort. A hard stop would be any customer-facing security incident that resembles the identity-supply-chain dynamics seen in Okta, repeated public auth regressions after remediation, or evidence that enterprise SLAs and trust-center artifacts are materially narrower than the commitments required to close regulated customers. A softer but still serious warning would be competitive compression: if Microsoft, AWS, Auth0, Clerk, or Stytch can match core functionality at lower effective cost, WorkOS's sales efficiency and long-term margin assumptions change quickly.

    The core diligence ask is private evidence. Investors should not rely on public website terms, marketing badges, or a founder blog alone to clear contract, data-residency, or liquidity risk. Before underwriting the round or marking the business as infrastructure-grade, request the customer MSA and security exhibit, current subprocessor and hosting-region matrix, SLA-credit history, renewal and churn data, and product-level ARR or gross-margin mix. If those private materials show concentration, high incident toil, or concession-heavy procurement, WorkOS's risk profile should be marked materially worse than the public surface suggests.
