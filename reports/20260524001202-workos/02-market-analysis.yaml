callouts:
  - calloutType: insight
    title: WorkOS is solving a market-structure problem, not just a protocol problem
    body: The category tailwind is not merely more IAM spend; it is the mismatch between enterprise buyers who require standards-compliant identity controls and SaaS product teams that do not want to become identity vendors.
    claimRefs:
      - CM006
      - CM023
      - CM049
  - calloutType: risk
    title: The biggest TAM number is not the right underwriting number
    body: Broad IAM forecasts validate category size, but WorkOS's nearer-term wedge is the thinner infrastructure layer where enterprise readiness, not full-suite replacement, drives spend.
    claimRefs:
      - CM010
      - CM012
      - CM021
      - CM049
  - calloutType: insight
    title: Authorization is becoming the next upsell after SSO and SCIM
    body: Zanzibar, OpenFGA, Auth0 FGA, and WorkOS's own agent-authorization framing all point to a market that is shifting from proving identity to constraining what identities and agents can actually do.
    claimRefs:
      - CM038
      - CM039
      - CM040
      - CM041
  - calloutType: recommendation
    title: Diligence should ask for connection mix, attach rates, and FGA monetization
    body: The market case is strong enough for a positive Chapter 2 view, but valuation work still needs internal data on connection growth, product attach, and how much agent/FGA demand is paid rather than exploratory.
    claimRefs:
      - CM021
      - CM046
      - CM050
