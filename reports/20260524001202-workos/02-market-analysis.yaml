  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - Driver / constraint
      - Direction
      - Timing
      - Implication
      - Diligence ask
    rows:
      - - Enterprise SSO and SCIM requirements in procurement
        - Positive
        - Current
        - Makes identity features table stakes for upmarket SaaS vendors
        - What share of WorkOS pipeline starts with procurement blockers versus proactive platform strategy?
      - - Zero-trust identity policy and MFA baselines
        - Positive
        - Current
        - Strengthens demand for standards-based authentication, provisioning, and access controls
        - Which buyer verticals most explicitly map WorkOS adoption to zero-trust programs?
      - - Passkeys, wallets, and digital-identity guideline changes
        - Positive
        - Near term
        - Expands demand for modern, flexible identity layers rather than password-only systems
        - How much of WorkOS demand is auth modernization versus enterprise feature gating?
      - - Compliance-led audit and outsourcing assurance
        - Positive
        - Current
        - Supports log-streaming, audit evidence, and admin-control features
        - What attachment rate do Audit Logs and log-streaming have in real enterprise deals?
      - - AI agents and non-human identity growth
        - Positive
        - Near to medium term
        - Creates a new authorization and least-privilege control plane opportunity
        - How many customers are paying for FGA or agent authorization today versus piloting?
      - - Opaque enterprise-tier pricing at incumbents
        - Positive for WorkOS
        - Current
        - Makes per-connection developer-first infrastructure easier to position against suites
        - How often does WorkOS win explicitly on pricing predictability versus migration speed?
      - - Budget constraints, privacy concerns, and skill shortages
        - Negative
        - Current
        - Slows or narrows IAM deployments even in a growing category
        - Which segments are most likely to postpone enterprise-readiness work despite demand?
      - - Category overlap and SAM ambiguity
        - Negative
        - Ongoing
        - Can inflate valuation if IAM, CIAM, and access-management numbers are stacked carelessly
        - What internal revenue mix or connection data would let diligence estimate a cleaner SAM?
    notes: Drivers and constraints are intentionally tied to timing and underwriting implication rather than treated as abstract market talking points.
