  - id: sizing-lenses-and-overlap
    title: Sizing lenses, overlaps, and the realistic underwriting denominator
    body: |-
      The top-down market evidence is supportive, but it is not additive. Public analyst pages put broad IAM around $24.8 billion to $28.7 billion on a 2026-equivalent basis, while CIAM-specific estimates cluster around $13.3 billion to $14.5 billion for 2026. Access-management forecasts are similarly large, with one public estimate at $25 billion in 2026 and a 31% audit/compliance/governance slice inside that category. MarketsandMarkets also treats B2B identity, consumer IAM, and non-human identity as explicit slices of the broader IAM market, while a separate non-human identity access-management forecast reaches $18.71 billion by 2030. Those figures confirm that WorkOS sits inside a real, expanding control layer, but they also show why simple TAM arithmetic would overstate the opportunity.

      The right underwriting move is to preserve multiple lenses instead of selecting the biggest headline. Broad IAM is the outer ceiling because it contains the protocols, governance, and access-control functions that make WorkOS relevant. CIAM is closer to WorkOS AuthKit and external-user identity. Access-management and audit/compliance data capture the administrative and evidence-heavy workflows that drive Enterprise and Scale plan demand. Non-human identity and agent authorization expand the adjacency around FGA, but they are not yet a clean substitute for current revenue. What public sources do not provide is a standalone market-size series for “enterprise feature infrastructure sold to B2B SaaS vendors.” That missing bridge is why a precise public SAM or SOM still cannot be isolated with confidence.
