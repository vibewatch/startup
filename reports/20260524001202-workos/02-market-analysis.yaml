chapter:
  number: 2
  title: Market Analysis
  summary: WorkOS is not underwriting the whole IAM market; it is monetizing the enterprise-readiness gap inside B2B software, where SSO, SCIM, audit logs, org policies, and now fine-grained authorization determine whether a product can sell upmarket. Public market data supports a large and growing identity-control backdrop, but the most relevant denominator is an overlapping stack of IAM, CIAM, access management, and emerging non-human authorization rather than one clean TAM. The result is a favorable market with real buyer urgency and clear build-vs-buy pain, but still no precise public WorkOS-specific SAM or SOM.
sections:
  - id: market-boundary-and-why-workos-exists
    title: Market boundary, included spend, and why WorkOS exists
    body: |-
      WorkOS should be framed as developer-first enterprise identity infrastructure for B2B software vendors, not as a proxy for the entire identity-and-access-management market. The broad IAM denominator includes provisioning, directory services, single sign-on, advanced authentication, audit, compliance, governance, privileged access, workforce identity, CIAM, B2B identity, and non-human identity. WorkOS only monetizes a narrower layer inside that stack: the enterprise features a SaaS company needs once customers demand SAML/OIDC SSO, SCIM-based provisioning, audit-log exports, org-level security policies, and increasingly granular authorization. The closest practical buyer problem is therefore “make my product enterprise-ready” rather than “replace my company’s whole identity suite.”

      That boundary explains both inclusion and exclusion. Included spend should cover enterprise SSO connections, directory sync and lifecycle automation, audit and log-streaming infrastructure, customer admin onboarding workflows, and authorization logic needed for multi-tenant collaboration and AI agents. Excluded spend should include consumer-only CIAM, employee-facing workforce suites bought for internal IT, and unrelated cybersecurity categories that do not solve SaaS product identity workflows. The main status-quo substitute is not one named competitor; it is a messy combination of homegrown SAML and SCIM implementations, manual provisioning, opaque enterprise-tier pricing from larger suites, and delayed deal cycles while product teams scramble to satisfy enterprise security reviews. WorkOS exists because standards-compliant identity features are increasingly table stakes, but building and maintaining them inside every SaaS product remains expensive and distracting.
