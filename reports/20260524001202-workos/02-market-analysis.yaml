        - Outer ceiling only; much broader than WorkOS's monetized wedge
      - - CIAM and external-user identity
        - Customer login, federation, social and passwordless auth, profile and organization management
        - Internal workforce-only IAM programs
        - Product, growth, platform, digital teams
        - Relevant to AuthKit and developer-facing auth APIs
      - - Enterprise SaaS readiness infrastructure
        - SSO connections, SCIM and directory sync, audit log export, admin onboarding, org security policies
        - Consumer-only sign-in UX or unrelated CX tooling
        - Product engineering plus security/compliance sponsors
        - Closest practical description of WorkOS's core market today
      - - Authorization and collaboration control plane
        - RBAC/FGA, delegated access, multi-tenant entitlements, agent permissions, auditability of access changes
        - Standalone app analytics without access control
        - Platform engineering, security architecture
        - Expanding adjacency that can increase WorkOS wallet share
      - - Status-quo substitutes
        - Homegrown SAML/SCIM, manual provisioning, ticketing, and bundled identity-suite features already owned by the buyer
        - Dedicated infra spending not already required by enterprise customers
        - Existing engineering and IT budgets
        - Real competitive baseline against which WorkOS must prove ROI
      - - Excluded adjacent markets
        - Consumer fraud, workforce-only HR suites, general SIEM or GRC platforms with no embedded product identity layer
        - N/A
        - Separate security, fraud, or HR owners
        - Avoids overstating TAM with non-core categories
    notes: The boundary deliberately centers enterprise-readiness infrastructure inside B2B software rather than counting the whole IAM stack as immediately addressable by WorkOS.
