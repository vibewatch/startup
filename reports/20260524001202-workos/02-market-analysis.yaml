  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: sam-gap
      missingEvidence: Internal data separating WorkOS revenue or connections by SSO, Directory Sync, Audit Logs, FGA, and company size.
      whyItMatters: Public market reports overlap too heavily to isolate a standalone WorkOS SAM or SOM without internal mix data.
      diligencePath: Request a cohort table of active connections, product attach, and ARR by customer segment plus win or loss reasons versus suite vendors.
      relatedQuestionRefs:
        - QM007
        - QM025
      relatedTableRefs:
        - TM002
    - type: missing-source
      severity: material
      topic: authorization-market
      missingEvidence: Independent production-adoption data for fine-grained authorization and AI-agent authorization budgets.
      whyItMatters: The market narrative around FGA is compelling, but public evidence is still dominated by standards and vendor positioning rather than third-party spend data.
      diligencePath: Ask for customer references, paid FGA usage metrics, and pipeline evidence showing agent authorization moves budgets rather than feature curiosity.
      relatedQuestionRefs:
        - QM018
        - QM025
      relatedTableRefs:
        - TM004
    - type: missing-source
      severity: minor
      topic: budget-ownership
      missingEvidence: Independent buyer research quantifying whether product engineering, security, or compliance owns the budget in live WorkOS-like deals.
      whyItMatters: The buying motion appears cross-functional, but valuation and GTM analysis improve if the dominant economic buyer is clearer.
      diligencePath: Review win notes, security questionnaires, and enterprise deal owners for the last 20 WorkOS-like deployments.
      relatedQuestionRefs:
        - QM009
        - QM025
      relatedTableRefs:
        - TM003
