  - id: constraints-incumbent-pricing-and-open-gaps
    title: Constraints, incumbent pricing structure, and unresolved diligence gaps
    body: |-
      The bullish case is real, but the frictions are not trivial. Analysts still call out budget constraints, privacy concerns, lack of unified identity standards, and shortages of skilled cybersecurity practitioners as reasons IAM rollouts stall or narrow in scope. Market overlap also creates valuation risk: broad IAM, CIAM, access management, compliance tooling, and non-human identity all reference related spend pools, so careless aggregation can double count the same budget. Adoption can therefore lag even in a good market when a SaaS vendor is unsure whether to bolt on one feature, migrate to a larger suite, or postpone enterprise readiness entirely.

      Adverse evidence also supports WorkOS’s positioning. Public “SSO tax” and “SCIM tax” trackers argue that many SaaS vendors still gate SAML and lifecycle automation behind enterprise tiers or opaque quotes, and the SCIM tax dataset documents a large installed base of apps still charging extra for automated provisioning. Stitchflow’s more aggressive critique claims 42% of 721 surveyed SaaS apps lock SCIM behind enterprise pricing, 57% offer no SCIM at any price, and only 1.2% include it on a base tier. Auth0’s own pricing page reinforces the broader pattern by tying enterprise connections, self-service SSO, and SCIM to B2B or enterprise packaging even while advertising AI-agent and FGA features higher in the stack. For WorkOS, that is the opportunity and the remaining diligence gap at once: the pain is obvious, but public evidence still does not isolate how much of that pain converts into durable standalone infrastructure revenue versus eventually being absorbed by larger identity suites.
