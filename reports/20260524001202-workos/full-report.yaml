      - number: '3.2'
        title: Direct embedded identity platforms
        blocks:
          - type: paragraph
            body: >-
              Among direct platforms, WorkOS's story is unusually cohesive: AuthKit gives embedded auth UI, pricing
              highlights enterprise federation primitives such as SSO and directory sync, and RBAC extends the stack
              into org-scoped authorization. Auth0 is the largest incumbent analogue because it also pitches B2B SaaS
              buyers on multi-tenancy, delegated admin, self-serve SSO, and migration tooling; that breadth gives it
              credibility with teams replacing an older auth layer rather than green-field startups. Clerk approaches
              the same job from the opposite end of the market with a lighter PLG motion around organizations, active
              org context, and lower entry pricing. Stytch has moved furthest beyond classic login into a wider auth,
              authorization, security, and agentic identity story, while PropelAuth competes by being opinionated about
              B2B defaults and undercutting on packaging. Frontegg and Descope widen the field further by pitching CIAM
              breadth and, increasingly, agentic or customer-journey language that narrows WorkOS's original messaging
              lead.
