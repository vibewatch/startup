      - number: '5.3'
        title: Security, deployment, and reliability posture
        blocks:
          - type: paragraph
            body: >-
              WorkOS exposes several places where integration quality matters more than the marketing copy. MFA is more
              than a checkbox: the public MFA product page describes TOTP and SMS factors behind one API, while AuthKit
              docs narrow the currently documented mandatory-flow behavior to non-SSO users using authenticator apps.
              Webhooks are also opinionated: endpoints must be HTTPS POST handlers, signed with a WorkOS-Signature
              header, and built to tolerate duplicate or out-of-order deliveries. Production retries can stretch across
              three days, which is useful for resilience but shifts idempotency and replay handling back to the
              integrator. For self-hosted customers, WorkOS can work in cloud-like connected deployments, but the
              on-prem guide still requires per-customer environments and API keys, firewall and callback planning, and a
              bespoke package for truly air-gapped installs. Security posture is credible at the checklist level—SOC 2
              Type 2, GDPR/CCPA, annual pentests, external code audits, and HIPAA BAAs for enterprise plans—but the
              public security page stops short of deep architecture details such as key-management ownership, residency
              options, or published recovery objectives.
