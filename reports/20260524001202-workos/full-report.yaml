figures:
  - id: FO001
    title: Company snapshot logic
    type: flow
    layout: wide
    summary: >-
      How WorkOS links enterprise-ready identity infrastructure to customer adoption, platform expansion, capital
      support, and an increasing trust burden.
    data:
      nodes:
        - id: n1
          label: Enterprise-ready identity APIs
          description: WorkOS starts from SSO, SCIM, MFA, auditability, and user management primitives for software vendors.
        - id: n2
          label: Faster enterprise onboarding
          description: >-
            A single integration and admin tooling let customers close IT-admin requirements faster than building
            in-house.
        - id: n3
          label: AI and B2B SaaS adoption
          description: Named customers and AI-native logos create proof that the product matters when startups move upmarket.
        - id: n4
          label: Platform expansion
          description: AuthKit, FGA, Radar, and adjacent trust products widen WorkOS beyond core federation and provisioning.
