  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              WorkOS deserves investor attention because it has real product urgency and real customer proof rather than
              only a financing headline. The March 2026 round priced the company at $2 billion, and WorkOS says the
              fastest-growing AI companies already on the platform include OpenAI, Anthropic, xAI, Cursor, Perplexity,
              Sierra, Replit, Vercel, and others. The company also says it has expanded from authentication into
              permissions, integrations, encryption, abuse detection, feature flags, and MCP, while running at five
              nines uptime across thousands of customers and billions of API requests each month. The customer stories
              page and homepage reinforce that the value proposition is not just technical elegance: WorkOS markets more
              than nine months of saved build time for enterprise SSO and SCIM, 50-plus integrations, and customer
              references that explicitly compare its enterprise-readiness favorably versus building internally or
              staying with older identity vendors.

              Those positives still do not clear the underwriting bar on their own. In the reviewed public source set,
              WorkOS does not disclose ARR, revenue growth, NRR, gross margin, exact customer count, headcount, burn, or
              liquidation preferences. That makes the $2 billion post-money impossible to verify directly. Instead, the
              round can only be tested indirectly against public comp multiples and algebraic revenue thresholds. On
              that basis the chapter lands on TRACK / research-more rather than buy: the price can be justified if
              WorkOS is already operating in the mid-$100 million ARR range with premium retention and a clean cap
              table, but it looks stretched if the revenue base is still below that band or if financing terms embed
              heavy preference overhang. The investment question is therefore not whether WorkOS is strategically
              interesting; it is whether the undisclosed operating base is already large enough to support a premium
              2026 identity multiple.
            claimRefs:
