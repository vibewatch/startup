      - number: '2.4'
        title: Standards, compliance, and the shift from authentication to authorization
        blocks:
          - type: paragraph
            body: >-
              Regulatory and standards pressure is one of the clearest reasons this market keeps expanding. SCIM is now
              a mature IETF standard for cross-domain identity management, with an explicit goal of reducing the cost
              and complexity of user management across enterprise-to-cloud scenarios. OIDC and SAML remain the core
              interoperability standards for federated enterprise login. NIST’s July 2025 digital identity revision
              added synced passkeys, subscriber-controlled wallets, and new controls for injection attacks and forged
              media, while NIST SP 800-207 and OMB M-22-09 push identity and access decisions toward zero-trust,
              per-request verification rather than perimeter trust. CISA’s maturity model operationalizes that shift
              with identity as a dedicated pillar. For B2B SaaS vendors, this means enterprise buyers increasingly
              expect standards-based identity plumbing and richer policy controls as baseline capabilities rather than
              premium extras.


              The market is also extending beyond authentication into fine-grained authorization. Google’s Zanzibar
              paper showed that relationship-based authorization can run at internet scale with sub-10 millisecond
              latency and extremely high availability. OpenFGA’s CNCF incubation in late 2025 signals ecosystem
              maturation, while both Auth0 and WorkOS now position FGA and AI-agent authorization as first-class product
              areas. WorkOS argues that agents are a distinct identity class and that flat RBAC cannot handle transient,
              task-scoped permissions. Auth0 says custom authorization logic does not scale for multi-tenant B2B APIs,
              MCP servers, and AI agents. Together those sources suggest a credible adjacency expansion for WorkOS: once
              authentication, provisioning, and logging are solved, authorization becomes the next control plane buyers
              want to outsource.
