  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Enterprise identity surface
        blocks:
          - type: paragraph
            body: >-
              WorkOS is best understood as an enterprise-readiness bundle rather than a single login widget. The current
              public surface spans Enterprise SSO, Directory Sync, User Management, AuthKit, MFA, Audit Logs, Admin
              Portal, and newer fine-grained authorization. The important architectural choice is that WorkOS does not
              try to become the customer's full application data layer: the SSO docs frame the product as authentication
              middleware, the user management pages repeatedly tell teams to keep their own user table current through
              the Events API, and AuthKit can be consumed either as hosted UI or as headless APIs. That gives startups a
              faster route to enterprise login and provisioning without fully outsourcing their core product model. The
              suite is also explicitly organization-aware: users can belong to organizations through memberships, JIT
              provisioning can attach people to orgs based on verified domains, and Admin Portal flows give IT teams a
              customer-facing setup path instead of engineering-led onboarding.
