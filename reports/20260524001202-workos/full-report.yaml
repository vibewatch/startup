      - number: '8.3'
        title: Scenario framework, valuation thresholds, and decision conditions
        blocks:
          - type: paragraph
            body: >-
              Because WorkOS does not disclose public revenue, the scenario framework is better expressed as threshold
              logic than as false precision around one hidden ARR number. At the current $2 billion valuation, WorkOS
              would need roughly $400 million of ARR at a 5x multiple, $250 million at 8x, $200 million at 10x, $167
              million at 12x, $133 million at 15x, and $100 million at 20x. Those thresholds let the comparable set do
              the work. If WorkOS is already above roughly $150 million of ARR with NRR above 120%, gross margins above
              75%, and credible enterprise conversion from its AI-customer base, then the current round can sit inside a
              defensible 12x to 15x AI-identity band. If ARR is closer to $100 million, however, the round implies
              around 20x ARR—much closer to 2021 scarcity pricing than to today's public identity range.

              The bull, base, and bear cases therefore depend on disclosure quality as much as operating performance.
              The bull case assumes WorkOS is already at or above the mid-$100 million ARR band, that AI-agent identity
              becomes an incremental monetization layer rather than only a narrative extension, and that the company can
              preserve an elite retention profile. The base case assumes solid but not spectacular scale, enough to make
              $2 billion fair-to-stretched but not obviously cheap. The bear case assumes revenue is still below the
              threshold implied by premium 2026 multiples or that financing terms materially dilute common-equity
              returns. Buy, track, and pass conditions should be tied directly to those thresholds rather than to
              enthusiasm about the identity category alone.
