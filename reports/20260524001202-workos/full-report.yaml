  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer segmentation
        blocks:
          - type: paragraph
            body: >-
              WorkOS sits in a crowded identity stack that no longer maps to one clean competitor set. The direct battle
              is against embedded B2B auth platforms such as Auth0, Clerk, Stytch, PropelAuth, Frontegg, and Descope,
              all of which promise faster enterprise readiness than building SAML, SCIM, org-aware permissions, and
              admin flows from scratch. The adjacent battle is against authorization specialists such as Permit.io and
              Cerbos, which can replace or complement WorkOS's newer RBAC story when a buyer wants deeper policy control
              than a bundled auth stack can offer. The substitute battle is against infrastructure that buyers already
              own, especially Amazon Cognito inside AWS accounts and Microsoft Entra External ID inside
              Microsoft-oriented enterprises. The status-quo path remains open source or custom build, with Keycloak and
              self-host friendly FusionAuth giving cost-sensitive or control-sensitive teams credible alternatives.
              WorkOS therefore wins most clearly when a buyer values integrated enterprise readiness more than lowest
              price, deepest policy model, or suite bundling.
            claimRefs:
