            Product and engineering leaders decide that identity is important but non-core and should not absorb scarce
            engineering time.
          actor: CTO / product / platform lead
          sentiment: neutral
        - label: Initial SSO deployment
          detail: WorkOS is integrated around the customer’s existing auth stack, often without a full rip-and-replace.
          actor: Engineering team
          sentiment: positive
        - label: IT-admin self-serve onboarding
          detail: Customer IT admins configure IdPs through Admin Portal instead of lengthy support calls or custom guides.
          actor: Enterprise IT admin
          sentiment: positive
        - label: Expansion into lifecycle and platform features
          detail: >-
            As the customer sells further upmarket, WorkOS expands into Directory Sync, User Management, Audit Logs, or
