  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      Decision chain from WorkOS's visible product and customer proof to the missing-metric hurdle that keeps the
      chapter at TRACK / research-more instead of buy. The figure emphasizes that the bottleneck is valuation
      verification, not category relevance.
    data:
      nodes:
        - id: funding-anchor
          label: March 2026 anchor
          detail: $100M Series C at a $2B valuation establishes the current underwriting reference point.
          type: process
        - id: customer-proof
          label: Customer proof
          detail: OpenAI, Anthropic, xAI, Cursor, Perplexity, and other AI leaders appear in WorkOS's public customer set.
          type: process
        - id: product-breadth
          label: Enterprise identity scope
          detail: >-
            WorkOS markets auth, permissions, integrations, encryption, abuse detection, feature flags, and MCP with
            five nines uptime.
          type: process
        - id: comp-test
          label: Comp test
          detail: >-
            2026 identity multiples span roughly 5x to mid-teens, with CrowdStrike as a much higher security ceiling and
            2021 Auth0 as an old peak-cycle outlier.
          type: process
        - id: missing-metrics
          label: Missing metrics
          detail: >-
            No public ARR, NRR, gross margin, headcount, concentration, or preference-stack disclosure is available in
            the reviewed source set.
          type: process
        - id: decision
          label: Recommendation
          detail: >-
            Track / research-more until WorkOS proves premium-scale economics or offers structure that protects
            downside.
          type: outcome
    approximationNotes: >-
      This flow is an analytic synthesis rather than a process disclosed by WorkOS. Each node is supported by explicit
      local claims and exists to show where the public-evidence chain currently breaks.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV037
      - CV044
      - CV046
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      ARR required to support a $2B valuation under different revenue or ARR multiple assumptions. The chart shows how
      quickly the required operating scale rises as the assumed multiple compresses toward today's public identity
      range.
    data:
      items:
        - label: 5x multiple
          value: 400
        - label: 8x multiple
          value: 250
        - label: 10x multiple
          value: 200
        - label: 12x multiple
          value: 167
        - label: 15x multiple
          value: 133
        - label: 20x multiple
          value: 100
    approximationNotes: >-
      Values are implied ARR thresholds in USD millions, derived by dividing the disclosed $2B round valuation by each
      selected multiple. The multiple set is informed by the public and private identity and SaaS references in this
      chapter.
    claimRefs:
      - CV041
      - CV042
      - CV043
      - CV052
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Scenario valuation ranges for WorkOS using assumed ARR bands and multiple bands rather than an undisclosed current
      revenue figure. The current $2B round anchor sits inside the bull band and near the top of the base band, which is
      why disclosure quality determines the recommendation.
    data:
      items:
        - label: Bear scenario range
          low: 420
          high: 1000
        - label: Base scenario range
          low: 1200
          high: 2240
        - label: Bull scenario range
          low: 2040
          high: 3520
        - label: Current round anchor
          low: 2000
          high: 2000
    approximationNotes: >-
      All values are in USD millions and come from the scenario assumptions in TV003. The current round anchor is the
      disclosed March 2026 valuation. The scenario ranges are not company forecasts; they are threshold tests showing
      what the business would need to look like for the round to be cheap, fair, or expensive.
    claimRefs:
      - CV001
      - CV049
      - CV050
      - CV051
      - CV052
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      IC-style scorecard across the six variables that most affect whether the $2B round is investable. The strongest
      signals are customer proof and product urgency; the weakest are metric disclosure and price verification.
    data:
      nodes:
        - id: kpi-customer-proof
          label: Customer proof
          detail: 'Strong: public customer set includes multiple frontier-AI companies and enterprise references.'
          type: strength
        - id: kpi-product-urgency
          label: Product urgency
          detail: >-
            Strong: enterprise SSO, permissions, auditability, and agent identity are mission-critical for fast-scaling
            software vendors.
          type: strength
        - id: kpi-build-vs-buy
          label: Build-vs-buy leverage
          detail: 'Positive: WorkOS markets >9 months of saved build time and 50+ integrations.'
          type: strength
        - id: kpi-multiple-context
          label: Multiple context
          detail: 'Mixed: AI-native assets earn a premium, but 2026 public identity multiples remain well below the 2021 peak.'
          type: neutral
        - id: kpi-metric-opacity
          label: Metric opacity
          detail: 'Weak: no public ARR, NRR, gross margin, headcount, or cap-table disclosure in the reviewed source set.'
          type: risk
        - id: kpi-price-sensitivity
          label: Price sensitivity
          detail: >-
            Weak-to-mixed: $2B is reasonable only if WorkOS already sits in the mid-$100M ARR band with premium
            retention.
          type: risk
    approximationNotes: >-
      KPI labels are qualitative analyst judgments derived from the chapter's claim set and are intended for decision
      framing, not for mechanical scoring.
    claimRefs:
      - CV004
      - CV006
      - CV037
      - CV039
      - CV044
      - CV045
