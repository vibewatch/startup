  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      WorkOS layers customer-facing auth surfaces over a shared identity control plane, operational events, and
      enterprise-system integrations while leaving app data ownership with the customer.
    data:
      layers:
        - label: Customer App Surface
          detail: >-
            Hosted AuthKit UI, customer-owned UI over APIs, and links back into Admin Portal. The application still owns
            its product DB, resource model, and session-aware business logic.
        - label: Identity Control Plane
          detail: >-
            User Management/AuthKit, Enterprise SSO, Directory Sync, organizations, roles, permissions, and FGA resource
            modeling exposed through one vendor surface.
        - label: Operational Event Layer
          detail: >-
            Events API, webhooks, Audit Logs, and log streaming. This layer keeps customer systems in sync but requires
            idempotent consumers and signature validation.
        - label: Developer Access Layer
          detail: >-
            Official SDKs and framework helpers across Node, Next.js/AuthKit, Go, PHP, and .NET plus Postman and API
            reference material.
        - label: External Enterprise Systems
          detail: >-
            Identity providers, directory providers, HRIS sources, SIEM destinations, and on-prem customer environments
            that connect to WorkOS via APIs, callbacks, and setup links.
    claimRefs:
      - CE003
      - CE006
      - CE020
      - CE026
      - CE029
      - CE035
