      - number: '3.3'
        title: Adjacents, substitutes, and bundled alternatives
        blocks:
          - type: paragraph
            body: >-
              The competitive frame gets harsher when buyers view identity as just one layer inside a broader platform
              decision. Permit.io and Cerbos attack the authorization layer directly, offering policy-centric control
              planes instead of full authentication suites; they pressure WorkOS whenever a team is willing to pair a
              separate auth service with a deeper policy engine. FusionAuth and Keycloak shift the argument again by
              optimizing for control, deploy-anywhere flexibility, and lower license spend, which matters for regulated
              deployments or engineering teams that already have identity expertise. AWS Cognito and Microsoft Entra
              External ID bring a different kind of pressure: they can look less elegant than WorkOS, but they ride
              broader platform budgets and trust anchors. Cognito can be good enough for AWS-centric teams that value
              managed CIAM plus passkeys and machine-to-machine auth, while Entra External ID extends into Microsoft
              collaboration and external-tenant patterns that many enterprises already understand. Those suite-driven
              defaults make WorkOS fight not just feature comparisons but also procurement gravity.
