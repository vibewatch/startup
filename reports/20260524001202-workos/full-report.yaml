    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and product scope
        blocks:
          - type: paragraph
            body: >-
              WorkOS’s public identity is unusually crisp: it sells developer APIs and SDKs that help software companies
              become “enterprise ready” faster rather than building identity and compliance plumbing themselves. Across
              the homepage, founding essay, docs, and later financing post, the company repeatedly frames the problem as
              crossing the “enterprise chasm” that appears when a product has user pull but lacks IT-admin requirements
              such as SSO, SCIM provisioning, auditability, permissions, and security controls. By 2026 the product
              footprint is materially broader than early SSO-plus-directory roots. WorkOS now publicly markets
              Enterprise SSO, Directory Sync, Audit Logs, AuthKit, MFA, FGA, Radar, and newer agent/auth connectors on
              the same platform surface. The strategic read is that WorkOS still starts from identity, but it
              increasingly presents itself as a developer-first trust layer for enterprise and AI software rather than a
              point product for login alone.
