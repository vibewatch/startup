            organization.
        - id: idp-directory-config
          label: Customer configures IdP or directory
          detail: WorkOS hosts provider-specific setup docs, connection testing, and optional attribute or role mapping.
        - id: user-auth
          label: End user authenticates
          detail: >-
            Users sign in via SSO, password, social login, or other AuthKit method and receive org-aware session
            context.
        - id: membership-roles
          label: Membership and roles resolved
          detail: Organization membership, role assignment, and optional directory-group precedence determine access state.
        - id: app-sync
          label: Customer app syncs state
          detail: >-
            The app persists or updates users and audit state through the Events API, webhooks, and app-owned data
            models.
      edges:
        - from: org-created
          to: portal-link
          label: Invite IT contact
        - from: portal-link
          to: idp-directory-config
          label: Configure connection
        - from: idp-directory-config
          to: user-auth
          label: Connection becomes active
        - from: user-auth
          to: membership-roles
          label: Resolve org + auth method
        - from: membership-roles
          to: app-sync
          label: Persist user and access state
        - from: idp-directory-config
          to: app-sync
          label: Provisioning updates
    claimRefs:
