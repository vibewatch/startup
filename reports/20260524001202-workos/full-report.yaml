        title: Capital adequacy and public evidence limits
        blocks:
          - type: paragraph
            body: >-
              Publicly disclosed equity financing is substantial, which is the strongest part of the capital-adequacy
              story. WorkOS explicitly said Series B left it with many years of runway, and Series C added another $100M
              to fund secure and reliable agentic-software capabilities. That is enough to conclude the company is not
              obviously undercapitalized on headline financing alone. But headline financing is not the same thing as a
              cash-underwriting package. No reviewed source disclosed cash on hand, monthly burn, burn multiple,
              working-capital profile, capex burden, or board-level financing plans.


              The filing record also underscores the opacity. The WorkOS legal entity is identifiable as WorkOS, Inc.,
              but an EDGAR full-text search for that exact name returned zero hits, leaving no public SEC trail to
              validate security types, any venture debt, or exact issuer history. That does not prove the company has no
              other financing instruments; it only shows that the public SEC search is not providing that evidence. As a
              result, the capital story is directionally positive because the company has repeatedly raised equity, yet
