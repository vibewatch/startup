            title: WorkOS is solving a market-structure problem, not just a protocol problem
            body: >-
              The category tailwind is not merely more IAM spend; it is the mismatch between enterprise buyers who
              require standards-compliant identity controls and SaaS product teams that do not want to become identity
              vendors.
