            body: >-
              Developer experience is one of WorkOS's clearest strengths, but it is not zero-friction. The docs and
              repositories show a broad SDK footprint across Node, Next.js/AuthKit, Go, PHP, .NET, and official Postman
              assets, and the Node README now exposes public-client PKCE flows for mobile and CLI use cases. The Next.js
