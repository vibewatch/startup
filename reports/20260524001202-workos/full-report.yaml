        title: Capital base, stage, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Public financing history supports a clean late-stage private-company read. WorkOS disclosed $19 million
              raised to date in its March 2021 financing announcement, an $80 million Series B in June 2022 led by
              Greenoaks, and a $100 million Series C in March 2026 at a $2 billion valuation led by Meritech and
              Sapphire. Summed mechanically, those official disclosures imply roughly $199 million of disclosed capital
