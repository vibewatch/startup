companyProfile:
  summary: >-
    WorkOS is a private, founder-led developer infrastructure company that sells enterprise-ready identity and trust
    building blocks to software vendors. Founded in 2019 by Michael Grinich after his experience at Nylas, the company
    has expanded from SSO and directory sync into user management, MFA, fine-grained authorization, auditability, abuse
    detection, and adjacent developer-facing controls. Public evidence supports a San Francisco base, a remote-first
    team, strong adoption among AI-native and B2B software companies, and a latest financing of $100M Series C at a $2B
    valuation, while leaving key operating metrics and governance details private.
  foundedDate: '2019-05-20'
  founders:
    - name: Michael Grinich
      role: Founder and CEO
      background: >-
        Former Nylas operator who built WorkOS after seeing enterprise requirements repeatedly block adoption of
        otherwise loved software products.
      claimRefs:
        - CO002
        - CO013
        - CO030
  foundingLocation: San Francisco, CA, USA
  headquarters: San Francisco, CA, USA
  productSummary: >-
    WorkOS provides APIs, SDKs, and hosted workflows for enterprise identity: SSO, SCIM directory sync, user management,
    MFA/AuthKit, audit logs, and fine-grained authorization, with newer surfaces in abuse detection and adjacent trust
    infrastructure.
  customerFocus: >-
    B2B SaaS and AI-native software companies that need enterprise-ready identity, authorization, and admin controls for
    their own customers.
  businessModel: >-
    Connection- and usage-based SaaS: free user management up to 1M users, paid enterprise SSO and directory-sync
    connections, add-ons for logs and verification workloads, plus premium support and annual-credit plans.
  stage: Series C
  fundingStatus: >-
    Privately held; latest public financing was a $100M Series C announced on 2026-03-02 at a $2B valuation, with
    disclosed cumulative capital of about $199M across the company history visible in public materials.
