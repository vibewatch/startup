      - CE007
      - CE014
      - CE017
      - CE023
      - CE024
  - id: FE003
    title: Critical dependency map
    type: dag
    layout: wide
    summary: >-
      WorkOS depends on external identity and directory systems, customer-owned webhook consumers, and connected-network
      deployment assumptions; those dependencies shape implementation risk more than the API surface alone.
    data:
      nodes:
        - id: customer-app
          label: Customer application
          detail: Owns the product DB, resource model, callback endpoints, and business logic.
        - id: workos-control
          label: WorkOS control plane
          detail: SSO, Directory Sync, organizations, role mapping, Audit Logs, and FGA APIs.
        - id: enterprise-idp
          label: Identity provider
          detail: Okta, Entra ID, Google Workspace, and other SAML/OIDC sources that drive enterprise sign-in.
        - id: directory-hris
          label: Directory or HRIS
          detail: SCIM-style provisioning and user lifecycle source systems that can send fragmented or bursty updates.
        - id: webhook-endpoint
          label: Customer webhook endpoint
          detail: Receives signed events, must validate timestamps, and tolerate duplicate or out-of-order delivery.
        - id: onprem-network
          label: Connected on-prem network
          detail: Customer-controlled firewalls and HTTPS ingress or egress rules for callbacks, APIs, and tunnels.
      edges:
        - from: enterprise-idp
          to: workos-control
          label: SAML/OIDC auth
        - from: directory-hris
          to: workos-control
          label: SCIM and directory data
        - from: workos-control
          to: customer-app
          label: Tokens, APIs, org context
        - from: workos-control
          to: webhook-endpoint
          label: Signed event delivery
        - from: webhook-endpoint
          to: customer-app
          label: State reconciliation
        - from: onprem-network
          to: workos-control
          label: Egress HTTPS traffic
        - from: workos-control
          to: onprem-network
          label: Callbacks, actions, webhooks
    claimRefs:
      - CE027
      - CE028
      - CE029
      - CE030
      - CE043
      - CE046
  - id: FE004
    title: Product maturity and capability map
    type: matrix
    layout: wide
    summary: >-
      WorkOS appears strongest in enterprise identity and onboarding primitives today; authorization is compelling but
      still the least fully-disclosed surface because several key capabilities remain marked coming soon.
    data:
