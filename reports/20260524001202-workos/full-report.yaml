        title: Switching costs, moat durability, and adverse lenses
        blocks:
          - type: paragraph
            body: >-
              WorkOS does have real switching-cost leverage after adoption, because user migration, organization models,
              federation connections, and permissions design all become part of the production control plane. That helps
              once a customer is live, but it does not fully solve forward-looking moat risk. The biggest adverse lens
              is pricing power: multiple direct rivals publicize generous free tiers or cheap community paths, while
              open-source and self-hosted substitutes give buyers a way to trade time for lower recurring spend. The
              second adverse lens is bundling. Cognito and Entra do not need to be best-in-class to win, only good
              enough inside accounts that already concentrate cloud or collaboration spend. The third adverse lens is
              breadth catch-up. WorkOS no longer owns the only credible enterprise-readiness narrative; adjacent vendors
              are adding agentic identity, broader CIAM, or policy depth on their public surfaces. Unless WorkOS can
              prove attach rates, expansion into authorization, and win-loss momentum, its bundle could drift from
              differentiated wedge to premium-priced convenience layer.
