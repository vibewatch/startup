      - number: '8.2'
        title: Comparable valuation context and market regime
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to frame WorkOS's valuation is to compare the $2 billion anchor against both current
              public identity and security multiples and historical identity transactions. On the public side, Okta
              trades around 4.8x EV/sales on roughly $2.92 billion of last-twelve-month revenue, while SailPoint trades
              around 8.0x EV/sales on about $1.07 billion of revenue. CyberArk is the strongest identity-security
              premium reference in the set: its May 2026 market cap is about $20.6 billion, against roughly $1.36
              billion of revenue and $1.44 billion of ARR, which implies a mid-teens revenue or ARR multiple.
              CrowdStrike is the broader security ceiling rather than a direct peer, with roughly $164.5 billion of
              enterprise value and about 34.2x EV/sales; WorkOS should not be underwritten at anything close to that
              ceiling absent extraordinary scale and proof.

              History matters because identity assets once cleared much richer prices. Okta agreed to buy Auth0 for
              about $6.5 billion in 2021, and TechCrunch reported Auth0 was expected to reach about $200 million of
              revenue that year, implying roughly 32.5x forward revenue during the identity-software scarcity peak.
              SailPoint's 2022 take-private at about $6.9 billion shows that scaled identity assets can still support
              multi-billion-dollar outcomes, but the market regime has changed. Reuters reported that by February 2026
              the S&P 500 software and services index had shed about $1 trillion in market value since late January,
              while sector commentary from Acquiry, Windsor Drake, and Aventis shows 2026 public SaaS multiples
              stabilizing far below the 2021 peak. The practical takeaway is straightforward: WorkOS may deserve an
              AI-native premium, but 2021 Auth0-style revenue multiples are no longer the default benchmark.
