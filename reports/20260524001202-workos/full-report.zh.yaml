      - CE029
      - CE030
      - CE043
      - CE046
  - id: FE004
    title: 产品成熟度和能力图
    type: matrix
    layout: wide
    summary: 从公开信息看，WorkOS 目前最强的是企业身份和上线基础件；授权有吸引力，但几项关键能力仍标着即将推出， 因此仍是披露最不完整的表面。
    data:
      columns:
        - 覆盖广度
        - 自助成熟度
        - 运行路径
        - 公开注意项
      rows:
        - label: SSO
          values:
            - 高 — SAML、OIDC、众多 IdP
            - 中 — Admin Portal + 文档
            - 独立 API 或 AuthKit
            - 未公开按 IdP 拆分的可靠性指标
        - label: Directory Sync
          values:
            - 高 — 预配、组、HRIS
            - 中 — Admin Portal 和集成
            - Webhooks 或 Events API
            - 未公开吞吐或规模基准
        - label: User Management/AuthKit
          values:
            - 高 — 完整认证表面
            - 高 — 托管 UI 加 API
            - 会话 + Events API 模型
            - 定价和部分深层限制仅部分公开
        - label: MFA
          values:
            - 中 — TOTP 和 SMS
            - AuthKit 仪表盘流程内成熟度高
            - API 加托管流程
            - SSO 专属执行细节公开有限
        - label: Admin Portal
          values:
            - 企业设置覆盖高
            - 高 — 核心自助差异点
            - 仪表盘链接或 Portal API
            - 每个组织一个连接的模型预设很强
        - label: Audit Logs
          values:
            - 中 — API + 流 + 留存
            - 中 — 有 schema 工具
            - API 和下游 SIEM
            - 存储架构和不可变性细节未公开
        - label: FGA
          values:
            - 中 — 已文档化资源范围模型
            - 中 — 现有文档和快速入门
            - 组织级用 JWT，资源级用 Authorization API
            - 用户组、子资源 IdP 映射和覆盖仍属即将推出
    approximationNotes: 矩阵评级是对公开文档和生态信号的分析性摘要，不是 WorkOS 自己的产品评分。
