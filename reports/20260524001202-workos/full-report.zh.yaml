          values:
            - Trust Center 材料陈旧
            - Hosted UI 与通行密钥迁移摩擦
            - Webhook/OIDC 或状态面事件复发
        - label: 低影响
          values:
            - 框架合作伙伴默认设置变更
            - 仅有公开网站条款不匹配
            - 自助式开发者定价竞争
    claimRefs:
      - CR009
      - CR014
      - CR023
      - CR024
      - CR029
      - CR032
      - CR036
      - CR043
      - CR046
  - id: FR002
    title: 风险传导图——WorkOS 风险如何流向收入、利润率和估值
    type: dag
    layout: wide
    summary: 身份入口故障先侵蚀客户信任、抬高接入摩擦，再传导到赢单率、留存、利润率，最终压到估值。
    data:
      nodes:
        - id: auth-regressions
          label: 身份验证回归
        - id: standards-drift
          label: 标准 / IdP 偏移
        - id: competitive-pricing
          label: 竞争性定价压力
        - id: compliance-gaps
          label: 合同 / 合规缺口
        - id: customer-trust
          label: 客户信任
        - id: win-rate
          label: 企业赢单率
        - id: retention
          label: 留存 / 扩张
        - id: gross-margin
          label: 毛利率
        - id: revenue
          label: 收入
        - id: valuation
          label: 估值
      edges:
        - from: auth-regressions
          to: customer-trust
          label: 打断关键任务工作流
        - from: standards-drift
          to: win-rate
          label: 拖慢集成和客户接入
        - from: competitive-pricing
          to: gross-margin
          label: 迫使折扣
        - from: compliance-gaps
          to: win-rate
          label: 安全审查不过
        - from: customer-trust
          to: retention
          label: 抬高流失风险
        - from: win-rate
          to: revenue
          label: 净新增客户减少
        - from: retention
          to: revenue
          label: 扩张和 NRR 走低
        - from: gross-margin
          to: valuation
          label: 削弱现金生成
        - from: revenue
          to: valuation
          label: 压缩倍数支撑
        - from: customer-trust
          to: valuation
          label: 抬高风险溢价
