  - id: TV005
    title: 投资逻辑破裂与触发表
    columns:
      - 触发因素或条件
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 买入门槛未达成
        - 管理层无法拿出至少约 $150M ARR，同时证明高留存和高质量利润率。
        - 按 2026 年身份和 SaaS 可比估值区间，当前 $2B 定价仍缺支撑。
        - 继续跟踪或退出；不要硬给买入结论。
      - - 发现优先权负担
        - Series C 条款包含激进清算优先权、参与型优先股安排，或异常大的反稀释保护。
        - 即使企业价值判断方向正确，普通股上行空间也会被压缩。
        - 除非重新谈定价格或结构，否则放弃。
      - - 倍数重置持续
        - 公开市场软件倍数仍钉在修正后的 6x-8x 区间附近，身份同业也未重估。
        - 私募账面估值支撑转弱，溢价入场价格失去下行保护。
        - 收紧价格纪律，并要求更强经营证据。
      - - 企业转化不及预期
        - AI 客户 logo 没能转化为可复制扩张，或客户集中度被证明过高。
        - 溢价叙事从耐用平台转向集中敞口。
        - 将公司估值重估至较低的私有 SaaS 区间。
      - - AI 智能体叙事仍停在变现前
        - 智能体相关身份仍是路线图话术，而非已签约收入。
        - 溢价倍数中相当一部分变成尚未挣到的可选性。
        - 只按核心企业认证平台测算，不给未来故事估值。
      - - 隐藏指标不及预期
        - ARR 低于 ~$100M，或 NRR 接近 100%。
        - 本轮更像高峰周期的超额支付，而非有依据的溢价定价。
        - 按当前估值坚决放弃。
    notes: 前两行是投前门槛，后几行是持续跟踪的投资逻辑破裂指标。每个触发因素都要逼出清晰行动，而不是模糊观察项；符合价格敏感型建议。
    claimRefs:
      - CV035
      - CV037
      - CV044
      - CV048
      - CV051
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 当前 ARR 和增长桥
        - 已审阅的 2026 年来源中，WorkOS 没有公开 ARR 或收入披露。
        - $2B 究竟有吸引力、公允还是偏高，核心只看这个变量。
        - 向管理层索取最新 ARR、季度增长趋势和企业收入占比。
      - - NRR、GRR 和毛利率
        - 公开来源未披露留存或利润率质量。
        - AI 原生溢价倍数需要证明扩张可持续、单位经济模型有吸引力。
        - 索取按主要产品线拆分的队列留存、毛利率和回本周期数据。
      - - 精确客户数和集中度
        - WorkOS 只披露数千家客户和具名 logo，未披露精确数量或集中度。
        - 如果少数 AI 头部客户主导 ARR，即便 logo 很多，经济上仍可能高度集中。
        - 索取精确客户数、前 10 大客户集中度和续约计划。
      - - 员工数和烧钱速度
        - 已审阅来源未发现 2026 年公开员工数或烧钱披露。
        - 投资人需要判断，公司能否在不以不利条款再融资的情况下消化本轮估值。
        - 索取按职能拆分的员工数、现金消耗，以及基准和悲观招聘计划下的现金跑道。
      - - 股权结构表和清算优先权
        - 公开记录未披露 Series C 后优先股堆叠或任何投资人保护。
        - 如果权利堆栈很厚，即便企业价值结果不错，普通股回报仍可能偏弱。
        - 审阅投后股权结构表、清算瀑布和任何优先证券条款。
      - - AI 智能体身份变现
        - 公开来源描述了智能体身份机会，但没有量化现有收入贡献。
        - 没有付费采用证据时，可选性不应像已验证 ARR 一样资本化。
        - 索取面向智能体产品的销售管线、付费客户数、定价模型和附加率数据。
    notes: 这些问题按估值影响排序，而非按叙事吸引力排序。前四项是核心投资测算输入，后两项决定当前溢价应维持还是打折。
    claimRefs:
      - CV044
