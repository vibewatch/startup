        - id: webhook-endpoint
          label: 客户 webhook 端点
          detail: 接收签名事件，必须验证时间戳，并能容忍重复或乱序投递。
        - id: onprem-network
          label: 已连接本地网络
          detail: 客户控制的防火墙，以及用于回调、API 和隧道的 HTTPS 入站或出站规则。
      edges:
        - from: enterprise-idp
