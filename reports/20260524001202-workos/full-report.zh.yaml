            body: >-
              当买方把身份视为更大平台决策中的一层时，竞争框架会更严苛。Permit.io 和 Cerbos
              直接攻击授权层，提供以策略为中心的控制平面，而不是完整认证套件；团队愿意把单独认证服务与更深策略引擎搭配时，它们就会挤压 WorkOS。FusionAuth 和 Keycloak
              通过优化控制权、任意部署灵活性和更低许可证支出，重新定义争论；这对受监管部署或已有身份专家的工程团队很重要。AWS Cognito 和 Microsoft Entra External ID
              带来另一种压力：它们可能不如 WorkOS 优雅，但背靠更广的平台预算和信任锚点。Cognito 对以 AWS 为中心的团队可能已经够用，尤其是它们重视托管 CIAM、passkeys
              和机器到机器认证；Entra External ID 则延伸到许多企业已理解的 Microsoft 协作和外部租户模式。这些套件驱动的默认选项，让 WorkOS 不只是在打功能比较，也在对抗采购重力。
