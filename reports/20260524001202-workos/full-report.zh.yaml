      - number: '7.2'
        title: 安全、可靠性与标准依赖风险
        blocks:
          - type: paragraph
            body: >-
              WorkOS 卡在身份边缘，登录、配置开通或授权路径哪怕短暂出错，都会影响下游客户。2026 年 5 月状态页给了一个有用的现实校验：WorkOS 前 90 天核心服务可用性为
              100%，但同一个公开页面在同月记录了仪表盘和文档不可用、webhook 投递延迟、OIDC 错误，以及 AuthKit
              邮件渲染事故。这个组合不能证明控制体系大面积失效，但它说明，即便头部可用性看起来干净，支撑服务和边缘场景事故仍会触达客户。


              2026 年 SDK 和 issue 轨迹也强化了这个风险。WorkOS 发布了多项认证加固变更，覆盖 OAuth state 验证、PKCE cookie 隔离、原始字节 webhook 验证、Python
              依赖安全，以及多次主要 SDK 迁移。公开 GitHub issue 显示的问题不只是理论边缘场景：客户报告过功能开关 定向与 JWT claims 不一致、过期组织 ID 导致 400
              认证失败、托管登录触发双重 Cloudflare challenge、同步的 token-refresh 重试、passkey
              注册缺口，以及托管登录流程可能自动创建非预期账号。单看哪一项都不致命，但合在一起，说明平台仍在消化快速产品扩张，同时还要守住关键认证路径。


              标准层让问题更复杂。WorkOS 自己记录，SCIM 实现会随提供方不同而变化，并可能引入安全漏洞；其 SAML 指南也直说，SAML 常见但容易出漏洞，能用 OIDC
              时更好。这个技术框架是对的，但也确认了依赖关系：WorkOS 不控制 SAML、OIDC 或 SCIM，也无法强迫 Microsoft、Okta、Google、Workday 和客户自有 IdP
              行为一致。标准漂移、身份提供商怪癖，或受监管客户在 NIST 式身份规则下改变预期，都可能带来支持负担、连接器脆弱性和更慢的价值落地。
