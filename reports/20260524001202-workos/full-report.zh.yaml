            body: >-
              WorkOS 最适合理解为企业就绪套装，而不是单一登录组件。当前公开表面横跨 Enterprise SSO、Directory Sync、User Management、AuthKit、MFA、Audit
              Logs、Admin Portal 和较新的细粒度授权。关键架构选择在于，WorkOS 不试图成为客户完整应用数据层：SSO 文档把产品定义为认证中间件；用户管理页面反复要求团队通过 Events API
              保持自己的用户表更新；AuthKit 既可作为托管 UI，也可作为无头 API
              使用。这让初创公司能更快拿到企业登录和用户预配，而无需完全外包核心产品模型。套件也明确具备组织感知特征：用户可通过成员关系属于组织，JIT provisioning 可基于已验证域名把人挂到组织，Admin
              Portal 流程给 IT 团队一条面向客户的设置路径，而不是由工程主导入驻。
