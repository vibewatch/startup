              WorkOS 暴露出多个地方：集成质量比营销文案更重要。MFA 不只是打勾项；公开 MFA 产品页描述一个 API 后面的 TOTP 和 SMS 因素，而 AuthKit
              文档把当前已记录的强制流程行为收窄到使用认证器应用的非 SSO 用户。Webhooks 也很有主张：端点必须是 HTTPS POST 处理器，用 WorkOS-Signature header
              签名，并能容忍重复或乱序投递。生产重试可以拉长到三天，这有利于韧性，但也把幂等性和重放处理推回给集成方。对于自托管客户，WorkOS 可在类似云的联网部署中工作，但本地部署指南仍要求每个客户单独环境和 API
