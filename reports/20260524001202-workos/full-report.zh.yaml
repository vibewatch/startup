        title: 控制平面与授权模型
        blocks:
          - type: paragraph
            body: >-
              底层看，WorkOS 不只是协议抽象，而是一个共享控制平面，把来自 IdPs、目录和应用认证事件的输入标准化。SSO 接受 SAML 或 OIDC，但暴露的是类似 OAuth
              的发起和回调流程，并带有组织感知重定向处理。Directory Sync 与这条路径并行，摄入目录和 HRIS 变更，标准化用户和组，再通过 webhooks 或 Events API
              回传。组织成员关系随后成为从身份到授权的桥。基础 RBAC 围绕环境和成员关系展开，包含默认角色、可选多角色模式，以及来自 SSO 或 SCIM 来源的组到角色映射。FGA 把该模型从组织范围权限延伸到
              workspaces、projects、apps 等资源树。公开文档把这定位为渐进采用，而不是全面重写：组织范围角色可留在令牌里做快速检查，资源范围决策则迁移到 Authorization API。
