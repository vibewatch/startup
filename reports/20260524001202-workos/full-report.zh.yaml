      - number: '7.4'
        title: 缓释成熟度、剩余暴露与否决标准
        blocks:
          - type: paragraph
            body: >-
              WorkOS 看起来并不鲁莽。公开材料展示了一套连贯的缓释栈：正式 DPA、单独的企业 SLA、状态页、Trust Center、最新融资，以及 2026 年反复出现的 SDK
              修复，而不是可见停滞。这些都是企业身份厂商该有的材料。问题在剩余暴露，而不是没有控制。公司仍在认证、功能开关、权限、滥用检测和智能体安全用例上快速推进，同时依赖异质外部标准和客户
              IdP。公司刚完成大额融资、外部预期正在抬升，这个组合会提高回归缺陷、迁移摩擦和企业定制诉求出现的概率。


              因此，本章否决标准盯的是可衡量信号，而不是叙事上的不适。硬停止信号包括：任何面向客户的安全事故，表现出类似 Okta 身份供应链的传导机制；修复后仍反复出现公开 认证回归；或有证据显示，企业 SLA 与
              Trust Center 材料显著窄于拿下受监管客户所需承诺。较软但仍严肃的预警是竞争压缩：如果 Microsoft、AWS、Auth0、Clerk 或 Stytch 能以更低有效成本匹配核心功能，WorkOS
              的销售效率和长期利润率假设会很快变化。


              核心尽调要求是私有证据。投资者不应只靠公开网站条款、营销徽章或创始人博客，就放行合同、数据驻留或流动性风险。在承销本轮或把业务标记为基础设施级之前，应索取客户 MSA
              和安全附件、当前子处理方与托管区域矩阵、SLA 赔付历史、续约和流失数据，以及产品级 ARR 或毛利率组合。如果这些私有材料显示集中度、高事故处理负担或采购高度依赖让步，WorkOS
              的风险画像应比公开表面显示的情况明显更差。
