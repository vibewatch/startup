      - number: '2.4'
        title: 标准、合规，以及从认证转向授权
        blocks:
          - type: paragraph
            body: >-
              监管和标准压力，是该市场持续扩张最清楚的理由之一。SCIM 现在是成熟的 IETF 跨域身份管理标准，明确目标是降低 enterprise-to-cloud 场景中用户管理的成本和复杂度。OIDC 和 SAML
              仍是联合企业登录的核心互操作标准。NIST 的 July 2025 数字身份修订增加了 同步 passkeys、订阅者控制钱包，以及针对注入攻击和伪造媒体的新控制；NIST SP 800-207 和 OMB
              M-22-09 则把身份与访问决策推向零信任、逐请求验证，而不是边界信任。CISA 的 maturity model 用身份作为专门支柱，把该转向操作化。对于 B2B SaaS
              厂商，这意味着企业买家越来越把基于标准的身份管线和更丰富的策略控制当作基础能力，而不是高级附加项。


              市场也在从认证延伸到细粒度授权。Google 的 Zanzibar 论文证明，基于关系的授权可以在互联网规模下运行，并保持低于 10 毫秒延迟和极高可用性。OpenFGA 在 late 2025 进入 CNCF
              孵化，说明生态成熟；Auth0 和 WorkOS 也都把 FGA 与 AI 智能体授权放到一等产品领域。WorkOS 认为智能体是一个独立身份类别，扁平 RBAC 无法处理瞬时、任务范围权限。Auth0
              则称，定制授权逻辑无法扩展到多租户 B2B API、MCP servers 和 AI 智能体。这些来源合在一起，指向 WorkOS
              可信的邻近扩张：认证、用户预配和日志解决后，授权会成为买家想外包的下一个控制平面。
            claimRefs:
              - CM029
              - CM030
              - CM031
              - CM032
