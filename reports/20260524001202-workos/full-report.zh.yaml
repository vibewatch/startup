    type: matrix
    layout: wide
    summary: 最高风险簇落在身份验证回归、标准依赖、价格压缩与客户关键任务工作流交汇的位置。
    approximationNotes: 发生可能性和影响是基于截至 2026-05-24 公开证据的分析判断；单元格展示主导风险标签，不代表概率。
    data:
      columns:
        - 低发生可能性
        - 中发生可能性
        - 高发生可能性
      rows:
        - label: 严重影响
          values:
            - 重大身份供应链事件
            - 企业数据驻留违反客户承诺
            - 生产环境身份验证层安全回归
        - label: 高影响
          values:
            - Series C 轮估值与非公开指标错配
            - SCIM/SAML/OIDC 依赖导致客户接入断裂
