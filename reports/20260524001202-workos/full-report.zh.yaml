      - number: '4.5'
        title: 财务判断与尽调卡点
        blocks:
          - type: paragraph
            body: >-
              正面案例很直接。WorkOS 有宽广的企业身份变现表面、异常清楚的公开标价、可信具名客户，以及穿透 Series C 的清晰融资跃升。这些事实支持一个判断：需求质量真实，WorkOS
              正在搭建严肃的类别平台，而不是单点功能。公司也像是在产品扩张前融资，而非困境中融资，因此降低了近端融资焦虑。


              负面案例使本章无法给出干净承保结论。公开数据没有披露经审计收入、ARR、毛利率、客户集中度、NRR、CAC、回本周期、烧钱 或当前现金。第三方收入估计从 $12.8M 到 $30M
              互相冲突，且一家数据厂商一边声称 WorkOS 是
              bootstrapped，一边无视公司自己的融资披露。这些不是小缺口；它们是判断收入质量、效率和现金跑道的核心输入。因此，财务判断在商业动能和资本可得性上为正，但在已兑现经济性上不完整。任何投资流程都应把管理层私人财务包视为必需项，而不是可选项。
