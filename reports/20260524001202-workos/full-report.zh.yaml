      - number: '2.2'
        title: 规模测算口径、重叠和现实承保分母
        blocks:
          - type: paragraph
            body: >-
              自上而下的市场证据支持基本判断，但不能相加。公开分析师页面把广义 IAM 放在 2026 年等效口径约 $24.8 billion 到 $28.7 billion；CIAM 专项估计集中在 2026 年
              $13.3 billion 到 $14.5 billion。访问管理预测同样庞大，一个公开估计为 2026 年 $25 billion，且该类别内部有 31% 的审计 / 合规 /
              治理切片。MarketsandMarkets 也把 B2B 身份、consumer IAM 和 非人类身份明确当作广义 IAM 市场的切片；另一个非人类身份访问管理预测到 2030 年达到 $18.71
              billion。这些数字确认 WorkOS 位于真实扩张的控制层，但也说明简单 TAM 算术会夸大机会。


              正确承保动作是保留多套口径，而不是挑最大标题数字。广义 IAM 是外层天花板，因为它包含让 WorkOS 相关的协议、治理和访问控制功能。CIAM 更接近 WorkOS AuthKit
              和外部用户身份。访问管理与审计 / 合规数据覆盖推动 Enterprise 和 Scale plan 需求的管理与取证型工作流。非人类身份和智能体授权扩大 FGA
              周边邻近空间，但还不是当前收入的清晰替代。公开来源没有给出「卖给 B2B SaaS 厂商的企业功能基础设施」的独立市场规模序列。缺了这座桥，精确公开 SAM 或 SOM 仍无法有把握地拆出来。
