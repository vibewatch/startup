  summary: >-
    WorkOS 是一家由创始人主导的私人开发者基础设施公司，向软件厂商出售企业就绪的身份与信任构件。Michael Grinich 在 Nylas 经历后于 2019 年创办公司；WorkOS 从 SSO
    和目录同步扩展到用户管理、MFA、细粒度授权、可审计性、滥用检测，以及邻近的开发者控制。公开证据支持几个判断：公司位于 San Francisco、团队远程优先、在 AI 原生和 B2B 软件公司中采用度强，最近一轮融资为
