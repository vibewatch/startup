    notes: 可比集刻意只取部分样本。它混合当前公开市场基准和历史身份交易，从几个角度框定 2026 年 3 月 WorkOS 融资轮。倍数没有按增长、NRR 或利润率归一化；因此，WorkOS 未披露的经营指标对估值判断极为关键。
