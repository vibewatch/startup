      - number: '8.2'
        title: 可比估值背景与市场制度
        blocks:
          - type: paragraph
            body: >-
              给 WorkOS 估值，最干净的框架是把 $2 billion 锚点同时放到当前公开身份 / 安全倍数和历史身份交易里比较。公开市场侧，Okta 在约 $2.92 billion
              过去十二个月收入上，EV/sales 约 4.8x；SailPoint 在约 $1.07 billion 收入上，EV/sales 约 8.0x。CyberArk 是这组中最强的身份安全溢价参照：2026 年 5
              月市值约 $20.6 billion，对应约 $1.36 billion 收入和 $1.44 billion ARR，隐含十几倍中段的收入或 ARR 倍数。CrowdStrike
              是更广义安全上限，而不是直接同业：企业价值约 $164.5 billion，EV/sales 约 34.2x；除非规模和证据异常强，WorkOS 不应按接近这个上限来承销。

              历史也重要，因为身份资产曾经卖出更高价格。Okta 2021 年同意以约 $6.5 billion 收购 Auth0；TechCrunch 报道称，Auth0 预计当年收入约 $200
              million，意味着在身份软件稀缺性高峰期，前瞻收入倍数约 32.5x。SailPoint 2022 年约 $6.9 billion
              私有化说明，规模化身份资产仍能支撑数十亿美元级结果，但市场制度已经变了。Reuters 报道，到 2026 年 2 月，S&P 500 software and services index 自 1
              月下旬以来已蒸发约 $1 trillion 市值；Acquiry、Windsor Drake 和 Aventis 的行业评论也显示，2026 年公开 SaaS 倍数稳定在远低于 2021
              年峰值的位置。实际结论很直接：WorkOS 也许配得上 AI 原生溢价，但 2021 年 Auth0 式收入倍数已不再是默认基准。
