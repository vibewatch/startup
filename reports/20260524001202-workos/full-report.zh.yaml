figures:
  - id: FO001
    title: 公司快照逻辑
    type: flow
    layout: wide
    summary: WorkOS 如何把企业级身份基础设施与客户采用、平台扩张、资本支持，以及不断加重的信任负担串起来。
    data:
      nodes:
        - id: n1
          label: 企业级身份 API
