  - id: FI001
    title: 收入模型桥
    type: flow
    layout: wide
    summary: WorkOS 先靠慷慨免费层拿到开发者采用；企业需求触发后，再用付费连接、附加项和支持变现。
    data:
      nodes:
        - id: free
          label: 免费用户管理
          detail: 最多 1M 用户可先使用用户管理层，之后才触发超量定价。
          tone: positive
        - id: trigger
          label: 企业需求出现
          detail: 客户需要 SSO、SCIM、审计能力、管理工具或合规控制。
          tone: neutral
        - id: conn
          label: 付费 SSO / SCIM 连接
          detail: 企业连接把客户关系转成按月循环账单。
          tone: positive
        - id: addons
          label: 基础设施附加项
          detail: 日志流、留存以及滥用 / 验证检查带来增量可计费用量。
          tone: positive
        - id: support
          label: 高级支持
          detail: Slack、引导式上线和 SLA 增加一层服务相关变现。
          tone: neutral
        - id: gross
          label: 确认经常性收入
          detail: 多条变现面贡献经常性收入，但实际组合未公开。
          tone: positive
