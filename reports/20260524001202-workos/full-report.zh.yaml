      - number: '7.3'
        title: 平台依赖、商业压力与集中风险
        blocks:
          - type: paragraph
            body: >-
              WorkOS 的范围确实不止一个狭义 SSO 包装层，但公开证据仍把公司放在同一个控制平面内：企业身份、授权、可审计性和相邻安全工具。2026 年 3 月 Series C 帖子称，WorkOS
              现在覆盖权限、集成、加密、滥用检测、功能开关和 MCP；公开定价页面仍锚定在
              用户管理、SSO、目录同步、可审计性和相邻访问功能上。这意味着扩张上行真实存在，但单一技术栈集中也同样存在：一旦核心认证和目录叙事走弱，相邻产品大概率会一起走弱，而不是形成抵消。


              锁定效应双向作用。Hosted UI 是最容易上手的路径，但文档说得很清楚：不想使用 WorkOS 托管认证界面的团队，必须自己承担更多 API 和状态管理复杂度。Passkeys 会加深这个取舍，因为
              WorkOS 建议客户在生产前设置自定义域名；passkeys 一旦注册到该域名，后续迁移就更难。官方 Laravel 包带来分发杠杆，但也意味着 WorkOS
              采用可能嵌入另一个生态系统的默认值。产品跑得好时，这些动态有利于净留存；但如果定价、事故响应或产品方向变化，冲击半径也会更大。


              竞争压力是最尖锐的商业风险。Auth0、Clerk 和 Stytch 都公开了慷慨的入门定价，Microsoft Entra 和 AWS Cognito 则能搭上既有云或办公生产力预算。Hanko
              等开源替代方案明确把 WorkOS 作为对标对象。身份厂商这个类别还有声誉问题：Okta 支持系统被攻破说明，IAM 提供商事故破坏力很大，因为供应商被攻破可能演变为客户生态被攻破。WorkOS 自己的
              Series C 带来流动性和可信度，但公开 ARR、烧钱速度、流失和产品组合披露仍然缺席。因此，投资者是在信息不完整的情况下承销 $2 billion
              估值：新产品究竟显著分散收入，还是只是扩大执行表面积，仍看不清。
