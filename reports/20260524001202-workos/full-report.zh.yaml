            body: >-
              公开披露的股权融资金额很大，这是资本充足性故事中最强的一环。WorkOS 明确表示 Series B 后拥有多年现金跑道，Series C 又增加
              $100M，用于资助安全可靠的智能体软件能力。仅看融资标题数字，足以判断公司并不明显缺钱。但融资标题数字不等于现金承保包。已审阅来源没有披露手头现金、月度烧钱、烧钱倍数、营运资本状况、资本开支负担或董事会层面的融资计划。


              备案记录也凸显不透明。WorkOS 法人实体可识别为 WorkOS, Inc.，但针对该精确名称的 EDGAR 全文搜索返回零结果，没有公开 SEC
              轨迹可验证证券类型、任何风险债或准确发行人历史。这并不证明公司没有其他融资工具；它只说明公开 SEC 搜索没有提供该证据。因此，资本故事因公司反复融资而方向性正面，但用于尽调现金充足性和融资依赖时仍不完整。
