      - number: '8.3'
        title: 情景框架、估值阈值与决策条件
        blocks:
          - type: paragraph
            body: >-
              WorkOS 没有公开披露收入，因此情景框架最好用阈值逻辑表达，而不是围绕一个隐藏 ARR 数字制造虚假精确。在当前 $2 billion 估值下，WorkOS 需要约 $400 million ARR 才能对应
              5x 倍数；$250 million 对应 8x；$200 million 对应 10x；$167 million 对应 12x；$133 million 对应 15x；$100 million 对应
              20x。这些阈值让可比集合自己发挥作用。如果 WorkOS 已经高于约 $150 million ARR，NRR 高于 120%、毛利率高于 75%，且能从 AI
              客户群可信转化企业客户，那么当前轮次可以落在一个可防守的 12x 至 15x AI 身份区间内。但如果 ARR 更接近 $100 million，本轮就隐含约 20x ARR——这更接近 2021
              年稀缺性定价，而不是今天的公开身份区间。

              乐观、基准和悲观情景因此同样取决于披露质量，而不只是运营表现。乐观情景假设 WorkOS 已经处于或高于 mid-$100 million ARR 区间，AI 智能体身份
              成为增量变现层，而不只是叙事延伸，并且公司能够守住顶级留存画像。基准情景假设规模扎实但不惊艳，足以让 $2 billion 看起来合理到偏高，但并不明显便宜。悲观情景假设收入仍低于 2026
              年溢价倍数隐含的阈值，或融资条款实质稀释普通股回报。买入、观察和放弃条件应直接绑定这些阈值，而不是只绑定对身份类别的热情。
