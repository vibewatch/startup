  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              WorkOS 值得投资者关注，因为它有真实的产品紧迫性和客户证明，而不只是融资标题。2026 年 3 月融资把公司定价到 $2 billion；WorkOS 称，平台上增长最快的 AI 公司已经包括
              OpenAI、Anthropic、xAI、Cursor、Perplexity、Sierra、Replit、Vercel 等。公司还称，它已从认证 扩到权限、集成、加密、滥用检测、功能开关和
              MCP；同时在数千客户和每月数十亿 API 请求上跑出五个 9 可用性。客户故事页和首页进一步说明，价值主张不只是技术优雅：WorkOS 营销企业 SSO 和 SCIM 可节省超过 9 个月自建时间、拥有
              50-plus 项集成，并引用客户明确表示，相比内部自建或继续使用老身份厂商，它更能支撑企业就绪度。

              这些正面因素本身仍过不了承销门槛。在本次审阅的公开来源集中，WorkOS 没有披露 ARR、收入增长、NRR、毛利率、准确客户数、员工数、烧钱速度或清算优先权。因此，$2 billion
              投后估值无法直接验证。只能用公开可比公司倍数和代数收入阈值来间接测试。本章因此落在观察 / 继续研究，而不是买入：如果 WorkOS 已经在 mid-$100 million ARR
              区间运营，且留存优异、股权结构表干净，这个价格可以成立；但如果收入基数仍低于这个区间，或融资条款埋有沉重优先权悬挂，估值就显得偏紧。投资问题不是 WorkOS
              是否有战略吸引力，而是未披露的运营基数是否已经大到足以支撑 2026 年身份赛道的溢价倍数。
