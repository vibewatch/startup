  - id: FM001
    title: 市场规模视角
    type: pyramid
    layout: wide
    summary: WorkOS 的机会嵌在更宽的 IAM 和 CIAM 中，但可变现层是 B2B 软件厂商为签下并留住大客户而购买的企业就绪基础设施。
    data:
      items:
        - label: 广义 IAM 伞形市场
          value: Provisioning, directory, SSO, advanced auth, governance, PAM, workforce, CIAM, B2B, non-human identity
          note: IAM 分析机构给出的最大公开分母
        - label: 外部用户身份层
          value: CIAM, org-aware auth, social and passwordless login, federation, account lifecycle
          note: 看 AuthKit 和外部用户身份的最接近自上而下口径
        - label: 企业功能基础设施
          value: SSO connections, SCIM and directory sync, audit logs, admin onboarding, org policies
          note: WorkOS 面向 B2B SaaS 厂商的当前商业切入点
        - label: 授权相邻市场
          value: RBAC, FGA, delegated access, agent and MCP authorization, auditable policy changes
          note: 买方从登录走向最小权限控制时形成的增长层
        - label: 投资测算切口
          value: Per-connection enterprise readiness sold into products, not entire corporate IAM replacement
          note: 实际分母窄于单看广义 IAM 或 CIAM
    claimRefs:
      - CM001
      - CM004
      - CM005
      - CM012
      - CM049
