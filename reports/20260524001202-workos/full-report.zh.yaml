  - id: TV002
    title: 正向论点 / 反向论点表
    columns:
      - 支柱
      - 正向论点
      - 反向论点
      - 改变判断的证据
    rows:
      - - 客户证明
        - WorkOS 已服务一组少见的 AI 头部客户，包括 OpenAI、Anthropic、xAI、Cursor 和 Perplexity；这说明企业级身份基础设施的产品-市场时点很强。
        - 公开客户 logo 不透露合同规模、留存质量，也不说明收入有多少集中在少数 AI 爆发赢家身上。
        - 披露准确 ARR、头部客户集中度和按年份队列拆分的留存。
      - - 产品宽度
        - 公司已从认证扩展到权限、集成、加密、滥用检测、功能标记和 MCP，抬高切换成本和账户价值。
        - 单靠产品宽度不能证明货币化深度；部分模块可能仍是采用辅助，而非实质收入线。
        - 按主要模块拆分收入贡献和附加率。
      - - 企业转化
        - WorkOS 宣传可节省 9 个月以上构建时间、覆盖 50 多个集成并加快实施，支撑了面向快速扩张软件厂商的 ROI 故事。
        - 集成更快可以赢得试点，但不保证长期扩张或溢价定价权。
        - 提供企业转化的胜率、扩张和回本数据。
      - - AI 顺风
        - AI agent 身份叙事可能把平台从员工和应用身份，扩展为自治软件的更广权限层。
        - AI agent 机会在已审查公开证据中仍更像叙事，还不是经审计收入流。
        - 展示真实运行的 AI agent 相关客户、定价和收入贡献。
      - - 可比框架
        - CyberArk 和高溢价 AI-native SaaS 区间显示，优质身份或安全资产在 2026 年仍能拿到双位数收入或 ARR 倍数。
        - Okta 和 SailPoint 表明，当前公开身份倍数远低于 2021 年稀缺定价，$2B 私募轮的门槛因此明显更高。
        - 披露足够指标，让 WorkOS 能可信地落入可比公司集合。
      - - 市场环境
        - 即便市场已修正，AI-native 资产仍可获得溢价。
        - 软件板块抛售和 post-2021 倍数重置意味着，投资人不再愿意为没有证据的故事付费。
        - 验证 Rule-of-40 式经济性，或坚持更低入场价格。
    notes: 正反论点表把公开证据中已经可见的部分，与仍需管理层披露的部分拆开。若干正向论点今天已经具备战略吸引力，但反向论点本质上仍是估值和披露问题，而不是纯产品反对意见。
