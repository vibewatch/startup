  - id: FR003
    title: 依赖关系图——WorkOS 的关键外部依赖
    type: dag
    layout: wide
    summary: WorkOS 夹在客户应用与外部标准、IdP、云和框架生态栈之间；这些环节没有一个完全受 WorkOS 控制。
    data:
      nodes:
        - id: customer-app
          label: 客户应用
        - id: workos-core
          label: WorkOS 身份验证 / 目录控制平面
        - id: hosted-ui
          label: Hosted UI / 自定义域名 / 通行密钥
        - id: frameworks
          label: 框架生态（Laravel 等）
        - id: scim-saml-oidc
          label: SCIM / SAML / OIDC 标准
        - id: enterprise-idps
          label: 企业 IdP
        - id: hyperscalers
          label: Microsoft / AWS 云
        - id: procurement
          label: 安全审查 / 采购
        - id: competitors
          label: Auth0 / Clerk / Stytch / Hanko
      edges:
        - from: frameworks
          to: workos-core
          label: 集成默认设置
        - from: hosted-ui
          to: workos-core
          label: 终端用户身份验证流程
        - from: scim-saml-oidc
          to: workos-core
          label: 协议依赖
        - from: enterprise-idps
          to: scim-saml-oidc
          label: 真实环境实现
        - from: hyperscalers
          to: competitors
          label: 捆绑替代品
        - from: competitors
          to: customer-app
          label: 替代身份验证栈
        - from: workos-core
          to: customer-app
          label: 预配、身份验证、授权
        - from: procurement
          to: customer-app
          label: 批准或阻止部署
        - from: workos-core
          to: procurement
          label: 需要 Trust Center、DPA、SLA
    claimRefs:
