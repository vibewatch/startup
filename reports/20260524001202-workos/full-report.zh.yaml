          to: customer-app
          label: 令牌、API、组织上下文
        - from: workos-control
          to: webhook-endpoint
          label: 签名事件投递
        - from: webhook-endpoint
          to: customer-app
          label: 状态对账
        - from: onprem-network
          to: workos-control
          label: 出站 HTTPS 流量
        - from: workos-control
          to: onprem-network
          label: 回调、动作、webhook
