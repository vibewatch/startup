  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与买方分层
        blocks:
          - type: paragraph
            body: >-
              WorkOS 所在的身份堆栈拥挤，已经无法映射到一个干净的竞争对手集合。直接战场是 Auth0、Clerk、Stytch、PropelAuth、Frontegg、Descope 等嵌入式 B2B
              认证平台；它们都承诺比从零自建 SAML、SCIM、组织感知权限和管理员流程 更快达到企业就绪。邻近战场是 Permit.io 和 Cerbos
              等授权专家；当买方想要比打包认证堆栈更深的策略控制时，它们可以替代或补充 WorkOS 较新的 RBAC 叙事。替代品战场是买方已经拥有的基础设施，尤其是 AWS 账户里的 Amazon Cognito 和
              Microsoft-oriented enterprises 里的 Microsoft Entra External ID。现状路径仍包括开源或定制自建，Keycloak 和自托管友好的 FusionAuth
              为成本敏感或控制敏感团队提供了可信替代。因此，买方重视一体化企业就绪，胜过最低价格、最深策略模型或套件捆绑时，WorkOS 的胜面最清楚。
