  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 状态
      - 收入 / ARR 锚点
      - 估值 / EV 锚点
      - 隐含倍数
      - 相关性
      - 局限
    rows:
      - - Okta
        - 上市
        - ~$2.92B LTM 收入
        - ~$14.07B EV / ~$16.17B 市值
        - ~4.82x EV/销售额
        - 员工和客户身份领导者；是标准化公开身份倍数最接近的大盘 IAM 基准。
        - 规模成熟且增速更低，使其更像公开倍数底部，而非上限。
      - - CyberArk
        - 上市身份安全高溢价标的
        - ~$1.36B 收入 / ~$1.44B ARR
        - ~$20.63B 市值
        - ~15.2x 市值/收入，~14.3x 市值/ARR
        - 当前最佳身份安全高溢价可比公司；说明强身份紧迫性在 2026 年能拿到什么定价。
        - 产品组合覆盖 PAM 和更广义身份安全；不是直接的开发者基础设施可比对象。
      - - SailPoint
        - 上市身份安全标的
        - ~$1.07B LTM 收入
        - ~$8.59B EV / ~$8.93B 市值
        - ~8.02x EV/sales 倍数
        - 当前公开披露的身份软件公司中，可作中位估值倍数参考。
        - 业务重心在治理和身份安全，区别于 WorkOS 由开发者切入的企业认证定位。
      - - CrowdStrike
        - 上市安全标的估值上限
        - ~$4.81B LTM 收入
        - ~$164.46B EV / ~$168.87B 市值
        - ~34.18x EV/sales 倍数
        - 任务关键型企业软件的安全溢价上限参考。
        - 业务太宽、规模太大，难以作为 WorkOS 直接估值测算可比项。
      - - Auth0 出售给 Okta（2021）
        - 战略并购先例
        - ~$200M 预期收入（2021）
        - ~$6.5B 收购价
        - ~32.5x 远期收入
        - 显示 2021 年高点身份资产稀缺性溢价能打到的水平。
        - 高峰周期交易；不能作为 2026 年稳妥基准。
      - - SailPoint 私有化（2022）
        - 战略 / PE 先例
        - 具备规模的身份安全平台
        - ~$6.9B 全现金价格
        - 已审阅公开来源集中为 n/a
        - 说明即便不走 IPO 市场，规模化身份资产也能撑起数十亿美元级结果。
        - 交易发生在另一套利率和软件估值倍数环境中。
    enumerationScope:
      coverage: partial
      basis: >-
        Public identity and security names plus two historical identity transactions are included because they provide
        the cleanest disclosed valuation anchors available in the reviewed source set; same-stage private identity
