            body: >-
              公开记录指向开发者驱动的切入动作，随后扩展到销售辅助的企业变现。WorkOS 送出有分量的用户管理层，通过 AuthKit 推广打磨过的托管登录表面，并在客户需要
              SSO、SCIM、可审计性和实施支持等企业身份基础设施时变现。公司自己的企业销售文章明确认为，企业要求现在更早出现在购买周期里；Vercel 案例则展示 WorkOS
              如何通过外包非核心企业功能帮助客户拿下高端市场交易。这支持一个可信的 PLG 到企业扩张动作，但没有给出 CAC、payback 或背配额销售指标。


              成本结构同样只能通过代理看到。支持计划、引导式入驻、私有 Slack、员工福利和案例措辞都说明，WorkOS 在软件毛利之外还承载了有分量的人员和服务层。公开员工数代理仍弱：TechCrunch 称 2022
              年员工 40 人，低置信度数据厂商则集中在 2025 年 88-89 名员工。这些代理对估算服务负载和生产率有方向性帮助，但不足以承保销售效率或毛利率扩张。
