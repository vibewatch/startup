  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: WorkOS 把面向客户的认证表面叠在共享身份控制平面、运营事件和企业系统集成之上，同时让客户继续持有应用数据。
    data:
      layers:
        - label: 客户应用表面
          detail: 托管 AuthKit UI、通过 API 接入的客户自有 UI，以及回到 Admin Portal 的链接。应用仍持有自己的产品 DB、资源模型和会话感知业务逻辑。
        - label: 身份控制平面
          detail: User Management/AuthKit、Enterprise SSO、Directory Sync、组织、角色、权限和 FGA 资源建模，都通过一个供应商界面暴露。
        - label: 运营事件层
          detail: Events API、webhooks、Audit Logs 和日志流。该层让客户系统保持同步，但要求消费者具备幂等性并验证签名。
        - label: 开发者接入层
          detail: 官方 SDK 和框架辅助工具覆盖 Node、Next.js/AuthKit、Go、PHP、.NET，另有 Postman 和 API 参考材料。
        - label: 外部企业系统
          detail: 身份提供商、目录提供商、HRIS 来源、SIEM 目的地，以及通过 API、回调和设置链接接入 WorkOS 的客户本地环境。
    claimRefs:
      - CE003
      - CE006
      - CE020
      - CE026
      - CE029
      - CE035
  - id: FE002
    title: 客户工作流和运营流
    type: flow
    layout: wide
    summary: 企业上线通常从 IT 联系人在 Admin Portal 配置 SSO 或 Directory Sync 开始，再流向终端用户认证、成员分配和应用侧状态同步。
    data:
      nodes:
        - id: org-created
          label: 创建组织
          detail: 客户应用或仪表盘在 WorkOS 中创建组织，并保存返回的 org ID。
        - id: portal-link
          label: IT 联系人打开 Admin Portal
          detail: 临时设置链接让 IT 联系人为该组织验证域名，并配置 SSO 或 Directory Sync。
        - id: idp-directory-config
          label: 客户配置 IdP 或目录
          detail: WorkOS 托管按提供商区分的设置文档、连接测试，以及可选的属性或角色映射。
        - id: user-auth
          label: 终端用户认证
          detail: 用户通过 SSO、密码、社交登录或其他 AuthKit 方法登录，并获得带组织上下文的会话。
        - id: membership-roles
          label: 解析成员和角色
          detail: 组织成员关系、角色分配和可选的目录组优先级共同决定访问状态。
        - id: app-sync
          label: 客户应用同步状态
          detail: 应用通过 Events API、webhooks 和自有数据模型持久化或更新用户与审计状态。
      edges:
        - from: org-created
          to: portal-link
          label: 邀请 IT 联系人
        - from: portal-link
          to: idp-directory-config
          label: 配置连接
        - from: idp-directory-config
          to: user-auth
          label: 连接激活
        - from: user-auth
          to: membership-roles
          label: 解析组织 + 认证方式
        - from: membership-roles
          to: app-sync
          label: 持久化用户和访问状态
        - from: idp-directory-config
          to: app-sync
          label: 预配更新
    claimRefs:
      - CE005
      - CE007
      - CE014
      - CE017
      - CE023
      - CE024
  - id: FE003
    title: 关键依赖图
    type: dag
    layout: wide
    summary: WorkOS 依赖外部身份和目录系统、客户自有 webhook 消费者，以及互联网络部署假设；相比 API 表面，这些依赖更能决定实施风险。
    data:
      nodes:
        - id: customer-app
          label: 客户应用
          detail: 持有产品 DB、资源模型、回调端点和业务逻辑。
        - id: workos-control
          label: WorkOS 控制平面
          detail: SSO、Directory Sync、组织、角色映射、Audit Logs 和 FGA API。
        - id: enterprise-idp
          label: 身份提供商
          detail: Okta、Entra ID、Google Workspace 等驱动企业登录的 SAML/OIDC 来源。
        - id: directory-hris
          label: 目录或 HRIS
