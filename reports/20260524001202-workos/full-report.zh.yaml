  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出，以及 WorkOS 为何存在
        blocks:
          - type: paragraph
            body: >-
              WorkOS 应被定义为面向 B2B 软件厂商、开发者优先的企业身份基础设施，而不是整个身份与访问管理市场的替代指标。广义 IAM 分母包括
              用户预配、目录服务、单点登录、高级认证、审计、合规、治理、特权访问、员工身份、CIAM、B2B 身份和非人类身份。WorkOS 只在这一堆栈内部货币化较窄一层：SaaS 公司在客户要求 SAML/OIDC
              SSO、基于 SCIM 的用户预配、审计日志导出、组织级安全政策和越来越细的授权后所需要的企业功能。因此，最贴近的买方问题是「让我的产品企业就绪」，而不是「替换我公司的整套身份套件」。


              该边界解释了纳入项和排除项。纳入支出应覆盖企业 SSO 连接、目录同步和生命周期自动化、审计与日志流基础设施、客户管理员入驻工作流，以及多租户协作和 AI 智能体所需的授权逻辑。排除支出应包括仅面向消费者的
              CIAM、内部 IT 采购的员工侧身份套件，以及不能解决 SaaS 产品身份工作流的无关网络安全类别。主要现状替代不是某一个具名竞争对手，而是混杂组合：自研 SAML 和 SCIM
              实现、大型套件不透明的企业层级定价、手工用户预配，以及产品团队临时满足企业安全审查导致交易周期拖延。WorkOS 存在，是因为符合标准的身份功能正变成入场券，但每个 SaaS
              产品内部自建和维护这些功能仍然昂贵且分心。
