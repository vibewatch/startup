  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与定价可见度
        blocks:
          - type: paragraph
            body: >-
              WorkOS 货币化的是混合基础设施模型，而不是单一 SaaS 席位价格。公开表面从最多 1 million 用户的免费用户管理开始；客户需要
              SSO、SCIM、可审计性和相关控制时，再叠加付费企业身份基础设施。官方定价和对比页面把关键商业单位讲得异常清楚：用户管理按 MAUs 扩展，Enterprise SSO 和 Directory Sync
              按连接计费；WorkOS 将连接 定义为与一个企业客户的一段关系。这在财务上很重要，因为企业收入更贴近已货币化客户账户数量，而不是下游终端用户总数。


              定价表面不止身份连接。WorkOS 还列出日志流、事件留存、验证或滥用检查容量等可货币化附加项；支持计划则打包高级入驻、Slack 支持和 SLA 支撑的响应承诺。这对变现宽度是正面信号，因为 WorkOS
              有不止一种方式扩张单账户收入。缺点同样重要：公开标价不等于实际成交价。官方材料没有披露平均合同价值、有效折扣或按 SKU 的挂载率，因此公开定价可见度高于公开收入可见度。
