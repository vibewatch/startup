      - number: '8.4'
        title: 未解决的披露缺口与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              最强的反向逻辑不是产品风险，而是披露风险。本章审阅的公开来源显示，WorkOS 有强客户标杆，也踩中了有吸引力的产品市场时点；但它没有给出投资者用来测试 $2 billion 投后估值是否公平的底层数字。没有公开
              ARR 桥、没有披露 NRR 或 GRR、没有准确客户数或集中度瀑布图、没有员工数或烧钱速度披露，也没有公开股权结构表或清算优先权视图。2026 年，这些缺口比 2021
              年更重要，因为软件倍数现在奖励增长和耐久性的组合，而不是只奖励叙事。

              正确尽调路径因此很窄，也很实用。在承销乐观甚至基准情景前，投资者应要求当前 ARR 和增长桥、队列留存数据、毛利率披露、准确大客户暴露，以及 Series C 后优先股堆叠。公司还应说明 AI
              智能体身份产品已经开始变现，还是仍只是叠加在核心企业认证业务上的路线图溢价。没有这些披露，最可防守的姿态是把 WorkOS
              放在高优先级观察名单上，而不是强行给出明确买入结论。退出逻辑也类似：如果后续披露验证了溢价经济性，公司可以复合进当前轮次；如果没有，价格给 2026 年软件倍数压缩留下的空间太小。
