        title: 融资历史、估值推进与公开规模代理
        blocks:
          - type: paragraph
            body: >-
              公开融资年表有大致轮廓，尽管更细的股权结构表细节缺失。WorkOS 自己的 Series A 文章称，公司此前已由 Lachy Groom 领投融得 $15M，累计融资 $19M。2022 Series B
              公告和 TechCrunch 均佐证 Greenoaks 领投的 $80M 轮次；TechCrunch 称当时总融资已达约 $100M。2026 Series C 公告随后增加一轮 $100M，Fenwick
              佐证 Meritech 和 Sapphire 为领投方。合在一起，已披露轮次金额意味着累计融资至少约 $199M。


              规模披露也随时间改善，但仍只通过代理呈现。官方材料称 Series A 阶段已有超过 100 个企业就绪应用，Series B 时有超过 200 个付费客户，Series C 时有数千客户以及每月数十亿次 API
              请求。估值故事更不完整。WorkOS 披露 Series C 估值为 $2B，但更早的官方轮次文章没有公布中间估值标记。因此，投资人能看到当前估值跃升，却看不到早期和后期私有轮之间的干净路径。
