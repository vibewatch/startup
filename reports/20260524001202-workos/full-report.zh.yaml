      - number: '2.3'
        title: 买方、付款方与自建 vs 购买采用路径
        blocks:
          - type: paragraph
            body: >-
              购买动作异常跨职能，因为 WorkOS 卖的是嵌入产品内部、但由企业安全和合规要求证明价值的基础设施。大客户签约前要求 SSO、SCIM 或审计导出时，产品和平台工程团队通常最先感到痛点。安全、IT
              或合规利益相关方随后变成间接买方，因为他们关心生命周期控制、最小权限、日志记录和标准合规。WorkOS 的终端使用者通常是集成 API 的开发者或产品团队；下游使用者则是通过自助管理员门户配置的客户 IT
              管理员。因此，付款方早期可能在产品基础设施预算里，随着高端市场收入变得重要，再迁移到共享工程、安全或企业就绪预算。


              公开客户证明把自建还是购买的触发点说得很明白。WorkOS 强调：相比自建，交付 SSO 和 SCIM 可快超过九个月；客户在不到一周内上线 SSO；团队每个连接可避免 2–4 小时的手工用户预配工作。它的
              SCIM 指南认为，内部用户预配项目会撞上 IdP 特定差异、事件顺序和扩展问题、入驻摩擦，以及持续维护。该证据贴合更广的市场结构：大型企业主导 CIAM 支出，云是默认部署模式，无密码登录和 passkey
              采用仍在快速增长。含义是，SaaS 公司需要快速拿到企业级身份功能、已有某种认证堆栈、且不想只为再关一个企业单而迁入全套件平台时，WorkOS 最容易赢。
