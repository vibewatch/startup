        - 用内部真实数据提供每名 FTE 的 ARR，并按职能组拆分，而不是使用数据库估计。
      - - 毛利率
        - 'Null'
        - 低
        - 毛利率是判断 WorkOS 更像软件基础设施，还是支持负担较重的混合体的关键测试。
