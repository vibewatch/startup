      - number: '2.5'
        title: 约束、在位者定价结构与未解尽调缺口
        blocks:
          - type: paragraph
            body: >-
              乐观情景成立，但摩擦并不轻。分析师仍把预算约束、隐私担忧、统一身份标准缺失和熟练网络安全从业者短缺列为 IAM 推进卡住或缩窄范围的原因。市场重叠也带来估值风险：广义
              IAM、CIAM、访问管理、合规工具和非人类身份 都引用相近支出池，草率相加会重复计算同一预算。因此，即便市场不错，如果 SaaS 厂商不确定是外挂一个功能、迁移到更大套件，还是彻底推迟企业就绪，采用也可能滞后。


              反向证据也支持 WorkOS 的定位。公开「SSO tax」和「SCIM tax」追踪器认为，许多 SaaS 厂商仍把 SAML 和生命周期自动化锁在 企业层级或不透明报价后面；SCIM tax
              数据集记录了大量已安装应用仍对自动用户预配加收费用。Stitchflow 更激进的批评称，721 个受访 SaaS apps 中 42% 把 SCIM 锁在企业定价后，57% 任何价位都不提供 SCIM，只有
              1.2% 把它纳入 base tier。Auth0 自己的定价页也强化了更广泛模式：企业连接、自助 SSO 和 SCIM 绑定到 B2B 或企业包装，同时在更高堆栈宣传 AI 智能体与 FGA 功能。对
              WorkOS 而言，这既是机会，也是剩余尽调缺口：痛点显而易见，但公开证据仍无法拆出多少痛点会转化为持久的独立基础设施收入，而不是最终被更大身份套件吸收。
            claimRefs:
