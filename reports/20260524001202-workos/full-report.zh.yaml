  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 重要性
      - 行动含义
    rows:
      - - 建议
        - 跟踪 / 继续研究
        - WorkOS 拿到的 AI 客户证明异常强，产品紧迫感也高；但公开记录仍缺 ARR、NRR、利润率和股权结构表披露，无法支撑 March 2026 $2B 锚点的投资论证。
        - 密切跟踪并争取尽调权；不要只凭公开证据就假设当前轮次可投。
      - - 信心
        - 中
        - 战略质量看得见，估值支撑看不见。主要不确定性不在品类吸引力，而在被隐藏的经营规模。
        - 只有披露 ARR、留存和毛利率数据后，信心才可能上调。
      - - 风险评级
        - 高
        - 核心风险是在指标不透明下为估值付太多钱；2026 年软件倍数环境弱于 2021 年身份赛道高点，进一步放大风险。
        - 如果披露仍薄，要求下行保护，否则放弃。
      - - 估值立场
        - 待指标验证，合理至偏贵
        - 只有 WorkOS 已大致达到 mid-$100M ARR 区间，并保持高质量增长，这个价格才说得通。
        - 只有通过指标阈值测试后，本轮才有辩护空间。
      - - 下一步
        - 指标设门槛的尽调
        - 最高价值问题是经营指标和优先权条款，不是产品演示或品类材料。
        - 推进前索取 ARR、NRR、毛利率、客户集中度和清算优先权细节。
    notes: 本表刻意对价格敏感，而不是对公司质量敏感。它只用公开证据总结当前 $2B 轮次隐含的投资姿态；WorkOS 一披露经营指标或融资条款，就应更新。
