  - id: FM003
    title: 买方 / 细分市场图
    type: matrix
    layout: wide
    summary: 同一个账户里，直接任务是 SSO、SCIM、可审计性还是细粒度授权，会决定发起买方、运营用户、付款方和证明负担各不相同。
    data:
      columns:
        - 主要买方
        - 主要用户
        - 典型付款方
        - 采用触发点
        - 所需证据
      rows:
        - label: 企业 SSO
          values:
            - 产品 / 平台负责人
            - 应用工程师 + 租户 IT 管理员
            - 工程或企业就绪预算
            - 潜在客户签约前要求 SAML 或 OIDC
            - 快速集成和自助式管理员设置
        - label: 目录同步 / SCIM
          values:
            - 平台工程 + 安全发起人
            - IAM 管理员 + 后端工程师
            - 工程 / 安全共担预算
            - 手工开通和离职下线痛点
            - 有序、可靠的生命周期事件，且设置摩擦低
        - label: 审计日志
          values:
            - 安全 / 合规负责人
            - 安全运营 + 审计员
            - 安全或合规预算
            - 客户要求导出证据和日志流
            - 不可篡改、可搜索记录和 SIEM 兼容性
        - label: 细粒度授权
          values:
            - 产品架构师 / 平台安全负责人
            - 后端 / API 工程师
            - 平台 + 安全架构预算
            - 需要资源级角色、委托或 AI 智能体约束
            - 无需让自定义权限逻辑蔓延，就能落地最小权限
        - label: 全套迁移替代方案
          values:
            - 中央 IAM 负责人
            - 身份团队
            - 身份平台预算
            - 团队愿意替换更广的认证栈
            - 更广的平台覆盖足以抵消迁移成本
