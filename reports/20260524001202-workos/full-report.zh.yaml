  - id: TR005
    title: 缓释与叫停标准表
    layout: wide
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 认证层回归风险
        - 公开事件、安全公告、GitHub 问题波动
        - 宣称完成修复周期后，再次出现客户可见的认证或 webhook 完整性事件
        - 暂停投资确信，直到 WorkOS 提供根因、影响范围和回归防护证据
      - - 合同 / 合规错配
        - 客户文件 vs 公开条款
        - MSA、DPA 或 Trust Center 材料明显窄于企业销售主张
        - 下调企业胜率和利润率假设
      - - 价格压缩
        - 竞争对手定价和现有巨头捆绑采用
        - 输单给捆绑 Entra/Cognito，或相对 Auth0/Clerk/Stytch 持续打折
        - 下调长期毛利率和 CAC 回收假设
      - - 单一栈集中
        - 产品线 ARR 和使用结构
        - 即便公司宣称扩张，AuthKit/SSO/Directory Sync 仍占毛利绝大多数
        - 把新产品视为执行负担，而不是多元化加分
      - - 流动性可见性缺口
        - 董事会报告和后续融资
        - Series C 尽调请求后，仍没有清晰披露 ARR、烧钱率、现金跑道和优先权结构
        - 转入观察名单，或在承销前要求更强下行保护
    notes: 叫停标准采用可衡量的尽调阈值，因此即使公开证据仍不完整，本章也可执行。
