      - CR016
      - CR017
      - CR035
      - CR036
      - CR037
      - CR041
      - CR043
      - CR044
      - CR045
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 决策链从 WorkOS 可见的产品与客户证据，走到缺失指标这道门槛；门槛让本章停在观察 / 继续研究，而不是买入。图中强调，瓶颈是估值验证，不是赛道相关性。
    data:
      nodes:
        - id: funding-anchor
          label: March 2026 锚点
          detail: $100M Series C 轮融资、$2B 估值，成为当前投资测算的参考点。
          type: process
        - id: customer-proof
          label: 客户证据
          detail: OpenAI、Anthropic、xAI、Cursor、Perplexity 等 AI 头部公司出现在 WorkOS 公开客户名单中。
          type: process
        - id: product-breadth
          label: 企业身份范围
          detail: WorkOS 对外销售身份验证、权限、集成、加密、滥用检测、功能开关和 MCP，并承诺五个 9 可用性。
          type: process
        - id: comp-test
          label: 可比测试
          detail: 2026 身份赛道倍数大约从 5x 到十几倍中段；CrowdStrike 给出更高的安全赛道天花板，2021 Auth0 则是上个高峰周期的离群点。
          type: process
        - id: missing-metrics
          label: 缺失指标
          detail: 审阅过的来源里没有公开披露 ARR、NRR、毛利率、员工数、客户集中度或优先股堆叠。
          type: process
        - id: decision
          label: 投资建议
          detail: 在 WorkOS 证明足以支撑溢价的规模经济，或给出保护下行的条款结构之前，建议保持观察 / 继续研究。
          type: outcome
    approximationNotes: 这张图是分析综合产物，不是 WorkOS 披露的流程。每个节点都有本章明确论断支撑，用来显示公开证据链目前断在哪里。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV037
      - CV044
      - CV046
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 不同收入或 ARR 倍数假设下，支撑 $2B 估值所需的 ARR。图中显示，假设倍数一旦压向当前公开身份赛道区间，所需经营规模会很快抬升。
    data:
      items:
        - label: 5x 倍数
          value: 400
        - label: 8x 倍数
          value: 250
        - label: 10x 倍数
          value: 200
        - label: 12x 倍数
          value: 167
        - label: 15x 倍数
          value: 133
        - label: 20x 倍数
          value: 100
    approximationNotes: 数值为隐含 ARR 门槛，单位为 USD millions，由披露的 $2B 轮次估值除以各个选定倍数得出。倍数组合参考了本章公开市场和私募市场的身份与 SaaS 可比样本。
    claimRefs:
      - CV041
      - CV042
      - CV043
      - CV052
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 在当前收入未披露的情况下，用假设 ARR 区间和倍数区间给 WorkOS 做情景估值。当前 $2B 轮次锚点落在乐观区间内、接近基准区间上沿，因此披露质量决定建议。
    data:
      items:
        - label: 悲观情景区间
          low: 420
          high: 1000
        - label: 基准情景区间
          low: 1200
          high: 2240
        - label: 乐观情景区间
          low: 2040
          high: 3520
        - label: 当前轮次锚点
          low: 2000
          high: 2000
    approximationNotes: 所有数值单位均为 USD millions，来自 TV003 的情景假设。当前轮次锚点是披露的 March 2026 估值。情景区间不是公司预测；它们是门槛测试，用来判断业务需要长成什么样，这一轮才算便宜、合理或昂贵。
    claimRefs:
      - CV001
      - CV049
      - CV050
      - CV051
      - CV052
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 这是一张 IC 风格评分卡，覆盖决定 $2B 轮次是否可投的六个变量。最强信号是客户证据和产品紧迫性；最弱的是指标披露和价格验证。
    data:
      nodes:
        - id: kpi-customer-proof
          label: 客户证据
          detail: 强：公开客户名单包含多家前沿 AI 公司和企业参考客户。
          type: strength
        - id: kpi-product-urgency
          label: 产品紧迫性
          detail: 强：快速扩张的软件供应商离不开企业 SSO、权限、可审计性和智能体身份这些关键任务能力。
          type: strength
        - id: kpi-build-vs-buy
          label: 自建 / 采购杠杆
          detail: 正向：WorkOS 对外主打可节省 >9 个月构建时间，并提供 50+ 集成。
          type: strength
        - id: kpi-multiple-context
          label: 倍数背景
          detail: 混合：AI 原生资产能拿到溢价，但 2026 公开身份赛道倍数仍远低于 2021 峰值。
          type: neutral
        - id: kpi-metric-opacity
          label: 指标不透明
          detail: 弱：审阅过的来源里没有公开披露 ARR、NRR、毛利率、员工数或股权结构披露。
          type: risk
        - id: kpi-price-sensitivity
          label: 价格敏感性
          detail: 弱至混合：只有 WorkOS 已经处在 mid-$100M ARR 区间且留存有溢价，$2B 才算合理。
          type: risk
    approximationNotes: KPI 标签是分析师的定性判断，来自本章论断集；用于决策框架，不用于机械打分。
    claimRefs:
      - CV004
      - CV006
      - CV037
      - CV039
      - CV044
      - CV045
