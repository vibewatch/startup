  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、合同与合规风险
        blocks:
          - type: paragraph
            body: >-
              WorkOS 是处理方，也是身份中间件厂商，下行风险不是由某个单一行业监管方决定，而是由隐私法、采购控制和客户合同预期叠加而成。公开 DPA 相对成熟：它承认子处理方、跨境传输、安全事件通知、DPIA
              支持，以及数据保护法要求时客户提出异议的权利。这个基线是加分项，但也说明公司正落在 GDPR Article 28 式处理方义务内；每一次企业部署，都要正确管理子处理方变更、传输机制和控制方指令。


              公开风险在于，WorkOS 只展示了部分合同栈，真正的客户文件仍在门后。网站条款依据 California 法律排除不中断可用性的承诺，并把网站使用责任上限压到 $100；生产 SLA
              则放在另一份仅面向企业客户的文件里。SLA 范围很窄：只覆盖企业层级生产环境服务，排除 staging、alpha、beta、preview 及其他非 GA
              使用。对基础设施厂商来说，这在商业上合理，但也意味着，投资者仍需看到实际 MSA、DPA 附件、审计权语言和赔偿条款，才能假设下行已经封顶。如果企业客户要求超出公开文件的数据驻留或审计权，WorkOS
              可能需要给出定制让步，进而挤压利润率或拖慢销售周期。


              合规姿态方向上较强。WorkOS 公开营销 SOC 2 Type 2、GDPR 和 CCPA 合规、年度第三方渗透测试、外部代码审计，以及企业计划的 HIPAA BAA；其 Trust Center 称 SOC
              报告、渗透测试材料和子处理方都集中在那里。剩余暴露不是缺少徽章，而是新鲜度和范围问题：WorkOS 从 SSO 和 SCIM 扩到 passkeys、权限、功能开关、滥用检测以及 MCP
              相关暴露面后，企业采购团队会关心这些材料是否保持最新。合规漂移，或 Trust Center 细节继续设门槛、信息不完整，都会直接伤到受监管客户的赢单率。
