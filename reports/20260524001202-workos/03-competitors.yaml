  evidenceGaps:
  - type: missing-source
    severity: material
    topic: authorization-attach-rate
    missingEvidence: Independent customer or partner evidence showing whether WorkOS RBAC replaces separate Permit.io or Cerbos deployments in production.
    whyItMatters: Public product pages show that WorkOS has authorization, but not whether customers actually consolidate on it or still buy a dedicated policy layer.
    diligencePath: Request customer architecture references or win-loss notes from WorkOS showing when RBAC displaced a standalone authorization vendor.
    relatedQuestionRefs:
    - QP022
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: private-competitor-scale-disclosure
    missingEvidence: Current 2026 customer-count, headcount, or ARR disclosures for private competitors such as Clerk, Stytch, Descope, PropelAuth, Frontegg, Permit.io, and Cerbos.
    whyItMatters: Competitive depth depends not just on feature parity but on how much GTM scale and implementation capacity those rivals now have, and most of that is not on current public surfaces.
    diligencePath: Collect investor decks, updated funding memos, or management interviews that disclose current 2026 operating scale for private peers.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP001
  - type: missing-source
    severity: material
    topic: workos-win-loss-data
    missingEvidence: Independent 2026 win-loss evidence showing whether WorkOS reliably beats Auth0, Clerk, or Stytch in mid-market and enterprise B2B identity evaluations.
    whyItMatters: The current chapter can describe public positioning, but it cannot prove whether that positioning translates into durable commercial advantage in active deals.
    diligencePath: Look for procurement notes, customer migration case studies, or analyst surveys that compare current shortlists and decision outcomes across the major vendors.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP004
