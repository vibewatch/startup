chapter:
  number: 3
  title: Competitors
  summary: WorkOS still has a differentiated integrated story for embedded enterprise identity, but the direct field is broader and cheaper than when the category first formed. The hardest pressure now comes from bundled hyperscaler defaults, self-host and open-source substitutes, and adjacent vendors extending into authorization or agentic identity.
sections:
- id: landscape-overview
  title: Landscape and buyer segmentation
  body: WorkOS sits in a crowded identity stack that no longer maps to one clean competitor set. The direct battle is against embedded B2B auth platforms such as Auth0, Clerk, Stytch, PropelAuth, Frontegg, and Descope, all of which promise faster enterprise readiness than building SAML, SCIM, org-aware permissions, and admin flows from scratch. The adjacent battle is against authorization specialists such as Permit.io and Cerbos, which can replace or complement WorkOS's newer RBAC story when a buyer wants deeper policy control than a bundled auth stack can offer. The substitute battle is against infrastructure that buyers already own, especially Amazon Cognito inside AWS accounts and Microsoft Entra External ID inside Microsoft-oriented enterprises. The status-quo path remains open source or custom build, with Keycloak and self-host friendly FusionAuth giving cost-sensitive or control-sensitive teams credible alternatives. WorkOS therefore wins most clearly when a buyer values integrated
    enterprise readiness more than lowest price, deepest policy model, or suite bundling.
  claimRefs:
  - CP004
  - CP024
  - CP026
  - CP028
  - CP029
  - CP031
  - CP032
  tableRefs:
  - TP001
  figureRefs:
