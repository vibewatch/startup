    "number": 5,
    "title": "Product & Technology",
    "summary": "WorkOS packages enterprise identity primitives—SSO/SAML, SCIM-based directory sync, user management/AuthKit, admin onboarding, audit logs, and newer fine-grained authorization—behind one control plane while still expecting customers to own their app database and resource model. The strongest technical advantages are breadth of enterprise-readiness coverage and self-serve IT onboarding; the main diligence gaps are limited public trust-architecture detail, still-maturing FGA roadmap items, and extra integration work for on-prem or framework-edge cases."
  },
  "sections": [
    {
      "id": "enterprise-identity-surface",
      "title": "Enterprise identity surface",
      "body": "WorkOS is best understood as an enterprise-readiness bundle rather than a single login widget. The current public surface spans Enterprise SSO, Directory Sync, User Management, AuthKit, MFA, Audit Logs, Admin Portal, and newer fine-grained authorization. The important architectural choice is that WorkOS does not try to become the customer's full application data layer: the SSO docs frame the product as authentication middleware, the user management pages repeatedly tell teams to keep their own user table current through the Events API, and AuthKit can be consumed either as hosted UI or as headless APIs. That gives startups a faster route to enterprise login and provisioning without fully outsourcing their core product model. The suite is also explicitly organization-aware: users can belong to organizations through memberships, JIT provisioning can attach people to orgs based on verified domains, and Admin Portal flows give IT teams a customer-facing setup path instead of engineering-led onboarding.",
