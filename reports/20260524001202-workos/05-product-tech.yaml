    {
      "id": "developer-experience-and-roadmap",
      "title": "Developer experience, ecosystem, and roadmap",
      "body": "Developer experience is one of WorkOS's clearest strengths, but it is not zero-friction. The docs and repositories show a broad SDK footprint across Node, Next.js/AuthKit, Go, PHP, .NET, and official Postman assets, and the Node README now exposes public-client PKCE flows for mobile and CLI use cases. The Next.js helper goes beyond a thin SDK wrapper and bakes in session middleware or proxy behavior, encrypted cookies, and callback helpers, which should accelerate greenfield App Router apps. The trade-off is that teams still inherit framework-specific caveats, such as cookie configuration, callback routing, and middleware matcher edge cases. Public package surfaces also show active maintenance: Packagist reports millions of installs for the PHP SDK, while NuGet shows 2026 update cadence for WorkOS.net. External community evidence is thinner and more mixed: a founder-led Show HN launch indicates some organic attention, but the public Stack Overflow footprint is small and highlights the kind of edge-case debugging—redirect semantics and invalid role slugs—that still falls on implementers. FGA's own docs also leave several important capabilities in a coming-soon state.",
