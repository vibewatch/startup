      "id": "control-plane-and-authorization",
      "title": "Control plane and authorization model",
      "body": "Under the hood, WorkOS is not just protocol abstraction; it is a shared control plane that normalizes inputs from IdPs, directories, and app-auth events. SSO accepts SAML or OIDC but exposes an OAuth-like initiation and callback flow with organization-aware redirect handling. Directory Sync sits alongside that path, ingesting directory and HRIS changes, normalizing users and groups, and delivering them back through webhooks or the Events API. Organization memberships then become the bridge from identity to authorization. Basic RBAC is environment- and membership-centric, with default roles, optional multiple-role mode, and group-to-role mapping from SSO or SCIM sources. FGA extends that model from org-wide permissions to resource trees such as workspaces, projects, and apps. The public docs position this as incremental adoption rather than a full rewrite: org-wide roles can stay in tokens for fast checks while resource-scoped decisions move to the Authorization API.",
