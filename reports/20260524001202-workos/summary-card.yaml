  topStrengths:
    - >-
      Developer-first product design solves a real enterprise adoption bottleneck for fast-growing software companies,
      with broad coverage across SSO, SCIM, user management, MFA, audit logs, and authorization.
    - >-
      Customer quality is unusually strong for a private infrastructure vendor, with public proof across OpenAI,
      Anthropic, Vercel, Webflow, Indeed, Warp, Hopin, and other software companies.
    - >-
      The March 2026 Series C brought credible growth capital and investor sponsorship from Meritech and Sapphire while
      reinforcing WorkOS's relevance to AI-native application builders.
  topRisks:
    - >-
      The $2B valuation is difficult to underwrite without public ARR, retention, gross margin, concentration, or
      cap-table disclosure, making the round price-sensitive and potentially stretched.
    - >-
      Auth-layer security, SDK regressions, and status-page incidents create outsized downside because WorkOS sits
      directly in customer login, provisioning, and authorization paths.
    - >-
      Bundled or cheaper alternatives from Okta/Auth0, Clerk, Stytch, Microsoft, AWS, and open-source tools can pressure
      pricing, margins, and sales efficiency if WorkOS's platform breadth does not translate into durable monetization.
  unresolvedGaps:
    - Current ARR, revenue growth, NRR/GRR, gross margin, and burn remain undisclosed.
    - Exact current paying-customer count, revenue concentration, and contract-size distribution are not public.
    - >-
      Board composition, ownership concentration, and liquidation-preference terms after the Series C are not publicly
      available.
    - >-
      Public evidence does not show whether newer products like Radar, feature flags, and MCP materially contribute
      revenue or mainly expand surface area.
    - >-
      Private diligence should verify subprocessor footprint, data-residency commitments, SLA-credit history, and
      incident toil beyond the public trust and status surfaces.
