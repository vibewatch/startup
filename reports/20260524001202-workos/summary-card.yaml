summary:
  headline: >-
    WorkOS is a high-quality developer-first enterprise identity platform with unusually strong AI-customer proof, but
    the $2B March 2026 round still outpaces the public operating disclosure needed for a conviction buy call.
  overallScore: 6.4
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
