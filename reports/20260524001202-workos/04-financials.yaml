- id: SI003
  title: GTM motion, sales-efficiency proxies, and cost-structure signals
  body: |-
    The public record points to a developer-led entry motion that expands into sales-assisted enterprise monetization. WorkOS gives away a meaningful user-management layer, markets a polished hosted login surface through AuthKit, and then monetizes when customers need enterprise identity infrastructure like SSO, SCIM, auditability, and implementation support. The company’s own enterprise-sales writing explicitly argues that enterprise requirements now appear earlier in the buying cycle, while the Vercel case study shows how WorkOS helps customers close upmarket deals by outsourcing non-core enterprise features. That supports a plausible PLG-to-enterprise-expansion motion, but it does not provide CAC, payback, or quota-carrying-sales metrics.

    Cost structure is similarly visible only through proxies. Support plans, guided onboarding, private Slack, employee benefits, and case-study language all suggest that WorkOS carries a meaningful people and service layer alongside software gross profit. Public headcount proxies are still weak: TechCrunch put the workforce at 40 in 2022, while lower-confidence data vendors cluster around 88-89 employees in 2025. Those proxies are directionally useful for sizing service load and productivity, but not good enough to underwrite sales efficiency or margin expansion.
