- id: TI004
  title: Capital adequacy table
  columns:
  - metric
  - public value/status
  - confidence
  - why it matters
  - diligence ask
  rows:
  - - Disclosed cumulative equity financing
    - About $199M implied from $19M total by Series A post, plus $80M Series B and $100M Series C
    - Medium
    - This is the clearest public capital buffer visible today.
    - Confirm full round chronology, issuer entities, and whether any interim financing instruments sit outside the public story.
  - - Cash on hand
    - 'Null'
    - Low
    - Headline fundraising is not the same as current liquidity.
    - Provide current cash, restricted cash, and minimum operating cash thresholds.
  - - Monthly burn and burn multiple
    - 'Null'
    - Low
    - Runway cannot be underwritten without actual burn.
    - Provide 12-month monthly burn, net new ARR, and burn-multiple history.
  - - Runway months
    - Series B said “many years of runway”; current runway undisclosed
    - Low
    - Capital adequacy depends on remaining runway, not historical fundraising alone.
    - Provide current runway model under base, downside, and hiring-expansion scenarios.
  - - Use of funds / next-round trigger
    - Series C directed toward secure and reliable agentic software; next-round trigger not disclosed
    - Medium
    - Use of funds indicates growth priorities, while next-round trigger reveals financing dependency.
    - Provide board materials covering planned cash deployment, breakeven horizon, and expected next financing milestone.
  - - Debt or public filing footprint
    - No debt facility found in reviewed sources; EDGAR search for “WorkOS, Inc.” returned zero hits
    - Medium
    - This suggests a primarily equity-backed public narrative but leaves private credit unanswered.
    - Provide debt schedule, SAFE / note summary, and any Form D or counsel memo covering historical rounds.
  notes: The table separates what the public record positively shows from what it does not. Nulls here are real diligence blockers rather than formatting gaps.
