company:
  name: WorkOS
chapter:
  number: 4
  title: Financials
  summary: 'WorkOS shows an unusually visible list-pricing surface for a late-stage private infrastructure company and a clearly disclosed funding step-up through its 2026 Series C, but public underwriting still stops far short of institutional diligence quality. The company has disclosed at least about $199M of cumulative fundraising, $125-per-connection enterprise pricing, and customer-scale proxies ranging from 200+ paying customers in 2022 to thousands of customers and billions of monthly API requests by Series C. The missing pieces remain decisive: no audited revenue, ARR, gross margin, cash, burn, runway, NRR, or realized discount data are public, and third-party revenue estimates conflict sharply.'
sections:
- id: SI001
  title: Revenue model and pricing visibility
  body: |-
    WorkOS monetizes a hybrid infrastructure model rather than a single SaaS seat price. The public surface starts with free user management for up to 1 million users, then adds paid enterprise identity infrastructure when customers need SSO, SCIM, auditability, and related controls. Official pricing and comparison pages make the key commercial units unusually legible: user management scales by MAUs, while enterprise SSO and Directory Sync bill by connection, which WorkOS defines as one relationship with one enterprise customer. That matters financially because it ties enterprise revenue more closely to the count of monetized customer accounts than to total downstream end users.

    The pricing surface does not stop at identity connections. WorkOS also lists monetizable add-ons such as log streaming, event retention, and verification or abuse-check capacity, while support plans package premium onboarding, Slack support, and SLA-backed response commitments. This is a positive sign for monetization breadth because it gives WorkOS more than one way to expand revenue per account. The drawback is equally important: public list pricing is not realized pricing. Official materials do not disclose average contract values, effective discounts, or attach rates by SKU, so public pricing visibility is better than public revenue visibility.
