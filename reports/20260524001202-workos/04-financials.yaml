- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - impact on underwriting
  - exact diligence path
  rows:
  - - Audited revenue / ARR
    - Public databases conflict, so valuation, growth, and productivity cannot be anchored externally.
    - Request audited annual revenue, current ARR, and quarterly bridge from booked to recognized revenue.
  - - Gross margin and cost-to-serve
    - Without hosting, support, and compliance-cost detail, the margin path is unknowable.
    - Request gross-margin bridge by product line and by customer-support tier.
  - - Cash, burn, and runway
    - Capital adequacy cannot be judged from fundraising headlines alone.
    - Request 12-month monthly cash-flow statement, current balance sheet, and board runway model.
  - - NRR, churn, and connection cohort data
    - Revenue quality depends on whether enterprise accounts renew and expand after initial SSO / SCIM adoption.
    - Request cohort retention by connection, GRR / NRR by segment, and logo churn history.
  - - Realized discount schedule and contract values
    - List prices are visible, but enterprise yield is not.
    - Request representative MSAs / order forms and the effective-net-price distribution by connection tier.
  - - Customer concentration and support burden
    - Named logos do not reveal revenue concentration or whether support-heavy accounts dilute margins.
    - Request top-20 account concentration, support-ticket load, and hours spent per premium-support customer.
  notes: These are the highest-value missing metrics for a real investment underwriting process. They are missing from the reviewed public record, not merely hard to find.
  enumerationScope:
    coverage: partial
    basis: Rows prioritize the public gaps that most directly change revenue quality, margin path, and capital-adequacy judgments.
