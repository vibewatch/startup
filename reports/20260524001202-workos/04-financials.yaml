  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount-gap
    missingEvidence: An official current employee count plus functional split across engineering, sales, support, and G&A.
    whyItMatters: Without an official headcount and org mix, revenue per employee, support load, and sales-capacity modeling remain proxy-driven.
    diligencePath: Request the latest org chart, current headcount by function, and the 12-month hiring plan from management.
    relatedQuestionRefs:
    - QI015
    - QI016
    relatedTableRefs:
    - TI003
  - type: conflicting-data
    severity: blocking
    topic: revenue-conflict
    missingEvidence: Management-confirmed ARR or GAAP revenue for 2024-2026 plus a reconciliation to any public database entries.
    whyItMatters: Growjo and GetLatka give materially different top-line numbers, so public estimates cannot anchor underwriting.
    diligencePath: Request monthly recurring revenue history, audited revenue by year, and a commentary memo explaining any third-party database inaccuracies.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Cash balance, burn rate, burn multiple, runway months, and any board-approved financing plan.
    whyItMatters: Public fundraising headlines do not reveal whether the current capital base comfortably funds the product roadmap and support expansion.
    diligencePath: Request the last 12 months of monthly P&L and cash flow, current balance sheet, and internal runway model.
    relatedQuestionRefs:
    - QI021
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: margin-and-sales-efficiency
    missingEvidence: Gross margin, hosting cost, support cost, CAC, payback, NRR, and cohort retention by customer segment.
    whyItMatters: These metrics determine whether WorkOS is a clean infrastructure subscription business or a support-heavy hybrid with slower margin expansion.
    diligencePath: Request cohort tables, gross-margin bridge, sales-efficiency dashboard, and support staffing metrics by product line.
    relatedQuestionRefs:
    - QI020
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: filing-and-cap-table
    missingEvidence: Form D, cap-table summary, or another primary financing record tying legal entities to each round and to any venture debt or SAFEs.
    whyItMatters: The public EDGAR search gap prevents outside verification of exact issuers, security types, and any non-equity financing instruments.
    diligencePath: Request a cap-table export, executed financing docs, and any Form D or counsel memo covering historical issuances.
    relatedQuestionRefs:
    - QI012
    - QI021
    relatedTableRefs:
    - TI004
    - TI005
