    - Provide audited revenue / ARR by quarter and explain discrepancies with public databases.
  - - Public headcount proxy
    - 40 employees in 2022; 88-89 employee estimates in 2025
    - Low
    - Headcount frames service load and productivity but current official count is absent.
    - Provide current headcount by function and monthly historical growth since Series B.
  - - Revenue per employee proxy
    - About $145k revenue per employee (Growjo estimate)
    - Low
    - If true, it suggests lower productivity than mature infrastructure peers; if false, the public record is misleading.
    - Provide ARR per FTE, by functional group, using internal actuals rather than database estimates.
  - - Gross margin
    - 'Null'
    - Low
    - Margin is the key test of whether WorkOS behaves like software infrastructure or a support-heavy hybrid.
    - Provide gross-margin bridge including hosting, support, and any partner / compliance cost allocations.
  - - CAC / payback
    - 'Null'
    - Low
    - Without sales-efficiency metrics, public customer and pricing proxies cannot convert into a growth-quality view.
    - Provide CAC, CAC payback, sales capacity, and channel mix for self-serve versus enterprise-assisted deals.
  - - NRR / churn / cohort quality
    - 'Null'
    - Low
    - Revenue quality depends on renewal and expansion behavior, especially because connections are the core enterprise billing unit.
    - Provide GRR, NRR, connection cohort retention, and expansion by customer segment.
