- id: SI005
  title: Financial verdict and diligence blockers
  body: |-
    The positive case is straightforward. WorkOS has a broad enterprise-identity monetization surface, unusually legible public list pricing, credible named customers, and a clearly disclosed funding step-up through Series C. Those facts support a view that demand quality is real and that WorkOS is building a serious category platform rather than a single-point feature. The company also appears to have raised capital ahead of product expansion, not in distress, which lowers near-term financing anxiety.

    The negative case is what keeps the chapter from a clean underwriting conclusion. Public data does not reveal audited revenue, ARR, gross margin, customer concentration, NRR, CAC, payback, burn, or current cash. Third-party revenue estimates conflict from $12.8M to $30M, and one data vendor simultaneously claims WorkOS is bootstrapped despite the company’s own financing disclosures. Those are not small gaps; they are the core inputs needed to judge revenue quality, efficiency, and runway. The financial verdict is therefore positive on commercial momentum and capital access, but incomplete on realized economics. Any investment process should treat management’s private financial package as mandatory, not optional.
