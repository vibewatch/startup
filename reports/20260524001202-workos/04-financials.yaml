- id: SI002
  title: Funding history, valuation progression, and public scale proxies
  body: |-
    Public funding chronology is visible in broad strokes even though the finer cap-table details are not. WorkOS’s own Series A post says the company had previously raised $15M led by Lachy Groom and had raised $19M total to date. The 2022 Series B announcement and TechCrunch both corroborate an $80M round led by Greenoaks, and TechCrunch said total funding had reached about $100M by that point. The 2026 Series C announcement then adds a further $100M round, with Fenwick corroborating Meritech and Sapphire as the lead investors. Taken together, disclosed round amounts imply at least about $199M of cumulative funding.

    Scale disclosure also improved over time, but still only through proxies. Official materials cited over 100 enterprise-ready apps by the Series A period, over 200 paying customers by Series B, and thousands of customers plus billions of API requests per month by Series C. The valuation story is less complete. WorkOS disclosed a $2B valuation at Series C, but earlier official round posts did not publish intermediate valuation marks. That means investors can see the current step-up but not a clean progression between the early and late private rounds.
