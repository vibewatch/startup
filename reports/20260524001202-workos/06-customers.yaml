- id: named-proof
  title: Named customer proof and deployment outcomes
  body: The highest-quality public proof comes from WorkOS-authored case studies that quote customer operators and describe a concrete pre-WorkOS bottleneck, a deployment path, and a business or engineering outcome. Vercel links WorkOS to landing larger enterprise accounts and to moving from an in-house SSO approach into SSO, Directory Sync, and Admin Portal. Webflow says lack of SCIM left deals on the table and that one engineer added Directory Sync in less than a couple of weeks. Indeed describes replacing Auth0 because manual onboarding required hours of engineering support, while Warp says it kept Firebase and still shipped enterprise SSO quickly. AI21 Labs implemented in days; Copy.ai, Chromatic, Hypercare, and Hopin each describe roughly two-week implementation windows; Patch says a one-day integration unblocked $1 million in enterprise GMV. By contrast, OpenAI, Cursor, Perplexity, Drata, and incident.io are publicly substantiated on WorkOS’s customer surface, but their retained proof
    is thinner and relies more on concise quotes than on full deployment narratives.
