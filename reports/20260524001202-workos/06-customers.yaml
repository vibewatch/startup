chapter:
  number: 6
  title: Customers
  summary: WorkOS’s public customer proof is strongest among fast-growing B2B software vendors that needed enterprise identity features quickly without building them in-house. Detailed case studies for Vercel, Webflow, Indeed, Warp, AI21 Labs, Copy.ai, Chromatic, Hypercare, Patch, and Hopin show rapid deployment and recurring expansion into Admin Portal or Directory Sync, while current logo-level references such as OpenAI, Cursor, Perplexity, Drata, and incident.io are publicly substantiated but less deeply documented. Durability is directionally positive, but WorkOS still does not publicly disclose customer count, retention, or concentration.
sections:
- id: customer-segments
  title: Customer segments and buyer-user-payer map
  body: 'Public evidence suggests WorkOS primarily sells to software companies that themselves are moving upmarket into larger enterprise accounts, rather than to end-enterprises buying identity infrastructure directly for internal use. The retained proof set spans AI application vendors, developer tools, web platforms, hiring and workflow products, healthcare coordination, climate APIs, compliance software, and incident-management vendors. In these stories, the economic buyer is usually a product, platform, or engineering leader trying to unblock enterprise revenue without diverting engineers into a non-core identity build; the implementation user is the customer’s own engineering team; and the downstream operational user is the enterprise IT admin configuring SSO or SCIM through the WorkOS Admin Portal. Customer-side enterprise pages from Vercel, Webflow, Netlify, Warp, Perplexity, OpenAI, incident.io, and Drata reinforce the fit: WorkOS is most visible where the customer also markets
    enterprise security, governance, and user-lifecycle controls to its own buyers.'
  claimRefs:
