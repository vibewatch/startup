- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Public case studies show a consistent path from enterprise deal blocker to SSO launch, self-serve onboarding, and later product expansion.
  data:
    items:
    - label: Enterprise blocker appears
      detail: A prospect requires SSO, SCIM, or stronger admin controls before buying.
      actor: Enterprise buyer / security stakeholder
      sentiment: neutral
    - label: Build-vs-buy decision
      detail: Product and engineering leaders decide that identity is important but non-core and should not absorb scarce engineering time.
      actor: CTO / product / platform lead
      sentiment: neutral
    - label: Initial SSO deployment
      detail: WorkOS is integrated around the customer’s existing auth stack, often without a full rip-and-replace.
      actor: Engineering team
      sentiment: positive
    - label: IT-admin self-serve onboarding
      detail: Customer IT admins configure IdPs through Admin Portal instead of lengthy support calls or custom guides.
      actor: Enterprise IT admin
      sentiment: positive
    - label: Expansion into lifecycle and platform features
      detail: As the customer sells further upmarket, WorkOS expands into Directory Sync, User Management, Audit Logs, or adjacent control surfaces.
      actor: Product / security / enterprise ops
      sentiment: positive
