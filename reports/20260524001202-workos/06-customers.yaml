- id: expansion-retention
  title: Expansion, repeat usage, and durability proxies
  body: 'Public evidence is better on expansion triggers than on formal retention metrics. Across Vercel, Webflow, Indeed, Hypercare, Chromatic, Copy.ai, and Warp, WorkOS often lands on SSO and then expands into Directory Sync, Admin Portal, Audit Logs, or broader user-management workflows as the customer’s own enterprise business matures. The repeated value wedge is not only protocol coverage but operational leverage: self-serve IT onboarding, easier deprovisioning, less manual support, and less need to maintain fragile custom SAML or SCIM infrastructure. Independent reviews on G2 and Product Hunt broadly corroborate this pattern, praising documentation, support, and speed while describing WorkOS as a way to focus engineering time on differentiated product work. Still, public durability evidence remains mostly qualitative. WorkOS does not publish NRR, GRR, churn, renewal schedules, or product attach rates, so the strongest retention read-through is that some customers publicly expanded
    product scope after initial SSO adoption rather than the existence of hard renewal data.'
  claimRefs:
  - CU006
  - CU007
  - CU008
  - CU021
