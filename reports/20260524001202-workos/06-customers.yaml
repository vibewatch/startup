  evidenceGaps:
  - type: missing-source
    severity: material
    topic: Named Anthropic proof
    missingEvidence: Retained sources do not provide a public Anthropic customer reference for WorkOS.
    whyItMatters: Anthropic is a high-signal AI logo; confirming or disproving it would sharpen the quality of WorkOS’s frontier-AI customer proof.
    diligencePath: Request a named Anthropic reference, deployment letter, or explicit public citation before using Anthropic in any marketing or investment memo.
    relatedQuestionRefs:
    - QU014
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: Retention and renewal metrics
    missingEvidence: No public NRR, GRR, churn, renewal schedule, or median contract-term disclosure appears in the retained materials.
    whyItMatters: Without formal retention data, the public proof supports adoption quality but not durability or cash-flow predictability.
    diligencePath: Request cohort retention, logo churn, renewal calendar, and attach-rate data by product for the last 8 quarters.
    relatedQuestionRefs:
    - QU017
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: Customer count and concentration
    missingEvidence: Official retained sources do not disclose total paying customers, top-customer exposure, or ARR by segment; only weak third-party proxies are public.
    whyItMatters: This prevents a hard view on concentration risk, upsell penetration, and whether marquee names are economically meaningful or mostly reputational.
    diligencePath: Request current customer count, ARR by top 10 customers, revenue by segment, and product attach rates.
    relatedQuestionRefs:
    - QU021
    - QU022
    relatedTableRefs:
    - TU002
    - TU005
  - type: missing-source
    severity: minor
    topic: Geography and regulated-sector mix
    missingEvidence: The retained public proof does not provide a reliable breakdown of customers by geography or by regulated vertical.
    whyItMatters: A more diversified customer mix would reduce concerns that the public proof is overly concentrated in venture-backed software.
    diligencePath: Request customer distribution by geography, industry, and compliance profile.
    relatedQuestionRefs:
    - QU016
    relatedTableRefs:
    - TU001
    - TU005
  - type: conflicting-data
    severity: minor
    topic: Third-party customer-count proxies
    missingEvidence: Apps Run The World and Bloomberry offer third-party customer data, but neither source exposes enough methodology to validate exact customer counts or renewal signals.
    whyItMatters: These proxies are tempting because WorkOS does not disclose counts, but over-relying on them could overstate adoption or renewal visibility.
    diligencePath: Use third-party lists only as lead generation; obtain management-confirmed customer counts and independently verify a sample of named accounts.
    relatedQuestionRefs:
    - QU022
    - QU023
    relatedTableRefs:
    - TU002
