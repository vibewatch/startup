- id: concentration-gaps
  title: Concentration, disclosure gaps, and adverse evidence
  body: 'Customer quality looks strong, but disclosure is still sparse where an investor would want hard underwriting data. The public proof set is concentrated in venture-backed software and infrastructure vendors; Hypercare is the clearest regulated exception in the retained set, while customer-level revenue concentration and segment mix are undisclosed. Official materials do not provide customer count, top-customer exposure, renewal rates, or churn. Third-party proxies fill some of that vacuum, but they are not equivalent to audited company disclosure: Apps Run The World independently lists a few WorkOS customers, while Bloomberry claims hundreds of detected installations through DNS telemetry but with methodology that is too opaque to rely on heavily. Reviews also surface friction around pricing pass-through, session management gaps, and a few feature limitations. Operationally, the May 22, 2026 status incident shows that even when underlying authentication and data were unaffected,
    a Dashboard/Admin Portal UI problem could still degrade a key onboarding surface that many customers rely on.'
  claimRefs:
  - CU031
  - CU033
  - CU036
  - CU038
  - CU039
  - CU040
