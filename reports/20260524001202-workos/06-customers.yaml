- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / concentration risk
  - Evidence
  - Impact
  - Diligence path
  rows:
  - - SSO-to-SCIM upsell
    - Webflow, Vercel, Copy.ai, Chromatic, Hypercare, Indeed all cite lifecycle-management expansion
    - Supports land-and-expand motion
    - Request attach rate and gross margin by product
  - - Admin Portal onboarding wedge
    - Repeatedly described as self-serve and polished by Vercel, Indeed, Warp, Hypercare, Patch
    - Reduces support burden and can improve conversion
    - Ask for Admin Portal penetration across paying customers
  - - Software-sector concentration
    - Named proof is heaviest in AI, developer tools, web infrastructure, and workflow SaaS
    - Revenue may be correlated to one venture/software cycle
    - Request ARR by industry and customer maturity band
  - - Thin proof for marquee AI logos
    - OpenAI, Cursor, Perplexity, Drata, and incident.io are public references but less deeply documented
    - Harder to underwrite production depth and contract value
    - Request reference calls or deployment letters for top AI logos
  - - Pricing pass-through risk
    - G2 reviews say WorkOS can be hard to justify on low tiers even when implementation is strong
    - Could limit adoption among smaller SaaS customers
    - Request gross retention and downgrade data by customer size
  - - Operational dependency on hosted surfaces
    - 2026-05-22 status incident affected Dashboard/Admin Portal UI
    - Could temporarily disrupt onboarding even if auth core remains healthy
    - Request SLA penalties, incident frequency, and IT-admin usage metrics
  notes: This table mixes upside expansion levers with concentration and execution risks because the public record is stronger on motion than on audited retention data.
