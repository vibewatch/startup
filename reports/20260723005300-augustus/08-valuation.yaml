callouts:
  - calloutType: "recommendation"
    title: "Conditional Invest: OCC Charter is Worth the Premium"
    body: "The $1B valuation is aggressive for a pre-revenue startup but defensible for a company with one of the rarest regulatory assets in American banking. Conditional invest for funds with a 5-7-year horizon and follow-on capacity; pass if you cannot participate in the next financing round."
    claimRefs: [CV021, CV022, CV002]

  - calloutType: "risk"
    title: "FDIC Approval Is the Only Valuation Driver That Matters"
    body: "Every scenario analysis converges on a single point: FDIC approval timing is the dominant valuation driver. An approval in 2027 justifies the $1B. A denial or delay to 2028+ makes the $1B very hard to defend and increases the probability of a down round."
    claimRefs: [CV013, CV014]

  - calloutType: "insight"
    title: "Charter Optionality Creates Acquisition Value Even in the Bear Case"
    body: "Even in the bear case, the OCC conditional charter has strategic acquisition value to incumbent banks and global payment networks. The charter can be sold or transferred in a strategic transaction; this floor creates asymmetric payoff structure that reduces but does not eliminate downside risk."
    claimRefs: [CV002, CV003]

  - calloutType: "strength"
    title: "Tiger Global + QED Is the Strongest Signal in the Deal"
    body: "Tiger Global (technology-first growth investor) and QED Investors (deepest fintech domain expertise globally, investor in Nubank, AvidXchange, and Current) investing together in the same round sends a strong validation signal. QED's fintech operational expertise specifically de-risks the execution gap concern."
    claimRefs: [CV020, CV019]

