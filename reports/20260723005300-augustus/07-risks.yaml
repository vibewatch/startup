      missingEvidence: "Augustus has not disclosed the shareholder agreement terms with Tiger Global; whether Tiger Global has board seats, pro-rata rights, drag-along rights, or governance veto powers is unknown."
      whyItMatters: "Tiger Global's governance rights could constrain management's ability to make independent business decisions, including pivots if regulatory approvals are delayed."
