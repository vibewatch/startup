callouts:
  - calloutType: "risk"
    title: "FDIC Approval Is the Single Biggest Binary Risk Event"
    body: "Every US banking product and associated revenue is gated on FDIC deposit insurance approval. This approval is not guaranteed, is not within Augustus's direct control, and historically takes 12–24 months for de novo banks. A denial or indefinite delay would make the $180M Series B investment in the US banking model unrecoverable without a major business model pivot."
    claimRefs: [CR001, CR002, CR025]

  - calloutType: "risk"
    title: "Single-Client EU Revenue Dependency Leaves Zero Margin for Error"
    body: "Kraken's own OCC bank charter application creates a self-disintermediation risk that would eliminate essentially all of Augustus's live revenue. While OCC charter processes take 2–4 years, an approval would trigger immediate relationship reassessment. The EU revenue base needs urgent diversification."
    claimRefs: [CR013, CR014, CR026]

  - calloutType: "risk"
    title: "25-Year-Old CEO Has No Bank Examination or Crisis Management Experience"
    body: "Ferdinand Dabitz's regulatory and fundraising credentials are exceptional, but leading a federally chartered bank through its first OCC examination, its first compliance crisis, or its first client payment failure requires banking operations experience he does not yet have. Greg Quarles compensates significantly but is in a President (not CEO) role."
    claimRefs: [CR019, CR020]

  - calloutType: "strength"
    title: "OCC Conditional Charter Is the Most Valuable Regulatory Risk Mitigant"
    body: "The OCC conditional charter is the most powerful risk mitigant in Augustus's profile: it proves the company passed one of the most rigorous financial regulatory reviews in the US, it signals OCC support for the business model, and it is a 2-year asset that cannot be quickly replicated. Most pre-revenue fintech investments have no equivalent regulatory signal."
    claimRefs: [CR028, CR040, CR041]

