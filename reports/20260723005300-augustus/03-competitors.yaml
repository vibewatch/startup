    topic: BaaS pricing transparency
    missingEvidence: Neither Column N.A., Cross River, nor Augustus publish pricing; all estimates in this report are analyst-constructed.
      No contract-level data has been sourced from customers willing to disclose pricing terms.
    whyItMatters: Without pricing data, it is impossible to assess whether Augustus can compete on cost vs. incumbent BaaS
      providers or must justify a premium based on regulatory differentiation.
