- id: capability-pricing-comparison
  title: Capability and Pricing Comparison
  body: 'On core capability dimensions, Column N.A. and Augustus are most similar: both offer OCC-chartered, API-first banking
    with FDIC-insured accounts, SWIFT/ACH/FedNow access, and 24/7 operations. Augustus additionally claims SEPA connectivity,
    stablecoin settlement, and a GENIUS Act–compliant framework, reflecting its international focus. Column''s capabilities
    are more mature (4 years of operation vs. Augustus''s pre-operational status) but its stated product scope does not include
    SEPA or stablecoin clearing. Cross River offers broader scale (8.7B assets vs. Column''s 1.38B) and international client
    proof, but is state-chartered (lacking OCC''s national bank imprimatur and direct OCC examination coverage). Stripe Treasury
    is the most developer-accessible option—rapid sandbox onboarding and extensive documentation—but lacks its own bank charter
    and carries sponsor-bank concentration risk. Pricing data for BaaS providers is generally confidential and negotiated
    per deal. Column has not published pricing. Cross River has not published pricing. Stripe''s embedded finance pricing
    is bundled into Stripe''s overall transaction fees (~0.3–0.5% per transaction). Unit Finance reportedly charges $500–$2,000/month
    platform fee plus per-transaction fees. Augustus pricing is not publicly disclosed; given its premium OCC-charter positioning,
    analyst estimates suggest contract values above $500K–$2M per year for anchor clients, in line with Column''s known deal
    sizes for Brex and Mercury. A key differentiation on trust and regulatory posture: Augustus (pending FDIC approval) and
    Column (FDIC-insured since 2022) both carry OCC supervision, the most rigorous federal banking oversight. Cross River
    is FDIC-insured and state-supervised. Stripe Treasury is supervised as a money transmitter in most jurisdictions, not
    as a bank. This regulatory differentiation matters to compliance-sensitive buyers—particularly post-Synapse.'
  claimRefs:
  - CP014
  - CP015
  - CP016
  - CP017
  - CP018
  - CP019
  tableRefs:
  - TP003
- id: moat-durability-risks
  title: Moat Durability and Competitive Risks
  body: 'Augustus''s primary competitive moats are: (1) OCC bank charter—a high-barrier regulatory asset that took two years
    of process with OCC and requires ongoing capital, compliance, and examination compliance; (2) International product thesis—no
    existing OCC-chartered API bank has made international fintech access the core product; (3) GENIUS Act timing—being first-to-market
    as an OCC-chartered stablecoin clearing infrastructure provider under the new regulatory framework. Key risks to moat
    durability: (1) Column expansion—Column could extend its product scope to international fintechs and SEPA connectivity;
    it has sufficient capital and regulatory standing to do so. This is the most material competitive displacement risk. (2)
    Cross River international expansion—Cross River serves Wise and Coinbase today; it could deepen its international positioning
    with additional capital or an OCC charter conversion. (3) Consolidation—well-capitalized acquirers (Stripe, Visa, Mastercard,
    large banks) could acquire Column or Cross River, bringing scale and distribution that would be difficult to match. (4)
    Sponsor-bank commoditization—if the Synapse-driven regulatory scrutiny pushes all sponsor banks toward Column-like compliance
    standards, the Tier 1 OCC-charter advantage shrinks. (5) FDIC approval delay—Augustus is not yet FDIC-insured; if FDIC
    approval is delayed significantly (18+ months), Column maintains an unassailable advantage in client acquisition for FDIC-dependent
    use cases. The switching cost analysis: fintechs integrated into Column''s or Cross River''s APIs would face months of
    re-engineering to migrate. Augustus must capture clients before they commit to a competitor, or convince non-banked international
    fintechs to build on its platform first. Multi-homing is possible (a fintech could use Augustus for international USD
    and Column for US domestic), which limits winner-take-all dynamics but also creates a land-and-expand opportunity.'
