callouts:
- calloutType: strength
  title: 'Unique Quadrant: OCC Charter + International Focus'
  body: Augustus is the only OCC-chartered, API-first bank explicitly targeting international fintech clients as its primary
    product. Column holds the same OCC charter but is US-focused. This positional uniqueness reduces direct competition in
    the short term (12–18 months) and aligns with structural market tailwinds (GENIUS Act, correspondent banking contraction).
  claimRefs:
  - CP027
  - CP028
- calloutType: risk
  title: Column's Operational Head Start Is Material
  body: Column N.A. operates with $200M revenue, $1.38B in assets, $23M in quarterly net income, and high-profile fintech
    clients (Brex, Mercury, Plaid). This 4-year operational lead, profitability, and client credibility represent a significant
    hurdle for Augustus. Column could expand internationally with its existing OCC charter, eliminating Augustus's primary
    differentiation within 12–24 months.
  claimRefs:
  - CP006
  - CP033
  - CP034
  - CP021
- calloutType: recommendation
  title: Diligence Must Assess Column Expansion Plans
  body: Investors should seek direct evidence (management discussion, product roadmap, hiring signals) that Column is NOT
    building international fintech access into its next product phase. Any hiring of international payments specialists or
    EU regulatory expertise at Column would signal imminent competitive encroachment.
  claimRefs:
  - CP021
  - CP022
