  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: Column N.A. international expansion plans
    missingEvidence: No public evidence of Column N.A.'s product roadmap, hiring for international roles, or strategic statements
      about serving non-US fintechs has been found. Without this, the competitive risk timeline cannot be assessed.
    whyItMatters: If Column announces international expansion within 12 months of Augustus's launch, it would materially reduce
      Augustus's differentiation before it achieves scale.
    diligencePath: Monitor Column job postings for international/SEPA/SWIFT roles; attend industry conferences where Column
      leadership speaks; check Column developer documentation updates.
    relatedQuestionRefs:
    - QP007
    - QP014
  - type: missing-source
    severity: material
    topic: Augustus vs Column technical comparison
    missingEvidence: No independent technical comparison between Augustus's Marble platform and Column's technology stack
      has been published. Both claim AI-native, 24/7 architecture but no third-party validation exists.
    whyItMatters: Technology quality is a primary competitive differentiator; without independent technical assessment, it
      is impossible to validate Augustus's claimed architectural advantage.
    diligencePath: Commission independent technical due diligence with sandbox API testing; review developer documentation
      depth and API response time benchmarks.
    relatedQuestionRefs:
    - QP024
  - type: missing-source
