companyProfile:
  summary: "Augustus (dba Global Dollar Bank) is a Dallas-based fintech startup founded in 2022 by Ferdinand Dabitz (CEO, 25, Thiel Fellow) and co-founded with Greg Quarles (President, 18yr OCC examiner, former Green Dot CEO). The company received conditional approval from the Office of the Comptroller of the Currency (OCC) in May 2026 for a US national bank charter—the first new national bank charter conditional approval in over a decade. Augustus's core product is the Marble platform: an AI-native core banking system designed to provide international fintechs and neobanks with direct access to US dollar accounts, cross-border payment rails (SWIFT, ACH, SEPA, FedNow, stablecoins), and OCC-licensed stablecoin reserve management under the GENIUS Act. The company currently operates in Europe through a Finnish banking entity, with Kraken (Payward Inc.) as its only publicly confirmed client for euro clearing. Augustus raised $180M in Series B financing at a $1B valuation in July 2026, led by Tiger Global Management with QED Investors and Hummingbird Ventures."
