- id: buyer-segmentation
  title: Buyer Segmentation and Demand Drivers
  body: 'Augustus''s target buyers are institutional and platform-level rather than retail. Primary segments are: (1) International
    fintechs and neobanks seeking US market access—regional neobanks in Latin America, Southeast Asia, Middle East–North Africa,
    and Sub-Saharan Africa that serve millions of retail or SME customers and need USD accounts and payment rails to serve
    them; (2) Cryptocurrency exchanges and digital asset platforms requiring stablecoin settlement and clearing infrastructure
    compliant with the GENIUS Act; (3) Regional banks in emerging markets with correspondent banking deficits—banks that have
    lost USD correspondent relationships and need an alternative custodian for USD reserves and SWIFT access; (4) Cross-border
    B2B payment companies needing USD origination and receipt. Budget ownership in segments 1 and 3 sits with chief financial
    officers and treasury heads; in segment 2 with compliance and operations leadership. Adoption path is typically: pilot
    API integration → sandbox → production onboarding → contract for annual infrastructure fee. The substitution barrier is
    moderate—US sponsor-bank relationships (Column, Cross River) exist but come with balance-sheet constraints, compliance
    overhead, and counterparty-concentration risk highlighted by the Synapse collapse of 2024. The Synapse bankruptcy exposed
    $85–95M in customer funds to a reconciliation gap and led to 100 fintech platforms losing banking access, demonstrating
    the systemic vulnerability of multi-tier BaaS intermediation. Augustus''s direct charter model eliminates one layer of
    intermediary risk, which is a primary adoption pull for compliance-sensitive buyers.'
  claimRefs:
  - CM015
  - CM016
