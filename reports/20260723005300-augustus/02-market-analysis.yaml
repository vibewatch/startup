  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: Market definition table coverage
    missingEvidence: The market definition table (TM001) covers five segments but does not enumerate CBDC pilot programs,
      multilateral development bank USD clearing, or central bank digital currency interoperability markets that could expand
      Augustus's TAM.
    whyItMatters: Excluding emerging CBDC and multilateral segments may understate the TAM if central bank digital currency
      rails require private clearing infrastructure.
    diligencePath: Monitor BIS/CPMI CBDC progress reports; review IMF FinTech notes on CBDC infrastructure needs.
    relatedTableRefs:
    - TM001
  - type: enumeration-incomplete
    severity: material
    topic: Sizing lens table completeness
    missingEvidence: The TAM/SAM/SOM table (TM002) does not include research from Gartner, IDC, or Forrester, which may offer
      materially different estimates or segment breakdowns. Bottom-up estimates from actual BaaS vendor revenue data are unavailable.
    whyItMatters: Overreliance on secondary research firms with opaque methodology could produce materially wrong TAM estimates.
    diligencePath: Obtain primary market research from Gartner or Forrester on BaaS segment; request vendor revenue data from
      public filings where available.
    relatedTableRefs:
    - TM002
    relatedQuestionRefs:
    - QM007
  - type: enumeration-incomplete
    severity: minor
    topic: Buyer segment map coverage
    missingEvidence: The buyer segment map (TM003) does not capture niche segments such as SWIFT-member non-US community banks,
      multilateral development finance institutions, or sovereign wealth funds needing USD-denominated infrastructure.
    whyItMatters: These segments may represent high-value but less-targeted buyers for Augustus and their exclusion affects
      SAM accuracy.
    diligencePath: Review SWIFT annual report for member composition; interview Augustus sales team about target account lists.
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: blocking
    topic: Augustus-specific SAM and SOM
    missingEvidence: Augustus has not disclosed its internal SAM/SOM estimates, pipeline size, or customer acquisition targets.
      The $2–4B SAM estimate in this report is researcher-constructed and unverified.
    whyItMatters: Without company-confirmed market sizing, it is impossible to verify whether Augustus's $1B valuation is
      consistent with its actual serviceable opportunity.
    diligencePath: Request management presentation or data room access with internal market sizing model and customer pipeline
      detail.
    relatedQuestionRefs:
