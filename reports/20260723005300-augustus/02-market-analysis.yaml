callouts:
- calloutType: strength
  title: Large and Underserved Market with Structural Tailwinds
  body: The correspondent banking contraction (22% global decline 2011–2025), regulatory tailwinds from the GENIUS Act, and
    the post-Synapse BaaS scrutiny all create structural demand for the specific niche Augustus occupies. The combination
    of OCC charter plus API-first architecture is rare and genuinely differentiating.
  claimRefs:
  - CM024
  - CM025
  - CM026
- calloutType: risk
  title: Wide Market Estimate Ranges Signal Immature Segmentation
  body: BaaS market estimates range 1.7× from $29B to $48B, and cross-border payments 2× from $193B to $397B, reflecting definitional
    inconsistency. Augustus's SAM depends on a narrow sub-segment (international fintechs seeking US-chartered banking) for
    which no independent market research is available—the $2–4B estimate is purely analyst-constructed.
  claimRefs:
  - CM007
  - CM008
  - CM009
- calloutType: insight
  title: Synapse Collapse Reshaped BaaS Buyer Preferences
  body: The 2024 Synapse bankruptcy—which left $85–95M of customer funds unreconciled and disrupted 100 fintechs—has accelerated
    regulatory scrutiny on sponsor-bank BaaS and shifted buyer preference toward direct-charter models. Augustus benefits
    from this adverse precedent even though it is a competitor-side risk event.
  claimRefs:
  - CM019
  - CM020
  - CM021
