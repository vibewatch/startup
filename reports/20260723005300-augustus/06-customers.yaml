- id: customer-acquisition-concentration
  title: Customer Acquisition, Concentration Risk, and Adverse Factors
  body: 'Augustus''s customer acquisition is enterprise-direct: the company''s team of ex-Goldman Sachs, JPMorgan, and OCC
    bankers sells into compliance, treasury, and payments teams at mid-to-large international fintech firms. There is no self-serve
    or product-led growth motion apparent. The OCC charter is the primary acquisition differentiator—it enables Augustus to
    offer a regulated alternative to the informal correspondent banking relationships that international fintechs have historically
    depended on. Customer concentration risk is extreme at this stage. With only one publicly confirmed client (Kraken), Augustus''s
    current EU revenue is entirely dependent on the Kraken relationship. The loss of Kraken as a client—through Kraken obtaining
    its own OCC charter (Payward filed an OCC application in 2024), competing with a different correspondent bank, or reducing
    EU euro volumes—would materially impair Augustus''s current operating revenues. Broader concentration risk exists even
    in a more mature client base: the ''international fintech'' segment is dominated by a handful of large platforms (Nubank,
    Revolut, Grab) where each contract could represent 10–25% of total revenues; loss of a single anchor client post-launch
    would be highly disruptive. Augustus''s adverse customer risk profile also includes: (1) regulatory risk—clients are sensitive
    to their banking partner''s regulatory status; an OCC enforcement action against Augustus could trigger client exits;
    (2) switching cost ambiguity—while API-native banking integration creates some lock-in, payment rails are commoditized
    and clients can switch providers with 3–6 months of engineering effort; (3) pipeline quality—management claims hundreds
    of interested fintechs but has not published letters of intent, contracts, or a signed customer count. The full US client
    pipeline is unverifiable through public sources.'
  claimRefs:
  - CU012
  - CU013
  - CU014
  - CU015
