- id: confirmed-clients-adoption
  title: Confirmed Client Base and Current Adoption
  body: 'As of July 2026, Augustus has one publicly confirmed client: Kraken (Payward Inc.), one of the world''s largest cryptocurrency
    exchanges with $3–5B in annual spot trading volume. Kraken uses Augustus''s European entity for euro clearing, processing
    billions of euros annually through the regulated Finnish entity. This is live production revenue, not a pilot. The relationship
    was first disclosed in the Augustus Series B press release (July 21, 2026); Kraken''s use was described as ''market leader''
    adoption in Augustus''s own press materials. Beyond Kraken, Augustus has referenced other clients in general terms (''billions
    for market leaders'') but has not publicly named them. The Chainwire Series B announcement stated ''processing billions
    for market leaders like Kraken today.'' The use of ''like Kraken'' implies other clients of similar profile may exist
    but are not publicly confirmed. Two other entities have been mentioned as expressing interest or pursuing banking infrastructure
    from Augustus: Circle (pursuing) and Ripple (pursuing), based on public context about GENIUS Act-oriented fintech banking
    infrastructure needs. These are not confirmed clients. Augustus''s management has stated that the FDIC approval process
    will unlock the first US dollar product clients; the pipeline of US clients is private but Ferdinand Dabitz has described
    interest from ''hundreds of international fintechs'' wanting US dollar banking access. The EU operations represent a proof
    of concept; Kraken as a marquee reference client is a strong validator for enterprise sales, as Kraken is a well-known
    brand in the institutional crypto space and carries reputational weight with other potential clients.'
  claimRefs:
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
