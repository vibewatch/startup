callouts:
- calloutType: risk
  title: 'Single-Client Concentration: 100% of Disclosed Revenue From Kraken'
  body: 'The most material near-term customer risk is extreme concentration: Kraken represents 100% of disclosed client activity.
    Payward (Kraken''s parent) has filed its own OCC bank charter application, which—if approved—would eliminate the need
    for Augustus as a banking partner. This single-client dependency makes early-stage revenue fragile.'
  claimRefs:
  - CU013
  - CU014
  - CU015
- calloutType: strength
  title: Marquee First Client in a High-Value Segment
  body: Kraken is one of the largest and most reputable cryptocurrency exchanges globally. A marquee reference client in the
    crypto exchange segment—the most advanced buyer of banking infrastructure—validates Augustus's product market fit and
    provides a powerful reference for attracting similar clients (Coinbase, Bitfinex, OKX) who face the same banking infrastructure
    needs.
  claimRefs:
  - CU007
  - CU008
  - CU009
- calloutType: insight
  title: Correspondent Bank De-Risking Creates Structural Tailwind
  body: Major US banks (JPMorgan, Citi, Deutsche Bank) are systematically reducing correspondent banking relationships with
    high-risk jurisdictions (MENA, Africa, crypto). This de-risking trend has left hundreds of international fintechs and
    regional banks without stable USD correspondent access—exactly the problem Augustus is designed to solve. This structural
    tailwind is independent of Augustus's product quality.
  claimRefs:
  - CU005
  - CU026
  - CU027
- calloutType: risk
  title: Pipeline Claims Are Unverifiable; No LOIs or Signed Contracts Disclosed
  body: Management's assertion of 'hundreds of interested fintechs' is not verifiable from public sources. No letters of intent,
    signed contracts, or customer counts have been disclosed outside of Kraken. The absence of verified pipeline data is a
    significant limitation for pre-investment diligence.
  claimRefs:
  - CU011
  - CU012
  - CU016
