- id: customer-economics-expansion
  title: Customer Lifetime Economics and Expansion
  body: 'Augustus has not publicly disclosed its revenue model, pricing, or unit economics. Based on comparable banking infrastructure
    platforms (Column N.A., Stripe Treasury, Cross River), the likely model is: (1) Account opening fees and monthly account
    maintenance fees; (2) Transaction fees on payment originations (ACH, SWIFT, SEPA, FedNow), typically $0.10–5.00 per transaction
    or 10–30 basis points of transfer value; (3) Net interest income on balances held by clients at Augustus (once FDIC-approved);
    (4) GENIUS Act compliance module subscription fee (SaaS) for stablecoin issuers. Estimated revenue per anchor enterprise
    client: $500K–$5M annually for a mid-size international neobank with 500K–5M users and meaningful USD transaction volumes.
    For a crypto exchange like Kraken, revenue would primarily be transaction-fee-based on wire volumes. Net interest income
    potential is more speculative but could be significant: if Augustus holds $1B in average client deposits at a 4–5% net
    interest margin, that generates $40–50M in NII annually without any transactions. The expansion path for each client is:
    (1) Launch with a single rail (e.g., SWIFT); (2) Expand to additional rails (ACH, SEPA); (3) Migrate end-user accounts
    to named virtual accounts; (4) Expand geographically within the client''s user base. This creates a natural expansion
    revenue motion. Customer durability depends on product reliability and compliance track record; there are no public data
    points on churn, renewal rates, or net revenue retention.'
  claimRefs:
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  tableRefs:
  - TU005
  figureRefs:
  - FU004
- id: competitive-displacement-risks
  title: Customer Displacement Risks and Competitive Dynamics
  body: 'Augustus''s customers are not yet locked in—Kraken in particular is actively pursuing its own OCC bank charter (Payward
    filed in 2024), which would make Augustus redundant for their US dollar needs. If Payward/Kraken receives its own OCC
    charter, it would eliminate the need for Augustus as a banking partner. This is the single most material near-term customer
    risk. More broadly, the BaaS and correspondent banking market is competitive: Column N.A. is the most direct competitor
    for US infrastructure clients (US-focused but expanding), Cross River targets US-based embedded finance, and JP Morgan''s
    global payments infrastructure serves many of the same international fintech clients at a higher cost but with much greater
    scale and brand credibility. For international fintech clients, the switching cost from a correspondent banking relationship
    to Augustus involves compliance re-certification, technical integration (3–6 months), and balance migration—moderate barriers
    but not insurmountable. If Augustus''s US product launch is delayed beyond 2027, clients committed to the US opportunity
    may choose alternatives (Column, Cross River) or build their own solutions. The GENIUS Act stablecoin custody segment
    is the most defensible: if Augustus is early to market as an OCC-chartered GENIUS Act custodian, switching costs rise
    dramatically (regulatory approvals, reserve management audit trail) and the first-mover advantage could generate significant
    long-term client stickiness. However, this segment does not yet exist commercially as of July 2026.'
  claimRefs:
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
