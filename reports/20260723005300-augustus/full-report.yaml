              regulatory knowledge capital. The company's published technical differentiator—'24/7 real-time settlement
              at machine speed vs. banks closed 115 days/year'—is verifiable in concept but not independently
              benchmarked. CEO Ferdinand Dabitz has characterized Marble as 'a bank made of code for agents made of
              code,' signaling intent to serve AI-agent-driven financial use cases as a growth vector beyond current
