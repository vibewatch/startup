              BaaS market estimates range 1.7× from $29B to $48B, and cross-border payments 2× from $193B to $397B,
              reflecting definitional inconsistency. Augustus's SAM depends on a narrow sub-segment (international
              fintechs seeking US-chartered banking) for which no independent market research is available—the $2–4B
              estimate is purely analyst-constructed.
            calloutType: risk
            claimRefs:
              - CM007
