  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation Methodology and Context
        blocks:
          - type: paragraph
            body: >-
              Valuing Augustus at its $1 billion Series B is an exercise in regulatory asset and optionality valuation
              rather than traditional revenue multiples. As of July 2026, Augustus has essentially zero US revenue (the
              US banking product requires FDIC approval before it can launch), and its only confirmed revenue is from
              Kraken's euro clearing in Europe—a relationship that generates material but undisclosed revenue through
              the company's Finnish banking entity. Traditional comparable-company analysis using forward revenue
              multiples, ARR multiples, or EBITDA multiples cannot be applied directly to Augustus because it is
              pre-revenue in its primary market. Instead, the valuation must be assessed on two dimensions: (1) the
              option value of the OCC conditional charter—the cost and rarity of obtaining a new US national bank
              charter, and what it is worth to investors and potential acquirers; and (2) the discounted present value
              of projected US banking revenue at scale (3-5 years post-FDIC approval), risk-adjusted for the probability
              and timing of regulatory approvals and client acquisition. The OCC conditional charter is genuinely
              scarce: no new national bank charter has been approved in over a decade (prior to Augustus), and the OCC
              has explicitly approved Augustus as a GENIUS Act-capable stablecoin clearing bank—a unique regulatory
              designation. The charter option value alone could be priced at $200–400M by strategic acquirers. The
              remaining $600–800M implies a present-value discount of future revenue that requires $50-100M ARR within
              3-5 years to justify at market multiples of 15-20x for high-growth fintech infrastructure.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
