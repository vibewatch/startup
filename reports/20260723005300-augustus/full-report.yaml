  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments and Target Market
        blocks:
          - type: paragraph
            body: >-
              Augustus's Ideal Customer Profile (ICP) is an international fintech or bank that (1) needs programmatic US
              dollar access for its end-users or operations, (2) cannot easily obtain a US banking sponsor, and (3) is
              large enough to justify enterprise API banking integration. Four primary segments have been identified:
              First, international consumer neobanks—companies like Nubank (Brazil, ~97M users), Revolut (UK/EU), Grab
              Financial (SEA), and dozens of Africa-focused neobanks that hold client USD balances and make
              international wire transfers; these companies collectively need US correspondent accounts for their
              clients. Second, cryptocurrency exchanges and digital asset platforms—companies like Kraken (confirmed
              client), Circle, Ripple, and others that need USD on/off ramps, stablecoin clearing, and SWIFT access for
              institutional clients; this is Augustus's most advanced segment based on Kraken's confirmed use. Third,
              cross-border B2B payment providers—companies serving LatAm, MENA, Sub-Saharan Africa, and Southeast Asia
              merchant corridors that need to originate USD wires on behalf of payers; competitor banks like Citibank
              and JPMorgan are reducing correspondent relationships in high-risk jurisdictions, creating a market for
              API-first alternatives. Fourth, GENIUS Act stablecoin issuers (emerging)—when the GENIUS Act regulatory
              framework is implemented, USD stablecoin issuers above $10B will need OCC-chartered reserve custodians;
              this segment is pre-revenue but potentially the highest-value per client. The addressable universe of
              international fintechs needing US dollar access is estimated at 2,000–4,000 companies globally, with heavy
              concentration in fintech hubs: Brazil (Nubank, C6, Inter), UK/EU (Revolut, Monzo, N26), Southeast Asia
              (Grab, GoPay, OVO), MENA (Tabby, Tamara, Lean), and Africa (Flutterwave, Chipper, MFS Africa).
