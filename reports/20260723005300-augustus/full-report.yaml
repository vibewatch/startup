      - number: '1.3'
        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >
              Augustus has completed three funding rounds since its 2022 founding, raising a cumulative total of
              approximately $240 million in disclosed equity financing. The seed round of approximately $12 million was
              closed between 2022 and 2023 to establish the initial product and team. A $48 million Series A was
              completed in 2024, enabling the company to advance its Marble platform and begin the OCC charter
              application process, with QED Investors and Hummingbird Ventures participating as lead or co-lead
              investors. The landmark Series B, announced July 21, 2026, raised $180 million at a post-money valuation
              of $1 billion, conferring unicorn status on the company. Tiger Global Management led the Series B, with
              continued participation from QED Investors and Hummingbird Ventures, and notable co-investment from
              founders of Nubank, Ramp, Circle, and Deel. The Valar Ventures and Creandum funds were also cited as
              participants in earlier rounds. Augustus's $1 billion valuation, achieved on disclosed revenue that has
              not been publicly quantified, implies a significant revenue multiple consistent with high-growth fintech
              infrastructure companies. No debt financing, credit facilities, or secondary share sales have been
              publicly reported. The capital is earmarked for geographic expansion across Latin America, Southeast Asia,
              the Middle East, and Africa, continued platform development, and satisfying the OCC's pre-opening capital
              requirements including minimum equity capitalization and Federal Reserve Bank stock acquisition. The lack
              of disclosed revenue or ARR creates an evidence gap in evaluating the implied valuation multiple.
