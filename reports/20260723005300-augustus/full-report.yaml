          - type: callout
            title: Synapse Collapse Reshaped BaaS Buyer Preferences
            body: >-
              The 2024 Synapse bankruptcy—which left $85–95M of customer funds unreconciled and disrupted 100
              fintechs—has accelerated regulatory scrutiny on sponsor-bank BaaS and shifted buyer preference toward
              direct-charter models. Augustus benefits from this adverse precedent even though it is a competitor-side
              risk event.
            calloutType: insight
            claimRefs:
