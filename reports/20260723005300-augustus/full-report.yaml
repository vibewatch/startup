      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Key growth drivers for Augustus's market: (1) GENIUS Act enactment (2026)—creates a stablecoin regulatory
              framework that requires full bank charters for stablecoin issuers above $10B and creates demand for
              OCC-chartered infrastructure; (2) Continued contraction of correspondent banking—correspondent
              relationships have fallen 22% globally 2011–2025, disproportionately affecting Africa (–42%), MENA (–28%),
              and LatAm (–31%), the same regions where Augustus's target clients operate; (3) Open banking and API
              mandates in APAC and MENA creating demand for composable, API-accessible banking; (4) Regulatory pressure
              on sponsor-bank BaaS following Synapse—the FDIC and OCC have both issued formal guidance requiring
              enhanced oversight of BaaS intermediaries, making direct-charter models more attractive to
              compliance-conscious fintechs; (5) Dollar hegemony in emerging-market trade finance and remittances—USD
              remains the invoicing currency for approximately 73% of global goods trade. Key adoption constraints: (1)
              Concentration risk—Augustus as an early-stage bank charter means all clients are dependent on a single
              institution whose charter remains conditional pending FDIC approval; (2) Switching costs from incumbent
              sponsor banks are moderate but real, as API integrations require re-implementation; (3) Capital
              intensity—building and maintaining a chartered national bank requires ongoing minimum capital ratios
              (well-capitalized threshold = 10% total risk-based capital ratio); (4) Regulatory timeline
              uncertainty—FDIC insurance approval process adds 6–18 months of uncertainty post-OCC approval; (5)
              Pricing—OCC-chartered BaaS may command a premium vs. sponsor-bank alternatives, potentially limiting
              adoption among cost-sensitive smaller fintechs.
