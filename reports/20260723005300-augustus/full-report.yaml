      - number: '3.3'
        title: Capability and Pricing Comparison
        blocks:
          - type: paragraph
            body: >-
              On core capability dimensions, Column N.A. and Augustus are most similar: both offer OCC-chartered,
              API-first banking with FDIC-insured accounts, SWIFT/ACH/FedNow access, and 24/7 operations. Augustus
              additionally claims SEPA connectivity, stablecoin settlement, and a GENIUS Act–compliant framework,
              reflecting its international focus. Column's capabilities are more mature (4 years of operation vs.
              Augustus's pre-operational status) but its stated product scope does not include SEPA or stablecoin
              clearing. Cross River offers broader scale (8.7B assets vs. Column's 1.38B) and international client
              proof, but is state-chartered (lacking OCC's national bank imprimatur and direct OCC examination
              coverage). Stripe Treasury is the most developer-accessible option—rapid sandbox onboarding and extensive
              documentation—but lacks its own bank charter and carries sponsor-bank concentration risk. Pricing data for
              BaaS providers is generally confidential and negotiated per deal. Column has not published pricing. Cross
              River has not published pricing. Stripe's embedded finance pricing is bundled into Stripe's overall
              transaction fees (~0.3–0.5% per transaction). Unit Finance reportedly charges $500–$2,000/month platform
              fee plus per-transaction fees. Augustus pricing is not publicly disclosed; given its premium OCC-charter
              positioning, analyst estimates suggest contract values above $500K–$2M per year for anchor clients, in
              line with Column's known deal sizes for Brex and Mercury. A key differentiation on trust and regulatory
              posture: Augustus (pending FDIC approval) and Column (FDIC-insured since 2022) both carry OCC supervision,
              the most rigorous federal banking oversight. Cross River is FDIC-insured and state-supervised. Stripe
              Treasury is supervised as a money transmitter in most jurisdictions, not as a bank. This regulatory
