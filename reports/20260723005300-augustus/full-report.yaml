chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >
              Augustus, legally operating as Augustus Bank N.A. and known externally as the Global Dollar Bank, is an
              API-first, AI-native financial infrastructure company founded in 2022 and formerly operating under the
              name Ivy. Headquartered in Dallas, Texas, the company is building a branchless federally chartered US
              national bank expressly designed to serve international fintechs, neobanks, digital asset exchanges, and
              financial institutions that require reliable, programmable access to US dollar accounts and payment rails.
              Augustus's core proposition is the elimination of the costly, opaque correspondent banking chain that
              historically forced international players to layer third-party intermediaries to access USD clearing. By
              combining a full OCC national bank charter — a rare regulatory designation — with a purpose-built
              AI-native core banking platform called Marble, Augustus positions itself as direct infrastructure rather
              than a middleware layer. The Marble platform supports SWIFT, ACH, SEPA, and stablecoin settlement
              natively, operating 24 hours a day, 365 days a year without the settlement windows that constrain legacy
              correspondent banks. Augustus also plans a wholly owned stablecoin subsidiary to handle reserves and
              stablecoin issuance, custody, conversion, and payment operations in compliance with the GENIUS Act. The
              company targets growth markets in Latin America, Southeast Asia, the Middle East, and Africa, where demand
              for reliable USD access is high and legacy correspondent banking coverage is expensive and fragile. Crypto
              exchange Kraken is a publicly named institutional client, providing early proof of the platform's
              real-world applicability.
