            claimRefs:
              - CV021
              - CV022
              - CV023
      - number: '8.2'
        title: Comparable Company Valuations
        blocks:
          - type: paragraph
            body: >-
              The closest public and private comparables for Augustus span two categories: (1) OCC-chartered fintech
              infrastructure banks (Column N.A., Cross River Bank), and (2) banking-as-a-service middleware providers
              (Unit, Highnote, Synapse, Stripe Treasury). Column N.A. is the most direct comparable: OCC-chartered,
              US-focused banking infrastructure, $200M net revenue in 2025, and recently valued at a private market
              multiple of ~15x revenue implying a $2-3B valuation range—significantly above Augustus's $1B at zero US
              revenue. However, Column is 4 years further along the build-out journey and already generating revenue.
              Cross River Bank is valued at approximately $3 billion ($517M 2025 revenue at ~6x) and operates under a
              state charter with more limited regulatory positioning for GENIUS Act compliance. Unit Finance (BaaS
              middleware) and Highnote raised at valuations of $1.0-1.5B on sub-$50M ARR in 2022-2023, implying 20-30x
              ARR multiples that have since compressed significantly as BaaS market sentiment deteriorated after
              Synapse's bankruptcy. At $1B pre-revenue, Augustus's OCC charter and stablecoin positioning differentiate
              it from pure BaaS middleware; it trades at a premium to those peers that is defensible only if the charter
              provides strategic optionality. Against Column at $2-3B on $200M revenue, Augustus's $1B on near-zero
              revenue requires belief that Augustus will achieve $67M+ in revenue within 3 years to justify a 15x
              implied multiple at today's entry price. Large institutional investors in this space—Tiger Global's
              fintech infrastructure portfolio, QED's track record in banking infrastructure (Nubank, AvidXchange,
              Current)—suggest that sophisticated capital believes the business model is achievable.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV004
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
      - number: '8.3'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              Bull scenario (20% probability): FDIC approval arrives by Q2 2027, Augustus onboards 3–5 anchor US clients
              (crypto exchanges, international neobanks, cross-border payment companies) within 12 months of launch, and
              achieves $25M ARR by end of 2027 and $75M ARR by end of 2028. The GENIUS Act regulatory clarity arrives on
              schedule; Augustus captures 30%+ of the addressable stablecoin reserve management market for OCC-chartered
              banks. Exit at $3–5B acquisition by a major US bank seeking a chartered fintech infrastructure platform
              (JP Morgan, Wells Fargo, BNY Mellon) or a strategic acquirer (Stripe, Visa, FIS). Return on $1B entry:
              3-5x in 4 years. Base scenario (50% probability): FDIC approval by Q4 2027; US launch H1 2028; 2 anchor
              clients onboarded by end of 2028; $30M ARR by 2029; IPO or growth equity round at $2B valuation in 2030.
              EU operations grow from Kraken to 3–4 euro clearing clients; total revenue $50-60M by 2030. Return on $1B
              entry: 1.5-2x in 5-6 years (modest by venture standards). Bear scenario (30% probability): FDIC approval
              delayed beyond 18 months (H1 2028) or initially denied; burn forces a Series C at $800M–$1B valuation
              before US launch; Kraken exits after receiving its own OCC charter; US launch occurs in H2 2028 with
              inadequate client pipeline; ARR reaches only $10–15M by 2030. Return: <1x with permanent impairment risk.
              Risk-adjusted expected value at $1B entry approximates $1.7B over 5 years—a positive but modest venture
              return. The investment is fundamentally a binary bet on FDIC approval timing and management execution
              quality.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The investment thesis for Augustus rests on four pillars. First, the OCC conditional charter is a
              genuinely rare regulatory asset—a real barrier to entry that cannot be quickly replicated by competitors.
              The charter took 3 years and exceptional regulatory relationships to obtain; it is worth substantially
              more than it would cost to build from scratch today. Second, the structural demand is structural—not
              cyclical: the 135+ million unbanked or underbanked customers of international fintechs cannot get adequate
              USD access from correspondent banking, and this is a secular trend that grows with global fintech
              expansion. Third, the founding team's regulatory capital (Ferdinand Dabitz's Thiel Fellowship
              relationships, Greg Quarles's 18 years at OCC) is genuinely differentiated and difficult to replicate.
              Fourth, the GENIUS Act creates a new regulatory layer that Augustus is specifically positioned to serve as
              the only OCC-chartered bank explicitly approved for stablecoin reserve management at scale. The
              anti-thesis has four pillars. First, the FDIC timeline is unknowable and a single blocking dependency: one
              FDIC denial or significant delay collapses the investment thesis. Second, the CEO is 25 with no banking
              execution experience; the risk that Dabitz's youth creates blind spots in bank operations, compliance
              culture, or crisis management is real. Third, the Kraken self-disintermediation risk means the only
              confirmed revenue source could disappear on a 2-4 year horizon. Fourth, the $1B valuation at zero US
              revenue leaves no margin of safety; any execution stumble—technology failure, regulatory setback, key
              person departure—will trigger significant valuation compression in a down round. On balance, the thesis
              wins on structural strength but the anti-thesis wins on near-term execution uncertainty.
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
          - type: table
            tableRef: TV002
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV018
          - type: table
            tableRef: TV005
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV024
      - number: '8.5'
        title: Final Recommendation and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Our recommendation is conditional invest for large growth/venture funds with a 5-7-year horizon and the
              ability to participate in future financing rounds. The OCC charter is a genuinely rare regulatory asset,
              the structural demand for US banking access is secular, and the $240M total capital provides adequate
              runway to reach the FDIC approval milestone. However, the investment requires satisfactory resolution of
              the following diligence asks before final commitment: (1) FDIC application status confirmation—is the
              application filed, what stage is it in, and has the FDIC flagged any concerns? This is the most critical
              diligence item; (2) Full OCC pre-opening conditions schedule review with counsel to assess completion
              timeline; (3) Management depth confirmation—CTO identification, engineering team size, BSA/AML officer
              qualification; (4) Technology due diligence—third-party testing of Marble platform for uptime, security,
              and AI compliance accuracy; (5) Financial model review—monthly burn rate, 24-month runway model, and FDIC
              timeline sensitivity analysis; (6) Kraken commercial agreement review—term, exclusivity, volume minimums,
              and notice provisions for termination. At the current $1B valuation, the risk-adjusted expected return for
              large institutional investors is marginally positive (estimated 1.5-2x base case), with material upside in
              the bull case (3-5x). Smaller funds without the capacity for follow-on rounds should be cautious—the
              instrument is more binary than typical growth-stage investments and requires significant pro-rata
              participation to preserve optionality.
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
          - type: table
            tableRef: TV006
            claimRefs:
              - CV025
              - CV021
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV001
              - CV005
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV015
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Conditional Invest: OCC Charter is Worth the Premium'
            body: >-
              The $1B valuation is aggressive for a pre-revenue startup but defensible for a company with one of the
              rarest regulatory assets in American banking. Conditional invest for funds with a 5-7-year horizon and
              follow-on capacity; pass if you cannot participate in the next financing round.
            calloutType: recommendation
            claimRefs:
              - CV021
              - CV022
              - CV002
          - type: callout
            title: FDIC Approval Is the Only Valuation Driver That Matters
            body: >-
              Every scenario analysis converges on a single point: FDIC approval timing is the dominant valuation
              driver. An approval in 2027 justifies the $1B. A denial or delay to 2028+ makes the $1B very hard to
              defend and increases the probability of a down round.
            calloutType: risk
            claimRefs:
              - CV013
              - CV014
          - type: callout
            title: Charter Optionality Creates Acquisition Value Even in the Bear Case
            body: >-
              Even in the bear case, the OCC conditional charter has strategic acquisition value to incumbent banks and
              global payment networks. The charter can be sold or transferred in a strategic transaction; this floor
              creates asymmetric payoff structure that reduces but does not eliminate downside risk.
            calloutType: insight
            claimRefs:
              - CV002
              - CV003
          - type: callout
            title: Tiger Global + QED Is the Strongest Signal in the Deal
            body: >-
              Tiger Global (technology-first growth investor) and QED Investors (deepest fintech domain expertise
              globally, investor in Nubank, AvidXchange, and Current) investing together in the same round sends a
              strong validation signal. QED's fintech operational expertise specifically de-risks the execution gap
              concern.
            calloutType: strength
            claimRefs:
              - CV020
              - CV019
