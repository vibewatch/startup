      - number: '2.2'
        title: Market Sizing and Growth Trajectory
        blocks:
          - type: paragraph
            body: >-
              Multiple independent research firms place the global BaaS market at $29–48 billion in 2026, with a
              compound annual growth rate of 11–27% depending on scope and methodology. Grand Master Insights (GM
              Insights) estimates $34.06B in 2026 growing to $183B by 2035 (CAGR ~20%); Mordor Intelligence places the
              2026 figure at $28.9B with a projected 17% CAGR through 2031; intelmarketresearch estimates $48.12B for a
              broader platform definition. The cross-border payments market is substantially larger. Grand View Research
              estimates $193.5B in 2026 services revenue; Fortune Business Insights sizes it at $397B in 2026 (broader
              definition including FX spreads); Juniper Research projects total cross-border transaction value reaching
              $250 trillion by 2027. Common growth drivers: ISO 20022 adoption, real-time payment network interlinks
              (UPI↔PayNow), G20 payment policy mandates, and the explosion of international e-commerce (growing 28.3%
              faster than domestic e-commerce). Augustus's immediate serviceable market—international fintech firms
              seeking US-chartered banking access—is a subset of global BaaS. Approximately 12,000 licensed fintech
              firms operate globally outside the US as of early 2026, and a conservative 15–20% are estimated to require
              or actively seek US dollar banking infrastructure, implying a SAM of roughly $2–4B in annual
              infrastructure fees at current pricing. The specific market for OCC-chartered BaaS (as opposed to
              sponsor-bank BaaS) is nascent but potentially premium-priced given regulatory-grade compliance and direct
              Fed access.
