      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >
              Augustus is led by a complementary team combining youthful technical ambition with deep regulatory and
              banking operational experience. Ferdinand Dabitz, co-founder and CEO, is a 25-year-old German Thiel
              Fellowship recipient who founded Augustus at age 21. Upon full OCC charter activation, Dabitz will become
              the youngest CEO of a federally chartered US bank in over 140 years, a milestone that underscores both the
              novelty of the institution and the concentration of key-person risk in a young first-time bank CEO.
              Alongside Dabitz, Greg Quarles serves as President, bringing deep institutional credibility through his
              prior tenures as CEO of Green Dot Bank, United Texas Bank, and H&R Block Bank, as well as 18 years as a
              commissioned National Bank Examiner and Assistant Deputy Comptroller at the OCC — the same regulator
              granting Augustus its charter. Joe Schenone holds the CFO role. The Quarles appointment is a strategic
              signal to regulators that Augustus has the operational DNA to manage a licensed bank, counterbalancing
              Dabitz's inexperience. Investor involvement from Tiger Global, QED Investors, and Hummingbird Ventures
              provides governance oversight from experienced fintech backers. The founding of Nubank, Ramp, Circle, and
              Deel founders as co-investors brings both strategic network effects and informal board-level mentorship,
              though detailed formal board composition has not been publicly disclosed. The key-person dependency on
              both Dabitz and Quarles represents a material governance risk: loss of either could materially impair
              regulatory relationships, product direction, and investor confidence.
