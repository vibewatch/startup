        - OCC withdraws conditional approval due to conditions not satisfied within 18 months
        - Risk from Nov 2027 onward
        - Severe; regulatory restart required
        - OCC public notification; pre-opening conditions milestones
      - - Kraken OCC charter granted
        - Kraken receives own OCC charter; signals Augustus exit
        - 'OCC process: 2-4 years; risk from 2027'
        - Material impairment of EU revenue
        - OCC charter application database; Kraken regulatory filings
      - - Cybersecurity breach (post-launch)
        - Material breach of Augustus banking system
        - Post-US launch
        - Permanent reputational damage; client exodus
        - News monitoring; OCC examination results
      - - Capital runway <12 months without Series C path
        - Burn exceeds capital with no refinancing in sight
        - Risk if FDIC delayed to 2028+
        - Insolvency risk
        - Burn rate vs. FDIC timeline; investor communications
      - - CEO departure (Dabitz)
        - Ferdinand Dabitz exits before US launch
        - Ongoing key-man risk
        - Significant; regulatory relationships and fundraising anchor depart
        - LinkedIn; press monitoring; investor communications
    notes: >-
      These triggers represent material thesis-break events; monitoring them is critical for ongoing investment
      management. Each trigger should be tracked quarterly by the investor relations team.
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
  - id: TV006
    title: Final diligence asks table
    columns:
      - Item
      - Priority
      - What Is Needed
      - Why It Matters
      - Assignee
    rows:
      - - FDIC application status
        - Critical (blocker)
        - Filing date, current stage, any FDIC staff feedback or conditions
        - Single most important milestone; unknown status is a material gap
        - CFO/legal team
      - - OCC pre-opening conditions schedule
        - Critical (blocker)
        - Full list of conditions from CD-1374; status of each condition
        - Required to assess how far from US launch
        - Legal counsel + OCC liaison
      - - Technology due diligence
        - High
        - 'Third-party audit of Marble: uptime, security, AI accuracy, SOC 2 status'
        - Core product claim is unvalidated; charter exam will require this
        - CTO/technology team
      - - CTO identification and team depth
        - High
        - Named CTO; engineering team size by function; key technical hires
        - AI-native bank requires deep technical leadership; gap is material
        - CEO + recruiting
      - - Financial model and burn rate
        - High
        - Monthly P&L; 24-month cash runway model; FDIC timeline sensitivity
        - Runway risk depends on FDIC timing; unknown without burn data
        - CFO (Joe Schenone)
      - - Kraken commercial agreement
        - Medium
        - Term, exclusivity, volume minimums, notice for termination
        - Self-disintermediation risk if Kraken gets own charter; exit terms matter
        - Legal counsel
      - - EU regulatory status
        - Medium
        - Finnish banking license status; ECB/FSA examination status
        - EU operations are live; EU regulatory risk exists independently
        - CFO + EU legal counsel
    notes: >-
      Priority classification: Critical = required before investment decision; High = required before investment
      closing; Medium = important for ongoing monitoring but not blockers.
    claimRefs:
      - CV025
      - CV021
