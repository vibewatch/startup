      - number: '3.2'
        title: Direct Competitor Profiles
        blocks:
          - type: paragraph
            body: >-
              Column N.A. is Augustus's most directly analogous competitor: an OCC-chartered, API-first bank serving
              fintech infrastructure clients with programmatic access to FDIC-insured accounts, ACH, FedNow, RTP, SWIFT,
              and card issuance. Founded in 2022 by Plaid co-founders William and Annie Hockey via conversion of
              Northern California National Bank, Column is 100% founder-owned with no outside venture investors. Its
              financial performance as of 2026 is exceptional: reported net revenue doubled from $100M (2024) to $200M
              (2025), and total assets reached $1.38B in Q1 2026 with net income of $23.2M year-to-date. Column's
              clients include Brex, Mercury, Plaid, Carta, and Ramp—all US-domiciled fintechs. Column does not publicly
              emphasize international fintech access as a product, creating the primary differentiation with Augustus.
              Cross River Bank is the preeminent Tier 2 competitor: a state-chartered FDIC-insured bank founded in 2008
              with $8.7B in assets, $517M in 2025 revenue, and a $3B valuation. Its investors include Andreessen
              Horowitz (a16z) and KKR. Cross River serves international clients including Wise (TransferWise), Coinbase,
              and Affirm, making it the most relevant established alternative for fintechs with an international payment
              use case. Stripe Treasury is the dominant Tier 3 player, processing trillions of dollars in payments via
              its sponsor-bank model; it offers multi-currency accounts and embedded finance but is not itself a
              chartered bank. Galileo Financial Technologies, acquired by SoFi for $1.2B, handles card and payment
              processing for Robinhood, Chime, and others but focuses on domestic card issuance rather than global USD
              banking access.
            claimRefs:
