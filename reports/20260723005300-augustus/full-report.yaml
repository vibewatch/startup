      - number: '7.3'
        title: Partner, Dependency, and Counterparty Risks
        blocks:
          - type: paragraph
            body: >-
              Augustus has material dependency risks across several vectors. The most acute is the Kraken dependency:
              Kraken (Payward Inc.) is the only publicly confirmed client and represents essentially all disclosed EU
              revenues. Kraken's own OCC bank charter application (filed 2024) creates a self-disintermediation risk: if
              Kraken receives an OCC charter, it no longer needs Augustus for dollar banking infrastructure.
              Additionally, Kraken has historically faced regulatory scrutiny (SEC settlement for operating as
              unregistered securities exchange; DOJ investigations); any regulatory action against Kraken could reduce
              its operations, volumes, and payments through Augustus. A second dependency risk is the Tiger Global lead
              investor: Tiger Global's historically aggressive investment pace combined with its portfolio performance
              challenges (net losses in 2021-2022 cycle) creates concentration risk if Tiger Global needs to reduce
              portfolio exposure; while Series B investors typically have strong contractual protections, a major Tiger
              Global liquidity event could signal concern to other investors. Third, Augustus depends on regulated
              third-party infrastructure for payment rails: SWIFT membership requires ongoing compliance with SWIFT's
              rules; FedNow access requires Federal Reserve membership; ACH requires NACHA membership. Any of these
              memberships could be revoked or suspended for non-compliance, disrupting payment capabilities. Fourth,
              cloud infrastructure dependency: if Augustus's primary cloud provider (assumed AWS/GCP) experiences
              outages affecting specific regions, Augustus's 24/7 claim fails. In 2022, AWS us-east-1 experienced
              multiple significant outages affecting hundreds of fintech companies; Augustus's SLA would be at risk.
