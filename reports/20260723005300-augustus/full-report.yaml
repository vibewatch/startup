        - label: 'Discovery: OCC-Chartered API Bank'
          description: >-
            Client discovers Augustus via relationship referral, media, or regulatory community; evaluates vs. Column
            N.A., Cross River
        - label: 'Evaluation: Legal & Compliance Due Diligence'
          description: Client performs compliance review of Augustus OCC charter, AML/KYC program, and API security
        - label: 'Onboarding: API Integration & KYB'
          description: Client integrates Marble REST API, completes KYB/AML onboarding, launches in sandbox environment
        - label: 'Launch: First Production Payment'
          description: Client originates first production SWIFT wire or ACH via Augustus; named virtual accounts go live
        - label: 'Expansion: Additional Rails & Users'
          description: Client adds SEPA, FedNow, stablecoin settlement; migrates more end-users to named accounts
        - label: 'Anchor: Sole USD Banking Partner'
          description: Client fully migrates USD correspondent relationship to Augustus; NRR expands with volume and user growth
    approximationNotes: >-
      Customer journey is analyst-constructed based on comparable enterprise banking API onboarding processes; Augustus
      has not published a formal customer journey.
    claimRefs:
      - CU012
      - CU022
      - CU023
