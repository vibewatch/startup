  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Streams
        blocks:
          - type: paragraph
            body: >-
              Augustus's revenue model is designed around four primary streams: (1) Platform and API access fees—annual
              infrastructure subscriptions charged to client fintechs and banks for access to Augustus's Marble-powered
              banking platform, estimated at $500K–$2M per anchor client per year based on comparable Column and Cross
              River contract sizes; (2) Transaction fees—per-unit fees on payment processing (estimated $0.01–$0.05 per
              ACH, $10–$25 per SWIFT wire, $0.01–$0.02 per SEPA transfer); (3) Float income—net interest earned on
              FDIC-insured client deposit balances maintained at the Federal Reserve (revenue = deposit base × Fed Funds
              Rate, currently ~5.25%); (4) FX conversion spread—estimated 0.25–0.50% margin on cross-currency
              transactions; (5) Stablecoin reserve management fees—projected future stream once Augustus's GENIUS
              Act-compliant stablecoin subsidiary is operational. Augustus has not publicly disclosed any revenue, ARR,
              or financial projections. All estimates in this chapter are analyst-constructed from industry benchmarks
              and comparable company data. The company is pre-operational: it holds only a conditional OCC charter and
              has not received FDIC insurance approval, which is a prerequisite for deposit-taking. Accordingly, no
              revenue has been earned from the core banking platform as of July 2026. The Series B proceeds ($180M) are
              expected to fund bank capitalization, technology development, regulatory completion, and international
              market expansion. Revenue recognition would begin only upon FDIC approval and first client onboarding.
