            body: >-
              Augustus's technology differentiation rests on five pillars: (1) OCC bank charter as a regulatory
              asset—the only form of IP that cannot be quickly replicated; obtaining an OCC charter took two years for
              Augustus and is not available to non-bank technology companies; (2) AI-native Marble platform vs. legacy
              core banking—if the AI-native claim holds, Marble would operate at materially lower cost and higher speed
