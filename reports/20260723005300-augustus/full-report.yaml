      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Rare OCC National Bank Charter Creates Durable Competitive Moat
            body: >-
              Receiving OCC conditional approval for a full-service national bank charter is one of the rarest
              regulatory achievements in fintech. This positions Augustus above middleware BaaS players (Synapse, Unit,
              Treasury Prime) and on par with Column Bank as a true bank-level infrastructure provider with direct
              Federal Reserve access — a moat that is extraordinarily difficult and time-consuming for competitors to
              replicate.
            calloutType: strength
            claimRefs:
