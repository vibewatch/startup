              Augustus is led by a 25-year-old CEO (Ferdinand Dabitz, Thiel Fellow, German national) who will become the
              youngest CEO of a federally chartered US national bank. Dabitz's regulatory and fundraising credentials
              are exceptional; his banking execution experience is limited—he has never managed a regulated US bank
              through an OCC examination, hired and organized a banking compliance team, or navigated the complexity of
              first-client onboarding under bank examination conditions. The President (Greg Quarles, former OCC
              examiner and Green Dot CEO) provides significant regulatory depth, but Quarles's execution track record at
