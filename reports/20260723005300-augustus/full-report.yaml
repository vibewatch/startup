              named; the engineering team leadership and size are undisclosed. For a company building an AI-native bank
              from scratch, having an unidentified technical leadership structure is a meaningful gap. Third, the runway
              and burn risk: with $180M in the Series B, Augustus must build a full regulatory-compliant bank, secure
              FDIC approval, hire a qualified banking team, build technology infrastructure, and onboard initial US
              clients—all before generating material US revenue. Prior rounds total ~$60M; the $180M Series B must fund
              operations through US launch. If FDIC approval is delayed 18+ months, and if burn is $5–10M/month for a
              company this stage, Augustus could face a Series C raise before US revenue begins. Finally, execution risk
              on the GENIUS Act stablecoin module: building OCC-compliant reserve management infrastructure for
              stablecoin issuers has never been done before; the regulatory, technical, and operational requirements are
