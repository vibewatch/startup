      - number: '1.4'
        title: Milestones and Regulatory Progress
        blocks:
          - type: paragraph
            body: >
              Augustus has achieved a compressed but significant milestone history since its 2022 founding. The company
              was incorporated under the name Ivy before rebranding to Augustus as it pursued a national bank charter
              strategy. A European regulated entity was established to enable euro clearing, which has processed
              billions in transaction volume, providing operational proof-of-concept before the US bank opens. The OCC
              conditional approval issued in May 2026 is the pivotal regulatory milestone: it authorizes Augustus Bank
              N.A. as a full-service national bank on a conditional basis, subject to pre-opening requirements that
              include FDIC deposit insurance approval and acquisition of Federal Reserve Bank stock. This conditional
              status is not a guarantee of final approval — the OCC retains authority to modify, suspend, or rescind
              conditional approvals at any time prior to final opening, representing a material binary risk for the
              company. The Series B capital raise announced July 21, 2026, came just two months after the OCC
              conditional approval, suggesting investor conviction that the pre-opening conditions are manageable.
              Augustus has publicly named Kraken as a flagship institutional client processed on its platform. As of
              July 23, 2026, Augustus has not yet obtained FDIC insurance or Federal Reserve Bank stock, meaning it is
              not yet legally open as a licensed US bank. The gap between conditional approval and full operational
              status is the company's most immediate strategic and reputational risk.
