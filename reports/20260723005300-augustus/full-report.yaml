      - number: '5.2'
        title: Technology Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Marble is described by Augustus as 'AI-native' to distinguish it from legacy core banking systems that are
              API wrappers around decades-old mainframe code (e.g., FIS Horizon, Fiserv DNA, Temenos T24). AI-native in
              Augustus's definition means three things: (1) AI used for real-time back-office operations—settlement
              confirmations, ledger reconciliation, and exception handling happen via AI agents rather than manual batch
              processing; (2) AI-powered compliance—transaction monitoring, sanctions screening, and AML pattern
              detection are ML-model–driven rather than rule-based; (3) 24/7/365 operations without maintenance
              windows—traditional core banking systems close nightly for batch jobs and are inaccessible 115+ days/year
              due to national holidays, scheduled downtime, and cut-off windows; Marble claims always-on availability.
              The architectural model follows a microservices pattern with a real-time event ledger at the center,
              payment rails as external adapters (SWIFT, ACH, SEPA, FedNow), and AI inference as an embedded layer for
              compliance and settlement decisions. Named virtual account architecture differs materially from FBO (For
              Benefit Of) pooled account models used by most sponsor-bank BaaS: each end-user has a unique account
              number, reducing reconciliation risk (the source of the Synapse shortfall) and enabling direct FDIC
              coverage mapping. The platform's stablecoin integration supports USDC, USDT, and planned GENIUS
              Act-compliant issuers; stablecoin settlement routes through the same ledger as fiat payments, enabling
              atomic cross-currency settlement. Augustus has not published technical architecture documentation or
              developer API reference publicly, limiting independent technical assessment.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
