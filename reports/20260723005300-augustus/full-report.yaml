  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              The banking-as-a-service market consists of four distinct competitive tiers. Tier 1 comprises nationally
              OCC-chartered, API-first banks: Column N.A. (operating since 2022 via Northern California National Bank
              conversion, US-focused) and Augustus (conditionally approved 2026, internationally focused). This is the
              rarest and most defensible position in BaaS. Tier 2 comprises state-chartered community banks that have
              built BaaS programs—Cross River Bank, Evolve Bank & Trust, Pathward Financial, Coastal Community Bank,
              NBKC Bank—with FDIC insurance and direct Fed access but state-level supervision and varying compliance
              sophistication. Tier 3 comprises non-bank technology platforms that access banking rails through
              sponsor-bank partnerships: Stripe Treasury (partners with Evolve and Goldman Sachs for US; Citibank for
              international), Unit Finance (partners with Blue Ridge Bank, Bancorp), Galileo Financial (SoFi-owned
              card/payments infrastructure), and Marqeta (card-issuance specialist). Tier 4 consists of incumbent
              traditional correspondent banks offering non-API, high-minimum USD banking: JPMorgan, Citibank, HSBC,
              Deutsche Bank. For Augustus's specific target—international fintechs needing US chartered bank
              infrastructure—the most relevant competitors are Column N.A. (same OCC charter, API-first, but
              US-focused), Cross River Bank (state-chartered but serves international fintechs like Wise), and Stripe
              Treasury (accessible but lacks FDIC-insured international USD accounts as a primary product). The 2024
              Synapse bankruptcy removed a once-major Tier 3 competitor and demonstrated the systemic vulnerability of
              multi-tier BaaS intermediation, creating a pull toward Tier 1 and Tier 2 providers.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
