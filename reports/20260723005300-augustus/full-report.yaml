              Account opening fees and monthly account maintenance fees; (2) Transaction fees on payment originations
              (ACH, SWIFT, SEPA, FedNow), typically $0.10–5.00 per transaction or 10–30 basis points of transfer value;
              (3) Net interest income on balances held by clients at Augustus (once FDIC-approved); (4) GENIUS Act
              compliance module subscription fee (SaaS) for stablecoin issuers. Estimated revenue per anchor enterprise
              client: $500K–$5M annually for a mid-size international neobank with 500K–5M users and meaningful USD
              transaction volumes. For a crypto exchange like Kraken, revenue would primarily be transaction-fee-based
              on wire volumes. Net interest income potential is more speculative but could be significant: if Augustus
              holds $1B in average client deposits at a 4–5% net interest margin, that generates $40–50M in NII annually
              without any transactions. The expansion path for each client is: (1) Launch with a single rail (e.g.,
              SWIFT); (2) Expand to additional rails (ACH, SEPA); (3) Migrate end-user accounts to named virtual
              accounts; (4) Expand geographically within the client's user base. This creates a natural expansion
              revenue motion. Customer durability depends on product reliability and compliance track record; there are
