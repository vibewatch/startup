  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Scope
        blocks:
          - type: paragraph
            body: >-
              Augustus competes in two intersecting markets: banking-as-a-service (BaaS) infrastructure and cross-border
              payments rails. BaaS encompasses the provision of licensed banking functionality—deposit accounts, payment
              rails, lending origination, regulatory compliance—through programmable APIs, enabling non-bank technology
              companies to embed financial services without holding their own bank charter. Cross-border payments
              infrastructure refers to the networks, protocols, and intermediary services that move value across
              currency and jurisdiction boundaries in real time or near-real time. The traditional delivery mechanism
              for both—the correspondent banking network—has been systematically contracting since 2011, with
              correspondent relationships declining by over 20% globally as of 2025 due to compliance costs, capital
              requirements, and poor returns. Augustus's Marble platform specifically targets the gap this contraction
              creates: international fintechs, neobanks, and payment companies that need USD accounts, ACH/SWIFT/SEPA
              access, and Federal Deposit Insurance Corporation (FDIC) deposit protection cannot access these rails
              directly without a US bank charter, a relationship with a sponsor bank, or BaaS intermediary. Augustus
              provides a third option: API-first access to an OCC-chartered US national bank they own and operate.
              Status-quo substitutes include sponsor-bank BaaS arrangements (Stripe Treasury, Unit, Column), direct
              relationships with US correspondent banks (expensive and access-restricted), or offshore USD accounts
              (lacking FDIC insurance and Fed payment rail access). Adjacent markets include embedded finance for US
              businesses, cross-border B2B payments, stablecoin clearing, and international digital asset custody.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
