              - CO022
              - CO033
          - type: callout
            title: 'OCC Conditional Approval Is Not Final: Charter Revocation Is Possible'
            body: >-
              The OCC conditional approval can be modified, suspended, or revoked at any time before the bank legally
              opens. Augustus must still obtain FDIC deposit insurance and Federal Reserve Bank stock — both processes
              that involve additional regulatory scrutiny. Any adverse finding during the pre-opening review could delay
              or prevent charter activation, creating a material binary risk for investors.
