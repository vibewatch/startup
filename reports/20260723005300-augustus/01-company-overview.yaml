callouts:
  - calloutType: "strength"
    title: "Rare OCC National Bank Charter Creates Durable Competitive Moat"
    body: "Receiving OCC conditional approval for a full-service national bank charter is one of the rarest regulatory achievements in fintech. This positions Augustus above middleware BaaS players (Synapse, Unit, Treasury Prime) and on par with Column Bank as a true bank-level infrastructure provider with direct Federal Reserve access — a moat that is extraordinarily difficult and time-consuming for competitors to replicate."
    claimRefs: [CO021, CO022, CO033]
  - calloutType: "risk"
    title: "OCC Conditional Approval Is Not Final: Charter Revocation Is Possible"
    body: "The OCC conditional approval can be modified, suspended, or revoked at any time before the bank legally opens. Augustus must still obtain FDIC deposit insurance and Federal Reserve Bank stock — both processes that involve additional regulatory scrutiny. Any adverse finding during the pre-opening review could delay or prevent charter activation, creating a material binary risk for investors."
    claimRefs: [CO022, CO027, CO028]
  - calloutType: "risk"
    title: "Key-Person Concentration in Two Executives"
    body: "Both CEO Ferdinand Dabitz and President Greg Quarles are essential: Dabitz for technical vision and investor narrative, Quarles for regulatory credibility and OCC relationships. The loss of either before full charter activation could materially impair regulatory progress and investor confidence, representing concentrated key-person risk unusual even for a startup at this stage."
    claimRefs: [CO007, CO008, CO009, CO010]

