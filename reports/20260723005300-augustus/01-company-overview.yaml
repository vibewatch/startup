company:
  name: "Augustus"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Augustus (dba Global Dollar Bank) is a Dallas-based, AI-native fintech founded in 2022 that received OCC conditional approval for a US national bank charter in May 2026 and raised a $180M Series B at a $1B valuation in July 2026. The company builds programmable banking infrastructure designed to give international fintechs and banks direct API access to US dollar accounts, SWIFT, ACH, SEPA, and stablecoin settlement rails through its proprietary Marble core banking platform."

sections:
  - id: "identity-and-business-model"
    title: "Identity and Business Model"
    body: >
      Augustus, legally operating as Augustus Bank N.A. and known externally as the Global Dollar Bank, is an API-first,
      AI-native financial infrastructure company founded in 2022 and formerly operating under the name Ivy. Headquartered
      in Dallas, Texas, the company is building a branchless federally chartered US national bank expressly designed to
      serve international fintechs, neobanks, digital asset exchanges, and financial institutions that require reliable,
      programmable access to US dollar accounts and payment rails. Augustus's core proposition is the elimination of the
      costly, opaque correspondent banking chain that historically forced international players to layer third-party
      intermediaries to access USD clearing. By combining a full OCC national bank charter — a rare regulatory designation —
      with a purpose-built AI-native core banking platform called Marble, Augustus positions itself as direct infrastructure
      rather than a middleware layer. The Marble platform supports SWIFT, ACH, SEPA, and stablecoin settlement natively,
      operating 24 hours a day, 365 days a year without the settlement windows that constrain legacy correspondent banks.
      Augustus also plans a wholly owned stablecoin subsidiary to handle reserves and stablecoin issuance, custody,
      conversion, and payment operations in compliance with the GENIUS Act. The company targets growth markets in Latin
      America, Southeast Asia, the Middle East, and Africa, where demand for reliable USD access is high and legacy
      correspondent banking coverage is expensive and fragile. Crypto exchange Kraken is a publicly named institutional
      client, providing early proof of the platform's real-world applicability.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO023, CO024, CO025, CO026, CO031]
    tableRefs: [TO001]
    figureRefs: [FO002]

  - id: "leadership-and-governance"
    title: "Leadership and Governance"
    body: >
      Augustus is led by a complementary team combining youthful technical ambition with deep regulatory and banking
      operational experience. Ferdinand Dabitz, co-founder and CEO, is a 25-year-old German Thiel Fellowship recipient
      who founded Augustus at age 21. Upon full OCC charter activation, Dabitz will become the youngest CEO of a federally
      chartered US bank in over 140 years, a milestone that underscores both the novelty of the institution and the
      concentration of key-person risk in a young first-time bank CEO. Alongside Dabitz, Greg Quarles serves as President,
      bringing deep institutional credibility through his prior tenures as CEO of Green Dot Bank, United Texas Bank, and
      H&R Block Bank, as well as 18 years as a commissioned National Bank Examiner and Assistant Deputy Comptroller at
      the OCC — the same regulator granting Augustus its charter. Joe Schenone holds the CFO role. The Quarles
      appointment is a strategic signal to regulators that Augustus has the operational DNA to manage a licensed bank,
      counterbalancing Dabitz's inexperience. Investor involvement from Tiger Global, QED Investors, and Hummingbird
      Ventures provides governance oversight from experienced fintech backers. The founding of Nubank, Ramp, Circle, and
      Deel founders as co-investors brings both strategic network effects and informal board-level mentorship, though
      detailed formal board composition has not been publicly disclosed. The key-person dependency on both Dabitz and
      Quarles represents a material governance risk: loss of either could materially impair regulatory relationships,
      product direction, and investor confidence.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO029, CO030]
    tableRefs: [TO002]
    figureRefs: []

  - id: "funding-and-capital-structure"
    title: "Funding History and Capital Structure"
    body: >
      Augustus has completed three funding rounds since its 2022 founding, raising a cumulative total of approximately
      $240 million in disclosed equity financing. The seed round of approximately $12 million was closed between 2022 and
      2023 to establish the initial product and team. A $48 million Series A was completed in 2024, enabling the company
      to advance its Marble platform and begin the OCC charter application process, with QED Investors and Hummingbird
      Ventures participating as lead or co-lead investors. The landmark Series B, announced July 21, 2026, raised
      $180 million at a post-money valuation of $1 billion, conferring unicorn status on the company. Tiger Global
      Management led the Series B, with continued participation from QED Investors and Hummingbird Ventures, and notable
      co-investment from founders of Nubank, Ramp, Circle, and Deel. The Valar Ventures and Creandum funds were also cited
      as participants in earlier rounds. Augustus's $1 billion valuation, achieved on disclosed revenue that has not
      been publicly quantified, implies a significant revenue multiple consistent with high-growth fintech infrastructure
      companies. No debt financing, credit facilities, or secondary share sales have been publicly reported. The capital
      is earmarked for geographic expansion across Latin America, Southeast Asia, the Middle East, and Africa, continued
      platform development, and satisfying the OCC's pre-opening capital requirements including minimum equity capitalization
      and Federal Reserve Bank stock acquisition. The lack of disclosed revenue or ARR creates an evidence gap in
      evaluating the implied valuation multiple.
    claimRefs: [CO012, CO013, CO014, CO015, CO016, CO017, CO018, CO019, CO020]
    tableRefs: [TO003]
    figureRefs: [FO003]

  - id: "milestones-and-regulatory-progress"
    title: "Milestones and Regulatory Progress"
    body: >
      Augustus has achieved a compressed but significant milestone history since its 2022 founding. The company was
      incorporated under the name Ivy before rebranding to Augustus as it pursued a national bank charter strategy.
      A European regulated entity was established to enable euro clearing, which has processed billions in transaction
      volume, providing operational proof-of-concept before the US bank opens. The OCC conditional approval issued in
      May 2026 is the pivotal regulatory milestone: it authorizes Augustus Bank N.A. as a full-service national bank
      on a conditional basis, subject to pre-opening requirements that include FDIC deposit insurance approval and
      acquisition of Federal Reserve Bank stock. This conditional status is not a guarantee of final approval — the
      OCC retains authority to modify, suspend, or rescind conditional approvals at any time prior to final opening,
      representing a material binary risk for the company. The Series B capital raise announced July 21, 2026, came
      just two months after the OCC conditional approval, suggesting investor conviction that the pre-opening conditions
      are manageable. Augustus has publicly named Kraken as a flagship institutional client processed on its platform.
      As of July 23, 2026, Augustus has not yet obtained FDIC insurance or Federal Reserve Bank stock, meaning it
      is not yet legally open as a licensed US bank. The gap between conditional approval and full operational
      status is the company's most immediate strategic and reputational risk.
    claimRefs: [CO021, CO022, CO027, CO028, CO032, CO033, CO034, CO035]
    tableRefs: [TO004]
    figureRefs: [FO001]

