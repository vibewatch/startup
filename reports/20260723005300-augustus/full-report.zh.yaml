      - number: '7.5'
        title: 风险缓释与终止标准
        blocks:
          - type: paragraph
            body: >-
              Augustus 最强的风险缓释是结构性的：OCC 条件性牌照本身就是最有力的早期风险缓释因素——它证明 Augustus 已经通过美国金融业最严格的监管测试之一，而且这是竞争对手无法快速复制的资产。累计
              $240M 融资提供了多年 runway，Tiger Global 参与也释放持续机构支持信号。其他缓释因素包括 Greg Quarles 深厚的 OCC 网络（18 年 OCC 检查员经历），这应会显著帮助
              FDIC 申请和检查流程。欧元清算已上线运营，证明技术可以在生产环境规模化运转；这降低了纯技术执行风险。本投资的终止标准包括：（1）FDIC 被拒或长期延迟（提交后超过 18
              个月）且没有清晰整改路径——这会消除美国收入模型；（2）Kraken OCC 牌照获批并导致客户退出，且 12 个月内没有替代客户落地——这会严重损害欧盟收入基础；（3）美国上线后出现重大 OCC
              检查问题（停止令或正式协议）并限制客户接入——这会让增长停滞并触发客户退出；（4）资本消耗到 runway <12 个月且没有明确新融资路径——这会产生资不抵债风险；（5）美国运营前 12
              个月发生网络安全事件或重大支付系统故障——这会在高度依赖信任的业务中永久损害品牌。风险调整后回报高度取决于 FDIC 批准时间，以及 Augustus 能否在上线后 12 个月内接入 3–5 个美国锚定客户。
