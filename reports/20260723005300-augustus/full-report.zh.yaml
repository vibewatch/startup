      - number: '8.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 有条件投资：OCC 牌照值得溢价
            body: 对一家收入前初创公司而言，$1B 估值偏激进；但如果公司拥有美国银行业最稀缺的监管资产之一，该估值可以辩护。适合拥有 5-7 年持有期和后续跟投能力的基金有条件投资；如果无法参与下一轮融资，应选择放弃。
            calloutType: recommendation
            claimRefs:
              - CV021
              - CV022
              - CV002
          - type: callout
            title: FDIC 批准是唯一真正重要的估值驱动因素
            body: 所有情景分析最终都收束到一点：FDIC 批准时间是主导估值的驱动因素。2027 年获批可以支撑 $1B。被拒或延迟到 2028 年之后，会让 $1B 估值很难辩护，并提高 down round 概率。
            calloutType: risk
            claimRefs:
              - CV013
              - CV014
          - type: callout
            title: 即使在悲观情景，牌照期权也创造收购价值
            body: 即使在悲观情景，OCC 条件性牌照对现有银行和全球支付网络也有战略收购价值。牌照可以在战略交易中出售或转让；这层底部价值创造不对称回报结构，降低但不能消除下行风险。
            calloutType: insight
            claimRefs:
              - CV002
              - CV003
          - type: callout
