      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >
              Augustus 的管理团队互补：一边是年轻的技术雄心，另一边是深厚的监管和银行运营经验。联合创始人兼 CEO Ferdinand Dabitz 是 25 岁的德国籍 Thiel Fellowship
              获得者，21 岁创办 Augustus。OCC 牌照完全激活后，Dabitz 将成为 140 多年来美国联邦特许银行最年轻的 CEO；这个里程碑既凸显机构的新意，也暴露年轻首次任职银行 CEO
              带来的关键人物风险。Dabitz 身边，总裁 Greg Quarles 提供制度信誉：他曾任 Green Dot Bank、United Texas Bank 和 H&R Block Bank 的 CEO，也在
              OCC 担任过 18 年受委任 National Bank Examiner 和 Assistant Deputy Comptroller——正是同一家监管机构授予 Augustus 牌照。Joe
              Schenone 担任 CFO。Quarles 的加入向监管层释放一个战略信号：Augustus 具备经营持牌银行的运营基因，可以对冲 Dabitz 经验不足的问题。Tiger Global、QED
              Investors 和 Hummingbird Ventures 等投资者提供来自资深金融科技支持方的治理监督。Nubank、Ramp、Circle 和 Deel
              创始人作为共同投资者，带来战略网络效应和非正式董事会层面的辅导，但正式董事会构成细节尚未公开披露。Dabitz 和 Quarles
              两人都构成关键人物依赖；任一人离开，都可能实质损害监管关系、产品方向和投资者信心。
