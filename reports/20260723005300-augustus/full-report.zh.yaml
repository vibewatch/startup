chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >
              Augustus 的法定运营主体为 Augustus Bank N.A.，对外称 Global Dollar Bank。公司成立于 2022 年，曾以 Ivy 名义运营，是一家 API 优先、AI
              原生的金融基础设施公司。公司总部位于 Texas 州
              Dallas，在打造一家无网点、获联邦特许的美国全国性银行，专门服务需要稳定、可编程接入美元账户和支付网络的国际金融科技公司、新银行、数字资产交易所和金融机构。Augustus
              的核心主张，是去掉成本高、链条不透明的代理行体系；过去，国际机构想接入 USD 清算，往往只能叠加第三方中介。公司把完整 OCC 全国性银行牌照这一稀缺监管资质，与专门打造的 AI 原生核心银行平台 Marble
              结合起来，把自己定位成直接基础设施，而不是中间件层。Marble 平台原生支持 SWIFT、ACH、SEPA 和稳定币结算，全年 365 天、每天 24 小时运行，不受传统代理行结算窗口限制。Augustus
              还计划设立一家全资稳定币子公司，在 GENIUS Act 合规框架下处理储备、稳定币发行、托管、兑换和支付运营。公司瞄准拉丁美洲、东南亚、中东和非洲等增长市场；这些地区对稳定 USD
              接入需求强，但传统代理行覆盖昂贵且脆弱。加密货币交易所 Kraken 是公开点名的机构客户，为平台的真实场景可用性提供了早期证明。
