      - number: '6.3'
        title: 客户获取、集中度风险与不利因素
        blocks:
          - type: paragraph
            body: >-
              Augustus 的客户获取是企业直销：公司由 Goldman Sachs、JPMorgan 和 OCC 前从业者组成的团队，面向中大型国际 fintech
              的合规、资金和支付团队销售。没有明显的自助式或产品驱动增长路径。OCC 牌照是主要获客差异点——它让 Augustus 能提供受监管的替代方案，取代国际 fintech
              过去依赖的非正式代理行关系。现阶段客户集中度风险极高。公开确认客户只有 Kraken 一家，Augustus 当前欧盟收入完全依赖 Kraken 关系。如果 Kraken 流失——无论是 Kraken 取得自己的
              OCC 牌照（Payward 2024 年已提交 OCC 申请）、改用其他代理行，还是减少欧盟欧元交易量——Augustus 当前运营收入都会受到重大损害。即便客户基础更成熟，也存在更广泛的集中度风险：「国际
              fintech」客群由少数大型平台主导（Nubank、Revolut、Grab），单个合同可能贡献总收入的 10–25%；上线后若失去一个锚定客户，将造成高度扰动。Augustus
              的不利客户风险还包括：（1）监管风险——客户对银行合作伙伴的监管状态敏感；OCC 若对 Augustus 采取执法行动，可能触发客户退出；（2）切换成本不清——API 原生银行集成确实带来一定锁定，但支付
              rails 已商品化，客户投入 3–6 个月工程资源即可更换供应商；（3）管线质量——管理层称有数百家 fintech 感兴趣，但未发布意向书、合同或已签客户数量。完整的美国客户管线无法通过公开来源验证。
