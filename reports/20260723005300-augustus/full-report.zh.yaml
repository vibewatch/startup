      - number: '1.4'
        title: 里程碑与监管进展
        blocks:
          - type: paragraph
            body: >
              Augustus 自 2022 年创立以来，里程碑节奏压缩但分量不轻。公司最初以 Ivy 名义注册，随后在推进全国性银行牌照战略时更名为
              Augustus。公司设立了一个欧洲受监管实体以支持欧元清算，并已处理数十亿美元交易量，在美国银行开业前给出运营层面的概念验证。2026 年 5 月 OCC
              发出的条件性批准，是关键监管里程碑：它在附带条件的基础上授权 Augustus Bank N.A. 成为全服务全国性银行，开业前要求包括获得 FDIC 存款保险批准和购买 Federal Reserve Bank
              股份。条件性状态并不等于最终批准——在最终开业前，OCC 可随时修改、暂停或撤销条件性批准，这给公司带来实质性的二元风险。2026 年 7 月 21 日公布的 Series B 融资发生在 OCC
              条件性批准仅两个月后，说明投资者相信开业前条件可以处理。Augustus 已公开将 Kraken 列为平台上的旗舰机构客户。截至 2026 年 7 月 23 日，Augustus 尚未取得 FDIC 保险或
              Federal Reserve Bank 股份，也就是说，在法律上还不是已经开业的持牌美国银行。条件性批准与全面运营状态之间的缺口，是公司眼下最直接的战略和声誉风险。
