      - number: '6.5'
        title: 客户流失风险与竞争动态
        blocks:
          - type: paragraph
            body: >-
              Augustus 的客户尚未被锁定——尤其是 Kraken 正在积极申请自己的 OCC 银行牌照（Payward 2024 年已提交申请），一旦获批，Augustus 对其美元需求将变得多余。如果
              Payward/Kraken 获得自己的 OCC 牌照，就会消除其对 Augustus 作为银行合作伙伴的需求。这是近期最重大的单一客户风险。更广泛地看，BaaS 和代理行市场竞争激烈：Column N.A.
              是面向美国基础设施客户的最直接竞争对手（聚焦美国但正在扩张），Cross River 瞄准美国本土嵌入式金融，JP Morgan 的全球支付基础设施服务许多同类国际 fintech
              客户，成本更高，但规模和品牌可信度强得多。国际 fintech 从代理行关系切换到 Augustus，需要重新完成合规认证、技术集成（3–6 个月）和余额迁移——门槛中等，但并非不可逾越。如果 Augustus
              美国产品上线延迟到 2027 年之后，押注美国机会的客户可能选择替代方案（Column、Cross River）或自建。GENIUS Act 稳定币托管细分市场最具防守性：如果 Augustus 作为 OCC
              持牌 GENIUS Act 托管人较早进入市场，切换成本会大幅上升（监管批准、储备管理审计轨迹），先发优势可能带来显著的长期客户粘性。不过，截至 2026 年 7 月，该细分市场尚未商业化存在。
