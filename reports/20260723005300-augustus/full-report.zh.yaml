      - number: '7.3'
        title: 合作方、依赖与交易对手风险
        blocks:
          - type: paragraph
            body: >-
              Augustus 在多个方向存在重大依赖风险。最尖锐的是 Kraken 依赖：Kraken（Payward Inc.）是唯一公开确认客户，基本代表全部已披露欧盟收入。Kraken 自己的 OCC
              银行牌照申请（2024 年提交）带来自我去中介化风险：如果 Kraken 获得 OCC 牌照，就不再需要 Augustus 提供美元银行基础设施。此外，Kraken
              历史上受到过监管审查（因作为未注册证券交易所运营而与 SEC 和解；DOJ 调查）；任何针对 Kraken 的监管行动都可能压低其通过 Augustus 的运营、交易量和支付。第二项依赖风险是领投方 Tiger
              Global：Tiger Global 历史上激进的投资节奏，加上其组合表现挑战（2021–2022 周期净亏损），如果 Tiger Global 需要降低组合敞口，就会形成集中度风险；虽然 Series B
              投资者通常有强合同保护，但 Tiger Global 的重大流动性事件可能向其他投资者传递担忧信号。第三，Augustus 依赖受监管的第三方支付 rail 基础设施：SWIFT 会员资格要求持续遵守 SWIFT
              规则；FedNow 接入要求 Federal Reserve 会员资格；ACH 要求 NACHA 会员资格。任何会员资格若因不合规被撤销或暂停，都会扰乱支付能力。第四，云基础设施依赖：如果 Augustus
              的主云提供商（假定为 AWS/GCP）在特定区域发生故障，Augustus 的 24/7 承诺就会失效。2022 年，AWS us-east-1 多次发生重大故障，影响数百家 fintech
              公司；Augustus 的 SLA 会面临风险。
