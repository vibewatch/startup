  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图概览
        blocks:
          - type: paragraph
            body: >-
              银行即服务市场可以分成四个清晰层级。第一层是获 OCC 全国性特许、API 优先的银行：Column N.A.（2022 年起借 Northern California National Bank
              转换运营，聚焦美国）和 Augustus（2026 年获条件性批准，聚焦国际）。这是 BaaS 中最稀缺、也最可防守的位置。第二层是已经搭建 BaaS 项目的州特许社区银行——Cross River
              Bank、Evolve Bank & Trust、Pathward Financial、Coastal Community Bank、NBKC Bank——具备 FDIC 保险和直接 Fed
              接入，但接受州级监管，合规成熟度不一。第三层是非银行技术平台，借赞助银行合作接入银行网络：Stripe Treasury（美国合作方为 Evolve 和 Goldman Sachs，国际合作方为
              Citibank）、Unit Finance（合作方 Blue Ridge Bank、Bancorp）、Galileo Financial（SoFi 旗下卡和支付基础设施）和
              Marqeta（发卡专家）。第四层是传统代理行巨头，提供非 API、高最低门槛的 USD 银行业务：JPMorgan、Citibank、HSBC、Deutsche Bank。围绕 Augustus
              的具体目标——需要美国特许银行基础设施的国际金融科技公司——最相关的竞争者是 Column N.A.（同样 OCC 牌照、API 优先，但聚焦美国）、Cross River Bank（州特许，但服务 Wise
              等国际金融科技公司）和 Stripe Treasury（易接入，但 FDIC 保险国际 USD 账户不是其主产品）。2024 年 Synapse 破产清除了一个曾经重要的第三层竞争者，也暴露多层 BaaS
              中介体系的系统性脆弱，推动需求流向第一层和第二层提供方。
