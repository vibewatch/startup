      - number: '4.5'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              Augustus 是一家高可选性、高风险、尚未产生收入的银行初创公司。截至 2026 年 7 月，其财务位置完全立在三根支柱上：（1）$240M 资本，其中相当一部分预留为银行监管资本；（2）一张 OCC
              条件性牌照，一旦取得 FDIC 保险，就会转化为真正能产生收入的资产；（3）一个市场论题——国际金融科技公司的 USD 银行接入——有结构性顺风（GENIUS
              Act、代理行减少）支撑，但没有公开披露的客户管线或合同数据验证。$1B 估值意味着投资者正在为成功结局定价：FDIC 批准、首个锚定客户收入，以及 3–5 年内走向 Column 可比财务表现（$200M+
              收入、盈利）。在这些假设下，估值可以辩护，但偏激进：Column N.A. 用约 $145M 股权基础做到 $200M 收入；Augustus 需要用 $240M
              融资完成同样成绩，还要承受银行监管资本约束的额外拖累。负面财务情景同样可信：FDIC 批准耗时 18+ 个月，首笔收入延后，有效运营跑道（扣除监管资本后估计
              $90–140M）在没有锚定客户转化前被耗尽，迫使公司接受稀释性下行轮 或资本重组。投资者在承诺前必须拿到：审计财务预测、管理层资本分配模型（监管资本 vs. 运营预算），以及律师提供的详细 FDIC
              批准时间表。
