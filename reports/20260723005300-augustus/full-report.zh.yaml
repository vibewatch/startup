      - number: '3.2'
        title: 直接竞争者画像
        blocks:
          - type: paragraph
            body: >-
              Column N.A. 是与 Augustus 最相近的直接竞争者：一家 OCC 特许、API 优先的银行，服务金融科技基础设施客户，提供对 FDIC 保险账户、ACH、FedNow、RTP、SWIFT
              和发卡的程序化接入。Column 由 Plaid 联合创始人 William 和 Annie Hockey 在 2022 年借 Northern California National Bank
              转换创立，100% 由创始人持有，没有外部风险投资者。截至 2026 年，Column 的财务表现非常出色：公开净收入从 $100M（2024 年）翻倍至 $200M（2025 年）；2026 年 Q1
              总资产达到 $1.38B，年初至今净利润 $23.2M。Column 客户包括 Brex、Mercury、Plaid、Carta 和 Ramp，全部是美国注册金融科技公司。Column
              并未公开把国际金融科技接入作为产品重点，这构成它与 Augustus 的核心差异。Cross River Bank 是最重要的第二层竞争者：一家 2008 年成立、受州特许并具 FDIC 保险的银行，资产
              $8.7B，2025 年收入 $517M，估值 $3B。投资者包括 Andreessen Horowitz（a16z）和 KKR。Cross River 服务
              Wise（TransferWise）、Coinbase 和 Affirm 等国际客户，因此是有国际支付场景金融科技公司的最相关成熟替代方案。Stripe Treasury
              是第三层主导玩家，靠赞助银行模式处理数万亿美元支付；它提供多币种账户和嵌入式金融，但本身不是特许银行。Galileo Financial Technologies 被 SoFi 以 $1.2B 收购，为
              Robinhood、Chime 等处理卡和支付，但重心是美国国内发卡，而不是全球 USD 银行接入。
