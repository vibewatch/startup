            body: >-
              当前部署状态：Augustus 的欧洲实体截至 2025–2026 年已上线欧元清算，证明其至少在一个司法辖区具备跨境支付能力。美国银行产品 （Marble US）尚未运营，需在 OCC 条件性牌照（2026 年
              5 月）之后取得 FDIC 保险批准。美国部署路线图分三阶段：（1）FDIC 批准并上线——预计在 OCC 条件性批准（2026 年 5 月）后 6–18 个月内完成；（2）接入美国锚定客户——为 Kraken
              及新的国际 fintech 等首批客户提供 API 集成和沙盒环境；（3）上线稳定币子公司——计划设立符合 GENIUS Act 的子公司，管理稳定币储备。集成路径以 API 为先：客户使用 REST
              API，并采用标准 OAuth/JWT 认证。公司称 API 覆盖实名账户开立、付款发起、对账单拉取和合规 webhook
              通知。暂未发现公开开发者文档，但公司用「由代码构成的银行」定位自己，突出开发者体验。可靠性承诺：公司声称 24/7/365 持续可用且没有维护窗口；若兑现，将比传统代理行 SLA
              明显升级。公开渠道没有独立可靠性数据或 uptime 指标。支持模式：企业级，锚定客户大概率配备专属客户经理。路线图的关键路径是 FDIC 批准流程，这是美国收入生成的唯一门槛事件。
