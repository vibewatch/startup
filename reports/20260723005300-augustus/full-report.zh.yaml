            title: AI 原生说法未经验证；没有独立技术基准
            body: >-
              Augustus 的核心技术差异化——AI 原生、24/7、无维护窗口——完全来自公司自述，尚未经过独立验证。没有公开的基准数据、uptime 记录、SLA
              文件或第三方技术评估。美国产品尚未运营，只有上线后才能验证。
            calloutType: risk
            claimRefs:
              - CE010
              - CE011
              - CE013
          - type: callout
            title: 稳定币交易量足以支撑对可编程货币的技术投入
            body: >-
              稳定币 2025 年处理 $33 trillion 交易量——超过 Visa 和 Mastercard 合计——市值约 $310-318 billion。即使稳定币清算的具体收入模型尚未定稿，这也验证了
              Augustus 对可编程货币基础设施的押注：清算机会足够大，且仍在增长。
