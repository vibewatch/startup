      - number: '3.3'
        title: 能力与定价对比
        blocks:
          - type: paragraph
            body: >-
              从核心能力看，Column N.A. 和 Augustus 最相似：两者都提供 OCC 特许、API 优先的银行能力，具备 FDIC 保险账户、SWIFT/ACH/FedNow 接入和 24/7
              运营。Augustus 还声称具备 SEPA 连接、稳定币结算和符合 GENIUS Act 的框架，反映其国际化重点。Column 的能力更成熟（已运营 4 年，而 Augustus
              尚未正式运营），但其公开产品范围不包括 SEPA 或稳定币清算。Cross River 规模更大（资产 $8.7B，而 Column 为 $1.38B），也有国际客户证明，但它是州特许银行，缺少 OCC
              全国性银行背书和直接 OCC 检查覆盖。Stripe Treasury 对开发者最友好——沙盒上线快、文档完整——但没有自有银行牌照，并带有赞助银行集中风险。BaaS
              提供方的定价通常保密，并按交易谈判。Column 未公布定价。Cross River 未公布定价。Stripe 的嵌入式金融定价打包进 Stripe 整体交易费（每笔约 0.3–0.5%）。Unit
              Finance 据称收取 $500–$2,000/月平台费，另加逐笔交易费。Augustus 定价未公开；考虑到其高端 OCC 牌照定位，分析师估计锚定客户合同额在每年 $500K–$2M 以上，与 Column
              已知 Brex 和 Mercury 交易规模一致。信任和监管姿态是关键差异：Augustus（等待 FDIC 批准）和 Column（自 2022 年起具 FDIC 保险）都接受 OCC
              监督，这是最严格的联邦银行监管。Cross River 具 FDIC 保险并受州监管。Stripe Treasury 在多数司法辖区按货币转移机构受监管，而不是作为银行受监管。对合规敏感买方而言，尤其在
              Synapse 之后，这种监管差异很重要。
