  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与收入来源
        blocks:
          - type: paragraph
            body: >-
              Augustus 的收入模式围绕五条主要来源设计：（1）平台和 API 接入费——向客户金融科技公司和银行收取年度基础设施订阅费，用于接入 Marble 驱动的银行平台；参考 Column 和 Cross
              River 可比合同规模，锚定客户每年估计 $500K–$2M；（2）交易费——按笔收取支付处理费用（估计 ACH 每笔 $0.01–$0.05，SWIFT 电汇每笔 $10–$25，SEPA 转账每笔
              $0.01–$0.02）；（3）浮存金收入——在 Federal Reserve 维持的 FDIC 保险客户存款余额产生净利息（收入 = 存款基数 × Fed Funds Rate，目前约
              5.25%）；（4）FX 兑换点差——跨币种交易估计 0.25–0.50% 利差；（5）稳定币储备管理费——Augustus 符合 GENIUS Act 的稳定币子公司投入运营后形成的未来收入流。Augustus
              未公开披露任何收入、ARR 或财务预测。本章所有估计均由分析师基于行业基准和可比公司数据构建。公司尚未运营：它只有一张 OCC 条件性牌照，尚未取得 FDIC 保险批准，而后者是吸收存款的前置条件。因此，截至
              2026 年 7 月，核心银行平台尚未产生收入。Series B 募得的 $180M 预计用于银行资本金、技术开发、完成监管流程和国际市场扩张。只有在 FDIC 批准并完成首批客户上线后，收入确认才会开始。
