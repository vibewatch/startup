      - number: '8.4'
        title: 投资正反论点
        blocks:
          - type: paragraph
            body: >-
              Augustus 的投资正向论点有四根支柱。第一，OCC 条件性牌照是真正稀缺的监管资产——是竞争对手无法快速复制的真实进入壁垒。该牌照花了 3
              年和非常强的监管关系才取得；其价值显著高于今天从零构建的成本。第二，需求是结构性而非周期性：国际 fintech 服务的 135+ million 未充分银行服务客户，无法通过代理行获得足够美元接入；全球
              fintech 扩张会继续推高这条长期趋势。第三，创始团队的监管资本（Ferdinand Dabitz 的 Thiel Fellowship 关系、Greg Quarles 在 OCC 的 18
              年经历）确实差异化，且难以复制。第四，GENIUS Act 创造了一层新的监管需求，Augustus 被明确定位为唯一获批可规模化服务稳定币储备管理的 OCC 持牌银行。反向论点也有四根支柱。第一，FDIC
              时间线不可知，而且是单一阻塞依赖：一次 FDIC 拒绝或重大延迟就会击穿投资逻辑。第二，CEO 年仅 25 岁且没有银行执行经验；Dabitz
              的年轻可能在银行运营、合规文化或危机管理上造成盲点，这一风险是真实的。第三，Kraken 自我去中介化风险意味着唯一已确认收入来源可能在 2–4 年维度消失。第四，零美国收入对应 $1B
              估值，没有安全边际；任何执行失误——技术失败、监管挫折、关键人离职——都会在 down round 中触发显著估值压缩。综合看，正向论点赢在结构强度，反向论点赢在近期执行不确定性。
            claimRefs:
