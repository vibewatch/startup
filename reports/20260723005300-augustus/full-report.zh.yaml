      - number: '5.5'
        title: 信任、安全、安保与合规控制
        blocks:
          - type: paragraph
            body: >-
              作为获得 OCC 条件性批准的国家银行，Augustus 处在美国银行监管的最高层级。OCC 会对国家银行开展年度安全与稳健性检查；Augustus 开始运营后也将接受 OCC 检查。Marble
              内嵌的合规控制包括：（1）AML/CFT——用行为 ML 模型驱动的 AI 交易监控来发现可疑活动；（2）KYC/KYB——开户时自动执行客户尽调流程；（3）OFAC
              制裁筛查——实时检查支付交易对手；（4）FDIC 存款保险（待批）——FDIC 批准后，客户存放在 Augustus 的存款将按每个存款人最高 $250K 获得 FDIC 保险；实名虚拟账户架构可把 FDIC
              覆盖直接映射到每个终端用户；（5）SOC 2 Type II（推定已规划）——企业客户需要 SOC 2 证明；Augustus 未公开披露审计状态；（6）GENIUS Act
              合规——为稳定币发行方规划的模块，要求由 OCC 持牌机构管理储备。安全架构：作为 API 优先、云原生的银行，Augustus 大概率运行在 AWS 或 GCP
              上，并采用金融级标准安全措施（静态和传输加密、HSM 密钥管理、多区域故障切换）。没有公开的安全审计结果或 SOC 2 报告。近期最重要的合规风险是 FDIC 批准流程：FDIC
              保险是吸收受保存款的前提，任何延迟都会增加运营和财务风险。上线后，OCC 将开展周期性检查；若发现不合规，可能要求整改和资本行动，其他 OCC 持牌 fintech 已出现过类似情形。
