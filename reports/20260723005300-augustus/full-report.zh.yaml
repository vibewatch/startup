      - number: '4.2'
        title: GTM 动作与单位经济
        blocks:
          - type: paragraph
            body: >-
              Augustus 用直接企业销售模式瞄准企业级金融科技和银行客户。OCC 特许 BaaS 高度受监管且对合规敏感，预期销售周期为 6–18 个月；这与买方需要完成 FDIC、AML
              和合规尽调的金融基础设施交易一致。获客成本估计为每个锚定客户 $50,000–$200,000，反映小规模高级销售团队的高薪酬，以及法务和合规支持成本。锚定客户的生命周期价值——每年 $500K–$2M
              的多年合同——按 5–10 年合同期估计为 $2.5M–$20M。隐含 LTV/CAC 比率为 12:1 到 100:1，符合高价值企业基础设施业务。关键 GTM
              渠道经济：直接销售和商务拓展是主要渠道，因为客户群（持牌国际金融科技公司和银行）集中（估计 800–1,200 个目标潜在客户），决策也自上而下（CFO/资金部门，而不是开发者主导）。次级的开发者主导渠道（API
              沙盒上线）可能缩短技术评估周期，但商业成交仍是企业级。由于公司尚未产生收入，销售效率代理指标不可得。可比基准显示：Column N.A. 的客户名单（Brex、Mercury、Plaid、Carta）说明
              $50M–$200M ARR 区间的锚定客户可以贡献每年 $5M–$15M 平台费；Cross River Bank 证明，单个大型 BaaS 客户（Wise、Coinbase）可代表 $50M–$100M
              年收入。Augustus 的 TAM 集中在国际金融科技公司，意味着客户数量更少，但单客可能更大、更黏。竞争章节提到的多归属动态也会限制 TAM 捕获率。
