  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与范围
        blocks:
          - type: paragraph
            body: >-
              Augustus 同时竞争于两个交叉市场：银行即服务（BaaS）基础设施和跨境支付网络。BaaS 指用可编程 API
              提供持牌银行能力——存款账户、支付网络、贷款发起、监管合规——让非银行科技公司无需自持银行牌照也能嵌入金融服务。跨境支付基础设施指网络、协议和中介服务，负责实时或近实时地跨货币、跨司法辖区转移价值。两者传统交付机制都是代理行网络；自
              2011 年以来，代理行关系系统性收缩。到 2025 年，全球代理行关系减少超过 20%，原因包括合规成本、资本要求和回报偏低。Augustus 的 Marble
              平台正是瞄准收缩制造的缺口：国际金融科技公司、新银行和支付公司需要 USD 账户、ACH/SWIFT/SEPA 接入和 Federal Deposit Insurance Corporation（FDIC）
              存款保护，但没有美国银行牌照、赞助银行关系或 BaaS 中介，就无法直接接入这些网络。Augustus 提供第三条路：用 API 优先的方式接入一家由其拥有并运营、获 OCC
              特许的美国全国性银行。现有替代方案包括赞助银行型 BaaS 安排（Stripe Treasury、Unit、Column）、与美国代理行建立直接关系（昂贵且准入受限），或使用离岸 USD 账户（缺少 FDIC
              保险和 Fed 支付网络接入）。相邻市场包括面向美国企业的嵌入式金融、跨境 B2B 支付、稳定币清算和国际数字资产托管。
