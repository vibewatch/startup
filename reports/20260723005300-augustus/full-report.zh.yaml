      - number: '8.5'
        title: 最终建议与尽调要求
        blocks:
          - type: paragraph
            body: >-
              我们的建议是有条件投资，适合具备 5-7 年持有期、并能参与后续融资的大型成长 / VC 基金。OCC 牌照是真正稀缺的监管资产，美元银行接入的结构性需求长期存在，累计 $240M 资本也足以支撑公司抵达
              FDIC 批准里程碑。不过，最终承诺投资前，必须满意解决以下尽调问题：（1）确认 FDIC 申请状态——申请是否已提交、处于什么阶段、FDIC 是否提出任何关切？这是最关键的尽调项；（2）与律师完整审阅 OCC
              开业前条件清单，评估完成时间线；（3）确认管理层深度——CTO 身份、工程团队规模、BSA/AML 负责人资质；（4）技术尽调——由第三方测试 Marble 平台的 uptime、安全性和 AI
              合规准确率；（5）财务模型审阅——月 burn、24 个月 runway 模型和 FDIC 时间线敏感性分析；（6）审阅 Kraken 商业协议——期限、排他性、最低交易量和终止通知条款。按当前 $1B
              估值，大型机构投资者的风险调整后预期回报略为正（估算基准情景 1.5-2x），乐观情景有实质上行（3-5x）。没有能力参与后续轮次的小型基金应谨慎——该工具比典型成长阶段投资更二元，也需要显著的 pro-rata
              跟投来保留期权。
