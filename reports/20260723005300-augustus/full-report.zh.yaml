      - number: '6.2'
        title: 已确认客户基础与当前采用情况
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 7 月，Augustus 有一个公开确认的客户：Kraken（Payward Inc.），这是全球最大的加密货币交易所之一，年现货交易量 $3–5B。Kraken 使用 Augustus
              的欧洲实体进行欧元清算，通过受监管的芬兰实体每年处理数十亿欧元。这是已上线的生产收入，不是试点。该关系最早在 Augustus Series B 新闻稿（2026 年 7 月 21 日）中披露；Augustus
              自己的新闻材料把 Kraken 的使用描述为「市场领导者」采用。除 Kraken 外，Augustus 还以泛称提到其他客户（「为市场领导者处理数十亿规模」），但没有公开点名。Chainwire Series B
              公告称，公司「如今正在为 Kraken 等市场领导者处理数十亿规模」。「Kraken 等」暗示可能还有类似画像的客户，但未获公开确认。另有两家公司被提到对 Augustus
              的银行基础设施表达兴趣或推进需求：Circle 和 Ripple，依据是围绕 GENIUS Act 取向 fintech 银行基础设施需求的公开语境。这些并非已确认客户。Augustus 管理层称，FDIC
              批准流程将解锁首批美元产品客户；美国客户管线未公开，但 Ferdinand Dabitz 称有「数百家国际 fintech」希望获得美元银行接入。欧盟业务代表概念验证；Kraken
              作为标杆参考客户，对企业销售是强验证，因为 Kraken 是机构加密领域的知名品牌，对其他潜在客户也有声誉背书。
