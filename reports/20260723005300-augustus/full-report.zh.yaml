      - number: '2.2'
        title: 市场规模与增长路径
        blocks:
          - type: paragraph
            body: >-
              多家独立研究机构将 2026 年全球 BaaS 市场规模放在 $29B–48B，复合年增长率则因范围和方法不同落在 11–27%。Grand Master Insights（GM Insights） 估计
              2026 年为 $34.06B，到 2035 年增至 $183B（CAGR 约 20%）；Mordor Intelligence 将 2026 年规模定为 $28.9B，并预计到 2031 年 CAGR 为
              17%；intelmarketresearch 采用更宽的平台定义，估计为 $48.12B。跨境支付市场明显更大。Grand View Research 估计 2026 年服务收入为
              $193.5B；Fortune Business Insights 按更宽口径（包含 FX 点差）估计为 $397B；Juniper Research 预计到 2027 年跨境交易总额达到
              $250T。共同增长驱动包括：ISO 20022 采用、实时支付网络互联（UPI↔PayNow）、G20 支付政策要求，以及国际电商爆发（增速比国内电商快 28.3%）。Augustus
              眼下可服务市场——寻求美国特许银行接入的国际金融科技公司——是全球 BaaS 的一个子集。截至 2026 年初，美国以外约有 12,000 家持牌金融科技公司；保守估计其中 15–20%
              需要或主动寻找美元银行基础设施，按当前定价推算，年基础设施费 SAM 约 $2–4B。OCC 特许 BaaS 相对于赞助银行 BaaS 的具体市场仍处早期，但由于具备监管级合规和直接 Fed
              接入，可能享有溢价定价。
