      - number: '6.4'
        title: 客户生命周期经济性与扩张
        blocks:
          - type: paragraph
            body: >-
              Augustus 未公开披露收入模型、定价或单位经济性。参考可比银行基础设施平台（Column N.A.、Stripe Treasury、Cross
              River），可能的模型是：（1）开户费和月度账户维护费；（2）支付发起交易费（ACH、SWIFT、SEPA、FedNow），通常为每笔 $0.10–5.00，或转账金额的 10–30 个基点；（3）客户存放在
              Augustus 的余额产生净利息收入（FDIC 批准后）；（4）面向稳定币发行方的 GENIUS Act 合规模块订阅费（SaaS）。估算每个锚定企业客户年收入：一家拥有 500K–5M
              用户且美元交易量可观的中型国际 neobank，约 $500K–$5M。对于 Kraken 这类加密交易所，收入将主要来自电汇量对应的交易费。净利息收入潜力更具假设性，但可能相当可观：如果 Augustus 持有
              $1B 平均客户存款，并取得 4–5% 净息差，每年可产生 $40–50M NII，不依赖任何交易。每个客户的扩张路径是：（1）从单一 rail 启动（如 SWIFT）；（2）扩展到更多
              rails（ACH、SEPA）；（3）把终端用户账户迁移到实名虚拟账户；（4）在客户用户基础内做地域扩张。这形成自然的扩张收入路径。客户耐久性取决于产品可靠性和合规记录；公开渠道没有流失率、续约率或净收入留存数据点。
