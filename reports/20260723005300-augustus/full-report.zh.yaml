      - number: '5.2'
        title: 技术架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              Augustus 将 Marble 称为「AI 原生」，以区别于传统核心银行系统；后者本质上是在几十年前的大型机代码外面包一层 API（如 FIS Horizon、Fiserv DNA、Temenos
              T24）。按 Augustus 的定义，AI 原生包含三件事：（1）AI 用于实时后台运营——结算确认、账本对账和异常处理由 AI agent 完成，而不是人工批处理；（2）AI 驱动合规——交易监控、制裁筛查和
              AML 模式识别由 ML 模型驱动，而不是规则引擎；（3）24/7/365 运营且无维护窗口——传统核心银行系统每天夜间关闭跑批，且受国家假日、计划停机和截止时间影响，每年 115+ 天不可访问；Marble
              声称始终在线。架构模型采用微服务模式，以实时事件账本为中心，支付网络作为外部适配器（SWIFT、ACH、SEPA、FedNow），AI 推理作为嵌入层处理合规和结算决策。具名虚拟账户架构与多数赞助银行 BaaS
              采用的 FBO（For Benefit Of）资金池账户模型有实质差异：每个终端用户拥有唯一账号，降低对账风险（Synapse 资金缺口的来源），也能直接映射 FDIC 覆盖。平台的稳定币集成支持
              USDC、USDT 以及计划中的 GENIUS Act 合规发行人；稳定币结算与法币支付走同一账本，实现原子化跨币种结算。Augustus 没有公开发布技术架构文档或开发者 API 参考，限制了独立技术评估。
