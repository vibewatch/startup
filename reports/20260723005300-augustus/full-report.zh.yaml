      - number: '2.3'
        title: 买方分层与需求驱动
        blocks:
          - type: paragraph
            body: >-
              Augustus
              的目标买方不是零售端，而是机构和平台级客户。主要客群包括：（1）寻求进入美国市场的国际金融科技公司和新银行——拉丁美洲、东南亚、中东—北非和撒哈拉以南非洲的区域新银行，服务数百万零售或中小企业客户，需要 USD
              账户和支付网络；（2）需要符合 GENIUS Act 的稳定币结算和清算基础设施的加密货币交易所与数字资产平台；（3）代理行缺口突出的新兴市场区域银行——这些银行失去了 USD 代理行关系，需要替代性托管方来管理
              USD 储备并接入 SWIFT；（4）需要 USD 发起和收款能力的跨境 B2B 支付公司。第 1 和第 3 类的预算归 CFO 和资金负责人掌握；第 2 类则由合规和运营负责人主导。采用路径通常是：API
              试点集成 → 沙盒 → 生产环境上线 → 签署年度基础设施费合同。替代壁垒中等——Column、Cross River 等美国赞助银行关系存在，但伴随资产负债表约束、合规负担，以及 2024 年 Synapse
              倒闭所暴露的交易对手集中风险。Synapse 破产让 $85–95M 客户资金陷入对账缺口，并导致 100 家金融科技平台失去银行接入，揭示了多层 BaaS 中介体系的系统性脆弱。Augustus
              的直接牌照模式去掉一层中介风险，这正是合规敏感买方采用它的主要拉力。
