  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              对一家 VC 支持的初创公司而言，Augustus 的商业模式对监管的依赖异常高。公司必须先获得 FDIC 存款保险批准，并接入 Federal Reserve 支付系统，才能产生任何美元银行收入；这两项都是
              OCC 2026 年 5 月条件性批准之后的独立多步骤流程。OCC 条件性牌照列明了开业前条件，包括资本充足性、技术就绪度、管理层资质和运营能力评估；Augustus 必须满足所有条件后才能开业。de novo
              银行的 FDIC 申请流程通常自提交起需要 12–24 个月；如果 Augustus 的申请与 OCC 流程并行提交（2025 年末或 2026 年初），批准可能在 2026 年下半年至 2027
              年上半年到来。不过，FDIC 批准并不保证，可能因 Community Reinvestment Act（CRA）合规、管理层资质和财务预测而被拒或延迟。第二项监管风险是 GENIUS Act
              落地时间线：法律已通过，但截至 2026 年中，具体 OCC 规则制定尚未完成。如果 GENIUS Act 合规模块是核心收入支柱，而法规延迟、修订或要求不同技术架构，Augustus
              就需要调整稳定币产品策略。其他监管风险包括 BSA/AML 项目合规：OCC 对 Augustus 的首次检查将严格评估基于 AI 的交易监控系统；如果 AI 合规项目不符合 OCC 标准，Augustus
              可能收到 Matters Requiring Attention（MRA），需要先整改才能扩张。最后，美国国家银行必须遵守 Community Reinvestment
              Act，证明服务低收入和中等收入社区；Augustus 聚焦国际 fintech，可能带来 CRA 合规挑战，拖慢监管批准或迫使产品修改。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
