companyProfile:
  summary: >-
    Augustus（对外以 Global Dollar Bank 名义经营）是一家总部位于 Dallas 的金融科技初创公司，由 Ferdinand Dabitz（CEO，25 岁， Thiel Fellow）在 2022
    年创立，并与 Greg Quarles（总裁，18 年 OCC 审查员经历，Green Dot 前 CEO）共同创办。公司在 2026 年 5 月获得 Office of the Comptroller of the
    Currency（OCC）对美国全国性银行牌照的条件性批准——这是十多年来首个新设全国性银行牌照条件性批准。Augustus 的核心产品是 Marble 平台：一套 AI
    原生核心银行系统，面向国际金融科技公司和新银行，提供美国美元账户、跨境支付网络（SWIFT、ACH、SEPA、FedNow、稳定币）的直接接入，以及 GENIUS Act 下由 OCC
    牌照支撑的稳定币储备管理。公司目前借助一家芬兰银行实体在欧洲运营，Kraken（Payward Inc.）是其唯一公开确认的欧元清算客户。Augustus 在 2026 年 7 月以 $1B 估值完成 $180M Series B
    融资，由 Tiger Global Management 领投，QED Investors 和 Hummingbird Ventures 参投。
