      - number: '7.2'
        title: 运营、技术与安全风险
        blocks:
          - type: paragraph
            body: >-
              Augustus 最根本的运营风险，是「AI 原生、24/7」技术主张与缺少独立验证之间的缺口。Marble 平台没有经过外部审计；没有公开的 uptime 记录、SLA 基准、AI
              准确率指标或第三方技术评估。如果 Marble 架构无法按声称表现——例如出现维护窗口、需要夜间批量对账，或产生 AI
              合规错误——核心产品差异化就会坍塌。第二项运营风险是从零构建全栈国家银行的复杂度：核心银行、支付 rails（SWIFT、ACH、SEPA、FedNow）、实时账本、AML/KYC、实名账户管理和 OCC
              报告，都必须在首个美国客户上线前达到生产可用并经得起监管检查。Column N.A. 2016 年创立后用了约 4 年搭建这套基础设施。Augustus 成立于 2022 年，却试图到 2027
              年完成类似建设。第三项风险是网络安全：作为 OCC 持牌银行，Augustus
              持有客户存款和支付指令，是网络攻击的高价值目标。数据泄露、勒索软件事件或支付系统操纵，都可能造成财务损失、监管行动，并在风险敏感的企业银行客群中留下永久声誉损害。银行的云原生架构（大概率 AWS 或
              GCP）降低了一部分本地部署风险，但引入了对超大规模云厂商 SLA 和共享基础设施漏洞的依赖。第四项风险是公司没有公开的灾难恢复或业务连续性计划：如果主数据中心失效，Augustus 如何维持其承诺的 24/7
              运营？公司没有公开说明地理冗余或故障切换架构。
