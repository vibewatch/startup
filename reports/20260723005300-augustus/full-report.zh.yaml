  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值方法与背景
        blocks:
          - type: paragraph
            body: >-
              以 $1 billion Series B 给 Augustus 估值，本质上是在评估监管资产和期权价值，而不是套用传统收入倍数。截至 2026 年 7 月，Augustus
              基本没有美国收入（美国银行产品必须先取得 FDIC 批准才能上线），唯一确认收入来自 Kraken
              在欧洲的欧元清算——这段关系通过公司的芬兰银行实体产生了可观但未披露的收入。传统可比公司分析使用的未来收入倍数、ARR 倍数或 EBITDA 倍数，无法直接套用在 Augustus
              身上，因为它在主要市场仍处于收入前。估值应放在两个维度评估：（1）OCC
              条件性牌照的期权价值——取得新的美国国家银行牌照有多难、多稀缺，对投资者和潜在收购方值多少钱；（2）美国银行收入规模化后的折现现值（FDIC 批准后 3–5 年），并按监管批准概率、时间和客户获取风险调整。OCC
              条件性牌照确实稀缺：在 Augustus 之前，十多年没有新的国家银行牌照获批；OCC 还明确批准 Augustus 成为具备 GENIUS Act
              能力的稳定币清算银行——这是独特的监管定位。仅牌照期权价值，在战略收购方那里就可能值 $200–400M。剩余 $600–800M 隐含的是未来收入现值折扣：公司需要在 3–5 年内达到 $50-100M
              ARR，并按高增长 fintech 基础设施 15-20x 的市场倍数，才能支撑该估值。
