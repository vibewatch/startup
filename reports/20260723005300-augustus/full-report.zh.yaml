  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与目标市场
        blocks:
          - type: paragraph
            body: >-
              Augustus 的理想客户画像（ICP）是国际 fintech 或银行，且同时满足三点：（1）需要为终端用户或自身运营接入可编程美元；（2）不易获得美国 sponsor bank；（3）规模足以支撑企业级
              API 银行集成。已识别出四个主要客群。第一，国际消费者 neobank——Nubank（巴西，约 97M 用户）、Revolut（英国 / 欧盟）、Grab Financial（东南亚）以及数十家聚焦非洲的
              neobank；这些公司持有客户美元余额并发起国际电汇，合计都需要美国代理账户。第二，加密货币交易所和数字资产平台——Kraken（已确认客户）、Circle、Ripple
              等；这些公司为机构客户需要美元出入金、稳定币清算和 SWIFT 接入；基于 Kraken 已确认使用情况，这是 Augustus 推进最深的细分市场。第三，跨境 B2B
              支付服务商——服务拉美、MENA、撒哈拉以南非洲和东南亚商户通道的公司，需要代付款方发起美元电汇；Citibank 和 JPMorgan 等竞争银行正在减少高风险司法辖区的代理行关系，为 API
              优先的替代方案打开市场。第四，GENIUS Act 稳定币发行方（新兴）——GENIUS Act 监管框架落地后，规模超过 $10B 的美元稳定币发行方将需要 OCC
              持牌储备托管人；该客群尚未产生收入，但单客户价值可能最高。全球需要美元接入的国际 fintech 可服务公司数估计为 2,000–4,000 家，并高度集中在 fintech
              枢纽：巴西（Nubank、C6、Inter）、英国 /
              欧盟（Revolut、Monzo、N26）、东南亚（Grab、GoPay、OVO）、MENA（Tabby、Tamara、Lean）和非洲（Flutterwave、Chipper、MFS Africa）。
