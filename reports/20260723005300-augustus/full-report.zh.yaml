      - number: '4.3'
        title: 资本充足与融资依赖
        blocks:
          - type: paragraph
            body: >-
              作为全国性特许银行，Augustus 受 OCC 和 Federal Reserve Board 的资本充足要求约束。OCC「资本充足」门槛要求最低总风险资本比率 10%、Tier 1 资本比率 8%、杠杆率
              5%。截至 2026 年 7 月，Augustus 各轮累计融资约
              $240M，且资产负债表尚未运营（没有贷款或存款需要风险加权），明显高于最低资本门槛。银行必须持续维持这些比率；随着存款基础和资产负债表扩张，可能需要追加资本。粗略测算：如果 Augustus 在第 3
              年目标达到 $2B 客户存款（与 Column 当前资产基础相近），就需要约 $200M 监管资本——接近当前资本基础，意味着如果没有后续融资，快速存款增长的余量有限。烧钱速度方面，Augustus
              未披露月度运营费用或 burn rate。早期特许银行和 BaaS 基础设施公司、50–100 名员工的行业基准显示，总运营费用（工程、合规、法务、销售）约 $5–10M/月。按 $5M/月 burn 和
              $240M 累计融资计算，理论现金跑道为 24–48 个月。但已融资资金中相当一部分（估计 $100–150M）必须作为银行监管资本保留，不能作为运营费用消耗；有效运营现金降至约
              $90–140M，意味着有效跑道为 9–28 个月。Series B（2026 年 7
              月，$180M）是主要资本事件。公司描述的资金用途包括银行资本金、技术建设、完成监管流程和国际市场扩张。未披露债务融资或项目融资义务。下一轮触发因素很可能是 FDIC
              批准和首个锚定客户收入产生；这会把公司从尚未运营的故事，转为收入阶段，并支撑潜在 Series C 或战略合作。
