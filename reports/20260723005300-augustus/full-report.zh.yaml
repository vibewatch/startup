  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Marble 是 Augustus 的核心银行操作系统——一层技术能力，让国际金融科技公司和银行直接、程序化地接入美国美元银行基础设施。放到客户工作流里：一家国际金融科技公司与 Augustus 签署 API
              合同，接入 Marble 的 REST API，完成 KYC/AML 上线，然后即可为自己的终端用户开设具名虚拟账户，在 SWIFT、ACH、SEPA、FedNow
              和稳定币网络上发起和接收付款，并管理实时账本余额——全部用一个 API 完成。这个产品不同于传统代理行（需要线下关系管理、最低存款和人工对账），也不同于赞助银行型
              BaaS（交易经中介银行路由，带来交易对手风险，Synapse 倒闭已经证明这一点）。用客户语言说，Augustus
              的价值主张是：「从非美国金融科技公司到美国特许银行基础设施的最快路径。」关键产品模块包括：（1）具名虚拟账户发行——每个客户的终端用户获得唯一 USD 账号，无需 FBO 资金池即可直接追踪 FDIC
              保险余额；（2）支付发起——一个 API 覆盖 ACH、SWIFT、SEPA、FedNow 和 RTP；（3）实时账本和交易监控——AI 驱动的异常检测和 AML 筛查；（4）GENIUS Act
              合规模块——计划服务需要 OCC 特许储备管理的稳定币发行人。截至 2026 年 7 月，Augustus
              的欧洲实体借受监管的欧洲基础设施运营欧元清算，在美国全面上线前展示了跨境技术能力。Kraken（加密货币交易所）是最公开点名的客户，说明稳定币 / 数字资产客群是早期采用者。
