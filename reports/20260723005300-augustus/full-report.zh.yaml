          label: 执行：尚未产生收入；FDIC 待批；CTO 未知
        - id: valuation
          label: 估值：$1B；若 12 个月内拿到 FDIC，估值有支撑
        - id: risk
          label: 二元风险：FDIC 被拒 = 投资逻辑坍塌
        - id: diligence
          label: 尽调：FDIC 状态、技术审计、团队深度
        - id: recommend
          label: 建议：有条件投资
        - id: condition1
          label: 条件 1：确认 FDIC 申请已提交
        - id: condition2
          label: 条件 2：技术尽调通过
        - id: condition3
          label: 条件 3：CTO 已确认
    approximationNotes: 推荐逻辑由分析师按标准 IC 决策框架构建。最终建议取决于三个条件能否全部得到满意解决。
    claimRefs:
      - CV021
      - CV022
      - CV023
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 在不同收入情景下，$1B 入场对应的隐含 ARR 倍数；以及在不同市场倍数下，需要做到多少收入才能支撑 $1B 估值
    data:
      items:
        - label: 15x ARR @ $1B = 需要约 $67M ARR
          value: 67
        - label: 20x ARR @ $1B = 需要约 $50M ARR
          value: 50
        - label: 30x ARR @ $1B = 需要约 $33M ARR
          value: 33
        - label: Column N.A. 15x 倍数（先例）
          value: 15
        - label: BaaS 2026 中位数：约 12x ARR
          value: 12
        - label: 乐观：2030 年 ARR 达 $120M @ 15x = 隐含 $1.8B
          value: 120
        - label: 基准：2030 年 ARR 达 $60M @ 15x = 隐含 $0.9B
          value: 60
        - label: 悲观：2030 年 ARR 达 $20M @ 15x = 隐含 $0.3B
          value: 20
    approximationNotes: ARR 数字来自分析师的乐观 / 基准 / 悲观情景模型估算。市场倍数基于截至 2026 年 7 月的可比公司分析。所有数字均为示意性预测。
    claimRefs:
      - CV001
      - CV005
      - CV010
      - CV011
      - CV012
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 以 $1B 入场，在乐观、基准和悲观情景下的低 / 基准 / 高退出估值和回报结果
    data:
      items:
        - label: 悲观（30% 概率）：FDIC 延迟；Kraken 退出
          low: 400
          mid: 700
          high: 900
        - label: 基准（50% 概率）：最晚 2027 年 Q4 拿到 FDIC；2 个锚定客户
          low: 1200
          mid: 1800
          high: 2500
        - label: 乐观（20% 概率）：最晚 2027 年 Q2 拿到 FDIC；5 个客户；GENIUS Act
          low: 2500
          mid: 3500
          high: 5000
        - label: 风险调整后预期退出价值
          low: 1200
          mid: 1750
          high: 2500
    approximationNotes: 所有数值单位均为 $M。回报假设后续轮次没有额外稀释（简化处理）。风险调整后预期值为按概率加权的中值：(30%*700)+(50%*1800)+(20%*3500) = $1,810M。
    claimRefs:
      - CV010
      - CV011
      - CV012
      - CV013
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Augustus Series B 估值 $1B，本记分卡按 7 个投资维度供 IC 使用
    data:
      items:
        - label: 市场机会
          value: 8/10
        - label: 监管验证
          value: 8/10
        - label: 竞争护城河
          value: 7/10
        - label: 管理团队
          value: 6/10
        - label: 技术与执行
          value: 5/10
        - label: 收入证据
          value: 4/10
        - label: 估值合理性
          value: 6/10
    approximationNotes: KPI 分数由分析师按 10 分制构建。8-10 = 强正向；6-7 = 可接受但有明确风险；4-5 = 存在重大缺口，需要尽调。整体加权平均：6.3/10。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV015
