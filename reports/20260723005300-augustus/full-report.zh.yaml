      - number: '3.4'
        title: 护城河持久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Augustus 的主要竞争护城河包括：（1）OCC 银行牌照——高门槛监管资产，历经两年 OCC 流程，并要求持续满足资本、合规和检查要求；（2）国际产品论题——现有 OCC 特许 API
              银行还没有把国际金融科技接入作为核心产品；（3）GENIUS Act 时点——在新监管框架下，率先成为 OCC 特许稳定币清算基础设施提供方。护城河持久性的关键风险包括：（1）Column 扩张——Column
              可以把产品范围延伸到国际金融科技公司和 SEPA 连接；它有足够资本和监管资质这样做。这是最实质的竞争替代风险。（2）Cross River 国际扩张——Cross River 今天服务 Wise 和
              Coinbase；它可以用额外资本或 OCC 牌照转换来加深国际定位。（3）整合——资本充足的收购方（Stripe、Visa、Mastercard、大型银行）可能收购 Column 或 Cross
              River，带来 Augustus 难以匹配的规模和分发能力。（4）赞助银行商品化——如果 Synapse 引发的监管审查把所有赞助银行推向类似 Column 的合规标准，第一层 OCC
              牌照优势会收窄。（5）FDIC 批准延迟——Augustus 尚未取得 FDIC 保险；如果 FDIC 批准明显延后（18+ 个月），Column 将在依赖 FDIC
              的用例中维持不可撼动的获客优势。切换成本方面：已经接入 Column 或 Cross River API 的金融科技公司，迁移时会面临数月重构。Augustus
              必须在客户承诺给竞争对手前拿下他们，或说服尚未接入银行的国际金融科技公司先搭在自己的平台上。多归属也可能发生（一家金融科技公司可用 Augustus 做国际 USD，用 Column
              做美国本土），这限制赢家通吃，但也创造先落地再扩张的机会。
