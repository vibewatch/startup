      - number: '7.4'
        title: 人员、执行与财务风险
        blocks:
          - type: paragraph
            body: >-
              Augustus 由 25 岁 CEO Ferdinand Dabitz（Thiel Fellow，德国籍）领导，他将成为美国联邦特许国家银行最年轻的 CEO。Dabitz
              的监管和融资资历出色；但银行执行经验有限——他从未管理受监管美国银行经历 OCC 检查，也没有在银行检查条件下招聘并组织银行合规团队、完成首批客户上线。总裁 Greg Quarles（前 OCC
              检查员、Green Dot CEO）提供了重要监管深度，但 Quarles 在 Green Dot 的执行记录（财务表现承压）较为复杂。第二项人员风险是团队深度：公司未公开任命
              CTO；工程领导层和团队规模也未披露。对于一家从零构建 AI 原生银行的公司，技术领导结构不明是重要缺口。第三，runway 与 burn 风险：拿到 $180M Series B 后，Augustus
              必须构建完整合规的银行、取得 FDIC 批准、招聘合格银行团队、建设技术基础设施，并接入首批美国客户——这一切都要在产生重大美国收入之前完成。此前各轮合计约 $60M；$180M Series B
              必须支撑运营直到美国上线。如果 FDIC 批准延迟 18 个月以上，而以公司这一阶段每月 burn $5–10M 估算，Augustus 可能在美国收入开始前就需要融 Series C。最后，是 GENIUS
              Act 稳定币模块的执行风险：为稳定币发行方构建符合 OCC 要求的储备管理基础设施，此前没人做过；监管、技术和运营要求均无先例，时间线也不确定。
