      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              Augustus 自 2022 年创立以来完成三轮融资，公开披露的股权融资累计约 $240M。约 $12M 的种子轮在 2022–2023 年完成，用于搭建最初的产品和团队。2024 年完成 $48M
              Series A，使公司能够推进 Marble 平台并启动 OCC 牌照申请流程，QED Investors 和 Hummingbird Ventures 以领投或联合领投身份参与。标志性的 Series B 在
              2026 年 7 月 21 日公布，以 $1B 投后估值融资 $180M，让公司进入独角兽行列。Tiger Global Management 领投 Series B，QED Investors 和
              Hummingbird Ventures 继续参投，Nubank、Ramp、Circle 和 Deel 创始人也显著共同投资。Valar Ventures 和 Creandum
              基金也被列为早期轮次参与方。Augustus 在公开收入尚未量化的情况下达到 $1B
              估值，意味着收入倍数相当高，与高增长金融科技基础设施公司一致。公司未公开披露债务融资、授信额度或老股转让。资金用途包括拓展拉丁美洲、东南亚、中东和非洲，继续开发平台，并满足 OCC
              的开业前资本要求，包括最低股本资本和购买 Federal Reserve Bank 股份。收入或 ARR 未披露，使评估隐含估值倍数时留下证据缺口。
