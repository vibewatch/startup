      - number: '4.4'
        title: 公开财务缺口与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              最重要的财务尽调阻塞点，是公开财务数据完全缺失。Augustus 未提交任何公开财务报表（私人公司无需 SEC 申报）；OCC 条件性批准文件没有财务预测；Series B 公告也没有 ARR、收入、毛利率或
              burn rate。对一家尚未产生收入、尚未运营的银行初创公司而言，这并不罕见，但投资者如果没有数据室访问权限，信息盲区会很大。关键缺口包括：（1）没有公开可得的审计财务报表；（2）没有披露 ARR
              或收入数据；（3）没有披露 burn rate 或现金跑道；（4）没有毛利率数据（平台尚未运营）；（5）没有单位经济（CAC、LTV、回本周期）；（6）没有披露运营费用与银行监管资本之间的资本分配；（7）FDIC
              申请及其条款不公开。对 Augustus 的财务判断完全取决于 FDIC 批准和初始客户上线里程碑。收入一旦启动，质量应当较高：多年企业合同和切换成本会形成可预测、高质量
              ARR。利润率路径也有利：特许银行基础设施 SaaS 业务通常可达到 60–75% 毛利率。相较典型 SaaS，资本强度更高，因为银行牌照要求会把大部分融资锁作监管资本。尽调时间表应围绕 FDIC
              批准决定设计；这是业务从尚未产生收入转向收入阶段的唯一闸门事件。
