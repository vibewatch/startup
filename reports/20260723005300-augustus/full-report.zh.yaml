      - number: '8.2'
        title: 可比公司估值
        blocks:
          - type: paragraph
            body: >-
              Augustus 最接近的公开和私有可比公司分两类：（1）OCC 持牌 fintech 基础设施银行（Column N.A.、Cross River Bank）；（2）BaaS
              中间件供应商（Unit、Highnote、Synapse、Stripe Treasury）。Column N.A. 是最直接可比：OCC 持牌、聚焦美国银行基础设施，2025 年净收入
              $200M，最近私募市场估值约 15x 收入，隐含 $2-3B 估值区间——显著高于 Augustus 零美国收入时的 $1B。不过，Column 在建设进度上领先 4 年，并且已经产生收入。Cross
              River Bank 估值约 $3 billion（2025 年收入 $517M，约 6x），采用州牌照，在 GENIUS Act 合规上的监管定位更有限。Unit Finance（BaaS 中间件）和
              Highnote 在 2022–2023 年以不到 $50M ARR 融到 $1.0-1.5B 估值，隐含 20-30x ARR 倍数；Synapse 破产后，BaaS
              市场情绪恶化，这些倍数已明显压缩。Augustus 收入前估值 $1B，OCC 牌照和稳定币定位让它区别于纯 BaaS 中间件；相对这些同行的溢价只有在牌照提供战略期权时才站得住。对比 Column 在
              $200M 收入上 $2-3B 的估值，Augustus 近零收入却值 $1B，需要相信公司能在 3 年内实现 $67M+ 收入，才能以今天入场价对应 15x 隐含倍数。该领域的大型机构投资者——Tiger
              Global 的 fintech 基础设施组合、QED 在银行基础设施的记录（Nubank、AvidXchange、Current）——说明成熟资本相信该商业模式可以落地。
