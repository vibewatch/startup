      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              Augustus 所处市场的关键增长驱动包括：（1）GENIUS Act 在 2026 年生效——它建立稳定币监管框架，要求规模超过 $10B 的稳定币发行人持有完整银行牌照，并创造对 OCC
              特许基础设施的需求；（2）代理行持续收缩——2011–2025 年全球代理行关系减少 22%，非洲（–42%）、MENA（–28%）和拉美（–31%）受影响尤其大，正是 Augustus
              目标客户所在地区；（3）APAC 和 MENA 的开放银行与 API 要求，推动市场需要可组合、可用 API 接入的银行能力；（4）Synapse 之后，监管加压赞助银行型 BaaS——FDIC 和 OCC
              均发布正式指引，要求加强对 BaaS 中介的监督，使直接牌照模式更吸引重视合规的金融科技公司；（5）美元在新兴市场贸易融资和汇款中的霸权——USD 仍是全球约 73%
              商品贸易的发票货币。关键采用约束包括：（1）集中风险——Augustus 作为早期银行牌照主体，在 FDIC 批准前牌照仍是条件性的，所有客户都依赖单一机构；（2）从现有赞助银行切换的成本中等但真实存在，因为
              API 集成需要重做；（3）资本强度——打造并维持一家特许全国性银行，需要持续满足最低资本比率（资本充足门槛 = 总风险资本比率 10%）；（4）监管时间表不确定——OCC 批准后，FDIC 保险批准流程还会增加
              6–18 个月不确定性；（5）定价——OCC 特许 BaaS 可能相较赞助银行替代方案收取溢价，限制成本敏感的小型金融科技公司采用。
