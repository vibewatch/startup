      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观情景（20% 概率）：FDIC 批准在 2027 年 Q2 到来，Augustus 在上线后 12 个月内接入 3–5 个美国锚定客户（加密交易所、国际 neobank、跨境支付公司），2027 年底达到
              $25M ARR，2028 年底达到 $75M ARR。GENIUS Act 监管清晰度按计划到来；Augustus 捕获面向 OCC 持牌银行的可服务稳定币储备管理市场 30%+。退出路径是由寻求持牌
              fintech 基础设施平台的美国大型银行（JP Morgan、Wells Fargo、BNY Mellon）或战略收购方（Stripe、Visa、FIS）以 $3–5B 收购。以 $1B 入场计算，4 年
              3-5x。基准情景（50% 概率）：FDIC 于 2027 年 Q4 批准；美国业务 2028 年上半年上线；2028 年底前接入 2 个锚定客户；2029 年 ARR 达到 $30M；2030 年以 $2B
              估值 IPO 或完成成长股权融资。欧盟业务从 Kraken 扩展到 3–4 个欧元清算客户；2030 年总收入 $50-60M。以 $1B 入场计算，5–6 年 1.5-2x（按 VC
              标准偏温和）。悲观情景（30% 概率）：FDIC 批准延迟超过 18 个月（2028 年上半年）或初次被拒；burn 迫使公司在美国上线前以 $800M–$1B 估值融 Series C；Kraken
              在拿到自己的 OCC 牌照后退出；美国业务 2028 年下半年上线，但客户管线不足；2030 年 ARR 仅 $10–15M。回报 <1x，并有永久减值风险。按 $1B 入场计算，风险调整后预期价值约为 5 年
              $1.7B——为正但 VC 回报并不亮眼。该投资本质上是押注 FDIC 批准时间和管理层执行质量的二元赌注。
