callouts:
- calloutType: strength
  title: Named Virtual Account Architecture Eliminates Synapse-Type Reconciliation Risk
  body: Marble's named virtual account model—where each end-user gets a unique account number rather than a pooled FBO account—directly
    addresses the reconciliation gap that caused the Synapse collapse ($85-95M in unreconciled funds). This architectural
    choice is both a trust signal and a regulatory compliance advantage.
  claimRefs:
  - CE003
  - CE004
  - CE012
- calloutType: risk
  title: AI-Native Claims Are Unvalidated; No Independent Technical Benchmark Exists
  body: Augustus's core technology differentiation—AI-native, 24/7, no-maintenance-window—is entirely company-claimed and
    has not been independently verified. No benchmark data, uptime records, SLA documents, or third-party technical assessments
    are publicly available. The product is pre-operational in the US, making validation impossible until launch.
  claimRefs:
  - CE010
  - CE011
  - CE013
- calloutType: insight
  title: Stablecoin Volume Justifies Technical Investment in Programmable Money
  body: Stablecoins processed $33 trillion in volume in 2025—exceeding Visa and Mastercard combined—with market cap near $310-318
    billion. This validates Augustus's bet that programmable money infrastructure is a large and growing clearing opportunity,
    even if the specific revenue model for stablecoin clearing is not yet finalized.
  claimRefs:
  - CE021
  - CE022
  - CE023
- calloutType: risk
  title: No Public Developer Documentation Limits Third-Party Validation
  body: Augustus has not published API documentation, developer portal, or technical specifications publicly. The GitHub organization
    shows no public repositories. This opacity prevents independent developer assessment of integration quality, API coverage,
    and technical maturity—a significant due diligence limitation.
  claimRefs:
  - CE025
  - CE026
