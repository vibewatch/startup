company:
  name: Augustus
chapter:
  number: 5
  title: Product and Technology
  summary: 'Augustus''s core product is Marble, a proprietary AI-native core banking platform designed from scratch as a 24/7,
    API-first banking infrastructure. Marble replaces legacy core banking systems (FIS, Fiserv, Temenos) with an always-on,
    programmable architecture supporting SWIFT, ACH, SEPA, FedNow, and stablecoin settlement. The technology is positioned
    for the ''programmable money'' era: AI agents, stablecoins, and real-time cross-border financial flows. Augustus''s OCC
    conditional charter and euro-clearing live deployment are the strongest evidence of platform maturity, but the full US
    banking product is pre-operational pending FDIC approval.'
sections:
- id: product-definition-workflow
  title: Product Definition and Customer Workflow
  body: 'Marble is Augustus''s core banking operating system—a technology layer that gives international fintech firms and
    banks direct, programmatic access to US dollar banking infrastructure. In customer workflow terms: an international fintech
    signs an API contract with Augustus, integrates via Marble''s REST APIs, passes KYC/AML onboarding, and then can open
    named virtual accounts for its own end-users, originate and receive payments across SWIFT, ACH, SEPA, FedNow, and stablecoin
    rails, and manage real-time ledger balances—all through a single API interface. The product is distinct from both traditional
    correspondent banking (which requires in-person relationship management, minimum deposits, and manual reconciliation)
    and sponsor-bank BaaS (which routes through an intermediary bank, creating counterparty risk as demonstrated by the Synapse
    collapse). Augustus''s value proposition in customer terms: ''the fastest route from non-US fintech to US-chartered banking
    infrastructure.'' Key product modules include: (1) Named Virtual Account issuance—each client''s end-user receives a unique
    USD account number, enabling direct FDIC-insured balance tracking without FBO pooling; (2) Payment origination—ACH, SWIFT,
    SEPA, FedNow, and RTP from a single API; (3) Real-time ledger and transaction monitoring—AI-powered anomaly detection
    and AML screening; (4) GENIUS Act compliance module—planned for stablecoin issuers needing OCC-chartered reserve management.
    As of July 2026, Augustus''s European entity operates euro clearing through a regulated European infrastructure, demonstrating
    cross-border technical capability ahead of the full US launch. Kraken (the crypto exchange) is the most publicly named
    client, suggesting that the stablecoin/digital asset segment is an early adopter.'
