  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: No public API documentation or developer portal
    missingEvidence: Augustus has not published developer documentation, API reference, code samples, or SDK as of July 2026.
      No third-party developer review or integration guide has been found.
    whyItMatters: Technical diligence of the Marble platform is impossible without API documentation or a production sandbox
      environment accessible to investors.
    diligencePath: Request sandbox API access during due diligence; conduct technical assessment with test environment; review
      OCC technical submissions if accessible.
    relatedQuestionRefs:
    - QE006
    - QE022
    - QE028
  - type: missing-source
    severity: material
    topic: AI-native claims unvalidated
    missingEvidence: No independent benchmark, uptime record, false-positive rate for AI AML, or third-party technical assessment
      of Marble's AI-native architecture has been found.
    whyItMatters: The primary technology differentiation is unverified; if Marble is an API wrapper over conventional infrastructure
      rather than a genuinely AI-native system, the core product moat does not exist.
    diligencePath: Commission independent technical due diligence team to review architecture; request OCC examination technology
      findings (if available); interview former Augustus engineering team members.
    relatedQuestionRefs:
    - QE009
    - QE013
    - QE025
  - type: enumeration-incomplete
    severity: minor
    topic: Product module table coverage
    missingEvidence: The product module table (TE001) does not include lending, card issuance, treasury management, or securities
      custody—product lines that OCC-chartered banks commonly offer and that Augustus may plan to add.
    whyItMatters: Future product expansion could materially increase TAM and revenue per client beyond the current payments-and-accounts
      model.
    diligencePath: Request product roadmap presentation from management; review job postings for roles that signal future
      product development.
    relatedTableRefs:
    - TE001
    relatedQuestionRefs:
