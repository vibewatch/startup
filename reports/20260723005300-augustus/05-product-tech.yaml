- id: deployment-integration-roadmap
  title: Deployment, Integration, and Roadmap
  body: 'Current deployment status: Augustus''s European entity provides euro clearing with live operations as of 2025–2026,
    confirming cross-border payment capability in at least one jurisdiction. The US banking product (Marble US) is pre-operational,
    dependent on FDIC insurance approval post-OCC conditional charter (May 2026). The US deployment roadmap has three phases:
    (1) FDIC approval and launch—expected within 6–18 months of OCC conditional approval (May 2026); (2) US anchor client
    onboarding—API integration and sandbox environment for initial clients including Kraken and new international fintechs;
    (3) Stablecoin subsidiary launch—planned GENIUS Act-compliant subsidiary for stablecoin reserve management. Integration
    approach is API-first: clients use REST API with standard OAuth/JWT authentication. The company has stated the API covers
    named account origination, payment initiation, statement retrieval, and compliance webhook notifications. No public developer
    documentation has been found, though the company positions itself with a strong developer-experience focus (''bank made
    of code''). Reliability commitment: the company claims 24/7/365 uptime without maintenance windows, which would be a material
    SLA upgrade over incumbent correspondent banks. No independent reliability data or uptime metrics are publicly available.
    Support model: enterprise-grade, likely dedicated account management for anchor clients. The roadmap''s critical path
    is the FDIC approval process, which is the single gating event for US revenue generation.'
  claimRefs:
  - CE013
  - CE014
  - CE015
  - CE016
