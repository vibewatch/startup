- id: trust-security-compliance
  title: Trust, Safety, Security, and Compliance Controls
  body: 'As an OCC-conditionally approved national bank, Augustus operates under the highest tier of US banking supervision.
    The OCC conducts annual safety and soundness examinations of national banks; Augustus will be subject to OCC examination
    once it begins operations. Compliance controls embedded in Marble include: (1) AML/CFT—AI-powered transaction monitoring
    using behavioral ML models for suspicious activity detection; (2) KYC/KYB—automated customer due diligence workflow at
    onboarding; (3) OFAC sanctions screening—real-time check on payment counterparties; (4) FDIC deposit insurance (pending)—once
    FDIC-approved, client deposits held at Augustus will be FDIC-insured up to $250K per depositor; named virtual account
    architecture enables direct FDIC coverage mapping per end-user; (5) SOC 2 Type II (assumed planned)—enterprise clients
    require SOC 2 attestation; Augustus has not publicly disclosed audit status; (6) GENIUS Act compliance—planned module
    for stablecoin issuers requiring OCC-chartered reserve management. Security architecture: as an API-first cloud-native
    bank, Augustus likely runs on AWS or GCP with standard financial-grade security (encryption at rest and in transit, HSM
    for key management, multi-region failover). No security audit results or SOC 2 report are public. The most significant
    near-term compliance risk is the FDIC approval process: FDIC insurance is a prerequisite for FDIC-insured deposit-taking,
    and any delay adds operational and financial risk. Post-launch, the OCC will conduct periodic examinations; non-compliance
    findings could require remediation and capital action, as seen with other OCC-chartered fintechs.'
