callouts:
- calloutType: risk
  title: No Public Financial Data Creates Diligence Blind Spot
  body: Augustus has disclosed zero financial metrics (ARR, burn rate, gross margin, headcount, runway). This is unusual even
    among pre-revenue startups, where management typically provides investor-facing projections. The absence of any financial
    traction data—even LOIs or pilot client commitments—creates a fundamental diligence gap that cannot be resolved without
    data room access.
  claimRefs:
  - CI020
  - CI021
  - CI022
- calloutType: risk
  title: Effective Operating Runway Is Shorter Than It Appears
  body: While $240M in total raised capital appears substantial, a significant portion (estimated $100–150M) must be preserved
    as bank regulatory capital and cannot be spent on operations. This reduces effective operating runway to approximately
    $90–140M, implying 9–28 months at $5–10M/month burn—a much tighter margin than the headline capital figure suggests.
  claimRefs:
  - CI014
  - CI015
  - CI016
  - CI017
- calloutType: strength
  title: Revenue Quality Should Be High Once Operational
  body: Once FDIC-approved and operational, Augustus's revenue model combines high-quality SaaS elements (multi-year contracts,
    high switching costs, predictable ARR) with a float income component that scales with client deposits and interest rates.
    This mirrors Column N.A.'s model, which achieved $200M revenue and profitability within 3 years of operation.
  claimRefs:
  - CI006
  - CI031
  - CI032
- calloutType: assumption
  title: Revenue Projections Assume 12-Month FDIC Timeline
  body: Mid-scenario financial projections in this chapter assume FDIC approval within 12 months of the July 2026 OCC conditional
    approval, with first anchor client revenue beginning 6 months after FDIC approval. Any material delay directly compresses
    the operating runway and delays the revenue milestone.
  claimRefs:
  - CI018
  - CI019
