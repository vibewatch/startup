- id: gtm-unit-economics
  title: GTM Motion and Unit Economics
  body: 'Augustus targets enterprise fintech and bank clients with a direct enterprise sales model. Given the highly regulated
    and compliance-sensitive nature of OCC-chartered BaaS, the expected sales cycle is 6–18 months—typical for financial infrastructure
    deals involving FDIC, AML, and compliance due diligence by the buyer. Customer acquisition cost is estimated at $50,000–$200,000
    per anchor client, reflecting a small senior sales team with high compensation and legal/compliance support costs. Lifetime
    value for an anchor client—a multi-year contract at $500K–$2M/year—is estimated at $2.5M–$20M over a 5–10 year contract
    lifetime. The implied LTV/CAC ratio of 12:1 to 100:1 is consistent with high-value enterprise infrastructure plays. Key
    GTM channel economics: direct sales and business development are the primary channels, given that the client base (licensed
    international fintechs and banks) is concentrated (estimated 800–1,200 target prospects) and decision-making is top-down
    (CFO/Treasury, not developer-led). A secondary developer-led channel (API sandbox onboarding) may shorten the technical
    evaluation cycle but the commercial close remains enterprise-level. Sales efficiency proxies are unavailable given pre-revenue
    status. Comparable benchmarks: Column N.A.''s client roster (Brex, Mercury, Plaid, Carta) suggests anchor clients in the
    $50M–$200M ARR range can generate $5M–$15M annual platform fees; Cross River Bank demonstrates that a single large BaaS
    client (Wise, Coinbase) can represent $50M–$100M of annual revenue. Augustus''s TAM concentration in international fintechs
    means fewer but potentially larger and stickier clients. The multi-homing dynamic noted in the competitive chapter also
    limits TAM capture rate.'
  claimRefs:
  - CI007
  - CI008
  - CI009
  - CI010
  - CI011
  - CI012
