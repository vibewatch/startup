- id: public-financial-gaps
  title: Public Financial Gaps and Diligence Blockers
  body: 'The most material financial diligence blocker is the complete absence of publicly disclosed financial data. Augustus
    has not filed any public financial statements (no SEC filings are required for a private company); the OCC conditional
    approval document does not include financial projections; and the Series B announcement does not include ARR, revenue,
    gross margin, or burn rate figures. This is not unusual for a pre-revenue, pre-operational bank startup, but it creates
    a significant epistemic gap for investors conducting primary diligence without data room access. Key gaps: (1) No audited
    financial statements are publicly available; (2) No ARR or revenue figures have been disclosed; (3) No burn rate or runway
    figure has been disclosed; (4) No gross margin data is available (the platform is pre-operational); (5) No unit economics
    (CAC, LTV, payback period) have been disclosed; (6) The capital allocation between operating expense and bank regulatory
    capital has not been disclosed; (7) The FDIC application and its terms are not publicly available. The financial verdict
    on Augustus is entirely conditional on the FDIC approval and initial client onboarding milestones. Revenue quality—once
    initiated—should be high: multi-year enterprise contracts with switching costs create predictable, high-quality ARR. Margin
    path is favorable: chartered bank infrastructure SaaS businesses typically achieve 60–75% gross margins. Capital intensity
    is elevated vs. typical SaaS because bank charter requirements consume a large share of raised capital as regulatory capital.
    The diligence timeline should be structured around the FDIC approval decision, which is the single gating event for the
    business to go from pre-revenue to revenue stage.'
  claimRefs:
  - CI020
  - CI021
  - CI022
  - CI023
  - CI024
  - CI025
