- id: capital-adequacy
  title: Capital Adequacy and Financing Dependency
  body: 'As a nationally chartered bank, Augustus is subject to OCC and Federal Reserve Board capital adequacy requirements.
    The OCC ''well-capitalized'' threshold requires a minimum total risk-based capital ratio of 10%, Tier 1 capital ratio
    of 8%, and leverage ratio of 5%. With approximately $240M raised across all rounds and a pre-operational balance sheet
    (no loans or deposits to risk-weight), Augustus is comfortably above minimum capital thresholds as of July 2026. The bank
    must maintain these ratios continuously; as it grows its deposit base and balance sheet, additional capital infusions
    may be needed. A rough sizing: if Augustus targets $2B in client deposits by year 3 (comparable to Column''s current asset
    base), it would need approximately $200M in regulatory capital—close to its current capital base, implying limited headroom
    for rapid deposit growth without a subsequent capital raise. Burn rate: Augustus has not disclosed monthly operating expense
    or burn rate. Industry benchmarks for early-stage chartered banks and BaaS infrastructure companies with 50–100 employees
    suggest $5–10M/month in total operating expense (engineering, compliance, legal, sales). At $5M/month burn on a $240M
    total raised, theoretical runway is 24–48 months. However, a significant portion of raised capital ($100–150M estimated)
    must be preserved as bank regulatory capital and cannot be consumed as operating expense, reducing effective operating
    cash to roughly $90–140M and implying an effective runway of 9–28 months. The Series B funding round (July 2026, $180M)
    is the primary capital event. The company described the use of proceeds as bank capitalization, technology build-out,
    regulatory completion, and international market expansion. No debt financing or project-finance obligations have been
    disclosed. Next-round trigger: likely FDIC approval and first anchor client revenue generation, which would convert the
    pre-operational story to a revenue stage and justify a potential Series C or strategic partnership.'
  claimRefs:
  - CI013
  - CI014
  - CI015
  - CI016
  - CI017
  - CI018
  - CI019
