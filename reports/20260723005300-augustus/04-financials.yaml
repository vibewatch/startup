  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: All core financial metrics (ARR, burn, margin)
    missingEvidence: No ARR, burn rate, gross margin, headcount, runway figure, or customer pipeline data has been publicly
      disclosed by Augustus. This is the most material financial diligence gap.
    whyItMatters: Without these metrics, it is impossible to assess whether Augustus is tracking toward the financial milestones
      required to justify its $1B valuation.
    diligencePath: Request data room access with audited FY2024 and FY2025 financial statements, monthly management accounts,
      and customer pipeline detail.
    relatedQuestionRefs:
    - QI007
    - QI008
    - QI009
  - type: private-evidence-only
    severity: blocking
    topic: FDIC application timeline and terms
    missingEvidence: The FDIC insurance application for Augustus has not been publicly filed or disclosed. The timeline for
      approval is unknown and has material impact on revenue start date and effective operating runway.
    whyItMatters: Every month of FDIC approval delay directly reduces operating runway (estimated $90-140M effective cash)
      by $5-10M.
    diligencePath: Obtain legal counsel to track FDIC process; request management's internal FDIC timeline and progress milestones.
    relatedQuestionRefs:
    - QI022
    - QI019
  - type: missing-source
    severity: material
    topic: Tiger Global investment thesis for Augustus
    missingEvidence: Tiger Global has not made any public statement about its Augustus investment rationale. No investor commentary
      from any Series B participant has been found beyond the press release.
    whyItMatters: Understanding the lead investor's financial thesis and return expectations would clarify the expected exit
      pathway and financial milestones that would trigger a Series C or strategic exit.
    diligencePath: Request Tiger Global partner meetings; check Tiger Global LP letters for portfolio commentary on Augustus.
    relatedQuestionRefs:
    - QI021
    - QI014
    - QI024
  - type: enumeration-incomplete
    severity: minor
    topic: Revenue streams table coverage
    missingEvidence: The revenue streams table (TI001) may miss fee streams from securities custody, treasury management,
      or CBDC reserve services that Augustus could add as the bank matures.
    whyItMatters: Undisclosed or future revenue streams could materially increase TAM for Augustus as a chartered bank, but
      are not yet factored into any financial model.
    diligencePath: Review Augustus product roadmap in data room; monitor product launches after FDIC approval.
    relatedTableRefs:
    - TI001
    relatedQuestionRefs:
    - QI010
  - type: private-evidence-only
    severity: material
    topic: Pre-launch customer contracts or LOIs
    missingEvidence: No signed LOIs, pre-launch customer contracts, or anonymized pipeline data have been publicly disclosed.
      Kraken is the only named client reference, with no contractual value disclosed.
    whyItMatters: Pre-launch customer commitments would de-risk the revenue ramp assumption and validate the product-market
      fit before FDIC approval.
    diligencePath: Request signed LOI count, aggregate pipeline value, and stage breakdown from management. Request reference
      calls with 2-3 named customers (under NDA if needed).
    relatedQuestionRefs:
    - QI023
    - QI011
    - QI020
