  - TI005
  figureRefs:
  - FI003
- id: financial-verdict
  title: Financial Verdict
  body: 'Augustus is a high-optionality, high-risk pre-revenue bank startup. Its financial position as of July 2026 rests
    entirely on three pillars: (1) $240M of capital, a significant proportion of which is reserved as bank regulatory capital;
    (2) A conditional OCC charter that, once FDIC-insured, converts to a genuine revenue-generating asset; (3) A market thesis
    (international fintech USD banking access) supported by structural tailwinds (GENIUS Act, correspondent banking decline)
    but validated by no disclosed customer pipeline or contract data. The $1B valuation implies that investors are pricing
    in the successful outcome: FDIC approval, first anchor client revenue, and a 3–5 year path to Column-comparable financials
    ($200M+ revenue, profitability). On those assumptions the valuation is defensible but aggressive: Column N.A. reached
    $200M revenue with ~$145M equity base; Augustus would need to achieve that with $240M in raised capital and the additional
    drag of bank regulatory capital constraints. The adverse financial scenario is equally plausible: FDIC approval takes
    18+ months, first revenue is delayed, and the effective operating runway (estimated $90–140M net of regulatory capital)
    is consumed without anchor client conversion, requiring a dilutive down-round or capital restructuring. Investors must
    obtain: audited financial projections, management''s capital allocation model (regulatory capital vs. operating budget),
    and a detailed FDIC approval timeline from counsel before committing.'
  claimRefs:
  - CI026
  - CI027
  - CI028
  - CI029
  - CI030
