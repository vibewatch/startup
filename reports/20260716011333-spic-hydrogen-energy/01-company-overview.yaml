- id: leadership-and-governance
  title: Leadership, governance, and key-person dependence
  body: The most important governance change in the current public record is the January 2026 leadership reshuffle. Tencent’s January coverage says Yang Yufeng became party secretary and was recommended as chairman, while founder-era chairman Li Lianrong shifted to a director-style oversight role and Zhang Yingguang temporarily handled management operations. That transition matters because SPIC Hydrogen Energy is moving from a technology-building phase toward IPO preparation and larger-scale commercialization, so governance structure and execution cadence now matter almost as much as R&D depth. Public leadership coverage remains only partially transparent. Core names such as Wang Meng and the board roster appear in secondary profiles, and SPIC’s own reporting highlights a young, highly educated R&D workforce, but the market still lacks a public-company level management chart, committee structure, and ownership disclosure map. The chapter therefore supports a favorable view on leadership
    quality and state backing, but it also flags key-person dependence and disclosure thinness as genuine diligence issues rather than clerical omissions.
  claimRefs:
