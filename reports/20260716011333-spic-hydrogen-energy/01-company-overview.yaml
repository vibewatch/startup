company:
  name: SPIC Hydrogen Energy
chapter:
  number: 1
  title: Company Overview
  summary: 'SPIC Hydrogen Energy is a Beijing-based, SPIC-controlled hydrogen technology platform founded in 2017 and now moving from state-backed industrial build-out toward IPO preparation. Public evidence strongly supports the company’s breadth across fuel-cell systems and PEM electrolyzers, its record CNY 4.5 billion 2022 Series B at a CNY 13 billion valuation, and milestone deployments from the Beijing Winter Olympics to Antarctica. The central caveat is disclosure opacity: revenue, customer concentration, and the exact post-Series C valuation remain private, so the company’s overview thesis rests on technology breadth and strategic backing more than on audited financial proof.'
sections:
- id: identity-and-positioning
  title: Identity, ownership, and strategic positioning
  body: 'SPIC Hydrogen Energy is best understood as the hydrogen-specialty platform incubated inside China’s State Power Investment Corporation rather than as a freestanding venture startup. Public profiles consistently describe the company as founded in 2017 to attack two linked bottlenecks: the lack of domestic control over critical hydrogen materials and equipment, and the need to turn hydrogen from a policy slogan into a scalable clean-energy application set. That framing matters because it explains why the company sits across both fuel-cell systems and PEM electrolyzers, rather than specializing in just vehicles or just hydrogen production. SPIC’s own long-form profile ties the business to a “dual-line” strategy spanning energy applications and equipment localization, while later coverage emphasizes a full-stack materials-to-system chain. The practical result is a company that sells technology, but whose underlying mission is partly industrial policy: reduce import dependence in catalysts,
    membranes, MEAs, bipolar plates, stacks, and systems while using SPIC’s state-backed platform to commercialize hydrogen in power, transport, and industrial settings. Public sources place the headquarters in Beijing and repeatedly describe the company as a national hydrogen champion preparing for the next stage of scale.'
