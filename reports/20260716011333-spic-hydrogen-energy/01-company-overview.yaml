callouts:
- calloutType: strength
  title: Rare full-chain hydrogen positioning inside a top-five power group
  body: SPIC Hydrogen Energy combines unusual parent support with a rare effort to localize hydrogen materials, stacks, systems, and PEM equipment under one platform, which few Chinese peers can match end to end.
  claimRefs:
  - CO002
  - CO005
  - CO006
  - CO011
- calloutType: risk
  title: IPO narrative is ahead of public financial transparency
  body: The IPO process appears real, but the public record still lacks audited revenue, margin, and customer-concentration data, which means investors are being asked to underwrite technology and policy position before seeing operating proof.
  claimRefs:
  - CO018
  - CO022
  - CO040
- calloutType: insight
  title: Antarctica matters because it compresses the company story into one proof point
  body: The Antarctica deployment simultaneously supports SPIC Hydrogen Energy’s claims on low-temperature reliability, application breadth, and state-backed mission relevance, making it one of the chapter’s most important non-financing milestones.
