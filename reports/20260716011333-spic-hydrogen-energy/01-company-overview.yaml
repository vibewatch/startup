- id: funding-valuation-and-ipo
  title: Funding history, valuation, and IPO trajectory
  body: The capital formation story is strong by domestic hydrogen standards. The best-documented financing event is the December 2022 Series B, when Yicai reported a CNY 4.5 billion raise at a CNY 13 billion post-money valuation. That round brought in major state-backed funds and expanded the shareholder list to 35, underlining both capital access and future cap-table complexity. Later public evidence points to a November 2024 Series C, but the amount and resulting valuation remain opaque. That gap is meaningful because the company’s public narrative now mixes “highest-valued hydrogen unicorn” language with an active STAR Market IPO process, yet investors still lack the auditable bridge from the 2022 valuation to today’s implied price. Multiple 2025 media reports nevertheless agree that SPIC Hydrogen Energy formally kicked off sponsorship and underwriting selection, making the IPO pathway more concrete than rumor. In short, the company appears well financed and politically supported, but
    public valuation confidence still rests more on fundraising signaling and state-strategic importance than on disclosed operating metrics.
