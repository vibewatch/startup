- id: deployment-certifications-and-roadmap
  title: Deployment proof, certifications, and roadmap visibility
  body: 'Public proof of progress is strongest in milestone form. The company has third-party certification for its 500 Nm³/h PEM electrolyzer, a government-recognized 2 MW single-cell PEM milestone, more than 10,000 accumulated operating hours on Qingyong, and a later 10,000 Nm³/h deployment milestone reported in 2026. On the fuel-cell side, public sources support more than 2,000 systems delivered, more than 40 million kilometers of operation, 30 traction trucks delivered in late 2024, marine CCS certification, and highly symbolic Antarctic deployment. Together, those facts show that SPIC is no longer merely prototyping. It has crossed into real deployment and industrial validation territory. The roadmap is also visibly active: recruiting, exhibition presence, and FCVC2026 coverage all suggest a company still broadening applications and capacity. The limitation is that milestone density is not the same thing as transparent performance disclosure. Public readers can see movement; they still
    cannot see the full test data pack behind it.'
  claimRefs:
