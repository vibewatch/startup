- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - SPIC solution
  - Measurable benefit
  - Limitation
  rows:
  - - Deploy hydrogen fuel-cell vehicles
    - Integrate stack, certify vehicle, deliver fleet, support operations
    - Hydrogen Teng systems and component stack
    - Public delivery and mileage proof show real use, not just lab testing
    - No public fleet-level reliability or warranty statistics
  - - Build hydrogen production capacity
    - Engineer power connection, install PEM stacks, run hours, manage utilization
    - Hydrogen Yong PEM electrolyzers
    - Certification and operating-hour milestones increase credibility for project buyers
    - No public project IRR or efficiency benchmarking pack
  - - Expand into harsh or special environments
    - Adapt system to marine, Antarctic, or other edge conditions
    - Marine-certified and Antarctic-referenced fuel-cell applications
    - Supports a robustness narrative beyond standard buses
    - Symbolic deployments do not prove scaled recurring revenue
  - - Scale manufacturing output
    - Move from pilots into repeatable plant delivery
    - Wuhan production base and broader state-backed industrial footprint
    - Physical production infrastructure lowers prototype risk
    - Capacity, scrap, yield, and receivable data remain private
  - - Enter automotive supply chains
    - Win sourcing approval under quality-management requirements
    - IATF 16949 certification for full fuel-cell chain products
    - Improves procurement readiness for OEM-style buyers
    - Certification alone does not guarantee sustained volumes
  notes: The workflow table separates mobility-system and electrolyzer-project motions because they create different integration and diligence burdens.
