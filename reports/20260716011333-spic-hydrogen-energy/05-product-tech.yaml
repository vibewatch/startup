- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Fuel-cell stack and key components
    - Convert hydrogen into onboard electrical power for vehicles and special applications
    - Materials, manufacturing yield, and vehicle integration discipline
    - Field-failure or cost overruns can quickly undermine fleet economics
  - - PEM electrolyzer stack
    - Produce hydrogen from electricity and water at project scale
    - Catalyst, membrane, bipolar-plate, and system-engineering capability
    - Cost and durability challenges can block wider adoption
  - - Manufacturing base and test infrastructure
    - Turn milestones into repeatable production and delivery
    - Plant throughput, quality systems, and working-capital control
    - Production bottlenecks or low yield can weaken commercialization
  - - Certification and standards interfaces
    - Translate lab performance into procurement-ready product status
    - Third-party certifiers, CCS, IATF, and policy-aligned standards
    - Certification gaps can slow automotive or industrial sourcing
  - - Project integration and after-sales support
    - Connect equipment to vehicles or hydrogen projects and keep it operating
    - OEM partners, fleet operators, EPCs, and field service capabilities
    - Support burden is hard to price when public RMA and warranty data are absent
  notes: Architecture is described at the system layer the public evidence supports; the chapter does not infer undisclosed proprietary control software or process details.
