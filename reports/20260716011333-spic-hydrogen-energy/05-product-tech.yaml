company:
  name: SPIC Hydrogen Energy
chapter:
  number: 5
  title: Product & Technology
  summary: SPIC Hydrogen Energy has a much more concrete hardware stack than a typical early-stage hydrogen narrative. Public evidence supports two flagship product families — the Hydrogen Teng fuel-cell systems for mobility and special applications, and the Hydrogen Yong PEM electrolyzer line for hydrogen production — plus visible manufacturing, certification, and deployment milestones across trucks, marine power, Antarctic use, and megawatt-scale electrolysis. The technical core looks credible and increasingly industrialized, but the public record still says far more about milestones and certifications than about benchmark methodology, field reliability, software/control interfaces, or unit-level performance economics.
sections:
- id: product-lines-and-customer-workflow
  title: Product definition in buyer and workflow terms
  body: SPIC Hydrogen Energy’s product story is not a single stack or one demonstration vehicle. The visible commercial surface is split into two hardware-led families. Hydrogen Teng covers fuel-cell systems and core components for mobility and special-use power scenarios such as buses, heavy trucks, ships, drones, and stationary or auxiliary power. Hydrogen Yong covers PEM electrolyzer equipment for hydrogen production projects. The buyer workflows behind those lines are materially different. Fuel-cell customers need vehicle integration, certification, delivery, and after-sales support. Electrolyzer customers need project engineering, power integration, operating-hour reliability, and increasingly large single-site throughput. That split matters because it makes SPIC look less like a one-product startup and more like a state-backed hydrogen equipment platform spanning both downstream use and upstream hydrogen supply. The official and third-party record supports that platform framing, but
    it also shows that product maturity is still communicated mainly through milestones rather than through transparent benchmark packs.
  claimRefs:
