tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / product line
  - User / buyer
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Hydrogen Teng fuel-cell systems
    - Commercial-vehicle OEMs, fleet integrators, special-application operators
    - Commercialized with multi-year deployment proof
    - State-backed stack and component localization plus multi-scenario application range
    - Need per-platform efficiency, durability, and repeat-order metrics
  - - Hydrogen Yong PEM electrolyzers
    - Green-hydrogen project developers and industrial hydrogen operators
    - Commercialized with certification and megawatt-scale proof
    - Early Chinese leadership in large single-stack PEM milestones
    - Need utilization, efficiency, degradation, and project economics by site
  - - Fuel-cell core components
    - Internal systems teams and external automotive supply-chain evaluators
    - Publicly emphasized as localized and independently developed
    - Supports cost, standards access, and supply-chain control narrative
    - Need yield, supplier mix, and external sales-share disclosure
  - - Marine fuel-cell generation system
    - Marine or auxiliary-power integrators
    - Third-party certified
    - Shows extension beyond road vehicles into regulated non-road use
    - Need install base and commercial repeatability
  - - Extreme-environment fuel-cell deployments
    - Scientific or remote-site power applications
    - Demonstrated
    - Proves branding value and systems resilience in unusual environments
    - Need details on economics and support burden
  - - Manufacturing base and pilot lines
    - Internal production, OEM customers, and project buyers
    - Operational and scaling
    - Visible physical production footprint reduces “lab-only” risk
    - Need nameplate capacity, throughput, and field-quality data
  notes: Rows summarize the public product surface that can be tied to official or third-party evidence; they do not imply disclosure of every SKU or variant.
