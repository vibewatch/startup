- id: architecture-manufacturing-and-differentiation
  title: Architecture, manufacturing base, and what the technology stack appears to depend on
  body: 'The architecture implied by the public evidence is classic industrial hydrogen hardware, not pure software. For the fuel-cell line, SPIC emphasizes stack and component autonomy, application engineering, and systems delivery into vehicles and special environments. For the electrolyzer line, the evidence centers on PEM stack scale, operating hours, certification milestones, and deployment into green-hydrogen projects. Manufacturing matters because these products only become commercially relevant when membranes, catalysts, stacks, balance-of-plant integration, and downstream delivery work together. The Wuhan hydrogen base is therefore more than a real-estate footnote: it is one of the few public indicators that the company is building repeatable production infrastructure rather than isolated pilots. External technical context is also important. Independent technical literature shows why PEM electrolysis is strategically attractive — dynamic response and high-purity hydrogen — but also
    why it remains cost sensitive. That cost pressure increases the importance of component localization, yield, and standards access as differentiators.'
  claimRefs:
