- id: expansion-opportunity-and-concentration-risk
  title: Expansion upside is real, but so is concentration and policy dependence
  body: 'The upside case for SPIC’s customer base is straightforward. National policy has broadened hydrogen pilots from transport into industrial applications, meaning the addressable customer set should widen if equipment costs, hydrogen economics, and infrastructure continue improving. That logic supports an eventual move from city-cluster transport demos into more varied industrial and project demand. The risk case is just as clear. Today’s public record implies dependence on a small set of OEMs, logistics operators, and government-linked programs. Market-wide hydrogen-vehicle growth is still uneven, and several sector reports continue to frame economics and utilization as the gating issues for larger scale-up. That means one should not read flagship deliveries as proof that customer concentration risk is solved. The current public verdict is therefore balanced but cautious: SPIC has genuine adoption and credible expansion paths, but the proof base remains too narrow and policy-shaped
    to underwrite a highly diversified customer franchise with confidence. The missing bridge is disclosed revenue concentration and customer-level renewal proof.'
