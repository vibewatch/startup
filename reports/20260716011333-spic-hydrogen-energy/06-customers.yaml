tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Public proof
  - Strategic value
  - Gap
  rows:
  - - Commercial logistics fleets
    - Buyer = fleet operator and OEM; user = drivers and fleet operations; payer = fleet capex plus policy-backed transport budgets
    - Urban distribution, cold-chain, and freight delivery
    - Hydrogen Motion Tech / Yutong delivery, Wuhan logistics deployment, traction-truck delivery
    - Most concrete current adoption lane
    - No disclosed customer count, route economics, or fleet-level retention
  - - Commercial-vehicle OEM partners
    - Buyer = OEM platform teams; user = vehicle engineering and homologation teams; payer = OEM program budget
    - Integrate fuel-cell systems into trucks, buses, or passenger demonstrators
    - Yutong, Dongfeng-linked deployment, FAW-related Hydrogen Teng-S program
    - Critical leverage because OEM wins can scale quickly
    - Public evidence mixes production, R&D, and showcase stages
  - - Policy-backed city-cluster platforms
    - Buyer = local-government-led city-cluster programs; user = operators, fleets, and industrial sites; payer = mixed public-private funding
    - Demonstration, scaling support, and cost-down pilots
    - 2026 tri-ministry hydrogen pilot notice, Zhengzhou officials at delivery event
    - Expands deployment runway and lowers first-customer friction
    - Highly policy-shaped demand can reverse or stall
  - - Industrial hydrogen project developers
    - Buyer = project developer or industrial operator; user = plant and project operations; payer = project capex
    - PEM electrolyzer deployment and green-hydrogen production
    - Changchun Qingyong project, later 10,000 Nm³/h deployment signal
    - Opens a second customer lane beyond mobility
    - Account-level roster and economics remain opaque
  - - Special-use and non-road operators
    - Buyer = marine, remote-site, or scientific-use integrators; user = specialized operations teams; payer = project-specific capex
    - Marine generation, harsh-environment or remote deployment
    - CCS-certified marine system, Antarctic application, SASAC deployment breadth article
    - Proves technical range and reference breadth
    - Commercial repeatability is less visible than symbolic value
  notes: The segmentation table ties customer groups to the proof surfaces the public record actually supports; it does not assume a broad enterprise channel that sources do not show.
