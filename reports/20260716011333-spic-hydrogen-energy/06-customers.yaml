company:
  name: SPIC Hydrogen Energy
chapter:
  number: 6
  title: Customers
  summary: 'SPIC Hydrogen Energy has better public adoption proof than many private hard-tech peers, but the proof is still concentrated in policy-backed flagship deployments rather than in a broad, transparent customer roster. Public evidence supports real fleet deliveries with Yutong and Hydrogen Motion Tech, Dongfeng-linked logistics deployment, a passenger-fuel-cell program involving FAW-related partners, and visible electrolyzer showcase projects such as Qingyong. What remains missing is exactly what late-stage investors would want most: account count, retention, concentration, contract economics, and customer-reference depth beyond a handful of named or semi-named programs.'
sections:
- id: customer-segments-and-where-proof-exists
  title: 'Customer segments: mobility fleets first, industrial projects second'
  body: 'SPIC Hydrogen Energy’s public customer record is best understood as a two-lane market. One lane is mobility: commercial logistics fleets, heavy-duty and traction applications, OEM integration programs, and adjacent bus or passenger-vehicle development. The second lane is industrial hydrogen: project-side electrolyzer deployments and broader green-hydrogen use cases tied to policy-backed expansion. That split matters because the customer proof, procurement motion, and durability metrics are very different in each lane. The mobility lane offers the clearest named evidence, especially where OEMs, fleet operators, and local governments appear together. The industrial lane offers clearer strategic logic but weaker account-level transparency, because electrolyzer proof is usually communicated through projects and showcase milestones rather than through customer cohorts. Across both lanes, the public story is much more B2B and programmatic than consumer-like. Buyers appear to be OEMs,
    fleet operators, project developers, and government-linked platforms, not thousands of small independent accounts.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU013
  - CU014
  - CU016
  - CU030
  - CU032
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory-and-largest-visible-programs
  title: 'Adoption trajectory: the Zhengzhou fleet delivery is the strongest named proof point'
  body: 'The strongest public customer proof in this chapter is the Zhengzhou logistics program. Independent and partner sources agree that 230 Yutong-built hydrogen logistics vehicles carrying SPIC’s Hydrogen Teng engines were delivered to Hydrogen Motion Tech in late 2024, and that the event also included a strategic signing for 260 more vehicles. That combination matters because it shows not just symbolic shipment but also an early land-and-expand signal. Other public adoption points are real but thinner. Wuhan-zone reporting tied Qingteng systems to Dongfeng commercial vehicles and a local logistics company, while SPIC separately disclosed delivery of 30 Hydrogen Teng traction trucks. Industrial hydrogen proof is even more project-centric: Qingyong’s named Changchun showcase and the later 10,000 Nm³/h deployment reported in 2026 establish customer-side relevance, but they do not disclose repeat-order rates or account economics. Put simply, adoption is real, yet still concentrated in
    a small number of large, publicly narrated programs.'
