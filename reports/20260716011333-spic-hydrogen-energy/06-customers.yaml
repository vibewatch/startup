- id: reference-quality-durability-and-what-is-missing
  title: Reference quality is adequate for adoption proof, weak for durability proof
  body: SPIC’s named public references are good enough to clear the “is this real?” threshold and not yet good enough to clear the “is this diversified and durable?” threshold. Yutong, Hydrogen Motion Tech, Dongfeng-linked logistics deployment, FAW-related passenger-fuel-cell work, and Changchun’s Qingyong showcase are all meaningful. But they are not equivalent proof categories. Completed vehicle delivery is stronger than a strategic signing; a research-project launch is weaker than a scaled commercial program; a government showcase is not the same thing as a repeat-purchase cohort. This distinction matters because the public record stays silent on core durability metrics. There is no public customer-count figure, no NRR or churn, no concentration schedule, no contract-length disclosure, and no broad review or satisfaction metric set that could help distinguish happy flagship customers from policy- or subsidy-shaped demo users. Investors can therefore confirm traction, but not yet portfolio
    quality.
