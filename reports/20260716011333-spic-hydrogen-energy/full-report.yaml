            body: >-
              SPIC has a clear advantage on capital access relative to the typical hard-tech startup. The 2022 Series B
              alone brought in CNY 4.5 billion, and public reports point to an additional Series C in late 2024. That
              makes lifetime public capital of roughly CNY 6.6 billion plausible, even though the latest round economics
              remain opaque. The company also appears willing to keep investing in production capacity, as shown by the
              Wuhan Green Drive capital injection in 2025. These facts imply meaningful runway support. But they do not
              resolve the core question of burn. Retained sources do not disclose cash, monthly losses, or runway
              months, and the capital-intensive nature of the sector means large fundraising totals can still disappear
              into factories, pilots, inventory, and receivables. The current financial judgment is therefore that SPIC
              is better financed than many peers, yet still dependent on continued capital access and a successful path
