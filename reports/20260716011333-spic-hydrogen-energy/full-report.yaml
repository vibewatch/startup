  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing discipline
        blocks:
          - type: paragraph
            body: >-
              The key market mistake for SPIC Hydrogen Energy is to treat the company as exposed to the whole hydrogen
              economy. It is not. The company sells into narrower spend pools: fuel-cell systems for transport and power
              applications, PEM electrolyzer equipment for green-hydrogen projects, and a subset of upstream materials
              and ecosystem integration work that support those two lines. That distinction matters because top-down
              hydrogen TAM claims are often inflated by including all hydrogen consumption, all station spend, all
              industrial uses, or entire global decarbonization capex pools. A more defensible lens starts with the
              Chinese commercial fuel-cell system market and the domestic PEM electrolyzer market, then asks how much of
              that spend is actually reachable under current policy, infrastructure, and project-finance conditions. It
              also requires separating installed base, annual sales flow, project announcements, and real operating
              capacity, because those metrics can point in different directions at the same time. Public evidence
              supports a large long-run opportunity, but the near-term SAM remains much smaller and more
              policy-concentrated than promotional market maps imply.
            claimRefs:
              - CM001
              - CM002
              - CM003
