      - number: '3.2'
        title: Where SPIC appears advantaged
        blocks:
          - type: paragraph
            body: >-
              SPIC’s clearest public strengths are structural rather than accounting-based. Parent-group backing from
              SPIC gives it unusual project access, credibility with state-linked buyers, and room to bridge longer
              commercialization cycles. The company also publicly claims a deeper localization chain than most peers,
              extending from materials such as catalysts and membranes through stacks and systems. Finally, it has
              visibly built two product lines—fuel cells and PEM electrolyzers—rather than only one. Those attributes
              matter because buyers in China’s hydrogen market often care about domestic-control narratives, policy fit,
              and whole-project execution as much as they care about lab metrics. Visible deployments at the Winter
              Olympics and Antarctica strengthen the trust layer further by demonstrating that SPIC has shipped hardware
              into politically sensitive and technically difficult environments. In a market where procurement
              committees often want reliability signals before they want marketing copy, that kind of demonstration
              evidence has outsized competitive value.
