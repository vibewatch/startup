      - number: '8.4'
        title: 'What would change the call: a better price, harder numbers, or both'
        blocks:
          - type: paragraph
            body: >-
              The recommendation can improve in two ways: evidence improves, or price improves. Evidence improvement is
              the more likely path. The missing package is specific and investment-critical: audited revenue, backlog by
              product line, segment gross margins, warranty and service burden, top-customer concentration, cap-table
              preference detail, and an underwriter-supported IPO valuation range. These are not cosmetic asks. They
              determine whether SPIC is merely a strategically important hydrogen company or a business whose economics
              can support a premium public-market outcome. The price path matters too. If the company were forced to
              market below the last disclosed CNY13 billion private valuation, that would not automatically destroy the
              thesis; it could simply reflect public-market realism. The real thesis-breaks are harsher: a weak draft
              IPO range, evidence of heavier burn or impairment than expected, a failed flagship customer ramp, or
              policy demand proving shallower than management hoped. Committee-style, the conclusion is simple: do not
              dismiss SPIC, but do not let strategic narrative substitute for valuation proof.
            claimRefs:
              - CV008
