              Guofu’s later loss warnings show that hydrogen-equipment companies can keep growing technically while
              still burning significant capital. REFIRE’s public-market path shows the sector can reach the equity
              market, but not that it has solved economics. Those read-throughs matter because they constrain how
              investors should interpret SPIC’s strong capital base and policy backing. The most likely current state is
              a company that is better funded and strategically stronger than many peers, but still not publicly proven
              on profitability, cash conversion, or backlog quality. In other words, capital access is a strength, not a
              substitute for revenue quality. The financial chapter therefore lands on a cautious conclusion: SPIC
