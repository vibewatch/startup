companyProfile:
  summary: >-
    SPIC Hydrogen Energy is SPIC’s dedicated hydrogen-technology platform, founded in 2017 and based in Beijing, with a
    business spanning fuel-cell systems, PEM electrolyzers, and vertically integrated core materials. Public evidence
    shows an unusual combination of state-parent support, hard-tech financing scale, visible commercialization
    milestones, and active IPO preparation, including a CNY4.5B Series B at a CNY13B valuation in 2022, a later but
    undisclosed Series C in 2024, more than 2,000 delivered fuel-cell systems, and megawatt / 10,000-Nm3/h PEM
    milestones. At the same time, the company remains a private, economically opaque industrial platform whose current
    revenue, margins, backlog, and cap-table details are still not public.
