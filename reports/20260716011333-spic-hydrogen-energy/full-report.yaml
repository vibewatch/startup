      - number: '3.3'
        title: Where SPIC’s competitive case is less proven
        blocks:
          - type: paragraph
            body: >-
              The public record is less convincing when the question shifts from strategic positioning to measurable
              operating superiority. SPIC is private, so analysts cannot compare revenue quality, customer
              concentration, service revenue, or margin resilience as cleanly as they can for public peers. Direct peers
              may also be more focused in their core lanes. That does not automatically make them better, but it means
              SPIC’s breadth could turn into distraction if both transport fuel cells and PEM electrolyzers become more
              price-competitive at the same time. The market’s structure also limits any single player’s power:
              battery-electric substitutes pressure some transport routes, buyers can multi-source parts of the value
              chain, and electrolyzer procurement may commoditize faster than the integrated-champion narrative assumes.
              Said differently, the most important unknown is not whether SPIC has a story, but whether that story
              produces superior economics under real tender and service conditions.
