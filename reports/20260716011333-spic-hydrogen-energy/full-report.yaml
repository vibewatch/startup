  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Metric
      - Multiple / valuation / status
      - Relevance
      - Limitation
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Covers the public and quasi-public comparables most useful for triangulating SPIC’s valuation as of 2026-07-16:
        listed Chinese hydrogen equipment names, a recent Chinese hydrogen IPO, troubled global pure plays, and a mature
        hydrogen-adjacent quality benchmark.
    rows:
      - - SPIC Hydrogen Energy
        - Last disclosed private round anchor
        - CNY13B post-money in Dec. 2022; Series C later disclosed without amount
        - Direct anchor for what investors last know publicly about price
        - Not a current mark because later financing terms remain undisclosed
      - - Beijing SinoHytec
        - Listed Chinese fuel-cell pure play
        - ~CNY3.97B market cap; deeply negative profitability
        - Closest public read-through for domestic fuel-cell-system valuation pressure
        - Narrower business mix and weaker state-backing than SPIC
      - - Jiangsu Guofu Hydrogen Energy
        - Listed Chinese electrolyzer / hydrogen equipment name
        - ~HK$1.425B market cap; 2026 profit warning; market cap down sharply from end-2024
        - Shows how hard public investors punish weak conversion from policy tailwinds to earnings
        - Business mix differs and market cap is post-listing, not late-stage private
      - - REFIRE
        - Recent Chinese hydrogen IPO path
        - 2024 Hong Kong prospectus range HK$145-HK$165 per share; OMM cited ~US$91M IPO
        - Proves capital-market access exists for hydrogen names
        - Offer terms do not by themselves prove durable aftermarket or profitability
      - - Plug Power
        - Global hydrogen pure play
        - ~US$3.17B market cap with large trailing losses
        - Useful cautionary comp for how public markets treat persistent losses
        - US policy and company history differ materially from SPIC
      - - Ballard Power
        - Global fuel-cell pure play
        - ~US$883M market cap with heavy negative margin
        - Useful floor-like cautionary comp for fuel-cell pure-play skepticism
        - Canadian listing and slower growth profile limit direct transfer
      - - Linde
        - Mature hydrogen-adjacent quality benchmark
        - ~US$241.59B market cap with healthy profitability
        - Shows the ceiling-like value of proven industrial-gas and hydrogen infrastructure economics
        - Far more mature and diversified than any startup-like hydrogen equipment name
      - - Bloom Energy
        - Adjacent listed fuel-cell / distributed-power name
        - ~US$69.23B market cap with only marginal profitability
        - Shows markets can reward scale even before strong margins fully mature
        - Business model and product set are not cleanly comparable to SPIC
    notes: >-
      This table intentionally mixes private-round anchors, public market caps, and IPO-status references rather than
      pretending there is one clean multiple that fits SPIC today.
