  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and safety risk is rising as hydrogen moves from slogan to operations
        blocks:
          - type: paragraph
            body: >-
              The legal and regulatory burden on SPIC is likely to rise as hydrogen deployment moves from showcase
              status into everyday operations. The new hazardous chemicals law, broader hydrogen standards work, and the
              2026 pilot architecture all point in the same direction: regulators increasingly care about how hydrogen
              is produced, stored, transported, used, documented, and supervised. That is a double-edged sword. Stronger
              frameworks can validate the sector, but they also make compliance failures more expensive. Specialist
              legal sources reinforce the point. Hydrogen projects create contract, IP, and liability questions that sit
              alongside classical industrial-safety obligations, while safety literature highlights leakage, fire,
              explosion, materials-compatibility, and emergency-response risk. The lack of public litigation or recall
              history is helpful, but not especially comforting. Hydrogen risk is often latent until deployment density
              and commercial throughput rise. For SPIC, legal and safety diligence should therefore be treated as a
              front-office risk question rather than as back-office paperwork.
