  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape overview
        blocks:
          - type: paragraph
            body: >-
              SPIC Hydrogen Energy competes in a fragmented Chinese hydrogen-equipment landscape rather than a single
              neat peer set. Its real direct peers are the companies selling fuel-cell systems, stacks, or PEM
              electrolyzers into the same state-linked and industrial procurement channels. That includes
              transport-focused system players such as SinoHytec and REFIRE, adjacent stack and systems firms such as
              Sunrise Power and Sinosynergy, and broader hydrogen-equipment companies such as Guofu Hydrogen. Global
              players like Ballard, Plug, and Cummins matter less as immediate China-route share takers and more as
              capability benchmarks for durability, platform breadth, and cumulative runtime. This matters because
              SPIC’s competitive status can look stronger or weaker depending on which lane is being measured:
              integrated domestic localization, transport systems, PEM equipment, or pure-play economics. Investors
              should therefore avoid asking whether SPIC is simply “number one” and instead ask where it is strongest,
              who is closest in each lane, and what proof is actually public for that ranking.
