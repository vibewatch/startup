  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation: research-more / track unless entry discipline improves'
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports SPIC Hydrogen Energy as a serious strategic hydrogen company, but not as an easy
              underwriting decision at or above the last clearly disclosed CNY13 billion mark. The positives are real:
              SPIC is state-backed, has raised unusual scale capital for a hard-tech company, spans both fuel cells and
              PEM electrolysis, and is visibly close enough to an IPO path that it has already tendered
              sponsor-and-underwriter services. Public product proof is also better than for many private climate-tech
              names. The company has delivered more than 2,000 fuel-cell systems, crossed 40 million kilometers of
              operation, and deployed a 10,000-Nm3/h PEM electrolyzer project. The problem is not credibility; it is
              price support. Public sources still do not disclose current revenue, gross margin, burn, backlog,
              cap-table preferences, or an updated round valuation after the undisclosed November 2024 Series C.
              Meanwhile, listed hydrogen equipment peers continue to show weak economics and materially lower
              public-market values. On public evidence alone, the right call is research-more / track, with medium
              confidence, high risk, and a valuation stance of stretched-to-fair only around the last disclosed private
              anchor rather than obviously cheap above it.
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV008
              - CV015
