        - Current revenue by line, signed backlog, and delivery conversion timing
        - Most direct missing inputs for valuation support
        - CFO / finance diligence request
      - - Gross margin and warranty burden
        - Segment gross margin, service cost, warranty reserve, and impairment detail
        - Determines whether scale improves economics or hides losses
        - Finance + operations diligence
      - - Customer concentration
        - Top-5 customers, backlog mix, and cancellation history
        - Determines whether current proof is diversified or still narrow
        - CEO / sales diligence
      - - Preference stack and dilution
        - Liquidation preferences, ratchets, investor protections, option pool, and secondary rights
        - Equity return can diverge sharply from enterprise-value growth
        - Corporate counsel / financing diligence
      - - IPO valuation range
        - Underwriter draft range, cornerstone appetite, and sensitivity assumptions
        - Most immediate public-market reality check on valuation stance
        - Lead-left bank diligence
      - - Secondary-market evidence
        - Any real transaction history behind brokered private-stock pages
        - Distinguishes noise from usable mark-to-market signals
        - Investor-relations + broker diligence
    notes: >-
      These asks are ranked by how much they change the recommendation, not by how easy they are for management to
      answer.
    claimRefs:
      - CV040
      - CV041
      - CV047
