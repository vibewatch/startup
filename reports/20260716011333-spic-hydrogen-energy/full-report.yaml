      - number: '2.2'
        title: Demand structure, buyers, and use-case concentration
        blocks:
          - type: paragraph
            body: >-
              Transport demand in China remains concentrated in commercial fleets rather than passenger cars, and even
              within transport the most important buyers are narrow groups such as truck OEMs, bus operators, fleet
              owners, local-government programs, and logistics ecosystems that can keep hydrogen assets highly utilized.
              That matters for SPIC because fuel-cell demand is not a broad retail market; it is a project-led market
              where buyer, user, and payer often differ. The buyer of an electrolyzer is different again: a state-owned
              energy developer, an ammonia project sponsor, a refinery-linked industrial operator, or an integrated
              green-hydrogen project owner. The combination means SPIC is selling into concentrated, relationship-heavy,
              and often state-mediated procurement channels. This is not necessarily bad—state concentration can
              accelerate adoption in favored regions—but it means customer acquisition is tied to policy fit and project
              execution, not just superior technology.
