      - number: '2.4'
        title: What the market structure means for SPIC
        blocks:
          - type: paragraph
            body: >-
              For SPIC Hydrogen Energy, the market takeaway is mixed but investable. The company benefits from
              long-duration policy support, a large parent, and dual exposure to both transport fuel cells and
              green-hydrogen electrolyzers. That gives it more strategic optionality than peers focused on only one
              lane. Yet the market structure also means SPIC is exposed to two different bottleneck sets at once.
              Fuel-cell demand depends on infrastructure density, fleet utilization, and cluster budgets, while PEM
              demand depends on project financing, power costs, and industrial offtake. The market is therefore large
              enough to matter, but still concentrated enough that investors should resist generic TAM optimism. It is
              also geographically clustered and relationship-heavy, which means winning a few high-value provincial or
              SOE programs can matter more than broad national awareness. Repeat-order visibility, not headline project
              count, is the clearest practical future proof of market quality. The right diligence posture is to
              underwrite segment-by-segment adoption, not to assume all hydrogen policy momentum converts into immediate
              equipment revenue.
            claimRefs:
              - CM025
              - CM026
              - CM027
              - CM028
              - CM033
              - CM035
              - CM036
