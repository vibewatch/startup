  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Weak IPO draft range
        - Indicative range materially below management expectations and below what stronger private investors imply
        - Signals public investors are discounting quality, growth, or governance harder than expected
        - Downgrade to pass unless new evidence offsets the market signal
      - - Heavier-than-expected burn or impairment
        - Private diligence reveals losses, impairments, or receivables stress materially worse than public peers imply
        - Turns strategic scale into a capital-consumption story
        - Re-underwrite from downside cases first
      - - Flagship customer ramps stall
        - One or more marquee mobility or industrial programs slip materially
        - Undercuts both growth timing and narrative proof
        - Cut bull case and tighten base case sharply
      - - Policy-to-demand transmission weakens
        - Subsidy logic or project approvals fail to convert into real equipment demand
        - Damages utilization and backlog assumptions
        - Reduce scenario ranges and delay investment
      - - Preference stack is punitive
        - Liquidation preferences, ratchets, or special rights absorb too much upside
        - Enterprise value growth no longer maps cleanly to equity return
        - Renegotiate entry or walk away
      - - Leadership / governance instability rises
        - IPO preparation coincides with broader management churn or disclosure inconsistency
        - Raises execution and public-market credibility risk
        - Pause until governance clarity improves
    notes: Kill triggers focus on what most quickly destroys the equity-return case, not on generic operating noise.
    claimRefs:
      - CV012
      - CV013
      - CV027
      - CV040
      - CV047
      - CV048
