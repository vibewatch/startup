      - number: '1.4'
        title: Milestones, scale signals, and unresolved caveats
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows real technical and commercialization progress. Fuel-cell systems have passed
              the visibility test through major showcases such as the Beijing Winter Olympics and, more unusually,
              through the March 2025 Antarctica deployment. On the electrolyzer side, public sources trace a path from
              early prototypes to 400 Nm³/h and then to a third-party-certified 500 Nm³/h system, followed by
              megawatt-scale recognition and the 10,000 Nm³/h Da’an deployment. These are meaningful signals because
              they move the company beyond a “policy concept” and toward shipping hardware in difficult environments. At
              the same time, the public record still has major holes. Revenue, ARR, named customer concentration,
              realized gross margin, and detailed production economics remain private. Even the company’s strongest
              scale claims—such as 2,000-plus systems delivered and 40 million kilometers of operation—are
              company-claimed rather than independently audited. The right overview conclusion is therefore positive but
              not complacent: SPIC Hydrogen Energy looks like a serious state-backed hydrogen platform with rare
              technical breadth, yet its IPO case still depends on converting technical legitimacy into public financial
              proof.
