  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction proxies
        blocks:
          - type: paragraph
            body: >-
              SPIC Hydrogen Energy’s public commercial model looks much closer to industrial hardware and project
              integration than to recurring software or simple commodity sales. The retained evidence shows two visible
              lines—fuel-cell systems and PEM electrolyzers—plus ecosystem work around deployment and integration. That
              matters because revenue will likely come in lumpy project increments rather than in smooth recurring
              monthly streams. Public evidence also suggests that the best operating proxies are not revenue figures but
              deliveries, cumulative mileage, flagship deployments, and equipment-scale milestones. The downside is
              obvious: those proxies prove technical progress better than they prove revenue quality. The company did at
              one point talk about a 2025 revenue target of CNY 5 billion, but retained sources do not publish actual
              FY2025 revenue, mix by product line, or customer concentration. Investors can therefore describe the
              model, but cannot yet cleanly measure the realized commercial output, conversion rate, and customer
              durability behind it.
            claimRefs:
