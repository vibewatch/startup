      - number: '8.2'
        title: 'Thesis versus anti-thesis: strategic quality is visible, pricing quality is not'
        blocks:
          - type: paragraph
            body: >-
              The bull case rests on strategic quality. SPIC is not a single-product experiment: it has meaningful
              fuel-cell deployment evidence, a credible PEM-electrolyzer roadmap, upstream materials depth, state-parent
              sponsorship, and a financing history that put it at the top end of China’s hydrogen-private-market
              hierarchy. China’s green-hydrogen build-out is also real, with 125,000 mt/year of capacity established by
              end-2024 and 35 new green-hydrogen projects added in 2024 alone. The anti-thesis is that public-market
              evidence remains much harsher than private strategic narrative. Actual electrolytic-hydrogen supply is
              still tiny relative to China’s total hydrogen output, the domestic FCEV market shrank in 2024, and listed
              peers such as SinoHytec and Guofu still post weak or loss-making economics while trading far below SPIC’s
              last disclosed private valuation anchor. In other words, investors can believe the company matters without
              believing that any undisclosed step-up in valuation is already earned. The anti-thesis is not that SPIC is
              low quality; it is that public evidence still does not show enough about revenue quality, margins, backlog
              conversion, or dilution to justify paying a premium simply because the company is strategically important.
            claimRefs:
