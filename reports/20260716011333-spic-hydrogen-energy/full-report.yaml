            body: >-
              SPIC Hydrogen Energy’s public customer record is best understood as a two-lane market. One lane is
              mobility: commercial logistics fleets, heavy-duty and traction applications, OEM integration programs, and
              adjacent bus or passenger-vehicle development. The second lane is industrial hydrogen: project-side
              electrolyzer deployments and broader green-hydrogen use cases tied to policy-backed expansion. That split
              matters because the customer proof, procurement motion, and durability metrics are very different in each
              lane. The mobility lane offers the clearest named evidence, especially where OEMs, fleet operators, and
              local governments appear together. The industrial lane offers clearer strategic logic but weaker
              account-level transparency, because electrolyzer proof is usually communicated through projects and
              showcase milestones rather than through customer cohorts. Across both lanes, the public story is much more
              B2B and programmatic than consumer-like. Buyers appear to be OEMs, fleet operators, project developers,
