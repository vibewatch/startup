      - number: '4.2'
        title: Cost structure, margin drivers, and unit economics blind spots
        blocks:
          - type: paragraph
            body: >-
              The sector economics strongly suggest a hard path to margin quality. SPIC’s products require advanced
              materials, stack manufacturing, system integration, validation, and after-sales service, while its
              electrolyzer line also sits inside a market where price pressure appears to be increasing. Localization
              can help, but it is not magic: it only becomes a true margin advantage if it lowers input cost, improves
              yield, or wins tenders that imports cannot. Public sources are not enough to calculate unit economics,
              however. There is no reliable public disclosure for realized ASP, warranty cost, service attach rate,
              field-failure cost, or segment-level gross margin. The best that can be said is directional: the model is
              capital intensive, probably inventory heavy, and exposed to execution risk in both transport and
              industrial projects. In that context, public peer losses are not side notes; they are the clearest warning
              sign for SPIC’s likely current economics.
