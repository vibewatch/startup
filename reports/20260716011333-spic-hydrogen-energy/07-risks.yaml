- id: operational-quality-and-manufacturing-risk
  title: Operational, quality, and manufacturing risk remain under-disclosed
  body: SPIC has enough visible product maturity that operational risk can no longer be dismissed as an early-stage startup problem. The company is active across fuel cells, electrolyzers, traction trucks, marine systems, and difficult-environment applications. That breadth is strategically attractive, but it increases operational burden. A dual-track business serving both mobility and hydrogen-production customers must manage very different integration, warranty, and service expectations. Public evidence is strongest on certifications and milestones, weaker on operating-quality telemetry. There is no public MTBF series, no RMA rate, no defect trend, and no incident dashboard. Investors can see that the company is moving into real field conditions; they cannot yet see how the equipment behaves once it is there. This matters especially because the broader electrolyzer market is still working through cost and technology challenges. In other words, the products look increasingly real, but the
    public quality system remains much less transparent than the milestone system.
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
