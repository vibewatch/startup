- id: mitigations-monitors-and-thesis-breaks
  title: Mitigations exist, but the residual-risk stack still needs direct diligence
  body: SPIC is not risk-maximal. State backing, capital raised, certifications, policy visibility, and a visible production footprint are all real mitigants. They reduce survivability risk and make the company more credible than a typical speculative hydrogen startup. But mitigants only matter if they can be monitored. The most useful risk frame for investors is therefore a practical one. What would prove risk is coming down, and what would prove it is not? Better customer diversification, disclosed renewal data, quality telemetry, and cleaner economics would all lower residual risk materially. So would a stable leadership bench through the IPO path. Conversely, a serious safety incident, failure of a flagship fleet ramp, continued economic opacity, or a pullback in policy support would all meaningfully damage the thesis. The residual-risk profile is therefore not terminal, but it is still high enough that direct diligence must stay focused on quality systems, concentration, and financial
    transparency rather than being distracted by milestone headlines alone.
  claimRefs:
  - CR038
  - CR039
  - CR040
  - CR041
  - CR042
