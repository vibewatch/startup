- id: dependency-customer-and-policy-risk
  title: Customer concentration and policy dependence are central dependency risks
  body: 'SPIC’s public traction is real, but the visible dependency stack is tight. The best-known programs cluster around a small set of named or semi-named counterparties: Yutong and Hydrogen Motion Tech in Zhengzhou, Dongfeng-linked logistics deployment in Wuhan, FAW-related passenger development, and the Changchun Qingyong project. That concentration matters because one delayed customer program, one policy shift, or one infrastructure bottleneck can distort the whole revenue narrative. Policy is not just a tailwind here; it is an operating dependency. National and local hydrogen pilots help create customer demand, set cost-down expectations, and shape where deployments can happen first. Yet the same policy link creates fragility if subsidy logic weakens, standards change, or market economics fail to catch up. The market-wide data remain sobering too: China’s hydrogen vehicle fleet is still relatively small and annual growth has not been linear. The public evidence therefore supports
    a company with meaningful upside and equally meaningful dependence on a few programs, counterparties, and policy rails.'
  claimRefs:
  - CR019
  - CR020
  - CR021
  - CR022
  - CR023
  - CR024
