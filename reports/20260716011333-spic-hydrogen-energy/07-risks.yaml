- id: financial-model-and-governance-risk
  title: Financial-model and governance risks stay high because peers are still loss-making and SPIC remains opaque
  body: 'The financial risk story is straightforward and uncomfortable. SPIC has raised meaningful capital and is preparing for an IPO, but public sources still do not disclose the operating metrics that would underwrite the business with confidence. Revenue quality, margin, cash burn, and backlog conversion remain private. That would matter for any industrial company; it matters more in a sector where listed peers still report deep losses or profit warnings. SinoHytec and Guofu are not perfect comps, but they are important warning lights: hydrogen-equipment companies can accumulate technical milestones without producing healthy economics. REFIRE’s listing shows capital markets are open to hydrogen stories, yet it does not prove the category has solved profitability. Governance risk adds another layer. Leadership transition during IPO preparation can be normal and constructive, but it can also slow execution and complicate message discipline just when external scrutiny is increasing. The
    right conclusion is not that SPIC is weak. It is that the public record leaves too much model and governance risk unresolved to treat the funding story as a substitute for earnings quality.'
