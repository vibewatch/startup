company:
  name: SPIC Hydrogen Energy
chapter:
  number: 4
  title: Financials
  summary: 'SPIC Hydrogen Energy appears well funded by hard-tech standards but still financially opaque. The public record supports a project-driven equipment revenue model, a capital-intensive cost structure, and strong access to financing through its 2022 Series B, later private fundraising, and IPO preparation, but it does not disclose current revenue, gross margin, cash burn, or backlog quality. The most defensible financial verdict is therefore cautious: strategically financeable, likely still loss-making, and not yet publicly underwritten on operating economics.'
sections:
- id: revenue-model-and-traction
  title: Revenue model and public traction proxies
  body: 'SPIC Hydrogen Energy’s public commercial model looks much closer to industrial hardware and project integration than to recurring software or simple commodity sales. The retained evidence shows two visible lines—fuel-cell systems and PEM electrolyzers—plus ecosystem work around deployment and integration. That matters because revenue will likely come in lumpy project increments rather than in smooth recurring monthly streams. Public evidence also suggests that the best operating proxies are not revenue figures but deliveries, cumulative mileage, flagship deployments, and equipment-scale milestones. The downside is obvious: those proxies prove technical progress better than they prove revenue quality. The company did at one point talk about a 2025 revenue target of CNY 5 billion, but retained sources do not publish actual FY2025 revenue, mix by product line, or customer concentration. Investors can therefore describe the model, but cannot yet cleanly measure the realized commercial
    output, conversion rate, and customer durability behind it.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI027
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: cost-structure-and-unit-economics
  title: Cost structure, margin drivers, and unit economics blind spots
  body: 'The sector economics strongly suggest a hard path to margin quality. SPIC’s products require advanced materials, stack manufacturing, system integration, validation, and after-sales service, while its electrolyzer line also sits inside a market where price pressure appears to be increasing. Localization can help, but it is not magic: it only becomes a true margin advantage if it lowers input cost, improves yield, or wins tenders that imports cannot. Public sources are not enough to calculate unit economics, however. There is no reliable public disclosure for realized ASP, warranty cost, service attach rate, field-failure cost, or segment-level gross margin. The best that can be said is directional: the model is capital intensive, probably inventory heavy, and exposed to execution risk in both transport and industrial projects. In that context, public peer losses are not side notes; they are the clearest warning sign for SPIC’s likely current economics.'
  claimRefs:
  - CI008
  - CI009
  - CI010
  - CI011
  - CI012
  - CI028
  - CI029
  - CI030
  tableRefs:
  - TI003
