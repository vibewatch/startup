  - FI002
  - FI003
- id: capital-base-and-runway
  title: Capital base, runway proxies, and financing dependence
  body: SPIC has a clear advantage on capital access relative to the typical hard-tech startup. The 2022 Series B alone brought in CNY 4.5 billion, and public reports point to an additional Series C in late 2024. That makes lifetime public capital of roughly CNY 6.6 billion plausible, even though the latest round economics remain opaque. The company also appears willing to keep investing in production capacity, as shown by the Wuhan Green Drive capital injection in 2025. These facts imply meaningful runway support. But they do not resolve the core question of burn. Retained sources do not disclose cash, monthly losses, or runway months, and the capital-intensive nature of the sector means large fundraising totals can still disappear into factories, pilots, inventory, and receivables. The current financial judgment is therefore that SPIC is better financed than many peers, yet still dependent on continued capital access and a successful path to larger-scale commercialization or IPO liquidity.
  claimRefs:
  - CI013
  - CI014
  - CI015
  - CI016
  - CI017
  - CI018
  - CI019
  - CI020
  - CI021
  tableRefs:
  - TI004
  figureRefs:
  - FI004
- id: peer-readthrough-and-verdict
  title: Peer read-through and financial verdict
  body: 'Public peer evidence is critical because SPIC itself remains opaque. SinoHytec’s wider 2024 losses and Guofu’s later loss warnings show that hydrogen-equipment companies can keep growing technically while still burning significant capital. REFIRE’s public-market path shows the sector can reach the equity market, but not that it has solved economics. Those read-throughs matter because they constrain how investors should interpret SPIC’s strong capital base and policy backing. The most likely current state is a company that is better funded and strategically stronger than many peers, but still not publicly proven on profitability, cash conversion, or backlog quality. In other words, capital access is a strength, not a substitute for revenue quality. The financial chapter therefore lands on a cautious conclusion: SPIC appears financeable and strategically important, but the IPO case cannot be treated as financially de-risked without much deeper disclosure, audited support, and segment
    detail from management teams today externally.'
