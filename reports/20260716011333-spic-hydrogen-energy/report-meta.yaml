companyProfile:
  summary: SPIC Hydrogen Energy is SPIC’s dedicated hydrogen-technology platform, founded in 2017 and based in Beijing, with a business spanning fuel-cell systems, PEM electrolyzers, and vertically integrated core materials. Public evidence shows an unusual combination of state-parent support, hard-tech financing scale, visible commercialization milestones, and active IPO preparation, including a CNY4.5B Series B at a CNY13B valuation in 2022, a later but undisclosed Series C in 2024, more than 2,000 delivered fuel-cell systems, and megawatt / 10,000-Nm3/h PEM milestones. At the same time, the company remains a private, economically opaque industrial platform whose current revenue, margins, backlog, and cap-table details are still not public.
  foundedDate: '2017-05-01'
  foundingLocation: Beijing, China
  headquarters: Beijing, China
  productSummary: SPIC sells Hydrogen Teng fuel-cell systems for commercial and specialty vehicles alongside Qingyong PEM electrolyzer equipment, supported by vertically integrated materials, stacks, and systems capabilities.
  customerFocus: Commercial vehicle fleets, OEM partners, logistics operators, and green-hydrogen project developers.
  businessModel: B2B hardware, systems, and project-integration model centered on fuel-cell systems, PEM electrolyzer equipment, and related hydrogen technology components.
  stage: Private, Series C / IPO preparation
  fundingStatus: Raised CNY4.5B in Series B in 2022 at a disclosed CNY13B valuation; public reporting says a November 2024 Series C occurred without disclosed amount, and the company launched IPO underwriting work in 2025.
