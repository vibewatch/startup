  topStrengths:
  - State-parent backing and unusually large historical fundraising materially reduce near-term survivability risk.
  - The company has credible dual exposure to fuel-cell systems and PEM electrolyzers rather than a single narrow hydrogen product line.
  - Public commercialization proof is meaningful, including more than 2,000 delivered fuel-cell systems, 40M+ km of operation, and large PEM deployment milestones.
  - Formal IPO underwriting work suggests capital-markets access is a real option rather than a speculative talking point.
  - China’s green-hydrogen capacity build-out provides a real macro tailwind for domestic electrolyzer suppliers.
  topRisks:
  - Revenue, backlog, gross margin, burn, and cap-table preference terms remain undisclosed, making valuation underwriting highly uncertain.
  - Listed hydrogen equipment peers still look loss-making and far cheaper in public markets, limiting confidence in premium private marks.
  - Customer proof clusters around a relatively small number of flagship, policy-linked programs rather than a broadly disclosed base.
  - Electrolyzer economics and broader hydrogen-vehicle demand remain vulnerable to cost pressure and uneven policy-to-demand conversion.
  - Leadership transition and prior IPO timetable slippage add execution risk as scrutiny rises.
  unresolvedGaps:
  - Updated post-Series-C valuation, draft IPO range, and any reliable current price discovery beyond the 2022 Series B anchor.
  - Audited revenue, backlog, gross margin, warranty burden, impairment profile, and cash-burn data.
  - Top-customer concentration, project cancellation history, and backlog mix by product line.
  - Liquidation preferences, anti-dilution terms, option pool, and other cap-table details that affect actual equity returns.
  - Verified secondary-trade evidence that would make private-stock pages usable in committee-grade valuation work.
