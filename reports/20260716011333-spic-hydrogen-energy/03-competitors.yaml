- id: moat-and-durability
  title: Moat durability and investor framing
  body: 'The right investor framing is neither “obvious category winner” nor “undifferentiated policy name.” SPIC presently looks strongest as an integrated domestic champion candidate: broad enough to ride multiple hydrogen-capex themes, well connected to state ecosystems, and credible on localization. But moat durability still depends on repeat-order proof. If localization depth, stack performance, PEM reliability, and service quality do not convert into repeat wins, the market may reward cheaper or more specialized alternatives instead. Conversely, if SPIC can keep using its dual-platform strategy to sell both supply-side PEM projects and downstream applications, the integrated model could turn from a narrative into a defensible advantage. What investors still need, however, is evidence that buyers repeatedly choose SPIC because it performs better, not just because it fits a policy moment. Evidence on service attachment, renewal, uptime, and referenceability would materially sharpen that
    call for investors over time and cycles in practice. Today, that remains promising but not fully proven.'
