- id: where-spic-wins
  title: Where SPIC appears advantaged
  body: SPIC’s clearest public strengths are structural rather than accounting-based. Parent-group backing from SPIC gives it unusual project access, credibility with state-linked buyers, and room to bridge longer commercialization cycles. The company also publicly claims a deeper localization chain than most peers, extending from materials such as catalysts and membranes through stacks and systems. Finally, it has visibly built two product lines—fuel cells and PEM electrolyzers—rather than only one. Those attributes matter because buyers in China’s hydrogen market often care about domestic-control narratives, policy fit, and whole-project execution as much as they care about lab metrics. Visible deployments at the Winter Olympics and Antarctica strengthen the trust layer further by demonstrating that SPIC has shipped hardware into politically sensitive and technically difficult environments. In a market where procurement committees often want reliability signals before they want marketing
    copy, that kind of demonstration evidence has outsized competitive value.
  claimRefs:
  - CP011
  - CP012
  - CP013
  - CP014
  - CP023
  - CP025
  - CP027
  - CP032
  tableRefs:
  - TP002
  figureRefs:
  - FP002
- id: where-spic-is-weaker
  title: Where SPIC’s competitive case is less proven
  body: 'The public record is less convincing when the question shifts from strategic positioning to measurable operating superiority. SPIC is private, so analysts cannot compare revenue quality, customer concentration, service revenue, or margin resilience as cleanly as they can for public peers. Direct peers may also be more focused in their core lanes. That does not automatically make them better, but it means SPIC’s breadth could turn into distraction if both transport fuel cells and PEM electrolyzers become more price-competitive at the same time. The market’s structure also limits any single player’s power: battery-electric substitutes pressure some transport routes, buyers can multi-source parts of the value chain, and electrolyzer procurement may commoditize faster than the integrated-champion narrative assumes. Said differently, the most important unknown is not whether SPIC has a story, but whether that story produces superior economics under real tender and service conditions.'
  claimRefs:
  - CP015
  - CP016
  - CP019
