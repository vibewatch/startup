    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户结构：先是出行车队，其次是工业项目
        blocks:
          - type: paragraph
            body: >-
              SPIC Hydrogen Energy 的公开客户记录，最好理解为双车道市场。一条是出行：商业物流车队、重卡和牵引应用、OEM
              集成项目，以及相邻的公交或乘用车开发。另一条是工业氢：项目侧电解槽部署，以及与政策支持扩张绑定的更广泛绿氢用例。这个拆分很重要，因为两条线上的客户证明、采购动作和耐久性指标差异很大。出行车道拥有最清晰的具名证据，尤其是
              OEM、车队运营商和地方政府同时出现的地方。工业车道战略逻辑更清楚，但账户级透明度更弱，因为电解槽证明通常通过项目和展示里程碑表达，而不是通过客户队列表达。两条线合起来看，公开故事更像 B2B
              和项目制，而不是消费品式市场。买家似乎是 OEM、车队运营商、项目开发商和政府相关平台，而不是数以千计的小型独立账户。
