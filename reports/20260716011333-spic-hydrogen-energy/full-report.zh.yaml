      - number: '7.5'
        title: 缓释因素存在，但剩余风险栈仍需要直接尽调
        blocks:
          - type: paragraph
            body: >-
              SPIC
              不是风险最高的公司。国资背书、已融资本、认证、政策可见度和可见生产足迹，都是实在的缓释因素。它们降低了生存风险，也让公司比典型投机型氢能创业公司更可信。但缓释因素只有能被监测时才有意义。因此，对投资人最有用的风险框架应当很实际：什么能证明风险在下降，什么又能证明风险没有下降？更好的客户多元化、披露续约数据、质量遥测和更干净的经济性，都会显著降低剩余风险。IPO
              路径中稳定的领导梯队也会降低风险。反过来，重大安全事故、旗舰车队爬坡失败、经济性持续不透明，或政策支持退坡，都会实质伤害投资逻辑。因此，剩余风险不是致命的，但仍高到要求直接尽调持续盯住质量体系、集中度和财务透明度，而不是被里程碑标题分散注意力。
