      - number: '2.2'
        title: 需求结构、买方和使用场景集中度
        blocks:
          - type: paragraph
            body: >-
              中国的交通需求仍集中在商用车队，而不是乘用车；即便在交通内部，最重要的买家也是卡车 OEM、公交运营商、车队所有者、地方政府项目和物流生态等窄人群，它们能让氢能资产保持高利用率。这对 SPIC
              很重要，因为燃料电池需求不是广泛零售市场，而是项目驱动市场，买方、使用方和付款方常常不同。电解槽的买家又不同：可能是国有能源开发商、氨项目发起方、炼化相关工业运营商，或一体化绿氢项目业主。组合起来看，SPIC
              面对的是集中、重关系、且经常由国家或地方平台居中撮合的采购渠道。这不一定是坏事——国家集中可以在受支持区域加速采用——但也意味着获客绑定的是政策契合和项目执行，而不只是技术更优。
