        title: 成本结构、利润率驱动和单位经济性盲点
        blocks:
          - type: paragraph
            body: >-
              行业经济性强烈暗示，想获得高质量利润率很难。SPIC
              的产品需要先进材料、电堆制造、系统集成、验证和售后服务；电解槽线还处在价格压力似乎正在加剧的市场里。本土化有帮助，但不是魔法：只有在它降低投入成本、改善良率，或赢下进口产品无法拿到的标时，才会变成真正的利润率优势。不过，公开来源不足以计算单位经济性。已实现
              ASP、质保成本、服务绑定率、现场故障成本或分部毛利率，都没有可靠公开披露。最多只能给出方向性判断：模式资本密集、可能库存较重，并且在交通和工业项目两端都暴露于执行风险。在这个背景下，上市同行亏损不是脚注，而是
              SPIC 当前经济性最清晰的警示灯。
