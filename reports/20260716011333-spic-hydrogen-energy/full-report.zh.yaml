        title: 从买方和工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              SPIC Hydrogen Energy 的产品故事不是单一电堆，也不是一辆示范车。可见商业表面分成两个硬件主导的产品族。Hydrogen Teng
              覆盖燃料电池系统和核心部件，服务公交、重卡、船舶、无人机、固定式或辅助电源等移动和特种用电场景。Hydrogen Yong 覆盖制氢项目所需的 PEM
              电解槽设备。这两条线背后的买方工作流差异很大。燃料电池客户需要车辆集成、认证、交付和售后支持；电解槽客户需要项目工程、电力集成、运行小时可靠性，以及越来越大的单站吞吐量。这个拆分很重要，因为它让 SPIC
              看起来不像单产品创业公司，而更像覆盖下游应用和上游氢供给的国资氢能设备平台。官方和第三方记录支持这种平台定位，但也显示产品成熟度主要仍通过里程碑来沟通，而不是通过透明基准测试包来证明。
