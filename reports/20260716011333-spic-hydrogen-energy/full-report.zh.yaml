            body: >-
              相比典型硬科技创业公司，SPIC 在资本获取上有明显优势。仅 2022 年 Series B 就带来 CNY 4.5 billion，公开报道还指向 2024 年底的额外 Series
              C。因此，即便最新一轮经济条款仍不透明，累计公开资本大约 CNY 6.6 billion 仍属合理推断。公司也似乎愿意继续投资产能，2025 年 Wuhan Green Drive
              增资就是例子。这些事实意味着现金跑道有实质支持。但它们没有回答核心问题：烧钱速度。已纳入来源没有披露现金、月度亏损或现金跑道月数，而行业资本密集的性质意味着，大额融资仍可能被工厂、试点、库存和应收款吃掉。因此，当前财务判断是：SPIC
              比许多同行资金更好，但仍依赖持续资本获取，以及走向更大规模商业化或 IPO 流动性的成功路径。
