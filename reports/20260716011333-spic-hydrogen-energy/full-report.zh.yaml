      - number: '2.3'
        title: 政策驱动、基础设施和采用约束
        blocks:
          - type: paragraph
            body: >-
              中国 2025 年的氢能政策图景，正式地位提高了，但经济约束没有消失。NEA 相关报道和政策摘要显示，氢能在国家能源规划中的位置更清晰，城市群示范也继续导流近期交通需求。这些对 SPIC
              都是真正利好。但同一组证据也说明，投资人仍要保持纪律。2024
              年燃料电池汽车销量下滑，基础设施相对全国货运网络仍然稀疏，可服务市场高度取决于加氢站、补贴和运营经济性在哪里对齐。电解槽侧，市场受益于绿氢工业政策和产能增长，但 S&P
              的反向报道提醒，成本压力和技术竞争仍很激烈。因此，市场战略方向有利，但商业化斜率并不平滑。
