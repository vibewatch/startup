  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 收入和在手订单
        - 按业务线拆分的当前收入、签约在手订单、交付转化节奏
        - 支撑估值最直接缺失输入
        - CFO / 财务尽调请求
      - - 毛利率和质保负担
        - 分部毛利率、服务成本、质保准备金、减值细节
        - 决定规模是在改善经济性，还是掩盖亏损
        - 财务 + 运营尽调
      - - 客户集中度
        - 前 5 大客户、在手订单结构、取消历史
        - 判断当前证明是否多元，还是仍然狭窄
        - CEO / 销售尽调
      - - 优先股堆叠和稀释
        - 清算优先权、反稀释调整、投资者保护、期权池、老股权利
        - 股权回报可能大幅偏离企业价值增长
        - 公司法律顾问 / 融资尽调
      - - IPO 估值区间
        - 承销商初步区间、基石投资者意向、敏感性假设
        - 这是估值立场最直接的公开市场现实校验
        - 左列牵头投行尽调
      - - 二级市场证据
