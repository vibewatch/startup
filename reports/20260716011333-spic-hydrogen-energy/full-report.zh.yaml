  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：继续研究 / 观察，除非入场纪律改善
        blocks:
          - type: paragraph
            body: >-
              公开证据足以说明 SPIC Hydrogen Energy 是一家有战略分量的氢能公司，但还不足以支撑在最后明确披露的 CNY13 billion 估值或更高价格上轻松下注。正面因素确实存在：SPIC
              有国资背景，对一家硬科技公司而言融资规模罕见，业务横跨燃料电池和 PEM 电解制氢，IPO 路径也已经足够清晰，已开始招标保荐和承销服务。公开产品验证也强于许多未上市气候科技公司。公司已交付 2,000
              多套燃料电池系统，运营里程超过 40 million km，并落地了 10,000-Nm3/h PEM
              电解槽项目。问题不在可信度，而在价格支撑。公开信息仍未披露当前收入、毛利率、烧钱速度、在手订单、股权结构偏好，或 2024 年 11 月金额未披露的 Series C
              之后的新一轮估值。与此同时，上市氢能设备可比公司仍显示经济性偏弱，公开市场估值也明显低于 SPIC 最后披露的私募估值锚点。仅凭公开证据，合理结论是继续研究 /
              观察；置信度中等、风险高，估值态度只有围绕最后披露的私募锚点才算偏高到合理，若显著高于该锚点，并不显得便宜。
