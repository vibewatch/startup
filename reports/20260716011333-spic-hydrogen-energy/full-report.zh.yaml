              SPIC 的公开牵引力真实存在，但可见依赖栈很紧。最知名项目集中在少数具名或半具名交易对手周围：郑州的 Yutong 和 Hydrogen Motion Tech、武汉的 Dongfeng 相关物流部署、FAW
