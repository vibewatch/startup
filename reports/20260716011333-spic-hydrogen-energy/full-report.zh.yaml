companyProfile:
  summary: >-
    SPIC Hydrogen Energy 是 SPIC 旗下专门的氢能技术平台，2017 年成立，总部在北京，业务覆盖燃料电池系统、PEM
    电解槽和纵向一体化核心材料。公开证据显示，公司同时具备少见的国资母公司支持、硬科技融资规模、可见商业化里程碑和活跃 IPO 准备：2022 年以 CNY13B 估值完成 CNY4.5B Series B，2024
    年又完成未披露金额的 Series C，累计交付 2,000 多套燃料电池系统，并跑出兆瓦级 / 10,000-Nm3/h PEM
    里程碑。与此同时，公司仍是一家经济数据不透明的私有工业平台，当前收入、利润率、在手订单和股权结构细节都尚未公开。
