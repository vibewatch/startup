  - id: FR002
    title: 风险传导图
    type: dag
    summary: SPIC 的核心风险通过几条共用通道传导：质量不透明、客户集中、政策依赖和财务披露不足。
    data:
      nodes:
        - id: quality
          label: 质量 / 安全不透明
          tone: warning
        - id: customers
          label: 集中的旗舰项目
          tone: negative
        - id: policy
          label: 政策支撑的需求
          tone: warning
        - id: backlog
          label: 在手订单 / 利用率风险
          tone: warning
        - id: margin
          label: 利润率与烧钱压力
          tone: warning
        - id: valuation
