  - id: TV005
    title: 投资逻辑破裂与放弃触发条件表
    columns:
      - 触发条件
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - IPO 初步估值区间偏弱
        - 指示性区间显著低于管理层预期，也低于更强私募投资者所暗示的水平
        - 表明公开投资者对质量、增长或治理的折价超过预期
        - 除非新证据抵消市场信号，否则下调为放弃
      - - 烧钱或减值超预期
        - 私下尽调发现亏损、减值或应收账款压力明显差于公开同业所暗示水平
        - 战略规模故事变成资本消耗故事
        - 先从下行情景重新建模
      - - 标杆客户放量停滞
        - 一个或多个标杆出行或工业项目明显延后
        - 同时削弱增长节奏和叙事证明
        - 下调乐观情景，并大幅收紧基准情景
      - - 政策向需求传导减弱
        - 补贴逻辑或项目审批没能转成真实设备需求
        - 损害利用率和在手订单假设
        - 下调情景区间并推迟投资
      - - 优先股堆叠过于苛刻
        - 清算优先权、反稀释调整或特别权利吃掉太多上行
        - 企业价值增长不再顺畅映射到股权回报
        - 重新谈入场条件，或直接退出
      - - 领导层 / 治理不稳定性上升
        - IPO 准备期叠加更广泛的管理层流动或披露不一致
        - 抬高执行风险和公开市场可信度风险
        - 暂停，直到治理清晰度改善
    notes: 放弃触发条件聚焦最快摧毁股权回报逻辑的事项，而不是泛泛经营噪音。
