      - number: '1.2'
        title: 领导层、治理和关键人依赖
        blocks:
          - type: paragraph
            body: >-
              当前公开记录中最重要的治理变化，是 2026 年 1 月的领导层调整。Tencent 1 月报道显示，Yang Yufeng 任党委书记，并被推荐为董事长；创始阶段董事长 Li Lianrong
              转向董事式监督角色，Zhang Yingguang 暂时负责经营管理。这个过渡很关键，因为 SPIC Hydrogen Energy 正从技术建设阶段走向 IPO
              准备和更大规模商业化，治理结构和执行节奏的重要性已经接近研发深度。公开领导层信息仍只是不完全透明。Wang Meng 等核心姓名和董事会名单出现在二级资料中，SPIC
              自身报道也强调年轻且高学历的研发队伍，但市场仍看不到上市公司级别的管理层组织图、委员会结构和股权披露图。因此，本章支持对领导力质量和国资背书的正面判断，同时也把关键人依赖和披露偏薄列为真实尽调问题，而不是文书遗漏。
