      - number: '2.4'
        title: 市场结构对 SPIC 意味着什么
        blocks:
          - type: paragraph
            body: >-
              对 SPIC Hydrogen Energy
              而言，市场结论是好坏交织但仍可投资。公司受益于长期政策支持、大型母公司，并同时暴露于交通燃料电池和绿氢电解槽两个方向。这让它比只押一条赛道的同行拥有更多战略选择权。不过，市场结构也意味着 SPIC
              同时暴露于两组不同瓶颈。燃料电池需求取决于基础设施密度、车队利用率和城市群预算；PEM 需求取决于项目融资、电价和工业消纳。因此，这个市场足够大，值得重视；但集中度也足够高，投资人不应接受泛化的 TAM
              乐观叙事。市场还呈现地理集群和重关系特征，赢下少数高价值省级或国企项目，可能比全国知名度更重要。复购可见度，而不是头部项目数量，才是未来市场质量最清晰的实践证明。正确尽调姿态，是逐个细分赛道承销采用，而不是假设所有氢能政策动能都会立即转成设备收入。
