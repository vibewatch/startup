  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              SPIC Hydrogen Energy 竞争的不是一个整齐的单一同业集合，而是碎片化的中国氢能设备市场。真正的直接同行，是把燃料电池系统、电堆或 PEM 电解槽卖进同一类国资相关和工业采购渠道的公司。这里包括
              SinoHytec、REFIRE 等聚焦交通系统的玩家，也包括 Sunrise Power、Sinosynergy 等相邻电堆和系统公司，以及 Guofu Hydrogen
              等更宽的氢能设备公司。Ballard、Plug、Cummins 等全球玩家，作为短期抢中国路线份额的对手并不那么重要，更重要的是作为耐久性、平台宽度和累计运行时间的能力标尺。这个视角很重要，因为 SPIC
              的竞争地位会随着衡量赛道而强弱不同：一体化国产化、交通系统、PEM 设备，或纯玩家经济性。投资人不应只问 SPIC 是否“第一”，而要问它在哪些位置最强、每条赛道最接近的对手是谁，以及公开证据到底能证明什么排名。
