  - id: FR003
    title: 依赖图
    type: dag
    summary: 公司的依赖堆栈把具名客户、监管方、政策项目和生产执行绑成一个紧耦合系统。
    data:
      nodes:
        - id: oems
          label: Yutong / Dongfeng / FAW 相关 OEM
          tone: positive
        - id: fleets
          label: 旗舰车队运营商
