  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和规模测算纪律
        blocks:
          - type: paragraph
            body: >-
              分析 SPIC Hydrogen Energy 时，最大的市场错误是把公司视为暴露于整个氢能经济。事实并非如此。公司切入的是更窄的支出池：用于交通和电力应用的燃料电池系统、面向绿氢项目的 PEM
              电解槽设备，以及支撑这两条线的一部分上游材料和生态集成工作。这个区分很重要，因为自上而下的氢能 TAM
              叙事往往把全部氢气消费、全部加氢站支出、全部工业用途，甚至全球脱碳资本开支池都算进去，从而被放大。更可辩护的视角，应从中国商用燃料电池系统市场和国内 PEM
              电解槽市场开始，再问在当前政策、基础设施和项目融资条件下，究竟有多少支出可触达。同时还要把装机基数、年度销售流量、项目公告和真实运行产能拆开，因为这些指标可能同时指向不同方向。公开证据支持长期机会很大，但近期
              SAM 仍小得多，也比宣传式市场地图显示的更集中在政策上。
