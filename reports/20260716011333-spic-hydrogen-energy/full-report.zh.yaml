  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 为什么可比
      - 局限
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Covers the public and quasi-public comparables most useful for triangulating SPIC’s valuation as of 2026-07-16:
        listed Chinese hydrogen equipment names, a recent Chinese hydrogen IPO, troubled global pure plays, and a mature
        hydrogen-adjacent quality benchmark.
    rows:
      - - SPIC Hydrogen Energy
        - 最后披露的私募轮锚点
        - 2022 年 12 月投后估值 CNY13B；此后披露 Series C 轮但未披露金额
        - 直接锚定投资者最后能从公开信息看到的价格
        - 不是当前估值，因为后续融资条款仍未披露
      - - Beijing SinoHytec
        - 中国上市燃料电池纯标的
        - 市值约 CNY3.97B；盈利能力深度为负
        - 最接近的公开参照，可读出国内燃料电池系统估值压力
        - 业务组合更窄，国资背书弱于 SPIC
      - - Jiangsu Guofu Hydrogen Energy
        - 中国上市电解槽 / 氢能设备公司
        - 市值约 HK$1.425B；2026 年盈利预警；市值较 2024 年底大幅下跌
        - 显示公开市场会严厉惩罚政策顺风转不成利润
        - 业务组合不同，且市值是上市后价格，不是后期私募估值
      - - REFIRE
        - 近期中国氢能 IPO 路径
        - 2024 年香港招股书区间为每股 HK$145-HK$165；OMM 称 IPO 约 US$91M
        - 证明氢能公司仍能进入资本市场
        - 发行条款本身不能证明耐久的后市表现或盈利能力
      - - Plug Power
        - 全球氢能纯标的
        - 市值约 US$3.17B，过去亏损很大
        - 作为警示性可比，有助于理解公开市场如何对待持续亏损
        - 美国政策和公司历史与 SPIC 差异很大
      - - Ballard Power
        - 全球燃料电池纯标的
        - 市值约 US$883M，利润率严重为负
        - 可作为类似底部的警示性参照，反映市场对燃料电池纯标的的怀疑
        - 加拿大上市、增长更慢，限制了直接映射
      - - Linde
        - 成熟氢能相邻质量基准
        - 市值约 US$241.59B，盈利能力健康
        - 说明经过验证的工业气体和氢能基础设施经济性可以撑起多高的价值上限
        - 比任何类创业氢能设备公司都成熟、多元得多
      - - Bloom Energy
        - 相邻上市燃料电池 / 分布式电力公司
        - 市值约 US$69.23B，盈利能力仅处边际水平
        - 说明即便利润率尚未充分成熟，市场也可能奖励规模
        - 商业模式和产品组合与 SPIC 不能干净对比
    notes: 本表有意混用私募轮锚点、公开市值和 IPO 状态参照，而不是假装今天存在一个干净适配 SPIC 的倍数。
