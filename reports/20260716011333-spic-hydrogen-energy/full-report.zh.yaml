      - number: '1.4'
        title: 里程碑、规模信号和未解风险点
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，公司确实取得了技术和商业化进展。燃料电池系统通过了可见度测试：既有北京冬奥会等重大展示，也有更少见的 2025 年 3 月南极部署。电解槽侧，公开资料勾勒出一条路径：从早期原型到 400
              Nm³/h，再到第三方认证的 500 Nm³/h 系统，之后又出现兆瓦级认可和 10,000 Nm³/h Da’an
              部署。这些信号有意义，因为它们把公司从“政策概念”推向在困难环境中交付硬件。不过，公开记录仍有大洞。收入、ARR、具名客户集中度、已实现毛利率和详细生产经济性仍未公开。即便公司最强的规模说法——例如交付
              2,000 多套系统、运行 40 million 公里——也仍是公司自称，而不是独立审计。正确的概览结论因此是正面但不能自满：SPIC Hydrogen Energy
              像是一家严肃的国资氢能平台，技术宽度少见，但它的 IPO 叙事仍要把技术正当性转化为公开财务证明。
