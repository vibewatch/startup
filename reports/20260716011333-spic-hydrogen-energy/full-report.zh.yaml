  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 战略质量让 SPIC 仍有可投性，但经济性证明缺失和严酷的公开可比公司表现，使建议停在继续研究 / 观察。
    approximationNotes: 该流程是定性的，映射了截至 2026-07-16 支持投资建议的公开证据链。
    data:
      nodes:
        - id: market
          label: 真实氢能平台
          detail: 燃料电池和 PEM 产品证明叠加国资背景，带来战略相关性。
          type: input
        - id: ipo
          label: IPO 可选性
          detail: 保荐机构招标和此前 IPO 准备，让流动性路径变得可信。
          type: input
        - id: gaps
          label: 经济性证明缺口
          detail: 收入、利润率、烧钱速度、股权条款和更新估值仍是私有信息。
          type: process
        - id: comps
          label: 公开可比公司警示
          detail: 上市氢能同业仍更便宜，财务也更弱，不能只按私募叙事定价。
          type: process
        - id: rec
          label: 建议：继续研究 / 观察
          detail: 保持兴趣，但在价格和尽调上守住纪律。
          type: output
      edges:
        - from: market
          to: gaps
          label: 质量创造上行空间
        - from: ipo
          to: gaps
          label: 流动性路径很重要
        - from: gaps
          to: comps
          label: 数字缺失放大折价
        - from: comps
          to: rec
          label: 严守入场纪律
    claimRefs:
      - CV006
      - CV015
      - CV018
      - CV039
      - CV045
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 最大上行杠杆是经审计商业证明；最大下行杠杆则是确认公开可比公司的怀疑也应套用到 SPIC 身上。
    approximationNotes: 柱状图显示围绕历史 CNY13B 锚点的方向性价值变化，计量口径为 CNY billions；各项不可相加。
    data:
      items:
        - label: 经审计收入和在手订单超预期
          value: 5
        - label: 毛利率和质保画像呈现可扩展性
          value: 3
        - label: IPO 簿记支持溢价定价
          value: 4
        - label: 公开可比公司估值下修加剧
          value: -3
        - label: 烧钱 / 减值差于预期
          value: -5
        - label: 政策需求和旗舰爬坡不及预期
          value: -4
    claimRefs:
      - CV025
      - CV026
      - CV030
      - CV043
      - CV044
      - CV047
      - CV048
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 上次披露的 CNY13B 估值标记位于公开证据基准情景的中部附近，并不明显低于公允价值。
    approximationNotes: 区间为作者估计，单位 CNY billions，基于已披露的私募锚点、上市同业交易水平和情景假设，而非完整 DCF。
    data:
      items:
        - label: 悲观情景估值
          low: 8
          base: 9
          high: 10
          unit: CNYB
        - label: 基准情景估值
          low: 10
          base: 13
          high: 16
          unit: CNYB
        - label: 乐观情景估值
          low: 18
          base: 21
          high: 24
          unit: CNYB
        - label: Series B 锚点
          low: 13
          base: 13
          high: 13
          unit: CNYB
    claimRefs:
      - CV002
      - CV042
      - CV043
      - CV044
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 基于公开记录综合得出的核心可投性指标。
    data:
      items:
        - label: 建议
          value: Research-more / Track
          trend: flat
        - label: 置信度
          value: Medium
          trend: flat
        - label: 风险评级
          value: High
          trend: flat
        - label: 估值立场
          value: Stretched > CNY13B
          trend: flat
        - label: 公开可比公司支持度
          value: Weak
          trend: down
        - label: 证据完整度
          value: Low-Medium
          trend: flat
    claimRefs:
      - CV039
      - CV040
      - CV045
      - CV046
