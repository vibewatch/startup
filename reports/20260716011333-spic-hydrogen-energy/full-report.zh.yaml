  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: SPIC 剩余风险最高的几项，是高影响和低公开透明度叠加：客户集中、财务不透明、质量遥测缺口。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
      rows:
