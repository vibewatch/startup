      - number: '8.3'
        title: 情景框架：只有 SPIC 证明结构性优于同业，公开可比公司才会限制下行
        blocks:
          - type: paragraph
            body: >-
              由于 SPIC 不披露收入或利润率数据，情景分析只能定性，但估值逻辑仍可拆开。悲观情景假设 IPO 投资者把 SPIC
              看作一家定位更好、但仍受困的纯氢能设备公司：政策需求不均衡，旗舰客户爬坡没有足够快地扩到更多客户，电解槽经济性持续承压，公司仍无法披露有说服力的收入、在手订单和毛利率数据。在这种情况下，公开市场估值向约 CNY8
              billion 至 CNY10 billion 折价并不意外。基准情景假设 SPIC 确实因国资背书、更宽的产品线和更强的商业化资产而强于上市同业，但在经营证据改善前，投资者仍会锚定最后披露的 CNY13
              billion 私募估值；对应估值大致为 CNY10 billion 至 CNY16 billion，旧 Series B
              锚点落在区间中部。乐观情景需要的不只是氢能乐观情绪。公司必须证明旗舰项目之外的客户名单继续扩展，拿出经审计的经济性证据，并让 IPO 簿记需求足以说服投资者：SPIC 相比同业应拿到显著溢价，而不是小幅溢价。
