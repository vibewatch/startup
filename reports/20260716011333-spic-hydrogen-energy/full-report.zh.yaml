      - number: '8.4'
        title: 什么会改变结论：更好价格、更硬数据，或两者同时出现
        blocks:
          - type: paragraph
            body: >-
              建议上调有两条路径：证据改善，或价格改善。更可能的是证据改善。缺失材料很具体，也直接决定投资：经审计收入、按产品线拆分的在手订单、分部毛利率、质保和服务负担、头部客户集中度、股权结构偏好细节，以及承销商支持的
              IPO 估值区间。这些不是装点门面的要求。它们决定 SPIC 只是战略重要的氢能公司，还是一家经济性足以支撑公开市场溢价的企业。价格路径同样重要。如果公司被迫以低于最后披露的 CNY13 billion
              私募估值上市，这并不会自动击穿投资逻辑；它可能只是公开市场现实主义的反映。真正击穿逻辑的情形更尖锐：IPO
              草案区间偏弱、烧钱或减值重于预期、旗舰客户爬坡失败，或政策需求比管理层希望的更浅。按委员会口径，结论很简单：不要轻视 SPIC，但也不要让战略叙事替代估值证据。
