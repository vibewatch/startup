chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、所有权和战略定位
        blocks:
          - type: paragraph
            body: >-
              SPIC Hydrogen Energy 更应被理解为 SPIC 体系内孵化出的氢能专业平台，而不是一家独立的风险投资型创业公司。公开资料一致描述，公司成立于 2017
              年，目标是攻克两个相连瓶颈：关键氢能材料和设备缺少国内控制力，以及如何把氢能从政策口号变成可规模化的清洁能源应用。这一框架很重要，因为它解释了公司为什么同时覆盖燃料电池系统和 PEM
              电解槽，而不是只做车辆或只做制氢。SPIC
              自己的长篇介绍把这项业务放在一条“双线”战略里：能源应用与设备国产化并行；后续报道则强调从材料到系统的全栈链条。结果是，公司卖的是技术，但底层使命有一部分属于产业政策：在催化剂、膜、MEA、双极板、电堆和系统上降低进口依赖，同时借助
              SPIC 的国资平台，把氢能商业化到电力、交通和工业场景。公开资料显示公司总部在北京，并反复把它描述为正准备进入下一阶段规模化的国家级氢能冠军。
