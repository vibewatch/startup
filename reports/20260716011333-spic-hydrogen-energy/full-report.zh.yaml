      - number: '3.2'
        title: SPIC 看起来占优的地方
        blocks:
          - type: paragraph
            body: >-
              SPIC 最清晰的公开优势是结构性的，而不是会计指标上的。SPIC
              母集团背书给了它少见的项目触达能力、国资相关买家的信任，以及穿越较长商业化周期的空间。公司也公开声称本土化链条比多数同行更深，从催化剂、膜等材料延伸到电堆和系统。最后，它已经可见地搭建了两条产品线——燃料电池和
              PEM 电解槽——而不是只有一条。这些属性重要，是因为中国氢能市场的买家往往和关心实验室指标一样，关心国产可控叙事、政策契合和整项目执行。冬奥会和南极的可见部署进一步增强信任层，因为它证明 SPIC
              已经把硬件送进政治敏感且技术困难的环境。在采购委员会常常先要可靠性信号、再看营销文案的市场里，这类展示性证据拥有超额竞争价值。
