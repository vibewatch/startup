      - number: '3.4'
        title: 护城河耐久性和投资人框架
        blocks:
          - type: paragraph
            body: >-
              正确的投资人框架，既不是“显然的品类赢家”，也不是“无差异政策名片”。目前 SPIC
              更像是一体化国产冠军候选：宽到足以承接多条氢能资本开支主题，与国资生态连接紧密，并且在国产化上可信。但护城河能否持久，仍取决于复购证明。如果本土化深度、电堆性能、PEM
              可靠性和服务质量不能转化为反复中标，市场可能转而奖励更便宜或更专业的替代者。反过来，如果 SPIC 能继续用双平台战略同时销售供给侧 PEM
              项目和下游应用，一体化模式就可能从叙事变成可防守优势。不过，投资人仍需要看到证据：买家反复选择
              SPIC，是因为它表现更好，而不只是因为它适合某个政策时点。关于服务绑定、续约、正常运行时间和可推荐性的证据，会在未来时间和周期里显著提高投资判断清晰度。今天，这一点仍有希望，但尚未完全证明。
