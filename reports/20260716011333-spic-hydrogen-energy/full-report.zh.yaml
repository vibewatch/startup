      - number: '1.3'
        title: 融资历史、估值和 IPO 路径
        blocks:
          - type: paragraph
            body: >-
              按国内氢能标准看，公司的资本形成故事很强。最有文档支撑的融资事件是 2022 年 12 月 Series B：Yicai 报道公司融资 CNY 4.5 billion，投后估值 CNY 13
              billion。该轮引入多家大型国资基金，股东名单扩至 35 家，既显示融资能力，也埋下未来股权结构复杂度。后续公开证据指向 2024 年 11 月的 Series
              C，但金额和交易后估值仍不透明。这个缺口很重要，因为公司公开叙事已经把“估值最高的氢能独角兽”与活跃科创板 IPO 流程放在一起，但投资人仍缺少从 2022 年估值走到今天隐含价格的可审计桥梁。尽管如此，多家
              2025 年媒体报道一致称，SPIC Hydrogen Energy 已正式启动保荐和承销机构遴选，IPO
              路径比传闻更具体。简言之，公司看起来资金充足、政治支持强，但公开估值信心仍更多来自融资信号和国家战略重要性，而不是已披露经营指标。
