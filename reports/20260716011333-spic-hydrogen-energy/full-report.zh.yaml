      - number: '7.4'
        title: 因为同行仍在亏损且 SPIC 仍不透明，财务模型和治理风险依旧偏高
        blocks:
          - type: paragraph
            body: >-
              财务风险故事直接且不舒服。SPIC 已融资不少，并在准备
              IPO，但公开来源仍没有披露足以让外部高确信承销业务的经营指标。收入质量、利润率、现金消耗和在手订单转化仍是私有信息。这对任何工业公司都重要；在上市同行仍报告大额亏损或盈利预警的行业里更重要。SinoHytec
              和 Guofu 不是完美可比公司，但它们是重要警示灯：氢能设备公司可以累积技术里程碑，却不产生健康经济性。REFIRE
              上市说明资本市场对氢能故事开放，但并不证明这个品类已经解决盈利问题。治理风险又加了一层。IPO 准备期间的领导层过渡可以正常且有建设性，但也可能在外部审视增强的关键时点拖慢执行、复杂化信息纪律。正确结论不是
              SPIC 很弱，而是公开记录留下太多模型和治理风险，不能把融资故事当作盈利质量的替代品。
