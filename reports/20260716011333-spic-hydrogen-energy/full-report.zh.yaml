  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: SPIC 可见客户旅程从政策支撑的问题定义出发，经 OEM 或项目集成进入部署；最大数据缺口出现在首次交付之后。
    data:
      nodes:
        - id: policy-demand
          label: 政策与经济性催生需求
          detail: 政策支持、成本下降和基础设施允许试点或商业试验时，氢能应用场景才会冒出来。
          tone: positive
        - id: partner-selection
          label: OEM / 项目伙伴选择
          detail: SPIC 似乎通过 OEM、车队运营商或项目开发商切入，而不是走直接自助账户。
          tone: positive
        - id: integration
          label: 车辆或项目集成
          detail: 工程团队把燃料电池电堆或 PEM 设备嵌入具体平台或项目。
          tone: neutral
        - id: first-delivery
          label: 首次交付 / 示范
          detail: 车队移交或政府背书项目启动时，公开证明才露出来。
          tone: neutral
        - id: follow-on
          label: 后续扩展
          detail: 战略签约或更广泛试点意味着扩展潜力。
          tone: positive
        - id: durability-gap
          label: 耐久性不透明
          detail: 首个可见里程碑之后，留存、经济性和客户集中度大多藏在暗处。
          tone: warning
    claimRefs:
      - CU009
      - CU010
      - CU018
      - CU024
      - CU031
  - id: FU002
    title: 采用 / 部署流程
    type: flow
    summary: 公开证据支持一条从政策支持机会，到 OEM 或项目集成，再到可见部署的流程，但看不出阶段间转化率。
    data:
      nodes:
        - id: need
          label: 氢能应用需求
          tone: positive
        - id: partner
          label: OEM / 车队 / 项目伙伴
          tone: positive
        - id: validate
          label: 工程与政策验证
          tone: neutral
        - id: deploy
          label: 车队或项目部署
          tone: neutral
        - id: expand
          label: 复购 / 拓宽应用
          tone: warning
      edges:
        - from: need
          to: partner
          label: 匹配应用场景
        - from: partner
          to: validate
          label: 集成并认证
        - from: validate
          to: deploy
          label: 宣布 / 交付
        - from: deploy
          to: expand
          label: 需要经济性和留存证明
    approximationNotes: 无法构建数值漏斗，因为 SPIC 不披露各阶段数量或转化率。
