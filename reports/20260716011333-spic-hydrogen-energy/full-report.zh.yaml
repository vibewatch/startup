      - number: '8.2'
        title: 投资逻辑 vs 反向逻辑：战略成色看得见，定价质量看不清
        blocks:
          - type: paragraph
            body: >-
              正向逻辑靠战略成色支撑。SPIC 不是单一产品试验：它有燃料电池落地证据、可信的 PEM
              电解槽路线图、上游材料深度、国资母公司背书，以及一段把它推到中国氢能私募市场层级顶端的融资记录。中国绿色氢能建设也是真实发生的：到 2024 年底已形成 125,000 mt/year 产能，仅 2024
              年就新增 35 个绿色氢能项目。反向逻辑在于，公开市场证据比私募战略叙事严厉得多。实际电解氢供应相对于中国总氢气产量仍很小，国内 FCEV 市场在 2024 年收缩，SinoHytec、Guofu
              等上市同业仍交出疲弱或亏损经济性，交易估值远低于 SPIC 最后披露的私募估值锚点。换句话说，投资者可以相信这家公司重要，但不必相信任何未披露的估值上调已经被业绩赚到。反向逻辑不是 SPIC
              质量低，而是公开证据仍没有充分展示收入质量、利润率、在手订单转化或稀释情况，不足以仅凭战略重要性就支付溢价。
            claimRefs:
