      - number: '3.3'
        title: SPIC 竞争叙事尚未被充分证明的地方
        blocks:
          - type: paragraph
            body: >-
              当问题从战略定位转向可衡量的经营优越性，公开记录就没那么有说服力。SPIC
              是私有公司，分析师无法像比较上市同行那样，清晰比较收入质量、客户集中度、服务收入或利润率韧性。直接同行在各自核心赛道上也可能更专注。这并不自动意味着它们更好，但说明如果交通燃料电池和 PEM
              电解槽同时进入更激烈的价格竞争，SPIC
              的宽度可能变成分心。市场结构也限制了任何单一玩家的权力：纯电替代会压制部分交通路线，买家可以在价值链若干环节多供方采购，电解槽采购也可能比一体化冠军叙事假设的更快商品化。换句话说，最重要的未知不是 SPIC
              有没有故事，而是这个故事在真实招投标和服务条件下能不能产生更好的经济性。
