  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式和公开牵引力代理指标
        blocks:
          - type: paragraph
            body: >-
              SPIC Hydrogen Energy 的公开商业模式更接近工业硬件和项目集成，而不是经常性软件或简单大宗商品销售。已纳入证据显示，公司有两条可见业务线——燃料电池系统和 PEM
              电解槽——另有围绕部署和集成的生态工作。这很重要，因为收入更可能以不平滑的项目增量出现，而不是平稳的月度经常性流。公开证据还显示，最好的运营代理指标不是收入数字，而是交付量、累计里程、旗舰部署和设备规模里程碑。缺点也很明显：这些代理指标更能证明技术进展，而不是收入质量。公司一度谈到
              2025 年 CNY 5 billion 的收入目标，但已纳入来源没有发布实际 FY2025
              收入、按产品线拆分的收入结构或客户集中度。因此，投资人可以描述模式，却还不能干净衡量背后的已实现商业产出、转化率和客户耐久性。
