evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue, gross margin, cash burn, and customer concentration are not publicly disclosed.
    whyItMatters: >-
      These metrics determine whether the IPO valuation is supported by operating fundamentals rather than technology
      narrative alone.
    diligencePath: >-
      Obtain IPO pre-filing materials, audited financial statements, and a customer concentration schedule from
      management.
    relatedQuestionRefs:
      - QO024
      - QO025
  - type: missing-source
    severity: material
    topic: series-c-valuation
    missingEvidence: The amount and exact post-money valuation of the November 2024 Series C are not publicly confirmed.
    whyItMatters: Without the latest round economics, investors cannot anchor dilution, preference stack, or current entry price.
    diligencePath: >-
      Request full capitalization table, Series C term sheet summary, and any implied pricing from management or lead
      investors.
    relatedQuestionRefs:
      - QO008
      - QO011
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: customer-proof
    missingEvidence: Named revenue customers and repeat-purchase evidence remain sparse relative to the company’s scale claims.
    whyItMatters: The overview can verify technology milestones but not whether they translate into durable commercial demand.
    diligencePath: Ask for top-customer list, revenue by segment, repeat-order cohorts, and references for production deployments.
    relatedQuestionRefs:
      - QO023
      - QO024
  - type: conflicting-data
    severity: minor
    topic: governance-disclosure
    missingEvidence: Public sources differ in how they translate Li Lianrong’s and Yang Yufeng’s post-reshuffle titles.
    whyItMatters: Role nuance matters for who actually controls board and management decisions into IPO.
    diligencePath: >-
      Cross-check AIC records, board resolutions, and future prospectus disclosures to reconcile exact governance
      titles.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: sam-sizing
    missingEvidence: >-
      Public sources do not provide a clean bottom-up SAM split for SPIC’s addressable market across fuel cells versus
      PEM electrolyzers.
    whyItMatters: Without a tighter SAM, headline hydrogen TAMs risk overstating the revenue base behind valuation assumptions.
    diligencePath: >-
      Request segment-by-segment pipeline, addressable project count, and win-rate assumptions by product line from
      management.
    relatedQuestionRefs:
      - QM007
      - QM024
  - type: private-evidence-only
    severity: material
    topic: utilization
    missingEvidence: Station utilization, realized hydrogen cost, and operating-hours data remain sparse in public summaries.
    whyItMatters: These variables determine whether demand is durable or merely subsidy-induced.
    diligencePath: Obtain route-level and project-level utilization data from fleets, station partners, and project sponsors.
    relatedQuestionRefs:
      - QM014
      - QM024
      - QM025
  - type: private-evidence-only
    severity: material
    topic: repeat-demand
    missingEvidence: Public evidence rarely shows repeat-order behavior by buyer segment.
    whyItMatters: Repeat demand is the best proof that market pull is sustainable beyond demonstration budgets.
    diligencePath: Request cohort data for repeat purchases, second-site deployments, and paid service attach by segment.
    relatedQuestionRefs:
      - QM019
      - QM025
  - type: private-evidence-only
    severity: material
    topic: competitive-metrics
    missingEvidence: >-
      Public sources rarely disclose realized pricing, gross margin, uptime, or share by project type across direct
      peers.
    whyItMatters: Without these metrics, competitive ranking remains directional rather than decisively underwritten.
    diligencePath: >-
      Request project-level win/loss analysis, realized ASPs, and service economics for SPIC and public peer disclosures
      where available.
    relatedQuestionRefs:
      - QP019
      - QP024
      - QP025
  - type: missing-source
    severity: material
    topic: customer-proof
    missingEvidence: Named customer overlap and repeat-order behavior across competitors are still weakly visible.
    whyItMatters: Competitive advantage in industrial hardware is durable only when buyers come back.
    diligencePath: Obtain customer reference maps, repeat-order cohorts, and account concentration data by competitor lane.
    relatedQuestionRefs:
      - QP018
      - QP024
      - QP025
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn
    missingEvidence: Current cash, monthly burn, runway months, and debt exposure are not public.
    whyItMatters: Without them the IPO case cannot be underwritten as financially de-risked.
    diligencePath: Obtain latest management accounts, cash-flow forecast, and debt schedule.
    relatedQuestionRefs:
      - QI023
      - QI024
      - QI025
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Revenue by product line, customer concentration, and repeat-order share are not public.
    whyItMatters: These are required to test whether growth is durable or project-lumpy.
    diligencePath: Request audited segment revenue and customer concentration schedules.
    relatedQuestionRefs:
      - QI021
      - QI024
      - QI025
  - type: private-evidence-only
    severity: material
    topic: margin-quality
    missingEvidence: Gross margin, warranty reserve, and service attach rates are not disclosed.
    whyItMatters: These metrics determine whether scale improves economics or simply grows losses.
    diligencePath: Request product-line gross margin bridge, warranty history, and service economics.
    relatedQuestionRefs:
      - QI022
      - QI024
      - QI025
  - type: missing-source
    severity: material
    topic: benchmark-transparency
    missingEvidence: >-
      Per-product efficiency curves, degradation tests, and benchmark methodology for both Hydrogen Teng and Hydrogen
      Yong.
    whyItMatters: >-
      Without comparable benchmark methodology, it is hard to judge whether milestone claims translate into procurement
      advantage or only symbolic leadership.
    diligencePath: >-
      Request engineering benchmark decks, third-party test protocols, and customer acceptance criteria for both product
      families.
    relatedQuestionRefs:
      - QE021
      - QE025
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: Fleet-level warranty, RMA, MTBF, and field-failure distributions for deployed Hydrogen Teng systems.
    whyItMatters: Commercial vehicle buyers care more about uptime and service burden than about isolated certification milestones.
    diligencePath: Request warranty-reserve history, RMA dashboards, and major incident logs segmented by product generation.
    relatedQuestionRefs:
      - QE019
      - QE020
      - QE025
    relatedTableRefs:
      - TE004
  - type: missing-source
    severity: material
    topic: software-control-surface
    missingEvidence: Documentation on control interfaces, software stack boundaries, telemetry, and cybersecurity responsibilities.
    whyItMatters: >-
      System integration risk can shift materially depending on whether SPIC ships mostly hardware or a broader digital
      control package.
    diligencePath: Ask management for architecture diagrams, interface documents, and product-security governance materials.
    relatedQuestionRefs:
      - QE024
      - QE025
  - type: private-evidence-only
    severity: material
    topic: manufacturing-economics
    missingEvidence: Nameplate capacity, yield, scrap, and utilization data for the Wuhan base and any newer production lines.
    whyItMatters: >-
      Manufacturing maturity is central to margin and delivery reliability, yet public evidence remains mostly
      narrative.
    diligencePath: Request plant KPI dashboards, throughput history, and capex/utilization bridge by product line.
    relatedQuestionRefs:
      - QE009
      - QE013
      - QE025
    relatedTableRefs:
      - TE003
      - TE005
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Account-level renewals, churn, NRR/GRR, contract length, and fleet utilization by major customer.
    whyItMatters: >-
      Without durability metrics, investors cannot distinguish one-off flagship deliveries from a scalable customer
      franchise.
    diligencePath: Request cohort analysis, top-account renewal history, and contract terms for the top customer programs.
    relatedQuestionRefs:
      - QU013
      - QU014
      - QU015
      - QU025
    relatedTableRefs:
      - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-customer revenue share, backlog mix, and delay/cancellation history.
    whyItMatters: A concentrated customer base can look healthy on deployment counts until one flagship ramp slows or slips.
    diligencePath: Request top-5 customer exposure, backlog by counterparty, and sensitivity to delayed fleet or project deliveries.
    relatedQuestionRefs:
      - QU016
      - QU025
      - QU023
    relatedTableRefs:
      - TU005
  - type: missing-source
    severity: material
    topic: customer-satisfaction
    missingEvidence: Named customer references, service-quality data, or post-deployment satisfaction metrics.
    whyItMatters: >-
      Completed delivery does not guarantee the customer is happy enough to expand, renew, or publicly endorse the
      platform.
    diligencePath: Request reference calls, warranty service KPIs, and major-customer testimonials tied to production programs.
    relatedQuestionRefs:
      - QU015
      - QU025
    relatedTableRefs:
      - TU004
      - TU006
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-roster
    missingEvidence: A fuller roster of named mobility and industrial customers beyond the handful of public showcase programs.
    whyItMatters: The current roster may materially understate or overstate diversification; either way, the picture is incomplete.
    diligencePath: Request anonymized customer-count bands by segment plus permission to reference at least 3-5 major accounts.
