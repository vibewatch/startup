  topStrengths:
    - 国资母公司背书，加上历史融资规模异常大，明显压低了近期生存风险。
    - 公司并非只押注单一狭窄氢能产品线，而是在燃料电池系统和 PEM 电解槽两端都有可信布局。
    - 公开商业化证据有分量：已交付 2,000 多套燃料电池系统、运营里程超过 40M km，并跑出大型 PEM 部署里程碑。
    - 正式 IPO 辅导 / 承销工作说明，进入资本市场不是空泛叙事，而是现实选项。
    - 中国绿氢产能建设给国内电解槽供应商带来真实宏观顺风。
  topRisks:
    - 收入、在手订单、毛利率、烧钱速度和股权结构中的优先权条款仍未披露，估值承销高度不确定。
    - 上市氢能设备同行仍普遍亏损，公开市场估值也低得多，削弱了对高溢价私募估值的信心。
    - 客户证据集中在少数旗舰、政策牵引项目上，而不是一个披露充分、覆盖广泛的客户底盘。
    - 电解槽经济性和更广泛的氢能车辆需求仍容易受成本压力、政策向需求转化不均衡拖累。
    - 管理层交接和此前 IPO 时间表延后，在审视升温时放大了执行风险。
  unresolvedGaps:
    - Series C 后最新估值、IPO 拟定区间，以及 2022 年 Series B 锚点之外任何可靠的当前价格发现。
    - 经审计收入、在手订单、毛利率、质保负担、减值情况和现金消耗数据。
