- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence
  - What would change the view
  rows:
  - - Bull thesis — strategic state-backed hydrogen platform
    - State backing, multi-product footprint, 2,000+ delivered fuel-cell systems, and PEM scale-up milestones support real strategic relevance
    - Show audited economics and broader customer diversification to convert strategic relevance into underwritable value
  - - Bull thesis — IPO optionality is real
    - 2025 underwriter tender and prior IPO preparation language show serious capital-markets intent
    - Produce draft range, cornerstone appetite, and timetable confidence
  - - Bull thesis — green-hydrogen tailwind is tangible
    - China added substantial green-hydrogen capacity and new projects in 2024
    - Show SPIC share of real project economics rather than only milestone presence
  - - Anti-thesis — public comps are harsh
    - SinoHytec and Guofu remain weak or loss-making at far lower public values
    - Demonstrate that SPIC deserves a structurally higher-quality multiple
  - - Anti-thesis — pricing evidence is thin
    - Series C amount and valuation were undisclosed; current revenue, margin, and burn are not public
    - Disclose private financial KPIs and cap-table terms
  - - Anti-thesis — policy and demand still matter too much
    - FCEV demand slowed and Guofu cited weak policy-to-demand transmission
    - Show diversified economics-led demand beyond pilot-era momentum
  notes: The table is designed to separate company quality from entry-price quality, which are not the same judgment.
