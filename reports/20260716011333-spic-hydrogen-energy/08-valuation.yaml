- id: SV-scenarios
  title: 'Scenario framing: public comps cap the downside only if SPIC proves it is structurally better'
  body: 'Scenario analysis has to be qualitative because SPIC does not publish revenue or margin data, but the valuation logic is still tractable. The bear case assumes that IPO investors treat SPIC like a better-positioned version of a troubled hydrogen-equipment pure play: policy demand remains uneven, flagship customer ramps do not broaden fast enough, electrolyzer economics stay under pressure, and the company still cannot disclose convincing revenue, backlog, and gross-margin data. In that world, a public-market haircut toward roughly CNY8 billion to CNY10 billion is plausible. The base case assumes that SPIC really is stronger than the listed peers because of state backing, broader product breadth, and stronger commercialization assets, but that investors still anchor to the last disclosed CNY13 billion private mark until operating evidence improves; that supports something like CNY10 billion to CNY16 billion, with the old Series B anchor near the middle. The bull case requires more
    than hydrogen optimism. It requires named broadening beyond a few flagship programs, audited economic proof, and enough IPO book demand to persuade investors that SPIC deserves a significant premium to peers rather than a modest one.'
  claimRefs:
  - CV019
  - CV021
