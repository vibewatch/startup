  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-valuation
    missingEvidence: Updated post-Series-C valuation, transaction price, and any formal internal or underwriter mark since the December 2022 Series B.
    whyItMatters: Without a current price anchor, investors cannot tell whether they are underwriting a flat, up, or down round relative to the last disclosed CNY13B mark.
    diligencePath: Request board-approved valuation memos, Series C term sheet, and any underwriter valuation materials.
    relatedQuestionRefs:
    - QV001
    - QV004
    - QV019
    - QV030
    relatedTableRefs:
    - TV001
    - TV003
  - type: private-evidence-only
    severity: material
    topic: economics
    missingEvidence: Current revenue, backlog, gross margin, cash burn, warranty reserve, impairment profile, and working-capital detail.
    whyItMatters: These metrics decide whether SPIC deserves a premium to listed peers or only a strategic-narrative premium with weak return support.
    diligencePath: Request audited monthly or quarterly operating pack, product-line revenue split, and receivables / inventory aging.
    relatedQuestionRefs:
    - QV019
    - QV021
    - QV022
    - QV028
    - QV030
    relatedTableRefs:
    - TV001
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-dilution
    missingEvidence: Liquidation preferences, ratchets, anti-dilution protections, option pool, and investor special rights.
    whyItMatters: Enterprise value can rise while common-equity returns disappoint if the preference stack is heavy or asymmetric.
    diligencePath: Request most recent cap table, shareholder agreement, and waterfall analysis at multiple exit values.
    relatedQuestionRefs:
    - QV024
    - QV028
    - QV030
    relatedTableRefs:
    - TV005
    - TV006
  - type: missing-source
    severity: material
    topic: secondary-liquidity-quality
    missingEvidence: Verified transaction history or brokered secondary data that turn private-stock pages into a credible valuation input.
    whyItMatters: A headline price with disclaimers is not enough to support committee-grade valuation work.
    diligencePath: Request verified secondary trades, board-approved transfer records, or broker books with timestamps and sizes.
    relatedQuestionRefs:
    - QV025
    - QV030
    relatedTableRefs:
    - TV006
