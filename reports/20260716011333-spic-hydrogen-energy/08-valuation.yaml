- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bear
    - IPO investors anchor to listed-peer losses, policy demand disappoints, and management still cannot disclose convincing revenue/margin/backlog evidence
    - Roughly CNY8B-CNY10B outcome, implying a meaningful haircut versus the last disclosed private mark
    - Public-comp derating, customer concentration, policy dependence, hidden burn
    - Credible because listed comps still look weak and evidence gaps remain large
  - - Base
    - SPIC is genuinely better than peers, but public evidence remains incomplete and new money stays disciplined
    - Roughly CNY10B-CNY16B range, with the historic CNY13B anchor near the middle
    - Flat-to-modest returns if entry is materially above the old mark without better proof
    - Most defensible on public evidence alone
  - - Bull
    - Revenue, backlog, and margin disclosure are strong; diversified projects scale; IPO bookbuilding validates a premium narrative
    - Roughly CNY18B-CNY24B range, offering meaningful upside from the last disclosed mark
    - Requires economics proof, not just technical or policy milestones
    - Possible, but not yet publicly demonstrated
  - - Reference anchor
    - Last disclosed post-money valuation from Series B
    - CNY13B historical anchor, not a current mark-to-market truth
    - Series C terms and secondary liquidity are undisclosed
    - Useful anchor, but incomplete
  notes: Scenario ranges are author estimates anchored to the last disclosed private mark, public-comp trading levels, and the proof burden implied by current disclosures.
