- id: policy-drivers-and-market-constraints
  title: Policy drivers, infrastructure, and adoption constraints
  body: China’s 2025 hydrogen policy picture improved in formal status but did not remove economic constraints. NEA-linked reporting and policy summaries show that hydrogen is now framed more clearly inside national energy planning, while city-cluster demonstrations continue to channel near-term transport demand. Those are real positives for SPIC. But the same evidence set shows why investors should stay disciplined. Fuel-cell vehicle sales fell in 2024, infrastructure is still sparse relative to national freight networks, and the served market remains highly dependent on where stations, subsidies, and operating economics line up. On the electrolyzer side, the market is benefiting from green-hydrogen industrial policy and capacity growth, yet S&P’s adverse reporting warns that cost pressure and technology competition remain intense. The market therefore has a favorable strategic direction but an uneven commercial slope.
