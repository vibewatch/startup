  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Energy-law recognition of hydrogen
    - Positive
    - Near term
    - Improves policy legitimacy and planning visibility
    - Map which projects benefit directly versus only rhetorically
  - - City-cluster demonstration programs
    - Positive
    - Near term
    - Concentrate demand in funded regions
    - Verify which clusters translate to purchase orders
  - - Localization of core components
    - Positive
    - Medium term
    - Helps domestic champions win politically and economically
    - Test whether localization also improves gross margin
  - - Green industrial hydrogen push
    - Positive
    - Medium term
    - Supports PEM project demand beyond transport
    - Measure actual operating utilization of announced projects
  - - Station density and utilization
    - Negative
    - Near term
    - Limits route economics and fleet confidence
    - Request station-by-station utilization data
  - - Battery-electric truck substitution
    - Negative
    - Current
    - Crowds out hydrogen on many shorter routes
    - Segment routes where hydrogen retains clear TCO advantage
  - - Electrolyzer price competition
    - Negative
    - Current
    - Can compress margin and reward only best-cost suppliers
    - Request realized ASP and service-margin data by project
  - - Project-announcement optimism
    - Negative
    - Current
    - Inflates TAM if many projects stall before steady operation
    - Track commercial operation dates and repeat orders
  notes: Drivers and constraints are listed together because the market is clearly policy-backed but still commercially uneven.
