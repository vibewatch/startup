  headline: >-
    Moniepoint remains Nigeria's scaled SME banking and payments infrastructure — 20M+ accounts, 26M daily payments, and
    $17B monthly TPV — at a $1B valuation, but current headcount and audited financials are still insufficiently
    disclosed for high-conviction underwriting.
