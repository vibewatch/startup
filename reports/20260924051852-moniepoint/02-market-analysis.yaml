- id: SM-S03
  title: Buyer and Segment Map
  body: 'Moniepoint''s market has four distinct buyer archetypes, each with different budget ownership,
    willingness to pay, and adoption trigger:


    **Segment 1 — Micro-merchants and POS agents (core):** Owner-operated shops, market stalls, fuel stations,
    pharmacies, restaurants. These merchants need affordable card acceptance and agency cash services.
    Budget owner is the merchant-proprietor; willingness to pay is low but switching cost is high once
    trained. Adoption trigger: CBN cash-restriction policies (January 2023) that forced consumers to transact
    digitally.


    **Segment 2 — SMEs (growth):** Registered businesses with 1–50 employees needing business current
    accounts, payroll processing, and working capital credit. Budget owner is the business owner/CFO.
    Willingness to pay is medium-high for bundled services. Adoption trigger: Moniebook integration and
    credit eligibility based on transaction history.


    **Segment 3 — Personal banking customers:** Individuals who opened Moniepoint personal accounts (launched
    August 2023) for day-to-day savings and transfers. Budget owner is the individual. Competition from
    OPay, PalmPay, and Kuda is intense in this segment.


    **Segment 4 — B2B payment-gateway clients:** E-commerce platforms, SaaS companies, and SMEs embedding
    payments via Monnify API. Budget owner is the tech/payments team. This is Moniepoint''s closest equivalent
    to Paystack/Flutterwave''s market.


    Geographic distribution: Urban-dense (Lagos, Abuja, Port Harcourt) accounts for the majority of transaction
    value; Northern Nigeria is underpenetrated but growing as CBN exclusion policies push adoption. Moniepoint''s
    distribution model — via field agents who sign up and train merchants — addresses semi-urban and rural
    geographies where competitors have lower presence.

    '
  claimRefs: []
  tableRefs:
  - TM003
  figureRefs: []
- id: SM-S04
  title: Growth Drivers and Adoption Constraints
  body: '**Structural growth drivers:**

    (a) Financial inclusion policy mandate: CBN targets 95% inclusion by 2030; agency banking is the primary
    last-mile delivery mechanism.

    (b) CBN cash-restriction regulations: Weekly cash withdrawal limits (₦500,000 individual, ₦5M business)
    introduced in 2023 have durably shifted transaction volume to digital channels. POS transactions grew
    301% YoY in Q1 2025 alone.

    (c) SME credit underserve: $32.2B financing gap with fewer than 5% of MSMEs having bank credit access
    creates a persistent and large lending opportunity for Moniepoint MFB.

    (d) CBN single-principal rule (effective April 2026): Each POS agent must affiliate exclusively with
    one provider; this is a consolidation catalyst that advantages large, well-capitalised operators and
    could be the most consequential structural tailwind for Moniepoint in 2026.

    (e) Nigeria''s young, mobile-first population: 50%+ smartphone penetration and growing; median age
    18.


    **Adoption constraints:**

    (a) Regulatory compliance costs: National MFB status (January 2026) requires ₦5B minimum capital and
    significantly higher compliance investment. The 2026 CBN Fintech Report introduces enhanced consumer-protection,
    data-localisation, and AML requirements that raise cost-to-serve.

    (b) Macro headwinds: Naira devaluation (₦1,600/$1 as of 2026) erodes USD revenue multiples and compresses
    international investor returns even when naira-denominated revenues grow.

    (c) Credit risk: Rising SME NPLs in a high-inflation environment (CPI ~33% in 2024-2025) threaten
    Moniepoint''s lending book quality.

    (d) Infrastructure: Power outages and internet connectivity gaps in rural areas increase POS downtime
    and constrain deployment.

    (e) Trust barriers: Fraud incidents and CBN enforcement actions erode merchant and consumer confidence
    in digital payments, requiring ongoing brand investment.

    '
