  evidenceGaps:
  - type: missing-source
    severity: material
    topic: market-sizing-methodology
    missingEvidence: Verified methodology and primary data underlying IMARC's Nigeria fintech market size
      estimate ($1.31B); independent corroboration from a second tier-1 analyst (Wood Mackenzie, Statista,
      IDC, or similar)
    whyItMatters: IMARC is a medium-reputation source whose Nigeria fintech estimate is widely cited but
      whose methodology is not publicly disclosed; over-reliance on one analyst estimate could significantly
      distort valuation comparisons
    diligencePath: Commission independent market sizing or cross-reference with Statista Digital Economy
      Compass, CBN Annual Report, and Interswitch/Flutterwave revenue disclosures
    relatedQuestionRefs:
    - QM024
  - type: missing-source
    severity: material
    topic: take-rate-data
    missingEvidence: Moniepoint's actual blended take-rate on POS transactions, business accounts, and
      credit — needed to construct a credible bottom-up revenue model
    whyItMatters: The SAM/SOM estimates in this chapter depend on assumed take-rates of 0.1–0.5%; even
      a 0.1% variation changes revenue estimates by $100M+
    diligencePath: Request merchant fee schedule from Moniepoint; cross-reference with CBN POS pricing
      guidelines and Interswitch published pricing
    relatedQuestionRefs:
