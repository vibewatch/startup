figures:
- id: FU001
  type: journey-map
  title: Customer Journey Map
  summary: End-to-end SME merchant journey showing how adoption deepens platform lock-in.
  claimRefs: []
  data:
    items:
    - label: 1. Business Onboarding
      detail: SME signs up; KYC via BVN/NIN verification; field agent delivers POS terminal; geo-tagging
        recorded
      actor: Merchant + field agent
    - label: 2. Daily Payment Acceptance
      detail: Card or QR payment settles through Moniepoint rails with offline buffering for poor connectivity
      actor: Merchant + customer
    - label: 3. Transaction Data Accumulation
      detail: POS events flow into the data pipeline and build a merchant cash-flow profile
      actor: Moniepoint ML pipeline
    - label: 4. Credit Underwriting
      detail: Merchant becomes eligible for working-capital credit after transaction history accumulates
      actor: Merchant + Moniepoint MFB
    - label: 5. Loan Disbursement and Repayment
      detail: Loan is disbursed and repaid automatically from transaction flow
      actor: Merchant + Moniepoint MFB
    - label: 6. SaaS and Platform Deepening
      detail: Merchant upgrades to bookkeeping and payroll tooling, increasing switching costs
      actor: Merchant + Moniepoint ecosystem
  approximationNotes: Illustrative journey map based on public product and customer surfaces.
