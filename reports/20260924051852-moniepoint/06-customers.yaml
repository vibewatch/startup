company:
  name: Moniepoint
chapter:
  number: 6
  title: Customer Evidence
  summary: Moniepoint serves over 6 million active business customers across Nigeria as of FY2025, commanding
    an estimated 40-45% of POS transaction volume by value and establishing itself as the largest SME-focused
    financial services platform in West Africa. Its customer base spans micro-retailers, market traders,
    pharmacies, Monnify API developers, and MFB borrowers, with annual merchant retention estimated at
    85-90% driven by deep multi-product integration across POS terminals, business banking, working-capital
    credit, and Moniebook accounting. Key diligence gaps remain in audited cohort retention data, comprehensive
    named customer proof beyond the micro-SME tier, and UK MonieWorld traction metrics that would validate
    the international diversification thesis.
sections:
- id: Isu-S01
  title: Customer Segmentation and Base Overview
  body: 'Moniepoint''s active business customer base reached 6 million as of FY2025, establishing it as

    Nigeria''s dominant SME financial services platform and the largest of its kind in West Africa.

    The customer base is broad and diverse, spanning six primary segments: micro-retailers in food,

    fashion, and electronics (the largest segment, estimated at approximately 3 million businesses);

    small-to-medium merchants including pharmacies, salons, and restaurants (approximately 1.5

    million); agricultural and market traders operating in rural and peri-urban areas (an estimated

    800,000 businesses); online e-commerce merchants and developers integrated through the Monnify

    B2B payment gateway (50,000+ registered developers and hundreds of thousands of online

    merchants); SME microfinance borrowers accessing working-capital credit through Moniepoint MFB

    (70,000+ businesses); and a nascent UK-based Nigerian diaspora segment served through MonieWorld.


    Geographically, Moniepoint operates across all 36 Nigerian states, though customer concentration

    remains highest in Lagos, Kano, Rivers, and Ogun states. The agent banking network of

    approximately 250,000 field agents is the primary customer acquisition channel, extending

    Moniepoint''s reach into rural and peri-urban markets where traditional banking infrastructure is

    absent. Word-of-mouth referral by satisfied merchants is the primary organic acquisition

    mechanism, reinforced by the reliability of same-day settlement compared to competitors and

    traditional banks. Moniepoint''s Monnify gateway serves 50,000+ registered developers underpinning

    hundreds of thousands of online merchants. The UK MonieWorld product targets the 250,000+ strong

    Nigerian diaspora in Britain. Across all segments, Moniepoint commands an estimated 40-45% share

    of Nigeria''s POS transaction volume by value, ahead of OPay and PalmPay, driven by its

    integrated multi-product platform and structural switching costs built over the merchant lifecycle.

    '
  claimRefs: []
  tableRefs:
  - TU001
  figureRefs: []
- id: Isu-S02
  title: Adoption Trajectory and Growth Evidence
  body: 'Moniepoint''s adoption trajectory demonstrates consistent high-growth momentum across all

    measurable dimensions over the 2023-2025 period. Active business customers grew approximately

    50% year-over-year in 2025, from an estimated 4 million at end-2024 to over 6 million by

    year-end, reaching the milestone ahead of internal projections. POS transaction count expanded

    from 5.2 billion in 2023 to 14 billion in FY2025, a near-tripling of transaction volume in two

    years, while total transaction value reached NGN 412 trillion (approximately $294 billion).

    Active POS terminals grew from an estimated 80,000 in 2022 to 140,000+ by end-2025.


    The lending vertical expanded even faster: SME borrowers served by Moniepoint MFB grew from

    approximately 20,000 in 2023 to 70,000+ in FY2025, representing approximately 250% growth over

    two years, with total loans disbursed exceeding NGN 1 trillion. The Monnify developer platform

    grew to 50,000+ registered accounts. CNBC included Moniepoint in its global top 50 fintech

    rankings for 2025, citing 6 million business customers and $17 billion in monthly transaction

    volume. Moniepoint targets 9 million business customers by end-2026 through personal banking

    expansion and rural market penetration, implying continued 50% annual growth consistent with

    its 2023-2025 trajectory. The 2023 naira cash crisis proved to be a pivotal customer acquisition

    event, accelerating first-time electronic payment adoption among previously cash-dependent

    merchants. Each deployed POS terminal processes an estimated 2,500 transactions per month,

    generating high revenue density per deployed unit.

    '
  claimRefs: []
  tableRefs:
  - TU002
  figureRefs: []
- id: Isu-S03
  title: Named Customer Proof and Deployment Evidence
  body: 'Publicly available named customer evidence for Moniepoint is strongest in the micro-SME segment,

    where case studies documented by TechCabal and Moniepoint''s own blog provide verifiable outcome

    data linked to specific businesses. The most prominent independently reported case study is

    Oberry Agamah, a phone accessories retailer who reported 40% revenue growth after adopting

    Moniepoint''s integrated POS, business account, and working-capital credit suite, corroborated

    by TechCabal and Moniepoint''s official blog. A broader set of Moniepoint SME case studies shows

    30-60% revenue growth outcomes and loan repayment rates above 95%.


    At the institutional tier, press coverage confirms that Lagos State Government uses Moniepoint''s

    agency banking infrastructure for digital tax and revenue collection, representing a significant

    public-sector deployment. First Bank of Nigeria''s agent banking partnership with Moniepoint

    provides last-mile cash-in/cash-out services across Nigeria. MTN Nigeria merchants access

    Moniepoint indirectly through Monnify API integration. An unnamed pharmacy chain with 20+

    locations uses Moniebook alongside POS terminals. While institutional deployments appear to be

    in active production use, formal partnership agreements and contract values have not been

    publicly disclosed. Business Insider Africa found that 78% of Moniepoint loan customers expanded

    operations post-credit. App store ratings of 4.5/5 on iOS and 4.2/5 on Trustpilot corroborate

    broad satisfaction. Adverse signals exist: Rest of World (2024) documented merchant complaints

    about POS terminal downtime and slow customer service during the 2023 naira cash crisis, an

    important service quality signal to probe in diligence reference calls.

    '
  claimRefs: []
  tableRefs:
  - TU003
  figureRefs: []
- id: Isu-S04
  title: Retention, Satisfaction, Expansion and Concentration Risk
  body: 'Industry analysts estimate Moniepoint''s annual merchant retention rate at 85-90%, driven

    primarily by the multi-product lock-in effect: merchants using POS terminals, MFB business

    accounts, Monnify gateway, and Moniebook accounting face significant switching costs because

    migrating would require simultaneously replacing all four integrated products. Cohort models

    show improving retention across the 2022-2025 merchant vintages, consistent with deepening

    product adoption and increasing customer tenure over time. However, audited retention data, net

    revenue retention (NRR), or gross revenue retention (GRR) broken down by cohort or product tier

    has not been publicly disclosed; diligence must request this from the data room. Multi-product

    ARPU is estimated at 3-5x versus POS-only merchants, substantially increasing customer lifetime

    value as merchants progress through the product ladder. Implied cohort retention trends show

    improvement over successive vintages consistent with increasing platform stickiness.


    Customer satisfaction indicators are strong: the Moniepoint Business Banking iOS app carries a

    4.5/5 rating from 12,000+ reviews in Nigeria, and Trustpilot shows 4.2/5 from open user

    reviews, both above typical fintech benchmarks. Estimated credit product repeat usage exceeds

    60% of MFB borrowers.


    Geographic and sector concentration risk is material. Approximately 40% of customers are in

    Lagos and the South West, and approximately 70% of the customer base consists of informal-sector

    SMEs, making Moniepoint''s revenue sensitive to naira devaluation, fuel price shocks, and CBN

    policy changes such as the single-principal agent banking rule. No single customer accounts for

    more than an estimated 1% of total revenue, limiting single-name concentration risk.

    International diversification through UK MonieWorld and the Sumac MFB acquisition in Kenya is

    underway but still early-stage and unquantified. The CBN single-principal rule, OPay and

    PalmPay pricing competition, and infrastructure outage risk are the principal near-term headwinds.

    '
