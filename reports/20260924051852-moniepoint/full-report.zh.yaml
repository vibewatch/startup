      - number: '1.3'
        title: 融资历程与投资机构
        blocks:
          - type: paragraph
            body: >
              Moniepoint 历次股权融资累计筹集约 $256M。早期机构资金来自 QED Investors、Novastar Ventures、Global Ventures、FMO、British
              International Investment（BII）、Endeavor Catalyst 和 New Voices Fund。2022 年，公司以约 $400M 估值完成 $50M 融资。

              最具标志性的融资是分两批完成的 Series C 轮。2024 年 10 月宣布的首期交割达 $110M，由 Development Partners International（DPI）通过旗下 African
              Development Partners（ADP）III 基金领投，Google's Africa Investment Fund、Verod Capital 与 Lightrock 参投。该期交割赋予
              Moniepoint 超过 $1B 的估值，使其成为非洲第八家独角兽企业。

              2025 年 10 月紧随其后完成了 $90M 的第二期交割，引入 Visa、国际金融公司（IFC）、LeapFrog Investments、Proparco、Swedfund 和 Alder Tree
              Investments。至此，Series C 总额达到 $200M+，成为非洲金融科技史上规模最大的融资之一。Financial Technology Partners 担任独家财务顾问。

              Visa 的注资尤为亮眼：它身兼战略伙伴（Moniepoint 已借由子公司 TeamApt 获得 Visa 交易处理与收单牌照）与财务投资人双重角色，标志着国际卡组织对 Moniepoint
              支付基础设施的背书。IFC 的加入则带来开发性金融机构的信誉支撑，并打开其在全非聚焦 MSME 的项目合作网络。

              公司公开声明其在独角兽体量下已实现盈利——在非洲金融科技领域实属罕见——并披露近年来收入年复合增长率（CAGR）超过 150%。
            claimRefs:
