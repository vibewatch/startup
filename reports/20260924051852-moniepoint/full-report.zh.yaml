chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与发展历程
        blocks:
          - type: paragraph
            body: >
              Moniepoint Inc.（原注册名为 TeamApt Inc.）是一家总部位于尼日利亚的金融科技公司，为非洲企业及其客户提供一体化金融平台。公司由 Tosin Eniolorunda 和 Felix Ike
              于 2015 年在尼日利亚拉各斯创立，两人相识于当地科技与银行圈。Eniolorunda 曾供职于尼日利亚头部支付基础设施公司 Interswitch，对该国支付生态与结构性缺陷有着深刻理解。

              成立之初，TeamApt 专注于为尼日利亚传统银行开发支付基础设施和后端软件。作为大行的技术合作伙伴，公司协助其推进支付架构和清算系统现代化。这段经历让 TeamApt
              摸清了传统银行服务失灵的痛点：交易结算慢、拒付率高、流水可见度低。

              2019 年，TeamApt 实施战略转型，取得尼日利亚央行（CBN）代理银行牌照，并推出 Moniepoint 品牌直接服务商户和小微企业。该产品最初是用于商户收单的 POS 终端，在 2023
              年尼日利亚现金危机期间迅速爆发——当时政府推行货币改版引发全国性现金短缺，迫使企业倒向数字支付网络。凭借高可靠性与即时退款撤单能力，Moniepoint 迅速铺开至尼日利亚全国 774 个地方政府辖区（LGA）。

              2023 年，TeamApt 正式将母公司更名为旗舰产品名称 Moniepoint Inc.，既因该品牌在尼日利亚中小企业中极具知名度，也顺应了拉近企业形象与客户群体距离的需求。如今，Moniepoint
              总部设在尼日利亚拉各斯，并在伦敦设立了快速扩张的英国子公司（Moniepoint GB）。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
