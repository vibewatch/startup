  - id: FU001
    type: journey-map
    title: 客户旅程全景图
    summary: 中小企业商户端到端旅程，展示平台如何逐步加深锁定效应。
    claimRefs: []
    data:
      items:
        - label: 1. 商户入驻
          detail: 中小企业注册；通过 BVN/NIN 核验完成 KYC；地推代理送达 POS 终端；完成地理位置打点记录
          actor: 商户 + 地推代理
        - label: 2. 日常收单
          detail: 银行卡或 QR 码付款经由 Moniepoint 清算网络结算，弱网环境下支持离线缓存
          actor: 商户 + 顾客
        - label: 3. 交易数据沉淀
          detail: POS 流水接入数据流水线，沉淀形成商户现金流画像
          actor: Moniepoint ML 流水线
        - label: 4. 授信风控评估
          detail: 商户累积足够交易流水后，即获得营运资金贷款准入资格
          actor: 商户 + Moniepoint MFB
        - label: 5. 放款与还款
          detail: 资金自动放款，后续从日常交易流水中自动扣划还款
          actor: 商户 + Moniepoint MFB
        - label: 6. SaaS 渗透与生态深化
          detail: 商户加购记账与薪酬管理工具，进一步抬高切换成本
          actor: 商户 + Moniepoint 生态系统
    approximationNotes: 客户旅程示意图，梳理自公开产品界面与客户接触点。
