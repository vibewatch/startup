      - number: '1.4'
        title: 商业模式与产品矩阵
        blocks:
          - type: paragraph
            body: >
              Moniepoint 运营着纵向一体化的金融服务平台，主打尼日利亚庞大的非正规经济体系——该领域吸纳了非洲大陆 83% 的就业人口。公司的商业模式以商户收单（向商家布放 POS
              机）为初始切入点，借助借贷、银行、外汇及企业经营管理工具等周边金融服务获取增量收入，持续加深客户绑定。

              收入构成包含多条路径：(1) POS 与数字转账流水的交易手续费（各渠道综合抽成率估计在 0.1–0.5%）；(2) 依托 Moniepoint Microfinance Bank
              发放营运资金贷款获取的利息收入；(3) Moniebook 订阅费（₦6,000–₦8,500/月）；以及 (4) 跨境与汇款业务的汇兑点差。鉴于 2025 年处理流水达 ₦412T，TechCabal
              估计其总支付收入介于 ₦412B 至 ₦2T 之间，具体取决于渠道结构。

              产品线覆盖：(a) POS 终端与聚合收单——深入渗透尼日利亚 774 个地方政府辖区（LGA）；(b) Moniepoint 商业银行账户；(c)
              依据交易记录、支付行为等替代数据评估信用的信贷与营运资金借贷；(d) Monnify 网页支付网关（2025 年处理 ₦25T）；(e) Moniebook——POS 加记账一体化方案；以及 (f)
              MonieWorld——面向非洲海外侨民的英国汇款服务（2025 年 4 月上线）。此外，公司运营的个人银行业务（2023 年 8 月推出）首年便爆发式增长 2,000%。

              Moniepoint 的分销网络倚重超过 600,000 名“业务经理”——这些扎根社区的代理人靠拓展商户与铺设 POS
              终端赚取佣金。在尼日利亚半正规经济中，信任建立在熟人实体往来之上，事实证明这套人际地推网络比纯线上打法更加皮实耐冲击。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
      - number: '1.5'
        title: 业务规模、核心指标与监管准入
        blocks:
          - type: paragraph
            body: >
              截至 2026 年初，Moniepoint 在尼日利亚全境服务超过 10M 活跃企业及个人用户。另一方面，公司官方博客自述平台覆盖 20M 企业与个人——口径差异大概率源于“活跃”与“注册”的定义不同。较保守的
              10M 活跃用户数据见于 2025 年 1 月 MonieWorld 上线新闻稿以及 2025 年 10 月 Series C 最终交割公告。

              Moniepoint 在 2025 年的运营业绩无论从哪个维度看都极为耀眼：全年处理 14B 笔交易（较 2023 年的 5.2B 增长 169%）；交易金额达 ₦412T（较 2023 年的 $150B 增长
              96%）；尼日利亚全境 80% 的线下实体支付通过 Moniepoint 网络完成；且经由 Moniepoint MFB 发放的 SME 贷款突破 ₦1T。

              截至 2026 年初，员工规模的公开估算介于 3,700 至 5,200 人之间，反映出业务扩张极快且外包与正式员工统计口径不一。公司在最近一次披露期内报告员工人数增长了 36%。

              Moniepoint 在尼日利亚持有以下牌照：(1) 小额信贷银行（MFB）牌照，尼日利亚央行（CBN）已于 2026 年 1 月将其升格为全国性牌照；(2) 支付终端服务提供商（PTSP）牌照；(3) 经由
              TeamApt Ltd 持有的转接清算与交易处理牌照；以及 (4) 2025 年通过严苛认证后取得的 Mastercard 与 Visa 交易处理商兼收单机构牌照。

              2026 年 1 月，CBN 将 Moniepoint MFB 的牌照升格为全国性资格，要求其资本金不低于 ₦5B、遵守更严厉的 KYC/AML 监管并进入核心区域设立实体网点。此前在 2024 年，CBN 曾因
              KYC 违规向 Moniepoint 开出 ₦1B 罚单——这起负面监管事件释放出明显信号，表明官方对数字金融平台的监管审视正全面收紧。
