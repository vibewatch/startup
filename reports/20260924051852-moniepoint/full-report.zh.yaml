      - number: '1.2'
        title: 创始人与管理团队
        blocks:
          - type: paragraph
            body: >
              Moniepoint 的管理层以两位联合创始人为核心：Tosin Eniolorunda（集团 CEO 兼创始人）和 Felix Ike（联合创始人兼首席信息技术官）。Eniolorunda
              曾在非洲大型支付基础设施企业 Interswitch 任职，这段经历直接塑造了 Moniepoint
              以技术立足的路径，打造出性能优于传统银行系统的底层支付网络。他的管理风格强调纪律、担当与执行一致性，带领公司从低调的 B2B 基础设施服务商成长为非洲首屈一指的商户收单机构。

              Felix Ike 是 Moniepoint 核心平台的技术架构师。在他的工程领导下，团队搭建起分布式系统，支撑起每秒 444 笔交易（TPS）的高吞吐量和业内领先的稳定性。在 Ike
              推动下，公司的工程文化主抓低延迟清算与高可用性，这正是商户放弃竞品转投 Moniepoint 时最常提及的两个核心考量。

              除两位联合创始人外，Moniepoint 还组建了一支实力深厚的高管团队，包括 Babatunde Olofin（Moniepoint MFB 董事总经理）、Solomon
              Amadi（支付基础设施副总裁）、Tunde Olofin（银行牌照业务董事总经理）以及 Edidiong Uwemakpan（传播副总裁）。充实的高管梯队在一定程度上分散了关键人风险，不过
              Eniolorunda 的外部曝光与融资人脉依然高度集中在 CEO 一人身上。

              公司治理沿袭典型私营公司常态，未公开披露董事会成员信息。按照标准风险投资条款推测，DPI、LeapFrog 等 Series C 投资人应拥有董事会观察员或正式董事席位，但具体董事会架构尚未公开披露。
            claimRefs:
