        - 披露带有外部审计盖章的 FY2025 经审计收入与 NPL 比率
      - - 监管环境
        - 2026 年 1 月获批升级为全国性微众银行（MFB）牌照，获得 CBN 监管认可并拓宽信贷业务范围
        - 招致 1B 奈拉 KYC/AML 罚款（2024 年 Q2）、面临 21B 奈拉活跃欺诈诉讼、EMAAR 庞氏骗局集体诉讼威胁；CAC 建议将其列入观察名单（2025 年 12 月）
        - 21B 奈拉欺诈案判决结果与 EMAAR 集体诉讼立案认证决定
      - - 泛非业务
        - 泛非扩张储备涵盖埃塞俄比亚、加纳和肯尼亚；IFC 多边机构关系有助于进入新市场；CBN 国际化打法或可借鉴
        - 国际收入目前微不足道；面临多年期执行风险；全新监管环境带来合规成本与资本拖累
        - 首个国际市场在 18 个月内实现 $10M+ ARR（加纳或埃塞俄比亚）
      - - 估值与退出
        - $1B 入场估值对应约 5-7x ARR，相比 OPay（$2B，8-12x）与 Flutterwave（$3B，10-15x）可比估值折价合理
        - 二级市场可比公司（dLocal 为 1.1x ARR）表明一级市场溢价可能在 IPO 时遭遇压缩；奈拉折价进一步削减美元退出收益
        - Mastercard / Visa 或全球性银行发起战略并购意向与 IPO 路径的博弈
    notes: 关键摇摆因素指最有可能推动投资逻辑从多头转向空头（或反之）的单一关键证据。所有估值可比数据均为最新公开披露估值，其中 OPay 与 Flutterwave 的数据可能已滞后 2-4 年。
    claimRefs: []
  - id: TV003
    title: 乐观 / 基准 / 悲观情景测算表
    columns:
      - 情景
      - 概率
      - FY2027E ARR
      - 核心假设
      - ARR 倍数
      - 隐含估值
      - 较 $1B 入场点回报率
    rows:
      - - 乐观情景
        - 20%
        - $400M
        - 泛非业务打开局面（加纳与埃塞俄比亚上线，贡献 $80-100M ARR）；信贷利差扩大；奈拉汇率企稳；未遭遇实质性 CBN 业务限制
        - 8-10x ARR
        - $3.2-4.0B
        - +220-300%
      - - 基准情景
        - 60%
        - $300M
        - 维持尼日利亚主导地位（10M+ 活跃商户）；泛非业务处于早期且贡献尚不显著；奈拉进一步贬值幅度 <=20%；CBN 合规成本在可控范围内
        - 6x ARR
        - $1.8B
        - +80%
      - - 悲观情景
        - 20%
        - $175-200M
        - CBN 收紧信贷或代理银行业务；奈拉兑美元进一步贬值 -30%+；OPay 与 Flutterwave 蚕食中小企业市场份额；21B 奈拉诉讼负债坐实
        - 3-4x ARR
        - $525-800M
        - '-20% to -47%'
    notes: >-
      概率加权预期估值：20% x $3.6B + 60% x $1.8B + 20% x $0.66B = 约 $1.93B（较 $1B 入场点 +93%）。ARR 预估为分析师推算口径；Moniepoint
      尚未披露经审计收入。汇率变动（奈拉贬值）使基准与悲观情景下的美元回报缩水 15-25%。
    claimRefs: []
