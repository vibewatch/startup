company:
  name: Moniepoint
  shortDescription: Moniepoint is a Nigerian fintech platform spanning payments, business banking, credit,
    and merchant operations. Current public surfaces show 20M+ business and individual accounts, 26M daily
    payments, 200M API calls per minute, and $17B in monthly TPV. The company remains a $1B-valued unicorn
    after raising over $200M in Series C capital, while third-party estimates continue to place revenue
    around $600M and headcount between roughly 1K and 5.7K.
chapter:
  number: 1
  title: Company Overview
  summary: Moniepoint continues to look like Nigeria's scaled SME banking and payments infrastructure
    layer. The 2026 refresh confirms very large current scale metrics on the homepage, a $1B valuation,
    over $200M raised in Series C financing, and persistent uncertainty around audited financials and
    headcount.
sections:
- id: identity-and-history
  title: Company Identity and History
  body: 'Moniepoint Inc., incorporated formerly as TeamApt Inc., is a Nigerian-headquartered fintech company
    providing an all-in-one financial platform for businesses and their customers across Africa. The company
    was founded in Lagos, Nigeria in 2015 by Tosin Eniolorunda and Felix Ike, who met while working in
    Nigerian technology and banking circles. Eniolorunda previously worked at Interswitch, one of Nigeria''s
    premier payments infrastructure companies, giving him deep insight into the country''s payment ecosystem
    and its structural gaps.

    In its earliest years, TeamApt focused on building payment infrastructure and back-end software for
    traditional Nigerian banks. The company served as a technology partner to major banks, helping modernise
    their payment stacks and settlement systems. This phase gave TeamApt a granular understanding of where
    banks failed their customers: slow transaction settlement, high decline rates, and poor visibility
    into transaction flows.

    In 2019, TeamApt made a strategic pivot, obtaining an agency banking license from the Central Bank
    of Nigeria (CBN) and launching the Moniepoint brand to serve merchants and small businesses directly.
    The product — initially a point-of-sale terminal for merchant payment acceptance — quickly gained
    traction during Nigeria''s 2023 cash crisis, when the government''s currency redesign exercise caused
    widespread cash shortages and forced businesses to rely on digital payment rails. Moniepoint''s reliability
    and instant reversal capability during that period drove rapid adoption across Nigeria''s 774 local
    government areas.

    In 2023, TeamApt formally rebranded the parent company to align with its flagship product, fully becoming
    Moniepoint Inc. This reflected the brand''s enormous recognition among Nigerian SMEs and the company''s
    desire to bring the corporate identity closer to its customer base. Today, Moniepoint is headquartered
    in Lagos, Nigeria, with a growing UK subsidiary (Moniepoint GB) in London.

    '
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  tableRefs: []
  figureRefs:
  - FO001
- id: founders-and-leadership
  title: Founders and Leadership
  body: 'Moniepoint''s leadership is anchored by its two co-founders, Tosin Eniolorunda (Group CEO and
    Founder) and Felix Ike (Co-Founder and Chief Information Technology Officer). Eniolorunda''s background
    at Interswitch — one of Africa''s most significant payment infrastructure companies — directly informed
    Moniepoint''s technical-first approach to building payment rails that could outperform legacy bank
    systems. His leadership style emphasises discipline, ownership, and consistency, and he has steered
    the company from a quiet B2B infrastructure provider to Africa''s most significant merchant acquirer.

    Felix Ike serves as the technology architect behind Moniepoint''s core platforms. His engineering
    leadership built the distributed systems that enable Moniepoint''s 444 transactions-per-second throughput
    and industry-leading reliability. The company''s engineering culture — shaped by Ike — prioritises
    low-latency settlement and high availability, the two factors merchants cite most frequently when
    choosing Moniepoint over competitors.

    Beyond the two co-founders, Moniepoint has assembled a deep executive team including Babatunde Olofin
    (Managing Director, Moniepoint MFB), Solomon Amadi (VP, Payment Infrastructure), Tunde Olofin (Managing
    Director of the banking arm), and Edidiong Uwemakpan (VP, Communications). The bench strength reduces
    key-person risk somewhat, though Eniolorunda''s external visibility and fundraising relationships
    remain heavily concentrated at the CEO level.

    Moniepoint''s governance reflects a private company with no public board disclosure. DPI, LeapFrog,
    and other Series C investors are presumed to hold board observer or director seats per standard venture
    terms, but specific board composition has not been publicly disclosed.

    '
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  tableRefs:
  - TO002
- id: funding-and-investors
  title: Funding History and Investors
  body: 'Moniepoint has raised approximately $256 million in total equity financing across multiple rounds.
    Early institutional capital came from QED Investors, Novastar Ventures, Global Ventures, FMO, British
    International Investment (BII), Endeavor Catalyst, and New Voices Fund. In 2022, the company raised
    $50 million at an approximate $400 million valuation.

    The defining financing event was the Series C, executed in two tranches. The first close of $110 million
    was announced in October 2024, led by Development Partners International (DPI) through its African
    Development Partners (ADP) III fund, with participation from Google''s Africa Investment Fund, Verod
    Capital, and Lightrock. This first close valued Moniepoint at over $1 billion, granting unicorn status
    — the continent''s eighth.

    A second close of $90 million followed in October 2025, introducing Visa, the International Finance
    Corporation (IFC), LeapFrog Investments, Proparco, Swedfund, and Alder Tree Investments. The total
    Series C thus reached $200 million+, making it one of the largest fintech fundraises in African history.
    Financial Technology Partners acted as exclusive financial advisor.

    Visa''s participation is particularly notable: it is both a strategic partner (Moniepoint now holds
    Visa processor and acquirer licenses through its TeamApt subsidiary) and a financial investor, signalling
    global card-scheme validation of Moniepoint''s payment infrastructure. The IFC''s involvement brings
    development-finance credibility and access to IFC''s network of MSME-focused programmes across Africa.

    The company has publicly stated it is profitable at unicorn scale — a rare distinction among African
    fintechs — and discloses revenue growing at over 150% CAGR in recent years.

    '
