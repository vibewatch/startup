- id: business-model-and-products
  title: Business Model and Products
  body: 'Moniepoint operates a vertically integrated financial services platform targeting Nigeria''s
    vast informal economy, which accounts for 83% of employment on the African continent. The company''s
    business model is centred on merchant acquiring (POS terminals deployed to businesses) as the initial
    hook, with adjacent financial services — lending, banking, FX, and business management tools — generating
    incremental revenue and deepening lock-in.

    Revenue comes from multiple streams: (1) transaction fees on POS and digital transfer volumes (estimated
    0.1–0.5% take rate across channels); (2) interest income on working capital loans disbursed through
    Moniepoint Microfinance Bank; (3) subscription fees for Moniebook (₦6,000– ₦8,500/month); and (4)
    FX spreads on cross-border and remittance transactions. With ₦412 trillion processed in 2025, TechCabal
    estimates gross payment revenue between ₦412 billion and ₦2 trillion depending on channel mix.

    Products span: (a) POS terminals and payment acceptance — ubiquitous across Nigeria''s 774 LGAs; (b)
    Moniepoint business banking accounts; (c) credit and working capital loans underwritten via alternative
    data (transaction history, payment behaviour); (d) Monnify web payment gateway (₦25 trillion processed
    in 2025); (e) Moniebook — an all-in-one POS + bookkeeping solution; and (f) MonieWorld — a UK-launched
    remittance service for the African diaspora (April 2025). The company also operates a personal banking
    vertical (launched August 2023) that grew 2,000% in its first year.

    Moniepoint''s distribution relies on over 600,000 "business managers" — community-embedded agents
    who earn commissions onboarding merchants and deploying POS terminals. This human-channel distribution
    model has proven more resilient than purely digital approaches in Nigeria''s semi-formal economy,
    where trust is built through physical relationships.

    '
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  figureRefs: []
- id: scale-and-regulatory-footprint
  title: Scale, Key Metrics, and Regulatory Footprint
  body: 'As of early 2026, Moniepoint serves over 10 million active businesses and individuals across
    Nigeria. Separately, its blog describes 20 million businesses and individuals across its platform
    — the discrepancy likely reflects different definitions of "active" vs. registered. The more conservative
    10 million active figure comes from the January 2025 MonieWorld launch press release and the October
    2025 Series C close announcement.

    Moniepoint''s 2025 operational performance was exceptional by any measure: 14 billion transactions
    processed (up 169% from 5.2 billion in 2023); ₦412 trillion in transaction value (up 96% from $150
    billion in 2023); 80% of Nigeria''s in-person payments flowing through Moniepoint rails; and over
    ₦1 trillion in SME loans disbursed through Moniepoint MFB.

    On headcount, public estimates range from 3,700 to 5,200 employees as of early 2026, reflecting rapid
    scaling and definitional differences (contractors vs. direct employees). The company reported 36%
    employee growth in its most recent disclosed period.

    Moniepoint holds the following licences in Nigeria: (1) Microfinance Bank licence, upgraded to National
    status by the CBN in January 2026; (2) Payment Terminal Service Provider (PTSP) licence; (3) Switching
    and Processing licence via TeamApt Ltd; and (4) Mastercard and Visa processor and acquirer licences
    obtained in 2025 after a rigorous certification process.

    In January 2026, the CBN upgraded Moniepoint MFB''s licence to national status, requiring a minimum
    capital base of ₦5 billion, stricter KYC/AML compliance, and physical presence in key areas. This
    followed a ₦1 billion CBN penalty levied on Moniepoint in 2024 for KYC non-compliance — an adverse
    regulatory event that underscores heightened scrutiny on digital financial platforms.

    '
