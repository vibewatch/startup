- id: TE002
  title: Workflow / use-case table
  columns:
  - Use Case
  - Customer Segment
  - Entry Point
  - Moniepoint Steps
  - Output / Value
  - Products Involved
  notes: Workflows derived from product documentation, developer guides, and analyst coverage. Loan approval
    timelines and disbursement mechanics sourced from Capria VC and Moniepoint official disclosures.
  claimRefs: []
  rows:
  - - Card / QR payment acceptance
    - Micro/small merchants
    - Customer presents card or QR code at POS
    - POS → NIBSS switching → real-time settlement to MFB account
    - Instant settlement (<5s); digital receipt; offline buffering if network drops
    - POS Terminal + MFB account
  - - Short-term SME working capital
    - Established Moniepoint merchants
    - 6+ months of POS history triggers in-app eligibility
    - ML credit score → in-app application → approval in hours → disbursement to account
    - ₦14.3M avg loan; same-day disbursement; daily repayment from settlement
    - MFB lending engine + POS transaction data + BigQuery ML
  - - Online payment integration (B2B)
    - Developers / e-commerce merchants
    - Register on Monnify developer portal; obtain API keys
    - REST API call → NIBSS routing → webhook event → settlement to payout account
    - Online checkout; real-time payout; BVN/NIN KYC
    - Monnify API + MFB settlement + NIBSS
  - - SME payroll processing
    - SME employers with staff
    - Monthly payroll run in Moniebook app
    - Payroll list upload → bulk payment instruction → employee wallets credited
    - Automated payroll disbursement; full audit trail; tax records
    - Moniebook + business account + MFB bulk payments
  - - UK diaspora remittance
    - Nigerian in UK
    - MonieWorld mobile app
    - GBP debit → FX conversion → NGN credit to Nigerian recipient account
    - Same-day NGN delivery; transparent FX rate
    - MonieWorld + MFB receipt + SWIFT / UK rails
  - - 3rd-party POS app deployment
    - ISV software developers
    - Integrate PaaP Kotlin SDK; submit app to Moniepoint POS manager
    - App bundled (<30MB) → deployed to merchant POS → app receives card callbacks; NFC; printing
    - Custom app workflow on POS; ISV revenue from merchant services
    - PaaP SDK + POS Terminal + Moniepoint OS
