      UK remittance or Sumac Kenya. These products are confirmed to exist but their commercial performance
      is unknown.
    whyItMatters: International expansion is a stated strategic priority and could materially affect growth
      projections; without metrics, these initiatives cannot be sized or de-risked.
    diligencePath: Request operational metrics for MonieWorld and Sumac from Moniepoint management in
      investor data room; assess FCA registration status in UK and CBK licence status in Kenya.
    relatedQuestionRefs:
    - QE022
  - type: private-evidence-only
    severity: minor
    topic: PaaP developer ecosystem adoption
    missingEvidence: Moniepoint has not publicly disclosed the number of third-party apps deployed via
      PaaP, the number of ISV developers in the ecosystem, or the transaction volume attributable to PaaP-enabled
      applications.
    whyItMatters: PaaP ecosystem depth determines whether it creates genuine switching costs or remains
      an unused API; low adoption would undermine the platform lock-in thesis.
    diligencePath: Request PaaP developer registry data from Moniepoint; review publicly listed PaaP apps
      in any app marketplace; interview ISV partners if accessible.
    relatedQuestionRefs:
    - QE023
