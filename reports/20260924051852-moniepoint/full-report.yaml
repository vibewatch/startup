  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Detail
    rows:
      - - Recommendation
        - BUY
        - Confirmed unicorn at fair entry multiple; HIGH risk but compelling risk/reward at $1B
      - - Confidence
        - MEDIUM-HIGH
        - High on volume/scale; medium on revenue (no audited financials); low on Pan-Africa trajectory
      - - Risk Rating
        - HIGH
        - >-
          CBN enforcement (1B naira fine + litigation), FX/naira (-75% since 2022), NPL opaque, OPay/Flutterwave
          competition
      - - Valuation Stance
        - FAIR at $1B entry
        - ~5-7x estimated $150-200M ARR; in line with African fintech comps at comparable stages
      - - Entry Point
        - $1B (October 2024 Series C)
        - Post-money; led by DPI with Google, BII, Verod-Kepple, Lightrock; total raised $240M+
      - - Hold Period
        - 3-5 years
        - Pan-Africa expansion and credit deepening require 3-5 year window to contribute to valuation
      - - Target Exit (Base Case)
        - $1.8B at ~6x ARR
        - Nigeria dominance maintained; ARR grows to $300M; naira holds within 20%
      - - Target Exit (Bull Case)
        - $3.2B+ at 8-10x ARR
        - Pan-Africa (2+ markets live), ARR $400M+, credit margin expands
      - - Downside (Bear Case)
        - $650M at 3-4x ARR
        - CBN restriction, naira -30% further, litigation liability, OPay/Flutterwave gains
      - - STRONG BUY Triggers
        - Audited ARR $150M+; NPL <5%; Pan-Africa revenue >10%
        - None currently met; TV006 diligence items would resolve if satisfied
    notes: >-
      Entry price $1B is the October 2024 Series C post-money mark confirmed by DPI/Google/BII/Lightrock press releases.
      ARR estimates are third-party analyst estimates; Moniepoint has not disclosed audited financials.
    claimRefs: []
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Bull Thesis
      - Bear Anti-Thesis
      - Swing Factor
    rows:
      - - Market
        - Nigeria $32.2B SME finance gap; only ~40% of SMEs formally banked; structural multi-decade runway
        - >-
          Nigeria macro risk -- 30%+ inflation, naira depreciation -- compresses SME creditworthiness and USD returns
          simultaneously
        - Naira stabilisation and CBN inflation control trajectory
      - - Product / Moat
        - >-
          600,000+ POS terminals create switching-cost flywheel; transaction history enables credit underwriting
          competitors cannot replicate
        - >-
          OPay (>$2B valuation) and PalmPay operate in same POS/SME lane; Flutterwave dominates enterprise payments; MDR
          margin compression likely
        - Relative POS terminal share vs OPay/PalmPay in 2026 agent banking market
      - - Financials
        - >-
          412T naira transaction volume (2025), 1T+ naira credit disbursed, IFC validation of lending model; analyst ARR
          estimate $150-200M
        - >-
          No audited financials; profitability is company-asserted; 7B naira NPL book on 1T naira lending is disclosed
          but incompletely characterised
        - Disclosure of audited FY2025 revenue and NPL ratio with external audit stamp
      - - Regulatory
        - January 2026 national MFB licence upgrade confers CBN blessing and expanded credit mandate
        - >-
          1B naira KYC/AML fine (Q2 2024), active 21B naira fraud litigation, EMAAR class-action threat; CAC recommended
          watchlist (Dec 2025)
        - Outcome of 21B naira fraud case and EMAAR class-action certification decision
      - - Pan-Africa
        - >-
          Ethiopia, Ghana, Kenya expansion pipeline; IFC multilateral relationships ease market entry; CBN international
          playbook applicable
        - >-
          International revenue currently immaterial; multi-year execution risk; new regulatory environments impose
          compliance cost and capital drag
        - First international market generating $10M+ ARR (Ghana or Ethiopia) within 18 months
      - - Valuation / Exit
        - $1B entry at ~5-7x ARR is fair discount to OPay ($2B, 8-12x) and Flutterwave ($3B, 10-15x) comps
        - >-
          Public market comps (dLocal 1.1x ARR) suggest private premium may compress at IPO; naira discount further
          impairs USD exit proceeds
        - Strategic acquirer interest from Mastercard/Visa or global bank vs IPO route
    notes: >-
      Swing factors represent the single evidence item most likely to shift the thesis from bull to bear or vice versa.
      All valuation comps are latest publicly disclosed marks, which may be stale by 2-4 years for OPay and Flutterwave.
    claimRefs: []
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Probability
      - FY2027E ARR
      - Key Assumptions
      - ARR Multiple
      - Implied Valuation
      - Return vs $1B Entry
    rows:
      - - Bull Case
        - 20%
        - $400M
        - >-
          Pan-Africa (Ghana + Ethiopia live, contributing $80-100M ARR); credit margin expansion; naira stable; no
          material CBN restriction
        - 8-10x ARR
        - $3.2-4.0B
        - +220-300%
      - - Base Case
        - 60%
        - $300M
        - >-
          Nigeria dominance (10M+ active businesses); Pan-Africa early-stage but not material; naira depreciates <=20%
          further; CBN compliance costs manageable
        - 6x ARR
        - $1.8B
        - +80%
      - - Bear Case
        - 20%
        - $175-200M
        - >-
          CBN restricts lending or agent banking; naira -30%+ further vs USD; OPay/Flutterwave gain SME share; 21B naira
          litigation liability materialises
        - 3-4x ARR
        - $525-800M
        - '-20% to -47%'
    notes: >-
      Probability-weighted expected valuation: 20% x $3.6B + 60% x $1.8B + 20% x $0.66B = approximately $1.93B (+93%
      from $1B entry). ARR estimates are analyst-derived; Moniepoint has not disclosed audited revenue. Currency effects
      (naira devaluation) reduce USD returns by 15-25% in base/bear cases.
    claimRefs: []
