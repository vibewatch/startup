    missingEvidence: OPay's audited revenue, gross margin, and profitability are not publicly disclosed.
    whyItMatters: Without revenue data, it is impossible to assess whether OPay's $2.75B valuation is
      justified or whether its IPO ambitions are achievable.
    diligencePath: Request OPay financials through Opera's regulatory filings or wait for IPO prospectus.
    relatedQuestionRefs: []
  - type: enumeration-incomplete
    severity: minor
    topic: POS-market-share
    missingEvidence: Precise POS terminal count and agent count for each major competitor (OPay, PalmPay,
      Moniepoint) is not independently verified.
    whyItMatters: Market share by terminal count may differ from market share by transaction volume.
    diligencePath: Request CBN Payments System Report quarterly data or NiBS (Nigeria Interbank Settlement
      System) terminal count.
    relatedQuestionRefs: []
    relatedTableRefs: []
  - type: private-evidence-only
    severity: material
    topic: competitive-moat
    missingEvidence: Moniepoint's agent churn rate, terminal replacement rate, and net agent additions
      post-single-principal rule are not publicly disclosed.
    whyItMatters: These metrics determine whether the single-principal rule drives net gain or net loss
      for Moniepoint during the consolidation window.
    diligencePath: Request operational metrics from Moniepoint investor relations or infer from quarterly
      CBN agent banking reports.
    relatedQuestionRefs: []
  - type: missing-source
    severity: minor
    topic: geographic-coverage
    missingEvidence: Independent state-by-state geographic coverage data comparing Moniepoint, OPay and
      PalmPay terminal density across Nigeria's 36 states is not publicly available.
    whyItMatters: Coverage gaps in under-served states could indicate vulnerability to new entrants or
      limit growth opportunities.
    diligencePath: Review CBN quarterly payment system reports which include state-level POS deployment
      data.
    relatedQuestionRefs: []
