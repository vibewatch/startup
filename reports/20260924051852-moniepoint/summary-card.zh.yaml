summary:
  headline: Moniepoint 仍是尼日利亚规模化 SME 银行与支付基础设施平台：账户数超 20M、日均支付 26M 笔、月 TPV 达 $17B。公司仍是估值 $1B 的独角兽；但员工规模与经审计财务披露不足，尚难支撑高确信度投资判断。
