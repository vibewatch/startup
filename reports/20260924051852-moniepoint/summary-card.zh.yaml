  topStrengths:
    - 市场主导地位：Moniepoint 占尼日利亚线下 POS 支付的 80%+，年交易 14B 笔、TPV 达 ₦412T（$294B）；目前没有可信的单一竞争者能同时匹敌其 POS、银行和信贷全栈。
    - >-
      估值倍数严重压缩：$1B 投后估值对应 $600M ARR 仅约 1.67x——在非洲金融科技独角兽中 EV/Revenue 倍数最低（Flutterwave 为 $3B，OPay 为
      $2.75B）——一旦盈利能力得到核实，存在显著的结构性价值重估空间。
    - >-
      DFI 与战略投资方背书：IFC、Proparco、Swedfund（发展金融机构）、LeapFrog（ESG 治理支持）、Visa（卡组织网络）以及 Google Africa
      Fund（云与渠道分发）共同构成多维度的机构认可。
    - 收入扩张轨迹强劲：从 2021 年的 $62.6M 跃升 10x 至 2025 年的 $600M ARR（GetLatka 估算口径），且自述已实现盈利——这种规模与盈利兼备的表现，在非洲金融科技领域极为罕见。
    - 获批全国性 MFB 牌照（2026 年 1 月）：牌照开放存款吸收、提升贷款规模上限并降低资金成本，显著改善长期单位经济性。
  topRisks:
    - >-
      CBN 监管执法压力高悬：2024 年 Q2 招致 ₦1B 罚款（KYC/AML 违规）、在 ₦21B POS 欺诈案中被列为被告、EMAAR 庞氏骗局集体诉讼威胁，以及 NDPC 数据保护调查——截至 2026 年 5
      月均处于活跃状态，构成最具破坏力的核心风险组合。
    - 不良贷款（NPL）不透明：在 FY 2025 超过 ₦1T+ 贷款发放规模下，仅披露了 ₦7B 不良贷款（且高度集中于 Alerzo ₦4.38B 与 Shoprite ₦2.4B），未披露公开 NPL 比率或贷款账龄分布表。
    - 奈拉汇率大幅贬值：汇率由 ₦415/$ (2022) 贬至 ₦1,600/$ (2026)，美元价值缩水 74%；全部收入均以奈拉计价，极度压缩美元回报，若不进行汇率调整建模，$600M ARR 估值测算便不可靠。
    - 缺少经审计财务报表：盈利主张未经独立审计机构核实；收入与利润率数据仍属非公开，是新增投资必须补齐的关键尽调缺口。
    - Google Cloud 基础设施集中：80%+ 基础设施依赖单一 GCP 区域；未披露备用云服务商或灾难恢复方案。
  unresolvedGaps:
    - 经审计财务报表（FY 2023–2025）：收入、毛利率、EBITDA、现金余额。
    - NPL 比率、贷款账龄分布表与信用损失拨备方法。
    - 各轮次优先股堆叠、清算分配顺序、反稀释与棘轮条款。
    - 2024 年 Q2 遭遇 KYC 罚款以来的 CBN 监管沟通函件；EMAAR 与 ₦21B 诉讼最新裁决状态。
    - 英国银行牌照申请进展与 Moniepoint GB 监管合规现状。
