- id: adoption-trajectory-and-production-readthrough
  title: 'Adoption trajectory: real commercialization, but fulfillment is still uneven'
  body: 'The public adoption story is credible but layered. Pathfinder is the strongest proof because it is described as a continuously operating commercial-scale facility with shipped eFuels already used in the United States and Europe, and Borealis confirms at least one commercial eNaphtha shipment into its Porvoo plant. Amazon similarly proves real non-aviation usage because it disclosed a fleet application measured at roughly five million truck miles per year. The aviation relationships are commercially more important but physically less mature today: American and IAG have high-quality contract proof, yet both depend on Roadrunner reaching stable production. Roadrunner remains under construction, with public sources pointing to 23,000 tonnes per year of output and named airline offtake but not full delivery schedules. Atlas extends the demand stack further, but as a 2026 award targeting initial 2029 production it should be read as expansion evidence, not present utilization. The result
    is a chapter where customer proof is better than usual for climate infrastructure, but delivered-volume transparency still lags contract disclosure.'
