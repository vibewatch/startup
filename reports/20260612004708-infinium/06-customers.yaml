  evidenceGaps:
  - type: missing-source
    severity: material
    topic: amazon-follow-on-volume
    missingEvidence: Public gallons consumed, spend, and any follow-on Amazon fleet expansion beyond the initial 5 million-mile disclosure.
    whyItMatters: Without repeat-volume evidence, Amazon proves product-market fit but not durable non-aviation revenue.
    diligencePath: Request Amazon lane count, gallons delivered, and any post-launch renewal or expansion agreements.
    relatedQuestionRefs:
    - QU017
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: borealis-repeat-orders
    missingEvidence: Repeat-shipment cadence, annual tonnage, and contract term for Borealis eNaphtha procurement.
    whyItMatters: One commercial shipment proves a route to market, but not sticky chemical demand or meaningful revenue contribution.
    diligencePath: Request shipment history, annual contracted tonnes, and whether Borealis has standing purchase commitments.
    relatedQuestionRefs:
    - QU018
    relatedTableRefs:
    - TU004
    - TU003
  - type: private-evidence-only
    severity: material
    topic: utilization-and-account-level-metrics
    missingEvidence: Delivered tonnage by customer, Roadrunner sell-through, contract minimums, and customer-level repeat-consumption metrics.
    whyItMatters: The chapter can validate demand names and structures, but not plant utilization, customer concentration, or expansion efficiency with high precision.
    diligencePath: Request customer-by-customer volume schedules, delivered gallons or tonnes, and top-account concentration metrics.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
