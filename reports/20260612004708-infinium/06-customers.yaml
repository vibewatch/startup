tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Geography / production link
  - Scale / strategic value
  - Gap
  rows:
  - - Airlines - American
    - Buyer=user=payer airline; Citi also bought associated emissions reductions
    - Future physical eSAF uplift from Roadrunner plus Atlas physical offtake role
    - US production, American network use, Atlas logistics run by American
    - High strategic value because American is a financing-enabling anchor and now appears in two Infinium aviation pathways
    - Annual committed gallons/tonnes and renewal economics are not public
  - - Airlines - IAG
    - Buyer and end-market airline group across five carriers
    - 10-year eSAF offtake for UK / group airline demand
    - Roadrunner in West Texas supplying UK market from late 2026
    - High strategic value because tenor and five-airline coverage imply meaningful portfolio demand
    - Contract value, annual take schedule, and take-or-pay specifics are not public
  - - Corporate certificate buyers via SABA
    - Payer is corporate buyer; physical user is American Airlines
    - Book-and-claim SAF certificates for business travel and air freight emissions
    - Atlas targets EU-compliant RFNBO eSAF with physical delivery through American
    - High expansion value because it widens the payer base beyond airlines
    - Named corporate buyers and signed certificate volumes were not disclosed
  - - Logistics / trucking - Amazon
    - Buyer=user=payer inside Amazon logistics; also investor
    - Middle-mile truck decarbonization
    - Southern California fleet supplied from Infinium production
    - 'Medium strategic value: real operational use plus strategic investment support'
    - No public gallons, spend, or renewal horizon
  - - Chemicals / plastics - Borealis
    - Buyer is Borealis feedstock procurement; users are Borealis plants and downstream manufacturing customers
    - eNaphtha feedstock for polyolefins
    - Pathfinder shipment from Texas to Porvoo, Finland
    - Medium strategic value because it proves non-aviation monetization and international shipments
    - No public contracted tonnage, margin, or repeat cadence
  notes: Rows separate who pays from who physically uses or monetizes the product; Atlas is included because book-and-claim materially changes the payer map even before physical delivery starts.
