- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Driver / risk
  - What supports expansion
  - Concentration / friction
  - Impact
  - Diligence path
  rows:
  - - American land-and-expand
    - Roadrunner anchor offtake plus Atlas physical-user role
    - American volume remains undisclosed, so growing strategic value may also increase concentration
    - Could deepen one blue-chip account while masking exposure to one customer family
    - Request combined Roadrunner + Atlas committed volumes and decision rights
  - - IAG portfolio expansion
    - One contract can serve five airlines and UK SAF demand
    - Large implied share of Roadrunner output raises concentration risk if one group becomes core user
    - High near-term credibility but potentially high revenue concentration
    - Request carrier-by-carrier allocation and annual take curve
  - - Corporate certificate buyers
    - SABA converts business-travel and air-freight demand into financeable offtake
    - Book-and-claim requires registry integrity, clear claims ownership, and corporate willingness to keep paying premiums
    - Largest new payer pool if trust infrastructure holds
    - Request named buyers, registry stack, and contract tenor
  - - Amazon and logistics adjacency
    - Trucking use case plus strategic investment supports further freight decarbonization pathways
    - No public follow-on volumes; aviation and shipping references are mostly adjacency, not disclosed named contracts
    - Useful optionality outside aviation but still under-evidenced
    - Request expansion pipeline by fleet, lane, and mode
  - - Borealis and chemicals adjacency
    - Commercial shipment proves monetization beyond transport fuels
    - Chemical feedstock revenue could remain project-specific without repeat orders or wider customer set
    - Helps diversify end-market mix if repeatability emerges
    - Request repeat purchase history, margin profile, and additional chemical customers
  - - Policy / cost friction
    - EU RFNBO demand and SAF mandates can widen the buyer pool
    - IATA, ADI, Acumen, and ICCT all show that high cost, supply scarcity, and claim-governance complexity slow procurement
    - Can delay offtake closure or reduce willingness to expand
    - Stress-test customer economics under lower subsidies and higher green premiums
  notes: Expansion opportunities are real, but this market still closes deals through complex policy, accounting, and finance structures rather than through frictionless commodity procurement.
