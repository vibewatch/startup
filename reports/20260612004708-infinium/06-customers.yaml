- id: TU003
  title: Named customer proof table
  columns:
  - Customer / buyer
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome / proof quality
  - Limitation
  rows:
  - - American Airlines
    - Airline
    - Roadrunner eSAF offtake and Atlas physical-user role
    - Pre-production for Roadrunner; pre-production for Atlas
    - Highest-quality aviation proof because American discloses a long-term agreement, links it to project financing, and appears in a second follow-on deal
    - Public sources do not disclose annual volume, price, or delivered gallons
  - - IAG
    - Airline group
    - 10-year eSAF offtake for any of five airlines serving UK market
    - Pre-production
    - High-quality proof because tenor, airlines covered, and late-2026 start are explicit
