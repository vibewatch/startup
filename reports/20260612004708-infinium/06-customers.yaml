- id: FU002
  title: Adoption / deployment funnel
  type: flow
  layout: standard
  summary: The evidence base narrows as Infinium moves from named interest and signed contracts into delivered tonnage and repeat-usage visibility.
  data:
    nodes:
    - id: named
      label: Named public interest
      description: AP Ventures and customer-facing pages show airlines, Amazon, and Borealis as named adopters.
    - id: signed
      label: Signed agreement
      description: American, IAG, Amazon, and Borealis all have public contractual or shipment proof.
    - id: financing
      label: Financing-enabled deployment
      description: American, IAG, and SABA evidence is explicitly tied to bankable project development.
    - id: physical
      label: Physical use or shipment
      description: Amazon trucking and Borealis feedstock use are already physical; Roadrunner aviation is not yet.
    - id: repeat
      label: Repeat use / renewal
      description: This stage is mostly opaque because public retention, repeat-order, and churn metrics are absent.
