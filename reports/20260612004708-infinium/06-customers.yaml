- id: durability-reference-quality-and-gaps
  title: Durability, retention, and reference quality
  body: 'Durability is where the public record thins out. American and IAG look durable because their need is strategic, regulatory, and multi-year, and American now appears in two separate Infinium-related aviation pathways: Roadrunner as anchor offtaker and Atlas as physical user for SABA-backed certificate demand. IAG''s five-airline structure also creates embedded expansion optionality inside one contract. By contrast, Amazon and Borealis are real proofs of use but weaker proofs of persistence. Amazon discloses miles, geography, and strategic fit, not renewal terms or fuel spend. Borealis confirms commercial shipment and usage, not repeat order cadence or annual contract value. No public source found net revenue retention, gross retention, churn, renewal rates, or customer satisfaction cohorts. The practical ranking is therefore clear: American and IAG are the highest-quality references, Amazon and Borealis are medium-quality operational proofs, and Atlas is high-quality demand validation
    but still pre-production. Public proof is good enough to validate category fit, not good enough to underwrite cohort durability.'
