  - - Amazon
    - Logistics / trucking
    - Middle-mile truck fleet in Southern California
    - Production-linked operating use, not just logo placement
    - High-quality non-aviation proof because miles and operating geography are disclosed by the customer
    - No public repeat-order, gallons, or contract-term detail
  - - Borealis
    - Chemicals / plastics
    - eNaphtha feedstock into Porvoo polyolefins production
    - Production use with shipped commercial volume
    - High-quality feedstock proof because Borealis confirms the use case and first commercial shipment
    - Volume, pricing, and renewal cadence are private
  - - SABA corporate buyers / American
    - Corporate certificates plus airline physical use
    - Book-and-claim SAF certificates for business travel and air freight emissions
    - Pre-production and pre-delivery
    - Useful expansion proof because demand aggregation is tied to financeable offtake and American logistics
    - Named corporate buyers and final signed volumes were not disclosed
  notes: 'Named proof quality varies sharply: American and IAG provide bankable aviation demand, Amazon and Borealis prove physical non-aviation use, and Atlas proves payer expansion before molecules flow.'
