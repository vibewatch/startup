evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-disclosure
    missingEvidence: >-
      A current board roster, board observer list, and fuller executive-bench disclosure from the company or a
      filing-grade source.
    whyItMatters: >-
      Governance quality and key-person dependence cannot be underwritten well from a CEO-centric public narrative
      alone.
    diligencePath: Request the latest board deck, cap-table governance schedule and executive org chart in management diligence.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: valuation-and-total-raised
    missingEvidence: >-
      A precise Series C close amount, post-money valuation, and reconciliation between corporate equity, project
      equity, contingent Brookfield commitments and HSBC debt.
    whyItMatters: >-
      Later valuation and dilution work depends on knowing what capital is actually closed versus merely committed or
      contingent.
    diligencePath: Obtain the Series C closing memo, cap table, financing waterfall and Brookfield side-letter milestone schedule.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: current-scale-metrics
    missingEvidence: Authoritative current figures for headcount, revenue or run-rate, and active customer count as of the run date.
    whyItMatters: >-
      Without hard scale metrics, later market, financial and valuation chapters must avoid unsupported penetration or
      productivity assumptions.
    diligencePath: Request the latest management dashboard, payroll headcount summary and customer revenue bridge.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: roadrunner-commercial-operations-date
    missingEvidence: >-
      A current project schedule that explains the shift from the 2026 production expectation in the 45V comment letter
      to the 2027 COD in later sources.
    whyItMatters: >-
      Timing drives revenue start, tax-credit exposure, working-capital timing and valuation assumptions across the rest
      of the report.
    diligencePath: >-
      Request the latest construction schedule, EPC progress report and lender-approved milestone calendar for
      Roadrunner.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: policy-vs-physical-supply
    missingEvidence: >-
      A region-by-region independent map of eSAF project FIDs, expected start dates, and committed production volumes
      against 2030 policy quotas.
    whyItMatters: Without it, policy floors can be mistaken for physically financeable 2030 supply and overstate near-term SAM.
    diligencePath: >-
      Build a bottom-up project tracker from public FIDs, permitting records, and lender disclosures, then compare it
      with EU and other mandate trajectories.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: infinium-som-gap
    missingEvidence: Infinium-specific contracted offtake volumes, delivered gallons, and realized pricing by buyer segment.
    whyItMatters: >-
      These data are necessary to move from broad market attractiveness to a defensible obtainable-market view and
      valuation bridge.
    diligencePath: >-
      Request executed offtake summaries, delivery history, and netback assumptions under NDA and reconcile them with
      independent customer announcements.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: corporate-demand-depth
    missingEvidence: >-
      Independent volume, price, and renewal data for corporate SAF book-and-claim purchases outside airline marketing
      examples.
    whyItMatters: >-
      Corporate demand can support premium pricing, but public evidence is still too sparse to treat it as a bankable
      large-scale payer base.
    diligencePath: >-
      Interview registry operators, major travel buyers, and airline program managers; request third-party-verified
      certificate volume and price ranges.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: co2-feedstock-availability
    missingEvidence: >-
      Independent regional data on cost and availability of qualifying waste or biogenic CO2 streams near candidate
      e-fuel projects.
    whyItMatters: >-
      Renewable power is not the only gating input; carbon sourcing can determine whether a nominally attractive market
      is actually buildable.
    diligencePath: >-
      Map nearby industrial, biogenic, and DAC-linked CO2 sources by volume, purity, permitting status, and delivered
      cost for each prospective site.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Realized or contracted per-gallon pricing, green premium structure, and margin support for Infinium, LanzaJet,
      Twelve, and HIF volumes.
    whyItMatters: >-
      Public pricing opacity makes it hard to judge whether Infinium can defend share on cost rather than only on
      narrative and policy support.
    diligencePath: >-
      Request customer contracts, pricing formulas, tax-credit assumptions, and plant-level margin models from
      management or financing materials.
    relatedQuestionRefs:
      - QP021
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: offtake-volumes
    missingEvidence: Minimum-volume commitments, tenor details, and delivery schedules for American, IAG, and other named customers.
    whyItMatters: >-
      Named customers validate demand, but undisclosed volume and take-or-pay terms leave lock-in and revenue visibility
      uncertain.
    diligencePath: >-
      Obtain executed offtake summaries or lender diligence materials that specify annual volumes, penalties, and
      make-up rights.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: prometheus-independent-validation
    missingEvidence: >-
      Independent engineering, airline, or regulatory evidence that Prometheus has reached repeatable commercial
      aviation-fuel production beyond company-led announcements.
    whyItMatters: >-
      Without third-party proof, Prometheus is hard to rank reliably as either a true near-term rival or a
      still-speculative technology narrative.
    diligencePath: >-
      Look for customer announcements, ASTM progress, lender materials, or third-party engineering reports outside
      company press distribution.
    relatedQuestionRefs:
      - QP013
  - type: stale
    severity: minor
    topic: roadrunner-ramp-certainty
    missingEvidence: >-
      Updated 2026-2027 construction, commissioning, and utilization milestones for Roadrunner after FID and
      ground-breaking.
    whyItMatters: >-
      Infinium's moat case depends on Roadrunner turning from a financed project into a stable operating asset on
      schedule.
    diligencePath: >-
      Refresh EPC, permitting, and project-finance sources once Roadrunner reports commissioning milestones or updated
      delivery timing.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: blocking
