  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Realized or contracted per-gallon pricing, green premium structure, and margin support for Infinium, LanzaJet, Twelve, and HIF volumes.
    whyItMatters: Public pricing opacity makes it hard to judge whether Infinium can defend share on cost rather than only on narrative and policy support.
    diligencePath: Request customer contracts, pricing formulas, tax-credit assumptions, and plant-level margin models from management or financing materials.
    relatedQuestionRefs:
    - QP021
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: offtake-volumes
    missingEvidence: Minimum-volume commitments, tenor details, and delivery schedules for American, IAG, and other named customers.
    whyItMatters: Named customers validate demand, but undisclosed volume and take-or-pay terms leave lock-in and revenue visibility uncertain.
    diligencePath: Obtain executed offtake summaries or lender diligence materials that specify annual volumes, penalties, and make-up rights.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: prometheus-independent-validation
    missingEvidence: Independent engineering, airline, or regulatory evidence that Prometheus has reached repeatable commercial aviation-fuel production beyond company-led announcements.
    whyItMatters: Without third-party proof, Prometheus is hard to rank reliably as either a true near-term rival or a still-speculative technology narrative.
    diligencePath: Look for customer announcements, ASTM progress, lender materials, or third-party engineering reports outside company press distribution.
    relatedQuestionRefs:
    - QP013
  - type: stale
    severity: minor
    topic: roadrunner-ramp-certainty
    missingEvidence: Updated 2026-2027 construction, commissioning, and utilization milestones for Roadrunner after FID and ground-breaking.
    whyItMatters: Infinium's moat case depends on Roadrunner turning from a financed project into a stable operating asset on schedule.
    diligencePath: Refresh EPC, permitting, and project-finance sources once Roadrunner reports commissioning milestones or updated delivery timing.
    relatedQuestionRefs:
    - QP025
