- id: moat-durability-and-adverse-evidence
  title: Moat durability, multi-homing, and adverse competitive evidence
  body: 'Infinium''s moat looks more commercial than scientific. The durable pieces are early shipment proof, multi-product outputs, named airline demand, and project-finance credibility for a second plant. Those are valuable, but none is unassailable: HEFA suppliers still own near-term trust and physical supply, HIF already carries RFNBO certification that matters for export credibility, LanzaJet has a live non-HEFA operating template, and Twelve shows another well-financed PtL route with its own airline ecosystem. Multi-homing risk is therefore real. Airlines and corporate buyers can buy environmental attributes and physical molecules from different suppliers, and they can satisfy near-term mandates with incumbent HEFA while waiting to see whether PtL routes hit promised cost curves. Fulcrum is the most important adverse datapoint for the whole category because it demonstrates how FOAK pathway integration, EPC choices, and reliability failures can destroy financing before scale economics
    arrive. The practical read-through is that Infinium wins only if Roadrunner converts contract and financing momentum into stable 2027 operations faster than better-distributed or more-certified substitutes can entrench themselves.'
