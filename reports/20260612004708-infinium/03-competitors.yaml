- id: FP003
  title: Moat / readiness KPIs
  type: kpi
  layout: standard
  summary: Compact public proxies for whether Infinium's advantage is hardening into a moat or still vulnerable to substitution.
  approximationNotes: These are analytical summary items built from retained evidence, not audited financial KPIs. They are designed to make competitive readiness legible to diligence readers.
  claimRefs:
  - CP006
  - CP020
  - CP032
  - CP034
  - CP035
  - CP037
  - CP041
  data:
    items:
    - label: Commercial proof
      value: Pathfinder shipped in 2023
      note: Infinium has a real operating reference point that several synthetic-fuel peers still lack
    - label: Flagship growth scale
      value: 7.6M gpy Roadrunner target
      note: Large enough to matter, but still far below incumbent aviation fuel demand and not yet operating
    - label: Aviation demand anchors
      value: American + IAG named
      note: Buyer proof exists before Roadrunner startup, helping financeability and trust
    - label: Cross-sector GTM signal
