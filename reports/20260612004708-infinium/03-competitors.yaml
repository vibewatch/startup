- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat / adverse evidence
  - Severity
  - What the evidence says now
  - Mitigation / diligence ask
  rows:
  - - Early commercial proof from Pathfinder
    - Pathfinder volumes are meaningful, but scale leadership still belongs to incumbent HEFA and Infinium's growth story depends on Roadrunner
    - High
    - Pathfinder is real proof, yet Roadrunner is still pre-operations while incumbents already deliver physical fuel
    - Verify Pathfinder run-rate, delivery continuity, and Roadrunner commissioning milestones through 2027
  - - Named airline offtakes create buyer lock-in
    - Airlines can still multi-home and satisfy mandates with incumbent HEFA if Infinium slips on price or schedule
    - High
    - American and IAG are credible anchors, but long-term contracts do not erase substitute supply options
    - Request contract tenor, minimum-volume, and make-up provisions before treating offtake as hard lock-in
  - - Project finance and strategic capital reduce funding risk
    - Fulcrum shows FOAK projects can still fail after attracting serious capital and strategic partners
    - High
    - Brookfield, Breakthrough, and HSBC-style financing help, but category history punishes execution misses
    - Track debt conditions, contingency budgets, and EPC/ramp plan discipline
  - - Multi-product slate broadens revenue sources
    - Co-products help, but they do not matter if the main plant misses uptime or cost targets
    - Medium
    - eNaphtha and eDiesel broaden addressable markets beyond aviation
    - Quantify co-product margins and whether they hedge low early eSAF utilization
  - - Non-biogenic route offers long-term feedstock upside
    - LanzaJet, Twelve, HIF, Prometheus, and Velocys show multiple non-HEFA routes can converge on the same buyer need
    - Medium
    - Infinium is not alone in escaping waste-oil constraints, so route differentiation may compress over time
    - Compare delivered cost trajectories and certification timing across non-HEFA routes annually
  - - Trust can compound once certified exports and deliveries are visible
    - HIF already has RFNBO certification; SkyNRG owns a broad compliance/distribution surface; World Energy owns operating trust today
    - High
    - Roadrunner contracts help, but Infinium is still pre-operations on its flagship scale asset
    - Monitor regulatory approvals, export readiness, and third-party sustainability certification for Infinium volumes
  - - Price gap should narrow as synthetic fuel scales
    - IEA and IATA still describe a category that depends on policy support and tiny supply versus fossil fuel
    - High
    - Fossil jet fuel remains the price anchor and SAF supply is scarce
    - Underwrite downside cases where subsidies, mandates, or tax-credit support weaken
  - - Category can absorb multiple winners
    - Fulcrum's collapse shows some routes will fail before they become repeatable businesses
    - High
    - Advanced-fuels history still rewards reliability and cost discipline more than novelty
    - Use adverse case studies, not only champion narratives, when sizing moat durability
  notes: Severity is qualitative and reflects competitive durability from a buyer and investor perspective, not safety or environmental hazard. Fulcrum is included because the category's most important adverse evidence comes from failed commercialization, not just rival marketing.
