- id: gtm-trust-and-switching-costs
  title: GTM, trust posture, supply access, and switching costs
  body: 'Distribution power in this market comes from who can secure feedstock, financing, and compliance-ready delivery, not just who has the best chemistry slide. Infinium''s GTM proof is partner-led: American and IAG anchor aviation offtake, Brookfield and Breakthrough anchor finance, Mitsubishi/JOGMEC extend the Japan supply-chain option, and the company also cites customers outside aviation such as Amazon and Borealis. LanzaJet similarly de-risks GTM through tolling and guaranteed offtake, while HIF leverages Porsche and Shell to turn product into visible use cases and exports. SkyNRG is strongest on distribution breadth because it already supplies more than 60 airlines and over 100 corporates through sourcing and book-and-claim programs, then layers owned production on top. World Energy benefits from being drop-in and already moving fuel through existing logistics. These partner webs create moderate switching costs once a buyer has contracted SAF volumes, booked emissions claims, aligned
    compliance provenance, and integrated delivery logistics. Before that point, however, buyers can multi-home across pathways or revert to incumbent HEFA volumes if e-fuels slip on price or timing.'
