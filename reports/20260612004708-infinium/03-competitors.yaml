tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Technology route
  - Scale / funding signal
  - Customer focus
  - GTM / distribution
  - Commercialization / trust posture
  - Limitation
  rows:
  - - Infinium
    - PtL e-fuels from waste CO2 + renewable power / green hydrogen
    - Pathfinder shipped commercial volumes; Roadrunner targets 23,000 tpy / 7.6M gpy eSAF; Brookfield >$200M plus up to $850M follow-on and Breakthrough $75M
    - Airlines, chemicals, hard-to-electrify transport; named aviation customers include American and IAG
    - Partner-led offtake plus project-finance stack; also cites Amazon and Borealis in broader customer set
    - Commercial product shipped and second project financed, but flagship growth plant is still pre-operations
    - Execution and ramp risk remain high until Roadrunner operates reliably at scale
  - - LanzaJet
    - Alcohol-to-jet (ethanol to SAF / renewable diesel)
    - Freedom Pines up to 10M gpy; fully operated in 2025; 2026 first-close equity round at $650M pre-money
    - Airlines, fuel buyers, ethanol/feedstock ecosystem
    - Multi-year tolling structure with guaranteed offtake; investors include IAG and Shell
    - First and only ethanol-to-SAF plant per company, with ASTM on-spec fuel production
    - Still route-dependent on low-carbon ethanol and commercial replication beyond first plant
  - - Twelve
    - Power-to-liquid electrochemical CO2 conversion to E-Jet and E-Naphtha
    - Raised $645M in 2024; AirPlant One opened June 2026 at ~50k gpy initial E-Jet capacity
    - Airlines, corporate SAF buyers, chemicals customers
    - Long-term offtakes with Alaska, Microsoft, IAG; strategic investment from United
    - Strong financing and visible first plant, with ASTM-compatible product claims
    - Current physical scale is far below incumbent HEFA supply and early economics remain undisclosed
  - - HIF Global / Haru Oni
    - Wind-powered hydrogen + captured CO2 to e-methanol / e-gasoline
    - Operating pilot-scale facility at 130,000 liters/year; global project pipeline
    - Motorsport, automotive, shipping and future export markets
    - Porsche offtake and Shell blending / logistics support
    - First operating e-fuels plant with RFNBO and ISCC credentials
    - Current scale is tiny for aviation and current commercial proof is centered on e-gasoline, not airline SAF
  - - World Energy
    - HEFA from waste fats, oils, and greases
    - Operating Paramount plant; incumbent commercial SAF supplier with Houston expansion ambition
    - Airlines and corporate decarbonization buyers needing immediate drop-in supply
    - Existing fuel logistics, truck delivery today and pipeline improvement plans
    - Current operating trust and no-aircraft-modification story are strong
    - Feedstock-constrained HEFA route is less scalable long term than synthetic fuels
  - - SkyNRG
    - HEFA supply / book-and-claim today; eSAF and new plants in pipeline
    - Supplies 60+ airlines and 100+ corporates; DSL-01 100k tpa financed in 2026, startup mid-2028
    - Airlines, airports, corporates, compliance-driven buyers
    - Distribution-first model plus KLM/APG-backed production ownership
    - Very strong trust and compliance posture through certified supply programs
    - Own large-scale production is still future-state and current economics remain credit-sensitive
  - - Velocys
    - Fischer-Tropsch technology licensing for waste-, biomass-, biogas-, and e-fuels projects
    - No comparable live SAF volume disclosed; Altalto and Bayou still planning; proven component projects in US/Japan
    - Project developers, airlines via partners, technology licensees
    - Licensor / partner model rather than direct branded fuel distribution
    - Technical credibility on FT components and ASTM/JAL demonstration history
    - Project progress is slower and less bankable than leaders with operating plants or financed sites
  - - Prometheus Fuels
    - DAC + electrochemical electrofuels / e-kerosene without hydrogen (company claim)
    - Pilot validation and commercial-readiness claims; no large operating airline-fuel asset shown in fetched evidence
    - Defense, remote energy, aviation, data-center / distributed-fuel narratives
    - Technology-led commercialization rather than visible distribution footprint
    - Novel route and bold cost-down claims create optionality
    - Independent validation and current customer-volume proof remain thin
  - - Fulcrum BioEnergy (legacy comparator)
    - MSW-to-fuels / synthetic crude to SAF concept
    - Filed Chapter 11 in 2024; Sierra aimed for nearly 11M gpy SAF before failure
    - Aviation and waste-management ecosystem
    - Project-financed single-asset development with complex feedstock processing
    - Useful adverse benchmark for FOAK scale-up risk rather than a live go-forward rival
    - Demonstrates pathway, EPC, reliability, and balance-sheet fragility in advanced-fuels scale-up
  - - Fossil jet fuel / incumbent kerosene
    - Petroleum refining
    - Dominant global supply and price anchor
    - Every airline and jet-fuel buyer
    - Entrenched distribution and airport fueling systems
    - Highest immediate reliability and availability
    - No decarbonization benefit and increasing policy / customer pressure
  notes: Rows combine current operating proof, publicly disclosed financing, and partner surfaces. Public pricing is generally unavailable, so the table emphasizes scale, buyer focus, and commercialization posture instead of implied unit economics.
