- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Producer
  - Public price / unit
  - Contract model
  - Included capabilities
  - Discount / credit context or unknowns
  - Implication
  rows:
  - - Infinium
    - No public list SAF price in retained sources
    - Long-term offtake with airlines; project-finance-backed volumes
    - eSAF plus eDiesel / eNaphtha; drop-in use; export capability
    - Economics likely depend on policy and project-finance assumptions; exact green premium undisclosed
    - Commercial packaging is credible, but underwriting still needs realized delivered price and margin data
  - - LanzaJet
    - No public list price
    - Tolling structure with guaranteed offtake for all Freedom Pines output
    - ATJ SAF plus renewable diesel, feedstock sourcing, operating template
    - Waste-ethanol sourcing and tolling lower volume risk; customer pricing still opaque
    - Most bankable non-HEFA package in chapter outside incumbent HEFA supply
  - - Twelve
    - No public list price
    - Long-term airline and corporate offtakes; strategic airline investment
    - E-Jet plus E-Naphtha and climate-book-and-claim style agreements
    - Scale-up supported by project equity, but plant-level economics and ramp assumptions remain private
    - Good demand packaging, but tiny initial physical volume keeps cost risk high
  - - HIF Global
    - No public list price
    - Partnered supply agreement with Porsche and Shell
    - e-Gasoline plus e-methanol / e-LG from one site
    - Certification and showcase-use advantages are strong; aviation-specific volume economics are still unclear
    - High trust for export-ready synthetic fuels, but current packaging is more demonstration-led than broad airline distribution
  - - World Energy
    - No public list price on retained official page
    - Physical fuel sales into existing logistics
    - Drop-in HEFA SAF from existing infrastructure
    - Current distribution advantage likely offsets some novelty risk; feedstock cost pressure remains
    - Incumbent substitute for buyers prioritizing certainty over pathway novelty
  - - SkyNRG
    - No public list price; APG cites HEFA SAF at 4-5x kerosene and eSAF up to 10x
    - Book-and-claim, sourcing, and long-term plant offtakes
    - SAF sourcing, compliance services, future owned production
    - Explicitly credit- and mandate-sensitive economics remain part of the model
    - SkyNRG can win customers even before it owns all production because it packages trust and compliance
  - - Velocys / Prometheus
    - No public list price
    - Technology licensing or early commercialization claims
    - FT backbone or electrochemical route optionality
    - Economic claims remain forward-looking and less verified than volume-backed sellers
    - These firms are strategic technology threats more than current price-setters
  notes: Public list pricing is mostly unavailable across synthetic-fuel competitors. The table therefore compares how each player packages contracts, co-products, and compliance value rather than pretending to know realized per-gallon economics.
