company:
  name: Infinium
chapter:
  number: 3
  title: Competitors
  summary: Infinium sits between today's scaled HEFA incumbents and a still-thin field of synthetic-fuel challengers. Its advantage is earlier commercial proof, named offtakes, and project financing for Roadrunner, but incumbents like World Energy win on operating trust today while LanzaJet, Twelve, HIF Global, SkyNRG, and even Prometheus or Velocys show multiple alternative routes that can erode any chemistry-led moat if Infinium slips on scale, cost, or certification.
sections:
- id: landscape-and-substitutes
  title: 'Landscape: direct peers, substitutes, and likely entrants'
  body: 'Infinium competes across three layers rather than against one clean peer set. The closest direct peers are synthetic-fuel or other non-HEFA developers that promise drop-in fuels from non-food inputs: LanzaJet via alcohol-to-jet, Twelve via power-to-liquid electrochemistry, HIF via e-methanol/e-gasoline, Velocys via Fischer-Tropsch licensing, and Prometheus via direct-air-capture electrofuels. The strongest current substitutes are not these future-looking peers but incumbent SAF suppliers such as World Energy and the sourcing-and-booking ecosystems around SkyNRG, because they already satisfy buyer decarbonization mandates with operating infrastructure and known logistics. The harshest status-quo substitute remains fossil jet fuel itself, since IEA still describes SAF as less than 0.1% of aviation-fuel consumption and IATA stresses that policy support is still needed to bridge the price gap. Fulcrum BioEnergy matters less as a live rival than as adverse evidence: its collapse shows
    that impressive pathway narratives do not guarantee reliable commercial operation. Likely entrants include larger integrated fuel, project-finance, and airline ecosystems that can replicate pieces of the same stack once offtake demand is clear.'
