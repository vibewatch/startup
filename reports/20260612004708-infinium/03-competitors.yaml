      note: Infinium has contracts and drop-in claims, but rivals can be ahead on regulatory signaling
    - label: Substitute pressure
      value: HEFA trust today; PtL rivals tomorrow
      note: World Energy and SkyNRG cover near-term buyer needs while LanzaJet, Twelve, and HIF pressure the future stack
    - label: Moat durability verdict
      value: Moderate, execution-dependent
      note: The moat strengthens only if Roadrunner reaches stable operations before buyers standardize on better-distributed substitutes
