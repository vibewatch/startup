- id: scale-route-and-commercial-progress
  title: Scale, route, and commercialization progress
  body: Infinium's public position is stronger than the earliest-stage electrofuel aspirants but weaker than commercial incumbents. Pathfinder gives Infinium a real commercialization marker because it shipped commercial eFuel volumes before most power-to-liquid competitors had opened a first operating plant, and Roadrunner adds a finance-ready second site with named airline offtake. LanzaJet is the closest execution benchmark on non-HEFA SAF because Freedom Pines has full-plant operations, a defined 10-million-gallon scale template, and a 2026 equity round led by strategic buyers and energy partners. Twelve has a smaller initial volume than Roadrunner but a major financing stack and, as of June 2026, an opened U.S. commercial E-Jet plant plus airline-backed demand signals. HIF Global is commercially smaller than Infinium on annual liters today, but it is stronger on certification and export credibility through Haru Oni. SkyNRG and World Energy are less novel technologically, yet they matter
    because buyers often prefer operating HEFA supply and certified distribution channels over a newer route. Velocys and Prometheus widen the field of possible synthetic-fuel pathways, but both still need more bankable operating proof than Infinium now shows.
