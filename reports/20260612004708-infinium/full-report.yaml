  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Public evidence supports a wide private-market support range because execution and disclosure matter more than
      sector narrative alone.
    data:
      items:
        - label: Bear support
          low: 600
          mid: 750
          high: 900
          displayValue: $0.6B-$0.9B
          detail: Roadrunner slips or economics disappoint, pushing Infinium back toward harsh commercial-stage peer marks.
          tone: negative
        - label: Base support
          low: 1000
          mid: 1300
          high: 1600
          displayValue: $1.0B-$1.6B
          detail: >-
            Roadrunner delivers broadly on plan and Atlas stays financeable, but pricing and debt terms remain partly
            private.
          tone: warning
        - label: Bull support
          low: 2000
          mid: 2400
          high: 3000
          displayValue: $2.0B-$3.0B
          detail: >-
            Roadrunner ramps, Atlas advances, and Brookfield follow-on capital starts converting into repeatable project
            proof.
          tone: positive
    approximationNotes: >-
      Ranges are heuristic platform-value bands triangulated from disclosed private comps, sponsor structure, and
      milestone evidence rather than from disclosed Infinium financial statements.
