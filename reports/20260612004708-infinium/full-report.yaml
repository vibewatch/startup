      - number: '4.2'
        title: Cost structure, operating drivers, and scale-up economics
        blocks:
          - type: paragraph
            body: >-
              Roadrunner’s unit economics are dominated by industrial inputs and project structure, not by app-like
              incremental margins. The disclosed plant design requires captured CO2, a 150 MW renewable-power supply, a
              100 MW electrolyzer, synthesis hardware, and a commissioning path that converts a brownfield
              gas-to-liquids site into a first-of-a-kind integrated eFuels asset. That should reduce some siting and
              permitting friction versus a greenfield build, but it does not eliminate execution risk at the hydrogen,
              power, and synthesis layers. The best public evidence on cost comes from sector studies rather than from
              Infinium itself: ICCT still sees U.S. e-kerosene far above fossil-jet economics even under favorable
              assumptions, and its 2025-2026 work argues that advanced SAF plants remain capital intensive and policy
              dependent.


              That context matters for Infinium because the company has disclosed customer names and physical inputs,
              but not realized price, gross margin, or utilization thresholds. The plant can look commercially credible
              and still be financially fragile if power costs rise, tax-credit capture disappoints, or debt service
              absorbs the spread between contract price and production cost. The public record therefore supports a
              margin-path hypothesis—inputs plus policy plus debt determine outcomes—but not a closed-form profit model.
