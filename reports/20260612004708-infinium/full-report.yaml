        title: Downside triggers, exit readiness, and diligence that would move the call
        blocks:
          - type: paragraph
            body: >-
              Downside does not require demand collapse. Fulcrum's bankruptcy shows that alternative-fuel narratives can
              fail after capital has already been raised, and both ICCT and IATA still describe a world where e-fuel
              economics remain policy-dependent and SAF is scarce and expensive. For Infinium, the fastest thesis-break
              would be Roadrunner slipping past its 2027 operating target or Atlas failing to convert selection into
              binding offtakes, because both events would weaken confidence in milestone-based capital support. Exit
              readiness is clearly improving: project debt, blue-chip customers, and visible next-project demand are all
              better than what most private climate-tech companies can show. But crossover-grade readiness still
              requires data that public evidence does not provide, especially valuation, cap table, debt terms, contract
              pricing, and plant-level return math. That is also what would change the call. If a priced round appears
              near or below the public heuristic range and the economics prove investable, Infinium could graduate from
              track to buy quickly.
