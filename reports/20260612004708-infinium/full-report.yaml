  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation turns on financing proof that is real, price disclosure that is absent, and downside that
      remains sector-shaped rather than theoretical.
    data:
      nodes:
        - id: customers
          label: Customer proof
          detail: American and IAG offtakes help Roadrunner clear the demand-credibility threshold.
          tone: positive
        - id: capital
          label: Capital proof
          detail: Brookfield, Breakthrough, and HSBC show multi-layer capital can support the project.
          tone: positive
        - id: platform
          label: Platform optionality
          detail: Atlas suggests Infinium can compete for larger follow-on demand.
          tone: positive
        - id: opacity
          label: Price opacity
          detail: Current valuation, round size, debt sizing, and contract economics are still private.
          tone: warning
        - id: sector
          label: Sector downside
          detail: Fulcrum-style failure precedent and policy-dependent economics still matter.
          tone: negative
        - id: decision
          label: Track
          detail: Stay engaged, but do not underwrite undisclosed pricing from public evidence alone.
          tone: neutral
