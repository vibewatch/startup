          - type: callout
            title: Policy support creates the market and can also distort it
            body: >-
              The same mandates and credits that pull adoption forward can also raise compliance fees, concentrate
              volumes in Europe, and create a gap between legal targets and physically financeable supply.
            calloutType: risk
