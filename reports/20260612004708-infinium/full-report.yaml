        - Latest post-money valuation, price per share, any secondary prints, and round size.
        - Without a real price, public evidence cannot say whether a strong company is also a good deal.
        - Management financing room, lead investor materials, or brokered secondary data.
      - - Contract economics
        - Roadrunner pricing, take-or-pay protections, minimum volumes, and customer concentration by year.
        - Offtake quality is the bridge between demand proof and equity value.
        - Commercial team term sheets and plant model.
      - - Debt and contingent capital
        - HSBC debt size, amortization, covenants, and Brookfield metric gates for the extra $850M.
        - Milestone-based capital can absorb upside or disappear if terms are weak.
        - Treasury and counsel diligence plus financing documents.
      - - Cap table and preferences
        - Preferred stack, liquidation rights, ratchets, MFN provisions, and governance rights.
        - A hidden preference stack can make headline valuation economically meaningless for new money.
        - Cap-table package from counsel and CFO.
      - - Plant-level return math
        - Expected gross margin, credit assumptions, utilization curve, and working-capital needs.
        - This determines whether project finance creates equity value or just project completion.
        - Board model, tax-credit memo, and lender case model.
      - - Exit readiness
        - Audit readiness, disclosure controls, board rights, and crossover-investor governance package.
        - A later-stage valuation requires later-stage disclosure quality.
        - General counsel, CFO, and audit workplan.
    notes: Each ask is directly connected to a recommendation change or a price reset; none is generic diligence theater.
    claimRefs:
      - CV043
      - CV047
      - CV048
      - CV049
      - CV050
