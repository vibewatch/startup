      - number: '2.3'
        title: Buyers, payers, and commercial path
        blocks:
          - type: paragraph
            body: >-
              Airlines are the primary operational users of eSAF, but they are not the only economic actor that matters
              in Infinium's adoption path. IATA's net-zero roadmap assigns roughly 65% of aviation decarbonization to
              SAF, which makes airline fuel procurement the central demand anchor. Yet the payer stack is layered: fuel
              suppliers and airport consortia intermediate physical delivery; corporate travel buyers can fund scope-3
              reductions through airline SAF programs and verified certificates without physically using the fuel; and
              project developers or import mechanisms can effectively pre-fund supply by underwriting renewable-power,
              hydrogen, carbon, and infrastructure commitments before the final molecule is lifted. Airports are
              enablers rather than the natural owner of the premium, because open access to fuel infrastructure matters
              more than airport-specific pricing. For Infinium, this means commercialization is less a single
              airline-sale motion than a chain: secure compliant inputs, qualify the molecule, match it to a
              registry-compatible demand channel, and then translate that channel into bankable offtake or project
              finance. Shipping and logistics buyers widen the optionality set, but the cleanest buyer/user/payer
              alignment remains in aviation plus corporate book-and-claim overlays.
