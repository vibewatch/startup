              Infinium's public customer evidence spans four distinct demand surfaces rather than one monolithic buyer
              base. American Airlines and IAG are physical aviation buyers that use long-dated offtake agreements to
              secure future eSAF supply and de-risk new plant financing. Amazon is a self-funded logistics user that
              both invested in Infinium and agreed to run electrofuels in its Southern California middle-mile fleet,
              making it both a strategic backer and an operating customer. Borealis sits in a different lane entirely:
              it is buying eNaphtha as a chemical feedstock for plastics production, with commercial shipments to
              Finland already disclosed. Atlas adds a fifth layer in economic terms even if not yet in physical delivery
              terms: corporate buyers fund SAF certificates for business-travel and air-freight emissions while American
              takes the physical uplift. That means the buyer, user, and payer can be the same party in trucking, split
