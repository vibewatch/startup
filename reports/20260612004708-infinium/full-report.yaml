      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers are regulatory and accounting-based rather than purely commodity-based.
              ICAO's LTAG, CORSIA accounting, ReFuelEU, the U.S. SAF Grand Challenge, EU hydrogen auctions, and the
              Hydrogen Mechanism all create reasons for buyers to pay a premium before electrofuels reach parity with
              fossil fuels. At the same time, the constraints are concrete and severe. IATA's handbook says SAF can cost
              2-5x conventional aviation fuel, and IATA warned in mid-2025 that European mandate compliance had already
              pushed SAF to roughly five times the cost of conventional jet fuel. ICCT's e-kerosene work is even
              harsher: U.S. and EU synthetic-jet costs fall substantially over time, but not to fossil parity before
              2050 even under supportive assumptions. Upstream qualification rules tighten the bottleneck further. The
              EU's RFNBO methodology requires additional renewable electricity, monthly temporal matching until
              end-2029, hourly matching from 2030, and geographic correlation with the electrolyser or eligible bidding
              zones. Meanwhile, IEA still sees more than 200 committed hydrogen projects facing cost, infrastructure,
              and regulatory uncertainty, and shipping policies may bid away scarce green molecules as the IMO framework
              tightens. For Infinium, the market question is therefore whether execution can outrun these infrastructure
              and policy-friction constraints, not whether the decarbonization narrative exists.
            claimRefs:
              - CM027
              - CM028
              - CM029
              - CM030
              - CM031
              - CM032
              - CM033
