  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: >-
      Infinium's customer journey begins with a decarbonization mandate, then branches into physical fuel, feedstock, or
      certificate structures depending on who pays and who uses the product.
    data:
      items:
        - id: need
          label: Decarbonization need
          actor: Airline, corporate travel buyer, logistics operator, chemical producer
          description: Customers start with a hard-to-abate fuel or feedstock problem rather than with a software-style trial.
          channels:
            - Policy mandates
            - Climate targets
            - Procurement teams
        - id: contract
          label: Structure the contract
          actor: Customer, Infinium, financiers, registry partners
          description: >-
            Deals are framed as offtake, feedstock supply, or book-and-claim certificates and often need financing logic
            built in.
          channels:
            - Offtake negotiation
            - Project finance
            - Registry design
        - id: deploy
          label: Deploy molecules or certificates
          actor: Physical user or corporate payer
          description: >-
            American and IAG wait for Roadrunner deliveries, Amazon uses fuel in fleet operations, Borealis runs
            eNaphtha through Porvoo, and SABA buyers fund certificates.
          channels:
            - Plant output
            - Logistics
            - Book-and-claim
        - id: verify
          label: Verify emissions claim
          actor: Sustainability, finance, audit teams
          description: Customers need traceability, carbon accounting, and proof that claims are exclusive and credible.
          channels:
            - ISCC PLUS
            - CORSIA logic
            - Registries / audit
        - id: expand
          label: Expand or re-contract
          actor: Anchor account plus adjacent business units
          description: >-
            Expansion depends on delivered reliability, policy support, and whether early counterparties want more
            volume or wider use cases.
          channels:
            - Repeat orders
            - Second project
            - Group-wide rollout
