            body: >-
              The public process architecture is coherent even though Infinium does not publish a full process flow
              diagram. Roadrunner’s disclosed chain starts with renewable electricity and water, turns that electricity
              into hydrogen through Electric Hydrogen’s 100 MW HYPRPlant, combines hydrogen with captured or waste CO2,
              and then converts the resulting gas stream into drop-in hydrocarbons through the company’s synthesis and
              upgrading stack. The strongest evidence for the middle of the flow comes from Electric Hydrogen and from
              the Greyrock acquisition: Electric Hydrogen documents the electrolyzer plant, offsite modularization, and
              skid-level testing, while Greyrock and the patent record show Infinium building around gas-conversion,
              catalyst, and power-to-X control know-how rather than just commodity fuel blending. In practice,
              Infinium’s product is therefore the integrated architecture that makes those components work together at
