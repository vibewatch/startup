      - number: '8.2'
        title: Public and private comparable context
        blocks:
          - type: paragraph
            body: >-
              The comparable set gives bounds, not a clean answer. On the public side, Gevo, Aemetis, Darling
              Ingredients, and Neste trade at roughly 0.7x to 2.9x market-cap-to-revenue based on June 2026 market data,
              but those are disclosed public companies that are either mature biofuels incumbents or stressed transition
              stories. They are useful for checking how little public markets currently pay for fuel-platform revenue,
              not for translating directly into a private valuation for a project platform with no disclosed revenue.
              The private side is more relevant but thinner. LanzaJet's February 2026 financing set a $650 million
              pre-money mark for a SAF company with a commercial plant and tolling structure, while Twelve disclosed a
              very large capital stack without publishing valuation. Those datapoints imply that serious e-fuels
              companies can attract scale capital, but public evidence still does not show where Infinium itself is
              priced inside that corridor. That gap is why comp work should inform entry discipline, not replace it.
