  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: Relative support for valuation moves more on milestone conversion and disclosure than on broad sector enthusiasm.
    data:
      items:
        - label: Roadrunner on-time start
          value: 3
          detail: A live 2027 asset would increase supportability more than another narrative deck.
          tone: positive
        - label: Binding Atlas offtakes
          value: 2
          detail: Converting 2026 selection into signed contracts would strengthen the second-project story.
          tone: positive
        - label: Priced round disclosure
          value: 4
          detail: A disclosed primary or secondary price is the single biggest upgrade to underwriting precision.
          tone: positive
        - label: Policy and cost pressure
          value: -3
          detail: High SAF cost and slow e-fuel FIDs can still compress investor appetite.
          tone: negative
        - label: Roadrunner delay
          value: -4
          detail: Delay would hit confidence in both project economics and platform repeatability.
          tone: negative
        - label: Hidden debt or preferences
          value: -4
          detail: If financing terms absorb upside, headline valuation could overstate equity value.
          tone: negative
