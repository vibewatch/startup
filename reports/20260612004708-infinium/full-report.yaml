  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters and operating model
        blocks:
          - type: paragraph
            body: >-
              Infinium’s current homepage presents the company as a technology-driven platform spanning both Infinium
              Energy and Infinium Edge, but the retained public evidence base for this run is still dominated by the
              eFuels business. Official and quasi-official profiles from Mitsubishi, DBJ, the World Economic Forum and
              Florida’s foreign-LLC filing consistently place the company in Sacramento, California, with Project
              Pathfinder in Corpus Christi and Project Roadrunner in Pecos as the operating center of gravity.
              Mitsubishi’s January 2025 announcement gives the cleanest formation fact pattern: Infinium Holdings, Inc.
              was established on 2020-06-03 in Sacramento. Across the project and financing announcements, the business
              model is not a thin software or IP-licensing layer; it is a capital-intensive developer-operator model
              that combines gas-conversion technology, project development, project financing, and long-term fuel
              offtakes to commercialize eSAF, eDiesel and eNaphtha.
