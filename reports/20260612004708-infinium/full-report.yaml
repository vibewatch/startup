              The upside case is that Infinium can compound across three channels at once: more airline groups needing
              physical eSAF, more corporate buyers funding book-and-claim SAF certificates, and more non-aviation
              customers using eDiesel or eNaphtha. Public evidence already shows land-and-expand logic within American,
              cross-airline optionality within IAG, and adjacency from logistics into chemicals. The risk case is that
              customer acquisition and retention in this market are unusually dependent on policy design, traceability
              infrastructure, and the cost premium of advanced fuels. IATA, ADI, Acumen, and ICCT all point to the same
              frictions: limited supply, high cost versus fossil jet fuel, registry and double-counting risk in
              book-and-claim systems, and the need for careful contract structuring across offtake, feedstock, and
              finance. Concentration risk also matters. Argus says IAG alone likely covers about one-third of
              Roadrunner's expected annual output, while American volume is undisclosed. That means blue-chip names
              reduce credibility risk but do not eliminate dependence on a small number of anchor relationships or on
              policy-supported willingness to pay.
