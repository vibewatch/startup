            body: >-
              Infinium’s public trust-and-compliance story is stronger at the framework level than at the plant-metrics
              level. Category-level support is solid: ICAO, IATA, ReFuelEU, DOE, Treasury, TCEQ, and EPA all show that
              low-carbon aviation fuels must clear sustainability criteria, certification and accounting requirements,
              permitting steps, and fuel-registration processes before commercial scaling. Company-specific evidence
