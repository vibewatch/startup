  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, substitutes, and likely entrants'
        blocks:
          - type: paragraph
            body: >-
              Infinium competes across three layers rather than against one clean peer set. The closest direct peers are
              synthetic-fuel or other non-HEFA developers that promise drop-in fuels from non-food inputs: LanzaJet via
              alcohol-to-jet, Twelve via power-to-liquid electrochemistry, HIF via e-methanol/e-gasoline, Velocys via
              Fischer-Tropsch licensing, and Prometheus via direct-air-capture electrofuels. The strongest current
              substitutes are not these future-looking peers but incumbent SAF suppliers such as World Energy and the
              sourcing-and-booking ecosystems around SkyNRG, because they already satisfy buyer decarbonization mandates
              with operating infrastructure and known logistics. The harshest status-quo substitute remains fossil jet
              fuel itself, since IEA still describes SAF as less than 0.1% of aviation-fuel consumption and IATA
              stresses that policy support is still needed to bridge the price gap. Fulcrum BioEnergy matters less as a
              live rival than as adverse evidence: its collapse shows that impressive pathway narratives do not
              guarantee reliable commercial operation. Likely entrants include larger integrated fuel, project-finance,
              and airline ecosystems that can replicate pieces of the same stack once offtake demand is clear.
