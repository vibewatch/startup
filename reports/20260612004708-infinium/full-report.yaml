  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitute logic
        blocks:
          - type: paragraph
            body: >-
              Infinium should be sized inside the synthetic liquid-fuels market for hard-to-abate transport rather than
              inside the full hydrogen economy, the full SAF economy, or a generic clean-power TAM. The core included
              spend is eSAF/e-kerosene, other power-to-liquid e-fuels, associated book-and-claim or certificate value
              where allowed, and the project-development spend required to turn renewable electricity, hydrogen, and
              captured carbon into compliant molecules. That is narrower than the broad SAF market because most current
              SAF is still made through HEFA and other bio-based pathways, and it is much narrower than the total
              renewable-hydrogen market because many hydrogen uses never become drop-in transport liquids. Status-quo
              substitutes are conventional jet fuel, HEFA SAF, alcohol-to-jet and Fischer-Tropsch biofuels, and in some
              freight use cases direct electrification or renewable diesel. Shipping and heavy logistics matter as
              adjacencies because they can use similar green molecules or captured-carbon pathways, but road transport
              remains a secondary wedge in the near term because IEA still expects transport renewable growth to be led
              mainly by electricity and biofuels rather than hydrogen-based liquids through 2030.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM038
