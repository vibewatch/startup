        title: Leadership visibility, governance and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Leadership visibility is functional but thin. Robert Schuetzle is the only executive who appears
              consistently across official, customer, investor and supplier releases, and he is the public narrator for
              product, financing, customer and policy milestones. The best structured legal disclosure comes from the
              2026 Sunbiz filing for Infinium Operations Texas, which lists Robert Schuetzle as President, Dennis
              Schuetzle as SVP, and Paula Lausa as Secretary/Treasurer. What public sources do not provide is just as
              important: no retained official source publishes a board roster, committee structure, or a fuller
              executive bench with biographies and tenure data. That leaves meaningful key-person concentration around
              Robert for fundraising credibility and external relationship management, while Dennis and Paula appear in
              legal records without the same depth of public operating disclosure. Later chapters should therefore treat
              governance depth as a diligence item, not an established fact pattern.
