  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Infinium has crossed the threshold where valuation deserves serious discussion rather than binary
              technology skepticism. Brookfield's announced commitment, Breakthrough's earlier project equity, HSBC's
              project debt, and the American and IAG offtakes together show that Roadrunner is being financed like an
              industrial asset instead of a venture science project. That matters because the public record now supports
              a real commercialization narrative with counterparties that can unlock non-dilutive or
              quasi-infrastructure capital. The problem is that none of those signals disclose the actual entry price
              for new equity. Public evidence can therefore support only a price-sensitive process judgment: stay
              engaged, treat the company as financeable, and refuse to call buy at an undisclosed mark. In practice that
              means track, not buy or avoid, until management discloses a priced round, secondary print, or enough
              contract and debt detail to test whether the implied value is being earned by Roadrunner economics rather
              than by sponsor halo alone.
            claimRefs:
