      - number: '7.2'
        title: Fuel certification and tax-credit dependence are structural, not peripheral, risks
        blocks:
          - type: paragraph
            body: >-
              Infinium's end-market logic only works if its fuel clears both technical acceptance and incentive capture.
              IATA and FAA make the technical side plain: SAF must move through ASTM D7566 and, once blended, conform to
              ASTM D1655, while certification remains time- and resource-intensive and additional pathways are still
              under evaluation. That means investors should not confuse the general existence of drop-in SAF rules with
              public proof that Infinium's precise process configuration has cleared every pathway-specific hurdle. On
              the policy side, Roadrunner sits directly in the overlap among 45V hydrogen-credit rules, 45Z clean-fuel
              registration and verification, EPA fuel-program compliance, CORSIA accounting, and the UK/EU market rules
              that shape IAG-linked demand. None of those systems are optional footnotes; each is part of the commercial
              stack.


              This is why policy dependence ranks near the top of the severity table. Treasury's final 45V rules
              preserve incrementality, deliverability, and temporal-matching safeguards and move hydrogen projects to
              hourly matching in 2030, while IRS 45Z rules require registration, qualifying feedstocks, and documentary
              proof for SAF credit claims. The UK SAF Mandate and ReFuelEU are supportive demand structures, but they
              also add certificate, traceability, and reporting mechanics that are still being operationalized. Public
              evidence therefore supports a specific risk view: Infinium benefits from favorable long-run policy
              direction, yet near- and mid-term economics still hinge on whether the project can satisfy exact
              compliance rules without losing timing, cost, or documentation discipline.
            claimRefs:
