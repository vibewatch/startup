      - number: '1.3'
        title: Capital formation and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Infinium’s financing story is best understood as a staged de-risking of specific eFuel projects rather
              than a simple venture-round ladder. Amazon first backed the company through the Climate Pledge Fund and
              then converted that relationship into a trucking-fuel use case. Breakthrough Energy Catalyst, American
              Airlines and Citi then created the November 2023 project-equity-plus-offtake structure around Roadrunner.
              Brookfield’s September 2024 partnership added the largest disclosed capital stack: more than $200 million
              for Infinium and Roadrunner immediately plus up to another $850 million for future projects, while also
              leading the Series C preferred offering. The January 2025 first close of Series C broadened the syndicate
              with DBJ, JOGMEC, Mitsubishi Corporation, Japan Hydrogen Fund, RockCreek and other investors, and
              coincided with the Greyrock acquisition. The unresolved underwriting point is that public sources still do
              not disclose Series C sizing or valuation cleanly enough to compute a canonical cumulative-equity-raised
              number.
