      - number: '2.5'
        title: Contradictions and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Two contradictions matter most. First, policy quotas imply a much larger near-term eSAF market than the
              current project pipeline appears able to supply: Europe's synthetic-fuel mandate ramps aggressively, but
              IEA still revised down e-fuel expectations because there were no final investment decisions for EU
              e-kerosene projects to meet 2030 targets. Second, buyer interest is evident, but public willingness-to-pay
              is far better documented for airline programs and policy compliance than for large-scale, recurring
              corporate book-and-claim demand. Public evidence also does not isolate Infinium's own obtainable share of
              the addressable market: reviewed independent sources size SAF, e-kerosene, hydrogen derivatives, and
              adoption mechanics, but they do not disclose Infinium's contracted volume, delivered gallons, or realized
              pricing by segment. Finally, waste or biogenic CO2 availability remains a decisive blind spot. RFNBO and
              PtL economics are often discussed as if renewable power were the only gating input; in practice,
              qualifying carbon, interconnection timing, and siting friction can still determine whether a nominal
              market opportunity becomes financeable supply.
            claimRefs:
              - CM010
              - CM017
              - CM023
              - CM039
              - CM040
              - CM041
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The best near-term market lens is policy-qualified scarcity
            body: >-
              Infinium benefits from strong long-run narrative demand, but the investable question is whether scarce
              compliant eSAF supply can reach premium buyers before qualification rules and cost gaps narrow the field.
            calloutType: insight
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM028
