              homepage now introduces two platforms—Infinium Energy and Infinium Edge—but the retained evidence stack
              for this run overwhelmingly documents the Energy side: operating eFuels production, named physical
              projects, named offtake customers, and specific product molecules such as eSAF, eDiesel, and eNaphtha.
