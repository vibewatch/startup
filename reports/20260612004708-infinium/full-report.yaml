        title: Scale signals, projects and customer proof
        blocks:
          - type: paragraph
            body: >-
              Pathfinder and Roadrunner are the scale anchors later chapters should reuse. Pathfinder was operating by
              March 2024 as the first commercial-scale eFuels facility and is repeatedly cited as the proof point that
