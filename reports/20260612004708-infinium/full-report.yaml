      - number: '7.3'
        title: Execution risk is concentrated in the synchronization of utilities, equipment, and industrial ramp-up
        blocks:
          - type: paragraph
            body: >-
              Operationally, Roadrunner looks more mature than many climate-tech peers because multiple critical
              building blocks are already named. Construction began after FID, the project has a 150 MW wind agreement,
              Electric Hydrogen has been selected for a 100 MW electrolyzer, and the site sits on a brownfield
              gas-to-liquids footprint rather than a blank sheet. Those are real mitigants. They do not eliminate the
              more important residual risk: each mitigation has to arrive in sync. The TCEQ file said the site was not
              yet grid-connected in early 2024. Public sources still do not identify a named long-term CO2 counterparty.
              Electric Hydrogen talks about lower installed cost, but that is a vendor claim, not a startup guarantee.
              The brownfield story reduces some siting friction while increasing integration complexity across legacy
              facilities, new utility infrastructure, hydrogen systems, and fuel-quality requirements.


              This is where 2026-to-2027 timing becomes decisive. IAG talks about late-2026 deliveries while Infinium
              and Electric Hydrogen frame commercial operations in 2027. That does not prove a slip in contractual
              obligations, but it does show that market-facing milestones and plant-facing milestones are not identical.
              Add West Texas labor and heat exposure, and the practical execution view is clear: the project can still
              succeed, yet the highest-probability downside is not customer disappearance; it is delayed, uneven, or
              more expensive commissioning across power, hydrogen, CO2, safety, and operations readiness.
            claimRefs:
