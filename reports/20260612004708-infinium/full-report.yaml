          tone: positive
        - label: Platform optionality
          score: 7
          detail: Atlas creates a plausible second-wave project path.
          tone: positive
        - label: Economics clarity
          score: 3
          detail: Contract pricing, plant margin, and debt service are still private.
          tone: negative
        - label: Price transparency
          score: 2
          detail: There is still no disclosed current valuation anchor for new money.
          tone: negative
        - label: Policy resilience
          score: 4
          detail: Sector studies still show high cost sensitivity to incentives and mandates.
          tone: warning
        - label: Evidence quality
          score: 6
          detail: Strong enough to justify tracking; not strong enough to justify a public-only buy.
          tone: warning
    approximationNotes: >-
      Scores are 0-10 committee judgments anchored to cited public evidence and should be refreshed when a priced round
      or new debt disclosures emerge.
