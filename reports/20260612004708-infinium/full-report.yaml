companyProfile:
  summary: >
    Infinium is a Sacramento-headquartered private electrofuels developer founded in 2020 that is trying to turn
    power-to-liquids technology into a repeatable project-finance platform. Public evidence ties the company to Project
    Pathfinder operating proof, the larger Project Roadrunner build in West Texas, a widening product set spanning eSAF,
    eDiesel, eNaphtha, and certificate-style offerings, and unusually credible counterparties for an early-stage
    synthetic-fuels business. Brookfield, Breakthrough Energy Catalyst, HSBC, American Airlines, IAG, Amazon, and
    Borealis give the company real sponsor and customer validation. The central diligence problem is not whether
    Infinium has momentum; it is that valuation, contract economics, debt sizing, delivered volumes, and plant-level
    margins remain private, making the investment case highly sensitive to execution and entry price.
  foundedDate: '2020-06-03'
  foundingLocation: Sacramento, California, United States
  headquarters: Sacramento, California, United States
  productSummary: >-
    Infinium sells ultra-low-carbon electrofuels and related environmental-attribute products, including eSAF, eDiesel,
    eNaphtha, and certificate-style offerings, using renewable power, hydrogen, captured CO2, and power-to-liquids
    processing.
  customerFocus: >-
    Airlines and other hard-to-abate transport or industrial buyers seeking drop-in low-carbon fuels or associated
    environmental attributes, with early proof concentrated in aviation and logistics.
  businessModel: >-
    Developer-operator model that combines project development, long-term offtake contracts, sponsor and project
    financing, and eventual fuel or attribute sales from owned or partner-backed plants.
  stage: growth-stage private / commercial scale-up
  fundingStatus: >-
    Brookfield committed more than $200 million directly to Infinium and Project Roadrunner plus up to $850 million for
    future projects, Breakthrough Energy Catalyst committed $75 million to Roadrunner, HSBC later added project debt,
    and Infinium announced a Series C first close in January 2025 without disclosing the round size or valuation.
