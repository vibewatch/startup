- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - direction
  - what would change the view
  rows:
  - - Brookfield, Breakthrough, HSBC, American, and IAG together make Infinium look financeable rather than speculative.
    - thesis
    - A failed start-up, weak debt terms, or disappearing offtake quality would reduce this to sponsor theater rather than real asset finance.
  - - Atlas shows the platform can win financeable next-project demand beyond Roadrunner.
    - thesis
    - The thesis strengthens only when 2026 selection becomes binding agreements with visible counterparty depth and funding path.
  - - Public comps show the market will pay something for renewable-fuels platforms, but not software-like multiples.
    - thesis
    - If public fuel-platform multiples re-rate lower or project margins disappoint, today's hidden private mark could be too rich.
  - - Current valuation, round size, and contract economics are still private.
    - anti-thesis
    - Any disclosed round, secondary price, or cap-table package would immediately improve underwriting precision.
  - - The sector still has meaningful failure precedent and policy dependence.
    - anti-thesis
    - A clean Roadrunner ramp plus visible unit economics would reduce the weight of Fulcrum-style downside analogies.
  - - Milestone-based capital can look large before it is fully earned.
    - anti-thesis
    - Seeing Brookfield metric gates clear and follow-on capital actually deploy would materially improve confidence.
  notes: Arguments are framed around what a new investor must believe about price support, not around whether Infinium is an admirable climate-tech company.
