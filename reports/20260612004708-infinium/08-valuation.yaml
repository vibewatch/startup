- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Roadrunner start-up slips materially
    - Commercial start meaningfully misses the 2027 target or ramp data imply a long, underutilized commissioning period.
    - Execution credibility, lender confidence, and sponsor willingness to fund follow-on projects all weaken at once.
    - Pause new underwriting and reset support bands toward the bear case.
  - - Atlas demand does not become binding
    - 2026 SABA selection fails to become signed financeable contracts or buyer commitments.
    - Platform optionality shrinks back to a single-project story.
    - Do not pay for multi-project upside until binding demand appears.
  - - Plant economics disappoint
    - Private diligence shows pricing, credits, and debt service do not support attractive plant-level returns.
    - A financeable asset can still be a poor equity investment if economics mostly accrue to lenders or preferred capital.
    - Move from track toward avoid at any premium private mark.
  - - Policy or cost support weakens
    - Tax-credit, mandate, or compliance-fee dynamics make e-fuels materially less investable than expected.
    - Public comps and cost studies already show the sector is not self-supporting on commodity parity today.
    - Re-cut valuation with lower utilization confidence and lower multiple support.
  - - Sector failure contagion returns
    - A new high-profile SAF or e-fuels project failure changes investor appetite or debt availability.
    - Comparable downside widens because sponsor halo stops offsetting sector execution fear.
    - Require better price or defer participation entirely.
  notes: These are decision triggers that would directly impair price support, not generic risks copied from the sector.
