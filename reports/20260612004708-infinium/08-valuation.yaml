- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - metric
  - multiple or valuation or status
  - relevance
  - limitation
  rows:
  - - LanzaJet
    - Private financing valuation
    - 2026 round at $650M pre-money
    - Best disclosed private comp for a commercializing SAF peer with operating-plant proof and structured offtake logic.
    - ATJ pathway, different feedstocks, and a disclosed private mark that may not translate to Infinium's larger project ambitions.
  - - Twelve
    - Private financing structure
    - 2024 financing of $645M with $400M of project equity but no disclosed valuation
    - Useful signal for how much capital sophisticated investors still commit to e-fuels infrastructure.
    - No public valuation mark, so it cannot anchor price discipline directly.
  - - Gevo
    - Public market cap / revenue
    - ~$0.35B market cap on ~$0.12B revenue (~2.9x)
    - Shows what public markets pay for a small renewable-fuels transition story with disclosed revenue.
    - Public company with reported revenue and different asset mix; not a private project platform.
  - - Aemetis
    - Public market cap / revenue
    - ~$0.14B market cap on ~$0.20B revenue (~0.7x)
    - Useful distressed comp for how low markets can price challenging renewable-fuels economics.
    - Reflects public-company stress and leverage, not sponsor-backed project-finance optionality.
  - - Darling Ingredients
    - Public market cap / revenue
    - ~$9.05B market cap on ~$6.13B revenue (~1.5x)
    - Relevant mature fuels and feedstocks benchmark for how public markets value scaled, disclosed economics.
    - Large incumbent with broad operations and very different risk profile from Infinium.
  - - Neste
    - Public market cap / revenue
    - ~$25.90B market cap on ~$22.54B revenue (~1.1x)
    - Best large incumbent clean-fuels benchmark for public market discipline on revenue multiples.
    - Integrated incumbent with audited scale and profitability disclosure that Infinium does not yet match.
  notes: The table mixes one disclosed private valuation, one large private financing without price, and four public-market anchors to bound rather than solve the Infinium pricing question.
