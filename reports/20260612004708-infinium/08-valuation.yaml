  evidenceGaps:
  - type: missing-source
    severity: material
    topic: current-pricing
    missingEvidence: A priced primary or secondary Infinium transaction with valuation, price per share, and round size.
    whyItMatters: The chapter can judge only whether public evidence supports an undisclosed price in principle, not whether today's actual entry clears an acceptable hurdle.
    diligencePath: Request the latest financing deck, cap table snapshot, or a brokered secondary print and compare it with the public heuristic range.
    relatedQuestionRefs:
    - QV009
    - QV010
    relatedTableRefs:
    - TV001
    - TV003
  - type: private-evidence-only
    severity: blocking
    topic: contract-economics
    missingEvidence: Roadrunner offtake pricing, take-or-pay mechanics, volume curves, and plant-level margin bridge.
    whyItMatters: Without contract economics, even good demand proof cannot translate into a defensible valuation or return case.
    diligencePath: Obtain customer term sheets, plant model assumptions, and board materials covering revenue, tax credits, and contribution margin.
    relatedQuestionRefs:
    - QV024
    - QV029
    relatedTableRefs:
    - TV003
    - TV006
  - type: missing-source
    severity: material
    topic: capital-structure
    missingEvidence: HSBC debt sizing, covenants, amortization, Brookfield metric gates, and any preference stack or dilution waterfall.
    whyItMatters: Milestone-based capital only supports equity value if debt and contingent capital do not absorb most of the upside.
    diligencePath: Request financing agreements, intercreditor summary, and pro forma cap table from management and counsel.
    relatedQuestionRefs:
    - QV025
    - QV026
    relatedTableRefs:
    - TV001
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-valuation-table
    missingEvidence: A fuller set of disclosed private e-fuels valuations and more precise public fuel-platform trading comps.
    whyItMatters: The comparable table is decision-useful but not exhaustive because most private peers do not publish valuation marks and several public peers mix fuels with unrelated businesses.
    diligencePath: Refresh the comp set on the next run for any newly disclosed private round or public renewable-fuels repricing.
    relatedQuestionRefs:
    - QV011
    - QV012
    - QV018
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: exit-readiness
    missingEvidence: Audit readiness, governance rights, disclosure controls, and investor-rights documentation suitable for crossover capital.
    whyItMatters: Institutional sponsors help, but a crossover-ready or IPO-ready valuation requires governance and disclosure quality that public evidence still does not show.
    diligencePath: Request governance documents, board observer rights, audit timetable, and disclosure-control workplan.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV006
