company:
  name: Infinium
chapter:
  number: 8
  title: Valuation
  summary: 'Infinium now looks more like a financeable climate-infrastructure platform than a speculative SAF concept: Brookfield has committed direct and contingent capital, HSBC has provided project debt, and American plus IAG offtakes support Roadrunner. But the public record still does not disclose the current valuation, round size, pricing terms, debt sizing, or plant-level economics. The price-sensitive public-only call is track with medium confidence, high risk, and an unknown valuation stance until a priced round or deeper contract disclosure narrows the range.'
sections:
- id: recommendation-and-price-discipline
  title: Recommendation and price discipline
  body: 'Infinium has crossed the threshold where valuation deserves serious discussion rather than binary technology skepticism. Brookfield''s announced commitment, Breakthrough''s earlier project equity, HSBC''s project debt, and the American and IAG offtakes together show that Roadrunner is being financed like an industrial asset instead of a venture science project. That matters because the public record now supports a real commercialization narrative with counterparties that can unlock non-dilutive or quasi-infrastructure capital. The problem is that none of those signals disclose the actual entry price for new equity. Public evidence can therefore support only a price-sensitive process judgment: stay engaged, treat the company as financeable, and refuse to call buy at an undisclosed mark. In practice that means track, not buy or avoid, until management discloses a priced round, secondary print, or enough contract and debt detail to test whether the implied value is being earned by
    Roadrunner economics rather than by sponsor halo alone.'
