- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - assumptions
  - valuation or return logic
  - key risks
  - probability signal
  rows:
  - - Bull
    - Roadrunner starts on time in 2027, Atlas signs binding offtakes in 2026, and follow-on Brookfield capital begins converting into real project deployment.
    - Illustrative platform support above $2.0B because Infinium would have both operating proof and repeatable project-finance evidence.
    - Ramp execution, policy rollback, and still-opaque contract margins could cap upside.
    - Possible, but requires multiple milestones that are not yet public facts.
  - - Base
    - Roadrunner reaches operations broadly on schedule and Atlas stays credible, but pricing, debt terms, and cap-table details remain mostly private.
    - Illustrative support around $1.0B-$1.6B, enough to keep investors engaged but not enough to justify aggressive entry discipline without more disclosure.
    - Sponsor halo may still outrun plant-level return visibility.
    - Most consistent with current public evidence.
  - - Bear
    - Roadrunner slips, Atlas does not convert into financeable contracts, or economics reveal policy dependence without attractive plant returns.
    - Illustrative support roughly $0.6B-$0.9B, closer to commercial-stage peer marks and well below what a premium narrative would imply.
    - Execution failure can destroy equity value before demand fully disappears.
    - Easy to defend because Fulcrum-style failure precedent and policy risk already exist.
  notes: Ranges are heuristic private-market support bands for decision-making, not management guidance or a tradable mark.
