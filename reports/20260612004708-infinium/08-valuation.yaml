- id: milestone-based-scenario-logic
  title: Milestone-based scenario logic
  body: 'The right valuation method here is milestone-based platform underwriting, not a faux-precise revenue multiple. Infinium''s value is most sensitive to whether Roadrunner starts in 2027, whether the plant can turn airline offtakes into observable unit economics, and whether Project Atlas converts SABA demand into binding agreements that unlock a second wave of financing. Brookfield''s structure is the key clue: the first more-than-$200 million is direct capital, but the additional $850 million is conditional and therefore behaves more like a call option on execution than cash already in hand. In the bear case, delays or poor economics push Infinium back toward commercial-stage peer marks and below. In the base case, Roadrunner delivery plus Atlas conversion justify a wider but still cautious low-single-digit-billion platform view. The bull case requires repeatability: Roadrunner ramp, Atlas financeability, and evidence that follow-on Brookfield capital is becoming real rather than
    rhetorical.'
