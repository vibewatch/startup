- id: section-2
  title: Leadership visibility, governance and key-person dependence
  body: 'Leadership visibility is functional but thin. Robert Schuetzle is the only executive who appears consistently across official, customer, investor and supplier releases, and he is the public narrator for product, financing, customer and policy milestones. The best structured legal disclosure comes from the 2026 Sunbiz filing for Infinium Operations Texas, which lists Robert Schuetzle as President, Dennis Schuetzle as SVP, and Paula Lausa as Secretary/Treasurer. What public sources do not provide is just as important: no retained official source publishes a board roster, committee structure, or a fuller executive bench with biographies and tenure data. That leaves meaningful key-person concentration around Robert for fundraising credibility and external relationship management, while Dennis and Paula appear in legal records without the same depth of public operating disclosure. Later chapters should therefore treat governance depth as a diligence item, not an established fact pattern.'
  claimRefs:
  - CO021
  - CO022
  - CO023
  - CO024
  tableRefs:
  - TO002
- id: section-3
  title: Capital formation and stakeholder map
  body: 'Infinium’s financing story is best understood as a staged de-risking of specific eFuel projects rather than a simple venture-round ladder. Amazon first backed the company through the Climate Pledge Fund and then converted that relationship into a trucking-fuel use case. Breakthrough Energy Catalyst, American Airlines and Citi then created the November 2023 project-equity-plus-offtake structure around Roadrunner. Brookfield’s September 2024 partnership added the largest disclosed capital stack: more than $200 million for Infinium and Roadrunner immediately plus up to another $850 million for future projects, while also leading the Series C preferred offering. The January 2025 first close of Series C broadened the syndicate with DBJ, JOGMEC, Mitsubishi Corporation, Japan Hydrogen Fund, RockCreek and other investors, and coincided with the Greyrock acquisition. The unresolved underwriting point is that public sources still do not disclose Series C sizing or valuation cleanly enough
    to compute a canonical cumulative-equity-raised number.'
