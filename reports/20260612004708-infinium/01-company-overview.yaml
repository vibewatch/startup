- id: section-4
  title: Scale signals, projects and customer proof
  body: 'Pathfinder and Roadrunner are the scale anchors later chapters should reuse. Pathfinder was operating by March 2024 as the first commercial-scale eFuels facility and is repeatedly cited as the proof point that Infinium can make and ship commercial volumes. Roadrunner is the scale-up: a Pecos-area plant designed for roughly 23,000 tonnes per year of eSAF and other eFuels, backed by airline offtakes, 150 MW of new wind power from a NextEra affiliate, and a 100 MW electrolyzer system from Electric Hydrogen. Official materials now name Amazon, American Airlines, Borealis and IAG as existing or contracted customers, while Amazon’s own pages show both investment support and a truck-fuel use case. What the public record does not provide are hard company-scale metrics such as current headcount, run-rate revenue or active customer count, so those must remain null in the snapshot tables rather than converted into false precision.'
