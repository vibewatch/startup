- id: section-5
  title: Milestones, chronology and adverse dependencies
  body: 'The milestone record is strong enough to anchor later chapters, but it contains two important caution flags. First, Infinium’s February 2024 45V comment letter to the IRS makes clear that hydrogen-tax-credit structure, temporal matching and grandfathering are not abstract policy debates; they affect the financial bedrock of its projects. Second, the company’s own timing moved: the 2024 comment letter expected Roadrunner production in 2026, while May-June 2025 project updates and Argus reporting shifted commercial operations to 2027. That slippage does not break the thesis, but it does mean any later revenue or volume assumption must use 2027, not a stale 2026 start date. Mission Possible Partnership’s Roadrunner case study adds more execution texture by highlighting the challenges of stakeholder education, contract structuring, policy uncertainty and scaling first-of-a-kind facilities. Those are the most reusable adverse signals in the current public record.'
