  evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-disclosure
    missingEvidence: A current board roster, board observer list, and fuller executive-bench disclosure from the company or a filing-grade source.
    whyItMatters: Governance quality and key-person dependence cannot be underwritten well from a CEO-centric public narrative alone.
    diligencePath: Request the latest board deck, cap-table governance schedule and executive org chart in management diligence.
    relatedQuestionRefs:
    - QO007
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: valuation-and-total-raised
    missingEvidence: A precise Series C close amount, post-money valuation, and reconciliation between corporate equity, project equity, contingent Brookfield commitments and HSBC debt.
    whyItMatters: Later valuation and dilution work depends on knowing what capital is actually closed versus merely committed or contingent.
    diligencePath: Obtain the Series C closing memo, cap table, financing waterfall and Brookfield side-letter milestone schedule.
    relatedQuestionRefs:
    - QO012
    relatedTableRefs:
    - TO001
    - TO003
  - type: missing-source
    severity: material
    topic: current-scale-metrics
    missingEvidence: Authoritative current figures for headcount, revenue or run-rate, and active customer count as of the run date.
    whyItMatters: Without hard scale metrics, later market, financial and valuation chapters must avoid unsupported penetration or productivity assumptions.
    diligencePath: Request the latest management dashboard, payroll headcount summary and customer revenue bridge.
    relatedQuestionRefs:
    - QO020
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: material
    topic: roadrunner-commercial-operations-date
    missingEvidence: A current project schedule that explains the shift from the 2026 production expectation in the 45V comment letter to the 2027 COD in later sources.
    whyItMatters: Timing drives revenue start, tax-credit exposure, working-capital timing and valuation assumptions across the rest of the report.
    diligencePath: Request the latest construction schedule, EPC progress report and lender-approved milestone calendar for Roadrunner.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO004
