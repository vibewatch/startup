company:
  name: Infinium
chapter:
  number: 1
  title: Company Overview
  summary: Infinium is a Sacramento-headquartered private eFuels developer established on 2020-06-03 that now frames itself as a broader energy-and-digital-infrastructure company, although the retained financing, customer and project record remains overwhelmingly tied to synthetic fuels. Public sources support Project Pathfinder as the first commercial-scale operating eFuels plant, Project Roadrunner as the next scaling step in West Texas, and a funding stack led by Breakthrough Energy Catalyst, Brookfield and strategic industrial investors. The key open issues for later chapters are valuation, true cumulative capital raised, full board and founder disclosure, and current revenue, headcount and customer counts.
sections:
- id: section-1
  title: Identity, headquarters and operating model
  body: 'Infinium’s current homepage presents the company as a technology-driven platform spanning both Infinium Energy and Infinium Edge, but the retained public evidence base for this run is still dominated by the eFuels business. Official and quasi-official profiles from Mitsubishi, DBJ, the World Economic Forum and Florida’s foreign-LLC filing consistently place the company in Sacramento, California, with Project Pathfinder in Corpus Christi and Project Roadrunner in Pecos as the operating center of gravity. Mitsubishi’s January 2025 announcement gives the cleanest formation fact pattern: Infinium Holdings, Inc. was established on 2020-06-03 in Sacramento. Across the project and financing announcements, the business model is not a thin software or IP-licensing layer; it is a capital-intensive developer-operator model that combines gas-conversion technology, project development, project financing, and long-term fuel offtakes to commercialize eSAF, eDiesel and eNaphtha.'
