- id: TO003
  title: Stakeholder or investor map
  columns:
  - Stakeholder
  - Role
  - Control or economic importance
  - Diligence ask
  rows:
  - - Brookfield Asset Management / Brookfield Renewable
    - Lead strategic capital provider; Series C lead
    - Committed >$200M immediately plus up to $850M for future projects and became lead in the Series C preferred offering.
    - Confirm the closed amount versus contingent project capital, governance rights, and milestone tests on the follow-on $850M.
  - - Breakthrough Energy Catalyst
    - Project equity anchor
    - Committed $75M to Roadrunner in 2023 and helped structure a financeable project template.
    - Confirm whether the commitment has fully funded, milestone conditions, and any preferred economics at project level.
  - - Amazon / Climate Pledge Fund
    - Strategic investor and early fuel customer
    - Turned climate-tech investment support into an actual trucking-fuel use case and remains a flagship reference customer.
    - Separate venture ownership from commercial offtake volumes and determine whether Amazon remains a repeat buyer beyond the first trucking program.
  - - American Airlines + Citi
    - Anchor offtake and emissions-transfer counterparties
    - American provides demand certainty for Roadrunner eSAF; Citi supported the associated emissions-transfer construct.
    - Validate contracted volumes, pricing floors, duration, and how much of Roadrunner output is already committed.
  - - IAG
    - Long-term airline offtaker
    - Signed a 10-year e-SAF purchase agreement and helps position Roadrunner into UK/EU compliance markets.
    - Clarify total contracted tonnage, delivery schedule, and whether the arrangement is take-or-pay.
  - - DBJ / JOGMEC / Mitsubishi Corporation / Japan Hydrogen Fund
    - Japanese strategic and institutional Series C syndicate
    - Broadened the cap table toward Japan-linked demand creation and future project deployment.
    - Map board or observer rights, Japan supply-chain commitments, and whether investment is tied to future Japanese offtake.
  - - HSBC
    - Project debt provider
    - Provided project-based financing in 2025, marking institutional lender validation for Roadrunner.
    - Review debt sizing, tenor, covenants, reserve requirements and linkage to tax-credit assumptions.
  - - NextEra Energy Resources and Electric Hydrogen
    - Critical project suppliers
    - Wind power and electrolyzer supply are operationally central even though they are not equity investors.
    - Confirm schedule guarantees, liquidated damages and contingencies if electricity or hydrogen costs miss underwriting assumptions.
  notes: This is a public stakeholder map, not a cap table. It combines investors, lenders, customers and critical suppliers because Roadrunner bankability depends on all four constituencies.
