callouts:
- calloutType: strength
  title: Project-bankability is Infinium’s clearest strategic differentiator
  body: Many climate-fuel companies can describe the chemistry; fewer can show a working plant, committed airline demand, a mega-fund capital partner, supplier contracts, and institutional debt for the next site. That combination is the strongest reusable proof point from chapter 1.
  claimRefs:
  - CO007
  - CO011
  - CO014
  - CO026
  - CO028
  - CO032
  - CO044
- calloutType: risk
  title: Schedule and policy dependencies are real, not theoretical
  body: The Roadrunner chronology already moved from a 2026 production expectation in the February 2024 45V comment letter to 2027 commercial-operations guidance in 2025 project updates. At the same time, the company’s own policy filings show that tax-credit structure remains part of the economic case.
  claimRefs:
  - CO035
  - CO036
  - CO037
  - CO038
- calloutType: insight
  title: Public visibility is strongest on projects and weakest on corporate-scale metrics
  body: The retained record is unusually rich on Roadrunner’s contracts, suppliers and financing, but weak on conventional company-level diligence metrics such as valuation, headcount, revenue and board composition. That asymmetry should shape later workstreams.
  claimRefs:
  - CO023
  - CO039
  - CO040
