  - - Corporate aviation emissions accounting
    - Limited access to physical SAF at every airport
    - Project Atlas SAF certificates via SABA book-and-claim
    - Lets buyers fund next-generation SAF without physical fuel matching
    - Certificate model adds accounting and integrity complexity
  - - Project-scale fuel deployment
    - Assemble separate power, hydrogen, CO2, and finance stacks
    - Integrated developer-operator model around Roadrunner
    - Creates a single delivery pathway for hard-to-abate buyers
    - Raises execution and capital-intensity risk if one dependency slips
