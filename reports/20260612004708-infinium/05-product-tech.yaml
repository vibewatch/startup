- id: section-3
  title: Deployment footprint and asset roadmap
  body: 'The asset map is now legible enough to underwrite as a sequence. Pathfinder is the operating proof point. Roadrunner is the scale-up asset with disclosed capacity, financing, power procurement, and a named electrolyzer supplier. Atlas is the commercialization extension that reaches customers through SAF certificates rather than only through physical fuel logistics. Mission Possible Partnership’s Roadrunner case study is especially useful because it frames the move from Pathfinder to Roadrunner as a replicable blueprint, not an isolated megaproject. That said, the roadmap is not perfectly clean: older offtake messaging pointed to late-2026 supply, but newer construction and equipment disclosures point to 2026 equipment commissioning and 2027 commercial production. For diligence, that means schedules, revenue bridges, and customer readiness should anchor on the newer 2027 operating date rather than the older 2026 language.'
  claimRefs:
  - CE003
  - CE005
  - CE006
  - CE010
  - CE015
  - CE032
  - CE033
  - CE034
