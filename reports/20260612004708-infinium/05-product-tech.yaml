company:
  name: Infinium
chapter:
  number: 5
  title: Product & Technology
  summary: Infinium’s product is best understood as an integrated power-to-liquid fuel platform built around Pathfinder operating proof, Roadrunner scale-up, and a widening commercialization model that now includes Project Atlas certificates as well as physical fuel. Public evidence supports eSAF, eDiesel, and eNaphtha outputs, a 100 MW electrolyzer deployment and 150 MW wind backing for Roadrunner, and differentiated gas-conversion IP strengthened by the Greyrock acquisition. The key product risks are schedule slippage from older 2026 messaging to newer 2027 production guidance, unresolved molecule-specific ASTM qualification detail, undisclosed CO2 sourcing, and ongoing dependence on permitting and 45V hydrogen-accounting rules.
sections:
- id: section-1
  title: What Infinium sells today
  body: 'Infinium’s public product story is much more concrete on fuels than on software or digital services. The homepage now introduces two platforms—Infinium Energy and Infinium Edge—but the retained evidence stack for this run overwhelmingly documents the Energy side: operating eFuels production, named physical projects, named offtake customers, and specific product molecules such as eSAF, eDiesel, and eNaphtha. Pathfinder matters because it converts the company from a slide-deck pathway into a producer with an operating asset in Corpus Christi. Roadrunner then extends that thesis into a much larger Pecos build aimed at aviation fuel and adjacent low-carbon products, while Project Atlas adds a certificate-led commercialization route. The net takeaway is that Infinium is selling decarbonized hydrocarbon molecules and project-delivery capability, not merely a process license or climate narrative.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE019
  - CE020
  - CE033
  tableRefs:
  - TE001
  figureRefs:
