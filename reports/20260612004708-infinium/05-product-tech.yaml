  evidenceGaps:
  - type: missing-source
    severity: material
    topic: co2-source
    missingEvidence: Named captured-CO2 suppliers, capture technology, and source mix for Pathfinder and Roadrunner.
    whyItMatters: Feedstock origin affects carbon intensity, scalability, permitting risk, and the credibility of repeatability claims.
    diligencePath: Request plant-level feedstock contracts or lifecycle-analysis exhibits naming each CO2 source and annual delivered volumes.
    relatedQuestionRefs:
    - QE024
  - type: private-evidence-only
    severity: material
    topic: pathfinder-performance
    missingEvidence: Plant uptime, product-spec attainment, delivered volumes, and yield data from Pathfinder.
    whyItMatters: Commercial-scale proof depends on reliable operations, not only on commissioning headlines and customer announcements.
    diligencePath: Request monthly operating dashboards, quality certificates, and shipment records for Pathfinder output.
    relatedQuestionRefs:
    - QE026
  - type: missing-source
    severity: material
    topic: astm-qualification
    missingEvidence: Molecule-specific ASTM qualification pathway, blend ceiling, and any public certification packages for Infinium output.
    whyItMatters: Drop-in claims are stronger when tied to the exact approved pathway and certification evidence rather than category-level SAF guidance.
    diligencePath: Request ASTM pathway disclosure, batch certification documents, and customer fuel-quality acceptance records.
    relatedQuestionRefs:
    - QE025
  - type: missing-source
    severity: minor
    topic: infinium-edge
    missingEvidence: Standalone product documentation showing what Infinium Edge delivers and how it connects commercially to the fuels platform.
    whyItMatters: The homepage now presents Edge as a co-equal platform, but current retained product evidence is overwhelmingly fuels-centric.
    diligencePath: Request product briefs, customer references, and revenue attribution for the Edge platform.
    relatedQuestionRefs:
    - QE002
