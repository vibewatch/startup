- id: section-4
  title: Quality, permitting, and compliance controls
  body: 'Infinium’s public trust-and-compliance story is stronger at the framework level than at the plant-metrics level. Category-level support is solid: ICAO, IATA, ReFuelEU, DOE, Treasury, TCEQ, and EPA all show that low-carbon aviation fuels must clear sustainability criteria, certification and accounting requirements, permitting steps, and fuel-registration processes before commercial scaling. Company-specific evidence also exists, but it is narrower. TCEQ documents a Pecos permit-by-rule pathway and names a senior lead chemical engineer on the Roadrunner filing; Electric Hydrogen discloses stack testing, hydro-tests, and shipment-quality steps for the electrolyzer package; and Infinium’s own 45V comment letter makes clear that hydrogen accounting details such as temporal matching and incrementality are economically material. What remains missing is the most underwriter-relevant operating detail: plant-specific QA certificates, ASTM pathway disclosure, and ongoing product-spec performance
    data from Pathfinder.'
  claimRefs:
  - CE014
  - CE022
  - CE023
  - CE024
  - CE026
  - CE027
  - CE028
  - CE029
  - CE035
  - CE039
  tableRefs:
  - TE004
- id: section-5
  title: Differentiation and technical risk
  body: 'Infinium’s differentiation does not rest on a single magical reactor or a software moat. Instead, the evidence points to a combination of pathfinding commercial proof, molecule breadth, project integration, and control over enabling know-how. The Greyrock acquisition and patent portfolio imply real process-engineering ambition around syngas, catalysts, and liquid-fuel synthesis, while Electric Hydrogen adds a modular electrolyzer path that can be slotted into larger projects. Product breadth also matters: public sources support aviation fuel, diesel, and naphtha use cases, which can widen customer pools and improve project optionality. But the same integrated design creates risk. Roadrunner must synchronize power, hydrogen, CO2, permits, finance, offtake, and policy. Reuters’ broader sector review shows that first-of-a-kind SAF projects frequently slip or fail under those pressures. Infinium therefore looks differentiated enough to merit continued diligence, but only if the next
    round of diligence gets plant-level performance data and exact pathway-specific compliance evidence.'
  claimRefs:
  - CE016
