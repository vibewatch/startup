slug: infinium
runDate: '2026-06-12'
company:
  name: Infinium
chapter:
  number: 7
  title: Risks
  summary: Infinium's residual risk is driven less by demand formation than by policy-qualified execution. Roadrunner has named offtakers, sponsor capital, a project lender, a 150 MW wind agreement, and a chosen electrolyzer supplier, but the public record still leaves material blind spots around full permitting scope, CO2 sourcing, tax-credit qualification, ASTM pathway readiness, and undisclosed project economics. The highest-severity risks are startup slippage into or beyond 2027, failure to preserve 45V/45Z value through evolving compliance rules, and concentration in a small set of financing, utility, and launch-customer counterparties.
sections:
- id: regulatory-and-permitting-stack
  title: Regulatory and permitting stack remains directionally positive but not fully underwritten
  body: 'The visible permit record is constructive but incomplete. TCEQ''s Roadrunner file confirms that the Pecos site has an underlying NSR authorization and a discrete PBR registration for a site-support generator, and the agency''s acknowledgement letter makes clear that recordkeeping, accurate disclosure, and ongoing compliance remain enforceable conditions. That is enough to conclude Roadrunner is not operating from a purely aspirational siting story. It is not enough to conclude that every state, local, federal, utility, and environmental approval needed for full operations has been surfaced in public. The retained record shows at least one concrete air-permitting thread; it does not yet provide a full permit register or an external counsel-style signoff on all required approvals. That gap matters because construction-stage climate-tech assets often fail not on a single fatal permit denial, but on slow utility, construction, reporting, and compliance dependencies that compound into
    startup delay.


    The same pattern shows up in environmental and legal exposure. Public retained searches did not surface an overt enforcement case, public litigation docket, or PTAB dispute, and the patent record shows Infinium does have real technical IP. But absence of visible public disputes is not the same as a cleared freedom-to-operate or environmental diligence package. Investors should therefore treat the regulatory picture as a partially de-risked stack with one important asymmetry: there is enough official evidence to show the project is real and regulated, but not enough to assume that every permit, review, and legal workstream is complete or that no hidden challenge exists.'
  claimRefs:
  - CR001
  - CR002
