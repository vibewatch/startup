tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Rule / case / requirement
  - Jurisdiction
  - Current status
  - Likelihood
  - Severity
  - Mitigation
  - Residual exposure
  - Diligence path
  rows:
  - - 45V / 45Z qualification and tax-credit compliance
    - U.S. federal
    - Rules are live, but credit capture still depends on registration, prevailing-wage compliance, feedstock qualification, verification, and carbon-intensity accounting.
    - Medium
    - Critical
    - Infinium is actively engaged in policy detail, and final 45V / 45Z frameworks now exist.
    - A documentation or qualification miss can impair project economics even if the plant runs.
    - Request 45V / 45Z memo, registration evidence, GREET-model assumptions, and third-party verification plan.
  - - Fuel technical certification under ASTM D7566 / D1655 and airline acceptance
    - Global aviation
    - General SAF framework is clear, but Infinium-specific pathway evidence is not public in the retained record.
    - Medium
    - High
    - Drop-in standards exist and FAA/IATA pathways provide a defined process.
    - Process-specific approval, blending, or chain-of-custody issues can delay monetization.
    - Obtain ASTM qualification roadmap, testing results, customer-spec acceptance criteria, and compliance owner.
  - - Permit completeness and environmental-review scope
    - Texas / local / federal
    - TCEQ public record confirms at least one PBR and an underlying NSR authorization, but not a full permit register.
    - Medium
    - High
    - Brownfield siting and visible air-permit activity indicate real progress.
    - Missing utility, water, construction, or environmental approvals can still slow startup.
    - Request full permit matrix, counsel signoff, and agency correspondence log.
  - - UK / EU SAF certificate, traceability, and reporting obligations for launch volumes
    - UK / EU / Switzerland
    - Supportive mandates exist, but reporting and traceability rules are still being refined.
    - Medium
    - High
    - IAG demand is aligned with real mandates rather than voluntary marketing alone.
    - Administrative failure can strand value even if physical fuel is available.
    - Request compliance workplan covering UK SAF Mandate, ReFuelEU, CORSIA, and customer reporting interfaces.
  - - Litigation / PTAB / freedom-to-operate exposure
    - U.S.
    - Patent holdings are public; visible dispute record in retained sources is sparse rather than cleanly disproven.
    - Low
    - Medium
    - Infinium appears to have a meaningful patent portfolio.
    - Hidden IP disputes, licensing demands, or unpublicized challenges can emerge late.
    - Request FTO opinion, claims chart, insurance summary, and any dispute notices.
  notes: Rows are ordered by residual investment severity, not by legal chronology. Public sources support the existence of several compliance frameworks, but not full readiness evidence for every one of them.
  enumerationScope:
    coverage: partial
    basis: Public retained sources cover the main disclosed regulatory and legal workstreams for Roadrunner, but not every permit or contract artifact required for a full legal diligence checklist.
