  evidenceGaps:
  - type: missing-source
    severity: material
    topic: CO2 supply
    missingEvidence: Named long-term CO2 supply agreement, purity specs, delivery route, carbon-intensity accounting method, and fallback supply plan.
    whyItMatters: Feedstock continuity and carbon-accounting integrity are core to Roadrunner uptime and to the economics of every e-fuel gallon.
    diligencePath: Request the executed CO2 supply contract, lifecycle accounting memo, contingency sourcing plan, and any measurement/verification protocol.
    relatedQuestionRefs:
    - QR019
    - QR026
    relatedTableRefs:
    - TR002
    - TR003
  - type: private-evidence-only
    severity: material
    topic: project finance
    missingEvidence: Full sources-and-uses model, total capex, debt size, debt-service covenants, contingency budget, and sponsor support waterfall.
    whyItMatters: Without capex and debt detail, investors cannot underwrite overrun risk, covenant headroom, or whether Brookfield support actually backstops downside cases.
    diligencePath: Request lender presentation, debt term sheet, EPC budget, contingency policy, and board-approved financing plan.
    relatedQuestionRefs:
    - QR014
    - QR026
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: offtake economics
    missingEvidence: American and IAG pricing, take-or-pay terms, termination rights, liquidated-damages structure, and sold-versus-unsold volume schedule.
    whyItMatters: Named counterparties reduce demand risk, but not cash-flow risk, unless pricing, volume obligations, and remedies are visible.
    diligencePath: Obtain contract summaries or redlined term sheets showing annual volume ramps, price formulae, performance guarantees, and buyer termination triggers.
    relatedQuestionRefs:
    - QR015
    - QR016
    - QR026
    relatedTableRefs:
    - TR003
    - TR005
  - type: missing-source
    severity: material
    topic: permit completeness
    missingEvidence: Complete permit matrix covering air, water, construction, utility interconnection, local approvals, and any NEPA or federal environmental-review status.
    whyItMatters: The retained TCEQ record proves at least one air authorization, but not every approval required for full operations or export-linked logistics.
    diligencePath: Request diligence binder with permit register, status tracker, outside counsel signoff, agency correspondence log, and red/yellow/green permit heatmap.
    relatedQuestionRefs:
    - QR003
    - QR030
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: minor
    topic: site-specific OSHA history
    missingEvidence: Direct search results or case files confirming whether Roadrunner or affiliated site entities have any OSHA inspections, citations, or hazard alerts.
    whyItMatters: West Texas heat and industrial-safety exposure are real, but public risk severity should be anchored to actual inspection history rather than generic industry caution alone.
    diligencePath: Run entity-name and address searches in OSHA IMIS and request EHS incident logs, training records, and contractor safety KPIs.
    relatedQuestionRefs:
    - QR020
    - QR021
    relatedTableRefs:
    - TR002
    - TR004
  - type: missing-source
    severity: material
    topic: ASTM / pathway qualification
    missingEvidence: Infinium-specific certification package or pathway/legal memo showing exactly how its eSAF reaches ASTM D7566/D1655 and market-recognition requirements.
    whyItMatters: General SAF standards are clear, but investors still need assurance that Infinium's specific process and product slate can move through all technical and chain-of-custody checks.
    diligencePath: Request ASTM qualification roadmap, third-party testing reports, blending plan, and customer acceptance criteria.
    relatedQuestionRefs:
    - QR005
    - QR029
    relatedTableRefs:
    - TR001
    - TR005
  - type: missing-source
    severity: minor
    topic: freedom to operate
    missingEvidence: Outside-counsel FTO opinion, competitor patent landscape, and any threatened or settled disputes not visible in public retained sources.
    whyItMatters: A patent portfolio helps, but absence of public litigation is not equivalent to absence of infringement or licensing exposure.
    diligencePath: Request patent schedule, FTO memo, open-claims chart, and any claims-notice correspondence or insurance coverage summary.
    relatedQuestionRefs:
    - QR022
    - QR023
    relatedTableRefs:
    - TR001
