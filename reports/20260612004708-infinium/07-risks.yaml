- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Commercial-start slippage
    - Milestone tracker against stated 2027 operations target
    - Mechanical completion or first-spec-fuel dates move materially beyond 2027 without compensating capital plan
    - Treat as thesis impairment; revisit debt, customer timing, and sponsor-support assumptions.
  - - Tax-credit capture failure
    - 45V / 45Z readiness package
    - Registration, verification, or carbon-intensity evidence is incomplete within internal financing deadlines
    - Escalate to red-flag diligence; re-underwrite without assumed credit value.
  - - Feedstock dependency
    - CO2 / power / hydrogen contract completeness
    - Any one of the three core inputs lacks executable long-term supply with fallback terms before commissioning
    - Do not underwrite steady-state margins; treat startup plan as incomplete.
  - - Customer concentration and contract opacity
    - Signed contract economics package
    - No price, take-or-pay, and remedy visibility for American / IAG by investment committee stage
    - Hold valuation discount or defer until contract economics are visible.
  - - Capital-stack fragility
    - Capex and covenant package
    - Capex, debt size, contingency, or sponsor-overrun support remains undisclosed after financing diligence
    - Assume higher dilution / recap risk and cap position sizing.
  - - Certification / traceability breakdown
    - ASTM, CORSIA, UK, and ReFuelEU compliance ownership
    - No named owner, testing roadmap, or reporting controls for fuel qualification and end-market certification
    - Treat commercialization timing as non-underwritten despite visible demand.
  notes: These kill criteria are designed to be monitored in diligence and during any post-investment hold period. They convert broad risk labels into observable failure signals.
