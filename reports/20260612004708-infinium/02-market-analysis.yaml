- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver or constraint
  - Direction
  - Timing
  - Mechanism
  - Implication for Infinium
  - Diligence ask
  rows:
  - - ReFuelEU synthetic-fuel floor
    - Driver (+)
    - 2025-2030 ramp
    - Mandates force SAF uptake and create a 1.2% synthetic sub-mandate by 2030
    - Creates premium willingness to pay for compliant eSAF even before full cost parity
    - Map which corridors and counterparties can actually source compliant synthetic gallons by 2030
  - - Airline net-zero roadmaps and CORSIA accounting
    - Driver (+)
    - Current through 2050
    - Airlines need in-sector decarbonization and registries to back claims
    - Supports airline offtake and corporate overlay demand for book-and-claim instruments
    - Test which buyers will pay physical premium versus buy certificates or offsets
  - - Hydrogen Bank and auction support
    - Driver (+)
    - 2025-2026 active
    - Public auctions and market-making tools bridge early project economics
    - Raises odds that derivative projects can close financing before pure commodity parity
    - Track auction access, qualification thresholds, and contractability for U.S.- or EU-linked projects
  - - HEFA feedstock scarcity
    - Driver (+)
    - Current
    - Waste oils and fats remain dominant but constrained current feedstocks
    - Improves long-run opening for non-biomass e-fuels if they can qualify and scale
    - Quantify whether e-fuel cost decline can beat feedstock-constrained HEFA on delivered premium
  - - SAF and e-kerosene cost premium
    - Constraint (-)
    - Current through 2030s
    - SAF remains 2-5x conventional fuel and EU compliance fees can amplify the premium
    - Adoption depends on policy bridge, not commodity parity alone
    - Model customer economics with and without credits, mandates, and compliance value
  - - RFNBO additionality and hourly matching
    - Constraint (-)
    - Tightens in 2030
    - Eligible electricity must be additional and eventually matched hourly with geographic correlation
    - Raises siting, utilization, and financing complexity for PtL plants
    - Stress-test project economics under hourly matching and regional power-price volatility
  - - Hydrogen project, interconnection, and infrastructure bottlenecks
    - Constraint (-)
    - Current
    - Low-emissions hydrogen pipeline is growing but still faces cost and infrastructure delays
    - Molecule supply may lag stated market demand even if offtake interest exists
    - Verify realistic build times for power, electrolyzers, CO2, and transport links
  - - IMO shipping demand for zero/near-zero fuels
    - 'Mixed: driver and competitor'
    - 2028 onward
    - Shipping rules reward low-intensity fuels and can absorb methanol-like molecules
    - Creates adjacency demand but also competition for scarce green inputs
    - Compare aviation premium durability versus marine demand pull by region
  - - Corporate willingness-to-pay depth
    - Open / mixed
    - Current
    - Corporate SAF programs exist but volume transparency is limited
    - Corporate budgets can accelerate early economics, but public evidence is thin on scale
    - Request independent volume and price data for book-and-claim commitments beyond flagship pilots
  notes: Several items act as both tailwind and filter. The same policy that creates demand can also narrow the set of projects that qualify economically.
