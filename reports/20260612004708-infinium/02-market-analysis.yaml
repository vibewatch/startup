  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: policy-vs-physical-supply
    missingEvidence: A region-by-region independent map of eSAF project FIDs, expected start dates, and committed production volumes against 2030 policy quotas.
    whyItMatters: Without it, policy floors can be mistaken for physically financeable 2030 supply and overstate near-term SAM.
    diligencePath: Build a bottom-up project tracker from public FIDs, permitting records, and lender disclosures, then compare it with EU and other mandate trajectories.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: infinium-som-gap
    missingEvidence: Infinium-specific contracted offtake volumes, delivered gallons, and realized pricing by buyer segment.
    whyItMatters: These data are necessary to move from broad market attractiveness to a defensible obtainable-market view and valuation bridge.
    diligencePath: Request executed offtake summaries, delivery history, and netback assumptions under NDA and reconcile them with independent customer announcements.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: corporate-demand-depth
    missingEvidence: Independent volume, price, and renewal data for corporate SAF book-and-claim purchases outside airline marketing examples.
    whyItMatters: Corporate demand can support premium pricing, but public evidence is still too sparse to treat it as a bankable large-scale payer base.
    diligencePath: Interview registry operators, major travel buyers, and airline program managers; request third-party-verified certificate volume and price ranges.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: material
    topic: co2-feedstock-availability
    missingEvidence: Independent regional data on cost and availability of qualifying waste or biogenic CO2 streams near candidate e-fuel projects.
    whyItMatters: Renewable power is not the only gating input; carbon sourcing can determine whether a nominally attractive market is actually buildable.
    diligencePath: Map nearby industrial, biogenic, and DAC-linked CO2 sources by volume, purity, permitting status, and delivered cost for each prospective site.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM004
