- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer / contract holder
  - User
  - Payer
  - Primary workflow
  - Budget owner
  - Adoption trigger
  rows:
  - - Airlines and cargo carriers
    - Airlines, alliance procurement teams, fuel suppliers
    - Aircraft operators
    - Airline fuel budget, occasionally passed through in fares or sustainability surcharges
    - Physical SAF offtake, compliance reporting, net-zero execution
    - CFO, fuel procurement, sustainability leadership
    - Mandates, CORSIA accounting, and net-zero commitments
  - - Corporate SAF programs / book-and-claim
    - Large travel buyers, corporate climate programs, travel managers
    - Not the physical fuel user; corporate traveler footprint is the use case
    - Corporate sustainability or travel budget
    - Buy certificate-backed Scope 3 reductions through airline or registry programs
    - Chief sustainability officer, procurement, travel budget owner
    - Need to reduce business-travel emissions without waiting for route-specific physical supply
  - - Fuel suppliers, airports, and infrastructure intermediaries
    - Fuel suppliers, blending/intermediation partners, airport fuel consortia
    - Aircraft operators and ground-fuel systems
    - Fuel marketing and infrastructure budgets
    - Blend, store, document, and deliver compliant fuel while preserving chain-of-custody claims
    - Head of fuel supply, airport fuel operator, infrastructure owner
    - Need open access, verified documentation, and compatible storage/distribution
  - - Shipping and logistics operators
    - Bunker suppliers, freight operators, cargo owners, niche heavy-fleet buyers
    - Ship operators, selected freight fleets
    - Fuel budget plus compliance or brand budget
    - Use renewable molecules where direct electrification is weak or where green-freight claims matter
    - COO, fleet procurement, sustainability lead
    - IMO fuel-intensity pressure, cargo-owner decarbonization demands, or premium customer contracts
  - - Project developers / import mechanisms
    - Project SPVs, infrastructure funds, hydrogen-import programs, strategic offtakers
    - Developers and downstream blenders
    - Project finance, equity sponsors, public auctions, long-term offtakers
    - Secure power, electrolysis, CO2, certification, and offtake before plant commissioning
    - Project finance lead, development lead, infrastructure investor
    - Access to premium demand channel plus auction, tax-credit, or import-support bridge
  notes: The same molecule can have separate buyer, user, and payer roles. Infinium matters most where those roles can be contractually stitched together before physical fuel volumes are abundant.
