- id: sizing-lenses-policy-floor-and-physical-supply
  title: 'Sizing lenses: policy floor, physical supply, and the eSAF wedge'
  body: 'A credible Infinium market view requires multiple lenses because public sources do not yield one clean TAM/SAM/SOM number. The broadest ceiling comes from IRENA/WTO, which says renewable hydrogen and derivatives could reach up to 14% of final energy use by 2050. A nearer transport lens from IEA is much tighter: renewable transport energy is expected to rise 50% by 2030, but aviation and maritime together account for only 10% of that growth, and hydrogen-based fuels another 10%. The most decision-useful aviation lens is narrower again. IEA''s main case moves SAF from 1 billion litres in 2024 to 9 billion litres in 2030, or only about 2% of total aviation fuel demand; within that, e-kerosene is forecast at just 5% of SAF volumes, implying roughly 0.45 billion litres globally in 2030. That sits far below the policy floor implied by Europe, where ReFuelEU requires 6% SAF by 2030 with a 1.2% synthetic sub-mandate and ramps to 70% SAF with 35% synthetic fuel by 2050. Current physical
    supply is still tiny: EASA put 2024 SAF at 0.53% of jet fuel use, and IATA expects only 0.7% in 2025. For Infinium, that means policy floors describe willingness-to-pay pressure, while IEA supply forecasts better describe near-term deliverable SAM.'
