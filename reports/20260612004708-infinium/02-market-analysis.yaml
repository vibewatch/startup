company:
  name: Infinium
chapter:
  number: 2
  title: Market Analysis
  summary: 'Infinium''s real market is not the whole hydrogen or clean-energy economy but the policy-mediated synthetic liquid-fuels wedge inside aviation first, with shipping and selective logistics uses as adjacencies. Public sources show strong long-run demand pull for SAF and hydrogen derivatives, but also a sharp near-term bottleneck: SAF supplied only 0.53% of jet fuel in 2024, IATA expects 0.7% in 2025, and IEA still sees e-kerosene at only about 5% of 2030 SAF volumes. That makes valuation-sensitive adoption dependent less on abstract TAM and more on whether Infinium can secure policy-compatible renewable power, qualifying CO2, and premium offtake before RFNBO rules and cost gaps compress the market.'
sections:
- id: market-boundary-and-substitute-logic
  title: Market boundary and substitute logic
  body: Infinium should be sized inside the synthetic liquid-fuels market for hard-to-abate transport rather than inside the full hydrogen economy, the full SAF economy, or a generic clean-power TAM. The core included spend is eSAF/e-kerosene, other power-to-liquid e-fuels, associated book-and-claim or certificate value where allowed, and the project-development spend required to turn renewable electricity, hydrogen, and captured carbon into compliant molecules. That is narrower than the broad SAF market because most current SAF is still made through HEFA and other bio-based pathways, and it is much narrower than the total renewable-hydrogen market because many hydrogen uses never become drop-in transport liquids. Status-quo substitutes are conventional jet fuel, HEFA SAF, alcohol-to-jet and Fischer-Tropsch biofuels, and in some freight use cases direct electrification or renewable diesel. Shipping and heavy logistics matter as adjacencies because they can use similar green molecules or
    captured-carbon pathways, but road transport remains a secondary wedge in the near term because IEA still expects transport renewable growth to be led mainly by electricity and biofuels rather than hydrogen-based liquids through 2030.
