callouts:
- calloutType: insight
  title: The best near-term market lens is policy-qualified scarcity
  body: Infinium benefits from strong long-run narrative demand, but the investable question is whether scarce compliant eSAF supply can reach premium buyers before qualification rules and cost gaps narrow the field.
  claimRefs:
  - CM009
