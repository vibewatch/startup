- id: TM002
  title: TAM / SAM / SOM or sizing lens table
  columns:
  - Publisher / source
  - Year
  - Geography
  - Value / quantity
  - Lens
  - Confidence
  - Limitation
  rows:
  - - IRENA / WTO
    - '2024'
    - Global
    - Renewable hydrogen and derivatives up to 14% of final energy use by 2050
    - Long-run decarbonization ceiling
    - Medium
    - 2050 systems view, not a near-term traded eSAF market
  - - IEA Renewables 2025
    - '2025'
    - Global transport
    - Renewable transport energy use +50% to 2030; aviation and maritime make up 10% of growth
    - Macro growth lens
    - High
    - Covers all transport renewables, not just PtL liquids
  - - EASA SAF Market
    - 2025 (2024 data)
    - Global aviation
    - SAF represented 0.53% of jet fuel use in 2024
    - Current physical-supply lens
    - High
    - Current-state share, not future demand
  - - IATA policy update
    - '2025'
    - Global aviation
    - 2 million tonnes / 2.5 billion litres / 0.7% of airline fuel in 2025
    - Near-term supply lens
    - High
    - Industry estimate and still far below policy goals
  - - IEA Renewables 2025
    - '2025'
    - Global aviation
    - 9 billion litres of SAF in 2030, meeting 2% of total aviation fuel demand
    - 2030 base-case SAF lens
    - High
    - Forecast, not mandated floor
  - - Analyst derivation from IEA Renewables 2025
    - '2026'
    - Global aviation
    - ~0.45 billion litres e-kerosene in 2030 (5% of 9 billion litres SAF)
    - 2030 eSAF wedge lens
    - Medium
    - Derived from IEA share assumption rather than direct market print
  - - ReFuelEU Aviation / MTJ outlook
    - 2023 / 2026
    - European Union
    - 2030 minimum 6% SAF including 1.2% synthetic aviation fuel
    - EU policy floor
    - High
    - Regulatory floor, not proof of physical supply
  - - ReFuelEU Aviation / MTJ outlook
    - 2023 / 2026
    - European Union
    - 2050 minimum 70% SAF including 35% synthetic aviation fuel
    - Long-run EU policy floor
    - High
    - 2050 mandate does not solve current economics
  - - U.S. SAF Grand Challenge
    - 2022 / 2026
    - United States
    - 3 billion gallons annual SAF production objective by 2030
    - U.S. supply-policy lens
    - High
    - Government objective, not achieved market volume
  - - U.S. SAF Grand Challenge
    - 2022 / 2026
    - United States
    - 35 billion gallons annual SAF production objective by 2050
    - Long-run U.S. supply-policy lens
    - High
    - Objective assumes barriers on cost, feedstock, and scale are solved
  - - IEA Aviation
    - '2026'
    - Global aviation
    - Existing and planned SAF projects in advanced stages meet only 2-4% of jet fuel demand by 2030
    - Pipeline-constrained supply lens
    - Medium
    - Project readiness and regional coverage can change quickly
  - - Analyst synthesis
    - '2026'
    - Infinium-specific
    - Public SOM not isolated in reviewed independent sources
    - Evidence-constrained SOM lens
    - Medium
    - Independent sources do not disclose Infinium contract volume, delivered gallons, or realized pricing
  notes: The table intentionally mixes policy floors, observed current supply, modeled forecasts, and public-evidence limits. Those lenses answer different questions and should not be blended into one point TAM.
