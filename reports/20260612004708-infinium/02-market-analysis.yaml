tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Infinium
  rows:
  - - Synthetic aviation fuel (eSAF / e-kerosene)
    - Drop-in synthetic jet fuel molecules, SAF certificates, book-and-claim value, long-term airline offtake
    - Conventional Jet A, most non-certified low-carbon liquids, general airline ticket revenue
    - Airlines, fuel suppliers, airports, corporate scope-3 buyers
    - Core near-term market because aviation has the clearest premium and policy pull for PtL molecules
  - - Broader SAF market
    - All ASTM- and CORSIA-eligible sustainable aviation fuels sold into aviation
    - Most non-aviation biofuels and all ground-transport fuels
    - Airlines and aviation fuel suppliers
    - Important context, but broader than Infinium because HEFA and other bio pathways still dominate current volumes
  - - Renewable marine fuels adjacency
    - E-methanol and other low-emission liquid fuels, compliance value, bunker premia
    - Conventional bunker fuel and most vessel capex
    - Ship operators, bunker suppliers, cargo owners
    - Relevant adjacency because shipping can absorb similar green molecules and supports methanol-led infrastructure
  - - Selective heavy-road / logistics adjacency
    - Premium low-carbon fuel purchases for hard-to-electrify fleet niches
    - Mass-market EV charging, conventional diesel retail, generic fleet telematics
    - Freight operators, fuel distributors, brand-led logistics programs
    - Useful optionality, but not the cleanest primary wedge because road decarbonization is still led by electricity and biofuels to 2030
  - - Renewable-hydrogen and RFNBO input stack
    - Eligible renewable electricity, electrolysis, captured CO2, certification, compliance services
    - Generic grid power, unconstrained fossil hydrogen, non-qualifying carbon inputs
    - Project developers, importers, infrastructure financiers
    - Critical supply-side spend because Infinium must buy or secure these inputs before end-market demand can be monetized
  - - Excluded broad climate TAMs
    - None beyond directly monetizable e-fuel molecules and qualifying attributes
    - Broad hydrogen TAM, clean-power TAM, generic decarbonization capex, most carbon-management TAM
    - Not directly relevant
    - Necessary exclusion to avoid overstating market size with non-liquid-fuel categories
  notes: 'Boundary is intentionally narrow: it captures monetizable synthetic liquid-fuel demand and the qualifying input stack, not the full hydrogen, electricity, or general decarbonization economy.'
