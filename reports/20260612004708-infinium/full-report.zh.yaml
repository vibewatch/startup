  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 方向
      - 什么会改变观点
    rows:
      - - Brookfield、Breakthrough、HSBC、American 和 IAG 放在一起，让 Infinium 更像能融资的项目，而不是投机故事。
        - 投资逻辑
        - 若启动失败、债务条款偏弱或承购质量消失，项目就会退化成赞助方作秀，而不是真实资产融资。
      - - Atlas 表明，Roadrunner 之外，这个平台也能赢下可融资的下一项目需求。
        - 投资逻辑
        - 只有 2026 年入选转成有约束力协议，且交易对手深度和资金路径可见，投资逻辑才会加强。
      - - 公开可比公司显示，市场愿意为可再生燃料平台付钱，但不会给软件式倍数。
        - 投资逻辑
        - 如果公开燃料平台倍数下修，或项目利润率令人失望，今天隐藏的私人估值可能过高。
      - - 当前估值、轮次规模和合同经济性仍是私有信息。
        - 反向逻辑
        - 任何披露的融资轮、老股价格或股权结构包，都会立刻提升承销精度。
      - - 这个行业仍有重要失败先例，也依赖政策。
        - 反向逻辑
        - Roadrunner 干净爬坡，并且单位经济性可见，才会降低 Fulcrum 式下行情景类比的权重。
      - - 里程碑制资本在完全赚到之前，看起来也可能很大。
        - 反向逻辑
        - 看到 Brookfield 指标闸门清除、后续资本实际投出，才会显著提高信心。
    notes: 这些论点围绕新投资者必须如何相信价格支撑，而不是围绕 Infinium 是否是一家值得敬佩的气候科技公司。
