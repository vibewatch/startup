      - number: '3.4'
        title: 护城河耐久度、多归属与反向竞争证据
        blocks:
          - type: paragraph
            body: >-
              Infinium 的护城河更像商业护城河，而不是科学护城河。耐久部分包括早期交付验证、多产品输出、具名航空需求，以及第二座工厂的项目融资可信度。这些有价值，但没有一项牢不可破：HEFA
              供应商仍掌握短期信任和实物供给，HIF 已具备对出口可信度重要的 RFNBO 认证，LanzaJet 有运行中的非 HEFA 运营模板，Twelve 展示了另一条融资充足的 PtL
              路线及其自有航空生态。因此，多归属风险真实存在。航空公司和企业买家可以从不同供应商购买环境属性和实物分子，也可在等待 PtL 路线兑现成本曲线期间，用现有 HEFA 满足近期强制要求。Fulcrum
              是整个类别最重要的反向数据点，因为它证明 FOAK 路径集成、EPC 选择和可靠性失败，会在规模经济到来前摧毁融资。实际推论是，Infinium 只有在 Roadrunner 把合同和融资势能更快转化为稳定的
              2027 年运营，领先于分销更强或认证更多的替代品筑牢阵地时，才会赢。
