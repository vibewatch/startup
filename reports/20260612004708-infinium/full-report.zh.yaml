      - number: '5.2'
        title: power-to-liquid 架构如何拼在一起
        blocks:
          - type: paragraph
            body: >-
              尽管 Infinium 没有发布完整工艺流程图，公开工艺架构仍然连贯。Roadrunner 披露的链条从可再生电力和水开始，通过 Electric Hydrogen 的 100 MW HYPRPlant
              把电力转成氢气，再把氢气与捕集或废弃 CO2 结合，随后通过公司的合成和升级堆栈把所得气流转成可直接替代的碳氢燃料。流程中段最强证据来自 Electric Hydrogen 和 Greyrock
              收购：Electric Hydrogen 记录了电解槽工厂、异地模块化和 skid 级测试；Greyrock 与专利记录显示，Infinium 围绕气体转化、催化剂和 power-to-X 控制 know-how
              搭建能力，而不只是混配大宗燃料。实际来看，Infinium 的产品就是让这些组件在项目规模上协同工作的集成架构。
