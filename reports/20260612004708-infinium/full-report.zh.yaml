      - number: '7.3'
        title: 执行风险集中在公用事业、设备和工业爬坡能否同步
        blocks:
          - type: paragraph
            body: >-
              从运营看，Roadrunner 比很多气候科技同行更成熟，因为多个关键模块已经点名。项目在 FID 后开工，拿到 150 MW 风电协议，Electric Hydrogen 已被选为 100 MW
              电解槽供应商，场址也落在棕地气转液足迹上，而不是一张白纸。这些都是真正的缓释因素。但更重要的剩余风险没有消失：每一个缓释因素都必须同步到位。TCEQ 文件称，场址在 2024
              年初尚未接入电网。公开来源仍未点名长期 CO2 交易对手。Electric Hydrogen
              谈到更低装机成本，但那是供应商主张，不是投产保证。棕地叙事减少了一部分选址摩擦，却提高了旧设施、新公用事业基础设施、氢系统和燃料质量要求之间的集成复杂度。


              这也是 2026 到 2027 年时间点变得关键的地方。IAG 提到 2026 年末交付，而 Infinium 和 Electric Hydrogen 把商业运营框在 2027
              年。这不能证明合同义务已经滑坡，但说明面向市场的里程碑和面向工厂的里程碑并不相同。再叠加 West Texas
              劳动力和高温暴露，务实的执行判断很清楚：项目仍可能成功，但概率最高的下行情形不是客户消失，而是电力、氢气、CO2、安全和运营准备的调试延迟、不均衡，或成本更高。
