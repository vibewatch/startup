  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Infinium 已经跨过一个门槛：估值值得严肃讨论，而不是继续停留在二元技术怀疑。Brookfield 公布的承诺、Breakthrough 更早的项目股权、HSBC 项目债务，以及 American 和
              IAG 承购，合在一起说明 Roadrunner
              正被当作工业资产融资，而不是风险科学项目。这一点重要，因为公开记录现在支撑了一个真实商业化叙事，且交易对手有能力打开非稀释或准基础设施资本。问题是，这些信号没有一个披露新股的实际入场价。因此，公开证据只能支撑一个对价格敏感的流程判断：保持跟踪，把公司视为可融资，但在估值标记未披露时拒绝喊买。实操上，这意味着观察，而不是买入或回避，直到管理层披露定价轮、老股交易打印，或足够的合同和债务细节，能够检验隐含价值究竟由
              Roadrunner 经济性赚来，还是只来自发起方光环。
