      - number: '6.4'
        title: 扩张潜力、集中风险与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              上行情景是，Infinium 可同时在三条渠道复利：更多航空集团需要实物 eSAF，更多企业买家为 book-and-claim SAF 证书付费，更多非航空客户使用 eDiesel 或
              eNaphtha。公开证据已显示 American 内部的 land-and-expand 逻辑、IAG
              内部跨航空公司的可选性，以及从物流进入化工的邻近扩张。风险情景是，这个市场的获客和留存异常依赖政策设计、可追溯性基础设施，以及先进燃料的成本溢价。IATA、ADI、Acumen 和 ICCT
              都指向同一组摩擦：供给有限、相对化石航空燃料成本高、book-and-claim 系统中的登记和重复计算风险，以及在承购、原料和融资之间精细设计合同的需求。集中风险同样重要。Argus 称，仅 IAG 就可能覆盖
              Roadrunner 预期年产出的约三分之一，而 American 量未披露。这意味着蓝筹名称降低了可信度风险，但不能消除对少数锚定关系或政策支持支付意愿的依赖。
