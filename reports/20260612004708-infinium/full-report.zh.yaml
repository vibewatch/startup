      - number: '6.3'
        title: 耐久度、留存与客户背书质量
        blocks:
          - type: paragraph
            body: >-
              耐久度是公开记录变薄的地方。American 和 IAG 看起来更耐久，因为它们的需求具有战略性、监管性和多年期属性；American 现在出现在两条与 Infinium 相关的航空路径中：在
              Roadrunner 中作为锚定承购方，在 Atlas 中作为 SABA 支持证书需求的实物用户。IAG 的五家航空公司结构也在单一合同内部嵌入扩张可选性。相比之下，Amazon 和 Borealis
              是真实使用验证，但对持续性的证明较弱。Amazon 披露里程、地理范围和战略契合度，而非续约条款或燃料支出。Borealis
              确认商业发货和使用，而非复购节奏或年度合同价值。没有公开来源找到净收入留存、总留存、流失、续约率或客户满意度队列。实际排序因此很清晰：American 和 IAG 是最高质量背书，Amazon 和
              Borealis 是中等质量运营验证，Atlas 是高质量需求验证但仍处于投产前。公开验证足以确认类别适配，不足以承保队列耐久度。
