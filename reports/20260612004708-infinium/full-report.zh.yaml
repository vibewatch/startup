      - number: '2.4'
        title: 驱动因素、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动来自监管和核算，而不是单纯的大宗商品逻辑。ICAO 的 LTAG、CORSIA 核算、ReFuelEU、美国 SAF Grand Challenge、欧盟氢气拍卖和 Hydrogen
              Mechanism，都让买家在电燃料达到化石燃料平价前就有理由支付溢价。与此同时，约束具体且严厉。IATA 手册称 SAF 成本可达传统航空燃料的 2-5x；IATA 在 2025 年中警告，欧洲强制要求合规已把
              SAF 推到约为传统航空燃料五倍的成本。ICCT 的 e-kerosene 研究更严苛：美国和欧盟合成航空燃料成本会随时间显著下降，但即便在支持性假设下，2050
              年前也无法达到化石燃料平价。上游认证规则进一步收紧瓶颈。欧盟 RFNBO 方法要求新增可再生电力、到 end-2029 前按月时间匹配、从 2030
              年起按小时匹配，并要求与电解槽或合格竞价区具备地理相关性。同时，IEA 仍认为超过 200 个已承诺氢项目面临成本、基础设施和监管不确定性；随着 IMO 框架收紧，航运政策也可能抢走稀缺绿色分子。对
              Infinium 而言，市场问题不是减碳叙事是否存在，而是执行能否跑赢这些基础设施和政策摩擦约束。
