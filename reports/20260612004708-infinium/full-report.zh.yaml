          actor: 航空公司、企业差旅买方、物流运营商、化工生产商
          description: 客户起点是难以减排的燃料或原料问题，而不是软件式试用。
          channels:
            - 政策强制要求
            - 气候目标
            - 采购团队
        - id: contract
          label: 设计合同结构
          actor: 客户、Infinium、融资方、登记簿合作伙伴
          description: 交易会被设计成承购、原料供应或账簿申领式证书，且通常需要内嵌融资逻辑。
          channels:
            - 承购谈判
            - 项目融资
            - 登记簿设计
        - id: deploy
          label: 部署分子或证书
          actor: 实物使用方或企业付款方
          description: American 和 IAG 等待 Roadrunner 交付，Amazon 在车队运营中使用燃料，Borealis 将 eNaphtha 投入 Porvoo，SABA 买方则为证书出资。
          channels:
            - 工厂产出
            - 物流
            - 账簿申领
        - id: verify
          label: 验证减排声明
          actor: 可持续、财务、审计团队
          description: 客户需要可追溯性、碳核算，以及声明具备排他性和可信度的证明。
          channels:
            - ISCC PLUS
            - CORSIA 逻辑
            - 登记簿 / 审计
        - id: expand
          label: 扩张或重新签约
          actor: 锚定账户加相邻业务单元
          description: 扩张取决于已交付可靠性、政策支持，以及早期交易对手是否需要更多量或更宽用例。
          channels:
            - 重复订单
            - 第二个项目
            - 集团范围推广
