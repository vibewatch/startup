          label: 锚定航空公司
          description: American 和 IAG 证明蓝筹航司愿意签早期合同。
        - id: corporates
          label: 企业证书买方
          description: Atlas 为商务差旅和航空货运排放打开付款方层。
        - id: adjacent
          label: 相邻非航空用户
          description: Amazon 和 Borealis 展示了卡车运输和化工相邻场景。
        - id: friction
          label: 采购摩擦
          description: 高成本、供应稀缺和账簿申领治理都会拖慢成交。
        - id: expansion
          label: 规模化重复需求
          description: 只有交付、核算和经济性同时守住，规模化重复需求才会出现。
      edges:
