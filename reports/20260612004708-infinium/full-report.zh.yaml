      - number: '8.2'
        title: 公开和私有可比公司语境
        blocks:
          - type: paragraph
            body: >-
              可比集给出的是边界，不是干净答案。公开市场一侧，按 2026 年 6 月市场数据，Gevo、Aemetis、Darling Ingredients 和 Neste 的市值 / 收入倍数大约在 0.7x 到
              2.9x，但这些都是披露充分的上市公司，要么是成熟生物燃料龙头，要么是承压的转型故事。它们适合用来校验公开市场现在愿意为燃料平台收入支付多低价格，不适合直接套到一个未披露收入的项目平台私有估值上。私有市场一侧更相关，但样本更薄。LanzaJet
              2026 年 2 月融资为一家拥有商业工厂和收费加工结构的 SAF 公司定出 $650 million 投前估值；Twelve 披露了很大的资本栈，但没有公布估值。这些数据点说明，严肃的 e-fuels
              公司可以吸引规模资本，但公开证据仍未显示 Infinium 自身在这个走廊里落在哪个价格。这个缺口决定了可比分析应服务入场纪律，而不是替代入场纪律。
