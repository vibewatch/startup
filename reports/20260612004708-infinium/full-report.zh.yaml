        blocks:
          - type: paragraph
            body: >-
              Infinium 的融资故事更像对具体 eFuel 项目分阶段降风险，而不是简单的风投轮次阶梯。Amazon 先通过 Climate Pledge Fund
              支持公司，随后把关系转化为卡车燃料用例。Breakthrough Energy Catalyst、American Airlines 和 Citi 接着围绕 Roadrunner 搭出 2023 年 11
              月的项目股权加承购结构。Brookfield 2024 年 9 月合作带来了已披露最大资本堆栈：立即为 Infinium 和 Roadrunner 提供超过 $200 million，并为未来项目提供最高另一个
              $850 million，同时领投 Series C 优先股发行。2025 年 1 月 Series C 首次交割把 DBJ、JOGMEC、Mitsubishi Corporation、Japan
              Hydrogen Fund、RockCreek 和其他投资者纳入财团，并与 Greyrock 收购同步发生。未解决的承保点是，公开来源仍未足够清楚地披露 Series C
              规模或估值，无法计算标准化累计股权融资额。
