  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 具名客户披露合同期限或运营使用的地方，公开证明最强；叙事依赖未来生产或未披露数量的地方，证明最弱。
    data:
      columns:
        - 生产成熟度
        - 结果具体性
        - 留存可见度
        - 参考新鲜度
      rows:
        - label: American Airlines
          values:
            - 交付前，融资已支撑
            - 长期承购和第二个 Atlas 角色都很明确
            - 低——无公开续约或量曲线
            - 高——当前客户页加 2026 年 Atlas 证明
        - label: IAG
          values:
            - 交付前
            - 10 年期限、五家航空公司和 2026 年末启动都很明确
            - 低——无公开年度提取量或续约机制
            - 中——2024 年披露较强，但之后无履约更新
        - label: Amazon
          values:
            - 运营使用案例
            - 5 million 卡车英里和南加州车队使用都很明确
            - 低——无公开延长期限或支出数据
            - 中——证明早于当前航空披露
        - label: Borealis
          values:
            - 运营出货 / 工厂使用
            - 首次商业出货和 Porvoo 使用都很明确
            - 低——重复节奏未披露
            - 中——2024 年证明，无公开重复订单更新
        - label: Atlas / SABA 买方
          values:
            - FID 前 / 生产前
            - 100,000 MTPA 计划和 American 实物使用方角色都很明确
            - 低——企业买方名单仍未披露
            - 高——2026 年 4 月获授
