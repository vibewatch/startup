      - number: '3.3'
        title: GTM、信任姿态、供给获取与切换成本
        blocks:
          - type: paragraph
            body: >-
              这个市场的分销能力来自谁能锁定原料、融资和合规交付，而不只是化学方案幻灯片谁最好。Infinium 的 GTM 验证由合作伙伴驱动：American 和 IAG 锚定航空承购，Brookfield 和
              Breakthrough 锚定融资，Mitsubishi / JOGMEC 延伸日本供应链选项，公司还列出 Amazon 和 Borealis 等航空以外客户。LanzaJet 同样通过代工和保证承购降低 GTM
              风险；HIF 借助 Porsche 和 Shell 把产品变成可见用例和出口。SkyNRG 在分销广度上最强，因为它已通过采购和 book-and-claim 项目服务 60 多家航空公司和 100
              多家企业，再在其上叠加自有生产。World Energy 受益于可直接替代属性，并已通过现有物流移动燃料。买家一旦签下 SAF
              量、登记排放主张、对齐合规来源并整合交付物流，这些伙伴网络会形成中等切换成本。但在那之前，如果 e-fuels 在价格或时间上滑期，买家可以跨路径多归属，或退回现有 HEFA 量。
