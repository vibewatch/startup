      - number: '3.2'
        title: 规模、路径与商业化进展
        blocks:
          - type: paragraph
            body: >-
              Infinium 的公开位置强于最早期电燃料追赶者，但弱于商业化在位者。Pathfinder 给了 Infinium 一个真实商业化标记：在多数 power-to-liquid
              竞争对手开出第一座运营工厂前，它已经交付商业 eFuel 量；Roadrunner 又加上了第二个具备融资条件的站点，并有具名航空公司承购。LanzaJet 是非 HEFA SAF 上最接近的执行标杆，因为
              Freedom Pines 已有全厂运营、明确的 10-million-gallon 规模模板，以及由战略买家和能源伙伴领投的 2026 年股权轮。Twelve 初始量小于
              Roadrunner，但融资堆栈庞大；截至 2026 年 6 月，它已开出美国商业 E-Jet 工厂，并有航空公司支持的需求信号。HIF Global 当前年 litres 商业规模小于 Infinium，但通过
              Haru Oni 在认证和出口可信度上更强。SkyNRG 和 World Energy 技术上没那么新，但很重要，因为买家常更偏好运营中的 HEFA 供给和认证分销渠道，而不是更新路径。Velocys 和
              Prometheus 扩大了潜在合成燃料路径的范围，但两者仍需要比 Infinium 当前所展示更多的可融资运营验证。
