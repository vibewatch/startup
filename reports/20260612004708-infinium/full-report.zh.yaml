      - number: '4.2'
        title: 成本结构、运营驱动因素与规模化经济性
        blocks:
          - type: paragraph
            body: >-
              Roadrunner 的单位经济性由工业投入和项目结构主导，不是 app 式增量利润率。披露的工厂设计需要捕集 CO2、150 MW 可再生电力供给、100 MW 电解槽、合成硬件，以及一条把
              brownfield gas-to-liquids 站点改造成首创一体化 eFuels 资产的调试路径。相对 greenfield
              建设，这应能减少部分选址和许可摩擦，但不能消除氢气、电力和合成层面的执行风险。成本方面最佳公开证据来自行业研究，而不是 Infinium 自身：ICCT 仍认为，即便在有利假设下，美国 e-kerosene
              经济性也远高于化石航空燃料；其 2025–2026 年研究认为，先进 SAF 工厂仍资本密集且依赖政策。


              这组背景对 Infinium
              很重要，因为公司披露了客户名称和实物投入，但没有披露实现价格、毛利率或利用率门槛。如果电力成本上升、税收抵免捕获不及预期，或债务服务吃掉合同价格与生产成本之间的价差，工厂可以看起来商业可信，却仍财务脆弱。因此，公开记录支持一个利润率路径假设——投入、政策和债务共同决定结果——但不支持闭式利润模型。
