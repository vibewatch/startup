            body: >-
              Infinium 的公开信任与合规故事在框架层面强于单厂指标层面。类别层面的支撑扎实：ICAO、IATA、ReFuelEU、DOE、Treasury、TCEQ 和 EPA
              都显示，低碳航空燃料在商业规模化前必须通过可持续性标准、认证和核算要求、许可步骤以及燃料登记流程。公司特定证据也存在，但更窄。TCEQ 文件记录 Pecos permit-by-rule 路径，并点名
              Roadrunner 备案中的高级首席化学工程师；Electric Hydrogen 披露电解槽套件的 stack 测试、水压测试和发运质量步骤；Infinium 自己的 45V
              意见信则明确说明，时间匹配和额外性等氢气核算细节具有经济实质。仍缺失的是承保最关心的运营细节：单厂 QA 证书、ASTM 路径披露，以及 Pathfinder 持续产品规格表现数据。
