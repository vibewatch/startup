  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、客户合同与商业化质量
        blocks:
          - type: paragraph
            body: >-
              Infinium 的公开收入模式在产品层面很直接，但在合同层面仍不透明。Project Roadrunner 正在建设，用于销售三种可直接替代燃料——eSAF、eDiesel 和
              eNaphtha——其中航空是披露最清晰的商业化路径。American Airlines 签署了从 2026 年开始的确定承购；IAG 签署 10 年 e-SAF
              协议，管理层和客户都把它描述为可融资需求，而非投机意向。Argus 估计，仅 IAG 就约占年产出的三分之一，这是最强的单条公开线索，说明 Roadrunner
              进入运营时可能具备有意义的基础利用率，而不是纯商户风险敞口。Amazon 的卡车交易给 Infinium 增加了航空以外的验证点，但披露规模相对于 Roadrunner 的航空故事很小。


              缺失的是这些合同的资金面。保留的公开来源没有披露价格、take-or-pay
              承诺、取消保护，或除具名客户外多少产出已被完全锁定。因此，收入质量在形式上看起来有前景——蓝筹交易对手、长期合同、与政策强制要求挂钩的出口需求——但实质上仍无法承保。正确的公开市场结论是，需求可信度真实存在，但变现精度仍是私有信息。
