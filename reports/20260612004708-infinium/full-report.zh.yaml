      - number: '7.4'
        title: 融资质量真实，但合作伙伴和客户集中仍是核心剩余暴露
        blocks:
          - type: paragraph
            body: >-
              Roadrunner 的融资栈优于典型的收入前气候科技资产。American 的承购被表述为 Breakthrough Energy Catalyst $75 million
              项目股权承诺的关键使能条件；Brookfield 披露向 Infinium 和 Roadrunner 投入超过 $200 million，另有更大的、按指标解锁的增长额度；HSBC
              则作为唯一贷款人和代理行进入项目制信贷安排。这个组合告诉投资人，成熟交易对手认为项目具备可融资性。但它没有告诉投资人完整
              capex、债务规模、契约条款、应急预算，也没有说明投产时间或技术表现偏离计划时会发生什么。公开证据还显示，启动期需求集中度仍窄：点名的两家航空集团是 American 和 IAG，HSBC
              讨论债务时也明确引用了这些承购。


              这种集中有两面性。同一批为 Roadrunner 去风险的交易对手，也把其近端商业和融资依赖集中起来。Brookfield 的额外资本不是覆盖任何超支的无条件空白支票。IAG
              自身也表示还需要更多政策支持。公开来源仍未披露定价、终止权或 CO2
              供应细节。正确的投资结论是：发起方质量和承购质量降低了二元失败风险，但无法排除一个合作伙伴延迟、一个合同条款弱于预期，或一个融资缺口直接传导到进度、利润率或估值下行。
