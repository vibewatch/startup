      - number: '2.5'
        title: 矛盾与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              两个矛盾最重要。第一，政策配额暗示近期 eSAF 市场远大于当前项目管线似乎能供应的规模：欧洲合成燃料强制要求快速爬坡，但 IEA 仍下调了 e-fuel 预期，因为没有 EU e-kerosene
              项目作出最终投资决策以满足 2030 年目标。第二，买家兴趣明确，但公开支付意愿在航空公司项目和政策合规上记录更充分，在大规模、经常性企业 book-and-claim 需求上证据弱得多。公开证据也没有隔离出
              Infinium 在可服务市场中的自有可获取份额：已审阅的独立来源测算了 SAF、e-kerosene、氢衍生物和采用机制，但没有披露 Infinium 的签约量、已交付 gallons
              或按细分市场实现的价格。最后，废弃或生物源 CO2 可得性仍是关键盲点。RFNBO 和 PtL 经济性常被讲得像可再生电力是唯一闸门；实际操作中，合规碳、并网时间和选址摩擦仍可决定名义市场机会能否变成可融资供给。
