          detail: 注册、认证、可追溯性与税收抵免兑现
          tone: warning
        - id: startup
          label: 2027 年投产执行
          detail: 调试、并网与一体化爬坡
          tone: risk
        - id: inputs
          label: 电力 / H2 / CO2 投入
          detail: 核心工业投入必须按规格、按时到位
