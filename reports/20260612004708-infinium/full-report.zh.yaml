  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Infinium 今天销售什么
        blocks:
          - type: paragraph
            body: >-
              Infinium 的公开产品故事在燃料上远比软件或数字服务具体。官网现在介绍两个平台——Infinium Energy 和 Infinium Edge——但本次保留证据堆栈压倒性地记录了 Energy
              侧：运行中的 eFuels 生产、具名实物项目、具名承购客户，以及 eSAF、eDiesel、eNaphtha 等具体产品分子。Pathfinder 的意义在于，它把公司从演示文稿里的路径变成 Corpus
              Christi 拥有运营资产的生产商。Roadrunner 随后把这一投资逻辑延伸到 Pecos 更大规模建设，目标是航空燃料和邻近低碳产品；Project Atlas
              又增加了由证书牵引的商业化路径。净结论是，Infinium 销售的是脱碳碳氢分子和项目交付能力，不只是工艺许可或气候叙事。
