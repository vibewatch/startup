      - number: '4.4'
        title: 财务结论与剩余尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              公开记录支持建设性但尚未承保的财务判断。Infinium 有真实承购客户、具名项目融资参与方，以及足够技术披露来说明 Roadrunner 是具体工业项目，而不是概念演示文稿。这让公司比许多 SAF
              同行更具商业化可信度，尤其在 Reuters 记录的行业背景下：已宣布项目与真正达到商业量的项目之间存在巨大差距。最佳解读是，Infinium 已从初创叙事跨过门槛，进入可融资资产开发阶段。


              阻塞点在于，公开牵引力不等于公开财务验证。收入实现、价格底线、债务条款、税收抵免假设、毛利率、营运资本和现金跑道仍未公开。Brookfield 的承诺结构也重要：只有首笔 $200 million-plus
              明确直接投向 Infinium 和
              Roadrunner，更大的数字仍是或有的未来项目资本。因此，我基于公开证据的判断是，收入质量可能较高，利润率路径仍对政策和投入敏感，主要尽调优先级应是合同经济性和完整项目资金来源与用途测算，而不是继续做市场需求发现。
