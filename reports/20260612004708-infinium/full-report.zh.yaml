  - id: TM004
    title: 增长驱动因素和约束表
    columns:
      - 驱动因素或约束
      - 方向
      - 时间
      - 机制
      - 对 Infinium 的含义
      - 尽调问题
    rows:
      - - ReFuelEU 合成燃料底线
        - 驱动因素（+）
        - 2025-2030 年爬坡
        - 强制要求推动 SAF 使用，并在 2030 年前设定 1.2% 的合成燃料子要求
        - 即使尚未完全实现成本平价，也会为合规 eSAF 创造溢价支付意愿
        - 梳理到 2030 年哪些航线和交易对手真正能采购到合规合成燃料加仑数
      - - 航空公司净零路线图和 CORSIA 核算
        - 驱动因素（+）
        - 当前至 2050 年
        - 航空公司需要行业内脱碳，并用登记系统支撑声明
        - 支撑航司承购，也带动企业对 book-and-claim 工具的叠加需求
        - 测试哪些买方愿意支付实物溢价，而不是购买证书或抵消
      - - Hydrogen Bank 和拍卖支持
        - 驱动因素（+）
        - 2025-2026 年活跃
        - 公开拍卖和做市工具为早期项目经济性架桥
        - 提高衍生项目在纯商品平价前完成融资的概率
        - 跟踪美国或欧盟挂钩项目的拍卖准入、资格门槛和合同可签性
      - - HEFA 原料稀缺
        - 驱动因素（+）
        - 当前
        - 废油和脂肪仍是主流但受限的当前原料
        - 如果非生物质 e-fuels 能够合规并放量，长期窗口会扩大
        - 量化 e-fuel 成本下降能否在交付溢价上跑赢受原料约束的 HEFA
      - - SAF 和 e-kerosene 成本溢价
        - 约束（-）
        - 当前至 2030 年代
        - SAF 仍是传统燃料的 2-5x，欧盟合规费用还可能放大溢价
        - 采用取决于政策桥梁，不只是商品平价
        - 在有无抵免、强制要求和合规价值的情景下建模客户经济性
      - - RFNBO 额外性和小时级匹配
        - 约束（-）
        - 2030 年收紧
        - 合格电力必须具备额外性，并最终按小时匹配且满足地理相关性
        - 提高 PtL 工厂的选址、利用率和融资复杂度
        - 在小时级匹配和区域电价波动下压力测试项目经济性
      - - 氢项目、并网和基础设施瓶颈
        - 约束（-）
        - 当前
        - 低排放氢管线在增长，但仍面临成本和基础设施延误
        - 即便存在承购兴趣，分子供给也可能落后于宣称的市场需求
        - 核实电力、电解槽、CO2 和运输连接的现实建设周期
      - - IMO 航运对零 / 近零燃料的需求
        - 混合：驱动因素和竞争者
        - 2028 年以后
        - 航运规则奖励低强度燃料，并能吸收类似甲醇的分子
        - 创造相邻需求，但也会争夺稀缺绿色投入
        - 按区域比较航空溢价韧性与海运需求拉动
      - - 企业支付意愿深度
        - 开放 / 混合
        - 当前
        - 企业 SAF 项目存在，但交易量透明度有限
        - 企业预算可以加速早期经济性，但公开证据对规模支撑偏薄
        - 要求提供旗舰试点以外 book-and-claim 承诺的独立交易量和价格数据
    notes: 多个因素既是顺风，也会筛选项目。同一项政策既能创造需求，也会收窄经济上合格的项目集合。
