  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 主要下行情景从合规和投产问题开始，继续传导到产量下降、交付延后、抵免兑现变弱，最终挤压融资空间。
    approximationNotes: 本图为定性分析。它根据保留证据梳理传导逻辑，并非量化现金流模型。
    data:
      nodes:
        - id: policy
