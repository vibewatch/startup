          Pathfinder 已发运商业量；Roadrunner 目标为 23,000 tpy / 7.6M gpy eSAF；Brookfield 投入 >$200M，并可能追加最高 $850M，Breakthrough 投入
          $75M
        - 航空公司、化学品、难电气化交通；已点名航空客户包括 American 和 IAG
        - 合作伙伴主导的承购加项目融资组合；更广客户集中还提到 Amazon 和 Borealis
        - 已发运商业产品，第二个项目已融资，但旗舰增长工厂仍未投运
        - Roadrunner 未能可靠规模化运行前，执行和爬坡风险仍高
      - - LanzaJet
        - Alcohol-to-jet（乙醇制 SAF / 可再生柴油）
        - Freedom Pines 最高 10M gpy；2025 年全面运营；2026 年股权融资完成首关，投前估值 $650M
        - 航空公司、燃料买方、乙醇 / 原料生态
