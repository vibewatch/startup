  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与许可堆栈方向上积极，但尚未完全承保
        blocks:
          - type: paragraph
            body: >-
              公开可见的许可记录有建设性，但还不完整。TCEQ 的 Roadrunner 文件确认，Pecos 场址已有底层 NSR 授权，并为场址支持发电机单独登记了
              PBR；监管机构的确认函也写明，记录留存、准确披露和持续合规仍是可执行条件。这足以说明 Roadrunner
              不是只停留在选址愿景里。但还不足以断定，全面运营所需的州、地方、联邦、公用事业和环境批准都已经公开浮出水面。留存记录至少显示了一条具体的大气许可线索；但还没有给出完整许可清单，也没有外部律师式地签署确认所有必要批准。这个缺口重要，因为建设期
              climate-tech 资产往往不是死于某一个致命许可被拒，而是公用事业、施工、报告和合规依赖缓慢叠加，最后拖成投产延误。


              环境和法律风险也呈现同样结构。留存的公开检索没有发现明确执法案件、公开诉讼案卷或 PTAB 争议；专利记录也显示 Infinium 确实有真实技术
              IP。但公开争议不可见，不等于自由实施和环境尽调包已经清场。因此，投资人应把监管图景视为一个已部分去风险的栈，但其中存在一个关键不对称：官方证据足以证明项目真实且受监管，却不足以假设每项许可、审查和法律工作流都已完成，也不足以排除隐藏挑战。
