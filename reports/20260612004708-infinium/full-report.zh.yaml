            body: >-
              公开采用故事可信，但分层明显。Pathfinder 是最强验证，因为它被描述为持续运营的商业规模设施，已交付的 eFuels 已在 United States 和 Europe 使用；Borealis
              确认至少有一批商业 eNaphtha 发往其 Porvoo 工厂。Amazon 同样证明了真实非航空使用，因为它披露了一个按每年约 five million truck miles
              计量的车队应用。航空关系在商业上更重要，但今天实物成熟度较低：American 和 IAG 有高质量合同验证，但两者都依赖 Roadrunner 达到稳定生产。Roadrunner 仍在建设中，公开来源指向每年
              23,000 tonnes 产出和具名航空公司承购，但没有完整交付时间表。Atlas 进一步延伸需求堆栈，但作为 2026 年获批、目标初始 2029
              年生产的项目，应被视为扩张证据，而不是当前利用率。结论是，客户验证好于气候基础设施常态，但已交付量透明度仍落后于合同披露。
