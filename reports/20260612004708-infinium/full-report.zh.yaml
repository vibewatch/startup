        - Roadrunner 在 2027 年按时启动，Atlas 在 2026 年签署有约束力承购，Brookfield 后续资本开始转成真实项目部署。
        - 示意性平台支撑超过 $2.0B，因为 Infinium 将同时具备运营证明和可复用项目融资证据。
        - 爬坡执行、政策回滚和仍不透明的合同利润率可能限制上行。
        - 有可能，但需要多个尚非公开事实的里程碑。
      - - 基准
        - Roadrunner 大体按计划投运，Atlas 仍可信，但定价、债务条款和股权结构细节大多仍是私有信息。
        - 示意性支撑约 $1.0B-$1.6B，足以让投资者继续跟踪；若没有更多披露，还不足以支持激进进场。
        - 赞助方光环可能仍跑在工厂层面回报可见度前面。
        - 最符合当前公开证据。
      - - 悲观
        - Roadrunner 进度滑坡，Atlas 无法转化为可融资合同，或项目经济性显示其依赖政策支持、单厂回报缺乏吸引力。
        - 示意性支撑约 $0.6B-$0.9B，更接近商业化阶段同业标记，远低于溢价叙事暗示的水平。
        - 执行失败可能在需求完全消失前就摧毁股权价值。
        - 容易辩护，因为 Fulcrum 式失败先例和政策风险已经存在。
    notes: 这些区间是用于决策的启发式私募市场支撑带，不是管理层指引，也不是可交易标记。
