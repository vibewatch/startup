        blocks:
          - type: paragraph
            body: >-
              领导层可见度够用但偏薄。Robert Schuetzle 是唯一在官方、客户、投资者和供应商公告中持续出现的高管，也是产品、融资、客户与政策里程碑的公开叙事者。结构最清晰的法律披露来自 2026 年
              Infinium Operations Texas 的 Sunbiz 备案，其中 Robert Schuetzle 任 President，Dennis Schuetzle 任 SVP，Paula Lausa 任
              Secretary/Treasurer。公开来源没有给出的信息同样重要：保留的官方来源没有发布董事会名单、委员会结构，或带履历和任期数据的更完整高管梯队。因此，融资可信度和外部关系管理明显集中在 Robert
              身上；Dennis 和 Paula 出现在法律记录中，但缺少同等深度的公开运营披露。后续章节应把治理深度视为尽调事项，而非已确立事实。
