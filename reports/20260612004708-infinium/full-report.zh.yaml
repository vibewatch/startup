      - number: '4.3'
        title: 资本堆栈、股东支持与融资依赖
        blocks:
          - type: paragraph
            body: >-
              最强的公开财务证据就是资本堆栈本身。Brookfield 直接向 Infinium 和 Roadrunner 承诺超过 $200 million，并把另一个 $850 million 描述为面向未来
              Infinium 项目的里程碑式平台资本。Breakthrough Energy Catalyst 增加 $75 million 项目股权承诺，HSBC
              围绕该资产设计了项目型授信安排。这比典型气候科技初创叙事成熟得多，因为公司已经把客户合同与股权、债务和基础设施风格投资者配对。Brookfield
              自身转型基金披露也显示，股东拥有很深的资本池，因此问题不是有没有资本提供方。


              依赖问题在于，当前堆栈是否完全解决了飞轮接下来几转。公开来源仍未披露总 capex、债务规模、契约包或当前公司现金跑道。Brookfield 额外 $850 million
              是未来项目资本，并且明确受指标约束，这意味着 Roadrunner 仍必须交付。如果工厂启动延迟、需要更多资本，或未能达成里程碑经济性，Brookfield
              品牌质量不能消除融资风险；它只是让风险比无支持开发商更可管理。
