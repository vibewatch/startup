companyProfile:
  summary: >
    Infinium 是一家总部位于 Sacramento 的私人电燃料开发商，成立于 2020 年，试图把 power-to-liquids 技术做成可复制的项目融资平台。公开证据把公司与 Project Pathfinder
    的运营验证、West Texas 更大规模的 Project Roadrunner 建设、横跨 eSAF、eDiesel、eNaphtha
    和证书式产品的产品组合，以及早期合成燃料公司中罕见可信的交易对手联系起来。Brookfield、Breakthrough Energy Catalyst、HSBC、American Airlines、IAG、Amazon 和
    Borealis 给了公司真实的股东与客户验证。核心尽调问题不是 Infinium 有没有势能，而是估值、合同经济性、债务规模、交付量和单厂利润率仍未公开，投资判断对执行和入场价格高度敏感。
  foundedDate: '2020-06-03'
  foundingLocation: Sacramento, California, United States
  headquarters: Sacramento, California, United States
  productSummary: Infinium 销售超低碳电燃料及相关环境属性产品，包括 eSAF、eDiesel、eNaphtha 和证书式产品，工艺使用可再生电力、氢气、捕集 CO2 和 power-to-liquids 处理。
  customerFocus: 客户主要是航空公司，以及其他难减排运输或工业买家；它们需要可直接替代的低碳燃料或相关环境属性，早期验证集中在航空与物流。
  businessModel: 开发商兼运营商模式，把项目开发、长期承购合同、股东与项目融资，以及自有或合作方支持工厂未来的燃料或属性销售组合起来。
