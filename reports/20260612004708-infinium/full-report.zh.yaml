        title: 下行触发点、退出准备度，以及会改变判断的尽调
        blocks:
          - type: paragraph
            body: >-
              下行不需要需求崩塌。Fulcrum 破产说明，替代燃料叙事即便已经融到资本也可能失败；ICCT 和 IATA 也仍在描述一个 e-fuel 经济性依赖政策、SAF 稀缺且昂贵的世界。对 Infinium
              来说，最快打破投资逻辑的情形，是 Roadrunner 滑过 2027 年运营目标，或 Atlas
              未能把入选转化为有约束力的承购；这两件事都会削弱市场对基于里程碑资本支持的信心。退出准备度明显在提升：项目债务、蓝筹客户和可见的下一项目需求，都比大多数私有气候科技公司能展示的更好。但要达到跨界投资人级准备度，仍需要公开证据没有提供的数据，尤其是估值、股权结构表、债务条款、合同定价和工厂层面回报测算。这些也会改变判断。如果定价轮出现在公开启发式区间附近或以下，且经济性证明可投，Infinium
