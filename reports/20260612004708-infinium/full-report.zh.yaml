  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代逻辑
        blocks:
          - type: paragraph
            body: >-
              Infinium 应放在面向难减排运输的合成液体燃料市场中测算，而不是放进完整氢能经济、完整 SAF 经济，或泛清洁电力 TAM。核心纳入支出包括 eSAF / e-kerosene、其他
              power-to-liquid e-fuels、在允许情况下的相关 book-and-claim 或证书价值，以及把可再生电力、氢气和捕集碳转化为合规分子的项目开发支出。这个范围比广义 SAF
              市场更窄，因为当前大多数 SAF 仍通过 HEFA 和其他生物基路径制造；也远窄于总可再生氢市场，因为许多氢气用途永远不会变成可直接替代的运输液体。现状替代品包括传统航空燃料、HEFA
              SAF、alcohol-to-jet 和 Fischer-Tropsch
              生物燃料；在部分货运用例中，还包括直接电气化或可再生柴油。航运和重型物流是重要邻近市场，因为它们可以使用类似绿色分子或捕集碳路径，但短期内道路运输仍是次级切入点，因为 IEA 仍预计到 2030
              年运输可再生能源增长主要由电力和生物燃料带动，而非氢基液体燃料。
