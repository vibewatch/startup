        - 项目融资、股权赞助方、公开拍卖、长期承购方
        - 工厂投产前锁定电力、电解、CO2、认证和承购
        - 项目融资负责人、开发负责人、基础设施投资者
        - 接入高溢价需求渠道，并获得拍卖、税收抵免或进口支持桥梁
    notes: 同一种分子可以对应不同的买方、使用方和付款方。实物燃料规模尚不充裕时，Infinium 的价值主要在于能否先用合同把这些角色缝合起来。
