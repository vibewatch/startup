      - - 非生物路径带来长期原料上行空间
        - LanzaJet、Twelve、HIF、Prometheus 和 Velocys 表明，多条非 HEFA 路线可以汇聚到同一买方需求
        - 中
        - Infinium 并非唯一摆脱废油约束的公司，路线差异化可能随时间被压缩
        - 每年比较非 HEFA 路线的交付成本轨迹和认证时点
      - - 认证出口和交付可见后，信任可复利
        - HIF 已有 RFNBO 认证；SkyNRG 拥有广泛合规 / 分销触面；World Energy 今天就有运营信任
        - 高
        - Roadrunner 合同有帮助，但 Infinium 的旗舰规模资产仍未投运
        - 监测 Infinium 销量的监管批准、出口准备度和第三方可持续认证
      - - 合成燃料放量后价差应收窄
        - IEA 和 IATA 仍把该品类描述为依赖政策支持、且相对化石燃料供给极小
        - 高
        - 化石航煤仍是价格锚，SAF 供应稀缺
        - 承销补贴、强制令或税收抵免支持减弱的下行情景
      - - 品类可容纳多个赢家
        - Fulcrum 倒闭表明，有些路线在成为可复制业务之前就会失败
        - 高
        - 先进燃料历史仍更奖励可靠性和成本纪律，而不是新颖性
        - 评估护城河耐久性时，使用反向案例研究，不只看冠军叙事
    notes: 严重性为定性判断，反映买方和投资者视角下的竞争耐久性，不代表安全或环境危害。纳入 Fulcrum，是因为该品类最重要的反向证据来自商业化失败，而不只是竞争对手营销。
