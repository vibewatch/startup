  - id: TV005
    title: 投资逻辑破裂与放弃触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - Roadrunner 启动显著滑坡
        - 商业启动明显错过 2027 目标，或爬坡数据暗示投产期漫长且产能利用不足。
        - 执行可信度、贷款方信心，以及发起人继续为后续项目出资的意愿会同时走弱。
        - 暂停新承销，将支撑带向悲观情景重设。
      - - Atlas 需求无法形成约束
        - 2026 SABA 入选未能转化为已签署、可融资合同或买方承诺。
        - 平台可选性退回单项目故事。
        - 在约束性需求出现前，不为多项目上行付费。
      - - 单厂经济性不及预期
        - 私下尽调显示，定价、抵免和偿债能力无法支撑有吸引力的单厂回报。
        - 即便资产可融资，如果经济性主要流向贷款方或优先资本，股权投资仍可能很差。
        - 任何溢价私募标记下，都从观察转向回避。
      - - 政策或成本支持走弱
        - 税收抵免、强制掺混或合规费用动态让 e-fuels 的可投资性明显低于预期。
        - 公开可比公司和成本研究已经显示，今天这个行业无法靠商品平价自我支撑。
        - 以更低的利用率信心和更低的倍数支撑重切估值。
      - - 行业失败传染回归
        - 新的高关注 SAF 或 e-fuels 项目失败改变投资者胃口或债务可得性。
        - 可比下行情景扩大，因为发起人光环不再抵消行业执行恐惧。
        - 要求更好价格，或完全推迟参与。
    notes: 这些是会直接削弱价格支撑的决策触发因素，不是从行业里复制来的通用风险。
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV023
      - CV024
      - CV025
      - CV028
      - CV046
      - CV047
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 当前定价
        - 最新投后估值、每股价格、任何老股成交价，以及融资轮规模。
        - 没有真实价格，公开证据无法判断一家强公司是否也是一笔好交易。
        - 管理层融资资料室、领投方材料，或经纪老股数据。
      - - 合同经济性
        - Roadrunner 定价、照付不议保护、最低采购量，以及按年份拆分的客户集中度。
        - 承购质量连接需求验证与股权价值。
        - 商务团队条款清单和单厂模型。
      - - 债务与或有资本
        - HSBC 债务规模、摊还、契约，以及 Brookfield 追加 $850M 的指标门槛。
        - 里程碑资本可以吸收上行；条款薄弱时也可能消失。
        - 财务与法律尽调，加上融资文件。
      - - 股权结构表与优先权
        - 优先股堆叠、清算权、反稀释调价、MFN 条款和治理权。
        - 隐藏的优先股堆叠会让新资金面对的名义估值失去经济意义。
        - 法律顾问和 CFO 提供股权结构表资料包。
      - - 单厂回报测算
        - 预期毛利、抵免假设、利用率曲线和营运资本需求。
        - 这决定项目融资创造的是股权价值，还是只完成项目建设。
        - 董事会模型、税收抵免备忘录和贷款方案例模型。
      - - 退出准备度
        - 审计准备度、披露控制、董事会权利，以及跨轮投资者治理资料包。
        - 后期估值需要后期披露质量。
        - 总法律顾问、CFO 和审计工作计划。
    notes: 每个问题都直接连接到建议变化或价格重设；没有一项是泛泛的尽调表演。
    claimRefs:
      - CV043
      - CV047
      - CV048
      - CV049
      - CV050
