  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: Roadrunner 最高的剩余风险集中在启动时点、符合政策资格后的经济性和交易对手集中度，而不是单纯需求发现。
    approximationNotes: 评级是基于已保留公开证据得出的分析分数，不是公司发布的风险分数。该图在考虑可见缓释因素后排序剩余风险。
