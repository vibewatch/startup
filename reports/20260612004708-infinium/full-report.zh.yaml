      - number: '5.5'
        title: 差异化与技术风险
        blocks:
          - type: paragraph
            body: >-
              Infinium 的差异化不靠单个魔法反应器或软件护城河。证据指向的是一组组合：寻路式商业验证、分子品类广度、项目集成，以及对使能 know-how 的控制。Greyrock
              收购和专利组合暗示公司围绕合成气、催化剂和液体燃料合成有真实工艺工程野心；Electric Hydrogen
              则增加了一条可嵌入更大项目的模块化电解槽路径。产品广度也重要：公开来源支持航空燃料、柴油和石脑油用例，可扩大客户池并改善项目可选性。但同一套集成设计也制造风险。Roadrunner
              必须同步电力、氢气、CO2、许可、融资、承购和政策。Reuters 的更广泛行业复盘显示，首创 SAF 项目经常在这些压力下滑期或失败。因此，Infinium
              的差异化足以支持继续尽调，但前提是下一轮尽调拿到单厂表现数据和精确的路径特定合规证据。
