        - 在把包销视为硬锁定之前，要求查看合同期限、最低采购量和补足条款
      - - 项目融资和战略资本降低资金风险
        - Fulcrum 表明，FOAK 项目即便吸引了严肃资本和战略伙伴，仍可能失败
        - 高
        - Brookfield、Breakthrough 和 HSBC 式融资有帮助，但品类历史会惩罚执行失误
