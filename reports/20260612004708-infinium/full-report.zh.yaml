      - 指标
      - 倍数、估值或状态
      - 相关性
      - 局限
    rows:
      - - LanzaJet
        - 私募融资估值
        - 2026 轮融资，投前估值 $650M
        - 在商业化 SAF 同业中，这是已披露的最佳私募可比对象：已有运营工厂验证，也有结构化承购逻辑。
        - ATJ 路线、原料不同；已披露私募标记也未必能套用到 Infinium 更大的项目野心。
      - - Twelve
        - 私募融资结构
        - 2024 年融资 $645M，其中 $400M 为项目股权，但未披露估值
        - 说明成熟投资人仍愿意向 e-fuels 基础设施投入多少资本。
        - 没有公开估值标记，因此不能直接锚定价格纪律。
      - - Gevo
        - 公开市值 / 收入
        - 约 $0.35B 市值，对应约 $0.12B 收入（约 2.9x）
        - 显示公开市场愿意为一个有披露收入的小型可再生燃料转型故事支付什么价格。
        - 这是有报告收入、资产组合不同的上市公司，不是私募项目平台。
      - - Aemetis
        - 公开市值 / 收入
        - 约 $0.14B 市值，对应约 $0.20B 收入（约 0.7x）
        - 可作为困境可比，说明市场能把难做的可再生燃料经济性压到多低。
        - 反映的是上市公司压力和杠杆，不是发起人支持下项目融资的可选性。
      - - Darling Ingredients
        - 公开市值 / 收入
        - 约 $9.05B 市值，对应约 $6.13B 收入（约 1.5x）
        - 成熟燃料与原料基准，能观察公开市场如何给有规模、经济性披露的业务定价。
        - 大型既有企业，业务面宽，风险画像与 Infinium 很不一样。
      - - Neste
        - 公开市值 / 收入
        - 约 $25.90B 市值，对应约 $22.54B 收入（约 1.1x）
        - 大型清洁燃料既有企业中的最佳基准，体现公开市场对收入倍数的纪律。
        - 综合型既有企业，有经审计规模和盈利披露，Infinium 目前还达不到。
    notes: 这张表混合一个已披露私募估值、一个未披露价格的大额私募融资，以及四个公开市场锚点；目的不是解出 Infinium 价格，而是给定价划边界。
    enumerationScope:
      coverage: partial
      basis: >-
        This is a decision-useful but non-exhaustive set covering the clearest disclosed private marks and the most
        readable public renewable-fuels comparables available in June 2026.
