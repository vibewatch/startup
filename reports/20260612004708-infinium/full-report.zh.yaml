  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议取决于三点：融资证明确实存在，价格披露仍然缺位，下行风险也来自行业结构而非纸面假设。
    data:
      nodes:
        - id: customers
          label: 客户证明
          detail: American 和 IAG 的承购帮助 Roadrunner 跨过需求可信度门槛。
          tone: positive
        - id: capital
          label: 资本证明
          detail: Brookfield、Breakthrough 与 HSBC 表明，多层资本可以支撑该项目。
          tone: positive
        - id: platform
          label: 平台可选性
          detail: Atlas 显示 Infinium 有机会竞争更大的后续需求。
          tone: positive
        - id: opacity
          label: 价格不透明
          detail: 当前估值、轮次规模、债务规模和合同经济性仍未公开。
          tone: warning
        - id: sector
          label: 行业下行
          detail: Fulcrum 式失败先例和依赖政策的经济性仍然重要。
          tone: negative
        - id: decision
          label: 观察
          detail: 保持跟踪，但不能只靠公开证据给未披露定价做承销判断。
          tone: neutral
      edges:
        - from: customers
          to: decision
        - from: capital
          to: decision
        - from: platform
          to: decision
        - from: opacity
          to: decision
