      - number: '8.3'
        title: 基于里程碑的情景逻辑
        blocks:
          - type: paragraph
            body: >-
              这里正确的估值方法，是基于里程碑的平台承保，而不是假精确的收入倍数。Infinium 价值最敏感的变量有三项：Roadrunner 是否在 2027
              年启动；工厂能否把航空公司承购转化为可观察单位经济性；Project Atlas 能否把 SABA 需求转成有约束力的协议，并打开第二波融资。Brookfield 的结构是关键线索：首笔超过 $200
              million 是直接资本，但额外 $850 million 带条件，因此更像押注执行的看涨期权，而不是已经到手的现金。悲观情景下，延误或糟糕经济性会把 Infinium
              推回商业阶段同行估值，甚至更低。基准情景下，Roadrunner 交付叠加 Atlas 转化，可以支撑更宽但仍谨慎的低个位数十亿美元平台判断。乐观情景需要可复制性：Roadrunner 爬坡、Atlas
              可融资，以及 Brookfield 后续资本从表态变成现实的证据。
