        - id: deliveries
          label: 客户交付
          detail: American / IAG 排期与产品认证
          tone: warning
        - id: cash
          label: 收入与抵免兑现
          detail: 实际利润率取决于价格、产量和激励兑现
          tone: risk
        - id: finance
          label: 债务与股东韧性
          detail: 契约条款、应急资本与后续支持
          tone: warning
      edges:
        - from: policy
          to: cash
          label: 抵免与证书影响有效收入
        - from: startup
