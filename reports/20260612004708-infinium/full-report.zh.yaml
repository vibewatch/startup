    sections:
      - number: '1.1'
        title: 身份、总部与运营模式
        blocks:
          - type: paragraph
            body: >-
              Infinium 当前官网把公司描述为横跨 Infinium Energy 和 Infinium Edge 的技术驱动平台，但本次保留的公开证据仍由 eFuels
              业务主导。Mitsubishi、DBJ、World Economic Forum 以及 Florida 外州 LLC 备案等官方或准官方资料，都一致把公司放在 California 的 Sacramento，并把
              Corpus Christi 的 Project Pathfinder 与 Pecos 的 Project Roadrunner 作为运营重心。Mitsubishi 2025 年 1
              月公告给出了最清晰的成立事实链：Infinium Holdings, Inc. 于 2020-06-03 在 Sacramento 成立。项目和融资公告显示，商业模式不是轻量的软件层或 IP
              授权层，而是资本密集型开发商兼运营商模式，把气体转化技术、项目开发、项目融资和长期燃料承购组合起来，商业化 eSAF、eDiesel 和 eNaphtha。
