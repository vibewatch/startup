  - id: TU005
    title: 扩张与集中度风险表
    columns:
      - 驱动因素 / 风险
      - 扩张支撑
      - 集中度 / 摩擦
      - 影响
      - 尽调路径
    rows:
      - - American 先落地再扩张
        - Roadrunner 锚定承购，加上 Atlas 实物用户角色
        - American 的采购量仍未披露，战略价值上升也可能推高集中度
        - 可能做深一个蓝筹客户，同时掩盖对单一客户家族的敞口
        - 索取 Roadrunner + Atlas 合并承诺采购量和决策权
      - - IAG 组合扩张
        - 一份合同可覆盖五家航空公司和英国 SAF 需求
        - Roadrunner 产量中隐含份额较大；若单一集团成为核心用户，集中度风险上升
        - 短期可信度高，但收入集中度也可能高
        - 索取按航空公司拆分的分配和年度提货曲线
      - - 企业证书买家
        - SABA 把商务旅行和航空货运需求转成可融资承购
        - 账簿与声明机制需要登记系统完整、声明权属清晰，也需要企业持续支付溢价
        - 若信任基础设施撑得住，这是最大的新付费池
        - 索取具名买家、登记系统栈和合同期限
      - - Amazon 与物流邻近场景
        - 卡车运输用例加战略投资，支撑更多货运脱碳路径
        - 没有公开后续采购量；航空和航运表述多是邻近场景，而不是披露的具名合同
        - 航空之外的可选性有价值，但证据仍不足
        - 索取按车队、航线和运输方式拆分的扩张管线
      - - Borealis 与化工邻近场景
        - 商业发货证明交通燃料之外也能变现
        - 若没有复购或更广客户群，化工原料收入可能仍停留在单个项目
        - 若可复制性跑通，有助于分散终端市场结构
        - 索取复购记录、利润率画像和更多化工客户
      - - 政策 / 成本摩擦
        - 欧盟 RFNBO 需求和 SAF 强制令可扩大买家池
        - IATA、ADI、Acumen 和 ICCT 都显示，高成本、供给稀缺和声明治理复杂度会拖慢采购
        - 可能推迟承购落地，或压低扩张意愿
        - 在补贴更低、绿色溢价更高的情景下压力测试客户经济性
    notes: 扩张机会是真实的，但这个市场仍靠复杂的政策、会计和融资结构成交，而不是像大宗商品一样无摩擦采购。
