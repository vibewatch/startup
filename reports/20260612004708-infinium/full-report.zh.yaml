      - number: '7.2'
        title: 燃料认证和税收抵免依赖是结构性风险，不是边缘风险
        blocks:
          - type: paragraph
            body: >-
              Infinium 的终端市场逻辑，只有在燃料同时通过技术接受并拿到激励后才跑得通。IATA 和 FAA 把技术门槛讲得很清楚：SAF 必须走 ASTM D7566；一旦完成掺混，还要符合 ASTM
              D1655。同时，认证仍然耗时、耗资源，新增路径仍在评估中。也就是说，投资人不应把可直接替代型 SAF 规则的普遍存在，误读成 Infinium
              这套具体工艺配置已公开证明跨过所有路径特定门槛。政策端，Roadrunner 直接落在多套制度交叉处：45V 氢能抵免规则、45Z 清洁燃料注册与核验、EPA 燃料项目合规、CORSIA 核算，以及塑造 IAG
              相关需求的 UK/EU 市场规则。上述系统没有一个是可选脚注；每一个都是商业栈的一部分。


              因此，政策依赖在严重性排序里靠前。Treasury 最终版 45V 规则保留了增量性、可交付性和时间匹配保护，并要求氢能项目在 2030 年转向逐小时匹配；IRS 45Z 规则则要求 SAF
              抵免申报具备注册、合格原料和文件证明。UK SAF Mandate 和 ReFuelEU 支撑需求，但也引入证书、可追溯性和报告机制，而这些机制仍在落地中。公开证据因此指向一个具体风险判断：Infinium
              受益于长期政策方向友好，但近中期经济性仍取决于项目能否满足精确合规规则，同时不丢进度、成本和文档纪律。
