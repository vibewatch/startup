  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 对 Infinium 的相关性
    rows:
      - - 合成航空燃料（eSAF / e-kerosene）
        - 可直接替代型合成航煤分子、SAF 证书、book-and-claim 价值、长期航空公司承购
        - 常规 Jet A、大多数未认证低碳液体、一般机票收入
        - 航空公司、燃料供应商、机场、企业 scope-3 买方
        - 核心近端市场，因为航空对 PtL 分子的溢价和政策拉动最清晰
      - - 更广义 SAF 市场
        - 所有售入航空、符合 ASTM 和 CORSIA 条件的可持续航空燃料
        - 大多数非航空生物燃料和所有地面交通燃料
        - 航空公司和航空燃料供应商
        - 这是重要语境，但范围大于 Infinium，因为 HEFA 和其他生物路径仍主导当前量
      - - 可再生船用燃料邻近市场
        - E-methanol 和其他低排放液体燃料、合规价值、船用燃料溢价
        - 常规船用燃料和大多数船舶 capex
        - 船舶运营商、船用燃料供应商、货主
        - 相关邻近市场，因为航运可以吸收相似绿色分子，并支撑以甲醇为核心的基础设施
      - - 选择性重型道路 / 物流邻近市场
        - 面向难电动化车队细分的溢价低碳燃料采购
        - 大众市场 EV 充电、常规柴油零售、通用车队远程信息服务
        - 货运运营商、燃料分销商、品牌主导物流项目
        - 有用的可选性，但不是最干净的主切入点，因为到 2030 年，道路脱碳仍由电力和生物燃料主导
      - - 可再生氢与 RFNBO 输入栈
        - 合格可再生电力、电解、捕集 CO2、认证、合规服务
        - 通用电网电力、不受约束的化石氢、不合格碳输入
        - 项目开发商、进口商、基础设施金融机构
        - 关键供给侧支出，因为 Infinium 必须先购买或锁定这些输入，才能把终端市场需求货币化
      - - 排除的广义气候 TAM
        - 除可直接货币化的 e-fuel 分子和合格属性外无其他
        - 广义氢能 TAM、清洁电力 TAM、通用脱碳 capex、大多数碳管理 TAM
        - 不直接相关
        - 必要排除项，用来避免用非液体燃料类别夸大市场规模
    notes: 边界有意收窄：只捕捉可货币化的合成液体燃料需求和合格输入栈，而不是完整氢能、电力或一般脱碳经济。
