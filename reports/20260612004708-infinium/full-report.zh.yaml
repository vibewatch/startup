      - number: '2.2'
        title: 测算视角：政策底线、实物供给与 eSAF 切口
        blocks:
          - type: paragraph
            body: >-
              可信的 Infinium 市场判断需要多重视角，因为公开来源无法给出一个干净的 TAM / SAM / SOM 数字。最宽的天花板来自 IRENA / WTO：可再生氢及衍生物到 2050
              年最高可占终端能源使用的 14%。IEA 给出的近端运输视角收得更紧：可再生运输能源预计到 2030 年增长 50%，但航空与海运合计仅占增长的 10%，氢基燃料再占 10%。最有决策价值的航空视角更窄。IEA
              主情景把 SAF 从 2024 年的 1 billion litres 推到 2030 年的 9 billion litres，仍只约占航空燃料总需求的 2%；其中 e-kerosene 预计仅占 SAF 量的
              5%，意味着 2030 年全球约 0.45 billion litres。这远低于欧洲政策底线所暗示的水平：ReFuelEU 要求 2030 年 SAF 占 6%，其中合成子配额为 1.2%，到 2050
              年提高至 70% SAF、35% 合成燃料。当前实物供给仍很小：EASA 统计 2024 年 SAF 占航空燃料使用量 0.53%，IATA 预计 2025 年仅 0.7%。对 Infinium
              而言，政策底线描述的是支付意愿压力，IEA 供给预测更能描述短期可交付 SAM。
