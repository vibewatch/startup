        - 公司称首座且唯一乙醇制 SAF 工厂，生产符合 ASTM 规格的燃料
        - 仍依赖低碳乙醇路线，以及首座工厂之外的商业复制
      - - Twelve
        - 电力制液体燃料的电化学 CO2 转化，产出 E-Jet 和 E-Naphtha
        - 2024 年融资 $645M；AirPlant One 于 2026 年 6 月开业，初始 E-Jet 产能约 50k gpy
        - 航空公司、企业 SAF 买方、化学品客户
        - 与 Alaska、Microsoft、IAG 签订长期承购；United 进行战略投资
        - 融资强、首座工厂可见，并声称产品兼容 ASTM
        - 当前实物规模远低于既有 HEFA 供给，早期经济性仍未披露
      - - HIF Global / Haru Oni（项目）
        - 风电制氢 + 捕集 CO2 制 e-methanol / e-gasoline
        - 运营中的试点规模设施，年产 130,000 liters；全球项目管线
        - 赛车、汽车、航运和未来出口市场
        - Porsche 承购，Shell 提供调和 / 物流支持
        - 首座运营中的 e-fuels 工厂，具备 RFNBO 和 ISCC 认证
        - 当前规模对航空太小，当前商业证明集中在 e-gasoline，而不是航空 SAF
      - - World Energy
        - 用废脂肪、废油和油脂生产 HEFA
        - 运营 Paramount 工厂；既有商业 SAF 供应商，有 Houston 扩张野心
        - 需要即时可替代供给的航空公司和企业脱碳买方
        - 现有燃料物流，当前卡车交付，并计划改善管线
        - 当前运营信任和无需改装飞机的叙事很强
        - 受原料约束的 HEFA 路线长期可扩展性弱于合成燃料
      - - SkyNRG
        - 当前提供 HEFA 供给 / book-and-claim；eSAF 和新工厂在管线中
        - 供应 60+ 航空公司和 100+ 企业；DSL-01 100k tpa 于 2026 年完成融资，2028 年中投产
        - 航空公司、机场、企业、合规驱动买方
        - 分销优先模式，加上 KLM/APG 支持的生产所有权
        - 通过认证供给项目形成很强的信任和合规姿态
        - 自有大规模生产仍是未来状态，当前经济性仍对抵免敏感
      - - Velocys
        - 面向废弃物、生物质、生物气和 e-fuels 项目的 Fischer-Tropsch 技术授权
        - 未披露可比的在运 SAF 产量；Altalto 和 Bayou 仍在规划；美国 / 日本有已验证的组件项目
        - 项目开发商、通过合作伙伴触达航空公司、技术被授权方
        - 授权方 / 合作伙伴模式，而不是直接做品牌燃料分销
        - 在 FT 组件和 ASTM/JAL 示范历史上有技术可信度
        - 项目进展慢于拥有在运工厂或已融资场址的领先者，可融资性也更弱
      - - Prometheus Fuels
        - DAC + 电化学 electrofuels / e-kerosene，不用氢（公司说法）
        - 试点验证和商业就绪声明；抓取证据中未显示大型在运航空燃料资产
        - 国防、偏远能源、航空、数据中心 / 分布式燃料叙事
        - 技术主导商业化，而不是可见的分销足迹
        - 新路线和大胆降本声明带来可选性
        - 独立验证和当前客户交易量证明仍薄
      - - Fulcrum BioEnergy（历史参照）
        - MSW-to-fuels / 合成原油制 SAF 概念
        - 2024 年申请 Chapter 11；Sierra 失败前目标接近 11M gpy SAF
        - 航空和废弃物管理生态
        - 项目融资的单资产开发，原料处理复杂
        - 与其说是仍在推进的活跃对手，不如说是 FOAK 规模化风险的有用反向基准
        - 显示先进燃料规模化中路线、EPC、可靠性和资产负债表的脆弱性
      - - 化石航空燃料 / 既有煤油
        - 石油炼制
        - 主导全球供给和价格锚
        - 所有航空公司和航空燃料买方
        - 根深蒂固的分销和机场加油系统
        - 即时可靠性和可获得性最高
        - 没有脱碳收益，政策 / 客户压力在上升
    notes: 各行综合了当前运营证明、公开披露融资和合作伙伴触点。公开定价通常拿不到，因此表格强调规模、买方重点和商业化姿态，而不是隐含单位经济性。
