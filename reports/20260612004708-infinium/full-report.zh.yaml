  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 估值支撑度的变化更多取决于里程碑转化和披露，而不是泛化的行业热情。
    data:
      items:
        - label: Roadrunner 按时投产
          value: 3
          detail: 2027 年资产真正投运，比再出一份叙事材料更能提高估值支撑。
          tone: positive
        - label: Atlas 约束性承购
          value: 2
          detail: 若 2026 年入选转化为已签合同，第二个项目的叙事会更扎实。
          tone: positive
        - label: 带价格轮次披露
          value: 4
          detail: 披露新股或老股价格，是提升承销判断精度的最大单项因素。
          tone: positive
        - label: 政策与成本压力
          value: -3
          detail: SAF 成本高、e-fuel FID 节奏慢，仍可能压缩投资人胃口。
          tone: negative
        - label: Roadrunner 延误
          value: -4
          detail: 延误会打击市场对项目经济性和平台可复制性的信心。
          tone: negative
        - label: 隐性债务或优先权
          value: -4
          detail: 如果融资条款吃掉上行空间，名义估值可能高估股权价值。
          tone: negative
    approximationNotes: 数值是供委员会讨论的相对支撑点变化，不是以美元计的直接估值变化。
    claimRefs:
      - CV010
      - CV012
      - CV023
      - CV025
      - CV028
      - CV043
      - CV046
      - CV048
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 公开证据只能支持一个较宽的私募市场支撑区间，因为执行和披露比单纯行业叙事更重要。
    data:
      items:
        - label: 悲观支撑
          low: 600
          mid: 750
          high: 900
          displayValue: $0.6B-$0.9B
          detail: Roadrunner 延误或经济性不及预期，会把 Infinium 推回商业化阶段同行的严苛估值标尺。
          tone: negative
        - label: 基准支撑
          low: 1000
          mid: 1300
          high: 1600
          displayValue: $1.0B-$1.6B
          detail: Roadrunner 大体按计划交付，Atlas 仍可融资，但定价和债务条款仍有一部分未公开。
          tone: warning
        - label: 乐观支撑
          low: 2000
          mid: 2400
          high: 3000
          displayValue: $2.0B-$3.0B
          detail: Roadrunner 开始爬坡，Atlas 继续推进，Brookfield 后续资本开始转化为可复制的项目证明。
          tone: positive
    approximationNotes: 区间是启发式的平台价值带，依据已披露私募可比公司、发起方结构和里程碑证据交叉推导，并非来自 Infinium 已披露财务报表。
    claimRefs:
      - CV040
      - CV041
      - CV042
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Infinium 在需求和发起方质量上得分较高，但价格透明度和经济性披露偏弱。
    data:
      items:
        - label: 需求证明
          score: 8
          detail: American、IAG 和 Atlas 都指向真实客户拉力。
          tone: positive
        - label: 资本获取
          score: 8
          detail: Brookfield、Breakthrough 和 HSBC 提供的融资证明，强过多数私营 SAF 同行。
          tone: positive
        - label: 平台可选性
          score: 7
          detail: Atlas 拼出了一条可信的第二波项目路径。
          tone: positive
        - label: 经济性清晰度
          score: 3
          detail: 合同定价、工厂利润率和债务服务仍未公开。
          tone: negative
        - label: 价格透明度
          score: 2
          detail: 新资金仍没有已披露的当前估值锚。
          tone: negative
        - label: 政策韧性
          score: 4
          detail: 行业研究仍显示，成本对激励和强制要求高度敏感。
          tone: warning
        - label: 证据质量
          score: 6
          detail: 证据足以支持继续跟踪，但不足以支持只靠公开信息买入。
          tone: warning
    approximationNotes: 分数是 0-10 分的委员会判断，锚定已引用公开证据；若出现带价格轮次或新的债务披露，应更新评分。
    claimRefs:
      - CV001
      - CV005
      - CV012
      - CV023
      - CV025
      - CV043
      - CV044
      - CV045
