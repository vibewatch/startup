  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: standard
    summary: Infinium 从具名兴趣和已签合同走向已交付吨数和重复使用可见度时，证据基础会变窄。
    data:
      nodes:
        - id: named
          label: 已具名公开兴趣
          description: AP Ventures 和面向客户的页面把航空公司、Amazon 和 Borealis 列为具名采用方。
        - id: signed
          label: 已签协议
          description: American、IAG、Amazon 和 Borealis 都有公开合同或出货证明。
        - id: financing
          label: 融资支撑的部署
          description: American、IAG 和 SABA 证据明确绑定可融资项目开发。
        - id: physical
          label: 实物使用或出货
          description: Amazon 卡车运输和 Borealis 原料使用已进入实物阶段；Roadrunner 航空尚未进入。
        - id: repeat
          label: 重复使用 / 续约
          description: 公开留存、重复订单和流失指标缺位，因此这一阶段大多不透明。
      edges:
        - from: named
          to: signed
          label: logo 转成公开协议
        - from: signed
          to: financing
          label: 锚定承购支撑可融资性
        - from: financing
          to: physical
          label: 工厂产出或出货必须到位
        - from: physical
          to: repeat
          label: 可靠性必须转成持久需求
