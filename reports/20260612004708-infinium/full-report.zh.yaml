  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户细分、买方角色与真实验证在哪里
        blocks:
          - type: paragraph
            body: >-
              Infinium 的公开客户证据覆盖四个不同需求面，而不是单一买家基础。American Airlines 和 IAG 是实物航空买家，用长期承购协议锁定未来 eSAF 供给，并降低新工厂融资风险。Amazon
              是自筹资金的物流用户，既投资 Infinium，又同意在 Southern California 中程车队中使用电燃料，因此既是战略支持方，也是运营客户。Borealis 完全在另一条赛道：它购买
              eNaphtha 作为塑料生产的化工原料，且已披露向 Finland 的 Porvoo 工厂商业发货。Atlas 在经济意义上增加了第五层，即便实物交付尚未发生：企业买家为商务旅行和航空货运排放购买 SAF
              证书，而 American 承担实物提取。因此，买家、用户和付款方在卡车运输中可以是同一方；在航空中可拆分到航空公司和企业证书市场；在化工中则可能位于下游制造客户的上游。
