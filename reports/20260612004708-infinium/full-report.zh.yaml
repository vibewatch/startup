      - number: '2.3'
        title: 买家、付款方与商业化路径
        blocks:
          - type: paragraph
            body: >-
              航空公司是 eSAF 的主要运营使用方，但不是 Infinium 采用路径中唯一重要的经济角色。IATA 净零路线图把约 65% 的航空减排归给
              SAF，使航空燃料采购成为核心需求锚点。不过付款堆栈是分层的：燃料供应商和机场联盟居中处理实物交付；企业差旅买家可通过航空公司 SAF 项目和经验证书为 scope-3
              减排付费，而不实际使用燃料；项目开发商或进口机制可在最终分子被提取前，通过承保可再生电力、氢气、碳和基础设施承诺来变相预融资供给。机场是使能方，不是溢价的天然所有者，因为开放燃料基础设施接入比机场特定定价更重要。对
              Infinium 而言，商业化不是单一航空公司销售动作，而是一条链：锁定合规投入、认证分子、匹配登记系统兼容的需求渠道，再把该渠道转化为可融资承购或项目融资。航运和物流买家扩大了可选项，但最清晰的买家 / 用户
              / 付款方一致性仍在航空加企业 book-and-claim 叠加层。
