  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同行、替代品与潜在进入者
        blocks:
          - type: paragraph
            body: >-
              Infinium 面对的是三层竞争，而不是一个干净的同行集合。最接近的直接同行是合成燃料或其他非 HEFA 开发商，它们承诺用非粮投入制造可直接替代燃料：LanzaJet 走
              alcohol-to-jet，Twelve 走 power-to-liquid 电化学，HIF 走 e-methanol / e-gasoline，Velocys 做 Fischer-Tropsch
              授权，Prometheus 做 direct-air-capture 电燃料。当前最强替代品不是这些面向未来的同行，而是 World Energy 等现有 SAF 供应商，以及 SkyNRG
              周边的采购和预订生态，因为它们已用运营基础设施和成熟物流满足买家减碳要求。最严酷的现状替代仍是化石航空燃料本身，因为 IEA 仍称 SAF 占航空燃料消费不到 0.1%，IATA
              也强调仍需政策支持来弥合价格差距。Fulcrum BioEnergy
              作为在运营对手的重要性较低，但作为反向证据很重要：它的倒下说明，漂亮的路径叙事不保证可靠商业运营。潜在进入者包括更大的综合燃料、项目融资和航空生态，一旦承购需求清晰，它们可以复制同一堆栈的部分能力。
