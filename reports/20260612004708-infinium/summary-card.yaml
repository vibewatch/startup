  topStrengths:
    - >-
      Infinium has unusually credible counterparties for a commercializing electrofuels company, including Brookfield,
      Breakthrough Energy Catalyst, HSBC, American Airlines, IAG, Amazon, and Borealis.
    - >-
      Pathfinder, Roadrunner FID, and named offtake plus debt financing give the company real project-development proof
      rather than a purely conceptual decarbonization story.
    - >-
      The product fits hard-to-abate customers because it aims to deliver drop-in fuels and related attributes without
      requiring end-user engine modification.
  topRisks:
    - >-
      Roadrunner schedule slippage, commissioning underperformance, or delayed offtake fulfillment would weaken both
      sponsor confidence and valuation support quickly.
    - >-
      Infinium remains structurally dependent on policy design, tax-credit qualification, fuel-certification pathways,
      and renewable-power or CO2 sourcing assumptions.
    - >-
      The current valuation, contract pricing, debt terms, delivered volumes, and plant-level economics remain private,
      so investors still cannot test whether sponsor quality translates into attractive equity entry.
  unresolvedGaps:
    - >-
      Current valuation, round size, price per share, and any secondary pricing remain undisclosed in retained public
      sources.
    - >-
      Public evidence does not disclose Roadrunner contract pricing, minimum volume protections, or plant-level
      gross-margin assumptions.
    - >-
      HSBC debt size, amortization profile, covenants, and Brookfield metric gates on the additional $850 million are
      not publicly available.
    - >-
      Public sources do not provide current revenue, headcount, delivered fuel volumes, retention, or
      customer-concentration by year.
