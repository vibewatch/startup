company:
  name: Infinium
chapter:
  number: 4
  title: Financials
  summary: Infinium has real commercialization proof—American and IAG offtakes, Brookfield and Breakthrough project equity, and HSBC project debt—but the public record still discloses far more about counterparties than about economics. Brookfield’s structure ($200M+ direct plus up to $850M for future projects) reduces perceived financing fragility, yet Roadrunner’s margin path remains highly sensitive to power, hydrogen, tax-credit capture, debt sizing, and undisclosed contract pricing. Public evidence supports a financeable-asset narrative, not yet a fully underwritten revenue, margin, or runway case.
sections:
- id: revenue-model-and-offtake
  title: Revenue model, customer contracts, and commercialization quality
  body: 'Infinium’s public revenue model is straightforward at the product level but still opaque at the contract level. Project Roadrunner is being built to sell three drop-in fuels—eSAF, eDiesel, and eNaphtha—with the clearest disclosed commercialization path in aviation. American Airlines signed a firm offtake beginning in 2026, and IAG signed a 10-year e-SAF agreement that management and customers present as bankable demand rather than speculative intent. Argus’s estimate that IAG alone represents roughly one-third of annual output is the strongest single public clue that Roadrunner can enter operations with meaningful baseline utilization rather than pure merchant exposure. Amazon’s trucking deal gives Infinium an additional proof point outside aviation, but its disclosed scale is tiny versus the Roadrunner aviation story.


    What is missing is the money side of those contracts. None of the retained public sources disclose price, take-or-pay commitments, cancellation protections, or how much of the output is already fully spoken for beyond the named customers. That leaves revenue quality looking promising in form—blue-chip counterparties, long-duration contracts, and export demand linked to policy mandates—but still impossible to underwrite in substance. The right public-market conclusion is that demand credibility is real, while monetization precision remains private.'
