      values:
      - High counterparty quality, medium term certainty
      - Low direct cost sensitivity, high dependence on private pricing terms
      - Named customers, undisclosed economics
    - label: Renewable power and hydrogen
      values:
      - Indirect revenue support
      - Very high sensitivity to power price and electrolyzer performance
      - Inputs named, economics private
    - label: Project debt and equity
      values:
      - Supports plant completion rather than fuel demand
      - High sensitivity to leverage and milestone funding
      - Investors named, debt quantum private
    - label: Tax credits / policy support
      values:
      - Indirect through customer willingness and net project returns
      - Very high sensitivity to incentive capture and policy durability
      - Need assumptions memo
    - label: Future-plant platform capital
      values:
      - Supports pipeline optionality, not current Roadrunner revenue
      - Medium sensitivity to milestone achievement
      - Contingent future capital, not unconditional cash today
