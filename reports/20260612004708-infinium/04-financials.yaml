- id: financial-verdict-and-diligence-blockers
  title: Financial verdict and remaining diligence blockers
  body: 'The public record supports a constructive but not underwritten financial view. Infinium has real offtake customers, named project-finance participants, and enough technical disclosure to show that Roadrunner is a concrete industrial project rather than a concept deck. That gives the company more commercialization credibility than many SAF peers, especially in a sector where Reuters documents a large gap between announced projects and projects that actually reach commercial volumes. The best interpretation is that Infinium has crossed the threshold from startup narrative to financeable asset development.


    The blocker is that public traction is not the same as public financial proof. Revenue realization, price floors, debt terms, tax-credit assumptions, gross margin, working capital, and cash runway remain private. Brookfield’s commitment structure also matters: only the first $200 million-plus is clearly direct to Infinium and Roadrunner, while the larger number is still contingent, future-project capital. My public-evidence verdict is therefore that revenue quality looks potentially high, the margin path remains policy-and-input sensitive, and the main diligence priority is contract economics plus full project-funding math rather than market demand discovery.'
