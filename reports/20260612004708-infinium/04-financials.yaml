- id: capital-stack-and-financing-dependency
  title: Capital stack, sponsor support, and financing dependency
  body: 'The strongest public financial evidence is the capital stack itself. Brookfield committed more than $200 million directly into Infinium and Roadrunner and framed another $850 million as milestone-based platform capital for future Infinium projects. Breakthrough Energy Catalyst added a $75 million project-equity commitment, and HSBC structured a project-based credit arrangement around the asset. That is more mature than a typical climate-tech startup story because the company is already pairing customer contracts with equity, debt, and infrastructure-style investors. Brookfield’s own transition-fund disclosures also show that the sponsor has very deep capital pools, so the issue is not whether a capital provider exists.


    The dependency question is whether the current stack fully solves the next few turns of the flywheel. Public sources still do not disclose total capex, debt size, covenant package, or current corporate cash runway. Brookfield’s additional $850 million is future-project capital and explicitly metric-gated, which means Roadrunner still has to perform. If the plant starts late, requires more capital, or fails to hit milestone economics, the quality of Brookfield’s brand does not remove financing risk; it only makes that risk more manageable than it would be for an unsupported developer.'
