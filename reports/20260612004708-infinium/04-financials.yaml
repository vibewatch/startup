- id: FI004
  title: Capital intensity / cash-flow map
  type: matrix
  layout: wide
  summary: Cash-flow confidence is strongest where contracts and capital are named; it is weakest where pricing, leverage, and subsidy capture remain private.
  approximationNotes: This matrix is qualitative and ranks disclosure confidence, not project quality. It is intended to separate what is visible in public evidence from what still requires diligence.
