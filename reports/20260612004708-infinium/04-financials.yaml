tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - American Airlines eSAF offtake
    - Firm airline purchase agreement tied to Roadrunner production
    - Volume contract; pricing undisclosed
    - Commercial volumes scheduled from 2026
    - High strategic value because it de-risks financing, but quality cannot be underwritten without take-or-pay and price terms
    - Request contract term sheet, annual volume schedule, price formula, and cancellation protections
  - - IAG eSAF offtake
    - 10-year purchase agreement for any of IAG’s five airlines, with UK-market delivery
    - Volume contract; pricing undisclosed
    - Supply expected from 2026; Argus says ~75,000 tonnes over 10 years
    - Potentially high quality because of tenor and mandate-linked demand, but cash economics remain undisclosed
    - Request full offtake volume curve, take-or-pay mechanics, export logistics cost, and delivery obligations
  - - Remaining Roadrunner eSAF capacity
    - Additional airline / corporate sales still being marketed
    - Volume contract or spot mix unknown
    - Infinium says more offtake contracts are in progress
    - Medium quality until sell-through and contract terms are visible
    - Request current sold-versus-unsold output, pipeline stage, and fallback merchant assumptions
  - - eDiesel sales
    - Drop-in fuel for trucking and maritime applications, with Amazon proving at least one demand channel
    - Gallons / tonnes; pricing undisclosed
    - Roadrunner product slate includes eDiesel; Amazon disclosed a 5 million truck-mile use case outside Roadrunner
    - Adjacency is real, but public scale and margins are weakly disclosed
    - Request signed trucking/maritime contracts, expected mix share, and realized price per gallon
  - - eNaphtha sales
    - Feedstock sold into plastics / chemicals value chains
    - Tonnes; pricing undisclosed
    - Product is disclosed, but no public contracted volumes found
    - Quality unknown because end-customer and formula pricing are private
    - Request customer list, contracted volume, index linkage, and working-capital terms
  notes: Rows distinguish named contracted channels from product lines that are public but not yet financially transparent. Pricing and recognition terms remain undisclosed across all retained sources.
