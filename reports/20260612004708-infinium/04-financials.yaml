- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public signal
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Brookfield direct commitment
    - '>$200M into Infinium and Roadrunner'
    - High
    - This is the clearest named capital backing the current asset
    - Confirm amount funded versus committed and use-of-proceeds split between corporate and project level
  - - Brookfield future-project envelope
    - Up to $850M for other Infinium eFuels projects, subject to metrics
    - High
    - Important for platform scale, but not the same as unconditional Roadrunner funding
    - Request milestone schedule, investment committee triggers, and project-by-project allocation rules
  - - Breakthrough project equity
    - Conditional $75M commitment
    - High
    - Adds specialist climate capital and helps validate the project-finance stack
    - Confirm funding status, conditions precedent, and remaining unfunded commitment
  - - HSBC project debt
    - Project-based credit arrangement; debt size undisclosed
    - Medium
    - Shows bankability, but leverage risk cannot be modeled without debt quantum and terms
    - Request debt amount, pricing grid, DSCR covenants, reserve accounts, and amortization schedule
  - - Transition-fund sponsor capacity
    - Brookfield says BGTF I was $15B and BGTF II first close reached $10B
    - Medium
    - Supports counterparty strength for future rounds and cost overruns if milestones are achieved
    - Request whether Roadrunner has reserved follow-on capital or only framework eligibility
  - - Policy-supported funding stack
    - Debt and tax-credit monetization expected beyond equity
    - Medium
    - Implies project economics depend on financial engineering as well as offtake
    - Request tax-credit transferability plan and lender sensitivity to policy change
  - - Total project capex
    - Undisclosed publicly
    - Low
    - Without full capex, investors cannot know whether disclosed commitments cover the plant or just the first phase
    - Request full EPC budget, contingency, owner’s costs, and spend-to-date
  - - Corporate cash / runway
    - Undisclosed publicly
    - Low
    - Asset-level financing does not remove parent-company liquidity risk
    - Request current cash balance, monthly burn, and downside runway under delayed startup
  notes: The public record proves real financing progress but leaves the total funding requirement opaque. The key diligence challenge is moving from named investors to complete project-funding math.
