- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / proxy
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Disclosed annual output
    - 23,000 tonnes / 7.6M gallons per year
    - High
    - Sets the denominator for utilization, contracted share, and capex intensity
    - Validate nameplate output by product mix and ramp assumptions
  - - Contracted share proxy
    - IAG alone appears to cover ~7,500 tonnes/year, roughly one-third of annual output; American volume not public
    - Medium
    - Shows the asset may start with meaningful baseline demand, but sell-through remains incomplete
    - Request all offtake schedules and minimum-volume commitments
  - - Renewable-power input
    - 150 MW long-term wind supply
    - High
    - Power cost is one of the main drivers of hydrogen and fuel economics
    - Request PPA tenor, escalation, curtailment, and balancing assumptions
  - - Hydrogen-production input
    - 100 MW electrolyzer from Electric Hydrogen
    - Medium
    - Electrolyzer uptime and efficiency shape hydrogen cost and therefore margin
    - Request stack efficiency, warranty, replacement cadence, and load profile
  - - Policy support dependence
    - 45V participation unclear; ICCT says e-kerosene remains above fossil parity without heavy support
    - Medium
    - Subsidy capture can determine whether project margins are positive or merely strategic
    - Request 45V/45Z/40B assumptions, legal memo, and downside case without credits
  - - Sector cost benchmark
    - 'ICCT: U.S. e-kerosene roughly $8.8/gal in 2020 falling to ~$4/gal in 2050 under favorable assumptions'
    - High
    - Provides a public outside-in benchmark for why Roadrunner needs contracts, credits, and cheap power
    - Request management bridge from benchmark to Roadrunner-specific expected cash cost
  - - Gross margin / burn / NRR
    - Not publicly disclosed
    - Low
    - These are the core underwriting variables that determine whether scale creates real equity value
    - Request plant-level contribution margin, corporate overhead allocation, and monthly cash burn
  notes: This table intentionally mixes direct public facts with outside-in cost benchmarks. Every unavailable field carries a specific diligence request instead of a false precision estimate.
