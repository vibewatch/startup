- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Realized offtake price and take-or-pay terms
    - Without price floors and volume obligations, revenue quality cannot be converted into cash-flow quality
    - Obtain customer contracts, side letters, and pricing / indexation schedules for American, IAG, and any remaining volumes
  - - Full project capex and debt size
    - Named equity is not enough to test overrun risk or sponsor sufficiency
    - Obtain EPC budget, contingency, debt commitment letter, and sources-and-uses model
  - - Current corporate cash balance, burn, and runway
    - Parent-company liquidity could still become a bottleneck even if Roadrunner is financed
    - Request latest board package with monthly cash bridge and downside runway scenarios
  - - Gross margin bridge by input
    - Power, hydrogen, CO2, debt service, and credits likely dominate margin but none are quantified publicly
    - Request plant-level unit-cost model and sensitivity analysis for power, credits, and uptime
  - - Utilization / ramp assumptions
    - Headline deliveries may begin before the facility reaches full commercial operations, which changes near-term revenue timing
    - Request monthly ramp plan, availability assumptions, and contracted-versus-merchant volume by year
  - - Working-capital and counterparty terms
    - Export logistics, customer payment terms, and inventory cycles can materially change cash conversion
    - Request receivables terms, shipping / storage assumptions, hedge policy, and covenant headroom
  notes: These are the minimum public-evidence blockers to an underwritten margin and runway view. Each row identifies the exact diligence artifact needed to close the gap.
