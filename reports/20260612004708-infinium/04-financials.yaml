  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: offtake-pricing
    missingEvidence: Executed contract pricing, take-or-pay commitments, volume ramps, and termination rights for American, IAG, and any additional offtakers.
    whyItMatters: Without contract economics, public counterparties do not translate into underwritten revenue quality or debt-service coverage.
    diligencePath: Obtain offtake agreements, legal summaries, and lender model assumptions for each committed customer.
    relatedQuestionRefs:
    - QI002
    - QI016
    - QI019
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: blocking
    topic: project-capex-and-debt
    missingEvidence: Total project capex, spend-to-date, debt amount, debt pricing, reserve accounts, and covenant package.
    whyItMatters: The public capital stack is real but incomplete, so overrun risk and true sponsor sufficiency cannot be modeled.
    diligencePath: Request EPC budget, sources-and-uses, debt commitment letter, and base / downside lender case.
    relatedQuestionRefs:
    - QI009
    - QI020
    - QI024
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: corporate-runway
    missingEvidence: Current cash balance, monthly burn, parent-company overhead, and runway under delayed startup scenarios.
    whyItMatters: Project finance does not eliminate parent-company liquidity risk, especially if startup slips or extra equity is required.
    diligencePath: Request latest management accounts, board runway deck, and variance-to-plan commentary.
    relatedQuestionRefs:
    - QI020
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: margin-bridge
    missingEvidence: Plant-level cost bridge covering power, hydrogen, CO2, labor, maintenance, logistics, debt service, and tax-credit capture.
    whyItMatters: Public output and customer names are not enough to know whether Roadrunner earns an attractive margin or merely clears financing hurdles.
    diligencePath: Obtain project model sensitivity tables and management unit-cost assumptions by startup year.
    relatedQuestionRefs:
    - QI012
    - QI021
    - QI023
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: minor
    topic: working-capital-and-utilization
    missingEvidence: Receivables terms, export logistics timing, inventory assumptions, and monthly utilization ramp from first delivery to steady state.
    whyItMatters: Working-capital drag and a slow utilization ramp can materially change cash generation even if long-term demand is sound.
    diligencePath: Request customer payment terms, shipping/storage model, and operational ramp chart by quarter.
    relatedQuestionRefs:
    - QI008
    - QI011
    relatedTableRefs:
    - TI005
