      - number: '5.2'
        title: Architecture, Modules, and Product Surfaces
        blocks:
          - type: paragraph
            body: >-
              The public product architecture has a coherent stack. Agent Studio is the build environment: it exposes
              workspaces, versioning, reusable skills, permissions, A/B testing, and A2A handoffs. The Build surface
              adds natural-language configuration, code customization, guardrails, knowledge connections, and scripted
              validation. Monitor contributes interaction logs, reasoning traces, issue tracking, alerts, and
              policy-driven governance. Optimize adds outcome dashboards and safe in-production iteration. Apps adds
              workflow-specific human interfaces layered directly on the same data as the agent.


              This modularity matters because it separates a true platform from a custom-services wrapper. A bespoke
              services business can ship a bot. A platform shows reusable catalog items, shared issue-management loops,
              version control, and multiple runtime surfaces. Wonderful’s public pages increasingly show the latter.


              The architecture also extends beyond clean APIs. The computer-use release claims that agents can operate
              legacy systems through managed virtual machines, while the open-by-default post claims a headless API
              surface with Swagger documentation and exportability. Together, those sources imply a system designed to
              bridge both modern and legacy enterprise estates.
