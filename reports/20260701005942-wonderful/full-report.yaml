      - number: '7.4'
        title: Dependency, Customer, People, and Financial Risk
        blocks:
          - type: paragraph
            body: >-
              Dependency risk sits at three levels. First, Wonderful depends on model providers, cloud infrastructure,
              telephony platforms, and customer APIs. Second, it depends on people: forward-deployed engineers, local
              market teams, and specialized technical talent. Third, it depends on customers continuing to expand from
              initial workflows fast enough to support a labor-intensive rollout model.


              The customer proof is strong on deployment outcomes, but public evidence on durability is still thin. That
              means concentration and margin risk are harder to dismiss than the customer chapter alone might suggest.
              If a few lighthouse accounts or verticals drive the story, any slowdown in telecom or financial-services
              expansion could hit both narrative and economics. The weak independent review footprint reinforces that
              uncertainty.


              Financially, the hardest question is whether the local-team-heavy operating model scales into
              software-like economics or stalls in a services-heavy middle ground. Sector-wide inference-cost pressure
              makes that question sharper, especially for high-volume voice and agentic workloads.
