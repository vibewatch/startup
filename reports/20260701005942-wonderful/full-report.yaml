        - If named deployments prove non-repeatable or heavily services-dependent, this strength weakens
      - - The company may become a category leader in multilingual, regulated, high-complexity deployments
        - If incumbents or hyperscalers close the gap faster than Wonderful scales, leadership assumptions fall
      - - The current $2B price already discounts a large amount of future success
        - A much stronger case on NRR, margin, and concentration could make the price easier to defend
      - - Missing retention, margin, and preference data are the central blockers to a more positive call
        - Private diligence resolving those blockers could move the call toward selective invest
