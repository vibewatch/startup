      - number: '3.5'
        title: Moat Durability, Lock-In, and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              Wonderful’s moat is real, but it is a softer moat than pure lock-in software. Open architecture,
              exportability, and headless APIs help the company get in the door, especially with skeptical enterprises
              that fear being trapped inside a new AI control plane. The same design also means customers can leave if a
              better system emerges. Wonderful is explicitly betting that product quality and execution will outrun
              closed-platform switching costs.


              That bet becomes harder as larger suites improve. If Salesforce, ServiceNow, Microsoft, or Zendesk close
              enough of the capability gap while preserving distribution and bundled economics, Wonderful risks being
              valued as a premium implementation layer rather than a durable software control point. The company’s own
              scaling plan shows the pressure: it wants to grow headcount from 350 to about 900 in 2026 to support
              deployment demand. That can strengthen execution advantage, but it also raises organizational complexity
              and cost.


              The bullish reading is that regulated, multilingual, integration-heavy environments will continue to
              reward Wonderful’s model. The bearish reading is that feature commoditization and suite bundling narrow
              the set of customers willing to pay for that model. For valuation later, that distinction matters more
              than abstract category excitement.
