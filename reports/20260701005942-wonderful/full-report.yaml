      - number: '4.3'
        title: Cost Structure, Margin Drivers, and Unit-Economics Proxies
        blocks:
          - type: paragraph
            body: >-
              Wonderful’s likely cost stack has three heavy components: people, compute, and compliance. People matter
              because the model depends on on-site or locally embedded teams who integrate systems, transfer knowledge,
              and stay involved after launch. Compute matters because agentic AI remains inference-heavy. Deloitte says
              some enterprises are already seeing monthly AI bills in the tens of millions, while Forbes argues that AI
              operating costs are rising faster than revenue in parts of the sector. Compliance matters because
              Wonderful publicly commits to a 99.9% SLA and processes sensitive support-call data, which implies
              reliability engineering, incident response, privacy, and governance overhead.


              The good news is that Wonderful is visibly trying to compress at least one cost line: internal engineering
              productivity. Its own posts describe banning manual coding, forcing models to self-test, and building a
              90,000-line Agent Builder in roughly two weeks. If real, that can materially reduce the engineering cost
              of product iteration and customer-specific tooling.


              Public comparables help frame, but not solve, the margin question. Salesforce’s operating margins show
              what mature enterprise software can look like at scale, while Five9’s 55.1% GAAP gross margin is a more
              realistic contact-center-software reference point. Wonderful may eventually sit somewhere between software
              economics and services-plus-inference economics, but public disclosure is far too thin to say where.
