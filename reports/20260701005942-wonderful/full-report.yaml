  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Overview
        blocks:
          - type: paragraph
            body: >-
              Wonderful’s risk profile is not dominated by a single existential flaw. Instead, the main issue is
              stacking risk: compliance burden, integration dependency, execution intensity, margin pressure, and thin
              independent quality proof all point in the same direction. That matters because the company is attempting
              to scale unusually quickly while serving regulated customers in many countries and deployment modes.


              The highest-severity risks cluster around regulation and operational execution. On regulation, Wonderful’s
              own legal surface shows that it is already handling AI Act-adjacent use cases, financial-services buyers
              subject to DORA, broad privacy obligations, and cross-border portability questions. On execution, the
              product promise depends on local deployment teams, deep integrations, model-provider choice, and
              governance tooling working together inside live enterprise processes.


              None of these risks automatically breaks the thesis. But the combination means that a single bad event — a
              privacy incident, failed regulated deployment, audit dispute, or sustained gross-margin miss — could have
              outsized consequences for sales velocity, retention, and valuation.
            claimRefs:
              - CR001
              - CR026
              - CR029
              - CR031
              - CR042
