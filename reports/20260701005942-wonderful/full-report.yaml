      - number: '4.4'
        title: Public Traction, Capital Adequacy, and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              Wonderful’s visible traction is real but only partially quantified. TechCrunch reported tens of thousands
              of daily requests with an 80% resolve rate in late 2025. The company and The Next Web both highlight
              strong expansion behavior after the first use case, and AI Business says Bloomberg quoted management
              putting revenue at “tens of millions of dollars” by March 2026. That is meaningful scale for a company
              founded in 2025, but it remains vague compared with the precision expected for serious financial
              underwriting.


              Capital access, by contrast, looks strong. Wonderful moved from seed to Series A to Series B in less than
              a year, reaching $286 million of disclosed funding by March 2026. Management says the latest capital will
              fund platform investment and an expansion from about 350 employees to about 900 by year-end, across more
              than 30 countries. That scale-up implies a business that is not short of investor demand, but also one
              that is spending aggressively ahead of fuller disclosure.


              There is no public evidence in the retained materials of debt-driven financing complexity or
              manufacturing-style capex. The financing dependency is more straightforward: keep proving growth, keep
              showing reusable deployment economics, and eventually disclose enough margin and retention data to justify
              the valuation. If that disclosure lags, capital may still be available, but at worse terms.
