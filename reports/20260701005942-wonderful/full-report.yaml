      - number: '7.2'
        title: Regulatory, Legal, and Contractual Risk
        blocks:
          - type: paragraph
            body: >-
              Wonderful has built a surprisingly detailed legal shell for a young company, but that shell also makes the
              risk surface explicit. The AUP and MSA show that the company knows it is operating close to sensitive
              boundaries: automated decisions with legal effects, telephony laws, regulated-sector workflows, privacy
              regimes, and country-by-country disclosures. The DPA, DORA addendum, and Data Act addendum deepen that
              picture by turning privacy, resilience, audit, and switching into contractual topics.


              This is constructive in one sense: Wonderful is not pretending that enterprise AI can ignore regulation.
              But the same detail reveals real procurement and operating risk. FSI buyers can ask for more audit
              assurance than a young startup naturally wants to provide. Data portability is not as simple as a
              marketing line about openness when custom work, prompts, analytics, and professional services are partly
              excluded from export. And the MSA’s allocation of compliance duties to customers may be commercially
              rational without removing reputational or litigation risk from Wonderful if something goes wrong.


              For investors, the right read is that Wonderful appears regulation-aware, not regulation-light. That
              lowers some surprise risk while preserving significant execution and deal-friction risk.
            claimRefs:
              - CR002
