        title: Exhibits
        blocks:
          - type: callout
            title: This is a real company, not just a hot round
            body: >-
              Wonderful has enough product and customer proof that the valuation discussion deserves seriousness. The
              issue is entry price, not lack of substance.
            calloutType: strength
