  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition in Customer Workflow Terms
        blocks:
          - type: paragraph
            body: >-
              Wonderful’s product is better described as an enterprise operating layer for AI-driven workflows than as a
              single-purpose support bot. The platform is built around real business work: voice, chat, email, document
              processing, and API-driven tasks that need to read enterprise data, trigger actions, and update systems of
              record. In that sense, Wonderful is selling the ability to put agents into production across complex
              workflows rather than selling a narrow conversational surface.


              Public product surfaces reinforce that framing. The company explicitly breaks the product into Build,
              Monitor, Optimize, Apps, Deployment, and Agent Studio. This creates a lifecycle view: design and connect
              the agent, evaluate it before go-live, run it in production with governance and observability, and expose
              it to humans through workflow-specific interfaces. The platform claims to extend beyond customer support
              into front- and back-office work, which matters because the economic promise depends on reusing the same
              foundation across multiple use cases.


              Customer examples like Bank Hapoalim and Banco Caja Social make the product more concrete. Those
              deployments are not generic FAQ bots; they are integrated voice and service workflows with custom tools,
              real-time data access, and governance steps. That is the practical definition of the product.
