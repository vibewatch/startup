    title: Recommendation logic
    type: flow
    layout: wide
    summary: Chain from company quality and public proof to a price-sensitive final recommendation.
    data:
      nodes:
        - id: market
          label: Large market + real product
          detail: Workflow AI, enterprise pain, product depth, model-agnostic platform
          tone: positive
        - id: proof
          label: Customer proof is strong
          detail: Named deployments, measured outcomes, fast time-to-production
          tone: positive
        - id: risk
          label: Risk stack is high
          detail: Compliance, margin, integration, and hiring complexity remain material
          tone: warning
        - id: price
          label: Price is demanding
          detail: $2B mark versus tens-of-millions revenue and thin public metrics
          tone: negative
        - id: call
