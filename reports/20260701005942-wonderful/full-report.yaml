  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Public proof quality is strongest on deployment specificity and weakest on durability and concentration
      transparency.
    data:
      columns:
        - Outcome specificity
        - Scale visibility
        - Production evidence
        - Durability visibility
      rows:
        - label: Banking references
          values:
            - label: High
              tone: positive
              detail: Hapoalim and BCS include concrete workflow and KPI detail
            - label: Medium-High
              tone: positive
              detail: 40k expected monthly interactions, 43,658 calls, segment sizes are public
            - label: High
              tone: positive
              detail: Production language and executive quotes are explicit
            - label: Low
              tone: warning
              detail: No NRR, renewal, or contract-term visibility
        - label: Telecom references
          values:
            - label: High
              tone: positive
              detail: Telefónica, OTE, and Bezeq publish containment, AHT, or satisfaction shifts
            - label: Medium
              tone: neutral
              detail: Tens of thousands of calls and 6,500 interactions are public, but not full denominators
            - label: High
              tone: positive
              detail: Live production and replacement of prior automation are explicit
            - label: Low
              tone: warning
              detail: No public renewal or revenue mix by telco
        - label: Healthcare / adjacent verticals
          values:
            - label: Low-Medium
              tone: warning
              detail: Healthcare proof is thinner and unnamed; PPC is one strong adjacent utility proof
            - label: Low-Medium
              tone: warning
              detail: Very few named accounts beyond core service verticals
            - label: Medium
              tone: neutral
              detail: Some live workflow signals exist but less depth than banking/telco
            - label: Low
              tone: warning
              detail: No public retention metrics
        - label: Independent review layer
          values:
            - label: Low
              tone: warning
              detail: Review sites provide thin or curated evidence
            - label: Low
              tone: warning
              detail: Too few reviews to judge representative scale
            - label: Low-Medium
              tone: warning
              detail: Trustpilot / PeerSpot are not strong enterprise production validators
            - label: Low
              tone: warning
              detail: No real cohort, renewal, or complaint trend data
    claimRefs:
      - CU024
      - CU032
      - CU034
      - CU035
      - CU036
      - CU037
      - CU040
  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: Relative likelihood, impact, mitigation maturity, and residual exposure across Wonderful’s main risk buckets.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual exposure
      rows:
        - label: Regulatory / legal
          values:
            - label: Medium-High
              tone: warning
              detail: Multiple regimes already in scope via DPA, DORA, AI Act-aware AUP
            - label: High
              tone: negative
              detail: A single miss in a regulated workflow could hurt sales and retention
            - label: Medium
              tone: neutral
              detail: Policies and addenda exist, but not all external proof is public
            - label: Medium-High
              tone: warning
              detail: Procurement and audit friction remain real
        - label: Operational / security
          values:
            - label: Medium
              tone: warning
              detail: 'Many moving parts: models, APIs, telephony, legacy UIs'
            - label: High
              tone: negative
              detail: Production incidents would hit high-stakes customer workflows
            - label: Medium
              tone: neutral
              detail: Monitoring and evaluation are explicit but mostly self-described
            - label: Medium-High
              tone: warning
              detail: Differentiation creates extra failure modes
        - label: Dependency / partner
          values:
            - label: High
              tone: warning
              detail: Model, cloud, and integration partners are pervasive
            - label: Medium-High
              tone: warning
              detail: Partner failures can transmit directly into CX outcomes
            - label: Medium
              tone: neutral
              detail: Diversification helps but adds complexity
            - label: Medium-High
              tone: warning
              detail: Contract terms limit Wonderful liability
        - label: People / execution
          values:
            - label: High
              tone: warning
              detail: Headcount ramp and local-team model raise strain risk
            - label: Medium-High
              tone: warning
              detail: Execution quality is core to retention story
            - label: Low-Medium
              tone: neutral
              detail: Capital base and operating playbook help but do not remove complexity
            - label: Medium-High
              tone: warning
              detail: Scaling failure would show up quickly in deployments
        - label: Financial / model
          values:
            - label: Medium
              tone: warning
              detail: Still early, but inference economics and labor intensity matter
            - label: Medium-High
              tone: warning
              detail: Margin compression would weaken the premium valuation story
            - label: Low-Medium
              tone: neutral
              detail: Mitigation depends on proving scalable software economics
            - label: Medium-High
              tone: warning
              detail: Durability data is still missing publicly
    claimRefs:
      - CR001
      - CR008
      - CR018
      - CR024
      - CR029
      - CR031
      - CR042
