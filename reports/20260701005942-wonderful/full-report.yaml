  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Retention / expansion miss
        - NRR / GRR or workflow expansion materially below expectation
        - Breaks the premium-growth justification
        - Re-rate toward lower-multiple workflow software
      - - Gross-margin disappointment
        - Inference or local-team costs prevent software-like margin progression
        - Weakens the “platform, not services” narrative
        - Tighten price discipline or pass
      - - Security / compliance incident
        - Material incident in a flagship regulated account
        - Damages trust, slows enterprise procurement, and raises churn risk
        - Pause or step back until root cause and customer impact are known
      - - Audit / portability friction
        - Repeated regulated deals stall on DORA, audit, or exit terms
        - Challenges the claim that Wonderful can scale cleanly into FSI-grade accounts
        - Lower conviction in TAM capture and sales efficiency
      - - Preference overhang surprise
        - Investor terms are materially more senior or protective than expected
        - Cuts real return potential for new entrants
        - Re-underwrite on fully diluted / liquidation-stack basis
    notes: These are the fastest paths from a strong narrative to a weaker investment outcome.
    claimRefs:
      - CV034
      - CV035
      - CV039
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Retention
        - NRR, GRR, logo churn, renewal cadence
        - Most important missing proof for premium valuation support
        - Finance / CRO / board materials
      - - Margins
        - Gross-margin waterfall by deployment mode and inference provider
        - Determines whether Wonderful scales like software or a hybrid services business
        - Finance + engineering cost review
      - - Concentration
        - Top-10 customer revenue and usage share by vertical / geography
        - Reveals fragility behind headline customer proof
        - Revenue analytics / board deck
      - - Preference stack
        - Liquidation preferences, ratchets, anti-dilution, secondary dynamics
        - Directly affects return to a new investor at the current price
        - Legal diligence + financing docs
      - - Regulated-customer procurement
        - Completed security questionnaires, audit outcomes, DORA / portability objections
        - Validates whether regulated demand converts efficiently
        - Security / sales / legal diligence
      - - Incident history
        - Security, uptime, and customer-escalation record
        - Separates polished controls from battle-tested operations
        - Trust / SRE / customer-support diligence
    notes: If these six asks come back strong, the current recommendation can move materially.
    claimRefs:
      - CV033
      - CV038
      - CV039
      - CV040
