      - number: '1.4'
        title: Scale, Disclosure, and Geographic Footprint
        blocks:
          - type: paragraph
            body: >-
              Wonderful says it operates across more than 30 countries, with coverage spanning Europe, the Middle East,
              Asia-Pacific, and Latin America. November 2025 reporting already named a surprisingly broad list of launch
              markets: Italy, Switzerland, the Netherlands, Greece, Poland, Romania, the Baltics, the Adriatics, and the
              UAE. By July 2026, Wonderful had also published dedicated country pages for the Netherlands, Germany, and
              the UAE, reinforcing the idea that the go-to-market model depends on market-specific teams and
              localization rather than remote, centralized deployment.


              Public headcount reporting is broadly consistent on direction but not on exact level. Company and investor
              materials tied to the Series B cite approximately 350 employees, while TechCrunch's March 2026 brief used
              300 as the current figure before a jump to 900. The direction is unambiguous: Wonderful intends to scale
              very aggressively through 2026. The careers page supports that story, showing recruitment across delivery,
              engineering, GTM, operations, and leadership functions.


              Financial disclosure is much weaker. Public materials do not provide audited revenue, gross margin, cash
              burn, or customer count. The only revenue datapoint recovered for this chapter is second-hand: AI Business
              said Bloomberg quoted Winkler describing revenue as merely "tens of millions of dollars." That is not
              enough to underwrite operating leverage or efficiency, and customer count remains undisclosed despite the
              company's strong claims about production deployments and sector reach.
