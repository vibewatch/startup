      - number: '8.3'
        title: Bull / Base / Bear Underwriting
        blocks:
          - type: paragraph
            body: >-
              The bull case is not absurd. If Wonderful truly compounds its current deployment proof into
              multi-hundred-million-dollar revenue with software-like economics, the current round could still generate
              acceptable returns. The company has the right ingredients for that story: strong product depth, visible
              enterprise pain, and customer evidence that early deployments can expand into new workflows.


              The base case is less exciting. In a more ordinary outcome — good growth, solid customers, but incomplete
              margin proof and some services drag — Wonderful may simply grow into its current mark rather than
              massively outperform it. That is not an attractive setup for a new investor paying the full current price.


              The bear case is meaningful because the price is already high. If retention, margin, or procurement
              friction disappoints, valuation can compress sharply even if the company remains a real business. That
              asymmetry is why scenario analysis matters more here than category enthusiasm.
            claimRefs:
              - CV020
