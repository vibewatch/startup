      - number: '8.2'
        title: Financing Context and Comparable Valuation Set
        blocks:
          - type: paragraph
            body: >-
              Public financing context is straightforward: Wonderful raised a $150 million Series B at a $2 billion
              valuation in March 2026, bringing total disclosed funding to roughly $286 million. What is not
              straightforward is how much present-day revenue and durability support that price. The best public revenue
              disclosure is still only “tens of millions of dollars,” which leaves a wide range of possible implied
              multiples.


              Public comps do not eliminate that uncertainty, but they frame it. Using July 2026 market-cap and revenue
              data, relevant software names trade anywhere from roughly 1.4x revenue (Five9) to 7.3x (ServiceNow), with
              other workflow and automation names generally in the low-to-mid single digits. Wonderful can deserve a
              premium to those names because it is earlier, faster growing, and still scarcity-valued. But the current
              mark appears to require a very large premium — one that is difficult to justify from public data alone.


              The critical conclusion is that Wonderful is not expensive because the business looks weak; it is
              expensive because the headline valuation is already pricing in a large share of future success.
            claimRefs:
