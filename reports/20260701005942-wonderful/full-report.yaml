  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Anti-Thesis, and Price Discipline
        blocks:
          - type: paragraph
            body: >-
              Wonderful has enough substance that a serious investor cannot dismiss it as a superficial AI wrapper. The
              company has real enterprise product depth, unusually concrete customer proof for its age, and a market
              narrative that fits current budget migration toward AI agents and workflow automation. In that sense, the
              investment thesis is real.


              The problem is price discipline. Public evidence still does not show the cohort retention, gross margin,
              customer concentration, or preference-stack clarity that would let an investor underwrite a $2 billion
              mark with confidence. The anti-thesis is therefore not that Wonderful lacks promise; it is that the
              company may still be too services-heavy, too operationally complex, and too thinly disclosed for the
              current entry price.


              That distinction matters. At a lower price, the same company might be an easy “selective yes.” At the
              current price, the burden of proof shifts materially upward.
            claimRefs:
