          detail: Voice, chat, WhatsApp, or service workflow goes live with measurable KPIs
          tone: positive
        - label: 4. Operating proof
          detail: Containment, AHT, deflection, sentiment, or promise-to-pay improvements become visible
          tone: positive
        - label: 5. Internalization / trust
          detail: Customer teams gain confidence and learn to build or govern additional agents
