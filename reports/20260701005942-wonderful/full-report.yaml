      - number: '1.3'
        title: Funding History and Investor Landscape
        blocks:
          - type: paragraph
            body: >-
              Wonderful's financing trajectory is extraordinary by private-software standards. In July 2025 it raised a
              $34 million seed round led by Index Ventures with Bessemer and Vine. Four months later, in November 2025,
              it closed a $100 million Series A led by Index Ventures with Insight Partners, IVP, Bessemer, and Vine
              also participating. On March 12, 2026, the company announced a $150 million Series B led by Insight
              Partners with the same four existing investors returning. The speed from seed to Series B is part of the
              investment thesis itself: investors are underwriting not just product potential, but rapid proof that the
              operating model can travel across markets.


              Most public sources place disclosed funding at about $286 million after the Series B, though Globes
              reported $284 million. The discrepancy is small, but it is real and should be preserved rather than
              normalized away. Similarly, the headline Series B valuation is $2 billion, or about €1.7 billion in euro
              terms. That implies an enormous increase in enterprise value within roughly a year of founding and only
              months after the Series A.


              What remains opaque is the economic structure beneath the headline numbers. Public sources do not disclose
              debt facilities, secondaries, board representation, or investor rights. The investor lineup is elite and
              consistent, but economic control, founder dilution, and downside protections remain hidden from public
              view. For a company that has already compressed three major rounds into a short period, that is a
              meaningful diligence gap rather than a trivial omission.
            claimRefs:
