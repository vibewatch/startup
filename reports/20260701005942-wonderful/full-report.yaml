  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Wonderful does not fit neatly into a single legacy software category. The company sells an enterprise
              AI-agent platform, but the buyer problem it addresses overlaps three adjacent markets: AI agents, AI
              customer service, and contact-center software. Its language about customer, employee, and back-office
              workflows pushes it beyond a classic call-center vendor; its focus on real deployments in telecom,
              finance, and healthcare keeps it far narrower than the full global AI-agents category.


              The right boundary therefore includes software and services that automate high-volume enterprise
              workflows, especially customer-service interactions, agent-assist processes, internal support operations,
              and the governance or integration layers that make those deployments usable in production. It should
              exclude raw model infrastructure, generic consumer assistants, and BPO labor pools except where those
              alternatives represent status-quo substitutes in an enterprise buying decision.


              Those substitutes matter. Buyers can keep legacy contact-center suites, outsource more labor to BPOs,
              attempt in-house agent builds, or run fragmented pilots across multiple vendors. Wonderful's case is
              strongest when enterprises conclude that a shared, governed architecture plus deployment help is better
              than buying another siloed tool or staffing more manual operations. That makes market-boundary discipline
              important: the company is not chasing all AI spending, only workflow automation where integration,
              localization, and trust matter enough to justify a higher-touch platform sale.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM032
              - CM038
