      - number: '2.2'
        title: 'Sizing Lenses: TAM, SAM, and the Relevant Opportunity Set'
        blocks:
          - type: paragraph
            body: >-
              Public market estimates vary widely because they measure different things. Grand View's AI agents market
              lens starts from a broad category of autonomous software systems across use cases and reaches $10.9
              billion in 2026. Grand View's AI-for-customer-service lens is narrower, at roughly $13.0 billion in 2024
              growing to $83.9 billion by 2033. Contact-center-software publishers are broader again in another
              direction: Research and Markets puts that market at $47.7 billion in 2025, while Mordor prints $72.9
              billion for the same year, reflecting different inclusions for services, deployment models, and platform
              scope.


              Wonderful's own venture narrative adds a fourth lens: Index Ventures framed the non-English call-center
              opportunity at roughly $200 billion annually. That is directionally useful because Wonderful is explicitly
              organized around multilingual, non-US-centric markets, but it is not a tight serviceable market estimate.
              It is closer to an opportunity story than a clean TAM.


              The most relevant sizing frame for Wonderful is therefore a constrained SAM: large enterprises in
              regulated or complex industries that need multilingual customer-service and adjacent workflow automation,
              and that are willing to pay for deployment-heavy execution. The serviceable obtainable market is smaller
              still because Wonderful scales country by country with embedded teams. That means valuation later should
              be anchored on the portion of the market where execution intensity and compliance are features rather than
              cost disadvantages.
