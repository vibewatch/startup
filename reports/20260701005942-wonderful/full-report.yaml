  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Metric
      - Multiple / valuation / status
      - Relevance
      - Limitation
    rows:
      - - Salesforce
        - Market cap / TTM revenue
        - $128.3B / $41.52B ≈ 3.1x
        - Large incumbent software and AI distribution benchmark
        - Much larger, broader, and more mature than Wonderful
      - - ServiceNow
