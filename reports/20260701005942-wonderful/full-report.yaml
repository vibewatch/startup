companyProfile:
  summary: >-
    Wonderful is an Amsterdam-based, Israeli-founded enterprise AI platform company focused on customer service
    automation and broader workflow orchestration. Founded in 2025 by Bar Winkler (CEO) and Roey Lalazar (CTO), the
    company combines a model-agnostic platform with local deployment teams, deep enterprise integrations, and monitoring
    / governance tooling. In March 2026 it raised a $150M Series B led by Insight Partners at a $2B valuation, bringing
    total disclosed funding to roughly $286M.
  foundedDate: '2025-01-01'
