    - Interaction logs + quality signals + operators
    - Operational noise if thresholds are poorly set
  - - Deployment substrate
    - Runs in multi-tenant, single-tenant, BYOC, or on-prem form
    - Cloud / customer infra / local ops teams
    - Support burden rises with mode diversity
