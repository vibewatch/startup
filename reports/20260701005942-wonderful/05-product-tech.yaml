- id: deployment-and-operations
  title: Deployment, Integration, and Operating Model
  body: >-
    Wonderful’s deployment story is unusually broad for a startup at this age. The company publicly supports multi-tenant, single-tenant, bring-your-own-cloud, and on-premise deployment models, then pairs that flexibility with forward-deployed teams and a three-phase path toward client ownership. The combination suggests that Wonderful wants to be viable both for cloud-forward enterprises and for regulated organizations that need stricter infrastructure control.


    Integration is a first-order product concern, not just a professional-services afterthought. Bank Hapoalim used a RAG source plus 15 custom tools tied into banking systems. Banco Caja Social used a co-built API plus a voice-governance stack. The computer-use release extends that reach into systems that do not expose useful APIs, using managed VMs and observable sessions instead.


    Operationally, Wonderful tries to close the loop after go-live. Monitor and Optimize push the product toward issue tracking, alerts, dashboards, and safe production iteration. Apps adds the human review surface. That operating model is one of the company’s clearest product strengths — and also one reason the support surface is complex.
