- id: trust-safety-and-quality
  title: Trust, Safety, Privacy, and Quality Controls
  body: >-
    Wonderful’s public legal and operational materials show a meaningful enterprise-control stack. The SLA commits the platform to 99.9% monthly availability and service credits, making reliability a contractual obligation. The privacy policy makes clear that support-call audio and phone numbers can be processed, which is important because it means privacy, storage, and security controls are integral to the architecture. The DPA adds breach-notification timing, subprocessor governance, audit rights, and references to ISO 27001 certificates.


    At the product level, the trust posture is not only legal. The Build surface emphasizes guardrails and scripted testing. Monitor exposes reasoning traces, alerts, issue tracking, and business policies enforced in real time. Product Overview and the Series B announcement add self-healing design and harness-based evaluation. Banco Caja Social’s AI-as-a-judge model is a concrete example of governance logic living inside a deployment.


    The one caveat is public depth. The legal stack is solid, but public API docs and deep technical trust artifacts remain lighter than the marketing language around openness might suggest. The control story is credible; its external verifiability is still incomplete.
  claimRefs:
  - CE023
  - CE024
  - CE025
  - CE026
