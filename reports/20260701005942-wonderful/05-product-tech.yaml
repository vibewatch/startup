- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Wonderful solution
  - Measurable benefit
  - Limitation
  rows:
  - - Retail-banking campaign service
    - Customers need eligibility checks, identity verification, and enrollment support
    - Voice/chat agent with RAG and 15 custom tools into bank systems
    - Expected 40k interactions/month; 88% containment
    - Public proof is a single case study
  - - Collections operations
    - Human collectors call customers and negotiate payment promises
    - Outbound voice agent with governance and product-specific flows
    - Promise-to-pay up from 45% to 65%; AHT down 33%
    - Requires co-built API and workflow tailoring
  - - Inbound weekend customer service
    - No scalable weekend coverage for routine queries
    - Second service agent on shared foundation
    - 38% of weekend calls handled
    - Only limited public detail on long-run quality
  - - Legacy back-office operations
    - Teams work in systems with poor or no APIs
    - Computer-use agent in managed VM
    - Avoids waiting on multi-quarter integration projects
    - UI-driven flows can be brittle
  - - Claims / underwriting / supervisor review
    - Managers review agent output outside the workflow tool
    - Wonderful Apps builds dedicated human-review interfaces
    - Tighter human-agent collaboration
    - Usage breadth across customers not yet public
  - - Support-quality operations
    - Managers sample interactions manually
    - Monitor + Apps create traces, issues, and coaching surfaces
    - Programmable QA and learning loops
    - Need public evidence on scale and false-positive management
  notes: Rows favor concrete retained examples over hypothetical use cases. Several workflow claims remain company-provided and should be tested in customer diligence.
