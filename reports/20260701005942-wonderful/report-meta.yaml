  topStrengths:
    - Real enterprise product depth across build, monitor, optimize, apps, and flexible deployment modes
    - Unusually concrete named-customer proof for a 2025-founded company, including banking and telecom deployments
    - Strong capital-market support and investor quality, with $286M disclosed funding in under a year
    - Model-agnostic and open-architecture positioning may reduce lock-in concerns for complex enterprises
  topRisks:
    - $2B valuation appears far ahead of public financial disclosure, with revenue still only described as “tens of millions”
    - No public NRR, GRR, gross margin, or concentration data to support premium pricing
    - Forward-deployed, local-team-heavy execution model may pressure margins and complicate scaling
    - Compliance, audit, and portability demands from regulated customers could slow growth or increase costs
  unresolvedGaps:
    - Cohort retention, renewal, and churn data remain undisclosed
    - Gross-margin waterfall and deployment-mode economics remain undisclosed
    - Liquidation preferences, anti-dilution terms, and secondary dynamics are unknown
    - Top-customer concentration and ARR mix by vertical / geography are unknown
