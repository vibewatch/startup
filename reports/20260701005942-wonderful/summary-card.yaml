  headline: >-
    Wonderful may become a category-defining enterprise AI workflow platform, but the public evidence does not yet
    justify price-insensitive conviction at a $2B valuation. Product depth and customer proof are real; retention,
    margin, concentration, and preference-stack evidence are not.
