evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: Named executive roster, board membership, and local GM identities beyond the two founders.
    whyItMatters: >-
      Without a fuller leadership picture, key-person dependence and execution resilience cannot be underwritten
      confidently for a company scaling this quickly.
    diligencePath: >-
      Request org chart, board roster, and country-GM list from management; cross-check with corporate filings or signed
      officer certifications.
    relatedQuestionRefs:
      - QO007
      - QO008
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Cap table, board rights, liquidation preferences, secondary activity, and any debt facilities tied to the seed,
      Series A, or Series B.
    whyItMatters: >-
      Headline funding totals say little about economic control or founder dilution; downside scenarios and investor
      influence depend on these hidden terms.
    diligencePath: Request capitalization table, board consents, investor rights agreement, and debt schedule in the data room.
    relatedQuestionRefs:
      - QO008
      - QO010
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Audited revenue, ARR, gross margin, burn, runway, and cash balances.
    whyItMatters: >-
      A $2B valuation and a 2026 hiring plan cannot be judged properly without audited operating metrics and
      unit-economics context.
    diligencePath: >-
      Request audited or board-approved 2025 and 2026 YTD financial statements plus KPI bridge used in the Series B
      process.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: customer-count
    missingEvidence: >-
      Total paying customer count, top-customer concentration, ACV distribution, and cohort retention beyond the
      company's expansion statistic.
    whyItMatters: >-
      The platform narrative could still hide concentrated revenue or weak durability; logo count and ACV shape are
      essential to interpret the valuation.
    diligencePath: >-
      Request customer dashboard export or investor deck pages showing customer count, ACV buckets, churn, and
      concentration.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: headquarters-structure
    missingEvidence: >-
      Definitive clarification of the legal entity, incorporation jurisdiction, and how the Amsterdam HQ office relates
      to the privacy policy's Israel headquarters language.
    whyItMatters: >-
      Jurisdiction affects compliance, data transfer, tax, governance, and investor diligence; current public sources
      imply a split but do not reconcile it.
    diligencePath: >-
      Obtain the registered entity list, incorporation certificates, and a management explanation of operational versus
      legal headquarters.
    relatedQuestionRefs:
      - QO001
    relatedTableRefs:
      - TO001
  - type: stale
    severity: minor
    topic: headcount
    missingEvidence: Run-date-accurate headcount and office list that reconcile the 300-versus-350 discrepancy in March 2026 coverage.
    whyItMatters: Headcount is a volatile fact and the company intends to scale rapidly; public drift makes trend analysis fragile.
    diligencePath: Ask management for month-end headcount by country and function as of 2026-06-30.
    relatedQuestionRefs:
      - QO011
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: named-customers
    missingEvidence: >-
      Primary or independent corroboration for named customer examples beyond company-controlled materials and
      low-reputation reposts.
    whyItMatters: >-
      Customer proof becomes a central valuation input later in the report; weakly sourced logos can mislead if not
      independently verified.
    diligencePath: >-
      Validate named customer deployments against customer-owned press releases, case studies, or procurement records in
      the customers chapter.
    relatedQuestionRefs:
      - QO013
      - QO025
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table-coverage
    missingEvidence: Month-level dating for stealth exit, early angel funding, and the exact opening date of the Amsterdam HQ office.
    whyItMatters: >-
      The high-level chronology is strong enough for this chapter, but some early corporate milestones remain coarse,
      which weakens change-over-time precision.
    diligencePath: Request incorporation documents, early financing memos, and office-opening records to tighten the chronology.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: Vertical-by-vertical budget owner data, approval chain, and procurement timelines for Wonderful-like deployments.
    whyItMatters: >-
      Budget ownership is central to forecasting sales velocity and CAC efficiency, but public sources only let us infer
      likely buyers from use cases and survey respondents.
    diligencePath: >-
      Request CRM pipeline metadata or sales-ops material showing buyer titles, procurement stages, and time-to-close by
      vertical.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: sam-som
    missingEvidence: >-
      Geographic revenue mix, average contract values, and country-level deployment capacity needed to translate TAM
      into a rigorous Wonderful SAM/SOM model.
    whyItMatters: >-
      Without country and ACV data, the market chapter can narrow the addressable market conceptually but cannot produce
      a defensible obtainable-market number.
    diligencePath: >-
      Request internal planning model with region, vertical, and deployment-pod capacity assumptions; reconcile with
      staffing plans.
    relatedQuestionRefs:
      - QM021
      - QM022
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: deployment-economics
    missingEvidence: >-
      Public evidence for implementation cost, payback, and gross-margin differences between software-only and
      embedded-team deployment models.
    whyItMatters: >-
      Wonderful's market position depends on whether its service-heavy model compounds or compresses margins as it
