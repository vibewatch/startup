- id: mitigations-and-kill-criteria
  title: Mitigations, Monitoring Indicators, and Kill Criteria
  body: >-
    The reason Wonderful remains investable despite the stacked risk profile is that many of the risks are monitorable. Audit rights are either sufficient for buyers or not. Expansion either shows up in cohorts or it does not. Margin either improves as deployments scale or it remains constrained by headcount and inference cost. Security posture either satisfies regulated buyers in diligence or procurement slows materially.


    Investors should therefore translate the risk chapter into explicit kill criteria. A material security incident in a regulated account, a pattern of failed audits or exit disputes, or evidence that customer expansion does not offset deployment cost would all be strong negative signals. Conversely, audited retention, credible margin progression, and successful regulated-customer procurement would derisk the thesis quickly.


    The key diligence ask is not another marketing deck. It is an operating proof pack: cohort retention, top-customer concentration, deployment economics by mode, certification artifacts, incident history, and audit / exit outcomes for regulated customers.
  claimRefs:
  - CR037
  - CR038
