  claims:
  - id: CR001
    statement: Wonderful’s risk surface is unusually broad for a one-year-old company because it sells AI agents into regulated, customer-facing, multilingual enterprise workflows across many jurisdictions.
    type: inferred
    topic: risk-overview
    sourceRefs:
    - SR001
    - SR003
    - SR005
    - SR021
    - SR022
    - SR035
    - SR036
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR001
    - QR002
  - id: CR002
    statement: The Acceptable Use Policy explicitly ties the platform to the EU AI Act, EU DSA, and data-protection law, showing that regulatory posture is built into the commercial surface rather than handled off to the side.
    type: observed
    topic: regulatory
    sourceRefs:
    - SR001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR002
    - QR003
  - id: CR003
    statement: Wonderful explicitly prohibits using its services for automated decision-making with legal or similarly significant effects unless a human makes the final decision and required disclosures are given.
    type: observed
    topic: regulatory
    sourceRefs:
    - SR001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR003
    - QR004
  - id: CR004
    statement: The same policy explicitly bans lending decisions, candidate screening, biometric categorization, criminal-risk prediction, and certain professional-advice use cases, limiting some high-risk revenue surfaces.
    type: observed
    topic: regulatory
    sourceRefs:
    - SR001
    - SR031
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR003
    - QR004
  - id: CR005
    statement: The MSA shifts a meaningful share of compliance burden to customers, including lawful inputs, consents, disclosures, telephony laws, AI regulations, recording rules, and other sector-specific obligations.
    type: observed
    topic: legal
    sourceRefs:
    - SR002
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR005
  - id: CR006
    statement: The DPA covers a very wide compliance perimeter spanning EU, UK, Swiss, Israeli, and numerous US state privacy regimes.
    type: observed
    topic: legal
    sourceRefs:
    - SR003
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR006
  - id: CR007
    statement: Wonderful contractually commits to notify customers of security incidents involving customer data within 48 hours under the DPA.
    type: observed
    topic: legal
    sourceRefs:
    - SR003
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR007
  - id: CR008
    statement: The DORA addendum positions Wonderful as an ICT third-party service provider for in-scope EEA financial customers, which raises procurement and audit expectations far above normal SaaS buying.
    type: observed
    topic: regulatory
    sourceRefs:
    - SR005
    - SR032
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR007
    - QR008
  - id: CR009
    statement: 'Wonderful’s DORA posture is supportive but not fully open-ended: it substitutes third-party certifications, questionnaires, pooled testing, and tightly conditioned onsite audits for unrestricted regulator access.'
    type: observed
    topic: regulatory
    sourceRefs:
    - SR005
    - SR032
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR008
    - QR023
  - id: CR010
    statement: The DORA addendum also publishes explicit continuity targets of 12-hour RTO and 1-day RPO for customer data, which are helpful but may still be demanding for mission-critical FSI workflows.
    type: observed
    topic: operational
    sourceRefs:
    - SR005
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR007
    - QR027
  - id: CR011
    statement: 'The Data Act addendum gives Wonderful a portability story, but only a partial one: exportable data excludes analytics information, prompts from professional services, custom-built services, and certain non-commercial-scale materials.'
    type: observed
    topic: regulatory
    sourceRefs:
    - SR006
    - SR033
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR009
    - QR025
  - id: CR012
    statement: That means switching risk may remain material for bespoke customers even though marketing emphasizes openness and easy exit.
    type: inferred
    topic: regulatory
    sourceRefs:
    - SR006
    - SR012
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR009
    - QR025
  - id: CR013
    statement: The SLA gives customers a 99.9% availability commitment, but service credits are the sole remedy and multiple failure categories are excluded from the commitment.
    type: observed
    topic: legal
    sourceRefs:
    - SR004
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR010
    - QR027
  - id: CR014
    statement: 'The MSA is vendor-protective in several ways: services are provided on an as-is / as-available basis outside express warranties, beta services get weaker protections, and third-party system failures outside Wonderful’s control are disclaimed.'
    type: observed
    topic: legal
    sourceRefs:
    - SR002
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR010
    - QR028
  - id: CR015
    statement: The MSA allows Wonderful to add, modify, replace, or discontinue third-party systems, provided overall functionality is not materially decreased, which creates integration-change risk for customers.
    type: observed
    topic: dependency
    sourceRefs:
    - SR002
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR010
    - QR011
  - id: CR016
    statement: 'The credit-based commercial model introduces another operational risk: if credits are insufficient, service may be suspended or limited until additional credits are purchased.'
    type: observed
    topic: financial
    sourceRefs:
    - SR002
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR010
    - QR020
  - id: CR017
    statement: 'Privacy risk is not abstract here: Wonderful’s legal stack explicitly contemplates support-call audio, phone numbers, personal data, and regulated sector usage.'
    type: observed
    topic: legal
    sourceRefs:
    - SR003
    - SR007
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR006
    - QR024
  - id: CR018
    statement: Wonderful’s own product commentary repeatedly says the hard part is running agents responsibly in production, not merely building them, which is both a strength and an admission of ongoing operational fragility.
    type: company-claimed
    topic: operational
    sourceRefs:
    - SR009
    - SR010
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR013
    - QR021
  - id: CR019
    statement: The computer-use capability expands addressable workflows but also introduces fragile UI-level dependencies, credential-handling risk, and a larger operational blast radius if legacy systems change.
    type: inferred
    topic: operational
    sourceRefs:
    - SR011
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR012
    - QR013
  - id: CR020
    statement: Supporting multi-tenant, single-tenant, BYOC, and on-prem deployment models at once broadens security, support, and testing complexity.
    type: observed
    topic: operational
    sourceRefs:
    - SR008
    - SR026
