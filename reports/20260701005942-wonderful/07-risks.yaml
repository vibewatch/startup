- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Security / privacy failure
    - Material incident or regulator notification
    - Any flagship regulated-customer incident with exposed customer data
    - Pause conviction until incident scope, cause, and churn impact are understood
  - - Audit / regulatory friction
    - Procurement slippage in FSI or sovereign deals
    - Multiple lost or stalled deals due to audit, DORA, or portability objections
    - Lower confidence in regulated-enterprise wedge
  - - Expansion / retention miss
    - Cohort data
    - Expansion claim fails to convert into strong GRR/NRR or logo retention
    - Re-rate growth multiple and question services-heavy model
  - - Margin compression
    - Gross margin / deployment-cost trend
    - Inference or labor cost rises faster than ARR scaling
    - Model shifts from software-like to hybrid services risk
  - - Dependency shock
    - Model / cloud / partner outage or policy change
    - Repeated third-party disruptions materially degrade customer performance
    - Increase residual dependency risk and stress-test churn exposure
  - - Execution overload
    - Hiring and service quality metrics
    - Rapid headcount growth coincides with deployment delays or customer dissatisfaction
    - Treat scaling plan as a risk amplifier rather than moat
  notes: These triggers are designed to convert narrative risk into observable diligence checkpoints.
