- id: named-customer-proof
  title: Named Customer Proof and Production Evidence
  body: >-
    Public customer proof is one of Wonderful’s strengths. The company has moved beyond anonymous logo walls and published multiple named deployment stories with time-to-production, workflow descriptions, executive quotes, and operating metrics. Bank Hapoalim, Banco Caja Social, Telefónica Colombia, OTE / Cosmote TV, PPC Energie, and Bezeq all provide at least one meaningful production signal. Even when the sources are company-authored, the amount of operational detail is unusually high for a startup this young.


    The strongest customer stories sit in banking and telecom. Hapoalim shows both an initial fast-deployment use case and later internalization by the bank’s own team. Banco Caja Social shows two agents on a shared foundation inside the same account. Telefónica and OTE show that Wonderful can displace or outperform prior automation in large-volume telecom support. PPC Energie broadens the proof set into utilities, while Bezeq adds another named telco reference with concrete satisfaction and efficiency changes.


    The healthcare proof is a notable contrast. Wonderful clearly wants healthcare to be a target segment, but the retained public evidence is still thinner there: the case page lacks the named-account specificity and measured outcomes seen in banking and telecom.
