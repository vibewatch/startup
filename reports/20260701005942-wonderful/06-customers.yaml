- id: TU006
  title: Public retention-cohort substitution table
  columns:
  - Requested signal
  - Public evidence found
  - Why figure was not rendered
  - What to request
  rows:
  - - Customer cohort retention percentages
    - None in reviewed sources
    - No numeric time-bucket series exists to support a cohort figure
    - Monthly or annual retention by cohort and solution
  - - NRR / GRR
    - No public disclosure
    - No public percentage series to chart
    - NRR, GRR, contraction, and churn bridge
  - - Renewal rate / contract tenure
    - No quantified public disclosure
    - No time-bucket retention series
    - Median contract term, renewal windows, and renewal rate
  - - Top-customer concentration
    - No public revenue concentration disclosure
    - Cannot infer concentration from case-study prevalence
    - Top-10 customers as % of ARR and usage
  - - Independent complaint trend
    - Trustpilot shows 1 review; PeerSpot is shallow; no rich enterprise review corpus found
    - Insufficient independent time-series quality signal
    - Current complaint counts, customer escalations, and third-party references
  notes: This substitution table exists because the public record cannot support a valid numeric retention-cohort figure.
