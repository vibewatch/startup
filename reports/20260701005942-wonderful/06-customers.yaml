- id: concentration-and-diligence-risks
  title: Concentration, Channel, and Diligence Risks
  body: >-
    The public evidence base is concentrated in two ways. First, it is concentrated by vertical: telecom and financial services dominate the strongest named proofs. Second, it is concentrated by evidence type: most high-signal proof is Wonderful-authored, even when it includes named customers and direct executive quotes. That does not make the evidence false, but it does limit how confidently an investor can underwrite durability from public materials alone.


    Customer concentration is therefore a live diligence issue. Wonderful may have many accounts, but the public story still depends heavily on a handful of flagship references. The company’s forward-deployed, local-team model likely helps win and expand these customers, especially in multilingual or highly regulated markets, but it may also make revenue more services-like if deployments require too much hands-on support.


    McKinsey and similar partners improve credibility and potentially help sourcing, but they do not solve the core unknowns. Before underwriting revenue quality, diligence should request cohort retention, renewal cadence, top-account concentration, and expansion-revenue bridges by customer segment and geography.
