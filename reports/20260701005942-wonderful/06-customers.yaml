    - Billing, troubleshooting, technician scheduling, upsell, surveys
    - Multiple named deployments (Telefónica, OTE/Cosmote TV, Bezeq)
    - Likely core wedge because of high call volumes and measurable containment economics
    - No segment ARR or logo count disclosed
  - - Financial services
    - 'Payer: banking operations / AI teams; users: retail customers, collections ops, service teams'
    - Appointment scheduling, savings campaigns, collections, inbound service
    - Multiple named deployments (Bank Hapoalim, Banco Caja Social)
    - High strategic value due to regulated workflows and land-and-expand potential
    - No contract lengths or bank-specific revenue exposure disclosed
  - - Healthcare
    - 'Payer: provider operations; users: patients and staff'
    - Appointment booking, emergency info, postnatal support, care coordination
    - Official vertical page plus one unnamed case
    - Strategically attractive but less proven publicly
    - Named account and operating metrics absent
  - - Utilities / energy
    - 'Payer: customer operations; users: residential/business customers'
    - Billing, proof-of-payment, contract inquiries
    - Named PPC Energie deployment
    - Shows adjacent expansion beyond telco/banking
    - Only one public utility proof
  - - Geographic expansion markets
    - 'Payer: local enterprise buyers; users vary by workflow'
    - Localized customer care, collections, back office, sales
    - 30+ countries claimed; launches in Singapore, Australia, APAC
    - Supports global TAM and multilingual differentiation
    - Public APAC customer roster remains thin
  notes: Wonderful’s public customer footprint is broad enough to show a real enterprise wedge, but the strongest proof remains concentrated in telecom and financial services.
