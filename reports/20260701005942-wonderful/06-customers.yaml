- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Land-and-expand from first workflow to second agent or adjacent process
    - Expansion claim may overstate durability if first deployments are heavily services-assisted
    - Could drive strong NRR, or could mask labor-heavy account economics
    - Request cohort expansion by revenue and hours of FDE involvement per account
  - - Deep penetration in banking and telecom
    - Public proof is vertical-concentrated
    - Large exposure to a few regulated-service sectors may increase downturn or procurement risk
    - Request revenue mix by vertical and top-10 customers
  - - Geographic local-team model
    - New-market proof trails new-market hiring
    - Expansion may outrun proof in APAC or Australia
    - Request customer counts and pipeline by region
  - - Named flagship references
    - Public story may be over-reliant on a handful of lighthouse accounts
    - Loss or slowdown at one flagship could damage narrative and revenue mix
    - Request logo concentration and share of ARR from flagship accounts
  - - Partner credibility channels (McKinsey, investors, Marketplace)
    - Channel credibility may be mistaken for retention proof
    - Improves enterprise access but does not validate renewal quality
    - Separate sourced pipeline from renewal economics
  notes: The public record supports expansion pathways, but concentration disclosure is absent.
