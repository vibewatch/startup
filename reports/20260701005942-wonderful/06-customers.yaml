- id: adoption-expansion-and-durability
  title: Adoption, Expansion, and Durability Signals
  body: >-
    Adoption signals are credible but uneven. On the positive side, several named deployments include interactions, call counts, containment, deflection, satisfaction, or time-to-production metrics. Index Ventures and TechCrunch also corroborate that Wonderful was already processing large interaction volumes quite early in its life. In addition, the company repeatedly claims that more than 70% of enterprises starting with one use case expand into additional workflows within three months.


    There is also account-level evidence for reuse. Hapoalim reused an existing tool foundation for a new savings workflow. Banco Caja Social launched a second service agent shortly after María. These stories help the expansion claim feel more plausible than pure marketing. Still, the expansion proof is not the same thing as retention proof. Public materials do not disclose NRR, GRR, churn, renewal rate, contract length, or top-customer revenue share.


    Independent review-platform evidence is therefore important — and currently thin. FeaturedCustomers offers some curated customer references, but PeerSpot is more of an overview page and Trustpilot shows only a single review. The net result is that Wonderful looks stronger on deployment success than on externally verifiable customer durability.
  claimRefs:
