- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - ARR / revenue run rate
    - Cannot translate $2B valuation into a defensible multiple
    - Obtain monthly recurring revenue bridge and audited annual revenue
  - - Gross margin by stream
    - Cannot judge whether Wonderful scales like software or services
    - Request margin waterfall separating inference, cloud, support, and implementation
  - - GRR / logo churn
    - Cannot assess durability independent of expansion
    - Request cohort retention table by vintage and by geography
  - - CAC and payback
    - Cannot judge whether growth is efficient or simply capital-intensive
    - Request pipeline-to-close data, blended CAC, and payback by segment
  - - Contract structure and discounting
    - Cannot evaluate pricing power or renewal risk
    - Review recent order forms, expansion amendments, and discount schedules
  - - Regional revenue mix
    - Cannot tell whether geographic expansion is profitable or symbolic
    - Request revenue and gross margin by region and by deployment pod
  - - Cloud / model commitments
    - Cannot quantify hidden capital intensity or vendor concentration
    - Review hyperscaler spend, reserved commitments, and model-provider concentration
  notes: These are not cosmetic data requests. Together they determine whether Wonderful is a premium software compounding story or a labor- and compute-heavy deployment business.
