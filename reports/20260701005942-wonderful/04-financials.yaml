    - Customer team takes over more building while staying on platform
    - Embedded in broader contract rather than standalone list SKU
    - Case-study evidence exists, standalone monetization unclear
    - Unclear — can reduce services burden but also reduce billable labor
    - Clarify how knowledge transfer affects revenue and margin per customer over time
  notes: Wonderful’s public materials do not provide a formal revenue-mix disclosure, so rows reflect the most defensible streams implied by pricing language, job roles, and case studies.
