  - - Post-go-live optimization
    - Monitoring, iteration, governance, workflow expansion
    - Ongoing service + platform usage
    - Strongly implied by case studies and local-team model
    - Medium-high if it drives expansion rather than one-off labor
    - Break out managed-service or optimization revenue from core platform usage
  - - Expansion to additional workflows
    - Reuse existing foundation to activate new use cases
    - Per new workflow / module / market
