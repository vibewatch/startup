  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: win-loss
    missingEvidence: Public win-loss rates versus Salesforce, ServiceNow, Zendesk, and Microsoft by segment and geography.
    whyItMatters: Without repeated competitive outcome data, it is hard to know whether Wonderful’s differentiation is narrative or consistently commercial in the field.
    diligencePath: Request CRM-level win-loss data, segmented by incumbent, workflow, region, and reason code.
    relatedQuestionRefs:
    - QP017
    - QP018
    - QP021
    relatedTableRefs:
    - TP001
    - TP004
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized ACVs, discount ranges, implementation fees, and margin profile versus seat- and usage-based competitors.
    whyItMatters: Pricing structure determines whether Wonderful can defend premium positioning or gets commoditized into a services-heavy sale.
    diligencePath: Request standard order forms, recent deal desk summaries, and gross-margin contribution by delivery model.
    relatedQuestionRefs:
    - QP015
    - QP016
    - QP021
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: minor
    topic: retention-vs-openness
    missingEvidence: Evidence that open exportability shortens initial sales cycles or improves retention despite reducing lock-in.
    whyItMatters: Wonderful explicitly bets against traditional platform lock-in; investors need proof that this choice improves commercial outcomes.
    diligencePath: Interview customers and sales leaders on procurement objections, migration risk, and renewal behavior tied to openness.
    relatedQuestionRefs:
    - QP006
