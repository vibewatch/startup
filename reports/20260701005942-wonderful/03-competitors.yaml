- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Primary threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Forward-deployed local teams
    - Large suites improve partner ecosystems and reduce implementation pain enough to make specialist services less unique
    - High
    - Ask for win-loss data in regulated multilingual deals and proof that local teams materially improve conversion or retention
  - - Model-agnostic architecture
    - Competitors also move toward multi-model or third-party-agent compatibility
    - Medium
    - Request benchmark evidence that Wonderful selects materially better models or workflows than bundled alternatives
  - - Open exportability and API surface
    - Lower lock-in makes it easier for a customer to migrate later if a suite becomes good enough
    - Medium-High
    - Review retention/churn by cohort and whether openness meaningfully shortens initial enterprise sales cycles
  - - Multilingual and regulated-market focus
    - Incumbents localize over time and hire regionally, narrowing Wonderful’s language and compliance edge
    - Medium
    - Request evidence of countries or verticals where Wonderful repeatedly wins because local adaptation mattered
  - - Execution depth from pilot to production
    - Headcount-heavy scaling becomes costly or operationally brittle as the company expands from 350 to ~900 employees
    - High
    - Diligence staffing productivity, deployment-pod economics, and manager-to-engineer leverage before underwriting premium valuation
  notes: Severity ratings are analyst judgments based on public evidence as of July 2026. Wonderful’s moat appears execution-led rather than structurally closed.
