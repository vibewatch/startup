- id: pricing-packaging-and-distribution
  title: Pricing, Packaging, and Distribution Power
  body: >-
    The most visible commercial divide in this market is between transparent productized pricing and consultative enterprise selling. Salesforce publishes multiple meters: free evaluation, Flex Credits, per-conversation pricing, and employee-facing add-ons. Microsoft publishes credit packs and pay-as-you-go pricing. Intercom and Zendesk each expose a comprehensible structure built from seats and usage. ServiceNow exposes packaging and feature ladders even where dollar values remain quote-led.


    Wonderful is taking a different route. Its public materials emphasize a flexible consumption model, transparent pricing logic, and no setup fees, but not a public price card. That is consistent with a sale that depends on deployment intensity and integration depth rather than a standardized SKU. The trade-off is obvious. Wonderful can keep commercial alignment closer to customer value, but it also leaves buyers with less early comparability than they get from Intercom, Zendesk, or Microsoft.


    Distribution amplifies the issue. Salesforce, ServiceNow, and Microsoft can sell AI agents into accounts that already rely on their workflow, CRM, or workplace layers. Wonderful instead has to win by proving that a dedicated operating layer plus embedded teams creates more value than a bundled feature. That is possible, but it requires repeated win-loss proof in the field rather than narrative alone.
