- id: final-call-and-diligence
  title: Final Recommendation, Exit Readiness, and Diligence Asks
  body: >-
    The right IC-ready call is RESEARCH-MORE with medium confidence, high risk, and a rich valuation stance. That is not a rejection of Wonderful. It is a recognition that the company is strong enough to deserve deeper work, but not transparent enough to deserve price-insensitive conviction.


    Exit readiness is also mixed. Wonderful looks good for later private rounds and may eventually become strategic-acquisition material for a large workflow or CX platform. But it does not yet look IPO-ready from a disclosure standpoint. Too many core metrics remain narrative-only.


    Diligence should therefore focus on the few variables that would change the recommendation fastest: retention, margin, concentration, preference stack, and regulated-customer audit outcomes. If those come back strong, the current price may look more sensible. If they do not, the headline valuation will look increasingly hard to defend.
