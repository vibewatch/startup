- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Retention / expansion miss
    - NRR / GRR or workflow expansion materially below expectation
    - Breaks the premium-growth justification
    - Re-rate toward lower-multiple workflow software
  - - Gross-margin disappointment
    - Inference or local-team costs prevent software-like margin progression
    - Weakens the “platform, not services” narrative
    - Tighten price discipline or pass
  - - Security / compliance incident
    - Material incident in a flagship regulated account
    - Damages trust, slows enterprise procurement, and raises churn risk
    - Pause or step back until root cause and customer impact are known
  - - Audit / portability friction
    - Repeated regulated deals stall on DORA, audit, or exit terms
    - Challenges the claim that Wonderful can scale cleanly into FSI-grade accounts
    - Lower conviction in TAM capture and sales efficiency
  - - Preference overhang surprise
    - Investor terms are materially more senior or protective than expected
    - Cuts real return potential for new entrants
    - Re-underwrite on fully diluted / liquidation-stack basis
  notes: These are the fastest paths from a strong narrative to a weaker investment outcome.
