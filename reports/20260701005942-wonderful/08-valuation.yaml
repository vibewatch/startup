- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Revenue scales to roughly $250M-$300M over the next few years; retention and expansion prove strong; gross margin looks software-like
    - At ~12x-15x revenue, value range roughly $3.0B-$4.5B; current entry can still work
    - Needs exceptional execution on retention, margin, and hiring
    - Possible but not yet the most evidence-supported case
  - - Base
    - Revenue reaches roughly $140M-$200M; customer proof remains good but services intensity and disclosure gaps persist
    - At ~8x-10x revenue, value range roughly $1.2B-$2.0B; investor mostly grows into current mark
    - Flat-to-modest upside does not compensate well for current uncertainty
    - Most consistent with public evidence today
  - - Bear
    - Revenue reaches only roughly $60M-$100M or margin/retention disappoints materially
    - At ~4x-7x revenue, value range roughly $0.3B-$0.7B; meaningful downside from current mark
    - Multiple compression plus services-heavy economics can hurt hard
    - Very plausible if expansion or margin thesis breaks
  notes: Ranges are scenario-based underwriting estimates, not claims about current intrinsic value.
