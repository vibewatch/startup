  - CV039
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Retention
    - NRR, GRR, logo churn, renewal cadence
    - Most important missing proof for premium valuation support
    - Finance / CRO / board materials
  - - Margins
    - Gross-margin waterfall by deployment mode and inference provider
    - Determines whether Wonderful scales like software or a hybrid services business
    - Finance + engineering cost review
  - - Concentration
    - Top-10 customer revenue and usage share by vertical / geography
    - Reveals fragility behind headline customer proof
    - Revenue analytics / board deck
  - - Preference stack
    - Liquidation preferences, ratchets, anti-dilution, secondary dynamics
    - Directly affects return to a new investor at the current price
    - Legal diligence + financing docs
  - - Regulated-customer procurement
    - Completed security questionnaires, audit outcomes, DORA / portability objections
    - Validates whether regulated demand converts efficiently
    - Security / sales / legal diligence
  - - Incident history
    - Security, uptime, and customer-escalation record
    - Separates polished controls from battle-tested operations
    - Trust / SRE / customer-support diligence
  notes: If these six asks come back strong, the current recommendation can move materially.
