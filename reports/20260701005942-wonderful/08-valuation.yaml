company:
  name: Wonderful
chapter:
  number: 8
  title: Valuation
  summary: 'Wonderful looks like a real, high-quality enterprise AI company — but the public evidence does not yet justify price-insensitive conviction at a $2 billion valuation. The strongest pro case is product depth plus unusually concrete early customer proof. The strongest anti-thesis is that public revenue is still only described as “tens of millions,” while retention, margin, concentration, and preference-stack data remain undisclosed. Public software comparables trade roughly 1.4x-7.3x revenue, whereas Wonderful’s implied multiple is likely many times higher if current revenue is only $20M-$50M. The chapter’s final call is RESEARCH-MORE: high-quality company, rich valuation, medium confidence, high risk.'
sections:
- id: thesis-and-price-discipline
  title: Investment Thesis, Anti-Thesis, and Price Discipline
  body: >-
    Wonderful has enough substance that a serious investor cannot dismiss it as a superficial AI wrapper. The company has real enterprise product depth, unusually concrete customer proof for its age, and a market narrative that fits current budget migration toward AI agents and workflow automation. In that sense, the investment thesis is real.


    The problem is price discipline. Public evidence still does not show the cohort retention, gross margin, customer concentration, or preference-stack clarity that would let an investor underwrite a $2 billion mark with confidence. The anti-thesis is therefore not that Wonderful lacks promise; it is that the company may still be too services-heavy, too operationally complex, and too thinly disclosed for the current entry price.


    That distinction matters. At a lower price, the same company might be an easy “selective yes.” At the current price, the burden of proof shifts materially upward.
