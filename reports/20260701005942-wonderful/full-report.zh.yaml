        - 法律尽调 + 融资文件
      - - 受监管客户采购
        - 已完成的安全问卷、审计结果、DORA / 可迁移性异议
        - 验证受监管需求能否高效转化
        - 安全 / 销售 / 法律尽调
      - - 事故历史
        - 安全、正常运行时间与客户升级记录
        - 区分打磨过的控制项和经实战检验的运营能力
        - 信任 / SRE / 客户支持尽调
    notes: 如果这六项追问的反馈都强，目前的投资建议可以实质上调。
    claimRefs:
      - CV033
      - CV038
      - CV039
      - CV040
