          detail: 管理者和审核员使用的应用、操作员审批界面和仪表盘
        - label: 运行时 + 编排
          detail: 智能体运行时、A2A 交接，以及执行流程步骤的工具 / 技能目录
        - label: 构建 / 评估层
          detail: Agent Studio、自然语言构建流程、脚本化测试和 A/B 测试控制
        - label: 治理 + 可观测性
          detail: 推理轨迹、问题跟踪、告警，以及用于生产治理的策略控制
        - label: 数据 / 系统访问
          detail: RAG 来源、自定义工具、遗留系统 VM 控制，以及记录系统访问
        - label: 部署底座
          detail: 多租户、单租户、BYOC 和本地部署模式
