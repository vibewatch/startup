      - number: '4.2'
        title: GTM 动作与部署经济性
        blocks:
          - type: paragraph
            body: >-
              Wonderful 的商业动作明显偏顾问式。招聘页面把部署策略师、前线部署工程师和企业 GTM 人员分成不同角色； McKinsey 合作也把 Wonderful
              放进大型转型项目，而不是独立软件采购。这与一种业务相一致：公司靠解决客户环境中的复杂实施问题取胜， 不是让团队刷信用卡后自行开始构建。


              案例研究让经济性更具体。Bank Hapoalim 的部署复用了 Wonderful 前线部署工程师最初构建的工具， 并让新的内部负责人在三周内进入生产；预期月交互量约 40,000，报告拦截率
              88%。Banco Caja Social 在 19 天内上线， 提升了付款承诺转化率，随后在同一底座上增加第二个服务 agent。这些例子暗示，首次部署很可能昂贵且集成很重，
              但后续工作流可以跑在可复用管道之上。


              这就是该模式的核心经济承诺：用更高的前期销售和部署投入，换取落地后扩张。风险同样明显。如果复用慢于承诺， 或每个国家都需要几乎从零组建部署小队，这个模式会比软件更像服务。
