      - number: '5.4'
        title: 信任、安全、隐私与质量控制
        blocks:
          - type: paragraph
            body: >-
              Wonderful 的公开法律和运营材料显示，公司具备有意义的企业控制栈。SLA 承诺平台月可用性 99.9% 并提供服务积分，
              让可靠性成为合同义务。隐私政策明确说明，客服通话音频和电话号码可能被处理；这很重要，因为它意味着隐私、存储和安全控制是架构的一部分。 DPA 还加入违规通知时限、子处理方治理、审计权以及 ISO 27001
              证书引用。


              在产品层面，信任姿态不只是法律文件。Build 界面强调护栏和脚本化测试。Monitor 暴露推理轨迹、告警、问题跟踪， 并实时执行业务政策。Product Overview 和 Series B
              公告又加入自愈设计和基于 harness 的评估。 Banco Caja Social 的 AI-as-a-judge 模型，是治理逻辑嵌入部署内部的具体例子。


              唯一保留意见是公开深度。法律栈扎实，但公开 API 文档和深层技术信任工件，比围绕开放性的营销语言更轻。 控制叙事可信；外部可验证性仍不完整。
