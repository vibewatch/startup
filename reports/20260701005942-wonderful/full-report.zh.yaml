      - number: '6.4'
        title: 集中度、渠道和尽调风险
        blocks:
          - type: paragraph
            body: >-
              公开证据有两层集中。第一是垂直行业集中：电信和金融服务占据了最强的具名证明。第二是证据类型集中：大多数高信号证明都由 Wonderful
              自己发布，即使其中包含具名客户和高管原话。这不意味着证据虚假，但确实限制了投资人仅靠公开材料判断耐久性的把握。


              因此，客户集中度是一个需要实时核查的尽调问题。Wonderful
              可能已有很多账户，但公开叙事仍高度依赖少数旗舰案例。公司的前置部署、本地团队模式可能有助于拿下并扩张这些客户，尤其是在多语言或高监管市场；但如果部署需要太多人工支持，收入也可能变得更像服务。


              McKinsey 等合作伙伴提高了可信度，也可能帮助获客，但解决不了核心未知数。判断收入质量之前，尽调应要求公司按客户细分和地域提供分群留存、续约节奏、头部账户集中度，以及扩张收入桥。
