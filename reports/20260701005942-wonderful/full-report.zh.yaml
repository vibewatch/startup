chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与运营模式
        blocks:
          - type: paragraph
            body: >-
              Wonderful 把自己定位成服务关键工作流的企业 AI 平台，而不是狭义聊天机器人。官网、关于页面和长篇平台文章反复传递同一条核心信息： 企业需要一层受治理、模型无关的操作层，把 AI
              跑在客户、员工和后台工作流上。产品按多渠道销售，覆盖语音、聊天、邮件和特定工作流界面； 公司强调，一个控制面之下可以跑任何模型、任何模态和任何用例。


              更有辨识度的是交付模式。Wonderful 并不把成败只押在模型选择上。公司称，部署之所以跑得通，是因为平台软件要配上本地嵌入式部署团队、 前线部署工程师和战略伙伴，他们都在客户环境中工作。Wonderful
              卖进的是受监管、集成很重的企业场景，工作流重构、合规和集成工作本来就是产品体验的一部分， 所以这一点很关键。公司反复强调，AI 转型是运营模式变化，不是标准 SaaS
              上线；这也解释了为什么公开叙事大量强调本地执行、共享企业底座， 以及首个部署之后的重复用例扩张。


              产品叙事足够宽，能覆盖客服自动化、内部支持、入职、合规和其他企业工作流。公开材料还把模型可选性、基于技能的上下文工程、持续评估和可观测性列为关键功能。 简言之，Wonderful 想成为全栈企业 AI
              执行层，而不只是会话界面供应商。
