  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: >-
              Wonderful 不发布传统 SaaS 价目表。最强的公开定价信号来自其 Microsoft Marketplace 列表：
              公司使用灵活消耗模型、不收设置费、定价透明，并采用长期对齐结构。这组表述强烈暗示货币化与用量挂钩，而不是纯座席授权。 产品本身覆盖语音、聊天、邮件、Slack 和 API
              驱动工作流，说明收入可以靠更多交互、更多工作流，或同一客户基础上的更广部署来扩张。


              同时，Wonderful 也不是纯消耗 API 生意。公司反复强调本地部署、系统集成和上线后的优化。open-by-default 文章还主张， 客户应能导出自己的
              agents，并避免任意涨价。这对采购有吸引力，但也意味着 Wonderful 明确选择不依赖硬锁定来获得货币化权力。


              可能的含义是混合模式：与用量挂钩的平台收入，叠加实施密集型企业关系；客户激活更多工作流后，钱包份额随之扩大。
              如果扩张符合公司所说的三个月复用模式，收入质量可能很强。但由于标价、最低承诺和折扣未披露，准确经济性仍未验证。
