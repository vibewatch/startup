      - number: '4.4'
        title: 公开牵引、资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Wonderful 的可见牵引真实存在，但只被部分量化。TechCrunch 报道称，2025 年底公司每天处理数万次请求，解决率 80%。 公司和 The Next Web 都强调首个用例之后的强扩张行为；AI
              Business 称 Bloomberg 引用管理层说法， 到 2026 年 3 月收入为「数千万美元」。对于一家 2025 年成立的公司，这已经是有意义的规模； 但与严肃财务承销所需的精度相比，仍然模糊。


              相比之下，资本获取能力看起来很强。Wonderful 不到一年就从种子轮推进到 Series A 再到 Series B， 到 2026 年 3 月已披露融资达到
              $286M。管理层称，最新资本将投入平台建设，并支持员工数到年底从约 350 人扩张到约 900 人， 覆盖 30 多个国家。这种扩张说明公司不缺投资人需求，但也说明它在更完整披露之前就已经激进花钱。


              保留材料中没有公开证据显示，公司存在债务驱动的融资复杂性或制造业式资本开支。融资依赖更直接： 持续证明增长，持续展示可复用部署经济性，并最终披露足够多的利润率和留存数据，来支撑估值。如果披露滞后，
              资本也许仍然可得，但条款可能变差。
