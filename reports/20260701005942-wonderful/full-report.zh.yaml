  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资假设、反向假设和价格纪律
        blocks:
          - type: paragraph
            body: >-
              Wonderful 已有足够实质内容，严肃投资人不能把它简单打成浅层 AI 外壳。公司有真实的企业级产品深度、对其阶段来说异常具体的客户证明，以及符合当前预算向 AI
              智能体和工作流自动化迁移的市场叙事。从这个意义上说，投资假设成立。


              问题在价格纪律。公开证据仍没有给出分群留存、毛利率、客户集中度或优先权栈清晰度，无法让投资人有把握地承销 $2B 估值。反向假设并不是 Wonderful
              缺少前景，而是按当前入场价看，公司可能仍然服务属性太重、运营复杂度太高、披露太薄。


              这个区别很重要。价格更低时，同一家公司可能很容易成为“选择性 yes”。在当前价格下，证明负担明显上移。
