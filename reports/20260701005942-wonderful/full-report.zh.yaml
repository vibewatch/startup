      - number: '2.3'
        title: 买方地图、垂直适配与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方通常不是单一联络中心经理。Wonderful 式部署位于企业技术、运营和业务单元所有权交叉处， 这意味着
              CIO、CTO、COO、首席客户官和客户体验负责人往往共同决定预算。用户又覆盖支持负责人、运营团队、坐席、合规职能，
              以及工作流被自动化的领域负责人。这会让预算归属变得混乱且带政治性，尤其在大型企业里，AI、数据和客服工具常常处在不同孤岛。


              工作流复杂度和信任要求都高的地方，垂直适配最清楚。金融服务同时具备高错误成本、合规负担和为准确自动化付费的强意愿。
              电信拥有海量交互和频繁的多语言或跨渠道服务需求。医疗、零售、旅行和媒体则各自叠加合规、个性化和全天候服务压力。


              企业通常先从一个高影响工作流起步，验证后再在共享架构上扩张，这时采用最容易跑通。McKinsey 和 Wonderful 都反对大范围同步试验。
              重点不是尽可能点亮更多试点，而是选择一个能沉淀可复用集成、治理模式和内部信心的工作流，让后续部署更容易，而不是更碎片化。
