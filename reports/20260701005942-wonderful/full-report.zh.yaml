  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Wonderful 面对的不是一个干净的同业组。它的竞争场分成三圈。第一圈是为客服或 agentic 工作流自动化而生的 AI 原生专门厂商：
              Cognigy、Ada、Forethought，以及在某些采购路径中的 Intercom。第二圈是在既有平台装机基础上加入 AI agents 的企业套件巨头：
              Salesforce、ServiceNow、Zendesk 和 Microsoft。第三圈是替代方案：内部自建、更窄的点工具，或大型企业认为现有 CRM、ITSM、 工作场所软件已经足够好。


              到 2025 年底，公开报道已经把这个类别视为拥挤市场。Wonderful 完成 Series A 时，TechCrunch 称市场拥挤； The Next Web 后来也直接点名 Salesforce
              Agentforce 和 ServiceNow 是争夺同一企业预算线的竞争对手。 这很重要，因为 Wonderful 卖的不是新奇类别，而是一个买方可以把雄心勃勃的专门厂商与可信巨头的捆绑功能集相比较的预算线。


              Wonderful 的回答是把自己作为操作层竞争，而不是 bot。公司认为，只有技术和部署一起设计，AI 才能规模化； McKinsey 合作也强化了这一定位，让 Wonderful
              站在复杂遗留技术栈之上，而不是对抗单一工作流。 因此，产品广度、交付能力、定价模式和装机基础杠杆会同时决定格局。
