        title: 乐观 / 基准 / 悲观承销
        blocks:
          - type: paragraph
            body: >-
              乐观情景并不荒唐。如果 Wonderful
              真能把当前部署证明复利成数亿美元收入，并跑出软件化经济性，当前轮次仍可能产生可接受回报。公司具备支撑这个故事的正确要素：强产品深度、清晰的企业痛点，以及早期部署可以扩张到新工作流的客户证据。


              基准情景没那么令人兴奋。在更普通的结果里——增长不错、客户扎实，但利润率证明不完整且有一些服务拖累——Wonderful
              可能只是靠增长消化当前估值，而不是大幅跑赢估值。对按当前全价进入的新投资人来说，这不是有吸引力的组合。


              悲观情景有意义，因为价格已经很高。如果留存、利润率或采购摩擦让人失望，即使公司仍是真实业务，估值也可能大幅压缩。这种不对称性使场景分析比品类热情更重要。
