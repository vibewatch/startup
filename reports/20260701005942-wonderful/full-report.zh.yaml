        blocks:
          - type: paragraph
            body: |-
              可上 IC 的结论是 RESEARCH-MORE：中等信心、高风险、估值偏贵。这不是否定 Wonderful，而是承认公司强到值得继续深挖，但透明度还不足以支撑不计价格的投资确信。

              退出准备度也参差不齐。Wonderful 适合后续私募轮，也可能最终成为大型工作流或 CX 平台的战略收购标的。但从披露角度看，它还不像已准备好 IPO。太多核心指标仍停留在叙事层面。

              因此，尽调应聚焦最能快速改变建议的少数变量：留存、利润率、集中度、优先权栈，以及受监管客户的审计结果。如果这些结果强，当前价格可能更合理；如果不强，名义估值会越来越难辩护。
