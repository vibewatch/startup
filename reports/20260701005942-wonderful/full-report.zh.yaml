      - number: '1.5'
        title: 里程碑、合作伙伴与负面信号
        blocks:
          - type: paragraph
            body: >-
              核心里程碑序列很清楚。Wonderful 于 2025 年初创立，2025 年 7 月完成 $34M 种子轮，2025 年 11 月完成 $100M Series A， 2026 年 3 月又完成 $150M
              Series B。围绕这条融资节奏，公司推进了更大的叙事：走出隐身模式、扩张到数十个国家、 开设阿姆斯特丹总部办公室、在 Abu Dhabi 和 Dubai 扩大中东业务，并在 2026 年 4 月宣布与
              McKinsey 和 QuantumBlack 结盟， 把战略工作与生产部署结合起来。


              公开里程碑语言也强调部署后的复利。Wonderful 称，超过 70% 从单一用例开始的企业会在三个月内扩展到更多工作流； 公司还宣传可量化运营结果，例如处理时长最高下降 60%、拦截率超过
              80%、效率收益达数百万美元。这些都是积极信号， 但仍是公司或投资方主张，不是经审计的运营指标。


              负面框架主要来自可信技术媒体。The Next Web 明确指出，关键问题是 Wonderful 的本地部署护城河能否在拥挤的企业 AI agent 市场中规模化保持。 TechCrunch
              更早提出类似观点，认为投资人必须相信它不只是又一个 GPT 外壳。这些担忧没有推翻投资论点； 但它们说明，市场检验 Wonderful
              的估值和交付模式时，看的是执行，而不仅是产品新颖性。后续章节也应该用这个视角审视。
