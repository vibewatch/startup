      - number: '8.2'
        title: 融资背景和可比估值组
        blocks:
          - type: paragraph
            body: >-
              公开融资背景很清楚：Wonderful 于 2026 年 3 月以 $2B 估值完成 $150M Series B，总披露融资额达到约
              $286M。不清楚的是，当前收入和耐久性究竟能在多大程度上支撑这个价格。最好的公开收入披露仍只是“数千万美元”，这让隐含倍数可能落在很宽的区间。


              公开可比公司不能消除这种不确定性，但能给出框架。按 2026 年 7 月市值和收入数据，相关软件公司收入倍数大致从 1.4x（Five9）到
              7.3x（ServiceNow）不等，其他工作流和自动化公司通常在低到中个位数。Wonderful
              可以相对这些公司享有溢价，因为它更早期、增长更快，也仍带有稀缺性估值。但当前估值看起来需要一个非常大的溢价——仅靠公开数据很难证明。


              关键结论是：Wonderful 显得贵，不是因为业务看起来弱；而是因为名义估值已经计入了很大一部分未来成功。
