  summary: >-
    Wonderful 是一家总部位于阿姆斯特丹、由以色列团队创立的企业 AI 平台公司，聚焦客服自动化和更广义的工作流编排。 公司由 Bar Winkler（CEO）和 Roey Lalazar（CTO）在 2025
    年创立，把模型无关平台、本地部署团队、深度企业集成以及监控 / 治理工具组合在一起。 2026 年 3 月，公司完成由 Insight Partners 领投的 $150M Series B，估值 $2B，已披露融资总额约
    $286M。
