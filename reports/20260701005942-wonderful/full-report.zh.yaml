  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Wonderful 典型客户从运营痛点走向生产部署和扩张的路径。
    data:
      items:
        - label: 1. 高频工作流痛点
          detail: 排队、IVR 失灵、自动化薄弱、系统割裂、多语言服务缺口
          tone: warning
        - label: 2. 需求发现 + 本地范围界定
          detail: Wonderful 与企业锁定一个高影响工作流，并接通所需系统
          tone: neutral
        - label: 3. 生产部署
          detail: 语音、聊天、WhatsApp 或服务工作流上线，并挂上可衡量 KPI
          tone: positive
        - label: 4. 运营证明
          detail: 自助闭环率、AHT、分流率、情绪或还款承诺改善开始显现
          tone: positive
        - label: 5. 内化 / 信任
          detail: 客户团队建立信心，并学会搭建或治理更多智能体
          tone: positive
        - label: 6. 扩张循环
          detail: 第二个工作流、第二个渠道或更多市场在同一底座上启动
          tone: neutral
    claimRefs:
      - CU001
      - CU010
      - CU014
      - CU024
      - CU028
      - CU030
      - CU038
  - id: FU002
    title: 采用 / 部署流程
    type: flow
    layout: wide
    summary: 从具名客户部署推断出的 Wonderful 典型账户路径。
    data:
      nodes:
        - id: pain
          label: 运营痛点清晰
          detail: 账单、催收、故障排查、预订或等待时间痛点制造紧迫感
          tone: warning
        - id: pilot
          label: 首个工作流上线
          detail: 单个工作流快速上线，常以周计，而不是以季度计
          tone: neutral
        - id: measure
          label: KPI 开始显现
          detail: 团队开始跟踪自助闭环率、AHT、情绪、分流率或转化率
          tone: positive
        - id: reuse
          label: 共用底座复用
          detail: 同一客户继续增加第二个工作流、渠道或客群
          tone: positive
        - id: scale
          label: 生产责任扩大
          detail: 内部团队或更多部门在同一平台上运营
          tone: positive
      edges:
        - from: pain
          to: pilot
          label: 紧急用例
        - from: pilot
          to: measure
          label: 上线
        - from: measure
          to: reuse
          label: 价值证明
        - from: reuse
          to: scale
          label: 落地后扩张
    claimRefs:
      - CU007
      - CU011
      - CU015
      - CU020
      - CU024
      - CU028
      - CU030
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 公开证明质量在部署细节上最强，在耐久性和集中度透明度上最弱。
    data:
      columns:
        - 结果具体性
        - 规模可见度
        - 生产证据
        - 耐久性可见度
      rows:
        - label: 银行业案例
          values:
            - label: 高
              tone: positive
              detail: Hapoalim 和 BCS 披露了具体工作流与 KPI 细节
            - label: 中高
              tone: positive
              detail: 预期每月 40k 次互动、43,658 通电话和客群规模公开
            - label: 高
              tone: positive
              detail: 生产部署表述和高管引语都很明确
            - label: 低
              tone: warning
              detail: 没有 NRR、续约或合同期限可见度
        - label: 电信案例
          values:
            - label: 高
              tone: positive
              detail: Telefónica、OTE 和 Bezeq 披露自助闭环率、AHT 或满意度变化
            - label: 中
              tone: neutral
              detail: 数万通电话和 6,500 次互动公开，但完整分母不公开
            - label: 高
              tone: positive
              detail: 实际生产运行和替换原有自动化的证据明确
            - label: 低
              tone: warning
              detail: 没有按电信客户披露的公开续约或收入结构
        - label: 医疗 / 相邻垂直行业
          values:
            - label: 中低
              tone: warning
              detail: 医疗证明更薄且未具名；PPC 是一个有力的相邻公用事业案例
            - label: 中低
              tone: warning
              detail: 核心服务垂直之外，具名账户很少
            - label: 中
              tone: neutral
              detail: 有一些上线工作流信号，但深度不如银行和电信
            - label: 低
              tone: warning
              detail: 没有公开留存指标
        - label: 独立评测层
          values:
            - label: 低
              tone: warning
              detail: 评测网站证据很薄，也可能经过筛选
            - label: 低
              tone: warning
              detail: 评论太少，无法判断是否有代表性规模
            - label: 中低
              tone: warning
              detail: Trustpilot / PeerSpot 不足以强力验证企业级生产部署
            - label: 低
              tone: warning
              detail: 没有真实队列、续约或投诉趋势数据
    claimRefs:
      - CU024
      - CU032
      - CU034
      - CU035
      - CU036
      - CU037
      - CU040
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: Wonderful 主要风险类别的相对发生可能性、影响、缓释成熟度和剩余暴露。
    data:
      columns:
        - 发生可能性
        - 影响
        - 缓释成熟度
        - 剩余暴露
      rows:
        - label: 监管 / 法律
          values:
            - label: 中高
              tone: warning
              detail: DPA、DORA 和面向 AI Act 的 AUP 已覆盖多个监管体系
            - label: 高
              tone: negative
              detail: 受监管工作流一次失误就可能伤到销售和留存
            - label: 中
              tone: neutral
              detail: 政策和附录已经存在，但外部证明并非全部公开
            - label: 中高
              tone: warning
              detail: 采购和审计摩擦仍然真实存在
        - label: 运营 / 安全
          values:
            - label: 中
              tone: warning
              detail: 环节很多：模型、API、电话系统、传统 UI
            - label: 高
              tone: negative
              detail: 生产事故会打到高风险客户工作流
            - label: 中
              tone: neutral
              detail: 监控和评估写得很明确，但主要来自自述
            - label: 中高
              tone: warning
              detail: 差异化也带来额外故障模式
        - label: 依赖 / 伙伴
          values:
            - label: 高
              tone: warning
              detail: 模型、云和集成伙伴无处不在
            - label: 中高
              tone: warning
              detail: 伙伴故障会直接传导到 CX 结果
            - label: 中
              tone: neutral
              detail: 多元化有帮助，但也增加复杂度
            - label: 中高
              tone: warning
              detail: 合同条款限制 Wonderful 的责任
        - label: 人员 / 执行
          values:
            - label: 高
              tone: warning
              detail: 人员扩张和本地团队模式抬高承压风险
            - label: 中高
              tone: warning
              detail: 执行质量是留存叙事的核心
            - label: 中低
              tone: neutral
              detail: 资金底盘和运营打法有帮助，但消不掉复杂度
            - label: 中高
              tone: warning
              detail: 规模化失败会很快体现在部署里
        - label: 财务 / 模型
          values:
            - label: 中
              tone: warning
              detail: 阶段还早，但推理经济性和人力强度很关键
            - label: 中高
              tone: warning
              detail: 利润率被压缩，会削弱溢价估值叙事
            - label: 中低
              tone: neutral
              detail: 缓释取决于能否证明可规模化的软件经济性
            - label: 中高
              tone: warning
              detail: 公开层面仍缺耐久性数据
    claimRefs:
      - CR001
      - CR008
      - CR018
      - CR024
      - CR029
      - CR031
      - CR042
  - id: FR002
