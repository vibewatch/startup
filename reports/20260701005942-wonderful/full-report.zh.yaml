      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Wonderful 由 Bar Winkler 和 Roey Lalazar 于 2025 年初创立。公开报道给两位创始人的背景都提供了足够可信度： Winkler 此前创办 Approve.com 并出售给
              Tipalti，Lalazar 则曾创办 AI 本地化公司 Kaps。这种组合与 Wonderful 的叙事异常契合， 因为公司试图把工作流自动化、企业销售执行和非英语市场本地化结合起来。


              更少公开的是创始人之下的组织层。Wonderful 的关于页面声称，在 30 多个市场拥有一批顶尖总经理；招聘页面也显示，
              公司正在招聘部署策略师、前线部署工程师、GTM、运营和领导岗位。这支持了一个判断：它的运营模式人力密集且分布式。 但这些信息不能替代清晰披露的高管名单。除两位创始人外，本章审阅的公开材料没有给出完整、具名的
              C-suite 阵容，也没有清楚披露董事会名单。


              因此，相对于已经融资的资本规模，治理披露偏薄。融资报道点名了投资机构并引用其负责人，但没有披露董事会构成、控制权、清算优先权或任何二级交易。 隐私政策还带来一个重要细节：Wonderful
              在市场传播中把阿姆斯特丹称作新总部办公室，但法律隐私文件称，数据传输包括以色列， 也就是公司总部所在地。这暗示商业总部品牌与运营或法律控制中心可能分离，后续尽调需要澄清。
