  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 从公司质量和公开证明到价格敏感型最终建议的推导链。
    data:
      nodes:
        - id: market
          label: 大市场 + 真实产品
          detail: 工作流 AI、企业痛点、产品深度、模型无关平台
          tone: positive
        - id: proof
          label: 客户证明较强
          detail: 具名部署、可衡量结果、生产上线速度快
          tone: positive
        - id: risk
          label: 风险项叠得高
          detail: 合规、利润率、集成和招聘复杂度仍是实质风险
          tone: warning
        - id: price
          label: 价格门槛高
          detail: $2B 估值标记，对应数千万美元收入和稀薄公开指标
          tone: negative
        - id: call
          label: 建议：继续研究
          detail: 公司质量高，但公开证据尚不足以支撑不看价格也能下注的确信
          tone: neutral
      edges:
        - from: market
          to: proof
          label: 支撑
        - from: proof
          to: price
          label: 部分抵消
        - from: risk
          to: price
          label: 放大
        - from: price
          to: call
          label: 决定最终判断
    claimRefs:
      - CV001
      - CV020
      - CV022
      - CV029
      - CV040
