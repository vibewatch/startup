      - number: '7.2'
        title: 监管、法律和合同风险
        blocks:
          - type: paragraph
            body: >-
              对一家年轻公司来说，Wonderful 搭出了相当细的法律外壳，但这也把风险面摊开了。AUP 和 MSA
              显示，公司清楚自己贴着敏感边界运营：具有法律效果的自动化决策、电信法律、受监管行业工作流、隐私制度，以及按国家披露。DPA、DORA 附录和 Data Act 附录进一步把隐私、韧性、审计和切换变成合同议题。


              从一个角度看，这是正面信号：Wonderful 没有假装企业 AI 可以无视监管。但同样的细节也暴露了真实的采购和运营风险。FSI
              买方可能要求比年轻创业公司自然愿意提供的更多审计保证。定制工作、提示词、分析和专业服务被部分排除在导出范围之外时，数据可携带性就不只是“开放性”的营销话术那么简单。MSA
              把合规责任分配给客户，商业上可能合理；但一旦出事，Wonderful 的声誉或诉讼风险并不会因此消失。


              对投资人来说，正确读法是：Wonderful 看起来懂监管，但不是轻监管。这降低了一些意外风险，同时保留了显著的执行风险和交易摩擦风险。
