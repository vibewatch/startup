      - number: '2.4'
        title: 增长驱动、采用约束与估值含义
        blocks:
          - type: paragraph
            body: >-
              多个驱动因素同时支撑这个市场：全渠道客户预期、自动化和成本压力、云和 CCaaS 采用、规模化多语言服务需求， 以及企业越来越愿意围绕 AI 重设计工作流，而不是把 AI 贴在旧软件上。这些驱动在电信和 BFSI
              等行业尤其强， 因为响应速度、信任和吞吐量直接影响流失、利润率和监管风险。


              约束同样真实。多个来源都显示，遗留系统集成仍是最大阻碍。McKinsey 和 KXN 都表明，企业试图把 agent 从精心划定范围的试点扩到规模化时，
              数据质量和治理仍是关键瓶颈。可解释性、技能缺口、安全审批和监管复杂度又增加更多摩擦。EU AI Act 提高了欧洲范围内的透明度和治理要求， DORA 则为金融服务部署再加一层保障要求。


              对估值来说，含义很直接：市场大且增长快，但采用节奏比抽象 TAM 更重要。赢家是能弥合试点与规模化生产之间缺口的公司。 Wonderful
              的故事之所以有吸引力，正是因为它声称能解决这个缺口。同样的运营强度也可能支撑溢价定位； 但如果招聘、治理或国家铺开落后于计划，它也会限制近端 SOM，并制造执行风险。
