        - date: 2026-03
          label: Series B 轮 — $150M，估值 $2B
          detail: Insight Partners 领投 Series B；Wonderful 称业务已覆盖 30+ 个国家，并将大幅扩张团队。
          tone: positive
        - date: 2026-03
          label: 强调 Amsterdam 总部办公室
          detail: 荷兰页面把 Amsterdam 定位为 Wonderful 新总部办公室和欧洲扩张支点。
