      - number: '4.3'
        title: 成本结构、利润率驱动与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              Wonderful 可能的成本栈有三块重负：人、计算和合规。人力重要，因为该模式依赖现场或本地嵌入式团队来集成系统、转移知识， 并在上线后继续参与。计算重要，因为 agentic AI
              仍然推理密集。Deloitte 称，一些企业已经看到每月 AI 账单达到数千万美元； Forbes 则认为，该行业部分公司的 AI 运营成本增速快于收入。合规也重要，因为 Wonderful 公开承诺 99.9%
              SLA， 并处理敏感客服通话数据，这意味着可靠性工程、事件响应、隐私和治理开销。


              好消息是，Wonderful 正在明显压缩至少一条成本线：内部工程生产率。公司自己的文章描述了禁止手工编码、强制模型自测， 以及在约两周内构建 90,000 行 Agent
              Builder。如果属实，这能实质性降低产品迭代和客户定制工具的工程成本。


              公开可比公司能帮助框定利润率问题，但不能解决问题。Salesforce 的经营利润率显示成熟企业软件规模化后可能长什么样； Five9 的 55.1% GAAP
              毛利率则是更现实的联络中心软件参照。Wonderful 最终可能落在软件经济性与「服务 + 推理」经济性之间， 但公开披露太薄，无法判断具体位置。
