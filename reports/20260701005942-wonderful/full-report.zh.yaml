      - number: '6.3'
        title: 采用、扩张与耐久性信号
        blocks:
          - type: paragraph
            body: >-
              采纳信号可信，但并不均匀。好的一面是，几个具名部署给出了交互量、呼叫量、自助闭环、分流、满意度或投产时间等指标。Index Ventures 和 TechCrunch 也印证，Wonderful
              在很早期就已处理大量交互。此外，公司反复称，从一个用例起步的企业里，超过 70% 会在三个月内扩展到更多工作流。


              账户层面也有复用证据。Hapoalim 把既有工具基础复用于新的储蓄工作流。Banco Caja Social 在 María
              之后很快上线了第二个服务智能体。这些案例让扩张说法比纯营销更可信。即便如此，扩张证明不等于留存证明。公开材料没有披露 NRR、GRR、流失率、续约率、合同期限或头部客户收入占比。


              因此，独立评论平台证据很重要——但目前很薄。FeaturedCustomers 提供了一些经筛选的客户参考，PeerSpot 更像概览页，Trustpilot 只有一条评论。净结果是，Wonderful
              在部署成功上看起来更强，在可外部验证的客户耐久性上仍弱。
