      - number: '5.2'
        title: 架构、模块与产品界面
        blocks:
          - type: paragraph
            body: >-
              公开产品架构是一套连贯的栈。Agent Studio 是构建环境，提供工作区、版本控制、可复用 skills、权限、A/B 测试和 A2A 交接。 Build
              界面加入自然语言配置、代码自定义、护栏、知识连接和脚本化验证。Monitor 提供交互日志、推理轨迹、问题跟踪、告警和政策驱动治理。 Optimize 增加结果仪表盘和安全的生产中迭代。Apps 则在与
              agent 相同的数据之上，叠加特定工作流的人类界面。


              这种模块化很重要，因为它把真正的平台与定制服务外壳区分开。定制服务公司可以交付一个 bot。 平台则展示可复用目录项、共享问题管理回路、版本控制和多个运行时界面。Wonderful 的公开页面越来越显示后者。


              架构也不止于干净 API。computer-use 发布称，agents 可通过托管虚拟机操作遗留系统；open-by-default 文章则称， 公司提供 headless API 接口面、Swagger
              文档和可导出能力。合在一起，这些来源暗示系统设计目标是同时连接现代和遗留企业资产。
