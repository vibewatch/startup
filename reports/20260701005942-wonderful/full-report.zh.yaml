    title: Wonderful 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Wonderful 从 2025 年初到 2026 年中成立、融资、扩张与合作的里程碑脉络。
    data:
      items:
        - date: 2025-early
          label: 成立
          detail: Bar Winkler 和 Roey Lalazar 创立 Wonderful，押注非英语市场里的多语言企业 AI。
          tone: positive
        - date: 2025-07
          label: 种子轮 — $34M
          detail: Index Ventures 领投种子轮，Bessemer 和 Vine 参投，资金用于早期市场启动和希伯来语优先的产品打磨。
          tone: positive
        - date: 2025-11
          label: Series A 轮 — $100M
          detail: Index 再次领投，Insight、IVP、Bessemer 和 Vine 入局，支持公司快速进入更广的欧洲与中东市场。
          tone: positive
        - date: 2025-11
          label: 30 国落地路径显现
