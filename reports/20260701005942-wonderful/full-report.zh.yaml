      - number: '7.4'
        title: 依赖、客户、人员和财务风险
        blocks:
          - type: paragraph
            body: >-
              依赖风险有三层。第一，Wonderful 依赖模型供应商、云基础设施、电信平台和客户
              API。第二，它依赖人员：前置部署工程师、本地市场团队和专门技术人才。第三，它依赖客户从初始工作流继续快速扩张，速度要足以支撑劳动密集型落地扩张模式。


              客户证明在部署结果上很强，但公开耐久性证据仍薄。这意味着集中度和利润率风险，比单看客户章节时更难被排除。如果少数灯塔账户或垂直行业支撑整个故事，电信或金融服务扩张一旦放缓，叙事和经济性都会受打击。薄弱的独立评论足迹进一步强化了这种不确定性。


              财务上，最难的问题是本地团队很重的运营模式能否长成软件化经济性，还是卡在服务占比很高的中间地带。全行业推理成本压力让这个问题更尖锐，尤其是对高并发语音和智能体工作负载。
