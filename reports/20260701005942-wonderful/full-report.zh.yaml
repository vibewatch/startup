  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              Wonderful 很难被塞进单一传统软件类别。公司销售企业 AI agent 平台，但它解决的买方问题横跨三个相邻市场： AI agents、AI
              客服和联络中心软件。它关于客户、员工和后台工作流的表述，让它超出传统呼叫中心厂商； 它强调在电信、金融和医疗里的真实部署，又让它比完整的全球 AI agents 类别窄得多。


              因此，正确边界应包括能自动化高频企业工作流的软件和服务，尤其是客服交互、坐席辅助流程、内部支持运营， 以及让这些部署能在生产环境使用的治理或集成层。应排除原始模型基础设施、通用消费者助手和 BPO 劳动力池；
              只有当这些替代项代表企业采购决策中的现状替代方案时，才纳入考虑。


              这些替代方案很重要。买方可以保留传统联络中心套件，把更多劳动力外包给 BPO，尝试自建 agent，或在多个供应商之间跑碎片化试点。 当企业认为「共享、受治理的架构 +
              部署帮助」比再买一个孤立工具或增加人工运营更好时，Wonderful 的论点最强。 这使市场边界纪律变得重要：公司追逐的不是所有 AI
              支出，而是那些集成、本地化和信任足够重要、足以支撑高触达平台销售的工作流自动化。
