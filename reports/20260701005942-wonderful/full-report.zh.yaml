      - number: '3.4'
        title: 定价、打包与分销力量
        blocks:
          - type: paragraph
            body: >-
              这个市场最显眼的商业分野，是透明产品化定价与顾问式企业销售。Salesforce 公开多个计量口径： 免费评估、Flex Credits、按会话定价和面向员工的附加项。Microsoft
              公开信用包和按量付费定价。 Intercom 和 Zendesk 都披露了由座席和用量构成、容易理解的结构。ServiceNow 即使美元价格仍以报价为主，也公开打包方式和功能阶梯。


              Wonderful 走的是另一条路。公开材料强调灵活消耗模型、透明定价逻辑和不收设置费，但不公开价格表。 这与依赖部署强度和集成深度、而不是标准化 SKU 的销售相一致。取舍也很明显。Wonderful
              可以让商业对齐更贴近客户价值， 但也让买方在早期少了 Intercom、Zendesk 或 Microsoft 那样的可比性。


              分销会放大这个问题。Salesforce、ServiceNow 和 Microsoft 能把 AI agents 卖进已经依赖其工作流、CRM 或工作场所层的账户。 Wonderful
              则必须证明，专用操作层加嵌入式团队创造的价值高于捆绑功能。这是可能的，但需要在一线反复拿出赢单 / 输单证据， 不能只靠叙事。
