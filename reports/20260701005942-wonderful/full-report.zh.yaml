      - number: '7.5'
        title: 缓释、监测指标和一票否决标准
        blocks:
          - type: paragraph
            body: >-
              尽管风险叠加，Wonderful
              仍可投资，原因是许多风险可以监测。审计权要么足以满足买方，要么不够。扩张要么反映在分群里，要么没有。利润率要么随部署扩张改善，要么继续受员工数和推理成本制约。安全姿态要么在尽调中让受监管买方满意，要么采购明显放慢。


              因此，投资人应把风险章节转成明确的一票否决标准。受监管账户发生重大安全事件、审计失败或退出争议形成模式，或出现客户扩张无法抵消部署成本的证据，都是强负面信号。反过来，经审计留存、可信的利润率改善，以及受监管客户采购顺利推进，会很快降低投资假设的风险。


              关键尽调要求不是再要一份营销材料，而是一套运营证据包：分群留存、头部客户集中度、按模式拆分的部署经济性、认证材料、事故历史，以及受监管客户的审计 / 退出结果。
