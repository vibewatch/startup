      - number: '2.2'
        title: TAM、SAM 与相关机会集的规模视角
        blocks:
          - type: paragraph
            body: >-
              公开市场估算差异很大，因为它们衡量的不是同一件事。Grand View 的 AI agents 市场视角从跨用例的自治软件系统这一宽类别出发， 到 2026 年达到 $10.9B。Grand View 的 AI
              客服视角更窄，2024 年约 $13.0B，到 2033 年增长至 $83.9B。 联络中心软件发布方在另一个方向上更宽：Research and Markets 把 2025 年市场规模定为 $47.7B，
              Mordor 对同一年给出 $72.9B，差异来自服务、部署模式和平台范围的不同纳入口径。


              Wonderful 自己的风险投资叙事还加入第四个视角：Index Ventures 把非英语呼叫中心机会描述为每年约 $200B。 这在方向上有用，因为 Wonderful
              明确围绕多语言、非美国中心市场组织公司；但它不是严谨的可服务市场估算， 更像机会故事，而不是干净的 TAM。


              因此，对 Wonderful 最相关的规模框架是受约束的 SAM：处于受监管或复杂行业的大型企业，需要多语言客服和相邻工作流自动化， 且愿意为部署密集型执行付费。可获得市场还要更小，因为 Wonderful
              依靠嵌入式团队逐国扩张。 这意味着后续估值应锚定在那部分市场：执行强度和合规是功能，而不是成本劣势。
