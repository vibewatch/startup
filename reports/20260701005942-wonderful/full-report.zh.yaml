      - number: '1.3'
        title: 融资历史与投资方格局
        blocks:
          - type: paragraph
            body: >-
              以私人软件公司的标准看，Wonderful 的融资速度非常罕见。2025 年 7 月，公司完成由 Index Ventures 领投、Bessemer 和 Vine 参投的 $34M 种子轮。 四个月后，2025
              年 11 月，公司完成由 Index Ventures 领投、Insight Partners、IVP、Bessemer 和 Vine 参投的 $100M Series A。 2026 年 3 月 12
              日，公司宣布完成由 Insight Partners 领投、上述四家老股东继续跟投的 $150M Series B。 从种子轮到 Series B
              的速度本身就是投资论点的一部分：投资人押注的不只是产品潜力，也押注运营模式能快速跨市场复制。


              多数公开来源把 Series B 后已披露融资额写作约 $286M，Globes 则报道为 $284M。差异不大，但真实存在，不应被抹平。 同样，Series B 的头条估值是 $2B，按欧元约
              €1.7B。这意味着公司创立约一年、Series A 之后仅数月，企业价值就大幅跃升。


              仍不透明的是头条数字背后的经济结构。公开来源没有披露债务额度、二级交易、董事会席位或投资者权利。投资方阵容精英且连续，
              但经济控制权、创始人稀释和下行情景保护仍藏在公开视野之外。对于一家短时间内压缩完成三轮大额融资的公司来说， 这是有意义的尽调缺口，不是小瑕疵。
