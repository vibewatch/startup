  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 以客户工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              Wonderful 的产品更适合被描述为 AI 驱动工作流的企业操作层，而不是单一用途支持 bot。平台围绕真实业务工作构建： 语音、聊天、邮件、文档处理和 API
              驱动任务，这些任务需要读取企业数据、触发动作并更新记录系统。 从这个意义上说，Wonderful 卖的是把 agents 放进复杂工作流生产环境的能力，而不是狭窄会话界面。


              公开产品界面强化了这一定位。公司明确把产品拆成 Build、Monitor、Optimize、Apps、Deployment 和 Agent Studio。 这形成了生命周期视角：设计并连接
              agent，上线前评估，带着治理和可观测性在生产环境运行，再通过特定工作流界面暴露给人类。 平台声称可从客服延伸到前台和后台工作；这一点很重要，因为经济承诺依赖同一底座在多个用例之间复用。


              Bank Hapoalim 和 Banco Caja Social 等客户案例让产品更具体。这些部署不是通用 FAQ bot，而是带自定义工具、实时数据访问和治理步骤的集成语音与服务工作流。
              这才是产品的实际定义。
