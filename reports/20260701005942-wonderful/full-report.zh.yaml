    title: 估值敏感性
    type: bar
    layout: standard
    summary: 所选收入与收入倍数组合隐含的估值，与当前估值标记对比。
    data:
      items:
        - label: $30M 收入 @ 5x
          value: 150
        - label: $30M 收入 @ 10x
          value: 300
        - label: $50M 收入 @ 10x
          value: 500
        - label: $100M 收入 @ 10x
          value: 1000
        - label: $150M 收入 @ 10x
          value: 1500
        - label: $200M 收入 @ 10x
          value: 2000
        - label: 当前估值标记
          value: 2000
