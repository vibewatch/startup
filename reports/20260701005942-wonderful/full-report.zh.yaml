      - number: '3.3'
        title: 既有套件与平台替代方案
        blocks:
          - type: paragraph
            body: >-
              Salesforce、ServiceNow、Zendesk 和 Microsoft 对 Wonderful 的威胁不同于 AI 原生同业。它们不需要在每个用例上都比 Wonderful 更专精；
              只需要让企业已信任的软件内部采用 AI agent 变得足够容易。Salesforce Agentforce 被包装成完整的 agentic 平台，
              拥有构建器、脚本控制、语音、监督工具和行业工作流。ServiceNow AI Agents 从一个平台覆盖 IT、客服、HR 和其他企业流程， 并配有自己的 studio、orchestrator、control
              tower 和第三方 agent fabric。Microsoft Copilot Studio 同样让 Microsoft 标准化组织用自然语言构建 agent， 并直接发布到 Microsoft 365。


              这很关键，因为捆绑力量会压缩独立切入口。已经深度使用 Salesforce 或 ServiceNow 的企业，即使专门能力稍弱， 也可能因为采购、数据访问和工作流集成明显更容易而选择套件。Microsoft
              还为内部员工工作流创造了另一条替代路径， 而 Wonderful 也希望随时间切入这类场景。


              Zendesk 和 Intercom 的威胁更隐蔽。它们未必能匹配 Wonderful 的前线部署运营模式，但能通过可见的座席加用量定价和更低设置摩擦，
              给数字支持团队提供更容易的入口。对聚焦数字服务、而非跨国转型的买方来说，这种简单性有战略意义。
