      - number: '5.3'
        title: 部署、集成与运营模式
        blocks:
          - type: paragraph
            body: >-
              以一家如此年轻的创业公司而言，Wonderful 的部署叙事异常宽。公司公开支持多租户、单租户、BYOC 和本地部署模式，
              再把这种灵活性与前线部署团队，以及走向客户自主拥有的三阶段路径配对。这个组合说明，Wonderful 希望既适用于云优先企业， 也适用于需要更严格基础设施控制的受监管组织。


              集成是一阶产品问题，不是专业服务的附带事项。Bank Hapoalim 使用了一个 RAG 来源和 15 个连接银行系统的自定义工具。 Banco Caja Social 使用共同构建的 API
              和语音治理栈。computer-use 发布把触达范围进一步扩展到那些没有可用 API 的系统， 改用托管 VM 和可观测会话。


              运营上，Wonderful 试图在上线后闭环。Monitor 和 Optimize 把产品推向问题跟踪、告警、仪表盘和安全的生产迭代。 Apps
              增加人类复核界面。这种运营模式是公司最清楚的产品优势之一，也是支持界面复杂的原因之一。
