      - number: '3.5'
        title: 护城河耐久性、锁定与替代风险
        blocks:
          - type: paragraph
            body: >-
              Wonderful 的护城河真实存在，但比纯锁定型软件更软。开放架构、可导出性和 headless API 帮助公司进门， 尤其面对那些害怕被困在新 AI
              控制平面里的谨慎企业。同样的设计也意味着，如果更好的系统出现，客户可以离开。 Wonderful 明确押注产品质量和执行会跑赢封闭平台的切换成本。


              当大型套件继续改进，这个押注会更难。如果 Salesforce、ServiceNow、Microsoft 或 Zendesk 在保留分销和捆绑经济性的同时， 补上足够多的能力缺口，Wonderful
              可能被估值为高端实施层，而不是耐久的软件控制点。公司自己的扩张计划也显示压力： 为支撑部署需求，公司希望 2026 年把员工数从 350 增至约 900。这可以强化执行优势，但也提高组织复杂度和成本。


              乐观解读是，受监管、多语言、集成很重的环境会继续奖励 Wonderful 的模式。悲观解读是，功能商品化和套件捆绑会缩小愿意为这一模式付费的客户集合。 对后续估值来说，这一区分比抽象的类别热度更重要。
