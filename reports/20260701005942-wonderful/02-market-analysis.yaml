- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / Constraint
  - Direction
  - Timing
  - Implication
  - Diligence Ask
  rows:
  - - Omnichannel CX expectations
    - Positive
    - Now
    - Pushes enterprises toward integrated AI support across voice, chat, email, and messaging
    - Which workflows are urgent enough to justify a platform change?
  - - Automation / cost pressure
    - Positive
    - Now
    - Supports ROI case for AI support and workflow automation
    - What is the measurable payback on first deployment?
  - - Cloud / CCaaS adoption
    - Positive
    - Now to medium term
    - Shortens deployment cycles and makes consumption pricing easier to swallow
    - How dependent is Wonderful on cloud-ready customer estates?
  - - Globalization / multilingual operations
    - Positive
    - Now
    - Favors Wonderful's non-English, local-team thesis
    - Which geographies convert fastest and at what ACV?
  - - Legacy-system integration
    - Negative
    - Now
    - Lengthens deployment and raises delivery cost
    - How repeatable are integrations by vertical and stack?
  - - Data quality / governance
    - Negative
    - Now
    - Prevents pilot-to-scale transition and increases hallucination risk
    - What data-readiness threshold is needed before go-live?
  - - Regulation (AI Act / DORA)
    - Mixed
    - Now to medium term
    - Creates friction but also raises willingness to pay for governed vendors
    - How much additional implementation cost do regulated buyers absorb?
  - - Skills / trust / explainability gaps
    - Negative
    - Now
    - Slow internal approval and require more human oversight
    - How much of Wonderful's services layer is really change management?
  notes: The same constraints that create purchase friction also strengthen the strategic logic for vendors that can combine software with deployment and governance.
