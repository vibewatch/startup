  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 投资逻辑
      - 反向逻辑
      - 什么会改变判断
    rows:
      - - 规模与市场位置
        - Megazone 是韩国领先的云 MSP，2025 年规模已盈利，IPO 动能强。
        - 单靠规模并不能证明持久定价权或软件式经济性。
        - 提供经审计的趋势细节、细分增长，以及规模正在转化为持久利润率扩张的证据。
      - - 产品抬升
        - AIR Studio、SpaceONE、FinOps 和安全产品能把业务模型抬到商品化云人力之上。
        - 除旗舰界面外，公开证据对附加销售、采用和毛利率的证明仍薄。
        - 展示按模块划分的产品附加销售率、留存和毛利率。
      - - 客户证据
        - 8,000+ 客户说法和 Korean Re 这类背书支撑真实企业牵引力。
        - 相对总规模，公开客户证据仍稀疏，留存和集中度也未披露。
        - 提供头部账户集中度、NRR / GRR 和可推荐的多产品客户。
      - - AWS 依赖
        - AWS 伙伴关系带来分发、可信度和更快产品商业化。
        - 同一依赖也可能压低利润率、削弱账户控制，并压缩战略独立性。
        - 披露直接与合作伙伴收入组合、市场经济性和多云收入平衡。
      - - IPO / 稀缺性溢价
        - 一家盈利的韩国云领军企业，可以在 IPO 窗口获得稀缺性溢价。
        - 如果披露和经济性落后，仅靠稀缺性并不能证明高于公开可比公司的价格合理。
        - 开放申报级披露和干净的资本重组后结构，会强化溢价逻辑。
    notes: 反向逻辑主要关乎价格、证据和结构，而不是 Megazone 是否已经建立了有意义的业务。
