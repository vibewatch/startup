      - number: '7.2'
        title: 最大战略风险仍是超大规模云厂商和合作伙伴集中，尤其围绕 AWS
        blocks:
          - type: paragraph
            body: >-
              Megazone 将自己定位为多云，但最强公开证据仍指向 AWS 这个重心。AWS 合作伙伴页面、APN 奖项、Quick SI 参与、 应用市场分发，以及近期与 AWS 绑定的 AI 智能体公告，都显示
              Megazone 最可见的商业动能系于同一个生态。 这种依赖本身不是坏事：AWS 的规模显然帮助 Megazone 在韩国取得全国领先，也加快了 AI 产品发布。风险在于，定价权、
              账户控制、路线图可见度和一线销售冲突仍可能掌握在上游。AIR Studio 通过 AWS Marketplace 销售，公开 AI 发布引用 AWS 服务， 强化 Megazone
              可信度的奖项体系本身也由合作伙伴控制。多云叙事缓和了集中度问题，但本轮审阅的公开材料在产品和部署细节层面， 对 AWS 的证据远比 Azure 或 Google Cloud 丰富。因此，投资者不应把
              Megazone 主要看作中立云控制平台，而应把它看作高技能编排者； 其经济性和差异化仍在很大程度上取决于超大规模云厂商关系，以及自有治理工具能否从可选包装变成刚需。
