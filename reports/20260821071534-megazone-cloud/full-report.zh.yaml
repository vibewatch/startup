  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型、定价架构与收入质量
        blocks:
          - type: paragraph
            body: >-
              Megazone Cloud 的公开材料支持一个服务主导、同时扩展软件和 AI 叠加层的收入模型，而不是干净的按席位计价 SaaS 结构。官网营销云、AI/数据和网络安全解决方案；2025
              年盈利公告则披露，云服务仍是主导收入流，在 1.7496 万亿韩元总收入中约占 1.34 万亿韩元。BigGo 对经审计结果的摘要又把剩余部分拆成系统建设、咨询、维护和产品销售，重要性在于，它显示
              Megazone 仍靠经常性托管服务、项目交付和类似转售的活动混合变现。公开定价仍不透明。已审阅官方入口没有一个发布标准价目表或合同价格瀑布；公司强调的是解决方案组合、伙伴项目，以及约 45 天部署 AI
              智能体等实施包。承销含义是，收入规模真实，但实际成交价、折扣、按收入流拆分的毛利率，以及转售云支出与更高价值托管服务之间的拆分，仍需要私下尽调。
