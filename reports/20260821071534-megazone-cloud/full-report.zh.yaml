  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 建议的权衡一边是真实规模和盈利性，另一边是溢价倍数和披露风险。
    data:
      nodes:
        - id: n1
          label: 规模和盈利性
          description: KRW 1.7496T 收入和 2025 年正向盈利，让 Megazone 作为一门生意具备可投资性。
        - id: n2
          label: 平台 / AI 上行空间
          description: AIR Studio、SpaceONE、FinOps 和安全产品，可以支撑相对普通 MSP 的溢价。
        - id: n3
          label: 披露和结构缺口
          description: 股权结构表、合作伙伴经济性、留存和事故数据仍未公开。
        - id: n4
          label: 上市可比公司锚点
          description: 上市服务类可比公司交易倍数通常低于 Megazone 隐含的 2.3x 收入倍数。
        - id: n5
          label: 建议 = 观察
          description: 质量真实，但还需要更强证据或更好价格。
      edges:
        - from: n1
          to: n5
        - from: n2
          to: n5
        - from: n3
          to: n5
        - from: n4
          to: n5
    approximationNotes: null
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV016
      - CV017
      - CV024
      - CV035
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: Megazone 的估值在公开服务公司定价纪律与更强 IPO / 平台溢价之间摆动，下列是方向性结果。
    data:
      items:
        - label: KRW 1.75T 按 1.6x
          value: 2.8
          description: 偏悲观的服务公司倍数，接近优质上市咨询公司的定价纪律。
        - label: KRW 1.75T 按 2.3x
          value: 4
          description: 当前私募估值附近。
        - label: KRW 1.75T 按 2.5x
          value: 4.4
          description: 若稀缺性和盈利性站住，这是基准情景上沿。
        - label: KRW 1.75T 按 3.2x
          value: 5.6
          description: 若平台证据和 IPO 交易表现支撑更高溢价，这是乐观情景。
    approximationNotes: 数值以 KRW 万亿计，使用当前公开收入作为简化分母，而不是前瞻 EV 计算。
    claimRefs:
      - CV009
      - CV021
      - CV022
      - CV023
      - CV038
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 围绕当前私募估值的 Megazone Cloud 低、中、高估值包络。
    data:
      items:
        - id: bear
          label: 悲观情景
          low: 2.5
          value: 2.9
          high: 3.2
        - id: base
          label: 基准情景
          low: 3.8
          value: 4.1
          high: 4.4
        - id: bull
          label: 乐观情景
          low: 5.2
          value: 5.6
          high: 6.1
    approximationNotes: 区间以 KRW 万亿计，反映基于情景的收入倍数框架，不是经审计的企业价值模型。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 投委会风格仪表盘，覆盖当前估值下 Megazone 尽调中最重要的维度。
    data:
      items:
        - id: market
          label: 市场 / 品类
          value: Strong
          description: 韩国云转型和企业 AI 服务仍是大品类。
          tone: positive
        - id: proof
          label: 证据点
          value: Good
          description: 2025 年盈利、>8,000 个客户和 IPO 准备，显示真实运营规模。
          tone: positive
        - id: moat
          label: 护城河 / 差异化
          value: Mixed
          description: 治理和编排有价值，但 AWS 依赖仍限制战略独立性。
          tone: neutral
        - id: economics
          label: 经济性质量
          value: Partially verified
          description: 公开证据支持盈利，但看起来仍像服务，而不是软件。
          tone: neutral
        - id: valuation
          label: 估值
          value: Fair-to-stretched
          description: 当前估值按收入倍数看，已经高于上市服务同业。
          tone: negative
        - id: evidence
          label: 证据质量
          value: Medium
          description: 足以支撑观察建议，但还不足以支撑溢价买入。
          tone: neutral
    approximationNotes: null
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV016
      - CV018
      - CV035
      - CV036
      - CV037
