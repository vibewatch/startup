        title: 客户结论
        blocks:
          - type: paragraph
            body: >-
              Megazone 的客户盘子看起来广、机构可信度高，战略质量也好过商品化转售商。公开证据足以支持其在再保险、 公共部门医疗、公共教育、高校和 AI 基础设施中的真实部署；大装机基础也从早期合作伙伴声称的
              5,000 家客户， 增长到公司声称的 7,000+，再到 8,000+。意义不小。但公开台账最薄弱的地方，恰好是后期尽调最在意的：
              集中度、续约、钱包份额和扩张经济性。当前记录支持一个中等确信度的正向商业就绪结论：Megazone 显然有重要客户，
              但投资者仍需按收入拆分客户、留存队列、具名客户访谈，以及合作伙伴与直销订单组合，才能断定采用广度已经转化为持久、 高质量的经常性关系。
