  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失的私有指标或数据集
      - 对投资评估的影响
      - 具体尽调路径
    rows:
      - - 按收入流划分的分部毛利率
        - 没有收入流层面的毛利率，投资人无法判断 AI / 安全是否真正改善经济性
        - 要求提供 2024-2026 年分部损益，并按云服务、项目、产品销售、AI、安全和海外拆分毛利
      - - 留存指标（GRR / NRR）
        - 经常性收入耐久性仍未证明
        - 按产品族、客户规模和渠道要求队列留存
      - - CAC、回本周期和销售生产率
        - 增长效率无法与服务或 SaaS 同业对标
        - 要求 CAC 方法、回本周期、管线转化，以及背指标销售代表的生产率
      - - 实际成交价瀑布
        - 公开数据能看到包装方式，但看不到折扣纪律
        - 要求近期匿名报价、标准 SOW、续约涨价数据和审批阈值
      - - 合作伙伴返利 / 市场 / 转介经济性
        - 与超大规模云厂商相关收入可能看起来大于真实毛利贡献
        - 要求 AWS、Google 和 Microsoft 激励与返利桥接
      - - 头部客户和头部合作伙伴集中度
        - 集中度风险可能显著改变估值
        - 按收入和毛利要求前 10 大客户、前 10 大供应商 / 合作伙伴敞口
      - - Glenwood 后股权结构表
        - 当前所有权、稀释和包袱无法精确建模
        - 要求交割文件、证券条款和备考所有权表
      - - Series D 或其他待完成融资状态
        - 融资依赖和 IPO 前稀释风险仍不确定
        - 要求已签投资条款清单、董事会批准，或没有融资轮活跃的书面确认
      - - 关联方和子公司清理披露
        - IPO 准备度取决于能否移除结构复杂性
        - 要求子公司损益、合并理由和任何关联方交易清单
      - - 2026 年初至今（YTD）经审计或已审阅业绩
        - 只有一个表现好的 2025 年，不足以证明持久斜率
        - 要求 2026 年初至今（YTD）管理账，以及审计师审阅的中期报表
    notes: 这些是从方向性模式识别走向真实投资评估所需的最低数据集。
