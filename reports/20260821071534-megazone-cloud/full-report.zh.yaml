            - 高
        - label: IPO / 披露准备度
          values:
            - 中高
            - 高
            - 中
            - 高
        - label: 利润率韧性
          values:
            - 中高
            - 高
            - 中
            - 中高
        - label: 运营 / 安全透明度
          values:
            - 中
            - 中高
            - 中
            - 中高
        - label: 客户集中度 / 留存不透明
          values:
            - 中
            - 高
            - 中低
            - 高
        - label: AI / 隐私合规外溢
          values:
            - 中
            - 中高
            - 中
            - 中高
    approximationNotes: 热力图使用有来源支撑的定性证据做序数评分，而不是合成概率。
