    - CI009
    - CV025
chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、起源与市场位置
        blocks:
          - type: paragraph
            body: >-
              Megazone Cloud 更适合看作一家后期韩国云和 AI 服务平台。它的法律实体生命始于 2018 年，但商业基因可追溯到 Megazone 1998
              年创立。最强的公开身份来源是公司自己的英文公司故事页：Megazone 2009 年成为韩国首个 Google Apps 官方合作伙伴，2012 年成为首个 AWS 官方合作伙伴，之后把云业务拆分为
              MegazoneCloud。同一官方材料现在把公司表述为 AI 原生数字化转型伙伴，而不是纯迁移服务商；业务横跨云、AI/数据和安全服务，并纳入 Transform Tomorrow, Together
              愿景。独立和伙伴来源强化了它的市场领导地位。ServiceNow 称 Megazone 是韩国首个、也是最大的 AWS Premier Tier 服务伙伴；Empire State Development
              称它是顶级全球云托管服务商、领先 Google Cloud 伙伴，以及亚太地区最大的 AWS Premier 咨询伙伴。Korea Herald 的市场报道也把 Megazone Cloud 和 Bespin
              Global 视为韩国 MSP 板块的传统中型龙头。因此，后续章节应锚定一个简单的标准描述：Megazone Cloud 是一家韩国起源的多云 MSP 和 AI
              服务提供商，核心护城河仍来自超大规模云厂商伙伴关系深度和企业实施规模。
