  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Rackspace Technology
        - 2025 年收入约 $2.69B，对应市值约 $0.82B
        - 约 0.3x 收入；公开市场托管服务 / 托管主机可比公司
        - 它给出有用的底线：公开市场会如何严苛定价平台溢价有限的基础设施服务公司。
        - 历史上曾陷困境，资产负债表背景也很不同，因此是偏严苛的可比对象。
      - - Kyndryl
        - FY2026 收入约 $15.09B，对应市值约 $2.68B
        - 约 0.2x 收入；公开基础设施服务基准
        - 显示即使规模很大，纯服务 / 基础设施倍数也可以低到什么水平。
        - 传统外包业务占比和较慢增长，让它比 Megazone 更不像产品化公司。
      - - Accenture
        - 2025 年收入约 $69.67B，对应市值约 $110.97B
        - 约 1.6x 收入；高端多元化咨询基准
        - 代表服务驱动转型公司在公开市场规模、信任和多元化上的上沿。
        - 规模远大于 Megazone，业务更多元，运营风险也低得多。
      - - Globant
        - 2025 年收入约 $2.45B，对应市值约 $1.71B
        - 约 0.7x 收入；数字原生工程 / 咨询可比公司
        - 位于商品化服务和更高价值数字化转型叙事之间，是有用的中点。
        - 2026 年市场走弱可能低估其公允价值，且地域组合与 Megazone 不同。
    notes: 可比公司有意以服务驱动型为主，因为 Megazone 的公开经济指标仍更像高质量 MSP，而不是纯软件公司。
    enumerationScope:
      coverage: sample
      basis: >-
        The table uses a small, decision-useful sample of public managed-services and digital-consulting comparables
        rather than a full screen of every cloud or IT-services peer.
