      - number: '2.2'
        title: 规模测算镜头与采用经济性
        blocks:
          - type: paragraph
            body: >-
              公开规模来源对方向一致、对精度不一致，因此后续章节应使用多镜头方法，而不是只抓一个头条 TAM。Mordor 的韩国报告是观察广义云市场最结构化的运营镜头：2025
              年公有云占部署份额领先，混合云预计增长最快，大型企业贡献约 71% 收入，BFSI 是当前最大终端用户行业，医疗是增长最快垂直领域。相邻区域语境中，Mordor 的全球托管服务报告和亚太托管服务预测都显示
              APAC 是增长最快区域，企业外包需求由云复杂度、网络安全和成本治理驱动。Statista 韩国公有云软件页面提供了另一个锚点：它确认到 2026 年公有云软件市场应比 2015
              年水平翻逾一倍，尽管具体数字在付费墙后。含义是，Megazone
              不需要在所有云支出里拿到总市场领导地位，也能成长为数十亿美元级服务平台；它需要守住快速增长的韩国企业和公共部门云采用之上的高端托管层。难点仍在于，为韩国多云托管服务隔离出一个可辩护的 SAM 或
              SOM，因为专有估算会以不同方式混合基础设施支出、软件订阅和服务收入。
