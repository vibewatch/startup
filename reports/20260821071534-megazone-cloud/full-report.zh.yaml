              分母纪律简单但重要。Megazone 是私有公司，所以 >KRW 4 trillion 是私人交易估值标记， 不是连续交易的企业价值；公开市场投资者也仍不知道详细资本重组结构。即便如此，粗略比较仍有用。 以
              2025 年 KRW 1.7496 trillion 收入为基数，KRW 4.0 trillion 估值意味着约 2.3x 收入。 该倍数显著高于 Rackspace、Kyndryl
              等困境或增长较慢的基础设施服务可比公司，也高于 Globant 当前公开倍数， 甚至高于 Accenture 规模更大、更多元的咨询倍数。因此，公开可比表并不是说 Megazone 荒谬高估；
              含义是投资者已经在为质量和稀缺性溢价付费。若 Megazone 证明增长耐久性更高、产品附加率更强、 IPO 级披露比公开同行更干净，这个溢价可以成立。没有这些证明，当前估值标记更像充分定价，而不是被忽视。
