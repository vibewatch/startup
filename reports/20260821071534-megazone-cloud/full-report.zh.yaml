      - number: '4.3'
        title: 成本结构、毛利率路径与现金生成
        blocks:
          - type: paragraph
            body: >-
              Megazone 的 2025 年申报很有价值，因为它终于让投资人看到利润表和现金流量表的大致形状，而不是只有收入头条。销售成本为 1.5679 万亿韩元，对应收入 1.7496 万亿韩元，留下 1817
              亿韩元毛利润，毛利率约 10%。约 10% 的毛利率远低于高质量企业 SaaS 经济性，更像一家公司仍承担大量云转售、基础设施、专业服务和支持交付成本。销售、一般及行政费用为 1815
              亿韩元，几乎与毛利润相同，也解释了为何强劲收入增长之后，经营利润也只是勉强转正。更强的运营信号是现金转化：经营活动净现金从前一年的 -164 亿韩元改善到 942 亿韩元，现金及等价物升至 4300
              亿韩元以上。即便如此，市场还不能证明 Megazone 是高毛利复利机器。2025 年利润扭转是真实的，但毛利率桥仍取决于业务组合转向 AI、安全、优化和其他更高价值工作，而不是只靠原始云用量。
