      - 行动含义
    rows:
      - - IPO / 披露风险
        - 申报准备度和披露一致性
        - 韩文原件、管理层叙事和招股书草稿之间存在实质差距
        - 暂停投资或重新定价，直到申报级证据对齐
      - - AWS 集中度
        - 合作伙伴来源收入 / 管线 / 产品使用组合
        - 单一伙伴暴露被证明远高于公开材料暗示，或关键条款恶化
        - 按更低利润率持久性和更弱战略独立性承销
      - - 运营 / 安全风险
        - 事故历史和 SLA 纪律
        - 没有可信事故登记表、RCA 实践薄弱，或受监管客户问题反复出现
        - 把公开合规表层视为不足以缓释风险
      - - 客户质量风险
        - 头部账户集中度和留存
        - 即便客户数超过 8,000，仍出现低留存、鲸鱼客户依赖或续约经济性弱
        - 给规模故事打折，并把估值重新锚定到服务同业
      - - 执行 / IPO 时点风险
        - 同步扩张负荷
        - 美国、AI 和 IPO 项目都消耗现金和领导层带宽，却没有清晰 ROI 排序
        - 支持溢价估值前，要求分阶段里程碑
    notes: 这些终止标准把抽象尽调担忧转成能改变承销条款的阈值。
    claimRefs:
      - CR002
      - CR014
      - CR024
      - CR030
      - CR031
      - CR032
      - CR033
      - CR042
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 数值
      - 理由
    rows:
      - - 建议
        - 观察
        - 业务质量真实，但若没有更好的私有披露，当前私募估值留下的安全边际有限。
      - - 置信度
        - 中
        - 公开信号方向上强，但股权结构细节、客户质量和伙伴经济性仍未公开。
      - - 风险评级
        - 高
        - AWS 集中度、披露缺口和类似服务公司的经济性，都可能迅速压缩溢价。
      - - 估值立场
        - 合理至偏高
        - 按约 2025 年收入 2.3 倍计算，Megazone 的交易水平已经高于公开服务公司和 MSP 可比公司。
      - - 基准情景估值区间
        - KRW 3.8T-KRW 4.4T
        - 该区间假设盈利能力保持，产品化支撑公司在 IPO 准备中获得适度稀缺性溢价。
      - - 决策含义
        - 等待更低进入价或更充分披露
        - 更好的私有证据或更有利进入价，比另一笔头条投资更快改变判断。
    notes: 建议明确对价格敏感，而不是对公司质量的笼统判断。
