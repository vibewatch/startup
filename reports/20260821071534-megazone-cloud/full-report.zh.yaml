      - number: '7.4'
        title: 客户、利润率和执行风险现在比生存风险更重要
        blocks:
          - type: paragraph
            body: >-
              Megazone 的财务状态在 2025 年明显改善，但公司看起来仍像规模化、服务主导的 MSP，而不是完全软件化的平台业务。
              申报文件支撑的数据显示公司已盈利且经营现金流为正，但公开分析仍指向较薄的毛利率结构、大额累计亏损， 且缺少证据证明 2025 年代表可重复的利润率改善轨迹，而不只是上市前时点恰好的清理。客户质量是并行问题。
              Megazone 可以指向超过 8,000 家客户和 Korean Re 等少数强具名证据，但公开材料不披露头部账户集中度、留存、 钱包份额，或合作伙伴与直销收入组合。结果是，投资者只能从数量和 logo
              承保庞大客户基础，而不是从续约经济性出发。 执行议程进一步放大不确定性：管理层同时推进美国扩张、AI / 安全产品化、海外增长和 IPO 就绪。每项举措单独看都合理；
              放在一起会提高管理层被拉扯的概率，尤其当关键合作伙伴重新定价、标杆客户延期，或资本市场窗口收窄时。
