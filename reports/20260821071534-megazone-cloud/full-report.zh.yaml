  - id: TV005
    title: 投资逻辑破坏与终止触发表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 伙伴集中度极端
        - 来自 AWS 的收入、管线或产品使用量显著高于公开证据所暗示的水平
        - 削弱独立性逻辑，并限制可支撑的溢价
        - 向服务同行重新定价，避免按当前标记价买入
      - - 客户质量披露令人失望
        - 留存率低、大客户集中，或多产品绑定弱
        - 削弱支撑溢价定价的平台抬升故事
        - 在当前估值下，将建议从观察调至回避
      - - 产品经济性仍像服务
        - 模块级毛利率和支持负担显示软件杠杆有限
        - 压低乐观情景上行空间，并收窄稀缺性溢价
        - 只使用悲观 / 基准区间，并要求更低入场价
      - - 股权结构对投资人不友好
        - 资本重组后的优先级、契约或流动性条款显著削弱普通股经济性
        - 让名义估值难以代表真实入场经济性
        - 暂停，直到普通股等价定价清晰
      - - IPO 窗口关闭或申报质量滞后
        - 上市延迟或披露缺口削弱估值支撑
        - 将 Megazone 推回私募市场不透明状态，并降低可接受可比倍数
        - 留在观察名单，不追逐动量
    notes: 这些触发因素旨在改变投资判断行为，而不只是改变叙事口吻。
    claimRefs:
      - CV011
      - CV020
      - CV024
      - CV026
      - CV033
      - CV034
      - CV035
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 股权结构表与资本重组条款
        - Glenwood 之后的所有权、证券优先级、契约和退出机制
        - 判断名义估值是否匹配普通股经济性
        - 公司法律顾问、董事会材料和交易文件
      - - 客户质量指标
        - 前 20 大客户集中度、NRR / GRR、Logo 流失、多产品绑定和续约日历
        - 验证 8,000+ 客户是否转化为持久价值，而不只是规模
        - 财务团队、销售运营和队列资料包
      - - 伙伴经济性
        - AWS 和其他云收入结构、返利、市场条款，以及直销与渠道来源
        - 显示 Megazone 真正掌握多少利润率和账户控制权
        - 合作伙伴团队、财务和合同摘要
      - - 按模块拆分的产品经济性
        - AIR Studio、SpaceONE、HALO、Hyper 产品的毛利率、部署数量、支持负担和路线图人员配置
        - 将可重复的平台上行空间与咨询包装区分开
        - 产品 P&L 和运营复盘
      - - 运营质量
        - 事故历史、SLA 账册、复盘报告和受监管客户访谈
        - 判断 IPO 级审视下风险应收窄还是扩大
        - CTO、安全团队和客户尽调会议
    notes: 解决这五个问题，比再出现一个融资头条更能改善投资建议。
    claimRefs:
