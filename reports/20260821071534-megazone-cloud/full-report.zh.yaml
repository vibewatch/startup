companyProfile:
  summary: >-
    Megazone Cloud 是一家韩国云托管服务和企业转型公司，2018 年从更大的 Megazone
    集团拆分出来。公司靠超大规模云厂商迁移、托管云运维和企业支持服务打下核心位置，随后把公开产品叙事扩展到多云治理、FinOps、安全和 AI 运维，资产包括 SpaceONE 和 AIR
    Studio。公开证据现在显示，公司已经做到真实规模和盈利，并在准备 IPO；但它的公开披露仍更像一家强势私营 MSP，而不是完全透明的平台公司。
  foundedDate: '2018-01-01'
  foundingLocation: Seoul, South Korea
  headquarters: Seoul, South Korea
  productSummary: >-
    Megazone 销售云迁移、托管云运维、FinOps 与账单优化、多云治理、安全服务，以及更新的 AI 工作流和运维产品，包括 AIR Studio、SpaceONE、HyperMig、Hyper Billing、Hyper
    Control 及配套打包方案。
  customerFocus: 韩国大型企业、公共部门和受监管机构，在亚洲或美国扩张的跨国及区域客户，以及采用云、AI 和安全现代化的企业团队。
  businessModel: 主要是服务驱动的云和托管运维模式，靠迁移、托管服务交付、优化、支持和伙伴生态活动变现；公司也希望在超大规模云厂商基础设施之上，拿到更多可重复的产品和治理收入。
  stage: Late-stage private / pre-IPO
  fundingStatus: >-
    公开融资历史包括 2022 年 Series C，当时估值约 $1.8 billion；以及 2026 年 Glenwood Credit 的 KRW 800 billion 资本重组，隐含估值超过 KRW 4
    trillion，并支持 IPO 准备。
  disclosureProfile: private-disclosed
