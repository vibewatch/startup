      - number: '4.5'
        title: 财务结论、基准框架与剩余障碍
        blocks:
          - type: paragraph
            body: >-
              财务结论是：规模上建设性，质量上谨慎。Megazone 不再只是一个靠风投融资的云故事；经审计 2025 年收入规模、正净利润、正经营现金流和净现金，都指向一家真实业务，并具备 IPO
              可选性。不过，当前经济性仍更接近大型服务主导
              MSP，而不是纯高毛利软件平台。毛利率不高，经营利润率刚刚转正，累计亏损相对当前盈利仍然巨大。另一个障碍是数据一致性。公开追踪器在累计融资，甚至员工数等基本规模统计上分歧很大，因此投资人应先信申报级数字，再看二级数据库。Glenwood
              资本重组、IPO 承销团和更高价值 AI/安全举措都改善了局面，但不能消除对留存、实际成交价、渠道返利、关联方交易和资本重组后资本结构的私下披露需求。简言之，Megazone
              的收入和资产负债表已经足够可信，可以进入认真承销；它的长期估值仍取决于管理层能否证明 2025 年是真正利润率斜坡的起点，而不是上市前的一年清理。
