      - number: '1.2'
        title: 领导层、组织与地理布局
        blocks:
          - type: paragraph
            body: >-
              Megazone Cloud 的公开领导层画像信息量足，但并不完全干净，这本身就是尽调信号。用户提供的背景和较早市场资料把 Lee Ju-wan（通常写作 Max Lee）指向 IPO
              进程中的集团负责人；MegazoneCloud 2024 年承销商公告确实称 CEO 为 Max Lee。但公司近期关于美国扩张和 AWS 奖项的自有公告把 CEO 写作 Doug Yeum，而 New York
              State 2026 年 7 月美国总部公告在区域语境中引用了 MegazoneCloud CEO Bob Moore。最可能的解释不是一次无人说明的 CEO
              更替，而是集团、全球和美国实体之间角色分拆；但管理层应澄清确切法律实体和汇报结构。地理信息也更像层级叠加，而不是相互矛盾。官方和公司关联来源把品牌描述为总部在 Seoul，ServiceNow 和 EMIS
              则露出 Gwacheon 作为运营或注册地址。同一批来源还描述了更宽的全球足迹：官方页面称有九个全球办公室，新闻稿称业务覆盖九到十个国家，New York State 文件确认在 Monroe County
              正式建设美国总部，并计划五年内最多创造 122 个岗位。正确结论是，Megazone 确有国际化运营意图，但韩国母公司、2018 年云子公司和区域分支之间的确切边界，应在尽调材料中确认，不能只靠营销文案推断。
