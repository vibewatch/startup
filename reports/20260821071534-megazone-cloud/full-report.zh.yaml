        title: 公开牵引指标与单位经济性代理指标
        blocks:
          - type: paragraph
            body: >-
              目前最好的公开牵引锚点，是经审计级收入、客户数说法、伙伴来源可信度和少量追踪器快照，而不是明确的 SaaS 指标。2025 年申报支撑数字最可靠：1.7496 万亿韩元收入、27.9%
              增长、净利润为正、经营现金流为正。公司官方公告和 AWS 奖项公告也反复提到，Megazone 服务 8,000 多家客户、拥有 2,000
              多名专家；即使队列质量仍未披露，这也支撑了真实商业规模。仍缺失的是投资人通常下一步想看的承销指标：分部总留存、净收入留存（NRR）、CAC、回本周期、ACV、伙伴与直销结构、续约率，以及按超大规模云厂商拆分的收入集中度。公开数据提供商能补上一些叙事缺口，但补得并不干净。CB
              Insights、PitchBook、Latka 和 The Company Check
              在累计融资、当前收入和员工数上互相不一致，因此适合交叉校验，不适合精确引用。结果是一家公司规模可见，但效率画像仍主要从经营结果和伙伴深度推断，而不是来自披露的 KPI 看板。
