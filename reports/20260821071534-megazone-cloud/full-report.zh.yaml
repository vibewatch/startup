      - number: '2.4'
        title: 驱动因素、约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Megazone 所在市场最强的需求驱动因素现在很容易点名：政府云优先政策、AI 工作负载增长、网络安全压力、多云蔓延，以及把资本开支型基础设施转成运营费用的需要。Mordor 韩国报告明确把 AI/ML
              工作负载增长、超大规模云厂商建设和中小企业补贴列为主要增长催化剂；其全球托管服务报告则强调多云复杂度、托管安全和
              FinOps。同一批来源也说清楚了，市场并非无摩擦。数据主权规则、云安全事故、人才短缺、供应商锁定担忧，以及面对美国超大规模云厂商的利润率挤压，都会踩住采用刹车。Korea Herald 还给出行业特定警告：国内
              MSP 很难守住盈利，因为高初始投资成本叠加了对全球 CSP 伙伴的深度依赖。该警告对 Megazone
              尤其相关，因为市场增长本身并不保证价值捕获。市场庞大且扩张，但基本迁移和转售层也结构性竞争、部分商品化。因此，Megazone 经济性的质量将取决于它能否持续把业务组合推向更高毛利的优化、安全、AI
              编排和行业特定托管服务，而不是纯粹转售云。
