      - number: '2.3'
        title: 买方、细分与价值链
        blocks:
          - type: paragraph
            body: >-
              Megazone Cloud 最有吸引力的买方不是泛泛的 IT 部门，而是要处理重合规现代化难题的预算所有者。Mordor 和 Trade.gov
              都指向大型企业、BFSI、公共部门和医疗，认为这些是最重要的支出池。买方通常是 CIO、CTO、CDO 或 CISO；日常用户是云平台、基础设施、应用或安全团队；付费方可能在共享 IT
              预算、业务转型办公室或受监管业务线里。韩国政府战略很重要，因为它加速形成了私营企业可以复制的公共参考市场。MOIS 和 OECD 的韩国数字政府评估都描述了一个政府体系：数字政府、AI
              和数据使用已经进入行政改革核心。MSIT 2025 年新闻稿还加入了一项三年云政策，目标是在 AI 时代把国内云市场扩大到年 10 万亿韩元。中小企业是下一个增长切口，而不是当前价值中心。Mordor
              称，中小企业增速快于大型企业，因为补贴最高可覆盖 80% 采用成本；但它们也更依赖托管伙伴，因为内部缺少云架构师、FinOps 人员和安全深度。
