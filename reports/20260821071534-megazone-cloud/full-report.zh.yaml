  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：观察，不是回避，但必须严守价格和披露纪律
        blocks:
          - type: paragraph
            body: >-
              公开记录给出的最清晰结论是，Megazone 值得投资者继续关注，但不值得在当前估值标记上盲目兴奋。 公司已经盈利、具备全国规模，并有可信的 IPO 准备，因此不同于许多仍主要靠故事支撑估值的后期私有公司。
              与此同时，最新 >KRW 4 trillion 估值相对上市托管服务和咨询同行隐含溢价，尽管其公开披露更薄， 且明显依赖合作伙伴生态，尤其是
              AWS。组合本身不支持回避，因为业务显然真实；但也不支持买入，因为公开证据尚未显示足够安全边际。 因此建议是中等确信度、高风险的观察：业务质量值得尽调，但当前估值只有在私人证据证明 Megazone
              能比上市同行维持更好增长、 更粘的客户经济性和更平台化的利润率时，才更容易站得住。
