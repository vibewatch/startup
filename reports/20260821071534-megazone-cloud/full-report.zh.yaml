  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Megazone 的主要风险沿少数通道传导：合作伙伴杠杆、披露摩擦和薄弱的私募级数据，都会影响利润率、信任和估值支撑。
    data:
      nodes:
        - id: partners
          label: AWS / 合作伙伴杠杆
          detail: 云市场、奖项和 AI 发布依赖，使上游影响力集中。
        - id: reg
          label: 监管 / 披露负担
          detail: IPO 申报、隐私义务和 AI 监管都会抬高执行要求。
        - id: ops
          label: 运营透明度缺口
          detail: 公开事故和 SLA 证据有限，运行质量难以定价。
        - id: customers
          label: 客户质量不透明
          detail: 客户数可见；留存和集中度不可见。
        - id: margin
          label: 利润率韧性
          detail: 如果合作伙伴重新定价或交付成本上升，服务型经济性会变弱。
        - id: trust
          label: 企业信任
          detail: 敏感行业买家对事故或披露错配反应强烈。
        - id: ipo
          label: IPO 时点灵活性
          detail: 能主动选择上市时点，而不是被迫上市。
        - id: valuation
          label: 估值支撑
          detail: 溢价倍数是否仍站得住。
      edges:
        - from: partners
          to: margin
        - from: partners
          to: trust
        - from: reg
          to: ipo
        - from: reg
          to: trust
        - from: ops
          to: trust
        - from: customers
          to: valuation
        - from: margin
          to: valuation
        - from: trust
          to: valuation
        - from: ipo
          to: valuation
    approximationNotes: 该 DAG 突出公开证据中最可见的因果路径；不声称精确概率或线性时点。
    claimRefs:
      - CR002
      - CR006
      - CR014
      - CR021
      - CR024
      - CR030
      - CR032
      - CR033
      - CR042
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Megazone 掌握客户集成和治理层，但可见的商业和技术依赖仍大量经过合作伙伴生态和资本市场中介。
    data:
      nodes:
        - id: mzc
          label: Megazone Cloud 核心交付引擎
        - id: aws
          label: AWS 云、APN 和市场生态
        - id: multi
          label: Azure / Google / 多云集成
        - id: cust
          label: 企业和受监管行业客户
        - id: prod
          label: AIR Studio / SpaceONE / 安全产品
        - id: uw
          label: 承销商和上市顾问
        - id: invest
          label: Glenwood 和此前 PE 股东
      edges:
        - from: aws
          to: mzc
        - from: multi
          to: mzc
        - from: prod
          to: cust
        - from: mzc
          to: prod
        - from: mzc
