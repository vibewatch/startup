      - number: '4.4'
        title: 资本充足性、融资依赖与 IPO 准备度
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Megazone 资本状况好于许多未盈利同业，但资本故事仍处于过渡期，并未完成。母公司披露显示，截至 2025 年末，现金及等价物为 4328 亿韩元，总借款约 913 亿韩元，总权益 6152
              亿韩元，支持净现金判断。公司还称可用于新业务的资金约 6000 亿韩元，并计划用 IPO 募资补充。资本市场侧，承销团已经就位，Sedaily 报道称恢复盈利重新打开了 2026 年提交 KOSPI
              申请的路径。Glenwood Credit 的 8000 亿韩元交易看起来具有战略重要性，因为它用结构化融资买出或降低 MBK 与 IMM 带来的悬压，同时提高 Megazone
              在云子公司的持股。但交易也凸显出仍未公开的内容：Glenwood 之后的确切所有权、工具条款、任何正在进行的 Series D、契约约束，以及 IPO 时间表是否出于股东流动性需求。Baker McKenzie
              的 KRX 指南说得很清楚：上市需要三年经审计财务报表和详细证券报告，因此问题不再是 Megazone 能否讲出增长故事，而是它能否用申报级证据支撑一套可持续的利润率和治理故事。
