      - number: '1.3'
        title: 资本结构、盈利能力与 IPO 路径
        blocks:
          - type: paragraph
            body: >-
              Megazone Cloud 最影响决策的公开事实，集中在 2024-2026 年融资和盈利叙事里。Seoul Economic Daily 报道，2024 年收入为 1.7496 万亿韩元，同比
              +27.9%，经营利润 2.30 亿韩元，净利润 82 亿韩元。关键在于，盈利能力此前是上市的主要闸门；同一家媒体后来也把扭亏为盈直接绑定到更快的 IPO 时间表。2026 年 6 月，Glenwood
              Credit 同意向 Megazone 投资 8000 亿韩元，资金通过包含可交换债的结构化融资，用于回购 MBK Partners Special Situations 和 IMM Private Equity
              在 Megazone Cloud 的持股。该交易据报道隐含企业价值超过 4 万亿韩元，并被明确表述为清理股东基础、移除 IPO 后悬压风险的方式。公开来源对更早融资历史说法不一。2024 年承销商公告称 2022
              年 Series C 投资为 326 million dollars，估值 1.74 billion dollars；GetLatka 则报道 Series C 为 343 million dollars、估值
              1.8 billion dollars，累计融资 510 million dollars。上述数字都指向独角兽身份，但精度不足，不能当作经审计的股权结构事实。因此，当前承销应首先依赖 2026 年盈利和
              Glenwood 资本重组数据，同时把累计融资总额和历史所有权拆分作为数据室待核验事项。
