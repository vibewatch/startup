  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Megazone Cloud 处在两个重叠市场的交界，而不是落在一个干净的分析师分类里。更宽的一层是韩国云计算市场，包括公有、私有和混合基础设施，以及平台和软件消费。Mordor 2026 年国家视角把该市场估为
              2026 年 12.46 billion dollars、2031 年 38.28 billion dollars；DataCube 则用更低的近期基数和更长周期的 9.97% CAGR
              描述同一市场。嵌在其中的更窄托管服务层，才是 Megazone 最在意的市场：外包迁移、现代化、安全、FinOps 和持续多云运维。Korea Herald 称之为国内 MSP 市场，并称其 2023 年规模约
              7 万亿韩元，次年将走向 12
              万亿韩元。因此，市场边界应排除没有服务层附着的超大规模云厂商纯软件订阅收入，并纳入伙伴主导的架构、托管运维、安全和云成本治理。主要替代方案仍是企业内部基础设施团队、韩国财阀集团内的绑定型 SI 子公司，以及
              AWS、Microsoft、Google 自身的专业服务团队。
