  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - AI / 控制平面产品跑出强绑定率和利润率；IPO 时点有利；客户和伙伴披露收口良好。
        - KRW 5.2T-KRW 6.1T，约为 2025 年收入的 3.0x-3.5x；若增长保持强劲，按远期收入可更高。
        - 需要产品经济性显著好于传统 MSP 同行。
        - 可能，但需要证据
      - - 基准
        - 盈利能力守住，IPO 准备继续推进，高端服务加平台叙事仍可信，但尚未完全证实。
        - KRW 3.8T-KRW 4.4T，约为 2025 年收入的 2.2x-2.5x。
        - 如果公开可比公司继续锚定服务类倍数，上行空间有限。
        - 以当前公开数据看最可能
      - - 悲观
        - 投资人主要把 Megazone 视为 MSP / 集成公司，伙伴依赖度仍高，或披露显示队列质量更弱。
        - KRW 2.5T-KRW 3.2T，约为 2025 年收入的 1.4x-1.8x。
        - 即便业务保持盈利且具备战略价值，倍数也可能被压缩。
        - 尽调结果不佳或 IPO 市场情绪转弱时可信
    notes: 情景只是投资人用于价格纪律的速记，不是管理层指引，也不是对企业价值的精确估算。
