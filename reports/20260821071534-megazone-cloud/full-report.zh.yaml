  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、披露和 IPO 时点风险可控，但尚未完全关闭
        blocks:
          - type: paragraph
            body: >-
              Megazone 如今离公开市场足够近，上市机制已不再是假设。公司在 2024 年正式选定主承销商， Sedaily 在 2026 年报道称盈利恢复让 KOSPI 申报路径重新打开；Glenwood Credit
              的 800 billion won 投资也被明确放在 IPO 准备背景下。 上述均为正面信号，但也压高了外界对披露质量和治理就绪度的预期。English DART 自身提示，英文披露属自愿且不具法律效力，
              非韩国投资者因此不能只依赖译文披露。Baker McKenzie 的韩国上市指南还指出，经审计财务报表和详尽证券报告是核心要求； 管理层叙事与申报级证据之间若有任何错位，都会成为真实承销风险。叠加韩国 AI
              Basic Act 已生效、FSC 仍在修订资本市场规则， Megazone 尝试上市时，云、AI 和市场治理义务仍在演进。剩余问题不是 Megazone 缺顾问，而是公开来源仍未披露 Glenwood
              之后的股权结构表、 工具条款，也未说明 IPO 时点有多少由股东流动性需求驱动，多少来自战略选择权。
