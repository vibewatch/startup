  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与边界
        blocks:
          - type: paragraph
            body: >-
              Megazone Cloud 的竞争场是一片层叠版图，而不是整齐的一对一对手集合。最接近的直接同业是 Bespin Global，另一家围绕超大规模云厂商伙伴关系和托管运维搭建的韩国独立多云
              MSP。但财务实力最强的在位者，是韩国财阀 IT 子公司：Samsung SDS、LG CNS 和 SK C&C。这些公司不是纯
              MSP，却争夺同一批大型企业和公共部门转型预算，同时享有集团内绑定收入、更厚资产负债表，以及更容易获取大型标杆项目的通道。电信和平台相邻玩家也重要。KT Cloud 和 SK Telecom 正在建设云与 MSP
              能力，全球咨询公司和超大规模云厂商自身服务团队，也能在现代化、AI
              或受监管工作负载变成战略议题时进入高端客户。实际版图因此横跨独立直接对手、多元化韩国在位者、电信进入者和全球云咨询机构。重要性在于，Megazone
              的差异化不只要对抗另一家转售商或迁移公司，还要对抗买方的其他选择：绑定型 SI 子公司、AWS 或 Microsoft 直接帮助，或拥有更大人才池的全球系统集成商。
