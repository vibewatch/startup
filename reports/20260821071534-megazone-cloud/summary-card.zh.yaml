  topStrengths:
    - 韩国领先云 MSP 地位给 Megazone 带来真实规模、客户入口和战略相关性。
    - 2025 年盈利和正向现金生成信号，让公司相对许多私营同行承受更小的短期融资压力。
    - 公司已从单纯迁移工作，扩展到治理、FinOps、安全和 AI 运维产品。
    - 稳固的 AWS 生态地位和反复获得的伙伴认可，验证了执行质量和市场入口。
    - IPO 准备和 Glenwood 的资本重组，提供了通向公开市场流动性与更多披露的可行路径。
  topRisks:
    - 按收入倍数看，当前私募估值已高于以服务为主的上市可比公司。
    - AWS 集中度仍是公开记录中最清晰的战略依赖。
    - 股权结构、伙伴经济性和客户集中度的公开披露仍有限。
    - 产品证据比过去更强，但在较新的 AI 和安全模块上仍不均衡。
    - 缺少事故历史和 SLA 细节，削弱了对 IPO 级运营成熟度的信心。
  unresolvedGaps:
    - Glenwood 交易后的确切股权结构表、证券优先级，以及任何影响普通股经济性的契约。
    - 8,000+ 客户群中的客户集中度、留存和多产品附加销售。
    - AWS、市场平台和其他伙伴渠道中的收入归属与毛利率敏感性。
    - AIR Studio、SpaceONE 以及更广泛 Hyper / HALO 组合的模块级产品经济性。
    - 完整运营质量证据，包括事故日志、SLA 纪律和可引用的受监管客户。
