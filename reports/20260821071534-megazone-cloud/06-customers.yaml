    {
      "id": "retention-durability-and-concentration-gaps",
      "title": "Retention, durability, and concentration gaps",
      "body": "The largest weakness in the customer chapter is not lack of adoption proof; it is lack of durability proof. No reviewed public source disclosed NRR, GRR, renewal rate, contract length, cohort behavior, NPS, or churn. There is also no clean top-customer concentration disclosure by revenue or gross profit. This matters because a company can have thousands of customers and still be economically dependent on a relatively small set of hyperscaler-linked enterprise accounts. The public evidence is directionally encouraging: full-lifecycle managed services, AI-governance work, regulated-industry projects, and international subsidiaries all suggest relationships that could extend well beyond a one-off migration. But investors should resist assuming stickiness from logo count alone. Even the strongest named cases are mostly company- or partner-authored, and few provide outcome metrics after deployment. The right interpretation is that Megazone has crossed the threshold of “real customer proof,” but has not yet crossed the threshold of “publicly underwritable customer quality.”",
