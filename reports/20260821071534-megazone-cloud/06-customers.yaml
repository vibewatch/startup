      "id": "geographic-and-vertical-expansion",
      "title": "Geographic and vertical expansion evidence",
      "body": "Expansion evidence points in two directions: geography and deeper regulated-industry use cases. On geography, official releases describe operations in nine or ten countries and explicitly call out the United States, Japan, Southeast Asia, Oceania, and the Middle East. The U.S. expansion release says Megazone is targeting Korean enterprises operating in the United States as well as local buyers, while 2025 financial disclosures put overseas revenue at about $99.6 million and earlier IPO materials said overseas MSP sales had risen 44 percent year over year. On vertical expansion, 2026 sources show Megazone leaning harder into insurance, healthcare, public institutions, higher education, and AI infrastructure rather than staying confined to generic migration work. The Korean Re agreement is especially important because it implies land-and-expand potential across a complicated financial workflow, not just infrastructure hosting. Likewise, the Acrylic partnership explicitly targets enterprise and public-institution GPU infrastructure with planned healthcare, public, and insurance use cases. The customer base therefore appears to be moving up-market and into more specialized workflows, which should help account stickiness if execution holds.",
