  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Megazone Cloud has credible evidence of real customer adoption, but the public customer record is stronger on breadth than on retention. Official and partner-authored sources now place the company at more than 8,000 customers globally, while older partner pages still cite about 5,000 AWS-solution customers and 2024 IPO materials cite over 7,000 clients. Named proof is strongest in regulated and institution-heavy segments: Korean Re in reinsurance AX, a nationwide emergency-medical data-sharing platform led by major hospitals, public-sector education and research work in Japan, and AI-infrastructure programs aimed at public institutions, healthcare, and insurance. The weaker part of the diligence record is durability. Public sources do not disclose NRR, churn, contract length, top-customer concentration, or revenue by vertical, so the main customer question is not whether Megazone has real deployments—it does—but whether the installed base is sticky and economically concentrated in ways that are still hidden from open-source view."
  },
  "sections": [
    {
      "id": "segment-map-and-scale-signals",
      "title": "Customer segmentation, buyers, and scale signals",
      "body": "Megazone's customer base is best read as a segmented enterprise and institutional book rather than a single homogeneous cohort. The most repeated current company claim is more than 8,000 customers worldwide, while a 2024 Bloomberg/Yahoo story cited over 7,000 clients and older partner surfaces from AWS and Denodo cited about 5,000 AWS-solution customers. Those figures are not identical, but together they support a broad and growing installed base. The segment mix is also clearer than the exact count. Denodo and AWS partner pages explicitly mention large enterprises, game companies, startups, and public institutions; newer AI and expansion releases describe large enterprises, Korean companies operating in the United States, and public-sector or regulated-industry buyers. Megazone therefore appears to serve both classic cloud-transformation customers and newer AI-orchestration buyers across enterprise, public, education, and financial sectors. The missing link is economic segmentation. Public sources rarely say who the payer is inside each account, what percentage of revenue comes from regulated industries, or whether a few major customers dominate gross profit even if the customer count is high.",
