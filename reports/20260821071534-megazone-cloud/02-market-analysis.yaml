      "id": "buyers-segments-and-value-chain",
      "title": "Buyers, Segments, and Value Chain",
      "body": "The most attractive buyers for Megazone Cloud are not generic IT departments but budget owners facing compliance-heavy modernization problems. Mordor and Trade.gov both point to large enterprises, BFSI, public sector, and healthcare as the most important spend pools. The buyer is usually the CIO, CTO, CDO, or CISO; the daily user is the cloud platform, infrastructure, application, or security team; and the payer may sit in a shared IT budget, a business transformation office, or a regulated-business line. Korea's government strategy matters because it accelerates the public reference market that private enterprises can copy. MOIS and the OECD's Korea digital-government review both describe a state apparatus that has moved digital government, AI, and data use into the core of administrative reform. MSIT's 2025 press release adds a three-year cloud policy meant to grow the domestic cloud market to 10 trillion won annually in the AI era. SMEs are the next growth wedge rather than the current value center. Mordor says they are growing faster than large enterprises because subsidies can cover up to 80 percent of adoption costs, but they still rely more heavily on managed partners because they lack internal cloud architects, FinOps staff, and security depth.",
