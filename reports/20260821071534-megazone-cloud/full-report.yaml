  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation: track, not avoid, but only with strict price and disclosure discipline'
        blocks:
          - type: paragraph
            body: >-
              The cleanest conclusion from the public record is that Megazone deserves continued investor attention but
              not blind enthusiasm at the current mark. It is already profitable, operates at national scale, and has
              credible IPO preparation, which separates it from many late-stage private companies still valued mainly on
              story. At the same time, the latest >KRW 4 trillion valuation implies a premium to listed managed-services
              and consulting peers despite thinner public disclosure and meaningful dependence on partner ecosystems,
              especially AWS. That combination argues against an avoid call because the business is clearly real, but it
              also argues against a buy call because public evidence does not yet show enough margin of safety. The
              recommendation is therefore track with medium confidence and high risk: the business quality justifies
              diligence, yet the current valuation only works cleanly if private evidence proves Megazone can sustain
              better growth, stickier customer economics, and more platform-like margins than public peers.
            claimRefs:
