      - number: '2.4'
        title: Drivers, Constraints, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers for Megazone's market are now easy to name: government cloud-first policy, AI
              workload growth, cybersecurity pressure, multi-cloud sprawl, and the need to convert capex-heavy
              infrastructure into operating expense. Mordor's Korea report explicitly scores AI or ML workload growth,
              hyperscaler build-outs, and SME subsidies as major growth catalysts, while its global managed-services
              report emphasizes multi-cloud complexity, managed security, and FinOps. The same sources also make clear
              that this is not a frictionless market. Data sovereignty rules, cloud-security incidents, talent
              shortages, vendor lock-in fears, and margin squeeze against U.S. hyperscalers all act as adoption brakes.
              Korea Herald adds an industry-specific warning that domestic MSP profitability is hard to secure because
              high initial investment costs sit on top of deep dependence on global CSP partners. That is particularly
              relevant for Megazone because market growth alone does not guarantee value capture. The market is large
              and expanding, but it is also structurally competitive and partially commoditizing at the basic migration
              and resale layers. The quality of Megazone's economics will therefore depend on whether it can keep moving
              its mix toward higher-margin optimization, security, AI orchestration, and industry-specific managed
              services rather than pure pass-through cloud resale.
            claimRefs:
