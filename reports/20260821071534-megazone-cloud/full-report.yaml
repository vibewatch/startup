      - number: '4.4'
        title: Capital adequacy, financing dependency, and IPO readiness
        blocks:
          - type: paragraph
            body: >-
              Public evidence suggests Megazone is better capitalized than many unprofitable peers, but the capital
              story is still transitional rather than finished. The parent-company disclosure shows 432.8 billion won of
              cash and cash equivalents, total borrowings of roughly 91.3 billion won, and total equity of 615.2 billion
              won at year-end 2025, which supports a net-cash reading. The company also said it had about 600 billion
              won of available funds for new businesses and intended to supplement that with IPO proceeds. On the
              capital-markets side, the underwriter syndicate is already in place and Sedaily reports that the return to
              profit reopened the path to a KOSPI filing in 2026. Glenwood Credit's 800 billion won transaction looks
              strategically important because it uses structured financing to buy out or reduce overhang from MBK and
              IMM while increasing Megazone's stake in the cloud subsidiary. But that also highlights what still is not
              public: exact post-Glenwood ownership, instrument terms, any active Series D, covenant constraints, and
              whether IPO timing is needed for shareholder-liquidity reasons. Baker McKenzie's KRX guide makes clear
              that three years of audited financial statements and a detailed securities report are required, so the
              question is no longer whether Megazone can tell a growth story; it is whether it can defend a durable
              margin and governance story with filing-grade evidence.
