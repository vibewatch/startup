  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Boundary
        blocks:
          - type: paragraph
            body: >-
              Megazone Cloud competes in a layered field rather than a neat one-for-one rival set. The closest direct
              peer is Bespin Global, another independent Korean multi-cloud MSP built around hyperscaler partnerships
              and managed operations. But the most financially powerful incumbents are the chaebol IT arms: Samsung SDS,
              LG CNS, and SK C&C. These companies are not pure-play MSPs, yet they compete for the same large-enterprise
              and public-sector transformation budgets while enjoying captive affiliate revenue, deeper balance sheets,
              and easier access to large reference projects. Telecom and platform adjacents also matter. KT Cloud and SK
              Telecom are building cloud and MSP capability, while global consultancies and hyperscalers' own services
              arms can enter premium accounts whenever modernization, AI, or regulated workloads become strategic. The
              practical landscape therefore spans direct independent rivals, diversified Korean incumbents, telco
              entrants, and global cloud consultancies. That matters because Megazone's differentiation must hold not
              only against another reseller or migration house, but against buyers who can choose captive SI affiliates,
              direct AWS or Microsoft help, or global systems integrators with far larger talent pools.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
