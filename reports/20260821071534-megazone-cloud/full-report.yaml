        title: The call improves with better disclosure faster than it improves with another financing headline
        blocks:
          - type: paragraph
            body: >-
              What would change the recommendation is not a generic claim of AI potential but a short list of private
              facts. If Megazone can show product-level gross margins, cohort retention, direct account ownership,
              controlled partner economics, and a clean post-Glenwood cap table, then the current premium becomes much
              easier to support and might even look conservative into an IPO window. Conversely, the recommendation
              should worsen if those same materials show that the company is still primarily a low-margin services
              engine wrapped around AWS distribution and prestige. That is why the final diligence table matters more
              than additional media coverage. Price also remains important: a lower common-equity-equivalent entry could
              compensate for residual uncertainty faster than another narrative milestone could. The public record gets
