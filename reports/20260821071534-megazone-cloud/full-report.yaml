    columns:
      - Driver or constraint
      - Direction
      - Timing
      - Implication for Megazone
      - Evidence
    rows:
      - - Government cloud-first budgets
        - Positive
        - Near and medium term
        - Improves public-sector pipeline and trust spillover into enterprise buying.
        - MOIS, OECD, and MSIT all describe active digital-government and cloud-expansion programs.
      - - AI and GPU workload growth
        - Positive
        - Near term
        - Expands managed infrastructure, model-ops, and data-modernization demand.
        - Trade.gov and Mordor both emphasize AI as a key Korean digital investment area.
      - - SME subsidy coverage up to 80%
        - Positive
        - Near term
        - Broadens the long tail of SMB migrations that need outside managed help.
        - Mordor identifies subsidized SME adoption as a material growth driver.
      - - Cybersecurity pressure
        - Positive
        - Near term
        - Pushes buyers toward managed security and compliance services.
        - Mordor global managed services highlights managed security as the fastest-growing service area.
      - - Data sovereignty and residency rules
        - Negative
        - Ongoing
        - Raises compliance cost and can slow cross-border cloud adoption.
        - Mordor Korea explicitly lists data residency as a growth restraint.
      - - Domestic MSP margin squeeze versus hyperscalers
        - Negative
        - Ongoing
        - Limits profitability even when demand is growing quickly.
        - Korea Herald says profitability is hard because MSPs depend heavily on global CSPs.
      - - Talent shortages in DevOps and FinOps
        - Negative
        - Ongoing
        - Raises labor cost and delivery risk for the service layer.
        - Mordor Korea lists acute DevOps or FinOps talent shortage as a restraint.
      - - Vendor lock-in concerns
        - Negative
        - Medium term
        - Can delay migration or encourage multi-homing and direct hyperscaler engagement.
        - Global managed-services sources cite lock-in risk as a persistent adoption brake.
    notes: >-
      The market is clearly growing, but several of the strongest demand drivers also intensify competition and compress
      margins for independent MSPs.
