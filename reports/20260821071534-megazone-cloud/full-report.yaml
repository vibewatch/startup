      - number: '4.3'
        title: Cost structure, gross-margin path, and cash generation
        blocks:
          - type: paragraph
            body: >-
              Megazone's 2025 filing is valuable because it finally lets investors see the broad shape of the income
              statement and cash-flow statement instead of only topline headlines. Cost of sales was 1.5679 trillion won
              against 1.7496 trillion won of revenue, leaving 181.7 billion won of gross profit, or roughly a 10 percent
              gross margin. That is far below high-quality enterprise SaaS economics and much more consistent with a
              business that still carries meaningful cloud resale, infrastructure, professional-services, and support
              delivery cost. Selling, general, and administrative expense was 181.5 billion won, almost identical to
              gross profit, which explains why operating profit only barely crossed into positive territory even after
              strong topline growth. The stronger operational signal is cash conversion: net cash from operating
              activities improved to 94.2 billion won from negative 16.4 billion won the year before, while cash and
              equivalents rose above 430 billion won. Even so, Megazone is not yet a proven high-margin compounder. The
              2025 profit turnaround is real, but the margin bridge still depends on mix shift toward AI, security,
              optimization, and other higher-value work rather than raw cloud volume alone.
