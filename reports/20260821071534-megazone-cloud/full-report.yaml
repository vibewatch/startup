  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Megazone Cloud operates at the intersection of two overlapping markets rather than inside one clean
              analyst box. The broader layer is the South Korean cloud computing market, which includes public, private,
              and hybrid infrastructure plus platform and software consumption. Mordor's 2026 country view places that
              market at 12.46 billion dollars in 2026 and 38.28 billion dollars by 2031, while DataCube frames the same
              market with a lower near-term base and a longer-run 9.97 percent CAGR. Inside that sits the narrower
              managed-services layer that matters most for Megazone: outsourced migration, modernization, security,
              FinOps, and ongoing multi-cloud operations. Korea Herald calls this the domestic MSP market and says it
              was worth about 7 trillion won in 2023 on its way to 12 trillion won the following year. The market
              boundary therefore should exclude pure software subscription revenue at hyperscalers when no services
              layer is attached, and it should include partner-led architecture, managed operations, security, and
              cloud-cost governance. The main substitutes are still in-house infrastructure teams, captive SI affiliates
              inside chaebol groups, and the professional-services arms of AWS, Microsoft, and Google themselves.
