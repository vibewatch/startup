      - number: '7.4'
        title: Customer, margin, and execution risk now matter more than survival risk
        blocks:
          - type: paragraph
            body: >-
              Megazone's financial posture improved materially in 2025, but the company still looks like a scaled
              services-led MSP rather than a fully software-like platform business. Filing-backed numbers show
              profitability and positive operating cash flow, yet public analysis still points to thin gross-margin
              structure, a large accumulated deficit, and limited evidence that 2025 represents a repeatable margin
              slope rather than a well-timed cleanup before listing. Customer quality is the parallel issue. Megazone
              can point to more than 8,000 customers and a few strong named proofs such as Korean Re, but public
              materials do not disclose top-account concentration, retention, wallet share, or partner-versus-direct
              revenue mix. That leaves investors trying to underwrite a large customer base from count and logos rather
              than from renewal economics. The execution agenda compounds the uncertainty: management is pushing U.S.
              expansion, AI/security productization, overseas growth, and IPO readiness at the same time. Each
              initiative is plausible on its own; together they raise the odds of managerial stretch, especially if a
              key partner reprices, a marquee customer slips, or a capital-markets window narrows.
