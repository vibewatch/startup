  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing architecture, and revenue quality
        blocks:
          - type: paragraph
            body: >-
              Megazone Cloud's public materials support a services-led revenue model with expanding software and AI
              overlays, not a clean-seat-price SaaS structure. The official site markets cloud, AI/data, and
              cybersecurity solutions, while the 2025 profitability releases disclose that cloud services remained the
              dominant stream at roughly 1.34 trillion won out of 1.7496 trillion won total revenue. BigGo's summary of
              the audited results then breaks the remainder into system construction, consulting, and maintenance plus
              product sales, which is important because it shows Megazone still monetizes a mix of recurring managed
              services, project delivery, and reseller-like activity. Public pricing remains opaque. None of the
              reviewed official surfaces publish a standard rate card or contract waterfall; instead the company
              emphasizes solution bundles, partner programs, and implementation packages such as AI-agent deployment in
              about 45 days. The underwriting implication is that revenue scale is real, but realized pricing,
              discounting, gross margin by stream, and the split between pass-through cloud spend and higher-value
              managed services still require private diligence.
