        title: Scenario analysis shows more balanced upside than the headline growth story suggests
        blocks:
          - type: paragraph
            body: >-
              The scenario table is best read as a pricing discipline tool, not as company guidance. In a bull case,
              Megazone uses IPO preparation, AI/control-plane positioning, and overseas expansion to convince investors
              that it is not just a reseller-plus-labor model. That can justify a 3.0x-3.5x revenue range, especially if
              the IPO tape rewards Korea cloud scarcity and if AIR Studio or related products prove they carry
              software-like economics. In a base case, the current private mark mostly holds because profitability,
              scale, and productization offset public-market skepticism, but upside from today's level remains limited.
              In a bear case, public investors view Megazone mainly through a services-comparison lens, partner
              dependence remains high, or disclosure reveals weaker cohort quality than the customer-count headline
              suggests; then the multiple can compress materially toward 1.4x-1.8x revenue. The important point is that
