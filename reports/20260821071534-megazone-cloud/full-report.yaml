      - number: '1.3'
        title: Capital Structure, Profitability, and IPO Path
        blocks:
          - type: paragraph
            body: >-
              The most decision-relevant public facts about Megazone Cloud are concentrated in its 2024-2026 financing
              and profitability story. Seoul Economic Daily reports 2024 revenue of 1.7496 trillion won, up 27.9 percent
              year over year, with 230 million won of operating profit and 8.2 billion won of net profit. That matters
              because profitability had previously been the main gating issue for a listing, and the same paper later
              tied the return to profit directly to a faster IPO timetable. In June 2026, Glenwood Credit agreed to
              invest 800 billion won into Megazone, with the funds used to repurchase MBK Partners Special Situations
              and IMM Private Equity stakes in Megazone Cloud through structured financing that included exchangeable
              bonds. The deal reportedly implied enterprise value above 4 trillion won and was explicitly framed as a
              way to remove post-IPO overhang risk by cleaning up the shareholder base. Public sources diverge on older
              funding history. The 2024 underwriter release describes a 2022 Series C investment of 326 million dollars
              at a 1.74 billion dollar valuation, while GetLatka reports a 343 million dollar Series C at a 1.8 billion
              dollar valuation and 510 million dollars of lifetime funding. Those numbers are directionally aligned on
              unicorn status but not precise enough to treat as audited cap-table facts. Current underwriting should
              therefore rely on the 2026 profitability and Glenwood recap data first, while treating lifetime funding
              totals and exact historical ownership splits as items to verify in the data room.
