      - number: '2.2'
        title: Sizing Lenses and Adoption Economics
        blocks:
          - type: paragraph
            body: >-
              Public sizing sources agree on direction but not precision, so later chapters should use a lens-based
              approach rather than one headline TAM. Mordor's Korea report is the best structured operating lens for the
              broad cloud market: public cloud led deployment share in 2025, hybrid cloud is projected to grow fastest,
              large enterprises represent about 71 percent of revenue, BFSI is the largest current end-user sector, and
              healthcare is the fastest-growing vertical. For the adjacent regional context, Mordor's global
              managed-services report and the Asia-Pacific managed-services forecast both show APAC as the
              fastest-growing region, with enterprise outsourcing demand driven by cloud complexity, cybersecurity, and
              cost governance. Statista's Korea public-cloud-software page provides an additional anchor by confirming
              that the public-cloud-software market should more than double from 2015 levels by 2026, though its exact
              figure is paywalled. The implication is that Megazone does not need total market leadership across all
              cloud spend to grow into a multi-billion-dollar services platform; it needs to hold a strong share of the
              premium managed layer sitting on top of fast-growing Korean enterprise and public-sector cloud adoption.
              What remains difficult is isolating a defensible SAM or SOM for Korean multi-cloud managed services
              because proprietary estimates mix infrastructure spend, software subscriptions, and service revenue
              differently.
