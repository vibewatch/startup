    {
      "id": "comparable-framing",
      "title": "Public comp framing suggests the current mark is fair-to-stretched rather than obviously cheap",
      "body": "The denominator discipline is simple but important. Megazone is private, so the >KRW 4 trillion figure is a private transaction mark, not a continuously traded enterprise value, and public investors still do not know the detailed recap structure. Even so, rough comparisons are useful. Using the 2025 revenue base of KRW 1.7496 trillion, a KRW 4.0 trillion valuation implies about 2.3x revenue. That is dramatically above distressed or slower-growth infrastructure-services comps such as Rackspace and Kyndryl, above Globant's current public multiple, and even above Accenture's much larger and more diversified consulting multiple. The public comp table therefore does not say Megazone is absurdly overpriced; it says investors are already paying for a quality and scarcity premium. That premium can be defensible if Megazone proves higher growth durability, stronger product attach, and cleaner IPO-grade disclosure than public peers offer. Without that proof, the current mark looks closer to fully priced than to overlooked.",
