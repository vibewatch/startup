  "chapter": {
    "number": 8,
    "title": "Valuation",
    "summary": "Megazone Cloud is investable as a company but not obviously cheap as a late-stage entry. Public evidence supports a real scaled business: 2025 revenue was about KRW 1.7496 trillion, profitability turned positive, customer-count claims exceed 8,000, and the company attracted a KRW 800 billion Glenwood recap while preparing for IPO. The valuation problem is that the latest >KRW 4 trillion mark already prices Megazone above public managed-services and digital-consulting peers on a revenue-multiple basis, even though public evidence still points to services-like economics, substantial AWS dependence, and limited disclosure on customer concentration, partner economics, cap-table structure, and incident history. The right posture is therefore track with medium confidence: quality is real, but upside at the current mark depends on private diligence proving that Megazone deserves a platform-style premium rather than only a premium-services multiple."
  },
  "sections": [
    {
      "id": "recommendation-summary",
      "title": "Recommendation: track, not avoid, but only with strict price and disclosure discipline",
      "body": "The cleanest conclusion from the public record is that Megazone deserves continued investor attention but not blind enthusiasm at the current mark. It is already profitable, operates at national scale, and has credible IPO preparation, which separates it from many late-stage private companies still valued mainly on story. At the same time, the latest >KRW 4 trillion valuation implies a premium to listed managed-services and consulting peers despite thinner public disclosure and meaningful dependence on partner ecosystems, especially AWS. That combination argues against an avoid call because the business is clearly real, but it also argues against a buy call because public evidence does not yet show enough margin of safety. The recommendation is therefore track with medium confidence and high risk: the business quality justifies diligence, yet the current valuation only works cleanly if private evidence proves Megazone can sustain better growth, stickier customer economics, and more platform-like margins than public peers.",
