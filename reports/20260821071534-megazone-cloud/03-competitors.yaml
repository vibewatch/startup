    {
      "id": "korean-competitor-profiles",
      "title": "Korean Competitor Profiles",
      "body": "Among Korean competitors, Samsung SDS and LG CNS are the hardest names to dismiss. Samsung SDS says IDC ranked it number one in domestic MSP share at 23.9 percent and number one among Korean cloud providers at 11.0 percent public-cloud share, while its 2024 cloud revenue reached 2.3235 trillion won. LG CNS is even larger on total revenue and has repositioned itself aggressively around AI and cloud: Sedaily says AI and cloud were approaching 60 percent of total 2024 sales, and LG CNS also claimed the Korea Google Cloud Partner of the Year award in 2026 after becoming the first Korean firm to earn both AWS and Google generative-AI distinctions. SK C&C is smaller in pure cloud disclosure but strategically important because it has moved to AWS MSP 6.0, Azure analytics specialization, and an AI Landing Zone proposition tied to the broader SK-AWS infrastructure push. GS Neotek is the more specialist rival: smaller and less capitalized, but technically credible in AWS-heavy accounts. Bespin remains the closest independent benchmark, yet its latest operating loss shows how difficult it is for standalone MSPs to maintain margin while keeping up with AI and multi-cloud investment.",
