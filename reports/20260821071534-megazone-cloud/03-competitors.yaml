    {
      "id": "moat-durability-and-threats",
      "title": "Moat Durability and Threats",
      "body": "The durability of Megazone's competitive position depends on whether it can keep widening the gap between basic MSP work and higher-value orchestration. Basic migration and resale are increasingly commoditized. Korea Herald explicitly warns that domestic MSPs face cost pressure and heavy dependence on U.S. hyperscalers, while Chosun Biz shows KT and SK Telecom hiring cloud experts and chaebol players pushing harder into the same category. That means switching costs exist, but they are not absolute. Once a customer has migrated, it can still multi-home, re-tender managed operations, or let the hyperscaler and its own platform team absorb more of the work. The strongest moat indicators are therefore not raw cloud volume but partner designations, industry references, AI and security overlays, and the ability to stay close to regulated enterprise workflows. Megazone looks strong on AWS depth and independent execution credibility, weaker on capital scale than LG CNS or Samsung SDS, and structurally exposed to disintermediation if the premium part of its services mix does not grow faster than the lower-margin resale core. The market is still growing quickly enough to support several winners, but the middle of the field is crowded and getting harder, not easier.",
      "claimRefs": [
