    {
      "id": "operational-security-and-product-transparency",
      "title": "Operational, security, and product-transparency risk is moderate, with evidence quality varying sharply by module",
      "body": "Megazone's public trust surface is real but uneven. Official pages and SpaceONE documentation show meaningful certification and governance language, and AIR Studio materials emphasize de-identification, RBAC, policy controls, and monitoring. That helps, especially for regulated Korean enterprise buyers. The risk is that public runtime transparency lags the compliance narrative. Across the materials retained for this run, there is little public evidence of product-specific uptime commitments, incident-history disclosure, postmortem cadence, or independently reported security outcomes. The documentation quality also varies materially across the stack: SpaceONE has real docs and open repositories, while several newer modules are mostly visible through marketplace cards, press releases, or partner channels. This does not prove weak execution, but it does raise residual risk that the portfolio is broadening faster than outside observers can verify operational maturity. For an IPO candidate selling mission-critical cloud and AI operations, that gap matters because a serious customer incident would be judged not only on the event itself but on how credibly the company had signaled preparedness beforehand.",
