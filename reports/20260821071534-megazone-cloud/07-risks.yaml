  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "Megazone Cloud does not look like an existentially fragile business, but its residual risk profile is unusually concentrated around dependencies that could interact badly during IPO preparation. Public evidence shows a real, profitable, scaled cloud MSP with meaningful governance and compliance positioning. The same evidence also shows that Megazone's strongest go-to-market proof, product packaging, awards, and AI launches still cluster around AWS; that profitability is recent and services-like rather than software-like; and that public disclosures remain thin on customer concentration, retention, partner economics, incident history, and post-recap ownership. The underwriting question is therefore not whether Megazone has traction, but whether it can prove durable independence, disclosure-grade controls, and higher-margin repeatability before capital-market timing or partner leverage forces the issue."
  },
  "sections": [
    {
      "id": "regulatory-disclosure-and-ipo-timing",
      "title": "Regulatory, disclosure, and IPO-timing risk is manageable but not yet fully closed",
      "body": "Megazone now looks close enough to the public markets that listing mechanics are no longer hypothetical. The company formally selected lead underwriters in 2024 and Sedaily reported in 2026 that profitability reopened the path to a KOSPI filing, while Glenwood Credit's 800 billion won investment was explicitly framed amid IPO preparations. Those are positives, but they also compress expectations around disclosure quality and governance readiness. English DART itself warns that English disclosures are voluntary and have no legal effect, which means non-Korean investors cannot rely on translated disclosure alone. Baker McKenzie's Korea listing guide adds that audited financial statements and a detailed securities report are central requirements, so any mismatch between management narrative and filing-grade evidence becomes a real underwriting risk. On top of that, Korea's AI Basic Act is now in force and the FSC continues to revise capital-markets rules, so Megazone is trying to list while cloud, AI, and market-governance obligations are still evolving. The residual issue is not that Megazone lacks advisers; it is that public sources still do not disclose the post-Glenwood cap table, instrument terms, or how much IPO timing is driven by shareholder-liquidity needs versus strategic optionality.",
