    {
      "id": "dependency-and-tech-verdict",
      "title": "Dependencies, technical risks, and product verdict",
      "body": "The technical verdict is favorable on enterprise usefulness and cautious on structural independence. Megazone's strongest differentiators are orchestration, governance, cost control, and solution packaging around real enterprise deployment problems. Those are valuable capabilities, and the product set is broader and more technically grounded than a plain reseller model would suggest. But the same evidence shows that Megazone is deeply dependent on external platforms. AIR Studio is marketed through AWS Marketplace and tied to AWS services such as Bedrock, EKS, Lambda, and OpenSearch; Amazon Quick deployment, Partner Agent Factory participation, and four AWS Ambassadors reinforce that AWS remains the core gravity well. The multicloud tools soften but do not erase that dependence. Public documentation is also uneven: SpaceONE looks mature and documentable, while several newer modules have mostly marketplace-style descriptions and little public engineering evidence. Investors should therefore underwrite Megazone as a credible enterprise cloud-and-AI control layer with strong services DNA, not as a deeply proprietary infrastructure stack. The product question is less “does it have products?” and more “which of these products can become durable, repeatable, higher-margin platforms rather than consulting wrappers around partner tech?”",
