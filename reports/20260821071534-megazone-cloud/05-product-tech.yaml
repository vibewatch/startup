    {
      "id": "trust-security-and-compliance",
      "title": "Trust, security, compliance, and quality controls",
      "body": "Megazone's public trust posture is more concrete than its performance-benchmark posture. The homepage and SpaceONE site both surface compliance language: ISO/IEC 42001 for AI management on the broader company page and ISO/IEC 27001, 27017, 27018, 27701, plus ISMS-P on SpaceONE. AIR Studio's marketplace page adds de-identification and RBAC, while AIR Studio V2 coverage adds AI usage tracking, policy-status controls, IAM/SSO integration, budget controls, and standardized asset sharing through TRUST. HALO is marketed as an integrated security framework and recent company releases tie it to partnerships with Wiz, Zscaler, and Check Point. These are all meaningful enterprise buyer signals, especially for Korean regulated industries and public-sector work. What is still missing is equally important: public incident-history disclosure, module-specific audit reports, uptime/status metrics, red-team or evaluation benchmarks, and detailed security architecture for data flows across models, MCP servers, and partner tools. The trust story is therefore credible at the certification-and-governance layer, but incomplete at the independent assurance and runtime-transparency layer.",
