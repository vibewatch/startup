companyProfile:
  summary: >-
    Megazone Cloud is a South Korean cloud managed-services and enterprise transformation company spun out in 2018 from
    the broader Megazone group. It built its core position through hyperscaler migration, managed cloud operations, and
    enterprise support work, then broadened the public product story into multicloud governance, FinOps, security, and
    AI operations with assets such as SpaceONE and AIR Studio. Public evidence now shows a company that has reached real
    scale and profitability while preparing for IPO, but whose public disclosure still looks much more like a strong
    private MSP than a fully transparent platform company.
  foundedDate: '2018-01-01'
  foundingLocation: Seoul, South Korea
  headquarters: Seoul, South Korea
  productSummary: >-
    Megazone sells cloud migration, managed cloud operations, FinOps and billing optimization, multicloud governance,
    security services, and newer AI workflow and operations products including AIR Studio, SpaceONE, HyperMig, Hyper
    Billing, Hyper Control, and related packaged offerings.
  customerFocus: >-
    Large Korean enterprises, public-sector and regulated institutions, multinational and regional customers expanding in
    Asia or the United States, and enterprise teams adopting cloud, AI, and security modernization.
  businessModel: >-
    Primarily a services-led cloud and managed-operations model monetized through migration, managed service delivery,
    optimization, support, and partner ecosystem activity, with growing ambition to capture more repeatable product and
    governance revenue above hyperscaler infrastructure.
  stage: Late-stage private / pre-IPO
  fundingStatus: >-
    Public financing history includes a 2022 Series C at roughly a $1.8 billion valuation and a 2026 Glenwood Credit
    recap of KRW 800 billion that implied a valuation above KRW 4 trillion while supporting IPO preparations.
  disclosureProfile: private-disclosed
  claimRefs:
    - CO002
    - CI009
    - CV025
