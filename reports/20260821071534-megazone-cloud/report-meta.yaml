  topStrengths:
    - Korea's leading cloud MSP position gives Megazone real scale, customer access, and strategic relevance.
    - 2025 profitability and positive cash-generation signals reduce near-term financing stress relative to many private peers.
    - The company has broadened beyond plain migration work into governance, FinOps, security, and AI operations products.
    - Strong AWS ecosystem standing and repeated partner recognition validate execution quality and market access.
    - IPO preparation and Glenwood's recap provide a plausible path to public-market liquidity and further disclosure.
  topRisks:
    - The current private mark already exceeds public services-led comparables on a revenue-multiple basis.
    - AWS concentration remains the clearest strategic dependency in the public record.
    - Public disclosure on cap-table structure, partner economics, and customer concentration remains limited.
    - Product proof is stronger than before but still uneven across newer AI and security modules.
    - Missing incident-history and SLA detail reduce confidence in IPO-grade operational maturity.
  unresolvedGaps:
    - Exact post-Glenwood cap table, security seniority, and any covenants affecting common-equity economics.
    - Customer concentration, retention, and multi-product attach across the 8,000+ customer base.
    - Revenue ownership and gross-margin sensitivity across AWS, marketplaces, and other partner channels.
    - Module-level product economics for AIR Studio, SpaceONE, and the broader Hyper / HALO portfolio.
    - Full operational-quality evidence including incident logs, SLA discipline, and referenceable regulated customers.
