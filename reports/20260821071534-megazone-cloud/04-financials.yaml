    {
      "id": "financial-verdict-and-diligence-blockers",
      "title": "Financial verdict, benchmark framing, and remaining blockers",
      "body": "The financial verdict is constructive on scale and cautious on quality. Megazone is no longer just a venture-funded cloud story: audited 2025 revenue scale, positive net income, positive operating cash flow, and net cash all point to a real business with IPO optionality. However, the current economics still look much closer to a large services-led MSP than to a pure high-margin software platform. Gross margin is modest, operating margin is barely positive, and accumulated deficit remains enormous relative to current profitability. The other blocker is data consistency. Public trackers disagree sharply on lifetime funding and even basic scale statistics such as headcount, which means investors should trust filing-grade numbers first and secondary databases second. Glenwood's recap, the IPO syndicate, and higher-value AI/security initiatives all improve the setup, but they do not eliminate the need for private disclosure on retention, pricing realization, channel rebates, related-party transactions, and post-recap capitalization. In short, Megazone's topline and balance sheet have become credible enough for serious underwriting work; its long-run valuation still hinges on whether management can prove that 2025 was the start of a real margin slope rather than a one-year cleanup before listing.",
