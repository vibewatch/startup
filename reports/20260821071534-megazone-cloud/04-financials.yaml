  "chapter": {
    "number": 4,
    "title": "Financials",
    "summary": "Megazone Cloud's public financial picture became materially better in 2025 but is still not fully underwritable. The strongest hard evidence is the 2025 parent-company disclosure and corroborating press: revenue rose to 1.7496 trillion won, operating profit moved to roughly break-even positive territory, net profit reached 8.2 billion won, operating cash flow swung positive, and cash exceeded borrowings. The harder message is that gross margin still looks services-like rather than software-like, accumulated deficit remains roughly as large as total equity, and public sources still conflict on lifetime funding, exact valuation history, and any active Series D. Glenwood's 800 billion won recap and the IPO syndicate improve capital-market positioning more clearly than they solve the core question of durable margin quality."
  },
