    {
      "id": "public-traction-and-unit-economics-proxies",
      "title": "Public traction metrics and unit-economics proxies",
      "body": "The best public traction anchors are now audited-scale revenue, customer count claims, partner-sourced credibility, and a handful of tracker snapshots rather than explicit SaaS metrics. The 2025 filing-backed numbers are the most reliable: 1.7496 trillion won of revenue, 27.9 percent growth, positive net income, and positive operating cash flow. Official company releases and the AWS award release also keep repeating that Megazone serves more than 8,000 customers with over 2,000 experts, which supports real commercial scale even if cohort quality remains undisclosed. What is still missing are the underwriting metrics investors normally want next: segment gross retention, net revenue retention, CAC, payback, ACV, partner-versus-direct mix, renewal rate, and revenue concentration by hyperscaler. Public data providers fill some narrative gaps but not cleanly. CB Insights, PitchBook, Latka, and The Company Check disagree on lifetime funding, current revenue, and headcount, so they are useful for triangulation but not for precision. The result is a company whose size is visible, but whose efficiency profile is still mostly inferred from operating outcomes and partner depth rather than disclosed KPI dashboards.",
