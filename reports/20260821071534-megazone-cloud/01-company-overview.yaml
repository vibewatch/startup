    {
      "id": "leadership-organization-and-geography",
      "title": "Leadership, Organization, and Geography",
      "body": "Megazone Cloud's public leadership picture is informative but not perfectly clean, which itself is a diligence signal. The user-provided context and older market references point to Lee Ju-wan, commonly rendered as Max Lee, as the group leader around the IPO process; MegazoneCloud's 2024 underwriter announcement indeed names CEO Max Lee. But more recent company-authored releases about U.S. expansion and AWS awards name Doug Yeum as CEO, while New York State's July 2026 U.S.-headquarters announcement quotes Bob Moore as MegazoneCloud CEO in the regional context. The most likely explanation is role fragmentation across group, global, and U.S. entities rather than a single unexplained CEO replacement, but management should clarify the exact legal-entity and reporting structure. Geography is also better read as layered than contradictory. Official and company-linked sources describe the brand as headquartered in Seoul, while ServiceNow and EMIS surface Gwacheon as the operating or registered office. Those same sources describe a widening global footprint: official pages cite nine global offices, PR releases cite operations across nine or ten countries, and New York State documents confirm a formal U.S. headquarters build-out in Monroe County with up to 122 jobs planned over five years. The right takeaway is that Megazone has genuine international operating intent, but the exact boundary between the Korean parent, the 2018 cloud subsidiary, and regional arms should be confirmed in diligence materials rather than inferred from marketing copy alone.",
