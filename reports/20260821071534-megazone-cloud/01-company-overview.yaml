    "number": 1,
    "title": "Company Overview",
    "summary": "Megazone Cloud is the 2018 cloud-services spinout of Megazone, the South Korean technology group founded in 1998, and public sources consistently place it among Korea's leading cloud MSPs. The clearest recent operating anchor is Seoul Economic Daily's report of 1.7496 trillion won of 2024 revenue and 8.2 billion won of net profit, while the clearest current capital anchor is Glenwood Credit's 800 billion won 2026 investment that reportedly implied enterprise value above 4 trillion won. The biggest remaining diligence gaps are the reconciled lifetime funding total, the exact post-Glenwood cap table, and the canonical global-versus-regional leadership structure."
  },
  "sections": [
    {
      "id": "identity-origin-and-market-position",
      "title": "Identity, Origin, and Market Position",
      "body": "Megazone Cloud should be treated as a late-stage South Korean cloud and AI services platform whose legal life began in 2018 but whose commercial DNA stretches back to Megazone's 1998 founding. The strongest public identity source is the company's own English company-story page, which says Megazone became Korea's first official Google Apps partner in 2009 and first official AWS partner in 2012 before spinning the cloud business into MegazoneCloud. The same official material now frames the company as an AI-native digital-transformation partner rather than a pure migration shop, spanning cloud, AI/data, and security services under the Transform Tomorrow, Together vision. Independent and partner sources reinforce market leadership. ServiceNow describes Megazone as the first and largest AWS Premier Tier services partner in Korea, while Empire State Development calls it a premier global cloud managed services provider, a leading Google Cloud partner, and the largest premier AWS consulting partner in the Asia-Pacific region. Korea Herald's market coverage similarly treats Megazone Cloud and Bespin Global as the legacy mid-sized leaders of the Korean MSP segment. Later chapters should therefore anchor on a simple canonical description: Megazone Cloud is a Korean-origin, multi-cloud MSP and AI services provider whose core moat still comes from hyperscaler partnership depth and enterprise implementation scale.",
