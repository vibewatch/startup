  topStrengths:
    - Meter 的产品叙事在网络领域异常完整：一套技术栈、一个运营方、一种经常性服务模式。
    - 2025 年 6 月完成的 C 轮融资和可见的合作伙伴生态，说明公司已经走出只有创始人参与的原型阶段。
    - 办公室、学校、仓库和园区等场景的客户验证表明，这套模式确实解决了部署和运营中的痛点。
  topRisks:
    - 公开证据仍缺少收入、ARR、利润率、流失率计算方法和股权结构细节，当前估值因此难以找到可比基准。
    - 硬件归属、安装责任和更新义务都可能带来下行风险，而只投软件的投资人可能低估这些风险。
    - 由渠道驱动的规模化前景不错，但仍处于早期；合作伙伴经济性和补贴的可持续性尚未得到公开验证。
  unresolvedGaps:
    - 当前收入 / ARR 和毛利率仍没有公开披露。
    - 客户集中度、客户数和当前员工人数仍需公司提供数据。
    - C 轮优先股堆叠、合作伙伴出资机制和现金跑道尚未公开披露。
