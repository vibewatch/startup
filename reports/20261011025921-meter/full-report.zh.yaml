  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与同行分类
        blocks:
          - type: paragraph
            body: >-
              企业网络基础设施长期由 Cisco、Arista 和 Juniper Networks
              等传统硬件制造商主导，它们按高毛利资本支出周期销售专有交换机、路由器和防火墙。这些传统厂商经过数十年并购建立广泛产品组合，导致现代企业网络运行着割裂的操作系统和异构命令行界面。针对这种碎片化，一批风险投资支持的网络即服务（NaaS）初创公司出现，提供一站式企业连接。Meter
              位于这一转型前沿，直接竞争对手包括 Nile、Join Digital 和 Ramen Networks 等风险投资支持的 NaaS 同行。Join Digital 和 Ramen
              等专注型初创公司主要服务商业地产和多租户商业空间；由前 Cisco 高管创办的 Nile
              则面向中型企业和企业园区部署，并以传感器驱动运营。传统托管服务商（MSP）和增值经销商（VAR）是以服务为中心的替代方案，把第三方硬件与经常性维护合同打包；内部 IT
              组织则代表自行拼装多供应商硬件架构的现状替代方案。
