      - number: '1.2'
        title: 创始人、技术领导层与治理结构
        blocks:
          - type: paragraph
            body: >-
              Meter 的战略和运营轨迹由联合创始人兼 CEO Anil Varanasi、CTO Sunil Varanasi 主导。创办 Meter 前，两兄弟在就读 George Mason University
              期间创办并经营一家商用网络安装企业，在出售退出前将公司扩展至 50 名员工、服务超过 100 家企业客户。2014 年完成该交易后，两人迁居中国深圳，长期住在硬件制造工厂附近并在其中工作，深入掌握机械工程、PCB
              制造和电子供应链。这样的技术背景直接塑造了 Meter 当前的运营理念：反对硬件商品化，认为硬件与软件紧密协同开发能带来更高可靠性和更好的单位经济学。

              Meter
              的运营集中在旧金山主要设施，该设施同时容纳公司行政办公室、运营中的配送中心和专门的质量工程（QE）实验室。这种共址模式让产品工程和硬件可靠性团队能在全球部署前，直接在生产级测试台上验证新固件和硬件平台。治理和战略监督由重要机构投资者主导，包括
              General Catalyst，以及早期风险投资伙伴 Sequoia Capital 和 Sam Altman、John and Patrick Collison、Lachy Groom、Reid
              Hoffman 等基础设施领域资深天使投资人。正式董事会投票权、委员会结构和详细股权期权池仍属于严格保密的公司记录。
