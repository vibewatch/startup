      - number: '3.3'
        title: 商业打包、消除 CapEx 与切换成本
        blocks:
          - type: paragraph
            body: >-
              Meter 通过彻底取消前期资本支出，提供按每平方英尺或容量单位固定费率计价的一站式运营公用事业，挑战传统网络采购模式。传统网络供应商通常把硬件按远高于制造成本的价格出售，再强制收取 Cisco DNA 或
              SmartNet 等经常性软件维护订阅。按照 Meter 的商业协议，公司保留资产所有权、承担部署安装人工、回购现有客户硬件，并保证持续更新硬件而不收取资本费用。该模式给企业 CFO
              和私募股权出资方带来可预测现金流及资产负债表减负，但也制造了明显结构性切换成本。由于 Meter NOS 和专有硬件平台是相互依赖的系统，客户无法拆出单个组件，也难以把第三方设备整合进 Meter
              的管理平面；一旦物理布线和交换基础设施部署到企业场所，运营锁定便会形成。
