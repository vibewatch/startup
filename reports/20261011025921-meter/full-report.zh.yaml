      - number: '1.4'
        title: 里程碑、渠道扩张与产品演进
        blocks:
          - type: paragraph
            body: >-
              Meter 的公司演进体现为从基础硬件设计走向自主网络编排的多年推进。2014 至 2022 年间，公司近乎隐身运营，在旧金山和亚洲制造中心研发定制芯片相邻的电路板架构、设计功耗优化机箱，并开发专有
              Network Operating System。进入更广泛的商业市场后，公司迅速扩展产品组合，加入企业蜂窝连接（Meter Cellular）、多千兆交换和高密度 Wi-Fi 7
              无线接入点，为传统多供应商网络环境提供整合式替代方案。

              Meter Command 的发布是重要技术里程碑。该自然语言管理界面由 MIT CSAIL 的系统研究人员开发，可让网络管理员和非技术 IT
              人员通过对话提示查询网络健康状况、生成动态运营仪表盘并执行配置变更，而无需依赖传统命令行界面（CLI）脚本。结合 2026 年 $100 million 的渠道伙伴计划，Meter
              将其定位为自主、自愈的网络公用事业，而不只是设备租赁服务：平台能够自动修复故障，并实现多地点无缝扩展。
