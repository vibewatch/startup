      - number: '2.2'
        title: 市场规模测算视角：TAM、SAM 与可服务细分市场
        blocks:
          - type: paragraph
            body: >-
              评估 Network-as-a-Service 的商业规模，需要采用不同分析视角，而不是给出单一总估值，因为电信运营商连接、SD-WAN 虚拟化叠加层和一站式现场基础设施的定义差异很大。企业 VAR Data
              Center Warehouse 引用的渠道及行业研究预计，全球 NaaS 市场机会将从 2024 年的 $15B 增至 2032 年的
              $137B，扩大九倍，驱动力是企业转向经常性运营费用模式。在更广泛的总可寻址市场（TAM）中，可服务可寻址市场（SAM）聚焦北美及部分国际地区的企业本地接入、结构化布线、路由、交换和室内蜂窝基础设施，目标客户希望摆脱多年的硬件折旧周期。Meter
              的可服务可获得市场（SOM）进一步限定在商业实体设施，包括企业办公室、教育园区、工业制造设施、物流仓库和生命科学实验室，服务对象是内部 IT 团队精简或需要分布式多地点运营的组织。独立分析师强调，广义 NaaS
              汇总了纯软件虚拟网络和电信运营商传输，而捆绑资本设备的全栈现场模式会受硬件生产和供应链扩张约束，短期市场渗透率因此受限。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
