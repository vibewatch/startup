  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 将企业市场需求、全栈验证、资本密集度与估值约束串联起来，得出“继续研究”的建议。
    data:
      nodes:
        - id: node-1
          label: 企业连接需求
          detail: 企业需要升级网络，以支撑 AI 工作负载和分布式业务布局，但又希望避免前期硬件资本开支。
        - id: node-2
          label: 全栈产品验证
          detail: Meter 以 Bridgewater、Lyft 和 Reddit 等重点客户为例，证明了技术可信度以及其声称的 99.6% 留存率。
        - id: node-3
          label: 资本密集度与债务敞口
          detail: 设备持有和制造义务迫使公司持续以未来现金流为支撑加杠杆。
        - id: node-4
          label: 财务透明度不足
          detail: 公开记录中，GAAP 收入、ARR、毛利率和客户数均严格未披露。
        - id: node-5
          label: 估值门槛（$1B+）
          detail: C 轮估值高于 $1B，意味着远期倍数偏高，仅凭公开披露无法完成投资判断。
        - id: node-6
          label: 尽调建议
          detail: 维持“继续研究”立场；投资前，要求公司提供单位经济模型、债务条款和利润率结构等非公开披露。
      edges:
        - from: node-1
          to: node-2
        - from: node-2
          to: node-3
        - from: node-3
          to: node-4
        - from: node-4
          to: node-5
        - from: node-5
          to: node-6
    approximationNotes: null
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV006
      - CV008
      - CV013
      - CV014
