chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与全栈运营模式
        blocks:
          - type: paragraph
            body: >-
              Meter, Inc. 是一家总部位于美国加州旧金山的全栈企业网络即服务（NaaS）提供商。公司由 Sunil Varanasi 和 Anil Varanasi 兄弟于 2014
              年创立，目标是解决传统企业局域网（LAN）架构中的根本低效。传统企业 IT 部署需要企业分别采购硬件设备、谈判运营商连接、购买专有网络管理软件，还要在多个彼此割裂的供应商之间管理维护合同。Meter
              则把物理和逻辑网络的完整生命周期整合进单一垂直整合订阅服务，以可预测的每平方英尺月费计价，无需前期资本支出。

              公司的核心技术基础是自研硬件工程、定制固件和云端管理软件的结合。Meter 设计、制造并支持自有网络设备组合，包括 F-Series 企业防火墙、S-Series 多千兆 PoE++ 交换机、A-Series
              Wi-Fi 7 无线接入点、G-Series 蜂窝网关和 P-Series 智能配电单元（PDU）。这些设备运行统一的 Network Operating
              System（NOS），连接到集中式云仪表盘，提供实时拓扑映射、自动流量路由和配置管理。尽管 Meter
              已在科技、物流、教育和工业领域取得明显商业进展，经过审计的年度经常性收入（ARR）、净收入留存率（NRR）和毛利率等关键经营指标仍属于未披露的私有数据。
            claimRefs:
