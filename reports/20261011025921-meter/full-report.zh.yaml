  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与订阅定价机制
        blocks:
          - type: paragraph
            body: >-
              Meter 通过全整合 Network-as-a-Service（NaaS）模式交付企业网络，按设施总面积收取固定月度订阅费。费用将定制交换机、Wi-Fi 接入点、冗余防火墙、5G 蜂窝故障切换网关、云管理软件和
              24/7 网络运营打包为单一经常性运营支出。Meter
              把传统多供应商硬件采购、安装承包商费用和经常性维护许可整合为可预测月度账单，消除企业设施的前期资本支出障碍。官方列表价格按场地面积定制；在多地点园区、仓库和分支办公室中，随着部署面积增加，有效每平方英尺费率通常下降。为加速企业切换，Meter
              推出前期硬件回购计划，向新客户购买现有传统网络设备，并将评估的资产价值抵扣未来月度订阅账单。客户主服务协议还可设计为服务运营支出或资本租赁，为希望保护报告运营利润率的私募股权支持运营商提供资产负债表灵活性。
            claimRefs:
