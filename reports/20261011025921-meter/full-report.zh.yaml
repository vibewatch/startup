              IT 负责人、CIO 和设施运营负责人。不过，公开证据表明，Meter 历史客户名单仍明显偏向风险投资支持的科技初创公司和规模化公司；拥有庞大传统网络工程团队的企业组织，往往担心失去细粒度配置控制。
