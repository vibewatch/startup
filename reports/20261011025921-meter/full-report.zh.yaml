        title: 展示项
        blocks:
          - type: callout
            title: 垂直整合带来的结构性成本与体验优势
            body: Meter 自研硬件、开发统一操作系统，并自行或与认证渠道伙伴共同管理安装，因此减少多供应商加价和故障时的相互推诿。客户用统一的公用事业式服务，替代前期资本采购和折旧周期。
            calloutType: insight
