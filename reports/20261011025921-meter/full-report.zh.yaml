      - number: '4.3'
        title: 市场拓展、渠道伙伴与商业进展
        blocks:
          - type: paragraph
            body: >-
              Meter 的市场拓展结合了面向大型分布式组织的直接企业销售，以及不断扩大的托管服务商、房地产伙伴和电信联盟生态。目标企业包括总部、教育机构、制造工厂、物流枢纽和零售连锁，代表性客户有 Bridgewater
