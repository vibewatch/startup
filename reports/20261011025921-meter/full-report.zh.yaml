              Fund，通过后端批量返利、销售奖励、客户迁移补贴和市场开发资金激励系统集成商及托管服务商。公司声称其托管基础设施安装的客户账户留存率达到 99.6%。但这只是公司报告的截面指标；独立的队列净收入留存、客户
