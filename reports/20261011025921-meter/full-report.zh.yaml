          x: 3
          'y': 3.5
          notes: Disaggregated multi-vendor hardware running distinct CLIs and manual firmware upgrades
        - label: 传统 MSP / VAR
          x: 2.5
          'y': 5
          notes: Service-layer management outsourced over fragmented multi-vendor gear
        - label: 自建内部 IT
          x: 1.5
          'y': 2
          notes: Manual in-house configuration and integration of multivendor components
  - id: FI001
    title: Meter NaaS 收入到毛利转换桥
    type: waterfall
    summary: 用示意性瀑布桥展示：按签约面积计收的订阅收入，扣除硬件摊销、部署人工和运营商带宽后，如何转为净运营毛利率贡献。
    data:
      items:
        - label: 已签约 NaaS 订阅计费
          value: 100
          unit: '%'
          detail: 按已部署企业面积每月收取的经常性收入总额
          direction: base
        - label: 硬件与组件摊销
          value: -28
          unit: '%'
          detail: 自制交换机、AP 和防火墙的折旧及 BOM 摊销
          direction: decrease
        - label: 布线与 IT 机房部署
          value: -15
          unit: '%'
          detail: 前期低压安装和服务器机房搭建人工，在合同期内摊销
          direction: decrease
        - label: ISP 带宽与 WAN 线路转付
          value: -14
          unit: '%'
          detail: 支付给 Lumen 和本地电信供应商的直接连接批发成本
          direction: decrease
        - label: 现场运营与主动监控
          value: -8
          unit: '%'
          detail: 24/7 网络运营中心工程支持、固件测试和现场派工成本
          direction: decrease
        - label: 预计净毛利率贡献
          value: 35
          unit: '%'
          detail: 用于覆盖公司管理费用、研发和债务融资安排的目标贡献利润
          direction: total
    approximationNotes: 百分比是基于行业网络成本结构和 Meter 披露的交付模式构建的示意性单位经济性桥；公司实际 GAAP 毛利率属于私有且未披露信息。
    claimRefs:
      - CI001
      - CI002
      - CI005
      - CI007
      - CI011
      - CI014
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 展示从物理硬件、统一 NOS、云控制平面到用户应用的垂直整合产品与运营技术栈。
    data:
      layers:
        - label: 应用与界面层
          detail: 面向用户的管理应用，支持自然语言网络查询和多地点可观测性。
          modules:
            - Meter Command（自然语言 AI 界面）
            - Meter Dashboard 与动态画布构建器
            - 多地点拓扑与运行状况监控
        - label: 云控制与数字孪生平面
          detail: 集中式云编排引擎，管理配置状态、固件发布和部署前模拟。
          modules:
            - 数字孪生网络模拟器
            - 自动配置生成器
            - 实时遥测与运行状况告警
        - label: 网络服务与安全层
          detail: 部署在客户环境中的集成式网络边界安全与传输服务。
          modules:
            - 有状态防火墙与流量检查
            - DNS 安全与内容过滤
            - 站点到站点 VPN 与 SD-WAN 路由
        - label: 统一操作系统（Meter NOS）
          detail: 贯穿全部专有物理硬件设备运行的单一内部代码库与固件镜像。
          modules:
            - 内核与硬件抽象层
            - 二层交换与原生 VLAN 引擎
            - 三层跨 VLAN 路由与故障切换
        - label: 专有硬件机群
          detail: 内部设计并制造的企业级网络设备。
          modules:
            - Meter 接入点（Wi-Fi 6/6E/7，自动调优）
            - Meter 交换机平台（高密度千兆与 10G/50G 端口）
            - Meter F1 安全设备（配备用 LTE 天线）
            - Meter 配电单元（PDU）
        - label: 物理连接与 ISP 基础设施
          detail: 汇聚广域连接、蜂窝卸载和商业布线基础设施。
          modules:
            - Meter Connect（ISP 聚合与报价）
            - Meter Cellular（CBRS 中立主机专用无线网络）
            - 结构化布线与服务器机房机架搭建
    approximationNotes: null
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE007
      - CE008
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 覆盖采购、站点架构、硬件安装、共同管理运营和多地点扩张的端到端客户生命周期。
    approximationNotes: 根据公司和合作伙伴文档，展示 Meter NaaS 合同的标准企业采用周期。
    claimRefs:
      - CU005
      - CU013
    data:
      items:
        - label: 1. ISP 采购与现场勘察
          touchpoints:
            - 向 Meter Connect 提交平面图和地址
            - 评估带宽并与本地运营商谈判
        - label: 2. 架构与数字孪生设计
          touchpoints:
            - 定制无线与有线布局设计
            - 通过数字孪生模拟预配置硬件
        - label: 3. 专业交钥匙安装
          touchpoints:
            - 低压布线、机架、交换机、AP 和 UPS
            - 当日切换，并回购、回收旧硬件
        - label: 4. 统一云激活
          touchpoints:
            - 激活 Meter NOS、SD-WAN、DNS 安全和 VPN
            - 移交 Meter Dashboard 和 Command 界面
        - label: 5. 共同管理的 24/7 运营
          touchpoints:
            - 主动监测链路健康状况和 LTE 备用故障切换
            - 自动执行非工作时间固件更新并持续支持
        - label: 6. 多地点扩张与硬件更新
          touchpoints:
            - 铺开到分散的零售店、仓库或学校站点
            - 免费硬件升级和标准化每平方英尺计费
