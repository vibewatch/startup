              $500 加价到终端销售 $5,000 的供应商层层加价，让 Meter 能把资金投入高规格硬件，同时控制设备固件和交付时间。但该模式也吸收大量初始资本：Meter
              在多年合同期内收取经常性订阅收入之前，就要先承担实体制造、低压布线和 IT 服务器机柜建设人工成本。硬件更新、固件增强和自动排障更新都包含在订阅中，不另收升级费。由于 Meter
