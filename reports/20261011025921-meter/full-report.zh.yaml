  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类架构与范围
        blocks:
          - type: paragraph
            body: >-
              企业网络正从割裂的多供应商硬件部署，转向整合式
              Network-as-a-Service（NaaS）订阅框架。传统上，企业网络支出分散在不同供应商层级：原始设备制造商（OEM）提供接入点、核心交换机和安全设备，此外还有零散的支持合同、增值经销商（VAR）集成服务和独立互联网服务商（ISP）电信连接。Meter
              则将核心市场边界定义为一站式本地企业连接，把专有交换硬件、无线接入点、软件定义网络操作系统（NOS）、低压布线、自动数字孪生配置以及持续 24/7 SLA
              运营整合进按平方英尺计价的订阅服务。其当前边界不包括公有云超大规模厂商的网络架构、电信运营商骨干网、消费宽带和独立的身份即服务层。传统企业网络供应商长期通过大规模并购整合产品，导致现代企业网络运行着割裂的固件和分离的管理仪表盘；硬件
              BOM 估计为 $500 的组件，经过多层分销后可按约 $5,000 卖给终端客户。现有模式高度依赖手工配置和外部系统集成商，网络性能下降时还会产生结构性的运营摩擦和多供应商推诿。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
