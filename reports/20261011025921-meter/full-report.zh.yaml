      - number: '7.2'
        title: 监管、频谱与法律敞口
        blocks:
          - type: paragraph
            body: >-
              部署实体企业网络基础设施，使 Meter 同时受到联邦电信标准、射频合规要求和地方建筑规范等多重监管。 在美国，Meter 的专有 Wi-Fi 接入点、交换机和安全设备需要取得严格的 Federal
              Communications Commission (FCC) Part 15 设备授权， 确保有意和无意射频辐射器都在允许的发射范围内运行。现场安装还涉及低压布线、电源分配单元部署和服务器机房建设， 必须遵守
              National Electrical Code (NEC)、地方消防安全规定及认证承包商要求。对于 Meter Cellular，Meter 通过标准 Cat 6 布线转发主要运营商的室内蜂窝信号，
              不采用传统分布式天线系统。虽然运营效率高，但这种架构要求持续遵守 AT&T、T-Mobile 和 Verizon 的商用频谱集成协议。 数据安全上，Meter
              从数百个客户网络采集大量遥测数据训练自主模型，因此必须设置严格隔离边界、仅检查元数据的分组检查机制， 并采取健全的客户数据保护控制，以避免 CCPA 和 GDPR 下的窃听或隐私责任。
            claimRefs:
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
      - number: '7.3'
        title: 运营与伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              Meter 的运营韧性与外部供应商、合同制造商、上游电信服务商和战略技术伙伴密不可分。首先，Meter 在内部设计网络硬件，
              但依赖台湾和深圳的专业合同制造商及海外供应链进行零部件制造和电路板组装。台海地缘政治摩擦、 海运中断或关键半导体短缺都可能严重限制硬件供应，造成已承诺企业部署的交付瓶颈。其次，尽管 Meter
              是对客户负单一责任的网络供应商， 其底层物理回传仍根本依赖本地商业互联网服务商。Meter 防火墙可通过自动多 WAN 故障切换和集成备用 LTE 天线缓解线路中断， 但大范围 ISP 传输故障仍超出 Meter
              的直接运营控制。第三，Meter 的长期产品愿景高度依赖使用 Microsoft 提供的数万张 H100 GPU 训练的基础模型， 以实现自主、自愈网络。算力联盟若重组，或 GPU 基础设施价格上涨，都可能阻碍
              Meter 的 AI 开发路线图。 最后，随着 Meter 通过渠道伙伴和 Unified Technologies 等托管服务商扩大市场覆盖，安装质量控制将取决于第三方技术人员的执行纪律。
