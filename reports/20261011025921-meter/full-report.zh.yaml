      - number: '1.3'
        title: 资本结构、债务融资机制与企业规模
        blocks:
          - type: paragraph
            body: >-
              自成立以来，Meter 已累计募集约 $315 million 风险资本股权融资。2025 年 6 月，公司完成由 General Catalyst 领投的 $170 million Series
              C，投后估值突破 $1 billion。该轮融资用于加速国际部署、扩大台湾的自动化硬件制造流程，并支持 AI 工作负载和数据密集型设施带来的企业需求增长。为补充股权资本，Meter
              使用债务融资工具，为在客户场所制造和安装企业网络硬件所需的前期资本提供资金。由于学校、仓库和数据中心的企业建设周期具有可预测的多年生命周期，Meter 以未来 12 至 24
              个月的合同折现现金流为设备部署提供融资。

              Meter 的企业部署覆盖美国、加拿大和欧洲的多地点环境。客户名单包括 Bridgewater Associates、Lyft 和 Reddit
              等头部科技及金融机构，也包括分布式零售连锁和制造工厂。商业分销高度依赖经过认证的渠道伙伴，包括 Byteworks、Unified Technologies 等托管服务商（MSP）和增值经销商（VAR）。2026
              年 5 月，Meter 承诺投入 $100 million 成立 Partner Growth Fund，用于提供后端返利、迁移补贴和销售激励，推动渠道伙伴把企业客户从传统硬件更新转向 Meter
              的托管公用事业模式。
            claimRefs:
              - CO004
              - CO005
