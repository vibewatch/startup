  foundingLocation: San Francisco, California, United States
  headquarters: San Francisco, California, United States
  productSummary: >-
    Meter provides enterprise internet, Wi-Fi, cellular, LAN/WAN networking, and lifecycle support through a single
    managed platform. It designs networking hardware, runs its own operating and management stack, installs networks,
    procures connectivity, and layers AI-assisted operations through Meter Command.
  customerFocus: >-
    U.S.-first organizations operating offices, warehouses, campuses, schools, and data centers, especially buyers that
    want to outsource networking complexity to a predictable managed service.
  businessModel: >-
    Recurring network-as-a-service subscription with no upfront hardware or installation charge to the customer; Meter
    carries hardware ownership, deployment, and refresh responsibility inside the contract.
  stage: Series C
  fundingStatus: >-
    Raised a $170 million Series C led by General Catalyst on 2025-06-12. Reviewed third-party market trackers place the
    post-money valuation at about $1 billion and total disclosed funding at about $315 million.
