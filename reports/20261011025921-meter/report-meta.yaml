  topStrengths:
    - 'Meter''s product story is unusually coherent for networking: one stack, one operator, one recurring service model.'
    - >-
      The June 2025 Series C and visible partner ecosystem show that the company has moved beyond a founder-only
      prototype phase.
    - >-
      Customer proof across offices, schools, warehouses, and campuses suggests the model solves a real deployment and
      operations pain point.
  topRisks:
    - >-
      Public evidence still lacks revenue, ARR, margin, churn methodology, and cap-table detail, making the current
      valuation difficult to benchmark.
    - >-
      Hardware ownership, installation responsibility, and refresh obligations create downside pathways that
      software-only investors may underappreciate.
    - >-
      Channel-led scale is promising but still young; partner economics and subsidy durability are not yet publicly
      proven.
  unresolvedGaps:
    - Current revenue / ARR and gross-margin disclosure remain unavailable in the public record.
    - Customer concentration, total customer count, and current headcount still require company-provided data.
    - Series C preference stack, partner-fund mechanics, and cash runway are not publicly disclosed.
