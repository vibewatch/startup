evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited financial statements detailing Meter's GAAP revenue, annual recurring revenue (ARR), gross margin
      percentages across hardware/software cohorts, and cash flow.
    whyItMatters: >-
      Without audited revenue and margin disclosures, valuation multiples and long-term unit economics cannot be
      underwritten independently.
    diligencePath: >-
      Request confidential disclosure from Meter management covering trailing twelve-month revenue, gross margins across
      hardware/software cohorts, and subscription churn.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: customer-and-contract-metrics
    missingEvidence: >-
      Total verified customer account count, contracted square footage under management, and customer revenue
      concentration.
    whyItMatters: >-
      Customer concentration determines whether Meter's revenue is heavily tied to a few marquee enterprise logos or
      widely diversified.
    diligencePath: >-
      Obtain an anonymized customer cohort analysis showing active square footage, deployment renewal rates, and top-ten
      customer revenue contribution.
    relatedTableRefs:
      - TO001
      - TO002
  - type: missing-source
    severity: minor
    topic: governance-and-capital-structure
    missingEvidence: >-
      Formal board of directors composition, voting share distribution between founders and Series C investors, and
      exact debt facility terms.
    whyItMatters: Understanding board control and debt covenant structures illuminates downside protections and expansion runway.
    diligencePath: >-
      Review certificate of incorporation filings and venture debt loan agreements to determine liquidation preferences
      and debt covenants.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: arr-and-retention
    missingEvidence: >-
      Audited financial breakdown of Meter's annual recurring revenue (ARR), gross margins across hardware vs service
      layers, and net revenue retention (NRR) rates.
    whyItMatters: >-
      Public sizing estimates rely on broader industry research and partner commentary; underwriting Meter's true market
      penetration requires verified revenue scale.
    diligencePath: >-
      Review confidential management presentation or Series C investor disclosure deck during formal investment
      diligence.
    relatedQuestionRefs:
      - QM008
  - type: conflicting-data
    severity: material
    topic: incumbent-unit-economics
    missingEvidence: >-
      Publicly verifiable gross margin and hardware buyback economics disclosure comparing Meter's utility depreciation
      against incumbent vendor subscription gross margins.
    whyItMatters: >-
      Without audited data on hardware amortisation and lifecycle refurbishment costs, it is difficult to determine
      whether incumbent vendors can replicate zero-capex NaaS without severely eroding gross margins.
    diligencePath: >-
      Request company financial data detailing hardware buyback costs, equipment salvage values, and contract gross
      margin profiles across cohort vintages.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: revenue-and-arr
    missingEvidence: Audited GAAP revenue, annual recurring revenue (ARR), and net revenue retention (NRR) schedules.
    whyItMatters: Public records provide no verified revenue run rate or growth velocity to validate the $1B+ Series C valuation.
    diligencePath: Request audited income statements and cohort revenue waterfall under non-disclosure agreement.
    relatedQuestionRefs:
      - QI006
      - QI009
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-cogs
    missingEvidence: >-
      Blended and component gross margin breakdown separating hardware manufacturing BOM, field installation, ISP
      circuit passthrough, and cloud software.
    whyItMatters: >-
      Meter takes on hardware depreciation, upgrade, and installation costs; without gross margin data, unit
      profitability cannot be underwritten.
    diligencePath: Request management unit-economics model and contribution margin by customer cohort.
    relatedQuestionRefs:
      - QI004
      - QI009
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-runway-and-debt
    missingEvidence: >-
      Outstanding debt obligations, credit facility covenants, equipment lease financing terms, and net monthly cash
      burn.
    whyItMatters: >-
      Heavy reliance on debt to scale hardware deployment creates debt service obligations ahead of 12-to-24-month
      discounted cash flow realization.
    diligencePath: Review debt agreements, covenant compliance certificates, and 24-month pro-forma cash runway.
    relatedQuestionRefs:
      - QI007
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: security-certifications
    missingEvidence: >-
      Independent third-party penetration test reports, SOC 2 Type II audit attestations, and ISO 27001 certifications
      verifying Meter's proprietary hardware and cloud control plane.
    whyItMatters: >-
      Enterprise security teams in regulated environments require third-party compliance proof before deploying
      proprietary network infrastructure spanning Layer 2 switching, routing, and DNS security.
    diligencePath: >-
      Request confidential SOC 2 Type II reports, hardware penetration test summaries, and firmware security
      vulnerability management records from Meter during technical diligence.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: hardware-supply-chain
