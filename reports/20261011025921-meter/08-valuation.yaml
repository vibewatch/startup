callouts:
  - calloutType: recommendation
    title: 'Diligence Recommendation: Research-More'
    body: >-
      Meter demonstrates remarkable product execution and customer loyalty in enterprise networking, but the reported
      $1B+ post-money valuation mark requires verified ARR, gross margin, and debt covenant disclosures that are
      currently absent from public records. Capital allocators should maintain price discipline and avoid committing
      capital until private diligence validates that subscription cash flows can outpace hardware depreciation.
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV013
  - calloutType: risk
    title: 'Key Risk: Balance Sheet Capital Intensity and Debt Overhead'
    body: >-
      Delivering hardware as a service shifts the capital expenditure burden from customer balance sheets directly onto
      Meter. Relying on debt facilities to fund hardware buildout against 12-to-24-month forward cash flows creates
      structural sensitivity to macroeconomic shifts, customer churn, and equipment replacement cycles.
    claimRefs:
      - CV004
      - CV006
      - CV014
