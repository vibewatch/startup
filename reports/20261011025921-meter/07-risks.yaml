callouts:
  - calloutType: "risk"
    title: "Hardware Capital Intensity and Working Capital Lockup"
    body: "Meter's core value proposition—providing custom enterprise networking hardware with no upfront capital expenditure under a predictable subscription—shifts the entire working capital burden onto Meter's balance sheet. Rapid customer expansion accelerates upfront manufacturing cash requirements before multi-year subscription cash flows amortize the equipment, making capital availability and debt financing critical operational dependencies."
    claimRefs:
      - "CR001"
      - "CR004"
      - "CR007"
  - calloutType: "insight"
    title: "Vertical Integration as Both a Moat and an Operational Liability"
    body: "By controlling hardware design, firmware, software orchestration, and on-site deployment, Meter eliminates the traditional finger-pointing between equipment vendors and MSP service providers during network outages. However, this same integration eliminates third-party buffer layers, concentrating full operational accountability, product liability, and supply chain exposure directly within Meter."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR014"
