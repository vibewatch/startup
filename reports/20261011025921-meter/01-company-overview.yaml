callouts:
  - calloutType: "insight"
    title: "Vertical Integration as Structural Cost and Experience Advantage"
    body: "By designing proprietary hardware, developing a unified operating system, and managing installations in-house or with certified channel partners, Meter removes multi-vendor margins and fingers-pointing during outages. Customers trade upfront capital procurement and depreciation cycles for a unified utility-style service."
    claimRefs:
      - "CO002"
      - "CO003"
      - "CO007"
  - calloutType: "risk"
    title: "Balance Sheet Capital Intensity and Private Metric Opacity"
    body: "Deploying hardware as a service without upfront customer capex creates substantial front-loaded capital intensity. While Meter utilizes debt facilities against multi-year contracts to finance hardware rollouts, public lack of ARR, gross margin, and churn data makes independent valuation underwriting challenging."
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO010"
      - "CO013"
