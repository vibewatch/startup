chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Full-Stack Operating Model
        blocks:
          - type: paragraph
            body: >-
              Meter, Inc. operates as a full-stack enterprise networking-as-a-service (NaaS) provider headquartered in
              San Francisco, California. Founded in 2014 by brothers Sunil Varanasi and Anil Varanasi, the company was
              established to address fundamental inefficiencies in legacy enterprise local area network (LAN)
              architectures. Traditional enterprise IT deployments require businesses to procure disparate hardware
              appliances, negotiate carrier connections, license proprietary network management software, and manage
              maintenance contracts across multiple disconnected vendors. In contrast, Meter consolidates the entire
              physical and logical networking lifecycle into a single, vertically integrated subscription offering
              billed on a predictable monthly per-square-foot basis without requiring upfront capital expenditure.

              The company's core technological foundation rests on proprietary hardware engineering combined with custom
              firmware and cloud-based management software. Meter designs, manufactures, and supports its own portfolio
              of networking appliances, encompassing F-Series enterprise firewalls, S-Series multi-gigabit PoE++
              switches, A-Series Wi-Fi 7 wireless access points, G-Series cellular gateways, and P-Series intelligent
              power distribution units (PDUs). These devices run a unified Network Operating System (NOS) and report to
              a centralized cloud dashboard that provides real-time topology mapping, automated traffic routing, and
              configuration management. While Meter has gained notable commercial traction across technology, logistics,
              education, and industrial sectors, key corporate operating metrics including audited annual recurring
              revenue (ARR), net revenue retention (NRR), and gross profit margins remain undisclosed private data.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO012
              - CO013
