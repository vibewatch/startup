      - number: '8.2'
        title: Core Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for Meter rests on the structural efficiency of delivering full-stack
              networking as a service. Traditional enterprise IT procurement forces customers to navigate a fragmented
              patchwork of legacy vendors, dealing with separate hardware purchases, complex low-voltage installations,
              disjointed software licenses, and finger-pointing during unexpected outages. Meter replaces this
              frictional model with a cohesive subscription where customers incur zero upfront capital expenditures and
              receive end-to-end hardware, software, and 24/7 operational servicing under a predictable fee. This
              proposition is reinforced by claimed 99.6% customer retention and expanding channel momentum through a
              $100 million partner growth fund. Conversely, the anti-thesis emphasizes that delivering hardware as a
              service transfers immense capital intensity and replacement risk directly onto Meter's balance sheet.
              Furthermore, custom hardware development incurs high recurring R&D expenses that require massive
              commercial scale to compete sustainably against entrenched incumbents like Cisco Meraki.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV007
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
