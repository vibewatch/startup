            body: >-
              Meter's go-to-market motion combines direct enterprise sales targeting large distributed organizations
              with an expanding ecosystem of managed service providers, real estate partners, and telecommunications
              alliances. Target enterprise segments include corporate headquarters, educational institutions,
              manufacturing plants, logistics hubs, and retail chains, highlighted by prominent customer accounts such
              as Bridgewater Associates, Lyft, Reddit, Brex, and Tishman Speyer. To expand wide-area networking
