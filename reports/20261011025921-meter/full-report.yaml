      - number: '5.2'
        title: Unified Architecture, Operating System, and Physical Stack
        blocks:
          - type: paragraph
            body: >-
              The core technical foundation of Meter's platform is its unified, in-house developed Network Operating
              System (NOS). Rather than maintaining disparate firmware branches across different device form factors,
              Meter compiles a standardized software image deployed uniformly across all physical switching, routing,
              and access hardware. This architecture enables native device interoperability: switches automatically
              detect connected Meter access points, configure appropriate port profiles, and expose client telemetry
              directly within a centralized dashboard. Network resilience is enforced at the operating system level
              through automated radio resource optimization; when an individual access point experiences an outage or
              signal degradation, neighboring units autonomously increase transmit power to eliminate coverage
              blackouts. At the network perimeter, the Meter F1 firewall provides high-throughput inspection with 50Gbps
              uplinks and integrates automated LTE backup failover to maintain remote telemetry access even during
              primary ISP circuit disruptions.
