      - number: '4.2'
        title: Cost Structure, Gross Margin Drivers, and Hardware Amortization
        blocks:
          - type: paragraph
            body: >-
              Meter's cost structure diverges sharply from traditional networking original equipment manufacturers and
              cloud-only software providers. Rather than procuring commoditized third-party hardware or outsourcing
              installation to regional value-added resellers, Meter vertically integrates hardware design, firmware
              development, distribution, and on-site deployment. The company designs its access points, switches,
              firewalls, and gateways in-house, manufacturing hardware components and staging shipments through an
              integrated distribution center and quality engineering laboratory in San Francisco. This vertical
              ownership eliminates vendor markup layers—where traditional bill-of-materials costs of $500 frequently
              marked up to $5,000 at end-customer sale—allowing Meter to reinvest in high-specification hardware
              components while maintaining control over device firmware and delivery timelines. However, this model
              absorbs significant initial capital outlays: Meter incurs physical manufacturing costs, low-voltage
              cabling expenses, and IT server closet buildout labor upfront before collecting recurring subscription
              revenues over contracted multi-year terms. Hardware refreshes, firmware enhancements, and automated
              troubleshooting updates are bundled into the subscription without assessment of incremental upgrade fees.
              Additionally, because Meter's operational scope concentrates primarily on network access layers,
              enterprise customers frequently run third-party security appliances alongside Meter for advanced
              next-generation firewall filtering and Zero Trust Network Access.
