  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Landscape and Severity Ranking
        blocks:
          - type: paragraph
            body: >-
              Meter delivers enterprise networking through a vertically integrated architecture spanning in-house
              hardware design, firmware development, on-site physical installation, and ongoing software-driven network
              operations. By replacing fragmented multi-vendor procurement with an all-inclusive subscription, Meter
              eliminates the traditional finger-pointing that occurs between equipment manufacturers and managed service
              providers during downtime events. However, this total ownership fundamentally concentrates operational
              accountability, product liability, and execution complexity within Meter. A catastrophic failure in any
              single layer—from hardware fabrication flaws to software orchestration regressions—directly impacts client
              connectivity. Furthermore, because Meter provides hardware with zero upfront capital expenditure to
              customers under multi-year contracts, the company shoulders the entire working capital burden of
              manufacturing, inventory holding, and equipment replacement cycles. Managing this capital intensity
              requires sustained access to growth financing, exposing the business to macro capital-market liquidity
              contractions despite its recent $170 million Series C capitalization.
