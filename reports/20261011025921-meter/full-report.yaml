      - number: '1.2'
        title: Founders, Technical Leadership, and Governance Structure
        blocks:
          - type: paragraph
            body: >-
              Meter's strategic and operational trajectory is steered by its co-founders, Chief Executive Officer Anil
              Varanasi and Chief Technology Officer Sunil Varanasi. Prior to founding Meter, the brothers established
              and operated a commercial networking installation business while attending George Mason University,
              scaling the firm to 50 employees and over 100 enterprise clients before executing an acquisition exit.
              Following that transaction in 2014, the founders relocated to Shenzhen, China, spending an extended
              immersion period residing near and working within hardware manufacturing facilities to master mechanical
              engineering, PCB fabrication, and electronics supply chain dynamics. This technical background directly
              informed Meter's current operating philosophy, which rejects the commoditization of hardware and posits
              that tightly coupled hardware and software development yields superior reliability and unit economics.

              Corporate operations are centralized at Meter's primary facility in San Francisco, which uniquely combines
              corporate administrative offices, an active distribution center, and a dedicated quality engineering (QE)
              laboratory. This co-located model allows product engineering and hardware reliability teams to test new
              firmware releases and hardware platforms directly against production-grade testbeds before global
              deployment. Governance and strategic oversight are anchored by prominent institutional investors, led by
              General Catalyst, alongside early-stage venture partner Sequoia Capital and seasoned infrastructure angel
              investors including Sam Altman, John and Patrick Collison, Lachy Groom, and Reid Hoffman. Formal board
              voting rights, committee structures, and detailed equity option pools remain closely held private
              corporate records.
            claimRefs:
              - CO001
              - CO007
              - CO012
