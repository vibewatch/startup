      - number: '7.2'
        title: Regulatory, Spectrum, and Legal Exposures
        blocks:
          - type: paragraph
            body: >-
              Deploying physical enterprise network infrastructure subjects Meter to overlapping regulatory regimes
              spanning federal telecommunications standards, radio frequency compliance, and local building codes. In
              the United States, Meter's proprietary Wi-Fi access points, switches, and security appliances require
              rigorous Federal Communications Commission (FCC) Part 15 equipment authorizations to ensure intentional
              and unintentional radio frequency radiators operate within permissible emission envelopes. In addition,
              physical site installations entail low-voltage cabling runs, power distribution unit deployments, and
              server closet buildouts that must comply with National Electrical Code (NEC) rules, municipal fire safety
              regulations, and certified contractor requirements. For its Meter Cellular offering, Meter routes indoor
              cellular signals from major carriers across standard Cat 6 cabling without conventional distributed
              antenna systems. While operationally efficient, this architecture requires continuous compliance with
              commercial spectrum carrier integration agreements across AT&T, T-Mobile, and Verizon. From a data
              security standpoint, Meter ingests extensive telemetry across hundreds of customer networks to train
              autonomous models, requiring strict isolation boundaries, metadata-only packet inspection, and robust
              customer data protection controls to avoid wiretapping or privacy liabilities under CCPA and GDPR.
            claimRefs:
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
      - number: '7.3'
        title: Operational and Partner Dependencies
        blocks:
          - type: paragraph
            body: >-
              Meter's operational resilience is inextricably tied to external suppliers, contract manufacturers,
              upstream telecom providers, and strategic technology partners. First, Meter designs its networking
              hardware in-house but relies on specialized contract manufacturers and overseas supply chains in Taiwan
              and Shenzhen for component fabrication and board assembly. Geopolitical friction in the Taiwan Strait,
              maritime shipping disruptions, or critical semiconductor shortages could severely constrain hardware
              availability, causing delivery bottlenecks for committed enterprise deployments. Second, although Meter
              acts as the single accountable network provider for customers, it remains fundamentally dependent on local
              commercial internet service providers for underlying physical backhaul. While Meter firewalls mitigate
              circuit cuts through automated multi-WAN failover and integrated backup LTE antennas, widespread ISP
              transport outages remain outside Meter's direct operational control. Third, Meter's long-term product
              vision relies heavily on foundation models trained on tens of thousands of Microsoft-supplied H100 GPUs to
              achieve autonomous, self-healing networks. Any restructuring of this compute alliance or escalation in GPU
              infrastructure pricing could impede Meter's AI development roadmap. Finally, as Meter expands go-to-market
              reach through channel partners and managed service providers like Unified Technologies, installation
              quality control becomes dependent on third-party technician discipline.
            claimRefs:
              - CR003
              - CR008
              - CR009
              - CR011
              - CR012
