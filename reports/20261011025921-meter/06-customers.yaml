callouts:
  - calloutType: "risk"
    title: "Operational Dependency on Single-Vendor Infrastructure"
    body: "Adopting Meter's vertically integrated model consolidates routing, switching, wireless, DNS security, and ongoing operations under one vendor. While simplifying day-to-day administration for lean IT teams, it eliminates multi-vendor failover options and exposes clients to supplier-wide platform or firmware disruptions."
    claimRefs:
      - "CU004"
  - calloutType: "insight"
    title: "Co-Selling Channel Alignment via Partner Growth Fund"
    body: "Meter avoids competing against IT channel partners by maintaining a non-competitive co-selling posture backed by a $100 million Partner Growth Fund. Partners retain installation and service relationships through the Professional delivery tier, accelerating enterprise deployments while mitigating channel channel-conflict friction."
    claimRefs:
      - "CU007"
      - "CU009"
