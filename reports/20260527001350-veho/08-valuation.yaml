  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: audited-financials
      missingEvidence: Veho audited financial statements for FY2022, FY2023, FY2024, and FY2025
      whyItMatters: Without audited revenue, gross margin, and EBITDA data, no credible valuation multiple can be anchored; estimated revenue range ($540–810M) has ±40% uncertainty
      diligencePath: Request full financial statements and board-approved budget models through a formal data room process
      relatedQuestionRefs: [QV015, QV016, QV017, QV030]

    - type: private-evidence-only
      severity: blocking
      topic: cash-position
      missingEvidence: Current cash balance, burn rate, and 12-month runway model
      whyItMatters: Estimated 12–30 month runway makes funding urgency assessment critical; without this data, going-concern risk cannot be evaluated
      diligencePath: CFO confirmation of audited cash balance and projected burn through end-2027
      relatedQuestionRefs: [QV016, QV027]

    - type: missing-source
      severity: material
      topic: investor-marks
      missingEvidence: Current LP marks assigned by Tiger Global and SoftBank Vision Fund 2 to their Veho positions
      whyItMatters: If lead investors have already written down positions, it signals their belief that next-round value is below $1.5B; shapes negotiating dynamics and incentives in the next raise
      diligencePath: Review LP quarterly letters or press coverage of Tiger Global and SoftBank portfolio write-downs; request cap table from company
      relatedQuestionRefs: [QV010, QV024]

    - type: stale
      severity: material
      topic: stale-valuation
      missingEvidence: A contemporaneous arm's-length valuation event (new financing round, secondary transaction, or 409A appraisal)
      whyItMatters: The $1.5B mark is 4+ years old and reflects peak-2022 conditions; without a fresh mark the valuation stance cannot be improved beyond "stretched / low confidence"
      diligencePath: Monitor SEC EDGAR Form D filings quarterly; watch for announced secondary transactions
      relatedQuestionRefs: [QV005, QV006, QV019, QV022]
      relatedTableRefs: [TV004]

    - type: access-blocked
      severity: minor
      topic: convoy-failure-detail
      missingEvidence: Detailed post-mortem analysis of Convoy's failure from investment bank or analyst sources
      whyItMatters: Understanding the specific mechanics of Convoy's failure (cost structure vs. demand vs. funding) would sharpen the adverse comp analysis
      diligencePath: Search Reuters, Bloomberg, Pitchbook deep-dives on Convoy failure; may require paid access
      relatedQuestionRefs: [QV008]

    - type: missing-source
      severity: material
      topic: unit-economics
      missingEvidence: Per-parcel contribution margin and cost breakdown (driver pay per route, hub lease, sorting labor, technology overhead)
      whyItMatters: Without unit economics, the path to profitability cannot be verified and the bull scenario depends on unverifiable assumptions
      diligencePath: Request COO/CFO unit-economics model; benchmark against publicly disclosed Amazon Flex and Roadie disclosures
      relatedQuestionRefs: [QV015, QV016, QV021, QV026]

