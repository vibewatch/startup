company:
  name: Veho

chapter:
  order: 8
  number: 8
  title: Valuation
  summary: |
    Veho's last known valuation is $1.5 billion from its February 2022 Series B, now more than four years stale with no
    subsequent equity round, no IPO filing, and no public re-mark. Public logistics comparables (UPS, FedEx, GXO) trade
    at 0.4–1.0× revenue with compressed EBITDA multiples, implying Veho's growth-premium-dependent mark requires
    demonstrated revenue of $500M+ and a credible path to profitability to sustain. Operational momentum is real —
    parcel volume doubled in 2025, 70% client-base growth — but the absence of audited financials, disclosed margins,
    and current cash position makes an independent valuation assessment impossible. The recommendation is **track**
    with a **stretched** valuation stance; the stale $1.5B mark, pre-profitability state, and compressing VC market
    for non-AI companies keep conviction low until a new round or disclosed financials re-anchor the figure.

sections:
  - id: investment-thesis-antithesis
    title: Investment Thesis and Anti-Thesis
    body: |
      Veho's investment thesis rests on three pillars that could justify a sustained or increased valuation from its
      February 2022 Series B mark of $1.5 billion. First, the company operates in the US last-mile parcel delivery
      market — a $100B+ annual spend pool growing at approximately 8–10% per year as e-commerce penetration deepens.
      Second, Veho's independent-contractor (IC) driver model and proprietary dispatch technology structurally reduce
      per-parcel delivery cost compared to the unionized, asset-heavy cost structures of UPS and FedEx, creating a
      durable unit-economic advantage if network density scales to absorb fixed sortation center costs. Third, the
      company has demonstrated sustained operational momentum: parcel volume doubled in 2025 versus 2024, reaching
      7.5 million monthly parcels across 66 markets by February 2026, with 70% client-base growth and notable
      enterprise wins including Macy's, Lululemon, Sephora, and HelloFresh.

      The anti-thesis is equally credible. The $1.5 billion mark was set at peak 2022 venture market conditions by
      Tiger Global and SoftBank Vision Fund 2 — both of which subsequently marked down large portions of their
      private portfolios amid rate increases and growth-stock multiple compression. No new equity round has been
      disclosed since February 2022; four-plus years without a re-mark is unusual for a company at this stage,
      typically signaling that a market-clearing valuation would come in materially lower than the stale figure.
      January 2024 layoffs of 19% of corporate staff — explicitly framed by management as accelerating "the path
      to profitability" — confirmed Veho was not cash-flow positive at year-end 2023, more than two years post-raise.
      The CB Insights Q1 2026 State of Venture report placed the global VC deal count at its lowest since Q4 2016
      and described non-AI startups as receiving "moderate-to-flat" valuation gains at best, creating structural
      headwinds for any logistics-tech unicorn attempting a re-mark or new raise. Convoy, a logistics tech unicorn
      that raised $900 million and reached a peak valuation of $3.8 billion, ceased operations in October 2023,
      providing a cautionary adjacent precedent.
    claimRefs:
      [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV008, CV009, CV010,
       CV011, CV012, CV013]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]

  - id: valuation-context-comps
    title: Valuation Context and Public Comparables
    body: |
      Veho has no direct public comparable — it is a pre-profit, private, last-mile delivery startup. The nearest
      publicly traded proxies are asset-heavy incumbents (UPS and FedEx) and the pure-play contract logistics
      operator GXO Logistics. As of May 2026, UPS trades at approximately 1.0× trailing-twelve-month revenue
      (market cap $86.7 billion on $88.3 billion TTM revenue) and roughly 7.7× EBITDA; FedEx similarly trades
      at approximately 1.0× revenue ($95.4 billion market cap on $91.9 billion TTM revenue) and roughly 10.5×
      EBITDA on a debt-adjusted enterprise value basis. GXO Logistics, a purer contract-logistics play, trades
      at roughly 0.4× revenue ($5.5 billion market cap on $13.2 billion TTM revenue) and 8× EBITDA on market
      cap alone.

      These multiples represent mature, large-cap, largely asset-heavy operators with minimal growth. A
      high-growth challenger like Veho would warrant a meaningful premium — typically 2–5× for a startup
      growing at 50%+ annually — but requires disclosed revenue to anchor any such multiple. Veho has not
      disclosed revenue publicly. Proxy estimates based on 7.5 million monthly parcels at an estimated
      $6–9 per-parcel average yield a revenue run rate of approximately $540–810 million annualized as of
      February 2026. At a 2× price-to-sales premium to UPS/FedEx (implying 2.0× revenue for a high-growth
      last-mile carrier), Veho's estimated revenue range implies a valuation of approximately $1.1–1.6 billion
      — broadly consistent with the $1.5 billion mark from 2022, but dependent on revenue assumptions that
      are unverified. At the more conservative GXO multiple (0.4× revenue), implied value drops to
      $220–325 million. The uncertainty range is enormous.

      For private-market context, LaserShip and OnTrac merged in September 2021 to create the third-largest
      regional parcel network in the US but remain private with no disclosed valuation. CB Insights' unicorn
      write-downs tracker identifies more than 130 unicorns with confirmed down rounds or mark-downs since
      2022; logistics and supply chain was among the hardest-hit sectors. The broader VC market compression
      since peak 2021 has eroded the premium multiples on which many logistics unicorn valuations were anchored.
    claimRefs:
      [CV014, CV015, CV016, CV017, CV018, CV019, CV020, CV021, CV022, CV023, CV024]
    tableRefs: [TV004]
    figureRefs: [FV002]

  - id: scenarios-sensitivity
    title: Scenarios and Sensitivity Analysis
    body: |
      Veho's valuation path hinges on three binary outcomes: (1) does the company reach operational profitability
      before cash is exhausted, (2) does it successfully raise a new round at a preserved or increased valuation,
      and (3) is an exit event achievable — strategic acquisition, IPO, or secondary market liquidity — on terms
      favorable to investors?

      The **bull scenario** (20% probability) assumes Veho reaches EBITDA break-even by late 2026 or 2027,
      supported by continued parcel-volume growth, improving route density economics, and expansion of FlexSave
      margin-enhancing routing. In this scenario, Veho raises a Series C at $2.5–3.5 billion, positioning for
      an IPO within 24 months. Implied 2.5–4.0× forward revenue multiple on an estimated $700M–$1B revenue
      base. Investors who entered at the $1.5 billion Series B would see 1.7–2.3× returns at Series C, more
      on IPO.

      The **base scenario** (55% probability) assumes continued parcel growth but persistent pre-profitability,
      with cash management enabling survival to 2027. Veho raises a flat or modest down round at $1.0–1.5
      billion, led by existing investors (General Catalyst, Tiger Global, SoftBank) who accept dilution to
      preserve enterprise value. Returns for existing Series B holders are flat to mildly negative. A
      strategic acquisition (most likely buyer: UPS, FedEx, or an Amazon-adjacent logistics provider) at
      $1.0–1.5 billion remains possible if organic capital markets close.

      The **bear scenario** (25% probability) assumes cash runs short before revenue reaches self-sufficiency,
      forcing a distressed raise at materially below $1.5 billion (implied $400–900 million range) or a
      fire-sale strategic exit. CB Insights data showing active investor pools at 10-year lows and non-AI
      companies struggling to attract new capital makes this scenario more than a tail risk. The Convoy
      precedent — $900 million raised, $3.8 billion peak valuation, ceased operations — illustrates that
      even well-funded logistics tech unicorns are not immune to structural economics.

      Estimated current cash position is $50–150 million, inferred from the original $300 million raised
      minus three-plus years of estimated operating burn (post-layoff burn rate estimated at $60–100 million
      per year based on 48 last-mile facilities, 9 sort centers, and ~800–1,000 corporate headcount).
      Runway without a new raise is estimated at 12–30 months as of mid-2026. This creates material urgency
      around the next financing event.
    claimRefs:
      [CV025, CV026, CV027, CV028, CV029, CV030, CV031, CV032, CV033, CV034, CV035]
    tableRefs: [TV003]
    figureRefs: [FV003]

  - id: exit-diligence
    title: Exit Pathways and Final Diligence Framework
    body: |
      Three exit pathways exist for Veho and its investors. **Strategic M&A** is the most probable near-term
      path: UPS and FedEx are both executing network-rationalization strategies and have demonstrated appetite
      for last-mile technology acquisitions (UPS acquired Roadie in 2021). Veho's 66-market presence, 120,000+
      driver network, and enterprise client base (Macy's, Lululemon, Sephora) represent a ready-made
      independent last-mile capability that either carrier could absorb. A transaction in the $1.0–2.0 billion
      range is plausible; however, neither UPS nor FedEx has publicly signaled Veho-specific M&A interest.
      Amazon is a less likely buyer given its competing Delivery Service Partners (DSP) program, but cannot
      be excluded as a defensive acquirer.

      **IPO** is a medium-term pathway contingent on profitability. At current pre-profit status, a public
      offering would face significant scrutiny on unit economics; no logistics delivery startup in the US
      has successfully IPO'd in the last-mile segment at comparable scale without demonstrated EBITDA
      margins. The IPO window for non-AI logistics tech remains narrow in 2026 given the compressed exit
      market identified by CB Insights (exits at near two-year lows in Q1 2026).

      **Secondary market** activity for Veho shares is unconfirmed; no secondary transactions have been
      publicly identified. The CB Insights Q1 2026 report notes growing secondary market activity broadly
      (134 deals globally in the quarter), with liquidity increasingly important to employee and early
      investor liquidity as primary exit windows stay closed. A secondary sale at a discount to $1.5 billion
      is plausible but not publicly evidenced.

      For any investment thesis, the critical diligence items are: (1) audited financials to verify revenue
      and margins, (2) current cash position and 12-month runway model, (3) cap table with preference stack
      to understand liquidation waterfall economics, (4) driver classification legal exposure in AB5 states,
      and (5) customer concentration risk. None of these are publicly available; all require direct company
      engagement. Until they are provided, the valuation stance remains **stretched** relative to public
      comparables and the trajectory of the VC market since 2022.
    claimRefs:
      [CV036, CV037, CV038, CV039, CV040, CV041]
    tableRefs: [TV005, TV006]
    figureRefs: [FV004]

