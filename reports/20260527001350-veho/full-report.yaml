  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Structure
        blocks:
          - type: paragraph
            body: |
              Veho's revenue model is built on a per-parcel transactional fee paid by e-commerce brands and retailers
              for each delivery executed through its network. Unlike incumbent carriers (UPS, FedEx, USPS), Veho does
              not charge residential surcharges, weekend delivery premiums, or fuel surcharges on residential parcels —
              pricing is all-in per parcel. This simple, transparent pricing structure is a deliberate product and
              sales differentiator targeted at direct-to-consumer e-commerce brands that routinely absorb those
              surcharges from incumbents.

              Veho monetizes across three service lines under the same per-parcel fee framework. **Ground Plus**
              (branded as 1–3 day delivery) is the core product and primary revenue driver. **Premium Economy**
              (2–8 day, lower-cost-to-deliver) serves price-sensitive sellers and partially overlaps with FedEx Ground
              and USPS Priority Mail volume. **FlexSave**, launched in Q1 2026 as a beta product, adds an explicit
              speed-for-cost tradeoff — sellers can defer delivery speed (within a flexible window) in exchange for a
              lower per-parcel rate, giving Veho more routing flexibility and potentially higher margin delivery
              density. FlexSave signals Veho's intent to optimize network utilization by blending time-definite and
              flexible-window parcels on shared driver routes.

              Secondary revenue lines include **3PL value-added services** (inbound receiving, storage, pick-and-pack)
              operated inside its 9 regional sort centers, **Doorstep Pickup** for returns (last-mile pickup from
              consumer residences), and **enterprise logistics consulting** via RIVR (a strategic advisory and
              technology co-development partnership with Berkshire Grey robotics as of May 2025). None of these
              secondary lines have disclosed revenue contributions. The 3PL and pickup services are differentiated
              by Veho's existing network density and driver availability, allowing marginal-cost extensions with
              minimal incremental fixed-cost burden.

              Veho claims 35% fully-landed cost savings versus incumbent carriers for its target customer segment
              (premium e-commerce brands on 1–3 day residential delivery). One disclosed client data point showed a
              2% reduction in freight spend as a percentage of revenue. Both figures are company-sourced and lack
              independent audit.
