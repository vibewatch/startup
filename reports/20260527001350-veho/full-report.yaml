          - type: callout
            title: Consumer Preference Shift Toward Cost Over Speed Opens FlexSave Opportunity
            body: >-
              McKinsey data (2024) cited by Veho shows delivery speed fell from #1 to #5 consumer priority, with 95%+
              preferring free standard delivery. This shift is structurally favorable for Veho's FlexSave product
              (yield-management delivery with flexible windows) and potentially shifts Veho's competitive ground from a
              speed-premium carrier to a cost-efficient premium carrier—aligning with brand demand for free-shipping
              optionality without sacrificing consumer experience.
