        title: Exhibits
        blocks:
          - type: callout
            title: IC Reclassification Is the Existential Kill Switch
            body: >-
              Veho's entire cost model depends on treating 70,000+ drivers as independent contractors. The DOL's 2024
              final rule and a live 2026 NPRM signal escalating federal intent to tighten classification standards. If
              Veho's drivers are reclassified as employees under the FLSA or California AB5, the additional cost burden
