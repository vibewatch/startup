      - number: '5.2'
        title: MaestroAI and Route Optimization Technology
        blocks:
          - type: paragraph
            body: >
              MaestroAI™ is Veho's proprietary AI orchestration engine, described as optimizing millions of fulfillment,
              batching, and routing decisions in real time. For standard deliveries, MaestroAI selects the most
              efficient driver routes based on package density and delivery windows. For FlexSave shipments, it gains
              additional latitude: it can hold packages at distribution centers until density improves, batch co-located
              deliveries, defer entire route launches if gig-driver supply will be higher the following day, or pull
              packages forward when co-addressing yields cost savings. The system allows shippers to configure trade-off
              weights between speed, cost, and service quality; MaestroAI then optimizes parcel dispatch against those
              parameters in real time.

              Veho's Chief Product Officer Neel Madhvani—who joined in October 2025 from Chewy, Copart, and
              Staples—articulated the roadmap aspiration: future MaestroAI capabilities would allow per-checkout
              delivery option customization, enabling shoppers to accelerate or slow delivery and brands to surface
              carrier-agnostic shipping choices. Perfect Placement™ technology uses customer-uploaded geolocation photos
              to guide drivers to exact delivery spots, removing ambiguity and reducing misplaced-package claims. Veho
              integrates Google Geocoding data for address accuracy. All routing and tracking data flows through the
              AWS-hosted platform, with real-time notifications sent via SMS and app push alerts.

              Veho's technology platform is built entirely in-house, a point emphasized by VP New Initiatives Garrick
              Pohl in RIVR partnership announcements: "our technology is built entirely in-house–allowing us to move
              quickly, adapt what we learn in real time, and scale new innovations faster than traditional carriers."
              However, no patents, published academic benchmarks, or independent technical audits of MaestroAI
              performance have been located; all optimization claims derive from company sources and management
              assertions. The degree to which route optimization performance is verified independently remains an open
              diligence question.
