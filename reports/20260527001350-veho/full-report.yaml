      - number: '5.6'
        title: Product Risks, Technical Constraints, and Emerging Initiatives
        blocks:
          - type: paragraph
            body: >
              Veho's primary geographic risk is incomplete national coverage. As of May 2026, the 66-market network
              reaches 144 million Americans (approximately 42–46% of the US population), leaving major regions including
              the Pacific Northwest, Mountain West, the Deep South outside Texas, and rural areas without Veho coverage.
              Legacy carriers serve 99%+ of the US population, creating a structural disadvantage for brands with
              diverse national shipping needs that Veho cannot fully satisfy as a standalone carrier. California only
              launched in late 2025/early 2026 after nine years of operations.

              Driver app reliability is a demonstrable operational risk. Multiple independent driver reviews on Indeed
              identify camera-scanner interface bugs, route estimation errors (routes taking 2× stated time), and
              payment resolution failures. These technical issues affect driver retention and satisfaction, which in
              turn affects route coverage and delivery quality. The independent contractor classification of all
              driver-partners creates ongoing legal exposure under AB5 and similar state-level misclassification laws,
              particularly in California (where Veho expanded in 2026). Prop 22 provisions apply in California,
              requiring net earnings floors and healthcare subsidies for high-utilization drivers.

              On the innovation side, the RIVR robotics partnership announced in 2025 represents an early-stage pilot
              (Austin, TX) with a single robot over a 2-week evaluation period. The stated goal of 200 packages/day
              capacity and 10 deliveries/hour throughput are unaudited and based on a single unit under supervised
              conditions. RIVR's seed round of $22M (led by Bezos Expeditions) and Amazon Industrial Innovation Fund
              participation signal high investor interest in the concept but do not de-risk the commercial viability of
              large-scale robot deployment in US urban environments. The path from pilot to fleet-scale deployment
              remains undemonstrated.

              The FlexSave product's MaestroAI optimization claims—while technically plausible—lack independent
              benchmarking against FedEx or UPS delivery management tools, which already offer comparable
              flexible-window and customer-control features. Veho's competitive moat in route optimization is primarily
              geographic density (crowdsourced driver marketplace in specific metros), not necessarily algorithmic
              superiority over well-resourced incumbents with decades of routing data.
