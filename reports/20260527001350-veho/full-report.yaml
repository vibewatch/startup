      - number: '4.6'
        title: Market Context and Competitive Cost Position
        blocks:
          - type: paragraph
            body: |
              The US parcel delivery market provides the revenue and competitive context for assessing Veho's
              financial potential. According to ShipMatrix, the US parcel market is growing at approximately
              4% CAGR, projected to reach 26.8 billion annual parcels by 2027. Statista values the global
              last-mile delivery market at $128.5 billion in 2022, with projections to exceed $200 billion
              by 2027. Capgemini research estimates that last-mile delivery accounts for more than half of
              total shipping costs, and Statista data suggests that $41 of every $100 in supply chain spend
              goes to last-mile logistics — reinforcing the magnitude of the cost problem Veho targets.

              Coresight Research placed Veho in its "Future Leaders" quadrant in its Innovator Matrix for
              last-mile delivery, citing Veho's level of innovation, market potential, and $299.3M in
              funding. This independent third-party classification is a positive reputation signal, though
              the Coresight methodology is research-based rather than financial audit-based.

              The competitive cost position Veho claims — 35% fully-landed cost savings versus incumbents —
              is structurally plausible given the IC driver model, but is not independently verified. UPS
              and FedEx residential delivery at list rates for a 2 lb parcel runs approximately $11–14
              (including residential and fuel surcharges). Achieving 35% savings at scale requires sufficient
              route density to minimize driver dead miles, efficient sortation, and a favorable mix of
              delivery addresses — conditions that are achieved in dense urban and suburban markets but
              are challenged in rural or low-density markets where Veho does not yet operate at scale.

              The last-mile competitive landscape involves Amazon Logistics, FedEx, UPS, USPS, OnTrac,
              LaserShip, and regional carriers — all of whom have made technology and capacity investments
              to defend residential last-mile economics. The question for Veho's financial trajectory is
              whether the unit economics at current and near-term volume levels (7.5M parcels/month) are
              positive, and whether the path to profitability requires reaching a specific volume threshold
              or market density level not yet achieved.
            claimRefs:
              - CI036
