  - id: FR002
    title: Risk Transmission Map — How Veho's Top Risks Flow to Investor Outcomes
    type: dag
    layout: wide
    summary: >-
      Directed causal graph showing how IC reclassification, capital constraints, and operational failures propagate
      through Veho's business to affect revenue, margin, and valuation.
    data:
      nodes:
        - id: ic-risk
          label: IC Reclassification Risk
          detail: DOL 2024 rule + 2026 NPRM
        - id: capital-risk
          label: Capital / Runway Risk
          detail: No raise since Feb 2022; pre-profitability
        - id: driver-attrition
          label: Driver Attrition
          detail: Pay cuts; shift scarcity; Indeed adverse reviews
        - id: competitive-risk
          label: Competitive Displacement
          detail: Amazon Buy with Prime; FedEx/UPS restructuring
        - id: cost-model
          label: Cost Model Disruption
          detail: Employee reclassification adds 20–35% driver cost
        - id: revenue-risk
          label: Revenue Risk
          detail: Client churn; volume loss; market share erosion
        - id: margin-risk
          label: Margin Risk
          detail: Gross margin compression; contribution margin negative
        - id: funding-risk
          label: Down-round / No-round Risk
          detail: Delayed path to profitability erodes investor confidence
        - id: valuation-risk
          label: Valuation Impairment
          detail: Below $1.5B unicorn reference; down-round
      edges:
        - from: ic-risk
          to: cost-model
          label: Reclassification raises driver cost
        - from: driver-attrition
          to: revenue-risk
          label: Service quality degradation → client churn
        - from: competitive-risk
          to: revenue-risk
          label: Client switching to Amazon/incumbents
        - from: cost-model
          to: margin-risk
          label: Higher variable cost → margin compression
        - from: revenue-risk
          to: margin-risk
          label: Lower volume → fixed cost deleveraging
        - from: margin-risk
          to: funding-risk
          label: Profitability path delayed → funding gap
        - from: capital-risk
          to: funding-risk
          label: Runway depletion forces unfavorable raise
        - from: funding-risk
          to: valuation-risk
          label: Down-round or distress signals
    approximationNotes: Causal links are author-inferred from public evidence; edge weights and time horizons are not quantified.
    claimRefs:
      - CR001
      - CR016
      - CR019
      - CR027
      - CR031
