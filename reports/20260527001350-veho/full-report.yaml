      - number: '5.7'
        title: Exhibits
        blocks:
          - type: callout
            title: ISO 27001 Certification and AWS Architecture Provide Verifiable Trust Anchor
            body: >
              Veho's ISO/IEC 27001:2022 certification (Schellman, cert #1195292-3, July 2023) is one of few
              independently verifiable technical trust signals the company has made public. Combined with AWS multi-AZ
              hosting, AES/TLS encryption, and annual third-party pen testing, the security posture is materially
              stronger than most gig-economy logistics peers. This is a real differentiator in enterprise shipper
              procurement conversations where security questionnaires are standard.
            calloutType: strength
            claimRefs:
              - CE033
              - CE034
              - CE035
          - type: callout
            title: Geographic Coverage Gap Limits Veho to Partial-Network Status for National Brands
            body: >
              Veho's 66-market network covers 42–46% of the US population (144 million) as of May 2026. This forces
              national brands to maintain at least one incumbent carrier (FedEx, UPS, USPS) for uncovered geographies,
              limiting Veho's addressable penetration to partial-network use cases. The California launch came only in
