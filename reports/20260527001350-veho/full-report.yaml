        title: Exhibits
        blocks:
          - type: callout
            title: IC Classification Regulatory Risk Is Structural, Not Speculative
            body: >-
              Veho's cost advantage relative to UPS/FedEx depends substantially on its gig-driver model. California AB5
              (2019) and the DOL's March 2024 FLSA final rule both tighten independent contractor standards. A
              regulatory or judicial determination that Veho's 120,000+ driver-partners are employees would materially
              increase unit labor costs and could threaten the economics of the gig-carrier model. This risk is shared
              by all gig-economy last-mile carriers (OnTrac uses employed drivers in some markets) but is particularly
              acute for Veho given its scale and reliance on contractor economics.
            calloutType: risk
