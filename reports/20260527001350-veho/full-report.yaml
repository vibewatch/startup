  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >
              Veho's investment thesis rests on three pillars that could justify a sustained or increased valuation from
              its

              February 2022 Series B mark of $1.5 billion. First, the company operates in the US last-mile parcel
              delivery

              market — a $100B+ annual spend pool growing at approximately 8–10% per year as e-commerce penetration
              deepens.

              Second, Veho's independent-contractor (IC) driver model and proprietary dispatch technology structurally
              reduce

              per-parcel delivery cost compared to the unionized, asset-heavy cost structures of UPS and FedEx, creating
              a

              durable unit-economic advantage if network density scales to absorb fixed sortation center costs. Third,
              the

              company has demonstrated sustained operational momentum: parcel volume doubled in 2025 versus 2024,
              reaching

              7.5 million monthly parcels across 66 markets by February 2026, with 70% client-base growth and notable

              enterprise wins including Macy's, Lululemon, Sephora, and HelloFresh.


              The anti-thesis is equally credible. The $1.5 billion mark was set at peak 2022 venture market conditions
              by

              Tiger Global and SoftBank Vision Fund 2 — both of which subsequently marked down large portions of their

              private portfolios amid rate increases and growth-stock multiple compression. No new equity round has been

              disclosed since February 2022; four-plus years without a re-mark is unusual for a company at this stage,

              typically signaling that a market-clearing valuation would come in materially lower than the stale figure.

              January 2024 layoffs of 19% of corporate staff — explicitly framed by management as accelerating "the path

              to profitability" — confirmed Veho was not cash-flow positive at year-end 2023, more than two years
              post-raise.

              The CB Insights Q1 2026 State of Venture report placed the global VC deal count at its lowest since Q4
              2016

              and described non-AI startups as receiving "moderate-to-flat" valuation gains at best, creating structural

              headwinds for any logistics-tech unicorn attempting a re-mark or new raise. Convoy, a logistics tech
              unicorn

              that raised $900 million and reached a peak valuation of $3.8 billion, ceased operations in October 2023,

              providing a cautionary adjacent precedent.
