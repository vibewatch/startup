      - number: '8.4'
        title: Exit Pathways and Final Diligence Framework
        blocks:
          - type: paragraph
            body: |
              Three exit pathways exist for Veho and its investors. **Strategic M&A** is the most probable near-term
              path: UPS and FedEx are both executing network-rationalization strategies and have demonstrated appetite
              for last-mile technology acquisitions (UPS acquired Roadie in 2021). Veho's 66-market presence, 120,000+
              driver network, and enterprise client base (Macy's, Lululemon, Sephora) represent a ready-made
              independent last-mile capability that either carrier could absorb. A transaction in the $1.0–2.0 billion
              range is plausible; however, neither UPS nor FedEx has publicly signaled Veho-specific M&A interest.
              Amazon is a less likely buyer given its competing Delivery Service Partners (DSP) program, but cannot
              be excluded as a defensive acquirer.

              **IPO** is a medium-term pathway contingent on profitability. At current pre-profit status, a public
              offering would face significant scrutiny on unit economics; no logistics delivery startup in the US
              has successfully IPO'd in the last-mile segment at comparable scale without demonstrated EBITDA
              margins. The IPO window for non-AI logistics tech remains narrow in 2026 given the compressed exit
              market identified by CB Insights (exits at near two-year lows in Q1 2026).

              **Secondary market** activity for Veho shares is unconfirmed; no secondary transactions have been
              publicly identified. The CB Insights Q1 2026 report notes growing secondary market activity broadly
              (134 deals globally in the quarter), with liquidity increasingly important to employee and early
              investor liquidity as primary exit windows stay closed. A secondary sale at a discount to $1.5 billion
              is plausible but not publicly evidenced.

              For any investment thesis, the critical diligence items are: (1) audited financials to verify revenue
              and margins, (2) current cash position and 12-month runway model, (3) cap table with preference stack
              to understand liquidation waterfall economics, (4) driver classification legal exposure in AB5 states,
              and (5) customer concentration risk. None of these are publicly available; all require direct company
              engagement. Until they are provided, the valuation stance remains **stretched** relative to public
              comparables and the trajectory of the VC market since 2022.
            claimRefs:
