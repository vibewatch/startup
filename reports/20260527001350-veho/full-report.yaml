      - number: '2.2'
        title: 'Market Sizing: Multiple Lenses'
        blocks:
          - type: paragraph
            body: >-
              No single authoritative estimate of the US last-mile e-commerce parcel delivery market is readily
              accessible in public data; analyst estimates range widely ($60B to $200B+ for US, depending on scope and
              year) and the global figure is often conflated with the domestic figure. This section presents three
              independent sizing lenses and explicitly preserves contradictions.

              Lens 1—Top-down from ecommerce GMV: US retail e-commerce sales totaled ~$1.234 trillion in 2025, a 5.4%
              YoY increase (Digital Commerce 360 analysis of Commerce Department data). Q1 2026 re- accelerated to 9.8%
              YoY growth at $326.7 billion seasonally adjusted (Census Bureau). Excluding Amazon's own North America
              segment (~$416B annualized run rate in Q1 2026), non-Amazon US ecommerce GMV is roughly $820-900B. At
              industry-convention last-mile delivery cost rates of 8-10% of GMV, the addressable last-mile delivery
              spend from non-Amazon ecommerce alone is ~$66-90B annually. Veho's premium-brand SAM is a subset:
              mid-to-large premium/DTC brands (roughly 40-50% of non-Amazon ecommerce) implies a SAM of $26-45B.

              Lens 2—Bottom-up from parcel volumes: USPS shipped 6.8 billion packages in FY2025. Adding UPS (~5.3B
              estimated) and FedEx (~4.0B estimated) and Amazon Logistics (~7B estimated for US third-party parcels),
              total US domestic parcel volume is in the range of 23-26 billion annually. At average per-parcel revenue
              of $10-14 for premium services, this implies a total US parcel delivery market of $230-365B. Last-mile
              costs are ~40-53% of this, implying a US last-mile market of $92-193B. These estimates are sensitive to
              scope (whether Amazon self-delivery is included) and are not independently corroborated from this
              analysis's primary sources.

              Lens 3—Analyst range (contradictory): Various industry research summaries suggest the global last-mile
              delivery market at $40-100B (2024 estimates) growing to $150-450B by 2030 at CAGR of 10-15%. US-only
              figures are typically one-third to one-quarter of global, implying a US market of $13-33B in 2024
              estimates—substantially smaller than Lenses 1 and 2. This discrepancy reflects different scope definitions
              (carrier revenue vs. logistics spend) and differing exclusions. The evidence gap is material: no public
              primary-source US last-mile market size is available to this analysis.

              Veho's addressable SOM given current geography (73 markets, 47% US population) is bounded by coverage:
              roughly half of the SAM, or $13-22B. At its disclosed ~7.5M monthly parcels (~90M/year), and assuming
              $12-16 average per-parcel revenue, Veho's current run-rate revenue would be approximately
              $1.1-1.4B—implying penetration of well under 10% of even the constrained SAM. This suggests substantial
              headroom, but also that Veho remains a small-share challenger in a market dominated by incumbents.
            claimRefs:
