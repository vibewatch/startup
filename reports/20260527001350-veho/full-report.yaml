      - number: '4.3'
        title: Unit Economics Framework and Cost Drivers
        blocks:
          - type: paragraph
            body: |
              Veho's unit economics are not publicly disclosed. The company has not published cost per delivery,
              gross margin, contribution margin, or any per-shipment profitability data. Independent analysis
              must rely on structural inferences from the business model.

              The most significant cost advantage in Veho's model is its **independent contractor (IC) driver
              workforce** of 120,000+ driver-partners. IC drivers are paid per route (not per hour), receive no
              employer benefits, and bear their own vehicle and fuel costs. This model closely resembles Amazon
              Flex and DoorDash, and structurally eliminates the largest fixed cost of incumbent carriers —
              employee benefits, vehicle fleets, and pension obligations. However, it creates regulatory exposure
              in states like California (AB5 worker classification), Massachusetts, and others that have challenged
              IC misclassification in logistics.

              The hub-and-spoke infrastructure (9 regional sort centers averaging approximately 100,000 sq ft,
              plus 48 last-mile delivery facilities) represents the company's primary fixed-cost base. Lease
              costs for a 100,000 sq ft logistics hub in a major metro run approximately $8–15/sq ft NNN
              (triple-net), implying $800K–$1.5M per year per hub in base rent. Across 9 sort centers plus 48
              smaller last-mile facilities, total lease obligations likely run $15–40M annually. Sort and
              handling labor (corporate and warehouse employees, estimated ~400–600 from the total ~1,000
              headcount) is a semi-variable cost that scales with volume.

              The company's claim of 35% fully-landed cost savings vs. incumbents, if accurate, implies it
              operates at approximately 65% of the per-parcel cost of FedEx Home Delivery or UPS Ground
              residential. Published UPS/FedEx Ground residential rates for 1–2 lb parcels are approximately
              $9–14 per shipment; at a 35% discount, Veho would price at approximately $6–9 per shipment.
              Whether this pricing generates positive contribution margin depends on route density, driver
              pay per route, hub lease costs, and sortation labor — none of which are disclosed.

              Parcel volume growth (7.5M+ monthly parcels as of February 2026, doubled year-over-year)
              suggests improving route density per driver and per hub, which is the primary driver of positive
              unit economics in last-mile delivery. If volume continues to scale, fixed hub costs per parcel
              decline and driver utilization per route increases, improving margin.
