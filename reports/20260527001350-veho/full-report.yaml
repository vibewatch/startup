      - number: '7.3'
        title: Financial, Capital, and Business Model Risk
        blocks:
          - type: paragraph
            body: >-
              Veho has raised approximately $300M in total venture capital, with the most recent round closing in
              February 2022 at a $1.5B valuation. As of May 2026, this represents more than four years without a
              publicly announced equity raise — an unusually long gap for a pre-profitability venture-backed company at
              its capital intensity. The January 2024 corporate layoff of approximately 65 employees (~19% of
              corporate/exempt staff) was explicitly described by management as an "acceleration of the path to
              profitability," which directly confirms the company was not profitable through at least late 2023 despite
              revenue growing approximately 90% in 2023. As of the May 2026 run date, no public profitability
              announcement has been made.

              Veho's cost structure is fundamentally asset-light on vehicles (IC model) but asset-heavy on hub
              infrastructure: the company now operates 10 regional sort centers, with two new hubs opened in Phoenix and
              Ontario, California (collectively 150,000+ square feet). Hub build-out, lease obligations, and parcel
              sortation technology require ongoing capital expenditure, and the per-parcel revenue model creates volume
              exposure — a demand shock (e.g., an e-commerce slowdown, major client departure) would hit revenue more
              acutely than a traditional carrier with diversified revenue streams.

              A burn rate of $50–100M/year (consistent with ~1,000 corporate/operations headcount and hub
              infrastructure) implies a theoretical runway of 3–6 years from the $300M raise as of early 2022, but
              significant capital may have been consumed in 2022–2023 before the layoffs. If Veho has not yet reached
              contribution-margin positivity on a per-parcel basis, continued capital raises at or below the $1.5B
              valuation would be dilutive to existing investors and founders. An IPO remains the most likely exit path
              but requires demonstrated profitability; the delay in going public signals management does not yet have
              the financial profile to withstand public-market scrutiny.
            claimRefs:
              - CR016
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
              - CR022
