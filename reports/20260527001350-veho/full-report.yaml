      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Amazon Logistics Third-Party Opening: Critical Competitive Scenario'
            body: >-
              Amazon's $600B+ logistics network—confirmed by FedEx's own 10-K as a company expressing intent to offer
              delivery capabilities broadly to third parties—represents the highest-severity competitive scenario for
              Veho. If Amazon opens its DSP infrastructure to non-Amazon e-commerce brands, it would simultaneously
              offer lower cost (through amortized fixed infrastructure), higher coverage (100% US), and established
              consumer trust under the Amazon logistics brand. Veho's technology differentiation, CX positioning, and
              cost claims would all be materially challenged. This scenario should be weighted heavily in any valuation
              or competitive durability assessment.
            calloutType: risk
            claimRefs:
              - CP009
              - CP018
              - CP049
          - type: callout
            title: 'IC Reclassification: Structural Threat to Cost Moat'
            body: >-
              Both Veho and OnTrac derive their pricing advantage primarily from the independent-contractor labor model,
              which avoids employer payroll taxes, benefits, and labor law protections. California AB5 and DOL
              misclassification enforcement represent a systemic risk: if Veho's driver-partners are reclassified as
              employees, per-delivery labor costs would increase an estimated 20-30%, eliminating the 35% savings claim
              versus incumbents and potentially making Veho's economics indistinguishable from FedEx or UPS residential
              rates. This risk affects OnTrac similarly, but national incumbents (who are already employee-based) would
              benefit competitively from forced reclassification.
            calloutType: risk
            claimRefs:
              - CP045
              - CP046
          - type: callout
            title: OnTrac Is the Primary Substitute Risk, Not FedEx/UPS
            body: >-
              For e-commerce brands evaluating Veho, the most relevant comparison is OnTrac, not FedEx or UPS. Both
              OnTrac and Veho cover ~70% of the US population, claim 10-35% savings versus national carriers, offer
              next-day/two-day delivery with no residential surcharge, integrate with major multi-carrier software, and
              target the same premium e-commerce brand buyer. The primary differentiators are Veho's CX/CSAT claims
              (which OnTrac does not emphasize) and OnTrac's broader geographic coverage and enterprise relationships
              built through LaserShip. A buyer evaluating Veho's competitive moat should pressure-test the incremental
              CX premium Veho commands over OnTrac with references from brands that have used both carriers.
