      - number: '3.2'
        title: Competitor Profiles
        blocks:
          - type: paragraph
            body: >-
              FedEx (Federal Express Segment): As of May 31, 2025, the Federal Express segment employed approximately
              440,000 people, operated ~700 aircraft, 175,000+ motorized vehicles, and ~63,000 customer drop-off
              locations (including 15,000+ Walgreens and Dollar General stores). The segment reaches 100% of the
              continental US population for day-definite delivery, with Saturday coverage at 99% and Sunday coverage at
              approximately two-thirds of the US population. The June 1, 2024 merger of FedEx Ground into Federal
              Express created a fully integrated air-ground express network. FedEx's DRIVE program and "Network 2.0"
              consolidation seeks to improve per-parcel economics by contracting independent service providers for
              last-mile delivery in select markets—a direct response to pressure from tech-enabled regional carriers. In
              September 2024, FedEx launched fdx, a data-driven commerce platform integrating shipping data across the
              customer journey. FedEx faces margin pressure from the secular shift toward deferred residential
              deliveries (lower yield than time-definite commercial) and has acknowledged this mix shift explicitly in
              its FY2025 10-K as a driver of its efficiency program.

              UPS: The world's largest parcel delivery company by revenue, UPS operates a national ground and air
              network with 100% US coverage. UPS acquired Roadie (crowdsourced same-day delivery) in 2021, giving it a
              gig-economy capability for large items and same-day delivery across diverse verticals including
              healthcare, auto parts, and e-commerce. UPS serves the broadest range of B2B and B2C customers and
              directly competes with FedEx across all size segments. Its ground residential service applies per-package
              residential and fuel surcharges that meaningfully increase per-parcel cost for high-volume e-commerce
              shippers.

              OnTrac (LaserShip merger): The LaserShip-OnTrac merger, completed in 2021, created the US's largest
              regional carrier alternative to FedEx and UPS. LaserShip brought East Coast coverage across 23 states and
              60+ distribution centers; OnTrac contributed West Coast coverage. The merged entity launched
              transcontinental delivery on July 27, 2022, and expanded into Texas in 2023. By 2026, OnTrac reaches
              approximately 70% of the US population across 35 states and DC. OnTrac integrates with 30+ multi-carrier
              software providers and is both a USPS Workshare Partner and a SmartWay Transport Partner. Its competitive
              positioning—10-35% below national carrier pricing with next-day to two-day delivery for e-commerce—most
              closely mirrors Veho's value proposition. OnTrac's tech capabilities include SMS notifications, photo
              proof of delivery, and visual proof of delivery (VPOD), directly overlapping with Veho's CX
              differentiators.

              USPS Ground Advantage: Launched in 2023 to consolidate USPS's residential parcel services, Ground
              Advantage delivers in 2-5 business days for packages up to 70 pounds with no residential delivery
              surcharge. It offers commercial rates via Click-N-Ship, a Business Rate Card with additional discounts,
              and cubic pricing for heavy/small-item shippers. USPS's universal service obligation means it delivers to
              every US address including rural ZIP codes that OnTrac and Veho do not serve. For light e-commerce
              packages (under 1 lb.), USPS is often the lowest-cost carrier—a structural cost advantage that Veho's
              per-parcel rate cannot match.

              Amazon Logistics (DSP): Amazon's delivery network, built around its Delivery Service Partner (DSP) program
              using contracted small businesses operating Amazon-branded vans, delivers millions of Amazon Prime
              packages daily. The network is currently captive to Amazon's own shipments but Amazon has expressed intent
              (referenced in FedEx's FY2025 10-K) to offer its logistics capabilities broadly to third-party shippers.
              Amazon invested $1.9 billion in its DSP program (per About Amazon reporting) and is deploying Rivian
              electric delivery vans. If opened to third parties, Amazon Logistics would enter the premium e-commerce
              last-mile market with unmatched scale, technology, and cost position.

              Roadie (UPS subsidiary): Acquired by UPS in 2021, Roadie operates a nationwide crowdsourced driver network
              for same-day and large-item delivery. It serves multiple verticals including e-commerce, auto parts,
              pharmacy, industrial, and airline baggage recovery. Roadie's same-day capability does not directly compete
              with Veho's next-day/two-day residential model but represents UPS's hedge into gig-economy delivery and a
              potential channel for expanding into Veho's market.

              Regional Carriers (LSO, Dropoff): Lone Star Overnight (LSO) is a Texas-focused regional carrier with 30
              years of regional presence in the Texas and Southwest market, serving primarily B2B and professional
              services customers. Dropoff is a tech-enabled same-day B2B courier operating in select US metros, focused
              on healthcare, legal, and food service—an entirely different demand segment from Veho. Neither constitutes
              a meaningful competitive threat to Veho's core e-commerce last-mile franchise.
