  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Labor Classification and Independent Contractor Risk
        blocks:
          - type: paragraph
            body: >-
              Veho's entire operating model depends on treating its 70,000+ driver-partners as independent contractors,
              not employees. This is both a structural cost advantage and the company's single most consequential
              regulatory risk. As independent contractors, driver-partners supply their own vehicles, bear their own
              fuel, insurance, and vehicle maintenance costs, and have no entitlement to minimum wage, overtime,
              unemployment insurance, employer-side FICA contributions, workers' compensation (in most states), or
              benefits. Veho provides an optional Occupational Accident insurance through Arthur J. Gallagher/Lloyd's
              underwriters at $0.0185 per expected mile (deducted from pay), but this is a voluntary supplement, not a
              statutory employer obligation.

              On January 10, 2024, the U.S. Department of Labor published a final rule under the FLSA (effective March
              11, 2024) revising the six-factor economic reality test and rescinding the more contractor-friendly 2021
              IC rule. The DOL made the test more holistic and tilted toward employee status for workers who are
              economically dependent on a single hiring entity. Drivers who exclusively or predominantly work on Veho
              routes — common for high-volume drivers who pick up multiple back-to-back routes — face a plausible
              argument that they are economically dependent and therefore employees under this standard.

              More acutely, on February 26, 2026, the DOL issued a new NPRM (WHD-2026-0001, 91 FR 9932) explicitly
              titled to expand FLSA, FMLA, and MSPA coverage for gig workers, with a comment period closing April 28,
              2026. If finalized, this rule would materially increase the risk of reclassification for delivery
              platforms. California AB5 (effective January 1, 2020) already imposes the ABC test, under which Veho
              drivers almost certainly fail prong B (the work performed is outside the usual course of the hiring
              entity's business), making them presumptive employees absent a specific exemption or Prop 22 protection.
              Prop 22 (2020 ballot measure) provides a narrow safe harbor for app-based platforms, but its legal
              durability has been contested in California courts.

              Driver reviews on Indeed confirm that per-box pay was cut from approximately $2.50–$3.75 to $1.97, routes
              are often longer than estimated, and shift availability is scarce. High driver turnover and
              dissatisfaction create both a direct operational risk (service quality, on-time rates) and a second-order
              legal risk: dissatisfied contractors are more likely to file misclassification claims.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR016
              - CR023
              - CR027
              - CR033
      - number: '7.2'
        title: Regulatory, Legal, and Compliance Risk
        blocks:
          - type: paragraph
            body: >-
              Beyond IC classification, Veho faces a layered regulatory exposure across federal motor carrier law, state
              labor statutes, consumer privacy law, and potential future enforcement actions. Veho operates a commercial
              last-mile parcel delivery network using personal vehicles (not commercial trucks above the 10,001 lb FMCSA
              threshold), which means its driver-partners operate under personal vehicle exemptions from FMCSA
              hours-of-service and commercial driver's license requirements. However, as Veho expands to larger-vehicle
              routes and regional hub-to-hub transfers — evidenced by its 10 regional sort centers and 3,000+ trucks per
              month — the scope of FMCSA regulatory exposure will increase correspondingly.

              On the privacy front, Veho collects delivery addresses, property access codes, consumer biometric-adjacent
              data (photos of delivered packages and doorsteps), and consumer behavior signals. Its privacy policy
              discloses data sharing with third-party marketing partners and business partners, and allows cross-context
              behavioral advertising. California CPRA (effective 2023), Colorado CPA, Connecticut CTDPA, and similar
              state privacy laws impose opt-out rights, data minimization obligations, and potential AG enforcement. A
              breach or enforcement action involving consumer delivery address data could impose reputational and
              financial costs.

              No active material litigation against Veho has been identified through public court records searches
              (CourtListener, Justia dockets). However, the company has not published any legal register or risk factor
              disclosures (it is private), and the absence of a public filing record should not be interpreted as
              absence of litigation. BBB complaint records show documented consumer disputes about lost and misdelivered
              packages, which could aggregate into small-claims or class-action matters over time. The terms of service
              include a mandatory arbitration clause and class-action waiver, which limits aggregate litigation exposure
              but does not eliminate it.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
