      - number: '4.4'
        title: Revenue Growth and Operational Trajectory
        blocks:
          - type: paragraph
            body: |
              While Veho does not publicly disclose revenue, operational metrics provide strong proxies for
              growth. Revenue grew nearly 90% in 2023 versus 2022 according to a company statement reported
              by TechCrunch. In 2025, the company reported 70% growth in its client base and tripled new
              client launches relative to 2024. Parcel volume doubled in the 2025 holiday peak versus 2024.
              As of February 2026, Veho delivers 7.5M+ monthly parcels across 66 US markets, with its
              network covering 144 million Americans (approximately 44% of the US population).

              The driver network grew from approximately 84,000 in May 2025 to 120,000 by February 2026 —
              a 43% increase in eight months. This growth indicates rapid market expansion and reflects both
              new geography entry and deepening of existing market density. Market presence grew from roughly
              45 markets at the start of 2025 to 70 markets by April 2026, including major expansions into
              Southern California (Los Angeles metro, San Diego, Las Vegas, Scottsdale) with 100,000+ parcel
              deliveries per week in SoCal within months of launch.

              The company's named client base includes enterprise brands Macy's, Lululemon, Sephora, HelloFresh,
              Kroger, Nordstrom, Saks, Misfits Market, and Nespresso, with "hundreds" of brands on platform
              per Veho's own descriptions. Tripling new client launches in 2025 suggests the sales pipeline
              is executing and churn is not prohibitive, though net retention data is not public.

              Profitability has not been confirmed. The January 2024 layoffs were the most direct signal of
              burn management, with the company explicitly stating the reorganization was intended to
              "improve efficiencies, accelerate our path to profitability." As of the May 2026 research
              date, Veho has not publicly claimed profitability or break-even. FreightWaves has noted that
              independent parcel carriers including Veho face ongoing "questions about whether profit margins
              can sustain expensive network buildouts," reflecting market-wide skepticism about the economics
              of challenger carrier scaling.
