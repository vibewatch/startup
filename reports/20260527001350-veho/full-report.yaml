      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Stale Unicorn Mark with No Re-Anchor
            body: >
              The $1.5 billion valuation from February 2022 is the most important single number in this analysis, and
              also

              the most problematic. It was set at the peak of the 2021–2022 venture supercycle by two investors (Tiger
              Global

              and SoftBank Vision Fund 2) that have subsequently made large-scale portfolio write-downs. Four-plus years

              without a new round — in an environment where late-stage companies routinely raise every 18–24 months — is
              a

              meaningful adverse signal. It most commonly reflects one of three situations: (a) the company is
              profitable

              and self-funding, (b) management believes a new mark would come in below the prior round price, or (c) the

              company is strategically delaying a raise to avoid a down round. Of these, (a) is inconsistent with the

              January 2024 layoffs; (b) and (c) are both adverse to existing investors.
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV033
          - type: callout
            title: CB Insights and Convoy Adverse Signals
            body: >
              Two third-party data points form the core adverse evidence in this chapter. First, CB Insights' Q1 2026
              State

              of Venture report documents global VC deal count at its lowest level since Q4 2016 and identifies non-AI,

              non-tier-1 companies as receiving flat-to-moderate valuations at best. Second, Convoy — a well-capitalized

              logistics-tech unicorn that raised $900 million across multiple rounds at a peak $3.8 billion valuation —

              ceased operations in October 2023. While Convoy was a digital freight broker rather than a last-mile
              carrier,

              the failure illustrates that the logistics-tech sector does not insulate unicorns from structural
              economics.

              Veho's pre-profitability status and opaque financials place it in the high-risk cohort identified by both

              signals.
            calloutType: risk
            claimRefs:
              - CV029
              - CV030
              - CV031
              - CV032
          - type: callout
            title: Revenue Multiple Anchoring
            body: |
              If Veho's estimated $540–810 million annualized revenue is correct, the company trades at approximately
              1.9–2.8× estimated revenue at the stale $1.5 billion mark — roughly a 2× premium to UPS/FedEx (1.0×)
              and a 5–7× premium to GXO (0.4×). A 2× premium to mature incumbents for a 50%+-growth challenger is
              defensible — but only if the growth rate is real and margins are improving. Without disclosed financials,
              neither condition can be verified. The premium collapses to zero justification if estimated revenue
              is materially lower (e.g., $300–400 million) or if margins are structurally negative.
            calloutType: insight
