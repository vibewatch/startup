      - number: '4.5'
        title: Financial Information Gaps and Disclosure Assessment
        blocks:
          - type: paragraph
            body: |
              Veho is a private company operating under a private-undisclosed disclosure profile. No audited
              or unaudited financial statements are available in the public domain. The company's SEC filings
              are limited to Form D exemption notices, which disclose only the capital raised per round and
              the general nature of the offering — they do not contain income statements, balance sheets, or
              cash flow data.

              The primary financial metrics a diligence analyst would seek — revenue, ARR, gross margin,
              EBITDA, burn rate, runway, unit economics, CAC, LTV, and net revenue retention — are entirely
              absent from public sources. Veho has made selective disclosures of operational metrics
              (parcel volume, market count, driver count, client growth percentages) but none of these map
              directly to financial performance. Operational scale is a necessary but not sufficient condition
              for financial health in capital-intensive logistics.

              The most actionable financial indicators available from public sources are: (1) the $300M
              total raised; (2) a 40-month gap since the last funding round (February 2022 to May 2026);
              (3) the January 2024 workforce reduction framed as a profitability-acceleration measure;
              and (4) continued operational expansion (new markets, new hub leases, driver network growth)
              in 2025–2026, which implies capital is still available and being deployed. Together these
              suggest the company is operating with financial discipline but has not yet reached — or at
              least not yet confirmed reaching — profitability.

              Any diligence process must obtain audited financials, cash flow statements, unit economics
              by market cohort, and funding runway projections directly from the company. No proxy
              can substitute for primary financial data in a logistics company with high operating leverage.
            claimRefs:
