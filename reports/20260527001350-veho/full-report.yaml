      - number: '1.5'
        title: Milestones, Partnerships, and Adverse Events
        blocks:
          - type: paragraph
            body: >-
              Veho has executed a sequence of rapid scaling milestones punctuated by one significant adverse event. The
              company won the Harvard New Venture Competition in April 2017, receiving a $75,000 prize and early
              validation. After several years building out its initial Colorado market, Veho achieved unicorn status
              with its December 2021 Series A and followed up six weeks later with a $170M Series B. In March 2022, the
              company made its only disclosed acquisition: QuikReturn, a New York-based e-commerce returns startup,
              which provided the foundation for Veho Returns. Also in 2022, Veho entered a strategic partnership with
              Flexport, a global logistics platform, and opened its second flagship office in Austin, TX. By summer
              2023, the company had expanded to 11 Northeast markets (total: 42 markets) and employed approximately 910
              people.

              The most material adverse event was in January 2024, when Veho laid off approximately 19% of corporate
              employees (~65 jobs) as part of a reorganization to improve efficiencies and accelerate the path to
              profitability. This followed earlier reductions in customer and driver support staffing, some of which
              were shifted offshore, as reported by The Information (May 2023; paywalled). The same period saw the
              departure of the Chief Commercial Officer (Eric Swanson, March 2023) and reportedly the Chief Revenue
              Officer (Brian McDevitt), raising governance and leadership continuity concerns. Deborah Surrette was
              appointed CCO in December 2023. The Better Business Bureau has received complaints from Veho customers,
              indicating unresolved service issues. In early 2026, Veho launched FlexSave, a cost-optimized delivery
              pricing product, and introduced Rivr autonomous delivery robots as a pilot. In March 2026, the company was
              recognized as one of Fast Company's World's Most Innovative Companies.
