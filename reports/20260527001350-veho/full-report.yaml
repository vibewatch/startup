  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surface and Service Architecture
        blocks:
          - type: paragraph
            body: >
              Veho's product portfolio spans three branded shipping service levels layered on a single operational
              infrastructure. Ground Plus (1–5 day), Premium Economy (2–8 day), and the legacy next-day/2-day Parcel
              Delivery tier serve different shipper cost and speed preferences. The FlexSave™ add-on, launched in Q1
              2026, overlays flexible delivery windows on both Ground Plus and Premium Economy to unlock cost savings
              via MaestroAI-driven route consolidation. A Transportation Solutions offering handles middle-mile and
              direct injection for brands that need Veho to pick up from their fulfillment centers. The 3PL product
              line—launched with pre-built integrations for Flexport, ShipBob, ShipHero, and Stord—extends Veho to
              third-party logistics providers as a last-mile layer.

              On the consumer side, Veho provides a mobile tracking application that allows package recipients to set
              delivery preferences, upload Perfect Placement™ photos (geolocation-tagged delivery spot images shared
              with driver apps), receive 4-hour delivery window confirmations, and access real-time human support.
              Shippers interact with Veho through the Veho Pulse Portal for analytics dashboards, early-risk alerts, a
              client-facing claims portal, and billing management. The Return on Shipping (ROS) calculator published by
              Veho tracks brand outcomes across LTV, refund reduction, and conversion improvement metrics, providing a
              quantified ROI framework for shippers.

              As of May 2026, Veho serves 144 million Americans across 66+ markets with plans for coast-to-coast
              coverage of all major US metros by end of 2026. The network is asset-light: Veho leases warehouse and
              sortation facilities rather than owning them, and driver-partners supply their own vehicles. Brands such
              as Sephora, Lululemon, Macy's, Warby Parker, Stitch Fix, Nespresso, HelloFresh, and Saks have been
              identified in third-party coverage as Veho shipping clients.
