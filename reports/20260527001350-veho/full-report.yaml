      - number: '8.2'
        title: Valuation Context and Public Comparables
        blocks:
          - type: paragraph
            body: >
              Veho has no direct public comparable — it is a pre-profit, private, last-mile delivery startup. The
              nearest

              publicly traded proxies are asset-heavy incumbents (UPS and FedEx) and the pure-play contract logistics

              operator GXO Logistics. As of May 2026, UPS trades at approximately 1.0× trailing-twelve-month revenue

              (market cap $86.7 billion on $88.3 billion TTM revenue) and roughly 7.7× EBITDA; FedEx similarly trades

              at approximately 1.0× revenue ($95.4 billion market cap on $91.9 billion TTM revenue) and roughly 10.5×

              EBITDA on a debt-adjusted enterprise value basis. GXO Logistics, a purer contract-logistics play, trades

              at roughly 0.4× revenue ($5.5 billion market cap on $13.2 billion TTM revenue) and 8× EBITDA on market

              cap alone.


              These multiples represent mature, large-cap, largely asset-heavy operators with minimal growth. A

              high-growth challenger like Veho would warrant a meaningful premium — typically 2–5× for a startup

              growing at 50%+ annually — but requires disclosed revenue to anchor any such multiple. Veho has not

              disclosed revenue publicly. Proxy estimates based on 7.5 million monthly parcels at an estimated

              $6–9 per-parcel average yield a revenue run rate of approximately $540–810 million annualized as of

              February 2026. At a 2× price-to-sales premium to UPS/FedEx (implying 2.0× revenue for a high-growth

              last-mile carrier), Veho's estimated revenue range implies a valuation of approximately $1.1–1.6 billion

              — broadly consistent with the $1.5 billion mark from 2022, but dependent on revenue assumptions that

              are unverified. At the more conservative GXO multiple (0.4× revenue), implied value drops to

              $220–325 million. The uncertainty range is enormous.


              For private-market context, LaserShip and OnTrac merged in September 2021 to create the third-largest

              regional parcel network in the US but remain private with no disclosed valuation. CB Insights' unicorn

              write-downs tracker identifies more than 130 unicorns with confirmed down rounds or mark-downs since

              2022; logistics and supply chain was among the hardest-hit sectors. The broader VC market compression

              since peak 2021 has eroded the premium multiples on which many logistics unicorn valuations were anchored.
            claimRefs:
