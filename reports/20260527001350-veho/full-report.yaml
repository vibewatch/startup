companyProfile:
  summary: >-
    Veho (Veho Tech, Inc.) is a US-based tech-enabled last-mile delivery unicorn founded in 2016 at Harvard Business
    School by Itamar Zur (CEO) and Fred Cook (CTO). The company operates a proprietary software platform and a
    crowdsourced network of approximately 120,000 independent contractor driver-partners across 66 US markets, reaching
    an estimated 144 million Americans (44% of the US population) as of early 2026. Veho focuses exclusively on premium
    and mid-market direct-to-consumer e-commerce brands, offering per-parcel delivery with no residential surcharges, no
    weekend fees, and a white-glove delivery experience. The company has raised approximately $301M across three venture
    rounds, achieving a $1.5B unicorn valuation at its February 2022 Series B, but has not publicly raised additional
    equity since. Veho processed an estimated 7.5 million parcels per month in early 2026 and reported approximately 90%
    revenue growth in 2023; audited financials remain undisclosed.
