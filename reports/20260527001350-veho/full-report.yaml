      - number: '7.4'
        title: Operational, Service Quality, and Competitive Risk
        blocks:
          - type: paragraph
            body: >-
              Veho's company-claimed 4.9/5 CSAT and 99%+ on-time delivery rate stand in notable tension with third-party
              review signals. Trustpilot shows 1,153 reviews with a mean score of 3.7/5 (as of May 2026), and a material
              share of adverse reviews document chronic patterns: packages reported delivered but not received, photos
              of mismatched packages used as proof of delivery, packages sent multiple states in the wrong direction due
              to "technical errors," and deliveries attempted at 11:45 PM to business addresses. BBB complaint data for
              the Jacksonville, FL entity shows documented consumer disputes about lost and misdelivered packages across
              a three-year reporting window.

              Driver quality is the proximate risk driver. Indeed reviews document that per-box pay was reduced from
              $2.50–$3.75 to approximately $1.97, routes frequently underestimate driving time (5-hour routes scheduled
              as 4 hours), shift availability is severely limited (shifts "disappear within 1 minute of being posted"),
              and driver turnover is elevated. Warehouse operations were described as "understaffed 98% of the time."
              These conditions create structural risk of quality deterioration as Veho expands into new markets where it
              has less driver density and experience.

              Competitive risk is elevated by Amazon's aggressive logistics buildout. Amazon now delivers an estimated
              40%+ of its own US package volume through its in-house logistics network (Amazon Logistics) and is
              actively competing for third-party e-commerce brands via "Buy with Prime" (which uses Amazon Logistics for
              fulfillment and delivery). FedEx and UPS have restructured their residential delivery networks and are
              targeting the e-commerce SMB segment with new rate structures. As Veho moves from a regional to national
              carrier, it transitions from a capacity supplement to a primary carrier competing head-to-head with
              carriers that have 50+ years of route density, driver relationships, and brand trust. Technology
              replication risk is moderate — Veho's proprietary route optimization and the Veho Pulse client portal are
              differentiators, but neither Amazon, FedEx, nor UPS lacks engineering resources to close the technology
              gap.
            claimRefs:
