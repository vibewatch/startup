summary:
  headline: >-
    Veho is a high-growth last-mile delivery operator with genuine brand differentiation and strong customer outcomes,
    but existential IC reclassification risk, a four-year-stale $1.5B valuation mark, and complete financial opacity cap
    conviction at "track" pending audited financials and a capital raise event.
  overallScore: 5.5
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
