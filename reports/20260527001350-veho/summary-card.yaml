  topStrengths:
    - >-
      Tech-enabled last-mile network with 120,000+ IC drivers across 66 US markets reaching 144 million Americans, with
      9× cumulative volume growth since 2021.
    - >-
      Premium brand differentiation delivering documented customer outcomes (41% CLV improvement, 35% delivery cost
      reduction) that drive client stickiness with top e-commerce names.
    - >-
      $301M raised from top-tier investors (General Catalyst, Tiger Global, SoftBank Vision Fund 2), with CEO-reported
      unit-economics improvement and doubled parcel volume in 2025.
    - >-
      ShipStation and ShipHero integrations expanding addressable merchant base to 5,000+ brands; strong named client
      roster across fashion, beauty, food, and luxury retail.
    - >-
      MaestroAI proprietary routing platform provides a technical moat and enables the premium on-time (99%) and
      consumer-satisfaction (4.9/5 B2B) metrics cited in client case studies.
  topRisks:
    - >-
      IC driver reclassification is the existential cost-model risk — DOL's 2024 final independent contractor rule and
      February 2026 NPRM signal tightening enforcement that could fundamentally alter Veho's unit economics.
    - >-
      No public equity raise since February 2022 — estimated remaining cash of $50–150M with uncertain runway and an
      unconfirmed path to profitability despite the January 2024 corporate layoffs.
    - >-
      The $1.5B Series B valuation from February 2022 is stale by four-plus years; compressed VC markets and
      logistics-sector multiple contraction suggest a meaningful discount to the 2022 mark in any near-term re-price.
    - >-
      Audited financials, gross margin, burn rate, NRR, and unit economics are entirely undisclosed, preventing
      independent verification of profitability progress claims.
    - >-
      Premium discretionary retail client concentration (Saks, Lululemon, Nordstrom, Macy's) exposes revenue to
      macroeconomic downturns, and geographic coverage gaps limit TAM capture.
  unresolvedGaps:
    - >-
      Audited revenue, gross margin, burn rate, cash balance, and monthly burn are not publicly available; any
      investment underwrite must obtain these via data-room diligence.
    - >-
      Net revenue retention, customer acquisition cost, lifetime value, and contract length/renewal terms are
      undisclosed.
    - >-
      Quantified legal exposure and contingent liability from IC reclassification risk under the DOL 2024 rule and
      February 2026 NPRM have not been independently assessed.
    - >-
      Timing and terms of any planned Series C or capital raise are not public; cash runway assumptions carry high
      uncertainty.
    - >-
      Exact customer count (active brand clients) is not disclosed; the 70% growth claim in 2025 is CEO-reported and
      unaudited.
