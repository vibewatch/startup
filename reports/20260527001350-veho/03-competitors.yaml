- id: capability-pricing-comparison
  title: Feature, Capability, and Pricing Comparison
  body: 'Veho and OnTrac converge most closely on the feature set that premium e-commerce brands require: next-day and two-day
    residential delivery, photo proof of delivery, real-time consumer tracking, consumer-facing rescheduling tools, and API
    integration for multi-carrier software. Both claim pricing below national incumbents. The primary competitive differentiator
    Veho cites is its consumer experience score (4.9/5 CSAT, 99%+ OTD) and its AI-powered routing via MaestroAI, which it
    argues yields a superior service at a meaningfully lower total delivered cost. OnTrac counters with broader coverage (35
    states vs. Veho''s 70 markets as of April 2026), stronger enterprise relationships from its legacy LaserShip history,
    and a USPS Workshare partnership that enables rural reach Veho lacks.

    On pricing, the market is largely opaque. Neither Veho nor OnTrac publishes list rates; both negotiate per-contract with
    e-commerce brands. National carriers (FedEx, UPS) publish rates but apply residential and fuel surcharges that meaningfully
    increase the total per-parcel cost for high-volume e-commerce shippers. USPS Ground Advantage lists its commercial rates
    publicly and does not apply a residential surcharge—making it the cost benchmark for lightweight parcels. Veho''s FlexSave
    product, launched in February 2026, introduces a flexible-delivery-window option that allows brands to trade speed certainty
    for lower per-parcel cost, creating a new pricing tier between day-certain service and standard parcel delivery.

    FedEx''s One Rate pricing (flat-rate for expedited services) and its economy service for high-volume residential packages
    are positioned for segments Veho does not serve (expedited, >2-day delivery). FedEx''s fdx platform and Delivery Manager
    consumer tool increasingly mirror Veho''s Pulse platform and consumer rescheduling feature, reducing the technology differentiation
    gap over time. The convergence of feature sets across all tech-enabled carriers—photo proof, SMS notifications, rescheduling,
    API integration—is a long-run commoditization signal that Veho must address through deeper brand integration or network
    density advantages.

    A material adverse signal emerges from consumer review data: Trustpilot reviews of Veho in 2026 document multiple cases
    of lost packages, AI chatbot-only customer service (no human phone line), and driver behavioral issues. One reviewer explicitly
    stated: "Veho has no real Human to human customer service or a customer service hotline. They use AI texts and email."
    If Veho''s 4.9/5 CSAT figure is primarily measured through shipper-side (brand) satisfaction rather than consumer satisfaction,
    this creates a gap between the CX narrative and actual delivery experience—exactly the gap that incumbents historically
    exploited against challenger carriers.'
