  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Independent third-party cost benchmarking of Veho vs. OnTrac, USPS Ground Advantage, and national carrier
      all-in rates on matched shipment profiles (weight, zone, zone density).
    whyItMatters: Veho's primary value proposition is a 35% cost savings vs. incumbents; without independent verification,
      this claim cannot be distinguished from marketing. OnTrac makes a similar claim, suggesting at least one of the two
      is overstating savings for comparable SKUs.
    diligencePath: Request matched-invoice audit from three Veho clients who also have concurrent FedEx/UPS billing; obtain
      current OnTrac rate card for same ZIP code profiles.
    relatedQuestionRefs:
    - QP003
    - QP013
  - type: private-evidence-only
    severity: material
    topic: ontrac-competitor
    missingEvidence: OnTrac's estimated annual parcel volume, revenue, and active brand client count as of 2026; its post-merger
      OTD and damage rate performance metrics.
    whyItMatters: OnTrac's relative scale vs. Veho determines whether it has density advantages in overlapping markets and
      whether it is winning or losing clients in Veho's segments.
    diligencePath: Trade press coverage; carrier industry reports; survey of e-commerce brand logistics buyers who use both
      carriers.
    relatedQuestionRefs:
    - QP004
    - QP024
  - type: enumeration-incomplete
    severity: minor
    topic: amazon-logistics
    missingEvidence: Confirmed timeline, eligibility criteria, or pricing structure for Amazon Logistics opening to third-party
      non-Amazon brand shippers.
    whyItMatters: If Amazon opens its logistics platform within 1-2 years, Veho's competitive position changes materially.
      The scenario is cited in FedEx's FY2025 10-K as a stated intent but has no confirmed timeline.
    diligencePath: Monitor Amazon annual reports, investor day presentations, and logistics trade press for third-party opening
      announcements.
    relatedQuestionRefs:
    - QP026
  - type: private-evidence-only
    severity: material
    topic: veho-adverse
    missingEvidence: Systematic consumer CSAT data for Veho from independent sources (not company-reported 4.9/5 score); breakdown
      of satisfaction scores in mature markets vs. newly expanded markets.
    whyItMatters: Adverse Trustpilot reviews in 2026 suggest consumer-side satisfaction may differ from the brand-side (shipper)
      satisfaction that drives Veho's reported CSAT. The CX moat depends on consistent driver quality at scale.
    diligencePath: Request Veho's NPS or CSAT data segmented by market age; conduct reference calls with consumers who have
      received Veho deliveries in markets launched <6 months vs. >18 months.
    relatedQuestionRefs:
    - QP007
    - QP019
