chapter:
  number: 3
  title: Competitors
  summary: 'Veho competes across five competitive classes in the US last-mile parcel market: national incumbents (FedEx, UPS,
    USPS), the regional tech-carrier OnTrac (LaserShip merger), crowdsourced same-day platforms (Roadie/UPS), the looming
    captive entrant Amazon Logistics, and the internal-build or multi-carrier status quo. The most credible near-term threat
    is OnTrac, whose merged footprint now reaches ~70% of the US population in 35 states— nearly identical to Veho''s 70-market
    coverage—while claiming 10-35% savings versus national carriers. FedEx''s DRIVE/Network 2.0 program explicitly adopts
    an independent-contractor model for last-mile delivery, showing incumbents learning from gig-carrier economics. Amazon''s
    publicly stated intent to open its logistics network to third-party shippers, if executed, would represent the most disruptive
    competitive shift. Adverse consumer reviews and reliance on AI-only consumer support reveal a quality-consistency gap
    that could erode Veho''s premium-CX moat if not addressed.'
sections:
- id: competitive-landscape-overview
  title: Competitive Landscape Overview
  body: 'Veho operates at the intersection of two legacy-carrier weaknesses—cost and consumer experience—and has built a business
    around providing e-commerce brands a measurably better post-purchase experience at a lower total delivered cost. To assess
    competitive durability, the landscape must be disaggregated into five classes: (1) national incumbent carriers, (2) tech-enabled
    regional carriers, (3) crowdsourced same-day platforms, (4) captive or potential new entrants, and (5) status-quo and
    internal-build alternatives.

    National incumbents—FedEx (Federal Express segment), UPS, and USPS—collectively serve 100% of the US residential population
    but compete primarily on reliability and network breadth rather than consumer experience or brand alignment. FedEx''s
    fiscal year 2025 annual report (10-K filed July 2025) explicitly identifies "startup companies that combine technology
    with crowdsourcing to focus on local market needs" as a competitive category, validating Veho''s threat to their residential
    volume. FedEx''s own DRIVE program and Network 2.0 initiative—which contracts independent service providers for last-mile
    delivery in ~290 US and Canadian locations—signals that incumbents are beginning to adopt the gig-carrier model Veho pioneered.

    The most direct peer threat comes from OnTrac, the carrier formed by the 2021-2022 merger of LaserShip (East Coast) and
    OnTrac (West Coast). The combined entity reached ~70% of the US population across 35 states and the District of Columbia
    as of 2026 and explicitly targets the same premium e-commerce brand clients as Veho with pricing claims of 10-35% below
    national carriers. OnTrac''s complementary coverage footprint and similar gig-driver model make it Veho''s most direct
    substitute in the buyer''s sourcing decision. USPS Ground Advantage, launched in 2023, eliminates the residential delivery
    surcharge that FedEx and UPS apply and competes aggressively on price for the high-volume, low-weight residential parcel
    segment that forms much of Veho''s volume.

    Amazon Logistics remains the largest structural wildcard. Currently captive to Amazon''s own shipments, Amazon''s DSP
    (Delivery Service Partner) network has expressed intent in its FedEx 10-K competitive filing to offer its internal capabilities
    broadly to third parties. If Amazon opens its logistics platform to non-Amazon brands, it would enter Veho''s market with
    a cost, technology, and scale advantage that would be very difficult to counter. Crowdsourced same-day platforms (Roadie,
    acquired by UPS in 2021) occupy an adjacent but distinct slot—same-day delivery for large or time-critical items across
    diverse verticals—and are not yet direct substitutes for Veho''s next-day and two-day residential parcel model. The status-quo
    alternative (multi-carrier UPS/FedEx strategy or in-house fleet) remains viable for brands with existing carrier relationships
    and is the most common reason for non-adoption of Veho.

    CB Insights counts 95+ companies actively innovating in last-mile delivery, underscoring a crowded market. However, the
    competitive intensity is concentrated in a narrow set of credible at-scale alternatives: OnTrac, the national incumbents,
    and Amazon. The long tail of smaller regional carriers (LSO in Texas/Southwest, Dropoff in B2B same-day) occupy niches
    well outside Veho''s core market.'
