- id: TP004
  title: Moat Durability and Competitive Risk Register
  columns:
  - Moat Claim
  - Competitive Threat
  - Severity
  - Mitigation / Diligence Ask
  rows:
  - - Superior consumer experience (4.9/5 CSAT, 99% OTD)
    - Trustpilot reviews show AI-only support and driver no-shows; quality fragile at scale; incumbents adding photo-POD,
      Delivery Manager tools
    - High
    - Audit CSAT methodology (shipper-side vs. consumer-side); measure satisfaction in markets >18 months old vs. new markets
  - - 35% cost savings vs. national incumbents
    - USPS Ground Advantage has no residential surcharge and often undercuts all carriers for lightweight items; OnTrac claims
      similar 10-35% savings; DRIVE/Network 2.0 compresses FedEx unit cost
    - Medium
    - Request independent cost benchmarking vs. USPS Parcel Select and OnTrac on matched shipment profiles
  - - AI routing advantage (MaestroAI)
    - OnTrac, FedEx (DRIVE), Amazon Logistics all invest heavily in routing optimization; Veho's lead is not independently
      verified; capability gap narrowing
    - Medium
    - Ask for measurable OTD and cost-per-stop differential attributable to MaestroAI vs. comparable carriers in same markets
  - - Brand-client integration stickiness (Veho Pulse)
    - FedEx fdx, UPS APIs, multi-carrier platforms (EasyPost, ShipStation) offer comparable integration depth; low switching
      cost for brands using orchestration layers
    - Medium
    - Measure share of Veho-client volume that uses Veho as sole carrier vs. one-of-many; assess contract term and switching
      economics
  - - Gig-driver labor cost advantage
    - AB5 / IC reclassification risk in California and other states; DOL enforcement activity; if reclassified as employees,
      per-delivery cost rises 20-30%+ and cost moat evaporates
    - High
    - Assess current IC litigation exposure in CA and any other pending state enforcement; review driver classification legal
      structure
  - - Geographic coverage expansion moat (70 markets)
    - National carriers already cover 100% US; OnTrac already at ~70% US population; coverage parity narrows Veho's geographic
      advantage as it expands
    - Low–Medium
    - Identify at what national coverage threshold Veho becomes a substitute to OnTrac vs. a complementary option; assess
      expansion economics
  - - Amazon Logistics stays captive to Amazon shipments
    - FedEx FY2025 10-K confirms Amazon has 'expressed an intention to offer its internal delivery capabilities broadly to
      third parties'; if realized, Amazon enters premium e-commerce last-mile at 10x scale
    - Critical (if scenario occurs)
    - Monitor Amazon logistics third-party announcements; assess which Veho clients would immediately qualify for Amazon logistics
      if it opened
  - - Premium brand positioning and client relationships
    - Commoditization pressure as gig-carrier feature sets converge; multi-carrier strategies by brands reduce sole-source
      dependence; Veho's brand clients can easily trial OnTrac
    - Medium
    - Survey Veho clients on exclusivity of carrier relationship; seek evidence of long-term contract commitments with termination
      penalties
  notes: Severity ratings are subjective assessments based on available public evidence; not derived from financial modeling.
    IC reclassification cost estimate (20-30%) is based on general gig-economy cost structure analysis, not Veho-specific
    data. Amazon third-party logistics scenario is speculative but explicitly acknowledged in FedEx's FY2025 10-K.
