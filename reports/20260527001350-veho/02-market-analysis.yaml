callouts:
  - calloutType: risk
    title: "IC Classification Regulatory Risk Is Structural, Not Speculative"
    body: >-
      Veho's cost advantage relative to UPS/FedEx depends substantially on its gig-driver model.
      California AB5 (2019) and the DOL's March 2024 FLSA final rule both tighten independent contractor
      standards. A regulatory or judicial determination that Veho's 120,000+ driver-partners are employees
      would materially increase unit labor costs and could threaten the economics of the gig-carrier model.
      This risk is shared by all gig-economy last-mile carriers (OnTrac uses employed drivers in some
      markets) but is particularly acute for Veho given its scale and reliance on contractor economics.
    claimRefs:
      - CM032
      - CM033

  - calloutType: insight
    title: "Consumer Preference Shift Toward Cost Over Speed Opens FlexSave Opportunity"
    body: >-
      McKinsey data (2024) cited by Veho shows delivery speed fell from #1 to #5 consumer priority,
      with 95%+ preferring free standard delivery. This shift is structurally favorable for Veho's
      FlexSave product (yield-management delivery with flexible windows) and potentially shifts Veho's
      competitive ground from a speed-premium carrier to a cost-efficient premium carrier—aligning
      with brand demand for free-shipping optionality without sacrificing consumer experience.
    claimRefs:
      - CM028
      - CM029
      - CM030

  - calloutType: assumption
    title: "Market Sizing Relies on Derived Estimates; No Authoritative Public Source Found"
    body: >-
      All US last-mile ecommerce market size estimates in this chapter are derived from accessible
      public data (Census ecommerce, USPS volume, DC360) rather than authoritative market research.
      Analyst reports are referenced but their underlying data was not accessible. The SAM and SOM
      estimates are this analysis's own construction and carry wide uncertainty bands. Investors
      should seek proprietary market research or management-provided TAM analysis.
    claimRefs:
      - CM017
      - CM018
      - CM019

