chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Veho operates at the intersection of two converging forces: US ecommerce GMV of ~$1.234 trillion in 2025
    (up 5.4% YoY, with Q1 2026 showing re-acceleration to 9.8% YoY per Census Bureau data) and growing
    brand-shipper demand for a differentiated last-mile alternative to UPS/FedEx/USPS. The US domestic
    parcel delivery market is estimated at $150-200B in total spend, with the premium non-Amazon ecommerce
    segment—Veho's SAM—estimated at $30-50B based on bottom-up ecommerce GMV and carrier cost ratios.
    A meaningful constraint is the slowing ecommerce growth rate, rising carrier cost pressure from free-shipping
    expectations, and regulatory risk around independent contractor classification that could structurally
    impair Veho's gig-driver cost advantage.

sections:
  - id: "market-boundary"
    title: "Market Boundary and Definition"
    body: >-
      Veho competes in the US domestic last-mile parcel delivery market—specifically the sub-segment
      serving premium and mid-market direct-to-consumer (DTC) e-commerce brands. "Last-mile delivery"
      refers to the final leg of a shipment's journey from a regional sortation hub or distribution
      center to the consumer's residence or business. It is the most cost-intensive and operationally
      complex segment of the supply chain, accounting for an estimated 40-53% of total logistics spend
      by industry convention.

      The market boundary for Veho's purposes includes: (1) residential parcel deliveries of ecommerce
      orders, primarily small packages under 70 lbs; (2) next-day through 10-day delivery windows;
      (3) carriers serving non-Amazon e-commerce brands, 3PLs, and fulfillment partners. Explicitly
      excluded are: Amazon-network shipments (not available to external carriers), bulky or
      white-glove furniture/appliance delivery, B2B freight and industrial shipments, mail (First-Class
      and Marketing), fresh/perishable grocery delivery, and international parcels.

      The status-quo alternative for most shippers is a split between UPS, FedEx, USPS Ground Advantage,
      and regional carriers such as OnTrac (LaserShip + OnTrac merged network). The key insight in
      Veho's market positioning is that premium e-commerce brands—those with NPS-sensitive, repeat-purchase
      customer bases—are underserved by incumbents on the combination of experience quality, technology
      transparency, and total landed cost. Adjacent to this core market are returns logistics,
      doorstep pickup, and 3PL platform channels (Flexport, ShipBob), which Veho is beginning to
      serve and which could expand the addressable opportunity.

      The market is highly fragmented at the sub-national level: UPS and FedEx dominate national
      volume but offer limited density and technology differentiation in suburban residential last-mile.
      USPS Ground Advantage (starting at $5.09/parcel for businesses) provides a low-cost floor that
      constrains carrier pricing. Amazon Logistics has grown to rival UPS in parcel volume but is
      internally focused; its emergence has paradoxically opened space for third-party last-mile
      specialists by demonstrating that proprietary delivery networks can deliver superior ecommerce
      experiences.
