  - id: "growth-drivers-constraints"
    title: "Growth Drivers and Adoption Constraints"
    body: >-
      Several structural forces support continued last-mile delivery market growth for a Veho-type player.
      First, ecommerce penetration continues to grow: at 16.9% of all US retail in Q1 2026 (Commerce Dept
      methodology) or 23.1% under DC360's adjusted methodology, ecommerce has never declined on an annual
      basis and is growing at 5-10% per year. Amazon's Q1 2026 unit volume grew 15% YoY, the highest rate
      since post-COVID normalization, suggesting parcel volumes are re-accelerating. Second, Amazon's
      continued expansion of same-day and one-hour delivery options is training consumer expectations
      upward—non-Amazon brands must match on convenience or differentiate on experience, both requiring
      premium last-mile investment. Third, the secular trend toward brand-owned DTC channels (versus
      Amazon marketplace) increases shipper independence and the need for a carrier relationship that
      reflects the brand.

      Four material constraints and adverse signals require diligence. First, ecommerce growth slowed
      to 5.4% in 2025, the second-lowest rate since the Great Recession (only 2022's 4.9% was lower),
      indicating normalization from COVID-era acceleration. Slower GMV growth flows directly to slower
      parcel volume growth and reduced carrier switching activity. Second, consumer preference has
      decisively shifted toward free standard delivery: McKinsey data shows 95%+ prefer free 4-7 day
      delivery over paid expedited, and the WSJ's March 2026 coverage noted retailers are withdrawing
      free-shipping promises due to rising fulfillment costs. This creates margin pressure: brands are
      demanding lower per-parcel rates even as Veho's cost structure is largely fixed (driver pay,
      fuel, hub operations). Third, independent contractor classification risk is structural. California's
      AB5 (2019) imposes a strict ABC test for IC status; the US DOL's March 2024 final FLSA rule
      tightened IC standards nationally. A shift toward employee classification for Veho's 120,000+
      driver-partners would materially increase unit labor costs. Fourth, macro uncertainty from the
      Iran conflict and oil price volatility (Brent crude reaching $112/barrel in April 2026 before
      retreating) may dampen consumer spending and raise fuel costs, compressing both GMV growth and
      carrier margins.

      From a competitive constraint standpoint, OnTrac (LaserShip + OnTrac merger) describes itself
      as the "first transcontinental carrier of choice for last-mile e-commerce deliveries" and serves
      a similar premium-ecommerce segment with East-West network coverage. USPS Ground Advantage at
      $5.09/parcel is a persistent low-cost floor that limits premium-carrier pricing upside. These
      forces together mean Veho must grow volume and geographic density faster than its cost base to
      reach and sustain profitability—a capital-intensive race that is ongoing.
