  - id: "buyer-segmentation"
    title: "Buyer, User, and Payer Segmentation"
    body: >-
      Veho's market has three distinct parties: the buyer (e-commerce brand or 3PL deciding on carrier
      selection), the user (the consumer receiving the package), and the payer (the brand, who pays the
      carrier rate). This three-party structure has important implications for adoption and pricing power.

      The primary buyer is the VP of Supply Chain, Director of Fulfillment, or Chief Operations Officer
      at a mid-to-large premium DTC or omnichannel e-commerce brand. Budget sits in supply chain/logistics
      operating expense. Key selection criteria are: on-time delivery performance, cost per parcel
      relative to UPS/FedEx, technology integration (API, tracking, exception management), customer
      satisfaction impact, and geographic coverage.

      The user is the end consumer. McKinsey survey data (2024, per Veho's own blog citing WSJ reporting)
      shows delivery speed fell from the #1 priority in 2022 to #5 in 2024, while shipping cost became
      the dominant factor; more than 95% of respondents preferred free standard delivery (4-7 days)
      over paid expedited. This shift creates a bifurcated market: a standard-delivery tier where cost
      is king (USPS Ground Advantage, FlexSave-type products) and a premium-experience tier where NPS
      and brand differentiation justify a price premium.

      Veho's case studies reveal a diverse buyer set: IPSY (beauty subscription), Kendra Scott (jewelry),
      Tuckernuck (fashion), Saks Fifth Avenue (luxury retail), Hungryroot (meal kit), Sakara (food), and
      a leading athleisure brand. These buyers share: moderate-to-high order values, NPS-sensitive
      customer bases, and a willingness to pay for post-purchase experience as a competitive lever.
      3PL platforms (Flexport, ShipBob) serve as an important channel: 3PLs can white-label Veho's
      service across their merchant customer base, multiplying reach without direct sales effort.

      Adoption triggers include: (1) UPS/FedEx contract renewal cycle (typically 1-3 years), (2)
      carrier service failure or cost spike, (3) customer complaints about delivery experience, and
      (4) competitive pressure from rival brands using faster/better delivery as a marketing lever.
      Switching cost is moderate: integration with a brand's OMS and 3PL is required, and retraining
      of ops teams; but Veho's technology-forward model and published API lower this barrier.
      Concentration risk is real: Veho's enterprise brand clients represent large, multi-year commitments
      but also single-point churn risk if a major brand redirects volume.
