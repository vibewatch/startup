              尽管 2023 年收入增长 90%，且 2025 年运营指标强劲，Veho 尚未公开确认实现盈利或盈亏平衡。2024 年 1 月约 19%
              企业员工裁员被明确表述为“加快通往盈利路径”的举措——这直接承认公司当时尚未盈利。截至 2026 年 5 月，公司没有发布后续盈利公告。由于 2022 年 2
              月以来没有新融资轮，公司的现金跑道无法从公开来源验证，构成重要财务尽调缺口。
