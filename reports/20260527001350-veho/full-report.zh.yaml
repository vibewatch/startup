  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现结构
        blocks:
          - type: paragraph
            body: >
              Veho 的收入模式建立在按包裹收取交易费之上，电商品牌和零售商为每一个经由其网络完成的配送付费。不同于既有承运商（UPS、FedEx、USPS），Veho
              不对住宅包裹收取住宅附加费、周末配送加价或燃油附加费——价格就是单包裹全包价。简单、透明的定价结构是一个有意设计的产品和销售差异点，瞄准经常被既有承运商附加费吞噬利润的 DTC 电商品牌。


              Veho 在同一个按包裹收费框架下变现三条服务线。**Ground Plus**（品牌表述为 1–3 日配送）是核心产品和主要收入驱动。**Premium Economy**（2–8
              日、交付成本更低）服务价格敏感型卖家，并与 FedEx Ground 和 USPS Priority Mail 的部分包裹量重叠。**FlexSave** 在 2026 年 Q1 作为 beta
              产品推出，明确加入用时效换成本的权衡——卖家可以在灵活窗口内延后配送时效，以换取更低单包裹费率；Veho 因此获得更大路线灵活性，并可能提升配送密度和利润率。FlexSave 表明 Veho
              想把时效确定型包裹和灵活窗口包裹混合到共享司机路线中，以优化网络利用率。


              次要收入线包括在 9 个区域分拣中心内运营的 **3PL 增值服务**（入库收货、仓储、拣货打包）、面向退货的 **Doorstep Pickup**（从消费者住所完成末端取件），以及通过 RIVR 提供的
              **企业物流咨询**（截至 2025 年 5 月，与 Berkshire Grey 机器人业务形成的战略咨询和技术共创合作）。这些次要业务均未披露收入贡献。3PL 和取件服务的差异来自 Veho
              既有网络密度和司机可用性，能够以较低边际成本延展，并几乎不增加固定成本负担。


              Veho 声称，对其目标客户群（采用 1–3 日住宅配送的高端电商品牌）而言，相对既有承运商可节省 35% 全口径落地成本。一个已披露客户数据点显示，运费支出占收入比例下降
              2%。两个数字都来自公司，缺乏独立审计。
