      - number: '5.6'
        title: 产品风险、技术约束与新兴项目
        blocks:
          - type: paragraph
            body: >
              Veho 的首要地理风险是全国覆盖不完整。截至 2026 年 5 月，66 个市场的网络触达 1.44 亿美国人（约占美国人口 42–46%），美国西北太平洋地区、山地西部、Texas
              以外的深南部以及农村地区等主要区域仍无 Veho 覆盖。传统承运商服务 99%+ 的美国人口，因此对于配送需求分散在全国的品牌，Veho 作为单一承运商无法完全满足需求，存在结构性劣势。California
              在公司运营九年后，才于 2025 年末 / 2026 年初上线。

              司机应用可靠性是可证明的运营风险。Indeed 上多条独立司机评论指出相机 / 扫描器界面 bug、路线估算错误（路线耗时达到标示时间的
              2×）和付款解决失败。这些技术问题影响司机留存和满意度，进而影响路线覆盖和配送质量。所有司机合作伙伴的独立承包商分类，在 AB5 和类似州级错误分类法律下形成持续法律暴露，尤其是在 California（Veho
              于 2026 年扩张进入）。Prop 22 条款适用于 California，要求为高利用率司机提供净收入底线和医疗补贴。

              创新侧，2025 年宣布的 RIVR 机器人合作仍是早期试点（Austin, TX），在 2 周评估期内仅使用一台机器人。公司提出的 200 packages/day 运力和 10 deliveries/hour
              吞吐量未经审计，且基于受监督条件下的单台设备。RIVR 的 $22M 种子轮（Bezos Expeditions 领投）以及 Amazon Industrial Innovation Fund
              参与，显示投资人对该概念兴趣很高，但并未降低在美国城市环境中大规模部署机器人的商业可行性风险。从试点走向车队级部署的路径尚未证明。

              FlexSave 产品的 MaestroAI 优化主张在技术上可成立，但缺乏与 FedEx 或 UPS 配送管理工具的独立基准对比；后者已经提供可比的灵活窗口和客户控制功能。Veho
              在路线优化上的竞争护城河主要是地理密度（特定都市圈中的众包司机市场），未必是算法相对拥有数十年路线数据的资源充足既有承运商更优。
