      - number: '4.4'
        title: 收入增长与运营轨迹
        blocks:
          - type: paragraph
            body: >
              Veho 虽未公开披露收入，但运营指标提供了很强的增长代理。TechCrunch 报道的一份公司声明称，2023 年收入较 2022 年增长近 90%。2025 年，公司报告客户基础增长 70%，新客户上线数相对
              2024 年增加两倍。2025 年假日旺季包裹量较 2024 年翻倍。截至 2026 年 2 月，Veho 在美国 66 个市场每月配送 7.5M+ 个包裹，网络覆盖 1.44 亿美国人（约占美国人口 44%）。


              司机网络从 2025 年 5 月约 84,000 人增至 2026 年 2 月 120,000 人——八个月增长
              43%。这一增长显示公司快速扩张市场，也反映进入新地理区域和加深既有市场密度两件事同时发生。市场覆盖从 2025 年初约 45 个市场增至 2026 年 4 月 70 个市场，包括向南加州（Los Angeles
              metro、San Diego、Las Vegas、Scottsdale）的大规模扩张；在推出后数月内，南加州每周包裹配送已超过 100,000 个。


              公司具名客户包括 Macy's、Lululemon、Sephora、HelloFresh、Kroger、Nordstrom、Saks、Misfits Market 和 Nespresso；按 Veho
              自身描述，平台上有“数百个”品牌。2025 年新客户上线数增加两倍，说明销售管线正在兑现，且流失尚未构成阻断，尽管净留存数据并未公开。


              盈利能力尚未得到确认。2024 年 1 月裁员是最直接的烧钱管理信号，公司明确表示重组意在“提升效率、加快通往盈利的路径”。截至 2026 年 5 月研究日期，Veho
              尚未公开声称实现盈利或盈亏平衡。FreightWaves 曾指出，Veho 等独立包裹承运商仍面临“利润率能否支撑昂贵网络建设”的持续问题，反映市场对挑战者承运商扩张经济性的普遍怀疑。
