      - number: '2.2'
        title: 市场规模：多视角测算
        blocks:
          - type: paragraph
            body: >-
              公开数据中没有一个权威估计可直接界定美国末端电商包裹配送市场；分析师估算跨度很大（美国 $60B 至
              $200B+，取决于范围和年份），全球数字又常与国内数字混用。本节给出三套独立规模测算视角，并明确保留彼此矛盾。

              视角 1——从电商 GMV 自上而下：2025 年美国零售电商销售额合计约 ~$1.234 trillion，YoY 增长 5.4%（Digital Commerce 360 对 Commerce
              Department 数据的分析）。Q1 2026 经季调后重新加速至 $326.7 billion，YoY 增长 9.8%（Census Bureau）。扣除 Amazon 自身 North America
              板块（Q1 2026 年化运行率约 ~$416B），美国非 Amazon 电商 GMV 约 $820-900B。按行业惯例，末端配送成本占 GMV 的 8-10%，仅非 Amazon
              电商带来的可触达末端配送支出约为每年 ~$66-90B。Veho 的高端品牌 SAM 是其中一部分：中大型高端 / DTC 品牌（约占非 Amazon 电商的 40-50%）意味着 SAM 为 $26-45B。

              视角 2——从包裹量自下而上：USPS 在 FY2025 运送 6.8 billion 个包裹。加上 UPS（估计 ~5.3B）、FedEx（估计 ~4.0B）和 Amazon
              Logistics（美国第三方包裹估计 ~7B），美国国内年包裹量合计约 23-26 billion。若高端服务平均每包裹收入为 $10-14，则美国包裹配送市场合计为 $230-365B。末端成本约占
              40-53%，对应美国末端市场 $92-193B。这些估计对口径很敏感（是否纳入 Amazon 自配），也未能从本分析的一手来源独立交叉验证。

              视角 3——分析师区间（相互矛盾）：多份行业研究摘要显示，全球末端配送市场在 $40-100B（2024 年估计）之间，并以 10-15% CAGR 增至 2030 年
              $150-450B。美国通常占全球的三分之一到四分之一，意味着美国市场 2024 年估计为 $13-33B——显著低于视角 1 和 2。差异来自不同口径定义（承运商收入 vs.
              物流支出）和不同排除项。证据缺口很实质：本分析未找到公开一手来源给出的美国末端市场规模。

              按现有地理覆盖（73 个市场、47% 美国人口），Veho 可触达 SOM 受覆盖约束：大约是 SAM 的一半，即 $13-22B。以其披露的 ~7.5M 月包裹量（~90M/year）计算，若假设每包裹平均收入
              $12-16，Veho 当前收入运行率约 $1.1-1.4B——即便面对受限 SAM，渗透率也远低于 10%。这意味着上行空间可观，但 Veho 仍是由既有承运商主导市场中的小份额挑战者。
