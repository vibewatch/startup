  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 劳动分类与独立承包商风险
        blocks:
          - type: paragraph
            body: >-
              Veho 的整个运营模式都建立在一个前提上：将 70,000+
              名司机合作伙伴视为独立承包商，而不是雇员。这既是结构性成本优势，也是公司最关键的单一监管风险。作为独立承包商，司机合作伙伴自备车辆，自行承担燃油、保险和车辆维护成本，也无权获得最低工资、加班费、失业保险、雇主侧
              FICA 缴款、工伤赔偿（多数州）或福利。Veho 通过 Arthur J. Gallagher/Lloyd's 承保方提供可选职业意外险，价格为每预计英里
              $0.0185（从薪酬中扣除），但该保险只是自愿补充，不是法定雇主义务。

              2024 年 1 月 10 日，美国劳工部（DOL）发布 FLSA 最终规则（2024 年 3 月 11 日生效），修订六因素经济现实测试，并废止更偏向承包商的 2021 年 IC 规则。DOL
              将测试改得更整体，也更倾向于把经济上依赖单一用工实体的劳动者认定为雇员。只跑或主要跑 Veho 路线的司机——高频司机常会连续接多个路线——可能被认为对 Veho 存在经济依赖，因此在该标准下构成雇员。

              风险更急的是，2026 年 2 月 26 日，DOL 发布新的拟议规则公告（NPRM，WHD-2026-0001，91 FR 9932），标题明确指向扩大 FLSA、FMLA 和 MSPA
              对零工劳动者的覆盖，征求意见期截至 2026 年 4 月 28 日。若最终落地，该规则会显著提高配送平台被重新分类的风险。California AB5（2020 年 1 月 1 日生效）已采用 ABC 测试；B
              项要求工作必须在雇用实体通常业务之外，Veho 司机几乎肯定无法满足，因此除非有特定豁免或 Prop 22 保护，否则会被推定为雇员。Prop 22（2020
              年公投措施）为基于应用的平台提供狭窄安全港，但其法律稳固性一直在 California 法院受到挑战。

              Indeed 上的司机评价证实，按箱薪酬从约 $2.50–$3.75 降到
              $1.97，路线往往比估计更长，班次供给也很稀缺。司机高流失和不满同时制造直接运营风险（服务质量、准时率）和二阶法律风险：不满的承包商更可能提出错误分类索赔。
            claimRefs:
