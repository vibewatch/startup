      - number: '7.6'
        title: 展示材料
        blocks:
          - type: callout
            title: IC 重新分类是生存级击穿开关
            body: >-
              Veho 的整个成本模型都依赖于把 70,000+ 名司机视为独立承包商。DOL 2024 年最终规则和仍在推进的 2026 年 NPRM，释放出联邦层面越来越想收紧分类标准的信号。若 Veho 司机在 FLSA
              或 California AB5 下被重新分类为雇员，额外成本负担——按行业先例估计为当前司机报酬的
              20–35%——若没有超过市场承受度的同步提价，将构成生存级风险。这是优先级最高的单一尽调事项：在完成任何投资前，取得外部法律顾问对 Veho 面对 2024 年规则和待决 2026 年 NPRM
              具体暴露的意见。
            calloutType: risk
