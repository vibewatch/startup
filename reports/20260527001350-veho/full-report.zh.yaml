      - number: '6.3'
        title: 客户增长与采用轨迹
        blocks:
          - type: paragraph
            body: >-
              无论按什么口径看，Veho 2025 年的客户增长都异常强劲。公司 CEO 在 2025 年末发布博客称，Veho 的新客户上线速度较上年增加两倍，总客户基础增长约
              70%，上半年包裹量翻倍，并实现公司成立以来最强单位经济模型——到年末所有运营区域均实现盈利。公司估计，自 2021 年以来整体包裹量约增长 9×。这些指标由公司声称，未经独立审计；不过，FreightWaves
              2025 FreightTech 100 认可和 Fast Company 2026 Most Innovative Companies 入选，与一家确有运营动能的公司相一致。

              2025 年初至年中，两项平台集成显著扩大了 Veho 可触达客户范围。ShipHero 合作（2025 年 1 月）让已经在 44 个市场使用 ShipHero 仓库管理系统的 5,000 多个品牌可以接入
              Veho。ShipStation 集成（2025 年 9 月）把 Veho 在 56 个市场的触达扩展到 ShipStation
              平台上的大量商户。两项合作都代表伙伴驱动分发，而非直接销售，意味着获客成本更低、扩张更快；但也意味着关系更间接，可能降低 Veho 对终端客户满意度的可见度。

