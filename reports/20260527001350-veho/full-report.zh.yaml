              本章所有美国末端电商市场规模估计都来自可访问公开数据（Census ecommerce、USPS volume、DC360），而非权威市场研究。文中引用了分析师报告，但其底层数据不可访问。SAM 和 SOM
              估计由本分析自行搭建，区间不确定性很宽。投资人应寻求专有市场研究或管理层提供的 TAM 分析。
