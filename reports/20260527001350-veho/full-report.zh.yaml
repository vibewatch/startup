      - number: '4.5'
        title: 财务信息缺口与披露评估
        blocks:
          - type: paragraph
            body: >
              Veho 是一家私营公司，处于私有且未披露财务的披露状态。公开领域没有已审计或未审计财务报表。公司的 SEC 文件仅限于 Form D
              豁免通知，只披露每轮募集资本和发行的一般性质——不包含利润表、资产负债表或现金流数据。


              尽调分析师最想看到的核心财务指标——收入、年经常性收入（ARR）、毛利率、EBITDA、烧钱速度、现金跑道、单位经济模型、CAC、LTV 和净收入留存——在公开来源中完全缺失。Veho
              选择性披露了一些运营指标（包裹量、市场数量、司机数量、客户增长百分比），但这些都无法直接映射到财务表现。在资本密集型物流行业，运营规模是财务健康的必要条件，不是充分条件。


              公开来源中最可操作的财务指标是：（1）累计融资 $300M；（2）上一轮融资后 40 个月空窗（2022 年 2 月至 2026 年 5 月）；（3）2024 年 1
              月裁员被表述为加快盈利的措施；以及（4）2025–2026
              年持续运营扩张（新市场、新枢纽租赁、司机网络增长），这意味着资本仍然可用且正在投放。合起来看，公司似乎在有财务纪律地运营，但尚未达到——或至少尚未确认达到——盈利。


              任何尽调流程都必须直接向公司取得已审计财务、现金流报表、按市场队列拆分的单位经济模型，以及融资现金跑道预测。对于一家运营杠杆很高的物流公司，没有任何代理指标可以替代一手财务数据。
            claimRefs:
