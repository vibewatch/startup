      - number: '1.4'
        title: 运营规模与市场覆盖
        blocks:
          - type: paragraph
            body: >-
              截至 February 2026，Veho 覆盖 66 个美国市场，触达 144 million 美国人（美国人口 44%），高于 2024 年的 44 个市场，YoY 增幅 50%。February 2026
              新开市场包括 Phoenix、Scottsdale、Las Vegas、San Diego、Allentown 和 Athens (GA)，并实现 Los Angeles 大都会区全覆盖。公司同时在
              Phoenix 和 California 的 Ontario 新开两个区域枢纽，合计面积超过 150,000 square feet，靠近主要航空、铁路和港口枢纽，包括 Los Angeles 和 Long
              Beach 港。公司报告每月通过 10 个区域分拣枢纽和 3,000 次卡车运输处理超过 7.5 million 个包裹。

              Veho 网络在美国全国拥有超过 70,000 名独立承包商司机伙伴。公司报告，在 February 2026 前 12 个月内新客户上线数增长 3 倍、包裹量翻倍；据 Fast Company 在 March
              2026 的认可，其客户群 YoY 增长约 70%。Veho 声称的运营指标包括 4.9/5 消费者满意度、99%+ 准时送达率，以及相对传统承运商节省 35%
              全落地成本。这些指标均由公司给出，尚未经过独立审计；要验证需要第三方运营审查。第三方数据库估计年收入约 $31.7 million，但 Veho 不公开披露财务，该数字未经验证。January 2024
              公司裁员后，员工数估计为 700–984 人，覆盖公司和仓库团队。
