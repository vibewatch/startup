  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >
              Veho 的投资逻辑有三根支柱，可能支撑甚至抬高其 2022 年 2 月 Series B 的 $1.5 billion 估值标记。第一，公司身处美国最后一公里包裹配送市场——对应一个年支出超过
              $100B、并随电商渗透率加深而以约 8–10% 年增速扩张的市场。

              第二，Veho 的独立承包商（IC）司机模式和自研调度技术，相比 UPS、FedEx
              的工会化、重资产成本结构，能从结构上降低单包裹配送成本；只要网络密度足以吸收固定分拣中心成本，就能形成持久的单票经济优势。第三，公司已证明持续运营动能：2025 年包裹量较 2024 年翻倍，到 2026 年 2
              月已在 66 个市场达到每月 7.5 million 个包裹，客户基数增长 70%，并拿下 Macy's、Lululemon、Sephora 和 HelloFresh 等重要企业客户。

              反向逻辑同样可信。$1.5 billion 标记由 Tiger Global 和 SoftBank Vision Fund 2 在 2022
              年风险资本市场高点定下——两家此后都在利率上行、成长股倍数压缩中大幅下调私募组合估值。2022 年 2
              月之后，公司未披露新股权融资；四年多没有重估，对这一阶段的公司并不寻常，通常意味着按市场出清价格估值会显著低于这个过期数字。2024 年 1 月公司裁掉 19% 公司员工——管理层明确称为加快“盈利路径”——证实
              Veho 到 2023 年底仍未实现现金流为正，距上一轮融资已超过两年。

              CB Insights Q1 2026 State of Venture 报告显示，全球 VC 交易数量降至 2016 年 Q4 以来最低，并称非 AI
              初创公司估值最多只能获得“温和到持平”涨幅；任何试图重估或新融资的物流科技独角兽都会因此面对结构性逆风。Convoy 是相邻的警示案例：这家物流科技独角兽累计融资 $900 million，峰值估值 $3.8
              billion，却在 2023 年 10 月停止运营。
