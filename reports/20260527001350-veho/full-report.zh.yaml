      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              Veho 已融资约 $300 million 风险资本，跨越多轮；未公开披露债务、老股交易或 Series B 之后的新增股权。Series A 于 December 21, 2021 公布，融资 $125
              million，投后估值 $1 billion，由 General Catalyst 领投，Kyle Doherty 为主投合伙人。该轮让 Veho 成为美国最快达到独角兽状态的物流公司之一。Series B 于
              February 15, 2022 公布——距离 Series A 仅六周——融资 $170 million，投后估值 $1.5 billion（部分来源引用 $1.6
              billion；本章全篇采用更保守、Reuters 当时报道的 $1.5B）。Series B 由 Tiger Global Management 与 SoftBank Vision Fund 2
              联合领投，General Catalyst、Bling Capital、Construct Capital、Industry Ventures 和 Origin Ventures 继续参与。流行组合 The
              Chainsmokers 的风险基金 Mantis VC 也参投。知名天使投资人包括 Allbirds、Flexport 和 Warby Parker 的创始人及 CEO。

              截至 May 2026，Veho 未公开宣布新的机构轮融资，也未公开申请 IPO（未发现 S-1 或注册声明）。公司在 2024 年初称资本位置「非常强劲」，但财务数据未披露，烧钱速度和现金跑道未知。在最近已知
              $1.5 billion 估值下，公司自 2022 年 Series B 后一直处于私有、财务不透明状态。
