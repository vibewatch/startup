      - number: '3.2'
        title: 竞争对手画像
        blocks:
          - type: paragraph
            body: >-
              FedEx（Federal Express Segment）：截至 May 31, 2025，Federal Express 分部约有 440,000 名员工，运营 ~700 架飞机、175,000+ 辆机动车和
              ~63,000 个客户寄件点（包括 15,000+ 家 Walgreens 和 Dollar General 门店）。该板块面向美国大陆 100% 人口提供定日配送，周六覆盖 99%，周日
              覆盖约三分之二美国人口。June 1, 2024 FedEx Ground 并入 Federal Express，形成完整一体化的空地快递网络。FedEx 的 DRIVE program 和 “Network
              2.0” 整合，试图在特定市场签约独立服务商做末端配送，以改善单包裹经济性——这是对技术驱动区域承运商压力的直接回应。September 2024，FedEx 推出
              fdx，一个数据驱动的商业平台，把运输数据整合进客户旅程。住宅递延配送的长期占比提升（收益低于定时效商业件）给 FedEx 带来利润率压力；FedEx 在 FY2025 10-K
              中明确承认这一组合变化是其效率计划的驱动因素。

              UPS：按收入计，UPS 是全球最大包裹配送公司，运营覆盖美国 100% 的全国地面和航空网络。UPS 2021 年收购 Roadie（众包当日达），获得零工经济
              能力，可跨医疗、汽车零部件、电商等多垂直领域配送大件和当日达包裹。UPS 服务最广泛的 B2B 和 B2C 客户，并在所有尺寸分段直接与 FedEx
              竞争。其地面住宅服务按包裹收取住宅和燃油附加费，显著推高高量电商发货方的每包裹成本。

              OnTrac（LaserShip 合并）：LaserShip-OnTrac 于 2021 年完成合并，打造出美国最大的 FedEx 和 UPS 区域承运商替代方案。LaserShip 带来美国东海岸 23 个州和
              60+ 个配送中心覆盖；OnTrac 贡献美国西海岸覆盖。合并后实体于 July 27, 2022 推出横贯大陆配送，并在 2023 年扩入 Texas。到 2026 年，OnTrac 覆盖 35 个州和
              DC，触达约 70% 美国人口。OnTrac 接入 30+ 多承运商软件提供商，同时是 USPS Workshare Partner 和 SmartWay Transport
              Partner。其竞争定位——比全国性承运商低 10-35%，为电商提供次日至两日达——最接近 Veho 的价值主张。OnTrac 技术能力包括 SMS 通知、送达照片证明和视觉送达证明（VPOD），与 Veho
              的 CX 差异化直接重叠。

              USPS Ground Advantage：2023 年推出，用于整合 USPS 住宅包裹服务；可在 2-5 个工作日内配送最高 70 pounds 的包裹，且不收住宅配送附加费。它通过 Click-N-Ship
              提供商业费率，通过 Business Rate Card 提供额外折扣，并为重 / 小件发货方提供立方计价。USPS 普遍 服务义务意味着它配送至每一个美国地址，包括 OnTrac 和 Veho
              不覆盖的乡村邮编地区。对于轻量电商包裹（1 lb. 以下），USPS 往往是最低成本承运商——这是 Veho 每包裹费率无法匹配的结构性成本优势。

              Amazon Logistics（DSP）：Amazon 配送网络围绕 Delivery Service Partner (DSP) 计划搭建，使用签约小企业运营 Amazon 品牌面包车，每天配送数百万
              Amazon Prime 包裹。该网络目前只服务 Amazon 自有包裹，但 Amazon 已表达意向（FedEx FY2025 10-K 中提及），要把物流能力更广泛提供给第三方发货方。Amazon 在 DSP
              计划投入 $1.9 billion（据 About Amazon 报道），并部署 Rivian 电动配送车。如果向第三方开放，Amazon Logistics
              将以无可匹敌的规模、技术和成本位置进入高端电商末端市场。

              Roadie（UPS 子公司）：Roadie 于 2021 年被 UPS 收购，运营全国性众包司机网络，服务当日达和大件配送。覆盖多个垂直领域，包括电商、汽车零部件、药房、工业和航空 行李找回。Roadie
              的当日达能力并不直接竞争 Veho 的次日 / 两日住宅模式，但它代表 UPS 对零工经济配送的对冲，也可能成为进入 Veho 市场的潜在渠道。

              区域承运商（LSO、Dropoff）：Lone Star Overnight (LSO) 是聚焦 Texas 的区域承运商，在 Texas 和 Southwest 市场有 30 年区域存在，主要服务 B2B
              和专业服务客户。Dropoff 是技术驱动的 B2B 当日达快递服务商，在部分美国大都会区运营，聚焦医疗、法律和餐饮服务——需求板块与 Veho 完全不同。两者都不构成 Veho 核心电商末端业务的实质竞争威胁。
