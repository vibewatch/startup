      - number: '6.5'
        title: 客户集中度、依赖风险与关键评估
        blocks:
          - type: paragraph
            body: >-
              Veho 公开披露的客户名单明显偏向高端可选消费零售：Saks Fifth Avenue、Kendra Scott、Lululemon、Nordstrom、Macy's 和 Rent the Runway
              在有名有姓的客户中占比过高。客户集中在可选消费领域，使公司对经济衰退周期有实质暴露；经济下行时，奢侈品和中端服装、时尚品牌通常最先缩量。Veho 未披露收入集中度数据（例如前 5 或前 10
              大客户收入占比），因此公开来源无法精确量化风险严重程度。

              地理集中度风险也与此相连：尽管 Veho 已扩展到 66 个市场，截至 2026 年初，公司在 Denver、Salt Lake City、Kansas City 等 Midwest 和 Mountain
              West 大型都会区存在感很低，削弱了它作为覆盖全美国的品牌主承运商的吸引力。Southeast 和 Texas 市场虽已覆盖，但密度低于 Northeast 和 West Coast 的集中区域。

              另外两项结构性风险值得关注。第一，Veho 的增长模式越来越依赖 ShipStation 和 ShipHero
              带来的合作伙伴分发；如果任一合作伙伴调整承运商集成，客户流失风险就会上升。第二，公司没有公开独立的客户留存率或 NPS 得分，70% 的客户增长率是否可持续无法验证。Veho 2025 年 10 月引用的 150
              个电商品牌调研显示，品牌扩容意愿很强，但此类调研存在响应偏差。

              即便有上述限制，8 个已发布案例、Saks（自 2022 年起）、Hungryroot 和 Sakara Life 等多年客户关系，以及加速上行的包裹量轨迹，合在一起仍构成中到强的证据：Veho 已在高端 DTC
              配送细分市场找到产品市场匹配。表 TU005 汇总了集中度和依赖风险。
