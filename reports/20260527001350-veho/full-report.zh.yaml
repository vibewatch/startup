companyProfile:
  summary: >-
    Veho (Veho Tech, Inc.) 是一家美国技术驱动的末端配送独角兽，2016 年由 Itamar Zur (CEO) 和 Fred Cook (CTO) 在 Harvard Business School
    创立。公司运营自研软件平台和约 120,000 名独立承包商司机伙伴构成的众包网络，覆盖 66 个美国市场，截至 2026 年初触达估计 144 million 美国人（美国人口的 44%）。Veho 只服务高端和中端 DTC
    电商品牌，按包裹收费，不收住宅附加费、周末费，并提供高服务感配送体验。公司通过三轮风险融资累计筹得约 $301M，在 February 2022 的 Series B 达到 $1.5B 独角兽估值，但之后未公开再融股权。Veho 在
