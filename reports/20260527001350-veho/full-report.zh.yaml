      - number: '5.7'
        title: 图表与证据
        blocks:
          - type: callout
            title: ISO 27001 认证与 AWS 架构提供可验证信任锚
            body: >
              Veho 的 ISO/IEC 27001:2022 认证（Schellman，cert #1195292-3，2023 年 7 月）是公司公开披露的少数可独立验证技术信任信号之一。叠加 AWS multi-AZ
              托管、AES/TLS 加密和年度第三方渗透测试，其安全状态明显强于多数零工经济物流同业。在企业发货方采购对话中，安全问卷是标准动作，因此构成真正差异点。
            calloutType: strength
            claimRefs:
              - CE033
              - CE034
              - CE035
          - type: callout
            title: 地理覆盖缺口让 Veho 对全国品牌只能充当部分网络
            body: >
              截至 2026 年 5 月，Veho 的 66 个市场网络覆盖美国人口 42–46%（1.44 亿人）。这迫使全国品牌至少保留一个既有承运商（FedEx、UPS、USPS）服务未覆盖地区，限制了 Veho
              在部分网络使用场景中的可渗透空间。California 是在运营九年后的 2025 年末–2026 年才上线。美国东西海岸贯通覆盖是 2026 年路线图承诺，但能否在所述时间线内达成仍未验证。
            calloutType: risk
            claimRefs:
              - CE039
              - CE009
              - CE044
          - type: callout
            title: 司机应用技术问题与负面评论显示执行风险
            body: >
              多条 Indeed 独立司机评论暴露了反复出现的应用层故障：相机 / 扫描器切换 bug、路线时长低估和付款解决缺口。Trustpilot 评论（3.7/5，1,153
              条评论）显示，负面消费者体验占比并非可以忽略。这些信号与公司 >99% OTD 和 4.9/5 CSAT 的营销主张不一致；在 Veho 按 2026 年扩张计划从 66
              个市场走向全国覆盖时，它们构成实质执行风险。
            calloutType: risk
            claimRefs:
              - CE022
              - CE023
              - CE041
          - type: callout
            title: MaestroAI 是 Veho 核心护城河主张，但缺乏独立验证
            body: >
              MaestroAI 被定位为 Veho 相对传统承运商和零工配送同业在成本、质量和灵活性上的优势来源。但没有专利、学术论文、第三方基准或公开 API 规格来支撑底层算法优越性的主张。Veho
              更可信的竞争护城河来自其运营地理密度和司机市场经济性，而不是任何可证明更优的优化算法。
            calloutType: insight
