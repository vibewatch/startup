  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围与服务架构
        blocks:
          - type: paragraph
            body: >
              Veho 的产品组合覆盖三档品牌化运输服务，叠加在同一套运营基础设施之上。Ground Plus（1–5 日）、Premium Economy（2–8 日）以及旧版次日 / 2 日 Parcel Delivery
              层，服务不同发货方对成本和时效的偏好。2026 年 Q1 推出的 FlexSave™ 附加项，在 Ground Plus 和 Premium Economy 上叠加灵活配送窗口，靠 MaestroAI
              驱动的路线合并释放成本节省。Transportation Solutions 产品处理需要 Veho 从履约中心取货的品牌所需的中段运输和直注。3PL 产品线在推出时已预置
              Flexport、ShipBob、ShipHero 和 Stord 集成，把 Veho 延伸为第三方物流服务商的末端配送层。

              消费者侧，Veho 提供移动追踪应用，让包裹收件人设置配送偏好、上传 Perfect Placement™ 照片（带地理定位标签、与司机应用共享的投递点图片）、接收 4
              小时配送窗口确认，并接入实时真人支持。发货方通过 Veho Pulse Portal 使用分析仪表盘、早期风险提醒、面向客户的理赔门户和账单管理。Veho 发布的 Return on
              Shipping（ROS）计算器追踪品牌在 LTV、退款减少和转化提升上的结果，为发货方提供量化 ROI 框架。

              截至 2026 年 5 月，Veho 服务 66+ 个市场、1.44 亿美国人，并计划到 2026 年底覆盖美国所有主要都市圈，实现美国东西海岸贯通覆盖。该网络轻资产：Veho
              租赁仓库和分拣设施，而非自有；司机合作伙伴提供自己的车辆。第三方报道已将 Sephora、Lululemon、Macy's、Warby Parker、Stitch Fix、Nespresso、HelloFresh
              和 Saks 等品牌列为 Veho 配送客户。
