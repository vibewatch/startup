      - number: '7.5'
        title: 击穿条件、监控触发器与尽调要求
        blocks:
          - type: paragraph
            body: >-
              Veho 有七个会击穿投资逻辑的触发器，覆盖劳动分类规则落地、资本耗尽、竞争流失和运营恶化。监控这些触发器，需要季度投资者更新、监管跟踪，以及第三方司机 /
              消费者情绪监测。尽调优先项是：（1）当前现金余额和月度烧钱速度；（2）确认当前 IC 分类法律策略及任何监管沟通；（3）前 5
              大客户收入集中度；（4）司机流失率和平均单次配送经济性。若拿不到（1）和（3），应视为阻塞性尽调缺口。

              资本风险尤其尖锐，因为 2024–2026 年私募市场环境已较 2021–2022 年高点显著收紧；若新一轮融资以降轮估值完成，会损害独角兽叙事，而独角兽叙事支撑 Veho 招聘人才和赢下企业客户。IC
              重新分类风险具有二元性：如果 Veho 的司机模式在不断演进的联邦或 California 标准下被重新分类，额外劳动成本负担（参照行业先例，估计为当前司机报酬的
              20–35%）在不能同步提价或显著提高效率的情况下，将构成生存级风险。
