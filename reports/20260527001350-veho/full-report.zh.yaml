      - number: '3.5'
        title: 图表
        blocks:
          - type: callout
            title: Amazon Logistics 向第三方开放：关键竞争情景
            body: >-
              Amazon 超过 $600B 的物流网络——FedEx 自身 10-K 已把 Amazon 列为有意向第三方广泛提供配送能力的公司——是 Veho 面临的最高严重度竞争情景。如果 Amazon 向非
              Amazon 电商品牌开放其 DSP 基础设施，它会同时给出更低成本（靠固定基础设施摊销）、更高覆盖（美国 100%）和 Amazon 物流品牌下既有的消费者信任。Veho 的技术差异、CX
              定位和成本主张都会受到实质挑战。任何估值或竞争耐久性评估都应对这一情景给予高权重。
            calloutType: risk
            claimRefs:
              - CP009
              - CP018
              - CP049
          - type: callout
            title: IC 重新分类：成本护城河的结构性威胁
            body: >-
              Veho 和 OnTrac 的定价优势主要来自独立承包商劳动力模式，后者规避了雇主工资税、福利和劳动法保护。California AB5 与 DOL 关于错误分类的执法构成系统性风险：如果 Veho
              的司机合作伙伴被重新归类为雇员，单次配送劳动力成本估计会上升 20-30%，抹去其相对既有承运商节省 35% 的主张，并可能让 Veho 的经济性与 FedEx 或 UPS 住宅配送费率无异。OnTrac
              同样承受这一风险，但已经以雇员为基础的全国既有承运商会在强制重新分类中获得竞争收益。
            calloutType: risk
