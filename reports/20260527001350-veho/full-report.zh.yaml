      - number: '5.5'
        title: 安全、合规与信任状态
        blocks:
          - type: paragraph
            body: >
              Veho 于 2023 年 7 月 27 日获得 ISO/IEC 27001:2022 认证，范围覆盖其包裹配送平台，包括消费者和司机移动应用以及包裹追踪网站。认证由 Schellman & Company
              LLC 签发，后者是 ANAB 和 UKAS 认可的独立审计机构；证书编号 1195292-3 可在 Schellman 公开证书目录中验证。这是该平台少数可独立验证的技术信任锚之一。

              安全项目托管在 AWS 上（美国 multi-AZ、multi-region），静态数据采用 AES 加密，传输中数据采用 TLS。Veho 遵循 Secure SDLC，对新功能使用自动化 SAST
              工具和威胁建模。公司每年开展第三方渗透测试，并对发现项排序、迅速修复。公开 Vulnerability Disclosure Program 允许独立安全研究人员报告漏洞。事件响应遵循 ISO 27035
              协议。所有员工和司机合作伙伴在加入时都接受背景调查。

              一个值得注意的治理观察是：安全由 CFO 层级负责（“Veho 的 Chief Financial Officer（CFO）定期与执行管理层开会讨论问题”），而不是由专职 Chief Information
              Security Officer（CISO）负责。对于一个大规模处理消费者
              PII、地理定位数据、配送访问码和品牌物流数据的平台，这并不常见。政策每年审查，并与所有员工共享。供应商安全评估在合作前完成，之后定期复审。公开资料未披露 SOC 2 鉴证；ISO 27001
              仍是发货方可获得的主要保障材料。

              消费者隐私由 Veho Tech, Inc. 发布的 Privacy Notice 管辖，覆盖联系数据、配送偏好、设备数据、精确位置（需同意）和行为数据的收集。未识别出 GDPR
              适用性或跨境数据传输披露（Veho 仅在美国运营）。司机数据包括位置、收入和配送历史。
