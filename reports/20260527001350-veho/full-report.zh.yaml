      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: IC 分类监管风险是结构性风险，不是猜测
            body: >-
              Veho 相对 UPS/FedEx 的成本优势，很大程度上依赖零工司机模式。California AB5（2019）和 DOL March 2024 FLSA 最终规则都收紧独立承包商标准。若监管或司法认定
              Veho 的 120,000+ 司机伙伴属于雇员，单位劳动力成本会大幅上升，并可能威胁零工承运商 模式经济性。这一风险由所有零工经济末端承运商共同承担（OnTrac 在部分市场使用雇佣司机），但考虑到 Veho
              的规模和对承包商经济性的依赖，其风险尤其尖锐。
            calloutType: risk
            claimRefs:
              - CM032
              - CM033
          - type: callout
            title: 消费者从速度转向成本，打开 FlexSave 机会
            body: >-
              Veho 引用的 McKinsey 数据（2024）显示，配送速度从消费者优先级 #1 降至 #5，95%+ 偏好免费标准配送。这一变化在结构上有利于 Veho 的 FlexSave
              产品（带灵活窗口的收益管理式配送），也可能把 Veho 的竞争位置从速度溢价承运商，转向成本高效的高端承运商——既呼应品牌对免运选择的需求，又不牺牲消费者体验。
