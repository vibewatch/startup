      - number: '4.2'
        title: 资本结构与融资历史
        blocks:
          - type: paragraph
            body: >
              Veho 已在三轮披露融资中累计募集约 $300M 风险资本，均有 SEC Form D 文件佐证。最初的 Form D（2020 年 7 月提交，CIK 0001818785）显示早期种子轮以股权形式募集
              $4.16M。2021 年 12 月 Form D 记录了 General Catalyst 领投的 $127M Series A，使 Veho 跻身独角兽。两个月后，2022 年 2 月 Tiger
              Global Management 领投、SoftBank Vision Fund 2 共同领投的 $170M Series B，将累计融资推至约 $300M，估值 $1.5 billion。


              投资人包括 General Catalyst、Tiger Global Management、SoftBank Vision Fund 2、Bling Capital、Construct
              Capital、Industry Ventures、Origin Ventures 等。Tiger Global（传统上偏成长股权）和 SoftBank（有激进资本投放历史）在 Series B
              参与，说明募资当时投资人按高增长预期定价，并隐含要求公司在 3–5 年内证明通往盈利的路径。


              自 2022 年 2 月 Series B 以来，Veho 未公开披露新增融资。距离上一轮融资已有四年多，且 2024 年 1 月裁员被明确表述为通往盈利路径的措施，因此 Veho
              的现金管理纪律是重要尽调事项。假设初始烧钱速度为每年 $50–100M（与一家约 1,000 人、运营 9 个分拣中心和 48 个末端设施的物流公司相符），并且 Veho 自 2024
              年以来一直在主动压低烧钱速度，则 $300M 融资中的估计剩余现金并不确定——可能在 $50–150M 区间。公开资料没有对当前现金跑道或现金头寸给出独立确认。


              Veho 2022 年 2 月的 $1.5B 估值是在风险投资市场峰值条件下确定的。由于之后没有新一轮融资，这一标记现在已陈旧超过四年，并反映的是一个后来已整体压缩私营估值、尤其压缩物流科技公司估值的市场环境。
