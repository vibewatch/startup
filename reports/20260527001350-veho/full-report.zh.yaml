              Veho 2022 年 2 月的 $1.5B
              估值是在风险投资市场峰值条件下确定的。由于没有后续融资轮重新标记估值，这一数字现在已陈旧超过四年。可比的私营物流科技同类公司（OnTrac、LaserShip/LSO、Ontrac）在二级市场交易中较
              2021–2022 年峰值压缩 40–70%。任何新融资或 M&A 事件都可能触发估值重标；在缺少当前财务数据的情况下，重标方向并不确定。
