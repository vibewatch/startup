      - number: '1.5'
        title: 里程碑、合作伙伴与负面事件
        blocks:
          - type: paragraph
            body: >-
              Veho 快速扩张中穿插一次重大负面事件。公司在 April 2017 赢得 Harvard New Venture Competition，获得 $75,000 奖金和早期验证。在最初 Colorado
              市场打磨数年后，Veho 凭 December 2021 Series A 达到独角兽状态，并在六周后完成 $170M Series B。March 2022，公司完成唯一披露的收购：纽约电商退货初创公司
              QuikReturn，为 Veho Returns 奠定基础。同在 2022 年，Veho 与全球物流平台 Flexport 建立战略合作，并在 Austin, TX 开设第二个旗舰办公室。到 2023
              年夏，公司已扩展至 11 个美国东北部市场（总计 42 个市场），员工约 910 人。

              最实质性的负面事件发生在 January 2024：Veho 裁撤约 19% 公司员工（~65
              个岗位），作为重组的一部分以提高效率并加快盈利路径。在此之前，公司已削减客户和司机支持岗位，并将部分岗位转向离岸团队；The Information（May 2023；付费墙）曾报道此事。同一时期，首席商务官
              Eric Swanson（March 2023）离职，首席营收官 Brian McDevitt 据报道也离开，引发治理和领导层连续性担忧。Deborah Surrette 于 December 2023 被任命为
              CCO。Better Business Bureau 收到 Veho 客户投诉，显示服务问题仍未完全解决。2026 年初，Veho 推出成本优化配送定价产品 FlexSave，并试点 Rivr
              自主配送机器人。March 2026，公司入选 Fast Company World's Most Innovative Companies 榜单。
