      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Veho 的市场有三个不同角色：买方（决定承运商选择的电商品牌或 3PL）、用户（收包裹的消费者）和付款方（支付承运商费率的品牌）。这种三方结构对采用和定价权有重要影响。

              主要买方是中大型高端 DTC 或全渠道电商品牌中的 VP of Supply Chain、Director of Fulfillment 或 Chief Operations Officer。预算归属供应链 /
              物流运营费用。关键选择标准包括：准时送达表现、相对 UPS/FedEx 的每包裹成本、技术集成（API、追踪、异常管理）、对客户满意度的影响，以及地理覆盖。

              用户是终端消费者。McKinsey 调研数据（2024 年，来自 Veho 自有博客引用 WSJ 报道）显示，配送速度从 2022 年消费者优先级 #1 降至 2024 年 #5，运费成为主导因素；超过 95%
              受访者偏好免费标准配送（4-7 天），而不是付费加急。这一变化让市场分成两层：标准配送层成本为王（USPS Ground Advantage、FlexSave 类产品），高端体验层则靠 NPS
              和品牌差异化支撑溢价。

              Veho 案例研究显示买方类型多元：IPSY（美妆订阅）、Kendra Scott（珠宝）、Tuckernuck（时尚）、Saks Fifth
              Avenue（奢侈品零售）、Hungryroot（餐包）、Sakara（食品）以及一家领先运动休闲 品牌。这些买方有共同点：订单价值中高、客户群对 NPS 敏感，并愿意为购买后体验付费，把它当作竞争杠杆。3PL
              平台（Flexport、ShipBob）是重要渠道：3PL 可在其商户客户群中贴牌提供 Veho 服务，无需 Veho 直接销售即可放大触达。

              采用触发因素包括：（1）UPS/FedEx 合同续签周期（通常 1-3 年），（2）承运商服务失败或成本飙升，（3）客户投诉配送体验，（4）竞争品牌用更快 /
              更好配送做营销杠杆带来的压力。切换成本中等：需要与品牌 OMS 和 3PL 集成，也要重新培训运营团队；但 Veho 的技术前置模式和公开 API 降低了这道门槛。集中度风险真实存在：Veho
              的企业品牌客户代表大型、多年期承诺，但如果某个大品牌转移包裹量，也会形成单点流失风险。
