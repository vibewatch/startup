          - type: callout
            title: 四年未融资是资本红旗
            body: >-
              Veho 上一次公开股权融资在 2022 年 2 月完成。2024 年 1 月裁员被明确包装为加快盈利，且截至 2026 年 5 月没有公开盈利公告；与此同时，公司在固定资本基础上运营了 4+ 年，还从约 22
              个市场扩张到 66 个市场，并开设两个大型新枢纽。烧钱速度和现金跑道在公开来源中完全不透明。任何投资承诺前，尽调必须拿到经审计的现金余额和季度烧钱速度。
            calloutType: risk
            claimRefs:
              - CR016
              - CR017
              - CR018
              - CR021
          - type: callout
            title: 将投资绑定在三项尽调阻塞项上
            body: >-
              承诺投资前：（1）取得当前现金余额和月度烧钱速度，并由外部审计验证；（2）取得外部法律顾问对 FLSA 和 AB5 下、针对 Veho 司机合作模式的 IC 分类风险意见；（3）要求披露前 5
              大客户收入集中度和合同条款。若三项中任何一项无法满足，在当前 $1.5B 独角兽参考估值下都应视为不投资信号。
