          - type: callout
            title: 主要替代风险是 OnTrac，不是 FedEx/UPS
            body: >-
              电商品牌评估 Veho 时，最相关的参照不是 FedEx 或 UPS，而是 OnTrac。OnTrac 和 Veho 都覆盖约 70% 的美国人口，都声称相对全国承运商节省 10-35%，都提供无住宅附加费的次日
              / 两日配送，都接入主要多承运商软件，并瞄准同一批高端电商品牌买家。主要差异在于 Veho 的 CX/CSAT 主张（OnTrac 并不强调）以及 OnTrac 借 LaserShip
              积累的更广地理覆盖和企业关系。买家评估 Veho 竞争护城河时，应通过同时用过两家承运商的品牌引用，压测 Veho 相比 OnTrac 能拿到多少增量 CX 溢价。
            calloutType: insight
            claimRefs:
              - CP003
