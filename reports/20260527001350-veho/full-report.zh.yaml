            body: >
              鉴于公开财务数据完全缺失，任何投资或合作决策都必须以直接从 Veho
              取得已审计财务、管理层报告的收入和利润率数据、当前现金流报表，以及按市场队列拆分的单位经济模型为前提。运营增长指标是正面的，但不足以评估财务健康。任何尽调结论之前，至少需要详细审阅数据室中的：（1）2021–2025
              年利润表，（2）各市场单位经济模型，（3）现金余额和月度烧钱速度，以及（4）Tiger Global 和 SoftBank 的投资人权利协议。
