          - type: callout
            title: 收入倍数锚定
            body: >
              如果 Veho 估计 $540–810 million 的年化收入正确，那么公司在过期的 $1.5 billion 估值标记下，约按 1.9–2.8× 估计收入交易——大约是 UPS/FedEx（1.0×）的
              2× 溢价、GXO（0.4×）的 5–7× 溢价。给年增长 50%+ 的挑战者相对成熟在位者 2×
              溢价可以辩护——但前提是增长率真实、利润率在改善。没有披露财务数据，增长率和利润率都无法验证。若估计收入实质更低（例如 $300–400 million），或利润率存在结构性亏损，溢价就没有任何支撑。
