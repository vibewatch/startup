      - number: '7.3'
        title: 财务、资本与商业模式风险
        blocks:
          - type: paragraph
            body: >-
              Veho 累计获得约 $300M 风险资本，最近一轮于 2022 年 2 月以 $1.5B 估值完成。截至 2026 年 5
              月，公司已超过四年没有公开宣布股权融资——对这种资本强度下仍未盈利的风投支持公司而言，这个空窗期异常漫长。2024 年 1 月公司裁撤约 65 名员工（约占公司 / 豁免员工
              19%），管理层明确称这是“加快盈利路径”，直接证实即便 2023 年收入约增长 90%，公司至少到 2023 年末仍未盈利。截至 2026 年 5 月运行日，Veho 仍未公开宣布盈利。

              Veho 的成本结构在车辆端本质上轻资产（IC 模式），但在枢纽基础设施上重资产：公司现运营 10 个区域分拣中心，并在 Phoenix 和 Ontario, California 新开两个枢纽（合计
              150,000+ 平方英尺）。枢纽建设、租赁义务和包裹分拣技术都需要持续资本开支；按件收费的收入模式也制造包裹量暴露——一旦需求受冲击（例如电商放缓、主要客户离开），收入受损会比收入来源更多元的传统承运商更直接。

              若按每年 $50–100M 烧钱速度估算（与约 1,000 名公司 / 运营员工和枢纽基础设施相符），2022 年初 $300M 融资理论上可支撑 3–6 年；但裁员前的 2022–2023
              年可能已消耗大量资本。如果 Veho 尚未在单包裹层面实现贡献利润为正，那么继续以 $1.5B 或更低估值融资，会稀释现有投资者和创始人。IPO
              仍是最可能的退出路径，但需要证明盈利能力；迟迟未上市说明，管理层还没有足以经受公开市场审视的财务画像。
