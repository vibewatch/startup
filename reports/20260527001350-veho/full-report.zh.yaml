  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与组合规模
        blocks:
          - type: paragraph
            body: >-
              Veho 瞄准六个主要垂直领域中的高端和中端 DTC 电商品牌：时尚服饰、美妆个护、食品和餐包、家居生活、健康与保健，以及奢侈品或百货零售。这一客户组合反映 Veho
              的判断：对面向消费者的品牌而言，末端配送质量是收入杠杆，而不是商品化成本。公司的按包裹定价模式让其激励与品牌客户对齐：客户发得越多，Veho 赚得越多，双方共同押注客户包裹量增长。

              截至 2026 年 2 月，Veho 服务 66 个美国市场，触达约 1.44 亿美国人——占全国人口 44%——高于 2025 年初的 44 个市场和约 1.05 亿美国人。Veho 公开披露的客户名单包括
              Macy's、Lululemon、Sephora、HelloFresh、EssilorLuxottica、Stitch Fix、Nordstrom、Rent the Runway、Sakara
              Life、Hungryroot、IPSY、Kendra Scott 和 Tuckernuck。Hartford Business Journal 与 Veho 自身扩张公告还提到 Nespresso 和
              Misfits Market 是客户。ShipStation 2025 年 9 月集成公告称 Macy's、Sephora、Lululemon、Stitch Fix 和 HelloFresh 当时是活跃 Veho
              客户，为披露名单提供了第三方佐证。

              表 TU001 映射主要客户垂直领域。该分层既显示 Veho 当前集中在时尚服饰（估计占包裹量
              30%），也显示其在食品配送、健康和生活方式领域加深渗透的机会——这些垂直领域中，次日可靠性直接影响产品质量，也为高端配送创造结构性更高的支付意愿。
            claimRefs:
