  - id: TR005
    title: 缓释措施与否决标准表
    columns:
      - 风险
      - 可监测触发点
      - 阈值 / 事件
      - 行动含义
    rows:
      - - IC 重新分类 — 联邦 DOL
        - 2026 年 NPRM 最终规则刊登于 Federal Register
        - 规则最终稿扩大雇员身份认定标准，并覆盖基于 App 的配送平台
        - 重新评估估值：为追溯工资索赔增加 $500M–$1B+ 负债；重审投资逻辑
      - - IC 重新分类 — 加州
        - 加州上诉法院就 Prop 22 作出裁决，或 AG 对零工配送平台发起新执法行动
        - 法院否定 Prop 22，或安全港不再覆盖配送平台
        - 测算 CA 司机转为 W-2 后的成本；评估 Veho 能否在 CA 守住正向单位经济
      - - 资本耗尽
        - 到 2026 年 Q3 仍无公开融资公告；或出现可信的现金跑道受限报道
        - 估计现金跑道不足 12 个月（烧钱速度 * 剩余现金）
        - 视为阻断性尽调缺口；承诺出资前要求经审计现金余额
      - - 大客户流失
        - Macy's、Lululemon 或 Sephora 更换承运商的公开公告或经核实报道
        - 前三大客户退出 Veho 或大幅缩减量
        - 根据收入集中度将公允价值估计下调 20–40%；重评增长逻辑
      - - Amazon Buy with Prime 采用激增
        - Amazon 报告 Buy with Prime GMV 超过美国电商交易额的 15%
        - 电商品牌明显减少 Veho 订单量，转向 Amazon 一体化配送
        - 重评竞争护城河；评估 Veho 剩余非 Amazon 品牌关系的防御性
      - - 司机质量崩塌
        - Trustpilot 评分跌破 3.0，或独立测量显示准时率低于 95%
        - 消费者投诉量同比翻倍；品牌客户提到配送投诉
        - 视为运营逻辑破裂；评估司机经济性是否可修复
      - - 技术 / 安全事件
        - 公开披露重大数据泄露或平台宕机 > 24 小时
        - 泄露涉及 >100,000 名消费者的配送地址数据；或服务宕机 >24h
        - 重评 ISO 27001 成熟度；评估监管处罚敞口；衡量客户流失反应
    notes: 阈值是作者基于尽调判断设定的否决标准；不是合同或监管阈值。投资人董事会观察员应按季度监测这些触发点，也可通过谈判取得的信息权契约跟踪。
