      - number: '6.2'
        title: 具名客户证据与公开案例研究
        blocks:
          - type: paragraph
            body: >-
              Veho 已在其网站发布八个详细案例研究，记录美妆、时尚、食品和零售垂直领域中具名及匿名客户的可衡量业务结果。这些构成 Veho
              商业价值主张的主要可验证证据基础；鉴于它们由公司筛选且未经独立审计，评估为中等置信度的客户证明来源。

              最强的已记录结果包括：美妆订阅公司 IPSY 每年配送约 100 万个包裹，达成低于 5% 的配送失败率和 4.8/5 消费者反馈评分。女装零售商 Tuckernuck 于 2024 年春季迁移至 Veho
              后，全口径配送成本降低 35%，客户追踪咨询减少 24%，丢件联系减少 26%。Hungryroot 将客服补偿发放减少 25%，并实现 99% 准时配送；这对易腐生鲜订阅模式至关重要。Saks Fifth
              Avenue 在上线后六个月内把 Veho 覆盖从 8 个市场扩至 25 个以上市场，并在该期间将 Veho 处理包裹量提高 300%。Sakara Life 从 2 个 Veho 市场扩至 14
              个，并将配送错误减少 40%、补偿发放减少 61%。一家未具名维生素补充剂零售商从 6 个市场扩至 25 个，同时保持 99.28% 准时配送率。一家未具名运动休闲品牌在旺季将包裹量翻倍，并将地理配送覆盖提升
              66%。

              奢侈珠宝品牌 Kendra Scott 记录了运费成本降低 2 个百分点；相对于高客单价包裹价值，这代表有意义的节省。Hartford Business Journal 关于 Veho 2023
              年美国东北部扩张的报道独立确认 Saks、Nordstrom、Rent the Runway 和 HelloFresh 是活跃客户，为 Veho 披露的四个最大关系提供第三方佐证。表 TU003
