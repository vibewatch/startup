        - Trustpilot 评论显示仅 AI 支持和司机爽约；规模扩大后质量脆弱；在位者正在加入 photo-POD、Delivery Manager 工具
        - 高
        - 审计 CSAT 方法（托运人侧 vs. 消费者侧）；衡量运营超过 18 个月市场与新市场的满意度差异
      - - 相对全国性在位者节省 35% 成本
        - USPS Ground Advantage 无住宅派送附加费，轻件常常比所有承运商都便宜；OnTrac 也声称节省 10-35%；DRIVE/Network 2.0 压低 FedEx 单位成本
        - 中
        - 要求按匹配货件画像独立基准测试，对比 USPS Parcel Select 与 OnTrac 的成本
      - - AI 路线优势（MaestroAI）
        - OnTrac、FedEx（DRIVE）、Amazon Logistics 都在重金投入路线优化；Veho 的领先没有独立验证；能力差距在缩小
        - 中
        - 要求提供可衡量的 OTD 与单站成本差异，证明差异来自 MaestroAI，并与同一市场的可比承运商对照
      - - 品牌客户集成粘性（Veho Pulse）
        - FedEx fdx、UPS API、多承运商平台（EasyPost、ShipStation）都提供相近的集成深度；使用编排层的品牌切换成本低
        - 中
        - 衡量 Veho 客户运量中，Veho 作为唯一承运商而非多承运商之一的占比；评估合同期限与切换经济性
      - - 零工司机劳动力成本优势
        - California 及其他州存在 AB5 / IC 重新分类风险；DOL 执法活跃；一旦重新分类为雇员，单票成本上升 20-30%+，成本护城河消失
        - 高
        - 评估 CA 当前 IC 诉讼敞口及其他州待决执法；审查司机分类法律结构
      - - 地域覆盖扩张护城河（70 个市场）
        - 全国性承运商已覆盖 100% 美国；OnTrac 已覆盖约 70% 美国人口；Veho 扩张后，覆盖差距收窄，地域优势被削弱
        - 低–中
        - 确定 Veho 全国覆盖达到何种门槛后，会从 OnTrac 的补充选项变成替代选项；评估扩张经济性
      - - Amazon Logistics 仍封闭于 Amazon 货件
        - FedEx FY2025 10-K 确认 Amazon“已表达意向，广泛向第三方提供其内部配送能力”；若落地，Amazon 将以 10 倍规模进入高端电商末端配送
        - 极高（若情景发生）
        - 跟踪 Amazon Logistics 第三方开放公告；评估一旦开放，哪些 Veho 客户会立即符合 Amazon Logistics 条件
      - - 高端品牌定位与客户关系
        - 零工承运商功能趋同，商品化压力上升；品牌采用多承运商策略，降低单一来源依赖；Veho 的品牌客户可以轻松试用 OnTrac
        - 中
        - 调研 Veho 客户的承运商关系是否排他；寻找含终止罚金的长期合同承诺证据
    notes: >-
      严重性评级是基于现有公开证据的主观判断，不来自财务模型。IC 重新分类成本估计（20-30%）基于一般零工经济成本结构分析，不是 Veho 专属数据。Amazon 第三方物流情景具有推测性，但 FedEx FY2025 10-K
