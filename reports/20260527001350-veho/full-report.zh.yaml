      - number: '4.3'
        title: 单位经济模型框架与成本驱动因素
        blocks:
          - type: paragraph
            body: >
              Veho 未公开披露单位经济模型。公司没有发布单次配送成本、毛利率、贡献利润率或任何单票盈利数据。独立分析只能依靠商业模式的结构性推断。


              Veho 模型中最重要的成本优势，是其由 120,000+ 名司机合作伙伴组成的 **独立承包商（IC）司机队伍**。IC 司机按路线而非按小时获得报酬，不享受雇主福利，并自行承担车辆和燃油成本。这个模式与
              Amazon Flex 和 DoorDash 很接近，结构上消除了既有承运商最大的固定成本——员工福利、车队和养老金义务。但它也在 California（AB5 劳工分类）、Massachusetts
              以及其他挑战物流业 IC 错误分类的州带来监管暴露。


              轴辐式基础设施（9 个区域分拣中心，平均约 100,000 sq ft，加上 48 个末端配送设施）是公司的主要固定成本基础。主要都市圈一个 100,000 sq ft 物流枢纽的租赁成本约为 $8–15/sq
              ft NNN（三重净租赁），意味着每个枢纽每年基础租金 $800K–$1.5M。9 个分拣中心加 48 个较小末端设施合计，年度租赁义务可能在 $15–40M。分拣和处理人力（企业和仓库员工，按总计约 1,000
              人员工数估计约 400–600 人）属于随包裹量扩张的半变动成本。


              如果 Veho 相对既有承运商节省 35% 全口径落地成本的说法准确，就意味着其单包裹成本约为 FedEx Home Delivery 或 UPS Ground 住宅配送的 65%。公开的 UPS/FedEx
              Ground 住宅配送 1–2 lb 包裹费率约为每票 $9–14；按 35% 折扣计算，Veho 定价约为每票
              $6–9。这一价格能否产生正贡献利润率，取决于路线密度、司机单路线报酬、枢纽租赁成本和分拣人力——这些均未披露。


              包裹量增长（截至 2026 年 2 月每月 7.5M+
              个包裹，同比增长一倍）说明每名司机和每个枢纽的路线密度正在改善，而这正是末端配送单位经济模型转正的主要驱动。如果包裹量继续放大，单包裹固定枢纽成本下降，单路线司机利用率提高，利润率会改善。
            claimRefs:
