      - number: '7.2'
        title: 监管、法律与合规风险
        blocks:
          - type: paragraph
            body: >-
              除 IC 分类外，Veho 还在联邦机动车承运法规、州劳动法、消费者隐私法以及未来潜在执法行动下承受多层监管暴露。Veho 使用个人车辆运营商业最后一公里包裹配送网络（不是超过 10,001 lb FMCSA
              门槛的商业卡车），因此司机合作伙伴可依据个人车辆豁免，不适用 FMCSA 工时和商业驾照要求。不过，随着 Veho 扩展到更大型车辆路线和区域枢纽间转运——10 个区域分拣中心、每月 3,000+
              辆卡车可以佐证——FMCSA 监管暴露范围也会随之扩大。

              隐私方面，Veho
              收集配送地址、物业通行码、近似生物识别的消费者数据（已送达包裹和门口照片）以及消费者行为信号。其隐私政策披露，公司会与第三方营销伙伴和业务伙伴共享数据，并允许跨情境行为广告。California
              CPRA（2023 年生效）、Colorado CPA、Connecticut CTDPA
              以及类似州隐私法，要求提供退出权、履行数据最小化义务，并可能触发州检察长执法。若消费者配送地址数据发生泄露或被执法，可能带来声誉和财务成本。

              公开法院记录检索（CourtListener、Justia 案卷）未发现针对 Veho 的活跃重大诉讼。不过，公司未发布任何法律登记册或风险因素披露（它是私营公司），也不能把没有公开申报记录解读为没有诉讼。BBB
              投诉记录显示，消费者围绕包裹丢失和误投存在有记录的争议，时间拉长后可能汇聚成小额诉讼或集体诉讼。服务条款包含强制仲裁条款和集体诉讼弃权，能限制集中诉讼暴露，但不能消除风险。
