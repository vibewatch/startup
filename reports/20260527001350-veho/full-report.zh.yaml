          - type: callout
            title: CB Insights 与 Convoy 的反向信号
            body: >
              本章的核心反向证据来自两个第三方数据点。第一，CB Insights Q1 2026 State of Venture 报告显示，全球 VC 交易数量降至 2016 年 Q4 以来最低，并指出非
              AI、非一线公司最多只能获得持平到温和的估值。第二，Convoy——一家资本充足的物流科技独角兽，多轮累计融资 $900 million，峰值估值 $3.8 billion——于 2023 年 10
              月停止运营。Convoy 是数字货运经纪商，不是最后一公里承运商，但它的失败说明，物流科技行业不能让独角兽免受结构性经济问题冲击。

              Veho 尚未盈利且财务不透明，使其落入两个信号共同指向的高风险队列。
            calloutType: risk
