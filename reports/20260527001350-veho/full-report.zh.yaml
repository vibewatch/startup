  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Veho
              位于既有承运商两个弱点的交叉点——成本和消费者体验，并围绕「以更低总交付成本，为电商品牌提供可量化更好的购买后体验」搭建业务。评估竞争韧性时，需要把格局拆成五类：（1）全国性既有承运商，（2）技术驱动的区域承运商，（3）众包当日达平台，（4）自营或潜在新进入者，（5）现状方案和内部自建替代。

              全国性既有承运商——FedEx（Federal Express 分部）、UPS 和 USPS——合计服务 100% 美国住宅人口，但主要在可靠性和网络广度上竞争，而不是消费者体验或品牌契合。FedEx 2025
              财年年报（July 2025 提交的 10-K）明确把「结合技术与众包、聚焦本地市场需求的初创公司」列为竞争类别，验证 Veho 对其住宅包裹量构成威胁。FedEx 自身 DRIVE program 和
              Network 2.0 initiative——在 ~290 个美国和加拿大地点签约独立服务商 做末端配送——表明既有承运商开始采用 Veho 率先推行的零工承运商模式。

              最直接的同业威胁来自 OnTrac，这家承运商由 LaserShip（美国东海岸）和 OnTrac（美国西海岸）在 2021-2022 合并形成。截至 2026 年，合并后实体覆盖 35 个州和 District
              of Columbia，触达约 70% 美国人口，并明确瞄准与 Veho 相同的高端电商品牌客户，声称价格比全国性承运商低 10-35%。OnTrac 互补的覆盖足迹和相似零工司机模式，使其成为买方采购决策中
              Veho 最直接的替代品。USPS Ground Advantage 于 2023 年推出，取消 FedEx 和 UPS 收取的住宅配送附加费，并在构成 Veho
              大部分包裹量的高量、低重量住宅包裹板块激进按价格竞争。

              Amazon Logistics 仍是最大的结构性不确定因素。目前该网络仅服务 Amazon 自有包裹，但 Amazon 的 DSP（Delivery Service Partner）网络已在其 FedEx
              10-K 竞争文件中表达过意向，要把内部能力更广泛提供给第三方。如果 Amazon 向非 Amazon 品牌开放物流平台，它将以成本、技术和规模优势进入 Veho 市场，Veho
              很难正面抵挡。众包当日达平台（Roadie，2021 年被 UPS 收购）处在相邻但不同的位置——跨多垂直领域为大件或时效敏感物品提供当日达——尚不能直接替代 Veho 的次日 /
              两日住宅包裹模式。现状替代方案（多承运商 UPS/FedEx 策略或内部车队）对已有承运商关系的品牌仍然可行，也是品牌不采用 Veho 的最常见原因。

              CB Insights 统计有 95+ 家公司在末端配送领域持续创新，说明市场拥挤。不过，竞争强度集中在少数可信且规模化的替代方案：OnTrac、全国性既有承运商和
              Amazon。长尾小型区域承运商（Texas/Southwest 的 LSO、B2B 当日达的 Dropoff）处在远离 Veho 核心市场的细分位置。
