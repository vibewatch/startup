      - number: '1.2'
        title: 创始人与领导层
        blocks:
          - type: paragraph
            body: >-
              Veho 由 Itamar Zur (CEO) 与 Fred Cook (CTO) 共同创立。Zur 2016 年在 Harvard Business School
              把公司做成课堂项目，动因是自己作为依赖电商的学生，反复遭遇包裹配送失败。创办 Veho 前，Zur 曾任职于 monday.com 和 Procter & Gamble，并持有 Harvard Business
              School MBA。Cook 是联合创始人兼首席技术官，负责 Veho 的自研技术平台；其过往背景未公开详细披露。The Heights (Boston College) 的一篇 2017
              年新闻提到，早期还有一位名为「Graham」的联合创始人与 Zur 并列；这暗示公司早期发生过联合创始人变动，也与创始人访谈中提到的「联合创始人散伙差点杀死公司」相符，但具体时间和原因未公开。

              高管层方面，Deborah Surrette 于 December 2023 被任命为首席商务官，接替 March 2023 离职的前 CCO Eric Swanson。TechCrunch 报道称，Brian
              McDevitt 至少任职首席营收官至 2023 年中，之后也已离开。Series B 后，公司在 2022 年末引入 Eric Swanson 和 McDevitt 搭建领导层；两人入职 12
              个月内离开，释放潜在组织不稳定信号。Zur 一直是 Veho 稳定的公开代表，也是所有媒体报道中与公司绑定最深的人。由于完整董事会和高管团队构成信息有限，关键人风险为中到高。
