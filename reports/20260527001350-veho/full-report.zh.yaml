  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              Veho
              所处市场是美国国内末端包裹配送，具体是服务高端和中端直面消费者（DTC）电商品牌的子板块。「末端配送」指包裹旅程最后一段：从区域分拣枢纽或配送中心送至消费者住所或商业地址。按行业惯例，它是供应链中成本最高、运营最复杂的一段，估计占总物流支出的
              40-53%。

              就 Veho 而言，市场边界包括：（1）电商订单的住宅包裹配送，主要是 70 lbs 以下的小包裹；（2）次日至 10 日的配送窗口；（3）服务非 Amazon 电商品牌、3PL
              和履约伙伴的承运商。明确排除：Amazon 网络包裹（外部承运商无法承接）、大件或白手套家具 / 家电配送、B2B 货运和工业运输、邮件（First-Class 和 Marketing）、生鲜 /
              易腐杂货配送，以及国际包裹。

              多数发货方的现状选择是在 UPS、FedEx、USPS Ground Advantage 和 OnTrac（LaserShip + OnTrac 合并网络）等区域承运商之间拆分。Veho
              市场定位的关键洞察是，高端电商品牌——客户群重视 NPS、复购频率高——在体验质量、技术透明度和总落地成本的组合上被既有承运商服务不足。围绕核心市场的相邻机会包括退货物流、上门取件和 3PL
              平台渠道（Flexport、ShipBob）；Veho 已开始服务这些场景，未来可扩大可服务机会。

              美国市场在次全国层面高度分散：UPS 和 FedEx 主导全国包裹量，但在郊区住宅末端配送中，密度和技术差异化有限。USPS Ground Advantage（企业价格 $5.09/parcel
              起）提供低成本底线，压制承运商定价。Amazon Logistics 的包裹量已成长到可与 UPS 抗衡，但仍以内需为主；悖论在于，Amazon
              证明自有配送网络能提供更好的电商体验，反而为第三方末端配送专业公司打开了空间。
