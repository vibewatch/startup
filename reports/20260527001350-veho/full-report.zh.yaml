      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 过期独角兽估值标记，没有重新锚定
            body: >
              2022 年 2 月的 $1.5 billion 估值，是本分析中最重要的单一数字，也是问题最大的数字。它由两家投资者（Tiger Global 和 SoftBank Vision Fund 2）在
              2021–2022 年风险投资超级周期顶点定下，而两家此后都对投资组合做了大规模减记。四年多没有新一轮融资——在晚期公司通常每 18–24
              个月融资一次的环境中——是一个有意义的反向信号。最常见的解释有三种：（a）公司已盈利并能自我融资；（b）管理层认为新估值会低于上一轮价格；或（c）公司有意推迟融资以避免降轮。其中，（a）与 2024 年 1
              月裁员不一致；（b）和（c）都不利于现有投资者。
            calloutType: risk
