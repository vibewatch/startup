      - number: '5.4'
        title: 面向消费者与发货方的产品功能
        blocks:
          - type: paragraph
            body: >
              Veho 的消费者产品用实时真人支持（真人短信支持，不是 AI 聊天机器人）、配送控制功能（改期、改址、配送指示、Perfect Placement™
              照片上传）以及带地理定位的投递证明照片确认，与传统承运商拉开差异。4 小时配送窗口确认系统会提醒收件人较窄的到达窗口，减少错过配送。Veho 消费者应用还支持 2023 年推出的 Perfect
              Placement™ 功能来缓解包裹盗窃风险，该功能从客户提供的照片中提取经纬度，并为司机合作伙伴钉住精确投递位置。

              对发货方而言，Veho Pulse Portal 提供实时货件可视性、早期风险标记和分析。API 集成层承诺数天而非数周完成上线，并包含连接主要电商和 3PL 平台的预置连接器。Veho 网站上有来自
              Tuckernuck（运输成本降低 35%，丢件支持来电减少 26%）、IPSY、Kendra Scott 和 Saks 的面向客户案例研究，但底层数据为自报，未经独立审计。

              Veho 推广的品牌影响指标包括复购率提高 20%、客户终身价值（LTV）增长 40%、NPS 提升 8%，以及积分 / 退款减少 71%。这些都是公司声称的汇总统计，未披露方法论、样本量或时间范围。The
              Manifest 2026 关于 EssilorLuxottica 的案例研究提到 AI 技术帮助发货方在不牺牲体验的情况下降低运输支出，但没有披露具体指标。Veho 网站上的 Return on
              Shipping（ROS）框架显示，品牌合作伙伴平均运输成本降低 35%、LTV 提升 41%、首年平均包裹量增长 288%。
