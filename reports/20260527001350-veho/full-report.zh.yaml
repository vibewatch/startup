      - number: '8.2'
        title: 估值背景与上市可比公司
        blocks:
          - type: paragraph
            body: >
              Veho 没有直接上市可比公司——它是一家尚未盈利的私营最后一公里配送初创公司。最接近的上市代理是重资产在位者（UPS 和 FedEx）以及纯合同物流运营商 GXO Logistics。截至 2026 年 5
              月，UPS 交易价格约为过去十二个月收入的 1.0×（市值 $86.7 billion，对应 TTM 收入 $88.3 billion），EBITDA 约 7.7×；FedEx 同样约为收入 1.0×（市值
              $95.4 billion，对应 TTM 收入 $91.9 billion），按债务调整后的企业价值口径，EBITDA 约 10.5×。GXO Logistics 作为更纯粹的合同物流公司，收入倍数约
              0.4×（市值 $5.5 billion，对应 TTM 收入 $13.2 billion），仅按市值口径，EBITDA 为 8×。

              上述倍数来自成熟、大盘、基本重资产且增长很低的运营商。像 Veho 这样的高增长挑战者理应有明显溢价——年增长 50%+ 的初创公司通常可给 2–5×——但任何倍数都需要披露收入来锚定。Veho
              未公开披露收入。按每月 7.5 million 个包裹、估计每包裹平均收入 $6–9 推算，截至 2026 年 2 月，收入运行率约为年化 $540–810 million。若相对 UPS/FedEx 给 2×
              市销率溢价（即高增长最后一公里承运商按 2.0× 收入估值），Veho 的估计收入区间对应约 $1.1–1.6 billion 估值——大体与 2022 年 $1.5 billion
              标记一致，但依赖未经验证的收入假设。若使用更保守的 GXO 倍数（0.4× 收入），隐含价值降至 $220–325 million。不确定区间极大。

              私募市场背景下，LaserShip 和 OnTrac 于 2021 年 9 月合并，组成美国第三大区域包裹网络，但仍为私营公司且未披露估值。CB Insights 的独角兽减记追踪器识别出 2022 年以来超过
              130 家确认降轮或估值下调的独角兽；物流和供应链是受冲击最重的行业之一。自 2021 年高点以来，整体 VC 市场压缩侵蚀了许多物流独角兽估值赖以成立的溢价倍数。
