        - label: 月度包裹量
          value: 7.5M+
          note: 截至 2026 年 2 月；较 2024 年翻倍
        - label: 市场覆盖
          value: 66 markets
          note: 1.44 亿美国人，约占美国人口 44%
        - label: 司机网络
          value: 120,000+
          note: 截至 2026 年 2 月；8 个月增长 43%
        - label: 距上一轮月数
          value: 40+
          note: 2022 年 2 月后未披露新股权融资
        - label: 盈利状态
          value: Pre-profit
          note: 2024 年 1 月裁员，被表述为走向盈利
        - label: 估算跑道
