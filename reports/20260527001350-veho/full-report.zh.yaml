chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Veho（法律实体：Veho Tech, Inc.）是一家技术驱动的末端包裹配送公司，2016 年成立，产品按电商品牌的需求设计。联合创始人兼 CEO Itamar Zur 在 Harvard Business
              School 读书时频繁遇到配送失败，于是把 Veho 做成课堂项目。Veho 的核心判断是，末端配送过去常被当作商品化成本中心，但它可以成为品牌差异化杠杆，推动客户留存、复购和
              LTV。公司借助自研物流软件，把电商发货方接入独立承包商司机伙伴网络；截至 February 2026，Veho 在 66 个美国市场提供次日和两日达，触达 144 million 美国人（美国人口 44%）。

              Veho 的商业模式是向电商品牌客户按包裹收费。公司运营区域包裹注入和分拣枢纽网络（截至 2026 年为 10 个），每月通过 ~3,000
              次卡车运输协调中段运输，再把末端配送派发给司机伙伴网络。技术栈包括客户门户 Veho Pulse，用于实时异常追踪；面向消费者的工具则支持改约、地址变更、实时司机追踪和照片确认。Veho 声称相较既有承运商可节省
              35% 全落地成本，同时消费者满意度为 4.9/5，并将自身定位为「美国最以客户为中心的包裹配送平台」。截至 2026 年，核心品牌客户包括
              Macy's、Lululemon、Sephora、EssilorLuxottica、HelloFresh、Misfits Market、thredUP、Kroger、Saks Fifth
              Avenue、Nordstrom、Nespresso、Rent The Runway 和 Stitch Fix。公司主要办公室位于 New York City 和 Austin, TX。
