  - id: FV002
    title: 估值对 P/S 倍数的敏感性（收入中点估算 $675M）
    type: bar
    layout: wide
    summary: 以 $675M 的收入中点估算套用不同市销率倍数，推导 Veho 隐含估值（百万美元），并以过期的 $1.5B 估值作参照。
    data:
      items:
        - label: 0.4× P/S——GXO 同行倍数
          value: 270
          unit: $M
        - label: 1.0× P/S——UPS/FedEx 同行倍数
          value: 675
          unit: $M
        - label: 2.0× P/S——较同行 2× 增长溢价
          value: 1350
          unit: $M
        - label: 2.2× P/S——过期估值等价倍数（$1.5B / $675M）
          value: 1500
          unit: $M
        - label: 3.0× P/S——高增长溢价
          value: 2025
          unit: $M
        - label: 4.0× P/S——牛市情景峰值
          value: 2700
          unit: $M
    approximationNotes: |
      收入估算 $675M 是作者测算区间的中点（按每月 7.5M 件、每件 $6–9 得出 $540–810M）；Veho 未披露收入。P/S 倍数来自截至 2026 年 5 月的公开可比公司分析（UPS、FedEx、GXO）。
