  - id: FR002
    title: 风险传导图——Veho 头部风险如何传导至投资人结果
    type: dag
    layout: wide
    summary: 有向因果图展示 IC 重新分类、资金约束和运营失误如何穿过 Veho 业务链条，影响收入、利润率和估值。
    data:
      nodes:
        - id: ic-risk
          label: IC 重新分类风险
          detail: DOL 2024 规则 + 2026 NPRM
        - id: capital-risk
          label: 资金 / 跑道风险
          detail: 2022 年 2 月后未再融资；还未到盈利阶段
        - id: driver-attrition
          label: 司机流失
          detail: 降薪；班次稀缺；Indeed 负面评价
        - id: competitive-risk
          label: 竞争替代
          detail: Amazon Buy with Prime；FedEx/UPS 重组
        - id: cost-model
          label: 成本模型受冲击
          detail: 改按雇员分类会让司机成本增加 20–35%
        - id: revenue-risk
          label: 收入风险
          detail: 客户流失；件量下降；市场份额被蚕食
        - id: margin-risk
          label: 利润率风险
          detail: 毛利率被挤压；贡献利润率为负
        - id: funding-risk
          label: 降价轮 / 无融资风险
          detail: 盈利路径推迟，削弱投资人信心
        - id: valuation-risk
          label: 估值减损
          detail: 低于 $1.5B 独角兽参照；降价轮
      edges:
        - from: ic-risk
          to: cost-model
          label: 重新分类抬高司机成本
        - from: driver-attrition
          to: revenue-risk
          label: 服务质量下滑 → 客户流失
        - from: competitive-risk
          to: revenue-risk
          label: 客户转向 Amazon / 既有物流商
        - from: cost-model
          to: margin-risk
          label: 变动成本上升 → 利润率被挤压
        - from: revenue-risk
          to: margin-risk
          label: 件量下降 → 固定成本摊薄变差
        - from: margin-risk
          to: funding-risk
          label: 盈利路径推迟 → 融资缺口
        - from: capital-risk
          to: funding-risk
          label: 跑道耗尽，迫使公司接受不利融资
        - from: funding-risk
          to: valuation-risk
          label: 降价轮或困境信号
    approximationNotes: 因果链是作者基于公开证据推断；未量化边权重和时间跨度。
    claimRefs:
      - CR001
      - CR016
      - CR019
      - CR027
      - CR031
  - id: FR003
    title: Veho 关键依赖图（2026 年 5 月）
    type: dag
    layout: wide
    summary: 依赖图展示 Veho 的关键单点故障：AWS 云、IC 司机池、企业客户集中度和投资人资本。
    data:
      nodes:
        - id: veho-platform
          label: Veho 平台
          detail: 路线优化、Veho Pulse、司机应用、消费者追踪
        - id: aws
          label: AWS（独家 IaaS）
          detail: 托管在美国；多 AZ；ISO 27001 认证
        - id: driver-pool
          label: 70,000+ 名 IC 司机
          detail: 独立承包商；自愿保险；弹性排班
        - id: hub-network
          label: 10 个区域枢纽
          detail: Phoenix、Ontario CA、East Hartford 等；租赁设施
        - id: top-clients
          label: 前 5–10 大品牌客户
          detail: Macy's、Lululemon、Sephora、HelloFresh；贡献大部分件量
        - id: gc-tg-sbvf
          label: 投资人资本（GC / Tiger / SBV2）
          detail: ~$300M 总融资；上一轮为 2022 年 2 月
        - id: rivr-berkshire
          label: RIVR / Berkshire Grey（技术伙伴）
          detail: 机器人联合开发；IP 条款未披露
        - id: shiphero
          label: ShipHero（集成伙伴）
          detail: WMS 集成；可触达 5,000 个电商品牌
      edges:
        - from: aws
          to: veho-platform
          label: 独家托管依赖
        - from: driver-pool
          to: veho-platform
          label: 配送执行层
        - from: hub-network
          to: driver-pool
          label: 包裹注入与分拣
        - from: top-clients
          to: veho-platform
          label: 收入与件量来源
        - from: gc-tg-sbvf
          to: veho-platform
          label: 运营与扩张资本
        - from: rivr-berkshire
          to: hub-network
          label: 枢纽自动化机器人技术
        - from: shiphero
          to: top-clients
          label: WMS 到 Veho 的渠道集成
    approximationNotes: 依赖强度为定性判断；未量化边权重。ShipHero 集成基于 2025 年 1 月的合作公告；RIVR 条款未公开披露。
    claimRefs:
      - CR010
      - CR014
      - CR025
      - CR028
      - CR035
  - id: FV001
    title: 建议逻辑流
    type: flow
    layout: standard
    summary: 从证据输入到「跟踪」建议的决策树，突出关键约束。
    data:
      nodes:
        - id: A
          label: 运营证据
          note: 2025 年件量翻倍；66 个市场；客户增长 70%
        - id: B
          label: 财务不透明
          note: 未公开收入、利润率或现金数据
        - id: C
          label: 估值锚
          note: $1.5B 估值标记，2022 年 2 月（已过期 4+ 年）
        - id: D
          label: 市场环境
          note: 2026 年 Q1 VC 交易数为 10 年低点；非 AI 估值承压
        - id: E
          label: 可比公司倍数
          note: 上市同行为 0.4–1.0× 收入；未确认增长溢价
        - id: F
