      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              几股结构性力量支持 Veho 这类玩家在末端配送市场继续增长。第一，电商渗透率仍在提升：按 Commerce Dept 方法，Q1 2026 电商占美国零售总额 16.9%；按 DC360 调整口径为
              23.1%。电商从未出现年度下滑，且每年增长 5-10%。Amazon Q1 2026 单量 YoY 增长 15%，为后 COVID 正常化以来最高，显示包裹量正在重新加速。第二，Amazon
              持续扩张当日达和一小时达，正在抬高消费者预期——非 Amazon 品牌必须在便利性上追平，或在体验上差异化，两者都需要投入高端末端配送。第三，品牌自有 DTC 渠道相对 Amazon
              市场平台的长期趋势提高了发货方独立性，也让承运商关系更需要反映品牌本身。

              四个实质约束和负面信号需要尽调。第一，2025 年电商增长放缓至 5.4%，为 Great Recession 以来第二低（仅 2022 年 4.9% 更低），说明 COVID 时期加速后正在正常化。GMV
              放慢会直接传导为包裹量增长放慢、承运商切换活动减少。第二，消费者偏好已明确转向免费标准配送：McKinsey 数据显示 95%+ 偏好免费 4-7 天配送而非付费加急，WSJ March 2026
              报道也指出，履约成本上升使零售商撤回免运承诺。这带来利润率压力：品牌要求更低每包裹费率，而 Veho
              成本结构很大程度上是固定的（司机报酬、燃油、枢纽运营）。第三，独立承包商分类风险是结构性的。California AB5（2019）对 IC 身份施加严格 ABC 测试；US DOL March 2024 最终
              FLSA 规则在全国收紧 IC 标准。如果 Veho 的 120,000+ 司机伙伴转向雇员分类，单位劳动力成本会显著上升。第四，伊朗冲突 和油价波动带来的宏观不确定性（Brent 原油 April 2026
              曾升至 $112/barrel 后回落）可能压制消费者支出并推高燃油成本，同时挤压 GMV 增长和承运商利润率。

              从竞争约束看，OnTrac（LaserShip + OnTrac 合并）自称「首个横贯大陆、专注末端电商配送的首选承运商」，服务相似的高端电商板块，并拥有东西海岸网络覆盖。USPS Ground
              Advantage 的 $5.09/parcel 是持续存在的低成本底线，限制高端承运商的提价空间。这些力量叠加意味着，Veho
              必须让包裹量和地理密度增长快过成本基数，才可能达到并守住盈利——这是一场仍在进行的资本密集竞赛。
