      - number: '7.4'
        title: 运营、服务质量与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Veho 自称 4.9/5 CSAT、99%+ 准时交付率，但上述指标与第三方评价信号存在明显张力。Trustpilot 显示截至 2026 年 5 月有 1,153 条评价，均分
              3.7/5；相当一部分负面评价记录了反复出现的模式：包裹显示已送达但实际未收到、用不匹配包裹的照片作为送达证明、因“技术错误”把包裹发往相隔数州的错误方向、晚上 11:45
              向商业地址尝试派送。Jacksonville, FL 实体的 BBB 投诉数据也显示，在三年报告窗口内存在有记录的包裹丢失和误投消费者争议。

              近端风险来自司机质量。Indeed 评价显示，按箱薪酬从 $2.50–$3.75 降至约 $1.97，路线经常低估驾驶时间（5 小时路线排成 4 小时），班次供给严重受限（班次“发布后 1
              分钟内就消失”），司机流失率偏高。仓库运营被形容为“98% 的时间人手不足”。Veho 进入司机密度和运营经验更低的新市场时，上述条件会制造服务质量下滑的结构性风险。

              Amazon 激进扩建物流网络，使竞争风险升高。Amazon 现在估计通过自有物流网络（Amazon Logistics）配送其美国包裹量的 40%+，并借助“Buy with Prime”（用 Amazon
              Logistics 履约和配送）主动争夺第三方电商品牌。FedEx 和 UPS 已重组住宅配送网络，并用新的费率结构瞄准电商 SMB 客群。Veho
              从区域承运商走向全国承运商时，会从补充运力转为主承运商，正面竞争的对手拥有 50+ 年路线密度、司机关系和品牌信任。技术复制风险为中等——Veho 自研路线优化和 Veho Pulse 客户门户是差异点，但
              Amazon、FedEx、UPS 都不缺工程资源来缩小技术差距。
