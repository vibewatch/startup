      - number: '3.3'
        title: 功能、能力与定价对比
        blocks:
          - type: paragraph
            body: >-
              Veho 与 OnTrac 在高端电商品牌所需功能集上最接近：次日和两日住宅配送、送达照片证明、消费者实时追踪、面向消费者的改约工具，以及多承运商软件的 API 集成。两者都声称价格低于全国性既有承运商。Veho
              引用的主要竞争差异化是消费者体验分数（4.9/5 CSAT、99%+ OTD）和 MaestroAI 驱动的 AI 路由；公司认为，这能以显著更低的总交付成本提供更好服务。OnTrac 的反击点是更广覆盖（35
              个州 vs. Veho 截至 April 2026 的 70 个市场）、来自 LaserShip 历史的更强企业关系，以及 USPS Workshare 合作带来的农村触达能力，这是 Veho 缺失的。

              定价方面，市场大多不透明。Veho 和 OnTrac 都不公布标价；两者均与电商品牌按合同谈判。全国性承运商（FedEx、UPS）公布费率，但会叠加住宅和燃油附加费，显著抬高高量电商发货方的总每包裹成本。USPS
              Ground Advantage 公开列出商业费率且不收住宅附加费，因此成为轻量包裹的成本基准。Veho February 2026 推出的 FlexSave
              产品引入灵活配送窗口选项，让品牌以速度确定性换取更低每包裹成本，在定日服务和标准包裹配送之间创造新的定价层。

              FedEx One Rate 定价（加急服务统一费率）及其面向高量住宅包裹的经济型服务，定位于 Veho 不服务的分段（加急、超过 2 天配送）。FedEx fdx 平台和 Delivery Manager
              消费者工具越来越像 Veho Pulse 平台和消费者改约功能，随时间推移会缩小技术差异化。所有技术驱动承运商的功能集正在趋同——送达照片、SMS 通知、改约、API 集成——这是长期商品化信号，Veho
              必须靠更深的品牌集成或网络密度优势应对。

              消费者评价数据释放出实质负面信号：2026 年 Veho 的 Trustpilot 评论记录了多起包裹丢失、仅 AI 聊天机器人客服（没有人工电话线）和司机行为问题。一位评论者明确写道：「Veho
              没有真正的人与人客服，也没有客服热线。他们用 AI 短信和邮件。」如果 Veho 的 4.9/5 CSAT 主要来自发货方（品牌）满意度，而非消费者满意度，这就在 CX
              叙事和真实配送体验之间制造缺口——而这正是既有承运商过去常用来压制挑战者承运商的缺口。
