            body: >
              Veho 司机应用是 120,000+
              名独立承包商司机合作伙伴的运营骨干。司机登录应用后浏览路线、查看预期收入、选择开始时间和路线时长，并按班次接受工作。应用引导司机完成仓库取件、包裹扫描、导航、拍照确认投递和客户沟通。司机评分按最近 100
              次客户评分配送的滚动平均值计算，采用 1–5 分制；低于最低标准会触发平台停用。

              Veho 每周两次通过直接存款向司机付款（处理延迟 2–3 个工作日）。通过 Arthur J. Gallagher 和 Lloyd's of London 若干承保方提供的 Occupational
              Accident 保险计划，按 $0.0185/mile 提供每英里保障，并从司机报酬中自动扣除。路线设计时长为 2–6 小时，司机在接受前可看到预期收入。平台目前托管 Instant Cashout
              功能（在站点地图中可见，但公开文档不完整）。

              Indeed 评论中的反向证据（135 名受访者）显示司机反复抱怨：应用导航 bug、相机与扫描器切换不可靠、路线耗时显著长于估计（一名司机报告 7 小时路线实际超过 12
              小时），以及至少一例未付路线且没有解决渠道的报告。消费者 Trustpilot 评论（3.7/5，1,153 条评论）提到包裹丢失 /
              错投、脚本化客服回复和包裹路线错误。这些信号说明司机体验摩擦和运营可靠性缺口具有实质性，公司宣传的 >99% OTD 无法完全代表单票货件和司机层面的情况。

              Veho 在其 66+ 市场网络中运营 9 个区域分拣配送中心和 48 个末端配送设施。2026 年 2 月西部扩张新增 Phoenix（AZ）和 Ontario（CA）两个区域枢纽，合计超过 150,000
              平方英尺，靠近主要航空、铁路和港口枢纽。所有司机合作伙伴都接受背景调查。
