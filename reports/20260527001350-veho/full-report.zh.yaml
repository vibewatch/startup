      - number: '6.4'
        title: 客户留存、满意度与服务质量
        blocks:
          - type: paragraph
            body: >-
              Veho 由公司声称的留存和满意度指标很强：准时配送率 99%，品牌客户平均客户满意度评分 4.9/5；据称客户平均实现消费者终身价值（CLV）提升 41%，相对既有承运商全口径配送成本降低 35%。Veho
              还称，在双方共存的市场中，其包裹平均比传统承运商快 1.3 天送达。这些指标来自 Veho 公司出版物和 ShipStation 集成公告，代表 B2B CSAT——即品牌客户满意度——而非终端消费者评分。

              反向信号具有实质性：截至 2026 年初，Trustpilot 基于 1,153 条消费者评论给 Veho 3.7/5（“Average（一般）”）评分，其中 1
              星评论明显集中，提到错投、包裹被运到错误仓库或地址、司机拍摄错误包裹照片，以及客服被描述为反应迟缓或无帮助。这些是终端消费者评论，Veho 的品牌客户很可能通过自身客服层过滤这些问题。但 4.9/5 B2B
              CSAT 与 3.7/5 消费者 Trustpilot 评分之间的背离值得审视，并说明配送失败事件一旦发生，可能没有得到充分解决，从而在下游侵蚀品牌客户 NPS 分数。Veho 运营的 BBB 投诉记录与
              Trustpilot 信号一致。

              Veho 2024 年 1 月裁掉约 19% 企业员工，集中在支持和管理费用职能，这引发一个问题：客服容量是否跟上了 2025 年报告的极快包裹量增长。表 TU004 汇总关键满意度和留存指标。图 FU004
              基于公开引用的长期客户关系，按细分估算客户队列随时间推移的留存百分比。
