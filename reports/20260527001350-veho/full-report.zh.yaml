      - number: '8.4'
        title: 退出路径与最终尽调框架
        blocks:
          - type: paragraph
            body: >
              Veho 及其投资者有三条退出路径。**战略并购**是近期最可能的路径：UPS 和 FedEx 都在执行网络精简策略，并已表现出收购最后一公里技术公司的兴趣（UPS 于 2021 年收购 Roadie）。Veho
              的 66 个市场覆盖、120,000+ 司机网络和企业客户基础（Macy's、Lululemon、Sephora）构成现成的独立最后一公里能力，任一承运商都可以吸收。$1.0–2.0 billion
              区间的交易具有可能性；不过，UPS 和 FedEx 都未公开释放针对 Veho 的并购兴趣。鉴于 Amazon 有与之竞争的 Delivery Service Partners（DSP）计划，Amazon
              成为买家的可能性较低，但不能排除其作为防御性收购方。


              **IPO** 是中期路径，前提是盈利。按当前未盈利状态，公开发行会在单元经济性上受到重大审视；在美国最后一公里细分市场，还没有一家可比规模的物流配送初创公司在未证明 EBITDA 利润率的情况下成功
              IPO。CB Insights 指出 2026 年 Q1 退出市场接近两年低点；在这种压缩退出市场下，非 AI 物流科技的 IPO 窗口仍然很窄。


              Veho 股份的**二级市场**活动尚未确认；公开资料未发现二级交易。CB Insights Q1 2026 报告提到，二级市场活动整体上升（当季全球 134
              笔交易）；在一级退出窗口持续关闭时，员工和早期投资者越来越依赖二级流动性。以低于 $1.5 billion 的折价出售股份有可能，但没有公开证据。


              对任何投资逻辑而言，关键尽调项是：（1）经审计财务数据，用于验证收入和利润率；（2）当前现金头寸和 12 个月现金跑道模型；（3）股权结构表及优先股堆叠，用于理解清算瀑布经济性；（4）AB5
              州的司机分类法律暴露；（5）客户集中度风险。上述信息都没有公开资料，必须与公司直接沟通才能取得。在资料提供前，相对于上市可比公司和 2022 年以来 VC 市场轨迹，估值立场仍然偏高。
