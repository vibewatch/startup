        - 法院裁决或监管执法行动
        - 结构性成本基数上升 20–40%；IC 模式可行性受损
        - 法院案卷（PACER）、NLRB 文件、加州州法院
      - - Tiger Global / SoftBank 被迫清算
        - 老股市场大幅折价交易
        - 主要投资人释放低于 $1B 价格退出信号
        - 老股市场报告、LP 沟通
    notes: 截至 2026 年 5 月，这些触发点不是已独立核实的事件；它们是需要持续监测的前瞻风险信号。
    claimRefs:
      - CV004
      - CV007
      - CV032
      - CV033
      - CV035
      - CV038
      - CV039
  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 尽调事项
      - 数据负责人
      - 优先级
      - 为什么重要
    rows:
      - - 经审计财务报表（最近 3 个财年）
        - CFO → 外部审计师
        - 阻断
        - 没有收入和利润率数据，任何估值倍数都没有基础
      - - 当前现金余额和 12 个月现金跑道模型
        - CFO
        - 阻断
        - 没有这些数据就无法量化现金跑道风险；到 2027 年可能出现持续经营风险
      - - 含优先股堆叠和清算分配瀑布的股权结构表
        - CFO / 总法律顾问
        - 阻断
        - Tiger Global 和 SoftBank 的优先权可能吃掉 $1.0-1.5B 退出收益的大部分
      - - 客户收入集中度（前 10 大占收入百分比）
        - CFO / 销售
        - 高
        - 需要企业客户流失风险、CAC、NPS 和净留存数据
      - - 按州评估司机 IC 分类法律敞口
        - 总法律顾问
        - 高
        - AB5 及 CA、MA、WA 类似法规可能实质性重塑司机成本基数
      - - 单包裹单位经济（贡献利润率、每单配送 COGS）
        - COO / CFO
        - 高
        - 商业模式在当前规模下是否经济可行，是核心问题
      - - Series C 时间表、投资人兴趣和领投方估值标记
        - CEO / CFO
        - 高
        - 若近期没有融资路径，现金跑道风险会升级为持续经营问题
      - - 管理层预测和 2026-2028 年预算模型
        - CFO
        - 中
        - 独立压力测试乐观 / 基准 / 悲观情景的基础
    notes: 所有事项都是 Series C / 后期阶段标准尽调要求。截至 2026 年 5 月，均未公开。
