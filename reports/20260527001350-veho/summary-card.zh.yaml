summary:
  headline: Veho 是增长很快的末端配送运营商，品牌差异化真实，客户结果也强；但 IC 重新分类可能伤到成本模型，$1.5B 估值已陈旧四年，财务完全不透明，在经审计财务和新融资事件出现前只能观察。
