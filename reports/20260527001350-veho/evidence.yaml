evidenceGaps:
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: Verified employee headcount reported directly by Veho or confirmed via audited sources
    whyItMatters: >-
      Third-party headcount estimates (700–984) are inconsistent and unverified; accurate headcount is material for
      assessing operational capacity and burn rate relative to expansion pace
    diligencePath: Request headcount data from Veho management; cross-reference LinkedIn analytics or payroll data providers
    relatedQuestionRefs:
      - QO015
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: Any debt financing, revenue-based financing, or equity round subsequent to the February 2022 Series B
    whyItMatters: >-
      Veho's burn rate, runway, and capital adequacy cannot be assessed without knowing whether additional capital has
      been raised since the $170M Series B over three years ago
    diligencePath: >-
      Request cap table and any debt facility agreements from Veho; review SEC Form D filings for unannounced equity
      tranches
    relatedQuestionRefs:
      - QO027
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Audited or management-reported revenue, gross margin, EBITDA, and cash runway for the most recent fiscal year
    whyItMatters: >-
      The $31.7M revenue estimate from third-party databases is unverified and inconsistent with a company that tripled
      client launches and doubled parcel volume YoY; without financials, unit economics, profitability trajectory, and
      valuation support cannot be evaluated
    diligencePath: Request audited financials or management accounts; review board presentation materials if accessible under NDA
    relatedQuestionRefs:
      - QO028
  - type: missing-source
    severity: minor
    topic: governance
    missingEvidence: Full board of directors composition, including independent directors, investor board seats, and governance rights
    whyItMatters: >-
      Board composition affects investor alignment, oversight quality, and the degree of management autonomy; absence of
      board-level information limits governance diligence
    diligencePath: >-
      Request corporate governance documents from Veho; review any available Delaware incorporation or SEC filings for
      director names
    relatedQuestionRefs:
      - QO011
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: adverse
    missingEvidence: >-
      Full litigation and regulatory compliance history, including worker classification disputes, state labor
      investigations, and any pending or resolved lawsuits
    whyItMatters: >-
      Veho employs 70,000+ independent contractor driver-partners; contractor misclassification risk is a significant
      ongoing regulatory exposure in multiple states; The Information article (paywalled) may contain additional adverse
      detail
    diligencePath: >-
      Search PACER for federal cases; review state labor department records in California, New York, and other key
      states; attempt access to The Information article through subscription
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: minor
    topic: founders
    missingEvidence: Fred Cook's detailed professional background, including prior employers and educational credentials
    whyItMatters: >-
      As CTO co-founder, Fred Cook owns the technical architecture and proprietary platform; limited public information
      about his background prevents assessment of technical founder-market fit
    diligencePath: LinkedIn profile review; direct outreach or executive reference check through investors
    relatedQuestionRefs:
      - QO010
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A credible, publicly accessible US-only last-mile ecommerce delivery market size with stated methodology from a
      reputable analyst (e.g., McKinsey, Morgan Stanley, PitchBook, or IBISWorld).
    whyItMatters: >-
      Without a benchmarked market size, SAM/SOM estimates are speculative; investors cannot assess Veho's market share
      trajectory or validate its TAM claims.
    diligencePath: >-
      Request Veho management's proprietary TAM analysis; cross-reference with a paid analyst report from Grand View
      Research or MarketsandMarkets.
    relatedQuestionRefs:
      - QM001
      - QM006
      - QM021
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Veho's actual per-parcel average revenue (ASP), revenue run rate, and unit economics, which are required to
      compute actual SAM penetration.
    whyItMatters: >-
      Without ASP and volume data, SOM calculations remain rough estimates; the analysis cannot assess whether Veho's
      pricing is above or below the market rate.
    diligencePath: Request Veho's full financial disclosure (income statement, volume data, ASP) under NDA.
    relatedQuestionRefs:
      - QM004
  - type: missing-source
    severity: material
    topic: buyer-segmentation
    missingEvidence: Volume and revenue breakdown by channel (direct brand vs. 3PL) to assess channel concentration and dependency.
    whyItMatters: >-
      High 3PL channel concentration may reduce pricing power and create single-point churn risk if a platform switches
      away.
    diligencePath: Request Veho's customer revenue concentration data; top-10 clients as % of revenue.
    relatedQuestionRefs:
