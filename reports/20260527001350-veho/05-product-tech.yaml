  - id: "consumer-experience-technology"
    title: "Consumer-Facing and Shipper-Facing Product Features"
    body: >
      Veho's consumer product distinguishes itself from legacy carriers through real-time human support
      (live text support, not AI chatbot), delivery control features (reschedule, reroute, delivery
      instructions, Perfect Placement™ photo upload), and a proof-of-delivery photo confirmation with
      geolocation. The 4-hour delivery window confirmation system alerts recipients to a narrow arrival
      window, reducing missed deliveries. Veho's consumer app also supports package-theft mitigation
      via the Perfect Placement™ feature introduced in 2023, which extracts latitude/longitude from
      customer-supplied photos and pins the exact drop location for driver-partners.

      For shippers, the Veho Pulse Portal provides real-time shipment visibility, early risk flagging,
      and analytics. The API integration layer promises onboarding in days rather than weeks and
      includes pre-built connectors to major ecommerce and 3PL platforms. The client-facing case
      studies from Tuckernuck (35% lower shipping costs, 26% fewer lost-package support calls),
      IPSY, Kendra Scott, and Saks are available on the Veho website, though the underlying data
      is self-reported and not independently audited.

      Brand impact metrics promoted by Veho include 20% increase in repurchase rates, 40% growth
      in customer LTV, 8% NPS improvement, and 71% reduction in credits/refunds. These are
      company-claimed aggregate statistics with no disclosed methodology, sample size, or
      time horizon. The Manifest 2026 case study with EssilorLuxottica mentions AI technology
      helping shippers lower shipping spend without sacrificing experience, but no specific
      metrics are disclosed. Return on Shipping (ROS) framework on Veho's website shows
      35% average shipping cost reduction, 41% LTV increase, and 288% average volume growth in
      year one for brand partners.
