  - id: "security-compliance-trust"
    title: "Security, Compliance, and Trust Posture"
    body: >
      Veho achieved ISO/IEC 27001:2022 certification on July 27, 2023, for its parcel delivery
      platform including consumer and driver mobile apps and the package tracking website. The
      certification was issued by Schellman & Company LLC, an ANAB and UKAS-accredited independent
      auditor, and can be verified in Schellman's public certificate directory under certificate number
      1195292-3. This represents one of few independent technical trust anchors for the platform.

      The security program is AWS-hosted (multi-AZ, multi-region US), with AES encryption at rest
      and TLS for data in transit. Veho follows a Secure SDLC with automated SAST tooling and
      threat modeling for new features. Annual third-party penetration testing is conducted, with
      findings prioritized and remediated promptly. A public Vulnerability Disclosure Program
      allows independent security researchers to report vulnerabilities. Incident response follows
      ISO 27035 protocols. Background checks cover all employees and driver-partners at hire.

      A notable governance observation: security is overseen at the CFO level ("Veho's Chief Financial
      Officer (CFO) meeting with executive management regularly to discuss issues"), not a dedicated
      Chief Information Security Officer (CISO). This is atypical for a platform handling consumer PII,
      geolocation data, delivery access codes, and brand logistics data at scale. Policies are reviewed
      annually and shared with all employees. Vendor security assessments are conducted pre-engagement
      with periodic reviews. No SOC 2 attestation is publicly disclosed; the ISO 27001 remains the
      primary assurance artifact available to shippers.

      Consumer privacy is governed by Veho Tech, Inc.'s published Privacy Notice, which covers
      collection of contact data, delivery preferences, device data, precise location (with consent),
      and behavioral data. No GDPR applicability or cross-border data transfer disclosures were
      identified (Veho is US-only). Driver data includes location, earnings, and delivery history.
    claimRefs:
      - CE033
      - CE034
      - CE035
      - CE036
      - CE037
      - CE038
