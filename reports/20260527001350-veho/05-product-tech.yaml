  - id: "driver-platform-operations"
    title: "Driver Platform, Network Operations, and Field Technology"
    body: >
      The Veho driver app is the operational backbone for 120,000+ independent contractor driver-partners.
      Drivers log in to the app to browse routes, view expected earnings, select start times and lengths,
      and accept work on a shift-by-shift basis. The app guides drivers through warehouse pickup,
      package scanning, navigation, photo-confirmation delivery, and customer communication. Driver
      ratings are computed as a rolling average of the last 100 customer-rated deliveries on a 1–5 scale;
      ratings below minimum standards trigger deactivation from the platform.

      Veho pays drivers twice per week via direct deposit (2–3 business day processing delay). An
      Occupational Accident insurance program through Arthur J. Gallagher and certain underwriters at
      Lloyd's of London provides per-mile coverage at $0.0185/mile, automatically deducted from driver
      pay. Routes are designed to last 2–6 hours, with upfront earnings visibility before acceptance.
      The platform currently hosts an Instant Cashout feature for drivers (visible in the sitemap but
      not fully documented publicly).

      Adverse evidence from Indeed reviews (135 respondents) surfaces recurring driver complaints:
      app navigation bugs, unreliable camera-to-scanner switching, routes taking significantly longer
      than estimated (one driver reported 12+ hours for a 7-hour route), and at least one reported
      case of an unpaid route with no resolution channel. Trustpilot reviews from consumers (3.7/5,
      1,153 reviews) cite lost/misdelivered packages, scripted customer service responses, and
      package routing errors. These signals suggest material driver experience friction and operational
      reliability gaps that the company's >99% OTD marketing claim does not fully represent at the
      individual shipment and driver level.

      Veho operates 9 regional sort-and-delivery centers and 48 last-mile delivery facilities across
      its 66+ market network. The February 2026 western expansion added two new regional hubs in
      Phoenix (AZ) and Ontario (CA), together spanning more than 150,000 square feet near major air,
      rail, and port terminals. Background checks are conducted on all driver-partners.
