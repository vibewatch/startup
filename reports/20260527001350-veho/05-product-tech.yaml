callouts:
  - calloutType: "strength"
    title: "ISO 27001 Certification and AWS Architecture Provide Verifiable Trust Anchor"
    body: >
      Veho's ISO/IEC 27001:2022 certification (Schellman, cert #1195292-3, July 2023) is one of few
      independently verifiable technical trust signals the company has made public. Combined with
      AWS multi-AZ hosting, AES/TLS encryption, and annual third-party pen testing, the security
      posture is materially stronger than most gig-economy logistics peers. This is a real differentiator
      in enterprise shipper procurement conversations where security questionnaires are standard.
    claimRefs:
      - CE033
      - CE034
      - CE035

  - calloutType: "risk"
    title: "Geographic Coverage Gap Limits Veho to Partial-Network Status for National Brands"
    body: >
      Veho's 66-market network covers 42–46% of the US population (144 million) as of May 2026. This
      forces national brands to maintain at least one incumbent carrier (FedEx, UPS, USPS) for
      uncovered geographies, limiting Veho's addressable penetration to partial-network use cases.
      The California launch came only in late 2025–2026 after nine years of operation. Coast-to-coast
      coverage is a 2026 roadmap commitment but remains unverified as achievable in the stated timeline.
    claimRefs:
      - CE039
      - CE009
      - CE044

  - calloutType: "risk"
    title: "Driver App Technical Issues and Adverse Reviews Signal Execution Risk"
    body: >
      Multiple independent driver reviews on Indeed surface recurring app-level failures: camera/scanner
      switching bugs, route duration underestimation, and payment resolution gaps. Trustpilot reviews
      (3.7/5, 1,153 reviews) show a non-trivial share of adverse consumer experiences. These signals
      are inconsistent with the company's >99% OTD and 4.9/5 CSAT marketing claims and represent
      material execution risk as Veho scales from 66 to national coverage under its 2026 expansion plans.
    claimRefs:
      - CE022
      - CE023
      - CE041

  - calloutType: "insight"
    title: "MaestroAI Is Veho's Core Moat Claim but Lacks Independent Validation"
    body: >
      MaestroAI is positioned as the source of Veho's cost, quality, and flexibility advantages over
      legacy carriers and gig-delivery peers. However, no patents, academic papers, third-party
      benchmarks, or published API specifications exist to support the underlying algorithmic superiority
      claim. Competitive moat more credibly stems from Veho's geographic density of operations and
      driver marketplace economics than from any provably superior optimization algorithm.
    claimRefs:
      - CE011
      - CE014
      - CE016
      - CE043

