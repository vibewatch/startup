company:
  name: Veho

chapter:
  order: 4
  number: 4
  title: Financials
  summary: |
    Veho has raised approximately $300M across three rounds (seed July 2020, $127M Series A December 2021, $170M
    Series B February 2022), achieving a $1.5B unicorn valuation at the Series B. Revenue grew ~90% in 2023 and
    parcel volume roughly doubled in 2025 versus 2024, with 70% client-base growth in 2025 — strong operational
    indicators. However, January 2024 layoffs of ~19% of corporate staff (~65 jobs) were explicitly framed as an
    "acceleration of the path to profitability," confirming the company had not achieved profitability through
    late 2023 despite fast growth. No audited financials, revenue, ARR, burn rate, or margin data are publicly
    available; the company operates under a private-undisclosed disclosure profile. Positive volume momentum and
    independent-contractor cost structure provide structural advantages, but cash position and runway are
    unverifiable from public sources.

sections:
  - id: revenue-model
    title: Revenue Model and Monetization Structure
    body: |
      Veho's revenue model is built on a per-parcel transactional fee paid by e-commerce brands and retailers
      for each delivery executed through its network. Unlike incumbent carriers (UPS, FedEx, USPS), Veho does
      not charge residential surcharges, weekend delivery premiums, or fuel surcharges on residential parcels —
      pricing is all-in per parcel. This simple, transparent pricing structure is a deliberate product and
      sales differentiator targeted at direct-to-consumer e-commerce brands that routinely absorb those
      surcharges from incumbents.

      Veho monetizes across three service lines under the same per-parcel fee framework. **Ground Plus**
      (branded as 1–3 day delivery) is the core product and primary revenue driver. **Premium Economy**
      (2–8 day, lower-cost-to-deliver) serves price-sensitive sellers and partially overlaps with FedEx Ground
      and USPS Priority Mail volume. **FlexSave**, launched in Q1 2026 as a beta product, adds an explicit
      speed-for-cost tradeoff — sellers can defer delivery speed (within a flexible window) in exchange for a
      lower per-parcel rate, giving Veho more routing flexibility and potentially higher margin delivery
      density. FlexSave signals Veho's intent to optimize network utilization by blending time-definite and
      flexible-window parcels on shared driver routes.

      Secondary revenue lines include **3PL value-added services** (inbound receiving, storage, pick-and-pack)
      operated inside its 9 regional sort centers, **Doorstep Pickup** for returns (last-mile pickup from
      consumer residences), and **enterprise logistics consulting** via RIVR (a strategic advisory and
      technology co-development partnership with Berkshire Grey robotics as of May 2025). None of these
      secondary lines have disclosed revenue contributions. The 3PL and pickup services are differentiated
      by Veho's existing network density and driver availability, allowing marginal-cost extensions with
      minimal incremental fixed-cost burden.

      Veho claims 35% fully-landed cost savings versus incumbent carriers for its target customer segment
      (premium e-commerce brands on 1–3 day residential delivery). One disclosed client data point showed a
      2% reduction in freight spend as a percentage of revenue. Both figures are company-sourced and lack
      independent audit.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI008]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]

  - id: capital-structure
    title: Capital Structure and Funding History
    body: |
      Veho has raised approximately $300M in venture capital across three disclosed rounds, all evidenced
      by SEC Form D filings. The initial Form D (filed July 2020, CIK 0001818785) reflects $4.16M raised
      as equity in an early seed-stage round. The December 2021 Form D records $127M in a Series A round
      led by General Catalyst, which elevated Veho to unicorn status. Two months later, in February 2022,
      a $170M Series B led by Tiger Global Management (co-led by SoftBank Vision Fund 2) brought the
      cumulative raise to approximately $300M at a $1.5 billion valuation.

      The investor base includes General Catalyst, Tiger Global Management, SoftBank Vision Fund 2,
      Bling Capital, Construct Capital, Industry Ventures, and Origin Ventures, among others. The
      participation of Tiger Global (traditionally growth equity) and SoftBank (with a history of
      aggressive capital deployment) at the Series B suggests high growth expectations were underwritten
      by the investors at the time of fundraising, with implied pressure to demonstrate a path to
      profitability within a 3–5 year horizon.

      No additional funding rounds have been publicly disclosed since the February 2022 Series B. With
      approximately four-plus years since the last raise, and January 2024 layoffs explicitly framed as
      a path-to-profitability measure, Veho's cash management discipline is a material diligence
      consideration. Assuming an initial burn rate of $50–100M per year (consistent with a ~1,000-person
      logistics company operating 9 sort centers and 48 last-mile facilities), and that Veho has been
      actively managing burn downward since 2024, the estimated remaining cash from the $300M raised is
      uncertain — likely in the range of $50–150M. No independent confirmation of current runway or
      cash position is publicly available.

      Veho's $1.5B valuation from February 2022 was set at peak venture market conditions. With no
      subsequent round, the mark is now over four years stale and reflective of a market environment
      that has since compressed private valuations broadly, particularly for logistics-tech companies.
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014, CI015, CI016]
    tableRefs: [TI003]
    figureRefs: [FI002]

  - id: unit-economics
    title: Unit Economics Framework and Cost Drivers
    body: |
      Veho's unit economics are not publicly disclosed. The company has not published cost per delivery,
      gross margin, contribution margin, or any per-shipment profitability data. Independent analysis
      must rely on structural inferences from the business model.

      The most significant cost advantage in Veho's model is its **independent contractor (IC) driver
      workforce** of 120,000+ driver-partners. IC drivers are paid per route (not per hour), receive no
      employer benefits, and bear their own vehicle and fuel costs. This model closely resembles Amazon
      Flex and DoorDash, and structurally eliminates the largest fixed cost of incumbent carriers —
      employee benefits, vehicle fleets, and pension obligations. However, it creates regulatory exposure
      in states like California (AB5 worker classification), Massachusetts, and others that have challenged
      IC misclassification in logistics.

      The hub-and-spoke infrastructure (9 regional sort centers averaging approximately 100,000 sq ft,
      plus 48 last-mile delivery facilities) represents the company's primary fixed-cost base. Lease
      costs for a 100,000 sq ft logistics hub in a major metro run approximately $8–15/sq ft NNN
      (triple-net), implying $800K–$1.5M per year per hub in base rent. Across 9 sort centers plus 48
      smaller last-mile facilities, total lease obligations likely run $15–40M annually. Sort and
      handling labor (corporate and warehouse employees, estimated ~400–600 from the total ~1,000
      headcount) is a semi-variable cost that scales with volume.

      The company's claim of 35% fully-landed cost savings vs. incumbents, if accurate, implies it
      operates at approximately 65% of the per-parcel cost of FedEx Home Delivery or UPS Ground
      residential. Published UPS/FedEx Ground residential rates for 1–2 lb parcels are approximately
      $9–14 per shipment; at a 35% discount, Veho would price at approximately $6–9 per shipment.
      Whether this pricing generates positive contribution margin depends on route density, driver
      pay per route, hub lease costs, and sortation labor — none of which are disclosed.

      Parcel volume growth (7.5M+ monthly parcels as of February 2026, doubled year-over-year)
      suggests improving route density per driver and per hub, which is the primary driver of positive
      unit economics in last-mile delivery. If volume continues to scale, fixed hub costs per parcel
      decline and driver utilization per route increases, improving margin.
    claimRefs: [CI017, CI018, CI019, CI020, CI021, CI022, CI023]
    tableRefs: [TI004]
    figureRefs: [FI003]

  - id: growth-trajectory
    title: Revenue Growth and Operational Trajectory
    body: |
      While Veho does not publicly disclose revenue, operational metrics provide strong proxies for
      growth. Revenue grew nearly 90% in 2023 versus 2022 according to a company statement reported
      by TechCrunch. In 2025, the company reported 70% growth in its client base and tripled new
      client launches relative to 2024. Parcel volume doubled in the 2025 holiday peak versus 2024.
      As of February 2026, Veho delivers 7.5M+ monthly parcels across 66 US markets, with its
      network covering 144 million Americans (approximately 44% of the US population).

      The driver network grew from approximately 84,000 in May 2025 to 120,000 by February 2026 —
      a 43% increase in eight months. This growth indicates rapid market expansion and reflects both
      new geography entry and deepening of existing market density. Market presence grew from roughly
      45 markets at the start of 2025 to 70 markets by April 2026, including major expansions into
      Southern California (Los Angeles metro, San Diego, Las Vegas, Scottsdale) with 100,000+ parcel
      deliveries per week in SoCal within months of launch.

      The company's named client base includes enterprise brands Macy's, Lululemon, Sephora, HelloFresh,
      Kroger, Nordstrom, Saks, Misfits Market, and Nespresso, with "hundreds" of brands on platform
      per Veho's own descriptions. Tripling new client launches in 2025 suggests the sales pipeline
      is executing and churn is not prohibitive, though net retention data is not public.

      Profitability has not been confirmed. The January 2024 layoffs were the most direct signal of
      burn management, with the company explicitly stating the reorganization was intended to
      "improve efficiencies, accelerate our path to profitability." As of the May 2026 research
      date, Veho has not publicly claimed profitability or break-even. FreightWaves has noted that
      independent parcel carriers including Veho face ongoing "questions about whether profit margins
      can sustain expensive network buildouts," reflecting market-wide skepticism about the economics
      of challenger carrier scaling.
    claimRefs: [CI024, CI025, CI026, CI027, CI028, CI029, CI030, CI031]
    tableRefs: []
    figureRefs: []

  - id: financial-disclosure-gaps
    title: Financial Information Gaps and Disclosure Assessment
    body: |
      Veho is a private company operating under a private-undisclosed disclosure profile. No audited
      or unaudited financial statements are available in the public domain. The company's SEC filings
      are limited to Form D exemption notices, which disclose only the capital raised per round and
      the general nature of the offering — they do not contain income statements, balance sheets, or
      cash flow data.

      The primary financial metrics a diligence analyst would seek — revenue, ARR, gross margin,
      EBITDA, burn rate, runway, unit economics, CAC, LTV, and net revenue retention — are entirely
      absent from public sources. Veho has made selective disclosures of operational metrics
      (parcel volume, market count, driver count, client growth percentages) but none of these map
      directly to financial performance. Operational scale is a necessary but not sufficient condition
      for financial health in capital-intensive logistics.

      The most actionable financial indicators available from public sources are: (1) the $300M
      total raised; (2) a 40-month gap since the last funding round (February 2022 to May 2026);
      (3) the January 2024 workforce reduction framed as a profitability-acceleration measure;
      and (4) continued operational expansion (new markets, new hub leases, driver network growth)
      in 2025–2026, which implies capital is still available and being deployed. Together these
      suggest the company is operating with financial discipline but has not yet reached — or at
      least not yet confirmed reaching — profitability.

      Any diligence process must obtain audited financials, cash flow statements, unit economics
      by market cohort, and funding runway projections directly from the company. No proxy
      can substitute for primary financial data in a logistics company with high operating leverage.
    claimRefs: [CI032, CI033, CI034, CI035]
    tableRefs: [TI005]
    figureRefs: []

  - id: market-context
    title: Market Context and Competitive Cost Position
    body: |
      The US parcel delivery market provides the revenue and competitive context for assessing Veho's
      financial potential. According to ShipMatrix, the US parcel market is growing at approximately
      4% CAGR, projected to reach 26.8 billion annual parcels by 2027. Statista values the global
      last-mile delivery market at $128.5 billion in 2022, with projections to exceed $200 billion
      by 2027. Capgemini research estimates that last-mile delivery accounts for more than half of
      total shipping costs, and Statista data suggests that $41 of every $100 in supply chain spend
      goes to last-mile logistics — reinforcing the magnitude of the cost problem Veho targets.

      Coresight Research placed Veho in its "Future Leaders" quadrant in its Innovator Matrix for
      last-mile delivery, citing Veho's level of innovation, market potential, and $299.3M in
      funding. This independent third-party classification is a positive reputation signal, though
      the Coresight methodology is research-based rather than financial audit-based.

      The competitive cost position Veho claims — 35% fully-landed cost savings versus incumbents —
      is structurally plausible given the IC driver model, but is not independently verified. UPS
      and FedEx residential delivery at list rates for a 2 lb parcel runs approximately $11–14
      (including residential and fuel surcharges). Achieving 35% savings at scale requires sufficient
      route density to minimize driver dead miles, efficient sortation, and a favorable mix of
      delivery addresses — conditions that are achieved in dense urban and suburban markets but
      are challenged in rural or low-density markets where Veho does not yet operate at scale.

      The last-mile competitive landscape involves Amazon Logistics, FedEx, UPS, USPS, OnTrac,
      LaserShip, and regional carriers — all of whom have made technology and capacity investments
      to defend residential last-mile economics. The question for Veho's financial trajectory is
      whether the unit economics at current and near-term volume levels (7.5M parcels/month) are
      positive, and whether the path to profitability requires reaching a specific volume threshold
      or market density level not yet achieved.
    claimRefs: [CI036, CI037, CI038, CI039, CI040]
    tableRefs: []
    figureRefs: [FI004]

