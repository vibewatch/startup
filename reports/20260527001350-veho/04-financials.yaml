callouts:
  - calloutType: strength
    title: IC Driver Model Provides Structural Cost Advantage
    body: |
      Veho's use of 120,000+ independent contractor drivers eliminates the largest fixed-cost
      burdens of incumbent carriers: driver benefits, vehicle fleet capex, and pension obligations.
      This structural cost advantage is the primary enabler of the claimed 35% fully-landed cost
      savings versus FedEx/UPS residential delivery. If route density continues to improve with
      volume growth, cost per parcel should decline further as fixed hub costs are amortized over
      more parcels.
    claimRefs: [CI017, CI018, CI038]

  - calloutType: risk
    title: Path to Profitability Unconfirmed; January 2024 Layoffs Signal Prior Burn Pressure
    body: |
      Despite 90% revenue growth in 2023 and strong 2025 operational metrics, Veho has not publicly
      confirmed profitability or break-even. The January 2024 layoffs of ~19% of corporate staff
      were explicitly framed as an effort to "accelerate the path to profitability" — a direct
      acknowledgment that the company was not profitable at that time. As of May 2026, no subsequent
      profitability announcement has been made. With no new funding round since February 2022, the
      company's cash runway is unverifiable from public sources and represents a material financial
      diligence gap.
    claimRefs: [CI014, CI015, CI025, CI026]

  - calloutType: risk
    title: Four-Year Valuation Staleness and Compressed Market Comparables
    body: |
      Veho's $1.5B valuation from February 2022 was set at peak venture market conditions. With no
      subsequent round to re-mark the valuation, the figure is now over four years stale. The
      comparable private logistics-tech cohort (OnTrac, LaserShip/LSO, Ontrac) has seen valuation
      compressions of 40–70% from 2021–2022 peaks in secondary market transactions. Any new capital
      raise or M&A event would likely involve a valuation re-mark, and the direction of that
      re-mark is uncertain without current financial data.
    claimRefs: [CI012, CI013, CI040]

  - calloutType: recommendation
    title: Obtain Audited Financials Before Any Investment Decision
    body: |
      Given the complete absence of public financial data, any investment or partnership decision
      must be predicated on obtaining audited financials, management-reported revenue and margin
      data, a current cash flow statement, and unit economics by market cohort from Veho directly.
      Operational growth metrics are positive but insufficient to assess financial health. A
      detailed data room review covering at minimum: (1) income statement 2021–2025, (2) unit
      economics per market, (3) cash balance and monthly burn, and (4) investor rights agreements
      with Tiger Global and SoftBank, is required before any diligence conclusion.
    claimRefs: [CI032, CI033, CI034, CI035]

