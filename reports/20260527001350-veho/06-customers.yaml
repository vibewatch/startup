  evidenceGaps:
    - type: "missing-source"
      severity: "minor"
      topic: "client-facing tools"
      missingEvidence: "Veho has not publicly documented which specific operational tools (portals, dashboards, API docs) are available to brand clients beyond high-level references to 'Veho Pulse' and real-time tracking in press materials."
      whyItMatters: "Knowing the depth of client tooling (real-time exception alerts, self-service rescheduling, API integration docs) would clarify whether Veho's client retention is technology-driven or relationship-driven."
      diligencePath: "Request Veho Pulse demo and API documentation during diligence; review integration guides on shipveho.com/developers if available."
      relatedQuestionRefs:
        - QU008
    - type: "private-evidence-only"
      severity: "material"
      topic: "client retention rate"
      missingEvidence: "Veho has not published a client retention rate, NPS score, or any audited cohort-level data on client tenure and churn."
      whyItMatters: "Retention rate is the key metric for evaluating whether the 70% client growth is sustainable or masks elevated churn; without it, the 9× volume claim cannot be decomposed into organic expansion vs. net new clients."
      diligencePath: "Request client cohort data and annual retention rates in due diligence; cross-reference with ShipStation / ShipHero integration data if available."
      relatedQuestionRefs:
        - QU017
        - QU019
    - type: "private-evidence-only"
      severity: "material"
      topic: "independent OTD and CSAT verification"
      missingEvidence: "All OTD (99%) and CSAT (4.9/5) metrics are company-reported with no third-party audit or independent benchmark study cited."
      whyItMatters: "Trustpilot's 3.7/5 consumer rating diverges substantially from the 4.9/5 B2B CSAT; without independent verification it is not possible to reconcile or validate the self-reported metrics."
      diligencePath: "Request audited delivery performance data from a representative sample of current clients; compare to carrier industry benchmarks from FreightWaves or similar."
      relatedQuestionRefs:
        - QU017
    - type: "missing-source"
      severity: "minor"
      topic: "IC driver model and delivery quality"
      missingEvidence: "No published study or independent comparison directly contrasts consumer delivery experience between Veho's independent-contractor model and employee-based carrier models at the same scale and market set."
      whyItMatters: "The IC model's impact on consumer quality is debated; Trustpilot complaints suggest some failure modes tied to driver accountability, but causation vs. legacy carrier performance is unverified."
      diligencePath: "Review IC driver feedback on Indeed and Glass Door; request driver retention and incident data in diligence."
      relatedQuestionRefs:
        - QU025
    - type: "missing-source"
      severity: "minor"
      topic: "Trustpilot carrier comparison"
      missingEvidence: "No direct comparison of Veho's Trustpilot rating (3.7/5) versus published UPS, FedEx, or USPS consumer Trustpilot ratings has been sourced in this chapter."
      whyItMatters: "Without the peer comparison, it is unknown whether 3.7/5 is better, worse, or in-line with legacy carrier consumer Trustpilot scores—contextualizing the adverse signal."
      diligencePath: "Manually retrieve UPS (trustpilot.com/review/ups.com), FedEx, and USPS Trustpilot ratings and compare directly."
      relatedQuestionRefs:
        - QU027
    - type: "enumeration-incomplete"
      severity: "minor"
      topic: "named customer proof completeness"
      missingEvidence: "Veho's 8 published case studies represent a curated sample; the full client roster is not disclosed and other named clients (Macy's, EssilorLuxottica, Stitch Fix) have no published case study outcomes."
      whyItMatters: "Absence of case studies for the largest disclosed clients (Macy's, Lululemon) limits verification of outcomes at the scale of Veho's flagship relationships."
      diligencePath: "Request client references and performance data for top-10 clients by volume in diligence process."
      relatedQuestionRefs:
        - QU004
      relatedTableRefs:
