company:
  name: "Veho"

chapter:
  number: 6
  title: "Customer Base, Growth, and Proof Points"
  summary: >-
    Veho's customer base grew approximately 70% in 2025, reaching 66 US markets that cover 144 million
    Americans (44% of US population) by February 2026. Eight published case studies document measurable
    outcomes—including a 35% cost reduction for Tuckernuck, a 300% volume ramp for Saks Fifth Avenue,
    a 25% credit reduction for Hungryroot, and a 40% delivery-error reduction for Sakara Life—anchoring
    Veho's premium-brand DTC value proposition in verifiable proof. ShipStation and ShipHero integrations
    added access to 5,000+ addressable brands. The adverse signal is a Trustpilot rating of 3.7/5 ("Average")
    from 1,153 consumer reviews, with specific complaints about misdeliveries and unresponsive support that
    diverges from the company-claimed 4.9/5 B2B CSAT. Client concentration in premium discretionary
    retail (Saks, Lululemon, Kendra Scott) introduces spending-cycle exposure.

sections:
  - id: "customer-segments-scale"
    title: "Customer Segments and Portfolio Scale"
    body: >-
      Veho targets premium and mid-market direct-to-consumer e-commerce brands across six principal
      verticals: fashion and apparel, beauty and personal care, food and meal kits, home and lifestyle,
      health and wellness, and luxury or department-store retail. This portfolio composition reflects Veho's
      thesis that last-mile delivery quality is a revenue lever for consumer-facing brands rather than a
      commodity cost. The company's per-parcel pricing model aligns its incentives with brand clients: Veho
      earns more when clients ship more, creating a shared stake in client volume growth.

      As of February 2026, Veho serves 66 US markets reaching approximately 144 million Americans—44% of
      the national population—up from 44 markets and roughly 105 million Americans at the start of 2025.
      The client roster publicly disclosed by Veho includes Macy's, Lululemon, Sephora, HelloFresh,
      EssilorLuxottica, Stitch Fix, Nordstrom, Rent the Runway, Sakara Life, Hungryroot, IPSY, Kendra
      Scott, and Tuckernuck. Hartford Business Journal and Veho's own expansion announcements further
      reference Nespresso and Misfits Market as clients. ShipStation's September 2025 integration
      announcement named Macy's, Sephora, Lululemon, Stitch Fix, and HelloFresh as active Veho clients
      at that time, providing third-party corroboration for the disclosed roster.

      Table TU001 maps the principal client verticals. The segmentation illustrates both Veho's current
      concentration in fashion and apparel (estimated 30% of volume) and the opportunity to deepen
      penetration in food delivery, health, and lifestyle—verticals where next-day reliability has direct
      product-quality consequences and creates a structurally higher willingness to pay for premium delivery.
    claimRefs:
      - CU001
      - CU002
      - CU006
      - CU034
    tableRefs:
      - TU001

  - id: "named-customer-evidence"
    title: "Named Customer Evidence and Published Case Studies"
    body: >-
      Veho has published eight detailed case studies on its website, documenting measurable business
      outcomes for named and anonymized clients across beauty, fashion, food, and retail verticals.
      These constitute the primary verifiable evidence base for Veho's commercial value proposition
      and are assessed as customer-proof sources of medium confidence given they are company-curated
      and not independently audited.

      Among the strongest documented outcomes: IPSY, a beauty subscription company delivering roughly
      one million parcels annually, achieved a sub-5% delivery failure rate and a 4.8/5 consumer feedback
      score. Tuckernuck, a women's fashion retailer, realized a 35% reduction in fully-landed delivery
      costs, 24% fewer customer tracking inquiries, and 26% fewer lost-package contacts after migrating
      to Veho in Spring 2024. Hungryroot reduced customer-service credit issuances by 25% and achieved
      99% on-time delivery, critical for a perishable grocery subscription model. Saks Fifth Avenue
      expanded its Veho footprint from 8 to more than 25 markets within six months of launch and grew
      its Veho-handled parcel volume by 300% over that period. Sakara Life moved from 2 to 14 Veho
      markets and reduced delivery errors by 40% and credit issuances by 61%. An unnamed vitamin
      supplement retailer scaled from 6 to 25 markets while maintaining a 99.28% on-time delivery rate.
      An unnamed athleisure brand doubled its peak-season volume and improved geographic delivery
      coverage by 66%.

      Kendra Scott, a luxury jewelry brand, documented a 2 percentage-point reduction in freight costs,
      representing meaningful savings relative to high-ticket parcel value. Hartford Business Journal's
      reporting on Veho's 2023 Northeast expansion independently confirmed Saks, Nordstrom, Rent the
      Runway, and HelloFresh as active clients, providing third-party corroboration for four of Veho's
      largest disclosed relationships. Table TU003 enumerates all published case study outcomes.
    claimRefs:
      - CU010
