  - id: "customer-growth-trajectory"
    title: "Customer Growth and Adoption Trajectory"
    body: >-
      Veho's customer growth in 2025 was, by any measure, exceptional. The company's CEO published
      a blog post in late 2025 reporting that Veho tripled its new client launch rate compared to the
      prior year, grew its total client base by approximately 70%, doubled parcel volume in the first
      half of the year, and achieved the strongest unit economics since the company's founding—with
      profitability across all operating regions by year-end. The company estimates that since 2021,
      overall volume has grown approximately 9× . These metrics are company-claimed and not
      independently audited; however, FreightWaves' 2025 FreightTech 100 recognition and Fast Company's
      2026 Most Innovative Companies designation are consistent with a company experiencing genuine
      operating momentum.

      Two platform integrations in early-to-mid 2025 materially expanded Veho's addressable client
      universe. The ShipHero partnership (January 2025) made Veho accessible to more than 5,000 brands
      already using ShipHero's warehouse management system across 44 markets. The ShipStation integration
      (September 2025) extended Veho's reach across 56 markets to the large universe of merchants on
      the ShipStation platform. Both partnerships represent partner-led distribution rather than direct
      sales, implying lower customer acquisition cost and faster scaling—but also indirect relationships
      that may reduce Veho's visibility into end-client satisfaction.

      Table TU002 shows the approximate adoption trajectory from 2022 through early 2026. Veho expanded
      coverage by roughly 50% year-over-year in 2025, growing from 44 markets in January 2025 to 66
      markets by February 2026, while legacy carriers including UPS and FedEx pulled back from some
      e-commerce segments, according to Veho's February 2026 press release. Figure FU001 illustrates the
      customer onboarding journey from RFP to full deployment. Figure FU002 shows the estimated funnel
      from total addressable shippers to active multi-region Veho clients.
    claimRefs:
