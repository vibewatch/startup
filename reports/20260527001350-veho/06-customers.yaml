      Veho claims a 4.9/5 B2B CSAT from brand clients, but Trustpilot shows 3.7/5 from 1,153 end-consumer
      reviews including specific complaints about misdeliveries, packages shipped to incorrect warehouses,
      and unresponsive customer service. This divergence suggests that delivery failures, while infrequent
      in aggregate, are poorly resolved when they occur—a vulnerability that can erode the brand-client
      relationships Veho depends on.
    claimRefs:
      - CU008
      - CU023
      - CU024

  - calloutType: "insight"
    title: "Partner-Led Distribution (ShipStation, ShipHero) Is a Scale Lever but Reduces Client Visibility"
    body: >-
      The ShipStation and ShipHero integrations added access to 5,000+ brands without direct sales effort,
      dramatically expanding Veho's addressable universe. The trade-off is that partner-mediated relationships
      are typically shallower than direct enterprise contracts—Veho has less visibility into partner-channel
      client satisfaction and is exposed to partner churn risk if ShipStation or ShipHero shifts carrier
      integrations.
    claimRefs:
      - CU005
      - CU007

