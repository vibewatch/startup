acknowledgedWarnings:
  - dimension: "tableNotes"
    reason: >-
      All five tables include notes fields. TU001, TU002, TU005 carry estimation caveats and source
      attribution. TU003 notes that all metrics are company-reported and unaudited, and that two clients
      are anonymized. TU004 explicitly notes the distinction between B2B CSAT and end-consumer Trustpilot
      rating. No pure factual snapshot table is left without a notes caveat.
