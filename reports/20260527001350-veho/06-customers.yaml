  - id: "concentration-risk"
    title: "Client Concentration, Dependency Risk, and Critical Assessment"
    body: >-
      Veho's publicly disclosed client roster skews heavily toward premium discretionary retail: Saks Fifth
      Avenue, Kendra Scott, Lululemon, Nordstrom, Macy's, and Rent the Runway collectively represent a
      disproportionate share of brand-name clients. This concentration in consumer-discretionary spending
      introduces meaningful exposure to recessionary cycles, where luxury and mid-market apparel and fashion
      brands are typically the first to see volume declines. Veho has not disclosed revenue concentration
      data (e.g., share of revenue from top 5 or top 10 clients), so the severity of this risk is not
      precisely quantifiable from public sources.

      Geographic concentration is a related risk: despite growing to 66 markets, Veho has minimal presence
      in large Midwest and Mountain West metro markets including Denver, Salt Lake City, and Kansas City as
      of early 2026, limiting its attractiveness as a primary national carrier for brands requiring full US
      coverage. The Southeast and Texas markets, while served, are less dense than the Northeast and West
      Coast concentrations.

      Two other structural risks deserve attention. First, Veho's growth model increasingly relies on
      partner-led distribution via ShipStation and ShipHero, which introduces client churn risk if either
      partner shifts its carrier integrations. Second, the company provides no public evidence of an
      independent customer retention rate or NPS score, leaving the sustainability of the 70% client growth
      rate unverifiable. Survey data from 150 e-commerce brands cited by Veho in October 2025 suggests
      strong intent to expand capacity, but such surveys are subject to response bias.

      Despite these caveats, the 8 published case studies, multi-year client relationships documented with
      Saks (since 2022), Hungryroot, and Sakara Life, and the accelerating volume trajectory collectively
      provide moderate-to-strong evidence that Veho has achieved product-market fit in the premium DTC
      delivery segment. Table TU005 summarizes concentration and dependency risks.
    claimRefs:
      - CU019
      - CU028
      - CU036
      - CU038
      - CU029
      - CU021
    tableRefs:
      - TU005

