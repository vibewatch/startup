  - id: "retention-satisfaction"
    title: "Customer Retention, Satisfaction, and Service Quality"
    body: >-
      Veho's company-claimed retention and satisfaction metrics are strong: a 99% on-time delivery rate
      and 4.9/5 average customer satisfaction score across brand clients, with clients reported to achieve
      an average 41% improvement in consumer lifetime value (CLV) and 35% reduction in fully-landed
      delivery costs versus incumbent carriers. Veho also claims to deliver parcels an average of 1.3 days
      faster than legacy carriers in markets where the two co-exist. These metrics are drawn from Veho
      company publications and the ShipStation integration announcement and represent B2B CSAT—brand
      client satisfaction—rather than end-consumer ratings.

      The adverse signal is material: Trustpilot rates Veho at 3.7 out of 5 ("Average") based on 1,153
      consumer reviews as of early 2026, with a notable concentration of 1-star reviews citing
      misdeliveries, packages shipped to incorrect warehouses or addresses, driver photos taken of the
      wrong package, and customer service described as unresponsive or unhelpful. These are end-consumer
      reviews, which Veho's brand clients likely filter through their own customer service layers. However,
      the divergence between 4.9/5 B2B CSAT and 3.7/5 consumer Trustpilot rating warrants scrutiny and
      suggests that delivery failure events—when they occur—are not being adequately resolved, potentially
      eroding brand client NPS scores downstream. BBB complaint records for Veho operations are consistent
      with the Trustpilot signal.

      Veho's January 2024 corporate layoff of approximately 19% of staff, concentrated in support and
      overhead functions, raises questions about whether customer support capacity has kept pace with the
      very rapid volume growth reported in 2025. Table TU004 summarizes key satisfaction and retention
      indicators. Figure FU004 models estimated client cohort retention percentages over time by segment,
      based on publicly referenced long-tenured client relationships.
    claimRefs:
      - CU008
      - CU009
      - CU023
      - CU024
