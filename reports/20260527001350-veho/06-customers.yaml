    title: "Eight Published Case Studies Provide Unusually Strong Customer Proof"
    body: >-
      Most growth-stage logistics companies offer narrative testimonials; Veho provides eight discrete,
      quantified case studies with named outcomes (35% cost reduction, 300% volume growth in 6 months,
      40% error reduction). The consistency of positive outcomes across verticals—fashion, food, luxury
      retail, health—suggests the value proposition is repeatable rather than cherry-picked.
