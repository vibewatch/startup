  - id: kill-criteria-diligence
    title: Kill Criteria, Monitoring Triggers, and Diligence Asks
    body: >-
      Seven thesis-break triggers are identified for Veho, spanning labor classification
      finalization, capital depletion, competitive loss, and operational deterioration.
      Monitoring these triggers requires quarterly investor updates, regulatory tracking, and
      third-party driver/consumer sentiment surveillance. Diligence priorities are: (1) current
      cash balance and monthly burn rate, (2) confirmation of current IC classification legal
      strategy and any regulatory correspondence, (3) top-5 client revenue concentration, and
      (4) driver attrition rate and average per-delivery economics. Failure to obtain items (1)
      and (3) should be treated as a blocking diligence gap.

      The capital risk is particularly acute because private market conditions in 2024–2026
      have tightened significantly from the 2021–2022 peak, and a new raise at a down-round
      valuation would impair the unicorn narrative that underpins Veho's ability to recruit
      talent and win enterprise clients. The IC reclassification risk is binary: if Veho's
      driver model is reclassified under the evolving federal or California standard, the
      additional labor cost burden (estimated at 20–35% of current driver compensation per
      industry precedent) would be existential without a simultaneous price increase or
      dramatic efficiency gain.
