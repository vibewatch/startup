  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: capital-risk
      missingEvidence: >-
        Current cash balance, monthly burn rate, and estimated runway as of Q1 2026; audited
        financial statements or management accounts confirming capital adequacy.
      whyItMatters: >-
        A pre-profitability company 4+ years from its last equity raise with no public
        financial disclosure could be within months of a distress raise; without cash runway
        data, the investment thesis cannot be assessed at current valuation.
      diligencePath: >-
        Request audited or CFO-certified cash balance and trailing-12-month burn rate as a
        condition of term sheet; negotiate board observer seat with quarterly financial information
        rights covenants.
      relatedTableRefs: [TR004]

    - type: private-evidence-only
      severity: blocking
      topic: IC-classification
      missingEvidence: >-
        External legal counsel opinion on Veho's specific exposure under the DOL 2024 final
        IC rule and the 2026 NPRM (WHD-2026-0001) for its driver engagement model.
      whyItMatters: >-
        IC reclassification is the single largest binary risk to Veho's cost model. The company's
        internal view of its exposure cannot be relied upon for diligence; an arms-length legal
        opinion is required to quantify probability and cost.
      diligencePath: >-
        Commission or request disclosure of an external counsel opinion covering: (1) Veho's
        exposure under the 2024 FLSA final rule six-factor test; (2) California AB5/Prop 22
        applicability; (3) potential retroactive wage claims. Treat absence of this opinion as a
        no-invest signal.
      relatedQuestionRefs: [QR002]
      relatedTableRefs: [TR001]

    - type: private-evidence-only
      severity: blocking
      topic: customer-concentration
      missingEvidence: >-
        Top-5 brand client names (partly known: Macy's, Lululemon, Sephora, HelloFresh), their
        individual share of Veho parcel volume or revenue, and contract duration/minimum-volume
        terms.
      whyItMatters: >-
        Without revenue concentration data, a major client departure cannot be modeled as a
        scenario. If the top 2–3 clients represent 50%+ of volume, the client loss kill trigger
        must be assessed much more conservatively.
      diligencePath: >-
        Request customer schedule disclosure with anonymization if necessary; require top-5
        client revenue share and contract term summary as a condition of due diligence access.
      relatedQuestionRefs: [QR014]

    - type: missing-source
      severity: material
      topic: driver-attrition
      missingEvidence: >-
        Quantitative driver attrition rate (quarterly or annual), time-to-fill metrics for
        driver positions in key markets, and per-delivery driver economics as of 2026 versus
        2022 baseline.
      whyItMatters: >-
        Indeed reviews document significant pay compression and dissatisfaction; without
        quantitative attrition data, the service quality and capacity risk cannot be sized.
      diligencePath: >-
        Request driver supply metrics from management: quarterly attrition rate, active drivers
        per market, average shifts per driver, and per-delivery economics trend from 2022 to 2026.
      relatedQuestionRefs: [QR009]

    - type: access-blocked
      severity: material
      topic: IC-enforcement-history
      missingEvidence: >-
        Veho's regulatory correspondence, DOL or state AG inquiries, and any internal legal
        holds or investigations regarding its driver IC model; also comprehensive PACER docket
        search for Veho Tech Inc as defendant.
      whyItMatters: >-
        Past or active enforcement actions would materially change the IC risk assessment;
        absence of evidence from incomplete public sources is not evidence of absence.
