callouts:
  - calloutType: risk
    title: "IC Reclassification Is the Existential Kill Switch"
    body: >-
      Veho's entire cost model depends on treating 70,000+ drivers as independent contractors.
      The DOL's 2024 final rule and a live 2026 NPRM signal escalating federal intent to tighten
      classification standards. If Veho's drivers are reclassified as employees under the FLSA
      or California AB5, the additional cost burden — estimated at 20–35% of current driver
      compensation per industry precedent — would be existential without a simultaneous price
      increase exceeding what the market will absorb. This is the single highest-priority
      diligence item: obtain external legal counsel opinion on Veho's specific exposure to
      the 2024 rule and the pending 2026 NPRM before closing any investment.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR005

  - calloutType: risk
    title: "Four Years Without a Raise Is a Capital Red Flag"
    body: >-
      Veho's last public equity raise closed in February 2022. With the January 2024 layoffs
      explicitly framed as profitability acceleration, and no public profitability announcement
      as of May 2026, the company has been operating for 4+ years on a fixed capital base while
      expanding from ~22 to 66 markets and opening two large new hubs. The burn rate and cash
      runway are entirely opaque from public sources. Diligence must include an audited cash
      balance and quarterly burn rate before any investment is committed.
    claimRefs:
      - CR016
      - CR017
      - CR018
      - CR021

  - calloutType: recommendation
    title: "Condition Investment on Three Diligence Blockers"
    body: >-
      Before commitment: (1) obtain current cash balance and monthly burn rate with external
      audit verification; (2) obtain external legal counsel opinion on FLSA and AB5 IC
      classification risk specific to Veho's driver engagement model; (3) require disclosure
      of top-5 client revenue concentration and contract terms. Failure to satisfy any of
      these three items should be treated as a no-invest signal at the current $1.5B unicorn
      reference valuation.
    claimRefs:
      - CR021
      - CR036
      - CR037
      - CR040

