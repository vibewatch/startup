chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Veho (Veho Tech, Inc.) is a US last-mile e-commerce delivery unicorn founded in 2016 at Harvard Business School
    by Itamar Zur and Fred Cook. The company has raised ~$300M in venture capital across a $125M Series A (Dec 2021,
    General Catalyst, $1B valuation) and a $170M Series B (Feb 2022, Tiger Global + SoftBank Vision Fund 2, $1.5B
    valuation), and by February 2026 operates in 66 US markets reaching 144 million Americans. Operational metrics
    include 7.5M+ monthly parcels, a company-claimed 4.9/5 CSAT and 99%+ on-time delivery rate, and a client roster
    that includes Macy's, Lululemon, Sephora, and HelloFresh; a January 2024 corporate layoff of ~19% of staff and
    limited public financial disclosure remain key diligence concerns.

sections:
  - id: "company-identity"
    title: "Company Identity and Business Model"
    body: >-
      Veho (legal entity: Veho Tech, Inc.) is a technology-enabled last-mile parcel delivery company founded in 2016
      and purpose-built for the requirements of e-commerce brands. The company was conceived as a Harvard Business
      School project by co-founder and CEO Itamar Zur, who experienced repeated delivery failures while relying on
      e-commerce as a student. Veho's core thesis is that last-mile delivery—historically treated as a commodity
      cost center—represents a brand-differentiating lever that drives customer retention, repeat purchase, and
      lifetime value. The company connects e-commerce shippers with a network of independent contractor
      driver-partners via proprietary logistics software, offering next-day and two-day delivery in 66 US markets
      as of February 2026, reaching 144 million Americans (44% of the US population).

      Veho's business model is a per-parcel fee arrangement charged to e-commerce brand clients. The company
      operates a network of regional parcel injection and sortation hubs (10 as of 2026), coordinates middle-mile
      movement via a fleet of ~3,000 truck movements per month, and dispatches last-mile delivery to its
      driver-partner network. Its technology stack includes a client portal (Veho Pulse) providing real-time
      exception tracking, and consumer-facing tools for delivery rescheduling, address changes, live driver
      tracking, and photo confirmation. Veho claims 35% fully-landed cost savings versus incumbent carriers
      alongside a 4.9/5 customer satisfaction score, and positions itself as the "most customer-centric parcel
      delivery platform in America." Key brand clients as of 2026 include Macy's, Lululemon, Sephora,
      EssilorLuxottica, HelloFresh, Misfits Market, thredUP, Kroger, Saks Fifth Avenue, Nordstrom, Nespresso,
      Rent The Runway, and Stitch Fix. The company's primary offices are in New York City and Austin, TX.
