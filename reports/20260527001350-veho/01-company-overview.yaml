  - id: "founders-leadership"
    title: "Founders and Leadership"
    body: >-
      Veho was co-founded by Itamar Zur (CEO) and Fred Cook (CTO). Zur started the company as a class project
      at Harvard Business School in 2016, motivated by his personal frustration with failed package deliveries
      as a student relying on e-commerce. Prior to Veho, Zur held roles at monday.com and Procter & Gamble,
      and he holds an MBA from Harvard Business School. Cook serves as co-founder and Chief Technology Officer
      and is responsible for Veho's proprietary technology platform; his prior background is not publicly
      detailed. A 2017 news article from The Heights (Boston College) mentions an early co-founder named
      "Graham" alongside Zur, suggesting an early-stage co-founder change that is consistent with references
      in founder interviews to a "co-founder breakup that almost killed the company," though the timing and
      circumstances are not publicly disclosed.

      On the executive team, Deborah Surrette was appointed Chief Commercial Officer in December 2023, following
      the departure of Eric Swanson (former CCO, who left in March 2023). Brian McDevitt served as Chief Revenue
      Officer through at least mid-2023 but reportedly departed as well, according to TechCrunch reporting. The
      company brought on Eric Swanson and McDevitt in late 2022 as part of a leadership buildout following the
      Series B; both departures within 12 months of joining signal potential organizational instability. Zur
      has remained the consistent public face of Veho and is the primary person identified with the company
      across all media coverage. Key-person risk is moderate to high given the limited information available
      on the full board and executive team composition.
