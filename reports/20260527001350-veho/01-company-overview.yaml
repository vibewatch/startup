  - id: "operations-scale"
    title: "Operational Scale and Market Presence"
    body: >-
      As of February 2026, Veho operates in 66 US markets reaching 144 million Americans (44% of the US
      population), up from 44 markets in 2024—a 50% year-over-year increase. New market launches in February
      2026 included Phoenix, Scottsdale, Las Vegas, San Diego, Allentown, and Athens (GA), plus full Los
      Angeles metro coverage. The company simultaneously opened two new regional hubs in Phoenix and Ontario,
      California, totaling more than 150,000 square feet and located near major air, rail, and port terminals
      including the Ports of Los Angeles and Long Beach. The company reported that it processed more than 7.5
      million packages per month across its 10 regional sortation hubs and 3,000 truck movements per month.

      Veho's network includes more than 70,000 independent contractor driver-partners nationwide. The company
      reported tripling new client launches and doubling parcel volume in the 12 months prior to February 2026,
      and its client base grew approximately 70% year-over-year per Fast Company's March 2026 recognition.
      Operational metrics claimed by Veho include a 4.9/5 consumer satisfaction score, 99%+ on-time delivery
      rate, and 35% fully-landed cost savings versus traditional carriers. These metrics are company-stated
      and have not been independently audited; a third-party operational review would be required to validate
      them. Revenue is estimated at approximately $31.7 million annually by third-party databases, but Veho
      does not publicly disclose financials and the figure is not verified. Headcount is estimated at
      700–984 employees across corporate and warehouse teams, following the January 2024 corporate reduction.
