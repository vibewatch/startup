callouts:
  - calloutType: "strength"
    title: "Unicorn Traction with Coast-to-Coast Momentum"
    body: >-
      Veho achieved unicorn status in under six years, raised $300M from top-tier investors including General
      Catalyst, Tiger Global, and SoftBank, and scaled to 66 markets reaching 144 million Americans by
      February 2026—a 50% YoY expansion. Its client base grew 70% YoY with brand partners including Macy's,
      Lululemon, and Sephora, and the company doubled parcel volume and tripled new client launches in the
      prior 12 months. Fast Company's 2026 Most Innovative Companies recognition adds independent credibility.
    claimRefs:
      - CO013
      - CO017
      - CO025
      - CO026
      - CO033
      - CO037

  - calloutType: "risk"
    title: "Profitability Pressure, Leadership Churn, and Opaque Financials"
    body: >-
      Veho laid off ~19% of its corporate workforce in January 2024 to accelerate profitability, following
      earlier support-staff cuts and offshore shifts. Two C-suite executives (CCO and reportedly CRO) departed
      within 12 months of joining in 2022. The company does not disclose revenue, EBITDA, burn rate, or
      runway. No new equity or debt financing has been publicly announced since February 2022, and the $1.5B
      valuation is 3+ years stale. The gap between the company's headcount reduction and its claimed market
      expansion raises questions about unit economics and capital efficiency.
    claimRefs:
      - CO034
      - CO035
      - CO036
      - CO043
      - CO044

  - calloutType: "insight"
    title: "Brand-Centric Differentiation as Competitive Moat"
    body: >-
      Veho's stated customer outcomes—20% increase in repurchase rates, 40% increase in customer lifetime
      value, 8-point NPS improvement for brand clients—frame delivery as a retention tool rather than a
      logistics function. If these metrics are validated by independent audit, they represent a defensible
      differentiation from incumbent carriers (UPS, FedEx) that compete primarily on price and network
      density rather than brand experience. The FlexSave product launch in 2025–2026 suggests Veho is also
      pursuing cost competitiveness to expand addressable volume.
    claimRefs:
      - CO004
