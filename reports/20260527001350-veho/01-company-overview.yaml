  - id: "funding-capital"
    title: "Funding History and Capital Stack"
    body: >-
      Veho has raised approximately $300 million in venture capital across multiple rounds with no publicly
      disclosed debt, secondary transactions, or additional equity beyond the Series B. The Series A, announced
      December 21, 2021, raised $125 million at a $1 billion post-money valuation and was led by General Catalyst
      with Kyle Doherty as the lead partner. The round made Veho one of the fastest US logistics companies to
      achieve unicorn status. The Series B, announced February 15, 2022—just six weeks after the Series A—raised
      $170 million at a $1.5 billion post-money valuation (some sources cite $1.6 billion; the more conservative
      $1.5B figure is used throughout this chapter as the contemporaneous Reuters-reported value). The Series B
      was led jointly by Tiger Global Management and SoftBank Vision Fund 2, with continued participation from
      General Catalyst, Bling Capital, Construct Capital, Industry Ventures, and Origin Ventures. Mantis VC,
      the venture fund of pop duo The Chainsmokers, also participated. Notable angel investors include the
      founders and CEOs of Allbirds, Flexport, and Warby Parker.

      No new institutional round has been publicly announced as of May 2026, and Veho has not filed publicly
      for an IPO (no S-1 or registration statement identified). The company's capital position was described
      as "very strong" in early 2024, but with no disclosed financials, burn rate and runway are unknown.
      At a last-known $1.5 billion valuation, the company has operated in a private, undisclosed financial
      posture since the Series B in 2022.
