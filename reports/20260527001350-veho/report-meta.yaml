companyProfile:
  summary: >-
    Veho (Veho Tech, Inc.) is a US-based tech-enabled last-mile delivery unicorn founded in 2016 at Harvard Business
    School by Itamar Zur (CEO) and Fred Cook (CTO). The company operates a proprietary software platform and a
    crowdsourced network of approximately 120,000 independent contractor driver-partners across 66 US markets, reaching
    an estimated 144 million Americans (44% of the US population) as of early 2026. Veho focuses exclusively on premium
    and mid-market direct-to-consumer e-commerce brands, offering per-parcel delivery with no residential surcharges,
    no weekend fees, and a white-glove delivery experience. The company has raised approximately $301M across three
    venture rounds, achieving a $1.5B unicorn valuation at its February 2022 Series B, but has not publicly raised
    additional equity since. Veho processed an estimated 7.5 million parcels per month in early 2026 and reported
    approximately 90% revenue growth in 2023; audited financials remain undisclosed.
  foundedDate: '2016-01-01'
  founders:
    - name: Itamar Zur
      role: Co-Founder & CEO
      background: MBA from Harvard Business School; prior roles at monday.com and Procter & Gamble.
      claimRefs: [CO010, CO011]
    - name: Fred Cook
      role: Co-Founder & CTO
      background: Technical co-founder listed on Veho's official About Us page; background details not publicly disclosed.
      claimRefs: [CO002]
  foundingLocation: Boulder/Denver, Colorado, USA
  headquarters: New York, NY, USA
  productSummary: >-
    Veho sells per-parcel last-mile delivery services to e-commerce brands under its Ground Plus (1–3 business day),
    Same Day, and Next Day offerings, with a premium on consumer experience (real-time tracking, photo-on-delivery,
    flexible reschedule). The proprietary MaestroAI routing platform orchestrates dispatch and optimization across
    the IC driver network. Ancillary products include Doorstep Pickup (returns), 3PL value-added services at 9 regional
    hubs, and FlexSave (beta, Q1 2026), which offers lower per-parcel rates in exchange for delivery flexibility.
  customerFocus: >-
    Premium and mid-market direct-to-consumer e-commerce brands in fashion, beauty, food/meal-kit, luxury retail,
    and home goods. Named clients include Macy's, Lululemon, Sephora, Saks Fifth Avenue, HelloFresh, Misfits Market,
    Kroger, EssilorLuxottica, Stitch Fix, and thredUP. Platform integrations via ShipStation and ShipHero extend
    reach to more than 5,000 smaller merchants.
  businessModel: >-
    Per-parcel fee model with no residential surcharges, weekend fees, or peak-season upcharges. Revenue is driven
    primarily by Ground Plus parcel volume. Ancillary revenue streams include 3PL warehousing and value-added services.
    The IC driver model eliminates fixed labor overhead, enabling Veho to claim 35% fully-landed cost savings versus
    incumbents for its target customer base.
  stage: Series B
  fundingStatus: >-
    Three disclosed equity rounds: $4.16M seed (July 2020, SEC Form D), $127M Series A (December 2021, led by General
    Catalyst), and $170M Series B (February 2022, led by Tiger Global and SoftBank Vision Fund 2) at a $1.5B
    post-money valuation. Total raised approximately $301M. No public equity raise since February 2022; the January
    2024 corporate layoffs were explicitly framed as a step toward profitability rather than a capital raise trigger.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO005, CO006, CO025, CI009, CI010, CI011, CI012, CI016, CE019, CU032]
summary:
  headline: >-
    Veho is a high-growth last-mile delivery operator with genuine brand differentiation and strong customer outcomes,
    but existential IC reclassification risk, a four-year-stale $1.5B valuation mark, and complete financial opacity
    cap conviction at "track" pending audited financials and a capital raise event.
