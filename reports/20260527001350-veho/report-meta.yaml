coverageNotes: >-
  Coverage reflects public Veho materials, SEC filings, trade and industry reporting, customer case studies, consumer
  review platforms, regulatory filings, logistics-industry analyst coverage, and fetched source texts reviewed through
  May 27, 2026. Evidence is strong on Veho's founding history, funding chronology, operational footprint (66 markets,
  120,000+ IC drivers, 7.5M parcels/month), named brand client roster, and customer outcome claims. Evidence is weak
  or unavailable on audited financials, gross margin, burn rate, cash position, NRR, and CAC/LTV — all are
  company-private and undisclosed. The $1.5B Series B valuation from February 2022 is the only external valuation
  anchor; no re-mark, down-round, or M&A transaction has emerged to update it. This report treats operational momentum
  as real and well-supported but most financial underwriting inputs as provisional and unverifiable from public sources.
