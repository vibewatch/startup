      label: Collect Microsoft and customer telemetry
      detail: Sentinel, Defender, M365, endpoint, identity, and cloud signals are ingested from the customer environment.
    - id: enrich
      label: AI enrichment and deterministic triage
      detail: BlueVoyant AI and automation enrich alerts, remove noise, and prepare decision-ready cases.
    - id: analyst
      label: SOC analyst review
      detail: Human analysts validate important events, tune logic, and decide whether to escalate or automate.
    - id: act
      label: Contain or optimize
      detail: The platform can isolate devices, revoke credentials, remove malicious email, or optimize Microsoft controls and spend.
    - id: feedback
      label: Continuous optimization loop
