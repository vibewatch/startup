- id: trust-roadmap-and-product-risks
  title: Trust controls, capability expansion, and product risks
  body: 'BlueVoyant has enough public trust and roadmap proof to support enterprise diligence, but not enough to eliminate buyer follow-up. The Trust Center confirms that the company wants to be seen as a cloud-native, AI-plus-human platform with more than 1,000 clients, while the Microsoft and Conquest materials show explicit alignment to compliance-heavy environments. Conquest is particularly important because it expands BlueVoyant from detection and risk visibility into risk-maturity mapping, posture management, and government-oriented compliance workflows such as CMMC and FedRAMP-adjacent environments. At the same time, the public developer surface is thin: GitHub shows only one visible public repository, and that repository is branded as content for Copilot for Security rather than core platform code or reusable integrations. Independent review and community sources also surface real caution signals—occasional DRP takedown friction, long-running questions about proprietary depth, and
    limited public evidence for non-Microsoft integrations, SLAs, or independently audited product performance.'
