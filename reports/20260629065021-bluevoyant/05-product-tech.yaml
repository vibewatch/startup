- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Key dependency
  - Main risk
  rows:
  - - Customer telemetry and asset surfaces
    - Supply internal, external, and supplier signals into the platform
    - Customer tenancy, cloud workloads, endpoints, suppliers, and dark-web monitoring access
    - Public materials do not explain normalization, retention, or cross-domain schema design
  - - Microsoft-native data plane
    - Provides Sentinel, Defender, identity, and compliance context for MDR workflows
    - Microsoft ecosystem depth and continued API / feature access
    - A heavy Microsoft concentration raises concentration risk if buyers want broader heterogeneous-stack transparency
  - - AI and deterministic automation layer
    - Enriches, triages, and can trigger automated containment actions at machine speed
    - Model tuning, playbooks, approval logic, and data quality
    - Public evidence does not expose model-governance, evaluation, or rollback controls
  - - Human analyst layer
    - SOC and ROC experts validate alerts, tune logic, and communicate with customers or vendors
    - Skilled labor availability and repeatable processes
    - Service quality can become people-intensive as volume scales
  - - Third-party risk analytics layer
    - Monitors vendors, risk events, questionnaires, and remediation workflows
    - Large external data-source coverage plus customer vendor inventories
    - No public documentation of customer-side integrations into procurement or GRC systems
  - - External takedown and monitoring network
    - Executes brand, app, social, and credential-remediation outcomes
    - Registrars, social platforms, app stores, and underground-source access
    - Outcome quality can vary with external platform responsiveness
  - - Conquest posture and compliance layer
    - Extends the platform into posture, maturity, and government-oriented compliance workflows
    - Successful post-acquisition product integration
    - Public sources do not show whether the UX is fully unified or still portfolio-level
  notes: The architecture is synthesized from reviewed product pages, releases, and Microsoft collateral rather than from a vendor-published engineering diagram.
