      label: Signal surfaces
      detail: Internal telemetry, supplier monitoring, web and dark-web monitoring, and customer asset context feed the product.
    - id: partner-stack
      label: Platform dependencies
      detail: Microsoft security tooling, registrar or social-platform workflows, customer-tenancy data, and external risk feeds provide the operating substrate.
    - id: orchestration
      label: BlueVoyant orchestration core
      detail: Cyber Defense Platform packages MDR, TPRM, DRP, and professional services into one cloud-native operating model.
    - id: ai-layer
      label: AI and automation layer
      detail: BlueVoyant AI pairs deterministic automation, response playbooks, and agents to enrich, triage, and contain threats.
    - id: human-layer
