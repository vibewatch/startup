tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary buyer or user
  - Current public maturity
  - Differentiation signal
  - Diligence gap
  rows:
  - - Cyber Defense Platform
    - CISO, SOC leader, security operations team
    - Current umbrella product
    - Converges MDR, TPRM, DRP, and services on one cloud-native surface
    - No public architecture document that shows shared schemas, tenancy, or data-routing details
  - - BlueVoyant AI
    - BlueVoyant SOC or customer SOC
    - New 2026 launch / active go-to-market
    - Agentic model pairs human judgment, deterministic automation, and AI agents with managed or self-service deployment
    - No public benchmark pack for false-positive reduction, MTTR change, or model-governance details
  - - MDR for Microsoft
    - Microsoft-native security teams
    - Core and deeply evidenced
    - Most concrete technical proof in the portfolio, including tenant-resident data handling and specific Microsoft stack coverage
    - Breadth outside Microsoft tools is still described only at a higher level
  - - Continuous Optimization for Microsoft Solutions
    - Security engineering, compliance, and platform-ops teams
    - Current module / advisory-plus-software layer
    - Extends beyond monitoring into Sentinel, Defender, M365, and Purview optimization
    - Commercial packaging, repeatability, and automation depth are not publicly broken out
  - - Third-Party Risk Management / Supply Chain Defense
    - Vendor-risk, procurement, and cyber-risk teams
    - Current and feature-complete in public materials
    - Combines continuous monitoring, remediation, questionnaires, and advisory work instead of only passive scoring
    - Software versus analyst-labor contribution is not publicly quantified
  - - Digital Risk Protection
    - Brand-protection, fraud, and external-risk teams
    - Current and modular
    - Covers web, social, app, dark-web, and executive-protection workflows with published takedown metrics
    - Outcome quality depends on external platforms and partner responsiveness
  - - Conquest-enhanced compliance and posture layer
    - Defense, government, and regulated buyers
    - Integration-stage capability expansion
    - Adds risk-maturity, posture, and compliance mapping useful for CMMC-heavy environments
    - Public sources do not show how completely Conquest workflows are now embedded in core BlueVoyant UX
  notes: Rows separate currently marketed modules from the acquisition-expanded posture/compliance layer that is still best evidenced through release materials.
