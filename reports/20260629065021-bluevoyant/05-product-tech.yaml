- id: third-party-risk-and-supply-chain-workflows
  title: Third-party risk and supply-chain workflows
  body: 'BlueVoyant’s supply-chain defense materials are specific enough to treat TPRM as a productized workflow, not just a consulting wrapper around external ratings. The current TPRM overview, the continuous-monitoring page, and the 2023 expansion release align on the same operating model: vendor monitoring is tiered by risk, BlueVoyant analysts validate findings inside a Risk Operations Center, and remediation is driven directly with suppliers instead of being left entirely to the customer. Questionnaire management is also described as both software and managed service, which fits the overall BlueVoyant pattern of combining automation with labor-intensive execution where the workflow is messy. Publicly, the best substantiated differentiators are analyst-directed remediation, zero-day alerting, AI/ML-based business-risk monitoring, and the ability to combine continuous monitoring with periodic due-diligence assessments. The remaining diligence question is how much of this is repeatable
    software leverage versus scale achieved through expert staffing and service process discipline.'
  claimRefs:
  - CE019
  - CE020
  - CE021
  - CE022
