  summary: The public product story resolves into a five-layer stack from signal collection through AI orchestration and analyst-driven outcomes.
  approximationNotes: This figure is synthesized from current product pages, launch releases, trust-center metadata, and Microsoft collateral rather than copied from a vendor-published system diagram.
