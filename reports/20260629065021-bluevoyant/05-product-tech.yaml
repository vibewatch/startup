- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow problem
  - BlueVoyant solution
  - Published benefit or operating signal
  - Limitation
  rows:
  - - Microsoft SOC triage and containment
    - Too many alerts across Sentinel, Defender, identity, endpoint, and cloud surfaces
    - MDR for Microsoft plus BlueVoyant AI
    - 24/7 monitoring, automated response actions, and high-fidelity alerting are explicitly marketed
    - Public proof is strongest for claims, not for independent measured outcomes
  - - Microsoft cost and posture optimization
    - Customers overpay or under-configure Sentinel, Defender, M365, and Purview
    - Continuous Optimization for Microsoft Solutions
    - BlueVoyant cites 1,000+ engagements and cost-control guidance for licensing and Sentinel consumption
    - Savings methodology and realized customer distributions are not public
  - - Third-party critical finding remediation
    - Vendor-risk teams discover issues but struggle to drive closure
    - Continuous Monitoring & Remediation
    - ROC analysts validate findings and contact third parties directly
    - No public disclosure of closure-rate distributions by customer segment
  - - Supplier assessment operations
    - Questionnaires are manual, slow, and hard to verify
    - Questionnaire Management platform and managed service
    - Automation plus validation of supplier claims is presented as the differentiator
    - Public material does not show integrations into customer GRC stacks
  - - Brand impersonation takedowns
    - Phishing sites, fake pages, and rogue apps move quickly across many platforms
    - Brand Protection
    - Unlimited takedowns and 300+ app-store coverage are marketed, with public success metrics on the homepage
    - Takedown success still depends on registrar, social, or app-store cooperation
  - - Credential, fraud, and leak monitoring
    - Security teams lack visibility into underground communities and leaked data
    - Dark Web Watcher
    - Continuous monitoring of underground sources plus account-takeover and leakage workflows are described
    - Public evidence does not show signal-to-noise ratios or time-to-detect distributions
  - - Executive-targeted attack prevention
    - VIPs face personal-data exposure and account-takeover risk outside core IT controls
    - Executive Cyber Guard
    - Real-time alerts and tools to stop attacks are part of the marketed workflow
    - Public materials do not quantify adoption or measured executive-risk reduction
  notes: This table focuses on user jobs and operational workflows, not on contractual SKUs or internal package names.
