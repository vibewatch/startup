  evidenceGaps:
  - type: missing-source
    severity: material
    topic: non-microsoft-integrations
    missingEvidence: A named public catalog of non-Microsoft SIEM, EDR, cloud, ticketing, and GRC integrations with deployment examples.
    whyItMatters: The current public proof is strong for Microsoft but much thinner for heterogeneous enterprise environments, which affects implementation risk and switching-cost analysis.
    diligencePath: Request an integration matrix, sample reference architecture, and two deployment examples in non-Microsoft-heavy customer environments.
    relatedQuestionRefs:
    - QE019
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: reliability-and-sla
    missingEvidence: Public or customer-shareable SLA terms, uptime history, incident-history summary, and service-credit language for the platform and managed services.
    whyItMatters: Without reliability evidence, buyers cannot underwrite whether the broad product scope is supported by production-grade operational performance.
    diligencePath: Request the standard SLA, a twelve-month uptime and incident summary, and any customer-facing status-history export.
    relatedQuestionRefs:
    - QE018
    relatedTableRefs:
    - TE004
  - type: access-blocked
    severity: minor
    topic: public-certification-detail
    missingEvidence: Readable public details for the trust-center certificate inventory and the exact scope of public trust documents.
    whyItMatters: The Trust Center clearly exists, but the fetched public surface does not expose the full certificate detail in text form, limiting external verification of claimed controls.
    diligencePath: Ask BlueVoyant for guest-access screenshots or downloadable certificate packs that enumerate current reports, standards, and covered services.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE004
