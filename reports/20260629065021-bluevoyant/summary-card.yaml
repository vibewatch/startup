summary:
  headline: >-
    BlueVoyant is a credible late-stage cybersecurity platform with real MDR and TPRM scale, differentiated
    regulated-industry positioning, and strong Microsoft ecosystem leverage, but its private-company opacity and
    unresolved valuation/revenue conflicts justify a track posture rather than a conviction buy.
