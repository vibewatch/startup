  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Public evidence
  - Monetization visibility
  - Quality / caveat
  - Diligence ask
  rows:
  - - Managed Detection & Response
    - Recurring managed monitoring and response
    - 1,200+ Sentinel deployments; 24x7 SOC coverage
    - Contracted / recurring, but list pricing not public
    - Strong demand proxy; weak pricing transparency
    - Request contract terms, seat/device basis, and gross margin by customer segment
  - - Third-Party Risk Management
    - Recurring monitoring, validation, and remediation support
    - 18x faster remediation; 98% accuracy; GCP marketplace route
    - Recurring / enterprise procurement eligible
    - Outcome data strong; revenue realization opaque
    - Request per-vendor pricing, remediation fees, and attach rates
  - - Digital Risk Protection
    - Ongoing monitoring and takedown services
    - 50,000 domain takedowns over two years; social and website takedown success rates
    - Likely recurring service bundle
    - High activity signal; no price disclosure
    - Request pricing by protected brand/account and takedown economics
  - - Professional Services / DFIR
    - Project, retainer, and advisory revenue
    - Homepage and case studies position incident response and strategic services alongside MDR
    - Project / retainer mix not disclosed
    - Most likely lumpy compared with MDR/TPRM
    - Request retainer attach rate and services utilization data
  notes: Official pages show the revenue mechanisms clearly, but they do not reconcile stream mix, realized pricing, or stream-level margin.
