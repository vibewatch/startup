figures:
- id: FI001
  title: Revenue model bridge
  type: flow
  layout: wide
  summary: BlueVoyant converts direct demand, partner demand, and marketplace access into recurring managed-security revenue plus a smaller professional-services layer, but public materials stop before realized gross profit can be quantified.
  data:
    nodes:
    - id: direct
      label: Direct enterprise sales
      detail: Field sellers and solution engineers position MDR, TPRM, DRP, and advisory offers to large organizations.
      tone: positive
    - id: partners
      label: Channel partners
      detail: GuidePoint, CDW, and other partners expand sourcing and implementation reach.
      tone: positive
    - id: marketplace
      label: Cloud marketplace procurement
      detail: GCP marketplace eligibility lowers buying friction for TPRM.
      tone: positive
    - id: recurring
      label: Managed recurring revenue
      detail: MDR, TPRM, and DRP appear to be the most recurring-like revenue streams.
      tone: positive
    - id: services
      label: Professional services
      detail: DFIR, advisory, and project work likely add non-recurring or retainer revenue.
      tone: neutral
    - id: expansion
      label: Renewal and expansion pool
      detail: Customer growth, deployments, and marketplace access suggest upsell potential.
      tone: positive
    - id: margin
      label: Gross profit sensitivity
      detail: Utilization, staffing, and partner economics determine how much revenue converts to retained gross profit.
      tone: warning
  approximationNotes: This bridge is qualitative because public materials expose route-to-market and outcomes but not realized revenue mix or gross margin by stream.
  claimRefs:
  - CI001
  - CI011
  - CI017
  - CI034
  - CI038
  - CI060
- id: FI002
  title: Unit economics bridge
  type: flow
  layout: wide
  summary: BlueVoyant presents strong customer-value proxies and outsourcing economics, but the public trail breaks before CAC, payback, and margin can be measured directly.
  data:
    nodes:
    - id: outcomes
      label: Outcome claims
      detail: TEI studies and case studies cite ROI, alert reduction, and remediation speed.
      tone: positive
    - id: altcost
      label: In-house alternative cost
      detail: BlueVoyant frames the customer alternative as >$1.2M self-build cost and up to $750k of internal optimization spend.
      tone: positive
    - id: channel
      label: Partner-sourced pipeline
      detail: Partners generated 50% of 2021 new business, indicating some sales leverage.
      tone: positive
    - id: delivery
      label: 24x7 service delivery
      detail: Always-on MDR and global customer support imply staffing-intensive fulfillment.
      tone: warning
    - id: pricing
      label: Realized pricing unknown
      detail: Public sources do not disclose discounting, minimum commits, or renewal uplift.
      tone: warning
    - id: opaque
      label: CAC / payback / margin unresolved
      detail: Public evidence never closes the loop on CAC, payback, gross margin, or NRR.
      tone: negative
  approximationNotes: Nodes summarize evidence quality, not hidden internal telemetry; downstream economic outputs remain intentionally unresolved.
