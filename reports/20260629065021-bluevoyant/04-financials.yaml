- id: TI007
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Current proxy
  - Specific diligence path
  rows:
  - - Cash on hand / runway
    - Determines financing dependency and next-round urgency
    - Large past raises and ongoing expansion only
    - Request current balance sheet, cash forecast, and board runway scenario deck
  - - Monthly burn and hiring plan
    - Shows whether growth is self-funded or cash-consuming
    - Cork expansion, CFO buildout, and customer growth are indirect proxies
    - Request monthly burn bridge, hiring plan, and variance to budget
  - - Gross margin by product line
    - Needed to separate software-like recurring economics from staffing-heavy service economics
    - TEI and case studies show outcomes, not margin
    - Request gross margin and utilization by MDR, TPRM, DRP, and services
  - - Realized pricing / discounts
    - Needed to judge price discipline and renewal quality
    - Marketplace route and build-vs-buy framing only
    - Request price books, discount approvals, and recent contract samples
  - - Debt schedule and covenants
    - Needed to understand leverage, restrictions, and refinancing risk
    - Only a historical 2020 Debt-PPP trace surfaced directly
    - Request lender agreements, covenant package, and any acquisition-related borrowing
  notes: Nulls here are intentional diligence blockers rather than formatting omissions; they mark the minimum dataset required for underwriting.
