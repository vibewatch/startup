- id: capital-base-and-conflicts
  title: Capital base, investor syndicate, and conflicting private-company signals
  body: 'BlueVoyant''s capital history clearly includes two large late-stage rounds: a $250 million Series D in 2022 and a more-than-$140 million Series E tied to the Conquest Cyber acquisition in 2023. Liberty Strategic Capital and ISTARI are recurring anchors in that investor base, with Eden Global Partners recurring as adviser or participant. Beyond that, third-party databases start to diverge. CB Insights and Clay both report roughly $665.5 million of cumulative funding, while Tracxn reports $696 million; investor counts vary from 9 on a historical PitchBook snapshot to 11 on Clay and 15 on CB Insights. Revenue signals diverge even more sharply, with GetLatka showing a $213.5 million 2025 estimate while CB Insights shows $750 million for 2024. Those contradictions do not prove any single source is wrong, but they do make plain that the public/private data exhaust is insufficiently reconciled for investment underwriting without management confirmation.'
