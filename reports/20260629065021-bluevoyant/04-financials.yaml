- id: TI006
  title: Conflicting private-company financial signals table
  columns:
  - Metric
  - Source A
  - Source B
  - Source C
  - Why it conflicts / how to use
  rows:
  - - Total raised
    - 'CB Insights: $665.5M over 9 rounds'
    - 'Clay: $665.5M total raised'
    - 'Tracxn: $696M over 6 rounds'
    - Consensus is roughly mid-$600Ms, but round counting and treatment differ; management should provide the cap table
  - - Revenue / ARR
    - 'GetLatka: $213.5M in 2025'
    - 'CB Insights: $750M in 2024'
    - No official revenue disclosure
    - These figures are not directly reconcilable and could reflect ARR vs broader revenue vs stale estimates
  - - Employees
    - 'Company page: >600'
    - 'GetLatka: 650; Dialectica: 653'
    - 'PitchBook snapshot: 363'
    - Later sources cluster around 600+, while the accessible PitchBook snapshot looks stale or partial
  - - Investor count
    - 'Clay: 11 investors'
    - 'CB Insights: 15 investors'
    - 'PitchBook snapshot: 9 investors'
    - Database coverage varies; use public round announcements plus cap table request instead of any single count
  - - Latest deal history
    - Series E $140M in 2023 appears in official/news sources
    - PitchBook accessible snapshot shows latest deal amount of $30M
    - PitchBook also shows historical Debt-PPP entry
    - A stale or archived profile can materially distort current financing and leverage assumptions
  notes: The point is not to choose a favorite database; it is to preserve contradictory estimates until management reconciles them.
