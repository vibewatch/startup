  - - Partner-sourced new business
    - 50% of 2021 new business
    - medium
    - Suggests distribution leverage beyond direct sales headcount
    - Request partner-sourced pipeline, win-rate, and margin split
  - - Build-vs-buy alternative cost
    - '>$1.2M self-build annual SOC cost'
    - medium
    - Frames customer ROI and willingness-to-pay ceiling
    - Request ROI model assumptions and actual competitive win-loss data
  - - Outsourced SOC savings claim
    - <25% of internal SOC cost
    - medium
    - Supports payback narrative but not realized price
    - Request contract examples and customer payback models
  - - MDR TEI value proxy
    - 210% ROI; 90% fewer escalated alerts; 70% faster MTTR
    - medium
