- id: TI005
  title: Capital adequacy table
  columns:
  - Dimension
  - Public signal
  - Source-backed value / status
  - Underwriting implication
  - Diligence ask
  rows:
  - - Series D equity capital
    - Large late-stage round
    - 2022 Series D, $250M, Liberty Strategic Capital lead
    - Material balance-sheet support for scale-up and hiring
    - Request post-money cash bridge and uses of proceeds
  - - Series E + acquisition capital
    - Acquisition-linked growth funding
    - '> $140M Series E alongside Conquest acquisition in 2023'
    - Shows continued investor support and M&A appetite
    - Request integration budget and revenue contribution from Conquest
  - - Investor base depth
    - Repeat strategic sponsors
    - Liberty, ISTARI/Temasek, Eden, 8VC, plus varying database investor counts
    - Syndicate quality looks strong, but exact breadth is inconsistent
    - Request current cap table and ownership by round
  - - Debt / leverage signal
    - Only historical public debt trace retained
    - PitchBook snapshot shows 2020 Debt-PPP entry; no retained current debt facility
    - Current leverage may be zero, modest, or simply undisclosed
    - Request debt schedule, lender names, and covenant package
  - - Cash / burn / runway
    - Not publicly disclosed
    - No retained public source verified them as of run date
    - This is the largest underwriting blocker
    - Request latest cash balance, burn, and runway model
  - - Regional expansion commitments
    - EMEA buildout and SOC expansion visible
    - Cork opening tied to multi-million-euro investment and 70% local revenue growth
    - Expansion suggests ongoing spend even without cash disclosure
    - Request EMEA hiring plan, opex, and expected payback
  notes: Historical funding chronology belongs in Company Overview; this table focuses on forward adequacy and current blind spots needed for underwriting.
