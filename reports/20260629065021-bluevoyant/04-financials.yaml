chapter:
  number: 4
  title: Financials
  summary: BlueVoyant shows clear demand, large late-stage financing, and credible enterprise-delivery scale, but the public record remains too thin on cash, burn, realized pricing, and gross margin to underwrite revenue quality confidently. Private-company databases also disagree materially on revenue, headcount, investor count, and total capital raised, so contradictory estimates must be preserved rather than averaged away.
sections:
- id: revenue-model-pricing
  title: Revenue model and monetization visibility
  body: BlueVoyant's public commercial surface looks like a recurring cybersecurity platform wrapped around MDR, TPRM, DRP, and professional services rather than a one-off project business. The homepage and product materials emphasize ongoing monitoring, response, remediation, and takedown work, while customer proofs and TEI studies reinforce a subscription-or-retainer style value proposition. That said, the public record is much stronger on outcomes than on monetization detail. BlueVoyant discloses deployment counts, ROI claims, and marketplace procurement routes, but it does not publish standard list prices for its core offers, nor does it expose realized pricing, discounting, or revenue mix between recurring managed services and project-based work. The result is a clear top-line revenue mechanism but an incomplete view of revenue quality and contribution margin by stream.
  claimRefs:
