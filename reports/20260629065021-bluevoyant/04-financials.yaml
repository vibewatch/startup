- id: gtm-sales-efficiency
  title: GTM motion and sales-efficiency proxies
  body: 'BlueVoyant appears to scale through a hybrid of direct enterprise selling, partner-led demand, and lower-friction cloud-marketplace procurement. The company explicitly says partners contributed half of all new business in 2021, and its channel pages show that reseller and consulting relationships are central rather than incidental. That matters because partner leverage can offset the staffing intensity that usually accompanies 24x7 managed services. BlueVoyant also markets hard savings arguments against the in-house SOC alternative, claiming both that self-build can exceed $1.2 million annually and that an MSSP can cost under one quarter of that level. Customer-value studies add more evidence, though they are company-sponsored: the Forrester TEI materials, ODEON outcomes, and Sentinel case-study guide all point to meaningful operational savings, but they still stop short of giving true CAC, payback, or realized gross-margin data.'
