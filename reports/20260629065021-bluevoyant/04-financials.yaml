  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-opacity
    missingEvidence: Current cash balance, monthly burn, runway bridge, and board-approved financing plan.
    whyItMatters: Without cash and burn data, the public record cannot answer whether BlueVoyant can self-fund growth or needs another financing event soon.
    diligencePath: Request the latest monthly management accounts, cash forecast, debt schedule, and board financing materials.
    relatedQuestionRefs:
    - QI013
    relatedTableRefs:
    - TI005
    - TI007
  - type: private-evidence-only
    severity: material
    topic: unit-economics-opacity
    missingEvidence: Gross margin by product line, delivery utilization, CAC, payback period, and NRR/churn metrics.
    whyItMatters: Revenue growth alone does not show whether BlueVoyant's managed-service model scales efficiently or whether service delivery is margin-dilutive.
    diligencePath: Request cohort-level bookings, renewal, CAC, and gross-margin data for MDR, TPRM, DRP, and professional services.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI003
    - TI007
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: Realized contract values, discounting ranges, minimum commitments, and list-to-realized pricing conversion by offer.
    whyItMatters: The public record shows procurement routes and ROI claims but not whether realized pricing supports durable gross profit.
    diligencePath: Request recent customer contracts, price books, discount policies, and renewal uplifts by channel.
    relatedQuestionRefs:
    - QI003
    - QI021
    relatedTableRefs:
    - TI002
    - TI007
  - type: conflicting-data
    severity: material
    topic: conflicting-private-metrics
    missingEvidence: A reconciled investor-approved KPI sheet covering revenue/ARR, headcount, investor count, total raised, and latest deal history.
    whyItMatters: CB Insights, GetLatka, Clay, Tracxn, Dialectica, and PitchBook disagree on headline metrics enough to change underwriting assumptions materially.
    diligencePath: Request management's current KPI deck and cap table, then reconcile every third-party database to management's source of truth.
    relatedQuestionRefs:
    - QI022
    - QI023
    - QI024
    relatedTableRefs:
    - TI006
  - type: missing-source
    severity: material
    topic: debt-obligations
    missingEvidence: Current debt schedule, covenant package, credit facilities, and any post-2023 borrowing documentation.
    whyItMatters: Only a historical 2020 PPP debt signal surfaced directly; absent debt documentation leaves leverage and covenant risk unknown.
    diligencePath: Request the latest debt summary, lender agreements, and any side letters tied to acquisitions or regional expansions.
    relatedQuestionRefs:
    - QI013
    relatedTableRefs:
    - TI005
    - TI007
