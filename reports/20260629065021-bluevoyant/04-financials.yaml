  - - TPRM on GCP Marketplace
    - Marketplace availability public; no numeric list price disclosed
    - No public net price, discount, or minimum commit
    - Cloud marketplace / enterprise agreement
    - Should reduce procurement friction and channel cycle time
  - - Microsoft optimization services
    - Blog says internal optimization can cost up to $750k annually
    - No BlueVoyant service price card disclosed
    - Direct enterprise sale, likely consultative
    - Supports advisory upsell logic, not actual BlueVoyant pricing realization
  - - Partner-assisted deals
    - Partner contribution hit 50% of new business in 2021
    - Channel discounts and rev-share not disclosed
    - Resellers, consultancies, and technology partners
    - Could improve top-of-funnel efficiency while compressing realized price
  - - Customer case-study expansions
    - Odeon and Snappi show multi-product land-and-expand motion
    - No disclosed contract values
    - Direct / partner blend
    - Supports wallet-share story without supplying ARR per account
  notes: This table separates public procurement routes from missing realized-price data; the public record shows how buyers can buy, not what they actually pay.
