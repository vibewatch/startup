  topStrengths:
    - BlueVoyant 在一个平台里覆盖 MDR、TPRM、DRP 和服务，销售的是统一网络防御，而不是单点控制。
    - 公司已有可信企业规模：在 45 个国家超过 1,000 名客户、600 多名员工，并在公共部门和受监管行业拿到有分量的进展。
    - BlueVoyant 的 Microsoft 专长是耐久的 go-to-market 优势，大量部署、认证合作伙伴身份和客户 ROI 研究共同强化了这一点。
    - Liberty Strategic Capital、ISTARI、Temasek 相关资本和其他投资人的资金支持，让公司即便处在艰难私募市场背景下仍有战略可信度。
  topRisks:
    - 公开财务能见度差：经审计 ARR、增长、毛利率、烧钱速度、NRR 和股权结构条款都未披露，公开收入估计还彼此冲突很大。
    - 最后一个清晰的独角兽估值锚已经过期，私募市场数据也无法干净、高置信地读出当前企业价值或清算优先权。
    - >-
      BlueVoyant 在拥挤的 MDR 和网络风险市场竞争，对手包括 Palo Alto Networks、CrowdStrike、Rapid7、Arctic Wolf 等更大平台，以及
      BitSight、SecurityScorecard 这类风险专攻者。
    - 业务模式仍实质依赖服务交付和 Microsoft 生态执行，可能压住利润率扩展，并放大平台依赖风险。
    - 2026 年 AI 产品再定位抬高了执行风险：公司必须证明差异化不只是营销，同时还要在不断扩大的平台上守住服务质量。
  unresolvedGaps:
    - 经审计 ARR、收入增长、毛利率、NRR、烧钱速度和现金余额。
    - 完全摊薄股权结构表、优先股条款、清算优先权和任何老股交易细节。
    - 2023 年 11 月 Series E 的精确当前估值，以及 2026 年老股成交是否验证或折价独角兽标记。
    - MDR、TPRM、DRP、专业服务和政府项目之间的收入组合。
    - 按垂直行业拆分的客户集中度和留存，尤其是政府和金融服务。
    - 2026 年 6 月 BlueVoyant AI 发布后，AI 产品采用、定价和转化影响的独立证据。
