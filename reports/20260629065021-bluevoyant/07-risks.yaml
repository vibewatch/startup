- id: TR005
  title: Mitigation and Kill Criteria Table
  layout: wide
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Microsoft ecosystem dependence
    - Evidence that Microsoft-native features subsume BlueVoyant service content or economics
    - Renewal objections rise around paying for partner overlay on top of Microsoft spend
    - Re-rate differentiation and gross-margin durability downward
  - - AI execution quality
    - Human override, false-positive, and containment-quality evidence for BlueVoyant AI
    - Management cannot provide credible quality metrics or customer references for autonomous workflows
    - Treat AI launch as risk-increasing rather than de-risking
  - - Public-sector compliance readiness
    - CMMC, NIST, and award-level diligence outputs
    - Missing SPRS affirmations, weak control mapping, or stalled agency pursuits tied to compliance readiness
    - Assume slower government growth and higher cost-to-win
  - - Legal / adverse signal containment
    - Direct facts on Steward litigation, insurance, and reserve posture
    - Complaint expands materially, damages look meaningful, or management cannot narrate the dispute cleanly
    - Escalate legal risk rating and revisit counterparty/process diligence
  - - Financing opacity
    - Current ARR, burn, cash runway, and any new capital event
    - Next round implies stress, punitive preferences, or heavy dilution without clear operating acceleration
    - Lower conviction on entry price and require stronger downside protection
  notes: These kill criteria convert soft public signals into explicit diligence tests so that channel strength and press releases are not mistaken for closed risk.
