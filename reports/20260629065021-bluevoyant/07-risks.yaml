  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-risk-register
    missingEvidence: A full legal memo covering product-level privacy obligations, all live disputes, and every jurisdiction-specific procurement or cyber-control requirement.
    whyItMatters: The legal register is severity-ranked from public sources only and could miss contractual or jurisdictional obligations that materially change exposure.
    diligencePath: Obtain outside-counsel memo plus management schedule of disputes, material contracts, DPA variants, and government-control mappings.
    relatedQuestionRefs:
    - QR001
    - QR002
    - QR003
    - QR021
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Agency-level revenue concentration, renewal rates, top-customer exposure, public-sector share of ARR, and contract-duration distribution.
    whyItMatters: Visible contract vehicles do not tell investors whether BlueVoyant is diversified or anchored to a small number of agencies, primes, or large accounts.
    diligencePath: Pull SAM.gov and USAspending award data by legal entity, then reconcile to management-provided customer concentration and renewal cohorts.
    relatedQuestionRefs:
    - QR020
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: financing-opacity
    missingEvidence: Current ARR, burn, cash runway, latest preferred-security terms, debt covenants if any, and recent secondary trade data.
    whyItMatters: The public record supports only a partial view of capital history and gives no direct basis for sizing dilution, valuation, or liquidity risk today.
    diligencePath: Request current board deck, cap table, financing instruments, cash forecast, and any recent secondary-market indications from the company or lead investors.
    relatedQuestionRefs:
    - QR022
    - QR023
    - QR024
    - QR030
  - type: missing-source
    severity: material
    topic: service-quality-metrics
    missingEvidence: SLA attainment, MTTR, escalation quality, analyst-to-customer ratios, and evidence on AI override or tuning performance.
    whyItMatters: BlueVoyant’s core promise still depends on high-quality service delivery even after the AI launch, but public materials do not quantify that quality.
    diligencePath: Obtain SOC KPI pack, staffing model, sample incident postmortems, customer references, and AI-quality dashboards.
    relatedQuestionRefs:
    - QR013
    - QR026
    - QR030
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: microsoft-dependence-economics
    missingEvidence: Revenue mix by Microsoft-centered offerings, co-sell economics, attach rates, and churn data for customers tied to Microsoft workflows.
    whyItMatters: Without economics, it is hard to judge whether Microsoft channel strength is a moat or an exposure to feature commoditization.
    diligencePath: Ask management for product/revenue segmentation, Microsoft pipeline attribution, and renewal data by Microsoft versus non-Microsoft customer cohorts.
    relatedQuestionRefs:
    - QR006
    - QR017
    - QR018
    - QR030
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: material
    topic: steward-litigation
    missingEvidence: The complaint text, claimed dollar amount, BlueVoyant’s response, reserves, and any insurance coverage or settlement posture.
    whyItMatters: The docket confirms a live adversary proceeding but does not show whether exposure is trivial, insured, reputational, or operationally meaningful.
    diligencePath: Request the full pleading set, outside-counsel summary, insurer correspondence, and management narrative of the underlying relationship.
    relatedQuestionRefs:
    - QR025
    - QR030
    relatedTableRefs:
    - TR001
