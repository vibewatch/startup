company:
  name: BlueVoyant
chapter:
  number: 6
  title: Customers
  summary: 'BlueVoyant’s public customer record is strongest where buyers are regulated or operationally complex: California’s statewide SOCaaS, NAVSEA supply-chain work, Snappi’s launch-phase banking program, Beeks’s capital-markets deployment, and ODEON’s multinational operations all point to credible enterprise relevance. The proof quality is good on operational outcomes—faster detection, less noise, compliance readiness, supplier-risk visibility, and cost savings—but far weaker on classic durability metrics such as NRR, churn, renewal rates, and concentration. The result is a credible but incomplete customer story: real marquee deployments and strong public-sector / financial-services fit, with material remaining diligence around retention and revenue concentration.'
sections:
- id: customer-segmentation-and-buyer-structure
  title: Customer Segmentation and Buyer Structure
  body: 'BlueVoyant’s public customer file points to enterprise and government buyers with complicated security operations, meaningful regulatory exposure, or large third-party ecosystems rather than a broad SMB base. The buyer is usually a CISO, Office of Information Security, security architecture lead, or infrastructure owner; the daily user is the SOC or IT operations team; and the payer is typically an agency procurement budget, a regulated enterprise security budget, or a partner-enabled contract vehicle. The strongest visible segments are public sector and financial services: California’s OIS, NAVSEA and Carahsoft-backed government routes on one side, and Snappi, Beeks, ClearBank, and financial-services-oriented Microsoft content on the other. ODEON broadens the file into multi-country consumer operations, but the pattern is still complex, high-stakes environments. Energy and legal are clearly targeted verticals, yet the reviewed corpus does not show equally strong named production
    references there.'
