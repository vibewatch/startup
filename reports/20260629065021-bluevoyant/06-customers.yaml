  - - State and local government
    - 'Buyer: OIS/CISO; user: SOC and IT teams; payer: agency or statewide cybersecurity budget'
    - California OIS SOCaaS and CDT SOCaaS pages
    - BlueVoyant can support shared-service monitoring in resource-constrained public entities
    - Public proof is concentrated in California and does not disclose contract economics
  - - Federal defense and acquisition
    - 'Buyer: program/procurement leadership; user: supply-chain and security analysts; payer: federal contract vehicle'
    - NAVSEA / 202 Group Phase III work and SCRIPTS BPA availability
    - BlueVoyant has real federal procurement traction in supply-chain risk use cases
    - Program and supplier-coverage proof is stronger than end-user adoption detail
  - - Digital banking and regulated finance
    - 'Buyer: CISO / board / security leadership; user: SOC and compliance teams; payer: enterprise security budget'
    - Snappi and ClearBank public materials
    - BlueVoyant resonates where resilience, reporting, and Microsoft operations matter
    - Named bank roster remains thin in public materials
  - - Capital-markets infrastructure
    - 'Buyer: CISO / IT leadership; user: SOC analysts; payer: platform operator budget'
    - Beeks Group customer statements
    - BlueVoyant can support customer-facing financial infrastructure and reassure downstream clients
    - Little public evidence on expansion beyond the initial deployment
  - - Multi-site commercial operators
    - 'Buyer: central InfoSec / cloud services; user: regional security teams; payer: corporate security budget'
    - ODEON case study and independent coverage
    - BlueVoyant can unify noisy multi-country environments and add third-party risk visibility
    - Public commercial proof is led by one flagship entertainment reference
  - - Energy and legal go-to-market motions
    - 'Buyer: sector CISO or IT/security lead; user: security teams; payer: enterprise security budget'
    - Energy webinar and law-firm solution spotlight
    - BlueVoyant actively targets other regulated segments beyond banking and government
    - Reviewed sources do not name comparable production customers in these verticals
  notes: Rows separate segments with named proof from sectors that are currently supported mainly by solution marketing or thought leadership.
