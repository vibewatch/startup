  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Segmented NRR, GRR, churn, and renewal cohorts by product line and customer segment.
    whyItMatters: Without cohort evidence, the public proof set cannot distinguish durable recurring revenue from successful but isolated reference deployments.
    diligencePath: Request monthly or quarterly retention dashboards, renewal reports, and logo-retention cohorts under NDA.
    relatedQuestionRefs:
    - QU019
    - QU020
    - QU028
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, contract duration, and channel-vs-direct concentration by ARR or bookings.
    whyItMatters: A public file dominated by a few deep references can mask dependence on a small number of large accounts or contract vehicles.
    diligencePath: Obtain top-10 customer schedules, renewal calendars, and bookings split by direct, marketplace, and distributor channels.
    relatedQuestionRefs:
    - QU023
    - QU028
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: vertical-proof-coverage
    missingEvidence: Named production references in energy, legal, and broader financial-services subsegments beyond the reviewed flagship cases.
    whyItMatters: Marketing reach into a vertical is not the same as repeatable production proof inside that vertical.
    diligencePath: Ask management for named references or anonymized deployment metrics in energy, legal, insurance, and broader banking cohorts.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU001
    - TU003
  - type: missing-source
    severity: material
    topic: independent-proof-depth
    missingEvidence: Independent customer-written case studies, audited ROI studies, or regulator/public-filing style evidence that corroborates renewals and multi-year expansion.
    whyItMatters: Most current proof is vendor- or partner-authored, which is good for operational detail but weak for underwriting durability and concentration risk.
    diligencePath: Request customer reference calls, renewal case studies, and any auditor- or board-ready customer-success reporting used in enterprise sales.
    relatedQuestionRefs:
    - QU021
    - QU022
    - QU026
    - QU028
    relatedTableRefs:
    - TU004
    - TU005
