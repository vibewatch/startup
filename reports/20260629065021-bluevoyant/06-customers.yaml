- id: TU005
  title: Expansion and Concentration Risk Table
  columns:
  - Expansion driver or concentration risk
  - What public evidence shows
  - Impact on the thesis
  - Diligence path
  rows:
  - - Microsoft-centric cross-sell
    - California, ODEON, Snappi, Beeks, and ClearBank all tie BlueVoyant closely to Microsoft-centric security operations
    - Strong expansion logic inside Microsoft-heavy accounts, but product breadth outside that stack is less visible
    - Request product-by-product ARR, attach rates, and win rates outside Microsoft-led deployments
  - - Public-sector contract route dependence
    - Carahsoft, SEWP, ITES-SW2, CMAS, and SCRIPTS create meaningful government access
    - Helps scale distribution, but procurement timing and channel execution could shape revenue concentration
    - Request bookings split by direct vs channel and by contract vehicle
  - - Financial-services compliance pull
    - Snappi, Beeks, and financial-services content suggest compliance-led demand and operational-resilience value
    - Good sector fit, but named-bank depth is still limited
    - Request top financial-services accounts, pipeline conversion, and referenceability by subsegment
  - - Marquee-reference concentration
    - The public proof set is led by a small number of deep stories rather than a broad set of equally detailed references
    - A few flagship accounts may overstate overall deployment depth if the long tail is shallower
    - Request top-10 customer revenue share and number of customers above material ARR thresholds
  - - Durability visibility gap
    - No public NRR, GRR, churn, renewal, or top-customer concentration disclosures were found
    - This is the largest remaining diligence blocker for underwriting customer quality
    - Obtain cohort tables, renewal dashboards, and concentration schedules under NDA
  notes: This exhibit mixes upside and risk because BlueVoyant’s public file is strongest on why accounts buy and weakest on how durable those accounts are over time.
