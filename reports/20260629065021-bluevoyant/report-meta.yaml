  topStrengths:
    - BlueVoyant spans MDR, TPRM, DRP, and services in one platform, letting it sell unified cyber defense rather than a single control point.
    - The company has credible enterprise scale, with over 1,000 customers in 45 countries, more than 600 employees, and meaningful public-sector and regulated-industry traction.
    - BlueVoyant's Microsoft specialization is a durable go-to-market advantage, reinforced by large deployment counts, verified partner status, and customer ROI studies.
    - Funding support from Liberty Strategic Capital, ISTARI, Temasek-linked capital, and other investors gives the company strategic credibility despite a difficult private-market backdrop.
  topRisks:
    - "Public financial visibility is poor: audited ARR, growth, gross margin, burn, NRR, and cap-table terms are not disclosed, while public revenue estimates conflict sharply."
    - The last clear unicorn valuation anchor is stale, and private-market data does not provide a clean, high-confidence read on current enterprise value or liquidation preferences.
    - BlueVoyant competes in crowded MDR and cyber-risk markets against larger platforms such as Palo Alto Networks, CrowdStrike, Rapid7, Arctic Wolf, and risk specialists like BitSight and SecurityScorecard.
    - The business model still depends materially on services delivery and Microsoft ecosystem execution, which can pressure margin scalability and increase platform-dependence risk.
    - AI-led product repositioning in 2026 raises execution risk because the company must prove differentiation beyond marketing while maintaining service quality across a growing platform.
  unresolvedGaps:
    - Audited ARR, revenue growth, gross margin, NRR, burn, and cash balance.
    - Fully diluted cap table, preferred terms, liquidation preferences, and any secondary-market transaction details.
    - Precise current valuation for the November 2023 Series E and whether 2026 secondary clears validate or discount the unicorn mark.
    - Revenue mix across MDR, TPRM, DRP, professional services, and government programs.
    - Customer concentration and retention by vertical, especially government and financial services.
    - Independent proof of AI product adoption, pricing, and conversion impact following the June 2026 BlueVoyant AI launch.
