companyProfile:
  summary: >-
    BlueVoyant was founded in 2017 and is headquartered in New York City. Public company materials
    position the business as a unified cyber defense platform spanning MDR, third-party risk
    management, digital risk protection, and professional services, with especially deep alignment to
    Microsoft security tooling and a meaningful footprint in government and other regulated sectors.
    The company has credible commercial scale — over 1,000 customers in 45 countries, 600+ employees,
    and a publicly announced 2023 Series E above $140M following the 2022 $250M Series D that pushed
    it above the $1B unicorn threshold. However, current valuation, ARR quality, margin profile, and
    ownership structure remain only partially visible in public data, leaving underwriting confidence
    constrained.
