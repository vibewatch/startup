- id: leadership-governance-and-key-person-risk
  title: Leadership, Governance, and Key-Person Risk
  body: 'BlueVoyant’s current public leadership picture is shaped by a recent transition. John Hernandez is now CEO, while co-founder Jim Rosenthal moved into the
    chairman role and co-founder Thomas Glocer remains vice chairman. The current operating bench is broad enough to cover finance, product, technology, information
    security, HR, government solutions, regional sales, and partnerships, which reduces dependence on any single functional lieutenant. Even so, founder influence
    is still material because Rosenthal and Glocer remain central governance figures and the public company narrative still leans heavily on founder identity. That
    mix suggests a meaningful but manageable key-person risk: BlueVoyant has completed a top-of-house handoff, but its public credibility, investor continuity, and
    strategic storytelling still run through the founders. A prior public COO appointment for Michael Montoya also shows that BlueVoyant has been willing to refresh
    the operating layer below the board during its scale-up period.'
  claimRefs:
