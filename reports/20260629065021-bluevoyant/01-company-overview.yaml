  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-verification
    missingEvidence: A current cap table, 409A or board-approved mark, any secondary transaction history, and exact post-Series-E ownership percentages.
    whyItMatters: Third-party datasets cluster around a $1B valuation and ~$665.5M raised, but present-day price, dilution, and investor control cannot be verified
      from public sources.
    diligencePath: Request the current cap table, the most recent preferred stock financing documents, any secondary sale summaries, and board materials used to frame
      the company's latest valuation.
    relatedQuestionRefs:
    - QO011
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited or management-certified ARR, revenue, gross margin, burn, runway, and profitability metrics for 2025-2026.
    whyItMatters: BlueVoyant's scale narrative is strong, but economic quality cannot be underwritten from official public disclosure alone.
    diligencePath: Request monthly or quarterly management accounts, board packs, cohort or renewal analysis, and any lender or investor reporting packages that show
      revenue quality and operating leverage.
    relatedQuestionRefs:
    - QO012
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: governance-rights
    missingEvidence: A full board roster, committee structure, observer rights, voting-control summary, and any debt or protective-provision disclosures.
    whyItMatters: Founder continuity is visible, but governance concentration and investor protections remain largely opaque for a private company of this scale.
    diligencePath: Request the board list, investor-rights agreement, any voting agreement or debt schedule, and the current organizational chart for BlueVoyant Government
      Solutions and other key subsidiaries.
    relatedQuestionRefs:
    - QO017
    relatedTableRefs:
    - TO002
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: TO004-public-milestones
    missingEvidence: A fuller dated chronology of internal launches, regulatory milestones, and any adverse operating events that did not reach the public press trail.
    whyItMatters: The public milestone table is adequate for external diligence but still partial, which limits confidence in how much operational history remains unseen.
    diligencePath: Request an internal company timeline covering product launches, government or regulated-market milestones, board changes, and any material incidents since founding.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO004
