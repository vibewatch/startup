  body: BlueVoyant’s repeated Microsoft security-partner wins, product packaging around Sentinel / Defender / Purview, and Conquest-related Microsoft positioning
    give it a differentiated channel and credibility wedge inside complex enterprise and government accounts.
  claimRefs:
  - CO016
