company:
  name: BlueVoyant
chapter:
  number: 1
  title: Company Overview
  summary: BlueVoyant is a New York-headquartered cybersecurity company founded in 2017 that now markets an integrated MDR, TPRM, digital-risk, and services platform
    to enterprises, governments, and critical-infrastructure customers worldwide. Public evidence shows a step-up in scale through a $250M Series D in 2022, a >$140M
    Series E plus Conquest Cyber acquisition in 2023, a CEO handoff to John Hernandez in May 2026, and the June 2026 launch of BlueVoyant AI, while current audited
    revenue, exact valuation, and detailed governance rights remain private.
sections:
- id: identity-and-business-model
  title: Identity, Headquarters, and Business Model
  body: BlueVoyant presents itself as a cyber-defense platform company founded in 2017 and headquartered in New York. Its official company and contact pages anchor
    the present footprint in Manhattan while also showing a wider multinational operating base. The company says it has over 600 employees and more than 1,000 customers
    across 45 countries, which places it beyond startup incubation stage and into scaled private-company territory even before considering third-party estimates.
    Product-wise, BlueVoyant does not describe itself as a single-point tool vendor. Its platform combines managed detection and response, third-party risk management,
    digital risk protection, and professional services, with revenue implied to come from both recurring software modules and analyst-led managed operations. The
    reviewed materials consistently position BlueVoyant around enterprise, government, and critical-infrastructure use cases rather than a narrow SME or consumer
    motion. That mix matters for later diligence because it suggests longer sales cycles, service-heavy onboarding, and differentiated exposure to regulated or mission-critical
    buyers.
