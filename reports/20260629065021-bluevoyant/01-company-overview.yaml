- id: capital-base-investors-and-ownership-visibility
  title: Funding History, Investors, and Ownership Visibility
  body: BlueVoyant’s publicly visible capital story has two major inflection points. First, the company closed a $250 million Series D in February 2022 led by Liberty
    Strategic Capital, with participation from ISTARI, Eden Global Partners, and 8VC. Second, in November 2023 it paired the Conquest Cyber acquisition with more
    than $140 million in Series E funding led by existing investors Liberty Strategic Capital and ISTARI. Third-party market-data platforms now cluster around roughly
    $665.5 million of total capital raised and an estimated $1 billion valuation, but those figures are database estimates rather than company-certified financial
    disclosure. The evidence therefore supports a strong capital base and credible institutional sponsorship, yet not an exact present-day mark. Public materials
    are also thin on board committees, protective provisions, debt, secondaries, and cap-table concentration, so investor map rows below should be treated as a diligence
    scaffold rather than a fully verified control chart.
  claimRefs:
  - CO020
  - CO021
  - CO023
  - CO026
  - CO027
  - CO028
  - CO029
  - CO048
