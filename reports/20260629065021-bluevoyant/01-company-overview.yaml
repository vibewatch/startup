  title: Series E plus Conquest and AI launch look like one strategy arc
  body: The November 2023 Conquest transaction broadened BlueVoyant’s SaaS and regulated-environment story, while the June 2026 BlueVoyant AI launch repackaged the
    platform around agentic SecOps. Together they suggest broadening within existing accounts rather than a clean market pivot.
  claimRefs:
