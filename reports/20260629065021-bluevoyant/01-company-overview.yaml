- id: milestones-scale-and-adverse-considerations
  title: Milestones, Scale Signals, and Adverse Considerations
  body: The public milestone pattern shows BlueVoyant moving from a 2017 founding story to a capital-intensive scaling phase, then into platform broadening and management
    transition. By 2026, the company is describing itself as global, Microsoft-aligned, and AI-forward, with more than 1,000 customers and more than 600 employees
    according to official pages. At the same time, diligence should resist over-precision. Third-party headcount signals range meaningfully above the official disclosure,
    while valuation and revenue numbers mostly come from private-market databases rather than audited reporting. The strongest public adverse signal in the retained
    source set is UpGuard’s June 2026 external risk report, which flags specific website-security hardening issues such as CSP weaknesses and unsafe-eval usage. That
    is not a thesis-breaking event, but it is notable because BlueVoyant sells security outcomes. Combined with sparse public governance and financial disclosure,
    it argues for a diligence posture that separates clear operating momentum from still-private economic quality.
