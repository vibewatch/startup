      - number: '8.3'
        title: Public Comparable and Multiple Analysis
        blocks:
          - type: paragraph
            body: >-
              The right public comp set for BlueVoyant is mixed by design. On the higher-growth end, CrowdStrike, Palo
              Alto Networks, and Fortinet represent scaled security platforms with strong security-operations franchises
              and materially higher software quality. On the more moderate end, SentinelOne, Qualys, Tenable, and Rapid7
              are the better reference points for a hybrid model that still sits closer to operational security and risk
              management than to a pure cloud-security winner-take-all story. Windsor Drake's 2026 sector framing is the
              key macro anchor: public cyber trades around 6.0x to 6.5x NTM revenue, while managed security services sit
              lower at about 3x to 5x.


              BlueVoyant's implied 4.7x multiple on the 2025 ARR proxy lands near the lower-middle of that landscape. It
              is far below CrowdStrike's 34.3x and Palo Alto's 23.28x, below Fortinet's 15.2x, and much closer to
              SentinelOne at 4.61x, Qualys at 5.73x, and Tenable at 3.32x. That is directionally sensible if
              BlueVoyant's revenue mix includes a meaningful services component and if the platform's automation
              advantages have not yet translated into disclosed software-like margins. The comp conclusion is therefore
              nuanced: $1 billion is not obviously too high on a revenue-multiple basis, but it is not the kind of
              discount that creates a clear public-evidence entry opportunity.
                      
