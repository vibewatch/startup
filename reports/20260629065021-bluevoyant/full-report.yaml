      - number: '7.3'
        title: Human Services Delivery and AI Execution Risk
        blocks:
          - type: paragraph
            body: >-
              BlueVoyant is trying to extend a human-led managed-security franchise into an AI-native product story
              without giving up the promise of expert oversight. The June 2026 BlueVoyant AI launch says customers can
              buy either a fully managed service backed by BlueVoyant’s elite SOC team or a SaaS platform that puts the
              same capabilities in customer hands. That is attractive commercially, but it raises a real operating
              challenge: the company now has to deliver high-quality analyst-driven service, credible autonomous
              workflows, and coherent pricing and packaging across both modes. Public claims about machine-speed
              containment, false-positive reduction, and deterministic response are ambitious. If those claims are not
              supported by strong guardrails, human override processes, and measurable quality outcomes, BlueVoyant
              could create more scrutiny rather than less—especially in regulated or high-consequence customer
              environments.


              The operating model also remains labor intensive. BlueVoyant still emphasizes 24x7 expert monitoring,
              global SOC coverage, and regional expansion such as the Cork center for Irish and EU clients. Those are
              meaningful mitigants, but they imply ongoing recruiting, training, localization, and quality-control
              requirements even as the company pitches automation. Leadership changes add another layer of execution
              risk. John Hernandez took over as CEO in 2026 with an AI-growth mandate, while the 2023 CPO hire was
              explicitly about unifying product direction after product-line expansion. The risk is not that BlueVoyant
              lacks ambition; it is that the company may have to manage service consistency, model trust, analyst
              workflows, and product integration all at once. Public review and directory sources acknowledge broad
              capability, but they do not give the SLA, MTTR, staffing-ratio, or alert-tuning evidence that would fully
              de-risk execution.
