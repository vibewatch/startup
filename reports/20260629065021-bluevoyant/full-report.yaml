    title: Competitor Profile Table
    columns:
      - Competitor
      - Category
      - Scale / Funding Signal
      - Buyer Sweet Spot
      - Key Differentiation
      - Primary Limitation vs. BlueVoyant
    rows:
      - - BlueVoyant
        - Hybrid MDR + TPRM / C-SCRM
        - 600+ employees; 1,200+ Sentinel deployments; private funding not refreshed in retained 2026 sources
        - Microsoft-heavy enterprise, regulated buyers, government supply chains
        - Combines MDR, TPRM, DRP, and services with strong Microsoft delivery depth
        - Lower MDR visibility than the biggest platform-native rivals; public funding/pricing detail is thin
      - - Palo Alto Networks Unit 42 / Cortex XSIAM
        - Platform-native MDR / SOC
        - 16K+ employees; 70K+ customers globally
        - Large enterprise standardized on Palo Alto
        - Unified AI SOC platform plus Unit 42 services and deep first-party telemetry
        - Best economics and outcomes are tied to the Palo Alto stack; limited TPRM overlap
      - - CrowdStrike Falcon Complete
        - Platform-native MDR
        - Public-company scale; 2.7M detections remediated monthly; 1-minute median time-to-contain
        - Enterprise and security-mature mid-market willing to standardize on Falcon
        - Native endpoint, identity, cloud, and SIEM telemetry with autonomous and human response
        - Higher platform lock-in and less open-stack flexibility than BlueVoyant or ReliaQuest
      - - Arctic Wolf
        - Open-XDR MDR
        - 10K+ customers; 1,000+ security engineers; $60M Series D and ~$4.3B valuation reported historically
        - Mid-enterprise to enterprise buyers wanting co-managed outcomes
        - Concierge delivery, open XDR, warranty, and security-journey model
        - TPRM and supply-chain cyber defense are not core buying motions
      - - Rapid7
        - Platform-led managed operations
        - 11,500+ customers worldwide; public-company scale
        - Large SMB, mid-market, and enterprise buyers wanting unified exposure plus detection
        - Command Platform connects exposure management, telemetry, and managed operations
        - Less differentiated service identity than BlueVoyant; TPRM overlap is limited
      - - ReliaQuest
        - Open-platform enterprise SecOps
        - 50K+ alerts processed daily; 255+ technology partners; customer count not disclosed on retained pages
        - Fortune 1000 and heterogeneous-tool enterprises
        - Any-source normalization, agentic AI teammates, and broad integration depth
        - Public scale and pricing disclosure are limited; no TPRM-specific data-network moat
      - - eSentire
        - Vendor-independent MDR
        - 2,000+ customers across 35+ industries; 300+ integrations
        - Regulated mid-market, private-equity portfolios, and upper-mid-enterprise teams
        - Human-led containment plus multi-signal XDR and unlimited hunting/incident handling messaging
        - Brand scale is below the largest public suites and TPRM is not core
      - - SecurityScorecard
        - Threat-informed TPRM / supply-chain detection
        - 3,300+ customer organizations; 12M+ monitored and rated organizations
        - Vendor-risk, cyber insurance, procurement, and board-reporting programs
        - Continuous ratings plus AI assessment automation, nth-party visibility, and remediation workflows
        - Managed SOC depth is lighter than BlueVoyant MDR; outside-in methods do not replace internal telemetry
      - - BitSight
        - Cyber risk intelligence / TPRM
        - 3,500+ customers; 68K+ active organizations; 75K+ mapped vendor profiles
        - Ratings-centric enterprise risk and supply-chain programs
        - Large mapped supply-chain dataset, independently validated ratings claims, and strong analyst recognition
        - MDR is not core and customers may still need separate workflow or service layers
