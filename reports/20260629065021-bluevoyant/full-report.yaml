  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Adjacent Spend
        blocks:
          - type: paragraph
            body: >-
              BlueVoyant should be framed as operating in the overlap between managed detection and response and
              cyber-focused third-party risk management, not as a generic cybersecurity vendor and not as a broad GRC
              suite. The MDR pages emphasize augmentation of existing EDR, SIEM, cloud, and Microsoft security stacks
              with 24x7 monitoring, incident response, and automation. The TPRM pages emphasize continuous monitoring,
              analyst-directed remediation, questionnaire workflows, zero-day alerting, and fourth-party mapping. That
              boundary matters because it defines what spend belongs in the core opportunity. Included spend is the part
              of security operations and vendor-risk budgets that buys continuous detection, validation, remediation,
              and external dependency visibility. Adjacent spend sits in GRC, board reporting, and broader resilience
              workflows, while the main substitutes remain in-house SOC buildouts, periodic questionnaires,
              spreadsheet-led vendor reviews, and point products that only solve one layer of the problem.
