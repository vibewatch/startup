      - number: '2.4'
        title: Growth Drivers, Regulation, and Category Expansion
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers in 2026 are regulation, demonstrated third-party incident pain, and the
              rising cost of operating fragmented security programs without enough skilled people. SEC disclosure rules
              put cyber governance and incident materiality into board processes for U.S. public companies. NIS2
              broadens EU cyber obligations across 18 critical sectors. CISA and NIST frame supply-chain cyber risk as a
              formal resilience problem spanning hardware, software, and managed services. That policy stack meets real
              operating pain: Marsh reports that 70% of organizations experienced a material third-party cyber incident
              in the past year and that 66% plan to increase cyber investment, while Panorays shows that most CISOs
              still lack full supply-chain visibility and formal breach-response playbooks. BlueVoyant's positioning
              aligns with those pressures because it combines monitoring, validation, remediation, and AI-assisted
              triage across both internal defense and external vendor exposure.
