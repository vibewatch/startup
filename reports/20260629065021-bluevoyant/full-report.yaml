        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports a company with real recurring demand, substantial private-capital backing,
              and enough customer breadth to matter in enterprise cybersecurity. It does not, however, support a clean
              financial underwriting case. Cash, burn, runway, debt obligations, realized pricing, gross margin,
              retention, CAC, and payback remain outside the public record. A historical PPP debt signal and UK filing
              trail show corporate-document activity, but they do not answer current leverage or liquidity questions.
              The adverse workforce review does not overturn the growth narrative, yet it does warn that resource
              constraints may coexist with acquisitive expansion and executive buildout. The right financial conclusion
              is therefore constructive but not investable on public evidence alone: BlueVoyant looks commercially
              relevant, but management data is still required to judge revenue quality, operating leverage, and
