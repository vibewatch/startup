      - number: '2.3'
        title: Buyer, Budget Owner, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is cross-functional. On the MDR side, the economic buyer is usually the CISO or security
              leader who already owns SIEM, EDR, and Microsoft security budgets but needs better response coverage,
              better tuning, or more 24x7 capacity. On the TPRM side, the day-to-day operator is often a vendor-risk or
              compliance team, but payer authority can sit with security, procurement, enterprise risk, or a regulated
              business-line owner depending on where supplier exposure is measured. The adoption trigger is usually not
              abstract 'cyber maturity.' It is a recent incident, a regulatory deadline, repeated questionnaire fatigue,
              a zero-day exposure across vendors, or an internal realization that fourth-party risk is largely
              invisible. BlueVoyant's official surfaces suggest an adoption path that starts with MDR overlay or TPRM
              monitoring inside an existing workflow, then expands into remediation, fourth-party analytics, and broader
              resilience reporting once leadership decides manual processes are too slow.
