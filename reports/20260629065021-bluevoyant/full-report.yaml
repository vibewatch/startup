            body: >-
              The external-risk side of the platform is organized into a clean three-module structure: Brand Protection,
              Dark Web Watcher, and Executive Cyber Guard. Those modules map to concrete user jobs rather than abstract
              threat-intelligence buzzwords. BlueVoyant claims brand takedowns across web, social, and rogue-app
              channels; dark-web monitoring for fraud, leaked credentials, and exposed data; and executive monitoring
              for high-value account compromise or personal-data exposure. The company also publishes at least some
              measurable DRP performance signals, including website and social-media takedown success rates and a median
              server-level takedown time. Operationally, however, this product line is the most obviously dependent on
              outside platforms and counterparties: registrars, social networks, app stores, underground monitoring
              access, and customer response playbooks all sit in the outcome chain. That makes DRP strategically
