  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: IC-style scoring across six dimensions that matter most to BlueVoyant's current valuation decision.
    data:
      items:
        - label: Scale proof
          score: 8/10
          note: Client count, geographic reach, and platform breadth are strong for a private cyber company.
        - label: Growth proof
          score: 7/10
          note: >-
            Historical growth commentary is strong, but current ARR quality remains vendor-estimated rather than
            company-disclosed.
        - label: Margin visibility
          score: 3/10
          note: No retained public source discloses current gross margin or services mix, limiting multiple confidence.
        - label: Secondary liquidity
          score: 2/10
          note: Notice shows a discount and Forge/Hiive do not expose deep public price discovery.
        - label: Valuation support
          score: 6/10
          note: A $1B mark is plausible on the ARR proxy and peer set, but not clearly attractive.
        - label: Disclosure quality
          score: 4/10
          note: Funding totals, cap-table mechanics, and post-2023 financing detail remain opaque in public sources.
    approximationNotes: Scores are analytical and relative, intended for IC discussion rather than as mechanically derived model outputs.
    claimRefs:
      - CV037
      - CV038
      - CV044
      - CV046
      - CV047
      - CV048
      - CV050
