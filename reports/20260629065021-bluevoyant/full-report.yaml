      BlueVoyant’s Microsoft-heavy workflow starts with telemetry and identity signals, then moves through AI-assisted
      triage, human validation, and containment or optimization action.
    approximationNotes: The flow emphasizes the Microsoft-centric MDR path because that is where the public evidence is most specific.
    data:
      nodes:
        - id: ingest
          label: Collect Microsoft and customer telemetry
          detail: Sentinel, Defender, M365, endpoint, identity, and cloud signals are ingested from the customer environment.
        - id: enrich
          label: AI enrichment and deterministic triage
          detail: BlueVoyant AI and automation enrich alerts, remove noise, and prepare decision-ready cases.
        - id: analyst
          label: SOC analyst review
          detail: Human analysts validate important events, tune logic, and decide whether to escalate or automate.
        - id: act
          label: Contain or optimize
          detail: >-
            The platform can isolate devices, revoke credentials, remove malicious email, or optimize Microsoft controls
            and spend.
        - id: feedback
          label: Continuous optimization loop
          detail: Customer teams and BlueVoyant feed outcomes back into tuning, cost management, and compliance workflows.
      edges:
        - from: ingest
          to: enrich
          label: normalize and prioritize
        - from: enrich
          to: analyst
          label: route high-fidelity cases
        - from: analyst
          to: act
          label: approve response or guidance
        - from: act
          to: feedback
          label: measure outcome
        - from: feedback
          to: enrich
          label: retune detections and playbooks
