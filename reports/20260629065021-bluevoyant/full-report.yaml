              TPRM, DRP, and professional services rather than a one-off project business. The homepage and product
              materials emphasize ongoing monitoring, response, remediation, and takedown work, while customer proofs
              and TEI studies reinforce a subscription-or-retainer style value proposition. That said, the public record
              is much stronger on outcomes than on monetization detail. BlueVoyant discloses deployment counts, ROI
              claims, and marketplace procurement routes, but it does not publish standard list prices for its core
              offers, nor does it expose realized pricing, discounting, or revenue mix between recurring managed
