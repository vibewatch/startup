  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Privacy, and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              BlueVoyant does not present as a company under broad public enforcement today, but its visible operating
              surfaces still create real regulatory and legal exposure. The company’s privacy and legal notice says
              BlueVoyant LLC is the controller for website personal data and may share personal information with
              affiliates unless prohibited by law, which is not unusual but still matters for buyers that scrutinize
              controller boundaries, affiliate access, and global data handling. The bigger external constraint comes
              from the company’s government- and defense-adjacent motion. BlueVoyant Government Solutions explicitly
              sells supply-chain defense, CMMC support, and NIST 800-171 compliance management into federal and defense
              contexts, and the DoD’s CMMC rollout is now active in live contracts. That means the risk is not abstract
              regulation; it is execution against procurement-linked cyber controls that can delay or disqualify wins if
              BlueVoyant or its customers cannot evidence readiness.


              The clearest adverse company-specific signal in the current public file is the Steward Health adversary
              complaint against Bluevoyant LLC in Texas bankruptcy court. Public docket text alone does not quantify
              exposure, merit, or expected outcome, but it is still the one live adverse item that warrants direct
              diligence on factual background, insurance, reserve treatment, and whether it reflects a billing,
              delivery, or vendor-management dispute. Separately, SAM.gov and USAspending make federal award data
              publicly traceable, which is useful because BlueVoyant’s contract-vehicle breadth is visible while actual
              agency-level concentration and renewal dependence are not. Overall, legal and regulatory risk is
              manageable only if the company can show privacy governance discipline, current public-sector compliance
              readiness, and a contained explanation of the Steward matter.
