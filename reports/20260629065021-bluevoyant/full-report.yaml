  - id: FV001
    title: Recommendation Logic
    type: flow
    layout: wide
    summary: >-
      Decision flow from scale and comparable support through secondary-market caution and disclosure gaps to the final
      research-more call.
    data:
      nodes:
        - id: start
          label: BlueVoyant valuation call
          description: Start from a private-company headline mark of roughly $1B and a retained 2025 ARR proxy of $213.5M.
        - id: scale
          label: Scale proof exists
          description: >-
            >900 customers, global footprint, MDR plus TPRM platform breadth, and historical triple-digit
            recurring-revenue growth support a live investment thesis.
        - id: comps
          label: Comparable support is mixed but real
          description: >-
            Implied ~4.7x ARR is below the public cyber median and near moderate cyber peers, not premium platform
            leaders.
        - id: secondary
          label: Secondary market is cautionary
          description: Notice shows a 39% discount; Forge and Hiive expose thin or incomplete public liquidity signals.
        - id: opacity
          label: Critical private facts are missing
          description: >-
            Current margin profile, retention, cap table, and any post-2023 financing terms remain undisclosed in
            retained public evidence.
        - id: decision
          label: 'Recommendation: research-more'
          description: The mark is plausible but not obviously attractive; require private diligence before price-taking.
    approximationNotes: >-
      Logical decision architecture only; it summarizes the weighting of public evidence rather than a formal scoring
      model.
    claimRefs:
      - CV034
      - CV037
      - CV038
      - CV044
      - CV045
      - CV048
