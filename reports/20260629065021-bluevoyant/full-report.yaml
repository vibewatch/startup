            body: >-
              BlueVoyant's official scale narrative is directionally strong and internally consistent on growth, but not
              consistent enough on exact current size to underwrite without caveat. Official press releases progress
              from more than 700 customers in 30 countries in early 2022, to more than 900 global customers in mid-2024,
              to more than 1,000 customers in over 45 countries by March 2025. Headcount signals are more uneven:
              BlueVoyant says it has over 600 employees, GetLatka estimates about 650, Dialectica lists 653, and an
              accessible historical PitchBook snapshot showed only 363 employees. That spread is too wide to ignore,
              especially because revenue-per-employee and sales-efficiency proxies change meaningfully depending on
