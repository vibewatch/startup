            body: >-
              BlueVoyant’s public customer file points to enterprise and government buyers with complicated security
              operations, meaningful regulatory exposure, or large third-party ecosystems rather than a broad SMB base.
              The buyer is usually a CISO, Office of Information Security, security architecture lead, or infrastructure
              owner; the daily user is the SOC or IT operations team; and the payer is typically an agency procurement
              budget, a regulated enterprise security budget, or a partner-enabled contract vehicle. The strongest
              visible segments are public sector and financial services: California’s OIS, NAVSEA and Carahsoft-backed
              government routes on one side, and Snappi, Beeks, ClearBank, and financial-services-oriented Microsoft
              content on the other. ODEON broadens the file into multi-country consumer operations, but the pattern is
              still complex, high-stakes environments. Energy and legal are clearly targeted verticals, yet the reviewed
              corpus does not show equally strong named production references there.
