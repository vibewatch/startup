    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Business Model
        blocks:
          - type: paragraph
            body: >-
              BlueVoyant presents itself as a cyber-defense platform company founded in 2017 and headquartered in New
              York. Its official company and contact pages anchor the present footprint in Manhattan while also showing
              a wider multinational operating base. The company says it has over 600 employees and more than 1,000
              customers across 45 countries, which places it beyond startup incubation stage and into scaled
              private-company territory even before considering third-party estimates. Product-wise, BlueVoyant does not
              describe itself as a single-point tool vendor. Its platform combines managed detection and response,
              third-party risk management, digital risk protection, and professional services, with revenue implied to
              come from both recurring software modules and analyst-led managed operations. The reviewed materials
              consistently position BlueVoyant around enterprise, government, and critical-infrastructure use cases
              rather than a narrow SME or consumer motion. That mix matters for later diligence because it suggests
              longer sales cycles, service-heavy onboarding, and differentiated exposure to regulated or
              mission-critical buyers.
