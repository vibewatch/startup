        - label: 4.0x ARR
          value: 854
        - label: 4.7x ARR (current $1B mark)
          value: 1003
        - label: 5.0x ARR
          value: 1068
        - label: 6.0x ARR
          value: 1281
        - label: 7.0x ARR
          value: 1495
    approximationNotes: >-
