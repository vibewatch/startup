  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              BlueVoyant has enough scale and category breadth to make the company investable at the right price.
              Official company materials describe a unified platform spanning MDR, TPRM, digital risk protection, and
              professional services, not a single-point tool. That breadth matters because it supports a comp set wider
              than pure MDR and gives BlueVoyant multiple product wedges into enterprise and public-sector budgets. The
              2023 growth release also suggests meaningful commercial proof: more than 900 clients, presence in 40-plus
              countries, and historical triple-digit recurring-revenue expansion since 2018. If the third-party 2025 ARR
              proxy of $213.5 million is directionally right, BlueVoyant is already a scaled cybersecurity vendor rather
              than a speculative pre-revenue unicorn.


              The anti-thesis is valuation quality, not company existence. Public secondary evidence is the key
              disconfirming signal in this chapter: Notice shows a 39% discount to the last round, Forge calls market
              activity limited, and Hiive exposes no visible price history on the public listing page. Those signals
              imply that the private market is either illiquid, cautious, or both. Meanwhile, the company still lacks
              public disclosure of current gross margin, retention, services mix, diluted share count, and any post-2023
              financing terms. That combination keeps the right call at research-more rather than buy, even though the
              core business appears credible.
                      
