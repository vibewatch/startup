        title: Retention, Concentration, and Visibility Risks
        blocks:
          - type: paragraph
            body: >-
              The biggest gap in BlueVoyant’s customer file is not absence of reference accounts; it is absence of
              durability disclosure. None of the reviewed sources provide NRR, GRR, churn, logo-retention, cohort
              renewal curves, or revenue concentration by customer. PeerSpot hints that annual or multi-year agreements
              are common, but that is still generic third-party commentary rather than company-verified cohort evidence.
              Independent review surfaces help only partially. FeaturedCustomers shows a meaningful stock of references
              and a positive rating, yet AWS Marketplace and Slashdot pages still show zero public ratings on the
              reviewed listings. Most quantified proof is vendor-authored or partner-authored, which is useful for
              seeing deployment outcomes but weak for underwriting concentration and renewal risk. The diligence
              conclusion is therefore mixed: BlueVoyant has credible marquee proofs and regulated-sector relevance, but
              a buyer still needs private data on top-customer exposure, expansion rates, renewal rates, and segment
