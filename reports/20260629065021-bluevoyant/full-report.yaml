  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Secondary discount widens
        - Observable discount to the last round moves beyond ~50% or a new round prices below $0.8B.
        - Would imply the market sees materially weaker quality or liquidity than the base case assumes.
        - Pause and re-underwrite around bear-case levels.
      - - Services-heavy economics confirmed
        - Gross margin or revenue mix shows the business is materially more services-heavy than implied.
        - Would cap the justified multiple closer to the managed-security range.
        - Move stance from fair toward stretched.
      - - No real price discovery
        - No broker-backed secondary clears, bids, or cap-table evidence emerge over the next diligence cycle.
        - Liquidity discount remains unresolved, so the market cannot validate the headline mark.
        - Keep recommendation at research-more or downgrade.
      - - Opaque post-2023 financing
        - Management cannot document any post-2023 financing terms, share count, or preference stack.
        - Without dilution mechanics, return math is unreliable even if enterprise value looks reasonable.
        - Do not commit capital without a cap-table package.
      - - Growth quality weakens
        - ARR proxy proves overstated, or retention / expansion metrics fall below software-like thresholds.
        - Breaks the base-case assumption that BlueVoyant merits at least a hybrid platform multiple.
        - Re-rate toward the bear band immediately.
    notes: >-
      Thresholds are diligence triggers rather than contractual covenants; they translate public-market evidence into
      concrete kill criteria.
    claimRefs:
      - CV018
      - CV019
      - CV023
      - CV036
      - CV038
      - CV041
      - CV043
      - CV047
      - CV050
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - 2026 ARR quality
        - Current ARR, recurring vs. services mix, and ARR bridge from 2023 to 2026.
        - Determines whether the 2025 ARR proxy is real and whether a 4.7x multiple is fair or too high.
        - Request current board deck or CFO operating pack.
      - - Margin and retention profile
        - Gross margin, adjusted EBITDA, gross retention, and NRR by major product line.
        - Needed to know whether BlueVoyant deserves hybrid-services or software-platform multiples.
        - Management diligence session plus cohort-level retention exhibits.
      - - Cap table and diluted share count
        - Latest fully diluted share count, preference stack, option pool, and liquidation waterfall.
        - Per-share return can diverge sharply from enterprise-value math when dilution is opaque.
        - Data room cap-table export or counsel-prepared summary.
      - - Actual secondary-clearing prices
        - Recent broker sheets, matched trades, and bid-ask history from cap-table administrators or marketplaces.
        - The best public secondary signal is negative; true clears can validate or refute that discount.
        - Direct broker diligence and admin records from Forge / Notice / company.
      - - Any post-2023 financing terms
        - Evidence of debt, structured financing, or side letters after the Series E round.
        - Later capital structure changes can alter downside protection, seniority, and valuation interpretation.
        - CFO/legal confirmation plus financing documents.
    notes: Each ask is tied to a current blocker in the public record rather than a generic diligence wishlist.
    claimRefs:
      - CV011
      - CV021
      - CV044
      - CV046
      - CV047
      - CV048
      - CV050
