      - number: '3.2'
        title: 'MDR Head-to-Head: Platform Suites vs Open-Stack Providers'
        blocks:
          - type: paragraph
            body: >-
              The MDR field around BlueVoyant splits into two economically different competitor classes. Palo Alto
              Networks and CrowdStrike sell managed response as an extension of broader proprietary platforms; their
              pitch is automation depth, native telemetry, and bundle economics. Palo Alto layers Unit 42 services on
              top of Cortex XSIAM's unified SIEM, SOAR, EDR, NDR, and CDR stack, while CrowdStrike's Falcon Complete
              emphasizes one-minute median time-to-contain, millions of monthly remediations, and deep endpoint,
              identity, cloud, and third-party telemetry from the Falcon ecosystem. Arctic Wolf, ReliaQuest, Rapid7, and
              eSentire attack from the opposite direction: they position themselves as more open, service-intensive
              partners that work across an existing tool estate. Arctic Wolf leads with concierge delivery and open XDR;
              ReliaQuest with any-source normalization and broad integrations; Rapid7 with integrated exposure plus
              detection; and eSentire with vendor-independent XDR and human-led containment. BlueVoyant belongs closer
              to this second camp operationally, but with a stronger Microsoft-specific services identity than most of
              those rivals.
