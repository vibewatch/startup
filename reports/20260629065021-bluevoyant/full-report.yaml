      - number: '6.3'
        title: Government and Financial Services Depth
        blocks:
          - type: paragraph
            body: >-
              Government and financial services are the most defensible parts of BlueVoyant’s public customer story. On
              the government side, the company can point to California’s statewide SOCaaS model, NAVSEA supply-chain
              work inherited through 202 Group, and a widening procurement footprint through Carahsoft, SEWP, ITES-SW2,
              NASPO, CMAS, and the SCRIPTS BPA. That is more than logo evidence: it shows real contract pathways and
              operating use cases. On the financial-services side, the proof is narrower but still credible. Beeks
              offers capital-markets infrastructure proof with a direct customer statement. Snappi shows a new regulated
              bank using BlueVoyant to stand up cyber operations from day one, and ClearBank indicates BlueVoyant can
              speak publicly with an established UK bank customer on Microsoft optimization. The caution is that public
              depth is strongest around Microsoft-centric managed security and resilience themes, not around a broad
              roster of named banks or insurers.
