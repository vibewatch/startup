  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform definition and converged architecture
        blocks:
          - type: paragraph
            body: >-
              BlueVoyant now markets the company less as a stand-alone MDR provider and more as a unified cyber-defense
              operating system. The homepage, the Cyber Defense Platform page, and the 2024 launch materials
              consistently describe one cloud-native platform spanning internal defense, third-party risk, and external
              digital-risk monitoring. That matters because the product definition is customer-workflow specific: a
              security team can run internal SOC triage, supplier remediation, and brand or credential takedown work
              from the same operating model instead of stitching together separate point tools. The company’s newer AI
              layer reinforces that convergence thesis rather than replacing it; BlueVoyant AI is framed as a control
              plane that decides when to route work to deterministic automation, when to call a human analyst, and when
              to let agents act. The diligence-positive takeaway is that the portfolio is coherently packaged. The
              diligence caveat is that the public architecture remains marketing-layer deep outside a few
              Microsoft-specific documents.
