              June 2026 BlueVoyant AI launch. The November 2023 Conquest Cyber acquisition sits in the middle of that
              evolution by adding SaaS-heavy capabilities for regulated and government-sensitive environments. The
              Auto-ISAC partnership then extends the third-party-risk narrative into a named vertical. Together, these
              moves imply a company trying to deepen wallet share inside complex accounts rather than merely add logos.
