      - number: '8.5'
        title: Recommendation, Exit Discipline, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The recommendation from public evidence alone is research-more. BlueVoyant looks like a legitimate scaled
              cybersecurity platform, and the current $1 billion headline mark is not obviously detached from the
              retained ARR proxy. But that is not the same as calling the valuation attractive. The public market offers
              only preview-level secondary signals, and the strongest one available is negative. In addition, none of
              the retained sources disclose the current diluted share count, margin profile, retention metrics, or the
              terms of any financing after November 2023. Without those facts, a buyer can explain why $1 billion is
              plausible, but cannot yet explain why it is clearly mispriced in their favor.


              Exit readiness is also limited in public evidence. Hiive states that BlueVoyant remains privately held and
              accessible pre-IPO only through secondary marketplaces for accredited investors, and no retained source
              indicates an IPO process, a strategic sale process, or a fresh valuation reset. The actionable path is
              straightforward: obtain current ARR composition, gross margin, NRR or customer retention, the cap table
              and preference stack, and actual recent secondary clears from brokers or management. If those data confirm
              software-like economics and stable or improving secondary pricing, the call could upgrade. If they instead
              confirm services-heavy revenue and continued discount trading, the fair label would slide toward
              stretched.
                      
