      - number: '1.4'
        title: Platform Evolution, Ecosystem, and Commercial Positioning
        blocks:
          - type: paragraph
            body: >-
              BlueVoyant’s positioning is not just about detecting threats; it is about wrapping multiple cyber
              workflows into a managed platform narrative. Its Microsoft page and awards history show unusually strong
              ecosystem alignment, including repeated security-partner recognition and service packaging around
              Sentinel, Defender, Purview, and Copilot-era security operations. The partner program also indicates a
              channel-led route to market rather than purely direct sales. On the product side, the company has expanded
