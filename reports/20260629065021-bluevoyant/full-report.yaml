  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Buyer Alternatives
        blocks:
          - type: paragraph
            body: >-
              BlueVoyant does not sit in a single clean market box. Gartner's 2026 MDR market definition treats managed
              detection and response as a turnkey, provider-operated SOC capability with active containment rather than
              alerting-only monitoring, while BlueVoyant's own homepage markets four adjacent offers at once: MDR,
              third-party risk management, digital risk protection, and professional services. That creates a broader
              competitive field than a normal MDR shortlist. On one side, BlueVoyant faces direct MDR rivals such as
              CrowdStrike, Palo Alto Networks, Arctic Wolf, Rapid7, ReliaQuest, and eSentire. On the other, it faces
              TPRM and cyber-ratings platforms such as SecurityScorecard and BitSight, plus workflow-oriented
              alternatives such as OneTrust- or ProcessUnity-style vendor-risk programs and the internal-SOC status quo.
              The practical implication is that BlueVoyant can win when the buyer wants one partner across SOC
              operations and supplier cyber defense, but it can be displaced when the budget owner narrows the problem
              to either platform-native MDR or procurement-centered vendor-risk automation.
