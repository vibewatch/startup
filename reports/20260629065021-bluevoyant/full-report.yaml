      - number: '6.4'
        title: Channel and Procurement Routes
        blocks:
          - type: paragraph
            body: >-
              BlueVoyant’s route to market appears deliberately partner-heavy. The company advertises a formal partner
              program with co-selling, enablement, account planning, and OEM/tech-alliance support. Carahsoft is the
              clearest channel amplifier for public sector demand, because it gives BlueVoyant access to existing
              reseller networks and contract vehicles rather than forcing direct procurement one agency at a time.
              BlueVoyant Government Solutions then adds a more specialized federal path through SCRIPTS and
              supply-chain-defense motions. AWS Marketplace contributes another procurement path, though the reviewed
              listing is private-offer oriented and thin on external feedback. The practical implication is that
              expansion may come through partner and platform ecosystems as much as through net-new direct sales. That
              can be efficient, especially for Microsoft-centric buyers, but it also means customer visibility can lag
              behind route-to-market breadth because some wins surface through distributors, webinars, or partner pages
              rather than through detailed standalone case studies.
