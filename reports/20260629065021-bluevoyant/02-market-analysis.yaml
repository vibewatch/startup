- id: sizing-lens-and-contradictory-estimates
  title: Sizing Lens — TAM, SAM, and Contradictory Published Estimates
  body: >-
    BlueVoyant's market can be sized, but only with layered logic rather than a single headline TAM. MDR estimates span from $3.92B in 2026 according to Precedence Research to $5.09B according to Mordor, with The Business Research Company at $4.16B. TPRM is even more definition-sensitive: TBRC gives a direct 2026 value of $8.09B, while NextMSC's 2025 baseline and Grand View Research's 2023 baseline imply normalized 2026 values near $11B. Those contradictions are not noise; they reflect differing treatment of software versus services, compliance workflows versus cyber monitoring, and adjacent GRC scope. For BlueVoyant, a reasonable gross 2026 core-market ceiling is roughly $12–16B when MDR and TPRM published baselines are combined before overlap. A more practical SAM narrows to about $5–8B after applying large-enterprise, regulated-buyer, and western-market filters. Public data does not support a precise dollar SOM because BlueVoyant does not disclose segment revenue or win-rate by module,
    so SOM should be treated as evidence-constrained rather than invented.
