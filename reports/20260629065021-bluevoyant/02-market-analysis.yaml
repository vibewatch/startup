- id: constraints-and-valuation-relevance
  title: Constraints, Adverse Signals, and Valuation Relevance
  body: >-
    The market case is good, but it is not frictionless. KPMG shows that most programs are still only partly integrated with enterprise risk and that end-to-end managed-service adoption remains low, which means buyers often approach TPRM and MDR through disconnected tools, partial pilots, or narrow use cases. CyberProof warns that some providers misuse the MDR label by offering managed EDR or tool-centric monitoring without full human response leadership, which creates buyer confusion and slows category conversion. PeerSpot's crowded MDR category and CRC's evidence of softer cyber-insurance pricing both reinforce the idea that budget urgency can ebb even when claims severity keeps rising. For valuation, the right takeaway is that BlueVoyant participates in markets large enough and painful enough to matter, but multiple compression remains sensitive to how effectively the company can turn its cross-category story into measurable module penetration, lower buyer confusion, and a publicly supportable
    SOM.
