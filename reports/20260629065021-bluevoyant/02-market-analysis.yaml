callouts:
- calloutType: insight
  title: BlueVoyant's real opportunity is the overlap between MDR and cyber TPRM
  body: >-
    The market is more attractive when framed as the overlap between managed SecOps and cyber-focused supplier-risk management than when framed as a generic GRC or generic security-tool story. BlueVoyant's fourth-party analytics and analyst-led remediation help it bridge the two budgets.
  claimRefs:
  - CM007
  - CM018
  - CM046
  - CM049
  - CM050
- calloutType: strength
  title: Regulation plus real incident frequency creates durable demand
  body: >-
    SEC governance rules, NIS2, and CISA/NIST supply-chain framing all increase program urgency, while Marsh and Panorays show that buyers are experiencing real third-party incidents and visibility gaps right now. Those forces make continuous monitoring and remediation easier to justify than purely discretionary security tooling.
  claimRefs:
  - CM027
  - CM031
  - CM032
  - CM033
  - CM034
- calloutType: risk
  title: TAM is large enough, but SOM is still opaque
  body: >-
    Published market estimates are contradictory and BlueVoyant does not disclose module-level revenue mix, so public-data valuation work should anchor on category breadth and demand drivers, not on a precise share claim. The main market risk is execution inside crowded, definition-sensitive categories.
  claimRefs:
  - CM012
  - CM016
  - CM020
  - CM039
  - CM048
