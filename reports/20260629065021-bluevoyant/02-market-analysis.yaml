  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: practical-sam
    missingEvidence: Company-level disclosure showing revenue mix by MDR, TPRM, Microsoft-managed services, geography, and buyer segment.
    whyItMatters: Without segment mix, the public SAM lens remains a low-confidence estimate and the valuation case cannot rest on a precise share claim.
    diligencePath: Ask management for module-level ARR or bookings, regional mix, and the share of revenue tied to regulated large-enterprise accounts.
    relatedQuestionRefs:
    - QM010
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: adoption-triggers
    missingEvidence: Win-loss data, average sales-cycle length, and budget-owner patterns by module and customer segment.
    whyItMatters: Buyer and payer logic is directionally supportable from public sources, but the highest-value procurement triggers still need management or customer interview evidence.
    diligencePath: Request pipeline-stage conversion by MDR versus TPRM, common trigger events, and persona-level budget ownership from management and customer references.
    relatedQuestionRefs:
    - QM015
    relatedTableRefs:
    - TM003
    - TM004
  - type: missing-source
    severity: minor
    topic: independent-roi-validation
    missingEvidence: Independent customer evidence on false-positive reduction, remediation speed, renewal expansion, and cross-sell outcomes using BlueVoyant modules.
    whyItMatters: The market thesis improves if BlueVoyant's category overlap translates into measurable operational ROI beyond vendor-authored product claims.
    diligencePath: Collect non-vendor-selected customer interviews or procurement records with before/after operating metrics for MDR and TPRM deployments.
    relatedQuestionRefs:
    - QM021
    - QM022
    - QM023
  - type: conflicting-data
    severity: minor
    topic: market-definition-drift
    missingEvidence: A harmonized 2026 taxonomy separating pure software, managed services, and adjacent GRC/review workflows across public market reports.
    whyItMatters: Analyst reports disagree materially on what counts inside MDR and TPRM, so unadjusted headline TAMs can mislead valuation work.
    diligencePath: Standardize one internal taxonomy and re-map each retained analyst report to that definition before using any single TAM number in later chapters.
    relatedQuestionRefs:
    - QM008
    relatedTableRefs:
    - TM002
