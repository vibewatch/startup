- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for BlueVoyant
  - Diligence ask
  rows:
  - - SEC cyber disclosure governance
    - Driver
    - Current
    - Expands buyer set from SOC teams to audit, legal, and board stakeholders who need evidence-backed cyber workflows
    - Ask management which share of pipeline is tied to public-company governance requirements
  - - NIS2 and broader EU cyber obligations
    - Driver
    - Current through 2026 enforcement cycles
    - Makes supplier cyber posture and resilience reporting more urgent for covered sectors
    - Quantify BlueVoyant's exposure to NIS2-covered industries and EU-headquartered accounts
  - - CISA / NIST supply-chain formalization
    - Driver
    - Structural
    - Validates cyber supply-chain risk as a resilience discipline spanning hardware, software, and managed services
    - Test whether BlueVoyant wins when buyers frame SCRM as resilience rather than procurement compliance
  - - Third-party incident frequency
    - Driver
    - Immediate
    - Real incidents create emergency budgets for continuous monitoring, remediation, and dependency mapping
    - Ask for case studies where supplier incidents accelerated purchase timing
  - - Fourth-party blind spots and concentration risk
    - Driver
    - Immediate and expanding
    - Strengthens demand for dependency mapping and what-if analysis beyond direct vendors
    - Verify how often fourth-party analytics expands existing TPRM deals
  - - AI-assisted triage and Microsoft optimization
    - Driver
    - Near-term
    - Supports MDR upsell into Microsoft-heavy environments and lowers cost-to-serve narrative
    - Request independent proof of alert-volume reduction and remediation-time improvement
  - - Tool sprawl and weak integration
    - Constraint
    - Persistent
    - Disconnected buyer workflows slow cross-sell and standardization across MDR and TPRM modules
    - Request win/loss data on deals blocked by platform overlap or internal integration issues
  - - MDR label confusion and crowded evaluations
    - Constraint
    - Current
    - Buyer confusion raises proof burden and favors vendors with clearer category ownership or bundling power
    - Ask how BlueVoyant differentiates against managed EDR and larger XDR platforms
  - - Insurance softening and budget scrutiny
    - Constraint
    - Current
    - Falling insurance pricing can reduce one urgency lever even while claims severity stays high
    - Test whether pipeline quality changes when cyber-insurance pricing softens
  - - No public SOM disclosure
    - Constraint
    - Current
    - Makes market-share underwriting imprecise and limits valuation confidence from public evidence alone
    - Request module-level revenue mix, ACV bands, and renewal/cross-sell metrics
  notes: Timing and strategic implications are synthesized from regulation, market surveys, and BlueVoyant product positioning. Constraint rows are as important as driver rows for valuation relevance.
