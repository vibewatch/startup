company:
  name: BlueVoyant
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    BlueVoyant competes in two real but definition-sensitive categories: managed detection and response (MDR) and cyber-focused third-party risk management (TPRM). Public sources support strong growth in both markets, but published 2026 baselines still conflict materially, with MDR clustered around $3.9–5.1B and TPRM around roughly $8–11.5B on a normalized 2026 basis. The investable read is that regulation, third-party incident pain, fourth-party visibility gaps, and SecOps skills shortages create durable demand for BlueVoyant's cross-category wedge; the caution is that public evidence still does not support a precise SOM because BlueVoyant does not disclose segment mix, pricing, or module-level revenue.
sections:
- id: market-boundary-and-adjacencies
  title: Market Boundary and Adjacent Spend
  body: >-
    BlueVoyant should be framed as operating in the overlap between managed detection and response and cyber-focused third-party risk management, not as a generic cybersecurity vendor and not as a broad GRC suite. The MDR pages emphasize augmentation of existing EDR, SIEM, cloud, and Microsoft security stacks with 24x7 monitoring, incident response, and automation. The TPRM pages emphasize continuous monitoring, analyst-directed remediation, questionnaire workflows, zero-day alerting, and fourth-party mapping. That boundary matters because it defines what spend belongs in the core opportunity. Included spend is the part of security operations and vendor-risk budgets that buys continuous detection, validation, remediation, and external dependency visibility. Adjacent spend sits in GRC, board reporting, and broader resilience workflows, while the main substitutes remain in-house SOC buildouts, periodic questionnaires, spreadsheet-led vendor reviews, and point products that only solve one layer
    of the problem.
  claimRefs:
