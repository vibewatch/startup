  - id: TP003
    title: Pricing / Packaging Comparison
    columns:
      - Vendor
      - Public Pricing Visibility
      - Contract / Packaging Signal
      - What Is Publicly Emphasized
      - Competitive Implication
    rows:
      - - BlueVoyant
        - No public list pricing on retained pages
        - Quote-based platform and managed-service bundles
        - MDR, TPRM, DRP, and professional services sold together
        - Cross-sell flexibility is a strength, but outside buyers cannot benchmark list ACV from public pages
      - - CrowdStrike Falcon Complete
        - No public list pricing on retained pages
        - Quote-based MDR on the Falcon platform
        - Agentic MDR, deterministic automation, and broad native telemetry
        - Customers already on Falcon can rationalize spend inside a broader platform contract
      - - Palo Alto Networks
        - No public list pricing on retained pages
        - Quote-based XSIAM plus Unit 42 managed services
        - Unified SOC stack and managed services
        - Bundle economics can undercut service-led challengers in large-suite accounts
      - - Arctic Wolf
        - No public list pricing on retained pages
        - Security operations bundles with concierge delivery and warranty
        - Outcome-led managed service rather than tool purchase
        - Appeals to buyers seeking outsourced outcomes, but public comparability is still low
      - - Rapid7
        - No public list pricing on retained pages
        - Platform subscription plus managed operations
        - Exposure management + SIEM + managed operations
        - Natural expansion path for Rapid7 customers, but opaque public pricing remains a diligence item
      - - ReliaQuest
        - No public list pricing on retained pages
        - Enterprise platform with integration-heavy deployment
        - Any-source GreyMatter operations and integrations
        - Best fit for complex enterprises, but procurement likely remains custom and services-heavy
      - - eSentire
        - No public list pricing on retained pages
        - Managed MDR / XDR service contract
        - Unlimited hunting and incident handling messaging
        - Good for outcome buyers, but less transparent for early shortlist cost screens
      - - SecurityScorecard / BitSight
        - No public list pricing on retained pages
        - Quote-based ratings / TPRM programs
        - Continuous monitoring, questionnaires, AI summaries, vendor-network intelligence
        - Budget path often runs through procurement, risk, or insurance rather than the SOC
    notes: This table compares pricing visibility and packaging signals only. Retained official pages generally omit enterprise list pricing, so contract values and realized discounts remain a diligence gap.
    claimRefs:
      - CP041
      - CP042
      - CP043
      - CP044
  - id: TP004
    title: Moat Durability / Competitive Risk Register
    columns:
      - Moat or Risk Claim
      - Primary Threat
      - Severity
      - Current Mitigation Signal
      - Diligence Ask
    rows:
      - - Microsoft-specialist MDR depth
        - CrowdStrike, Palo Alto, and Microsoft-native alternatives can offer more native automation or bundle economics
        - High
        - BlueVoyant AI launch and 1,200+ Sentinel deployments strengthen the specialist story
        - Break out revenue mix from Microsoft-heavy accounts vs. non-Microsoft accounts
      - - Cross-budget MDR + TPRM + DRP positioning
        - Buyers may still split SOC and vendor-risk budgets and select separate best-of-breed tools
        - High
        - BlueVoyant markets all four motions together and government C-SCRM broadens the story
        - Measure multi-product attach rate and expansion from MDR into TPRM
      - - Outside-in supplier illumination
        - SecurityScorecard and BitSight operate much larger public data networks and stronger ratings brands
        - High
        - BlueVoyant adds analyst-led remediation and government mission framing rather than ratings alone
        - Benchmark supplier coverage, false positives, and remediation speed against ratings vendors
      - - Services-led delivery model
        - AI-native and platform-native MDR can shift more investigation burden into software and automation
        - High
        - BlueVoyant AI moves the model toward agentic SecOps and self-service SaaS
        - Test analyst-to-customer leverage and escalation load before and after BlueVoyant AI deployment
      - - Public pricing opacity
        - Suite vendors can hide discounts inside broader contracts and make standalone comparison harder
        - Medium
        - BlueVoyant can package MDR and TPRM together when buyers want one partner
        - Obtain apples-to-apples ACV, ramp, and renewal benchmarks in diligence
      - - Lower MDR market visibility
        - PeerSpot mindshare and ranking suggest weaker shortlist gravity than CrowdStrike or category leaders
        - Medium
        - BlueVoyant can target regulated or Microsoft-led use cases instead of generic MDR bake-offs
        - Validate enterprise brand awareness and RFP inclusion rates by vertical
    notes: Severity reflects author judgment based on retained public evidence. Diligence asks identify the private data needed to test whether the observed moat or risk is durable.
