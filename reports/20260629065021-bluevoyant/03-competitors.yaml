  - id: weaknesses-and-adverse-evidence
    title: Weaknesses, Adverse Evidence, and Moat Durability
    body: >-
      The most important disconfirming evidence is not that BlueVoyant lacks product breadth, but that larger competitors can frame the same job with stronger market visibility or lower operational friction. PeerSpot's June 2026 review page puts BlueVoyant at just 0.9% MDR mindshare, down from 1.2% a year earlier, and its direct comparison page ranks BlueVoyant #34 versus CrowdStrike #2 while noting weaker reporting customization and potentially heavier configuration. Daylight's 2026 buyer guide is blunter: it classifies BlueVoyant among MSSP-style MDR providers chosen for broad security partnership, but with more analyst-hours-intensive workflows than AI-native or XDR-extended alternatives. On the TPRM side, BlueVoyant must also defend against much larger external data networks from SecurityScorecard and BitSight. Public pricing opacity across nearly every retained competitor page compounds the challenge because it makes incumbent suite bundling and multi-product discounts harder to
      benchmark from the outside. BlueVoyant therefore has a real moat in cross-budget service breadth, but not an obviously durable moat in category visibility, data-network scale, or platform lock-in.
    claimRefs:
