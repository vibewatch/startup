- id: TV006
  title: Final Diligence Asks
  columns:
  - Topic
  - Missing Evidence
  - Why It Matters
  - Owner / Diligence Path
  rows:
  - - 2026 ARR quality
    - Current ARR, recurring vs. services mix, and ARR bridge from 2023 to 2026.
    - Determines whether the 2025 ARR proxy is real and whether a 4.7x multiple is fair or too high.
    - Request current board deck or CFO operating pack.
  - - Margin and retention profile
    - Gross margin, adjusted EBITDA, gross retention, and NRR by major product line.
    - Needed to know whether BlueVoyant deserves hybrid-services or software-platform multiples.
    - Management diligence session plus cohort-level retention exhibits.
  - - Cap table and diluted share count
    - Latest fully diluted share count, preference stack, option pool, and liquidation waterfall.
    - Per-share return can diverge sharply from enterprise-value math when dilution is opaque.
    - Data room cap-table export or counsel-prepared summary.
  - - Actual secondary-clearing prices
    - Recent broker sheets, matched trades, and bid-ask history from cap-table administrators or marketplaces.
    - The best public secondary signal is negative; true clears can validate or refute that discount.
    - Direct broker diligence and admin records from Forge / Notice / company.
  - - Any post-2023 financing terms
    - Evidence of debt, structured financing, or side letters after the Series E round.
    - Later capital structure changes can alter downside protection, seniority, and valuation interpretation.
    - CFO/legal confirmation plus financing documents.
  notes: Each ask is tied to a current blocker in the public record rather than a generic diligence wishlist.
