- id: TV005
  title: Thesis-Break and Kill Triggers
  columns:
  - Trigger
  - Threshold / Event
  - Transmission to Thesis
  - Action Implication
  rows:
  - - Secondary discount widens
    - Observable discount to the last round moves beyond ~50% or a new round prices below $0.8B.
    - Would imply the market sees materially weaker quality or liquidity than the base case assumes.
    - Pause and re-underwrite around bear-case levels.
  - - Services-heavy economics confirmed
    - Gross margin or revenue mix shows the business is materially more services-heavy than implied.
    - Would cap the justified multiple closer to the managed-security range.
    - Move stance from fair toward stretched.
  - - No real price discovery
    - No broker-backed secondary clears, bids, or cap-table evidence emerge over the next diligence cycle.
    - Liquidity discount remains unresolved, so the market cannot validate the headline mark.
    - Keep recommendation at research-more or downgrade.
  - - Opaque post-2023 financing
    - Management cannot document any post-2023 financing terms, share count, or preference stack.
    - Without dilution mechanics, return math is unreliable even if enterprise value looks reasonable.
    - Do not commit capital without a cap-table package.
  - - Growth quality weakens
    - ARR proxy proves overstated, or retention / expansion metrics fall below software-like thresholds.
    - Breaks the base-case assumption that BlueVoyant merits at least a hybrid platform multiple.
    - Re-rate toward the bear band immediately.
  notes: Thresholds are diligence triggers rather than contractual covenants; they translate public-market evidence into concrete kill criteria.
