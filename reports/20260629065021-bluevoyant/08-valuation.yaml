  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: post-2023 financing
    missingEvidence: Primary documentation showing whether BlueVoyant completed any debt, structured financing, or side-letter capital event after the November 2023 Series E round.
    whyItMatters: A later financing event can change dilution, seniority, and whether the $1B headline still reflects true current value.
    diligencePath: Request CFO / counsel confirmation plus signed financing documents or board-approved capitalization update.
    relatedQuestionRefs:
    - QV006
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: current scale quality
    missingEvidence: Current ARR composition, recurring versus services mix, gross margin, gross retention, and NRR by product line.
    whyItMatters: These metrics determine whether BlueVoyant deserves hybrid-services multiples or a higher-quality platform multiple in the bull case.
    diligencePath: Obtain management operating pack or board deck with segmented revenue, margin, and retention detail.
    relatedQuestionRefs:
    - QV010
    - QV029
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: secondary liquidity depth
    missingEvidence: Recent matched secondary trades, broker sheets, bid-ask ladders, and transaction sizes from active marketplaces or company administrators.
    whyItMatters: Preview-level platforms show caution, but real clearing evidence is needed to validate or disprove the visible discount signal.
    diligencePath: Collect broker data from Forge / Notice / cap-table admins and compare with company-approved transaction history.
    relatedQuestionRefs:
    - QV014
    - QV015
    relatedTableRefs:
    - TV005
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: capitalization waterfall
    missingEvidence: Fully diluted share count, preference stack, option pool, and liquidation waterfall as of 2026-06-29.
    whyItMatters: Enterprise value may look fair while common-equity returns are still unattractive if liquidation preferences or dilution are heavy.
    diligencePath: Require a current cap-table export and counsel-certified summary before term-sheet pricing.
