- id: TV002
  title: Thesis / Anti-Thesis
  columns:
  - Side
  - Argument
  - What Would Change the View
  rows:
  - - Thesis
    - BlueVoyant spans MDR, TPRM, DRP, and professional services, which broadens wallet share and comp relevance.
    - Proof that platform modules are becoming a larger share of revenue would strengthen the case.
  - - Thesis
    - 'Official sources show meaningful commercial scale: >900 clients, 40-plus countries, and historical triple-digit recurring-revenue growth.'
    - A credible 2026 update on client count, ARR quality, and retention would make the scale argument more durable.
  - - Thesis
    - If the $213.5M ARR proxy is directionally right, $1B equates to only about 4.7x ARR—well below premium cyber leaders.
    - Disclosure of gross margin and software mix could justify moving toward higher-quality platform multiples.
  - - Anti-thesis
    - Notice shows a 39% discount to the last round, implying secondary buyers may clear materially below the headline mark.
    - A recent broker sheet or executed transaction near or above $1B would directly rebut the discount signal.
  - - Anti-thesis
    - Forge shows limited activity and no visible Forge Price, which weakens confidence in current liquidity.
    - Visible bid-ask depth or matched secondary prints would reduce the liquidity discount.
  - - Anti-thesis
    - Public sources disagree on total capital raised and do not expose current dilution, margins, or post-2023 financing terms.
    - A clean cap table, share count, preference stack, and current financial pack would convert the case from narrative to underwritten.
  notes: 'Arguments are intentionally price-sensitive: the positive case is real, but the anti-thesis is rooted in observable secondary and disclosure gaps.'
