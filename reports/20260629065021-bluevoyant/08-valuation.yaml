company:
  name: BlueVoyant
chapter:
  number: 8
  title: Valuation
  summary: 'BlueVoyant''s $1 billion private mark is not obviously excessive against a third-party $213.5 million ARR proxy, implying roughly 4.7x revenue—below the 2026 public cybersecurity median but not cheap enough to offset disclosure and liquidity risk. Notice shows a 39% discount to the last round, while Forge and Hiive expose thin public secondary visibility and public sources disagree on exact capital raised. Recommendation: research-more, medium confidence, high risk, valuation stance fair.'
sections:
- id: thesis-antithesis
  title: Investment Thesis and Anti-Thesis
  body: "BlueVoyant has enough scale and category breadth to make the company investable at the right price. Official company materials describe a unified platform spanning MDR, TPRM, digital risk protection, and professional services, not a single-point tool. That breadth matters because it supports a comp set wider than pure MDR and gives BlueVoyant multiple product wedges into enterprise and public-sector budgets. The 2023 growth release also suggests meaningful commercial proof: more than 900 clients, presence in 40-plus countries, and historical triple-digit recurring-revenue expansion since 2018. If the third-party 2025 ARR proxy of $213.5 million is directionally right, BlueVoyant is already a scaled cybersecurity vendor rather than a speculative pre-revenue unicorn.\n\nThe anti-thesis is valuation quality, not company existence. Public secondary evidence is the key disconfirming signal in this chapter: Notice shows a 39% discount to the last round, Forge calls market activity limited,\
    \ and Hiive exposes no visible price history on the public listing page. Those signals imply that the private market is either illiquid, cautious, or both. Meanwhile, the company still lacks public disclosure of current gross margin, retention, services mix, diluted share count, and any post-2023 financing terms. That combination keeps the right call at research-more rather than buy, even though the core business appears credible.\n        "
