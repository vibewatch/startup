- id: scenario-analysis
  title: Bull, Base, and Bear Valuation Scenarios
  body: "The scenario framework starts with what is actually observable. In the base case, BlueVoyant deserves a multiple around 4.0x to 5.0x on the $213.5 million ARR proxy, which yields roughly $0.85 billion to $1.1 billion. That range is consistent with the company's real scale and product breadth, but also with hybrid-margin caution and limited liquidity. In the bull case, BlueVoyant can stretch into roughly $1.2 billion to $1.5 billion if management proves that recent growth is durable, that the software and platform layer is expanding faster than services, and that recent secondary or primary price discovery supports a higher-quality cyber multiple. The bull case is therefore an execution-and-disclosure case, not just a market-multiple case.\n\nThe bear case is visible already. Notice's 39% discount to the last round and Forge's absent price signal point to a downside band around $0.6 billion to $0.8 billion if the next real clearing event comes below the headline mark or if investors\
    \ decide BlueVoyant belongs in the 3x to 4x managed-security range instead of a platform premium bucket. The skew is important: the public evidence does not scream overvaluation, but it does show that downside is already partially discoverable while upside still depends on private facts the market has not shared.\n        "
