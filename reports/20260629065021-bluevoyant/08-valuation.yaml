- id: financing-secondary-signals
  title: Financing History, Disclosure Quality, and Secondary Signals
  body: "BlueVoyant's public funding history is clear at the headline level but fuzzy in the details that matter for pricing discipline. The retained sources confirm a $250 million Series D in February 2022 and more than $140 million of new funding in November 2023, but the public filing trail is incomplete. The SEC browse result surfaces Form D notices only for 2017, 2019, and 2020; it does not surface later financing terms. Caplight, CB Insights, and GetLatka converge on $665.5 million of total funding, while Tracxn reports $696 million across six rounds and SiliconANGLE quotes Tracxn at about $646 million after the 2023 round. This is not fatal, but it means investors are using vendor summaries instead of a crisp public ledger.\n\nThe secondary-market platforms deepen that caution. Caplight still anchors BlueVoyant at an estimated $1 billion and shows the last round as Series E on November 29, 2023. Forge still shows the last known valuation as $1 billion from February 2022, calls current\
    \ market activity limited, and does not publish a Forge Price. PM Insights and Hiive both confirm that secondary infrastructure exists, yet the public previews do not offer enough live depth to underwrite a precise clearing price. Put differently: the market offers directionally useful signals, but not enough transparent liquidity to turn those signals into conviction without direct broker data.\n        "
