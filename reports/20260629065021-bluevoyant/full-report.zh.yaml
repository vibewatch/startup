      - number: '8.4'
        title: 牛市、基准与熊市估值情景
        blocks:
          - type: paragraph
            body: >-
              情景框架从真正可观察的内容出发。基准情景下，BlueVoyant 以 $213.5 million ARR 代理值计，应获得约 4.0x 到 5.0x 倍数，对应大约 $0.85 billion 到 $1.1
              billion。这个区间既符合公司的真实规模和产品宽度，也反映了对混合利润率和有限流动性的谨慎。牛市情景下，如果管理层证明近期增长可持续、软件和平台层扩张快于服务，并且近期二级或一级价格发现支持更高质量的网络安全倍数，BlueVoyant
              可上探约 $1.2 billion 到 $1.5 billion。因此，牛市情景依赖执行和披露改善，而不只是市场倍数扩张。


              熊市情景已经可见。Notice 较上一轮折价 39%，Forge 又没有价格信号；如果下一次真实清算事件低于标题估值，或投资者认为 BlueVoyant 应归入 3x 到 4x
              托管安全区间而非平台溢价桶，下行区间大约在 $0.6 billion 到 $0.8 billion。偏度很关键：公开证据并没有强烈显示估值过高，但已经显示部分下行可以被发现，而上行仍依赖市场尚未共享的私有事实。
                      
