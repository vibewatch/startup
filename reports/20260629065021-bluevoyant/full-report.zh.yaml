              保留证据支持这样一家公司：真实经常性需求、充足私募资本背书，以及足够重要的企业客户宽度。但证据并不支持干净的财务承销案例。现金、烧钱速度、runway、债务义务、实际定价、毛利率、留存、CAC
              和回本周期仍在公开记录之外。历史 PPP
              债务信号和英国备案轨迹显示有公司文件活动，但无法回答当前杠杆或流动性问题。不利的员工评论没有推翻增长叙事，却提示资源约束可能与收购式扩张和高管扩编并存。因此，正确财务结论是建设性但仅凭公开证据不可投资：BlueVoyant
              看起来具备商业意义，但仍需要管理层数据来判断收入质量、运营杠杆和下一轮融资依赖。
