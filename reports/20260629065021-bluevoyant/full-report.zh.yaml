chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              BlueVoyant 将自己呈现为一家网络防御平台公司，成立于 2017 年，总部在纽约。其官方公司页和联系页把当前足迹锚定在曼哈顿，同时也显示出更广的跨国运营基础。公司称拥有 600 多名员工、45 个国家超过
              1,000 家客户；即便不看第三方估算，也已越过创业孵化阶段，进入有规模的私营公司区间。产品上，BlueVoyant
              并不把自己描述为单点工具厂商。其平台结合托管检测与响应、第三方风险管理、数字风险防护和专业服务，收入看起来来自经常性软件模块以及分析师主导的托管运营。所审阅材料始终把 BlueVoyant
              放在企业、政府和关键基础设施用例中，而不是狭窄的 SME 或消费者路径。这一组合会影响后续尽调：它意味着更长销售周期、更重服务导入，以及对受监管或任务关键买家的差异化敞口。
