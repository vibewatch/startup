      - number: '8.5'
        title: 建议、退出纪律与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              仅从公开证据看，建议是继续研究。BlueVoyant 看起来是一家合法且有规模的网络安全平台，当前 $1 billion 标题估值也没有明显脱离保留的 ARR
              代理值。但这不等于估值有吸引力。公开市场只提供预览级二级信号，其中最强的一个还是负面信号。此外，保留来源没有披露当前稀释后股数、利润率画像、留存指标，或 2023 年 11
              月之后任何融资条款。缺少这些事实，买方可以解释为什么 $1 billion 说得通，但还不能解释为什么它明显对自己有利地错价。


              公开证据中的退出准备度也有限。Hiive 称 BlueVoyant 仍为私人持有，合格投资者只能通过二级市场在 IPO 前获得访问；没有任何保留来源显示 IPO
              进程、战略出售进程或新的估值重置。可操作路径很直接：拿到当前 ARR 结构、毛利率、NRR 或客户留存、cap table
              和优先权栈，以及经纪商或管理层给出的近期真实二级成交。如果这些数据确认类软件经济性，且二级价格稳定或改善，评级可以上调。若它们反而确认收入偏服务、二级交易继续折价，合理标签就会滑向估值偏紧。
                      
