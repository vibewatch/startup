  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相邻支出
        blocks:
          - type: paragraph
            body: >-
              BlueVoyant 应被框定在托管检测与响应和网络安全导向第三方风险管理的交集，而不是泛化网络安全厂商，也不是广义 GRC 套件。MDR 页面强调在既有 EDR、SIEM、云和 Microsoft
              安全栈之上补充 24x7 监控、事件响应和自动化。TPRM
              页面强调持续监控、分析师引导修复、问卷工作流、零日告警和第四方映射。边界很重要，因为它定义了核心机会中应计入哪些支出。纳入的支出，是安全运营和供应商风险预算中用于持续检测、验证、修复和外部依赖可见性的部分。相邻支出位于
              GRC、董事会汇报和更广的韧性工作流，主要替代方案仍是自建 SOC、定期问卷、电子表格驱动的供应商审查，以及只解决单层问题的点产品。
