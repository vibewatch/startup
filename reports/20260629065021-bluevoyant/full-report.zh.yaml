  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: 公开产品叙事可拆成五层栈：从信号采集，到 AI 编排，再到分析师驱动的结果。
    approximationNotes: 该图综合了当前产品页、发布稿、信任中心元数据和 Microsoft 材料，并非复制供应商发布的系统图。
