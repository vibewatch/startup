      - number: '7.4'
        title: 公共部门暴露、领导层与融资不透明
        blocks:
          - type: paragraph
            body: >-
              BlueVoyant 的公共部门定位同时带来韧性和集中度风险。积极一面是，公司通过 Carahsoft
              出现在多个合同工具上，并围绕供应链防御、网络安全和合规支持提出政府专属价值主张。由于这些工作对应真实采购和任务需求，而不是可有可无的试验，需求可能更耐久。负面一面是，政府相关收入通常推进更慢、合规门槛更高，也比普通商业
              SaaS 更依赖认证证据和合同执行。BlueVoyant 的公开材料没有披露政府或国防客户贡献多少收入、哪些机构最关键，或续约如何分布在各项目之间。因此，公开记录能确认暴露存在，却无法确认分散度。


              融资能见度同样不完整。当前材料里最清晰的资本事实，是 2023 年公告称 BlueVoyant 为支持收购 Conquest Cyber 完成超过 $140 million 的 Series E 融资。PM
              Insights 显示，围绕公司的二级市场和估值监测至少存在一定活动，但公开预览有意保持很薄，无法提供可承销的当前指标。这里没有引用任何关于
              ARR、烧钱、runway、杠杆、清算优先权或当前估值的公开披露。这并不证明公司承压，但意味着后期私募市场风险真实存在：如果增长、Microsoft
              经济性或公共部门中标率走弱，外部投资者将不得不给一家关键运营指标仍基本私有的公司定价。
