      - number: '8.3'
        title: 公开可比公司与倍数分析
        blocks:
          - type: paragraph
            body: >-
              BlueVoyant 的合适公开可比公司集合本来就应是混合型。高增长一端，CrowdStrike、Palo Alto Networks 和 Fortinet
              代表有规模的安全平台，具备强安全运营业务和明显更高的软件质量。相对温和的一端，SentinelOne、Qualys、Tenable 和 Rapid7 更适合作为参考，因为 BlueVoyant
              的混合模式仍更接近运营安全和风险管理，而不是纯云安全赢家通吃叙事。Windsor Drake 的 2026 年行业框架是关键宏观锚点：公开网络安全公司约按 6.0x 到 6.5x NTM
              收入交易，而托管安全服务约低在 3x 到 5x。


              按 2025 年 ARR 代理值计算，BlueVoyant 隐含 4.7x 倍数，落在这片区间的中低位置。它远低于 CrowdStrike 的 34.3x 和 Palo Alto 的 23.28x，也低于
              Fortinet 的 15.2x，更接近 SentinelOne 的 4.61x、Qualys 的 5.73x 和 Tenable 的 3.32x。如果 BlueVoyant
              的收入组合包含有意义的服务成分，且平台自动化优势尚未转化为已披露的类软件利润率，这个位置在方向上合理。因此，可比公司结论需要保留层次：从收入倍数看，$1 billion
              并不显然过高，但折价也不足以构成一个公开证据清晰支持的入场机会。
                      
