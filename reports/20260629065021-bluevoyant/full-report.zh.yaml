  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              BlueVoyant 并不处在一个干净的单一市场盒子里。Gartner 的 2026 年 MDR 市场定义，将托管检测与响应视为供应商运营的一站式 SOC
              能力，并强调主动遏制，而非只做告警监控；BlueVoyant 自己的主页则同时营销四个相邻产品：MDR、第三方风险管理、数字风险防护和专业服务。这让竞争场比普通 MDR 候选清单更宽。一侧，BlueVoyant
              面对 CrowdStrike、Palo Alto Networks、Arctic Wolf、Rapid7、ReliaQuest 和 eSentire 等直接 MDR 对手。另一侧，它面对
              SecurityScorecard、BitSight 等 TPRM 与网络评级平台，也面对 OneTrust 或 ProcessUnity 风格的供应商风险项目和内部 SOC
              现状等工作流导向替代方案。实际含义是：当买方想要一个伙伴同时覆盖 SOC 运营和供应商网络防御时，BlueVoyant 可以胜出；当预算所有者把问题收窄为平台原生 MDR
              或采购中心的供应商风险自动化时，它可能被替代。
