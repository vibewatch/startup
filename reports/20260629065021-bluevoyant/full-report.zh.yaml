        title: BlueVoyant 差异化、打包方式与可能胜区
        blocks:
          - type: paragraph
            body: >-
              BlueVoyant 最有特色的公开故事，是 Microsoft-heavy MDR、由外向内供应商防御和相邻数字风险服务的组合，而不是宣称自己是最佳端点或评级厂商。其保留页面强调 1,200 多个
              Microsoft Sentinel 部署、24x7 区域 SOC 覆盖、50 多名认证 Microsoft 交付和 SOC 工程师，以及一个政府产品：无需专有供应商数据，就能用 70,000
              多个数据源映射数万家供应商。2026 年 6 月 BlueVoyant AI 发布增加了第二个重要角度：管理层正试图从纯服务走向 agentic SecOps 平台，既可作为托管服务消费，也可作为
              self-service SaaS 使用。这让 BlueVoyant 在受监管、Microsoft-heavy 环境中有可信胜区，尤其当买方想用一个供应商覆盖托管 SOC
              运营和第三方网络防御时。若买方想在单一专有安全套件内把调查负担降到最低，或采购主导的 TPRM 项目已经偏好评级厂商加工作流软件，BlueVoyant 就不那么合适。
