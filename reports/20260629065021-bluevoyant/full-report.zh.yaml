      - number: '7.5'
        title: 监测触发器、缓释成熟度与数据缺口
        blocks:
          - type: paragraph
            body: >-
              缓释图景可信，但不完整。BlueVoyant 的确有真实强项：多年获得 Microsoft 认可、可见的公共部门合同入口、不断扩大的 EMEA SOC
              足迹，以及横跨托管检测、第三方风险和供应链防御的产品组合。这些不是装饰性信号。但公司的关键剩余风险，只能被公开证据部分缓释。Microsoft 依赖被渠道实力削弱了，但没有消失。BlueVoyant AI
              可能改善单位经济性和服务质量，但同一次发布也扩大了执行范围。政府暴露能创造耐久需求，也会提高合规证据和采购纪律门槛。融资风险仍很难打分，因为公开披露远远没有达到衡量稀释或退出风险所需的指标粒度。


              因此，更合适的看法是：BlueVoyant 拥有真实战略资产，但执行容错空间很窄。最可操作的否决标准都可以观察：Microsoft 功能商品化压缩服务差异化；AI 质量或人工接管证据薄弱；在公共部门竞标中无法证明
              CMMC/NIST 准备就绪；Steward
              事项出现不利进展；或新的融资事件暗示压力而非选择权。公开材料还在集中度、服务质量和资本结构上留下实质性尽调缺口。这些遗漏不会否定业务，但会让剩余风险评分保持偏高。除非管理层能拿出客户组合、续约耐久性、SOC
              质量和资本条款的硬指标，审慎的承销立场应是：BlueVoyant 具备战略吸引力，但对执行高度敏感。
