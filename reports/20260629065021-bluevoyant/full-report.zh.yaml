        - 如果 ARR 质量弱于代理值，即便基准情景也会被压缩。
      - - 熊市
        - 下一次真实成交事件验证二级市场折价，并把 BlueVoyant 推向托管安全或服务类公司的估值区间。
        - ARR 倍数 3.0x–3.8x
        - 0.60–0.80
        - 与 Notice 折价和可见流动性稀薄一致。
        - 新资本以更低估值进入，或利润率不佳，都会加速下行。
    notes: 情景区间是使用公开 ARR 代理值作出的 USD 十亿美元口径分析估算；它们不是管理层指引，也不是经纪商报价。
