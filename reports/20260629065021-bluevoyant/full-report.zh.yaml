  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时点
      - 对 BlueVoyant 的含义
      - 尽调问题
    rows:
      - - SEC 网络安全披露治理
        - 驱动因素
        - 当前
        - 买方从 SOC 团队扩展到审计、法务和董事会利益相关方；这些人需要有证据支撑的网络安全工作流
        - 询问管理层，管线中有多少比例与上市公司治理要求挂钩
      - - NIS2 及更广泛的欧盟网络安全义务
        - 驱动因素
        - 当前至 2026 年执法周期
        - 覆盖行业更急于掌握供应商网络安全状态并提交韧性报告
        - 量化 BlueVoyant 对 NIS2 覆盖行业和欧盟总部账户的暴露
      - - CISA / NIST 供应链正式化
        - 驱动因素
        - 结构性
        - 把网络供应链风险确认为一门韧性学科，范围横跨硬件、软件和托管服务
        - 测试买方把 SCRM 定义为韧性而非采购合规时，BlueVoyant 是否仍能赢单
      - - 第三方事件频率
        - 驱动因素
        - 立即
        - 真实事件会催生应急预算，用于持续监控、整改和依赖关系梳理
        - 要求提供供应商事件加快采购时点的案例
      - - 第四方盲区与集中度风险
        - 驱动因素
        - 立即且持续扩大
        - 强化对依赖关系梳理和直接供应商之外情景分析的需求
        - 核实第四方分析有多常扩展既有 TPRM 交易
      - - AI 辅助分诊与 Microsoft 优化
        - 驱动因素
        - 近期
        - 支撑 MDR 向 Microsoft 重度环境加售，也降低服务成本叙事
        - 要求独立证明告警量下降和整改时间改善
      - - 工具蔓延与集成薄弱
        - 约束
        - 持续存在
        - 买方工作流彼此断开，会拖慢 MDR 与 TPRM 模块的交叉销售和标准化
        - 要求提供因平台重叠或内部集成问题受阻交易的赢单 / 输单数据
      - - MDR 标签混乱与评估拥挤
        - 约束
        - 当前
        - 买方困惑会抬高举证门槛，也更偏向品类归属更清晰或打包能力更强的厂商
        - 询问 BlueVoyant 如何对托管 EDR 和更大型 XDR 平台做差异化
      - - 保险价格走软与预算审查
        - 约束
        - 当前
        - 保险价格下行可能削弱一个紧迫性杠杆，即便索赔严重度仍然较高
        - 测试网络保险定价走软时，管线质量是否变化
      - - 没有公开披露 SOM
        - 约束
        - 当前
        - 市场份额承销因此不精确，仅靠公开证据也难以支撑估值信心
        - 要求提供模块级收入组合、ACV 区间和续约 / 交叉销售指标
    notes: 时点和战略含义综合自监管、市场调研和 BlueVoyant 产品定位。约束行和驱动因素行一样，对估值判断很重要。
