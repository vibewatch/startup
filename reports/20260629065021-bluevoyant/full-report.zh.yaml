      - number: '1.2'
        title: 领导层、治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              BlueVoyant 当前公开领导层图谱由近期交接塑造。John Hernandez 现任 CEO，联合创始人 Jim Rosenthal 转任主席，联合创始人 Thomas Glocer
              仍任副主席。当前运营班底足以覆盖财务、产品、技术、信息安全、人力资源、政府解决方案、区域销售和伙伴关系，降低了对任何单一职能副手的依赖。即便如此，创始人影响力仍然重要，因为 Rosenthal 与 Glocer
              仍是核心治理人物，公司的公开叙事也仍高度依赖创始人身份。这个组合指向一种显著但可管理的关键人物风险：BlueVoyant 已完成最高层交接，但其公共可信度、投资者连续性和战略叙事仍穿过创始人。此前公开任命
              Michael Montoya 为 COO，也说明 BlueVoyant 在规模化阶段愿意刷新董事会以下的运营层。
