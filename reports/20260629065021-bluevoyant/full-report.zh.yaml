      - number: '2.5'
        title: 约束、不利信号与估值相关性
        blocks:
          - type: paragraph
            body: >-
              市场论点不错，但并非没有摩擦。KPMG 显示，大多数项目仍只与企业风险部分整合，端到端托管服务采用率仍低，这意味着买方常用割裂工具、局部试点或狭窄用例接近 TPRM 与 MDR。CyberProof
              警告，一些供应商滥用 MDR 标签，只提供托管 EDR 或工具中心监控，却没有完整的人类响应领导，这制造买方混淆并拖慢类别转化。PeerSpot 拥挤的 MDR 类别和 CRC
              关于网络保险定价走软的证据，也强化了一个判断：即使索赔严重性继续上升，预算紧迫感也会回落。估值上，正确结论是 BlueVoyant
              所在市场足够大、痛点足够重，但估值倍数压缩仍取决于公司能否把跨类别故事转化为可衡量的模块渗透、更低买方混淆，以及公开数据可支撑的 SOM。
