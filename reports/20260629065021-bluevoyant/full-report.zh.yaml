  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台定义与融合架构
        blocks:
          - type: paragraph
            body: >-
              BlueVoyant 现在营销自己时，较少说成独立 MDR 供应商，更多说成统一网络防御操作系统。主页、Cyber Defense Platform 页面和 2024 年发布材料一致描述了一个
              cloud-native 平台，横跨内部防御、第三方风险和外部数字风险监控。这很重要，因为产品定义贴着客户工作流：安全团队可以在同一运营模型下运行内部 SOC
              分诊、供应商修复以及品牌或凭证下架，而不必把分散点工具拼起来。公司较新的 AI 层强化了这一融合论点，而不是取代它；BlueVoyant AI
              被描述为一个控制平面，用来决定何时把工作路由给确定性自动化、何时调用人类分析师、何时让 agents 行动。尽调正面结论是，产品组合打包有一致性。尽调保留意见是，除少数 Microsoft-specific
              文档外，公开架构仍停留在营销层深度。
