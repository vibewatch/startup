  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 决策流从规模和可比公司支撑出发，经过二级市场谨慎信号和披露缺口，最后落到继续研究的判断。
    data:
      nodes:
        - id: start
          label: BlueVoyant 估值判断
          description: 起点是私有公司约 $1B 的头部标记，以及保留的 2025 年 ARR 代理值 $213.5M。
        - id: scale
          label: 规模证据存在
          description: '>900 客户、全球覆盖、MDR 加 TPRM 平台广度，以及历史三位数经常性收入增长，支撑一个仍然成立的投资论点。'
        - id: comps
          label: 可比公司支撑混合但真实
          description: 隐含约 4.7x ARR，低于公开网络安全公司中位数，接近中等网络安全同业，而不是高溢价平台龙头。
        - id: secondary
          label: 二级市场给出谨慎信号
          description: Notice 显示 39% 折价；Forge 和 Hiive 暴露出稀薄或不完整的公开流动性信号。
        - id: opacity
          label: 关键私有事实缺失
          description: 当前利润率画像、留存、股权结构，以及 2023 年后任何融资条款，在保留的公开证据中仍未披露。
        - id: decision
          label: 建议：继续研究
          description: 该标记说得通，但吸引力并不明显；接受价格前需要做私有尽调。
    approximationNotes: 这只是逻辑决策架构；它概括公开证据的权重，而不是正式评分模型。
    claimRefs:
      - CV034
      - CV037
      - CV038
      - CV044
      - CV045
      - CV048
  - id: FV002
    title: 估值敏感性 — 2025 年 ARR 代理值的倍数
    type: bar
    layout: wide
    summary: 将不同 ARR 倍数应用于 $213.5M 的 2025 年 ARR 代理值，得到以百万美元计的示意企业价值。
    data:
      items:
        - label: 3.0x ARR
          value: 641
        - label: 4.0x ARR
          value: 854
        - label: 4.7x ARR（当前 $1B 标记）
          value: 1003
        - label: 5.0x ARR
          value: 1068
        - label: 6.0x ARR
          value: 1281
        - label: 7.0x ARR
          value: 1495
    approximationNotes: 数值按第三方 $213.5M ARR 代理值测算，并四舍五入至最接近的百万美元；它们不是经纪商报价。
    claimRefs:
      - CV022
      - CV023
      - CV034
      - CV035
      - CV041
      - CV042
      - CV043
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 各情形估值区间以百万美元计，并与当前 $1B 的公开标记对比。
    data:
      items:
        - label: 悲观情形估值
          low: 600
          high: 800
        - label: 基准情形估值
          low: 850
          high: 1100
        - label: 乐观情形估值
          low: 1200
          high: 1500
        - label: 当前公开标记
          low: 1000
          high: 1000
    approximationNotes: 区间为分析师估算，依据保留下来的公开证据、二级市场预览和可比倍数区间得出。
    claimRefs:
      - CV041
      - CV042
      - CV043
      - CV048
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 按 IC 视角给六个维度打分，这些维度最影响 BlueVoyant 当前估值判断。
    data:
      items:
        - label: 规模验证
          score: 8/10
          note: 以一家私营网络安全公司看，客户数量、地域覆盖和平台宽度都较强。
        - label: 增长验证
          score: 7/10
          note: 历史增长表述很强，但当前 ARR 质量仍来自供应商估算，而非公司披露。
        - label: 利润率可见度
          score: 3/10
          note: 保留下来的公开来源没有披露当前毛利率或服务收入占比，倍数判断因此缺少把握。
        - label: 二级流动性
          score: 2/10
          note: Notice 显示折价，Forge / Hiive 也没有给出足够深的公开价格发现。
        - label: 估值支撑
          score: 6/10
          note: 按 ARR 代理值和同业组看，$1B 标记说得通，但谈不上明显便宜。
        - label: 披露质量
          score: 4/10
          note: 公开来源里，融资总额、股权结构机制和 2023 年后的融资细节仍不透明。
    approximationNotes: 分数是分析性、相对性的判断，供 IC 讨论使用，不是模型机械推导出的结果。
    claimRefs:
      - CV037
      - CV038
      - CV044
      - CV046
      - CV047
      - CV048
      - CV050
