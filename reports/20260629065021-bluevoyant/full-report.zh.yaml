    rows:
      - - BlueVoyant
        - 混合 MDR + TPRM / C-SCRM
        - 600+ 名员工；1,200+ 个 Sentinel 部署；保留的 2026 年来源未更新私募融资
        - Microsoft 重度企业、受监管买方、政府供应链
        - 结合 MDR、TPRM、DRP 和服务，Microsoft 交付深度强
        - MDR 可见度低于最大的平台原生对手；公开融资 / 定价细节偏少
      - - Palo Alto Networks Unit 42 / Cortex XSIAM（平台）
        - 平台原生 MDR / SOC
        - 16K+ 名员工；全球 70K+ 客户
        - 已标准化 Palo Alto 的大型企业
        - 统一 AI SOC 平台，加上 Unit 42 服务和深度一方遥测
        - 最佳经济性和结果绑定 Palo Alto 技术栈；TPRM 重叠有限
      - - CrowdStrike Falcon Complete
        - 平台原生 MDR
        - 上市公司规模；每月整改 2.7M 次检测；中位遏制时间 1 分钟
        - 愿意标准化 Falcon 的企业和安全成熟中型市场客户
        - 原生端点、身份、云与 SIEM 遥测，叠加自主和人工响应
        - 相比 BlueVoyant 或 ReliaQuest，平台锁定更强，开放技术栈灵活性更低
      - - Arctic Wolf
        - 开放 XDR MDR
        - 10K+ 客户；1,000+ 名安全工程师；历史报道 $60M Series D 轮融资和约 $4.3B 估值
        - 希望共管结果的中大型企业到企业级买方
        - Concierge 交付、开放 XDR、保修和安全旅程模型
        - TPRM 和供应链网络防御不是核心采购动作
      - - Rapid7
        - 平台主导的托管运营
        - 全球 11,500+ 客户；上市公司规模
        - 希望统一暴露管理和检测的大型 SMB、中型市场和企业级买方
        - Command Platform 连接暴露管理、遥测和托管运营
        - 服务身份相比 BlueVoyant 差异化较弱；TPRM 重叠有限
      - - ReliaQuest
        - 开放平台企业 SecOps
        - 每天处理 50K+ 告警；255+ 技术合作伙伴；保留页面未披露客户数
        - Fortune 1000 和工具异构企业
        - 任意来源标准化、智能体 AI 队友和广泛集成深度
        - 公开规模和定价披露有限；没有 TPRM 专属数据网络护城河
      - - eSentire
        - 厂商独立 MDR
        - 2,000+ 客户，覆盖 35+ 行业；300+ 集成
        - 受监管中型市场、私募股权组合公司和高端中型企业团队
        - 人工主导遏制，叠加多信号 XDR 和无限狩猎 / 事件处理叙事
        - 品牌规模低于最大上市套件，TPRM 也不是核心
      - - SecurityScorecard
        - 威胁情报驱动的 TPRM / 供应链检测
        - 3,300+ 客户组织；12M+ 被监控和评级组织
        - 供应商风险、网络保险、采购和董事会报告项目
        - 持续评级，加上 AI 评估自动化、第 N 方可见性和整改工作流
        - 托管 SOC 深度弱于 BlueVoyant MDR；外部视角方法不能替代内部遥测
      - - BitSight
        - 网络风险情报 / TPRM
        - 3,500+ 客户；68K+ 活跃组织；75K+ 已映射供应商画像
        - 以评级为中心的企业风险和供应链项目
        - 大规模已映射供应链数据集、独立验证的评级主张和强分析师认可
        - MDR 不是核心，客户可能仍需要单独的工作流或服务层
      - - 内部 SOC / 仅工作流项目
        - 现状 / 替代方案
        - 买方自筹人员、工具或 GRC 套件预算
        - 超大型企业或合规主导的采购团队
        - 如果已有工作流套件，可获得最大控制权或最低增量支出
        - 相比完整 MDR，人手负担最高或威胁响应结果更弱
    notes: 规模信号混合了员工、部署、客户数、供应商画像和历史私募融资标记；这些指标只看方向，不能直接类比收入。
