              BlueVoyant 公开可见的资本故事有两个主要拐点。第一，公司在 2022 年 2 月完成由 Liberty Strategic Capital 领投的 $250 million Series
              D，ISTARI、Eden Global Partners 和 8VC 参投。第二，2023 年 11 月，公司把 Conquest Cyber 收购与超过 $140 million 的 Series E
