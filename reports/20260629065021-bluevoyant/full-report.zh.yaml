      - number: '3.2'
        title: MDR 正面对比：平台套件 vs 开放栈供应商
        blocks:
          - type: paragraph
            body: >-
              BlueVoyant 周围的 MDR 市场分成两类经济属性不同的竞争者。Palo Alto Networks 和 CrowdStrike
              把托管响应作为更大专有平台的延伸来销售；它们的卖点是自动化深度、原生遥测和捆绑经济性。Palo Alto 在 Cortex XSIAM 的统一 SIEM、SOAR、EDR、NDR 和 CDR 栈之上叠加 Unit
              42 服务；CrowdStrike 的 Falcon Complete 强调一分钟中位遏制时间、每月数百万次修复，以及来自 Falcon 生态的端点、身份、云和第三方深度遥测。Arctic
              Wolf、ReliaQuest、Rapid7 和 eSentire 从相反方向进攻：它们把自己定位为更开放、服务更重的伙伴，可跨既有工具资产工作。Arctic Wolf 主打 concierge 交付和开放
              XDR；ReliaQuest 主打任意来源归一化和广泛集成；Rapid7 主打暴露管理加检测；eSentire 主打厂商无关 XDR 和人类主导遏制。运营上，BlueVoyant
              更接近第二阵营，但比多数同类对手拥有更强的 Microsoft-specific 服务身份。
