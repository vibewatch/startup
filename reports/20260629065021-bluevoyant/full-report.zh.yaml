      - number: '8.2'
        title: 融资历史、披露质量与二级市场信号
        blocks:
          - type: paragraph
            body: >-
              BlueVoyant 的公开融资历史在标题层面清楚，但在影响定价纪律的细节上模糊。保留来源确认，2022 年 2 月有 $250 million Series D，2023 年 11 月有超过 $140
              million 新融资，但公开申报轨迹并不完整。SEC 浏览结果只显示 2017、2019 和 2020 年的 Form D 通知，没有显示后续融资条款。Caplight、CB Insights 和
              GetLatka 都指向 $665.5 million 总融资额，Tracxn 报告六轮合计 $696 million，SiliconANGLE 则引用 Tracxn 称 2023 年那轮后约为 $646
              million。这不是致命问题，但说明投资者用的是供应商摘要，而不是清晰的公开账本。


              二级市场平台进一步加深了这种谨慎。Caplight 仍把 BlueVoyant 锚定在估算 $1 billion，并显示上一轮为 2023 年 11 月 29 日的 Series E。Forge
              仍显示上一轮已知估值为 2022 年 2 月的 $1 billion，称当前市场活动有限，且不公布 Forge Price。PM Insights 和 Hiive
              都确认二级交易基础设施存在，但公开预览没有给出足够实时深度，无法承销一个精确清算价格。换句话说，市场提供了方向上有用的信号，但透明流动性不足；没有直接经纪商数据，很难把这些信号转化为确信度。
                      
