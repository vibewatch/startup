      - 公开证据显示什么
      - 对投资判断的影响
      - 尽调路径
    rows:
      - - 以 Microsoft 为中心的交叉销售
        - California、ODEON、Snappi、Beeks 和 ClearBank 都把 BlueVoyant 与以 Microsoft 为中心的安全运营紧密绑定
        - Microsoft 重度账户内的扩张逻辑很强，但该技术栈之外的产品广度不够可见
        - 索取按产品拆分的 ARR、挂载率，以及 Microsoft 主导部署之外的胜率
      - - 公共部门合同路径依赖
        - Carahsoft、SEWP、ITES-SW2、CMAS 和 SCRIPTS 带来有意义的政府准入
        - 有助于放大分销，但采购节奏和渠道执行可能塑造收入集中度
        - 索取按直销与渠道、合同载体拆分的 bookings
      - - 金融服务合规拉动
        - Snappi、Beeks 以及金融服务内容显示需求由合规驱动，并强调运营韧性价值
        - 行业适配度好，但具名银行深度仍有限
        - 索取头部金融服务账户、pipeline 转化，以及按子细分拆分的可背书程度
      - - 旗舰客户引用集中
        - 公开证据由少数深度案例主导，而不是一组同样细致的广泛引用
        - 如果长尾部署更浅，少数旗舰账户可能高估整体部署深度
        - 索取前 10 大客户收入占比，以及超过重要 ARR 门槛的客户数量
      - - 耐久性可见度缺口
        - 未发现公开 NRR、GRR、流失、续约或头部客户集中度披露
