  - id: TV002
    title: 投资论点 / 反论点
    columns:
      - 立场
      - 论点
      - 什么会改变判断
    rows:
      - - 投资论点
        - BlueVoyant 覆盖 MDR、TPRM、DRP 和专业服务，拓宽了钱包份额，也提升了可比性。
        - 如果能证明平台模块正在贡献更高收入占比，正面案例会更强。
      - - 投资论点
        - 官方来源显示公司已有可观商业规模：超过 900 名客户、覆盖 40 多个国家，并曾实现经常性收入三位数增长。
        - 可信的 2026 年客户数、ARR 质量和留存更新，会让规模论点更站得住。
      - - 投资论点
        - 如果 $213.5M ARR 代理值大体正确，$1B 仅相当于约 4.7x ARR，明显低于高溢价网络安全龙头。
        - 披露毛利率和软件收入占比，可能支持向更高质量的平台倍数靠拢。
      - - 反论点
        - Notice 显示相对上一轮有 39% 折价，意味着二级市场买家可能以显著低于头部估值的价格成交。
        - 近期经纪商报价单或接近、超过 $1B 的已执行交易，可以直接反驳折价信号。
      - - 反论点
        - Forge 显示交易活动有限，且没有可见 Forge Price，削弱了对当前流动性的信心。
        - 可见的买卖盘深度或撮合完成的二级市场成交，可降低流动性折价。
      - - 反论点
        - 公开来源对累计融资额说法不一，也没有披露当前稀释、利润率或 2023 年之后的融资条款。
        - 清晰的股权结构表、股数、优先权堆栈和当前财务包，会把案例从叙事推进到可承销。
    notes: 这些论点刻意围绕价格敏感性展开：正面案例真实存在，但反论点扎根于可观察的二级市场和披露缺口。
