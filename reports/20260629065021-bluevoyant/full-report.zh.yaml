      - number: '2.3'
        title: 买方、预算所有者与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图是跨职能的。MDR 侧，经济买方通常是 CISO 或安全负责人，已经掌握 SIEM、EDR 和 Microsoft 安全预算，但需要更好的响应覆盖、更好调优或更多 24x7 产能。TPRM
              侧，日常操作者常是供应商风险或合规团队，但付款权可能落在安全、采购、企业风险或受监管业务线负责人手上，取决于供应商敞口在哪里被衡量。采用触发点通常不是抽象的「网络成熟度」，而是近期事件、监管期限、反复问卷疲劳、供应商范围内的零日敞口，或内部意识到第四方风险基本不可见。BlueVoyant
              官方界面暗示的采用路径，是先在既有工作流中叠加 MDR 或 TPRM 监控；当领导层判断人工流程太慢后，再扩展到修复、第四方分析和更广的韧性报告。
