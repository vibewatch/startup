      - number: '1.4'
        title: 平台演进、生态系统与商业定位
        blocks:
          - type: paragraph
            body: >-
              BlueVoyant 的定位不只是检测威胁，而是把多条网络安全工作流包进托管平台叙事。其 Microsoft 页面和获奖历史显示出异常强的生态对齐，包括多次获得安全伙伴认可，并围绕
              Sentinel、Defender、Purview 以及 Copilot 时代安全运营做服务打包。伙伴计划也表明，其上市路径依赖渠道，而非纯直销。产品侧，公司已把叙事从托管网络防御扩展到更宽的 AI-native
              或 agentic SecOps，并以 2026 年 6 月 BlueVoyant AI 发布作为节点。2023 年 11 月收购 Conquest Cyber 正处在这一演进中段，为受监管和政府敏感环境补上
              SaaS-heavy 能力。Auto-ISAC 伙伴关系又把第三方风险叙事延伸进一个具名垂直行业。合起来看，公司更像是在复杂账户中加深钱包份额，而不是单纯增加 logo。
