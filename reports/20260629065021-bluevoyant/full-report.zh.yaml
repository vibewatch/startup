      - number: '2.4'
        title: 增长驱动、监管与类别扩张
        blocks:
          - type: paragraph
            body: >-
              2026 年最强需求驱动来自监管、已被证明的第三方事件痛点，以及在技能人才不足下运营碎片化安全项目的成本上升。SEC 披露规则把网络治理和事件重大性纳入美国上市公司董事会流程。NIS2 把欧盟网络义务扩展到 18
              个关键行业。CISA 和 NIST 将供应链网络风险定义为正式韧性问题，横跨硬件、软件和托管服务。这套政策栈遇到真实运营痛点：Marsh 报告称，过去一年 70% 的组织经历过重大第三方网络事件，66%
              计划增加网络投资；Panorays 则显示多数 CISO 仍缺乏完整供应链可见性和正式泄露响应预案。BlueVoyant 的定位与这些压力吻合，因为它把内部防御和外部供应商敞口中的监控、验证、修复和 AI
              辅助分诊组合在一起。
