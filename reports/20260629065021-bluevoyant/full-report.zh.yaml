companyProfile:
  summary: >-
    BlueVoyant 成立于 2017 年，总部位于纽约市。公司公开材料将其定位为统一网络防御平台，覆盖 MDR、第三方风险管理、数字风险防护和专业服务，并且与 Microsoft
    安全工具深度绑定，在政府及其他受监管行业有明显足迹。公司已有可信商业规模——45 个国家超过 1,000 家客户、600 多名员工，并在 2022 年完成 $250M Series D、跨过 $1B 独角兽门槛后，于 2023
    年公开宣布超过 $140M 的 Series E。不过，当前估值、ARR 质量、利润率结构和所有权结构在公开数据中仍只露出一部分，限制了承销信心。
