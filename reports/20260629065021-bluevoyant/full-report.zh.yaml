  - id: TV005
    title: 论点破裂与终止触发器
    columns:
      - 触发器
      - 阈值 / 事件
      - 如何传导到论点
      - 行动含义
    rows:
      - - 二级市场折价扩大
        - 相对上一轮的可观察折价超过约 50%，或新一轮定价低于 $0.8B。
        - 这意味着市场认为质量或流动性明显弱于基准情景假设。
        - 暂停，并按熊市情景水平重新承销。
      - - 服务型经济特征得到确认
        - 毛利率或收入结构显示业务的服务占比显著高于隐含水平。
        - 合理倍数会被压到更接近托管安全区间。
        - 将立场从合理转向偏贵。
      - - 没有真实价格发现
        - 下一轮尽调周期内没有出现经纪商背书的二级市场成交、买盘或股权结构证据。
        - 流动性折价仍未解决，市场无法验证头部估值。
        - 保持继续研究，或下调建议。
      - - 2023 年后融资不透明
        - 管理层无法提供任何 2023 年后融资条款、股数或优先权堆栈文件。
        - 没有稀释机制，即便企业价值看起来合理，回报测算也不可靠。
        - 没有股权结构包之前，不投入资本。
      - - 增长质量转弱
        - ARR 代理值被证明高估，或留存 / 扩张指标低于软件型门槛。
        - 打破了 BlueVoyant 至少应获得混合型平台倍数的基准假设。
        - 立即重估至熊市区间。
    notes: 这些阈值是尽调触发器，不是合同契约；它们把公开市场证据转化成具体终止标准。
    claimRefs:
