      - number: '7.3'
        title: 人力服务交付与 AI 执行风险
        blocks:
          - type: paragraph
            body: >-
              BlueVoyant 正试图把一个以人为主导的托管安全业务，延展成 AI 原生产品叙事，同时不放弃专家监督的承诺。2026 年 6 月发布的 BlueVoyant AI 称，客户既可以买由 BlueVoyant
              精英 SOC 团队支撑的全托管服务，也可以买把同样能力交到客户手里的 SaaS
              平台。商业上这很有吸引力，但也提出了真实的运营挑战：公司现在必须在两种模式下同时交付高质量的分析师驱动服务、可信的自治工作流，以及一致的定价和打包。关于机器速度遏制、降低误报和确定性响应的公开说法都很激进。如果没有强护栏、人工接管流程和可衡量的质量结果支撑，BlueVoyant
              可能招来更多审查，而不是更少，尤其是在受监管或高后果的客户环境里。


              运营模式仍然偏重人力。BlueVoyant 依然强调 24x7 专家监控、全球 SOC 覆盖，以及 Cork
              中心服务爱尔兰和欧盟客户等区域扩张。这些都是有意义的缓释因素，但也意味着即便公司在推自动化，招聘、培训、本地化和质量控制仍会持续消耗资源。领导层变化又增加了一层执行风险。John Hernandez 于 2026
              年接任 CEO，带着 AI 增长使命；2023 年聘任 CPO 的目的也被明确表述为在产品线扩张后统一产品方向。风险不在于 BlueVoyant
              缺乏野心，而在于公司可能要同时管理服务一致性、模型信任、分析师工作流和产品整合。公开评测和目录来源承认其能力覆盖面广，但没有给出 SLA、MTTR、人员配比或告警调优证据，无法完全消除执行风险。
