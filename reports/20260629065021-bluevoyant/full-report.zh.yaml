      - number: '3.5'
        title: 弱点、不利证据与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              最重要的反证并不是 BlueVoyant 缺少产品宽度，而是更大竞争者可以用更强市场可见度或更低运营摩擦来框定同一项工作。PeerSpot 2026 年 6 月评论页显示，BlueVoyant 的 MDR
              mindshare 仅 0.9%，低于一年前的 1.2%；其直接对比页将 BlueVoyant 排在第 34 位，而 CrowdStrike 第 2 位，并指出 BlueVoyant
              报告定制较弱、配置可能更重。Daylight 的 2026 年买方指南更直白：它把 BlueVoyant 归入 MSSP-style MDR 供应商，买方选择它是为获得广泛安全伙伴关系，但其工作流比
              AI-native 或 XDR-extended 替代方案更依赖分析师工时。TPRM 侧，BlueVoyant 还必须防御 SecurityScorecard 和 BitSight
              规模大得多的外部数据网络。几乎所有保留竞品页面都缺乏公开定价，加剧了挑战，因为从外部很难基准化既有套件捆绑和多产品折扣。因此，BlueVoyant
              在跨预算服务宽度上有真实护城河，但在类别可见度、数据网络规模或平台锁定上，护城河并不显然持久。
