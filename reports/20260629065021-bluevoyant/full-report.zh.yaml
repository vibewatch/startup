  - id: TV006
    title: 最终尽调要求
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 2026 年 ARR 质量
        - 当前 ARR、经常性收入与服务收入占比，以及 2023 至 2026 年 ARR 桥接。
        - 决定 2025 年 ARR 代理值是否真实，也决定 4.7x 倍数是合理还是偏高。
        - 要求提供当前董事会材料或 CFO 经营包。
      - - 利润率和留存画像
        - 按主要产品线列示的毛利率、调整后 EBITDA、总留存和 NRR。
        - 需要判断 BlueVoyant 应得混合服务倍数，还是软件平台倍数。
        - 管理层尽调会，加上队列级留存展项。
      - - 股权结构和摊薄后股数
        - 最新完全摊薄股数、优先权堆栈、期权池和清算瀑布。
        - 稀释不透明时，每股回报可能与企业价值测算大幅背离。
        - 数据室股权结构导出，或律师准备的摘要。
      - - 实际二级市场成交价
        - 来自股权结构管理方或交易平台的近期经纪商报价单、撮合交易和买卖盘历史。
        - 最好的公开二级市场信号偏负面；真实成交可以验证或反驳该折价。
        - 直接做经纪商尽调，并调取 Forge / Notice / 公司管理记录。
      - - 2023 年后任何融资条款
        - Series E 轮之后的债务、结构化融资或附函证据。
        - 后续资本结构变化会改变下行保护、优先级和估值解读。
        - CFO / 法务确认，并提供融资文件。
    notes: 每项要求都对应公开记录中的当前卡点，而不是泛泛的尽调愿望清单。
