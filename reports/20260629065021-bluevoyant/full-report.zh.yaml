  - id: FI001
    title: 收入模型桥
    type: flow
    layout: wide
    summary: BlueVoyant 把直销需求、伙伴需求和云市场入口转成经常性托管安全收入，外加一层规模较小的专业服务；但公开材料没有披露到可量化已实现毛利的程度。
    data:
      nodes:
        - id: direct
          label: 企业直销
          detail: 一线销售和解决方案工程师面向大型组织销售 MDR、TPRM、DRP 与咨询产品。
          tone: positive
        - id: partners
          label: 渠道伙伴
          detail: GuidePoint、CDW 等伙伴扩大获客和实施覆盖。
          tone: positive
        - id: marketplace
          label: 云市场采购
          detail: 进入 GCP 云市场后，TPRM 采购阻力降低。
          tone: positive
        - id: recurring
          label: 托管经常性收入
          detail: MDR、TPRM 和 DRP 看起来最接近经常性收入流。
          tone: positive
        - id: services
          label: 专业服务
          detail: DFIR、咨询和项目工作可能贡献非经常性收入或保留服务收入。
          tone: neutral
        - id: expansion
          label: 续约与扩张池
          detail: 客户增长、部署和云市场入口指向潜在追加销售空间。
          tone: positive
        - id: margin
          label: 毛利敏感性
          detail: 利用率、人手配置和伙伴经济性决定收入有多少能转成留存毛利。
          tone: warning
    approximationNotes: 这张桥接图是定性的：公开材料给出了上市路径和结果，却没有披露已实现收入结构，也没有按收入流拆出毛利率。
