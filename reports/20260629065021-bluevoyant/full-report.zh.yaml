  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: BlueVoyant 偏 Microsoft 的工作流从遥测和身份信号开始，随后进入 AI 辅助分诊、人工验证，以及遏制或优化动作。
    approximationNotes: 该流程突出以 Microsoft 为中心的 MDR 路径，因为这部分公开证据最具体。
    data:
      nodes:
        - id: ingest
          label: 采集 Microsoft 与客户遥测
