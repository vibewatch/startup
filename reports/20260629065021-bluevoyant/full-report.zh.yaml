      - number: '2.2'
        title: 规模测算视角——TAM、SAM 与互相矛盾的公开估算
        blocks:
          - type: paragraph
            body: >-
              BlueVoyant 的市场可以测算，但只能用分层逻辑，不能只看一个 headline TAM。MDR 估算从 Precedence Research 的 2026 年 $3.92B，到 Mordor 的
              $5.09B，The Business Research Company 则为 $4.16B。TPRM 对定义更敏感：TBRC 直接给出 2026 年 $8.09B，NextMSC 的 2025 年基线和
              Grand View Research 的 2023 年基线则隐含接近 $11B 的标准化 2026 年数值。这些矛盾不是噪音，而是反映了各方对软件与服务、合规工作流与网络监控、相邻 GRC 范围的处理不同。对
              BlueVoyant 而言，把 MDR 与 TPRM 公开基线合并、扣除重叠前，合理的 2026 年核心市场总天花板约为 $12–16B。更实际的 SAM 在套用大型企业、受监管买家和西方市场过滤后收窄到约
              $5–8B。公开数据无法支持精确到美元的 SOM，因为 BlueVoyant 不披露分模块收入或胜率，所以 SOM 应被视为受证据约束，而不是被编造出来。
