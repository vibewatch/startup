evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headquarters
    missingEvidence: >-
      An authoritative statement that separates legal domicile, registered office, and current operating headquarters
      for Cloaked and any subsidiaries.
    whyItMatters: >-
      Location ambiguity affects jurisdiction, tax, hiring, regulatory exposure, and the interpretation of database and
      press records.
    diligencePath: >-
      Request a current corporate structure chart, certificate of incorporation, registered-agent filing, and office
      list from finance/legal.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A current employee count with function and geography split, plus definition of whether contractors are included.
    whyItMatters: >-
      Headcount is a core stage and burn proxy, and the public range from roughly 70 to 115 is too wide for precise
      operating-model inference.
    diligencePath: >-
      Request an org chart, payroll headcount by month, and a contractor/FTE reconciliation from finance or people
      operations.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
      - TO002
