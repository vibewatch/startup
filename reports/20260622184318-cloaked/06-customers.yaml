tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Evidence of scale or proof
  - Strategic value
  - Key gap
  rows:
  - - Individual privacy subscriber
    - Single consumer pays for self
    - Aliases, broker cleanup, scam blocking, identity monitoring
    - Official individual plan; iOS and Android review volume
    - Core self-serve acquisition engine and base plan anchor
    - No public conversion, churn, or CAC by segment
  - - Couple household
    - One payer covers two adults
    - Shared household protection and separate identities for spouses/partners
    - Official couple tier; Trustpilot review mentions couples upgrade support
    - Natural upsell from individual plan with higher ARPU
    - No disclosure of couple-tier mix or retention
  - - Family household
    - One payer covers up to four members
    - Child and spouse protection, shared broker cleanup, scam blocking
    - Official family tier plus company-authored family-pricing content
    - Higher-value household plan and stronger stickiness thesis
    - No independent proof of family-seat activation or renewal
  - - Enterprise workforce
    - Employer buyer; employees are end users
    - Employee privacy, identity protection, and admin risk visibility
    - Enterprise site, launch release, and Chicago Cubs quote
    - Creates B2B wedge and employer-paid distribution
    - Only one named customer and no public contract values
  - - High-risk athlete / public-figure cohort
    - Partner channel or sponsored population
    - Protect players from doxxing, scams, and identity abuse
    - NFL Players Inc. investment and stated intent to offer access to players
    - Potential concentrated channel with very high visibility
    - Still a channel opportunity, not a disclosed deployed contract
  notes: Rows mix official segmentation with independent proof surfaces; scale evidence is strongest for consumer app-store activity and weakest for enterprise contract detail.
