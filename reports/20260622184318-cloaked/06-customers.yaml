  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Public NRR, GRR, churn, and cohort-retention disclosures by plan or segment.
    whyItMatters: Without retention data, review volume can prove activity but not durability or expansion economics.
    diligencePath: Request monthly cohort retention, cancellation, refund, and downgrade data for Individual, Couple, Family, and enterprise accounts.
    relatedQuestionRefs:
    - QU014
  - type: private-evidence-only
    severity: material
    topic: enterprise-seat-count
    missingEvidence: Exact employee seat counts, active-user counts, or account counts behind the enterprise launch and sports deployments.
    whyItMatters: '"Thousands of employees" is directionally useful but too vague to underwrite enterprise traction or contract value.'
    diligencePath: Request current enterprise logos, contracted seats, deployed seats, and employee activation rates, especially for Chicago Cubs and other launch sectors.
    relatedQuestionRefs:
    - QU020
  - type: private-evidence-only
    severity: material
    topic: enterprise-contract-terms
    missingEvidence: Public contract values, renewal terms, and rollout commitments for Chicago Cubs and NFL-linked channel relationships.
    whyItMatters: Named proof without economics leaves concentration risk and monetization quality unresolved.
    diligencePath: Request contract length, annual value, renewal timing, and any guaranteed minimum seats for marquee enterprise or channel accounts.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: minor
    topic: segment-mix
    missingEvidence: Consumer plan mix and revenue split across individual, household, and enterprise customers.
    whyItMatters: ARPU and concentration look very different if growth is driven by one plan tier or by a small number of employer accounts.
    diligencePath: Request subscriber counts and revenue contribution by Individual, Couple, Family, and enterprise accounts.
    relatedTableRefs:
    - TU001
    - TU005
