- id: durability-support-and-risk-signals
  title: Durability, support, and risk signals
  body: 'The durability story is where Cloaked’s public evidence gets weakest. There is no disclosed NRR, GRR, churn, or cohort data, so investors have to infer stickiness from proxies: large app-store review volume, detailed Trustpilot testimonials, months-long user comments, and the fact that several public reviews discuss upgrades or ongoing usage instead of one-time trials. Those positives are offset by a meaningful complaint trail. Google Play reviews mention call-setup glitches and continuing spam; JustUseApp aggregates negative reports around cancellations, unavailable features, and account access; and BBB complaints from spring 2026 show refund disputes, setup failures, call-routing bugs, and difficulty reaching human support. Cloaked often appears to respond and process refunds, so this is not an abandoned support surface. But the pattern still matters because the company is selling trust, identity continuity, and family safety. Support friction and feature drift are not cosmetic
    here; they are direct churn and reputational risks. That gap is especially important because enterprise proof is still concentrated in a very small named set.'
