  title: Independent proof exists, but it is mostly platform-level
  body: Cloaked has real consumer proof through Apple, Google Play, Trustpilot, and Product Hunt, yet the enterprise story is still anchored on one named customer and one large channel relationship rather than a broad case-study set.
  claimRefs:
