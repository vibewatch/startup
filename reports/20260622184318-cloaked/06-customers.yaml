- id: enterprise-proof-and-expansion
  title: Enterprise proof and expansion
  body: 'Enterprise evidence is credible, but still thin. Cloaked’s own enterprise materials and launch release show a product built for HR and security administrators, with features like alias identities, broker cleanup, dark-web monitoring, password management, and insurance. The most concrete named customer is the Chicago Cubs: the enterprise site and launch release quote a Cubs HR executive, and Forbes says the team was one of Cloaked’s first B2B partners. A second enterprise-adjacent wedge is the NFL Players Inc. relationship, which is currently more channel option than deployed customer proof. Forbes reports that NFL Players Inc. invested in Cloaked and wants the product available to current and former players, which could produce a large high-risk cohort if the relationship scales. Beyond those examples, Cloaked references unnamed deployments across healthcare, fintech, education, government, and sports, but public contract values, exact seat counts, renewals, and case-study outcomes
    are still mostly missing.'
