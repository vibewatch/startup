figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Shows how Cloaked moves from single-user privacy pain points to household protection and then into employer-sponsored deployment.
  data:
    nodes:
    - label: 1. Risk discovery
      detail: User lands through a free scan, spam pressure, or data-broker exposure concern.
      tone: neutral
    - label: 2. Identity setup
      detail: User creates aliases for signups, shopping, messaging, and account creation.
      tone: positive
    - label: 3. Active protection
      detail: Data removal, call screening, dark-web alerts, and insurance become the ongoing value surface.
      tone: positive
    - label: 4. Household expansion
      detail: Individual plan can expand into Couple or Family when spouse or children share the same privacy threats.
      tone: positive
    - label: 5. Support / remediation
      detail: Chat, email, or phone support becomes critical when setup, refunds, or identity-restoration events occur.
      tone: risk
    - label: 6. Employer sponsorship
      detail: Same protection stack can be purchased by HR or security teams for employee cohorts.
      tone: positive
  approximationNotes: Stages are inferred from public product flows and pricing surfaces rather than from internal funnel analytics.
  claimRefs:
  - CU001
  - CU005
  - CU007
  - CU008
  - CU009
  - CU010
  - CU030
  - CU046
