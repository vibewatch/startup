  topStrengths:
    - >-
      Cloaked's product is broader than a simple aliasing utility, combining prevention, cleanup, monitoring, and
      support into one privacy workflow across web and mobile surfaces.
    - >-
      Public traction evidence is meaningful for a private company: 350,000+ paying customers, 400,000+ users, 4 million
      free scans, and heavy app-store review volume all support genuine demand.
    - >-
      The March 2026 $375 million mixed financing shows strong capital access and backing from well-known investors even
      though the exact structure remains opaque.
    - >-
      The company has started to extend beyond pure D2C into employer and enterprise privacy use cases, which could
      raise ARPU and strategic relevance if conversion proves durable.
  topRisks:
    - >-
      Cloaked did not disclose its March 2026 post-money valuation, full financing split, or cap-table preferences,
      which makes the latest entry price impossible to underwrite from public evidence alone.
    - >-
      Public sources still do not disclose realized revenue, ARR, gross margin, burn, runway, churn, or retention,
      leaving the core business-quality questions unanswered.
    - >-
      Complaint and review sources show real friction around support, billing, account access, and feature maturity,
      which can undermine trust for a product that sells safety and privacy.
    - >-
      Independent comparisons often favor rivals such as Incogni, DeleteMe, Aura, or Optery on removal breadth, support
      model, or value, so Cloaked's moat is real but not yet dominant.
    - >-
      Several public KPI surfaces conflict on broker-coverage counts and other operating claims, which raises diligence
      questions about metric governance as the company moves upmarket.
  unresolvedGaps:
    - >-
      Need the exact 2026 post-money valuation, preference stack, debt or growth-financing terms, and full
      equity-versus-conversion breakdown.
    - Need current ARR or billings, gross margin, cash burn, runway, CAC, churn, and retention cohorts by plan.
    - >-
      Need enterprise customer count, seat count, contract value, and renewal evidence beyond the thin named public
      proof set.
    - >-
      Need a reconciled KPI pack for user counts, broker-removal coverage, and support-service performance so
      public-facing metrics can be trusted as a diligence baseline.
    - >-
      Need clearer disclosure on headquarters, legal footprint, and which newer modules such as Cloaked Pay are fully GA
      versus still roadmap or limited rollout.
