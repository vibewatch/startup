  topStrengths:
    - Cloaked 的产品不只是简单的别名工具，而是把预防、清理、监测和支持串进一套覆盖网页与移动端的隐私工作流。
    - 对一家私营公司，公开牵引证据有分量：350,000+ 付费客户、400,000+ 用户、4 million 次免费扫描，以及大量应用商店评价，都指向真实需求。
    - 2026 年 3 月 $375 million 混合融资显示公司能拿到大额资本，也有知名投资人背书，尽管具体结构仍不透明。
    - 公司已开始从纯 D2C 延伸到雇主和企业隐私场景；如果转化能撑住，ARPU 和战略相关性都有上行空间。
  topRisks:
    - Cloaked 没有披露 2026 年 3 月投后估值、完整融资拆分或股权结构表里的优先权，单靠公开证据无法承销最新入场价。
    - 公开资料仍未披露已实现收入、ARR、毛利率、烧钱速度、现金跑道、流失或留存，核心业务质量问题没有答案。
    - 投诉和评价显示，支持、计费、账户访问和功能成熟度都存在真实摩擦；对一个销售安全与隐私的产品，这会削弱信任。
    - 独立对比经常在移除覆盖、支持模式或性价比上更偏向 Incogni、DeleteMe、Aura 或 Optery 等对手，说明 Cloaked 有护城河，但还没有压倒性优势。
    - 多个公开 KPI 口径在数据经纪覆盖数量和其他运营表述上互相冲突；公司向高端市场推进时，指标治理会成为尽调问题。
  unresolvedGaps:
    - 需要拿到准确的 2026 年投后估值、优先股堆叠、债务或增长融资条款，以及新股与转换部分的完整拆分。
    - 需要当前 ARR 或账单额、毛利率、现金烧钱速度、现金跑道、CAC、流失率，以及按套餐拆分的留存队列。
    - 需要企业客户数、席位数、合同金额和续约证据，而不只是公开可点名的薄弱样本。
    - 需要一套调和后的 KPI 包，覆盖用户数、数据经纪移除覆盖和支持服务表现，才能把对外指标当作尽调基线。
    - 需要更清楚披露总部、法律实体覆盖，以及 Cloaked Pay 等新模块哪些已经全面 GA，哪些仍在路线图或有限推出阶段。
