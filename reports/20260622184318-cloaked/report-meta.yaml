companyProfile:
  summary: >-
    Cloaked was founded in 2020 by brothers Arjun and Abhijay Bhatnagar to let people transact,
    communicate, and sign up online without exposing their real identity data. The company started
    with masked phone numbers, emails, and passwords, then expanded into a broader privacy suite
    spanning data removal, dark-web and SSN monitoring, call screening, VPN, password management,
    identity-theft insurance, and a newer employer/enterprise privacy offering.
  founders:
    - name: Arjun Bhatnagar
      role: Co-founder and CEO
      background: >-
        Previously built and sold Hey! HeadsUp with his brother before founding Cloaked and remains
        the main public face of the company's product, funding, and privacy mission.
      claimRefs:
        - CO001
        - CO002
        - CO017
    - name: Abhijay Bhatnagar
      role: Co-founder and CTO
      background: >-
        Repeat founder from Hey! HeadsUp who now leads technology and, in some public bios, AI
        strategy for Cloaked.
      claimRefs:
        - CO001
        - CO002
        - CO017
  foundingLocation: Massachusetts / Boston area roots; current operating footprint later shifted toward New York City in public materials
  headquarters: New York City, with Lowell, Massachusetts still appearing in company-profile records
  productSummary: >-
    Cloaked provides masked identities, broker-data removal, dark-web and SSN monitoring, scam and
    robocall screening, identity-theft support, VPN, password management, and emerging payment or
    enterprise privacy modules through mobile, browser-extension, and web-dashboard surfaces.
  customerFocus: >-
    Privacy-conscious individual and family subscribers, plus employers and enterprise security or
    HR teams that want to protect employees from data exposure, scams, and identity abuse.
  businessModel: >-
    Recurring consumer subscription revenue from individual, couple, and family plans, with a newer
    enterprise or employer channel sold through custom contracts.
  stage: Private / Series B plus growth financing
  fundingStatus: >-
