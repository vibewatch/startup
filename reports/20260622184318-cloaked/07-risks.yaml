    {
      "id": "competition-and-channel-risk",
      "title": "Competition, channel concentration, and partner dependency",
      "body": "Cloaked’s category narrative is compelling, but independent market framing is not yet on its side. Multiple 2026 rankings highlight Incogni, Optery, DeleteMe, and Aura as the reference points for data removal or all-in-one protection. Security.org puts Incogni first, while State of Surveillance prefers Optery for breadth and DeleteMe for track record; CNBC Select’s roundup likewise centers competing brands. Independent and competitor reviews then attack Cloaked from different angles: Aura argues the suite is feature-thin relative to full identity-protection products, PCMag says a similar bundle can be had for less through IronVest, and Cape’s review highlights support-model concerns. The resulting risk is not that Cloaked has no product advantage, but that independent buyers can still rationally choose broader coverage, cheaper pricing, human-guided service, or stronger credit-monitoring elsewhere.\n\nChannel and dependency risk deepen the picture. Public enterprise proof is concentrated in a narrow set of named examples, especially the Chicago Cubs and NFLPA-linked narrative. Distribution is also meaningfully app-platform and partner dependent: Apple and Google are key consumer surfaces, while deletion, payments, VPN, and identity workflows each rely on outside counterparties. That is manageable if support and operations scale. If not, a company trying to sell prevention, cleanup, payments, AI, and enterprise in one bundle could end up stretched across too many jobs at once.",
