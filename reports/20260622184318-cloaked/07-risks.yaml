    {
      "id": "regulatory-and-privacy-compliance-risk",
      "title": "Regulatory, privacy, and legal-boundary risk",
      "body": "Cloaked’s regulatory exposure is broader than a simple consumer-software label suggests. Its privacy policy says the company can collect SSNs for monitoring services and KYC-style financial data for Cloaked Pay. It also names processors such as Plaid, PayPal, Stripe, and PureVPN-linked services, and it openly says some user information may be disclosed to data-broker sites when customers elect deletion. That architecture is understandable for the service model, but it means the company’s “privacy product” is itself a handler and router of sensitive data across multiple counterparties. FTC privacy-and-security guidance, California’s CCPA, and financial/privacy regimes such as GLBA create a real compliance stack around disclosure, access, deletion, and vendor controls.\n\nCloaked is not ignoring this. Its trust and enterprise pages advertise SOC 2 Type 2, ISO 27001, ISO 27701, and PCI compliance, and the site repeatedly limits product scope with an explicit FCRA disclaimer. Those are meaningful mitigations. But the legal documents also cap what the product promises: Cloaked says deletion may not work on all sites, dark-web monitoring cannot find everything, and services can be changed or restricted at its discretion. That leaves a residual risk that user expectations, marketing copy, and actual legal scope diverge under stress. As Cloaked adds eSIM, payments, AI agents, and enterprise workflows, the key regulatory question is not whether the privacy market is important; it is whether the compliance program is scaling as fast as the feature surface.",
