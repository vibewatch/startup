    "number": 4,
    "title": "Financials",
    "summary": "Cloaked's public financial record now supports a credible subscription business with current list pricing, 350,000+ paying subscribers, 4 million free scans, and a fresh $375 million headline financing round, but it still does not disclose realized revenue, margins, burn, or runway. SEC Form D records show only part of the announced capital in sold securities, which makes the financing surface more supportable than the balance-sheet picture. The chapter's conclusion is therefore constructive on demand and capital access, but still negative on underwriting completeness until management opens a data room on revenue mix, unit economics, and cash needs."
  },
