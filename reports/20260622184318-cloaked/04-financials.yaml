    {
      "id": "traction-proxies-and-public-revenue-bounds",
      "title": "Traction proxies and public revenue bounds",
      "body": "Cloaked's public traction signals are unusually strong for a private consumer-security company, but they still do not resolve into a clean ARR number. The founder post says Cloaked has 350,000+ subscribers, while TechCrunch independently reported more than 350,000 paying customers and 10x growth last year. The about page says the company has a community of over 400,000 users, and the homepage says 4 million Americans have taken its free scan. Read together, those figures imply a funnel that likely begins with a free exposure scan, converts some fraction into app installs, and then converts a further fraction into paid subscriptions. App-store surfaces reinforce that this is not a paper user base: Apple's listing shows a 4.5 rating across 6.5K ratings, and Google Play shows a 4.1 rating, 5.34K reviews, and 100K+ downloads. Even so, public financial modeling remains constrained. At the cheapest current official annual individual price, 350,000 paying subscribers imply only a gross consumer list-price floor of roughly $42 million annualized; at the lowest current monthly individual price, the same subscriber base implies roughly $52.5 million annualized. Those are useful boundary conditions, not revenue disclosures, because plan mix, discounts, trials, churn, refunds, enterprise revenue, and payment timing are all undisclosed.",
