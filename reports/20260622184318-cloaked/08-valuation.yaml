    {
      "id": "scenario-range-and-sensitivity",
      "title": "Scenario range and sensitivity",
      "body": "Because the post-money valuation is undisclosed, the right framework is not a single-point target but a set of scenarios anchored to public pricing evidence and public comp bands. The public evidence floor starts with 350,000 paying customers and the current individual plan prices. If every paying customer were on the annual individual plan, gross annualized consumer billings would be about $42 million. If every paying customer were on the monthly individual plan, the simple annualized equivalent is about $52.5 million. Reality could be higher because Cloaked also sells couple and family plans and says enterprise deals are closing, but the company does not disclose plan mix or enterprise contribution. That makes the scenario spread wide. In the bear case, realized ARR or billings settle around $35 million to $45 million and market tolerance stays near 5x to 6.5x, yielding roughly $180 million to $300 million. In the base case, ARR or billings rise into a $50 million to $60 million zone with 6x to 10x tolerance, supporting roughly $300 million to $600 million. In the bull case, enterprise and higher-ARPU plan mix push ARR toward $70 million to $80 million and investors pay 10x to 15x, supporting roughly $700 million to $1.2 billion. That upper band is possible, but it requires evidence the public record does not yet provide.",
