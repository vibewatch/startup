    {
      "id": "diligence-asks-and-kill-criteria",
      "title": "Final diligence asks and kill criteria",
      "body": "The next diligence step should be explicitly price-sensitive. If the undisclosed post-money valuation is modest relative to the public floor and the cap table is clean, Cloaked could move into a more constructive zone quickly. If the post-money is already in the unicorn range and the term sheet contains material preference, debt-like, or dilution overhang, the underwriting case becomes much harder. The most important asks are straightforward: disclose the exact post-money and financing split; provide current ARR or annualized billings by plan and by enterprise versus consumer; show retention, churn, and gross margin; and map the liquidation stack. Those are not nice-to-haves. They determine whether public comp gravity should be applied near the low end, the high end, or not at all. The clearest thesis-break would be a disclosed valuation above roughly $1.5 billion without evidence that realized ARR is already above about $80 million and that enterprise or family-plan mix is durable. Until those facts are surfaced, the public record supports interest, but not price confidence.",
