callouts:
  - calloutType: insight
    title: The biggest public number is the wrong TAM
    body: >-
      Mordor's USD 315.66 billion data-broker estimate measures the economy monetizing exposed personal data, not the
      amount consumers and enterprises currently spend on Cloaked-like protection. The investable market is the smaller
      identity-protection and workforce-privacy layer sitting underneath it.
    claimRefs:
      - CM017
      - CM018
      - CM038
  - calloutType: strength
    title: Channel expansion is a real market tailwind
    body: >-
      Javelin, MarkWide, and Allstate all point to the same commercial shift: identity protection is moving beyond pure
      D2C into employer, partner, and workforce-protection channels. That creates a more credible route for Cloaked than
      relying on direct consumer marketing alone.
    claimRefs:
      - CM014
      - CM019
      - CM020
      - CM039
  - calloutType: risk
    title: Public SAM and SOM remain structurally under-specified
    body: >-
      Analyst reports size monitoring and recovery markets, while vendor pages describe prevention bundles that combine
      aliases, data removal, family coverage, and enterprise human-risk protection. Until management discloses segment
      mix or external data isolates the bundle, precise SAM and SOM claims should be treated as provisional.
    claimRefs:
      - CM012
      - CM036
