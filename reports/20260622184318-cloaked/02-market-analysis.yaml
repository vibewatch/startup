  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: cloaked specific sam and som
      missingEvidence: >-
        A management-quality split of Cloaked revenue, users, conversion, and contract values by consumer subscriptions,
        family plans, enterprise seats, and partner channels.
      whyItMatters: >-
        Without segment-level commercial data, the market chapter can describe credible proxy pools but cannot prove what
        share of those pools maps to Cloaked's actual monetizable bundle.
      diligencePath: >-
        Request cohort revenue, ARPU, CAC, churn, and ACV by channel; reconcile those disclosures against product
        packaging and partner motion.
      relatedQuestionRefs:
        - QM023
      relatedTableRefs:
        - TM002
    - type: missing-source
      severity: material
      topic: enterprise workforce privacy market size
      missingEvidence: >-
        An authoritative standalone market-size study for employee or executive data-removal and workforce privacy-
        protection services.
      whyItMatters: >-
        Public sources clearly show demand and competitor activity, but they do not isolate the enterprise privacy-
        removal subsegment that is most relevant to Cloaked Enterprise.
      diligencePath: >-
        Ask management for pipeline segmentation and win-loss data by enterprise use case; supplement with customer or
        broker interviews to infer contract values and seat counts.
      relatedQuestionRefs:
        - QM023
        - QM024
      relatedTableRefs:
        - TM002
        - TM003
    - type: private-evidence-only
      severity: minor
      topic: distribution mix by channel
      missingEvidence: >-
        Evidence showing what percentage of Cloaked-like adoption comes from direct consumer acquisition versus benefits,
        partner, and enterprise channels.
      whyItMatters: >-
        Channel mix determines CAC, retention, and valuation quality, but public market pages mostly describe direction
        of travel rather than actual current share.
      diligencePath: >-
        Request partner pipeline, employer-enrollment, and enterprise cohort data; compare channel economics against
        standalone direct-to-consumer subscriber performance.
      relatedQuestionRefs:
        - QM022
      relatedTableRefs:
        - TM003
        - TM004
