  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - driver/constraint
      - direction
      - timing
      - implication
      - diligence ask
    rows:
      - - Breach volume and complaint intensity
        - driver
        - current
        - IC3 and ITRC data indicate a persistent identity and fraud problem that supports recurring demand
        - What share of Cloaked acquisition comes from post-breach or fraud-triggered users?
      - - Spam, scam, and robocall prevalence
        - driver
        - current
        - YouMail and Truecaller metrics support scam/spam blocking as a feature buyers will pay to reduce
        - How much incremental retention comes from call/text protection versus monitoring alone?
      - - Employer-benefits and partner distribution
        - driver
        - near-term
        - Javelin, MarkWide, and Allstate imply group channels can reduce CAC and expand family penetration
        - "Which partner channels are converting for Cloaked: employers, insurers, banks, or benefits platforms?"
      - - Enterprise human-risk framing
        - driver
        - near-term
        - DeleteMe, Optery, Incogni, and Cloaked Enterprise show security budgets can fund privacy-removal when linked to social engineering risk
        - Are enterprise sales led by security, HR, or legal, and what proof points close deals?
      - - Regulatory and compliance pressure
        - driver
        - medium-term
        - FTC, GLBA, and state privacy or breach rules reinforce procurement urgency for financial and enterprise buyers
        - Which regulations most often appear in buyer discovery and procurement language?
      - - Price sensitivity and free substitutes
        - constraint
        - current
        - Credit freezes, free credit monitoring, and partial bank or carrier tools limit willingness to pay for premium tiers
        - What retention or attach-rate data proves Cloaked can win beyond the free layer?
      - - Category confusion and noisy TAM definitions
        - constraint
        - current
        - Analyst reports mix monitoring, restoration, family safety, and enterprise privacy under one label, making SAM claims fragile
        - Can management break revenue into monitoring, removal, aliases, and enterprise to ground a cleaner SAM?
      - - Diffuse budget ownership in enterprises
        - constraint
        - near-term
        - Security, HR, legal, and benefits teams can all claim part of the problem, slowing procurement
        - Who is the repeatable economic buyer and what budget line funds the contract?
    notes: >-
      The same forces that expand the category also complicate conversion: the problem is real, but distribution,
      packaging, and budget ownership remain unsettled.
