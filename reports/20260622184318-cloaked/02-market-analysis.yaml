figures:
  - id: FM001
    title: Market sizing lens stack
    type: pyramid
    layout: standard
    summary: >-
      Cloaked addresses a small slice of a very large exposed-data economy: the core service market is multi-billion-
      dollar, but the upstream data-broker problem it attacks is orders of magnitude larger.
    data:
      nodes:
        - label: 'Global data broker market: USD 315.66B in 2026'
          detail: Mordor Intelligence measures the upstream monetization pool created by exposed personal data; this is a problem-pool lens, not Cloaked TAM.
          tone: warning
        - label: 'Global identity theft protection services: USD 16.26B–19.45B in 2026'
          detail: TBRC and Fortune Business Insights bracket the core service category that most directly maps to published spend on identity protection.
          tone: positive
        - label: 'North America core spend proxy: USD 7.83B in 2026'
          detail: Fortune Business Insights says North America remains the largest regional market for identity theft protection services.
          tone: positive
        - label: 'U.S. narrower core proxy: USD 4.685B in 2026'
          detail: Fortune's U.S. point estimate is much smaller than MarkWide and Javelin proxies, showing how quickly scope changes can alter TAM narratives.
          tone: neutral
    approximationNotes: >-
      These layers are contextual lenses, not additive market slices. The top layer measures the data-exposure economy;
      the lower layers measure solution spend.
    claimRefs:
      - CM010
      - CM011
      - CM016
      - CM017
      - CM018
      - CM038
