        - Ad-tech data sales, generic compliance software, one-time record deletion projects
        - Consumer subscriber, HR/benefits team, or security team
        - Directly aligned with Cloaked, DeleteMe, Optery, and Incogni prevention positioning
      - - Aliases and masked communications
        - Alias email, masked phone numbers, virtual cards, dedicated inboxes, spam/scam call screening
        - Carrier-only voice filtering, disposable email tools sold without identity/privacy context
        - Consumer subscriber or employer protecting workforce communications
        - Differentiates Cloaked from legacy monitoring vendors by attacking exposure before compromise
      - - Employer-sponsored identity protection benefits
        - Group identity-protection plans sold through benefits or HR channels
        - Traditional health, life, or disability benefits without identity/privacy coverage
        - Employer or voluntary payroll deduction
        - Important distribution path as D2C share softens and trust shifts to known third parties
