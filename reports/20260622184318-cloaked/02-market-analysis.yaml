        - Individual consumer or household payer
        - Core analyst-defined category that most directly maps to published market sizes
      - - Family digital-safety bundles
        - Multi-adult or family plans that combine identity, fraud, privacy, and scam protection
        - Single-purpose parental-control apps with no identity/privacy features
