slug: cloaked
runDate: '2026-06-22'
company:
  name: Cloaked
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Cloaked sits inside the identity-theft-protection market but is selling a prevention-first bundle that spans aliases,
    data removal, scam and spam blocking, and employee privacy protection. Public sources support a real core category
    — roughly USD 16.26 billion to USD 19.45 billion globally in 2026, with U.S. and North America proxies ranging
    from USD 4.685 billion to USD 13.8 billion depending on scope — plus a much larger USD 315.66 billion data-broker
    economy that creates the problem Cloaked attacks. The most credible adoption path runs through privacy-motivated
    consumers, employer-benefit channels, and enterprise security teams protecting employee digital exposure, while
    pricing, free substitutes, and the lack of a clean public SAM or SOM keep valuation arguments from resting on one
    broad TAM number.
sections:
  - id: s1
    title: Market boundary and status-quo substitutes
    body: >-
      Cloaked is not just a classic credit-monitoring or post-fraud restoration vendor. Its own consumer materials define
      a prevention-first stack: data removal from broker sites, masked email and phone identities, spam and scam call
      interception, password management, and identity-theft insurance. BusinessWire, TechCrunch, and PRWeb describe the
      same bundle in enterprise form, where employee exposure is treated as part of the corporate attack surface rather
      than only a personal-finance problem. That places Cloaked inside the identity-theft-protection market, but at the
      edge where privacy, data-removal, and digital-safety tooling are converging.

      The included spend is therefore narrower than the entire privacy or cybersecurity landscape but broader than legacy
      credit monitoring alone. Included categories are consumer identity-protection subscriptions, family digital-safety
      bundles, employer-sponsored identity-protection benefits, employee and executive privacy-removal services, and
      prevention tooling that keeps real identifiers out of circulation before fraud occurs. Excluded spend includes
      general endpoint security, consumer VPN-only subscriptions, enterprise IAM suites, generic password managers sold
      without identity or privacy features, ad-tech spending by data brokers, and broad privacy-compliance consulting.

      Status-quo substitutes remain strong. For consumers, the alternatives are free credit freezes, no-cost credit
      monitoring from bureaus or banks, carrier spam filtering, and ad hoc opt-outs from broker sites. For employers,
      substitutes include security-awareness training, EDR, phishing protection, and benefits bundles that do not include
      identity or privacy remediation. That boundary matters because the biggest public number in the ecosystem — the data
      broker market — measures the monetization problem, not the amount buyers currently spend to solve it.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
