  - id: s2
    title: "Sizing lenses: core market, adjacent pool, and constrained SAM proxy"
    body: >-
      A one-line TAM would overstate what is actually supported by public evidence. The cleanest core-market lens is
      identity theft protection services. The Business Research Company sizes that market at USD 16.26 billion in 2026,
      while Fortune Business Insights sizes it at USD 19.45 billion in 2026; IMARC uses a smaller base, putting the
      market at USD 12.3 billion in 2025 with a 2026-2034 CAGR of 8.97%. Javelin then shifts the lens to the United
      States, arguing the U.S. market is poised to reach USD 18 billion by 2027 and that direct-to-consumer sales still
      dominate, though their share is declining. MarkWide places the U.S. market at USD 13.8 billion in 2026. These
      numbers are not directly interchangeable, but they consistently show a multi-billion-dollar category growing at
      high-single- to low-double-digit rates.

      The adjacent pool is much larger. Mordor Intelligence estimates the data-broker market at USD 315.66 billion in
      2026, with consumer data representing 46.03% of the 2025 mix. That is the upstream monetization engine behind
      Cloaked's value proposition: if data brokers create the inventory that feeds spam, phishing, and identity theft,
      then privacy-removal and alias products are attacking the source of the problem. But that USD 315.66 billion figure
      is not Cloaked's TAM; it is the size of the ecosystem benefiting from exposed personal data.

      The most defensible public SAM proxy for Cloaked is a constrained subset: North American and U.S. identity-
      protection spend, plus the emerging employer-benefits and enterprise workforce-protection motion documented by
      Javelin, Allstate, DeleteMe, Optery, and Incogni. Public sources do not isolate a clean revenue bucket for aliasing
      plus data removal plus spam blocking plus employee digital-risk protection. The right conclusion is therefore not a
      generic "huge market" claim, but that Cloaked is entering a real core category with multiple adjacent expansion
      paths and no single public source that cleanly defines the whole bundle.
    claimRefs:
