  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headquarters
    missingEvidence: An authoritative statement that separates legal domicile, registered office, and current operating headquarters for Cloaked and any subsidiaries.
    whyItMatters: Location ambiguity affects jurisdiction, tax, hiring, regulatory exposure, and the interpretation of database and press records.
    diligencePath: Request a current corporate structure chart, certificate of incorporation, registered-agent filing, and office list from finance/legal.
    relatedQuestionRefs:
    - QO017
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A current employee count with function and geography split, plus definition of whether contractors are included.
    whyItMatters: Headcount is a core stage and burn proxy, and the public range from roughly 70 to 115 is too wide for precise operating-model inference.
    diligencePath: Request an org chart, payroll headcount by month, and a contractor/FTE reconciliation from finance or people operations.
    relatedQuestionRefs:
    - QO018
    relatedTableRefs:
    - TO001
    - TO002
  - type: stale
    severity: minor
    topic: pricing
    missingEvidence: A machine-readable or screenshot-backed current consumer price card, refund terms, and any regional plan differences.
    whyItMatters: Pricing moved or was reported differently across reputable 2026 reviews, which weakens comparisons to competitors and revenue-per-user assumptions.
    diligencePath: Pull the live checkout flow directly, capture current plan screenshots, and reconcile monthly versus annual billing language with support or product.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Series B post-money valuation, cap table effects, and the exact split between equity and growth financing.
    whyItMatters: Without the valuation and structure, investors cannot judge dilution, leverage, or whether third-party billion-dollar estimates are directionally credible.
    diligencePath: Request the Series B term sheet, cap table bridge, debt or revenue-finance documents, and board materials summarizing the transaction.
    relatedQuestionRefs:
    - QO007
    - QO008
    relatedTableRefs:
    - TO001
    - TO003
  - type: missing-source
    severity: material
    topic: legal-regulatory-status
    missingEvidence: A targeted litigation, regulatory, and breach docket review that confirms whether any material legal, regulator, or security incidents exist beyond the public review corpus.
    whyItMatters: The current corpus surfaced customer complaints and product criticism, but not a definitive legal or regulatory clean bill of health.
    diligencePath: Search court dockets, regulator databases, state attorney-general releases, and breach-notification repositories directly against Cloaked, Inc. and known aliases.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO004
