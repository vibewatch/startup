- id: funding-investors-and-stage
  title: Funding history, investors, and stage
  body: 'Cloaked is now clearly a later-stage private company. On 19 March 2026 it announced $375 million in Series B and

    growth financing led by General Catalyst and Liberty City Ventures, with Lux Capital, Human Capital, Marquee

    Ventures, Fifth Growth Fund, NFL Players Association, LG Technology Ventures, Assurant Ventures, DuckDuckGo, and

    others participating. Multiple sources say General Catalyst''s Customer Value Fund supplied the growth-financing

    component, which matters because it means the round was not a clean equity raise.


    What the company did not disclose is just as important. TechCrunch and TechFundingNews both say Cloaked withheld

    the post-money valuation and the precise split between equity and growth capital. That omission should be treated

    as a real evidence gap rather than backfilled with third-party guesses. Independent profile sites speculate about

    low-billion-dollar enterprise values, but those marks are not company-confirmed and should not be treated as a

    canonical valuation.


    Earlier funding history is clearer. Cloaked''s March 2022 Series A was a $25 million round co-led by Lux Capital

    and Human Capital. Because that announcement described total funding to date of $29 million, the implied seed

    capital before Series A was roughly $4 million, consistent with third-party database summaries. The cap table has

    since evolved into an unusually broad coalition spanning traditional VCs, strategic privacy players such as

    DuckDuckGo, corporate investors, and the NFLPA, which doubles as a possible distribution channel for high-risk

    professional-athlete cohorts.'
