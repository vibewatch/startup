- id: scale-milestones-and-adverse-signals
  title: Scale signals, milestones, and adverse evidence
  body: 'Public traction signals are meaningful but should be read carefully. TechCrunch reported more than 350,000 paying

    customers and 10x growth in March 2026, while Cloaked''s about page later said the company had a community of more

    than 400,000 users. Those figures point in the same direction but are not the same KPI. The company also claims it

    has protected more than 10 million identities, removed more than 1 billion records from data-broker sites in

    March, and now more than 1.7 billion on the homepage. Call-screening counts similarly progressed from more than

    40 million to 50 million to 60 million-plus across sources, which suggests real growth but also reminds us that

    these are company-published operating metrics rather than audited disclosures.


    Milestone sequencing is coherent. Cloaked says it exited beta in October 2023, launched AI-powered call

    screening in 2025, and entered enterprise in late 2025. PRWeb''s enterprise launch release says that offering was

    already protecting thousands of employees and named the Chicago Cubs as a customer; Forbes adds that NFL Players

    Inc. invested with an eye toward rolling the service out to current and former players. That makes the enterprise

    push look less like an abstract adjacency and more like an early go-to-market wedge around high-risk populations.


    The main adverse evidence is not existential, but it is real. Archived Trustpilot reviews show a respectable 4.2

    out of 5 overall rating while still containing complaints about refunds, slow support, and ongoing robocalls.

    Aura and Cape both argue that Cloaked is feature-rich but uneven: pricing appears to have changed during 2026,

    some protections lag best-in-class competitors, and support quality is inconsistent. In other words, Cloaked looks

    commercially significant, but still operationally immature in ways a diligence process should test directly.'
