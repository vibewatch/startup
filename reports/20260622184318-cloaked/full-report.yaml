  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The valuation question is not whether Cloaked is interesting; it is whether the public record is strong
              enough to underwrite the price at which investors are actually entering. On that standard, the answer is
              still no. The strongest evidence is positive: Cloaked has publicly disclosed 350,000+ subscribers, more
              than 350,000 paying customers, a 400,000+ user community, current list pricing, a broad product bundle,
              and a headline $375 million Series B plus growth-financing package in March 2026. Those facts support a
              view that consumer privacy can be a meaningful business rather than a niche utility. But the missing
              variables sit directly on the valuation axis. Cloaked did not disclose its post-money valuation, did not
              disclose current ARR, did not disclose churn, and did not disclose gross margin or preference terms. That
              means the same evidence set can justify curiosity, but it cannot justify conviction on entry price. The
              recommendation is therefore research-more, not because the company lacks promise, but because the current
              public record does not yet tell investors whether the latest round was fair, stretched, or unusually
              attractive.
