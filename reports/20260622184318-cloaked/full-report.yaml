      - - Okta
        - Public identity software platform
        - ~$20.08B market cap on ~$2.91B revenue (~6.9x)
        - Richer identity-software multiple ceiling and a useful premium software reference
        - Enterprise identity is not the same category as consumer privacy
      - - TransUnion
        - Public identity and credit data platform
        - ~$12.28B market cap on ~$4.72B revenue (~2.6x)
        - Relevant for identity-protection and monitoring gravity
        - Credit-bureau economics differ materially from Cloaked's privacy workflow
      - - Experian
        - Public consumer identity/credit monitoring anchor
        - ~$29.52B market cap on ~$7.52B revenue (~3.9x)
        - Relevant for identity protection, fraud, and consumer trust monetization
