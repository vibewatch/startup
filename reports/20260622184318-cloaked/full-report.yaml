      - number: '2.4'
        title: Growth drivers, adoption constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The demand backdrop is strong and measurable. FTC reporting, IC3 complaint volumes, ITRC breach tracking,
              YouMail robocall counts, and Truecaller spam-call data all point to a persistent digital-safety problem
              rather than a cyclical fad. ITRC's 2025 report adds an especially relevant bridge to Cloaked's
              positioning: breach victims report more spam emails, robocalls, phishing, and account-takeover attempts
              after exposure. That directly links data-breach prevalence to demand for data-removal, aliasing, and
              scam-blocking products. Analyst reports reinforce the same story, repeatedly citing more online
              transactions, more cybercrime, and more enterprise concern about fraud as the category's core growth
              drivers.

              The brakes are just as important. Fortune, TBRC, and MarkWide all imply that cost, free substitutes, and
              operational complexity still limit adoption. Consumers can freeze credit without paying a subscription.
              Banks and credit bureaus give away pieces of the value proposition. Enterprise buyers can address part of
              the problem with training, call filtering, EDR, or manual opt-out workflows. Public market data also
              remains structurally noisy: the same "identity protection" label can mean credit monitoring, restoration
              insurance, family digital safety, executive privacy removal, or workforce protection.

              That has direct valuation implications. Cloaked's upside is best understood as winning a
              prevention-centric share of a documented identity-protection market while expanding distribution through
              family, benefits, and enterprise- security channels. Its downside is not that demand is imaginary, but
              that buyer education, packaging, and budget ownership remain unsettled. Investors should therefore
              underwrite the category using multiple lenses and distribution assumptions, not a single data-broker
              number or a single generic TAM estimate.
            claimRefs:
