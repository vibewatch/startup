              scanning and removing already-exposed data and protect the future by making every new signup, call, and
              purchase use disposable or compartmentalized credentials. The strongest evidence is around identity
              generation, browser-based autofill, and removal workflow. The weakest evidence is around how broadly some
              of the newer modules are actually available, because public copy still conflicts on broker counts, iPhone
              requirements, and whether Cloaked Pay is invite-only, beta, or effectively coming soon. That makes the
