      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              The buyer map is at least three-part. First is the direct consumer who wants to reduce identity exposure,
              stop spam, and protect financial accounts. Second is the family buyer, where protection is justified by
              children, spouses, and older relatives rather than a single account holder. Third is the employer or
              enterprise buyer, which itself splits between HR or benefits teams offering identity protection as a
              workforce perk and security teams treating employee exposure as a human-risk problem. Cloaked's current
              positioning touches all three.

              Javelin's research is particularly important because it shows a channel transition rather than just
              feature expansion. Direct-to-consumer subscriptions still dominate U.S. identity-protection sales, but
              they are losing share as buyers seek trusted third-party partners and bundled distribution. Allstate
              explicitly sells identity protection as an employee-employer benefit that protects family and
              productivity. MarkWide likewise highlights employer-sponsored benefits as a strategic opportunity. That
              makes buyer access, not just category size, a core part of the market thesis.

              The competitive bundle also changes who signs the budget. DeleteMe, Optery, and Incogni sell executive and
              employee privacy-removal to security teams worried about social engineering, doxing, ransomware, and
              physical threats. Aura and LifeLock sell broad family and financial-safety packages to household buyers.
              Cloaked's aliases and call screening make it more prevention-led than pure monitoring providers, but its
              enterprise case still depends on whether CISOs, HR leaders, and benefits managers can justify privacy
              tooling as a recurring budget line rather than a one-off remediation service.
            claimRefs:
