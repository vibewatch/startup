    title: Market definition table
    columns:
      - segment/category
      - included spend
      - excluded spend
      - buyer/payer
      - relevance
    rows:
      - - Consumer identity theft protection services
        - Credit monitoring, identity monitoring, restoration, insurance, dark-web alerts, fraud alerts
        - General antivirus, standalone VPNs, broad device-security suites without identity/privacy workflows
        - Individual consumer or household payer
        - Core analyst-defined category that most directly maps to published market sizes
      - - Family digital-safety bundles
        - Multi-adult or family plans that combine identity, fraud, privacy, and scam protection
        - Single-purpose parental-control apps with no identity/privacy features
        - Household decision-maker paying for family coverage
        - Relevant because Aura and LifeLock show identity protection expanding into family safety and anti-scam bundles
      - - Data-removal and exposure management
        - Broker-site scans, opt-outs, ongoing re-removal, search-result cleanup, exposure reporting
        - Ad-tech data sales, generic compliance software, one-time record deletion projects
        - Consumer subscriber, HR/benefits team, or security team
        - Directly aligned with Cloaked, DeleteMe, Optery, and Incogni prevention positioning
      - - Aliases and masked communications
        - Alias email, masked phone numbers, virtual cards, dedicated inboxes, spam/scam call screening
        - Carrier-only voice filtering, disposable email tools sold without identity/privacy context
        - Consumer subscriber or employer protecting workforce communications
        - Differentiates Cloaked from legacy monitoring vendors by attacking exposure before compromise
      - - Employer-sponsored identity protection benefits
        - Group identity-protection plans sold through benefits or HR channels
        - Traditional health, life, or disability benefits without identity/privacy coverage
        - Employer or voluntary payroll deduction
        - Important distribution path as D2C share softens and trust shifts to known third parties
      - - Enterprise digital-workforce protection
        - Employee privacy scans, executive data removal, workforce identity protection, dashboards for CISOs/HR
        - General IAM, EDR, SIEM, or privacy-compliance consulting not tied to employee exposure
        - CISO, security operations, HR, or risk/compliance leader
        - >-
          Emerging adjacency where Cloaked Enterprise and executive-privacy vendors frame personal exposure as business
          risk
    notes: >-
      Included spend is limited to products that directly reduce identity exposure, fraud risk, or recovery burden;
      broad cybersecurity, ad-tech, and privacy-compliance budgets are adjacency, not core TAM.
