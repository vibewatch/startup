  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct removers, identity suites, masking tools, and point substitutes'
        blocks:
          - type: paragraph
            body: >-
              Cloaked does not compete inside a single neat category. The most direct alternatives are DeleteMe and
              Incogni,

              both of which sell data-broker and people-search removal as the core job. Aura, Norton LifeLock, and

              PrivacyHawk solve a wider consumer-protection problem by combining removal with insurance, credit or fraud

              monitoring, remediation workflows, and family packaging. IronVest overlaps more narrowly on identity
              masking,

              phone or payment obfuscation, and anti-fraud controls, while Apple Hide My Email and Google Voice undercut
              a

              portion of the problem with low-cost email or phone masking rather than full privacy orchestration.


              That matters because the buyer’s comparison set changes with the pain point. If the buyer wants maximum
              broker

              coverage at the lowest price, Incogni and DeleteMe are the most relevant benchmarks. If the buyer wants a
              broad

              identity-protection bundle, Aura and LifeLock become harder to ignore. If the buyer mainly wants to stop
              giving

              out a real email address or phone number, Apple, Google, and IronVest can satisfy a subset of the job
              without

              paying for a full suite. Cloaked’s real competitive task is therefore to prove that prevention plus
              cleanup is a

              meaningfully better consumer outcome than buying best-of-breed removals or several cheaper point tools.
            claimRefs:
              - CP001
              - CP022
              - CP023
              - CP024
              - CP025
              - CP030
              - CP031
          - type: table
            tableRef: TP001
            claimRefs:
