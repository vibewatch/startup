      - number: '7.2'
        title: Funding, valuation, and disclosure opacity
        blocks:
          - type: paragraph
            body: >-
              Cloaked’s March 2026 financing clearly improved its capital position, but it also created a fresh
              diligence problem: the headline is large while the economics remain hard to underwrite from public
              evidence. Official and independent coverage agree on the $375 million headline and on the involvement of
              General Catalyst’s Customer Value Fund, which means the round was explicitly a mix of Series B equity and
              growth financing rather than a plain-vanilla venture raise. TechCrunch also states that Cloaked did not
              disclose either valuation or the split between equity and growth capital. That matters because investors
              cannot infer dilution, liquidation preference pressure, or the degree to which the headline round reflects
              financing against future customer acquisition rather than clean balance-sheet capital.


              The SEC record sharpens the risk rather than resolving it. The 2026 Form D shows a $133.2 million offering
              amount, $116.7 million sold, and a large SAFE conversion, but that still does not reconcile the full $375
              million announcement. Public employee counts are similarly noisy, with TechCrunch saying nearly 70
              employees while BBB lists 50. Again, none of this disproves the underlying growth story. It does, however,
              mean Cloaked is capital-mature faster than it is disclosure-mature. For a business selling trust,
              investors should treat valuation opacity, KPI drift, and partial financing visibility as a real
              underwriting risk rather than a cosmetic reporting issue.
            claimRefs:
              - CR021
              - CR022
              - CR023
              - CR024
              - CR025
