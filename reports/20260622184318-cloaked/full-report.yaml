      - number: '8.3'
        title: Traction bounds and comparable-company gravity
        blocks:
          - type: paragraph
            body: >-
              Public operating evidence is good enough to establish a real monetization surface, but not good enough to
              strike a clean late-stage multiple. Cloaked's current plans page shows individual, couple, and family
              price points, while official and independent reporting support a paid subscriber base above 350,000. Those
              two facts let an investor sketch a floor and ceiling for consumer recurring revenue even without direct
              ARR disclosure. At the same time, public comp gravity is lower than what a notional unicorn mark would
              require. Gen Digital, the closest scaled consumer cyber-safety bundle, trades on roughly 2.7x revenue
              using June 2026 market cap and FY2026 revenue. Experian and TransUnion, both relevant to consumer identity
              protection and credit-linked monitoring, trade around 3.9x and 2.6x respectively. Okta, which is less
              consumer-relevant but richer as a public identity software platform, trades closer to 6.9x. A historical
              private premium anchor exists in 1Password's 2022 $6.8 billion valuation, but that mark belongs to a
              different product mix, a different funding window, and a much more clearly established software category.
              The comp lesson is therefore disciplined rather than absolute: Cloaked can deserve a premium only if
              realized ARR, enterprise mix, and retention are well above the conservative public floor and much better
              than the market currently sees.
