      - number: '3.2'
        title: 'Head-to-head capability and pricing: where Cloaked leads and where it does not'
        blocks:
          - type: paragraph
            body: >-
              Cloaked’s strongest public differentiation is prevention. Its own product surfaces combine masked email
              and

              phone identities, data removal, dark-web and SSN alerts, spam-call blocking, VPN access, password
              management,

              and identity-theft insurance. That is a broader day-to-day privacy story than DeleteMe or Incogni, whose

              public materials emphasize post-exposure cleanup rather than alias creation, phone shielding, or
              preventative

              identity compartmentalization. For a consumer who wants one subscription that both stops new leakage and
              cleans

              up old leakage, Cloaked is closer to a unified bundle than the direct-removal leaders.


              The disconfirming evidence is substantial. Incogni’s public pricing is lower and its official materials
              plus

              multiple reviews point to broader automated broker coverage. DeleteMe leans on human privacy experts and a
              long-

              standing quarterly reporting workflow that some buyers will trust more for messy real-world footprints.
              Aura,

              LifeLock, and PrivacyHawk all offer more explicit insurance or credit-oriented remediation packaging than
              Cloaked,

              and Apple or Google can satisfy the narrow masking use case at much lower entry prices. The competitive
              picture

              is therefore not that Cloaked wins every row; it wins when the buyer values prevention, convenience, and
              bundled

              privacy controls more than any single best-of-breed metric.
