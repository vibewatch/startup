      - number: '4.3'
        title: Financing surface, filing evidence, and capital adequacy limits
        blocks:
          - type: paragraph
            body: >-
              The most concrete financial positives are access to capital and the company's ability to keep investing.
              Official sources show a $25 million Series A in 2022 and a $375 million Series B raise and growth
              financing in March 2026, for at least $400 million of announced financing across the retained official
              round announcements. The SEC record is more nuanced. Cloaked's March 27, 2026 Form D shows a first sale
              date of February 9, 2026, a $133.2 million total offering amount, $116.7 million sold, 25 investors, and a
              note that $58.2 million of the sold amount reflected SAFEs converting into Series B preferred stock. The
              April 2022 Form D shows a $25.05 million offering, $20.0 million sold, and seven investors. In other
              words, the SEC sold amounts visible in the retained filings total only about $136.7 million, far below the
              official $400 million announcement sum. That does not mean the official number is wrong; it means public
              observers cannot reconcile the full 2026 headline financing from sold equity alone. The most plausible
              interpretation is that the headline number includes growth financing or other capital not fully
              represented in the retained Form D sold amount. Hiring behavior is directionally supportive: the company's
              live jobs page still advertises engineering, product, recruiting, support, and finance roles, including a
              senior financial analyst. What remains missing is the actual balance-sheet view — no retained source
              discloses cash on hand, monthly burn, runway, or debt balances.
