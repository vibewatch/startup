      - number: '6.2'
        title: Adoption and customer proof
        blocks:
          - type: paragraph
            body: >-
              Public adoption evidence is strongest when the company’s own metrics and the independent customer-proof
              surfaces are kept separate. Cloaked claims a community of more than 400,000 users, more than 350,000
              paying subscribers, more than 4 million free scans, 10 million protected identities, over 1 billion broker
              records cleaned, and more than 50 million scam or spam calls processed. Those are directionally
              impressive, but they remain company-published operating KPIs rather than independently audited cohorts.
              Independent proof is more modest but real. Apple shows a 4.5 rating from about 6.5K ratings, Google Play
              shows a 4.1 rating with about 5.34K reviews and 100K+ installs, Product Hunt shows a 4.8 rating from 38
              early-adopter reviews, and Trustpilot shows a 4.1 rating with roughly 360 reviews. Together, those sources
              confirm meaningful consumer adoption; they do not independently validate retention, conversion, or the
