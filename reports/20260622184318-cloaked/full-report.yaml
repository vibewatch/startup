  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Consumer revenue model, pricing, and monetization surface
        blocks:
          - type: paragraph
            body: >-
              Cloaked's clearest monetization surface is a paid consumer subscription sold in individual, couple, and
              family tiers. The official plans page shows a current monthly individual price of $12.49, annual
              individual billing of $119.99, a couple plan at $19.99 monthly and $174.99 annually, and a family offer
              for up to four people at $29.99 monthly. Official pricing metadata also says plans start at $9.99 per
              month, which matches third-party trackers that still show lower annual-equivalent entry pricing. The
              subscription bundle is broader than a simple alias or password-manager SKU: current public surfaces
              package identity-theft insurance, data removal, call screening, dark-web and SSN monitoring, VPN, and
              other privacy features into the same paid product. That breadth matters financially because it supports
              premium positioning, but it also suggests a cost stack with third-party insurance, telecom,
              fraud-detection, and data-removal obligations that public sources do not quantify. The company is also
              gesturing toward future monetization beyond the base plan through enterprise contracts, eSIM, and future
              Cloaked Pay or AI products, but public evidence still stops at list pricing and feature breadth rather
              than contract economics.
