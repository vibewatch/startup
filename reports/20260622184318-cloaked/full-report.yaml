        - Direct subject; establishes what public evidence can support without a data room
        - Not disclosed ARR; excludes plan mix, discounts, churn, enterprise, and margins
      - - Gen Digital
        - Public consumer cyber-safety suite
        - ~$13.57B market cap on $5.0B FY2026 revenue (~2.7x)
        - Closest scaled consumer bundle with cyber-safety, identity, and subscription economics
