      - number: '8.2'
        title: Financing surface and the price-discovery gap
        blocks:
          - type: paragraph
            body: >-
              Cloaked's financing record is simultaneously impressive and incomplete. The company and its press-wire
              announcement both disclose a $375 million Series B raise and growth financing package in March 2026. That
              headline matters: it signals strong access to capital and a willingness by well-known backers to fund the
              next stage of expansion. But the SEC filing record does not translate the headline into a clean valuation
              mark. The March 2026 Form D shows a $133.2 million total offering amount and $116.7 million sold, with
              roughly $58.2 million of the sold amount attributable to SAFE conversions into Series B preferred stock.
              In other words, the publicly visible sold securities are well below the $375 million headline and part of
              that visible amount was not fresh cash at the moment of conversion. The 2022 Series A shows the same
              pattern of partial visibility: $25 million announced, $25.05 million offered, and about $20.0 million sold
              in the filed Form D. The practical conclusion is not that management misstated the round. The practical
              conclusion is that the public filing trail does not reveal the full 2026 financing stack or the post-money
              price, so investors should not treat the headline raise itself as proof that the current valuation is
              attractive.
