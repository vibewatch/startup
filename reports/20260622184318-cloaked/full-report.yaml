chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and operating model
        blocks:
          - type: paragraph
            body: >-
              Cloaked was founded in 2020 by brothers Arjun and Abhijay Bhatnagar around a simple but resonant thesis:
              it

              should be normal to use the internet without constantly exposing your real identity. The origin story is
              unusually

              personal. Arjun says the idea came after he built a personal "databox" AI that combined his messages,
              finances,

              health data, and routines, only to discover it could act on his behalf in unsettling ways. That experience
              turned

              a general privacy concern into a concrete product mission.


              The initial product was an identity layer: unique phone numbers, email addresses, passwords, and other
              account

              identifiers that let users sign up, shop, or communicate without disclosing their real details. Over time,

              Cloaked expanded that narrow identity abstraction into a broader privacy suite that now spans broker-data

              removal, dark-web and SSN monitoring, password management, VPN, AI-assisted call screening, and
              identity-theft

              insurance. The business model appears to be subscription-led on the consumer side, with an increasingly
              visible

              enterprise layer that packages the same protection stack for employees.


              Public materials also show a product roadmap still in motion. Cloaked Pay is publicly described as a beta
              or

              near-launch product, and the privacy policy confirms it requires extra KYC-style financial data. The
              company is

              also talking about AI-driven personal agents to automate privacy management. Together, that positions
              Cloaked less

              as a single-feature utility and more as an attempt to become a default privacy operating layer for both
              households

              and workplaces.
