    title: Customers
    sections:
      - number: '6.1'
        title: Segments and core use cases
        blocks:
          - type: paragraph
            body: >-
              Cloaked’s customer map starts with a subscription-led consumer business, but the company no longer markets
              to a single generic privacy enthusiast. Its pricing and copy now separate buyers into Individual, Couple,
              and Family tiers, with the household packages positioned around children, spouses, and shared digital
              risk. The product promise is consistent across those tiers: mask the real phone number and email, remove
              exposed broker data, block scam or robocall traffic, and backstop the user with identity-theft insurance.
              That makes the real segmentation less about feature unlocks than about who needs protection together and
              how many identities must be managed under one plan. Public materials also show a second segment: employers
              that want workforce privacy tooling for employees and administrative visibility for HR or security teams.
              In other words, Cloaked is trying to sell both direct-to-consumer peace of mind and employer-sponsored
              digital safety, using the same core privacy stack in both channels. Third-party pricing trackers also
              describe a free-trial entry path, reinforcing that signup friction is intentionally kept low.
