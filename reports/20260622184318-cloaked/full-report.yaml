  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Product trust, support load, and public-claim consistency
        blocks:
          - type: paragraph
            body: >-
              Cloaked’s most immediate diligence risk is not whether the privacy problem exists; it is whether a broad,
              trust-sensitive product can keep customer experience aligned with its marketing copy. Public complaint
              sources show a real brand-trust gap. Trustpilot still reflects an overall 4.2/5 score, but the visible
              review mix includes recurring complaints about slow or hard-to-reach support, call-blocking false
              positives, refunds, and no measurable drop in robocalls for some users. BBB is more direct: the business
              profile carries a B rating, and the published complaint record shows refund disputes, onboarding failures,
              verification-code loops, and reports that Call Guard or identity-generation problems left paid subscribers
              unable to use the service. JustUseApp and Google Play add lower-confidence but directionally similar
              criticism around account access, slow removals, and misleading expectations.


              The more important issue is that product copy itself is inconsistent across public surfaces.
              Company-operated pages variously claim 400+, 140+, or 120+ broker removals. User and call-screening KPIs
              also drift by channel. None of those gaps proves fraud, but in a privacy product they do matter: buyers
              are explicitly outsourcing trust, accuracy, and technical reliability. A company can survive mixed
              reviews; it is harder to survive a pattern where support, setup, and efficacy claims need a footnote on
              every channel. That makes product trust risk both a conversion issue and a retention issue, especially if
              Cloaked is trying to move upmarket into enterprise buyers who will diligence operational maturity more
              aggressively than consumer app buyers.
