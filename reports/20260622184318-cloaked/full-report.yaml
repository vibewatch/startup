  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      The public stack starts with extension, dashboard, and mobile entry points, then runs through identity proxies,
      cleanup or monitoring services, and optional enterprise administration.
    data:
      layers:
        - label: Access surfaces
          detail: Chromium extension, dashboard, and mobile apps are the visible user interfaces for most everyday actions.
          modules:
            - Chromium extension
            - Web dashboard
            - iPhone app
            - Android app
        - label: Identity and inbox core
          detail: >-
            Users generate per-site emails, phones, usernames, passwords, and route communications through
            Cloaked-controlled inboxes and call logs.
          modules:
            - Generated identities
            - Email forwarding
            - Phone forwarding
            - Inbox and call logs
        - label: Preventive controls
          detail: >-
            On-web usage layers in password autofill, TOTP handling, secure sharing, and AI call screening so users do
            not expose real data during normal activity.
          modules:
            - Password manager
            - TOTP storage
            - Encrypted sharing
            - Call Guard
        - label: Cleanup and monitoring services
          detail: >-
            Exposure scanning, broker removals, dark-web monitoring, and insurance-backed response sit behind the
            preventive layer.
          modules:
            - Exposure scan
            - Data removal
            - Dark-web and SSN alerts
            - Identity-theft insurance
        - label: Partner-dependent privacy add-ons
          detail: >-
            VPN transport, financial-linking, and payment-card creation depend on named outside providers and card
            rails.
          modules:
            - PureVPN-backed VPN
            - Plaid / PayPal / Stripe
            - Cloaked Pay beta
        - label: Enterprise overlay
          detail: >-
            CISOs and HR admins get a deployment and monitoring wrapper over the same underlying employee privacy
            modules.
          modules:
            - Bulk enrollment
            - Admin monitoring
            - Automated communication
    approximationNotes: >-
      The figure reflects only the public operating stack visible across product pages, policy, app listings, and
      enterprise marketing; it does not speculate about hidden back-end services.
