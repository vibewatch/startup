      - number: '4.4'
        title: Cost structure, margin path, and adverse user-value signals
        blocks:
          - type: paragraph
            body: >-
              Public sources make it possible to sketch cost drivers, but not to quantify them. Cloaked is not selling a
              single lightweight software seat. The bundle includes broker removals, identity-theft coverage, spam and
              robocall screening, dark-web monitoring, VPN, and privacy identities, with Google Play also describing an
              eSIM add-on. Each component likely carries external service-delivery costs: insurance underwriting,
              telecom or eSIM relationships, support labor, fraud tooling, and continuous data-removal operations. That
              does not disprove an attractive gross-margin model, but it makes a pure-password-manager margin assumption
              unrealistic. Independent reviews also signal some pressure on pricing power and support economics. PCMag
              rated the product highly but still called it relatively expensive. Aura argued that Cloaked falls short of
              best-in-class alternatives on some feature depth, and JustUseApp collected materially negative combined
              sentiment with complaints around pricing, account access, and support. Even Trustpilot's generally
              positive snapshot mentioned user-experience and support friction. Those sources do not prove churn, but
              they do suggest that realized retention and service cost deserve scrutiny rather than being assumed away.
            claimRefs:
