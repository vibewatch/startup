      - number: '3.4'
        title: 'Moat durability: real differentiation, but meaningful execution risk'
        blocks:
          - type: paragraph
            body: >-
              Cloaked’s moat is credible only in a specific shape: a consumer bundle that combines proactive masking,

              reactive removal, and identity support in one workflow. That combination is genuinely differentiated
              against

              Incogni and DeleteMe, which are optimized for cleanup, and against Apple or Google, which only address
              slices of

              the prevention problem. The retention logic is intuitive: once a user has segmented accounts behind
              aliases,

              linked them to call screening and monitoring, and uses the product as an everyday privacy layer, switching
              away

              can mean rebuilding habits rather than merely canceling a report service.


              But the public evidence also shows why the moat should not be overstated. Cloaked’s own marketing surfaces
              do

              not present one stable current number for broker coverage or usage scale, which weakens confidence in
              precision

              around category leadership. Incogni appears better on raw removal coverage and price, DeleteMe retains a
              strong

              trust position around human-assisted removals, and Aura or LifeLock are better established for
              credit-heavy

              remediation. Meanwhile, cheaper substitutes like Apple Hide My Email, Google Voice, and IronVest can erode
              the

              willingness to pay for the prevention side of the bundle. The likely verdict is not that Cloaked lacks a
              moat,

              but that its moat depends on execution quality, product clarity, and proving superior consumer outcomes
              rather

              than merely advertising more features in one subscription.
