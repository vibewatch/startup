      - number: '1.2'
        title: Leadership, governance, and corporate footprint
        blocks:
          - type: paragraph
            body: >-
              Leadership is still founder-centric. Arjun Bhatnagar is the public-facing CEO and Abhijay Bhatnagar is the
              CTO

              and, in some public bios, chief AI officer. Their prior collaboration on Hey! HeadsUp supports a
              repeat-founder

              narrative, and the founding story gives them clear founder-market fit in consumer privacy and identity
              tooling.

              Publicly visible governance, however, remains fairly thin. The clearest board datapoint in the reviewed
              corpus is

              Lux Capital partner Bilal Zuberi joining the board alongside the March 2022 Series A, which implies
              outside

              investor oversight but does not amount to a fully transparent board picture.


              Cloaked does appear to have built a broader executive bench. Its about page lists a Chief Experience
              Officer,

              General Counsel/CCO, CISO, VP of Finance, VP of Customer Success, and several functional heads, while
              Craft names

              Michael Abbate as Chief Experience Officer. That suggests the company is no longer run only by the two
              founders,

              even if it still depends heavily on them.


              The more material diligence issue is corporate footprint ambiguity. Company press releases in 2024 and
              2026 say

              Cloaked is based in New York City, while Craft and Tracxn list a Lowell, Massachusetts address and Tracxn
              points

              to an active US legal entity, CLOAKED, INC. TechCrunch's 2022 coverage called the company Boston-based.
              The most

              defensible reading is that Cloaked has a Massachusetts legal footprint and later adopted New York City as
              its

              operating-base identity, but the exact split is not fully documented in public sources.
