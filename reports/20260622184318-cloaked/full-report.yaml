  - id: TV006
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Unacceptable disclosed price
        - Post-money is above roughly $1.5B without evidence of >$80M ARR or similarly strong annualized billings
        - Public-evidence multiple jumps into a zone that looks hard to defend versus reviewed comps
        - Pass or demand a materially lower effective entry price
      - - Preference or debt overhang
        - Term sheets show heavy liquidation preferences, senior growth-capital claims, or structurally dilutive terms
        - Even solid enterprise-value growth may not translate into equity returns
        - Rebuild the return model before proceeding
      - - Enterprise optionality is overstated
        - Enterprise deals exist but contribute little recurring revenue or poor retention
        - Bull case loses its main explanation for premium pricing
        - Collapse the scenario range toward base or bear
      - - Subscriber count overstates quality
        - Net paying users rely on deep discounting, high churn, or support-intensive cohorts
        - Public floor band overstates sustainable ARR quality
        - Reset the revenue anchor and lower the acceptable multiple
      - - Adverse customer evidence persists
        - >-
          Account lockouts, cancellation friction, or pricing complaints are widespread enough to impair willingness to
          pay
        - Retention and pricing-power assumptions weaken together
        - Require clear churn and support-resolution evidence before investing
    notes: Triggers are framed as underwriting kill criteria, not operating-team KPIs.
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV050
      - CV054
      - CV055
      - CV060
  - id: TV007
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Post-money valuation
        - Exact pre-money and post-money from the 2026 financing
        - Without the actual price there is no clean cheap/fair/expensive call
        - Request lead-investor term sheet and board financing memo
      - - Financing split
        - Breakdown of the $375M between fresh equity, SAFE conversion, growth financing, and any debt-like instruments
        - Headline dollars are not equivalent to clean equity price discovery
        - Reconcile Form D with company financing schedule
      - - Cap table and preferences
        - Full liquidation stack, preference multiples, seniority, warrants, and anti-dilution terms
        - Return math depends on more than enterprise value
        - Review cap-table model with company counsel and CFO
      - - ARR and plan mix
        - Current ARR or annualized billings by individual, couple, family, and enterprise
        - Needed to test whether public subscriber count supports the implied value
        - Request revenue bridge and subscription-cohort deck
      - - Retention and margin quality
        - Churn, NRR if relevant, gross margin, support cost, and CAC or payback
        - Determines what multiple band Cloaked actually deserves
        - Review cohort analytics and management accounts
      - - Enterprise proof
        - Customer count, ACV, sales cycle, and renewal behavior for enterprise deals
        - Bull case depends on higher-quality revenue than the public consumer floor alone
        - Interview sales leadership and inspect contract sample
    notes: Every ask maps to a variable that could materially change the valuation range or the acceptable entry price.
    claimRefs:
      - CV012
      - CV013
      - CV050
      - CV053
      - CV055
      - CV059
