  - id: TP001
    title: Competitor profile table
    columns:
      - competitor
      - category
      - target user
      - pricing anchor
      - differentiation
      - limitation
    rows:
      - - Cloaked
        - Integrated privacy suite
        - Consumers who want prevention plus cleanup
        - Public pricing not cleanly extractable from retained official pages
        - Aliases, phone protection, removal, monitoring, insurance, VPN, password tools in one bundle
        - Public metrics and coverage counts are not perfectly consistent across Cloaked pages
      - - DeleteMe
        - Direct data-removal service
        - Users who want human-assisted removals
        - $129/year starting point for one person
        - Human privacy experts, quarterly privacy reports, family and business packaging
        - Less evidence of preventive masking, insurance, or credit-oriented identity tooling
      - - Incogni
        - Automated data-removal service
        - Price-sensitive users who want broad automated removals
        - $7.99/month billed yearly for standard individual plan
        - 420+ broker coverage, recurring automated requests, lower entry price
        - No native phone/email aliasing in retained evidence and fewer bundled identity extras
      - - Aura
        - Broad identity-protection suite
        - Households wanting credit, fraud, and privacy coverage together
        - Individual plan from $12/month billed annually
        - 200+ broker removal plus insurance, credit monitoring, VPN, password manager, and fraud remediation
        - Removal breadth trails the largest specialized removal counts
      - - IronVest
        - Masking and anti-fraud tool
        - Users prioritizing masked identities and payment privacy
        - Public pricing not retained directly from official pages
        - Anonymized emails and phone numbers, masked cards, biometrics, browser plus mobile support
        - Not positioned as a leading high-breadth broker-removal service
      - - PrivacyHawk
        - Mobile-first privacy suite
        - Consumers who want app-led data cleanup and identity support
        - $74.99/year Premium; $124.99/year Platinum
        - 100+ broker removal, digital-footprint cleanup, $5M coverage on Platinum, family plans
        - Independent competitive coverage is thinner than for Incogni, DeleteMe, or Aura
      - - Norton LifeLock
        - Identity monitoring and remediation suite
        - Users prioritizing reimbursement and financial-alert workflows
        - $124.99/year Core; $199.99 Advanced; $349.99 Total
        - Credit and account alerts, reimbursement tiers, automatic data-broker removal
        - Reactive identity protection is stronger than preventive masking in retained evidence
      - - Apple Hide My Email
        - Point substitute for email masking
        - Apple users who only need email aliases
        - Included in iCloud+ from $0.99/month
        - Low-cost random relay addresses tied to Sign in with Apple and iCloud+
        - No broker removal, no phone masking, no remediation or insurance layer
      - - Google Voice
        - Point substitute for phone masking
        - Users who mainly want a secondary phone number
        - Most US/Canada calls free; some calls cost $0.01/minute
        - Secondary number across browser and mobile with spam blocking
        - No broker removal, no identity insurance, and Google processes communication data
    notes: >-
      Rows cover the main direct, adjacent, and substitute options visible in retained 2026 public evidence rather than
      every small privacy app.
    enumerationScope:
      coverage: partial
      basis: >-
        This table includes the main direct, adjacent, and substitute options most likely to appear in a serious
