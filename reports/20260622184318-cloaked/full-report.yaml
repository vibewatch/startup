      - number: '7.5'
        title: Residual exposure, mitigation maturity, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The risk-adjusted conclusion is that Cloaked’s top risks are executional and trust-related, not
              existential category risk. The external fraud problem is large and persistent: IC3 reported $16.6 billion
              in 2024 losses, and the ITRC still handled thousands of identity-crime cases in its 2026 trends dataset.
              That supports demand. But demand alone does not guarantee a durable winner. Cloaked’s disclosed
              mitigations — certifications, encryption, insurance, and app-store traction — reduce downside from a pure
              security-theater story, yet they do not eliminate the problems most visible in public evidence:
              complaint-driven refund friction, metric inconsistency, funding opacity, concentration of enterprise
              proof, and a product roadmap that keeps expanding while support complaints are still easy to find.


              For investors, the thesis should break not on one bad review but on operating signals that show the trust
              gap widening instead of narrowing. A continued rise in BBB complaints, persistent broker-coverage
              inconsistency across first-party pages, failure to clarify valuation and financing structure, or evidence
              that Call Guard harms legitimate communications at scale would each weaken the case. Conversely, if
              Cloaked standardizes KPI disclosure, broadens named enterprise proof, and demonstrates that support
              maturity is catching up to product breadth, several of these risks could compress. Today, though, the
              public record still supports a high residual-execution-risk view.
