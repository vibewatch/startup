            body: >-
              Public evidence shows that Cloaked is trying to own the entire personal-exposure workflow rather than one
              narrow privacy task. The retained official pages repeatedly bundle generated identities, data removal,
              dark-web and SSN monitoring, Call Guard, insurance, VPN, password management, and a still-limited Cloaked
