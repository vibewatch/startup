      - number: '4.5'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The supportable financial verdict in June 2026 is that Cloaked has crossed the threshold from concept to
              monetized consumer platform, but it has not crossed the threshold to underwritable transparency. Pricing
              is public. Subscriber scale is public. App-store usage, review volume, and free-scan volume are public.
              Financing access is public, and recent capital plus continued hiring argue against immediate financing
              distress. Those are real positives. The blockers are equally real. No retained public source discloses
              realized revenue, ARR, enterprise mix, gross margin, CAC, payback, churn, NRR, cash, monthly burn, runway,
              or debt. The SEC record explains some of the financing surface but not the entire $375 million headline
              figure. Product-surface inconsistencies on broker-removal counts also remind investors that even
              commercial KPIs need reconciliation across channels. A disciplined next step is therefore not to
              back-solve a heroic revenue number; it is to request the underlying billing, cohort, gross-margin, and
              cash materials. Until that happens, Cloaked looks fundable and commercially credible, but still not fully
              underwritable on revenue quality or capital adequacy.
            claimRefs:
              - CI031
              - CI032
              - CI033
              - CI044
