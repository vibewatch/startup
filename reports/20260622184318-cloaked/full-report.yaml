      - number: '3.3'
        title: Trust, support, and distribution posture
        blocks:
          - type: paragraph
            body: >-
              Trust signals are uneven across the field and matter because consumer privacy buyers are outsourcing a
              highly

              sensitive workflow. DeleteMe leans on age, visible customer support, quarterly reports, and an A+ BBB
              rating.

              Aura and LifeLock lean on insurance, fraud-remediation workflows, credit monitoring, and broader
              cybersecurity

              framing. Incogni’s strength is less human assurance than automation and category value, reinforced by
              repeated

              independent rankings. PrivacyHawk’s positioning is app-first and consumer friendly, but it receives less

              independent long-form evaluation than the top three removal brands. IronVest has a distinct
              privacy-security

              architecture story, but the independent review record frames it as a narrower anti-fraud or masking tool
              than a

              comprehensive removal vendor.


              Distribution and support posture also shape moat. Aura, LifeLock, DeleteMe, and PrivacyHawk expose family
              or

              multi-person packaging more clearly than Cloaked’s retained public evidence does, and DeleteMe also pushes
              a

              business plan. PrivacyHawk is explicitly mobile-app centered, IronVest and Google Voice support browser
              plus

              mobile usage, and Apple’s substitute is tightly tied to the Apple account and iCloud ecosystem. By
              contrast,

              retained public evidence for DeleteMe and Incogni is more web-dashboard oriented than app-led. These
              differences

              do not decide the market alone, but they affect how easily each rival can fit different household, budget,
              and

              operating habits.
