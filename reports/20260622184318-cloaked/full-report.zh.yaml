  - id: TV005
    title: 可比估值表
    columns:
      - 可比对象
      - 类别
      - 公开估值锚点
      - 与 Cloaked 的相关性
      - 局限
    rows:
      - - Cloaked 公开下限区间
        - 私有消费者隐私平台
        - 基于 350K 付费用户和当前个人定价，消费者总年化收入下限 / 上限约 ~$42M-$52.5M
        - 直接标的；在没有 data room 的情况下，界定公开证据能支撑什么
        - 不是已披露 ARR；不含套餐结构、折扣、流失、企业业务和利润率
      - - Gen Digital
        - 公开消费者网络安全套件
        - FY2026 收入 $5.0B，对应市值约 ~$13.57B（~2.7x）
        - 最接近的规模化消费者组合包，具备网络安全、身份和订阅经济性
        - 规模远大于 Cloaked，且是公开上市公司、业务更分散
      - - Okta
        - 公开身份软件平台
        - 收入约 ~$2.91B，对应市值约 ~$20.08B（~6.9x）
        - 提供更高的身份软件倍数天花板，也是有用的高溢价软件参照
        - 企业身份与消费者隐私不是同一品类
      - - TransUnion
        - 公开身份和信用数据平台
        - 收入约 ~$4.72B，对应市值约 ~$12.28B（~2.6x）
        - 与身份保护和监控的估值重力相关
        - 信用局经济性与 Cloaked 的隐私工作流差异很大
      - - Experian
        - 公开消费者身份 / 信用监控锚点
        - 收入约 ~$7.52B，对应市值约 ~$29.52B（~3.9x）
        - 与身份保护、欺诈和消费者信任变现相关
        - 分析业务和征信局敞口远宽于 Cloaked
      - - 1Password（2022 年私募标记）
        - 私有安全和身份软件锚点
        - $620M Series C，估值 $6.8B
        - 显示在合适市场窗口，私有安全软件可以拿到高溢价标记
        - 2022 年历史定价，产品组合不同，也不是当前公开交易可比公司
    enumerationScope:
      coverage: partial
      basis: >-
        The set covers the subject company, four current public valuation anchors in adjacent digital-safety, identity,
        or consumer-protection categories, and one historical private premium anchor because pure-play public consumer
        privacy comps are scarce.
    notes: 公开市值锚点是 2026 年 6 月快照；1Password 只作为历史私募溢价参照纳入，不是直接可比的当前倍数。
