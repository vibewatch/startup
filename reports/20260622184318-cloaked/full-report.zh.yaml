  - id: TV006
    title: 论点破裂与否决触发表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 披露价格不可接受
        - 投后估值高于约 $1.5B，且没有 >$80M ARR 或同等强度年化 billings 的证据
        - 公开证据倍数跳进相对已审阅可比公司很难自圆其说的区间
        - 放弃，或要求有效入场价格大幅降低
      - - 优先权或债务包袱
        - Term sheet 显示沉重清算优先权、高级增长资本债权，或结构性稀释条款
        - 即便企业价值增长扎实，也未必转化为股权回报
        - 推进前重建回报模型
      - - 企业可选性被夸大
        - 企业交易存在，但贡献的经常性收入很少或留存差
        - 牛市情景失去解释高溢价定价的主要理由
        - 将情景区间压回基准或熊市
      - - 订阅用户数高估质量
        - 净付费用户依赖深度折扣、高流失或支持密集型客群
        - 公开下限区间高估可持续 ARR 质量
        - 重置收入锚点，并降低可接受倍数
      - - 负面客户证据持续存在
        - 账户锁定、取消摩擦或价格投诉广泛到足以损害付费意愿
        - 留存和定价权假设同时变弱
        - 投资前要求清晰的流失率和支持解决证据
    notes: 触发项按承销否决标准来写，不是运营团队 KPI。
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV050
      - CV054
      - CV055
      - CV060
  - id: TV007
    title: 最终尽调请求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 投后估值
        - 2026 年融资的确切投前和投后估值
        - 没有实际价格，就无法干净判断便宜、公允还是昂贵
        - 索取领投方 term sheet 和董事会融资备忘录
      - - 融资拆分
        - $375M 在新股权、SAFE 转换、增长融资和任何类债工具之间的拆分
        - Headline 金额不等于干净的股权价格发现
        - 用公司融资明细表对齐 Form D
      - - 股权结构和优先权
        - 完整清算结构、优先权倍数、优先级、认股权证和反稀释条款
        - 回报测算不只取决于企业价值
        - 与公司法律顾问和 CFO 审阅 cap table 模型
      - - ARR 和套餐结构
        - 当前 ARR 或按个人、情侣、家庭和企业拆分的年化 billings
        - 需要检验公开订阅用户数是否支撑隐含价值
        - 索取收入桥和订阅队列 deck
      - - 留存和利润率质量
        - 流失率、若相关则 NRR、毛利率、支持成本，以及 CAC 或回本周期
        - 决定 Cloaked 实际该拿哪个倍数区间
        - 审阅队列分析和管理账
      - - 企业证据
        - 企业交易的客户数量、ACV、销售周期和续约行为
        - 牛市情景依赖比公开消费者下限更高质量的收入
        - 访谈销售负责人并检查合同样本
    notes: 每项请求都映射到一个可能显著改变估值区间或可接受入场价格的变量。
    claimRefs:
      - CV012
      - CV013
      - CV050
      - CV053
      - CV055
      - CV059
