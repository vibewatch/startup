  - id: FU004
    title: 支持与流失风险流程
    type: flow
    layout: wide
    summary: 标出客服摩擦在哪些环节会把信任产品变成流失或投诉风险。
    data:
      nodes:
        - id: s1
          label: 安装 / 订阅
          detail: 用户下载应用或开始付费套餐。
          tone: neutral
        - id: s2
          label: 设置或功能问题
          detail: Call Guard 路由、登录、订阅或功能可用性问题出现。
          tone: warning
        - id: s3
          label: 主要支持渠道
          detail: 邮件、聊天、电话、应用商店回复，或真人引导上手。
          tone: neutral
        - id: s4
          label: 升级投诉面
          detail: 如果解决太慢或前后不一，用户会转向 Trustpilot、JustUseApp 或 BBB 投诉。
          tone: risk
        - id: s5
          label: 解决或流失
          detail: 退款 / 跟进可以留住账户，但反复摩擦会损害信任和续费。
          tone: risk
      edges:
        - from_: s1
          to: s2
          label: 运营摩擦
        - from_: s2
          to: s3
          label: 介入支持
        - from_: s3
          to: s4
          label: 若未解决
        - from_: s4
          to: s5
          label: 退款、挽回或流失
    approximationNotes: 该序列综合应用商店、评论和 BBB 投诉叙述得出，并非来自内部工单数据。
