      - number: '2.3'
        title: 买家、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              买家地图至少分三块。第一类是希望降低身份暴露、拦截垃圾信息并保护金融账户的直接消费者。第二类是家庭买家，保护理由来自儿童、配偶和年长亲属，而不是单个账户持有人。第三类是雇主或企业买家，内部又分成把身份保护作为员工福利的
              HR 或福利团队，以及把员工暴露视为人为风险问题的安全团队。Cloaked 当前定位触及这三类。

              Javelin 的研究尤其重要，因为它显示的是渠道迁移，而不只是功能扩张。D2C 订阅仍主导美国身份保护销售，但随着买家寻找可信第三方伙伴和打包分发，其份额正在流失。Allstate
              明确把身份保护作为员工—雇主福利出售，保护家庭和生产力。MarkWide 也把雇主赞助福利列为战略机会。这意味着买家触达，而不只是品类规模，是市场论点的核心。

              竞争组合也改变了谁来签预算。DeleteMe、Optery 和 Incogni 向担心社会工程、doxing、勒索软件和人身威胁的安全团队销售高管与员工隐私删除。Aura 和 LifeLock
              向家庭买家销售宽泛的家庭与金融安全包。Cloaked 的别名和来电筛查让它比纯监控供应商更偏预防，但其企业案例仍取决于 CISO、HR 负责人和福利经理能否把隐私工具证明为一条经常性预算，而不是一次性修复服务。
