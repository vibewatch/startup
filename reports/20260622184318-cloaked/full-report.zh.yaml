              是可见控制界面。其下是一个身份层，可以生成代理邮箱、电话号码、用户名、密码、一次性验证码，有时还包括支付身份。通信随后流经 Cloaked
              管理的收件箱、转发逻辑和来电筛查界面；暴露清理和泄露监控则并行存在，而不是一个单体功能。实际含义是，如果 Cloaked
