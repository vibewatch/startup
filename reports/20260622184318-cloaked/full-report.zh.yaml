  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 版图：直接删除服务、身份套件、遮蔽工具与单点替代品
        blocks:
          - type: paragraph
            body: >-
              Cloaked 并不在一个整齐的单一品类里竞争。最直接的替代品是 DeleteMe 和 Incogni，两者都把数据经纪商和人员搜索删除作为核心任务。Aura、Norton LifeLock 和
              PrivacyHawk 通过把删除与保险、信用或欺诈监控、修复流程和家庭打包结合起来，解决更宽的消费者保护问题。IronVest 在身份遮蔽、电话或支付混淆和反欺诈控制上有更窄重叠；Apple Hide My
              Email 和 Google Voice 则用低成本邮箱或电话遮蔽，切走问题的一部分，而不是提供完整隐私编排。

              这一点重要，因为买家的比较集合会随痛点变化。如果买家想用最低价格获得最大经纪商覆盖，Incogni 和 DeleteMe 是最相关基准。如果买家想要宽泛的身份保护包，Aura 和 LifeLock
              就难以忽视。如果买家主要是不想交出真实邮箱或电话号码，Apple、Google 和 IronVest 不用全套订阅也能满足一部分任务。Cloaked 真正的竞争任务，是证明「预防 +
              清理」带来的消费者结果，明显好过购买同类最佳删除服务或几种更便宜的单点工具。
