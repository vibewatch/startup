      - number: '4.3'
        title: 融资表面、备案证据与资本充足性的边界
        blocks:
          - type: paragraph
            body: >-
              最具体的财务正面因素，是获得资本的能力以及公司继续投入的能力。官方来源显示，2022 年 Series A 为 $25 million，2026 年 3 月 Series B 和增长融资为 $375
              million；按留存的官方轮次公告，已宣布融资至少 $400 million。SEC 记录更复杂。Cloaked 2026 年 3 月 27 日 Form D 显示，首次销售日期为 2026 年 2 月 9
              日，总发行额 $133.2 million，已售 $116.7 million，投资人 25 名，并注明已售金额中 $58.2 million 反映 SAFEs 转换为 Series B 优先股。2022 年 4
              月 Form D 显示发行额 $25.05 million，已售 $20.0 million，投资人 7 名。也就是说，留存备案中可见的 SEC 已售金额合计只有约 $136.7 million，远低于官方
              $400 million 公告总额。这不意味着官方数字错误；它意味着公开观察者无法仅从已售股权对齐完整的 2026 年头条融资。最合理的解释是，头条数字包含增长融资或其他资本，而这些没有完全体现在留存 Form
              D 已售金额中。招聘行为提供方向性支持：公司实时职位页仍在招聘工程、产品、招聘、支持和财务岗位，包括高级财务分析师。真正缺失的是资产负债表视角——没有留存来源披露手头现金、月度烧钱、资金续航或债务余额。
