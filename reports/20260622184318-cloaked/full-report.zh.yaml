  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - 泄露量和投诉强度
        - 驱动
        - 当前
        - IC3 和 ITRC 数据显示，身份与欺诈问题持续存在，支撑复购型需求
        - Cloaked 获客中，有多少来自泄露后或欺诈触发用户？
      - - 垃圾信息、诈骗和自动拨号电话泛滥
        - 驱动
        - 当前
        - YouMail 和 Truecaller 指标支撑诈骗 / 垃圾信息拦截成为买方愿意付费减少的问题
        - 相比单独监控，来电 / 短信保护带来多少增量留存？
      - - 雇主福利和合作伙伴分销
        - 驱动
        - 近期
        - Javelin、MarkWide 和 Allstate 暗示，团体渠道可以降低 CAC，并扩大对家庭的渗透
        - Cloaked 哪些合作伙伴渠道在转化：雇主、保险公司、银行还是福利平台？
      - - 企业人身风险叙事
        - 驱动
        - 近期
        - DeleteMe、Optery、Incogni 和 Cloaked Enterprise 表明，隐私移除一旦与社会工程风险挂钩，安全预算就可能买单
        - 企业销售由安全、HR 还是法务牵头？哪些证明点能促成成交？
      - - 监管与合规压力
        - 驱动
        - 中期
        - FTC、GLBA 以及州隐私或泄露规则，会强化金融和企业买方的采购紧迫感
        - 买方发现和采购语言中，最常出现哪些监管要求？
      - - 价格敏感和免费替代品
        - 约束
        - 当前
        - 信用冻结、免费信用监控，以及银行或运营商的局部工具，会限制用户为高级层级付费的意愿
        - 哪些留存或附加率数据能证明 Cloaked 可以赢过免费层？
      - - 类别混乱和 TAM 定义嘈杂
        - 约束
        - 当前
        - 分析师报告把监控、恢复、家庭安全和企业隐私混在一个标签下，SAM 主张因此脆弱
        - 管理层能否把收入拆成监控、移除、别名和企业，支撑更干净的 SAM？
      - - 企业预算归属分散
        - 约束
        - 近期
        - 安全、HR、法务和福利团队都能认领部分问题，拖慢采购
        - 可重复的经济买方是谁？合同由哪条预算线支付？
    notes: 扩大类别的力量，也让转化更复杂：问题真实存在，但分销、打包和预算归属仍未稳定。
