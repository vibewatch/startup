      - number: '8.5'
        title: 最终尽调要求与放弃标准
        blocks:
          - type: paragraph
            body: >-
              下一步尽调应明确对价格敏感。如果未披露的 post-money 估值相对公开下限并不高，且 cap table 干净，Cloaked 可以很快进入更具建设性的区域。如果 post-money
              已在独角兽区间，而条款清单包含重大优先权、类债务或稀释包袱，承销就会困难得多。最重要的问题很直接：披露准确 post-money 和融资拆分；按套餐以及企业 / 消费者拆分提供当前 ARR
              或年化账单；展示留存、流失率和毛利率；并画清清算栈。这些不是锦上添花。它们决定公开可比公司引力应套在低端、高端，还是根本不该套用。最清晰的论点击穿点，是披露估值高于约 $1.5
              billion，却没有证据显示已实现 ARR 已高于约 $80 million，且企业或家庭套餐组合具有耐久性。在这些事实浮出水面之前，公开记录支持兴趣，但不支持价格信心。
