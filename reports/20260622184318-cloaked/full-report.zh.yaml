  - id: TP003
    title: 定价 / 打包对比
    columns:
      - 供应商
      - 公开起步价
      - 多人打包
      - 包含亮点
      - 重要缺口或提示
    rows:
      - - Cloaked
        - 留存官方页面无法清晰提取
        - 官方移除页面有家庭叙事证据，但未留存准确套餐
        - 别名、移除、来电筛查、暗网 / SSN 告警、VPN、密码管理器、$1M 保险
        - 相比大多数同业，留存抓取中的官方定价可见度更弱
      - - DeleteMe
        - 单人 $129/year
        - 双人、四人家庭和企业计划
        - 人工协助移除、季度报告、自定义请求、支持
        - 更聚焦移除，而不是预防性掩码或信用监控
      - - Incogni
        - Standard 个人计划按年付费为 $7.99/month
        - 家庭计划最多四人
        - 自动周期移除和 Unlimited 自定义移除层
        - 身份附加功能广度不及 Cloaked、Aura 或 LifeLock
      - - Aura
        - 个人计划按年付费为 $12/month
        - 双人和家庭计划，最多五名成人外加不限儿童
        - 200+ 经纪商移除、每名成人 $1M 保险、信用监控、VPN、密码管理器
        - 只想做经纪商移除的用户，会看到比 Incogni 更高的价格点
      - - IronVest
        - 官方页面未直接留存公开定价
        - 官方页面集中没有清晰留存
        - 掩码邮箱、电话号码、虚拟卡、生物识别
        - 留存证据中，价格透明度和移除广度弱于头部移除竞争对手
      - - PrivacyHawk
        - Premium 每年 $74.99；Platinum 每年 $124.99
        - Premium Family 和 Platinum Family，最多四人
        - 每月移除、清理、退订、Platinum $5M 覆盖
        - 以应用为中心的分发，可能不适合偏好桌面优先工作流的买方
      - - LifeLock
        - Core 每年 $124.99；Advanced 每年 $199.99；Total 每年 $349.99
        - 更高计划网格中有双成人和家庭选项
        - 信用和账户告警、赔付、数据经纪商移除、诈骗赔付层级
