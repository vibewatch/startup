chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围与运营模式
        blocks:
          - type: paragraph
            body: >-
              Cloaked 由 Arjun Bhatnagar 和 Abhijay Bhatnagar 兄弟于 2020
              年创立，核心判断很简单，也很容易共鸣：使用互联网时，不该总要暴露真实身份。它的起源故事少见地个人化。Arjun
              称，这个想法来自他曾搭建的个人「databox」AI：它整合了他的消息、财务、健康数据和日常习惯，却随后展现出能替他行动的能力，让人不安。这次经历把泛泛的隐私焦虑变成了具体的产品使命。

              最初的产品是一个身份层：唯一的电话号码、邮箱地址、密码和其他账号标识符，让用户注册、购物或沟通时不用交出真实信息。随后，Cloaked 把这层狭窄的身份抽象扩成更宽的隐私套件，今天覆盖数据经纪商数据删除、暗网与
              SSN 监控、密码管理、VPN、AI 辅助来电筛查和身份盗窃保险。商业模式在消费者侧看起来以订阅为主，同时企业层也越来越可见，把同一套保护栈打包给员工使用。

              公开材料还显示，产品路线图仍在推进。Cloaked Pay 被公开描述为 beta 或即将推出的产品，隐私政策也确认它需要额外的 KYC 式金融数据。公司也在谈 AI
              驱动的个人代理，用来自动化隐私管理。合起来看，Cloaked 不太像单一功能工具，更像是在尝试成为家庭和工作场景默认的隐私操作层。
