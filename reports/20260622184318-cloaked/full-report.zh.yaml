      - number: '7.2'
        title: 融资、估值与披露不透明
        blocks:
          - type: paragraph
            body: >-
              Cloaked 2026 年 3 月的融资显然改善了资本状况，但也制造了新的尽调问题：标题金额很大，经济实质却难以靠公开证据承销。官方与独立报道都确认 $375 million 的标题金额，也确认 General
              Catalyst Customer Value Fund 参与；这意味着该轮明确是 Series B 股权与增长融资的组合，而不是普通的风险融资。TechCrunch 还称，Cloaked
              既未披露估值，也未披露股权与增长资本之间的拆分。这一点很重要，因为投资者无法推断稀释、清算优先权压力，也无法判断标题轮次在多大程度上是针对未来获客的融资，而不是干净的资产负债表资本。


              SEC 记录没有化解风险，反而让风险更清楚。2026 年 Form D 显示发行金额 $133.2 million，已售 $116.7 million，并有一笔大型 SAFE 转换，但这仍然无法和 $375
              million 的完整公告对齐。公开员工数同样嘈杂，TechCrunch 称接近 70 人，BBB 列为 50 人。同样，这些都不能推翻底层增长故事。但它确实意味着，Cloaked
              的资本成熟度跑在披露成熟度前面。对一家出售信任的企业，投资者应把估值不透明、KPI 漂移和融资可见度不完整视为真实承销风险，而不是表面报告问题。
