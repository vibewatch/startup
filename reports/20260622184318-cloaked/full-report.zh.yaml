  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 消费者收入模式、定价与变现场景
        blocks:
          - type: paragraph
            body: >-
              Cloaked 最清晰的变现场景，是面向个人、情侣和家庭层级出售的付费消费者订阅。官方方案页面显示，当前个人月付价格为 $12.49，个人年付为 $119.99，情侣方案月付 $19.99、年付
              $174.99，家庭方案最多四人、月付 $29.99。官方定价元数据还称方案起价为每月 $9.99，与仍显示更低年化入门价的第三方追踪器一致。订阅组合比简单别名或密码管理器 SKU
              更宽：当前公开界面把身份盗窃保险、数据删除、来电筛查、暗网和 SSN 监控、VPN
              以及其他隐私功能打包进同一个付费产品。这个宽度在财务上重要，因为它支撑了溢价定位；但也意味着成本栈里可能有第三方保险、电信、欺诈检测和数据删除义务，公开来源没有量化。公司也在通过企业合同、eSIM，以及未来的
              Cloaked Pay 或 AI 产品指向基础方案之外的未来变现，但公开证据仍停留在标价和功能宽度，而非合同经济性。
