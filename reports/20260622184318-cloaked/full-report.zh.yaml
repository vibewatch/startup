      - number: '7.3'
        title: 监管、隐私与法律边界风险
        blocks:
          - type: paragraph
            body: >-
              Cloaked 的监管暴露，比简单的消费者软件标签更宽。隐私政策称，公司可为监控服务收集 SSN，也可为 Cloaked Pay 收集 KYC 式金融数据。政策还点名 Plaid、PayPal、Stripe 和
              PureVPN 关联服务等处理方，并公开说明，当客户选择删除时，部分用户信息可能会披露给数据经纪网站。按服务模型看，这套架构可以理解，但也意味着公司的「隐私产品」本身就在多个交易对手之间处理和路由敏感数据。FTC
              隐私与安全指南、California CCPA，以及 GLBA 等金融 / 隐私制度，围绕披露、访问、删除和供应商控制形成了真实合规栈。


              Cloaked 并非无视这些问题。信任页和企业页宣传 SOC 2 Type 2、ISO 27001、ISO 27701 和 PCI 合规，网站还反复用明确的 FCRA
              免责声明限制产品范围。这些都是有意义的缓释。但法律文件也给产品承诺设了上限：Cloaked
              称删除不一定适用于所有网站，暗网监控无法找到一切，服务可由公司酌情变更或限制。这留下了残余风险：一旦承压，用户预期、营销文案和实际法律范围可能出现偏离。随着 Cloaked 增加 eSIM、支付、AI
              agents 和企业工作流，关键监管问题不是隐私市场是否重要；而是合规体系能否像功能面一样快地扩展。
