  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 立场
      - 论点
      - 什么会改变判断
    rows:
      - - 投资论点
        - 消费者隐私正在跑成真实付费品类：订阅用户超过 350,000，人群超过 400,000，且刚拿到 $375 million 的 headline 融资包。
        - 如果订阅用户质量、留存或实际 billings 明显弱于公开规模叙事，这条论点会很快变弱。
      - - 投资论点
        - Cloaked 的组合把预防和清理放进同一条流程：别名、数据移除、来电拦截、监控、保险和家庭套餐。
        - 如果产品宽度没有转化为比单点方案同业更好的留存或更高 ARPU，组合包溢价就应压缩。
      - - 投资论点
        - 更高价格的家庭档位加上企业交易，给简单个人套餐收入下限带来上行空间。
        - 如果企业业务规模很小、家庭渗透率偏低，收入下限就更接近保守公开区间，而不是牛市情景。
      - - 反论点
        - 公开记录没有披露投后估值、当前 ARR、流失率、毛利率或优先权条款，投资者还无法检验价格质量。
        - 直接披露这些变量，即使没有新一轮融资，也会显著提高信心。
      - - 反论点
        - 2026 年 Form D 只显示已售 $116.7 million，其中包括 $58.2 million 的 SAFE 转换，因此 $375 million 的 headline 不是公开文件里干净的价格发现事件。
        - 完整 term sheet 包或经审计的融资备忘录，可以对齐差口并降低不确定性。
      - - 反论点
        - 已审阅的公开可比公司大多按收入 2.6x 到 6.9x 交易，也就是说，任何独角兽式私募价格都需要比当前公开证据强得多的 ARR 和留存支撑。
        - 如果经验证 ARR 高于约 $70 million 到 $80 million，且留存和企业收入结构强劲，就可能支撑更高倍数区间。
    notes: 各行只聚焦与估值有关的论点，而不是宽泛的公司评分卡。
