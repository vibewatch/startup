        - 等下游欺诈发生，或手动搜索泄露报告
        - 暗网和 SSN 警报提示数据出现的位置，并推动用户冻结账户、重置凭据、调整 MFA
        - 敏感信息一旦在网上被发现，响应速度更快
        - 公开页面只描述 8 类受监测数据，因此整体监测广度不清楚
      - - 与家人或同事安全共享凭据或账户信息
        - 手动短信或邮件发送密码
        - 加密身份共享只在限定时间内开放选定字段
        - 降低不安全的密码共享，并把共享数据集限定在小范围
        - 公开文档没有把它描述为支持实时编辑权限的协作共享保险库
      - - 为员工部署隐私保护
        - 依赖员工自助，或购买彼此分散的单点工具
        - Cloaked Enterprise 加入批量注册、管理员监控和员工风险扫描
        - 把消费者隐私控制做成可部署的员工服务
        - 除公司新闻稿外，保留证据里独立采购证明有限
    notes: 可衡量收益按公开页面和评论中可见的工作流结果表述；没有换算成经审计的 ROI 指标。
