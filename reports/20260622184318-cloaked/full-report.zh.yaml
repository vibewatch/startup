  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 产品信任、支持负载与公开主张一致性
        blocks:
          - type: paragraph
            body: >-
              Cloaked 最直接的尽调风险，不是隐私问题是否存在；而是一款覆盖面很广、对信任高度敏感的产品，能否让客户体验跟上营销文案。公开投诉来源显示，品牌信任确实有缺口。Trustpilot 仍显示总体 4.2/5
              评分，但可见评论组合里，用户反复抱怨支持慢或难以联系、呼叫拦截误杀、退款，以及部分用户的自动骚扰电话没有可衡量下降。BBB 更直接：商业档案给出 B
              评级，已发布投诉记录显示退款争议、入门配置失败、验证码循环，以及 Call Guard 或身份生成问题让付费订阅者无法使用服务。JustUseApp 和 Google Play
              的置信度较低，但批评方向相近，集中在账号访问、移除慢和预期被误导。


              更重要的问题是，产品文案本身在不同公开界面上并不一致。公司运营页面分别声称可移除 400+、140+ 或 120+ 个数据经纪商。用户和呼叫筛查 KPI
              也会随渠道漂移。这些缺口都不能证明欺诈，但放在隐私产品里确实重要：买家明确把信任、准确性和技术可靠性交给公司。公司可以承受褒贬不一的评论；更难承受的是一种模式——支持、设置和效果主张在每个渠道都需要脚注。因此，产品信任风险既影响转化，也影响留存，尤其当
              Cloaked 想上探企业买家时，企业客户会比消费者应用买家更激进地尽调运营成熟度。
