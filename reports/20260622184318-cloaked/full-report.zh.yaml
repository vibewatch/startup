        blocks:
          - type: paragraph
            body: >-
              Cloaked 的客户地图从订阅驱动的消费者业务开始，但公司已经不再只面向泛泛的隐私爱好者营销。它的定价和文案现在把买家分成 Individual、Couple 和 Family
              层级，家庭包围绕儿童、配偶和共享数字风险定位。各层级的产品承诺一致：遮蔽真实电话号码和邮箱，删除暴露的经纪商数据，拦截诈骗或骚扰电话，并用身份盗窃保险为用户兜底。因此，真正的分层与其说是功能解锁，不如说是谁需要一起被保护，以及一个方案下要管理多少个身份。公开材料还显示第二个客群：想为员工提供员工隐私工具，并为
              HR 或安全团队提供管理可见性的雇主。换句话说，Cloaked 想用同一套核心隐私栈，同时销售 D2C 安心感和雇主赞助的数字安全。第三方定价追踪器也描述了免费试用入口，进一步说明注册摩擦被有意压低。
