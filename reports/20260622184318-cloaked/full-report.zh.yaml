        title: 情景区间与敏感性
        blocks:
          - type: paragraph
            body: >-
              由于 post-money 估值未披露，合适框架不是单点目标，而是一组锚定公开定价证据和公开可比区间的情景。公开证据下限从 350,000
              名付费客户和当前个人套餐价格开始。如果每位付费客户都使用年度个人套餐，消费者年化总账单约为 $42 million。如果每位付费客户都使用月度个人套餐，简单年化等值约为 $52.5
              million。现实可能更高，因为 Cloaked 还销售伴侣和家庭套餐，并称企业交易正在成交，但公司没有披露套餐组合或企业贡献。这让情景分布很宽。熊市情景下，已实现 ARR 或账单落在 $35 million
              至 $45 million 左右，市场容忍度维持在 5x 至 6.5x 附近，对应约 $180 million 至 $300 million。基准情景下，ARR 或账单升至 $50 million 至 $60
              million 区间，容忍度为 6x 至 10x，支撑约 $300 million 至 $600 million。牛市情景下，企业和更高 ARPU 套餐组合把 ARR 推向 $70 million 至 $80
              million，投资者支付 10x 至 15x，支撑约 $700 million 至 $1.2 billion。上限区间有可能成立，但它需要公开记录尚未提供的证据。
            claimRefs:
