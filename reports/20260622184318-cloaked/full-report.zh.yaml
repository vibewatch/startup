  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层 / 组件
      - 角色
      - 依赖
      - 风险
    rows:
      - - Chromium 扩展加仪表盘
        - 生成、自动填充、OTP 输入和活动查看的主要 Web 端界面
        - Chromium 浏览器兼容性、推送通知和扩展维护
        - 公开浏览器指引对 Chromium 最强，对其他浏览器较弱
      - - 身份代理层
        - 生成按站点隔离的邮箱、电话号码、用户名、密码，有时还包括支付身份
        - Cloaked 身份存储和映射逻辑
        - 这一层一旦故障，多项下游保护功能会一起降级
      - - 收件箱、转发和通话记录层
        - 接收 Cloaked 邮箱和号码的消息，并可选择转发到真实目的地
        - 路由基础设施和用户配置的转发
        - 配置错误可能暴露真实联系渠道，或增加支持负担
      - - Call Guard 筛选层
        - 接听陌生来电、分类、拦截垃圾电话，并带转写放行有效来电
        - AI 筛选质量，加上电话集成和 DNC 卫生
        - 误拦、漏拦或激活摩擦都会直接伤害信任
      - - 数据移除运营层
        - 扫描暴露、提交数据经纪商请求，并长期追踪状态
        - 数据经纪商响应度、公共记录来源和用户提交的核验信息
        - 覆盖率口径和完成时间在公开页面之间并不一致
      - - 监测和告警层
        - 扫描泄露和暗网渠道，并推送带响应步骤的警报
        - 覆盖泄露站点、论坛、Discord、Telegram 以及告警投递
        - 公开声称的 8 类数据范围，显示其可见度可能窄于一些更大的身份套件
      - - 支付和网络合作伙伴层
        - 支撑 Cloaked Pay 账户绑定和 CloakedVPN 传输
        - Plaid、PayPal、Stripe、PureVPN 和卡项目依赖
        - 关键产品体验依赖第三方，其政策和正常运行时间不在 Cloaked 直接控制之内
      - - 企业管理层
        - 把消费者栈扩展为面向员工群体的批量注册和管理员监督
        - CISO 或 HR 操作者采用，加上采购 / 分发渠道
        - 保留证据显示了管理后台主张，但 AWS Marketplace 包装或审计范围的独立证明有限
    notes: 本表严格停留在公开页面层面，不推断未公开的后端服务或内部基础设施。
