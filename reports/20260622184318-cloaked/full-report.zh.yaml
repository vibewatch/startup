  - id: TP004
    title: 信任、支持与支持触点对比
    columns:
      - 供应商
      - 支持触点
      - 移动 / 网页姿态
      - 信任信号
      - 补救姿态
    rows:
      - - Cloaked
        - 带监控和支持主张的消费者套件
        - 留存证据支持应用驱动体验；各触点是否完全同等，并未完整记录
        - 公司自撰对比页面声称 SOC 2 和端到端加密；不同页面指标数量互相冲突
        - 打包保险和监控，但公开补救细节比 Aura 或 LifeLock 更薄
      - - DeleteMe
        - 隐私专家加季度报告和客户支持
        - 留存证据偏网页仪表盘；移动端姿态在留存来源中记录不足
        - BBB A+ 评级主张，自 2011 年进入市场，评测覆盖广
        - 人工辅助删除流程是核心信任信号
      - - Incogni
        - 自动化仪表盘，定期重复请求，提供 24/7 支持
        - 留存证据偏网页 / 仪表盘；App 侧姿态未清晰留存
        - 竞争对比页称覆盖经 Deloitte 验证，编辑榜单也反复上榜
        - 自动化强；人工介入的补救深度看起来弱于 DeleteMe 或 Aura
      - - Aura
        - 24/7 支持，美国本土专家处理欺诈补救
        - 覆盖受保护设备，呈现宽口径消费者套件
        - 每位成人 $1M 保险、三大征信局信用监控，编辑榜单反复上榜
        - 直接隐私套件同业中，补救深度表述最明确
      - - IronVest
        - 浏览器扩展加移动 App 流程
        - 明确支持浏览器和移动端
        - 主打去中心化架构和生物识别；独立评测指出若干功能缺口
        - 反欺诈更偏预防，而不是数据经纪商删除补救
      - - PrivacyHawk
        - 高档套餐提供优先 24/7 支持
        - 留存定价证据中仅明确移动 App
        - 2M 用户、处理 30M+，App 商店式用户证言强，但独立榜单覆盖较轻
        - App 驱动的删除与身份保护流程
      - - LifeLock
        - 按套餐提供身份提醒、赔付和支持
        - 借 Norton 生态做家庭和设备导向包装，呈现大型套件
        - 赔付上限高，老牌品牌认知强
        - 反应式补救和监控深度强于预防式遮罩
      - - Apple Hide My Email
        - Apple 账户支持入口
        - 以 Apple 生态和设置为中心
        - Apple 中继架构和 iCloud+ 订阅场景
        - 补救很少；它是遮罩工具，不是响应流程
      - - Google Voice
        - Google 账户支持入口
        - 明确支持浏览器和移动端
        - Google 大众分发能力和垃圾信息过滤工具
        - 可作为通信替代品，但没有身份盗用补救层
