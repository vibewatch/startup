            body: >-
              Cloaked 的耐久性叙事，是公开证据最弱的一环。公司没有披露 NRR、GRR、流失率或 cohort 数据，投资者只能从代理指标推断粘性：应用商店评论量很大、Trustpilot
              评价细致、用户评论持续数月，以及多条公开评论讨论的是升级或持续使用，而不是一次性试用。这些正面信号被一条不小的投诉线抵消。Google Play 评论提到呼叫设置故障和垃圾来电仍在继续；JustUseApp
              汇总了围绕取消订阅、功能不可用和账号访问的负面报告；2026 年春季的 BBB 投诉则显示退款争议、设置失败、呼叫路由 bug，以及很难联系到人工支持。Cloaked
              往往会回应并处理退款，所以这不是一个被放弃的支持界面。但这种模式仍然重要，因为公司卖的是信任、身份连续性和家庭安全。支持摩擦和功能漂移在这里不是表面问题；它们直接带来流失和声誉风险。这个缺口尤其重要，因为企业证据仍集中在极少数具名样本上。
