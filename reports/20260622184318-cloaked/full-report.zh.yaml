  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              估值问题不是 Cloaked 是否有意思；而是公开记录是否足够强，能支撑投资者实际进入的价格。按这个标准，答案仍然是否定的。最强证据是正面的：Cloaked 公开披露了 350,000+ 订阅者、超过
              350,000 名付费客户、400,000+ 用户社群、当前标价、宽产品组合，以及 2026 年 3 月一笔标题金额 $375 million 的 Series B
              加增长融资包。这些事实支持一个判断：消费者隐私可以成为有意义的业务，而不是小众工具。但缺失变量正好落在估值轴线上。Cloaked 没有披露 post-money 估值，没有披露当前
              ARR，没有披露流失率，也没有披露毛利率或优先权条款。这意味着，同一组证据可以支撑好奇心，却不能支撑对进入价格的确信。因此建议是继续研究，不是因为公司缺乏潜力，而是因为当前公开记录还不能告诉投资者，最新一轮价格到底公平、偏紧，还是异常有吸引力。
