  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 目标用户
      - 定价锚点
      - 差异化
      - 局限
    rows:
      - - Cloaked
        - 一体化隐私套件
        - 想要预防加清理的消费者
        - 留存官方页面无法清晰提取公开定价
        - 别名、电话保护、移除、监控、保险、VPN、密码工具打包在一起
        - Cloaked 各页面披露的公开指标和覆盖数量并不完全一致
      - - DeleteMe
        - 直接数据移除服务
        - 想要人工协助移除的用户
        - 单人起价 $129/year
        - 真人隐私专家、季度隐私报告、家庭和企业打包
        - 预防性掩码、保险或偏信用的身份工具证据较少
      - - Incogni
        - 自动化数据移除服务
        - 想要广覆盖自动移除且价格敏感的用户
        - 标准个人计划按年付费为 $7.99/month
        - 覆盖 420+ 经纪商、周期性自动请求、入门价更低
        - 留存证据中没有原生电话 / 邮箱别名，打包身份附加功能也更少
      - - Aura
        - 广义身份保护套件
        - 想把信用、欺诈和隐私覆盖放在一起的家庭
        - 个人计划 $12/month 起，按年付费
        - 200+ 经纪商移除，加保险、信用监控、VPN、密码管理器和欺诈补救
        - 移除广度落后于覆盖数量最大的专业移除服务
      - - IronVest
        - 掩码和反欺诈工具
        - 优先考虑掩码身份和支付隐私的用户
        - 官方页面未直接留存公开定价
        - 匿名邮箱和电话号码、掩码卡、生物识别、浏览器加移动端支持
        - 并未定位为高广度经纪商移除服务中的领先者
      - - PrivacyHawk
        - 移动优先隐私套件
        - 想要应用驱动数据清理和身份支持的消费者
        - Premium 每年 $74.99；Platinum 每年 $124.99
        - 100+ 经纪商移除、数字足迹清理、Platinum $5M 覆盖、家庭计划
        - 相比 Incogni、DeleteMe 或 Aura，独立竞争覆盖更薄
      - - Norton LifeLock
        - 身份监控和补救套件
        - 优先考虑赔付和财务告警工作流的用户
        - Core 每年 $124.99；Advanced 每年 $199.99；Total 每年 $349.99
        - 信用和账户告警、赔付层级、自动数据经纪商移除
        - 留存证据显示，反应式身份保护强于预防性掩码
      - - Apple Hide My Email
        - 邮箱掩码点状替代品
        - 只需要邮箱别名的 Apple 用户
        - iCloud+ 中包含，$0.99/month 起
        - 低成本随机中继地址，绑定 Sign in with Apple 和 iCloud+
        - 没有经纪商移除、电话掩码、补救或保险层
      - - Google Voice
        - 电话掩码点状替代品
        - 主要想要第二电话号码的用户
        - 大多数美国 / 加拿大通话免费；部分通话 $0.01/minute
        - 浏览器和移动端共用第二号码，并带垃圾信息拦截
        - 没有经纪商移除、没有身份保险，且 Google 会处理通信数据
    notes: 各行覆盖留存的 2026 年公开证据中可见的主要直接、邻近和替代选项，而不是每一个小型隐私应用。
