      - number: '2.4'
        title: 增长驱动、采用约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              需求背景强且可衡量。FTC 报告、IC3 投诉量、ITRC 数据泄露跟踪、YouMail 骚扰电话数量和 Truecaller 垃圾电话数据都指向一个持续存在的数字安全问题，而非周期性潮流。ITRC 2025
              年报告还为 Cloaked
              定位搭了一座尤其相关的桥：数据暴露后，泄露受害者报告更多垃圾邮件、骚扰电话、钓鱼和账户接管尝试。这直接把数据泄露普遍性与数据删除、别名和诈骗拦截产品的需求连起来。分析师报告也反复讲同一个故事：更多线上交易、更多网络犯罪，以及企业对欺诈的担忧上升，是该品类的核心增长驱动。

              刹车同样重要。Fortune、TBRC 和 MarkWide
              都暗示，成本、免费替代品和运营复杂度仍限制采用。消费者可以不付订阅费就冻结信用。银行和征信机构免费提供部分价值主张。企业买家可以用培训、来电过滤、EDR 或手工 opt-out
              流程解决部分问题。公开市场数据本身也结构性嘈杂：同一个「identity protection」标签可能指信用监控、修复保险、家庭数字安全、高管隐私删除或员工保护。

              这会直接影响估值。Cloaked
              的上行空间，最好理解为在有记录的身份保护市场中赢下一块以预防为中心的份额，同时借家庭、福利和企业安全渠道扩大分发。下行风险不是需求虚构，而是买家教育、打包方式和预算归属仍未稳定。投资人因此应使用多个视角和分发假设承销该品类，而不是只看一个数据经纪商数字或一个泛化
              TAM 估计。
