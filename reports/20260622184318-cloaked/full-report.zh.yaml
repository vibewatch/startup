  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Cloaked
              不只是传统的信用监控或欺诈后修复供应商。它自己的消费者材料把产品定义为预防优先的栈：从数据经纪商网站删除数据、遮蔽邮箱和电话号码身份、拦截垃圾和诈骗电话、密码管理，以及身份盗窃保险。BusinessWire、TechCrunch
              和 PRWeb 用企业版本描述同一个组合，把员工暴露视作企业攻击面的一部分，而不只是个人财务问题。这让 Cloaked 落在身份盗窃保护市场内，但处在隐私、数据删除和数字安全工具正在汇合的边缘。

              因此，纳入的支出范围比整个隐私或网络安全版图窄，但比传统信用监控更宽。包括的类别有消费者身份保护订阅、家庭数字安全组合、雇主赞助的身份保护福利、员工和高管隐私删除服务，以及在欺诈发生前让真实标识符不再流通的预防工具。排除的支出包括通用端点安全、消费者
              VPN-only 订阅、企业 IAM 套件、没有身份或隐私功能的通用密码管理器、数据经纪商的广告技术支出，以及广义隐私合规咨询。

              现状替代品仍然强。消费者侧，替代方案包括免费信用冻结、征信机构或银行提供的免费信用监控、运营商垃圾电话过滤，以及对经纪商网站逐个
              opt-out。雇主侧，替代方案包括安全意识培训、EDR、钓鱼防护，以及不包含身份或隐私修复的福利组合。这个边界很重要，因为生态里最大的公开数字——数据经纪商市场——衡量的是个人数据被变现的问题，而不是买家目前花多少钱解决这个问题。
