  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 规模和资本可得性得分较好；在价格披露前，证据质量和下行保护得分较弱。
    data:
      items:
        - label: 规模证据
          value: 7
          max: 10
          note: 350K+ 订阅者或付费用户，加上 400K+ 用户
        - label: 定价能力
          value: 6
          max: 10
          note: 付费套餐可见，但付费意愿证据混杂
        - label: 资本可得性
          value: 8
          max: 10
          note: $375M 融资标题显示投资方有胃口
        - label: 证据质量
          value: 4
          max: 10
          note: 没有公开投后估值、ARR、流失率或利润率披露
        - label: 公开可比公司支撑
          value: 3
          max: 10
          note: 相邻公开市场倍数远低于独角兽式私募定价
        - label: 护城河 / 留存逻辑
          value: 6
          max: 10
          note: 集成捆绑有吸引力，但留存证据未公开
        - label: 下行保护
          value: 3
          max: 10
          note: 清算优先权结构和估值未知，可见安全边际很小
    claimRefs:
