      - number: '7.4'
        title: 竞争、渠道集中与合作伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              Cloaked 的品类叙事很有吸引力，但独立市场框架还没有站到它这边。多份 2026 年榜单把 Incogni、Optery、DeleteMe 和 Aura
              列为数据移除或一体化防护的参照点。Security.org 将 Incogni 排第一，State of Surveillance 则更看重 Optery 的覆盖广度和 DeleteMe 的历史记录；CNBC
              Select 的汇总同样以竞品品牌为中心。随后，独立评测和竞品评论从不同角度攻击 Cloaked：Aura 认为其套件相对完整身份保护产品功能偏薄，PCMag 称类似组合可通过 IronVest
              以更低价格获得，Cape 的评论则强调支持模式担忧。由此产生的风险不是 Cloaked 没有产品优势，而是独立买家仍可理性选择覆盖更广、价格更低、有人引导的服务，或在其他地方选择更强的信用监控。


              渠道和依赖风险让图景更深。公开企业证据集中在很窄的一组具名案例上，尤其是 Chicago Cubs 与 NFLPA 相关叙事。分发也明显依赖应用平台和合作伙伴：Apple 与 Google
              是关键消费者触点，而删除、支付、VPN 和身份工作流分别依靠外部交易对手。如果支持和运营能同步扩展，这可以管理。否则，一家试图把预防、清理、支付、AI 和企业打包出售的公司，可能同时被过多任务拉扯。
