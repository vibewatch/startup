            body: >-
              公开证据显示，Cloaked 想掌握整条个人暴露工作流，而不是一个狭窄隐私任务。留存的官方页面反复把生成身份、数据删除、暗网和 SSN 监控、Call Guard、保险、VPN、密码管理，以及仍然有限的
              Cloaked Pay 界面打包进一个会员。用客户语言说，Cloaked
              既想通过扫描和删除已经暴露的数据修复过去，也想让每一次新注册、来电和购买都使用一次性或分隔凭证，从而保护未来。最强证据集中在身份生成、浏览器自动填充和删除工作流。最弱证据在于部分新模块到底有多广泛可用，因为公开文案仍在经纪商数量、iPhone
              要求，以及 Cloaked Pay 究竟是仅限邀请、beta，还是事实上即将推出上互相冲突。产品是真实的，但每个宣传模块的成熟度并不一致。
