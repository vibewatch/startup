      - number: '4.5'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，可支撑的财务结论是：Cloaked
              已经从概念跨到已变现的消费者平台，但还没有跨到可承销透明度。定价公开。订阅者规模公开。应用商店使用、评论量和免费扫描量公开。融资能力公开，近期资本加上持续招聘也反驳了立即融资困难。这些都是实在的正面因素。阻塞项同样真实。没有留存公开来源披露已实现收入、ARR、企业占比、毛利率、CAC、回本期、流失、NRR、现金、月度烧钱、资金续航或债务。SEC
              记录解释了部分融资表面，但解释不了完整的 $375 million 头条数字。产品界面上经纪商删除数量不一致，也提醒投资人，即便商业 KPI
              也需要跨渠道对齐。纪律性的下一步不是反推出一个激进收入数字，而是索取底层账单、用户群组、毛利率和现金材料。在那之前，Cloaked 看起来可融资、商业上可信，但在收入质量或资本充足性上仍不能完全承销。
