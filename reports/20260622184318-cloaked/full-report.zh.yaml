      - number: '2.2'
        title: 规模测算视角：核心市场、邻近池与受约束的 SAM 代理
        blocks:
          - type: paragraph
            body: >-
              一句式 TAM 会夸大公开证据真正支撑的范围。最干净的核心市场视角是身份盗窃保护服务。The Business Research Company 估计该市场 2026 年为 USD 16.26
              billion，Fortune Business Insights 估计 2026 年为 USD 19.45 billion；IMARC 用更小基数，称 2025 年为 USD 12.3
              billion，2026–2034 年 CAGR 为 8.97%。Javelin 随后把视角切到美国，认为美国市场有望在 2027 年达到 USD 18 billion，且 D2C
              销售仍占主导，虽然份额正在下降。MarkWide 将美国市场放在 2026 年 USD 13.8 billion。这些数字不能直接互换，但一致显示出一个数十亿美元级、以高个位数到低双位数速度增长的品类。

              邻近池要大得多。Mordor Intelligence 估计数据经纪商市场 2026 年为 USD 315.66 billion，其中消费者数据占 2025 年组合的 46.03%。这是 Cloaked
              价值主张背后的上游变现引擎：如果数据经纪商创造了滋养垃圾信息、钓鱼和身份盗窃的库存，隐私删除和别名产品就在攻击问题源头。但 USD 315.66 billion 不是 Cloaked 的
              TAM；它是受益于个人数据暴露的生态规模。

              对 Cloaked 来说，最站得住脚的公开 SAM 代理，是一个受约束的子集：北美和美国身份保护支出，加上 Javelin、Allstate、DeleteMe、Optery 和 Incogni
              记录的正在出现的雇主福利与企业员工保护动作。公开来源没有单独切出一个干净收入池，用来对应别名 + 数据删除 + 垃圾拦截 + 员工数字风险保护。正确结论因此不是泛泛的「巨大市场」说法，而是 Cloaked
              正进入一个真实核心品类，且有多条邻近扩张路径，但没有单一公开来源能干净定义整个组合。
