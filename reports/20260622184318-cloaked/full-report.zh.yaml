        title: 融资表面与价格发现缺口
        blocks:
          - type: paragraph
            body: >-
              Cloaked 的融资记录既亮眼，也不完整。公司和新闻稿都披露，2026 年 3 月完成 $375 million 的 Series B
              融资和增长融资包。这个标题金额重要：它表明公司能强力获得资本，也表明知名支持者愿意资助下一阶段扩张。但 SEC 申报记录并没有把标题金额转化为干净的估值标记。2026 年 3 月 Form D 显示总发行金额
              $133.2 million，已售 $116.7 million，其中约 $58.2 million 的已售金额来自 SAFE 转换为 Series B 优先股。换句话说，公开可见的已售证券远低于 $375
              million 标题金额，其中一部分可见金额在转换时也不是新现金。2022 年 Series A 呈现同样的部分可见模式：公告 $25 million，申报发行 $25.05 million，Form D 中约
              $20.0 million 已售。实际结论不是管理层虚报了轮次。实际结论是，公开申报轨迹没有揭示完整的 2026 年融资栈或 post-money 价格，因此投资者不应把标题融资本身当作当前估值有吸引力的证据。
