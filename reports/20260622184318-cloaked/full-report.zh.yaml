  - id: TV004
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 关键假设
      - 隐含估值区间（USDm）
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - 企业业务开始重要，家庭套餐结构抬升 ARPU，实际 ARR 达到约 $70M-$80M，投资者愿意为快速增长的隐私平台支付 10x-15x。
        - 700-1,200
        - 需要证明企业业务、留存和定价权远强于公开下限所暗示的水平。
        - 当前公开记录显示有可能，但证据偏轻
      - - 基准
        - 消费者核心业务真实存在，实际 ARR 或 billings 落在约 $50M-$60M，私募市场对可信但非顶级增长的容忍度在 6x-10x 左右。
        - 300-600
        - 套餐结构或流失率不及预期，只留下区间低端。
        - 当前证据最能支撑
      - - 熊市
        - 实际 ARR 或 billings 只有约 $35M-$45M，折扣和支持成本压低质量，可比倍数容忍度收缩到 5x-6.5x。
        - 180-300
        - 该轮定价靠的是叙事动能，而不是持久收入质量。
        - 如果经济性弱于订阅用户数暗示，下行空间明显
    notes: 区间是基于公开订阅用户、定价和可比公司证据构建的示意情景输出；不是管理层指引，也不是披露的公允价值。
    claimRefs:
      - CV048
      - CV049
      - CV050
