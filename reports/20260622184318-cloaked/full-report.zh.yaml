      - number: '1.3'
        title: 融资历史、投资人与阶段
        blocks:
          - type: paragraph
            body: >-
              Cloaked 现在显然已是后期私营公司。2026 年 3 月 19 日，公司宣布获得 $375 million Series B 与增长融资，由 General Catalyst 和 Liberty City
              Ventures 领投，Lux Capital、Human Capital、Marquee Ventures、Fifth Growth Fund、NFL Players Association、LG
              Technology Ventures、Assurant Ventures、DuckDuckGo 等参投。多个来源称，General Catalyst 的 Customer Value Fund
              提供了增长融资部分；这一点很重要，因为它说明该轮不是一笔干净的股权融资。

              公司没有披露的内容同样关键。TechCrunch 和 TechFundingNews 均称，Cloaked
              未披露投后估值，也未披露股权与增长资本之间的准确拆分。这个缺口应被视为真实证据缺口，而不是用第三方猜测补上。独立资料站点猜测企业价值在低十亿美元区间，但这些标记没有公司确认，不应被当作标准估值。

              更早的融资历史更清楚。Cloaked 2022 年 3 月 Series A 为 $25 million，由 Lux Capital 和 Human Capital 共同领投。由于该公告称截至当时总融资额为
              $29 million，Series A 前的隐含种子资本约为 $4 million，与第三方数据库摘要一致。此后，股东结构演化为一个少见的宽联盟，覆盖传统 VC、DuckDuckGo
              等战略隐私玩家、企业投资人和 NFLPA；NFLPA 也可能成为面向高风险职业运动员群体的分发渠道。
