  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 展示 Cloaked 如何从单用户隐私痛点，推进到家庭保护，再进入雇主赞助部署。
    data:
      nodes:
        - label: 1. 风险发现
          detail: 用户通过免费扫描、垃圾信息压力或数据经纪商暴露担忧进入。
          tone: neutral
        - label: 2. 身份设置
          detail: 用户为注册、购物、消息和账户创建生成别名。
          tone: positive
        - label: 3. 主动保护
          detail: 数据移除、来电筛查、暗网警报和保险成为持续价值界面。
          tone: positive
        - label: 4. 家庭扩展
          detail: 当配偶或子女面对相同隐私威胁时，个人方案可扩展为 Couple 或 Family。
          tone: positive
        - label: 5. 支持 / 修复
          detail: 设置、退款或身份恢复事件发生时，聊天、邮件或电话支持变得关键。
          tone: risk
        - label: 6. 雇主赞助
          detail: HR 或安全团队可以为员工群体购买同一套保护栈。
          tone: positive
    approximationNotes: 阶段来自公开产品流程和定价表面推断，而不是内部漏斗分析。
    claimRefs:
      - CU001
      - CU005
      - CU007
      - CU008
      - CU009
      - CU010
      - CU030
      - CU046
  - id: FU002
    title: 采用 / 部署流程
    type: flow
    layout: wide
    summary: 将公司自称的规模指标、独立验证面和企业部署证据拆开看。
    data:
      nodes:
        - id: n1
          label: 4M+ 次免费扫描
          detail: 公司在 2026 年 3 月给出的漏斗顶端口径。
          tone: neutral
        - id: n2
          label: 400K+ 社区用户
          detail: 关于页面给出的更宽口径社区指标。
          tone: neutral
        - id: n3
          label: 350K+ 付费订阅者
          detail: 更直接指向变现的公司指标。
          tone: positive
        - id: n4
          label: 独立消费者证据
          detail: 6.5K 条 iOS 评分、5.34K 条 Play 评论、100K+ 次安装、360 条 Trustpilot 评论。
          tone: positive
        - id: n5
          label: 企业部署层
          detail: 公司声称覆盖数千名员工，但具名客户只有一个，另有一个大型渠道潜在客户。
          tone: risk
      edges:
        - from_: n1
          to: n2
          label: 公司自称的受众积累
        - from_: n2
          to: n3
          label: 公司自称的变现
        - from_: n3
          to: n4
          label: 独立证据校验
        - from_: n4
          to: n5
          label: 消费者基础复用于 B2B 叙事
    approximationNotes: 公开指标的分母不同，所以这张图只表示方向关系，不是可量化的转化漏斗。
    claimRefs:
      - CU011
      - CU012
      - CU013
      - CU019
      - CU020
      - CU022
      - CU031
      - CU045
      - CU047
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 比较直接消费者、家庭套餐和企业案例各自的公开证据强度。
    data:
      columns:
        - 独立性
        - 证据质量
        - 生产成熟度
        - 结果具体度
        - 留存可见度
      rows:
        - label: 个人用户（应用商店）
          values:
            - 独立平台
            - 评论量高
            - 已上线生产环境
            - 中：评分 + 评论文本
            - 低：无 cohort 数据
        - label: 伴侣 / 家庭住户
