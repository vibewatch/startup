      - number: '4.2'
        title: 增长代理指标与公开收入边界
        blocks:
          - type: paragraph
            body: >-
              对一家私营消费者安全公司来说，Cloaked 的公开增长信号异常强，但仍无法落成一个干净 ARR 数字。创始人帖子称 Cloaked 拥有 350,000+ 订阅者，TechCrunch 独立报道付费客户超过
              350,000，去年增长 10x。about 页面称公司社区超过 400,000 名用户，主页称 4 million 名美国人使用过其免费扫描。合起来看，这些数字暗示一条漏斗：可能从免费暴露扫描开始，一部分转化为
              app 安装，再有一部分转化为付费订阅。应用商店界面也强化了这不是纸面用户基础：Apple 列表显示 6.5K 个评分、评分 4.5；Google Play 显示评分 4.1、5.34K 条评论和 100K+
              下载。即便如此，公开财务建模仍受约束。按当前官方最便宜的个人年付价格，350,000 名付费订阅者只意味着约 $42 million 年化消费者标价总额下限；按当前最低个人月付价格，同一订阅者基础意味着约
              $52.5 million 年化。这些是有用的边界条件，不是收入披露，因为方案组合、折扣、试用、流失、退款、企业收入和收款时点都未披露。
