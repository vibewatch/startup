      - number: '1.2'
        title: 领导层、治理与公司足迹
        blocks:
          - type: paragraph
            body: >-
              领导层仍以创始人为中心。Arjun Bhatnagar 是面向公众的 CEO，Abhijay Bhatnagar 是 CTO，并在部分公开简介中担任首席 AI 官。他们此前在 Hey! HeadsUp
              的合作支撑了连续创业者叙事，创始故事也让他们在消费者隐私和身份工具领域具备清晰的 founder-market fit。

              但公开可见的治理信息仍然偏薄。所审阅材料中最清楚的董事会数据点，是 Lux Capital 合伙人 Bilal Zuberi 在 2022 年 3 月 Series A
              同步加入董事会。这意味着外部投资人监督存在，但还不足以拼出一张完全透明的董事会图景。

              Cloaked 似乎已经搭起更宽的高管梯队。其 about 页面列出 Chief Experience Officer、General Counsel/CCO、CISO、VP of Finance、VP of
              Customer Success 以及多名职能负责人，Craft 则点名 Michael Abbate 为 Chief Experience Officer。这表明公司不再只靠两位创始人运转，即便依赖度仍然很高。

              更实质的尽调问题是公司足迹不清。2024 年和 2026 年的公司新闻稿称 Cloaked 总部在 New York City，Craft 和 Tracxn 则列出 Lowell, Massachusetts
              地址，Tracxn 还指向一个仍活跃的美国法律实体 CLOAKED, INC. TechCrunch 2022 年报道称公司位于 Boston。最稳妥的解读是，Cloaked 有 Massachusetts
              法律足迹，后来把 New York City 作为运营基地身份；但两者的准确拆分，公开来源尚未完整说明。
