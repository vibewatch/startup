      - number: '8.3'
        title: 牵引力边界与可比公司引力
        blocks:
          - type: paragraph
            body: >-
              公开运营证据足以确认真实变现面，但不足以打出干净的后期倍数。Cloaked 当前套餐页显示个人、伴侣和家庭价格点，官方与独立报道也支持付费订阅基数超过 350,000。这两个事实让投资者即使没有直接 ARR
              披露，也能为消费者经常性收入勾勒上下界。与此同时，公开可比公司的引力低于名义独角兽估值所需水平。Gen Digital 是最接近的规模化消费者网络安全组合，按 2026 年 6 月市值和 FY2026 收入，约以
              2.7x 收入交易。Experian 和 TransUnion 都与消费者身份保护及信用相关监控有关，交易倍数分别约为 3.9x 和 2.6x。Okta 与消费者相关性较弱，但作为公开身份软件平台估值更高，接近
              6.9x。1Password 2022 年 $6.8 billion
              估值提供了一个历史私人溢价锚点，但那个标记属于不同产品组合、不同融资窗口，以及更清晰建立的软件品类。因此可比公司的教训是纪律性的，而不是绝对的：只有当已实现
              ARR、企业占比和留存显著高于保守公开下限，并且远好于市场当前所见，Cloaked 才可能配得上溢价。
