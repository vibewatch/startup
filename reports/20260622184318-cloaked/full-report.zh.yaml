      - number: '1.4'
        title: 规模信号、里程碑与负面证据
        blocks:
          - type: paragraph
            body: >-
              公开增长信号有意义，但需要谨慎解读。TechCrunch 报道 2026 年 3 月付费客户超过 350,000、增长 10x；Cloaked 的 about 页面随后称公司拥有超过 400,000
              人的社区。这些数字指向同一方向，但不是同一个 KPI。公司还声称已保护超过 10 million 个身份，3 月从数据经纪商网站删除超过 1 billion 条记录，主页现在称超过 1.7
              billion。来电筛查数量在不同来源中也从超过 40 million 增至 50 million，再到 60 million-plus；这说明增长真实存在，也提醒我们这些是公司发布的运营指标，而非经审计披露。

              里程碑顺序是连贯的。Cloaked 称其于 2023 年 10 月退出 beta，2025 年推出 AI 驱动来电筛查，并于 2025 年末进入企业市场。PRWeb
              的企业发布稿称，该产品已在保护数千名员工，并点名 Chicago Cubs 为客户；Forbes 补充称，NFL Players Inc.
              投资时也考虑将服务推向现役和退役球员。企业推进看起来因此不像抽象邻近业务，更像围绕高风险人群的早期 go-to-market 楔子。

              主要负面证据并非生死攸关，但确实存在。存档 Trustpilot 评论显示总体评分 4.2 / 5，算是体面，但仍包含退款、支持缓慢和骚扰电话持续存在的投诉。Aura 和 Cape 都认为 Cloaked
              功能丰富但不均衡：2026 年期间定价似乎变动过，部分保护能力落后于最佳竞品，支持质量也不稳定。换句话说，Cloaked 看起来已有商业分量，但运营仍不成熟，尽调中应直接测试这些问题。
