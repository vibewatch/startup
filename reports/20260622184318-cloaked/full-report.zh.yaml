      - number: '3.4'
        title: 护城河耐久性：差异化真实存在，但执行风险也不小
        blocks:
          - type: paragraph
            body: >-
              Cloaked 的护城河只有在一种具体形态下才可信：一个消费者组合，在一个工作流里同时提供主动遮蔽、被动删除和身份支持。相对优化清理的 Incogni、DeleteMe，以及只解决预防问题片段的 Apple 或
              Google，这个组合确实有差异化。留存逻辑也直观：一旦用户把账号分隔到别名背后，并把别名与来电筛查和监控连接起来，日常把产品当作隐私层使用，离开就意味着重建习惯，而不只是取消一份报告服务。

              但公开证据也显示，护城河不应被夸大。Cloaked 自己的营销界面没有给出一个稳定的当前经纪商覆盖或使用规模数字，这削弱了对品类领先精确性的信心。Incogni 在原始删除覆盖和价格上看起来更好，DeleteMe
              在人工辅助删除上保有强信任位置，Aura 或 LifeLock 在信用导向修复上更成熟。同时，Apple Hide My Email、Google Voice 和 IronVest
              等更便宜的替代品，会侵蚀用户为组合中预防部分付费的意愿。可能的结论不是 Cloaked 没有护城河，而是其护城河取决于执行质量、产品清晰度，以及证明更好的消费者结果，而不只是宣传一个订阅里功能更多。
