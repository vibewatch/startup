      - number: '4.4'
        title: 成本结构、利润率路径与负面用户价值信号
        blocks:
          - type: paragraph
            body: >-
              公开来源可以勾勒成本驱动，但无法量化。Cloaked 卖的不是单一轻量软件席位。组合包括经纪商删除、身份盗窃保障、垃圾和骚扰电话筛查、暗网监控、VPN 和隐私身份，Google Play 还描述了一个 eSIM
              附加项。每个组件都可能带来外部服务交付成本：保险承保、电信或 eSIM
              关系、支持人力、欺诈工具和持续数据删除运营。这并不否定有吸引力的毛利率模型，但让纯密码管理器式利润率假设不现实。独立评测也显示定价能力和支持经济性承压。PCMag 给了高评分，但仍称产品相对昂贵。Aura 认为
              Cloaked 在部分功能深度上不及最佳替代品，JustUseApp 收集到显著负面的综合情绪，投诉集中在定价、账户访问和支持。即使 Trustpilot
              的总体正面快照，也提到用户体验和支持摩擦。这些来源不能证明流失，但确实表明，已实现留存和服务成本值得审查，而不能被假定不存在。
