            - 中
            - 已上线生产环境
            - 低到中：价格与零散使用案例
            - 低
        - label: Chicago Cubs 员工
          values:
            - 官方 + Forbes 交叉核验
            - 存在性高，经济性低
            - 公司称已上线部署
            - 中：具名引述
            - 低
        - label: NFL Players Inc. 渠道
          values:
            - 独立媒体引述
            - 中
            - 意向 / 渠道，部署尚未充分证明
            - 低：只显示触达野心
            - 低
        - label: 未具名企业行业
          values:
            - 仅官方 PR
            - 低到中
            - 公司称已上线部署
            - 低：无具名案例
            - 低
    approximationNotes: 各行评估的是证据质量，不是客户价值；只要没有公开续约或 cohort 数据，「留存可见度」就维持低位。
