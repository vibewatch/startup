  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: cloaked-metrics-consistency
    missingEvidence: A dated company KPI sheet that reconciles Cloaked’s current broker count, accounts masked, calls screened, and records removed across all public pages.
    whyItMatters: Conflicting public scale metrics weaken confidence in precise category-leadership claims and make comparative underwriting harder.
    diligencePath: Request the latest investor or management KPI sheet and ask Cloaked to timestamp and reconcile the consumer metrics used on each public landing page.
    relatedQuestionRefs:
    - QP018
  - type: private-evidence-only
    severity: material
    topic: removal-effectiveness
    missingEvidence: Apples-to-apples data on removal success rates, re-listing rates, opt-out cycle time, and cohort retention across Cloaked, DeleteMe, Incogni, Aura, and PrivacyHawk.
    whyItMatters: The biggest underwriting question is whether bundle convenience translates into materially better consumer outcomes than best-of-breed removal tools.
    diligencePath: Ask each vendor for recent cohort-level removal KPIs, re-listing frequencies, and net retention by plan tier, then normalize the cohorts for comparison.
    relatedQuestionRefs:
    - QP020
  - type: missing-source
    severity: minor
    topic: mobile-feature-parity
    missingEvidence: A current feature-by-surface matrix showing what DeleteMe, Incogni, and Cloaked support on iOS, Android, desktop web, and browser extensions.
    whyItMatters: Support-surface differences affect everyday usability and retention, but retained public evidence is stronger for some vendors than others.
    diligencePath: Pull current app-store listings, help-center matrices, and product-release notes for each vendor and normalize them into one channel-support table.
    relatedQuestionRefs:
    - QP021
  - type: private-evidence-only
    severity: material
    topic: regulated-buyer-trust
    missingEvidence: Current compliance artifacts, fraud-remediation SLAs, and proof of alias acceptance for banks or regulated-service workflows across Cloaked and key rivals.
    whyItMatters: Trust-sensitive use cases can drive premium willingness to pay, but public marketing alone does not prove operational superiority.
    diligencePath: Request SOC 2 summaries, incident-response playbooks, support SLAs, and bank-acceptance or verification-success data from management and major competitors where available.
    relatedQuestionRefs:
    - QP017
    - QP025
    relatedTableRefs:
    - TP005
