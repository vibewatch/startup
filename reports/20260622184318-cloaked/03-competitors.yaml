- id: TP004
  title: Trust, support, and support-surface comparison
  columns:
  - vendor
  - support surface
  - mobile / web posture
  - trust signals
  - remediation posture
  rows:
  - - Cloaked
    - Consumer suite with monitoring and support claims
    - Retained evidence supports app-led experience; complete parity by surface is not fully documented
    - SOC 2 and end-to-end encryption claims on company-authored comparison page; conflicting metric counts across pages
    - Bundled insurance and monitoring, but public remediation detail is thinner than Aura or LifeLock
  - - DeleteMe
    - Privacy experts plus quarterly reports and customer support
    - Retained evidence is web-dashboard oriented; mobile posture not well documented in retained sources
    - A+ BBB claim, in market since 2011, extensive review coverage
    - Human-assisted removal workflow is a core trust signal
  - - Incogni
    - Automated dashboard with periodic re-requests and 24/7 support
    - Retained evidence is web/dashboard oriented; app posture not clearly retained
    - Deloitte-verified coverage claim via competitor comparison page and repeated editor rankings
    - Automation is strong; hands-on remediation depth appears lighter than DeleteMe or Aura
  - - Aura
    - 24/7 support and US-based expert fraud remediation
    - Broad consumer-suite posture across protected devices
    - $1M-per-adult insurance, three-bureau credit monitoring, repeated editor rankings
    - Most explicit remediation depth among the direct privacy-bundle peers
  - - IronVest
    - Browser extension plus mobile app workflow
    - Explicit browser plus mobile support
    - Decentralized architecture and biometrics story; independent review flags some feature gaps
    - Prevention-heavy anti-fraud posture rather than broker-removal remediation
  - - PrivacyHawk
    - Priority 24/7 support on higher tier
    - Explicitly mobile app only in retained pricing evidence
    - 2M users, 30M+ processed, strong app-store style testimonials, but lighter independent ranking coverage
    - App-led removal and identity-protection workflow
  - - LifeLock
    - Plan-based identity alerts, reimbursement, and support
    - Large suite posture with family and device-oriented packaging via Norton ecosystem
    - High reimbursement ceilings and major incumbent brand recognition
    - Reactive remediation and monitoring depth are stronger than preventive masking
  - - Apple Hide My Email
    - Apple-account support surface
    - Apple ecosystem and settings centric
    - Apple relay architecture and iCloud+ subscription context
    - Minimal remediation; this is a masking utility rather than a response workflow
  - - Google Voice
    - Google-account support surface
    - Explicit browser plus mobile support
    - Mass-market Google distribution and spam-filtering utility
    - Useful communications substitute but no identity-theft remediation layer
