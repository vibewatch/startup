company:
  name: Cloaked
chapter:
  number: 3
  title: Competitors
  summary: 'Cloaked is differentiated by bundling proactive identity masking with reactive data removal, spam/scam blocking,

    and identity support, but the public evidence does not support a clean category lead. Incogni and DeleteMe look

    stronger on pure removal breadth or manual thoroughness, while Aura and Norton LifeLock look stronger on credit-

    and remediation-heavy identity protection.'
sections:
- id: landscape
  title: 'Landscape: direct removers, identity suites, masking tools, and point substitutes'
  body: 'Cloaked does not compete inside a single neat category. The most direct alternatives are DeleteMe and Incogni,

    both of which sell data-broker and people-search removal as the core job. Aura, Norton LifeLock, and

    PrivacyHawk solve a wider consumer-protection problem by combining removal with insurance, credit or fraud

    monitoring, remediation workflows, and family packaging. IronVest overlaps more narrowly on identity masking,

    phone or payment obfuscation, and anti-fraud controls, while Apple Hide My Email and Google Voice undercut a

    portion of the problem with low-cost email or phone masking rather than full privacy orchestration.


    That matters because the buyer’s comparison set changes with the pain point. If the buyer wants maximum broker

    coverage at the lowest price, Incogni and DeleteMe are the most relevant benchmarks. If the buyer wants a broad

    identity-protection bundle, Aura and LifeLock become harder to ignore. If the buyer mainly wants to stop giving

    out a real email address or phone number, Apple, Google, and IronVest can satisfy a subset of the job without

    paying for a full suite. Cloaked’s real competitive task is therefore to prove that prevention plus cleanup is a

    meaningfully better consumer outcome than buying best-of-breed removals or several cheaper point tools.'
  claimRefs:
