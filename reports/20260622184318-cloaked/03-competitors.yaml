- id: TP005
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - implication
  rows:
  - - Cloaked prevents new leakage instead of only cleaning up old leakage
    - Apple, Google, and IronVest can satisfy slices of the prevention use case at lower cost
    - medium
    - Prevention is differentiated, but not every consumer needs the full bundle
  - - Cloaked offers enough removal breadth inside one app
    - Incogni and DeleteMe publish stronger raw removal-breadth narratives
    - high
    - Coverage-focused shoppers can still defect to best-of-breed removers
  - - Cloaked’s monitoring and insurance make it a complete identity-protection suite
    - Aura, LifeLock, and PrivacyHawk expose deeper reimbursement or credit-oriented remediation tiers
    - high
    - Identity-protection buyers may prefer established remediation brands
  - - One subscription creates retention through convenience
    - If public metrics and packaging are inconsistent, buyers may doubt category leadership and compare feature-by-feature
    - medium
    - Bundle convenience helps only if product messaging stays precise and credible
  - - Phone and email aliases are hard to replicate well
    - Google Voice, Apple relay aliases, and IronVest provide substitute masking tools
    - medium
    - Alias value may compress if substitutes feel good enough for mainstream users
  - - Cloaked can expand from consumer privacy into broader trust-sensitive segments
    - Public evidence on enterprise compliance artifacts and realized outcomes remains thin
    - medium
    - The moat depends on execution proof, not just breadth of feature claims
  notes: The register isolates the competitive questions most likely to affect willingness to pay and retention, not every tactical feature race.
