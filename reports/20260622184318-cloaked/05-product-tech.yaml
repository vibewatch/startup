- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Chromium extension plus dashboard
    - Primary on-web interface for generation, autofill, OTP entry, and activity review
    - Chromium browser compatibility, push notifications, and extension maintenance
    - Public browser guidance is strongest for Chromium and weaker elsewhere
  - - Identity proxy layer
    - Generates per-site emails, phone numbers, usernames, passwords, and sometimes payment identities
    - Cloaked identity store and mapping logic
    - If this layer fails, multiple downstream protective features degrade together
  - - Inbox, forwarding, and call-log layer
    - Receives messages for cloaked emails and numbers and optionally forwards to real destinations
    - Routing infrastructure and user-configured forwarding
    - Misconfiguration can expose real contact channels or increase support load
  - - Call Guard screening layer
    - Answers unknown callers, classifies them, blocks spam, and passes valid calls with transcripts
    - AI screening quality plus telephony integrations and DNC hygiene
    - False positives, false negatives, or activation friction directly affect trust
  - - Data-removal operations layer
    - Scans exposure, submits broker requests, and tracks status over time
    - Broker responsiveness, public-record sources, and user-supplied verification
    - Coverage math and completion timing are not consistently presented across public surfaces
  - - Monitoring and alerting layer
    - Scans breach and dark-web channels and delivers push alerts with response steps
    - Coverage across breach sites, forums, Discord, Telegram, and alert delivery
    - The publicly stated eight-data-type scope suggests narrower visibility than some larger identity suites
  - - Payment and network partner layer
    - Supports Cloaked Pay account linking and CloakedVPN transport
    - Plaid, PayPal, Stripe, PureVPN, and card-program dependencies
    - Key product experiences depend on third parties whose policies and uptime sit outside Cloaked’s direct control
  - - Enterprise admin layer
    - Extends the consumer stack with bulk enrollment and admin oversight for employee populations
    - CISO or HR operator adoption plus procurement/distribution channels
    - The retained evidence shows admin claims but limited independent proof of AWS Marketplace packaging or audit scope
  notes: This table stays strictly at the public-surface layer and avoids inferring unpublished backend services or internal infrastructure.
