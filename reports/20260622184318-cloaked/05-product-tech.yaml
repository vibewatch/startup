tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Cloaked identities and alias inboxes
    - Consumers and households
    - Commercial core workflow
    - Per-site generated email, phone, username, and forwarding controls keep real identity off third-party forms
    - Browser support is most explicit for Chromium, and some platform requirements disagree across public pages
  - - Data removal and exposure scan
    - Consumers and enterprise employees
    - Commercial core workflow
    - Combines free scan, broker-by-broker removal requests, and dashboard progress tracking
    - Current public copy disagrees on whether coverage is 120+, 140+, or 400+ brokers and does not publish a broker list
  - - Call Guard
    - Phone-heavy users
    - Commercial but support-sensitive
    - AI screens unknown callers, blocks spam silently, and can preserve legitimate-call transcripts
    - Trustpilot complaints show activation and false-negative friction still appear in the field
  - - Dark Web & SSN Monitoring
    - Subscribers with breach or fraud concerns
    - Commercial feature with response workflow
    - 24/7 monitoring spans dark-web forums, marketplaces, Discord, Telegram, and breach sites with instant alerts
    - Only eight data types are publicly described, leaving monitoring breadth narrower than some larger suites
  - - Password manager, TOTP, and secure sharing
    - Web and mobile account owners plus families
    - Commercial core with active maintenance
    - Imports, autofill, one-time passcodes, and encrypted selective sharing all tie back to the same identity model
    - PCMag says Cloaked-account MFA still relies on email or SMS rather than an authenticator app
  - - Cloaked Pay
    - Online shoppers
    - Invite-only or beta surface, not broad GA
    - Virtual Mastercard numbers can be merchant-locked and budget-limited while hiding real card details
    - GA timing, card-program scope, and public compliance artifacts remain thin
  - - VPN and eSIM layer
    - Mobile and travel-oriented users
    - VPN still beta; eSIM add-on marketed
    - One-tap encrypted VPN and carrier-grade eSIM push Cloaked beyond email-only masking
    - VPN depends on PureVPN and public support language still emphasizes mobile more than desktop
  - - Enterprise layer
    - CISOs, HR admins, and employee populations
    - Launched but early-public-evidence stage
    - Adds admin dashboard, bulk enrollment, and workforce attack-surface reduction to the consumer stack
    - Independent proof for AWS Marketplace distribution and certification scope is still limited in the retained pack
  notes: Rows separate consumer core modules from still-maturing add-ons and enterprise packaging; maturity labels reflect only public evidence, not internal launch states.
