- id: trust-security-and-enterprise-controls
  title: Trust posture is partly documented in policy and release notes, but enterprise assurance still leans heavily on company-authored claims
  body: Cloaked does publish enough policy and changelog detail to support some bounded technical claims. The privacy policy states that passwords are stored salted and hashed or encrypted, names a Data Protection Officer, and makes explicit that CloakedVPN depends on PureVPN while Cloaked Pay and linked financial workflows can involve Plaid, PayPal, and Stripe. The trust FAQ adds one meaningful minimization detail by saying the free exposure scan does not store the submitted phone number. Release notes also show security work over time, including zero-knowledge inbox encryption upgrades, email API hardening, and DNC registration for Cloaked numbers. What the retained evidence does not do is independently verify the enterprise-assurance claims that appear in the PRWeb launch. ISO 27001, ISO 27701, PCI, and SOC 2 Type II are all plausible and important if true, but in this pack they remain company-authored statements rather than separately retained certificates or trust-center documents.
    The result is a trust posture that is directionally credible but still under-documented for enterprise underwriting.
