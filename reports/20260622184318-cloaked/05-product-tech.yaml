  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: broker-coverage
    missingEvidence: A single current official source that reconciles whether Cloaked covers roughly 120, 140, or 400+ brokers and explains the counting method.
    whyItMatters: Broker-coverage breadth is a core product-value claim and currently shifts across current public surfaces, which weakens confidence in precision.
    diligencePath: Request the current broker inventory, counting policy for records versus brokers, and the internal owner of broker-coverage copy across consumer and enterprise pages.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE001
    - TE004
  - type: private-evidence-only
    severity: material
    topic: compliance-artifacts
    missingEvidence: Independent public audit artifacts, trust-center exports, or certificate documents supporting the ISO 27001, ISO 27701, PCI, and SOC 2 Type II claims.
    whyItMatters: Enterprise buyers need more than a company-authored press release before treating certifications as fully verified technical assurance.
    diligencePath: Ask for the current SOC 2 bridge letter or public trust-center access and confirm certificate scope, issuing body, and expiration dates.
    relatedQuestionRefs:
    - QE016
  - type: missing-source
    severity: material
    topic: aws-marketplace
    missingEvidence: A direct, live AWS Marketplace listing or equivalent marketplace metadata for Cloaked Enterprise.
    whyItMatters: Marketplace availability affects procurement workflow, integration assumptions, and how real the enterprise distribution claim is.
    diligencePath: Request the exact AWS Marketplace listing URL, seller profile, and launch date, then verify the listing is public and current.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE005
  - type: stale
    severity: minor
    topic: pre-ga-roadmap
    missingEvidence: A dated public launch plan clarifying when Cloaked Pay, AutoCloak AI, and related AI-agent features move from beta or coming-soon language into general availability.
    whyItMatters: Underwriting product maturity requires distinguishing shipped controls from aspirational roadmap copy.
    diligencePath: Ask product leadership for current GA dates, feature flags, rollout scope, and any dependency on banking, compliance, or AI-policy approvals.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE001
    - TE005
