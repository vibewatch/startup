- id: architecture-and-operating-model
  title: The visible architecture layers browser and mobile surfaces over routing, screening, removal, and monitoring services
  body: Cloaked’s public architecture is specific enough to map without guessing at internal systems. On the front end, the Chromium extension, dashboard, and mobile apps are the visible control surfaces. Beneath them sits an identity layer that can mint proxy emails, phone numbers, usernames, passwords, one-time passcodes, and in some cases payment identities. Communications then flow through Cloaked-managed inboxes, forwarding logic, and call-screening surfaces, while exposure cleanup and breach monitoring sit in parallel rather than as one monolithic function. The practical implication is that Cloaked’s moat, if it has one, comes less from any single feature than from stitching these modules into a single daily-use workflow. The browser extension is especially important because it is where autofill, OTP capture, identity generation, and on-web usage actually converge. Public release notes reinforce that this layer receives active product attention, which makes the extension a real delivery
    surface instead of a thin marketing accessory.
