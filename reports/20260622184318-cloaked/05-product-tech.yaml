chapter:
  number: 5
  title: Product & Technology
  summary: Cloaked’s publicly visible product is best understood as a privacy operations layer spanning alias identities, cleanup, monitoring, and response rather than as a single masking app. The extension, dashboard, and mobile clients are real delivery surfaces with active release evidence, but newer modules such as Cloaked Pay, AI agents, and some enterprise-assurance claims still read as pre-GA or under-documented. The key product-tech diligence issue is therefore not whether the platform exists, but which parts are mature consumer workflow today versus broader roadmap or enterprise-sales narrative.
sections:
- id: product-suite-and-customer-jobs
  title: Cloaked’s product is a privacy operating layer, not just an alias generator
  body: Public evidence shows that Cloaked is trying to own the entire personal-exposure workflow rather than one narrow privacy task. The retained official pages repeatedly bundle generated identities, data removal, dark-web and SSN monitoring, Call Guard, insurance, VPN, password management, and a still-limited Cloaked Pay surface into one membership. In customer terms, that means Cloaked wants to both fix the past by scanning and removing already-exposed data and protect the future by making every new signup, call, and purchase use disposable or compartmentalized credentials. The strongest evidence is around identity generation, browser-based autofill, and removal workflow. The weakest evidence is around how broadly some of the newer modules are actually available, because public copy still conflicts on broker counts, iPhone requirements, and whether Cloaked Pay is invite-only, beta, or effectively coming soon. That makes the product real, but not uniformly mature across every advertised
    module.
