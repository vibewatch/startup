- id: maturity-dependencies-and-technical-risk
  title: The product is actively maintained, but newer add-ons and some support claims still show public-evidence gaps
  body: 'There is real maintenance signal here. The current Chrome and App Store listings show recent versions close to run date, and changelog pages document concrete work on extension UX, encryption, OTP support, pixel blocking, and anti-spam mechanics. Independent reviews also confirm that Cloaked is more than a temporary-email tool in day-to-day use. Even so, the quality and maturity picture is uneven. PCMag explicitly treats the product as broader than a simple alias service but not as the strongest specialist across every component. Trustpilot shows both praise for spam reduction and support responsiveness and complaints about refund friction, valid-call handling, and unresolved spam. Aura’s competitor review predictably leans negative, but it still points at a real issue: some modules are thinly evidenced relative to the breadth of the marketing bundle. The prudent technical verdict is that identity generation, extension workflow, and core cleanup are the most mature public surfaces,
    while enterprise assurance, AI roadmap claims, and Cloaked Pay readiness still warrant direct diligence.'
