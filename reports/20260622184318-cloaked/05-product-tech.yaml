- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Company solution
  - Measurable benefit
  - Limitation
  rows:
  - - Sign up without revealing real contact data
    - Enter real email and phone into every site form
    - Create a Cloaked identity and autofill it through the extension or app
    - Contain future breaches to per-site aliases instead of the real inbox or number
    - Best-in-class web usage is still tied most clearly to Chromium browsers
  - - Clean up already-exposed personal data
    - Run a scan, verify records, then submit removal requests
    - Free exposure scan plus broker-by-broker removal and dashboard tracking
    - Centralized visibility into records, statuses, and removals instead of manual opt-outs only
    - Some removals still need manual action and public broker counts are inconsistent
  - - Screen unknown calls without answering them
    - Let the phone ring or block numbers one by one
    - Call Guard answers unknown callers with AI and lets only valid calls through
    - Reduced spam interruptions and an auditable transcript path for legitimate callers
    - Public reviews show some users still report missed legitimate callers or ongoing spam
  - - Respond to a breach or identity warning
    - Wait for downstream fraud or manually search leak reports
    - Dark-web and SSN alerts surface where data appeared and push users toward freezes, resets, and MFA changes
    - Faster response once sensitive information is detected online
    - Public pages only describe eight monitored data types, so total monitoring breadth is unclear
  - - Share credentials or account details safely with family or colleagues
    - Text or email passwords manually
    - Encrypted identity sharing exposes only selected fields for a limited duration
    - Reduces unsafe password sharing and keeps the shared dataset scoped
    - This is not documented as a collaborative shared vault with live edit rights
  - - Deploy privacy protection to employees
    - Rely on employee self-help or buy separate point tools
    - Cloaked Enterprise adds bulk enrollment, admin monitoring, and employee risk scanning
    - Makes consumer privacy controls deployable as a workforce service
    - Independent procurement proof beyond the company press release is limited in the retained evidence
  notes: Measurable benefits are stated as workflow outcomes visible from public surfaces and reviews; they are not converted into audited ROI metrics.
