      label: Call Guard, inbox routing, and autofill operate during normal use
    - id: monitor
      label: Dark-web alerts and data-removal statuses surface in app or dashboard
    - id: respond
      label: User follows removal steps, freezes, resets, or deletes noisy identities
    - id: admin
