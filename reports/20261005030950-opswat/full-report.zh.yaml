      - CV002
      - CV003
      - CV004
      - CV005
      - CV008
      - CV013
  - id: TV003
    title: 乐观、基准与悲观情景预测
    columns:
      - 情景
      - 运营假设
      - 估值与倍数逻辑
      - 关键风险与下行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - 维持 25-30% ARR 增长；全球国防与公用事业扩张；毛利率 >75%；软件订阅占主导
        - 6.0x - 8.0x ARR；预计收入 $200M+ 对应估值 $1.5B - $2.0B；溢价战略或 IPO 退出
        - 政府国防项目预算收缩；文件清理引擎商品化
        - 中低（25%）：需要无瑕疵执行，并核实数亿美元收入规模
      - - 基准情景
        - ARR 增长 15-20%；核能、能源和医疗领域稳定采用；软件 / 硬件综合毛利率约 65-70%
        - 3.5x - 5.0x ARR；对应估值 $600M - $900M；二级流动性或增长股权再资本化
        - 企业销售周期拉长；硬件供应链和设施管理费用挤压利润率
        - 高（55%）：符合历史上的自力更生纪律，以及受监管垂直领域的适度扩张
      - - 悲观情景
        - 增长放缓至 <10%；硬件拖累和支持管理费用推高现金消耗；非监管层客户流失
        - <2.5x ARR 或资产出售；此前 $125M 增长轮估值承压下调；流动性折价
        - 失去关键认证；较新的 AI 产品无法获得企业采用；发生重大入侵
        - 中低（20%）：运营关键基础设施的高切换成本可部分缓解
    notes: 情景倍数以成熟基础设施软件同行为基准；基准收入仍未确认。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV008
      - CV012
      - CV014
      - CV016
figures:
  - id: FO001
    title: OPSWAT 公司发展、资本化与产品演进时间线
    type: timeline
    summary: 按时间梳理 OPSWAT 自 2002 年创立并自力更生以来的发展里程碑，包括机构资本化、硬件扩张和 AI 威胁防护产品发布。
    data:
      items:
        - label: 公司创立与自力更生
          date: '2002'
          description: Benny Czarny 在旧金山创立 OPSWAT，在没有外部风险资本的情况下率先采用防护优先架构。
        - label: Deep CDR 与 Metascan 开发
          date: '2010'
          description: OPSWAT 建立专有内容解除武装与重建及多引擎扫描技术，用于文件安全。
        - label: D 轮增长融资
          date: 2021-03
          description: 从 Brighton Park Capital 获得 $125 million 增长融资，加速国际扩张和收购。
        - label: Tampa 总部与制造设施
          date: '2023'
          description: 在佛罗里达州 Tampa 建立全球总部和硬件生产设施，以加强供应链控制。
        - label: Unit 515 威胁研究启动
          date: 2025-06
          description: 推出精英攻防红队 Unit 515，在关键软件中发现并负责任地披露 29 个漏洞。
        - label: 搭载 SmartTouch 的 MetaDefender Drive
          date: 2025-10
          description: 发布便携式气隙威胁检测设备，在硬件进入气隙环境前进行检查。
        - label: ARR 增长里程碑与 NATO 列名
          date: 2026-02
          description: 报告 ARR 同比增长 >25%，客户数超过 2,000，且数据二极管列入 NATO Information Assurance Product Catalogue。
        - label: AI Content Inspector 2.0 发布
          date: 2026-06
          description: 在 MetaDefender 平台推出 AI 驱动的内容真实性和文档欺诈检测引擎。
    approximationNotes: 日期反映官方新闻公告、公司里程碑摘要和技术发布计划。
    claimRefs:
      - CO001
      - CO002
      - CO007
      - CO008
      - CO010
      - CO011
