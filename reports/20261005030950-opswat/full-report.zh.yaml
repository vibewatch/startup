        title: 展示项
        blocks:
          - type: callout
            title: 物理隔离壁垒：关键基础设施抗拒云端
            body: >-
              网络安全风投几乎一边倒地偏好云原生 SaaS 模式，但核电公用事业、水系统和国防设施等关键基础设施环境，仍受实体物理隔离和本地控制牢牢约束。OPSWAT 在佛罗里达州坦帕刻意自建硬件制造能力，再加上合规认证（如
              NATO NIAPC 列名、IEC 62443），形成了一道通用云安全供应商难以轻易突破的机构采购壁垒。
            calloutType: insight
