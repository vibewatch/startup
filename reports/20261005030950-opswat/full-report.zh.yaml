  - id: TV002
    title: 投资论点与反论点矩阵
    columns:
      - 支柱
      - 论点
      - 反论点风险
      - 改变判断的条件
    rows:
      - - 市场需求与护城河
        - 依靠专有 Deep CDR 和数据二极管，为 16 个 CISA 行业、核能、国防和公用事业提供任务关键型防护
        - 相比广泛的企业云安全，细分市场天花板更低；OT 更换周期更慢
        - 有证据表明跨域采用正在加速，从工业 OT 扩展到主流企业 IT
      - - 商业规模
        - 2,000+ 客户、1,000+ 员工，并报告 2025 年 ARR 增长 25%
        - ARR 增长来自公司自报，但未披露基准收入、ARR 金额或净留存
        - 经审计的 SaaS 队列留存显示 NRR 超过 115%，毛留存率高于 90%
      - - 资本效率
        - 2021 年首次获得 $125M 机构轮融资前，近二十年一直自力更生
        - 2021 年后的现金消耗、Tampa 硬件制造库存成本和债务工具均未知
        - 经审计的自由现金流报表证明运营盈利或现金消耗可自我维持
      - - 退出流动性
        - 可成为国防承包商或大型网络安全平台的可行战略收购目标
        - 若收入规模低于 $200M，或硬件占比压低毛利率，IPO 窗口可能受阻
        - 已核实收入规模超过 $150M，硬件和软件综合毛利率超过 70%
    notes: 各支柱将运营优势与公司主要陈述中的结构性披露局限进行对比。
