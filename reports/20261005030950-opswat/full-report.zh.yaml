  - id: FR001
    title: 风险严重性与可能性评估热力图
    type: matrix
    summary: 以可视化方式呈现主要监管、技术和运营风险因素的发生可能性与运营影响。
    data:
      columns:
        - 低影响
        - 中影响
        - 高影响
        - 严重影响
      rows:
        - label: 频繁发生
          values:
            - 常规误报
            - OT 资产调优阻力
            - 供应商集成延迟
            - 未缓解的资产群暴露
        - label: 高可能性
          values:
            - 轻微配置漂移
            - OT 异常检测调优阻力
            - 多引擎许可成本膨胀
            - 工业区域严重中断
        - label: 中可能性
          values:
            - 遥测缺口
            - 工业标准演进（IEC 62443）
            - 浏览器扩展数据流暴露
            - AI 引擎查询劫持 / RCE
        - label: 低可能性
          values:
            - 轻微审计缺陷
            - 企业云审计发现
            - Tampa 设施物理中断
            - 核能 / 国防认证撤销
        - label: 极低可能性
          values:
            - 可忽略
            - 轻微供应商分歧
            - 常规补丁延迟
            - 核心密码学故障
        - label: 假设性可能性
          values:
            - 可忽略
            - 文档不一致
            - 孤立端点篡改
            - 全球供应链停摆
    approximationNotes: 可能性与影响的定位来自第三方运营评估、技术评审和公司披露。
