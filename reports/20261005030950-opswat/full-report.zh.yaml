              OPSWAT 当前的产品覆盖面围绕文件、可移动媒体、托管传输、存储、邮件、端点和分段网络的安全展开。就工作流而言，MetaDefender
              位于接入或传输边界：内容进入生产应用、存储库、收件箱或隔离运营网络前，先接受检查。其广度很有价值，因为受监管运营者可以在云端、本地和实体媒体边界应用一套相互关联的控制，而不必只购买点式扫描器。不过，使用证据并不均衡。现有材料包括
