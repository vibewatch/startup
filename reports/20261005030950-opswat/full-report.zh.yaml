      - number: '1.2'
        title: 管理层、治理结构与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              OPSWAT 的运营治理明显由创始人主导，核心人物是创始人、CEO 兼董事会主席 Benny Czarny；自公司成立以来，他已领导组织二十多年。Czarny 拥有 Technion - Israel
              Institute of Technology 计算机科学背景，创办 OPSWAT 前曾任 BindView 工程经理。支持 Czarny 的管理团队包括 CFO Simon Ho、CISO 兼 COO
              Michael Barker、CPO Yiyi Miao、CMO Kat Lewis 和总法律顾问 Eric Spindel，全球技术团队则由 CTO Jan Miller
              负责。尽管管理层覆盖了企业安全的资深职能，公司仍高度依赖
              Czarny：他同时担任核心高管和董事长，并持续深度影响产品架构与技术战略。第三方目录聚合平台不时显示财务高管历史职衔互相冲突，反映出这类非上市、闭合持股的企业软件公司普遍存在的信息不透明。
