companyProfile:
  summary: >-
    OPSWAT 是一家由创始人主导的关键基础设施网络安全公司，面向 IT、OT 和物理隔离环境，销售以预防为先的文件、媒体和数据传输安全产品。其 MetaDefender
    平台覆盖多引擎扫描、深度内容拆解与重构、数据二极管、信息亭、安全托管文件传输及相关服务，客户包括受监管企业、公用事业、国防和公共部门机构。公司称客户超过 2,000 家、员工超过 1,000 人、ARR 增长超过
