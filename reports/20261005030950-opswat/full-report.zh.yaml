      - number: '6.2'
        title: 采用轨迹、渠道生态与从业者赋能
        blocks:
          - type: paragraph
            body: >-
              OPSWAT 的客户增长轨迹显示，公司从创始人主导的起步阶段一路扩张，至 2026 年已成为服务全球超过 2,000 家机构的企业网络安全平台。公司在 2026 年 2 月宣布，2025 年 ARR 同比增长超过
              25%，全球员工超过 1,000 人，业务覆盖全球 22 个办公室。F5、SentinelOne、NetApp 和 Amazon Web
              Services（AWS）等企业基础设施龙头的全球渠道生态与战略技术集成，进一步强化了客户扩张。为了加快从业者上手并建立品牌持久度，OPSWAT 运营 OPSWAT Academy；该教育项目已登记超过
              484,000 名学生，并颁发超过 286,000 张关键基础设施网络安全专业认证。OPSWAT Academy 获认证为 ISC2 Continuing Professional
              Education（CPE）合作伙伴，在客户做出采购决定前，先让企业从业者熟悉 MetaDefender 工作流，成为漏斗顶端的采用入口。
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU008
              - CU009
              - CU010
