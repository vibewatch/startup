            - NATO NIAPC 光学数据二极管
            - 双边安全网关
            - 核电站周界防护
        - label: 5. 威胁情报集成
          detail: 安全运营团队集成 MetaDefender Aether，用于云端沙箱引爆、威胁狩猎和 YARA 分析。
          touchpoints:
            - MetaDefender Aether SOC 威胁狩猎
            - Unit 515 对抗性研究
            - 自动化沙箱引爆
        - label: 6. 平台扩张与续约
          detail: 企业续签多年订阅，并将许可扩展至更多设施和 OT 场站。
          touchpoints:
            - My OPSWAT 集中管理
            - 企业许可扩展
            - 年度经常性合同续约
    approximationNotes: 这张旅程图综合了已记录的产品层级、学术培训路径和企业扩张模式。
