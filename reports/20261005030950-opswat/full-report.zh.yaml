chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、成立背景与预防架构
        blocks:
          - type: paragraph
            body: >-
              OPSWAT 由 Benny Czarny 于 2002
              年在旧金山一套公寓中创立，奉行与传统被动式网络安全不同的底层理念：“不信任任何文件，不信任任何设备。”公司认为，单靠概率式检测无法可靠应对零日漏洞利用和新型恶意软件，因此没有把业务押在这一方法上，而是围绕确定性威胁预防搭建核心业务。旗舰
              MetaDefender 平台结合深度内容拆解与重构（Deep CDR），可在 100
              多种文件类型中剥离活跃恶意代码并重建安全文件；同时提供数十种反恶意软件引擎的多引擎扫描、基于文件的漏洞评估和主动数据防泄漏。OPSWAT 总部位于佛罗里达州坦帕，已将运营版图扩展至全球 22
              个办公室，并在美国、欧洲和中东设有区域关键基础设施保护（CIP）实验室；坦帕还有专门的硬件生产设施，制造 MetaDefender
              Kiosk、数据二极管等专有硬件。商业聚合平台和公司资料显示，其在高后果行业已形成可观运营规模，据称覆盖美国 98% 的核电发电设施，并服务全球超过 2,000 家企业和政府客户。
            claimRefs:
