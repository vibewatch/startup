              近期证据表明，OPSWAT 仍在软件和硬件两端持续投入。公司称其于 2025 年 10 月推出带 SmartTouch 的 MetaDefender Drive，扩展了 Kiosk 和 Managed File
              Transfer 能力，并把硬件设计与制造纳入坦帕生产设施。Emerson 另行宣布 2026 年 4 月达成经销商协议，首个项目将 OPSWAT OT 补丁管理接入 Ovation Automation
              Platform；这比单纯展示公司 Logo 更能证明集成，但公告没有披露上线日期、客户采用、性能或服务水平。NetWall
