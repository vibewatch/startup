      - number: '2.2'
        title: 市场规模口径：TAM、SAM 与受限可触达市场
        blocks:
          - type: paragraph
            body: >-
              评估 OPSWAT 的可触达市场，需要采用多个彼此不同的分析师和行业口径，而不能只依赖一个宽泛的总市场预测 CM008 CM009。MarketsandMarkets 和 GlobeNewswire
              的第三方研究预计，全球安全文件传输（SFT）市场将从 2026 年的 $5.69 billion 增至 2031 年的 $8.34 billion，复合年增长率（CAGR）为 8.0% CM008
              CM009。其中，系统到系统传输是最大的部署类型，主要由制造、银行和公用事业运营中的自动化重复交易驱动 CM009。Futurum Group 跟踪的更宽泛软件生命周期工程（SLE）口径预计支出将从 2025
              年的 $235 billion 增至 2028 年的 $344 billion，CAGR 为 15.4%；生产环境越来越要求自动化验证、边界文件检查和零信任 ICAP 集成
              CM010。在这些庞大总额中，OPSWAT 的可服务市场（SAM）受到严格限制，只覆盖需要硬件强制单向二极管、光学防火墙和多引擎检查的高后果关键基础设施行业 CM004 CM011。2025
              年，IBM、OPSWAT、Fortra、Progress Software 和 Thru 等领先企业合计控制 SFT 市场约 40% 至 45%，而 OPSWAT 的核心滩头阵地仍是专业化 OT/IT
              跨域安全，以及高保证核电和联邦部门部署 CM008 CM012 CM013。由于私有财务披露不透明，其商业 SOM 的准确边界仍需持续尽调 CM014 CM015 CM016。
            claimRefs:
