        - label: 安全文件传输（SFT）市场
          value: 5.69
          unit: USD B (2026)
          detail: 覆盖所有商业垂直领域的全球安全与托管文件传输解决方案，预计到 2031 年达到 $8.34B，复合年增长率为 8.0%（MarketsandMarkets 2026）。
        - label: 关键基础设施 SFT 与跨域交换
