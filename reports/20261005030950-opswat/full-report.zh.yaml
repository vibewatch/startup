    title: 估值投资判断逻辑
    type: flow
    summary: 决策流程图展示从运营规模到投资立场及尽调要求的评估过程。
    data:
      nodes:
        - id: scale
          label: 运营规模
          description: 2,000+ 名客户、1,000+ 名员工，据报道 ARR 增长 25%
        - id: products
          label: 产品护城河
          description: Deep CDR、MetaDefender Kiosks、数据二极管、NATO 列名
        - id: transparency
          label: 财务不透明
          description: 没有公开收入申报；2021 年仅完成一轮 $125M 融资
        - id: pricing
          label: 对定价的质疑
          description: 传闻中的 $1.8B 估值没有经验证的 ARR 基础支撑
        - id: diligence
          label: 强制尽调关口
          description: 要求提供经审计的 GAAP 财务报表、股权结构表和客户流失指标
        - id: recommendation
          label: 建议：继续研究
          description: 在取得经审计账目和股权结构表前暂缓投资
      edges:
        - from: scale
          to: products
        - from: products
          to: transparency
        - from: transparency
          to: pricing
        - from: pricing
          to: diligence
        - from: diligence
          to: recommendation
    approximationNotes: 该流程展示了将证据节点连接到建议结果的定性筛选逻辑。
