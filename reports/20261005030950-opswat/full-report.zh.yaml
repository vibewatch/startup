      - number: '2.4'
        title: 市场增长驱动、结构性约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              工业控制系统和制造业遭受的网络攻击越来越频繁且严重，推动市场需求增长 CM003 CM009。Dragos 威胁情报显示，其跟踪期内工业勒索软件攻击同比激增 87%，制造业成为受攻击最严重的行业
              CM003。与此同时，欧盟 NIS2 指令、美国 CISA 关键基础设施指南和核能行业标准等监管要求趋严，对未经验证的文件移动和未受监控的第三方供应商访问施加严格处罚 CM002 CM003
              CM012。不过，显著的采用约束限制了市场扩张 CM009。工业组织面临严重的资本设备惯性、7 至 10 年的可编程逻辑控制器（PLC）更换周期，以及缺少能配置高级跨域架构的合格 OT 网络安全人员 CM009
              CM014。此外，把旧式文件传输基础设施迁移到现代零信任平台会带来运营复杂度，并引发对工厂意外停机的担忧 CM009。关于 OPSWAT
              软件与硬件收入拆分、商业企业客户留存率，以及多引擎许可模式相对于云原生超大规模云厂商的竞争可持续性，仍存在重大尽调缺口 CM015 CM016。
            claimRefs:
              - CM002
              - CM003
              - CM009
              - CM012
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 工业物理隔离安全悖论
            body: >-
              关键基础设施运营者用物理或逻辑物理隔离来保护高价值控制系统，但供应商打补丁、遥测分析和 AI 建模等运营需求不断引入外部数据。没有自动化、由策略强制执行的文件清理和硬件强制单向二极管时，USB
              驱动器等临时介质会完全绕过边界防火墙，使物理传输成为勒索软件感染的主要路径。
            calloutType: insight
            claimRefs:
              - CM003
              - CM006
              - CM007
              - CM011
          - type: callout
            title: 受监管运营中的长期采购惯性
            body: >-
              尽管网络威胁活动激增，关键基础设施的销售周期速度仍受双买方采购机制和漫长的公用事业费率审查周期限制。需要 IT 网络安全团队与谨慎的工厂运营工程师达成一致的决策，往往要耗时 9 至 18 个月，因此相较纯企业
              SaaS 竞争者，商业扩张更慢。
            calloutType: risk
            claimRefs:
              - CM009
              - CM014
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与市场边界
        blocks:
          - type: paragraph
            body: >-
              OPSWAT
              在关键基础设施保护（CIP）中占据独特的架构位置，主要工作在分隔不受信任外部输入与安全内部环境的物理和逻辑边界。它不是通用端点检测与响应（EDR）套件或核心企业防火墙的直接竞争者，而是专注于确定性威胁预防、深度内容拆解与重构（Deep
              CDR）、多引擎扫描和硬件强制单向安全网关。竞争格局分为五类主要参与者：通用 IT 端点和网络安全厂商（Palo Alto
              Networks、CrowdStrike、Trellix）；专业文件清理与内容拆解厂商（Sasa Software GateScanner）；专门做 OT 网络安全和可视性的厂商（Claroty、Nozomi
              Networks、Dragos）；外围及跨域安全设备供应商；以及内部自建或现状流程控制。在 OT 和 ICS 中，安全运营者面对 NERC CIP、NIST SP 800-82
              和核监管要求等严格法规与合规环境，云端独占的安全架构既不可接受，在法律上也可能被禁止。IT 安全龙头主导 SaaS 和企业端点可视性，但 OPSWAT
              刻意聚焦本地设备、物理隔离信息亭和光学数据二极管，因此在受严格监管的工业和政府客户中形成了根深蒂固的防御壁垒。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
