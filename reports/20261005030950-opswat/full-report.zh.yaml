      - number: '1.3'
        title: 资本化历程、私募市场指标与商业规模
        blocks:
          - type: paragraph
            body: >-
              与通常连续进行稀释性融资的风投支持型网络安全同行不同，OPSWAT 近二十年一直靠自有资金经营，直到 2021 年 3 月 31 日获得机构投资者 Brighton Park Capital 的 $125
              million 成长股权投资。Tracxn 和 LeadIQ 的目录将其列为 OPSWAT 唯一一轮机构融资。2026 年初，OPSWAT 宣布 2025 年年度经常性收入（ARR）同比增长超过
              25%，全球员工超过 1,000 人，服务全球超过 2,000 家客户。但公司没有公开披露经审计的 GAAP 收入、准确 ARR 规模、毛利率、EBITDA 或 2021
              年之后的估值等具体金额指标。RocketReach 等第三方情报平台报告称，OPSWAT 2026 年收入估算为 $105
              million；这一估算未经核实，且与更早的风投传闻冲突。没有经审计文件或股权结构表披露，这一数字仍无法验证。事件响应案例还显示，MetaDefender
              已用于受攻击的医疗网络，以缓解严重的勒索软件宕机；但在物理隔离和工业环境中，相关运营风险仍要求持续验证第三方多引擎扫描依赖。
