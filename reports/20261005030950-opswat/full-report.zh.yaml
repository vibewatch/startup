              Transfer，把文件从受感染环境移至干净环境；但材料没有提供部署量、恢复耗时、误报率或独立记录的客户验收测试。因此，下面的产品地图将市场宣称的可用性、合作伙伴支持的集成与独立验证的生产成熟度区分开来。
