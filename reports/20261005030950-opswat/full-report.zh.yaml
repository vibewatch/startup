      - number: '1.4'
        title: 展示项
        blocks:
          - type: callout
            title: 确定性预防与概率式检测
            body: >-
              OPSWAT 在关键基础设施保护领域采用确定性的清理模型，而不是只依赖概率式特征和行为检测。借助 Deep
              CDR，系统先将文件视为恶意内容，再重建为干净文件，因此能为核电和工业等物理隔离环境提供独特保护；代价是需要较强处理性能，并与企业工作流紧密集成。
            calloutType: insight
            claimRefs:
