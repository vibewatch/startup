  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、类别定义与支出分层
        blocks:
          - type: paragraph
            body: >-
              关键基础设施保护（CIP）网络安全连接了传统企业信息技术（IT）安全、运营技术（OT）和工业控制系统（ICS）。在工业自动化、能源公用事业、国防和医疗设施中，网络物理资产无法承受软件延迟、未经验证的更新或不受控的网络连接
              CM001 CM002。因此，安全支出明显分为通用企业文件共享与专门的预防式数据交换解决方案 CM001 CM003。OPSWAT
              专注于高保证边界防御、外围媒体保护（信息亭和便携式扫描驱动器）、数据二极管，以及配备深度内容拆解与重构（Deep CDR）的安全托管文件传输（MFT）CM001 CM003
              CM004。由于物理隔离、监管要求和零信任政策，通用企业协作工具、普通云盘和基础消费级文件共享工具明确不适用于高安全 OT 环境 CM003 CM005。工业环境中的现状替代方案通常是未经监控的临时 USB
              传输、旧式未加密 SFTP 连接和人工纸质物理隔离变通方案 CM003 CM006。这些人工做法带来明显运营风险，包括引入未经验证的恶意软件、供应链补丁无法追踪，以及违反 NERC CIP、IEC 62443 和
              NIS2 等框架的严重合规问题 CM003 CM007。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
