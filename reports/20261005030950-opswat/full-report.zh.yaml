          - type: callout
            title: 财务不透明与估值验证缺口
            body: >-
              OPSWAT 虽报告了超过 2,000 家客户、1,000 名员工和超过 25% 的同比 ARR 增长，但作为私营公司，其财务信息极不透明。公司没有经审计的财务披露，未经核实的收入估算约为 $105
              million，未经确认的估值传闻接近 $1.8 billion；要评估机构估值倍数，必须直接取得公司财务记录、债务契约和股权结构表。
