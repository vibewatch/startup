            body: >-
              技术模型是分层的，不依赖单一检测器。OPSWAT 描述的产品组合包括多引擎恶意软件检测、内容拆解与重构、数据防泄漏、沙箱、威胁情报和漏洞评估。AWS 与 OPSWAT
              的联合指南提供了具体集成细节：MetaDefender 可通过 REST API 暴露，连接 S3 和兼容 ICAP 的基础设施，或以容器、打包安装程序或 Amazon Machine Image
