      - number: '2.3'
        title: 买方画像、采购机制与预算归属
        blocks:
          - type: paragraph
            body: >-
              关键基础设施环境的采购机制由 IT 和 OT 两个领域分担责任，各自掌握不同预算权限 CM002 CM014。企业 CISO 和 IT 安全总监主要为企业合规、数据防泄漏（DLP）和云原生文件检查分配预算
              CM002 CM008。相比之下，OT 总监、工厂运营副总裁和 SCADA 工程经理掌控工业资本支出，优先考虑系统正常运行时间、物理安全、确定性数据交付，以及运营控制回路零中断 CM003 CM014。连接 IT
              与 OT 网络时，采购委员会需要两个部门达成共识，往往还会吸纳工厂经理、数字取证团队和合规官 CM006 CM014。采购触发因素通常包括工业系统遭遇严重勒索软件事件、未通过 NERC CIP 或 IEC
              62443 监管审计，或公司要求把物理隔离的生产线接入企业预测性维护和 AI 分析平台 CM003 CM006
              CM010。正式全域部署前，采购流程通常会通过技术概念验证，评估多引擎扫描吞吐量、离线信息亭可用性和硬件二极管故障切换可靠性 CM004 CM014。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM006
              - CM008
              - CM010
              - CM014
