      - number: '6.3'
        title: 具名客户部署、取证恢复与商业持久性
        blocks:
          - type: paragraph
            body: >-
              真实客户证据凸显 MetaDefender 平台在安全危机和生产工作流中的运营必要性。在一宗值得关注的事件响应部署中，小型数字取证公司 Unique Wire 使用 OPSWAT MetaDefender
              Managed File Transfer（MFT），处理一场彻底攻陷某大型医疗服务商内部服务器基础设施的大规模勒索软件攻击。Unique Wire 建立隔离的“脏”和“净”网络，让受感染的患者记录经过
              MetaDefender MFT 路由，并在迁移网络前用多引擎扫描和 Deep CDR 清理所有文件，最终恢复运营，没有招致监管罚款或患者诉讼。此外，北约成员国部署了列入 NATO Information
              Assurance Product Catalogue（NIAPC）的 OPSWAT MetaDefender 数据二极管，用于跨域防御。然而，尽管已有知名案例，OPSWAT
              对商业合同的持久性仍保持高度财务不透明。公开披露没有给出净留存率（NRR）、毛留存率（GRR）、年度客户流失率和头部客户集中度等关键单位经济指标，因此 MetaDefender Aether
              等较新产品的长期持久性仍是待尽调事项。
            claimRefs:
              - CU001
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
