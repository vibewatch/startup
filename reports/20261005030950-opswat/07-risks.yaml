callouts:
  - calloutType: "risk"
    title: "Silent Failure Risk in Browser Download Inspection"
    body: "Top5soft's technical review highlights that administrators deploying OPSWAT File Security for Browser must explicitly configure file-size skip thresholds and error handling. If large files exceed quota limits or server connectivity times out, a silent skip can occur, which non-technical users may dangerously mistake for a verified clean file result [CR004]."
    claimRefs:
      - "CR004"
  - calloutType: "insight"
    title: "Manufacturing Centralization Trade-Off"
    body: "Bringing hardware manufacturing entirely in-house to Tampa, Florida successfully resolves supply chain provenance concerns for nuclear and defense customers requiring trusted hardware [CR002]. However, it concentrates single-facility physical operational risk, creating vulnerability to regional weather disruptions or localized facility shutdowns [CR002, CR007]."
    claimRefs:
      - "CR002"
      - "CR007"
