chapter:
  number: 6
  title: "Customers"
  summary: "OPSWAT serves over 2,000 global enterprise, defense, and public-sector accounts across critical infrastructure sectors, including 98% of U.S. nuclear power generation facilities. While the company demonstrates customer expansion across energy, government, finance, and healthcare through high-assurance file transfer and peripheral media protection, commercial retention metrics such as NRR, GRR, and logo churn remain closely held private disclosures."
sections:
  - id: "customer-segmentation-and-verticals"
    title: "Customer Base Segmentation and High-Assurance Adoption"
    body: "OPSWAT directs its cybersecurity platform toward highly regulated critical infrastructure protection (CIP) sectors where file-borne malware and unauthorized removable devices present catastrophic operational and national security risks. The company’s core commercial footprint spans energy and utilities, government and defense, financial services, healthcare and public health, and industrial manufacturing. According to commercial intelligence and company profiles, 98% of U.S. nuclear power generation facilities rely on OPSWAT’s cybersecurity and compliance solutions, demonstrating deep penetration across high-consequence operational technology (OT) environments. In broader critical infrastructure markets, OPSWAT reports protecting more than 2,000 customer organizations worldwide. Target buyers within these enterprises typically comprise Chief Information Security Officers (CISOs), OT security directors, plant managers, and compliance officers who require deterministic threat prevention rather than probabilistic detection. Across commercial deployments, customers integrate OPSWAT’s MetaDefender platform to inspect peripheral media at facility perimeters via MetaDefender Kiosk, secure air-gapped network enclaves via optical data diodes, and sanitize inbound files via Deep Content Disarm and Reconstruction (Deep CDR)."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-channel-expansion"
    title: "Adoption Trajectory, Channel Ecosystem, and Practitioner Enablement"
    body: "OPSWAT’s customer growth trajectory reflects multi-decade expansion from founder-led beginnings into an enterprise cybersecurity platform serving over 2,000 organizations globally by 2026. In February 2026, the company announced that it achieved over 25% year-over-year growth in annual recurring revenue (ARR) during 2025, supported by a global workforce exceeding 1,000 employees and operations spanning 22 offices worldwide. Customer expansion is heavily reinforced by a global channel ecosystem and strategic technology integrations with enterprise infrastructure leaders including F5, SentinelOne, NetApp, and Amazon Web Services (AWS). To accelerate practitioner onboarding and build brand durability, OPSWAT operates OPSWAT Academy, an educational initiative that has registered over 484,000 students and issued more than 286,000 professional certifications in critical infrastructure cybersecurity. Accredited as an ISC2 Continuing Professional Education (CPE) partner, OPSWAT Academy serves as a top-of-funnel adoption vehicle that familiarizes enterprise practitioners with MetaDefender workflows before procurement decisions occur."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-deployments-and-retention-risks"
    title: "Named Customer Deployments, Forensic Recovery, and Commercial Durability"
    body: "Real-world customer proof underscores the operational necessity of OPSWAT’s MetaDefender platform during active security crises and production workflows. In a notable incident response deployment, boutique digital forensics firm Unique Wire utilized OPSWAT MetaDefender Managed File Transfer (MFT) to remediate a massive ransomware attack that fully compromised a major healthcare provider's internal server infrastructure. By establishing segregated 'dirty' and 'clean' networks and routing compromised patient records through MetaDefender MFT, Unique Wire sanitized all files with multi-scanning and Deep CDR before network migration, restoring operations without incurring regulatory fines or patient lawsuits. Furthermore, NATO member nations deploy OPSWAT MetaDefender data diodes listed on the NATO Information Assurance Product Catalogue (NIAPC) for cross-domain defense. However, despite documented high-profile case studies, OPSWAT maintains tight financial opacity regarding commercial contract durability. Public disclosures omit crucial unit economics, including Net Retention Rate (NRR), Gross Retention Rate (GRR), annual customer churn, and concentration among top accounts, leaving the long-term durability of newer offerings such as MetaDefender Aether an open diligence item."
    claimRefs:
      - "CU001"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
    tableRefs:
      - "TU003"
