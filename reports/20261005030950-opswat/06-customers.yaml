      - "CU010"
  - calloutType: "risk"
    title: "Critical Omission of Customer Retention and Concentration Metrics"
    body: "While OPSWAT publicizes top-line milestones—including over 2,000 customers and >25% YoY ARR growth—it completely withholds retention and cohort durability data. The absence of Net Retention Rate (NRR), Gross Retention Rate (GRR), and logo churn metrics obscures whether revenue growth is driven by expanding contract values or high gross churn masked by top-of-funnel customer acquisition."
