companyProfile:
  summary: >-
    OPSWAT is a founder-led critical-infrastructure cybersecurity company that sells prevention-first file, media, and
    data-transfer security across IT, OT, and air-gapped environments. Its MetaDefender platform spans multiscanning,
    Deep Content Disarm and Reconstruction, data diodes, kiosks, secure managed file transfer, and related services for
    regulated enterprises, utilities, defense, and public-sector customers. The company reports more than 2,000
    customers, 1,000+ employees, and >25% ARR growth, but audited financials and cap-table economics remain private.
