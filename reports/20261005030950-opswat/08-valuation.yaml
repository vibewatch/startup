      - - "Exit Liquidity"
        - "Viable strategic acquisition target for defense contractors or large cybersecurity platforms"
        - "Potential IPO window blockage if revenue scale falls below $200M or hardware mix suppresses gross margins"
        - "Verified revenue scale above $150M with gross margins exceeding 70% across hardware and software"
    notes: "Pillars contrast operational strengths against structural disclosure limitations across primary company statements."
