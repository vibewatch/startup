      - "Valuation & Multiple Logic"
      - "Key Risks & Downside Triggers"
      - "Probability Signal"
    rows:
      - - "Bull Case"
        - "25-30% ARR growth sustained; global defense and utility expansion; gross margin >75%; software subscription dominant"
        - "6.0x - 8.0x ARR; implied valuation $1.5B - $2.0B on projected $200M+ revenue; premium strategic or IPO exit"
        - "Budget contractions in government defense programs; commoditization of file sanitization engines"
        - "Medium-Low (25%): requires flawless execution and verified multi-hundred million revenue scale"
      - - "Base Case"
        - "15-20% ARR growth; steady adoption in nuclear, energy, and healthcare; blended software/hardware gross margin ~65-70%"
        - "3.5x - 5.0x ARR; implied valuation $600M - $900M; secondary liquidity or growth equity recapitalization"
        - "Lengthened enterprise sales cycles; margin compression from hardware supply chain and facility overhead"
        - "High (55%): aligns with historical bootstrapped discipline and moderate expansion in regulated verticals"
      - - "Bear Case"
        - "Growth decelerates to <10%; hardware drag and support overhead increase burn; customer churn in non-regulated tiers"
        - "<2.5x ARR or asset sale; down-round pressure on prior $125M growth mark; liquidity discount"
        - "Loss of critical certification; failure of newer AI offerings to gain enterprise traction; major breach"
        - "Medium-Low (20%): mitigated by high switching costs in operational critical infrastructure"
    notes: "Scenario multiples benchmarked against mature infrastructure software peers; baseline revenue remains unconfirmed."
