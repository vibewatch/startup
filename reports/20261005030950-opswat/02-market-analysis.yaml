callouts:
  - calloutType: insight
    title: The Industrial Air-Gap Security Paradox
    body: While critical infrastructure operators maintain physical or logical air-gaps to isolate high-value control systems, operational demands for vendor patching, telemetry analytics, and AI modeling continuously introduce external data. Without automated, policy-enforced file sanitization and hardware-enforced unidirectional diodes, ad-hoc media like USB drives bypass perimeter firewalls entirely, turning physical transfers into the primary vector for ransomware infection.
    claimRefs:
      - CM003
      - CM006
      - CM007
      - CM011
  - calloutType: risk
    title: Extended Procurement Inertia in Regulated Operations
    body: Despite surging cyber threat activity, sales cycle velocity in critical infrastructure remains constrained by dual-buyer procurement dynamics and prolonged utility rate-case cycles. Decisions requiring alignment between IT cybersecurity teams and conservative plant operations engineers frequently take 9 to 18 months, limiting rapid commercial expansion compared to pure-play enterprise SaaS competitors.
    claimRefs:
      - CM009
      - CM014
      - CM015
