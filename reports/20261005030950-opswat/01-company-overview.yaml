callouts:
  - calloutType: "insight"
    title: "Deterministic Prevention vs. Probabilistic Detection"
    body: "OPSWAT differentiates itself within critical infrastructure protection by operating on a deterministic sanitization model rather than relying solely on probabilistic signature and behavioral detection. Through Deep CDR, files are assumed malicious and reconstructed into clean representations, which provides unique protection in air-gapped nuclear and industrial environments but requires heavy processing performance and tight integration across enterprise workflows."
    claimRefs:
      - "CO003"
      - "CO004"
  - calloutType: "risk"
    title: "Financial Opacity and Valuation Verification Deficit"
    body: "Despite reporting operational scale including over 2,000 customers, 1,000 employees, and >25% YoY ARR expansion, OPSWAT maintains extreme financial opacity as a private entity. With no audited financial disclosures, unverified revenue estimates ranging near $105 million, and unconfirmed valuation rumors approaching $1.8 billion, underwriting an institutional valuation multiple requires direct access to the company's financial records, debt covenants, and capitalization table."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO012"
      - "CO013"
