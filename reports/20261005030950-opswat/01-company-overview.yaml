company:
  name: "OPSWAT"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in 2002 by CEO Benny Czarny and headquartered in Tampa, Florida, OPSWAT provides critical infrastructure protection (CIP) cybersecurity focused on threat prevention, content disarm and reconstruction (Deep CDR), and peripheral media inspection across IT, OT, and air-gapped environments. The company bootstrapped for nearly two decades before securing a $125 million growth investment in 2021, and while it reports over 2,000 customers and more than 1,000 employees with >25% ARR growth, audited financial statements and cap-table economics remain closely held private data."
sections:
  - id: "corporate-identity-and-mission"
    title: "Corporate Identity, Foundation, and Prevention Architecture"
    body: "OPSWAT was founded in 2002 by Benny Czarny from an apartment in San Francisco, operating on a foundational philosophy that diverges from conventional reactive cybersecurity: 'trust no file, trust no device.' Rather than relying purely on probabilistic detection, which the company argues is inherently imperfect against zero-day exploits and novel malware, OPSWAT built its core business around deterministic threat prevention. Its flagship MetaDefender platform combines Deep Content Disarm and Reconstruction (Deep CDR) to strip active malicious code and reconstruct safe files across more than 100 file types, multi-scanning across dozens of anti-malware engines, file-based vulnerability assessment, and proactive data loss prevention. Headquartered in Tampa, Florida, OPSWAT has expanded its operational footprint to 22 global offices and regional critical infrastructure protection (CIP) labs across the United States, Europe, and the Middle East, including a specialized hardware production facility in Tampa where it manufactures proprietary hardware solutions including MetaDefender Kiosk and data diodes. Commercial aggregators and company profiles note substantial operational scale in high-consequence sectors, citing adoption across 98% of U.S. nuclear power generation facilities and over 2,000 global enterprise and government accounts."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO007"
      - "CO010"
      - "CO011"
    tableRefs:
      - "TO001"
  - id: "governance-and-leadership"
    title: "Executive Leadership, Governance Structure, and Key-Person Exposure"
    body: "OPSWAT exhibits pronounced founder-led operational governance centered around Founder, Chief Executive Officer, and Chairman of the Board Benny Czarny, who has led the organization for over two decades since inception. Czarny holds an academic background in computer science from Technion - Israel Institute of Technology and previously served as an engineering manager at BindView before launching OPSWAT. The executive bench supporting Czarny includes Chief Financial Officer Simon Ho, Chief Information Security Officer and Chief Operating Officer Michael Barker, Chief Product Officer Yiyi Miao, Chief Marketing Officer Kat Lewis, and General Counsel Eric Spindel, complemented by global technical leadership under CTO Jan Miller. While the executive bench spans veteran enterprise security functions, the organization maintains high key-person dependence on Czarny due to his combined executive and board chair roles and his deep ongoing influence over product architecture and technology strategy. Third-party directory aggregators periodically show conflicting historical data on finance executive titles, reflecting the informational opacity common to closely held private enterprise software firms without publicly traded governance disclosures."
    claimRefs:
      - "CO002"
      - "CO005"
      - "CO006"
      - "CO014"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-scale"
    title: "Capitalization History, Private Market Metrics, and Commercial Scale"
    body: "Unlike typical venture-backed cybersecurity peers that raise sequential dilutive rounds, OPSWAT operated as a self-funded bootstrapped enterprise for nearly twenty years until closing a $125 million growth equity investment from institutional backer Brighton Park Capital on March 31, 2021. Tracxn and LeadIQ directories track this institutional transaction as OPSWAT's sole institutional financing round. In early 2026, OPSWAT announced that it delivered over 25% year-over-year growth in annual recurring revenue (ARR) during 2025, operating with a global workforce exceeding 1,000 employees and serving more than 2,000 customers worldwide. However, concrete dollar-denominated financial metrics—including audited GAAP revenue, precise ARR magnitude, gross margin percentages, EBITDA, and post-2021 valuation levels—are not publicly disclosed by the company. Third-party intelligence platforms such as RocketReach report unverified revenue estimates of $105 million for 2026, which conflict with earlier venture rumors and remain unverified without audited filings or cap-table disclosure. Furthermore, incident response case studies demonstrate that while MetaDefender solutions are deployed to mitigate severe ransomware outages in compromised healthcare networks, adverse operational exposure across air-gapped and industrial environments requires ongoing validation of third-party multi-scanning engine dependencies."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO012"
