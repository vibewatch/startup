  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Definitions, and Spend Segmentation
        blocks:
          - type: paragraph
            body: >-
              Critical infrastructure protection (CIP) cybersecurity bridges traditional enterprise information
              technology (IT) security, operational technology (OT), and industrial control systems (ICS). In industrial
              automation, energy utilities, defense, and healthcare facilities, cyber-physical assets cannot tolerate
              software latency, unverified updates, or uncontrolled network connectivity CM001 CM002. Consequently,
              security spending divides sharply between generic enterprise file sharing and specialized prevention-first
              data exchange solutions CM001 CM003. OPSWAT focuses specifically on high-assurance perimeter defense,
              peripheral media protection (kiosks and portable scanning drives), data diodes, and secure managed file
              transfer (MFT) equipped with Deep Content Disarm and Reconstruction (Deep CDR) CM001 CM003 CM004. Generic
              enterprise collaboration tools, commodity cloud drives, and basic consumer file sharing tools are
              explicitly excluded from high-security OT environments due to air-gap separation, regulatory mandates, and
              zero-trust policies CM003 CM005. Status-quo substitutes in industrial environments frequently consist of
              ad-hoc unmonitored USB transfers, legacy unencrypted SFTP connections, and manual paper-based air-gap
              workarounds CM003 CM006. These manual practices introduce acute operational risks, including unverified
              malware introduction, untracked supply chain patches, and severe regulatory non-compliance under
              frameworks such as NERC CIP, IEC 62443, and NIS2 CM003 CM007.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
