      - number: '6.2'
        title: Adoption Trajectory, Channel Ecosystem, and Practitioner Enablement
        blocks:
          - type: paragraph
            body: >-
              OPSWAT’s customer growth trajectory reflects multi-decade expansion from founder-led beginnings into an
              enterprise cybersecurity platform serving over 2,000 organizations globally by 2026. In February 2026, the
              company announced that it achieved over 25% year-over-year growth in annual recurring revenue (ARR) during
              2025, supported by a global workforce exceeding 1,000 employees and operations spanning 22 offices
              worldwide. Customer expansion is heavily reinforced by a global channel ecosystem and strategic technology
              integrations with enterprise infrastructure leaders including F5, SentinelOne, NetApp, and Amazon Web
              Services (AWS). To accelerate practitioner onboarding and build brand durability, OPSWAT operates OPSWAT
              Academy, an educational initiative that has registered over 484,000 students and issued more than 286,000
              professional certifications in critical infrastructure cybersecurity. Accredited as an ISC2 Continuing
              Professional Education (CPE) partner, OPSWAT Academy serves as a top-of-funnel adoption vehicle that
              familiarizes enterprise practitioners with MetaDefender workflows before procurement decisions occur.
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU008
              - CU009
              - CU010
