  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflows
        blocks:
          - type: paragraph
            body: >-
              OPSWAT's current product surface is organized around securing files, removable media, managed transfers,
              storage, email, endpoints, and segmented networks. In workflow terms, MetaDefender sits at an intake or
              transfer boundary: content is inspected before it enters a production application, storage repository,
              inbox, or isolated operational network. The breadth is meaningful because a regulated operator can apply
              related controls at cloud, on-premises, and physical-media boundaries, rather than buying only a point
              scanner. Evidence of use is uneven, however. The assigned material includes an OPSWAT-published account of
              a forensic provider using Managed File Transfer to move files from a compromised environment to a clean
              one, but it does not provide deployment volume, elapsed recovery time, false-positive rates, or an
              independently documented customer acceptance test. Consequently, the portfolio map below distinguishes
              marketed availability and partner-backed integration from independently verified production maturity.
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE007
          - type: table
