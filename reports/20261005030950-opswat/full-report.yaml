      - number: '2.2'
        title: 'Market Sizing Lenses: TAM, SAM, and Constrained Addressability'
        blocks:
          - type: paragraph
            body: >-
              Sizing the addressable market for OPSWAT requires evaluating multiple distinct analyst and industry lenses
              rather than relying on a single broad top-line projection CM008 CM009. Third-party research from
              MarketsandMarkets and GlobeNewswire projects the global Secure File Transfer (SFT) market to expand from
              $5.69 billion in 2026 to $8.34 billion by 2031, representing a compound annual growth rate (CAGR) of 8.0%
              CM008 CM009. Within this market, system-to-system transfers represent the largest deployment type, driven
              by automated recurring transactions in manufacturing, banking, and utility operations CM009. A broader
              software lifecycle engineering (SLE) lens tracked by Futurum Group forecasts spend growing from $235
              billion in 2025 to $344 billion by 2028 at a 15.4% CAGR, where automated verification, perimeter file
              inspection, and zero-trust ICAP integrations are increasingly mandated for production environments CM010.
              Within these expansive totals, OPSWAT serviceable addressable market (SAM) is tightly constrained to
              high-consequence critical infrastructure sectors requiring hardware-enforced unidirectional diodes,
              optical firewalls, and multi-engine inspection CM004 CM011. While leading players such as IBM, OPSWAT,
              Fortra, Progress Software, and Thru collectively control approximately 40% to 45% of the SFT market in
              2025, OPSWAT core beachhead remains specialized OT/IT cross-domain security and high-assurance nuclear and
              federal deployments CM008 CM012 CM013. Private financial disclosures remain opaque, leaving precise
              commercial SOM boundaries subject to ongoing diligence CM014 CM015 CM016.
