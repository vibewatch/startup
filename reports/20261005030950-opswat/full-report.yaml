              outside capital, reflecting an operationally disciplined, founder-led history under Benny Czarny since its
              2002 inception. Forward underwriting remains constrained because OPSWAT does not publish audited GAAP
              revenue, gross margin, cash burn, or net revenue retention figures. Until management discloses audited
              financial statements and cap-table preference terms, institutional investors must treat reported ARR
