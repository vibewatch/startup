      - number: '5.3'
        title: Maturity, partnerships, and operating dependencies
        blocks:
          - type: paragraph
            body: >-
              Recent evidence indicates continued investment in both software and hardware. OPSWAT says it introduced
              MetaDefender Drive with SmartTouch in October 2025, expanded Kiosk and Managed File Transfer capabilities,
              and brought hardware design and manufacturing into its Tampa production facility. Emerson separately
              announced an April 2026 reseller agreement whose first initiative integrates OPSWAT OT patch management
              with the Ovation Automation Platform; that is stronger integration evidence than a company logo, although
              the announcement does not disclose rollout dates, customer adoption, performance, or service levels.
              Hiring material for NetWall describes a product spanning firmware, embedded systems, networking, APIs,
              management software, and purpose-built hardware. This combination may improve control over sensitive
              deployments, but it also increases release coordination, component supply, field-service, upgrade, and
              support complexity. The assigned sources do not include a status history, support-SLA attainment, version
              lifecycle, recall record, or component-level reliability data with which to quantify those operating
              risks.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE012
      - number: '5.4'
        title: Trust controls and diligence verdict
        blocks:
          - type: paragraph
            body: >-
              OPSWAT reports quality and information-security controls including ISO 9001:2015, ISO/IEC 27001:2013 for
              specified cloud and management products, and SOC 2 compliance. It also reports that its Unit 515 red team
              found and responsibly disclosed 29 vulnerabilities in 2025. These are useful trust signals, but the
              assigned pool contains neither the certificates and audit boundaries nor independent test reports needed
              to establish their current scope. The homepage also publishes precise performance claims for predictive
              AI, multiscanning, content disarm, and sandbox efficiency. Those values should remain company-claimed
              until the underlying test methodology, workload, denominator, comparator, and full results are reviewed.
              The product thesis is therefore credible at the workflow and integration level, while technical
              underwriting remains conditional on independent throughput and efficacy testing, certification-scope
              review, uptime and incident history, supported-version matrices, and evidence that newer shared services
              are deployed consistently across the portfolio.
            claimRefs:
              - CE013
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Roadmap evidence is not installed-base evidence
            body: >-
              Current job postings describe a common platform, AI-native services, and broader NetWall capabilities, but
              they also frame adoption and modernization as work for incoming product leaders. Confirm released versions
              and installed use before underwriting those capabilities as portfolio-wide.
            calloutType: risk
            claimRefs:
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and High-Assurance Adoption
        blocks:
          - type: paragraph
            body: >-
              OPSWAT directs its cybersecurity platform toward highly regulated critical infrastructure protection (CIP)
              sectors where file-borne malware and unauthorized removable devices present catastrophic operational and
              national security risks. The company’s core commercial footprint spans energy and utilities, government
              and defense, financial services, healthcare and public health, and industrial manufacturing. According to
              commercial intelligence and company profiles, 98% of U.S. nuclear power generation facilities rely on
              OPSWAT’s cybersecurity and compliance solutions, demonstrating deep penetration across high-consequence
              operational technology (OT) environments. In broader critical infrastructure markets, OPSWAT reports
              protecting more than 2,000 customer organizations worldwide. Target buyers within these enterprises
              typically comprise Chief Information Security Officers (CISOs), OT security directors, plant managers, and
              compliance officers who require deterministic threat prevention rather than probabilistic detection.
              Across commercial deployments, customers integrate OPSWAT’s MetaDefender platform to inspect peripheral
              media at facility perimeters via MetaDefender Kiosk, secure air-gapped network enclaves via optical data
              diodes, and sanitize inbound files via Deep Content Disarm and Reconstruction (Deep CDR).
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
          - type: table
            tableRef: TU001
