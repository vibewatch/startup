      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Deterministic Prevention vs. Probabilistic Detection
            body: >-
              OPSWAT differentiates itself within critical infrastructure protection by operating on a deterministic
              sanitization model rather than relying solely on probabilistic signature and behavioral detection. Through
              Deep CDR, files are assumed malicious and reconstructed into clean representations, which provides unique
              protection in air-gapped nuclear and industrial environments but requires heavy processing performance and
              tight integration across enterprise workflows.
            calloutType: insight
            claimRefs:
