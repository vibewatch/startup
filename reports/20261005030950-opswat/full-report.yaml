      - number: '4.2'
        title: Operating Model and Gross Margin Drivers
        blocks:
          - type: paragraph
            body: >-
              The company's cost structure diverges significantly from traditional pure-play software vendors due to its
              integrated hardware manufacturing and global physical footprint. OPSWAT manufactures security hardware,
              such as MetaDefender Drive devices and optical data diodes, directly within its Tampa, Florida production
              facility, internalizing component supply chain risks and quality assurance. Operating expenses are heavily
              influenced by a global labor force exceeding 1,000 employees distributed across 22 offices worldwide,
              supporting a 24/7 follow-the-sun customer support and threat research apparatus. While proprietary
              hardware manufacturing depresses blended gross margins relative to standard 80% SaaS benchmarks, it
              establishes defensible perimeter moats in nuclear, defense, and public utility facilities where
              third-party hardware ingestion is strictly restricted.
            claimRefs:
              - CI008
