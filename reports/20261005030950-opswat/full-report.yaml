      - number: '1.2'
        title: Executive Leadership, Governance Structure, and Key-Person Exposure
        blocks:
          - type: paragraph
            body: >-
              OPSWAT exhibits pronounced founder-led operational governance centered around Founder, Chief Executive
              Officer, and Chairman of the Board Benny Czarny, who has led the organization for over two decades since
              inception. Czarny holds an academic background in computer science from Technion - Israel Institute of
              Technology and previously served as an engineering manager at BindView before launching OPSWAT. The
              executive bench supporting Czarny includes Chief Financial Officer Simon Ho, Chief Information Security
              Officer and Chief Operating Officer Michael Barker, Chief Product Officer Yiyi Miao, Chief Marketing
              Officer Kat Lewis, and General Counsel Eric Spindel, complemented by global technical leadership under CTO
              Jan Miller. While the executive bench spans veteran enterprise security functions, the organization
              maintains high key-person dependence on Czarny due to his combined executive and board chair roles and his
              deep ongoing influence over product architecture and technology strategy. Third-party directory
              aggregators periodically show conflicting historical data on finance executive titles, reflecting the
              informational opacity common to closely held private enterprise software firms without publicly traded
              governance disclosures.
