      - number: '6.3'
        title: Named Customer Deployments, Forensic Recovery, and Commercial Durability
        blocks:
          - type: paragraph
            body: >-
              Real-world customer proof underscores the operational necessity of OPSWAT’s MetaDefender platform during
              active security crises and production workflows. In a notable incident response deployment, boutique
              digital forensics firm Unique Wire utilized OPSWAT MetaDefender Managed File Transfer (MFT) to remediate a
              massive ransomware attack that fully compromised a major healthcare provider's internal server
              infrastructure. By establishing segregated 'dirty' and 'clean' networks and routing compromised patient
              records through MetaDefender MFT, Unique Wire sanitized all files with multi-scanning and Deep CDR before
              network migration, restoring operations without incurring regulatory fines or patient lawsuits.
              Furthermore, NATO member nations deploy OPSWAT MetaDefender data diodes listed on the NATO Information
              Assurance Product Catalogue (NIAPC) for cross-domain defense. However, despite documented high-profile
              case studies, OPSWAT maintains tight financial opacity regarding commercial contract durability. Public
              disclosures omit crucial unit economics, including Net Retention Rate (NRR), Gross Retention Rate (GRR),
              annual customer churn, and concentration among top accounts, leaving the long-term durability of newer
              offerings such as MetaDefender Aether an open diligence item.
            claimRefs:
