chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Prevention Architecture
        blocks:
          - type: paragraph
            body: >-
              OPSWAT was founded in 2002 by Benny Czarny from an apartment in San Francisco, operating on a foundational
              philosophy that diverges from conventional reactive cybersecurity: 'trust no file, trust no device.'
              Rather than relying purely on probabilistic detection, which the company argues is inherently imperfect
              against zero-day exploits and novel malware, OPSWAT built its core business around deterministic threat
              prevention. Its flagship MetaDefender platform combines Deep Content Disarm and Reconstruction (Deep CDR)
              to strip active malicious code and reconstruct safe files across more than 100 file types, multi-scanning
              across dozens of anti-malware engines, file-based vulnerability assessment, and proactive data loss
              prevention. Headquartered in Tampa, Florida, OPSWAT has expanded its operational footprint to 22 global
              offices and regional critical infrastructure protection (CIP) labs across the United States, Europe, and
              the Middle East, including a specialized hardware production facility in Tampa where it manufactures
              proprietary hardware solutions including MetaDefender Kiosk and data diodes. Commercial aggregators and
              company profiles note substantial operational scale in high-consequence sectors, citing adoption across
              98% of U.S. nuclear power generation facilities and over 2,000 global enterprise and government accounts.
            claimRefs:
