      - number: '2.3'
        title: Buyer Personas, Procurement Dynamics, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              Procurement dynamics in critical infrastructure environments feature divided stakeholder responsibilities
              and distinct budgetary authorities across IT and OT domains CM002 CM014. Enterprise Chief Information
              Security Officers (CISOs) and IT security directors primarily allocate funds for corporate compliance,
              data loss prevention (DLP), and cloud-native file inspection CM002 CM008. In contrast, OT directors, VP of
              Plant Operations, and SCADA engineering managers control industrial capital expenditures and prioritize
              system uptime, physical safety, deterministic data delivery, and zero disruption to operational control
              loops CM003 CM014. When bridging IT and OT networks, buying committees require consensus across both
              divisions, often involving plant managers, digital forensics teams, and compliance officers CM006 CM014.
              Adoption triggers typically stem from severe ransomware incidents on industrial systems, failed regulatory
              audits under NERC CIP or IEC 62443, or corporate mandates to connect air-gapped manufacturing lines to
              enterprise predictive maintenance and AI analytics platforms CM003 CM006 CM010. Procurement workflows
              frequently involve technical proof-of-concepts evaluating multiscanning throughput, offline kiosk
              usability, and hardware diode failover reliability before enterprise-wide rollout CM004 CM014.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM006
              - CM008
              - CM010
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
