      - number: '5.2'
        title: Architecture and deployment model
        blocks:
          - type: paragraph
            body: >-
              The technical model is layered rather than dependent on one detector. OPSWAT describes a portfolio
              combining multiengine malware detection, content disarm and reconstruction, data-loss prevention,
              sandboxing, threat intelligence, and vulnerability assessment. Joint AWS and OPSWAT guidance adds concrete
              integration detail: MetaDefender can be exposed through REST APIs, connected to S3 and ICAP-compatible
              infrastructure, or deployed as a container, packaged installer, or Amazon Machine Image. Those options
              support distributed inspection near the application or storage boundary, while air-gapped products extend
              the model to removable media and segmented OT networks. A current platform-leadership job posting also
              describes common identity, policy, observability, audit, high-availability, disaster-recovery, and
              deployment services. That posting is useful developer signal, but its mandate to accelerate adoption shows
              that a uniform shared-services substrate should be treated as roadmap and organizational intent, not proof
              that every product already uses the same production architecture.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE011
              - CE012
