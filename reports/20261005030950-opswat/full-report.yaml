            title: Grassroots Practitioner Pipeline via OPSWAT Academy
            body: >-
              With over 484,000 registered learners and 286,000 certified individuals, OPSWAT Academy functions as a
              massive, low-friction go-to-market engine. By providing free technical training and ISC2-accredited CPE
              credentials on MetaDefender tools, OPSWAT embeds its operational philosophy and product workflows into the
              cybersecurity workforce before formal procurement cycles begin.
            calloutType: strength
            claimRefs:
              - CU008
              - CU010
          - type: callout
            title: Critical Omission of Customer Retention and Concentration Metrics
            body: >-
              While OPSWAT publicizes top-line milestones—including over 2,000 customers and >25% YoY ARR growth—it
              completely withholds retention and cohort durability data. The absence of Net Retention Rate (NRR), Gross
              Retention Rate (GRR), and logo churn metrics obscures whether revenue growth is driven by expanding
              contract values or high gross churn masked by top-of-funnel customer acquisition.
            calloutType: risk
