evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: Complete historical registry of corporate officers, regional managing directors, and independent board directors.
    whyItMatters: >-
      Public sources provide a sample of key executive officers but lack complete subsidiary director and committee
      rosters.
    diligencePath: Review state corporate registry filings and board committee minutes for comprehensive officer enumeration.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financial-diligence
    missingEvidence: Audited GAAP financial statements including revenue, gross margin, EBITDA, cash flow, and ARR composition.
    whyItMatters: >-
      Without audited financial statements, enterprise valuation multiples, operating efficiency, and cash burn cannot
      be rigorously evaluated.
    diligencePath: Request confidential audited financial statements and board reporting packages under non-disclosure agreement.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Detailed capitalization table including founder shareholdings, preferred stock classes, debt instruments, and
      liquidation rights.
    whyItMatters: >-
      Evaluating economic returns and governance dynamics requires exact understanding of investor seniority and founder
      voting control.
    diligencePath: Examine cap-table management software records (e.g., Carta) or legal stock purchase agreements.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: diligence-gaps
    missingEvidence: >-
      Audited financial breakdown distinguishing OPSWAT software recurring revenue, hardware appliance revenue, and
      services across OT vs IT customer accounts.
    whyItMatters: >-
      Without segmented financial disclosures, estimating OPSWAT precise Serviceable Obtainable Market (SOM) and market
      share within high-assurance OT security relies on broad analyst projections.
    diligencePath: >-
      Request audited revenue by product family (MetaDefender Core, Kiosk, Diode, MFT) and net revenue retention (NRR)
      cohorts during formal sponsor diligence.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: ot-market-share
    missingEvidence: >-
      Granular market share and competitive win/loss metrics comparing OPSWAT OT offerings directly against Claroty,
      Nozomi Networks, and Dragos.
    whyItMatters: >-
      Affects assessment of whether OPSWAT's expansion into broader OT network security can achieve parity with
      established industrial visibility specialists.
    diligencePath: >-
      Obtain independent analyst market share reports (e.g., Gartner OT Security Market Guide) or customer RFP
      evaluation records.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: financial-reporting-gaps
    missingEvidence: Audited financial statements confirming GAAP revenue, gross margin, operating expenses, and cash flow.
    whyItMatters: >-
      Without audited financial statements, underwriting valuation, profitability, and burn rate relies entirely on
      self-reported ARR growth and unverified third-party estimates.
    diligencePath: Request audited financial statements and board-approved financial packages under NDA from OPSWAT management.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: customer-metrics
    missingEvidence: Audited customer count and customer concentration breakdown by ARR cohort.
    whyItMatters: >-
      Third-party estimates cite 1,000 customers whereas company releases cite over 2,000 customers, obscuring true
      account scale and average contract value.
    diligencePath: Obtain an anonymized customer account roster detailing ARR, contract start date, and industry vertical.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Customer acquisition cost, CAC payback period, net revenue retention (NRR), and gross revenue retention (GRR).
    whyItMatters: >-
      Sales efficiency and cohort expansion durability cannot be evaluated without verified cohort retention and
      acquisition cost data.
    diligencePath: Request historical cohort retention curves and GTM budget allocation breakdown from management.
    relatedTableRefs:
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: independent-performance-and-reliability
    missingEvidence: >-
      Independent efficacy, false-positive, latency, throughput, uptime, incident-history, and hardware-reliability
      evidence for current product versions and representative workloads.
    whyItMatters: >-
      Precise company-published performance values do not establish production behavior, service continuity, or failure
      modes without methodology, denominators, and independent replication.
    diligencePath: >-
      Obtain full benchmark protocols and results, customer acceptance tests, status and incident exports, SLA
      attainment, and hardware return or failure-rate data.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: shared-services-maturity
    missingEvidence: >-
      Released-version matrix showing which products currently use the common identity, policy, observability, audit,
      HA, DR, deployment, and AI services described in hiring material.
    whyItMatters: >-
      A platform-leadership mandate to accelerate adoption is not evidence that common services are already consistent
      across the installed portfolio.
    diligencePath: >-
      Review the current architecture inventory, product-by-product adoption dashboard, release notes, upgrade plans,
      and customer deployment telemetry.
    relatedQuestionRefs:
      - QE005
      - QE007
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: certification-and-control-scope
    missingEvidence: >-
      Current certificates, SOC 2 report scope and exceptions, product and facility boundaries, penetration-test
      results, secure-development controls, and remediation evidence.
    whyItMatters: >-
      Company summaries of standards and responsible disclosure do not establish which products, versions, systems, or
      operating processes are in audit scope.
    diligencePath: >-
      Inspect certificates and statements of applicability, review the SOC 2 report under NDA, and sample remediation
      records and product security test results.
    relatedQuestionRefs:
      - QE007
      - QE009
  - type: private-evidence-only
    severity: material
    topic: customer-retention-nrr
    missingEvidence: Audited historical Net Retention Rate (NRR), Gross Retention Rate (GRR), and cohort renewal figures.
    whyItMatters: >-
      Without retention benchmarks, it is impossible to evaluate whether >25% ARR growth reflects high expansion within
      satisfied customers or high gross churn offset by aggressive top-of-funnel sales.
    diligencePath: >-
      Request audited revenue cohort schedules and NRR/GRR bridge metrics from OPSWAT executive management during
      confidential diligence.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: minor
    topic: customer-concentration
    missingEvidence: Percentage of ARR contributed by top 10 and top 20 customer accounts, and average contract value (ACV).
    whyItMatters: >-
      High customer concentration in defense or nuclear facilities would expose OPSWAT to severe revenue volatility if
      key government or utility contracts lapse.
    diligencePath: Review customer concentration schedules and top-customer contract terms in the virtual data room.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU001
  - type: private-evidence-only
    severity: minor
    topic: sample-enumeration-named-customers
    missingEvidence: >-
      Comprehensive roster of enterprise and commercial clients beyond the anonymized healthcare and nuclear facility
      references.
    whyItMatters: Full customer rosters verify contract breadth across commercial sectors outside heavily regulated utilities.
    diligencePath: Request customer reference list across commercial banking, manufacturing, and healthcare sectors.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: >-
      Audited financial statements detailing annual GAAP revenue, ARR dollar base, gross margin, operating margin, and
      cash burn.
    whyItMatters: >-
      Without audited financial statements, valuation multiples cannot be anchored to verified cash flows or baseline
      revenue scale.
    diligencePath: >-
      Obtain audited income statements, balance sheets, and cash flow statements under non-disclosure agreement during
      formal confirmatory diligence.
    relatedQuestionRefs:
      - QV008
  - type: missing-source
    severity: material
    topic: cap-table
    missingEvidence: >-
      Complete capitalization table detailing share class structure, option pools, debt covenants, and Brighton Park
      liquidation preferences.
    whyItMatters: >-
      Senior liquidation preferences or debt facilities could impair common share equity realization in moderate exit
      scenarios.
    diligencePath: >-
      Request and review full cap-table spreadsheet and original Series D purchase agreements from management and legal
      counsel.
    relatedQuestionRefs:
      - QV008
