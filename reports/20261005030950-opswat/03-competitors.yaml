callouts:
  - calloutType: "insight"
    title: "The Air-Gap Moat: Cloud Resistance in Critical Infrastructure"
    body: "While cybersecurity venture investment has overwhelmingly favored cloud-native SaaS models, critical infrastructure environments—such as nuclear utilities, water systems, and defense facilities—remain fundamentally bound to physical air-gaps and on-premises controls. OPSWAT's deliberate hardware manufacturing in Tampa, Florida, and compliance certifications (e.g., NATO NIAPC listing, IEC 62443) create an institutional procurement barrier that general-purpose cloud security vendors cannot easily breach."
    claimRefs:
      - "CP001"
      - "CP003"
      - "CP005"
      - "CP006"
  - calloutType: "risk"
    title: "Commoditization & Enterprise Platform Absorption Risk"
    body: "OPSWAT faces ongoing risk that major enterprise security platforms will expand their native content disarm and file sanitization capabilities to the point where general commercial enterprises no longer justify a standalone perimeter file security solution. If cloud email and storage providers bundle adequate CDR and sandbox screening, OPSWAT's addressable growth may become increasingly confined to high-security air-gapped niches."
    claimRefs:
      - "CP002"
      - "CP004"
      - "CP007"
      - "CP011"
