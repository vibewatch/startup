    title: "Roadmap evidence is not installed-base evidence"
    body: "Current job postings describe a common platform, AI-native services, and broader NetWall capabilities, but they also frame adoption and modernization as work for incoming product leaders. Confirm released versions and installed use before underwriting those capabilities as portfolio-wide."
    claimRefs:
      - "CE011"
      - "CE012"
