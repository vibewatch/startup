schemaVersion: "report-v2"
artifact: financials
slug: yassir
runDate: 2026-10-22
company:
  name: Yassir
chapter:
  number: 4
  title: Financials
  summary: >-
    Yassir has a plausible multi-stream model spanning mobility, delivery, payments,
    business transport, retail, and advertising, but the public evidence does not
    disclose revenue, take rate, gross margin, burn, cash, or debt. A 2026 article's
    financing figures are internally inconsistent, so capital adequacy remains
    un-underwritable without management records.
sections:
  - id: revenue-model
    title: Revenue model and mix
    body: >-
      Yassir's economic architecture is broader than a ride-hailing marketplace.
      Third-party descriptions identify transaction commissions across rides,
      deliveries, and payments, while the company-authored app listing shows the
      operating surfaces: Yassir Go, Express, Market, and Pay. Inference Partners,
      an investor and therefore not independent evidence, describes mobility and
      delivery as the entry point for payment infrastructure. The 2026 acquisition
      narrative adds physical grocery retail and programmatic advertising as
      potential revenue lines. This breadth can increase purchase frequency and
      cross-sell opportunities, but no retained source quantifies revenue by stream,
      realized take rate, payment fees, retail sales, or advertising contribution.
      The result is a credible mechanism map without evidence of revenue quality,
      concentration, or accounting recognition.
    claimRefs: [CI001, CI002, CI003, CI005, CI014, CI015]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-gtm
    title: Pricing, go-to-market, and sales-efficiency proxies
    body: >-
      Public pricing evidence is descriptive rather than numerical. The app listing
      separates affordable, comfort, larger-vehicle, hourly, women-driver, and
      premium ride categories and supports cash, bank-card, and wallet payments,
      but it publishes no retained fare card, delivery fee schedule, merchant
      commission, subscription, enterprise contract, or wallet fee. Yassir Business
      is positioned around centralized travel records and fleet-cost control,
      indicating a business sales motion alongside consumer acquisition. Reported
      scale of more than eight million users and at least 100,000 partners is a
      distribution proxy, not proof of active users, paying customers, retention,
      or efficient acquisition. The retained evidence therefore cannot calculate
      CAC, payback, sales-cycle length, discounting, or channel economics.
    claimRefs: [CI002, CI004, CI006, CI007, CI008, CI015]
    tableRefs: [TI002]
  - id: unit-economics
    title: Cost structure and unit economics
    body: >-
      The marketplace model can be asset-light at the driver and courier layer,
      yet delivery, support, incentives, payment operations, compliance, and
      geographic localization can consume contribution margin. AlgeriaTech notes
      that managed foreign exchange, price-sensitive demand, and pricing controls
      constrain aggressive subsidy strategies; its regulatory analysis also
      implies recurring city-level compliance costs. A general Africa fintech
      benchmark quoted by Mikal Khoso places customer acquisition as high as $20
      against $7 of revenue, but that benchmark is not Yassir-specific and cannot
      be inserted into a Yassir model. No retained source discloses gross margin,
      contribution margin, incentives, refunds, utilization, working capital,
      capex, or cohort behavior. Each missing input must be obtained by market and
      service before an operating model is credible.
    claimRefs: [CI008, CI013, CI015, CI016]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and financial verdict
    body: >-
      Financing evidence does not establish liquidity. International Finance
      reported $193.25 million raised since 2017 as of November 2023. AlgeriaTech
      later described an approximately $105 million internal Series C in 2025 while
      also saying cumulative funding was around $193 million; those figures do not
      reconcile and should not be converted into cash available. The same 2026
      reporting describes acquisitions of Uno Hypermarkets and Kawarizmi, while
      regulatory analysis anticipates compliance spending. These moves can deepen
      the operating moat but may also add inventory, leases, integration cost, and
      working-capital exposure. The funding chronology can be read with Company
      Overview, but the financial verdict is narrower: revenue quality, margin path,
      burn, runway, debt obligations, and next-round triggers remain blocked pending
      bank statements, audited accounts, and segment-level management reporting.
    claimRefs: [CI009, CI010, CI011, CI012, CI014, CI015, CI016]
callouts:
  - calloutType: risk
    title: Capital raised is not cash available
    body: >-
      The retained reporting does not reconcile the reported 2025 round with the
      repeated cumulative-funding figure, and none of the sources discloses current
      cash, burn, debt, acquisition consideration, or restricted funds.
    claimRefs: [CI010, CI011, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Unit, Public status, Evidence quality, Diligence ask]
    rows:
      - [Ride-hailing, "Transaction commission or fee", "Completed ride", "Live; numerical take rate unavailable", "Secondary description plus company product listing", "Net revenue, gross bookings, take rate, incentives, and refunds by city"]
      - [Food and grocery delivery, "Transaction commission and delivery fee", "Completed order", "Live; fee schedule unavailable", "Secondary description plus company product listing", "GMV, take rate, courier cost, refunds, and contribution margin"]
      - [Payments and wallet, "Payment-processing or financial-service fees", "Payment or wallet user", "Live in-app payment rail; monetization unquantified", "Investor thesis plus company product listing", "TPV, active wallets, fee yield, float treatment, losses, and licensing costs"]
      - [Business mobility, "Enterprise transport and expense-management contract", "Trip, employee, or account", "Service described; pricing unavailable", "Independent article quoting company service description", "Contract value, gross retention, sales cycle, and service cost"]
      - [Physical grocery retail, "Retail gross margin and delivery cross-sell", "Basket or store", "Acquisition reported in 2026; contribution unverified", "Single independent analytical source", "Purchase consideration, store P&L, inventory turns, leases, and working capital"]
      - [Retail media and advertising, "Advertising or media-service revenue", "Campaign, impression, or managed spend", "Acquisition reported in 2026; contribution unverified", "Single independent analytical source", "Revenue, gross margin, advertiser concentration, and integration cost"]
    notes: >-
      Mechanisms are reported or inferred from retained sources; no row supplies
      audited revenue, realized pricing, mix, or recognition policy, and null
      economics require the listed diligence request.
    claimRefs: [CI001, CI002, CI003, CI005, CI014, CI015]
  - id: TI002
    title: Pricing and monetization visibility
    columns: [Offering, Public package or payment signal, List price, Realized price, Discount evidence, Underwriting implication]
    rows:
      - [Yassir Go, "Classic, Comfort, Space, Chrono, Women, and Premium categories", "Unavailable", "Unavailable", "Promotions mentioned but not quantified", "Cannot model fare, commission, subsidy, or city-level price realization"]
      - [Yassir Express, "Restaurant ordering and delivery", "Unavailable", "Unavailable", "Offers and promo codes mentioned but not quantified", "Cannot separate merchant fee, consumer fee, courier cost, or promotional burn"]
      - [Yassir Market, "Grocery basket and doorstep delivery", "Unavailable", "Unavailable", "Offers mentioned but not quantified", "Cannot measure basket margin, shrink, inventory risk, or delivery contribution"]
      - [Yassir Pay, "Cash, bank-card, and wallet payment options", "Unavailable", "Unavailable", "Exclusive discounts mentioned but not quantified", "Cannot measure payment yield, processing cost, or wallet economics"]
      - [Yassir Business, "Centralized employee transport records and fleet-cost control", "Unavailable", "Unavailable", "No enterprise terms retained", "Cannot assess ACV, implementation cost, sales cycle, or retention"]
    notes: >-
      Product and payment options come from the company-authored app listing and
      independent service descriptions; no retained source provides a current fare
      card, merchant schedule, enterprise quote, or realized transaction price.
    claimRefs: [CI001, CI002, CI004, CI015]
  - id: TI003
    title: Unit economics and capital-adequacy diligence
    columns: [Metric, Public value, Confidence, Why it matters, Required evidence]
    rows:
      - [Active paying users, "Unavailable; 8M+ total users reported historically", "Low", "Registered reach cannot establish monetized activity or retention", "Monthly active, transacting, and retained cohorts by service and city"]
      - [Marketplace take rate, "Unavailable", "None", "Primary bridge from GMV or bookings to net revenue", "Gross bookings, net revenue, commissions, taxes, refunds, and incentives"]
      - [Gross and contribution margin, "Unavailable", "None", "Tests whether delivery, mobility, payments, and retail scale economically", "Segment gross profit and contribution margin with cost-allocation policy"]
      - [CAC and payback, "Unavailable; $20 CAC / $7 revenue is a non-company Africa fintech benchmark", "Low", "A general benchmark cannot substitute for Yassir cohorts", "Paid and organic CAC, first-order subsidy, LTV, and payback by channel"]
      - ["Cash, burn, and runway", "Unavailable", "None", "Determines financing dependency and timing risk", "Current bank balances, restricted cash, monthly net burn, and board runway plan"]
      - [Debt and acquisition obligations, "Unavailable", "None", "Retail assets and acquisitions may add debt, leases, inventory, and integration cash needs", "Debt schedule, lease liabilities, consideration terms, earn-outs, and project-finance obligations"]
      - [Reported financing, "$193.25M by Nov. 2023; later $105M round and ~$193M cumulative figures conflict", "Low", "Funding raised neither reconciles nor establishes liquidity", "Signed financing documents, cap table, cash proceeds, secondary component, and use-of-funds bridge"]
    notes: >-
      Values are public disclosures or explicit gaps, not estimates. The general
      fintech benchmark is not attributed to Yassir, and reported financing must
      not be treated as cash on hand.
    claimRefs: [CI006, CI008, CI010, CI011, CI015, CI016]
figures:
  - id: FI001
    title: Revenue mechanism bridge with underwriting gaps
    type: flow
    summary: >-
      Customer activity can feed several monetization surfaces, but the public
      bridge stops before revenue quality and gross profit can be quantified.
    data:
      nodes:
        - id: consumer-demand
          label: Consumer demand
          detail: Reported user reach creates transaction opportunities but does not establish active paying cohorts.
        - id: mobility
          label: Mobility trips
          detail: Ride categories are visible; fare, take rate, incentives, and refunds are not.
        - id: delivery
          label: Food and grocery orders
          detail: Ordering surfaces are visible; GMV, merchant fees, courier cost, and basket margin are not.
        - id: business
          label: Business transport
          detail: Expense tracking and fleet substitution are described; enterprise pricing and retention are not.
        - id: payments
          label: Payment rail
          detail: Cash, cards, and wallet are supported; TPV, fee yield, processing cost, and losses are not.
        - id: transaction-revenue
          label: Transaction revenue
          detail: Secondary reporting describes commissions across rides, delivery, and payments.
        - id: profit-gap
          label: Gross-profit gap
          detail: Revenue mix, recognition, gross margin, contribution margin, and cash conversion remain unavailable.
      edges:
        - {from: consumer-demand, to: mobility}
        - {from: consumer-demand, to: delivery}
        - {from: consumer-demand, to: business}
        - {from: mobility, to: transaction-revenue}
        - {from: delivery, to: transaction-revenue}
        - {from: business, to: transaction-revenue}
        - {from: payments, to: transaction-revenue}
        - {from: transaction-revenue, to: profit-gap}
    approximationNotes: >-
      Conceptual mechanism only; node order is not proportional to revenue,
      transaction volume, margin, or conversion.
    claimRefs: [CI001, CI003, CI005, CI015]
