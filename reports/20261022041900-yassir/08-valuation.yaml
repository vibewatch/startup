slug: yassir
runDate: 2026-10-22
company:
  name: Yassir
chapter:
  number: 8
  title: Valuation
  summary: >-
    Yassir has meaningful product and footprint signals, but retained public evidence does not
    reconcile its reported financing history or disclose the financial and preference inputs
    needed to price common equity. The appropriate stance is research-more: preserve optionality,
    require primary diligence, and do not anchor an entry price to reported private marks.
sections:
  - id: recommendation
    title: Recommendation and entry discipline
    body: >-
      The public file supports a real multi-service platform rather than a concept-stage company:
      Yassir's own surfaces describe millions of downloads, a large partner network, multiple
      markets, and an application spanning mobility, delivery, groceries, and payments. Those
      indicators establish reach, not equity value. The retained sources provide no current
      revenue, gross profit, contribution margin, cash, debt, ownership, or liquidation-preference
      schedule. Financing reporting is also internally difficult to reconcile: one source repeats
      roughly $193 million of cumulative funding after the 2022 Series B, while a later article
      reports an approximately $105 million internal Series C in 2025 yet still gives roughly the
      same cumulative total. With no signed terms or financial denominator, the recommendation is
      research-more, confidence is low, risk is high, and entry discipline should override every
      headline valuation.
    claimRefs: [CV001, CV005, CV006, CV007, CV008, CV009, CV010, CV011]
    tableRefs: [TV001]
  - id: thesis-antithesis
    title: Thesis and anti-thesis
    body: >-
      The thesis is that an established consumer and partner network can support cross-service
      monetization: rides can seed delivery demand, transaction frequency can support payments,
      and a broader service bundle can improve retention. Company-controlled app listings confirm
      that these services coexist, while an investor profile reports more than eight million users.
      The anti-thesis is equally material. Reported scale figures vary across company-controlled
      surfaces without common dates or denominators, and public sources do not show whether any
      vertical produces positive contribution margin after incentives, refunds, support, and
      compliance. An expanding surface area may therefore increase capital needs faster than it
      creates cash. The view improves only with cohort-level cross-use, take-rate, loss-rate, and
      contribution-profit evidence; it worsens if those data reveal subsidized or geographically
      fragile activity.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV015]
    tableRefs: [TV002]
  - id: scenarios
    title: Scenario and valuation framework
    body: >-
      No numerical fair-value range is supportable from this source pool. A reported one-billion-
      dollar peak and a later $600 million to $800 million estimate are third-party reference points,
      not audited marks, transaction prices, or proof of cash available to the company. The bull
      case requires verified growth and positive contribution economics across the core marketplace,
      plus evidence that payments improve monetization without unacceptable credit or compliance
      exposure. The base case assumes a strategically relevant platform whose cash generation and
      financing needs remain uncertain. The bear case combines multiple compression with regulatory
      friction, weak unit economics, or geographic retrenchment. Probability signals should therefore
      come from operating data and signed financing documents, not from assigning invented odds to
      incomplete public information.
    claimRefs: [CV007, CV008, CV009, CV010, CV011, CV012, CV013, CV014]
    tableRefs: [TV003]
  - id: exit-diligence
    title: Exit readiness, diligence asks, and thesis breaks
    body: >-
      Exit readiness remains unproven because the retained evidence identifies neither a credible
      liquidity timetable nor comparable transactions with matched growth, margin, geography, and
      regulatory exposure. Primary diligence should obtain the signed 2025 financing package,
      fully diluted cap table, preference stack, secondary-sale detail, monthly financials, cash
      runway, and city-by-city cohort economics. Regulatory diligence should separately confirm the
      legal basis for mobility and payments in each material jurisdiction. AlgeriaTech reports that
      updated Algerian VTC rules were expected in 2026, and Africa Intelligence published an adverse
      France headline whose article body remained inaccessible in the retained fetch. Thesis-break
      triggers are a material suspension, evidence that France reflects broader group stress, an
      unreconciled preference overhang, or persistently negative contribution margin. Only verified
      improvement on those tests should permit a higher entry price.
    claimRefs: [CV011, CV014, CV016]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary table
    columns: [Dimension, Current assessment, Decision implication]
    rows:
      - [Recommendation, research-more, Do not price common equity before primary financial and financing diligence.]
      - [Confidence, low, Product and footprint evidence is stronger than valuation evidence.]
      - [Risk rating, high, Financing ambiguity and regulatory execution leave downside unbounded.]
      - [Valuation stance, unsupported by current public evidence, Treat reported private marks as context rather than fair value.]
      - [Entry discipline, terms-first, Require signed round terms and a return model based on verified operating data.]
    notes: "Assessment uses public sources accessed on 2026-10-22; unavailable audited financials, cap-table terms, and transaction documents are not estimated."
    claimRefs: [CV001, CV006, CV011, CV012, CV014, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, Evidence status, What would change the view]
    rows:
      - [Multi-service reach can support cross-sell, "Company-controlled listings show rides, food, groceries, and payments in one application.", Verify cross-service cohorts and retention by city.]
      - [Scale may create a local network advantage, An investor profile reports more than eight million users and the official site reports substantial downloads and partners., "Reconcile active users, downloads, partners, and transaction frequency on one date."]
      - [Reported scale is not proven economics, No retained source supplies current segment revenue or contribution margin., Provide audited segment P&L and incentive-adjusted unit economics.]
      - [Breadth may amplify capital and compliance needs, The platform spans services and jurisdictions while Algerian VTC rules continue to evolve., Demonstrate positive cash conversion and current permissions in each material market.]
    notes: "Scale figures use different labels and unspecified measurement dates; downloads, users, partners, and cities are not treated as interchangeable metrics."
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV014, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, Core marketplace and payments show positive contribution economics with durable cohort growth., A premium could be considered only from verified forward cash generation; no public numeric range is supportable., Audited margin expansion and repeat cross-service usage., Regulatory suspension or failure to convert reach into contribution profit.]
      - [Base, Platform remains relevant but capital needs and regulatory work keep cash generation uncertain., Invest only at a price and preference structure that protects target returns under slower growth., Reconciled financing terms and stable core-market cohorts., Runway shortfall or preference stack materially dilutes common equity.]
      - [Bear, Weak economics or geographic setbacks coincide with private-market multiple compression., Down-round structured financing or impaired common value is possible; no public downside floor is calculable., Confirmed retrenchment or inability to raise on clean terms., Broader group stress or persistent negative contribution margin.]
      - [Research gate, Management provides current financials cap table legal evidence and matched comparables., Build a return model only after evidence closes the named gaps., Complete data-room reconciliation., Any valuation-critical input remains stale private or contradictory.]
    notes: "Scenarios are qualitative decision conditions, not forecasts; probabilities and numeric valuation ranges are omitted because the retained evidence lacks current financial denominators and signed financing terms."
    claimRefs: [CV011, CV012, CV014, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Scale and product breadth create option value, but missing economics and unresolved downside evidence prevent a price-supported investment recommendation.
    data:
      nodes:
        - id: footprint
          label: Scale signals
          detail: Downloads, users, partners, markets, and cities indicate reach but use different denominators.
        - id: breadth
          label: Product breadth
          detail: Mobility, food, groceries, and payments create cross-service potential.
        - id: financing
          label: Financing ambiguity
          detail: Reported round and cumulative-funding figures do not reconcile cleanly.
        - id: valuation
          label: Unverified marks
          detail: Reported valuation points are not audited current transaction prices.
        - id: downside
          label: Downside tests
          detail: Regulation, France, unit economics, runway, and preferences require primary diligence.
        - id: decision
          label: Research-more
          detail: Price common equity only after the evidence supports a return model.
    approximationNotes: "The flow is a qualitative decision chain; it does not imply quantified conversion rates, probabilities, or value weights."
    claimRefs: [CV005, CV011, CV013, CV014, CV016]
callouts:
  - calloutType: recommendation
    title: Research-more, not buy
    body: >-
      Public evidence supports operating relevance but not a defensible entry value. Obtain signed
      terms, current economics, and a preference-aware return model before underwriting.
    claimRefs: [CV011, CV012, CV014]
  - calloutType: risk
    title: Do not convert funding into cash
    body: >-
      Reported capital raised is historical financing activity, not evidence of current liquidity,
      runway, or value available to common shareholders.
    claimRefs: [CV007, CV008, CV009, CV010, CV011]
