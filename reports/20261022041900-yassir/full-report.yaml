              - CO006
              - CO007
      - number: '1.3'
        title: Operating footprint, milestones and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              Public descriptions place Yassir across Algeria and other Maghreb, Francophone African and diaspora
              markets, but the reported footprint changes by source and date. Inference Partners says six countries and
              45 cities with more than eight million users and more than 100,000 partners; the Apple listing, a
              company-issued app-store surface, says more than 150,000 partners in 58 cities. The difference may reflect
              expansion or different definitions, so it should not be collapsed into one current metric. The regulatory
              source describes an evolving Algerian VTC framework and says compliance is becoming a competitive
              capability, while its account also reports Yassir-specific funding and valuation estimates that differ
              from other sources. A 2026 company overview therefore supports identity and strategic scale, but leaves
              current financial performance, governance, regulatory status by country and adverse-event completeness
              open.
