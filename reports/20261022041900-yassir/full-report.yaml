  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not “all African fintech” or “all mobility.” It is the digitally mediated spend
              around recurring urban needs: point-to-point rides, prepared-food and grocery delivery, and payments
              attached to those transactions. Yassir’s app listing explicitly groups Yassir Go, Yassir Express, Yassir
              Market, and Yassir Pay, while describing cash, cards, and wallet payments. That supports a multi-sided
              marketplace boundary with consumers, drivers, merchants, and payment counterparties. The excluded market
              includes general banking, offline taxi and retail spend that never enters the platform, and unlaunched
              financial products. Status-quo substitutes remain cash, street taxis, direct restaurant ordering, physical
              grocery trips, bank cards, and informal remittance channels. The boundary matters because a
              combined-services narrative can overstate addressable spend if each vertical's users, geography, and
              take-rate base are not identical.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Sizing lenses and evidence limits
        blocks:
          - type: paragraph
            body: >-
              The available evidence supports multiple sizing lenses but not a clean, independently audited TAM/SAM/SOM
              bridge. A 2023 analyst article places the population of Francophone Africa at about 150 million, but
              population is context rather than addressable spend. Inference Partners and the same article describe an
              earlier footprint of more than 8 million users across 45 cities, while a current app listing claims more
              than 150,000 partners in 58 cities; these measures use different denominators and should not be silently
              reconciled. A February 2026 analysis attributes $225.9 million of annual revenue to Yassir for December
              2024, but revenue is neither market size nor ARR and the figure is not audited in the retained evidence.
              The decision-useful lens is therefore reachable urban demand in licensed cities, conditioned on active
              users, transaction frequency, GMV, and take rates. A headline regional TAM remains a diligence gap until
              those inputs are disclosed on a common period.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM009
      - number: '2.3'
        title: Buyers, adoption path, and constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption is a sequence rather than one buyer motion. Consumers initiate rides, food orders, grocery
              purchases, and payments; drivers and delivery agents supply capacity; merchants pay for demand and
              fulfillment; and employers can own a separate corporate-travel budget. The likely wedge is a frequent,
              trust-sensitive ride, followed by higher-frequency delivery and then payment use. Inference Partners
              describes the payment thesis as using on-demand services as a “trojan horse to get into payments,” which
              is a mechanism hypothesis, not proof of payment economics. Regulation is a gating constraint: April 2026
              coverage says Algeria's VTC and taxi rules were still evolving and reports that Morocco effectively
              blocked ride-hailing apps in October 2025. A separate analyst account says financial-service expansion
              across emerging markets requires country-specific payment integrations, regulatory work, and data
              localization, while lending may expose the provider's own balance sheet. Switching costs can rise through
              stored credentials, merchant integrations, and multi-service convenience, but price sensitivity, local
              licensing, currency controls, service reliability, and cash preference can slow conversion. The market is
              therefore city-by-city and vertical-by-vertical, not a frictionless continental rollout.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The market thesis is sequencing, not a single TAM
            body: >-
              The strongest evidence supports a mobility-led, multi-vertical adoption path. Payments may improve
              retention and merchant economics, but the public record does not yet establish its transaction volume,
              take rate, or contribution margin.
            calloutType: insight
            claimRefs:
              - CM002
              - CM008
              - CM012
          - type: callout
            title: Regulation can redefine the serviceable market
            body: >-
              Algeria's evolving VTC framework and Morocco's reported 2025 shutdown show that licensing and local
              operating permissions can matter more than capital or product breadth for the reachable market.
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Yassir competes across several overlapping markets rather than against one uniform peer set. AlgeriaTech
              identifies Yassir, Temtem, and Heetch as the principal locally rooted ride-hailing platforms in Algeria
              after Yango's 2024 exit, while Tracxn names inDrive as Yassir's leading company-level competitor. A
              separate 2023 analyst review broadens the relevant set to Uber and Bolt in mobility, Glovo in delivery,
              and Gozem as a Francophone African super-app. Buyers can also remain with licensed taxis, order directly
              from merchants, or operate an internal fleet or dispatch workflow. Those substitutes lack a common
              reporting basis, so funding, users, partners, downloads, trips, drivers, and geographic presence should
              not be treated as interchangeable measures of competitive scale.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
