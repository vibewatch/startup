      Assessment uses public sources accessed on 2026-10-22; unavailable audited financials, cap-table terms, and
      transaction documents are not estimated.
    claimRefs:
      - CV001
      - CV006
      - CV011
      - CV012
      - CV014
      - CV016
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence status
      - What would change the view
    rows:
      - - Multi-service reach can support cross-sell
        - Company-controlled listings show rides, food, groceries, and payments in one application.
        - Verify cross-service cohorts and retention by city.
      - - Scale may create a local network advantage
        - >-
          An investor profile reports more than eight million users and the official site reports substantial downloads
          and partners.
        - Reconcile active users, downloads, partners, and transaction frequency on one date.
      - - Reported scale is not proven economics
        - No retained source supplies current segment revenue or contribution margin.
        - Provide audited segment P&L and incentive-adjusted unit economics.
      - - Breadth may amplify capital and compliance needs
        - The platform spans services and jurisdictions while Algerian VTC rules continue to evolve.
        - Demonstrate positive cash conversion and current permissions in each material market.
    notes: >-
      Scale figures use different labels and unspecified measurement dates; downloads, users, partners, and cities are
      not treated as interchangeable metrics.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV014
      - CV015
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Core marketplace and payments show positive contribution economics with durable cohort growth.
        - >-
          A premium could be considered only from verified forward cash generation; no public numeric range is
          supportable.
        - Audited margin expansion and repeat cross-service usage.
        - Regulatory suspension or failure to convert reach into contribution profit.
      - - Base
        - Platform remains relevant but capital needs and regulatory work keep cash generation uncertain.
        - Invest only at a price and preference structure that protects target returns under slower growth.
        - Reconciled financing terms and stable core-market cohorts.
        - Runway shortfall or preference stack materially dilutes common equity.
      - - Bear
        - Weak economics or geographic setbacks coincide with private-market multiple compression.
        - Down-round structured financing or impaired common value is possible; no public downside floor is calculable.
        - Confirmed retrenchment or inability to raise on clean terms.
        - Broader group stress or persistent negative contribution margin.
      - - Research gate
        - Management provides current financials cap table legal evidence and matched comparables.
        - Build a return model only after evidence closes the named gaps.
        - Complete data-room reconciliation.
        - Any valuation-critical input remains stale private or contradictory.
    notes: >-
      Scenarios are qualitative decision conditions, not forecasts; probabilities and numeric valuation ranges are
      omitted because the retained evidence lacks current financial denominators and signed financing terms.
    claimRefs:
      - CV011
      - CV012
      - CV014
      - CV016
