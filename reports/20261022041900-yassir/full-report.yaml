chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Yassir was founded in 2017 by Noureddine Tayebi and Mahdi (El Mahdi) Yettou, beginning with ride-hailing
              in Algeria and expanding into a multi-sided marketplace. TechCrunch reports that the company added
              last-mile delivery and connected drivers, couriers, merchants, suppliers and wholesalers to individual
              users. Its stated strategic logic is to use recurring daily services to build trust and distribution for
              payments, rather than launch financial products as a standalone fintech. The current product surfaces
              describe Yassir Go for rides, Yassir Express for food, Yassir Market for groceries and Yassir Pay for
              transactions. An independent investment profile similarly describes the payment infrastructure thesis, but
              the public evidence does not establish current transaction volume, take rate or profitability.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
