              - CO014
      - number: '1.2'
        title: Leadership, funding and disclosed scale
        blocks:
          - type: paragraph
            body: >-
              Noureddine Tayebi is the consistently identified chief executive and founder; Inference Partners describes
              him as a Stanford PhD who spent more than 15 years in Silicon Valley before returning to Algeria.
              TechCrunch identifies Mahdi Yettou as co-founder and reports a $30 million Series A in 2021, following a
              previously undisclosed $13.25 million seed round. Later sources describe a much larger 2022 Series B and
              additional 2025 financing, but their figures conflict: the Algerian Startups directory says approximately
              $150 million in 2022, while AlgeriaTech reports approximately $105 million of internal Series C financing
              in 2025 and about $193 million cumulative funding. These are reported figures, not audited cap-table
              evidence. No assigned source gives a complete board, executive team, ownership, liquidation preference or
              debt schedule.
            claimRefs:
