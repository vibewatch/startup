  - id: FM001
    title: Constrained market-sizing lens
    type: pyramid
    summary: >-
      The reachable market narrows from broad urban-service spend to licensed, active, monetizable city demand; public
      evidence supports the layers but not their numeric conversion.
    data:
      items:
        - label: Urban daily-service spend
          value: Broad boundary
          valueNote: Includes mobility, delivery, and payments; no defensible aggregate supplied
        - label: Digitally addressable urban demand
          value: Unquantified
          valueNote: Requires smartphone, service, and payment adoption by city
        - label: Yassir-covered city demand
          value: 45-58 cities reported
          valueNote: Sources use different city and period definitions
        - label: Active multi-service users
          value: '>8 million reported'
          valueNote: User definition and activity period are not disclosed
        - label: Licensed monetizable demand
          value: Not disclosed
          valueNote: Requires active licenses, supply capacity, GMV, and take rates
        - label: Defensible SAM / SOM
          value: Not calculable
          valueNote: Management operating data required
    approximationNotes: >-
      This is an evidence-constrained ordered lens, not a proportional funnel. Values retain source qualifiers and are
      not converted into percentages.
    claimRefs:
      - CM004
      - CM005
      - CM007
      - CM009
  - id: FP001
    title: Competitive positioning by documented breadth and regulatory alignment
    type: quadrant
    summary: >-
      Yassir has the broadest documented service set, while Heetch has the strongest explicit licensed-supply posture;
      midpoint scores denote missing specific alignment evidence rather than average performance.
    data:
      xAxis:
        label: Documented service breadth
        min: 1
        max: 5
        low: Single vertical
        high: Mobility plus delivery, commerce, and payments
        description: Ordinal 1-5 analyst coding from the retained product evidence
        scale: ordinal
      yAxis:
        label: Reported local or regulatory alignment
        min: 1
        max: 5
        low: Adverse exit or poor fit
        high: Explicit licensed or locally embedded model
        description: Ordinal 1-5 analyst coding; 3 means no specific alignment evidence
        scale: ordinal
      points:
        - label: Yassir
          x: 5
          'y': 4
          detail: Four-service official portfolio and locally rooted operating knowledge reported
        - label: Temtem
          x: 3
          'y': 4
          detail: Ride and delivery services with reported reach across 21 wilayas
        - label: Heetch
          x: 2
          'y': 5
          detail: Ride-focused model reported to use licensed taxis and private chauffeurs
        - label: Yango
          x: 1
          'y': 1
          detail: Ride-hailing alternative reported to have exited Algeria over regulatory fit
        - label: Gozem
          x: 4
          'y': 3
          detail: Transport, commerce, and cashless payments; no Algeria-specific alignment evidence
        - label: Glovo
          x: 2
          'y': 3
          detail: Delivery-focused alternative; no Algeria-specific alignment evidence in the pool
    approximationNotes: >-
      Coordinates are evidence-backed ordinal analyst scores, not market share, quality, price, or performance
      benchmarks. A score of 3 on the vertical axis denotes unavailable specific evidence.
    claimRefs:
      - CP016
  - id: FI001
    title: Revenue mechanism bridge with underwriting gaps
    type: flow
    summary: >-
      Customer activity can feed several monetization surfaces, but the public bridge stops before revenue quality and
      gross profit can be quantified.
    data:
      nodes:
        - id: consumer-demand
          label: Consumer demand
          detail: Reported user reach creates transaction opportunities but does not establish active paying cohorts.
        - id: mobility
          label: Mobility trips
          detail: Ride categories are visible; fare, take rate, incentives, and refunds are not.
        - id: delivery
          label: Food and grocery orders
          detail: Ordering surfaces are visible; GMV, merchant fees, courier cost, and basket margin are not.
        - id: business
          label: Business transport
          detail: Expense tracking and fleet substitution are described; enterprise pricing and retention are not.
        - id: payments
          label: Payment rail
          detail: Cash, cards, and wallet are supported; TPV, fee yield, processing cost, and losses are not.
        - id: transaction-revenue
          label: Transaction revenue
          detail: Secondary reporting describes commissions across rides, delivery, and payments.
        - id: profit-gap
          label: Gross-profit gap
          detail: Revenue mix, recognition, gross margin, contribution margin, and cash conversion remain unavailable.
      edges:
        - from: consumer-demand
          to: mobility
        - from: consumer-demand
          to: delivery
        - from: consumer-demand
          to: business
        - from: mobility
          to: transaction-revenue
        - from: delivery
          to: transaction-revenue
        - from: business
          to: transaction-revenue
        - from: payments
          to: transaction-revenue
        - from: transaction-revenue
          to: profit-gap
    approximationNotes: Conceptual mechanism only; node order is not proportional to revenue, transaction volume, margin, or conversion.
    claimRefs:
