              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP013
      - number: '3.2'
        title: Capability, distribution, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              Yassir's official app listing and Google Cloud's supplier case study establish the broadest documented
              product surface in the retained set: ride-hailing, food and grocery delivery, and payments in one app. The
              same evidence describes multiple ride tiers, a large partner marketplace, and an AI pilot that shortened
              driver assignment time, but these are company-issued or partner-issued claims rather than independent
              benchmarks. Temtem's locally tailored reach and Heetch's licensed-driver model offer narrower but legible
              alternatives: Temtem is reported across 21 wilayas, while Heetch is reported to work only with licensed
              taxi drivers and private chauffeurs. Yassir's 2026 acquisitions add physical retail and advertising
              technology, increasing scope while also adding integration and execution risk.
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP007
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP007
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP016
      - number: '3.3'
        title: Pricing, packaging, and switching behavior
        blocks:
          - type: paragraph
            body: >-
              Public product evidence explains packaging better than price. Yassir offers several ride classes and shows
              an upfront fare estimate, while its food, grocery, and wallet services are packaged inside the same
              consumer application. None of the retained sources provides a comparable current schedule of fares,
              delivery fees, merchant commissions, discounts, or driver payouts across Yassir and its named rivals. The
              integrated wallet, cross-service usage, and partner density could increase switching friction, but public
              evidence does not disclose customer cohorts, merchant or driver churn, exclusivity, or multi-homing. The
              defensibility case therefore rests on plausible network effects rather than demonstrated lock-in or
              superior realized pricing.
            claimRefs:
              - CP001
              - CP002
              - CP011
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP011
              - CP014
              - CP015
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The most credible moat is operational localization: a multi-sided network, broad product surface, and
              familiarity with fragmented local requirements. It is not impregnable. The retained regulatory analysis
              reports that Yango withdrew from Algeria after failing to fit local requirements and that Heetch
              differentiated through a licensed supply model. It also describes traditional taxi influence, municipal
              licensing, foreign-exchange constraints, and data-sovereignty concerns as barriers that can favor
              compliant operators regardless of funding. Yassir's breadth may lower cross-sell costs, but specialist
              competitors can still win through licensing, narrower execution, or local density. The absence of
              comparable price, retention, and contribution-margin evidence prevents a high-confidence conclusion that
              the super-app bundle will resist commoditization.
            claimRefs:
              - CP005
              - CP007
              - CP008
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth creates a differentiated distribution surface
            body: >-
              Yassir can serve mobility, delivery, grocery, and payment needs within one application, while its reported
              partner network supplies multiple sides of that marketplace.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
          - type: callout
            title: Regulatory fit can outweigh capital and product breadth
            body: >-
              Yango's reported exit and Heetch's licensed-driver positioning show that a narrower compliant model can be
              more durable than a standardized international playbook.
            calloutType: risk
            claimRefs:
              - CP007
              - CP008
          - type: callout
            title: Underwrite the moat city by city
            body: >-
              Require comparable price baskets, active supply, multi-homing, retention, and contribution margin by city
              before valuing Yassir's footprint as durable competitive advantage.
            calloutType: recommendation
            claimRefs:
              - CP014
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and mix
        blocks:
          - type: paragraph
            body: >-
              Yassir's economic architecture is broader than a ride-hailing marketplace. Third-party descriptions
              identify transaction commissions across rides, deliveries, and payments, while the company-authored app
              listing shows the operating surfaces: Yassir Go, Express, Market, and Pay. Inference Partners, an investor
              and therefore not independent evidence, describes mobility and delivery as the entry point for payment
              infrastructure. The 2026 acquisition narrative adds physical grocery retail and programmatic advertising
              as potential revenue lines. This breadth can increase purchase frequency and cross-sell opportunities, but
              no retained source quantifies revenue by stream, realized take rate, payment fees, retail sales, or
              advertising contribution. The result is a credible mechanism map without evidence of revenue quality,
              concentration, or accounting recognition.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI014
              - CI015
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI014
              - CI015
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI003
              - CI005
              - CI015
      - number: '4.2'
        title: Pricing, go-to-market, and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Public pricing evidence is descriptive rather than numerical. The app listing separates affordable,
              comfort, larger-vehicle, hourly, women-driver, and premium ride categories and supports cash, bank-card,
              and wallet payments, but it publishes no retained fare card, delivery fee schedule, merchant commission,
              subscription, enterprise contract, or wallet fee. Yassir Business is positioned around centralized travel
              records and fleet-cost control, indicating a business sales motion alongside consumer acquisition.
              Reported scale of more than eight million users and at least 100,000 partners is a distribution proxy, not
              proof of active users, paying customers, retention, or efficient acquisition. The retained evidence
              therefore cannot calculate CAC, payback, sales-cycle length, discounting, or channel economics.
            claimRefs:
              - CI002
              - CI004
              - CI006
              - CI007
              - CI008
              - CI015
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI015
      - number: '4.3'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              The marketplace model can be asset-light at the driver and courier layer, yet delivery, support,
              incentives, payment operations, compliance, and geographic localization can consume contribution margin.
              AlgeriaTech notes that managed foreign exchange, price-sensitive demand, and pricing controls constrain
              aggressive subsidy strategies; its regulatory analysis also implies recurring city-level compliance costs.
              A general Africa fintech benchmark quoted by Mikal Khoso places customer acquisition as high as $20
              against $7 of revenue, but that benchmark is not Yassir-specific and cannot be inserted into a Yassir
              model. No retained source discloses gross margin, contribution margin, incentives, refunds, utilization,
              working capital, capex, or cohort behavior. Each missing input must be obtained by market and service
              before an operating model is credible.
            claimRefs:
              - CI008
              - CI013
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI008
              - CI010
              - CI011
              - CI015
              - CI016
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Financing evidence does not establish liquidity. International Finance reported $193.25 million raised
              since 2017 as of November 2023. AlgeriaTech later described an approximately $105 million internal Series
              C in 2025 while also saying cumulative funding was around $193 million; those figures do not reconcile and
              should not be converted into cash available. The same 2026 reporting describes acquisitions of Uno
              Hypermarkets and Kawarizmi, while regulatory analysis anticipates compliance spending. These moves can
              deepen the operating moat but may also add inventory, leases, integration cost, and working-capital
              exposure. The funding chronology can be read with Company Overview, but the financial verdict is narrower:
              revenue quality, margin path, burn, runway, debt obligations, and next-round triggers remain blocked
              pending bank statements, audited accounts, and segment-level management reporting.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital raised is not cash available
            body: >-
              The retained reporting does not reconcile the reported 2025 round with the repeated cumulative-funding
              figure, and none of the sources discloses current cash, burn, debt, acquisition consideration, or
              restricted funds.
            calloutType: risk
            claimRefs:
              - CI010
              - CI011
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Integrated product surface
        blocks:
          - type: paragraph
            body: >-
              Yassir's product is an integrated consumer marketplace rather than a single mobility application. The App
              Store describes Yassir as offering ride-hailing, food and grocery delivery, and payments in one
              application, while naming Yassir Go, Yassir Express, Yassir Market, and Yassir Pay as distinct service
              surfaces. The ride catalog includes Classic, Comfort, Space, Chrono, Yassir Women, and Premium options,
              which indicates segmentation by price, vehicle capacity, reservation duration, and user preference rather
              than one generic ride SKU. Food and grocery workflows add restaurant menus, household goods, doorstep
              delivery, and in-app payment. A 2023 independent analysis also described Yassir Business for corporate
              transportation and fleet-management experimentation, although the retained current listings do not
              establish its present status. This breadth can increase cross-service utility, but the public record does
              not establish how much usage is shared across verticals, which services are live in each city, or whether
              all listed capabilities are equally mature.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE016
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE009
              - CE016
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE013
              - CE014
      - number: '5.2'
        title: Operating architecture and dependencies
        blocks:
          - type: paragraph
            body: >-
              Available descriptions indicate a multi-sided operating model linking consumers to drivers, couriers,
              restaurants, merchants, and payment instruments. The strongest public technical description is a secondary
              account that says Yassir uses Google Cloud, Kubernetes Engine, Cloud Run, Pub/Sub, Cloud Logging,
              Monitoring, Trace, CloudSQL, BigQuery, Dataproc, Dataflow, and Vertex AI. It also reports geolocation for
              real-time matching and an API-first direction through Apigee. These details are useful as a declared
              dependency map, not as an independently audited architecture: public sources do not disclose service-level
              objectives, failover design, data-residency topology, model monitoring, or the boundaries between
              company-operated and partner-operated components. The operating model also depends on local payments,
              driver and merchant supply, mapping, and city-level permissions, so technical scalability cannot be
              separated from partner and regulatory execution.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE013
              - CE015
      - number: '5.3'
        title: Deployment footprint and maturity signals
        blocks:
          - type: paragraph
            body: >-
              The product has meaningful deployment evidence: the two app-store listings describe the same four core
              services, report a current iOS version, and identify English, Arabic, and French language support. The
              Google Play listing records 3.8 stars from 219,506 ratings, while the App Store text says there are not
              enough ratings or reviews to display an overview; these are platform-specific signals and should not be
              combined into a single quality score. Company-facing and secondary accounts report operations in dozens of
              cities and a large partner network, but the numbers differ by source and period. The public evidence
              therefore supports a broad live deployment, not a complete maturity assessment. An investor still needs
              city-level service availability, uptime, cancellation and fulfillment performance, incident history,
              release cadence by platform, and customer support metrics.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Trust, privacy, and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              Trust controls are visible at the product surface: the App Store states that the app may use location in
              the background, and identifies purchases, contact information, identifiers, financial information,
              location, search history, usage data, and diagnostics as data categories collected or linked in specified
              ways. The app also advertises cash, cards, wallet payments, in-app support, and trained drivers and
              delivery agents. Those disclosures show the scope of the control problem but do not prove compliance or
              effectiveness. A secondary account reports prior scrutiny in Tunisia and a warning from Senegal's
              data-protection authority; another 2026 account says Algeria is tightening VTC rules and may impose
              insurance, reporting, classification, and vehicle standards. The evidence supports privacy, payments,
              safety, and local licensing as material implementation risks. It does not establish the current status of
              every allegation, certification, security audit, or market authorization, so those items remain diligence
              requirements.
            claimRefs:
              - CE013
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad, coherent service surface
            body: >-
              The same app publicly combines mobility, food, groceries, and payments, giving Yassir a credible
              platform-level product thesis rather than a collection of unrelated listings.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE016
          - type: callout
            title: Breadth is not proof of operating maturity
            body: >-
              Public listings establish feature availability and some deployment signals, but they do not establish
              city-level reliability, cross-service retention, security assurance, or unit-level service quality.
            calloutType: risk
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: callout
            title: Privacy and licensing are product dependencies
            body: >-
              Location, financial, and identity-related data plus evolving transport and data-protection rules make
              compliance architecture and control evidence material to product risk.
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and marketplace roles
        blocks:
          - type: paragraph
            body: >-
              Yassir serves a multi-sided marketplace rather than a single buyer class. Public descriptions identify
              riders and household users, restaurants and grocery merchants, drivers and couriers, wholesalers and FMCG
              suppliers, and business customers using transport or procurement tools. The consumer proposition combines
              ride-hailing, food, grocery, and payments in one app, while the partner proposition is access to demand
              and income. This structure creates cross-side density, but the public record does not disclose
              segment-level revenue, active users by product, or the share of transactions that comes from each role.
              The segmentation below therefore distinguishes documented participant groups from unresolved economic
              value.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU009
      - number: '6.2'
        title: Adoption trajectory and durability
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption evidence is scale disclosed in company-associated and investor-facing materials: 45
              cities, six countries, more than 8 million users, and more than 100,000 partners in 2022-era reporting. A
              separate app listing describes 150,000 partners in 58 cities, but it does not provide a dated active-user
              denominator or an independently audited trend. A 2026 trade article reports one million monthly active
              users, which conflicts with the broader 8-million user figure because the populations and dates are not
              comparable. These signals support reach, not retention: no public source in this pool supplies NRR, GRR,
              churn, repeat-purchase cohorts, cancellation rates, or contribution margin by segment.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU009
              - CU013
      - number: '6.3'
        title: Named customer proof and expansion surfaces
        blocks:
          - type: paragraph
            body: >-
              Public evidence identifies customer and partner categories more reliably than named enterprise customers.
              The platform is described as generating revenue opportunities for drivers, couriers, merchants,
              wholesalers, and other vendors, while the app listing names product surfaces such as Yassir Go, Yassir
              Express, Yassir Market, and Yassir Pay. A customer can therefore enter through a ride, delivery, grocery,
              or payment use case and potentially expand across services. However, the retained sources do not establish
              which named merchants or institutions are in production, what outcomes they achieved, or whether use is
              recurring. The proof table records this limitation explicitly rather than treating logos or marketplace
              categories as retention evidence.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Expansion, concentration, and procurement friction
        blocks:
          - type: paragraph
            body: >-
              Yassir's expansion logic depends on local operating density and the ability to reuse a consumer and
              partner network across adjacent services. That can lower acquisition friction for a second product, but it
              also concentrates execution in regulated urban markets and on the availability of drivers, couriers,
              merchants, and payment rails. AlgeriaTech reports that the company operates across 45 cities and that
              updated VTC rules were expected in 2026; the same source describes Morocco's effective October 2025
              shutdown of ride-hailing apps as a regional warning. Public sources do not quantify top-customer
              concentration, channel dependence, procurement cycle length, or city-level utilization. These are material
              diligence gaps for judging durability.
            claimRefs:
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              Customer evidence is most decision-useful when read as a funnel from participant coverage to repeat
              economics: the public file establishes broad reach and product breadth, but does not yet establish durable
              cohort behavior or named production outcomes. The exhibit separates entry points, transaction surfaces,
              payment, adjacent-service exposure, and the unmeasured repeat step. It should be read as an operating
              hypothesis grounded in documented product surfaces, not as proof that cross-sell or retention has
              occurred.
            claimRefs:
              - CU005
              - CU008
              - CU012
      - number: '6.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad marketplace reach
            body: >-
              Yassir's public evidence supports a broad consumer and partner footprint spanning multiple service
              categories and geographies.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
              - CU009
          - type: callout
            title: Reach is not durability
            body: >-
              User and partner counts are not accompanied by cohort retention, utilization, or segment-level unit
              economics, leaving customer durability unresolved.
            calloutType: risk
            claimRefs:
              - CU007
              - CU008
              - CU012
          - type: callout
            title: Request cohort and account evidence
            body: >-
              Obtain city-by-city active cohorts, repeat rates, churn, take rate, contribution margin, and named
              customer contracts before underwriting expansion or valuation.
            calloutType: recommendation
            claimRefs:
              - CU008
              - CU012
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Yassir spans mobility, delivery, grocery and payments, so a single compliance posture does not travel
              cleanly across markets. AlgeriaTech reports that Algeria is developing updated VTC and taxi rules and
              describes municipal and wilaya-level administration as fragmented; it also presents Morocco's October 2025
              shutdown of ride-hailing apps as a regional warning. A low-reputation compiled account separately reports
              historical data-protection scrutiny in Tunisia and Senegal. These sources do not prove a current
              enforcement order against Yassir, and none substitutes for regulator records. They do establish a material
              diligence burden: verify operating licenses, data-localization controls, driver classification, insurance,
              payment permissions and regulator correspondence country by country rather than inferring compliance from
              continued app availability.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR011
              - CR013
      - number: '7.2'
        title: Operating, quality and security risk
        blocks:
          - type: paragraph
            body: >-
              The product surface is broad and operationally interdependent: the company-authored app listings describe
              rides, food, groceries, payments, cash, cards, wallet functionality, support channels and a network of
              drivers and delivery agents. That breadth creates failure modes across identity, location, payment,
              dispatch, customer support and partner service quality. Apple's listing says location may be used when the
              app is not open and lists multiple data categories, but the listings do not provide an independent series
              for uptime, fraud losses, breaches, refunds or safety outcomes. A low-reputation third-party article
              attributes growth to cash-on-delivery, female-passenger safety protocols and driver vetting; those
              assertions are descriptive mitigation signals, not an independent controls audit. Absence of a cited
              incident record is therefore not evidence that incidents did not occur.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR017
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR017
      - number: '7.3'
        title: Partner and execution dependencies
        blocks:
          - type: paragraph
            body: >-
              Yassir depends on drivers, couriers, merchants, wholesalers, payment rails, app stores, local regulators
              and strategic partners. Company- and investor-controlled sources report more than 100,000 partners, while
              the current app listings claim more than 150,000 partners in 58 cities; those snapshots are not directly
              comparable without dates and a stable definition of partner. The 2026 Uno acquisition reportedly adds
              physical stores and supply-chain management, increasing operational depth while introducing inventory,
              lease, labor, working-capital and integration exposure. Independent analysis also describes
              financial-services expansion in emerging markets as expensive and complex, with lending adding
              balance-sheet and underwriting risk. Partner retention, payment localization and post-acquisition
              execution are therefore monitorable dependencies, not merely growth enablers.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR015
              - CR016
      - number: '7.4'
        title: Financial opacity and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Historical funding is not current liquidity. A syndicated 2022 company release reported a $150 million
              Series B and $193.25 million raised over five years, but the assigned public evidence does not establish
              current revenue by vertical, contribution margin, cash, burn, runway, liabilities or later financing
              terms. The underwriting response is to require a current cap table, signed financing documents,
              segment-level profit and loss statements, cash reconciliation, regulatory status by market, incident logs
              and Uno integration KPIs. Kill criteria should include a material license loss, unremediated privacy
              enforcement, verified insolvency in a core entity, a severe security event without effective containment,
              integration misses that consume planned runway, or cash runway falling below the board-approved financing
              plan. These are diligence triggers, not claims that such events have occurred.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory compliance is a core operating capability
            body: >-
              The evidence supports treating licensing, data protection and local operating permissions as recurring
              execution requirements rather than a one-time legal checklist.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: callout
            title: Public disclosures do not clear financial resilience
            body: >-
              Historical funding disclosures show capital raised, not current liquidity, margins or runway; those
              metrics remain unresolved until primary company evidence is obtained.
            calloutType: assumption
            claimRefs:
              - CR013
              - CR014
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The public file supports a real multi-service platform rather than a concept-stage company: Yassir's own
              surfaces describe millions of downloads, a large partner network, multiple markets, and an application
              spanning mobility, delivery, groceries, and payments. Those indicators establish reach, not equity value.
              The retained sources provide no current revenue, gross profit, contribution margin, cash, debt, ownership,
              or liquidation-preference schedule. Financing reporting is also internally difficult to reconcile: one
              source repeats roughly $193 million of cumulative funding after the 2022 Series B, while a later article
              reports an approximately $105 million internal Series C in 2025 yet still gives roughly the same
              cumulative total. With no signed terms or financial denominator, the recommendation is research-more,
              confidence is low, risk is high, and entry discipline should override every headline valuation.
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV006
              - CV011
              - CV012
              - CV014
              - CV016
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that an established consumer and partner network can support cross-service monetization:
              rides can seed delivery demand, transaction frequency can support payments, and a broader service bundle
              can improve retention. Company-controlled app listings confirm that these services coexist, while an
              investor profile reports more than eight million users. The anti-thesis is equally material. Reported
              scale figures vary across company-controlled surfaces without common dates or denominators, and public
              sources do not show whether any vertical produces positive contribution margin after incentives, refunds,
              support, and compliance. An expanding surface area may therefore increase capital needs faster than it
              creates cash. The view improves only with cohort-level cross-use, take-rate, loss-rate, and
              contribution-profit evidence; it worsens if those data reveal subsidized or geographically fragile
              activity.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV014
              - CV015
      - number: '8.3'
        title: Scenario and valuation framework
        blocks:
          - type: paragraph
            body: >-
              No numerical fair-value range is supportable from this source pool. A reported one-billion- dollar peak
              and a later $600 million to $800 million estimate are third-party reference points, not audited marks,
              transaction prices, or proof of cash available to the company. The bull case requires verified growth and
              positive contribution economics across the core marketplace, plus evidence that payments improve
              monetization without unacceptable credit or compliance exposure. The base case assumes a strategically
              relevant platform whose cash generation and financing needs remain uncertain. The bear case combines
              multiple compression with regulatory friction, weak unit economics, or geographic retrenchment.
              Probability signals should therefore come from operating data and signed financing documents, not from
              assigning invented odds to incomplete public information.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV011
              - CV012
              - CV014
              - CV016
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness remains unproven because the retained evidence identifies neither a credible liquidity
              timetable nor comparable transactions with matched growth, margin, geography, and regulatory exposure.
              Primary diligence should obtain the signed 2025 financing package, fully diluted cap table, preference
              stack, secondary-sale detail, monthly financials, cash runway, and city-by-city cohort economics.
              Regulatory diligence should separately confirm the legal basis for mobility and payments in each material
              jurisdiction. AlgeriaTech reports that updated Algerian VTC rules were expected in 2026, and Africa
              Intelligence published an adverse France headline whose article body remained inaccessible in the retained
              fetch. Thesis-break triggers are a material suspension, evidence that France reflects broader group
              stress, an unreconciled preference overhang, or persistently negative contribution margin. Only verified
              improvement on those tests should permit a higher entry price.
            claimRefs:
              - CV011
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV011
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more, not buy
            body: >-
              Public evidence supports operating relevance but not a defensible entry value. Obtain signed terms,
              current economics, and a preference-aware return model before underwriting.
            calloutType: recommendation
            claimRefs:
              - CV011
              - CV012
              - CV014
          - type: callout
            title: Do not convert funding into cash
            body: >-
              Reported capital raised is historical financing activity, not evidence of current liquidity, runway, or
              value available to common shareholders.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
