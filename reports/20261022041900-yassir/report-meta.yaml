  topStrengths:
    - Multi-service product breadth can support repeat usage and cross-service distribution.
    - Public evidence indicates meaningful regional reach across users, partners, cities, and markets.
    - The company has a documented venture-financing history and an identifiable operating platform.
  topRisks:
    - Current revenue, contribution margin, burn, cash, debt, and runway are undisclosed.
