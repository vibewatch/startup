      - ["Order a meal", "Browse menus, place an order, and receive delivery", "Yassir Express within the same app", "One account and interface for ordering", "No independent delivery-time benchmark retained"]
      - ["Buy household goods", "Browse products and request doorstep delivery", "Yassir Market grocery workflow", "Convenience versus a physical supermarket trip", "Inventory, substitutions, and coverage are not disclosed"]
      - ["Pay for services", "Use cash, card, or wallet at checkout", "Yassir Pay and wallet feature", "Payment choice across multiple service lines", "Payment-control effectiveness and regulatory status are unresolved"]
      - ["Get help or resolve a problem", "Contact support by chat, email, or phone", "In-app and external support channels", "Multiple support access points", "No response-time or resolution-rate evidence"]
    notes: "The table records user-facing workflows stated in app-store material; the benefit column is a bounded product implication, not a measured outcome."
    claimRefs: [CE001, CE002, CE003, CE013, CE014]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Public dependency or component, Risk, Verification needed]
    rows:
      - [Client and service modules, "Single entry point for daily services", "Yassir Go, Express, Market, and Pay", "Shared release or identity failure can affect multiple journeys", "Module-level incident and release history"]
      - [Dispatch and geolocation, "Match riders, drivers, and couriers", "Geolocation and real-time matching described publicly", "Location error, latency, or supply imbalance", "Matching accuracy, ETA error, and fallback behavior"]
      - [Cloud runtime, "Run multi-region services", "Google Cloud, GKE Autopilot, and Cloud Run", "Vendor concentration and regional outage exposure", "Architecture diagram, SLOs, and disaster-recovery tests"]
      - [Messaging and observability, "Coordinate events and monitor stability", "Pub/Sub, Logging, Monitoring, and Trace", "Blind spots can delay detection of service degradation", "Alert coverage, incident runbooks, and postmortems"]
      - [Data and analytics, "Store, process, and analyze operational data", "CloudSQL, BigQuery, Dataproc, and Dataflow", "Privacy, residency, retention, and access-control exposure", "Data map, retention policy, and access audit"]
      - [AI and personalization, "Support prediction and recommendations", "Vertex AI described as enabling matching and grocery recommendations", "Model drift, explainability, and unverified performance claims", "Offline/online metrics, monitoring, and model-governance records"]
    notes: "This is a public dependency map, not an audited architecture. The component names and AI performance assertions are attributed to a secondary source and require technical diligence."
    claimRefs: [CE005, CE006, CE007, CE008]
