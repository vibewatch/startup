company:
  name: Yassir
chapter:
  number: 5
  title: Product & Technology
  summary: Yassir has evolved from Algerian ride-hailing into a single application spanning mobility, food, groceries, and payments. Public evidence shows a broad operating surface and a cloud/AI technology narrative, but independent verification of reliability, security controls, technical performance, and rollout maturity remains limited.
sections:
  - id: integrated-product-surface
    title: Integrated product surface
    body: >-
      Yassir's product is an integrated consumer marketplace rather than a single
      mobility application. The App Store describes Yassir as offering ride-hailing,
      food and grocery delivery, and payments in one application, while naming Yassir
      Go, Yassir Express, Yassir Market, and Yassir Pay as distinct service surfaces.
      The ride catalog includes Classic, Comfort, Space, Chrono, Yassir Women, and
      Premium options, which indicates segmentation by price, vehicle capacity,
      reservation duration, and user preference rather than one generic ride SKU.
      Food and grocery workflows add restaurant menus, household goods, doorstep
      delivery, and in-app payment. A 2023 independent analysis also described
      Yassir Business for corporate transportation and fleet-management
      experimentation, although the retained current listings do not establish
      its present status. This breadth can increase cross-service utility, but the
      public record does not establish how much usage is shared across verticals,
      which services are live in each city, or whether all listed capabilities are
      equally mature.
    claimRefs: [CE001, CE002, CE003, CE004, CE016]
    tableRefs: [TE001, TE002]
  - id: operating-architecture
    title: Operating architecture and dependencies
    body: >-
      Available descriptions indicate a multi-sided operating model linking
      consumers to drivers, couriers, restaurants, merchants, and payment
      instruments. The strongest public technical description is a secondary
      account that says Yassir uses Google Cloud, Kubernetes Engine, Cloud Run,
      Pub/Sub, Cloud Logging, Monitoring, Trace, CloudSQL, BigQuery, Dataproc,
      Dataflow, and Vertex AI. It also reports geolocation for real-time matching
      and an API-first direction through Apigee. These details are useful as a
      declared dependency map, not as an independently audited architecture:
      public sources do not disclose service-level objectives, failover design,
      data-residency topology, model monitoring, or the boundaries between
      company-operated and partner-operated components. The operating model also
      depends on local payments, driver and merchant supply, mapping, and
      city-level permissions, so technical scalability cannot be separated from
      partner and regulatory execution.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-and-deployment
    title: Deployment footprint and maturity signals
    body: >-
      The product has meaningful deployment evidence: the two app-store listings
      describe the same four core services, report a current iOS version, and
      identify English, Arabic, and French language support. The Google Play
      listing records 3.8 stars from 219,506 ratings, while the App Store text
      says there are not enough ratings or reviews to display an overview; these
      are platform-specific signals and should not be combined into a single
      quality score. Company-facing and secondary accounts report operations in
      dozens of cities and a large partner network, but the numbers differ by
      source and period. The public evidence therefore supports a broad live
      deployment, not a complete maturity assessment. An investor still needs
      city-level service availability, uptime, cancellation and fulfillment
      performance, incident history, release cadence by platform, and customer
      support metrics.
    claimRefs: [CE009, CE010, CE011, CE012]
  - id: trust-and-control-exposure
    title: Trust, privacy, and regulatory exposure
    body: >-
      Trust controls are visible at the product surface: the App Store states
      that the app may use location in the background, and identifies purchases,
      contact information, identifiers, financial information, location, search
      history, usage data, and diagnostics as data categories collected or linked
      in specified ways. The app also advertises cash, cards, wallet payments,
      in-app support, and trained drivers and delivery agents. Those disclosures
      show the scope of the control problem but do not prove compliance or
      effectiveness. A secondary account reports prior scrutiny in Tunisia and a
      warning from Senegal's data-protection authority; another 2026 account says
      Algeria is tightening VTC rules and may impose insurance, reporting,
      classification, and vehicle standards. The evidence supports privacy,
      payments, safety, and local licensing as material implementation risks.
      It does not establish the current status of every allegation, certification,
      security audit, or market authorization, so those items remain diligence
      requirements.
    claimRefs: [CE013, CE014, CE015]
    tableRefs: []
