          modules: [Cash, Banking cards, Wallet]
        - label: Platform services
          detail: "Geolocation, dispatch, cloud runtime, messaging, observability, data, and AI."
          modules: [Geolocation, Google Cloud, Pub/Sub, Analytics, Vertex AI]
        - label: External controls and dependencies
          detail: "Payment rails, local transport rules, privacy obligations, and partner supply."
          modules: [Payment rails, VTC rules, Data protection, Drivers, Merchants]
    approximationNotes: "Layer order is an analytical representation of publicly described modules and dependencies; it does not claim a verified internal call graph or deployment topology."
    claimRefs: [CE001, CE005, CE006, CE013, CE015]
callouts:
  - calloutType: strength
    title: Broad, coherent service surface
    body: The same app publicly combines mobility, food, groceries, and payments, giving Yassir a credible platform-level product thesis rather than a collection of unrelated listings.
    claimRefs: [CE001, CE002, CE003, CE004, CE016]
  - calloutType: risk
    title: Breadth is not proof of operating maturity
    body: Public listings establish feature availability and some deployment signals, but they do not establish city-level reliability, cross-service retention, security assurance, or unit-level service quality.
    claimRefs: [CE009, CE010, CE011, CE012]
  - calloutType: risk
    title: Privacy and licensing are product dependencies
    body: Location, financial, and identity-related data plus evolving transport and data-protection rules make compliance architecture and control evidence material to product risk.
    claimRefs: [CE013, CE014, CE015, CE016]
