company:
  name: Yassir
chapter:
  number: 7
  title: Risks
  summary: Yassir's principal exposures are regulatory fragmentation, privacy compliance across multiple jurisdictions, operational complexity from rapid vertical expansion, and financing opacity. App-store disclosures, low-reputation reporting, and the absence of public unit economics leave important security, reliability, concentration, and financial-resilience questions unresolved.
sections:
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: >-
      Yassir spans mobility, delivery, grocery and payments, so a single compliance posture does not travel cleanly across markets. AlgeriaTech reports that Algeria is developing updated VTC and taxi rules and describes municipal and wilaya-level administration as fragmented; it also presents Morocco's October 2025 shutdown of ride-hailing apps as a regional warning. A low-reputation compiled account separately reports historical data-protection scrutiny in Tunisia and Senegal. These sources do not prove a current enforcement order against Yassir, and none substitutes for regulator records. They do establish a material diligence burden: verify operating licenses, data-localization controls, driver classification, insurance, payment permissions and regulator correspondence country by country rather than inferring compliance from continued app availability.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: operating-quality-security
    title: Operating, quality and security risk
    body: >-
      The product surface is broad and operationally interdependent: the company-authored app listings describe rides, food, groceries, payments, cash, cards, wallet functionality, support channels and a network of drivers and delivery agents. That breadth creates failure modes across identity, location, payment, dispatch, customer support and partner service quality. Apple's listing says location may be used when the app is not open and lists multiple data categories, but the listings do not provide an independent series for uptime, fraud losses, breaches, refunds or safety outcomes. A low-reputation third-party article attributes growth to cash-on-delivery, female-passenger safety protocols and driver vetting; those assertions are descriptive mitigation signals, not an independent controls audit. Absence of a cited incident record is therefore not evidence that incidents did not occur.
    claimRefs: [CR005, CR006, CR007, CR008, CR017]
    tableRefs: [TR002]
  - id: partner-dependency
    title: Partner and execution dependencies
    body: >-
      Yassir depends on drivers, couriers, merchants, wholesalers, payment rails, app stores, local regulators and strategic partners. Company- and investor-controlled sources report more than 100,000 partners, while the current app listings claim more than 150,000 partners in 58 cities; those snapshots are not directly comparable without dates and a stable definition of partner. The 2026 Uno acquisition reportedly adds physical stores and supply-chain management, increasing operational depth while introducing inventory, lease, labor, working-capital and integration exposure. Independent analysis also describes financial-services expansion in emerging markets as expensive and complex, with lending adding balance-sheet and underwriting risk. Partner retention, payment localization and post-acquisition execution are therefore monitorable dependencies, not merely growth enablers.
    claimRefs: [CR009, CR010, CR011, CR015, CR016]
    tableRefs: [TR003]
  - id: financial-and-kill-criteria
    title: Financial opacity and thesis-break triggers
    body: >-
      Historical funding is not current liquidity. A syndicated 2022 company release reported a $150 million Series B and $193.25 million raised over five years, but the assigned public evidence does not establish current revenue by vertical, contribution margin, cash, burn, runway, liabilities or later financing terms. The underwriting response is to require a current cap table, signed financing documents, segment-level profit and loss statements, cash reconciliation, regulatory status by market, incident logs and Uno integration KPIs. Kill criteria should include a material license loss, unremediated privacy enforcement, verified insolvency in a core entity, a severe security event without effective containment, integration misses that consume planned runway, or cash runway falling below the board-approved financing plan. These are diligence triggers, not claims that such events have occurred.
    claimRefs: [CR013, CR014, CR015, CR016]
callouts:
  - calloutType: risk
    title: Regulatory compliance is a core operating capability
    body: The evidence supports treating licensing, data protection and local operating permissions as recurring execution requirements rather than a one-time legal checklist.
    claimRefs: [CR001, CR002, CR003, CR004]
  - calloutType: assumption
    title: Public disclosures do not clear financial resilience
    body: Historical funding disclosures show capital raised, not current liquidity, margins or runway; those metrics remain unresolved until primary company evidence is obtained.
    claimRefs: [CR013, CR014, CR016]
