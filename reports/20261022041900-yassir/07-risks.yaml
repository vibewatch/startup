    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Privacy or location-data misuse", "Medium", "High", "Partial", "High", "No current incident log or independent control assessment"]
      - ["Payment, wallet or fraud loss", "Medium", "High", "Unknown", "High", "No public loss-rate, reconciliation or reserve disclosure"]
      - ["Dispatch, delivery or service-quality failure across verticals", "Medium", "Medium", "Partial", "Medium", "No uptime, cancellation or refund series"]
      - ["Driver or passenger safety failure", "Medium", "High", "Partial", "High", "No independently verified safety-outcome data"]
    notes: "Company-authored product controls and low-reputation safety reporting are not independent outcome evidence; missing incident data is not coded as zero incidents."
    claimRefs: [CR005, CR006, CR007, CR008, CR017]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Concentration signal, Failure scenario, Severity, Mitigation signal, Residual exposure]
    rows:
      - ["Driver and courier network", "Drivers and delivery agents", "Large company-claimed partner network without concentration data", "Supply shortage, service-quality deterioration or safety event", "High", "Training, vetting and support are described but not independently tested", "Medium-high"]
      - ["Merchants and wholesalers", "Marketplace and inventory partners", "Partner totals lack category and geography denominators", "Inventory or availability deterioration", "Medium", "Multi-vertical network provides some diversification", "Medium"]
      - ["Local regulators and payment rails", "Ministries, wilayas, data authorities and financial infrastructure", "Country and city fragmentation", "License suspension, payment disruption or forced redesign", "High", "Local operating experience is reported", "High"]
      - ["Uno retail and supply-chain integration", "Cevital / Uno assets", "New physical operating layer with undisclosed transaction economics", "Integration, inventory or working-capital underperformance", "High", "Acquisition and planned rebranding are reported", "High"]
    notes: "Partner counts and operating footprints differ by source date and definition; no source provides a current concentration percentage or dependency denominator."
    claimRefs: [CR009, CR010, CR011, CR015, CR016]
