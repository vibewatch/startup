company:
  name: Yassir
chapter:
  number: 1
  title: Company Overview
  summary: Yassir is an Algeria-founded super-app that combines ride-hailing, delivery, grocery and payments, with public sources describing expansion across Francophone Africa and a large venture-financing history. The evidence is materially stronger on identity, product scope and historical funding than on current ownership, unit economics, governance or audited scale.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: Yassir was founded in 2017 by Noureddine Tayebi and Mahdi (El Mahdi) Yettou, beginning with ride-hailing in Algeria and expanding into a multi-sided marketplace. TechCrunch reports that the company added last-mile delivery and connected drivers, couriers, merchants, suppliers and wholesalers to individual users. Its stated strategic logic is to use recurring daily services to build trust and distribution for payments, rather than launch financial products as a standalone fintech. The current product surfaces describe Yassir Go for rides, Yassir Express for food, Yassir Market for groceries and Yassir Pay for transactions. An independent investment profile similarly describes the payment infrastructure thesis, but the public evidence does not establish current transaction volume, take rate or profitability.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-funding-and-scale
    title: Leadership, funding and disclosed scale
    body: >-
      Noureddine Tayebi is the consistently identified chief executive and founder; Inference Partners describes him as a Stanford PhD who spent more than 15 years in Silicon Valley before returning to Algeria. TechCrunch identifies Mahdi Yettou as co-founder and reports a $30 million Series A in 2021, following a previously undisclosed $13.25 million seed round. Later sources describe a much larger 2022 Series B and additional 2025 financing, but their figures conflict: the Algerian Startups directory says approximately $150 million in 2022, while AlgeriaTech reports approximately $105 million of internal Series C financing in 2025 and about $193 million cumulative funding. These are reported figures, not audited cap-table evidence. No assigned source gives a complete board, executive team, ownership, liquidation preference or debt schedule.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO011]
    tableRefs: [TO002]
  - id: operating footprint-and-risk
    title: Operating footprint, milestones and unresolved diligence
    body: Public descriptions place Yassir across Algeria and other Maghreb, Francophone African and diaspora markets, but the reported footprint changes by source and date. Inference Partners says six countries and 45 cities with more than eight million users and more than 100,000 partners; the Apple listing, a company-issued app-store surface, says more than 150,000 partners in 58 cities. The difference may reflect expansion or different definitions, so it should not be collapsed into one current metric. The regulatory source describes an evolving Algerian VTC framework and says compliance is becoming a competitive capability, while its account also reports Yassir-specific funding and valuation estimates that differ from other sources. A 2026 company overview therefore supports identity and strategic scale, but leaves current financial performance, governance, regulatory status by country and adverse-event completeness open.
    claimRefs: [CO012, CO013, CO014, CO015, CO016]
    tableRefs: [TO003]
callouts:
  - calloutType: strength
    title: Integrated distribution thesis
    body: The strongest documented strategic logic is the progression from mobility and delivery into payments, using an existing marketplace rather than relying on a standalone financial-services acquisition funnel.
    claimRefs: [CO003, CO004, CO005]
  - calloutType: risk
    title: Current scale is definition-sensitive
    body: User, partner, city and country counts differ across sources and dates; current financials, ownership and country-level compliance remain material diligence gaps.
    claimRefs: [CO012, CO013, CO015, CO016]
