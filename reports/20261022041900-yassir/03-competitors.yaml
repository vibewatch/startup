company:
  name: Yassir
chapter:
  number: 3
  title: Competitors
  summary: Yassir's clearest differentiation is a locally rooted, multi-service bundle spanning mobility, delivery, commerce, and payments. That breadth is credible, but comparable pricing, switching-cost, and city-level economics remain undisclosed, while licensed local rivals and regulation-driven exits show that scale alone is not a durable moat.
sections:
  - id: landscape
    title: Competitive landscape and buyer alternatives
    body: >-
      Yassir competes across several overlapping markets rather than against one uniform peer set.
      AlgeriaTech identifies Yassir, Temtem, and Heetch as the principal locally rooted
      ride-hailing platforms in Algeria after Yango's 2024 exit, while Tracxn names inDrive as
      Yassir's leading company-level competitor. A separate 2023 analyst review broadens the
      relevant set to Uber and Bolt in mobility, Glovo in delivery, and Gozem as a Francophone
      African super-app. Buyers can also remain with licensed taxis, order directly from merchants,
      or operate an internal fleet or dispatch workflow. Those substitutes lack a common reporting
      basis, so funding, users, partners, downloads, trips, drivers, and geographic presence should
      not be treated as interchangeable measures of competitive scale.
    claimRefs: [CP004, CP005, CP006, CP007, CP008, CP009, CP010]
    tableRefs: [TP001]
  - id: capability
    title: Capability, distribution, and trust comparison
    body: >-
      Yassir's official app listing and Google Cloud's supplier case study establish the broadest
      documented product surface in the retained set: ride-hailing, food and grocery delivery, and
      payments in one app. The same evidence describes multiple ride tiers, a large partner
      marketplace, and an AI pilot that shortened driver assignment time, but these are
      company-issued or partner-issued claims rather than independent benchmarks. Temtem's locally
      tailored reach and Heetch's licensed-driver model offer narrower but legible alternatives:
      Temtem is reported across 21 wilayas, while Heetch is reported to work only with licensed taxi
      drivers and private chauffeurs. Yassir's 2026 acquisitions add physical retail and advertising
      technology, increasing scope while also adding integration and execution risk.
    claimRefs: [CP001, CP002, CP005, CP006, CP007, CP011, CP012, CP013]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: pricing-switching
    title: Pricing, packaging, and switching behavior
    body: >-
      Public product evidence explains packaging better than price. Yassir offers several ride
      classes and shows an upfront fare estimate, while its food, grocery, and wallet services are
      packaged inside the same consumer application. None of the retained sources provides a
      comparable current schedule of fares, delivery fees, merchant commissions, discounts, or
      driver payouts across Yassir and its named rivals. The integrated wallet, cross-service usage,
      and partner density could increase switching friction, but public evidence does not disclose
      customer cohorts, merchant or driver churn, exclusivity, or multi-homing. The defensibility
      case therefore rests on plausible network effects rather than demonstrated lock-in or
      superior realized pricing.
    claimRefs: [CP001, CP002, CP011, CP014, CP015]
    tableRefs: [TP003]
  - id: durability
    title: Moat durability and displacement risk
    body: >-
      The most credible moat is operational localization: a multi-sided network, broad product
      surface, and familiarity with fragmented local requirements. It is not impregnable. The
      retained regulatory analysis reports that Yango withdrew from Algeria after failing to fit
      local requirements and that Heetch differentiated through a licensed supply model. It also
      describes traditional taxi influence, municipal licensing, foreign-exchange constraints, and
      data-sovereignty concerns as barriers that can favor compliant operators regardless of
      funding. Yassir's breadth may lower cross-sell costs, but specialist competitors can still
      win through licensing, narrower execution, or local density. The absence of comparable price,
      retention, and contribution-margin evidence prevents a high-confidence conclusion that the
      super-app bundle will resist commoditization.
    claimRefs: [CP005, CP007, CP008, CP014, CP015, CP016]
callouts:
  - calloutType: strength
    title: Breadth creates a differentiated distribution surface
    body: Yassir can serve mobility, delivery, grocery, and payment needs within one application, while its reported partner network supplies multiple sides of that marketplace.
    claimRefs: [CP001, CP002]
  - calloutType: risk
    title: Regulatory fit can outweigh capital and product breadth
    body: Yango's reported exit and Heetch's licensed-driver positioning show that a narrower compliant model can be more durable than a standardized international playbook.
    claimRefs: [CP007, CP008]
  - calloutType: recommendation
    title: Underwrite the moat city by city
    body: Require comparable price baskets, active supply, multi-homing, retention, and contribution margin by city before valuing Yassir's footprint as durable competitive advantage.
    claimRefs: [CP014, CP015]
