      - [Glovo, Delivery-focused adjacent, "300,000 African users, 8,000 restaurants, and 12,000 couriers reported for 2021", "Restaurant, retail, and last-mile delivery users", "Specialist delivery and quick-commerce focus", "Vintage and geography differ from Yassir's current core"]
      - [Gozem, Francophone super-app peer, "Eight countries, 1M+ downloads, and 7M+ trips reported in 2023", "Consumers and businesses in West and Central Africa", "Transport, commerce, and cashless payments in one app", "Limited overlap with Yassir's Algerian core is established"]
