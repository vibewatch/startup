      - [Internal fleet or dispatch, Build alternative, "No public Yassir-specific benchmark", "Enterprises with recurring mobility or delivery needs", "Control over service levels, data, and staffing", "Requires capital, operations, and local compliance capability"]
    notes: "Reported scale metrics use different issuers, periods, geographies, and denominators; they are not directly comparable. Qualitative substitute rows represent evidence gaps, not zero scale."
