  evidenceGaps:
    - type: missing-source
      severity: material
      topic: pricing gap
      missingEvidence: Comparable current fares, delivery fees, merchant commissions, driver payouts, and promotion intensity by city and service.
      whyItMatters: Product breadth cannot be translated into price competitiveness or contribution margin without realized transaction economics.
      diligencePath: Request city-level price baskets, merchant contracts, driver payout schedules, promotion history, and take-rate data.
      relatedQuestionRefs: [QP006]
      relatedTableRefs: [TP003]
    - type: private-evidence-only
      severity: material
      topic: switching costs
      missingEvidence: Customer cohort retention, merchant and driver churn, exclusivity, multi-homing, wallet activity, and repeat frequency.
      whyItMatters: These measures determine whether the multi-service network creates durable lock-in rather than superficial breadth.
      diligencePath: Obtain cohort, supply utilization, partner churn, and cross-service adoption reports under NDA.
      relatedQuestionRefs: [QP007]
      relatedTableRefs: [TP002, TP003]
    - type: enumeration-incomplete
      severity: minor
      topic: competitor landscape
      missingEvidence: A complete city-by-city register of active mobility, delivery, payment, status-quo, and internal-build alternatives.
      whyItMatters: The assigned evidence supports major named classes but cannot establish exhaustive coverage across every operating market.
      diligencePath: Build a market-by-market competitor register from local regulator, app-store, and procurement evidence.
