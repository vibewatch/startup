    claimRefs: [CP011, CP014, CP015]
figures:
  - id: FP001
    title: Competitive positioning by documented breadth and regulatory alignment
    type: quadrant
    summary: Yassir has the broadest documented service set, while Heetch has the strongest explicit licensed-supply posture; midpoint scores denote missing specific alignment evidence rather than average performance.
    data:
      xAxis:
        label: Documented service breadth
        min: 1
        max: 5
        low: Single vertical
        high: Mobility plus delivery, commerce, and payments
        description: "Ordinal 1-5 analyst coding from the retained product evidence"
        scale: ordinal
      yAxis:
        label: Reported local or regulatory alignment
        min: 1
        max: 5
        low: Adverse exit or poor fit
        high: Explicit licensed or locally embedded model
        description: "Ordinal 1-5 analyst coding; 3 means no specific alignment evidence"
        scale: ordinal
      points:
        - {label: Yassir, x: 5, y: 4, detail: "Four-service official portfolio and locally rooted operating knowledge reported"}
        - {label: Temtem, x: 3, y: 4, detail: "Ride and delivery services with reported reach across 21 wilayas"}
        - {label: Heetch, x: 2, y: 5, detail: "Ride-focused model reported to use licensed taxis and private chauffeurs"}
        - {label: Yango, x: 1, y: 1, detail: "Ride-hailing alternative reported to have exited Algeria over regulatory fit"}
        - {label: Gozem, x: 4, y: 3, detail: "Transport, commerce, and cashless payments; no Algeria-specific alignment evidence"}
        - {label: Glovo, x: 2, y: 3, detail: "Delivery-focused alternative; no Algeria-specific alignment evidence in the pool"}
    approximationNotes: "Coordinates are evidence-backed ordinal analyst scores, not market share, quality, price, or performance benchmarks. A score of 3 on the vertical axis denotes unavailable specific evidence."
    claimRefs: [CP016]
