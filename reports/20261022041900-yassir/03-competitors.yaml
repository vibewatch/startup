  - id: TP003
    title: Pricing and packaging comparison
    columns: [Offer or alternative, Price or unit evidence, Included capability, Discount or unknown, Competitive implication]
    rows:
      - [Yassir Go ride classes, "Upfront fare estimate documented; numeric fares unavailable", "Classic, Comfort, Space, Chrono, Women, and Premium rides", "Promotions mentioned; realized discounting unknown", "Segmented packaging is visible but price leadership is not"]
      - [Yassir Express and Market, "Menu, basket, delivery-fee, and merchant commission schedules unavailable", "Restaurant food and grocery delivery", "Promotions and realized take rate unknown", "Bundle convenience is documented; economics are not"]
      - [Yassir Pay, "Wallet top-up and in-app payment documented; fee schedule unavailable", "Payment for rides, meals, and groceries", "Offers mentioned; wallet adoption and cash-out economics unknown", "Potential switching friction remains unquantified"]
      - [Temtem, "Comparable current fares and commissions unavailable", "Ride-hailing and delivery reported", "Discounting and driver payout unknown", "Local relevance is established without a pricing benchmark"]
      - [Heetch, "Comparable current fares and commissions unavailable", "Licensed ride-hailing supply", "Discounting and driver payout unknown", "Compliance positioning is clearer than price positioning"]
      - [Global and adjacent apps, "No common local price basket in the assigned evidence", "Mobility, delivery, or multi-service offers vary by provider", "Country availability and subsidies vary", "No defensible cross-provider price ranking is possible"]
      - [Traditional taxi or internal fleet, "Current tariff or fully loaded internal cost unavailable", "Point-to-point transport or controlled dispatch", "Negotiated rates and utilization unknown", "Status quo remains viable but is not economically benchmarked"]
