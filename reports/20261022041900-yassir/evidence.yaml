evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue by vertical, gross profit, cash balance, burn, take rate and contribution margin.
    whyItMatters: >-
      Funding and user counts do not show whether the platform is economically durable or how value is distributed
      across rides, delivery, grocery and payments.
    diligencePath: >-
      Request 2024-2026 management accounts, KPI definitions, cohort data and a vertical-level unit-economics bridge
      under NDA.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current board, executive roster, cap table, financing terms, debt and any secondary transactions.
    whyItMatters: >-
      The ownership and governance structure determines control, dilution, liquidation priority and key-person
      dependence.
    diligencePath: Obtain the latest cap table, shareholder agreements, financing documents, board materials and debt schedule.
    relatedQuestionRefs:
      - QO002
      - QO003
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: A dated reconciliation of users, partners, cities and countries using consistent active/registered definitions.
    whyItMatters: >-
      The assigned sources report eight million-plus users, 100,000-plus or 150,000 partners, and 45 or 58 cities
      without a common denominator.
    diligencePath: Request a monthly KPI pack with definitions, geography, product-line split and active versus cumulative counts.
    relatedQuestionRefs:
      - QO004
      - QO009
  - type: access-blocked
    severity: minor
    topic: regulation
    missingEvidence: Primary regulator notices and country-level licensing records for the current operating footprint.
    whyItMatters: A secondary account of evolving VTC rules is not a complete legal-status record for a multi-country platform.
    diligencePath: >-
      Collect current transport, payments, data-protection and consumer-protection registrations for each active
      country.
    relatedQuestionRefs:
      - QO007
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: A fuller dated milestone ledger covering product launches, partnerships, acquisitions and adverse events.
    whyItMatters: >-
      The available timeline establishes the strategic arc but does not independently verify every claimed operating
      milestone.
    diligencePath: >-
      Reconcile company newsroom archives, investor announcements, filings and regulator records into a dated event
      register.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: blocking
    topic: sizing-gap
    missingEvidence: >-
      A consistent 2025-2026 market-sizing bridge with urban geography, active users, transaction frequency, GMV, take
      rates, and segment-level revenue.
    whyItMatters: >-
      Without common denominators, reported users, partners, cities, and revenue cannot establish a defensible SAM, SOM,
      or valuation-relevant growth rate.
    diligencePath: >-
      Request management's city-by-city operating dashboard and reconcile it to audited or board-approved revenue and
      GMV definitions.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM008
    relatedTableRefs:
      - TM002
  - type: access-blocked
    severity: material
    topic: regulation
    missingEvidence: Primary ministry, licensing, and payment-regulator documents for each operating country.
    whyItMatters: >-
      Secondary reporting shows that rules can change the reachable market, but it does not establish Yassir's exact
      licenses, obligations, or compliance costs.
    diligencePath: >-
      Obtain current licenses, regulator correspondence, and country-by-country compliance plans from management and
      local counsel.
    relatedQuestionRefs:
      - QM007
  - type: conflicting-data
    severity: material
    topic: geography
    missingEvidence: A current operating-country and operating-city list with consistent definitions.
    whyItMatters: >-
      The retained sources cite 45 cities in six countries and 58 cities worldwide, but they do not define active
      service availability consistently.
    diligencePath: Reconcile active service areas, paused markets, and legal entities as of the reporting date.
    relatedQuestionRefs:
      - QM004
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing gap
    missingEvidence: >-
      Comparable current fares, delivery fees, merchant commissions, driver payouts, and promotion intensity by city and
      service.
    whyItMatters: >-
      Product breadth cannot be translated into price competitiveness or contribution margin without realized
      transaction economics.
    diligencePath: >-
      Request city-level price baskets, merchant contracts, driver payout schedules, promotion history, and take-rate
      data.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
