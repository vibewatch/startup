  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention
      missingEvidence: City- and product-level cohort data covering active users, repeat rate, churn, renewal, GRR, and NRR.
      whyItMatters: Reach metrics cannot establish whether customer relationships are durable or economically attractive.
      diligencePath: Request monthly cohort tables and reconciled definitions from management for the last 24 months.
      relatedQuestionRefs: [QU006, QU009]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: Three or more named production customers or merchants with contract scope and independently verifiable outcomes.
      whyItMatters: Partner categories and app features do not prove referenceable production adoption or customer ROI.
      diligencePath: Obtain permissioned customer references, signed case studies, and account-level deployment evidence.
      relatedQuestionRefs: [QU005]
      relatedTableRefs: [TU003]
    - type: conflicting-data
      severity: material
      topic: adoption-scale
      missingEvidence: A dated reconciliation of registered users, monthly active users, cities, countries, and partners.
      whyItMatters: The reported 1-million MAU figure and 8-million user figure have different definitions or periods and cannot be used as a growth rate.
      diligencePath: Request KPI definitions, measurement dates, geography, and audit trail for each adoption metric.
      relatedQuestionRefs: [QU003, QU004]
      relatedTableRefs: [TU002]
    - type: missing-source
      severity: material
