schemaVersion: "report-v2"
artifact: customers
slug: yassir
runDate: 2026-10-22
company:
  name: Yassir
chapter:
  number: 6
  title: Customers
  summary: Yassir has assembled a large, multi-sided user and partner network across mobility, delivery, groceries, and payments, but public evidence is stronger for reach than for durable retention, paid conversion, or customer-level outcomes. The clearest current customer risk is that regulatory and market friction can impair service availability in individual countries.
sections:
  - id: customer-segmentation
    title: Customer segments and marketplace roles
    body: >-
      Yassir serves a multi-sided marketplace rather than a single buyer class. Public descriptions identify riders and household users, restaurants and grocery merchants, drivers and couriers, wholesalers and FMCG suppliers, and business customers using transport or procurement tools. The consumer proposition combines ride-hailing, food, grocery, and payments in one app, while the partner proposition is access to demand and income. This structure creates cross-side density, but the public record does not disclose segment-level revenue, active users by product, or the share of transactions that comes from each role. The segmentation below therefore distinguishes documented participant groups from unresolved economic value.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-durability
    title: Adoption trajectory and durability
    body: >-
      The strongest adoption evidence is scale disclosed in company-associated and investor-facing materials: 45 cities, six countries, more than 8 million users, and more than 100,000 partners in 2022-era reporting. A separate app listing describes 150,000 partners in 58 cities, but it does not provide a dated active-user denominator or an independently audited trend. A 2026 trade article reports one million monthly active users, which conflicts with the broader 8-million user figure because the populations and dates are not comparable. These signals support reach, not retention: no public source in this pool supplies NRR, GRR, churn, repeat-purchase cohorts, cancellation rates, or contribution margin by segment.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-expansion
    title: Named customer proof and expansion surfaces
    body: >-
      Public evidence identifies customer and partner categories more reliably than named enterprise customers. The platform is described as generating revenue opportunities for drivers, couriers, merchants, wholesalers, and other vendors, while the app listing names product surfaces such as Yassir Go, Yassir Express, Yassir Market, and Yassir Pay. A customer can therefore enter through a ride, delivery, grocery, or payment use case and potentially expand across services. However, the retained sources do not establish which named merchants or institutions are in production, what outcomes they achieved, or whether use is recurring. The proof table records this limitation explicitly rather than treating logos or marketplace categories as retention evidence.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
  - id: concentration-and-friction
    title: Expansion, concentration, and procurement friction
    body: >-
      Yassir's expansion logic depends on local operating density and the ability to reuse a consumer and partner network across adjacent services. That can lower acquisition friction for a second product, but it also concentrates execution in regulated urban markets and on the availability of drivers, couriers, merchants, and payment rails. AlgeriaTech reports that the company operates across 45 cities and that updated VTC rules were expected in 2026; the same source describes Morocco's effective October 2025 shutdown of ride-hailing apps as a regional warning. Public sources do not quantify top-customer concentration, channel dependence, procurement cycle length, or city-level utilization. These are material diligence gaps for judging durability.
    claimRefs: [CU013, CU014, CU015]
  - id: exhibits
    title: Exhibits
    body: >-
      Customer evidence is most decision-useful when read as a funnel from participant coverage to repeat economics: the public file establishes broad reach and product breadth, but does not yet establish durable cohort behavior or named production outcomes. The exhibit separates entry points, transaction surfaces, payment, adjacent-service exposure, and the unmeasured repeat step. It should be read as an operating hypothesis grounded in documented product surfaces, not as proof that cross-sell or retention has occurred.
    claimRefs: [CU005, CU008, CU012]
tables:
  - id: TU001
    title: Customer segmentation table
    columns: [Segment, Buyer/user/payer role, Documented use case, Scale or strategic value, Gap]
    rows:
      - [Consumers and riders, User and payer, Ride-hailing and daily mobility, "More than 8 million users in company-associated 2022-era reporting", "Active users, frequency, and paid retention by city are not disclosed"]
      - [Food and grocery households, User and payer, Restaurant ordering and grocery delivery, "Yassir Express and Yassir Market extend the consumer relationship", "Order frequency, basket size, cancellation, and repeat cohorts are not disclosed"]
      - [Drivers and couriers, Supply-side partner, Rides and delivery fulfillment, "More than 100,000 partners in 2022-era reporting", "Utilization, earnings, churn, and supply concentration are not disclosed"]
      - ["Restaurants, merchants, FMCG suppliers, and wholesalers", Supply-side partner and seller, "Merchant demand, delivery, and marketplace payments", "Sources describe a multi-sided network serving these partner categories", "Named production accounts, take rate, and merchant retention are not disclosed"]
      - [Businesses, Buyer and account administrator, "Fleet transport, procurement, parcels, meals, and gift cards", "B2B tools broaden addressable use cases beyond consumers", "Contract count, recurring revenue, and procurement cycle are not disclosed"]
    notes: "Categories and scale are drawn from the retained public sources; null gaps mean the assigned evidence did not provide denominators or cohort economics."
    claimRefs: [CU001, CU002, CU003, CU004, CU009]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Metric, Value, Date or period, Source basis, Confidence, Implication, Missing denominator]
    rows:
      - [Users, "More than 8 million", "2022-era reporting", "Fintech News Africa and partner/investor-facing descriptions", high, "Demonstrates broad reach across the ecosystem", "Active versus registered users and product mix"]
      - [Cities and countries, "45 cities; six countries", "2022-era reporting", "Fintech News Africa and Y Combinator profile", medium, "Shows geographic operating footprint", "City-level activity and utilization"]
      - [Partners, "More than 100,000", "2022-era reporting", "Fintech News Africa and Inference Partners", medium, "Indicates substantial supply and merchant network", "Active partners, partner retention, and role mix"]
      - [Monthly active users, "More than 1 million", "2026 article", "TribeTechie report", low, "Potentially indicates continuing usage, but population is not reconciled to total users", "Definition, geography, measurement date, and underlying source"]
      - [App marketplace footprint, "More than 150,000 partners; 58 cities", "Undated current app listing", "Apple App Store listing", medium, "Suggests a larger claimed footprint than earlier reporting", "Publication date, active status, and city list"]
    notes: "The values are not combined into a single growth rate: dates, definitions, and denominators differ, and the 1-million MAU report is not independently corroborated in the assigned pool."
    claimRefs: [CU005, CU006, CU007, CU008]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or proof category, Segment, Deployment or use case, Production versus pilot, Outcome, Limitation]
    enumerationScope:
      coverage: sample
      basis: "Publicly named customer and partner categories found in the assigned source pool, through 2026-10-22"
    rows:
      - [Drivers and delivery riders, Mobility and delivery supply, Partner network fulfills rides and orders, "Production network claimed", "Income opportunities and fulfillment capacity described", "No named driver cohort, earnings, or retention outcome"]
      - [Restaurants and grocery merchants, Merchant supply, "Yassir Express and Yassir Market ordering and delivery", "Production service surface claimed", "Demand access and order-management value described", "No named merchant account or audited sales outcome"]
      - [FMCGs and wholesalers, Merchant and supply ecosystem, Marketplace and payment infrastructure, "Production ecosystem role described", "Potential access to transaction and payment flows", "No named counterparty, contract, or volume outcome"]
      - [Household users, Consumer demand, "Yassir Go, Yassir Express, Yassir Market, and Yassir Pay", "Production products described", "Convenience and one-app access claimed", "No independently verified repeat use or satisfaction cohort"]
    notes: "This is a partial proof inventory of categories, not an exhaustive customer list; the assigned sources do not provide three named enterprise customers with independently verified production outcomes."
    claimRefs: [CU009, CU010, CU011, CU012]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: The documented customer journey moves from a consumer or partner entry point through a core transaction toward adjacent services, with retention and expansion evidence still unmeasured.
    data:
      nodes:
        - id: entry-consumer
          label: Consumer need
          detail: Ride, meal, grocery, or payment need enters the app.
        - id: entry-partner
          label: Partner supply
          detail: Driver, courier, merchant, FMCG, or wholesaler supplies the marketplace.
        - id: core-transaction
          label: Core transaction
          detail: Yassir Go, Yassir Express, or Yassir Market connects demand and fulfillment.
        - id: payment
          label: Payment layer
          detail: Yassir Pay and wallet-style payment surfaces support transaction settlement.
        - id: adjacent-service
          label: Adjacent service
          detail: Users and partners may encounter another mobility, delivery, grocery, or payment use case.
        - id: repeat-expansion
          label: Repeat or expansion
          detail: Public sources do not disclose cohort retention, cross-sell, or repeat-purchase rates.
    claimRefs: [CU002, CU009, CU013]
callouts:
  - calloutType: strength
    title: Broad marketplace reach
    body: Yassir's public evidence supports a broad consumer and partner footprint spanning multiple service categories and geographies.
    claimRefs: [CU005, CU006, CU009]
  - calloutType: risk
    title: Reach is not durability
    body: User and partner counts are not accompanied by cohort retention, utilization, or segment-level unit economics, leaving customer durability unresolved.
    claimRefs: [CU007, CU008, CU012]
  - calloutType: recommendation
    title: Request cohort and account evidence
    body: Obtain city-by-city active cohorts, repeat rates, churn, take rate, contribution margin, and named customer contracts before underwriting expansion or valuation.
    claimRefs: [CU008, CU012, CU015]
