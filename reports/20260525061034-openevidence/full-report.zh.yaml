      - number: '8.4'
        title: 建议、退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              有证据支撑的建议是继续研究，而不是买入。OpenEvidence 看起来是一家真实公司，也有真实采用，但当前私募价格已经假设公司会把使用
              转化为耐久、高质量收入，并达到公开证据尚未记录的规模。务实看，今天的估值更像是对未来企业变现、未来广告主耐久性和未来监管韧性的
              预支。这仍可能跑通，但让入场纪律变得关键。除非尽调能补上最大缺口——经审计收入和毛利率、广告主集中度和留存、已签署企业集成、
              股权结构表优先权悬垂，以及临床质量治理——投资者应把公司视为跟踪或稍后承保的机会。因此，退出准备度是有条件的，而非已被证明。 如果 OpenEvidence
              能把采用转化为披露的经常性经济性，并维持内容和监管利益相关方的信任，它可能具备 IPO 条件；但截至 2026-05-25， 公开证据还不足以在没有非公开尽调的情况下按当前估值承保这一结果。
