      - number: '3.4'
        title: 切换成本、护城河耐久度与反向证据
        blocks:
          - type: paragraph
            body: >
              证据支持一个更细的护城河判断。OpenEvidence 通过官方内容合作、面向临床医生的定位，以及已公布的 HIPAA/SOC 2 控制，拥有真实信任优势。这一点重要，因为 FDA
              对非设备临床决策支持的指引仍以临床医生可审阅性为中心：建议必须支持而不是取代判断，用户必须能够独立审阅答案依据。OpenEvidence 重引用的设计与这一要求方向一致；UpToDate Expert AI
              通过暴露假设和来源推理，也在表达同一点。换句话说，来源可追溯性是竞争门槛，不只是产品功能。


              但反向证据同样清晰。Doximity Ask 自己的 FAQ 称输出可能包含不准确之处，应始终验证；学术文献也仍把幻觉视为活跃的患者安全问题，即便在检索增强系统里也是如此。MDPI 的本地部署 RAG
              研究显示缓解是可能的，但仍需要来源标签、审计轨迹和验证层。这使商品化风险在两类场景最高：工作流能容忍“足够好”的有证据锚定答案，且更大平台可以补贴分发。OpenEvidence
              的护城河在授权内容访问和临床医生心智份额上最耐久，在通用问答机制上最不耐久，因为 Doximity 可以打包，既有厂商可以延伸既有合同，通用模型供应商也能持续把自建还是购买的边界推向医院和其他工作流所有者。 
