  - id: TM004
    title: 增长驱动与约束表
    columns:
      - 驱动或约束
      - 方向
      - 证据
      - 时点
      - 商业含义
      - 尽调问题
    rows:
      - - 医生 AI 采用率已越过 80%
        - 驱动
        - AMA 显示 >80% 医生用于专业场景，平均 2.3 个用例
        - 当前
        - 市场不再需要基础认知教育
        - 哪些临床医生群体每周使用 OpenEvidence，哪些只是试用？
      - - 研究摘要已是主流 AI 用例
        - 驱动
        - 39% 医生用 AI 做研究和照护标准摘要
        - 当前
        - 与诊疗现场证据检索的核心任务直接重合
        - 使用中有多少是床旁决策支持，多少是异步研究？
      - - 职业倦怠和 EHR 负担仍然尖锐
        - 驱动
        - 70% 认为自动化可缓解倦怠；PTO 期间 EHR 工作仍在
        - 当前
        - 能省点击和搜索时间的工具有可信 ROI 叙事
        - OpenEvidence 能否量化节省的时间，或避免的收件箱 / 搜索负担？
      - - 治理、隐私、验证和责任门槛
        - 约束
        - 86% 关注隐私、88% 关注验证，责任框架是最主要监管诉求
        - 当前
        - 没有信任控制，企业买方会挡住规模化
        - OpenEvidence 提供什么验证包、审计轨迹和法律定位？
      - - 警报疲劳和工作流过载
        - 约束
        - 高警报暴露会显著降低对新 CDS 警报的响应
        - 当前
        - 打扰式 UX 即使底层智能提升，也会压低采用率
        - OpenEvidence 如何避免沦为又一个打断式警报源？
      - - 在位厂商装机基础和 AI 延伸
        - 约束
        - UpToDate 和 DynaMed 已掌握可信工作流；Dyna AI Mode 把基础继续延伸
        - 近期
        - 新进入者必须打赢信任加工作流，而不只是模型能力
        - 什么切换触发点能证明替换或叠加在位产品值得？
    notes: 这张表把需求侧驱动和卡口约束放在一起，因为同一股工作流压力既创造需求，也抬高采购标准。 时点指因素何时影响采用，不是底层来源何时发布。
