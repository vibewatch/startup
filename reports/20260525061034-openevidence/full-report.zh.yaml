  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 必须成立的条件
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 医生渗透率保持在 40% 以上，收入大约再次翻倍，广告 CPM 守住，企业端商业化开始有分量。
        - $10B-$15B；如果 OpenEvidence 复利成长为定义品类的医生平台，而不是单一功能的临床搜索工具，当前估值可以成立。
        - 执行仍取决于商业化质量、合作伙伴耐久性，以及没有重大治理冲击。
        - 需要披露的收入运行率远高于当前公开证据，并且企业端证明更清晰。
      - - 基准
        - 采用保持强劲，但商业化成熟更慢，披露仍不完整，估值向优质私营公司溢价倍数收敛，而不是极端稀缺性倍数。
        - $5B-$8B；结局仍然很大，但低于当前估值，更接近优质私营公司相对公开可比公司的高溢价。
        - 公开可比公司的估值引力、广告主质量参差，以及企业端商业化仅部分跑通。
        - 与当前公开证据最一致。
      - - 悲观
        - 使用增长放缓、广告需求转弱、竞争压力上升，或围绕智能体医疗辅助的监管收紧。
        - $2B-$4B；产品仍然很强，但市场开始为真实经济性而不是可选性买单，估值会大幅压缩。
        - 倍数压缩、信任受损，或下轮重置。
        - 由收入质量弱、续约弱，或重大监管 / 合作伙伴挫折触发。
    notes: 这些区间是判断性估值带，锚定已披露采用、估计收入、公开可比公司倍数和私营医疗 AI 稀缺性，而不是没有支撑的 DCF 精度。
    claimRefs:
      - CV017
      - CV041
      - CV042
      - CV044
      - CV045
      - CV046
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 估值 / 状态
      - 收入背景
      - 参照意义
      - 局限
    rows:
      - - OpenEvidence（当前私营估值）
        - $12B 私营 Series D 轮
        - 估计 2025 年收入年化约 $150M；官方披露收入门槛 >$100M
        - 本章当前投资测算的锚点
        - 收入估计未经审计，私营估值定价机制可能夸大可比性
      - - Doximity
        - $3.64B 上市市值（~5.8x）
        - TTM 收入约 $0.63B；广告占比较高的医生网络
        - 最接近的上市商业化参照，因为医生受众和广告经济性重叠
        - 产品更成熟，通信 / 工作流产品组合更广
      - - Tempus AI
        - $8.29B 上市市值（~6.5x）
        - TTM 收入约 $1.27B
        - 用于衡量数据 / 软件溢价的上市医疗 AI 基准
        - 诊断和基因组业务结构不同于医生搜索
      - - Veeva Systems
        - $26.13B 上市市值（~8.2x）
        - TTM 收入约 $3.19B
        - 衡量规模化信任和工作流价值的最佳临床软件基准
        - 面向生命科学企业的企业 SaaS，不是免费的医生产品
      - - Phreesia
        - $0.55B 上市市值（~1.2x）
        - TTM 收入约 $0.46B
        - 工作流软件参照，用于约束下行倍数
        - 患者接待和互动在经济性上不同于临床医生 AI
      - - Health Catalyst
        - $0.095B 上市市值（~0.3x）
        - TTM 收入约 $0.31B
        - 说明公开市场如何严厉惩罚增长较慢或差异化较弱的健康 IT
        - 类似转型困境的画像，不是 AI 稀缺性资产
      - - Hippocratic AI
        - $3.5B 私营 Series C 轮
        - 收入未公开披露
        - 可参照的私营医疗 AI 稀缺性可比公司
        - 终端市场不同，且没有公开收入披露
      - - UpToDate / Wolters Kluwer
        - 未披露独立估值
        - 通过席位授权知识模型可参考约 $595M 收入
        - 循证临床知识工具的有用商业化参照
        - 没有独立交易倍数，母公司背景削弱可比性
    notes: 上市公司样本以市值 / 收入作为可观察的实用代理，因为此处没有来源支撑企业价值口径调整；表格选取了直接可比的医生、临床软件和医疗 AI 参照，并非穷尽。
    enumerationScope:
      coverage: partial
      basis: >-
        Selected set of directly relevant medical AI, physician workflow, and clinical software references with
        disclosed May 2026 valuation or revenue context.
