      - number: '6.2'
        title: 已披露客户与用户验证
        blocks:
          - type: paragraph
            body: >-
              公开客户证据确实存在，但并不均衡。最强的组织级证据来自具名披露的医疗系统部署。 Cedars-Sinai 披露了一个具备患者上下文的企业级落地，医生、护士、药师和治疗师可以 结合特定患者的 EHR
              数据查询文献；Mount Sinai 也披露了面向医生、护士和药师的 七家医院 Epic 部署，并称这是 OpenEvidence 与医疗系统签下的第一份企业协议。二级报道还 显示，Sutter Health
              早在 2026 年已把 OpenEvidence 接入 Epic 工作流，不过其公开来源链比 Cedars-Sinai 或 Mount Sinai 更薄。合在一起，这三套系统说明 OpenEvidence
              可以从个人设备使用， 推进到受治理的机构工作流。


              有姓名背书的个人用户证据也能看到，但质量低于企业部署证据。John Lee 医生、Ram Dandillaya 医生 和 Antonio Jorge Forte 医生的官方推荐语都描述了反复出现的临床价值，NBC
              报道又加入 Paul Sax、Jeremy Cauwels 等独立医生声音。不过，证据质量边界很关键。有姓名的医生引用能证明 产品有用；不能证明账户收入、合同范围或续约。同样，ACOG 与 Wiley
              的期刊和学会协议证明内容深度 和分发相关性，但那是合作伙伴证据，不是客户证据。因此，本章把医院部署和具名医生推荐语作为 主要客户证据，同时明确把合作伙伴公告与付费客户证据分开。
