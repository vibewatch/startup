  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与直接同业
        blocks:
          - type: paragraph
            body: >
              OpenEvidence 并不是在与单一可比产品竞争。最接近的直接重叠来自 AI 原生临床参考工具，它们承诺在床旁快速给出答案；但这个类别很快扩展到相邻的医生工作流套件，以及正在把生成式 AI
              嫁接到精选内容上的既有证据产品。OpenEvidence 自己围绕来自授权期刊和指南、带引用链接的答案来描述产品；Doximity 则营销一个免费的 Ask 产品，并把 Pathway
              的参考语料吸收入更宽的医生工作流套件。Glass Health 也是直接同业，不过其公开界面更轻地把自己定位在环境式记录加临床决策支持，而不是宽医院平台。


              直接同业证据很重要，因为价格和分发已经开始分化。OpenEvidence 对临床医生仍免费并由广告支持；Pathway 原来付费的高级档，在 Doximity 以 $63 million 收购该公司后被折叠进
              Doximity Ask。这一组合把一个曾经独立付费的临床参考产品，变成了 Doximity 网络里的免费功能；Doximity 称该网络触达超过 80% 至 85% 的美国医生。对 OpenEvidence
              来说，近期竞争重点不再是证明临床医生想要 AI 搜索，而是当更大的工作流平台决定以零边际价格打包类似参考能力时，一个独立目的地能否守住注意力。  
