    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与产品模式
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence 是一家总部在 Miami 的医疗 AI 公司。公司由 Daniel Nadler 和 Zachary Ziegler 于 2022 年创立，面向临床医生的平台在 2023
              年推出。公司把自己定位成医疗知识平台，以及服务高风险诊疗现场决策的 AI 副驾，而不是通用聊天机器人。这个差异对其 GTM 叙事很关键：OpenEvidence
              称答案基于经同行评审的医学文献，会引用底层来源，并用授权医学内容训练，而不是开放互联网。产品界面如今覆盖核心 Ask 体验、用于就诊捕捉和病历生成的 Visits、可免手操作问答的 Voice
              Mode，以及用于更长篇智能体研究的
              DeepConsult。核心访问仍对已验证身份的美国临床医生免费，这帮助了分发，但免费模式由广告买单。最终形成的平台更像工作流基础设施，而不是单一搜索工具；但它的商业耐久度仍取决于医生是否同时信任答案质量和变现护栏。
