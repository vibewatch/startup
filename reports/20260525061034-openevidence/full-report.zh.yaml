  - id: FU001
    title: 客户旅程地图
    type: journey-map
    layout: wide
    summary: 展示 OpenEvidence 如何先落地个体医生，再扩展到机构工作流和变现层。
    data:
      items:
        - id: stage-awareness
          label: 1. 同行发现
          actor: 个体医生
          description: 医生通过同行、媒体报道，或对 AI 医疗搜索的好奇发现 OpenEvidence。
          channels:
            - 口碑
            - 媒体报道
            - 应用商店
        - id: stage-verification
          label: 2. 验证入门
          actor: 个体医生
          description: 临床医生验证职业身份后，开始用移动应用或 Web 界面处理床旁问题。
          channels:
            - NPI / 专业身份验证
            - 移动应用
            - Web 应用
        - id: stage-habit
          label: 3. 工作流习惯化使用
          actor: 医生用户
          description: 围绕治疗问题、指南调取和文献总结，重复使用逐渐增加；除非答案看起来异常，许多答案会被快速采纳。
          channels:
            - 临床搜索
            - 文献引用
            - 移动端便利性
        - id: stage-enterprise
          label: 4. 系统集成
          actor: 医疗系统买方
          description: 自下而上采用之后，医疗系统把 OpenEvidence 集成进 Epic 或 EHR，并把访问扩展给护士、药剂师和治疗师。
          channels:
            - Epic / EHR 集成
            - 受治理推广
            - 多学科访问
        - id: stage-monetization
          label: 5. 变现循环
          actor: 广告主和企业买方
          description: 当前变现来自定向生命科学广告，企业合同则是下一层公开扩张。
          channels:
            - 广告
            - 企业签约
            - 专科内容合作
