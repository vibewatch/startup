  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入口径与现状替代品
        blocks:
          - type: paragraph
            body: >-
              对 OpenEvidence 而言，相关市场不是“所有医疗 AI”，甚至也不是临床软件的每个类别。AHRQ
              把临床决策支持定义为通常在诊疗现场提供的及时信息，用来帮助有关患者护理的决策；例子包括建议、数据库、提醒和警报。FDA 的临床决策支持指引进一步收紧商业边界，把若干面向临床医生的非设备 CDS
              软件功能，与受设备监管的软件功能区分开来，尤其是后者面向患者，或仍处在 FDA 数字健康监管范围内。落到实际支出口径，这意味着市场包括面向临床医生的知识订阅、证据数据库、AI 辅助临床问题回答，以及嵌入 EHR
              的推荐层；但大块环境式文档、面向患者的症状分诊、纯编码或收入周期工具、影像 / 信号分析产品则被排除在外，除非它们作为床旁或会诊工作流里的临床医生决策支持出售。


              现状替代品也不只是某一家既有供应商。临床医生在采用新的专用工具之前，经常靠在线数据库、免费互联网搜索和同事回答问题；UpToDate 与 DynaMed 则设定了参照标准：快速、基于文献、并集成进移动端和 EHR
              工作流的答案。Epocrates 和 AMBOSS 说明，该类别的一部分仍可用自助或小团队订阅跑通；Glass Health 和 Pathway 等更新的 AI 原生产品则显示，替代集合如今既包括 LLM
              形态界面，也包括传统参考库。因此，从市场定义看，OpenEvidence 位于一个“临床医生信任 + 工作流”类别中；这里的买方已经期待带引用的证据、快速检索和低摩擦部署，而不是消费者聊天体验。
