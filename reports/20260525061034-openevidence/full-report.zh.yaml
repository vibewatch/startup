  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、产品责任与隐私暴露
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence 排名最高的风险，不是 FDA 目前把它作为设备监管，而是产品路线图始终贴近非设备临床决策支持 的边界。FDA 2026 年 1
              月指南仅在医疗专业人员能够独立审查推荐依据、且并非意在主要依赖该推荐时， 才保留排除适用。OpenEvidence 的条款在这一点上有帮助：条款反复把责任推回临床医生，否认诊断用途，
              并把软件定位为信息支持。这是实质缓释，不是样板话。但公司同时营销高风险床旁使用，如今支持 PHI 上传， 并披露录制式 Visits 等工作流。如果未来 UX、医院部署或智能体功能削弱医生实际检查答案依据的能力，
              医院风险委员会和监管者可能很快重新审视分类问题。责任风险与分类问题并行。即便 FDA 从未把 OpenEvidence 视为设备，只要幻觉或不完整输出影响诊疗，临床医生、医院和供应商仍有敞口。隐私和 HIPAA
              风险同样重要， 因为 OpenEvidence 用专业身份数据变现定制内容和广告，而 HHS OCR 明确表示，向追踪或营销供应商披露 PHI 需要适当许可和
              BAA。公开控制在改善，但产品从文献搜索走向患者上下文工作流后，剩余暴露仍高。
