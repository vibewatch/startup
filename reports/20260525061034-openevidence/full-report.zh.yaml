        - 网页端、原生移动端和 Voice Mode 入口，用于自然语言提问
        - OpenEvidence 应用界面和已验证临床人员访问
        - 公司声称多界面一致，但缺少公开的设备级质量指标
      - - 研究编排层
        - Ask 负责快速检索，Deep Consult 负责更长篇的智能体综合
        - OpenEvidence 自己的工作流设计和提示词编排
        - 公开来源没有披露模型路由、供应商组合或回退行为
      - - 授权证据语料库
        - 提供支撑答案的文献和指南材料
        - NEJM、JAMA、NCCN、Wiley/Cochrane、FDA、CDC 以及其他内容合作伙伴
        - 覆盖广度取决于持续授权，在合作伙伴领域之外可能仍不完整
      - - 引用 / 验证层
        - 给临床人员提供可下钻来源、转录、参考文献和来源文档
        - 带来源链接的答案渲染和合作伙伴 QA 义务
        - 出现引用本身不能证明生成答案具备因果层面的忠实度
      - - 企业上下文层
        - 为医院工作流和患者感知使用场景注入 EHR 上下文
        - Mount Sinai 和 Cedars-Sinai 的 Epic 集成
        - 公开材料没有说明患者感知答案的数据流边界、留存窗口或安全审查
      - - 文档 / 沟通扩展
        - 把证据检索转成就诊记录、编码、消息、传真和电话工作流
        - 内部工作流模块加临床人员采用
        - 每增加一个工作流，都放大了需要质量、隐私和可靠性保障的表面积
    notes: 这是一张运营模型图，不是隐藏模型栈声明。它只反映公开来源中的界面、内容依赖和工作流层。
