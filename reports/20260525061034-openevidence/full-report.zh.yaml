            body: >-
              最好的公开基准不是通用 SaaS 篮子，而是一组窄口径的医生工作流、临床软件和医疗 AI 公司。Doximity 是最接近的公开变现参照， 因为它把医生网络和广告经济性结合在一起；收入倍数约 5.8x、市值约
              $3.64 billion，即便披露更充分，仍远低于 OpenEvidence 的 私募估值。Tempus AI 和 Veeva 证明，公开市场会为规模化医疗 AI 或临床软件业务支付 6-8x
              收入倍数，且这些公司的收入基数大得多。 Phreesia 和 Health Catalyst 等低倍数工作流公司提醒投资者，一旦增长放缓或产品差异化变弱，医疗 IT 倍数会多快压缩。Sacra 对 高价医生广告
              CPM 和约 $124 ARPU 的描述解释了广告模型为何有吸引力，但也凸显核心承保问题：公开证据尚未显示广告主集中度、 续约质量，或广告收入与任何企业合同之间的结构。在已披露基本面上，当前 $12
              billion 估值明显跑在公开可比区间前面，因此需要 私人市场稀缺性和超增长假设，而这些尚未被公开证据充分去风险。
