      - number: '7.3'
        title: 依赖、护城河压缩与平台竞争
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence 的护城河真实存在，但依赖很重。Wiley/Cochrane 内容和更广泛的期刊 / 指南栈不是边缘输入；
              它们是“答案扎根于临床医生可验证权威来源”这一主张的核心。这形成了双刃剑结构。授权若加深并保持差异化， OpenEvidence
              看起来会比通用聊天机器人更可防守。若成本上升、排他性变弱或覆盖缺口更显眼，毛利率和信任可能 同时被侵蚀。基础设施和分发也一样。OpenEvidence 披露托管在 Google Cloud Platform 和
              Vercel，而更大的竞争者 正直接进入同一工作流。OpenAI 现在向医院营销支持 HIPAA 的证据检索，Anthropic 提供可用于医疗的 CMS、NPI 和 PubMed 连接器，Google 推
              MedLM 和 Vertex Search，Doximity 把临床 AI 打包进一个已覆盖大多数美国医生的医生网络， Microsoft 则把 Dragon Copilot
              定位为企业外壳，可在同一环境式工作流中露出 OpenEvidence、UpToDate 和 Elsevier。 这部分是行业性风险，但公司层面的后果很清楚：如果临床问题在 EHR
              或占主导的环境式助手内得到回答，独立查询份额和 定价权可能比收入增长暗示得更快压缩。
