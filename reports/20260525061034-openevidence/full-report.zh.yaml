      - number: '5.5'
        title: 差异化、路线图与技术风险图谱
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence 的差异化并不是披露了新颖模型架构，而是一个原生嵌入工作流的证据栈：它把授权的同行评审文献和指南内容直接放进临床医生工作流，再在其上叠加带引用答案、语音、感知患者上下文的 EHR
              上下文和文档工具。公开材料可见的产品路线图也体现了这一点：2025 年 HIPAA 与移动应用，2025 年末 NCCN 和更广肿瘤指南授权，2026 年 3 月 Coding Intelligence，2026
              年 4 月 DotFlows，到 2026 年 5 月 Cedars 感知患者上下文能力和 Voice Mode。规模宣称很大——超过 40% 的美国医生、超过 10,000 家医院和医疗中心、860,000
              名临床医生，以及单日 1 million 次医生-AI 咨询里程碑——但主要技术尽调问题都在下行场景。第一，证据语料库质量高，并不意味着幻觉风险消失；更广泛的医疗 LLM
              研究仍发现推理失败时有患者伤害风险。第二，即便在带引用或类 RAG
              系统中，可解释性仍不完整，因为引用本身不能证明生成答案在因果上忠实。第三，覆盖广度取决于出版方和医学会授权能否持续。第四，公开证据对可用性、延迟和复杂病例基准表现的支撑，仍显著薄于采用叙事。
