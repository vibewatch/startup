        - 公开来源没有按护理场景披露答案延迟中位数
      - - 罕见病例的复杂文献综合
        - 手工搜索、筛选并综合大量研究
        - Deep Consult 高级研究智能体
        - 产品定位是为复杂问题生成博士水平研究报告
        - 完成时间、引用错误率或临床人员接受度没有公开基准
      - - 查阅病历时的 EHR 内团队会诊
        - 单独登录和外部检索拖慢采用
        - Mount Sinai 为医生、护士和药剂师提供嵌入 Epic 的访问
        - 2026 年 3 月上线明确把企业访问扩展到完整护理团队
        - 公开来源没有给出部署成本、激活率或留存使用指标
      - - 患者感知证据检索
        - 临床人员必须在脑中把文献与患者病历拼在一起
        - Cedars-Sinai 把来自 Epic 的患者上下文直接整合进 OpenEvidence
        - 公开描述包括既往手术、合并症、用药、过敏和纵向数据
        - 加入患者上下文后，引用忠实度没有外部验证
      - - 就诊后的文档和随访工作
        - 编码、消息、传真和随访任务经常流入不同工具
        - Visits、Coding Intelligence、Messages、Fax 和 Dialer 界面
        - 2026 年公开材料描述了自动生成 CPT/E/M/ICD-10 和消息同意控制
        - 临床、收入周期和沟通结果的公开证据仍然很薄
    notes: 可衡量收益列记录的是公开文档已有内容，不是有保证的 ROI。大多数部署经济性和工作流节省主张仍需要客户尽调。
