  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用医生工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence 已经不只是医生搜索框。其公开用户指南界面覆盖快速咨询、指南、预授权和文书、药物信息与安全、临床试验招募、计算器、患者材料、医学教育、收件箱管理、Deep
              Consult、DotFlows、Voice Mode、Visits、笔记生成、账单编码、就诊后摘要、排程、模板、患者 Q&A、Voices、Dialer、Fax 和
              Messages。按工作流看，产品想横跨三个反复出现的任务：快速床旁证据检索、复杂病例的更重文献综合，以及证据答案产出后的相邻文档 / 行政工作。Voice Mode
              把咨询工作流延伸到查房或在患者之间移动等免手场景，Deep Consult 则把更难的临床问题包装成较长篇的研究智能体。移动端分发重要，因为平台现在有原生 iOS 和 Android
              应用，承诺提供与网页产品相同的带引用答案体验；Google Play 还明确把该应用描述为仅面向已验证医疗专业人士的诊疗现场决策支持。
