        - label: 公开可比公司支撑
          value: 2
          note: 当前倍数远高于公开可比公司区间。
        - label: 监管耐久性
          value: 4
          note: 现有边界可控，但 Agent 化扩张会增加风险。
        - label: 竞争韧性
          value: 6
          note: OpenEvidence 领先，但公开和私有医疗 AI 竞争都是真实压力。
        - label: 证据质量
          value: 5
          note: 采用证据强于经济性披露。
        - label: 入场吸引力
          value: 3
          note: 公司优秀；仅看公开证据，当前入场纪律很差。
