      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              终端用户通常是带着紧急问题的临床医生，但付款方会随合同形态大幅变化。Epocrates 和 AMBOSS 的公开价格页显示，个人医生和小团队仍可直接购买；这对自下而上采用很重要，因为它降低了初次试用摩擦。但
              BLS 就业数据显示，绝大多数医生、PA 和 NP
              都在诊所、医院和门诊机构内执业，因此规模化收入仍取决于医疗服务机构，而不是原子化消费者需求。这使真实商业地图呈三角形：临床医生是用户，医疗服务机构或科室通常付款，临床和数字化领导层的混合体担任买方与守门人。


              企业预算所有者越来越不再是单个图书馆或教育管理员。Healthleaders 和 HIMSS 都描述了一种采购动作：当 AI 输出触及决策，或最终可能嵌入 EHR 时，流程会经过
              CMIO、CIO、首席数字官、信息学、合规和治理委员会。医生自己也预期参与其中：85% 的 AMA
              受访者希望被咨询，或直接参与采用决策。实践中，这创造了几条并行预算路径。自付和科室购买可以打开入口，学术中心和培训项目仍可赞助参考访问，大型医疗体系则会在相信工具能降低认知负荷、加快文献综合，并满足验证、隐私和监督预期时批准企业级交易。因此，对
              OpenEvidence 来说，最现实的早期买方，是由医生主导或 CMIO 支持的内部支持者；用户是临床医生，但付款方是诊所、医疗体系或培训组织。
