      - number: '7.2'
        title: 幻觉、可审计性、安全与证据质量限制
        blocks:
          - type: paragraph
            body: >-
              幻觉和过度依赖部分是整个临床 AI 行业的风险，但对 OpenEvidence 尤其相关，因为产品明确被用于床旁高风险问题。 Voice Mode 和 Visits
              把界面从输入式搜索扩展到实时对话，便利性更高，也让语音识别错误、上下文丢失或不完整摘要 有更多路径进入工作流。外部文献带有警示意义：Patient Safety & Quality Healthcare
              概述了一项 JAMA Network Open 发现，AI 生成的出院摘要约 18% 情况下不完整或有误导性；Stanford 2026 年临床 AI 综述认为，
              许多达到医生水平的声称仍建立在狭窄基准和稀疏真实患者评估上。OpenEvidence 可以用引用、授权内容和 Mayo 品牌挑战结果
              作为缓释信号，但这些不等于经审计的真实世界结果。更深的运营问题是证据链。GLACIS 认为，当医疗系统无法重建哪段音频、 转录、模型版本和护栏状态生成了某个输出时，责任会上升。OpenEvidence
              的安全页面显示可信的控制基础——HIPAA、 SOC 2 Type II、加密和年度渗透测试——但这些是平台控制，不证明就诊级失败容易调查。因此，除非真实世界错误率、
              升级规则和取证审计轨迹得到独立证明，剩余风险仍高。
