  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与采用基础
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence
              最清晰的客户分层是个人临床医生，尤其是医生用户。访问仅限已验证的医疗专业人士；网页和应用商店界面反复把产品定位为免费的自助式诊疗现场工具，而不是先通过集中医院采购出售的软件。这个定位很重要，因为头部采用数字描述的是使用情况，不是已签约收入账户。官方界面称，超过
              40% 的美国医生每天使用该产品，覆盖 10,000 多家医院和医疗中心；NBC 则报道称，2026 年 4 月约 65% 的美国医生、约 650,000
              名活跃美国医生用户在使用。数字足够大，能证明医生采用有意义，但它们仍大多是公司定义指标，没有公开的分母桥接。


              因此，经济地图是多边的。医生是主要用户，也是核心获客切口。足够多临床医生已经依赖工具之后，医疗体系会在漏斗后段成为机构买方或付款方。药企和医疗器械广告主似乎为今天的免费产品提供资金；ACOG、Wiley、NEJM、JAMA、NCCN
              和 Cochrane 等内容合作伙伴提升产品质量，但不应被误认作客户验证。结果是分发很有吸引力，变现观感却复杂：OpenEvidence
              可能在公开记录显示谁付款、付多少、关系多黏之前，就已经拥有异常深的医生触达。
