      - number: '4.3'
        title: 成本结构与利润率路径
        blocks:
          - type: paragraph
            body: >-
              相比硬件或医疗服务业务，OpenEvidence 看起来资本较轻，但运营并不便宜。已披露成本栈集中在算力、模型训练、内容授权、合规和商业化，而不是工厂或库存。管理层称 Series D 资金将主要用于
              R&D、模型训练、算力和扩展内容合作；2025 年 7 月发布材料称，每次 DeepConsult 运行消耗的算力和成本超过标准搜索的 100
              倍，尽管该功能对已验证临床医生仍免费。这形成熟悉的权衡：免费产品加速采用，但高算力高级功能最终必须由广告、企业合同或未来付费层补贴。授权依赖是第二个主要成本和利润率变量。OpenEvidence 的差异化依赖与
              NEJM、JAMA、NCCN、Wiley/Cochrane 和其他内容所有者的协议；R&D World 和 Sacra 都把这些合作视为护城河核心。因此，公开毛利率证据很薄：Sacra 约 90%
              的估计对软件加广告模式可能方向上合理，但它未经审计；如果授权费、推理强度或企业支持义务快于收入扩张，估计可能过高。反向来源还提出了更难的问题：药企资助模式可能有利润，但仍会面临发表偏倚、信任和赞助方冲突压力，最终限制付费意愿，或把医疗体系推向无广告配置。
