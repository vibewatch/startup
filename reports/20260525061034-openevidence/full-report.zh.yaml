  - id: TR005
    title: 缓释与终止标准表
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 终止事件
      - 行动含义
    rows:
      - - FDA / CDS 分类漂移
        - 产品路线图、医院合同和 UI 语言
        - 有证据显示医院或监管机构将 OpenEvidence 视为主要诊断或治疗引擎，而非辅助式 CDS
        - 立即重估监管路径、医院推广假设和责任准备金。
      - - 医疗事故 / 幻觉事件
        - 公开事件报告、保险方争议、法律投诉或医院安全备忘录
        - 可信的患者伤害案例与 OpenEvidence 输出相关，且事件审计能力薄弱
        - 将风险评级上调一档；追加资本前要求安全数据和赔偿细节。
      - - HIPAA / 隐私泄露或 OCR 问题
        - 泄露通知、OCR 往来函件或客户安全暂停
        - 任何与追踪、录音或工作流数据相关的 PHI 泄露或 OCR 调查
        - 视为投资逻辑受损，因为信任是企业采用的核心。
      - - 广告主冲突 / 收入脆弱性
        - 头部赞助商集中、医院无广告需求，或企业收入结构切换变慢
        - 到 2027 年收入仍主要由广告驱动，且医院明显抵触赞助商邻近
        - 下调收入质量倍数，并要求非广告多元化证明。
      - - 内容授权受损
        - 续约条款、合作伙伴公告或独家权丧失
        - 一个或多个旗舰内容伙伴流失或大幅重新定价，削弱答案质量或利润率
        - 重新评估护城河耐久性和毛利率假设。
      - - 创始人 / 领导层断档
        - 高管流失或治理冲突
        - Daniel Nadler 离职或明显退居二线，且没有可信接班人与治理方案
        - 立即做董事会尽调；接班安排清晰前，按重大投资逻辑破裂处理。
      - - 国际化 / 监管停滞
        - EU/UK 准入状态和合规路线图
        - 没有可信路径重返 EU/UK 市场，也没有美国广告 / 医院之外等量的替代增长引擎
        - 收紧 TAM 假设，把扩张可选性视为微不足道。
    notes: 这些阈值刻意设计成可观察，而不是停留在理论层面，因此可以作为实时尽调监控项。
