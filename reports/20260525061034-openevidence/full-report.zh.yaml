      - number: '7.4'
        title: 人员、变现与地域扩张风险
        blocks:
          - type: paragraph
            body: >-
              执行风险压在三项相互牵连的依赖上：Daniel Nadler、广告资助变现和以美国为中心的访问。Nadler 显然不只是普通 创始人兼 CEO；融资、护城河表达和战略定位都围绕他展开，公开报道也持续把
              OpenEvidence 放在他的 Kensho 履历， 以及“医生采用会形成独特数据护城河”的主张下叙述。这在今天是资产；一旦领导层连续性断裂，就是关键人物风险。 财务上，模型有前景但脆弱。CNBC 称
              OpenEvidence 年化收入超过 $100 million，并有意使用应用内视频广告加速采用； STAT 则指出，公司现在被迫证明同一个广告模型能与正式医院关系共存。Open Pharma 和 Krafty
              Librarian 把担忧推到 最尖锐：如果赞助方资助的研究可见度、专科定向广告或不透明来源覆盖开始看起来像偏见，而不是免费访问，医疗系统可能
              比收入结构多元化更快要求无广告层。地域进一步放大问题。条款把合规负担放在美国以外用户身上，Open Pharma 报道 OpenEvidence 因 AI Act 不确定性于 2026 年 4
              月撤回了欧盟和英国访问。这让国际扩张成为真实约束，而不只是理论上的 未来门槛。
