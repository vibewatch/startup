      - number: '6.4'
        title: 扩张循环与集中度风险
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence 的扩张逻辑可信。平台似乎先靠免费医生采用切入，再借移动端和床旁工作流加深使用， 随后进入企业系统集成，把护士、药师、治疗师和其他护理团队角色纳入访问范围。与
              ACOG、Wiley、NEJM、 JAMA、NCCN、Cochrane 的内容合作扩大了专科相关性，也让产品在受治理的临床环境里更有用。如果这一模式 延续，OpenEvidence
              可以从广告资助的参考工具，走向更高价值的机构合同，并在 EHR 内部取得更广的工作流 所有权。


              风险在于，公开记录还没有证明这种扩张在经济上是否耐久、是否集中。Sacra 和 STAT 都描述了一门 广告支持业务，现在想建立正式的医疗系统关系；但已审阅的官方来源和新闻报道都没有披露广告主集中度、
              企业收入占比、头部客户敞口或合同续约。免费采用可能让漏斗在经济上显得更强，因为它绕过了采购摩擦， 却没有证明付费意愿或长期留存。因此还有两个待承保问题：企业部署规模是否足以让模型跳出广告主依赖，
              广告主基础本身是否足够分散以避开集中度风险。管理层披露队列和渠道数据之前，上行情景可以成立， 但耐久性证据仍不足。
