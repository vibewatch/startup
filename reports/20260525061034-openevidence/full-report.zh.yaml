          - type: callout
            title: 当前价格已经假设最大尽调问题的答案都是正面的
            body: 公开案例足以证明值得关注，但还不足以在 $12B 估值下形成即时确信。投资者应要求经审计经济性、广告主耐久性、企业证据和股权结构表 透明度，再从当前估值承保上行空间。
            calloutType: recommendation
