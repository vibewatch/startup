      - number: '4.4'
        title: 资本充足性与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence 的融资节奏显示其股权资本获取能力充足，但公开披露不足以让人有信心承销现金跑道。公司在 2025 年 7 月融资 $210 million，2025 年 10 月融资 $200
              million，2026 年 1 月融资 $250 million；官方和新闻来源都称截至 2026 年初累计融资约 $700
              million。相对于公开估计的收入规模，这是一笔可观资本，资金用途也指向增长投资，而不是紧急再融资。不过，同一组来源留下了核心偿付能力问题：没有公开现金余额，没有月度烧钱数字，没有现金跑道披露，也没有说明多少收入来自经常性企业软件、多少来自周期性广告支出。SEC
              证据还增加一层细节：近期唯一与 OpenEvidence 相关的 Form D
              结果，是与二级市场交易相关的集合投资工具；它能证明市场兴趣，但不能替代运营公司的透明度。财务上，这门业务看起来有前景，但仍高度依赖若干条件：它今天很可能能为产品扩张供血，但下一阶段承销取决于企业合同和生命科学产品能否在广告模式冲突、赞助方集中度或算力与授权成本压缩利润率叙事之前成熟。
