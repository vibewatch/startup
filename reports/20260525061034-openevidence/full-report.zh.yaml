      - number: '1.5'
        title: 风险、商业化张力与待解问题
        blocks:
          - type: paragraph
            body: >-
              让 OpenEvidence 强大的那些特征，也构成本章最主要的尽调旗标。公开报道显示，临床医生认可速度，但 NBC News
              发现，幻觉、不完整答案、患者结局证据有限、削弱低年资临床医生批判性思维等担忧仍持续存在。隐私接受度也不均衡：虽然 OpenEvidence 宣布符合 HIPAA，并称已获得 SOC 2 Type II 认证，但
              NBC 报道称 MaineHealth 仍要求临床医生不要输入 PHI。商业化是另一处张力。CNBC 和 NBC 都把核心产品描述为广告支持，包括药品或医疗器械推广；一篇 2026 年 medRxiv
              预印本显示，在证据本来均衡时，广告会改变药物选择。最后，OpenEvidence 已与 Doximity
              陷入现场诉讼，争议涉及涉嫌提示词攻击和商业秘密提取，反诉则指向错误信息和挖角。这些风险都没有否定公司的非凡采用率，但它们意味着，治理透明度、隐私护栏和广告模式控制，值得获得与使用增长和头部估值同等强度的尽调。
