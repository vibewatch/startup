      - number: '3.2'
        title: 既有循证工具与现状替代品
        blocks:
          - type: paragraph
            body: >
              对许多临床医生而言，现状替代品仍是一组精选参考资料，而不是单一 AI 答案引擎。Wolters Kluwer 的 UpToDate 营销个人、团队和企业套件，称其获得超过 3 million
              名健康专业人士信任；其 Expert AI 发布也明确把生成式 AI 包在专家撰写、经同行评审的 UpToDate 内容外，并提供透明来源和推理链接。DynaMedex 同样把 DynaMed 疾病证据与
              Micromedex 药物证据结合起来，并依托 KLAS 认可，以及 Dyna AI 向用药剂量和安全性的扩展。Elsevier 的 ClinicalKey AI、Micromedex 和 Epocrates
              各自覆盖同一待完成任务的相邻切片：快速证据检索、药物安全、指南查找和工作流安全的参考访问。


              这一点重要，因为机构医疗里的切换成本不只关乎答案质量。既有厂商已经嵌入 EHR 链接、CME 习惯、处方集工作流、采购预算和医院图书馆合同。它们也在防守更窄但黏性很强的使用场景。Micromedex
              的药物相互作用、毒理学和 RED BOOK 定价数据足够专业，通用 AI 副驾不会自动替代它们。Epocrates
              更便宜、更轻量，因此即便不是完整百科式证据工具，也能成为药物和指南查找的实用替代。OpenEvidence
              因此竞争的不只是“更好的搜索”，还包括已经确立的临床习惯：这些习惯把受信参考、运营性药物数据库和本地政策混在一起。 
