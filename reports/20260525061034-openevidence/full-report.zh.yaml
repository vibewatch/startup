  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与商业化架构
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence
              的公开商业化模式对医疗软件而言并不常见，因为核心临床医生产品免费，而不是按订阅定价。官方和独立来源一致描述，该平台对已验证身份的美国医生免费，主要由答案加载时展示的药企和医疗器械广告资助。这个模式在财务上很关键，因为它把首次变现事件从席位销售转向查询量、医生专科结构和广告主需求。Sacra
              的收入研究显示，广告引擎在规模化后可能具有可观经济性，估计 CPM 远高于一般消费者媒体，ARPU 约 $124；与公司相关的新闻报道则称 OpenEvidence 在 2025 年年度收入突破 $100
              million。与此同时，公开来源也显示管理层正在尝试超越广告做多元化。Mount Sinai 的 Epic 部署、Sutter 的工作流合作，以及 Sacra
              对未来非广告企业层的讨论，都暗示通向更高质量合同收入的路径；Veeva/Open Vista 合作则创造了另一条生命科学渠道。仍缺失的是定价透明度：没有留存公开来源披露企业
              ACV、实施费、收入分成条款，或广告、企业和生命科学收入之间的拆分。
