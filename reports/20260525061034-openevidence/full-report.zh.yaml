      - number: '5.3'
        title: 部署模型、企业集成与工作流延伸
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence 的部署故事越来越绑定医疗体系工作流集成，而不是独立浏览器使用。Mount Sinai 2026 年 3
              月推出时，让完整临床护理团队都能在电子健康记录内部访问产品，明确包括医生、注册护士和药师。OpenEvidence 与 Hit Consultant 的描述都强调，Epic
              嵌入解决了“最后一公里”问题：临床医生可以在既有 Epic 工作流里用自然语言提出医学问题，并得到基于经同行评审文献和临床指南的答案，而无需切换到外部研究工具。Cedars-Sinai 又向前一步。其 2026
              年 5 月合作被描述为感知患者上下文的临床智能，把来自 Epic 的患者上下文直接集成进
              OpenEvidence，使答案能纳入既往手术、合并症、用药、过敏和纵向病史。在这一核心问答流周边，公司已经开始产品化相邻工作流延伸：就诊转录、编码支持、Voices、带同意控制的 Messages、Fax
              和医生拨号器。这扩大了产品有用性，但也提高了证明可靠性的负担，因为它要支撑的临床触点远多于纯证据搜索引擎。
