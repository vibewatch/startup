        - 只有尽调能核验经审计经济性、广告主耐久性和股权结构条款，或入场价格大幅下修时，才继续跟进。
    notes: 建议仅基于截至 2026-05-25 的公开证据；由于收入质量、企业客户结构和优先股堆叠数据并未公开，明确避免 DCF 式精确化。
    claimRefs:
      - CV017
      - CV041
      - CV044
      - CV045
      - CV047
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 投资逻辑
      - 反向逻辑
      - 哪些证据会改变判断
    rows:
      - - 医生采用
        - 超过 40% 的日活医生使用率和快速上升的问诊量，说明产品确实拉动工作流。
        - 使用可以很广，但未必能按软件级经济性变现，也未必能在竞争下保持耐久。
        - 展示多个季度按专科拆分的留存、重复使用和参与度队列。
      - - 内容护城河
        - NEJM、JAMA、NCCN、Cochrane 等合作确实带来信任和分发优势。
        - 出版方关系有价值，但如果竞争对手拿到类似访问权，或临床医生多平台并用，仍不足以支撑 $12B 估值。
        - 用留存或转化数据证明授权内容带来的独家价值。
      - - 商业化
        - 医生端广告溢价和免费访问可以绕开医院采购摩擦，快速放大。
        - 广告依赖带来集中度、伦理和周期性风险，公开披露尚未量化。
        - 披露广告主集中度、续约和非广告收入结构。
      - - 可比公司支撑
        - 私营医疗 AI 稀缺性和公开市场 AI 热度，解释了其相对上市健康科技可比公司的部分溢价。
        - 已披露倍数仍远高于公开可比公司区间，甚至高于许多有已知基本面的 AI 医疗同行。
        - 展示足够强的收入增长和利润率，把隐含倍数压缩到更可辩护的前瞻水平。
      - - 监管姿态
        - 当前 FDA 指引仍给临床医生支持工具留出空间，前提是产品保持透明且不作决定性判断。
        - 如果产品转向更智能体化或处方化，可能进入更重监管或治理负担。
        - 提供产品边界文件、人工复核设计和治理控制。
      - - 退出路径
        - 强采用和品牌力可能支撑未来 IPO 或战略交易进程，前提是披露成熟。
        - 目前还没有公开证据证明公司具备 IPO 级披露、耐久的企业合同或干净的优先股堆叠。
        - 分享经审计财务、董事会条款和走向上市公司准备状态的可信路径。
    notes: 反向逻辑刻意围绕估值敏感点，而不是泛泛列风险；每行都点出最能改变判断的一项披露或经营证明。
    claimRefs:
      - CV009
      - CV013
      - CV014
      - CV017
      - CV032
