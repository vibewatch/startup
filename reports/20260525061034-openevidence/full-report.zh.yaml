  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资重估，以及当前估值已经定价了什么
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence 的估值历史已不再只由 2025 年 2 月 Series A 定义。公开报道现在显示，它从 2025 年 2 月的 $1 billion， 快速阶梯式升至 7 月 $3.5
              billion、10 月 $6 billion、2026 年 1 月 $12 billion。即便按垂直 AI 标准，这也很罕见， 并实质改变了如何判断当前入场价。公司显然有真实牵引力：管理层和媒体来源都指向超过
              40% 的医生日使用率、2025 年 12 月约 18 million 次咨询、超过 100 million 名美国人被使用该产品的医生触达，以及 2025 年收入突破 $100 million。但已披露的
              变现证据仍落后于估值。Sacra 估计约 $150 million 年化收入，意味着 $12 billion 估值下收入倍数约 80x；而 2025 年 7 月 估值约 $50 million 年化收入，对应约
              70x。关键结论是，最新一轮不只是更新 Series A 估值；它把 OpenEvidence 重新定价到一个 投资者已经在承保未来状态的类别，而不只是承保今天已披露的经营基础。
