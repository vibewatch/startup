  - id: TV005
    title: 投资逻辑破裂与止损触发器表
    columns:
      - 触发器
      - 可观察阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入质量不达标
        - 经审计收入或续约显著低于管理层对 2025 年末或 2026 年的评论所暗示水平。
        - 打破当前采用正在转化为高质量经济性的判断。
        - 停止按当前估值承销，重置到下行情景。
      - - 医生参与停滞
        - 日活医生占比或问诊增长连续多个季度停止复合增长。
        - 削弱 OpenEvidence 正成为默认临床医生工作流的核心主张。
        - 把公司视为小众工具，而不是品类领导者。
      - - 广告或合作伙伴反弹
        - 主要广告主、出版方或医学会关系因信任或利益冲突担忧而受损。
        - 同时打击商业化耐久性和内容护城河。
        - 假设增长更低、治理成本更高。
      - - 监管收紧
        - FDA、州级或专业治理姿态收窄智能体临床辅助空间，或要求更重控制。
        - 提高合规成本，并拖慢产品向更高价值工作流扩张。
        - 在产品边界和合规姿态清晰前，推迟承销判断。
      - - 估值重置
        - 下一轮融资或老股参考价显著低于 $12B。
        - 确认当前私营估值领先于披露和市场支撑。
        - 按公开可比公司和下行情景纪律重新估值。
    notes: 这些是为投资纪律设计的可衡量止损标准，而不是一般经营风险。
    claimRefs:
      - CV036
      - CV038
      - CV043
      - CV048
      - CV049
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 经审计收入和毛利率
        - 经审计 FY2025 和最新收入运行率、毛利率，以及广告主调整后的贡献利润率。
        - 如果不知道商业化质量是否匹配使用质量，就无法干净地承销当前估值。
        - 向 CFO 和主要投资人索取经审计财务和队列收入桥。
      - - 广告主集中度和续约
        - 头部客户集中度、平均合同期、定价权和续约留存。
        - 广告支持模式是高溢价结果和估值重置之间最大的未证实驱动。
        - 索取前 10 大广告主结构、续约队列，以及赞助商与答案隔离政策。
      - - 企业端商业化深度
        - 已签约的医疗系统、支付方或 EHR 合同，以及广告之外的管线。
        - 可信的非广告层，是长期守住溢价倍数最干净的路径。
        - 索取已执行合同、实施时间表和企业 ARR 桥。
      - - 临床质量治理
        - 模型 QA 指标、幻觉升级流程、人工复核设计和事故日志。
        - 一旦估值依赖更深的工作流集成，监管和信任耐久性更重要。
        - 审查治理委员会材料、质量仪表盘和红队结果。
      - - 股权结构表和流动性压力
        - 优先股堆叠、清算瀑布、董事会权利和老股交易历史。
        - 即便私营估值很高，如果优先权压力损害普通股或后进入投资人的回报，仍可能缺乏吸引力。
        - 索取完整股权结构表、融资条款，以及近期老股成交价。
      - - 留存和专科深度
        - 按专科、医院类型和队列年份拆分的留存。
        - 乐观情景需要持久习惯养成，而不是一次性试用。
        - 索取用户队列分析和专科渗透趋势线。
    notes: 这些问题按最能直接改变当前价格下估值判断的事项排序。
    claimRefs:
      - CV043
      - CV047
      - CV048
      - CV049
      - CV050
