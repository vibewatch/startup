      - number: '3.3'
        title: 相邻 AI 进入者与自建替代
        blocks:
          - type: paragraph
            body: >
              OpenAI 和 Anthropic 在传统意义上不是精选医学参考资料，但它们是可信竞争进入者，因为现在都围绕通用模型销售医疗专用包装。OpenAI for Healthcare
              强调对同行评审研究、临床指南和公共卫生来源的透明引用，以及 BAA、审计日志、客户管理加密密钥、客户内容不用于训练等企业控制。Anthropic 的医疗产品同样被包装为 HIPAA
              就绪，并且越来越原生嵌入工作流：CMS 覆盖范围连接器、ICD-10 和 NPI 查询、PubMed 访问、FHIR
              开发帮助、预授权技能和索赔申诉支持。两家供应商也都发布自助价格，而不是迫使每个买方进入不透明企业采购。


              这个组合降低了内部自建门槛。已经拥有 IT 人员、治理和本地政策内容的医疗体系，越来越可以在基础模型之上拼出自己的临床医生 AI
              副驾，而不是采用独立参考目的地。取舍在于信任和专用性。通用模型在连接器、自动化和行政工作流上可以推进更快，但要被临床接受，仍需要证据锚定、监督和机构护栏。对 OpenEvidence 来说，威胁不在于
              OpenAI 或 Anthropic 成为最好的疾病百科，而在于它们让医院或工作流供应商能以低成本、行政上更方便的方式，在更大系统里复刻足够多的床旁搜索工作。 
