      - number: '6.3'
        title: 满意度、重复使用和留存可见度
        blocks:
          - type: paragraph
            body: >-
              满意度和重复使用代理指标偏正面，但并不完整。App Store 显示约 10,000 个评分下得分 4.9， AppBrain 报告 3,706 条评论下得分 4.80，并有可观的 Android
              下载量。具名医生推荐语很热烈， NBC 的报道显示医生会把产品用于真实的床旁问题，而不只是出于好奇或学习。这些信号支持一个判断： OpenEvidence
              对一批规模可观的临床医生具有成习惯的工具价值。但它们不能替代留存披露。公开来源 没有披露自助临床医生或企业账户的 NRR、GRR、流失、续约率、合同期限或队列行为。


              记录中的反向一面同样重要，因为大规模采用可能掩盖浅层参与或质量风险。Trustpilot 的存档页面 评价严厉，1.6 分主要集中在过时 ME/CFS 指引的投诉；NBC 记录了临床医生对幻觉、过度自信的综合、
              隐私护栏和受训者技能退化的担忧。NBC 还指出，一些用户只有在答案看起来异常时才点开引用，这意味着 常规依赖可能跑在系统验证前面。正确解读不是 OpenEvidence 缺乏真实客户价值；它的使用足迹太大，
              无法得出这个结论。正确解读是：公开证据支持有用性和满意度代理指标，但耐久性、质量控制和长期留存 仍明显披露不足。
