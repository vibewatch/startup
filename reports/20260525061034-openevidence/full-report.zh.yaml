  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资信号
      - 目标细分
      - 差异化
      - 局限 / 风险
    rows:
      - - OpenEvidence
        - 直接 AI 临床搜索
        - D 轮估值 $12B；过去 12 个月约融资 $700M；迄今 >200M 次临床医生咨询
        - 需要快速床旁证据查询的已认证临床医生
        - 授权期刊 / 指南合作，加上带引文链接的答案和免费访问
        - 广告支持模式、缺少明显付费席位锁定；必须防住捆绑和内部自建
      - - Doximity Ask (+ Pathway)
        - 直接 AI 临床参考 + 工作流套件
        - 美国医生中 >80%-85% 是 Doximity 用户；Pathway 收购价 $63M
        - 已在使用 Doximity 工作流工具的美国认证临床医生
        - 免费 Ask 产品把 Pathway 语料库与 Scribe、Dialer 打包
        - 未来或可做企业变现，但当前免费捆绑会压缩类别定价
      - - Glass Health
        - 直接 AI CDS / 环境式病历记录同业
        - 早期私营产品；抓取页面披露的公开规模有限
        - 需要 AI 笔记记录加 CDS 的临床医生
        - 官方定位覆盖环境式病历记录和临床决策支持
        - 与更大对手相比，公开定价和信任细节较薄
      - - UpToDate Expert AI
        - 带 GenAI 的在位精选证据工具
        - UpToDate 获 >3M 医疗专业人士信任；Wolters Kluwer 2024 年收入 €5.9B
        - 已标准化使用 UpToDate 的医院、集团和个体临床医生
        - 专家撰写内容、来源 / 理由链接、企业部署、CME 和 EHR 场景
        - 企业包装偏重报价，产品界面迭代慢于消费者 AI 工具
      - - DynaMedex
        - 带 AI 层的在位精选证据工具
        - 2026 年 Best in KLAS；结合 DynaMed 与 Micromedex
        - 需要在一个工作流中同时查疾病和药物证据的护理团队
        - Dyna AI，加上来自 Micromedex 的剂量和用药安全集成
        - 公开定价仍不透明；分发依靠企业 / 图书馆渠道
      - - ClinicalKey AI
        - 企业证据套件
        - Elsevier 企业产品；公开页面强调全组织部署
        - 医院、临床医生、药师、学生
        - 基于可信书籍、期刊、指南和 EHR 集成的负责任 AI
        - 相比 Doximity 或 OpenEvidence，自助属性更弱，医生网络效应也不明显
      - - Micromedex
        - 药物侧更重的替代 / 附加工具
        - 受 >80 个国家信任
        - 药房、毒理学、用药安全、药品目录团队
        - 2,500+ 篇专论、700+ 个计算器、毒理学、RED BOOK 定价
        - 床旁答疑范围窄于通用临床搜索工具
      - - Epocrates+
        - 轻量替代工具
        - $24.99/月或 $179.99/年
        - 关注药物信息、ICD-10、相互作用和指南的个体临床医生
        - 低价、自助、熟悉的移动端工作流
        - 不是广义证据综合平台
      - - OpenAI 内部自建
        - 潜在进入者 / 自建底座
        - 已发布 API 定价；ChatGPT for Healthcare 有具名医院落地
        - 自建 AI 副驾驶的医疗系统和厂商
        - 透明引用、BAA、客户托管加密密钥、模板、API
        - 不掌握临床参考入口或独家医学内容
      - - Anthropic 内部自建
        - 潜在进入者 / 自建底座
        - 已发布席位和 API 定价；医疗产品支持 HIPAA
        - 自建工作流智能体的支付方、服务方、初创公司和企业
        - CMS / ICD-10 / NPI / PubMed 连接器和面向 FHIR 的工作流
        - 通用模型仍需证据锚定和治理，才能获得临床信任
    notes: 这些行保留了截至 2026-05-25 可从抓取公开来源观察到、最影响决策的直接同业、在位厂商、替代品和潜在进入者。 AI 原生和通用模型厂商的公开融资或定价细节，明显比在位企业套件丰富。
    enumerationScope:
      coverage: partial
      basis: >-
        Representative retention of the most relevant direct peers, incumbents, substitutes, and likely entrants visible
        in fetched 2025-2026 public sources; not an exhaustive list of every bedside reference or CDS product.
