      - number: '2.4'
        title: 增长驱动、采用约束与真正释放预算的条件
        blocks:
          - type: paragraph
            body: >-
              增长逻辑很直接。医生使用 AI 已经从好奇跨过门槛，变成常规职业行为：超过 80% 的受访医生如今在专业场景使用 AI，平均使用场景升至 2.3，39% 已经用 AI
              总结医学研究和照护标准。这些统计很关键，因为它们直接重叠了诊疗现场医疗 AI 要完成的任务。与此同时，临床医生仍有真实工作流痛点。PCP 在带薪休假日的中位数 39% 时间会使用 EHR，并把约 39.5% 的
              PTO EHR 时间花在收件箱任务上；另有文献显示，临床问题高频出现，时间是这些问题未解决的最大原因，超过一半的诊疗现场问题可能从未被追问。因此，能减少检索时间、综合证据，并降低文档或收件箱负担的诊疗现场
              CDS，有可信需求驱动。


              约束端同样重要。警报疲劳仍可量化：近期警报暴露最高的医生，对新的 CDS 警报反应概率低得多，这提醒我们，更具侵入性的自动化并不天然更有价值。同一份 AMA
              调查既显示强采用，也说明企业预算所有者为什么犹豫：88% 担心技能流失，86% 认为隐私保护至关重要，88% 希望有扎实的安全性和有效性验证，而清晰责任框架在会提升信任的监管行动中排位最高。HIMSS
              也呼应这些担忧，明确要求 ROI、可追溯性、持续监控和重新验证。既有厂商也没有停下：UpToDate 和 DynaMed 已经占据受信任的证据工作流，EBSCO 的 Dyna AI Mode 显示既有厂商可以把
              AI 叠加到既有参考内容业务之上。净结果是，市场需求真实存在，但转化取决于有证据支撑的信任，而不是新奇感。OpenEvidence 受益于临床医生使用 AI
              的强劲长期顺风，但规模化预算释放只会发生在产品证明透明来源、工作流集成，以及相对根深蒂固替代品可量化降低认知负荷或提高决策质量之后。
