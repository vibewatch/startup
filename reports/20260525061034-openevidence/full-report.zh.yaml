              即使按 2025-2026 年 AI 公司的标准看，OpenEvidence 的融资曲线也异常陡峭。公司在 2025 年 2 月完成 Sequoia 领投、估值 $1 billion 的 Series A，7
              月升至 $3.5 billion 的 Series B，10 月完成估值 $6 billion 的 Series C，2026 年 1 月又完成估值 $12 billion 的 Series
              D。每一轮都增加了一层赞助方质量：Sequoia 锚定机构入场，GV 和 Kleiner Perkins 共同领投 Series B，Thrive 与 DST 领投 Series D。公司披露称过去十二个月融资约
              $700 million，而 CNBC 2026 年 5 月的 Disruptor 画像列出累计融资 $795.4 million。这些数字未必矛盾，但公开材料也尚未把它们对齐。明确的是，OpenEvidence
              现在的股权结构叙事建立在顶级风投、来自 Mayo Clinic 的战略医疗信号，以及反复跟投之上，说明投资人把采用数据看得异常可信。
