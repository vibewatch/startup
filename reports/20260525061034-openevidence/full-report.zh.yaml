  - id: TP004
    title: 护城河耐久度 / 竞争风险清单
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 重要性
      - 缓释措施 / 尽调问题
    rows:
      - - 授权期刊和指南访问
        - 内容所有方也向既有厂商或工作流平台授权类似访问
        - 高
        - 内容访问具备独家性或深度异乎寻常时，OpenEvidence 差异化最强
        - 核验续约条款、独家边界和出版方集中度
      - - 临床医生采用和习惯养成
        - Doximity 内免费捆绑包或嵌入 EHR 的既有厂商先抢走工作流
        - 高
        - 如果临床医生在既有工具里拿到“够用”的答案，流量可能转移
        - 衡量 Doximity/UpToDate AI 上线后保留下来的日活使用
      - - 引用背书的信任定位
        - 所有厂商的 LLM 幻觉仍需要核验
        - 高
        - 临床场景里的信任很脆弱，并直接关联医疗法律可辩护性
        - 跟踪错误率、来源覆盖和机构级治理结果
      - - 免费产品分发
        - 如果使用量转移或广告需求走弱，广告支持模式的经济性可能弱于企业捆绑
        - 中
        - 低价有助采用，但本身不能形成锁定
        - 厘清广告集中度、变现深度和企业追加销售路径
      - - 独立入口体验
        - 医院可以基于 OpenAI 或 Anthropic 自建内部 AI 助手
        - 高
        - 通用模型入局者降低自建成本、缩短上市时间
        - 在并排工作流中测试专有内容和答案质量是否仍显著更好
      - - 药物查询广度
        - Micromedex 和 Epocrates 在用药安全和处方集工作流里仍有粘性
        - 中
        - 通用医学搜索产品未必拿得下药房专项任务
        - 评估 OpenEvidence 能否替代药物密集型工具，还是只能补充
      - - 既有厂商采购惯性
        - UpToDate、DynaMedex 和 ClinicalKey 已在企业合同和 EHR 日常流程里
        - 高
        - 机构切换比消费者 AI 试用慢
        - 量化医院内替代性中标与辅助性使用的比例
      - - 监管可解释性匹配
        - AI 行为不透明或理由披露薄弱，可能把买家推向更可审查的工具
        - 中
        - FDA 指引强调临床医生可审查性和判断保留
        - 审计引用质量、理由质量，以及日志 / 溯源深度
