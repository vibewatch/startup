      - number: '8.3'
        title: 乐观、基准与悲观框架
        blocks:
          - type: paragraph
            body: >-
              乐观情景不难想象；只是要求很高。OpenEvidence 似乎已经拥有异常强的医生触达、不同寻常的出版商合作，以及仍愿意为医疗 AI 类别 领导者付费的融资市场。如果采用率保持在美国医生 40%
              以上、收入再大致翻倍，并且公司在广告之上叠加耐久的企业或工作流变现， 当前 $12 billion 估值可能被证明站得住。基准情景没那么慷慨。在基准情景下，OpenEvidence
              仍重要且快速增长，但变现比使用更快 正常化，公开市场式倍数更重要，投资者也会等经审计质量出现后才为进一步上调买单。悲观情景围绕一个简单错配：广告支持的临床搜索 可以是有价值的产品，但未必值 80x
              收入倍数。竞争压力、广告主犹豫，或监管对智能体医疗辅助采取更严格解读，不会抹掉产品， 却可能大幅压缩估值。因此，投资逻辑与反向逻辑必须按价格敏感来框定，而不只是按公司质量敏感来框定。
