  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 工具
      - 公开套餐
      - 公开定价信号
      - 信任 / 控制信号
      - 含义
    rows:
      - - OpenEvidence
        - 免费临床医生产品
        - 医生免费；广告支持
        - 符合 HIPAA 和 SOC 2 Type II
        - 临床医生采用快，但显性的付费席位切换成本较弱
      - - Doximity Ask
        - 已验证临床医生免费层 + 企业询价
        - 已验证的美国临床医生免费；企业需联系销售
        - 符合 HIPAA；用户可包含 PHI
        - 激进免费捆绑可能压低独立付费工具
      - - Pathway（并入前）
        - 收购前的高级版应用
        - 并入 Doximity Ask 前，高级版每年 $300
        - 主打循证临床参考
        - 说明参考功能可以从付费应用迁入免费捆绑包
      - - UpToDate
        - 个人、团体和企业订阅
        - 年付、30/90 天循环订阅和团体选项；商店定价因国家而异
        - 专家精选内容和企业治理
        - 套餐结构清晰，但多数企业经济条款仍靠谈判
      - - DynaMedex
        - 机构 / 企业套件
        - 抓取页面未列自助标价
        - Best in KLAS 认可，并整合疾病 + 药物证据
        - 主要靠采购渠道和可信度竞争，而不是公开价格透明度
      - - Epocrates+
        - 月付或年付自助订阅
        - 每月 $24.99 或每年 $179.99；医学生免费
        - 知名药物参考和指南工作流
        - 轻量查询任务里最便宜的自助替代品
      - - Micromedex
        - 企业 / 机构部署
        - 抓取页面未列自助标价
        - 药价、毒理学、处方集和计算器深度
        - 价格不透明，但在药房和安全工作流里粘性仍高
      - - ClinicalKey AI
        - 企业级证据套件
        - 抓取页面未列自助标价
        - 基于可信 Elsevier 内容的负责任 AI，并接入 EHR
        - AI 作为更大内容合同里的升级项出售
      - - OpenAI
        - API + 医疗企业工作区
        - GPT-5.5 每 1M tokens 输入 $5 / 输出 $30；网页搜索每 1K 次调用 $10
        - BAA、客户托管加密密钥、不用客户内容训练
        - 让医院和供应商看清内部自建经济账
      - - Anthropic
        - 消费者席位、Team/Enterprise 和 API
        - Team 每席每月 $20-$25；Opus 4.7 API $5 / $25 MTok
        - 提供 HIPAA 就绪产品；具备企业控制
        - 自助试用和企业扩张路径并行
    notes: 这些定价行把标价、打包方式和明确的询价制信号放在一起，因为多数既有 CDS 厂商不会在抓取到的公开产品页面披露企业合同经济条款。
