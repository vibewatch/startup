        - 这是 OpenEvidence 实际切入的市场
      - - 嵌入式工作流 CDS
        - 集成进 EHR 的提醒、医嘱指导和嵌在临床工作流中的决策支持模块
        - 不归因于决策支持的独立 EHR 平台支出
        - 医疗系统或医疗集团
        - 企业扩张中，工作流适配比新奇感更重要
      - - 现状替代品
        - UpToDate、DynaMed、Epocrates、AMBOSS、PubMed / 免费网页搜索、同事会诊
        - 无——这些替代品定义了要替换的既有行为
        - 个人临床医生、图书馆、GME 或医疗系统
        - OpenEvidence 首先要抢的是既有问答习惯，而不是空白市场
      - - 排除 — 类器械或患者端 AI
        - 除非明确作为临床医生 CDS 销售，否则不计入
        - 面向患者的症状工具、仍按器械监管的影像或信号分析软件功能、护理者工具
        - 消费者、器械预算，或受监管器械买方
        - 这些类别会把泛医疗 AI 的 TAM 撑大，但采购路径不是一回事
      - - 相邻 — 文档与编码自动化
        - 只计入同时提供临床医生证据或治疗支持的部分
        - 环境式病历记录、编码优化、不含诊疗现场知识检索的收入周期 AI
        - 运营、收入周期或行政预算
        - 有参考价值的相邻赛道，但不是测算 OpenEvidence 核心市场最干净的基准
    notes: 边界逻辑先按 AHRQ 和 FDA 定义划线，再叠加临床医生调研文献中观察到的替代行为，以及在位厂商的产品定位。 纳入和排除的行是类别判断，不是经审计的会计科目。
