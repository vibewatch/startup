      - number: '8.5'
        title: 展品
        blocks:
          - type: callout
            title: 医生分发真实存在，而且异常难以否认
            body: >-
              OpenEvidence 可能已经获得真实产品拉力，而不只是投资者热情。公开来源一致指向广泛医生触达、高咨询量，以及竞争对手无法一夜复制的
              内容生态。正是这种分发质量，让公司值得认真关注，尽管当前价格很难用公开基本面辩护。
            calloutType: strength
            claimRefs:
              - CV009
              - CV010
              - CV013
              - CV037
          - type: callout
            title: 广告模型是优质公司与估值过高公司之间的门槛风险
            body: 免费、广告支持的医生产品可以快速扩张，但公开证据仍未显示广告主集中度、续约质量，或企业收入到底有多少。这种不透明很重要，因为当前 估值假设了公开证据尚未充分证明的变现质量。
            calloutType: risk
            claimRefs:
              - CV008
              - CV014
              - CV017
              - CV038
              - CV043
          - type: callout
            title: 监管今天不是主问题，但明天可能变成主问题
            body: 当前 FDA 指南为透明的临床医生支持工具留出空间，但 OpenEvidence 正明确投入更具智能体色彩的医疗智能。如果产品从可解释支持滑向 处方式决策，治理和合规成本可能比估值乐观派当前假设更快上升。
            calloutType: risk
            claimRefs:
              - CV034
