    rows:
      - - FDA / CDS 分类漂移
        - FDA 2026 年指南要求临床医生能够独立审查依据，且不能主要依赖软件，才保留非器械状态；OpenEvidence 则在继续深入床旁使用和 PHI 处理工作流。
        - 中
        - 严重
        - 条款把责任推回给临床医生；引用和仅限 HCP 的门槛维持辅助定位。
        - 高——未来产品 UX 或医院工作流可能缩短「辅助」和「决定性」之间的实际距离。
        - 医院合同、UI 或营销开始把输出视为主要诊断建议。
        - 要求正式 FDA 分类备忘录、产品风险评估和任何医院委员会审查。
      - - 医疗事故 / 专业责任风险敞口
        - OpenEvidence 已进入高风险临床问题；行业证据显示，幻觉叠加过度依赖会改变诊疗决策。
        - 高
        - 严重
        - 合同约定临床医生负责、提供来源引用，并设定内部审查预期。
        - 高——如果临床医生或实习人员过度信任输出，合同免责声明消不掉下游损害。
        - 公开报道的患者安全事件，或与 OpenEvidence 指导诊疗相关的保险 / 法律索赔。
        - 要求不良事件日志、赔偿条款和医院事件审查流程。
      - - HIPAA / OCR 隐私与广告技术风险敞口
        - 产品现在支持 PHI 工作流，但隐私模型仍包含定向广告、赞助项目和受众扩展机制；HHS 表示，PHI 营销披露需要授权和 BAAs。
        - 中高
        - 高
        - BAAs、HIPAA 合规姿态、SOC 2 Type II、加密和合同限制。
        - 高——配置错误，或 PHI、职业身份和广告测量之间边界模糊，都会代价高昂。
        - 任何 OCR 调查、泄露通知，或医院禁止涉及 PHI 的广告邻近工作流。
        - 审查 BAAs、追踪器清单、广告技术架构，以及按工作流划分的权限。
      - - 国际 / EU AI Act 约束
        - 条款把本地法律合规责任放在用户身上；Open Pharma 报道称，OpenEvidence 已因 AI Act 不确定性撤出 EU/UK 访问。
        - 高
        - 高
        - 等法律立场更清晰后再启动；先把产品聚焦美国临床医生。
        - 中高——合规策略、本地化和数据治理姿态成熟前，地域 TAM 受限。
        - 到 2027 年仍没有可信的 EU/UK 重返计划，或合规解释变得明显更严苛。
        - 要求司法辖区地图、外部律师备忘录和重返时间表。
      - - 商业秘密 / 提示词窃取诉讼分心
        - OpenEvidence 已在就冒充、提示词窃取和抓取起诉直接竞争对手。
        - 中
        - 中高
        - 寻求禁令救济、收紧身份控制，并监测滥用模式。
        - 中——即便诉讼有依据，也会消耗管理层注意力，并强化敌意竞争环境。
        - 证据开示暴露身份控制薄弱、大规模抓取，或削弱可信度的反诉。
        - 要求诉讼预算、滥用遥测，以及投诉后完成的安全变更。
    notes: 各行按 2026-05-25 的残余风险敞口排序；覆盖范围限于公开的公司特定争议，以及直接适用的美国 / EU 监管风险。
    enumerationScope:
