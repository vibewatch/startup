      - number: '5.4'
        title: 隐私、访问控制与公开信任姿态
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence 最清晰的公开信任承诺围绕 HIPAA 处理、临床医生准入和用户可控分享。公司在 2025 年 4 月宣布完全符合 HIPAA，并称输入 PHI
              的受规实体会在业务伙伴协议下操作。公司还表示，对话默认私密，Share 按钮让用户控制对话访问权限。访问侧，Google Play
              页面称产品仅面向医疗专业人士开放，使用前需要用户验证。这些控制很重要，因为产品正从通用文献搜索走向感知患者上下文和文档相邻工作流，PHI、沟通渠道和运营草稿输出都会进入范围。能见度较低的是企业买方通常会要求的更深技术信任栈：公开可用性承诺、延迟目标、状态历史、第三方安全架构细节，或当患者上下文和工作流自动化叠加之后，对引用忠实度的外部审计证据。因此，公开姿态在政策控制和来源锚定上较强，在可独立审计的运营透明度上较弱。
