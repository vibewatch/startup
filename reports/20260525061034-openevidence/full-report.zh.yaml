      - number: '1.2'
        title: 创始人、领导层与治理透明度
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence 明显由创始人驱动。Daniel Nadler 仍是公司的公众面孔，并反复以创始人兼 CEO 身份出现；Zachary Ziegler 则是最常与平台 AI
              研究背景绑定的联合创始人。Nadler 此前创办 Kensho，在 OpenEvidence 出现之前就已获得投资人和企业买方的信任；S&P Global 于 2018 年收购 Kensho，也把他确立为有大型
              AI
              退出经历的连续创业者。相比技术或商业动能，当前公开记录对正式治理的披露薄得多。官网突出展示了一个异常广泛的医学顾问网络，覆盖美国主要医疗体系和学术中心，这强化了临床可信度；但留存材料没有披露董事会构成、投资人观察员权利或控制架构。这种不对称带来真实尽调风险：顾问深度能帮助验证产品方向，但
              Nadler 的关键人依赖看起来仍高，因为融资、媒体叙事和平台定位都由他同时锚定。
