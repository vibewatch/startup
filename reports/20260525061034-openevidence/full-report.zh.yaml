      - 扩张驱动因素
      - 集中度 / 持久性风险
      - 影响
      - 尽调路径
    rows:
      - - 靠免费自助访问拿下单个医生
        - 高使用量未必能转成可持续付费
        - 在采购前先做出快速分发和使用深度
        - 要求提供高强度临床医生使用转化为企业交易或赞助支出的证据
      - - 借临床医生牵引向医疗系统增购
        - 公开企业客户名单仍小，经济性不透明
        - 若属实，可显著抬高 ARPU 和切换成本
        - 要求按医疗系统提供销售管线、席位数和已签企业收入
      - - 从医生扩到护士、药师和治疗师
        - 角色扩张可能加深工作流依赖，但会让采用率分母更复杂
        - 扩大用户基础，也更容易证明企业预算合理
        - 要求按角色和工作流拆分活跃用户构成
      - - 借 ACOG、Wiley、NEJM、JAMA、NCCN 和 Cochrane 加深专科效用
        - 合作伙伴标识可能被误读为付费客户验证
        - 提升信任和专科覆盖，支撑更多工作流
        - 尽调中把合作伙伴经济性与客户经济性拆开
      - - 广告支持模式为免费访问买单
        - 头部赞助商集中度和重复投放留存未披露
        - 可能利润很高，但广告主依赖会带来波动
        - 要求按垂直领域提供前 10 大广告主占比、续投曲线和 CPM 趋势
      - - 自下而上采用绕开采购周期
        - 绕开采购也等于绕开早期合同锁定
        - 解释采用速度和影子使用
        - 要求提供临床医生队列留存，以及合同落地后的企业续约
