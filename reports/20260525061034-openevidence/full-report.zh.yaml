      - number: '4.2'
        title: 公开牵引力与 GTM 质量
        blocks:
          - type: paragraph
            body: >-
              公开牵引力足以支撑真实收入基础，但仍高度依赖公司口径指标。BusinessWire、CNBC、Fierce 以及 2025 年 7 月相关融资报道都描述了非常快的临床医生采用：超过 40%
              的美国医生每天使用产品，超过 10,000 家医院和医疗中心被产品触达，到 2025 年 12 月月咨询量约 18 million 次，2025 年中更早运行量为每月 8.5 million 次咨询，且每月新增
              65,000 名已验证临床医生。Sacra 认为免费访问帮助 OpenEvidence 绕过了通常拖慢医院软件的约 18 个月采购周期。这个 GTM
              优势可信：公司可以自下而上获取临床医生，证明工作流习惯，然后再销售治理和集成。问题在于，公开销售效率数学并不完整。没有披露
              CAC，没有披露企业成交率，没有公开的医疗体系合同席位数，也没有经审计的从咨询量到广告库存或企业 ARR
              的转化。因此，如果医院和生命科学合同放量，收入质量会改善；但今天的公开证据仍指向一个牵引力亮眼、变现结构却不透明的业务。
