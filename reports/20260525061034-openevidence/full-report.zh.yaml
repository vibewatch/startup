      - number: '5.2'
        title: 证据引擎、内容依赖与验证模型
        blocks:
          - type: paragraph
            body: >-
              公开材料把 OpenEvidence 描述得不像通用模型公司，更像围绕授权医学内容和临床医生验证搭建的证据交付层。官网和合作公告显示，语料库持续扩张：1990 年以来的 NEJM Group
              内容和多媒体，JAMA 及其专科期刊全文和多媒体，NCCN 肿瘤指南加 JNCCN 内容，以及 Wiley 更广的组合，包括 Cochrane 系统综述、Cochrane Clinical Answers
              和数百种期刊与图书。Wiley 自己的公告把运营原则说得异常明确：“好料进，好料出”；专门模型在经同行评审文献上训练，而不是开放互联网，每个答案都基于医生可下钻和验证的来源。这就是 OpenEvidence
              愿意公开披露的核心产品架构：临床医生提出问题，中间是授权证据语料库加模型综合，输出带引用答案。同样的验证模型也出现在 Voice Mode 中，语音答案旁边保留书面转录和参考文献；NCCN
              合作也强调来源文档和回链到底层指南材料。
