      - number: '2.2'
        title: TAM、SAM 和 SOM——自上而下估计矛盾，自下而上只给出下限
        blocks:
          - type: paragraph
            body: >-
              公开自上而下估计分歧足够大，TAM 必须呈现为区间，而不是单一口号。Business Research Company 把 2026 年全球临床决策支持系统市场定在 $3.96 billion，而 Fortune
              Business Insights 给出 2026 年 $4.45 billion。这两个数字方向相近，但仍相差约 $0.49
              billion；相对这个规模的市场，差异很大，也反映了纳入口径、供应商集合和地理假设不同。Grand View Research 对更窄的 CDSS 中人工智能细分市场给出的 2026 年估计只有 $1.5
              billion；这与更广义 CDSS 总量并不冲突，更像是证据：诊疗现场医疗 AI 是嵌在更大证据与警报生态中的子集。Research and Markets 通过把 CDSS
              按组件、模型、交付模式、应用和终端用户细分至 2035 年，也在结构上强化了同一点，而不是把它当作单一整体 SKU。


              对 OpenEvidence 来说，更有决策价值的测算视角是自下而上、以美国为中心。BLS 报告 2024 年约有 839,000 名医生、162,700 名医师助理和 320,400 名执业护士，也就是约
              1.322 million 个经常作出诊断或治疗决策的高级临床医生席位。套用 Epocrates（每年 $179.99）和 AMBOSS（每年 $259）公开自助价格，美国高级临床医生循证支出代理区间约为每年
              $238 million 至 $342 million。如果初始商业切口只看医生，同一方法给出医生优先子市场下限约 $151 million 至 $217 million。这是保守的 SOM
              代理，而不是总市场天花板：企业打包、治理工作、实施服务和报价制合同都可以放大实际 ACV，但公开来源不支持更干净的机构价格基准。最终得到的是本章特定的 TAM/SAM/SOM 栈：全球 CDSS 是外层
              TAM，美国高级临床医生诊疗现场席位市场是证据最充分的 SAM，医生优先部署是最清晰的初始 SOM。
