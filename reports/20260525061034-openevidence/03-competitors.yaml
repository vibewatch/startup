schemaVersion: "report-v2"
artifact: competitors
slug: openevidence
runDate: "2026-05-25"
company:
  name: OpenEvidence
chapter:
  number: 3
  title: Competitors
  summary: "OpenEvidence competes in a three-layer market: free AI clinical copilots with physician distribution (Doximity Ask plus absorbed Pathway), incumbent curated references adding GenAI (UpToDate Expert AI, DynaMedex, ClinicalKey AI, Micromedex, Epocrates), and general-model entrants that let hospitals build internal copilots (OpenAI, Anthropic). OpenEvidence's strongest edge is licensed medical content plus clinician adoption, but the chapter evidence also shows real commoditization pressure from free bundling, incumbent enterprise lock-in, and general models that now market HIPAA-ready, citation-backed healthcare workflows."

sections:
  - id: landscape-and-direct-peers
    title: "Landscape and direct peers"
    body: |
      OpenEvidence is not competing against a single comparable product. The closest direct overlap is with AI-native clinical reference tools that promise fast answers at the bedside, but the category quickly widens into adjacent physician workflow bundles and incumbent evidence products that are now grafting generative AI onto curated content. OpenEvidence itself frames the product around citation-linked answers from licensed journals and guidelines, while Doximity markets a free Ask product that now absorbs Pathway's reference corpus into a broader physician workflow suite. Glass Health is also a direct peer, though its public surface positions it more lightly around ambient scribing plus clinical decision support than around a broad hospital platform.

      The direct-peer evidence matters because price and distribution are already diverging. OpenEvidence remains free to clinicians and ad-supported, and Pathway's formerly paid premium tier was folded into Doximity Ask after Doximity acquired the company for $63 million. That combination turns a once-separate paid clinical reference product into a free feature inside a network that Doximity says reaches more than 80% to 85% of U.S. physicians. For OpenEvidence, that means the near-term fight is less about proving that clinicians want AI search and more about whether a standalone destination can hold attention once larger workflow platforms decide to bundle similar reference capabilities at zero marginal price.  
    claimRefs: [CP001, CP002, CP003, CP005, CP008, CP009, CP010, CP011, CP012, CP013, CP014, CP015, CP036, CP037, CP043]
    tableRefs: [TP001]
    figureRefs: [FP001]

  - id: incumbent-evidence-tools
    title: "Incumbent evidence tools and status-quo substitutes"
    body: |
      The status quo substitute for many clinicians is still a stack of curated references rather than a single AI answer engine. Wolters Kluwer's UpToDate markets individual, group, and enterprise suites trusted by more than 3 million health professionals, and its Expert AI launch explicitly wraps generative AI around expert-authored, peer-reviewed UpToDate content with transparent source and rationale links. DynaMedex similarly combines DynaMed disease evidence with Micromedex drug evidence and has leaned on KLAS recognition plus expansion of Dyna AI into medication dosing and safety. Elsevier's ClinicalKey AI, Micromedex, and Epocrates each cover adjacent slices of the same job-to-be-done: quick evidence retrieval, drug safety, guideline lookup, and workflow-safe reference access.

      This matters because switching costs in institutional medicine are not just about answer quality. Incumbents already sit inside EHR links, CME routines, formulary workflows, procurement budgets, and hospital library contracts. They also defend narrower but sticky use cases. Micromedex's drug interactions, toxicology, and RED BOOK pricing data are specialized enough that a general AI copilot does not automatically displace them. Epocrates is cheaper and lighter-weight, making it a practical substitute for drug and guideline lookup even if it is not a full encyclopedic evidence tool. OpenEvidence therefore competes not only with "better search" but with established clinical habits that mix trusted references, operational drug databases, and local policies. 
    claimRefs: [CP016, CP017, CP018, CP019, CP020, CP021, CP022, CP023, CP024, CP025, CP026, CP038, CP040, CP044, CP045]
    tableRefs: [TP002, TP003]
    figureRefs: [FP002]

  - id: adjacent-ai-and-internal-build
    title: "Adjacent AI entrants and internal-build substitutes"
    body: |
      OpenAI and Anthropic are not curated medical references in the legacy sense, but they are credible competitive entrants because they now sell healthcare-specific packaging around general models. OpenAI for Healthcare emphasizes transparent citations to peer-reviewed studies, clinical guidelines, and public-health sources, plus enterprise controls such as BAAs, audit logs, customer-managed encryption keys, and explicit no-training treatment for customer content. Anthropic's healthcare offering is similarly pitched as HIPAA-ready and increasingly workflow-native: CMS coverage connectors, ICD-10 and NPI lookup, PubMed access, FHIR development help, prior authorization skills, and claims-appeal support. Both vendors also publish self-serve pricing rather than forcing every buyer through opaque enterprise procurement.

      That combination lowers the barrier for internal build. A health system that already has IT staff, governance, and local policy content can increasingly assemble its own clinician copilot on top of a foundation model rather than adopt a standalone reference destination. The tradeoff is trust and specificity. General models can move faster on connectors, automation, and administrative workflows, but they still need grounding, oversight, and institutional guardrails to be clinically acceptable. For OpenEvidence, the threat is not that OpenAI or Anthropic become the best disease encyclopedia; it is that they make it cheap and administratively convenient for hospitals or workflow vendors to recreate enough of the same bedside-search job inside larger systems. 
    claimRefs: [CP027, CP028, CP029, CP030, CP031, CP032, CP034, CP035, CP041, CP042, CP046]

  - id: switching-costs-and-moat-durability
    title: "Switching costs, moat durability, and adverse evidence"
    body: |
      The evidence supports a nuanced moat view. OpenEvidence has a real trust edge from official content partnerships, clinician-focused positioning, and published HIPAA/SOC 2 controls. That matters because FDA guidance for non-device clinical decision support still centers on clinician reviewability: recommendations must support, not replace, judgment, and users must be able to independently review the basis for the answer. OpenEvidence's citation-heavy design is directionally aligned with that requirement, and UpToDate Expert AI makes the same point by exposing assumptions and source rationale. In other words, provenance is a competitive requirement, not just a product feature.

      But the adverse evidence is equally clear. Doximity Ask's own FAQ says outputs may include inaccuracies and should always be verified, while academic literature still frames hallucination as a live patient-safety issue even in retrieval-augmented systems. MDPI's on-premises RAG study shows mitigation is possible but still requires provenance tagging, audit trails, and verification layers. That makes commoditization risk highest where the workflow can tolerate "good enough" grounded answers and where a larger platform can subsidize distribution. OpenEvidence's moat looks most durable in licensed content access and clinician mindshare, but least durable in generic Q&A mechanics, because Doximity can bundle, incumbents can extend existing contracts, and general-model vendors can keep pushing the build-versus-buy frontier toward hospitals and other workflow owners. 
    claimRefs: [CP004, CP018, CP027, CP030, CP033, CP034, CP035, CP036, CP037, CP038, CP039, CP040, CP041, CP042, CP043, CP044, CP046]
    tableRefs: [TP004]
    figureRefs: [FP003]

