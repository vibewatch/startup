callouts:
  - calloutType: strength
    title: "OpenEvidence's trust edge is real, but it is built on content access more than price lock-in"
    body: "OpenEvidence's most defensible advantages in the fetched evidence are official medical-content partnerships, citation-linked answers, clinician adoption, and explicit HIPAA / SOC 2 controls. Those attributes matter because FDA-style reviewability and clinician trust still constrain AI adoption in medicine. The weaker part of the moat is packaging: OpenEvidence is free and ad-supported, so retention has to come from product habit and trust rather than multi-year contract lock-in."
    claimRefs: [CP001, CP002, CP003, CP004, CP033, CP036]

  - calloutType: risk
    title: "Free bundling and internal build are the clearest commoditization paths"
    body: "The strongest adverse evidence is that Pathway moved from a $300-per-year standalone premium app into free Doximity Ask, while OpenAI and Anthropic now publish healthcare-ready controls and clear pricing that make internal build more plausible. At the same time, Doximity Ask's own FAQ and academic literature still warn that clinical AI outputs require verification. That combination pressures pricing without eliminating quality and liability risk, which is a difficult setup for a standalone reference destination."
    claimRefs: [CP014, CP028, CP030, CP032, CP034, CP035, CP041, CP042, CP043]

