  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: switching-costs
      missingEvidence: "Cohort-level retention, session frequency, and hospital replacement-versus-adjunct data for OpenEvidence versus UpToDate, Doximity Ask, and incumbent references."
      whyItMatters: "The public evidence proves awareness and product availability, but not whether OpenEvidence is displacing incumbent reference spend or merely coexisting with it."
      diligencePath: "Request cohort retention curves, account-level expansion data, and side-by-side hospital usage logs showing primary versus secondary reference behavior."
      relatedQuestionRefs: [QP022, QP023]
    - type: missing-source
      severity: material
      topic: enterprise-pricing
      missingEvidence: "Actual enterprise contract ranges for UpToDate, DynaMedex, Micromedex, and ClinicalKey, including seat definitions, EHR integration fees, and renewal mechanics."
      whyItMatters: "Public list prices are transparent for self-serve AI and lighter tools, but enterprise pricing opacity makes it hard to underwrite margin headroom and displacement economics."
      diligencePath: "Collect customer contracts, procurement records, or verified buyer interviews for incumbent enterprise reference suites and compare them with OpenEvidence commercial terms."
      relatedQuestionRefs: [QP014, QP015]
      relatedTableRefs: [TP003]
    - type: enumeration-incomplete
      severity: minor
      topic: long-tail-competitors
      missingEvidence: "A fuller list of subscale clinical AI startups and hospital-built internal copilots not visible on the retained public source set."
      whyItMatters: "The chapter covers the most decision-relevant retained competitors, but long-tail entrants can still accelerate commoditization or create niche displacement."
      diligencePath: "Expand discovery into procurement forums, hospital AI committees, and specialty-specific clinician communities to capture smaller tools and internal deployments."
      relatedQuestionRefs: [QP001, QP018, QP024]
