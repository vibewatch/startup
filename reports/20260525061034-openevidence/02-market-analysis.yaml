  - - AI in CDSS (Grand View)
    - Global
    - $1.5B in 2026
    - 17.1% CAGR to 2033
    - Narrower AI-enabled CDSS subsegment
    - Medium
    - Not directly comparable to all-CDSS estimates
  - - Category breadth (Research and Markets)
    - Global
    - No single 2026 figure exposed in fetched page
    - Forecast tables run through 2035
    - Segmentation by component, model, delivery, application, and end user
    - Low
    - Source confirms breadth more than a headline number
  - - Bottom-up U.S. advanced-clinician SAM proxy
    - United States
    - $238M–$342M annually
    - Based on 1.322M physician+PA+NP seats
    - BLS seat counts x public annual self-serve prices ($179.99–$259)
