callouts:
- calloutType: insight
  title: The real market is narrower than generic healthcare-AI TAMs
  body: >-
    The strongest sizing takeaway is boundary discipline. Broad CDSS publisher estimates and narrow AI-CDSS estimates are both useful, but only after they are translated into clinician-facing point-of-care spend instead of generic health-tech hype.
  claimRefs:
  - CM003
  - CM010
  - CM011
  - CM012
  - CM022
  - CM023
- calloutType: risk
  title: Governance is the near-term bottleneck, not physician curiosity
  body: >-
    Physicians are already using AI. The gating issue for OpenEvidence is whether buyers trust the tool enough to fund and integrate it at scale under privacy, validation, liability, and ROI scrutiny.
  claimRefs:
  - CM027
  - CM028
  - CM029
  - CM030
  - CM035
  - CM036
  - CM037
- calloutType: assumption
  title: Public-price SAM and SOM are lower bounds
  body: >-
    The bottom-up dollar ranges use only public self-serve prices and published clinician seat counts. They intentionally understate total enterprise spend because implementation, support, and quote-based licensing remain opaque.
