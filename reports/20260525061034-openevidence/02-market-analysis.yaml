- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver or constraint
  - Direction
  - Evidence
  - Timing
  - Commercial implication
  - Diligence ask
  rows:
  - - Physician AI adoption has crossed 80%
    - Driver
    - AMA shows >80% professional use and 2.3 average use cases
    - Current
    - Market no longer needs basic awareness creation
    - Which clinician cohorts use OpenEvidence weekly vs experimentally?
  - - Research summarization is already a mainstream AI use case
    - Driver
    - 39% of physicians use AI for research and standards-of-care summaries
    - Current
    - Direct overlap with point-of-care evidence retrieval job-to-be-done
    - What percent of usage is bedside decision support vs asynchronous study?
  - - Burnout and EHR burden remain acute
    - Driver
    - 70% see burnout-automation opportunity; PTO EHR work persists
    - Current
    - Tools that save clicks and search time have a credible ROI narrative
    - Can OpenEvidence quantify time saved or avoided inbox/search burden?
  - - Governance, privacy, validation, and liability gates
    - Constraint
    - 86% privacy, 88% validation, liability frameworks top regulatory ask
    - Current
    - Enterprise buyers will block scaling without trust controls
    - What validation package, audit trail, and legal positioning does OpenEvidence provide?
  - - Alert fatigue and workflow overload
    - Constraint
    - High alert exposure sharply lowers response to new CDS alerts
    - Current
    - Intrusive UX can reduce adoption even if underlying intelligence improves
    - How does OpenEvidence avoid becoming another interruptive alert source?
  - - Incumbent installed base and AI extension
    - Constraint
    - UpToDate and DynaMed already own trusted workflows; Dyna AI Mode extends that base
    - Near term
    - New entrants must beat trust plus workflow, not just model capability
    - What switching trigger would justify replacing or adding to incumbents?
  notes: >-
    The table mixes demand-side drivers and gating constraints because the same workflow pressure that creates demand also raises procurement standards. Timing refers to when the factor affects adoption, not when the underlying source was published.
