  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: enterprise budget ownership split
    missingEvidence: A public benchmark showing how CMIO, CIO, library, GME, and service-line budgets split actual spend for point-of-care AI or reference tools.
    whyItMatters: Buyer/user segmentation is clear directionally, but budget authority affects sales cycle length and whom OpenEvidence must convince first.
    diligencePath: Collect public RFPs, academic medical-center subscription records, or customer interviews that identify formal budget owner and approval chain.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: material
    topic: enterprise pricing opacity
    missingEvidence: Institutional ACV, implementation fees, and renewal pricing for UpToDate-, DynaMed-, or OpenEvidence-like enterprise contracts.
    whyItMatters: Without enterprise pricing, the bottom-up SAM/SOM ranges are lower bounds rather than full provider-organization spend estimates.
    diligencePath: Request procurement documents, benchmark quotes, or customer references from public systems and teaching hospitals.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: OpenEvidence paid conversion
    missingEvidence: Publicly supportable paid-seat counts, contract values, or revenue conversion from OpenEvidence usage into enterprise budgets.
    whyItMatters: A physician-first SOM proxy is only a market opportunity estimate until actual conversion and monetization data are disclosed.
    diligencePath: Obtain management data, customer references, or procurement records showing seat counts, ACV, and renewal behavior.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: minor
    topic: top-down market taxonomy
    missingEvidence: A harmonized apples-to-apples 2026 definition that reconciles all-CDSS, AI-CDSS, and point-of-care reference-tool boundaries.
    whyItMatters: Publisher TAMs are useful but definition-sensitive, so investors could overstate market size if they collapse incompatible categories into one number.
    diligencePath: Normalize competitor sets and inclusion rules across analyst reports, then rebuild the category bottom-up from spend classes.
    relatedQuestionRefs:
    - QM005
    relatedTableRefs:
    - TM002
