- id: growth-drivers-and-constraints
  title: Growth Drivers, Adoption Constraints, and What Will Actually Unlock Budget
  body: >-
    The growth case is straightforward. Physician AI usage has already crossed the threshold from curiosity to routine professional behavior: more than 80% of surveyed physicians now use AI professionally, average use cases have risen to 2.3, and 39% already use AI to summarize medical research and standards of care. Those statistics matter because they directly overlap with the job-to-be-done of point-of-care medical AI. At the same time, clinicians still face real workflow pain. PCPs used the EHR on a median 39% of paid-time-off days and spent roughly 39.5% of PTO EHR time on inbox tasks; separate literature shows clinical questions arise frequently, time is the biggest reason they are left unresolved, and more than half of point-of-care questions may never be pursued. Point-of-care CDS that reduces retrieval time, synthesizes evidence, and lowers documentation or inbox burden therefore has a credible demand driver behind it.


    The constraint side is just as important. Alert fatigue remains measurable: physicians with the highest recent alert exposure were far less likely to respond to a new CDS alert, a reminder that more intrusive automation is not automatically more valuable. The same AMA survey that shows strong adoption also shows why enterprise budget owners hesitate: 88% worry about skill loss, 86% cite privacy protections as critical, 88% want robust safety and efficacy validation, and clear liability frameworks rank highest among regulatory actions that would increase trust. HIMSS echoes those concerns with explicit demands for ROI, traceability, continuous monitoring, and revalidation. Incumbents are not standing still either: UpToDate and DynaMed already own trusted evidence workflows, and EBSCO’s Dyna AI Mode shows incumbents can layer AI onto established reference franchises. The net result is a market whose demand is real but whose conversion depends on evidence-backed trust, not novelty. OpenEvidence
    benefits from a strong secular tailwind toward clinician AI use, but scaled budget release will come only if the product demonstrates transparent sourcing, workflow integration, and measurable cognitive-load or decision-quality benefits versus entrenched substitutes.
