- id: people-monetization-and-geography
  title: People, Monetization, and Geographic Expansion Risk
  body: 'Execution risk sits on three linked dependencies: Daniel Nadler, ad-funded monetization, and U.S.-centric access. Nadler is clearly more than a normal founder-CEO; fundraising, moat articulation, and strategic positioning all flow through him, while public coverage continues to frame OpenEvidence around his prior Kensho track record and his thesis that physician adoption creates a unique data moat. That is an asset today and a key-person risk if leadership continuity breaks. Financially, the model is promising but fragile. CNBC says OpenEvidence surpassed $100 million in annualized revenue and intentionally uses in-app video advertising to accelerate adoption, while STAT notes the company is now being forced to prove that the same ad model can coexist with formal hospital relationships. Open Pharma and Krafty Librarian push the hardest version of the concern: if sponsor-funded research visibility, specialty-targeted ads, or opaque source coverage begin to look like bias rather than
    free access, health systems may demand an ad-free tier faster than revenue mix can diversify. Geography compounds the issue. Terms place compliance burdens on users outside the U.S., and Open Pharma reports that OpenEvidence withdrew EU and UK access in April 2026 because of AI Act uncertainty. That makes international expansion a real constraint, not just a theoretical future hurdle.'
