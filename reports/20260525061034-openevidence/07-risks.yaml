company:
  name: OpenEvidence
chapter:
  number: 7
  title: Risks
  summary: OpenEvidence’s risk profile is materially higher than its growth narrative suggests because the company is simultaneously pushing deeper into high-stakes clinical workflow, relying on sponsor-funded monetization, and depending on licensed content to preserve its quality moat. The highest-residual-exposure items are FDA/CDS classification drift, malpractice-liability from hallucination or over-reliance, HIPAA/privacy mistakes around PHI plus ad-tech, advertiser-conflict and monetization fragility, content-license dependence, founder/key-person concentration, general-model competition, and constrained international expansion under the EU AI Act. Public mitigations are real—citations, BAAs, HIPAA/SOC2 posture, premium content licensing, and strong clinician adoption—but they do not yet close the evidence, governance, or revenue-quality gaps that matter most for institutional underwriting.
sections:
- id: regulatory-product-liability-and-privacy
  title: Regulatory, Product-Liability, and Privacy Exposure
  body: 'OpenEvidence’s top-ranked risk is not that FDA currently regulates it as a device, but that the product roadmap keeps it close to the boundary of non-device clinical decision support. FDA’s January 2026 guidance preserves the exclusion only if a healthcare professional can independently review the basis for the recommendation and is not meant to rely primarily on it. OpenEvidence’s terms help on that front: they repeatedly push responsibility back to clinicians, disclaim diagnostic use, and frame the software as informational support. That is a real mitigation, not boilerplate. But the company simultaneously markets high-stakes point-of-care use, now supports PHI uploads, and discloses workflows such as recorded Visits. If future UX, hospital deployment, or agentic features reduce a physician’s practical ability to inspect the basis of an answer, hospital risk committees and regulators could revisit the classification question quickly. Liability runs parallel to classification.
    Even if FDA never treats OpenEvidence as a device, clinicians, hospitals, and the vendor remain exposed if hallucinated or incomplete outputs influence care. Privacy and HIPAA risk are similarly material because OpenEvidence monetizes tailored content and advertising using professional-identity data while HHS OCR makes clear that PHI disclosures to tracking or marketing vendors need proper permission and BAAs. Public controls are improving, but residual exposure remains high as the product moves from literature search toward patient-context workflows.'
