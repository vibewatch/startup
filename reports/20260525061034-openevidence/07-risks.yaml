  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register completeness
    missingEvidence: Company-level confirmation of any private FDA, OCR, state AG, or insurer inquiries plus the current status of the separate Pathway dispute.
    whyItMatters: Public sources show enough smoke to rank legal and privacy exposure highly, but undisclosed inquiries could change severity in either direction.
    diligencePath: Request management legal memo, outside counsel summary, and board risk register covering FDA classification analysis, privacy inquiries, and active disputes.
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: real-world clinical outcomes
    missingEvidence: Independent post-deployment error rates, escalation rates, malpractice claims, and outcome studies for OpenEvidence in live care settings.
    whyItMatters: Benchmark claims and citation design are not enough to underwrite malpractice, hospital adoption, or long-term trust.
    diligencePath: Request de-identified QA dashboards, safety reviews, hospital pilot results, and any insurer or legal incident logs covering clinical use.
  - type: private-evidence-only
    severity: material
    topic: revenue-quality and advertiser concentration
    missingEvidence: Current split of revenue by advertising, enterprise, and life-sciences plus top-sponsor concentration and ad-free contract terms.
    whyItMatters: The central monetization risk is not absolute revenue scale but whether the model can convert clinician attention into durable, low-conflict revenue.
    diligencePath: Request 2025 audited revenue bridge, top-10 sponsor concentration, renewal rates, enterprise ACVs, and any ad-free hospital pricing schedule.
