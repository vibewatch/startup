- id: TR005
  title: Mitigation and Kill Criteria Table
  columns:
  - Risk
  - Monitorable Trigger
  - Threshold / Kill Event
  - Action Implication
  rows:
  - - FDA / CDS classification drift
    - Product roadmap, hospital contracts, and UI language
    - Evidence that hospitals or regulators treat OpenEvidence as a primary diagnostic or treatment engine rather than assistive CDS
    - Re-underwrite regulatory path, hospital rollout assumptions, and liability reserves immediately.
  - - Malpractice / hallucination event
    - Public incident reports, insurer disputes, legal complaints, or hospital safety memos
    - A credible patient-harm case linked to OpenEvidence output plus weak auditability of what happened
    - Move risk rating up one notch; require safety data and indemnity detail before further capital.
  - - HIPAA / privacy breach or OCR issue
    - Breach notices, OCR correspondence, or customer security suspensions
    - Any PHI-related breach or OCR inquiry tied to tracking, recordings, or workflow data
    - Treat as thesis impairment because trust is central to enterprise adoption.
  - - Advertiser-conflict / revenue fragility
    - Top-sponsor concentration, hospital ad-free demand, or slower enterprise mix shift
    - Revenue remains primarily ad-driven through 2027 with visible hospital resistance to sponsor adjacency
    - Lower quality-of-revenue multiple and require proof of non-ad diversification.
  - - Content-license impairment
    - Renewal terms, partner announcements, or loss of exclusivity
    - Loss or material repricing of one or more flagship content partners that weakens answer quality or margin
    - Reassess moat durability and gross-margin assumptions.
  - - Founder / leadership discontinuity
    - Executive turnover or governance conflict
    - Daniel Nadler departs or materially steps back without a credible successor and governance plan
    - Immediate board diligence; treat as major thesis break until succession is clear.
  - - International / regulatory stall
    - EU/UK access status and compliance roadmap
    - No credible path back into EU/UK markets and no equivalent alternate growth engine outside U.S. ads/hospitals
    - Constrain TAM assumptions and treat expansion optionality as de minimis.
  notes: Thresholds are designed to be observable rather than theoretical so they can function as live diligence monitors.
