    - OpenEvidence is already litigating against direct competitors over impersonation, prompt stealing, and scraping.
    - Medium
    - Moderate-High
    - Pursue injunctive relief, tighten identity controls, and monitor abuse patterns.
    - Medium — even if meritorious, the suits consume management attention and reinforce a hostile competitive environment.
    - Discovery reveals weak identity controls, large-scale scraping, or counterclaims that impair credibility.
    - Request litigation budget, abuse telemetry, and security changes made after the complaints.
