- id: dependency-moat-and-competition
  title: Dependency, Moat Compression, and Platform Competition
  body: 'OpenEvidence’s moat is real but dependency-heavy. Wiley/Cochrane content and the broader journal-and-guideline stack are not peripheral inputs; they are central to the claim that answers are grounded in authoritative sources clinicians can verify. That creates a double-edged structure. If licenses deepen and remain differentiated, OpenEvidence looks more defensible than generic chatbots. If costs rise, exclusivity weakens, or coverage gaps become more visible, both gross margin and trust can erode at once. The same is true for infrastructure and distribution. OpenEvidence discloses hosting on Google Cloud Platform and Vercel, while larger rivals are moving directly into the same workflow. OpenAI now markets HIPAA-supporting evidence retrieval to hospitals, Anthropic offers healthcare-ready connectors to CMS, NPI, and PubMed, Google is pushing MedLM and Vertex Search, Doximity bundles clinical AI into a physician network that already reaches most U.S. doctors, and Microsoft is positioning
    Dragon Copilot as the enterprise shell that can surface OpenEvidence, UpToDate, and Elsevier inside the same ambient workflow. This is partly a sector-wide risk, but the company-specific consequence is clear: if the clinical question gets answered inside the EHR or a dominant ambient assistant, standalone query share and pricing power can compress faster than topline growth suggests.'
