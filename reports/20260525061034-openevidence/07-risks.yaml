  - - Malpractice / professional-liability exposure
    - OpenEvidence is used for high-stakes clinical questions and sector evidence shows hallucination plus over-reliance can change care decisions.
    - High
    - Critical
    - Contractual clinician responsibility, source citations, and internal review expectations.
    - High — contractual disclaimers do not eliminate downstream harm if clinicians or trainees over-trust outputs.
    - A publicly reported patient-safety event or insurer/legal claim tied to OpenEvidence-guided care.
    - Request adverse-event log, indemnity terms, and hospital incident-review processes.
