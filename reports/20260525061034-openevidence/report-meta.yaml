companyProfile:
  summary: >
    OpenEvidence is a fast-scaling medical AI company whose free clinician-facing product answers
    point-of-care questions with cited, peer-reviewed evidence. Founded in 2022 by Daniel Nadler
    and Zachary Ziegler, the company pairs rapid physician adoption with licensed medical content,
    publisher partnerships, and emerging health-system workflow integrations. As of January 2026,
    OpenEvidence had raised a $250 million Series D at a $12 billion valuation after stepping up
    from a $1 billion Series A less than a year earlier.
  foundedDate: "2022-01-01"
  founders:
    - name: "Daniel Nadler"
      role: "Founder & CEO"
      background: "Previously founded Kensho; S&P Global agreed to acquire Kensho in 2018 for approximately $550M net of cash."
      claimRefs: [CO012, CO014, CO015]
    - name: "Zachary Ziegler"
      role: "Co-founder"
      background: "Harvard-affiliated AI researcher described publicly as a Harvard PhD student or researcher."
      claimRefs: [CO013]
  foundingLocation: "Miami, FL, USA"
  headquarters: "Miami, FL, USA"
  productSummary: >
    OpenEvidence offers an evidence-grounded clinical AI platform across web, native mobile,
    and increasingly embedded workflow surfaces. Core modules include quick clinical consults,
    Deep Consult long-form research, voice interaction, documentation and coding support, and
    communications utilities, all tied to citations from licensed medical content such as NEJM,
    JAMA, NCCN, and Cochrane materials.
  customerFocus: >
    Verified clinicians are the primary users and distribution wedge, while enterprise health
    systems are emerging as institutional buyers that can extend access to nurses, pharmacists,
    and multidisciplinary care teams.
  businessModel: >
    Core access is free for verified clinicians and monetized primarily through pharmaceutical and
    medical-device advertising. Management and third-party analysis point to a developing enterprise
    and life-sciences monetization layer, but public revenue mix and contract economics remain opaque.
  stage: "Series D private company"
  fundingStatus: >
    OpenEvidence raised a $250 million Series D at a $12 billion valuation in January 2026 after
    a rapid sequence of 2025 financings that included a $75 million Series A, $210 million Series B,
    and $200 million Series C. Public sources describe roughly $700 million raised over the prior
    12 months.
  disclosureProfile: private-undisclosed
  claimRefs: [CO002, CO004, CO006, CO007, CO025, CO027, CO029, CO033, CO037, CO042]
summary:
