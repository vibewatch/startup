company:
  name: OpenEvidence
chapter:
  number: 8
  title: Valuation
  summary: OpenEvidence's January 2026 Series D moved the company from a February 2025 $1 billion unicorn mark to a $12 billion valuation in under a year, but public monetization evidence still centers on an ad-supported model and an estimated $150 million of annualized 2025 revenue. Public and private comparables do not support the current mark on disclosed fundamentals alone, so the evidence-backed stance is research-more with high risk and an expensive valuation until audited revenue quality, advertiser durability, and governance disclosure harden.
sections:
- id: S01
  title: Financing reset and what the current mark already prices in
  body: 'OpenEvidence''s valuation history is no longer defined by the February 2025 Series A alone. Public reporting now shows a rapid staircase from $1 billion in February 2025 to $3.5 billion in July, $6 billion in October, and $12 billion in January 2026. That is extraordinary even by vertical-AI standards and materially changes how the current entry should be judged. The company clearly has real traction: management and press sources converge on more than 40% daily physician usage, roughly 18 million December 2025 consultations, more than 100 million Americans touched by physicians using the product, and revenue that crossed $100 million in 2025. But the disclosed monetization proof still lags the mark. Sacra''s estimate of about $150 million annualized revenue implies roughly an 80x revenue multiple at $12 billion, versus roughly 70x at the July 2025 mark on about $50 million annualized revenue. The key takeaway is that the latest round did not merely update the Series A mark; it repriced
    OpenEvidence into a category where investors are already underwriting a future state, not just today''s disclosed operating base.'
