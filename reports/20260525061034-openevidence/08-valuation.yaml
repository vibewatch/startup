callouts:
- calloutType: strength
  title: Physician distribution is real and unusually hard to dismiss
  body: OpenEvidence has likely earned real product pull, not just investor enthusiasm. Public sources converge on broad physician reach, heavy consultation volume, and a content ecosystem that competitors cannot replicate overnight. That distribution quality is why the company deserves serious attention even though the current price is difficult to defend on public fundamentals.
  claimRefs:
  - CV009
  - CV010
  - CV013
  - CV037
- calloutType: risk
  title: The ad model is the gating risk between a premium company and an overvalued company
  body: A free, ad-supported physician product can scale quickly, but public evidence still does not show advertiser concentration, renewal quality, or how much enterprise revenue actually exists. That opacity matters because the current valuation assumes monetization quality that public evidence has not yet fully demonstrated.
  claimRefs:
  - CV008
  - CV014
  - CV017
  - CV038
  - CV043
- calloutType: risk
  title: Regulation is not the main issue today, but it can become the issue tomorrow
  body: Current FDA guidance leaves room for transparent clinician-facing support tools, yet OpenEvidence is explicitly investing in more agentic medical intelligence. If the product drifts from explainable support toward prescriptive decisioning, governance and compliance costs can rise faster than valuation bulls currently assume.
  claimRefs:
  - CV034
  - CV035
  - CV036
- calloutType: recommendation
  title: Current price already assumes the answer to the biggest diligence questions is favorable
  body: The public case is good enough to justify attention, but not strong enough to justify immediate conviction at $12B. Investors should require audited economics, advertiser durability, enterprise proof, and cap-table transparency before underwriting upside from the current mark.
  claimRefs:
  - CV044
  - CV047
  - CV048
  - CV049
