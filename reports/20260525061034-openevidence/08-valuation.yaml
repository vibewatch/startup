- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - What must be true
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Physician penetration stays above 40%, revenue roughly doubles again, ad CPMs hold, and enterprise monetization begins to matter.
    - $10B-$15B; current valuation can work if OpenEvidence compounds into a category-defining physician platform rather than a single-feature clinical search tool.
    - Execution still depends on monetization quality, partner durability, and no major governance shock.
    - Requires disclosed revenue run-rate well above current public evidence plus clearer enterprise proof.
  - - Base
    - Adoption stays strong but monetization matures more slowly, disclosure remains incomplete, and valuation converges toward a premium private multiple rather than an extreme scarcity multiple.
    - $5B-$8B; large outcome, but below the current mark and more in line with a high-quality private premium over public comps.
    - Public comp gravity, mixed advertiser quality, and only partial enterprise monetization.
    - Most consistent with current public evidence.
  - - Bear
    - Usage growth slows, ad demand softens, competitive pressure rises, or regulation tightens around agentic medical assistance.
    - $2B-$4B; strong product survives but valuation compresses sharply as the market pays for real economics instead of optionality.
    - Multiple compression, trust erosion, or a down-round reset.
    - Triggered by weak revenue quality, weak renewals, or a material regulatory/partner setback.
  notes: Ranges are judgmental valuation bands anchored on disclosed adoption, estimated revenue, public comp multiples, and private medical-AI scarcity, not on unsupported DCF precision.
