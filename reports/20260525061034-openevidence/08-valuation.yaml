- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Physician adoption
    - More than 40% daily physician usage and rapidly rising consultation volumes suggest genuine workflow pull.
    - Usage can be broad without being monetized at software-quality economics or staying durable under competition.
    - Show specialty-level retention, repeat usage, and engagement cohorts over multiple quarters.
  - - Content moat
    - NEJM, JAMA, NCCN, Cochrane, and other partnerships create a real trust and distribution edge.
    - Publisher relationships can be valuable yet still insufficient to defend an $12B mark if competitors secure similar access or clinicians multi-home.
    - Demonstrate exclusive value from licensed content in retention or conversion data.
  - - Monetization
    - Premium physician ad pricing and free access can scale quickly without hospital procurement friction.
    - Ad dependence creates concentration, ethics, and cyclicality risk that public disclosures do not yet quantify.
    - Disclose advertiser concentration, renewal, and non-ad revenue mix.
  - - Comparable support
    - Private medical-AI scarcity and public AI enthusiasm explain some premium to public health-tech comps.
    - The disclosed multiple remains far above the public comp band and even above many AI-health peers on known fundamentals.
    - Show revenue growth and margins strong enough to compress the implied multiple toward a more defensible forward number.
  - - Regulatory posture
    - Current FDA guidance leaves room for clinician-facing support tools that remain transparent and non-determinative.
    - A shift toward more agentic or prescriptive behavior could move the product toward heavier oversight or governance burdens.
    - Provide product-boundary documentation, human review design, and governance controls.
  - - Exit path
    - Strong adoption and brand could support a future IPO or strategic process once disclosure matures.
    - No public evidence yet proves IPO-grade disclosure, durable enterprise contracts, or a clean preference stack.
    - Share audited financials, board terms, and a credible path to public-company readiness.
  notes: The anti-thesis is deliberately valuation-sensitive rather than a generic risk list; each row names the single disclosure or operating proof that would most move the view.
