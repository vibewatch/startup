- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Valuation / status
  - Revenue context
  - Relevance
  - Limitation
  rows:
  - - OpenEvidence (current private mark)
    - $12B private Series D
    - ~$150M annualized 2025 revenue estimate; >$100M official revenue threshold disclosed
    - Current underwriting anchor for this chapter
    - Revenue estimate is unaudited and private-mark dynamics can overstate comparability
  - - Doximity
    - $3.64B public market cap (~5.8x)
    - ~$0.63B TTM revenue; ad-heavy physician network
    - Closest public monetization analog because physician audience and ad economics overlap
    - More mature and broader communications/workflow product set
  - - Tempus AI
    - $8.29B public market cap (~6.5x)
    - ~$1.27B TTM revenue
    - Useful public healthcare-AI benchmark for data/software premium
    - Diagnostics and genomics mix differ from physician search
  - - Veeva Systems
    - $26.13B public market cap (~8.2x)
    - ~$3.19B TTM revenue
    - Best-in-class clinical software benchmark for scaled trust and workflow value
    - Enterprise SaaS to life sciences is not a free physician product
  - - Phreesia
    - $0.55B public market cap (~1.2x)
    - ~$0.46B TTM revenue
    - Workflow software reference for downside multiple discipline
    - Patient intake and engagement are economically different from clinician AI
  - - Health Catalyst
    - $0.095B public market cap (~0.3x)
    - ~$0.31B TTM revenue
    - Shows how hard public markets punish slower-growth or weaker-differentiated health IT
    - Turnaround-like profile is not an AI scarcity asset
  - - Hippocratic AI
    - $3.5B private Series C
    - Revenue not publicly disclosed
    - Relevant private medical-AI scarcity comp
    - Different end market and no public revenue disclosure
  - - UpToDate / Wolters Kluwer
    - No standalone valuation disclosed
    - ~$595M revenue reference via seat-license knowledge model
    - Useful monetization analog for evidence-based clinical knowledge tools
    - No standalone trading multiple and parent-company context dilute comparability
  notes: Public rows use market-cap-to-revenue as a practical observable proxy because enterprise-value normalization is not sourced here; the table is a selected, not exhaustive, mix of directly relevant physician, clinical software, and medical-AI references.
