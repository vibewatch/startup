  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-overhang
    missingEvidence: Liquidation preferences, secondary history, waterfall mechanics, and board-control terms for the 2025-2026 financings.
    whyItMatters: A high private mark can still be a weak late-stage entry if preferences and secondary clearing levels absorb much of the future upside.
    diligencePath: Request the full cap table, financing documents, and any recent secondary transaction references from counsel or lead investors.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: enterprise-monetization
    missingEvidence: Signed health-system, payer, or EHR agreements and a bridge showing how much revenue comes from enterprise contracts rather than advertising.
    whyItMatters: The current valuation is easier to defend if OpenEvidence is becoming a durable workflow vendor rather than only a premium advertising surface.
    diligencePath: Request executed enterprise agreements, implementation timelines, and a revenue-mix bridge by product line.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: advertiser-concentration
    missingEvidence: Top advertiser concentration, average contract duration, renewal rates, and policy safeguards separating sponsor economics from clinical outputs.
    whyItMatters: If monetization is concentrated or unstable, the current valuation can compress quickly even if physician usage remains high.
    diligencePath: Request top-customer concentration, renewal cohorts, pricing trends, and advertising-governance materials.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-valuation-table
    missingEvidence: Additional directly sourced private medical-AI and healthcare-workflow valuation references with disclosed revenue or round terms beyond the selected comp set.
    whyItMatters: TV004 is intentionally partial because several relevant private peers lack clean public valuation and revenue disclosure, so the selected set could miss outliers.
    diligencePath: Refresh the comp set with any newly disclosed rounds, secondary marks, or audited public-company updates before an investment decision.
    relatedQuestionRefs:
    - QV018
    - QV024
    relatedTableRefs:
    - TV004
