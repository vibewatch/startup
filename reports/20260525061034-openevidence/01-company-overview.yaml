- id: adoption-content-moat-and-milestones
  title: Adoption, Content Moat, and Public Milestones
  body: 'OpenEvidence’s moat narrative is built on two reinforcing pillars: physician adoption and exclusive content supply. Across company disclosures and independent coverage, the most consistent traction figure is that more than 40% of U.S. physicians use the platform daily across more than 10,000 hospitals and medical centers. Company announcements say the system supported about 18 million U.S. clinical consultations in December 2025, crossed one million consultations in a single day in March 2026, and has now supported more than 200 million consultations to date. CNBC separately reported annualized revenue above $100 million in 2025, implying the company has translated attention into real monetization. On the supply side, OpenEvidence has assembled a differentiated licensed corpus: NEJM Group content from 1990 forward, JAMA’s full-text family of journals, Wiley’s 400-plus journals and books, Cochrane reviews and clinical answers, and NCCN oncology algorithms. Product milestones such
    as Visits, plus 2026 health-system collaborations with Sutter and Cedars-Sinai, show the company moving from search into workflow-embedded clinical infrastructure.'
