  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-governance
    missingEvidence: Current board seats, observer rights, and investor control provisions.
    whyItMatters: Governance visibility is needed to assess founder dependence, lead-investor influence, and downside protections.
    diligencePath: Request current board list, voting agreements, and side-letter summaries from the company or lead investors.
    relatedQuestionRefs:
    - QO005
    - QO026
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: material
    topic: capital-formation
    missingEvidence: A reconciled cap table or financing summary that explains lifetime funding versus the disclosed trailing-12-month figure.
    whyItMatters: Valuation context and dilution analysis depend on knowing whether the true cumulative funding base is closer to $700 million or to CNBC’s $795.4 million figure.
    diligencePath: Request a financing ledger by round, including gross proceeds, secondaries, and cumulative capital raised.
    relatedQuestionRefs:
    - QO010
    - QO027
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: ad-economics
    missingEvidence: Advertiser concentration, campaign mix, CPMs, and audited revenue split between ads and any enterprise products.
    whyItMatters: The ad-supported model is central to adoption, but concentration risk and incentives are opaque.
    diligencePath: Request revenue by product line, top-advertiser concentration, and guardrail policies for sponsored placement.
    relatedQuestionRefs:
    - QO020
    - QO028
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: public-outcomes-evidence
    missingEvidence: Peer-reviewed independent outcome studies demonstrating how OpenEvidence changes care quality or patient outcomes in production.
    whyItMatters: Rapid adoption is evident, but independent efficacy evidence remains limited relative to the company’s clinical significance claims.
    diligencePath: Ask for published or preprint studies on physician workflow, decision quality, and patient outcomes across production deployments.
    relatedQuestionRefs:
    - QO021
    relatedTableRefs:
    - TO004
