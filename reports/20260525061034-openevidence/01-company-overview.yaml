company:
  name: OpenEvidence
chapter:
  number: 1
  title: Company Overview
  summary: OpenEvidence has become one of the fastest-growing clinical AI platforms in U.S. healthcare, pairing free clinician access with premium licensed medical content and a valuation jump from $1 billion to $12 billion in less than a year. Founder-led execution, deep content partnerships, and daily physician usage are major strengths, but governance opacity, ad-model incentives, uneven privacy acceptance, and active litigation remain material diligence risks.
sections:
- id: identity-and-product-model
  title: Identity and Product Model
  body: 'OpenEvidence is a Miami-based medical AI company whose clinician-facing platform emerged in 2023 after the business was founded in 2022 by Daniel Nadler and Zachary Ziegler. The company presents itself as a medical knowledge platform and AI copilot for high-stakes point-of-care decisions rather than as a general-purpose chatbot. That distinction matters to its go-to-market story: OpenEvidence says it grounds answers in peer-reviewed medical literature, cites the underlying sources, and trains on licensed medical content instead of the open internet. The product surface now spans the core Ask experience, Visits for encounter capture and note generation, Voice Mode for hands-free question answering, and DeepConsult for longer-form agentic research. Core access remains free for verified U.S. clinicians, which has helped distribution, but the free model is underwritten by advertising. The result is a platform that looks more like workflow infrastructure than a single search tool, but
    whose commercial durability still depends on physician trust in both answer quality and monetization guardrails.'
