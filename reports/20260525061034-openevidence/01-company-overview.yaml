- id: risks-monetization-and-open-questions
  title: Risks, Monetization Tension, and Open Questions
  body: 'The same features that make OpenEvidence powerful also create the chapter’s main diligence flags. Public reporting shows clinicians appreciate speed, but NBC News found persistent concerns about hallucinations, incomplete answers, limited patient-outcome evidence, and erosion of junior clinicians’ critical thinking. Privacy acceptance is also uneven: although OpenEvidence announced HIPAA compliance and says it is SOC 2 Type II certified, NBC reported that MaineHealth still tells clinicians not to enter PHI. Monetization is another source of tension. CNBC and NBC both describe the core product as ad-supported, including pharmaceutical or medical-device promotions, while a 2026 medRxiv preprint showed that ads can shift drug selection when evidence is otherwise balanced. Finally, OpenEvidence is already in live litigation with Doximity over alleged prompt hacking and trade-secret extraction, with counterclaims of misinformation and employee poaching. None of these risks negate the
    company’s extraordinary adoption, but they do mean governance visibility, privacy guardrails, and ad-model controls deserve as much diligence as usage growth and headline valuation.'
