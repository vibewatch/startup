- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing Metric
  - Impact on Analysis
  - Diligence Path
  rows:
  - - Cash on hand, monthly burn, and runway
    - Blocking — capital adequacy cannot be underwritten without this
    - Request board deck or CFO update with current cash, monthly burn, and base / downside runway
  - - Revenue mix by ads vs enterprise vs life sciences
    - Blocking — revenue quality cannot be judged without mix
    - Request 2025 and Q1 2026 revenue bridge by stream and customer type
  - - Enterprise contract pricing and non-ad tier terms
    - Material — determines whether enterprise revenue can improve durability and gross margin
    - Obtain sample MSAs, pricing cards, implementation statements of work, and renewal history
  - - Advertiser concentration, renewal, and sales concentration
    - Material — ad dependence may be stronger than headline revenue suggests
    - Request top-10 advertiser share, retention, seasonality, and pipeline by sponsor type
  - - Content-licensing expense and rev-share obligations
    - Material — margin story is unreliable without direct content costs
    - Request licensing schedule, minimum guarantees, and partner rev-share / exclusivity terms
  - - Audited statements and product-level gross margin / compute cost
    - Material — public claims rely on company statements and analyst models
    - Request audited 2025 P&L and product-level unit-cost reporting for search, DeepConsult, and enterprise deployments
  notes: The gaps below are the minimum diligence package needed to move from narrative enthusiasm to an underwritten financial model.
