- id: cost-structure-and-margin-path
  title: Cost structure and margin path
  body: 'OpenEvidence appears capital-light relative to hardware or provider-services businesses, but it is not cheap to run. The disclosed cost stack centers on compute, model training, content licensing, compliance, and commercialization rather than factories or inventory. Management said the Series D proceeds would go mainly to R&D, model training, compute, and expanded content partnerships, and the July 2025 launch materials say each DeepConsult run consumes more than 100 times the compute and cost of a standard search even though the feature remains free to verified clinicians. That creates a familiar tradeoff: the free product accelerates adoption, but high-compute premium features must eventually be subsidized by ads, enterprise contracts, or future premium tiers. Licensing dependence is the second major cost and margin variable. OpenEvidence''s differentiation relies on agreements with NEJM, JAMA, NCCN, Wiley/Cochrane, and other content owners; R&D World and Sacra both frame these
    partnerships as central to the moat. Public gross-margin evidence is therefore thin: Sacra''s ~90% estimate may be directionally plausible for software plus ads, but it is not audited and could prove too high if licensing fees, inference intensity, or enterprise support obligations scale faster than revenue. Adverse sources also raise the harder question: a pharma-funded model may be profitable, but it can still face publication-bias, trust, and sponsor-conflict pressure that ultimately caps willingness to pay or pushes health systems toward non-ad configurations.'
