- id: capital-adequacy-and-diligence-blockers
  title: Capital adequacy and diligence blockers
  body: 'OpenEvidence''s fund-raising cadence suggests ample access to equity capital, but not enough public disclosure to underwrite runway confidently. The company raised $210 million in July 2025, $200 million in October 2025, and $250 million in January 2026, with official and news sources putting total funding at roughly $700 million by early 2026. That is substantial relative to the scale of publicly estimated revenue, and the stated use of funds points to growth investment rather than emergency refinancing. However, the same source set leaves core solvency questions unanswered: there is no public cash balance, no monthly burn figure, no runway disclosure, and no breakdown of how much revenue is recurring enterprise software versus cyclical ad spend. SEC evidence adds one more nuance: the only recent OpenEvidence-related Form D result is a pooled investment vehicle tied to secondary-market trading, which is useful evidence of market interest but not a substitute for operating-company
    transparency. Financially, the business looks promising but still dependency-heavy: it can likely fund product expansion today, yet the next stage of underwriting depends on whether enterprise contracts and life-sciences products mature before ad-model conflict, sponsor concentration, or compute-and-licensing costs compress the margin story.'
