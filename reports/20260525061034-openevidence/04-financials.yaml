  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing
    missingEvidence: Public enterprise pricing, ACV, implementation fees, renewal terms, and whether an ad-free premium tier is live.
    whyItMatters: Without contract economics, enterprise upside cannot be converted into a durable recurring-revenue model.
    diligencePath: Request signed MSAs, pricing cards, and one redlined health-system order form.
    relatedQuestionRefs:
    - QI004
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, monthly net burn, and management runway view under base and downside scenarios.
    whyItMatters: Capital adequacy cannot be underwritten from funding headlines alone.
    diligencePath: Request board-approved cash forecast or CFO monthly reporting package.
    relatedQuestionRefs:
    - QI016
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: blocking
    topic: revenue-mix
    missingEvidence: Revenue split by ads, enterprise contracts, and life-sciences products plus advertiser concentration and renewal data.
    whyItMatters: Revenue quality depends on whether the company is still mostly ad-funded or already transitioning into contracted software revenue.
    diligencePath: Request 2025 audited revenue bridge and Q1 2026 management-account rollforward by stream.
    relatedQuestionRefs:
    - QI017
    relatedTableRefs:
    - TI001
    - TI005
  - type: missing-source
    severity: material
    topic: debt-obligations
    missingEvidence: Debt schedules, credit facilities, vendor financing, and any structured obligations not visible in public sources.
    whyItMatters: Undisclosed debt or financing covenants could materially change runway and downside recovery.
    diligencePath: Request debt schedule, board consents, and counsel memo covering credit agreements and liens.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: licensing-cost
    missingEvidence: Content licensing expense by partner, minimum guarantees, exclusivity terms, and rev-share obligations.
    whyItMatters: Margin durability depends as much on content rights economics as on compute efficiency.
    diligencePath: Request top licensing contracts and 2025 spend by publisher/guideline partner.
  - type: private-evidence-only
    severity: material
    topic: audit-trail
    missingEvidence: Audited 2025 financial statements and product-level margin reporting.
    whyItMatters: Current public financial signals are mostly company-claimed or analyst-estimated, which is insufficient for high-confidence underwriting.
    diligencePath: Request audited 2025 P&L, cash flow statement, and gross-margin bridge by product family.
