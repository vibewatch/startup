company:
  name: OpenEvidence
chapter:
  number: 4
  title: Financials
  summary: OpenEvidence's current public financial profile looks like a free-to-physician, ad-supported clinical AI platform with very rapid usage growth and a plausible but still early enterprise and life-sciences upsell path. Public signals support >$100 million of 2025 revenue and roughly $700 million of cumulative funding, but management does not disclose cash, burn, revenue mix, enterprise pricing, advertiser concentration, or audited margins. The underwriting case therefore depends on whether high-margin pharma advertising can remain durable long enough for health-system and life-sciences contracts to improve revenue quality.
sections:
- id: revenue-model-and-monetization
  title: Revenue model and monetization architecture
  body: 'OpenEvidence''s public monetization model is unusual for healthcare software because the core clinician product is free rather than subscription priced. Official and independent sources consistently describe the platform as free to verified U.S. doctors and funded primarily by pharmaceutical and medical-device advertising shown while answers load. That model matters financially because it shifts the first monetization event away from seat sales and toward query volume, physician specialty mix, and advertiser demand. Sacra''s revenue work suggests the ad engine can be economically meaningful at scale, with estimated CPMs far above general consumer media and roughly $124 of ARPU, while company-linked press coverage says OpenEvidence crossed $100 million of annual revenue during 2025. At the same time, the public source set also shows management trying to diversify beyond ads. Mount Sinai''s Epic deployment, Sutter''s workflow collaboration, and Sacra''s discussion of a future non-ad
    enterprise tier imply a path toward higher-quality contracted revenue, while the Veeva/Open Vista partnership creates a separate life-sciences channel. What remains missing is pricing transparency: no retained public source discloses enterprise ACV, implementation fees, revenue share terms, or the split between ad, enterprise, and life-sciences revenue.'
  claimRefs:
