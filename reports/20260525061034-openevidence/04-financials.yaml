- id: traction-and-go-to-market-quality
  title: Public traction and go-to-market quality
  body: 'The public traction picture is strong enough to support a real revenue base, but it still leans heavily on company-claimed metrics. BusinessWire, CNBC, Fierce, and related July 2025 funding coverage all describe very fast clinician adoption: more than 40% of U.S. physicians using the product daily, more than 10,000 hospitals and medical centers touched by the product, roughly 18 million monthly consultations by December 2025, and earlier mid-2025 run rates of 8.5 million monthly consultations plus 65,000 new verified clinicians each month. Sacra argues that free access helped OpenEvidence bypass the roughly 18-month procurement cycle that usually slows hospital software. That GTM advantage is credible: the company can acquire clinicians bottom-up, prove workflow habit, and then sell governance and integration later. The problem is that public sales-efficiency math is incomplete. There is no disclosed CAC, no disclosed enterprise close rate, no public seat count for health-system
    contracts, and no audited conversion from consultations into ad inventory or enterprise ARR. Revenue quality therefore improves if hospital and life-sciences contracts scale, but today''s public evidence still points to a business whose traction is impressive while its monetization mix remains opaque.'
