- id: TI003
  title: Unit Economics Table
  columns:
  - Metric
  - Value / Range
  - Confidence
  - Why It Matters
  - Diligence Ask
  rows:
  - - 2025 annual revenue (company claim)
    - '>$100M'
    - Medium
    - Shows the ad model is already meaningful at scale
    - Request audited 2025 revenue and monthly exit-rate bridge
  - - 2025 annualized revenue (Sacra estimate)
    - $150M
    - Medium
    - Sets an upper bound for current scale and valuation multiple analysis
    - Request management reconciliation between company and analyst estimates
  - - Estimated gross margin
    - ~90%
    - Low-Medium
    - Suggests software-like economics if compute and licensing are controlled
    - Provide audited gross margin and direct cost allocation by product
  - - Estimated ARPU
    - ~$124
    - Low-Medium
    - Useful proxy for monetization efficiency per clinician
    - Disclose clinician monetization by specialty and engagement cohort
  - - Estimated ad CPM range
    - $70-$1,000+
    - Low-Medium
    - Shows why physician attention can monetize unusually well
    - Provide realized CPMs by sponsor type and inventory class
  - - Monthly consultations
    - ~18M in Dec 2025; ~20M in Jan 2026 est.
    - Medium
    - Core activity driver for ad inventory and enterprise relevance
    - Show logged-in clinical consultations by month and by clinician cohort
  - - Daily physician penetration
    - '>40% of U.S. physicians'
    - Medium
    - Signals habit strength and bottom-up GTM efficiency
    - Provide exact DAU, WAU, and denominator methodology
  - - New clinician registrations
    - 65,000+ per month (mid-2025)
    - Medium
    - Proxy for organic acquisition velocity
    - Disclose paid acquisition spend, referral share, and activation rate
  - - DeepConsult compute load
    - '>100x a standard search'
    - Medium
    - Important because premium features can compress margin if kept free
    - Provide marginal cost per DeepConsult run and usage caps
  - - Enterprise ACV / contract pricing
    - Unknown
    - None
    - Determines whether enterprise can improve revenue quality over ads
    - Share enterprise contracts, renewal terms, and implementation economics
  - - Advertiser concentration / retention
    - Unknown
    - None
    - Critical for assessing volatility of ad-funded revenue
    - Provide top-customer concentration and renewal / upsell data
  notes: This table intentionally separates company-claimed metrics from analyst estimates and undisclosed fields. Unknown means not publicly disclosed in retained sources, not zero.
