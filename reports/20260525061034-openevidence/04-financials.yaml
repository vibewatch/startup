tables:
- id: TI001
  title: Revenue Streams Table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current Value / Status
  - Revenue Quality
  - Diligence Ask
  rows:
  - - Pharma / med-device advertising
    - Sponsored placements shown during answer-generation wait times
    - CPM / campaign spend
    - Primary live revenue stream; company says product is free to doctors and ad-supported
    - Medium-High current monetization; highly scalable, but exposed to advertiser budgets and policy constraints
    - Request advertiser concentration, fill rate, renewal rate, and pharma vs device spend mix
  - - Free clinician search volume
    - Consultations create impression inventory and specialty-targeted demand
    - Consultations per month
    - ~18M monthly consultations in Dec 2025; ~20M/month by Jan 2026 est.
    - Not revenue by itself, but the core demand engine behind ad yield
    - Show consult-to-impression conversion, average sessions per clinician, and unsold inventory
  - - Health-system enterprise deployments
    - Workflow integration, governance, and potential non-ad contractual access
    - System contract / seat / platform fee
    - Mount Sinai enterprise-scale Epic deployment announced; Sutter and other systems cited publicly
    - Potentially higher-quality recurring revenue, but price and contract structure are undisclosed
    - Provide standard contract metric, ACV range, implementation burden, and renewal timing
  - - Workflow products (Visits, Coding, Dialer)
    - Broader workflow modules increase upsell surface beyond search
    - Module bundle / enterprise add-on
    - Feature surface expanded in 2025-2026; no public standalone pricing
    - Strategic expansion path; monetization not publicly separated
    - Break out attach rates, active users, and paid-vs-free usage by module
  - - Open Vista life-sciences channel
    - Joint AI platform with Veeva for trials, discovery, and medicine adoption
    - Strategic partnership / custom enterprise
    - First Open Vista products expected in 2026; economics not disclosed
    - Potentially large TAM with higher willingness to pay than clinicians
    - Disclose pricing model, commercial ownership, and any revenue-sharing terms
  - - Secondary-market vehicles
    - Pooled investment fund activity around OpenEvidence equity
    - Secondary transaction dollars
    - SEC Form D shows HII OpenEvidence-01 sold ~$5.76M; not operating revenue
    - Not a core revenue stream; relevant only as capital-markets signal
    - Clarify whether secondary liquidity affects employee retention, insider selling, or cap-table pressure
  notes: Rows mix current revenue streams with clearly labeled emerging pathways and capital-markets signals. Public sources do not disclose actual revenue mix or realized pricing.
