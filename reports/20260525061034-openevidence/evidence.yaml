evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-governance
    missingEvidence: Current board seats, observer rights, and investor control provisions.
    whyItMatters: Governance visibility is needed to assess founder dependence, lead-investor influence, and downside protections.
    diligencePath: Request current board list, voting agreements, and side-letter summaries from the company or lead investors.
    relatedQuestionRefs:
      - QO005
      - QO026
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: capital-formation
    missingEvidence: >-
      A reconciled cap table or financing summary that explains lifetime funding versus the disclosed trailing-12-month
      figure.
    whyItMatters: >-
      Valuation context and dilution analysis depend on knowing whether the true cumulative funding base is closer to
      $700 million or to CNBC’s $795.4 million figure.
    diligencePath: Request a financing ledger by round, including gross proceeds, secondaries, and cumulative capital raised.
    relatedQuestionRefs:
      - QO010
      - QO027
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: ad-economics
    missingEvidence: Advertiser concentration, campaign mix, CPMs, and audited revenue split between ads and any enterprise products.
    whyItMatters: The ad-supported model is central to adoption, but concentration risk and incentives are opaque.
    diligencePath: Request revenue by product line, top-advertiser concentration, and guardrail policies for sponsored placement.
    relatedQuestionRefs:
      - QO020
      - QO028
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: public-outcomes-evidence
    missingEvidence: >-
      Peer-reviewed independent outcome studies demonstrating how OpenEvidence changes care quality or patient outcomes
      in production.
    whyItMatters: >-
      Rapid adoption is evident, but independent efficacy evidence remains limited relative to the company’s clinical
      significance claims.
    diligencePath: >-
      Ask for published or preprint studies on physician workflow, decision quality, and patient outcomes across
      production deployments.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: enterprise budget ownership split
    missingEvidence: >-
      A public benchmark showing how CMIO, CIO, library, GME, and service-line budgets split actual spend for
      point-of-care AI or reference tools.
    whyItMatters: >-
      Buyer/user segmentation is clear directionally, but budget authority affects sales cycle length and whom
      OpenEvidence must convince first.
    diligencePath: >-
      Collect public RFPs, academic medical-center subscription records, or customer interviews that identify formal
      budget owner and approval chain.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: enterprise pricing opacity
    missingEvidence: >-
      Institutional ACV, implementation fees, and renewal pricing for UpToDate-, DynaMed-, or OpenEvidence-like
      enterprise contracts.
    whyItMatters: >-
      Without enterprise pricing, the bottom-up SAM/SOM ranges are lower bounds rather than full provider-organization
      spend estimates.
    diligencePath: >-
      Request procurement documents, benchmark quotes, or customer references from public systems and teaching
      hospitals.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: OpenEvidence paid conversion
    missingEvidence: >-
      Publicly supportable paid-seat counts, contract values, or revenue conversion from OpenEvidence usage into
      enterprise budgets.
    whyItMatters: >-
      A physician-first SOM proxy is only a market opportunity estimate until actual conversion and monetization data
      are disclosed.
    diligencePath: >-
      Obtain management data, customer references, or procurement records showing seat counts, ACV, and renewal
      behavior.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: top-down market taxonomy
    missingEvidence: >-
      A harmonized apples-to-apples 2026 definition that reconciles all-CDSS, AI-CDSS, and point-of-care reference-tool
      boundaries.
    whyItMatters: >-
      Publisher TAMs are useful but definition-sensitive, so investors could overstate market size if they collapse
      incompatible categories into one number.
    diligencePath: >-
      Normalize competitor sets and inclusion rules across analyst reports, then rebuild the category bottom-up from
      spend classes.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Cohort-level retention, session frequency, and hospital replacement-versus-adjunct data for OpenEvidence versus
      UpToDate, Doximity Ask, and incumbent references.
    whyItMatters: >-
      The public evidence proves awareness and product availability, but not whether OpenEvidence is displacing
      incumbent reference spend or merely coexisting with it.
    diligencePath: >-
      Request cohort retention curves, account-level expansion data, and side-by-side hospital usage logs showing
      primary versus secondary reference behavior.
    relatedQuestionRefs:
      - QP022
      - QP023
  - type: missing-source
    severity: material
    topic: enterprise-pricing
    missingEvidence: >-
      Actual enterprise contract ranges for UpToDate, DynaMedex, Micromedex, and ClinicalKey, including seat
      definitions, EHR integration fees, and renewal mechanics.
    whyItMatters: >-
      Public list prices are transparent for self-serve AI and lighter tools, but enterprise pricing opacity makes it
      hard to underwrite margin headroom and displacement economics.
    diligencePath: >-
      Collect customer contracts, procurement records, or verified buyer interviews for incumbent enterprise reference
      suites and compare them with OpenEvidence commercial terms.
    relatedQuestionRefs:
      - QP014
      - QP015
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: minor
    topic: long-tail-competitors
    missingEvidence: >-
      A fuller list of subscale clinical AI startups and hospital-built internal copilots not visible on the retained
      public source set.
    whyItMatters: >-
      The chapter covers the most decision-relevant retained competitors, but long-tail entrants can still accelerate
      commoditization or create niche displacement.
    diligencePath: >-
      Expand discovery into procurement forums, hospital AI committees, and specialty-specific clinician communities to
      capture smaller tools and internal deployments.
    relatedQuestionRefs:
      - QP001
      - QP018
      - QP024
    relatedTableRefs:
      - TP001
      - TP003
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing
    missingEvidence: Public enterprise pricing, ACV, implementation fees, renewal terms, and whether an ad-free premium tier is live.
    whyItMatters: Without contract economics, enterprise upside cannot be converted into a durable recurring-revenue model.
    diligencePath: Request signed MSAs, pricing cards, and one redlined health-system order form.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, monthly net burn, and management runway view under base and downside scenarios.
    whyItMatters: Capital adequacy cannot be underwritten from funding headlines alone.
    diligencePath: Request board-approved cash forecast or CFO monthly reporting package.
    relatedQuestionRefs:
      - QI016
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: blocking
    topic: revenue-mix
    missingEvidence: >-
      Revenue split by ads, enterprise contracts, and life-sciences products plus advertiser concentration and renewal
      data.
    whyItMatters: >-
      Revenue quality depends on whether the company is still mostly ad-funded or already transitioning into contracted
      software revenue.
    diligencePath: Request 2025 audited revenue bridge and Q1 2026 management-account rollforward by stream.
    relatedQuestionRefs:
      - QI017
    relatedTableRefs:
      - TI001
      - TI005
  - type: missing-source
    severity: material
    topic: debt-obligations
    missingEvidence: Debt schedules, credit facilities, vendor financing, and any structured obligations not visible in public sources.
    whyItMatters: Undisclosed debt or financing covenants could materially change runway and downside recovery.
    diligencePath: Request debt schedule, board consents, and counsel memo covering credit agreements and liens.
    relatedQuestionRefs:
      - QI018
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: licensing-cost
    missingEvidence: Content licensing expense by partner, minimum guarantees, exclusivity terms, and rev-share obligations.
    whyItMatters: Margin durability depends as much on content rights economics as on compute efficiency.
    diligencePath: Request top licensing contracts and 2025 spend by publisher/guideline partner.
  - type: private-evidence-only
    severity: material
    topic: audit-trail
    missingEvidence: Audited 2025 financial statements and product-level margin reporting.
    whyItMatters: >-
      Current public financial signals are mostly company-claimed or analyst-estimated, which is insufficient for
      high-confidence underwriting.
    diligencePath: Request audited 2025 P&L, cash flow statement, and gross-margin bridge by product family.
  - type: missing-source
    severity: material
    topic: public-performance-disclosure
    missingEvidence: Public uptime SLA, latency benchmarks, historical incident log, or comparable operational reliability disclosures.
    whyItMatters: Enterprise buyers need to know whether the platform is dependable enough for frontline clinical use.
    diligencePath: Request trust-center materials, customer SLA language, incident history, and latency benchmarking by workflow.
    relatedQuestionRefs:
      - QE018
  - type: private-evidence-only
    severity: material
