summary:
  headline: |
    OpenEvidence 已拿到少见的临床医生采用率，也建起真正的高端内容护城河；但 2026 年 1 月 $12 billion 估值远远跑在公开证据前面，收入质量、广告主耐久性、企业端深度和治理披露都还撑不起这个价格。
