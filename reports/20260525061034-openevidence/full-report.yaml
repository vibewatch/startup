  - id: FE001
    title: Product architecture map
    type: stack
    layout: standard
    summary: Publicly disclosed operating stack from clinician input to licensed evidence and verification output.
    data:
      layers:
        - label: Clinician workflow surfaces
          detail: >-
            Web app, native iOS and Android apps, and Voice Mode give clinicians multiple entry points for asking
            medical questions in natural language.
        - label: Workflow modules
          detail: >-
            Core Ask/Clinical Consult plus Deep Consult, Visits, Coding Intelligence, Messages, Fax, Dialer, and other
            user-guide modules broaden the product from search into workflow execution.
        - label: Evidence-grounded answer engine
          detail: >-
            OpenEvidence publicly describes specialized models trained on peer-reviewed literature rather than the open
            internet, with synthesis and citation handling built around clinical questions.
        - label: Licensed evidence corpus
          detail: >-
            NEJM, JAMA, NCCN, Wiley/Cochrane, FDA, CDC, and other partner content determine what source material can be
            retrieved, synthesized, and cited.
        - label: Verification and enterprise context
          detail: >-
            Source drill-down, written references, source documentation, and selected Epic patient-context integrations
            let clinicians verify outputs and use them inside care workflows.
    approximationNotes: >-
      This figure reflects the public operating model only. OpenEvidence does not publicly disclose model routing,
      infrastructure vendors, or low-level inference architecture in the sources reviewed here.
