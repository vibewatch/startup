      - number: '7.5'
        title: Mitigations, Monitoring, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence is not unmanaged. Public mitigations include HCP-only gating, explicit contractual language
              that clinicians remain responsible, BAAs for covered PHI use, HIPAA and SOC 2 claims, source citations,
              and a deliberate strategy of licensing premium content rather than relying on the open internet. The
              company also has meaningful strategic optionality: a very large physician user base, early enterprise
              outreach, and enough capital to keep investing. Those points matter, and they are why the risk profile is
              still investable rather than broken. But each mitigation has a boundary. Citations do not guarantee that
              clinicians will verify them under time pressure. HIPAA posture does not remove OCR risk if ad-tech,
              analytics, or partner workflows are misconfigured. Content partnerships reduce hallucination risk but
              create cost and renewal dependence. Founder-led speed can magnify both strategic edge and concentration.
              For underwriting, the cleanest thesis-break triggers are monitorable: any evidence that OpenEvidence’s UX
              or contracts cause hospitals to treat it as a de facto diagnostic engine, any publicly reported
              clinical-error or privacy incident that exposes weak auditability, loss or repricing of core content
              licenses, persistent inability to convert clinician adoption into non-ad enterprise revenue, or Daniel
              Nadler’s departure without a prepared successor. The right stance is not to assume failure, but to require
              proof that governance, monetization quality, and hospital acceptance are catching up with adoption.
            claimRefs:
              - CR019
              - CR031
