      - number: '7.2'
        title: Hallucination, Auditability, Security, and Evidence-Quality Limits
        blocks:
          - type: paragraph
            body: >-
              Hallucination and over-reliance are partly sector-wide clinical-AI risks, but they are unusually relevant
              for OpenEvidence because the product is explicitly used at the bedside for high-stakes questions. Voice
              Mode and Visits extend the interface from typed search to real-time conversation, which is convenient but
              creates more ways for speech-recognition errors, context loss, or incomplete summaries to enter workflows.
              External literature is cautionary: Patient Safety & Quality Healthcare summarizes a JAMA Network Open
              finding that AI-generated discharge summaries were incomplete or misleading in about 18% of cases, while
              Stanford’s 2026 clinical AI review argues that many physician-level claims still rest on narrow benchmarks
              and sparse real-patient evaluation. OpenEvidence can point to citations, licensed content, and a
              Mayo-branded challenge result as mitigating signals, but those are not the same as audited real-world
              outcomes. The deeper operational issue is evidentiary. GLACIS argues that liability rises when health
              systems cannot reconstruct which audio, transcript, model version, and guardrail state produced a given
              output. OpenEvidence’s security page shows credible control hygiene—HIPAA, SOC 2 Type II, encryption, and
              annual penetration tests—but those are platform controls, not proof that encounter-level failures will be
              easy to investigate. Residual risk therefore remains high until real-world error rates, escalation rules,
              and forensic audit trails are independently demonstrated.
            claimRefs:
              - CR012
              - CR013
