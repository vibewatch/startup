  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and adoption base
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence's clearest customer segment is the individual clinician, especially the physician user.
              Access is restricted to verified healthcare professionals, and the web and app-store surfaces repeatedly
              frame the product as a free, self-serve point-of-care tool rather than as software sold first through
              centralized hospital procurement. That framing matters because the headline adoption numbers describe
              usage, not contracted revenue accounts. Official surfaces say more than 40% of U.S. physicians use the
              product daily across more than 10,000 hospitals and medical centers, while NBC reported roughly 65% of
              U.S. doctors and about 650,000 active U.S. physician users in April 2026. Those numbers are large enough
              to establish meaningful physician adoption, but they are still mostly company-defined metrics without a
              public denominator bridge.


              The economic map is therefore multi-sided. Physicians are the primary users and the core acquisition
              wedge. Health systems emerge later in the funnel as institutional buyers or payers once enough clinicians
              already rely on the tool. Pharmaceutical and medical-device advertisers appear to fund the free product
              today, while content partners such as ACOG, Wiley, NEJM, JAMA, NCCN, and Cochrane improve product quality
              but should not be mistaken for customer proof. The result is attractive distribution but messy
              monetization optics: OpenEvidence may have unusually deep physician reach before the public record shows
              comparable visibility into who pays, how much they pay, or how sticky those relationships are.
