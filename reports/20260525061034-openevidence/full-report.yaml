        - Track error rates, source coverage, and institution-level governance outcomes
      - - Free product distribution
        - Ad-supported economics may be weaker than enterprise bundles if usage shifts or ad demand softens
        - Medium
        - Low price helps adoption but does not by itself create lock-in
        - Clarify ad concentration, monetization depth, and enterprise upsell path
      - - Standalone destination UX
        - Hospitals can build internal copilots on OpenAI or Anthropic
        - High
        - General-model entrants reduce build cost and shorten time-to-market
        - Test whether proprietary content and answer quality remain meaningfully better in side-by-side workflows
      - - Drug lookup breadth
        - Micromedex and Epocrates remain sticky for medication safety and formulary workflows
        - Medium
        - A general medical search product may not win pharmacy-specific jobs
        - Assess whether OpenEvidence can displace or merely complement drug-heavy tools
      - - Incumbent procurement inertia
        - UpToDate, DynaMedex, and ClinicalKey already live in enterprise contracts and EHR routines
        - High
        - Institutional switching is slower than consumer AI experimentation
