  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Shows how OpenEvidence lands with individual physicians, then expands into institutional workflows and
      monetization layers.
    data:
      items:
        - id: stage-awareness
          label: 1. Peer discovery
          actor: Individual physician
          description: Doctor discovers OpenEvidence through peers, press, or curiosity about AI-enabled medical search.
          channels:
            - Word of mouth
            - Press coverage
            - App stores
        - id: stage-verification
          label: 2. Verified onboarding
          actor: Individual physician
          description: >-
            Clinician verifies professional status and begins using the mobile app or web interface for point-of-care
            questions.
          channels:
            - NPI / professional verification
            - Mobile app
            - Web app
        - id: stage-habit
          label: 3. Habitual workflow use
          actor: Physician user
          description: >-
            Repeat use grows around treatment questions, guideline recall, and literature summarization, with many
            answers accepted quickly unless something looks surprising.
          channels:
            - Clinical search
            - Literature citations
            - Mobile convenience
        - id: stage-enterprise
          label: 4. System integration
          actor: Health system buyer
          description: >-
            After bottom-up adoption, health systems integrate OpenEvidence into Epic or the EHR and extend access to
            nurses, pharmacists, and therapists.
          channels:
            - Epic / EHR integration
            - Governed rollout
            - Multidisciplinary access
        - id: stage-monetization
          label: 5. Monetization loop
          actor: Advertisers and enterprise buyers
          description: >-
