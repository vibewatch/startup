        title: Deployment model, enterprise integrations, and workflow extensions
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence’s deployment story is increasingly tied to health-system workflow integration rather than
              standalone browser use. Mount Sinai’s March 2026 rollout made the product accessible from within the
              electronic health record across the full clinical care team, explicitly including physicians, registered
              nurses, and pharmacists. Both the OpenEvidence and Hit Consultant descriptions emphasize that the Epic
              embedding solves the “last mile” problem: clinicians can ask medical questions in natural language inside
              the existing Epic workflow and receive answers grounded in peer-reviewed literature and clinical
              guidelines without switching to an external research tool. Cedars-Sinai goes one step further. Its May
              2026 partnership is described as patient-aware clinical intelligence, integrating patient context from
              Epic directly within OpenEvidence so that answers can account for prior procedures, comorbidities,
              medications, allergies, and longitudinal history. Around that core question-answering flow, the company
              has started to productize adjacent workflow extensions: visit transcription, coding support, Voices,
              Messages with consent controls, Fax, and a doctor dialer. That broadens product usefulness, but it also
              raises the burden of proving reliability across many more clinical touchpoints than a pure evidence search
              engine would need to support.
