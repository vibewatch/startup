      - number: '2.2'
        title: TAM, SAM, and SOM — Contradictory Top-Down Estimates and Bottom-Up Lower Bounds
        blocks:
          - type: paragraph
            body: >-
              Public top-down estimates disagree enough that TAM must be presented as a range, not a single slogan. The
              Business Research Company places the global clinical decision support systems market at $3.96 billion in
              2026, versus Fortune Business Insights at $4.45 billion in 2026. Those two numbers are directionally
              similar but still differ by about $0.49 billion, which is large relative to a market of this size and
              reflects different inclusion rules, vendor sets, and geography assumptions. Grand View Research’s 2026
              estimate for the narrower artificial-intelligence-in-CDSS segment is only $1.5 billion, which is not a
              rebuttal to the broader CDSS totals so much as evidence that “medical AI point of care” is a subset nested
              within the larger evidence-and-alert ecosystem. Research and Markets reinforces the same point
              structurally by segmenting CDSS across component, model, delivery mode, application, and end user through
              2035 rather than treating it as a single monolithic SKU.


              For OpenEvidence, a more decision-useful sizing lens is bottom-up and U.S.-centric. BLS reports about
              839,000 physicians, 162,700 physician assistants, and 320,400 nurse practitioners in 2024, or roughly
              1.322 million advanced-clinician seats that regularly make diagnostic or therapeutic decisions. Applying
              publicly posted self-serve price points from Epocrates ($179.99 annually) and AMBOSS ($259 annually)
              yields an evidence-constrained U.S. advanced-clinician spend proxy of roughly $238 million to $342 million
              per year. If the initial commercial wedge is physicians only, the same method gives a physician-first
              lower-bound subsegment of about $151 million to $217 million. That is a conservative SOM proxy rather than
              a total market ceiling: enterprise bundles, governance work, implementation services, and quote-based
              contracts can enlarge realized ACV, but public sources do not support a cleaner institutional-price
              benchmark. The result is a chapter-specific TAM/SAM/SOM stack in which global CDSS is the outer TAM, a
              U.S. advanced-clinician point-of-care seat market is the best-evidenced SAM, and physician-first
              deployment is the clearest initial SOM.
