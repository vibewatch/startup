      - number: '3.3'
        title: Adjacent AI entrants and internal-build substitutes
        blocks:
          - type: paragraph
            body: >
              OpenAI and Anthropic are not curated medical references in the legacy sense, but they are credible
              competitive entrants because they now sell healthcare-specific packaging around general models. OpenAI for
              Healthcare emphasizes transparent citations to peer-reviewed studies, clinical guidelines, and
              public-health sources, plus enterprise controls such as BAAs, audit logs, customer-managed encryption
              keys, and explicit no-training treatment for customer content. Anthropic's healthcare offering is
              similarly pitched as HIPAA-ready and increasingly workflow-native: CMS coverage connectors, ICD-10 and NPI
              lookup, PubMed access, FHIR development help, prior authorization skills, and claims-appeal support. Both
              vendors also publish self-serve pricing rather than forcing every buyer through opaque enterprise
              procurement.


              That combination lowers the barrier for internal build. A health system that already has IT staff,
              governance, and local policy content can increasingly assemble its own clinician copilot on top of a
              foundation model rather than adopt a standalone reference destination. The tradeoff is trust and
              specificity. General models can move faster on connectors, automation, and administrative workflows, but
              they still need grounding, oversight, and institutional guardrails to be clinically acceptable. For
              OpenEvidence, the threat is not that OpenAI or Anthropic become the best disease encyclopedia; it is that
              they make it cheap and administratively convenient for hospitals or workflow vendors to recreate enough of
              the same bedside-search job inside larger systems. 
            claimRefs:
              - CP027
              - CP028
              - CP029
              - CP030
              - CP031
