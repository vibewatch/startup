            title: Regulation is not the main issue today, but it can become the issue tomorrow
            body: >-
              Current FDA guidance leaves room for transparent clinician-facing support tools, yet OpenEvidence is
              explicitly investing in more agentic medical intelligence. If the product drifts from explainable support
              toward prescriptive decisioning, governance and compliance costs can rise faster than valuation bulls
              currently assume.
