      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              The end user is usually the clinician with an urgent question, but the payer varies sharply by contract
              form. Public price pages from Epocrates and AMBOSS show that individual doctors and small groups can still
              buy directly, which matters for bottoms-up adoption because it lowers the friction of initial trial. But
              BLS employment data show that the overwhelming majority of physicians, PAs, and NPs practice inside
              offices, hospitals, and clinics, so scaled revenue still depends on provider organizations rather than
              atomized consumer demand. That makes the real commercial map triangular: the clinician is the user, the
              provider organization or department is usually the payer, and a hybrid of clinical and digital leadership
              acts as buyer and gatekeeper.


              The enterprise budget owner is increasingly not a lone library or education administrator. Healthleaders
              and HIMSS both describe a procurement motion that now runs through CMIO, CIO, chief digital, informatics,
              compliance, and governance committees, especially when AI output touches decision-making or could
              eventually be embedded into the EHR. Physicians themselves expect to participate: 85% of AMA respondents
              want to be consulted or directly involved in adoption decisions. In practice, that creates several
              parallel budget paths. Self-pay and departmental purchases can open the door, academic centers and
              training programs can still sponsor reference access, and large health systems can approve enterprise
              deals when they believe the tool reduces cognitive load, speeds literature synthesis, and meets
              validation, privacy, and oversight expectations. For OpenEvidence, the most realistic early buyer is
              therefore a physician-led or CMIO-backed sponsor whose users are clinicians but whose payer is a practice,
              health system, or training organization.
            claimRefs:
              - CM025
              - CM026
              - CM027
              - CM028
              - CM029
