  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition in physician workflow terms
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence is no longer just a physician search bar. Its public user-guide surface spans quick consults,
              guidelines, prior authorization and paperwork, drug information and safety, clinical-trial recruiting,
              calculators, patient handouts, medical education, inbox management, Deep Consult, DotFlows, Voice Mode,
              Visits, note creation, billing codes, after-visit summary, scheduling, templates, patient Q&A, Voices,
              Dialer, Fax, and Messages. In workflow terms, that means the product aims to sit across three recurring
              jobs: fast bedside evidence retrieval, heavier literature synthesis for complex cases, and adjacent
              documentation/administrative work after the evidence answer is produced. Voice Mode extends the consult
              workflow into hands-free settings such as rounds or walking between patients, while Deep Consult packages
              a longer-form research agent for harder clinical questions. Mobile distribution matters because the
              platform now has native iOS and Android apps that promise the same cited-answer experience as the web
              product, and Google Play explicitly frames the app as point-of-care decision support for verified
              healthcare professionals only.
