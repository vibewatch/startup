        title: Differentiation, roadmap, and technical risk map
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence’s differentiation is not a disclosed novel model architecture so much as a workflow-native
              evidence stack: it puts licensed peer-reviewed literature and guideline content directly into clinician
              workflows, then layers cited answers, voice, patient-aware EHR context, and documentation utilities on
              top. That shows up in the product roadmap visible in public materials: HIPAA and mobile apps in 2025, NCCN
              and broader oncology guideline licensing late in 2025, Coding Intelligence in March 2026, DotFlows in
              April 2026, and patient-aware Cedars plus Voice Mode by May 2026. Scale claims are large — over 40% of
              U.S. physicians, more than 10,000 hospitals and medical centers, 860,000 clinicians, and a one-day
              milestone of one million physician-AI consultations — but the main technical diligence questions are about
              downside cases. First, hallucination risk does not disappear just because the evidence corpus is high
              quality; broader medical-LLM research still finds patient-harm risk when reasoning fails. Second,
              explainability remains incomplete even in cited or RAG-like systems because references do not by
              themselves prove causal faithfulness of the generated answer. Third, coverage breadth depends on the
              continuity of publisher and society licenses. Fourth, public evidence on uptime, latency, and complex-case
              benchmark performance remains materially thinner than the adoption narrative.
