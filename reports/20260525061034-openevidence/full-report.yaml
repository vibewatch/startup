chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Product Model
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence is a Miami-based medical AI company whose clinician-facing platform emerged in 2023 after the
              business was founded in 2022 by Daniel Nadler and Zachary Ziegler. The company presents itself as a
              medical knowledge platform and AI copilot for high-stakes point-of-care decisions rather than as a
              general-purpose chatbot. That distinction matters to its go-to-market story: OpenEvidence says it grounds
              answers in peer-reviewed medical literature, cites the underlying sources, and trains on licensed medical
              content instead of the open internet. The product surface now spans the core Ask experience, Visits for
              encounter capture and note generation, Voice Mode for hands-free question answering, and DeepConsult for
              longer-form agentic research. Core access remains free for verified U.S. clinicians, which has helped
              distribution, but the free model is underwritten by advertising. The result is a platform that looks more
              like workflow infrastructure than a single search tool, but whose commercial durability still depends on
              physician trust in both answer quality and monetization guardrails.
