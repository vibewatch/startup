        title: Privacy, access control, and public trust posture
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence’s clearest public trust commitments are around HIPAA handling, clinician gating, and
              user-controlled sharing. The company announced full HIPAA compliance in April 2025 and says covered
              entities that input PHI do so under a Business Associate Agreement. It also states that conversations are
              private by default and that a Share button lets users control access to conversations. On the access side,
              the Google Play listing says the product is only available to healthcare professionals and requires user
              verification before use. Those controls matter because the product increasingly moves from generic
              literature search into patient-aware and documentation-adjacent workflows where PHI, communication
              channels, and draft operational outputs are in scope. What is less visible is the deeper technical trust
              stack an enterprise buyer would typically request: public uptime commitments, latency targets, status
              history, third-party security architecture detail, or external audit evidence on citation faithfulness
              once patient context and workflow automation are layered on top. The public posture is therefore stronger
              on policy controls and source-grounding than on independently auditable operational transparency.
