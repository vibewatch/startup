  - id: TM001
    title: Market definition table
    columns:
      - Layer
      - Included spend
      - Excluded or adjacent spend
      - Typical buyer/payer
      - Why it matters
    rows:
      - - Core market — clinician-facing point-of-care CDS
        - >-
          Evidence databases, AI-assisted clinical Q&A, drug/guideline lookup, recommendation layers used by clinicians
          during care
        - None — this is the core category
        - Clinician user; payer may be individual, department, or provider organization
        - This is the market OpenEvidence is actually entering
      - - Embedded workflow CDS
        - EHR-integrated alerts, order guidance, and decision-support modules delivered inside clinical workflows
        - Standalone EHR platform spend not attributable to decision support
        - Health system or medical group
        - Important for enterprise expansion because workflow fit matters more than novelty
      - - Status-quo substitutes
        - UpToDate, DynaMed, Epocrates, AMBOSS, PubMed/free web search, colleague consults
        - None — these substitutes define the incumbent behavior to displace
        - Individual clinician, library, GME, or health system
        - OpenEvidence competes first against existing question-answer habits, not against a blank slate
      - - Excluded — device-like or patient-facing AI
        - None unless explicitly sold as clinician CDS
        - >-
          Patient-facing symptom tools, imaging or signal-analysis software functions that remain device-regulated,
          caregiver tools
        - Consumer, device budget, or regulated device buyer
        - These categories inflate generic health-AI TAM but are not the same procurement motion
      - - Adjacent — documentation and coding automation
        - Only the portion that also provides clinician evidence or treatment support
        - Ambient scribing, coding optimization, revenue-cycle AI without point-of-care knowledge retrieval
        - Operations, revenue cycle, or administrative budgets
        - Useful adjacency, but not the cleanest benchmark for OpenEvidence core market sizing
    notes: >-
      Boundary logic relies on AHRQ and FDA definitions, then adds observed substitute behavior from clinician survey
      literature and incumbent vendor product positioning. Included and excluded rows are category judgments, not
      audited accounting classes.
