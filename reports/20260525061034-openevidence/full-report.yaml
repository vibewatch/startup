      - number: '1.2'
        title: Founders, Leadership, and Governance Visibility
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence is unmistakably founder-led. Daniel Nadler remains the public face of the company and is
              repeatedly identified as founder and CEO, while Zachary Ziegler is the co-founder most closely associated
              with the platform’s AI research pedigree. Nadler’s prior company, Kensho, gave him credibility with both
              investors and enterprise buyers before OpenEvidence existed; S&P Global’s 2018 acquisition of Kensho also
              established him as a repeat founder with a large AI exit. The current public record is much thinner on
              formal governance than on technical or commercial momentum. The official site prominently lists an
              unusually broad medical-advisor network across major U.S. health systems and academic centers, which
              strengthens clinical credibility, but retained materials do not disclose the board composition, investor
              observer rights, or control architecture. That asymmetry creates real diligence risk: advisory depth helps
              validate product direction, yet key-person dependence on Nadler still appears high because he anchors
              fundraising, media narrative, and platform positioning at the same time.
