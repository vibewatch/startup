      - number: '6.3'
        title: Satisfaction, repeat use, and retention visibility
        blocks:
          - type: paragraph
            body: >-
              Satisfaction and repeat-use proxies are positive but incomplete. The App Store shows a 4.9 rating from
              roughly 10,000 ratings, and AppBrain reports a 4.80 rating from 3,706 reviews plus substantial Android
              download volume. Named physician testimonials are enthusiastic, and NBC's reporting suggests doctors use
              the product for real point-of-care questions rather than only for curiosity or study. These signals
              support the view that OpenEvidence has habit-forming utility for a meaningful cohort of clinicians. They
              do not, however, substitute for retention reporting. Public sources do not disclose NRR, GRR, churn,
              renewal rates, contract length, or cohort behavior for either self-serve clinicians or enterprise
              accounts.


              The adverse side of the record is important because mass adoption can conceal shallow engagement or
              quality risk. Trustpilot's archived page is harsh, with a 1.6 rating centered on complaints about outdated
              ME/CFS guidance, and NBC documented clinician concerns about hallucinations, overconfident synthesis,
              privacy guardrails, and skill erosion among trainees. NBC also noted that some users only click through
              citations when an answer looks unusual, implying that routine reliance can outrun systematic verification.
              The right read is not that OpenEvidence lacks real customer value; the usage footprint is too large for
              that. The right read is that public evidence supports usefulness and satisfaction proxies, while leaving
              durability, quality control, and long-term retention materially under-disclosed.
