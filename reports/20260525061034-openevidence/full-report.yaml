            body: >-
              Public materials describe OpenEvidence less as a general-purpose model company and more as an
              evidence-delivery layer built around licensed medical content plus clinician verification. The homepage
              and partner announcements show a steadily expanding corpus: NEJM Group content and multimedia from 1990
              forward, full text and multimedia from JAMA and its specialty journals, NCCN oncology guidelines plus
              JNCCN content, and Wiley’s broader portfolio including Cochrane systematic reviews, Cochrane Clinical
              Answers, and hundreds of journals and books. Wiley’s own announcement makes the operating principle
              unusually explicit: “gold in, gold out,” with specialized models trained on peer-reviewed literature
              rather than the open internet and every answer grounded in sources a physician can drill into and verify.
              That is the core product architecture OpenEvidence is willing to disclose publicly: clinician question in,
              licensed evidence corpus plus model synthesis in the middle, and a cited answer out. The same verification
              model appears in Voice Mode, where spoken answers keep a written transcript and references alongside them,
              and in NCCN’s collaboration, which emphasizes source documentation and links back to the underlying
              guideline material.
