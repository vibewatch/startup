      - number: '3.4'
        title: Switching costs, moat durability, and adverse evidence
        blocks:
          - type: paragraph
            body: >
              The evidence supports a nuanced moat view. OpenEvidence has a real trust edge from official content
              partnerships, clinician-focused positioning, and published HIPAA/SOC 2 controls. That matters because FDA
              guidance for non-device clinical decision support still centers on clinician reviewability:
              recommendations must support, not replace, judgment, and users must be able to independently review the
              basis for the answer. OpenEvidence's citation-heavy design is directionally aligned with that requirement,
              and UpToDate Expert AI makes the same point by exposing assumptions and source rationale. In other words,
              provenance is a competitive requirement, not just a product feature.


              But the adverse evidence is equally clear. Doximity Ask's own FAQ says outputs may include inaccuracies
              and should always be verified, while academic literature still frames hallucination as a live
              patient-safety issue even in retrieval-augmented systems. MDPI's on-premises RAG study shows mitigation is
              possible but still requires provenance tagging, audit trails, and verification layers. That makes
              commoditization risk highest where the workflow can tolerate "good enough" grounded answers and where a
              larger platform can subsidize distribution. OpenEvidence's moat looks most durable in licensed content
              access and clinician mindshare, but least durable in generic Q&A mechanics, because Doximity can bundle,
              incumbents can extend existing contracts, and general-model vendors can keep pushing the build-versus-buy
              frontier toward hospitals and other workflow owners. 
