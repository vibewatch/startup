  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              For OpenEvidence, the relevant market is not “all healthcare AI” and not even every category of clinical
              software. AHRQ defines clinical decision support as timely information, usually at the point of care, that
              helps inform decisions about a patient’s care; examples include recommendations, databases, reminders, and
              alerts. FDA’s clinical decision support guidance then sharpens the commercial boundary by distinguishing
              certain clinician-facing non-device CDS software functions from device-regulated software functions,
              especially where the latter are aimed at patients or otherwise remain inside FDA digital health oversight.
              In practical spend terms, that means the market includes clinician-facing knowledge subscriptions,
              evidence databases, AI-assisted clinical question answering, and EHR-embedded recommendation layers, but
              it excludes large swaths of ambient documentation, patient-facing symptom triage, pure coding or
              revenue-cycle tools, and imaging/signal analysis products unless they are sold as clinician decision
              support at the bedside or in the consult workflow.


              The status quo is also broader than a single incumbent vendor. Clinicians often answer questions through
              online databases, free internet search, and colleagues before they adopt a new specialized tool, while
              UpToDate and DynaMed set the reference-standard expectation for fast, literature-backed answers integrated
              into mobile and EHR workflows. Epocrates and AMBOSS demonstrate that parts of the category remain viable
              as self-serve or small-group subscriptions, and newer AI-native products such as Glass Health and Pathway
              show that the substitute set now includes LLM-shaped interfaces as well as traditional reference
              libraries. For market-definition purposes, OpenEvidence therefore sits inside a clinician-trust and
              workflow category whose buyer already expects cited evidence, quick retrieval, and low-friction deployment
              rather than a consumer-chat experience.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
