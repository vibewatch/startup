      - number: '8.4'
        title: Recommendation, exit readiness, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The evidence-backed recommendation is research-more rather than buy. OpenEvidence looks like a real
              company with real adoption, but the current private price already assumes that the company will convert
              usage into durable, high-quality revenue at a scale that public evidence does not yet document. In
              practical terms, today's mark resembles a forward claim on future enterprise monetization, future
              advertiser durability, and future regulatory resilience. That can still work, but it makes entry
              discipline critical. Investors should treat the company as a track-or-underwrite-later opportunity unless
              a diligence process can close the biggest gaps: audited revenue and gross margin, advertiser concentration
              and retention, signed enterprise integrations, cap-table preference overhang, and clinical quality
              governance. Exit readiness is therefore conditional rather than proven. OpenEvidence may become IPO-ready
              if it turns adoption into disclosed recurring economics and maintains trust with content and regulatory
              stakeholders, but public evidence as of 2026-05-25 is not yet enough to underwrite that outcome at the
              current valuation without nonpublic diligence.
