            body: >-
              A free, ad-supported physician product can scale quickly, but public evidence still does not show
              advertiser concentration, renewal quality, or how much enterprise revenue actually exists. That opacity
              matters because the current valuation assumes monetization quality that public evidence has not yet fully
              demonstrated.
