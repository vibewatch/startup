      - number: '3.2'
        title: Incumbent evidence tools and status-quo substitutes
        blocks:
          - type: paragraph
            body: >
              The status quo substitute for many clinicians is still a stack of curated references rather than a single
              AI answer engine. Wolters Kluwer's UpToDate markets individual, group, and enterprise suites trusted by
              more than 3 million health professionals, and its Expert AI launch explicitly wraps generative AI around
              expert-authored, peer-reviewed UpToDate content with transparent source and rationale links. DynaMedex
              similarly combines DynaMed disease evidence with Micromedex drug evidence and has leaned on KLAS
              recognition plus expansion of Dyna AI into medication dosing and safety. Elsevier's ClinicalKey AI,
              Micromedex, and Epocrates each cover adjacent slices of the same job-to-be-done: quick evidence retrieval,
              drug safety, guideline lookup, and workflow-safe reference access.


              This matters because switching costs in institutional medicine are not just about answer quality.
              Incumbents already sit inside EHR links, CME routines, formulary workflows, procurement budgets, and
              hospital library contracts. They also defend narrower but sticky use cases. Micromedex's drug
              interactions, toxicology, and RED BOOK pricing data are specialized enough that a general AI copilot does
              not automatically displace them. Epocrates is cheaper and lighter-weight, making it a practical substitute
              for drug and guideline lookup even if it is not a full encyclopedic evidence tool. OpenEvidence therefore
              competes not only with "better search" but with established clinical habits that mix trusted references,
              operational drug databases, and local policies. 
