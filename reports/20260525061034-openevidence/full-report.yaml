      - number: '8.2'
        title: Comparable set and monetization discipline
        blocks:
          - type: paragraph
            body: >-
              The best public benchmark is not a generic SaaS basket but a narrow set of physician workflow, clinical
              software, and healthcare AI names. Doximity is the closest public monetization analog because it combines
              a physician network with advertising economics; at roughly 5.8x revenue and about $3.64 billion of market
              cap, it still sits far below OpenEvidence's private mark despite better disclosure. Tempus AI and Veeva
              demonstrate that public markets will pay 6-8x revenue for scaled healthcare AI or clinical software
              franchises with much larger revenue bases. Lower-multiple workflow names such as Phreesia and Health
              Catalyst remind investors how quickly health-IT multiples compress when growth slows or product
              differentiation weakens. Sacra's description of premium physician-ad CPMs and roughly $124 ARPU explains
              why the ad model can be attractive, but it also highlights a core underwriting problem: public evidence
              does not yet show advertiser concentration, renewal quality, or the mix between ad revenue and any
              enterprise contracts. On disclosed fundamentals, the current $12 billion mark looks well ahead of the
              public comp band and therefore requires private-scarcity and hypergrowth assumptions that are not yet
              fully de-risked by public evidence.
