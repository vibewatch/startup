  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor
      - Category
      - Scale / funding signal
      - Target segment
      - Differentiation
      - Limitation / risk
    rows:
      - - OpenEvidence
        - Direct AI clinical search
        - $12B Series D valuation; roughly $700M raised over prior 12 months; >200M clinician consultations to date
        - Verified clinicians seeking fast bedside evidence lookup
        - Licensed journal/guideline partnerships plus citation-linked answers and free access
        - Ad-supported model and no obvious paid-seat lock-in; must defend against bundling and internal build
      - - Doximity Ask (+ Pathway)
        - Direct AI clinical reference + workflow bundle
        - '>80%-85% of U.S. physicians on Doximity; Pathway bought for $63M'
        - Verified U.S. clinicians already using Doximity workflow tools
        - Free Ask product bundles Pathway corpus with Scribe and Dialer
        - Could monetize enterprise later, but current free bundle compresses category pricing
      - - Glass Health
        - Direct AI CDS / ambient scribing peer
        - Early-stage private product with limited public scale disclosure on fetched pages
        - Clinicians wanting AI note-taking plus CDS
        - Official positioning spans ambient scribing and clinical decision support
        - Thin public pricing and trust detail compared with larger rivals
      - - UpToDate Expert AI
        - Incumbent curated evidence tool with GenAI
        - UpToDate trusted by >3M health professionals; Wolters Kluwer 2024 revenue €5.9B
        - Hospitals, groups, and individual clinicians already standardized on UpToDate
        - Expert-authored content, source/rationale links, enterprise deployment, CME and EHR presence
        - Quote-heavy enterprise packaging and slower product surface than consumer AI tools
      - - DynaMedex
        - Incumbent curated evidence tool with AI layer
        - Best in KLAS 2026; combines DynaMed and Micromedex
        - Care teams needing disease plus drug evidence in one workflow
        - Dyna AI plus integrated dosing and medication safety from Micromedex
        - Public pricing remains opaque; distribution rides enterprise/library channels
      - - ClinicalKey AI
        - Enterprise evidence suite
        - Elsevier enterprise product; public pages emphasize organization-wide deployment
        - Hospitals, clinicians, pharmacists, students
        - Responsible AI over trusted books, journals, guidelines, and EHR integration
        - Less self-serve and less obviously physician-networked than Doximity or OpenEvidence
      - - Micromedex
        - Drug-heavy substitute / adjunct
        - Trusted in >80 countries
        - Pharmacy, toxicology, medication safety, formulary teams
        - 2,500+ monographs, 700+ calculators, toxicology, RED BOOK pricing
        - Narrower bedside-answer scope than a general clinical search tool
      - - Epocrates+
        - Lightweight substitute
        - $24.99/month or $179.99/year
        - Individual clinicians focused on drug info, ICD-10, interactions, and guidelines
        - Cheap, self-serve, familiar mobile workflow
        - Not a broad evidence synthesis platform
      - - OpenAI internal build
        - Likely entrant / build substrate
        - Published API pricing; named hospital rollouts for ChatGPT for Healthcare
        - Health systems and vendors building their own copilots
        - Transparent citations, BAAs, customer-managed encryption keys, templates, APIs
        - Does not own the clinical reference destination or exclusive medical content
      - - Anthropic internal build
        - Likely entrant / build substrate
        - Published seat and API pricing; HIPAA-ready healthcare offering
        - Payers, providers, startups, and enterprises building workflow agents
        - CMS / ICD-10 / NPI / PubMed connectors and FHIR-oriented workflows
        - General model still needs grounding and governance to be clinically trusted
    notes: >-
      Rows retain the most decision-relevant direct peers, incumbents, substitutes, and likely entrants observable from
