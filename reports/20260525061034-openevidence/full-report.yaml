      - number: '8.3'
        title: Bull, base, and bear framing
        blocks:
          - type: paragraph
            body: >-
              The bull case is not hard to imagine; it is simply demanding. OpenEvidence already appears to have
              exceptional physician reach, unusually strong publisher partnerships, and a funding market still willing
              to pay for category leadership in healthcare AI. If that adoption stays above 40% of U.S. physicians,
              revenue roughly doubles again, and the company layers durable enterprise or workflow monetization on top
              of advertising, the current $12 billion valuation could prove defensible. The base case is less generous.
              In the base case, OpenEvidence remains important and fast growing, but monetization normalizes faster than
              usage, public-style multiples matter more, and investors wait for audited quality before paying further
              step-ups. The bear case centers on a simple mismatch: ad-supported clinical search can be a valuable
              product without being worth an 80x revenue multiple. Competitive pressure, advertiser hesitation, or a
              tighter regulatory reading on agentic medical assistance would not erase the product, but they could
              compress valuation sharply. That is why the thesis and anti-thesis must be framed as price-sensitive, not
              just company-quality-sensitive.
