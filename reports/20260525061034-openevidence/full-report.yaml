      - number: '1.3'
        title: Capital Formation and Investor Map
        blocks:
          - type: paragraph
            body: >-
              OpenEvidence’s financing curve has been unusually steep even by 2025-2026 AI standards. The company moved
              from a Sequoia-led Series A at a $1 billion valuation in February 2025 to a $3.5 billion Series B in July,
              a $6 billion Series C in October, and a $12 billion Series D in January 2026. Each round added another
              layer of sponsor quality: Sequoia anchored institutional entry, GV and Kleiner Perkins co-led the Series
              B, and Thrive plus DST led the Series D. The company’s own disclosures describe roughly $700 million
              raised over the prior twelve months, while CNBC’s May 2026 Disruptor profile lists $795.4 million of total
              funding. Those figures are not necessarily contradictory, but they are not yet reconciled in public
              materials either. What is clear is that OpenEvidence now has a cap-table narrative built around elite
              venture sponsors, strategic healthcare signaling from Mayo Clinic, and repeated follow-on participation
              that implies investors view adoption data as unusually credible.
