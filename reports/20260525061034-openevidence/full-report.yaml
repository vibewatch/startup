  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Observable threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Revenue quality miss
        - Audited revenue or renewals arrive materially below what management commentary implies for late 2025 or 2026.
        - Breaks the case that current adoption is converting into premium-quality economics.
        - Stop underwriting the current mark and reset to a downside case.
      - - Physician engagement stall
        - Daily physician share or consultation growth stops compounding for multiple quarters.
        - Weakens the central claim that OpenEvidence is becoming the default clinician workflow.
        - Treat the company as a niche tool, not a category leader.
      - - Ad or partner backlash
        - Major advertiser, publisher, or medical-society relationship is impaired by trust or conflict concerns.
        - Hits both monetization durability and the content moat simultaneously.
        - Assume lower growth and higher governance cost.
      - - Regulatory tightening
        - >-
          FDA, state, or professional-governance posture narrows the room for agentic clinical assistance or requires
          heavier controls.
        - Raises compliance cost and slows product expansion into higher-value workflows.
        - Delay underwriting until product boundary and compliance posture are clear.
      - - Markup reset
        - Next financing or secondary reference clears materially below $12B.
        - Confirms that current private marks were ahead of disclosure and market support.
        - Revalue using public-comp and downside-case discipline.
    notes: These are measurable kill criteria designed for investment discipline rather than general operating risks.
    claimRefs:
      - CV036
      - CV038
      - CV043
      - CV048
      - CV049
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Audited revenue and gross margin
        - Audited FY2025 and latest run-rate revenue, gross margin, and advertiser-adjusted contribution margin.
        - >-
          The current mark is impossible to underwrite cleanly without knowing whether monetization quality matches
          usage quality.
        - Request audited financials and cohort revenue bridge from CFO and lead investors.
      - - Advertiser concentration and renewals
        - Top customer concentration, average contract length, pricing power, and renewal retention.
        - The ad-supported model is the biggest unproven driver between a premium outcome and a reset.
        - Request top-10 advertiser mix, renewal cohorts, and policy around sponsor separation from answers.
      - - Enterprise monetization depth
        - Signed health-system, payer, or EHR contracts and pipeline beyond ads.
        - A credible non-ad layer is the cleanest path to defend a premium multiple over time.
        - Request executed contracts, implementation timelines, and enterprise ARR bridge.
      - - Clinical quality governance
        - Model QA metrics, hallucination escalation process, human review design, and incident logs.
        - Regulatory and trust durability matter more once valuation depends on deeper workflow integration.
        - Review governance committee materials, quality dashboards, and red-team results.
      - - Cap table and liquidity overhang
        - Preference stack, liquidation waterfalls, board rights, and secondary history.
        - A high private mark can still be unattractive if preference overhang impairs common or late-entry returns.
        - Request full cap table, financing terms, and any recent secondary clearing prices.
      - - Retention and specialty depth
        - Retention by specialty, hospital type, and cohort vintage.
        - The bull case requires durable habit formation, not one-time trial usage.
        - Request user cohort analytics and specialty penetration trendlines.
    notes: These asks are prioritized by what would most directly change the valuation view at the current price.
    claimRefs:
      - CV043
      - CV047
      - CV048
      - CV049
      - CV050
