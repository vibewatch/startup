  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and direct peers
        blocks:
          - type: paragraph
            body: >
              OpenEvidence is not competing against a single comparable product. The closest direct overlap is with
              AI-native clinical reference tools that promise fast answers at the bedside, but the category quickly
              widens into adjacent physician workflow bundles and incumbent evidence products that are now grafting
              generative AI onto curated content. OpenEvidence itself frames the product around citation-linked answers
              from licensed journals and guidelines, while Doximity markets a free Ask product that now absorbs
              Pathway's reference corpus into a broader physician workflow suite. Glass Health is also a direct peer,
              though its public surface positions it more lightly around ambient scribing plus clinical decision support
              than around a broad hospital platform.


              The direct-peer evidence matters because price and distribution are already diverging. OpenEvidence
              remains free to clinicians and ad-supported, and Pathway's formerly paid premium tier was folded into
              Doximity Ask after Doximity acquired the company for $63 million. That combination turns a once-separate
              paid clinical reference product into a free feature inside a network that Doximity says reaches more than
              80% to 85% of U.S. physicians. For OpenEvidence, that means the near-term fight is less about proving that
              clinicians want AI search and more about whether a standalone destination can hold attention once larger
              workflow platforms decide to bundle similar reference capabilities at zero marginal price.  
