        - Premium physician ad pricing and free access can scale quickly without hospital procurement friction.
        - Ad dependence creates concentration, ethics, and cyclicality risk that public disclosures do not yet quantify.
        - Disclose advertiser concentration, renewal, and non-ad revenue mix.
      - - Comparable support
        - Private medical-AI scarcity and public AI enthusiasm explain some premium to public health-tech comps.
        - >-
          The disclosed multiple remains far above the public comp band and even above many AI-health peers on known
          fundamentals.
        - >-
          Show revenue growth and margins strong enough to compress the implied multiple toward a more defensible
          forward number.
