summary:
  headline: >
    OpenEvidence has built unusually strong clinician adoption and a genuine premium-content moat, but the January 2026
    $12 billion valuation runs far ahead of public evidence on revenue quality, advertiser durability, enterprise depth,
    and governance disclosure.
  overallScore: 6.4
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: expensive
