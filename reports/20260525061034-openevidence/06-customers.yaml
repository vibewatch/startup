- id: TU001
  title: Customer segmentation table
  notes: Rows distinguish user, buyer, payer, and partner roles. Revenue value refers only to what the public record supports; blanks on spend and renewal are real diligence gaps, not omitted analysis.
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Scale / proof
  - Revenue or strategic value
  - Gap
  rows:
  - - Self-serve physicians
    - 'User: physician; buyer: self-serve clinician; payer: usually not disclosed'
    - Point-of-care evidence search, treatment options, guideline recall, study support
    - Official 40%+ daily claim; NBC 65% / ~650k active U.S. doctors
    - Primary distribution wedge and strongest adoption proof
    - No public paid conversion, churn, or specialty mix by physician cohort
  - - Multidisciplinary care teams in enterprise systems
    - 'Users: physicians, nurses, pharmacists, therapists; payer: health system'
    - Embedded clinical decision support inside EHR workflows
    - Cedars-Sinai and Mount Sinai deployments
    - Shows path from physician-led adoption to institutional budget lines
    - Seat counts and contracted economics are not public
  - - Health systems / hospitals
    - 'Buyer and payer: health system; user: care team'
    - Enterprise licensing, governance, and workflow integration
    - Cedars-Sinai, Mount Sinai, and secondary Sutter proof
    - Potentially higher-value monetization tier than ad-supported self-serve
    - Public roster is small and renewal data absent
  - - Medical societies and journals
    - Partner, not customer
    - Licensing or supplying clinical content and guidelines
    - ACOG, Wiley, NEJM, JAMA, NCCN, Cochrane
    - Improves trust, specialty depth, and workflow relevance
    - These logos are partner proof, not customer proof
  - - Pharma and device advertisers
    - Payer / sponsor, not end-user
    - Advertising against clinician attention during clinical research workflows
    - NBC, Sacra, and App Store advertising disclosure
    - Current monetization engine for free physician access
    - Top-sponsor concentration and repeat-spend retention are undisclosed
  - - Future life-sciences / enterprise adjacencies
    - Potential payer
    - Higher-value workflow, analytics, or specialty products
    - Sacra and STAT frame enterprise expansion as the next phase
    - Could diversify revenue beyond ads if contracted
    - Current evidence is directional rather than customer-proof
