- id: TU005
  title: Expansion and concentration risk table
  notes: Expansion rows reflect public go-to-market evidence. Risk rows emphasize where the public record stops short of proving durable economics.
  columns:
  - Expansion driver
  - Concentration / durability risk
  - Impact
  - Diligence path
  rows:
  - - Land individual physicians through free self-serve access
    - High usage may not convert into paid durability
    - Creates fast distribution and usage depth before procurement
    - Request conversion from heavy clinician usage into enterprise deals or sponsor spend
  - - Upsell health systems after clinician pull-through
    - Public enterprise roster is still small and economics are opaque
    - Could materially raise ARPU and switching costs if real
    - Request pipeline, seat counts, and booked enterprise revenue by system
  - - Expand beyond physicians to nurses, pharmacists, and therapists
    - Role expansion may deepen workflow dependence but complicates adoption denominators
    - Broadens user base and makes enterprise budgets easier to justify
    - Request active-user mix by role and workflow
  - - Deepen specialty utility through ACOG, Wiley, NEJM, JAMA, NCCN, and Cochrane
    - Partner logos may be mistaken for paying-customer validation
    - Raises trust and specialty coverage, supporting more workflows
    - Separate partner economics from customer economics in diligence
  - - Ad-supported model funds free access
    - Top sponsor concentration and repeat-spend retention are undisclosed
    - Could be very profitable, but advertiser dependence may create volatility
    - Request top-10 advertiser share, renewal curves, and CPM trend by vertical
  - - Bottom-up adoption bypasses procurement cycles
    - Bypassing procurement also bypasses early contractual lock-in
    - Explains speed of adoption and shadow usage
    - Request clinician cohort retention and enterprise renewal once contracts are in place
