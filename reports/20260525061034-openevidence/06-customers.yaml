- id: named-customer-and-user-proof
  title: Named customer and user proof
  body: |-
    Public customer proof is real, but it is uneven. The strongest organizational proof comes from named health-system deployments. Cedars-Sinai has disclosed a patient-aware enterprise implementation that lets physicians, nurses, pharmacists, and therapists query the literature in the context of a specific patient's EHR data, while Mount Sinai has disclosed a seven-hospital Epic deployment for physicians, nurses, and pharmacists and described it as OpenEvidence's first enterprise agreement with a health system. Secondary coverage also points to Sutter Health integrating OpenEvidence into Epic workflows earlier in 2026, although the public source trail is thinner than for Cedars-Sinai or Mount Sinai. Taken together, those three systems show OpenEvidence can move beyond personal-device usage into governed institutional workflows.

    Named individual user proof is also visible, though it is lower quality than enterprise deployment proof. Official testimonials from Dr. John Lee, Dr. Ram Dandillaya, and Dr. Antonio Jorge Forte all describe repeat clinical value, and NBC's reporting adds independent physician voices such as Paul Sax and Jeremy Cauwels. Still, the evidence quality boundary matters. Named physician quotes prove product usefulness; they do not prove account revenue, contract scope, or renewal. Likewise, journal and society deals with ACOG and Wiley demonstrate content depth and distribution relevance, but they are partner proof rather than customer proof. The chapter therefore treats hospital deployments and attributed physician testimonials as the main customer evidence, while explicitly separating partner announcements from paying-customer evidence.
