  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: enterprise-renewal
    missingEvidence: Seat counts, contract lengths, renewal terms, and deployment penetration for Cedars-Sinai, Mount Sinai, and Sutter Health.
    whyItMatters: Without contract scope and renewal data, named deployments prove adoption but not durable revenue quality or concentration.
    diligencePath: Request master service agreement summaries, contracted seat counts, and go-live versus active-seat data for each named system.
    relatedQuestionRefs:
    - QU026
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Revenue split between pharmaceutical/device advertising and enterprise contracts, plus top-advertiser concentration.
    whyItMatters: The underwriting risk changes materially if revenue is concentrated in a handful of sponsors or if enterprise revenue is still immaterial.
    diligencePath: Ask management for trailing-twelve-month revenue by channel, top-10 sponsor share, and enterprise ARR by system.
    relatedQuestionRefs:
    - QU023
    - QU027
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: A fuller list of named health-system deployments and named clinician references with start dates, scope, and outcomes.
    whyItMatters: The public record has enough named proof to establish real usage, but not enough to characterize the full installed base or concentration.
    diligencePath: Ask for a reference list of top 20 customer accounts and a split between self-serve, system, and specialty-program usage.
    relatedQuestionRefs:
    - QU010
    - QU015
    relatedTableRefs:
    - TU003
  - type: conflicting-data
    severity: material
    topic: adoption-denominators
    missingEvidence: A reconciled dashboard defining active users, daily users, consultations, hospitals, and medical-center penetration with audited denominators.
    whyItMatters: The chapter relies on several company-linked adoption statistics that are directionally similar but not defined in a common way.
    diligencePath: Request DAU, WAU, MAU, unique clinicians, clinician specialty mix, and organization-count methodology for the same reporting period.
    relatedQuestionRefs:
    - QU003
    - QU004
    - QU025
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Clinician cohort retention, enterprise renewal, NRR, GRR, and churn by product tier.
    whyItMatters: Massive self-serve usage does not automatically translate into durable monetization or low churn, especially for a free product.
    diligencePath: Request cohort tables by signup quarter, enterprise logo retention, and advertiser repeat-spend retention.
    relatedQuestionRefs:
    - QU017
    - QU018
    - QU024
    relatedTableRefs:
    - TU004
    - TU005
