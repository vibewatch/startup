- id: expansion-loops-and-concentration-risk
  title: Expansion loops and concentration risk
  body: |-
    OpenEvidence's expansion logic is credible. The platform appears to land through free physician adoption, deepen usage via mobile and point-of-care workflows, then move into enterprise system integrations that broaden access to nurses, pharmacists, therapists, and other care-team roles. Content partnerships with ACOG, Wiley, NEJM, JAMA, NCCN, and Cochrane expand specialty relevance and make the product more useful in governed clinical settings. If that pattern continues, OpenEvidence can move from an ad-funded reference tool toward higher-value institutional contracts and broader workflow ownership inside the EHR.

    The risk is that the public record stops short of showing whether that expansion is economically durable or concentrated. Sacra and STAT both describe an ad-supported business that now wants formal health-system relationships, but neither the reviewed official sources nor the press coverage disclose advertiser concentration, enterprise revenue share, top-customer exposure, or contract renewals. Free adoption may make the funnel look stronger than it is economically because it bypasses procurement friction without proving willingness to pay or long-term retention. That leaves two open underwriting questions: whether enterprise deployments are large enough to diversify the model beyond advertisers, and whether the advertiser base itself is broad enough to avoid concentration risk. Until management shares cohort and channel data, the upside case is plausible, but the durability case remains under-evidenced.
