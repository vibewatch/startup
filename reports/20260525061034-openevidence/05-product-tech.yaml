    rows:
      - - Core Ask / Clinical Consult
        - Physicians and other verified clinicians
        - GA; core product surface
        - Natural-language clinical Q&A with cited answers grounded in licensed medical evidence
        - No public latency benchmark or citation-faithfulness audit for complex cases
      - - Deep Consult
        - Physicians handling complex research questions
        - GA; documented in user guide
        - Advanced agent that generates long-form research reports instead of single-turn answers
        - No public disclosure of completion time, model routing, or failure rate
      - - Voice Mode
        - Mobile and web clinicians on rounds / between patients
        - GA in 2026
        - Hands-free speech workflow with written transcript and references preserved in-session
        - No public accuracy benchmark for speech input or noisy clinical settings
      - - Visits / documentation and coding workflow
        - Physicians and care teams documenting encounters
        - Expanding; visit transcription and coding publicly described in 2026
        - Combines visit workflow with CPT, E/M rationale, and ICD-10 generation at visit completion
        - Public materials do not show independent billing-accuracy validation or denial impact
      - - Messages / Fax / Dialer utilities
        - Practices managing patient follow-up and communications
        - Expanding; surfaced in 2026 user guide and press coverage
        - Keeps patient messaging and document flow inside the same clinician workbench; Messages adds consent controls
        - Public detail on audit logs, retention, and delivery reliability is limited
      - - Enterprise Epic deployments
        - Hospital clinicians, including nurses and pharmacists
        - Production enterprise rollouts at Mount Sinai and Cedars-Sinai
        - Embeds evidence search inside Epic; Cedars adds patient-aware context within the OpenEvidence experience
        - Public materials do not disclose SLA terms, implementation timelines, or usage-outcome deltas by site
    notes: >-
      Rows reflect publicly documented product surfaces only. Several capabilities are grouped because the company
      exposes them as adjacent workflow features rather than as separately priced SKUs in public documentation.
