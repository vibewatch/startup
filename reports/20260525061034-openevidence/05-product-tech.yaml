  - id: TE002
    title: Workflow / use-case table
    columns:
      - user job
      - current workflow
      - OpenEvidence solution
      - measurable public proof
      - limitation
    rows:
      - - Bedside or corridor clinical question
        - Clinician would otherwise search PubMed, guidelines, or a browser tab under time pressure
        - Core Ask plus cited answers in web, mobile, or Voice Mode
        - Voice Mode is available on web and mobile and keeps written references alongside spoken answers
        - Public sources do not disclose median answer latency by care setting
      - - Complex literature synthesis for uncommon cases
        - Manual searching, screening, and synthesizing many studies
        - Deep Consult advanced research agent
        - Product is positioned to generate PhD-level research reports for complex questions
        - No public benchmark for completion time, citation error rate, or clinician acceptance
      - - In-EHR team consult during chart review
        - Separate logins and external lookups slow adoption
        - Mount Sinai Epic-embedded access for physicians, nurses, and pharmacists
        - March 2026 rollout explicitly extended enterprise access across the full care team
        - Public sources do not provide deployment cost, activation rate, or retained usage metrics
      - - Patient-aware evidence retrieval
        - Clinician must mentally combine literature with the patient’s record
        - Cedars-Sinai integration of patient context from Epic directly within OpenEvidence
        - Public description includes prior procedures, comorbidities, medications, allergies, and longitudinal data
        - No external validation of citation faithfulness after patient context is added
      - - Post-visit documentation and follow-up work
        - Coding, messaging, faxing, and follow-up tasks often move into separate tools
        - Visits, Coding Intelligence, Messages, Fax, and Dialer surfaces
        - Public 2026 materials describe automatic CPT/E/M/ICD-10 generation and messaging consent controls
        - Public evidence on clinical, revenue-cycle, and communications outcomes remains thin
    notes: >-
      The measurable-benefit column records what is publicly documented, not guaranteed ROI. Most deployment economics and
      workflow-savings claims still require customer diligence.
