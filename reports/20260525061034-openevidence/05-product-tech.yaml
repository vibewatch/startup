  - id: TE003
    title: Technology / operating architecture table
    columns:
      - layer / process / component
      - role
      - dependency
      - risk
    rows:
      - - Clinician interface layer
        - Web, native mobile, and Voice Mode entry points for natural-language questions
        - OpenEvidence app surfaces and verified-clinician access
        - Multi-surface consistency is claimed, but public device-level quality metrics are absent
      - - Research-orchestration layer
        - Ask for fast retrieval and Deep Consult for longer-form agentic synthesis
        - OpenEvidence’s own workflow design and prompt orchestration
        - Public sources do not disclose model routing, provider mix, or fallback behavior
      - - Licensed evidence corpus
        - Supplies the literature and guideline material that informs answers
        - NEJM, JAMA, NCCN, Wiley/Cochrane, FDA, CDC, and other content partners
        - Coverage breadth depends on continuing licenses and may remain incomplete outside partner domains
      - - Citation / verification layer
        - Gives clinicians drill-down sources, transcripts, references, and source documentation
        - Source-linked answer rendering and partner QA obligations
        - Citation presence does not by itself prove causal faithfulness of the generated answer
      - - Enterprise context layer
        - Injects EHR context for hospital workflows and patient-aware use cases
        - Epic integrations at Mount Sinai and Cedars-Sinai
        - Public materials do not describe data flow boundaries, retention windows, or safety review for patient-aware answers
      - - Documentation / communication extensions
        - Converts evidence retrieval into visit notes, coding, messages, fax, and call workflows
        - Internal workflow modules plus clinician adoption
        - Each added workflow enlarges the surface area that needs quality, privacy, and reliability assurance
    notes: >-
      This is an operating-model map, not a hidden model-stack claim. It reflects only publicly sourced interfaces,
