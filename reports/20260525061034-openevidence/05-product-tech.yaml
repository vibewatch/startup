  evidenceGaps:
    - type: missing-source
      severity: material
      topic: public-performance-disclosure
      missingEvidence: Public uptime SLA, latency benchmarks, historical incident log, or comparable operational reliability disclosures.
      whyItMatters: Enterprise buyers need to know whether the platform is dependable enough for frontline clinical use.
      diligencePath: Request trust-center materials, customer SLA language, incident history, and latency benchmarking by workflow.
      relatedQuestionRefs: [QE018]
    - type: private-evidence-only
      severity: material
      topic: licensing-dependence
      missingEvidence: A fuller map of which specialties and evidence types remain outside current content licenses, plus contract durability and update cadences.
      whyItMatters: Product quality and coverage breadth appear tied to licensed content, so a gap or churn in partner access could weaken answer quality.
      diligencePath: Ask for partner roster completeness, update SLAs, renewal terms, and specialty coverage heat maps.
      relatedQuestionRefs: [QE024]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: citation-faithfulness-and-complex-case-validation
      missingEvidence: Independent audits of citation faithfulness, patient-aware answer accuracy, and benchmark performance on difficult subspecialty cases.
      whyItMatters: Cited answers improve trust, but high-stakes clinical use still requires evidence that generated outputs remain faithful under hard conditions.
      diligencePath: Request blinded chart-review studies, citation-faithfulness audits, and hospital outcome evaluations from enterprise deployments.
      relatedQuestionRefs: [QE025]
      relatedTableRefs: [TE004]
    - type: private-evidence-only
      severity: minor
      topic: enterprise-context-governance
      missingEvidence: Detailed technical documentation on how Epic context is bounded, logged, retained, and isolated in patient-aware deployments.
      whyItMatters: Patient-aware workflows increase privacy and safety exposure relative to generic literature search.
      diligencePath: Review architecture diagrams, data-flow maps, admin controls, and security/compliance review materials for Cedars and Mount Sinai deployments.
      relatedQuestionRefs: [QE015, QE019, QE025]
      relatedTableRefs: [TE003, TE004]
