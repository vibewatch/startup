artifact: product-tech
slug: openevidence
runDate: '2026-05-25'
company:
  name: OpenEvidence
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    OpenEvidence delivers an evidence-grounded medical AI platform for verified clinicians across web, native mobile,
    and Epic-embedded workflows, with modules spanning quick clinical consults, Deep Consult research, voice
    interaction, visit documentation/coding, and communications utilities. Its strongest technical differentiation is a
    licensed evidence layer sourced from NEJM, JAMA, NCCN, Wiley/Cochrane, and other medical publishers with cited
    answers clinicians can verify, but public materials still leave material gaps around latency/uptime disclosure,
    independent complex-case performance, explainability, and the durability of content-licensing dependencies.
sections:
  - id: physician-workflow
    title: Product definition in physician workflow terms
    body: >-
      OpenEvidence is no longer just a physician search bar. Its public user-guide surface spans quick consults,
      guidelines, prior authorization and paperwork, drug information and safety, clinical-trial recruiting,
      calculators, patient handouts, medical education, inbox management, Deep Consult, DotFlows, Voice Mode, Visits,
      note creation, billing codes, after-visit summary, scheduling, templates, patient Q&A, Voices, Dialer, Fax, and
      Messages. In workflow terms, that means the product aims to sit across three recurring jobs: fast bedside
      evidence retrieval, heavier literature synthesis for complex cases, and adjacent documentation/administrative work
      after the evidence answer is produced. Voice Mode extends the consult workflow into hands-free settings such as
      rounds or walking between patients, while Deep Consult packages a longer-form research agent for harder clinical
      questions. Mobile distribution matters because the platform now has native iOS and Android apps that promise the
      same cited-answer experience as the web product, and Google Play explicitly frames the app as point-of-care
      decision support for verified healthcare professionals only.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE027
      - CE039
    tableRefs:
      - TE001
    figureRefs:
      - FE002
  - id: evidence-engine
    title: Evidence engine, content dependencies, and verification model
    body: >-
      Public materials describe OpenEvidence less as a general-purpose model company and more as an evidence-delivery
      layer built around licensed medical content plus clinician verification. The homepage and partner announcements
      show a steadily expanding corpus: NEJM Group content and multimedia from 1990 forward, full text and multimedia
      from JAMA and its specialty journals, NCCN oncology guidelines plus JNCCN content, and Wiley’s broader portfolio
      including Cochrane systematic reviews, Cochrane Clinical Answers, and hundreds of journals and books. Wiley’s own
      announcement makes the operating principle unusually explicit: “gold in, gold out,” with specialized models
      trained on peer-reviewed literature rather than the open internet and every answer grounded in sources a
      physician can drill into and verify. That is the core product architecture OpenEvidence is willing to disclose
      publicly: clinician question in, licensed evidence corpus plus model synthesis in the middle, and a cited answer
      out. The same verification model appears in Voice Mode, where spoken answers keep a written transcript and
      references alongside them, and in NCCN’s collaboration, which emphasizes source documentation and links back to
      the underlying guideline material.
    claimRefs:
      - CE007
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
      - CE013
      - CE026
      - CE033
      - CE040
    tableRefs:
      - TE003
    figureRefs:
      - FE001
      - FE003
  - id: deployment-integration
    title: Deployment model, enterprise integrations, and workflow extensions
    body: >-
      OpenEvidence’s deployment story is increasingly tied to health-system workflow integration rather than standalone
      browser use. Mount Sinai’s March 2026 rollout made the product accessible from within the electronic health record
      across the full clinical care team, explicitly including physicians, registered nurses, and pharmacists. Both the
      OpenEvidence and Hit Consultant descriptions emphasize that the Epic embedding solves the “last mile” problem:
      clinicians can ask medical questions in natural language inside the existing Epic workflow and receive answers
      grounded in peer-reviewed literature and clinical guidelines without switching to an external research tool.
      Cedars-Sinai goes one step further. Its May 2026 partnership is described as patient-aware clinical intelligence,
      integrating patient context from Epic directly within OpenEvidence so that answers can account for prior
      procedures, comorbidities, medications, allergies, and longitudinal history. Around that core question-answering
      flow, the company has started to productize adjacent workflow extensions: visit transcription, coding support,
      Voices, Messages with consent controls, Fax, and a doctor dialer. That broadens product usefulness, but it also
      raises the burden of proving reliability across many more clinical touchpoints than a pure evidence search engine
      would need to support.
    claimRefs:
      - CE014
      - CE015
      - CE016
      - CE017
      - CE018
      - CE019
      - CE020
      - CE021
      - CE038
    tableRefs:
      - TE002
  - id: trust-compliance
    title: Privacy, access control, and public trust posture
    body: >-
      OpenEvidence’s clearest public trust commitments are around HIPAA handling, clinician gating, and user-controlled
      sharing. The company announced full HIPAA compliance in April 2025 and says covered entities that input PHI do so
      under a Business Associate Agreement. It also states that conversations are private by default and that a Share
      button lets users control access to conversations. On the access side, the Google Play listing says the product is
      only available to healthcare professionals and requires user verification before use. Those controls matter because
      the product increasingly moves from generic literature search into patient-aware and documentation-adjacent
      workflows where PHI, communication channels, and draft operational outputs are in scope. What is less visible is
      the deeper technical trust stack an enterprise buyer would typically request: public uptime commitments, latency
      targets, status history, third-party security architecture detail, or external audit evidence on citation
      faithfulness once patient context and workflow automation are layered on top. The public posture is therefore
      stronger on policy controls and source-grounding than on independently auditable operational transparency.
    claimRefs:
      - CE023
      - CE024
      - CE025
      - CE026
      - CE027
      - CE036
      - CE037
    tableRefs:
      - TE004
  - id: differentiation-risks
    title: Differentiation, roadmap, and technical risk map
    body: >-
      OpenEvidence’s differentiation is not a disclosed novel model architecture so much as a workflow-native evidence
      stack: it puts licensed peer-reviewed literature and guideline content directly into clinician workflows, then
      layers cited answers, voice, patient-aware EHR context, and documentation utilities on top. That shows up in the
      product roadmap visible in public materials: HIPAA and mobile apps in 2025, NCCN and broader oncology guideline
      licensing late in 2025, Coding Intelligence in March 2026, DotFlows in April 2026, and patient-aware Cedars plus
      Voice Mode by May 2026. Scale claims are large — over 40% of U.S. physicians, more than 10,000 hospitals and
      medical centers, 860,000 clinicians, and a one-day milestone of one million physician-AI consultations — but the
      main technical diligence questions are about downside cases. First, hallucination risk does not disappear just
      because the evidence corpus is high quality; broader medical-LLM research still finds patient-harm risk when
      reasoning fails. Second, explainability remains incomplete even in cited or RAG-like systems because references do
      not by themselves prove causal faithfulness of the generated answer. Third, coverage breadth depends on the
      continuity of publisher and society licenses. Fourth, public evidence on uptime, latency, and complex-case
      benchmark performance remains materially thinner than the adoption narrative.
    claimRefs:
      - CE012
      - CE021
