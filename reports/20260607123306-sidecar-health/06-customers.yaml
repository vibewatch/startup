  - id: expansion-concentration-risks
    title: Expansion Vectors and Concentration Risks
    body: >-
      Sidecar Health's customer portfolio carries three compounding concentration risks. First,
      named-customer concentration: Koch Industries is the only publicly-confirmed large
      employer, and the only other named account (Clark Grave Vault) has no disclosed scale,
      outcome data beyond a press release quote, or independent verification of continued
      enrollment. Second, geographic concentration: the fully-insured product is licensed in
      four states, limiting addressable employer count and making the portfolio disproportionately
      sensitive to any single-state regulatory, competitive, or economic development. Third,
      product concentration: after discontinuing the individual fixed-indemnity Access Plan,
      Sidecar is entirely reliant on employer-sponsored major medical revenue, with no ancillary
      product lines publicly disclosed. Against these risks, the company has meaningful expansion
      vectors. The Texas launch opens one of the largest employer markets in the United States
      (16 million-person workforce). The Koch jumbo-employer design partnership provides a
      structural pathway to accounts with 1,000-plus employees. The 18-state ICHRA footprint
      pre-positions Sidecar for employer-directed individual coverage arrangements in states
      ahead of full insurance licensing. BuiltIn analysis notes that geographic expansion follows
      a formalized state-launch playbook and that the Koch partnership institutionalizes a
      pilot-first approach with defined KPIs before broader deployment — reducing rollout
      volatility but also limiting near-term enrollment velocity. The durability of multi-year
      employer retention at scale remains entirely unproven, as the company's oldest markets
      (Ohio and Georgia) have not disclosed renewal cohort data.
    claimRefs:
      - CU041
      - CU042
      - CU043
      - CU044
      - CU045
      - CU049
      - CU050

