chapter:
  number: 6
  title: Customers
  summary: >-
    Sidecar Health's paying employer base is anchored by Koch Industries — the only
    publicly-named enterprise client, serving simultaneously as investor, design partner, and
    paying customer for a segment of its 100,000-plus-employee workforce in Georgia, Kansas,
    and Texas. Beyond Koch, independent named-customer evidence is sparse: a single HR-director
    quote from Clark Grave Vault, three member-outcome blog stories, and mixed third-party
    reviews on Trustpilot (3.3/5 "Average," Feb 2026 archive) and Indeed (3.0/5) represent the
    bulk of public adoption-quality signal. The company's four-state fully-insured footprint
    (OH, GA, FL, TX as of June 2026) plus 18-state ICHRA coverage indicate growing geographic
    reach, but total employer count, enrolled member count, and retention metrics are not
    publicly disclosed.

sections:
  - id: employer-segments-go-to-market
    title: Employer Customer Segments and Go-to-Market
    body: >-
      Sidecar Health targets employers with 50 or more employees who purchase group major medical
      insurance. Its fully insured plan operates in four states as of June 2026 — Ohio, Georgia,
      Florida, and Texas — with the Florida expansion completing in mid-2024 after the Series D
      close and the Texas launch announced in January 2026. An ICHRA-compatible product is
      available in 18 states, extending the geographic footprint beyond fully-insured licensure.
      The primary commercial channel is broker-led: Director of Broker Relations Marisol Chen
      manages partner relationships across 18 states, and Chief Revenue Officer Patrick Reyes
      brings two decades of distribution experience from Aetna, Oscar Health, and Collective
      Health. Employer marketing centers on cost savings (20% average reduction claimed) and
      simplicity — no networks, no prior authorizations, no coinsurance. On the provider side,
      Sidecar requires no network agreement; members pay at the time of service with a Sidecar
      Health Visa card, with a direct billing option for providers who prefer to invoice the
      company. All current plans are ACA-compliant fully-insured major medical; the original
      fixed-indemnity Access Plan offered to individual consumers has been discontinued.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
