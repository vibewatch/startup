  - id: named-customer-proof
    title: Named Customer Proof and Member Outcomes
    body: >-
      Koch Industries is the sole publicly-named large-group employer customer of Sidecar Health
      as of June 2026. With subsidiaries including Georgia Pacific, Koch covers more than 100,000
      employees and made Sidecar Health available to a segment of its Georgia, Kansas, and Texas
      workforce starting in 2025; the sidecarhealth.com/koch page addresses "2026 medical plan
      options," indicating a renewal into a second plan year. Koch also serves as the designated
      design partner for Sidecar's jumbo-employer product development. Clark Grave Vault is the
      only other publicly named employer customer: HR Director Kendy Troiano was quoted in the
      June 2024 Series D press release praising cost transparency and provider choice. No other
      employer logos or case studies appear in reviewed public sources. Member-story evidence
      supplements the employer proof. Sidecar's blog documents three specific outcomes: a child
      with Williams Syndrome whose $4 million pulmonary artery reconstruction was fully covered
      with no out-of-pocket cost; an Ohio member whose 2024 emergency C-section and five-day
      NICU stay totaling more than $70,000 was settled with only the $2,500 deductible; and
      Brandon, who after a tuk-tuk crash in Sri Lanka submitted a $3,000 hospital bill against a
      $15,000 benefit amount and received more than $6,000 in earnings. A December 2025
      Trustpilot reviewer with Stage 4 cancer credited Sidecar Health with covering all care
      throughout 2025, stating "I owe my life to Sidecar Health." These stories are
      company-authored or company-amplified and have not been independently corroborated, but
      they represent the richest outcome specificity available in public sources.
    claimRefs:
      - CU012
      - CU013
      - CU014
      - CU015
