callouts:
  - calloutType: strength
    title: "Koch Industries as Design Partner and Paying Customer"
    body: >-
      Koch Industries' dual role — lead Series D investor and paying employer customer for a
      segment of its 100,000-plus-employee workforce — provides Sidecar Health with both capital
      and production-scale validation in the jumbo employer market. The year-2 renewal (2026 plan
      options confirmed on sidecarhealth.com/koch) is the strongest single retention signal
      publicly available.
    claimRefs:
      - CU012
      - CU013
      - CU014
