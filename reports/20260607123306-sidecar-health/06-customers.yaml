  - calloutType: risk
    title: "Named-Customer Evidence Gap Beyond Koch and Clark Grave Vault"
    body: >-
      The absence of publicly named employer customers beyond Koch Industries and Clark Grave
      Vault is a material evidence gap. Without independent customer references, logos tied to
      production outcomes, or disclosed employer counts, it is not possible to evaluate whether
      the value proposition is repeatable outside the Koch relationship. This concentration risk
      is compounded by Koch's role as investor and design partner, which makes its adoption
      decision less indicative of arm's-length market acceptance.
    claimRefs:
      - CU041
      - CU045

  - calloutType: risk
    title: "Provider-Acceptance Friction Creates Adverse Member Experience"
    body: >-
      Trustpilot and BBB complaint patterns reveal a consistent structural friction: some
      providers decline to accept direct self-pay from Sidecar members, certain procedures
      require extensive documentation for benefit-amount adjustments, and the claims submission
      process is described as burdensome. These are not edge cases — they reflect the inherent
      tension between a consumer-choice insurance model and a provider ecosystem built around
      network contracting. This friction is the primary driver of adverse reviews and poses a
      retention risk if employers find member satisfaction declining after year one.
    claimRefs:
      - CU034
      - CU037
      - CU039

  - calloutType: insight
    title: "Member Story Evidence Is Rich but Needs Independent Corroboration"
    body: >-
      Sidecar Health publishes unusually specific member outcome stories ($4M surgery fully
      covered, $70K obstetric event settled at the deductible, international emergency cash back)
      that provide concrete evidence of claims performance at extremes. These narratives are
      highly persuasive but are entirely company-authored and unverifiable. An investor
      conducting diligence should request audit trail access to claims data underlying these
      cases, and corroborate at least one with the member or the provider.
    claimRefs:
      - CU018
      - CU019
      - CU020

