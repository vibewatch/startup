  - id: adoption-trajectory
    title: Adoption Trajectory and Employer Demand Signals
    body: >-
      Sidecar Health does not publish total employer or member counts, making direct adoption
      trajectory measurement impossible. Proxy signals suggest growing demand. A Sidecar-commissioned
      survey (November 2024, n not disclosed) found 76% of employees on traditional
      network-based plans want their employer to change its health insurance approach, and 75%
      say they are willing to learn a new model if it saves money and improves access. Texas
      employer sentiment surveyed for the January 2026 expansion showed 85% believe costs are
      rising unsustainably and 34% cite health benefits as the fastest-growing business expense.
      The company claims 20% average cost reduction versus traditional plans, 45% lower
      emergency-room utilization, 75% of prescriptions filled at lower-cost pharmacies, and
      fewer than 1% of 2025 claims clinically denied. Nearly 80% of claims in 2025 were at or
      below the benefit amount, meaning most members paid nothing above the plan's stated
      coverage or received cash back. Sidecar claims 78% of claims result in cash back to the
      member or zero cost. None of these performance metrics has been independently verified or
      audited. The state-by-state expansion cadence — Ohio and Georgia first, Florida in 2024,
      Texas in January 2026 — is the clearest observable adoption trajectory and implies
      systematic geographic scaling predicated on growing employer pipeline.
    claimRefs:
      - CU022
      - CU023
      - CU025
      - CU026
      - CU027
      - CU028
      - CU029
      - CU030
      - CU031
      - CU032
