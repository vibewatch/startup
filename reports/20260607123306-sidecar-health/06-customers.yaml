    title: Sidecar Health Customer Journey Map
    type: journey-map
    layout: wide
    summary: >-
      Key stages from employer discovery through annual renewal, including broker touch points,
      member onboarding, and care-event economics.
    data:
      nodes:
        - id: discovery
          label: "Employer Discovery"
          detail: "HR/benefits leader encounters Sidecar via broker referral, webinar, or peer network; 76% employee-dissatisfaction signal (Nov 2024 survey) drives receptivity"
        - id: broker-engagement
