  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: employer customer count
      missingEvidence: "Total number of active employer customers, and breakdown by geography and size tier."
      whyItMatters: "Without a customer count, the penetration and growth rate of the employer business cannot be assessed; concentration risk in the Koch relationship cannot be quantified."
      diligencePath: "Request from management; look for Form D filings or state insurance premium filings that may carry employer group counts."
      relatedQuestionRefs:
        - QU006

    - type: private-evidence-only
      severity: material
      topic: enrolled member count
      missingEvidence: "Total enrolled member count across all employer plans and ICHRA; no customer count or membership update published in 2025 or 2026."
      whyItMatters: "Member count is a key scale indicator; absent this figure, the cost-per-member economics and actuarial risk pool size cannot be evaluated."
      diligencePath: "Request from management; check state insurance filings for premium equivalents in OH, GA, FL, TX."
      relatedQuestionRefs:
        - QU007
        - QU022

    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: "NRR, GRR, employer renewal rate, and first-year to second-year retention cohort data."
      whyItMatters: "Retention is the primary indicator of whether the employer value proposition survives the friction of behavioral change; without it, the business's durability is unverifiable."
      diligencePath: "Request cohort renewal data from management; ask for OH and GA market renewal rates as these are the oldest markets."
      relatedQuestionRefs:
        - QU008
        - QU019

    - type: missing-source
      severity: material
      topic: named customers beyond Koch
      missingEvidence: "Named employer customers with independently verifiable production deployment, outcome data, and renewal status beyond Koch Industries and Clark Grave Vault."
      whyItMatters: "The commercial thesis requires replicability beyond a single anchor customer that is also an investor. Without additional named references, independent adoption validation is absent."
      diligencePath: "Ask management for three customer references willing to speak with potential investors; look for case studies on benefits advisor or broker partner sites."
      relatedQuestionRefs:
        - QU004
      relatedTableRefs:
        - TU003

    - type: missing-source
      severity: minor
      topic: cost savings independent verification
      missingEvidence: "Independent actuarial or third-party audit of the 20% cost reduction, 45% ER utilization reduction, and 78% cash-back claims."
      whyItMatters: "All cost performance claims originate from the company; without independent validation they function as marketing statements rather than diligence evidence."
      diligencePath: "Request underlying actuarial analysis; look for broker or consultant publications referencing Sidecar Health's documented savings; compare to Milliman or Mercer benchmark data."
      relatedQuestionRefs:
        - QU011
        - QU015

    - type: conflicting-data
      severity: material
      topic: provider cash-pay acceptance
      missingEvidence: "Objective data on the percentage of providers in Sidecar Health's markets that accept direct self-pay from members; reconciliation of company claims vs. member complaints."
      whyItMatters: "Adverse Trustpilot reviews repeatedly cite provider refusal to accept cash payment as a primary failure mode; Sidecar Health disputes these claims but offers no quantitative evidence."
      diligencePath: "Survey providers in OH, GA, FL, TX; review state insurance commissioner complaint databases for payment-refusal themes; ask Sidecar for provider acceptance rate data."
      relatedQuestionRefs:
        - QU017

    - type: missing-source
      severity: minor
      topic: BBB complaint volume and resolution
      missingEvidence: "Total BBB complaint count, complaint categories, and resolution rate for Sidecar Health."
      whyItMatters: "The BBB page returned minimal text; the full complaint history would quantify adverse member experience beyond Trustpilot patterns."
      diligencePath: "Request BBB complaint report directly; check state insurance department complaint databases for Sidecar Health in OH, GA, FL, TX."
      relatedQuestionRefs:
        - QU016

