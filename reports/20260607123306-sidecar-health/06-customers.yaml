  - id: retention-satisfaction-adverse
    title: Retention, Member Satisfaction, and Adverse Evidence
    body: >-
      No quantitative retention data (NRR, GRR, churn, or renewal rate) is publicly available
      from Sidecar Health. The Koch Industries 2026 plan-year availability is the only indirect
      renewal proof identified: it implies at least a second-year commitment from the company's
      anchor enterprise customer. Member satisfaction is bifurcated. On Trustpilot, a February
      2026 archived snapshot shows a 3.3/5 "Average" rating. Highly positive reviewers — notably
      a cancer patient and a member who received cash back after an international emergency —
      praise coverage depth and claim processing. Adverse reviewers describe a model that is
      difficult to navigate in practice: providers declining to accept direct cash pay, claims
      denied for procedures classified as experimental, surprise out-of-network-equivalent bills,
      and a customer service experience that one reviewer labeled "SideSCAM" and described as
      requiring "a second job" to manage. Sidecar Health's Trustpilot responses acknowledge fewer
      than 1% clinical denial rates and dispute claims about provider acceptance. The Better
      Business Bureau holds an active complaint profile for Sidecar Health. Indeed employee
      reviews archived from September 2024 show a 3.0/5 average across all five categories,
      suggesting moderate internal satisfaction at best. Glassdoor returned a 403 security block
      and could not be reviewed. The pattern across review surfaces is consistent: the model
      works well for members comfortable with consumer-style healthcare navigation, but creates
      material friction for members expecting traditional insurer hand-holding or encountering
      providers who do not engage with the direct-pay model.
    claimRefs:
      - CU033
      - CU034
      - CU035
      - CU036
