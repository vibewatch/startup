  productSummary: >-
    ACA-compliant large-group major medical insurance for employers with 51+ employees, plus ASO/TPA services for
    self-funded plans. Members can use any licensed provider, pay through a Sidecar workflow, and share in savings
    when care costs less than the plan's Benefit Amount.
  customerFocus: >-
    Employer buyers, brokers, and employees/dependents in large-group health insurance; the strongest named proof is
    Koch Industries, while broader employer and member counts remain undisclosed.
  businessModel: >-
    Sidecar earns premium revenue from fully insured large-group plans and administrative revenue from ASO/TPA services
    for self-funded employers. Public materials explain the mechanics of the model, but revenue mix, medical loss ratio,
    gross margin, and reserve economics are not disclosed.
  stage: Late-stage private insurer (Series D-backed)
