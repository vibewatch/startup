companyProfile:
  summary: >-
    Sidecar Health is a 2018-founded, Los Angeles-area insurer that started with a cash-price-focused
    fixed-indemnity product, built its own Ohio carrier in 2021, and now operates as a private employer-health
    insurer focused on ACA-compliant large-group major medical and ASO services. The core product promise is
    any-provider access, transparent pricing, and member incentives to buy care below Sidecar's Benefit Amounts,
    with member care assistance layered in for complex episodes. Public evidence also supports a founder-led story
    centered on CEO Patrick Quigley, strategic validation from Koch as investor-design partner-customer, and a
    multi-state rollout that remains commercially credible but financially under-disclosed.
  foundedDate: '2018-01-01'
