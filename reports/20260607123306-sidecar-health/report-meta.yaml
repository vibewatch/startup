summary:
  headline: >-
    Sidecar Health has a differentiated transparent-plan model and real strategic validation from Koch, but the company
    still withholds the underwriting, scale, and cap-table data needed to price the risk with conviction.
  overallScore: 4.9
  recommendation: research-more
