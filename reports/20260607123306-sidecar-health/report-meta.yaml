coverageNotes: >-
  Public evidence supports Sidecar Health's product transition away from the legacy fixed-indemnity
  Access Plan and into ACA-compliant employer major medical plus ASO services, but the file is still
  thin on insurer economics. Reviewed sources support the June 2024 $165 million Series D, roughly
  $328 million of disclosed lifetime funding, four fully insured states plus a 46-state ASO footprint,
  and a meaningful strategic/customer relationship with Koch Industries. They do not disclose current
  revenue, medical loss ratio, reserve adequacy, employer count, member count, headcount, board
  composition, or the post-Series D valuation and preference stack.
