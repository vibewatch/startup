  - id: scenario-framing-and-base-case
    title: Scenario framing and base-case assumptions
    body: >-
      Without disclosed revenue, a per-member count, or a post-D valuation, any scenario analysis
      must work backward from plausible assumptions about what a rational investor paid in June 2024
      and what operational milestones would justify that price. Koch Disruptive Technologies' decision
      to lead at $165 million implies a belief in a favorable risk-adjusted return, but sophisticated
      strategic investors sometimes accept lower financial return for strategic channel value, which
      makes the pure equity mark harder to interpret.

      A bear case — implying an enterprise value of $0.5 billion to $1.0 billion — is grounded in
      the 2021 Series C mark without upward adjustment. It would be consistent with: (a) minimal
      revenue growth since 2021 as the model transition disrupted go-to-market continuity; (b) a
      medical loss ratio that, if disclosed, looks average rather than differentiated; or (c) a
      private-company down-round dynamic if the model pivot created a reset event internally. It is
      not the base expectation, but the public record does not disprove it.

      A base case — implying an enterprise value of $1.5 billion to $2.5 billion — assumes Sidecar
      executed the employer pivot meaningfully between 2021 and 2024, achieved revenue growth that a
      sophisticated lead investor (KDT) felt justified a premium to the 2021 mark, and is on a path to
      geographic and employer-count milestones that justify the $165 million of new capital deployed.
      This range borrows modest reference from the Oscar per-member lens applied at a lower hypothetical
      member base, and sits above the Accolade take-out but well below Devoted's disclosed-proof premium.

      A bull case — implying an enterprise value of $2.5 billion to $4 billion or more — depends on
      private diligence revealing employer retention that resembles durable TPA economics, a medical
      loss ratio competitive with the best transparent comps, and a pipeline of jumbo-employer wins
      through the Koch Industries channel. The model's structural advantage — transparent benefit
      amounts, no prior authorization, member-level skin in the game — could command a premium multiple
      if those claims are substantiated. The public record cannot currently support the bull case;
      it is fully contingent on non-public proof.

      The critical difference from a navigation or distribution comp (eHealth, Accolade) is that Sidecar
      is bearing actual underwriting risk as an ACA-compliant insurance carrier. That risk creates
      downside variance that the multiple must price; if the model is generating good loss ratios it
      deserves a premium, and if not it deserves a steep discount. The current public record answers
      neither question.
