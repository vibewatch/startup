  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Implied enterprise value range
      - Key risks
      - Probability signal
    rows:
      - - Bear
        - Valuation flat or below 2021 Series C mark; revenue growth modest since model pivot; MLR mediocre; Texas expansion capital-intensive without clear revenue acceleration
        - $0.5B–$1.0B; anchored to 2021 mark without upward adjustment, informed by eHealth/Accolade comp floors
        - Down-round event if follow-on capital is needed before revenue visibility; preference overhang wipes common equity
        - Non-trivial risk given opacity; cannot be disproved from public record
      - - Base
        - Series D set a premium to 2021 mark for operational progress; employer growth continues at moderate pace; NAIC statutory filings show respectable but not elite loss ratios; Texas adds material incremental revenue by 2027
        - $1.5B–$2.5B; gives credit for model differentiation and KDT strategic conviction while discounting full opacity premium
        - MLR deterioration or employer concentration in one state; follow-on capital required before profitability
        - Most defensible public-evidence range; consistent with venture math for a $165M Series D in an insurer-shaped company
      - - Bull
        - Private diligence reveals strong MLR and employer retention; Koch Industries pipeline generates jumbo-employer wins by end of 2026; carrier economics rival Alignment or Oscar on a per-member basis; path to profitability visible by 2027–2028
        - $2.5B–$4.0B; requires Alignment-like insurer proof and a credible path to national scale
        - Public evidence alone cannot justify this case; requires investor access to NAIC filings and management financials
        - Possible only if undisclosed operating data is materially better than base assumptions
    notes: >-
      These are enterprise-value ranges estimated from comparable lenses and scenario assumptions,
      not precise targets. They are not investable estimates — the research-more recommendation
      reflects the absence of the evidence needed to narrow this distribution.
