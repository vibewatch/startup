chapter:
  number: 8
  title: Valuation
  summary: >-
    Sidecar Health's last confirmed valuation is the $1 billion post-money figure from January 2021;
    the June 2024 Series D added $165 million at an undisclosed mark, bringing total disclosed raises
    to approximately $328 million. Without a post-D valuation, disclosed revenue, ARR, or employer/member
    counts, any entry price must be built from comparable lenses and scenario ranges rather than precise
    multiples. Public insurtechs have seen severe compression since 2021 — eHealth now sits below
    $60 million, GoodRx below $900 million — and private comps like Devoted Health command much richer
    marks only with disclosed revenue and scale. Recommendation: research-more; confidence: low;
    risk rating: high; valuation stance: unknown pending disclosure.

sections:
  - id: financing-context-and-entry-discipline
    title: Financing context and entry discipline
    body: >-
      Sidecar Health has raised approximately $328 million across four disclosed rounds: an $18 million
      seed in 2019, a $20 million round in 2020, a $125 million Series C in January 2021 led by Drive
      Capital at a $1 billion post-money valuation, and a $165 million Series D closed June 27, 2024,
      led by Koch Disruptive Technologies with participation from GreatPoint Ventures, BOND, Cathay
      Innovation, and Drive Capital. No post-Series D valuation has been publicly disclosed. The company
      also carries venture debt from TriplePoint Private Venture Credit, which listed Sidecar Health, Inc.
      under "Life and Health Insurance" as 0.10% of its Q1 2026 portfolio — a small but confirming signal
      of active venture-debt exposure. Koch Industries' simultaneous design-partner arrangement for
      jumbo-employer coverage provides both a strategic anchor and a commercial channel, but no terms
      or valuation marks have been disclosed.

      The opacity is structurally significant for entry discipline. Unlike Curative, which announced a
      confirmed $1.275 billion December 2025 Series B, Sidecar enters its valuation discussion with
      the last confirmed mark three years stale and a model that pivoted entirely between that mark and
      the present: the fixed-indemnity Access Plan that defined the company's brand through 2023 has
      been discontinued, and the current ACA-compliant large-group major-medical platform did not exist
      in its present form at the time of the $1 billion Series C. Investors pricing a position today
      are therefore buying a materially different business at an unknown price, justified only by the
      belief that a rational lead investor (Koch Disruptive Technologies, a sophisticated strategic)
      set a fair mark in mid-2024. That is a reasonable prior but it is not a checkable fact.

      The Trustpilot review profile — 3.3 out of 5 stars, "Average," with critical reviews calling the
      plan a "scam" and citing confusion between what is covered and what applies only to a deductible —
      suggests that consumer-facing model communication carries real friction, a risk for retention
      and brand equity. The BBB complaints record shows a pattern of billing and claims disputes.
      These are not directly valuation-limiting today, but they are relevant to the pricing of customer
      acquisition cost and churn risk in any forward model.
