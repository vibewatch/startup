  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Type
      - Market cap / valuation
      - Key metric
      - Relevance to Sidecar
      - Limitation
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly traded insurers and adjacent digital-health companies plus selected private comps
        as of June 2026; does not include all ACA or employer health plan operators; Medicare
        Advantage comps included for insurer-multiple context only.
    rows:
      - - Oscar Health (OSCR)
        - Public insurer — ACA / individual
        - $7.38B market cap (June 2026)
        - ~3.4M members (Feb 2026); profitable Q1 2026
        - Most-cited insurtech public comp; demonstrates market will pay insurer multiples at scale
        - ACA marketplace focus; not employer major medical; 3.4M members vs. Sidecar's undisclosed employer book
      - - Alignment Healthcare (ALHC)
        - Public insurer — Medicare Advantage
        - $3.17B market cap (June 2026)
        - Employer-grade clinical disclosure; FY 2025 results beat high end of guidance
        - Shows premium valuation for insurer companies with disclosed operating proof
        - Medicare Advantage risk pool vs. Sidecar's commercial employer; different regulatory and financial structure
      - - Clover Health (CLOV)
        - Public insurer — Medicare Advantage
        - ~$2.05B USD market cap (June 2026; C$2.81B)
        - MA-focused; history of regulatory and governance controversy
        - Downside reference for insurtechs that face governance or model credibility issues
        - Medicare Advantage only; Clover's DOJ and SEC scrutiny adds a risk discount not present in Sidecar's record
      - - eHealth (EHTH)
        - Public — insurance distribution / agency
        - $54.9M market cap (June 2026)
        - Q1 2026 revenue disclosed; severe multi-year revenue and margin compression
        - Hard floor for digital-health insurance intermediaries without durable carrier economics
        - Distribution model only; no underwriting risk; much smaller total addressable market than a carrier
      - - GoodRx (GDRX)
        - Public — pharmacy pricing / transparency
        - $890M market cap (June 2026)
        - Significant decline from 2021 peak above $18B; transparency model under competitive pressure
        - Cautionary comp for price-transparency plays that face incumbent pricing and model challenges
        - Pharmacy-focused; no underwriting; much lighter operating model than a carrier
      - - Accolade → Transcarent
        - M&A — benefits navigation take-private
        - $621M acquisition price (completed April 2025)
        - $414M revenue in FY 2024 (18% growth); ~1.5x revenue multiple at take-out
        - Transaction data point for an employer-benefits digital company with disclosed financials
        - Navigation only; Accolade bore no underwriting risk; much lower margin profile than a carrier
      - - Devoted Health
        - Private insurer — Medicare Advantage
        - ~$13B valuation (August 2024 Series E-ext)
        - 466K members (Jan 2026); $3.27B estimated 2024 revenue; 86% MLR; $2.64B total raised
        - Shows investors will pay rich private multiples for insurer-shaped companies with disclosed scale
        - Medicare Advantage at massive scale; Devoted's disclosed revenue and member density justify premium unavailable to Sidecar without equivalent disclosure
      - - Sidecar Health (private)
        - Private insurer — employer major medical / ASO
        - $1.0B last confirmed (Jan 2021 Series C); post-D undisclosed
        - ~$328M total raised; no revenue, member count, or MLR disclosed
        - The subject; shown for reference against the comp set
        - No current valuation anchor; no operating metrics; makes quantitative comp calibration impossible
    notes: >-
      Market caps as of June 2026 per companiesmarketcap.com. Devoted Health valuation from
      Sacra estimates and disclosed funding round. Accolade acquisition price from Healthcare Dive /
      CNBC reporting. This table is not exhaustive; it covers the most relevant public and private
      data points available to a public-evidence investor.
