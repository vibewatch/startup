  - id: diligence-gates-and-thesis-breaks
    title: Diligence gates and thesis-break triggers
    body: >-
      The missing diligence is unusually well-defined for a private company in this stage. Because
      Sidecar is an ACA-licensed insurance carrier in four states, certain financial disclosures are
      legally required to state regulators but are not in the company's public press materials. A
      thorough NAIC statutory filing review — available through state insurance department portals —
      would yield premium earned, incurred claims, administrative expenses, statutory surplus, and
      combined ratio without requiring company cooperation. That NAIC data is the single highest-value
      missing item: it would tell an investor whether the model is financially viable at current scale,
      and it is obtainable from public sources.

      Beyond statutory filings, the priority diligence asks are: (1) audited revenue and MLR for
      2022–2025, covering the full major medical operating period; (2) employer account count,
      member count, and renewal rate by state and plan type; (3) Series D post-money valuation and
      preference-stack terms; (4) Koch Industries design-partner economics and exclusivity scope;
      and (5) the go-forward capital plan given that the Texas expansion announced January 2026 was
      the fifth state (Ohio, Georgia, Florida, Texas) and a multi-state carrier needs sustained
      capital for reserve requirements.

      Thesis-break triggers are clearer than usual because the company's narrative rests on three
      pillars: (a) the no-network, benefit-amount model is efficient enough that members and employers
      accept the trade-offs; (b) the medical loss ratio is competitive enough to generate margin at
      employer premium rates; and (c) the employer market is growing fast enough to offset the cost
      of running a carrier across multiple states. If any of the three cracks — employer churn
      accelerates, MLR underperforms, or capital requirements force an unplanned round at a
      depressed mark — the rationale for a premium above the 2021 Series C weakens quickly.
