  - id: comparable-benchmarks-and-valuation-lenses
    title: Comparable benchmarks and valuation lenses
    body: >-
      The public comparable set for Sidecar is not neatly bounded: the company is a large-group major
      medical carrier, which places it closer to managed care than to insurance-distribution platforms
      like eHealth or pharmacy transparency tools like GoodRx. Nevertheless, those adjacent public
      comps establish a hard floor for what markets will pay when the durable economic moat is unclear.
      As of June 2026, eHealth trades at $54.9 million and GoodRx at $890 million — both are cautionary
      data points about how severely digital-health intermediaries have been repriced since the 2021
      peak.

      Among insurer-shaped public comps, Oscar Health is the most cited. Its market cap as of June
      2026 is $7.38 billion against approximately 3.4 million individual/ACA members as of February
      2026, implying roughly $2,170 per member. Oscar's model is primarily ACA marketplace, not
      large-group employer, and it now operates at a scale and with a financial disclosure profile
      Sidecar has not approached. Alignment Healthcare at $3.17 billion and Clover Health at
      approximately $2.05 billion USD (C$2.81 billion) are both Medicare Advantage carriers — a
      distinct risk pool and regulatory regime — but they show that investors will pay insurer-level
      multiples for plans that disclose strong clinical and cost outcomes. The Accolade–Transcarent
      transaction at $621 million (approximately 1.5 times Accolade's trailing revenue of $414 million)
      illustrates how tightly the navigation/benefits space has been priced; Accolade reported a
      near-$100 million net loss in fiscal 2024 against that revenue.

      For private comps, Devoted Health is the most informative benchmark. It raised at a $13 billion
      valuation in August 2024 against an estimated $3.27 billion in 2024 revenue, approximately
      466,000 Medicare Advantage members, and a disclosed 86% medical loss ratio — metrics Sidecar
      has not made public. The Devoted comparison is not a peer valuation; it illustrates that private
      investors will pay rich multiples for insurer-shaped companies, but only when the operating proof
      is clear and the scale is substantial. Sidecar's Series C was set at $1 billion in January 2021
      before the insurtechs corrected; the appropriate question for any new investor is whether
      undisclosed 2024–2026 operating proof justifies a meaningful premium above that stale mark given
      the peer compression that has occurred since.
