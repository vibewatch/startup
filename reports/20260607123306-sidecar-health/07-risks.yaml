  - id: underwriting-model-financial-risk
    title: Underwriting, Model, and Financial Risk
    body: >
      Sidecar Health discloses no medical loss ratio, loss ratio, claims experience, or risk-based capital ratio for SHIC
      through any publicly accessible channel. The ACA requires large-group carriers to meet an 85% MLR floor and issue
      rebates if the floor is breached. Because SHIC's Benefit Amount is set to local average costs, the model can in
      theory generate higher margins than network-contracted plans when members consistently seek lower-cost care, but
      this dynamic is unverifiable from public evidence. Adverse selection is a standing concern: the benefit-amount
      structure may attract higher-acuity members who anticipate exceeding Benefit Amounts for expensive procedures,
      worsening the loss ratio over time. Trustpilot adverse reviews from late 2025 and early 2026 describe procedures
      classified as "experimental or investigational" being denied despite advertising of "no prior authorization"; the
      company response confirmed that clinical review occurs for a small share of claims. These denials create complaint
      exposure, ERISA Section 502(a) litigation risk for self-funded plans, and potential regulatory inquiry into
      marketing accuracy. TriplePoint Private Venture Credit's Q1 2026 10-Q filing lists a growth capital loan to
      Sidecar Health as an active portfolio position, confirming leverage in the capital structure. The terms —
      including covenants, acceleration triggers, and end-of-term payments — are not publicly disclosed. If expansion
      pace or revenue growth slows, leverage servicing pressure could force premature equity dilution or constrain the
      capital available to satisfy SHIC's RBC requirements. The long-term model risk is structural: if price-transparent
      markets converge toward Benefit Amount pricing, the member savings incentive erodes and the competitive
      differentiation versus a traditional HMO narrows materially.
    claimRefs:
      - CR013
