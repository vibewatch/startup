callouts:
  - calloutType: risk
    title: Koch concentration is the single thesis-break risk
    body: >
      Koch Disruptive Technologies occupying investor, board-influence, design-partner, and prospective anchor-customer
      roles simultaneously creates a governance conflict with no visible mitigation. No alternative jumbo-employer
      anchor has been publicly identified. A Koch withdrawal would simultaneously reduce revenue trajectory,
      impair fundraising validation, and reshape product roadmap priorities all at once. This is a single
      counterparty risk with multi-dimensional impact across revenue, capital, and product strategy.
    claimRefs:
      - CR020
      - CR021
      - CR022

  - calloutType: risk
    title: Opaque underwriting economics is a structurally unresolvable gap without management disclosure
    body: >
      Sidecar Health discloses no MLR, loss ratio, RBC ratio, or claims experience for SHIC. The ACA 85 percent
      MLR floor applies and rebate liability and solvency status are unknown from public data alone. Adverse
      selection risk from the Benefit Amount model and leverage from the TriplePoint growth capital loan compound
      the opacity. This is a blocking due-diligence gap that requires management disclosure before an investment
      thesis can be confidently underwritten.
    claimRefs:
      - CR013
      - CR014
      - CR017
      - CR018

  - calloutType: insight
    title: Fixed-indemnity regulatory turbulence affects market context not Sidecar current product
    body: >
      The March 2024 Final Rule and the December 2024 ManhattanLife court vacatur relate to fixed-indemnity excepted
      benefits, a product category Sidecar discontinued by 2024. The regulatory turbulence is relevant as context
      for brand confusion and market education burden and potential future HHS guidance on reference-based pricing
      models, but it does not constitute a direct regulatory compliance risk for Sidecar current ACA major medical
      employer plans.
    claimRefs:
      - CR003
      - CR004
      - CR039
      - CR041

