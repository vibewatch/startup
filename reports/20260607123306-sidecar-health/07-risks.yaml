  - id: customer-complaint-operational-risk
    title: Customer, Complaint, and Operational Risk
    body: >
      Sidecar Health's Trustpilot profile showed a 3.3 out of 5.0 "Average" rating in an archived February 2026
      snapshot, reflecting a bimodal distribution of strongly positive and strongly adverse reviews. Adverse reviews
      focus on claims complexity, billing surprises, and provider non-acceptance of direct payment. One reviewer
      described the claims process as requiring "months" to resolve a single appointment, stacks of unresolved billing
      disputes, and the work as "a second job." A February 2026 adverse review described the experience as confusing
      and misleading, and another described a procedure denial despite no-prior-authorization advertising. BBB complaint
      records and ComplaintsBoard contacts corroborate an active complainant population. These complaint patterns matter
      for three reasons: first, insurance regulators in OH, GA, FL, and TX monitor complaint ratios relative to covered
      lives and can require market conduct exams when rates exceed state thresholds; second, ERISA Section 502(a) gives
      self-funded plan members a federal cause of action against the plan for improper benefit denials, with member
      attorneys increasingly active in this space; and third, employer HR departments deciding on renewal or initial
      adoption may encounter adverse online reviews during due diligence, adding friction to the sales cycle. A
      compliance gap also exists in the privacy documentation: the Sidecar Health Privacy Policy page retains a
      September 2021 effective date while the Privacy Statements page was updated in January 2026, creating uncertainty
      about which policy governs pre-2026 member data in any regulatory examination or litigation discovery.
    claimRefs:
      - CR026
      - CR027
      - CR028
      - CR029
