  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable Trigger
      - Threshold or Event
      - Action Implication
    rows:
      - - Koch concentration investor and design-partner withdrawal
        - KDT portfolio page; Koch press releases; TriplePoint SEC filings
        - Koch announces Sidecar exit or design-partner cancellation or no new Koch subsidiary enrollment in 2026
        - Thesis-break; re-evaluate jumbo-employer revenue thesis; assess whether alternative anchor employers exist
      - - ACA MLR compliance regulatory shortfall
        - Ohio DOI annual MLR filing; CMS MLR public report; state regulatory inquiry notices
        - SHIC MLR falls below 85 percent for any plan year triggering rebate; or state issues market conduct exam
        - Material risk; engage independent actuarial review; quantify rebate liability; assess plan repricing need
      - - No Surprises Act enforcement action or class action
        - State insurance department complaint ratios; PACER federal court filings naming Sidecar Health
        - State DOI initiates market conduct exam; or federal class action filed against Sidecar Health
        - Significant operational and legal cost; potential remediation obligations; broker confidence impact
      - - Claims denial controversy complaint threshold
        - Trustpilot rating trend; BBB complaint count; state DOI complaint ratios
        - Trustpilot rating drops below 2.5; BBB complaint ratio exceeds state peer median; state market conduct exam
        - Operational priority to remediate claims adjudication; employer renewal risk at contract anniversaries
      - - HIPAA data breach notification event
        - HHS OCR breach reporting portal; company breach notification disclosure; media coverage
        - Any reportable breach affecting 500 or more individuals triggers HHS OCR investigation and media notice
        - Regulatory and reputational crisis management; potential FTC action; employer confidence at risk
      - - Sutton Bank dependency card issuer disruption
        - OCC enforcement actions database; Sutton Bank press releases; Visa network bulletins
        - OCC issues consent order against Sutton Bank; or Sutton Bank terminates health payment card program
        - Operational emergency requiring immediate alternative card issuer; potential enrollment disruption
      - - Key-person departure Patrick Quigley
        - Company press releases; LinkedIn activity; investor communications
        - Quigley announces departure or leave of absence or role reduction without named successor
        - Thesis-break trigger for investor confidence; reassess board continuity and succession depth
    notes: >
