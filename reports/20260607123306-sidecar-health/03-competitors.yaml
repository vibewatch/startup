  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Benefit-Amount-lock-in
      missingEvidence: >-
        Employer renewal rates and multi-year retention data for Sidecar Health customers; whether Benefit Amount adoption creates plan-switching friction similar to incumbent renewal inertia.
      whyItMatters: >-
        Without employer retention data it is not possible to assess whether Sidecar Health's Benefit Amount mechanic creates meaningful switching costs or whether employers remain comparably mobile to those in traditional plans.
      diligencePath: Request multi-year employer renewal cohort data from Sidecar Health management; cross-reference with broker interview insights on renewal dynamics.
      relatedQuestionRefs:
        - QP009
    - type: private-evidence-only
      severity: material
      topic: switching-cost-empirical
      missingEvidence: >-
        Empirical employer survey data specifically measuring decision timeline, cost of transition, and consultant-recommendation rate for employers switching from traditional PPO to Sidecar-style transparent plans.
      whyItMatters: >-
        McKinsey notes two-thirds of employers want to switch carriers but switching intent and switching action diverge significantly. Without empirical data on transition rates for Sidecar's specific model the addressable penetration window is unclear.
      diligencePath: Commission a structured employer interview study across Sidecar's target markets (50-2,000 employee groups in OH, GA, FL, TX) to quantify decision criteria and switching friction; review any broker NPS data Sidecar has collected.
      relatedQuestionRefs:
        - QP026
    - type: missing-source
      severity: minor
      topic: Aetna-CVS-employer-product
      missingEvidence: >-
        Aetna/CVS employer health plan product details, pricing posture, and market share data. All Aetna employer URLs attempted returned 404 or JavaScript-gated content during this research run.
      whyItMatters: >-
        Aetna, as part of CVS Health with combined revenues exceeding $360 billion, is a major incumbent whose product positioning and pricing strategy relative to Sidecar and Surest could not be verified directly from official sources.
      diligencePath: Access Aetna employer materials via a JavaScript-enabled browser session or request a carrier briefing through a benefits consultant relationship.
