  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - Moat claim
      - Primary competitive threat
      - Severity
      - Mitigation or diligence ask
    rows:
      - - Benefit Amount transparency (any provider, guaranteed upfront price)
        - Surest and Centivo both offer pre-care price visibility within network; incumbents investing in transparency tools
        - Medium
        - Verify that Sidecar's any-provider model outperforms on member satisfaction and cost versus Surest's copay model in same employer cohorts
      - - Direct pay Visa card eliminates claim processing friction
        - Traditional carriers modernizing digital claims and payment tools; RBP plans offer similar direct pay mechanics
        - Low to medium
        - Confirm provider acceptance rate and member satisfaction scores versus traditional EOB-driven payment flows
      - - Member keeps 50% of savings below Benefit Amount (savings-sharing incentive)
        - No direct analogue in incumbent products; Surest shows copays but does not share savings
        - Medium to high (current)
        - Validate that savings-sharing drives sustained behavioral change across diverse member populations; verify retention impact
      - - No prior authorization for any service
        - Centivo also eliminates PA; some states mandating PA restrictions on insurers (ACA regulatory landscape)
        - Low (currently unique among ACA-compliant plans)
        - Monitor whether PA-reduction mandates in ACA regulation commoditize this advantage
      - - ACA-compliant major medical coverage (vs. healthshare substitute)
        - Healthshare ministries can undercut on monthly cost; ICHRA redirect shifts employer control to employees
        - Medium
        - Verify whether Sidecar's ACA compliance premium is justified by retention of higher-risk employee populations
      - - Below-market annual premium rate increases (company-claimed)
        - Incumbents with actuarial scale and broader risk pools can underwrite with more predictable trend; Surest has UHC actuarial support
        - High
        - Obtain multi-year renewal rate history; compare employer cost trajectory versus BCBS and UHC renewals in same markets
      - - Broker and distribution channel development
        - Incumbents dominate broker relationships; Surest distributed through same UHC broker channel as legacy products
        - High
        - Assess broker incentive structure and whether Sidecar's commission economics are competitive with incumbent overrides
    notes: >-
      Severity ratings are qualitative assessments based on competitive surface area, funding of competitors, and distribution power, not actuarial or financial modeling. "Mitigation" describes diligence steps for an investor, not confirmed company responses.
