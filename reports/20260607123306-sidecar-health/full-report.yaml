          - type: callout
            title: >-
              Surest and BCBS distribution depth represent a durable incumbent threat Sidecar cannot match with current
              footprint
            body: >-
              Surest is backed by UHC's 235,000-employer distribution infrastructure, national broker relationships, and
              the actuarial depth of the largest US commercial insurer. BCBS plans cover 1 in 3 Americans and access 97
              percent of US hospitals. These distribution and network advantages mean that if UHC deepens Surest's
              savings-sharing mechanics or BCBS launches a comparable transparent product, Sidecar loses its primary
              differentiation in the key employer segments it targets. The BBB complaint record demonstrates that
              Sidecar, like all insurers, faces member service challenges at scale, providing incumbents with a
              quality-of-service argument against switching.
            calloutType: risk
            claimRefs:
