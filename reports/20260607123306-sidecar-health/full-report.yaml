      - number: '5.2'
        title: Platform Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health operates through three legal entities: Sidecar Health, Inc. (parent), Sidecar Health
              Insurance Company, Inc. (SHIC, NAIC #17104, Columbus OH — the licensed carrier for fully insured
              large-group plans in FL, GA, OH, and TX), and Sidecar Health Insurance Solutions, LLC (SHIS — the TPA and
              ASO administrator for both fully insured and self-funded plans). The Visa Benefit Card, issued by Sutton
              Bank (Member FDIC) under license from Visa U.S.A. Inc., is the core payment instrument: members load their
              benefit allocation onto the card and pay providers at the point of service, eliminating the traditional
              claims-float cycle for the most common transactions. Members submit proof of loss by uploading an itemized
              medical invoice — containing CPT codes, ICD-10 diagnosis codes, provider NPI, patient name, and service
              date — through the mobile app or by mail; SHIS then adjudicates against the applicable Benefit Amount and
              processes cash-back or difference calculations. The Android app (Google Play: com.sidecarhealth.app)
              supports claim submission, expense tracking, Benefit Amount lookups, care-search, digital member ID card
              display, and Member Care access. No iOS App Store listing was resolvable at this run date; the
              member-facing experience is evidenced primarily through the Google Play listing and company descriptions.
              Critically, Sidecar Health's GitHub organization (github.com/sidecarhealth) has zero public repositories,
              confirming that the Benefit Amount engine, claims adjudication logic, and app codebase are entirely
              closed-source. This limits independent technical due-diligence to behavioral observation, company
              disclosures, and member feedback. The proprietary nature of the Benefit Amount methodology — calibrating
              local CPT costs — is both a competitive moat and an opacity risk: if data freshness or methodology drift
              occurs, members and employers have no external audit mechanism.
