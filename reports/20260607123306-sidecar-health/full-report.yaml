      - number: '7.3'
        title: Partner, Concentration, and Dependency Risk
        blocks:
          - type: paragraph
            body: >
              The Koch Industries concentration risk is the largest single counterparty risk in the Sidecar Health
              story. Koch Disruptive Technologies led the $165 million Series D in June 2024, making KDT the largest
              known investor; Koch Industries simultaneously committed to a design-partner role covering 100,000 or more
              employees across subsidiaries including Georgia Pacific. No other publicly known employer has made a
              comparable design-partner commitment. Koch occupies three roles simultaneously: investor with implied
              board influence, design partner shaping product roadmap, and prospective anchor customer representing a
              substantial share of expected covered lives. A governance conflict is inherent: decisions optimal for Koch
              as a customer may not be optimal for SHIC solvency or for non-Koch employers. If Koch or KDT exits or
              withdraws the design-partner commitment, Sidecar loses not only a potential flagship customer but also its
              most credible third-party validation signal for the jumbo-employer segment and its most visible
              fundraising proof point. Sutton Bank is the OCC-chartered issuing bank behind the Sidecar Health Visa
              payment card; every member transaction at every provider flows through Sutton Bank card issuing
              infrastructure. A regulatory action against Sutton Bank, a partnership termination, or a Visa network rule
              change affecting health payment cards would require rapid sourcing of a new issuing bank, a materially
              disruptive transition given employer integration and member enrollment touchpoints. Stop-loss reinsurance
              is a silent but critical dependency for ASO/TPA self-funded employers: a hardening stop-loss market or
              reinsurer exit from the reference-based-pricing segment would erode the ASO total cost advantage and
              potentially trigger employer churn back to fully insured traditional plans.
