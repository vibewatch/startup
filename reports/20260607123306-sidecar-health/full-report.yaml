  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Post-Series D valuation and cap table
        - >-
          Post-money valuation, liquidation preference stack, anti-dilution provisions, and board composition after the
          June 2024 round
        - >-
          Cannot compute implied return or downside protection without knowing the preference structure; a 2x or 3x
          preference on $165M materially changes the equity story
        - Company / legal counsel; request directly in early diligence
      - - Audited revenue and medical loss ratio (2022–2025)
        - >-
          GAAP revenue by product and state, medical loss ratio, administrative expense ratio, and operating income or
          loss for the post-pivot major medical period
        - >-
          These are the core numbers that determine whether the carrier model is financially viable; nothing else
          substitutes
        - Company; supplemented by NAIC statutory filings for Ohio / Georgia / Florida
      - - NAIC statutory filings for all licensed states
        - >-
          Ohio, Georgia, Florida, and Texas (if applicable) statutory filings via state insurance department portals;
          key items: premium earned, incurred claims, surplus, and combined ratio
        - >-
          Public-evidence shortcut that partially substitutes for audited financials; free to access and would
          materially narrow the scenario distribution
        - NAIC / state insurance departments; Ohio Insurance Department has searchable company filings
      - - Employer count and renewal cohort data
        - >-
          Total employer accounts by state and plan type; renewal rate by cohort and year; average employer size and
          industry mix
        - >-
          Renewal rate is the single strongest signal of whether the model delivers durable employer value;
          concentration in one industry or state amplifies downside risk
        - Company; request by employer quarter by quarter from 2022 through Q1 2026
      - - Member count and benefit-amount utilization
        - >-
          Covered members by state and plan type; share of claims that result in member cash back vs. member
          out-of-pocket overage; PMPM for the employer population
        - >-
          These metrics would allow a per-member valuation lens and would validate the 78% cash-back claim prominently
          featured in customer-service responses
        - Company; cross-check against Sidecar Health Insurance Company NAIC data
      - - Koch Industries / KDT channel terms
        - >-
          Design-partner arrangement scope, exclusivity provisions, revenue-sharing or per-case economics, and any right
          of first refusal on a Koch Industries-wide employer rollout
        - >-
          Koch Industries is one of the largest private employers in the US; if the arrangement is meaningful, it
          substantially changes the addressable market; if it is non-exclusive or limited in scope, the Series D
          strategic premium shrinks
        - >-
          Company and KDT; secondary public sources (press releases, LinkedIn) are insufficient to evaluate the
          commercial depth
    notes: >-
      Diligence asks are ranked by the degree to which the missing evidence would move the valuation call from
      research-more toward buy or avoid. NAIC filings are prioritized because they are publicly accessible without
      company cooperation.
