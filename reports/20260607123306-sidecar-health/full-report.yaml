      - number: '3.6'
        title: Exhibits
        blocks:
          - type: callout
            title: >-
              Savings-sharing mechanic creates consumer engagement incumbents cannot replicate without cannibalizing
              network economics
            body: >-
              Sidecar Health's Benefit Amount model — paying the average local cost of care and sharing 50 percent of
              savings with members who choose lower-cost providers — creates financial alignment between member
              decisions and plan cost that no traditional network-based plan replicates. Incumbents building on provider
              contracts and negotiated rates cannot easily replicate this mechanic without disrupting their own network
              and actuarial frameworks. Surest shows copays upfront but does not redistribute savings to members. This
              mechanic is both the core differentiation and the structural source of the claimed 20 percent cost
              reduction, since it rewires member incentives rather than just restricting access.
            calloutType: strength
            claimRefs:
