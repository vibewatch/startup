      - number: '3.2'
        title: Incumbent carrier power and transparent plan alternatives
        blocks:
          - type: paragraph
            body: >-
              UnitedHealthcare is both the largest incumbent and the parent of Sidecar's most direct analogue, Surest.
              Surest offers copay-only design, pre-care price transparency, and no deductibles — a product architecture
              that overlaps substantially with Sidecar's consumer-driving model — but backed by the national UHC network
              of roughly 1.1 million physicians and 6,700 hospitals, a distribution advantage Sidecar cannot replicate
              as a standalone licensed insurer. Surest is available to employers with 51 or more employees across 49
              states and claims employers typically save 7 percent with members saving 20 to 40 percent. BCBS-affiliated
              plans cover one in three Americans and assert 7 percent lower total cost of care than competitors based on
              a 2025 Milliman study, citing relationships with 97 percent of US hospitals. Cigna, operating under The
              Cigna Group umbrella that includes Evernorth pharmacy benefits management, offers group coverage for all
              employer sizes with integrated specialty services. Centivo represents the most structurally differentiated
              non-carrier competitor: a self-funded plan for 50 to 3,000 employee companies that eliminates deductibles,
              provides free primary care visits, and contracts directly with providers, claiming 15 to 30 percent
              savings versus replaced plans. McKinsey estimates that by 2030 roughly 12 million commercial members could
              shift to innovative plan designs across these categories, representing about 7 percent of the projected
              165-million-member commercial market.
