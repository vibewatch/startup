      - number: '2.3'
        title: Buyer, payer, and distribution mechanics
        blocks:
          - type: paragraph
            body: >-
              The buyer is not a consumer and not a small-group broker shopping a simple ancillary policy. The natural
              buyer is the employer benefits organization, usually led by HR or total-rewards leadership, with finance,
              consultants, and sometimes procurement involved because plan design affects claims risk, employee
              contributions, and broader people strategy. For large self-funded employers, the attraction is control:
              the company already bears claims risk and can evaluate ASO-like alternatives without moving employees into
              the ACA individual market. For the fully insured lane, Sidecar’s own current disclosures narrow the direct
              opportunity to large employers based in Florida, Georgia, or Ohio. Employees are the actual users,
              however, because the model depends on shopping behavior, provider choice, and willingness to work with
              benefit amounts instead of familiar network rules. Adoption therefore runs through consultants, brokers,
              and change-management work as much as through actuarial savings. Employers evaluate whether the design can
              lower trend, improve member experience, and still remain understandable enough for employees to use
              confidently.
