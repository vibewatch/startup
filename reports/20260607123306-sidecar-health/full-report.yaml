      - number: '3.3'
        title: Healthshare ministries, ICHRA, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Health sharing ministries occupy a distinct substitute tier. Sedera Medical Cost Sharing is a
              membership-based community where participants voluntarily contribute monthly amounts to share large
              unexpected medical costs; it is explicitly not health insurance and does not carry ACA consumer
              protections. Liberty HealthShare is a faith-based health sharing ministry that similarly bills itself as a
              community rather than an insurer. Neither platform guarantees claims payment, neither requires state
              insurance licensing compliance, and neither provides the balance-billing protections Sidecar carries under
              the No Surprises Act. For employers seeking a purely cost-driven substitute, healthshare plans can price
              30 to 50 percent below fully insured premiums in some configurations but expose employees to uninsured
              risk. Individual coverage HRAs (ICHRAs) represent a growing adjacent substitute: employers fund a defined
              contribution that workers use to purchase ACA marketplace plans individually. ICHRA adoption among
              employers with 50 or more full-time employees rose 34 percent from 2024 to 2025, with Centene and Oscar
              Health aggressively expanding their ICHRA-focused offerings. The status-quo HDHP remains the dominant
              employee cost-sharing tool, though McKinsey data show HDHP adoption growth contracted from 17 percent
              annually through 2019 to negative 1 percent annually from 2020 to 2023, signaling saturation and employer
              openness to alternatives.
            claimRefs:
              - CP022
              - CP023
              - CP024
