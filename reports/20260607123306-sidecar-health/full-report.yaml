      - number: '5.3'
        title: Provider and Broker Integration Workflows
        blocks:
          - type: paragraph
            body: >-
              Providers interact with Sidecar Health through two paths. First, and most common, a provider simply
              accepts full payment from the member via the Visa Benefit Card at the time of service — no agreement with
              Sidecar Health is required. The provider sets their own prices; Sidecar's app features those prices to
              members as part of the care-search marketplace, allowing providers to attract price-conscious patients
              without joining a constrained network. Second, providers may enter a direct billing agreement with
              SHIC/SHIS, enabling them to submit claims directly and receive prompt reimbursement. A provider portal
              supports registration, account verification, and direct billing for agreement participants. Sidecar's
              disclosures are explicit that because no contracts exist, all providers and facilities may be considered
              out-of-network for balance-billing purposes; the plan pays the Benefit Amount regardless, but cannot
              prevent a provider from billing the member for any amount above that figure outside emergency care. This
              is a disclosed structural trade-off rather than a hidden risk. On the broker side, Sidecar Health operates
              a dedicated broker-relations team led by a Director of Broker Relations and an ICHRA Lead (Tessa Vargas)
              who covers 18 states. The broker channel includes live webinars comparing Sidecar's any-provider model
              against traditional PPOs, in-person working sessions for plan rollout, and structured employer-education
              resources. Patrick Reyes (Chief Revenue Officer) oversees the go-to-market strategy built around broker
              and employer channels. The events calendar for mid-2026 includes both a remote webinar on PPO vs. Sidecar
              structural differences and an Atlanta half-day working session limited to 30 attendees. This tight-format
              broker education strategy reflects a consultative, high-touch sales model consistent with the complexity
              of replacing employer legacy plans.
