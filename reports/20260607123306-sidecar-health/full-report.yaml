          - type: callout
            title: Employer health care cost pressure is a structural tailwind but also accelerates incumbent innovation
            body: >-
              National Business Group on Health projects a 9 percent median health care trend for 2026 (7.6 percent with
              plan design changes), and McKinsey estimates that roughly 12 million commercial members could shift to
              innovative plans by 2030. This cost pressure is the primary engine driving employer openness to
              alternatives like Sidecar. However, the same cost environment pushes incumbents to innovate — BCBS, UHC,
              and Cigna have all launched cost-reduction programs and alternative plan designs. The window for Sidecar
              to establish market position is open, but it will close as incumbents accelerate their own
              transparent-plan offerings.
