              No quantitative retention data (NRR, GRR, churn, or renewal rate) is publicly available from Sidecar
              Health. The Koch Industries 2026 plan-year availability is the only indirect renewal proof identified: it
              implies at least a second-year commitment from the company's anchor enterprise customer. Member
