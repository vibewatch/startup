  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive landscape: direct peers, incumbents, substitutes, and status quo'
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health competes across four broad competitor layers. The direct peer set consists of plans that
              similarly promise cost transparency, any-provider access, or alternative cost-sharing mechanics to replace
              traditional employer PPOs: Surest (UHC's consumer-copay subsidiary), Centivo (primary-care-centered
              self-funded replacement), and reference-based pricing TPAs. Incumbents — UnitedHealthcare, BCBS-affiliated
              plans, Cigna, and Aetna/CVS — remain the dominant default by volume, occupying the same employer
              health-benefits slot through brand trust, broad networks, and consultant-channel relationships built over
              decades. Substitutes and non-insurance alternatives include health sharing ministries such as Sedera and
              Liberty HealthShare, which offer peer-to-peer cost sharing outside ACA regulation, as well as individual
              coverage health reimbursement arrangements (ICHRAs) that redirect employer dollars to ACA marketplace
              plans. The status quo for most mid-market employers is a traditional PPO or HDHP with a large carrier, and
              the decision to switch to any alternative requires overcoming proven inertia. No credible evidence of a
              single internal-build threat from a large employer has been identified in public sources; employers are
              primarily buyers, not builders, of health plan infrastructure.
