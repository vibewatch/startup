              - CP053
      - number: '3.4'
        title: Distribution power, switching costs, and multi-homing dynamics
        blocks:
          - type: paragraph
            body: >-
              The employer health benefits distribution channel is dominated by consultants, benefits brokers, and
              regional benefit advisors who maintain long-standing carrier relationships and are often compensated on a
              percentage-of-premium basis. Incumbents benefit from deep integration into HR information systems, payroll
              platforms, and stop-loss arrangements that create structural renewal inertia. Sidecar's broker page
              acknowledges the dynamic directly, positioning the plan as a "true differentiator" for brokers who can
              offer employers a cost-reduction story rather than another rate hike. The Surest case study data
              illustrating one employer's progression from 67 percent adoption in year one to full plan replacement by
              year three shows that alternative plans can achieve deep penetration, but it also illustrates that
              adoption is gradual even with incumbent UHC backing. McKinsey's 2024 survey found roughly two-thirds of
              employers were looking to switch carriers within four years, but switching intent does not reliably
              translate to switching action given annual contracting cycles, employee disruption risk, and consultant
              recommendation friction. ICHRA creates a partial multi-homing dynamic where employers can decompose the
              benefit — funding individual member choice rather than designing a group plan — potentially reducing
              Sidecar's addressable pool if ICHRA uptake accelerates. Koch Industries' selection of Sidecar as a design
              partner for jumbo employer coverage (100,000-plus covered employees) represents a meaningful distribution
              proof point, particularly for enterprises willing to accept plan-behavior change.
            claimRefs:
              - CP003
