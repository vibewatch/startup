      - number: '5.4'
        title: Trust, Privacy, and Compliance Controls
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health operates under a multi-layered compliance framework appropriate for a licensed insurance
              carrier. SHIC (NAIC #17104) is licensed and regulated in FL, GA, OH, and TX for large-group major medical;
              SHIS operates as a TPA/ASO and is additionally governed by ERISA for self-funded employer plans. All major
              medical plan members are protected by the No Surprises Act for emergency services: Sidecar Health's NSA
              disclosures explicitly confirm that the plan covers emergency services without prior authorization, that
              member cost-sharing is capped at the deductible for emergency out-of-network care, and that balance
              billing is prohibited for such events. The NSA notice explicitly does not apply to the legacy Access Plans
              (now discontinued). HIPAA/HITECH compliance applies across all three entities. The Privacy Statements,
              last updated January 8, 2026, govern PHI collected via the website, mobile app, and insurance services;
              the HIPAA Notice of Privacy Practices (effective June 2019) controls in the event of inconsistency with
              the website privacy policy. The HHS Security Rule framework (45 CFR Parts 160 and 164) requires
              administrative, physical, and technical safeguards for electronic PHI — all of which Sidecar must maintain
              as a covered entity. Data collected includes Social Security numbers, health conditions, medical invoices,
              biometric authentication preferences, and location data; Facebook OAuth login is still a documented
              sign-in option. Internal claims data metrics (published in the Disclosures page) provide operational
              quality signals: less than 1% of clinical denials from January through December 2025, 78% of claims
              resulting in cash back or zero cost, and 93% costing less than a typical copay. These are
              company-published internal metrics without independent audit; the NAIC company record (NAIC #17104)
              confirms carrier registration but does not yet surface detailed loss-ratio or complaint-rate data
              resolvable at this run date.
