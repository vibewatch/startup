      - number: '4.2'
        title: Pricing, monetization mechanism, and go-to-market
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health's core pricing innovation is the "Benefit Amount" — the amount the plan pays for each
              covered service, set to reflect the average local cost for care in the member's geography. This differs
              from traditional insurer network discounting (which negotiates provider rates below list price within a
              network) and from the Access Plan fixed indemnity model (which paid flat dollar amounts regardless of
              actual charges). The Benefit Amount is presented to members transparently through the mobile app before
              they receive care. If a provider charges less than the Benefit Amount, the member keeps half the
              difference. If the provider charges more, the member pays the difference — creating a direct financial
              incentive to shop for lower-cost care.


              The company claims its plans are 20% more affordable than traditional group health plans on average, based
              on quotes from 2025 compared to legacy group health plans, with the caveat that specific pricing may vary.
              The 45% lower member out-of-pocket cost figure is based on a structural comparison between the Sidecar
              First Dollar plan (with a $3,000 deductible, no coinsurance, and no copays) and a typical network plan
              (with a $3,000 deductible, 20% coinsurance, and copays ranging from $15 to $300 per covered service).
              These are company-calculated structural comparisons, not independently audited premium or utilization
              studies.


              Distribution is primarily through a broker channel, with Sidecar maintaining a dedicated program for
              brokers who can present the product to employer clients. The company also markets directly to large
              employers and maintains a partnership with Koch Industries as a co-design partner for the jumbo employer
              segment (100,000+ covered lives). Publicly disclosed CAC, broker commission rates, or sales cycle length
              are not available. The jump to the Texas market in January 2026 follows state regulatory approval and
              indicates continued geographic expansion using the Series D capital.
