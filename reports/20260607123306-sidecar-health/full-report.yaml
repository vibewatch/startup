      - number: '4.3'
        title: Unit economics proxies and public traction gaps
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health releases several operational metrics on its public-facing marketing and disclosures pages,
              but all are company-sourced, self-reported from internal claims data, and compare to national benchmarks
              rather than independently audited peer comparisons. The most material claims are: 45% lower ER utilization
              vs. Milliman 2024 commercial nationwide average; 75% of prescriptions filled at lower-cost pharmacies; 78%
              of claims resulting in cash back to the member or costing nothing (full year 2025, deductible excluded);
              and fewer than 1% of claims denied for clinical reasons (full year 2025). These metrics are consistent
              with the Benefit Amount model's core hypothesis — that financial incentives at point of service drive
              lower-cost care choices — but they are not externally validated through actuarial audit, state regulatory
              disclosure, or third-party underwriting review.


              The market backdrop reinforces Sidecar's cost-pressure thesis. KFF's 2024 Employer Health Benefits Survey
              placed average annual employer-sponsored family premiums at $25,572 — a 7% year-over-year increase. Aon
              projects total employer healthcare costs will rise 9.5% in 2026, exceeding $17,000 per employee, the third
              consecutive year near double-digit inflation. Business Group on Health's 2026 survey of 121 employers
              covering 11.6 million lives found a median expected cost trend of 9% before plan design offsets. The
              Milliman Medical Index 2025 projected $35,119 as the total cost of healthcare for a hypothetical family of
              four. In this environment, a plan design that demonstrably reduces utilization and shifts cost-conscious
              behavior should attract employer demand — but the absence of renewal rate data, retention metrics, or
              independent cost studies means Sidecar's outperformance claims cannot be independently verified at this
              stage.


              What is absent from the public record is more consequential for underwriting: Sidecar does not disclose
              revenue, ARR, employer count, member count, medical loss ratio, gross margin, or any cohort-level
              retention data. The ASO segment adds administrative fee revenue of unknown size. No customer case studies
              with disclosed premium or claims data are available. These gaps are not unusual for a private-stage
              insurer, but they are material to any financial diligence.
