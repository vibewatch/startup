      - number: '7.5'
        title: People, Execution, and Competitive Risk
        blocks:
          - type: paragraph
            body: >
              Patrick Quigley is the sole publicly named active executive at Sidecar Health: every investor press
              release, company announcement, and media quote flows through the CEO and Co-Founder. No deputy CEO, COO,
              CFO, or CTO is named publicly. Co-founder Veronica Osetinsky's leadership bio page returns a 404 error;
              her current title, functional ownership, and compensation are not disclosed in any retained public source.
              The asymmetry between one founder with a detailed biography and one without any accessible bio is a
              governance gap that limits external assessment of founding-team key-person risk. Board composition is
              similarly opaque: the about-us page distinguishes a "Board of directors" section from a "Board of
              advisors" section, but no individual names are publicly listed for either. Multi-state execution risk is
              significant: Texas licensing entered a rollout phase in January 2026; Kansas appears on the Koch employee
              portal but has no confirmed TDI or KDOI carrier approval in public records as of June 2026. Each new state
              requires state-specific rate filings, benefit form approvals, employer enrollment infrastructure, and
              member care staffing — a substantial execution burden while the company simultaneously manages the Koch
              design-partner relationship, scales its ASO/TPA service layer, and addresses a 3.3/5 Trustpilot
              reputation. Competitive pressure from Surest (a UHC subsidiary using a similar benefit-amount model) and
              from reference-based-pricing TPA specialists creates pricing and distribution headwinds. Surest has
              UnitedHealth Group capital, regulatory expertise, network data, and broker relationships. Incumbents
              facing employer cost fatigue may accelerate value-based and narrow-network product development to close
              the cost gap with the Benefit Amount approach, narrowing the addressable market for a standalone insurer.
