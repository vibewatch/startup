      - number: '6.5'
        title: Expansion Vectors and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health's customer portfolio carries three compounding concentration risks. First, named-customer
              concentration: Koch Industries is the only publicly-confirmed large employer, and the only other named
              account (Clark Grave Vault) has no disclosed scale, outcome data beyond a press release quote, or
              independent verification of continued enrollment. Second, geographic concentration: the fully-insured
              product is licensed in four states, limiting addressable employer count and making the portfolio
              disproportionately sensitive to any single-state regulatory, competitive, or economic development. Third,
              product concentration: after discontinuing the individual fixed-indemnity Access Plan, Sidecar is entirely
              reliant on employer-sponsored major medical revenue, with no ancillary product lines publicly disclosed.
              Against these risks, the company has meaningful expansion vectors. The Texas launch opens one of the
              largest employer markets in the United States (16 million-person workforce). The Koch jumbo-employer
              design partnership provides a structural pathway to accounts with 1,000-plus employees. The 18-state ICHRA
