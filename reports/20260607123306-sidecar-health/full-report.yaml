              full insurance licensing. BuiltIn analysis notes that geographic expansion follows a formalized
              state-launch playbook and that the Koch partnership institutionalizes a pilot-first approach with defined
              KPIs before broader deployment — reducing rollout volatility but also limiting near-term enrollment
              velocity. The durability of multi-year employer retention at scale remains entirely unproven, as the
              company's oldest markets (Ohio and Georgia) have not disclosed renewal cohort data.
