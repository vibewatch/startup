chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product model, and geography
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health was founded in 2018 by Patrick Quigley and Veronica Osetinsky around a simple question: why
              does the same MRI cost $1,300 with insurance but only $330 in cash? The company began with the Access Plan
              — an excepted-benefit fixed-indemnity product for individuals — but pivoted sharply after establishing its
              own insurance carrier, Sidecar Health Insurance Company, Inc. (NAIC #17104), in Columbus, Ohio in 2021. By
              2024 the Access Plan was discontinued entirely, and today all Sidecar Health products are ACA-compliant
              major medical insurance for employers with 51 or more employees. The two current plan structures are a
              fully insured large-group plan (underwritten by SHIC) and an ASO/TPA arrangement for self-funded
              employers, both administered by Sidecar Health Insurance Solutions, LLC. The no-network,
              no-prior-authorization, no-copay model uses a "Benefit Amount" for each covered service, derived from
              average local costs; members pay providers directly with a Sidecar Health Visa card issued by Sutton Bank,
              keep half of any savings when they choose lower-cost care, and pay the difference above the Benefit Amount
              when they choose higher-cost care. Fully insured employer plans were operating in Ohio (since 2022),
              Georgia (since 2023), and Florida (since 2024), with Texas announced in January 2026. The official
              disclosures page still lists only FL, GA, and OH at the time of this run, while the Koch-facing employee
              portal references GA, KS, and TX for 2026, indicating in-flight regulatory or enrollment rollout timing in
              Texas and Kansas.
