  - id: TV005
    title: Thesis-break and kill-trigger table
    columns:
      - Trigger
      - Threshold or event
      - Transmission to thesis
      - Action implication
    rows:
      - - MLR deterioration
        - Statutory loss ratio above 90% for two consecutive quarters in any state
        - >-
          Signals model economics are not delivering the promised savings; employer retention and pricing power both
          fall
        - Require NAIC data before new capital commitment; stop deployment if threshold confirmed
      - - Employer churn acceleration
        - Renewal rate below 70% in any mature cohort (Ohio/Georgia employers three or more years in)
        - >-
          Indicates model does not deliver durable value; addressable market is effectively a one-year trial base rather
          than sticky book
        - Pause new employer commitments; investigate churn drivers before expanding thesis
      - - Down-round or structured financing
        - >-
          Any new equity or debt with ratchets, anti-dilution triggers, or PIK features that imply valuation at or below
          2021 Series C
        - Reveals capital stress and resets the prior investor mark; common equity recovery diminishes sharply
        - Full position review; exit or restructure depending on terms
      - - Koch/strategic departure
        - Koch Disruptive Technologies exits the board or KI terminates the design-partner arrangement
        - Removes the channel anchor and strategic validation that justified much of the Series D premium
        - Immediately review the assumed distribution advantage and revise the bull case
      - - Regulatory action in a licensed state
        - >-
          Ohio, Georgia, Florida, or Texas insurance department issues a market conduct action, consent order, or
          solvency-related directive
        - >-
          Carrier license risk threatens the ability to write business; regulatory costs add burden to an already
          undisclosed cost structure
        - Treat as near-blocker; engage legal diligence and confirm statutory surplus position
      - - Claim-denial volume exceeds stated level
        - Documented clinical denial rate materially above the company's stated "fewer than 1% of claims"
        - >-
          Consumer trust and employer reputation are core differentiators; evidence of systematic denial erodes the
          positioning and invites regulatory scrutiny
        - Require independent claims-data audit; adjust customer satisfaction and retention assumptions downward
    notes: null
