  - id: FV004
    title: Investment KPI scorecard
    type: kpi
    layout: standard
    summary: IC-ready scoring across seven investment dimensions; each dimension rated 1–5 where 5 is highest conviction.
    data:
      items:
        - label: Market opportunity
          value: 4
          note: Real employer demand tailwind; large addressable market in employer major medical
        - label: Product differentiation
          value: 4
          note: No-network benefit-amount model is structurally distinctive; but pivot from legacy creates noise
        - label: Financial proof
          value: 1
          note: No revenue, MLR, or member count disclosed; lowest possible score for evidence quality
        - label: Capital efficiency
          value: 2
          note: $328M raised with no disclosed revenue; multi-state carrier reserve requirements add capital intensity
        - label: Risk profile
          value: 2
          note: Underwriting risk, model-transition risk, Trustpilot friction, peer compression — high risk
        - label: Valuation support
          value: 1
          note: No post-D valuation; no revenue denominator; comp compression makes implied premium hard to justify
        - label: Evidence quality
          value: 2
          note: Strong on funding and model; absent on economics; public statutory filing access partially mitigates
    approximationNotes: >-
      Scores are the author's investment judgment based on publicly available evidence as of 2026-06-07. A score of 1
      indicates near-complete evidence absence or unfavorable fundamentals; 5 indicates strong public-evidence support
      with minimal gaps.
