      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more — gather statutory filings before forming a position
            body: >-
              The research-more call is driven by information absence, not by a negative view of Sidecar Health's model
              or market position. NAIC statutory filings for Ohio, Georgia, and Florida are publicly accessible and
              would materially narrow the valuation distribution. An investor willing to pull those filings and request
              post-D terms from the company could plausibly move to a concrete buy or avoid position within a standard
              diligence cycle.
            calloutType: recommendation
            claimRefs:
              - CV043
              - CV044
              - CV045
              - CV050
          - type: callout
            title: Legacy model pivot creates valuation continuity gap
            body: >-
              The $1 billion Series C in January 2021 valued a company whose primary product (the Access Plan
              fixed-indemnity product) has since been discontinued. The current ACA-compliant large-group major medical
              carrier is a structurally different business with different regulatory capital requirements, a different
              risk pool, and a different go-to-market motion. Any investor treating the 2021 mark as a continuing
              baseline should recognize that the underlying business at that mark no longer exists in its original form.
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV009
              - CV010
          - type: callout
            title: NAIC statutory filings offer a partial shortcut
            body: >-
              Because Sidecar Health Insurance Company (NAIC #17104) is a licensed carrier in Ohio, Georgia, Florida,
              and Texas, its statutory financial statements are filed with state insurance regulators and are accessible
              through the NAIC's iSite+ or the individual state department portals. These filings include premium
              earned, incurred claims, surplus, and combined ratio — not GAAP revenue, but sufficient to validate the
              model economics without company cooperation. This is the most high-value public-evidence step an investor
              can take before engaging management.
            calloutType: insight
            claimRefs:
              - CV043
              - CV044
              - CV049
