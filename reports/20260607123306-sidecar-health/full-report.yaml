  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health has raised approximately $328 million across four disclosed rounds: an $18 million seed in
              2019, a $20 million round in 2020, a $125 million Series C in January 2021 led by Drive Capital at a $1
              billion post-money valuation, and a $165 million Series D closed June 27, 2024, led by Koch Disruptive
              Technologies with participation from GreatPoint Ventures, BOND, Cathay Innovation, and Drive Capital. No
              post-Series D valuation has been publicly disclosed. The company also carries venture debt from
              TriplePoint Private Venture Credit, which listed Sidecar Health, Inc. under "Life and Health Insurance" as
              0.10% of its Q1 2026 portfolio — a small but confirming signal of active venture-debt exposure. Koch
              Industries' simultaneous design-partner arrangement for jumbo-employer coverage provides both a strategic
              anchor and a commercial channel, but no terms or valuation marks have been disclosed.

              The opacity is structurally significant for entry discipline. Unlike Curative, which announced a confirmed
              $1.275 billion December 2025 Series B, Sidecar enters its valuation discussion with the last confirmed
              mark three years stale and a model that pivoted entirely between that mark and the present: the
              fixed-indemnity Access Plan that defined the company's brand through 2023 has been discontinued, and the
              current ACA-compliant large-group major-medical platform did not exist in its present form at the time of
              the $1 billion Series C. Investors pricing a position today are therefore buying a materially different
              business at an unknown price, justified only by the belief that a rational lead investor (Koch Disruptive
              Technologies, a sophisticated strategic) set a fair mark in mid-2024. That is a reasonable prior but it is
              not a checkable fact.

              The Trustpilot review profile — 3.3 out of 5 stars, "Average," with critical reviews calling the plan a
              "scam" and citing confusion between what is covered and what applies only to a deductible — suggests that
              consumer-facing model communication carries real friction, a risk for retention and brand equity. The BBB
              complaints record shows a pattern of billing and claims disputes. These are not directly
              valuation-limiting today, but they are relevant to the pricing of customer acquisition cost and churn risk
              in any forward model.
