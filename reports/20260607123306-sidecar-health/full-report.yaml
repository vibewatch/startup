  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and product architecture
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health's current revenue model centers on two funding structures for employer-sponsored health
              coverage. The primary offering is fully insured major medical insurance for large group employers with 51
              or more employees, underwritten by Sidecar Health Insurance Company, Inc. (NAIC #17104, Ohio-domiciled),
              available in Florida, Georgia, Ohio, and Texas as of January 2026. The secondary and newer offering is
              administrative services only (ASO) and third-party administrator (TPA) services for self-funded employer
              health plans, launched in 2025 and available across 46 states. In the fully insured model, Sidecar is the
              carrier of record and bears underwriting risk; revenue consists of earned premiums. In the ASO/TPA model,
              Sidecar collects administrative fees from plan sponsors without bearing claims risk — a structurally
              lighter revenue stream with different margin characteristics.


              The company's historical product, the Access Plan, was a fixed indemnity excepted benefits plan for
              individuals underwritten by United States Fire Insurance Company or SiriusPoint America Insurance Company
              — not by Sidecar itself. This product was discontinued in 2024. The transition from the Access Plan to
              employer major medical is economically significant: the insured employer product carries full underwriting
              exposure, ACA essential health benefits obligations, state solvency capital requirements, and
              out-of-pocket maximum protections, whereas the Access Plan did not constitute comprehensive coverage.
              Public-facing materials now explicitly disclaim the legacy product and redirect any prior descriptions to
              the current ACA-compliant line.


              Revenue mix between the fully insured and ASO segments is undisclosed. Sidecar does not report earned
              premium, premium equivalents, administrative revenue, or any revenue line publicly. The insured carrier
              entity is required to file statutory financial statements with state insurance departments (NAIC), but
              those filings are not consolidated into a public report available to investors.
