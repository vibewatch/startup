      - number: '1.2'
        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              Patrick Quigley is the visible public face of Sidecar Health as CEO and Co-Founder, with a biography
              consistently foregrounded in every investor press release and company announcement. He brings more than 20
              years of experience across consumer health enrollment (CEO at Katch, an online individual health plan
              enroller), internet marketing platforms (founding management team at QuinStreet, QNST), enterprise
              software (executive at BEA Systems, BEAS), and strategy consulting (McKinsey & Company). His academic
              credentials — MBA from The Wharton School and a BS in Engineering from Duke University — match the dual
              product-and-insurance architecture of the Benefit Amount model. Veronica Osetinsky is publicly identified
              as a co-founder on the about-us page alongside Quigley, but her leadership bio page returns a 404 and her
              current title, functional ownership, and compensation are not disclosed in any retained public source.
              This asymmetry — one founder with a detailed bio and one without — is a governance gap, not evidence of
              departure, but it limits external assessment of founding-team key-person risk. Board composition is
              referenced on the about-us page (distinct "Board of directors" and "Board of advisors" sections are
              listed) but no individual board members or advisors are named publicly. Investor board rights, liquidation
              preferences, and equity stakes are similarly undisclosed.
