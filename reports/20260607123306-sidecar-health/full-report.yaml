              Health. Indeed employee reviews archived from September 2024 show a 3.0/5 average across all five
              categories, suggesting moderate internal satisfaction at best. Glassdoor returned a 403 security block and
              could not be reviewed. The pattern across review surfaces is consistent: the model works well for members
              comfortable with consumer-style healthcare navigation, but creates material friction for members expecting
