      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Koch Industries design partnership validates jumbo-employer segment entry
            body: >-
              Koch Industries covering 100,000+ employees is not merely an investor or a pilot customer — it is the
              stated design partner for Sidecar's jumbo-employer product tier. This creates both commercial proof points
              and a structural barrier for competitors trying to replicate Sidecar's enterprise go-to-market. The 2025
              deployment across Georgia, Kansas, and Texas Koch employees represents real-scale validation that no press
              release alone could provide.
            calloutType: strength
            claimRefs:
              - CO026
              - CO027
          - type: callout
            title: Sub-1% clinical denial rate is a structural product differentiator
            body: >-
              A clinical denial rate below 1% is materially below the 5–20% range typical for traditional insurers who
              rely on prior authorization and utilization management. If sustained and independently audited, this
              metric argues that the Benefit Amount model shifts cost management to consumer choice rather than insurer
              gatekeeping — which would validate Sidecar's core underwriting thesis and reduce the litigation and
              appeals exposure that burdens traditional carriers.
            calloutType: strength
            claimRefs:
              - CO033
              - CO030
          - type: callout
            title: Persistent fixed-indemnity misclassification creates regulatory and sales friction
            body: >-
              Online databases, third-party descriptions, and older press still routinely categorize Sidecar Health as a
              fixed-indemnity plan. The company has published a dedicated blog post and members page rebuttal, but the
              misclassification persists and creates three distinct problems: sales friction when HR buyers encounter
              contradictory descriptions; regulatory exposure if any state insurance regulator applies fixed-indemnity
              rules to the ACA-compliant product; and consumer confusion that erodes trust in the product promise.
            calloutType: risk
            claimRefs:
              - CO037
              - CO038
              - CO039
              - CO040
          - type: callout
            title: Balance billing above Benefit Amount is a residual member liability
            body: >-
              When a provider charges more than the Sidecar Benefit Amount, the member pays the difference. The
              transparency-in-coverage disclosure explicitly states "You are responsible for any amount charged by a
              provider in excess of the Benefit Amount." For high-cost or complex care, this gap can be material. No
              Surprises Act protections apply in emergency situations, but elective care above the Benefit Amount
              creates unlimited out-of-pocket exposure for members who do not pre-confirm provider pricing.
            calloutType: risk
            claimRefs:
              - CO032
              - CO030
          - type: callout
            title: ASO/TPA launch extends TAM to self-funded employers without new state carrier licenses
            body: >-
              By offering ASO and TPA services through Sidecar Health Insurance Solutions, LLC (rather than SHIC),
              Sidecar can serve self-funded employers in states where it does not yet hold a fully insured carrier
              license. This structure unlocks the estimated 60%+ of large-employer health spend that flows through
              self-funded plans and allows national deployment before the company completes state-by-state carrier
              licensing expansion.
            calloutType: insight
            claimRefs:
              - CO028
              - CO029
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The cleanest current market definition for Sidecar Health is employer-sponsored health insurance, with
              emphasis on transparent consumer-directed major medical alternatives rather than the fixed-indemnity
              products often associated with the company in its early years. Sidecar’s current employer materials and
              disclosures repeatedly say the company offers ACA-compliant large-group major medical coverage, including
              fully insured plans in Florida, Georgia, and Ohio plus ASO and TPA services for self-funded employers.
              That means the included spend is not the whole U.S. healthcare economy and not even every
              commercial-insurance budget. The relevant spend sits inside employer group coverage, especially segments
              willing to redesign plan economics around transparent local prices, member shopping, and alternative
              network logic. Legacy fixed-indemnity or excepted-benefit products belong in the substitute and historical
              adjacency set only, because Sidecar’s own disclosures say the Access Plan is no longer offered. The
              practical status-quo comparison set is traditional PPO, HMO, HDHP, level-funded, and other network-based
              employer plans, plus adjacent alternatives such as ICHRA and high-performance or reference-priced designs
              that compete for the same cost-control discussion.
