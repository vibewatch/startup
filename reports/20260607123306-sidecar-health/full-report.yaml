      - number: '2.2'
        title: Sizing lenses and why one TAM number would overstate precision
        blocks:
          - type: paragraph
            body: >-
              The addressable market is large enough to matter, but public evidence describes it through incompatible
              lenses. At the broadest level, employer-sponsored insurance covered 165.6 million people in March 2025,
              while KFF’s 2024 survey shows family premiums averaging $25,572 and single premiums averaging $8,951. That
              establishes a very large employer-financed base. A more practical SAM proxy for Sidecar is the
              large-employer control pool that already sits in self-funded or mixed-funded structures: DOL’s 2026
              appendix B says such arrangements covered 81.3% of large-plan participants in 2023, and KFF says 79% of
              covered workers at large firms are in self-funded plans. The next layer down is alternative-plan adoption
              itself. Mercer says more than one-third of large employers already offer an alternative medical plan,
              McKinsey estimates 4 to 14 million commercial members could move to innovative products by 2030, and ICHRA
              remains a smaller but growing adjacent channel at roughly 0.5 to 1.0 million covered lives. Those facts
              support a layered TAM/SAM/SOM framing, but not a clean Sidecar-specific revenue opportunity, because
              publishers do not separate transparent major medical group plans from the wider universe of self-funding,
              ICHRA, and alternative designs.
