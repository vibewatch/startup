        - MLR deterioration or employer concentration in one state; follow-on capital required before profitability
        - >-
          Most defensible public-evidence range; consistent with venture math for a $165M Series D in an insurer-shaped
          company
      - - Bull
        - >-
          Private diligence reveals strong MLR and employer retention; Koch Industries pipeline generates jumbo-employer
          wins by end of 2026; carrier economics rival Alignment or Oscar on a per-member basis; path to profitability
          visible by 2027–2028
        - $2.5B–$4.0B; requires Alignment-like insurer proof and a credible path to national scale
        - >-
          Public evidence alone cannot justify this case; requires investor access to NAIC filings and management
          financials
        - Possible only if undisclosed operating data is materially better than base assumptions
    notes: >-
      These are enterprise-value ranges estimated from comparable lenses and scenario assumptions, not precise targets.
      They are not investable estimates — the research-more recommendation reflects the absence of the evidence needed
      to narrow this distribution.
