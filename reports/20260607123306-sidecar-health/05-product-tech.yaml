  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: benefit-amount-engine
      missingEvidence: >-
        The methodology, data sources, and refresh frequency for the Benefit Amount calculation
        (average local CPT-code cost) are fully proprietary. No independent verification, third-party
        actuarial review, or public methodology disclosure exists.
      whyItMatters: >-
        If the Benefit Amount data is stale, geographically thin, or systematically biased, members may
        face systematically underfunded benefits without awareness; pricing accuracy is central to the
        product's value proposition.
      diligencePath: >-
        Request the Benefit Amount methodology documentation from SHIC/SHIS, including data source
        contracts, geographic granularity, and refresh schedule; obtain an independent actuarial review.
      relatedQuestionRefs: [QE026]

    - type: private-evidence-only
      severity: material
      topic: tech-architecture
      missingEvidence: >-
        Sidecar Health has no public repositories, API documentation, engineering blog, or public
        technical architecture documentation. Internal claims adjudication throughput, SLAs, error rates,
        and integration architecture are not publicly available.
      whyItMatters: >-
        Claim processing delays and denials are the primary driver of adverse member reviews; without
        technical benchmarks, it is impossible to assess whether the operational complaints reflect
        scalability issues, staffing gaps, or policy-level decisions.
      diligencePath: >-
        Request internal architecture docs, claims processing SLA metrics, error rates, average time
        to adjudication, and any third-party system integrations from SHIS.
      relatedQuestionRefs: [QE010, QE017]

    - type: enumeration-incomplete
      severity: minor
      topic: geographic-expansion
      missingEvidence: >-
        Full state-by-state compliance obligations for both the fully insured line (FL/GA/OH/TX) and
        the self-funded ASO line (broader) are not publicly enumerated; ICHRA availability in 18 states
        is disclosed but specific state names are not listed.
      whyItMatters: >-
        Compliance posture differs between fully insured (state ACA) and self-funded (ERISA) plans;
        investors evaluating geographic expansion risk need the complete state compliance map.
      diligencePath: >-
        Request SHIC/SHIS state licensing map, state DOI filing confirmations, and the full list of
        ICHRA-active states from the compliance team.
      relatedQuestionRefs: [QE021]

    - type: missing-source
      severity: minor
      topic: app-store-rating
      missingEvidence: >-
        The Sidecar Health App Store rating on Google Play and Apple App Store could not be retrieved
        at this run date; the iOS App Store listing returned a 404. App store ratings and recent update
        velocity are a useful signal for mobile product quality.
      whyItMatters: >-
        Adverse member UX reviews (Trustpilot) may be corroborated or contradicted by app store
        ratings; low app ratings would reinforce the claim complexity signal.
      diligencePath: >-
        Manually check Google Play and Apple App Store for the Sidecar Health app ratings and
        most recent release notes at next refresh.
      relatedQuestionRefs: [QE007]

    - type: private-evidence-only
      severity: minor
      topic: care-navigation
      missingEvidence: >-
        The care search assistance program is described only in marketing terms; no operational
        details are available on team size, provider sourcing methodology, outcome metrics, member
        utilization rates, or quality criteria used to recommend providers.
      whyItMatters: >-
        Care search assistance is a key premium service differentiator; without evidence of scale
        or outcome quality, it is not independently verifiable whether it delivers material member
        benefit or represents a small-scale concierge service.
      diligencePath: >-
        Request utilization statistics, team headcount, provider sourcing criteria, and outcome data
        from the care navigation team during management diligence interviews.
      relatedQuestionRefs: [QE014]

