- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver/constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Employer medical cost trend around 9% to 9.5%
    - driver
    - current to near-term
    - High trend makes nontraditional plan design economically relevant in renewal conversations
    - Request cohort-level savings proof versus incumbent PPO or ASO baselines.
  - - Alternative medical plan adoption at large employers
    - driver
    - current
    - Existing buyer familiarity reduces education burden for Sidecar-like designs
    - Request segment mix of wins against incumbent carriers and other alternative plans.
  - - Transparency, navigation, and quality-steering tools
    - driver
    - current
    - Employers increasingly want data, navigation, and steerage to high-value providers
    - Request member engagement rates and navigation usage by employer cohort.
  - - Primary care and care-coordination frustration
    - driver
    - current
    - Fragmented status quo makes models promising better coordination more attractive
    - Request evidence that the model changes PCP use, ER use, and downstream utilization.
  - - State-by-state fully insured footprint
    - constraint
    - current
    - Direct fully insured growth remains limited by current filed geography
    - Request state expansion roadmap and regulatory readiness by market.
  - - Employee shopping and trust burden
    - constraint
    - current
    - Savings depend on member behavior change and comfort with benefit amounts
    - Request activation, app engagement, and net-promoter data for new employer groups.
  - - Out-of-network style member friction when prices exceed benefit amounts
    - constraint
    - current
    - Poor provider fit or weak navigation can create negative employee experience despite lower expected spend
    - Request escalation rates, member complaints, and case management outcomes for over-benefit claims.
  - - Regulatory and ERISA complexity
    - constraint
    - current to medium-term
    - Different rules apply across self-funded, mixed-funded, and fully insured lanes, and state reforms continue to evolve
    - Request legal memos, filing history, and consultant training materials by product lane.
  notes: Drivers and constraints are tied to employer renewal economics, regulation, and member behavior rather than to generic healthcare-growth narratives.
