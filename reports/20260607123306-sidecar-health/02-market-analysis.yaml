- id: diligence-gaps
  title: Diligence gaps and contradictory evidence that should survive underwriting
  body: The biggest unresolved issue is not whether the market exists; it is how much of that market is truly available to Sidecar in the next few years. Public data cleanly measures broad employer coverage, self-funded penetration, ICHRA growth, and general interest in alternative plan designs, but it does not isolate transparent major medical group plans as a discrete category. That means the chapter preserves multiple lenses instead of collapsing them into one TAM. There is also a material evidence-quality gap between Sidecar’s own outcome claims and independent proof. Company disclosures and marketing cite lower ER utilization, lower premiums, and strong claim outcomes, but those datapoints are internally derived. Independent recent press coverage on Sidecar-specific employer deployment is thin, and some likely third-party sources are unavailable or stale. Finally, the direct fully insured product remains geographically constrained even though the broader narrative points to a national
    opportunity via ASO and self-funded employers. Underwriting should therefore treat market attractiveness as real but still evidence-constrained, with the burden on management to prove pipeline mix, state expansion plans, consultant pull-through, and renewal outcomes by employer segment.
