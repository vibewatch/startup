figures:
- id: FM001
  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: The right lens narrows quickly from total U.S. health spend to employer-sponsored coverage, then to the self-funded or alternative-design wedge that Sidecar can actually address.
  data:
    items:
    - label: U.S. health-spend outer bound
      detail: CMS projects 2024 national health spending growth of 8.2% and a rise from 17.6% of GDP in 2023 to 20.3% in 2033.
      tone: neutral
    - label: Employer-sponsored coverage base
      detail: Peterson-KFF Health System Tracker puts current employer-sponsored coverage at 165.6 million people.
      tone: positive
    - label: Large-plan control pool
      detail: DOL and KFF both show that self-funded or mixed-funded structures dominate large-employer plan control.
      tone: positive
    - label: Transparent alternative-design wedge
      detail: Mercer, McKinsey, and ICHRA data indicate growing but still much smaller adoption of nontraditional plan designs.
      tone: warning
  approximationNotes: The pyramid is a scope-narrowing device rather than a published TAM/SAM/SOM stack; each layer uses a different source-backed lens to bound relevance.
  claimRefs:
  - CM005
  - CM009
  - CM014
  - CM016
  - CM017
  - CM018
  - CM043
- id: FM002
  title: Market estimate range
  type: range
  layout: standard
  summary: Public adoption and control metrics range from sub-1% current adjacency penetration to more than 80% self-funded control in large-plan structures, which is why one headline market share would mislead.
  data:
    items:
    - label: Self-funded or mixed-funded penetration lens
      low: 63.0
      mid: 79.0
      high: 81.3
      detail: KFF overall covered-worker self-funding, KFF large-firm self-funding, and DOL large-plan participant share with some self-insured component.
    - label: Alternative medical plan offer rate
      low: 35.0
      mid: 35.0
      high: 35.0
      detail: Mercer says more than one-third of large employers already offer an alternative medical plan.
    - label: Projected innovative-product share by 2030
      low: 2.4
      mid: 7.3
      high: 8.5
      detail: McKinsey low, base, and high cases for commercial members moving to innovative products as a share of a 165 million-member market.
    - label: Current ICHRA adjacency share
      low: 0.3
      mid: 0.4
      high: 0.6
      detail: Healthcare Dive and HRA Council estimates translated into share of a 170 million full commercial group market.
  approximationNotes: All rows use percentage shares, but they refer to different adoption or control lenses; the point is to preserve dispersion across the relevant market shells rather than imply one identical denominator.
