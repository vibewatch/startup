  title: Market Analysis
summary: Sidecar Health fits best inside employer-sponsored major medical coverage and the narrower wedge of transparent, consumer-directed alternatives rather than the legacy fixed-indemnity market it historically touched. Public sizing evidence supports a large employer-coverage base, a very large self-funded control pool, and rising buyer interest in alternative designs, but it does not support a clean Sidecar-specific SAM or SOM. Cost trend pressure, transparency tools, and dissatisfaction with traditional models are tailwinds, while state scope, employee behavior change, and taxonomy drift keep underwriting precision limited.
sections:
- id: market-boundary
  title: Market boundary, included spend, and status-quo substitutes
  body: The cleanest current market definition for Sidecar Health is employer-sponsored health insurance, with emphasis on transparent consumer-directed major medical alternatives rather than the fixed-indemnity products often associated with the company in its early years. Sidecar’s current employer materials and disclosures repeatedly say the company offers ACA-compliant large-group major medical coverage, including fully insured plans in Florida, Georgia, and Ohio plus ASO and TPA services for self-funded employers. That means the included spend is not the whole U.S. healthcare economy and not even every commercial-insurance budget. The relevant spend sits inside employer group coverage, especially segments willing to redesign plan economics around transparent local prices, member shopping, and alternative network logic. Legacy fixed-indemnity or excepted-benefit products belong in the substitute and historical adjacency set only, because Sidecar’s own disclosures say the Access Plan
    is no longer offered. The practical status-quo comparison set is traditional PPO, HMO, HDHP, level-funded, and other network-based employer plans, plus adjacent alternatives such as ICHRA and high-performance or reference-priced designs that compete for the same cost-control discussion.
