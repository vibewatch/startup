- id: drivers-and-constraints
  title: Growth drivers and adoption constraints
  body: The strongest growth driver is simple cost pressure. Business Group on Health puts the 2026 employer health cost trend at 9%, or 7.6% after plan design changes, while Aon projects 9.5% and more than $17,000 of plan cost per employee. That is why Mercer sees more than one-third of large employers already offering alternative medical plans and why McKinsey describes meaningful interest in switching carriers and saving more than 10%. Employers are also being pushed toward navigation, quality transparency, advanced primary care, and coordinated care models that make transparent-plan narratives more credible. But those same sources also show meaningful adoption friction. Sidecar’s fully insured geography is narrow, the model asks employees to behave more like shoppers, and no-network or benefit-amount designs can create anxiety when provider prices exceed the expected reimbursement. KFF’s own transparency questions are directionally supportive, yet they stop well short of universal confidence
    that transparency alone will materially cut spend. Regulation and ERISA structure help create the self-funded lane, but they also keep benefit design, state reform, and compliance interpretation squarely inside diligence.
