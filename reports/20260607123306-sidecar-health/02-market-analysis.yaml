tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment/category
  - Included spend
  - Excluded spend
  - Buyer/payer
  - Relevance
  rows:
  - - Transparent employer major medical alternatives
    - Large-group employer medical premium and claims spend tied to transparent local pricing, member shopping, and major medical protection
    - Stand-alone navigation apps, point solutions, or individual-market premiums unrelated to employer sponsorship
    - Employer benefits leader / employer plan sponsor
    - Closest description of Sidecar’s current proposition
  - - Self-funded / ASO transparent employer plans
    - Administrative services, claims funding, stop-loss, and plan-design budgets for self-funded employers seeking more control
    - Traditional ASO administration that keeps legacy network economics unchanged
    - Self-funded employer / finance and HR
    - Most practical near-term SAM proxy because employers already control design
  - - Fully insured large-group employer plans
    - Large-group premiums in Sidecar’s currently filed employer states and adjacent renewal budgets
    - Small-group ACA products, Medicare, and Medicaid managed care
    - Employer / carrier
    - Relevant but geographically narrower than the self-funded lane today
  - - ICHRA and defined-contribution alternatives
    - Employer contributions that fund ACA individual-market coverage through reimbursement arrangements
    - Classic employer group major medical funding
    - Employer / employee purchasing on exchange
    - Important adjacency and substitute, but not Sidecar’s current core product definition
  - - Legacy fixed-indemnity / excepted-benefit plans
    - Historical supplemental or limited-benefit products formerly sold by Sidecar as the Access Plan
    - Current Sidecar employer major medical coverage
    - Consumer or employer / member
    - Historical context and substitute set only; not the current market definition
  - - Status-quo substitutes
    - PPO, HMO, HDHP, level-funded, reference-based, and high-performance-network employer plan budgets
    - Unrelated HR software or wellness-only budgets
    - Employer benefits committee / employer
    - Default comparison set in employer renewals and broker discussions
  notes: Included spend follows current Sidecar employer major medical positioning; excluded spend preserves legacy fixed indemnity and adjacent coverage models as context rather than current product scope.
