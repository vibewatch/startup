  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sidecar-sam-som
    missingEvidence: State-by-state quote volume, employer census by size and funding type, ASO versus fully insured pipeline, and win-rate data needed to convert the broad market lenses into a real Sidecar SAM or SOM.
    whyItMatters: Without management pipeline and conversion data, the chapter can only bound opportunity through adjacent market shells rather than underwrite actual near-term share capture.
    diligencePath: Request current pipeline by state, funding structure, broker channel, and employer size; reconcile sold groups, quoted groups, and retained lives over the last four renewal cycles.
    relatedQuestionRefs:
    - QM011
    - QM012
    relatedTableRefs:
    - TM002
  - type: access-blocked
    severity: minor
    topic: independent-sidecar-adoption
    missingEvidence: Recent independent reporting or case studies describing specific Sidecar employer deployments, renewal behavior, and outcomes remain limited relative to company-authored materials.
    whyItMatters: Independent proof would help validate whether Sidecar’s employer traction is broad and repeatable rather than mostly a company-narrated sales story.
    diligencePath: Ask management for named employer references, consultant references, and third-party implementation studies; separately refresh trade-press and broker-channel searches during diligence.
    relatedQuestionRefs:
    - QM027
  - type: conflicting-data
    severity: material
    topic: alternative-plan-taxonomy
    missingEvidence: An apples-to-apples dataset separating self-funded control, alternative medical plans, ICHRA, reference-based pricing, and transparent major medical group plans is not available publicly.
    whyItMatters: Different publishers are measuring different shells, so collapsing them into one headline TAM would create false precision and could overstate or understate Sidecar’s true opportunity.
    diligencePath: Build a management diligence workbook that maps each cited public lens to Sidecar’s actual target segment and explicitly excludes non-comparable categories.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM002
