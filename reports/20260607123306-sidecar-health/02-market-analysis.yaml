- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Budget owner
  - Adoption trigger
  rows:
  - - Jumbo self-funded employers
    - VP Benefits, CHRO, or total rewards leader with consultant support
    - Employees and dependents using the member app and price tools
    - Employer self-funded plan sponsor
    - Benefits with finance and actuarial oversight
    - Need to bend trend without moving employees off employer coverage
  - - Regional large employers in FL/GA/OH
    - Employer leadership evaluating fully insured renewal options
    - Employees choosing providers and comparing prices
    - Employer paying large-group premiums
    - Benefits and finance
    - Dissatisfaction with incumbent carrier costs or member experience in current filed states
  - - Upper-mid-market employers in consultant-led renewals
    - Employer plus broker or consultant advisory team
    - Employees, HR operations, and member-support teams
    - Employer
    - Benefits leader influenced by consultant economics
    - Renewal-cycle push to evaluate nontraditional plan structures and navigation tools
  - - Employers already testing high-performance or alternative plans
    - Benefits committee seeking next plan-design step
    - Employees steered toward higher-value providers
    - Employer
    - Benefits, HR, and procurement
    - Existing appetite for alternative medical plans makes a transparent major medical model easier to evaluate
  - - ICHRA-curious smaller or midsize employers
    - Owner, HR lead, or broker
    - Employees buying individual-market coverage
    - Employer contribution plus employee plan choice
    - Employer or broker
    - Cost control need is real, but the path often routes to ICHRA rather than Sidecar’s current group product
  - - Employees as behavior-change participants
    - Not the economic buyer, but critical to implementation success
    - Active user of care search, benefit amounts, and savings incentives
    - Indirect through employer-sponsored plan
    - No direct budget ownership
    - Willingness to trust transparent pricing and shop for care
  notes: Rows distinguish the economic buyer from the day-to-day user because Sidecar’s design asks employees to behave differently than in a conventional network plan.
