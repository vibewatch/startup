- id: FM004
  title: Adoption funnel
  type: funnel
  layout: standard
  summary: Adoption narrows as employers move from generic cost pressure to legal fit, consultant diligence, employee behavior change, and finally proven renewal economics.
  data:
    items:
    - label: Cost pressure recognized
      value: 100
      unit: index
      note: All serious prospects start with an unfavorable medical cost trend and dissatisfaction with incumbent economics.
    - label: Structure and geography fit screened
      value: 80
      unit: index
      note: Prospect must fit either the self-funded/ASO lane or the current fully insured state footprint.
    - label: Broker, consultant, and finance diligence clears
      value: 60
      unit: index
      note: Employer must accept nontraditional plan logic and consultant-mediated change management.
    - label: Employee rollout and shopping behavior activate
      value: 40
      unit: index
      note: The model only works if members use navigation, price visibility, and benefit amounts in practice.
    - label: Renewal and expansion proved
      value: 20
      unit: index
      note: Expansion depends on verified trend reduction, member experience, and consultant confidence.
  approximationNotes: Stage weights are ordinal emphasis weights, not literal conversion rates; they visualize the gating sequence implied by employer survey evidence, Sidecar disclosures, and the need for behavior change.
