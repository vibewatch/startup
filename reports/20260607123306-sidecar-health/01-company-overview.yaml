company:
  name: Sidecar Health
chapter:
  number: 1
  title: Company Overview
  summary: Sidecar Health is a 2018-founded Los Angeles-area insurtech that established its own Ohio-based carrier in 2021
    and has since pivoted entirely to ACA-compliant major medical coverage for large employers, abandoning the legacy fixed-indemnity
    Access Plan that once defined its brand. The company has raised approximately $328 million across disclosed rounds through
    Series D (June 2024, $165M led by Koch Disruptive Technologies), entered a design-partner arrangement with Koch Industries for jumbo-employer coverage,
    and expanded geographically to Florida (2024) and Texas (January 2026). Key evidence gaps are the Series D valuation,
    current revenue, board governance, Veronica Osetinsky's current role, and precise employer/member counts — all consistent
    with a private company that discloses only what fundraising requires.
sections:
- id: identity-product-and-geography
  title: Identity, product model, and geography
  body: 'Sidecar Health was founded in 2018 by Patrick Quigley and Veronica Osetinsky around a simple question: why does the
    same MRI cost $1,300 with insurance but only $330 in cash? The company began with the Access Plan — an excepted-benefit
    fixed-indemnity product for individuals — but pivoted sharply after establishing its own insurance carrier, Sidecar Health
    Insurance Company, Inc. (NAIC #17104), in Columbus, Ohio in 2021. By 2024 the Access Plan was discontinued entirely, and
    today all Sidecar Health products are ACA-compliant major medical insurance for employers with 51 or more employees. The
    two current plan structures are a fully insured large-group plan (underwritten by SHIC) and an ASO/TPA arrangement for
    self-funded employers, both administered by Sidecar Health Insurance Solutions, LLC. The no-network, no-prior-authorization,
    no-copay model uses a "Benefit Amount" for each covered service, derived from average local costs; members pay providers
    directly with a Sidecar Health Visa card issued by Sutton Bank, keep half of any savings when they choose lower-cost care,
    and pay the difference above the Benefit Amount when they choose higher-cost care. Fully insured employer plans were operating
    in Ohio (since 2022), Georgia (since 2023), and Florida (since 2024), with Texas announced in January 2026. The official
    disclosures page still lists only FL, GA, and OH at the time of this run, while the Koch-facing employee portal references
    GA, KS, and TX for 2026, indicating in-flight regulatory or enrollment rollout timing in Texas and Kansas.'
