  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-unit-economics
    missingEvidence: Annual revenue, gross premiums written, medical loss ratio, or any run-rate metric for Sidecar Health's
      employer insurance business.
    whyItMatters: Without revenue data, the investment efficiency of roughly $328M in disclosed funding cannot be assessed, and the sustainability
      of the Benefit Amount underwriting model cannot be evaluated.
    diligencePath: 'Request audited financial statements or actuarial report from Sidecar Health via formal diligence process;
      check Ohio DOI annual statement filings for Sidecar Health Insurance Company, Inc. (NAIC #17104).'
    relatedQuestionRefs:
    - QO019
  - type: private-evidence-only
    severity: material
    topic: board-governance
    missingEvidence: Names and affiliations of Sidecar Health's board of directors and board of advisors; investor board seat
      arrangements, voting rights, and liquidation preferences from Series C and Series D.
    whyItMatters: Board composition determines control dynamics, founder vs. investor power balance, and the company's ability
      to pursue a long-term independent strategy versus an early-exit path.
    diligencePath: Request board roster and term sheets through formal investment diligence; review any Delaware or Ohio corporate
      filings for director disclosures.
    relatedQuestionRefs:
    - QO016
  - type: missing-source
    severity: minor
    topic: co-founder-background-TO002
    missingEvidence: Professional background, current functional role, and board standing of co-founder Veronica Osetinsky.
    whyItMatters: With only one founder publicly profiled, key-person risk assessment is incomplete and concentration on Quigley
      may be overstated or understated.
