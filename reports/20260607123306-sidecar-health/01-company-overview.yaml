- id: capital-and-investor-map
  title: Capital structure and investor map
  body: 'Sidecar Health''s financing history runs from a reported $18M Series A in 2019 through a $20M Series B in 2020, a
    $125M Series C at a $1B valuation in January 2021, and a $165M Series D in June 2024 — cumulative disclosed capital of roughly $328M
    at the time of the Series D. The Series C was led by Drive Capital and brought in BOND, Tiger Global, Menlo Ventures,
    Cathay Innovation, GreatPoint Ventures, and Morpheus as co-investors; Menlo''s and Morpheus''s portfolio pages both independently
    confirm the 2021 partnership. The Series D was led by Koch Disruptive Technologies and joined by GreatPoint Ventures,
    BOND, Cathay Innovation, Drive Capital, Duke University, Menlo Ventures, and Morpheus. The Series D press release positions
    it as "the largest private investment in employer health benefits" in 2024, a claim the company makes itself and that
    is corroborated by FierceHealthcare and MobiHealthNews as notable deal size. The Strategic significance of Koch Industries
    goes beyond the check: Koch is both an investor through its KDT arm and Sidecar''s stated "design partner" for jumbo-employer
    coverage, with Koch Industries (covering 100,000+ employees through subsidiaries including Georgia Pacific) having committed
    to make Sidecar available to a segment of its workforce beginning in 2025. No Series D post-money valuation has been publicly
    disclosed; unicorn status was established at the Series C ($1B+) and the larger Series D implies a higher mark, but no
    independent secondary or press-reported valuation figure is available to confirm or update that figure.'
