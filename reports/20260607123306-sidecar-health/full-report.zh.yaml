  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health 已在四轮披露融资中累计募资约 $328 million：2019 年 $18 million 种子轮、2020 年 $20 million 融资、2021 年 1 月由 Drive
              Capital 领投的 $125 million Series C（投后估值 $1 billion），以及 2024 年 6 月 27 日完成、由 Koch Disruptive Technologies
              领投，GreatPoint Ventures、BOND、Cathay Innovation 和 Drive Capital 参投的 $165 million Series D。Series D
              后估值没有公开披露。公司还背负来自 TriplePoint Private Venture Credit 的风险债务；后者在 Q1 2026 组合中将 Sidecar Health, Inc. 列在“Life
              and Health Insurance”项下，占比 0.10% —— 这是一个小但能确认活跃风险债务暴露的信号。Koch Industries
              同时为大型雇主覆盖安排设计伙伴，既提供战略锚点，也提供商业渠道，但条款和估值标记都未披露。

              这种不透明对入场纪律具有结构性意义。Curative 已宣布 2025 年 12 月确认的 $1.275 billion Series B；与它不同，Sidecar
              进入估值讨论时，最后一个确认估值标记已经陈旧三年，而且公司在这个估值标记到现在之间完成了彻底转向：定义公司 2023 年前品牌的固定赔付 Access Plan 已经停售，当前 ACA
              合规的大型团体主要医疗险平台，在 $1 billion Series C 时还不存在现在的形态。因此，今天给仓位定价的投资者，买到的是一家实质上不同的公司，价格未知，唯一支撑是相信一个理性领投方（Koch
              Disruptive Technologies，一个成熟战略投资者）在 2024 年中给出了公平估值标记。这是合理先验，但不是可核验事实。

              Trustpilot 评论画像 —— 3.3/5 星、“Average（平均）”，且负面评论称计划是“骗局”，并提到哪些内容被覆盖、哪些只适用于免赔额之间存在混淆 ——
              显示面向消费者的模式沟通存在真实摩擦，这会影响留存和品牌资产。BBB 投诉记录显示账单和理赔争议的模式。这些因素今天不直接限制估值，但与任何前瞻模型中 CAC 和流失风险的定价相关。
