        title: 采用轨迹与雇主需求信号
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health 不公布雇主总数或会员总数，无法直接衡量采用轨迹。代理信号显示需求在增长。Sidecar 委托的一项调查（2024 年 11 月，n 未披露）发现，传统网络型计划中的 76%
              员工希望雇主改变健康保险方案，75% 表示如果能省钱并改善可及性，愿意学习新模式。面向 2026 年 1 月扩张而调查的 Texas 雇主情绪显示，85% 认为成本正以不可持续的方式上升，34%
              将健康福利列为增长最快的业务费用。公司声称相对传统计划平均降本 20%、急诊室使用率低 45%、75% 的处方在低成本药房配药，以及 2025 年临床拒赔不到 1%。2025 年接近 80% 的理赔等于或低于
              Benefit Amount，意味着多数会员没有支付计划声明覆盖之外的费用，或获得了返现。Sidecar 称 78% 的理赔给会员带来返现或零成本。这些绩效指标都没有独立验证或审计。逐州扩张节奏 —— Ohio
