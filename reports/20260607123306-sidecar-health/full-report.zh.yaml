      - number: '5.2'
        title: 平台架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health 通过三个法律实体运营：Sidecar Health, Inc.（母公司）、Sidecar Health Insurance Company, Inc.（SHIC，NAIC
              #17104，Columbus OH —— 在 FL、GA、OH 和 TX 持牌、承保全额承保大型团体计划的保险公司），以及 Sidecar Health Insurance Solutions,
              LLC（SHIS —— 同时服务全额承保和自筹资金计划的 TPA 与 ASO 管理方）。由 Sutton Bank（Member FDIC）在 Visa U.S.A. Inc. 授权下发行的 Visa
              Benefit Card，是核心支付工具：会员把福利额度加载到卡上，并在服务现场向医疗服务方付款，从最常见交易中去掉传统理赔资金在途周期。会员通过移动 app 或邮寄上传分项医疗账单作为损失证明，账单包含 CPT
              codes、ICD-10 诊断代码、医疗服务方 NPI、患者姓名和服务日期；随后 SHIS 按适用的 Benefit Amount 裁定，并处理返现或差额计算。Android app（Google Play:
              com.sidecarhealth.app）支持提交理赔、费用跟踪、查询 Benefit Amount、护理搜索、展示数字会员 ID 卡，以及访问 Member Care。本次报告日期未能解析到 iOS App
              Store 列表；会员端体验主要由 Google Play 列表和公司描述佐证。关键是，Sidecar Health 的 GitHub
              组织（github.com/sidecarhealth）没有任何公开仓库，确认 Benefit Amount 引擎、理赔裁定逻辑和 app
              代码库完全闭源。这把独立技术尽调限制在行为观察、公司披露和会员反馈之内。Benefit Amount 方法论的自研属性 —— 校准本地 CPT 成本 ——
              既是竞争护城河，也是透明度风险：一旦数据新鲜度或方法论发生漂移，会员和雇主没有外部审计机制。
