      所有数字均为百万美元，为说明性企业价值区间。区间差距很大，反映已披露财务数据几乎完全缺失。区间基于 2021 年 Series C 轮估值标记（$1B）、上市可比公司的市值视角，以及 Accolade-Transcarent
      1.5x 收入交易参照构建。
