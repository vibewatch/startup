  - id: TI002
    title: 定价与变现——标价机制 vs. 实际经济性
    columns:
      - 定价要素
      - 描述
      - 来源依据
      - 实际 vs. 标价
      - 关键未知项
    rows:
      - - Benefit Amount（计划支付）
        - 覆盖服务在成员所在地区的平均本地医疗成本；成员就医前可在 app 中看到
        - 公司根据本地市场数据设定；方法未披露
        - 标价机制——除非医疗费用超过 Benefit Amount，实际支付等于 Benefit Amount
        - Sidecar 如何按 CPT / 地区设定并更新 Benefit Amount；精算方法
      - - 成员节省分成
        - 成员保留服务商收费低于 Benefit Amount 时差额的 50%
        - 公司政策；披露页和成员页有说明
        - 为比价就医提供经济激励；2024 年 4 口之家平均实际节省 $1,094（公司内部数据）
        - 按服务类型和地区拆分的节省分布；节省池中的逆选择风险
      - - 雇主保费（全承保）
        - Sidecar 向雇主按月收取的保费；保费规模未披露
        - 公司定价模型；比传统方案低 20%（公司称，2025 报价）
        - 实际定价未知——20% 说法来自公司报价，不基于已披露费率备案
        - 按州、雇主规模分层和计划设计披露实际平均 PEPM 保费
      - - 行政费（ASO）
        - 自筹资金雇主模式下用于计划管理的每名成员每月费用
        - 大型团体 TPA 的行业标准区间：约 $15-$50 PMPM（行业基准，非 Sidecar 披露）
        - 实际费率未知；Sidecar 未披露 ASO 定价
        - 披露 ASO 收费表、预期利润率和 ASO 总受保人数
      - - 免赔额结构
        - 计划提供免赔额结构（例如 First Dollar 计划有 $3,000 免赔额）；免赔额以上无共同保险或共付额
        - 公司披露和 Transparency in Coverage 法律文件
        - 结构事实——免赔额架构已确认；免赔额对收入的影响（雇主负担 vs. 成员负担）与 ACA 规则一致
        - 每名成员每年的实际触发免赔额比例；对计划经济性和逆选择的影响
    notes: >-
