          - type: callout
            title: 医疗服务方接受度摩擦制造负面会员体验
            body: >-
              Trustpilot 和 BBB 投诉模式揭示出一个一致的结构性摩擦：部分医疗服务方拒绝接受 Sidecar 会员直接自付，某些手术需要大量文件才能调整 Benefit
              Amount，理赔提交流程也被描述为繁重。这些不是边缘案例 ——
              它们反映了消费者选择型保险模式与围绕网络合同搭建的医疗服务方生态之间的内在张力。这种摩擦是负面评价的主要驱动因素；如果雇主发现第一年后会员满意度下降，它也会构成留存风险。
            calloutType: risk
            claimRefs:
