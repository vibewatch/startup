  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：直接同业、既有巨头、替代品和现状
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health 的竞争分为四层。直接同业是同样承诺成本透明、任意服务方可用，或用替代成本分担机制取代传统雇主 PPO 的计划：Surest（UHC
              的消费者共付子公司）、Centivo（以初级保健为中心的自筹资金替代方案）和参考定价 TPA。既有巨头——UnitedHealthcare、BCBS 关联计划、Cigna 和
              Aetna/CVS——仍按规模占据默认位置，凭借品牌信任、广泛网络和数十年建立的顾问渠道关系，占据同一个雇主健康福利槽位。替代品和非保险方案包括 Sedera、Liberty HealthShare
              等医疗费用分担事工，它们在 ACA 监管之外提供点对点费用分摊；还包括 ICHRA，把雇主资金导向 ACA 市场计划，由员工个人购买。多数中型市场雇主的现状，是使用大型承保公司的传统 PPO 或
              HDHP；要切换到任何替代方案，都必须克服已被证明存在的惯性。公开来源中未发现可信证据表明大型雇主会形成单一内部自建威胁；雇主主要是健康计划基础设施的买方，而不是建设者。
