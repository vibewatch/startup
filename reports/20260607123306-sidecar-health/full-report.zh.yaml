  - id: TV005
    title: 投资逻辑破坏点与止损触发器表
    columns:
      - 触发器
      - 阈值或事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - MLR 恶化
        - 任一州法定赔付率连续两个季度高于 90%
        - 表明模型经济性没有兑现承诺的节省；雇主留存和定价权都会下降
        - 投入新资本前必须拿到 NAIC 数据；若阈值确认，停止部署
      - - 雇主流失加速
        - 任一成熟队列续约率低于 70%（Ohio / Georgia 已合作三年以上的雇主）
        - 说明模型没有交付持久价值；可触达市场实际上是一年期试用池，而非黏性客户簿
        - 暂停新增雇主承诺；扩展投资逻辑前先查清流失原因
      - - 下轮降价或结构化融资
        - 任何新股或债务若带有棘轮、反稀释触发器或 PIK 条款，并暗示估值等于或低于 2021 Series C
        - 暴露资本压力，并重设此前投资者账面估值；普通股回收空间会急剧收窄
        - 全面复盘持仓；按条款决定退出或重组
      - - Koch / 战略方退出
        - Koch Disruptive Technologies 退出董事会，或 KI 终止设计伙伴安排
        - 移除支撑 Series D 大部分溢价的渠道锚点和战略背书
        - 立即复核假设中的分销优势，并下修乐观情景
      - - 持牌州出现监管行动
        - Ohio、Georgia、Florida 或 Texas 保险部门发布市场行为监管行动、同意令或与偿付能力相关的指令
        - 承保主体牌照风险会威胁写单能力；监管成本给已不透明的成本结构继续加压
        - 视作近乎阻断项；开展法律尽调并确认法定盈余状况
      - - 拒赔量超过公司口径
        - 有记录的临床拒赔率显著高于公司所称「少于 1% 的理赔」
        - 消费者信任和雇主口碑是核心差异化；系统性拒赔证据会侵蚀定位，并招来监管审查
        - 要求独立理赔数据审计；下调客户满意度和留存假设
    notes: null
