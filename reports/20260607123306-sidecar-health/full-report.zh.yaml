            title: 垂直整合的承保人—管理方—卡模型
            body: >-
              Sidecar Health 通过同一公司体系持有保险承保人（SHIC）、TPA/ASO（SHIS）和会员端 Visa 卡项目，控制从承保到就医现场支付的完整价值链 ——
              这种结构性优势让它可以迭代会员体验、理赔逻辑和定价透明度，而不依赖外部传统网络或理赔清算所。
            calloutType: strength
            claimRefs:
              - CE002
              - CE003
              - CE007
              - CE042
          - type: callout
            title: 理赔复杂度与会员教育缺口
            body: >-
              Trustpilot 3.3/5 的评级（2026 年 2
              月归档），叠加描述数月理赔解决、手术拒赔和覆盖机制困惑的具体负面评论，指向实质性的运营与信任风险。公司的模式确实不同于传统保险，需要主动教育会员；当前负面信号说明，教育和理赔处理速度还没有稳定达到会员预期。
            calloutType: risk
            claimRefs:
              - CE037
          - type: callout
            title: 非急诊护理存在差额账单暴露
            body: >-
              传统 PPO 用网络合同封顶医疗服务方收费；Sidecar 不同，其 Transparency in Coverage 披露承认，为差额账单目的，所有医疗服务方都可能被视为“网络外”——
              也就是说，非急诊服务中，如果医疗服务方收费高于 Benefit Amount，可以向会员收取差额。No Surprises Act 保护只覆盖急诊服务。这个结构限制是真实消费者风险，也是部分负面评价的来源。
            calloutType: risk
            claimRefs:
