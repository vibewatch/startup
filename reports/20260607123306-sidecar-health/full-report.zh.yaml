  - id: TV002
    title: 投资逻辑与反向逻辑表
    columns:
      - 立场
      - 论点
      - 重要性
      - 什么会改变判断
    rows:
      - - 投资逻辑
        - 资本市场支持真实，且领投方成熟
        - Koch Disruptive Technologies 于 2024 年 6 月领投 $165M D 轮融资；KDT 是战略投资方，能看到 Koch Industries 雇主渠道的运营情况
        - 如果 D 轮条款显示 KDT 获得重度优先权保护，隐含股权估值会收窄，确信信号也会变弱
      - - 投资逻辑
        - 雇主主要医疗险具备结构性模式优势
        - 无网络、Benefit Amount、无需预授权的设计降低行政摩擦，并可能为雇主带来真实成本节省
        - 如果雇主流失或临床拒赔投诉显著高于模式声称水平（公司称拒赔低于 1%），运营叙事会变弱
      - - 投资逻辑
        - 雇主需求顺风真实且持续
        - KFF、Business Group on Health 和 Aon 均记录 2025–2026 年医疗成本趋势为 7–9.5%，为中型市场雇主创造真实切换动机
        - 如果成本趋势大幅降温，或 ACA 监管变化给承保机构带来新负担，可触达切换机会会收窄
      - - 反向逻辑
        - 旧模式转向打断估值连续性
        - $1B C 轮估的是固定赔付 / 个人产品；当前符合 ACA 的大团体承保机构是结构不同、风险画像不同的业务
        - 如果管理层证明 2022 年以来雇主收入持续增长，转向就会从复杂因素变成正面因素
      - - 反向逻辑
        - 没有财务披露，无法给出基于证据的价格
        - 收入、MLR、法定盈余和雇主留存均未公开；投资者无法独立用经济基本面验证当前估值
        - Ohio、Georgia 和 Florida 的 NAIC 法定备案技术上公开；愿意做功课的投资者可以近似还原经营图景
      - - 反向逻辑
        - 公开市场同业显示倍数严重压缩
        - eHealth 市值 $55M、GoodRx 市值 $890M、Accolade 以 1.5x 收入私有化，说明数字健康和保险相邻公司面临严厉市场约束
        - Sidecar 的承保机构结构和雇主降本叙事可能支撑相对导航类可比公司的溢价，但前提是披露核保证据
      - - 反向逻辑
        - 消费者投诉显示模式摩擦和留存风险
        - Trustpilot 3.3/5 的「Average」评级中，评论提到保障范围困惑、理赔困惑和账单争议
        - 如果消费者摩擦只是沟通问题而非结构性缺陷，更好的入门引导和会员教育可能显著改善留存
    notes: 投资逻辑行解释 Sidecar Health 为什么值得持续分析；反向逻辑行解释为什么这种关注应继续以价格敏感、证据驱动为前提。
