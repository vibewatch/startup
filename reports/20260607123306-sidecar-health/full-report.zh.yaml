              基于 2024 年 6 月完成的 $165M Series D，且公开层面没有困境信号（未披露裁员、四州监管足迹仍活跃、Texas 于 2026 年 1 月上线），可以假设 Sidecar Health
              的资本状况至少到 2026 年中仍然够用。这个假设没有披露现金、烧钱速度或现金跑道数据支撑；任何完整尽调都应以经审计资产负债表数据替换它。
