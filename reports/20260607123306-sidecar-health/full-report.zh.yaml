          - type: callout
            title: 闭源技术栈限制技术尽调
            body: >-
              Sidecar Health 的 GitHub 组织没有任何公开仓库，也没有 API
              文档、工程博客或公开技术栈披露。本章所有技术评估都基于推断。这对一家保险科技公司并不罕见，但意味着任何尽调沟通都应索取内部架构文件、Benefit Amount 引擎的数据源方法论、app 可靠性
              SLA，以及理赔处理吞吐基准。
