            title: Koch 集中度是单一投资逻辑破裂风险
            body: >
              Koch Disruptive Technologies 同时占据投资者、董事会影响力、设计伙伴和潜在锚定客户角色，制造了一个没有可见缓释的治理冲突。公开层面没有识别到替代的大型雇主锚点。一旦 Koch
              退出，收入轨迹会下降、融资验证会受损、产品路线图优先级也会同时改写。这是一个单一交易对手风险，却在收入、资本和产品策略三条线上产生多维影响。
