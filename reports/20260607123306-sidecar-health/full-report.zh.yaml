              Sidecar Health 没有披露 SHIC 的 MLR、赔付率、RBC ratio 或理赔经验。ACA 85% MLR 下限适用，仅靠公开数据无法判断返还款负债和偿付能力状态。Benefit Amount
              模型带来的逆向选择风险，与 TriplePoint 增长资本贷款带来的杠杆叠加，加重了不透明度。这是一个阻断性尽调缺口，必须由管理层披露，投资逻辑才可能被有信心地承保。
