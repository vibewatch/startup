      - number: '1.5'
        title: 展示材料
        blocks:
          - type: callout
            title: Koch Industries 设计伙伴关系验证超大型雇主切入
            body: >-
              覆盖 100,000+ 名员工的 Koch Industries 不只是投资人或试点客户——它是 Sidecar 超大型雇主产品层级的既定设计伙伴。这既形成商业证明点，也给试图复制 Sidecar
              企业销售打法的竞争者设置结构性门槛。2025 年在 Georgia、Kansas 和 Texas 的 Koch 员工中部署，提供了单靠新闻稿无法给出的真实规模验证。
            calloutType: strength
            claimRefs:
              - CO026
              - CO027
          - type: callout
            title: 低于 1% 的临床拒赔率是结构性产品差异
            body: >-
              低于 1% 的临床拒赔率显著低于依赖预授权和使用管理的传统保险公司常见 5–20% 区间。若能持续并经过独立审计，这一指标说明 Benefit Amount 模型把成本管理从保险公司把关转向消费者选择；这会验证
              Sidecar 的核心承保逻辑，并降低传统承保公司背负的诉讼和申诉风险。
            calloutType: strength
            claimRefs:
              - CO033
              - CO030
          - type: callout
            title: 固定赔付误分类持续制造监管和销售摩擦
            body: >-
              线上数据库、第三方描述和较早媒体报道仍经常把 Sidecar Health 归为固定赔付计划。公司已发布专门博客文章和会员页面反驳，但误分类仍存在，并带来三类问题：HR
              买方看到矛盾描述时产生销售摩擦；若任何州保险监管机构把固定赔付规则套用到符合 ACA 的产品上，会产生监管风险；消费者混淆也会侵蚀产品承诺的信任。
            calloutType: risk
            claimRefs:
              - CO037
              - CO038
              - CO039
              - CO040
          - type: callout
            title: Benefit Amount 以上的余额账单仍是会员剩余负债
            body: >-
              当服务方收费高于 Sidecar Benefit Amount 时，会员支付差额。透明覆盖披露明确写道：“你需负责服务方收取的、超出 Benefit Amount
              的任何金额。”对高成本或复杂护理，这个缺口可能很大。No Surprises Act 保护适用于紧急情形，但选择性护理若高于 Benefit Amount，且会员未预先确认服务方价格，就会产生无限额的自付敞口。
            calloutType: risk
            claimRefs:
              - CO032
              - CO030
          - type: callout
            title: ASO/TPA 上线把 TAM 扩展到自筹资金雇主，不需要新增州承保牌照
            body: >-
              Sidecar 通过 Sidecar Health Insurance Solutions, LLC（而不是 SHIC）提供 ASO 和 TPA
              服务，就能服务尚未持有全额承保牌照州里的自筹资金雇主。这一结构解锁了估计 60%+ 通过自筹资金计划流动的大雇主健康支出，并允许公司在完成逐州承保牌照扩张之前先全国部署。
            calloutType: insight
            claimRefs:
              - CO028
              - CO029
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health 当前最清晰的市场定义是雇主赞助健康险，重点是透明、消费者导向的主医疗保险替代方案，而不是公司早年常被联系到的固定赔付产品。Sidecar 当前雇主材料和披露反复说明，公司提供符合
              ACA 的大团体主医疗覆盖，包括 Florida、Georgia 和 Ohio 的全额承保计划，以及面向自筹资金雇主的 ASO 和 TPA
              服务。这意味着纳入支出不是整个美国医疗经济，甚至也不是全部商业保险预算。真正相关的支出落在雇主团体覆盖内部，尤其是愿意围绕透明本地价格、会员比价和替代网络逻辑重塑计划经济性的细分市场。历史遗留的固定赔付或例外福利产品只能放在替代品和历史邻近集合中，因为
              Sidecar 自身披露称 Access Plan 已不再提供。现实中的现状对照集合是传统 PPO、HMO、HDHP、准自筹资金 以及其他基于网络的雇主计划，再加上
              ICHRA、高绩效或参考定价设计等邻近替代方案；它们争夺的是同一场成本控制讨论。
