      - number: '2.5'
        title: 尽调缺口与应在承保中保留的矛盾证据
        blocks:
          - type: paragraph
            body: >-
              最大未解问题不是市场是否存在，而是未来几年 Sidecar 真正能拿到其中多少。公开数据能清楚衡量广义雇主覆盖、自筹资金渗透率、ICHRA
              增长和雇主对替代计划设计的一般兴趣，但没有把透明主医疗团体计划隔离成一个独立类别。因此，本章保留多个视角，而不是把它们压成一个 TAM。Sidecar
              自身结果主张与独立证明之间，也存在实质性证据质量缺口。公司披露和营销材料引用更低 ER 使用率、更低保费和强理赔结果，但这些数据点来自内部。近期关于 Sidecar
              特定雇主部署的独立媒体报道很薄，一些可能有用的第三方来源不可用或已过时。最后，直接全额承保产品仍受地域限制，尽管更大的叙事指向通过 ASO
              和自筹资金雇主实现全国机会。因此，承保应把市场吸引力视为真实但仍受证据约束，并要求管理层按雇主细分证明销售管道结构、州扩张计划、顾问拉动和续约结果。
