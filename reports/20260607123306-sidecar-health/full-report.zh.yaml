      - number: '3.3'
        title: 医疗费用分担事工、ICHRA 与现状替代品
        blocks:
          - type: paragraph
            body: >-
              医疗费用分担事工构成一个独立替代层。Sedera Medical Cost Sharing 是会员制社区，参与者自愿按月缴纳金额，用于分摊大额意外医疗费用；它明确不是健康保险，也不带有 ACA
              消费者保护。Liberty HealthShare 是基于信仰的医疗费用分担事工，同样自称社区而非保险公司。两个平台都不保证理赔支付，都不要求遵守州保险牌照规则，也都不提供 Sidecar 在 No
              Surprises Act 下具备的余额账单保护。对寻求纯成本驱动替代品的雇主来说，医疗费用分担 计划在某些配置下可比全额承保保费低 30 to 50%，但会让员工暴露在未保险风险中。个人覆盖
              HRA（ICHRAs）是增长中的邻近替代品：雇主提供固定缴款，员工用它个人购买 ACA 市场计划。50 名及以上全职员工雇主中的 ICHRA 采用率从 2024 到 2025 年上升 34%，Centene 和
              Oscar Health 都在积极扩展面向 ICHRA 的产品。现状 HDHP 仍是主导的员工成本分担工具，不过 McKinsey 数据显示，HDHP 采用增长率从截至 2019 年的年均 17% 收缩到
              2020 至 2023 年的年均 -1%，显示饱和，也显示雇主愿意考虑替代方案。
            claimRefs:
              - CP022
              - CP023
              - CP024
              - CP044
              - CP049
              - CP051
              - CP052
              - CP053
      - number: '3.4'
        title: 分销力量、切换成本与多归属动态
        blocks:
          - type: paragraph
            body: >-
              雇主健康福利分销渠道由顾问、福利经纪人和区域福利顾问主导；他们维护长期承保公司关系，且薪酬常按保费比例计。既有巨头深度嵌入 HR 信息系统、薪资平台和止损安排，形成结构性续约惯性。Sidecar
              的经纪人页面直接承认这一动态，把该计划定位为经纪人的“真正差异化工具”，让他们能向雇主提供降本故事，而不是又一次涨价。Surest 案例研究数据展示了某雇主从第一年 67%
              采用率走到第三年完全替换计划的路径，说明替代计划可以获得深度渗透；但也说明，即使有 UHC 这个既有巨头背书，采用仍是渐进的。McKinsey 2024
              年调查发现，约三分之二雇主希望在四年内更换承保公司，但在年度签约周期、员工扰动风险和顾问推荐摩擦下，切换意愿并不可靠转化为行动。ICHRA
              形成部分多归属动态，雇主可以拆解福利——资助个人会员选择，而不是设计团体计划——如果 ICHRA 采用加速，可能压缩 Sidecar 的可触达池。Koch Industries 选择 Sidecar
              作为超大型雇主覆盖的设计伙伴（100,000+ 名覆盖员工），构成有意义的分销证明点，尤其面向愿意接受计划行为改变的企业。
