      - number: '5.3'
        title: 医疗服务方与经纪渠道集成流程
        blocks:
          - type: paragraph
            body: >-
              医疗服务方通过两条路径与 Sidecar Health 互动。第一条也是最常见的路径，是医疗服务方在服务时直接接受会员用 Visa Benefit Card 全额付款 —— 不需要与 Sidecar Health
              签约。医疗服务方自行定价；Sidecar 的 app 把这些价格展示给会员，作为护理搜索市场的一部分，让医疗服务方无需加入受限网络，也能吸引对价格敏感的患者。第二条路径是医疗服务方可以与 SHIC/SHIS
              签订直接账单协议，直接提交理赔并获得快速报销。面向协议参与方的医疗服务方门户支持注册、账户验证和直接账单。Sidecar
              披露得很清楚：由于不存在合同，为差额账单目的，所有医疗服务方和设施都可被视为网络外；计划仍会支付 Benefit
              Amount，但在非急诊护理中无法阻止医疗服务方就超过该金额的部分向会员收费。这是已披露的结构性取舍，不是隐藏风险。经纪侧，Sidecar Health 由 Director of Broker
              Relations 和覆盖 18 个州的 ICHRA Lead（Tessa Vargas）带领专门的经纪关系团队。经纪渠道包括将 Sidecar 任意医疗服务方模式与传统 PPO
              对比的直播线上研讨会、面向计划上线的线下工作会，以及结构化雇主教育资源。Patrick Reyes（Chief Revenue Officer）负责围绕经纪和雇主渠道搭建的商业化策略。2026
              年中期活动日历既有关于 PPO 与 Sidecar 结构差异的远程线上研讨会，也有一场限 30 人参加的 Atlanta
              半日工作会。这种小班高密度的经纪教育策略，反映出一种咨询式、高触达销售模式，也符合替换雇主传统计划的复杂度。
