  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与产品架构
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health 当前收入模式围绕雇主赞助健康覆盖的两种资金结构展开。主要产品是面向 51 名及以上员工大团体雇主、由 Sidecar Health Insurance Company,
              Inc.（NAIC #17104，注册地 Ohio）承保的全额承保主医疗保险；截至 2026 年 1 月，该产品在 Florida、Georgia、Ohio 和 Texas
              可用。次要且更新的产品，是面向自筹资金雇主健康计划的仅行政服务（ASO）和第三方管理人（TPA）服务，2025 年推出，可覆盖 46 州。在全额承保模式下，Sidecar
              是登记承保方并承担承保风险；收入来自已赚保费。在 ASO/TPA 模式下，Sidecar 从计划发起人处收取行政费用，不承担理赔风险——收入流结构更轻，利润率特征也不同。


              公司历史产品 Access Plan 是面向个人、由 United States Fire Insurance Company 或 SiriusPoint America Insurance Company
              承保的固定赔付例外福利计划，并非由 Sidecar 自身承保。该产品已于 2024 年停售。从 Access Plan 转向雇主主医疗，在经济性上很重要：全额承保雇主产品承担完整承保敞口、ACA
              基本健康福利义务、州偿付能力资本要求和自付上限保护；而 Access Plan 不构成全面覆盖。面向公众的材料现在明确否认历史产品，并把既往描述导向当前符合 ACA 的产品线。


              全额承保和 ASO 两个板块之间的收入结构未披露。Sidecar
              不公开报告已赚保费、保费等价物、行政收入或任何收入科目。承保实体需要向州保险部门（NAIC）提交法定财务报表，但这些文件没有被合并进投资人可获得的公开报告。
