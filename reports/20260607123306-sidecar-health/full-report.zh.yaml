      - number: '7.3'
        title: 伙伴、集中度与依赖风险
        blocks:
          - type: paragraph
            body: >
              Koch Industries 集中风险是 Sidecar Health 故事中最大的单一交易对手风险。Koch Disruptive Technologies 在 2024 年 6 月领投 $165
              million Series D，使 KDT 成为已知最大投资者；Koch Industries 同时承诺担任设计伙伴，覆盖包括 Georgia Pacific 在内的子公司 100,000
              名以上员工。没有其他公开已知雇主作出可比的设计伙伴承诺。Koch 同时占据三种角色：有隐含董事会影响力的投资者、塑造产品路线图的设计伙伴，以及代表大量预期受覆盖人数的潜在锚定客户。治理冲突内生存在：对 Koch
              作为客户最优的决策，未必对 SHIC 偿付能力或非 Koch 雇主最优。如果 Koch 或 KDT 退出或撤回设计伙伴承诺，Sidecar
              失去的不只是潜在旗舰客户，还包括大型雇主细分市场最可信的第三方验证信号，以及最可见的融资证明点。Sutton Bank 是 Sidecar Health Visa 支付卡背后的 OCC
              特许发卡行；每名会员在每家医疗服务方的每笔交易，都流经 Sutton Bank 发卡基础设施。针对 Sutton Bank 的监管行动、伙伴关系终止，或影响健康支付卡的 Visa 网络规则变化，都将迫使
              Sidecar 快速寻找新的发卡行；鉴于雇主集成和会员注册触点，这会是高度扰动的迁移。止损再保险是 ASO/TPA 自筹资金雇主的沉默但关键依赖：如果止损市场收紧，或再保险人退出参考价格定价细分，ASO
              总成本优势会被侵蚀，并可能触发雇主流失回全额承保传统计划。
