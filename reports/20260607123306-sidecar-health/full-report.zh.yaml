figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Sidecar Health 从 2019 年补充型固定赔付产品，推进到 2026 年累计融资约 $328M、覆盖多州的 ACA 雇主保险公司；2021 年的产品转向和承保主体设立，是结构性拐点。
    data:
      items:
        - date: '2018'
          label: 创立
          detail: Patrick Quigley 和 Veronica Osetinsky 围绕现金价格透明度假设共同创立 Sidecar Health。
          tone: positive
        - date: '2019'
          label: Access Plan 发布与 Series A
          detail: 面向个人推出例外福利固定赔付 Access Plan；从 GreatPoint Ventures 融得约 $18M Series A。
          tone: positive
        - date: '2021-01-26'
          label: Series C —— 独角兽状态
          detail: Drive Capital 领投 $125M Series C，估值超过 $1B；公司承诺推出符合 ACA 的产品。
          tone: positive
        - date: '2021'
          label: Ohio 承保主体成立
          detail: 'Sidecar Health Insurance Company, Inc.（NAIC #17104）在 Ohio 注册；首批 ACA 个人计划推出。'
          tone: positive
        - date: '2022'
          label: 首个雇主计划（Ohio）
          detail: 在 Ohio 推出全保险大型团体雇主计划——这一产品如今定义了公司。
          tone: positive
        - date: '2024'
          label: 扩展至 Florida；Access Plan 退出
          detail: 雇主计划扩展到 FL；停止销售 Access Plan。所有收入如今来自 ACA 雇主计划。
          tone: neutral
        - date: '2024-06-27'
          label: Series D 与 Koch 合作
          detail: $165M Series D 由 Koch Disruptive Technologies 领投；Koch Industries 担任大型雇主设计伙伴。
          tone: positive
        - date: '2025'
          label: ASO 推出；覆盖 46 州
          detail: 为自筹资雇主推出 ASO/TPA；会员足迹达到 46 州；Koch 员工获得使用权限。
          tone: positive
        - date: '2026-01-22'
          label: 扩展至 Texas
          detail: 全保险雇主计划扩展到 Texas——美国最大的雇主市场之一。
          tone: positive
    approximationNotes: Series A 和 Series B 金额（约 $18M 和约 $20M）来自第三方报道，尚未通过公司一手新闻稿确认。部分 2022–2023 里程碑的精确日历日期是按年份估计。
