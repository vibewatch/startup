        - 鉴于信息不透明，风险不小；公开记录无法证伪
      - - 基准
        - D 轮因运营进展相对 2021 年标记给出溢价；雇主增长保持中速；NAIC 法定备案显示赔付率尚可但不顶尖；Texas 到 2027 年带来实质增量收入
        - $1.5B–$2.5B；认可模式差异化和 KDT 战略确信，同时扣除完全不透明的折价
        - MLR 恶化，或雇主集中在单一州；盈利前需要后续融资
        - 公开证据下最可辩护的区间；与一家保险公司形态企业完成 $165M D 轮融资的风险投资数学一致
      - - 乐观
        - 私下尽调显示 MLR 和雇主留存强劲；Koch Industries 管线到 2026 年底拿下超大型雇主；按单会员口径看，承保机构经济性接近 Alignment 或 Oscar；2027–2028 年盈利路径可见
        - $2.5B–$4.0B；需要类似 Alignment 的保险公司证据，以及可信的全国扩张路径
        - 仅靠公开证据无法支撑该情景；投资者需要拿到 NAIC 备案和管理层财务数据
        - 只有未披露运营数据显著好于基准假设时才可能成立
    notes: 这些企业价值区间来自可比视角和情景假设估计，不是精确目标。它们不是可投资估值——继续研究建议反映的是缺少收窄分布所需证据。
