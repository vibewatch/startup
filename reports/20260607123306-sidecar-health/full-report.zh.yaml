      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动因素很简单：成本压力。Business Group on Health 将 2026 年雇主健康成本趋势定在 9%，计划设计调整后为 7.6%；Aon 预计为 9.5%，且每名员工计划成本超过
              $17,000。这也是为什么 Mercer 看到超过三分之一的大雇主已经提供替代医疗计划，以及为什么 McKinsey 描述雇主对更换承保公司并节省 10%
              以上有实质兴趣。雇主也被推向导航、质量透明、进阶初级保健和协同护理模式，这让透明计划叙事更可信。但同一批来源也显示出明显采用摩擦。Sidecar 的全额承保地域很窄，模式要求员工更像购物者一样行动；无网络或
              Benefit Amount 设计在服务方价格高于预期报销时会制造焦虑。KFF 自身关于透明度的问题方向上支持这类模式，但远未证明单靠透明度就会实质性削减支出。监管和 ERISA
              结构帮助形成自筹资金路径，同时也让福利设计、州级改革和合规解释继续留在尽调范围内。
