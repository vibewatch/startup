            title: Koch 集中关系既是验证，也带来依赖
            body: >-
              Koch Industries 同时扮演三重角色 —— 通过 Koch Disruptive Technologies 出资、作为大型雇主产品的设计伙伴、也是早期企业客户（员工覆盖从 2025
              年开始）。这种集中度验证了产品在大型雇主规模下可跑通，但也把资本、产品路线图、收入都压在同一个主体上。如果 Koch 重组健康福利策略、缩小由 Sidecar
              覆盖的员工范围，或退出投资关系，三条线都会同时受影响。
