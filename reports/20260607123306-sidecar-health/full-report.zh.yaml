  - id: FV002
    title: 按情景推导企业价值——对假设组合的敏感性
    type: bar
    layout: wide
    summary: 悲观、基准和乐观假设下的示意企业价值区间，以 2021 年 Series C 估值和可比视角为锚。
    data:
      items:
        - label: 悲观情景——2021 年估值标记，未上调
          value: 750
        - label: 基准情景——较 2021 年估值标记适度溢价，KDT 有信心
          value: 2000
        - label: 乐观情景——已披露证据可支撑类似 Alignment 的保险商溢价
          value: 3250
    approximationNotes: 数值取说明性情景区间的中点（悲观 $0.5B–$1.0B、基准 $1.5B–$2.5B、乐观 $2.5B–$4.0B），以百万美元计。 这些不是精确目标；若没有本章列明的尽调输入，不应作为可投资估计使用。
