      - number: '5.5'
        title: 差异化、路线图与成熟度评估
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health 的核心差异化建立在三根支柱上：(1) ACA 合规的主要医疗险保护 —— 完整 OOP max、预防性护理、基本健康福利 —— 且没有网络限制；(2) Benefit Amount
              引擎按本地市场平均费率给医疗服务定价，而不是按协商网络折扣或任意固定金额定价，让会员激励与成本效率对齐；(3) 垂直整合的承保人加管理方结构（SHIC + SHIS），控制从承保到理赔裁定再到会员端 Visa
              卡体验的完整价值链。公司明确对标并反向定位于传统 PPO（不透明的网络定价、预授权）和它过去销售的固定赔付产品（保障不足、非 ACA 合规）。ValuePenguin 当前评论指出 Sidecar
              不再销售个人计划，并确认公司已转向只面向 50 名以上员工公司的雇主团体分发 —— 这是对产品演化定位的独立佐证。Trustpilot 上的第三方情绪（3.3/5，2026 年 2
              月归档）显示用户群两极分化：患复杂疾病且获得全额覆盖的会员给出强正面评价；负面评价则集中在理赔提交复杂、所谓覆盖误导和历时数月的解决周期 —— 这指向两个近期最关键的产品风险：会员教育和运营执行。2026
              年路线图只有部分可见：Texas 于 2026 年 1 月成为第四个全额承保州；GA、KS 和 TX 的 Koch Industries 员工进入 2026 计划年；ICHRA 业务覆盖 18 个州；会员 app
              获得面向 2026 年的新功能，但公司只描述为“更清晰的定价”和“简化每一步的新工具”，没有公开列举具体功能。正式技术路线图、API 文档或产品更新日志都未公开；这与空 GitHub 组织确认的完全闭源姿态一致。
