      - number: '8.2'
        title: 可比基准与估值视角
        blocks:
          - type: paragraph
            body: >-
              Sidecar 的公开可比公司集合并不清晰：公司是一家大型团体主要医疗险承保人，因此更接近管理式医疗，而不是 eHealth 这类保险分销平台，或 GoodRx
              这类药房透明度工具。即便如此，这些相邻公开可比公司仍为市场在经济护城河不清晰时愿意支付的价格设定了硬底线。截至 2026 年 6 月，eHealth 市值 $54.9 million，GoodRx 市值 $890
              million —— 两者都提醒投资者，数字健康中介在 2021 年高点后被重新定价得多么严厉。

              在形态更像保险公司的公开可比中，Oscar Health 最常被引用。截至 2026 年 6 月，其市值为 $7.38 billion，对应 2026 年 2 月约 3.4 million 名个人 / ACA
              会员，隐含每会员约 $2,170。Oscar 的模式主要是 ACA 交易市场，不是大型团体雇主；它现在的规模和财务披露水平，Sidecar 都还没有接近。Alignment Healthcare 市值 $3.17
              billion，Clover Health 约 $2.05 billion USD（C$2.81 billion），两者都是 Medicare Advantage 承保人 —— 风险池和监管制度不同 ——
              但它们说明，只要计划披露强临床和成本结果，投资者会为保险公司级别的倍数付费。Accolade–Transcarent 交易估值 $621 million（约为 Accolade 过去 12 个月收入 $414
              million 的 1.5 倍），展示了导航 / 福利空间定价有多紧；Accolade 在 2024 财年对应这笔收入录得接近 $100 million 净亏损。

              私有可比中，Devoted Health 是最有信息量的基准。它在 2024 年 8 月以 $13 billion 估值融资，对应估计 $3.27 billion 的 2024 年收入、约 466,000 名
              Medicare Advantage 会员，以及披露的 86% 医疗赔付率 —— 这些指标 Sidecar 都没有公开。Devoted
              对比不是同业估值；它说明，私募投资者会为形态像保险公司的企业支付高倍数，但前提是运营证明清晰、规模足够大。Sidecar 的 Series C 在 2021 年 1 月、保险科技公司回调前定在 $1
              billion；任何新投资者都应问的是，未披露的 2024–2026 运营证明，是否足以在同业压缩已经发生的情况下，支撑相对这个陈旧估值标记的显著溢价。
