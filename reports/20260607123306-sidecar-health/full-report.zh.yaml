  - id: FI001
    title: 收入模型桥接 —— 雇主活动如何转化为收入与成本
    type: flow
    layout: standard
    summary: 展示 Sidecar Health 收入链条：雇主签约后，会员就医决策如何传导到全保险模式下的收入确认和理赔结算。
    data:
      nodes:
        - id: employer
          label: 雇主（51+ 名员工）
          description: 与 Sidecar Health 签约，购买全保险综合医疗保险
        - id: premium
          label: 月度保费支付
          description: 雇主向 Sidecar Health Insurance Company 支付 PEPM 保费（费率未披露；公司称比传统方案低 20%）
        - id: carrier
          label: Sidecar Health Insurance Company（NAIC 承保主体）
          description: Ohio 注册承保主体承担风险；收取已赚保费；必须维持法定资本
        - id: member_app
          label: 会员用应用比价医疗服务
          description: 应用在就医前显示每项覆盖服务的 Benefit Amount（当地平均成本）
        - id: care_event
          label: 会员从任意持牌服务方获得护理
          description: 无网络限制；会员在服务时用 Sidecar Visa 卡直接向服务方付款
        - id: claim_submit
          label: 会员提交理赔（明细发票）
          description: 会员通过应用上传明细账单；Sidecar 审核并确认保障范围
        - id: savings_split
          label: 节省或成本结算
          description: 若收费 < Benefit Amount，会员保留节省金额的 50%。若收费 > Benefit Amount，会员支付差额。
        - id: revenue_recognition
          label: 收入按已赚保费确认
          description: Sidecar 按比例确认保费；已发生理赔减少净收入；MLR 是关键经济比率（未披露）
      edges:
        - from: employer
          to: premium
          label: 月度保费支付
        - from: premium
          to: carrier
          label: 已赚保费（总额）
        - from: carrier
          to: member_app
          label: 会员福利卡 + 应用使用权
        - from: member_app
          to: care_event
          label: 比价和护理选择
        - from: care_event
          to: claim_submit
          label: 明细发票提交
        - from: claim_submit
          to: savings_split
          label: 理赔裁定
        - from: savings_split
          to: revenue_recognition
          label: 净理赔成本与保费结算
    approximationNotes: 收入和利润率数字仅作结构示意；Sidecar Health 未披露实际 PEPM 保费、MLR 和管理成本率。该流程代表全保险模式；ASO/TPA 模式会显示收取管理费，而不是保费。
    claimRefs:
      - CI001
      - CI004
      - CI005
      - CI009
      - CI010
  - id: FI002
    title: 单位经济桥接 —— 行为如何传导为保险公司成本下降
    type: flow
    layout: standard
    summary: 这张图追踪 Benefit Amount 透明机制如何改变会员行为，进而降低保险方成本——这正是 Sidecar 模型背后的假设。
    approximationNotes: 所有中间指标（ER 使用率下降、处方渠道转移、节省分成）都来自公司披露的内部理赔数据，尚未经过独立审计。终点（正向承保利润率）由模型设计推导；MLR 未披露。
    data:
      nodes:
        - id: benefit_amount
          label: Benefit Amount 透明度
          description: 会员就医前可看到计划的准确支付额；任何服务、任何提供方的价格都会在 app 中显示
        - id: provider_choice
          label: 会员比价选择提供方
          description: 财务激励推动会员选择低成本提供方；2025 年 78% 的理赔金额不高于 Benefit Amount
        - id: er_shift
          label: ER 使用率下降
          description: 公司称 ER 使用率较 Milliman 2024 年全国平均水平低 45%；低急性度护理被引导到成本更低的场景
        - id: rx_shift
          label: 药房渠道优化
          description: 2024 年 75% 的处方在低成本药房配药；激励机制推动使用仿制药和更具成本效率的渠道
        - id: savings_return
          label: 节省返还会员
          description: Benefit Amount 以下节省额的 50% 返还给会员（2024 年四口之家平均 $1,094）；进一步强化参与度
        - id: lower_claims
          label: 总理赔成本下降
          description: 使用率下降和渠道优化会降低每名会员的总已发生理赔额
        - id: margin_hypothesis
          label: 承保利润率改善（未验证）
          description: 理赔成本相对保费下降，支撑正向 MLR，但 MLR 未披露；该假设尚未验证
      edges:
        - from: benefit_amount
          to: provider_choice
          label: 价格可见推动比价
        - from: provider_choice
          to: er_shift
          label: 选择低成本就医场景
        - from: provider_choice
          to: rx_shift
          label: 选择药房渠道
        - from: provider_choice
          to: savings_return
          label: 低于 Benefit Amount 时返现
        - from: er_shift
          to: lower_claims
          label: 高成本 ER 就诊减少
        - from: rx_shift
          to: lower_claims
          label: 药品支出下降
        - from: lower_claims
          to: margin_hypothesis
          label: 理赔节省流入保险公司经济性
    claimRefs:
      - CI017
      - CI018
      - CI019
      - CI020
      - CI021
