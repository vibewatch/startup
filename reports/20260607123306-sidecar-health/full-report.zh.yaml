      - number: '8.4'
        title: 尽调关口与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              这家公司处在这个阶段，缺失尽调项却异常清晰。Sidecar 是四个州的 ACA 持牌保险承保机构，某些财务披露依法必须提交给州监管，但不会出现在公司公开新闻材料里。完整审查 NAIC
              法定申报——可通过州保险部门门户取得——能拿到已赚保费、已发生赔款、行政费用、法定盈余和综合成本率，不需要公司配合。NAIC
              数据是价值最高的单项缺口：它会告诉投资人，模式在当前规模下是否财务可行，而且可从公开渠道取得。

              法定申报之外，优先尽调问题是：（1）2022–2025 年经审计收入和 MLR，覆盖完整的综合医疗险运营期；（2）按州和计划类型拆分的雇主账户数、会员数和续约率；（3）Series D
              轮投后估值和优先股堆叠条款；（4）Koch Industries 设计伙伴经济条款和排他范围；（5）后续资本计划，因为 January 2026 宣布进入 Texas
              后成为第五个州（Ohio、Georgia、Florida、Texas），多州承保机构需要持续资本满足准备金要求。

              投资逻辑破裂触发点比通常更清楚，因为公司叙事建立在三根支柱上：（a）无网络、给付金额模式足够高效，会员和雇主愿意接受取舍；（b）医疗赔付率足够有竞争力，可在雇主保费水平下产生利润；（c）雇主市场增长足够快，能够抵消跨多州运营承保机构的成本。三者任一开裂——雇主流失加速、MLR
              跑输，或资本要求迫使公司以低估值临时融资——相对 2021 年 Series C 轮溢价的理由都会迅速变弱。
