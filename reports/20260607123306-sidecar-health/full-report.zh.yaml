      - number: '4.3'
        title: 单位经济代理指标与公开牵引力缺口
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health 在面向公众的营销和披露页面发布了几项运营指标，但全部来自公司、由内部理赔数据自报，并且对比的是全国基准，而不是独立审计的同业比较。最重要的主张包括：ER 使用率较 Milliman
              2024 商业保险全国平均值低 45%；75% 处方在更低成本药房配药；78% 理赔让会员拿到现金返还或零成本（2025 全年，不含免赔额）；临床原因拒赔少于 1%（2025 全年）。这些指标与 Benefit
              Amount 模型的核心假设一致——服务点的财务激励推动会员选择低成本护理——但没有经过精算审计、州监管披露或第三方承保审查外部验证。


              市场背景强化了 Sidecar 的成本压力投资逻辑。KFF 2024 Employer Health Benefits Survey 将雇主赞助家庭保费年均值定为 $25,572，同比增长 7%。Aon 预计
              2026 年雇主医疗总成本将上升 9.5%，每名员工超过 $17,000，为连续第三年接近两位数通胀。Business Group on Health 2026 年覆盖 121 家雇主、11.6 million
              人的调查发现，计划设计抵消前的预期成本趋势中位数为 9%。Milliman Medical Index 2025 预计，一个假设四口之家的医疗总成本为
              $35,119。在这种环境下，如果一个计划设计能被证明减少使用率，并推动更有成本意识的行为，应能吸引雇主需求；但缺少续约率数据、留存指标或独立成本研究，意味着现阶段无法独立验证 Sidecar 的超额表现主张。


              公开记录中缺失的内容对承保更关键：Sidecar 不披露收入、ARR、雇主数、会员数、医疗赔付率、毛利率或任何队列级留存数据。ASO
              板块新增行政费收入，但规模未知。没有披露保费或理赔数据的客户案例研究可用。对私营阶段保险公司来说，这些缺口并不罕见，但对任何财务尽调都很关键。
