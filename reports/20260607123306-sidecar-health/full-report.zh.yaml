      - number: '8.5'
        title: 附录
        blocks:
          - type: callout
            title: 继续研究 — 先收集法定申报再形成判断
            body: >-
              继续研究的结论来自信息缺失，而不是否定 Sidecar Health 的模式或市场位置。Ohio、Georgia 和 Florida 的 NAIC
              法定申报可公开取得，会大幅收窄估值分布。愿意调取这些申报并向公司索取 D 轮后条款的投资人，很可能在标准尽调周期内转向明确买入或回避立场。
            calloutType: recommendation
            claimRefs:
              - CV043
              - CV044
              - CV045
              - CV050
          - type: callout
            title: 历史模式转向留下估值连续性缺口
            body: >-
              January 2021 的 $1 billion Series C 轮估值对应的是一家主产品（Access Plan 固定赔付产品）此后已停销的公司。当前符合 ACA
              的大团体综合医疗险承保机构，是一个结构完全不同的业务：监管资本要求、风险池、获客方式都不同。任何把 2021 年估值视为延续基准的投资人，都应意识到，当时估值锚下的底层业务已不再以原形存在。
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV009
              - CV010
          - type: callout
            title: NAIC 法定申报提供局部捷径
            body: >-
              由于 Sidecar Health Insurance Company（NAIC #17104）是 Ohio、Georgia、Florida 和 Texas
              的持牌承保机构，它的法定财务报表会提交给州保险监管机构，并可通过 NAIC 的 iSite+ 或各州部门门户取得。这些申报包含已赚保费、已发生赔款、盈余和综合成本率——不是 GAAP
              收入，但足以在无需公司配合的情况下验证模式经济性。这是投资人在接触管理层之前能做的最高价值公开证据步骤。
            calloutType: insight
            claimRefs:
              - CV043
              - CV044
              - CV049
