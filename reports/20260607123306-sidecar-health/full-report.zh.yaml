  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: standard
    summary: 面向 IC 的七项投资维度评分；每项 1–5 分，5 代表最高确信度。
    data:
      items:
        - label: 市场机会
          value: 4
          note: 雇主需求确有顺风；雇主综合医疗保险的可触达市场很大
        - label: 产品差异化
          value: 4
          note: 无网络、按福利金额给付的模型在结构上有差异；但从旧模式转型会带来噪音
        - label: 财务证据
          value: 1
          note: 未披露收入、MLR 或会员数；证据质量只能给最低分
        - label: 资本效率
          value: 2
          note: 已融资 $328M，但未披露收入；多州保险公司的准备金要求抬高资本强度
        - label: 风险画像
          value: 2
          note: 承保风险、模式转型风险、Trustpilot 摩擦、同业估值压缩——风险高
        - label: 估值支撑
          value: 1
          note: 未披露 D 轮后估值；没有收入分母；可比公司压缩让隐含溢价难以自圆其说
        - label: 证据质量
          value: 2
          note: 融资和模式证据强；经济性缺位；公开法定申报可查，部分缓解证据缺口
    approximationNotes: 评分是作者基于截至 2026-06-07 的公开证据作出的投资判断。1 分表示证据几乎完全缺失，或基本面不利； 5 分表示公开证据支撑强，缺口很少。
    claimRefs:
      - CV001
      - CV009
      - CV010
      - CV032
      - CV039
      - CV040
      - CV050
