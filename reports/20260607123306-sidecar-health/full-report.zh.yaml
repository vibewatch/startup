      - number: '4.2'
        title: 定价、变现机制与市场打法
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health 的核心定价创新是“Benefit
              Amount”——计划为每项覆盖服务支付的金额，按会员所在地区的当地平均护理成本设定。这不同于传统保险公司的网络折扣（在网络内把服务方费率谈到低于标价），也不同于 Access Plan
              的固定赔付模式（不论实际收费多少，都支付固定美元金额）。会员在就医前可通过移动应用透明看到 Benefit Amount。若服务方收费低于 Benefit
              Amount，会员保留一半差额；若服务方收费更高，会员支付差额——由此形成直接财务激励，推动会员比价寻找低成本护理。


              公司称，其计划平均比传统团体健康计划便宜 20%，依据是 2025 年报价与传统团体健康计划对比，并提示具体价格可能不同。45% 更低会员自付成本数字，来自 Sidecar First Dollar
              plan（$3,000 免赔额、无共同保险、无共付额）与典型网络计划（$3,000 免赔额、20% 共同保险、每项覆盖服务 $15 到 $300
              的共付额）的结构性比较。这些是公司计算的结构性对比，不是独立审计的保费或使用率研究。


              分销主要通过经纪人渠道，Sidecar 为经纪人维护专门项目，使其能把产品呈现给雇主客户。公司也直接面向大雇主营销，并与 Koch Industries 结成合作关系，后者作为超大型雇主细分（100,000+
              覆盖人群）的共同设计伙伴。公开披露中没有 CAC、经纪人佣金率或销售周期长度。2026 年 1 月进入 Texas 市场，跟随州监管批准，说明公司继续用 Series D 资本推进地域扩张。
