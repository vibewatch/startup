      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Patrick Quigley 作为 CEO 和联合创始人，是 Sidecar Health 对外最可见的人物；每次投资人新闻稿和公司公告都稳定突出他的履历。他有 20 多年经验，横跨消费者健康险注册（Katch
              CEO，一家线上个人健康计划注册平台）、互联网营销平台（QuinStreet, QNST 创始管理团队）、企业软件（BEA Systems, BEAS 高管）和战略咨询（McKinsey &
              Company）。他的教育背景——The Wharton School MBA、Duke University 工程学 BS——与 Benefit Amount 模型的产品加保险双重架构相匹配。Veronica
              Osetinsky 在关于我们页面上与 Quigley 并列为联合创始人，但她的领导层简历页面返回
              404；任何保留的公开来源都未披露她当前头衔、职能归属和薪酬。这种不对称——一名创始人有详细履历，另一名没有——是治理缺口，不是离职证据，但会限制外部评估创始团队关键人风险。关于我们页面提到董事会构成（列出独立的
              “董事会”和“顾问委员会”板块），但未公开列名任何董事或顾问。投资人董事席位权利、清算优先权和股权比例同样未披露。
