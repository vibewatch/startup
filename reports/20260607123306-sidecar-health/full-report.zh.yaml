            body: >-
              Sidecar Health 没有公开任何量化留存数据（NRR、GRR、流失率或续约率）。Koch Industries 2026
              计划年可用性，是唯一识别到的间接续约证明：它意味着公司的锚定企业客户至少承诺了第二年。会员满意度呈两极分化。Trustpilot 在 2026 年 2 月归档快照中显示 3.3/5
