      - number: '3.2'
        title: 既有承保公司力量与透明计划替代方案
        blocks:
          - type: paragraph
            body: >-
              UnitedHealthcare 既是最大的既有承保公司，也是 Sidecar 最直接类比对象 Surest 的母公司。Surest 提供纯共付设计、就医前价格透明和无免赔额；这一产品架构与 Sidecar
              的消费者驱动模型高度重叠，但背后有 UHC 全国网络支撑，约 1.1 million 名医生和 6,700 家医院，这个分销优势是 Sidecar 作为独立持牌保险公司无法复制的。Surest 可面向 49 州
              51 名及以上员工的雇主提供服务，并称雇主通常节省 7%，会员节省 20 to 40%。BCBS 关联计划覆盖每 3 个美国人中的 1 个，并基于 2025 年 Milliman 研究声称总护理成本比竞争者低
              7%，同时引用与美国 97% 医院的关系。Cigna 隶属于 The Cigna Group，旗下包括 Evernorth 药房福利管理，面向所有雇主规模提供团体覆盖，并整合专科服务。Centivo
              是结构上差异最大的非承保公司竞争者：面向 50 到 3,000 名员工公司的自筹资金计划，取消免赔额，提供免费初级保健问诊，并直接与服务方签约，声称相比被替换计划可节省 15 to 30%。McKinsey
              估计，到 2030 年，约 12 million 商业会员可能在这些类别中转向创新计划设计，约占预计 165 million 会员 商业市场的 7%。
