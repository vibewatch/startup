              - CU015
          - type: callout
            title: Koch 和 Clark Grave Vault 之外的具名客户证据缺口
            body: >-
              Koch Industries 和 Clark Grave Vault 之外没有公开具名雇主客户，这是一个实质性证据缺口。没有独立客户推荐、与生产结果绑定的标识，或披露的雇主数量，就无法评估价值主张能否在
              Koch 关系之外复制。Koch 同时又是投资者和设计伙伴，使集中风险进一步放大，因为其采用决策对公平市场接受度的代表性更弱。
