          - type: callout
            title: 会员故事证据丰富，但需要独立佐证
            body: >-
              Sidecar Health 发布的会员结果故事异常具体（$4M 手术全额覆盖、$70K
              产科事件按免赔额结清、国际急诊返现），为极端场景下的理赔表现提供了具体证据。这些叙事说服力很强，但完全由公司撰写且无法验证。做尽调的投资者应要求访问这些案例背后的理赔数据审计轨迹，并至少与一名会员或医疗服务方交叉确认。
