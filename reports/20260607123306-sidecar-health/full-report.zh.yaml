      - number: '7.2'
        title: 承保、模型与财务风险
        blocks:
          - type: paragraph
            body: >
              Sidecar Health 没有通过任何公开渠道披露 SHIC 的医疗赔付率（MLR）、赔付率、理赔经验或风险资本比率（RBC ratio）。ACA 要求大型团体承保人达到 85% MLR
              下限，未达下限需返还款。由于 SHIC 的 Benefit Amount
              按本地平均成本设定，理论上，当会员持续寻找低成本护理时，该模式可比网络合同计划产生更高利润率，但公开证据无法验证这种动态。逆向选择是持续担忧：Benefit Amount 结构可能吸引预计昂贵手术费用会超过
              Benefit Amount 的高病情复杂度会员，随着时间推移恶化赔付率。2025 年末和 2026 年初的 Trustpilot
              负面评论称，部分手术被归类为“实验性或研究性”并遭拒赔，尽管广告宣称“无需预授权”；公司回复确认，小部分理赔会发生临床审查。这些拒赔会带来投诉暴露、自筹资金计划的 ERISA Section 502(a)
              诉讼风险，以及围绕营销准确性的潜在监管询问。TriplePoint Private Venture Credit 的 Q1 2026 10-Q 文件将给 Sidecar Health
              的增长资本贷款列为活跃组合头寸，确认资本结构中存在杠杆。条款 —— 包括约束条款、加速触发和到期末付款 —— 未公开披露。如果扩张速度或收入增长放缓，杠杆服务压力可能迫使过早股权稀释，或限制可用于满足 SHIC
              RBC 要求的资本。长期模型风险是结构性的：如果价格透明市场向 Benefit Amount 定价收敛，会员节省激励会被侵蚀，相对传统 HMO 的竞争差异会显著收窄。
