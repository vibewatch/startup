      - number: '1.4'
        title: 里程碑、业绩主张与反向背景
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health 的里程碑记录显示，公司在 7 年内从补充型产品概念验证（2019 年 Access Plan）走到受监管承保实体（2021 年），再走到地域扩张中的雇主保险公司（2022–2026
              年）；同时完成约 $328M 已披露融资，并拿下头部企业设计伙伴。2025 年最重要的两个里程碑——ASO/TPA 产品上线和 46 州会员覆盖——说明其可触达市场已经远超全额承保计划运营所在的 4
              个州。业绩指标由公司披露，依赖内部理赔数据：2025 年低于 1% 的临床拒赔率若能独立验证，值得重视，因为典型保险公司拒赔率为 5–20%；78% 理赔带来现金返还或零成本、ER 使用率较 Milliman
              基准低 45%，方向上令人鼓舞，但若要具备高分析权重，需要第三方审计。与许多保险公司阶段企业相比，反向背景更窄：BBB 为位于 El Segundo, CA 的 Sidecar Health Inc.
              保留投诉档案，说明公司已在真实规模上运营，但抓取文本很薄，投诉数量和评级不可见。最持续的结构性反向信号是历史遗留的 Access Plan：线上描述和第三方数据库仍经常把 Sidecar
              误归类为固定赔付计划——公司在会员页面和专门博客文章中明确反驳这一分类——由此产生持续销售摩擦、监管审查风险和潜在消费者混淆，而公司尚未完全消除。
