      - number: '3.5'
        title: 护城河耐久性、商品化风险与反向竞争证据
        blocks:
          - type: paragraph
            body: >-
              Sidecar 的核心护城河是 Benefit Amount
              机制——支付当地平均护理成本，并与选择低成本服务方的会员分享节省——这创造了传统网络计划缺失的真实消费者参与激励；既有巨头若复制，会侵蚀自己的网络经济性，因此难度高。2025 年运营数据点显示，Sidecar
              临床拒赔少于 1%，凸显其相较高度依赖预授权竞争者的结构性差异。但这条护城河有边界。Surest、Centivo 和高绩效既有网络都在透明度和降本主张上竞争。参考定价计划不采用逐项服务 Benefit
              Amount 方法，也能实现类似甚至更高的雇主节省（相对 Medicare 基准节省 10 to 30%）。BCBS 声称其总成本低 7%，并有 Milliman
              研究背书，说明既有巨头的规模和数据优势也能生成可信的成本论点。通过 BBB 可见的消费者投诉数据表明，Sidecar
              和所有保险公司一样，在规模化时会面对会员服务挑战；若理赔体验恶化，会构成声誉风险。资金充足的既有巨头推出类似无网络透明产品的风险是真实的：UHC 已拥有
              Surest，也拥有可广泛部署的分销基础设施。Business Group on Health 的 2026 年雇主调查预计，2026 年医疗成本趋势中位数为
              9%，这会加剧雇主价格敏感度，并扩大替代计划采用窗口——这是 Sidecar 的顺风，但也会推动既有巨头更积极创新和竞争。
