  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              Sidecar Health 运营在美国合规强度最高的行业之一：受 ACA 监管的大型团体雇主健康保险。Sidecar Health Insurance Company（SHIC，NAIC
              #17104）是一家注册地在 Ohio 的承保人，持牌在 Ohio、Georgia 和 Florida 发行全额承保大型团体计划；截至 2026 年 1 月，Texas 正在积极上线，Kansas 出现在
              Koch 员工门户中，但未确认州监管批准。每个州都要求单独的承保人牌照、费率和表单批准，以及持续的市场行为检查。No Surprises Act 部分缓释差额账单风险 —— 急诊服务按 Benefit
              Amount 覆盖，会员没有差额账单 —— 但明确保留医疗服务方在所有非急诊护理中，就其收费与 Benefit Amount 之间差额向会员开账单的权利。Sidecar Health 自己的 No
              Surprises Act 通知写明，“所有医疗服务方和设施都可能被视为网络外”，且“在我们向您支付适用的 Benefit Amount
              后，医疗服务方可以就任何剩余费用向您寄送账单”，确认计划内护理存在结构性差额账单暴露。公司曾经销售、现已停售的固定赔付 Access Plan，带来持续的品牌遗留风险。HHS/DOL/IRS 于 2024 年 3
              月发布的 Final Rule，对固定赔付除外福利计划施加通知要求；2024 年 12 月，一家联邦法院裁决（ManhattanLife Insurance and Annuity Co. v. HHS,
              E.D. Tex.）撤销这些通知要求。尽管 Sidecar 当前产品是 ACA 合规的主要医疗险，不受该规则制定直接约束，但监管动荡放大的市场混淆，增加了会员或监管方误刻画当前产品的风险。Sidecar
              Health 的 Non-Discrimination 通知明确称，其声明“不意味着参与联邦资助项目，也不意味着受 Affordable Care Act Section 1557
              覆盖”，这个不寻常的排除条款值得在尽调中核实民权合规义务范围。HIPAA 和 HITECH 适用于作为受管实体的 SHIC，也适用于作为业务伙伴的 Sidecar Health Insurance
              Solutions, LLC；数据足迹很重 —— SSNs、健康状况、医疗账单图片和 Visa 卡交易记录 —— 因此泄露通知事件会构成实质监管风险。
