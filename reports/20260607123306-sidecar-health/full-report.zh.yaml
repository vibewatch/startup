      - number: '7.5'
        title: 人员、执行与竞争风险
        blocks:
          - type: paragraph
            body: >
              Patrick Quigley 是 Sidecar Health 唯一公开具名的现任高管：每一份投资者新闻稿、公司公告和媒体引语都经由 CEO and Co-Founder 发声。没有公开具名 deputy
              CEO、COO、CFO 或 CTO。联合创始人 Veronica Osetinsky 的领导层履历页面返回
              404；她当前头衔、职能归属和薪酬，在任何留存的公开来源中都未披露。一位创始人有详细履历、另一位没有任何可访问履历，这种不对称是治理缺口，限制了外部对创始团队关键人风险的评估。董事会组成同样不透明：about-us
              页面区分了“Board of directors”和“Board of advisors”两个板块，但两个板块都未公开列出个人姓名。多州执行风险很高：Texas 牌照在 2026 年 1
              月进入上线阶段；Kansas 出现在 Koch 员工门户中，但截至 2026 年 6 月，公开记录中没有确认 TDI 或 KDOI 承保人批准。每个新州都需要州特定费率文件、福利表单批准、雇主注册基础设施和
              Member Care 人员配置 —— 这是一项沉重执行负担，而公司还要同时管理 Koch 设计伙伴关系、扩展 ASO/TPA 服务层，并处理 3.3/5 的 Trustpilot 口碑。来自
              Surest（UHC 子公司，使用类似 Benefit Amount 模型）和参考价格定价 TPA 专家的竞争压力，会带来定价和分销逆风。Surest 拥有 UnitedHealth Group
              的资本、监管经验、网络数据和经纪关系。面对雇主成本疲劳，既有企业可能加快开发价值导向和窄网络产品，缩小与 Benefit Amount 方法的成本差距，从而压缩独立保险公司的可触达市场。
