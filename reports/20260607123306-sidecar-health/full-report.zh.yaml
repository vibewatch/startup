      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health 已在四轮主要融资中披露约 $328 million 股权融资。总计约 $38 million 的种子轮和 Series A 在 2019 至 2020 年搭建起公司。2021 年 1
              月由 Drive Capital 领投，BOND、Tiger Global 和 Menlo Ventures 参投的 $125 million Series C，让公司达到 $1 billion 估值，并资助在
              Ohio 推出 ACA 主医疗产品。最近一轮 $165 million Series D 于 2024 年 6 月完成，由 Koch Disruptive Technologies 领投，GreatPoint
              Ventures、Drive Capital 和 Menlo Ventures 等既有投资人支持；公司称这是当年雇主健康福利领域最大私募投资。资金用途指定为地域扩张（Florida
              在交割后上线）、超大型雇主细分产品开发和运营建设。


              Koch 关系在纯资本之外增加了战略维度。Koch Industries 通过包括 Georgia Pacific 在内的子公司为超过 100,000 名员工提供健康保险，并同意从 2025 年起向部分员工开放
              Sidecar Health 计划，同时担任超大型雇主产品变体的设计伙伴。这让 Koch 同时成为大型战略客户、产品共同开发者，以及通过 Koch Disruptive Technologies
              持股的股权投资人。这种关系集中（投资人、客户和共同设计者合一）既是验证信号，也是依赖风险。


              Series D 后估值未披露。现金头寸、月度烧钱速度或现金跑道估计未披露。公开报道中没有债务或授信额度。作为私营保险公司，Sidecar Health Insurance Company 必须维持 Ohio
              Department of Insurance 以及其持牌各州设定的最低资本和盈余水平；这些法定报表留存在监管机构处，但不向公众开放。公司进入 Texas 以及全国 ASO
              建设，都需要持续投入资本，用于监管牌照、技术、人员和销售。$165M Series D 资本是否足够支撑到下一次融资事件，仍未知。
