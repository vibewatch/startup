  - id: FM001
    title: 市场规模测算视角
    type: pyramid
    layout: standard
    summary: 合适的视角会迅速把范围从美国总医疗支出收窄到雇主赞助保险，再收窄到 Sidecar 真正能触达的自筹资或替代设计切口。
    data:
      items:
        - label: 美国医疗支出外部上限
          detail: CMS 预计 2024 年全国医疗支出增长 8.2%，占 GDP 比重将从 2023 年的 17.6% 升至 2033 年的 20.3%。
          tone: neutral
        - label: 雇主赞助保险基数
          detail: Peterson-KFF Health System Tracker 给出的当前雇主赞助保险覆盖人数为 165.6 million 人。
          tone: positive
        - label: 大型计划控制池
          detail: DOL 和 KFF 均显示，自筹资或混合筹资结构主导大型雇主计划控制权。
