      - number: '2.3'
        title: 买方、付款方与分销机制
        blocks:
          - type: paragraph
            body: >-
              买方不是消费者，也不是为简单附加险比价的小团体经纪人。自然买方是雇主福利组织，通常由 HR
              或整体薪酬福利负责人牵头，财务、顾问，有时还有采购参与，因为计划设计会影响理赔风险、员工缴费和更广的人才策略。对大型自筹资金雇主来说，吸引力在控制权：公司本来就承担理赔风险，也可以评估类 ASO
              替代方案，而不必把员工迁入 ACA 个人市场。全额承保路径下，Sidecar 当前披露把直接机会收窄到位于 Florida、Georgia 或 Ohio
              的大雇主。真正使用的是员工，因为这个模式依赖比价行为、服务方选择，以及愿意按 Benefit Amount
              行事而不是沿用熟悉的网络规则。因此，采用不只靠精算节省，也要靠顾问、经纪人和变更管理工作。雇主会评估这个设计能否降低趋势、改善会员体验，同时仍足够容易理解，让员工能有信心使用。
