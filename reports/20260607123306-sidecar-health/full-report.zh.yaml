      - number: '4.6'
        title: 展示材料
        blocks:
          - type: callout
            title: MLR 不透明是决定性承保阻断项
            body: >-
              没有医疗赔付率，就无法承保 Sidecar Health 的财务故事。公司在全额承保产品中承担完整理赔风险，却没有公开披露理赔发展数据。ACA 大团体 MLR 底线是
              85%；任何低于该比例的结果都需要向雇主返还。任何高于该比例的结果都意味着定价不足。没有这个单一数字，ER 降低、药房迁移、现金返还率等所有效率主张都无法转化为经济预测。
