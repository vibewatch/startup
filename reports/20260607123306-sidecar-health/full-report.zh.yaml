      - number: '6.5'
        title: 扩张路径与集中风险
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health 的客户组合有三重叠加集中风险。第一，具名客户集中：Koch Industries 是唯一公开确认的大型雇主，另一个具名账户（Clark Grave
              Vault）没有披露规模、新闻稿引语之外的结果数据，或持续参保的独立验证。第二，地理集中：全额承保产品只在四个州持牌，限制可触达雇主数量，也让组合对任何单州监管、竞争或经济变化格外敏感。第三，产品集中：在停止个人固定赔付
              Access Plan 后，Sidecar 完全依赖雇主赞助的主要医疗险收入，未公开披露任何附属产品线。与这些风险相对，公司仍有有意义的扩张路径。Texas 上线打开了美国最大的雇主市场之一（16 million
              人劳动力）。Koch 大型雇主设计伙伴关系，为进入 1,000 名以上员工账户提供结构性通道。18 州 ICHRA 足迹，让 Sidecar 在完整保险牌照之前，提前卡位由雇主导向的个人保障安排。BuiltIn
              分析指出，地理扩张遵循正式化的州上线打法，Koch 伙伴关系则把先试点、用定义清晰的 KPI 再扩大部署的方式制度化 ——
              这降低了上线波动，但也限制了近期参保速度。大规模多年度雇主留存的耐久性仍完全未经证明，因为公司最老的市场（Ohio 和 Georgia）没有披露续约队列数据。
