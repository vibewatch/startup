      - number: '2.2'
        title: 市场规模视角，以及为什么单一 TAM 数字会夸大精确度
        blocks:
          - type: paragraph
            body: >-
              可触达市场大到足以重要，但公开证据用的是彼此不兼容的视角。最宽口径下，雇主赞助保险在 2025 年 3 月覆盖 165.6 million 人；KFF 2024 年调查显示，家庭保费平均
              $25,572，单人保费平均 $8,951。这构成了一个极大的雇主出资基数。对 Sidecar 更实用的 SAM 代理，是已经处于自筹资金或混合资金结构中的大雇主控制池：DOL 2026 年附录 B 称，2023
              年此类安排覆盖了大型计划参与者的 81.3%；KFF 称，大公司参保员工中 79% 在自筹资金计划里。再往下一层是替代计划采用本身。Mercer 称，超过三分之一的大雇主已经提供替代医疗计划；McKinsey
              估计，到 2030 年 4 to 14 million 商业会员可能转向创新产品；ICHRA 仍是更小但在增长的邻近渠道，覆盖人数约 0.5 to 1.0 million。这些事实支持分层的
              TAM/SAM/SOM 框架，但不足以给出干净的 Sidecar 专属收入机会，因为发布方没有把透明主医疗团体计划从更大的自筹资金、ICHRA 和替代设计范围中拆出来。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
