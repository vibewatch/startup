      - number: '8.3'
        title: 情景框架和基准假设
        blocks:
          - type: paragraph
            body: >-
              收入、会员数和 D 轮后估值都未披露，情景分析只能倒推：理性投资者在 June 2024 付了什么价格，哪些运营里程碑足以支撑这个价格。Koch Disruptive Technologies 愿意以 $165
              million 领投，说明它相信风险调整后回报有利；但成熟战略投资者有时会为了战略渠道价值接受较低财务回报，纯股权估值因此更难解读。

              悲观情景——对应 $0.5 billion 至 $1.0 billion 的企业价值——以 2021 年 Series C 轮估值为锚，不做上调。它可能对应三种情况：（a）2021
              年以来收入增长很少，因为模式切换打断了市场推广连续性；（b）若披露医疗赔付率，表现只是平均水平而非差异化；或（c）模式转向在内部构成重置事件，引发私营公司降价轮动态。这不是基准预期，但公开记录也无法排除。

              基准情景——对应 $1.5 billion 至 $2.5 billion 的企业价值——假设 Sidecar 在 2021 至 2024 年间扎实完成雇主市场转向，实现了足以让成熟领投方 KDT 认为可相对
              2021 年估值付溢价的收入增长，并走在达成地域和雇主数量里程碑的路上，足以支撑新增 $165 million 资本。这个区间有限参考 Oscar 按会员估值的视角，但套用更低的假设会员基数；它高于
              Accolade 收购价，也明显低于 Devoted 已披露验证所带来的溢价。

              乐观情景——对应 $2.5 billion 至 $4 billion 或更高企业价值——取决于非公开尽调能否证明：雇主留存接近耐久 TPA 经济性，医疗赔付率可与最优秀的透明可比公司竞争，且 Koch
              Industries 渠道能带来一批超大型雇主。该模式的结构性优势——透明给付金额、无需事先授权、会员层面利益共担——如果得到验证，可能支撑溢价倍数。公开记录目前无法支撑乐观情景；它完全取决于非公开证据。

              Sidecar 与导航或分销可比公司（eHealth、Accolade）的关键区别在于，它作为符合 ACA
              的保险承保机构实际承担核保风险。这种风险带来下行波动，倍数必须为此定价；若模式能跑出优秀赔付率，就应享受溢价；反之就应大幅折价。当前公开记录两个问题都没有回答。
