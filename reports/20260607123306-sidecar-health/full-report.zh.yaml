      - number: '6.6'
        title: 展示材料
        blocks:
          - type: callout
            title: Koch Industries 同时是设计伙伴和付费客户
            body: >-
              Koch Industries 的双重角色 —— 既是 Series D 领投方，又为其 100,000 多名员工中的一部分作为付费雇主客户 —— 为 Sidecar Health
              在超大型雇主市场同时提供资本和生产规模验证。第二年续约（sidecarhealth.com/koch 确认 2026 医疗计划选项）是公开可得的最强单一留存信号。
            calloutType: strength
