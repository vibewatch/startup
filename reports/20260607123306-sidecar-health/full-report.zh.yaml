  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - Series D 后估值与股权结构表
        - June 2024 轮后的投后估值、清算优先权堆叠、反稀释条款和董事会构成
        - 不知道优先权结构，就算不出隐含回报或下行保护；$165M 上叠加 2x 或 3x 优先权，会实质改变股权故事
        - 公司 / 法律顾问；早期尽调中直接索取
      - - 经审计收入与医疗赔付率（2022–2025）
        - 按产品和州拆分的 GAAP 收入、医疗赔付率、管理费用率，以及转型后综合医疗保险时期的营业利润或亏损
        - 这些是判断保险承保模式财务可行性的核心数字；没有其他指标能替代
        - 公司；用 Ohio / Georgia / Florida 的 NAIC 法定文件补充
      - - 所有持牌州的 NAIC 法定申报文件
        - 通过州保险部门门户获取 Ohio、Georgia、Florida 和 Texas（如适用）的法定申报；关键项目：已赚保费、已发生赔款、盈余和综合成本率
        - 这是部分替代经审计财务数据的公开证据捷径；可免费获取，并会显著收窄情景分布
        - NAIC / 州保险部门；Ohio Insurance Department 可检索公司申报
      - - 雇主数量与续约队列数据
        - 按州和计划类型拆分的雇主账户总数；按队列和年份的续约率；平均雇主规模和行业组合
        - 续约率是模型能否为雇主持久创造价值的最强信号；集中在单一行业或州会放大下行风险
        - 公司；要求按雇主、按季度提供 2022 至 Q1 2026 数据
      - - 会员数与 Benefit Amount 使用情况
        - 按州和计划类型拆分的覆盖会员数；理赔中产生会员现金返还 vs. 会员自付超额的占比；雇主人群 PMPM
        - 这些指标可建立按会员估值视角，也能验证客服回复中突出提到的 78% 现金返还说法
        - 公司；与 Sidecar Health Insurance Company 的 NAIC 数据交叉核对
      - - Koch Industries / KDT 渠道条款
        - 设计伙伴安排范围、排他条款、收入分成或单案经济性，以及 Koch Industries 全公司雇主推广的任何优先拒绝权
        - Koch Industries 是美国最大私营雇主之一；若安排有实质内容，可触达市场会大幅改变；若不排他或范围有限，Series D 战略溢价会收缩
        - 公司和 KDT；二级公开来源（新闻稿、LinkedIn）不足以评估商业深度
    notes: 尽调问题按缺失证据对估值判断从继续研究推向买入或回避的影响程度排序。NAIC 申报优先，因为无需公司配合即可公开获取。
