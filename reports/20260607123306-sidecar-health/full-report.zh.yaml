chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品模式与地域覆盖
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health 由 Patrick Quigley 和 Veronica Osetinsky 于 2018 年创立，起点是一个简单问题：同一项 MRI，走保险要 $1,300，现金价却只要
              $330，为什么？公司最初推出 Access Plan——面向个人的例外福利固定赔付产品；2021 年在 Columbus, Ohio 成立自有保险承保实体 Sidecar Health Insurance
              Company, Inc.（NAIC #17104）后，公司迅速转向。到 2024 年，Access Plan 已完全停售；今天 Sidecar Health 的全部产品都是面向 51 名及以上员工雇主、符合
              ACA 的主医疗保险。当前两类计划结构分别是由 SHIC 承保的全额承保大团体计划，以及面向自筹资金雇主的 ASO/TPA 安排；二者均由 Sidecar Health Insurance Solutions,
              LLC 管理。无网络、无预授权、无共付额模式为每项覆盖服务设定一个 Benefit Amount，该金额来自当地平均成本；会员用 Sutton Bank 发行的 Sidecar Health Visa
              卡直接向服务方付款，选择低成本护理时保留节省金额的一半，选择高成本护理时自行支付超出 Benefit Amount 的差额。全额承保雇主计划已在 Ohio（自 2022 年）、Georgia（自 2023 年）和
              Florida（自 2024 年）运行，Texas 于 2026 年 1 月宣布上线。官方披露页在本次报告时仍只列出 FL、GA 和 OH，而面向 Koch 员工的门户提到 2026 年覆盖 GA、KS 和
              TX，说明 Texas 和 Kansas 的监管或参保落地节奏仍在推进。
