      - number: '1.3'
        title: 资本结构与投资人图谱
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health 的融资历史从据报 2019 年 $18M Series A 开始，随后是 2020 年 $20M Series B、2021 年 1 月以 $1B 估值完成的 $125M
              Series C，以及 2024 年 6 月的 $165M Series D；截至 Series D 时，累计已披露资本约 $328M。Series C 由 Drive Capital 领投，并引入
              BOND、Tiger Global、Menlo Ventures、Cathay Innovation、GreatPoint Ventures 和 Morpheus 共同投资；Menlo 与 Morpheus
              的投资组合页面都独立确认了 2021 年合作。Series D 由 Koch Disruptive Technologies 领投，GreatPoint Ventures、BOND、Cathay
              Innovation、Drive Capital、Duke University、Menlo Ventures 和 Morpheus 参投。Series D 新闻稿将其定位为 2024
              年“雇主健康福利领域最大私募投资”，这是公司自己的表述；FierceHealthcare 和 MobiHealthNews 也以显著交易规模予以佐证。Koch Industries
              的战略意义不止一张支票：Koch 既通过 KDT 投资，也是 Sidecar 面向超大型雇主覆盖的既定“设计伙伴”；Koch Industries（通过包括 Georgia Pacific 在内的子公司覆盖
              100,000+ 名员工）已承诺从 2025 年起向部分员工开放 Sidecar。Series D 后估值未公开披露；独角兽身份在 Series C（$1B+）时确立，更大的 Series D
              暗示估值标记更高，但没有独立二级市场或媒体报道估值可用于确认或更新该数字。
