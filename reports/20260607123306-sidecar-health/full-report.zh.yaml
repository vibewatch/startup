      - number: '5.4'
        title: 信任、隐私与合规控制
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health 在适合持牌保险公司的多层合规框架下运营。SHIC（NAIC #17104）在 FL、GA、OH 和 TX 获得大型团体主要医疗险牌照并受监管；SHIS 作为 TPA/ASO
              运营，自筹资金雇主计划还受 ERISA 约束。所有主要医疗险会员在急诊服务中受 No Surprises Act 保护：Sidecar Health 的 NSA
              披露明确确认，计划无需预授权即覆盖急诊服务，会员针对网络外急诊护理的费用分担被封顶在免赔额，且禁止此类事件的差额账单。NSA 通知明确不适用于传统 Access Plans（现已停售）。HIPAA/HITECH
              合规适用于三个实体。最后更新于 2026 年 1 月 8 日的 Privacy Statements，管理通过网站、移动 app 和保险服务收集的 PHI；如果与网站隐私政策不一致，HIPAA Notice of
              Privacy Practices（2019 年 6 月生效）优先。HHS Security Rule 框架（45 CFR Parts 160 and 164）要求针对电子 PHI 建立行政、物理和技术保障措施
              —— Sidecar 作为受管实体必须维持这些措施。收集的数据包括社会安全号码、健康状况、医疗账单、生物识别认证偏好和位置数据；Facebook OAuth 登录仍是文档化的登录选项。内部理赔数据指标（发表于
              Disclosures 页面）提供运营质量信号：2025 年 1 月至 12 月，临床拒赔低于 1%；78% 的理赔带来返现或零成本；93%
              的理赔成本低于典型共付额。这些都是公司发布的内部指标，未经过独立审计；NAIC 公司记录（NAIC #17104）确认承保人注册，但截至本次报告日期，尚未浮现可解析的详细赔付率或投诉率数据。
