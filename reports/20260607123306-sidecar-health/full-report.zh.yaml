      - number: '3.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 节省分享机制创造消费者参与，既有巨头若不吞噬自身网络经济性就难以复制
            body: >-
              Sidecar Health 的 Benefit Amount 模型——支付当地平均护理成本，并把会员选择低成本服务方产生的节省 50%
              分享给会员——让会员决策与计划成本实现财务对齐，传统网络计划无法复制。既有巨头建立在服务方合同和谈判费率之上，若复制这一机制，会冲击自己的网络和精算框架。Surest
              会提前展示共付额，但不会把节省重新分配给会员。这一机制既是核心差异，也是其声称降低 20% 成本的结构性来源，因为它重写的是会员激励，而不只是限制准入。
            calloutType: strength
            claimRefs:
              - CP002
              - CP004
              - CP009
              - CP011
              - CP048
          - type: callout
            title: Surest 与 BCBS 的分销深度构成持久既有威胁，Sidecar 当前覆盖无法匹配
            body: >-
              Surest 背靠 UHC 的 235,000 雇主分销基础设施、全国经纪人关系，以及美国最大商业保险公司的精算深度。BCBS 计划覆盖每 3 个美国人中的 1 个，并触达美国 97%
              的医院。这些分销和网络优势意味着，如果 UHC 加深 Surest 的节省分享机制，或 BCBS 推出可比透明产品，Sidecar 就会在其瞄准的关键雇主细分中失去主要差异。BBB 投诉记录显示，Sidecar
              和所有保险公司一样，在规模化时面对会员服务挑战，也给既有巨头提供了反对切换的服务质量论据。
            calloutType: risk
            claimRefs:
              - CP015
              - CP016
              - CP017
              - CP018
              - CP038
              - CP042
          - type: callout
            title: 雇主医疗成本压力是结构性顺风，但也会加速既有巨头创新
            body: >-
              National Business Group on Health 预计 2026 年医疗成本趋势中位数为 9%（计划设计调整后为 7.6%），McKinsey 估计到 2030 年约 12 million
              商业会员可能转向创新计划。成本压力是推动雇主接受 Sidecar 等替代方案的主要引擎。但同样的成本环境也逼迫既有巨头创新——BCBS、UHC 和 Cigna 都已推出降本项目和替代计划设计。Sidecar
              建立市场地位的窗口已经打开，但随着既有巨头加速自身透明计划供给，这个窗口会关闭。
