        - 索取赢单的细分构成，尤其是相对现有承保方和其他替代计划的胜出情况。
      - - 透明度、就医导航和质量导向工具
        - 驱动因素
        - 当前
        - 雇主越来越需要数据、就医导航，并把员工导向高价值服务提供者
        - 按雇主队列索取会员参与率和导航使用率。
      - - 初级保健与照护协调痛点
        - 驱动因素
        - 当前
        - 现状碎片化，让承诺改善协调的模式更有吸引力
        - 索取模型改变 PCP 使用、ER 使用及下游利用率的证据。
      - - 按州铺开的全保险业务版图
        - 约束
        - 当前
        - 直接全保险增长仍受当前已备案地域限制
        - 索取州扩张路线图，以及各市场的监管准备情况。
      - - 员工比价和信任负担
        - 约束
        - 当前
        - 节省取决于会员行为改变，以及对 Benefit Amount 的接受度
        - 索取新雇主群组的激活率、App 参与度和净推荐值数据。
      - - 价格超过 Benefit Amount 时类似网外就医的会员摩擦
        - 约束
        - 当前
        - 即使预期支出更低，提供方匹配差或导航弱，也会拉低员工体验
        - 索取超 Benefit Amount 索赔的升级率、会员投诉和个案管理结果。
      - - 监管与 ERISA 复杂性
        - 约束
        - 当前至中期
        - 自保、混合出资和全保险通道适用规则不同，州层面改革仍在演进
        - 按产品通道索取法律备忘录、备案历史和顾问培训材料。
    notes: 驱动因素和约束绑定在雇主续保经济性、监管和会员行为上，而不是泛泛的医疗增长叙事。
