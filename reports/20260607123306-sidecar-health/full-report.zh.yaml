              2024 年 3 月 Final Rule 和 2024 年 12 月 ManhattanLife 法院撤销令，都指向固定赔付除外福利；Sidecar 已在 2024
              年前停售这一产品类别。监管动荡作为品牌混淆、市场教育负担，以及未来 HHS 可能就参考价格定价模型发布指引的背景是相关的，但它不构成 Sidecar 当前 ACA 主要医疗险雇主计划的直接监管合规风险。
