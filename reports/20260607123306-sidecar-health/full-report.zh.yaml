      - - Clover Health (CLOV)
        - 上市保险公司——Medicare Advantage
        - ~$2.05B USD 市值（June 2026；C$2.81B）
        - 聚焦 MA；曾有监管和治理争议
        - 面临治理或模型可信度问题的保险科技公司的下行参照
        - 仅 Medicare Advantage；Clover 曾受 DOJ 和 SEC 审查，带来 Sidecar 记录中没有的风险折价
      - - eHealth (EHTH)
        - 上市公司 —— 保险分销 / 代理
        - $54.9M 市值（June 2026）
        - 已披露 Q1 2026 收入；多年收入和利润率严重受压
        - 缺乏持久承保方经济性的数字健康保险中介的硬底部参照
