        - 聚焦 ACA 市场；不是雇主主要医疗险；3.4M 会员对比 Sidecar 未披露的雇主业务
      - - Alignment Healthcare (ALHC)
        - 上市保险公司——Medicare Advantage
        - $3.17B 市值（2026 年 6 月）
