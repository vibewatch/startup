      - number: '7.4'
        title: 客户、投诉与运营风险
        blocks:
          - type: paragraph
            body: >
              Sidecar Health 的 Trustpilot 档案在 2026 年 2 月归档快照中显示 3.3/5.0
              的“Average（平均）”评级，呈现强正面与强负面评论并存的双峰分布。负面评论集中在理赔复杂、账单意外和医疗服务方不接受直接付款。一位评论者称，单次就诊的理赔流程需要“数月”解决，未解决账单争议堆积如山，管理这些事务像“第二份工作”。2026
              年 2 月一条负面评论称体验混乱且误导，另一条则描述在无预授权广告下仍遭遇手术拒赔。BBB 投诉记录和 ComplaintsBoard
              联系信息佐证了一个活跃的投诉人群。这些投诉模式重要，有三点原因：第一，OH、GA、FL 和 TX 的保险监管机构会监测相对受覆盖人数的投诉率，当比率超过州阈值时可要求市场行为检查；第二，ERISA Section
              502(a) 赋予自筹资金计划会员针对不当福利拒赔向计划提起联邦诉讼的权利，而会员律师在这一领域越来越活跃；第三，雇主 HR
              部门在决定续约或首次采用时，可能在尽调中看到负面线上评论，给销售周期增加摩擦。隐私文件中还存在合规缺口：Sidecar Health Privacy Policy 页面保留 2021 年 9 月生效日期，而
              Privacy Statements 页面在 2026 年 1 月更新，这会在任何监管检查或诉讼证据开示中制造不确定性，即哪份政策管理 2026 年以前的会员数据。
