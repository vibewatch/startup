              从 Access Plan（固定赔付、个人、补充、非 ACA）转向全额承保的雇主主要医疗险，是收入质量的根本改善。雇主承保产品符合 ACA，来自大型雇主账户的保费收入具备复购属性，也能通过受监管的经纪渠道和
              Fortune 500 雇主的 RFP 流程分发。传统产品在行政上更简单，但结构上受限；当前产品更可扩展，也更适合企业采购资质审查。
