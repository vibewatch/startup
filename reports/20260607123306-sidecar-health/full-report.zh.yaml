  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与会员流程
        blocks:
          - type: paragraph
            body: >-
              Sidecar Health 现有产品线完全由 ACA 合规的大型团体主要医疗险构成 —— 这是一次有意且公开的转向，离开了到 2024 年已停售的传统 Access
              Plan（固定赔付的除外福利保障）。无论计划是通过 SHIC 全额承保，还是通过 SHIS 自筹资金，每个计划都使用 Benefit Amount 机制：针对每项覆盖服务，计划按该 CPT code
              的当地平均成本支付，不取决于会员选择哪家持证医疗服务方。没有服务网络、没有预授权、没有共付额。会员选择成本更低的医疗服务方，可以把部分节省金额作为返现留下；选择成本更高的医疗服务，则只需支付差额。计划包含自付上限、始终覆盖且免计免赔额的预防性护理，以及
              No Surprises Act 对急诊差额账单的保障。核心保险之外，Sidecar 叠加三层服务：(1) 护理搜索协助 —— concierge 团队帮助会员为复杂或手术类流程寻找质量高且价格不高于
              Benefit Amount 的医疗服务方；(2) 护理伙伴计划 —— 为癌症等高复杂度阶段性病症的会员配置专属、实名服务代表；(3) 非计划事件保护 ——
              对计划内护理中发生的医学非计划事件覆盖免赔额之外的费用，比如常规分娩中的急诊剖腹产。嵌在移动 app 里的会员端费用估算器，会在就诊前显示每个覆盖 CPT code 和服务的 Benefit
              Amount，让会员真正能在就诊前比价。这组 ACA 保护、任意医疗服务方自由度、实时成本透明度，是产品相对传统网络计划，以及公司现在明确切割的传统固定赔付产品的核心差异。
