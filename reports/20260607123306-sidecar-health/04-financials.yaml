          description: Member uploads itemized bill via app; Sidecar reviews and confirms coverage
        - id: savings_split
          label: Savings or cost settlement
          description: If charge < Benefit Amount, member keeps 50% of savings. If charge > Benefit Amount, member pays difference.
        - id: revenue_recognition
          label: Revenue recognized as earned premium
          description: Sidecar recognizes premium ratably; claims incurred reduce net income; MLR is the key economic ratio (undisclosed)
      edges:
        - from: employer
          to: premium
          label: Monthly premium payment
        - from: premium
          to: carrier
