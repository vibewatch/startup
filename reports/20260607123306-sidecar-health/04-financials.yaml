  - id: TI002
    title: Pricing and monetization — list mechanics vs. realized economics
    columns:
      - Pricing element
      - Description
      - Source basis
      - Realized vs. list
      - Key unknown
    rows:
      - - Benefit Amount (plan pays)
        - Average local cost for care in the member's geography per covered service; published in the member app before care
        - Company-set based on local market data; methodology undisclosed
        - List mechanism — actual payment equals benefit amount unless care exceeds it
        - How Sidecar sets and updates benefit amounts by CPT/geography; actuary methodology
      - - Member savings sharing
        - Member keeps 50% of the difference when provider charges less than Benefit Amount
        - Company policy; disclosed on disclosures and members pages
        - Creates financial incentive to shop; actual average savings amount is $1,094 per family of 4 in 2024 (company internal)
        - Distribution of savings by service type and geography; adverse selection risk in savings pool
      - - Employer premium (fully insured)
        - Monthly premium collected by Sidecar from employer; size of premium is undisclosed
        - Company pricing model; 20% lower than traditional plans (company claim, 2025 quotes)
        - Realized pricing unknown — 20% claim is company-quoted, not based on disclosed rate filings
        - Actual average PEPM premium by state, employer size band, and plan design
      - - Administrative fee (ASO)
        - Per-member-per-month fee for plan administration in self-funded employer model
        - "Industry standard range for large-group TPA: approximately $15-$50 PMPM (industry benchmark, not Sidecar-disclosed)"
        - Realized fee rate unknown; Sidecar has not disclosed ASO pricing
        - Disclosed ASO fee schedule, expected margin, and total ASO covered lives
      - - Deductible structure
        - Plans offer deductible structures (e.g., First Dollar plan has $3,000 deductible); no coinsurance or copays above deductible
        - Company disclosures and transparency-in-coverage legal document
        - Structural fact — deductible architecture is confirmed; deductible revenue impact (employer liability vs. member) is consistent with ACA rules
        - Actual deductible hit rate per member per year; impact on plan economics and adverse selection
    notes: >-
      All pricing figures are company-sourced. The 20% premium savings claim is an estimated comparison
      from 2025 quote data vs. legacy plans; realized premium and savings will depend on employer
      demographics, state, and plan design. The ASO fee benchmark range ($15–$50 PMPM) is a general
      industry reference from large-group TPA markets, not a Sidecar-specific disclosure. No rate
      filings are publicly available.
    claimRefs:
      - CI009
      - CI010
      - CI011
      - CI014
      - CI015

