    title: Revenue model bridge — how employer activity converts to revenue and cost
    type: flow
    layout: standard
    summary: >-
      Illustrates the Sidecar Health revenue chain from employer contract through member care
      decisions to revenue recognition and claims settlement in the fully insured model.
    data:
      nodes:
        - id: employer
          label: Employer (51+ employees)
          description: Contracts with Sidecar Health for fully insured major medical coverage
        - id: premium
          label: Monthly premium payment
          description: Employer pays PEPM premium to Sidecar Health Insurance Company (undisclosed rate; company claims 20% below traditional)
        - id: carrier
          label: Sidecar Health Insurance Company (NAIC #17104)
          description: Ohio-domiciled carrier underwrites risk; receives earned premium; must maintain statutory capital
        - id: member_app
          label: Member uses app to shop for care
