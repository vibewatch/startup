  - id: FI002
    title: Unit economics bridge — cost-reduction mechanism from behavior to insurer economics
    type: flow
    layout: standard
    summary: >-
      Traces the causal chain from the Benefit Amount transparency mechanism through member
      behavior change to insurer cost reduction — the hypothesis underlying Sidecar's model.
    approximationNotes: >-
      All intermediate metric values (ER reduction, Rx shift, savings share) are company-disclosed
      from internal claims data and have not been independently audited. The endpoint (positive
      underwriting margin) is hypothesized from the model design; MLR is not disclosed.
    data:
      nodes:
        - id: benefit_amount
          label: Benefit Amount transparency
          description: Member sees exact plan payment before care; price shown in app for any service and any provider
        - id: provider_choice
          label: Member shops and compares providers
          description: Financial incentive to choose lower-cost provider; 78% of claims at or below Benefit Amount (2025)
        - id: er_shift
          label: ER utilization reduced
          description: Company claims 45% lower ER utilization vs. Milliman 2024 national average; lower-acuity care redirected to lower-cost settings
        - id: rx_shift
          label: Pharmacy channel optimization
          description: 75% of prescriptions filled at lower-cost pharmacies (2024); incentive drives generic and cost-effective channel use
        - id: savings_return
          label: Member savings returned
          description: 50% of savings below Benefit Amount returned to member ($1,094 average for family of 4, 2024); reinforces engagement
        - id: lower_claims
          label: Lower aggregate claims cost
          description: Reduced utilization and channel optimization reduce total incurred claims per member
        - id: margin_hypothesis
          label: Improved underwriting margin (unverified)
          description: Lower claims cost relative to premium supports positive MLR, but MLR is not disclosed; hypothesis unverified
      edges:
        - from: benefit_amount
          to: provider_choice
          label: Price visibility drives comparison shopping
        - from: provider_choice
          to: er_shift
          label: Lower-cost setting selection
        - from: provider_choice
          to: rx_shift
          label: Pharmacy channel choice
        - from: provider_choice
          to: savings_return
          label: Cash back when under Benefit Amount
        - from: er_shift
          to: lower_claims
          label: Fewer high-cost ER encounters
        - from: rx_shift
          to: lower_claims
          label: Lower drug spend
        - from: lower_claims
          to: margin_hypothesis
          label: Claims savings flow to carrier economics
    claimRefs:
