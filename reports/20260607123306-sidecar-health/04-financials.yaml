company:
  name: Sidecar Health
chapter:
  number: 4
  title: Financials
  summary: >-
    Sidecar Health has completed a deliberate product pivot — from the legacy fixed-indemnity
    Access Plan (individual, discontinued 2024) to ACA-compliant fully insured major medical
    for large group employers (51+ employees) in four states, plus a nationally available ASO/TPA
    offering for self-funded plans launched in 2025. The company has raised approximately $328 million
    in disclosed lifetime capital, most recently a $165 million Series D in June 2024 led by Koch
    Disruptive Technologies. Company-disclosed efficiency claims — 20% lower premiums, 45% lower ER
    utilization, less than 1% clinical denial rate, and 78% of claims resulting in member cash back —
    are directionally compelling but remain company-sourced and unaudited. The critical gap is
    absolute: Sidecar Health discloses no revenue, no ARR, no medical loss ratio, no gross margin,
    no statutory surplus, no cash or runway, and no employer or member count. The result is a
    business model that is mechanically understandable and capital-adequate for near-term operations,
    but not yet underwritable from public evidence alone.

sections:
  - id: revenue-model-and-product-architecture
    title: Revenue model and product architecture
    body: >-
      Sidecar Health's current revenue model centers on two funding structures for employer-sponsored
      health coverage. The primary offering is fully insured major medical insurance for large group
      employers with 51 or more employees, underwritten by Sidecar Health Insurance Company, Inc.
      (NAIC #17104, Ohio-domiciled), available in Florida, Georgia, Ohio, and Texas as of January
      2026. The secondary and newer offering is administrative services only (ASO) and third-party
      administrator (TPA) services for self-funded employer health plans, launched in 2025 and
      available across 46 states. In the fully insured model, Sidecar is the carrier of record and
      bears underwriting risk; revenue consists of earned premiums. In the ASO/TPA model, Sidecar
      collects administrative fees from plan sponsors without bearing claims risk — a structurally
      lighter revenue stream with different margin characteristics.


      The company's historical product, the Access Plan, was a fixed indemnity excepted benefits
      plan for individuals underwritten by United States Fire Insurance Company or SiriusPoint
      America Insurance Company — not by Sidecar itself. This product was discontinued in 2024.
      The transition from the Access Plan to employer major medical is economically significant:
      the insured employer product carries full underwriting exposure, ACA essential health benefits
      obligations, state solvency capital requirements, and out-of-pocket maximum protections,
      whereas the Access Plan did not constitute comprehensive coverage. Public-facing materials
      now explicitly disclaim the legacy product and redirect any prior descriptions to the current
      ACA-compliant line.


      Revenue mix between the fully insured and ASO segments is undisclosed. Sidecar does not report
      earned premium, premium equivalents, administrative revenue, or any revenue line publicly.
      The insured carrier entity is required to file statutory financial statements with state
      insurance departments (NAIC), but those filings are not consolidated into a public report
      available to investors.
