  - id: capital-adequacy-and-financing
    title: Capital adequacy and financing dependency
    body: >-
      Sidecar Health has raised approximately $328 million in disclosed equity financing across
      four major rounds. The seed and Series A totaling approximately $38 million established
      the company from 2019 through 2020. The $125 million Series C in January 2021, led by
      Drive Capital and joined by BOND, Tiger Global, and Menlo Ventures, brought the company
      to a $1 billion valuation and funded the launch of the ACA major medical product in Ohio.
      The most recent $165 million Series D, closed in June 2024 and led by Koch Disruptive
      Technologies with support from existing investors including GreatPoint Ventures, Drive
      Capital, and Menlo Ventures, was characterized by the company as the largest private
      investment in employer health benefits that year. Proceeds were designated for geographic
      expansion (the Florida launch followed the closing), product development for the jumbo
      employer segment, and operational build-out.


      The Koch relationship adds a strategic dimension beyond pure capital. Koch Industries —
      which provides health insurance to more than 100,000 employees across subsidiaries including
      Georgia Pacific — agreed to make Sidecar Health's plan available to a segment of its
      workforce beginning in 2025 and to serve as the design partner for a jumbo employer
      product variant. This makes Koch simultaneously a large strategic customer, a product
      co-developer, and an equity investor through Koch Disruptive Technologies. The concentration
      of that relationship (investor, customer, and co-designer in one entity) is both a
      validation signal and a dependency risk.


      No post-Series D valuation has been disclosed. No cash position, monthly burn rate, or
      runway estimate has been disclosed. No debt or credit facility has been publicly reported.
      As a private insurer, Sidecar Health Insurance Company is required to maintain minimum
      capital and surplus levels set by the Ohio Department of Insurance and each state where
      it is licensed; those statutory statements are on file with regulators but not available
      to the public. The company's expansion into Texas and its ASO national buildout both
      require ongoing capital deployment for regulatory licensing, technology, staffing, and
      sales. Whether the $165M Series D capital remains sufficient through a next financing
      event is unknown.
