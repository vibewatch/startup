callouts:
  - calloutType: risk
    title: MLR opacity is the decisive underwriting blocker
    body: >-
      Sidecar Health's financial story cannot be underwritten without its medical loss ratio.
      The company bears full claims risk in its fully insured product and holds no publicly
      disclosed claims development data. The ACA large-group floor is 85% MLR; any ratio below
      that requires rebating to employers. Any ratio above it indicates pricing insufficiency.
      Without this single number, all other efficiency claims — ER reduction, pharmacy shift,
      cash-back rate — cannot be translated into economic projections.
    claimRefs:
      - CI022
      - CI039
      - CI040

  - calloutType: risk
    title: Koch concentration is both validation and dependency
    body: >-
      Koch Industries occupies three simultaneous roles — equity investor (via Koch Disruptive
      Technologies), design partner for the jumbo employer product, and an early enterprise
      customer (workforce coverage starting 2025). This concentration validates product viability
      at large employer scale but creates single-entity exposure across capital, product roadmap,
      and revenue. If Koch were to restructure its health benefit strategy, reduce its workforce
      segment covered by Sidecar, or exit the investor relationship, all three dimensions would
      be affected simultaneously.
    claimRefs:
      - CI031
      - CI034
      - CI035

  - calloutType: strength
    title: Product transition to ACA major medical materially improves revenue quality
    body: >-
      The shift from the Access Plan (fixed indemnity, individual, supplemental, non-ACA) to fully
      insured employer major medical is a fundamental revenue quality improvement. The insured
      employer product is ACA-compliant, generates recurring premium revenue from large employer
      accounts, and is eligible for distribution through regulated broker channels and RFP processes
      at Fortune 500 employers. The legacy product was administratively simpler but structurally
      limited; the current product is scalable and credentialed for enterprise procurement.
    claimRefs:
      - CI003
      - CI005
      - CI006
      - CI007

  - calloutType: assumption
    title: Capital adequacy assumed adequate through mid-2026; insufficient evidence beyond
    body: >-
      Based on the $165M Series D closed June 2024 and no public indication of distress (no
      layoffs disclosed, four-state regulatory footprint active, Texas launched January 2026),
      Sidecar Health's capital position is assumed to be adequate through at least mid-2026.
      This assumption is not backed by disclosed cash, burn, or runway data and should be
      replaced with audited balance sheet data in any full diligence process.
    claimRefs:
      - CI028
      - CI029
      - CI033

