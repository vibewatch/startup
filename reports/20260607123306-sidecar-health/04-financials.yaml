  - id: TI005
    title: Public financial gaps — missing metrics, impact, and diligence path
    columns:
      - Missing metric
      - Why it matters for underwriting
      - Last known public data
      - Impact if unavailable
      - Exact diligence path
    rows:
      - - Earned premium (fully insured segment)
        - Primary revenue line for the insured carrier; without it no revenue model can be built
        - None publicly disclosed
        - Cannot assess revenue scale, growth, or capital adequacy relative to premium base
        - Request Ohio DOI statutory filing (Annual Statement) for Sidecar Health Insurance Company; or data room
      - - Medical loss ratio (MLR)
        - Most critical insurance metric; measures claims relative to premiums; ACA large group floor is 85%
        - None publicly disclosed
        - Cannot assess claims adequacy, pricing sufficiency, or underwriting risk
        - NAIC market data; direct request for carrier statutory Schedule P (loss development)
      - - Administrative fee revenue (ASO segment)
        - Second revenue line; margin profile differs from insured segment
        - None publicly disclosed
        - Cannot assess total revenue or segment mix
        - Data room request; audited management accounts
      - - Gross margin by segment
        - Determines investment efficiency and path to profitability
        - None publicly disclosed
        - Cannot assess business model economics
        - Audited financial statements; unit economics model from management
      - - Cash position and burn rate
        - Determines actual runway vs. declared capital raise
        - None publicly disclosed; last raise June 2024 ($165M)
        - Cannot confirm capital adequacy beyond nominal raise amount
        - "Data room: audited balance sheet; monthly burn model; next fundraise trigger"
      - - Employer and member count
        - Scale proxy essential for market share assessment and per-member economics
        - 46 states for ASO (company, 2025); no absolute member or employer count
        - Cannot assess penetration, growth rate, or sales efficiency
        - Request current covered lives report by state, product, and plan year
      - - Statutory surplus and RBC ratio
        - State-mandated solvency metric for licensed insurer; required by each state DOI
        - None publicly disclosed; NAIC #17104 active but no public statutory statements
        - Cannot confirm regulatory solvency for multi-state expansion
        - Request Ohio DOI and each state DOI annual statements; check NAIC IRIS ratios
      - - Net revenue retention / employer renewal rate
        - Measures whether employer accounts renew; critical for SaaS-adjacent model assessment
        - None publicly disclosed
        - Cannot assess revenue durability or churn risk
        - Request employer-level renewal cohort analysis by state and plan year
    notes: >-
      All rows represent evidence gaps confirmed as of the 2026-06-07 run date. "None publicly
      disclosed" means no press release, regulatory filing, or third-party report providing this
      data was located during research. The NAIC statutory filing path exists because state-licensed
      insurers must file annual statements, but those filings require state-specific FOIA or
      direct regulatory access and are not available via SEC EDGAR or standard public databases.
