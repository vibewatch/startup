  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: governance-succession
      missingEvidence: Official board roster, named CEO successor, and current executive titles after David Ko's April 2026 step-down.
      whyItMatters: Leadership transition and board composition affect control mapping, succession risk, and partner confidence.
      diligencePath: Request the current org chart, board list, and any board-approved succession or interim-leadership memo.
      relatedQuestionRefs:
        - QO010
        - QO026
      relatedTableRefs:
        - TO002
    - type: private-evidence-only
      severity: material
      topic: subscribers-disclosure
      missingEvidence: Current audited paying-subscriber total, churn and retention, and subscriber mix across direct, app-store, and payer channels.
      whyItMatters: Public sources only show rough 4M signals, which is insufficient for cohort quality, revenue quality, and valuation work.
      diligencePath: Request current paid subscribers, active users, renewal rates, and channel mix from finance or growth analytics.
      relatedQuestionRefs:
        - QO025
      relatedTableRefs:
        - TO001
    - type: conflicting-data
      severity: material
      topic: funding-reconciliation
      missingEvidence: Cap table or financing ledger reconciling whether grants and secondaries are included in total capital raised.
      whyItMatters: Published funding totals vary from about $217M to $225M, which affects dilution history and ownership modeling.
      diligencePath: Obtain a financing schedule listing every equity, grant, and secondary event with proceeds and inclusion rules.
      relatedQuestionRefs:
        - QO014
      relatedTableRefs:
        - TO003
    - type: private-evidence-only
      severity: minor
      topic: privacy-litigation-outcome
      missingEvidence: Public docket, settlement, or regulator filing showing whether the VPPA-style privacy allegations advanced beyond investigation.
      whyItMatters: The allegation is visible, but liability, remediation cost, and reputational impact cannot be sized from the current source set.
      diligencePath: Ask counsel for active claims, demand letters, settlement posture, and any tracking-pixel remediation timeline.
      relatedQuestionRefs:
        - QO023
      relatedTableRefs:
        - TO004
