      - TO001
    figureRefs:
      - FO003
  - id: leadership-governance-and-key-person-risk
    title: Leadership, governance, and key-person risk
    body: >-
      Leadership and governance are in transition. Founders Alex Tew and Michael Acton Smith still anchor the brand
      and were described by CNBC in early 2025 as co-executive chairmen, while the February 2022 Ripple acquisition
      pulled David Ko into the company first as co-CEO and later, per MobiHealthNews, as sole chief executive. That
      sequence matters because Ko was the clearest public operator behind Calm's shift into healthcare distribution.


      The next transition is less resolved. Fast Company reported on April 7, 2026 that Ko stepped down and became a
      senior adviser to the board, but the reviewed official Calm pages do not name a new CEO. Tracxn offers a
      third-party board snapshot with seven members including the founders and investor-linked directors, yet Calm does
      not publish a current board roster in the reviewed first-party source set. Governance visibility is therefore
      materially weaker than brand visibility.


      The key diligence read-through is concentration. The founders still appear central to brand, narrative, and
      chair-level influence; Ko was central to the payer/provider strategy; and no public successor plan is obvious.
      Calm looks operable at scale, but it still appears key-person dependent at exactly the moment its healthcare
      ambitions are broadening.
    claimRefs:
      - CO007
      - CO013
      - CO014
      - CO015
      - CO016
      - CO017
      - CO018
      - CO019
      - CO042
      - CO044
    tableRefs:
      - TO002
  - id: capital-scale-and-stakeholders
    title: Capital, scale, and stakeholder map
    body: >-
      Calm's capital and scale profile is strong by private consumer-health standards, but not perfectly reconciled.
      Public sources still anchor the last clear pricing event at the December 2020 Series C: $75 million at a $2
      billion valuation. The Hustle's 2019 reporting makes Calm a $1 billion unicorn one round earlier, while Sacra,
      Latka, and Tracxn diverge on lifetime capital raised, landing in a roughly $217 million to $225 million band
      depending on grant inclusion and database treatment.


      Operating scale is also only partly observable. Latka reports $596.4 million of 2024 revenue and about 764
      employees by late 2025. Sacra and Expanded Ramblings put the subscriber signal around 4 million paying
      subscribers or users/subscribers, but both stop short of a fresh audited membership count. That is enough to
      frame Calm as large, subscription-led, and mature; it is not enough to underwrite cohort quality, gross margin,
      or retention.


      Stakeholder dependence has shifted. Apple and Google remain crucial consumer distribution surfaces, but the more
      differentiated growth story now runs through Calm Health. Official and partner sources show more than 3,500
      organizations, over 26 million covered lives, and a UnitedHealthcare relationship alone reaching 13 million
      commercial members. That mix increases enterprise relevance while also increasing channel concentration risk.
    claimRefs:
      - CO012
