      - number: '2.4'
        title: 增长驱动、约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              核心增长驱动是广泛需求、职场相关性和与睡眠相连的日常效用。WHO 和 NIMH 数据显示，心理健康需求是大众市场而非小众市场；WHO 关于职场心理健康的指引又把问题直接连到生产力损失。Sleep
              Foundation 提供了有用的品类桥梁，因为睡眠差会恶化心理健康，心理健康问题也会恶化睡眠，这支撑 Calm
              同时横跨正念和睡眠，而不只是冥想。这些驱动解释了为什么雇主和健康计划都能为一个数字工具买单：它从低强度支持开始，在必要时把用户升级到福利体系。


              主要采用约束是信任、证明和渠道经济性。HHS、NIH 和 FTC 材料表明，即使 HIPAA 覆盖是部分或间接的，数字健康 App 也面临不低的隐私、同意和安全预期；2025 年一篇同行评审综述仍强调电子心理健康
              的隐私和监管限制。竞争拥挤也是真实的：Headspace 显示赞助方买家可以选择更宽的端到端平台；应用商店分发意味着免费或免费增值 替代品仍然很多。最大的尽调缺口不是需求是否存在，而是 Calm
              能否以有吸引力的定价和续约率转化赞助方控制预算，因为公开证据仍未披露这些合同经济性。
