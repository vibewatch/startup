  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 消费者基础与参与引擎
        blocks:
          - type: paragraph
            body: >-
              Calm 的原始客户仍是自费消费者，他们下载 App 是为了睡得更好、减轻压力或建立正念习惯。Apple 列表与 Calm 自己的关于页 /
              新闻页合在一起，支持一个具备真实大众市场触达的产品，而不是小众冥想工具：公司仍称下载量超过 180 million、5 星评价超过 3 million、分发覆盖约 190 个国家；Apple 单独在 iOS
              上显示 2 million 条评分、4.8/5。最可辩护的公开订阅者信号仍是间接的。Sacra 描述 Calm 拥有 4 million+ 付费订阅者；Expanded Ramblings 指向 Calm
              职场研究中的 4 million+ 用户或订阅者数据集；但 Calm 自身没有发布最新经审计付费会员总数。


              重复使用证据明显好于原始订阅者精度。Calm 的 Sleep Stories 内容库已经成为形成习惯的界面，而不是一次性新奇功能：支持文档称内容库现在超过 300
              个故事，并且每周新增，提供播放列表或离线收听功能；Bustle 报道称 Sleep Stories 超过 500 个，自推出以来累计收听超过 600 million
              次。这种组合说明睡眠内容具备有意义的消费者粘性，尽管精确流失、留存和订阅者队列仍属私有。
