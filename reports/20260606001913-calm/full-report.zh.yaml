      - number: '8.3'
        title: 情景测算与入场纪律
        blocks:
          - type: paragraph
            body: >-
              情景测算决定 Calm 的不确定性是否可投资。使用较高 Latka 收入数字，旧 $2 billion 标记约等于 3.35x 收入，相比优质内容或订阅可比公司并不离谱。使用较低 Sacra
              基数，同一头部估值约等于 6.67x 收入；对于一家没有申报级披露的私营公司，这开始显得偏贵。公开可比公司测算让问题更尖锐：Duolingo 和 Talkspace 暗示，如果 Calm
              确实配得上那些更高收入倍数，$2 billion 估值大约需要 $0.41 billion 到 $0.48 billion 收入支撑；Hims 则暗示需要约 $0.78 billion 收入，Teladoc
              隐含超过 $6 billion。这些视角都不完美，但合在一起把纪律框得很清楚。关键问题不是抽象地问 Calm 是不是一家好公司，而是今天买方是否有足够证据，证明收入质量、增长韧性、合同结构和融资条款足以让
              2020 年标记继续出清。按当前公开证据，答案仍是否定的。因此，入场纪律意味着把 $2 billion 当作必须重新赚回的上限，而不是可以凭信任接受的地板。
