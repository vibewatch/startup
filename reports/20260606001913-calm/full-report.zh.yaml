      - number: '7.3'
        title: 平台、运营与内容风险
        blocks:
          - type: paragraph
            body: >-
              运营和平台风险仅次于隐私，因为 Calm 的产品仍要走它无法控制的外部通道。Apple 和 Google 掌控旗舰产品的应用分发、应用内计费、隐私披露和审核结果；在审阅的公开记录里，Calm Sleep 仍以
              iOS 为先。这些约束更重要，是因为 Calm 的直接网页结账、iOS 页面和应用推出节奏并不完全一致：公开定价按渠道不同，Calm Sleep 的 Android
              时间也仍然延后。如果任一应用商店要求改披露、改计费或下架某个功能，影响会很快落到获客、转化、续费和客服。


              内容风险对身心健康应用也应排在第一梯队。独立学术综述并不是说心理健康应用没用，但指出证据混杂、常有偏倚，在更严控制或更长周期下说服力下降。这意味着 Calm
              的消费者叙事不能只靠大品类热度；它需要持久留存和结果数据支撑，而这些数据仍未公开。与此同时，Calm Sleep 通过 Apple HealthKit
              和可穿戴集成增加了新的运营复杂度，品牌范围也在扩到硬件、床品和体验式睡眠产品。这些动作叠加，放大了技术面、支持负担和执行质量在公开财务数据暴露问题前滑坡的路径。
