  - id: TV005
    title: 投资逻辑破裂与否决触发因素表
    columns:
      - 触发因素
      - 阈值或事件
      - 重要性
      - 可能行动
    rows:
      - - 收入对账落向低端
        - 尽调显示可持续收入基础更接近 $300M，而不是较高的 2024 年估计。
        - 旧估值从可争辩变成明显偏高。
        - 重设估值预期，或在历史价格上退出。
      - - 订阅者定义偏弱
        - 管理层无法把付费订阅者与雇主覆盖用户或普通用户拆开。
        - 消费者可比倍数更难辩护。
        - 下调到基准或悲观情景，并要求更大折价。
      - - 企业端证明浅
        - 即便有不错的参与度轶事，Calm Health 仍缺乏持久续约或 ROI 证据。
        - 企业端选择权不再支撑溢价叙事。
        - 把 Calm 当作上行弱于乐观派假设的消费者 app。
      - - 融资条款保护投资人
        - 优先权、老股交易或清算堆叠显著削弱普通股经济性。
        - 头条估值可能夸大真实入场质量。
        - 按普通股经济性重定价，而不是按新闻稿估值。
      - - 疫后放缓持续
        - 增长、招聘或成本纪律信号显示，2022 年重置是结构性的，而非暂时性的。
        - 陈旧的 2020 年估值到 2026 年更难成立。
        - 使用悲观情景测算，并要求有效价格显著降低。
    notes: 这些触发因素用于把决策迅速从叙事安慰推向承销现实。
    claimRefs:
