  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              Calm 横跨两个相关但经济属性不同的市场。消费者端，Apple 和 Google 把 Calm 定位为睡眠、冥想和放松
              App，并通过订阅变现，因此它与正念、睡眠和压力管理工具处在同一宽泛考虑集合中。赞助方支持端，Calm Health
              被明确表述为雇主和健康计划赞助的数字心理健康解决方案，提供筛查、临床项目，并转介到福利或外部照护。因此，核心市场不只是「冥想 App」；它是消费者自费健康服务与赞助方出资的中低强度心理健康数字导航的混合体。


              边界纪律重要，因为买方变化时替代品也变化。自费用户可以选择 Headspace、其他健康 App 或免费数字内容。福利负责人可以选择现有
              EAP、保险工具，或打包教练辅导、治疗和精神科的更宽心理健康平台。Headspace 自身企业页面显示，赞助方支持的心理健康市场已经拥挤，买方并非必须购买冥想优先方案。因此，尽调 Calm 时应同时对标消费者
              App 替代品和赞助型心理健康平台；住院精神科、高强度临床照护和一般患病率数据则是重要需求背景，而不是直接收入池。
