      - number: '7.4'
        title: 合作伙伴、客户集中度与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              合作伙伴和客户集中度风险在 Calm Health 内最清楚。该产品定位不像直接面向消费者的应用，更像面向雇主、健康计划和医疗服务方的赞助分发层。公开来源列出了大型渠道：UnitedHealthcare 称
              Calm Health 正面向超过 13 million 名商业会员上线，Magellan 正把部分雇主客户和会员导入该产品，Solera 称 Calm Health
              已加入其雇主与健康计划网络，并且已通过赞助渠道覆盖数千万人。这些都是增长正面因素，但也意味着准入、转介和续约经济性可能集中在少数交易对手手里，而它们的合同并不公开。


              剩余风险不只是一个客户标识可能流失。而是少数支付方、福利平台和雇主赞助方可能同时左右激活量、覆盖人数、临床分流和定价权。公开 Calm Health
              指标显示了一些缓释：筛查和参与数据暗示会员注册后产品并非闲置。但这些仍是公司口径产出，不是完整的集中度或留存图景。因此，在管理层拿出收入结构、续约日历、终止权，以及头部赞助方或中介改变策略后的影响前，投资人应把
              Calm Health 按依赖度很高的渠道业务来承保。
