  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 按竞争者类型划分的格局
        blocks:
          - type: paragraph
            body: >-
              Calm 并不在一条干净赛道中竞争。在 DTC 健康服务里，它面对的是近似产品同业，解决同一个日常任务：帮助用户睡得更好、减轻压力、维持正念习惯。Headspace
              是最直接的同类基准，因为它把冥想和睡眠内容与几乎相同的美国年费标价配在一起。Insight Timer 用免费核心内容库和可选 付费层从低端挤压品类；BetterSleep 以睡眠优先角度竞争，Happier
              则更接近 Ten Percent Happier 建立的正念课程与 教练辅导传统。

              纳入 Calm Health 后，竞争集合明显扩大。Calm Health 不只是卖给雇主的冥想 App；它结合筛查、心理学家搭建的项目、福利导航和自我照护内容。这让它进入与 Headspace 组织业务，以及
              Lyra、Spring Health、Modern Health 等更深雇主平台的竞争。相邻替代品也重要。Apple 和 Peloton 把冥想打包进更宽订阅；BetterHelp
              用在线治疗切入更高强度需求；雇主也仍可坚持传统福利，或拼装点状方案，而不是选择单一心理健康平台。因此，正确读法是分层格局：低摩擦的消费者内容竞争、更高摩擦的雇主平台竞争，以及来自免费或打包健康分发的持续替代压力。
