      - number: '7.5'
        title: 领导层、执行与尽调事项
        blocks:
          - type: paragraph
            body: >-
              领导层和财务模型风险偏高，因为公开记录显示公司在变化，却没有足够运营细节证明韧性。David Ko 2026 年 4 月卸任很重要，因为他是 Calm 近期健康分发推进中最显眼的运营者，而审阅来源没有指出继任
              CEO 姓名。公开报道中 Ko 仍担任董事会顾问，这缓和了过渡，但没有消除治理问题。因此，Calm 进入多产品、多渠道阶段时，外界更难确定是谁在日常驱动执行。


              模型风险同样未解，而非看不见。公开定价证明 Calm 有多条计费路径；2022
              年裁员说明管理层已在压力下重置资源。缺失的是能证明重置是否奏效的数据：续费队列、流失率、退款率、网页直销与应用商店的计费结构、Calm Health 的 CAC
              和回本周期，以及新睡眠和授权业务的经济性。因此，最重要的尽调事项是运营层面而非叙事层面。投资人应要求提供现任 CEO 和组织架构图、按收入和覆盖人数拆分的合作伙伴集中度、隐私 /
              控制审计，以及续费质量数据，之后再给增长或平台扩张故事充分权重。
