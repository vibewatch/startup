      - number: '7.2'
        title: 监管、隐私与法律风险
        blocks:
          - type: paragraph
            body: >-
              监管与法律风险是本章排序最高的敞口，因为 Calm 现在同时跨多个隐私制度和产品界面运营。Calm 的主隐私政策覆盖网站、应用、使用行为、已观看视频、设备标识符和定向广告。另行发布的 Calm Sleep 和
              Calm Health 消费者健康政策又把范围扩到可穿戴设备和赞助方关联数据，包括用户选择接入后的睡眠和生物识别数据，以及雇主或健康计划赞助的注册流程。这一点关键在于，华盛顿州《My Health My Data
              Act》对消费者健康数据定义很宽，并要求明确的选择加入同意，不能把同意藏在一般条款里；FTC 指引和数据泄露通知规则也把数据最小化、安全和事件响应的预期抬高。


              最明显的反向信号是 ClassAction.org 2024 年 3 月调查称，Calm 可能向 Meta 分享了订阅者的视频观看详情和 Facebook ID。这不是责任认定，但它对应真实 VPPA
              风险，因为该法提供私人诉讼赔偿并要求单独同意。再叠加 Apple 和 Google
              的隐私披露规则，风险画像就变成：即便技术实现错误范围很窄，也可能外溢为诉讼、应用审核摩擦、赞助方担忧和品牌受损。公开记录仍缺少清晰的技术审计、案卷清单或监管往来材料，所以这个风险必须靠私人尽调厘清，不能靠假设放过。
