      - number: '3.3'
        title: Calm Health 对比雇主心理健康平台
        blocks:
          - type: paragraph
            body: >-
              当买方想要一个有吸引力的低强度前门，并能把会员分诊到既有福利时，Calm Health 的公开定位最强。Calm Health 强调筛查、个性化项目、按福利转介和参与指标；UnitedHealthcare
              的公开页面显示该模型如何在大型健康计划渠道内运作。这在商业上有用，但不等于拥有大型自营治疗、精神科和 教练辅导网络。按已披露规模和临床广度看，Headspace、Lyra、Spring Health 和
              Modern Health 都发布了更强证据，显示更宽雇主覆盖和更完整的照护栈。

              Headspace 称其服务 4,000+ 家组织，拥有 15,000+ 名服务方，覆盖 190+ 个国家，并用大型研究档案支撑产品。Lyra 称其直接服务超过 20 million
              人，并通过合作伙伴和计划为超过 200 million 人提供路径。Spring Health 称其支持覆盖人群超过 20 million，并营销快速服务方匹配和保证 ROI。Modern Health 强调
              200+ 个国家、80+ 种语言，以及灵活 PEPM 或按使用计费。这些披露重要，因为雇主买家评估的不只是内容质量，还包括供应商能否替代或显著跑赢传统 EAP、全球签约，并向财务和福利团队报告可衡量结果。Calm
              Health 仍可以作为附加项或参与层获胜，但公开记录更难支持 Calm 已经拥有企业心理健康预算的论点。
