      - number: '6.4'
        title: 持久性、满意度与集中风险
        blocks:
          - type: paragraph
            body: >-
              满意度替代指标足以支持真实客户基础，但不能消除持久性风险。消费者端，Calm 仍显示 iOS 2 million 条评分、4.8/5，第三方评价聚合也总体正面。赞助方端，Calm Health 官方页面重复
              4.55/5 满意度分数和高筛查或项目参与指标，UnitedHealthcare 则报告其自有用户的症状改善。这些都是有用信号，说明用户进入漏斗后产品能促成参与。


              公开记录在投资者真正需要承销客户质量的问题上弱得多。没有披露 GRR、NRR、流失率、续约率、合同期限、激活会员比例、赞助方定价或 最大客户收入集中度。Sacra 明确提醒，Calm Health 快速
              B2B2C 扩张 会造成对少数大型机构合作伙伴的依赖；UnitedHealthcare 加 Solera 的组合支持这一担忧。消费者摩擦证据也真实存在：BBB 投诉描述重复扣费和支持问题，Forbes
              指出大部分价值位于付费墙 后，取消和退款处理取决于购买渠道。正确读法是采用为正，但持久性证明仍不完整。
