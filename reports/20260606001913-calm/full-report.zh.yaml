  - id: TP005
    title: 切换成本、多栖使用与分发能力图谱
    columns:
      - 买方路径
      - 主要锁定或摩擦
      - 公开证据
      - 可能赢家
      - 对 Calm 的启示
    rows:
      - - 消费者冥想习惯
        - 连续打卡、收藏内容、习惯熟悉度
        - Insight Timer 免费层级、Headspace 同价、Happier 免费下载、Calm 跨渠道定价
        - 多栖用户
        - 硬锁定弱；Calm 必须靠内容质量和品牌赢得复用
      - - 睡眠导向消费者场景
        - 故事 / 声音偏好和睡前习惯
        - BetterSleep 的睡眠优先范围与 Calm Sleep 扩张都瞄准睡前行为
        - 夜间匹配度最高的品牌
        - 睡眠仍是 Calm 最好的消费者护城河，但 BetterSleep 缩小了功能差距
      - - 治疗或中等严重度需求
        - 服务者匹配、护理连续性、保险资格
        - BetterHelp 网络规模和保险方关系；Headspace 临床入口；企业供应商护理栈
        - 临床服务网络
        - 用户需要治疗而非内容时，单靠 Calm 更弱
      - - 雇主附加福利
        - 采购流程、福利沟通、数据报告
        - Calm Health 筛查、转诊路径和 UHC 分发证据
        - Calm 或 Headspace 作为低严重度层
        - 即使不是记录系统，Calm 也能作为福利增强项胜出
      - - 雇主全平台替换
        - 网络广度、实施、结果报告、CFO 审查
        - Lyra、Spring Health 和 Modern 主打 EAP 替代、ROI 和广泛护理
        - 全栈企业平台
        - 买方想让一个平台负责临床结果时，Calm Health 的防御性较弱
      - - 健康计划 / 渠道分发
        - 既有会员关系和福利整合
        - Calm Health 与 UnitedHealthcare 的合作；Lyra 通过合作伙伴和计划切入
        - 装机基础最大的渠道伙伴
        - 分发能抵消直销能力较弱的问题，但伙伴集中会抬高依赖风险
      - - 免费 / 非营利自助护理路径
        - 几乎零成本，切换门槛极低
        - Insight Timer 免费核心、Smiling Mind 免费应用、Humin 免费项目
        - 寻找零价格预防方案的用户或雇主
        - 免费替代品压住了通用正念内容的支付意愿
    notes: 该表比较用户旅程中的切换机制，而不只是品牌间差异；在雇主渠道，分发能力和内部自建现状比消费者订阅更重要。
