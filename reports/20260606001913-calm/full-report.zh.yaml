      - number: '5.2'
        title: 运营与技术架构
        blocks:
          - type: paragraph
            body: >-
              公开可观察的架构是分层运营模型，而不是深度披露的软件栈。在边缘，Calm 通过原生应用商店分发、网页访问和部分伴随设备界面运行，包括 Apple Watch、Apple TV、Wear OS 和 Samsung
              Health。Calm Sleep 增加第二个消费者端点，依托 Apple HealthKit 睡眠数据同步和任务驱动个性化。Calm Health
              增加一条赞助方控制路径：会员通过保险方、雇主或服务方资格进入；完成 PHQ-9 和 GAD-7 筛查及入门引导问题；收到定制计划；在赞助方福利或合作伙伴可用时，可被导入教练辅导、治疗或更高强度转介路径。


              因此，公开可见的是工作流编排，而不是云内部。Calm 披露了 Calm 与 Calm Health 之间的账户连续性、无智能手机用户的网页兜底
              访问、设备最低要求和按福利转介路由。已审阅来源中，它没有公开披露云供应商、API 目录、可用性 SLA，或正式 EHR / SSO
              实施细节。这意味着投资者可以验证用户旅程如何运行，但还无法判断底层集成栈在赞助方之间有多少可复用、可配置或经审计能力。
