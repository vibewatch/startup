        - UHC、Solera、Magellan 或其他头部赞助方流失、重定价，或推广降温
        - 单一赞助方或中介贡献过高的覆盖人群或收入，随后走弱
        - 下调赞助方渠道增长假设，投资前要求集中度保护
      - - 内容有效性 / 参与度
        - 续约走弱、使用下降、退款上升，或结果证据薄弱
        - 队列或赞助方指标显示持久参与度低于计划，或项目没有可衡量收益
        - 下调 LTV 假设，并把公司评级推向更低确信度或继续研究
      - - 领导层交接
        - 未任命 CEO、高管继续离职，或 Calm Health 与 Calm Sleep 归属不清
        - 下一个运营周期内继任仍未解决，或人员流失扩散到产品和 GTM 负责人
        - 要求治理清晰度和继任保护，否则退出
      - - 财务模型质量
        - 账单组合意外、退款激增，或裁员后效率弱于叙事暗示
        - 私有 KPI 披露显示流失、CAC 回本或毛利率显著差于承销假设
        - 重算估值，在拿到新的单位经济证据前暂缓决策
    notes: 否决标准刻意设计为可监测，并服务于投委会尽调；它们把叙事性风险转成真正能打破承销案例的阈值。
    claimRefs:
