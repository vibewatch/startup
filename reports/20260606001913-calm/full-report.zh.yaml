      - number: '3.2'
        title: 消费者同业、价格压力与替代品
        blocks:
          - type: paragraph
            body: >-
              任何认为 Calm 具备广泛定价权的 thesis，都会在直接消费者对比中不舒服。Calm 的直营网流程目前显示 $69.99 年费计划和一次性 $39.99「Calm for Life」优惠，而 App
              Store 仍显示月费 $14.99、年费 $69.99 和终身版 $399.99。Headspace 的 App Store 定价为月费 $12.99、年费
              $69.99，也就是说最干净的直接同业在年费计划上基本平价。Insight Timer 将核心内容库免费、付费版年费 $59.99，压低整个品类；Happier 列出 $99.99 年会员，BetterSleep
              的精确定价则更受促销、地区和平台影响。

              能力宽度也削弱了「Calm 靠内容取胜」的简单叙事。BetterSleep 更窄但睡眠强；Headspace 现在把正念与治疗、教练辅导和 AI 伴侣混在一起；BetterHelp
              处理更临床的治疗需求；Apple Fitness+ 和 Peloton 把冥想包进更宽的健身生态。这让消费者很容易多栖使用。用户可以保留 Calm 来听 Sleep Stories 或维持品牌偏好，同时试用免费的
              Insight Timer 内容，通过既有订阅尝试 Apple 或 Peloton 冥想，或通过 BetterHelp 升级到治疗。换句话说，Calm
              受益于可信品牌和打磨过的睡眠内容，但内容层本身已不再稀缺。市场现在更像打包和发现之争，而不是赢家通吃的冥想品类。
