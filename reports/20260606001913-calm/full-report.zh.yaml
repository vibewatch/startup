  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 历史估值标记与融资背景
        blocks:
          - type: paragraph
            body: >-
              Calm 的估值故事仍从五年前那次融资开始。Tracxn 和 Latka 都把最后一轮公开披露融资停在 2020 年 12 月 Series C；CNBC 在 2025 年 1 月仍称 Calm 是一家估值 $2
              billion 的公司。这一点重要，因为尽管公开记录没有显示 2025 或 2026 年条件下重新定价的新一轮股权融资，头部价格仍是公司叙事的一部分。Calm
              不是死资产：官方网站结账页仍显示年度消费者订阅和一次性终身式方案，Calm Health
              也仍在营销循证项目和可衡量参与度。但估值看的是投资人现在能承保什么，而不只是公司曾按什么价格融资。公开来源没有披露当前股权结构条款、新的老股成交价或更新的融资参照，所以任何入场讨论的起点，都是一个过时的头部估值、普通股经济性不清，而不是新的市场出清价。
