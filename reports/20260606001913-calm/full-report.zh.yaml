      - - Solera 网络扩张
        - 2026 年 1 月新闻稿新增 16M 人，并将官方触达推至 39M+
        - 分发增长很快，但网络交易可能放大覆盖人群，而不带来同等激活
        - 索取激活会员占比和网络到直接客户转化。
      - - 年中席位扩张
        - Partner Portal 允许管理员上传新的资格文件并购买额外覆盖人群
        - 支持现有账户内先落地再扩张的逻辑
        - 索取成熟账户的队列级席位增长、客户 logo 留存和续约提升。
      - - 服务提供方和 EAP 集成
        - LifeStance 和 Magellan 让产品超出单纯正念用例
        - 可能提升买方契合度和治疗转化，但转诊经济性不可见
        - 索取转诊完成、下游使用，以及报销或伙伴经济性。
      - - 消费者分发延伸
