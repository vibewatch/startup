  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源、定价与确认可见度
        blocks:
          - type: paragraph
            body: >-
              Calm 的公开定价界面让基本收入架构容易理解，尽管实际经济性仍不透明。消费者端，Calm 通过直营网页结账和应用商店销售持续访问权，但公开标价并不完全一致。网页结账目前显示 7 天免费试用，之后转为
              $69.99 年费计划，另有一次性 $39.99 Calm for Life 优惠。Apple App Store 则列出月费 $14.99、年费 $69.99 和 $399.99 终身购买；Google
              Play 确认 Android 通过免费下载加应用内购买分发。Calm 随后在 2025 年加入第二个消费者 SKU：Calm Sleep，一个单独 iOS App，年费 $69.99。除 DTC
              订阅外，业务显然也通过 Calm Health 变现：官方雇主、支付方、顾问和合作伙伴门户页面显示，一条渠道驱动的 B2B
              销售动作覆盖自保雇主、健康计划、顾问和有组织群体管理。隐藏的是收入结构和收入确认细节。公开来源没有显示多少来自网页与 应用商店账单、终身或促销价格实际兑现多少，或消费者订阅与 Calm Health
              合同如何比较。
