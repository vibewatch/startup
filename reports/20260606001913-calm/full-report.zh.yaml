      - number: '1.2'
        title: 领导层、治理与关键人风险
        blocks:
          - type: paragraph
            body: >-
              领导层和治理正在交接。创始人 Alex Tew 和 Michael Acton Smith 仍支撑品牌，并在 CNBC 2025 年初报道中被称为联合执行董事长；2022 年 2 月收购 Ripple 则把
              David Ko 带入公司，他先任联合 CEO，后据 MobiHealthNews 报道成为唯一 CEO。这条线重要，因为 Ko 是 Calm 转向医疗分发最清晰的公开操盘手。


              下一轮交接更不明朗。Fast Company 2026 年 4 月 7 日报道称，Ko 已卸任并成为董事会高级顾问，但已审阅的 Calm 官方页面没有点名新 CEO。Tracxn 提供了一份第三方董事会快照，显示
              7 名成员，包括创始人和投资方关联董事；但 Calm 在已审阅的一手来源中没有发布当前董事名单。因此，治理可见度明显弱于品牌可见度。


              关键尽调穿透是集中度。创始人仍然看起来是品牌、叙事和董事长层面影响力的中心；Ko 是支付方 / 服务方策略的中心；公开层面看不到明确接班计划。Calm 在规模上能运转，但在医疗布局拓宽的当口，仍显得依赖关键人物。
