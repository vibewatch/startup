  - id: TV003
    title: 可比估值表
    columns:
      - 可比对象
      - 证据
      - 对 Calm 的启示
      - 局限
      - 状态
    rows:
      - - Duolingo
        - ~$5.08B 市值；~$1.03B 2025 年收入；~4.93x 收入；披露达到监管文件级别。
        - 说明披露强的高质量消费者内容订阅业务仍能拿到怎样的估值。
        - 语言学习不是心理健康，商业化质量也不同。
        - 上市
      - - Hims & Hers
        - ~$6.06B 市值；~$2.35B 2025 年收入；~2.58x 收入。
        - 有规模的订阅健康业务、需求面够宽，可以支撑数十亿美元价值，但倍数远低于热度叙事暗示。
        - 更宽的健康产品组合和公开市场流动性都不同于 Calm。
        - 上市
      - - Talkspace
        - ~$0.87B 市值；~$0.21B 过去十二个月收入；~4.14x 收入。
        - 说明心理健康垂直上市可比公司即使收入基数更小，仍可能拿到溢价倍数。
        - Talkspace 临床属性更强、规模更小，不同于 Calm 的消费者 + 企业混合画像。
        - 上市
      - - Teladoc
        - ~$0.83B 市值；~$2.53B 2025 年收入；~0.33x 收入。
        - 说明增长和叙事重置时，公开市场压缩健康科技资产可以多么残酷。
        - 历史包袱和成熟度让 Teladoc 更像下行情景参照，而非直接运营类比。
        - 上市
      - - Headspace
        - 公开网站显示 4,000+ 家组织；Cigna 发布覆盖 >7M 人；雇主页宣称覆盖教练、治疗、精神科和 EAP。
        - 披露更新分发证明的私有雇主心理健康同业，抬高了 Calm 企业端选择权的证明门槛。
        - 已审阅非付费墙页面没有干净公开估值。
        - 未上市
      - - Unmind
        - 2025 年 $35M Series C，加上 $26M 增长资本；累计融资 >$100M；支持近 3M 名员工。
        - 私有职场同业披露近期融资和员工覆盖规模，说明 Calm 要把故事从“可能”推进到“可定价”，需要什么证据。
        - 只做职场的定位，比 Calm 的消费者 + 企业组合更窄。
        - 未上市
    notes: 本表混合公开可比公司和私有雇主心理健康同业，因为 Calm 位于消费者健康内容、订阅健康和企业心理健康分发之间。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the most decision-useful public and private benchmark buckets for Calm rather than every digital
