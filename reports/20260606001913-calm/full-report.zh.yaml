      - number: '8.2'
        title: 证据栈与可比基准
        blocks:
          - type: paragraph
            body: >-
              公开证据栈在方向上令人鼓舞，但数字不均。Latka 给出的 Calm 2024 年收入为 $596.4 million；Sacra 则把 2023 年收入基数放在低得多的 $300 million，并明确把
              Calm 描述为 COVID 期间暴涨、随后走平的公司。Expanded Ramblings 补充了规模信号，例如超过 180 million 次下载、超过 3,500 家组织、超过 26 million
              覆盖人数，以及超过 4 million 用户或订阅者信号；但即便如此，订阅者措辞也不是干净的付费会员披露。比较组一转向公开市场，市场对模糊性的容忍度迅速消失。Duolingo 和 Hims
              都用清晰收入披露支撑了数十亿美元股权价值；Talkspace，尤其是
              Teladoc，则说明心理健康和虚拟医疗在公开市场压缩时可以有多严酷。聚焦雇主的私营同行从另一个角度强化同一教训：在新一轮融资附近，Headspace 和 Unmind
              发布的合作伙伴覆盖、临床广度或资本形成证据都比 Calm 更新。简言之，Calm 仍有战略相关性，但公开证据比投资人用来支撑接近历史标记付款的基准组更薄。
