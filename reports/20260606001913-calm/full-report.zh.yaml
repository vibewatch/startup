      - - Calm Health
        - 筛查、项目、转诊、自助护理内容、福利导航
        - 3,500+ 家组织和 26M+ 受保人群；13M+ 名 UHC 商业会员
        - 联系销售；无公开 PEPM 标价
        - 雇主、健康计划、提供者；最强具名证据是 UnitedHealthcare
        - 参与度切入点强，但公开记录显示临床深度低于全栈平台
      - - Headspace for Organizations 企业方案
        - 预防加教练、治疗、精神科、AI 伴侣、基于测量的护理
        - 4,000+ 家组织、15k+ 名提供者、190+ 个国家
        - 组织需联系销售；消费者标价公开
        - 雇主主导并全球分发；也受益于大型消费者漏斗
        - 最直接的混合型对手，横跨 Calm 的 DTC 和 B2B 场景
      - - Lyra Health
        - 预防工具、治疗、用药管理、急性护理、家庭支持、协同护理
        - 直接覆盖 20M+ 人；通过合作伙伴和计划覆盖 200M+ 人
        - 仅定制报价
        - 雇主、健康计划、提供者和合作伙伴渠道，包装为 EAP 替代
        - 临床范围远深于 Calm Health 当前披露，企业路径也更宽
      - - Spring Health
        - 匹配、治疗、教练、平台分析、保证 ROI
        - 全球 20M+ 受保人群；<1 天接入；92% 临床改善
        - 仅定制报价
        - 围绕可测结果和节省主张构建的雇主 / 福利主导动作
        - 买方需要财务级 ROI 证据而不是参与内容时，Spring Health 是强劲对手
      - - Modern Health
        - 覆盖自助工具、教练、治疗、危机护理的自适应护理
