        - 冥想、睡眠故事、呼吸练习、音乐及相关自我护理内容的订阅
        - 订阅之外更高急性度治疗、精神科和雇主付费护理
        - 个人买方 / 个人支付方
        - 这是 Calm 的传统自付费类别，也是应用商店里最容易观察的市场边界
      - - 雇主赞助的数字心理健康
        - Calm Health 访问、筛查、临床项目、福利整合，以及导向 EAP 或治疗资源的导航
        - 住院精神科、雇主初级保健和无关身心健康支出
        - HR 或福利买方 / 雇主支付方
        - 这是 Calm Health 雇主页面描述得最清楚的赞助方支持渠道
      - - 健康计划赞助的会员导航
        - 叠加在计划福利上的会员访问、筛查、转介和引导式自我护理
        - 应用之外的完整理赔管理和服务方报销
        - 计划领导层买方 / 保险方支付方
        - UnitedHealthcare 显示 Calm 可以作为计划赞助入口分发，而不只是消费者应用
      - - 广义数字心理健康应用
        - 分析师市场估计中的抑郁、焦虑、压力、身心健康和冥想应用收入
        - 纯身体健康应用和许多线下护理类别
        - 混合买方 / 混合支付方
        - 可作为上限 TAM 视角，但比 Calm 历史冥想核心更宽
      - - 企业身心健康邻近市场
        - 雇主控制的身心健康预算，包括 EAP 和健康福利支出
        - 消费者自付订阅和大多数医疗理赔
        - 福利领导层买方 / 雇主支付方
        - 只有当 Calm 能赢得赞助方预算，而不只是消费者订阅时才相关
      - - 现状方案和免费替代品
        - 传统 EAP、治疗师目录、播客、YouTube、基础睡眠卫生和免费应用层
        - N/A
        - 取决于路径，可能是雇主、计划或消费者
        - 这些替代品压低支付意愿，也解释为什么品类增长不会机械转化为 Calm 收入
    notes: 从狭义消费者订阅到赞助方支持导航和更广义雇主预算邻近市场来界定边界；排除支出标明哪些类别会抬高 TAM，却不能直接映射到 Calm 收入。
