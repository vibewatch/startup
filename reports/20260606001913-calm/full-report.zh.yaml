  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 投资建议的逻辑链是：过时但市场仍在引用的历史估值标记，叠加互相打架的收入证据、上市可比公司倍数大幅分散，以及尚未厘清的融资条款。
    data:
      nodes:
        - id: legacy
          label: 历史估值标记
          detail: 2020 Series C 的 $2B 估值，Jan 2025 CNBC 仍在引用
        - id: proof
          label: 证据缺口
          detail: 收入锚点互相打架，订阅用户 / 企业端披露仍模糊
        - id: comps
          label: 可比区间
          detail: 上市收入倍数从 Teladoc 的 ~0.33x 到 Duolingo 的 ~4.93x
        - id: terms
          label: 条款清单不透明
          detail: 股权结构表、优先权和最新老股交易价格都未公开披露
        - id: result
          label: 继续研究 / 偏高
          detail: 尽调重新跑通之前，旧估值仍未证实
      edges:
        - from: legacy
          to: proof
          label: 必须用证据验证
        - from: proof
          to: comps
          label: 相互牵动
        - from: comps
          to: terms
          label: 缺少条款会低估风险
        - from: terms
          to: result
          label: 导向
    claimRefs:
      - CV001
      - CV002
      - CV009
      - CV015
      - CV018
      - CV021
      - CV024
      - CV027
      - CV045
      - CV047
      - CV048
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: Calm 的 $2 billion 历史估值要站得住，需要多少收入，取决于投资者套用哪组可比倍数，差异极大。
    data:
      items:
        - label: 0.33x Teladoc 式压缩上市倍数
          value: 6.06
        - label: 1.0x 谨慎私募重估情景
          value: 2
        - label: 2.58x Hims 式上市成长倍数
          value: 0.78
        - label: 4.14x Talkspace 式心理健康倍数
          value: 0.48
        - label: 4.93x Duolingo 式优质内容倍数
          value: 0.41
      yAxis:
        label: 支撑 $2B 估值所需收入（USD B）
    approximationNotes: 数值由当前公开市值和近期年收入锚点直接换算倍数得出；未做企业价值调整。
    claimRefs:
