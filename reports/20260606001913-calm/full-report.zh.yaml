  - id: FU001
    title: 消费者到赞助客户旅程图
    type: journey-map
    layout: wide
    summary: Calm 最强的客户动作始于大众消费市场发现，并可延伸到赞助方资助的 Calm Health 路径。
    data:
      items:
        - id: discover
          label: 发现
          actor: 消费者、员工、会员、旅客
          description: 人们通过应用商店、名人 Sleep Stories、媒体报道、雇主福利，或 Hilton 客房电视等合作伙伴界面接触 Calm。
          channels:
            - App Store
            - Calm 新闻室
            - 名人内容
            - Hilton 客房
        - id: trial
          label: 试用 / 访问
          actor: 个人用户或符合资格的赞助会员
          description: 用户要么自行订阅，要么通过雇主、健康计划或组织资格文件激活访问。
          channels:
            - 自费高级版
            - 雇主资格
            - 健康计划访问
        - id: habit
          label: 习惯形成
          actor: 活跃用户
          description: Sleep Stories、每日冥想、播放列表和离线收听创造重复使用行为，让 Calm 在更正式的护理互动之间也有用。
          channels:
            - Sleep Stories
            - 每日内容
            - 播放列表
            - 离线模式
        - id: screen
          label: 筛查和个性化
          actor: Calm Health 用户
          description: 赞助用户完成 GAD-7 和 PHQ-9 筛查，收到个性化项目，并被路由到合适支持层级。
          channels:
            - GAD-7
            - PHQ-9
            - 临床项目
        - id: deepen
          label: 深化 / 续约
          actor: 组织管理员和高需求用户
          description: 组织扩大席位或续约福利；需求更高的用户可被路由到治疗、EAP，或 LifeStance 等提供方合作伙伴。
          channels:
            - Partner Portal
            - 福利转介
            - LifeStance
    approximationNotes: 旅程根据官方分销、内容和合作伙伴来源综合而成；它是概念图，不是实测漏斗。
