      - number: '3.4'
        title: 切换成本、多栖使用、分发权力与护城河风险
        blocks:
          - type: paragraph
            body: >-
              Calm
              的切换成本呈不对称。消费者冥想和睡眠场景中，切换成本低，因为用户可以在免费内容库、应用商店试用、已为其他理由购买的打包订阅，以及面向不同严重程度的相邻治疗产品之间多栖。连续记录、收藏和品牌熟悉度有帮助，但无法形成工作流软件或理赔处理系统那样的硬锁定。替代集合本身就能看到证据：Insight
              Timer 的免费层、Smiling Mind 的免费非营利 App、Humin 的免费科学项目、Apple One 里的 Apple Fitness+，以及 Peloton
              更大的健身会员体系，都让用户容易补充或降级离开独立冥想 App。

              雇主和支付方渠道中的护城河更强，但即便如此，主要保护来自分发和集成，而非专有临床排他性。一旦 Calm Health
              绑定福利导航、合作伙伴转介和报告，就更难被移除；但更大的企业对手已经在营销更深临床覆盖和更广规模。因此反向证据是结构性的，不是戏剧性的：BetterHelp 的 FTC
              和解显示，数字心理健康中的信任可以多快被侵蚀；免费和打包替代品则显示，正念内容可以多快商品化。Calm 在睡眠和
              平静感品牌心智中仍占有有意义份额，但持久性问题现在取决于：在品类分发和照护广度向别处整合之前，这个品牌能否转化为雇主渠道胜利和持续结果差异化。
