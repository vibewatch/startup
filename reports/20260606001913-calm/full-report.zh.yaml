  - id: TP006
    title: 护城河耐久性 / 竞争风险登记
    columns:
      - 护城河或风险判断
      - 支持证据
      - 反向压力
      - 严重度
      - 缓释措施 / 尽调追问
    rows:
      - - Calm 的睡眠品牌是最强直接护城河
        - Calm Sleep 扩张、Sleep Stories 规模和消费者睡眠定位仍有辨识度
        - BetterSleep 和捆绑式健身平台也把睡眠、冥想作为主要产品界面
        - 中
        - 要求提供 Calm Sleep 留存、附加率，以及相对旗舰 Calm 的增量 ARPU
      - - 消费者定价权有限
        - Headspace 年费与 Calm 持平；Insight Timer Premium 更便宜，免费核心也很强
        - 免费和同价竞争者挤压标价上调空间
        - 高
        - 验证 Calm 变现是否来自留存和增购，而非涨价
      - - Calm Health 具备互动价值
        - 筛查、转诊路径和 UHC 结果显示，它能形成有用的低严重度入口行为
        - Headspace、Lyra、Spring 和 Modern 披露了更深的护理能力或更大的企业规模
        - 中高
        - 索取分细分市场的竞争赢 / 输数据，以及转入更高严重度服务的附加率
      - - 企业分发可能构成护城河
        - UHC 让 Calm Health 触达 13M+ 商业会员，Calm 称整体覆盖 26M+ 人
        - 依赖少数大渠道会削弱议价力、抬高集中风险
        - 中
        - 要求披露客户集中度、续约率，以及头部伙伴覆盖人群集中度
      - - 品类信任可能迅速流失
        - FTC 退款计划显示，数字心理健康隐私失误会触发大规模真实赔付
        - 相邻治疗市场的信任损伤，会外溢到寻求雇主信任的健康应用
        - 中
        - 审查 Calm 的数据共享控制、HIPAA 姿态，以及买方面对 BetterHelp 式头条时的异议
      - - 全栈雇主平台会挤掉轻量层
        - Lyra、Spring Health 和 Modern 都主打更宽的临床范围以及可衡量的结果 / ROI
        - 如果买方整合供应商，可能选择更深的平台，再内部加入或捆绑正念内容
        - 高
