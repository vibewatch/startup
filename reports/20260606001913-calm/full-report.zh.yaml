  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与 SKU 图谱
        blocks:
          - type: paragraph
            body: >-
              Calm 的产品定义是工作流特定的，不是泛品类标签。旗舰 Calm App 是面向压力管理、睡眠、放松、呼吸训练和习惯养成的宽消费者入口，通过移动端、网页和联网设备界面交付。它的运营逻辑不只是内容库：App 通过
              Daily Calm、多日项目、打卡、连续记录、呼吸工具和面向睡眠的合集组织重复使用，把用户拉回周期性习惯。公开应用商店和支持界面也显示，Calm 的消费者产品不止冥想，音乐、运动和工作导向课程也叠在同一订阅中。


              Calm 后来把这层宽健康服务拆成更清晰的 SKU。Calm Sleep 于 2025 年 9 月推出，是一款专门睡眠 App，拥有自己的入门引导
              问卷、每日计划、睡眠准备度条、可穿戴设备同步和睡眠特定付费包装。Calm Health 又不同：它仅限邀请，经由雇主、健康计划和服务方分发，从筛查和个性化行动计划开始，而不是开放消费者结账。合在一起，Calm
              现在用一个品牌销售三种运营动作：DTC 订阅、睡眠特定消费者增购，以及赞助方出资的心理健康导航。
