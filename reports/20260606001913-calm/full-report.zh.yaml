  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前收入桥接与结构
        - 经审计或董事会层面的收入历史，以及消费者业务与 Calm Health 的结构。
        - 决定历史估值隐含的是 ~3x、~7x，还是完全不同的倍数。
        - 财务尽调，要求月度桥接和分部拆分。
      - - 留存与利润率质量
        - 付费订阅者留存、毛利率、合同续约和贡献经济性。
        - 区分高质量订阅价值和低质量收入规模。
        - CFO 材料包，加队列和续约分析。
      - - 股权结构表与优先股堆叠
        - 清算优先权、反稀释调整条款、老股交易和各轮稀释。
        - 头条估值未必等于普通股价值。
        - 法务审查章程、投资条款清单和股权结构表。
      - - 近期价格发现
        - 409A 估值、要约收购或近期老股交易。
        - 显示陈旧的 2020 年头条估值在实操中是否仍能成交。
        - 董事会材料或投资人侧老股数据。
      - - 企业端证明
        - Calm Health 的具名客户、合同类型、ROI 和买方推荐。
        - 检验企业端选择权是否配得上溢价倍数。
        - 商业尽调和客户访谈。
      - - 订阅者定义
        - 干净的付费会员数，并与雇主覆盖用户、免费用户拆分。
        - 改变适用可比公司组，也改变收入真实粘性的判断。
        - 与产品和财务负责人复核账单和分析数据。
    notes: 这些问题是把建议从继续研究推向有价格意识的投资决策所需的最低材料包。
