  - id: TV004
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值逻辑
      - 概率信号
      - 关键风险
    rows:
      - - 乐观
        - 收入质量接近 Latka 给出的 $596.4M 锚点，Calm Health 带来可持续增长，投资者仍愿意为品牌订阅平台支付 ~4x 到 5x 收入。
        - 公允价值区间约 $2.4B 到 $3.0B，可支撑或超过历史估值。
        - 有可能，但尽调必须证明更高收入估计可持续，且不是低质量组合。
        - 漂亮头条仍可能掩盖留存弱、企业集中，或难看的优先条款。
      - - 基准
        - 可持续收入更接近 $400M 到 $500M，增长体面但不狂热，买方使用 ~2x 到 3x 的公开成长股倍数。
        - 公允价值约 $0.9B 到 $1.5B，低于历史估值，但不是公司破局。
        - 纯公开信息下最合理，因为它连接乐观和保守收入锚，又不支付全额溢价。
        - 若增长或利润率不及预期，市场仍可能要求更大折价。
      - - 悲观
        - 可变现收入更接近较低的 Sacra 式基准，COVID 提前拉动后增长趋平，买方给 ~1x 到 2x 收入甚至更低。
        - 约 $0.3B 到 $0.6B；若公开市场压缩更严，结果还会更低。
        - 如果 Calm 无法给出更干净的付费订阅者、企业业务和融资条款证据，风险不小。
        - 如果旧估值锚让管理层预期持续过高，重置风险会很快叠加。
    notes: 这些是情景区间，不是当前公允价值主张。它们用于迫使投资者围绕陈旧历史轮保持价格纪律，而不是假装公开材料支持虚假的精确性。
