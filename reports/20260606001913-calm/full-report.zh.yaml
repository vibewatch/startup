        - 审查数据流、同意机制和州法风险敞口
      - - 默认安全设计预期
        - 逆风
        - 当前
        - FTC 指引意味着处理敏感数据的健康 App 要承担更重的产品和合规负担
        - 审查事件历史和内部安全控制
      - - 证据与疗效怀疑
        - 逆风
        - 当前
