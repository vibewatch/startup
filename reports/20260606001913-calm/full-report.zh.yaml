      - number: '5.4'
        title: 信任、安全、隐私、合规与运营风险
        blocks:
          - type: paragraph
            body: >-
              信任控制在数据政策和临床边界上更可见，在传统基础设施披露上较少。Calm 的通用隐私政策覆盖使用数据、App 版本、设备标识符、购买、check-in，以及用户选择链接 Apple HealthKit 和
              Google Health Connect 时的可选数据。单独的消费者健康数据政策于 2025 年 8 月更新，专门针对 Calm Sleep，并提及 Washington 和 Nevada
              消费者健康数据法律、删除和撤回权以及服务提供商使用。Calm Health 的 FAQ 和应用商店页面更进一步，称产品按 HIPAA 和 HITRUST 隐私与安全标准构建。


              临床和安全边界也很明确。Calm Health 描述了心理学家编写的项目，引用 CBT / ACT / DBT
              风格方法，并反复说明产品不能替代医生或治疗师照护。合作伙伴材料强化了这一定位：当筛查显示用户需要超过自助内容时，会把用户导向 教练辅导、治疗或更高强度转介。剩余的产品技术风险是透明度：公开材料证明 Calm
              能筛查、个性化并路由，但没有说明赞助方集成在技术上如何落地、提供什么可用性承诺，或是否发布营销层面 HIPAA / HITRUST 声明之外的第三方安全证明。
