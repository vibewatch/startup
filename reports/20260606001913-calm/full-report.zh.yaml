  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险态势
        blocks:
          - type: paragraph
            body: >-
              Calm 面对的不是单一二元生死威胁，而是一组可能相互强化的相关风险。公开风险中排名最高的是法律和隐私敞口，因为 Calm 自身政策承认广泛的使用、设备、广告、赞助方登记和可选健康数据流；一项公开 VPPA
              风格调查则主张，视频观看行为可能被传输给 Meta/Facebook。第二层是平台和合作伙伴依赖：Apple 和 Google 仍控制旗舰 App 发现、计费、隐私披露和评价结果的有意义份额；Calm
              Health 则依赖健康计划、雇主以及 UnitedHealthcare、Magellan、Solera 等网络触达覆盖人群。


              第三层是执行和模型风险。Calm 已在 2022 年重置成本基数，说明疫情后需求正常化不只是理论下行。与此同时，公司正从单一订阅 App 扩展到 Calm Sleep、支付方 /
              服务方工作流，以及授权硬件、寝具和酒店体验。这种扩张可以帮助增长，但也提高支持质量、合规纪律或管理层专注度被拉伸的概率。因此 观察清单应聚焦隐私升级、应用商店或计费摩擦、合作伙伴集中、流失 /
              续约恶化，以及未解决的 CEO 接班。
