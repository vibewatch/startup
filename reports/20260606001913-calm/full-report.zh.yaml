      - number: '2.3'
        title: 买方、支付方与采用路径
        blocks:
          - type: paragraph
            body: >-
              用户通常是有压力、睡眠、焦虑或轻中度心理健康需求的个人，但支付方往往不是个人。在赞助方支持渠道中，雇主和健康计划付费，会员、员工和家属使用产品。Calm Health
              的雇主页和健康计划页都围绕筛查、引导、福利集成和转介展开，这意味着产品销售时更像一层参与入口，可以把人导入赞助照护，而不只是独立冥想订阅。UnitedHealthcare 的公开描述强化了这一逻辑：Calm
              Health 集成进计划福利，支持 GAD-7 和 PHQ-9 筛查，并可在需要时继续转介到教练辅导或治疗。


              因此，采用路径穿过熟悉度加导航。应用商店存在降低了发现摩擦，因为数百万消费者已经认识 Calm 的品牌和品类。随后，赞助方部署取决于 HR、福利、broker
              或健康计划领导中的预算负责人选择一种方案，在资格建立后激活用户。Calm 的公开赞助方页面给出了积极的参与指标，包括筛查完成率和治疗转化主张，但没有披露准确 PEPM
              定价、续约条款或客户数。这让公开证据在买方—用户—支付方结构上强，在把结构转成精确 SAM 或 SOM 的合同经济性上弱。
