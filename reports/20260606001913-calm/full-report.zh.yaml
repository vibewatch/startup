      - number: '8.4'
        title: 建议、下行触发器与尽调事项
        blocks:
          - type: paragraph
            body: >-
              基于公开信息，最可支撑的建议是继续研究，置信度中、风险评级高，按历史标记看估值立场偏高。乐观情景并非虚构：如果较高收入估计属实，如果 Calm Health 显著改善增长韧性，如果 COVID
              后的重置只是临时成本修正而非结构性平台期证据，Calm
              仍可能配得上溢价。但今天反向逻辑更强，因为公开记录仍缺少关键细节，无法区分一个韧性的订阅与企业平台，和一个靠过时融资光环续命的品牌。下行触发器很具体：又有迹象显示增长在疫情提前释放需求后走平；收入来源无法对齐；没有干净的付费订阅者或企业留存披露；或者融资条款让头部估值的经济含义弱于表面。尽调事项同样具体。投资人在接近旧标记付款前，应坚持拿到当前收入结构、留存、利润率、合同原型、股权结构条款，以及最近任何内部或老股价格发现。在此之前，Calm
              是一家值得进一步理解的公司，不是一个值得按面值接受的价格。
