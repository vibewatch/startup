      - number: '4.2'
        title: 公开牵引力与 GTM 扩张
        blocks:
          - type: paragraph
            body: >-
              最强的公开牵引力信号是分发广度和合作伙伴触达，而不是经审计财务报表。Calm 关于页称旗舰 App 已超过 180 million 下载和 3 million 条 5 星评价，Apple 仍在 iOS
              列表上显示约 2 million 条评分。第三方市场数据再加一层：Sacra 称 Calm 拥有超过 4 million 付费订阅者，结合约 $70 年费标价，意味着在应用商店费用、折扣、税费和任何 B2B
              贡献前，消费者标价收入容量约 $280 million。更重要的增量增长向量是 Calm Health。官方产品和合作伙伴页面，加上 UnitedHealthcare 和 Solera
              公告，支持至少三条机构渠道：大型支付方分发、雇主福利，以及顾问或网络主导的转售。UnitedHealthcare 单独表示，超过 13 million 商业会员及家庭成员可访问；Solera 称网络扩张新增超过
              16 million 人；Calm 自己 2025 年新闻稿称 Calm Health 覆盖 3,500 多家组织和覆盖人群超过 26 million。这些规模标记表明企业 GTM
              正在实质性补充消费者漏斗，但公开 CAC、回本、销售周期和留存数据仍缺失，因此它们只是替代指标，而不是干净的销售效率模型。
