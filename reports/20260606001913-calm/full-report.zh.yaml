      - number: '6.3'
        title: 具名客户证据与证据质量
        blocks:
          - type: paragraph
            body: >-
              公开客户证据足以确立真实采用，但质量不均。最强雇主证据来自 Calm 自己客户故事页面上的具名客户引用：Zendesk 提到其对全球员工队伍有文化相关性；ASICS EMEA 称 Calm
              是对员工有形且易用的预防性福利；Sierra Nevada 表示员工会主动注意到每月 Calm 日历缺失；Parkview Health 用 Calm 为医护人员提供职业倦怠支持。Calm
              现在还有一个公共部门案例研究，客户是 Atlanta Police Department；案例页称约 1,800 名宣誓警员面对常规创伤，该部门推出 Calm Health 是因为它为日常支持「满足所有要求」。


              支付方和服务方证据在分发机制上强于长期经济性。UnitedHealthcare 是最清晰的具名支付方，因为它用自己的声音发布会员访问和症状改善数据。Magellan 显示 EAP 和雇主路由，LifeStance
              确认 Calm Health 被设计为在筛查显示更高需求时，从自助内容升级到治疗和精神科。弱点不是客户存在与否，而是证明深度。大多数具名引用是
              客户证言、访问公告或早期案例研究，而不是多年续约披露、席位扩张历史或账户级收入结果。
