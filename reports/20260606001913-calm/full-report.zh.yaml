    title: 定价 / 包装比较
    columns:
      - 产品 / 方案
      - 公开价格 / 披露情况
      - 免费层级或试用
      - 公开包含内容
      - 启示
    rows:
      - - Calm
        - 网页端年付 $69.99；App Store 还显示月付 $14.99 和终身 $399.99
        - 所审阅网页显示 7 天试用
        - 完整 Calm 内容库，涵盖冥想、睡眠、音乐和运动
        - 年付价格与 Headspace 持平，Calm 不能只靠高端价格信号撑住定位
      - - Headspace
        - App Store 月付 $12.99 / 年付 $69.99
        - 消费者可免费试用并免费下载
        - 冥想、睡眠、教练、治疗入口、AI 伴侣
        - 标价上是最接近的直接基准，临床邻近业务覆盖更宽
      - - Insight Timer
        - 核心产品免费；Premium 年付 $59.99 或月付 $9.99
        - 是
        - 免费内容库、计时器、社区，以及 Premium 课程和离线功能
        - 对 Calm 内容订阅构成最强低价压力
      - - BetterSleep
        - 提供月付、年付和终身方案，但当前准确标价随地区和优惠而变
        - 免费下载，并有阶段性促销
        - 睡眠追踪、故事、声音、冥想、催眠、Premium 功能
        - 用睡眠工具属性竞争，也让公开尽调更难精确比价
      - - Happier Meditation
        - App Store 年费会员 $99.99；另列月付 / 旧版订阅选项
        - 免费下载，部分免费访问
        - 500+ 个冥想、课程和正念计划
        - 标价高于 Calm 和 Headspace，价值主张更集中在高投入正念用户
      - - Peloton App
        - 所审阅公开页面推广应用层级和试用，但抓取输出里的美元金额渲染不完整
        - 30 天免费试用
        - 数千节训练课程，冥想包含在更宽的会员权益里
        - 已为 Peloton 健身付费的买家，可能把冥想视为免费增量价值
      - - Apple Fitness+
        - 月付 $9.99 / 年付 $79.99
        - 免费 1 个月，购买符合条件的设备可免费 3 个月
        - 冥想，加上 12 类训练和个性化推荐
        - Apple 把冥想捆进更宽的健身服务，压低了健康服务定价空间
      - - Apple One
        - 个人 $19.95 / 家庭 $25.95 / Premier $37.95
        - 可试用
        - 将 Fitness+ 与音乐、TV、存储等打包
        - 冥想可能变成捆绑附加项，而不是单独订阅决策
      - - BetterHelp
        - 自费每周 $70-$100；部分保险可覆盖
        - 没有免费治疗层级
        - 消息、聊天、音频、视频、支持小组、练习表和 32,000+ 名服务者
        - 需求严重度和支出都高得多，但会替代那些需要治疗而非正念内容的用户
      - - Calm Health / Lyra / Spring / Modern 企业方案组
        - 公开企业价格大多未披露；Lyra 称定制报价，Modern 称按 PEPM 或用量计费
        - 演示 / 联系销售
        - 筛查、导诊、教练、治疗、精神科、ROI 报告因供应商而异
        - 企业价格不透明抬高尽调负担，也让竞争胜率证据更关键
    notes: 公开价格受渠道影响，且常有促销；企业行应视为披露状态，而非真实合同情况。所审阅的 Peloton 公开页面没有完整渲染会员美元金额。
