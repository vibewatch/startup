        - 顺风
        - 持续
        - 高患病率让品类需求保持广泛，而不是小众
        - 确认哪些高患病率人群与 Calm 真实付费渠道重叠
      - - 职场生产力损失
        - 顺风
        - 持续
        - 焦虑和抑郁拉低生产力时，雇主有预算理由
        - 索取雇主 ROI 和续约数据，不只依赖品类需求
      - - 睡眠与心理健康关联
        - 顺风
        - 持续
        - 睡眠内容给 Calm 提供日常使用入口，通向心理健康需求
        - 测试以睡眠拉新的用户能否转化为付费留存或赞助方使用
      - - 消费者在应用商店的熟悉度
        - 顺风
        - 当前
        - 强品牌和品类熟悉度可能降低赞助方上线后的激活摩擦
        - 按渠道索取激活和 MAU 数据
      - - iOS 集中度
        - 混合
        - 2025-2031
        - 收入集中在 iOS 有利于变现，但也提高平台依赖
        - 审查 Apple / Google 流水占比和利润率敏感性
      - - 隐私和 HIPAA 边界不清
        - 逆风
        - 当前
