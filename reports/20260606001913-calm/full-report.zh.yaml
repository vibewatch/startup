      - CV024
      - CV027
      - CV038
      - CV039
      - CV040
      - CV041
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 哪个收入锚点最终坐实，决定公允价值区间：低端是压缩后的上市医疗健康估值，高端是高溢价订阅估值。
    data:
      items:
        - label: 若可持续收入为 $0.30B
          low: 0.1
          mid: 0.77
          high: 1.48
        - label: 若可持续收入为 $0.45B
          low: 0.15
          mid: 1.16
          high: 2.22
        - label: 若可持续收入为 $0.5964B
          low: 0.2
          mid: 1.54
          high: 2.94
    approximationNotes: 低位采用 Teladoc 式 ~0.33x 收入倍数，中位采用 Hims 式 ~2.58x 倍数，高位采用 Duolingo 式 ~4.93x 倍数。
    claimRefs:
