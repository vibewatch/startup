      - number: '1.3'
        title: 资本、规模与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              Calm 的资本和规模画像按私营消费者健康公司标准很强，但并未完全对齐。公开来源仍把最后一次清晰定价事件锚定在 2020 年 12 月的 Series C：以 $2 billion 估值融资 $75
              million。The Hustle 2019 年报道显示 Calm 早一轮就成为 $1 billion 独角兽；Sacra、Latka 和 Tracxn
              对累计融资额分歧，因是否纳入补助和数据库处理方式不同，大致落在 $217 million 到 $225 million 区间。


              运营规模也只能部分观察。Latka 报告 2024 年收入 $596.4 million，2025 年末约 764 名员工。Sacra 和 Expanded Ramblings 将订阅者信号放在约 4
              million 付费订阅者或用户 / 订阅者附近，但两者都没有给出最新的经审计会员数。上述信息足以把 Calm 定位为大型、订阅驱动且成熟的公司；还不足以承销队列质量、毛利率或留存。


              利益相关方依赖已经转移。Apple 和 Google 仍是关键消费者分发界面，但更有差异化的增长故事现在来自 Calm Health。官方和合作伙伴来源显示，覆盖 3,500 多家组织、覆盖人群超过 26
              million，单是 UnitedHealthcare 关系就触达 13 million 商业会员。这种组合提高了企业相关性，也提高了渠道集中风险。
