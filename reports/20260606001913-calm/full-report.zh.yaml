      - number: '4.4'
        title: 资本充足性与财务结论
        blocks:
          - type: paragraph
            body: >-
              资本充足性是最重要的未解财务问题。最硬的 filing 证据是 Calm 2020 年 12 月 SEC Form D，其中列出总发行规模 $40 million、已售 $39.5 million、26
              名投资者。这与 2020 年末一笔主要融资方向一致，但无法与引用 $75 million Series C 和约 $217 million 至 $225 million
              累计融资的市场数据摘要整齐对上。由于公开现金余额、烧钱速度、现金跑道和债务披露缺失，投资者无法判断 2020
              年融资还剩多少、业务今天是否自我造血，或下一轮融资是战略性还是必要性。反向记录并非灾难性，但也不干净：MobiHealthNews 报道 2022 年约 20% 裁员，公司 2026 年 2
              月上调年费，一个公开隐私调查又给一家高度依赖应用分发和消费者信任的公司增加了一些法律悬而未决风险。因此财务结论是混合的。Calm
              似乎有真实订阅引擎、真实企业分发和足够市场存在感，因此零收入或纯促销故事不成立。但收入估算冲突、融资统计不一致，以及现金和利润率层面披露缺失叠加，意味着公开证据还不足以支撑干净的承销案例。在对收入质量或资本充足性形成高确信观点前，管理层材料仍是必需项。
