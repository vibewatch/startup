      - number: '2.2'
        title: 市场测算视角与矛盾估算
        blocks:
          - type: paragraph
            body: >-
              Calm 的市场规模只能用多个镜头测算，公开层面没有一个干净 TAM。最窄的可比镜头是正念和冥想 App 细分，Future Market Insights 估计 2024 年仅 US$172.3
              million，到 2034 年增至 US$467.6 million。更宽的数字心理健康 App 镜头大得多：Grand View、Research and Markets、Mordor 和 Global
              Market Insights 将当前全球市场放在约 US$7.48 billion 至 US$9.6 billion，把 2030 年代初前景放在约 US$17.52 billion 至 US$18.81
              billion，其中 GMI 的 2035 年乐观情景升至 US$40.9 billion。相邻的雇主控制预算池更大，企业健康估算从 2024 年 US$53.54 billion 到 2021 年
              US$61.2 billion、2026 年 US$94.6 billion 不等，取决于发布方和品类定义。


              实际含义是，如果混用这些边界，Calm 的估值叙事会被夸大。仅消费者冥想细分太小，难以支撑宽泛的软件式上行空间；宽泛的数字心理健康 App 镜头更有支撑力，但包含治疗、教练辅导和其他超出 Calm
              历史核心的品类；企业健康预算只有在 Calm 能转化赞助方控制预算，而不只是消费者支付意愿时才相关。因此公开证据支持一个受约束的看法：Calm
              参与的是更大的压力、睡眠和心理健康需求池，但它可变现的服务市场更窄，披露仍不完整。
