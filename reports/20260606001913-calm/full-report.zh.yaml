      - number: '6.2'
        title: Calm Health 的买方—用户—支付方—服务方渠道
        blocks:
          - type: paragraph
            body: >-
              Calm Health 把客户图谱从简单 B2C
              订阅改造成买方—用户—支付方结构。雇主、健康计划和顾问是经济买方或渠道所有者；员工、会员和家属是主要用户；当有人需要更高强度照护时，服务方或福利伙伴成为履约层。Calm 的雇主、健康计划、顾问和旗舰 Calm
              Health 页面都营销同一套基本栈：经验证的 GAD-7 和 PHQ-9 筛查、心理学家开发的项目、Calm 自我照护内容，以及导入雇主或计划福利的路由。这些页面也重复同一组核心参与证明：77%
              注册用户完成筛查，38% 参与临床项目，37% 有中重度焦虑或抑郁结果的用户参与治疗，平均满意度 4.55/5。


              具名渠道扩张重要，因为它们显示 Calm Health 不只是网站推介。UnitedHealthcare 让 Calm Health 面向超过 13 million 商业会员及家庭成员开放；Magellan
              向部分雇主客户及其会员提供；LifeStance 通过 550 多个中心提供直接的更高强度转介路径；Solera 2026 年 1 月的网络扩张把官方触达提升到超过 39 million 人。Partner
              Portal 文档还给出一个有用的耐久性 替代指标：组织管理员可以上传资格文件、年中新增覆盖人群、监控汇总参与度并管理自动续约，这意味着真实的先落地再扩张 运营模型，尽管合同价值和续约率未披露。
