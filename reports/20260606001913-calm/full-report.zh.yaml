      - - 免费和捆绑替代品让内容商品化
        - Apple 将冥想打包进 Fitness+ 和 Apple One；Smiling Mind 与 Humin 免费；Insight Timer 免费优先
        - 独立正念内容稀缺性下降，单靠价格更难防守
        - 高
        - 验证 Calm 的品牌、名人内容和睡眠专属互动，能否让留存高于替代品
    notes: 风险登记表混合直接证据和综合战略推演；严重度反映 Calm 面对的竞争压力，而不是各竞争者独立质量的绝对排名。
