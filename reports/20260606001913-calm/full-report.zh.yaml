chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与分发
        blocks:
          - type: paragraph
            body: >-
              Calm 对外呈现的是一家以订阅 App 为锚的心理健康公司，而不是狭义冥想工具。官方页面描述了冥想、Sleep Stories、音乐、运动和面向工作的课程；Apple 和 Google
              应用商店列表则确认其移动端分发很广。核心产品仍是旗舰 Calm App，但 2025 年 9 月推出 Calm Sleep，说明产品线仍围绕睡眠扩张。


              规模有实质证据支撑，不过其中相当一部分仍来自公司自述。Calm 的关于页和新闻页称下载量超过 180 million、5 星评价达到 3 million、覆盖 190 多个国家并支持 7 种语言。官方帮助内容和
              App Store 也交叉印证了 2012 年上线、创始人姓名、500+ 个 Sleep Stories，以及 Apple 2017 年 App of the Year 认可。


              变现比许多私营消费者 App 更清楚，但各渠道并不完全一致。Apple 列表显示月付 $14.99、年付 $69.99、终身方案 $399.99；Calm 的直营网页计划目前显示年费层级以及一次性 $39.99
              的「Calm for Life」优惠。这个错位应作为尽调跟进项处理，不能直接假设它是价格分层逻辑。
