      - number: '1.4'
        title: 里程碑、合作伙伴与反向信号
        blocks:
          - type: paragraph
            body: >-
              Calm 的时间线显示，公司反复扩张自身品类定义。公司 2012 年上线，用 Sleep Stories 把睡眠拓宽成主流用例，成为 Apple 2017 年 App of the Year，2019
              年跻身独角兽，2020 年达到 $2 billion 估值。2022 年收购 Ripple 并推出 Calm Health，是最清晰的战略转向：Calm 不再只像消费者健康订阅，而开始像支付方 / 雇主分发平台。


              同一条时间线也保留了主要反向信号。据报道，Calm 2022 年在融资和经营环境趋紧时裁员约 20%。ClassAction.org 后来指称，Calm 可能将视频观看数据分享给 Facebook/Meta，涉及
              VPPA，并在 2026 年 2 月将调查标记为完成；但已审阅来源没有显示公开诉讼结果。Fast Company 2026 年 4 月的访谈又因 Ko 离职增加了新的治理褶皱。


              结果不是公司概况破裂，而是呈现混合图景。Calm 确有消费者品牌力和医疗渠道动能，但公开记录仍留下订阅者精度、董事会透明度和领导层接班问题。
