  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 当前判断
      - 判断依据
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 公开记录支持继续尽调，而不是直接买入；价格锚已经过时，证据栈也不完整。
        - 没有私有数据包，不要按历史估值承销。
      - - 确信度
        - 中
        - 证据足以说明旧估值难以承销，但还不足以建立精确目标回报。
        - 用本章设定尽调优先级，而不是强行追求精确。
      - - 风险评级
        - 高
        - 收入、订阅者、企业业务和股权结构表都不清楚，下行路径很多。
        - 在留存、利润率和优先条款披露前，先假设存在估值重置风险。
      - - 估值立场
        - 偏高
        - 只有收入和披露假设强于当前公开证据时，历史 $2 billion 估值才站得住。
        - 把历史轮价格当作仍需重新验证的上限。
      - - 决策含义
        - 只按价格敏感路径跟进
        - Calm 可能有战略相关性，但当前公开证据不足以支持接受报价。
        - 只有尽调证明规模可持续，或有效入场价明显更低，才继续接触。
    notes: 本表概括纯公开信息下的投资判断；不能替代股权结构表审查或实时私有公司估值备忘录。
