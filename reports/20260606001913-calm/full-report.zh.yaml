  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 公开规模 / 定价证据
      - 目标客群
      - 核心差异化
      - 相对 Calm 的主要限制
    rows:
      - - Headspace / Headspace for Organizations 竞品
        - 直接同类产品加雇主平台
        - $12.99/月 / $69.99/年；4,000+ 家组织；15k+ 名提供者
        - 消费者、雇主、健康计划关联会员
        - 正念、睡眠、教练、治疗、精神科、AI 伴侣、强研究基础
        - 消费端定价与 Calm 接近，企业端披露更充分，削弱 Calm 的独特性
      - - Insight Timer
        - 免费增值的直接替代品
        - 330,000 条免费音频；可选 $59.99/年高级版；36M 人信任
        - 寻求低成本冥想和睡眠支持的消费者
        - 最大免费内容库，免费到付费路径清晰
        - 制作精致度低于 Calm，睡眠优先品牌也更弱，但便宜得多
      - - BetterSleep
        - 睡眠优先的相邻同类产品
        - 全球 65M+ 用户；定价随计划、地区和平台而变
        - 相比广义正念更重视睡眠的消费者
        - 睡眠聚焦强，拥有 300+ 种声音、250+ 个冥想 / 催眠和 100+ 个故事
        - 心理健康广度窄于 Calm，公开定价也不够透明
      - - Happier Meditation
        - 聚焦正念的直接同类产品
        - 500+ 个引导冥想；App Store 年费会员 $99.99
        - 寻求教师引导正念和课程的消费者
        - 教师品牌强，定位实用正念
        - 睡眠内容广度较弱，也未披露可与 Calm Health 比肩的雇主规模
      - - Peloton App
        - 捆绑型健康替代品
        - 评审页面显示数千门课程和 30 天免费试用；冥想包含在更大的 App 中
        - 现有 Peloton 或健身会员用户
        - 冥想搭载健身习惯循环和社区功能
        - 健康是健身产品内的功能，不是 Calm 这种睡眠优先目的地
      - - Apple Fitness+ / Apple One
        - 捆绑型平台替代品
        - $9.99/月 / $79.99/年；也捆绑在 Apple One 中
        - 已为更宽服务包付费的 Apple 设备用户
        - 冥想与运动类型、推荐和 Apple 生态分发捆绑
        - 冥想深度从属于更大的健身和服务包
      - - BetterHelp
        - 更高强度的治疗替代品
        - 32,000+ 名提供者；自费会员每周 $70-$100
        - 寻求治疗而非内容优先正念的消费者
        - 大型治疗网络，且有部分保险合作关系
        - 隐私 / 监管包袱和更高价格使其成为替代品，而不是清晰的 Calm 对标
      - - Calm Health
        - 雇主 / 付款方导航层
        - 3,500+ 家组织；26M+ 受保人群；13M+ 名 UnitedHealthcare 商业会员
        - 雇主、健康计划和提供者
        - 筛查、心理学家设计的项目、理解福利的转诊和高参与度
        - 公开披露的临床深度弱于 Lyra、Spring Health 或 Modern Health
      - - Lyra Health
        - 雇主心理健康平台
        - 直接覆盖 20M+ 人；通过合作伙伴和计划覆盖 200M+ 人
        - 雇主、健康计划、提供者、渠道合作伙伴
        - EAP 替代定位、AI 匹配、治疗、用药管理、复杂护理支持
        - 定价未披露，且面向企业而非消费者，因此不能直接解决 Calm 的 DTC 任务
      - - Spring Health
        - 雇主心理健康平台
        - 20M+ 受保人群；<1 天首次预约；保证 ROI
        - 雇主及其会员 / 家庭
        - 快速匹配、集成平台、ROI 框架、强测量话术
        - 消费者心智弱于 Calm，对独立睡眠内容强调更少
      - - Modern Health
        - 雇主心理健康平台
        - 200+ 个国家；80+ 种语言；PEPM 或按使用量定价；每 $1 产生 $2.39 ROI
        - 全球雇主和分布式员工
        - 面向跨国买方的全球覆盖和灵活定价模型
        - 公开品牌拉力弱于 Calm 的消费者睡眠业务
      - - Smiling Mind / Humin
        - 免费非营利 / 科学型替代品
        - 免费 App；影响数百万人或 1M+ 人；证据导向定位
        - 预算敏感消费者，以及寻求低成本预防的雇主
        - 零价格入口和可信的循证框架
        - 娱乐价值和品牌规模弱于 Calm 的高端消费者产品
    notes: 选取的核心同类产品覆盖直接 App、捆绑替代品、企业平台和免费替代品；公开统计混合了公司披露、App Store 元数据和合作伙伴披露，不是经审计的市场份额。
