    - No public API / SSO / eligibility-integration documentation
  - - Sleep ecosystem partnerships
    - Hotel guest, retail buyer, sleep-hardware user
    - Expansion layer launched with Calm Sleep
    - Hilton room experience, Allied Home bedding, Ozlo Sleepbuds bundles extend brand beyond app sessions
    - Partnership revenue mix and attach-rate economics are not public
