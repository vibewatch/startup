- id: operating-and-technical-architecture
  title: Operating and technical architecture
  body: 'The publicly observable architecture is a layered operating model, not a deeply disclosed software stack. At the edge, Calm runs through native app-store distributions, web access, and selected companion-device surfaces including Apple Watch, Apple TV, Wear OS, and Samsung Health. Calm Sleep adds a second consumer endpoint with Apple HealthKit-based sleep-data sync and task-driven personalization. Calm Health adds a sponsor-controlled path: members arrive via insurer, employer, or provider eligibility; complete PHQ-9 and GAD-7 screening plus onboarding questions; receive a tailored plan; and can be routed into coaching, therapy, or higher-acuity referral paths when sponsor benefits or partners are available.


    What is visible publicly is therefore workflow orchestration rather than cloud internals. Calm discloses account continuity between Calm and Calm Health, web fallback access for users without smartphones, device minimums, and benefit-aware referral routing. It does not publicly disclose a cloud vendor, API catalog, uptime SLA, or formal EHR / SSO implementation detail in the reviewed source set. That means investors can verify how the user journey behaves, but not yet how much of the underlying integration stack is reusable, configurable, or audited across sponsors.'
