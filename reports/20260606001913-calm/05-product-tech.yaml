- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer / component
  - role
  - dependency
  - risk
  rows:
  - - Client surfaces
    - Native iOS/Android apps, web, Apple TV/Watch, Wear OS, Samsung Health surfaces deliver content and check-ins
    - App stores, device OS compatibility, and browser access
    - Platform policy or device-support changes can affect reach
  - - Identity / account layer
    - Lets Calm and Calm Health share the same username/password
    - Calm account system and sponsor eligibility rules
    - No public SSO / federation detail for enterprise buyers
  - - Sleep personalization layer
    - Uses onboarding, daily tasks, readiness scoring, and wearable sync in Calm Sleep
    - Apple HealthKit and user-entered sleep goals / habits
    - Android or cross-device parity is not yet public
  - - Clinical personalization layer
    - Runs PHQ-9 / GAD-7 screening, program matching, and repeat assessments in Calm Health
    - Psychologist-authored program catalog plus sponsor eligibility logic
    - No public model / rules-engine documentation
  - - Benefits and referral layer
    - Routes members into coaching, therapy, care managers, or referral partners
    - UHC, Magellan, LifeStance, employer / plan ecosystems
    - Integration depth varies by sponsor and is not publicly standardized
  - - Trust / support layer
    - Privacy notices, compliance statements, help center, and app-store release operations
    - Policy updates, support staff, and mobile release cadence
    - No public uptime SLA, status dashboard, or third-party security report in the reviewed set
  notes: This is an operating-model reconstruction from public product, support, privacy, and partner materials rather than an internal software diagram.
