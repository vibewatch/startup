    - Need current paid-subscriber, retention, and usage-by-module disclosure
  - - Calm Sleep
    - Consumer sleep user; iOS-first premium buyer
    - New standalone app launched Sep. 2025
    - Sleep-specific onboarding, daily plans, sleep-readiness bar, HealthKit sync, exclusive new sleep content window
    - No public Android timeline or cohort-retention data
  - - Calm Health app
    - Sponsored member via employer, health plan, or provider
    - Mature sponsor-channel workflow, still plan-dependent
    - Screening-led personalization, psychologist-built programs, benefit-aware referrals, same Calm credential system
    - Need sponsor-by-sponsor feature map and implementation detail
  - - Health-plan / employer channel surface
    - Benefit manager, payer, broker, employer buyer
    - Scaling distribution layer
