  evidenceGaps:
  - type: missing-source
    severity: material
    topic: reliability-transparency
    missingEvidence: A public status page, uptime history, SLA, or third-party reliability disclosure for Calm and Calm Health operations.
    whyItMatters: Product availability and response-time commitments matter for enterprise deployment and health-plan member trust.
    diligencePath: Request customer-facing SLA language, historical uptime metrics, and any incident-communication playbooks from Calm.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE003
    - TE004
  - type: private-evidence-only
    severity: material
    topic: integration-depth
    missingEvidence: Technical documentation for sponsor integrations such as eligibility checks, API endpoints, SSO, data feeds, or EHR connectivity.
    whyItMatters: Without implementation detail, investors cannot tell whether sponsor deployments are repeatable product integrations or mostly manual service work.
    diligencePath: Ask for one redacted implementation diagram, one security architecture overview, and one enterprise integration checklist from a live payer or employer deployment.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: minor
    topic: calm-sleep-platform-roadmap
    missingEvidence: A public statement naming an Android, web, or broader-device roadmap for Calm Sleep after its iOS launch.
    whyItMatters: Platform breadth will affect SKU scale, retention, and how much Calm Sleep can become a true second consumer pillar.
    diligencePath: Request current product roadmap timing for Android, web, and international localization expansion for Calm Sleep.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: clinical-outcomes-depth
    missingEvidence: Population-level retention, completion, and outcomes by Calm Health program, sponsor type, and referral pathway.
    whyItMatters: Partner case studies show engagement and some outcome signals, but they do not reveal durability or which workflows truly drive clinical ROI.
    diligencePath: Request anonymized sponsor dashboards covering screening completion, referral conversion, symptom change, and 30/90-day retention by population.
    relatedQuestionRefs:
    - QE016
    - QE020
