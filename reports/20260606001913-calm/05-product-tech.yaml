- id: TE002
  title: Workflow / use-case table
  columns:
  - user job
  - current workflow
  - Calm solution
  - measurable benefit / proof
  - limitation
  rows:
  - - Reduce day-to-day stress or improve focus
    - Open app for short guided session, breathing, or Daily Calm habit loop
    - Flagship Calm app with meditations, Breathe, Dailies, movement, and For Work content
    - Multiple app-store ratings plus third-party reviews confirm broad adoption and repeat-use design
    - No public module-level MAU or completion-rate breakdown
  - - Build a better bedtime routine
    - Browse sleep stories, music, or soundscapes inside consumer subscription
    - Flagship Calm sleep library with 500+ Sleep Stories and weekly additions
    - Sleep Stories scaled into a core brand asset with celebrity voices and heavy user usage
    - Library depth is public; conversion from sleep listeners to paid subscribers is not
  - - Improve sleep with a more guided daily system
    - Answer sleep onboarding, complete tasks, review sleep readiness, sync wearable data
    - Calm Sleep personalized plan with tasks, readiness bar, and HealthKit sync
    - Standalone sleep SKU launched as a new D2C app with 300+ hours of sleep content
    - Currently iOS only in public materials
  - - Find sponsor-covered mental-health support
    - Get invited by payer / employer / provider, complete screening, receive tailored plan
    - Calm Health screening-led onboarding with PHQ-9 / GAD-7 and personalized action plans
    - Calm Health reports 77% screening completion and partner case studies show benefit-linked navigation
    - Sponsor and regional variation means not every member sees the same flow
  - - Escalate from self-guided support to clinical care
    - Use screening results to route into coaching, therapy, or higher-acuity providers
    - UnitedHealthcare, Magellan, and LifeStance integrations add referrals and care-team handoffs
    - UHC and partner coverage support real navigation beyond content consumption
    - Public evidence is workflow-level, not implementation-level
  notes: Benefits and proof points come from official app surfaces plus partner case studies; public evidence is strongest on workflow design, weaker on economic conversion or retention.
