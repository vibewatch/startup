- id: trust-safety-privacy-and-operational-risks
  title: Trust, safety, privacy, compliance, and operational risks
  body: 'Trust controls are more visible on the data-policy and clinical-boundary side than on classic infrastructure disclosure. Calm''s general privacy policy covers usage data, app versions, device identifiers, purchases, check-ins, and optional data from Apple HealthKit and Google Health Connect when users choose to link those sources. A separate consumer-health-data policy, updated in August 2025, is specific to Calm Sleep and references Washington and Nevada consumer-health-data laws, deletion and withdrawal rights, and service-provider use. Calm Health''s FAQ and app-store pages go further, saying the product is built to comply with HIPAA and HITRUST privacy and security standards.


    Clinical and safety boundaries are also explicit. Calm Health describes psychologist-written programs, cites CBT / ACT / DBT-style approaches, and repeatedly says the product is not a substitute for physician or therapist care. Partner materials reinforce that positioning by routing users into coaching, therapy, or higher-acuity referrals when screening suggests they need more than self-guided content. The remaining product-tech risk is transparency: public materials prove that Calm can screen, personalize, and route, but not how its sponsor integrations are implemented technically, what uptime commitments it offers, or whether it publishes third-party security attestation beyond marketing-level HIPAA / HITRUST statements.'
