  - id: TP005
    title: Switching cost, multi-homing, and distribution power map
    columns:
      - buyer path
      - main lock-in or friction
      - public evidence
      - likely winner
      - implication for Calm
    rows:
      - - Consumer meditation routine
        - Streaks, favorite content, habit familiarity
        - Insight Timer free tier, Headspace parity pricing, Happier free download, Calm cross-channel pricing
        - Multi-homing user
        - Low hard lock-in; Calm must earn repeat use with content quality and brand
      - - Sleep-specific consumer use case
        - Story / sound preference and bedtime habit
        - BetterSleep's sleep-first scope and Calm Sleep expansion both target bedtime behavior
        - Brand with best nightly fit
        - Sleep remains Calm's best consumer moat, but BetterSleep narrows the functional gap
      - - Therapy or moderate-severity need
        - Provider match, continuity of care, insurance eligibility
        - BetterHelp network scale and insurer relationships; Headspace clinical access; enterprise vendors' care stacks
        - Clinical provider network
        - Calm alone is weaker when the user needs treatment rather than content
      - - Employer add-on benefit
        - Procurement process, benefits communication, data reporting
        - Calm Health screenings, referral paths, and UHC distribution proof
        - Calm or Headspace as low-acuity layer
        - Calm can win as a benefit enhancer even when it is not the system of record
      - - Employer full-platform replacement
        - Network breadth, implementation, outcomes reporting, CFO scrutiny
        - Lyra, Spring Health, and Modern market EAP replacement, ROI, and broad care
        - Full-stack enterprise platform
        - Calm Health is less defensible when buyer wants one platform to own clinical outcomes
      - - Health-plan / channel distribution
        - Existing member relationships and benefit integration
        - UnitedHealthcare partnership for Calm Health; Lyra pathways through partners and plans
        - Channel partner with largest installed base
        - Distribution can offset weaker direct sales muscle, but partner concentration raises dependence risk
      - - Free / nonprofit self-care path
        - Almost no cost and minimal switching barrier
        - Insight Timer free core, Smiling Mind free app, Humin free program
        - User or employer looking for zero-price prevention
        - Free alternatives cap willingness to pay for generic mindfulness content
    notes: >-
      The table compares switching mechanisms across user journeys rather than across brands only; distribution power and
      internal build status quo matter more in employer channels than in consumer subscriptions.
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Seven buyer paths capture the main friction points relevant to Calm's competitive durability across direct,
        employer, payer, therapy, and free-alternative routes.
