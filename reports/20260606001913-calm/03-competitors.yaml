  - id: switching-costs-multi-homing-and-moat-risk
    title: Switching costs, multi-homing, distribution power, and moat risk
    body: >-
      Calm's switching-cost profile is asymmetric. In consumer meditation and sleep, switching is low because users can
      multi-home across free libraries, app-store trials, bundles they already buy for other reasons, and adjacent
      therapy products that address a different severity level. Streaks, saved favorites, and brand familiarity help, but
      they do not create the kind of hard lock-in seen in workflow software or claims-processing systems. The evidence is
      visible in the substitute set itself: Insight Timer's free tier, Smiling Mind's free not-for-profit app, Humin's
      free science-based program, Apple Fitness+ inside Apple One, and Peloton's larger workout membership all make it
      easy for users to supplement or downgrade away from a stand-alone meditation app.

      The moat is stronger in employer and payer channels, but even there the main protections are distribution and
      integration rather than proprietary clinical exclusivity. Calm Health becomes harder to rip out once it is tied to
      benefit navigation, partner referrals, and reporting, yet larger enterprise rivals already market deeper clinical
      coverage and broader scale. The adverse evidence is therefore structural, not dramatic: BetterHelp's FTC settlement
      shows how quickly trust can erode in digital mental health, while free and bundled substitutes show how quickly
      mindfulness content can commoditize. Calm still owns meaningful mindshare in sleep and calmness as a brand, but the
      durability question now turns on whether that brand can convert into employer channel wins and sustained outcome
      differentiation before the category's distribution and care breadth consolidate elsewhere.
