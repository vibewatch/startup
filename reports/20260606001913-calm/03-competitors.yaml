  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: enterprise-pricing
      missingEvidence: Exact realized PEPMs, setup fees, minimum contract sizes, and discount ranges for Calm Health, Headspace, Lyra, Spring Health, and Modern Health.
      whyItMatters: Public pricing opacity makes it hard to judge whether Calm competes on price, attachment, or value-added outcomes in enterprise deals.
      diligencePath: Request recent customer contracts, pricing sheets, and procurement redlines for at least one mid-market and one enterprise deployment per vendor.
      relatedQuestionRefs:
        - QP016
      relatedTableRefs:
        - TP004
    - type: private-evidence-only
      severity: material
      topic: competitive-win-rate
      missingEvidence: Public win-loss, renewal, displacement, and attach-rate data showing where Calm Health beats or loses to Headspace, Lyra, Spring Health, Modern Health, or status-quo EAP options.
      whyItMatters: Scale and scope disclosures alone do not show whether Calm wins meaningful enterprise budgets or is mostly an add-on benefit layered beside deeper platforms.
      diligencePath: Ask management for pipeline conversion by competitor, renewal cohorts by channel, and examples of deals where Calm Health replaced or lost to a named rival.
      relatedQuestionRefs:
        - QP025
      relatedTableRefs:
        - TP006
    - type: access-blocked
      severity: minor
      topic: peloton-pricing
      missingEvidence: Cleanly rendered public dollar pricing for Peloton App One and App+ on the reviewed page.
      whyItMatters: The substitute thesis is still supportable without the exact price, but cleaner public list pricing would tighten bundle-pressure comparisons.
      diligencePath: Capture a fresh first-party pricing surface or authenticated screenshot that shows the app-tier prices without dynamic rendering gaps.
      relatedQuestionRefs:
        - QP015
      relatedTableRefs:
        - TP004
    - type: private-evidence-only
      severity: material
      topic: calm-health-client-mix
      missingEvidence: Split of Calm Health covered lives by employer, payer, and provider channel plus active-user or client-count concentration by top partner.
      whyItMatters: Covered lives overstate realized distribution if most access sits in one or two channels or if activation remains concentrated in lighter-touch use cases.
      diligencePath: Request partner-level concentration, activation, and renewal data, with separate reporting for health-plan, employer, and provider channels.
      relatedQuestionRefs:
        - QP020
        - QP025
      relatedTableRefs:
        - TP003
