  - id: TP004
    title: Pricing / packaging comparison
    columns:
      - offering
      - public price / disclosure
      - free tier or trial
      - what is included publicly
      - implication
    rows:
      - - Calm
        - $69.99 annual on web; App Store also shows $14.99 monthly and $399.99 lifetime
        - 7-day trial on reviewed web page
        - Full Calm content library including meditation, sleep, music, and movement
        - Price parity with Headspace annual plan means Calm cannot rely on premium price signaling alone
      - - Headspace
        - $12.99 monthly / $69.99 annual on App Store
        - Consumer free trial and free download
        - Meditation, sleep, coaching, therapy access, AI companion
        - Closest direct benchmark on list price and broader on clinical adjacency
      - - Insight Timer
        - Free core product; $59.99 annual or $9.99 monthly premium
        - Yes
        - Free library, timer, community, plus premium courses and offline features
        - Strongest low-price pressure on Calm's content subscription
      - - BetterSleep
        - Monthly, yearly, and lifetime plans, but exact current list prices vary by region and offer
        - Free download and periodic promotions
        - Sleep tracker, stories, sounds, meditations, hypnosis, premium features
        - Competes on sleep utility while making exact price comparison harder in public diligence
      - - Happier Meditation
        - $99.99 annual membership on App Store; additional monthly / legacy subscription options listed
        - Free download and limited free access
        - 500+ meditations, lessons, and mindfulness plans
        - Higher list price than Calm or Headspace narrows value proposition to committed mindfulness users
      - - Peloton App
        - Reviewed public page markets app tiers and trial, but rendered dollar amounts incompletely in fetch output
        - 30-day free trial
        - Thousands of workout classes with meditation inside broader membership
        - Buyers already paying Peloton for fitness may treat meditation as free incremental value
      - - Apple Fitness+
        - $9.99 monthly / $79.99 annual
        - 1 month free, or 3 months with eligible device purchase
        - Meditation plus 12 workout types and personalized recommendations
        - Apple compresses wellness pricing by bundling meditation with a much wider fitness service
      - - Apple One
        - $19.95 individual / $25.95 family / $37.95 premier
        - Trial available
        - Bundles Fitness+ alongside music, TV, storage, and more
        - Meditation can become a bundled add-on rather than a separate subscription decision
      - - BetterHelp
        - $70-$100 per week private pay; some insurance coverage available
        - No free therapy tier
        - Messaging, chat, audio, video, support groups, worksheets, and 32,000+ providers
        - Much higher acuity and higher spend, but substitutes for users whose need is therapy not mindfulness
      - - Calm Health / Lyra / Spring / Modern
        - Public enterprise pricing mostly undisclosed; Lyra says tailored quote and Modern says PEPM or usage-based
        - Demos / contact sales
        - Screening, navigation, coaching, therapy, psychiatry, ROI reporting vary by vendor
        - Enterprise pricing opacity raises diligence burden and makes competitive win-rate evidence more important
    notes: >-
      Public pricing is channel-specific and often promotional; enterprise rows should be treated as disclosure status,
      not contract reality. The reviewed public Peloton page rendered membership dollars incompletely.
    enumerationScope:
