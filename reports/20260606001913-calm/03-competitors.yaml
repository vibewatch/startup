chapter:
  number: 3
  title: Competitors
  summary: >-
    Calm faces a two-front competitor set: direct consumer mindfulness and sleep peers led by Headspace, Insight
    Timer, BetterSleep, and Happier, plus employer mental-health platforms such as Headspace, Lyra, Spring Health,
    and Modern Health that compete with Calm Health. Public evidence suggests Calm still has a strong sleep-first
    brand and a useful low-acuity engagement wedge, but consumer switching costs are low and enterprise scale,
    measured-care depth, and distribution power are more clearly disclosed by Headspace, Lyra, Spring Health, and
    Modern Health.
sections:
  - id: landscape-and-segmentation
    title: Landscape by competitor class
    body: >-
      Calm does not compete in one clean lane. In direct-to-consumer wellness it faces close product peers that solve
      the same daily job of helping users sleep better, reduce stress, and maintain a mindfulness habit. Headspace is
      the most direct like-for-like benchmark because it pairs meditation and sleep content with a near-identical US
      annual list price. Insight Timer pressures the category from below with a free core library and an optional
      premium tier, while BetterSleep competes from a sleep-first angle and Happier stays closer to the mindfulness
      course-and-coach tradition that Ten Percent Happier built.

      The competitor set broadens materially once Calm Health is included. Calm Health is not simply a meditation app
      sold to employers; it combines screenings, psychologist-built programs, benefit navigation, and self-care content.
      That puts it into competition with Headspace's organizational business and with deeper employer platforms such as
      Lyra, Spring Health, and Modern Health. Adjacent substitutes matter too. Apple and Peloton bundle meditation
      inside broader subscriptions, BetterHelp attacks higher-acuity needs with online therapy, and employers can still
      stick with legacy benefits or assemble point solutions rather than selecting a single mental-health platform. The
      right read-through is therefore a layered landscape: low-friction consumer content rivalry, higher-friction
      employer-platform rivalry, and constant substitute pressure from free or bundled wellness distribution.
