  - id: TP006
    title: Moat durability / competitive risk register
    columns:
      - moat or risk claim
      - supporting evidence
      - counter-pressure
      - severity
      - mitigation / diligence ask
    rows:
      - - Calm's sleep brand is the strongest direct moat
        - Calm Sleep expansion, Sleep Stories scale, and consumer sleep positioning remain distinctive
        - BetterSleep and bundled fitness platforms also treat sleep and meditation as major product surfaces
        - medium
        - Request Calm Sleep retention, attach rates, and incremental ARPU versus flagship Calm
      - - Consumer pricing power is limited
        - Headspace annual pricing matches Calm; Insight Timer premium is cheaper while free core is robust
        - Free and parity-priced rivals compress room for list-price expansion
        - high
        - Test whether Calm monetization comes from retention and upsell rather than price increases
      - - Calm Health has engagement value
        - Screenings, referral paths, and UHC outcomes suggest useful low-acuity entry-point behavior
        - Headspace, Lyra, Spring, and Modern disclose broader care depth or larger enterprise scale
        - medium-high
        - Ask for competitive win/loss data by segment and attach rates into higher-acuity services
      - - Enterprise distribution is a potential moat
        - UHC gives Calm Health 13M+ commercial member reach and Calm cites 26M+ covered lives overall
        - Reliance on a few major channels can reduce bargaining power and raise concentration risk
        - medium
        - Request client concentration, renewal rates, and covered-life concentration by top partner
      - - Category trust can erode quickly
        - FTC refund program shows digital mental-health privacy failures can trigger real restitution at scale
        - Trust damage in adjacent therapy markets can spill over to wellness apps seeking employer credibility
        - medium
        - Review Calm's data-sharing controls, HIPAA posture, and buyer objections versus BetterHelp-style headlines
      - - Full-stack employer platforms can displace lighter layers
        - Lyra, Spring Health, and Modern all market broader clinical scope and measurable outcomes / ROI
        - If buyers consolidate vendors, they may choose a deeper platform and add mindfulness internally or via bundle
        - high
        - Ask whether Calm wins as stand-alone platform or only as add-on to incumbent benefits
      - - Free and bundled substitutes commoditize content
        - Apple bundles meditation with Fitness+ and Apple One; Smiling Mind and Humin are free; Insight Timer is free-first
        - Stand-alone mindfulness content becomes less scarce and harder to defend on price alone
        - high
        - Validate whether Calm's brand, celebrity content, and sleep-specific engagement keep retention above substitutes
    notes: >-
      Risk register mixes direct evidence and synthesized strategic read-throughs; severity reflects competitive pressure
      on Calm specifically, not an absolute ranking of each rival's standalone quality.
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Seven moat and risk themes summarize the durable issues most likely to shape Calm's competitive outcomes across
        direct consumer subscriptions and enterprise distribution.
