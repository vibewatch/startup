    {
      "id": "leadership-execution-and-diligence",
      "title": "Leadership, execution, and diligence asks",
      "body": "Leadership and financial-model risk are elevated because the public record shows change without enough operating detail to prove resilience. David Ko's April 2026 step-down matters because he was the most visible operator associated with Calm's recent health-distribution push, and the reviewed sources do not identify a named successor CEO. Ko remains a board adviser in public coverage, which softens the transition, but it does not remove the governance question. Calm therefore enters a multi-product, multi-channel phase with less public certainty about who is driving execution day to day.\n\nThe model risk is similarly unresolved rather than invisible. Public pricing proves Calm has multiple billing paths, and 2022 layoffs show management already had to reset resources under pressure. What is still missing is the data that would show whether the reset worked: renewal cohorts, churn, refund rates, billing mix by web versus stores, CAC and payback for Calm Health, and the economics of newer sleep and licensing initiatives. That is why the most important diligence asks are operational rather than narrative. Investors should request a current CEO and org chart, partner concentration by revenue and covered lives, a privacy/control audit, and renewal-quality data before giving any growth or platform-expansion story full credit.",
