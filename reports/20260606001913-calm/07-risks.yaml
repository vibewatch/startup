    {
      "id": "regulatory-privacy-and-legal",
      "title": "Regulatory, privacy, and legal risk",
      "body": "Regulatory and legal risk is the chapter's top-ranked exposure because Calm now operates across multiple privacy regimes and product surfaces at once. Calm's main privacy policy covers websites, apps, usage behavior, viewed videos, device identifiers, and targeted advertising. Separate Calm Sleep and Calm Health consumer-health policies then widen the surface to wearable and sponsor-linked data, including sleep and biometrics if users opt in, plus employer or health-plan sponsored enrollment flows. That matters because Washington's My Health My Data Act defines consumer health data broadly and requires clear opt-in consent rather than consent buried inside general terms, while FTC guidance and breach-notification rules raise expectations around data minimization, security, and incident response.\n\nThe most visible adverse signal is the March 2024 ClassAction.org investigation arguing that Calm may have shared subscriber video-viewing details and Facebook IDs with Meta. That is not a finding of liability, but it maps onto real VPPA risk because the statute provides private-action damages and separate-consent requirements. Combined with Apple and Google privacy-disclosure rules, the result is a risk profile where even a technically narrow implementation mistake can spread into litigation, app-review friction, sponsor concern, and brand damage. The public record still lacks a clean technical audit, docket inventory, or regulator-correspondence set, so private diligence rather than assumption has to clear this risk.",
