summary:
  headline: >-
    Calm is a scaled and durable mental-wellness brand with real consumer and sponsor reach, but
    private-company opacity, leadership-transition risk, and a stale 2020 US$2 billion valuation
    anchor keep the current stance at track rather than buy.
