companyProfile:
  summary: >-
    Calm is a San Francisco-headquartered private mental-wellness company founded in 2012 by Alex
    Tew and Michael Acton Smith. What started as a consumer subscription app for meditation and
    sleep now operates as a broader product family that includes the flagship Calm app, the newer
    Calm Sleep app, and Calm Health for employers, payers, providers, and consultants. Public
    sources support very large consumer reach and real sponsor distribution, but current subscriber,
    board, and post-David-Ko succession disclosure remains limited.
  foundedDate: '2012-05-04'
  founders:
