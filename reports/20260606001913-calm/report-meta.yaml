  foundingLocation: San Francisco, California
  headquarters: San Francisco, California
  productSummary: >-
    Calm sells a multi-surface mental-health product family: the flagship app bundles meditation,
    Sleep Stories, music, breathwork, and movement; Calm Sleep is a newer standalone sleep SKU;
    and Calm Health adds sponsor-distributed screenings, clinical programs, and benefit-aware care
    navigation.
  customerFocus: >-
    Self-pay consumers on the core app plus employer-sponsored employees, health-plan members,
    consultant-led client groups, public-sector teams, and provider-referred users through Calm
    Health.
  businessModel: >-
    The public record supports a hybrid model built on consumer subscriptions and one-time offers,
    plus sponsor-paid Calm Health distribution across employers, payers, providers, and partners;
    exact realized ASP, margin structure, and retention economics remain private.
  stage: Private, post-Series C
  fundingStatus: >-
