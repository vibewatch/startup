- id: calm-health-buyer-user-payer-provider-channels
  title: Calm Health buyer-user-payer-provider channels
  body: |-
    Calm Health changes the customer map from simple B2C subscriptions into a buyer-user-payer structure. Employers, health plans, and consultants are the economic buyers or channel owners; employees, members, and dependents are the primary users; and providers or benefit partners become the fulfillment layer when someone needs higher-acuity care. Calm’s employer, health-plan, consultant, and flagship Calm Health pages all market the same basic stack: validated GAD-7 and PHQ-9 screening, psychologist-developed programs, Calm’s self-care content, and routing into employer or plan benefits. The pages also repeat the same top-line engagement proof: 77% of registered users complete a screening, 38% engage in a clinical program, 37% of users with moderate-to-severe anxiety or depression results engage in therapy, and average satisfaction is 4.55/5.

    The named channel expansions matter because they show Calm Health is not only a website pitch. UnitedHealthcare made Calm Health available to more than 13 million commercial members and family members, Magellan offers it to select employer customers and their members, LifeStance provides a direct higher-acuity referral path through more than 550 centers, and Solera’s January 2026 network expansion lifted official reach to more than 39 million people. Partner Portal documentation adds one useful durability proxy: organization admins can upload eligibility files, add covered lives mid-year, monitor aggregate engagement, and manage auto-renewal, which implies a real land-and-expand operating model even though contract values and renewal rates are undisclosed.
