  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: paying-subscriber-precision
    missingEvidence: Current board or management KPI showing direct paying subscribers, active monthly users, and paid conversion by channel.
    whyItMatters: Public sources only provide a 4M-plus proxy, which is not enough to underwrite customer quality or B2C retention.
    diligencePath: Request a 2024-2026 monthly subscriber bridge split by direct web, app stores, and sponsored access.
    relatedQuestionRefs:
    - QU003
    - QU024
  - type: private-evidence-only
    severity: material
    topic: retention-and-renewal-cohorts
    missingEvidence: GRR, NRR, churn, contract length, sponsor renewal rates, and B2C cohort retention by vintage.
    whyItMatters: High ratings and engagement proxies do not prove revenue durability.
    diligencePath: Request customer cohort tables for B2C subscriptions and Calm Health accounts, including logo retention and seat expansion.
    relatedQuestionRefs:
    - QU017
  - type: private-evidence-only
    severity: blocking
    topic: customer-concentration-and-pricing
    missingEvidence: Top-10 sponsor concentration, sponsor pricing, contract values, and revenue share of the largest payer or network relationships.
    whyItMatters: Channel concentration could be material if a few large payer or network deals drive most sponsored growth.
    diligencePath: |-
      Request top-customer concentration by revenue and covered lives, plus contract terms for UHC, Solera-related business, and any other top-five accounts.
    relatedQuestionRefs:
    - QU015
    - QU018
    - QU024
  - type: conflicting-data
    severity: material
    topic: organization-count-definition-shift
    missingEvidence: Definition bridge reconciling 3,500+ organizations in late 2025 with 100K+ organizations in January 2026.
    whyItMatters: Without a denominator bridge, public customer-count growth can be overstated or misunderstood.
    diligencePath: |-
      Request a KPI glossary and historical bridge showing what counts as an organization, covered life, active member, and network-affiliated account.
    relatedQuestionRefs:
    - QU019
    - QU024
  - type: enumeration-incomplete
    severity: minor
    topic: named customer proof table coverage is partial
    missingEvidence: A fuller public roster of named employer, payer, provider, and public-sector customers with launch dates and status.
    whyItMatters: The named-customer table is strong enough to prove adoption but clearly understates the total installed base.
    diligencePath: Ask management for a referenceable-customer list, top deployments by scale, and permission to speak with at least three sponsor accounts.
    relatedQuestionRefs:
    - QU007
    - QU008
    - QU009
    - QU010
    relatedTableRefs:
    - TU003
