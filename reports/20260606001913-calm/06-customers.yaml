- id: TU006
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / risk
  - What public evidence says
  - Impact
  - Diligence path
  rows:
  - - UnitedHealthcare payer block
    - 13M+ commercial members and family members have access
    - Confirms large payer distribution, but dependence on one major carrier can skew sponsored growth
    - Request UHC activation, renewal, and share of total Calm Health revenue or lives.
  - - Solera network expansion
    - January 2026 press adds 16M individuals and pushes official reach to 39M+
    - Fast distribution gain, but a network deal can inflate covered lives without equivalent activation
    - Request activated-member share and network-to-direct conversion.
  - - Mid-year seat expansion
    - Partner Portal lets admins upload new eligibility files and purchase additional covered lives
    - Supports land-and-expand thesis inside existing accounts
    - Request cohort-level seat growth, logo retention, and renewal uplift by mature account.
  - - Provider and EAP integration
    - LifeStance and Magellan deepen the product beyond mindfulness-only use cases
    - Could improve buyer relevance and therapy conversion, but economics of referrals are invisible
    - Request referral completion, downstream utilization, and reimbursement or partnership economics.
  - - Consumer distribution extensions
    - Hilton and celebrity Sleep Story partnerships broaden top-of-funnel reach outside the app
    - Helpful for brand discovery, but not equivalent to durable paid retention
    - Request attributable conversion, repeat use, and CAC impact from partnerships.
  - - Consumer billing and support friction
    - BBB complaints and Forbes review highlight recurring-charge, cancellation, and refund pain points
    - Raises churn and reputational risk even with high aggregate ratings
    - Request refund rate, involuntary churn, and customer-support response metrics.
  - - Definition and concentration opacity
    - Official organization counts shifted from 3,500+ to 100K+, while contract values and top-customer share remain private
    - Makes it hard to normalize customer-count quality or concentration
    - |-
      Request a board-style customer KPI bridge: direct subscribers, active sponsored users, named accounts, top-10 concentration, and renewal cohorts.
  notes: |-
    The main customer risk is not lack of adoption, but lack of comparable customer-quality disclosure across very different channels and counting conventions.
