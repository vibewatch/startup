- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public scale / proof
  - Gap
  rows:
  - - B2C self-pay subscribers
    - Buyer, user, and payer are primarily the same individual consumer
    - Sleep, stress reduction, meditation, daily habit formation
    - 180M+ downloads, 2M iOS ratings, 4.8/5 App Store rating
    - Exact paying-subscriber count and churn are private.
  - - Employer-sponsored employees
    - Employer buys; employee or dependent uses; employer pays
    - Preventive mental health support, burnout support, benefit navigation
    - Named employer quotes from Zendesk, ASICS EMEA, Sierra Nevada, and Parkview Health
    - Seat counts, renewal rates, and employer ACV are not public.
  - - Health-plan-sponsored members
    - Health plan buys; member uses; payer pays
    - Digital front door, screening, self-care, therapy referral
    - UnitedHealthcare access for 13M+ commercial members and family members
    - Activation rate and PMPM economics are not public.
  - - Consultant-led employer channel
    - Consultant influences or resells; employee uses; employer pays
    - Benefits selection and workforce mental-health strategy
    - Dedicated Calm Health consultant channel page
    - Named consultant firms and revenue mix are not public.
  - - Provider-referral / higher-acuity channel
    - Employer or payer sponsors access; user is referred into provider care
    - Escalation from digital support into therapy or psychiatry
    - LifeStance partnership with 550+ centers and Magellan clinical routing
    - Referral completion, reimbursement, and retention outcomes are private.
  - - Public-sector or mission-driven teams
    - Department or agency buys; officer or employee uses; public employer pays
    - Everyday mental health support for high-stress occupations
    - Atlanta Police Department case study for roughly 1,800 sworn officers
    - Case study is early-stage and lacks multiyear results.
  notes: |-
    Segmentation is organized by buyer-user-payer structure because Calm combines a direct consumer app with a sponsor-funded Calm Health channel.
