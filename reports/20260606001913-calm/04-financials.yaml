- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Current public substitute
  - Why substitute is insufficient
  - Exact diligence path
  rows:
  - - Realized consumer ASP and app-store fee burden
    - Blocks net revenue and gross-margin modeling
    - Public list prices on web and Apple
    - List prices do not show discounts, fee take-rates, refunds, or billing mix
    - Request channel P&L with gross billings, app-store commissions, taxes, and net revenue
  - - B2C vs Calm Health revenue mix
    - Blocks underwriting of segment durability and channel concentration
    - Covered lives, partner announcements, and subscriber proxies
    - Reach does not equal revenue and says nothing about contract value or renewal quality
    - Request ARR bridge by consumer, payer, employer, consultant, and other channels
  - - Gross margin and content-cost bridge
    - Blocks judgment on software-like economics vs content-heavy margin pressure
    - Pricing update language plus product-content breadth
    - Public sources show cost drivers but not actual margin capture
    - Request gross margin by segment, royalty or content cost detail, and hosting/support spend
  - - CAC, payback, and sales cycle
    - Blocks GTM efficiency analysis
    - Engagement proxies and covered-life expansion
    - Clinical engagement metrics are not acquisition-cost metrics
    - Request CAC by channel, sales cycle by segment, and payback by cohort
  - - Cash balance, burn, and runway
    - Blocks capital-adequacy and next-round dependency view
    - Historic financing anchors and 2022 layoff history
    - Raised capital in 2020 says nothing about cash remaining in 2026
    - Request monthly cash report, burn bridge, downside case, and next financing trigger
  - - Debt, commitments, and contingent liabilities
    - Blocks fixed-charge and downside-risk modeling
    - Privacy investigation and general absence of filings
    - Public record does not quantify debt, lease, or legal reserve exposure
    - Request debt schedule, lease obligations, content/licensing minimums, and litigation reserve memo
  notes: The public record describes Calm’s monetization shape and partner reach, but the private operating pack is still missing for a true underwrite.
