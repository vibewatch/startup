    - Needed to convert historical funding into current financing dependency
    - Request net burn, gross burn, and 18-month budget vs actuals
  - - Debt or fixed obligations
    - No public disclosure found
    - Low
    - Debt, guarantees, or vendor obligations can change financing risk materially
    - Request debt schedule, lease commitments, content-licensing minimums, and covenant summary
  notes: Public financing facts are good enough to identify a 2020 anchor but not good enough to calculate present-day runway.
