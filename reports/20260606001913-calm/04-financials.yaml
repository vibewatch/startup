company:
  name: Calm
chapter:
  number: 4
  title: Financials
  summary: Calm’s public evidence supports a mixed monetization stack spanning flagship subscriptions, a separate Calm Sleep app, and enterprise Calm Health channels, but the public top line and lifetime capital raised do not reconcile cleanly. Pricing and partner reach are visible; realized ASP, margin, retention, cash, burn, and runway are not, so capital adequacy remains a diligence blocker rather than a solved underwriting question.
sections:
- id: FIN401
  title: Revenue streams, pricing, and recognition visibility
  body: 'Calm''s public pricing surfaces make the basic revenue architecture easy to understand even though realized economics remain opaque. On the consumer side, Calm sells recurring access through direct web checkout and app stores, but the public list prices are not perfectly aligned. The web checkout currently shows a 7-day free trial that rolls to a $69.99 annual plan, plus a one-time $39.99 Calm for Life offer. Apple''s App Store instead lists $14.99 monthly, $69.99 yearly, and a $399.99 lifetime purchase, while Google Play confirms Android distribution through a free download with in-app purchases. Calm then added a second consumer SKU in 2025 with Calm Sleep, a separate iOS app priced at $69.99 per year. Beyond direct-to-consumer subscriptions, the business clearly monetizes through Calm Health: official employer, payer, consultant, and partner-portal pages show a channel-led B2B motion spanning self-insured employers, health plans, consultants, and organized group administration.
    What remains hidden is revenue mix and revenue-recognition detail. Public sources do not show how much comes from web versus app-store billing, how much of lifetime or promotional pricing is actually realized, or how consumer subscriptions compare with Calm Health contracts.'
