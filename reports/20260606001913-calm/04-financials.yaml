  rows:
  - - Flagship Calm subscriptions
    - Recurring consumer subscription via web and app stores
    - Subscriber / billing term
    - Web annual $69.99; App Store monthly $14.99 and annual $69.99
    - High visibility on list price, low visibility on realized net revenue
    - Request net revenue by channel after app-store fees, taxes, and refunds
  - - Calm for Life web offer
    - One-time lifetime-style access sold on web checkout
    - One-time purchase
    - Web checkout shows $39.99 billed once
    - Low quality as a pricing anchor because channel-specific and unusually promotional
    - Request redemption rate, attachment rate, and whether this is evergreen or campaign pricing
  - - Calm lifetime on iOS
    - One-time lifetime purchase through Apple billing
    - One-time purchase
    - App Store shows $399.99 lifetime
    - Medium quality because public list price is clear but platform share and realized mix are not
    - Request lifetime sales volume and share of total bookings
  - - Calm Sleep standalone subscription
    - Separate sleep-focused app sold as its own subscription
    - Subscriber / annual plan
    - iOS listing shows $69.99 per year
    - Medium-high because SKU and price are public, but adoption is not
    - Request Calm Sleep subscribers, attach rates, and cannibalization versus flagship Calm
  - - Calm Health employer and payer contracts
    - B2B contracts sold to employers, health plans, and self-insured groups
    - Account / contract / covered life
    - Supported by employer, payer, UnitedHealthcare, and Solera pages
    - Medium because channel is real but contract values and renewal structure are private
