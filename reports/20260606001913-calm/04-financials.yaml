  - Why it matters
  - Diligence ask
  rows:
  - - 2020 SEC financing anchor
    - Form D filed 2020-12-23; $40.0M offering, $39.49992M sold, 26 investors
    - High
    - Best direct filing evidence for late-2020 financing activity
    - Request signed financing ledger reconciling SEC filing with board materials
  - - Last widely cited valuation anchor
    - $2B in 2020 and still repeated publicly in 2025
    - Medium
    - Shows private-market benchmark used by third-party coverage
    - Request current 409A, preferred stack, and any secondary pricing
  - - Total raised tally A
    - $217M total funding (Latka)
    - Medium
    - One external lifetime-funding summary
    - Request official capitalization table and round-by-round cash proceeds
  - - Total raised tally B
    - $225M total funding over 9 rounds including 2021 grant (Tracxn)
    - Medium
    - Second external tally shows capital-history inconsistency
    - Request explanation of grant, prize, and non-equity inclusions
  - - Cash on hand
    - 'null'
    - Low
    - Determines actual downside resilience and runway
    - Request latest balance sheet, restricted cash, and monthly cash roll-forward
