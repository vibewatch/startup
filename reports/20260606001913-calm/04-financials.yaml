    - Consultants, partner portal, and networks broaden enterprise distribution
    - Partner / group launch
    - Consultants page, partner portal, and Solera network show channel-assisted GTM
    - Medium because reach is visible but economics are not
    - Request channel mix, reseller economics, and sales-cycle split by direct vs partner-led deals
  notes: Public sources show Calm’s monetization surfaces and channels, but not the realized revenue mix across them.
