  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Segmented revenue and ARR split across consumer web, app-store, Calm Sleep, employers, payers, consultants, and other channels.
    whyItMatters: Without a segment bridge, investors cannot judge revenue quality, channel concentration, or whether higher public revenue estimates are plausible.
    diligencePath: Request a management revenue bridge with monthly recurring revenue, enterprise ARR, and bookings-to-revenue reconciliation by channel.
    relatedQuestionRefs:
    - QI004
    - QI012
    - QI025
    relatedTableRefs:
    - TI001
    - TI003
  - type: missing-source
    severity: material
    topic: gross-margin
    missingEvidence: Gross margin by segment plus the cost bridge for app-store fees, hosting, royalties, content production, and Calm Health delivery costs.
    whyItMatters: Margin durability is one of the chapter’s core underwriting questions and cannot be inferred from pricing alone.
    diligencePath: Request segment gross margins, content and licensing cost schedules, and net revenue treatment for platform fees.
    relatedQuestionRefs:
    - QI016
    - QI018
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, sales cycle, pipeline conversion, payback period, and retention metrics for consumer and Calm Health channels.
    whyItMatters: Covered lives and engagement outcomes are useful but cannot substitute for actual sales-efficiency metrics when underwriting enterprise expansion.
    diligencePath: Request funnel metrics, CAC by channel, payback by cohort, and contract renewal metrics for enterprise accounts.
    relatedQuestionRefs:
    - QI017
    - QI019
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, restricted cash, monthly burn, runway, and downside liquidity plan.
    whyItMatters: Capital adequacy cannot be judged from historical fundraising alone, especially when the last clear financing anchor is from 2020.
    diligencePath: Request latest balance sheet, monthly cash bridge, budget-vs-actual burn, and board runway analysis.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: debt-and-commitments
    missingEvidence: Debt schedules, lease commitments, minimum content or celebrity licensing commitments, and any legal reserve or settlement exposure.
    whyItMatters: Fixed obligations can materially change the financing-dependency picture even when revenue looks healthy.
    diligencePath: Request debt and lease schedules, major vendor commitments, and a legal-liability summary from finance and counsel.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI004
    - TI005
  - type: conflicting-data
    severity: material
    topic: public-revenue-reconciliation
    missingEvidence: A board-approved or audited revenue bridge reconciling Sacra, Latka, and any internal definitions of revenue versus ARR.
    whyItMatters: The spread between the public revenue anchors is too wide to support valuation, margin, or growth conclusions with confidence.
    diligencePath: Request audited annual revenue by year plus a memo explaining what external data vendors are measuring and where they differ from company reporting.
    relatedQuestionRefs:
    - QI013
    - QI015
    relatedTableRefs:
    - TI003
    - TI004
