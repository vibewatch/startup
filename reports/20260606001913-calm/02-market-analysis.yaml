- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Global mental-health burden
    - tailwind
    - Ongoing
    - High prevalence keeps category demand broad rather than niche
    - Confirm which prevalence segments overlap with Calm's real paying channels
  - - Workplace productivity loss
    - tailwind
    - Ongoing
    - Employers have a budget rationale when anxiety and depression reduce productivity
    - Request employer ROI and renewal data instead of relying on category need alone
  - - Sleep and mental-health linkage
    - tailwind
    - Ongoing
    - Sleep content gives Calm a daily-use bridge into mental-health demand
    - Test whether sleep-led acquisition converts into paid retention or sponsor usage
  - - Consumer app-store familiarity
    - tailwind
    - Current
    - Strong brand/category familiarity may reduce activation friction after sponsor launch
    - Request activation and MAU data by channel
  - - iOS concentration
    - mixed
    - 2025-2031
    - Revenue concentration on iOS can help monetization but raises platform dependence
    - Review Apple/Google grossing share and margin sensitivity
  - - Privacy and HIPAA ambiguity
    - headwind
    - Current
    - Partial HIPAA coverage and expanding state privacy laws can slow trust and procurement
    - Review data flows, consent design, and state-law exposure
  - - Security-by-design expectations
    - headwind
    - Current
    - FTC guidance implies stronger product and compliance burden for wellness apps handling sensitive data
    - Review incident history and internal security controls
  - - Evidence and efficacy skepticism
    - headwind
    - Current
    - Digital mental-health adoption can stall if buyers doubt clinical impact beyond engagement metrics
    - Request RCTs, payer studies, and controlled outcome analyses
  - - Competitive sponsor market
    - headwind
    - Current
    - Headspace and similar platforms make enterprise buyers compare broader service bundles
    - Benchmark Calm against end-to-end vendor alternatives and pricing
  - - Undisclosed contract economics
    - headwind
    - Current
    - Lack of PEPM pricing and renewal data prevents precise SAM and SOM underwriting
    - Request contract cohorts, sponsor churn, and budget-owner decision criteria
  notes: Combines demand drivers with adoption frictions; the main diligence question is not whether need exists, but whether Calm can convert sponsor-controlled budgets with durable proof and pricing.
