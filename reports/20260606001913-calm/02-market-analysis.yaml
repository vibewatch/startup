  rows:
  - - Consumer mindfulness and sleep apps
    - Subscriptions for meditation, sleep stories, breathwork, music, and related self-care content
    - Higher-acuity therapy, psychiatry, and employer-paid care outside the subscription
    - Individual buyer / individual payer
    - This is Calm's legacy self-pay category and the easiest market boundary to observe in app stores
  - - Employer-sponsored digital mental health
    - Calm Health access, screenings, clinical programs, benefit integration, and navigation into EAP or therapy resources
    - Inpatient psychiatry, employer primary care, and unrelated wellness spend
    - HR or benefits buyer / employer payer
    - This is the clearest sponsor-backed channel described on Calm Health's employer pages
  - - Health-plan-sponsored member navigation
    - Member access, screening, referrals, and guided self-care layered onto plan benefits
    - Full claims administration and provider reimbursement outside the app
    - Plan leadership buyer / insurer payer
    - UnitedHealthcare shows Calm can be distributed as a plan-sponsored entry point rather than only a consumer app
  - - Broad digital mental health apps
    - Depression, anxiety, stress, wellness, and meditation app revenue in analyst market estimates
    - Physical-only wellness apps and many offline care categories
    - Mixed buyers / mixed payers
    - Useful upper TAM lens, but broader than Calm's historical meditation core
  - - Corporate wellness adjacency
    - Employer-controlled wellness budgets including EAP and health-benefit spending
    - Consumer self-pay subscriptions and most medical claims
    - Benefits leadership buyer / employer payer
    - Relevant only if Calm can win sponsor budgets rather than just consumer subscriptions
  - - Status-quo and free substitutes
    - Legacy EAPs, therapist directories, podcasts, YouTube, basic sleep hygiene, and free app tiers
    - N/A
    - Employer, plan, or consumer depending on path
    - These substitutes cap willingness to pay and explain why category growth does not translate mechanically into Calm revenue
  notes: Defines boundary from narrow consumer subscriptions to sponsor-backed navigation and broader employer budget adjacencies; excluded spend marks categories that inflate TAM without mapping directly to Calm revenue.
