  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sponsor-budget-ownership
    missingEvidence: Named buyer titles, renewal criteria, and broker or consultant role by employer size segment.
    whyItMatters: Public pages show sponsor-backed distribution, but they do not fully specify who signs, renews, or governs budget allocation in each segment.
    diligencePath: Request anonymized deal summaries, buyer personas, and implementation plans for employer and health-plan wins.
    relatedQuestionRefs:
    - QM018
  - type: private-evidence-only
    severity: blocking
    topic: calm-specific-sam-som
    missingEvidence: PEPM pricing, contract structure, sponsor retention, exact client counts, and active covered lives split by channel.
    whyItMatters: Without contract economics, public market-size lenses cannot be translated into a defendable Calm-specific SAM or SOM.
    diligencePath: Request current pricing sheets, top customer contracts, covered-life cohorts, and renewal/churn data segmented by employer and health-plan channel.
    relatedQuestionRefs:
    - QM024
    - QM025
  - type: conflicting-data
    severity: material
    topic: tam-boundary-definition
    missingEvidence: A management-approved market-boundary memo that explains which category definition the company uses in fundraising and internal planning.
    whyItMatters: Public estimates range from a sub-US$0.5B mindfulness niche to multi-billion digital mental-health-app categories and much larger corporate-wellness budgets, which can materially change valuation framing.
    diligencePath: Ask management to reconcile consumer-app, sponsor-backed digital mental-health, and employer-wellness TAM/SAM definitions against actual pipeline composition.
    relatedQuestionRefs:
    - QM010
    - QM024
    relatedTableRefs:
    - TM002
