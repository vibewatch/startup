  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and SKU map
        blocks:
          - type: paragraph
            body: >-
              Calm's product definition is workflow-specific rather than category-generic. The flagship Calm app is the
              broad consumer entry point for stress management, sleep, relaxation, breathwork, and habit formation,
              delivered through mobile, web, and connected-device surfaces. Its operating logic is not just a content
              library: the app organizes repeat use through Daily Calm, multi-day programs, check-ins, streaks,
              breathing tools, and sleep-oriented collections that pull users back into recurring routines. Public
              app-store and support surfaces also show that Calm's consumer product spans more than meditation alone,
              with music, movement, and work-oriented sessions layered into the same subscription.


              Calm has since split that broad wellness layer into clearer SKUs. Calm Sleep, launched in September 2025,
              is a dedicated sleep app with its own onboarding questionnaire, daily plans, sleep-readiness bar, wearable
              sync, and sleep-specific premium packaging. Calm Health is different again: it is invitation-only,
              distributed through employers, health plans, and providers, and starts with screening plus personalized
              action plans instead of open consumer checkout. Taken together, Calm now sells one brand through three
              operating motions: direct-to-consumer subscription, sleep-specific consumer upsell, and sponsor-funded
              mental-health navigation.
