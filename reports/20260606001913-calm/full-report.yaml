      - number: '3.3'
        title: Calm Health versus employer mental-health platforms
        blocks:
          - type: paragraph
            body: >-
              Calm Health's public positioning is strongest when the buyer wants an engaging, lower-acuity front door
              that can triage members to existing benefits. Calm Health highlights screenings, personalized programs,
              benefit-aware referrals, and engagement metrics, and UnitedHealthcare's public pages show how that model
              works inside a large health-plan channel. That is commercially useful, but it is not the same as owning a
              large in-house therapy, psychiatry, and coaching network. On disclosed scale and clinical breadth,
              Headspace, Lyra, Spring Health, and Modern Health all publish stronger evidence for broader employer
              coverage and more comprehensive care stacks.

              Headspace says it serves 4,000+ organizations with 15,000+ providers across 190+ countries and backs the
              product with a large research archive. Lyra says it serves more than 20 million people directly and has
              pathways for more than 200 million through partners and plans. Spring Health says it supports more than 20
              million covered lives and markets rapid provider matching plus guaranteed ROI. Modern Health emphasizes
              200+ countries, 80+ languages, and flexible PEPM or usage-based pricing. These disclosures matter because
              employer buyers often evaluate not just content quality, but whether the vendor can replace or materially
              outperform a legacy EAP, contract globally, and report measurable outcomes to finance and benefits teams.
              Calm Health can still win as an add-on or engagement layer, but the public record makes it harder to argue
              that Calm already owns the enterprise mental-health budget.
