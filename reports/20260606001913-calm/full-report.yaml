  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Calm sits across two related but economically distinct markets. On the consumer side, Apple and Google
              position Calm as a sleep, meditation, and relaxation app with subscription monetization, which places it
              in the same broad consideration set as mindfulness, sleep, and stress-management utilities. On the
              sponsor-backed side, Calm Health is explicitly framed as an employer- and health plan-sponsored digital
              mental health solution with screenings, clinical programs, and referrals into benefits or external care.
              That means the core market is not simply "meditation apps"; it is a hybrid of consumer self-pay wellness
              and sponsor-funded digital navigation for lower- to moderate-acuity mental health needs.


              Boundary discipline matters because the substitutes change with the buyer. A self-pay user can choose
              Headspace, other wellness apps, or free digital content. A benefits leader can choose status-quo EAPs,
              carrier tools, or a broader mental health platform that bundles coaching, therapy, and psychiatry.
              Headspace's own enterprise pages show that sponsor-backed mental health is already crowded and that buyers
              do not have to buy a meditation-first solution. For diligence, Calm should therefore be evaluated against
              both consumer app substitutes and sponsored mental-health platforms, while inpatient psychiatry,
              high-acuity clinical care, and general prevalence figures remain important demand context rather than
              direct revenue pools.
