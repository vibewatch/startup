        title: Public traction and GTM expansion
        blocks:
          - type: paragraph
            body: >-
              The strongest public traction signals are distribution breadth and partner reach rather than audited
              financial statements. Calm's about page says the flagship app has passed 180 million downloads and 3
              million five-star reviews, while Apple still shows roughly 2 million ratings on the iOS listing.
              Third-party market data adds another layer: Sacra says Calm has more than 4 million paying subscribers,
              which combined with a roughly $70 annual list price implies about $280 million of consumer list-price
              revenue capacity before app-store fees, discounts, taxes, and any B2B contribution. The more important
              incremental growth vector is Calm Health. The official product and partner pages, plus UnitedHealthcare
              and Solera announcements, support at least three institutional channels: large payer distribution,
              employer benefits, and consultant- or network-led resale. UnitedHealthcare alone says more than 13 million
              commercial members and family members have access, Solera says the network expansion adds more than 16
              million individuals, and Calm's own 2025 press says Calm Health reaches more than 3,500 organizations and
              over 26 million covered lives. Those scale markers suggest enterprise GTM is materially supplementing the
              consumer funnel, but public CAC, payback, sales-cycle, and retention data are still absent, so these
              remain proxies rather than a clean sales-efficiency model.
