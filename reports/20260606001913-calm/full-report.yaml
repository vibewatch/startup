  - id: TP003
    title: Employer mental-health platform comparison
    columns:
      - company / path
      - care model
      - disclosed scale
      - pricing disclosure
      - GTM / distribution posture
      - implication for Calm Health
    rows:
      - - Calm Health
        - Screenings, programs, referrals, self-care content, benefits navigation
        - 3,500+ organizations and 26M+ covered lives; 13M+ UHC commercial members
        - Contact sales; no public PEPM list price
        - Employers, health plans, providers; strongest named proof is UnitedHealthcare
        - Strong engagement wedge, but public record suggests lower clinical depth than full-stack platforms
      - - Headspace for Organizations
        - Prevention plus coaching, therapy, psychiatry, AI companion, measurement-based care
        - 4,000+ organizations, 15k+ providers, 190+ countries
        - Contact sales for organizations; consumer list prices public
        - Employer-led and globally distributed; also benefits from large consumer funnel
        - Most direct hybrid rival because it spans Calm's DTC and B2B surfaces
      - - Lyra Health
        - Preventive tools, therapy, medication management, acute care, family support, coordinated care
        - 20M+ people directly; 200M+ through partners and plans
        - Tailored quote only
        - Employer, plan, provider, and partner channels with EAP replacement framing
        - Much deeper clinical scope and broader enterprise path than Calm Health currently discloses
      - - Spring Health
        - Matching, therapy, coaching, platform analytics, guaranteed ROI
        - 20M+ covered lives globally; <1 day access; 92% improve clinically
        - Tailored quote only
        - Employer and benefits-led motion built around measurable outcome and savings claims
        - Strong competitor whenever buyer wants finance-grade ROI evidence rather than engagement content
      - - Modern Health
        - Adaptive care across self-guided tools, coaching, therapy, crisis care
        - 200+ countries, 80+ languages, proprietary provider network
        - PEPM or usage-based
        - Global employer motion optimized for multinational coverage and flexible financing
        - Harder for Calm Health to displace where language coverage and global rollout matter
      - - Status quo / internal build
        - Existing EAP or health-plan benefits plus one or more wellness apps
        - Buyer-specific and usually undisclosed
