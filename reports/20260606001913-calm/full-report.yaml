      - number: '8.4'
        title: Recommendation, Downside Triggers, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The most supportable public-only recommendation is research-more, with medium confidence, a high risk
              rating, and a stretched valuation stance at the legacy mark. The bull case is not imaginary: Calm could
              still deserve a premium if the higher revenue estimate is real, if Calm Health materially improves growth
              durability, and if the post-COVID reset was a temporary cost correction rather than evidence of structural
              plateauing. But the anti-thesis is stronger today because the public record still lacks the details that
              would separate a resilient subscription and enterprise platform from a brand living off a stale financing
              halo. The downside triggers are concrete: another sign that growth flattened after pandemic pull-forward,
              inability to reconcile revenue sources, no clean paid-subscriber or enterprise-retention disclosure, or
              financing terms that make the headline valuation economically weaker than it appears. The diligence asks
              are equally concrete. Before paying near the old mark, an investor should insist on current revenue mix,
              retention, margin, contract archetypes, cap-table terms, and any recent internal or secondary price
              discovery. Until then, Calm is a company worth understanding further, not a price worth accepting at face
              value.
