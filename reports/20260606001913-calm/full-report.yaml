  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Legacy Mark and Financing Context
        blocks:
          - type: paragraph
            body: >-
              Calm's valuation story still starts with a five-year-old financing event. Tracxn and Latka both keep the
              last publicly disclosed round at the December 2020 Series C, and CNBC still described Calm as a $2 billion
              company in January 2025. That matters because the headline price remains part of the company's narrative
              even though the public record does not show a newer priced equity round that resets the mark for 2025 or
              2026 conditions. Calm is not a dead asset: its official checkout still shows an annual consumer
              subscription and a one-time lifetime-style offer, while Calm Health still markets evidence-based programs
              and measurable engagement. But valuation is about what investors can underwrite now, not just what the
              company once raised at. Public sources do not disclose current cap-table terms, fresh secondary prints, or
              a newer financing reference, so the starting point for any entry discussion is a stale headline mark with
              unclear common-equity economics rather than a fresh market-clearing price.
            claimRefs:
