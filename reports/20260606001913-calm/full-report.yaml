      - number: '2.2'
        title: Sizing lenses and contradictory estimates
        blocks:
          - type: paragraph
            body: >-
              Calm's market can be sized only through lenses, not with one clean public TAM. The narrowest comparable
              lens is the mindfulness and meditation app niche, where Future Market Insights estimates just US$172.3
              million in 2024, growing to US$467.6 million by 2034. The broad digital mental health-app lens is far
              larger: Grand View, Research and Markets, Mordor, and Global Market Insights put the current global market
              around US$7.48 billion to US$9.6 billion and the early-2030s outlook around US$17.52 billion to US$18.81
              billion, with GMI's 2035 bull case rising to US$40.9 billion. The adjacent employer-controlled budget pool
              is larger still, with corporate wellness estimates running from US$53.54 billion in 2024 to US$61.2
              billion in 2021 and US$94.6 billion in 2026 depending on the publisher and category definition.


              The practical implication is that Calm's valuation narrative can be exaggerated if these boundaries are
              blended. A consumer-meditation niche alone is too small to justify broad software-style upside; a broad
              digital mental health apps lens is more supportive but includes therapy, coaching, and other categories
              beyond Calm's historical core; and corporate wellness budgets are only relevant if Calm can convert
              sponsor-controlled budgets rather than just consumer willingness to pay. Public evidence therefore
              supports a constrained view: Calm participates in a much larger stress, sleep, and mental-health demand
              pool, but its monetizable served market is narrower and still imperfectly disclosed.
