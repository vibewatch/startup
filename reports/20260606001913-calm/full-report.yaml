  - id: TV004
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation logic
      - Probability signal
      - Key risk
    rows:
      - - Bull
        - >-
          Revenue quality is near the $596.4M Latka anchor, Calm Health adds durable growth, and investors still pay ~4x
          to 5x revenue for branded subscription platforms.
        - Roughly $2.4B to $3.0B fair-value range, which can support or exceed the legacy mark.
        - >-
          Possible, but it requires diligence to prove that the higher revenue estimate is durable and not low-quality
          mix.
        - A strong headline can still hide weak retention, enterprise concentration, or ugly preference terms.
      - - Base
        - >-
          Durable revenue is closer to $400M to $500M, growth is respectable but not euphoric, and buyers use ~2x to 3x
          public-growth multiples.
        - Roughly $0.9B to $1.5B fair-value range, below the legacy mark but not a broken company outcome.
        - >-
          Most plausible public-only case because it bridges the optimistic and conservative revenue anchors without
          paying a full premium.
        - The market could still demand more discount if growth or margins disappoint.
      - - Bear
        - >-
          Monetizable revenue is closer to the lower Sacra-style base, growth flattened after COVID pull-forward, and
          buyers apply ~1x to 2x revenue or worse.
        - Roughly $0.3B to $0.6B, with harsher public-compression cases even lower.
        - Meaningful risk if Calm cannot show cleaner paid-subscriber, enterprise, and financing-term evidence.
        - Reset risk can compound quickly if the old valuation anchor keeps management expectations too high.
    notes: >-
      These are scenario ranges, not claims of current fair value. They are meant to force price discipline against a
      stale legacy round rather than pretend the public file supports false precision.
    claimRefs:
