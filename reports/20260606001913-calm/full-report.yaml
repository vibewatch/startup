  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Privacy / VPPA / regulator escalation
        - Filed complaint, subpoena, state-AG inquiry, or disclosed incident tied to viewing or health-linked data
        - Any formal action or internal audit showing non-separate consent, problematic pixels, or undisclosed sharing
        - Pause conviction, escalate legal diligence, and haircut retention plus enterprise-expansion assumptions
      - - App-store dependence
        - App rejection, forced disclosure rewrite, billing-policy enforcement, or removal of a core feature
        - Any Apple or Google action that materially raises acquisition friction or blocks current billing flows
        - Treat as thesis-break risk until management proves alternative distribution and stable conversion
      - - Partner / customer concentration
        - Loss, repricing, or muted promotion from UHC, Solera, Magellan, or another top sponsor
        - A single sponsor or intermediary accounts for outsized covered lives or revenue and then weakens
        - Cut sponsor-channel growth assumptions and require concentration protections before investing
      - - Content efficacy / engagement
        - Renewal weakness, lower usage, higher refunds, or weak outcome evidence
        - Cohorts or sponsor metrics show durable engagement below plan or no measurable benefit from programs
        - Reduce LTV assumptions and move the company toward a lower-conviction or research-more stance
      - - Leadership transition
        - No named CEO, additional senior departures, or unclear ownership of Calm Health and Calm Sleep
        - >-
          Succession remains unresolved through the next operating cycle or turnover spreads into product and
          go-to-market leaders
        - Demand governance clarity and succession protections or step back
      - - Financial-model quality
        - Billing-mix surprise, refund spikes, or weaker post-layoff efficiency than implied by the story
        - Private KPI disclosure shows churn, CAC payback, or gross margin materially worse than underwritten
        - Re-cut valuation and hold-off decision until new unit-economics evidence is available
    notes: >-
      Kill criteria are intentionally monitorable and geared to IC diligence; they turn narrative risk into thresholds
      that can actually break the underwriting case.
    claimRefs:
      - CR051
      - CR052
      - CR053
      - CR054
      - CR055
