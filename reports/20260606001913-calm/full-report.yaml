      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Capital adequacy is the most important unresolved financial question. The best hard filing evidence is
              Calm's December 2020 SEC Form D, which listed a $40 million total offering amount, $39.5 million sold, and
              26 investors. That is directionally consistent with a major late-2020 financing, but it does not line up
              neatly with market-data summaries that cite a $75 million Series C and roughly $217 million to $225
              million of lifetime funding. Because public cash balance, burn, runway, and debt disclosures are absent,
              investors cannot tell how much of that 2020 raise remains, whether the business is self-funding today, or
              whether the next financing would be strategic or necessary. The adverse record is not catastrophic, but it
              is not clean either: MobiHealthNews reported a roughly 20% layoff in 2022, the company raised annual
              pricing in February 2026, and a public privacy investigation adds some legal-overhang risk to a business
              that depends heavily on app distribution and consumer trust. The financial verdict is therefore mixed.
              Calm appears to have a real subscription engine, real enterprise distribution, and enough market presence
              that a zero-revenue or purely promotional story is off the table. But the combination of conflicting
              revenue estimates, inconsistent funding tallies, and missing cash- and margin-level disclosure means
              public evidence is not yet sufficient for a clean underwriting case. Management materials are still
              mandatory before taking a conviction view on revenue quality or capital adequacy.
