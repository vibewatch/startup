              preventive benefit for employees, Sierra Nevada says workers actively notice when monthly Calm calendars
              are missing, and Parkview Health uses Calm as a burnout-support tool for healthcare staff. Calm also now
              has a public-sector case study with Atlanta Police Department, where the case-study page says about 1,800
              sworn officers face routine trauma and the department is launching Calm Health because it “checks every
              box” for everyday support.


              The payer and provider proofs are stronger on distribution mechanics than on long-run economics.
              UnitedHealthcare is the clearest named payer, because it publishes member access and symptom-improvement
              data in its own voice. Magellan shows EAP and employer routing, and LifeStance confirms that Calm Health
              is designed to escalate beyond self-guided content into therapy and psychiatry when screenings indicate
              higher need. The weakness is not the existence of customers; it is proof depth. Most named references are
              testimonials, access announcements, or early case studies rather than multiyear renewal disclosures,
              seat-expansion histories, or account-level revenue outcomes.
