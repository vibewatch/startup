          The public record supports further diligence, not a clean buy, because the price anchor is stale and the proof
          stack is incomplete.
        - Do not underwrite the legacy mark without a private data pack.
      - - Confidence
        - Medium
        - >-
          There is enough evidence to say the old mark is hard to underwrite, but not enough to build a precise target
          return.
        - Use the chapter to set diligence priorities rather than to force precision.
      - - Risk rating
        - High
        - Revenue, subscriber, enterprise, and cap-table ambiguity leave many downside paths open.
        - Assume reset risk until retention, margin, and preference terms are shown.
      - - Valuation stance
        - Stretched
        - >-
          The legacy $2 billion mark can be defended only under stronger revenue and disclosure assumptions than public
          evidence currently proves.
        - Treat the historical round price as a ceiling that still needs re-validation.
      - - Decision implication
        - Price-sensitive track only
        - Calm may be strategically relevant, but current public evidence does not justify price-taking.
        - Engage only if diligence proves durable scale or the effective entry price is materially lower.
    notes: >-
      This table summarizes the public-only investment call; it is not a substitute for a cap-table review or a live
      private-company valuation memo.
