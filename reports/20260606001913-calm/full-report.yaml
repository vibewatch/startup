      - number: '1.2'
        title: Leadership, governance, and key-person risk
        blocks:
          - type: paragraph
            body: >-
              Leadership and governance are in transition. Founders Alex Tew and Michael Acton Smith still anchor the
              brand and were described by CNBC in early 2025 as co-executive chairmen, while the February 2022 Ripple
              acquisition pulled David Ko into the company first as co-CEO and later, per MobiHealthNews, as sole chief
              executive. That sequence matters because Ko was the clearest public operator behind Calm's shift into
              healthcare distribution.


              The next transition is less resolved. Fast Company reported on April 7, 2026 that Ko stepped down and
              became a senior adviser to the board, but the reviewed official Calm pages do not name a new CEO. Tracxn
              offers a third-party board snapshot with seven members including the founders and investor-linked
              directors, yet Calm does not publish a current board roster in the reviewed first-party source set.
              Governance visibility is therefore materially weaker than brand visibility.


              The key diligence read-through is concentration. The founders still appear central to brand, narrative,
              and chair-level influence; Ko was central to the payer/provider strategy; and no public successor plan is
              obvious. Calm looks operable at scale, but it still appears key-person dependent at exactly the moment its
              healthcare ambitions are broadening.
