      - number: '2.3'
        title: Buyers, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The user is usually an individual with stress, sleep, anxiety, or mild-to-moderate mental-health needs,
              but the payer often is not that individual. In the sponsor-backed channel, employers and health plans pay
              while members, employees, and dependents use the product. Calm Health's employer and health-plan pages
              both center on screening, guidance, benefit integration, and referrals, which means the product is sold
              less as a standalone meditation subscription and more as an engagement layer that can steer people into
              sponsored care. UnitedHealthcare's public descriptions reinforce that logic: Calm Health is integrated
              into plan benefits, supports GAD-7 and PHQ-9 screening, and can refer users onward to coaching or therapy
              when needed.


              The adoption path therefore runs through familiarity plus navigation. App-store presence reduces discovery
              friction because millions of consumers already recognize Calm's brand and category. Sponsor deployment
              then depends on budget owners in HR, benefits, broker, or health-plan leadership choosing a solution that
              can activate users once eligibility exists. Calm's public sponsor pages provide encouraging engagement
              metrics, including screening completion and therapy-conversion claims, but they do not disclose exact PEPM
              pricing, renewal terms, or client counts. That leaves public evidence strong on buyer-user-payer structure
              and weaker on the contract economics that would convert structure into a precise SAM or SOM.
