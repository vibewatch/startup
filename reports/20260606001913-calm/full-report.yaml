      - number: '1.3'
        title: Capital, scale, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Calm's capital and scale profile is strong by private consumer-health standards, but not perfectly
              reconciled. Public sources still anchor the last clear pricing event at the December 2020 Series C: $75
              million at a $2 billion valuation. The Hustle's 2019 reporting makes Calm a $1 billion unicorn one round
              earlier, while Sacra, Latka, and Tracxn diverge on lifetime capital raised, landing in a roughly $217
              million to $225 million band depending on grant inclusion and database treatment.


              Operating scale is also only partly observable. Latka reports $596.4 million of 2024 revenue and about 764
              employees by late 2025. Sacra and Expanded Ramblings put the subscriber signal around 4 million paying
              subscribers or users/subscribers, but both stop short of a fresh audited membership count. That is enough
              to frame Calm as large, subscription-led, and mature; it is not enough to underwrite cohort quality, gross
              margin, or retention.


              Stakeholder dependence has shifted. Apple and Google remain crucial consumer distribution surfaces, but
              the more differentiated growth story now runs through Calm Health. Official and partner sources show more
              than 3,500 organizations, over 26 million covered lives, and a UnitedHealthcare relationship alone
              reaching 13 million commercial members. That mix increases enterprise relevance while also increasing
              channel concentration risk.
