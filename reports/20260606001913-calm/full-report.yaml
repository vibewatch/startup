  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              Calm is not facing a single binary existential threat; it is facing a stack of correlated risks that can
              reinforce each other. The highest-ranked public risk is legal and privacy exposure because Calm's own
              policies admit broad usage, device, advertising, sponsor-enrollment, and optional health-data flows, while
              an active public VPPA-style investigation argues that video-viewing behavior may have been transmitted to
              Meta/Facebook. The second tier is platform and partner dependence: Apple and Google still control a
              meaningful share of discovery, billing, privacy disclosures, and review outcomes for the flagship app,
              while Calm Health depends on health plans, employers, and networks such as UnitedHealthcare, Magellan, and
              Solera to reach covered lives.


              The third tier is execution and model risk. Calm already had to reset its cost base in 2022, suggesting
              post-pandemic demand normalization is not just a theoretical downside. At the same time, the company is
              broadening from a single subscription app into Calm Sleep, payer/provider workflows, and licensed
              hardware, bedding, and hospitality experiences. That expansion can help growth, but it also raises the
              odds that support quality, compliance discipline, or management focus gets stretched. The watchlist
              therefore should center on privacy escalation, app-store or billing friction, partner concentration,
              churn/renewal deterioration, and unresolved CEO succession.
            claimRefs:
