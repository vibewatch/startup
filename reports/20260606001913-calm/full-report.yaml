  - id: TP001
    title: Competitor profile table
    columns:
      - competitor
      - category
      - public scale / pricing proof
      - target segment
      - key differentiation
      - key limitation versus Calm
    rows:
      - - Headspace / Headspace for Organizations
        - Direct peer plus employer platform
        - $12.99 monthly / $69.99 annual; 4,000+ organizations; 15k+ providers
        - Consumers, employers, health-plan-linked members
        - Mindfulness, sleep, coaching, therapy, psychiatry, AI companion, strong research base
        - Consumer pricing is near-parity with Calm and enterprise disclosures are stronger, limiting Calm's uniqueness
      - - Insight Timer
        - Freemium direct substitute
        - 330,000 free tracks; optional $59.99 annual premium; 36M people trusted
        - Consumers seeking low-cost meditation and sleep support
        - Largest free library and clear free-to-paid ladder
        - Lower production polish and less sleep-first branding than Calm, but much cheaper
      - - BetterSleep
        - Sleep-first adjacent peer
        - 65M+ users worldwide; pricing varies by plan, region, and platform
        - Consumers prioritizing sleep over broad mindfulness
        - Strong sleep focus with 300+ sounds, 250+ meditations/hypnosis, and 100+ stories
        - Narrower mental-wellness breadth than Calm and less transparent public pricing
      - - Happier Meditation
        - Mindfulness-focused direct peer
        - 500+ guided meditations; $99.99 annual membership on App Store
        - Consumers seeking teacher-led mindfulness and courses
        - Strong teacher brand and practical mindfulness positioning
        - Less sleep breadth and no disclosed employer scale comparable with Calm Health
      - - Peloton App
        - Bundled wellness substitute
        - Thousands of classes and a 30-day free trial on reviewed page; meditation included in broader app
        - Existing Peloton or fitness-membership users
        - Meditation rides alongside fitness habit loops and community features
        - Wellness is a feature inside fitness, not a sleep-first destination like Calm
      - - Apple Fitness+ / Apple One
        - Bundled platform substitute
        - $9.99 monthly / $79.99 annual; also bundled inside Apple One
        - Apple-device users already paying for a broader service bundle
        - Meditation is bundled with workout types, recommendations, and Apple ecosystem distribution
        - Meditation depth is secondary to the larger fitness-and-services bundle
      - - BetterHelp
        - Higher-acuity therapy substitute
        - 32,000+ providers; $70-$100 per week private-pay membership
        - Consumers seeking therapy rather than content-first mindfulness
        - Large therapy network and select insurance relationships
        - Privacy/regulatory baggage and higher price point make it a substitute, not a clean Calm analogue
      - - Calm Health
        - Employer / payer navigation layer
        - 3,500+ organizations; 26M+ covered lives; 13M+ UnitedHealthcare commercial members
        - Employers, health plans, and providers
        - Screenings, psychologist-built programs, benefits-aware referrals, and high engagement
        - Publicly disclosed clinical depth is lighter than Lyra, Spring Health, or Modern Health
      - - Lyra Health
        - Employer mental-health platform
        - 20M+ people directly; 200M+ through partners and plans
        - Employers, plans, providers, channel partners
        - EAP replacement positioning, AI matching, therapy, medication management, complex-care support
        - Pricing undisclosed and enterprise, not consumer, so it does not solve Calm's DTC job directly
      - - Spring Health
        - Employer mental-health platform
        - 20M+ covered lives; <1 day to first appointment; guaranteed ROI
        - Employers and their members / families
        - Rapid matching, integrated platform, ROI framing, strong measurement language
        - Less consumer mindshare than Calm and less emphasis on stand-alone sleep content
      - - Modern Health
        - Employer mental-health platform
        - 200+ countries; 80+ languages; PEPM or usage-based pricing; $2.39 ROI per $1
        - Global employers and distributed workforces
        - Global access and flexible pricing model for multinational buyers
        - Public brand pull is weaker than Calm's consumer sleep franchise
      - - Smiling Mind / Humin
        - Free nonprofit / science-based substitutes
        - Free apps; millions or 1M+ people impacted; evidence-led positioning
        - Budget-sensitive consumers and employers seeking low-cost prevention
        - Zero-price entry and credible evidence-based framing
        - Less entertainment value and brand scale than Calm's premium consumer product
