      - number: '7.4'
        title: Partner, customer concentration, and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              Partner and customer-concentration risk is clearest inside Calm Health. The product is positioned less
              like a direct-to-consumer app and more like a sponsored distribution layer for employers, health plans,
              and providers. Public sources name large channels: UnitedHealthcare says Calm Health is being brought to
              more than 13 million commercial members, Magellan is routing select employer customers and members into
              the product, and Solera says Calm Health joined its employer-and-health-plan network while already being
              available to tens of millions of people through sponsored channels. Those are growth positives, but they
              also mean access, referrals, and renewal economics can become concentrated in a small number of
              counterparties whose contracts are not public.


              The residual risk is not merely that one logo could leave. It is that a handful of payers, benefits
              platforms, and employer sponsors may shape activation volume, covered lives, clinical routing, and pricing
              power at the same time. Public Calm Health metrics show some mitigation, with screening and engagement
              figures that imply the product is not inert once members enroll. But those are still company-claimed
              outputs, not a full concentration or retention picture. Investors therefore need to underwrite Calm Health
              as a dependency-heavy channel business until management can show revenue mix, renewal calendars,
              termination rights, and what happens if a top sponsor or intermediary changes strategy.
