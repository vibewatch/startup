        - id: u2
          label: Paid subscriber anchor
          detail: Sacra cites 4M+ paying subscribers at about $70/year pricing.
        - id: u3
          label: Implied consumer capacity
          detail: Simple list-price math suggests about $280M of consumer revenue capacity before fees and discounts.
        - id: u4
          label: Enterprise engagement proxy
          detail: Calm Health cites 37% therapy engagement, 2x outpatient engagement, and UHC outcome improvement.
        - id: u5
          label: Public revenue conflict
          detail: External revenue anchors range from ~$300M to ~$596.4M.
        - id: u6
          label: Underwrite blocked
