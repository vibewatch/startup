chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and distribution
        blocks:
          - type: paragraph
            body: >-
              Calm presents as a mental health company anchored by a subscription app rather than a narrow meditation
              utility. Official pages describe meditation, Sleep Stories, music, movement, and work-focused sessions,
              while Apple and Google app-store listings confirm broad mobile distribution. The core product is still the
              flagship Calm app, but the September 2025 Calm Sleep launch shows continued product-line expansion around
              sleep.


              Scale is materially supportable, though much of it is still company-claimed. Calm's about and newsroom
              surfaces state more than 180 million downloads, 3 million 5-star reviews, availability in more than 190
              countries, and seven languages. Official help content and the App Store also corroborate the 2012 launch
              year, founder names, 500+ Sleep Stories, and Apple's 2017 App of the Year recognition.


              Monetization is clearer than at many private consumer apps but not perfectly consistent across channels.
              Apple's listing shows $14.99 monthly, $69.99 annual, and $399.99 lifetime plans, while Calm's direct web
              plan page currently shows the annual tier plus a $39.99 one-time "Calm for Life" offer. That mismatch
              should be treated as a diligence follow-up rather than assumed price segmentation logic.
