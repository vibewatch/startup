      - number: '8.2'
        title: Proof Stack Versus Comparable Benchmarks
        blocks:
          - type: paragraph
            body: >-
              The public proof stack is directionally encouraging but numerically uneven. Latka places Calm at $596.4
              million of 2024 revenue, while Sacra keeps a much lower $300 million revenue base for 2023 and explicitly
              frames Calm as a company that surged during COVID and then flattened. Expanded Ramblings adds scale
              signals such as 180 million-plus downloads, more than 3,500 organizations, 26 million-plus covered lives,
              and a 4 million-plus users or subscribers signal, but even that subscriber language is not a clean
              paying-member disclosure. When the comparison set shifts to public markets, the tolerance for ambiguity
              collapses quickly. Duolingo and Hims both support multibillion-dollar equity values with clear revenue
              disclosure, while Talkspace and especially Teladoc show how harsh mental-health and virtual-care
              compression can become in public markets. Private employer-focused peers reinforce the same lesson from a
              different angle: Headspace and Unmind both publish fresher evidence of partner reach, clinical breadth, or
              capital formation than Calm does around a new round. In short, Calm still has strategic relevance, but its
              public proof is thinner than the benchmark set investors would use to justify paying near the legacy mark.
