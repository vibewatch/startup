  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or event
      - Why it matters
      - Likely action
    rows:
      - - Revenue reconciles toward the low end
        - Diligence shows the sustainable revenue base is much closer to $300M than to the higher 2024 estimate.
        - The old mark moves from debatable to clearly stretched.
        - Reset valuation expectations or walk away at the legacy price.
      - - Subscriber definition is weak
        - Management cannot separate paid subscribers from employer-covered or general users.
        - Consumer-comparable multiples become much harder to defend.
        - Downgrade toward base or bear cases and require more discount.
      - - Enterprise proof is shallow
        - Calm Health lacks durable renewal or ROI evidence despite good engagement anecdotes.
        - Enterprise optionality stops supporting the premium narrative.
        - Treat Calm as a consumer app with weaker upside than bulls assume.
      - - Financing terms are investor-protective
        - Preferences, secondaries, or liquidation stack materially weaken common-equity economics.
        - Headline valuation can overstate true entry quality.
        - Re-price from common-equity economics, not the press-release mark.
      - - Post-pandemic slowdown persists
        - Growth, hiring, or cost discipline signals imply the 2022 reset was structural, not transitory.
        - A stale 2020 mark becomes even less defensible in 2026.
        - Use bear-case math and require a materially lower effective price.
    notes: These triggers are meant to move the decision quickly from narrative comfort to underwriting reality.
    claimRefs:
      - CV010
      - CV012
      - CV013
      - CV014
