  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-terms
    missingEvidence: Current cap table, liquidation preferences, secondary sale mix, and any investor-protective terms from financing since the 2020 Series C.
    whyItMatters: Headline valuation can materially overstate common-equity entry quality when preferences or secondary economics are hidden.
    diligencePath: Request the current cap table, last financing documents, and any secondary-sale summary from management counsel.
    relatedQuestionRefs:
    - QV026
    relatedTableRefs:
    - TV006
  - type: conflicting-data
    severity: material
    topic: revenue-reconciliation
    missingEvidence: A management-grade revenue bridge that reconciles the higher 2024 Latka figure with the lower Sacra base and explains consumer versus Calm Health mix.
    whyItMatters: The supportable valuation range shifts by more than a billion dollars depending on which revenue base is actually durable.
    diligencePath: Ask for audited or board-level revenue history, segment mix, and retention by major channel or cohort.
    relatedQuestionRefs:
    - QV006
    - QV007
    - QV020
    - QV021
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, retention, net revenue retention, enterprise contract structure, and contribution margin for consumer versus enterprise lines.
    whyItMatters: Without economics and retention, it is impossible to know which public multiple family Calm actually deserves.
    diligencePath: Request a diligence pack with cohort retention, gross margin, Calm Health contract archetypes, and renewal data.
    relatedQuestionRefs:
    - QV024
    - QV027
    - QV028
    relatedTableRefs:
    - TV001
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-table-TV003
    missingEvidence: A fully exhaustive, non-paywalled list of every directly comparable public and private wellness or mental-health company with clean revenue and valuation disclosure.
    whyItMatters: TV003 intentionally samples the most decision-useful benchmark buckets because no perfect one-to-one public comp set exists for Calm and many private datasets remain gated.
    diligencePath: Expand the comp set with licensed private-market data or investor-provided benchmark packs during full IC diligence.
    relatedQuestionRefs:
    - QV012
    - QV017
    - QV019
    relatedTableRefs:
    - TV003
  - type: access-blocked
    severity: material
    topic: secondary-market-data
    missingEvidence: Recent secondary-market prints, 409A marks, or board-approved internal marks that could show whether the stale headline valuation has reset in practice.
    whyItMatters: The public record shows that private-market datasets track Calm, but the most decision-useful values are not visible without private access.
    diligencePath: Ask management or existing investors for recent tender, secondary, or 409A valuation materials.
    relatedQuestionRefs:
    - QV011
    - QV026
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: minor
    topic: subscriber-definition
    missingEvidence: A clean definition of paying subscribers versus total users, employer beneficiaries, and users or subscribers referenced in workplace research.
    whyItMatters: Subscriber definitions affect consumer retention assumptions, revenue quality, and whether premium consumer-content comparables are appropriate.
    diligencePath: Request billing-member definitions, paid subscriber counts, and employer-covered but unpaid user counts.
    relatedQuestionRefs:
    - QV008
    relatedTableRefs:
    - TV006
