- id: scenario-math-and-entry-discipline
  title: Scenario Math and Entry Discipline
  body: 'Scenario math is where Calm''s uncertainty becomes investable or not. Using the higher Latka revenue figure, the old $2 billion mark implies roughly 3.35x revenue, which is not outrageous versus premium content or subscription comps. Using the lower Sacra base, the same headline becomes roughly 6.67x revenue, which starts to look rich for a private company without filing-grade disclosure. Public-comp math sharpens the point: Duolingo and Talkspace imply that a $2 billion valuation could be supportable at roughly $0.41 billion to $0.48 billion of revenue if Calm really deserves those more premium revenue multiples, whereas Hims implies a need for about $0.78 billion of revenue and Teladoc implies more than $6 billion. None of those lenses is perfect, but together they frame the discipline clearly. The right question is not whether Calm is a good company in the abstract. It is whether a buyer today has enough proof on revenue quality, growth durability, contract mix, and financing
    terms to pay as if the 2020 mark still clears. On current public evidence, the answer is still no. Entry discipline therefore means treating $2 billion as a ceiling that has to be re-earned, not a floor that should be accepted on trust.'
