- id: TV003
  title: Comparable valuation table
  columns:
  - Comparable
  - Evidence
  - What it says about Calm
  - Limitation
  - Status
  rows:
  - - Duolingo
    - ~$5.08B market cap; ~$1.03B 2025 revenue; ~4.93x revenue; filing-grade disclosure.
    - Shows what a premium consumer-content subscription business with strong disclosure can still command.
    - Language learning is not mental health and monetization quality differs.
    - Public
  - - Hims & Hers
    - ~$6.06B market cap; ~$2.35B 2025 revenue; ~2.58x revenue.
    - A scaled subscription-health business with broad demand can support a multibillion-dollar value at a much lower multiple than hype narratives imply.
    - Broader health portfolio and public-market liquidity differ from Calm.
    - Public
  - - Talkspace
    - ~$0.87B market cap; ~$0.21B trailing revenue; ~4.14x revenue.
    - Shows that a mental-health-specific public comp can still earn a premium multiple when the revenue base is smaller.
    - Talkspace is more clinical and lower-scale than Calm's mixed consumer and enterprise profile.
    - Public
  - - Teladoc
    - ~$0.83B market cap; ~$2.53B 2025 revenue; ~0.33x revenue.
    - Shows how brutally public markets can compress health-tech assets when growth and narrative reset.
    - Legacy baggage and maturity make Teladoc a downside rather than a direct operating analog.
    - Public
  - - Headspace
    - 4,000+ organizations on the public site; >7M people through the Cigna launch; employer pages claim coaching, therapy, psychiatry, and EAP breadth.
    - Private employer mental-health peers that publish fresher distribution proof raise the bar for Calm's enterprise optionality.
    - No clean public valuation on the reviewed non-paywalled pages.
    - Private
  - - Unmind
    - 2025 $35M Series C plus $26M growth capital; >$100M total capital raised; nearly 3M employees supported.
    - Private workplace peers disclose recent financing and employee scale, illustrating the kind of proof that could move Calm's story from plausible to priced.
    - Workplace-only positioning is narrower than Calm's consumer plus enterprise blend.
    - Private
  notes: This table mixes public comps and private employer-mental-health peers because Calm sits between consumer wellness content, subscription health, and enterprise mental-health distribution.
