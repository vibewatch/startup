- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current revenue bridge and mix
    - Audited or board-level revenue history plus consumer versus Calm Health mix.
    - Determines whether the legacy mark implies ~3x, ~7x, or something else entirely.
    - Finance diligence with monthly bridge and segment breakout.
  - - Retention and margin quality
    - Paid-subscriber retention, gross margin, contract renewals, and contribution economics.
    - Separates premium subscription value from low-quality top-line scale.
    - CFO packet plus cohort and renewal analyses.
  - - Cap table and preference stack
    - Liquidation preferences, ratchets, secondaries, and dilution by round.
    - Headline valuation may not equal common-equity value.
    - Legal review of charter, term sheets, and cap table.
  - - Recent price discovery
    - 409A marks, tenders, or recent secondary transactions.
    - Shows whether the stale 2020 headline still clears in practice.
    - Board materials or investor-side secondary data.
  - - Enterprise proof
    - Named customers, contract archetypes, ROI, and buyer references for Calm Health.
    - Tests whether enterprise optionality deserves a premium multiple.
    - Commercial diligence and reference calls.
  - - Subscriber definition
    - Clean paid-member count versus employer-covered users and free users.
    - Changes which comparable set is appropriate and how sticky the revenue really is.
    - Billing and analytics review with product and finance leaders.
  notes: These asks are the minimum package required to move the recommendation away from research-more and toward a price-aware investment decision.
