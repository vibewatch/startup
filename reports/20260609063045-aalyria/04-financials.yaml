- id: public-financial-gaps-and-disclosure-quality
  title: Public Financial Gaps and Disclosure Quality
  body: "Aalyria's disclosure quality is typical for a venture-backed private company but insufficient for underwriting. Public
    sources do not provide revenue, ARR, gross margin by product line, cash balance, debt obligations, backlog value, customer
    concentration, software-versus-hardware mix, or realized contract pricing. Even where there is strong commercial proof,
    the amounts are mostly absent: Telesat disclosed a 10+ year term but not contract value; DIU, NASA, AFRL, Rivada, and
    other programs prove demand but not annualized revenue; and the Series B announcement gives valuation and proceeds but
    no financial model that explains why a $1.3 billion post-money price is supported. That gap matters because Aalyria's
    model blends recurring software with capital- heavier hardware and government integration work. Without product-line margin,
    payment-timing, and concentration data, investors cannot tell whether the business is compounding like enterprise software
    or cycling like a project-and-hardware contractor. The public record is therefore strong on narrative momentum and weak
    on the metrics that determine revenue quality."
  claimRefs:
  - CI021
