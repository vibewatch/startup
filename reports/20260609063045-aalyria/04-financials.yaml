- id: financial-verdict
  title: Financial Verdict
  body: 'Aalyria looks financeable, but not yet fully underwritable. The positive case is real: official and independent sources
    agree on a fresh $100 million raise, a $1.3 billion valuation, blue-chip investors, and multiple commercial and government
    deployment proofs. The company is not a science project with no monetization path. The harder question is quality of that
    monetization. Aalyria has chosen a strategically attractive but financially mixed position between infrastructure software,
    specialized hardware, and long-cycle defense integration. That combination can produce durable advantage if Spacetime
    becomes embedded as the neutral control plane for multi-network operations, but it can also produce lower blended margins,
    slower collections, and more financing dependency than the unicorn headline suggests. The public record does not justify
    treating the valuation as revenue-multiple driven. Until management discloses product-line revenue, margin, backlog, concentration,
    and liquidity, the right verdict is cautiously positive on strategic relevance and cautious on financial quality.'
