company:
  name: Aalyria
chapter:
  number: 4
  title: Financials
  summary: Aalyria's public financial record proves capital access and real commercialization, but not 
    underwriting-grade economics. The company closed a $100 million Series B at a $1.3 billion post-money valuation in 
    February 2026 and sells a blended model of recurring Spacetime software plus Tightbeam optical hardware, yet it 
    discloses no revenue, ARR, gross margin, cash balance, debt, or customer concentration. The supportable verdict is 
    that Aalyria has credible product-market pull and near-term funding, while revenue quality, blended margin, and 
    long-run capital intensity still require primary diligence.
sections:
- id: revenue-model-and-pricing
  title: Revenue Model and Pricing
  body: "Aalyria's financial model is best understood as a dual-stream architecture rather than a clean software story. On
    one side, Spacetime looks like enterprise infrastructure software: Aalyria markets it as an Aalyria-hosted or customer-hosted
    managed service that can run in commercial cloud, hybrid, on-premises, or air-gapped environments. That supports recurring
    revenue through licensing, subscriptions, or managed-service contracts, plus professional services for deployment and
    integration. On the other side, Tightbeam is unmistakably hardware. Aalyria sells optical communications terminals in
    fixed and gimballed configurations, which implies one-time product revenue, installation work, and support obligations
    with lower gross-margin purity than software. Public logos such as Telesat, DIU, NASA, AFRL, Rivada, and Keysight support
    that there is real buyer interest across commercial and government channels, but none of those sources disclose a rate
    card, realized software pricing, terminal ASP, or bundle mix. The result is a real monetization surface with very limited
    public price transparency."
