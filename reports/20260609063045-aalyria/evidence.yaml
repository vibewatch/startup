evidenceGaps:
  - type: missing-source
    severity: material
    topic: funding
    missingEvidence: >-
      Breakdown of pre-Series B equity rounds, individual investment amounts, ownership stakes, and cap table structure
      for all investors including Alphabet/Google retained share.
    whyItMatters: >-
      Cap table opacity limits understanding of Google's economic alignment, potential IP license constraints, ROFR
      provisions, and dilution dynamics. Alphabet's retained stake may carry governance provisions that affect Aalyria's
      independence.
    diligencePath: >-
      Request cap table disclosure in due diligence; review Alphabet/Google IP license agreement and any shareholder
      side letters.
    relatedQuestionRefs:
      - QO002
      - QO010
  - type: missing-source
    severity: material
    topic: scale
    missingEvidence: >-
      Aalyria has not disclosed revenue, ARR, gross margin, customer count, or any financial performance metrics. No
      private company reporting obligations exist.
    whyItMatters: >-
      Without revenue data, the $1.3B valuation cannot be contextualized against standard SaaS or deep-tech multiples.
      Customer count matters for assessing concentration risk around Telesat as the anchor commercial client.
    diligencePath: >-
      Request management accounts and ARR data directly; assess customer contract terms and Telesat revenue
      concentration in Series B due diligence.
    relatedQuestionRefs:
      - QO011
      - QO019
      - QO027
  - type: enumeration-incomplete
    severity: minor
    topic: leadership
    missingEvidence: >-
      Aalyria's full executive bench below CEO/CTO is not publicly documented. Board composition beyond Michael Brown
      (incoming) and Vint Cerf (advisor) is unknown.
    whyItMatters: >-
      Key-person risk is concentrated in Taylor and Barritt; if either departs, the company loses primary ties to the
      Google IP pedigree and defense customer relationships.
    diligencePath: >-
      Request organization chart; assess VP-level engineering, sales, and operations hires; evaluate succession
      planning.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: government-contracts
    missingEvidence: >-
      AFRL SDNX contract value, deliverables, and timeline are not publicly disclosed. The nature of 'evaluation' vs.
      operational contract award is ambiguous in public coverage.
    whyItMatters: >-
      Defense contract pipeline is a key growth driver; the distinction between evaluation-stage and funded operational
      contracts materially affects revenue visibility.
    diligencePath: >-
      Review contract award document under FOIA if applicable; confirm program status with Aalyria management;
      cross-reference SAM.gov for any public procurement entries.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: investors
    missingEvidence: >-
      Exact pre-Series B equity round details, including round names, dates, and individual amounts from early investors
      (J2 Ventures initial stake, Arthur Patterson/Accel, Housatonic Partners) are not publicly available.
    whyItMatters: >-
      Incomplete funding history limits understanding of dilution trajectory and early investor relationships that may
      carry information rights or board observation rights.
    diligencePath: Request historical cap table and prior round term sheets.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: funding
    missingEvidence: >-
      Total capital raised ($130M per Off Earth Data vs. $135M per SpaceNews/CEO Taylor statement) is unresolved in
      public sources. A $5M discrepancy may reflect non-dilutive contract funding or rounding.
    whyItMatters: Minor discrepancy; does not materially affect valuation analysis but should be verified against cap table.
    diligencePath: Confirm exact total raised in due diligence; ask management to reconcile figure.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: products
    missingEvidence: >-
      Technical white paper or peer-reviewed documentation for Tightbeam's free-space optical mechanism (coherent light
      approach, atmospheric turbulence compensation, aperture design trade-offs across six terminal generations) is not
      publicly available.
    whyItMatters: >-
      Without technical documentation, Tightbeam's claimed 100 Gbps performance and atmospheric compensation mechanisms
      cannot be independently verified. The LLNL lineage is cited qualitatively but no specific patents or technical
      specifications are publicly accessible.
    diligencePath: >-
      Request the Spacetime white paper (advertised on aalyria.com) and any Tightbeam technical datasheets; search LLNL
      publications database for FSO terminal research; review relevant patent filings.
    relatedQuestionRefs:
      - QO016
  - type: missing-source
    severity: minor
    topic: secondary-buyers
    missingEvidence: >-
      Public case studies showing whether aviation, maritime, and enterprise operators buy Aalyria directly or only
      through service-provider channels.
    whyItMatters: >-
      This affects budget ownership, sales-cycle length, and whether the secondary segment should sit in SAM or in a
      longer-dated adjacency bucket.
    diligencePath: >-
      Request a pipeline split by direct versus partner-led opportunity and ask for two named secondary-segment
      references.
    relatedQuestionRefs:
      - QM014
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: tightbeam-pricing
    missingEvidence: Tightbeam ASPs, bill of materials, attach rates, and backlog by program or customer segment.
    whyItMatters: >-
      Without product pricing and attach-rate evidence, the optical-terminal portion of TAM and SAM remains the least
      defensible part of the model.
    diligencePath: Request the Tightbeam pricing deck, manufacturing assumptions, and current qualified pipeline by form factor.
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: material
    topic: contract-values
    missingEvidence: >-
      Redacted contract values, term lengths, renewal structures, and deployment milestones for Telesat, Rivada, ESA,
      DIU, and other named wins.
    whyItMatters: >-
      Named logos prove market reality, but valuation work needs commercial depth to convert proof points into revenue
      expectations.
    diligencePath: Obtain redacted statements of work, MSAs, or customer references that disclose scope, duration, and payment model.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: material
    topic: defense-budget-line-items
    missingEvidence: >-
      A public budget exhibit or justification book that isolates orchestration software inside MILNET, PWSA, or related
      proliferated-network programs.
    whyItMatters: >-
      Without a clean public line item, defense TAM estimates must remain proxy models rather than appropriations-based
      bottoms-up sizing.
    diligencePath: >-
      Review justification books, ask program offices for software scope within communications line items, and reconcile
      those answers with FY2026 request materials.
    relatedQuestionRefs:
      - QM025
  - type: conflicting-data
    severity: material
    topic: market-overlap
    missingEvidence: >-
      A non-overlapping taxonomy that reconciles space economy, HTS services, ground segment, terminal, and NTN market
      reports into one deduplicated model.
    whyItMatters: >-
      Overlapping categories create the largest risk of double counting in Aalyria market sizing and therefore the
      widest valuation error band.
    diligencePath: >-
      Commission or license a custom market model that explicitly deduplicates services, terminals, software, and
      infrastructure layers before final TAM or SAM conclusions.
    relatedQuestionRefs:
      - QM020
    relatedTableRefs:
      - TM002
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-universe
    missingEvidence: >-
      A broader census of terrestrial SDN vendors, sovereign integrators, and terminal OEMs that could expand into space
      orchestration.
    whyItMatters: >-
      TP001 intentionally focuses on the most relevant space-native and defense-linked alternatives, so the long tail of
      potential entrants remains unscored.
    diligencePath: Expand the competitor census if diligence shifts toward telecom channels, sovereign operators, or M&A scenarios.
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Contract values, software license terms, Tightbeam ASPs, renewal terms, and discount schedules across Aalyria and
      comparable alternatives.
    whyItMatters: >-
      Without comparable economics, TP003 can only compare packaging patterns and not true pricing power or margin
      durability.
    diligencePath: >-
      Request redacted MSAs or SOWs from Aalyria, operator partners, and prime-led programs plus realized pricing by
      deployment stage.
    relatedQuestionRefs:
      - QP012
      - QP025
    relatedTableRefs:
      - TP003
  - type: access-blocked
    severity: material
    topic: defense-program-detail
    missingEvidence: >-
      Readable copies of the AFRL SDNx page, Breaking Defense demo coverage, and the SpaceNews AST and Northrop
      articles.
    whyItMatters: >-
      The competitive narrative is directionally clear, but finer details like evaluation metrics, award scope, and
      competing vendor identities remain partly hidden behind broken or blocked pages.
    diligencePath: >-
      Refetch via updated official URLs, archive snapshots, or direct agency press materials before final investment
      committee use.
    relatedQuestionRefs:
      - QP009
      - QP021
