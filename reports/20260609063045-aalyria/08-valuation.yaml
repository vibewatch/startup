- id: TV006
  title: Diligence Trigger Table
  columns:
  - Diligence Ask
  - Missing Proof
  - Why It Matters
  - Likely Stance Change if Positive
  rows:
  - - Recurring software revenue disclosure
    - No public recurring revenue or contract-quality disclosure
    - Most direct way to test whether the round deserves software-like treatment
    - Stretched → Fair
  - - Software / hardware / services mix
    - No public mix disclosure
    - Separates premium-control-plane value from lower-multiple project or hardware value
    - Confidence rises materially
  - - Lightspeed production milestone proof
    - No public evidence yet of live commercial traffic using Spacetime
    - Best external proof of repeatable commercial monetization
    - Fairness of current price improves
  - - Tightbeam manufacturing readiness and MTBF
    - No public scale economics or reliability proof
    - Tests whether hardware is an upside option or a valuation drag
    - Downside risk narrows if proven
  - - MILNET architecture clarity
    - Public reporting still shows architecture uncertainty
    - Key binary on government TAM and strategic relevance
    - Risk rating can fall if multi-vendor remains favored
  - - Google / Alphabet stake and IP boundary detail
    - Retained stake is disclosed, detailed economic and IP implications are not
    - Reduces governance and encumbrance uncertainty around core assets
    - Confidence rises, especially for later rounds
  notes: These are the smallest set of diligence items that could move the stance meaningfully rather than cosmetically.
