- id: recommendation-and-diligence-path
  title: Recommendation and Diligence Path
  body: 'The right call on public evidence is Track / Research More with medium confidence and a stretched valuation stance. Aalyria has enough proof to avoid an outright "expensive / avoid" label: official and partner sources support the existence of differentiated technology, serious investors, and real strategic interest from governments and operators. But the company does not yet disclose the financial evidence that would let an outside investor test whether the $1.3 billion price is fair. The most important diligence asks are therefore economic, not narrative: recurring software revenue disclosure, software versus hardware/services mix, contract structure on key programs, Lightspeed production milestones, Tightbeam manufacturing readiness, and clearer boundaries around Google/Alphabet stake and IP terms. If those questions break positively, the stance can move toward fair. If they break negatively—or remain unanswered while program risk rises—the current valuation starts to look plainly
    expensive.'
