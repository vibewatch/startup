- id: TV005
  title: Upside / Downside Driver Table
  columns:
  - Driver
  - Current Evidence
  - Direction
  - Valuation Effect
  rows:
  - - Software control-plane narrative
    - Telesat, DIU, and market-data sources support orchestration relevance
    - Upside
    - Supports premium versus hardware-only peers
  - - Revenue opacity
    - No public revenue, ARR, margin, or customer-count disclosure
    - Downside
    - Prevents a fair-value anchor and keeps stance stretched
  - - MILNET architecture risk
    - Adverse reporting shows architecture and funding remain uncertain
    - Downside
    - Can remove a major portion of government upside
  - - Lightspeed commercialization
    - Selection is real, but live production economics are not yet visible
    - Both
    - A successful go-live would materially improve confidence
  - - Hardware scale risk
    - Tightbeam value is real in theory but public production-readiness evidence is limited
    - Downside
    - Can drag the company toward hardware-style valuation treatment
  - - Sector demand tailwind
    - NTN and satellite-network demand remain strategically important in 2026
    - Upside
    - Keeps the strategic option value intact even while company economics remain opaque
  notes: The same company can have strong strategic drivers and still deserve valuation caution when proof and monetization are uneven.
