  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: Recurring revenue and unit economics
    missingEvidence: No public recurring revenue, ARR, gross margin, retention, or customer-count disclosure for Aalyria.
    whyItMatters: Without any public economic anchor, investors cannot test whether $1.3 billion is fair versus merely strategic.
    diligencePath: Request management disclosure of recurring software revenue, customer concentration, gross margin by major stream, and contract duration.
    relatedQuestionRefs:
    - QV003
    - QV018
    - QV031
  - type: private-evidence-only
    severity: material
    topic: Software versus hardware versus services mix
    missingEvidence: Public sources do not separate how much value should accrue to Spacetime software, Tightbeam hardware, or integration/services work.
    whyItMatters: That split determines whether Aalyria deserves a software premium or a lower-quality infrastructure multiple framework.
    diligencePath: Request booked and pipeline mix by software, hardware, and services plus contribution margin by stream.
    relatedQuestionRefs:
    - QV013
    - QV031
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: MILNET architecture outcome
    missingEvidence: Public reporting shows MILNET importance, but not the final architecture decision or budget certainty relevant to Aalyria.
    whyItMatters: Government upside can compress sharply if interoperability gives way to a narrower architecture.
    diligencePath: Monitor Space Force budget materials, testimony, and procurement signals; ask management for program-specific exposure by architecture outcome.
    relatedQuestionRefs:
    - QV016
    - QV028
  - type: private-evidence-only
    severity: material
    topic: Tightbeam manufacturing readiness
    missingEvidence: No public evidence yet shows Tightbeam production economics, reliability at scale, or capital required to ramp manufacturing.
    whyItMatters: If hardware scaling is heavy and low-margin, it can drag valuation even when the orchestration story remains intact.
    diligencePath: Request manufacturing plan, supplier map, qualification data, MTBF, and capex required for first meaningful production volumes.
    relatedQuestionRefs:
    - QV014
    - QV022
    - QV028
  - type: private-evidence-only
    severity: material
    topic: Google / Alphabet retained stake and IP boundaries
    missingEvidence: Public sources disclose that Google retains a stake, but not the detailed economic, governance, or IP implications of that retained position.
    whyItMatters: Residual encumbrance or governance complexity can matter more at a $1.3 billion valuation than at an earlier seed-stage price.
    diligencePath: Review spinout agreements, license boundaries, board rights, and any continuing commercial obligations to Alphabet entities.
    relatedQuestionRefs:
    - QV006
    - QV022
  - type: enumeration-incomplete
    severity: material
    topic: Comparable Valuation Table
    missingEvidence: Publicly disclosed private-market comparables for close space-network orchestration peers remain sparse.
    whyItMatters: A tighter private comp set could narrow the current corridor between operator-scale public comps and distressed hardware comps.
    diligencePath: Use PitchBook, investor decks, and private round data for orchestration, satcom software, and defense-networking peers during diligence.
    relatedQuestionRefs:
    - QV026
    relatedTableRefs:
    - TV003
