company:
  name: Aalyria
chapter:
  number: 8
  title: Valuation
  summary: 'Aalyria’s February 2026 $100 million Series B at a reported $1.3 billion valuation is best described as stretched on public evidence: the company has real strategic proof points in space-network orchestration, but public sources still do not disclose revenue, margins, retention, or customer count. The price is plausible only if investors are underwriting software-like control-plane upside from Spacetime plus option value from Tightbeam and government adoption; it looks expensive for evidence-first investors who require disclosed economics before paying a valuation that already equals a meaningful slice of several mature public satcom operators. The stance would improve with contract-quality revenue disclosure, Lightspeed production proof, and clearer evidence that Aalyria captures recurring orchestration economics rather than mostly project or hardware value.'
sections:
- id: valuation-anchor-and-proof-quality
  title: Valuation Anchor and Quality of Proof
  body: 'The anchor facts are unusually clear relative to Aalyria’s operating disclosure. BusinessWire, CNBC, SpaceNews, and other 2026 round coverage all point to a $100 million Series B at a reported $1.3 billion valuation led by Battery Ventures and J2 Ventures, with Google retaining a stake. Public evidence also shows why investors are interested: Aalyria is positioned as communications backbone infrastructure for proliferating satellite networks, it has Google spinout lineage, and it has visible strategic proof points such as Telesat Lightspeed selection, DIU support, and an ESA contract. What public evidence does not show is equally important. The same funding coverage does not disclose revenue, ARR, gross margin, NRR, or customer count, and it does not separate how much future value should accrue to recurring orchestration software versus hardware, integration, or government project work. That gap makes the round much stronger as a signal of investor appetite than as proof of fundamental
    valuation support. In other words, Aalyria has credible product and ecosystem evidence, but weak public monetization evidence.'
  claimRefs:
  - CV001
  - CV002
  - CV004
  - CV006
  - CV007
  - CV009
  tableRefs:
  - TV002
  figureRefs: []
- id: public-comps-and-price-discipline
  title: Public Comps and Price Discipline
  body: 'The cleanest public-market read-through is not a single revenue multiple but a corridor. Aalyria’s $1.3 billion private valuation is about 26% of Iridium’s June 2026 market cap, roughly 15% of Viasat’s, and about 30% of Eutelsat’s, even though those operators already disclose large revenue bases and run real networks at scale. At the other extreme, Mynaric’s tiny June 2026 market cap is a reminder that optical-communications hardware can lose most of its equity value when execution and financing break. AST SpaceMobile shows the opposite outcome: the public market can pay a very large premium for a strategic space-network narrative before economics look mature. Aalyria sits between those poles. The current price is too high to justify on a hardware-only or project-services lens, but it is not as aggressive as the market’s most speculative network-platform bets. The right interpretation is that investors paid for a software-control-plane option on top of real partner and government
    proof, while accepting that the economics are still opaque.'
