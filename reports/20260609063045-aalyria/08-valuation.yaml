- id: TV003
  title: Comparable Valuation Table
  columns:
  - Comparable
  - Business Model
  - Public Anchor
  - Read-Through for Aalyria
  - Limitation
  rows:
  - - Iridium
    - Profitable satellite operator with government exposure
    - June 2026 market cap $5.01B; 2025 revenue $871.7M
    - Shows how much scale public markets assign to a proven government-heavy network business
    - Iridium already has operating scale and disclosed economics
  - - Viasat
    - Defense and broadband satcom network operator
    - June 2026 market cap $8.94B
    - Shows public markets can support multi-billion values for scaled defense-communications assets
    - Viasat is mature and asset-heavy, not an earlier-stage orchestration layer
  - - Eutelsat
    - Multi-orbit operator with OneWeb exposure
    - June 2026 market cap $4.27B
    - Useful operator-scale corridor for a capital-intensive space-networking business
    - Eutelsat reflects operator economics, debt, and integration issues, not a pure software story
  - - SES
    - Large incumbent satcom operator
    - Investor page cites €3.5B of 2025 annual revenue
    - Shows how much revenue incumbents already carry at public-market valuations
    - SES is far more mature and diversified than Aalyria
  - - AST SpaceMobile
    - Narrative-rich next-generation network platform
    - June 2026 market cap $35.73B
    - Shows how far the market can stretch a strategic platform thesis before economics look mature
    - Direct-to-cell demand and consumer narrative are not the same as Aalyria’s B2B orchestration thesis
  - - Mynaric
    - Optical communications hardware supplier
    - June 2026 market cap $3.87M
    - Adverse comp showing how hard hardware execution and financing can hit value
    - Mynaric lacks Aalyria’s software and partner narrative
  enumerationScope:
    coverage: partial
