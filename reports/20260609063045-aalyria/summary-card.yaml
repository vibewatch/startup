  topStrengths:
    - >-
      Spacetime has unusually strong technical lineage and public proof for a private company, including Project Loon
      heritage, autonomous-orchestration claims, and anchor deployments with named operators and agencies.
    - >-
      Aalyria has credible government and commercial validation through DIU, AFRL, ESA, NASA, and Telesat Lightspeed,
      which is stronger partner proof than most pre-revenue space infrastructure narratives.
    - >-
      The Series B syndicate and Google's retained stake support the view that sophisticated insiders see strategic
      value in the control-plane thesis.
  topRisks:
    - >-
      Public evidence still does not disclose revenue, ARR, gross margin, customer count, or contract economics, so
      valuation support is narrative-heavy rather than fundamentals-backed.
    - >-
      Commercial proof is concentrated in a small set of flagship programs, especially Telesat Lightspeed and government
      architecture decisions such as MILNET.
    - >-
      Tightbeam adds hardware execution and manufacturing risk that could pull the business away from software-quality
      economics.
  unresolvedGaps:
    - >-
      Revenue quality, recurring software mix, gross margin, and contract structure needed to test whether the
      control-plane thesis monetizes like software.
    - >-
      Deployment and production milestones for Telesat Lightspeed, plus evidence of additional live operator workloads
      beyond flagship partners.
    - >-
      Exact Google/Alphabet ownership, IP boundary terms from the spinout, and any constraints on commercialization
      economics.
