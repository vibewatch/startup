slug: aalyria
runDate: '2026-06-09'
company:
  name: Aalyria
chapter:
  number: 2
  title: Market Analysis
  summary: Aalyria sits in the orchestration and directed-link layer of space connectivity rather than the raw bandwidth
    market. Public 2025-2026 evidence shows large adjacent spending pools—HTS services at about $31 billion in 2025 
    growing to $76 billion by 2034, a $106 billion ground-segment market, and a 5G NTN market expected at $11.91 billion
    in 2026—but Aalyria's reachable five-year SAM is much narrower, roughly $0.8 billion to $3.0 billion, because buyers
    are concentrated in multi-orbit operators, defense programs, agencies, and selective terminal programs. The main 
    upside drivers are multi-orbit complexity and post-capacity commoditization; the main constraints are procurement 
    opacity, vertical integration, and missing contract and pricing disclosures.
sections:
- id: market-boundary-and-taxonomy
  title: Market Boundary and Taxonomy
  body: "Aalyria's market boundary is the control-plane and directed-link layer of space networking, not the whole satellite
    economy. The company sells Spacetime, an orchestration platform for directional networks in motion, and Tightbeam, 100
    Gbps free-space optical terminals. That means the included spend is network orchestration and control software, optical
    terminal hardware tied to managed directional links, military directed-network architectures, and commercial multi-orbit
    GEO+LEO or NGSO management. The right exclusions are raw bandwidth resale, vertically integrated consumer broadband services,
    satellite manufacturing, launch, and terrestrial-only wireless. ESA's satellite-for-5G and broader secure-connectivity
    work, plus MarketsandMarkets' NTN and automation categories, are better treated as adjacency because they shape interfaces,
    standards, and budgets without turning Aalyria into a full telecom-infrastructure vendor. The status-quo substitutes are
    proprietary operator control stacks, point solutions from primes, and manual mission-integration workflows. Aalyria's
    wedge is interoperability: company materials, DIU problem statements, and customer proof all center on making independently
    operated nodes coordinate across air, land, sea, and space."
