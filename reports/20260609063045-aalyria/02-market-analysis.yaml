- id: growth-drivers-and-adoption-constraints
  title: Growth Drivers and Adoption Constraints
  body: The market tailwinds are clear. HTS demand is still expanding, multi-orbit architectures are becoming 
    mainstream, ground infrastructure is shifting toward software and service models, and defense programs keep funding 
    proliferated and optical networking. Just as important, pricing pressure is changing where value lives. Novaspace 
    argues that bandwidth itself is no longer the core differentiator, and Via Satellite's industry panel says services 
    are likely to become much larger than capacity while a roughly $0.25 per GB threshold now frames competition with 
    fiber. Those trends are favorable to Aalyria because they reward orchestration, terminals, and user experience over 
    raw spectrum ownership. The constraints are equally real. Spectrum strategy, sovereign requirements, and security 
    architecture slow deployments. Procurement often hides orchestration spend inside broader defense or operator 
    programs. Large vertically integrated networks can build their own stacks. Adjacent D2D players such as AST 
    SpaceMobile also compete for pieces of the same NTN and government experimentation budget. CNBC's reporting that 
    customers want alternatives to Starlink supports demand, but it also underscores how urgent and competitive the 
    market has become.
