- id: TM003
  title: Segment / Buyer Map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Budget owner
  - Adoption trigger
  rows:
  - - Commercial LEO / MEO operators
    - CTO, network architect, or ground-segment lead
    - Network operations and service-assurance teams
    - Operator capex / opex budget
    - Design-in before launch or before multi-orbit service expansion
    - Constellation or platform program office
    - Need to manage thousands of moving directional links
  - - U.S. DoD / military programs
    - Program office, mission-communications owner, or innovation sponsor
    - Mission operations, spectrum managers, and network operators
    - Appropriated defense budget or OT pathway
    - Prototype -> architecture validation -> program insertion
    - Service or agency communications budget embedded in larger programs
    - Resilience, anti-jam posture, and interoperability mandates
  - - Government / civil space agencies
    - Mission owner, lab, or secure-connectivity program lead
    - Research, operations, and standards teams
    - Agency program budget
    - Demonstration -> standards alignment -> scaled mission support
    - Agency connectivity and mission-support budget
    - Need to bridge heterogeneous networks and prove secure operations
  - - Defense primes / system integrators
    - Program manager or solution architect
    - Integration engineering teams
    - Prime-led customer contract
    - Subcontract or component insertion -> certification -> rollout
    - Prime-led mission budget with government end payer
    - Faster path than building orchestration from scratch
  - - Enterprise / aviation / maritime operators
    - Service-platform owner or mobility-network operator
    - Connectivity operations teams
    - Service-provider or platform budget
    - Channel-led trial -> bundled offer -> wider deployment
    - Mobility or managed-service budget
    - Need higher-throughput directional links or multi-orbit policy control
  notes: Buyer, user, and payer diverge most in government and prime-led programs. The enterprise, aviation, and 
    maritime segment is intentionally treated as a secondary path because public direct-purchase evidence remains 
    thinner than for Telesat, Rivada, DIU, and ESA.
  claimRefs:
  - CM020
  - CM021
  - CM025
  - CM026
  - CM027
  - CM028
  - CM029
- id: TM004
  title: Growth Drivers and Constraints Table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - HTS traffic and multi-orbit complexity
    - Positive
    - 2026-2034
    - Higher throughput and multi-orbit operation make manual coordination less viable and favor orchestration layers
    - Ask which networks require third-party orchestration versus operator-native tools
  - - Post-capacity pricing reset
    - Positive for software, negative for pure capacity sellers
    - Current
    - Value moves from bandwidth toward orchestration, terminals, service quality, and user experience
    - Request proof that Aalyria captures value above the raw-capacity layer
  - - Ground-segment shift to GSaaS and OPEX
    - Positive
    - 2026-2034
    - Service-driven operations favor software that abstracts heterogeneous assets and reduces operator overhead
    - Ask how much GSaaS budget can map to control-plane software
  - - MILNET / PWSA / optical-network funding
    - Positive
    - 2025-2030
    - Government programs validate that resilient directed-network architectures remain funded priorities
    - Request exact program references, follow-on awards, and insertion milestones
  - - ESA and 5G NTN standards programs
    - Positive
    - Current to medium term
    - Standards and secure-connectivity work widen Aalyria's partner surface and product adjacency
    - Ask which standards positions convert into product revenue versus strategic relevance
  - - Spectrum, security, and sovereignty friction
    - Negative
    - Current and structural
    - These constraints slow adoption, force customization, and can favor domestic or proprietary solutions
    - Request customer-by-customer blockers by band, security domain, and sovereign requirement
  - - Vertical integration by large operators
    - Negative
    - Structural
    - Some of the largest networks will build their own control planes or buy much narrower components
    - Ask which major operators are truly outside the realistic SAM
  - - Procurement opacity and hidden software line items
    - Negative
    - Current and structural
    - Even when demand is real, public budgets rarely isolate orchestration value clearly
    - Request contract values, software scope, and renewal terms for named wins
  - - Secondary-buyer ambiguity in aviation / maritime / enterprise
    - Negative
    - Current
    - The opportunity may be channel-led rather than direct, which changes sales cycles and gross margin assumptions
    - Ask for direct pipeline split versus reseller or partner-led pipeline
  notes: This is a qualitative timing and valuation lens, not a scorecard. Direction describes the net effect on 
    Aalyria's accessible market, and the diligence asks focus on the missing evidence that would change TAM-to-SOM 
    confidence most.
