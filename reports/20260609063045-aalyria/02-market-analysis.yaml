  evidenceGaps:
  - type: missing-source
    severity: minor
    topic: secondary-buyers
    missingEvidence: Public case studies showing whether aviation, maritime, and enterprise operators buy Aalyria 
      directly or only through service-provider channels.
    whyItMatters: This affects budget ownership, sales-cycle length, and whether the secondary segment should sit in SAM
      or in a longer-dated adjacency bucket.
    diligencePath: Request a pipeline split by direct versus partner-led opportunity and ask for two named 
      secondary-segment references.
    relatedQuestionRefs:
    - QM014
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: material
    topic: tightbeam-pricing
    missingEvidence: Tightbeam ASPs, bill of materials, attach rates, and backlog by program or customer segment.
    whyItMatters: Without product pricing and attach-rate evidence, the optical-terminal portion of TAM and SAM remains 
      the least defensible part of the model.
    diligencePath: Request the Tightbeam pricing deck, manufacturing assumptions, and current qualified pipeline by form
      factor.
    relatedQuestionRefs:
    - QM023
  - type: private-evidence-only
    severity: material
    topic: contract-values
    missingEvidence: Redacted contract values, term lengths, renewal structures, and deployment milestones for Telesat, 
      Rivada, ESA, DIU, and other named wins.
    whyItMatters: Named logos prove market reality, but valuation work needs commercial depth to convert proof points 
      into revenue expectations.
    diligencePath: Obtain redacted statements of work, MSAs, or customer references that disclose scope, duration, and 
      payment model.
    relatedQuestionRefs:
    - QM024
  - type: missing-source
    severity: material
    topic: defense-budget-line-items
    missingEvidence: A public budget exhibit or justification book that isolates orchestration software inside MILNET, 
      PWSA, or related proliferated-network programs.
    whyItMatters: Without a clean public line item, defense TAM estimates must remain proxy models rather than 
      appropriations-based bottoms-up sizing.
    diligencePath: Review justification books, ask program offices for software scope within communications line items, 
      and reconcile those answers with FY2026 request materials.
    relatedQuestionRefs:
    - QM025
  - type: conflicting-data
    severity: material
    topic: market-overlap
    missingEvidence: A non-overlapping taxonomy that reconciles space economy, HTS services, ground segment, terminal, 
      and NTN market reports into one deduplicated model.
    whyItMatters: Overlapping categories create the largest risk of double counting in Aalyria market sizing and 
      therefore the widest valuation error band.
    diligencePath: Commission or license a custom market model that explicitly deduplicates services, terminals, 
      software, and infrastructure layers before final TAM or SAM conclusions.
    relatedQuestionRefs:
    - QM020
    relatedTableRefs:
    - TM002
