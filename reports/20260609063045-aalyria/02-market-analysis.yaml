- id: FM002
  title: Market Estimate Range
  type: range
  layout: wide
  summary: Low, base, and high estimates show how Aalyria's market narrows from a broad thematic TAM to a realistic 
    one-vendor SOM.
  data:
    items:
    - label: Five-year TAM lens
      low: 5.0
      base: 8.5
      high: 12.0
      unit: $B
      note: Derived from the overlap of HTS growth, ground-segment software and service shifts, selective MilSatCom, and
        NTN adjacency.
    - label: Five-year reachable SAM
      low: 0.8
      base: 1.6
      high: 3.0
      unit: $B
      note: Counts only target operators, agencies, primes, and terminal programs where Aalyria could plausibly sell 
        external software or optical gear.
    - label: Five-year plausible SOM
      low: 0.08
      base: 0.18
      high: 0.35
      unit: $B
      note: Reflects one-vendor share limits, integration capacity, long procurement cycles, and customer concentration.
  approximationNotes: All three rows are modeled ranges rather than observed revenue. The estimates explicitly preserve 
    missing contract values, pricing, and attach rates instead of hiding them inside a single TAM headline.
