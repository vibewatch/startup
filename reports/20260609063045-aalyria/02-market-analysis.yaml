- id: buyer-segmentation-and-adoption-path
  title: Buyer Segmentation and Adoption Path
  body: Aalyria's buyer map is easiest to understand as five segments. Segment A is commercial LEO or MEO operators such
    as Telesat, Rivada, SES, Eutelsat, and adjacent incumbents that need orchestration before full-scale service launch.
    Segment B is the U.S. defense and military ecosystem—Space Force, SDA, AFRL, NRL, SOCOM, and related programs—where 
    the buyer, user, and payer are often different institutions. Segment C is civil and government agencies such as NASA
    and ESA, where early adoption happens through demonstrations, secure-connectivity programs, and standards work. 
    Segment D is defense primes and systems integrators that can either channel Aalyria into programs or absorb the 
    orchestration layer themselves. Segment E is enterprise, aviation, and maritime connectivity, which matters more as 
    a secondary direct market for Tightbeam and as a channel-led market for Spacetime. Public wins at Telesat, Rivada, 
    DIU, and ESA suggest Aalyria usually lands by proving interoperability first, getting architected into a wider 
    program second, and only then scaling into recurring deployment. Aalyria's roughly 90-person footprint and 
    Livermore-plus-Washington, D.C. operating model reinforce the need to prioritize high-value design-ins rather than 
    broad horizontal coverage.
