- id: evidence-gaps-and-contradictions
  title: Evidence Gaps and Contradictions
  body: 'The evidence is strong enough to show that Aalyria participates in a real and growing market, but not strong enough
    to produce a precise bottom-up market model. The biggest contradiction is structural rather than factual: top-down reports
    on the space economy, HTS services, ground segment, MilSatCom terminals, and NTN are all directionally supportive, yet
    they overlap heavily and describe different layers of the stack. That means they cannot be added without double counting.
    The second gap is commercial opacity. Public sources confirm named customers and programs, but they do not disclose contract
    values, software pricing, Tightbeam ASPs, attach rates, renewal terms, or conversion from demos to production deployments.
    The third gap is budget-line visibility. MILNET, SDA, and hybrid-space efforts validate defense demand, but public appropriations
    do not isolate a neat orchestration-software line item. Finally, the enterprise, aviation, and maritime buyer story remains
    directionally attractive but only partially proven as a direct Aalyria go-to-market motion. These gaps do not negate the
    market thesis; they define where diligence still needs private evidence.'
  claimRefs:
  - CM023
