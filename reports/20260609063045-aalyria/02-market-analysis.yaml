figures:
- id: FM001
  title: Market Sizing Lens
  type: pyramid
  layout: standard
  summary: The addressable market narrows sharply once Aalyria is framed as a control-plane and directed-link vendor 
    rather than as a generic satellite-connectivity provider.
  data:
    nodes:
    - label: 'Broad connected-space backdrop: $626.4B in 2025'
      detail: Novaspace's space-economy figure shows overall sector momentum and government plus private investment 
        support, not Aalyria's direct revenue pool.
      tone: neutral
    - label: 'Relevant adjacent layers: HTS, ground segment, MilSatCom, and NTN'
      detail: These layers contain the routing, service, and operational complexity that make orchestration and optical 
        terminals valuable.
      tone: positive
    - label: 'Reachable Aalyria SAM: about $0.8B-$3.0B over five years'
      detail: The reachable slice excludes raw bandwidth, manufacturing, launch, and vertically integrated operators 
        while preserving named buyer proof.
      tone: positive
  approximationNotes: The top layer is direct market data, while the lower layers are analytical transformations that 
    remove overlapping categories and ineligible spend.
