tables:
- id: TM001
  title: Market Definition Table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Aalyria
  rows:
  - - Satellite orchestration / control plane
    - Scheduling, routing, policy, trust, and network-management software across moving directional nodes
    - Raw bandwidth resale, general terrestrial NMS, and consumer broadband subscriptions
    - Constellation CTOs, defense programs, agencies, operator NOCs
    - This is Spacetime's core market and the center of Aalyria's control-plane thesis
  - - Free-space optical terminal layer
    - Directed laser terminals, link-management software, and deployment services for high-throughput directional links
    - Commodity RF user terminals and undifferentiated consumer dish hardware
    - Defense programs, select operators, primes, and high-end mobility platforms
    - This is Tightbeam's monetizable adjacency and widens Aalyria beyond software-only revenue
  - - Military directed-network management
    - Mission-network orchestration across proliferated, hybrid, and anti-jam architectures
    - Whole-defense-program value, launch, and spacecraft manufacturing budgets
    - Space Force, SDA, AFRL, NRL, SOCOM, and prime-led programs
    - Public MILNET, PWSA, and DIU signals show a real buyer class for resilient multi-orbit control
  - - Commercial multi-orbit network management
    - GEO+LEO, NGSO, and roaming-management layers for operators that need neutral interoperability
    - Vertically integrated operator stacks that are built and operated in-house
    - Commercial satellite operators and service platforms
    - Telesat and Rivada prove that independent operators can buy external orchestration
  - - Adjacent NTN / automation / spectrum layer
    - Interfaces, standards, policy, and automation work that make 5G NTN and secure connectivity usable
    - Full RAN stacks, handset economics, and terrestrial-only wireless networks
    - Telcos, agencies, standards programs, and strategic partners
    - Important adjacency for product roadmap and channel access, but not Aalyria's full TAM
  notes: The table defines scope rather than revenue. Included and excluded spend is inferred from Aalyria product 
    scope, official government problem statements, and partner/customer proof; it is not a claim that Aalyria can 
    monetize every listed budget line.
