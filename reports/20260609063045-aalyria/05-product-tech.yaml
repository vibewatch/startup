- id: TE005
  title: Technical risks and product diligence table
  columns:
  - Risk
  - Why it is real
  - Current public evidence
  - Mitigant / offset
  - Residual diligence ask
  rows:
  - - Atmospheric attenuation and cloud cover
    - Atmospheric optical links lose availability under clouds, haze, turbulence, and poor alignment
    - NASA and academic technical sources state clouds, turbulence, and pointing accuracy are core FSO constraints
    - Aalyria’s thesis explicitly pairs optical links with predictive routing and alternate-path orchestration
    - Need field data showing how often Tightbeam hands off or degrades under real weather conditions
  - - Pointing / acquisition / tracking precision
    - Narrow beams require very accurate pointing, especially on moving platforms
    - NASA and MDPI literature describe precise pointing and jitter control as central limitations
    - Spacetime may help with predictive geometry and motion modeling
    - Need public test evidence on acquisition time, reacquisition behavior, and vibration tolerance
  - - Space-segment Tightbeam maturity
    - Space-to-ground and ISL hardware are higher-value but harder than atmospheric links
    - Public sources say sea and space products are coming soon but do not publish a prototype or qualification path
    - Roadmap aligns with growing optical-ISL demand in partner constellations
    - Need named program, hardware configuration, and qualification schedule for space terminals
  - - Manufacturing scale and QA
    - Optical-terminal industrialization is hard even for specialist vendors
    - Mynaric’s 2025 restructuring and serial-production risk disclosures show category-level execution risk
    - Aalyria has fresh capital and partner demand
    - Need supplier map, production throughput, yield, and environmental test process for Tightbeam
  - - Operator telemetry / control-plane access
    - A network orchestrator only works where it can obtain sufficient state and control surfaces
    - Aalyria’s public proofs all assume deep integration with partner networks; coverage is limited where operators 
      withhold data
    - Open APIs and federation reduce some friction once a partner participates
    - Need evidence of how Aalyria handles partial observability or closed operators
  - - Standards churn in NTN and O-RAN
    - Aalyria is building into a standards area that ESA says still needs major interface changes
    - ESA and Keysight both imply ongoing adaptation work rather than a finished commodity standard
    - Being early can let Aalyria influence the standard itself
    - Need current interface versioning and downgrade path if standards evolve slowly
  - - Open-API commoditization
    - Visible APIs lower adoption friction but also reduce informational secrecy
    - GitHub repository exposes major interface concepts and contribution surfaces
    - Actual moat may reside in solver quality, deployment history, and partner integrations rather than interface 
      secrecy
    - Need evidence of customer lock-in, switching cost, or proprietary data advantage beyond the APIs
  - - Program concentration / government timing
    - Several high-signal proofs are government or quasi-government programs with long cycles
    - DIU, AFRL, ESA, and NASA are important validation nodes but do not by themselves prove broad recurring commercial 
      scale
    - Telesat, Rivada, and ALL.SPACE broaden the evidence base beyond government
    - Need revenue mix and conversion from demo or design-in to long-term production use
  notes: Risks are limited to issues that materially affect product maturity, integration feasibility, or deployment 
    scale. The table does not infer failure; it identifies what public evidence still cannot prove.
