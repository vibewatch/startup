- id: tightbeam-hardware-and-coupling
  title: Tightbeam hardware and its coupling to Spacetime
  body: 'Tightbeam is the more physically differentiated part of Aalyria’s stack and also the part with the largest public
    evidence gap. Aalyria’s own product surface is explicit about several top-level details: the current atmospheric product
    family is presented as T170x and G170x terminals, using a 170 mm aperture and delivering up to 100 Gbps, with demonstrated
    ground-to-air links approaching 200 km. The company also says the current product line serves land and air applications,
    while sea and space applications are still “coming soon.” Those disclosures are enough to treat Tightbeam as a real atmospheric
    optical terminal offering rather than a purely speculative future program. Integration logic is also clear. Tightbeam
    is described as plug-and-play with native Spacetime integration, and public partner narratives reinforce that Aalyria
    is trying to manage RF and optical links in a common orchestration framework. The product implication is that Tightbeam
    is not just sold as a standalone pipe; it is intended to be one more directional transport primitive that Spacetime can
    schedule around weather, motion, and mission priorities. The risk is that public hardware diligence stops near the marketing
    boundary. No reviewed source disclosed field MTBF, environmental qualification, terminal yield, manufacturing throughput,
    or a space-qualified terminal design. Independent technical literature and NASA guidance are consistent that atmospheric
    optical links are highly sensitive to pointing precision, turbulence, and cloud cover. That does not invalidate Tightbeam’s
    public claims, but it does mean the atmospheric version should be treated as credible yet only partly corroborated, while
    the announced future earth-to-space and space-to-space variants remain roadmap items rather than independently validated
    products.'
