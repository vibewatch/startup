- id: TE002
  title: 'Capability / feature table: company claims versus outside proof'
  columns:
  - Capability
  - Company statement
  - Outside proof
  - Implication / caveat
  rows:
  - - Predictive routing / digital twin
    - Spacetime responds to motion and weather in real time and establishes links tactically
    - Telesat says Spacetime analyzes millions of paths and builds a digital twin incorporating motion, weather, and 
      atmospheric effects
    - The workflow is externally corroborated, but model quality and compute efficiency remain undisclosed
  - - Cloud and sovereign deployment
    - Customer-owned single-tenant instances can run in Aalyria-hosted or customer-hosted Kubernetes, including 
      air-gapped environments
    - Public deployment claims appear on the homepage and are directionally consistent with government program 
      positioning
    - No public accreditation package or uptime metrics for classified deployments
  - - Open integration surface
    - Open APIs let partners and customers orchestrate networks and devices
    - GitHub exposes NBI, SBI, Federation API, protocol definitions, and an SBI agent implementation
    - Open APIs reduce adoption friction but also make interface concepts visible to rivals
  - - 5G NTN RIC / SMO role
    - Spacetime can act as a RAN Intelligent Controller with native O-RAN support
    - ESA and Keysight both describe Spacetime in O-RAN / NTN RIC or SMO contexts
    - The standards target is credible, but interface maturity is still evolving
  - - Cross-network federation
    - Spacetime Fabric brokers on-demand interconnection across terrestrial and non-terrestrial networks
    - ALL.SPACE and NASA/PExT use cases both reinforce the need for multi-network service brokering and failover
    - Public sources do not quantify how often this is used in production
  - - EO and civil-space workflow support
    - Spacetime helps Earth observation and civil-space operators assess transport feasibility across relays and 
      inter-satellite links
    - NASA Near Space Network and PExT show real demand for service orchestration across mixed government/commercial 
      links
    - Public evidence supports the workflow category, but named EO customer deployments are not public
  notes: This table intentionally distinguishes vendor-originated statements from partner, government, or 
    developer-surface corroboration. “Outside proof” does not always validate the full company claim; in several rows it
    validates only that the architecture is being tested or designed into real programs.
