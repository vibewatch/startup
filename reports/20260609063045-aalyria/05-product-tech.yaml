- id: FE002
  title: 'Customer workflow: from mission demand to routed directional links'
  type: flow
  layout: standard
  summary: Publicly inferable workflow for how Spacetime ingests mission demand and network state, then coordinates RF 
    and optical resources.
  data:
    nodes:
    - id: n1
      label: Mission request
      detail: Operator or application defines service objective, endpoints, timing, and policy intent through NBI 
        workflows.
    - id: n2
      label: Asset and link telemetry
      detail: Satellites, aircraft, ships, ground systems, and terminals publish state through southbound services or 
        partner integrations.
    - id: n3
      label: Weather / propagation inputs
      detail: Atmospheric and motion data shape expected link viability for RF and optical beams.
    - id: n4
      label: Digital twin / solver
      detail: Spacetime evaluates topology, beam geometry, resource constraints, and partner-network options in a 
        predictive model.
    - id: n5
      label: Routing and scheduling decision
      detail: The control plane selects paths, link schedules, beam resources, and fallback options.
    - id: n6
      label: Terminal and network execution
      detail: Commands flow to partner networks, SATCOM terminals, and Tightbeam-capable links through SBI or standards 
        interfaces.
    - id: n7
      label: Delivered mission service
      detail: Traffic is transported across the most viable current path and can be re-routed when conditions change.
