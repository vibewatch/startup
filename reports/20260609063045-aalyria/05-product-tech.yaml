  - - Rivada Outernet
    - Spacetime design-in announced for laser-linked 600-satellite mesh; partner targets service in 2026
    - Orchestration layer for gateway-light optical mesh with regenerative payload and beam hopping
    - 'High: partner announcement plus partner architecture page'
    - Launch/service timeline remains external to Aalyria and may slip
  - - ESA 5G/6G Hub and O-RAN project
    - Ongoing program as of January 2024; late-2023 demo at Harwell reported on ESA page
    - Spacetime adapted toward commercial-grade 5G NTN-capable SMO / Non-RT RIC workflow
    - 'High: official ESA project page'
    - Public page does not show current 2026 completion state or final deliverables
  - - Keysight NTN testbed
    - MOU and MWC 2025 demonstration announced
    - Spacetime integrated with RICtest to emulate and validate NTN RIC behavior
    - 'High: official release plus partner technical brief'
    - Testbed validation is not proof of multi-operator commercial deployment
  - - DIU Hybrid Space Architecture
    - Initial HSA contract awarded in 2022
    - Interoperable hybrid-space networking and orchestration for mixed government/commercial assets
    - 'High: official DIU page'
    - Official page is programmatic rather than deeply technical
  - - AFRL SDNX
    - Selected in January 2026 per trade reporting
    - Mission-tailorable network fabric across government, commercial, and allied satellites
    - 'Medium: high-signal trade press'
