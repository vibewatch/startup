chapter:
  number: 5
  title: Product & Technology
  summary: Public evidence supports Aalyria as a credible network-orchestration company with a more mature control-plane
    story than hardware story. Spacetime has a visible API surface, partner-backed integration evidence, and government 
    program traction across Telesat, Rivada, ESA, NASA, DIU, AFRL, Keysight, and ALL.SPACE; Tightbeam has concrete 
    public atmospheric-link claims, but public reliability, manufacturing, and space-qualification evidence remains 
    thin. The chapter therefore treats Spacetime as independently corroborated product infrastructure and Tightbeam as a
    plausible but still partly company-claimed optical layer whose biggest unanswered questions sit around scale, 
    environmental qualification, and space-segment readiness.
sections:
- id: product-boundary-and-portfolio
  title: Product boundary and portfolio map
  body: 'Aalyria’s public product surface is unusually coherent for a young space infrastructure company: the company is not
    selling a generic satcom stack, but a two-part architecture built around Spacetime software and Tightbeam optical terminals.
    Company materials consistently frame the core problem as directional networking rather than raw bandwidth. In Aalyria’s
    telling, narrow beams across satellites, aircraft, ships, fiber, and ground assets can deliver more secure and higher-capacity
    links than broadcast RF, but motion, terrain, and weather make those links operationally fragile. That framing matters
    because it explains why the company couples orchestration and transport rather than presenting them as unrelated businesses.
    Public product evidence supports that split. The homepage and February 2026 financing release describe Spacetime as the
    control plane that plans, schedules, and reroutes across dynamic networks in motion, while Tightbeam is the atmospheric
    laser terminal family providing high-capacity point-to-point links. The independently corroborated part of the story is
    stronger on the software side: partner announcements from Telesat, Rivada, ESA, Keysight, NASA, and ALL.SPACE all describe
    Spacetime in deployment or testbed terms. Tightbeam is more concrete than a concept slide because Aalyria publishes named
    form factors and top-line atmospheric performance claims, but the public record is thinner on production scale, qualification,
    and customer-operated field data. The right interpretation is therefore not “marketing-only,” but also not “fully disclosed
    deep-tech stack.” Spacetime looks like a commercially oriented orchestration layer with real external design-ins; Tightbeam
    looks like a technically credible optical product whose public diligence file still has major blind spots.'
