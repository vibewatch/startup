- id: TE003
  title: Interoperability and standards table
  columns:
  - Surface / standard
  - What is public
  - Evidence type
  - Why it matters
  - Remaining risk
  rows:
  - - Northbound / Southbound / Federation APIs
    - Publicly documented on GitHub under Apache 2.0
    - Developer signal
    - Makes Spacetime an integration layer rather than a closed operator tool
    - Open interfaces alone do not guarantee partner adoption or version stability
  - - O-RAN management interfaces (O1 / A1 / E2)
    - ESA project explicitly centers on identifying and testing needed modifications before integration into Spacetime
    - Official program page
    - Positions Aalyria near the standards layer for NTN orchestration
    - ESA itself says significant work remains to align O-RAN management interfaces to NTN needs
  - - 3GPP NTN Release 17 / 18 baseline
    - 3GPP overview confirms Releases 17 and 18 are current reference points; ESA cites Release 16/17 support for 
      steerable-beam topologies
    - Official standards / program pages
    - Anchors Aalyria’s interface targets in a real standards roadmap
    - Baseline keeps moving, so shipping product must track a changing target
  - - Keysight RICtest integration
    - Spacetime is paired with Keysight NTN RAN RICtest for spectrum, beam, beam-hopping, and mobility validation
    - Official company + partner technical material
    - Adds test-and-measurement credibility to NTN claims
    - Validation environment is not the same as sustained live-operator production
  - - NASA mixed-network service orchestration
    - PExT and Near Space Network show demand for software that works across government and commercial relays
    - NASA and NASA-sourced reporting
    - Demonstrates that multi-network orchestration is a live operational problem, not a speculative niche
    - NASA material does not publish Spacetime performance metrics or scope of production rollout
  - - Hydra multi-link terminal integration
    - ALL.SPACE says Hydra terminals and Spacetime will demonstrate failover and orchestration across all orbits and 
      terrestrial infrastructure
    - Partner proof
    - Shows terminal-side interoperability rather than only software-side claims
    - Still presented as partnership and demonstration pathway, not broad production fleet evidence
  notes: 'The table mixes standards documents, APIs, and field programs because Aalyria’s interoperability story depends on
