tables:
- id: TE001
  title: Product architecture and asset matrix
  columns:
  - Module / asset
  - Primary user / workflow
  - Publicly visible capability
  - Independent corroboration
  - Main diligence gap
  rows:
  - - Spacetime core orchestration platform
    - Satellite operators, defense network managers, civil-space operations teams
    - Single-tenant, customer-owned cloud-native orchestration platform for directional networks in motion
    - Telesat, Rivada, ESA, Keysight, NASA, DIU, AFRL, and ALL.SPACE all describe Spacetime in program or integration 
      contexts
    - Public sources do not disclose solver internals, latency budgets, or pricing model
  - - Spacetime NBI / SBI API surface
    - Customer software teams and terminal integrators
    - Public NBI, SBI, and Federation APIs with Apache 2.0 license, gRPC and Protocol Buffers definitions
    - GitHub repo exposes guides, agent implementation, and real-hardware modeling directory
    - No public backward-compatibility or SLA policy for API changes
  - - Spacetime Fabric / east-west federation
    - Operators brokering inter-network capacity or transit
    - Peer-network resource exchange and interconnection brokering across separate network fabrics
    - Homepage and GitHub README both describe federation semantics
    - No public production customer case quantifies federation transaction volume
  - - Tightbeam T170x fixed terminal
    - Fixed or semi-fixed land nodes and optical ground links
    - 170 mm aperture, up to 100 Gbps, atmospheric optical transport
    - Aalyria publishes the form factor and performance headline; partner materials consistently tie Tightbeam to the 
      broader stack
    - No public field reliability, qualification, or manufacturing-rate data
  - - Tightbeam G170x gimballed terminal
    - Mobile air and maneuvering-platform links
    - Gimballed variant with same headline aperture/data-rate class and ground-to-air test claim
    - Company materials say land-and-air versions exist today and connect natively into Spacetime
    - Public evidence does not show customer-operated long-duration airborne deployment
  - - Future sea / earth-to-space / space-to-space optical products
    - Naval, feeder-link, and ISL use cases
    - Sea and space applications are described as coming soon; company also references optical ground segment service 
      concepts
    - Series B release and homepage confirm roadmap direction
    - No public prototype, qualification schedule, or named production customer for space terminals
  notes: Rows separate currently visible products from roadmap products. Where public evidence is company-originated, 
    the corroboration column states whether external partner or government materials confirm deployment context rather 
    than the exact hardware spec.
