  evidenceGaps:
  - type: missing-source
    severity: material
    topic: hardware reliability
    missingEvidence: Public MTBF, environmental qualification, field-failure, or maintenance data for deployed Tightbeam
      land / air / ship terminals.
    whyItMatters: Without reliability and qualification evidence, investors cannot tell whether Tightbeam’s atmospheric 
      performance claims translate into durable fielded hardware.
    diligencePath: Request qualification reports, environmental test summaries, and customer-operated uptime or 
      maintenance logs for current Tightbeam deployments.
    relatedQuestionRefs:
    - QE020
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: manufacturing scale
    missingEvidence: Tightbeam production throughput, supplier concentration, yield metrics, and quality-control process
      for scaling beyond pilot or low-volume output.
    whyItMatters: Optical-terminal industrialization is a known failure point in the broader market, so Aalyria’s 
      hardware story cannot be underwritten from public product headlines alone.
    diligencePath: Request manufacturing KPI pack covering suppliers, line capacity, qualification gates, and backlog 
      conversion for Tightbeam programs.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE001
    - TE005
  - type: missing-source
    severity: material
    topic: space-qualified optical roadmap
    missingEvidence: Public prototype, qualification timeline, named customer program, or test results for 
      earth-to-space and space-to-space Tightbeam variants.
    whyItMatters: The largest commercial upside in optical networking sits in feeder links and ISLs, but that is also 
      where Aalyria’s public evidence is thinnest.
    diligencePath: Request hardware roadmap with prototype status, qualification plan, and partner program milestones 
      for space-segment Tightbeam products.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE001
    - TE004
    - TE005
