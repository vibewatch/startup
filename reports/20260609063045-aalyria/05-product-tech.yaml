  - - NASA PExT / SCaN enterprise service orchestration
    - PExT primary phase completed; extended operations through April 2027; NASA working with Aalyria on enterprise 
      service operations
    - Spacetime used to plan and manage communications services across mixed networks
    - 'Medium-high: NASA-sourced reporting plus NASA network context pages'
    - Scope of operational cloud deployment and rollout breadth are not public
  - - ALL.SPACE Hydra partnership
    - Strategic partnership announced in 2026
    - Terminal-side multi-link integration and cross-network failover with Spacetime orchestration
    - 'Medium-high: official partner page'
    - Still framed as partnership and demonstration path rather than broad deployment base
  notes: “Evidence strength” distinguishes named design-ins and official program pages from secondary trade coverage. 
