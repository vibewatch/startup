figures:
- id: FE001
  title: Spacetime + Tightbeam product architecture stack
  type: stack
  layout: standard
  summary: Layered view of the public Aalyria stack from mission intent through orchestration interfaces to physical 
    directional links.
  data:
    layers:
    - id: l1
      label: Mission / operator intent
      detail: Customer or mission software defines services, priorities, and network objectives through northbound 
        workflows.
    - id: l2
      label: Planning and federation interfaces
      detail: NBI and Federation APIs expose service requests, partner-network brokering, and interconnection semantics.
    - id: l3
      label: Predictive solver / digital twin
      detail: Spacetime models topology, motion, weather, and resource state to compute pathing and scheduling 
        decisions.
    - id: l4
      label: RIC / southbound control
      detail: Southbound device control plus NTN-oriented O-RAN / SMO extensions push commands into terminals and radio 
        layers.
    - id: l5
      label: Physical transports
      detail: RF links, directional beams, and Tightbeam atmospheric optical terminals carry traffic across moving 
        assets.
    - id: l6
      label: Outcomes
      detail: Programs such as Telesat, Rivada, NASA, ESA, AFRL, and ALL.SPACE use the stack to pursue resilient 
        multi-network service delivery.
  approximationNotes: The stack is conceptual. Public sources reveal interfaces and workflows but not the exact internal
    decomposition of Aalyria’s closed solver or deployment topology.
