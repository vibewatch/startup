  - type: missing-source
    severity: minor
    topic: products
    missingEvidence: Technical white paper or peer-reviewed documentation for Tightbeam's free-space optical mechanism 
      (coherent light approach, atmospheric turbulence compensation, aperture design trade-offs across six terminal 
      generations) is not publicly available.
    whyItMatters: Without technical documentation, Tightbeam's claimed 100 Gbps performance and atmospheric compensation
      mechanisms cannot be independently verified. The LLNL lineage is cited qualitatively but no specific patents or 
