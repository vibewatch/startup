  evidenceGaps:
  - type: missing-source
    severity: material
    topic: funding
    missingEvidence: Breakdown of pre-Series B equity rounds, individual investment amounts, ownership stakes, and cap 
      table structure for all investors including Alphabet/Google retained share.
    whyItMatters: Cap table opacity limits understanding of Google's economic alignment, potential IP license 
      constraints, ROFR provisions, and dilution dynamics. Alphabet's retained stake may carry governance provisions 
      that affect Aalyria's independence.
    diligencePath: Request cap table disclosure in due diligence; review Alphabet/Google IP license agreement and any 
      shareholder side letters.
    relatedQuestionRefs:
    - QO002
    - QO010

  - type: missing-source
    severity: material
    topic: scale
    missingEvidence: Aalyria has not disclosed revenue, ARR, gross margin, customer count, or any financial performance 
      metrics. No private company reporting obligations exist.
    whyItMatters: Without revenue data, the $1.3B valuation cannot be contextualized against standard SaaS or deep-tech 
      multiples. Customer count matters for assessing concentration risk around Telesat as the anchor commercial client.
    diligencePath: Request management accounts and ARR data directly; assess customer contract terms and Telesat revenue
      concentration in Series B due diligence.
    relatedQuestionRefs:
    - QO011
    - QO019
    - QO027

  - type: enumeration-incomplete
    severity: minor
    topic: leadership
    missingEvidence: Aalyria's full executive bench below CEO/CTO is not publicly documented. Board composition beyond 
      Michael Brown (incoming) and Vint Cerf (advisor) is unknown.
    whyItMatters: Key-person risk is concentrated in Taylor and Barritt; if either departs, the company loses primary 
      ties to the Google IP pedigree and defense customer relationships.
    diligencePath: Request organization chart; assess VP-level engineering, sales, and operations hires; evaluate 
      succession planning.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO002

  - type: private-evidence-only
    severity: material
    topic: government-contracts
    missingEvidence: AFRL SDNX contract value, deliverables, and timeline are not publicly disclosed. The nature of 
      'evaluation' vs. operational contract award is ambiguous in public coverage.
    whyItMatters: Defense contract pipeline is a key growth driver; the distinction between evaluation-stage and funded 
      operational contracts materially affects revenue visibility.
    diligencePath: Review contract award document under FOIA if applicable; confirm program status with Aalyria 
      management; cross-reference SAM.gov for any public procurement entries.
    relatedQuestionRefs:
    - QO018
    relatedTableRefs:
    - TO004

  - type: enumeration-incomplete
    severity: minor
    topic: investors
    missingEvidence: Exact pre-Series B equity round details, including round names, dates, and individual amounts from 
      early investors (J2 Ventures initial stake, Arthur Patterson/Accel, Housatonic Partners) are not publicly 
      available.
    whyItMatters: Incomplete funding history limits understanding of dilution trajectory and early investor 
      relationships that may carry information rights or board observation rights.
    diligencePath: Request historical cap table and prior round term sheets.
    relatedQuestionRefs:
    - QO002
    relatedTableRefs:
    - TO003

