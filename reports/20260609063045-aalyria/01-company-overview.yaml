- id: funding-history-and-investors
  title: Funding History and Investors
  body: >-
    Aalyria's earliest financing came through a July 2022 Other Transaction (OT) contract from the
    Defense Innovation Unit worth $8.7 million, awarded as part of the Hybrid Space Architecture
    (HSA) program under collaboration with the U.S. Space Force's Space Warfighting Analysis Center
    and AFRL. Concurrent with or preceding the public launch in September 2022, early institutional
    equity investors included Accel co-founder Arthur Patterson, J2 Ventures (as both early backer
    and subsequent Series B lead), and Housatonic Partners. The exact pre-Series B equity capital
    raised has not been individually disclosed, but can be estimated at approximately $30–35 million
    given CEO Taylor's post-Series B statement to SpaceNews that total capital raised is $135 million
    (implying roughly $35 million pre-Series B). Off Earth Data's investor brief cites $130 million
    total raised, a $5 million discrepancy that likely reflects slightly different timing or rounding.

    On February 23, 2026, Aalyria closed its $100 million Series B financing at a $1.3 billion
    post-money valuation. The round was co-led by Battery Ventures (represented by GP and new
    Aalyria board member Michael Brown) and J2 Ventures (represented by Managing Partner Alex
    Harstrick). DYNE Ventures participated as a repeat investor alongside other undisclosed investors.
    Alphabet/Google retains an undisclosed minority stake as a legacy of the 2022 spinout. Berenson
    and Company, LLC served as exclusive financial advisor to Aalyria for the Series B. Revenue,
    ARR, gross margin, net revenue retention, and any debt or credit facility details have not been
    publicly disclosed. No secondaries, tender offers, or structured equity transactions appear in
    public sources. The Series B proceeds are earmarked for accelerating headcount growth by
    approximately one-third, expanding Spacetime deployments on commercial LEO constellations, and
    scaling Tightbeam terminal manufacturing at the Livermore, California headquarters facility.
