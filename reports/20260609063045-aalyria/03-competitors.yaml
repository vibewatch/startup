- id: defense-primes-and-substitutes
  title: Defense Primes and Substitutes
  body: "Defense primes and military-network substitutes create a second competitive lane. Northrop Grumman's large SDA transport-layer
    award shows how much value can remain at the spacecraft-and-prime level before any middleware vendor is paid. CACI and
    Viasat attack adjacent layers from different directions: CACI emphasizes optical communications hardware and terminals,
    while Viasat sells secure government satcom and mission connectivity through established procurement channels. Those companies
    may not replicate Spacetime exactly, but they can absorb pieces of the architecture that Aalyria wants to own. The status
    quo is equally important. DIU, AFRL, MILNET, and SDA materials all imply that government users still rely on manual network
    operations, mission-specific integrations, and proprietary control planes. That substitute looks inefficient, but it is
    budgeted, trusted, and already embedded inside programs, which means Aalyria often competes against inertia as much as
    against a named vendor."
  claimRefs:
  - CP017
  - CP018
  - CP019
  - CP020
  - CP021
