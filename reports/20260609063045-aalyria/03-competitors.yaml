- id: TP003
  title: Pricing / Packaging Comparison
  columns:
  - Vendor
  - Price/Contract Model
  - Included Capabilities
  - Discount/Unknowns
  - Implication
  rows:
  - - Aalyria / Spacetime + Tightbeam
    - Custom enterprise, operator, and program contracts
    - Orchestration software, directional-network control, optical links, integration support
    - List pricing, renewal terms, and ASPs are undisclosed
    - Hard to benchmark pricing power even though technical value is differentiated
  - - Telesat + Aalyria deployment
    - Partnered program packaging inside constellation buildout
    - Constellation orchestration inside a named operator architecture
    - Commercial economics are not public
    - Shows a buy-partner path exists but hides realized software value capture
  - - Eutelsat / OneWeb
    - Managed connectivity and service bundles on owned assets
    - Capacity, terminals, operations, and customer support
    - Public enterprise package economics are not apples-to-apples
    - Competes as an integrated service rather than a standalone control layer
  - - SES / Open Orbits
    - Managed service and partner-aggregation packaging
    - MEO and partner capacity, service assurance, aviation coordination
    - Customer-specific terms are opaque in public materials
    - A strong service wrapper can crowd out a neutral middleware pitch
  - - Viasat / CACI / primes
    - Program-specific government contracts and terminal packages
    - Protected satcom, optical terminals, integration, mission support
    - Most contract values sit inside broader awards
    - Prime packaging competes for the same procurement line items Aalyria needs
  - - Status quo / manual NOCs
    - Internal labor and mission-operations budget
    - Dedicated links, operator-specific tools, and human coordination
    - Full cost is rarely disclosed or centralized
    - Cheap to start but scales poorly when buyers need multi-vendor resilience
  notes: Public materials mostly reveal packaging patterns rather than realized prices. Unknowns are strategic because 
    they hide both Aalyria margin potential and the true cost of integrated alternatives.
