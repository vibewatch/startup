- id: TP001
  title: Competitor Profile Table
  columns:
  - Competitor
  - Category
  - Scale/Funding
  - Target Segment
  - Differentiation
  - Limitation
  rows:
  - - SpaceX / Starlink
    - Vertically integrated constellation operator
    - Mass-scale LEO network with direct distribution and government path
    - Consumer, enterprise, government
    - Owns the stack from network design to service delivery
    - A closed stack leaves little reason to buy neutral orchestration inside its own network
  - - Eutelsat / OneWeb
    - Multi-orbit incumbent operator
    - Global GEO plus LEO carrier with existing customer base
    - Government, enterprise, aviation, maritime, media
    - Can bundle owned orbital assets with managed services
    - May prefer in-house integration and M&A over third-party middleware
  - - SES / O3b mPOWER
    - MEO and multi-orbit incumbent
    - Established operator with MEO and partner-led service layers
    - Government, cruise, aviation, telco, enterprise
    - Combines managed connectivity with Open Orbits service aggregation
    - Service wrapper can subsume the orchestration layer Aalyria wants to sell
  - - Iridium
    - Global LEO network substitute
    - Long-running LEO communications network with trusted service model
    - Government, IoT, voice, critical communications
    - Proven global coverage and operational reliability
    - Does not solve neutral multi-constellation orchestration breadth
  - - Northrop Grumman
    - Defense prime / build alternative
    - Prime-led SDA transport-layer award base
    - U.S. defense and proliferated-network programs
    - Can bundle satellites, integration, and internal network management
    - Prime-led architecture leaves less standalone software share for Aalyria
  - - Viasat / CACI
    - Defense systems and optical-layer substitute
    - Public-company and government-channel scale with optical terminal programs
    - Protected satcom, terminals, mission networks
    - Existing procurement channels plus hardware control points
    - Compete for layers of the stack rather than open, operator-neutral orchestration
  - - Amazon Project Kuiper
    - Big-tech entrant / internal build
    - Amazon-backed LEO buildout with cloud adjacency
    - Enterprise, consumer, government
    - Can internalize orchestration with broader platform resources
    - Still ramping deployment and unlikely to optimize for open interoperability
  - - CesiumAstro
    - Adjacent AI-enabled communications entrant
    - Private communications-payload vendor expanding via Vidrovr acquisition
    - Defense and commercial space systems
    - Embeds AI, RF optimization, and edge compute directly into networking products
    - Not yet proven as a neutral multi-orbit orchestration platform
