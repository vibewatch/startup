- id: TP004
  title: Moat Durability / Competitive Risk Register
  columns:
  - Moat Claim
  - Threat
  - Severity
  - Mitigation/Diligence Ask
  rows:
  - - Neutral orchestration across constellations
    - Customers internalize control planes or choose a closed-stack operator
    - High
    - Request win-loss data against internal-build alternatives and evidence of production expansions after design-in
  - - LLNL-derived optical IP
    - Primes and terminal vendors commoditize the optical layer
    - Medium
    - Request benchmark data, protected IP scope, and attach-rate evidence for Tightbeam
  - - Defense validation from DIU, AFRL, and MILNET
    - Procurement consolidates around one prime or integrated vendor
    - High
    - Ask which programs treat Aalyria as a required software layer versus a demonstration partner
  - - Standards and partner ecosystem positioning
    - Larger vendors absorb the interface layer into broader NTN stacks
    - Medium
    - Review API adoption, partner dependency, and whether Keysight-like integrations become recurring distribution
  - - Lighthouse operators and agency proof points
    - Small-logo concentration slows moat formation and weakens renewal leverage
    - High
    - Request deployment depth, renewal timing, and whether current logos are pilots, production programs, or both
  - - European foothold through ESA
    - Entrenched European carriers respond with integrated offers on their home turf
    - Medium
    - Review region-by-region pipeline split and displacement strategy versus Eutelsat and SES
  notes: Severity reflects the chance that a threat compresses Aalyria's category or bargaining power rather than the 
    chance it eliminates all demand outright.
