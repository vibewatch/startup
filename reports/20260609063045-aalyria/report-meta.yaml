  foundingLocation: USA
  headquarters: Livermore, CA, USA
  productSummary: Spacetime is Aalyria's autonomous network orchestration platform for multi-orbit, multi-vendor space, air, ground, and maritime networks; Tightbeam is its companion free-space optical communications terminal family for high-bandwidth links.
  customerFocus: Government and military agencies, LEO satellite operators, civil space agencies, and aerospace/NTN integrators that need interoperable multi-vendor network orchestration and optical-link infrastructure.
  businessModel: Recurring software/platform licensing for Spacetime, plus hardware sales, deployment, and integration services for Tightbeam and related government or commercial programs.
  stage: Series B
  fundingStatus: $100M Series B closed in February 2026 at a reported $1.3B post-money valuation, led by Battery Ventures and J2 Ventures; Alphabet/Google retained a minority stake from the 2022 spinout, and total capital raised is reported at about $135M.
