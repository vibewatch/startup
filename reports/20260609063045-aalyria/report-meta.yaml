companyProfile:
  summary: Aalyria is a Livermore, California space-networking company publicly launched in 2022 from a Google/Alphabet spinout. Its core products are Spacetime, an autonomous multi-orbit network orchestration platform with Project Loon heritage, and Tightbeam, a high-throughput free-space optical terminal line. Public evidence shows meaningful customer proof with Telesat Lightspeed, DIU, AFRL, ESA, and NASA, alongside a $100M Series B closed in February 2026 at a reported $1.3B post-money valuation.
  foundedDate: '2022-01-01'
  founders:
    - name: Chris Taylor
      role: CEO, co-founder
      background: National security and government-facing enterprise operator who led the Aalyria spinout from Alphabet.
      claimRefs:
        - CO004
        - CO024
    - name: Brian Barritt
      role: CTO, co-founder
      background: Former Google technical leader who developed Spacetime under Project Loon and leads Aalyria's architecture.
