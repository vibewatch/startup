            body: >-
              Aalyria 未披露公司层面的 ARR、毛利率、CAC、回本周期或净留存率，因此公开单位经济必须主要停留在定性层面，或明确标注为估算。最重要的结构点是，Spacetime 和 Tightbeam
              的经济性不会相同。成熟的编排软件层可能类似企业基础设施软件，具备高毛利和经常性续约价值；Tightbeam
              则引入物料成本、制造开销、库存、认证工作和现场支持，压低混合画像。政府和星座销售也更像重集成，而不是交易型销售，这意味着周期更长、现金转换更慢，服务含量也高于自助式 SaaS
              动作。唯一公开运营规模代理指标是员工数：Series B 时约 90 人，管理层目标是再招聘约三分之一。按每名员工 $150,000-$250,000 的保守全负担成本区间计算，收入抵消前隐含年运营开支代理约为
