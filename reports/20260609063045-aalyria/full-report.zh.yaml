      - number: '6.4'
        title: 扩张动力与集中风险
        blocks:
          - type: paragraph
            body: >-
              Aalyria 早期收入验证高度依赖美国政府客户，因此面临显著集中风险。MILNET 项目——Space Force 拟议的 $4 billion+ 扩散式 LEO 星座——是最尖锐的政府集中威胁：如果 DoD
              围绕 SpaceX 的 Starshield 技术栈整合 PLEO 策略，Spacetime 所代表的多供应商编排价值主张，对政府最大采购项目的战略重要性就会下降。Space Force 表示正在开展
              Analysis of Alternatives，多供应商光交叉链路互操作性仍在评估；如果多供应商结果胜出，Spacetime
              的机会仍会保留。商业扩张取决于星座部署：随着运营商网络的卫星数量和跨轨道复杂度上升，Spacetime 收入才会放大。Telesat Lightspeed（156 颗卫星，Ka-band + Mil-Ka）和
              Rivada（规划 600+ 颗 LEO）如果按计划推进，就代表显著扩张潜力。ESA / 欧洲总部的设立打开第二个政府市场，降低只依赖美国的集中度。Keysight 的 5G NTN MOU 和 Airbus
              SpaceRAN 项目打开电信运营商板块，这是一块结构性很大的扩张面。不过，Rivada 的财务健康和星座部署时间表仍不确定，Telesat Lightspeed 也经历过融资延期，可能把首个运营性
              Spacetime 收入确认推迟到 2027 年或更晚。没有 NRR、扩张 ARR 或落地后扩张数据可用，无法量化扩张引擎的历史产出。
