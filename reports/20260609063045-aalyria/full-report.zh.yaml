      - number: '2.5'
        title: 证据缺口与矛盾
        blocks:
          - type: paragraph
            body: >-
              证据足以说明 Aalyria 参与了一个真实且增长中的市场，但还不足以产出精确的自下而上市场模型。最大的矛盾是结构性而非事实性：太空经济、HTS 服务、地面段、MilSatCom 终端和 NTN
              的自上而下报告都在方向上支持该市场，却高度重叠，并且描述技术栈的不同层。因此它们不能相加，否则会重复计算。第二个缺口是商业不透明。公开来源确认了具名客户和项目，但未披露合同金额、软件定价、Tightbeam
              平均售价、附着率、续约条款，或从演示到生产部署的转化。第三个缺口是预算科目可见度。MILNET、SDA
              和混合太空工作验证国防需求，但公开拨款没有单独拆出清晰的编排软件科目。最后，企业、航空和海事买方故事在方向上有吸引力，但作为 Aalyria 的直接 GTM
              动作只得到部分证明。这些缺口不否定市场逻辑；它们界定了尽调仍需取得私有证据的地方。
