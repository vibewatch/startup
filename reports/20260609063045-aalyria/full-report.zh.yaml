        - 星座或平台项目办公室
        - 需要管理数千条移动定向链路
      - - 美国 DoD / 军方项目
        - 项目办公室、任务通信负责人或创新赞助方
        - 任务运营、频谱管理和网络运营团队
        - 拨款国防预算或 OT 路径
        - 原型 -> 架构验证 -> 纳入项目
        - 嵌入大型项目的军种或机构通信预算
        - 韧性、抗干扰姿态和互操作性要求
      - - 政府 / 民用航天机构
        - 任务负责人、实验室或安全连接项目负责人
        - 研究、运营和标准团队
        - 机构项目预算
        - 演示 -> 标准对齐 -> 规模化任务支持
        - 机构连接和任务支持预算
        - 需要连接异构网络并证明安全运营可行
      - - 国防主承包商 / 系统集成商
        - 项目经理或解决方案架构师
        - 集成工程团队
        - 主承包商主导的客户合同
        - 分包或组件导入 -> 认证 -> 推广
        - 政府为最终付款方的主承包商任务预算
        - 比从零搭建编排更快
      - - 企业 / 航空 / 海事运营商
        - 服务平台负责人或移动网络运营商
        - 连接运营团队
        - 服务提供商或平台预算
        - 渠道主导试用 -> 捆绑方案 -> 更广部署
        - 移动或托管服务预算
        - 需要更高吞吐的定向链路，或多轨道策略控制
    notes: 政府和主承包商主导项目中，买方、用户和付款方最容易分离。企业、航空和海事细分市场被有意放在次要路径，因为与 Telesat、Rivada、DIU 和 ESA 相比，公开的直接采购证据仍更薄。
