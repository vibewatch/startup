              公开来源中出现两个关于 Aalyria 创立的可信参照点：2021（CEO Taylor 于 November 2021 注册公司，据 CNBC 引用其 LinkedIn 资料记载）和 September
              2022（Alphabet 正式转移 IP 并公开亮相）。两个说法处在不同参照系下都准确。本章采用 2021 作为创立年份，2022 作为公开运营启动时间。BusinessWire Series B
              新闻稿明确写道“Aalyria 创立于 2021 年”，因此将规范创立年份解释为 2021。
