  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品边界与组合地图
        blocks:
          - type: paragraph
            body: >-
              对一家年轻太空基础设施公司来说，Aalyria 的公开产品面异常清晰：公司不是在卖通用卫星通信栈，而是围绕 Spacetime 软件和 Tightbeam
              光终端构建的两部分架构。公司材料始终把核心问题定义为定向网络，而不是原始带宽。按 Aalyria 的叙述，卫星、飞机、船舶、光纤和地面资产之间的窄波束能提供比广播 RF
              更安全、更高容量的链路，但运动、地形和天气让这些链路在运营上脆弱。这个框架很重要，因为它解释了公司为何把编排和传输绑在一起，而不是把它们呈现为无关业务。公开产品证据支持这种拆分。官网和 February 2026
              融资公告把 Spacetime 描述为控制平面，负责在动态运动网络中规划、调度和重路由；Tightbeam 则是提供高容量点对点链路的大气激光终端系列。独立佐证部分在软件侧更强：来自
              Telesat、Rivada、ESA、Keysight、NASA 和 ALL.SPACE 的合作伙伴公告，都以部署或试验台语言描述 Spacetime。Tightbeam 比概念幻灯片更具体，因为 Aalyria
              公布了具名形态和顶层大气性能主张，但公开记录在生产规模、认证和客户运营现场数据上更薄。正确解读不是“只有营销”，但也不是“深科技栈已充分披露”。Spacetime
              看起来像带有真实外部设计导入、面向商业的编排层；Tightbeam 看起来像技术上可信的光产品，但其公开尽调文件仍有重大盲点。
