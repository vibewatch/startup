  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与分类
        blocks:
          - type: paragraph
            body: >-
              Aalyria 的市场边界是太空网络的控制平面和定向链路层，而不是整个卫星经济。公司销售 Spacetime——面向运动中定向网络的编排平台，以及 Tightbeam——100 Gbps
              自由空间光终端。这意味着纳入支出范围的是网络编排与控制软件、绑定托管定向链路的光终端硬件、军用定向网络架构，以及商业多轨 GEO+LEO 或 NGSO
              管理。应排除的范围包括原始带宽转售、垂直一体化消费者宽带服务、卫星制造、发射，以及纯地面无线。ESA 的卫星支持 5G 和更广泛安全连接工作，加上 MarketsandMarkets 的 NTN
              与自动化类别，更适合作为相邻市场处理，因为它们塑造接口、标准和预算，却不会把 Aalyria 变成完整电信基础设施供应商。现状替代方案是运营商自有控制栈、主承包商的点状方案，以及人工任务集成流程。Aalyria
              的切入口是互操作性：公司材料、DIU 问题陈述和客户验证都围绕让独立运营的节点在空、陆、海、天之间协同。
