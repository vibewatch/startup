      - number: '5.2'
        title: Spacetime 控制平面、接口与工作流逻辑
        blocks:
          - type: paragraph
            body: >-
              Spacetime 的公开架构已经足够从产品角度分析。Aalyria 官网称其为单租户托管平台，客户可在 Aalyria 托管或客户托管的 Kubernetes
              环境中运行，部署范围覆盖商业云、混合、本地和涉密隔离环境。公开 GitHub 仓库提供了更多技术细节：Spacetime 暴露北向接口，用于定义网络和服务请求；南向接口，用于设备交互和指标；以及联邦或东西向
              API，用于在对等网络之间交换网络资源和互联。这个 API 表面很有意义，因为它把 Spacetime 从封闭的运营商专用调度器，变成候选互操作层。合作伙伴证据也厘清了预期工作流。Telesat
              表示，Spacetime 对数百万条可能路径进行实时分析，持续更新天线调度和路由，并维护一个可建模运动、天气和大气影响的数字孪生。Keysight 的 2025 年合作把同一产品描述为 AI 驱动的 NTN
              RAN 智能控制器，可在符合 O-RAN 和 3GPP NTN
              标准的试验台中优化频谱、波束、跳波束和移动性。合在一起，公开记录指向一个由求解器驱动的控制平面：北向摄取任务意图和网络状态，在预测模型中计算路径和资源决策，再向南把指令推送给终端和对等网络。仍不清楚的是客户代码与
              Aalyria 代码的精确边界、内部求解器架构，以及 “AI” 标签有多少是经典优化、多少是学习式预测。API 可见性提高了技术可信度，但内部闭源意味着尽调仍应把关键性能主张视为部分不透明。
