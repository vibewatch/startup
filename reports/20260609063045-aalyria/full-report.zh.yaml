      - number: '7.2'
        title: 技术与品类风险
        blocks:
          - type: paragraph
            body: >-
              Aalyria 的技术风险一部分来自公司本身，一部分来自整个品类。公司特定证据支持 Spacetime
              已经演示过路由和编排，但最强的公开引用仍在描述研究、演示和集成项目，而不是跨异构舰队的大规模生产运行。Tightbeam 在公开证据上更早期：Aalyria 称终端已经过验证，但没有披露产量、可靠性、良率或
              MTBF。品类证据同样偏谨慎。ESA 与 Aalyria 的 5G/6G NTN 工作称，O-RAN 草案接口仍需修改，全行业对齐需要大量时间；3GPP 的版本路线图也清楚显示，NTN 标准仍在演进。DIU 对
              Hybrid Space Architecture 的描述强调兼容性、通用接口、零信任控制，以及跨多个参与网络的动态信任评分，说明互操作和认证门槛是系统级关口，不只是软件功能。Tightbeam
              还继承了更广泛的自由空间光通信风险：大气损耗、精密光学供应瓶颈，以及光终端同业 Mynaric 已经出现的制造 / 营运资本压力。这些品类信号不能证明 Aalyria
              会失败，但会显著抬高一个假设的门槛：光通信和多域编排能够快速采用。
