        title: 反向与替代风险
        blocks:
          - type: paragraph
            body: >-
              反向情景很直接。如果市场收敛到垂直一体化运营商，编排中间件品类会明显变小。Starlink 证明一家公司可以拥有制造、软件、终端和服务交付；Project Kuiper
              很可能是这一模式的下一版。同一风险的政治版本出现在 MILNET 内部：对供应商锁定的担忧支持 Aalyria
              的开放性论点，但也提高了在运营规模上证明真实多供应商互操作性的门槛。第二条替代路径来自在位者和主承包商自建服务织网，Eutelsat/OneWeb、SES Open Orbits、Northrop、Viasat
              和 CACI 都指向这种可能。第三条路径来自 CesiumAstro 等相邻进入者，它们把 AI 和信号分析直接嵌入通信载荷。因此，Aalyria
              不只是需要更多客户；它需要证明中立编排仍是一个持久采购品类，而不是临时集成桥梁。
