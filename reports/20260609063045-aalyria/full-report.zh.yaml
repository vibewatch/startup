  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Aalyria 的竞争集合很特殊，因为它不是要比单一竞争星座造得更强。它站在运营商、政府、主承包商和终端供应商之间，提供中立编排和定向链路层。来自 Telesat、Rivada、DIU 和 ESA
              的公开验证显示，确实有一些买方需要这种中立性，尤其当它们要让网络跨越独立拥有的太空资产时。但真实竞争地图比直接软件同行更宽。它包括 Starlink 以及未来的 Kuiper
              等垂直一体化运营商，Eutelsat/OneWeb 和 SES 等多轨道在位者，能够把网络管理留在大型平台合同内部的国防主承包商，以及人工 NOC 加自有控制平面的现状方案。因此，Aalyria
              的品类具有战略重要性但仍然脆弱：网络异构性越高，它的价值越大；如果客户决定由一家供应商拥有整个技术栈，市场就会缩小。
