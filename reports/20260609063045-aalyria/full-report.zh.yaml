  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: >-
              Aalyria 的财务模型最好理解为双流架构，而不是纯软件故事。一边是 Spacetime，看起来像企业基础设施软件：Aalyria 将其作为 Aalyria
              托管或客户托管的托管服务销售，可运行在商业云、混合、本地或隔离环境中。这支持通过授权、订阅或托管服务合同产生经常性收入，并叠加部署和集成的专业服务。另一边，Tightbeam 明确是硬件。Aalyria
              销售固定式和云台式光通信终端，这意味着一次性产品收入、安装工作和支持义务，毛利率纯度低于软件。Telesat、DIU、NASA、AFRL、Rivada 和 Keysight
              等公开客户标识支持判断：商业和政府渠道确实有买方兴趣，但这些来源都没有披露价目表、实际软件定价、终端平均售价或打包组合。结果是，公司具备真实变现面，但公开价格透明度非常有限。
