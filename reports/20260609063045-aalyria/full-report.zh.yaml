      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              市场顺风很清楚。HTS 需求仍在扩大，多轨道架构正在成为主流，地面基础设施转向软件和服务模式，国防项目持续资助增殖式和光网络。同样重要的是，定价压力正在改变价值所在。Novaspace
              认为，带宽本身不再是核心差异点；Via Satellite 的行业小组称，服务可能变得远大于容量，同时约 $0.25 per GB 的门槛已经成为与光纤竞争的参照。这些趋势利好
              Aalyria，因为它们奖励编排、终端和用户体验，而非原始频谱所有权。约束也同样真实。频谱策略、主权要求和安全架构会拖慢部署。采购通常把编排支出藏在更大的国防或运营商项目里。大型垂直一体化网络可以自建栈。AST
              SpaceMobile 等相邻 D2D 玩家也在争夺同一类 NTN 和政府实验预算的一部分。CNBC 关于客户希望获得 Starlink 替代方案的报道支持需求判断，但也凸显这个市场已经变得紧迫且竞争激烈。
