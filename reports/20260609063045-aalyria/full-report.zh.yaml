      - number: '8.2'
        title: 公开可比公司与价格纪律
        blocks:
          - type: paragraph
            body: >-
              公共市场最干净的映射不是单一收入倍数，而是一条区间。Aalyria 的 $1.3 billion 私营估值约为 Iridium 2026 年 6 月市值的 26%，约为 Viasat 的 15%，约为
              Eutelsat 的 30%；而这些运营商已经披露了大规模收入基础，并在规模化运营真实网络。另一个极端是 Mynaric 2026 年 6
              月极小的市值，它提醒投资人：光通信硬件一旦执行和融资断裂，股权价值可能被大幅抹去。AST SpaceMobile 展示了相反结果：即便经济性尚未成熟，公共市场也可能为战略性太空网络叙事支付很高溢价。Aalyria
              位于两端之间。当前价格太高，无法用纯硬件或项目服务视角支撑；但它又没有市场上最投机的网络平台押注那么激进。更合理的理解是，投资人为真实伙伴和政府证据之上的软件控制平面期权付费，同时接受经济性仍不透明。
