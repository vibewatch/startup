              国防主承包商和军事网络替代方案构成第二条竞争线。Northrop Grumman 的大型 SDA 传输层合同显示，在任何中间件供应商获得付款之前，大量价值可以留在航天器和主承包商层面。CACI 和 Viasat
              从不同方向攻击相邻层：CACI 强调光通信硬件和终端，Viasat 则通过成熟采购渠道销售安全政府卫星通信和任务连接。这些公司未必精确复制 Spacetime，但能够吸收 Aalyria
              想拥有的架构片段。现状方案同样重要。DIU、AFRL、MILNET 和 SDA
              材料都暗示，政府用户仍依赖人工网络运营、任务特定集成和自有控制平面。这个替代方案看起来低效，但已经有预算、受信任，并嵌入项目内部；这意味着 Aalyria 往往既在对抗具名供应商，也在对抗惯性。
