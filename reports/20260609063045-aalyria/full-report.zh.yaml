      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              Aalyria 的买方地图用五个分层最容易理解。A 类是 Telesat、Rivada、SES、Eutelsat 等商业 LEO 或 MEO 运营商，以及需要在全面服务发布前部署编排的相邻在位者。B
              类是美国国防和军事生态——Space Force、SDA、AFRL、NRL、SOCOM 及相关项目——其中买方、用户和付款方往往不是同一个机构。C 类是 NASA、ESA
              等民用和政府机构，早期采用通常通过演示、安全连接项目和标准工作发生。D 类是国防主承包商和系统集成商，它们既可以把 Aalyria 带入项目，也可能自己吸收编排层。E 类是企业、航空和海事连接；作为
              Tightbeam 的二级直销市场，以及 Spacetime 的渠道驱动市场，它的重要性会提高。Telesat、Rivada、DIU 和 ESA 的公开胜利表明，Aalyria
              通常先证明互操作性，再被设计进更大的项目，随后才扩展为经常性部署。Aalyria 约 90 人的规模，以及 Livermore 加 Washington, D.C.
              的运营模式，也强化了其应优先争取高价值设计导入，而不是追求宽泛横向覆盖。
