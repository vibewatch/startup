      - number: '6.2'
        title: 采用轨迹与部署证据
        blocks:
          - type: paragraph
            body: >-
              Aalyria 最扎实的政府侧证据，是 2023 年 12 月 NRL 演示：Spacetime 管理了一个 630 颗卫星的网状网络，横跨三家商业运营商、四类终端、两大洲四个地面站，并有 150
              多名美国政府和国防官员到场。该演示由 $8.7 million DIU Hybrid Space Architecture 合同资助。2026 年 1 月宣布的 AFRL Space Data Network
              Experimentation（SDNX）合同，是下一个政府部署里程碑，把 Spacetime 验证推进到美国空军项目化卫星数据网络开发。商业侧最重要的里程碑，是 Telesat 承诺把 Spacetime
              集成进 Lightspeed LEO 星座架构；Telesat CEO Dan Goldberg 在 2026 年 2 月 Series B 新闻稿中公开确认了这项集成。Rivada Space Networks
              2023 年 3 月为其规划中的 600 颗卫星星座选择 Spacetime，不过 Rivada 的部署时间表已经延期。Airbus 的 SpaceRAN 项目在 5G NTN 演示中部署
              Spacetime，提供了欧洲商业市场验证。ESA 合同（2023 年 12 月）由 UK Space Agency 资助，是 Aalyria 首个公开宣布的非美国政府机构客户。NASA
              合作聚焦提升地球观测数据交付效率。All.Space 被列为 Series B 公告中的合作伙伴。整体看，披露的客户和伙伴名单确认了横跨四个板块（DoD、民用航天、LEO 运营商、5G NTN 集成商）的 10+
              个具名实体，但没有客户披露活跃生产收入，商业牵引阶段仍难以精确量化。
