      - number: '5.5'
        title: 差异化、技术成熟度与关键产品风险
        blocks:
          - type: paragraph
            body: >-
              Aalyria 的差异化，最好理解为「控制平面优先」的投资逻辑。公开证据显示，公司不只是口头宣称互操作；它已经开放集成接口，拿下具名设计导入，并在行业尚未形成稳定抽象层的地方推进标准工作。这比许多「太空
              AI」叙事更扎实。Telesat 和 Rivada 的用例说明，Spacetime 正被嵌入架构差异很大的网络；ESA 和 Keysight
              则显示，公司不是等待标准落定，而是在试图影响标准层。专利记录也显示，围绕移动网络编排的 IP 仍在持续扩展，已经超出最初 Google/Loon 的传承。不过，本章也不能夸大成熟度。公开资产中最成熟的是
              Spacetime 面向定向地面、空中与混合轨道网络的编排叙事。Tightbeam
              的大气光终端在技术上看起来可行，商业上也有意义，但已审阅的公开材料还达不到投资人评估可规模化硬件项目时需要的颗粒度：没有公开可靠性表，没有环境适应性认证记录，没有披露产能吞吐，也没有披露空间级终端。外部技术文献是有用的校准，因为它说明这些缺口为何重要：光链路的成败取决于云量、湍流、指向精度和对准稳定性。Mynaric
              2025 年重组的行业证据又提醒一层：即便底层物理很有吸引力，光终端工业化在财务和运营上也可能很难。结论因此是分裂的。Spacetime 作为差异化编排 /
              控制平面产品，具备独立可信度，也契合真实生态需求。Tightbeam 像是有潜在价值的一体化光通信层，但公开尽调包仍不完整，执行、制造和空间段成熟度仍是重大未解产品风险。
