      - CV023
  - id: TV004
    title: 情景 / 证据权重表
    columns:
      - 情景
      - 里程碑逻辑
      - 指示性估值判断
      - 当前证据权重
      - 触发上移的证据
    rows:
      - - 上行情景 / 软件控制平面
        - Lightspeed 转为真实流量，互操作性形成粘性，更多运营商采用多供应商编排
        - '>$2B 可以说得通'
        - 当前低至中
        - 披露经常性软件收入，并增加生产环境客户
      - - 基准情景 / 偏高但可成立
        - 技术可信度仍然成立，但变现仍不透明且集中
        - 接近当前 $1.3B 融资轮
        - 当前中
        - 合同经济模型更清楚，或出现可见的经常性部署
      - - 下行情景 / 硬件与项目拖累
        - MILNET 或类似项目收窄，Lightspeed 延期，或 Tightbeam 扩规模显得资本密集
        - 低于 $0.5B 开始说得通
        - 当前存在实质风险
        - 项目负面消息、制造摩擦，或持续不披露收入
      - - 当前公开证据立场
        - 融资条款和验证点可见，但运营指标不可见
        - 偏高，而非合理
        - 在现有证据中权重最高
        - 只有经济模型变得可见后才会重估
    notes: 这些是由里程碑逻辑和公开可比锚点推导出的估值区间，不是未披露的公司预测。
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
      - CV033
      - CV034
      - CV036
  - id: TV005
    title: 上行 / 下行驱动因素表
    columns:
      - 驱动因素
      - 当前证据
      - 方向
      - 估值影响
    rows:
      - - 软件控制平面叙事
        - Telesat、DIU 和市场数据来源支撑编排需求
        - 上行
        - 支持相对纯硬件同业的溢价
      - - 收入不透明
        - 未公开披露收入、ARR、利润率或客户数
        - 下行
        - 无法给出公允价值锚点，立场仍偏高
      - - MILNET 架构风险
        - 反向报道显示，架构和资金仍不确定
        - 下行
        - 可能削掉政府业务上行空间的主要部分
      - - Lightspeed 商业化
        - 中选属实，但生产环境经济模型尚不可见
        - 双向
        - 成功上线会大幅提升信心
      - - 硬件扩规模风险
        - Tightbeam 的理论价值真实，但公开的量产就绪证据有限
        - 下行
        - 可能把公司拖向硬件式估值处理
      - - 行业需求顺风
        - NTN 和卫星网络需求到 2026 年仍具战略重要性
        - 上行
        - 即便公司经济模型仍不透明，也能保住战略期权价值
    notes: 同一家公司可以有强战略驱动；但当验证与变现不均衡时，估值仍需要谨慎。
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
      - CV038
  - id: TV006
    title: 尽调触发项表
    columns:
      - 尽调问题
      - 缺失证据
      - 重要性
      - 若正向，可能的立场变化
    rows:
      - - 披露经常性软件收入
        - 未公开披露经常性收入或合同质量
        - 这是检验本轮是否应按软件公司估值的最直接方式
        - 偏高 → 合理
      - - 软件 / 硬件 / 服务收入结构
        - 未公开披露结构
        - 把高溢价控制平面价值，与低倍数项目或硬件价值拆开
        - 信心大幅上升
      - - Lightspeed 生产环境里程碑验证
        - 尚无公开证据显示 Spacetime 承载真实商业流量
        - 对可复制商业变现最好的外部证明
        - 当前价格的合理性提升
      - - Tightbeam 制造就绪度和 MTBF
        - 没有公开的规模经济或可靠性验证
        - 检验硬件是上行期权，还是估值拖累
        - 若验证成立，下行风险收窄
      - - MILNET 架构清晰度
        - 公开报道仍显示架构不确定
        - 政府 TAM 和战略价值的关键二元变量
        - 如果多供应商方案仍受青睐，风险评级可下降
      - - Google / Alphabet 持股与 IP 边界细节
        - 保留持股已经披露，具体经济影响和 IP 影响未披露
        - 降低核心资产周围的治理和权利负担不确定性
        - 信心上升，尤其对后续轮次
    notes: 这些是最小一组尽调项；它们能实质改变立场，而不是只做表面修饰。
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
      - CV044
      - CV045
