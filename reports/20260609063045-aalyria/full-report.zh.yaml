            body: >-
              相比 Aalyria 的运营披露，锚点事实异常清楚。BusinessWire、CNBC、SpaceNews 以及其他 2026 年轮次报道都指向一轮 $100 million Series B，据报道估值
              $1.3 billion，由 Battery Ventures 和 J2 Ventures 领投，Google 保留持股。公开证据也显示投资人为何感兴趣：Aalyria
              被定位为扩散式卫星网络的通信骨干基础设施，拥有 Google 剥离血统，并具备 Telesat Lightspeed 选择、DIU 支持和 ESA
              合同等可见战略证据。同样重要的是，公开证据没有显示什么。同一批融资报道没有披露收入、ARR、毛利率、NRR
              或客户数，也没有拆分未来价值应有多少归属于经常性编排软件，多少归属于硬件、集成或政府项目工作。这个缺口让本轮融资作为投资人风险偏好信号更强，而作为基本面估值支撑证明更弱。换句话说，Aalyria
              有可信的产品和生态证据，但公开变现证据薄弱。
