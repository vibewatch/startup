      - number: '1.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 近十年 Google + LLNL 研发沉淀形成深科技护城河
            body: >-
              Spacetime 和 Tightbeam 在 Aalyria 创立前都承接了 Google/Alphabet 与 Lawrence Livermore National Laboratory
              近十年的投入。这段历史构成持久竞争护城河：December 2023 的 NRL 演示达到技术成熟度等级 9（TRL 9）、覆盖 630 颗在轨卫星，Tightbeam
              终端也已迭代六代；没有同等研发周期的新进入者难以复制。Google 保留少数股权同时传递 IP 连续性信号，也带来需要尽调的潜在悬而未决风险。
            calloutType: strength
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO018
              - CO036
          - type: callout
            title: 垂直一体化星座运营商带来自研而非采购风险
            body: >-
              SpaceX 和 Amazon 运营垂直一体化卫星生态，可能选择自研编排，而不是采用第三方平台。CTO Brian Barritt 直接承认了这一风险：“数十亿美元押在网络上的公司，可能希望控制自己的网络栈。”
              SpaceX 的 Jonathan Hofeller 强调，垂直整合（“继续构建卓越基础设施，是我们擅长的事”）是 Starlink 的战略优势。Aalyria
              的联邦化论点要求多运营商架构足够主导，先支撑起中立编排中间件市场，然后才不至于被在位者把类似能力内部化。
            calloutType: risk
            claimRefs:
              - CO038
              - CO039
