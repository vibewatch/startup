      - number: '6.3'
        title: 留存、耐久度与客户满意度
        blocks:
          - type: paragraph
            body: >-
              Aalyria 没有公开披露 Spacetime 客户的
              NRR、GRR、流失或续约数据。这符合公司的私营阶段，也符合以政府合同为主的结构：留存由合同续期决定，而不是订阅流失指标。政府合同（DIU、AFRL、ESA）是带有结构化续期关口的多年项目协议，不是按月订阅；这说明合同生命周期内存在结构性留存，但商业
              NRR 指标并不是合适的参照。客户黏性最耐久的证据，是从 $8.7M DIU HSA 原型合同（2023 年 12 月演示）推进到 AFRL SDNX 后续合同（2026 年 1
              月），这意味着政府继续投入，而不是一次性试点。Telesat 的集成承诺在架构上很深：Spacetime 被描述为正「与我们的系统设计」集成，而不是作为可选服务叠加上去；一旦 Lightspeed
              星座在该平台上部署，切换成本可能很高。Satellite Industry Association 的 State of the Satellite Industry
              报告确认，政府对卫星通信基础设施的投资持续增长，这为合同续期概率提供了宏观顺风。公开记录中没有 Aalyria
              的投诉、诉讼、合同终止或客户流失，但部署历史有限（大多数合作不到三年），意味着有意义的留存数据在结构上不可得，而不只是未披露。
            claimRefs:
