      - number: '8.4'
        title: 建议与尽调路径
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，正确结论是观察 / 继续研究，置信度中等，估值立场偏高。Aalyria 的证据足以避免被直接贴上「昂贵 /
              回避」标签：官方和伙伴来源支持差异化技术、严肃投资人，以及政府和运营商真实战略兴趣的存在。但公司尚未披露财务证据，外部投资人无法检验 $1.3 billion
              价格是否合理。因此，最重要的尽调问题是经济性，而不是叙事：经常性软件收入披露、软件与硬件 / 服务收入结构、关键项目合同结构、Lightspeed 生产里程碑、Tightbeam 制造就绪，以及 Google /
              Alphabet 持股和 IP 条款边界。如果这些问题得到正面答案，立场可以转向合理。如果答案转负——或在项目风险上升时仍得不到回答——当前估值就会开始显得明确昂贵。
