            body: >-
              Aalyria
              的披露质量符合风险投资支持的私营公司常态，但不足以用于承销。公开来源没有提供收入、ARR、按产品线拆分的毛利率、现金余额、债务义务、在手订单价值、客户集中度、软件与硬件组合，或实际合同定价。即便有强商业验证，金额也大多缺失：Telesat
              披露了 10+ 年期限，但没有合同金额；DIU、NASA、AFRL、Rivada 和其他项目证明需求，却不证明年化收入；Series B 公告给出估值和募资额，但没有解释 $1.3 billion
              投后价格为何成立的财务模型。这个缺口很重要，因为 Aalyria
              的模型混合了经常性软件、资本更重的硬件和政府集成工作。没有产品线利润率、付款节奏和集中度数据，投资者无法判断这家公司是在像企业软件一样复利增长，还是像项目加硬件承包商一样循环。公开记录因此在叙事动能上强，在决定收入质量的指标上弱。
