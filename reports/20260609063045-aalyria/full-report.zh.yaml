      - number: '4.5'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              Aalyria 看起来可融资，但还无法充分承销。正面情景真实存在：官方和独立来源都指向新近完成的 $100 million 融资、$1.3 billion
              估值、蓝筹投资方，以及多个商业和政府部署验证。公司不是没有变现路径的科研项目。更难的问题是变现质量。Aalyria
              选择了一个战略上有吸引力、财务上却混合的位置，介于基础设施软件、专用硬件和长周期国防集成之间。如果 Spacetime
              成为多网络运营的中立控制平面并深度嵌入，这种组合可以产生持久优势；但它也可能带来比独角兽标题暗示更低的混合毛利、更慢的回款，以及更高融资依赖。公开记录不足以把该估值视为由收入倍数驱动。除非管理层披露产品线收入、利润率、在手订单、集中度和流动性，否则合理结论是：战略相关性谨慎正面，财务质量仍需谨慎。
