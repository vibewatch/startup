  - id: TE005
    title: 技术风险与产品尽调表
    columns:
      - 风险
      - 风险为何真实
      - 当前公开证据
      - 缓释 / 抵消因素
      - 剩余尽调问题
    rows:
      - - 大气衰减与云层遮挡
        - 在云层、雾霾、湍流和对准不佳条件下，大气光链路可用性会下降
        - NASA 和学术技术来源均称，云层、湍流和指向精度是 FSO 核心约束
        - Aalyria 的逻辑明确把光链路与预测性路由、备选路径编排配套使用
        - 需要现场数据证明真实天气下 Tightbeam 多频繁切换或降级
      - - 指向 / 捕获 / 跟踪精度
        - 窄波束需要极高指向精度，移动平台上尤其如此
        - NASA 和 MDPI 文献把精确指向、抖动控制列为核心限制
        - Spacetime 可能有助于预测几何关系和运动建模
        - 需要关于捕获时间、重捕获行为和抗振容忍度的公开测试证据
      - - 空间段 Tightbeam 成熟度
        - 星地和 ISL 硬件价值更高，但难度也高于大气链路
        - 公开来源称海上和空间产品即将推出，但未发布原型或鉴定路径
        - 路线图契合合作伙伴星座不断增长的光 ISL 需求
        - 需要空间终端的具名项目、硬件配置和鉴定排期
      - - 制造规模与 QA
        - 光终端工业化对专业厂商也很难
        - Mynaric 2025 年重组和批量生产风险披露显示出品类层面的执行风险
        - Aalyria 有新融资和合作伙伴需求支撑
        - 需要 Tightbeam 的供应商图谱、产能、良率和环境测试流程
      - - 运营商遥测 / 控制平面访问
        - 网络编排器只有拿到足够状态和控制接口才能工作
        - Aalyria 的公开证明都假定与合作伙伴网络深度集成；若运营商不开放数据，覆盖能力会受限
        - 合作伙伴参与后，开放 API 和联邦机制可降低部分摩擦
        - 需要证据说明 Aalyria 如何处理部分可观测性或封闭运营商
      - - NTN 和 O-RAN 标准变动
        - Aalyria 所进入的标准领域，ESA 认为仍需要重大接口调整
        - ESA 和 Keysight 都暗示适配工作仍在继续，而不是已有成熟商品化标准
        - 提前进入可让 Aalyria 影响标准本身
        - 需要当前接口版本管理，以及标准演进缓慢时的降级路径
      - - 开放 API 商品化
        - 可见 API 降低采用摩擦，也削弱信息保密性
        - GitHub 仓库暴露主要接口概念和贡献入口
        - 真正护城河可能在求解器质量、部署历史和合作伙伴集成，而不是接口保密
        - 需要 API 之外的客户锁定、切换成本或专有数据优势证据
      - - 项目集中度 / 政府节奏
        - 多个高可信度证明来自周期很长的政府或准政府项目
        - DIU、AFRL、ESA 和 NASA 是重要验证节点，但本身不能证明广泛、经常性的商业规模
        - Telesat、Rivada 和 ALL.SPACE 把证据基础扩展到政府之外
        - 需要收入结构，以及从演示或设计导入转向长期生产使用的转化情况
    notes: 风险仅限于会实质影响产品成熟度、集成可行性或部署规模的问题。本表不推断失败；只说明公开证据仍无法证明什么。
