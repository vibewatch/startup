      - 差异化
      - 限制
    rows:
      - - SpaceX / Starlink
        - 纵向一体化星座运营商
        - 大规模 LEO 网络，拥有直达分销和政府路径
        - 消费者、企业、政府
        - 从网络设计到服务交付都掌握在自己手里
        - 封闭技术栈几乎没有理由在自有网络内购买中立编排
      - - Eutelsat / OneWeb
        - 多轨道存量运营商
        - 全球 GEO 加 LEO 运营商，已有客户基础
        - 政府、企业、航空、海事、媒体
        - 能把自有轨道资产与托管服务打包
        - 可能更偏好内部集成和 M&A，而不是第三方中间件
      - - SES / O3b mPOWER 卫星网络
        - MEO 和多轨道存量运营商
        - 成熟运营商，拥有 MEO 和合作伙伴主导的服务层
        - 政府、邮轮、航空、电信、企业
        - 把托管连接与 Open Orbits 服务聚合结合起来
        - 服务外壳可能吞掉 Aalyria 想销售的编排层
      - - Iridium
        - 全球 LEO 网络替代方案
        - 长期运营的 LEO 通信网络，服务模型受信任
        - 政府、IoT、语音、关键通信
        - 已验证的全球覆盖和运营可靠性
        - 无法解决中立多星座编排的广度
      - - Northrop Grumman
        - 国防主承包商 / 自建替代
        - 主承包商主导的 SDA 传输层合同基础
        - 美国国防和扩散式网络项目
        - 能打包卫星、集成和内部网络管理
        - 主承包商主导架构留给 Aalyria 的独立软件份额更少
      - - Viasat / CACI
        - 国防系统和光学层替代方案
        - 上市公司和政府渠道规模，叠加光学终端项目
        - 受保护卫星通信、终端、任务网络
        - 既有采购渠道加硬件控制点
        - 竞争的是技术栈中的若干层，而不是开放、运营商中立的编排
      - - Amazon Project Kuiper
        - 大科技进入者 / 内部自建
        - Amazon 支持的 LEO 建设，带云邻近性
        - 企业、消费者、政府
        - 可用更广的平台资源把编排内化
        - 部署仍在爬坡，也不太可能优先优化开放互操作
      - - CesiumAstro
        - 邻近 AI 通信进入者
        - 私营通信载荷供应商，通过收购 Vidrovr 扩张
        - 国防和商业航天系统
        - 把 AI、RF 优化和边缘计算直接嵌入网络产品
        - 尚未证明自己是中立的多轨道编排平台
    notes: 截至 2026 年，这些是与 Aalyria 的 Spacetime 编排和 Tightbeam FSO 市场最相关的头部竞争者；不包括纯地面 SDN 供应商和长尾主权集成商。
