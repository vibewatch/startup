  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - HTS 流量和多轨道复杂度
        - 正向
        - 2026-2034
        - 吞吐量提升、多轨道运营普及后，手工协调更难跑通，编排层更受益
        - 询问哪些网络需要第三方编排，而不是运营商自有工具
      - - 容量价格重置之后
        - 对软件正向，对纯容量卖方负向
        - 当前
        - 价值从带宽转向编排、终端、服务质量和用户体验
        - 要求证明 Aalyria 能在原始容量层之上捕获价值
      - - 地面段转向 GSaaS 和 OPEX
        - 正向
        - 2026-2034
        - 服务驱动运营更偏好能抽象异构资产、降低运营商开销的软件
        - 询问多少 GSaaS 预算能映射到控制平面软件
      - - MILNET / PWSA / 光网络资金
        - 正向
        - 2025-2030
        - 政府项目证明，具备韧性的定向网络架构仍是有预算的优先事项
        - 要求给出准确项目引用、后续合同和导入里程碑
      - - ESA 和 5G NTN 标准项目
        - 正向
        - 当前至中期
        - 标准和安全连接工作扩大了 Aalyria 的合作伙伴触面和产品邻近性
        - 询问哪些标准位置会转化为产品收入，哪些只是战略相关性
      - - 频谱、安全和主权摩擦
        - 负向
        - 当前且结构性
        - 这些约束会拖慢采用、迫使定制，也可能偏向本土或自研方案
        - 按客户要求列出频段、安全域和主权要求上的阻碍
      - - 大型运营商纵向一体化
        - 负向
        - 结构性
        - 部分最大网络会自建控制平面，或只采购窄得多的组件
        - 询问哪些大型运营商确实不在现实 SAM 内
      - - 采购不透明和隐藏的软件行项目
        - 负向
        - 当前且结构性
        - 即便需求真实，公开预算也很少清楚隔离编排价值
        - 要求给出具名赢单的合同金额、软件范围和续约条款
      - - 航空 / 海事 / 企业的次级买方模糊
        - 负向
        - 当前
        - 机会可能由渠道主导，而不是直销；销售周期和毛利假设都会变
        - 要求拆分直销销售管线与经销商或合作伙伴主导的销售管线
    notes: 这是一张定性的时间和估值视角表，不是打分卡。方向描述对 Aalyria 可触达市场的净影响，尽调问题聚焦最能改变 TAM 到 SOM 信心的缺失证据。
