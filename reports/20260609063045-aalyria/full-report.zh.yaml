      - number: '7.5'
        title: 缓释因素、监测指标与尽调问题
        blocks:
          - type: paragraph
            body: >-
              最重要的尽调纪律，是区分已验证部署和已验证收入。投资人应监测 MILNET 是否明确保持多供应商路线，Telesat 和 Rivada 是否达成发射与融资里程碑，Aalyria 是否发布任何规模化
              Tightbeam 制造或安全认证证据，以及公开合同是否从研究和采购订单迁移到经常性生产项目。缓释案例是真实的：Aalyria 吸引了严肃交易对手，Telesat 的协议异常具体，ESA
              正在标准相关工作中使用该公司，且公司没有成为公开法律或监管问题。但这些缓释只有在转化为可重复经济性和更广泛互操作接受度时才重要。因此，近期否决标准应聚焦架构决策、伙伴延期和披露：MILNET 若由
              Starshield 主导、锚定运营商进一步滑坡、无法展示制造就绪，或重大融资后仍长期缺少收入 / 积压订单披露，都会实质性削弱投资案例。
