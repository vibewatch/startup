    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与业务概览
        blocks:
          - type: paragraph
            body: >-
              Aalyria Technologies, Inc. 是一家航空航天通信公司，总部位于加州 Livermore，并在 Washington D.C.、Pittsburgh 和 London
              设有办公室。公司法定实体名称 Aalyria Technologies, Inc. 已由其官方隐私政策确认。公开来源中出现两个可信创立时间：CEO Chris Taylor 于 November 2021
              以隐身模式注册公司（其 LinkedIn 资料记载，经 CNBC 引用）；而 September 2022 则是 Alphabet
              转移近十年知识产权、专利和实物资产后，公司正式走出隐身状态的时间。BusinessWire 的 Series B 新闻稿称公司“创立于 2021 年”，Satnews 则称公司“于 September 2022
              从 Google (Alphabet) 剥离”。两个说法处在不同参照系下都准确；本章把 2021 视为创立年份，把 2022 视为正式运营启动日期。Google 内部代号 “Minkowski” 的技术在
              Project Loon 期间开发，随后才出现剥离机会。

              February 23, 2026 完成 $100 million 融资后，Aalyria 被归为 Series B 阶段。公司采用双收入架构：一边是 Spacetime
              的软件授权，这是一套用于编排运动中定向网络的托管平台即服务（PaaS）；另一边是 Tightbeam 的硬件销售，这是一条自由空间光激光通信终端产品线，可在极远距离上提供最高 100 Gbps。Spacetime
              可作为托管服务运行在 Aalyria 托管或客户托管的 Kubernetes 环境中，也可部署在商业云、混合云、本地部署或涉密隔离基础设施里。Tightbeam
              终端采用固定式（T170x）和云台式（G170x）形态，口径 170 mm，数据速率最高 100 Gbps，并已演示接近 200 km
              的地对空链路。两款产品共同应对一个基础难题：移动车辆、变化天气和地形遮挡会持续打断定向链路；这个问题已经阻碍 DoD 超过 40
              年，难以统一陆、海、空、天网络。公司把自己定位为中立的“数字软骨”，让不同卫星星座、飞机、地面站和地面网络之间实现联邦式编排。
