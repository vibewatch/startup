        - 大多不在 Aalyria 的直接产品范围内
      - - HTS 服务层
        - Novaspace 经 SpaceNews
        - 2025-2034
        - 全球
        - 2025 年约 $31B，2034 年增至 $76B；需求达到 218 Tbps
        - 以服务需求代理多轨道复杂度和路由需求
        - 中
        - 包括 Aalyria 不直接销售的容量收入
      - - 地面段 / MilSatCom 终端层
        - Novaspace 经 SpaceNews
        - 2025-2034
        - 全球 / 国防
        - $106B 地面段市场；到 2034 年 MilSatCom 终端累计 $26.25B
        - 从运营和硬件邻近性观察编排与光学终端
        - 中
        - 混合了服务、终端和软件层
      - - NTN / 自动化邻近赛道
        - MarketsandMarkets
        - 2025-2031
        - 全球
        - 5G NTN 从 2026 年 $11.91B 增至 2031 年 $45.55B；卫星 NTN 从 $0.56B 增至 $2.79B；自动化从 $7.88B 增至 $12.38B
        - 用邻近赛道观察标准、编排和软件化预算
        - 中
        - 类别重叠，不能直接相加
      - - Aalyria 约束模型
        - 基于具名买方证据的分析师综合判断
        - 2026-2030
        - 仅目标细分市场
        - 总可用市场（TAM）$5B-$12B；可服务市场（SAM）$0.8B-$3.0B；可获取市场（SOM）$0.08B-$0.35B
        - 自下而上的区间，来自公开买方、邻近赛道和单一供应商份额上限
        - 低
        - 合同金额、软件定价和附着率未披露
