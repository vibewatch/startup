  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 已确认的公司特定风险
        blocks:
          - type: paragraph
            body: >-
              Aalyria 最清晰的公司特定下行，不来自已知运营失败，而来自公司集中在仍在成形中的政府和卫星项目。SpaceNews 报道称，MILNET 出现在 FY2026 国防辩论中，当时外界不清楚 Pentagon
              是否会把扩散式 LEO 通信转向以 SpaceX 为中心的路径；Department of the Air Force 则表示，架构仍处于 Analysis of Alternatives 阶段。也就是说，即便
              Aalyria 赢得实验，如果采购最终围绕单一供应商整合，或企业级光终端互操作选择偏向其他供应商，它仍可能输掉最终技术栈决策。公开证据也显示，一些具名美国政府活动仍然规模较小或处于早期：USAspending
              列出一笔 $709,750 的 NASA 采购订单，用于 Spacetime XS 预发布实例；Satellite Today 将 AFRL 的 SDNX
              工作描述为一项技术研究，用来识别缺口、集成考量以及未来实验路径。商业上，Telesat 已签署 10+ 年编排协议，但其他标杆客户级证据多是选择、合作或研究，未披露经常性收入。没有发现 Aalyria
              特定的公开诉讼、专利纠纷、出口管制行动或 FCC 执法；这是正面信号，但应理解为公开记录有限的清洁度，而不是法律或认证风险不存在的证明。
