      - - SES
        - 大型老牌卫星通信运营商
        - 投资者页面列示 2025 年年收入 €3.5B
        - 表明公开市场估值下，老牌公司已经承载多少收入
        - SES 比 Aalyria 成熟得多，业务也更多元
      - - AST SpaceMobile
        - 叙事浓厚的下一代网络平台
        - 2026 年 6 月市值 $35.73B
        - 表明在经济模型成熟前，市场可以把战略平台逻辑拉伸到多远
        - 直连手机需求和消费者叙事，不等同于 Aalyria 的 B2B 编排逻辑
      - - Mynaric
        - 光通信硬件供应商
        - 2026 年 6 月市值 $3.87M
        - 反向可比：硬件执行和融资压力会如何重击估值
        - Mynaric 缺少 Aalyria 的软件与伙伴叙事
    enumerationScope:
      coverage: partial
      basis: >-
        The set intentionally spans operator-scale, growth-premium, and hardware-distress public comps because public
        private-market data for close Aalyria analogues is sparse.
    notes: 目的在于划定区间，不是做虚假的一对一精确倍数。估值采用 2026 年 6 月的公开市场锚点和所引公司披露。
