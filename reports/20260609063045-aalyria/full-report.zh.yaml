      - number: '2.2'
        title: 市场规模与估算
        blocks:
          - type: paragraph
            body: >-
              衡量 Aalyria 市场规模，最稳妥的方法是用多个受约束视角，而不是引用一个巨大的 TAM 数字。Novaspace 的 2026 年太空经济研究显示，2025 年背景市场为 $626.4
              billion，并将在 2034 年走向 $1.01 trillion，但其中大部分价值都不在 Aalyria 的产品范围内。更相关的切片包括 HTS 服务，2025 年增长至约 $31 billion，预计
              2034 年达到 $76 billion；$106 billion 地面段市场，其中包括到 2034 年 $26.25 billion 的 MilSatCom 终端价值；以及 5G NTN、卫星 NTN
              和网络自动化相邻市场。这些资金池不能机械相加，因为它们彼此重叠，且很多仍描述 Aalyria 无法直接捕获的服务收入或基础设施支出。因此，一个可辩护的五年综合口径是低十几 billion 的 TAM 视角，更窄的
              $0.8 billion 至 $3.0 billion 可触达 SAM，以及更窄的 $0.08 billion 至 $0.35 billion 合理
              SOM。规模模型刻意采用区间，因为公开来源证明买方需求，却无法证明合同金额、定价或附着率。
