          detail: RFP 或 OTA 合同；政府演示（NRL 风格）；技术集成评估
        - id: n3
          label: 集成承诺
          detail: 架构集成决策（例如 Telesat CEO 声明）；为星座或项目完成设计导入
        - id: n4
          label: 活跃部署
          detail: Spacetime 在实时星座或 DoD 项目中生产运行；Tightbeam 进入现场
        - id: n5
          label: 扩张
          detail: 增加更多星座、轨道体制或任务类型；向 Tightbeam 硬件增购
    claimRefs:
      - CU001
      - CU005
      - CU007
      - CU016
  - id: FU004
    title: 客户关系延续矩阵
    type: matrix
    layout: standard
    summary: 按参与年份展示政府和商业客户关系的延续信号；在未披露 NRR 或 GRR 数据时，可作为留存代理。
    data:
      columns:
        - 合作开始
        - 第 2 年状态
        - 2026 年中状态
        - 深度信号
      rows:
        - label: DIU / 美国政府
          values:
            - '2022'
            - 活跃（$8.7M 合同）
            - 延续（AFRL SDNX 2026）
            - 高 – 两份独立政府合同
        - label: ESA
          values:
            - Dec 2023
            - 正在开发
            - 持续（Harwell 园区）
            - 中 – 单一机构合同周期
        - label: Rivada Space Networks
          values:
            - Mar 2023
            - 伙伴关系维持
            - 部署前待定
            - 低 – 星座尚未建成
        - label: Telesat Lightspeed
          values:
            - 2024–2025
            - 已承诺集成
            - 架构嵌入已确认
            - 高 – CEO 公开声明
        - label: NASA
          values:
            - 2022–2023
            - 合作持续
            - 2026 年 2 月以合作伙伴身份出现
            - 低 – 未披露合同金额
        - label: AFRL
          values:
            - Jan 2026
            - 活跃合同
            - 开发中
            - 中 – 项目合同
    approximationNotes: 这是定性的关系延续矩阵，不是 NRR 队列。公开来源无法获得真实 NRR、GRR 和留存队列数据。单元格填的是延续状态标签，不是留存百分比。
    claimRefs:
      - CU011
      - CU012
      - CU013
  - id: FR001
    title: 风险热力图——按风险类别比较影响与可能性
    type: matrix
    layout: wide
    summary: 定性风险热力图，按可能性和影响严重程度定位 Aalyria 的关键风险类别。
    data:
      columns:
        - 可能性（低 / 中 / 高）
        - 影响（低 / 中 / 高）
        - 剩余严重性
        - 关键缓释因素
      rows:
        - label: 美国政府集中度 / MILNET
          values:
            - 高
            - 严重
            - 高
            - 多供应商政策倡导；AFRL/ESA 多元化
        - label: Tightbeam 硬件制造规模化
          values:
            - 中
            - 高
            - 高
            - Series B 资本；LLNL 人才网络
        - label: Alphabet/Google IP 残余主张
          values:
            - 低
            - 严重
            - 中
            - Series B 尽调；IP 转让已审核
        - label: SpaceX Starlink 数据排除
          values:
            - 高
            - 中高
            - 高
            - 聚焦非 Starlink 运营商；开放标准倡导
        - label: ITAR/EAR 出口管制
          values:
            - 中
            - 高
            - 中
            - 英国总部 ITAR 架构安排；出口管制法律顾问
        - label: 关键人物（Taylor/Barritt）
          values:
            - 低
            - 高
            - 中
            - 创始股权留存；组织知识固化
        - label: Telesat 进度滑坡
          values:
            - 中
            - 高
            - 中
            - 商业订单储备多元化；跟踪 TSAT 监管文件
        - label: 网络安全 / 编排攻击
          values:
            - 中
            - 高
            - 中
            - 空气隔离部署；零信任架构
    claimRefs:
      - CR001
      - CR006
      - CR012
      - CR017
      - CR026
  - id: FR002
    title: 依赖流——项目和技术风险如何传导至收入与估值
    type: dag
    layout: wide
    summary: 因果图：把采购、运营商、制造和互操作风险与收入时点和估值压缩连接起来。
    data:
      nodes:
        - id: r1
          label: MILNET / DoD 整合
          detail: 若 DoD 为 PLEO 选择仅用 Starshield 的架构
        - id: r2
          label: Telesat 进度滑坡
          detail: Lightspeed 部署推迟到 2027 之后
        - id: r3
          label: Tightbeam 量产失败
          detail: 终端生产无法放量
        - id: r4
          label: SpaceX 数据排除
          detail: Starlink 始终不接入 Spacetime 网络
        - id: r5
          label: 政府收入流失
          detail: DoD 项目缩减或取消
        - id: r6
          label: 商业收入延迟
          detail: Spacetime 生产级部署推迟至 >2027
        - id: r7
          label: 硬件收入缺口
          detail: Tightbeam 销售额低于资本投入门槛
        - id: r8
          label: 网络效应受限
          detail: Spacetime 管理的 LEO 资产池不到 50%
        - id: r9
          label: 资本缺口
          detail: 硬件资本开支加上收入延迟，要求更早启动 Series C
        - id: r10
          label: 估值压缩
          detail: 收入延迟、投资逻辑走弱，压低退出倍数
      edges:
        - from: r1
          to: r5
          label: 直接丢单
        - from: r2
          to: r6
          label: 首次生产级部署推迟
        - from: r3
          to: r7
          label: 产量低于门槛
        - from: r4
          to: r8
          label: 可触达资产池受结构限制
        - from: r5
          to: r9
          label: 收入短缺
        - from: r6
          to: r9
          label: 收入短缺
        - from: r7
          to: r9
          label: 硬件收入缺口
        - from: r8
          to: r10
          label: 护城河叙事走弱
        - from: r9
          to: r10
          label: 资本风险折价
    claimRefs:
      - CR019
      - CR021
      - CR022
      - CR023
      - CR024
  - id: FR003
    title: 公开证据漏斗——从明星 Logo 到已披露的可持续经济性
    type: funnel
    layout: standard
    summary: 这张图示意 Aalyria 庞大的公开 Logo 名单如何收窄到披露经济性证据点的更小子集。
    data:
      items:
        - label: Series B 材料中公开点名的 Logo / 项目
          value: 9
          unit: count
          note: Telesat、Google Public Sector、NASA、Airbus、ALL.SPACE、Keysight、Logos Space、ESA、美国政府 / 军事部门
        - label: 具备活跃项目证据的点名项目
          value: 6
          unit: count
          note: 公开网页或文章显示存在活跃协议、项目、研究或订单
        - label: 披露期限或订单金额的项目
          value: 2
          unit: count
          note: Telesat 10+ 年协议和 NASA $709,750 采购订单
        - label: 公开口径仍偏研究 / 试点 / 标准工作的项目
          value: 4
          unit: count
          note: 例子包括 AFRL SDNX、ESA O-RAN、DIU HSA 实验和 Rivada 入选
        - label: 公开披露的经常性收入 / 积压订单指标
          value: 0
          unit: count
          note: 截至 runDate，未公开披露收入、积压订单或 Logo 层面的经常性价值
    approximationNotes: 计数只是保守的公开证据分桶，不是正式的销售漏斗转化模型。即便同一 Logo 出现在多份公开材料中，也只计一次。
    claimRefs:
      - CR044
      - CR045
      - CR046
      - CR047
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 披露的融资条款、证据质量、缺失的经济性和项目风险，如何合在一起指向偏高的估值判断。
    data:
      nodes:
        - id: n1
          label: 2026 融资锚点
          detail: Series B 融资 $100M，据报道估值 $1.3B
        - id: n2
          label: 真实战略证据
          detail: Telesat、DIU、ESA 和 Google 剥离背景均真实可见
        - id: n3
          label: 软件化可选性
          detail: 一旦编排层形成足够粘性，控制平面就有上行空间
        - id: n4
          label: 经济性缺失
          detail: 未公开收入、年经常性收入（ARR）、利润率、净留存率（NRR）或客户数
        - id: n5
          label: 项目 / 硬件拖累
          detail: MILNET 不确定性、Lightspeed 节奏、Tightbeam 放量风险
        - id: n6
          label: 价格偏高
          detail: 公开证据更能支持可行性，而不是估值公允性
        - id: n7
          label: 观察 / 继续研究
          detail: 先等生产落地和收入质量证据，再把估值视为合理
      edges:
        - from: n1
          to: n6
          label: 待检验的入场价格
        - from: n2
          to: n6
          label: 支撑溢价
        - from: n3
          to: n6
          label: 可能支撑上行
        - from: n4
          to: n6
          label: 阻断公允价值锚点
        - from: n5
          to: n6
          label: 下行空间仍在
        - from: n6
          to: n7
          label: 等待更多证据
    claimRefs:
      - CV001
      - CV007
      - CV027
      - CV035
      - CV043
