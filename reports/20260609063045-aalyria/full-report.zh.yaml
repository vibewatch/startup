      - number: '1.4'
        title: 规模指标与里程碑
        blocks:
          - type: paragraph
            body: >-
              截至 February 2026 Series B，Aalyria 在 Livermore 总部以及 Washington D.C.、Pittsburgh 和 London 办公室约有 90
              名员工。公司公开承诺员工数至少增长三分之一——目标约为 120 人或更多——招聘集中在工程、产品和客户支持。收入和 ARR 未披露；Aalyria
              是私营公司，没有报告财务指标的义务，也一直拒绝在公开来源中提供具体披露。客户数未量化；公司提到的战略账户包括 Telesat Lightspeed、NASA、European Space
              Agency、Rivada Space Networks、Airbus、ALL.SPACE、Keysight Technologies、Logos Space、Google Public
              Sector，以及若干美国军事项目。

              根据 Aalyria 官方 GitHub 仓库，Spacetime 已达到技术成熟度等级 9（TRL 9），并积累了超过 2 million 小时的航空航天节点无人值守编排。该平台声称可支持超过 15
              million 条可能链路，聚合吞吐最高 1.6 Tbps，可在卫星、飞机、地面站和地面网络之间进行实时调度。Spacetime Fabric 功能支持独立运营的网络编排平台之间实现联邦。

              公司的里程碑节奏显示商业与政府验证推进很快：2022 年获得 $8.7 million DIU Hybrid Space Architecture 合同；March 2023 与 Rivada Space
              Networks 签署 Spacetime 协议；December 2023 获得 ESA 合同并设立 London 总部；December 2023 在 Naval Research Laboratory 演示
              630 颗卫星网状网络，超过 150 名政府和国防官员到场（使用 OneWeb、Viasat 和 Intelsat 卫星）；January 2026 获得 AFRL Space Data Network
              Experimentation 项目合同；February 2026 达成 $100 million Series B 独角兽里程碑。一个反向事件锚定了 Aalyria 的起源故事：Alphabet 于
              January 2021 关闭 Project Loon，把 Spacetime 和 Tightbeam 技术栈从 Alphabet 所有的登月项目中释放出来，由此催化剥离并创造商业机会。Telesat 通过
              CEO Dan Goldberg 的公开表态确认其承诺：Spacetime 的动态路由、频谱感知资源管理和链路预测已集成进 Telesat Lightspeed 的系统设计。
