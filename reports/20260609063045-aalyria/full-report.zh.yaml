      - number: '1.3'
        title: 融资历史与投资方
        blocks:
          - type: paragraph
            body: >-
              Aalyria 最早的融资来自 Defense Innovation Unit 于 July 2022 授予的其他交易（OT）合同，金额 $8.7 million；该合同属于 Hybrid Space
              Architecture（HSA）项目，并与 U.S. Space Force 的 Space Warfighting Analysis Center 和 AFRL 协作。September 2022
              公开亮相前后，早期机构股权投资方包括 Accel 联合创始人 Arthur Patterson、J2 Ventures（既是早期支持者，也是后续 Series B 领投方）和 Housatonic
              Partners。Series B 前的具体股权融资额未单独披露，但 CEO Taylor 在 Series B 后对 SpaceNews 表示累计融资为 $135 million，据此可估算约为 $30–35
              million（意味着 Series B 前约 $35 million）。Off Earth Data 的投资者简报称累计融资 $130 million，差额 $5 million，可能来自时间点或四舍五入差异。

              February 23, 2026，Aalyria 以 $1.3 billion 投后估值完成 $100 million Series B 融资。本轮由 Battery Ventures（普通合伙人、新任
              Aalyria 董事 Michael Brown 代表）和 J2 Ventures（管理合伙人 Alex Harstrick 代表）共同领投。DYNE Ventures
              作为跟投老股东参与，另有其他未披露投资者。Alphabet/Google 因 2022 年剥离保留未披露少数股权。Berenson and Company, LLC 担任 Aalyria Series B
              的独家财务顾问。收入、ARR、毛利率、净收入留存率，以及任何债务或信贷额度细节均未公开披露。公开来源未显示二级交易、要约收购或结构化股权交易。Series B 募资将用于把员工数加速扩大约三分之一、扩大
              Spacetime 在商业 LEO 星座上的部署，并在加州 Livermore 总部设施扩大 Tightbeam 终端制造。
