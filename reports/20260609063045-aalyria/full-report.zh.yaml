            body: >-
              最清晰的融资信号是 Aalyria 的 February 2026 Series B：$100 million、投后估值 $1.3 billion，由 Battery Ventures 和 J2 Ventures
              领投，DYNE 参与，Google 保留少数股权。公开报道还指向约 $135 million 累计融资，意味着 Series B 前融资约 $35 million，尽管种子轮和 Series A
              的拆分未独立列明。管理层表示，新资金将加速 Spacetime 部署、扩大 Tightbeam
              制造，并在工程和销售岗位招聘。对于一家同时扩展软件和硬件的公司，这些资本用途合理，但也意味着随着制造、支持和业务开发能力扩张，烧钱速度可能上升。Aalyria
              未披露账面现金、债务或受限资本，因此现金跑道只能近似估算。使用基于员工数的运营开支代理，单是 $100 million 融资就能在没有任何收入贡献的情况下支持约 54-89
              个月烧钱，但这只是分析上限，不是银行余额事实。真实现金跑道取决于毛利、回款、营运资本，以及 Tightbeam 扩产的激进程度。
