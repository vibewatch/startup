      - number: '7.4'
        title: 治理、披露与估值风险
        blocks:
          - type: paragraph
            body: >-
              公开信息不足本身就是风险。Aalyria 披露了估值、融资和头部伙伴，但没有披露收入、积压订单、烧钱速度、毛利率或各项目合同金额，因此很难判断 $1.3 billion
              价格反映的是耐久经济性，还是未来采用的期权价值。披露缺口尤其重要，因为伙伴名单足够广，可能产生光环效应，从而夸大当前商业牵引。公开传播最充分的耐久条款是 Telesat 的 10+
              年协议；另外几个大名号则绑定在试点、研究、政府订单或标准项目上，没有披露经常性收入贡献。治理可见度也有限：Series B 公告确认 Battery 新增一个董事席位，并提到 Alphabet
              保留持股，但公开材料没有说明独立董事构成、委员会结构或内控成熟度。关键人暴露仍有意义，因为 Chris Taylor 和 Brian Barritt
              同时支撑商业、政府和架构可信度，而公司又在尝试同时扩张软件、硬件和国际运营。简言之，这里的估值风险更多来自雄心勃勃的「网络之网络」定位与可用于承销的硬运营数据之间的缺口，而不是已经被识别的丑闻。
