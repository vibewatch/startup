        title: 垂直集成商与多轨道运营商
        blocks:
          - type: paragraph
            body: >-
              最危险的商业竞争者是那些已经拥有轨道资产、终端客户和服务打包能力的公司。即便没有完美的公开逐项对比，Starlink 仍是最清晰的威胁，因为封闭栈可以完全消除第三方编排需求。CNBC 早期关于 Aalyria
              的报道把公司定位为 Starlink 式网络的替代方案，MILNET 争论也显示单一供应商架构仍是现实选项。Eutelsat/OneWeb 和 SES
              是不同类型的威胁。它们不是靠纯软件中立性竞争，而是靠既有分销、托管服务打包，以及自行整合多个轨道层的能力竞争。Iridium
              作为直接编排竞争者的重要性较低，更像是买方的替代选择：这些买方更看重经过验证的全球覆盖和可信服务交付，而不是开放多运营商路由。三类案例给出的教训相同：Aalyria 面对的运营商能够把编排捆绑进更广泛的服务关系。
