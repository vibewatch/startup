      - number: '7.3'
        title: 依赖、集中与采购风险
        blocks:
          - type: paragraph
            body: >-
              Aalyria 当前证据集中在少数交易对手身上，而这些对手的时间表和资本计划不受 Aalyria 控制。Telesat 是披露中最强的商业承诺，但其星座时间表仍决定旗舰 Spacetime
              部署何时可见。Rivada 提供了多元化，但公开证据仍是一项围绕规划星座的选择公告，而不是已披露的经常性收入流。政府侧，DIU、AFRL、NASA 以及更广泛的 MILNET / PWSA
              争论都帮助验证相关性，但也暴露了长周期采购现实：试点成功、研究授标和小额采购订单，可能领先规模化收入数年。SpaceX 仍是结构性外部变量：Aalyria 无法强迫 Starlink 分享遥测数据；如果
              Pentagon 转向以 Starshield 为重心的架构，多运营商控制平面逻辑就会被削弱。同样的依赖逻辑也适用于源自 LLNL 的 Tightbeam IP、Alphabet 的剩余持股和剥离历史，以及
              3GPP、O-RAN 等标准组织。因此，投资人应少把 Aalyria 视为多元化装机基础，多把它视为一组高度集中的期权式项目组合；这些项目能否转化为耐久收入，仍在被证明。
