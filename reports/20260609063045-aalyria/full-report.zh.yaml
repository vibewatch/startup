      - number: '5.3'
        title: Tightbeam 硬件及其与 Spacetime 的耦合
        blocks:
          - type: paragraph
            body: >-
              Tightbeam 是 Aalyria 技术栈中物理差异化更强的一部分，也是公开证据缺口最大的一部分。Aalyria 自有产品面明确披露了若干顶层细节：当前大气产品系列呈现为 T170x 和 G170x
              终端，采用 170 mm 口径，最高 100 Gbps，并已演示接近 200 km 的地对空链路。公司还表示当前产品线服务陆地和空中应用，海上和太空应用仍为“即将推出”。这些披露足以把 Tightbeam
              视为真实的大气光终端产品，而不是纯投机的未来项目。集成逻辑也很清楚。Tightbeam 被描述为即插即用、原生集成 Spacetime；公开合作伙伴叙事也强化了 Aalyria 正试图在共同编排框架中管理 RF
              和光链路。产品含义是，Tightbeam 不只是作为独立管道出售；它意在成为另一种定向传输原语，由 Spacetime
              围绕天气、运动和任务优先级进行调度。风险在于，公开硬件尽调停在接近营销边界的位置。已审阅来源没有披露现场 MTBF、环境认证、终端良率、制造吞吐，或可用于太空环境的终端设计。独立技术文献和 NASA
              指引一致认为，大气光链路对指向精度、湍流和云层高度敏感。这并不推翻 Tightbeam
              的公开主张，但意味着大气版本应被视为可信却只得到部分佐证；已宣布的未来地对太空和太空对太空版本仍是路线图项目，而不是独立验证过的产品。
            claimRefs:
              - CE007
              - CE008
              - CE030
              - CE031
              - CE033
