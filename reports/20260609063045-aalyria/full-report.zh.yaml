  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与市场覆盖
        blocks:
          - type: paragraph
            body: >-
              Aalyria 面向两类核心客户：政府（国防和民用航天）与商业客户（卫星运营商和 5G NTN 集成商）。政府板块包括 U.S. Defense Innovation Unit（DIU）、Air Force
              Research Laboratory（AFRL）、NASA、European Space Agency（ESA），以及 2026 年 2 月 Series B 新闻稿中提到的未具名盟国政府伙伴。商业板块包括
              Telesat（Lightspeed LEO 星座）、Rivada Space Networks（规划 600 颗卫星的 LEO）、Airbus（SpaceRAN 5G NTN
              演示）、ALL.SPACE、Google Public Sector、Keysight Technologies（5G NTN 验证 MOU）和 Logos Space。Spacetime
              软件的买方通常是卫星星座运营商或国防机构的网络运营组织 / CTO 组织。Tightbeam 硬件的买方则是航空航天主承包商或国防项目办公室的采购职能。客户焦点明确呈双模态：2026 年 2 月
              BusinessWire 新闻稿同时确认了「商业和政府客户」。考虑到公司约 90
              人的规模，且没有披露活跃客户数，客户群仍处于早期到中期采用阶段——公司已经验证了足够多的大名号关系来支撑市场逻辑，但大规模生产收入尚未公开证明。卫星通信市场（包含 Aalyria 商业 TAM 的大部分）2024
              年全球规模为 $90.3 billion，据 Grand View Research 预计 CAGR 为 10.2%；Novaspace 称 2025 年政府太空支出达到 $138
              billion，凸显可服务机会的规模。
