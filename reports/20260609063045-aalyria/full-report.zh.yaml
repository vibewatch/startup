      - number: '5.4'
        title: 标准、互操作性与部署证据
        blocks:
          - type: paragraph
            body: >-
              Aalyria 最强的产品技术证据，来自 Spacetime 多次出现在其他机构架构中。ESA 项目页尤其有价值，因为它超越口号：其目标是一套商业级 5G/6G NTN 编排和 SMO 层，跨越 GEO 与
              NGSO 系统，包括经星间链路路由的拓扑；工作还明确包括修改 O-RAN 接口，再把这些变化集成进 Spacetime。ESA 也表示，当前标准支持动态可转向波束拓扑，但要与 O-RAN
              管理接口对齐仍需大量工作——这既是验证，也是警告。Keysight 的合作把路线图转化为测试问题：将 Spacetime 与 RICtest 配对，用于基准测试频谱、功率、波束、移动性和 O-RAN/3GPP
              NTN 行为。Telesat 和 Rivada 展示了互操作性的另一面：Telesat 在带有光 ISL 和星上处理的特定 LEO 架构中使用 Spacetime；Rivada 则称 Spacetime
              将编排网关轻量化的光网状网络，配合再生载荷和跳波束。ALL.SPACE 增加了终端侧互操作故事，把 Hydra 多链路终端与 Spacetime
              结合，用于跨多个轨道和地面系统的故障切换。政府证据推动同一主题。DIU 早期选择 Aalyria 参与 Hybrid Space Architecture 工作；AFRL SDNX
              正在评估跨政府、商业和盟友卫星的任务可定制网络；NASA 的 PExT 工作把 Spacetime
              放进企业服务运营，而该任务已经演示跨政府与商业网络的切换。净效果不是证明每个接口都已生产级硬化，而是有意义地证明外部机构把 Spacetime 视为集成层，而不是一次性演示工具。
