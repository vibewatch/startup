      - number: '8.3'
        title: 不依赖隐藏指标的情景逻辑
        blocks:
          - type: paragraph
            body: >-
              公开来源没有披露 Aalyria 的收入基数，因此情景框架应由里程碑驱动，而不是由表格模型驱动。上行情景是软件式结果：Spacetime 成为多个运营商使用的控制平面层，Telesat Lightspeed
              从架构选择转化为实时流量，政府买方继续偏好多供应商互操作。在那个世界里，当前轮次事后看可能合理，甚至相对未来战略价值偏便宜。基准情景更窄：技术可信度仍然真实，但商业证据集中在一两个旗舰关系上，投资人仍看不清经常性经济性。这会让当前价格显得偏高但尚可承受。下行情景不需要技术失败；只需要项目延期、MILNET
              集中化，或出现 Tightbeam 规模化需要大量资本的证据。本章中的反向来源重要，是因为它们显示，当规划产能、资金或政府架构假设变化时，板块叙事可以很快压缩。
