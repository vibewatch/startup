  - id: FV003
    title: 估值 / 回报区间（USD billions）
    type: range
    layout: standard
    summary: 这里给的是基于里程碑的估值走廊，不是对未披露指标的预测。
    data:
      items:
        - id: r1
          label: 下行情景 / 硬件项目拖累
          low: 0.1
          high: 0.5
          mid: 0.3
        - id: r2
          label: 证据加权的合理区间
          low: 0.8
          high: 1.6
          mid: 1.2
        - id: r3
          label: 上行情景 / 软件控制平面假设
          low: 2
          high: 5
          mid: 3.2
        - id: r4
          label: 当前轮次锚点
          low: 1.3
          high: 1.3
          mid: 1.3
    approximationNotes: 这些区间是分析师根据已披露融资轮、公开可比公司市值和里程碑逻辑推导出的估值走廊；不是收入或利润率预测。
    claimRefs:
      - CV023
      - CV025
      - CV027
      - CV033
      - CV034
      - CV036
      - CV044
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: standard
    summary: 仅用公开证据，对证据、透明度和估值支撑做 IC 风格评分。
    data:
      items:
        - id: k1
          label: 技术 / 合作伙伴证据
          value: 8/10
          detail: 融资轮、Telesat、DIU 和 ESA 证据都真实可见
        - id: k2
          label: 变现证据
          value: 2/10
          detail: 公开经济性仍大多未披露
        - id: k3
          label: 软件上行可信度
          value: 7/10
          detail: 如果 Spacetime 成为控制平面基础设施，就有资格获得溢价估值
        - id: k4
          label: 硬件拖累风险
          value: 3/10
          detail: Tightbeam 有上行空间，但公开放量证据偏薄
        - id: k5
          label: 政府依赖风险
          value: 4/10
          detail: MILNET 架构和项目节奏仍然举足轻重
        - id: k6
          label: 可比公司支撑
          value: 5/10
          detail: 估值走廊只能支撑可行性，不能说明便宜
        - id: k7
          label: 尽调准备度
          value: 3/10
          detail: 关键经济性和 IP 问题仍需私下尽调
    claimRefs:
      - CV007
      - CV029
      - CV035
      - CV037
      - CV038
      - CV043
