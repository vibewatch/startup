      - number: '1.2'
        title: 创始团队与领导层
        blocks:
          - type: paragraph
            body: >-
              Aalyria 由 Chris Taylor（CEO）和 Brian Barritt（CTO）共同创立。Taylor 具备国家安全背景，此前曾领导服务美国政府的公司。CNBC 在 September 2022
              公司公开亮相时引用的 Taylor LinkedIn 资料显示，他于 November 2021 创立一家隐身公司——这是隐身阶段起点的一手记录。Taylor 将 Aalyria
              的使命表述为构建“数字软骨”，把数以千计的独立卫星、飞机、船舶、光纤和地面站连接成一个单一智能网络，使其能够绕开故障、按任务优先级优化，并实时适应。

              CTO、联合创始人 Brian Barritt 在 Google 的 Project Loon 期间打造了 Spacetime；Project Loon 是 Alphabet
              通过高空气球提供全球互联网连接的项目。OneWeb 创始人 Greg Wyler 在 Google 任职期间也参与过 Spacetime 开发。不同公开来源显示，Barritt 同时拥有联合创始人和执行副总裁 /
              CTO 头衔。Series B 完成后，Battery Ventures 普通合伙人、前 Defense Innovation Unit 负责人 Michael Brown 加入 Aalyria
              董事会，直接带来国防采购可信度。Alex Harstrick 是 J2 Ventures（专注国家安全的 VC）的管理合伙人，也以顾问和投资人身份担任 Series B 共同领投方。

              Google Chief Internet Evangelist、TCP/IP 和互联网基础协议共同创造者 Vint Cerf 担任 Aalyria
              顾问委员会成员，为公司提供扎根互联网架构史的技术背书。Aalyria 的领导层有意服务其商业与国防双重客户基础：国家安全背景的 CEO、掌握原始 IP 血统的深科技 CTO、具备前 DIU
              领导经验的董事，以及担任顾问的技术先驱。公开来源未报道重大领导层变动或高管离职。由于 Taylor 和 Barritt 都直接连接构成 Aalyria 竞争基础的 Google IP 血统，而创始联席 CEO
              之外的高管梯队尚未公开详述，关键人物风险偏高。
