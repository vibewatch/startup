- id: retention-durability
  title: Retention, Durability, and Customer Satisfaction
  body: "No NRR, GRR, churn, or renewal data for Aalyria's Spacetime customers has been publicly disclosed, which is consistent
    with the company's private stage and predominantly government contract structure where retention is governed by contract
    renewal rather than subscription churn metrics. Government contracts (DIU, AFRL, ESA) are multi-year program agreements
    with structured renewal gates, not month-to-month subscriptions, suggesting structural retention through contract lifecycle
    but making commercial NRR metrics irrelevant comparators. The most durable evidence of customer stickiness is the progression
    from the $8.7M DIU HSA prototype contract (demonstrated December 2023) to the AFRL SDNX follow-on contract (January 2026),
    which implies continued government investment rather than a one-off pilot. Telesat's integration commitment is architecturally
    deep: Spacetime is described as being integrated \"with our system design\" rather than layered on as an optional service,
    suggesting switching costs would be high once the Lightspeed constellation is deployed on the platform. The Satellite
    Industry Association's State of the Satellite Industry report confirms sustained and growing government investment in
    satellite communications infrastructure, providing a macro tailwind supporting contract renewal probability. No public
    complaint, lawsuit, contract termination, or customer defection for Aalyria has been documented, but the limited deployment
    history (most partnerships are less than three years old) means meaningful retention data is structurally unavailable
    rather than merely undisclosed."
  claimRefs:
  - CU011
  - CU012
  - CU013
  tableRefs:
  - TU004
  figureRefs:
  - FU003
- id: concentration-expansion
  title: Expansion Dynamics and Concentration Risk
  body: "Aalyria faces significant concentration risk from its heavy reliance on U.S. government customers for early-stage
    revenue validation. The MILNET program—the Space Force's proposed $4 billion+ proliferated LEO constellation—is the most
    acute government concentration threat: if the DoD consolidates its PLEO strategy around SpaceX's Starshield technology
    stack, the entire multi-vendor orchestration value proposition that Spacetime embodies becomes strategically less important
    for the government's largest procurement programs. The Space Force noted it is conducting an Analysis of Alternatives
    and that multi-vendor optical crosslink interoperability remains under evaluation, preserving Spacetime's opportunity
    if multi-vendor outcomes prevail. Commercial expansion depends on constellation deployments: Spacetime's revenue scales
    as operator networks grow in satellite count and cross-orbit complexity. Telesat Lightspeed (156 satellites, Ka-band +
    Mil-Ka) and Rivada (600+ planned LEO) represent significant expansion potential if they proceed on schedule. The ESA/European
    HQ establishment opens a second government market, reducing U.S.-only concentration. Keysight's 5G NTN MOU and the Airbus
    SpaceRAN project open the telecom operator segment, which represents a structurally large expansion surface. However,
    Rivada's financial health and constellation deployment timeline are uncertain, and Telesat Lightspeed has experienced
    prior financing delays that could push the first operational Spacetime revenue recognition into 2027 or later. No NRR,
    expansion ARR, or land-and-expand data is available to quantify the expansion engine's historical productivity."
  claimRefs:
  - CU014
  - CU015
  - CU016
  - CU017
  - CU018
