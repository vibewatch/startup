callouts:
- calloutType: strength
  title: Government Proof Points Span DIU, AFRL, NASA, and ESA
  body: Four distinct government agencies (DIU, AFRL, NASA, ESA) and the UK Space Agency have active contracts or 
    collaborations with Aalyria—a breadth of institutional validation that is rare for a 4-year-old, 90-person company. 
    The DIU-to-AFRL contract progression implies government confidence in Spacetime beyond a single pilot cycle. Telesat
    CEO's architectural commitment adds a tier-1 commercial anchor. Collectively these relationships substantiate the 
    platform's government readiness better than most Series B companies can demonstrate.
  claimRefs:
  - CU005
  - CU007
  - CU008
  - CU009
- calloutType: risk
  title: No Disclosed Production Revenue and Heavy Government Concentration
  body: No customer has publicly confirmed active production revenue from Aalyria's products. The commercial segment 
    (Telesat Lightspeed as anchor) is pre-production scale. Government contracts constitute the primary revenue 
    validation, creating significant concentration risk. The MILNET program's potential consolidation around SpaceX 
    could materially reduce the government multi-vendor orchestration opportunity. These two factors combined mean the 
    revenue thesis remains largely unvalidated by public evidence as of mid-2026.
  claimRefs:
  - CU014
  - CU015
  - CU018
