company:
  name: Aalyria
chapter:
  number: 6
  title: Customers
  summary: Aalyria's validated customer base spans U.S. and allied government agencies (DIU, AFRL, NASA, ESA) and a 
    small number of flagship commercial satellite operators (Telesat Lightspeed, Rivada Space Networks), with additional
    partnerships at Airbus, ALL.SPACE, and Google Public Sector. The government segment provides the clearest production
    proof through documented contracts ($8.7M DIU, undisclosed AFRL SDNX), while the commercial segment is pre-revenue 
    at scale—Telesat Lightspeed is the first announced production integration but the constellation is not yet fully 
    operational. Retention and NRR metrics are undisclosed; the single most material risk is government customer 
    concentration combined with the MILNET program uncertainty that could redirect DoD satellite spending toward a 
    SpaceX-centric stack.
sections:
- id: customer-base-segmentation
  title: Customer Base Segmentation and Market Coverage
  body: "Aalyria addresses two primary customer segments: government (defense and civil space) and commercial (satellite operators
    and 5G NTN integrators). The government segment encompasses U.S. Defense Innovation Unit (DIU), Air Force Research Laboratory
    (AFRL), NASA, the European Space Agency (ESA), and unnamed allied government partners mentioned in the February 2026 Series
    B press release. The commercial segment includes Telesat (Lightspeed LEO constellation), Rivada Space Networks (planned
    600-satellite LEO), Airbus (SpaceRAN 5G NTN demonstrator), ALL.SPACE, Google Public Sector, Keysight Technologies (5G
    NTN validation MOU), and Logos Space. The buyer profile for Spacetime software is the network operations or CTO organization
    at a satellite constellation operator or defense agency. The buyer profile for Tightbeam hardware is the procurement function
    at an aerospace prime contractor or defense program office. The customer focus is explicitly bi-modal: the February 2026
    BusinessWire press release confirms both \"commercial and government customers.\" Given the company's roughly 90-person
    scale and the absence of any disclosed active-customer count, the customer base is still in the early-to-mid-stage adoption
    phase—the company has validated enough large-name relationships to substantiate the market thesis, but production revenue
    at scale has not been publicly demonstrated. The satcom market (which contains most of Aalyria's commercial TAM) was $90.3
    billion globally in 2024 growing at 10.2% CAGR per Grand View Research, and government space spending reached $138 billion
    in 2025 per Novaspace, underscoring the scale of the addressable opportunity."
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: customer-adoption-trajectory
  title: Adoption Trajectory and Deployment Evidence
  body: Aalyria's most substantiated government proof point is the December 2023 NRL demonstration where Spacetime 
    managed a 630-satellite mesh network across three commercial operators with four terminal types and four ground 
    sites on two continents, attended by more than 150 U.S. government and defense officials. This demonstration was 
    funded under the $8.7 million DIU Hybrid Space Architecture contract. The AFRL Space Data Network Experimentation 
    (SDNX) contract announced January 2026 represents the next government deployment milestone, extending Spacetime 
    validation into the Air Force's programmatic satellite data network development. On the commercial side, the most 
    significant milestone is Telesat's commitment to integrate Spacetime into the Lightspeed LEO constellation 
    architecture; Telesat CEO Dan Goldberg publicly confirmed this integration in the February 2026 Series B press 
    release. Rivada Space Networks selected Spacetime in March 2023 for its planned 600-satellite constellation, though 
    Rivada's deployment timeline has faced delays. Airbus's SpaceRAN project deploys Spacetime in a 5G NTN demonstrator,
    providing European commercial market validation. The ESA contract (December 2023), funded by the UK Space Agency, 
    represents Aalyria's first publicly announced non-U.S. government institutional customer. NASA's collaboration 
    focuses on improving Earth Observation data delivery efficiency. All.Space is listed as a partner in the Series B 
    announcement. Collectively, the disclosed customer and partner roster confirms 10+ named entities across four 
    segments (DoD, civil space, LEO operators, 5G NTN integrators), but no customer has disclosed active production 
    revenue, making the commercial traction phase difficult to size precisely.
  claimRefs:
  - CU005
