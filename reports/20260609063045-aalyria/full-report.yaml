        title: Mitigation, Monitoring Indicators, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The most important diligence discipline is to distinguish validated deployment from validated revenue.
              Investors should monitor whether MILNET stays explicitly multi-vendor, whether Telesat and Rivada hit
              launch and financing milestones, whether Aalyria publishes any evidence of scaled Tightbeam manufacturing
              or security accreditation, and whether public contracts migrate from studies and purchase orders into
              recurring production programs. The mitigating case is real: Aalyria has attracted serious counterparties,
              Telesat's agreement is unusually concrete, ESA is using the company in standards-related work, and the
              firm has not surfaced as a public legal or regulatory problem. But those mitigants only matter if they
              convert into repeatable economics and broader interoperability acceptance. Near-term kill criteria should
              therefore focus on architecture decisions, partner delays, and disclosure: a Starshield-dominant MILNET
              outcome, further slippage by anchor operators, failure to show manufacturing readiness, or persistent
