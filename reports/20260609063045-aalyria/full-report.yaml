  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Market Coverage
        blocks:
          - type: paragraph
            body: >-
              Aalyria addresses two primary customer segments: government (defense and civil space) and commercial
              (satellite operators and 5G NTN integrators). The government segment encompasses U.S. Defense Innovation
              Unit (DIU), Air Force Research Laboratory (AFRL), NASA, the European Space Agency (ESA), and unnamed
              allied government partners mentioned in the February 2026 Series B press release. The commercial segment
              includes Telesat (Lightspeed LEO constellation), Rivada Space Networks (planned 600-satellite LEO), Airbus
              (SpaceRAN 5G NTN demonstrator), ALL.SPACE, Google Public Sector, Keysight Technologies (5G NTN validation
              MOU), and Logos Space. The buyer profile for Spacetime software is the network operations or CTO
              organization at a satellite constellation operator or defense agency. The buyer profile for Tightbeam
              hardware is the procurement function at an aerospace prime contractor or defense program office. The
              customer focus is explicitly bi-modal: the February 2026 BusinessWire press release confirms both
              "commercial and government customers." Given the company's roughly 90-person scale and the absence of any
              disclosed active-customer count, the customer base is still in the early-to-mid-stage adoption phase—the
              company has validated enough large-name relationships to substantiate the market thesis, but production
              revenue at scale has not been publicly demonstrated. The satcom market (which contains most of Aalyria's
              commercial TAM) was $90.3 billion globally in 2024 growing at 10.2% CAGR per Grand View Research, and
              government space spending reached $138 billion in 2025 per Novaspace, underscoring the scale of the
              addressable opportunity.
