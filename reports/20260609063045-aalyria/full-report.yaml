  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product boundary and portfolio map
        blocks:
          - type: paragraph
            body: >-
              Aalyria’s public product surface is unusually coherent for a young space infrastructure company: the
              company is not selling a generic satcom stack, but a two-part architecture built around Spacetime software
              and Tightbeam optical terminals. Company materials consistently frame the core problem as directional
              networking rather than raw bandwidth. In Aalyria’s telling, narrow beams across satellites, aircraft,
              ships, fiber, and ground assets can deliver more secure and higher-capacity links than broadcast RF, but
              motion, terrain, and weather make those links operationally fragile. That framing matters because it
              explains why the company couples orchestration and transport rather than presenting them as unrelated
              businesses. Public product evidence supports that split. The homepage and February 2026 financing release
              describe Spacetime as the control plane that plans, schedules, and reroutes across dynamic networks in
              motion, while Tightbeam is the atmospheric laser terminal family providing high-capacity point-to-point
              links. The independently corroborated part of the story is stronger on the software side: partner
              announcements from Telesat, Rivada, ESA, Keysight, NASA, and ALL.SPACE all describe Spacetime in
              deployment or testbed terms. Tightbeam is more concrete than a concept slide because Aalyria publishes
              named form factors and top-line atmospheric performance claims, but the public record is thinner on
              production scale, qualification, and customer-operated field data. The right interpretation is therefore
              not “marketing-only,” but also not “fully disclosed deep-tech stack.” Spacetime looks like a commercially
              oriented orchestration layer with real external design-ins; Tightbeam looks like a technically credible
              optical product whose public diligence file still has major blind spots.
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE008
              - CE038
