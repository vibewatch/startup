            body: >-
              Because public sources do not disclose Aalyria’s revenue base, the scenario frame should be
              milestone-driven rather than spreadsheet-driven. The upside case is a software-style outcome: Spacetime
              becomes a control-plane layer used by multiple operators, Telesat Lightspeed converts from architecture
              selection into live traffic, and government buyers continue to favor multi-vendor interoperability. In
              that world, the current round could look fair in hindsight or even cheap relative to future strategic
              value. The base case is narrower: technical credibility remains real, but commercial proof stays
              concentrated in one or two flagship relationships and investors still cannot see recurring economics
              clearly. That leaves the current price looking stretched but survivable. The downside case does not
              require a technology failure; it only requires program delay, MILNET centralization, or evidence that
              Tightbeam is capital-intensive to scale. The adverse sources in this chapter matter because they show how
