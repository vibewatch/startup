      - number: '3.5'
        title: Adverse and Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              The adverse case is straightforward. If the market converges on vertically integrated operators, the
              orchestration-middleware category gets much smaller. Starlink is the proof that one company can own
              manufacturing, software, terminals, and service delivery; Project Kuiper is the likely next version of
              that model. The political version of the same risk appears inside MILNET, where vendor-lock concern
              supports Aalyria's openness thesis but also raises the bar for demonstrating real multi-vendor
              interoperability at operational scale. A second displacement path comes from incumbents and primes
              building service fabrics themselves, as Eutelsat/OneWeb, SES Open Orbits, Northrop, Viasat, and CACI all
              suggest. A third path comes from adjacent entrants such as CesiumAstro, which is embedding AI and signal
              analysis directly into communications payloads. Aalyria therefore does not merely need more customers; it
              needs proof that neutral orchestration remains a durable buying category rather than a temporary
              integration bridge.
