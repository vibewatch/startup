      - number: '3.4'
        title: Moat and Differentiation Durability
        blocks:
          - type: paragraph
            body: >-
              Aalyria's moat is real, but it is narrower than the company's most ambitious narrative suggests. The
              strongest element is neutrality validated by named operator proof: Telesat, Rivada, ESA, and DIU all point
              toward a cross-network control layer rather than a captive constellation stack. The second element is
              technical depth around directional networking and free-space optics, reinforced by LLNL-origin Tightbeam
              IP. The third element is ecosystem positioning, where Keysight and defense experimentation support the
              idea that Aalyria wants to become part of the interface layer for 5G NTN and hybrid-space architectures.
              The durability question is whether those advantages become embedded before bigger players absorb them.
              Aalyria owns zero constellations and relatively little direct distribution, so its switching cost has to
              come from architecture, APIs, and operator workflows rather than from captive demand. That is a defendable
              moat, but not an unassailable one.
