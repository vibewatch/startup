      - number: '6.2'
        title: Adoption Trajectory and Deployment Evidence
        blocks:
          - type: paragraph
            body: >-
              Aalyria's most substantiated government proof point is the December 2023 NRL demonstration where Spacetime
              managed a 630-satellite mesh network across three commercial operators with four terminal types and four
              ground sites on two continents, attended by more than 150 U.S. government and defense officials. This
              demonstration was funded under the $8.7 million DIU Hybrid Space Architecture contract. The AFRL Space
              Data Network Experimentation (SDNX) contract announced January 2026 represents the next government
              deployment milestone, extending Spacetime validation into the Air Force's programmatic satellite data
              network development. On the commercial side, the most significant milestone is Telesat's commitment to
              integrate Spacetime into the Lightspeed LEO constellation architecture; Telesat CEO Dan Goldberg publicly
              confirmed this integration in the February 2026 Series B press release. Rivada Space Networks selected
              Spacetime in March 2023 for its planned 600-satellite constellation, though Rivada's deployment timeline
              has faced delays. Airbus's SpaceRAN project deploys Spacetime in a 5G NTN demonstrator, providing European
              commercial market validation. The ESA contract (December 2023), funded by the UK Space Agency, represents
              Aalyria's first publicly announced non-U.S. government institutional customer. NASA's collaboration
              focuses on improving Earth Observation data delivery efficiency. All.Space is listed as a partner in the
              Series B announcement. Collectively, the disclosed customer and partner roster confirms 10+ named entities
              across four segments (DoD, civil space, LEO operators, 5G NTN integrators), but no customer has disclosed
              active production revenue, making the commercial traction phase difficult to size precisely.
