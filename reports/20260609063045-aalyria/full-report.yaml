      - number: '6.4'
        title: Expansion Dynamics and Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              Aalyria faces significant concentration risk from its heavy reliance on U.S. government customers for
              early-stage revenue validation. The MILNET program—the Space Force's proposed $4 billion+ proliferated LEO
              constellation—is the most acute government concentration threat: if the DoD consolidates its PLEO strategy
              around SpaceX's Starshield technology stack, the entire multi-vendor orchestration value proposition that
              Spacetime embodies becomes strategically less important for the government's largest procurement programs.
              The Space Force noted it is conducting an Analysis of Alternatives and that multi-vendor optical crosslink
              interoperability remains under evaluation, preserving Spacetime's opportunity if multi-vendor outcomes
              prevail. Commercial expansion depends on constellation deployments: Spacetime's revenue scales as operator
              networks grow in satellite count and cross-orbit complexity. Telesat Lightspeed (156 satellites, Ka-band +
              Mil-Ka) and Rivada (600+ planned LEO) represent significant expansion potential if they proceed on
              schedule. The ESA/European HQ establishment opens a second government market, reducing U.S.-only
              concentration. Keysight's 5G NTN MOU and the Airbus SpaceRAN project open the telecom operator segment,
              which represents a structurally large expansion surface. However, Rivada's financial health and
              constellation deployment timeline are uncertain, and Telesat Lightspeed has experienced prior financing
              delays that could push the first operational Spacetime revenue recognition into 2027 or later. No NRR,
              expansion ARR, or land-and-expand data is available to quantify the expansion engine's historical
              productivity.
