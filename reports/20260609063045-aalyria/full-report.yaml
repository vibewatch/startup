      - number: '5.2'
        title: Spacetime control plane, interfaces, and workflow logic
        blocks:
          - type: paragraph
            body: >-
              Spacetime’s public architecture is detailed enough to analyze in product terms. Aalyria’s homepage
              describes it as a single-tenant managed platform that customers can run in Aalyria-hosted or
              customer-hosted Kubernetes environments across commercial cloud, hybrid, on-premises, and classified
              air-gapped deployments. The public GitHub repository adds more technical specificity: Spacetime exposes a
              northbound interface for defining networks and service requests, a southbound interface for device
              interaction and metrics, and a federation or east-west API for exchanging network resources and
              interconnections between peer networks. That API surface is meaningful because it turns Spacetime from a
              closed operator-specific scheduler into a candidate interoperability layer. Partner evidence also
              clarifies the intended workflow. Telesat says Spacetime performs real-time analysis of millions of
              possible paths, continuously updates antenna scheduling and routing, and maintains a digital twin that
              models motion, weather, and atmospheric effects. Keysight’s 2025 collaboration frames the same product as
              an AI-powered NTN RAN Intelligent Controller that can optimize spectrum, beams, beam-hopping, and mobility
              in a testbed aligned to O-RAN and 3GPP NTN standards. Taken together, the public record points to a
              solver-driven control plane that ingests mission intent and network state northbound, computes pathing and
              resource decisions in a predictive model, then pushes instructions southbound to terminals and peer
              networks. What remains unclear is the exact boundary between customer code and Aalyria code, the internal
              solver architecture, and how much of the ‘AI’ label is classical optimization versus learned prediction.
              The API visibility improves technical credibility, but the closed internals mean diligence should still
              treat key performance claims as partly opaque.
            claimRefs:
