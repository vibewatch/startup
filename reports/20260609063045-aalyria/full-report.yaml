      - number: '6.3'
        title: Retention, Durability, and Customer Satisfaction
        blocks:
          - type: paragraph
            body: >-
              No NRR, GRR, churn, or renewal data for Aalyria's Spacetime customers has been publicly disclosed, which
              is consistent with the company's private stage and predominantly government contract structure where
              retention is governed by contract renewal rather than subscription churn metrics. Government contracts
              (DIU, AFRL, ESA) are multi-year program agreements with structured renewal gates, not month-to-month
              subscriptions, suggesting structural retention through contract lifecycle but making commercial NRR
              metrics irrelevant comparators. The most durable evidence of customer stickiness is the progression from
              the $8.7M DIU HSA prototype contract (demonstrated December 2023) to the AFRL SDNX follow-on contract
              (January 2026), which implies continued government investment rather than a one-off pilot. Telesat's
              integration commitment is architecturally deep: Spacetime is described as being integrated "with our
              system design" rather than layered on as an optional service, suggesting switching costs would be high
              once the Lightspeed constellation is deployed on the platform. The Satellite Industry Association's State
              of the Satellite Industry report confirms sustained and growing government investment in satellite
              communications infrastructure, providing a macro tailwind supporting contract renewal probability. No
              public complaint, lawsuit, contract termination, or customer defection for Aalyria has been documented,
              but the limited deployment history (most partnerships are less than three years old) means meaningful
              retention data is structurally unavailable rather than merely undisclosed.
