            body: >-
              The clearest financing signal is Aalyria's February 2026 Series B: $100 million at a $1.3 billion
              post-money valuation, led by Battery Ventures and J2 Ventures with DYNE participating, while Google
              retained a minority stake. Public reporting also points to roughly $135 million of total capital raised,
              which implies about $35 million of pre-Series-B funding even though the seed-versus-Series-A split is not
              independently itemized. Management said the new money will accelerate Spacetime deployments, expand
              Tightbeam manufacturing, and hire across engineering and sales. Those are sensible uses of capital for a
              company trying to scale both software and hardware, but they also imply that burn could rise as
              manufacturing, support, and business-development capacity expands. Aalyria does not disclose cash on hand,
              debt, or restricted capital, so runway can only be approximated. Using the headcount-based opex proxy, the
              $100 million raise alone would fund roughly 54-89 months of burn if revenue contributed nothing, but that
              is an analytical ceiling rather than a bank-balance fact. Real runway depends on gross profit,
              collections, working capital, and how aggressively Tightbeam ramps.
