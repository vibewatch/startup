      - number: '7.2'
        title: Technical and Category Risks
        blocks:
          - type: paragraph
            body: >-
              Aalyria's technical risk is partly company-specific and partly category-wide. Company-specific evidence
              supports that Spacetime has demonstrated routing and orchestration, but the strongest public references
              still describe studies, demonstrations, and integration projects rather than broad, scaled production
              operation across heterogeneous fleets. Tightbeam is even earlier from a public-proof standpoint: Aalyria
              says the terminals are proven, yet it does not disclose production volume, reliability, yield, or MTBF.
              The category evidence is also cautionary. ESA's 5G/6G NTN work with Aalyria says draft O-RAN interfaces
              still need modification and that industry-wide alignment takes significant time, while 3GPP's releases
              roadmap makes clear that NTN standards continue to evolve. DIU's Hybrid Space Architecture description
              stresses compatibility, common interfaces, zero-trust controls, and dynamic trust scoring across many
              participating networks, showing that interoperability and accreditation hurdles are system-level gates,
              not just software features. Tightbeam also inherits the broader free-space-optical risk set: atmospheric
              impairment, precision-optics supply bottlenecks, and the manufacturing/working-capital stress seen at
              optical-terminal peer Mynaric. These category signals do not prove an Aalyria failure, but they materially
              raise the bar for assuming fast adoption of optical and multi-domain orchestration.
