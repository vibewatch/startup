        title: Unit Economics and Cost Structure
        blocks:
          - type: paragraph
            body: >-
              Aalyria discloses no company-specific ARR, gross margin, CAC, payback, or net retention, so public unit
              economics must stay mostly qualitative or explicitly estimated. The most important structural point is
              that Spacetime and Tightbeam will not have the same economics. A mature orchestration-software layer could
              resemble enterprise infrastructure software with high gross margins and recurring renewal value, while
              Tightbeam introduces bill-of-materials costs, manufacturing overhead, inventory, qualification work, and
              field support that compress the blended profile. Government and constellation sales also look integration-
              heavy rather than transactional, which suggests long cycles, slower cash conversion, and more services
              content than a self-serve SaaS motion. The only public operating-scale proxy is headcount: around 90
              employees at the Series B, with management targeting roughly one-third more hiring. Applying a
              conservative fully loaded cost band of $150,000-$250,000 per employee yields an implied annual opex proxy
              of about $13.5 million-$22.5 million before any revenue offset. That is directionally useful, not a
              substitute for disclosed unit economics.
