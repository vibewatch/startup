      - number: '5.4'
        title: Standards, interoperability, and deployment evidence
        blocks:
          - type: paragraph
            body: >-
              Aalyria’s strongest product-tech evidence comes from how often Spacetime appears in other organizations’
              architectures. ESA’s project page is especially valuable because it goes beyond slogans: the stated
              objective is a commercial-grade 5G/6G NTN orchestration and SMO layer spanning GEO and NGSO systems,
              including inter-satellite-link-routed topologies, and the work explicitly includes modifying O-RAN
              interfaces before integrating those changes into Spacetime. ESA also says current standards support
              dynamic steerable-beam topologies but still require substantial work to align with O-RAN management
              interfaces, which is both validation and warning. Keysight’s collaboration turns that roadmap into a test
              problem by pairing Spacetime with RICtest to benchmark spectrum, power, beam, mobility, and O-RAN/3GPP NTN
              behavior. Telesat and Rivada show a different side of interoperability: Telesat is using Spacetime inside
              a specific LEO architecture with optical ISLs and onboard processing, while Rivada says Spacetime will
              orchestrate a gateway-light optical mesh with regenerative payload and beam hopping. ALL.SPACE adds a
              terminal-side interoperability story by combining Hydra multi-link terminals with Spacetime for failover
              across multiple orbits and terrestrial systems. Government evidence pushes the same theme. DIU selected
              Aalyria early for Hybrid Space Architecture work; AFRL SDNX is evaluating mission-tailorable networks
              across government, commercial, and allied satellites; NASA’s PExT work puts Spacetime into enterprise
              service operations for a mission that already demonstrates handoffs across government and commercial
              networks. The net effect is not proof that every interface is production-hardened, but it is meaningful
              proof that external institutions see Spacetime as an integration layer rather than a one-off demo tool.
