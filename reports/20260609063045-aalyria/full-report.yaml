  - id: FE003
    title: Critical dependency map for Aalyria product delivery
    type: dag
    layout: standard
    summary: >-
      Dependencies that public sources suggest must work for Aalyria to deliver its orchestration and optical value
      proposition.
    data:
      nodes:
        - id: d1
          label: Operator telemetry and control access
          detail: Spacetime needs enough observability and control surface from partner networks to orchestrate them.
        - id: d2
          label: Open APIs and integration tooling
          detail: GitHub-visible APIs, guides, and modeled hardware accelerate onboarding and federation.
        - id: d3
          label: O-RAN / 3GPP NTN evolution
          detail: Standards work shapes how cleanly Spacetime can plug into telecom-style NTN deployments.
        - id: d4
          label: Weather / propagation data
          detail: Predictive link management depends on current and forecast environmental information.
        - id: d5
          label: Precision optical hardware
          detail: Tightbeam and future space optical links depend on robust pointing, optics, and environmental tolerance.
        - id: d6
          label: Manufacturing and supplier base
          detail: Scaling terminals requires supply continuity, QA, and serial production capability.
        - id: d7
          label: Program and partner adoption
          detail: Design-ins at Telesat, Rivada, NASA, ESA, AFRL, and ALL.SPACE create the reference base for wider adoption.
        - id: d8
          label: Aalyria product stack
          detail: >-
            Spacetime plus Tightbeam become compelling only when integration, data access, and hardware execution all
            hold together.
      edges:
        - from: d1
          to: d8
          label: State access
        - from: d2
          to: d8
          label: Integration path
        - from: d3
          to: d8
          label: Interface alignment
        - from: d4
          to: d8
          label: Prediction input
        - from: d5
          to: d8
          label: Optical transport
        - from: d6
          to: d5
          label: Build quality / volume
        - from: d7
          to: d8
          label: Deployment proof
    approximationNotes: >-
      The dependency map reflects external dependencies visible in public sources. It does not imply these are Aalyria’s
      only dependencies or their internal prioritization.
    claimRefs:
      - CE003
      - CE019
      - CE024
      - CE030
      - CE035
      - CE036
      - CE042
  - id: FE004
    title: 'Public maturity comparison matrix: Spacetime versus Tightbeam'
    type: matrix
    layout: standard
    summary: Qualitative comparison of how much public evidence exists for the two main product layers.
    data:
      columns:
        - Spacetime public maturity
        - Tightbeam public maturity
        - Evidence basis
        - Primary gap
      rows:
        - label: Named external programs
          values:
            - High
            - Medium
            - >-
              Spacetime appears in many partner and government programs; Tightbeam is visible mostly as
              company-described hardware.
            - Tightbeam lacks public customer-operated deployment detail.
        - label: Open technical surface
          values:
            - High
            - Low
            - Spacetime has public APIs and docs on GitHub; Tightbeam has no comparable open technical package.
            - Hardware integration details remain largely closed.
        - label: Standards alignment
          values:
            - Medium-High
            - Low
            - >-
              ESA and Keysight connect Spacetime to O-RAN / 3GPP workflows; Tightbeam has no public standards alignment
              package.
            - No public optical-terminal compliance package for Tightbeam.
        - label: Atmospheric operational proof
          values:
            - Medium
            - Medium
            - >-
              Spacetime has partner references tied to weather-aware routing; Tightbeam has public headline tests but
              sparse field-detail evidence.
            - No public uptime or handoff statistics under real weather.
        - label: Space-segment readiness
          values:
            - Medium
            - Low
            - >-
              Spacetime is architecturally aimed at ISL-routed topologies; Tightbeam space products remain roadmap-stage
              in public evidence.
            - No public prototype or qualification path for space Tightbeam.
        - label: Reliability and production transparency
          values:
            - Medium
            - Low
            - >-
              Spacetime maturity is inferable from partner programs and Loon heritage; Tightbeam lacks public MTBF,
              qualification, and production-rate disclosures.
            - Hardware diligence remains incomplete.
    claimRefs:
      - CE013
      - CE017
      - CE021
      - CE033
      - CE040
      - CE041
