      - number: '3.2'
        title: Vertical Integrators and Multi-Orbit Operators
        blocks:
          - type: paragraph
            body: >-
              The most dangerous commercial rivals are the companies that already own orbital assets, end customers, and
              service packaging. Starlink is the clearest threat even without a perfect public apples-to-apples
              comparison, because a closed stack can remove the need for third-party orchestration entirely. CNBC's
              early Aalyria coverage framed the company as an alternative to Starlink-style networking, and the MILNET
              debate shows that single-provider architectures remain a live option. Eutelsat/OneWeb and SES are
              different threats. They do not compete through pure software neutrality; they compete through incumbent
              distribution, managed-service packaging, and the ability to integrate multiple orbital layers themselves.
              Iridium matters less as a direct orchestration rival and more as a substitute for buyers who value proven
              global coverage and trusted service delivery over open multi-operator routing. In all three cases, the
              lesson is the same: Aalyria faces operators that can bundle orchestration into a broader service
              relationship.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
