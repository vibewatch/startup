      - number: '1.2'
        title: Founding Team and Leadership
        blocks:
          - type: paragraph
            body: >-
              Aalyria was co-founded by Chris Taylor (CEO) and Brian Barritt (CTO). Taylor brings a national security
              background, having previously led companies serving the U.S. government. His LinkedIn profile, cited by
              CNBC at the September 2022 public launch, listed him as founding a company in stealth mode in November
              2021—providing primary documentation for the stealth-phase origin date. Taylor has framed Aalyria's
              mission as building "the digital cartilage that connects thousands of independent satellites, aircraft,
              ships, fiber, and ground stations into a single, intelligent network that can route around failures,
              optimize for mission priorities, and adapt in real-time."

              Brian Barritt, CTO and co-founder, built Spacetime at Google under Project Loon—Alphabet's initiative to
              provide global internet connectivity via high-altitude balloons. Greg Wyler, founder of OneWeb, also
              participated in Spacetime's development during his time at Google. Barritt holds the title of both
              co-founder and Executive Vice President/CTO per various public sources. Following the Series B, Michael
              Brown—General Partner at Battery Ventures and former Director of the Defense Innovation Unit—joined
              Aalyria's board, providing direct defense procurement credibility. Alex Harstrick, Managing Partner at J2
              Ventures (a national security-focused VC), also serves in an advisory and investor capacity as Series B
              co-lead.

              Vint Cerf, Google's Chief Internet Evangelist and co-creator of TCP/IP and the internet's foundational
              protocols, serves on Aalyria's board of advisors, providing technical credibility anchored in internet
              architecture history. The leadership structure is deliberately designed for Aalyria's dual
              commercial-defense customer base: a national security CEO, a deep-tech CTO with the original IP pedigree,
              a board member with former DIU leadership experience, and a technology pioneer as advisor. No material
              leadership changes or executive departures have been reported in public sources. Key-person risk is
              elevated given that both Taylor and Barritt have direct ties to the Google IP lineage that forms Aalyria's
              competitive foundation, and the executive bench beyond the founding co-CEOs has not been publicly
              detailed.
