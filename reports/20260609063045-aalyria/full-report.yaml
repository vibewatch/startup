  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Taxonomy
        blocks:
          - type: paragraph
            body: >-
              Aalyria's market boundary is the control-plane and directed-link layer of space networking, not the whole
              satellite economy. The company sells Spacetime, an orchestration platform for directional networks in
              motion, and Tightbeam, 100 Gbps free-space optical terminals. That means the included spend is network
              orchestration and control software, optical terminal hardware tied to managed directional links, military
              directed-network architectures, and commercial multi-orbit GEO+LEO or NGSO management. The right
              exclusions are raw bandwidth resale, vertically integrated consumer broadband services, satellite
              manufacturing, launch, and terrestrial-only wireless. ESA's satellite-for-5G and broader
              secure-connectivity work, plus MarketsandMarkets' NTN and automation categories, are better treated as
              adjacency because they shape interfaces, standards, and budgets without turning Aalyria into a full
              telecom-infrastructure vendor. The status-quo substitutes are proprietary operator control stacks, point
              solutions from primes, and manual mission-integration workflows. Aalyria's wedge is interoperability:
              company materials, DIU problem statements, and customer proof all center on making independently operated
              nodes coordinate across air, land, sea, and space.
