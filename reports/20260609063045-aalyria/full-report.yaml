  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Aalyria's competitive set is unusual because it is not trying to out-build a single rival constellation.
              Instead, it sits between operators, governments, primes, and terminal vendors as a neutral orchestration
              and directed-link layer. Public proof from Telesat, Rivada, DIU, and ESA shows that some buyers want that
              neutrality, especially when they need networks to span independently owned space assets. But the real
              competitive map is broader than direct software peers. It includes vertically integrated operators such as
              Starlink and eventually Kuiper, multi-orbit incumbents such as Eutelsat/OneWeb and SES, defense primes
              that can keep network management inside larger platform awards, and the status quo of manual NOCs plus
              proprietary control planes. That is why Aalyria's category is strategically important but still fragile:
              its value rises with network heterogeneity, while its market shrinks if customers decide one vendor should
              own the whole stack.
