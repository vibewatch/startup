      - number: '1.4'
        title: Scale Metrics and Milestones
        blocks:
          - type: paragraph
            body: >-
              As of the February 2026 Series B, Aalyria employed approximately 90 people across its Livermore
              headquarters and its Washington D.C., Pittsburgh, and London offices. The company has publicly committed
              to growing headcount by at least one-third—targeting approximately 120 or more employees—with hiring
              concentrated in engineering, product, and customer support. Revenue and ARR have not been disclosed;
              Aalyria is a private company with no obligation to report financial metrics, and has consistently declined
              to provide specific disclosures in public sources. Customer count has not been quantified; the company
              references strategic accounts including Telesat Lightspeed, NASA, the European Space Agency, Rivada Space
              Networks, Airbus, ALL.SPACE, Keysight Technologies, Logos Space, Google Public Sector, and several U.S.
              military programs.

              Spacetime has achieved Technology Readiness Level 9 (TRL 9) and has accumulated over 2 million hours of
              lights-out orchestration of aerospace nodes per the official Aalyria GitHub repository. The platform
              claims support for over 15 million possible links at up to 1.6 Tbps in aggregate, enabling real-time
              scheduling across satellites, aircraft, ground stations, and terrestrial networks. The Spacetime Fabric
              feature enables federation between independently operated network orchestration platforms.

              The company's milestone cadence demonstrates rapid commercial and government validation: the $8.7 million
              DIU Hybrid Space Architecture contract in 2022; the Rivada Space Networks Spacetime agreement in March
              2023; the ESA contract and London headquarters establishment in December 2023; a 630-satellite mesh
              network demonstration at the Naval Research Laboratory in December 2023 attended by more than 150
              government and defense officials (using OneWeb, Viasat, and Intelsat satellites); the AFRL Space Data
              Network Experimentation program contract in January 2026; and the $100 million Series B unicorn milestone
              in February 2026. An adverse event anchoring Aalyria's origin story: Alphabet's January 2021 shutdown of
              Project Loon created the commercial opportunity by freeing the Spacetime and Tightbeam technology stack
              from an Alphabet-owned moonshot, catalyzing the spinout. Telesat confirmed its commitment via CEO Dan
              Goldberg's public statement that Spacetime's dynamic routing, spectrum-aware resource management, and link
              prediction are integrated into Telesat Lightspeed's system design.
