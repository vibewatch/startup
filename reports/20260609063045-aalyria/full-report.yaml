      - number: '8.2'
        title: Public Comps and Price Discipline
        blocks:
          - type: paragraph
            body: >-
              The cleanest public-market read-through is not a single revenue multiple but a corridor. Aalyria’s $1.3
              billion private valuation is about 26% of Iridium’s June 2026 market cap, roughly 15% of Viasat’s, and
              about 30% of Eutelsat’s, even though those operators already disclose large revenue bases and run real
              networks at scale. At the other extreme, Mynaric’s tiny June 2026 market cap is a reminder that
              optical-communications hardware can lose most of its equity value when execution and financing break. AST
              SpaceMobile shows the opposite outcome: the public market can pay a very large premium for a strategic
              space-network narrative before economics look mature. Aalyria sits between those poles. The current price
              is too high to justify on a hardware-only or project-services lens, but it is not as aggressive as the
              market’s most speculative network-platform bets. The right interpretation is that investors paid for a
              software-control-plane option on top of real partner and government proof, while accepting that the
              economics are still opaque.
