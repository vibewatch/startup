chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Overview
        blocks:
          - type: paragraph
            body: >-
              Aalyria Technologies, Inc. is an aerospace communications company headquartered in Livermore, California,
              with additional offices in Washington D.C., Pittsburgh, and London. The company's legal entity
              name—Aalyria Technologies, Inc.—is confirmed in its official privacy policy. Two credible founding dates
              appear in public sources: CEO Chris Taylor incorporated the company in stealth mode in November 2021
              (documented on his LinkedIn profile, cited by CNBC), while September 2022 marks the formal public
              emergence from stealth following Alphabet's transfer of nearly a decade of intellectual property, patents,
              and physical assets. BusinessWire's Series B press release uses "founded in 2021" while Satnews describes
              the company as having "spun out of Google (Alphabet) in September 2022." Both references are accurate for
              different reference frames; this chapter treats 2021 as the founding year and 2022 as the formal
              operational launch date. The technology internally codenamed "Minkowski" at Google was developed under
              Project Loon before the spinout opportunity emerged.

              Aalyria is classified as Series B stage following the February 23, 2026 close of its $100 million
              financing round. The company operates a dual revenue architecture: software licensing through Spacetime, a
              managed platform-as-a-service (PaaS) for orchestrating directional networks in motion; and hardware sales
              of Tightbeam, a free-space optical laser communications terminal delivering up to 100 Gbps over extreme
              distances. Spacetime is available as a managed service in Aalyria-hosted or customer-hosted Kubernetes
              environments, deployable in commercial cloud, hybrid cloud, on-premises, or classified air-gapped
              infrastructure. Tightbeam terminals are manufactured in fixed (T170x) and gimballed (G170x) form factors
              with 170 mm aperture, up to 100 Gbps data rate, and demonstrated ground-to-air links approaching 200 km.
              Together the products address the fundamental challenge that moving vehicles, changing weather, and
              terrain blockages constantly disrupt directional links—a problem that has hampered over 40 years of DoD
              effort to unify land, sea, air, and space networking. The company positions itself as neutral "digital
              cartilage" enabling federated orchestration across disparate satellite constellations, aircraft, ground
              stations, and terrestrial networks.
