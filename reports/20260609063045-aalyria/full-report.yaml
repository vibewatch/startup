        title: Confirmed Company-Specific Risks
        blocks:
          - type: paragraph
            body: >-
              The clearest company-specific downside comes from Aalyria's concentration in still-forming government and
              satellite programs rather than from a known operational failure. SpaceNews reported that MILNET appeared
              in the FY2026 defense debate amid confusion over whether the Pentagon might shift proliferated LEO
              communications toward a SpaceX-centric path, while the Department of the Air Force said the architecture
              remains under an Analysis of Alternatives. That means Aalyria can win experiments and still lose the final
              stack decision if procurement consolidates around a single vendor or if enterprise optical-terminal
              interoperability choices favor other suppliers. Public evidence also shows that some named U.S. government
              activity is still small or early-stage: USAspending lists a $709,750 NASA purchase order for a Spacetime
              XS staging instance, and Satellite Today describes AFRL's SDNX work as a technical study to identify gaps,
              integration considerations, and a path to future experimentation. Commercially, Telesat has signed a
              10+-year orchestration agreement, but other logo-level proof points are often selections, partnerships, or
              studies without disclosed recurring revenue. No public lawsuit, patent fight, export-control action, or
              FCC enforcement specific to Aalyria was found; that is a positive signal, but it should be treated as
              limited-public-record cleanliness rather than proof that legal or accreditation risk is absent.
