              monetization is visible.
            calloutType: recommendation
            claimRefs:
              - CV035
              - CV043
              - CV044
          - type: callout
            title: No hidden revenue model in this chapter
            body: >-
              The scenario ranges here are milestone-based valuation corridors built from disclosed round facts, public
              comp values, and adverse risk signals. They intentionally do not invent Aalyria revenue, ARR, gross
              margin, NRR, or customer count.
            calloutType: assumption
