  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation Anchor and Quality of Proof
        blocks:
          - type: paragraph
            body: >-
              The anchor facts are unusually clear relative to Aalyria’s operating disclosure. BusinessWire, CNBC,
              SpaceNews, and other 2026 round coverage all point to a $100 million Series B at a reported $1.3 billion
              valuation led by Battery Ventures and J2 Ventures, with Google retaining a stake. Public evidence also
              shows why investors are interested: Aalyria is positioned as communications backbone infrastructure for
              proliferating satellite networks, it has Google spinout lineage, and it has visible strategic proof points
              such as Telesat Lightspeed selection, DIU support, and an ESA contract. What public evidence does not show
              is equally important. The same funding coverage does not disclose revenue, ARR, gross margin, NRR, or
              customer count, and it does not separate how much future value should accrue to recurring orchestration
              software versus hardware, integration, or government project work. That gap makes the round much stronger
              as a signal of investor appetite than as proof of fundamental valuation support. In other words, Aalyria
              has credible product and ecosystem evidence, but weak public monetization evidence.
