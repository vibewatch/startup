        title: Revenue Model and Pricing
        blocks:
          - type: paragraph
            body: >-
              Aalyria's financial model is best understood as a dual-stream architecture rather than a clean software
              story. On one side, Spacetime looks like enterprise infrastructure software: Aalyria markets it as an
              Aalyria-hosted or customer-hosted managed service that can run in commercial cloud, hybrid, on-premises,
              or air-gapped environments. That supports recurring revenue through licensing, subscriptions, or
              managed-service contracts, plus professional services for deployment and integration. On the other side,
              Tightbeam is unmistakably hardware. Aalyria sells optical communications terminals in fixed and gimballed
              configurations, which implies one-time product revenue, installation work, and support obligations with
              lower gross-margin purity than software. Public logos such as Telesat, DIU, NASA, AFRL, Rivada, and
              Keysight support that there is real buyer interest across commercial and government channels, but none of
              those sources disclose a rate card, realized software pricing, terminal ASP, or bundle mix. The result is
              a real monetization surface with very limited public price transparency.
