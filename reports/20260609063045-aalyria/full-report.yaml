  - id: FV001
    title: Recommendation Logic
    type: flow
    layout: wide
    summary: >-
      How disclosed round terms, proof quality, missing economics, and program risk combine into a stretched valuation
      stance.
    data:
      nodes:
        - id: n1
          label: 2026 Round Anchor
          detail: $100M Series B at reported $1.3B valuation
        - id: n2
          label: Real Strategic Proof
          detail: Telesat, DIU, ESA, Google-spinout lineage
        - id: n3
          label: Software-Like Optionality
          detail: Control-plane upside if orchestration becomes a sticky layer
        - id: n4
          label: Missing Economics
          detail: No public revenue, ARR, margin, NRR, or customer count
        - id: n5
          label: Program / Hardware Drag
          detail: MILNET uncertainty, Lightspeed timing, Tightbeam scale risk
        - id: n6
          label: Stretched Price
          detail: Public proof supports plausibility more than fairness
        - id: n7
          label: Track / Research More
          detail: Wait for production and revenue-quality proof before underwriting as fair
      edges:
        - from: n1
          to: n6
          label: Entry price to test
        - from: n2
          to: n6
          label: Supports premium
        - from: n3
          to: n6
          label: Could justify upside
        - from: n4
          to: n6
          label: Blocks fair-value anchor
        - from: n5
          to: n6
          label: Keeps downside open
