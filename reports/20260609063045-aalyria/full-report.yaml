      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Deep Technology Moat from Decade of Google + LLNL R&D
            body: >-
              Spacetime and Tightbeam each reflect nearly a decade of investment by Google/Alphabet and Lawrence
              Livermore National Laboratory before Aalyria's founding. This history is a durable competitive moat: the
              NRL December 2023 demonstration at TRL 9 with 630 operational satellites and six generations of Tightbeam
              terminal development are not achievable by new entrants without equivalent R&D cycles. The retained Google
              minority stake simultaneously signals IP continuity and creates potential overhang risk requiring
              diligence.
            calloutType: strength
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO018
              - CO036
          - type: callout
            title: Build-vs-Buy Risk from Vertically Integrated Constellation Operators
            body: >-
              SpaceX and Amazon operate vertically integrated satellite ecosystems and may choose to develop in-house
              orchestration instead of adopting third-party platforms. CTO Brian Barritt acknowledged the risk directly:
              "companies with billions at stake may want to control their own network stack." SpaceX's Jonathan Hofeller
              has emphasized that vertical integration ("Continuing to build excellent infrastructure is what we're
              great at") is Starlink's strategic advantage. Aalyria's federation thesis requires multi-operator
              architectures to become dominant enough to sustain a neutral orchestration middleware market before
              incumbents internalize similar capabilities.
            calloutType: risk
            claimRefs:
              - CO038
              - CO039
          - type: callout
            title: Founding Date Is 2021 (Stealth) with 2022 Public Launch
            body: >-
              Two credible reference points appear in public sources for Aalyria's founding: 2021 (CEO Taylor's company
              incorporation in November 2021, documented by his LinkedIn per CNBC) and September 2022 (the formal
              Alphabet IP transfer and public emergence). Both are accurate for different reference frames. This chapter
              uses 2021 as the founding year and 2022 as the public operational launch. The BusinessWire Series B press
              release explicitly states "founded Aalyria in 2021," resolving the interpretation in favor of 2021 as the
              canonical founding year.
            calloutType: assumption
