      - number: '2.2'
        title: Market Sizing and Estimates
        blocks:
          - type: paragraph
            body: >-
              The strongest way to size Aalyria's market is with multiple constrained lenses, not a single giant TAM
              quote. Novaspace's 2026 space-economy work shows a $626.4 billion 2025 backdrop headed toward $1.01
              trillion by 2034, but most of that value sits outside Aalyria's product scope. The more relevant slices
              are HTS services, which grew to about $31 billion in 2025 and are forecast to reach $76 billion by 2034;
              the $106 billion ground-segment market, including $26.25 billion of MilSatCom terminal value through 2034;
              and the 5G NTN, satellite NTN, and network-automation adjacencies. Those pools cannot be added
              mechanically because they overlap, and many still describe service revenue or infrastructure spend that
              Aalyria does not capture directly. A defensible five-year synthesis is therefore a low-teens-billions TAM
              lens, a much narrower $0.8 billion to $3.0 billion reachable SAM, and a still narrower $0.08 billion to
              $0.35 billion plausible SOM. The sizing model is intentionally range-based because public sources prove
              buyer need but not contract values, pricing, or attach rates.
