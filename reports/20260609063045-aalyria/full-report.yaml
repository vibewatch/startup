        - id: n4
          label: Digital twin / solver
          detail: >-
            Spacetime evaluates topology, beam geometry, resource constraints, and partner-network options in a
            predictive model.
        - id: n5
          label: Routing and scheduling decision
          detail: The control plane selects paths, link schedules, beam resources, and fallback options.
