  title: Regulatory / legal risk register
  columns:
  - Rule / License / Case
  - Jurisdiction
  - Status
  - Likelihood
  - Severity
  - Mitigation
  - Residual Exposure
  - Diligence Path
  rows:
  - - MILNET architecture and vendor-lock policy risk
    - U.S. DoD / Congress
    - AoA unresolved; FY2026 debate remains unsettled
    - High
    - High – architecture choice could shrink Aalyria's government TAM
    - Monitor AoA, appropriations, and enterprise-terminal decisions
    - Government market could centralize around a SpaceX-centric stack despite multi-vendor rhetoric
    - Track FY2027 budget language, enterprise-terminal awards, and MILNET architecture decisions
  - - FCC NGSO licensing and interference constraints
    - U.S. (FCC)
    - Active; operator licenses and interference disputes remain central to deployment
    - Medium
    - High – customer networks depend on valid licenses and coordination
    - Operator-agnostic software can integrate any compliant network
    - Aalyria still inherits customer licensing failures and interference outcomes
    - Watch FCC NGSO orders, coordination disputes, and customer license renewals
  - - ITAR / EAR export-control classification for Tightbeam
    - U.S. DoS / DoC
    - Likely relevant; public jurisdiction analysis not disclosed
    - Medium
    - High – export licensing can slow allied sales and support
    - Use specialist export counsel and segregate defense configurations
    - International scaling can be delayed by licensing, technical-data, and reexport limits
    - Request formal jurisdiction memo and license strategy by target geography
  - - Security accreditation / zero-trust / cross-domain approval
    - U.S. DoD / allied defense customers
    - Ongoing requirement; public accreditation status not disclosed
    - Medium
    - High – noncompliance can block operational adoption even after technical success
    - Air-gapped and mission-aware deployment modes are presented as mitigants
    - Accreditation timelines belong to customers and mission owners, not Aalyria alone
    - Ask for current CMMC / ATO / classified deployment status and boundary diagrams
  - - Alphabet / LLNL IP chain-of-title and license terms
    - U.S. contract / DOE
    - Spinout and LLNL terms remain largely private
    - Low-Medium
    - High – residual rights or royalty burdens could impair margins and control
    - Series B investors appear comfortable enough to finance the company
    - Public investors cannot see scope, duration, exclusivity, or royalty structure
    - Request assignment agreements, license schedules, and royalty waterfalls
  - - Company-specific lawsuits or enforcement
    - U.S. public record
    - No public lawsuit or enforcement identified as of 2026-06-09
    - Low
    - Medium – absence of evidence is positive but not dispositive
    - None required beyond routine monitoring
    - Limited disclosure means absence of public cases is not a full diligence substitute
    - Repeat court, FCC, DDTC/BIS, and sanctions searches during each refresh
