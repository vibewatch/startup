- id: TR005
  title: Mitigation / Monitoring / Diligence-Ask Table
  columns:
  - Risk
  - Monitorable Trigger
  - Threshold / Event
  - Action Implication
  rows:
  - - MILNET / PLEO architecture
    - AoA outcome, FY2027 budget language, enterprise-terminal awards
    - Space Force or Congress narrows to a single-vendor stack
    - Treat as thesis-break for government-platform upside
  - - Telesat Lightspeed commercialization
    - Launch cadence, service start, and operator financing updates
    - Meaningful service slip beyond current operator roadmap
    - Reduce near-term commercial conversion assumptions
  - - Rivada conversion risk
    - Launch, financing, and constellation execution updates
    - Further delay or program restructuring
    - Treat logo as strategic validation only until economics are disclosed
  - - Tightbeam manufacturing readiness
    - Factory, supplier, MTBF, and deployment disclosures
    - No visible manufacturing evidence or reliability disclosure through 2026
    - Assume hardware ramp is later and more capital intensive than management case
  - - Security / accreditation status
    - CMMC/ATO status, classified-boundary evidence, customer deployment approvals
    - No credible accreditation progress despite continued government wins
    - Downgrade probability of operational defense adoption
  - - Standards adoption timing
    - 3GPP/O-RAN milestones and operator integration announcements
    - NTN roadmap slips or interfaces remain draft-only
    - Push out 5G NTN monetization expectations
  - - Partner-logo durability
    - Disclosure of contract value, duration, backlog, or renewal rights by named logo
    - Public materials still rely mainly on logos and studies after major financing
    - Apply higher valuation discount for proof-point inflation
  - - Financial disclosure quality
    - Disclosure of revenue, burn, backlog, and unit economics
    - Another major funding or valuation event occurs without operating disclosure
    - Assume narrative premium remains ahead of fundamentals
