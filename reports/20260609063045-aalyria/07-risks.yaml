- id: people-execution-risks
  title: Governance, Disclosure, and Valuation Risks
  body: 'The public-information problem is itself a risk. Aalyria has disclosed valuation, funding, and headline partners, but not revenue, backlog, burn, gross margin, or contract value by program, which makes it difficult to judge whether the $1.3 billion price reflects durable economics or option value on future adoption. That lack of disclosure is especially important because the partner roster is broad enough to create a halo effect that may overstate current commercial traction. The best-publicized durable term is Telesat''s 10+-year agreement; several other marquee names are attached to a pilot, study, government order, or standards project with no disclosed recurring-revenue contribution. Governance visibility is also limited: the Series B announcement identifies a new Battery board seat and notes Alphabet retained a stake, but public materials do not spell out independent board composition, committee structure, or internal-control maturity. Key-person exposure remains meaningful
    because Chris Taylor and Brian Barritt anchor commercial, government, and architectural credibility at the same time the company is trying to scale software, hardware, and international operations. In short, valuation risk here is driven less by an identified scandal than by the gap between ambitious network-of-networks positioning and the amount of hard, disclosed operating data available to underwrite it.'
