company:
  name: Aalyria
chapter:
  number: 7
  title: Risks
  summary: Aalyria's principal company-specific risks are concentration in a small set of marquee government and satellite programs, uncertain adoption timing for optical and multi-domain orchestration, and execution risk in scaling Tightbeam hardware before durable revenue is visible. The riskiest external dependencies are long U.S. government procurement cycles, satellite-operator delays at Telesat and Rivada, interoperability and security-accreditation decisions that sit with customers and standards bodies, and limited public financial disclosure behind a $1.3 billion valuation. No public lawsuit or regulatory enforcement specific to Aalyria was found, so several downside cases remain category-risk inferences rather than confirmed company incidents.
sections:
- id: regulatory-legal-risks
  title: Confirmed Company-Specific Risks
  body: 'The clearest company-specific downside comes from Aalyria''s concentration in still-forming government and satellite programs rather than from a known operational failure. SpaceNews reported that MILNET appeared in the FY2026 defense debate amid confusion over whether the Pentagon might shift proliferated LEO communications toward a SpaceX-centric path, while the Department of the Air Force said the architecture remains under an Analysis of Alternatives. That means Aalyria can win experiments and still lose the final stack decision if procurement consolidates around a single vendor or if enterprise optical-terminal interoperability choices favor other suppliers. Public evidence also shows that some named U.S. government activity is still small or early-stage: USAspending lists a $709,750 NASA purchase order for a Spacetime XS staging instance, and Satellite Today describes AFRL''s SDNX work as a technical study to identify gaps, integration considerations, and a path to future experimentation.
    Commercially, Telesat has signed a 10+-year orchestration agreement, but other logo-level proof points are often selections, partnerships, or studies without disclosed recurring revenue. No public lawsuit, patent fight, export-control action, or FCC enforcement specific to Aalyria was found; that is a positive signal, but it should be treated as limited-public-record cleanliness rather than proof that legal or accreditation risk is absent.'
