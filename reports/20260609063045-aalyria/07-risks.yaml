- calloutType: risk
  title: MILNET Remains the Single Largest Thesis-Break Variable
  body: Aalyria can accumulate studies, pilots, and partner endorsements and still miss the largest upside case if the Pentagon ultimately converges on a narrower, more vertically integrated pLEO architecture. The government concentration risk is therefore about final architecture control, not just whether Aalyria stays technically relevant.
  claimRefs:
  - CR022
  - CR023
  - CR047
  - CR049
- calloutType: insight
  title: The Main Underwriting Risk Is Proof Conversion, Not Public Scandal
  body: No public lawsuit or enforcement action specific to Aalyria was found, but public information is thin on revenue, backlog, accreditation, board structure, and hardware readiness. The bigger risk is that marquee logos and technical validation convert into durable economics more slowly than the valuation assumes.
  claimRefs:
  - CR005
  - CR044
  - CR045
  - CR051
