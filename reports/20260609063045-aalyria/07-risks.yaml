- id: partner-dependency-risks
  title: Dependency, Concentration, and Procurement Risks
  body: 'Aalyria''s current proof set is concentrated in a small number of counterparties whose own schedules and capital plans are outside Aalyria''s control. Telesat is the strongest disclosed commercial commitment, but its constellation timing still governs when a flagship Spacetime deployment becomes visible. Rivada offers diversification, yet the public evidence is still a selection announcement tied to a planned constellation rather than a disclosed recurring revenue stream. On the government side, DIU, AFRL, NASA, and the broader MILNET/PWSA debate all help validate relevance, but they also show a long-cycle procurement reality in which pilot success, study awards, and small purchase orders can precede scaled revenue by years. SpaceX remains a structural externality: Aalyria cannot force Starlink telemetry sharing, and a Pentagon move toward a Starshield-heavy architecture would weaken the multi-operator control-plane thesis. The same dependency logic applies to LLNL-origin Tightbeam
    IP, Alphabet''s residual stake and spinout history, and standards bodies such as 3GPP and O-RAN. Investors should therefore treat Aalyria less as a diversified installed base and more as a concentrated portfolio of option-like programs whose conversion into durable revenue is still being proven.'
