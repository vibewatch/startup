  topStrengths:
    - 借助 MCEX 和澳门授权，公司拿到稀缺的监管与市场结构位置。
    - 创始人履历和资本市场信用，在私营金融科技公司中罕见地强。
    - 机构验证包括大额 Series C、HSBC 资产支持贷款支持，以及结构化信贷评级里程碑。
    - 模式瞄准的是规模很大、长期供给不足的小微企业融资市场。
  topRisks:
    - 收入、利润率、违约率、投资者回报和股权结构条款大多仍未公开。
    - 监管解释和跨境可持续性仍是能推翻投资逻辑的变量。
    - 市场深度和复投投资者流动性，还没有叙事说得那么扎实。
    - 中国消费走弱或中小企业承压，会直接挤压底层现金流表现。
    - 如果后续轮次条款苛刻，可能暴露出股权价值明显弱于 2023 年估值。
  unresolvedGaps:
