  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Comparable valuation table
    missingEvidence: The comparable valuation table relies on stale internal anchors, tracker databases, and financing milestones because no fresh public priced-round or secondary-mark evidence was reviewed.
    whyItMatters: Without current market-clearing evidence, the table can discipline thinking but cannot prove a precise fair value.
    diligencePath: Request current round materials, any secondary transactions, and management’s latest valuation memorandum.
    relatedQuestionRefs:
    - QV002
    - QV007
    - QV017
    - QV018
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: blocking
    topic: Comparable valuation table / current pricing evidence
    missingEvidence: No reviewed public source discloses a fresh priced equity round, current secondary mark, or full 2024-2026 term stack that would let the comparable valuation table rely on current market-clearing evidence rather than stale anchors and milestone references.
    whyItMatters: This is the single biggest reason the chapter uses broad scenario bands instead of a precise fair value.
    diligencePath: Request the latest priced-round materials, any secondary-price discovery, board valuation memos, and a clean chronology of all post-2023 financing terms.
    relatedQuestionRefs:
    - QV002
    - QV003
    - QV007
    - QV017
    - QV018
    - QV029
    relatedTableRefs:
    - TV004
    - TV006
  - type: private-evidence-only
    severity: material
    topic: Portfolio performance and liquidity history
    missingEvidence: No reviewed public source discloses vintage losses, realized investor IRRs, repeat participation rates, or robust secondary-turnover evidence.
    whyItMatters: These variables determine whether Micro Connect deserves exchange-like valuation support or should be underwritten more conservatively as specialty finance.
    diligencePath: Request portfolio tapes, realized-return cohorts, investor-repeat data, turnover statistics, and any internal liquidity dashboards.
