- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Scarce regulatory and market-infrastructure position in Macao supports strategic premium potential
    - Confidence improves if counsel, regulators, and counterparties confirm the model is portable and durable
  - - DRO / MCEX architecture could become a differentiated bridge between global capital and China micro-SMEs
    - Confidence improves if the company discloses repeat issuance, secondary liquidity, and realized investor outcomes
  - - High-profile investors, HSBC financing, and rating milestones validate institutional interest
    - Confidence improves if these milestones are followed by observable revenue, take-rate, and portfolio-loss transparency
  - - Opacity on revenue, returns, and terms prevents strong valuation conviction
    - The view upgrades if management opens cohort, cap-table, and monetization data; it downgrades if new terms are punitive
  notes: The thesis is attractive on strategic position and weak on auditable economics.
