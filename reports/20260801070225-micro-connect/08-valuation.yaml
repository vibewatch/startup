- id: diligence-exit
  title: The company could upgrade from track only if economics and terms become visible
  body: The final underwriting problem is not whether Micro Connect is interesting; it is whether a new investor can know what they are actually paying for. Several 2025-2026 management and media-wrapper pieces show that the company is trying to broaden the story beyond a single product into bond-market relevance, tokenization debate, construction-finance expansion, AI-assisted cashflow rights, and international financial-center ambition. Those narratives may eventually matter, but they do not eliminate the need for hard diligence on cohort returns, turnover, cap-table protections, and funding dependency. Without a current priced round, data-room financials, or a disclosed exit path, the prudent stance stays at track. The thesis would improve with clean operating disclosures and worsen quickly if funding terms, regulation, or underlying collections prove weaker than the narrative implies. In practical terms, that means diligence has to focus less on conference-stage vision and more on the
    handful of documents that reveal whether the equity really compounds alongside the asset class.
