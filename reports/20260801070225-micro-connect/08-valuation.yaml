- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Repeat capital expands, regulation remains supportive, product breadth widens, and disclosure improves
    - US$2.0B-US$2.4B equity value; upside comes from regulatory scarcity premium and higher confidence in repeatability
    - Regulatory shift, liquidity disappointment, weak collections
    - Needs current revenue/return data plus evidence that 2024-2026 financing momentum is real
  - - Base
    - MCEX remains operational, lender/investor support persists, but transparency stays partial
    - US$1.4B-US$1.8B equity value; roughly around the last known US$1.7B mark
    - Opacity keeps upside capped and terms matter materially
    - Most consistent with current public evidence
  - - Bear
    - Public data remains thin, macro or regulatory pressure rises, and financing terms lose investor-friendliness
    - US$0.7B-US$1.1B equity value; company is valued more like a specialized finance platform than a new exchange category
    - Down-round economics, higher loss assumptions, weaker liquidity
    - Material if new disclosures show stress rather than resilience
  notes: Ranges are analytical underwriting judgments, not observed market marks or management guidance.
