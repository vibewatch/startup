- id: capital-investors
  title: Funding history, investor base, and capital structure
  body: Publicly verified funding chronology is strong through August 2023 and becomes thinner afterward. Micro Connect's March 2022 Series B announcement states the round was $70 million and brought cumulative fundraising to $120 million, implying an earlier Series A of about $50 million. The August 2023 Series C press release and Forbes independently corroborate a $458 million round and a $1.7 billion valuation, which together imply $578 million of cumulative equity raised. Tracxn also records an undisclosed November 15, 2024 Series C extension led by Jane Street, but neither the official company site nor mainstream public reporting reviewed here discloses the amount, so that later round should be treated as directionally useful but not fully underwritten. Separately, HSBC has become a strategic debt partner via asset-backed facilities, giving the company leverage capacity in addition to equity capital.
  claimRefs:
  - CO013
  - CO014
  - CO015
  - CO016
