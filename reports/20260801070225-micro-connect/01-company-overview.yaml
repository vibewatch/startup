company:
  name: Micro Connect
chapter:
  number: 1
  title: Company Overview
  summary: Micro Connect is a Hong Kong-founded financial-infrastructure company building a new revenue-sharing asset class for China's micro and small businesses through its MCEX exchange in Macao. Public evidence supports a 2021 founding, a $458 million Series C at a $1.7 billion valuation in August 2023, and rapid scale to more than 10,000 funded businesses by late 2023, but later funding and governance disclosures remain incomplete.
sections:
- id: identity-model
  title: Identity, geography, and operating model
  body: 'Micro Connect describes itself as market infrastructure connecting global capital with the real economy rather than as a conventional lender or equity investor. The company was founded in Hong Kong in 2021 and built its operating footprint around Hong Kong capital-markets talent, mainland-China origination and data collection, and a regulated exchange venue in Macao. Its core proposition is revenue-based finance: it advances capital to small businesses and collects an agreed share of daily revenue rather than a fixed coupon or equity dilution. The company''s terminology has evolved from Daily Revenue Contracts in 2022 to Daily Revenue Obligations in 2023 and cashflow obligations / real-world cashflows in the 2025 shareholder letter, but the operating logic remains consistent: digitize store-level cashflows, standardize them, and package them for professional investors.'
  claimRefs:
  - CO001
  - CO002
  - CO005
  - CO006
  - CO007
  - CO008
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: founders-governance
  title: Founders, leadership, and governance posture
  body: 'The verified founder set is Charles Li and Gary Zhang, not the Gary Liu identity in the seed prompt. Official company materials consistently present Charles Li as founder and chairman and Gary Zhang as founder plus CEO or vice chairman depending on the date of the source. The founder backgrounds matter to the thesis: Li previously led Hong Kong Exchanges and Clearing and also held senior China roles at J.P. Morgan and Merrill Lynch, while Gary Zhang came from Oriental Patron. Public materials also show a broader operating bench including Ramon Li as China CEO and Lin Tun as CIO, but the company does not publicly disclose a full board roster, committee structure, or formal succession planning. That makes founder quality a major strength and governance transparency a material diligence gap.'
  claimRefs:
  - CO003
  - CO004
  - CO009
  - CO010
  - CO011
  - CO012
