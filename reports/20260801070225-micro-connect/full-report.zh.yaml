  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: Micro Connect 实际所在的市场
        blocks:
          - type: paragraph
            body: >-
              如果只把 Micro Connect
              放进一个市场篮子，很容易误读。它不只是贷款机构，不只是金融科技软件供应商，也不只是交易所。最实用的市场定义，是三层交叉：中国中小微企业融资市场、新兴全球收入分成融资与嵌入式金融市场，以及让门店级现金流可被观测的数字支付
              /
              数据基础设施。公司追逐的是中小微企业融资中的一个子集：还款可以直接绑定经营收入，而不是抵押品或固定摊还。纳入范围是能产生现金流的小企业增长和营运资本；排除范围是消费贷、大企业资金管理、按揭式抵押融资和营收前初创公司的股权融资。这条边界很关键，因为中国金融市场的表层
              TAM 数字极其庞大，而 Micro Connect 真正可服务市场取决于数字可见度、合作伙伴渠道，以及投资者对非标准资产的胃口。
