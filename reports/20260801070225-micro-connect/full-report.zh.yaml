  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品是现金流融资栈，不是单一 SKU
        blocks:
          - type: paragraph
            body: >-
              Micro Connect 的公开材料描述的是一套栈：起点是面向小微企业的收入挂钩融资，终点是面向专业资本的标准化投资产品。早期术语包括 Daily Revenue Contracts 和 Daily
              Revenue Obligations；后续材料把词汇扩展到 Cashflow Obligations、Cashflow Contingent Obligations、Revenue Based
              Obligations、SPVs、SPACs、ETFs 和 RBUs。这些名称背后的共同想法一致：捕捉经营现金流，将其转化为合约化支付流，标准化成面向投资者的工具，再通过市场基础设施流转。因此，Micro
              Connect 不像单一金融科技应用，更像获客、数据、结算、披露和产品化系统的组合体。这也解释了为什么评估公司需要市场基础设施思维，而不能只用承保思维。
