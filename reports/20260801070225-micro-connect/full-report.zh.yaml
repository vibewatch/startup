      - number: '3.4'
        title: 嵌入式平台和中国巨头可能是中期更危险的威胁
        blocks:
          - type: paragraph
            body: >-
              长期最危险的竞争者，可能不是只营销融资的公司，而是控制商户分发或支付的公司。Liberis 称其平台覆盖 15 个国家，并通过一次集成支持多种融资产品。Parafin 称其已发出超过 US$35 billion
              的授信要约，并通过商户已经信任的平台资助 50,000 多家企业。Pipe 和 Capchase 也把金融嵌入现有工作流。在中国，Ant Group、WeBank 和 MYbank
              已经在巨大规模上贴近支付或中小企业数字金融活动。如果平台或支付网络能够获取商户、观测现金流，并在场景中交付资本，除非 MCEX 为获客方和投资者都创造明显更好的结果，否则 Micro Connect
              的伙伴护城河可能被削弱。
