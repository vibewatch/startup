      - number: '8.4'
        title: 只有经济性和条款变得可见，公司才可能从跟踪上调
        blocks:
          - type: paragraph
            body: >-
              最终承销问题不是 Micro Connect 有没有意思，而是新投资者能否知道自己到底在为什么付钱。几篇 2025-2026
              年管理层和媒体包装内容显示，公司正试图把故事从单一产品扩展到债券市场价值、通证化讨论、建筑金融扩张、AI
              辅助现金流权利以及国际金融中心雄心。上述叙事未来可能有意义，但不能替代对分批次回报、周转、股权结构保护和资金依赖的硬尽调。没有当前定价轮、数据室财务或已披露退出路径，审慎立场仍应是跟踪。若经营披露清晰，投资假设会改善；若融资条款、监管或底层回款弱于叙事，投资假设会迅速恶化。实操上，尽调要少看会场愿景，多看少数能说明股权是否真的随资产类别一起复利的文件。
