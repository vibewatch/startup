  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险是打破论点的核心变量
        blocks:
          - type: paragraph
            body: >-
              Micro Connect 有意站在境内经营资产、离岸资本和澳门新市场结构的边界上。这带来战略上行，也让监管解释成为最重要的单一风险变量。公开材料强调澳门行政命令、关键基础设施运营者认可、SAFE
              兼容路由和离岸投资者结构，但外部报道反复把该模式描述为新颖、难以归类或容易受到审视。HK01 明确提到 P2P 式担忧。FT
              播客文字稿称，该业务处在监管灰色地带，如果北京不喜欢其中涉及的数据或结构，可能会遇到问题。即使是 Bloomberg 澳门特写等支持性来源，也暗示 MCEX
              依赖一个愿意理解新机制的监管者，而其他监管者可能拒绝。简言之，这里的合法性不是二元判断；风险在于不利解释、范围收窄或复制放慢。
            claimRefs:
              - CR001
