  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争是三线作战，不是单一同业集合
        blocks:
          - type: paragraph
            body: >-
              Micro Connect 面对的不只是一类公司。对小企业业主而言，最接近的替代品是 Clearco、Wayflyer、Uncapped、Choco Up
              等收入分成融资提供商；它们都主打快速、非稀释性增长资本和灵活还款结构。第二条竞争线是 Liberis、Pipe、Parafin、Capchase
              等嵌入式金融基础设施玩家；只要能控制商户来源和融资发生的平台，它们并不需要自有持牌交易所。第三条线是中国本土数字金融巨头——Ant Group、WeBank 和
              MYbank——它们已经拥有支付、数据和中小企业分发优势，哪怕产品并不被包装成收入分成证券。因此，Micro Connect
              的真实标尺不是融资量标题数字，而是其交易所模式能否形成那些替代方案难以复制的分发、风险或流动性优势。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
