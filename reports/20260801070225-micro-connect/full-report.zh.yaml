              最可见的财务证明点，是融资量和规模指标，而不是 P&L 指标。Micro Connect 和伙伴披露显示：2022 年 3 月投资企业超过 100 家；到 2023 年 5 月 MCEX 试运营期间，融资企业超过
              4,000 家、募集超过 RMB 1 billion；到 2023 年 7 月，获资助企业超过 2,900 家；到 2023 年底，企业超过 10,000 家、募集近 RMB 4 billion；到 2024 年
