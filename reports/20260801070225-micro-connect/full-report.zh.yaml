      - number: '2.5'
        title: 公开市场数据仍无法回答什么
        blocks:
          - type: paragraph
            body: >-
              公开数据足以说明需求很大、数字轨道很深、另类金融正在扩张。但它很难量化 Micro Connect 的真实可服务市场，也无法证明长期承保质量。本报告检视的公开来源中，没有任何一个提供了中国收入分成融资的干净
              TAM、限定于数字可见门店经营者的量化 SAM，或 Micro Connect
              在机构型中小企业融资中的市场份额。市场研究来源使用的分类也不同：有的把机会定义为全部中小微企业贷款，有的定义为另类贷款，有的定义为收入分成融资产品类别。这些自上而下的视角有助于建立背景，但不足以支撑精确估值。真正可操作的自下而上问题是：有多少企业拥有可数字观测的每日收入、足够经波动调整后的现金生成能力，以及足够渠道支持，能够在可接受损失率下反复融资。答案仍在公司私域。
