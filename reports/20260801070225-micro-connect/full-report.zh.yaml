      - number: '8.2'
        title: 最后一个清晰的股权锚点仍是 2023 年 8 月那轮融资
        blocks:
          - type: paragraph
            body: >-
              最强的公开价格锚点仍是 2023 年 8 月 Series C：公司官方材料称 Micro Connect 融资 US$458 million，Forbes 和 Tracxn 则把该轮对应到 US$1.7
              billion 估值、累计融资约 US$578 million。这个锚点有参考价值，但不等于当前公允价值。二级数据库有方向性，却噪声不小：Caplight 和 Parsers VC 只计入已明确披露的
              2022、2023 年轮次，显示已融资 US$528 million；Tracxn 还记录 Jane Street 领投了一笔未披露金额的 2024 年 11 月 Series C 延伸轮。与此同时，HSBC
              授信和 A(sf)
              结构化信贷评级支持一个判断：投资者和贷款方确实看到了这一资产类别的价值。但它们是融资和风险转移里程碑，并不能直接替代当前股权价格发现。它们提高了公司真实存在、可融资的置信度，却让当前股权价值这个核心问题依然悬而未决。
