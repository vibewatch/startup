companyProfile:
  summary: >-
    Micro Connect 是一家香港私营金融科技与市场基础设施公司，由 Charles Li 和 Gary Zhang 于 2021 年创立。公司为中国小微企业创设收入分成融资模式，并在澳门配套 MCEX
    这一持牌场所，用来把现金流挂钩产品打包并分发给专业投资者。公开证据支持一个判断：Micro Connect 的野心不止于传统中小企业贷款机构；但同样显示，它的经济性和当前公允价值远不如市场叙事透明。
