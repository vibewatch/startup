              则随来源日期不同，被称为创始人兼 CEO 或副董事长。创始人背景直接影响投资论点：Li 曾执掌香港交易及结算所，也曾在 J.P. Morgan 和 Merrill Lynch 担任中国区高层；Gary Zhang
