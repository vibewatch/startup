            body: >-
              最详细的技术披露来自官方 MAP 和 Micro Star 博客。ARM 是采集和控制层：借助支付聚合、虚拟银行或其他数字工具观测收入并路由每日现金流。MAP
              是会计、披露、定价和可比性层：它标准化合约信息、支付预测、每日回款、税项和风险指标，让投资者与发行方能够谈判并监控产品。Micro Star 是市场运营层：它定义 RBOs、SPVs、SPACs、ETFs 和
              RBUs 等数字载体，再加入撮合、回购机制、披露和清算逻辑，让它们可交易。三层合在一起，构成公司产品与技术论点的核心。
