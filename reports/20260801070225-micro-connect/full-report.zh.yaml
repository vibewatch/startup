  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、地域与运营模式
        blocks:
          - type: paragraph
            body: >-
              Micro Connect 自称是连接全球资本与实体经济的市场基础设施，而不是传统贷款机构或股权投资者。公司 2021
              年创立于香港，运营版图围绕香港资本市场人才、中国内地获客与数据采集、澳门受监管交易场所搭建。核心主张是收入分成融资：向小企业预付资金，再按约定收取每日收入的一部分，而不是收固定票息或稀释股权。公司术语从 2022
              年的 Daily Revenue Contracts，演进到 2023 年的 Daily Revenue Obligations，再到 2025 年股东信中的现金流义务 /
              现实世界现金流，但运营逻辑没有变：把门店级现金流数字化、标准化，再打包给专业投资者。
