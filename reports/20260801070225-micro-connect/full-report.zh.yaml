              年创始人博客把这种转向定义为必要动作，因为小额、高频、异质的机会，若完全靠人工运营，成本太高。这个逻辑可信，但也带来新问题：今天承保和监控中哪些部分已经真正自动化，控制闭环有多稳，以及 AI
