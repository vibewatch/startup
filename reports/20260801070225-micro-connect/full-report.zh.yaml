      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强的结构性驱动来自数字化、支付轨道渗透、中小企业政策支持，以及投资者对非稀释性资本方案的需求。中国线上零售销售和跨境电商体量仍然巨大，官方政策也继续鼓励商贸领域中小企业数字化转型。Mordor
              Intelligence 认为，中国仍是亚太金融科技中最大的单一地理市场，企业用户金融科技需求增长快于零售端。全球 RBF 研究也显示，亚太是增长最快的区域。但模型面对的约束同样实质。World Bank
              认为，2026 年中国仍面临内需偏弱、就业和收入增长放缓、居民消费谨慎等逆风。Mordor 还强调，多司法辖区合规碎片化、网络欺诈和数据本地化负担。最后，WZR
              对中国付款保障规则的评述说明，可靠的小企业现金回款仍然关键：许多小企业在普通商业活动中继续面临延迟付款风险，因此即便收入分成结构设计良好，也依赖更广泛的付款纪律和客户需求。
