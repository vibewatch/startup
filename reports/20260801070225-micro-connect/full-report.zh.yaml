            body: 中国中小微企业贷款的自上而下数字能提供有用背景，但 Micro Connect 只覆盖具备可观测现金流、可规模化伙伴覆盖和投资者可接受标准化的一部分企业。
            calloutType: insight
            claimRefs:
              - CM007
              - CM008
              - CM033
              - CM034
          - type: callout
            title: 宏观需求不能消除周期风险
            body: 即便融资缺口很大，如果消费需求持续疲软，或还款质量数据仍不公开，实际回报也可能很差。
            calloutType: risk
            claimRefs:
              - CM024
              - CM025
