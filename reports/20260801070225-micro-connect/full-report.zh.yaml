      - number: '3.3'
        title: 直接同业大多赢在简单、速度和渠道契合
        blocks:
          - type: paragraph
            body: >-
              本报告检视的直接同业，普遍卖的是简单。Clearco 宣传面向电商和 SaaS 的融资，审核周期快、融资结构多、没有稀释。Wayflyer 主打 US$5,000 到 US$20 million
              的灵活资本，并称已资助 7,000 多家企业。Uncapped 强调无股权损失、无个人担保的固定费用营运资本。Choco Up 将自己定位为亚洲范围内的灵活初创企业和销售额挂钩融资，并宣传累计资助 GMV 超过
              US$2.5 billion、融资轮次超过 1,000 个。相比 Micro Connect
              以交易所为中心的技术栈，这些方案更容易被创始人理解，但它们并不声称拥有同等二级市场或机构资产转化能力。核心竞争取舍就在这里：一边是用户简单性，另一边是资本市场野心。
