  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 主要风险从监管、数据质量和宏观条件传导到回款、投资者信任、流动性和估值。
    data:
      nodes:
        - id: r1
          label: 监管解释
          detail: 牌照 / 结构 / 披露风险
        - id: r2
          label: 数据与控制质量
          detail: ARM、预测、结算、隐私
        - id: r3
          label: 宏观需求 / SME 健康度
          detail: 门店销售和偿付能力
        - id: r4
          label: 投资者信心
          detail: 重复参与和定价
        - id: r5
          label: 流动性 / 资金循环
          detail: 换手、重复发行、基金深度
        - id: r6
          label: 收入 / 利润率 / 估值
          detail: 平台经济模型和融资能力
      edges:
        - from: r1
          to: r4
          label: 可能削弱
        - from: r2
          to: r4
          label: 可能削弱
        - from: r3
          to: r4
          label: 可能削弱
        - from: r4
          to: r5
          label: 驱动
        - from: r3
          to: r6
          label: 传导至
        - from: r5
          to: r6
          label: 传导至
    claimRefs:
      - CR003
      - CR011
      - CR018
      - CR021
      - CR037
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: 关键依赖横跨监管方、伙伴渠道、支付 / 控制轨道和机构资金提供方。
    data:
      nodes:
        - id: p1
          label: 澳门监管保护伞
          detail: 授权和政策支持
        - id: p2
          label: OCP / 伙伴网络
          detail: 发起和控制
        - id: p3
          label: 支付 / 数据轨道
          detail: ARM 可行性
        - id: p4
          label: 机构投资者 / 基金
          detail: 资金供给
        - id: p5
          label: 银行 / 贷款方
          detail: 杠杆和验证
        - id: p6
          label: 底层 SME
          detail: 现金流来源
      edges:
        - from: p1
          to: p4
          label: 促成信任
        - from: p2
          to: p6
          label: 控制接入
        - from: p3
          to: p6
          label: 捕捉数据
        - from: p6
          to: p4
          label: 支撑回报
        - from: p4
          to: p5
          label: 传递信心
        - from: p5
          to: p6
          label: 支撑扩张
    claimRefs:
      - CR005
      - CR013
      - CR025
      - CR026
      - CR033
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 决策框架从战略稀缺性和规模证明出发，落到未解的经济模型，并给出跟踪建议。
    data:
      nodes:
        - id: f1
          label: 战略利好
          detail: 获牌澳门交易场所、新资产类别、创始人履历
        - id: f2
          label: 机构验证
          detail: Series C、HSBC 授信、评级里程碑、Jane Street 信号
        - id: f3
          label: 规模证明
          detail: 到 2023 年底声称 10k+ 家企业和 RMB4B
        - id: f4
          label: 经济模型缺口
          detail: 公开记录没有收入、利润率、违约或已实现投资者回报
        - id: f5
          label: 高剩余风险
          detail: 监管、流动性和中国宏观敞口仍然显著
        - id: f6
          label: 跟踪
          detail: 保持接触，但必须守住价格和条款纪律
      edges:
        - from: f1
          to: f6
        - from: f2
          to: f6
        - from: f3
          to: f6
        - from: f4
          to: f6
        - from: f5
          to: f6
    approximationNotes: 这条流程是基于留存证据的定性承保图，不是财务模型。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV006
      - CV008
      - CV009
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 示意锚点柱展示上一轮已知估值相对情景中点和披露融资标记的位置。
    data:
      items:
        - label: 悲观情形中点
          value: 900
          unit: USDm
        - label: 基准情形中点
          value: 1600
          unit: USDm
        - label: 上一轮明确估值
          value: 1700
          unit: USDm
        - label: 乐观情形中点
          value: 2200
          unit: USDm
        - label: 官方披露股权融资额（2022+2023）
          value: 528
          unit: USDm
        - label: 融资跟踪口径总额锚点
          value: 578
          unit: USDm
    approximationNotes: 情景柱是分析性中点；融资柱是留存的公开锚点，只用于方向性参考。
    claimRefs:
      - CV010
      - CV011
      - CV013
      - CV021
      - CV022
      - CV023
      - CV024
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 情景区间显示，当前证据簇支持的是围绕 2023 年独角兽估值线的一条宽区间，而不是精确公允价值。
    data:
      items:
        - label: 悲观情形
          low: 700
          mid: 900
          high: 1100
          unit: USDm
        - label: 基准情形
          low: 1400
          mid: 1600
          high: 1800
          unit: USDm
        - label: 乐观情形
          low: 2000
          mid: 2200
          high: 2400
          unit: USDm
        - label: 上一轮明确估值
          low: 1700
          mid: 1700
          high: 1700
          unit: USDm
        - label: 优先观察入场区间
          low: 1000
          mid: 1150
          high: 1300
          unit: USDm
    approximationNotes: 区间是基于判断的估值带，反映证据集中战略稀缺性与严重披露限制并存。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
      - CV031
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 式记分卡显示，战略质量强于证据质量和估值清晰度。
    data:
      items:
        - label: 市场重要性
          value: 8
          max: 10
          note: 中国小微企业融资需求仍大，结构性供给不足
        - label: 产品差异化
          value: 8
          max: 10
          note: DRO 加 MCEX 组合新颖，战略辨识度高
        - label: 机构验证
          value: 7
          max: 10
          note: 大额融资、HSBC 授信、评级里程碑和 2024 年延期都释放兴趣信号
        - label: 经济模型可见性
          value: 3
          max: 10
          note: 收入、利润率和回报仍披露不足
        - label: 监管耐久度
          value: 5
          max: 10
          note: 有真实牌照优势，但长期解释风险仍高
        - label: 流动性证明
          value: 4
          max: 10
          note: 市场深度证据仍比平台叙事薄
        - label: 估值支撑
          value: 5
          max: 10
          note: 2023 年轮次支撑一条估值带，不支撑盲目溢价
        - label: 退出就绪度
          value: 3
          max: 10
          note: 公开层面看不到 IPO、M&A 或新的定价退出路径
    approximationNotes: 分数是私募市场承保的定性决策辅助，不是公式化评级。
    claimRefs:
      - CV006
      - CV008
      - CV014
      - CV018
      - CV030
      - CV032
      - CV040
      - CV044
