            body: >-
              平台依赖
              OCP、渠道、发行方、券商和锚定投资者，既带来规模优势，也留下脆弱的失效点。股东信称，伙伴是低成本部署的关键，因此伙伴集中风险是内生的。进入新地域或资产类型——例如东南亚、建筑承包商融资——可以扩大可服务市场，但也会成倍增加执行复杂度。竞争又叠一层风险：如果嵌入式金融玩家或中国本土既有机构掌握更多商户触点，Micro
              Connect 可能扛下基础设施复杂度，却拿不到足够份额。多边模式下，任一端失灵——商户需求、伙伴激活、投资者胃纳或监管接受度——都会拖弱其他端。相比任何单一运营指标，这种反馈环风险更关键。
