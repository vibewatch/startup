figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Micro Connect 在 2021-2022 从概念验证融资走向 2023 交易所启动、2024 监管整合，并在 2025-2026 重新定位到基金 / AI 路线。
    data:
      items:
        - label: 2021 启动
          date: '2021'
          details: 公司在香港成立；创始人组合 Charles Li 和 Gary Zhang 开始搭建收入分成市场基础设施。
        - label: 2022 Series B 轮
          date: '2022-03-31'
          details: US$70M Series B 轮验证外部投资者胃口，并意味着此前 Series A 资本大约为 US$50M。
        - label: Dec 2022 牌照
          date: '2022-12-05'
          details: 澳门行政长官批示 47/2022 授权 MCEX 法律实体和业务范围。
        - label: Aug 2023 独角兽轮
          date: '2023-08-02'
          details: US$458M Series C 轮，据报道估值 US$1.7B，为 MCEX 启动提供资金，并扩大投资者基础。
        - label: Dec 2023 评级
          date: '2023-12-21'
          details: 一只 DRO 支持的结构化产品获得初步 A(sf) 评级。
        - label: 2024 市场扩张
          date: '2024-09-26'
          details: MCEX 在 2024 早些时候获得关键基础设施认定后，新增 Micro Star。
        - label: Dec 2025 转向
          date: '2025-12-18'
          details: 公募基金挂牌计划失效，管理层转向私募基金和 AI 原生 3.0 路线。
    claimRefs:
      - CO013
      - CO015
      - CO023
      - CO027
      - CO029
      - CO030
      - CO037
  - id: FO002
    title: 公司快照逻辑
