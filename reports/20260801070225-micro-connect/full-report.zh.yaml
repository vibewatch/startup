  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 看起来产生收入和现金流入的部分
        blocks:
          - type: paragraph
            body: >-
              公开来源没有披露经审计收入，但模型如何赚钱说得很清楚。Micro Connect
              发起或标准化现金流挂钩融资合约，将其打包成可投资产品，并围绕这些资产提供交易所、基金和结构化产品基础设施。这至少创造四类可能收入流：资金成本与收入分成回收之间的利差或超额回报；来自交易所挂牌、经纪或产品打包的费用；围绕
              Leadership Fund 和计划中的 MIFC
              等载体产生的资产管理或基金经济；以及与获客、监控和数字账本运营挂钩的技术或服务经济。公司自有表述已持续从直接平台投资转向更像市场运营者的姿态，意味着随着时间推移，收费型经济相对资产负债表式仓储应更重要。
