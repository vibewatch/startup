      - number: '3.5'
        title: 护城河韧性取决于牌照与流动性是否能复利
        blocks:
          - type: paragraph
            body: >-
              Micro Connect 的护城河在两个条件同时成立时最强：第一，MCEX 和配套规则形成难以复制的监管与市场结构优势；第二，交易所积累足够多的发行方、投资者、OCP
              和实时产品形态，让流动性与标准化开始复利。已检视证据对第一点提供方向性支持，对第二点只提供部分支持。模型有监管脚手架、实时场所、产品分类和可见参与者扩张，但竞争者证据显示，外部市场仍然更看重速度、嵌入式 UX
              和可预测定价，而不是新型证券设计。主要竞争风险不是另一个公司逐字复制 DRO 术语，而是商户和资本提供方认为，更简单的嵌入式资本产品已经足够有用，导致 MCEX
              留下基础设施复杂度，却没有足够交易量。因此，竞争韧性有希望，但尚未被证明。
