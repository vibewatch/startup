      - number: '1.5'
        title: 2025-2026 年战略转向与主要尽调缺口
        blocks:
          - type: paragraph
            body: >-
              初始扩张阶段之后，最重要的新变化是公司从计划上市的公共基金转向私募资金支持的 MIFC 结构。Charles Li 在 2025 年 12 月股东信中称，2025 年 6 月 18 日提交的 A-1
              备案将失效，公司不会立即重启，并将转而推出 MIFC 这一私募载体，由 Micro Connect 自身承诺投入 $100 million 作为锚定资金。同一封信把 2026 年定义为 3.0
              阶段的起点，重点放在 AI 辅助获客、承保和账本服务上。该战略逻辑自洽，因为小额、高频现金流资产若靠人工标准化，成本很高。与此同时，外部批评并未消失：香港媒体记录了外界指称该结构类似升级版
              P2P、可能存在跨境法律缺口。核心悬而未决的问题因此是治理、损失表现、跨司法辖区法律韧性，以及新基金架构的真实经济性。
