      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 不利监管重新解读
        - 对 MCEX、DRO 结构、数据发布或跨境机制的任何明确约束
        - 会冲击核心稀缺溢价和未来扩展逻辑
        - 暂停或退出承销，直到建立新的法律图谱
      - - 资产组合表现披露疲弱
        - 已实现回款差、减值上升或投资者不满的证据
        - 会把叙事从基础设施期权改写成资产质量弱点
        - 用悲观专业金融假设重切估值
      - - 苛刻的新融资条款
        - 平轮 / 下调轮、激进优先权或实质性限制契约
        - 会显示内部投资人给业务的定价低于叙事预期
