        title: 规模、MCEX 状态与里程碑记录
        blocks:
          - type: paragraph
            body: >-
              Micro Connect 最可信的规模证据，来自公司自有的带日期里程碑和实时 MCEX 交易所计数器。到 2023 年中，HSBC 写道，平台已投资中国 180 多个城市、184 个细分行业的 2,900
              多家企业。到 2023 年底，公司披露称 10,000 多家小微企业通过平台筹集近 RMB 4 billion，且 DRO 支撑的优先贷款结构获得 CSPI 初步 A(sf) 评级。2024 年 4
              月，Micro Connect 称全球投资者已向大中华区 280 多个城市的 12,000 多家企业部署超过 $600 million。2025 年股东信把内部 1.0 阶段部署数字提高到超过 $500
              million、覆盖 13,000 多家企业；而 2026 年 8 月实时 MCEX 网站显示，累计募集资金 MOP 5.95 billion，累计分成收入 MOP 4.02 billion，挂牌资产近
              14,000 个。扩张速度亮眼，但术语变化和里程碑重述不一致，意味着不能把任何单一数字当作最终定论。
