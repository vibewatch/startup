      - number: '2.2'
        title: 需求规模、融资缺口与数字轨道
        blocks:
          - type: paragraph
            body: >-
              自上而下看，可触达融资池毫无疑问很大。Research and Markets 预计，中国中小微企业融资市场 2026 年将达 US$4.32 trillion，高于 2025 年的 US$3.88
              trillion，并在 2030 年前保持 8.2% CAGR。另据 PBOC，普惠小微贷款到 2025 年 5 月底达到 RMB 34.42 trillion，同比增长 11.6%，民营企业贷款达到 RMB
              44.95 trillion。政策推动仍在继续：中国 2024 年 10 月的融资协调机制，到 2025 年 2 月已促成超过 RMB 10 trillion
              的授信审批。这些数字说明，核心问题不是中小企业是否需要资金，而是资金能否足够高效地匹配给更小、更异质的企业，从而覆盖承保和分发成本。Micro Connect
              正是吃这个楔子：用现金流数据替代抵押品，用市场化打包替代关系型银行。
            claimRefs:
              - CM007
              - CM008
