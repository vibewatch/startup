    sections:
      - number: '8.1'
        title: 现有证据支持跟踪，而不是不问价格地接受
        blocks:
          - type: paragraph
            body: >-
              Micro Connect 比典型早期金融科技公司更具可投性，因为它已经拼出几项难以伪造的资产：澳门授权、正在运转的交易所叙事、被认可的结构化信贷里程碑、规模可观的 2023 年 Series C，以及 2024
              年后续机构融资信号。这些因素说明，不能把公司简单当作 SME
              贷款机构。与此同时，公开记录仍未披露收入、抽成率、现金生成、违约率或投资者已实现回报。投资者可以承认其战略雄心和平台架构，但还无法精确验证经济性，也就不能在任何价格上买单。因此，正确结论是「在合适入场价和条款下跟踪」，不是「回避」，也不是「只凭叙事付高价」。换句话说，公司值得继续关注，恰恰因为它可能成为一类新的市场基础设施；但当前证据仍过于不完整，尚不足以支撑按高确信度价格入场。
            claimRefs:
