      - number: '2.3'
        title: 买方、用户、付款方与工作流分层
        blocks:
          - type: paragraph
            body: >-
              这个市场有两个清晰侧面。资产侧的最终用户是小企业业主或经营者，付款方则是企业本身，通过每日收入分成付费。资本侧的买方，是寻求收益、多元化和中国消费经济实时敞口的专业投资者、基金、券商或结构化产品配置方。两侧之间还有一层合作伙伴：获客与控制伙伴、支付轨道、数据提供方、券商和交易所中介。这样的分层让
              Micro Connect
              的工作流与数字银行或发票融资提供商截然不同。企业来到平台不只是借钱；它的现金流必须被标准化成中介和投资者可以定价的合约形态。因此，渠道质量和数据可观测性至少和表面需求同样重要。也就是说，公司在商户已经数字化、由连锁或网络聚集、并且容易持续监控的场景最强。
            claimRefs:
              - CM015
              - CM016
              - CM017
              - CM018
              - CM019
              - CM020
              - CM021
