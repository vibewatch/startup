      - number: '8.3'
        title: 情景区间比伪精确更重要
        blocks:
          - type: paragraph
            body: >-
              由于公开收入和利润率披露缺失，估值只能用情景框架，而不能靠倍数硬推。牛市情景假设 Micro Connect
              能继续拓展产品宽度、重复资本深度，以及地域或垂直行业覆盖，同时不触发监管重新解释；在这种情况下，公司可以为相对上一轮的溢价找到理由。基准情景假设，2023 年独角兽估值仍大体合理，因为 MCEX
              已上线，融资支持变宽，规模表述改善，但不透明度仍然顽固。熊市情景假设，市场最终把 Micro Connect
              定价得更接近小众另类资产平台，或依赖仓储融资的专业金融公司，因为亏损、流动性和变现的公开证据仍太薄。以今天的证据看，基准情景更接近「围绕上一轮估值」，而不是大幅上行或灾难性下行。因此，区间比任何单点估值更重要。
