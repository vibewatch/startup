        blocks:
          - type: paragraph
            body: >-
              尽管利润率不可见，成本结构在概念上是清楚的。模型需要商户获客、伙伴激励、承保、风险监控、支付和账本基础设施、跨司法辖区法律文件、交易所运营，以及投资者分发。规模较小时，这些成本可能压垮一个分散的小额资产组合；这也是股东信称
              1.0 和 2.0 经验已经证明，重人力获客和风控不可持续，并且管理层现在强调 AI 原生获客和标准化的原因。更广泛的中国政策也在继续改善每日收入融资所需的数字轨道：2024
              年商贸行动计划推动企业数字化采用和更便利的合格跨境数据流动，2026 年数字人民币管理升级则显示监管仍在扩张数字支付基础设施。A(sf) 初步评级、MAP
              定价工具和伙伴主导发行的存在，说明公司试图压缩单个资产的承保和分发成本。但没有公开证据披露
              CAC、单个融资企业服务成本、总损失率，或融资量与留存利差之间的关系。换句话说，单位经济叙事有合理性，但尚未在公开层面得到证明。
