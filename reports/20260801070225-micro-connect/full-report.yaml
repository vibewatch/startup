  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: The product is a cashflow-financing stack, not a single SKU
        blocks:
          - type: paragraph
            body: >-
              Micro Connect’s public materials describe a stack that starts with revenue-linked financing for micro and
              small businesses and ends with standardized investment products for professional capital. In the older
              terminology this involved Daily Revenue Contracts and Daily Revenue Obligations; later materials expand
              the vocabulary to Cashflow Obligations, Cashflow Contingent Obligations, Revenue Based Obligations, SPVs,
              SPACs, ETFs, and RBUs. The common idea is consistent across these names: operating cashflows are captured,
              translated into contractual payout streams, standardized into investor-facing instruments, and routed
              through a market infrastructure. That makes Micro Connect less comparable to a single fintech app and more
              comparable to a combined origination, data, settlement, disclosure, and productization system. It also
              explains why evaluating the company requires market-infrastructure thinking rather than only underwriting
              thinking.
