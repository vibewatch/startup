        - Undisclosed amount; Jane Street shown as lead investor in tracker data
        - Suggests the company still accessed institutional capital after the 2023 round
        - No public post-money valuation or liquidation terms disclosed
      - - HSBC asset-backed facility
        - Credit / warehouse validation
        - Up to US$200M facility with initial US$50M credit support
        - Shows lender willingness to fund the underlying asset class
        - Debt support is not direct evidence of current equity fair value
      - - CSPI-rated DRO senior loans
        - Structured-product milestone
        - Preliminary A(sf) rating on senior loans
        - Supports underwriting argument that the asset class can be packaged for institutional capital
        - Rating applies to a specific structure, not to equity value
      - - Tracker / market-data services
        - Database cross-check
        - Caplight / Parsers show US$528M raised; Tracxn shows US$578M and 2024 extension
        - Useful for triangulation and to detect stale or missing disclosures
        - Databases conflict and should not be treated as audited truth
    notes: >-
      The cleanest equity anchor is still the 2023 round; other rows are supporting references rather than direct
      substitutes for fair value.
