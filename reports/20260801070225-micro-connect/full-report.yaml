      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The biggest risk is interpretation, not just execution
            body: >-
              Micro Connect can execute well and still face a broken thesis if regulators or counterparties decide the
              structure should not scale as management expects.
            calloutType: risk
