  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competition is a three-front problem, not a single peer set
        blocks:
          - type: paragraph
            body: >-
              Micro Connect does not compete against just one kind of company. The nearest substitutes for a small
              business owner are revenue-based finance providers such as Clearco, Wayflyer, Uncapped, and Choco Up, all
              of which market fast, non-dilutive growth capital with flexible repayment structures. A second competitive
              front is embedded-finance infrastructure players such as Liberis, Pipe, Parafin, and Capchase, which do
              not need to own a licensed exchange if they can control the platform through which merchants are sourced
              and financed. The third front is China’s own digital-finance incumbents—Ant Group, WeBank, and
              MYbank—which already possess payments, data, and SME-distribution advantages even if their products are
              not framed as revenue-sharing securities. This means Micro Connect’s true benchmark is not headline
              funding volume alone, but whether its exchange-based model creates a distribution, risk, or liquidity
              advantage those alternatives cannot easily copy.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP015
