      - number: '8.3'
        title: Scenario ranges matter more than false precision
        blocks:
          - type: paragraph
            body: >-
              Because public revenue and margin disclosure is missing, the valuation exercise must be scenario-based
              rather than multiple-driven. The bull case assumes that Micro Connect can keep expanding product breadth,
              repeat-capital depth, and geographic or vertical reach without triggering regulatory re-interpretation; in
              that case, the company could justify a premium to the last round. The base case assumes the 2023 unicorn
              mark is still directionally reasonable because MCEX launched, financing support broadened, and scale
              claims improved, but opacity remains stubborn. The bear case assumes the market eventually prices Micro
              Connect closer to a niche alternative-asset platform or warehouse-heavy specialty-finance business because
              public evidence on losses, liquidity, and monetization remains too thin. On today’s evidence, the base
              case is closer to “around the last mark” than to either sharp upside or catastrophic downside. That is why
              the range matters more than any single-point estimate.
            claimRefs:
              - CV021
              - CV022
