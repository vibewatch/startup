        title: Exhibits
        blocks:
          - type: callout
            title: Micro Connect’s closest substitutes are simpler than it is
            body: >-
              Most rivals sell fast, non-dilutive capital without asking merchants or partners to adopt a new market
              structure. That simplicity is a real competitive asset.
