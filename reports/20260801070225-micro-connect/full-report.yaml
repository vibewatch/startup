  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk is the core thesis-break variable
        blocks:
          - type: paragraph
            body: >-
              Micro Connect deliberately sits at the boundary between onshore operating assets, offshore capital, and a
              new market structure built in Macao. That creates strategic upside, but it also makes regulatory
              interpretation the single most important risk variable. Public materials emphasize the Macao executive
              order, key-infrastructure-operator recognition, SAFE-compatible routing, and offshore investor structures,
              yet external coverage repeatedly frames the model as novel, difficult to classify, or vulnerable to
              scrutiny. HK01 explicitly referenced P2P-style concerns. The FT podcast transcript said the business sits
              in a regulatory grey area and could face problems if Beijing dislikes the data or structures involved.
              Even supportive sources such as Bloomberg’s Macao feature imply that MCEX depends on a regulator willing
              to understand new mechanisms that others may reject. In short, legality is not binary here; the risk is
              adverse interpretation, scope narrowing, or slowed replication.
            claimRefs:
              - CR001
              - CR002
              - CR003
