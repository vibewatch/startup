              - CP028
              - CP033
      - number: '3.3'
        title: Direct peers mostly win on simplicity, speed, and channel fit
        blocks:
          - type: paragraph
            body: >-
              The direct peers reviewed here generally sell simplicity. Clearco advertises ecommerce and SaaS funding
              with fast review cycles, multiple funding structures, and no dilution. Wayflyer markets flexible capital
              from US$5,000 to US$20 million and says it has funded more than 7,000 businesses. Uncapped emphasizes
              fixed-fee working capital without equity loss or personal guarantees. Choco Up positions itself as
              flexible startup and sales-based financing across Asia and advertises more than US$2.5 billion of total
              GMV funded and 1,000-plus funding rounds. These offers are easier for founders to understand than Micro
              Connect’s exchange-centric stack, but they do not claim the same secondary-market or
              institutional-asset-conversion capability. That is the core competitive trade-off: user simplicity versus
              capital-markets ambition.
            claimRefs:
              - CP015
              - CP016
              - CP017
              - CP018
              - CP019
              - CP020
              - CP021
              - CP022
          - type: table
            tableRef: TP003
            claimRefs:
              - CP016
              - CP017
              - CP018
              - CP020
              - CP024
      - number: '3.4'
        title: Embedded platforms and Chinese incumbents may be the more dangerous medium-term threat
        blocks:
          - type: paragraph
            body: >-
              The most dangerous long-term competitors may be the companies that control merchant distribution or
              payments rather than those that merely market funding. Liberis says its platform reaches 15 countries and
              supports multiple funding products from a single integration. Parafin says it has extended more than US$35
              billion in offers and funded more than 50,000 businesses through platforms merchants already trust. Pipe
              and Capchase similarly frame finance as embedded inside existing workflows. In China, Ant Group, WeBank,
              and MYbank already sit close to payments or SME digital-finance activity at huge scale. If platforms or
              payment networks can source merchants, observe cashflows, and deliver capital in-context, they may weaken
              Micro Connect’s partner moat unless MCEX creates a meaningfully better outcome for both originators and
              investors.
            claimRefs:
              - CP023
              - CP024
              - CP025
              - CP026
              - CP027
              - CP028
              - CP029
          - type: figure
            figureRef: FP003
            claimRefs:
