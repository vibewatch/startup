              - CP023
              - CP028
      - number: '3.2'
        title: Where Micro Connect is genuinely differentiated
        blocks:
          - type: paragraph
            body: >-
              Micro Connect’s clearest differentiation is structural rather than purely commercial. Its ecosystem
              materials, MAP release, and Micro Star launch all describe a model that converts business cashflows into
              standardized, tradable assets for professional investors, with MCEX acting as a licensed venue and market
              framework rather than just a funding app. That is materially different from lenders and embedded-finance
              APIs that mainly originate and service capital products inside their own balance-sheet or partner-credit
              structures. The implication is that Micro Connect is trying to compete less on the cheapest merchant
              advance and more on being a market maker for an asset class. If that works, it could produce deeper
              capital access and secondary-market benefits; if it does not, the model risks being outcompeted by simpler
              capital products that are easier to explain and distribute.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP039
          - type: table
            tableRef: TP002
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP023
              - CP029
          - type: figure
            figureRef: FP002
            claimRefs:
