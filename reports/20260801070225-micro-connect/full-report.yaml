      - number: '5.2'
        title: ARM, MAP, and Micro Star are the three core technical layers
        blocks:
          - type: paragraph
            body: >-
              The most detailed technical disclosures come from the official MAP and Micro Star blogs. ARM is the
              collection and control layer: it uses payment aggregation, virtual banking, or other digital tools to
              observe revenue and route daily cashflows. MAP is the accounting, disclosure, pricing, and comparability
              layer: it standardizes contract information, payout forecasts, daily collections, taxes, and risk metrics
              so investors and issuers can negotiate and monitor products. Micro Star is the market-operating layer: it
              defines digital vehicles such as RBOs, SPVs, SPACs, ETFs, and RBUs, then adds matching, repo mechanics,
              disclosure, and clearing logic to make them tradeable. Together these three layers are the heart of the
              company’s product and technology thesis.
