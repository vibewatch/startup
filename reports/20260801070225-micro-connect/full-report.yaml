            body: >-
              Micro Connect’s asset class is ultimately exposed to the health of small businesses and consumer demand.
              World Bank and other macro sources show that China’s economy still faces uneven demand and confidence. If
              the underlying stores or contractors slow, investors may collect more slowly, accept lower returns, or
              suffer losses. The product may avoid some fixed-interest rigidity, but it does not avoid economic reality.
              At the company level, public materials still do not disclose default rates, net losses, vintage outcomes,
              or investor IRRs. That means credit risk, mark-to-model risk, and capital-adequacy risk must be inferred
              rather than measured. The HSBC facilities, rating milestone, and funding rounds are supportive, but they
