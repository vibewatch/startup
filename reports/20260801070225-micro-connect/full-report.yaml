  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Adverse regulatory reinterpretation
        - Any clear constraint on MCEX, DRO structures, data publication, or cross-border mechanics
        - Would attack the core scarcity premium and future scaling logic
        - Pause or exit underwriting until a new legal map is established
      - - Weak portfolio performance disclosure
        - Evidence of poor realized collections, rising impairment, or investor dissatisfaction
        - Would reframe the story from infrastructure optionality to asset-quality weakness
        - Re-cut valuation using downside specialty-finance assumptions
      - - Punitive new financing terms
        - Flat/down round, aggressive preferences, or materially restrictive covenants
        - Would show private insiders value the business below narrative expectations
        - Demand a large entry discount or step away
      - - Liquidity does not deepen
        - Persistent inability to broaden repeat investors or recycle capital
        - Would weaken the exchange-premium argument materially
        - Treat the company as a financing originator with limited platform value
      - - Execution sprawl outruns controls
        - AI, new geographies, or new products expand faster than governance and reporting
        - Would raise risk without proving monetization
        - Delay investment until governance catches up
    notes: These triggers are designed to change the recommendation quickly if new evidence arrives.
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Portfolio performance
        - Vintage-level defaults, collections, recovery curves, and investor IRRs
        - Directly determines whether the platform merits an exchange premium
        - Request portfolio tape, servicing dashboards, and loss policy
      - - Economics
        - Revenue, take rate, gross margin, cash burn, and operating leverage
        - Separates a compelling story from a compelling business
        - Request audited or management financial statements
      - - Cap table and terms
        - Current capitalization, preferences, anti-dilution, side letters, and 2024-2026 terms
        - Shows whether nominal upside is available to a new investor
        - Request cap-table waterfall and round documents
      - - Liquidity and investor depth
        - Repeat LP/investor behavior, turnover, and secondary activity
        - Tests whether MCEX behaves like a market or a marketing narrative
        - Request investor cohort and turnover data
      - - Regulatory durability
        - Counsel memo on enforceability, data, and cross-border compliance
        - Core determinant of downside skew
        - Obtain external legal memo across Macao, Hong Kong, and PRC
      - - Funding dependency
        - Warehouse terms, covenant package, and refinancing assumptions
        - Clarifies whether growth depends on brittle external capital
        - Review facility documents and treasury plan
    notes: Each ask is chosen because it can move the recommendation, risk rating, or fair-value band materially.
    claimRefs:
      - CV040
      - CV041
      - CV042
      - CV043
      - CV044
