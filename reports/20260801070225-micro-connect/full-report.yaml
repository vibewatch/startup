      - number: '1.4'
        title: Scale, MCEX status, and milestone record
        blocks:
          - type: paragraph
            body: >-
              Micro Connect's most credible scale evidence comes from its own dated milestones and the live MCEX
              exchange counters. By mid-2023 HSBC wrote that the platform had already invested in more than 2,900
              businesses across more than 180 Chinese cities and 184 sub-sectors. By the end of 2023 company disclosures
              said more than 10,000 micro and small businesses had raised nearly RMB 4 billion through the platform, and
              a DRO-backed senior-loan structure received a preliminary A(sf) rating from CSPI. In April 2024 Micro
              Connect said global investors had deployed over $600 million to more than 12,000 businesses across over
              280 cities in Greater China. The 2025 shareholder letter raised the internal 1.0 deployment figure to more
              than $500 million across over 13,000 businesses, while the live MCEX site in August 2026 displayed MOP
              5.95 billion cumulative funds raised, MOP 4.02 billion cumulative revenue shared, and nearly 14,000 listed
              assets. The pace of scaling is impressive, but changing terminology and inconsistent milestone
              restatements warrant caution when using any single figure as definitive.
