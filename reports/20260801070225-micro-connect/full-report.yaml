companyProfile:
  summary: >-
    Micro Connect is a Hong Kong private fintech and market-infrastructure company founded in 2021 by Charles Li and
    Gary Zhang. The company created a revenue-sharing financing model for China's micro and small businesses and paired
    it with MCEX in Macao, a licensed venue designed to help package and distribute cashflow-linked products to
    professional investors. Public evidence supports the view that Micro Connect is more ambitious than a conventional
    SME lender, but also shows that its economics and current fair value remain much less transparent than its market
    narrative.
