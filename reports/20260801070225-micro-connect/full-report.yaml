      - number: '1.5'
        title: 2025-2026 strategic pivot and principal diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The most important new development after the initial scaling phase is the pivot from a planned listed
              public fund to a privately funded MIFC structure. In the December 2025 shareholder letter, Charles Li said
              the June 18, 2025 A-1 filing would lapse, that the company would not reactivate it immediately, and that
              Micro Connect would instead launch MIFC as a private vehicle anchored by a $100 million commitment from
              Micro Connect itself. The same letter frames 2026 as the start of a 3.0 phase focused on AI-assisted
              origination, underwriting, and ledger services. This is strategically coherent because small-ticket,
              high-volume cashflow assets are expensive to standardize manually. At the same time, external criticism
              has not disappeared: Hong Kong media documented accusations that the structure resembled an upgraded P2P
              model with potential cross-border legal gaps. The core open questions are therefore governance, loss
              performance, legal durability across jurisdictions, and the real economics of the new fund architecture.
            claimRefs:
