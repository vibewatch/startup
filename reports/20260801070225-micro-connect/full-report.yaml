      - number: '4.4'
        title: Cost structure and unit-economics signals
        blocks:
          - type: paragraph
            body: >-
              The cost structure is conceptually visible even though the margins are not. The model requires merchant
              sourcing, partner incentives, underwriting, risk monitoring, payment and ledger infrastructure, legal
              documentation across jurisdictions, exchange operations, and investor distribution. At small scale, these
              costs can overwhelm a distributed, small-ticket portfolio; that is why the shareholder letter says the 1.0
              and 2.0 experience proved that people-heavy acquisition and risk control are unsustainable, and why
              management now emphasizes AI-native origination and standardization. Broader Chinese policy also keeps
              improving the digital rails that make daily-revenue financing possible: the 2024 commerce action plan
              pushes digital business adoption and easier qualified cross-border data flows, while the 2026 digital-yuan
              management upgrade shows regulators still expanding digital-payment infrastructure. The existence of an
              A(sf) preliminary rating, MAP pricing tools, and partner-led issuance suggests the company is trying to
              compress underwriting and distribution cost per asset. But no public evidence discloses CAC, servicing
              cost per financed business, gross loss rates, or the relationship between financing volume and retained
              spread. In other words, the unit-economics narrative is plausible but not yet demonstrated publicly.
