      - number: '8.2'
        title: The last clean equity anchor is still the August 2023 round
        blocks:
          - type: paragraph
            body: >-
              The strongest public price anchor remains the August 2023 Series C round: official company material says
              Micro Connect raised US$458 million, while Forbes and Tracxn pair that round with a US$1.7 billion
              valuation and total funding around US$578 million. That is helpful, but not the same thing as having a
              current fair value. Secondary databases are directionally useful yet noisy: Caplight and Parsers VC show
              US$528 million raised using only the clearly disclosed 2022 and 2023 rounds, while Tracxn also records an
              undisclosed November 2024 Series C extension led by Jane Street. Meanwhile, the HSBC facility and the
              A(sf) structured-credit rating support the idea that investors and lenders see real value in the asset
              class, but these are financing and risk-transfer milestones, not direct substitutes for current equity
              price discovery. They improve confidence that the company is real and financeable, while leaving the core
              question of present equity value stubbornly open.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
