      - number: '2.5'
        title: What public market data still cannot answer
        blocks:
          - type: paragraph
            body: >-
              The public data is good at showing that the need is large, digital rails are deep, and alternative finance
              is expanding. It is much weaker at sizing Micro Connect's true serviceable market or proving long-run
              underwriting quality. No public source reviewed provides a clean China-specific TAM for revenue-based
              finance, a quantified SAM limited to digitally visible store operators, or a market-share figure for Micro
              Connect within institutional SME finance. Market-research sources also use different taxonomies: some
              define the opportunity as all MSME lending, some as alternative lending, and some as the
              revenue-based-financing product category. Those top-down lenses are helpful for context but insufficient
              for precise valuation. The practical bottom-up question is how many businesses have digitally observable
              daily revenue, enough volatility-adjusted cash generation, and enough channel support to be financed
              repeatedly at acceptable loss rates. That answer remains private.
            claimRefs:
              - CM033
              - CM034
              - CM035
              - CM036
              - CM037
