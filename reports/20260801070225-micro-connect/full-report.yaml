  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The evidence supports a track recommendation, not blind price acceptance
        blocks:
          - type: paragraph
            body: >-
              Micro Connect looks more investable than a typical early-stage fintech because it has already combined
              several hard-to-fake assets: a Macao authorization, a live exchange narrative, recognized
              structured-credit milestones, a sizable 2023 Series C, and a follow-on institutional funding signal in
              2024. Those factors argue against treating the company like a simple SME lender. At the same time, the
              public record still does not disclose revenue, take rate, cash generation, default rates, or investor
              realized returns. That means investors can underwrite the strategic ambition and the platform
              architecture, but they cannot yet validate the economics with enough precision to pay any price. The right
              conclusion is therefore “track at the right entry and terms”, not “avoid” and not “pay up on narrative
              alone”. Said differently, the company may deserve continued attention precisely because it could become a
              new category of market infrastructure, but the current evidence is still too incomplete for a
              conviction-priced entry.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
