        title: 'Customer base is multi-sided: businesses, investors, and partners'
        blocks:
          - type: paragraph
            body: >-
              Micro Connect does not have a single buyer persona. On one side are micro and small businesses—initially
              concentrated in consumer retail, food and beverage, services, and culture & sports, with newer forays into
              e-commerce and construction-adjacent working capital. On another side are professional investors and funds
              that buy single-name or portfolio-style cashflow exposure. A third segment, crucial to activation,
              consists of partners and intermediaries that source, verify, or manage opportunities. The ecosystem page,
              founder blogs, and launch materials consistently describe all three groups as necessary to make the model
              work. For customer analysis, that means the “customer” is partly the merchant, partly the investor, and
              partly the partner who controls or aggregates the merchant relationship. Each segment also experiences a
              different value proposition and switching-cost profile materially.
