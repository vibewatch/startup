        title: Funding history, investor base, and capital structure
        blocks:
          - type: paragraph
            body: >-
              Publicly verified funding chronology is strong through August 2023 and becomes thinner afterward. Micro
              Connect's March 2022 Series B announcement states the round was $70 million and brought cumulative
              fundraising to $120 million, implying an earlier Series A of about $50 million. The August 2023 Series C
