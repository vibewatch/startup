      - number: '7.2'
        title: Operational risk is concentrated in data integrity, partner behavior, and market plumbing
        blocks:
          - type: paragraph
            body: >-
              The model depends on daily revenue visibility, automated cashflow routing, standardized disclosure, and
              market-operating infrastructure working together without major failure. The MAP and Micro Star blogs
              describe an elegant system—ARM, repo logic, disclosure, clearing, and market vehicles—but they do not
              publish the software-operating metrics that would validate resilience. If partner-collected data is wrong,
              if payment control leaks, if matching or settlement misfires, or if forecasts diverge materially from
              reality, investor confidence could deteriorate quickly. The same concern applies to AI-assisted
              origination and digital-ledger services announced in the 3.0 roadmap: automation may reduce cost, but it
              can also create model-risk and explainability problems if governance is weak. These are classic
              infrastructure risks with unusually asymmetric reputational impact because the product is built on trust
              in cashflow precision.
