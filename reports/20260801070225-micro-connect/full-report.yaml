              The verified founder set is Charles Li and Gary Zhang, not the Gary Liu identity in the seed prompt.
              Official company materials consistently present Charles Li as founder and chairman and Gary Zhang as
              founder plus CEO or vice chairman depending on the date of the source. The founder backgrounds matter to
              the thesis: Li previously led Hong Kong Exchanges and Clearing and also held senior China roles at J.P.
              Morgan and Merrill Lynch, while Gary Zhang came from Oriental Patron. Public materials also show a broader
