              - CR028
      - number: '7.4'
        title: Partner, geographic, and execution risks could slow compounding
        blocks:
          - type: paragraph
            body: >-
              The platform’s dependence on OCPs, channels, issuers, brokerages, and anchor investors creates both scale
              advantages and brittle points of failure. The shareholder letter says partners are essential to low-cost
              deployment, which means partner concentration risk is inherent. Expansion into new geographies or asset
              types—such as Southeast Asia or construction-contractor finance—can increase addressable market, but it
              also multiplies execution complexity. Competition adds another risk layer: if embedded-finance players or
              Chinese incumbents control more merchant touchpoints, Micro Connect may bear infrastructure complexity
              without winning sufficient share. Because the model is multi-sided, failure on any one side—merchant
              demand, partner activation, investor appetite, or regulatory comfort—can weaken the others. This
              feedback-loop risk is more important than any single operational metric.
            claimRefs:
              - CR025
              - CR026
              - CR027
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
          - type: table
            tableRef: TR004
            claimRefs:
              - CR029
              - CR030
              - CR031
              - CR032
              - CR035
          - type: figure
            figureRef: FR003
            claimRefs:
              - CR005
              - CR013
              - CR025
              - CR026
              - CR033
      - number: '7.5'
        title: Mitigations are real, but the residual risk rating remains high
        blocks:
          - type: paragraph
            body: >-
              Micro Connect does not lack mitigants. It has a Macao authorization, a visible market venue, an official
              standards effort, an early rating, an HSBC lending relationship, and a management team deeply familiar
              with exchange architecture. Those matter. But none of them eliminate the biggest residual questions: how
              regulators will treat a scaled version of this model, what actual loss and return histories look like
              through a weaker macro cycle, whether liquidity truly develops, and whether the platform can automate
              enough to preserve margins without compromising controls. The investment implication is therefore not
              “avoid at all costs” but “high-potential, high-residual-risk, thesis must be monitored continuously”.
              Several triggers would break the story quickly, including hostile regulatory interpretation, weak
              underlying collections, or failure of the fund/operator transition to attract repeat capital.
            claimRefs:
              - CR033
              - CR034
              - CR035
              - CR036
