            title: The macro market is not the same as the serviceable market
            body: >-
              Top-down China MSME lending numbers are useful context, but Micro Connect only addresses the subset of
              businesses with observable cashflows, scalable partner coverage, and investor-ready standardization.
            calloutType: insight
