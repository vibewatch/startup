        title: 'Financial verdict: capitalized but still opaque'
        blocks:
          - type: paragraph
            body: >-
              Micro Connect does not look undercapitalized for a private company at its stage, but its public data
              remains too incomplete for true underwriting. The equity rounds, rating milestone, and HSBC facilities
              collectively show that sophisticated capital providers are willing to support the architecture. However,
              that support should not be confused with proof of attractive margins or durable cash generation. The
              critical missing pieces are audited revenue, fee take rates, yield after losses, collection performance
              through weak-consumption periods, warehouse utilization, covenant headroom, and a clear bridge from
              platform scale to operating profit. Third-party profile pages such as Caplight add little beyond filing
              metadata, which underlines how sparse public financial disclosure still is. Multiple 2026
              management-linked media wrappers also keep emphasizing bond-market potential, AI-enabled cashflow rights,
              and broader “investment economics”, but those narratives still do not close the P&L gap. Until hard
