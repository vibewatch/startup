  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: What market Micro Connect is actually in
        blocks:
          - type: paragraph
            body: >-
              Micro Connect is easiest to misunderstand if it is placed into only one market bucket. It is not merely a
              lender, not merely a fintech software vendor, and not merely an exchange. The most practical market
              definition is a three-layer intersection: China's MSME financing market, the emerging global
              revenue-based-financing and embedded-finance market, and the digital-payment/data infrastructure that
              makes store-level cashflows observable. The company is pursuing a subset of MSME financing where repayment
              can be tied directly to operating revenue rather than collateral or fixed amortization. That means the
              included spend is growth and working capital for cash-flow-generating small businesses; the excluded spend
              is consumer lending, large corporate treasury, mortgage-style collateral finance, and pre-revenue startup
              equity. This boundary matters because headline China-finance TAMs are enormous, while Micro Connect's true
              serviceable market depends on digital visibility, partner channels, and investor appetite for non-standard
              assets.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
