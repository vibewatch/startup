chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, geography, and operating model
        blocks:
          - type: paragraph
            body: >-
              Micro Connect describes itself as market infrastructure connecting global capital with the real economy
              rather than as a conventional lender or equity investor. The company was founded in Hong Kong in 2021 and
              built its operating footprint around Hong Kong capital-markets talent, mainland-China origination and data
              collection, and a regulated exchange venue in Macao. Its core proposition is revenue-based finance: it
              advances capital to small businesses and collects an agreed share of daily revenue rather than a fixed
              coupon or equity dilution. The company's terminology has evolved from Daily Revenue Contracts in 2022 to
              Daily Revenue Obligations in 2023 and cashflow obligations / real-world cashflows in the 2025 shareholder
              letter, but the operating logic remains consistent: digitize store-level cashflows, standardize them, and
              package them for professional investors.
