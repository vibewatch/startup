      - number: '2.2'
        title: Demand size, financing gap, and digital rails
        blocks:
          - type: paragraph
            body: >-
              At the top-down level, the addressable financing pool is unquestionably large. Research and Markets pegs
              China's MSME financing market at US$4.32 trillion in 2026, up from US$3.88 trillion in 2025, with 8.2%
              CAGR through 2030. Separately, the PBOC said inclusive loans to micro and small enterprises reached RMB
              34.42 trillion by the end of May 2025, up 11.6% year on year, and loans to privately controlled
              enterprises reached RMB 44.95 trillion. The policy push is still active: China's October 2024
              financing-coordination mechanism had already generated more than RMB 10 trillion of credit approvals by
              February 2025. These figures imply that the core problem is not whether SMEs need capital; it is whether
              capital can be matched to smaller, more heterogeneous businesses efficiently enough to clear underwriting
              and distribution costs. Micro Connect benefits from precisely that wedge, because it targets cash-flow
              data as a substitute for collateral and uses market packaging as a substitute for relationship banking.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM022
              - CM023
      - number: '2.3'
        title: Buyer, user, payer, and workflow segmentation
        blocks:
          - type: paragraph
            body: >-
              There are two distinct sides to the market. On the asset side, the end user is the small business owner or
              operator, while the payer is the business itself through daily revenue sharing. On the capital side, the
              buyer is a professional investor, fund, broker, or structured-product allocator seeking yield,
              diversification, and live exposure to China's consumer economy. In between sits a layer of partners:
              origination and control partners, payment rails, data providers, brokers, and exchange intermediaries.
              This segmentation gives Micro Connect a structurally different workflow from digital banks or
              invoice-finance providers. A business does not come to the platform merely to borrow; instead, its
              cashflows must be standardized into a contract form that intermediaries and investors can price. That
              makes channel quality and data observability at least as important as headline demand. It also means the
              company is strongest where merchants are already digital, clustered by chain or network, and easy to
              monitor continuously.
            claimRefs:
              - CM015
              - CM016
              - CM017
              - CM018
              - CM019
              - CM020
              - CM021
          - type: table
            tableRef: TM003
            claimRefs:
              - CM015
              - CM016
              - CM017
              - CM018
              - CM019
      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest structural drivers are digitization, payment-rail penetration, policy support for SMEs, and
              investor appetite for non-dilutive capital solutions. China's online retail sales and cross-border
              e-commerce volumes remain massive, and official policy continues to encourage digital transformation by
              commerce-sector SMEs. Mordor Intelligence argues that China still represents the largest single geography
              within Asia-Pacific fintech, while business-user fintech demand is growing faster than retail. Global RBF
              research also shows Asia-Pacific as the fastest-growing region. Yet the model faces meaningful
              constraints. The World Bank sees subdued domestic demand, softer employment and income growth, and
              cautious household spending as headwinds for China in 2026. Mordor also highlights fragmented
              multi-jurisdiction compliance, cyber-fraud, and data-localization burdens. Finally, WZR's review of
              China's payment-protection rules shows why reliable SME cash conversion still matters: many small
              businesses continue to face delayed-payment risk in ordinary commerce, so even good revenue-sharing
              structures depend on broader payment discipline and customer demand.
            claimRefs:
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
              - CM028
              - CM029
