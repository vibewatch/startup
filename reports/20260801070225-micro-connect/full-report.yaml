      - number: '3.5'
        title: Moat durability depends on whether licensing and liquidity compound
        blocks:
          - type: paragraph
            body: >-
              Micro Connect’s moat is strongest if two things become true simultaneously: first, MCEX and related rules
              create a hard-to-copy regulatory and market-structure advantage; second, the exchange accumulates enough
              issuers, investors, OCPs, and live product formats that liquidity and standardization begin to compound.
              The reviewed evidence supports the first point directionally and the second only partially. The model has
              regulatory scaffolding, a live venue, product taxonomy, and visible participant expansion, but competitor
              evidence shows the outside world still values speed, embedded UX, and predictable pricing more than novel
              security design. The main competitive risk is not that another company copies DRO terminology exactly; it
              is that merchants and capital providers decide a simpler embedded-capital product delivers enough utility,
              leaving MCEX with infrastructure complexity but insufficient volume. That keeps competitive durability
              promising but unproven.
            claimRefs:
              - CP030
              - CP031
              - CP032
              - CP033
              - CP034
              - CP035
              - CP036
              - CP037
              - CP038
