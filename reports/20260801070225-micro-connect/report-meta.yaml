companyProfile:
  summary: >-
    Micro Connect is a Hong Kong private fintech and market-infrastructure company founded in 2021
    by Charles Li and Gary Zhang. The company created a revenue-sharing financing model for China's
    micro and small businesses and paired it with MCEX in Macao, a licensed venue designed to help
    package and distribute cashflow-linked products to professional investors. Public evidence
    supports the view that Micro Connect is more ambitious than a conventional SME lender, but also
    shows that its economics and current fair value remain much less transparent than its market
    narrative.
  foundedDate: '2021-01-01'
  founders:
    - name: Charles Li
      role: Co-founder & Chairman
      background: >-
        Former Hong Kong Exchanges and Clearing chief executive with prior leadership roles at
        J.P. Morgan China and Merrill Lynch China.
      claimRefs: [CO003, CO009]
    - name: Gary Zhang
      role: Co-founder
      background: >-
        Public founder materials link Gary Zhang to Oriental Patron Financial Group and describe him
        as Micro Connect's CEO in launch-era materials.
      claimRefs: [CO004, CO010]
  foundingLocation: Hong Kong, SAR China
  headquarters: Hong Kong, SAR China
  productSummary: >-
    Cashflow-linked financing instruments for micro and small businesses, Daily Revenue Obligation
    / cashflow-rights style products, MCEX trading and market infrastructure, and associated fund,
    structuring, servicing, and data-control workflows.
  customerFocus: >-
    Micro and small businesses in China seeking non-dilutive growth capital; professional and
    institutional investors seeking diversified exposure to underlying business cashflows.
  businessModel: >-
    The public record suggests a mix of spread economics on financed cashflows, exchange or product
    fees, fund economics, and related market-infrastructure services, but the split among those
    revenue streams is not publicly disclosed.
  stage: Series C private
  fundingStatus: >-
    Official sources confirm a US$458M Series C in August 2023; Forbes and Tracxn pair that round
    with a US$1.7B valuation and about US$578M of total equity raised. Tracxn also records an
    undisclosed November 2024 Series C extension led by Jane Street, while HSBC later provided up
    to US$200M of asset-backed facility support.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO004, CO009, CO010, CO015, CO016, CO017, CV012, CV005]

summary:
  headline: >-
    Track: Micro Connect may be building a genuinely differentiated market for small-business
    cashflow investing, but public disclosure is still too thin to underwrite the story at any
    price.
