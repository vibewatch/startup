  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Merchant retention and repeat financing
    missingEvidence: No reviewed public source discloses how many merchants return for additional financings, how often they do so, or what share of volume comes from repeat users.
    whyItMatters: Repeat usage is the cleanest signal that the product is economically valuable to merchants rather than merely novel.
    diligencePath: Request merchant cohort tables, repeat issuance rates, renewal intervals, and reasons for churn.
    relatedQuestionRefs:
    - QU017
    - QU018
    - QU019
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: Investor repeat participation and turnover
    missingEvidence: Public materials do not disclose repeat investor purchases, secondary turnover, average hold periods, or product-level renewal behavior.
    whyItMatters: A two-sided market can look active while actually depending on a narrow or non-recurring investor base.
    diligencePath: Request investor cohort analysis, repeat-buy statistics, turnover, and realized hold-period outcomes.
    relatedQuestionRefs:
    - QU017
    - QU018
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: Customer concentration by chain, city, and partner
    missingEvidence: No public source breaks down deployment by top chains, top cities, top OCPs, or top investors.
    whyItMatters: The company’s distributed narrative could mask concentration that materially changes risk.
    diligencePath: Request top-10 concentration tables by merchant network, city, partner, and investor.
    relatedQuestionRefs:
    - QU022
    - QU023
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: Named customer economics
    missingEvidence: Named proof exists mainly as grouped issuances or market-participant lists, not store-level economics or testimonial-backed case studies.
    whyItMatters: Without merchant outcomes, it is hard to judge product value beyond gross adoption counts.
    diligencePath: Request case studies with funding amount, payback path, revenue impact, and repeat behavior.
    relatedQuestionRefs:
    - QU010
    - QU015
    - QU016
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: Southeast Asia production metrics
    missingEvidence: The SCMP Money20/20 article discusses regional ambition, but no reviewed source provides production deployment data outside China.
    whyItMatters: International expansion could materially change customer mix and TAM, but it is not yet operationally proven in public.
    diligencePath: Request pilot metrics, partner list, and deployment progress for Southeast Asia launches.
    relatedQuestionRefs:
    - QU021
    - QU024
    relatedTableRefs:
    - TU001
    - TU005
