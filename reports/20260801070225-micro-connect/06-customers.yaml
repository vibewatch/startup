schemaVersion: report-v2
artifact: customers
slug: micro-connect
runDate: '2026-08-01'
company:
  name: Micro Connect
chapter:
  number: 6
  title: Customers
  summary: 'Micro Connect has a genuinely two-sided customer surface: businesses seeking non-dilutive growth capital and professional investors seeking standardized exposure to small-business cashflows, with partners serving as the enabling distribution layer. Public proof of adoption is strong on cumulative deployment and named issuance examples, but weak on classic SaaS-style retention, satisfaction, and concentration metrics.'
sections:
- id: segments
  title: 'Customer base is multi-sided: businesses, investors, and partners'
  body: Micro Connect does not have a single buyer persona. On one side are micro and small businesses—initially concentrated in consumer retail, food and beverage, services, and culture & sports, with newer forays into e-commerce and construction-adjacent working capital. On another side are professional investors and funds that buy single-name or portfolio-style cashflow exposure. A third segment, crucial to activation, consists of partners and intermediaries that source, verify, or manage opportunities. The ecosystem page, founder blogs, and launch materials consistently describe all three groups as necessary to make the model work. For customer analysis, that means the “customer” is partly the merchant, partly the investor, and partly the partner who controls or aggregates the merchant relationship. Each segment also experiences a different value proposition and switching-cost profile materially.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory
  title: Adoption proof is strongest in cumulative deployment metrics
  body: Public adoption evidence is much stronger on cumulative scale than on cohort quality. Micro Connect disclosed more than 100 invested businesses by March 2022, over 2,900 businesses across more than 180 cities by July 2023, more than 10,000 businesses and nearly RMB 4 billion raised by end-2023, and more than 12,000 businesses across over 280 cities with more than US$600 million deployed by April 2024. The 2025 shareholder letter then said 1.0 had deployed more than US$500 million to over 13,000 businesses. MCEX’s live counters in August 2026 show 13,962 listed assets and MOP 5.95 billion of cumulative funds raised. These are meaningful adoption signals, but they remain stock metrics, not retention or unit-economics metrics.
  claimRefs:
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: named-proof
  title: Named proof exists, but mostly through grouped issuances and market participants
  body: Named-customer proof exists, though often at portfolio or grouped-brand level rather than clean case-study format. The East China and Sichuan releases show specific regional store baskets successfully listed through MCEX, including 22 stores under six brands in eastern China and 23 stores under six brands in Sichuan. The Micro Star launch named market participants such as GATHERING, Venturant Group, Gloryland, Choco Up, OpenGMV, Meetsocial, Hopu Investments, and Plum Ventures. Riverchain provides proof that the model is being adapted to construction-contractor working capital. Choco Up’s partnership and market participation show that some users of the platform may also be adjacent financiers rather than only end-borrowers. This is credible production proof, but it is less legible than a classic enterprise-software customer roster with contract values and testimonials. That difference matters when evaluating reference quality.
  claimRefs:
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: durability
  title: Durability is inferred from repetition and expansion, not directly measured
  body: 'The biggest customer diligence gap is durability. There is no public NRR, GRR, merchant churn, investor repeat-rate, contract renewal rate, or satisfaction score. Instead, durability must be inferred from signs such as repeated scaling milestones, successive product layers, the continuation from 1.0 to 2.0 to 3.0, and the fact that new issuances and new participant types continued appearing after the initial launch. That is useful, but not enough to distinguish between healthy recurring usage and constant replenishment of new cohorts. For investors, the same problem applies: public materials show participation, listings, and structures, but not repeat-buy behavior or hold-period outcomes by cohort.'
  claimRefs:
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  tableRefs:
  - TU004
- id: expansion-concentration
  title: Expansion is visible; concentration risk is still largely hidden
  body: 'Expansion evidence is visible in geography, sector, and channel breadth. The model expanded from China chain stores to wider geographic coverage, then to market participants across Hong Kong, Macao, mainland China, and overseas, and later to Southeast Asia discussion and construction-contractor use cases. At the same time, concentration risk is hard to quantify because Micro Connect does not publicly disclose the share of deployment coming from its largest partner networks, largest brands, largest cities, or largest investors. That leaves a key unresolved question: whether the appearance of a highly distributed base masks practical dependence on a narrower set of chains, landlords, platforms, or anchor investors. The customer story is therefore promising but still partly opaque. Public breadth should not be mistaken for proven diversification today.'
  claimRefs:
  - CU029
  - CU030
  - CU031
  - CU032
  - CU033
