tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale signal
  - Revenue / strategic value
  - Gap
  rows:
  - - Micro and small businesses in China
    - User and beneficiary; indirect payer via revenue share
    - Growth capital for stores and operating businesses
    - 10,000+ to 13,000+ businesses disclosed across milestones
    - Core asset supply and business-model proof
    - No public distribution by revenue band or top-chain concentration
  - - Professional investors / funds
    - Buyer and capital provider
    - Direct and portfolio exposure to cashflow instruments
    - MCEX products, SPACs, ETFs, funds, live counters
    - Capital supply and valuation formation
    - Repeat participation and turnover undisclosed
  - - Partners / OCPs / intermediaries
    - User and channel enabler
    - Origination, control, data visibility, market access
    - Ecosystem and founder blogs show central role
    - Distribution reach and lower customer-acquisition cost
    - Economics, exclusivity, and concentration undisclosed
  - - Regional / cross-border expansion participants
    - Buyer / issuer / partner depending on structure
    - Southeast Asia and non-mainland opportunities
    - Money20/20 commentary and partnerships
    - Future TAM expansion and platform diversification
    - No public production-scale metrics outside China yet
  - - Adjacent financiers on platform
    - Buyer / issuer / intermediary
    - Use MCEX or partner with Micro Connect for product distribution
    - Choco Up and other named participants at Micro Star event
    - Could accelerate network effects
    - Could also capture economics or weaken direct customer ownership
  notes: For a multi-sided market, strategic value and usage role matter as much as “who pays cash” in a conventional SaaS sense.
