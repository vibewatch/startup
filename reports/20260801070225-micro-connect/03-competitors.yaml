    - Fast capital estimate and flexible financing
    - Realized pricing by risk band
    - Transparent merchant framing helps acquisition
  - - Uncapped
    - Fixed fee promoted upfront
    - Working capital for inventory / marketing / PO needs
    - True blended cost by cohort
    - Simple economics compete well for founder trust
  - - Clearco
    - No dilution; multiple capacity products; payment schedule estimated
    - Cash advance, invoice funding, rolling capacity
    - Precise pricing grids publicly limited
    - Breadth of funding formats can capture repeat users
  - - Choco Up
    - Simple fee structure; unsecured business financing and AR financing
    - Flexible financing plus account-manager support
    - Comparable APR / fee by segment
    - Strong regional operating flexibility without exchange complexity
  - - Embedded-finance platforms
    - Usually partner-specific, loan or installment based
    - Pre-approved offers inside workflow
    - End-customer economics often not public
    - Distribution advantage may trump novel asset design
