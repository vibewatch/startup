  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Merchant win-rate versus simpler alternatives
    missingEvidence: No reviewed source discloses how often merchants choose Micro Connect over conventional RBF, embedded-finance, or bank alternatives.
    whyItMatters: Without competitive conversion data it is hard to know whether the exchange model is a practical advantage or a more complex wrapper around a similar financing need.
    diligencePath: Request merchant funnel, competitor-lost reasons, pricing comparisons, and partner-side conversion data.
    relatedQuestionRefs:
    - QP019
    - QP023
    - QP025
    relatedTableRefs:
    - TP003
    - TP004
  - type: private-evidence-only
    severity: material
    topic: OCP depth and exclusivity
    missingEvidence: The reviewed record explains why Origination and Control Partners matter but not how many OCPs are active, how exclusive they are, or how much flow each contributes.
    whyItMatters: Distribution power may be the decisive moat variable against embedded-finance competitors and Chinese incumbents.
    diligencePath: Request OCP roster, volumes, tenure, economics, exclusivity clauses, and concentration analysis.
    relatedQuestionRefs:
    - QP019
    - QP020
    - QP022
    relatedTableRefs:
    - TP002
    - TP004
  - type: private-evidence-only
    severity: material
    topic: Secondary-market liquidity versus primary origination
    missingEvidence: Public sources show exchange activity and product types but not turnover, bid-ask depth, repeat investor trading, or price discovery quality relative to peers.
    whyItMatters: If liquidity is thin, MCEX may not create the capital-markets advantage that justifies its greater complexity.
    diligencePath: Request primary-secondary split, turnover ratios, days-to-fund, order-book statistics, and investor cohort behavior.
    relatedQuestionRefs:
    - QP022
    - QP025
    relatedTableRefs:
    - TP002
    - TP004
  - type: missing-source
    severity: material
    topic: Incumbent China competitor overlap at product level
    missingEvidence: Reviewed incumbent sources confirm enormous ecosystem presence but do not publish a like-for-like comparison against revenue-sharing or DRO-style products.
    whyItMatters: The true threat from incumbents may come from adjacent data and payment control rather than explicit product matching, but that overlap remains inferential.
    diligencePath: Review Chinese SME credit product catalogs, partner APIs, and bank/merchant case studies for closer substitution evidence.
    relatedQuestionRefs:
    - QP021
    relatedTableRefs:
    - TP001
    - TP002
  - type: private-evidence-only
    severity: material
    topic: Partner economics when competitors collaborate with MCEX
    missingEvidence: Public materials show Choco Up and others engaging with MCEX, but not the economics, control rights, or conflict boundaries of these relationships.
    whyItMatters: Coopetition could strengthen the platform or expose it to channel capture depending on incentive design.
    diligencePath: Request partner agreements, issuer economics, brokerage incentives, and data-sharing rules.
    relatedQuestionRefs:
    - QP024
    - QP025
    relatedTableRefs:
    - TP004
