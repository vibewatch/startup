- id: competitor-profiles
  title: Direct peers mostly win on simplicity, speed, and channel fit
  body: 'The direct peers reviewed here generally sell simplicity. Clearco advertises ecommerce and SaaS funding with fast review cycles, multiple funding structures, and no dilution. Wayflyer markets flexible capital from US$5,000 to US$20 million and says it has funded more than 7,000 businesses. Uncapped emphasizes fixed-fee working capital without equity loss or personal guarantees. Choco Up positions itself as flexible startup and sales-based financing across Asia and advertises more than US$2.5 billion of total GMV funded and 1,000-plus funding rounds. These offers are easier for founders to understand than Micro Connect’s exchange-centric stack, but they do not claim the same secondary-market or institutional-asset-conversion capability. That is the core competitive trade-off: user simplicity versus capital-markets ambition.'
  claimRefs:
  - CP015
  - CP016
  - CP017
  - CP018
  - CP019
  - CP020
  - CP021
  - CP022
