- id: distribution-and-lockin
  title: Embedded platforms and Chinese incumbents may be the more dangerous medium-term threat
  body: The most dangerous long-term competitors may be the companies that control merchant distribution or payments rather than those that merely market funding. Liberis says its platform reaches 15 countries and supports multiple funding products from a single integration. Parafin says it has extended more than US$35 billion in offers and funded more than 50,000 businesses through platforms merchants already trust. Pipe and Capchase similarly frame finance as embedded inside existing workflows. In China, Ant Group, WeBank, and MYbank already sit close to payments or SME digital-finance activity at huge scale. If platforms or payment networks can source merchants, observe cashflows, and deliver capital in-context, they may weaken Micro Connect’s partner moat unless MCEX creates a meaningfully better outcome for both originators and investors.
  claimRefs:
  - CP023
  - CP024
  - CP025
  - CP026
  - CP027
  - CP028
  - CP029
  figureRefs:
  - FP003
- id: moat-durability
  title: Moat durability depends on whether licensing and liquidity compound
  body: 'Micro Connect’s moat is strongest if two things become true simultaneously: first, MCEX and related rules create a hard-to-copy regulatory and market-structure advantage; second, the exchange accumulates enough issuers, investors, OCPs, and live product formats that liquidity and standardization begin to compound. The reviewed evidence supports the first point directionally and the second only partially. The model has regulatory scaffolding, a live venue, product taxonomy, and visible participant expansion, but competitor evidence shows the outside world still values speed, embedded UX, and predictable pricing more than novel security design. The main competitive risk is not that another company copies DRO terminology exactly; it is that merchants and capital providers decide a simpler embedded-capital product delivers enough utility, leaving MCEX with infrastructure complexity but insufficient volume. That keeps competitive durability promising but unproven.'
