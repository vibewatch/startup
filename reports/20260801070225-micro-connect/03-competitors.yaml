company:
  name: Micro Connect
chapter:
  number: 3
  title: Competitors
  summary: 'Micro Connect has no perfect like-for-like public competitor because it combines revenue-based small-business finance, exchange infrastructure, and cross-border capital-market plumbing. Competition instead comes from three directions: revenue-based finance providers chasing the same merchants, embedded-finance platforms controlling distribution to SMBs, and Chinese digital-finance incumbents that can price credit more cheaply if they ever target the same use case aggressively.'
sections:
- id: landscape
  title: Competition is a three-front problem, not a single peer set
  body: Micro Connect does not compete against just one kind of company. The nearest substitutes for a small business owner are revenue-based finance providers such as Clearco, Wayflyer, Uncapped, and Choco Up, all of which market fast, non-dilutive growth capital with flexible repayment structures. A second competitive front is embedded-finance infrastructure players such as Liberis, Pipe, Parafin, and Capchase, which do not need to own a licensed exchange if they can control the platform through which merchants are sourced and financed. The third front is China’s own digital-finance incumbents—Ant Group, WeBank, and MYbank—which already possess payments, data, and SME-distribution advantages even if their products are not framed as revenue-sharing securities. This means Micro Connect’s true benchmark is not headline funding volume alone, but whether its exchange-based model creates a distribution, risk, or liquidity advantage those alternatives cannot easily copy.
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
