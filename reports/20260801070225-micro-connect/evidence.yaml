evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Governance and board composition
    missingEvidence: >-
      No reviewed public source provides a full board roster, committee structure, voting-control map, or formal
      succession plan.
    whyItMatters: >-
      Founder quality is central to the thesis, so weak visibility into oversight and succession materially raises
      key-person and governance risk.
    diligencePath: >-
      Request board materials, shareholder agreement summaries, committee charters, and management-organization
      documents in formal diligence.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: 2024 funding extension economics
    missingEvidence: >-
      Public sources reviewed here identify a Nov. 15, 2024 Series C extension and Jane Street involvement, but do not
      disclose the amount, valuation change, or investor rights.
    whyItMatters: >-
      Entry-price discipline and dilution analysis depend on round size, security terms, and whether the extension
      changed liquidation preference or governance rights.
    diligencePath: >-
      Request the 2024 subscription agreement, cap-table bridge, and investor-rights changes; confirm whether Jane
      Street has strategic commercial side letters.
    relatedQuestionRefs:
      - QO009
      - QO010
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: Series C amount inconsistency
    missingEvidence: >-
      The official about page restates the Series C as US$468M while the contemporaneous 2023 press release and
      independent reporting say US$458M.
    whyItMatters: >-
      Even small discrepancies reduce confidence in milestone rollups and can compound when building later valuation,
      ownership, and deployment bridges.
    diligencePath: >-
      Use primary financing documents and the audited capitalization table as the source of record; verify whether the
      difference reflects a typo or a later adjustment.
    relatedQuestionRefs:
      - QO008
      - QO010
      - QO025
    relatedTableRefs:
      - TO001
      - TO004
  - type: private-evidence-only
    severity: material
    topic: Loss, default, and return performance by asset vintage
    missingEvidence: >-
      No public source reviewed provides realized default rates, recovery curves, net investor returns by vintage, or
      loss attribution across sectors and cities.
    whyItMatters: >-
      The company's core promise depends on risk-adjusted cashflow performance rather than just origination volume.
      Without performance data, scale alone is not enough to underwrite the model.
    diligencePath: >-
      Request vintage-level portfolio tapes, impairment policy, realized and expected loss metrics, and investor
      cashflow statements.
    relatedQuestionRefs:
      - QO016
      - QO025
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: Legal-entity map across Hong Kong, Macao, mainland operations, and MIFC
    missingEvidence: >-
      Public disclosures identify MCEX and MIFC but do not fully map the legal entities that warehouse assets, originate
      contracts, hold IP, and contract with investors across jurisdictions.
    whyItMatters: >-
      Cross-border legal clarity determines bankruptcy remoteness, enforceability of cashflow rights, tax leakage, and
      regulatory exposure.
    diligencePath: >-
      Request the full legal-entity chart, intercompany agreements, tax structuring memo, and regulatory opinions for
      Hong Kong, Macao, and mainland China.
    relatedQuestionRefs:
      - QO020
      - QO024
    relatedTableRefs:
      - TO003
      - TO004
  - type: missing-source
    severity: material
    topic: China-specific RBF TAM
    missingEvidence: >-
      No reviewed public source isolates a China-only revenue-based-financing TAM that matches Micro Connect's product
      definition.
    whyItMatters: Without a consistent denominator, claims about category leadership or market penetration are easy to overstate.
    diligencePath: >-
      Build a bottom-up TAM from digital merchant counts, chain / franchise density, partner coverage, and eligibility
      criteria for revenue-share financing.
    relatedQuestionRefs:
      - QM020
      - QM021
      - QM023
    relatedTableRefs:
      - TM002
      - TM007
  - type: private-evidence-only
    severity: material
    topic: Micro Connect serviceable-market share
    missingEvidence: >-
      Public scale statistics exist, but there is no disclosed denominator for how many businesses are actually eligible
      for Micro Connect's model.
    whyItMatters: >-
      Market share is required to judge whether the company is still in blue-ocean expansion or already hitting the best
      parts of the market.
    diligencePath: Request internal segmentation of eligible merchants by sector, city, digitization readiness, and partner channel.
    relatedQuestionRefs:
      - QM022
      - QM025
    relatedTableRefs:
      - TM003
      - TM007
  - type: private-evidence-only
    severity: material
    topic: Loss-adjusted market quality
    missingEvidence: >-
      Top-down market data does not show default rates, recovery rates, or cashflow volatility for the exact merchant
      cohorts Micro Connect targets.
    whyItMatters: >-
      A large financing market is not investable if repayment volatility is too high or underwriting costs are too
      large.
    diligencePath: >-
      Request vintage-level performance and loss data by sector and city, then compare against macro slowdowns and
      payment-cycle stress.
    relatedQuestionRefs:
      - QM017
      - QM018
      - QM025
    relatedTableRefs:
      - TM005
      - TM007
  - type: conflicting-data
    severity: minor
    topic: Market taxonomy mismatch
    missingEvidence: >-
      Different sources describe the opportunity as MSME lending, alternative lending, embedded finance, or
      revenue-based financing, which are not interchangeable.
    whyItMatters: Misaligned taxonomy can inflate TAM claims or distort competitor comparisons.
    diligencePath: >-
      Normalize every cited market source to a shared include/exclude framework before using it for valuation or share
      analysis.
    relatedQuestionRefs:
      - QM020
      - QM023
    relatedTableRefs:
      - TM001
      - TM002
  - type: private-evidence-only
    severity: minor
    topic: Expansion beyond retail and services
    missingEvidence: >-
      Public sources show some movement toward construction and broader sectors, but do not quantify how large
      non-retail cohorts are becoming.
    whyItMatters: Cross-sector expansion is a key driver of future TAM and risk diversification.
    diligencePath: >-
      Request issuance volume and performance split by sector, including construction, e-commerce, and service
      categories.
    relatedQuestionRefs:
      - QM024
      - QM025
    relatedTableRefs:
      - TM003
      - TM006
  - type: private-evidence-only
    severity: material
    topic: Merchant win-rate versus simpler alternatives
