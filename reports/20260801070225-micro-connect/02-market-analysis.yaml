  - - Brokers / structured-product intermediaries
    - Brokerage or arranger
    - Execution and sales teams
    - Issuer / investor fees
    - Need standardized products that can be placed efficiently
    - Critical for market depth and distribution
  notes: The market is two-sided. Micro Connect must satisfy both merchant adoption and investor underwriting/distribution requirements at the same time.
