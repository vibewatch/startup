    - Business revenue share
    - Needs fast non-dilutive capital for inventory, fit-out, or marketing
    - Core asset-side user segment
  - - Chain / franchise networks
    - Brand HQ or network operator
    - Store managers and franchisees
    - Business revenue share
    - Needs repeatable financing template across many outlets
    - Best fit for standardized deployment
  - - Origination and Control Partners (OCPs)
    - Platform or ecosystem operator
    - Merchant network managers
    - Partner economics plus downstream merchants
    - Monetize network visibility and control through financing channel
