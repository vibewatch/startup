  - CM026
  - CM027
  - CM028
  - CM029
  - CM030
  - CM031
- id: TM006
  title: Adjacent-market evidence table
  columns:
  - Adjacent market or player
  - Public evidence
  - What it suggests about buyer behavior
  - Relevance to Micro Connect
  - Limitation
  rows:
  - - Funding Societies
    - S$6B+ financed across Southeast Asian SME loans
    - Institutional and retail capital will fund digital SME-credit channels at scale
    - Proves SME digital-finance demand in Asia
    - Traditional lending, not exchange-traded revenue share
  - - Liberis
    - Embedded finance in 15 countries via partner platforms
    - Platform-embedded SME funding can scale cross-border when channels are strong
    - Useful benchmark for partner-led distribution
    - Merchant-cash-advance/embedded model differs from MCEX
  - - Parafin
    - 50,000+ businesses funded via platform partners
    - Embedded capital can become a feature of larger software / commerce ecosystems
    - Shows partner-distribution power
    - US-centric, not China-specific
  - - Clearco
    - $3B deployed and 10,000+ brands funded
    - Revenue-linked funding resonates with digital merchants
    - Evidence for non-dilutive funding demand
    - E-commerce focus and North America bias
  - - Capchase
    - $2B+ financing volume in B2B tech purchases
    - Alternative finance buyers also value term-flexibility and instant underwriting
    - Signals investor and borrower appetite for payment-smoothing products
    - Enterprise-software use case, not storefront cashflows
  - - Ant Group / WeBank
    - Inclusive digital-finance scale in China
    - Chinese users already accept digital financial products when embedded in daily workflows
    - Supports behavioral feasibility
    - Very different regulatory status and product set
  notes: These adjacencies show that Micro Connect is not creating demand from nothing; it is adapting financing to a different asset and distribution architecture.
  claimRefs:
  - CM017
  - CM018
  - CM019
  - CM020
  - CM021
  - CM022
  - CM023
- id: TM007
  title: Evidence gaps and contradictory estimates table
  columns:
  - Gap / contradiction
  - Observed public evidence
  - Why it limits underwriting
  - Most likely owner of the data
  - Next diligence step
  rows:
  - - China-specific RBF TAM
    - Global RBF reports and broad China MSME lending datasets exist, but not a clean China RBF number
    - Hard to test whether Micro Connect is early or already large in its true niche
    - Micro Connect / specialist industry researchers
    - Build bottom-up TAM from digital storefront counts and issuance eligibility
  - - Serviceable market share
    - Public scale metrics exist, but denominator does not
    - Impossible to know how penetrated the target segment really is
    - Micro Connect / industry bodies
    - Estimate target business universe by sector, city, and digitization
  - - Loss-adjusted unit economics of the market
    - Macro data shows need, not repayment quality
    - Market size says little about investability
    - Micro Connect / originators / investors
    - Request vintage performance and default curves
  - - Market taxonomy mismatch
    - MSME lending, alternative finance, and RBF reports use different definitions
    - Can cause inflated TAM claims or false peer comparisons
    - Research vendors and management teams
    - Normalize every comparison to included / excluded spend
  - - Demand resilience under weak consumption
    - World Bank flags demand softness, but merchant-vintage sensitivity is undisclosed
    - Macro slowdown could shrink practical opportunity even as top-down TAM rises
    - Micro Connect and investors
    - Stress-test exposure by sector and city against consumer slowdown
  notes: This chapter intentionally preserves contradictions between broad lending TAMs and narrow product-specific TAMs rather than smoothing them away.
