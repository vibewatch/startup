- id: TM005
  title: Adoption constraints and risk transfer table
  columns:
  - Constraint
  - Who feels it most
  - Transmission mechanism
  - Why it matters
  - Diligence ask
  rows:
  - - Weak consumer demand
    - Store operators and investors
    - Lower sales reduce revenue-share collections and widen payback periods
    - Directly hits the asset performance Micro Connect packages
    - Request same-store sales and sector mix by vintage
  - - Delayed commercial payments
    - SMEs in supply chains and project businesses
    - Cash conversion delays reduce ability to share daily revenue reliably
    - Important for expansion beyond retail into construction and services
    - Stress-test payment-cycle assumptions by sector
  - - Regulatory fragmentation
    - Exchange operator and structured-product investors
    - Different rules across Hong Kong, Macao, mainland, and offshore investors
    - Could limit scalability or raise compliance cost
    - Obtain legal opinions and license scope mapping
  - - Data / cyber risk
    - Partners, payment rails, and merchants
    - Revenue visibility depends on continuous accurate digital data flows
    - Operational integrity is part of underwriting quality
    - Review controls, outages, and fraud-loss data
  - - Market-education burden
    - Investors and merchants
    - RBF / DRO / CFO terminology remains unfamiliar versus loans
    - Can slow distribution and make pricing less efficient
    - Track investor onboarding times and repeat issuance rates
  notes: These are structural adoption constraints, not just company-specific execution risks.
