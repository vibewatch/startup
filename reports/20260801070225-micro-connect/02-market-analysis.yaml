  evidenceGaps:
  - type: missing-source
    severity: material
    topic: China-specific RBF TAM
    missingEvidence: No reviewed public source isolates a China-only revenue-based-financing TAM that matches Micro Connect's product definition.
    whyItMatters: Without a consistent denominator, claims about category leadership or market penetration are easy to overstate.
    diligencePath: Build a bottom-up TAM from digital merchant counts, chain / franchise density, partner coverage, and eligibility criteria for revenue-share financing.
    relatedQuestionRefs:
    - QM020
    - QM021
    - QM023
    relatedTableRefs:
    - TM002
    - TM007
  - type: private-evidence-only
    severity: material
    topic: Micro Connect serviceable-market share
    missingEvidence: Public scale statistics exist, but there is no disclosed denominator for how many businesses are actually eligible for Micro Connect's model.
    whyItMatters: Market share is required to judge whether the company is still in blue-ocean expansion or already hitting the best parts of the market.
    diligencePath: Request internal segmentation of eligible merchants by sector, city, digitization readiness, and partner channel.
    relatedQuestionRefs:
    - QM022
    - QM025
    relatedTableRefs:
    - TM003
    - TM007
  - type: private-evidence-only
    severity: material
    topic: Loss-adjusted market quality
    missingEvidence: Top-down market data does not show default rates, recovery rates, or cashflow volatility for the exact merchant cohorts Micro Connect targets.
    whyItMatters: A large financing market is not investable if repayment volatility is too high or underwriting costs are too large.
    diligencePath: Request vintage-level performance and loss data by sector and city, then compare against macro slowdowns and payment-cycle stress.
    relatedQuestionRefs:
    - QM017
    - QM018
    - QM025
    relatedTableRefs:
    - TM005
    - TM007
  - type: conflicting-data
    severity: minor
    topic: Market taxonomy mismatch
    missingEvidence: Different sources describe the opportunity as MSME lending, alternative lending, embedded finance, or revenue-based financing, which are not interchangeable.
    whyItMatters: Misaligned taxonomy can inflate TAM claims or distort competitor comparisons.
    diligencePath: Normalize every cited market source to a shared include/exclude framework before using it for valuation or share analysis.
    relatedQuestionRefs:
    - QM020
    - QM023
    relatedTableRefs:
    - TM001
    - TM002
