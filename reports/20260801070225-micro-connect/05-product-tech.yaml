company:
  name: Micro Connect
chapter:
  number: 5
  title: Product & Technology
  summary: Micro Connect is not just a financing product; it is a multi-layer operating system for turning SME cashflows into investable, monitorable, and increasingly tradable financial products. The strongest evidence lies in the ARM + MAP + MCEX / Micro Star stack, but important implementation details—especially security, uptime, partner economics, and real-world secondary liquidity—remain public gaps.
sections:
- id: product-definition
  title: The product is a cashflow-financing stack, not a single SKU
  body: 'Micro Connect’s public materials describe a stack that starts with revenue-linked financing for micro and small businesses and ends with standardized investment products for professional capital. In the older terminology this involved Daily Revenue Contracts and Daily Revenue Obligations; later materials expand the vocabulary to Cashflow Obligations, Cashflow Contingent Obligations, Revenue Based Obligations, SPVs, SPACs, ETFs, and RBUs. The common idea is consistent across these names: operating cashflows are captured, translated into contractual payout streams, standardized into investor-facing instruments, and routed through a market infrastructure. That makes Micro Connect less comparable to a single fintech app and more comparable to a combined origination, data, settlement, disclosure, and productization system. It also explains why evaluating the company requires market-infrastructure thinking rather than only underwriting thinking.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: architecture
  title: ARM, MAP, and Micro Star are the three core technical layers
  body: 'The most detailed technical disclosures come from the official MAP and Micro Star blogs. ARM is the collection and control layer: it uses payment aggregation, virtual banking, or other digital tools to observe revenue and route daily cashflows. MAP is the accounting, disclosure, pricing, and comparability layer: it standardizes contract information, payout forecasts, daily collections, taxes, and risk metrics so investors and issuers can negotiate and monitor products. Micro Star is the market-operating layer: it defines digital vehicles such as RBOs, SPVs, SPACs, ETFs, and RBUs, then adds matching, repo mechanics, disclosure, and clearing logic to make them tradeable. Together these three layers are the heart of the company’s product and technology thesis.'
  claimRefs:
  - CE008
  - CE009
  - CE010
  - CE011
  - CE012
  - CE013
