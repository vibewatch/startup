tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - DRC / CFO / CCO contract layer
    - Businesses and investors
    - Live / iterating
    - Cashflow-linked financing without equity dilution
    - Public term-level performance by cohort missing
  - - DRO / RBO investor instruments
    - Professional investors
    - Live / iterating
    - Investor-facing contractual cashflow claims
    - Precise legal ranking and realized return dispersion unclear
  - - DRP / SPAC / ETF portfolio wrappers
    - Fund managers and diversified investors
    - Live / expanding
    - Portfolio packaging for diversified exposure
    - Public mix, turnover, and liquidity data limited
  - - ARM
    - Businesses, partners, investors
    - Core operating layer
    - Daily revenue capture and payout automation
    - No public uptime / resilience metrics
  - - MAP
    - Investors, issuers, intermediaries
    - Core operating layer
    - Standardized disclosure, valuation, and pricing scaffolding
    - No public dataset or open spec download reviewed
  - - Micro Star
    - Issuers, managers, traders
    - Launched Sept 2024
    - Digital market structure for issuance, trading, repo, packaging
    - Adoption depth and trading frequency unclear
  - - MIFC / fund layer
    - Institutional capital
    - Transitioning in 2025-2026
    - Could turn stack into scalable portfolio vehicle
    - Fund economics, control model, and operating cadence undisclosed
  notes: 'Terminology evolves across materials, but the functional stack is consistent: cashflow capture, standardization, packaging, distribution, and monitoring.'
