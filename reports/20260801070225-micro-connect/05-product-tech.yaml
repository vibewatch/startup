- id: trust-controls
  title: Trust and control mechanisms are explicit, but not fully auditable from public data
  body: 'Micro Connect clearly understands that its product only works if investors trust the data, legal routing, and payout mechanics. The MAP blog repeatedly emphasizes disclosure, valuation, custody-like standardization, settlement, and market institutions. The Micro Star blog adds claims around high-frequency distributions, forecast disclosure, repo terms, automated matching, and CCP clearing. Separate public releases add regulatory and quality wrappers: MCEX’s Macao authorization, key-infrastructure-operator status, an A(sf) preliminary rating on DRO-backed senior loans, Shariah-compliant screening, and HSBC asset-backed leverage. Yet these public milestones still stop short of offering the type of independent system documentation a technical investor would want, such as uptime metrics, penetration testing, SOC reports, or failure-recovery procedures. The company has built a strong narrative of control; it has not yet published a full operating-control dossier.'
  claimRefs:
  - CE024
  - CE025
  - CE026
  - CE027
  - CE028
  - CE029
  - CE030
  - CE031
  tableRefs:
  - TE004
- id: roadmap-risks
  title: The roadmap is ambitious and increasingly AI-mediated
  body: 'The technology roadmap is moving from mechanical origination and disclosure toward AI-assisted underwriting, digital ledger services, and portfolio-level market infrastructure. The shareholder letter and 2025 founder’s blog frame this as necessary because small-ticket, high-volume, heterogeneous opportunities are too costly for purely manual operations. That logic is credible, but it raises fresh questions: what parts of underwriting and monitoring are actually automated today, how robust are the control loops, and whether AI makes the system more scalable without creating new model-risk or explainability burdens. The roadmap is impressive; the public evidence for production-grade operational metrics is not yet equally mature. Investors should therefore treat the roadmap as a promising scaling thesis rather than as already-proven technical fact today.'
