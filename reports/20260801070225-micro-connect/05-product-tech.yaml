- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Company solution
  - Measurable benefit
  - Limitation
  rows:
  - - Merchant raises growth capital
    - Share future revenue instead of taking fixed debt or equity dilution
    - Cashflow-linked contract backed by ARM connectivity
    - Potentially faster, non-dilutive capital
    - Needs digital cashflow visibility and partner enablement
  - - Investor accesses granular SME cashflows
    - Would otherwise face high due-diligence and monitoring costs
    - DRO/RBO products plus MAP disclosures and MCEX structures
    - Standardized, comparable product format
    - Actual realized liquidity still uncertain
  - - Partner monetizes network reach
    - Platform/landlord/SaaS provider controls merchant flow but not capital market access
    - OCP / partner integration into origination and control workflow
    - New revenue stream and capital access for network
    - Economics and exclusivity not public
  - - Fund manager creates diversified basket
    - Would otherwise assemble bespoke contracts one by one
    - SPAC / ETF / portfolio wrappers
    - More scalable diversified exposure
    - Public historical basket performance limited
  - - Issuer lists on a lighter-touch venue
    - Traditional public markets too costly and complex
    - Micro Star digital vehicles and distribution-driven market rules
    - Lower barrier than traditional listing logic
    - Still requires compliance with novel market rules
  notes: The product must satisfy at least four constituencies—businesses, investors, partners, and managers—so workflow complexity is intrinsic.
