- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - ARM payment-data layer
    - Observe revenue, split cashflows, automate collections
    - Payment aggregators, virtual accounts, merchant adoption
    - Data loss, leakage, or weak controls undermine trust
  - - Origination and control network
    - Source, vet, and manage opportunities
    - Chains, SaaS, landlords, banks, platforms, local partners
    - Partner concentration or weak incentives reduce throughput quality
  - - MAP disclosure layer
    - Standardize terms, forecasts, payouts, and valuation metrics
    - Data quality, template discipline, investor acceptance
    - Poor or inconsistent disclosure damages comparability
  - - Registration / custody / issuance layer
    - Translate contracts into offshore investor instruments
    - Legal structuring, custody logic, cross-border routing
    - Documentation or legal-enforceability gaps
  - - Settlement / clearing layer
    - Deliver cashflows and settle trades
    - Closed-loop ledger, offshore payments, CCP or clearing processes
    - Operational failure or payout delays
  - - Trading / matching / repo layer
    - Support price discovery and incremental capital formation
    - Micro Star system, buyers, sellers, repo terms
    - Thin liquidity or broken matching logic
  - - Analytics / AI layer
    - Origination, underwriting, allocation, monitoring
    - Historical data, model governance, digital ledger services
    - Model risk, drift, explainability, and false precision
  notes: Public materials are much stronger on conceptual architecture than on detailed system documentation.
