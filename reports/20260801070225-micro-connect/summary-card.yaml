  topStrengths:
    - Scarce regulatory and market-structure positioning via MCEX and Macao authorization.
    - Founder pedigree and capital-markets credibility are unusually strong for a private fintech.
    - >-
      Institutional validation includes a large Series C, HSBC asset-backed lending support, and a structured-credit
      rating milestone.
    - The model targets a very large, structurally underserved micro-SME financing market.
  topRisks:
    - Revenue, margins, default rates, investor returns, and cap-table terms remain largely private.
    - Regulatory interpretation and cross-border durability remain thesis-break variables.
    - Market-depth and repeat-investor liquidity are less proven than the platform narrative.
    - Weak Chinese consumption or SME stress would directly pressure underlying cashflow performance.
    - A later round with punitive terms could reveal materially weaker equity value than the 2023 mark.
  unresolvedGaps:
    - Current revenue, gross margin, burn, and runway
    - Vintage losses, realized investor returns, and repeat-investor behavior
    - Latest priced-round terms, liquidation preferences, and dilution stack
    - Secondary-market depth and turnover on MCEX-related products
    - Counsel-grade view on long-run regulatory portability beyond the current structure
