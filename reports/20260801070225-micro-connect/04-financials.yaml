  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: Audited revenue, margin, and burn
    missingEvidence: No public source reviewed discloses revenue, ARR, gross margin, EBITDA / net loss, monthly burn, or cash runway.
    whyItMatters: Without an audited or at least management-quality P&L, the company cannot be underwritten on conventional fintech valuation frameworks.
    diligencePath: Request audited financial statements, board reporting packs, budget versus actuals, and monthly cash reports.
    relatedQuestionRefs:
    - QI019
    - QI023
    - QI024
    - QI025
    relatedTableRefs:
    - TI001
    - TI005
    - TI008
    - TI009
  - type: private-evidence-only
    severity: blocking
    topic: Asset performance and loss data
    missingEvidence: No public source discloses default rates, delinquencies, recoveries, vintage performance, or net investor returns across financed businesses.
    whyItMatters: The core economic question is whether revenue-share cashflows are attractive after losses and servicing costs. Volume alone cannot answer that.
    diligencePath: Request vintage tapes, impairment policy, payout histories, realized IRR by product, and concentration analysis.
    relatedQuestionRefs:
    - QI019
    - QI020
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
    - TI008
  - type: missing-source
    severity: material
    topic: 2024 extension economics
    missingEvidence: The existence of a November 2024 Series C extension appears in Tracxn, but its amount, valuation effect, and rights package are not public in reviewed official sources.
    whyItMatters: Late-stage financing terms can materially affect dilution, liquidation preference, and runway assessment.
    diligencePath: Obtain financing documents and cap-table bridge for the 2024 extension round.
    relatedQuestionRefs:
    - QI012
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: Facility utilization and covenant headroom
    missingEvidence: HSBC facility sizes are public, but drawdowns, advance rates, triggers, collateral composition, and covenant headroom are not.
    whyItMatters: Warehouse economics and lender controls strongly affect whether the platform can scale without repeated equity dilution.
    diligencePath: Review debt agreements, borrowing-base reports, and covenant calculations.
    relatedQuestionRefs:
    - QI013
    - QI015
    relatedTableRefs:
    - TI004
    - TI006
  - type: private-evidence-only
    severity: material
    topic: Economics of the MIFC private-fund transition
    missingEvidence: The shareholder letter announces a private-fund pivot and a US$100M anchor, but not fund terms, fee structure, LP appetite, or target deployment pace.
    whyItMatters: The 3.0 phase likely changes both capital intensity and revenue mix; that shift is central to future valuation.
    diligencePath: Request PPM, draft LPA, warehousing arrangement, fee model, and current LP pipeline.
    relatedQuestionRefs:
    - QI015
    - QI025
    relatedTableRefs:
    - TI004
    - TI006
    - TI009
