  - TI008
- id: capital-adequacy
  title: 'Capital stack: equity, debt, and a planned fund pivot'
  body: 'Micro Connect''s financing stack has become more layered over time. The company raised early venture capital in 2021 and 2022, then a much larger Series C in August 2023 that implied roughly US$578 million of cumulative equity raised and a US$1.7 billion valuation. On top of that equity base, HSBC first provided a US$25 million asset-backed facility and later a syndicated facility of up to US$200 million with an initial US$50 million credit support tranche. The February 2024 facility announcement explicitly frames the debt as validation of DROs as an underlying asset and a way to help Micro Connect become a more disinterested operator of MCEX. The December 2025 shareholder letter then points toward the next capital-form change: MIFC will operate as a private fund, anchored by a US$100 million commitment from Micro Connect, with external LP fundraising intended to restart deployment and reduce the drag of the lapsed public-listing route.'
  claimRefs:
  - CI015
  - CI016
  - CI017
  - CI018
  - CI019
  - CI020
  - CI021
  - CI022
  tableRefs:
  - TI004
  - TI006
- id: costs-unit-economics
  title: Cost structure and unit-economics signals
  body: 'The cost structure is conceptually visible even though the margins are not. The model requires merchant sourcing, partner incentives, underwriting, risk monitoring, payment and ledger infrastructure, legal documentation across jurisdictions, exchange operations, and investor distribution. At small scale, these costs can overwhelm a distributed, small-ticket portfolio; that is why the shareholder letter says the 1.0 and 2.0 experience proved that people-heavy acquisition and risk control are unsustainable, and why management now emphasizes AI-native origination and standardization. Broader Chinese policy also keeps improving the digital rails that make daily-revenue financing possible: the 2024 commerce action plan pushes digital business adoption and easier qualified cross-border data flows, while the 2026 digital-yuan management upgrade shows regulators still expanding digital-payment infrastructure. The existence of an A(sf) preliminary rating, MAP pricing tools, and partner-led
    issuance suggests the company is trying to compress underwriting and distribution cost per asset. But no public evidence discloses CAC, servicing cost per financed business, gross loss rates, or the relationship between financing volume and retained spread. In other words, the unit-economics narrative is plausible but not yet demonstrated publicly.'
  claimRefs:
  - CI023
  - CI024
  - CI025
  - CI026
  - CI041
  - CI042
  - CI027
  - CI028
  tableRefs:
  - TI005
  - TI007
- id: financial-verdict
  title: 'Financial verdict: capitalized but still opaque'
  body: Micro Connect does not look undercapitalized for a private company at its stage, but its public data remains too incomplete for true underwriting. The equity rounds, rating milestone, and HSBC facilities collectively show that sophisticated capital providers are willing to support the architecture. However, that support should not be confused with proof of attractive margins or durable cash generation. The critical missing pieces are audited revenue, fee take rates, yield after losses, collection performance through weak-consumption periods, warehouse utilization, covenant headroom, and a clear bridge from platform scale to operating profit. Third-party profile pages such as Caplight add little beyond filing metadata, which underlines how sparse public financial disclosure still is. Multiple 2026 management-linked media wrappers also keep emphasizing bond-market potential, AI-enabled cashflow rights, and broader “investment economics”, but those narratives still do not close the
    P&L gap. Until hard economics are disclosed, the financial case rests more on architecture and capital-market acceptance than on evidenced economics. That keeps the investment view in track / research-more territory rather than conviction buy territory.
