company:
  name: Micro Connect
chapter:
  number: 4
  title: Financials
  summary: Micro Connect has disclosed enough public information to understand the skeleton of its financial model—equity capital, asset-backed leverage, fee- and spread-based monetization, and a planned shift toward a private-fund architecture—but not enough to underwrite revenue quality, losses, margins, or burn. The disclosed numbers show meaningful financing capacity and asset-market traction, yet the absence of audited performance data keeps financial conviction low.
sections:
- id: revenue-model
  title: What appears to generate revenue and cash inflow
  body: 'Public sources do not disclose audited revenue, but they are clear about how the model is supposed to earn money. Micro Connect originates or standardizes cashflow-linked financing contracts, packages them into investable products, and provides exchange, fund, and structured-product infrastructure around those assets. That creates at least four plausible revenue streams: spread or excess return between funding cost and revenue-share collections; fees from exchange listings, brokerage, or product packaging; asset-management or fund economics around vehicles such as the Leadership Fund and the planned MIFC; and technology- or service-linked economics tied to originations, monitoring, and digital ledger operations. The company''s own language has steadily migrated from direct platform investing toward a more market-operator posture, which implies that over time fee-based economics should matter more relative to balance-sheet-style warehousing.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: traction-proxies
  title: Public traction proxies are volume-based, not revenue-based
  body: The most visible financial proof points are financing-volume and scale metrics rather than P&L metrics. Micro Connect and partner disclosures show >100 investments by March 2022, >4,000 financed enterprises and more than RMB 1 billion raised during MCEX trial operations by May 2023, >2,900 funded businesses by July 2023, >10,000 businesses and nearly RMB 4 billion raised by end-2023, >12,000 businesses and >US$600 million deployed by April 2024, and >13,000 businesses plus >US$500 million of 1.0 deployment by the December 2025 shareholder letter. The live MCEX counters then show MOP 5.95 billion of cumulative funds raised and MOP 4.02 billion of cumulative revenue shared in August 2026. Those statistics imply significant gross transaction activity and secondary infrastructure development, but they do not disclose take rates, net spread, default losses, servicing costs, or realized investor IRRs. Financially, this is more like observing GMV and loan-book activity without seeing the
    income statement.
  claimRefs:
  - CI007
  - CI039
  - CI008
  - CI009
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  tableRefs:
