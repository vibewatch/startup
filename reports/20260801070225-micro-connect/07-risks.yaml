company:
  name: Micro Connect
chapter:
  number: 7
  title: Risks
  summary: 'Micro Connect’s most serious risks are not ordinary startup execution issues but structural ones: regulatory interpretation of a new asset class, dependence on data and partner control over SME cashflows, limited public proof of losses and liquidity, and exposure to China’s macro and policy environment. The company has meaningful mitigants—licenses, ratings, bank facilities, and increasingly explicit controls—but public evidence still leaves residual risk high.'
sections:
- id: regulatory-legal
  title: Regulatory and legal risk is the core thesis-break variable
  body: Micro Connect deliberately sits at the boundary between onshore operating assets, offshore capital, and a new market structure built in Macao. That creates strategic upside, but it also makes regulatory interpretation the single most important risk variable. Public materials emphasize the Macao executive order, key-infrastructure-operator recognition, SAFE-compatible routing, and offshore investor structures, yet external coverage repeatedly frames the model as novel, difficult to classify, or vulnerable to scrutiny. HK01 explicitly referenced P2P-style concerns. The FT podcast transcript said the business sits in a regulatory grey area and could face problems if Beijing dislikes the data or structures involved. Even supportive sources such as Bloomberg’s Macao feature imply that MCEX depends on a regulator willing to understand new mechanisms that others may reject. In short, legality is not binary here; the risk is adverse interpretation, scope narrowing, or slowed replication.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: operational-model
  title: Operational risk is concentrated in data integrity, partner behavior, and market plumbing
  body: 'The model depends on daily revenue visibility, automated cashflow routing, standardized disclosure, and market-operating infrastructure working together without major failure. The MAP and Micro Star blogs describe an elegant system—ARM, repo logic, disclosure, clearing, and market vehicles—but they do not publish the software-operating metrics that would validate resilience. If partner-collected data is wrong, if payment control leaks, if matching or settlement misfires, or if forecasts diverge materially from reality, investor confidence could deteriorate quickly. The same concern applies to AI-assisted origination and digital-ledger services announced in the 3.0 roadmap: automation may reduce cost, but it can also create model-risk and explainability problems if governance is weak. These are classic infrastructure risks with unusually asymmetric reputational impact because the product is built on trust in cashflow precision.'
  claimRefs:
  - CR009
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  tableRefs:
