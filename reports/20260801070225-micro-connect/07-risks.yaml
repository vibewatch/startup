- id: capital-credit
  title: Credit, funding, and macro risks remain under-disclosed
  body: Micro Connect’s asset class is ultimately exposed to the health of small businesses and consumer demand. World Bank and other macro sources show that China’s economy still faces uneven demand and confidence. If the underlying stores or contractors slow, investors may collect more slowly, accept lower returns, or suffer losses. The product may avoid some fixed-interest rigidity, but it does not avoid economic reality. At the company level, public materials still do not disclose default rates, net losses, vintage outcomes, or investor IRRs. That means credit risk, mark-to-model risk, and capital-adequacy risk must be inferred rather than measured. The HSBC facilities, rating milestone, and funding rounds are supportive, but they are not substitutes for full transparency on asset performance.
  claimRefs:
  - CR017
  - CR018
  - CR019
  - CR020
  - CR021
  - CR022
  - CR023
  - CR024
  tableRefs:
  - TR003
- id: dependency-execution
  title: Partner, geographic, and execution risks could slow compounding
  body: 'The platform’s dependence on OCPs, channels, issuers, brokerages, and anchor investors creates both scale advantages and brittle points of failure. The shareholder letter says partners are essential to low-cost deployment, which means partner concentration risk is inherent. Expansion into new geographies or asset types—such as Southeast Asia or construction-contractor finance—can increase addressable market, but it also multiplies execution complexity. Competition adds another risk layer: if embedded-finance players or Chinese incumbents control more merchant touchpoints, Micro Connect may bear infrastructure complexity without winning sufficient share. Because the model is multi-sided, failure on any one side—merchant demand, partner activation, investor appetite, or regulatory comfort—can weaken the others. This feedback-loop risk is more important than any single operational metric.'
  claimRefs:
  - CR025
  - CR026
  - CR027
  - CR028
  - CR029
  - CR030
  - CR031
  - CR032
  tableRefs:
  - TR004
