    - Collection slowdowns or rising impairment
    - Evidence of materially weak vintage performance
    - Re-rate business as asset-quality problem, not just platform story
  - - Liquidity failure
    - Low turnover or investor non-repeat
    - Persistent inability to recycle capital or widen investor base
    - Reduce confidence in exchange-premium narrative
