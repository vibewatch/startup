companyProfile:
  summary: Kakao Mobility was spun off from Kakao Corp in 2017 and built Kakao T into South Korea’s broadest mobility app, spanning taxi, designated driver, parking, enterprise mobility, EV charging, and other trip-adjacent services. The company’s domestic breadth, 45 million cumulative registered members claim, and continued investor interest support a serious strategic valuation case, but public evidence still leaves revenue quality, margin profile, and route-to-liquidity precision materially under-disclosed.
