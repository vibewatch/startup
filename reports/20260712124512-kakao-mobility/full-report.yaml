  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Domestic ride-booking and premium rivals
        blocks:
          - type: paragraph
            body: >-
              Kakao Mobility remains the domestic breadth leader, but its competitors are not all attacking the same
              layer of the market. Uber Taxi is the clearest branded ride-booking challenger in Korea after the UT
              rebrand, with particular strength among foreign visitors who already use Uber internationally and want
              continuity when they land in Seoul. TADA, by contrast, is more of a product-and-experience challenger,
              leaning into a cleaner premium proposition and business-oriented service promise. These distinctions
              matter because Korean competition is not simply “who has a taxi button.” It is also a contest over which
              brand is trusted for premium reliability, which service is easiest for a traveler to use immediately, and
              which provider can turn a single trip into a longer customer relationship. It is about who owns discovery,
              who owns brand trust for visitors, who owns premium quality perception, and who can expand from a niche
              into a broader mobility relationship with repeat usage and higher share of wallet. On today’s evidence,
              Kakao still owns the broadest domestic surface, but Uber and TADA each have sharper positioning in
              narrower slices of the market. That means competitive loss does not need to happen everywhere at once for
              Kakao to feel pressure: losing premium riders, visitor demand, or higher-frequency business travel could
              still matter disproportionately.
            claimRefs:
