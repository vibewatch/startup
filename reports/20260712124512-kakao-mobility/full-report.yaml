      - number: '3.3'
        title: International analogs and strategic takeaway
        blocks:
          - type: paragraph
            body: >-
              Grab, Gojek, Uber, Lyft, ChargePoint, and KEPCO are not all direct Korean rivals, but they help frame the
              strategic ceiling and flank risks around Kakao Mobility. Grab and Gojek show how mobility can expand into
              a regional super-app, though both sit in market structures very different from Korea. Uber and Lyft
              provide transparent public-company reference points for ride-hailing scale and disclosure quality. They
              also remind investors that public-market leaders can still look strategically different depending on
              geography, mode mix, and regulatory environment, which is why Kakao cannot be benchmarked against only one
              archetype. ChargePoint and KEPCO illustrate that EV charging competition can come from either software-led
              networks or infrastructure-centric incumbents. The practical takeaway is that Kakao Mobility does not face
              one monolithic competitor. It faces several different rival logics at once. It faces a portfolio of
              specialist threats while remaining stronger than any single domestic rival on breadth. That makes the core
              debate less about whether competitors exist and more about which verticals are most vulnerable to focused
              specialists over time. The most likely pattern is continued Kakao leadership at the broad-platform level
              alongside growing specialist competition in selected premium, enterprise, and infrastructure-linked
              workflows over the next several years in Korea.
