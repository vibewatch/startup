      - number: '5.2'
        title: Technology stack and developer surface
        blocks:
          - type: paragraph
            body: >-
              The strongest public technical evidence comes from Kakao’s own developer documentation and Android’s case
              study. Kakao exposes English documentation for mapping, local search, and navigation workflows, with
              separate conceptual, JavaScript, and Android implementation surfaces. That is meaningful because it
              suggests product assets are not trapped entirely inside the first-party app; at least parts of the stack
              are formalized enough to be documented, versioned, quota-governed, and integrated by outside developers or
              enterprise partners. The Android case study then adds a second layer of signal by showing ongoing
              experimentation with on-device AI, not just static routing or legacy matching logic. Together, the
              documents imply a modular architecture: mobility use cases sit on top of common mapping, local,
              navigation, and identity layers rather than being built as one-off workflows. That matters for technical
              underwriting because shared layers can improve leverage and release velocity, while fragmented stacks
              usually show up later as reliability, partner-integration, or roadmap-execution problems. The externally
              visible docs do not prove elegance of the internal system design, but they are strong enough to reject the
              idea that Kakao Mobility is merely a thin consumer UI sitting on undocumented vendor tools. In other
              words, the public record supports real in-house product and platform investment, even if it stops short of
              revealing the internal architecture diagrams an engineering diligence process would ultimately require.
