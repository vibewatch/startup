      - number: '6.2'
        title: Scale, adoption, and satisfaction signals
        blocks:
          - type: paragraph
            body: >-
              The strongest public adoption signals remain large but definitionally mixed. Kakao Mobility’s own ITF
              Summit post cites 45 million cumulative registered members, while Android Developers describes a base of
              more than 30 million total users. App stores add another lens: Google Play shows more than 10 million
              downloads, while Apple and Google present a striking ratings split. Satisfaction evidence from Kakao
              Mobility’s own 2025 research article is directionally strong, with 65 percent taxi satisfaction and
              materially better scores than peers, plus especially high Venti satisfaction. Training and coaching
              disclosures for brand-taxi crews also support the idea that customer experience is being operationalized
              instead of left entirely to marketplace dynamics. Still, the public record gives more evidence on
              top-of-funnel scale and satisfaction than on actual retention or monetized repeat behavior. In other
              words, customer love is easier to verify than customer durability. That distinction matters because a
              large installed base can coexist with weak monetization or low-margin repeat behavior in mobility if
              incentives or subsidies are doing the hidden work. The chapter therefore treats adoption as real, but not
              yet sufficient on its own to prove customer quality in venture or IPO terms. Durable customer quality
              requires proof of frequency, retention, and monetization, not just recognition, install volume, or
              headline satisfaction.
