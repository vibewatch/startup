      - number: '7.2'
        title: Labor, operational, and quality risk
        blocks:
          - type: paragraph
            body: >-
              Platform-labor risk is the second major risk cluster because Kakao Mobility sits in services where worker
              classification, pay rules, and service quality all have regulatory relevance. Korean labor-policy
              developments point toward broader worker protections, even if platform workers were not pulled into the
              2026 minimum-wage system. A court precedent recognizing employee status for a delivery rider shows the
              direction of travel, while policy commentary around the Yellow Envelope reform suggests more bargaining
              and legal complexity for platform-like work. For Kakao Mobility, this could raise costs directly or simply
              compress flexibility in driver-partner economics. Operationally, the public record is mixed: formal ethics
              and safety artifacts exist, but customer reviews still reveal support and language friction. Product
              sprawl also matters here because a company operating taxis, designated drivers, enterprise software,
              charging, and autonomous pilots must manage different safety, compliance, and partner obligations at once.
              The more modules the company adds, the more likely it is that one weak compliance process or one poorly
              governed edge case creates disproportionate downside for the full brand. That risk is amplified in
              mobility because safety expectations are high, regulatory overlap is common, and incidents tend to
              generate immediate consumer and political scrutiny.
