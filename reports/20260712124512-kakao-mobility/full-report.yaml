      - number: '2.2'
        title: Segments, buyers, and competitive structure
        blocks:
          - type: paragraph
            body: >-
              The Korean mobility market is broader and more fragmented than a simple “Kakao versus Uber” framing
              implies. Official Kakao pages show major demand segments across taxi, designated driver, parking, business
              travel, and global ride-booking, while SoCar, MOVV, NAVER Map, Uber Taxi, and TADA each illuminate
              different slices of the competitive field. That means customer value is being created across car-sharing,
              fleet management, reservation-led premium rides, map-led discovery, and EV-charging convenience in
              addition to basic e-hailing. The market is therefore not winner-take-all across all functions even if some
              local categories are highly concentrated. A platform like Kakao Mobility can dominate one user habit while
              still facing meaningful pressure in adjacent workflows where a specialist or map incumbent defines the
              user expectation. In Korea, the strategic question is therefore not just share of taxi bookings, but who
              controls the broader stack of discovery, reservation, payment, and follow-on convenience around movement.
              That broader stack is where super-app style advantages and switching-cost narratives become more
              believable. For Kakao Mobility, the opportunity lies in owning the integrated workflow across these
              segments, but the competitive reality is that specialized players can still matter where the
              job-to-be-done differs from immediate urban taxi matching.
