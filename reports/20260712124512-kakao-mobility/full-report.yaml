      - number: '8.2'
        title: Public comparable lens
        blocks:
          - type: paragraph
            body: >-
              Public comps provide useful boundaries even if they cannot produce a precise multiple today, on current
              public evidence. Uber, Grab, and Lyft span the range from global platform leader to regionally focused
              super-app to more narrowly scoped ride-hailing operator. StockAnalysis data shows that Uber trades at an
              entirely different scale, Grab sits in the mid-teens of billions, and Lyft remains in the
              high-single-digit billions. On headline equity value, Kakao Mobility’s private marks are therefore much
              closer to Lyft and lower-end Grab than to Uber. But comparability improves only so far: public peers file
              audited statements, publish clean revenue expectations, and trade under daily market discipline. Kakao
              Mobility does not yet offer that same transparency. The right takeaway is directional, not precise: the
              company deserves a serious peer set, but investors should not assume it automatically deserves the same
              disclosure-adjusted multiple as the cleanest public names. In valuation work, that usually means using the
              comp set to decide whether the private mark is roughly plausible, then applying a disclosure haircut
              rather than forcing a single neat public-market multiple. Put differently, the comp table is best used to
              establish outer bounds and disclosure penalties, not to manufacture a false sense of decimal-place
              precision from fundamentally different reporting regimes.
            claimRefs:
