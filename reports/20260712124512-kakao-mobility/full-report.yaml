  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and segmentation
        blocks:
          - type: paragraph
            body: >-
              Kakao Mobility’s customer surface is broader than the phrase “ride-hailing users” implies. Official
              product pages show the company serving taxi riders, designated-driver users, parking users, enterprise
              mobility buyers, EV owners, and foreign travelers, all through related flows tied to the Kakao T account
              and brand. That breadth matters because it changes what customer concentration means: the core risk is not
              dependence on one SKU, but dependence on one national mobility ecosystem. Public evidence also suggests a
              secondary customer set of developers and enterprise integrators around navigation and API assets. In
              practical terms, Kakao Mobility looks like a multi-segment demand network built on one consumer identity
              layer rather than a single marketplace. That breadth supports cross-sell and frequency, but it also means
              later diligence should test whether all of these customer motions are genuinely active or whether some are
              mostly narrative extensions around the flagship taxi use case. A strong segmentation story is not the same
              thing as a strong monetization story; some cohorts may be high-frequency but low-margin, while others may
              be strategically valuable but still too early to matter financially. That is why later financial diligence
              has to reconnect customer breadth to contribution margin, not just usage.
            claimRefs:
              - CU001
              - CU016
