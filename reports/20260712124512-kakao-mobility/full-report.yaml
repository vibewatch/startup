      - number: '1.3'
        title: Milestones and adverse context
        blocks:
          - type: paragraph
            body: >-
              Kakao Mobility’s milestone record combines unusually strong scale signals with equally material regulatory
              overhang. On the positive side, the company’s own ITF 2026 presentation positioned Kakao T as a 45
              million-member platform with a much faster dispatch loop and a 94 percent boarding-success figure, while
              an independent Android case study described a 30 million-user installed base and meaningful AI-driven
              conversion improvements. App stores reinforce distribution strength, with Google Play showing more than 10
              million downloads and Apple showing very strong iOS ratings. But the same period also carries substantial
              adverse context: Kakao Mobility publicly defended itself against Korean antitrust findings, and
              independent reporting makes clear that regulatory scrutiny remains part of the company narrative rather
              than a closed chapter. That mix is the right takeaway for later diligence: Kakao Mobility looks like a
              scaled category leader with real product depth, yet its control, regulatory, and reputation issues are
              first-order factors in any underwriting or IPO scenario. The overview chapter therefore supports a
              balanced starting view: strong product-market fit and distribution on one side, and unresolved governance,
              disclosure, and legal noise on the other. That is a useful lens for the rest of the report because almost
              every upside argument for Kakao Mobility ultimately depends on proving that scale can be converted into
              durable cash generation faster than regulation or shareholder friction can erode optionality.
