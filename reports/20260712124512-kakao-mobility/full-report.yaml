      - CR018
      - CR033
      - CR023
  - id: FR002
    title: Risk transmission map
    type: flow
    summary: Legal overhang, labor policy, and governance pressure reinforce one another rather than operating independently.
    data:
      nodes:
        - id: legal
          label: Legal and regulatory cloud
        - id: ipo
          label: Lower IPO readiness
        - id: sponsor
          label: More sponsor pressure
        - id: sale
          label: More sale or control noise
        - id: ops
          label: Management distraction / execution risk
      edges:
        - from: legal
          to: ipo
          label: disclosure and remedy risk
        - from: ipo
          to: sponsor
          label: delayed liquidity
        - from: sponsor
          to: sale
          label: exit pressure
        - from: sale
          to: ops
          label: strategic churn
    claimRefs:
      - CR030
      - CR018
      - CR031
      - CR037
