  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and module breadth
        blocks:
          - type: paragraph
            body: >-
              Kakao Mobility’s product evidence supports a genuine mobility platform rather than a narrow taxi-booking
              app. The official Kakao T surfaces span taxi, designated driver, parking, quick delivery, my-car ownership
              services, overseas ride access, and a distinct B2B workflow layer through Kakao T Business. That module
              breadth matters because it shows Kakao Mobility is trying to own multiple recurring mobility moments
              inside one account and one app shell. It also means product diligence should focus on integration quality
              and module attach, not just ride volume. The consumer app is the distribution anchor, but the company’s
              public materials clearly present enterprise transport controls, navigation, and infrastructure-like
              services as part of the same operating system for movement. The scope is ambitious, Korea-specific, and
              strategically coherent, even if monetization maturity differs sharply by module. The app surface is
              therefore broad enough to justify platform-style diligence. For product diligence, the central question is
              not whether Kakao Mobility has enough feature breadth; it is whether that breadth creates real reuse
              across identity, routing, payments, data, and trust layers or whether the company is carrying a portfolio
              of loosely connected workflows that will be expensive to maintain.
