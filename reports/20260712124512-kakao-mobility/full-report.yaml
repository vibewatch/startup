      - number: '7.3'
        title: Governance, IPO, and thesis-breaker risk
        blocks:
          - type: paragraph
            body: >-
              Governance and exit risk are unusually important because Kakao Mobility’s path to monetization depends on
              actors outside the operating team. Korean listing rules increased the need for a U.S. route, while sponsor
              liquidity pressure and failed sale-process reporting show that the company is navigating valuation,
              control, and timing simultaneously. That creates a feedback loop: legal overhang weakens IPO readiness,
              delayed IPO increases sponsor pressure, sponsor pressure increases sale-process noise, and sale-process
              noise can itself distract management. Parent-company priorities add another layer because Kakao Corp’s
              broader portfolio strategy may shape what happens next. This is why the most serious thesis breaks are not
              small product misses; they are adverse court outcomes, harsher labor treatment, or governance events that
              force Kakao Mobility into a low-quality exit window. Even optimistic investors should treat the next 12 to
              24 months as a governance-heavy period, not a pure operating-execution story. Said differently, Kakao
              Mobility can continue to perform operationally and still disappoint equity holders if legal timing, labor
              policy, or shareholder-control dynamics move the wrong way at the wrong moment. That combination is enough
              to break an otherwise attractive market-leadership narrative for public or private investors over the next
              two years at minimum.
