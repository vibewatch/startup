chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, scope, and current positioning
        blocks:
          - type: paragraph
            body: >-
              Kakao Mobility entered the market as Kakao Corp’s dedicated mobility spin-out in 2017 and has since
              broadened from a taxi-booking utility into a full-stack mobility platform. The most credible direct
              evidence for current scope comes from Kakao Mobility’s own service pages, which show Kakao T spanning
              taxi, designated driver, parking, quick delivery, my-car, navigation, enterprise, and emerging autonomous
              and EV workflows. That breadth matters for diligence because the company is no longer a single-product
              ride-hailing operator; it is trying to monetize consumer mobility frequency, enterprise transport
              workflows, and infrastructure-adjacent services in one app surface. Official report pages also show a
              stable habit of publishing annual mobility-data reports, which gives later chapters a company-authored but
              consistent historical record. The result is a company with an unusually broad Korea-specific service
              stack, but one that still depends on strong execution across many operationally different categories. It
              also means that later diligence chapters should avoid valuing the business as a pure ride-hailing app; a
              meaningful part of the strategic narrative now rests on enterprise mobility software, parking and charging
              adjacencies, and data-intensive future services that can either deepen the moat or distract management.
