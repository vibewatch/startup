  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Visible revenue streams and growth signals
        blocks:
          - type: paragraph
            body: >-
              The strongest public financial evidence comes from Kakao Corp’s Q1 2026 earnings release, which explicitly
              said “other platform service revenues,” including Kakao Mobility and Kakao Pay, reached KRW 506.5 billion
              and that Kakao Mobility posted double-digit year-on-year revenue growth for the third consecutive quarter.
              The same release said growth was supported by taxi, parking, last-mile logistics, and advertising. On top
              of that parent-level disclosure, Kakao Mobility’s own product pages make clear that taxi, designated
              driver, parking, business mobility, charging, subscriptions, air booking, and train booking all exist as
              monetizable workflows. The right interpretation is not that every stream is equally large today, but that
              Kakao Mobility already has a broader revenue surface than a single ride-hailing take-rate business. That
              breadth matters because diversified surfaces usually improve resilience, increase cross-sell
              opportunities, and widen the menu of ways management can monetize demand without depending on a single
              product line. It also helps explain why parent commentary now talks about Kakao Mobility as a
              multi-vertical platform rather than a one-service taxi tool with only one monetization lever.
