  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Kakao Mobility’s risk profile starts with competition law and does not meaningfully improve until courts
              and regulators close the loop. The 2024 KFTC decision, the later surcharge reduction, and the
              prosecutor-led call-blocking case together show that this is not a one-headline issue but a multi-stage
              regulatory process. The company’s own defense makes clear that management sees the case as a dispute over
              platform design and service quality, but the market consequence is broader: dominant routing, ranking, and
              access rules can all be reinterpreted as abuse when a platform has overwhelming market share. The Supreme
              Court appeal keeps the issue alive, and the separate chauffeur-practice probe adds a second legal front.
              For investors, this means any underwriting case must price not only fines already imposed or reduced, but
              also remedy uncertainty, ongoing legal expense, and the chance that regulators constrain behavior that
              underpins the product moat. Because the regulatory questions touch call allocation, partner access, and
              information-sharing rules, they strike close to the platform mechanics that helped Kakao Mobility become
              dominant in the first place. This is the key reason the antitrust story matters more than a one-time fine:
              a behavioral remedy or adverse precedent could alter the everyday economics of matching, supply access,
              and premium-service steering.
            claimRefs:
              - CR001
