      - number: '2.3'
        title: Drivers, constraints, and regulation
        blocks:
          - type: paragraph
            body: >-
              Growth drivers in Korea mobility are real, but they come with equally real constraints. Knowledge Sourcing
              links demand to congestion and dense urban populations, while IMARC emphasizes integrated travel platforms
              and personalization. EV charging is supported by unusually strong charger density, and Kakao Mobility’s
              own auto-charging and membership launches show the market is experimenting with convenience-led
              monetization. At the same time, Digital Policy Alert’s KFTC timeline shows regulation can directly
              influence how leaders scale and monetize. This matters because the Korean market rewards digital
              convenience and super-app behavior, but it also punishes perceived abuse of dominant position. Operators
              therefore need both product ambition and policy discipline to sustain attractive economics over time. The
              market outlook is therefore attractive but conditional: operators can still build adjacency value and
              strong consumer habits, yet platform governance and competitive conduct remain part of the market
              structure, not an afterthought outside it. For an investor, that means Korea offers high-quality digital
              demand and real adjacency upside, but not a frictionless path to monopoly-style economics across every
              mobility segment. It is a market that rewards operational integration and product quality, but it also
              demands policy discipline and ongoing adaptation as new mobility modes and monetization models appear.
              That combination makes Korean mobility attractive, strategically important, and rarely simple to
              underwrite for serious investors and long-term operators in Korea today.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM017
