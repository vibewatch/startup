        title: Customer proof, frictions, and evidence gaps
        blocks:
          - type: paragraph
            body: >-
              Customer proof is unusually concrete for a private mobility company, but it is not uniformly positive.
              Google Play reviews surface practical issues for foreign and English-language users, especially around
              reservation changes, support, and payment friction, even as the iOS store shows very strong headline
              satisfaction. This divergence is important: Kakao Mobility appears strong with mainstream local users yet
              still imperfect for tourists or cross-border users, which matters if management wants to expand
              international relevance. Enterprise proof is also incomplete. The B2B product clearly exists, but the
              public record does not give a verified logo list, seat count, or fleet-customer figure. That missing
              enterprise denominator is one of the most important unresolved customer questions in the report. More
              broadly, the chapter can support breadth, adoption, and service-quality direction, but not hard MAU, DAU,
              cohort retention, or revenue-by-segment conclusions. For underwriting, the right conclusion is that Kakao
              Mobility likely has meaningful repeat behavior and strong category awareness, but the quality of that
              repeat behavior still needs internal analytics, enterprise logo evidence, and multilingual support metrics
              to be treated as fully verified. This is especially important because private companies often look
              strongest precisely where they publish the least third-party-verified customer data.
