      - number: '1.2'
        title: Leadership, capital, and control dynamics
        blocks:
          - type: paragraph
            body: >-
              Leadership and ownership structure are central to the Kakao Mobility story because strategic optionality
              is heavily mediated by Kakao Corp and financial investors. Public reporting supports Ryu Geung-seon as CEO
              in 2026, while Korean media and investor reporting show Kakao remaining majority owner and TPG the key
              external shareholder. Historical funding markers are also unusually visible for a private Korean platform:
              TPG’s 2017 investment established the early standalone valuation, while Carlyle’s 2022 investment reset
              the mark materially higher. By 2026, IPO timing was no longer just a capital-markets choice; reporting
              tied the push toward a Nasdaq ADR to South Korea’s tougher stance on parent-subsidiary domestic listings.
              That, in turn, created tension around TPG’s exit timeline, a potential management-control transfer
              mechanism, and renewed sale-process speculation. In practical diligence terms, Kakao Mobility’s capital
              structure offers support and optionality, but it also creates governance complexity that can drive timing
              risk independent of operating performance. For diligence purposes, that control stack matters almost as
              much as topline growth because listing venue, stake sales, and management autonomy may all be shaped by
              shareholder agreements rather than purely by market demand for the stock.
