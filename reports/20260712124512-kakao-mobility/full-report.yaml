        - id: parent
          label: Kakao Corp
        - id: sponsors
          label: TPG and co-investors
        - id: partners
          label: LG and ecosystem partners
        - id: users
          label: Users and drivers
      edges:
        - from: reg
          to: parent
          label: timing pressure
        - from: parent
          to: sponsors
          label: exit negotiation
        - from: sponsors
          to: partners
          label: roadmap choices
        - from: partners
          to: users
          label: service experience
    claimRefs:
      - CR022
      - CR018
      - CR026
      - CR027
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: The current stance follows from strategic value being offset by opacity, legal overhang, and governance pressure.
    data:
      nodes:
        - id: scale
          label: Strong local scale and adjacencies
        - id: opacity
          label: Revenue and margin opacity
        - id: legal
          label: Regulatory and legal cloud
        - id: control
          label: Parent and sponsor pressure
        - id: track
          label: Track, not underwrite aggressively
      edges:
        - from: scale
          to: track
