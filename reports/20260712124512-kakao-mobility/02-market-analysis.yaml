chapter:
  number: 2
  title: Market Analysis
  summary: South Korea’s mobility market mixes a maturing e-hailing core with faster-growing MaaS, EV charging, and enterprise or logistics adjacencies. For Kakao Mobility, the market is attractive because Korean users are digitally mature and densely urban, but growth remains shaped by regulation, fragmentation across subcategories, and rising expectations for integrated mobility experiences.
sections:
- id: market-size-and-shape
  title: Market size and shape
  body: 'Public third-party sources support a multi-lens market view rather than one clean TAM. Knowledge Sourcing sizes the Korean e-hailing market at about $1.6 billion in 2026, which suggests the core ride market is meaningful but not enormous in global terms. IMARC’s MaaS framing is smaller today but grows much faster, showing why investors increasingly care about integrated trip planning, multimodal payments, and consumer workflow ownership rather than only taxi GMV. NextMSC’s charging forecast adds a second fast-growth adjacency around EV infrastructure. The implication for Kakao Mobility is clear: valuation and strategy should not be anchored only to taxi demand. Even if the e-hailing core grows at a moderate rate, faster-expanding adjacent categories can still shape product investment, customer retention logic, and where new pools of gross profit eventually emerge. This matters because a company that already owns user frequency in rides may find its best incremental return in charging,
    subscriptions, enterprise workflows, or data-led orchestration rather than in squeezing more take rate out of each taxi call. Korea’s market is best read as a mature ride core with adjacent growth pools around charging, memberships, enterprise workflows, and data-intensive mobility orchestration.'
