  - TI004
  figureRefs:
  - FI002
  - FI004
- id: disclosure-gaps-and-verdict
  title: Disclosure gaps and financial verdict
  body: 'The core financial blocker is not absence of business activity; it is absence of clean standalone disclosure. OpenDART and Kakao public materials confirm that some disclosure surfaces exist, but the current evidence still does not provide Kakao Mobility’s standalone 2025 or 2026 revenue, gross margin, cash balance, runway, or segment economics. That matters because private-company valuation can otherwise drift far ahead of what the public evidence really supports. The comparison with public mobility platforms is useful here: companies such as Grab, Uber, and Lyft publish standardized revenue and financial series that let outside investors test growth quality and margin progression quarter by quarter, while Kakao Mobility still offers only fragments and parent-level references. The most defensible verdict, therefore, is balanced: Kakao Mobility probably has more monetization breadth and better revenue momentum than skeptics assume, yet also far less financial transparency than a
    serious investor would need to underwrite revenue quality, margin path, or downside risk with confidence. Until that disclosure gap closes, financial conviction should remain capped. A prudent analyst can acknowledge positive growth signals and improving monetization sophistication while still refusing to overstate certainty on earnings quality, free-cash-flow potential, or ultimate terminal margins. For diligence purposes, this chapter should be read as evidence of economic promise constrained by reporting opacity, not as proof of a fully de-risked financial profile today.'
