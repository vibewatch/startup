- id: unit-economics-and-capital-profile
  title: Unit economics and capital profile
  body: 'Public evidence is much weaker on economics than on product breadth. JAKOTA’s report that Kakao Mobility returned to profitability in 2024 with KRW 93 billion operating income is directionally important, and Android’s conversion case study suggests product optimization can support monetization efficiency. But none of the accessible public sources provide a clean standalone revenue base, gross margin, burn, runway, or cohort-level unit-economics framework. This forces an analytical compromise. Kakao Mobility appears to be a hybrid software-and-operations model: stronger than a narrow taxi marketplace because it has enterprise, advertising, parking, travel, and charging adjacencies, but likely structurally lower-margin than pure software because it still depends on labor-intensive and operationally complex services. Capital adequacy does not look immediately stressed thanks to parent and sponsor support, yet new adjacencies such as charging, logistics, autonomy, and wider travel orchestration
    could still increase future capital intensity. Investors therefore have enough evidence to believe the business can monetize at scale, but not enough to model margin durability with precision. In practice, that means upside cases should be grounded in scenario ranges rather than a single exact forecast. That discipline is especially important when private-market headlines and public disclosure quality diverge this much, because valuation narratives can otherwise outrun verified operating evidence.'
  claimRefs:
  - CI006
  - CI021
  - CI018
  - CI028
  - CI029
  - CI030
  - CI031
  - CI032
  - CI033
  tableRefs:
