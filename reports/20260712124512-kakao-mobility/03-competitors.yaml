- id: adjacent-and-enterprise-competition
  title: Adjacent mobility and enterprise competition
  body: The next layer of competition comes from substitutes and specialists. SoCar competes through self-drive access and leisure or intercity flexibility, which means it can intercept trips that never become taxi bookings at all. NAVER Map competes even earlier in the funnel by controlling search and journey planning, a strategic position that can influence which provider wins the booking moment. MOVV and Uber for Business matter because enterprise mobility is becoming its own procurement battlefield, while TADA Business suggests even premium ride players are not satisfied staying consumer-only. The result is a more complicated competitive map than a classic taxi war. In this structure, even a smaller rival can matter if it dominates a high-value workflow such as company-paid trips, airport transfers, concierge travel, or travel planning. Kakao Mobility’s cross-category breadth is still a strength, but the market’s highest-quality challengers are often specialists with a sharper proposition
    in a narrower workflow such as self-drive, premium business travel, or intent capture at the map layer. For investors, this means the relevant question is not whether Kakao is number one overall, but where specialists can build high-value footholds without needing to match Kakao everywhere.
  claimRefs:
