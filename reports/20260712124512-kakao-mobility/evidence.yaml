evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A current company-verified employee count or payroll disclosure.
    whyItMatters: Headcount is a standard maturity metric and helps benchmark operating leverage across peers.
    diligencePath: Request current headcount split by product, operations, and autonomous/EV units from management.
    relatedQuestionRefs:
      - QO010
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Standalone Kakao Mobility revenue, margin, and cash-flow disclosure for 2025-2026.
    whyItMatters: Private-market valuation cannot be normalized cleanly without revenue quality and margin data.
    diligencePath: Request audited 2025 financial statements and 2026 YTD management accounts.
    relatedQuestionRefs:
      - QO011
  - type: enumeration-incomplete
    severity: minor
    topic: leadership coverage
    missingEvidence: A full public executive bench and board roster tied to Kakao Mobility rather than the parent.
    whyItMatters: Leadership concentration and succession risk cannot be fully scored from the current public record.
    diligencePath: Request current executive committee, board composition, and reporting lines from management.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: investor map completeness
    missingEvidence: A current post-2022 cap table showing smaller shareholders, secondaries, and any shareholder-rights changes.
    whyItMatters: Transaction dynamics depend on who owns which rights, not only on the headline Kakao and TPG stakes.
    diligencePath: Request latest cap table and shareholder agreement summary.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone chronology completeness
    missingEvidence: A fuller dated chronology covering internal governance changes and all major partnerships.
    whyItMatters: Private-company histories often omit failed initiatives and internal governance shifts that affect execution.
    diligencePath: Request a management timeline of financing, governance, and product launches since spin-out.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: service-line market share
    missingEvidence: Verified current share by taxi, designated driver, parking, business mobility, and charging.
    whyItMatters: Market attractiveness and moat differ sharply by subcategory.
    diligencePath: Request internal market-share estimates and third-party benchmark studies by service line.
    relatedQuestionRefs:
      - QM006
  - type: enumeration-incomplete
    severity: minor
    topic: segment map completeness
    missingEvidence: A fuller map of intercity, freight, rental, and public-transit-adjacent workflows.
    whyItMatters: Public pages emphasize the largest commercial segments, not every transport mode.
    diligencePath: Expand the segment inventory with local-language transport sources and operator filings.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: share and pricing by rival
    missingEvidence: >-
      Reliable current market-share and realized-pricing data for Uber Taxi, TADA, NAVER taxi referrals, and niche
      Korean operators.
    whyItMatters: Threat ranking is clearer with real share and pricing data rather than feature positioning alone.
    diligencePath: Request internal win/loss, MAU, trip share, and price-benchmarking data.
    relatedQuestionRefs:
      - QP001
      - QP020
  - type: private-evidence-only
    severity: medium
    topic: enterprise contract depth
    missingEvidence: Contract counts, contract sizes, and retention for Kakao T Business vs TADA Business vs Uber for Business vs MOVV.
    whyItMatters: B2B mobility could become a separate profit pool with different winners than consumer taxi.
    diligencePath: Request enterprise sales pipeline, customer cohorts, and contract economics.
    relatedQuestionRefs:
      - QP003
      - QP017
  - type: enumeration-incomplete
    severity: minor
    topic: smaller Korean operators
    missingEvidence: Complete coverage of smaller taxi, chauffeur, or regional mobility players such as i.M or other niche fleets.
    whyItMatters: The chapter focuses on the most visible competitors rather than every small operator.
    diligencePath: Expand source set with Korea-specific operator registry and app-store ranking review.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: standalone revenue and margin
    missingEvidence: Audited standalone Kakao Mobility revenue, gross margin, operating margin, and segment mix for 2025-2026.
    whyItMatters: These are the core inputs needed to underwrite valuation and revenue quality.
    diligencePath: Request audited financials plus management segment bridge.
    relatedQuestionRefs:
      - QI001
      - QI019
  - type: private-evidence-only
    severity: material
    topic: cash and runway
    missingEvidence: Standalone cash balance, cash flow, and runway or burn profile.
    whyItMatters: Capital adequacy cannot be fully scored without liquidity data.
    diligencePath: Request latest balance sheet, cash-flow statement, and monthly cash-use summary.
    relatedQuestionRefs:
      - QI020
  - type: enumeration-incomplete
    severity: minor
    topic: revenue stream completeness
    missingEvidence: A full catalog of all ad products, premium tiers, fleet contracts, and partner monetization lines.
    whyItMatters: Public pages show the main streams, but not the full revenue taxonomy.
    diligencePath: Request internal revenue taxonomy and line-item mapping.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: module-level monetization
    missingEvidence: Revenue mix, take rates, or gross-margin contribution by product module.
    whyItMatters: Feature breadth is clear, but economic importance of each module is still opaque.
    diligencePath: >-
      Request module-level GMV, revenue, margin, and attach-rate data for taxi, driver, parking, business, and EV
      charging.
    relatedQuestionRefs:
      - QE025
      - QE024
  - type: private-evidence-only
    severity: material
    topic: reliability metrics
    missingEvidence: Internal uptime, crash, latency, and SLA metrics for consumer and API products.
    whyItMatters: Public pages show capability, but platform reliability is central to product diligence.
    diligencePath: Request quarterly reliability dashboards, incident logs, and customer-impact metrics.
    relatedQuestionRefs:
      - QE020
  - type: enumeration-incomplete
    severity: minor
    topic: module coverage
    missingEvidence: A complete feature inventory across all consumer, enterprise, and pilot products.
    whyItMatters: The app likely contains many more subfeatures than public landing pages expose.
    diligencePath: Request internal product catalog and 2026 roadmap deck.
    relatedQuestionRefs:
      - QE001
    relatedTableRefs:
      - TE001
  - type: enumeration-incomplete
    severity: minor
    topic: visible architecture layers
    missingEvidence: Internal architecture diagram spanning identity, payments, dispatch, and data pipelines.
    whyItMatters: Developer docs reveal the edge of the stack, not the full operating architecture.
    diligencePath: Request engineering system map and dependency register.
    relatedQuestionRefs:
      - QE015
    relatedTableRefs:
      - TE003
  - type: enumeration-incomplete
    severity: minor
    topic: trust artifact coverage
