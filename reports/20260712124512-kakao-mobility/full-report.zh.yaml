      - number: '7.2'
        title: 用工、运营与质量风险
        blocks:
          - type: paragraph
            body: >-
              平台用工风险是第二大风险集群，因为 Kakao Mobility 所处服务中，劳动者身份认定、薪酬规则和服务质量都具有监管意义。韩国劳动政策发展指向更广的劳动者保护，尽管平台工人没有被纳入 2026
              年最低工资体系。法院承认一名配送骑手具备雇员身份的判例显示了政策走向，围绕 Yellow Envelope 改革的政策评论也暗示平台式用工将面对更多议价和法律复杂度。对 Kakao Mobility
              来说，这可能直接抬高成本，也可能压缩司机伙伴经济性的灵活度。运营层面，公开记录好坏参半：正式伦理和安全文件存在，但客户评论仍暴露客服和语言摩擦。产品摊子铺大也很关键，因为一家同时运营出租车、代驾、企业软件、充电和自动驾驶试点的公司，必须同时管理不同安全、合规和伙伴义务。公司增加的模块越多，单个薄弱合规流程或治理不佳的边缘案例就越可能对整个品牌制造不成比例的下行。出行行业安全预期高、监管重叠常见，事故又往往立即引发消费者和政治审视，这会放大上述风险。
