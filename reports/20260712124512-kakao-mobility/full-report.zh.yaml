              围绕更高质量驾驶数据的合作都强化了这一点。但公开证据仍显示，这些新模块首先是战略差异化和学习系统，还没有披露为规模化独立业务。因此，路线图成熟度是后续章节的核心尽调问题。纪律严明的投资人应把业务分成三类：已经支撑日常出行行为的成熟核心功能；看似已建立但披露不足的企业和充电层；以及可能创造选择权、但仍需证明商业可复制性、安全经济性和部署规模的前沿押注。这个框架能降低把每个公开演示都过度计入、仿佛它已经是规模化软件业务的风险。
