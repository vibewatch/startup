  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Kakao Mobility 的风险画像从竞争法开始，只有法院和监管机构收口后才会实质改善。2024 年 KFTC
              决定、后续罚款下调，以及检方主导的呼叫屏蔽案合在一起说明，这不是一个单一标题问题，而是多阶段监管流程。公司自我辩护清楚表明，管理层把案件视为围绕平台设计和服务质量的争议；但市场后果更宽：当平台拥有压倒性市场份额时，支配性路线、排名和准入规则都可能被重新解释为滥用。最高法院上诉让问题继续存在，另一起代驾业务调查又增加第二条法律战线。对投资人来说，任何承销假设都必须定价的不只是已经处以或下调的罚款，还包括救济措施不确定性、持续法律费用，以及监管限制支撑产品护城河的行为的可能性。监管问题触及呼叫分配、伙伴准入和信息共享规则，因此非常接近
              Kakao Mobility 最初成为支配者的平台机制。这就是反垄断故事比一次性罚款更重要的关键原因：行为性救济或不利先例，可能改变匹配、供给准入和高端服务导流的日常经济性。
