              最强的公开采用信号仍然庞大，但定义口径混杂。Kakao Mobility 自有 ITF Summit 文章引用 4500 万累计注册会员，Android Developers 则描述超过 3000
              万总用户的基础。应用商店提供另一层视角：Google Play 显示下载量超过 1000 万，Apple 和 Google 则呈现出醒目的评分分化。Kakao Mobility 自己 2025
              年研究文章中的满意度证据在方向上强劲，出租车满意度为 65%，明显高于同业，Venti
              满意度尤其高。品牌出租车司机团队的培训和辅导披露也支持一个判断：客户体验正在被运营化，而不是完全交给市场机制。不过，公开记录对漏斗顶部规模和满意度的证据，多于对真实留存或已变现复购行为的证据。换句话说，客户喜爱比客户耐久性更容易验证。这个区别重要，因为在出行行业，如果激励或补贴在背后起作用，庞大安装基数可以和弱变现或低利润复购行为并存。因此，本章把采用视为真实，但还不足以单独证明其客户质量达到风投或
