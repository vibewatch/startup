  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场规模与形态
        blocks:
          - type: paragraph
            body: >-
              公开第三方资料支持多视角市场图景，而不是一个干净的 TAM。Knowledge Sourcing 估算韩国在线叫车市场 2026 年约为 $1.6B，说明核心打车市场有意义，但放到全球并不庞大。IMARC 的
              MaaS 口径当前规模更小，但增速快得多，解释了为什么投资人越来越关注一体化行程规划、多模式支付和消费者流程所有权，而不只是出租车 GMV。NextMSC 的充电预测又在 EV
              基础设施周边给出第二个快速增长相邻市场。对 Kakao Mobility
              的含义很清楚：估值和战略不应只锚定出租车需求。即使在线叫车核心温和增长，增长更快的相邻品类仍会塑造产品投入、客户留存逻辑，以及新毛利池最终出现的位置。这一点重要，因为已经掌握出行高频的公司，最好的增量回报可能在充电、会员、企业流程或数据驱动的调度编排里，而不是在每一次叫车中压出更高抽佣率。韩国市场最好理解为成熟的打车核心，外围围绕充电、会员、企业流程和数据密集型出行编排形成增长池。
