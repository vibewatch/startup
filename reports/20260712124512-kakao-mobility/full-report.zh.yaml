      - number: '2.2'
        title: 细分、买方与竞争结构
        blocks:
          - type: paragraph
            body: >-
              韩国出行市场比「Kakao 对 Uber」这种简单框架更宽、更碎。Kakao 官方页面显示，主要需求横跨出租车、代驾、停车、商务出行和全球叫车；SoCar、MOVV、NAVER Map、Uber Taxi 和
              TADA 则各自照亮竞争场上的不同切片。也就是说，客户价值不只来自基础在线叫车，还来自汽车共享、车队管理、预约驱动的高端出行、地图驱动的发现，以及 EV
              充电便利性。因此，即便部分本地品类高度集中，整个市场也不是所有功能都赢者通吃。像 Kakao Mobility
              这样的平台可以主导一个用户习惯，同时在相邻流程里承受有意义的压力，因为那些流程可能由专业玩家或地图入口定义用户预期。在韩国，战略问题不只是出租车订单份额，而是谁控制围绕移动发生的发现、预约、支付和后续便利这套更宽的栈。也正是在这套更宽的栈里，超级应用优势和转换成本叙事更可信。对
              Kakao Mobility 来说，机会在于拥有跨细分的一体化流程；但竞争现实是，只要具体任务不同于即时城市出租车匹配，专业玩家仍能发挥作用。
