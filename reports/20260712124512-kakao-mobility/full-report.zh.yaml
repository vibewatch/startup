      - number: '2.3'
        title: 驱动因素、约束与监管
        blocks:
          - type: paragraph
            body: >-
              韩国出行的增长驱动是真实的，但约束同样真实。Knowledge Sourcing 把需求与拥堵和高密度城市人口联系起来，IMARC 则强调一体化旅行平台和个性化。异常高的充电桩密度支撑 EV 充电，Kakao
              Mobility 自己推出自动充电和会员，也显示市场正在试验便利性驱动的变现。与此同时，Digital Policy Alert 的 KFTC
              时间线显示，监管能直接影响龙头如何扩张和变现。这很关键，因为韩国市场奖励数字便利和超级应用行为，也惩罚被视为滥用支配地位的做法。运营商若想长期守住有吸引力的经济性，既需要产品野心，也需要政策纪律。因此，市场前景有吸引力但有条件：运营商仍能构建相邻业务价值和强消费者习惯，但平台治理和竞争行为属于市场结构本身，不是结构之外的事后补充。对投资人来说，韩国提供高质量数字需求和真实相邻业务上行，但并不提供一条通往所有出行细分垄断式经济性的无摩擦道路。这个市场奖励运营整合和产品质量，也要求政策纪律，并随着新出行模式和变现模型出现而持续适应。这个组合让韩国出行在当下对严肃投资人和长期运营商既有吸引力、战略重要，也很少简单。
