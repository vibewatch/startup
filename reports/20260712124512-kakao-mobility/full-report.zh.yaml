      - number: '3.3'
        title: 国际参照与战略结论
        blocks:
          - type: paragraph
            body: >-
              Grab、Gojek、Uber、Lyft、ChargePoint 和 KEPCO 并不全是韩国直接竞争者，但它们有助于界定 Kakao Mobility 的战略天花板和侧翼风险。Grab 和 Gojek
              展示了出行如何扩展为区域超级应用，尽管二者所处市场结构与韩国很不同。Uber 和 Lyft
              提供了透明的上市公司参照，用于观察叫车规模和披露质量。它们也提醒投资人，上市市场龙头仍会因为地理、模式组合和监管环境不同而呈现不同战略形态，因此不能只用一个原型来给 Kakao 做基准。ChargePoint 和
              KEPCO 则说明，EV 充电竞争既可能来自软件驱动网络，也可能来自基础设施中心型既有玩家。实际结论是，Kakao Mobility
              面对的不是一个单体竞争者，而是同时面对几套不同竞争逻辑。它面对一组专业威胁，同时在服务广度上仍强于任何单一本土对手。因此核心争论不是有没有竞争者，而是哪些垂直在长期最容易受到聚焦专业玩家攻击。未来几年在韩国，最可能的格局是
              Kakao 在宽平台层面继续领先，同时在部分高端、企业和基础设施挂钩流程里，专业竞争继续增强。
