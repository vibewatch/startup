              资产周围存在第二组客户，即开发者和企业集成商。实际看，Kakao Mobility
              更像建立在一个消费者身份层上的多细分需求网络，而不是单一市场。这个广度支持交叉销售和使用频次，但也意味着后续尽调要测试这些客户动作是否真正活跃，还是部分只是围绕旗舰出租车用例的叙事延伸。强分层故事不等于强变现故事；一些队列可能高频但低利润，另一些可能有战略价值却仍太早，尚不足以在财务上产生影响。因此，后续财务尽调必须把客户广度重新连接到贡献利润率，而不只是连接到使用量。
