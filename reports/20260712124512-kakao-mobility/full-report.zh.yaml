      - number: '3.2'
        title: 相邻出行与企业竞争
        blocks:
          - type: paragraph
            body: >-
              下一层竞争来自替代品和专业玩家。SoCar 通过自驾用车入口和休闲或城际灵活性竞争，这意味着它能截留那些根本不会变成出租车订单的行程。NAVER Map
              在漏斗更早的位置竞争，通过控制搜索和行程规划，影响哪个提供商赢得下单时刻。MOVV 和 Uber for Business 重要，是因为企业出行正在变成独立采购战场；TADA Business
              则说明，即使是高端出行玩家也不满足于只做消费者业务。结果是，竞争地图比经典出租车大战复杂得多。在这个结构里，只要较小的竞争者主导了公司付费出行、机场接送、礼宾出行或旅行规划等高价值流程，它就能产生影响。Kakao
              Mobility 的跨品类广度仍是优势，但市场中质量最高的挑战者往往是专业玩家，在更窄流程里拥有更锋利主张，例如自驾、高端商务出行，或地图层的意图捕捉。对投资人来说，真正问题不是 Kakao
              是否整体第一，而是专业玩家能在哪里建立高价值立足点，同时不必在所有地方匹配 Kakao。
