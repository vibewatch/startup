        title: 产品界面与模块广度
        blocks:
          - type: paragraph
            body: >-
              Kakao Mobility 的产品证据支持它是一套真实出行平台，而不是狭窄的出租车预订 App。官方 Kakao T 服务面覆盖出租车、代驾、停车、快送、我的车车主服务、海外叫车入口，以及通过 Kakao T
              Business 形成的独立 B2B 流程层。这个模块广度重要，因为它显示 Kakao Mobility 正试图在一个账户和一个 App
              外壳内，拥有多个反复发生的出行时刻。也就是说，产品尽调应关注集成质量和模块附着率，而不只是行程量。消费者 App
              是分发锚点，但公司公开材料清楚把企业交通控制、导航和类似基础设施的服务，呈现为同一套移动操作系统的一部分。范围有野心、贴合韩国市场，也有战略一致性，尽管各模块变现成熟度差异很大。因此，App
              服务面足够宽，值得按平台逻辑尽调。对产品尽调来说，核心问题不是 Kakao Mobility
              是否有足够功能广度，而是这些广度能否在身份、路线、支付、数据和信任层创造真实复用，还是公司只是在背负一组松散连接且维护成本高的流程组合。
