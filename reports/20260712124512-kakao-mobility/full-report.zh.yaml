  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 本土叫车与高端竞争者
        blocks:
          - type: paragraph
            body: >-
              Kakao Mobility 仍是本土服务广度龙头，但竞争对手并不都在攻击市场同一层。UT 更名后，Uber Taxi 是韩国最清晰的品牌化叫车挑战者，尤其强在已经在国际上使用
              Uber、抵达首尔后希望体验连续的外国游客。相比之下，TADA
              更像产品和体验挑战者，押注更干净的高端定位和面向商务的服务承诺。这些差异很重要，因为韩国竞争不只是「谁有一个打车按钮」。它还在争夺哪个品牌能让用户信任其高端可靠性，哪个服务最容易让旅客落地即用，哪个提供商能把一次行程转成更长的客户关系。竞争关乎谁拥有发现入口，谁拥有游客的品牌信任，谁拥有高端质量感知，以及谁能从小众场景扩展为拥有复购和更高钱包份额的更宽出行关系。以当前证据看，Kakao
              仍拥有最宽的本土服务面，但 Uber 和 TADA 在更窄市场切片里各有更尖锐定位。这意味着 Kakao
              感到压力，并不需要竞争损失同时发生在所有地方：失去高端乘客、游客需求或更高频的商务出行，仍可能产生不成比例的影响。
