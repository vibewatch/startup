      - number: '7.3'
        title: 治理、IPO 与投资逻辑破裂风险
        blocks:
          - type: paragraph
            body: >-
              治理和退出风险异常重要，因为 Kakao Mobility
              的变现路径依赖运营团队之外的参与者。韩国上市规则提高了走美国路径的必要性，而赞助方流动性压力和出售流程失败报道说明，公司正同时处理估值、控制权和时点。这制造了一个反馈环：法律阴影削弱 IPO 准备度，IPO
              延迟增加赞助方压力，赞助方压力增加出售流程噪音，出售流程噪音本身又会分散管理层注意力。母公司优先事项再加一层，因为 Kakao Corp
              更宽的组合战略可能塑造下一步走向。因此，最严重的投资逻辑破裂并不是小产品失误，而是不利法院结果、更严厉劳动处理，或迫使 Kakao Mobility 进入低质量退出窗口的治理事件。即便乐观投资人，也应把未来 12
              到 24 个月视为治理负担很重的时期，而不是纯运营执行故事。换句话说，Kakao Mobility
              可以继续在运营上表现良好，但如果法律时点、劳动政策或股东控制权动态在错误时刻走错方向，股权持有人仍可能失望。这个组合足以在未来至少两年内，打破原本有吸引力的市场领导叙事，无论对公开市场还是私募投资人都是如此。
