chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、业务范围与当前定位
        blocks:
          - type: paragraph
            body: >-
              Kakao Mobility 2017 年以 Kakao Corp 专门出行业务分拆公司的身份进入市场，此后从打车工具扩展为全栈出行平台。关于当前业务范围，最可信的直接证据来自 Kakao Mobility
              自有服务页面：Kakao T 覆盖出租车、代驾、停车、快送、我的车、导航、企业服务，以及正在形成的自动驾驶和 EV 流程。这个广度对尽调很关键，因为公司已不再是单一产品的网约车运营商；它试图在同一个 App
              入口里，把消费者高频出行、企业交通流程和贴近基础设施的服务一起变现。官方报告页面也显示，公司长期发布年度出行数据报告，留下了一套由公司撰写但口径连续的历史记录。结果是一家公司拥有罕见的韩国本土服务栈，但仍必须在许多运营属性不同的品类里保持强执行。也就是说，后续尽调不应把它当成纯网约车
              App 估值；战略叙事中相当一部分已经落在企业出行软件、停车和充电相邻业务，以及数据密集型未来服务上，这些业务既可能加深护城河，也可能分散管理层注意力。
