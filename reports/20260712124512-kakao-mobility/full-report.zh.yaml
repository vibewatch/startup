      - number: '4.3'
        title: 披露缺口与财务判断
        blocks:
          - type: paragraph
            body: >-
              核心财务障碍不是缺少业务活动，而是缺少干净的独立披露。OpenDART 和 Kakao 公开材料确认存在一些披露界面，但当前证据仍未提供 Kakao Mobility 独立的 2025 或 2026
              年收入、毛利率、现金余额、现金跑道或分部经济性。这很重要，因为私营公司估值可能会大幅领先于公开证据真正能支撑的范围。与上市出行平台比较在这里有用：Grab、Uber、Lyft
              等公司发布标准化收入和财务序列，让外部投资人逐季检验增长质量和利润率推进；Kakao Mobility 仍只给出碎片和母公司层面引用。因此，最可辩护的判断是平衡的：Kakao Mobility
              的变现广度和收入动能可能比怀疑者设想的更好，但财务透明度也远低于严肃投资人承销收入质量、利润率路径或下行风险时所需的水平。在披露缺口关闭前，财务确信度应保持上限。谨慎分析师可以承认积极增长信号和不断提升的变现复杂度，同时拒绝夸大对盈利质量、自由现金流潜力或最终终局利润率的确定性。对尽调来说，本章应被理解为经济潜力受报告不透明约束的证据，而不是今天财务画像已充分去风险的证明。
