      - number: '4.2'
        title: 单位经济与资本画像
        blocks:
          - type: paragraph
            body: >-
              公开证据在经济性上远弱于产品广度。JAKOTA 报道 Kakao Mobility 2024 年恢复盈利并录得 KRW 93B 营业利润，这在方向上重要；Android
              的转化案例研究也说明，产品优化可以支撑变现效率。但可访问的公开资料都没有给出干净的独立收入基数、毛利率、烧钱速度、现金跑道或队列层面的单位经济框架。这迫使分析作出折中。Kakao Mobility
              看起来像软件和运营混合模型：它拥有企业、广告、停车、旅行和充电相邻业务，强于狭窄出租车市场；但它仍依赖劳动密集、运营复杂的服务，结构性利润率很可能低于纯软件。得益于母公司和赞助方支持，资本充足度暂时不显紧张；但充电、物流、自动驾驶和更宽旅行编排等新相邻业务，仍可能提高未来资本强度。因此，投资人有足够证据相信业务能在规模上变现，但还没有足够证据精确建模利润率耐久性。实践中，这意味着上行情景应建立在区间假设上，而不是单一精确预测上。当私募市场标题与公开披露质量差异如此大时，这种纪律尤其重要，否则估值叙事很容易跑在已验证经营证据前面。
