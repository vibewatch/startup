        title: 图表
        blocks:
          - type: callout
            title: 复购逻辑在战略上可信
            body: 即便没有公开队列数据，Kakao Mobility 的服务广度也让复购具备合理性，因为一个账户可服务通勤、夜间外出、停车、商务出行和 EV 充电。
