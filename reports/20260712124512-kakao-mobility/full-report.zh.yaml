      - number: '8.2'
        title: 上市可比公司视角
        blocks:
          - type: paragraph
            body: >-
              上市可比公司能提供有用边界，即便基于当前公开证据，它们无法给出精确倍数。Uber、Grab 和 Lyft 覆盖了从全球平台龙头、区域聚焦超级应用，到范围更窄的叫车运营商。StockAnalysis
              数据显示，Uber 的交易规模完全不同，Grab 处在十几 B 美元区间中段，Lyft 则仍在高个位数 B 美元区间。按标题股权价值看，Kakao Mobility 的私募估值标记因此更接近 Lyft 和低端
              Grab，而不是 Uber。但可比性只能改善到一定程度：上市同行提交经审计报表，发布干净收入预期，并在每日市场纪律下交易。Kakao Mobility
              尚未提供同等透明度。正确结论是方向性的，不是精确的：公司值得严肃同业组比较，但投资人不应假定它自动配得上最干净上市公司那种经披露调整后的倍数。估值工作中，这通常意味着先用可比公司组判断私募估值标记是否大致可信，再施加披露折价，而不是强行套用一个整齐的公开市场倍数。换句话说，可比表最好用于建立外部边界和披露惩罚，而不是从根本不同的报告制度里制造小数点精度的假象。
