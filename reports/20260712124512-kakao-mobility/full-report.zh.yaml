      - number: '8.3'
        title: 情景框架与建议
        blocks:
          - type: paragraph
            body: >-
              情景框架的驱动因素，与其说是 TAM 乐观，不如说是对披露、法律结果和变现质量的信心。规模证据足以支持可信牛市情景：Kakao Mobility
              拥有大用户基础、强市场地位，以及停车、充电和企业出行等相邻产品。但基准情景仍应为监管阴影、赞助方压力噪音和缺失收入可见性定价折扣。如果法院或监管机构明显恶化法律图景，或者投资人发现底层经济画像弱于品牌和流量足迹所暗示的水平，熊市情景就会变得可信。因此，当前建议是跟踪。仅凭公开证据，Kakao
              Mobility
              并非明显低估；它看起来有战略价值，但相对可由披露事实辩护的范围，目前仍显得偏紧。更积极的立场需要三者之一：更干净的独立财务披露、明显改善的法律图景，或更强证据证明相邻产品产生经济贡献，而不只是叙事贡献。在此之前，投资逻辑仍有意思，但距离形成确信还差一步。基于当前公开证据，投资人可以合理保持跟踪，而不必假装该案例今天已经准备好作出坚决估值判断。
