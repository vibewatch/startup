            body: >-
              Kakao Mobility 的客户界面比「叫车用户」这个说法更宽。官方产品页面显示，公司通过与 Kakao T 账户和品牌绑定的流程，服务出租车乘客、代驾用户、停车用户、企业出行买方、EV
