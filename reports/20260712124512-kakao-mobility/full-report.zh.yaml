  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 可见收入流与增长信号
        blocks:
          - type: paragraph
            body: >-
              最强的公开财务证据来自 Kakao Corp 的 2026 年一季度业绩稿，其中明确表示，包括 Kakao Mobility 和 Kakao Pay 在内的「其他平台服务收入」达到 KRW 506.5B，并称
              Kakao Mobility 连续第三个季度实现两位数同比收入增长。同一份业绩稿还称，增长由出租车、停车、末端物流和广告支撑。在这些母公司层面披露之外，Kakao Mobility
              自有产品页面也清楚表明，出租车、代驾、停车、商务出行、充电、订阅、机票预订和火车票预订都已作为可变现流程存在。正确解读不是每条收入流今天同样大，而是 Kakao Mobility
              的收入界面已经比单一叫车抽佣业务更宽。这个广度重要，因为多元化界面通常能提高韧性、增加交叉销售机会，也拓宽管理层不依赖单一产品线来变现需求的方式菜单。它也解释了为什么母公司评论现在把 Kakao Mobility
              称为多垂直平台，而不是只有一个变现杠杆的单一出租车工具。
