      - number: '1.2'
        title: 管理层、资本与控制权动态
        blocks:
          - type: paragraph
            body: >-
              管理层与股权结构是 Kakao Mobility 故事的核心，因为战略选择很大程度受 Kakao Corp 和财务投资人牵动。公开报道支持 Ryu Geung-seon 在 2026 年担任
              CEO；韩国媒体和投资人报道则显示，Kakao 仍是多数股东，TPG 是关键外部股东。作为一家韩国私营平台，历史融资节点也异常清晰：TPG 2017 年投资确立了早期独立估值，Carlyle 2022
              年投资则把估值标记明显抬高。到 2026 年，IPO 时点已不只是资本市场选择；报道把转向 Nasdaq ADR 的推动，与韩国对母子公司境内上市更严格的态度联系在一起。这又制造了围绕 TPG
              退出时间表、潜在管理层控制权转移机制，以及新一轮出售流程传闻的张力。落到尽调，Kakao Mobility
              的资本结构提供了支持和选择权，但也带来治理复杂度，可能在经营表现之外单独制造时点风险。对尽调来说，这套控制权结构几乎和收入增长同样重要，因为上市地点、股权出售和管理层自主权，都可能由股东协议塑造，而不只是由市场对股票的需求决定。
