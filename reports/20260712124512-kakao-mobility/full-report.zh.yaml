      - number: '1.3'
        title: 里程碑与不利背景
        blocks:
          - type: paragraph
            body: >-
              Kakao Mobility 的里程碑记录同时包含很强的规模信号和同样重要的监管阴影。积极面上，公司自有 ITF 2026 演示把 Kakao T 定位为拥有 4500 万会员的平台，调度循环显著更快，并给出
              94% 上车成功率；一份独立 Android 案例研究则描述了 3000 万用户安装基数，以及 AI 驱动的转化改善。应用商店也强化了分发优势，Google Play 显示下载量超过 1000 万，Apple
              则显示 iOS 评分很强。但同一时期也伴随大量不利背景：Kakao Mobility
              公开为自己应对韩国反垄断认定辩护，独立报道也清楚表明，监管审视仍是公司叙事的一部分，而不是已经结束的章节。后续尽调应抓住这个混合结论：Kakao Mobility
              看起来是拥有真实产品深度的规模化品类龙头，但控制权、监管和声誉问题，都是任何承销或 IPO
              场景中的一阶变量。因此，概览章节支持一个平衡起点：一边是强产品市场匹配和分发，另一边是尚未解决的治理、披露和法律噪音。这个视角对报告其余部分有用，因为 Kakao Mobility
              几乎每一个上行论点，最终都取决于公司能否证明规模转化为持久现金产出的速度，快过监管或股东摩擦侵蚀选择权的速度。
