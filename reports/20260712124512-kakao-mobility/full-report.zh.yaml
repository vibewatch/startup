          - type: paragraph
            body: >-
              对一家私营出行公司来说，客户证据异常具体，但并非均为正面。Google Play 评论暴露了外国用户和英语用户的实际问题，尤其是改约、客服和支付摩擦；与此同时，iOS
              商店显示的标题级满意度很强。这种分化很重要：Kakao Mobility 看起来在主流本地用户中很强，但对游客或跨境用户仍不完美；如果管理层希望扩大国际相关性，这一点就很关键。企业证据也不完整。B2B
              产品明确存在，但公开记录没有给出已验证的客户 logo 清单、席位数或车队客户数量。缺失的企业分母，是报告中最重要的未解客户问题之一。更宽泛地说，本章可以支持服务广度、采用和服务质量方向，但不能支撑硬
              MAU、DAU、队列留存或按细分收入得出结论。用于承销时，合适结论是 Kakao Mobility 很可能有有意义的复购行为和强品类认知，但若要完全验证这种复购质量，还需要内部分析、企业 logo
              证据和多语言支持指标。私营公司往往恰恰在发布第三方验证客户数据最少的地方看起来最强，因此这一点尤其重要。
