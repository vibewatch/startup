chapter:
  number: 6
  title: Customers
  summary: Kakao Mobility serves broad consumer, driver-partner, enterprise, and adjacent EV/parking cohorts through Kakao T, with strong scale signals but incomplete public retention disclosure. Customer proof is strongest on app-store distribution, satisfaction studies, and service breadth, and weakest on hard cohort, MAU, and enterprise-logo metrics.
sections:
- id: customer-base-and-segmentation
  title: Customer base and segmentation
  body: 'Kakao Mobility’s customer surface is broader than the phrase “ride-hailing users” implies. Official product pages show the company serving taxi riders, designated-driver users, parking users, enterprise mobility buyers, EV owners, and foreign travelers, all through related flows tied to the Kakao T account and brand. That breadth matters because it changes what customer concentration means: the core risk is not dependence on one SKU, but dependence on one national mobility ecosystem. Public evidence also suggests a secondary customer set of developers and enterprise integrators around navigation and API assets. In practical terms, Kakao Mobility looks like a multi-segment demand network built on one consumer identity layer rather than a single marketplace. That breadth supports cross-sell and frequency, but it also means later diligence should test whether all of these customer motions are genuinely active or whether some are mostly narrative extensions around the flagship taxi
    use case. A strong segmentation story is not the same thing as a strong monetization story; some cohorts may be high-frequency but low-margin, while others may be strategically valuable but still too early to matter financially. That is why later financial diligence has to reconnect customer breadth to contribution margin, not just usage.'
  claimRefs:
  - CU001
  - CU016
  - CU017
  - CU018
  - CU019
  - CU021
  - CU028
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: scale-adoption-and-satisfaction
  title: Scale, adoption, and satisfaction signals
  body: 'The strongest public adoption signals remain large but definitionally mixed. Kakao Mobility’s own ITF Summit post cites 45 million cumulative registered members, while Android Developers describes a base of more than 30 million total users. App stores add another lens: Google Play shows more than 10 million downloads, while Apple and Google present a striking ratings split. Satisfaction evidence from Kakao Mobility’s own 2025 research article is directionally strong, with 65 percent taxi satisfaction and materially better scores than peers, plus especially high Venti satisfaction. Training and coaching disclosures for brand-taxi crews also support the idea that customer experience is being operationalized instead of left entirely to marketplace dynamics. Still, the public record gives more evidence on top-of-funnel scale and satisfaction than on actual retention or monetized repeat behavior. In other words, customer love is easier to verify than customer durability. That distinction
    matters because a large installed base can coexist with weak monetization or low-margin repeat behavior in mobility if incentives or subsidies are doing the hidden work. The chapter therefore treats adoption as real, but not yet sufficient on its own to prove customer quality in venture or IPO terms. Durable customer quality requires proof of frequency, retention, and monetization, not just recognition, install volume, or headline satisfaction.'
  claimRefs:
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU008
  - CU009
  - CU010
  - CU013
  - CU014
