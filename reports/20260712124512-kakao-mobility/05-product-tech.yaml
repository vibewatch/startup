- id: trust-quality-and-roadmap
  title: Trust, quality, and roadmap signals
  body: 'Public trust and roadmap signals are visible, but they are unevenly disclosed. Kakao Mobility maintains dedicated safety and policy pages, which at minimum shows that trust, health, and user-protection considerations are not hidden in legal footers. Product-quality evidence is more selective: Kakao Navi’s claimed 52.1 percent reduction in speed-prediction error gives one hard technical benchmark, while app-store updates show that the consumer layer remains actively maintained. The frontier story centers on autonomous and robotics initiatives. Autonomous driving is clearly an important narrative pillar, reinforced by the ITF Summit framing and the LG Innotek partnership around higher-quality driving data. But public evidence still suggests these newer modules are strategic differentiators and learning systems first, not yet disclosed as scaled standalone businesses. That makes roadmap maturity a central diligence question for later chapters. A disciplined investor should therefore
    separate three buckets: mature core features that already support daily mobility behavior, enterprise and charging layers that seem established but under-disclosed, and frontier bets that may create optionality but still need proof of commercial repeatability, safety economics, and deployment scale. That framing reduces the risk of over-crediting every public demo as if it were already a scaled software business.'
