chapter:
  number: 8
  title: Valuation
  summary: Kakao Mobility’s strategic value is evident, but current public evidence does not justify a fully clean premium multiple. The most supportable stance is that the company remains valuable enough to merit close tracking, yet still looks stretched relative to what can be underwritten from disclosed revenue, legal clarity, and governance readiness.
sections:
- id: marks-and-route
  title: Private marks and route-to-liquidity
  body: Kakao Mobility’s private valuation story is easy to summarize but harder to underwrite cleanly. Historical marks stepped up from the 2017 TPG investment to Carlyle’s 2022 investment, and current reporting clusters around a 5.5 trillion to 6.0 trillion won range in 2025-2026. That alone would not be unusual for a dominant local mobility platform. The harder issue is route quality. Korea’s tighter stance on parent-subsidiary listings redirected the story toward a Nasdaq ADR, while repeated media coverage of sponsor pressure, sale-process resets, and control questions suggests valuation is not being discovered in a calm or purely operating-driven context. Any mark today is therefore part operating business, part governance option value, and part liquidity negotiation. Investors should be careful not to treat every press-reported valuation as a clean mark-to-market event; in private companies, these numbers often emerge organically from attempted transactions, sponsor objectives, or
    route-dependent narratives rather than from a broad two-way market. That is especially true here because the same reported range appears in the context of ADR planning, sale-process resets, and shareholder negotiations. A range derived from pressured transaction conversations should never be treated as equivalent to a widely tested public clearing price in markets.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV007
  - CV008
  - CV033
  - CV034
