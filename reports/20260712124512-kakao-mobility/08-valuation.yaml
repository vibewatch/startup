- id: scenario-and-recommendation
  title: Scenario framing and recommendation
  body: 'The scenario framework is driven less by TAM optimism than by confidence in disclosure, legal outcomes, and monetization quality. There is enough scale proof to support a credible bull case: Kakao Mobility has a large user base, strong market position, and adjacent products in parking, charging, and enterprise mobility. The base case, however, should still price a discount for regulatory overhang, sponsor-pressure noise, and missing revenue visibility. The bear case becomes credible if courts or regulators materially worsen the legal picture, or if investors learn that the underlying economic profile is weaker than the brand and traffic footprint imply. That is why the current recommendation is to track. Kakao Mobility is not obviously mispriced low on public evidence alone; instead, it looks strategically valuable but presently stretched relative to what can be defended with disclosed facts. A more constructive stance would require either cleaner standalone financial disclosure,
    a visibly improving legal picture, or stronger evidence that adjacent products contribute economically rather than only narratively. Until then, the investment case remains interesting but still one step short of conviction. Investors can reasonably stay engaged without pretending the case is ready for a firm valuation call today, on current public evidence.'
