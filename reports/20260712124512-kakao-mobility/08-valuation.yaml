  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: standalone revenue and margin
    missingEvidence: Audited 2025 and 2026 YTD standalone financials with revenue, margin, cash flow, and segment mix.
    whyItMatters: Without clean financials, public-comparable multiple analysis remains mostly narrative.
    diligencePath: Request audited financial statements and current management accounts.
    relatedQuestionRefs:
    - QV017
    - QV010
  - type: private-evidence-only
    severity: material
    topic: shareholder rights and sale-process terms
    missingEvidence: Current cap table, shareholder rights, drag/tag mechanics, and any sponsor control triggers.
    whyItMatters: Route quality and negotiating leverage depend on rights structure, not just ownership percentages.
    diligencePath: Request shareholder agreements and board materials on exit planning.
    relatedQuestionRefs:
    - QV016
    - QV023
  - type: private-evidence-only
    severity: material
    topic: legal downside range
    missingEvidence: Internal view of probable legal and regulatory downside under multiple remedy scenarios.
    whyItMatters: Valuation discount cannot be sized confidently without a downside range.
    diligencePath: Request counsel memo, reserve assumptions, and scenario analysis.
    relatedQuestionRefs:
    - QV021
    - QV013
  - type: enumeration-incomplete
    severity: minor
    topic: comparable set completeness
    missingEvidence: A broader comp set including listed Asian mobility or logistics adjacencies.
    whyItMatters: Three public comps are directionally useful but not exhaustive.
    diligencePath: Add Asia-listed or mobility-adjacent comparables if clean data becomes available.
    relatedQuestionRefs:
    - QV005
    relatedTableRefs:
    - TV003
