companyProfile:
  summary: ClickHouse is the commercial company behind the open-source ClickHouse analytics database, combining a developer-led adoption engine with a managed cloud product for real-time analytics, observability, and emerging AI data workloads. The corporate entity was formed in 2021 around technology that originated inside Yandex and was open-sourced in 2016. Public evidence shows a San Francisco-centered company with a globally distributed engineering footprint, rapid customer growth, and a financing profile that expanded materially in 2025.
