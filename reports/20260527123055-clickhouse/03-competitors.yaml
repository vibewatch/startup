company:
  name: ClickHouse
chapter:
  number: 3
  title: Competitors
  summary: |-
    ClickHouse competes in a segmented analytics market where Snowflake and Databricks challenge it from the broad-platform side,
    BigQuery and AWS challenge it through procurement power, and DuckDB, Druid, StarRocks, and SingleStore challenge individual
    workload wedges. Its most durable edge is the combination of open-source credibility, deployment flexibility, and strong
    real-time analytical serving performance, but that edge can still be diluted by broader suites and hyperscaler bundles.
sections:
- id: landscape
  title: Competitive landscape and market boundary
  body: 'ClickHouse competes in a broader field than the label “data warehouse” implies. The company incorporated in 2021
    around an open-source project that was already well known in analytical databases, and its commercial pitch now spans
    real-time analytics, data warehousing, observability, and AI-linked serving workloads. That breadth pulls in two kinds
    of direct rivals. First are broad analytical platforms such as Snowflake and Databricks, which can capture the same strategic
    budget when a buyer wants one governed system for engineering, analytics, and AI. Second are incumbent hyperscaler services
    such as BigQuery, Redshift, and Athena, which can solve enough of the same job while benefiting from existing cloud procurement
    relationships. The substitute set is different again: DuckDB, Apache Druid, StarRocks, and SingleStore each cover narrower
    slices of the same analytical problem, especially embedded analytics, streaming-first analytics, or low-latency serving.
    The practical status quo is therefore not one alternative but a mix of broader suites, bundled cloud services, and open-source
    or self-managed point solutions.'
