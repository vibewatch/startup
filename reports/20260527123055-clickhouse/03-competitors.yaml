- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Open-source credibility and developer adoption lower adoption friction
    - Open substitutes such as DuckDB, Druid, and StarRocks also speak to engineers and lower lock-in
    - Medium
    - Ask management for conversion rates from open-source users to paid cloud and enterprise support
  - - Flexible deployment supports sovereignty and regulated buyer narratives
    - Hyperscaler services still win when procurement convenience outweighs sovereignty benefits
    - High
    - Request ARR mix by self-managed, sovereign, and managed cloud deployments
  - - Speed-sensitive serving and observability are attractive ClickHouse wedges
    - Snowflake, Databricks, and Redshift all continue to market performance improvements and AI-adjacent analytical breadth
    - High
    - Review workload-level win-loss data for observability and user-facing analytics evaluations
  - - Public pricing philosophy suggests efficient burst economics
    - Incumbents such as AWS, BigQuery, Athena, Imply, and SingleStore often publish simpler public starting prices
    - Medium
    - Request realized enterprise discount bands and pilot-to-production cost curves
  - - Capital and customer momentum make ClickHouse credible in enterprise deals
    - Commercial reach still trails hyperscalers and likely trails Snowflake and Databricks field coverage
    - High
    - Test partner-sourced pipeline, channel leverage, and regional sales coverage versus direct rivals
  - - Workload specialization avoids becoming a me-too suite
    - Broader governed data-and-AI suites can absorb more budget even when ClickHouse wins on speed
    - High
    - Ask whether ClickHouse is winning primary platform deals or mainly landing as a specialist workload engine
  notes: The key question is whether ClickHouse can turn technical and community strengths into sustained share gains against
    broader bundles and narrower substitutes.
