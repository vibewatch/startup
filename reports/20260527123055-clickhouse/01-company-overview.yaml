- id: founders-leadership-and-governance
  title: Founders, leadership, and governance
  body: 'The founding team combines original technical authorship with enterprise go-to-market and product-scale experience. Alexey Milovidov created ClickHouse inside Yandex and remains the technical anchor as CTO. Aaron Katz, a former Salesforce and Elastic executive, brought the commercialization playbook and serves as CEO. Yury Izrailevsky, whose prior roles included senior engineering leadership at Netflix and Google, serves as president and provides the product and engineering-scale bridge between a beloved open-source project and a global software company.


    Governance is more investor-shaped than publicly transparent. Index''s long-form origin story makes clear that Mike Volpi of Index Ventures and Peter Fenton of Benchmark were not passive capital providers; they worked with Katz on the spin-out structure that created an independent, majority-controlled Delaware company. Separate current-profile sources show both Volpi and Fenton serving on ClickHouse''s board, which gives the company experienced infrastructure-software oversight even though the broader board and observer slate is not fully public. Leadership depth also improved in 2025 when ClickHouse added Kevin Egan as CRO, Mariah Nagy as VP People, and Jimmy Sexton as CFO. That trio matters because it signals a transition from founder-led formation into late-stage operating discipline across revenue, talent, and finance.'
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO021
  - CO022
  - CO033
  - CO042
  tableRefs:
  - TO002
- id: capital-base-and-scale
  title: Capital base, investor continuity, and commercial scale
  body: 'ClickHouse''s funding history shows an unusually compressed venture trajectory. Index Ventures and Benchmark led the $50 million Series A in August 2021 as the spin-out formed. Barely two months later, the company raised a $250 million Series B at a $2 billion valuation, led by Coatue and Altimeter with participation from Benchmark, Lightspeed, Almaz, and other growth investors. That 2021 financing burst funded the cloud buildout and moved ClickHouse from an admired open-source project into a company with enough capital to scale globally.


    The next major re-rating arrived in May 2025. Company and investor releases confirm a $350 million Series C led by Khosla Ventures, with new investors BOND, IVP, Battery Ventures, and Bessemer joining a follow-on set that included Benchmark, Coatue, Lightspeed, FirstMark, GIC, and Nebius. Goodwin and company releases also confirm a parallel $100 million credit facility led by Stifel and Goldman Sachs. Third-party coverage places the round at roughly a $6.35 billion to $6.4 billion valuation and total funding above $650 million. Public operating signals fit a late-stage growth profile: 2,000-plus customers by 2025, more than 300% annual growth according to the company, public revenue/ARR markers around $100 million annualized in mid-2025 and roughly $160 million ARR by end-2025, and employee counts in the low-to-mid 500s by 2026.'
  claimRefs:
  - CO017
  - CO018
  - CO019
  - CO020
  - CO023
