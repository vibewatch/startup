chapter:
  number: 1
  title: Company Overview
  summary: ClickHouse is the 2021 commercial company built around a database project that began inside Yandex in 2009 and was open-sourced in 2016. Founders Aaron Katz, Alexey Milovidov, and Yury Izrailevsky turned that origin into a Bay Area and Amsterdam-centered, globally distributed real-time analytics company that raised a $350 million Series C in May 2025 at roughly a $6.35 billion valuation after a $250 million Series B at a $2 billion valuation in 2021. Public sources support 2,000-plus customers, 500-plus employees, and ARR around $160 million by end-2025, while key diligence questions remain around audited financials, exact investor rights, and the residual governance perception risk from Yandex-era origins plus disclosed security vulnerabilities.
