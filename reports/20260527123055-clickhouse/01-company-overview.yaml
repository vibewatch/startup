sections:
- id: identity-and-footprint
  title: Identity, origin, and operating footprint
  body: 'ClickHouse is easiest to understand as two linked entities: an analytics database project that began inside Yandex in 2009 and a commercial company incorporated in Delaware in 2021 to commercialize that project globally. The technical lineage matters because it explains why ClickHouse arrived on the market with unusual performance credibility: it was built for Yandex.Metrica-scale analytical workloads long before it became a venture-backed startup. The commercial company now describes the product as a fast, open-source, column-oriented database for real-time analytics, with monetization centered on ClickHouse Cloud and adjacent real-time analytics, observability, and AI/ML workloads.


    The footprint is similarly hybrid. Official history places headquarters in the San Francisco Bay Area, while current third-party profiles variously label the company as San Francisco, Portola Valley, or Palo Alto. Those labels are inconsistent at the street-address level but consistent on the larger point that ClickHouse is a Bay Area-headquartered company with a meaningful Amsterdam office and a deliberately distributed workforce. Official sources say employees are spread across more than 10 countries, and public profiles support a 500-plus employee scale by 2026. For later chapters, the most defensible shorthand is therefore: Bay Area headquarters, Amsterdam engineering and European hub, and globally distributed operations.'
  claimRefs:
  - CO001
  - CO003
  - CO004
  - CO008
  - CO009
  - CO010
