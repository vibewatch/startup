- id: TR003
  title: Competitive / substitution risk register
  columns:
  - Threat
  - Why it matters
  - Public evidence
  - Likelihood
  - Severity
  - Current offset
  rows:
  - - Snowflake and Databricks budget gravity
    - They remain the reference cloud data platforms for large enterprise budgets and hold much stronger independent mindshare.
    - 'DB-Engines ranked Snowflake #6 and Databricks #7 versus ClickHouse #26 in May 2026; TechCrunch still labels ClickHouse
      a challenger.'
    - high
    - high
    - ClickHouse has a strong performance narrative and migration stories for targeted workloads
  - - StarRocks join-heavy momentum
    - Benchmark discourse keeps positioning StarRocks as stronger on wide-table and multi-table scenarios that matter in operational
      analytics.
    - StarRocks-sponsored Habr benchmark claimed 2.2x better SSB performance and said ClickHouse could not complete its TPC-H
      set.
    - medium-high
    - high
    - ClickHouse markets improving JOIN support and still wins many aggregation-centric workloads
  - - DuckDB local / embedded substitution
    - Developers can solve many exploratory and embedded analytics problems without adopting a hosted cloud service.
    - Exasol benchmark says DuckDB remains attractive where operational simplicity matters; DB-Engines shows DuckDB still
      gaining mindshare.
    - medium
    - medium-high
    - ClickHouse counters with local CLI, clickhouse-local, and chDB to keep users in its ecosystem
  - - OSS good-enough competition
    - If self-managed ClickHouse, forks, or managed alternatives solve enough use cases, cloud monetization can lag broad
      adoption.
    - Altinity warns cloud-only features and open-core drift change community incentives; Tinybird markets managed ClickHouse
      and alternative developer experience.
    - medium
    - high
    - Large community and official cloud tooling still give ClickHouse a strong upgrade path
