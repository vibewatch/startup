- id: TR006
  title: Adverse signal log
  columns:
  - Signal
  - Evidence
  - Why adverse
  - What offsets it
  - What to monitor next
  rows:
  - - Valuation without public economics
    - The 2025 financing disclosed customer growth but not ARR, margins, or profitability.
    - Execution risk is being capitalized before public unit economics are visible.
    - The company clearly has product momentum and blue-chip customers.
    - Revenue-quality disclosure and cohort economics
  - - Open-core anxiety from ecosystem insiders
    - Altinity says meaningful features are becoming cloud-only and governance needs clearer separation.
    - Community trust can erode even while product demand remains strong.
    - Apache 2.0 core, large community, and many deployment modes still reduce immediate lock-in.
    - Roadmap transparency, contributor sentiment, and any foundation-style governance moves
  - - Independent benchmark caveats on joins and concurrency
    - Exasol reported weaker distributed completeness and 1.39x runtime degradation at higher concurrency.
    - Buyers with the wrong workload mix may not realize the headline benchmark story.
    - ClickHouse still dominates many aggregation-centric and cost/performance narratives.
    - Reference customers for normalized, join-heavy, and high-concurrency use cases
  - - Enterprise-plan gating of compliance
    - HIPAA and PCI are enterprise features and SLAs cover select committed-spend contracts.
    - Monetization may depend on a narrower set of premium accounts than raw user growth implies.
    - Upsell potential is real if those buyers expand.
    - Plan-tier ARR mix and enterprise gross retention
  - - Visible cloud uptime is good but not elite
    - Public status page showed 98.62% aggregate uptime across Feb-May 2026.
    - The cloud product is still carrying service-quality execution risk in public.
    - AWS-specific uptime was reported at 100% and uptime is transparently disclosed.
    - Service-tier incident distribution and customer-level SLO attainment
  notes: These are not claims of failure; they are the most supportable public signals that could widen into thesis-breakers
    if management execution slips.
