- id: TR004
  title: Customer / dependency / GTM risk register
  columns:
  - Risk
  - Counterparty or dependency
  - Mechanism
  - Evidence
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Under-disclosed customer concentration
    - Top cloud customers and cohorts
    - A few large committed-spend customers could dominate paid cloud economics even though headline customer count is broad.
    - Public disclosures show >2,000 customers and SLA language for committed-spend contracts but no NRR or top-account mix.
    - high
    - Ask for top-10 customer contribution, NRR, gross retention, and sector concentration by ARR
  - - Developer-led funnel monetizes unevenly
    - Self-serve and OSS users
    - High trial volume and local usage may not translate cleanly into durable cloud expansion.
    - Free 30-day trial, $300 credits, OSS core, local modes, and community-first messaging.
    - medium-high
    - Request conversion by cohort, payback by acquisition channel, and cloud attach rate from self-managed users
  - - Hyperscaler route-to-market dependence
    - AWS, GCP, Azure marketplaces
    - Marketplace reach helps distribution but introduces platform, margin, and operational dependence.
    - Cloud page says ClickHouse Cloud is available on all three major cloud marketplaces.
    - medium
    - Review net revenue after marketplace fees and any concentration by cloud provider
  - - Premium compliance revenue concentration
    - Regulated enterprise buyers
    - HIPAA, PCI, and likely deeper support commitments sit with enterprise plans, increasing dependence on larger accounts.
    - Compliance docs gate HIPAA and PCI behind Enterprise plan and SLAs behind committed-spend contracts.
    - medium-high
    - Request ARR mix by plan tier, regulated vertical exposure, and churn history for enterprise cohorts
  - - Named-customer halo overstates diversification
    - Anthropic, Tesla, Meta, Sony, Instacart, others
    - Marquee logos can prove relevance while still masking a narrow revenue base.
    - Press release lists large customers but no revenue split by account, segment, or geography.
    - medium-high
    - Request top-customer share, top-20 share, and AI versus non-AI revenue mix
  notes: This register is intentionally focused on monetization quality rather than raw logo count or download velocity.
