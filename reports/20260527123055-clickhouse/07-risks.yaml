  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-disclosure-gap
    missingEvidence: Current ARR, net revenue retention, gross margin, burn, and cash payback by cohort.
    whyItMatters: These are the minimum inputs needed to judge whether the 2025 valuation can be supported by durable cloud
      economics rather than adoption narrative.
    diligencePath: Request current board package or lender deck with ARR bridge, gross margin, NRR, and burn multiple by plan
      tier.
    relatedQuestionRefs:
    - QR001
    - QR028
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 customer concentration, plan-tier mix, and expansion / churn by regulated versus non-regulated
      cohorts.
    whyItMatters: Public materials show scale but not whether a small set of enterprise accounts anchors most paid cloud revenue.
    diligencePath: Request customer concentration table, plan-tier ARR mix, and cohort retention dashboards.
    relatedQuestionRefs:
    - QR009
    - QR024
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: material
    topic: oss-roadmap-split
    missingEvidence: An explicit public roadmap separating OSS feature commitments from cloud-only differentiators.
    whyItMatters: Without a clean roadmap split, investors cannot tell whether monetization gains are being bought with hidden
      ecosystem attrition.
    diligencePath: Ask management for product-roadmap governance, contributor review SLA, and policy for cloud-only feature
      selection.
    relatedQuestionRefs:
    - QR006
    - QR016
    - QR023
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: minor
    topic: incident-detail
    missingEvidence: Service-tier incident history, customer-level SLO attainment, and support response data behind the aggregate
      public status page.
    whyItMatters: Aggregate uptime is directionally useful but not enough to judge whether critical customers are seeing materially
      different reliability.
    diligencePath: Request 12-month incident review by service tier and support tier, plus top causes and time-to-resolution
      metrics.
    relatedQuestionRefs:
    - QR010
    - QR027
