            body: >-
              ClickHouse’s moat is real but conditional. The strongest durable edge is the combination of open-source
              credibility, deployment sovereignty, and a product reputation built around speed-sensitive analytical
              workloads. That combination is unusual among scaled vendors: Snowflake is more managed and suite-driven,
              Databricks is broader and more workflow-centric, and the hyperscaler services are more procurement-driven
              than community-driven. But that same structure limits hard lock-in. Buyers can multi-home because the
              category is segmented by workload and because open or self-managed alternatives remain credible. Snowflake
              and Databricks threaten ClickHouse from above by widening into governed data and AI suites. BigQuery,
              Redshift, and Athena threaten it from the side through cloud-account control and bundled adjacencies.
