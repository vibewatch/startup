        title: Cloud execution, security, and legal-compliance risk
        blocks:
          - type: paragraph
            body: >-
              ClickHouse has done meaningful work on compliance and cloud operations, but the public record still
              supports a serious execution-risk register. On the positive side, the company documents SOC 2 Type II, ISO
              27001, U.S. DPF, HIPAA, PCI, GDPR, and CCPA workstreams, which should matter to regulated buyers. Yet the
              same materials show that not every protection is universal: some controls and certifications are
              enterprise-plan features, SLAs are limited to select committed-spend contracts, and uptime remains a live
              metric instead of a quiet assumption. The public status page reported only 98.62% aggregate uptime across
              February through May 2026, which is directionally fine for a fast-growing infrastructure company but not
              strong enough to erase cloud- reliability diligence. Security posture creates a second tension. ClickHouse
              Cloud was not vulnerable to the flagship 2025 RCE, which is a positive operational signal, but the OSS
              record still includes RCE, query-cache, and crash-class vulnerabilities that require customers and fork
              maintainers to stay current on patches. For a company selling into enterprise observability, data
              warehousing, and AI applications, reliability and patch discipline are part of product value, not
              back-office hygiene.
