  - id: TV004
    title: Comparable valuation table
    columns:
      - comparable
      - 2026 scale metric
      - valuation / multiple
      - relevance
      - limitation
    rows:
      - - ClickHouse Series C
        - ~$150M-$185M ARR range; 2,000+ customers
        - $6.35B; ~35x-42x ARR
        - The exact underwriting question at issue.
        - Revenue range is estimated rather than audited.
      - - Databricks
        - $5.4B revenue run-rate; >65% growth
        - $134B; ~24.8x revenue
        - Best private high-growth data and AI platform comp.
        - Broader product surface and much larger customer base.
      - - Snowflake
        - $4.68B FY2026 revenue
        - ~$61.55B market cap; ~13.1x revenue
        - Clean public cloud-warehouse comp.
        - Mature public company with lower growth and different governance constraints.
      - - MongoDB
        - $2.46B FY2026 revenue
        - ~$24.74B market cap; ~10.0x revenue
        - Best public open-source premium benchmark.
        - Different workload mix and less direct overlap in observability and analytics.
      - - SingleStore
        - '>$123M ARR; near-breakeven cash flow'
        - ~$1B last known valuation; ~8.1x ARR
        - Closer real-time database comp and useful private floor.
        - Valuation point is older and less liquid than a live financing mark.
    notes: >-
      This is the full comp set explicitly selected for this chapter: ClickHouse’s own round anchor, one scaled private
      platform comp, two public comps, and one closer real-time-database private comp.
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Exhaustive for the explicitly chosen comp basket in this chapter: ClickHouse anchor, Databricks, Snowflake,
        MongoDB, and SingleStore as the full set of named references.
