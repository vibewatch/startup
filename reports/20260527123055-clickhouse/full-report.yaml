      - number: '3.3'
        title: Pricing, deployment models, and GTM strength
        blocks:
          - type: paragraph
            body: >-
              Pricing and deployment model are where ClickHouse most clearly separates from the field. Its public
              pricing narrative stresses independent storage and compute scaling, autoscaling, and scale-to-zero
              economics, while its documentation keeps self-managed and managed consumption on the same underlying
              engine. Snowflake is more explicit than ClickHouse about billing mechanics: warehouses consume credits,
              sizes are published, and the platform separates compute, storage, and data-transfer costs. Databricks is
              public but less benchmark-friendly, publishing list prices and SKU groups instead of one simple comparable
              list rate. BigQuery, Redshift, Athena, Imply, and SingleStore all expose clearer public starting points
              than ClickHouse, which helps buyers model pilots and intermittent workloads. Deployment model also matters
              for trust and regulation: Snowflake, BigQuery, and Athena are primarily managed-service choices;
              SingleStore still supports self-managed deployment; and DuckDB is local by design. That mix drives GTM
