        title: Trust, Roadmap & Product Risks
        blocks:
          - type: paragraph
            body: >-
              On trust and operational maturity, the public surface is better than average for an infrastructure product
              but still incomplete for hard enterprise diligence. ClickHouse publicly documents a meaningful control
              set—SSO, MFA, RBAC, private connectivity options, IP filtering, CMEK, and a compliance list that includes
              GDPR, HIPAA, ISO 27001, PCI DSS, and SOC 2. The Azure GA announcement adds concrete platform-level claims
              around network isolation, traffic encryption, and multi-availability-zone replication. Those are useful
              signals that the managed service is designed for production-sensitive workloads, not only experimentation.


              The remaining risk is not absence of controls but uneven public depth. TrustRadius feedback still points
              to role-granularity and identity-provider limitations, while the broader workflow evidence suggests
              self-service deployments may need an extra semantic or translation layer that ClickHouse does not fully
              own. The 2026 changelog shows an active platform roadmap—autoscaling changes, spend controls, index
              sharding preview, AWS/GCP/Azure region work, and BYOC expansion—but preview features are not yet the same
              as mature, widely deployed defaults. For buyers, the implication is straightforward: ClickHouse appears
              technically strong for high-performance analytics workloads, especially when cloud-managed, but enterprise
              diligence should still press on benchmark methodology, identity governance depth, and the amount of
              surrounding platform code a team must build to democratize access safely.
