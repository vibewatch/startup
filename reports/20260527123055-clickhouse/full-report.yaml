      - - Cloud data warehouse / BI acceleration
        - Managed and self-hosted analytical storage and query infrastructure for dashboards and business analytics
        - Front-end BI licenses and generic ETL-only tools
        - Analytics engineering or data platform team / centralized data budget
        - >-
          ClickHouse data warehousing page explicitly positions the product as a real-time warehouse that improves BI
          speed and concurrency
      - - Real-time product and event analytics
        - Event ingestion query serving and low-latency SQL analytics for apps dashboards and operational reporting
        - OLTP systems of record and stream processing software sold without analytical serving
        - Product engineering or data engineering / VP Engineering or platform budget
        - >-
          ClickHouse official site and use-case pages center on sub-second analytical queries over continuously ingested
          data
      - - Observability and log analytics
        - Logs metrics traces high-cardinality OpenTelemetry data retention and querying
        - Ticketing or incident-management SaaS without analytical storage
        - SRE platform engineering or security operations / infra or observability budget
        - ClickStack puts ClickHouse directly into the OTel observability storage and query layer
      - - AI and model-adjacent analytics
        - Vector-aware retrieval analytics agent telemetry and analytical context around AI systems
        - Core model training or inference spend without analytical storage
        - AI platform team / ML infrastructure or innovation budget
        - >-
          ClickHouse homepage and adjacent competitor pages show the market moving toward AI-powered analytics and
          observability
      - - Self-managed analytical infrastructure
        - Customer-operated clusters on local hardware on-prem or cloud VMs across AWS GCP and Azure
        - Managed SaaS control planes when sovereignty or full operational control is not required
        - Platform engineering / infra budget
        - >-
          Deployment flexibility is a core differentiator because ClickHouse can serve buyers who reject fully
          managed-only products
      - - Status-quo substitutes
        - BigQuery Datadog Elastic AWS OpenSearch and internal self-managed open-source stacks
        - Pure productivity software categories with no analytical data plane
        - Mixed by workload and incumbent stack owner
        - These are the platforms ClickHouse most often displaces or complements depending on the use case
    notes: >-
      The relevant boundary is analytical infrastructure workload spend, not every database dollar. ClickHouse is best
      understood as a reusable engine across warehouse, event analytics, and observability workloads.
