      - number: '1.3'
        title: Capital base, investor continuity, and commercial scale
        blocks:
          - type: paragraph
            body: >-
              ClickHouse's funding history shows an unusually compressed venture trajectory. Index Ventures and
              Benchmark led the $50 million Series A in August 2021 as the spin-out formed. Barely two months later, the
              company raised a $250 million Series B at a $2 billion valuation, led by Coatue and Altimeter with
              participation from Benchmark, Lightspeed, Almaz, and other growth investors. That 2021 financing burst
              funded the cloud buildout and moved ClickHouse from an admired open-source project into a company with
              enough capital to scale globally.


              The next major re-rating arrived in May 2025. Company and investor releases confirm a $350 million Series
              C led by Khosla Ventures, with new investors BOND, IVP, Battery Ventures, and Bessemer joining a follow-on
              set that included Benchmark, Coatue, Lightspeed, FirstMark, GIC, and Nebius. Goodwin and company releases
              also confirm a parallel $100 million credit facility led by Stifel and Goldman Sachs. Third-party coverage
              places the round at roughly a $6.35 billion to $6.4 billion valuation and total funding above $650
              million. Public operating signals fit a late-stage growth profile: 2,000-plus customers by 2025, more than
              300% annual growth according to the company, public revenue/ARR markers around $100 million annualized in
              mid-2025 and roughly $160 million ARR by end-2025, and employee counts in the low-to-mid 500s by 2026.
