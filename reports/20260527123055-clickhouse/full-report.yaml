  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      ClickHouse’s commercial model depends on an upgrade path from open-source and local modes into premium cloud tiers
      without losing users to alternatives.
    data:
      nodes:
        - id: osscore
          label: Apache 2.0 OSS core
          detail: Adoption starts with open source and local use.
          tone: positive
        - id: local
          label: clickhouse-local / chDB / CLI
          detail: Local and embedded modes lower friction for developers.
          tone: positive
        - id: community
          label: Community funnel
          detail: Slack, contributors, PRs, and stars reinforce adoption.
          tone: positive
        - id: cloud
          label: ClickHouse Cloud
          detail: Managed service monetizes convenience and premium features.
          tone: warning
        - id: enterprise
          label: Enterprise compliance tier
          detail: HIPAA, PCI, and SLA-linked economics sit here.
          tone: warning
        - id: hyperscalers
          label: AWS / GCP / Azure marketplaces
          detail: Distribution and operations ride cloud partners.
          tone: warning
        - id: alts
          label: DuckDB / StarRocks / managed alternatives
          detail: Alternative end-states exist for some workloads.
          tone: negative
      edges:
        - from: osscore
          to: local
        - from: local
          to: community
        - from: community
          to: cloud
        - from: cloud
          to: enterprise
        - from: hyperscalers
          to: cloud
        - from: alts
          to: cloud
    approximationNotes: >-
      This map shows commercial dependence, not legal control; alternative paths can either feed or weaken the cloud
      upgrade funnel.
    claimRefs:
      - CR006
      - CR017
      - CR018
      - CR022
      - CR030
      - CR036
      - CR038
      - CR039
      - CR045
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation is driven by a tension: exceptional open-source distribution and cloud growth on one side, and
      a peer-multiple gap plus disclosure gaps on the other.
    data:
      nodes:
        - id: oss
          label: Open-source funnel
          detail: ~46K GitHub stars and broad developer adoption support top-of-funnel strength.
          tone: positive
        - id: cloud
          label: Cloud monetization proof
          detail: $160M 2025 ARR estimate and >250% cloud ARR growth show real conversion, not just usage.
          tone: positive
        - id: price
          label: $6.35B Series C
          detail: The round implied roughly 35x-42x trailing ARR on a ~$150M-$185M ARR frame.
          tone: warning
        - id: comps
          label: Peer multiple gap
          detail: Snowflake and MongoDB trade closer to ~10x-13x, while Databricks sits near ~25x on far greater scale.
          tone: warning
        - id: gaps
          label: Disclosure gaps
          detail: Public evidence still lacks audited financials, retention, margin, and cap-table detail.
          tone: warning
        - id: decision
          label: Track
          detail: Stay close, but require proof that ClickHouse can grow into the multiple before paying up.
          tone: neutral
      edges:
        - from: oss
          to: cloud
        - from: cloud
          to: price
        - from: price
          to: decision
        - from: comps
          to: decision
        - from: gaps
          to: decision
    approximationNotes: This figure expresses underwriting logic, not a process flow inside the product.
    claimRefs:
      - CV011
      - CV012
      - CV014
      - CV029
      - CV037
      - CV043
  - id: FV002
    title: Valuation sensitivity — trailing multiple snapshot versus peers
    type: bar
    layout: wide
    summary: >-
      On a trailing basis, ClickHouse’s Series C mark sits far above public and open-source comps and still above
      Databricks’ richer private multiple.
    data:
      items:
        - label: ClickHouse @ $150M ARR
          value: 42.3
          detail: $6.35B divided by $150M ARR.
          tone: negative
        - label: ClickHouse @ $160M ARR
          value: 39.7
          detail: $6.35B divided by Sacra’s $160M ARR estimate.
          tone: warning
        - label: ClickHouse @ $185M ARR
          value: 34.3
          detail: $6.35B divided by the top of the requested underwriting range.
          tone: warning
        - label: Databricks
          value: 24.8
          detail: $134B valuation on a $5.4B revenue run-rate.
          tone: neutral
        - label: Snowflake
          value: 13.1
          detail: Market cap divided by FY2026 revenue.
          tone: neutral
        - label: MongoDB
          value: 10
          detail: Market cap divided by FY2026 revenue.
          tone: neutral
        - label: SingleStore
          value: 8.1
          detail: $1B last known valuation divided by >$123M ARR.
          tone: positive
    approximationNotes: >-
      Multiples are simplified EV or market-cap-to-revenue bridges using publicly available valuation and revenue
      figures; private-company enterprise values may differ from headline equity valuations.
    claimRefs:
      - CV013
      - CV014
      - CV017
      - CV019
      - CV024
      - CV027
      - CV029
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      The current mark sits near the top of the base case and requires very strong forward ARR growth to avoid slipping
      into the bear range.
    data:
      items:
        - label: Bear case
          low: 3000
          mid: 3500
          high: 4000
          detail: Growth slows toward public-comp trajectories and valuation compresses toward low-teens multiples.
          tone: negative
        - label: Base case
          low: 5000
          mid: 5800
          high: 6500
          detail: ClickHouse crosses roughly $280M-$320M ARR and keeps a high-teens to ~20x forward multiple.
          tone: warning
        - label: Bull case
          low: 7500
          mid: 8500
          high: 9500
          detail: ARR surges toward ~$400M and the AI/open-source premium remains intact.
          tone: positive
    approximationNotes: >-
      Values are expressed in USD millions and represent scenario-based valuation outcomes rather than discounted
      cash-flow estimates.
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV038
      - CV039
      - CV045
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      ClickHouse scores very well on market and product factors, but much worse on disclosure quality and current entry
      valuation.
    data:
      items:
        - label: Market tailwind
          score: 8
          detail: AI, observability, and real-time analytics all support category demand.
          tone: positive
        - label: Product moat
          score: 8
          detail: Real-time analytical performance and architecture are genuine product strengths.
          tone: positive
        - label: Open-source distribution
          score: 8
          detail: Developer adoption is broad enough to create a credible commercial funnel.
          tone: positive
        - label: Cloud monetization proof
          score: 6
          detail: The ARR estimate and growth rate are impressive but still not audited.
          tone: neutral
        - label: Comparable support
          score: 4
          detail: The current trailing multiple sits above every named peer.
          tone: warning
        - label: Enterprise readiness
          score: 5
          detail: The path is plausible, but public enterprise-proof metrics remain incomplete.
          tone: warning
        - label: Evidence quality
          score: 4
          detail: Key underwriting metrics remain undisclosed in retained public sources.
          tone: warning
        - label: Entry valuation discipline
          score: 3
          detail: New money should assume very little margin for error at the headline price.
          tone: negative
    approximationNotes: >-
      Scores are 0-10 underwriting judgments synthesized from the public evidence and are meant for internal
      investment-committee discussion.
    claimRefs:
      - CV009
      - CV011
      - CV029
      - CV037
      - CV043
      - CV044
