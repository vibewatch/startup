  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and status-quo substitutes
        blocks:
          - type: paragraph
            body: |-
              ClickHouse should be analyzed as analytical data infrastructure rather than as a generic
              database. Official ClickHouse materials consistently position the product as a fast,
              column-oriented OLAP database used for real-time analytics, observability, data warehousing,
              and ML/GenAI workloads. That framing matters because the relevant spend is not “all
              databases,” and it is not “all business intelligence software” either. The included budget
              pool is the infrastructure layer where teams need high-ingest, low-latency SQL analytics on
              large event, telemetry, or warehouse datasets.

              Inside the boundary are four primary spend buckets. First is cloud data warehousing and BI
              acceleration, where analytics engineering teams replace or complement slower warehouse layers
              with a faster analytical store. Second is real-time product and event analytics, where product
              or data platform teams ingest streaming events and serve dashboards or user-facing analytical
              applications. Third is observability and log analytics, where SRE, platform, and security
              teams store and query logs, metrics, traces, and high-cardinality OpenTelemetry data.
              Fourth is AI-adjacent analytics infrastructure, where teams want vector-aware retrieval,
              fast aggregations, and operational analytics around AI systems.

              The market boundary explicitly excludes OLTP systems of record, front-end BI tools as a
              standalone category, and generalized data lake storage that does not itself deliver
              low-latency SQL serving. The status-quo substitute set is strong and segmented: BigQuery is
              the default serverless cloud data warehouse for many Google Cloud buyers; Datadog, Elastic,
              and AWS OpenSearch bundle logs, metrics, traces, search, and increasingly AI or vector
              workflows inside their own managed platforms; and self-managed open-source infrastructure
              remains the control-oriented alternative for teams that prefer to avoid managed service lock-
              in. ClickHouse’s advantage is that it can sit across these use cases with one core engine, but
              the boundary logic only works if the chapter treats it as overlapping analytical spend rather
              than one monolithic “database market.”
