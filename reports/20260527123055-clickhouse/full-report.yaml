  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base and Segment Mix
        blocks:
          - type: paragraph
            body: >
              ClickHouse's visible customer base is not broad in a generic SMB sense; it is deep in a handful of
              technical buyer groups that all need low-latency analytics over very large datasets. The dominant
              recurring segment is observability and telemetry: Cloudflare, OpenAI, Anthropic, Tesla, Qonto, Langfuse,
              and Lyft all use ClickHouse to store or query logs, traces, metrics, or internal analytical event streams
              where speed and high-cardinality exploration matter more than classical BI polish. A second major segment
              is customer-facing product and usage analytics, visible in Microsoft Clarity, Replo, Mintlify, Padlet,
              Ramp, Buildkite, and Polymarket, where ClickHouse sits behind dashboards, reporting, budgeting,
              experimentation, or leaderboard products that external customers touch directly. The common buyer is
              usually an engineering, platform, or data team; the end user is a broader set of analysts, operators,
              finance teams, teachers, developers, or SaaS customers who are intentionally insulated from raw ClickHouse
              complexity. That segmentation is a real strength because it clusters around workloads where ClickHouse's
              performance advantage is tangible, but it also means customer concentration risk should be assessed by
              workload family as much as by logo count: public proof is much denser in observability and real-time
              analytics than in classical enterprise warehouse use cases. The accessible public record also splits
              cleanly by evidence quality. Recent case-study customers provide high-confidence production proof with
              named speakers and quantified outcomes, while legacy marquee names like eBay, Spotify, Uber, and ByteDance
              appear mainly in adopter lists or slide references and should be treated as weaker proof unless diligence
              surfaces fresher deployment detail.
