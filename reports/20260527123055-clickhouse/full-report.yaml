      - number: '6.3'
        title: Retention Proxies, Procurement, and Expansion Motion
        blocks:
          - type: paragraph
            body: >
              ClickHouse does not publicly disclose customer NRR, GRR, logo retention, renewal rates, or top-account
              expansion cohorts, so durability has to be inferred from weaker proxies. The best available public proxies
              are product reviews and the shape of customer stories. On the positive side, PeerSpot users rate
              ClickHouse 8.6/10 and repeatedly cite performance, compression, scalability, and the lack of hard vendor
              lock-in because the self-hosted open-source version remains available. TrustRadius reviewers similarly
              describe ClickHouse as a primary real-time warehouse and praise MergeTree performance and data skipping.
              On the negative side, the same review set raises recurring complaints around cloud RBAC granularity, SSO
              gaps, documentation, UI maturity, setup complexity, and cloud-cost management. Those are not fatal, but
              they imply retention depends on technically capable customers who can absorb product rough edges. Public
              customer stories also show a consistent procurement and expansion path. Teams often start with a narrow
              high-value workload, prove latency or cost gains, then expand into adjacent product surfaces. Open-source
              trialability lowers evaluation friction, while ClickHouse Cloud's separate storage and compute,
              autoscaling, scale-to-zero, and operational offload support expansion once workloads reach multi-team or
              enterprise importance. That procurement shape is favorable, but without renewal and expansion-rate data it
              remains a thesis, not a verified customer durability metric.
