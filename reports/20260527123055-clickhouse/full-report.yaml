  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Platform
      - Price / unit / contract model
      - Included capabilities
      - Discount / unknowns
      - Competitive implication
    rows:
      - - ClickHouse
        - Usage-based cloud pricing with separate compute and storage, autoscaling, and scale-to-zero behavior
        - Managed cloud for real-time analytics, warehousing, observability, and AI-serving use cases
        - Public pricing philosophy is clear, but realized enterprise discount bands are not disclosed
        - >-
          Strong for engineering buyers who value efficient bursty workloads, weaker for CFOs wanting a one-line public
          list rate
      - - Snowflake
        - Compute credits plus storage and data-transfer charges; warehouses billed per second with a 60-second minimum
        - Managed multi-cloud analytics and AI data platform with governed warehouses
        - Net price varies by edition, cloud, and negotiated credit economics
        - Highly benchmarkable billing mechanics make Snowflake easy to model against ClickHouse
      - - Databricks
        - Undiscounted list prices and SKU groups across cloud providers
        - Lakehouse platform spanning data engineering, governance, analytics, and AI
        - Public list price exists, but practical comparison depends on SKU mix and negotiated terms
        - Broad platform scope is strong, but list-price complexity obscures easy apples-to-apples comparison
      - - BigQuery
        - Serverless compute plus storage pricing, with free tier and slot reservations
        - Warehouse and AI platform services inside Google Cloud
        - Actual cost depends on scan volume, slot commitments, and adjacent Google services
        - Very easy pilot path and strong serverless simplicity for GCP-centric teams
      - - Redshift
        - Provisioned starts at $0.543/hour and serverless at $1.50/hour, with reservation discounts
        - AWS-native warehouse and lakehouse service
        - Total cost still depends on data, concurrency, and AWS estate context
        - Clear entry pricing and AWS procurement leverage make Redshift a practical incumbent alternative
      - - Athena
        - Pay for data processed or compute used with no infrastructure management
        - Ad hoc SQL and Spark analytics directly on S3 and other sources
        - Efficient only when query patterns and data layout stay disciplined
        - >-
          Excellent for intermittent AWS-native analytics; less differentiated as a persistent high-concurrency serving
          layer
      - - DuckDB
        - Free open-source software
        - Embedded local analytical engine
        - Enterprise support and hosted control-plane economics are not the point of the product
        - Very strong substitute for local analytics, but not a like-for-like cloud platform replacement
      - - StarRocks
        - Public commercial pricing is limited in reviewed sources
        - Real-time, lakehouse, and AI analytics engine
        - Customers likely need direct engagement for pricing certainty
        - Lower transparency makes quick procurement harder despite attractive technical positioning
      - - Imply Polaris
        - Starter from $100/month, Standard from $600/month, Custom by quote
        - Real-time analytics DBaaS on top of Druid lineage
        - High-scale or tailored environments still require enterprise discussion
        - Transparent for early-stage tests and smaller workloads
      - - SingleStore
        - Usage-based credits plus storage charges and commitment pricing
        - Cloud DBaaS for real-time transactions plus analytics
        - TCO depends on workload shape and chosen edition
        - >-
          Clearer than ClickHouse or Databricks for initial modeling, but optimized for a somewhat different
          mixed-workload buyer
    notes: >-
      This table compares public packaging and pricing mechanics rather than negotiated net price or full
      workload-specific TCO.
