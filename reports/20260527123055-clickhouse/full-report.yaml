  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor
      - Category
      - Scale / funding
      - Target segment
      - Deployment / open-source posture
      - Best-fit workloads
      - Pricing / positioning
    rows:
      - - ClickHouse
        - Reference platform
        - Commercial company incorporated in 2021; $350M Series C in May 2025; 2,000+ customers
        - Engineering-led teams building user-facing analytics, observability, and fast warehouse workloads
        - Open-source core, self-managed server plus managed cloud on major marketplaces
        - Real-time analytics, observability, data warehousing, AI-adjacent analytical serving
        - >-
          Usage-based cloud pricing with separate compute and storage; public philosophy clearer than realized
          enterprise net price
      - - Snowflake
        - Direct incumbent
        - $9.77B RPO; 790 Forbes Global 2000 customers; 733 $1M+ customers
        - Enterprise analytics, governed data sharing, cross-cloud SQL and AI buyers
        - Managed multi-cloud service; proprietary platform with strong governance controls
        - SQL analytics, data sharing, governed AI-data platform
        - Explicit compute, storage, and data-transfer pricing with warehouse credits and per-second billing
      - - Databricks
        - Direct broad-platform rival
        - 20,000+ organizations; 70% of Fortune 500; 1,200+ partners
        - Enterprise data engineering, lakehouse, governance, and AI teams
        - Commercial lakehouse platform with open-format posture rather than an open-source core
        - Data engineering, lakehouse, governance, analytics, and AI workflows
        - Public list-price and SKU groups exist, but comparison is less simple than clear starting tariffs
      - - BigQuery
        - Hyperscaler incumbent
        - >-
          Backed by Google Cloud distribution and free-tier funnel; public-company parent with disclosed investor
          reporting
        - GCP-centric analytics, BI, and AI teams
        - Managed Google Cloud service; proprietary but highly serverless
        - Serverless warehouse, AI analytics, and Google-native data applications
        - Compute plus storage pricing with free tier and slot reservations
      - - Redshift / Athena
        - Hyperscaler warehouse substitute
        - Backed by AWS distribution and annual-report-scale parent
        - AWS-native data teams standardizing on S3, SageMaker, and zero-ETL paths
        - Managed AWS services rather than open-source products
        - Warehouse, lakehouse, ad hoc SQL, and serverless analytics over S3
        - Redshift and Athena both publish concrete entry pricing that lowers pilot friction
      - - DuckDB
        - Embedded substitute
        - Open-source foundation project; no evidence of a large enterprise field-sales motion in reviewed sources
        - Developers and analysts doing local, notebook, application, or embedded analytics
        - MIT-licensed embedded database with no server process
        - Local analytics, embedded analytics, single-node analytical processing
        - Free open-source software rather than a public enterprise SaaS tariff
      - - StarRocks
        - Adjacent real-time challenger
        - >-
          Smaller independent vendor in reviewed public materials; enterprise-scale analytics pitch but little public
          scale disclosure
        - Teams wanting low-latency SQL over fresh lakehouse or real-time data
        - Open-source-flavored analytical database with cloud ambitions but limited public commercial detail
        - Real-time analytics, lakehouse querying, AI-oriented SQL serving
        - Public commercial pricing is less transparent than major hyperscaler or DBaaS rivals
      - - Apache Druid / Imply
        - Streaming-first substitute
        - Apache project plus commercial Imply distribution; Polaris public starter and standard tiers
        - Streaming-heavy analytics, ad-tech, telemetry, and customer-facing real-time dashboards
        - Open-source Druid core with commercial cloud and enterprise wrappers from Imply
        - Streaming-first real-time analytics and high-concurrency querying
        - Open-source core plus DBaaS tiers starting at $100/month and $600/month
