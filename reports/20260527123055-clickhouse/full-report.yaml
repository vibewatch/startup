  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Scope & Delivery Model
        blocks:
          - type: paragraph
            body: >-
              ClickHouse is not a single SKU so much as a product family anchored on one analytics engine. The public
              record supports three concrete delivery surfaces. First, there is the open-source column-oriented OLAP
              database itself. Second, there is ClickHouse Cloud, which is explicitly positioned as a fully managed
              service and available across the major cloud marketplaces/providers. Third, there are managed workflow
              surfaces around the engine—most visibly ClickPipes for ingestion plus cloud operations surfaces such as
              the SQL console and clickhousectl. That means the customer decision is less about whether ClickHouse is
              “database or platform” and more about which layer of the stack they want ClickHouse to operate for them.


              In customer workflow terms, the product is strongest where a team wants fast analytical storage plus
              operational convenience, not where it wants a complete semantic BI stack out of the box. ClickHouse
              Cloud’s pitch is operational relief: serverless operations, autoscaling, backups, replication, and
              provider choice. ClickPipes reduces the amount of custom ingestion plumbing a team has to maintain.
              Microsoft’s connector and Azure integration evidence show the workflow extending into BI and event
              pipelines, while the module map shows that the cloud control plane materially changes setup, scaling, and
              integration work compared with a raw self-managed deployment. The main diligence nuance is that many
              surrounding workflows still depend on third-party or partner tools rather than a single vertically
              integrated ClickHouse-native application layer.
