      - number: '8.5'
        title: 'Exit readiness and diligence asks: the missing metrics are exactly the ones needed to justify the premium'
        blocks:
          - type: paragraph
            body: >-
              The evidence gap is not around product relevance; it is around economic proof. Public sources do not
              provide audited ClickHouse financials, net retention, gross margin, or the conversion quality from
              open-source users to paid cloud cohorts. Nor do retained public sources disclose liquidation preferences
              or cap-table details that could change the economics of the Series C headline. That leaves the round
              looking more like a conviction bet on category leadership than a price backed by investor-complete
              disclosure. For that reason, the chapter’s diligence posture should stay focused on the metrics that could
              move the recommendation. A buy call would require audited or management-backed disclosure on ARR quality,
              retention, margin structure, and enterprise conversion. Without those, the stronger argument is to track
              the company closely, keep price discipline, and underwrite only after the business proves it can grow into
              the multiple rather than merely narrate its way toward it.
            claimRefs:
              - CV037
              - CV043
              - CV044
              - CV045
          - type: table
            tableRef: TV006
            claimRefs:
              - CV037
              - CV043
              - CV044
              - CV045
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Current call: track'
            body: >-
              ClickHouse looks like a strong company, but the public evidence does not yet support treating the May 2025
              Series C as an obvious bargain.
            calloutType: recommendation
            claimRefs:
              - CV014
              - CV029
              - CV043
          - type: callout
            title: Open-source distribution is the real premium driver
            body: >-
              The best argument for paying up is that broad developer adoption can keep feeding ClickHouse Cloud and let
              the company grow into the mark.
            calloutType: strength
            claimRefs:
              - CV006
              - CV010
              - CV011
              - CV034
          - type: callout
            title: The multiple gap versus peers is the central problem
            body: >-
              Even generous ARR assumptions still leave ClickHouse trading above Snowflake, MongoDB, and SingleStore,
              and ahead of Databricks on a trailing basis.
            calloutType: risk
            claimRefs:
              - CV014
              - CV017
