      - number: '8.4'
        title: >-
          Scenario analysis: the mark works only if ClickHouse can move from ~40x trailing ARR to a lower forward
          multiple quickly
        blocks:
          - type: paragraph
            body: >-
              The key valuation question is not whether ClickHouse is good. It is whether the company can compound fast
              enough to make a $6.35 billion entry look reasonable in hindsight. On peer multiples, the required scale
              jump is large. At Snowflake’s public multiple, ClickHouse would need roughly $485 million of ARR or
              revenue. At MongoDB’s multiple, it would need roughly $632 million. Even a Databricks-like premium still
              demands about $256 million. That is why the base case should be framed on forward ARR, not trailing ARR.
              If ClickHouse can convert its open-source funnel into enterprise cloud ARR and cross roughly $280 million
              to $320 million in the next 12 to 18 months, the current mark starts to look defensible. If growth stalls,
              if enterprise readiness lags, or if public comps de-rate further, downside is severe because there is so
              much air between the current multiple and public trading bands.
