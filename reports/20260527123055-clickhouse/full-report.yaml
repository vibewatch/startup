            body: >-
              The final risk bucket is not whether ClickHouse has demand; it is whether the demand converts into
              durable, diversified, and profitable cloud revenue. Public evidence clearly supports a developer-led
              funnel: free credits, local modes, embedded options, OSS community scale, and easy experimentation are all
              designed to maximize adoption. That is a strength for product distribution, but it can also mask weak
              cohort economics if a relatively small number of enterprise customers account for a disproportionate share
              of paid cloud spend. Public materials describe more than 2,000 customers and list several marquee
              accounts, yet they do not show top-customer share, NRR, gross margin, or cloud-versus-self-managed
              conversion. That omission matters because premium features such as HIPAA, PCI, and SLA commitments appear
