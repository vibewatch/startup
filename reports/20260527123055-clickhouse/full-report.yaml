  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity ranking and underwriting frame
        blocks:
          - type: paragraph
            body: >-
              ClickHouse’s risk profile is unusual because the company simultaneously enjoys obvious product momentum
              and a still-fragile underwriting record. The strongest public positives are real: the company raised $350
              million at a $6.35 billion valuation in May 2025, said it had grown more than 300% year over year, and
              disclosed more than 2,000 customers spanning AI, observability, real-time analytics, and warehousing
              workloads. But the valuation case is still carried more by usage momentum and category positioning than by
              disclosed economics. The financing materials do not publish ARR, revenue, gross margin, or profitability,
              so the path from open- source adoption and free-trial conversion to durable public-market-quality earnings
              remains opaque. The most important risks therefore cluster around five themes: open-source commoditization
              and governance tension; competition from Snowflake and Databricks for large cloud data budgets; emerging
              substitution pressure from StarRocks on join-heavy workloads and DuckDB on local developer workflows;
              cloud execution risk in uptime, security, and patching; and customer-quality risk because public materials
              describe scale without showing concentration, retention, or cohort economics. None of these risks is fatal
              on its own, but together they set a high bar for post-funding execution.
            claimRefs:
