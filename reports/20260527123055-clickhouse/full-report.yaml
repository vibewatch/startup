      - number: '3.2'
        title: Profiles, workload fit, and open-source posture
        blocks:
          - type: paragraph
            body: >-
              ClickHouse is strongest when an engineering-led buyer wants high-concurrency analytical serving, fast SQL
              over large datasets, or one engine that can support observability and real-time product analytics without
              forcing a broad suite commitment. Snowflake and Databricks are the closest broad-platform competitors, but
              for different reasons. Snowflake brings the most mature public scale and an AI Data Cloud story with
              explicit governance and warehouse economics, while Databricks brings a wider open-format lakehouse
              narrative plus much larger partner and customer reach. BigQuery, Redshift, and Athena matter less because
              they look identical product-for-product and more because they make “good enough” analytics purchasable
              inside Google Cloud or AWS. DuckDB and Druid are more specialized substitutes: DuckDB is ideal for
              embedded and local analytics, while Druid is built for streaming-heavy real-time use. StarRocks and
              SingleStore sit in the middle, overlapping with ClickHouse on low-latency analytical serving while leaning
              harder into lakehouse and HTAP-style positioning. The open-source story matters here: ClickHouse, DuckDB,
              and Druid clearly retain project-level credibility, whereas Databricks emphasizes open formats and the
              large incumbents emphasize managed services.
