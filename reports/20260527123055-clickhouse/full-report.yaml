  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and market boundary
        blocks:
          - type: paragraph
            body: >-
              ClickHouse competes in a broader field than the label “data warehouse” implies. The company incorporated
              in 2021 around an open-source project that was already well known in analytical databases, and its
              commercial pitch now spans real-time analytics, data warehousing, observability, and AI-linked serving
              workloads. That breadth pulls in two kinds of direct rivals. First are broad analytical platforms such as
              Snowflake and Databricks, which can capture the same strategic budget when a buyer wants one governed
              system for engineering, analytics, and AI. Second are incumbent hyperscaler services such as BigQuery,
              Redshift, and Athena, which can solve enough of the same job while benefiting from existing cloud
              procurement relationships. The substitute set is different again: DuckDB, Apache Druid, StarRocks, and
              SingleStore each cover narrower slices of the same analytical problem, especially embedded analytics,
              streaming-first analytics, or low-latency serving. The practical status quo is therefore not one
              alternative but a mix of broader suites, bundled cloud services, and open-source or self-managed point
              solutions.
