      - number: '2.3'
        title: Buyer, user, payer, and deployment-path segmentation
        blocks:
          - type: paragraph
            body: |-
              ClickHouse’s buyer map splits by workflow rather than by industry slogan. The first buyer is
              the data platform or product analytics team that needs real-time event analytics for dashboards,
              user-facing applications, or operational reporting. Here the user is usually a data engineer,
              backend engineer, or analytics engineer; the budget owner is a VP of Engineering or head of
              data platform; and the adoption trigger is performance pain in an incumbent warehouse or the
              need to serve interactive analytics on continuously ingesting event streams.

              The second buyer is the BI or analytics engineering organization modernizing warehouse and
              customer analytics workloads. ClickHouse’s official warehousing page explicitly positions the
              product as a real-time data warehouse that improves query speed and concurrency at lower cost.
              In this segment, the payer is often a centralized data platform or IT budget, and the
              comparison set includes BigQuery and other managed warehouse platforms.

              The third buyer is the SRE, observability, or platform engineering team dealing with log,
              metric, and trace volume. ClickStack’s positioning around OpenTelemetry, sub-second queries,
              and high-cardinality telemetry is aimed directly at these teams, while competitor pages from
              Datadog, Elastic, and AWS OpenSearch show the same buyer already shopping unified, managed
              observability platforms. For these buyers, the payer is usually an infrastructure, platform,
              or security operations budget, and the key trigger is cost or performance pain at current log
              retention and query volumes.

              A fourth, earlier-stage segment is AI/ML platform teams that want fast analytical storage,
              vector-aware retrieval, and observability around AI systems. The adoption path usually starts
              with a self-hosted proof of concept or existing open-source use, then moves toward ClickHouse
              Cloud or managed ClickStack when the organization wants autoscaling, simpler upgrades, and
              lower operations burden. That dual cloud/self-managed path is strategically important because
              some buyers are explicitly optimizing for control and sovereignty while others are optimizing
              for faster time to production.
