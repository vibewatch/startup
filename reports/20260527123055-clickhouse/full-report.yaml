      - number: '1.2'
        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              The founding team combines original technical authorship with enterprise go-to-market and product-scale
              experience. Alexey Milovidov created ClickHouse inside Yandex and remains the technical anchor as CTO.
              Aaron Katz, a former Salesforce and Elastic executive, brought the commercialization playbook and serves
              as CEO. Yury Izrailevsky, whose prior roles included senior engineering leadership at Netflix and Google,
              serves as president and provides the product and engineering-scale bridge between a beloved open-source
              project and a global software company.


              Governance is more investor-shaped than publicly transparent. Index's long-form origin story makes clear
              that Mike Volpi of Index Ventures and Peter Fenton of Benchmark were not passive capital providers; they
              worked with Katz on the spin-out structure that created an independent, majority-controlled Delaware
              company. Separate current-profile sources show both Volpi and Fenton serving on ClickHouse's board, which
              gives the company experienced infrastructure-software oversight even though the broader board and observer
              slate is not fully public. Leadership depth also improved in 2025 when ClickHouse added Kevin Egan as CRO,
              Mariah Nagy as VP People, and Jimmy Sexton as CFO. That trio matters because it signals a transition from
              founder-led formation into late-stage operating discipline across revenue, talent, and finance.
