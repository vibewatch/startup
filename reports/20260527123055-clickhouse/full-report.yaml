      - number: '6.4'
        title: Concentration Risk and Evidence-Quality Assessment
        blocks:
          - type: paragraph
            body: >
              The public record supports two opposite conclusions at once. First, ClickHouse does not look dangerously
              concentrated to any single named customer or industry in the superficial sense: fetched case studies span
              cloud infrastructure, frontier AI, developer tools, fintech, education, digital banking, consumer
              internet, and industrial analytics. That breadth reduces obvious single-vertical concentration. Second,
              the proof base is clearly concentrated by workload family. Observability, telemetry, customer-facing
              analytics, and high-cardinality operational reporting are vastly overrepresented relative to other
              data-platform use cases. If that buyer set softens, if hyperscaler-native alternatives narrow the
              performance gap, or if new entrants commoditize observability backends, public reference density could
              become a false sense of diversification. Evidence quality also varies materially across names. Cloudflare
              is the gold-standard reference because the deployment is corroborated by both ClickHouse and Cloudflare
              engineering surfaces over many years. Contentsquare is also strong because it combines a guest technical
              migration post with an independent architecture roundup. OpenAI, Anthropic, Tesla, Microsoft Clarity,
              Mintlify, Padlet, Buildkite, Ramp, Qonto, Lyft, and Polymarket are strong current vendor-authored case
              studies with named operators and metrics, but still primarily originate from ClickHouse-controlled
              publishing channels. By contrast, eBay, Spotify, Uber, and ByteDance are best treated as medium- to
              low-confidence logo proof until diligence verifies current scope, contract value, and deployment status.
              Discord and Reprise did not surface in the fetched official or public-corroboration set, so they should
              not be counted as production proof without direct customer or contract evidence. The largest remaining
              blind spots are top-customer ARR share, renewal economics, and whether the most visible public logos
              translate into durable commercial concentration or simply marquee marketing references.
