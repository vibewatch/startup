      - number: '7.2'
        title: Competition, substitution, and open-source monetization risk
        blocks:
          - type: paragraph
            body: >-
              The clearest structural risk is that ClickHouse has to win two battles at once. Against Snowflake and
              Databricks, it must prove that an open-source-rooted engine can capture premium cloud analytics budgets
              rather than just serve as a performance adjunct or migration target for specific workloads. Independent
              rankings still show a wide mindshare gap: Snowflake and Databricks sit near the top of the cloud data
              stack while ClickHouse ranks lower despite rising momentum. At the same time, the lower end of the market
              is fragmenting. DuckDB is a credible substitute for local, embedded, and developer-first analytics where
              users can postpone or avoid a hosted service altogether. StarRocks is the sharper direct threat in
              operational analytics because published benchmark material keeps framing ClickHouse as weaker on complex
              multi-table and distributed-join scenarios. The monetization overlay matters even more because Altinity’s
              critique shows how ClickHouse Cloud-only features can improve paid-product differentiation while also
              deepening community distrust, increasing fork maintenance burden, and making the OSS roadmap feel
              subordinate to cloud packaging. That is a viable strategy, but it raises execution risk precisely because
              ClickHouse’s developer community is large enough to notice and react.
