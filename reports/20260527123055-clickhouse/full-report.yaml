  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Path-to-profitability at 2025 valuation
        - Disclosure of ARR, gross margin, burn, or operating leverage
        - No credible unit-economics disclosure emerges by the next major financing or public-market event
        - Treat valuation as narrative-led and demand a larger margin of safety
      - - Snowflake / Databricks displacement
        - Large enterprise wins against incumbent cloud warehouses
        - ClickHouse keeps being adopted only as a sidecar or narrow workload engine instead of a primary platform
        - Haircut terminal share assumptions and cloud expansion expectations
      - - StarRocks and DuckDB substitution
        - Customer workload mix and benchmark chatter
        - Join-heavy workloads shift to StarRocks or embedded analytics stay on DuckDB without cloud upgrade
        - Reduce confidence in broad workload expansion and cloud attach-rate assumptions
      - - Cloud execution quality
        - Public uptime, incident cadence, and security advisories
        - Status reliability weakens further or patch-related issues keep recurring in visible customer environments
        - Increase execution discount and require stronger operational evidence
      - - OSS governance stability
        - Roadmap clarity and community tone
        - Cloud-only differentiation widens while contributor frustration or fork rhetoric accelerates
        - Model higher ecosystem risk and slower community-led adoption
      - - Customer concentration
        - Top-account mix and cohort retention
        - A small set of enterprise accounts drives most ARR or retention deteriorates after trial conversion
        - Lower revenue-quality assumptions and reassess valuation support
    notes: >-
      Each trigger is designed to be monitorable from either management disclosure or direct diligence rather than from
      product narrative alone.
    claimRefs:
      - CR001
      - CR023
      - CR024
      - CR034
      - CR035
      - CR037
      - CR041
      - CR048
  - id: TR006
    title: Adverse signal log
    columns:
      - Signal
      - Evidence
      - Why adverse
      - What offsets it
      - What to monitor next
    rows:
      - - Valuation without public economics
        - The 2025 financing disclosed customer growth but not ARR, margins, or profitability.
        - Execution risk is being capitalized before public unit economics are visible.
        - The company clearly has product momentum and blue-chip customers.
        - Revenue-quality disclosure and cohort economics
      - - Open-core anxiety from ecosystem insiders
        - Altinity says meaningful features are becoming cloud-only and governance needs clearer separation.
        - Community trust can erode even while product demand remains strong.
        - Apache 2.0 core, large community, and many deployment modes still reduce immediate lock-in.
        - Roadmap transparency, contributor sentiment, and any foundation-style governance moves
      - - Independent benchmark caveats on joins and concurrency
        - Exasol reported weaker distributed completeness and 1.39x runtime degradation at higher concurrency.
        - Buyers with the wrong workload mix may not realize the headline benchmark story.
        - ClickHouse still dominates many aggregation-centric and cost/performance narratives.
        - Reference customers for normalized, join-heavy, and high-concurrency use cases
      - - Enterprise-plan gating of compliance
        - HIPAA and PCI are enterprise features and SLAs cover select committed-spend contracts.
        - Monetization may depend on a narrower set of premium accounts than raw user growth implies.
        - Upsell potential is real if those buyers expand.
        - Plan-tier ARR mix and enterprise gross retention
      - - Visible cloud uptime is good but not elite
        - Public status page showed 98.62% aggregate uptime across Feb-May 2026.
        - The cloud product is still carrying service-quality execution risk in public.
        - AWS-specific uptime was reported at 100% and uptime is transparently disclosed.
        - Service-tier incident distribution and customer-level SLO attainment
    notes: >-
      These are not claims of failure; they are the most supportable public signals that could widen into
      thesis-breakers if management execution slips.
    claimRefs:
      - CR009
      - CR020
      - CR025
      - CR034
      - CR038
      - CR041
  - id: TV001
    title: Recommendation summary table
    columns:
      - decision field
      - current view
      - decision implication
    rows:
      - - Recommendation
        - track
        - Stay engaged, but do not treat the May 2025 price as obviously cheap based on public evidence.
      - - Confidence
        - medium
        - Growth and adoption are well supported; ARR quality, retention, and margins are not publicly validated.
      - - Risk rating
        - high
        - Valuation risk is high because the Series C was struck at roughly 35x-42x trailing ARR.
      - - Valuation stance
        - rich but defensible only on a forward view
        - The mark can work if ClickHouse compounds ARR rapidly into the mid-$200M to $300M range.
      - - Underwrite off
        - forward ARR rather than trailing ARR
        - Use milestone-based underwriting instead of relying on the 2025 headline valuation alone.
      - - Upgrade trigger
        - buy only after proof
        - Require disclosure on retention, margins, and cloud conversion before moving from track to buy.
    notes: >-
      This table reflects an investment judgment, not a generic product-quality score. The core debate is how much
      execution is already priced into the Series C mark.
