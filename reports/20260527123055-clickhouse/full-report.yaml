  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold or event
      - thesis transmission
      - action implication
    rows:
      - - Growth proof breaks
        - Management data no longer supports a path to ~$300M ARR within 12-18 months.
        - The current mark loses its forward-ARR justification.
        - Re-underwrite toward public open-source and warehouse multiples.
      - - Retention or margin proof is weak
        - NRR or gross margin disclosure shows materially weaker economics than premium peers.
        - Premium growth quality was overstated.
        - Do not pay up for the 2025 headline; require a lower entry or step aside.
      - - Enterprise feature gap persists
        - Security, governance, or compliance capabilities remain subscale for large regulated workloads.
        - Open-source adoption fails to convert into large durable cloud contracts.
        - Cut the premium and extend product and customer diligence.
      - - Public comps de-rate further
        - Snowflake or MongoDB style multiples fall materially below current 10x-13x levels.
        - Exit math compresses even if ClickHouse executes well operationally.
        - Lower target entry and assume more conservative exit outcomes.
      - - Governance or cap-table surprise
        - Preferences, debt covenants, or other senior claims materially distort common-equivalent value.
        - Headline valuation overstates investable economics.
        - Treat the round as less attractive than the headline suggests until documents are reviewed.
    notes: >-
      These triggers are designed to be monitorable. Each one translates directly into either multiple compression,
      slower ARR growth, or worse exit economics.
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV039
      - CV044
      - CV045
  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner or diligence path
    rows:
      - - ARR quality
        - Cloud versus self-managed mix, customer cohorts, and top-account concentration.
        - Tests whether the open-source funnel is converting efficiently into paid cloud ARR.
        - Request a KPI pack and revenue bridge from management.
      - - Retention and margin
        - NRR, gross margin, contribution margin, and payback by major customer cohort.
        - Determines whether ClickHouse deserves a durable premium over public peers.
        - Request lender-grade operating metrics or audit support.
      - - Cap table and terms
        - Liquidation preferences, participation, and debt covenants tied to the Series C or later financings.
        - Headline valuation may overstate common-equivalent value.
        - Review financing documents and waterfall models.
      - - Enterprise readiness
        - Evidence on security, governance, compliance, and large regulated wins.
        - Required to convert open-source popularity into durable enterprise cloud spend.
        - Run product diligence plus customer reference calls.
      - - Exit path
        - Current IPO versus strategic-sale plan and sensitivity to public comp moves.
        - A venture return depends on the future multiple floor, not the present narrative alone.
        - Ask management and bankers for current exit framing and scenario sensitivity.
    notes: >-
      The missing evidence is concentrated in economics, governance, and exit math rather than in product relevance.
      That is exactly why the recommendation stays at track.
    claimRefs:
      - CV037
      - CV043
      - CV044
      - CV045
