      - number: '5.4'
        title: 信任、路线图与产品风险
        blocks:
          - type: paragraph
            body: >-
              在信任和运营成熟度上，公开表面对基础设施产品而言高于平均，但对硬核企业尽调仍不完整。ClickHouse 公开记录了一组有意义的控制项——SSO、MFA、RBAC、私有连接选项、IP 过滤、CMEK，以及包含
              GDPR、HIPAA、ISO 27001、PCI DSS 和 SOC 2 的合规清单。Azure GA
              公告还补充了围绕网络隔离、流量加密和多可用区复制的具体平台级说法。这些都是有用信号，说明托管服务面向生产敏感工作负载设计，而不只是实验。


              剩余风险不是没有控制项，而是公开深度不均。TrustRadius 反馈仍指向角色粒度和身份提供商限制；更广泛的工作流证据也显示，自助部署可能需要额外的语义或转换层，而 ClickHouse
              并未完全拥有该层。2026 年更新日志显示平台路线图活跃——自动扩缩容调整、支出控制、索引分片预览、AWS/GCP/Azure 区域工作和 BYOC
              扩展——但预览功能还不等于成熟、广泛部署的默认能力。对买家来说，含义很直接：ClickHouse
              看起来在高性能分析工作负载上技术很强，尤其是在云托管时；但企业尽调仍应追问基准测试方法、身份治理深度，以及团队为了安全地民主化访问，必须自建多少周边平台代码。
