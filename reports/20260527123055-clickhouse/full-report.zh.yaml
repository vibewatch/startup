  - id: TM004
    title: 增长驱动因素与采用约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 含义
      - 尽调追问
    rows:
      - - 实时预测、数字化、IoT 和 AI
        - 顺风因素
        - 当前及未来多年
        - 扩大时间敏感型分析工作负载规模，这类负载更偏好列式 OLAP 基础设施
        - 衡量 ClickHouse 新工作负载中，事件分析与传统 BI 各占多少
      - - 云数据仓库现代化
        - 顺风因素
        - 当前
        - 买方想要计算存储分离、实时处理和预测分析，但不想承受数据仓库延迟
        - 追问 ClickHouse 作为替代品进入的频率，以及作为既有数据仓库旁边加速层进入的频率
      - - OpenTelemetry 优先的可观测性
        - 顺风因素
        - 当前，到 2026 年仍会增强
        - 标准化遥测和高基数数据抬高了对高效日志、指标和追踪存储的需求
        - 量化 ClickStack 或其他可观测性部署带来的收入和客户数
      - - AI 驱动的分析与 AI 可观测性
        - 顺风因素
        - 正在兴起，但已近在眼前
        - AI 智能体、分析副驾和模型遥测创造了新的分析存储与检索需求
        - 追问销售管线中有多少比例把 AI 或模型遥测列为主要购买触发因素
      - - 围绕统一可观测性的工具整合
        - 混合顺风因素
        - 当前
        - ClickHouse 作为低成本核心引擎可以受益；但如果买方更愿意留在既有套件里，也可能输掉
        - 索取整合项目对 ClickHouse 有利和不利场景的输赢分析
      - - 集成式既有平台
        - 约束
        - 当前且结构性
        - BigQuery、Datadog、Elastic 和 AWS OpenSearch 把相邻工作流打包在一起，降低买方再加一个平台的意愿
        - 按既有厂商和工作负载拿到胜率，识别 ClickHouse 实际替换打包替代方案的场景
      - - 迁移和运营变更成本
        - 约束
        - 当前
        - 即便 ClickHouse 基准测试更好，团队仍要迁移 schema、查询、数据管道或遥测工作流
        - 按细分市场询问部署时间中位数和专业服务负担
      - - 遥测成本约束与数据价值筛选
        - 约束
        - 当前
        - 部分买方会减少数据量或留存，而不是更换存储引擎
        - 索取留存分层使用模式和降本案例，证明数据价值优化之后 ClickHouse 仍能赢
    notes: 顺风在工作负载增长和成本压力同时出现时最强。既有平台只要能打包足够多的相邻功能，切换就会显得有运营风险，约束随之上升。
