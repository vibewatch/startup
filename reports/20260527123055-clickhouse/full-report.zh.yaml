      - number: '2.4'
        title: 增长驱动、采用约束与时点含义
        blocks:
          - type: paragraph
            body: |-
              当前周期内，ClickHouse 最重要的需求向量有三条。第一是实时分析的结构性上升：
              Grand View Research 把流式分析增长归因于实时预测、数字化，以及大数据、IoT
              和 AI 的更广泛采用。ClickHouse 官方实时分析页面与这一工作负载直接对应，强调
              持续摄取、高查询并发，以及规模化交互式 SQL。第二是云数据仓库现代化。Research
              and Markets 把可扩展的存储 / 计算分离、实时数据处理、预测和运营分析列为云仓库
              主要趋势；这些主题与 ClickHouse Cloud 自身的存算分离和自动扩缩容叙事匹配。
              第三是可观测性数据增长。Grand View、Grafana、IBM 和 Elastic 都指向同一个
              市场方向：云原生复杂度、OpenTelemetry 标准化和 AI 驱动的可观测性工作流，正在
              提高高速、高效遥测存储的价值。

              采用约束同样重要。现有厂商现在卖的是整合体验，而不只是原始存储引擎。BigQuery
              把企业数据仓库、实时分析和 AI 结合在一起。Datadog 和 Elastic 把日志、指标、
              trace 与 AI 辅助调查结合在一起。AWS OpenSearch 把搜索、可观测性、无服务器
              部署和向量工作流结合在一起。这些产品制造了切换成本，因为买家往往比较的是完整
              运营系统、定价模型和治理框架，而不只是基准测试数字。

              成本纪律也有两面。ClickHouse 主打更低基础设施成本、更少副本开销和激进压缩；
              Grafana 和 IBM 则都认为，2026 年可观测性会从“全量采集”转向更高价值的遥测和
              成本管理。也就是说，当买家想要更高效的存储 / 查询引擎时，ClickHouse 受益；但
              如果团队选择减少数据采集量，或留在现有厂商的打包平台里，而不是再引入一层分析
              层，ClickHouse 也可能输掉。就时点而言，近期最强顺风来自 AI 注入的分析、
              OTel 原生可观测性，以及替换较慢的仓库或日志栈；主要约束是迁移工作量、现有平台
              打包能力，以及需要跨多个预算负责人销售，而不是对应一条清晰的软件预算科目。
