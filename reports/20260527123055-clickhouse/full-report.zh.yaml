      - - 依赖超大规模云厂商销售路径
        - AWS、GCP、Azure 市场
        - 云市场扩大分发，但也带来平台、利润率和运营依赖。
        - 云产品页面称 ClickHouse Cloud 已上架三大云市场。
        - 中
        - 核查扣除云市场费用后的净收入，以及按云厂商拆分的集中度
      - - 高端合规收入集中
        - 受监管企业买家
        - HIPAA、PCI，以及可能更深的支持承诺都放在企业版计划里，抬高对大客户的依赖。
        - 合规文档显示，HIPAA 和 PCI 绑定 Enterprise 计划，SLA 绑定承诺消费合同。
        - 中高
        - 索取按计划层级拆分的 ARR 结构、受监管垂直行业敞口，以及企业队列流失历史
      - - 知名客户光环夸大多元化
        - Anthropic、Tesla、Meta、Sony、Instacart 等
        - 知名客户能证明相关性，但也可能遮住狭窄的收入基础。
        - 新闻稿列出大客户，但没有按账户、细分市场或地域披露收入拆分。
        - 中高
        - 索取最大客户占比、前 20 大客户占比，以及 AI 与非 AI 收入结构
    notes: 这张风险清单有意聚焦变现质量，而不是原始客户标识数量或下载速度。
    claimRefs:
      - CR003
      - CR004
      - CR006
      - CR008
      - CR012
      - CR019
      - CR036
      - CR037
      - CR038
  - id: TR005
    title: 缓释措施与否决标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 2025 年估值下的盈利路径
        - ARR、毛利率、烧钱速度或经营杠杆披露
        - 到下一次重大融资或公开市场事件时，仍没有可信的单位经济性披露
        - 将估值视为叙事驱动，并要求更大的安全边际
      - - 替代 Snowflake / Databricks
        - 相对既有云数据仓库的大型企业胜单
        - ClickHouse 持续只作为旁路组件或狭窄工作负载引擎被采用，而不是主平台
        - 下调终局份额假设和云扩张预期
      - - StarRocks 和 DuckDB 替代
        - 客户工作负载结构与基准测试讨论
        - 连接密集型工作负载转向 StarRocks，或嵌入式分析留在 DuckDB，未升级到云端
        - 降低对广泛工作负载扩张和云端附加率假设的信心
      - - 云执行质量
        - 公开可用率、事故频率和安全公告
        - 状态可靠性进一步走弱，或补丁相关问题在可见客户环境中反复出现
        - 提高执行折价，并要求更强的运营证据
      - - OSS 治理稳定性
        - 路线图清晰度和社区语气
        - 云端专属差异扩大，同时贡献者不满或分叉言论加速
        - 纳入更高生态风险和更慢的社区驱动采用
      - - 客户集中度
        - 头部账户结构与队列留存
        - 少数企业账户贡献大部分 ARR，或试用转化后留存恶化
        - 下调收入质量假设，并重新评估估值支撑
    notes: 每个触发项都设计成可通过管理层披露或直接尽调来监控，而不是只靠产品叙事。
    claimRefs:
      - CR001
      - CR023
      - CR024
      - CR034
      - CR035
      - CR037
      - CR041
      - CR048
  - id: TR006
    title: 反向信号日志
    columns:
      - 信号
      - 证据
      - 反向原因
      - 抵消因素
      - 下一步监控
    rows:
      - - 没有公开经济性支撑的估值
        - 2025 年融资披露了客户增长，但没有披露 ARR、利润率或盈利能力。
        - 公开单位经济性尚未可见，执行风险已经被资本化。
        - 公司确实有产品动能和蓝筹客户。
        - 收入质量披露和队列经济性
      - - 生态内部人士对开源核心模式的担忧
        - Altinity 称，重要功能正变成云端专属，治理需要更清晰的隔离。
        - 即使产品需求仍强，社区信任也可能被侵蚀。
        - Apache 2.0 核心、大社区和多种部署模式仍降低了即时锁定效应。
        - 路线图透明度、贡献者情绪，以及任何基金会式治理动作
      - - 独立基准测试对连接和并发的保留意见
        - Exasol 报告分布式完整性较弱，且高并发下运行时间恶化 1.39x。
        - 工作负载结构不匹配的买家，可能无法兑现亮眼基准测试叙事。
        - ClickHouse 仍在许多以聚合为中心和性价比叙事中占优。
        - 规范化、连接密集型和高并发用例的参考客户
      - - 企业版计划锁住合规功能
        - HIPAA 和 PCI 是企业版功能，SLA 覆盖部分承诺消费合同。
        - 变现可能比原始用户增长暗示的更依赖一组更窄的高端账户。
        - 如果这些买家扩张，增购潜力是真实的。
        - 按计划层级拆分的 ARR 结构和企业总留存率
      - - 可见云端可用率不错但并非顶尖
        - 公开状态页显示，2026 年 2–5 月汇总可用率为 98.62%。
        - 云产品在公开层面仍背负服务质量执行风险。
        - AWS 专项可用率报告为 100%，且可用率披露透明。
        - 按服务层级拆分的事故分布和客户级 SLO 达成情况
    notes: 这些不是失败判断，而是目前公开信息中最有支撑的反向信号；如果管理层执行滑坡，它们可能扩大成打破投资逻辑的因素。
    claimRefs:
      - CR009
      - CR020
      - CR025
      - CR034
      - CR038
      - CR041
  - id: TV001
    title: 投资建议摘要表
    columns:
      - 决策字段
      - 当前观点
      - 决策含义
    rows:
      - - 建议
        - 观察
        - 继续跟进，但仅凭公开证据，不应把 2025 年 5 月价格视为明显便宜。
      - - 信心
        - 中
        - 增长和采用有充分支撑；ARR 质量、留存和利润率尚未被公开验证。
      - - 风险评级
        - 高
        - 估值风险高，因为 Series C 大约按过去 ARR 的 35x-42x 定价。
      - - 估值立场
        - 偏贵，但只有按前瞻视角才说得通
        - 如果 ClickHouse 能快速把 ARR 复合增长到 $200M 中段至 $300M 区间，这个估值可以成立。
      - - 承保依据
        - 前瞻 ARR，而非过去 ARR
        - 采用里程碑式承保，不要只依赖 2025 年名义估值。
      - - 上调触发项
        - 证据到位后才买入
        - 从观察上调到买入前，要求披露留存、利润率和云转化。
    notes: 这张表反映的是投资判断，不是通用产品质量评分。核心争论在于：Series C 估值中已经计入了多少执行。
    claimRefs:
      - CV009
      - CV012
      - CV014
      - CV029
      - CV043
      - CV044
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 当前证据
      - 什么会改变观点
    rows:
      - - 开源采用创造低摩擦漏斗
        - Sacra 提到 ~46K GitHub stars、开发者采用强劲，以及 250%+ 云 ARR 增长。
        - 展示从开源到付费云的队列转化，以及大型企业账户内的持续扩张。
      - - AI 和实时分析是真实顺风
        - ClickHouse 赢下需要低延迟分析查询的 AI 原生和可观测性客户。
        - 持久预算归属和可复制的大客户部署证据会增强信心。
      - - 反方：公开可比公司差距很大
        - 按过去口径看，ClickHouse 的倍数高于 Snowflake、MongoDB、SingleStore，甚至高于 Databricks。
        - 只有 ARR 足够快地放大，让当前估值变成前瞻高十几倍或低二十几倍，这个差距才会收窄。
      - - 反方：平台宽度落后于 Databricks
        - Databricks 披露 20,000+ 家组织和 >140% 留存，ClickHouse 尚未公开给出同等数据。
        - 更完整的企业功能集和更充分披露，才足以支撑相对 Databricks 更小的折价。
      - - 反方：披露偏薄
        - ARR 为估计值；在已保留的公开来源中，毛利率、NRR 和融资条款仍未披露。
        - 经审计财务数据或贷款人级别 KPI 披露，会实质性提高承保信心。
    notes: 把投资逻辑放在分发和品类契合上时，它最强；把反向逻辑放在叙事质量与公开披露质量的差距上时，它最强。
    claimRefs:
      - CV010
      - CV011
      - CV019
      - CV020
      - CV029
      - CV034
      - CV037
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值逻辑
      - 价值区间（十亿美元）
      - 概率信号
    rows:
      - - 悲观
        - 增长放缓并接近公开可比公司轨迹，企业功能缺口持续存在，公开数据基础设施倍数进一步走软。
        - 更接近公开开源和数据仓库同业的十几倍出头可比框架。
        - 3.0-4.0
        - 如果 ClickHouse 证明留存和利润率质量之前 ARR 增长就降速，该情景最可能发生。
      - - 基准
        - ClickHouse 将开源需求转化为企业云 ARR，并在 12-18 个月内达到大约 $280M-$320M ARR。
        - 高十几倍至 ~20x 前瞻 ARR 的过桥估值。
        - 5.0-6.5
        - 需要持续超高增长，同时拿出 ARR 质量和企业就绪度的可信证据。
      - - 乐观
        - ARR 很快达到大约 $375M-$430M，AI / 开源溢价守住，企业功能缺口收窄。
        - 突围型基础设施赢家按 20x-22x 前瞻 ARR 定价。
        - 7.5-9.5
        - 需要顶级执行，以及市场对 AI 数据基础设施持续支付溢价的胃口。
    notes: 区间是基于情景的估值桥，不是 DCF 输出。基准情景把 Series C 视为按前瞻承保的价格，而不是按当前规模定价。
    claimRefs:
      - CV010
