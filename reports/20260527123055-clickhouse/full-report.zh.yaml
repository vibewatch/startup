      - 机制
      - 单位 / 定价逻辑
      - 当前公开状态
      - 收入质量视角
      - 尽调问题
    rows:
      - - ClickHouse Cloud 多租户服务
        - 基于共享云基础设施，为分析、AI 和可观测性负载提供托管服务。
        - 按计算加存储用量计费。
        - 明确在售，并定位为商业化核心。
        - 对存在性信心高；对按客户队列划分的实际结构信心低。
        - 索取自助客户与企业客户的云 ARR 拆分。
      - - 专属云 / 隔离部署
        - 面向大型或监管更重客户的更高控制力云环境。
        - 定制企业合同，ACV 可能高于自助模式。
        - 公开有描述，但未公开定价。
        - 对战略重要性信心中等；对实际贡献信心低。
        - 索取专属部署的 ACV 区间和赢单率。
      - - 自带云（BYOC）
        - ClickHouse 在客户环境内管理控制平面。
        - 谈判式企业定价，可能是服务费加支持费经济性。
        - Sacra 公开描述为已上线的部署模式。
        - 对商业化路径信心中等；对体量信心低。
        - 索取 BYOC 客户数和合同 ARR。
      - - 可观测性 / 云上 ClickStack
        - 基于 ClickHouse Cloud 的托管可观测性栈，覆盖日志、链路追踪、指标和回放。
        - 云用量加留存 / 摄取经济性。
        - 已公开营销，并与成本效率主张绑定。
        - 对产品贴合度信心中等；对当前收入占比信心低。
        - 索取可观测性专用客户数、ARR 和留存。
      - - 实时分析工作负载
        - 在 ClickHouse Cloud 上承载面向用户的仪表盘、反欺诈、营销和运营分析。
        - 消费随摄取量、并发和存储增长。
        - 核心营销工作负载类别。
        - 它推动付费用量的信心高，但具体行业结构仍是私有信息。
        - 索取头部垂直行业和按工作负载家族划分的毛利率。
      - - 数据仓库与 BI
        - 面向 BI 和高并发负载的现代数据仓库定位。
        - 按消费计价，并有企业扩张潜力。
        - 核心营销工作负载类别。
        - 对需求面信心高；对纯数据仓库收入结构信心低。
        - 索取数据仓库 ARR、典型数据占用规模和竞争赢单 / 输单明细。
      - - 托管摄取 / ClickPipes 与集成
        - 托管连接器和摄取工具，简化上线与扩张。
        - 可能通过更高云用量、高级功能或附加率变现。
        - 公开可见，但未单独定价。
        - 对其推动扩张信心中等；对直接变现信心低。
        - 索取 ClickPipes 和合作伙伴集成的附加率与增购数据。
    notes: 本表部分列举截至 2026-05-27 公开可见的收入面；已审来源未披露实际收入结构或实际定价。
