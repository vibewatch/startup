  - id: TE003
    title: 技术 / 运行架构表
    columns:
      - 层 / 组件
      - 作用
      - 依赖
      - 风险
    rows:
      - - 查询处理层
        - 解析、规划并运行分析型 SQL，采用向量化执行，可选代码编译
        - 核心引擎内部机制和列块处理模型
        - 性能优势取决于工作负载匹配和 schema 设计，不能只看查询速度说法
      - - MergeTree 存储部件
        - 存储不可变的有序部件，并在后台合并，服务高摄取分析表
        - 主键设计、合并设置、后台资源
        - 主键设计不佳或小部件过多，会侵蚀摄取 / 查询效率
      - - 稀疏主索引和数据颗粒
        - 在支持数据跳读的同时压住索引内存占用
        - 排序键选择和 index_granularity
        - 稀疏读取仍可能拉取额外行，因此剪枝效果受工作负载影响
      - - 共享目录 / 共享数据库引擎
        - 协调无状态云计算与 SharedMergeTree 风格表，不再绑定本地磁盘所有权
        - 中央目录状态和 Keeper 支撑的协调
        - 控制平面或元数据协调现在比本地磁盘耐久性更关键
      - - 云计算池和对象存储支撑的并行副本
        - 靠计算分离和复制后的对象存储访问扩展读写
        - 云编排，加底层对象存储和云厂商原语
        - 云厂商区域成熟度和预览功能会影响功能可用性
      - - 集成层和表引擎
        - 将 ClickHouse 接到消息代理、数据库、湖格式和对象存储
        - 连接器质量，加外部系统 API 和 schema
        - 真实客户体验取决于连接器归属和集成支持层级
    notes: 本架构表结合了稳定的引擎设计与云运行模型细节。它是有证据支撑的产品架构图谱，不是完整源代码或控制平面图。
