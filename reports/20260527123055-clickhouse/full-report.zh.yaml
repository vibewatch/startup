  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围与交付模型
        blocks:
          - type: paragraph
            body: >-
              与其说 ClickHouse 是单一 SKU，不如说它是一组围绕同一分析引擎锚定的产品家族。公开记录支持三个具体交付表面。第一，是开源列式 OLAP 数据库本身。第二，是 ClickHouse
              Cloud；它被明确定位为全托管服务，并可在主要云市场 / 云厂商上使用。第三，是围绕该引擎的托管工作流表面，最显眼的是用于摄取的 ClickPipes，以及 SQL console 和
              clickhousectl 这类云运维表面。也就是说，客户决策重点不在于 ClickHouse 是“数据库还是平台”，而在于他们希望 ClickHouse 帮自己运营技术栈的哪一层。


              从客户工作流看，产品最强的场景，是团队需要高速分析存储加运营便利，而不是开箱即用的完整语义 BI 栈。ClickHouse Cloud
              的卖点是减轻运维：无服务器运维、自动扩缩容、备份、复制和云厂商选择。ClickPipes 降低团队必须维护的定制摄取管道量。Microsoft 连接器和 Azure 集成证据显示，工作流正在延伸到 BI
              和事件管道；模块图也显示，与原始自托管部署相比，云控制平面会实质改变设置、扩缩容和集成工作。主要尽调细节在于，许多周边工作流仍依赖第三方或伙伴工具，而不是单一纵向整合的 ClickHouse 原生应用层。
