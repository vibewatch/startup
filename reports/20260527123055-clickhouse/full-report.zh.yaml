      - number: '2.2'
        title: TAM 下限、相邻市场视角与重叠纪律
        blocks:
          - type: paragraph
            body: |-
              ClickHouse 最干净的保守 TAM 下限，是云数据仓库类别。Mordor Intelligence
              估算该市场 2026 年为 $14.94 billion，Research and Markets 估算为
              $14.53 billion；两者都意味着，在加入任何可观测性或实时分析相邻支出前，
              当前可服务类别已经超过 $10 billion。IndustryARC 对 2026 年的估算更乐观，
              达到 $39.1 billion；这个数字在方向上有用，但应视为高端估计，因为它很可能
              纳入了比 ClickHouse 直接捕获范围更广的 DWaaS 和数据存储工作负载。

              更宽的上限视角来自流式分析。Grand View Research 估算该市场 2023 年为
              $23.4 billion，2030 年达到 $128.4 billion，CAGR 为 28.3%，其中托管部署
              已经贡献收入多数。ClickHouse 受益于同一条实时洞察需求转移，但这不是干净的
              ClickHouse TAM，因为流式分析类别包含数据库层之上的流处理软件、服务和相邻工具。

              可观测性提供第三个市场视角。Grand View Research、MarketsandMarkets 和
              Mordor Intelligence 都把当前可观测性市场放在数十亿美元规模，云部署和大型
              企业领跑采用。这与 ClickHouse 直接相关，因为 ClickStack 把 ClickHouse
              定位为日志、指标、trace 和高基数 OpenTelemetry 数据的存储与查询层。重叠问题
              很大：仓库、实时分析和可观测性预算不能直接相加，因为同一个买家可能用一个平台
              承载多个工作负载。正确结论不是把它们求和，而是指出保守的当前 TAM 下限已经
              超过 $10 billion，并且没有公开来源能干净隔离出更窄的“实时列式 OLAP 数据库”
              细分市场；后者才更接近 ClickHouse 的真实 SAM。
