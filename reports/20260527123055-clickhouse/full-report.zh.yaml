    rows:
      - - ClickHouse
        - 参照平台
        - 2021 年成立的商业公司；2025 年 5 月完成 $350M Series C；2,000+ 客户
        - 工程主导团队，建设面向用户的分析、可观测性和高速数据仓库工作负载
        - 开源核心，自管服务器，并在主要云市场提供托管云
        - 实时分析、可观测性、数据仓库、AI 相邻分析服务
        - 按用量计费的云定价，计算和存储分开；公开定价理念比企业实际净价更清楚
      - - Snowflake
        - 直接既有厂商
        - $9.77B RPO；790 个 Forbes Global 2000 客户；733 个 $1M+ 客户
        - 企业分析、受治理数据共享、跨云 SQL 和 AI 买方
        - 托管多云服务；自研平台，治理控制强
        - SQL 分析、数据共享、受治理的 AI 数据平台
        - 明确的计算、存储和数据传输定价，采用仓库 credit 和按秒计费
      - - Databricks
        - 直接宽平台对手
        - 20,000+ 组织；70% 的 Fortune 500；1,200+ 合作伙伴
        - 企业数据工程、lakehouse、治理和 AI 团队
        - 商业 lakehouse 平台，姿态偏开放格式，而非开源核心
        - 数据工程、lakehouse、治理、分析和 AI 工作流
        - 公开标价和 SKU 组存在，但横向比较不如明确起步价那么简单
      - - BigQuery
        - 超大规模云既有厂商
        - 背靠 Google Cloud 分发和免费层漏斗；母公司为上市公司，并披露投资者报告
        - 以 GCP 为中心的分析、BI 和 AI 团队
        - 托管 Google Cloud 服务；自研但高度无服务器化
        - 无服务器数据仓库、AI 分析和 Google 原生数据应用
        - 计算加存储定价，含免费层和 slot 预留
      - - Redshift / Athena
        - 超大规模云数据仓库替代品
        - 背靠 AWS 分发和有年度报告规模的母公司
        - 标准化使用 S3、SageMaker 和 zero-ETL 路径的 AWS 原生数据团队
        - 托管 AWS 服务，而非开源产品
        - S3 上的数据仓库、lakehouse、即席 SQL 和无服务器分析
        - Redshift 和 Athena 都公布了具体入门价格，降低试点摩擦
      - - DuckDB
        - 嵌入式替代品
        - 开源基金会项目；已审阅来源未显示大型企业现场销售动作
        - 做本地、notebook、应用或嵌入式分析的开发者和分析师
        - MIT 许可的嵌入式数据库，无服务器进程
        - 本地分析、嵌入式分析、单节点分析处理
        - 免费开源软件，而非公开企业 SaaS 价目表
      - - StarRocks
        - 相邻实时挑战者
        - 已审阅公开材料显示其为较小独立厂商；主打企业级分析，但公开规模披露很少
        - 希望在新鲜 lakehouse 或实时数据上跑低延迟 SQL 的团队
        - 带开源色彩的分析数据库，有云业务野心，但公开商业细节有限
        - 实时分析、lakehouse 查询、面向 AI 的 SQL 服务
        - 公开商业定价不如主要超大规模云或 DBaaS 对手透明
      - - Apache Druid / Imply
        - 流式优先替代品
        - Apache 项目加商业 Imply 发行版；Polaris 公开入门和标准层级
        - 流式密集分析、广告技术、遥测和面向客户的实时仪表盘
        - 开源 Druid 核心，Imply 提供商业云和企业封装
        - 流式优先实时分析和高并发查询
        - 开源核心，加上 $100/month 和 $600/month 起的 DBaaS 层级
      - - SingleStore
        - 相邻 HTAP 挑战者
        - 私有分布式 SQL 厂商，有大型企业客户标识，但公开规模指标有限
        - 把事务、分析和应用服务工作负载放在一起的团队
        - 云 DBaaS 加自管部署，覆盖 VM、云主机、Docker 和 Kubernetes
        - 实时应用、HTAP 型工作负载和可用于 RAG 的运营分析
        - 按用量消耗 credit 的定价，另有存储费用和承诺选项
    notes: 规模和融资细节哪里有公开披露，就采用哪里；对于透明度有限的私有厂商，本行使用定性规模和销售路径信号，而不是杜撰收入数字。
