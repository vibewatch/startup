      - number: '1.4'
        title: 里程碑、地缘政治背景与已披露风险
        blocks:
          - type: paragraph
            body: >-
              里程碑记录足够强，可以为报告其余部分建立可复用的事实底座。技术起源始于 2009 年，2012 年进入生产使用，2016 年开源。商业公司在 2021 年通过拆分独立成立，并连续完成 Series A 和
              Series B 融资。下一阶段运营节点出现在 2022 年：ClickHouse 开设 Amsterdam 办公室，推出云产品早期访问，并公开说明俄罗斯入侵 Ukraine 后如何把工程人才迁出
              Russia。这些动作不只是历史脚注；它们构成了治理和客户信任叙事的一部分，也让后来的企业客户增长成为可能。


              因此，关键的反向视角不是典型的需求问题，而是信任与执行问题。ClickHouse 在进入西方企业销售时带着 Yandex 和 Russia 起源认知风险，也积累了公开披露的安全漏洞，包括多个内存安全问题和一个
              2024 年查询缓存访问控制漏洞。公司的缓释叙事可信，但并非没有成本：它把法定住所与 Russia 切开，把工程师迁到 Amsterdam，强调西方投资人和董事，并持续交付产品里程碑，例如收购
              HyperDX、发布 OpenHouse、完成 2025 年 Series C。对尽调来说，核心问题已经不再是 ClickHouse
              是否摆脱了起源叙事，而是治理透明度、安全流程和后期运营控制，是否跟上了商业扩张速度。
