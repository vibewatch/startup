  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代品
        blocks:
          - type: paragraph
            body: |-
              分析 ClickHouse 时，应把它放在分析型数据基础设施里，而不是泛泛的
              数据库类别。ClickHouse 官方材料一直把产品定位为高速、列式 OLAP
              数据库，用于实时分析、可观测性、数据仓库和 ML/GenAI 工作负载。
              这个框架很重要，因为相关支出既不是“所有数据库”，也不是“所有商业
              智能软件”。应纳入的预算池，是团队需要在大型事件、遥测或仓库数据集上
              做高吞吐写入、低延迟 SQL 分析的基础设施层。

              边界内有四个主要支出桶。第一是云数据仓库和 BI 加速，分析工程团队用
              更快的分析存储替换或补足较慢的仓库层。第二是实时产品与事件分析，产品
              或数据平台团队摄取流式事件，并服务仪表盘或面向用户的分析应用。第三是
              可观测性和日志分析，SRE、平台和安全团队存储并查询日志、指标、trace
              和高基数 OpenTelemetry 数据。第四是 AI 相邻分析基础设施，团队需要
              向量感知检索、快速聚合，以及围绕 AI 系统的运营分析。

              市场边界明确排除 OLTP 记录系统、作为独立类别的前端 BI 工具，以及本身
              不能提供低延迟 SQL 服务的通用数据湖存储。现状替代品很强，而且分层明显：
              对许多 Google Cloud 买家来说，BigQuery 是默认的无服务器云数据仓库；
              Datadog、Elastic 和 AWS OpenSearch 把日志、指标、trace、搜索，以及
              越来越多的 AI 或向量工作流打包进各自托管平台；自托管开源基础设施仍是
              偏重控制的团队用来避免托管服务锁定的替代方案。ClickHouse 的优势在于，
              一个核心引擎可以横跨这些用例；但这套边界逻辑只有在本章把它视为重叠的
              分析支出，而不是单一庞大的“数据库市场”时才成立。
