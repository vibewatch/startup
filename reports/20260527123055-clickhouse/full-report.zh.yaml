  - id: FU001
    title: 客户旅程图 —— ClickHouse 如何进入账户并扩张
    type: journey-map
    layout: wide
    summary: |
      最强公开客户案例所呈现的典型买方路径：从发现问题，到生产部署，再到内部扩张。
    data:
      nodes:
        - id: u1
          label: 发现瓶颈
          description: |
            团队在 PostgreSQL、Elasticsearch、Druid、Tempo、PostHog 或自建流式架构里遇到明显痛点：延迟、成本、基数或运维边界卡住。
        - id: u2
          label: 低摩擦评估
          description: |
            买方在本地测试 ClickHouse，或借开源版 / 试用云服务验证，往往不走沉重的企业采购流程。
        - id: u3
          label: 首个生产负载
          description: |
            一个紧急负载先落地——可观测性、仪表盘、报表、预算或分析 API——通常从一个客户能明显感知的痛点切入。
        - id: u4
          label: 自助抽象层
          description: |
            产品或平台团队补上物化视图、语义层、查询路由或受治理的 API，让非数据库专家也能安全用数据。
        - id: u5
          label: 多团队扩张
          description: |
            一旦建立信任，ClickHouse 会扩到相邻产品界面，如计费、反欺诈、发布分析、AI 事故响应或更广的客户报表。
        - id: u6
          label: 耐久性考验
          description: |
            续约质量取决于支持、管理 UX、成本可见性，以及平台是否仍比既有方案或超大规模云厂商替代品更好运维。
