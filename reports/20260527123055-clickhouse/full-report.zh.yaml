            body: >-
              2025 年 5 月这轮融资本身毫无疑问是真实的：ClickHouse 融资 $350 million，引入了广泛的一线投资人联合体，并叠加 $100 million
              信贷额度。公开证据更难证明的是，公司是否已经凭当时规模赚到了中个位数十亿美元估值。ClickHouse 披露增长超过 300%、客户超过 2,000 家；Sacra 估计 2025 年年化收入约 $160
              million，进入 2026 年时云 ARR 增速高于 250%。这些都是很优秀的经营信号。即便如此，隐含尾随倍数仍接近 40 倍；哪怕给予公司更宽的 $150 million 到 $185 million
              ARR 区间，市场要求的承销区间仍落在 30 倍中段到 40 倍低段。也就是说，投资人实质上是在今天为明天的 ARR 付款，而不是为一个成熟、由监管文件支撑的收入基数付款。
            claimRefs:
