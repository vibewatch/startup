      - number: '7.4'
        title: 客户集中度、GTM 质量与监控触发器
        blocks:
          - type: paragraph
            body: >-
              最后一类风险不是 ClickHouse 有没有需求，而是需求能否转化为持久、多元、可盈利的云收入。公开证据清楚支持一个开发者驱动漏斗：免费额度、本地模式、嵌入式选项、OSS
              社区规模和容易上手的试验，都是为了最大化采用率而设计。这是产品分发优势，但如果相对少数企业客户贡献了过高比例的付费云支出，它也可能掩盖较弱的队列经济性。公开材料描述了 2,000
              多家客户，并列出几个门面账户，却没有展示头部客户占比、NRR、毛利率，或云端相对自托管的转化。这个缺口很重要，因为 HIPAA、PCI 和 SLA
              承诺等高端功能似乎主要落在企业买方身上。因此，投资人需要监控的不只是采用速度，还有组合质量：大型账户是否在扩张；随着更多关键工作负载落地，正常运行时间能否守住；仅限云端的功能能否在不疏远 OSS
              基础的情况下完成转化；来自 Snowflake、Databricks、StarRocks 或 DuckDB 的竞争，是否压缩定价，或把 ClickHouse 推向比当前估值假设更窄的用例集合。
