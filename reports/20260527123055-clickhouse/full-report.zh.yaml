      - number: '1.3'
        title: 资本基础、投资人延续性与商业规模
        blocks:
          - type: paragraph
            body: >-
              ClickHouse 的融资历史显示出少见的压缩式风险投资轨迹。2021 年 8 月公司拆分独立时，Index Ventures 和 Benchmark 领投 $50 million Series
              A。仅约两个月后，公司又以 $2 billion 估值完成 $250 million Series B，由 Coatue 和 Altimeter 领投，Benchmark、Lightspeed、Almaz
              及其他成长型投资人参投。2021 年这轮密集融资为云产品建设提供资金，也把 ClickHouse 从一个受推崇的开源项目，推成一家有足够资本全球扩张的公司。


              下一次重大重估发生在 2025 年 5 月。公司和投资人公告确认，ClickHouse 完成 $350 million Series C，由 Khosla Ventures 领投，新投资人
              BOND、IVP、Battery Ventures 和 Bessemer 加入，跟投方包括 Benchmark、Coatue、Lightspeed、FirstMark、GIC 和 Nebius。Goodwin
              与公司公告还确认了一笔由 Stifel 和 Goldman Sachs 牵头的 $100 million 信贷额度。第三方报道把该轮估值放在约 $6.35 billion 至 $6.4
              billion，累计融资超过 $650 million。公开运营信号符合后期成长公司画像：2025 年客户数超过 2,000 家；公司称年增长超过 300%；2025 年中公开收入 / ARR 指标约为年化
              $100 million，2025 年底 ARR 约 $160 million；到 2026 年员工数处于 500 人出头到中段区间。
