      - number: '8.4'
        title: 情景分析：只有 ClickHouse 能迅速从约 40 倍尾随 ARR 降到更低的前瞻倍数，这个估值才成立
        blocks:
          - type: paragraph
            body: >-
              关键估值问题不是 ClickHouse 好不好，而是公司能否以足够快的复合增长，让 $6.35 billion 的入场价事后看起来合理。按同行倍数倒推，所需规模跳升很大。按 Snowflake
              的公开倍数，ClickHouse 需要约 $485 million ARR 或收入。按 MongoDB 的倍数，需要约 $632 million。即便给一个类似 Databricks 的溢价，也仍要求约 $256
              million。因此，基准情景应放在前瞻 ARR 上，而不是尾随 ARR。若 ClickHouse 能把开源漏斗转化为企业云 ARR，并在未来 12 到 18 个月跨过约 $280 million 到 $320
              million，当前估值开始显得可以辩护。若增长停滞、企业就绪度滞后，或公开可比公司进一步降估值，下行会很剧烈，因为当前倍数和公开交易区间之间有太多空气。
