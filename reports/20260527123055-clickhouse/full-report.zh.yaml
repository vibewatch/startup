      - number: '8.3'
        title: 可比公司组：Databricks 是愿景目标，Snowflake 和 MongoDB 是公开市场现实，SingleStore 是更接近的私营下限
        blocks:
          - type: paragraph
            body: >-
              可比公司组把估值张力说得很清楚。Snowflake FY2026 收入为 $4.68 billion，2026 年 5 月下旬交易倍数约为 13 倍收入。MongoDB 是最有用的公开开源基准，交易倍数更接近
              10 倍。Databricks 仍享有约 24.8 倍收入的估值，但它建立在已披露的 $5.4 billion 收入运行率、平台上超过 20,000 家组织，以及高于 140%
              的净留存之上。相比之下，SingleStore 披露 ARR 高于 $123 million，现金流接近盈亏平衡，但其最后一次已知披露估值只有约 $1 billion，按这个简化桥接大约是 8 倍
              ARR。因此，ClickHouse 自己约 40 倍的尾随倍数高于所有具名同行。愿意支付这个溢价的唯一理性理由，是相信开源采用和 AI 时代工作负载增长能让 ClickHouse 快速迈向类似
              Databricks 的前瞻规模，而不是落入类似 Snowflake、MongoDB 或 SingleStore 的定价区间。
            claimRefs:
              - CV015
              - CV017
