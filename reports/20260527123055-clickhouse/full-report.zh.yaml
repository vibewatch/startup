  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与细分组合
        blocks:
          - type: paragraph
            body: >
              ClickHouse 可见客户基础并不是泛 SMB
              意义上的广，而是在少数技术买家群体里很深；这些群体都需要在超大数据集上做低延迟分析。最主要、反复出现的细分是可观测性和遥测：Cloudflare、OpenAI、Anthropic、Tesla、Qonto、Langfuse
              和 Lyft 都用 ClickHouse 存储或查询日志、trace、指标或内部分析事件流，在这些场景中，速度和高基数探索比传统 BI 打磨更重要。第二个主要细分是面向客户的产品和使用分析，可见于
              Microsoft Clarity、Replo、Mintlify、Padlet、Ramp、Buildkite 和 Polymarket；ClickHouse
              位于仪表盘、报表、预算、实验或排行榜产品背后，外部客户会直接触达这些产品。共同买方通常是工程、平台或数据团队；最终用户则是更广的一组分析师、运营人员、财务团队、教师、开发者或 SaaS 客户，他们被有意隔离在原始
              ClickHouse 复杂度之外。这种分层是真优势，因为它集中在 ClickHouse
              性能优势可被直接感知的工作负载上；但也意味着，评估客户集中风险时，应像看客户品牌数一样看工作负载家族：公开证明在可观测性和实时分析上密度高得多，在传统企业仓库用例上则少得多。可获得的公开记录也按证据质量清晰分层。近期案例研究客户提供高置信度生产证明，带具名发言人和量化结果；eBay、Spotify、Uber
              和 ByteDance 这类老牌大客户主要出现在采用者列表或幻灯片引用里，除非尽调拿到更新的部署细节，否则应视为较弱证据。
