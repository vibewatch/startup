      - number: '3.4'
        title: 护城河耐久性、切换成本与竞争风险
        blocks:
          - type: paragraph
            body: >-
              ClickHouse 的护城河真实存在，但有条件。最强的耐久优势，是开源可信度、部署主权，以及围绕速度敏感型分析工作负载建立的产品口碑。这种组合在规模化厂商中并不常见：Snowflake
              更托管、更套件驱动；Databricks
              更宽、更以工作流为中心；超大规模云厂商服务受采购驱动多于社区驱动。但同一结构也限制了硬锁定。买家可以多栖，因为类别按工作负载分割，开放或自托管替代方案仍然可信。Snowflake 和 Databricks
              从上方威胁 ClickHouse，靠的是向受治理数据和 AI 套件扩展。BigQuery、Redshift 和 Athena
              从侧面威胁它，靠的是云账户控制和打包相邻功能。DuckDB、Druid、StarRocks 和 SingleStore 从下方或侧面威胁特定切片，提供嵌入式、流式、lakehouse 或 HTAP
              替代方案。因此，耐久承销问题不是 ClickHouse 技术是否强，而是这项技术优势转化成赢单的速度，能否快过更宽打包产品和更窄替代品对溢价的侵蚀。
