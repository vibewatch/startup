      - - DuckDB 本地 / 嵌入式替代
        - 开发者无需采用托管云服务，就能解决许多探索式和嵌入式分析问题。
        - Exasol 基准测试称，在运营简单性重要的场景，DuckDB 仍有吸引力；DB-Engines 显示 DuckDB 心智仍在上升。
        - 中
        - 中高
