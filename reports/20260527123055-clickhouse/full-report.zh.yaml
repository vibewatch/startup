      - CV040
      - CV045
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 2026 年规模指标
      - 估值 / 倍数
      - 相关性
      - 局限
    rows:
      - - ClickHouse Series C
        - ~$150M-$185M ARR 区间；2,000+ 客户
        - $6.35B；~35x-42x ARR
        - 这正是待回答的承保问题。
        - 收入区间是估计值，并非经审计。
      - - Databricks
        - $5.4B 收入运行率；>65% 增长
        - $134B；~24.8x 收入
        - 最好的高增长私有数据和 AI 平台可比对象。
        - 产品面更宽，客户基础大得多。
      - - Snowflake
        - $4.68B FY2026 收入
        - ~$61.55B 市值；~13.1x 收入
        - 更纯粹的公开云数据仓库可比对象。
        - 成熟上市公司，增长更低，治理约束不同。
      - - MongoDB
        - $2.46B FY2026 收入
        - ~$24.74B 市值；~10.0x 收入
        - 最好的公开开源溢价基准。
        - 工作负载结构不同，在可观测性和分析上的直接重叠较少。
      - - SingleStore
        - '>$123M ARR；现金流接近盈亏平衡'
        - ~$1B 最近已知估值；~8.1x ARR
        - 更接近的实时数据库可比对象，也是有用的私有市场底部参照。
        - 估值时点更旧，流动性也低于实时融资定价。
    notes: 这是本章明确选取的完整可比集合：ClickHouse 自身融资锚、一个规模化私有平台可比对象、两个公开可比对象，以及一个更接近实时数据库的私有可比对象。
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Exhaustive for the explicitly chosen comp basket in this chapter: ClickHouse anchor, Databricks, Snowflake,
        MongoDB, and SingleStore as the full set of named references.
    claimRefs:
      - CV012
      - CV014
      - CV017
      - CV019
      - CV024
      - CV027
      - CV029
  - id: TV005
    title: 投资逻辑失效与否决触发项表
    columns:
      - 触发项
      - 阈值或事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 增长证据失效
        - 管理层数据不再支持 12-18 个月内通向 ~$300M ARR 的路径。
        - 当前估值失去前瞻 ARR 支撑。
        - 按公开开源和数据仓库倍数重新承保。
      - - 留存或利润率证据偏弱
        - NRR 或毛利率披露显示，经济性明显弱于高溢价同业。
        - 高溢价增长质量被高估。
        - 不为 2025 年名义估值溢价买单；要求更低进入价，否则回避。
      - - 企业功能缺口持续存在
        - 面向大型受监管工作负载，安全、治理或合规能力仍未成规模。
        - 开源采用未能转化为大额、持久的云合同。
        - 削减溢价，并延长产品与客户尽调。
      - - 公开可比公司进一步降估值
        - Snowflake 或 MongoDB 式倍数大幅跌破当前 10x-13x 水平。
        - 即使 ClickHouse 运营执行良好，退出测算也会被压缩。
        - 下调目标进入价，并假设更保守的退出结果。
      - - 治理或股权结构意外
        - 优先权、债务契约或其他高级索取权实质扭曲普通股等价价值。
        - 名义估值夸大可投资经济性。
        - 文件审阅前，将本轮视为不如名义估值显示得有吸引力。
    notes: 这些触发项都可监控。每一项都会直接传导为倍数压缩、ARR 增长放慢或退出经济性恶化。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV039
      - CV044
      - CV045
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - ARR 质量
        - 云端与自托管结构、客户队列和头部账户集中度。
        - 检验开源漏斗是否高效转化为付费云 ARR。
        - 向管理层索取 KPI 包和收入桥。
      - - 留存和利润率
        - 按主要客户队列拆分的 NRR、毛利率、贡献利润率和回本周期。
        - 判断 ClickHouse 是否配得上相对公开同业的持久溢价。
        - 索取贷款人级别运营指标或审计支持。
      - - 股权结构表和条款
        - 与 Series C 或后续融资相关的清算优先权、参与权和债务契约。
        - 名义估值可能高估普通股等价价值。
        - 审阅融资文件和瀑布模型。
      - - 企业就绪度
        - 安全、治理、合规以及大型受监管客户胜单证据。
        - 这是把开源热度转化为持久企业云支出的前提。
        - 开展产品尽调和客户访谈。
      - - 退出路径
        - 当前 IPO 与战略出售计划，以及对公开可比公司波动的敏感性。
        - 风险投资回报取决于未来倍数底部，不能只看当前叙事。
        - 向管理层和投行询问当前退出框架和情景敏感性。
    notes: 缺失证据集中在经济性、治理和退出测算，而不是产品相关性。正因如此，建议仍停留在观察。
    claimRefs:
      - CV037
      - CV043
      - CV044
      - CV045
