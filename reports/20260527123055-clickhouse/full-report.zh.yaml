      - number: '6.4'
        title: 集中度风险与证据质量评估
        blocks:
          - type: paragraph
            body: >
              公开记录同时支持两个相反结论。第一，从表层看，ClickHouse 并没有危险地集中在任何单一具名客户或行业：抓取到的案例覆盖云基础设施、前沿
              AI、开发者工具、金融科技、教育、数字银行、消费互联网和工业分析。这种广度降低了显而易见的单一垂直行业集中度。第二，证据基础明显集中在工作负载家族。可观测性、遥测、面向客户的分析和高基数运营报表，相比其他数据平台用例被严重高估。如果这组买方走弱，如果超大规模云厂商原生方案缩小性能差距，或新进入者把可观测性后端商品化，公开参考案例的密度就可能制造虚假的多元化感。不同客户名下的证据质量也差异很大。Cloudflare
              是金标准参考，因为部署在多年里同时得到 ClickHouse 和 Cloudflare 工程渠道佐证。Contentsquare
              也很强，因为它结合了客户署名的技术迁移文章和独立架构汇总。OpenAI、Anthropic、Tesla、Microsoft
              Clarity、Mintlify、Padlet、Buildkite、Ramp、Qonto、Lyft 和 Polymarket 是当前性很强的厂商撰写案例，带有具名操作者和指标，但主要仍出自 ClickHouse
              控制的发布渠道。相比之下，在尽调核实当前范围、合同价值和部署状态前，eBay、Spotify、Uber 和 ByteDance 最好只视为中低置信度的 Logo 证据。Discord 和 Reprise
              没有出现在抓取到的官方或公开佐证集合中；没有直接客户或合同证据时，不应把它们计入生产证据。剩余最大的盲点，是头部客户 ARR 占比、续约经济性，以及最显眼的公开 Logo
              究竟会转化为持久商业集中度，还是只是门面型营销参考。
