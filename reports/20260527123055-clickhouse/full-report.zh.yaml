      - number: '2.3'
        title: 买方、用户、付款方与部署路径分层
        blocks:
          - type: paragraph
            body: |-
              ClickHouse 的买方地图按工作流拆分，而不是按行业口号拆分。第一类买方是数据
              平台或产品分析团队，他们需要为仪表盘、面向用户的应用或运营报表提供实时事件
              分析。这里的用户通常是数据工程师、后端工程师或分析工程师；预算负责人是
              工程副总裁或数据平台负责人；采用触发点，是现有仓库的性能痛点，或
              需要在持续摄取的事件流上服务交互式分析。

              第二类买方是正在现代化仓库和客户分析工作负载的 BI 或分析工程组织。ClickHouse
              官方仓库页面明确把产品定位为实时数据仓库，可用更低成本提升查询速度和并发。
              在这一细分里，付款方往往是集中化的数据平台或 IT 预算，对比集合包括 BigQuery
              和其他托管仓库平台。

              第三类买方是处理日志、指标和 trace 规模的 SRE、可观测性或平台工程团队。
              ClickStack 围绕 OpenTelemetry、亚秒级查询和高基数遥测的定位，直接指向这些
              团队；Datadog、Elastic 和 AWS OpenSearch 的竞品页面也显示，同一买家已经在
              采购统一的托管可观测性平台。对这些买家来说，付款方通常是基础设施、平台或安全
              运营预算，关键触发点是当前日志留存和查询规模下的成本或性能痛点。

              第四类、更早期的细分，是 AI/ML 平台团队，他们需要高速分析存储、向量感知检索，
              以及围绕 AI 系统的可观测性。采用路径通常从自托管概念验证或既有开源使用开始，
              当组织需要自动扩缩容、更简单的升级和更低运维负担时，再转向 ClickHouse Cloud
              或托管 ClickStack。这条云 / 自托管双路径有战略意义，因为有些买家明确在优化
              控制权和主权，另一些则在优化更快投产。
