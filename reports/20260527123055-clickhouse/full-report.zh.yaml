            body: >-
              对一家私有基础设施公司来说，增长证据异常强，但它们以碎片形式出现，而不是经审计财务报表。公司关联的 Series C 材料称，ClickHouse 在此前一年增长超过 300%，截至 2025 年 5 月客户超过
              2,000 家。后续 2025 年延展材料称，ARR 在此前一年多翻了四倍以上；TechCrunch 则在 2026 年 1 月报道，云 ARR 仍同比增长超过 250%。最干净的第三方数字估计来自
              Sacra，其估算 2025 年年化收入约 $160 million，较 2024 年底 $45 million 的退出运行率增长 256%。合在一起，这些数据点支持一个谨慎的公开估计区间：2025 年 ARR
              或年化收入约 $150 million 至 $200 million。这个区间与用户给出的指引一致，也避免假装一家私营公司已经发布经审计收入。销售含义偏正面但不完整。ClickHouse
              似乎正在把开源采用、免费试用转化和 AI 重度账户里的企业扩张叠加复利；但公开来源仍未披露 CAC、回本周期、ACV 分层或净留存。
