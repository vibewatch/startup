        - from: alts
          to: cloud
    approximationNotes: 该图展示商业依赖，不代表法律控制；替代路径既可能导流，也可能削弱云升级漏斗。
    claimRefs:
      - CR006
      - CR017
      - CR018
      - CR022
      - CR030
      - CR036
      - CR038
      - CR039
      - CR045
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 投资建议由一组张力驱动：一边是异常强的开源分发和云增长，另一边是与同行倍数的差距以及披露缺口。
    data:
      nodes:
        - id: oss
          label: 开源漏斗
          detail: ~46K GitHub stars 和广泛开发者采用，支撑漏斗顶部强度。
          tone: positive
        - id: cloud
          label: 云变现证明
          detail: $160M 2025 ARR 估计和 >250% 云 ARR 增长，说明不只是使用量，而是真实转化。
          tone: positive
        - id: price
          label: $6.35B Series C 轮
          detail: 按约 $150M-$185M ARR 框架，该轮隐含约 35x-42x 往绩 ARR。
          tone: warning
        - id: comps
          label: 同行倍数差距
          detail: Snowflake 和 MongoDB 交易倍数更接近 ~10x-13x；Databricks 规模大得多，也约在 ~25x。
          tone: warning
        - id: gaps
          label: 披露缺口
          detail: 公开证据仍缺审计财务、留存、毛利率和股权结构细节。
          tone: warning
        - id: decision
          label: 观察
          detail: 保持跟进，但在付高价前，需要证明 ClickHouse 能长进这个倍数。
          tone: neutral
      edges:
        - from: oss
          to: cloud
        - from: cloud
          to: price
        - from: price
          to: decision
        - from: comps
          to: decision
        - from: gaps
          to: decision
    approximationNotes: 该图表达承销逻辑，不是产品内部流程。
    claimRefs:
      - CV011
      - CV012
      - CV014
      - CV029
      - CV037
      - CV043
  - id: FV002
    title: 估值敏感性——后视倍数快照对比同行
    type: bar
    layout: wide
    summary: 按后视口径，ClickHouse 的 Series C 标记远高于上市公司和开源可比公司，也仍高于 Databricks 更富溢价的私募倍数。
    data:
      items:
        - label: ClickHouse（按 $150M ARR）
          value: 42.3
          detail: $6.35B 除以 $150M ARR。
          tone: negative
        - label: ClickHouse（按 $160M ARR）
          value: 39.7
          detail: $6.35B 除以 Sacra 的 $160M ARR 估计。
          tone: warning
        - label: ClickHouse（按 $185M ARR）
          value: 34.3
          detail: $6.35B 除以指定承销区间上沿。
          tone: warning
        - label: Databricks
          value: 24.8
          detail: $134B 估值除以 $5.4B 收入运行率。
          tone: neutral
        - label: Snowflake
          value: 13.1
          detail: 市值除以 FY2026 收入。
          tone: neutral
        - label: MongoDB
          value: 10
          detail: 市值除以 FY2026 收入。
          tone: neutral
        - label: SingleStore
          value: 8.1
          detail: $1B 最后已知估值除以 >$123M ARR。
          tone: positive
    approximationNotes: 倍数是用公开估值和收入数据简化桥接出的 EV 或市值 / 收入；私营公司企业价值可能不同于头条股权估值。
    claimRefs:
      - CV013
      - CV014
      - CV017
      - CV019
      - CV024
      - CV027
      - CV029
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 当前标记接近基准情景顶部，需要很强的前瞻 ARR 增长，才不至于滑入悲观区间。
    data:
      items:
        - label: 悲观情景
          low: 3000
          mid: 3500
          high: 4000
          detail: 增长放慢到接近上市可比公司的轨迹，估值压缩到十几倍低段。
          tone: negative
        - label: 基准情景
          low: 5000
          mid: 5800
          high: 6500
          detail: ClickHouse 跨过约 $280M-$320M ARR，并维持十几倍高段到约 20x 的前瞻倍数。
          tone: warning
        - label: 乐观情景
          low: 7500
          mid: 8500
          high: 9500
          detail: ARR 冲向约 $400M，AI / 开源溢价保持完整。
          tone: positive
    approximationNotes: 数值以百万美元计，代表基于情景的估值结果，不是贴现现金流估计。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV038
      - CV039
      - CV045
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: ClickHouse 在市场和产品因素上得分很高，但披露质量和当前进入估值明显拖后腿。
    data:
      items:
        - label: 市场顺风
          score: 8
          detail: AI、可观测性和实时分析都支撑品类需求。
          tone: positive
        - label: 产品护城河
          score: 8
          detail: 实时分析性能和架构是真正的产品强项。
          tone: positive
        - label: 开源分发
          score: 8
          detail: 开发者采用足够广，能形成可信的商业漏斗。
          tone: positive
        - label: 云变现证明
          score: 6
          detail: ARR 估计和增长率很亮眼，但仍未经审计。
          tone: neutral
        - label: 可比公司支撑
          score: 4
          detail: 当前后视倍数高于所有点名同行。
          tone: warning
        - label: 企业级成熟度
          score: 5
          detail: 路径可信，但公开企业级证明指标仍不完整。
          tone: warning
        - label: 证据质量
          score: 4
          detail: 关键承销指标在保留的公开来源中仍未披露。
          tone: warning
        - label: 进入估值纪律
          score: 3
          detail: 按头条价格投新钱，应该假设几乎没有犯错空间。
          tone: negative
    approximationNotes: 分数是 0-10 的承销判断，由公开证据综合而来，用于内部投委会讨论。
    claimRefs:
      - CV009
      - CV011
      - CV029
      - CV037
      - CV043
      - CV044
