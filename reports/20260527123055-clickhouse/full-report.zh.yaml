      - number: '5.2'
        title: 引擎、存储与云架构
        blocks:
          - type: paragraph
            body: >-
              核心技术差异化仍来自引擎设计。ClickHouse
              架构材料明确描述了带可选代码编译的向量化执行模型；更底层的架构页面则解释，数据按列块处理，大多数操作分派到数组而非标量值上。这与产品目标一致：它面向宽数据集上的大型分析扫描、聚合、过滤和
              join，而不是逐行交易工作负载。存储层围绕 MergeTree 家族构建，插入会生成不可变 part，并在后台合并。这些 part 按主键排序，索引是稀疏的：它为 granule 记录
              mark，而不是为每一行建索引，因此即便数据集很大，索引也小到足以常驻内存。


              这套架构重要，因为它同时解释了性能上行和运营权衡。稀疏主索引与有序存储改善了裁剪和压缩，但同一文档指出，稀疏读取仍可能每个 block 拉取额外行，因此性能取决于 schema 设计和 key
              选择。在云部署中，ClickHouse 又增加一层差异化：计算与存储分离、对象存储支撑的并行副本、Shared Catalog 协调，以及用于读写工作负载隔离的 compute-compute 分离。Shared
              database engine 文档清楚表明，SharedMergeTree 式无状态计算不只是托管 VM 外面包一层；它是一种不同的运营模型，面向本地磁盘不应持有持久状态的动态计算环境。
