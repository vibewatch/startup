      - number: '6.2'
        title: 具名生产用户与部署模式
        blocks:
          - type: paragraph
            body: >
              最强的生产证据从 Cloudflare 开始：它自 2016 年起就在生产环境使用 ClickHouse，如今 HTTP 和 DNS 分析、日志分析、Workers
              运行时分析、内部分析、客户仪表盘、Firewall Analytics、Radar 和用量计费都靠它支撑。公开披露横跨 Cloudflare 早年自写的工程博客、ClickHouse 主办的 meetup
              报告，以及 2026 年新发布的 ClickHouse 客户故事，几乎连续覆盖近十年的部署历史，这种连续性并不常见。Cloudflare 之外，ClickHouse 目前最强的参考案例多是其官网
              2025-2026 年客户故事：OpenAI 谈到 90 个分片的 PB 级可观测性，以及因流量激增触发的优化工作；Anthropic 描述了用于上线 Claude 4 的定制隔离、类 Cloud
              架构；Tesla 详述了万万亿行级 Comet 指标平台；Microsoft Clarity 说明 ClickHouse 如何在数百万亿事件规模下，把 30
              分钟的热力图生成变成瞬时任务；Contentsquare 则展示了多租户 SaaS 分析从 Elasticsearch 迁移到 ClickHouse 的路径，基础设施成本下降 11 倍，p99 查询提升 10
              倍。同样的模式也出现在 Replo、Mintlify、Padlet、Buildkite、Ramp、Qonto、Lyft、Polymarket 等更新的云原生 SaaS 案例中：团队通常先用 ClickHouse
              解决一个产品界面里的延迟、基数或成本瓶颈，生产环境跑稳后，再扩展到邻近用例。这支撑了账户内先落地、再扩张的可信故事，但也意味着许多参考材料是厂商撰写的案例，而不是客户自己写的工程复盘；因此，结果性主张需要按支持来源的独立性和新鲜度打折。
