      - number: '8.5'
        title: 退出就绪度与尽调要求：缺失指标恰恰是证明溢价所需的指标
        blocks:
          - type: paragraph
            body: >-
              证据缺口不在产品相关性，而在经济性证明。公开来源没有提供 ClickHouse
              经审计财务、净留存、毛利率，也没有说明开源用户转化为付费云队列的质量。留存下来的公开来源同样没有披露清算优先权或股权结构细节，而这些都可能改变 Series C
              头部价格的经济含义。这让这轮融资看起来更像一笔押注品类领导地位的信念交易，而不是一个由投资人级完整披露支撑的价格。因此，本章尽调姿态应继续聚焦那些能够改变建议的指标。要给出买入判断，需要看到经审计或管理层背书的
              ARR 质量、留存、利润率结构和企业转化披露。没有这些，更强的论点是密切观察公司、保持价格纪律，并等业务证明自己能长进这个倍数后再承销，而不是只凭叙事走向这个倍数。
            claimRefs:
              - CV037
              - CV043
              - CV044
