      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              创始团队把原始技术作者身份、企业级商业化经验和产品规模化经验结合在一起。Alexey Milovidov 在 Yandex 内部创造了 ClickHouse，并继续以 CTO 身份扮演技术锚点。Aaron
              Katz 曾任 Salesforce 和 Elastic 高管，带来商业化打法并担任 CEO。Yury Izrailevsky 过往曾在 Netflix 和 Google
              担任高级工程领导，现任总裁，负责把一个受开发者喜爱的开源项目，接到全球软件公司的产品与工程规模化轨道上。


              治理更受投资人塑形，但公开透明度有限。Index 的长篇起源故事清楚显示，Index Ventures 的 Mike Volpi 和 Benchmark 的 Peter Fenton 不是被动出资人；他们与
              Katz 一起设计了拆分独立结构，创立了一家独立、由多数股权控制的 Delaware 公司。其他当前资料显示，Volpi 和 Fenton 都在 ClickHouse
              董事会任职。公司因此获得了经验丰富的基础设施软件监督，尽管更广泛的董事会和观察员名单并未完全公开。2025 年，ClickHouse 又任命 Kevin Egan 为 CRO、Mariah Nagy
              为人力副总裁、Jimmy Sexton 为 CFO，领导层厚度进一步提升。这三人重要，因为他们表明公司正从创始人主导的组建期，转向覆盖收入、人才和财务的后期运营纪律。
