  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 竞争、治理张力和可靠性问题，都会传导到同一组估值支撑变量：增长质量、留存和云毛利。
    data:
      nodes:
        - id: oss
          label: 仅云路线图张力
          detail: 如果 OSS 用户觉得自己被放在次位，社区信任会变弱。
          tone: warning
        - id: fork
          label: 分叉 / 够用的 OSS 路径
          detail: 分叉和自托管部署会稀释云端迁移的紧迫性。
          tone: warning
        - id: trial
          label: 开发者驱动试用量
          detail: 采用速度快于变现证据累积。
          tone: warning
        - id: starrocks
          label: StarRocks 基准测试压力
          detail: 重 join 负载面临更尖锐的替代方案。
          tone: negative
        - id: duckdb
          label: DuckDB 本地替代
          detail: 较小负载不用花云支出，开发者也能解决。
          tone: warning
        - id: uptime
          label: 云可靠性 / 打补丁
          detail: 服务质量影响关键负载的信任。
          tone: negative
        - id: retention
          label: 企业留存质量
          detail: 大客户扩张和稳定性支撑溢价 ARR。
          tone: warning
        - id: margin
          label: 云毛利率
          detail: Marketplace 费用、支持和可用性义务塑造经济性。
          tone: warning
        - id: valuation
          label: 估值支撑
          detail: 2025 年融资标记需要耐久的证据点。
          tone: negative
      edges:
        - from: oss
          to: fork
        - from: fork
          to: trial
        - from: trial
          to: retention
        - from: starrocks
          to: retention
        - from: duckdb
          to: retention
        - from: uptime
          to: retention
        - from: retention
          to: margin
        - from: margin
          to: valuation
    approximationNotes: 边是定性方向，不加权；该图意在展示风险如何通过不同通道传导到估值支撑。
