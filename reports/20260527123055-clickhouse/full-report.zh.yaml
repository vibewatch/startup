            body: >-
              资本可得性看起来很强，但流动性可见度很差。ClickHouse 2021 年 8 月从约 $50 million Series A 资本起步，2021 年 10 月又以 $2 billion 估值完成 $250
              million Series B 扩大资本基础，随后在 2025 年 5 月完成由 Khosla Ventures 领投的 $350 million Series C。2025 年材料还披露，由 Stifel 和
              Goldman Sachs 牵头的 $100 million 信贷额度；2026 年 1 月报道又把一轮新的 $400 million 融资与 $15 billion
              估值联系起来。这些都是强信号，说明投资人仍相信托管云分析可以快速复利。但公开记录仍缺少承销核心：账上现金、月度烧钱速度、基础设施 COGS、毛利率、净留存、客户集中度，以及信贷额度是否已提取或受 covenant
              约束的任何细节。上市数据平台同行继续提交最新年报和风险因素，让外部人士能对标利润率结构和竞争。ClickHouse 没有。因此，融资栈可见，但现金流桥和下行情形保护仍是私有信息。
