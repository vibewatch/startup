      - number: '2.5'
        title: 规模估算缺口、相互矛盾的估计与尽调问题
        blocks:
          - type: paragraph
            body: |-
              最大的分析缺口是类别重叠。云数据仓库、流式分析和可观测性都是观察 ClickHouse
              的有效市场视角，但没有一个能完美代理 ClickHouse 实际变现的更窄层。把这些类别
              相加会夸大 TAM，因为一个平台可以为同一客户服务多个工作负载；只用其中一个类别
              又会低估公司的真实范围。因此，本章保留这些估计作为视角，而不是强行拼出一个
              合成的 SAM 数字。

              第二个缺口是 ClickHouse 自身缺少公开分层。可获得的抓取证据支持强社区规模、
              广泛用例覆盖和跨垂直行业客户采用，但没有披露 ClickHouse 收入中多少来自可观测性
              与仓库工作负载，多少客户选择云而非自托管，或 AWS、GCP 和 Azure 的组合如何随
              地区和买家类型变化。没有这些披露，公开 SOM 估算更多是表演，而不是分析。

              因此，最有用的尽调问题都在公司内部：按工作负载拆分的收入组合、按云厂商和细分
              统计的云服务数量、按部署模型拆分的净留存、按客户队列统计的中位遥测或事件量，
              以及对 BigQuery、Datadog、Elastic 和 AWS OpenSearch 的输赢数据。这些答案
              才能把一个广泛且明显巨大的 TAM 故事，转换成更紧、更可投资的 SAM/SOM 图景。
