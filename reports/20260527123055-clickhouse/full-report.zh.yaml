chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、起源与运营足迹
        blocks:
          - type: paragraph
            body: >-
              理解 ClickHouse，最简单的切入是把它看作两个相连的实体：一个 2009 年始于 Yandex 内部的分析数据库项目，以及一家 2021 年在 Delaware
              注册、面向全球商业化该项目的公司。技术谱系很重要，因为它解释了 ClickHouse 为什么一进入市场就带着少见的性能可信度：在成为一家风险投资支持的创业公司之前，它已经为 Yandex.Metrica
              级别的分析工作负载打磨多年。现在，这家商业公司把产品描述为面向实时分析的高速、开源、列式数据库，变现重心放在 ClickHouse Cloud，以及相邻的实时分析、可观测性和 AI/ML 工作负载上。


              运营足迹同样是混合形态。官方历史把总部放在 San Francisco Bay Area，而当前第三方资料有的标注 San Francisco，有的标注 Portola Valley 或 Palo
              Alto。这些标签在街道地址层面并不一致，但在更大的判断上一致：ClickHouse 是一家 Bay Area 总部公司，在 Amsterdam 有重要办公室，并有意采用分布式团队。官方来源称员工分布在 10
              多个国家，公开资料也支持到 2026 年员工规模超过 500 人。因此，在后续章节里，最稳妥的简称是：Bay Area 总部、Amsterdam 工程与欧洲枢纽、全球分布式运营。
