  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 严重性排序与承销框架
        blocks:
          - type: paragraph
            body: >-
              ClickHouse 的风险画像并不寻常：公司同时拥有明显的产品动能，也还缺少足够扎实的承销记录。公开材料中最强的正面因素真实存在：公司在 2025 年 5 月以 $6.35 billion 估值融资 $350
              million，称同比增长超过 300%，并披露客户超过 2,000 家，覆盖 AI、可观测性、实时分析和数仓工作负载。但估值论证更多由使用动能和品类定位支撑，而不是由已披露的经济性支撑。融资材料没有公布
              ARR、收入、毛利率或盈利能力，因此从开源采用和免费试用转化，到具备公开市场质量的持久盈利，这条路径仍不透明。最重要的风险由此集中在五个主题：开源商品化和治理张力；Snowflake 与 Databricks
              对大型云数据预算的竞争；StarRocks 在重 Join 工作负载、DuckDB
              在本地开发者工作流上形成的新替代压力；云端正常运行时间、安全和补丁执行风险；以及客户质量风险，因为公开材料描述了规模，却没有展示集中度、留存或队列经济性。单看任何一项风险都不致命，但合在一起，它们把融资后的执行门槛抬得很高。
