        blocks:
          - type: paragraph
            body: >-
              ClickHouse 具备数据基础设施投资人想要的许多要素：强大的开源引擎，AI 和可观测性工作负载中的真实客户拉力，以及一个可随工作负载扩大而复合增长的用量计费云产品。问题在价格，不在质量。独立报道把 2025
              年 5 月 Series C 估值放在约 $6.35 billion，而第三方对该业务 ARR 的估计集中在约 $150 million 到 $185 million，Sacra 的中枢估计为 $160
