      - number: '6.3'
        title: 留存代理指标、采购路径与扩张动作
        blocks:
          - type: paragraph
            body: >
              ClickHouse 不公开披露客户 NRR、GRR、Logo 留存、续约率或头部账户扩张队列，因此耐久性只能从较弱的代理指标推断。公开可用的最佳代理指标，是产品评价和客户故事的形态。积极一面，PeerSpot
              用户给 ClickHouse 8.6/10 的评分，并反复提到性能、压缩、可扩展性，以及自托管开源版仍然可用带来的较低厂商锁定。TrustRadius 评论者也把 ClickHouse
              描述为主要的实时数仓，并称赞 MergeTree 性能和数据跳读。消极一面，同一组评论反复抱怨云端 RBAC 粒度、SSO 缺口、文档、UI
              成熟度、部署复杂度和云成本管理。这些问题并不致命，但说明留存依赖技术能力足够强、能消化产品粗糙边缘的客户。公开客户故事也显示出一致的采购和扩张路径。团队往往从一个狭窄但高价值的工作负载切入，证明延迟或成本收益，再扩张到相邻产品界面。开源可试用降低了评估摩擦；当工作负载上升到多团队或企业级重要性后，ClickHouse
              Cloud 的存储与计算分离、自动扩缩容、缩至零和运维卸载又支持继续扩张。这个采购形态有利，但没有续约和扩张率数据，它仍是投资逻辑，不是已验证的客户耐久性指标。
