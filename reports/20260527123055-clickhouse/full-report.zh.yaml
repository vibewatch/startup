        - 如果自管 ClickHouse、fork 或托管替代品能解决足够多用例，云变现可能落后于广泛采用。
        - Altinity 警告仅云端功能和开源核心漂移会改变社区激励；Tinybird 则主打托管 ClickHouse 和另一种开发者体验。
        - 中
