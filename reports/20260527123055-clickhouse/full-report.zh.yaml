      - number: '3.3'
        title: 定价、部署模型与销售能力
        blocks:
          - type: paragraph
            body: >-
              定价和部署模型，是 ClickHouse 与竞争场区分最清楚的地方。它的公开定价叙事强调存储和计算独立扩缩、自动扩缩容，以及 scale-to-zero
              经济性；文档则把自托管和托管消费放在同一个底层引擎上。Snowflake 在计费机制上比 ClickHouse 更明确：计算仓库消耗
              credits，规格公开，平台分离计算、存储和数据传输成本。Databricks 公开但较难做基准测试对比，它发布的是标价和 SKU
              组，而不是一条简单可比的列表费率。BigQuery、Redshift、Athena、Imply 和 SingleStore 都比 ClickHouse
              暴露更清晰的公开起点，这有助于买家建模试点和间歇性工作负载。部署模型也影响信任和监管：Snowflake、BigQuery 和 Athena 主要是托管服务选择；SingleStore
              仍支持自托管部署；DuckDB 则天然是本地的。这种组合会驱动销售结果。超大规模云厂商自有产品可以借助广泛采购杠杆，Databricks 可以依靠大得多的装机基础和伙伴集合。因此，ClickHouse
              最自然的胜场，是技术差异化足以抵消较小外勤销售动作的场景。
