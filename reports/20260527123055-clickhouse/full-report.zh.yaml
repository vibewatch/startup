      - 可衡量收益
      - 限制
    rows:
      - - 摄取流式事件和日志
        - 自建或运维消费者、落地区和重试机制
        - Kafka 引擎或 ClickPipes 托管摄取，将数据导入 ClickHouse Cloud
        - 托管摄取减少自定义 ETL，并可借助缓冲对象存储路径加入重放、exactly-once 式语义
        - 运行表现仍取决于源系统、schema 漂移和连接器成熟度
      - - 建模数据仓库转换
        - 在数据库外运行 SQL 模型和 CI/CD
        - dbt-clickhouse 适配器，支持增量、MV、分布式和测试
        - 让分析工程师围绕 ClickHouse 统一转换和部署流程
        - 对部分分布式和超大型模型模式，适配器仍有限制
      - - 连接 BI 和语义工具
        - 将数据导出或复制到独立 BI 存储
        - 借助 ODBC/Power Query 直连 BI，并接入更广泛的核心 / 合作伙伴 / 社区集成
        - 支持 DirectQuery/导入，让分析更贴近运营数据
        - 部分云服务场景仍需要 ODBC 驱动和网关桥接
      - - 运维面向客户或可观测性分析
        - 在大规模事件流上扩展仪表盘和查询
        - ClickHouse 核心叠加云管理、缓存和扩展能力
        - 独立证据和官方证据都指向大规模下的亚秒级或实时分析工作流
        - 团队可能仍需自定义抽象层，才能支撑广泛自助服务
      - - 普及自助分析
        - 分析师需要平台团队协助，在优化后的 schema 上查询
        - 把 ClickHouse 放在语义层或转换层下面，作为性能核心
        - 保住引擎性能，同时扩大内部对治理后指标的访问
        - 这层抽象通常由生态构建，而不是 ClickHouse 原生掌握
    notes: 本表收益是有来源支撑的工作流结果，不是经审计的 ROI 声称。最后一公里自助服务层往往位于 ClickHouse 原生产品之外。
