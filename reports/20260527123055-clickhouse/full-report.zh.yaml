      - number: '7.3'
        title: 云端执行、安全与法律合规风险
        blocks:
          - type: paragraph
            body: >-
              ClickHouse 在合规和云运维上做了不少实质工作，但公开记录仍支持一份严肃的执行风险清单。积极一面，公司记录了 SOC 2 Type II、ISO 27001、U.S. DPF、HIPAA、PCI、GDPR
              和 CCPA 工作流，这对受监管买方应当重要。但同一批材料也显示，并非所有保护都是普遍可用：部分控制和认证属于企业版功能，SLA
              仅限部分承诺消费合同，正常运行时间仍是一个需要持续观察的实时指标，而不是可以安静假设的事实。公开状态页显示，2026 年 2 月至 5 月的汇总正常运行时间只有
              98.62%。对一家快速增长的基础设施公司而言，这个数字方向上尚可，但还不足以消除云可靠性尽调。安全态势带来第二重张力。ClickHouse Cloud 未受 2025 年标志性 RCE
              影响，这是正面的运营信号；但 OSS 记录中仍有 RCE、查询缓存和崩溃类漏洞，要求客户和分叉维护者持续跟进补丁。对于一家卖进企业可观测性、数据仓库和 AI
              应用的公司，可靠性和补丁纪律是产品价值的一部分，不是后台卫生。
