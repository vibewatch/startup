      - number: '4.4'
        title: 承销视角
        blocks:
          - type: paragraph
            body: >-
              因此，财务结论是：营收动能强，披露质量弱。ClickHouse 有可信证据支持云主导商业模式、免费增值 / 开源漏斗、多工作负载变现，以及作为私有数据平台少见的高速增长。2025 年和 2026
              年融资轨迹也说明，投资人愿意在明显更高估值上继续承销这个故事。但公开数据仍不足以对收入质量做硬承销。自助与企业云之间的收入组合没有披露，毛利率或基础设施成本负担没有披露，净留存没有披露；尽管有股权和信贷组合，流动性桥也没有披露。正确解读不是
              ClickHouse 缺少财务质量，而是外部人目前能更清楚看到增长情景，而非下行情景。任何投资备忘录都应把 2025 年 ARR 或年化收入约 $150 million 至 $200 million
              的估计，以及利润率上行逻辑视为可信但仍需私有资料室证据支撑，之后才值得建立确信。
