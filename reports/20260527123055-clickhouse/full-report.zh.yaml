    data:
      xAxis: 部署灵活性 / 主权性（1 = 托管且锁定在供应商云，10 = 开源或广泛支持自托管）
      yAxis: 商业广度 + GTM 能力（1 = 小众点状方案，10 = 企业分销强的宽平台）
      points:
        - label: ClickHouse
          x: 9
          'y': 7
          detail: 开源，同时支持自主管理和托管云，但 GTM 小于超大规模云厂商。
        - label: Snowflake
          x: 4
          'y': 9
          detail: 托管服务，公开规模强，企业渗透广。
        - label: Databricks
          x: 6
          'y': 9
          detail: 宽湖仓平台，客户和伙伴触达强。
        - label: BigQuery
          x: 3
          'y': 8
          detail: 在 Google Cloud 内捆绑能力很强，离开该生态后主权性有限。
        - label: Redshift / Athena
          x: 3
          'y': 8
