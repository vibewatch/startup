      - - StarRocks 在重 JOIN 场景的势头
        - 基准测试讨论持续把 StarRocks 定位为宽表和多表场景更强，而这些场景对运营分析很关键。
        - StarRocks 赞助的 Habr 基准测试声称 SSB 性能高 2.2x，并称 ClickHouse 未能完成其 TPC-H 测试集。
        - 中高
        - 高
