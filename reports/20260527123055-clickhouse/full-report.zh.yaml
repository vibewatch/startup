    rows:
      - - Snowflake 和 Databricks 的预算引力
        - 它们仍是大型企业预算中的标杆云数据平台，独立心智也强得多。
        - DB-Engines 在 2026 年 5 月将 Snowflake 排第 6、Databricks 排第 7，而 ClickHouse 排第 26；TechCrunch 仍称 ClickHouse 是挑战者。
