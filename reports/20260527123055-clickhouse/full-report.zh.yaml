  - id: TP003
    title: 定价 / 打包对比
    columns:
      - 平台
      - 价格 / 单位 / 合同模式
      - 包含能力
      - 折扣 / 未知项
      - 竞争含义
    rows:
      - - ClickHouse
        - 按用量计费的云定价，计算和存储分开计费，支持自动扩缩和缩容至零
        - 面向实时分析、数据仓库、可观测性和 AI 服务场景的托管云
        - 公开定价思路清楚，但企业实际折扣区间未披露
        - 工程买家若看重突发负载效率，ClickHouse 很有吸引力；CFO 想要一条公开标价时，卖点较弱
      - - Snowflake
        - 计算额度加存储和数据传输费用；仓库按秒计费，最低 60 秒
        - 托管多云分析与 AI 数据平台，提供受治理的数据仓库
        - 净价随版本、云厂商和谈判后的额度经济性变化
        - 计费机制很容易做基准，拿 Snowflake 对标 ClickHouse 建模不难
      - - Databricks
        - 各云厂商的未折扣标价和 SKU 组
        - 覆盖数据工程、治理、分析和 AI 的湖仓平台
        - 公开标价存在，但实际比较取决于 SKU 组合和谈判条款
        - 平台范围广是优势，但标价复杂，难以直接做苹果对苹果比较
      - - BigQuery
        - 无服务器计算加存储计费，提供免费层和槽位预留
        - Google Cloud 内的数据仓库和 AI 平台服务
        - 实际成本取决于扫描量、槽位承诺和周边 Google 服务
        - 试点路径很顺；对以 GCP 为中心的团队，无服务器模式足够简洁
      - - Redshift
        - 预置型起价 $0.543/小时，无服务器起价 $1.50/小时，并有预留折扣
        - AWS 原生数据仓库和湖仓服务
        - 总成本仍取决于数据、并发和 AWS 资产环境
        - 入门价格清楚，加上 AWS 采购杠杆，Redshift 是现实的既有替代方案
      - - Athena
        - 按处理数据量或使用计算量付费，无需管理基础设施
        - 直接在 S3 和其他来源上做临时 SQL 与 Spark 分析
        - 查询模式和数据布局保持克制时才高效
        - 间歇性 AWS 原生分析很适合；作为持久在线、高并发服务层，差异化较弱
      - - DuckDB
        - 免费开源软件
        - 嵌入式本地分析引擎
        - 企业支持和托管控制平面经济性不是产品重点
        - 本地分析的强替代品，但不是云平台的一一替代
      - - StarRocks
        - 已审来源中的公开商业定价有限
        - 实时、湖仓和 AI 分析引擎
        - 客户可能需要直接接触才能确认价格
        - 透明度较低，即使技术定位有吸引力，也拖慢快速采购
      - - Imply Polaris
        - Starter 起价 $100/月，Standard 起价 $600/月，Custom 按询价
        - 基于 Druid 技术脉络的实时分析 DBaaS
        - 高规模或定制环境仍需企业级沟通
        - 对早期测试和较小负载透明度高
      - - SingleStore
        - 按用量额度加存储费用，并有承诺用量定价
        - 面向实时交易加分析的云 DBaaS
        - TCO 取决于负载形态和所选版本
        - 初始建模比 ClickHouse 或 Databricks 更清楚，但优化对象是略有不同的混合负载买家
    notes: 本表比较公开包装和计费机制，而非谈判后的净价或完整工作负载 TCO。
