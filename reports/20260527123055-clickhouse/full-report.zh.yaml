        - 向量感知检索分析、智能体遥测，以及围绕 AI 系统的分析上下文
        - 不带分析存储的核心模型训练或推理支出
        - AI 平台团队 / ML 基础设施或创新预算
        - ClickHouse 首页和相邻竞品页面显示，市场正转向 AI 驱动的分析和可观测性
      - - 自托管分析基础设施
        - 客户在本地硬件、本地机房或 AWS、GCP、Azure 云 VM 上运营的集群
        - 当不需要主权或完整运营控制时使用的托管 SaaS 控制平面
        - 平台工程 / 基础设施预算
        - 部署灵活性是核心差异化，因为 ClickHouse 能服务拒绝纯托管产品的买方
      - - 现状替代方案
        - BigQuery、Datadog、Elastic、AWS OpenSearch，以及内部自管开源栈
        - 不带分析数据平面的纯生产力软件品类
        - 因工作负载和既有栈负责人而异
        - 这些平台是 ClickHouse 最常替换或补足的对象，具体取决于用例
    notes: 这里的边界是分析基础设施工作负载支出，而不是每一美元数据库支出。更适合理解 ClickHouse 为一套可复用引擎，跨数据仓库、事件分析和可观测性工作负载使用。
