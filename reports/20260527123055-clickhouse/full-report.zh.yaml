      - number: '3.2'
        title: 厂商画像、工作负载适配与开源姿态
        blocks:
          - type: paragraph
            body: >-
              当工程主导的买家需要高并发分析服务、大数据集上的快速 SQL，或一个能支持可观测性和实时产品分析、又不强迫采购宽套件的引擎时，ClickHouse 最强。Snowflake 和 Databricks
              是最接近的宽平台竞争者，但原因不同。Snowflake 拥有最成熟的公开规模，并以 AI Data Cloud 叙事强调治理和仓库经济性；Databricks 则拥有更宽的开放格式 lakehouse
              叙事，以及大得多的合作伙伴和客户触达。BigQuery、Redshift 和 Athena 重要，不是因为它们在产品点对点上完全相同，而是因为它们让“足够好”的分析可以在 Google Cloud 或 AWS
              内部采购。DuckDB 和 Druid 是更专门的替代品：DuckDB 适合嵌入式和本地分析，Druid 为流式较重的实时使用而生。StarRocks 和 SingleStore
              位于中间地带，在低延迟分析服务上与 ClickHouse 重叠，同时更偏向 lakehouse 和 HTAP 式定位。开源故事在这里很重要：ClickHouse、DuckDB 和 Druid
              明确保留项目级可信度；Databricks 更强调开放格式，大型现有厂商则强调托管服务。
