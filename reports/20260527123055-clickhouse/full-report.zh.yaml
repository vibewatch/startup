  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与市场边界
        blocks:
          - type: paragraph
            body: >-
              ClickHouse 所处竞争场，比“数据仓库”这个标签暗示的更宽。公司 2021 年围绕一个已经在分析数据库里很有名的开源项目注册成立，如今商业化叙事横跨实时分析、数据仓库、可观测性和 AI
              相关服务工作负载。这种广度拉来了两类直接对手。第一类是 Snowflake 和 Databricks 这类宽分析平台；当买家想要一个受治理的系统，统一承载工程、分析和 AI
              时，它们可以拿下同一笔战略预算。第二类是 BigQuery、Redshift 和 Athena
              这类超大规模云厂商既有服务；它们能解决足够多的同类任务，同时受益于既有云采购关系。替代品集合又不一样：DuckDB、Apache Druid、StarRocks 和 SingleStore
              各自覆盖同一分析问题中更窄的切片，尤其是嵌入式分析、流式优先分析或低延迟服务。因此，实际现状不是一个替代方案，而是更宽套件、打包云服务，以及开源或自托管点解决方案的混合。
