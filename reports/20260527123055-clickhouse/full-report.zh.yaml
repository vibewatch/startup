      - number: '7.2'
        title: 竞争、替代与开源变现风险
        blocks:
          - type: paragraph
            body: >-
              最清晰的结构性风险，是 ClickHouse 必须同时打赢两场仗。面对 Snowflake 和
              Databricks，它必须证明，一个扎根开源的引擎能拿下高端云分析预算，而不只是成为特定工作负载的性能补充或迁移目标。独立排名仍显示心智份额差距很大：Snowflake 和 Databricks
              位居云数据栈前列，ClickHouse 虽然动能上升，排名仍更靠后。与此同时，市场低端正在碎片化。DuckDB 是本地、嵌入式和开发者优先分析场景中的可信替代，用户可以推迟甚至完全绕开托管服务。StarRocks
              在运营分析里是更尖锐的直接威胁，因为已发布的基准材料持续把 ClickHouse 描述为在复杂多表和分布式 Join 场景下更弱。变现叠加层更关键：Altinity 的批评显示，ClickHouse 仅限
              Cloud 的功能可以提升付费产品差异化，但也会加深社区不信任、增加分叉维护负担，并让 OSS 路线图显得从属于云端打包。这是可行策略，但执行风险随之上升，原因恰恰在于 ClickHouse
              的开发者社区大到足以察觉并作出反应。
