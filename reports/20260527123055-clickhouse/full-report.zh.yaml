  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 变现与定价架构
        blocks:
          - type: paragraph
            body: >-
              ClickHouse 的商业故事比财务披露更清楚。纵观云、定价和用例页面，公司把用户从免费 / 开源采用引向 ClickHouse
              Cloud；这是一项托管服务，围绕按用量付费、计算与存储分离扩缩，以及空闲资源自动降配来定位。2022 年的发布节奏有财务意义，因为它显示公司在迭代一种开发者能理解的变现模型：AWS beta 之后，2022 年
              12 月 6 日 GA 版本把试用期延长到 30 天，推出较低支出的 Development Services，并改进计算计量。TechCrunch 和 m3ter
              补充了一个有用的商业细节：管理层有意推进产品驱动动作，提供透明的消费计费，并在 GA 前把 beta 定价从读 / 写单元简化为存储加计算。公开页面还显示，变现不止一个 OLAP SKU。ClickHouse
              现在把平台卖向实时分析、数据仓库、通过 ClickStack 实现的可观测性、AI 原生工作负载，以及通过 ClickPipes
              实现的托管摄取。仍不透明的是实际组合。没有已审阅的公开来源披露多少收入来自自助云、专用企业部署、BYOC，或更新的可观测性和 AI 附加项。
