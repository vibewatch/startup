callouts:
  - calloutType: strength
    title: Cloudflare is a gold-standard lighthouse account
    body: >
      Cloudflare is the most valuable public customer proof in the set because its use of
      ClickHouse is corroborated across ClickHouse-hosted stories, ClickHouse meetup
      reporting, and Cloudflare's own engineering blogs from 2018 through 2026. The
      deployment is not a marketing-logo citation; it is a long-duration, revenue-critical,
      multi-workload implementation that spans analytics, logs, customer dashboards,
      workers, and billing.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010

  - calloutType: insight
    title: ClickHouse repeatedly lands as a painkiller, then expands into a platform
    body: >
      The recurring customer pattern is consistent: teams adopt ClickHouse to fix one acute
      latency or scale problem, then expand it into adjacent analytics or observability
      surfaces once it proves reliable. That is visible in OpenAI, Anthropic, Contentsquare,
      Mintlify, Buildkite, Ramp, Qonto, Lyft, and Polymarket, and it supports a real
      land-and-expand thesis even though the company does not disclose formal expansion
      metrics.
    claimRefs:
      - CU011
      - CU017
      - CU018
      - CU023
      - CU024
      - CU025
      - CU026
      - CU028
      - CU029
      - CU039

  - calloutType: risk
    title: Public logo breadth is real, but commercial durability is still under-evidenced
    body: >
      The most visible blind spots are customer retention, renewal rates, top-customer ARR
      concentration, and the freshness of older marquee logos such as eBay, Spotify, Uber,
      and ByteDance. Discord and Reprise were not corroborated in fetched public sources.
      That does not negate ClickHouse's customer quality, but it means investors should not
      underwrite a concentration or durability conclusion from logo pages alone.
    claimRefs:
      - CU020
      - CU037
      - CU038
      - CU040

