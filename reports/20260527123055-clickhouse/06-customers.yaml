  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Expansion Driver / Risk
      - Type
      - Impact
      - Diligence Path
    rows:
      - - Open-source-to-cloud conversion
        - Expansion driver
        - Lowers initial procurement friction and creates later monetization path into managed cloud or enterprise support
        - Request funnel from OSS evaluator to paid cloud conversion by segment and vintage
      - - Multi-workload expansion inside accounts
        - Expansion driver
        - Customers often start with one analytics workload and then add adjacent observability, billing, release, or AI use cases
        - Request account-level module expansion timelines and net expansion by first workload
      - - Managed-service operational offload
        - Expansion driver
        - ClickHouse Cloud reduces patching, sharding, and capacity-planning burden for small platform teams
        - Request win-rate delta for cloud vs self-managed in enterprise deals
      - - Workload-family concentration
        - Concentration risk
        - Public proof clusters heavily around observability and real-time customer analytics, implying GTM concentration by use case
        - Request ARR mix by observability, product analytics, warehousing, and AI/LLM cohorts
      - - Marquee-logo evidence fragility
        - Concentration risk
        - eBay, Spotify, Uber, and ByteDance remain mostly list-level proof, so perceived logo depth may exceed verified current usage depth
        - Obtain direct customer references, current spend ranges, and recent usage attestations for marquee names
      - - Top-customer revenue opacity
        - Concentration risk
        - No fetched public source discloses top-10 customer revenue share, largest-customer ARR, or renewal concentration
        - Request top-10 ARR concentration, largest logo share, and concentration trend over the last eight quarters
      - - Discord / Reprise proof gap
        - Concentration risk
        - Requested names were not corroborated in fetched official/public sources, creating diligence noise around logo accuracy
        - Ask management for direct reference calls or current contract evidence before counting these logos in the bull case
    notes: >
      Expansion drivers are evidenced by repeated migration and second-workload case studies,
      while concentration risks reflect missing commercial disclosure and uneven evidence depth
      across logo cohorts.
    claimRefs:
      - CU030
      - CU031
      - CU035
      - CU036
      - CU037
      - CU038
      - CU039
      - CU040

