  - id: concentration-risk-and-evidence-quality
    title: Concentration Risk and Evidence-Quality Assessment
    body: >
      The public record supports two opposite conclusions at once. First, ClickHouse does
      not look dangerously concentrated to any single named customer or industry in the
      superficial sense: fetched case studies span cloud infrastructure, frontier AI,
      developer tools, fintech, education, digital banking, consumer internet, and
      industrial analytics. That breadth reduces obvious single-vertical concentration.
      Second, the proof base is clearly concentrated by workload family. Observability,
      telemetry, customer-facing analytics, and high-cardinality operational reporting are
      vastly overrepresented relative to other data-platform use cases. If that buyer set
      softens, if hyperscaler-native alternatives narrow the performance gap, or if new
      entrants commoditize observability backends, public reference density could become a
      false sense of diversification. Evidence quality also varies materially across names.
      Cloudflare is the gold-standard reference because the deployment is corroborated by
      both ClickHouse and Cloudflare engineering surfaces over many years. Contentsquare is
      also strong because it combines a guest technical migration post with an independent
      architecture roundup. OpenAI, Anthropic, Tesla, Microsoft Clarity, Mintlify, Padlet,
      Buildkite, Ramp, Qonto, Lyft, and Polymarket are strong current vendor-authored case
      studies with named operators and metrics, but still primarily originate from
      ClickHouse-controlled publishing channels. By contrast, eBay, Spotify, Uber, and
      ByteDance are best treated as medium- to low-confidence logo proof until diligence
      verifies current scope, contract value, and deployment status. Discord and Reprise
      did not surface in the fetched official or public-corroboration set, so they should
      not be counted as production proof without direct customer or contract evidence.
      The largest remaining blind spots are top-customer ARR share, renewal economics, and
      whether the most visible public logos translate into durable commercial concentration
      or simply marquee marketing references.
    claimRefs:
      - CU004
      - CU014
      - CU020
      - CU035
      - CU036
      - CU037
      - CU038
      - CU040
    tableRefs:
      - TU005


tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / User / Payer
      - Primary Use Case
      - Representative Scale Signal
      - Revenue / Strategic Value
      - Key Gap
    rows:
      - - Observability and telemetry platforms
        - Buyer = platform/SRE/data engineering; users = internal engineers and operators; payer = infra/platform budget owner
        - Logs, traces, metrics, incident analytics, billing analytics
        - Cloudflare quadrillion-row analytics; OpenAI petabyte-per-day logs; Tesla quadrillion-row Comet
        - Anchor workload where ClickHouse's performance edge is clearest and most defensible
        - No public disclosure of ARR mix or renewal rates by observability cohort
      - - Product and customer analytics SaaS
        - Buyer = product/data engineering; users = product teams and end customers; payer = product or analytics budget
        - Embedded dashboards, behavior analytics, experimentation, attribution, reporting
        - Microsoft Clarity millions of projects; Replo 100B+ events; Padlet 40M monthly users; Buildkite 12B tests/month
        - Enables customer-facing analytics SKUs and higher-ARPU enterprise reporting surfaces
        - Public evidence over-indexes to successful migrations and may omit failed pilots
      - - AI and LLM-native software
        - Buyer = platform/ML infrastructure; users = model, infra, and observability teams; payer = core platform budget
        - LLM observability, agent tracing, secure telemetry, model operations
        - Anthropic Claude 4 observability; Langfuse billion-scale agent traces; Mintlify agent-vs-human doc analytics
        - Fastest-growing proof cluster and strong 2025-2026 freshness
        - Unclear whether usage remains departmental or expands into large platform contracts
      - - Fintech and marketplace operations
        - Buyer = engineering/data teams; users = finance ops, marketplace ops, risk teams; payer = product/platform budget
        - Spend analytics, forecasting, budgets, fraud/risk, leaderboard and market stats
        - Ramp 50,000+ customers; Qonto 600,000+ SMBs; Polymarket 100s rps leaderboard API
        - Demonstrates monetizable analytics embedded inside operational products
        - No public contract length, upsell rates, or multi-product penetration data
      - - Developer tools and CI/CD analytics
        - Buyer = engineering platform; users = developers, release managers, QA teams; payer = engineering productivity budget
        - Test analytics, feature analytics, release observability
        - Buildkite 70B records and 25k eps peaks show strong developer-tool analytics fit
        - Good fit for high-cardinality, self-serve internal analytics with land-and-expand potential
        - Spending may be sensitive to developer-tool consolidation cycles
      - - Industrial, education, and enterprise operations
        - Buyer = operations/data leaders; users = business operators, teachers, analysts; payer = line-of-business owner
        - Factory intelligence, classroom engagement analytics, operational BI
        - Contentsquare 13-month retention after migration; Padlet classroom metrics in 242 of 246 countries
        - Shows ClickHouse can reach beyond pure devtools into embedded operational analytics
        - Public stories do not reveal account sizes or renewal depth
    notes: >
      Segments are grouped from public case studies and adopter references rather than a
      disclosed customer roster. Null-like gaps reflect missing public commercial detail,
      not a claim that the segment is immaterial.
