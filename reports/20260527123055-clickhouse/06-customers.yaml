  - id: named-production-deployments
    title: Named Production Users and Deployment Patterns
    body: >
      The strongest production proof starts with Cloudflare, which has used ClickHouse in
      production since 2016 and now relies on it across HTTP and DNS analytics, log
      analytics, Workers runtime analysis, internal analytics, customer dashboards,
      Firewall Analytics, Radar, and usage billing. Public disclosures span old
      Cloudflare-authored engineering blogs, ClickHouse-hosted meetup reports, and a fresh
      2026 ClickHouse customer story, giving unusual continuity across almost a decade of
      deployment history. Beyond Cloudflare, ClickHouse's best current references are
      mostly 2025-2026 customer stories on its own site: OpenAI discusses petabyte-scale
      observability with 90 shards and surge-driven optimization work; Anthropic describes
      a custom air-gapped, Cloud-like architecture used to ship Claude 4; Tesla details a
      quadrillion-row Comet platform for metrics; Microsoft Clarity explains how ClickHouse
      turned 30-minute heatmap generation into an instantaneous task at hundreds-of-
      trillions-of-events scale; and Contentsquare shows the migration pattern from
      Elasticsearch to ClickHouse for multi-tenant SaaS analytics, with 11x lower
      infrastructure cost and 10x p99 query improvement. The same pattern repeats in newer
      cloud-native SaaS stories such as Replo, Mintlify, Padlet, Buildkite, Ramp, Qonto,
      Lyft, and Polymarket: ClickHouse is usually adopted first to remove latency,
      cardinality, or cost bottlenecks in one product surface, then expanded into adjacent
      use cases once teams trust it in production. That creates a credible land-and-expand
      story inside accounts, but it also means many references are vendor-authored case
      studies rather than customer-authored engineering writeups, so outcome claims should
      be weighted by the independence and freshness of the supporting source.
