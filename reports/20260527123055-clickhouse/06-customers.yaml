figures:
  - id: FU001
    title: Customer journey map — how ClickHouse lands and expands inside accounts
    type: journey-map
    layout: wide
    summary: >
      Typical buyer path from problem discovery to production deployment and internal
      expansion across the strongest public customer stories.
    data:
      nodes:
        - id: u1
          label: Bottleneck discovery
          description: >
            Teams hit painful latency, cost, cardinality, or operational limits in
            PostgreSQL, Elasticsearch, Druid, Tempo, PostHog, or custom streaming stacks.
        - id: u2
          label: Low-friction evaluation
          description: >
            Buyers test ClickHouse locally or via open source / trial cloud, often without a
            heavyweight enterprise procurement process.
        - id: u3
          label: First production workload
          description: >
            A single urgent workload lands first—observability, dashboards, reporting,
            budgets, or analytics APIs—usually replacing a visible customer pain point.
        - id: u4
          label: Self-service abstraction layer
          description: >
            Product or platform teams add materialized views, semantic layers, query routers,
            or governed APIs so non-DB experts can safely consume data.
        - id: u5
          label: Multi-team expansion
          description: >
            Once trusted, ClickHouse spreads into adjacent product surfaces such as billing,
            fraud, release analytics, AI incident response, or broader customer reporting.
        - id: u6
          label: Durability test
          description: >
            Renewal quality depends on support, admin UX, cost visibility, and whether the
            platform remains easier to operate than incumbent or hyperscaler alternatives.
    claimRefs:
      - CU003
      - CU021
      - CU022
      - CU023
      - CU024
      - CU025
      - CU030
      - CU031
      - CU039

  - id: FU002
    title: Adoption / deployment flow — from evaluation to expanded account value
    type: flow
    layout: wide
    summary: >
      Common deployment path visible across ClickHouse customer stories, showing how the
      product typically progresses from evaluation to broader organizational adoption.
    data:
      nodes:
        - id: f1
          label: Painful incumbent system
          detail: Postgres, Elasticsearch, Druid, Tempo, PostHog, or warehouse pipelines become too slow, costly, or operationally brittle
        - id: f2
          label: Benchmark or proof of concept
          detail: Teams validate ClickHouse speed quickly using local binaries, a cloud trial, or a narrow migration test
        - id: f3
          label: Initial production cutover
          detail: One customer-facing or operator-facing workload moves first and proves sub-second analytics or improved ingest economics
        - id: f4
          label: Cloud / managed operations decision
          detail: Teams that lack database-operating appetite adopt ClickHouse Cloud for scaling, patching, and shard management simplicity
        - id: f5
          label: Internal platforming
          detail: Governance, materialized views, JSON models, query builders, or row-level controls make broader self-service usage practical
        - id: f6
          label: Expanded account footprint
          detail: ClickHouse spreads into additional analytics, observability, AI, billing, or reporting products, increasing switching costs
      edges:
        - from: f1
          to: f2
        - from: f2
          to: f3
        - from: f3
          to: f4
        - from: f4
          to: f5
        - from: f5
          to: f6
