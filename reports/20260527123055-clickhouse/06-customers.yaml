  - id: TU003
    title: Named customer proof table
    enumerationScope:
      coverage: partial
      basis: >
        Public named deployments fetched from ClickHouse's 2025-2026 user stories, customer
        engineering blogs, and the official adopter list as of 2026-05-27. Coverage is
        intentionally partial because ClickHouse does not publish a complete customer roster,
        and many logos have only list-level proof rather than detailed deployment detail.
    columns:
      - Customer
      - Segment
      - Deployment / Use Case
      - Production vs Pilot
      - Outcome
      - Limitation
    rows:
      - - Cloudflare
        - Cloud infrastructure / observability
        - HTTP & DNS analytics, log analytics, Workers runtime analytics, Radar, billing analytics
        - Production, long-running (since 2016)
        - 96T events/hour and 1.61 quadrillion/day in <2s; 1,000+ active replicas; millions of calls/day for billing jobs
        - Best-in-class evidence, but commercial terms with ClickHouse are undisclosed
      - - Contentsquare
        - Digital experience analytics SaaS
        - Main SaaS analytics migration from Elasticsearch to ClickHouse
        - Production, full migration completed customer-by-customer
        - 11x lower infrastructure cost, 10x p99 improvement, 13-month retention, zero regression during migration
        - Guest post is strong, but still published on ClickHouse's own blog
      - - OpenAI
        - AI / LLM observability
        - Petabyte-scale observability for research, ChatGPT, and enterprise APIs
        - Production
        - Petabytes/day of logs, 90 shards x2 replicas, 50% surge handled with architecture changes and 40% CPU optimization
        - Strong technical proof, but no contract or renewal detail
      - - Anthropic
        - AI / LLM observability
        - Secure, air-gapped observability stack used to support Claude 4 development and monitoring
        - Production
        - Custom Cloud-like deployment inside Anthropic secure environment; named operator says ClickHouse was instrumental to shipping Claude 4
        - Outcome is strategic but less numerically explicit than Cloudflare or Tesla
      - - Tesla
        - Industrial / fleet observability
        - PromQL-compatible Comet platform for massive metrics analytics
        - Production
        - Tens of millions of rows/sec live ingest; 1B rows/sec test for 11 days; >1 quadrillion rows ingested
        - Case study is vendor-authored and does not reveal spend or seat expansion
      - - Microsoft Clarity
        - Product analytics
        - Free analytics, heatmaps, dashboards, and visual reporting
        - Production
        - Millions of projects; hundreds of trillions of events; heatmaps went from ~30 minutes to instantaneous
        - Customer-owned engineering proof is strong, but no ClickHouse commercial packaging detail
      - - Replo
        - Merchant analytics SaaS
        - In-product analytics for Shopify merchants tracking sessions, purchases, A/B tests, and AOV
        - Production
        - 4,000+ merchants, 100B+ events, 3,000-5,000 events/sec, dashboards kept responsive with ~1 minute lag
        - Strong recent proof, but note this is Replo, not the requested Reprise logo
      - - Buildkite / Ramp / Qonto / Lyft / Polymarket cohort
        - Developer tools / fintech / mobility operations
        - Real-time analytics, budgets, CI dashboards, observability, forecasting, and leaderboard APIs
        - Production
        - Each discloses concrete usage or savings metrics, showing repeatable land-and-expand beyond one flagship logo
        - Most evidence remains vendor-authored case studies rather than customer-authored blogs
    notes: >
      This table prioritizes named deployments with usable production detail. eBay, Spotify,
      Uber, and ByteDance remain public adopter references, but not high-detail rows here;
      Discord and Reprise did not surface in fetched corroborating sources and are tracked as
      evidence gaps instead of being treated as verified deployments.
