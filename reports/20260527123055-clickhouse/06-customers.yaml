  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-and-renewal
      missingEvidence: Public NRR, GRR, logo churn, renewal-rate, and cohort-retention disclosures by cloud and enterprise customer segment.
      whyItMatters: Without true retention metrics, it is impossible to distinguish strong technical adoption from durable recurring revenue.
      diligencePath: Request cohort retention tables, renewal rates, and contraction/expansion bridges split by cloud vs self-managed support cohorts.
      relatedQuestionRefs: [QU014]
      relatedTableRefs: [TU004]
    - type: missing-source
      severity: material
      topic: top-customer-concentration
      missingEvidence: Top-10 customer ARR share, largest-customer ARR, and concentration trend over time.
      whyItMatters: Public logo breadth does not answer whether a small number of hyperscale or marquee accounts dominate revenue.
      diligencePath: Obtain customer concentration schedule from management and tie each large account to current contract term, renewal date, and primary workload.
      relatedQuestionRefs: [QU021]
      relatedTableRefs: [TU005]
    - type: missing-source
      severity: material
      topic: legacy-marquee-proof
      missingEvidence: Fresh primary proof for eBay, Spotify, Uber, and ByteDance including current deployment scope, spend, and production status.
      whyItMatters: These logos shape perception of customer quality, but accessible fetched proof is materially weaker than current flagship case studies.
      diligencePath: Ask for direct customer references, recent conference talks, or contract-backed evidence before using these names in an investment memo.
      relatedQuestionRefs: [QU011, QU012, QU024]
      relatedTableRefs: [TU003, TU006]
    - type: missing-source
      severity: minor
      topic: discord-reprise-corroboration
      missingEvidence: Direct public customer proof that Discord or Reprise currently run ClickHouse in production.
      whyItMatters: Requested logo verification failed in the fetched source set, so counting them as proof would overstate customer evidence quality.
      diligencePath: Treat both as unverified until management provides direct reference calls, contracts, or customer-authored deployment material.
      relatedQuestionRefs: [QU013]
      relatedTableRefs: [TU005]

