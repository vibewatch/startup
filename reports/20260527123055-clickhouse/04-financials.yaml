- id: capital-adequacy-and-opaque-cost-structure
  title: Capital adequacy and opaque cost structure
  body: 'Capital access looks strong, but liquidity visibility is poor. ClickHouse started with roughly $50 million of Series A capital in August 2021, expanded that base with a $250 million Series B at a $2 billion valuation in October 2021, and then raised a $350 million Series C in May 2025 led by Khosla Ventures. The 2025 materials also disclosed a $100 million credit facility led by Stifel and Goldman Sachs, and January 2026 reporting tied a new $400 million round to a $15 billion valuation. Those are powerful signals that investors still believe managed cloud analytics can compound quickly. But the public record still omits the underwriting essentials: cash on hand, monthly burn, infrastructure COGS, gross margin, net retention, customer concentration, and any detail on whether the credit line is drawn or covenant constrained. Public company data-platform peers continue to file current annual reports and risk factors that let outsiders benchmark margin structure and competition. ClickHouse
    does not. As a result, the financing stack is visible, while the cash-flow bridge and downside protection remain private.'
