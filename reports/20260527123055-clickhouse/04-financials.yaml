  - Why it matters
  - Diligence ask
  rows:
  - - 2025 annualized revenue / ARR
    - $150M-$200M public estimate range (midpoint ~$160M)
    - Medium
    - Anchors valuation and scale discussion without pretending audited revenue exists.
    - Request monthly recurring revenue bridge and audited FY2025 revenue.
  - - 2024 exit annualized revenue
    - $45M (Sacra estimate)
    - Medium
    - Provides the base for evaluating the 2025 growth claim.
    - Request monthly revenue history for 2024 and 2025.
  - - Cloud ARR growth into 2026
    - '>250% YoY'
    - Medium
    - Signals strong cloud expansion and supports the capital-raising narrative.
    - Request cloud ARR by quarter and by deployment mode.
  - - Reported company growth before Series C
    - '>300% during prior year'
    - Medium
    - Important momentum claim, but company-linked rather than audited.
    - Request definition of growth metric and reconciliation to GAAP revenue.
  - - Customer count
    - '>2,000 customers by 2025'
    - Medium
    - Useful breadth signal, though customer count says little about concentration.
    - Request ARR concentration and ACV distribution by customer cohort.
  - - Gross-margin proxy
    - Compute-storage separation and autoscaling may support attractive incremental margins
    - Medium
    - Explains why investors may underwrite the model despite limited public financial disclosure.
    - Request actual cloud gross margin, infra COGS, and support cost burden.
  - - Sales-efficiency proxy
    - PLG free trial, 100+ early cloud customers, open-source community funnel
    - Low-Medium
    - Suggests efficient acquisition, but does not replace CAC or payback.
    - Request CAC, sales ramp, and payback by self-serve versus enterprise.
  - - Net retention / churn
    - Not publicly disclosed
    - Low
    - Critical for judging revenue quality and durability.
    - Request NRR, GRR, logo churn, and expansion contribution by cohort.
  notes: Mixes disclosed facts with explicit estimates and qualitative proxies; no reviewed public source provides audited ClickHouse unit-economics tables.
