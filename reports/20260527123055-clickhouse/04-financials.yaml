tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit / pricing logic
  - Current public status
  - Revenue quality view
  - Diligence ask
  rows:
  - - ClickHouse Cloud multi-tenant service
    - Managed service for analytics, AI, and observability workloads on shared cloud infrastructure.
    - Usage-based billing on compute plus storage.
    - Clearly active and positioned as the monetization core.
    - High confidence on existence; low confidence on actual mix by customer cohort.
    - Request cloud ARR split by self-serve versus enterprise customers.
  - - Dedicated cloud / isolated deployments
    - Higher-control cloud environments for larger or more regulated accounts.
    - Custom enterprise contract, likely higher ACV than self-serve.
    - Publicly described but not publicly priced.
    - Medium confidence on strategic importance; low on actual contribution.
    - Request ACV bands and win rates for dedicated deployments.
  - - Bring Your Own Cloud (BYOC)
    - ClickHouse manages the control plane inside customer environments.
    - Negotiated enterprise pricing, likely service plus support economics.
    - Publicly described by Sacra as a live deployment mode.
    - Medium confidence on monetization path; low confidence on volume.
    - Request number of BYOC customers and contracted ARR.
  - - Observability / ClickStack on Cloud
    - Managed observability stack on ClickHouse Cloud for logs, traces, metrics, and replays.
    - Cloud usage plus retention/ingestion economics.
    - Publicly marketed and tied to cost-efficiency claims.
    - Medium confidence on product relevance; low confidence on current revenue share.
    - Request observability-specific customers, ARR, and retention.
  - - Real-time analytics workloads
    - User-facing dashboards, fraud, marketing, and operational analytics on ClickHouse Cloud.
    - Consumption grows with ingest, concurrency, and storage.
    - Core marketed workload category.
    - High confidence it drives paid usage, but specific sector mix is private.
    - Request top verticals and gross margin by workload family.
  - - Data warehousing and BI
    - Modern data warehouse positioning for BI and concurrency-heavy workloads.
    - Consumption pricing with enterprise expansion potential.
    - Core marketed workload category.
    - High confidence on demand surface; low confidence on warehouse-only revenue mix.
    - Request warehousing ARR, typical data footprint, and competitive win-loss detail.
  - - Managed ingestion / ClickPipes and integrations
    - Managed connectors and ingestion tooling that simplify onboarding and expansion.
    - Likely monetized through higher cloud usage, premium features, or attach rates.
    - Publicly visible but not separately priced.
    - Medium confidence that it helps expansion; low confidence on direct monetization.
    - Request attach-rate and upsell data for ClickPipes and partner integrations.
  notes: Partial enumeration of publicly visible revenue surfaces as of 2026-05-27; reviewed sources do not disclose actual revenue mix or realized pricing.
  enumerationScope:
    coverage: partial
    basis: Covers the revenue surfaces explicitly marketed in official ClickHouse cloud and use-case pages plus third-party summaries reviewed for this chapter as of the 2026-05-27 run date; private product-level revenue contribution remains undisclosed.
