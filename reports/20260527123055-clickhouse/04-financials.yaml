- id: growth-signals-and-public-estimate-range
  title: Growth signals and public estimate range
  body: Growth evidence is unusually strong for a private infrastructure company, but it arrives in fragments rather than audited financial statements. Company-linked Series C materials said ClickHouse had grown more than 300% during the prior year and topped 2,000 customers by May 2025. Later 2025 extension materials said ARR had more than quadrupled over the preceding year, while TechCrunch reported in January 2026 that cloud ARR was still growing more than 250% year over year. The cleanest third-party numeric estimate comes from Sacra, which put 2025 annualized revenue at about $160 million, up 256% from a $45 million exit rate at the end of 2024. Taken together, those data points support a cautious public estimate band of roughly $150 million to $200 million for 2025 ARR or annualized revenue, which is consistent with the user's guidance and still avoids pretending that a private company has published audited revenue. The GTM implication is favorable but incomplete. ClickHouse appears
    to be compounding open-source adoption, free-trial conversion, and enterprise expansion across AI-heavy accounts, yet public sources still do not disclose CAC, payback, ACV segmentation, or net retention.
