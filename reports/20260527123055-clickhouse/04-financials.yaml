  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, trial-to-paid conversion, sales ramp, and ACV segmentation by self-serve versus enterprise.
    whyItMatters: PLG evidence is directionally positive, but without CAC and payback it is impossible to judge whether growth is capital efficient or merely fast.
    diligencePath: Request cohort conversion funnels, pipeline-to-close metrics, quota attainment, and blended CAC/payback by channel.
    relatedQuestionRefs:
    - QI015
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, infrastructure COGS, NRR, GRR, churn, and contribution margin by deployment mode.
    whyItMatters: The growth story can look excellent while margins disappoint; this gap blocks conviction on revenue quality and operating leverage.
    diligencePath: Request audited income statement detail, cloud gross margin bridge, retention cohorts, and customer expansion analysis.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: Current cash balance, monthly burn, forecast cash flow, and runway assumptions after the 2025/2026 financing events.
    whyItMatters: Public fundraising headlines do not prove liquidity duration; without a cash bridge, investors cannot judge financing dependency or downside resilience.
    diligencePath: Request latest balance sheet, cash flow statement, 12-18 month operating plan, and base/downside runway model.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: debt-terms
    missingEvidence: Credit agreement, drawn balance, interest grid, covenants, collateral package, and maturity schedule for the $100M facility.
    whyItMatters: Debt can improve flexibility or quietly add covenant risk; the public record confirms the facility exists but does not describe its downside constraints.
    diligencePath: Request lender deck, executed facility terms, current draw status, and covenant compliance reporting.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized price per compute unit, storage TB, enterprise discounts, minimum commits, and renewal uplift by customer segment.
    whyItMatters: List-pricing philosophy and free-trial mechanics do not reveal how much monetization ClickHouse actually captures once large accounts negotiate.
    diligencePath: Request sample contracts, rate cards, renewal cohorts, and margin by pricing plan or deployment mode.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI002
