callouts:
- calloutType: strength
  title: Growth and fundraising evidence are unusually strong for a private data-infrastructure company
  body: The combination of a $350M Series C, a later extension, a reported $15B 2026 valuation, >250% cloud ARR growth, and a public estimate near $160M of 2025 annualized revenue makes ClickHouse look materially stronger than a typical infrastructure startup still proving monetization.
  claimRefs:
  - CI003
  - CI006
  - CI010
  - CI011
  - CI013
- calloutType: risk
  title: Public disclosure is still too thin for true downside underwriting
  body: Investors can see the growth case clearly, but not the downside bridge. Realized pricing, gross margin, NRR, burn, runway, and debt terms remain private, while competition and open-source substitution keep pressure on cloud economics.
  claimRefs:
  - CI024
  - CI025
  - CI026
  - CI027
  - CI037
  - CI038
- calloutType: recommendation
  title: Treat the 2025 ARR range as a credible estimate, not a closed fact
  body: The $150M-$200M 2025 ARR or annualized revenue range is well supported by public breadcrumbs, but it still rests on third-party estimation and company-linked growth claims rather than audited statements or a disclosed margin bridge.
  claimRefs:
  - CI011
  - CI012
  - CI042
