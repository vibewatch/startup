- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Current public state
  - Exact diligence path
  rows:
  - - Revenue mix by product / deployment mode
    - Needed to judge revenue quality and the share coming from durable enterprise cloud.
    - Not disclosed.
    - Request cloud ARR split by self-serve, dedicated, BYOC, observability, and support.
  - - Realized pricing and discounting
    - Needed to distinguish list philosophy from actual monetization.
    - Not disclosed.
    - Request customer contracts, discount schedules, and renewal pricing cohorts.
  - - Gross margin and infra COGS
    - Needed to test whether compute-storage separation truly yields attractive cloud unit economics.
    - Not disclosed.
    - Request gross margin bridge, hosting spend, support costs, and contribution margin by deployment type.
  - - NRR, GRR, and churn
    - Needed to test durability of cloud expansion and multi-workload consolidation.
    - Not disclosed.
    - Request retention by cohort, downgrades, and expansion contribution.
  - - Cash, burn, and runway
    - Needed to judge financing dependency and downside protection.
    - Not disclosed.
    - Request balance sheet, cash flow statement, monthly burn, and base / downside runway.
  - - Debt terms and facility draw
    - Needed to test covenant risk and incremental leverage.
    - Facility exists but terms are not disclosed.
    - Request credit agreement, drawn balance, pricing grid, collateral, and covenant headroom.
  - - Customer concentration / top account exposure
    - Needed to assess whether AI-led wins are diversified or concentrated.
    - Not disclosed.
    - Request top-10 customer ARR share, cohort gross margin, and renewal schedule.
  notes: These are the main blockers preventing a public-only underwriting case even though the growth and fundraising signals are unusually strong.
