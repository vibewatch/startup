- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public value
  - Date
  - Why it matters now
  - Residual gap
  rows:
  - - Earlier funding base
    - Roughly $50M Series A
    - Aug-2021
    - Shows the company entered Series B from a relatively modest capital base.
    - No public burn bridge from Series A to Series B.
  - - Series B
    - $250M at $2B valuation
    - Oct-2021
    - Established the company as a well-funded independent commercial entity.
    - No public use-of-proceeds tracking versus actual spend.
  - - Series C
    - $350M led by Khosla Ventures
    - May-2025
    - Major recapitalization behind AI-era scale claims and product expansion.
    - No public cash balance or runway disclosure after the raise.
  - - Credit facility
    - $100M led by Stifel and Goldman Sachs
    - May-2025
    - Adds non-equity liquidity capacity.
    - Drawn amount, covenants, interest, and maturity are not public.
  - - Series C extension
    - Additional capital from Citi Ventures, Insight Partners, Peak XV and others
    - Oct-2025
    - Signals continued financing access after the initial Series C.
    - Exact extension size is not disclosed in reviewed sources.
  - - Latest valuation signal
    - $15B valuation on a reported $400M Jan-2026 round
    - Jan-2026
    - Confirms strong investor appetite and balance-sheet optionality.
    - Still does not disclose current cash, burn, or dilution structure.
  - - Current liquidity
    - Not publicly disclosed
    - As of 2026-05-27
    - This is the core blocker to true runway underwriting.
    - Need cash, forecast burn, and covenant headroom from management.
