- id: TI002
  title: Pricing / monetization table
  columns:
  - Surface
  - Public pricing signal
  - What is actually disclosed
  - Financial implication
  - Exact diligence ask
  rows:
  - - Open-source core
    - Free
    - The core database remains open source and free to use.
    - Creates adoption leverage but no separately disclosed license line.
    - Request paid-conversion funnel from community to cloud.
  - - Cloud trial / freemium entry
    - 30-day trial and $300 credits
    - Official cloud pages still offer free trial credits to start usage.
    - Supports low-friction PLG acquisition, but trial-to-paid conversion is undisclosed.
    - Request trial conversion rates by segment and cohort.
  - - Standard cloud consumption
    - Usage-based compute + storage
    - Official pages say compute and storage scale separately and customers pay only for what they use.
    - Good fit for bursty workloads; realized street pricing remains opaque.
    - Request realized price per compute unit and storage TB after discounts.
  - - Development Services
    - Low-monthly-spend entry tier
    - 2022 GA notes introduced a starter-oriented Development Services offer.
    - Improves developer onboarding, but gross profit and upsell yield are undisclosed.
    - Request current package limits, unit economics, and upgrade conversion.
  - - Dedicated / BYOC enterprise
    - Negotiated
    - Public sources say enterprise customers can choose dedicated clusters or BYOC.
    - Likely improves ACV and retention, but none of the reviewed sources disclose contract structure.
    - Request average enterprise ACV, term length, and margin delta versus self-serve.
  - - Integrations / ClickPipes / observability add-ons
    - Not list-priced in reviewed sources
    - Public pages market integrations, observability, and managed ingestion, but do not break out pricing.
    - Could raise wallet share and retention without appearing as a separate revenue line.
    - Request attach rates, packaging rules, and cross-sell revenue contribution.
  notes: Public evidence confirms usage-based and free-trial-led pricing mechanics, but not realized pricing, discounting, or blended customer economics.
