      Databricks after enterprise negotiation.
    whyItMatters: >-
      Public list mechanics do not reveal whether ClickHouse wins or loses once large buyers negotiate multi-year volume
      deals.
    diligencePath: Request anonymized win-loss pricing sheets or procurement examples by workload tier and annual spend band.
    relatedQuestionRefs:
      - QP022
    relatedTableRefs:
