evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-coverage
    missingEvidence: >-
      A fully exhaustive public chronology covering every product launch, funding-side letter, and office move is not
      available from retained sources.
    whyItMatters: >-
      The milestone table is strong enough for chapter grounding, but a refresh or diligence data room could still
      surface omitted sub-events or precise closing dates.
    diligencePath: >-
      Request the internal company timeline, financing close checklist, and board-approved milestone history used for
      investor communications.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Audited revenue, gross margin, NRR, and cloud versus self-managed revenue mix are not public; ARR is estimated
      from third-party analysis.
    whyItMatters: >-
      The report can support a late-stage growth narrative, but not a profitability or quality-of-revenue judgment,
      without management financials.
    diligencePath: Request audited 2024-2025 financial statements, cloud consumption cohort data, and board-level KPI packs.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: cap-table-and-rights
    missingEvidence: >-
      Exact post-Series C ownership, board observer rights, debt covenant terms, Nebius warrant details, and any
      unpublicized side-letter investors remain undisclosed.
    whyItMatters: >-
      Control rights, liquidation overhang, and any hidden investor participation can materially change governance and
      valuation interpretation.
    diligencePath: >-
      Request the cap table, financing documents, debt agreement, and board materials summarizing investor rights and
      residual Yandex-era instruments.
    relatedQuestionRefs:
      - QO012
      - QO020
      - QO027
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: hq-labeling
    missingEvidence: >-
      A single up-to-date legal and operational office register reconciling San Francisco, Portola Valley, Palo Alto,
      and Amsterdam labels is not publicly assembled in one place.
    whyItMatters: >-
      The discrepancy is not investment-thesis critical, but it matters for diligence mailings, employment law, and
      office-footprint verification.
    diligencePath: Request the current legal-entity register, office lease schedule, and employee-location summary from management.
    relatedQuestionRefs:
      - QO005
      - QO026
    relatedTableRefs:
      - TO001
      - TO002
  - type: missing-source
    topic: ClickHouse-specific SAM or SOM
    severity: material
    missingEvidence: >-
      No fetched public source isolates the narrower market for real-time columnar OLAP databases or provides a
      ClickHouse-specific SAM or SOM. The available market data is split across cloud data warehousing, streaming
      analytics, and observability categories.
    whyItMatters: >-
      Without a narrower category definition, TAM is easy to overstate and SOM is impossible to ground in public
      evidence. This is the main reason the chapter preserves multiple sizing lenses instead of collapsing them into one
      synthetic number.
    diligencePath: >-
      Ask management for segment-level ARR by workload and for any third-party market studies that isolate real-time
      analytical database infrastructure from broader warehouse or observability budgets.
    relatedQuestionRefs:
      - QM020
  - type: private-evidence-only
    topic: Workload mix and deployment mix
    severity: material
    missingEvidence: >-
      Public sources do not disclose ClickHouse revenue mix by warehouse versus observability workload, customer
      distribution across cloud providers, or the share of cloud versus self-managed deployments.
    whyItMatters: >-
      These variables determine the practical SAM, the intensity of competition by segment, and whether the company's
      strongest go-to-market motion is cloud, self-managed, or mixed.
    diligencePath: >-
      Request internal cohort data covering revenue by workload, cloud-provider mix, self-managed versus cloud service
      count, net retention by segment, and win-loss rates against BigQuery, Datadog, Elastic, and AWS OpenSearch.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing
    missingEvidence: >-
