callouts:
  - calloutType: insight
    title: Cloud data warehouse alone already establishes a $10B+ TAM floor
    body: >-
      The chapter does not need heroic arithmetic to justify a large market. Two independent 2026
      cloud data warehouse estimates cluster at roughly $14.5B-$14.9B today, which already clears
      the TAM threshold before any real-time analytics or observability adjacency is considered.
    claimRefs: [CM019, CM020, CM041]

  - calloutType: strength
    title: One engine can sell into warehouse, observability, and event analytics budgets
    body: >-
      ClickHouse’s strategic advantage is not just speed; it is category flexibility. Official
      product pages show the same engine supporting real-time analytics, data warehousing, and
      observability, while deployment modes span self-hosted and fully managed cloud.
    claimRefs: [CM003, CM006, CM008, CM012, CM013, CM045]

  - calloutType: risk
    title: Integrated incumbents can win the workflow even when ClickHouse wins the benchmark
    body: >-
