  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: exit-path-clarity
    missingEvidence: Management-backed exit timing, buyer universe, or IPO readiness materials tied to 2026 conditions.
    whyItMatters: A venture return from the Series C depends on what multiple floor exists at exit, not just on current product quality.
    diligencePath: Ask management and financing partners for the current IPO versus strategic-sale plan, timing assumptions, and sensitivity to public comp moves.
    relatedQuestionRefs:
    - QV024
  - type: missing-source
    severity: material
    topic: audited-financials
    missingEvidence: Audited ClickHouse financial statements or equivalent lender-grade revenue disclosures.
    whyItMatters: Public support for the valuation relies on third-party ARR estimates today, which weakens confidence in the exact multiple being paid.
    diligencePath: Request audited financials, monthly recurring revenue bridges, and board materials supporting the revenue trajectory.
    relatedQuestionRefs:
    - QV025
  - type: missing-source
    severity: material
    topic: retention-and-margin
    missingEvidence: Net revenue retention, gross margin, cloud gross margin, and customer cohort expansion data.
    whyItMatters: Those metrics determine whether ClickHouse deserves a durable premium over public open-source and warehouse peers.
    diligencePath: Request a KPI pack with NRR, gross margin, cloud contribution margin, and large-customer cohort expansion.
    relatedQuestionRefs:
    - QV026
  - type: missing-source
    severity: material
    topic: series-c-terms
    missingEvidence: Series C liquidation preferences, participation rights, debt covenants, and any senior-security overhang.
    whyItMatters: Headline valuation can overstate the economic entry point for minority investors if preferences or covenants are unfavorable.
    diligencePath: Review financing documents, cap-table waterfall models, and lender agreements before underwriting new money.
    relatedQuestionRefs:
    - QV027
