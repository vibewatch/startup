- id: series-c-context
  title: 'Series C pricing context: $6.35B was a forward-underwriting price, not a public-comparable price'
  body: 'The May 2025 round itself was unquestionably real: ClickHouse raised $350 million, added a broad syndicate of blue-chip investors, and layered in a $100 million credit facility. What is harder
    to prove from public evidence is whether the company had already earned a mid-single-digit-billion valuation on current scale. ClickHouse disclosed more than 300% growth and more than 2,000 customers,
    while Sacra estimated 2025 annualized revenue at about $160 million and cloud ARR growth above 250% entering 2026. Those are excellent operating signals. Even so, the implied trailing multiple remains
    near 40x, and the underwriting range requested by the market still lands in the mid-30s to low-40s even if you give the company the benefit of a broader $150 million to $185 million ARR range. That
    means investors were effectively paying today for tomorrow’s ARR, not for a mature, filing-backed revenue base.'
