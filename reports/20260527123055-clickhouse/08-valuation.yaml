- id: comparable-set
  title: 'Comparable set: Databricks is the aspiration, Snowflake and MongoDB are the public reality, and SingleStore is the closer private floor'
  body: The comp set makes the valuation tension clear. Snowflake generated $4.68 billion of FY2026 revenue and traded around a 13x revenue multiple in late May 2026. MongoDB, the most useful public open-source
    benchmark, traded closer to 10x. Databricks still commanded roughly 24.8x revenue, but it did so on a disclosed $5.4 billion revenue run-rate, more than 20,000 organizations on the platform, and net
    retention above 140%. SingleStore, by contrast, reported ARR above $123 million with near-breakeven cash flow, yet its last known disclosed valuation was only about $1 billion, or roughly 8x ARR on
    that simplified bridge. ClickHouse’s own ~40x trailing multiple therefore sits above every named peer. The only intellectually honest reason to pay that premium is belief that open-source adoption and
    AI-era workload growth will let ClickHouse move quickly toward Databricks-like forward scale rather than settle into Snowflake-, MongoDB-, or SingleStore-like pricing bands.
