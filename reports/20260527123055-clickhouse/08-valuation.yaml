- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - current evidence
  - what would change the view
  rows:
  - - Open-source adoption creates a low-friction funnel
    - Sacra cites ~46K GitHub stars, strong developer adoption, and 250%+ cloud ARR growth.
    - Show cohort conversion from open-source to paid cloud and sustained expansion within large enterprise accounts.
  - - AI and real-time analytics are genuine tailwinds
    - ClickHouse won AI-native and observability logos that need low-latency analytical queries.
    - Evidence of durable budget ownership and repeatable large-account deployment would strengthen conviction.
  - - 'Counter: the public comp gap is very large'
    - ClickHouse’s trailing multiple sits above Snowflake, MongoDB, SingleStore, and even Databricks.
    - The gap narrows only if ARR scales rapidly enough for the current mark to become a forward high-teens or low-20s multiple.
  - - 'Counter: platform breadth trails Databricks'
    - Databricks disclosed 20,000+ organizations and >140% retention, which ClickHouse has not matched publicly.
    - A broader enterprise feature set and better disclosure would justify a narrower discount to Databricks.
  - - 'Counter: disclosure is thin'
    - ARR is estimated, while gross margin, NRR, and financing terms remain undisclosed in retained public sources.
    - Audited financials or lender-grade KPI disclosure would materially improve underwriting confidence.
  notes: The thesis is strongest when framed around distribution and category fit; the anti-thesis is strongest when framed around the gap between narrative quality and public disclosure quality.
