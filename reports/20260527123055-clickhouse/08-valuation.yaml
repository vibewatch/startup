slug: clickhouse
runDate: '2026-05-27'
company:
  name: ClickHouse
chapter:
  number: 8
  title: Valuation
  summary: 'ClickHouse’s May 2025 Series C at roughly $6.35 billion implied about 35x-42x trailing ARR on a roughly $150 million to $185 million underwriting range, which is materially above Snowflake,
    MongoDB, and SingleStore and still richer than Databricks on a trailing basis. The premium is partly justified by open-source distribution, real-time analytics positioning, and exceptional cloud growth,
    but public evidence still lacks audited financials, retention, margin, and cap-table detail. Recommendation: track with medium confidence and high valuation risk until the company proves it can grow
    into the mark.'
sections:
- id: recommendation
  title: 'Recommendation: track — the product and open-source funnel are real, but the Series C already prices in elite execution'
  body: 'ClickHouse has many of the ingredients investors want in data infrastructure: a strong open-source engine, real customer pull in AI and observability workloads, and a cloud product whose usage-based
    model can compound as workloads scale. The issue is price, not quality. Independent coverage put the May 2025 Series C at about $6.35 billion, while third-party ARR estimates for the business cluster
    around roughly $150 million to $185 million, with Sacra’s central estimate at $160 million. That means the round was struck at roughly 35x to 42x trailing ARR. That premium is materially above Snowflake
    and MongoDB in public markets and still richer than Databricks despite Databricks’ far larger revenue base, broader platform breadth, and disclosed retention profile. The right call is track with medium
    confidence and high valuation risk: stay close, but require fresh evidence that ClickHouse can rapidly convert open-source demand into durable cloud economics before underwriting the headline mark.'
  claimRefs:
  - CV004
  - CV006
  - CV009
  - CV012
  - CV014
  - CV029
  - CV043
  tableRefs:
  - TV001
  - TV002
