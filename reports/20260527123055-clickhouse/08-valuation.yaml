    - 3.0-4.0
    - Most likely if ARR growth decelerates before ClickHouse proves retention and margin quality.
  - - Base
    - ClickHouse converts open-source demand into enterprise cloud ARR and reaches roughly $280M-$320M ARR within 12-18 months.
    - High-teens to ~20x forward ARR bridge.
    - 5.0-6.5
    - Requires continued hypergrowth plus credible evidence on ARR quality and enterprise readiness.
  - - Bull
    - ARR reaches roughly $375M-$430M quickly, the AI/open-source premium holds, and enterprise feature gaps close.
    - 20x-22x forward ARR for a breakout infrastructure winner.
    - 7.5-9.5
    - Needs elite execution and continued premium market appetite for AI data infrastructure.
  notes: Ranges are scenario-based valuation bridges, not DCF outputs. The base case treats the Series C as a forward-underwritten price rather than a current-scale price.
