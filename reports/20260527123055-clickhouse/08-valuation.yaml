- id: exit-readiness
  title: 'Exit readiness and diligence asks: the missing metrics are exactly the ones needed to justify the premium'
  body: The evidence gap is not around product relevance; it is around economic proof. Public sources do not provide audited ClickHouse financials, net retention, gross margin, or the conversion quality
    from open-source users to paid cloud cohorts. Nor do retained public sources disclose liquidation preferences or cap-table details that could change the economics of the Series C headline. That leaves
    the round looking more like a conviction bet on category leadership than a price backed by investor-complete disclosure. For that reason, the chapter’s diligence posture should stay focused on the metrics
    that could move the recommendation. A buy call would require audited or management-backed disclosure on ARR quality, retention, margin structure, and enterprise conversion. Without those, the stronger
    argument is to track the company closely, keep price discipline, and underwrite only after the business proves it can grow into the multiple rather than merely narrate its way toward it.
