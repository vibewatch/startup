- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Query processing layer
    - Parses, plans, and runs analytical SQL with vectorized execution and optional code compilation
    - Core engine internals and column-chunk processing model
    - Performance advantage depends on workload fit and schema design, not on query speed claims alone
  - - MergeTree storage parts
    - Stores immutable sorted parts and merges them in the background for high-ingest analytical tables
    - Primary key design, merge settings, background resources
    - Bad key design or too many tiny parts can erode ingest/query efficiency
  - - Sparse primary index and granules
    - Keeps indexes memory-efficient while enabling data skipping
    - Sorting key choice and index_granularity
    - Sparse reads may still pull extra rows, so pruning is workload-sensitive
  - - Shared catalog / Shared database engine
    - Coordinates stateless cloud compute and SharedMergeTree-style tables without local-disk ownership
    - Central catalog state and Keeper-backed coordination
    - Control-plane or metadata coordination is now a more important dependency than local-disk durability
  - - Cloud compute pools and object-backed parallel replicas
    - Scale reads and writes with separated compute and replicated object-backed storage access
    - Cloud orchestration plus underlying object storage and provider primitives
    - Provider-region maturity and preview features can affect feature availability
  - - Integration layer and table engines
    - Connects ClickHouse to brokers, databases, lake formats, and object stores
    - Connector quality plus external system APIs and schemas
    - Real customer experience depends on connector ownership and integration support tier
  notes: |-
    This architecture table combines stable engine design with cloud operating-model details. It is an evidence-backed product architecture map, not a full source-code or control-plane diagram.
