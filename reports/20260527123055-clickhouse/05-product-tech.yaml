- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User job
  - Current workflow
  - ClickHouse solution
  - Measurable benefit
  - Limitation
  rows:
  - - Ingest streaming events and logs
    - Build or operate custom consumers, landing zones, and retries
    - Kafka engine or ClickPipes-managed ingestion into ClickHouse Cloud
    - Managed ingestion reduces custom ETL and can add replay/exactly-once style semantics via buffered object storage paths
    - Operational behavior still depends on source system, schema drift, and connector maturity
  - - Model warehouse transforms
    - Run SQL models and CI/CD outside the database
    - dbt-clickhouse adapter with incremental, MV, distributed and testing support
    - Lets analytics engineers standardize transforms and deployment workflows around ClickHouse
    - Adapter limitations still exist for some distributed and very large model patterns
  - - Connect BI and semantic tools
    - Export or copy data into a separate BI store
    - Direct BI connectivity via ODBC/Power Query plus broader core/partner/community integrations
    - Supports DirectQuery/import and keeps analytics closer to operational data
    - Some cloud-service scenarios still require an ODBC driver and gateway bridge
  - - Operate customer-facing or observability analytics
    - Scale dashboards and queries on large event streams
    - ClickHouse core plus cloud management, caching, and scale features
    - Independent and official evidence both point to sub-second or real-time analytical workflows at scale
    - Teams may still need custom abstraction layers for broad self-service
  - - Democratize self-service analytics
    - Analysts ask platform teams for query help on optimized schemas
    - Use ClickHouse as the performance core under semantic or translation layers
    - Preserves engine performance while widening internal access to governed metrics
    - This abstraction layer is often ecosystem-built rather than natively owned by ClickHouse
  notes: |-
    Benefits in this table are source-backed workflow outcomes, not audited ROI claims. The last-mile self-service layer often sits outside the native ClickHouse product.
