callouts:
- calloutType: strength
  title: Cloud Architecture Is More Than Hosted Open Source
  body: |-
    Shared state coordination, object-backed parallel replicas, and compute-compute separation indicate that ClickHouse Cloud is meaningfully different from a simple self-managed cluster wrapped in support.
  claimRefs:
