- calloutType: risk
  title: Self-Service Usually Needs Another Layer
  body: |-
    The strongest recurring implementation risk is not query speed but usability at scale: optimized ClickHouse schemas often push large organizations toward semantic, translation, or governed self-service layers that ClickHouse does not fully own natively.
