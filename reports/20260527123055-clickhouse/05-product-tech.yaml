  - - Connector dependencies
    - Known requirement
    - ODBC driver and gateway for some Microsoft cloud flows
    - BI connectivity exists today and is not purely aspirational
    - Extra gateway/driver steps add implementation friction relative to truly browser-native SaaS connectors
