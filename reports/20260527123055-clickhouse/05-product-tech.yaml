- id: engine-storage-architecture
  title: Engine, Storage & Cloud Architecture
  body: |-
    The core technical differentiation remains the engine design. ClickHouse’s architecture material explicitly describes a vectorized execution model with optional code compilation, while the lower-level architecture page explains that data is processed as column chunks and most operations are dispatched over arrays rather than scalar values. That is consistent with what the product is built to do: large analytical scans, aggregates, filters, and joins over wide datasets rather than row-by-row transactional workloads. The storage layer is built around the MergeTree family, where inserts create immutable parts that are merged in the background. Those parts are sorted by primary key, and the index is sparse: it records marks for granules instead of every row, which keeps indexes small enough to stay memory-resident for very large datasets.

    That architecture matters because it explains both the performance upside and the operational tradeoffs. The sparse primary index and ordered storage improve pruning and compression, but the same docs note that sparse reads can still pull extra rows per block, so performance depends on schema design and key choice. In cloud deployments, ClickHouse adds another layer of differentiation: compute and storage separation, object-backed parallel replicas, Shared Catalog coordination, and compute-compute separation for read/write workload isolation. The Shared database engine documentation makes clear that SharedMergeTree-style stateless compute is not just a hosted VM wrapper; it is a different operating model designed for dynamic compute environments where local disks should not own durable state.
