  evidenceGaps:
  - type: missing-source
    severity: material
    topic: benchmark-methodology
    missingEvidence: A workload-normalized benchmark pack that shows schema, cluster shape, dataset characteristics, concurrency, and query mix behind ClickHouse’s headline speed and price/performance claims.
    whyItMatters: Without reproducible workload context, investors can over-read marketing-level performance statements and under-estimate the implementation effort needed to match them.
    diligencePath: Request benchmark methodology, representative customer workloads, and pre/post-migration results with schema and infrastructure assumptions disclosed.
    relatedQuestionRefs:
    - QE020
  - type: private-evidence-only
    severity: material
    topic: identity-governance
    missingEvidence: A current matrix covering SCIM, SAML/IdP support, audit logging, role granularity, break-glass access, and tenant-isolation controls by deployment type.
    whyItMatters: Identity and governance controls are central to enterprise standardisation decisions, and the public surface is not detailed enough to clear large regulated buyers.
    diligencePath: Request current security architecture and IAM documentation plus reference calls with buyers using SSO, private connectivity, and delegated admin at scale.
    relatedQuestionRefs:
    - QE016
    - QE017
  - type: private-evidence-only
    severity: material
    topic: semantic-layer-boundary
    missingEvidence: Clear product guidance on which semantic, metrics, governance, or query-translation capabilities ClickHouse intends to own natively versus leave to partners and customer-built layers.
    whyItMatters: This boundary determines how much application or platform code a buyer must build on top of ClickHouse to democratize access safely.
    diligencePath: Request product roadmap and reference architectures for governed self-service analytics, especially in large multi-team deployments.
    relatedQuestionRefs:
    - QE022
    - QE023
  - type: stale
    severity: minor
    topic: preview-feature-rollout
    missingEvidence: Customer-facing GA timelines, regional coverage, and workload caveats for preview items such as index sharding and any region-limited cloud features.
    whyItMatters: Preview features can materially improve economics or performance, but buyers should not underwrite them as fully mature without rollout clarity.
    diligencePath: Ask product and solutions engineering for GA timing, support commitments, and design-partner constraints for preview capabilities used in the target architecture.
    relatedQuestionRefs:
    - QE015
    - QE024
