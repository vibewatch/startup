  title: Product Module / Asset Matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Open-source ClickHouse server
    - Data platform and infrastructure teams
    - Production-mature core product with broad OSS adoption
    - Vectorized columnar OLAP engine with MergeTree storage model
    - Need customer-specific proof on migration effort from incumbent warehouses or search stacks
  - - ClickHouse Cloud managed service
    - Teams that want managed analytics infra
    - GA across major cloud marketplaces/providers with active 2026 region work
    - Managed operations, autoscaling, shared storage design, parallel replicas, compute separation
    - Need clearer public SLOs and workload-specific benchmark methodology
  - - ClickPipes managed ingestion
    - Platform teams moving event or CDC data into ClickHouse
    - In market and expanding by region/connectors in 2026
    - Cloud-native ingestion without custom ETL or consumer fleet management
    - Connector depth and backlog handling vary by source and should be tested on real schemas
  - - SQL console and clickhousectl
    - Operators, analysts, and developers
    - In market
    - Native operating surface for querying and managing cloud services
    - Public feedback still asks for deeper query-plan and role-governance UX
  - - Official client and connector ecosystem
    - Application developers and analytics engineers
    - High-signal maintenance footprint in 2026
    - Python, JavaScript, Docker, Power BI/Fabric, dbt and ODBC paths already documented
    - Connector coverage is broad, but support ownership is split across core, partner, and community tiers
  notes: |-
    This matrix distinguishes the core engine, managed cloud, ingestion plane, admin surfaces, and ecosystem packages; it is not a revenue decomposition.
