schemaVersion: "report-v2"
artifact: financials
slug: the-bot-company
runDate: 2026-10-06
company:
  name: The Bot Company
chapter:
  number: 4
  title: Financials
  summary: >-
    Public financial evidence is internally inconsistent: GetLatka estimates $16.6 million of
    2025 annual revenue, while UpsideList describes the company as pre-revenue, and reported
    cumulative funding ranges from roughly $300 million to $552 million. No reviewed source
    discloses pricing, revenue mix, gross margin, burn, cash, or runway, so capital adequacy and
    the path from prototype development to durable gross profit remain ununderwritable.
sections:
  - id: revenue-evidence
    title: Revenue evidence is contradictory and low quality
    body: >-
      The only quantified revenue evidence in the assigned public-source set is a GetLatka
      estimate of $16.6 million for 2025, following a stated $2.9 million for 2024. That estimate
      is not accompanied by audited accounts, customer contracts, a revenue definition, or a
      reconciliation to cash collections. UpsideList, updated later in July 2026, instead
      characterizes The Bot Company as having zero revenue and no shipped product. These values
      cannot be blended into a growth rate or treated as ARR: they conflict on the company's
      commercial status and use no disclosed common denominator. Until management provides a
      revenue ledger and recognition policy, the prudent underwriting assumption is that public
      traction is unverified rather than precisely zero or precisely $16.6 million.
    claimRefs: [CI001, CI002, CI003, CI004, CI016]
    tableRefs: [TI001]
  - id: monetization-and-gtm
    title: Monetization and sales efficiency are not publicly specified
    body: >-
      No reviewed source publishes a robot price, subscription price, pilot fee, warranty or
      service charge, contract duration, discount policy, or revenue-recognition treatment.
      UpsideList refers to a hardware-plus-subscription model only inside interview prompts, not
      as verified commercial terms, so it is not sufficient evidence that this model is live.
      The same evidence set provides no customer count, order backlog, sales cycle, CAC, payback,
      channel margin, or reseller economics. As a result, neither list pricing nor realized
      pricing can be modeled, and there is no support for a repeatable go-to-market efficiency
      claim. Diligence should begin with executed contracts and invoices, not market-directory
      estimates or hypothetical packaging.
    claimRefs: [CI005, CI006]
    tableRefs: [TI002]
  - id: costs-and-capital
    title: Hardware cost intensity is visible, but cash adequacy is not
    body: >-
      The company's reposted systems-software role describes work spanning hardware, firmware,
      drivers, sensors, embedded devices, real-time performance, and application layers, while
      the employer describes its team as deliberately lean. That is useful evidence of a
      vertically integrated engineering burden, but it does not quantify headcount or cost.
      Public sources provide no bill of materials, manufacturing yield, installation cost,
      warranty reserve, service burden, gross margin, working-capital cycle, or production
      capex. Funding reports also diverge: GetLatka reports $300 million across two rounds, The
      Next Web reports more than $300 million, and UpsideList uses $552 million. None of those
      raised-capital figures establishes current cash availability, burn, runway, debt, or
      project-finance capacity.
    claimRefs: [CI007, CI008, CI009, CI010, CI011, CI014]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict and financing dependency
    body: >-
      The financial case is presently a capital-consumption thesis rather than an evidenced
      revenue-quality thesis. Independent reports that the company lacks a public product, plus
      allegations that prototype testing occurred in rented homes and generated a damages
      lawsuit, indicate that real-world development is active but can create operating and
      control costs before commercialization. The roughly $12,000 claim is not itself financially
      material relative to reported funding; its relevance is as a governance and testing-cost
      signal. UpsideList's modeled 15% future dilution is only a scenario, not a forecast. The
      decisive diligence blockers are verified cash, monthly burn, launch timing, contracted
      demand, manufacturing economics, and the financing milestone required before the next
      round.
    claimRefs: [CI012, CI013, CI015, CI016]
    figureRefs: [FI001]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns:
      - Stream
      - Mechanism and unit
      - Public value or status
      - Evidence quality
      - Diligence ask
    rows:
      - - Robot hardware
        - One-time price per delivered robot
        - No public price or shipped-product evidence
        - Unverified
        - Signed orders, invoices, shipments, returns, and recognition policy
      - - Software or subscription
        - Recurring fee per robot, home, or account
        - Hypothetical; no verified offer or price
        - Unverified
        - Executed contracts, attach rate, churn, and deferred-revenue schedule
      - - Pilots or development programs
        - Pilot fee, milestone payment, or non-recurring engineering
        - No public mix or contract evidence
        - Unverified
        - Customer-level pilot ledger and conversion to production commitments
      - - Aggregate company revenue
        - Definition and denominator not disclosed
        - "$16.6M 2025 estimate versus a later zero-revenue characterization"
        - Conflicting third-party reports
        - Audited revenue by stream, period, recognition basis, and cash collected
    notes: >-
      Partial public-evidence snapshot as of 2026-10-06; GetLatka labels its $16.6M figure an
      estimate, UpsideList reports zero revenue, and no source provides audited revenue or mix.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI016]
  - id: TI002
    title: Pricing and monetization diligence matrix
    columns:
      - Potential charge
      - Unit or contract basis
      - List pricing
      - Realized pricing or discounts
      - Required evidence
    rows:
      - - Robot purchase
        - Per unit
        - Not disclosed
        - Not disclosed
        - Current price book, quotes, deposits, and refund terms
      - - Software or autonomy subscription
        - Per robot, home, account, or month
        - Not disclosed
        - Not disclosed
        - Executed subscription schedule and attach-rate cohort
      - - Installation, support, or warranty
        - Per deployment or service period
        - Not disclosed
        - Not disclosed
        - Warranty policy, service-level terms, claims, and reserve model
      - - Pilot or enterprise program
        - Per pilot, milestone, or site
        - Not disclosed
        - Not disclosed
        - Pilot statements of work and production-conversion terms
    notes: >-
      Every pricing field is a documented public-evidence gap; hypothetical charge categories
      organize diligence and do not assert that the company currently sells these offerings.
    claimRefs: [CI005, CI006]
  - id: TI003
    title: Unit economics and capital adequacy
    columns:
      - Metric
      - Public value or status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - 2025 revenue
        - "$16.6M GetLatka estimate; contradicted by UpsideList zero-revenue characterization"
        - Low
        - Establishes whether a commercial denominator exists
        - Audited revenue ledger, invoices, and recognition policy
      - - Gross margin
        - Not disclosed
        - Low
        - Tests whether hardware and service delivery can support contribution profit
        - Bill of materials, labor, freight, warranty, and service cost by unit
      - - Customer acquisition and payback
        - Not disclosed
        - Low
        - Determines whether demand can scale without consuming disproportionate capital
        - CAC bridge, sales cycle, channel fees, cohort retention, and payback
      - - Manufacturing and working capital
        - Not disclosed
        - Low
        - Hardware inventory and supplier terms can consume cash before revenue
        - Supplier terms, deposits, inventory turns, yields, and production capex
      - - Cash, burn, and runway
        - Not disclosed; funding raised is not cash available
        - Low
        - Determines the time available to reach launch and gross-profit milestones
        - Bank statements, monthly burn bridge, debt schedule, and 24-month cash plan
      - - Financing and dilution
        - "Funding reports range from about $300M to $552M; UpsideList models 15% future dilution"
        - Low
        - Conflicting totals and unknown runway prevent ownership and solvency underwriting
        - Cap table, round documents, liquidation preferences, and next-round trigger
    notes: >-
      Values are third-party reports or explicit nulls, not audited company disclosures; no
      raised-capital total is treated as cash on hand, and the 15% dilution value is an
      UpsideList scenario rather than company guidance.
    claimRefs: [CI001, CI003, CI007, CI008, CI009, CI010, CI011, CI012, CI013, CI014]
figures:
  - id: FI001
    title: Evidence-constrained path from capital to gross profit
    type: flow
    summary: >-
      A diligence flow showing the unverified transitions between reported financing,
      product development, commercial launch, recognized revenue, and sustainable gross profit.
    data:
      nodes:
        - id: reported-capital
          label: Reported capital raised
          detail: Third-party totals conflict between about $300M and $552M.
        - id: engineering
          label: Integrated engineering
          detail: Company-issued job content spans hardware, firmware, sensors, and applications.
        - id: prototype
          label: Real-world prototype work
          detail: News reports describe household-robot testing, but no public product.
        - id: launch
          label: Commercial launch
          detail: Timing, shipped units, orders, and customer acceptance are not disclosed.
        - id: pricing
          label: Contracted pricing
          detail: Purchase, subscription, pilot, support, and discount terms are unavailable.
        - id: recognized-revenue
          label: Recognized revenue
          detail: A $16.6M estimate conflicts with a zero-revenue characterization.
        - id: contribution
          label: Unit contribution
          detail: Hardware COGS, warranty, service, channel, and acquisition costs are unavailable.
        - id: gross-profit
          label: Sustainable gross profit
          detail: Margin, working-capital needs, burn, and runway remain unverified.
      edges:
        - from: reported-capital
          to: engineering
        - from: engineering
          to: prototype
        - from: prototype
          to: launch
        - from: launch
          to: pricing
        - from: pricing
          to: recognized-revenue
        - from: recognized-revenue
          to: contribution
        - from: contribution
          to: gross-profit
    approximationNotes: >-
      This is an analytical diligence sequence, not a forecast or quantified waterfall; every
      transition after reported financing requires management evidence.
    claimRefs: [CI001, CI003, CI005, CI007, CI009, CI010, CI011, CI014, CI015, CI016]
callouts:
  - calloutType: risk
    title: Funding totals do not establish runway
    body: >-
      Reported capital raised ranges materially across sources, and none discloses cash,
      restricted cash, debt, monthly burn, or production commitments. Capital adequacy cannot
      be inferred from cumulative funding.
    claimRefs: [CI008, CI009, CI010, CI011, CI012]
  - calloutType: recommendation
    title: Gate underwriting on primary financial evidence
    body: >-
      Require bank statements, a monthly cash bridge, audited revenue support, signed orders,
      manufacturing economics, and the current cap table before assigning a revenue multiple or
      concluding that existing capital reaches commercial scale.
    claimRefs: [CI004, CI005, CI007, CI012]
