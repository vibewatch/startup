callouts:
  - calloutType: "recommendation"
    title: "Capital Discipline Mandates a Strict Tracking Stance"
    body: "Investors should resist momentum pricing in frontier AI hardware. While The Bot Company's founding pedigree and capital formation are exceptional, committing growth equity at a $2.0B to $3.94B valuation without verifiable product utility, commercial gross margins, or unit economics represents an unhedged venture gamble. A disciplined TRACK recommendation preserves optionality until functional validation emerges."
    claimRefs:
      - "CV001"
      - "CV004"
      - "CV006"
  - calloutType: "risk"
    title: "Sim-to-Real Testing Liabilities and Preference Overhang"
    body: "Hardware testing inside residential properties without transparency has already generated municipal litigation and reputational fallout. Combined with a senior liquidation preference stack of several hundred million dollars, common equity investors bear the entire downside burden if commercialization is delayed or blocked by domestic privacy controversies."
    claimRefs:
      - "CV007"
      - "CV008"
      - "CV011"
