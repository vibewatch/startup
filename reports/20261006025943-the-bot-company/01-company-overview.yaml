callouts:
  - calloutType: insight
    title: Capital Formation vs. Product Verification Gap
    body: The Bot Company presents an extraordinary divergence between capital velocity and empirical verification. Raising $300M to reach a $2B valuation prior to a public product demonstration reflects immense investor trust in Kyle Vogt's autonomous systems background. However, until commercial validation occurs, the company remains highly speculative.
    claimRefs:
      - CO005
      - CO010
      - CO011
  - calloutType: risk
    title: Operational Ethics and Residential Testing Friction
    body: The 2026 Airbnb testing lawsuit highlights significant operational risks. Bypassing commercial testing protocols to evaluate hardware in private residential rentals exposes the firm to municipal zoning violations, deceptive practice allegations, and privacy complaints that echo previous regulatory friction at Cruise.
    claimRefs:
      - CO009
      - CO015
      - CO016
