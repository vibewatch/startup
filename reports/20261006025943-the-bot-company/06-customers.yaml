company:
  name: The Bot Company
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence defines a prospective consumer segment but does not establish a commercial
    customer base. The assigned sources contain no named paying customer, pilot, deployment outcome,
    retention metric, or concentration disclosure, while third-party revenue signals conflict.
sections:
  - id: target-segment-not-customer-base
    title: A target segment is visible, but a customer base is not
    body: >-
      Third-party profiles consistently frame the intended buyer as a U.S. household seeking broader
      home automation rather than a single-purpose cleaning device. AI Market Watch identifies
      individuals and families, including busy households, and describes an initial U.S. focus;
      Grokipedia narrows the proposed commercial model to dual-income households buying hardware
      plus a subscription. These descriptions are useful for defining the hypothesized buyer, user,
      and payer, but they are not customer evidence. None names an account, transaction, deployed
      unit, or realized willingness to pay. The investable conclusion is therefore limited: the
      company appears consumer-oriented, but segment size, qualification, channel, and actual
      customer mix remain unverified.
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU014
    tableRefs:
      - TU001
  - id: adoption-signals-conflict
    title: Public adoption signals are absent and revenue signals conflict
    body: >-
      The observable adoption record does not support a launch or growth curve. Investing.com
      reported no released product and no generated revenue in its funding coverage, while June
      2026 reporting still described either no public product or almost no disclosed prototype
      detail. Against that pre-commercial picture, GetLatka estimates $16.6 million of 2025 annual
      revenue, whereas UpsideList's July 2026 AI-generated analysis says there was no shipped product
      and zero revenue. Neither source supplies invoices, units, account counts, contract values, or
      a customer denominator. The estimate cannot be treated as ARR, verified revenue, or adoption;
      management financials and shipment records are required before drawing a trajectory.
    claimRefs:
      - CU003
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
    tableRefs:
      - TU002
  - id: proof-retention-and-expansion
    title: Customer proof, retention, and expansion remain diligence gaps
    body: >-
      Across the eight assigned sources, no source identifies a named paying customer, named pilot,
      production deployment, customer outcome, renewal, contract term, NRR, GRR, churn, expansion,
      channel contribution, or customer concentration. This is a bounded finding about the reviewed
      evidence set, not proof that no private customer activity exists. It nevertheless prevents
      underwriting durability or land-and-expand behavior. The next diligence step is not another
      logo search: request the customer-level ledger, signed contracts, invoices, deployment status,
      cohort retention, support burden, and pipeline conversion, then reconcile those records to
      recognized revenue and shipped units.
    claimRefs:
      - CU003
      - CU016
    tableRefs:
      - TU003
  - id: trust-before-commercial-scale
    title: Real-home testing allegations create a trust hurdle before scale
    body: >-
      Reporting on the Airbnb lawsuit provides evidence of real-home prototype activity, but not
      customer adoption. The Next Web says the complaint alleges unauthorized commercial research
      and filming, while RobotsBeat reports that at least 12 other hosts left negative reviews for
      guests from the same booking group. The AI Chronicle argues that undisclosed residential
      testing could damage public trust in home robotics. These are allegations and commentary, not
      adjudicated findings or customer survey data. Even so, consent, property care, privacy, and
      testing transparency are plausible procurement and adoption gates for a device intended to
      operate inside homes.
    claimRefs:
      - CU011
      - CU012
      - CU013
    figureRefs:
      - FU001
