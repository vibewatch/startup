  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: revenue-status
      missingEvidence: Primary financial records reconciling the $16.6 million 2025 estimate with the later zero-revenue description.
      whyItMatters: Revenue status determines whether any commercial adoption exists and prevents an estimate from being mislabeled as ARR.
      diligencePath: Obtain 2025 and 2026 monthly recognized revenue, invoices, customer contracts, cash receipts, and accounting-policy support.
      relatedQuestionRefs:
        - QU008
      relatedTableRefs:
        - TU002
    - type: private-evidence-only
      severity: material
      topic: customer-proof
      missingEvidence: Named customer and pilot records with production status, active usage, outcomes, and referenceability.
      whyItMatters: Public target-customer descriptions do not establish product-market fit, deployment maturity, or willingness to pay.
      diligencePath: Review the CRM, signed contracts, invoices, pilot roster, deployment logs, and reference calls selected from the complete customer list.
      relatedQuestionRefs:
        - QU003
        - QU004
      relatedTableRefs:
        - TU003
    - type: private-evidence-only
      severity: material
      topic: retention-and-concentration
      missingEvidence: Cohort retention, renewal, churn, expansion, contract duration, channel contribution, and customer concentration data.
      whyItMatters: Without these records, demand durability, expansion economics, procurement friction, and counterparty concentration cannot be underwritten.
      diligencePath: Obtain customer cohorts, GRR, NRR, logo churn, renewal schedules, top-customer revenue shares, channel-sourced revenue, and pipeline conversion.
      relatedQuestionRefs:
        - QU005
        - QU006
