figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence supports a target-customer hypothesis and prototype testing, but not progression
      through trial, production, renewal, or expansion.
    data:
      items:
        - label: Target definition
          detail: Individuals, families, busy households, and dual-income households are described as prospective users.
          touchpoints:
            - Third-party company profiles
        - label: Awareness
          detail: Funding coverage and robotics reporting establish visibility, not buyer intent.
          touchpoints:
            - Media coverage
        - label: Evaluation
          detail: Almost no public prototype detail prevents assessment of household fit or willingness to pay.
          touchpoints:
            - Prototype reporting
        - label: Trial
          detail: Airbnb reporting indicates alleged real-home testing, but no consenting customer pilot is named.
          touchpoints:
            - Residential test environments
        - label: Production use
          detail: No named production deployment, active-home count, or measured customer outcome is disclosed.
          touchpoints:
            - Evidence gap
        - label: Renewal and expansion
          detail: No contract term, renewal, retention, expansion, or concentration metric is disclosed.
          touchpoints:
            - Evidence gap
    approximationNotes: >-
      This is an evidence-state journey rather than a measured conversion funnel; stages after target
      definition are not supported by comparable population or conversion data.
    claimRefs:
      - CU009
      - CU011
      - CU012
      - CU013
      - CU014
      - CU016
callouts:
  - calloutType: risk
    title: Revenue evidence is internally inconsistent
    body: >-
      A $16.6 million third-party estimate conflicts with a later AI-generated zero-revenue assessment
      and pre-release reporting. Do not use either figure for valuation or retention analysis until
      management records reconcile period, accounting basis, customers, and shipments.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
  - calloutType: recommendation
    title: Gate customer underwriting on primary records
    body: >-
      Require customer-level contracts, invoices, deployment status, active usage, outcomes, renewal,
      churn, expansion, and concentration before crediting product-market fit or durable demand.
    claimRefs:
      - CU016
