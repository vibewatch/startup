      - number: '2.3'
        title: Adoption Drivers, Constraints, and Valuation Relevance
        blocks:
          - type: paragraph
            body: >-
              The central demand driver is straightforward: a robot that reliably removes frequent clutter could
              exchange capital and recurring software spend for household time. The adoption path is less
              straightforward. Sacra reports that direct non-humanoid peer Sunday Robotics plans only a 50-household
              beta in late 2026 and a 2027-2028 commercial launch, indicating that comparable products remain in
              validation rather than scaled distribution. The Bot Company's own market evidence is contradictory:
              GetLatka estimates US$16.6 million of 2025 annual revenue, while UpsideList characterizes the company as
              having no shipped product and zero revenue. Neither is an official disclosure. Separately, multiple
              outlets report allegations of undisclosed robot testing in a rented home and more than US$12,000 of
              claimed damages. Those allegations do not establish liability, but they show how consent, property risk,
              and reputational trust can delay testing and adoption. Revenue, shipments, pricing, and unit economics
              therefore remain diligence gates, not established market traction.
            claimRefs:
              - CM007
              - CM009
              - CM010
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: No Defensible TAM/SAM/SOM Yet
            body: >-
              The available pool supplies an adjacent laundry-robot estimate and several commercialization indicators,
              but no source quantifies the product's eligible households, launch geography, conversion, production
              capacity, or willingness to pay. Treating the adjacent estimate as The Bot Company's TAM would overstate
              the evidence.
            calloutType: risk
            claimRefs:
