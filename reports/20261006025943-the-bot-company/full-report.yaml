  - id: FE001
    title: Embodied Robotics Technical Architecture Stack
    type: stack
    summary: Layered decomposition of The Bot Company's software, simulation, and hardware robotics architecture.
    data:
      layers:
        - label: Application & Task Orchestration Layer
          detail: Task planning, goal decomposition, and domestic chore scheduling via multimodal foundation models
          modules:
            - Chore Scheduler & Priority Engine
            - Multimodal Task Planner
            - Spatial Room Graph & Object Registry
          outputs:
            - Target Manipulation Trajectories
            - Navigation Destination Goals
        - label: Perception & Spatial Understanding Layer
          detail: 3D scene reconstruction, volumetric mapping, and real-time obstacle identification
          modules:
            - 3D Vision Depth Estimation
            - LiDAR Point-Cloud Segmentation
            - Tactile & Force Sensor Ingestion
          outputs:
            - Real-Time Occupancy Grids
            - Object Grasp Poses & Geometry
        - label: Whole-Body Control & Policy Execution Layer
          detail: Low-level coordinated locomotion, joint torque control, and dynamic balance policies
          modules:
            - Sim-to-Real RL Policy Execution
            - Whole-Body Kinematic Solver
            - Reflex Collision Mitigation
          outputs:
            - Motor Torque & Velocity Commands
            - Dynamic Center-of-Mass Corrections
        - label: Simulation & Reinforcement Learning Training Infrastructure
          detail: Scalable physics simulation rollouts, domain randomization pipelines, and curriculum learning
          modules:
            - IsaacLab & MuJoCo Parallel Environments
            - GPU Training Cluster & Rollout Workers
            - Domain Randomization Parameter Generator
          outputs:
            - Trained Policy Checkpoints
            - Sim-to-Real Evaluation Benchmark Metrics
        - label: Embedded Compute & Motor Control Firmware Layer
          detail: Real-time microcontroller firmware, edge inference acceleration, and bus communication
          modules:
            - Low-Latency Motor Commutation Firmware
            - Onboard Edge Neural Inference Engine
            - Safety Interlock & Watchdog Supervisor
          outputs:
            - Direct Inverter PWM Signals
            - Sub-Millisecond Fault Telemetry
        - label: Hardware Actuation & Mechanical Chassis Layer
          detail: Physical mechanical chassis, mobile base, articulated arm, and power delivery
          modules:
            - Low-Profile Wheeled/Treaded Chassis
            - Articulated Arm & Dual Gripper End-Effector
            - Lithium-Ion Power Distribution & Battery Pack
          outputs:
            - Physical Work Output & Object Transit
            - Raw Telemetry & Sensor Encoders
    approximationNotes: >-
      Layered architecture synthesized from engineering recruiting specifications, simulation toolchains, and hardware
      prototype disclosures.
    claimRefs:
      - CE003
      - CE005
      - CE007
      - CE008
