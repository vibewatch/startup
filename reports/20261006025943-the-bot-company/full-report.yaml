  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant market is narrower than either all household appliances or all robotics. Independent coverage
              describes a company pursuing robots that perform household chores, while Sacra places the initial product
              concept in mobile, non-humanoid manipulation and emphasizes forgiving tidying tasks before dishes,
              laundry, or other high-consequence work. The practical launch boundary is therefore paid automation of
              recurring pickup, organization, and light movement inside homes. It excludes industrial automation,
              warehouse robots, and general elder-care services; it also excludes higher-risk kitchen, laundry, and
              medical workflows until reliability and safety are demonstrated. Buyers can continue using unpaid
              household labor, paid cleaners, or single-function appliances, so the company must prove incremental time
              savings and reliability rather than treating all household-work expenditure as addressable robotics spend.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM006
      - number: '2.2'
        title: Evidence-Constrained Sizing, Buyers, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not support a defensible top-down TAM, a product-specific SAM, or an obtainable
              SOM. Sacra provides one adjacent-category estimate: laundry-folding robots growing from US$6.4 billion in
              2025 to nearly US$27 billion by 2034. That estimate is useful as an adjacency signal but cannot be
              relabeled as the market for The Bot Company's initial tidying product. Sacra also reports an implied
              sub-US$10,000 target price and identifies dual-income families with children and pets as the primary buyer
              cohort, with short-term rental, elder-care, and small-office use as possible adjacencies. A credible
              bottom-up model still needs target-household counts, willingness-to-pay data, expected replacement cycles,
              subscription attach, launch geography, and production capacity. Until those inputs exist, valuation should
              be tied to explicit commercialization milestones rather than a broad household-robotics headline.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM008
              - CM011
