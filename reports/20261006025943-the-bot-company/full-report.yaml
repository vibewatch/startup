        title: Exhibits
        blocks:
          - type: callout
            title: Clandestine Testing Practices Threaten Public Trust and Regulatory Standing
            body: >-
              The revelation that The Bot Company converted private short-term rentals into secret robot testing labs
              without host consent exposes the startup to immediate civil litigation, potential municipal zoning
              sanctions, and reputational contagion reminiscent of Cruise's autonomous vehicle setbacks.
            calloutType: risk
