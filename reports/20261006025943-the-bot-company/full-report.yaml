              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The defensible distinction visible today is product intent rather than demonstrated performance: The Bot
              Company targets household manipulation with a non-humanoid platform, whereas the illustrative peer set
              includes industrial, logistics, cleaning, social, and humanoid systems. That focus may reduce direct
              overlap, but it is not yet a moat. SetterVC's descriptions show that better-capitalized or
              already-productized categories approach the same buyer problem from adjacent directions, and the evidence
              does not quantify switching costs, distribution access, partner exclusivity, multi-homing, data advantage,
              or manufacturing economics. Until the company publishes comparable task-success and safety results plus a
              credible package and channel, incumbents, adjacent entrants, and the status quo can compete primarily by
              lowering adoption risk rather than matching the same form factor.
            claimRefs:
              - CP003
              - CP014
              - CP015
              - CP016
