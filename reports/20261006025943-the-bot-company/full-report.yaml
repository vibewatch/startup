      - CV001
      - CV003
      - CV005
      - CV006
      - CV009
      - CV011
  - id: TV003
    title: Scenario Valuation Matrix
    columns:
      - Scenario
      - Assumed Operating Milestone
      - Valuation / Return Logic
      - Key Risk Factors
      - Downside Triggers
    rows:
      - - Bull Case
        - Successful 2028 commercial launch with mass residential chore adoption and subscription retention
        - '>$10B public market capitalization or strategic acquisition yielding >180% return post-dilution'
        - Consumer hardware scaling bottlenecks, supply chain friction, and component cost inflation
        - Protracted engineering delays extending beyond available cash runway
      - - Base Case
        - Prototypes advance to pilot testing; commercial release delayed; follow-on dilution required
        - Valuation stagnates around $2.0B-$3.0B; additional financing dilutes equity by 15% to 25%
        - Extended cash burn without commercial revenue generation; competitive entry from humanoids
        - Flat or down-round financing forced by venture syndicate capital discipline
      - - Bear Case
        - Persistent physical manipulation failures, consumer privacy backlash, or regulatory blockers
        - Orderly liquidation or distressed intellectual property sale; common stock impaired by 1.0x preference
        - Unresolvable residential testing liabilities, reputation impairment, and complete loss of capital access
        - Legal injunctions barring residential testing or catastrophic prototype safety incident
    notes: >-
      Scenario projections evaluate risk-adjusted return profiles across pre-revenue consumer hardware developmental
      stages.
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV010
      - CV012
figures:
  - id: FO001
    title: Company Milestone Timeline
    type: timeline
    summary: >-
      Chronological progression of The Bot Company across founding, major financing rounds, scale milestones, and
      operational controversies.
    data:
      items:
        - label: Founding and Incorporation
          date: '2024-05-01'
          detail: Kyle Vogt announces founding of The Bot Company in San Francisco following his departure from Cruise.
          tone: positive
        - label: Seed Financing Tranche
          date: '2024-05-01'
          detail: Company raises $150M seed capital at an initial post-money valuation of approximately $550M.
          tone: positive
        - label: Series B Capital Formation
          date: '2025-03-24'
          detail: Greenoaks leads a $150M Series B financing round, establishing a confirmed $2.0B post-money valuation.
          tone: positive
        - label: Reported $4B Valuation Ambitions
          date: '2025-10-29'
          detail: Media reports indicate The Bot Company explores raising $250M at a $4B+ post-money valuation.
          tone: neutral
        - label: Undisclosed Residential Testing Incident
          date: '2026-04-15'
          detail: Company personnel allegedly conduct 11-day secret prototype testing in an Airbnb rental in San Francisco.
          tone: negative
        - label: Property Damage Lawsuit Filed
          date: '2026-06-01'
          detail: >-
            Airbnb host Sean Donovan files lawsuit seeking $12,383.50 in property damages and citing deceptive
            commercial testing.
          tone: negative
        - label: Wider Airbnb Testing Pattern Exposed
          date: '2026-06-07'
          detail: >-
            Press investigations reveal at least 12 short-term rentals were subjected to similar undisclosed testing
            operations.
          tone: negative
        - label: Current Operational & Diligence Baseline
          date: '2026-09-14'
          detail: Independent diligence confirms 96 employees, pre-revenue status, and ongoing product opacity.
          tone: neutral
    approximationNotes: Dates represent publicly documented announcement dates, court filings, and research publication milestones.
