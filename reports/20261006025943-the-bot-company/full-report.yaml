      - number: '3.2'
        title: Scale signals do not establish commercial readiness
        blocks:
          - type: paragraph
            body: >-
              Secondary data providers indicate substantial financing and organizational scale, but their figures are
              neither audited nor mutually sufficient to prove market traction. SetterVC estimates $596 million raised
              across four rounds and a latest $4 billion valuation dated October 28, 2025, while explicitly cautioning
              that its marks may be incomplete, stale, erroneous, or revised. GetLatka estimates $16.6 million of 2025
              annual revenue and roughly 83 employees in 2026; UpsideList instead characterizes the company as having
              zero revenue and no shipped product. Prospeo supplies still another workforce view. These inconsistencies
              prevent a reliable scale comparison, and none of the assigned sources discloses list pricing, packaging,
              contract terms, named customers, or realized unit economics.
