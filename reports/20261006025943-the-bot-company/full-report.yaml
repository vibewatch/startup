              The assigned evidence identifies Boston Dynamics, Tesla Optimus, iRobot, Jibo, InGen Dynamics, and Figure
              AI as illustrative competitors, while warning that the list may be incomplete, stale, or erroneous. Their
              described scopes span industrial and logistics robots, humanoids intended for industrial or in-home use,
