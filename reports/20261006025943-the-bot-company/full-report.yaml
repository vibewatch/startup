  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Stance, and Recommendation Framework
        blocks:
          - type: paragraph
            body: >-
              Evaluating The Bot Company requires balancing an extraordinary capital formation trajectory and elite
              robotics pedigree against zero commercial operating proof. The core investment thesis rests on the massive
              addressable demand for autonomous domestic chore automation, where multi-degree-of-freedom robotic
              manipulation could capture substantial consumer surplus. Co-founders Kyle Vogt and Paril Jain offer proven
              systems engineering leadership across autonomous mobility and computer vision. However, the counter-thesis
              is acute: the firm possesses no commercial product, discloses zero customer traction, and faces unresolved
              sim-to-real physical manipulation bottlenecks. Furthermore, third-party estimates alleging commercial
              software revenues confuse early-stage enterprise SaaS models with pre-revenue consumer hardware
              development. Given these structural disparities between private capital marks and operating realities, our
              disciplined investment stance is TRACK with HIGH risk and LOW confidence. Capital allocation cannot be
              recommended until the company achieves verified hardware manufacturing readiness, demonstrates
              reproducible household chore execution, and clarifies its legal liabilities stemming from residential
              testing disputes.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV008
              - CV011
      - number: '8.2'
        title: Financing History, Cap Table Dynamics, and Preference Overhang
        blocks:
          - type: paragraph
            body: >-
              The Bot Company has demonstrated rapid capitalization across consecutive private financings, securing
              institutional backing from Greenoaks Capital Partners, Spark Capital, Nat Friedman, Daniel Gross, and
              Quiet Capital. Secondary marketplace and venture filings record confirmed equity funding totaling between
              $300M and $520.8M, anchoring private valuations from a $2.0B Series B mark in early 2025 up to an
              indicated $3.94B Series C benchmark. While private marketplace databases model 1.0x non-participating
              liquidation preference structures, common equity holders face substantial structural dilution. Developing
              complex consumer hardware platforms demands intense capital expenditure for tooling, component supply
              pipelines, and physical assembly facilities. Hardware development without commercial cash inflows rapidly
              depletes treasury reserves. In the absence of audited financial disclosures, external estimates suggesting
              modest headcounts between 83 and 96 personnel imply substantial ongoing engineering burn that will
              necessitate dilutive follow-on financing before scaled manufacturing is achieved.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV009
              - CV011
      - number: '8.3'
        title: Scenario Valuation Modeling, Downside Triggers, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Because The Bot Company lacks audited operational revenue and commercial customer volume, valuation
              modeling must rely on scenario-based outcome distributions rather than traditional discounted cash flow
              projections. In a bull case scenario, rapid technical breakthroughs in domestic manipulation yield a
              successful commercial product launch by 2028, unlocking premium consumer hardware margins and subscription
              services that support an exit valuation exceeding $10B. In the base case, ongoing technical refinement
              delays volume commercial delivery, requiring an intermediate financing round that dilutes existing equity
              by 15% to 25% while valuation multiples stagnate near current marks. In the bear case, intractable
              sim-to-real reliability failures, consumer privacy backlash, or compounding property damage liabilities
              from field trials prevent commercialization, triggering an acqui-hire or orderly wind-down where senior
              liquidation preferences absorb remaining assets. Rigorous diligence must prioritize physical product
              demonstrations, unit bill-of-materials breakdowns, and legal exposure audits regarding residential trial
              operations.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital Discipline Mandates a Strict Tracking Stance
            body: >-
              Investors should resist momentum pricing in frontier AI hardware. While The Bot Company's founding
              pedigree and capital formation are exceptional, committing growth equity at a $2.0B to $3.94B valuation
              without verifiable product utility, commercial gross margins, or unit economics represents an unhedged
              venture gamble. A disciplined TRACK recommendation preserves optionality until functional validation
              emerges.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV006
          - type: callout
            title: Sim-to-Real Testing Liabilities and Preference Overhang
            body: >-
              Hardware testing inside residential properties without transparency has already generated municipal
              litigation and reputational fallout. Combined with a senior liquidation preference stack of several
              hundred million dollars, common equity investors bear the entire downside burden if commercialization is
              delayed or blocked by domestic privacy controversies.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV011
