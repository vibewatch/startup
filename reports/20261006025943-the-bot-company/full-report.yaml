            body: >-
              Reporting on the Airbnb lawsuit provides evidence of real-home prototype activity, but not customer
              adoption. The Next Web says the complaint alleges unauthorized commercial research and filming, while
              RobotsBeat reports that at least 12 other hosts left negative reviews for guests from the same booking
              group. The AI Chronicle argues that undisclosed residential testing could damage public trust in home
              robotics. These are allegations and commentary, not adjudicated findings or customer survey data. Even so,
              consent, property care, privacy, and testing transparency are plausible procurement and adoption gates for
