              - CP011
              - CP012
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue evidence is contradictory and low quality
        blocks:
          - type: paragraph
            body: >-
              The only quantified revenue evidence in the assigned public-source set is a GetLatka estimate of $16.6
              million for 2025, following a stated $2.9 million for 2024. That estimate is not accompanied by audited
              accounts, customer contracts, a revenue definition, or a reconciliation to cash collections. UpsideList,
              updated later in July 2026, instead characterizes The Bot Company as having zero revenue and no shipped
              product. These values cannot be blended into a growth rate or treated as ARR: they conflict on the
              company's commercial status and use no disclosed common denominator. Until management provides a revenue
              ledger and recognition policy, the prudent underwriting assumption is that public traction is unverified
              rather than precisely zero or precisely $16.6 million.
