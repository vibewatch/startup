      - number: '6.3'
        title: Customer proof, retention, and expansion remain diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Across the eight assigned sources, no source identifies a named paying customer, named pilot, production
              deployment, customer outcome, renewal, contract term, NRR, GRR, churn, expansion, channel contribution, or
              customer concentration. This is a bounded finding about the reviewed evidence set, not proof that no
              private customer activity exists. It nevertheless prevents underwriting durability or land-and-expand
              behavior. The next diligence step is not another logo search: request the customer-level ledger, signed
              contracts, invoices, deployment status, cohort retention, support burden, and pipeline conversion, then
              reconcile those records to recognized revenue and shipped units.
