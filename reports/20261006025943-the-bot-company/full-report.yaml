              - CE011
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Sim-to-Real Transfer and Uncontrolled Domestic Clutter Vulnerability
            body: >-
              Training reinforcement learning policies in MuJoCo and IsaacLab provides massive simulation rollouts, but
              domestic households present nearly infinite combinatorial variations in lighting, rug textures, deformable
              items, and human presence. Documented damage during covert residential prototype testing confirms that
              simulated policies struggle with real-world physical dynamics, risking high return rates or severe
              liability if launched prematurely.
            calloutType: risk
            claimRefs:
              - CE007
              - CE010
              - CE011
          - type: callout
            title: 'Form-Factor Strategy: Non-Humanoid Wheeled Base vs. Bipedal Alternatives'
            body: >-
              Choosing a wheeled or treaded base with an articulated arm rather than a bipedal humanoid architecture
              substantially lowers mechanical complexity, power consumption, and bill-of-materials costs. However, this
              architectural compromise strictly bounds domestic utility: the robot cannot navigate standard residential
              stairs, severely limiting multi-level home deployments.
            calloutType: insight
            claimRefs:
              - CE001
              - CE003
              - CE006
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: A target segment is visible, but a customer base is not
        blocks:
          - type: paragraph
            body: >-
              Third-party profiles consistently frame the intended buyer as a U.S. household seeking broader home
              automation rather than a single-purpose cleaning device. AI Market Watch identifies individuals and
              families, including busy households, and describes an initial U.S. focus; Grokipedia narrows the proposed
              commercial model to dual-income households buying hardware plus a subscription. These descriptions are
              useful for defining the hypothesized buyer, user, and payer, but they are not customer evidence. None
              names an account, transaction, deployed unit, or realized willingness to pay. The investable conclusion is
              therefore limited: the company appears consumer-oriented, but segment size, qualification, channel, and
              actual customer mix remain unverified.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
