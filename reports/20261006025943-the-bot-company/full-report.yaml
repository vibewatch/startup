      - number: '3.3'
        title: Capability proof and trust posture
        blocks:
          - type: paragraph
            body: >-
              Reports describe a prototype with a mobile base, articulated arm, and dual grippers, but the assigned
              evidence contains no independent manipulation, navigation, reliability, or safety benchmark. The strongest
              real-world signal is adverse rather than validating: four publications reported a lawsuit alleging
              undisclosed robot testing in a San Francisco short-term rental, property damage, and more than $12,000
              sought by the host. RobotsBeat reported that the company had not publicly responded at the time of
              publication. The allegations do not prove liability, yet they expose a competitive trust burden. A rival
              with consent-based pilots, documented safety controls, and independently measured performance could reduce
              buyer uncertainty more effectively than an opaque prototype program.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
