          - type: callout
            title: Operational Ethics and Residential Testing Friction
            body: >-
              The 2026 Airbnb testing lawsuit highlights significant operational risks. Bypassing commercial testing
              protocols to evaluate hardware in private residential rentals exposes the firm to municipal zoning
              violations, deceptive practice allegations, and privacy complaints that echo previous regulatory friction
              at Cruise.
            calloutType: risk
