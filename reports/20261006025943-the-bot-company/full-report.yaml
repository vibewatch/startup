        title: Exhibits
        blocks:
          - type: callout
            title: Competitive advantage requires trust evidence, not only task ambition
            body: >-
              The reported lawsuit does not establish liability, but it changes the diligence burden: The Bot Company
              must show consent-based field-testing controls, safety records, and independently measured household task
              performance before its form-factor thesis can translate into lower buyer risk than adjacent products or
              the status quo.
            calloutType: risk
            claimRefs:
