chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity, Commercial Mission, and Operational Stage
        blocks:
          - type: paragraph
            body: >-
              The Bot Company (operating under the domain bot.co and the legal entity name The Bot Company) is a
              venture-backed domestic robotics company founded in 2024 and headquartered in San Francisco, California.
              The enterprise was created to design, build, and deploy autonomous mobile robots specifically engineered
              to handle mundane household chores and physical organization tasks, freeing up human time. Unlike
              industrial automation or humanoid robotics concepts designed for complex manufacturing workflows, The Bot
              Company pursues a consumer-focused, practical approach using mobile platforms equipped with manipulation
              appendages. As of October 2026, the company operates at a Series B pre-revenue stage, with zero public
              commercial shipments, zero reported paying customers, and no active public pre-order program. Independent
              analysis and verified reporting classify the firm's stage as early developmental R&D, where prototype
              testing has been conducted primarily in private residential environments rather than large-scale customer
              pilots.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
              - CO010
              - CO011
              - CO012
              - CO014
      - number: '1.2'
        title: Founding Team, Technical Leadership, and Key-Person Dependency
        blocks:
          - type: paragraph
            body: >-
              The Bot Company was co-founded by Chief Executive Officer Kyle Vogt alongside technical co-founders Paril
              Jain and Luke Holoubek. Vogt possesses a prominent track record in embodied artificial intelligence,
              having previously co-founded Justin.tv (which became Twitch) and autonomous vehicle developer Cruise
              Automation, serving as CEO of Cruise until his resignation in late 2023 following a severe safety incident
              and regulatory license suspension in California. Technical leadership is reinforced by Paril Jain, who
              formerly led machine learning and autonomy initiatives within Tesla's AI division, and Luke Holoubek, a
              senior robotics and engineering contributor previously at Cruise. This executive configuration creates
              extraordinary founder-market fit for embodied physical autonomy, large-scale systems engineering, and
              hardware-software integration. However, it also introduces acute key-person dependency: the startup's
              massive capital formation and valuation premiums are intrinsically tied to Vogt's reputation, while
              Cruise's past regulatory controversies cast a lasting shadow over the firm's compliance culture.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.3'
        title: Capital Formation, Valuation Trajectory, and Syndicate Control
        blocks:
          - type: paragraph
            body: >-
              The Bot Company has demonstrated unprecedented capital velocity for a domestic robotics startup without a
              public commercial product. In May 2024, the company secured an initial $150M seed round at an estimated
              $550M post-money valuation. In March 2025, it closed a $150M Series B round led by Greenoaks Capital at a
              confirmed $2.0B post-money valuation, bringing total on-the-record funding to $300M. Market intelligence
              reports by late 2025 indicated that the company began exploring or preparing an additional $250M financing
              round targeting a valuation exceeding $4.0B. However, independent equity analysis from UpsideList cautions
              that pre-revenue equity at a multi-billion-dollar valuation carries severe downside risk (-11% expected
              2-year equity return with high dilution probability). Investors in the syndicate hold 1x non-participating
              liquidation preference, establishing significant priority claims over exit proceeds before common equity
              holders receive liquidity.
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO015
              - CO016
      - number: '1.4'
        title: Operational Milestones, Field Testing Controversies, and Diligence Horizon
        blocks:
          - type: paragraph
            body: >-
              The company's milestone progression spans aggressive capital milestones, organizational scaling to
              approximately 83 to 96 employees, and rapid physical prototype iterations. However, operational scaling
              encountered severe public controversy in mid-2026. In June 2026, an Airbnb host in San Francisco filed a
              $12,383.50 lawsuit alleging that The Bot Company employees booked his private residential rental property
              under false pretenses (posing as remote workers) and secretly operated it as an unauthorized robotics
              laboratory. Host Sean Donovan and public reporting documented Ring camera footage showing over 30
              individuals rotating shifts and moving heavy equipment cases, leaving broken tiles, damaged dining tables,
              and displaced crockery. Similar complaints surfaced from other regional hosts, exposing material
              governance, ethical, and liability risks associated with undisclosed domestic R&D practices.
            claimRefs:
              - CO005
              - CO009
              - CO014
              - CO015
              - CO016
