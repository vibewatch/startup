        title: Exhibits
        blocks:
          - type: callout
            title: Capital Formation vs. Product Verification Gap
            body: >-
              The Bot Company presents an extraordinary divergence between capital velocity and empirical verification.
              Raising $300M to reach a $2B valuation prior to a public product demonstration reflects immense investor
              trust in Kyle Vogt's autonomous systems background. However, until commercial validation occurs, the
              company remains highly speculative.
            calloutType: insight
