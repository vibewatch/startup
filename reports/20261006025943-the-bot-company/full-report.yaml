      - number: '6.2'
        title: Public adoption signals are absent and revenue signals conflict
        blocks:
          - type: paragraph
            body: >-
              The observable adoption record does not support a launch or growth curve. Investing.com reported no
              released product and no generated revenue in its funding coverage, while June 2026 reporting still
              described either no public product or almost no disclosed prototype detail. Against that pre-commercial
              picture, GetLatka estimates $16.6 million of 2025 annual revenue, whereas UpsideList's July 2026
              AI-generated analysis says there was no shipped product and zero revenue. Neither source supplies
              invoices, units, account counts, contract values, or a customer denominator. The estimate cannot be
              treated as ARR, verified revenue, or adoption; management financials and shipment records are required
              before drawing a trajectory.
            claimRefs:
              - CU003
