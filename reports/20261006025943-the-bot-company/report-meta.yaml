companyProfile:
  summary: >-
    The Bot Company is a San Francisco-based household robotics startup founded in 2024 by Kyle Vogt and a small
    technical leadership team built around embodied AI and robotics. It is targeting consumer home chore automation with
    a non-humanoid mobile-manipulation platform, but the company remains pre-revenue with no public commercial
    shipments, no disclosed pricing, and no named paying customers. Reported financing is substantial for a hardware
    startup, yet the evidence set also contains conflicting scale estimates and an active testing-related lawsuit that
    complicates trust and execution assessment.
