callouts:
  - calloutType: "risk"
    title: "Sim-to-Real Transfer and Uncontrolled Domestic Clutter Vulnerability"
    body: "Training reinforcement learning policies in MuJoCo and IsaacLab provides massive simulation rollouts, but domestic households present nearly infinite combinatorial variations in lighting, rug textures, deformable items, and human presence. Documented damage during covert residential prototype testing confirms that simulated policies struggle with real-world physical dynamics, risking high return rates or severe liability if launched prematurely."
    claimRefs:
      - "CE007"
      - "CE010"
      - "CE011"
  - calloutType: "insight"
    title: "Form-Factor Strategy: Non-Humanoid Wheeled Base vs. Bipedal Alternatives"
    body: "Choosing a wheeled or treaded base with an articulated arm rather than a bipedal humanoid architecture substantially lowers mechanical complexity, power consumption, and bill-of-materials costs. However, this architectural compromise strictly bounds domestic utility: the robot cannot navigate standard residential stairs, severely limiting multi-level home deployments."
    claimRefs:
      - "CE001"
      - "CE003"
      - "CE006"
