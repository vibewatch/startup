      - number: '5.3'
        title: 部署现实、现场测试脆弱性与安全治理
        blocks:
          - type: paragraph
            body: >-
              运营部署与验证是 The Bot Company 开发路线中争议最大的维度。家庭机器人不能只在洁净实验室环境中实现消费可行性；控制策略必须经受凌乱、不可预测的客厅环境。但 2026
              年年中，公司现实验证实践引发了重大法律和声誉反弹：San Francisco 一名 Airbnb
              房东提起诉讼，指称公司人员秘密将租赁住宅改成未披露的商业机器人测试实验室。根据诉讼文件和调查报道，配备摄像头、LiDAR 传感器和机械操作器的原型机在一段 11
              晚的预订期间运行，造成浴室瓷砖缺口、传家家具划痕、餐具破损和家庭物品移位等结构性损害。这些事件凸显了真实家庭条件下避障、轻柔操作物体和硬件故障保护方面的严重技术不足。此外，在住宅社区持续记录视觉与空间数据，会使公司受到严格的数据隐私和市政分区审查。考虑到
              Kyle Vogt 过去在 Cruise 的监管经历，商业发布前建立经认证的硬件安全、透明的测试同意流程和防篡改的用户隐私控制，是关键尽调阻碍。
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE007
              - CE008
              - CE011
