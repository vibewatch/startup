      - number: '8.3'
        title: 情景估值建模、下行触发器与尽调要求
        blocks:
          - type: paragraph
            body: >-
              由于 The Bot Company 没有经审计的运营收入和商业客户量，估值建模必须依靠基于情景的结果分布，而不是传统的贴现现金流预测。乐观情景中，家庭操作技术快速突破，公司在 2028
              年前成功商业发布，解锁高端消费硬件毛利和订阅服务，支持超过 $10B 的退出估值。基准情景中，持续技术改进推迟规模商业交付，公司需要进行中间轮融资，使现有股权稀释 15% 至
              25%，而估值倍数在当前水平附近停滞。悲观情景中，难以解决的 sim-to-real 可靠性故障、消费者隐私反弹或现场试验造成的累积财产损害责任阻止商业化，触发 acqui-hire
              或有序关停，高级清算优先权吸收剩余资产。严格尽调必须优先安排实体产品演示、单位物料清单拆分，以及对住宅试验运营的法律风险审计。
            claimRefs:
