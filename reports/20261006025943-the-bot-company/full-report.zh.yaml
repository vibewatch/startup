  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、目标家庭流程与功能范围
        blocks:
          - type: paragraph
            body: >-
              The Bot Company
              通过具身人工智能平台，瞄准在非受控家庭环境中自动完成日常住宅家务。按客户流程看，系统希望让居住者摆脱重复性手工家务，例如清理杂乱台面、捡起散落的个人物品、分类家庭物件和整理生活空间。不同于固定式工业操作臂或结构化仓储机器人，家庭辅助必须应对非标准化地面布局、不同光照，以及宠物、儿童和易碎家用品等高度动态的障碍物。根据创业公司跟踪分析和住宅测试观察得出的公开原型描述显示，硬件是一个类似低矮茶几的轮式或履带式移动底座，配有关节式机械臂和双夹爪，可自主抓取和放置物体。虽然公司的官方使命承诺为每个家庭提供有帮助的机器人、把时间和精力还给家庭，但平台仍处于早期商业化前原型阶段。截至
              2026 年 10 月，公司尚未正式公布量产 SKU、确定的物理尺寸表、载荷规格、电池循环时长或零售上市路线图。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
