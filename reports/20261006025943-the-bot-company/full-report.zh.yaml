        title: 展示材料
        blocks:
          - type: callout
            title: Sim-to-Real 迁移与失控家庭杂物的脆弱性
            body: >-
              在 MuJoCo 和 IsaacLab 中训练强化学习策略可进行大规模仿真
              rollout，但家庭环境的光照、地毯纹理、可变形物品和人员存在几乎有无限组合。秘密住宅原型测试中记录的损坏确认，仿真策略难以应对现实物理动态；若过早上市，可能导致高退货率或严重责任风险。
            calloutType: risk
            claimRefs:
              - CE007
              - CE010
              - CE011
          - type: callout
            title: 外形路线：非人形轮式底座与双足替代方案
            body: 与双足人形架构相比，采用带关节臂的轮式或履带式底座，可大幅降低机械复杂度、能耗和物料清单成本。但这一架构取舍严格限制了家庭用途：机器人无法通过标准住宅楼梯，严重限制其在多层住宅中的部署。
            calloutType: insight
