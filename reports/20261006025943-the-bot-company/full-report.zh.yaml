        blocks:
          - type: paragraph
            body: >-
              The Bot Company 处于未经验证的商业化前无收入阶段，没有商业客户出货或经审计收入披露。GetLatka 未经验证的第三方估计为 2025 年 ARR $16.6 million、员工 83
              名；这些数字是未经确认的算法建模，而不是已验证客户合同。UpsideList 的独立风险投资股权分析估计两年股权回报为负 11%，原因包括资本快速消耗、没有出货产品，以及后续融资轮中预计发生 15%
              稀释。公司已通过确认的风险投资轮融资超过 $300 million，据报道还寻求累计超过 $552 million 的资本，估值在 $2 billion 至 $4 billion
              之间扩张，因此承担沉重的优先股堆叠。在下行或困境收购情景中，1x non-participating senior
              清算优先权会在普通股股东获得价值前吸收数亿美元交易收益。考虑到硬件工装、代工爬坡和广泛实体测试的极高资本强度，任何商业产品市场匹配的延迟都可能耗尽现金跑道，并迫使公司进行结构化的下轮重组融资。
