            body: >-
              指定证据将 Boston Dynamics、Tesla Optimus、iRobot、Jibo、InGen Dynamics 和 Figure AI
              列为示例竞争者，同时提醒名单可能不完整、过时或有误。它们覆盖工业和物流机器人、面向工业或家庭的人形机器人、地面清洁家电、社交机器人以及模块化服务机器人。The Bot Company
              更聚焦于用非人形移动底座和夹爪完成家庭整理与家务。不过对买家而言，相关集合还包括人工家务和单用途清洁产品：两者都能解决目标工作的部分需求，而不要求买家相信一个尚未出货的通用平台。
