  - id: FI001
    title: 从资本到毛利的受证据约束路径
    type: flow
    summary: 一条尽调流程展示了从已报告融资、产品开发、商业发布、确认收入到可持续毛利之间未经验证的过渡。
    data:
      nodes:
        - id: reported-capital
          label: 据报道筹集的资本
          detail: 第三方总额在约 $300M 与 $552M 之间存在冲突。
        - id: engineering
          label: 集成工程
          detail: 公司发布的招聘内容涵盖硬件、固件、传感器和应用。
        - id: prototype
          label: 现实原型工作
          detail: 新闻报道描述了家用机器人测试，但没有公开产品。
        - id: launch
          label: 商业发布
          detail: 时间、已发货数量、订单和客户验收情况均未披露。
        - id: pricing
          label: 合同定价
          detail: 购买、订阅、试点、支持和折扣条款均不可得。
        - id: recognized-revenue
          label: 确认收入
          detail: $16.6M 的估计与收入为零的描述相冲突。
        - id: contribution
          label: 单位贡献
          detail: 硬件 COGS、保修、服务、渠道和获客成本均不可得。
        - id: gross-profit
          label: 可持续毛利
          detail: 毛利率、营运资金需求、烧钱速度和现金跑道仍未经验证。
      edges:
        - from: reported-capital
          to: engineering
        - from: engineering
          to: prototype
        - from: prototype
          to: launch
        - from: launch
          to: pricing
        - from: pricing
          to: recognized-revenue
        - from: recognized-revenue
          to: contribution
        - from: contribution
          to: gross-profit
    approximationNotes: 这是分析性的尽调序列，不是预测或量化瀑布图；据报道融资之后的每一步过渡都需要管理层证据。
    claimRefs:
      - CI001
      - CI003
      - CI005
      - CI007
      - CI009
      - CI010
      - CI011
      - CI014
      - CI015
      - CI016
  - id: FE001
    title: 具身机器人技术架构栈
    type: stack
    summary: The Bot Company 软件、仿真和硬件机器人架构的分层拆解。
    data:
      layers:
        - label: 应用与任务编排层
          detail: 通过多模态基础模型进行任务规划、目标分解和家务调度
          modules:
            - 家务调度器与优先级引擎
            - 多模态任务规划器
            - 空间房间图与物体注册表
          outputs:
            - 目标操控轨迹
            - 导航目的地目标
        - label: 感知与空间理解层
          detail: 3D 场景重建、体积映射和实时障碍物识别
          modules:
            - 3D 视觉深度估计
            - LiDAR 点云分割
            - 触觉与力传感器数据接入
          outputs:
            - 实时占用栅格
            - 物体抓取姿态与几何信息
        - label: 全身控制与策略执行层
          detail: 底层协调运动、关节扭矩控制和动态平衡策略
          modules:
            - 仿真到现实 RL 策略执行
            - 全身运动学求解器
            - 反射式碰撞缓解
          outputs:
            - 电机扭矩与速度指令
            - 动态质心修正
        - label: 仿真与强化学习训练基础设施
          detail: 可扩展物理仿真推演、域随机化流水线和课程学习
          modules:
            - IsaacLab 与 MuJoCo 并行环境
            - GPU 训练集群与推演工作节点
            - 域随机化参数生成器
          outputs:
            - 已训练策略检查点
            - 仿真到现实评估基准指标
        - label: 嵌入式计算与电机控制固件层
          detail: 实时微控制器固件、边缘推理加速和总线通信
          modules:
            - 低延迟电机换相固件
            - 机载边缘神经推理引擎
            - 安全联锁与看门狗监控器
          outputs:
            - 直接逆变器 PWM 信号
            - 亚毫秒级故障遥测
        - label: 硬件执行与机械底盘层
          detail: 物理机械底盘、移动底座、关节式机械臂和电力供应
          modules:
            - 低矮轮式 / 履带式底盘
            - 关节式机械臂与双夹爪末端执行器
            - 锂离子电力分配与电池组
          outputs:
            - 物理作业输出与物体转运
            - 原始遥测与传感器编码器
    approximationNotes: 分层架构综合自工程招聘规格、仿真工具链和硬件原型披露。
    claimRefs:
      - CE003
      - CE005
      - CE007
      - CE008
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据支持目标客户假设和原型测试，但不支持客户经历试用、生产、续约或扩张。
    data:
      items:
        - label: 目标定义
          detail: 个体、家庭、忙碌家庭和双收入家庭被描述为潜在用户。
          touchpoints:
            - 第三方公司简介
        - label: 认知
          detail: 融资报道和机器人新闻建立了可见度，但不代表买方意向。
          touchpoints:
            - 媒体报道
        - label: 评估
          detail: 几乎没有公开原型细节，无法评估其对家庭的适配度或付费意愿。
          touchpoints:
            - 原型报道
        - label: 试用
          detail: Airbnb 报道显示据称进行过真实住宅测试，但没有点名任何经客户同意的试点。
          touchpoints:
            - 住宅测试环境
        - label: 生产使用
          detail: 没有披露已点名的生产部署、活跃家庭数量或实测客户结果。
          touchpoints:
            - 证据缺口
        - label: 续约与扩张
          detail: 没有披露合同期限、续约、留存、扩张或集中度指标。
          touchpoints:
            - 证据缺口
    approximationNotes: 这是证据状态旅程，而非实测转化漏斗；目标定义之后的阶段没有可比的总体或转化数据支持。
