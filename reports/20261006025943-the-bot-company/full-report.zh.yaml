  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险分析
        blocks:
          - type: paragraph
            body: >-
              The Bot Company 正面临因在私人住宅内开展未经授权的商业测试而产生、且正在加剧的法律风险。2026 年 6 月，San Francisco Airbnb 房东 Sean Donovan
              发现其出租屋在一次 11 晚入住期间被秘密改造成机器人测试实验室后，对 The Bot Company 提起民事诉讼，要求赔偿 $12,383 的直接财产损失。除单一房产维修成本外，法律报道称至少另外 12
              名当地 Airbnb 房东报告了相同的损坏和设备搬运模式，公司因此可能面临多原告诉讼、民事欺诈索赔和欺诈性诱导指控。此外，在没有房主授权的情况下，于住宅环境部署配备光学摄像头和 LiDAR
              传感器的实验性移动机器人，可能触发 California 法规下的重大隐私责任，也违反禁止在住宅区开展商业工业研究的市政分区条例。公司创始人高管经历进一步加重法律风险：CEO Kyle Vogt 曾领导
              General Motors 的自动驾驶子公司 Cruise，直至其 California 运营牌照在 2023
              年多起高关注度安全事故后被暂停。这段执法历史意味着，市政当局和消费者安全监管机构会以更高的怀疑程度审视 The Bot Company 的家庭机器人部署，带来重大的头条风险和监管阻力。
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR007
              - CR013
