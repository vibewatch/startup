            body: 已报道的诉讼不能证明责任成立，但它提高了尽调要求：The Bot Company 必须展示基于同意的现场测试控制、安全记录和独立测量的家庭任务性能，之后其外形路线才可能把买家风险降到低于相邻产品或现状方案的水平。
