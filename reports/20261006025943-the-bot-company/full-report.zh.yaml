  - id: FV001
    title: 推荐决策逻辑
    type: flow
    summary: 依次评估资本规模、产品验证和运营风险，将各项证据映射为纪律性的观察判断。
    data:
      nodes:
        - label: 资本规模与资金支持
          detail: 已从包括 Greenoaks、Spark Capital 和顶级天使投资人在内的头部投资方处融资 $300M-$520M
        - label: 产品与收入验证
          detail: 没有可供商业化使用的产品，没有公开基准，且尚未产生收入的商业化状态未经验证
        - label: 运营与法律摩擦
          detail: 仿真到现实测试摩擦严重，且在 San Francisco 存在正在进行的住宅物业损害诉讼
        - label: 资本密集度与稀释
          detail: 消费硬件研发快速消耗资金储备，因此需要稀释性过渡融资
        - label: 估值基准
          detail: $2.0B 至 $3.94B 的非公开估值区间带来了极高的执行预期
        - label: 投资建议
          detail: 在完成实体验证前，以高风险、低置信度维持纪律性的观察判断
    approximationNotes: 该流程图展示了连接实证证据与整体投资评级的定性决策阶段。
