chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、商业使命与运营阶段
        blocks:
          - type: paragraph
            body: >-
              The Bot Company（以域名 bot.co 运营，法律实体名称同为 The Bot Company）是一家由风险资本支持、成立于 2024 年、总部位于 San Francisco,
              California 的家庭机器人公司。公司成立的目标，是设计、制造并部署专门处理日常家务和家庭物品整理的自主移动机器人，从而释放人的时间。不同于面向复杂制造流程的工业自动化或人形机器人概念，The Bot
              Company 采用面向消费者、强调实用性的路线，使用配备操作附肢的移动平台。截至 2026 年 10 月，公司处于 Series B
              无收入阶段，没有公开商业出货、没有报告中的付费客户，也没有活跃的公开预售项目。独立分析和经验证的报道将其归类为早期研发阶段；原型测试主要在私人住宅环境进行，而非大规模客户试点。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
              - CO010
              - CO011
              - CO012
              - CO014
      - number: '1.2'
        title: 创始团队、技术领导与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              The Bot Company 由 CEO Kyle Vogt 与技术联合创始人 Paril Jain、Luke Holoubek 共同创办。Vogt 在具身人工智能领域履历突出，曾联合创办
              Justin.tv（后成为 Twitch）和自动驾驶汽车开发商 Cruise Automation，并在 2023 年底一次严重安全事故及 California 监管牌照暂停后辞去 Cruise CEO
              职务。Paril Jain 曾在 Tesla AI 部门负责机器学习和自动驾驶项目，Luke Holoubek 则是曾任职于 Cruise
              的资深机器人及工程贡献者，进一步强化了技术领导层。这套高管组合与具身物理自动驾驶、大规模系统工程及软硬件集成高度匹配。但它也带来尖锐的关键人物依赖：初创公司的巨额融资和估值溢价本质上都与 Vogt 的声誉绑定，而
              Cruise 过往的监管争议也给公司的合规文化留下长期阴影。
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.3'
        title: 融资形成、估值轨迹与财团控制
        blocks:
          - type: paragraph
            body: >-
              The Bot Company 尚无公开商业产品，却展现了异常快的融资速度。2024 年 5 月，公司以估计的 $550M post-money 估值完成首轮 $150M Seed 融资。2025 年 3
              月，公司完成由 Greenoaks Capital 领投的 $150M Series B，确认 post-money 估值为 $2.0B，使有记录的累计融资达到 $300M。市场情报在 2025
              年底显示，公司开始探索或准备另一轮 $250M 融资，目标估值超过 $4.0B。不过，UpsideList 的独立股权分析提醒，无收入公司若以数十亿美元估值融资，存在严重下行风险（预期两年股权回报为
              -11%，且发生高比例稀释的概率较高）。财团投资人持有 1x non-participating 清算优先权，在普通股股东获得流动性之前，对退出收益享有显著的优先受偿权主张。
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO015
              - CO016
      - number: '1.4'
        title: 运营里程碑、现场测试争议与尽调范围
        blocks:
          - type: paragraph
            body: >-
              公司里程碑包括激进的融资目标、将组织规模扩张至约 83 至 96 名员工，以及快速迭代实体原型。但 2026 年年中，运营扩张遭遇严重公开争议。2026 年 6 月，San Francisco 一名 Airbnb
              房东提起 $12,383.50 诉讼，指称 The Bot Company 员工以虚假理由（冒充远程办公者）预订其私人住宅出租房，并秘密将其作为未经授权的机器人实验室。房东 Sean Donovan
              及公开报道记录的 Ring 摄像头画面显示，超过 30 人轮班进出、搬运沉重设备箱，造成瓷砖破损、餐桌损坏和餐具移位。其他地区房东也出现类似投诉，暴露出未披露的家庭研发实践所带来的重大治理、伦理与责任风险。
            claimRefs:
              - CO005
              - CO009
              - CO014
              - CO015
              - CO016
