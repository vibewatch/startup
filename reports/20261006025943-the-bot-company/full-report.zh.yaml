  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、立场与建议框架
        blocks:
          - type: paragraph
            body: >-
              评估 The Bot
              Company，需要在异常的融资轨迹和顶尖机器人履历，与零商业运营证明之间做权衡。核心投资逻辑建立在自主家庭家务自动化的巨大可获取需求上：多自由度机器人操作有可能捕获大量消费者剩余。联合创始人 Kyle Vogt
              和 Paril Jain 在自主移动和计算机视觉领域提供了已验证的系统工程领导力。但反向逻辑同样尖锐：公司没有商业产品、披露的客户 traction 为零，并面临尚未解决的 sim-to-real
              物理操作瓶颈。此外，声称存在商业软件收入的第三方估计，把早期企业 SaaS 模式与无收入消费硬件开发混为一谈。鉴于私人资本标记与运营现实之间存在结构性差距，我们的审慎投资立场是 TRACK，风险为
              HIGH，信心为 LOW。在公司实现已验证的硬件制造准备度、展示可重复的家庭家务执行能力，并厘清住宅测试争议产生的法律责任之前，不建议配置资本。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
