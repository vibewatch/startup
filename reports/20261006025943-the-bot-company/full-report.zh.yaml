      - number: '5.2'
        title: 技术栈、Sim-to-Real 流程与系统架构
        blocks:
          - type: paragraph
            body: >-
              The Bot Company
              的技术架构覆盖四个相互依赖的层次：物理驱动与移动硬件、嵌入式传感器集成、仿真到现实的强化学习流程，以及空间基础智能。工程招聘披露确认，公司正在开发高性能全身控制器，用于在物理世界执行敏捷移动、操作和协调的多自由度运动。低层控制策略并不完全依赖手工设计的运动学或启发式规则控制，而是在物理仿真环境中训练，具体使用
              IsaacLab 或 MuJoCo，并在大型 GPU 训练集群上并行 rollout。为弥合普遍存在的 sim-to-real
              差距，软件栈加入域随机化、结构化评测基准和专门的奖励课程，以支持稳定的长时程学习。在感知和智能层，架构使用 3D
              视觉系统、电机控制固件和多模态基础模型理解视觉、听觉及空间输入。但如果没有广泛、透明的实体机队验证就依赖大规模仿真迁移，部署到非结构化住宅空间时会产生尖锐的运营脆弱性。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
