        title: 规模信号不能证明商业准备度
        blocks:
          - type: paragraph
            body: >-
              二级数据提供商显示了可观的融资和组织规模，但其数字既未经审计，也不足以相互印证市场进展。SetterVC 估计公司四轮融资累计 $596 million，最新估值为 $4 billion，日期为 2025 年
              10 月 28 日，同时明确警告其数据可能不完整、过时、有误或已修订。GetLatka 估计 2025 年年收入为 $16.6 million、2026 年约有 83 名员工；UpsideList
              则称公司收入为零且没有出货产品。Prospeo 又提供了另一种员工规模判断。这些不一致阻碍可靠的规模比较，指定来源也没有披露目录价格、包装、合同条款、具名客户或已实现的单位经济。
            claimRefs:
