              - CM015
      - number: '2.3'
        title: 采用驱动因素、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              核心需求驱动因素很直接：如果机器人能可靠地清除频繁出现的杂物，家庭就可能用资本支出和持续性软件支出换取时间。但采用路径并不简单。Sacra 报道称，直接的非人形同业 Sunday Robotics 计划在
              2026 年底进行 50 户 beta 测试，并于 2027-2028 年商业发布，说明可比产品仍处于验证阶段，而非规模化分销阶段。The Bot Company 自身的市场证据相互矛盾：GetLatka 估计
              2025 年年收入为 US$16.6 million，而 UpsideList 将公司描述为没有出货产品、收入为零。两者都不是官方披露。另有多家媒体报道，公司据称在出租住宅中进行未披露的机器人测试，并产生超过
              US$12,000 的索赔损失。这些指控不能证明责任成立，但显示同意、财产风险和声誉信任如何拖慢测试和采用。              因此，收入、出货、定价和单位经济仍是尽调闸门，而不是已经建立的市场进展。
            claimRefs:
              - CM007
              - CM009
              - CM010
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 尚无可辩护的 TAM/SAM/SOM
            body: 现有资料提供了相邻洗衣机器人估计和若干商业化指标，但没有来源量化符合条件的家庭、上市地域、转化率、产能或支付意愿。将相邻估计当作 The Bot Company 的 TAM，会夸大证据。
            calloutType: risk
            claimRefs:
              - CM008
              - CM011
              - CM015
