              - CO014
              - CO015
              - CO016
      - number: '1.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 融资速度与产品验证缺口
            body: >-
              The Bot Company 的融资速度与实证验证之间存在异常大的落差。在公开展示产品之前融资 $300M、达到 $2B 估值，反映投资人对 Kyle Vogt
              自动驾驶系统背景的巨大信任。但在商业验证出现之前，公司仍高度投机。
            calloutType: insight
            claimRefs:
              - CO005
              - CO010
              - CO011
          - type: callout
            title: 运营伦理与住宅测试摩擦
            body: 2026 年 Airbnb 测试诉讼凸显了显著运营风险。绕开商业测试规范、在私人住宅出租房中评估硬件，使公司面临市政分区违规、欺骗性行为指控和隐私投诉；这些问题与 Cruise 过往的监管摩擦相呼应。
            calloutType: risk
            claimRefs:
              - CO009
              - CO015
              - CO016
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场既窄于所有家用电器，也窄于所有机器人。独立报道描述的是一家开发家务机器人的公司，Sacra
              则将初始产品概念定位于移动、非人形操作，并强调先处理容错度较高的整理任务，再考虑餐具、洗衣或其他高后果工作。因此，实际上市边界是：在家庭内部，为重复性捡拾、整理和轻量搬动提供付费自动化。它不包括工业自动化、仓储机器人和一般养老照护服务；在可靠性和安全性得到证明之前，也不包括高风险的厨房、洗衣和医疗流程。买家仍可依靠无偿家务劳动、付费清洁工或单功能家电，所以公司必须证明增量节省的时间和可靠性，而不能把所有家庭劳动支出都视为可获取的机器人支出。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM006
      - number: '2.2'
        title: 受证据约束的市场规模、买家与采用路径
        blocks:
          - type: paragraph
            body: >-
              指定证据不足以支持可辩护的 top-down TAM、产品特定的 SAM 或可获取的 SOM。Sacra 提供了一个相邻品类估计：叠衣机器人市场从 2025 年的 US$6.4 billion 增长到 2034
              年接近 US$27 billion。这个估计可以作为相邻市场信号，但不能改称为 The Bot Company 初始整理产品的市场。Sacra 还报告了低于 US$10,000
              的隐含目标价格，并将有子女和宠物的双收入家庭列为主要买家群体，短租、养老照护和小型办公室则可能是相邻场景。可信的 bottom-up
              模型仍需目标家庭数量、支付意愿数据、预期更换周期、订阅附加率、上市地域和产能等输入。在这些输入具备之前，估值应绑定于明确的商业化里程碑，而不是宽泛的家庭机器人市场标题。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM008
              - CM011
