        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              今天可见的可辩护差异是产品意图，而非已证明的性能：The Bot Company
              用非人形平台瞄准家庭操作，而示例同业覆盖工业、物流、清洁、社交和人形系统。这一聚焦可能减少直接重叠，但尚不能称为护城河。SetterVC
              的描述显示，资金更充裕或已经产品化的品类正从相邻方向解决同一买家问题，而证据没有量化切换成本、分销渠道、合作伙伴排他性、多归属、数据优势或制造经济。在公司公布可比任务成功率和安全结果，并拿出可信的产品套餐与渠道之前，在位企业、相邻进入者和现状替代方案可以主要靠降低采用风险竞争，而不必复制同一外形。
