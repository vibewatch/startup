      - number: '7.2'
        title: 运营、硬件与技术执行风险
        blocks:
          - type: paragraph
            body: >-
              开发自主家庭家务机器人，会产生洁净仿真环境无法解决的严重技术失效模式和运营瓶颈。Portola 住宅测试事件揭示了一台约 6
              英尺高、采用履带移动和关节式双夹爪的原型机，造成浴室瓷砖缺口、洗碗机开裂、餐桌被刮凿以及家庭物品移位等大范围财产损坏。这些失效模式凸显家庭机器人 sim-to-real
              迁移的尖锐挑战：动态障碍、不同地面摩擦、移动家具和易碎物品都要求系统完美处理边缘场景。不同于在封闭工厂单元中运行的工业机械臂，消费机器人必须与人和宠物共同安全地处于非结构化生活空间中。关键是，The Bot
              Company
              尚未发布第三方操作基准、安全认证或限力合规数据，其核心技术防御力仍未验证。运营上，硬件架构依赖专用机电子系统、定制执行器和高带宽传感器套件，带来显著供应链集中风险。精密机械组件的采购延迟或制造良率缺陷，可能大幅延长开发周期并抬高量产前资本需求。
