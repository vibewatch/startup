  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: The Bot Company 从成立、主要融资轮次和规模里程碑，到运营争议的时间顺序演进。
    data:
      items:
        - label: 成立与注册
          date: '2024-05-01'
          detail: Kyle Vogt 离开 Cruise 后在旧金山宣布成立 The Bot Company。
          tone: positive
        - label: 种子融资批次
          date: '2024-05-01'
          detail: 公司以约 $550M 的初始投后估值筹集 $150M 种子资本。
          tone: positive
        - label: B 轮资本形成
          date: '2025-03-24'
          detail: Greenoaks 领投 $150M B 轮融资，确定投后估值为 $2.0B。
          tone: positive
        - label: 据报道的 $4B 估值目标
          date: '2025-10-29'
          detail: 媒体报道称，The Bot Company 正探索以 $4B+ 投后估值筹集 $250M。
          tone: neutral
        - label: 未披露的住宅测试事件
          date: '2026-04-15'
          detail: 据称，公司人员在旧金山一处 Airbnb 租赁房内秘密进行为期 11 天的原型测试。
          tone: negative
        - label: 提起财产损害诉讼
          date: '2026-06-01'
          detail: Airbnb 房东 Sean Donovan 提起诉讼，要求赔偿 $12,383.50 的财产损失，并指称存在欺骗性的商业测试。
          tone: negative
        - label: 更广泛的 Airbnb 测试模式曝光
          date: '2026-06-07'
          detail: 新闻调查显示，至少有 12 处短租房遭遇了类似的未披露测试行动。
          tone: negative
        - label: 当前运营与尽调基线
          date: '2026-09-14'
          detail: 独立尽调确认公司有 96 名员工、处于前收入状态，且产品仍不透明。
          tone: neutral
    approximationNotes: 日期代表公开记录的公告日期、法院文件日期和研究发布里程碑。
