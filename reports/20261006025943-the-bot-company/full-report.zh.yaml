        title: 能力证明与信任姿态
        blocks:
          - type: paragraph
            body: >-
              报道描述了一款配有移动底座、关节臂和双夹爪的原型，但指定证据没有独立的操作、导航、可靠性或安全基准。最强的现实信号不是验证，而是负面信号：四家媒体报道了一宗诉讼，指控公司在 San Francisco
              短租住宅中进行未披露的机器人测试、造成财产损坏，房东索赔超过 $12,000。RobotsBeat
              报道称，截至发布时公司尚未公开回应。这些指控不能证明责任成立，却暴露了竞争层面的信任负担。有同意基础的试点、记录完备的安全控制和独立测量的性能数据，可能比不透明的原型项目更有效地降低买家不确定性。
