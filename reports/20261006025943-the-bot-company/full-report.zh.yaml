      - number: '8.2'
        title: 融资历史、股权结构表与优先权悬置
        blocks:
          - type: paragraph
            body: >-
              The Bot Company 连续完成多轮私人融资，迅速实现资本化，并获得 Greenoaks Capital Partners、Spark Capital、Nat Friedman、Daniel Gross
              和 Quiet Capital 的机构支持。二级市场和风险投资文件记录的已确认股权融资总额在 $300M 至 $520.8M 之间，私人估值从 2025 年初 $2.0B 的 Series B 标记上升至指示性的
              $3.94B Series C 基准。尽管私人市场数据库建模为 1.0x non-participating
              清算优先权结构，普通股股东仍面临显著结构性稀释。开发复杂的消费硬件平台，需要为工装、组件供应链和实体装配设施投入大量资本。没有商业现金流入的硬件开发会迅速消耗资金储备。在缺少经审计财务披露的情况下，外部估计的
              83 至 96 名员工意味着持续的工程烧钱规模可观，在实现规模化制造前需要通过后续融资承担进一步稀释。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
