            body: >-
              投资人应抵制前沿 AI 硬件的动量定价。The Bot Company 的创始履历和融资能力虽非同寻常，但在没有可验证产品效用、商业毛利或单位经济的情况下，以 $2.0B 至 $3.94B
              估值投入成长股权，等同于未对冲的风险投资赌注。审慎的 TRACK 建议在功能验证出现前保留选择权。
