evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: revenue-conflict
    missingEvidence: >-
      Official financial statements, transaction-level revenue evidence, shipment counts, or management confirmation
      reconciling the US$16.6 million estimate with the zero-revenue characterization.
    whyItMatters: >-
      Revenue and shipments determine whether the company has commercial demand or remains in pre-launch product
      validation.
    diligencePath: >-
      Request management-certified revenue, order, cancellation, shipment, and cash-collection schedules with accounting
      definitions and periods.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Product-specific eligible-household counts, launch geography, willingness-to-pay research, replacement cycle,
      subscription attach, conversion assumptions, and production capacity.
    whyItMatters: >-
      Without these denominators and operating constraints, a bottom-up SAM or SOM would be invented rather than
      evidence-based.
    diligencePath: >-
      Obtain management's market model and underlying survey microdata, then reconcile it to launch capacity, pricing,
      and channel plans.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Official list price, hardware gross-margin bridge, subscription terms, warranty reserve, and service-cost
      assumptions.
    whyItMatters: The reported sub-US$10,000 positioning cannot establish affordability, payback, or viable unit economics.
    diligencePath: >-
      Request a priced bill of materials, contract-manufacturing quotes, launch packaging, warranty policy, and
      cohort-level support assumptions.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing-and-packaging
    missingEvidence: >-
      Comparable list prices, realized pilot prices, contract duration, warranty, service, software, teleoperation, and
      replacement terms for The Bot Company and named alternatives.
    whyItMatters: >-
      Without a common price and entitlement basis, buyer ROI, willingness to switch, and competitive affordability
      cannot be compared.
    diligencePath: >-
      Request current price sheets and anonymized executed pilot contracts, then obtain matching public or quoted offers
      from named alternatives.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: capability-benchmarks
    missingEvidence: >-
      Independent, like-for-like household task-success, cycle-time, intervention, damage, uptime, and safety
      benchmarks.
    whyItMatters: >-
      The form-factor thesis cannot establish product advantage or moat durability without comparable performance under
      varied home conditions.
    diligencePath: >-
      Commission a consent-based third-party trial using a fixed household task set and publish denominators, failure
      modes, and intervention rates.
    relatedQuestionRefs:
      - QP002
      - QP009
    relatedTableRefs:
      - TP002
  - type: enumeration-incomplete
    severity: material
    topic: competitor-landscape
    missingEvidence: >-
      A current independent market map with competitor funding, shipped units, named customers, pricing, channel
      coverage, and product status.
    whyItMatters: >-
      SetterVC expressly labels its competitor list illustrative and potentially incomplete, stale, or erroneous, so the
      present enumeration cannot establish market coverage.
    diligencePath: >-
      Build an independently sourced category-by-category census and verify each company through current product,
      customer, funding, and channel evidence.
    relatedQuestionRefs:
      - QP001
      - QP003
    relatedTableRefs:
      - TP001
  - type: conflicting-data
    severity: material
    topic: revenue-estimates
    missingEvidence: >-
