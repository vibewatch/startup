- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - TrueMoney solution
  - Measurable benefit
  - Limitation
  rows:
  - - Daily consumer payments
    - Top up, pay bills, shop online or offline, send money
    - Wallet shell plus linked payment rails inside the app
    - One shell across daily payment jobs and pay-abroad use cases
    - No public DAU, frequency, or payment-rail mix
  - - Migrant-worker onboarding in Thailand
    - Register with passport, localize language, move money home
    - Foreigner wallet with Burmese UI and support-tiered limits
    - Remittance becomes app-native instead of branch-only
    - No official user count by corridor beyond Burmese-worker TAM claim
  - - Cross-border remittance exception handling
    - Track status, resolve review or rejection, recover funds
    - Support articles for delayed, failed, and in-progress overseas transfers
    - Clear wallet-refund logic and status vocabulary
    - No public completion SLA or dispute-resolution rate
  - - Instant short-term financing
    - Apply for pay-later line and use at merchants or as cash-out
    - Pay Next / Pay Next Extra inside TrueMoney
    - Five-minute decision and long-tenor marketing reduce friction
    - No disclosed approval, default, or NPL metrics
  - - Offline merchant acceptance
    - Receive digital payments without card-acquirer complexity
    - QR, app scanner, EDC, POS, and payment-link options
    - Matches merchant size and footprint to acceptance method
    - PocketPay/SoundPay naming and install base are not publicly evidenced
  - - Online merchant checkout
    - Add TrueMoney as a local payment method on web or app
    - Gateway integration or direct API integration
    - Partner-gateway path accelerates time to market
    - Direct access is slower and gated by volume / approval
  - - Merchant growth and disbursement
    - Keep customers, push offers, send wallet payouts
    - ShopReward+, ShopDeals, Ads, Payouts, Gift Card
    - Adds CRM and batch/API money movement around payments
    - No public pricing or attach-rate disclosure by module
  - - Support and security recovery
    - Get help, update app, reduce fraud exposure
    - 24/7 live chat, hotline, 9777 reporting, secure-use guidance
    - Support is documented and anti-scam tooling is visible
    - No public incident dashboard or support-resolution KPI
  notes: Benefits are workflow-visible from official pages and support docs. Limitations reflect missing public telemetry rather than product failure.
