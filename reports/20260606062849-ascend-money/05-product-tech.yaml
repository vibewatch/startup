tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Core wallet and payment shell
    - Thai retail users
    - Mature / core
    - One app covers top-up, bills, P2P transfer, in-store and online checkout, and pay-abroad use cases
    - Need active-user mix, payment volume by rail, and retention by cohort
  - - Foreigner wallet and migrant onboarding
    - Foreign workers, expats, cross-border households
    - Live / differentiated
    - Burmese localization plus passport-based verification and explicit foreigner limits are unusual for local wallets
    - Need official MAU, nationality mix, and corridor-level retention
  - - In-app remittance to Myanmar and Cambodia
    - Migrant workers sending money home
    - Operational
    - App-native remittance replaces physical transfer-point dependency and can run fee-free on selected corridor flows
    - Need corridor GMV, completion rates, compliance-review rate, and pricing sustainability
  - - Pay Next / Pay Next Extra
    - Consumers seeking short-term liquidity or installment spend
    - Scaled / active
    - BNPL and revolving credit sit inside the same wallet rather than a separate lender app
    - Need approval rates, loss curves, repeat-borrow rates, and partner-bank economics
  - - Ascend Nano lending engine
    - Underserved consumers and SME owners
    - Operational but opaque
    - Alternative-data underwriting broadens access beyond traditional credit-score users
    - Need underwriting logic, delinquency buckets, and collection performance
  - - Wealth and investment distribution
    - Retail savers and first-time investors
    - Live but KPI-light
    - Mutual funds and savings surfaces are distributed through a mass wallet instead of standalone wealth software
    - Need AUM, funded-account count, partner economics, and investor activity
  - - Insurance distribution
    - Retail protection buyers
    - Live but KPI-light
    - Travel, mobility, and health insurance are merchandised within the payments shell
    - Need policy count, attach rate, claims experience, and commission margin
  - - Merchant acceptance stack
    - SMEs, chains, booths, POS-led retailers
    - Scaled / operational
    - Supports QR, app scanning, EDC, POS, and payment-link collection with next-day settlement messaging
    - Need merchant segment mix, take rate, churn, and live device penetration
  - - Merchant growth stack
    - Brands, merchants, operations teams
    - Operational / upsell layer
    - CRM, e-vouchers, ads, payouts, and gift cards extend monetization beyond checkout
    - Need attach rate, ARPU by module, and ROI evidence beyond case studies
  - - Virtual-bank track
    - Underserved retail and SME customers
    - Approved / pre-launch
    - Regulatory approval gives a path to deeper account primacy and balance-sheet products
    - Need business plan, capital structure, launch scope, and readiness milestones
  notes: Rows distinguish product presence from disclosed operating proof. “KPI-light” means public pages show the workflow exists, but not enough adoption or economics data to underwrite it.
