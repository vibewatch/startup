  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: developer-traction
    missingEvidence: Public API call volume, active gateway-partner count, direct-versus-gateway merchant mix, and merchant integration conversion funnel.
    whyItMatters: Without technical-adoption metrics, it is impossible to tell whether the integration layer is compounding as a platform or merely enabling bespoke merchant contracts.
    diligencePath: Request partner-dashboard exports, API traffic history, active-integrator counts, and the share of online GMV routed via each gateway or direct integration path.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: fraud-efficacy
    missingEvidence: Fraud-loss rate, false-positive rate, manual-review volume, chargeback trend, and recovery performance for 3X Protection and partner fraud tooling.
    whyItMatters: Public controls sound credible, but investors still need evidence that the system is economically effective and does not create excessive customer friction.
    diligencePath: Request internal fraud dashboards, policy-change logs, loss cohorts by product, and before-versus-after performance for the Cyber Police and SHIELD initiatives.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: reliability-telemetry
    missingEvidence: Status page, uptime SLA, incident log, MTTR history, and service-availability metrics for wallet, merchant acceptance, and remittance.
    whyItMatters: Product breadth is less valuable if the operating platform cannot demonstrate resilience at scale, especially ahead of a virtual-bank launch.
    diligencePath: Request internal reliability scorecards, incident postmortems, current SLA commitments, and product-specific uptime history for the last 12 to 24 months.
    relatedQuestionRefs:
    - QE027
    relatedTableRefs:
    - TE004
    - TE005
  - type: missing-source
    severity: material
    topic: merchant-device-subbrands
    missingEvidence: Official launch pages, pricing cards, merchant count, device economics, and rollout geography for PocketPay and SoundPay.
    whyItMatters: The user brief specifically highlights these merchant-acceptance labels, but reviewed official Thai surfaces do not validate whether they are live, pilot, or just marketing shorthand.
    diligencePath: Ask management for primary launch materials, live merchant references, pricing, installed-base data, and current relationship to the QR, EDC, POS, and Tap to Pay stack.
    relatedQuestionRefs:
    - QE028
    relatedTableRefs:
    - TE001
    - TE005
  - type: private-evidence-only
    severity: material
    topic: module-kpis
    missingEvidence: AUM, funded-account count, insurance policy count, merchant add-on attach rate, BNPL activation, and product-level revenue contribution for non-payment modules.
    whyItMatters: The platform story depends on cross-sell depth and monetization outside raw payment acceptance, but public sources do not quantify those modules.
    diligencePath: Request product P&Ls, active-account counts by module, attach-rate cohorts, and management dashboards covering wealth, insurance, CRM, ads, and payouts.
    relatedQuestionRefs:
    - QE029
    relatedTableRefs:
    - TE001
    - TE005
