- id: architecture-integration-and-developer-signal
  title: Architecture, Integration, and Developer Signal
  body: |-
    Ascend Money does not publish a full internal stack diagram, but its merchant and technical surfaces reveal a fairly specific public operating model. Customer identity is tiered through KYC and foreigner-specific limits; payment acceptance spans QR, EDC, POS, payment link, and NFC; online checkout can be routed through partner gateways or direct APIs; and partner documentation shows TrueMoney relying on redirect, QR, webhook, callback, and credentialed token-exchange patterns rather than on card-on-file style autonomy. Omise documents an offline QR flow with `charge.create` and `charge.complete` webhooks, Xendit describes a redirect-only THB flow with instant settlement and no recurring support, ECOMMPAY documents intermediate and final callbacks, and Payrails treats TrueMoney as a single-use redirect method returned through success/error URLs. [CE025][CE026][CE027][CE041][CE042][CE043][CE044][CE045]

    Public developer signal exists, but it is narrow and permissioned. The strongest direct signal is a public GitHub repository for TrueMoney KH online-payment integration, which exposes staging endpoints, merchant client credentials, token issuance, RSA-SHA256 request signing, and a payment webview flow. Combined with the official Thai online-merchant program, that suggests Ascend Money can support structured partner onboarding and secure merchant integration, but it does not look like a fully open, self-serve developer platform. The product-tech conclusion is that the company has a real integration layer and enough public technical specificity to support merchant deployment, yet still withholds the metrics that would tell an investor whether this layer is compounding through developer adoption or just enabling contract-by-contract integrations. [CE046][CE047][CE053][CE054]
