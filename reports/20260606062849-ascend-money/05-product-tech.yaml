- id: trust-security-privacy-and-support
  title: Trust, Security, Privacy, and Support
  body: |-
    Public trust controls are stronger than public runtime detail. TrueMoney’s English and Thai support pages say identity verification is mandatory by law, collect personal information needed for KYC, and support both document capture and face-recognition steps. For foreigners, the support center discloses wallet and transaction limits by verification tier, which is useful because it shows the product is operating inside explicit compliance guardrails rather than through an ad hoc workaround for migrants. On fraud and account security, the Thai support center says TrueMoney operates under oversight from the Bank of Thailand, the Thai SEC, and AMLO, uses advanced risk intelligence, and runs a 3X Protection stack built on AI and big-data engineering to detect abnormal transactions, suspicious logins, and unauthorized use. [CE010][CE011][CE012][CE037][CE038]

    External and adjacent-company sources reinforce that positioning. True Corp’s March 2025 cybercrime announcement describes 9777 scam reporting, SFTP data-sharing with Cyber Police, and AI-based call/SMS filters, while SHIELD’s case study adds device-intelligence controls for accessibility abuse, screen sharing, fake accounts, and promo abuse. Customer support is visible and operationally relevant: hotline 1240, 24/7 live chat, user guidance on app updates and permissions, and structured articles for delayed or failed remittances. The main caveat is that privacy and product-quality signals are mixed. Apple’s listing shows broad linked-data and tracking disclosures, and its US storefront rating is merely 3.4/5, which is not catastrophic but also not the rating profile of an obviously frictionless super-app at this scale. [CE032][CE034][CE035][CE036][CE039][CE040]
