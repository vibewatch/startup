  topStrengths:
    - >-
      TrueMoney is already scaled in Thailand, with public evidence for about 30 million active Thai users plus 50
      million-plus regional customers.
    - >-
      Strategic sponsorship is unusually strong for a private fintech, spanning CP Group, Ant Group, Bow Wave, and MUFG
      or Krungsri support.
    - >-
      Product breadth goes well beyond a wallet into remittance, lending, BNPL, wealth, insurance, merchant tools, and
      now virtual-bank optionality.
    - >-
      Thailand virtual-bank approval creates a real path to deepen deposits, credit, and everyday-finance relationships
      if execution is disciplined.
  topRisks:
    - >-
      Public standalone revenue, gross profit, reserve policy, cap-table terms, and current valuation remain
      undisclosed.
    - The virtual-bank buildout adds capital, licensing, governance, and execution risk before profitability is proven.
    - Lending and BNPL exposure create real credit and collections risk, while public loan-loss detail remains sparse.
    - >-
      Fraud, scam prevention, and KYC friction can simultaneously raise costs and damage customer trust in a high-risk
      payments environment.
    - >-
      Myanmar and wider cross-border operations add sanctions, AML, and jurisdiction-fragmentation risk beyond a simple
      Thailand wallet thesis.
  unresolvedGaps:
    - Audited current revenue, gross profit, and reserve-policy disclosure.
    - Current cap table, liquidation preferences, and any structured rights from prior rounds.
    - Entity-by-entity licence, capital, and readiness pack for the virtual-bank launch.
    - Cohort retention, active-merchant, and concentration data across customers and partners.
    - Loan-vintage, charge-off, and funding-mix detail for lending and BNPL products.
