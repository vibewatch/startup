- calloutType: assumption
  title: Underbanked credit expands TAM but not automatically valuation quality
  body: Ascend’s strongest adjacency is underbanked consumer and SME credit, yet that expansion comes with higher funding, compliance, and loss-risk requirements than pure payments. The market is larger when lending is included, but the quality of that TAM depends on underwriting and capital discipline rather than download counts alone.
