  title: Disclosure mismatch makes penetration math fragile
  body: Public materials do not reconcile 6-country versus 7-country scope or 28M, 30M, and 32M Thailand-user counts. Investor models should therefore treat penetration as a range and ask management to bridge registered, active, and transacting users before inferring market share.
