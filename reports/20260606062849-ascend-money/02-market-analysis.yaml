- calloutType: insight
  title: PromptPay is both enabler and substitute
  body: Thailand’s digital-payments growth helps Ascend because it habituates consumers to QR and instant transfers, but the same A2A infrastructure also strengthens bank-led substitutes. Wallet growth can therefore outpace wallet economics if users increasingly transact on rails that Ascend does not fully own.
