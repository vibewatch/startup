company:
  name: Ascend Money
chapter:
  number: 2
  title: Market Analysis
  summary: 'Ascend Money sits inside a large but fuzzy market boundary: Thailand’s fast-growing retail digital payments rails, extended by cross-border QR, remittance, and underbanked credit adjacencies across Southeast Asia. Public evidence supports scale—Thailand had 71.7 million people, roughly 65.1 million internet users, January 2026 PromptPay value of THB 4.9 trillion, and a Southeast Asia digital economy above US$300 billion GMV in 2025—but public disclosures conflict on whether Ascend serves six or seven countries and whether TrueMoney has 28 million, 30 million, or 32 million Thailand users. The market is real; precise SAM and SOM remain constrained by undisclosed GTV, MAU, merchant activity, and take-rate data.'
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary, Included Spend, Excluded Spend, and Status-Quo Substitutes
  body: 'The market Ascend Money actually attacks is narrower than “all financial services” but broader than a single Thai e-wallet. Official product pages show TrueMoney spanning domestic wallet functions—top-ups, bills, online and in-store checkout, transfers, PromptPay scan pay, cross-border payments, remittance, loans, savings, mutual funds, and insurance. In practical terms, the core boundary is Thailand retail digital payments and stored-value wallet activity, with cross-border QR and remittance corridors as extensions and lending, insurance, and wealth as monetization adjacencies layered on top of the wallet. The exclusions matter. BOT’s systemwide e-payment tables are useful macro ceilings, but they also include bank-led rails and flows that do not map cleanly to TrueMoney wallet economics. Status-quo substitutes are also broader than cash: bank-app A2A via PromptPay, online banking, cards, and OTC or agent networks all solve parts of the same consumer job. The official company framing
    is internally fuzzy as well. Ascend’s own pages emphasize six countries, over 50 million users or customers, and 21 million regional e-wallet users, while later PR and press language shifts to seven countries. That disclosure drift means the market boundary must be defined by use case and rail, not by a single unstable corporate headline metric.'
