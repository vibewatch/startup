  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: disclosure-metric-conflict
    missingEvidence: A dated bridge among countries served, users, active users, e-wallet users, and customers across Ascend Money disclosures and later press coverage.
    whyItMatters: Penetration, TAM framing, and regional rollout complexity all change materially depending on whether the correct denominator is 6 or 7 countries and 21M, 28M, 30M, 32M, or 50M people.
    diligencePath: Request a management KPI glossary and a dated operating-footprint table that reconciles website, press-release, and investor metrics by geography and definition.
    relatedQuestionRefs:
    - QM023
    - QM024
    - QM025
    - QM026
    - QM027
    relatedTableRefs:
    - TM005
  - type: private-evidence-only
    severity: material
    topic: gtv-mau-take-rate
    missingEvidence: Thailand and regional GTV, monthly active users, active merchants, and take-rate disclosure for TrueMoney and adjacent lending or BNPL products.
    whyItMatters: Without monetization metrics, public SOM can only be expressed as a user-surface range rather than as a revenue-bearing market share estimate.
    diligencePath: Request investor KPI packs or management reporting that bridge annual GTV, MAU, merchant activity, revenue, and take rate for Thailand versus regional operations.
    relatedQuestionRefs:
    - QM024
    - QM027
    relatedTableRefs:
    - TM002
    - TM005
  - type: missing-source
    severity: material
    topic: remittance-market-size
    missingEvidence: Company-specific remittance volume, sender count, and corridor share for Thailand-linked TrueMoney transfers.
    whyItMatters: Public evidence proves corridor availability and travel-wallet reach, but not the dollar contribution of remittance to Ascend’s addressable market or revenue mix.
    diligencePath: Request corridor-level transfer volumes and fee rates for Myanmar and Cambodia, then reconcile them to official external-sector or partner-bank data.
    relatedQuestionRefs:
    - QM023
    - QM027
    relatedTableRefs:
    - TM001
    - TM005
  - type: missing-source
    severity: material
    topic: merchant-activity
    missingEvidence: Current active merchant counts split between large retail chains, SMEs, QR merchants, and transaction-active acceptance points.
    whyItMatters: Agent counts, named merchants, and retailer logos do not tell an investor how frequently the wallet is actually accepted or used at checkout.
    diligencePath: Request active merchant, active QR, and merchant-frequency metrics by segment, then compare them against official Thai SME statistics and payment-acceptance data.
    relatedQuestionRefs:
    - QM021
    - QM027
    relatedTableRefs:
    - TM003
    - TM005
