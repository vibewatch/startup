- id: TM003
  title: Buyer / User / Payer Segment Map
  columns:
  - Segment
  - Buyer
  - Primary user
  - Payer / budget owner
  - Adoption trigger
  - Path to monetization
  rows:
  - - Thai mass consumer
    - Individual household decision-maker
    - Thai resident using wallet for daily payments
    - Household cash flow
    - Bills, retail acceptance, convenience, and P2P transfers
    - Payments frequency first, then insurance, savings, and credit cross-sell.
  - - Tourist or foreign resident in Thailand
    - Individual traveler or expat
    - Wallet holder needing local acceptance and FX
    - Travel budget or personal spending budget
    - Cross-border QR convenience and major-merchant acceptance
    - FX-linked wallet usage, travel spend, and retained domestic use.
  - - Remittance sender or receiver household
    - Sender in Thailand or connected market
    - Sender plus receiving family member
    - Salary or household remittance budget
    - Fast and trusted transfer to Myanmar or Cambodia, or linked corridor transfer
    - Transfer fees, balance retention, and later wallet services.
  - - SME merchant or micro-merchant
    - Owner-manager
    - Shop staff and customers at checkout
    - Operating cash collections budget
    - Lower cash handling, acceptance at SME stores, and link to retail ecosystem
    - Merchant acceptance, collections, and working-capital cross-sell.
  - - First-time borrower or underbanked microbusiness
    - Borrower or microbusiness owner
    - Borrower using digital loan or BNPL product
    - Household emergency budget or business working capital
    - Alternative-data underwriting when no traditional score exists
    - Higher-margin lending but with higher risk and capital needs.
  - - Large merchant or platform partner
    - Commerce or finance team
    - End customer using checkout option
    - Merchant payments-stack budget
    - Need to support local APM mix such as TrueMoney, PromptPay, and online banking
    - Acceptance fees, ecosystem bargaining power, and distribution scale.
  notes: Segments distinguish buyer, user, and payer because Ascend spans consumer payments, merchant acceptance, cross-border travel, remittance, and underbanked credit. Budget ownership affects both adoption timing and monetization quality.
