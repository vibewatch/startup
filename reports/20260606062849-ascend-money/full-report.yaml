  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Consumer scale and segmentation
        blocks:
          - type: paragraph
            body: >-
              Ascend Money's public customer evidence is strongest on reach and day-to-day consumer utility, not on
              revenue mix. Official Ascend surfaces still anchor on more than 50 million customers across six countries
              and 88,000 agents, while MUFG's 2024 investment release cites 30 million active users in Thailand. Older
              but still useful public interviews add more color: Bangkok Post reported 27 million users, 17 million
              active users, 7 million payment points, and a user base led by Gen Y. Apple and Google app-store pages
              then widen the functional picture beyond simple wallet storage into bills, top-ups, online and offline
              purchases, savings, insurance, investment, and SME enablement.


              The segmentation that emerges is therefore consumer-heavy but not consumer-only. Public materials clearly
              show retail wallet users, commuters and shoppers, migrant remitters, agent-merchants, online and offline
              merchants, and SMEs using adjacent services. What remains missing is the denominator behind each cohort.
              Management-grade disclosure does not separate individual consumers from businesses, does not reconcile the
              various active-user numbers under one definition, and does not show how much of the network is driven by
              flagship merchants versus the long tail.
