  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Ascend Money competes in a Thai payments market where the hardest rival is often not a standalone wallet
              at all. TrueMoney remains a serious regional consumer fintech platform: Ascend Money still claims 50
              million users and customers served across six countries, 21 million e-wallet users, and an 88,000-agent
              network, while the TrueMoney service menu reaches from bill pay, retail checkout, and PromptPay scan-pay
              to remittance and cross-border usage. But Thailand's payments stack is unusually open and bank-linked. IMF
              analysis and recent Thai reporting both point to PromptPay as the national low-cost, real-time backbone,
              with more than 90 million registrations and more than 74 million daily transactions by mid-2025. K PLUS,
              SCB EASY, and Krungthai NEXT already let users solve many wallet jobs directly inside bank apps, which
              means consumers do not need to leave incumbent rails to pay bills, move money, or scan QR.

              That structure changes what should count as a competitor. Direct peers still include GrabPay, LINE Pay
              Thailand, and ShopeePay, because each tries to own payment moments inside a larger consumer ecosystem. Yet
              the more important competitive picture also includes bank apps, cash and cards as status quo substitutes,
              and the two non-Ascend virtual-bank consortia that the Bank of Thailand approved in 2025. Regional
              benchmarks matter because they show where wallet competition is heading: Grab has already layered deposits
              and lending on top of super-app traffic; Sea's Monee is scaling payments and credit through Shopee's buyer
              and seller base; GoPay, DANA, and OVO illustrate how interoperable QR rails push competition toward
              lending, rewards, and convenience rather than exclusive acceptance.
