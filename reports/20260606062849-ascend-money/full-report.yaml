      - number: '5.2'
        title: Merchant Acceptance and Business Stack
        blocks:
          - type: paragraph
            body: >-
              Official Thai merchant pages show that TrueMoney’s business product is materially broader than simple QR
              acceptance. The merchant-wallet program claims more than 300,000 merchants nationwide and supports
              multiple operating modes: static or app-led QR, EDC-based scanning, POS-linked scanning, and payment links
              for digital collection. The same pages add operating details that matter for diligence: next-business-day
              settlement on certain flows, web-portal and app notifications, real-time sales reporting, and fee-free
              acceptance positioning. In practice, that means Ascend Money is selling merchants not just a way to
              receive wallet payments, but a cash-handling and reporting workflow that can fit stall operators, booths,
              storefronts, and larger POS-enabled chains. [CE017][CE018][CE019][CE020]


              The merchant-growth layer goes further. TrueMoney for Business packages CRM, couponing, e-vouchers, media
              inventory, batch and API payouts, and gift cards around the payment core, with case studies claiming sales
              or member-retention lifts at named chains. Online merchant onboarding is also explicit about trade-offs:
              merchants can integrate through a partner gateway in roughly 14–30 days or pursue a slower direct API path
              that is reserved for higher-volume sellers. This points to a deliberate operating model: keep broad
              merchant acquisition easy through pre-approved partners while preserving tighter control over direct
              connectivity. One gap is that the reviewed official surfaces did not expose dedicated PocketPay or
              SoundPay pages, pricing, or merchant-footprint data, so those product names should be treated as
              unverified sub-brand claims until management shares primary evidence.
              [CE021][CE022][CE023][CE024][CE025][CE026][CE027][CE052]
