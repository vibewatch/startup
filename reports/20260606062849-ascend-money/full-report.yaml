    title: Market Definition Table
    columns:
      - Boundary slice
      - Included spend / activity
      - Excluded spend / activity
      - Status-quo substitute
      - Why it matters to Ascend Money
    rows:
      - - Domestic wallet utility
        - Top-up, bills, P2P transfer, online checkout, in-store scan pay, and PromptPay-linked wallet behavior
        - Wholesale treasury, branch banking, and non-digital cash handling
        - Cash, bank apps, and online banking
        - This is the highest-frequency usage layer and the foundation for retention and cross-sell.
      - - Merchant checkout and QR acceptance
        - Retail stores, SME stores, food delivery, e-commerce, and merchant QR or PromptPay scan pay
        - Generic card acquiring economics with no wallet relationship
        - Cards, bank-transfer checkout, and cash-on-delivery
        - Merchant acceptance determines whether TrueMoney becomes a habit or a one-off utility app.
      - - Cross-border travel wallet
        - Travel wallet acceptance and FX-enabled QR payments through Alipay+ and similar links
        - Traditional card FX spend and travel financing outside the wallet
        - Cash exchange and cards
        - Cross-border usage expands the wallet beyond domestic retail and helps frequency for affluent travelers.
      - - Remittance corridor flows
        - Wallet-linked transfer from Thailand to Myanmar and Cambodia and other linked corridor flows
        - All Thailand remittance volume not routed through TrueMoney
        - OTC remittance counters, bank wire, and informal agents
        - >-
          This adjacency matches Ascend’s inclusion narrative but public company-specific dollar volume is not
          disclosed.
      - - Underbanked credit and BNPL adjacency
        - >-
          Nano finance, personal loans, SME credit, BNPL, insurance, savings, and mutual funds accessed from wallet
          relationships
        - Full bank balance-sheet products unrelated to wallet distribution
        - Pawnshops, informal lenders, banks, and card instalments
        - These products are the margin pool above payments, but they add capital intensity and underwriting risk.
      - - Excluded high-value or non-wallet rails
        - None beyond ceiling-setting context
        - BAHTNET and broad bank-led e-payment flows that exceed retail wallet economics
        - Institutional settlement and bank transfer systems
        - Useful as macro context, but not a clean denominator for Ascend market share.
    notes: >-
      Boundary logic uses official Ascend and TrueMoney product pages plus BOT and Worldpay category framing. Excluded
      rows mark macro rails or substitute channels that solve part of the same user job but are not clean wallet-revenue
      pools.
