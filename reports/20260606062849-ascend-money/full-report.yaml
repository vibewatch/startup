      - number: '1.3'
        title: Funding History, Ownership Signals, and Cover Metrics
        blocks:
          - type: paragraph
            body: >-
              The 2021 unicorn round remains the clearest public valuation benchmark. Official and TechCrunch reporting
              agree that Ascend Money raised $150 million in September 2021 at a $1.5 billion valuation, with CP Group,
              Ant Group, and Bow Wave Capital Management named as investors. The next large disclosed capital event came
              in June 2024, when MUFG Bank and the Finnoventure Private Equity Trust I fund managed by Krungsri
              Finnovate invested a combined $195 million. Multiple sources corroborate that this deal added strategic
              banking backing and reaffirmed CP Group, Ant Group, and Bow Wave as existing investors. What the 2024
              round did not do is publish a new valuation, leaving the 2021 $1.5 billion mark as the last disclosed
              public pricing point.

              That gap matters because the company is clearly large but still under-disclosed on underwriter-grade
              metrics. Publicly surfaced disclosed capital sums to at least $345 million from the 2021 and 2024 rounds
              alone, but the reviewed corpus did not disclose secondary transactions, warehouse lines, or holdco debt.
              Cover metrics are similarly uneven. Thailand user metrics have moved from 30 million annual active users
              at the end of 2023 to around 32 million active customers in later 2024 coverage, while the regional
              corporate narrative still leans on 50 million-plus customers, 88,000 agents, and $14 billion of processed
              payment volume. Public sources mention 2023 profitability, yet none of the reviewed materials discloses
              standalone revenue, run-rate, or total headcount. For chapter-one purposes, the company is clearly scaled
              and financed, but it remains only partially underwritten from a financial-disclosure standpoint.
