      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Several forces still expand the market. Thailand’s high internet penetration lowers basic onboarding
              friction. PromptPay and QR interoperability condition users to expect fast, cheap, mobile payments, while
              BOT’s cross-border program extends that habit to travel and migrant corridors. Regional policy momentum is
              real: e-Conomy says all ASEAN-10 markets now have national QR systems and eight already interoperate
              cross-border; digital financial services also captured roughly half of regional private funding in the
              last year. For Ascend specifically, virtual-bank approval can widen product scope and funding access for
              underserved customers. But the same forces also constrain monetization. When A2A is the leading method and
              only 25% of Thai wallets are card-funded, wallet growth rides on bank-led rails that may compress take
              rate. Regulation is fragmented across countries and getting stricter at home: BOT has a formal
              virtual-bank regime and designated-payment-service rules that matter for stored-value operators.
              Cross-border growth adds licensing and compliance work, not just extra volume. Finally, moving from
              payments into first-time-borrower credit raises capital intensity, underwriting, and trust-risk
              requirements. Thailand’s digital payments market is clearly growing, but the easiest adoption tailwinds
              come with harder revenue-capture and compliance trade-offs.
            claimRefs:
