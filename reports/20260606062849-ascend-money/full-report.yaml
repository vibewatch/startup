      - number: '3.3'
        title: Switching Costs, Multi-Homing, and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              TrueMoney's strongest defense is distribution, not exclusivity. Ascend Money's own public materials still
              point to 88,000 agents, 21 million e-wallet users, and meaningful cross-border and remittance use cases
              that connect Thailand to Myanmar and Cambodia. Those attributes matter because they solve real offline
              problems: cash in, cash out, merchant reach, and international value transfer. They also help TrueMoney in
              segments where cash is still sticky and formal banking penetration is incomplete. But the evidence also
              says user lock-in is softer than headline wallet scale might suggest. GrabPay explicitly supports top up
              from major Thai bank apps and free transfers; GoPay markets free transfers and QRIS ubiquity; KBZPay does
              the same in Myanmar; and Thailand's own PromptPay infrastructure means many consumers can move money or
              pay merchants without being trapped inside one closed loop.

              In practice that makes multi-homing rational. Consumers can keep a bank app for salary and transfers, a
              wallet for promotions or specific merchants, and another wallet for travel, remittance, or credit.
              Merchant-side switching costs are somewhat stickier because payment choice becomes tied to acquiring,
              checkout tools, and ecosystem traffic. That is why Maya's merchant-acquiring leadership is such an
              important benchmark and why GrabPay, LINE Pay Thailand, and ShopeePay remain dangerous even without clean
              Thailand-specific wallet share disclosures. They each bring a broader workflow around the payment button.
              The implication for Ascend Money is that wallet habit alone is not enough; the platform has to own the
              adjacent workflow, or competitors can coexist alongside it without forcing an either-or decision from
              users.
