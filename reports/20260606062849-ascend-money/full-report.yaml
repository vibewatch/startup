      - number: '6.3'
        title: Durability, satisfaction, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              Durability is where the public record becomes thin. The positive side is visible: Apple's App Store showed
              a 4.0 rating from 68,000 ratings, and the historical 17 million active-user figure implies real repeat use
              rather than a purely installed base. But the public record does not disclose NRR, GRR, churn, retention
              cohorts, or active-merchant rates. That means there is no clean way to convert the large registered or
              active-user headlines into an underwriting-grade view of renewal quality.


              Adverse signals are present and should not be hand-waved away. JustUseApp's 2026 review surface is clearly
              skeptical, combining a 3.4/5 app-store average across 272 analysed reviews with very low safety and
              legitimacy scores. For foreigners and other marginal users, friction also remains visible in public
              guides: passport or work-permit checks, Thai SIM requirements, and identity verification delays of up to
              one to three business days. Google Play shows a 24/7 call center and in-app chat, but no SLA,
              first-contact resolution rate, or complaint trend data. SHIELD's case study then makes the trust issue
              operational, showing that account takeover, fake-account creation, and promo abuse are core retention
              threats, not hypothetical edge cases.
