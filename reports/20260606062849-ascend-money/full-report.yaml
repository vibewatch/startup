  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation stays conservative because credible scale and sponsorship still meet thin price discovery and
      unresolved economics.
    data:
      nodes:
        - label: |-
            Scale proof
            30M active Thai users in 2023; 32M Thailand users cited in 2025; 50M+ regional customers
        - label: |-
            Strategic validation
            2024 MUFG and Krungsri investment of $195M
        - label: |-
            Optionality
            Virtual-bank approval plus lending and BNPL cross-sell potential
        - label: |-
            Disclosure gap
            No disclosed 2024 reprice, no audited public revenue or gross profit, no cap-table terms
        - label: |-
            Comp reality
            Payments medians cluster far below premium outliers unless economics are proven
        - label: |-
            Call today
            research-more | medium confidence | high risk | stretched above ~$1.5B
    approximationNotes: This is a qualitative logic chain from retained evidence to recommendation rather than a weighted decision model.
