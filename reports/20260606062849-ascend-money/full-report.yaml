      - number: '2.2'
        title: Evidence-Constrained Sizing Using Multiple Lenses
        blocks:
          - type: paragraph
            body: >-
              Public sources support a large market, but only through multiple imperfect lenses. The population lens
              starts with Thailand’s 71.7 million people and roughly 65.1 million internet users in 2024. The observed
              reach lens is narrower: public disclosures place TrueMoney’s Thailand user base somewhere between 28
              million and 32 million, while official regional disclosures span 21 million e-wallet users to over 50
              million users or customers. The rail lens is larger again. In January 2026, BOT reported 2.478 billion
              PromptPay transactions worth THB 4.896 trillion, 493 million e-money transactions worth THB 362 billion,
              and 4.243 billion total e-payment transactions worth THB 48.633 trillion. Those rail totals are too broad
              to equate to wallet-revenue TAM, but they prove that digital-payment behavior in Thailand is already mass
              scale. The regional ceiling is broader still: Bain and Google project Southeast Asia’s digital economy at
              more than US$300 billion GMV in 2025, with national QR systems across ASEAN and cross-border
              interoperability in eight markets. The right conclusion is evidence-constrained TAM, SAM, and SOM: TAM is
              large and regional, SAM is the subset of Thai and neighboring wallet-addressable consumer and merchant
              flows, and SOM remains disclosure-bound because public sources do not reveal TrueMoney GTV, active
              merchants, or take rate.
