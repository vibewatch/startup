  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation stays research-more because the 2024 strategic round validated interest, not price
        blocks:
          - type: paragraph
            body: >-
              Public evidence makes Ascend Money strategically interesting but not yet cleanly investable at a premium
              price. The strongest disclosed private anchor is still the September 2021 Series C, when TechCrunch
              reported a $150 million raise at a $1.5 billion valuation. The June 2024 MUFG and Krungsri strategic round
              clearly validated institutional interest and disclosed a combined $195 million investment, yet neither the
              PR Newswire announcement nor MUFG’s own release published a new post-money mark. That matters because
              Ascend is no longer a simple wallet story: official materials describe 30 million active Thai users, broad
              lending, BNPL, investment, and insurance exposure, and a product surface built to cross-sell multiple
              financial tools. Those are real strengths, but price discipline still has to start from the last clean
              mark rather than from an undisclosed strategic round. On public evidence alone, the right call is
              research-more, with medium confidence and a stretched stance above $1.5 billion until audited economics
              and current market-clearing evidence appear.
            claimRefs:
