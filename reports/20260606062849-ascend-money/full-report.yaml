      - number: '2.5'
        title: Contradictions Preserved and Remaining Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The main diligence lesson is not that the market is small; it is that public sizing precision is poor.
              Official company pages describe a six-country network, 21 million regional e-wallet users, and over 50
              million users or customers, while June 2024 PR and press language switches to seven countries and roughly
              30 million Thailand active users, and a 2025 local-press report raises the Thailand figure to 32 million.
              Those numbers may all be true under different definitions, but public materials do not bridge registered
              users, active users, e-wallet users, customers, or countries served. The same problem appears in sizing.
              BOT’s rail statistics are strong evidence for digital-payment scale, yet they are too broad to equate
              directly to TrueMoney wallet revenue because they include bank-led A2A and other non-wallet flows.
              Cross-border and remittance adjacency is strategically important, but public sources prove corridor
              availability and travel-wallet reach more clearly than they prove company-specific dollar volume. Public
              SAM and SOM therefore need to be expressed as ranges and diligence asks, not single-point claims. Any
              model that treats one public user number or one rail-value figure as Ascend’s market-share base is
              overconfident.
