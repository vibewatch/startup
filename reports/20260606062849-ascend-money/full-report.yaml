      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Ascend Money’s buyer, user, and payer are not one person. For domestic Thai consumers, the user and payer
              are usually the same household member funding bills, shopping, food delivery, or P2P transfers. For
              tourists and foreign residents, the user is the wallet holder, but the adoption trigger is frictionless
              cross-border acceptance and FX conversion rather than domestic financial inclusion. For remittance
              corridors, the payer sits in Thailand while the receiving household sits abroad or vice versa; the job to
              be done is trusted transfer, not checkout conversion. For SME merchants, the economic buyer is the
              owner-manager who wants collections, lower cash handling, and customer acquisition; for larger merchants
              and platforms, the payer is a commerce or finance team selecting which local payment methods to support.
              The underbanked credit segment is different again: the user is a first-time borrower or small merchant,
              but the budget owner is household or microbusiness working capital. That distinction matters because
              Ascend’s own lending pitch depends on alternative data for people and SME owners without traditional
              credit scores, while the virtual-bank narrative is aimed at underserved people and small businesses.
              Adoption therefore progresses from utility payments and retail acceptance into cross-border use and, only
              later, into higher-margin credit or investment products.
