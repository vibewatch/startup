        - Request a dated market list with launch status, active operations, and revenue contribution by country.
      - - Thailand user count
        - June 2024 PR and press cluster around 30M active users
        - Bangkok Post Sep 2023 said 28M users; Nation Apr 2025 said 32M users
        - Thai penetration changes materially depending on which user denominator is used
        - Request a bridge among registered, monthly active, transacting, and annual active users by period.
      - - Regional reach metric
        - Official pages cite 21M e-wallet users and >50M users or customers
        - Public sources do not reconcile how the two numbers relate
        - Regional SAM can be overstated if customers, users, and wallet-actives are treated as identical
        - Request a metric glossary covering e-wallet users, customers, accounts, and actives.
      - - Merchant footprint
        - Company pages show 88,000 agents and named retail acceptance points
        - Readable public web evidence does not disclose current active merchant counts or transaction-active merchants
        - Merchant density drives frequency, but agent counts are not the same as active checkout acceptance
        - Request active merchant, active QR, and merchant transaction-frequency metrics by segment.
      - - GTV / take rate
        - Public web evidence shows market rails and user surfaces
        - No fetched source discloses TrueMoney GTV, MAU, active merchants, or wallet take rate
        - Without monetization data, public SOM can only be a range, not a single-point estimate
        - Request annual GTV, revenue by product, merchant count, and take-rate bridges for Thailand and region.
      - - Remittance size
        - Company evidence proves corridors and cross-border acceptance
        - Public web evidence does not tie corridor availability to company-specific dollar volume
        - Remittance may be strategic, but its quantitative contribution cannot yet be modeled cleanly
        - Request corridor-level volume, sender count, and fee-rate disclosures or partner data.
    notes: >-
      This register preserves public contradictions instead of resolving them by guesswork. It is intended as the
      modeling checklist before any investor translates public adoption signals into revenue or market-share
      assumptions.
