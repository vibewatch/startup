    Ascend Money is the Bangkok-based fintech platform behind TrueMoney and a set of adjacent businesses spanning
    digital payments, cross-border remittance, BNPL and lending, wealth, and insurance. Backed by CP Group, Ant Group,
    Bow Wave, and later MUFG/Krungsri capital, the company has scaled into one of Thailand's most important
    consumer-fintech franchises and is now preparing for a more regulated next phase through Thailand's virtual-bank
    framework. The strategic position is strong, but disclosure still lags what investors would want for premium
    underwriting.
