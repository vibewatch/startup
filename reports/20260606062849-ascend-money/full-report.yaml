  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, licensing, and jurisdictional risk
        blocks:
          - type: paragraph
            body: >-
              Ascend Money's biggest near-term risk is that virtual-bank approval has started a countdown, not finished
              underwriting. BOT's 19 June 2025 announcement says ACM Holding still must establish a public limited
              company, satisfy ministerial conditions, pass a readiness assessment, and begin operations within one
              year. The Ministry of Finance rules add hard pre-license obligations: at least Bt5 billion of paid-up
              capital before licensing, a path to Bt10 billion after the initial phase, consumer-protection and
              responsible-lending plans, and IT systems that can pass efficiency, security, and high-availability
              testing. This matters because Ascend is moving from e-money into a more heavily supervised balance-sheet
              business while the base payments stack still sits inside Thailand's Payment Systems Act and AML/KYC
              regime. TrueMoney's own terms underline that the wallet operator already treats itself as an e-money
              business subject to Thai AML, counter-terrorism, and proliferation-financing laws. The legal question for
              investors is therefore not whether Ascend can tell an inclusion story; it is whether management can clear
              a dense package of licensing, capital, governance, and conduct work without slipping the June 2026 clock
              or narrowing economics.
