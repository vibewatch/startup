    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      The largest value swings come from revenue quality, virtual-bank monetization, and whether public markets keep
      discounting regulated fintech risk.
    data:
      items:
        - label: Audited revenue and gross profit prove stronger than opacity implies
          value: 0.45
        - label: Virtual-bank launch monetizes faster than deposit-led skeptics expect
          value: 0.25
        - label: Cap table is clean with limited preference drag
          value: 0.2
        - label: Official financing or secondary clear resets below the base case
          value: -0.45
        - label: Virtual-bank build remains loss-making for several years
          value: -0.25
        - label: Credit losses or regulatory cost prove worse than public signals
          value: -0.35
