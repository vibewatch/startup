      - number: '3.2'
        title: Direct Peers and Regional Benchmarks
        blocks:
          - type: paragraph
            body: >-
              The direct Thai wallet set is strategically diverse. GrabPay is the cleanest example of a super-app
              challenger because it is not just a stored-value button: the Thai product page ties payments to food,
              transport, express, mart, subscriptions, rewards, free bank transfers, and bank-app top-ups, while Grab's
              2025 results show a regional platform that crossed 50 million monthly transacting users and is already
              growing deposits and lending. LINE Pay Thailand matters for a different reason. The 2023 acquisition of
              Rabbit LINE Pay by LINE MAN Wongnai and LINE Thailand did not remove it from the market, but it did reduce
              its standalone ambition by folding the wallet more tightly into LINE, LINE MAN, Wongnai, BTS ticketing,
              AIS payments, and a very large merchant and rider base. ShopeePay is more commerce-linked still: Sea now
              frames Monee as a leading regional payments and financial services arm, and ShopeePay's own branding still
              anchors on online-shopping usage.

              Regional benchmarks add useful directionality even when they are not immediate Thai share competitors.
              GoPay shows how a wallet sitting on interoperable QRIS rails can still differentiate through free
              transfers, lending, and Sharia savings. DANA and OVO show other acquisition paths: DANA adds
              financial-services and business-payment tooling, while OVO leans into points, promotions, and merchant
              rewards. KBZPay is relevant because Ascend still has Myanmar exposure, and KBZPay demonstrates how
              bank-backed cash in/out, bill pay, and account linking stay powerful in cash-heavy markets. The
              Philippines provides the most instructive wallet-plus-bank benchmark. GCash still dominates wallet scale
              and merchant reach, but Maya has won meaningful ground in deposits, lending, and merchant acquiring. That
              split is a preview of the risk to TrueMoney if wallet ubiquity is not converted into deeper banking and
              merchant workflows quickly enough.
