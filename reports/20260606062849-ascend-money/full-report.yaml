  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, Excluded Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The market Ascend Money actually attacks is narrower than “all financial services” but broader than a
              single Thai e-wallet. Official product pages show TrueMoney spanning domestic wallet functions—top-ups,
              bills, online and in-store checkout, transfers, PromptPay scan pay, cross-border payments, remittance,
              loans, savings, mutual funds, and insurance. In practical terms, the core boundary is Thailand retail
              digital payments and stored-value wallet activity, with cross-border QR and remittance corridors as
              extensions and lending, insurance, and wealth as monetization adjacencies layered on top of the wallet.
              The exclusions matter. BOT’s systemwide e-payment tables are useful macro ceilings, but they also include
              bank-led rails and flows that do not map cleanly to TrueMoney wallet economics. Status-quo substitutes are
              also broader than cash: bank-app A2A via PromptPay, online banking, cards, and OTC or agent networks all
              solve parts of the same consumer job. The official company framing is internally fuzzy as well. Ascend’s
              own pages emphasize six countries, over 50 million users or customers, and 21 million regional e-wallet
              users, while later PR and press language shifts to seven countries. That disclosure drift means the market
              boundary must be defined by use case and rail, not by a single unstable corporate headline metric.
            claimRefs:
