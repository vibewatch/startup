chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Platform, and Regional Footprint
        blocks:
          - type: paragraph
            body: >-
              Ascend Money should be understood as a late-stage private fintech platform rather than a single-product
              wallet company. Official company and affiliate materials trace the business to 2013, place the main
              Thailand office at 101 True Digital Park in Bangkok, and describe a model built around digital payments,
              lending, wealth, insurance, and agent-enabled cash-in, cash-out, and remittance rails. The public brand
              stack is consistent across the corporate and service pages: TrueMoney is the customer-facing payments and
              wallet layer, Ascend Nano covers lending, Ascend Wealth covers investment and savings products, and Ascend
              Assurance handles insurance distribution. The stage is best described as late-stage private / unicorn with
              IPO ambition but no filed prospectus or public listing as of the run date.

              Scale claims are strong but not perfectly internally consistent. The official home and service pages still
              anchor on more than 50 million users or customers, 21 million e-wallet users, 88,000 agents, and $14
              billion processed across the region, while 2024 and 2025 Thailand-focused reporting shifts to 30-32
              million active customers or users in Thailand alone. Geography is similarly messy: the main corporate
              pages repeatedly enumerate six countries — Thailand, Myanmar, Cambodia, Indonesia, Vietnam, and the
              Philippines — but the contact page lists a Malaysia office and both affiliate and Malaysia-brand pages
              imply a seventh-country footprint. The chapter therefore treats the six-country list as the core
              consistently repeated operating claim, while flagging Malaysia as a real but scope-unclear additional
              foothold rather than assuming full parity with the six named markets.
