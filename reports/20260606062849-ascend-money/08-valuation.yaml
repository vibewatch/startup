tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - dimension
  - assessment
  - key driver
  - what would change it
  rows:
  - - recommendation
    - research-more
    - The company looks strategically valuable, but the price is not underwritten by disclosed economics or a fresh public mark.
    - Move toward track only if audited economics arrive and entry price stays inside the base-case band.
  - - confidence
    - medium
    - Scale, sponsorship, and regulatory optionality are real, but the core underwriting record is still incomplete.
    - Upgrade confidence if audited revenue, gross profit, and virtual-bank readiness metrics are disclosed.
  - - risk rating
    - high
    - Lending, regulation, and execution all matter to common-equity outcomes, while cap-table terms remain unknown.
    - Reduce risk only if credit quality, reserve policy, and preference stack are documented.
  - - valuation stance
    - stretched above $1.5B
    - Anything materially above the 2021 unicorn mark asks investors to pay premium multiples without premium disclosure.
    - A lower price or materially stronger economics support would move the stance toward fair.
  - - decision implication
    - wait for diligence or a lower clearing price
    - Base-case public support clusters closer to $1.0B–$1.5B than to a fresh step-up.
    - Act only when common-equity upside widens and downside is better protected.
  notes: Assessment is explicitly price-sensitive. It summarizes what public evidence supports today, not what management may prove later in diligence.
