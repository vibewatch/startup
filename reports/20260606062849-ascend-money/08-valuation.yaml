- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - evidence
  - what would change the view
  rows:
  - - Thesis
    - Ascend Money combines scaled Thai distribution, broad financial-product breadth, and now-real virtual-bank upside.
    - Audited net revenue, gross profit, and evidence of capital-light cross-sell would justify paying nearer to the premium end of fintech comps.
  - - Anti-thesis
    - The company still looks more like a regulated fintech or bank-adjacent platform than like clean software infrastructure, and its disclosed economics are too thin for premium underwriting.
    - A cleaner cap table, stronger disclosed margins, and better evidence that lending and virtual-banking can earn above-cost returns would reduce the discount.
  - - Price-sensitive unlock
    - The business can still be interesting without being cheap enough today; the key is buying where optionality is free rather than fully paid for up front.
    - A verified current mark inside or below the base-case band would improve upside or downside symmetry immediately.
  notes: The anti-thesis is about underwriting discipline and common-equity downside, not denial that Ascend Money is a meaningful regional platform.
