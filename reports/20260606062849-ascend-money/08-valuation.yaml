- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - public anchor
  - conditions that must be true
  - valuation range
  - probability signal
  - decision implication
  rows:
  - - Bull
    - 32M Thailand users, 50M+ regional customers, and virtual-bank approval support strong optionality.
    - Audited economics prove premium revenue quality, credit losses stay controlled, and virtual-bank rollout monetizes faster than sector skeptics expect.
    - $1.5B–$2.2B
    - 15%–25%
    - Interesting only if price is at or below the low end of the band or the evidence set improves materially.
  - - Base
    - Last clean public mark is still $1.5B and the 2024 strategic round did not disclose a reprice.
    - No major negative surprise emerges, but investors keep applying a disclosure discount versus premium processors or neobanks.
    - $1.0B–$1.5B
    - 50%–60%
    - This is the most defensible public-evidence band today and supports research-more rather than buy.
  - - Bear
    - Virtual-bank buildout, lending risk, and regulatory cost are already visible in the public record.
    - Credit quality deteriorates, launch economics stay loss-making for too long, or a weaker financing or secondary clear resets expectations downward.
    - $0.6B–$1.0B
    - 25%–35%
    - Avoid premium entry and wait for a reset or for cleaner economics to emerge.
  notes: These are scenario bands rather than point estimates. They reflect price-sensitive public evidence, not a full management-model DCF.
