- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Current mark or new financing resets lower
    - Verified primary or secondary clearing below ~$1.0B or with materially investor-favourable terms
    - The last clean anchor loses support and the disclosure discount becomes a hard repricing event.
    - Do not underwrite above the bear band until terms are fully understood.
  - - Virtual-bank economics slip
    - Readiness is delayed or management-grade plan implies multi-year loss-heavy build without clear path to profitable cross-sell
    - Optionality turns from upside into cash absorption.
    - Treat virtual banking as risk, not upside, until economics improve.
  - - Credit performance weakens
    - NPLs, reserves, or cohort losses worsen materially from current public signals
    - Lending optionality stops looking like a premium driver and starts looking balance-sheet heavy.
    - Recut the case toward the bear range.
  - - Audited economics disappoint
    - Audited revenue and gross profit land well below what is needed to justify premium multiples
    - The bull and upper-base cases lose support immediately.
    - Refuse premium entry and re-underwrite from processor-like bands.
  - - Regulatory or compliance burden rises
    - New capital, conduct, or licensing requirements materially increase opex or constrain rollout
    - Regulatory moat remains, but equity value captures less of it.
    - Assume slower payback and wider downside protection requirements.
  notes: The triggers are designed to be monitorable. They convert abstract risk into events that should change action, not just narrative tone.
