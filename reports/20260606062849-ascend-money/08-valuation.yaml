- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  rows:
  - - Adyen
    - Public payment infrastructure / current P or S
    - ~4.8x P or S; ~$29.7B market cap
    - Upper-bound premium processor reference with strong merchant and regulatory infrastructure.
    - More profitable, more disclosed, and cleaner than Ascend Money.
  - - dLocal
    - Emerging-market payments / EV or sales
    - ~2.1x EV or sales; ~$3.3B market cap
    - Useful emerging-market payments analogue with real profitability.
    - Cross-border merchant mix differs from Ascend’s Thailand-led consumer and merchant base.
  - - Grab
    - SEA ecosystem platform / EV or revenue
    - ~2.5x EV or revenue; first full-year net profit; 50M MTUs
    - Shows what scaled Southeast Asian ecosystem distribution can look like in public markets.
    - Financial services are still only one part of Grab’s mix.
  - - Sea / Monee
    - SEA platform with digital-finance arm / EV or sales
    - ~1.8x EV or sales; ~$53.0B market cap
    - Useful ecosystem and regional-distribution benchmark for digital-finance optionality.
    - Public multiple reflects the whole Sea group, not Monee as a standalone DFS asset.
  - - Nu Holdings
    - Digital bank / EV or sales
    - ~6.4x EV or sales; ~$58.2B market cap
    - Shows that profitable, scaled digital-banking models can still command premium revenue multiples.
    - Nu is far more disclosed and already proven on profitability.
  - - Paytm
    - EM wallet and finance super-app / current P or S
    - ~4.1x P or S; ~$7.2B market cap
    - Provides an emerging-market consumer-finance and wallet reference with public liquidity.
    - India’s market structure and regulatory context are not Thailand’s.
  - - PayPal
    - Scaled global processor / EV or sales
    - ~1.15x EV or sales; ~$36.4B market cap
    - Anchors the low end of mature payment-processing multiples.
    - Far larger, more mature, and more diversified than Ascend Money.
  - - Block
    - Merchant and ecosystem payments / EV or sales
    - ~1.7x EV or sales; ~$40.9B market cap
    - Adds an ecosystem and merchant-finance reference closer to consumer and seller tools.
    - Bitcoin and broader software exposure make it a looser analogue.
  notes: This is a selective decision-useful peer set rather than an exhaustive global fintech universe. Metrics mix EV or sales and P or S because the most accessible public pages do not expose every company on the same basis.
  enumerationScope:
    coverage: partial
    basis: The table intentionally covers the most decision-useful listed payments, digital-bank, and Southeast Asian ecosystem analogues plus notional premium and low-end anchors, while excluding private comps without usable open metrics.
