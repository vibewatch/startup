- id: diligence-gates-and-thesis-breaks
  title: What still blocks underwriting and what would break the thesis
  body: 'The remaining blockers are the exact ones that most quickly change common-equity outcomes in fintech: there is no audited public bridge from user scale and lending activity to net revenue or gross profit, no disclosed reserve policy, no public cap-table waterfall, and no verified current mark from either a primary or secondary transaction. That means investors cannot tell whether the 2024 strategic round quietly held the 2021 mark, repriced it, or sat on different instrument terms. The underwriting ask is therefore straightforward: prove audited economics, show that the virtual-bank launch can add profitable deposit and lending relationships without years of subsidy, and show that prior investors do not have preference terms that neutralize common upside. Until then, paying above $1.5 billion offers thin gross upside even in the bull case, while several realistic paths still compress value toward the bear band. A lower-clearing round, delayed virtual-bank readiness, worsening credit
    metrics, or heavier regulatory capital and compliance needs would all break the premium thesis quickly.'
