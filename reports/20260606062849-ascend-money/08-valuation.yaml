  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-overhang
    missingEvidence: Current liquidation preferences, ratchets, participation rights, transfer restrictions, and any other terms that sit ahead of common equity.
    whyItMatters: Headline valuation is not enough if structured terms materially change what new common equity actually owns.
    diligencePath: Request the current cap table, financing documents, any tender documentation, and a waterfall that shows common-equity outcomes.
    relatedQuestionRefs:
    - QV029
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited or management-grade 2025 to 2026 revenue, gross profit, take-rate, reserve, and loss-economics bridge.
    whyItMatters: Without a clean revenue-quality bridge the scenario ranges are too sensitive to guesswork and comp selection.
    diligencePath: Request audited financial statements, product-level gross profit, reserve policy, and cohort revenue definitions.
    relatedQuestionRefs:
    - QV020
    - QV024
  - type: missing-source
    severity: material
    topic: current-market-clearing-price
    missingEvidence: Verified secondary clears, tender prices, fund marks with methodology, or a disclosed 2024 or 2025 post-money valuation.
    whyItMatters: Public evidence still cannot tell whether the 2024 strategic round held, raised, or lowered the effective common-equity mark.
    diligencePath: Request completed secondary transactions, board-mark support, or round documents showing share price and instrument type.
    relatedQuestionRefs:
    - QV028
  - type: missing-source
    severity: material
    topic: virtual-bank-unit-economics
    missingEvidence: Launch economics for the virtual bank, including customer-acquisition cost, deposit pricing, technology spend, and expected path to profitability.
    whyItMatters: Virtual-bank optionality is a key bull argument, but current public sources mostly describe vision and customer acquisition rather than earnings power.
    diligencePath: Request a regulatory-ready business plan with deposit, lending, CAC, opex, and break-even assumptions by year.
    relatedQuestionRefs:
    - QV007
    - QV023
    - QV026
  - type: missing-source
    severity: material
    topic: credit-vintages
    missingEvidence: Detailed lending-book vintages, loss curves, recovery rates, and NPL development behind the disclosed 20 billion baht book and 7.5% NPL ratio.
    whyItMatters: The equity story changes quickly if alternative-data underwriting does not scale with acceptable losses.
    diligencePath: Request cohort-level lending dashboards, underwriting vintages, and reserve methodology by product.
    relatedQuestionRefs:
    - QV008
    - QV027
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set-coverage
    missingEvidence: A fuller set of direct private SEA fintech transactions or verified secondary marks that tighten the comp bridge beyond listed analogues.
    whyItMatters: The current public comp table is decision-useful, but it still mixes pure payments, super-apps, and neobanks because Ascend Money is private and under-disclosed.
    diligencePath: Add recent private comps or management-supplied KPI bridges before setting a final investment committee valuation.
    relatedQuestionRefs:
    - QV014
    - QV024
    relatedTableRefs:
    - TV004
