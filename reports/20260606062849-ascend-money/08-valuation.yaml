- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Audited revenue quality
    - 2025–2026 audited revenue, gross profit, take-rate, and reserve bridge
    - This is the single biggest unknown behind whether Ascend deserves processor, premium infrastructure, or digital-bank multiples.
    - Management data room plus auditor-reviewed statements.
  - - Credit book health
    - Vintage-level losses, reserve methodology, recoveries, and cohort migration behind the 20B-baht lending book
    - Alternative-data underwriting can create moat or destroy value depending on loss emergence.
    - Chief risk officer review plus loan-book analytics.
  - - Current mark and instrument terms
    - 2024 share price, security type, and any completed secondary or tender pricing since the round
    - Without a current mark investors do not know whether the last round held the 2021 anchor or reset it.
    - Board materials, transfer ledger, and investor letters.
  - - Cap table and preference stack
    - Liquidation waterfall, ratchets, participation rights, and transfer restrictions
    - Common-equity upside can be materially worse than headline valuation implies.
    - Finance team to provide cap table and counsel to confirm terms.
  - - Virtual-bank launch economics
    - Deposit pricing, CAC, technology opex, capital needs, and break-even plan
    - Virtual-bank optionality is a major reason to pay up, so it must be tested as a business not just a story.
    - Regulatory business plan and budget review.
  - - Regulatory operating perimeter
    - Expected capital, compliance, and governance requirements across wallet, lending, and virtual-bank activities
    - Regulatory intensity shapes both moat and margin.
    - Legal and regulatory diligence with Thai counsel and former supervisors.
  notes: These asks are prioritized by their impact on common-equity outcomes rather than by management convenience.
