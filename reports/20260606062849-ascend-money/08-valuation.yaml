- id: public-comps-and-scenario-range
  title: Public comps support wide ranges and punish overpaying for opacity
  body: Comparable context puts boundaries around how much premium Ascend Money can plausibly deserve. Windsor Drake says established payments companies generally trade around 4x–6x revenue, while Finro’s Q1 2026 preview shows payments and transfers averaging 7.7x but with a median only 3.6x, which is a reminder that means are pulled up by a few outliers. The listed comp set is equally wide. Adyen still sits near premium territory, dLocal and Grab are much lower, Sea trades in the low-single digits on an EV or sales basis, PayPal and Block sit near the bottom end, and Marqeta is lower still. Nu and Paytm show that stronger consumer-finance or digital-bank narratives can earn higher ratios, but they are also more disclosed and further along the profitability curve. If GetLatka’s $174 million 2023 revenue estimate were directionally right, the 2021 $1.5 billion Ascend mark already implied roughly 8.6x revenue, which is rich versus the payments median. That is why a base case around $1.0 billion
    to $1.5 billion is more defensible than underwriting a step-up above the last clean anchor, while a bull case above that needs proof that Ascend’s scale converts into durable, capital-efficient earnings.
