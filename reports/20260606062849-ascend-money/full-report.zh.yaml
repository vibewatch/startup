      - number: '3.3'
        title: 切换成本、多归属与分发力量
        blocks:
          - type: paragraph
            body: >-
              TrueMoney 最强防线是分发，而不是排他性。Ascend Money 自己的公开材料仍指向 88,000 名代理、21 million 电子钱包
              用户，以及连接泰国与缅甸、柬埔寨的跨境和汇款用例。这些属性重要，因为它们解决真实的线下问题：入金、出金、商户触达和国际价值转移。它们也帮助 TrueMoney
              服务现金仍有黏性、正式银行渗透不足的客群。但证据同样显示，用户锁定比标题钱包规模暗示的更软。GrabPay 明确支持从泰国主要银行 App 充值和免费转账；GoPay 主打免费转账和 QRIS 普及；KBZPay
              在缅甸做同样的事；泰国自身 PromptPay 基础设施也意味着，许多消费者无需被困在一个闭环内，也能转钱或向商户付款。

              实际上，这让多归属变得理性。消费者可以保留一个银行 App 用于工资和转账，一个钱包用于促销或特定商户，再保留另一个钱包用于旅行、汇款或信贷。商户端切换成本略高，因为支付选择会绑定收单、结账工具和生态流量。这正是
              Maya 的商户收单领先地位如此重要的原因，也解释了为什么 GrabPay、LINE Pay Thailand 和 ShopeePay
              即便没有干净的泰国特定钱包份额披露，仍然危险。它们每一家都在支付按钮周围带来更宽的工作流。对 Ascend Money
              的含义是，钱包习惯本身不够；平台必须占有相邻工作流，否则竞争对手可以与其共存，而不迫使用户做二选一。
