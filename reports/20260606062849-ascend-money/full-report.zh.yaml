      - number: '2.2'
        title: 用多重视角做证据受限的市场测算
        blocks:
          - type: paragraph
            body: >-
              公开来源支持一个大市场，但只能通过几组不完美的视角来支持。人口视角从泰国 71.7 million 人口和 2024 年约 65.1 million 互联网用户开始。实际触达视角更窄：公开披露把
              TrueMoney 的泰国用户基数放在 28 million 到 32 million 之间，而官方区域披露则从 21 million 电子钱包用户跨到超过 50 million
              用户或客户。支付通道视角又更大。2026 年 1 月，BOT 报告 PromptPay 交易 2.478 billion 笔、金额 THB 4.896 trillion，e-money 交易 493
              million 笔、金额 THB 362 billion，总 e-payment 交易 4.243 billion 笔、金额 THB 48.633 trillion。这些通道总量太宽，不能等同于钱包收入
              TAM，但它们证明泰国数字支付行为已经达到大众规模。区域上限仍更宽：Bain 和 Google 预计 2025 年东南亚数字经济 GMV 超过 US$300 billion，ASEAN 各国 QR
              系统和跨境互联互通覆盖八个市场。正确结论是证据受限的总可用市场（TAM）、可服务市场（SAM）和可获取市场（SOM）：TAM 庞大且区域化，SAM 是泰国及邻近市场中钱包可触达的消费者和商户流量子集，SOM
              仍受披露约束，因为公开来源没有披露 TrueMoney GTV、活跃商户或抽成率。
