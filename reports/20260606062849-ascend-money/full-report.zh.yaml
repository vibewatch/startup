  - id: TP001
    title: 按类别划分的竞争格局
    enumeration: true
    enumerationScope:
      coverage: partial
      basis: >-
        Material Thailand competitors, substitutes, and Southeast Asia benchmark platforms that illuminate the
        wallet/payments/fintech jobs Ascend Money must defend as of June 2026.
    columns:
      - 竞争者 / 替代方案
      - 类别
      - 公开规模信号
      - 产品广度
      - 分发优势
      - 主要限制 / 注意事项
    rows:
      - - TrueMoney / Ascend Money
        - 直接同业 / 本报告对象平台
        - 服务 50M；21M 电子钱包用户；88k 代理点
        - 钱包、账单、零售 QR、网购、娱乐、汇款、Pay Next
        - 代理网络加 6 国区域覆盖
        - 如果 PromptPay 持续把支付商品化，国内护城河弱于表面规模。
      - - GrabPay
        - 相邻超级 App 钱包
        - Grab 2025 年 MTU 超过 50M
        - 出行、外卖、生鲜 / 商超、快递、订阅、钱包、转账、奖励
        - 日常超级 App 流量和银行绑定充值
        - 保留来源未公开披露泰国特定钱包份额
      - - LINE Pay Thailand
        - 直接城市生态钱包
        - 10M+ LINE MAN/Wongnai 用户；500k+ 商户；关联生态中 100k+ 骑手
        - 线上 / 线下支付、BTS、AIS、LINE 生态结账
        - 曼谷占比高的消息、配送和商户生态流量
        - 被 LINE MAN Wongnai 收购后，独立品牌野心收窄
      - - ShopeePay / Monee
        - 电商关联相邻钱包
        - Sea 2025 年服务约 400M 活跃买家和 20M 卖家；Monee 新增 20M+ 首贷借款人
        - 电商结账、支付、贷款、金融服务
        - Shopee 交易意图和卖家生态
        - 保留来源未披露泰国特定钱包使用量
      - - 泰国银行 App + PromptPay
        - 在位替代方案
        - 90M+ PromptPay 注册；74M+ 日交易
        - 转账、缴费、QR、无卡取现、银行绑定资金
        - 既有账户关系和近乎全民的国内相关性
        - 奖励或生活方式绑定不如超级 App 钱包鲜明
      - - 现金和银行卡
        - 现状替代方案
        - 现金在文化上仍重要；银行卡仍是替代支付通道
        - 通用线下支付媒介和既有结账习惯
        - 无需开户注册或迁移到钱包
        - 数据闭环最弱，产品交叉销售潜力最低
      - - SCBX 主导的虚拟银行
        - 可能入场者
        - 2025 年 6 月获批；初始资本 THB 5B，升至 THB 10B
        - 存款、贷款、AI 原生银行、数字优先服务
        - SCBX 信任基础加 Kakao/WeBank 数字银行经验
        - 尚未上线，真实客户采用仍未验证
      - - Krungthai-AIS-PTTOR 虚拟银行
        - 可能入场者
        - 2025 年 6 月获批
        - 银行、电信和零售主导的数字银行产品
        - 国有银行信任基础加电信和燃油 / 零售触达
        - 产品细节和上线执行仍未披露
    notes: 规模信号是各类别目前最有决策价值的公开标记，但保留来源集没有一套可比的泰国特定 MAU 或 TPV 数据， 同时覆盖 TrueMoney、GrabPay、LINE Pay Thailand 和 ShopeePay。
