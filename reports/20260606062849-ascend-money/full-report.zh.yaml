  - id: TP002
    title: 分发、信任与能力对比
    columns:
      - 维度
      - TrueMoney
      - GrabPay
      - LINE Pay Thailand
      - ShopeePay / Monee
      - 泰国银行 App / PromptPay
      - 基准信号
    rows:
      - - 日常支付场景
        - 在账单、零售、网购和汇款用例中较强
        - 在出行、外卖、生鲜 / 商超和订阅中较强
        - 在 LINE、LINE MAN、BTS、AIS 和商户流程中较强
        - 在电商结账和卖家流量中较强
        - 在工资关联转账、账单和国内 QR 中较强
        - 竞争表面是场景习惯，而不只是钱包下载量
      - - 类银行产品深度
        - 初现；虚拟银行已获批但尚未上线
        - 靠数字银行和贷款增长
        - 中等；保留来源显示更多由生态驱动，而非存款驱动
        - 借 Monee 信贷，强于纯钱包模式
        - 存款机构内默认就强
        - Maya/GCash 基准显示，产品深度可以与钱包份额领先地位分化
      - - 现金进出和线下触达
        - 依托代理点和零售存在较强
        - 中等；钱包充值依赖银行 App 和绑定卡
        - 中等；以城市商户和交通场景为主
        - 中等；Shopee 流量高的地方最强
        - 依托分行、ATM 和银行 App 通道较强
        - KBZPay 基准显示，现金密集市场里现金处理仍然重要
      - - 跨境效用
        - 在区域汇款和海外支付页面中较强
        - 借更广的区域生态达到中等水平
        - 保留公开来源集显示有限
        - 通过区域电商足迹达到中等水平
        - 相比银行卡 / 钱包专门玩家，消费者旅行用途有限
        - DANA 和 PromptPay 连接显示，跨境 QR 在边际上可能重要
      - - 商户 / SME 工作流
        - 保留公开来源中等
        - 中等，且与生态相连
        - 通过 Wongnai 商户网络达到中等水平
        - 卖家结账和贷款打包时最强
        - 对在位收单机构和银行关系而言较高
        - Maya 基准显示，商户收单可以成为决定性切入点
      - - 信任 / 监管姿态
        - 随 BoT 虚拟银行获批而改善
        - 支付安全强，但作为泰国主要银行关系较弱
        - 借 LINE 品牌和服务连续性改善
        - Sea 生态内品牌信任较强，但泰国钱包专属姿态不够清晰
        - 默认信任最强，因为消费者已经在这些银行开户
        - 虚拟银行入场者会抬高所有钱包主导竞争者的信任门槛
    notes: 证据不足的单元格有意写成方向性强弱，而不是伪造硬排名。本表比较的是泰国消费者或商户在决定把支付活动留在哪里时， 真正在意的能力集群。
