      - number: '5.5'
        title: 路线图、差异化与尽调问题
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开路线图标记，是虚拟银行进程。Bank of Thailand 已在 2025 年 6 月 19 日批准 ACM Holding Company Limited
              设立虚拟银行，并要求一年内开业；后续报道把 2026 年列为计划上线窗口，也称 Ascend Money 已为服务不足客群和 SMEs
              准备好人员、技术和基础设施。这个路线图与其余产品栈相吻合：公司已经把移民、SMEs、BNPL
              用户和商户放进同一个钱包里，因此只要执行不掉链，虚拟银行叠层就能加深存款、贷款和主账户地位。产品新鲜度也能从更小的信号里看到：App Store 列表显示 2026 年 5 月有应用更新，Tap to Pay
              页面在接近运行日时刷新，Xendit 的 TrueMoney 集成文档在 2025 年末更新，说明其合作伙伴生态仍在运转，而不是停在归档集成里。
              [CE048][CE049][CE050][CE054][CE055]


              承销问题不是产品野心不足，而是运营证据不足。公开来源支撑了一个相对窄型泰国钱包更有差异化的叙事：TrueMoney 覆盖移民汇款、BNPL、贷款、储蓄或投资分销、保险、商户收单、商户
              CRM、付款发放和虚拟银行路径。但已审阅来源仍没有披露运行时拓扑、可用时间或 SLA 历史、欺诈损失和误报率、API 量级，或保险、财富、商户附加模块的模块级 KPIs。若要把 Ascend Money
              视为能复利的平台业务，而不只是一个宽但不透明的钱包，尽调应要求内部架构审查、服务级遥测、欺诈仪表盘、直连与网关商户结构、模块附着率；如果管理层希望把 PocketPay/SoundPay
              写进投资故事，还需要部署的一手证据。 [CE051][CE052][CE053]
