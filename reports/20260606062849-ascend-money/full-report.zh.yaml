      - number: '2.5'
        title: 保留下来的矛盾与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              主要尽调教训不是市场小，而是公开测算精度差。官方公司页面描述六国网络、21 million 区域电子钱包用户，以及超过 50 million 用户或客户；而 2024 年 6 月 PR
              和新闻语言切换到七个国家和大约 30 million 泰国活跃用户，2025 年本地媒体报道又把泰国数字提高到 32
              million。这些数字在不同定义下可能都是真的，但公开材料没有桥接注册用户、活跃用户、电子钱包用户、客户或服务国家。同样的问题也出现在测算中。BOT 的通道统计是数字支付规模的强证据，但因为其中包含银行主导的
              A2A 和其他非钱包流量，不能直接等同于 TrueMoney 钱包收入。跨境和汇款相邻业务在战略上重要，但公开来源证明走廊可用性和旅行钱包触达，比证明公司特定美元交易量更清楚。因此，公开 SAM 和 SOM
              需要表达为区间和尽调问题，而不是单点主张。任何把一个公开用户数或一个通道价值数字当作 Ascend 市占率基数的模型，都过于自信。
