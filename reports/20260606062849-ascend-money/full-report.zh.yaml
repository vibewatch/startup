  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与公开牵引力
        blocks:
          - type: paragraph
            body: >-
              Ascend Money 的公开财务故事先从宽度和频次讲起，而不是从已披露收入讲起。官方页面描述了一个以钱包为中心的栈，覆盖账单缴费、商户 QR、转账、跨境汇款、贷款、财富和保险。公司称 TrueMoney
              在六个国家服务超过 50 million 客户，在区域内处理 US$14 billion，达到 21 million 电子钱包用户，并建成 88,000 名代理网络。历史创投报道印证了相近规模，MUFG 的
              2024 年投资新闻稿则把泰国年活跃用户定在截至 2023 年 12 月 31 日的 30 million。Bangkok Post 补充了最有用的近期泰国运营细节：30 million 钱包用户、19
              million 月活跃用户，使用频次从每月 14 次升至 18.5 次，平均月消费从 ฿1,700 升至 ฿2,000。


              这些活动替代指标支持一个支付主导、交叉销售价值越来越高的收入模式。Bangkok Post 报道称，公司 2023 年盈利，收入结构仍由支付主导，支付贡献 80% 收入和 95% 利润，贷款贡献 20%
              收入但只有 5% 利润。这个组合与官方费率表方向一致：钱包暴露出大量交易、转账、FX
              和服务费通道；贷款、保险和投资产品看起来旨在加深钱包份额，而不是已经取代支付成为盈利锚。因此，公开记录支持的是一个有规模、支付占比高且具备贷款上行空间的平台，而不是一份独立收入预测。
