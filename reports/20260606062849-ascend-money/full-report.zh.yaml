  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、牌照与司法辖区风险
        blocks:
          - type: paragraph
            body: >-
              Ascend Money 最大的近期风险，是虚拟银行获批启动了倒计时，而不是完成了承销。BOT 的 2025 年 6 月 19 日公告称，ACM Holding
              仍必须设立一家公众有限公司、满足部长级条件、通过就绪评估，并在一年内开业。Ministry of Finance 规则还加入了硬性的牌照前义务：获牌前至少 Bt5 billion 实缴资本，初始阶段后走向
              Bt10 billion 的路径，消费者保护和负责任贷款计划，以及能通过效率、安全和高可用性测试的 IT 系统。这一点重要，因为 Ascend 正从电子货币进入监管更重的资产负债表业务，而基础支付栈仍处在
              Thailand Payment Systems Act 和 AML/KYC 体系内。TrueMoney 自己的条款也强调，钱包运营方已经把自己视为受泰国
              AML、反恐和反扩散融资法律约束的电子货币业务。投资者的法律问题因此不是 Ascend 能否讲出普惠故事，而是管理层能否在不拖过 2026 年 6
              月时钟、不压窄经济性的前提下，清完一整套密集的牌照、资本、治理和行为工作。
