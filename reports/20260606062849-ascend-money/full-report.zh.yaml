chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、平台与区域足迹
        blocks:
          - type: paragraph
            body: >-
              Ascend Money 更应被理解为后期私营金融科技平台，而不是一家单一产品的钱包公司。官方公司和关联方材料把业务追溯到 2013 年，显示其泰国主要办公室位于 曼谷的 101 True Digital
              Park，并描述了一个围绕数字支付、贷款、财富管理、保险，以及代理支持的入金、出金和汇款通道搭建的模式。公开品牌层级在公司和服务页面上保持一致： TrueMoney 是面向客户的支付和钱包层，Ascend
              Nano 覆盖贷款，Ascend Wealth 覆盖投资和储蓄产品，Ascend Assurance 负责保险分销。公司阶段最适合描述为后期私营 / 独角兽，有 IPO
              野心，但截至报告运行日尚未提交招股说明书，也未公开上市。

              规模主张很强，但内部并不完全自洽。官方首页和服务页仍锚定超过 50 million 用户或客户、21 million 电子钱包用户、88,000 名代理，以及区域内处理 $14 billion 交易额；而
              2024 和 2025 年聚焦泰国的报道转向泰国单一市场 30-32 million 活跃客户或用户。地域披露同样混乱：公司主页面反复列出六个国家——泰国、缅甸、柬埔寨、印尼、越南
              和菲律宾——但联系页面列出马来西亚办公室，关联方和马来西亚品牌页面也暗示第七个国家的足迹。因此，本章把六国名单视为核心且反复出现的运营主张，同时把
              马来西亚标记为真实但范围不清的额外落点，而不是假设它与六个具名市场完全等同。
