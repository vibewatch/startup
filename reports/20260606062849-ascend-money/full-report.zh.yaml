            body: >-
              耐久性是公开记录变薄的地方。正面信号看得见：Apple 的 App Store 显示 68,000 条评分下为 4.0，历史上的 1700 万活跃用户数字也说明存在真实复用，而不只是安装基数。但公开记录没有披露
              NRR、GRR、流失、留存同期群 或活跃商户率。因此，庞大的注册或活跃用户口径还无法转换成达到承销标准的续约质量视图。


              负面信号存在，不能一笔带过。JustUseApp 的 2026 年评论页面明显偏怀疑：272 条已分析评论的应用商店平均分为
              3.4/5，安全和合法性评分很低。外国人和其他边缘用户仍能在公开指南里看到摩擦：护照或工作许可检查、泰国 SIM 要求，以及最长 1 到 3 个工作日的身份验证延迟。Google Play 显示 24/7
              呼叫中心和应用内聊天，但没有 SLA、首次联系解决率或投诉趋势数据。SHIELD 的案例研究进一步把信任问题落到运营上：账户接管、虚假账户创建和促销滥用都是核心留存威胁，不是假想边缘案例。
