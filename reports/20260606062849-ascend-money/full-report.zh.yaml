      - number: '4.3'
        title: 资本需求与融资依赖
        blocks:
          - type: paragraph
            body: >-
              资本需求比现金是否充足更容易看见。Ascend Money 在 2021 年成为泰国首家金融科技独角兽的 US$150 million 融资后，又在 2024 年 6 月从 MUFG Bank 和
              Krungsri Finnovate 融资 US$195 million。管理层还单独告诉 Bangkok Post，公司会再融资来支持贷款增长。原因可从反向运营数据中看到：Bangkok Post
              后续报道，公司在约 2.5 年内累积了 ฿20 billion 数字贷款账簿，不良贷款率为 7.5%，且 60% 到 70%
              客户获得传统银行信贷的渠道有限。如果风险管理得当，这个组合能带来有吸引力的上行；但它也让贷款成为最清晰的资本、催收努力和损失吸收能力消耗项。


              虚拟银行让资本问题更明确。Bank of Thailand 批准 ACM Holding 成为三家虚拟银行申请方之一，并要求获胜方成立公众有限公司、通过准备度评估，并在 2025 年 6 月 19
              日获批后一年内开业。BOT FAQ 称，虚拟银行需要 ฿5 billion 注册资本，因为它们必须承受早期 IT 和广告支出，同时保持稳定。Nation Thailand 另行报道了 2026 年中或 2026
              年 6 月底的上线目标。赞助方背书有帮助，但不能单独补上尽调缺口。MUFG 年报显示，它把 Asia-Pacific 视为第二本土市场，明确提到 2024 年 6 月对 Ascend Money
              的投资，并报告截至 2025 年 3 月拥有 ¥405.9 trillion 总资产和 14.18% CET1 比率。这证明的是股东层面的能力，不是 Ascend Money 运营公司层面的已承诺资金。
