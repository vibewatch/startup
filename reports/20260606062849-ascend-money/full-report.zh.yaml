            title: 披露不匹配让渗透率计算变脆
            body: 公开材料没有调和 6 国与 7 国范围，也没有调和 28M、30M 和 32M 泰国用户数。因此，投资人模型应把渗透率视为区间，并要求管理层先桥接注册用户、活跃用户和交易用户，再推断市占率。
