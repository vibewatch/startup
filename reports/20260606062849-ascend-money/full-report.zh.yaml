      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              几股力量仍在扩张市场。泰国较高的互联网渗透率降低了基础开户摩擦。PromptPay 和 QR 互联互通让用户习惯快速、便宜、移动端支付，BOT
              的跨境项目又把这种习惯延伸到旅行和移工走廊。区域政策动能是真实的：e-Conomy 称 ASEAN-10 市场现在都有国家 QR
              系统，其中八个已经实现跨境互通；数字金融服务在上一年也拿到区域私人融资的大约一半。对 Ascend 而言，虚拟银行获批可以为服务不足客户拓宽产品范围和资金入口。但同样的力量也限制变现。当 A2A
              是主导方式，且只有 25% 的泰国钱包由银行卡充值时，钱包增长依附在银行主导的 通道上，可能压缩抽成率。监管在各国之间割裂，本土监管也在变严：BOT
              拥有正式虚拟银行制度，指定支付服务规则也会影响储值运营商。跨境增长带来的是牌照和合规工作，不只是额外交易量。最后，从支付进入首次借款人信贷，会提高资本强度、承销和信任风险要求。泰国数字支付市场显然在增长，但最容易的采用顺风，也伴随更难的收入获取和合规权衡。
