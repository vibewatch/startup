      - number: '8.4'
        title: 仍阻挡承销的事项，以及会打破投资论点的因素
        blocks:
          - type: paragraph
            body: >-
              剩余阻碍恰恰是最能迅速改变金融科技普通股结果的几项：没有经审计的公开桥梁，把用户规模和贷款活动连接到净收入或毛利；没有披露拨备政策；没有公开股权结构瀑布；
              也没有来自一级或二级交易的已验证当前估值。这意味着投资者无法判断 2024 年战略轮是悄悄维持 2021
              年估值、重定价，还是用了不同工具条款。承销要求因此很直接：证明经审计经济性，证明虚拟银行上线能增加有利可图的存款和贷款关系、且不需要多年补贴，并证明既有投资人的优先条款不会抵消普通股上行。在此之前，即便牛市情形，支付超过
              $1.5 billion 也只有很薄的总上行空间；若干现实路径仍会把价值压向熊市区间。更低出清估值轮、虚拟银行就绪延迟、信用指标恶化，或更重的监管资本和合规需求，都会很快打破溢价 投资论点。
