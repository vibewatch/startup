  - id: TP004
    title: 护城河耐久度与竞争风险清单
    columns:
      - 护城河 / 风险因素
      - 为什么重要
      - 严重性
      - 公开证据
      - 尽调要求
    rows:
      - - 代理网络与线下现金处理
        - 在现金进出仍重要的地方支撑获客和效用
        - 中
        - TrueMoney 仍声称有 88k 代理点；KBZPay 基准确认，银行支持的现金效用仍有价值
        - 要求提供活跃代理点数量、代理点产能和国家拆分
      - - PromptPay 与银行 App 替代
        - 削弱任何只靠国内 QR 或转账建立的闭环钱包护城河
        - 高
        - PromptPay 注册数和交易密度已经极高；核心银行 App 覆盖许多钱包任务
        - 要求披露 TrueMoney 活动中有多少是增量，而非替代银行 App 使用
      - - 超级 App 捆绑
        - 出行、外卖、电商和消息创造重复支付时刻，且不由钱包直接控制
        - 高
        - Grab、LINE MAN Wongnai 和 Shopee 都把支付嵌入更宽的消费者流程
        - 要求按生态合作方提供渠道级留存和商户获客经济性
      - - 虚拟银行新进入者
        - 银行牵头的挑战者能凭信任、存款、信贷和授信数据竞争
        - 高
        - BoT 批准了 SCBX 牵头和 Krungthai 牵头的财团，也批准了 Ascend 自己的载体
        - 要求提供与新进入者能力对照的产品路线图、上线时间和资本计划
      - - 区域钱包 + 银行融合
        - 赢家模型越来越把支付与存款、信贷和商户工具打包
        - 高
        - Grab、Sea/Monee、GoTo、Maya 和 GCash 都在支付之上叠加更深金融层
        - 要求提供 TrueMoney 客群中储蓄、放贷和商户金融渗透路线图
      - - 定价不透明
        - 公开费率表太薄，变现韧性难以横向比较
        - 中
        - 公开页面更强调奖励、免费提现或贷款，而不是钱包实际抽佣率
        - 要求提供商户 MDR、激励支出，以及扣除促销后的队列级净收入
      - - 小型钱包品牌整合风险
        - 中腰部钱包可能需要更大生态才不被边缘化
        - 中
        - Rabbit LINE Pay 走向更深绑定 LINE MAN Wongnai，而不是作为更清晰的独立品牌扩张
        - 询问管理层 TrueMoney 在开放工具与生态锁定之间如何定位
    notes: 风险等级是尽调判断，不是已发布指标。本风险表聚焦最直接改写护城河韧性的风险，而不是覆盖所有可见竞争者新闻标题。
