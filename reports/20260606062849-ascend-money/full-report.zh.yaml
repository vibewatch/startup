  - id: TP003
    title: 公开定价与打包信号
    columns:
      - 平台
      - 公开披露的定价或激励信号
      - 来源支持的细节
      - 竞争含义
    rows:
      - - TrueMoney
        - 不透明
        - 公开页面更强调用例和商户类别，而非稳定的费率表
        - 实际中定价或许重要，但公开证据显示，分发和用例广度是更清晰可见的杠杆
      - - GrabPay
        - 免费转账信号
        - GrabPay Wallet 可免手续费转账到银行账户或朋友，也可通过泰国主要银行 App 充值
        - 降低用户把 GrabPay 作为第二个或场景型钱包的成本
      - - GoPay
        - 显性转账和贷款定价
        - 每月最多 100 次免费转账；GoPay Pinjam 起始费率 1.13%；GoPay Later 起始费率 2%
        - 显示区域钱包如何靠便利性加嵌入式信贷经济性竞争
      - - OVO
        - 奖励驱动的打包
        - OVO 强调积分、优惠和商户权益，而不是存款经济性
        - 即便没有银行所有权，忠诚度也能守住频次
      - - DANA
        - 捆绑驱动的定价姿态
        - DANA 对外主打钱包、金融服务、企业支付工具，以及面向商户的定价信息专区
        - 支撑通过支付基础设施和打包服务变现，而不是靠单一醒目的消费者费用
      - - KBZPay
        - 免费即时转账信号
        - KBZPay 宣传全天候免费即时转账，并支持现金进出和缴费
        - 强化现金密集市场仍会奖励低摩擦钱包效用这一点
      - - Maya 基准
        - 存款和贷款定价
        - Maya Business 宣传商业存款 2.5% 年利率，以及最高 P2M 无抵押贷款
        - 基准显示，钱包 + 银行竞争者可以把资产负债表定价当作获客工具
      - - GCash 基准
        - 促销和信贷驱动的打包
        - GCash 主页突出 GSave 储蓄促销，以及通过 GCredit 和 GGives 支持信贷结账
        - 表明钱包领导者无需完全自有银行资产负债表，也能加深变现
    notes: 本表有意混合泰国和区域基准证据，因为保留来源集中最强的公开定价信号来自区域同业和钱包 + 银行基准， 而不只来自泰国钱包费率卡。
