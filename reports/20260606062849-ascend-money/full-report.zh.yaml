      - number: '4.4'
        title: 财务结论与披露缺口
        blocks:
          - type: paragraph
            body: >-
              阻碍财务承销的是披露深度，不是需求信号不足。公开记录确实呈现了一个连贯故事：泰国用户规模大、使用率上升、收入结构偏支付、2023 年盈利、2024
              年有重要增长轮融资，以及受监管银行野心。它也显示上行可能来自哪里：贷款、跨境汇款，以及向保险和投资做更高价值交叉销售。但几乎所有把这个故事转成承销模型所需的指标仍是私有的。没有独立审计收入、EBITDA、毛利率、现金余额、烧钱速度、现金跑道、国家组合或分部
              P&L。没有披露商户 MDR 套表、汇款点差留存、保险佣金拆分，也没有披露贷款批次、拨备、核销或资金成本。


              因此，结论是商业现实偏正面，但可投资性需要谨慎。Ascend Money
              看起来财务体量可观，可能也比典型风投资助的钱包更成熟；但公开证据仍只支持方向性判断：支付今天为平台供血，贷款可能驱动未来利润，也可能带来未来资本压力；虚拟银行同时增加战略上行和新的受监管资产负债表要求。承销前，投资人应要求独立审计的
              FY2024-FY2025 财务、分部收入和毛利率、贷款账簿损失数据、虚拟银行资本计划，以及从已发布费率表到实际抽成率的桥接。
