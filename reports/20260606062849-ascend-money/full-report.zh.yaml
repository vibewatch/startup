      - number: '5.2'
        title: 商户受理与商业栈
        blocks:
          - type: paragraph
            body: >-
              官方泰国商户页显示，TrueMoney 的商业产品明显比简单 QR 受理更宽。商户钱包项目声称全国超过 300,000 家商户，并支持多种运营模式：静态或 App 驱动 QR、基于 EDC 的扫描、POS
              连接扫描，以及用于数字收款的支付链接。同一批页面还补充了对尽调重要的运营细节：部分流量次工作日结算、Web 门户和 App 通知、实时销售报告，以及免费受理定位。实际看，这意味着 Ascend Money
              卖给商户的不只是接收钱包支付的方式，而是一套现金处理和报表工作流，可适配摊位经营者、展位、门店和更大的 POS 连锁。 [CE017][CE018][CE019][CE020]


              商户增长层走得更远。TrueMoney for Business 在支付核心周围打包 CRM、优惠券、电子券、媒体库存、批量和 API
              付款，以及礼品卡；案例研究声称在具名连锁中带来销售或会员留存提升。线上商户开户也明确写出权衡：商户可以通过合作网关在大约 14–30 天内集成，或选择更慢、仅面向更高交易量卖家的直接 API
              路径。这指向一个有意设计的运营模式：通过预先批准的合作伙伴降低广泛商户获取难度，同时保留对直接连接的更紧控制。一个缺口是，已审阅官方页面没有暴露专门的 PocketPay 或 SoundPay
              页面、定价或商户足迹数据，因此这些产品名在管理层分享一手证据前，应被视为未经验证的子品牌主张。 [CE021][CE022][CE023][CE024][CE025][CE026][CE027][CE052]
