      - number: '7.3'
        title: 缅甸敞口、跨境碎片化与伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              缅甸让 Ascend 的跨境故事比区域品牌叙事更脆弱。FATF 仍把缅甸列为高风险，并明确要求该国改进对资金或价值转移服务的 AML/CFT 监管。Treasury 和 OFAC 另行指定 MFTB 和
              MICB，因为它们为缅甸政权促成外汇兑换和国际交易。然而 Ascend 仍保留真实走廊敞口：官方页面营销 TrueMoney Thailand 旗下泰国—缅甸转账流，TrueMoney Myanmar
              称其在全国有 23,000 个代理点并服务国内与国际转账，Mobile World Live 报道 2026 年与 U9 签署新 MoU，以扩大缅甸数字金融服务触达。这就形成了典型的碎片化问题。Ascend
              横跨七个国家运营，靠代理和交易对手触达无银行账户用户，依赖本地合规轨道 和运营伙伴，而不是单一统一牌照边界。竞争会放大风险。虚拟银行赛道包括 Krungthai/AIS/Gulf/OR 和
              SCBX/KakaoBank/WeBank，也有 Sea/BTS、Lightnet/WeLab 等落选者。Ascend 的 CP 和 True
              生态是一道护城河，但也是一组依赖栈，里面有监管、伙伴和集中度失效模式。
