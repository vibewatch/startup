        - 运营中
        - App 原生汇款替代对线下转账网点的依赖，部分汇款走廊可免手续费
        - 需要汇款走廊 GMV、完成率、合规审核率和定价可持续性
      - - Pay Next / Pay Next Extra 信贷产品
        - 寻求短期流动性或分期消费的消费者
        - 已规模化 / 活跃
