      - number: '8.2'
        title: 规模、产品宽度和虚拟银行批准带来上行，但经济性可能先像银行，再像软件
        blocks:
          - type: paragraph
            body: >-
              Ascend Money 的上行案例并非虚构。Nation Thailand 和 Kapronasia 描述了 3200 万 用户的泰国基础，公司自己的服务页面则称区域内有超过 5000 万客户和 88,000
              个代理点网络。Bangkok Post 还显示，公司已经在承担真实贷款风险，而不只是转接支付：60%–70% 的贷款客户获得银行信贷有限，未偿数字贷款达到 200 亿泰铢，报道的 NPL 为 7.5%。再加上
              Bank of Thailand 批准 ACM Holding 设立虚拟银行，平台显然有可选性，可以加深存款、贷款和日常金融参与。问题是，这个上行恰恰也让 Ascend 更难按纯软件估值。KResearch
              预计泰国虚拟银行头几年将由存款驱动并重押获客，FSSIA 警告第一年可能微利或亏损，Capco 指出数字优先银行往往需要 3 到 8 年才会有意义地盈利。这意味着，创造护城河的监管深度，也可能推迟普通股回本。
