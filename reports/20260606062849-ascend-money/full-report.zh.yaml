            body: >-
              最好的客户证明不是标识墙，而是一组明显已经在生产中运转的工作流。Ascend Money 自家首页给了三个异常具体的用户故事：成为 TrueMoney 代理的缅甸店主 Win Aong；在泰国工作的柬埔寨工人
              Kunthea，用钱包把钱汇回家；曼谷街头小吃摊主 Pol，通过 TrueMoney 分发的 Ascend Nano 贷款重开生意。这些是公司控制的故事，但描述的是实际待办任务和真实经营场景。


              具名商户收单更广，但证明质量更弱。官方和应用商店页面明确点名 7-Eleven、Makro、Lotus's、True Coffee、Lazada、TikTok、Apple Store 和 Google
              Play，足以证明这些是已经上线的消费场景，但页面没有量化消费额或留存。最强的非公司佐证来自业务工作流合作伙伴：Checkout.com、Antom、SHIELD、KBZPay 和 AYA Pay 都显示
              TrueMoney 嵌入了商户、欺诈或汇款运营。这足以判断生产部署真实存在，但仍要把合作伙伴集成证明和直接商户续约证明区分开。
