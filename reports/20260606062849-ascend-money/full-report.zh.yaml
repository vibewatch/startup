  - id: TM005
    title: 矛盾与尽调缺口清单
    columns:
      - 问题
      - 官方披露
      - 其他公开披露
      - 为什么会改变市场规模测算
      - 尽调要求
    rows:
      - - 服务国家
        - Ascend 首页和服务页将业务表述为 6 个国家
        - PR Newswire 和 Forbes 将业务表述为 7 个国家
        - 范围是否多一个国家，会改变区域 TAM 和监管复杂度
        - 要求提供带日期的市场清单，列明各国上线状态、实际运营和收入贡献。
      - - 泰国用户数
        - 2024 年 6 月 PR 和媒体口径集中在 30M 活跃用户
        - Bangkok Post 2023 年 9 月称 28M 用户；Nation 2025 年 4 月称 32M 用户
        - 采用不同用户分母，泰国渗透率会显著变化
        - 要求提供注册、月活、交易用户和年活用户在各期间的口径桥。
      - - 区域触达指标
        - 官方页面引用 21M 电子钱包用户和 >50M 用户或客户
        - 公开来源没有解释这两个数字如何对应
        - 如果把客户、用户和钱包活跃用户视为同一口径，区域 SAM 可能被高估
        - 要求提供覆盖电子钱包用户、客户、账户和活跃用户的指标词汇表。
      - - 商户覆盖
        - 公司页面显示 88,000 个代理点和具名零售受理点
        - 可读的公开网页证据没有披露当前活跃商户数或有交易商户数
        - 商户密度拉动频次，但代理点数量不等于活跃收银受理
        - 要求按客群提供活跃商户、活跃 QR 和商户交易频次指标。
      - - GTV / 抽佣率
        - 公开网页证据显示市场支付通道和用户触点
        - 已抓取来源没有披露 TrueMoney GTV、MAU、活跃商户或钱包抽佣率
        - 没有变现数据，公开 SOM 只能给区间，不能给单点估计
        - 要求提供泰国和区域的年度 GTV、按产品拆分收入、商户数和抽佣率桥。
      - - 汇款规模
        - 公司证据证明走廊和跨境受理存在
        - 公开网页证据没有把走廊可用性与公司特定美元交易量挂钩
        - 汇款可能有战略意义，但其定量贡献还无法干净建模
        - 要求披露走廊级交易量、发送方数量和费率，或提供合作伙伴数据。
    notes: 本清单保留公开矛盾，而不是靠猜测把它们抹平。它用于建模检查：任何投资人把公开采用信号转成收入或市场份额假设前， 都应先跑完这些问题。
