  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 经审计收入质量
        - 2025–2026 经审计收入、毛利、take-rate 和准备金桥表
        - Ascend 应该拿支付处理商、溢价基础设施还是数字银行倍数，最大的单一未知就是经审计收入质量。
        - 管理层数据室，加审计师审阅报表。
      - - 信贷账簿健康度
        - 20B-baht 放贷账簿背后的 vintage 层面损失、准备金方法、回收和队列迁移
        - 替代数据承销能创造护城河，也能毁掉价值，取决于损失如何浮现。
        - 首席风险官审阅，加贷款账簿分析。
      - - 当前估值和工具条款
        - 2024 股价、证券类型，以及该轮以来任何已完成的老股或要约定价
        - 没有当前估值，投资者不知道上一轮是守住了 2021 锚点，还是已重置。
        - 董事会材料、转让台账和投资者信函。
      - - 股权结构表和优先股堆叠
        - 清算瀑布、棘轮条款、参与权和转让限制
        - 普通股上行空间可能明显弱于表面估值暗示。
        - 财务团队提供股权结构表，律师确认条款。
      - - 虚拟银行启动期经济性
        - 存款定价、CAC、技术运营开支、资本需求和盈亏平衡计划
        - 虚拟银行期权价值是溢价核心之一，必须按一门生意验证，不能只听故事。
        - 审阅监管业务计划和预算。
      - - 监管经营边界
        - 钱包、借贷和虚拟银行业务的预期资本、合规和治理要求
        - 监管强度同时决定护城河和利润率。
        - 由泰国律师和前监管人员做法律与监管尽调。
    notes: 核查项按对普通股结果的影响排序，而不是按管理层方便程度排序。
    claimRefs:
