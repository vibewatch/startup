  - id: TI003
    title: 公开牵引力和销售效率代理指标表
    columns:
      - 代理指标
      - 公开数值
      - 为什么重要
      - 尽调要求
    rows:
      - - 区域客户
        - 六个国家超过 50 million 名客户
        - 显示可用于交叉销售和分发杠杆的大规模存量用户基盘
        - 按国家界定活跃用户与注册用户
      - - 泰国活跃用户锚点
        - 2023 年底至 2024 年中，泰国约 30 million 活跃或年度活跃用户
        - 支撑核心市场真实消费者规模
        - 提供月活与年活用户桥接
      - - 月活跃用户
        - 2024 年 1 月 19 million
        - 显示大规模重复互动，不只是注册量
        - 披露 MAU 趋势和流失率
      - - 使用频率
        - 每用户每月 14x 至 18.5x
        - 说明钱包习惯更强，再激活负担更低
        - 按队列和服务类型拆分频率
      - - 月均消费额
        - 1,700 至 2,000 baht
        - 显示每个活跃用户的钱包变现机会在上升
        - 按线上、线下和金融服务类别拆分消费额
      - - 线下与线上结构
        - 80% 线下商户支付，20% 线上
        - 显示商户密度和线下分发仍是核心
        - 披露商户数量、留存和综合商户抽佣率
      - - 代理和触点基础设施
        - 88,000 个代理点，加上 46,000 个马来西亚触点和 100,000 个区域取现点
        - 指向线上线下混合获客和服务模式
