  - id: TM001
    title: 市场定义表
    columns:
      - 边界切片
      - 纳入的支出 / 活动
      - 排除的支出 / 活动
      - 现状替代方案
      - 为什么这对 Ascend Money 重要
    rows:
      - - 国内钱包用途
        - 充值、账单、P2P 转账、线上结账、店内扫码支付，以及 PromptPay 关联钱包行为
        - 批发资金管理、分行银行和非数字现金处理
        - 现金、银行应用和网上银行
        - 这是最高频使用层，也是留存和交叉销售的基础。
      - - 商户结账和 QR 收单
        - 零售门店、SME 店铺、外卖、电商，以及商户 QR 或 PromptPay 扫码支付
        - 没有钱包关系的通用卡收单经济性
        - 卡、银行转账结账和货到付款
        - 商户收单决定 TrueMoney 是变成习惯，还是一次性工具应用。
      - - 跨境旅行钱包
        - 通过 Alipay+ 和类似连接实现的旅行钱包受理和可 FX 的 QR 支付
        - 钱包之外的传统卡 FX 支出和旅行融资
        - 现金兑换和卡
        - 跨境使用把钱包从国内零售延伸出去，并帮助富裕旅行者提高使用频次。
      - - 汇款走廊资金流
        - 从泰国到缅甸、柬埔寨及其他相连走廊的钱包关联转账
        - 未经 TrueMoney 路由的所有泰国汇款量
        - OTC 汇款柜台、银行电汇和非正式代理
        - 这个邻近领域契合 Ascend 的普惠叙事，但公开公司特定美元交易量没有披露。
      - - 服务不足信贷和 BNPL 邻近领域
        - 从钱包关系触达的 nano finance、个人贷款、SME 信贷、BNPL、保险、储蓄和共同基金
        - 与钱包分销无关的完整银行资产负债表产品
        - 当铺、非正式贷款人、银行和卡分期
        - 这些产品是支付之上的利润池，但也增加资本强度和承销风险。
      - - 排除的高价值或非钱包轨道
        - 除设定上限语境外无
        - BAHTNET 以及超出零售钱包经济性的广泛银行主导电子支付流
        - 机构结算和银行转账系统
        - 作为宏观语境有用，但不是 Ascend 市占率的干净分母。
    notes: 边界逻辑使用 Ascend 和 TrueMoney 官方产品页面，以及 BOT 和 Worldpay 的品类框架。排除行标记了宏观轨道 或替代渠道：它们解决同一用户任务的一部分，但不是干净的钱包收入池。
