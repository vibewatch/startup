      - - 资本充足性
        - 资本路径可信度
        - 管理层无法证明牌照前 Bt5bn 资金，以及初始阶段后可信的 Bt10bn 路径
        - 将虚拟银行视为资金不足，并切到下行情景
      - - 制裁 / 反洗钱
        - 交易对手和筛查不透明
        - 缅甸活跃走廊仍在，但管理层无法拿出银行交易对手、筛查规则和关停触发条件的文件
        - 上调风险评级，并要求投资前拿到走廊应急预案
      - - 欺诈 / 网络安全
        - 控制负担变成用户摩擦
        - 账户冻结申诉、诈骗损失或重大事故增长快于成功拦截指标
        - 下调激活、信任和利润率假设
      - - 信贷模型
        - 承销质量恶化
        - 审批质量走弱、催收压力上升，或模型人工干预大幅飙升
        - 下调放贷上行空间，并要求独立模型审查
      - - 合作伙伴依赖
        - 集中度仍无文件支持
        - 尽调期间拿不到头部伙伴、头部支付轨道或头部渠道集中度资料包
        - 在证伪前假设集中度很高，并保守设定敞口规模
      - - 竞争
        - 对手在分销或价格上执行更强
        - Krungthai 或 SCBX 财团上线更快、定价更低，或拿出更干净的承销证据
        - 压缩市占率和估值假设
