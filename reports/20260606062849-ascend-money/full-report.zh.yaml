      - number: '5.3'
        title: 架构、集成与开发者信号
        blocks:
          - type: paragraph
            body: >-
              Ascend Money 没有发布完整内部技术栈图，但其商户和技术页面透露了相当具体的公开运营模式。客户身份通过 KYC 分层，并设有外国人特定限额；支付受理覆盖 QR、EDC、POS、支付链接和
              NFC；线上结账可通过合作网关或直接 API 路由；合作方文档显示，TrueMoney 依赖重定向、QR、webhook、回调和带凭证的 token 交换模式，而不是绑卡 式自主性。Omise 记录了一个带
              `charge.create` 和 `charge.complete` webhook 的离线 QR 流程，Xendit 描述了一个仅重定向的 THB 流程，支持即时结算但不支持循环扣款，ECOMMPAY
              记录中间和最终回调，Payrails 则把 TrueMoney 视为通过 success/error URL 返回的一次性重定向方式。
              [CE025][CE026][CE027][CE041][CE042][CE043][CE044][CE045]


              公开开发者信号存在，但很窄且需要许可。最强的直接信号是 TrueMoney KH 线上支付集成的公开 GitHub 仓库，暴露了预发环境端点、商户客户端凭证、token 签发、RSA-SHA256 请求签名和支付
              WebView 流程。结合官方泰国线上商户项目，这说明 Ascend Money
              能支持结构化合作方开户和安全商户集成，但它看起来不像一个完全开放、自助式的开发者平台。产品技术结论是，公司拥有真实集成层，也有足够公开技术细节来支持商户部署；但它仍没有给出能让投资人判断这一层是在通过开发者采用复利增长，还是只是在支持一单一单合同集成的指标。
