      - 局限
    rows:
      - - Adyen
        - 公开支付基础设施 / 当前 P/S
        - ~4.8x P/S；~$29.7B 市值
        - 具备强商户和监管基础设施，是溢价支付处理商的上限参考。
        - 比 Ascend Money 更赚钱、披露更多，也更干净。
      - - dLocal
        - 新兴市场支付 / EV/sales
        - ~2.1x EV/sales；~$3.3B 市值
        - 具备真实盈利能力，是有用的新兴市场支付参照。
        - 跨境商户组合不同于 Ascend 以泰国为主的消费者和商户基础。
      - - Grab
        - 东南亚生态平台 / EV/revenue
        - ~2.5x EV/revenue；首个全年净利润；50M MTUs
        - 展示规模化东南亚生态分销在公开市场可能呈现的样子。
        - 金融服务仍只是 Grab 业务组合的一部分。
      - - Sea / Monee
        - 带数字金融业务的东南亚平台 / EV/sales
        - ~1.8x EV/sales；~$53.0B 市值
        - 是数字金融可选性的有用生态和区域分销基准。
        - 公开倍数反映的是整个 Sea 集团，不是作为独立 DFS 资产的 Monee。
      - - Nu Holdings
        - 数字银行 / EV/sales
        - ~6.4x EV/sales；~$58.2B 市值
        - 说明盈利且规模化的数字银行模型仍能拿到溢价收入倍数。
        - Nu 披露充分得多，盈利能力也已验证。
      - - Paytm
        - 新兴市场钱包和金融超级 app / 当前 P/S
        - ~4.1x P/S；~$7.2B 市值
        - 提供有公开流动性的新兴市场消费金融和钱包参照。
        - 印度市场结构和监管语境不同于泰国。
      - - PayPal
        - 规模化全球支付处理商 / EV/sales
        - ~1.15x EV/sales；~$36.4B 市值
        - 锚定成熟支付处理倍数的低端。
        - 规模远大于 Ascend Money，更成熟，也更分散。
      - - Block
        - 商户和生态支付 / EV/sales
        - ~1.7x EV/sales；~$40.9B 市值
        - 增加一个更接近消费者和卖家工具的生态及商户金融参照。
        - Bitcoin 和更广软件敞口让它的可比性更松。
    notes: 这是一组有选择、服务决策的同业样本，不是穷尽式全球金融科技宇宙。由于最容易取得的公开页面未按同一口径披露所有公司，指标混用了 EV/sales 和 P/S。
