  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Ascend Money 所在的泰国支付市场里，最难对付的竞争对手往往根本不是独立钱包。TrueMoney 仍是一个重要的区域消费者金融科技平台：Ascend Money 仍声称在六个国家服务 50
              million 用户和客户、拥有 21 million 电子钱包用户，以及 88,000 名代理网络；TrueMoney 服务菜单也从账单缴费、零售结账、PromptPay
              扫码支付延伸到汇款和跨境使用。但泰国支付栈异常开放，并且与银行深度相连。IMF 分析和近期泰国报道都指向 PromptPay：它是全国低成本、实时骨干，到 2025 年中已有超过 90 million
              注册量和超过 74 million 日交易量。K PLUS、SCB EASY 和 Krungthai NEXT 已经让用户在银行 App
              内直接完成许多钱包任务，这意味着消费者不必离开既有通道，也能缴账单、转钱或扫 QR。

              这种结构改变了哪些对象应被算作竞争对手。直接同业仍包括 GrabPay、LINE Pay Thailand 和 ShopeePay，因为它们都试图在更大的消费者生态内占有支付时刻。但更重要的竞争图谱还包括银行
              App、现金和银行卡这些现状替代品，以及 Bank of Thailand 在 2025 年批准的两个非 Ascend 虚拟银行财团。区域基准很重要，因为它们显示钱包竞争正走向哪里：Grab 已经在超级 App
              流量之上叠加存款和贷款；Sea 的 Monee 正通过 Shopee 买卖双方基数扩张支付和信贷；GoPay、DANA 和 OVO 说明，互联互通的 QR 通道会把竞争推向贷款、奖励和便利性，而不是独占受理。
