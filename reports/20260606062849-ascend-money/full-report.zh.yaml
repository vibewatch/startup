      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Ascend Money 的买方、用户和付款方并不是同一个人。对泰国国内消费者而言，用户和付款方通常是同一位家庭成员，用于缴账单、购物、点外卖或 P2P
              转账。对游客和外国居民而言，用户是钱包持有人，但触发采用的是无摩擦跨境受理和 FX 兑换，而不是本地金融普惠。对汇款走廊而言，付款方在泰国，收款家庭在境外，或反过来；要完成的任务是可信转账，而不是结账转化。对
              SME
              商户而言，经济买方是想要收款、降低现金处理成本和获客的业主经理；对更大的商户和平台而言，付款方是选择支持哪些本地支付方式的商务或财务团队。银行服务不足的信贷客群又不同：用户是首次借款人或小商户，但预算承担者是家庭或微型企业营运资金。这个区分重要，因为
              Ascend 自己的贷款叙事依赖替代数据，服务没有传统信用评分的人和 SME
              业主；而虚拟银行叙事则面向服务不足的人群和小企业。因此，采用路径会先从公用事业缴费和零售受理开始，进入跨境使用，再在更后面进入利润率更高的信贷或投资产品。
