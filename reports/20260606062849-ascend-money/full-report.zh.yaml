      - number: '8.3'
        title: 上市可比公司支持宽区间，也会惩罚为不透明付高价
        blocks:
          - type: paragraph
            body: >-
              可比背景给 Ascend Money 可能合理拿到多少溢价画出边界。Windsor Drake 称，成熟支付公司通常按约 4x–6x 收入交易；Finro 的 Q1 2026 预览显示，支付和转账平均
              7.7x，但中位数只有 3.6x，提醒我们均值被少数离群值拉高。上市可比组同样很宽。Adyen 仍接近溢价区域，dLocal 和 Grab 低得多，Sea 按 EV 或销售口径处在低个位数，PayPal 和
              Block 接近底部，Marqeta 还要更低。Nu 和 Paytm 说明，更强的消费者金融或数字银行叙事可以拿到更高倍数，但它们披露更多，也在盈利曲线上走得更远。如果 GetLatka 对 2023 年收入
              $174 million 的估计方向正确，那么 Ascend 2021 年 $1.5 billion 的估值已经隐含约 8.6x 收入，相对支付中位数偏贵。因此，$1.0 billion 到 $1.5
              billion 左右的基本情形，比承销高于最后清晰锚点的估值抬升更站得住；牛市情形若要高于这个区间，需要证明 Ascend 的规模能转化为持久且资本效率高的利润。
