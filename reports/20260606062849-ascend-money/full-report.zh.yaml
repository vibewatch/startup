  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议维持保守：规模和股东背书可信，但价格发现很薄，经济性仍无定论。
    data:
      nodes:
        - label: |-
            规模证明
            2023 年泰国活跃用户 3000 万；2025 年援引的泰国用户 3200 万；区域客户 5000 万+
        - label: |-
            战略验证
            2024 年 MUFG 与 Krungsri 投资 $195M
        - label: |-
            期权价值
            虚拟银行获批，加上贷款和 BNPL 交叉销售潜力
        - label: |-
            披露缺口
            2024 年重新定价未披露；没有公开的经审计营收或毛利；没有股权结构条款
        - label: |-
            可比公司现实
            经济性未被证明时，支付板块中位数远低于高溢价离群样本
        - label: |-
            今日判断
            继续研究 | 中等置信度 | 高风险 | 高于约 $1.5B 即偏贵
    approximationNotes: 这是从留存证据推到建议的定性逻辑链，不是加权决策模型。
