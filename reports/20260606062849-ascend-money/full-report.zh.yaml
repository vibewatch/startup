        - 已上线但 KPI 披露少
        - 共同基金和储蓄入口走大众钱包分发，而不是单独财富管理软件
        - 需要 AUM、已入金账户数、合作伙伴经济性和投资者活跃度
      - - 保险分销
        - 零售保障买家
        - 已上线但 KPI 披露少
        - 旅行、出行和健康保险放在支付外壳里售卖
        - 需要保单数、附加率、理赔体验和佣金率
      - - 商户收单栈
        - 中小企业、连锁店、摊位、以 POS 为主的零售商
        - 已规模化 / 运营中
        - 支持 QR、App 扫码、EDC、POS 和支付链接收款，并主打次日结算
        - 需要商户分层结构、抽佣率、流失率和活跃设备渗透率
      - - 商户增长栈
        - 品牌、商户、运营团队
        - 运营中 / 增购层
        - CRM、电子券、广告、付款和礼品卡把货币化延伸到结账之外
        - 需要附加率、按模块拆分的 ARPU，以及案例研究之外的 ROI 证据
      - - 虚拟银行路径
        - 服务不足的零售和中小企业客户
        - 已获批 / 上线前
        - 监管批准打开更深账户主关系和资产负债表产品的路径
        - 需要商业计划、资本结构、上线范围和准备里程碑
    notes: 各行区分产品存在与已披露运营证据。“KPI 披露少”指公开页面能证明流程存在，但采纳度或经济性数据还不足以支撑投资判断。
