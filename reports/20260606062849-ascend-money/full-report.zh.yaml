      - number: '3.2'
        title: 直接同业与区域基准
        blocks:
          - type: paragraph
            body: >-
              泰国直接钱包集合在战略上很分化。GrabPay 是超级 App 挑战者最清晰的例子，因为它不只是一个储值按钮：泰国产品页把支付和外卖、出行、快递、商超、订阅、奖励、免费银行转账、银行 App
              充值连在一起；Grab 2025 年业绩显示，区域平台月交易用户已经超过 50 million，并且已经在增长存款和贷款。LINE Pay Thailand 的重要性来自另一个原因。2023 年 LINE MAN
              Wongnai 和 LINE Thailand 收购 Rabbit LINE Pay，并没有让它退出市场，但确实削弱了它的独立野心，让钱包更紧地折进 LINE、LINE MAN、Wongnai、BTS
              票务、AIS 支付，以及庞大的商户和骑手基础。ShopeePay 与电商的连接更深：Sea 现在把 Monee 描述为领先的区域支付和金融服务部门，ShopeePay 自身品牌仍锚定线上购物使用。

              区域基准即便不是直接争夺泰国份额的竞争对手，也提供了有用方向。GoPay 显示，一个坐在互联互通 QRIS 通道 上的钱包，仍可通过免费转账、贷款和伊斯兰金融储蓄做出差异化。DANA 和 OVO
              展示了其他获客路径：DANA 增加金融服务和企业支付工具，OVO 则押注积分、促销和商户奖励。KBZPay 相关，是因为 Ascend 仍有缅甸暴露；KBZPay
              证明，在现金占比高的市场里，银行背书的入金/出金、账单缴费和账户连接仍然有力。菲律宾 提供了最有启发的钱包加银行基准。GCash 仍主导钱包规模和商户触达，但 Maya
              已经在存款、贷款和商户收单上拿到有意义的阵地。这种分化预示了 TrueMoney 的风险：如果钱包无处不在不能足够快地转化为更深的银行和商户工作流，护城河就会受压。
