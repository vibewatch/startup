      - number: '1.4'
        title: 里程碑、监管路径与暴露风险
        blocks:
          - type: paragraph
            body: >-
              Ascend Money 的里程碑记录显示，公司正从钱包工具稳步走向更宽的金融服务业务版图。2013 年在 Ascend Group 内部创立奠定了平台基础；到 2016 年，Ascend Nano
              上线，切入服务不足的信贷场景；2021 年融资轮又给公司带来独角兽身份和持久的公开估值标记。现在，产品深度已经通过外国人开户流程、跨境汇款，以及 Ascend Pay Next / BNPL
              页面在公开材料中显现；2024 年影响报告还补充了更聚焦普惠的证明点：超过一半贷款客户此前从未使用正式信贷，过去 12 个月发行了近 1 million 份保险保单，70% 共同基金用户是首次投资者。

              下一段关键在监管。2025 年 6 月，Bank of Thailand 宣布 ACM Holding Company Limited
              是获准设立虚拟银行的申请方之一，还需满足后续准备度要求，并在一年内开业。这是公司公开历史中最强的正式里程碑之一，因为它验证了一条走向更宽数字银行范围的受监管路径。主要反向叠加风险不是直接执法行动，而是司法辖区风险：Ascend
              Money 自身足迹仍包括缅甸，而 FATF 在 2026
              年继续把缅甸列为高风险，美国财政部仍把缅甸相关制裁列为有效。这不构成针对公司的具体指控，但意味着投资人应把区域合规、筛查和治理韧性视为活的尽调事项，而不是后台卫生问题。
