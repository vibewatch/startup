        title: 消费者规模与分层
        blocks:
          - type: paragraph
            body: >-
              Ascend Money 的公开客户证据，最强之处在覆盖面和日常消费者用途，而不是收入结构。Ascend 官方页面仍锚定六国超过 5000 万客户和 88,000 个代理点，MUFG 的 2024
              年投资新闻稿则引用泰国 3000 万活跃用户。较早但仍有用的公开访谈补充了更多细节：Bangkok Post 报道 2700 万用户、1700 万活跃用户、700 万个支付点，且用户群以 Y 世代
              为主。Apple 和 Google 应用商店页面随后把功能图景从简单的钱包储值，扩展到账单、充值、线上和线下购物、储蓄、保险、投资和 SME 赋能。


              因此浮现出的分层，是消费者占重，但不只有消费者。公开材料清楚显示，零售钱包用户、通勤者和购物者、移民汇款人、代理商户、线上线下商户，以及 SMEs
              都在使用相邻服务。缺口在于每个客群的分母。管理层级披露没有拆分个人消费者与企业，没有用同一定义调和各类活跃用户数字，也没有说明网络由旗舰商户和长尾各自贡献多少。
