      - number: '5.4'
        title: 信任、安全、隐私与支持
        blocks:
          - type: paragraph
            body: >-
              公开信任控制强于公开运行时细节。TrueMoney 的英文和泰文支持页称，身份验证是法律强制要求，会收集 KYC
              所需个人信息，并支持证件采集和人脸识别步骤。对外国人而言，支持中心按验证层级披露钱包和交易限额；这一点有用，因为它显示产品在明确合规护栏内运营，而不是为移工搭了一个临时变通方案。欺诈和账户安全方面，泰文支持中心称
              TrueMoney 受 Bank of Thailand、Thai SEC 和 AMLO 监督，使用高级风险情报，并运行建立在 AI 和大数据工程 之上的 3X Protection
              栈，用来检测异常交易、可疑登录和未授权使用。 [CE010][CE011][CE012][CE037][CE038]


              外部和相邻公司来源强化了这种定位。True Corp 2025 年 3 月网络犯罪公告描述了 9777 骗案举报、与 Cyber Police 的 SFTP 数据共享，以及基于 AI 的电话/SMS
              过滤；SHIELD 案例研究补充了针对无障碍功能滥用、屏幕共享、假账户和促销滥用的设备智能控制。客户支持可见且有运营相关性：1240 热线、24/7 在线聊天、关于 App
              更新和权限的用户指引，以及延迟或失败汇款的结构化文章。主要保留是隐私和产品质量信号有好有坏。Apple 列表页显示广泛的关联数据和追踪披露，其美国区商店页评分仅为
              3.4/5；这不算灾难性，但也不是这个规模下一个明显无摩擦 超级 App 应有的评分画像。 [CE032][CE034][CE035][CE036][CE039][CE040]
