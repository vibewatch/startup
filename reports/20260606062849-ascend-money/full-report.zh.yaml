  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Ascend Money 的官方服务页用客户工作流来定义产品，而不是把它定义为单一钱包 SKU。在集团层面，公司公开把 TrueMoney Wallet、TrueMoney Transfer、Ascend
              Nano、Ascend Wealth 和 Ascend Assurance 映射为一个区域金融服务栈，这意味着支付、贷款、财富和保险要相互强化，而不是作为彼此割裂的业务存在。钱包 App
              描述随后显示这套栈如何触达用户：充值、账单缴费、店内和线上结账、转账、储蓄、投资、保险和 SME 支持都在同一个壳里。这个宽度重要，因为它把钱包变成利润率更高产品的分发层，而不是让钱包停留在纯支付 通道。
              [CE001][CE002][CE003][CE004][CE005][CE031][CE033]


              从客户工作流看，最强的差异化是公司明确照顾非标准用户。Ascend Money 的外国人上线页面称，钱包已为泰国移工本地化成缅甸语；支持文档显示基于护照的验证、单独的外国人交易限额，以及到
              缅甸和柬埔寨的汇款用例。贷款也被呈现为工作流延伸，而不是单独应用：Pay Next Extra 主打 5 分钟审批、大额额度、无需工资单、可提现，以及全国规模商户受理；Google Play 又把底层贷款产品连回
              Ascend Nano 和受 Bank of Thailand 监管的合作机构。因此，公开证据强在功能宽度和用户旅程设计，但按模块看采用深度仍弱。
              [CE006][CE007][CE008][CE009][CE010][CE011][CE012][CE013][CE014][CE015][CE016][CE056]
