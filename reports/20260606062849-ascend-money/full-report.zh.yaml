  - id: TI001
    title: 收入来源表
    columns:
      - 收入流
      - 机制
      - 公开价格锚
      - 当前规模或状态
      - 收入质量
      - 尽调要求
    rows:
      - - 消费者钱包费用
        - 钱包内充值、转账、FX、维护和账单费用
        - 15 次后收充值费；QR 转账费；FX 费；维护费
        - 据报道，2023 年支付服务仍贡献 80% 收入和 95% 利润
        - 高频且多元，但由许多小额费率通道拼成
        - 按支付子通道拆分分部收入和毛利率
      - - 商户受理与结算
        - 钱包受理、收款费用、QR 转账和商户结算流
        - 100 次后 2.9% 收款费；30 次个人转账后 25 baht QR 转账费
        - 据报道，80% 钱包交易流向线下商户
        - 规模看得见，商户实际抽佣率看不见
        - 按商户队列列示官方 MDR 和实际综合抽佣率
      - - 跨境汇款与 FX
        - 海外转账费、汇率比较、现金领取、钱包到钱包转账
        - 99 或 199 baht 海外转账费；3.5% 海外刷卡 FX 费；每小时 FX 比价
        - 马来西亚汇款连接 7 个国家和 100,000 个取现点
        - 走廊经济性可能有吸引力，但收入留存不透明
        - 按走廊拆分汇款净收入和点差留存
      - - 贷款与 Pay Next
        - 信贷费用、贷款余额、催收和风险调整后放贷利差
        - Pay Next 费用阶梯为 30 至 300 baht
        - 据报道，2024 年底贷款簿为 20 billion baht，NPL 比率 7.5%
        - 如果风险管得住，上行空间大；也是最吃资本的通道
        - 收益率、vintage、拨备、资金成本和核销
      - - 财富与投资
        - 共同基金和投资分销经济性
        - 无公开抽佣率表
        - 据称 70% 共同基金用户是首次投资者
        - 可能是佣金或收入分成模式，但经济性被隐藏
        - 按产品拆分 AUM、净流入和抽佣率
      - - 保险
        - 小额保险分销与佣金
        - 据报道保费 15 baht 起；公司称上一年签发近 100 万份保单
        - 产品规模看起来足以支撑交叉销售和普惠
        - 易触达产品看得见，留存佣金经济性看不见
        - 佣金表、续保率和理赔经验
      - - 潜在虚拟银行
        - 新银行落地后，存款、贷款和支付可打包
        - BOT FAQ 中 5 billion baht 资本规则
        - 2025 年获批，目标在 2026 年中或 2026 年 6 月底上线
        - 可分散资金来源，但会抬高合规和资本负担
        - 法律实体 P&L、资金来源和资本排期
    notes: 各行把可见变现通道与仍未披露、决定实际收入质量的留存经济性分开。
