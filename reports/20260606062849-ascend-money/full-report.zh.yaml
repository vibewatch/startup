      - number: '4.2'
        title: 定价、GTM 与单位经济替代指标
        blocks:
          - type: paragraph
            body: >-
              对一家东南亚私营金融科技公司而言，标价异常可见。TrueMoney 官方费率页披露：每月第 15 次充值后收取 6 baht 费用；Pay Next 按单笔金额收取 30 至 300 baht 费用；QR
              到银行转账定价；海外转账费用；100 笔交易后收取 2.9% 收款费；海外卡商户收取 3.5% FX
              费；以及维护或对账单费用。马来西亚和缅甸的汇款页面还增加了转账限额、无银行账户入金和出金流程、小时级汇率比较，以及钱包到钱包或现金领取选项。这些披露显示，变现不是单一费用，而是微费用、FX
              点差、汇款服务费、商户转账费和信贷费用打包后，叠加在高频钱包行为之上。


              但同样的可见度也凸显了最大的单位经济盲点：标价不是实际抽成率。公开来源没有披露混合商户折扣率、汇款点差留存、保险或投资的合作方收入分成，或扣除贷款损失后的收益率。GTM 也更多是推断而非量化。CP
              生态渠道、88,000 名代理、46,000 个马来西亚触点，以及上升的钱包频次，暗示低摩擦分发；Bangkok Post 提到的 Lisa 活动 500,000
              用户目标，则显示管理层在需要时仍会投放付费营销。成本结构看起来包括代理和合作方分成、支付通道费用、FX 运营、欺诈控制、催收，以及类似 TrueMoney AI 驱动 3X Protection 栈的安全投入，但
              CAC、回本周期和分客群毛利率仍未披露。
