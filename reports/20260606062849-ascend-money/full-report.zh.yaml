  - id: TV005
    title: 打破投资逻辑和终止触发条件表
    columns:
      - 触发条件
      - 阈值
      - 如何传导到投资逻辑
      - 行动含义
    rows:
      - - 当前估值或新融资向下重置
        - 经验证的新股或老股出清低于 ~$1.0B，或条款明显偏向投资者
        - 最后一个干净锚点失去支撑，披露折价变成硬性重定价事件。
        - 在完全理解条款前，不要按高于悲观区间承销。
      - - 虚拟银行经济性滑坡
        - 就绪延后，或管理层拿出的计划显示未来多年建设亏损沉重，且缺少通往盈利交叉销售的清晰路径
        - 可选性从上行空间变成现金消耗。
        - 在经济性改善前，把虚拟银行视为风险而非上行。
      - - 信贷表现走弱
        - NPLs、准备金或队列损失较当前公开信号明显恶化
        - 放贷可选性不再像溢价驱动，开始显得资产负债表负担很重。
        - 将案例重切到悲观区间。
      - - 经审计经济性不及预期
        - 经审计收入和毛利明显低于支撑溢价倍数所需水平
        - 乐观和基准上沿情景立即失去支撑。
        - 拒绝溢价入场，并按支付处理商式区间重新承销。
      - - 监管或合规负担上升
        - 新资本、业务行为或牌照要求明显推高 opex，或限制铺开
        - 监管护城河仍在，但股权价值能捕获的部分变少。
        - 假设回本更慢，并要求更宽的下行保护。
    notes: 这些触发条件设计成可监测事件。它们把抽象风险转成应该改变行动的事件，而不只是改变叙事语气。
    claimRefs:
