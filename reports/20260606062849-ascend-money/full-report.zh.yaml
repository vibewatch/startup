  - id: TM004
    title: 增长驱动与采用约束
    columns:
      - 因素
      - 方向
      - 时间节奏
      - 机制
      - 对 Ascend Money 的含义
    rows:
      - - 高互联网渗透率
        - 驱动
        - 当前
        - 庞大的联网人群降低钱包和虚拟银行分发的开户注册摩擦
        - 有利于广泛获客，尤其是城市和零售关联客群。
      - - PromptPay 使用习惯已形成
        - 驱动 + 约束
        - 当前
        - 消费者已经期待快速的账户到账户（A2A）支付，这会扩大数字行为，也会强化银行主导的替代方案
        - 有利于数字支付普及，但可能压低钱包抽佣率和差异化。
      - - ASEAN QR 互联互通
        - 驱动
        - 2025 年起
        - 跨境 QR 和互联支付系统让旅行支付和走廊支付更容易
        - 提升跨境钱包效用和区域叙事。
      - - 虚拟银行牌照
        - 驱动 + 约束
        - 2025-2026
        - 新牌照拓宽产品边界和普惠覆盖，同时抬高监管与执行要求
        - 可能拓宽相邻业务，但成功需要资本、合规和信任。
      - - 本地 APM 多元化
        - 驱动 + 约束
        - 当前
        - 商户越来越多地同时支持 TrueMoney、PromptPay、LINE Pay 和网上银行
        - Ascend 进入候选名单会受益，但也要在多元支付组合中竞争。
      - - 支付服务监管
        - 约束
        - 当前
        - 指定支付服务提供商和预收款规则抬高运营要求
        - 储值增长需要更强控制和营运资金纪律。
      - - 银行服务不足借款人需求
        - 驱动 + 约束
        - 当前
        - 首贷借款人和无信用评分 SME 业主把可触达需求从支付扩到更大范围
        - 潜在利润率较高，但信用损失和资金成本会上升。
      - - 分国割裂
        - 约束
        - 持续
        - 跨境规模需要在各市场分别拿牌照、运营走廊并落地本地合作伙伴
        - 区域足迹有价值，但比单一国家规模更难统一变现。
    notes: 方向标签说明该因素是扩大采用、拖慢变现，还是两者兼有。时间节奏对齐已抓取的 2024-2026 年证据集， 而不是长期猜测。
