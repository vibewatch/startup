        - 需要活跃用户结构、各支付通道交易量，以及按队列拆分的留存
      - - 外国人钱包与外籍劳工开户
        - 外籍劳工、外派人士、跨境家庭
        - 已上线 / 差异化
        - 缅甸语本地化、护照验证和明确的外国人限额，对本地钱包并不常见
        - 需要官方 MAU、国籍结构和汇款走廊留存
