  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出、排除支出与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Ascend Money 真正进攻的市场比“全部金融服务”窄，但比单一泰国电子钱包更宽。官方产品页显示，TrueMoney 覆盖国内钱包功能——充值、账单、线上和线下结账、转账、PromptPay
              扫码支付、跨境支付、汇款、贷款、储蓄、共同基金和保险。实际看，核心边界是泰国零售数字支付和储值钱包活动，跨境 QR 和汇款走廊是延伸，贷款、保险和财富管理则叠在钱包之上的变现相邻业务。排除项很重要。BOT 全系统
              e-payment 表是有用的宏观上限，但它也包含银行主导的通道和流量，不能干净映射到 TrueMoney 钱包经济。现状替代品也不只是现金：通过 PromptPay 的银行 App
              A2A、网上银行、银行卡，以及 OTC 或代理网络，都在解决同一消费者任务的一部分。官方公司口径内部也很模糊。Ascend 自己的页面强调六个国家、超过 50 million 用户或客户、21 million
              区域电子钱包用户，而后续 PR 和新闻稿语言又转向七个国家。这种披露漂移意味着市场边界必须按用例和通道 定义，而不是按一个不稳定的公司标题指标定义。
