  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 价值摆动最大的变量，是营收质量、虚拟银行变现，以及公开市场是否继续折价受监管金融科技风险。
    data:
      items:
        - label: 经审计营收和毛利强于当前不透明度暗示
          value: 0.45
        - label: 虚拟银行上线后的变现快于存款导向的悲观预期
          value: 0.25
        - label: 股权结构干净，优先权拖累有限
          value: 0.2
        - label: 官方融资或二级交易清算价把估值重置到基准以下
          value: -0.45
        - label: 虚拟银行建设未来数年仍亏损
          value: -0.25
        - label: 信贷损失或监管成本比公开信号更差
          value: -0.35
    approximationNotes: 数值是相对基准情形中点的方向性十亿美元级变化，来自公开可比公司区间和已披露风险因素的推断。
