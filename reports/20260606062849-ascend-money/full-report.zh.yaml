  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 核心驱动
      - 改变判断的条件
    rows:
      - - 建议
        - 继续研究
        - 公司具有战略价值，但披露经济性和新的公开估值都撑不起当前价格。
        - 只有经审计经济性补齐且入场价格留在基准情景区间内，才转向观察。
      - - 置信度
        - 中
        - 规模、股东背书和监管可选性真实存在，但核心承销记录仍不完整。
        - 若披露经审计收入、毛利和虚拟银行就绪指标，则上调置信度。
      - - 风险评级
        - 高
        - 放贷、监管和执行都会影响普通股结果，而股权结构条款仍未知。
        - 只有信用质量、准备金政策和优先股堆叠有文件支持，才下调风险。
      - - 估值立场
        - $1.5B 以上偏高
        - 任何明显高于 2021 独角兽估值的价格，都要求投资者在缺少高质量披露时支付溢价倍数。
        - 更低价格或明显更强的经济性支撑，会把立场推向合理。
      - - 决策含义
        - 等尽调补齐或等更低出清价
        - 公开证据支持的基准情景更接近 $1.0B–$1.5B，而不是新一轮上调。
        - 只有普通股上行空间拉开、下行保护更好时才行动。
    notes: 评估明确对价格敏感。它总结的是公开证据今天能支撑什么，而不是管理层之后可能在尽调中证明什么。
