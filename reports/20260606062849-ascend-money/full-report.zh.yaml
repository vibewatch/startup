      - number: '7.2'
        title: 欺诈、网络与客户信任风险
        blocks:
          - type: paragraph
            body: >-
              欺诈、网络和信任风险在泰国支付市场并不抽象。BOT 的反欺诈包已经要求金融机构拦截 SMS 和电子邮件中的高风险链接、限制手机银行凭证，并维持 24 小时受害者热线；泰国 2025
              年网络犯罪扩展则把服务提供商推向主动拦截和关闭黑名单账户。True 和 TrueMoney 显然明白攻击面有多大：公司公开营销 3X Protection，称可疑交易按 detect-identify-block
              模型处理，也称 True CyberSafe 自 2024 年 12 月以来已拦截超过 6.24
              亿次恶意链接点击。但同一披露也证明运营负担真实存在。泰国诈骗损失仍具有系统性规模，消费者投诉量仍然可观，独立评论页面仍偏弱。JustUseApp 基于 272
              条用户评论标记安全和合法性担忧，TrustFinance 仍只给 TrueMoney 55/100 分。投资含义是，Ascend
              不能把欺诈工具当成可有可无的增售项。如果更严格控制带来误报、开户延迟或账户冻结，监管要求更激进干预的同时，客户信任也会走弱。
