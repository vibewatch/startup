- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver or risk
  - Public signal
  - Why it matters
  - Current evidence strength
  - Main concentration risk
  - Diligence path
  rows:
  - - Wallet-to-financial-services cross-sell
    - App-store and official pages layer lending, savings, insurance, and investments onto wallet use
    - Can deepen share of wallet and raise switching costs
    - Medium
    - No segment-level adoption or renewal by product
    - Request attach rates and cohort retention by product module
  - - Merchant integration stack
    - Antom and Checkout.com support refunds, recurring payments, WooCommerce, and multi-market acceptance
    - Shows B2B monetization path beyond retail payments
    - Medium
    - No disclosed split between enterprise merchants and SME long tail
    - Request merchant count, TPV mix, and recurring-volume share
  - - Alipay+ travel expansion
    - TrueMoney can ride Alipay+ into China and other destinations
    - Extends usage beyond domestic checkout and remittance
    - Medium
    - Depends on partner networks rather than direct merchant ownership
    - Request destination-level transaction data and travel-share mix
  - - Myanmar remittance corridors
    - AYA Pay and KBZPay partnerships dominate recent remittance proof
    - Corridors can create repeat frequency and brand stickiness
    - Medium
    - Partner and corridor concentration is not disclosed
    - Request top corridors, partner concentration, and repeat-remit curves
  - - Cambodia tourist-merchant niche
    - MoneyKH sees value with urban merchants serving Chinese visitors
    - Shows regional merchant expansion can work outside Thailand
    - Low-Medium
    - Use case may remain niche and city-concentrated
    - Request user and merchant cohorts by Cambodian city and segment
  - - Consumer-heavy headline mix
    - Scale metrics emphasize users, not businesses or merchants
    - Public narrative may overstate diversification if monetization is still consumer-led
    - Medium
    - Business versus consumer customer mix is undisclosed
    - Request revenue, TPV, and user mix by segment
  - - Flagship-channel visibility
    - Public merchant examples over-index to named flagship retail or platform surfaces
    - May hide long-tail quality and merchant concentration
    - Medium
    - Independent merchant proof is thinner than company-controlled surfaces
    - Request top-20 merchant exposure and share of active merchants transacting monthly
  notes: The table mixes upside and risk because the same expansion loops that support monetization also
    create concentration and partner-dependence questions.
