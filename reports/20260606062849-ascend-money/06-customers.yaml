- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Core use case
  - Public scale or proof
  - Strategic value
  - Gap
  rows:
  - - Thai mass-market wallet users
    - Buyer=user=payer
    - Daily payments, bills, top-ups, online and offline purchases
    - 30M active users in Thailand; 27M/17M historical user-active split; 4.0/68k App Store rating
    - Core transaction volume and habit formation
    - No DAU, MAU, or cohort-retention disclosure
  - - Gen Y urban consumers
    - Buyer=user=payer
    - High-frequency app spending and financial-service cross-sell
    - 40% of users in Bangkok Post interview
    - Shows wallet relevance beyond the unbanked only
    - No current age-mix update after 2023
  - - Migrant workers and foreign residents
    - Worker sends; family receives; merchant may cash out
    - Thailand-to-Myanmar/Cambodia remittance and foreigner QR pay
    - Kunthea story; AYA and KBZPay corridors; passport and Thai-SIM guidance
    - Cross-border flows can be sticky and high-frequency
    - No corridor mix, repeat-remit, or take-rate disclosure
  - - Agent-merchants
    - Agent buys service capacity; local users transact
    - Cash-in, cash-out, remittance, bills, top-ups
    - 88k agents across six countries; Win Aong case; 10k agents in Cambodia
    - Offline reach expands access beyond banked users
    - No active-agent productivity or churn data
  - - Flagship merchants and retail channels
    - Merchant accepts; consumer pays
    - 7-Eleven, Makro, Lotus's, True Coffee, 7Delivery
    - Named in app-store and official pages; 7M payment points historical claim
    - Daily-life acceptance supports repeat usage
    - Public proof is mostly company-controlled, not merchant-side
  - - Online merchants and digital platforms
    - Merchant accepts; user pays
    - Lazada, TikTok, Apple Store, Google Play, game top-ups
    - Named on foreigner-payment and app pages; Antom/Checkout integrations
    - Broadens digital-commerce relevance
    - No merchant GMV or platform concentration data
  - - SMEs and micro-entrepreneurs
    - SME owner buys; end-customer may use; SME repays
    - Merchant acceptance, SME tools, working-capital and loan workflows
    - Pol case; Apple App Store SME language; MUFG and virtual-bank positioning
    - Expansion beyond pure wallet monetization
    - No disclosed SME customer count or revenue mix
  - - Travel and cross-border shoppers
    - Traveller pays; merchant receives
    - Alipay+ QR acceptance abroad and tourist payments in Thailand
    - Tens of millions of merchants in China; 100+ China friendly zones; Alipay+ scale
    - Extends usage outside home market and boosts FX-linked frequency
    - No spend per traveller or travel-merchant conversion data
  notes: Rows separate who pays, who uses, and who receives value. Scale mixes current official claims,
    historical interviews, and partner evidence rather than a single audited customer count.
