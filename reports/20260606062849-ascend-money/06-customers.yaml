- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: How consumer, migrant-worker, merchant, and SME workflows move through the TrueMoney ecosystem.
  data:
    items:
    - label: Register and verify
      detail: Thai residents, foreign residents, or workers create an account and complete identity checks.
      touchpoints:
      - Thai SIM
      - passport / work permit
      - identity verification
    - label: Fund the wallet
      detail: Users add money through bank links, convenience stores, agents, or partner rails.
      touchpoints:
      - 50k+ convenience stores
      - 88k agents
      - bank account link
    - label: Use for daily spend
      detail: Retail payments, bills, top-ups, 7-Eleven, Lotus's, Makro, online shopping, and app stores
        drive habit.
      touchpoints:
      - 7-Eleven
      - Makro
      - Lotus's
      - Lazada
      - TikTok
    - label: Send or receive cross-border value
      detail: Migrants and travellers use remittance rails or Alipay+ QR acceptance.
      touchpoints:
      - AYA Pay
      - KBZPay
      - China via Alipay+
    - label: Expand into business and finance
      detail: SMEs, merchants, and users add recurring payments, loans, savings, insurance, or merchant
        tools.
      touchpoints:
      - Checkout.com
      - Antom
      - SME entrepreneurs
      - Ascend Nano
    - label: Trust and support loop
      detail: Fraud controls and support channels determine whether users stay active and keep balances
        on the platform.
      touchpoints:
      - SHIELD
      - 24/7 call center
      - in-app live chat
      - app-store reviews
  approximationNotes: This journey map is structural rather than quantitative. It traces the main public
    workflow surfaces retrieved for this chapter and does not imply conversion rates between stages.
