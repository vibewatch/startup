- id: TU003
  title: Named customer proof table
  enumerationScope:
    coverage: partial
    basis: 'Enumeration covers the strongest public named proofs retrieved for this chapter: official
      user stories, named merchant-acceptance surfaces, and partner workflow references reviewed at run
      date; it is not a complete customer list.'
  columns:
  - Customer / proof surface
  - Segment
  - Deployment / use case
  - Production vs marketing
  - Outcome / proof quality
  - Limitation
  rows:
  - - Win Aong
    - Myanmar agent-merchant
    - Runs an IT-accessory shop and became a TrueMoney agent
    - Production user story
    - Concrete human workflow with business-expansion narrative
    - Company-authored story with no transaction data
  - - Kunthea
    - Cambodian migrant worker in Thailand
    - Uses TrueMoney Wallet to send money home cross-border
    - Production user story
    - Strong remittance workflow proof tied to a real persona
    - No remittance frequency or corridor value disclosed
  - - Pol
    - Bangkok micro-merchant
    - Used Ascend Nano via TrueMoney to restart a street-food stall
    - Production user story
    - Shows wallet-adjacent SME finance workflow
    - Loan economics and repayment durability undisclosed
  - - 7-Eleven / Makro / Lotus's / True Coffee
    - Flagship merchant acceptance
    - Wallet payment at daily-life Thai retailers
    - Production acceptance, marketing-level proof
    - Named merchant surfaces appear on official and app-store pages
    - No merchant-side testimonial, spend, or renewal data
  - - Lazada / TikTok / Apple Store / Google Play
    - Online commerce and digital content
    - Wallet use for online shopping, app stores, and top-ups
    - Production acceptance, marketing-level proof
    - Expands evidence beyond physical retail
    - No volume split between these platforms
  - - AYA Pay corridor
    - Thailand-to-Myanmar remittance partner
    - Wallet-to-wallet and cash-out remittance
    - Production partnership
    - Concrete corridor workflow and zero-fee proposition
    - No repeat-remit or corridor-share data
  - - KBZPay / KBZ Bank corridor
    - Thailand-to-Myanmar remittance partner
    - Direct transfers to KBZPay wallets and KBZ Bank accounts
    - Production partnership
    - Real-time cross-border transfer proof plus partner scale
    - No economics, churn, or partner concentration disclosure
  - - SHIELD / Antom / Checkout.com
    - Business workflow partners
    - Fraud controls, merchant onboarding, recurring and online payments
    - Production partner proof
    - Strong evidence of embedded merchant and risk infrastructure
    - Partner proof is not the same as direct merchant renewal proof
  notes: Proof quality varies deliberately. User stories and remittance corridors show live workflows,
    while named merchant pages mostly prove acceptance surface rather than customer lifetime value.
