company:
  name: Ascend Money
chapter:
  number: 6
  title: Customers
  summary: 'Ascend Money''s customer evidence is broad but still consumer-weighted: official and partner
    surfaces support more than 50 million regional customers, 30 million active Thailand users, 88,000
    agents, and live acceptance across flagship merchants, remittance corridors, and Alipay+ travel flows.
    The best named proofs are real user and workflow references—Win Aong the agent-merchant, Kunthea the
    migrant remitter, Pol the micro-merchant borrower, and corridor partners like AYA Pay and KBZPay—while
    merchant mix, active-user definitions, NRR/GRR, churn, and concentration remain undisclosed. Adverse
    evidence is material rather than fatal: app-review surfaces are mixed, foreigner onboarding still
    has friction, and SHIELD''s case study shows fraud pressure is central to sustaining customer trust.'
sections:
- id: consumer-scale-and-segmentation
  title: Consumer scale and segmentation
  body: |-
    Ascend Money's public customer evidence is strongest on reach and day-to-day consumer utility, not on revenue mix. Official Ascend surfaces still anchor on more than 50 million customers across six countries and 88,000 agents, while MUFG's 2024 investment release cites 30 million active users in Thailand. Older but still useful public interviews add more color: Bangkok Post reported 27 million users, 17 million active users, 7 million payment points, and a user base led by Gen Y. Apple and Google app-store pages then widen the functional picture beyond simple wallet storage into bills, top-ups, online and offline purchases, savings, insurance, investment, and SME enablement.

    The segmentation that emerges is therefore consumer-heavy but not consumer-only. Public materials clearly show retail wallet users, commuters and shoppers, migrant remitters, agent-merchants, online and offline merchants, and SMEs using adjacent services. What remains missing is the denominator behind each cohort. Management-grade disclosure does not separate individual consumers from businesses, does not reconcile the various active-user numbers under one definition, and does not show how much of the network is driven by flagship merchants versus the long tail.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
