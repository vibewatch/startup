  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Segmented NRR, GRR, churn, and cohort-retention data for consumers, merchants, remittance
      users, and SME customers.
    whyItMatters: The chapter can prove adoption and workflow breadth, but not durable renewal quality
      or silent churn without cohorts.
    diligencePath: Request monthly active cohorts, retention curves, logo churn, and gross / net revenue
      retention by customer segment for the last 12 quarters.
    relatedQuestionRefs:
    - QU020
    - QU021
    - QU026
    relatedTableRefs:
    - TU004
  - type: conflicting-data
    severity: material
    topic: active-user-definition
    missingEvidence: A reconciled metric dictionary for 50M customers, 30M active users, 32M users, and
      27M/17M historical user counts.
    whyItMatters: Without one common definition, investors cannot tell whether public scale is growing,
      stagnant, or simply being measured differently across time and geographies.
    diligencePath: Ask management for a metric bridge that defines registered, annual active, monthly
      active, and transacting users by geography and date.
    relatedQuestionRefs:
    - QU013
    - QU014
    - QU026
    relatedTableRefs:
    - TU002
  - type: private-evidence-only
    severity: material
    topic: customer-mix
    missingEvidence: Customer and revenue mix by consumers, merchants, SMEs, remittance users, and travel/cross-border
      users.
    whyItMatters: The public record proves many customer types exist, but it does not show which segments
      actually drive TPV, revenue, or profit.
    diligencePath: Request TPV, revenue, contribution margin, and active-customer share by segment and
      geography.
    relatedQuestionRefs:
    - QU002
    - QU024
    - QU026
    relatedTableRefs:
    - TU001
    - TU005
  - type: missing-source
    severity: material
    topic: merchant-concentration
    missingEvidence: Top-merchant exposure, active-merchant counts, monthly transacting merchants, and
      share of TPV from flagship channels versus long-tail SMEs.
    whyItMatters: Merchant breadth is visible, but concentration risk could still be high if a small set
      of retailers, platforms, or affiliated channels dominate economics.
    diligencePath: Request top-20 merchant TPV and revenue concentration, monthly active merchants, and
      merchant churn by cohort.
    relatedQuestionRefs:
    - QU023
    - QU024
    - QU026
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: remittance-corridor-concentration
    missingEvidence: Corridor mix, repeat-remit frequency, top partner share, and contribution of Myanmar-linked
      corridors to remittance volumes and revenue.
    whyItMatters: Recent public proof is concentrated on Myanmar partnerships, which could overstate diversification
      if corridor economics are concentrated.
    diligencePath: Request corridor-level TPV, repeat-remit frequency, top partner shares, and regulatory
      dependence by corridor.
    relatedQuestionRefs:
    - QU007
    - QU023
    - QU026
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: Independent merchant-side references or customer interviews for flagship channels
      such as 7-Eleven, Makro, Lotus's, Lazada, and TikTok.
    whyItMatters: The current named-proof set shows live surfaces, but most merchant examples remain company-controlled
      and do not prove renewal or wallet-share depth.
    diligencePath: Ask Ascend Money for merchant references or permissioned case studies that show deployment
      date, monthly volume, attach rates, and renewal history.
    relatedQuestionRefs:
    - QU008
    - QU025
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: minor
    topic: support-kpis
    missingEvidence: Support SLA, first-contact resolution, complaint backlog, and fraud-loss trend data
      segmented by customer cohort.
    whyItMatters: Review surfaces and fraud narratives suggest trust and activation friction matter materially,
      but public service-level evidence is absent.
    diligencePath: Request weekly support KPIs, fraud-loss rates, dispute times, and complaint themes
      by market for the last 12 months.
    relatedQuestionRefs:
    - QU017
    - QU018
    - QU019
    - QU026
    relatedTableRefs:
    - TU004
acknowledgedWarnings:
- dimension: figureType
