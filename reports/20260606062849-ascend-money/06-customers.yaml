- id: named-customer-proof-and-production-workflows
  title: Named customer proof and production workflows
  body: |-
    The best customer proof is not a logo wall; it is the set of workflows that clearly look live in production. Ascend Money's own home page gives three unusually concrete user stories: Win Aong, a Myanmar shop owner who became a TrueMoney agent; Kunthea, a Cambodian worker in Thailand who remits money home through the wallet; and Pol, a Bangkok street-food vendor who used an Ascend Nano loan distributed via TrueMoney to reopen a business. Those are company-controlled stories, but they describe real jobs-to-be-done and real operating contexts.

    Named merchant acceptance is broader but weaker in proof quality. Official and app-store surfaces explicitly name 7-Eleven, Makro, Lotus's, True Coffee, Lazada, TikTok, Apple Store, and Google Play, which is good evidence that these are live spending surfaces, but those pages do not quantify spend or retention. The strongest non-company corroboration comes from business-workflow partners: Checkout.com, Antom, SHIELD, KBZPay, and AYA Pay all show TrueMoney embedded in merchant, fraud, or remittance operations. That is enough to conclude production deployment is real, while still distinguishing partner-integrator proof from direct merchant renewal proof.
  claimRefs:
