- id: expansion-loops-concentration-and-diligence-asks
  title: Expansion loops, concentration, and diligence asks
  body: |-
    Public evidence supports meaningful expansion loops. Consumer wallet usage can pull users into lending, savings, insurance, and SME tools; merchants can accept one-time and recurring payments through Checkout.com and Antom; travellers can use TrueMoney through Alipay+ in China and other destinations; and digital-bank plans explicitly target underserved customers and small businesses. Cambodia adds another useful edge case: independent review work suggests TrueMoney is becoming valuable for urban merchants serving Chinese tourists even if it is not yet the primary financial tool for rural users.

    The problem is concentration visibility. Public evidence still does not disclose consumer-versus-business mix, active-merchant counts, top-customer or top-merchant concentration, or corridor mix in remittances. The most visible merchant examples are still company-controlled flagship channels, and the most recent remittance proof is heavily skewed toward Myanmar-linked partners. That does not negate the scale story, but it does mean the committee should ask for active-user definitions, merchant-actives, top-merchant exposure, corridor mix, and cohort retention before treating TrueMoney's customer base as durably diversified.
