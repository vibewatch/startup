- id: pricing-gtm-and-unit-economics-proxies
  title: Pricing, GTM, and unit-economics proxies
  body: |-
    List pricing is unusually visible for a private Southeast Asian fintech. TrueMoney's official rates page discloses a 6 baht fee after 15 monthly top-ups, Pay Next fees from 30 to 300 baht by ticket size, QR-to-bank transfer pricing, overseas transfer fees, a 2.9% receive-funds fee after 100 transactions, a 3.5% FX fee on overseas card merchants, and maintenance or statement fees. Remittance surfaces in Malaysia and Myanmar add transfer limits, no-bank-account cash-in and cash-out workflows, hourly exchange-rate comparison, and wallet-to-wallet or cash-pickup options. These disclosures show that monetization is not one fee but a bundle of microfees, FX spreads, remittance service charges, merchant transfer fees, and credit charges layered onto very frequent wallet behavior.

    However, the same visibility highlights the biggest unit-economics blind spot: list fees are not realized take rates. Public sources do not disclose the blended merchant discount rate, remittance spread capture, partner revenue shares on insurance or investments, or loan-loss-adjusted yield. GTM is also inferential rather than quantified. CP ecosystem channels, 88,000 agents, 46,000 Malaysian touchpoints, and rising wallet frequency suggest low-friction distribution, while Bangkok Post's 500,000-user Lisa campaign target shows management still deploys paid marketing when needed. Cost structure appears to include agent and partner payouts, payment-rail fees, FX operations, fraud controls, collections, and security investment like TrueMoney's AI-driven 3X Protection stack, but CAC, payback, and segment gross margins remain undisclosed.
