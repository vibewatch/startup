  title: Distribution looks structurally advantaged
  body: Ascend Money appears to benefit from a hybrid online-offline engine built on CP ecosystem access, agents, retail touchpoints, and rising wallet engagement, which is a meaningful positive even though CAC is still private.
  claimRefs:
  - CI003
  - CI009
  - CI026
  - CI030
  - CI049
- calloutType: recommendation
  title: Require a management-grade financial pack before underwriting
  body: The public record is good enough to establish scale and direction of travel, but not enough to support a clean underwriting model without audited standalone financials, segment economics, and full credit-risk disclosure.
  claimRefs:
  - CI045
  - CI046
  - CI047
  - CI053
  - CI054
