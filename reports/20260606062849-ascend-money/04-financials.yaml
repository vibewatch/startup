  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: standalone-financial-statements
    missingEvidence: Audited FY2024-FY2025 income statement, balance sheet, cash flow, and notes for Ascend Money or the core operating entities.
    whyItMatters: Without audited financials, investors cannot test revenue quality, liquidity, or true capital adequacy.
    diligencePath: Request audited statutory accounts, management accounts, and a reconciliation from legal entities to group reporting.
    relatedQuestionRefs:
    - QI023
    - QI025
    relatedTableRefs:
    - TI006
  - type: private-evidence-only
    severity: material
    topic: merchant-take-rate
    missingEvidence: Merchant pricing deck and realized MDR or take-rate distribution by merchant cohort and channel.
    whyItMatters: List fees do not reveal whether the payment business has attractive gross margins after partner and rail costs.
    diligencePath: Request merchant contracts, cohort-level take-rate data, and payment gross-margin bridges.
    relatedQuestionRefs:
    - QI004
    - QI022
    relatedTableRefs:
    - TI002
    - TI004
  - type: private-evidence-only
    severity: material
    topic: credit-risk-pack
    missingEvidence: Vintage curves, provisioning policy, funding cost, charge-offs, recoveries, and collection-efficiency data for the lending book.
    whyItMatters: The reported 7.5% NPL ratio is directionally useful but insufficient to judge sustainable lending profitability.
    diligencePath: Request quarterly credit KPI packs, warehouse or facility terms, and board-level risk reporting.
    relatedQuestionRefs:
    - QI015
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: cac-and-payback
    missingEvidence: CAC, payback, conversion, and retention by ecosystem, agent, paid-media, and partnership channels.
    whyItMatters: The thesis that CP ecosystem access creates superior sales efficiency cannot be underwritten without channel economics.
    diligencePath: Request acquisition funnel, cohort-retention, and payback analysis by channel and product.
    relatedQuestionRefs:
    - QI011
    - QI012
    relatedTableRefs:
    - TI003
    - TI004
  - type: private-evidence-only
    severity: material
    topic: virtual-bank-capital-plan
    missingEvidence: Legal-entity map, committed capital sources, launch budget, and regulatory-readiness milestones for the virtual bank.
    whyItMatters: The 5 billion baht capital rule and one-year readiness deadline imply real cash needs that could affect the current business.
    diligencePath: Request the board-approved virtual-bank capital plan, entity structure, and contingency funding arrangements.
    relatedQuestionRefs:
    - QI019
    - QI020
    - QI024
    relatedTableRefs:
    - TI005
    - TI006
  - type: private-evidence-only
    severity: material
    topic: revenue-recognition-and-partner-splits
    missingEvidence: Revenue-recognition policy and partner revenue-share terms for payments, remittance, insurance, and investment products.
    whyItMatters: Without revenue-recognition and partner-split data, list pricing cannot be converted into auditable segment revenue.
