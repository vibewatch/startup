- id: TI005
  title: Capital adequacy table
  columns:
  - Item
  - Public evidence
  - Implication
  - Risk
  - Diligence ask
  rows:
  - - 2021 equity round
    - US$150 million at US$1.5 billion valuation
    - Established unicorn financing anchor and funded regional expansion
    - Historical round does not answer current liquidity
    - Provide full cap table and round terms
  - - 2024 equity round
    - US$195 million from MUFG and Krungsri Finnovate with existing investors alongside
    - Fresh external capital validated the strategy and likely funded growth and lending
    - Use of funds and runway are still undisclosed
    - Provide cash-in date, use-of-funds waterfall, and current cash balance
  - - Management signal on next raise
    - Bangkok Post said the company would raise more money for lending growth
    - Suggests lending expansion consumes more capital than internal cash generation alone
    - Future dilution or leverage needs remain unclear
    - Provide next-round trigger, timing, and target amount
  - - Loan-book scale and risk
    - 20 billion baht loans outstanding with 7.5% NPL ratio
    - Shows lending is already economically significant
    - Losses, recoveries, and funding cost are hidden
    - Provide full credit KPI pack
  - - Virtual-bank capital rule
    - BOT FAQ says 5 billion baht registered capital is required
    - New-bank buildout will need dedicated capital and upfront spend
    - Could divert resources from current opco if not separately funded
    - Provide legal-entity and capital-allocation plan
  - - Regulatory launch timeline
    - BOT approval in June 2025 with one-year readiness requirement; Nation says mid-2026 or end-June 2026 target
    - Launch cadence is publicly visible and near-term
    - Execution slippage or extra requirements could increase cost
    - Provide readiness milestones and contingency budget
  - - Sponsor balance-sheet capacity
    - MUFG annual report shows ¥405.9 trillion of assets and 14.18% CET1 at March 2025
    - External sponsors appear capable of supporting a strategic asset
    - Sponsor capacity is not the same as committed funding for Ascend Money
    - Provide support letters, facilities, or committed equity lines
  notes: This table distinguishes capital availability signals from actual committed liquidity at Ascend Money.
