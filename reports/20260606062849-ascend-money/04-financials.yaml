- id: TI006
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Why it matters
  - Public proxy
  - Exact diligence path
  rows:
  - - Standalone revenue and audited P&L
    - Needed to test valuation, operating leverage, and revenue quality
    - 2023 profitability claim plus fee-card visibility
    - Request FY2024 and FY2025 audited financial statements by legal entity
  - - Segment revenue and gross margin
    - Needed to know how much value comes from payments versus lending versus cross-sell
    - 80/20 revenue mix and 95/5 profit mix from Bangkok Post
    - Request segment P&L and management reporting pack
  - - Cash balance, burn, and runway
    - Needed to judge capital adequacy before further lending or virtual-bank spend
    - US$195 million round and statement that more capital will be raised for lending
    - Request monthly liquidity bridge and 24-month runway model
  - - Merchant take rates and MDR by cohort
    - Needed to model payment economics and offline merchant profitability
    - 2.9% receive-funds fee and transfer fee schedule
    - Request merchant pricing deck and cohort-level realized take rate
  - - Remittance spread retention and partner splits
    - Needed to understand whether remittance is meaningful profit or only volume
    - Hourly FX comparison and fixed transfer fees
    - Request corridor P&L with fee, spread, and payout-partner economics
  - - Credit vintages, provisions, and funding cost
    - Needed to test whether lending upside survives losses and cost of capital
    - 20 billion baht loan book and 7.5% NPL ratio
    - Request quarterly credit KPI pack with vintages, charge-offs, recoveries, and warehouse lines
  - - CAC and payback by channel
    - Needed to validate whether ecosystem distribution really lowers acquisition cost
    - 88,000 agents, 46,000 Malaysian touchpoints, rising usage, Lisa campaign target
    - Request CAC, payback, and retention by ecosystem, agent, and paid channels
  - - Virtual-bank capital allocation and legal-entity boundaries
    - Needed to understand whether new-bank buildout dilutes or burdens the existing business
    - BOT 5 billion baht capital rule and one-year readiness timeline
    - Request board-approved capital plan, entity map, and launch budget
  notes: These are the minimum gaps to close before treating the business as fully underwritable rather than directionally promising.
