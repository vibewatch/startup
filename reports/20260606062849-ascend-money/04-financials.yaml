- id: capital-needs-and-financing-dependency
  title: Capital needs and financing dependency
  body: |-
    Capital need is easier to see than cash adequacy. Ascend Money raised US$195 million in June 2024 from MUFG Bank and Krungsri Finnovate after the US$150 million 2021 round that made it Thailand's first fintech unicorn. Management separately told Bangkok Post that it would raise more money to support lending growth. The reason is visible in the adverse operating data: Bangkok Post later reported a digital-loan book of ฿20 billion built over roughly 2.5 years, a 7.5% non-performing-loan ratio, and a customer mix where 60% to 70% have limited access to traditional bank credit. That combination can produce attractive upside if risk is managed, but it also makes lending the clearest consumer of capital, collections effort, and loss-absorption capacity.

    Virtual banking makes the capital question more explicit. The Bank of Thailand approved ACM Holding as one of three virtual-bank applicants and requires winners to form a public limited company, pass readiness assessment, and start operations within one year of 19 June 2025 approval. The BOT FAQ says virtual banks need ฿5 billion of registered capital because they must survive early IT and advertising spend while remaining stable. Nation Thailand separately reported a mid-2026 or end-June 2026 launch target. Sponsor backing helps but does not close the diligence gap on its own. MUFG's annual report shows it treats Asia-Pacific as a second home market, explicitly notes the June 2024 Ascend Money investment, and reported ¥405.9 trillion of total assets with a 14.18% CET1 ratio at March 2025. That demonstrates capacity at the shareholder level, not committed funding at Ascend Money's operating-company level.
