- id: TI003
  title: Public traction and sales-efficiency proxy table
  columns:
  - Proxy
  - Public value
  - Why it matters
  - Diligence ask
  rows:
  - - Regional customers
    - Over 50 million customers across six countries
    - Shows large installed base for cross-sell and distribution leverage
    - Define active versus registered users by country
  - - Thailand active-user anchor
    - About 30 million active or annual active users in Thailand around end-2023 to mid-2024
    - Supports real consumer scale in the core market
    - Provide monthly and annual active-user bridges
  - - Monthly active users
    - 19 million in January 2024
    - Shows large recurring engagement, not just registrations
    - Report MAU trend and churn
  - - Usage frequency
    - 14x to 18.5x per month per user
    - Suggests stronger wallet habit and lower reactivation burden
    - Break out frequency by cohort and service type
  - - Average monthly spend
    - 1,700 to 2,000 baht
    - Shows rising wallet monetization opportunity per active user
    - Split spend by online, offline, and financial-service categories
  - - Offline versus online mix
    - 80% offline merchant payments and 20% online
    - Shows merchant density and offline distribution remain core
    - Disclose merchant count, retention, and blended merchant take rate
  - - Agent and touchpoint infrastructure
    - 88,000 agents plus 46,000 Malaysian touchpoints and 100,000 regional cash-out locations
    - Suggests hybrid online-offline acquisition and service model
    - Quantify agent economics, commissions, and productivity
  - - Incremental marketing push
    - 500,000 users targeted from the Lisa campaign and 300 school payment points
    - Shows the company still spends on branded growth despite ecosystem reach
    - Provide paid CAC and payback versus ecosystem CAC
  notes: These rows are GTM and engagement proxies rather than direct CAC or payback disclosures.
