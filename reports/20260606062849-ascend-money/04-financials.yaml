tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Public price anchor
  - Current scale or status
  - Revenue quality
  - Diligence ask
  rows:
  - - Consumer wallet fees
    - Top-up, transfer, FX, maintenance, and statement charges inside the wallet
    - Top-up fee after 15 transactions; QR transfer fee; FX fee; maintenance fees
    - Payment service still reported as 80% of revenue and 95% of profit in 2023
    - High-frequency and diversified, but made of many small fee rails
    - Segment revenue and gross margin by payment sub-rail
  - - Merchant acceptance and settlement
    - Wallet acceptance, receive-funds charges, QR transfer, and merchant settlement flows
    - 2.9% receive-funds fee after 100 transactions; 25 baht QR transfer after 30 personal transfers
    - 80% of wallet transactions reportedly went to offline merchants
    - Scale is visible, realized merchant take rate is not
    - Official MDR by merchant cohort and realized blended take rate
  - - Cross-border remittance and FX
    - Overseas transfer fees, exchange-rate comparison, cash pickup, wallet-to-wallet transfers
    - 99 or 199 baht overseas transfer fees; 3.5% overseas card FX fee; hourly FX comparison
    - Malaysia remittance links to seven countries with 100,000 cash-out locations
    - Attractive corridor economics are plausible, but revenue retention is opaque
    - Net remittance revenue by corridor and spread retention
  - - Lending and Pay Next
    - Credit fees, loan balances, collections, and risk-adjusted lending spread
    - Pay Next fee ladder from 30 to 300 baht
    - Loan book of 20 billion baht with 7.5% NPL ratio reported in late 2024
    - Big upside if risk-managed; also the most capital-intensive rail
    - Yield, vintages, provisions, funding cost, and charge-offs
  - - Wealth and investment
    - Mutual-fund and investment distribution economics
    - No public take-rate card
    - 70% of mutual-fund users said to be first-time investors
    - Likely commission or revenue-share model, but economics are hidden
    - AUM, net flows, and take rate by product
  - - Insurance
    - Micro-insurance distribution and commissions
    - Premiums starting at 15 baht reported; company says almost one million policies issued in prior year
    - Product appears scaled for cross-sell and inclusion
    - Accessible products are visible, retained commission economics are not
    - Commission tables, renewal rates, and claims experience
  - - Potential virtual bank
    - Deposit, lending, and payment bundle if the new bank launches
    - 5 billion baht capital rule from BOT FAQ
    - Approved in 2025 with mid-2026 or end-June 2026 launch target
    - Could diversify funding but raises compliance and capital burdens
    - Legal-entity P&L, funding source, and capital schedule
  notes: Rows separate visible monetization rails from the still-undisclosed retained economics that determine actual revenue quality.
