- id: balance-sheet-credit-and-execution-risk
  title: Balance-sheet, credit, and execution risk
  body: 'Balance-sheet and execution risk now sit inside the same underwriting problem. Bangkok Post says Ascend wants a Nasdaq listing, will raise more money for lending, and was already profitable in 2023, but that public progress does not reduce the capital burden of moving deeper into credit. The same reporting says TrueMoney processes roughly 8 million loan applications per year with only eight analysts and relies on technology and alternative data for 99% of retail credit assessment. That may deliver cost advantage, but it also pushes model governance, collections discipline, and responsible-lending controls into the centre of the thesis. Bangkok Post further says planned virtual-bank credit limits may be only Bt3,000-Bt5,000 per customer, while Nation describes a product vision built around daily-repayment loans and alternative-data underwriting for irregular-income borrowers. Those facts fit the BOT rulebook, which explicitly demands consumer protection and responsible lending, but
    they also make underwriting more sensitive to false positives, fraud, and macro stress. Public disclosure remains the weakest part of the stack: there is still no public pack reconciling entity-level licences, partner concentration, reserve policy, loan vintages, funding mix, or sanctions-screening controls across the larger regional platform.'
