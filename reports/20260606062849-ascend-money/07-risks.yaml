  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: Top-10 partner, rail, channel, and merchant concentration by TPV, revenue, and gross profit.
    whyItMatters: Public materials prove ecosystem breadth but not how much downside sits with a few partners, rails, or channels.
    diligencePath: Request management concentration dashboards, major partner contracts, and outage-volume attribution by rail.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: loan-loss-and-funding-data
    missingEvidence: Loan vintages, charge-offs, reserve policy, funding mix, warehouse lines, and collections KPIs for lending and virtual-bank planning.
    whyItMatters: Without cohort loss and funding data, investors cannot test whether lending upside clears the capital and conduct burden.
    diligencePath: Obtain monthly credit pack, vintage curves, provisioning policy, and product-level funding sources.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: material
    topic: licence-and-governance-pack
    missingEvidence: Entity-by-entity licence inventory, BOT License Check screenshots, privacy and data-processor map, and sanctions-governance documentation.
    whyItMatters: Ascend is moving into a more regulated perimeter, but the public record still does not reconcile which entity holds which permissions and controls.
    diligencePath: Request legal-entity map, licence binder, DPA/subprocessor list, and sanctions-policy memo signed by compliance leadership.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: fraud-incident-severity
    missingEvidence: Fraud-loss rate, blocked-account appeals, major-incident postmortems, and false-positive metrics for anti-scam controls.
    whyItMatters: Public control claims and national scam data do not reveal whether Ascend is solving fraud efficiently or merely shifting friction onto users.
    diligencePath: Review fraud dashboards, incident reviews, customer-support SLAs, and restoration outcomes for blocked accounts.
    relatedQuestionRefs:
    - QR013
    - QR032
    relatedTableRefs:
    - TR002
