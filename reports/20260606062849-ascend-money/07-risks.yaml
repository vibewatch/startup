- id: fraud-cyber-and-customer-trust-risk
  title: Fraud, cyber, and customer-trust risk
  body: 'Fraud, cyber, and trust risk are not abstract in Thailand''s payments market. BOT''s anti-fraud package already requires financial institutions to block risky links in SMS and email, limit mobile-banking credentials, and maintain 24-hour victim hotlines, while Thailand''s 2025 cybercrime expansion pushes service providers toward proactive blocking and closing of blacklisted accounts. True and TrueMoney clearly understand the surface area: the company publicly markets 3X Protection, says suspicious transactions are handled through a detect-identify-block model, and says True CyberSafe has already blocked more than 624 million malicious link clicks since December 2024. But that same disclosure proves the operating burden is real. Scam losses in Thailand remain systemically high, consumer-complaint volumes are still material, and independent review surfaces remain weak. JustUseApp flags safety and legitimacy concerns based on 272 user reviews, and TrustFinance still scores TrueMoney
    at only 55/100. The investment implication is that Ascend cannot treat fraud tooling as a nice-to-have upsell. If stricter controls drive false positives, delayed onboarding, or account freezes, customer trust can weaken at the same time regulators demand more aggressive intervention.'
