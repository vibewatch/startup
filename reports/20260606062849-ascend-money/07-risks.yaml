- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Virtual-bank readiness
    - Launch-plan slippage
    - BOT readiness milestones miss or launch drifts beyond June 2026
    - Pause growth underwriting and re-base the investment case around payments-only economics
  - - Capital sufficiency
    - Capital path credibility
    - Management cannot evidence Bt5bn pre-licence funding and a believable Bt10bn post-initial-phase path
    - Treat virtual banking as underfunded and move to downside case
  - - Sanctions / AML
    - Counterparty and screening opacity
    - Active Myanmar corridor remains but management cannot document bank counterparties, screening rules, and shutoff triggers
    - Escalate risk rating and require corridor contingency before investment
  - - Fraud / cyber
    - Control burden becomes user friction
    - Blocked-account appeals, scam losses, or major incidents rise faster than successful prevention metrics
    - Haircut activation, trust, and margin assumptions
  - - Credit model
    - Underwriting quality deteriorates
    - Approval quality weakens, collections stress rises, or model overrides spike materially
    - Reduce lending upside and require independent model review
  - - Partner dependence
    - Concentration remains undocumented
    - No top-partner, top-rail, or top-channel concentration pack during diligence
    - Assume concentration is high until disproven and size exposure conservatively
  - - Competition
    - Rivals out-execute on distribution or price
    - Krungthai or SCBX consortia launch faster, price lower, or show cleaner underwriting evidence
    - Compress market-share and valuation assumptions
  - - Disclosure discipline
    - Evidence pack remains incomplete
    - Management cannot provide audited financials, licence map, reserve policy, and incident data despite diligence requests
    - Treat disclosure opacity itself as thesis-breaking
  notes: Triggers are intentionally phrased as observable diligence events so the investment case can be monitored before formal enforcement or a catastrophic loss event.
