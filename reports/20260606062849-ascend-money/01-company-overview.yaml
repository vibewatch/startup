  evidenceGaps:
    - type: missing-source
      severity: material
      topic: board-disclosure
      missingEvidence: A current board roster, committee structure, and any independent-director disclosures for the holdco and major regulated entities.
      whyItMatters: Governance quality and succession depth cannot be fully underwritten while the public record only identifies the founder-chairman and co-presidents.
      diligencePath: Request corporate-secretary materials, board minutes summaries, or a draft listing document that enumerates directors, committees, and independence status.
      relatedTableRefs:
        - TO002
    - type: private-evidence-only
      severity: material
      topic: funding-terms-gap
      missingEvidence: The post-2024 cap table, any secondary transactions, liquidation preferences, and any debt or warehouse facilities.
      whyItMatters: Ownership economics, control rights, dilution risk, and lending-funding resilience all depend on financing terms that were not publicly disclosed.
      diligencePath: Obtain the current capitalization table, shareholder register, round documents, and treasury or funding-facility schedules.
      relatedTableRefs:
        - TO003
    - type: private-evidence-only
      severity: material
      topic: disclosure-gap
      missingEvidence: Standalone revenue, run-rate, audited profitability, cash flow, and total headcount.
      whyItMatters: Chapter-one cover metrics and later valuation work remain incomplete without a public financial base case and workforce denominator.
      diligencePath: Request audited management accounts, KPI packs, and HR summaries or wait for a prospectus-grade filing.
      relatedTableRefs:
        - TO001
    - type: conflicting-data
      severity: material
      topic: regional-footprint
      missingEvidence: A canonical market list clarifying whether Malaysia is a full operating market, a remittance node, or only an office and affiliate presence.
      whyItMatters: Country-count inflation can overstate regulatory complexity, customer reach, and true operating breadth if office presence is confused with scaled market operations.
      diligencePath: Ask management to reconcile the six-country and seven-country statements and provide market-by-market revenue or user definitions.
      relatedTableRefs:
        - TO001
    - type: missing-source
      severity: material
      topic: virtual-bank-launch
      missingEvidence: The planned capitalization, governance structure, partner economics, and readiness milestones for ACM Holding’s virtual-bank launch.
      whyItMatters: Regulatory approval is a meaningful milestone, but launch economics and execution risk remain unclear until the operating plan is disclosed.
      diligencePath: Review BOT submissions, launch-readiness materials, and any public or investor-facing disclosures tied to the 2026 go-live plan.
      relatedTableRefs:
        - TO004
