company:
  name: Ascend Money
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Ascend Money is a Bangkok-headquartered fintech platform founded in 2013 that now spans
    payments, lending, wealth, insurance, and agent-led remittance under the TrueMoney,
    Ascend Nano, Ascend Wealth, and Ascend Assurance brands. Public evidence supports a
    2021 unicorn round at a $1.5 billion valuation and a further $195 million strategic
    investment from MUFG/Krungsri in 2024, followed by Thai virtual-bank approval for ACM
    Holding in 2025. The core diligence gaps are still material: no public standalone
    revenue or headcount, no full board roster, no disclosed 2024 valuation, and an
    unresolved six-country versus seven-country footprint discrepancy complicated by Myanmar
    compliance exposure.
sections:
  - id: identity-platform-footprint
    title: Identity, Platform, and Regional Footprint
    body: >-
      Ascend Money should be understood as a late-stage private fintech platform rather than
      a single-product wallet company. Official company and affiliate materials trace the
      business to 2013, place the main Thailand office at 101 True Digital Park in Bangkok,
      and describe a model built around digital payments, lending, wealth, insurance, and
      agent-enabled cash-in, cash-out, and remittance rails. The public brand stack is
      consistent across the corporate and service pages: TrueMoney is the customer-facing
      payments and wallet layer, Ascend Nano covers lending, Ascend Wealth covers investment
      and savings products, and Ascend Assurance handles insurance distribution. The stage is
      best described as late-stage private / unicorn with IPO ambition but no filed prospectus
      or public listing as of the run date.

      Scale claims are strong but not perfectly internally consistent. The official home and
      service pages still anchor on more than 50 million users or customers, 21 million
      e-wallet users, 88,000 agents, and $14 billion processed across the region, while 2024
      and 2025 Thailand-focused reporting shifts to 30-32 million active customers or users
      in Thailand alone. Geography is similarly messy: the main corporate pages repeatedly
      enumerate six countries — Thailand, Myanmar, Cambodia, Indonesia, Vietnam, and the
      Philippines — but the contact page lists a Malaysia office and both affiliate and
      Malaysia-brand pages imply a seventh-country footprint. The chapter therefore treats the
      six-country list as the core consistently repeated operating claim, while flagging
      Malaysia as a real but scope-unclear additional foothold rather than assuming full
      parity with the six named markets.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO008
      - CO009
      - CO028
      - CO047
    tableRefs:
      - TO001
    figureRefs:
      - FO002
  - id: leadership-governance-dependence
    title: Leadership, Governance, and Key-Person Dependence
    body: >-
      The most durable public leadership facts center on founder-chairman Suphachai
      Chearavanont and co-presidents Monsinee Nakapanant and Tanyapong Thamavaranukupt.
      Suphachai appears repeatedly in official and independent coverage as the founder and
      chairman, which matters because the company’s public strategic narrative — unicorn
      status, Nasdaq ambition, and strategic-bank backing — is still heavily personalized
      around him. Monsinee and Tanyapong are the two operating leaders that repeatedly appear
      in 2021-2025 public materials. Monsinee’s Bangkok Post CEO of the Year 2024 profile and
      Ascend corporate recognition piece make her the clearest public face for consumer scale,
      financial inclusion, and market positioning. Tanyapong appears as the most detailed
      product-and-strategy spokesperson, including on the MUFG round, virtual banking, and the
      platform’s payments-to-lending expansion.

      Governance transparency is still incomplete for diligence purposes. The reviewed source
      set did not surface a full current holdco board roster, committee structure, or any
      named independent directors. That means governance should be evaluated as institutionally
      backed but still disclosure-thin. Public evidence also did not surface a material
      leadership-change announcement across 2024-2026; instead it shows continuity in the
      visible top team. The practical consequence is high key-person dependence: investors are
      relying on a narrow public bench, founder influence remains prominent, and succession
      depth cannot yet be assessed with confidence from public materials alone.
    claimRefs:
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
    tableRefs:
      - TO002
  - id: capital-history-ownership-and-metrics
    title: Funding History, Ownership Signals, and Cover Metrics
    body: >-
      The 2021 unicorn round remains the clearest public valuation benchmark. Official and
      TechCrunch reporting agree that Ascend Money raised $150 million in September 2021 at a
      $1.5 billion valuation, with CP Group, Ant Group, and Bow Wave Capital Management named
      as investors. The next large disclosed capital event came in June 2024, when MUFG Bank
      and the Finnoventure Private Equity Trust I fund managed by Krungsri Finnovate invested
      a combined $195 million. Multiple sources corroborate that this deal added strategic
      banking backing and reaffirmed CP Group, Ant Group, and Bow Wave as existing investors.
      What the 2024 round did not do is publish a new valuation, leaving the 2021 $1.5
      billion mark as the last disclosed public pricing point.

      That gap matters because the company is clearly large but still under-disclosed on
      underwriter-grade metrics. Publicly surfaced disclosed capital sums to at least $345
      million from the 2021 and 2024 rounds alone, but the reviewed corpus did not disclose
      secondary transactions, warehouse lines, or holdco debt. Cover metrics are similarly
      uneven. Thailand user metrics have moved from 30 million annual active users at the end
      of 2023 to around 32 million active customers in later 2024 coverage, while the regional
      corporate narrative still leans on 50 million-plus customers, 88,000 agents, and $14
      billion of processed payment volume. Public sources mention 2023 profitability, yet none
      of the reviewed materials discloses standalone revenue, run-rate, or total headcount.
      For chapter-one purposes, the company is clearly scaled and financed, but it remains only
      partially underwritten from a financial-disclosure standpoint.
    claimRefs:
