companyProfile:
  summary: >-
    Ascend Money is the Bangkok-based fintech platform behind TrueMoney and a set
    of adjacent businesses spanning digital payments, cross-border remittance,
    BNPL and lending, wealth, and insurance. Backed by CP Group, Ant Group, Bow
    Wave, and later MUFG/Krungsri capital, the company has scaled into one of
    Thailand's most important consumer-fintech franchises and is now preparing
    for a more regulated next phase through Thailand's virtual-bank framework.
    The strategic position is strong, but disclosure still lags what investors
    would want for premium underwriting.
  foundedDate: '2013-01-01'
  founders:
    - name: Suphachai Chearavanont
      role: Founder and chairman
      background: >-
        Thai telecom and digital-business executive who founded and still chairs
        Ascend Money within the wider CP and True ecosystem.
      claimRefs:
        - CO010
        - CO001
  foundingLocation: Bangkok, Thailand
  headquarters: Bangkok, Thailand
  productSummary: >-
    TrueMoney combines wallet payments, bill pay, merchant acceptance, remittance,
    BNPL, lending via Ascend Nano, investment and savings access via Ascend
    Wealth, and insurance distribution via Ascend Assurance, with virtual-bank
    expansion now approved in Thailand.
  customerFocus: >-
    Mass-market Thai consumers, migrant workers and cross-border remitters,
    underbanked borrowers, small merchants and SMEs, and regional wallet users
    across core Southeast Asian markets.
  businessModel: >-
    Multi-product fintech monetization built around wallet activity, merchant and
    payment flows, remittance, consumer and nano lending, BNPL, wealth and
    insurance distribution, and future virtual-bank products. Public sources do
    not disclose the precise realized revenue mix or margins by product line.
  stage: Late-stage private fintech / pre-virtual-bank launch
  fundingStatus: >-
    The last clean public valuation anchor remains the $1.5 billion September 2021
    round. MUFG Bank and Krungsri Finnovate invested a combined $195 million in
    June 2024, but the company did not disclose a new post-money valuation.
