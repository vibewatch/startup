evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-disclosure
    missingEvidence: >-
      A current board roster, committee structure, and any independent-director disclosures for the holdco and major
      regulated entities.
    whyItMatters: >-
      Governance quality and succession depth cannot be fully underwritten while the public record only identifies the
      founder-chairman and co-presidents.
    diligencePath: >-
      Request corporate-secretary materials, board minutes summaries, or a draft listing document that enumerates
      directors, committees, and independence status.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: funding-terms-gap
    missingEvidence: >-
      The post-2024 cap table, any secondary transactions, liquidation preferences, and any debt or warehouse
      facilities.
    whyItMatters: >-
      Ownership economics, control rights, dilution risk, and lending-funding resilience all depend on financing terms
      that were not publicly disclosed.
    diligencePath: >-
      Obtain the current capitalization table, shareholder register, round documents, and treasury or funding-facility
      schedules.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: disclosure-gap
    missingEvidence: Standalone revenue, run-rate, audited profitability, cash flow, and total headcount.
    whyItMatters: >-
      Chapter-one cover metrics and later valuation work remain incomplete without a public financial base case and
      workforce denominator.
    diligencePath: Request audited management accounts, KPI packs, and HR summaries or wait for a prospectus-grade filing.
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: regional-footprint
    missingEvidence: >-
      A canonical market list clarifying whether Malaysia is a full operating market, a remittance node, or only an
      office and affiliate presence.
    whyItMatters: >-
      Country-count inflation can overstate regulatory complexity, customer reach, and true operating breadth if office
      presence is confused with scaled market operations.
    diligencePath: >-
      Ask management to reconcile the six-country and seven-country statements and provide market-by-market revenue or
      user definitions.
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: virtual-bank-launch
    missingEvidence: >-
      The planned capitalization, governance structure, partner economics, and readiness milestones for ACM Holding’s
      virtual-bank launch.
    whyItMatters: >-
      Regulatory approval is a meaningful milestone, but launch economics and execution risk remain unclear until the
      operating plan is disclosed.
    diligencePath: >-
      Review BOT submissions, launch-readiness materials, and any public or investor-facing disclosures tied to the 2026
      go-live plan.
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: disclosure-metric-conflict
    missingEvidence: >-
      A dated bridge among countries served, users, active users, e-wallet users, and customers across Ascend Money
      disclosures and later press coverage.
    whyItMatters: >-
      Penetration, TAM framing, and regional rollout complexity all change materially depending on whether the correct
      denominator is 6 or 7 countries and 21M, 28M, 30M, 32M, or 50M people.
    diligencePath: >-
      Request a management KPI glossary and a dated operating-footprint table that reconciles website, press-release,
      and investor metrics by geography and definition.
    relatedQuestionRefs:
      - QM023
      - QM024
      - QM025
      - QM026
      - QM027
    relatedTableRefs:
      - TM005
  - type: private-evidence-only
    severity: material
    topic: gtv-mau-take-rate
    missingEvidence: >-
      Thailand and regional GTV, monthly active users, active merchants, and take-rate disclosure for TrueMoney and
      adjacent lending or BNPL products.
    whyItMatters: >-
      Without monetization metrics, public SOM can only be expressed as a user-surface range rather than as a
      revenue-bearing market share estimate.
    diligencePath: >-
      Request investor KPI packs or management reporting that bridge annual GTV, MAU, merchant activity, revenue, and
      take rate for Thailand versus regional operations.
    relatedQuestionRefs:
      - QM024
      - QM027
    relatedTableRefs:
      - TM002
      - TM005
  - type: missing-source
    severity: material
    topic: remittance-market-size
    missingEvidence: Company-specific remittance volume, sender count, and corridor share for Thailand-linked TrueMoney transfers.
    whyItMatters: >-
      Public evidence proves corridor availability and travel-wallet reach, but not the dollar contribution of
      remittance to Ascend’s addressable market or revenue mix.
    diligencePath: >-
      Request corridor-level transfer volumes and fee rates for Myanmar and Cambodia, then reconcile them to official
      external-sector or partner-bank data.
    relatedQuestionRefs:
      - QM023
      - QM027
    relatedTableRefs:
      - TM001
      - TM005
  - type: missing-source
    severity: material
    topic: merchant-activity
    missingEvidence: >-
      Current active merchant counts split between large retail chains, SMEs, QR merchants, and transaction-active
      acceptance points.
    whyItMatters: >-
      Agent counts, named merchants, and retailer logos do not tell an investor how frequently the wallet is actually
      accepted or used at checkout.
    diligencePath: >-
      Request active merchant, active QR, and merchant-frequency metrics by segment, then compare them against official
      Thai SME statistics and payment-acceptance data.
    relatedQuestionRefs:
      - QM021
      - QM027
    relatedTableRefs:
      - TM003
      - TM005
  - type: missing-source
    severity: material
    topic: thailand-wallet-share
    missingEvidence: >-
      The retained public source set does not contain a comparable Thailand-specific MAU or TPV table for TrueMoney,
      GrabPay, LINE Pay Thailand, and ShopeePay.
    whyItMatters: >-
      Without a like-for-like share table, competitive ranking can only be inferred from ecosystem breadth,
      distribution, and disclosed scale signals rather than hard market share.
    diligencePath: >-
      Request operator-level monthly active users, transacting users, TPV, merchant actives, and QR volume share
      directly from management or a Thai payments data vendor.
    relatedQuestionRefs:
      - QP010
      - QP026
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: wallet-pricing-opacity
    missingEvidence: >-
      Public consumer and merchant wallet fee schedules in Thailand are inconsistent, incomplete, or marketing-led,
      making clean cross-wallet pricing comparison hard.
    whyItMatters: >-
      Durable wallet economics depend on take rates, subsidy intensity, and credit or deposit monetization, none of
      which can be underwritten confidently from current public tariffs.
    diligencePath: >-
      Request merchant MDRs, cash-in and cash-out fees by channel, transfer-fee policies, promotional spend, and
      post-incentive net revenue by product.
    relatedQuestionRefs:
      - QP018
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: agent-and-merchant-productivity
    missingEvidence: >-
      Public sources disclose TrueMoney's agent-network size but not active-agent productivity, merchant actives, or
      cohort-level retention versus bank-app substitutes.
    whyItMatters: >-
      Distribution is the core public moat claim, but the investment case depends on whether those nodes are active,
      profitable, and hard for rivals to displace.
    diligencePath: >-
      Request active-agent and merchant cohorts, monthly throughput, revenue per active node, churn, and cross-sell
      penetration into lending, remittance, and savings products.
    relatedQuestionRefs:
      - QP010
      - QP022
      - QP028
  - type: private-evidence-only
    severity: blocking
    topic: standalone-financial-statements
    missingEvidence: >-
      Audited FY2024-FY2025 income statement, balance sheet, cash flow, and notes for Ascend Money or the core operating
      entities.
    whyItMatters: Without audited financials, investors cannot test revenue quality, liquidity, or true capital adequacy.
    diligencePath: >-
      Request audited statutory accounts, management accounts, and a reconciliation from legal entities to group
      reporting.
    relatedQuestionRefs:
      - QI023
      - QI025
    relatedTableRefs:
      - TI006
  - type: private-evidence-only
    severity: material
    topic: merchant-take-rate
    missingEvidence: Merchant pricing deck and realized MDR or take-rate distribution by merchant cohort and channel.
    whyItMatters: List fees do not reveal whether the payment business has attractive gross margins after partner and rail costs.
    diligencePath: Request merchant contracts, cohort-level take-rate data, and payment gross-margin bridges.
    relatedQuestionRefs:
      - QI004
      - QI022
    relatedTableRefs:
      - TI002
      - TI004
  - type: private-evidence-only
    severity: material
    topic: credit-risk-pack
    missingEvidence: >-
      Vintage curves, provisioning policy, funding cost, charge-offs, recoveries, and collection-efficiency data for the
      lending book.
    whyItMatters: The reported 7.5% NPL ratio is directionally useful but insufficient to judge sustainable lending profitability.
    diligencePath: Request quarterly credit KPI packs, warehouse or facility terms, and board-level risk reporting.
    relatedQuestionRefs:
      - QI015
      - QI024
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: cac-and-payback
