    diligencePath: Request acquisition funnel, cohort-retention, and payback analysis by channel and product.
    relatedQuestionRefs:
      - QI011
      - QI012
    relatedTableRefs:
      - TI003
      - TI004
  - type: private-evidence-only
    severity: material
    topic: virtual-bank-capital-plan
