  - id: TP003
    title: Public Pricing and Packaging Signals
    columns:
      - Platform
      - Publicly disclosed pricing or incentive signal
      - Source-backed detail
      - Competitive implication
    rows:
      - - TrueMoney
        - Opaque
        - Public pages foreground use cases and merchant categories more than durable tariff schedules
        - Pricing may matter in practice, but public evidence suggests distribution and use-case breadth are the clearer visible levers
      - - GrabPay
        - Free transfer signal
        - GrabPay Wallet can transfer to bank accounts or friends without fees and be topped up via major Thai bank apps
        - Lowers the cost of keeping GrabPay as a second or situational wallet
      - - GoPay
        - Explicit transfer and lending pricing
        - Free transfers up to 100x per month; GoPay Pinjam starts at 1.13%; GoPay Later starts at 2%
        - Shows how regional wallets compete through convenience plus embedded credit economics
      - - OVO
        - Rewards-led packaging
        - OVO emphasizes points, deals, and merchant offers rather than deposit economics
        - Loyalty can defend frequency even without bank ownership
      - - DANA
        - Bundle-led pricing posture
        - DANA markets wallet, financial services, business payment tools, and a pricing-information section for merchants
        - Supports monetization through payments infrastructure and bundled services rather than one headline consumer fee
      - - KBZPay
        - Free instant transfer signal
        - KBZPay advertises free and instant 24/7 transfers plus cash in/out and bill pay
        - Reinforces how cash-heavy markets still reward low-friction wallet utility
      - - Maya benchmark
        - Deposit and lending pricing
        - Maya Business advertises 2.5% annual interest on business deposits and unsecured loans up to P2M
        - Benchmark shows wallet-plus-bank competitors can use balance-sheet pricing as a customer-acquisition tool
      - - GCash benchmark
        - Promotion and credit-led packaging
        - GCash home page highlights GSave savings promotions and credit-enabled checkout via GCredit and GGives
        - Suggests wallet leaders can deepen monetization without a fully native bank balance sheet
    notes: >-
      This table intentionally mixes Thailand and regional benchmark evidence because the strongest
      publicly disclosed pricing signals in the retained set come from regional peers and wallet-
      plus-bank benchmarks, not from Thai wallet fee cards alone.
    claimRefs:
      - CP007
      - CP012
      - CP015
      - CP016
      - CP021
      - CP022
      - CP026
      - CP039
  - id: TP004
    title: Moat Durability and Competitive Risk Register
    columns:
      - Moat / risk factor
      - Why it matters
      - Severity
      - Public evidence
      - Diligence ask
    rows:
      - - Agent network and offline cash handling
        - Supports acquisition and utility where cash in/out still matters
        - Medium
        - TrueMoney still claims 88k agents; KBZPay benchmark confirms bank-backed cash utility remains valuable
        - Request active-agent counts, agent productivity, and country split
      - - PromptPay and bank-app substitution
        - Weakens any closed-loop wallet moat built only on domestic QR or transfers
        - High
        - PromptPay registrations and transaction density are already extremely high; core bank apps cover many wallet jobs
        - Request share of TrueMoney activity that is incremental versus displaced bank-app usage
      - - Super-app bundling
        - Rides, food, commerce, and messaging create recurring payment moments outside wallets' direct control
        - High
        - Grab, LINE MAN Wongnai, and Shopee all attach payments to broader consumer workflows
        - Request channel-level retention and merchant acquisition economics by ecosystem partner
      - - Virtual-bank entrants
        - Bank-led challengers can compete on trust, deposits, credit, and underwriting data
        - High
        - BoT approved SCBX-led and Krungthai-led consortia alongside Ascend's own vehicle
        - Request product roadmap, launch timing, and capital plan relative to entrant capabilities
      - - Regional wallet-plus-bank convergence
        - Winning models increasingly combine payments with deposits, credit, and merchant tools
        - High
        - Grab, Sea/Monee, GoTo, Maya, and GCash all show deeper financial layering around payments
        - Request roadmap for savings, lending, and merchant-finance penetration inside TrueMoney cohorts
      - - Pricing opacity
        - Hard to benchmark monetization durability when public fee schedules are thin
        - Medium
        - Public pages emphasize rewards, free transfers, or lending rather than realized wallet take rates
        - Request merchant MDRs, incentive spend, and cohort-level net revenue after promotions
      - - Consolidation risk for smaller wallet brands
        - Suggests mid-tier wallets may need larger ecosystems to remain relevant
        - Medium
        - Rabbit LINE Pay was folded deeper into LINE MAN Wongnai rather than scaling as a cleaner standalone brand
        - Ask management where TrueMoney sees itself on the spectrum between open utility and ecosystem lock-in
    notes: >-
      Severity is a diligence judgment rather than a published metric. The register focuses on the
      risks that most directly change moat durability, not on every visible competitor headline.
