  evidenceGaps:
    - type: missing-source
      severity: material
      topic: thailand-wallet-share
      missingEvidence: >-
        The retained public source set does not contain a comparable Thailand-specific MAU or TPV
        table for TrueMoney, GrabPay, LINE Pay Thailand, and ShopeePay.
      whyItMatters: >-
        Without a like-for-like share table, competitive ranking can only be inferred from
        ecosystem breadth, distribution, and disclosed scale signals rather than hard market share.
      diligencePath: >-
        Request operator-level monthly active users, transacting users, TPV, merchant actives, and
        QR volume share directly from management or a Thai payments data vendor.
      relatedQuestionRefs:
        - QP010
        - QP026
      relatedTableRefs:
        - TP001
    - type: missing-source
      severity: material
      topic: wallet-pricing-opacity
      missingEvidence: >-
        Public consumer and merchant wallet fee schedules in Thailand are inconsistent, incomplete,
        or marketing-led, making clean cross-wallet pricing comparison hard.
      whyItMatters: >-
        Durable wallet economics depend on take rates, subsidy intensity, and credit or deposit
        monetization, none of which can be underwritten confidently from current public tariffs.
      diligencePath: >-
        Request merchant MDRs, cash-in and cash-out fees by channel, transfer-fee policies,
        promotional spend, and post-incentive net revenue by product.
      relatedQuestionRefs:
        - QP018
      relatedTableRefs:
        - TP003
    - type: private-evidence-only
      severity: material
      topic: agent-and-merchant-productivity
      missingEvidence: >-
        Public sources disclose TrueMoney's agent-network size but not active-agent productivity,
        merchant actives, or cohort-level retention versus bank-app substitutes.
      whyItMatters: >-
        Distribution is the core public moat claim, but the investment case depends on whether
        those nodes are active, profitable, and hard for rivals to displace.
      diligencePath: >-
        Request active-agent and merchant cohorts, monthly throughput, revenue per active node,
        churn, and cross-sell penetration into lending, remittance, and savings products.
      relatedQuestionRefs:
        - QP010
        - QP022
        - QP028
