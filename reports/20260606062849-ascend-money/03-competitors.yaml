company:
  name: Ascend Money
chapter:
  number: 3
  title: Competitive Landscape
  summary: >-
    Ascend Money's competitive set is broader than Thai wallet logos. TrueMoney still has real
    strengths in scale, agent reach, remittance and daily-use utility, but Thailand's default
    payment behavior increasingly sits inside PromptPay-connected bank apps while large
    super-apps, commerce ecosystems, and newly approved virtual banks attack adjacent parts of
    the same job. Regional evidence from Grab, Sea/Monee, GoTo, GCash, and Maya suggests the
    durable winners are combining distribution with deposits, lending, and merchant workflows,
    so Ascend Money's moat now depends less on closed-loop checkout access and more on turning
    wallet reach into primary-account behavior before bank-led entrants deepen competition.
sections:
  - id: competitive-landscape-overview
    title: Competitive Landscape Overview
    body: >-
      Ascend Money competes in a Thai payments market where the hardest rival is often not a
      standalone wallet at all. TrueMoney remains a serious regional consumer fintech platform:
      Ascend Money still claims 50 million users and customers served across six countries,
      21 million e-wallet users, and an 88,000-agent network, while the TrueMoney service menu
      reaches from bill pay, retail checkout, and PromptPay scan-pay to remittance and
      cross-border usage. But Thailand's payments stack is unusually open and bank-linked. IMF
      analysis and recent Thai reporting both point to PromptPay as the national low-cost,
      real-time backbone, with more than 90 million registrations and more than 74 million daily
      transactions by mid-2025. K PLUS, SCB EASY, and Krungthai NEXT already let users solve
      many wallet jobs directly inside bank apps, which means consumers do not need to leave
      incumbent rails to pay bills, move money, or scan QR.

      That structure changes what should count as a competitor. Direct peers still include
      GrabPay, LINE Pay Thailand, and ShopeePay, because each tries to own payment moments inside
      a larger consumer ecosystem. Yet the more important competitive picture also includes bank
      apps, cash and cards as status quo substitutes, and the two non-Ascend virtual-bank
      consortia that the Bank of Thailand approved in 2025. Regional benchmarks matter because
      they show where wallet competition is heading: Grab has already layered deposits and
      lending on top of super-app traffic; Sea's Monee is scaling payments and credit through
      Shopee's buyer and seller base; GoPay, DANA, and OVO illustrate how interoperable QR rails
      push competition toward lending, rewards, and convenience rather than exclusive acceptance.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP006
