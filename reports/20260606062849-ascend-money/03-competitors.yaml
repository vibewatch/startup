tables:
  - id: TP001
    title: Competitor Landscape by Class
    enumeration: true
    enumerationScope:
      coverage: partial
      basis: >-
        Material Thailand competitors, substitutes, and Southeast Asia benchmark platforms that
        illuminate the wallet/payments/fintech jobs Ascend Money must defend as of June 2026.
    columns:
      - Competitor / substitute
      - Class
      - Public scale signal
      - Product breadth
      - Distribution edge
      - Main limitation / caveat
    rows:
      - - TrueMoney / Ascend Money
        - Direct peer / subject platform
        - 50M served; 21M e-wallet users; 88k agents
        - Wallet, bills, retail QR, online shopping, entertainment, remittance, Pay Next
        - Agent network plus six-country regional footprint
        - Domestic moat is weaker than headline scale if PromptPay keeps commoditizing payments
      - - GrabPay
        - Adjacent super-app wallet
        - Grab crossed 50M MTUs in 2025
        - Ride, food, mart, express, subscriptions, wallet, transfer, rewards
        - Everyday super-app traffic and bank-linked funding
        - Thailand-specific wallet share not publicly disclosed in retained sources
      - - LINE Pay Thailand
        - Direct urban ecosystem wallet
        - 10M+ LINE MAN/Wongnai users; 500k+ merchants; 100k+ riders in connected ecosystem
        - Online/offline payment, BTS, AIS, LINE ecosystem checkout
        - Messaging, delivery, and merchant ecosystem in Bangkok-heavy flows
        - Standalone brand ambition narrowed after acquisition into LINE MAN Wongnai
      - - ShopeePay / Monee
        - Commerce-linked adjacent wallet
        - Sea served ~400M active buyers and 20M sellers in 2025; Monee added 20M+ first-time borrowers
        - Ecommerce checkout, payments, lending, financial services
        - Shopee transaction intent and seller ecosystem
        - Thailand-specific wallet usage not disclosed in retained sources
      - - Thai bank apps + PromptPay
        - Incumbent substitute
        - 90M+ PromptPay registrations; 74M+ daily transactions
        - Transfers, bill pay, QR, cardless cash, bank-linked funding
        - Existing account relationship and near-universal domestic relevance
        - Less distinctive rewards or lifestyle bundling than super-app wallets
      - - Cash and cards
        - Status quo substitute
        - Cash still important culturally; cards remain alternative rails
        - Universal offline tender and established checkout behavior
        - No onboarding or wallet migration required
        - Weakest data loop and lowest product cross-sell potential
      - - SCBX-led virtual bank
        - Likely entrant
        - Approved June 2025; THB 5B initial capital rising to THB 10B
        - Deposit, lending, AI-native banking, digital-first servicing
        - SCBX trust plus Kakao/WeBank digital-bank know-how
        - Not launched yet, so real customer adoption is unproven
      - - Krungthai-AIS-PTTOR virtual bank
        - Likely entrant
        - Approved June 2025
        - Bank, telco, and retail-led digital-bank offering
        - State-bank trust plus telecom and fuel/retail reach
        - Product detail and launch execution remain undisclosed
    notes: >-
      Scale signals are the most decision-useful public marker available for each class, but the
      retained source set does not contain a single Thailand-specific MAU or TPV dataset covering
      TrueMoney, GrabPay, LINE Pay Thailand, and ShopeePay on a comparable basis.
    claimRefs:
      - CP001
      - CP003
      - CP007
      - CP010
      - CP017
      - CP028
      - CP029
      - CP030
      - CP042
      - CP044
      - CP046
      - CP047
  - id: TP002
    title: Distribution, Trust, and Capability Comparison
    columns:
      - Dimension
      - TrueMoney
      - GrabPay
      - LINE Pay Thailand
      - ShopeePay / Monee
      - Thai bank apps / PromptPay
      - Benchmark signal
    rows:
      - - Daily-use payment context
        - Strong in bills, retail, online shopping, and remittance use cases
        - Strong in rides, food, mart, and subscriptions
        - Strong in LINE, LINE MAN, BTS, AIS, and merchant flows
        - Strong at commerce checkout and seller traffic
        - Strong in salary-linked transfers, bills, and domestic QR
        - Competing surface is contextual habit, not just wallet download count
      - - Bank-like product depth
        - Emerging; virtual bank approved but not launched
        - Growing via digital banks and lending
        - Moderate; ecosystem-led rather than deposit-led in retained sources
        - Stronger through Monee credit than pure wallet-only models
        - Strong by default inside deposit institutions
        - Maya/GCash benchmark shows depth can diverge from wallet-share leadership
      - - Cash in/out and offline reach
        - Strong via agents and retail presence
        - Moderate; wallet funding leans on bank apps and linked cards
        - Moderate; urban merchant and transit-heavy footprint
        - Moderate; strongest where Shopee traffic is high
        - Strong via branch, ATM, and bank-app rails
        - KBZPay benchmark shows cash handling remains important in cash-heavy markets
      - - Cross-border utility
        - Strong in regional remittance and overseas pay pages
        - Moderate via broader regional ecosystem
        - Limited in retained public source set
        - Moderate through regional commerce footprint
        - Limited for consumer travel use versus card/wallet specialists
        - DANA and PromptPay links show cross-border QR can matter at the margin
      - - Merchant / SME workflow
        - Moderate in retained public sources
        - Moderate and ecosystem-linked
        - Moderate through Wongnai merchant network
        - Strongest when seller checkout and lending are bundled
        - High for incumbent acquirers and bank relationships
        - Maya benchmark shows merchant acquiring can be a decisive wedge
      - - Trust / regulatory posture
        - Improving with BoT virtual-bank approval
        - Strong on payments security, weaker as primary bank relationship in Thailand
        - Improved through LINE brand and continued service continuity
        - Strong brand trust inside Sea ecosystem, but wallet-specific Thai posture is less visible
        - Strongest default trust because consumers already bank there
        - Virtual-bank entrants raise the trust bar for all wallet-led competitors
    notes: >-
      Unsupported cells are intentionally expressed as directional strengths rather than fake hard
      rankings. The table compares capability clusters that a Thai consumer or merchant actually
      cares about when choosing where to keep payments activity.
