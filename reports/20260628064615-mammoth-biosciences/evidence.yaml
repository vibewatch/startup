    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Realized instrument pricing, cartridge pricing, and enterprise discount structures for DETECTR, GeneXpert, cobas
      liat, ID NOW, BioFire, and QIAstat-Dx.
    whyItMatters: >-
