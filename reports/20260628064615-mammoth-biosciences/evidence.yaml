evidenceGaps:
  - gap: >-
      Post-Series D post-money valuation (most recent public valuation is >$1B from September 2021; no subsequent figure
      disclosed in retained sources).
    severity: high
    diligencePath: >-
      Request 409A valuation or most recent board-approved fair value from company; check if any secondary transactions
      have disclosed implied prices.
    relatedQuestionRefs:
      - QO011
    relatedTableRefs:
      - TO003
  - gap: Current headcount after 2023 (~35 cut) and 2025 (~24 cut) reductions; no precise figure available.
    severity: medium
    diligencePath: >-
      Request current organizational chart and headcount breakdown from company; check LinkedIn for approximate employee
      counts.
    relatedQuestionRefs:
      - QO021
  - gap: >-
      IND filing status for MB-111 or any other Mammoth therapeutic program; not confirmed in retained sources as of run
      date.
    severity: high
    diligencePath: Request company IND filing timeline and regulatory strategy; check ClinicalTrials.gov for any registered studies.
    relatedQuestionRefs:
      - QO023
  - gap: Revenue and ARR from partnership milestone payments or any commercial activity; not disclosed in retained sources.
    severity: medium
    diligencePath: >-
      Request partnership payment receipt history and forward milestone schedule from company; confirm accounting
      treatment of milestones.
    relatedQuestionRefs:
      - QO025
  - gap: Terms of the Horizon Discovery agreements (2019–2020) and current status of that collaboration.
    severity: low
    diligencePath: Check Horizon Discovery (now Revvity) public disclosures and any subsequent announcements.
    relatedQuestionRefs: []
  - gap: >-
      Current status of Bayer and Vertex collaborations, including any milestones achieved, program advancement, or
      modification since original announcements.
    severity: medium
    diligencePath: >-
      Request partnership status updates from company; review Bayer and Vertex public filings for any disclosed
      collaboration updates.
    relatedQuestionRefs: []
  - gap: Exact departure date and circumstances for Ashley Tehranchi (co-founder, original CTO).
    severity: low
    diligencePath: Request from company or search for public announcements; not critical to current governance assessment.
    relatedQuestionRefs: []
  - type: missing-source
    severity: material
    topic: market-sizing-gaps
    missingEvidence: >-
      A public or proprietary bottom-up SAM and SOM analysis for Mammoth's in vivo genetic medicines business, including
      expected (not ceiling) milestone economics and royalty-bearing revenue projections.
    whyItMatters: >-
      Without a SOM estimate, it is impossible to assess whether Mammoth's deal-dependent revenue model is consistent
      with its reported valuation; diligence buyers cannot model forward revenue without this input.
    diligencePath: >-
      Request from Mammoth: (1) pipeline target count under each deal, (2) stage-gated expected milestone values by
      program, (3) royalty-rate assumptions, and (4) competitive differentiation for each collaboration target versus
      alternative editing modalities.
    relatedQuestionRefs:
      - QM023
      - QM025
      - QM026
  - type: missing-source
    severity: minor
    topic: market-sizing-gaps
    missingEvidence: >-
      A 2026 announcement or update regarding new partnership deals or expanded collaboration scope from Mammoth
      Biosciences that may have been made after the corpus was fetched.
    whyItMatters: >-
      A new partnership could materially change the near-term revenue and market-access picture; the absence of evidence
      for a 2026 deal does not confirm no deal was signed.
    diligencePath: >-
      Monitor Mammoth's news feed, SEC EDGAR (if any disclosure is triggered), and pharma partner press releases through
      the second half of 2026 for collaboration updates.
    relatedQuestionRefs:
      - QM019
