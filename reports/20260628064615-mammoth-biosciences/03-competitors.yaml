    - Treat partner dependence as structural, not temporary, in underwriting Mammoth diagnostics optionality
  notes: Severity is qualitative and reflects commercial durability rather than scientific merit. Evidence is intentionally adverse-weighted because the key chapter question is whether DETECTR can realistically re-enter a market now controlled by scaled diagnostics operators.
