- id: TP004
  title: Switching cost and distribution power table
  columns:
  - Competitor class
  - Installed-base asset
  - Switching friction
  - Why it matters to Mammoth
  - Evidence-backed takeaway
  rows:
  - - Cepheid / Roche cartridge PCR
    - Instrument fleet + validated cartridge workflows
    - Re-training, connectivity, specimen-validation, procurement lock-in
    - Mammoth would need a partner or overwhelming workflow advantage to replace them
    - Closed disposable PCR systems are already embedded across decentralized care settings
  - - BioFire syndromic PCR
    - Broad panel menu + throughput + LIS connectivity
    - Labs lose panel breadth and throughput if they switch
    - DETECTR cannot win acute-care lab share on assay elegance alone
    - BioFire competes through comprehensiveness and operational throughput
  - - QIAGEN syndromic / standardized workflows
    - One-sample multiplex testing plus wider QIAGEN infectious-disease footprint
    - Workflow standardization and data/reporting habits create inertia
    - Mammoth must fit existing lab economics, not just invent a new chemistry
    - QIAGEN competes from institutional workflow breadth
  - - Abbott rapid molecular
    - Retail / urgent-care familiarity with fast decentralized testing
    - Speed-to-answer habits and CLIA-waived workflow familiarity
    - A CRISPR test has to be at least as simple as ID NOW to change behavior
    - Fast non-PCR NAAT is an incumbent substitute, not just a weaker technology
  - - OraSure / Sherlock
    - Consumer-health channel and public-health rapid-test infrastructure
    - Mammoth lacks comparable direct consumer channel today
    - Sherlock under OraSure is a more complete go-to-market package than Sherlock was standalone
    - Incumbent owner plus CRISPR startup is a tougher competitor than a startup alone
  - - Mammoth today
    - Historical DETECTR proof + partner optionality, but no visible active product fleet
    - Partner dependence and diagnostics retrenchment slow re-entry
    - The moat is licensable IP, not installed distribution
    - Mammoth is best positioned as a technology supplier unless it re-invests in diagnostics
  notes: This exhibit focuses on operational lock-in rather than analytical sensitivity because the retained sources support workflow and distribution differences more clearly than standardized head-to-head clinical performance data.
