callouts:
  - calloutType: insight
    title: Diagnostics TAM is a red herring for Mammoth's forward valuation
    body: >-
      Public analyst reports headline CRISPR-based diagnostics as a $6 billion-plus market in 2026 growing to
      $11.45 billion by 2030. Mammoth Biosciences is frequently listed among the companies in this market.
      However, Mammoth voluntarily revoked its COVID-19 EUA and laid off 35 diagnostics staff in 2023,
      explicitly exiting commercial diagnostics. Analysts and investors who apply the broad CRISPR diagnostics
      TAM to Mammoth are applying an irrelevant market frame. Mammoth's real market is the in vivo genetic
      medicines licensing market, which is smaller, longer-dated, and accessed through milestone economics
      rather than product revenue.
    claimRefs:
      - CM001
      - CM008
      - CM027
      - CM041

  - calloutType: risk
    title: No SAM or SOM is publicly derivable for Mammoth's in vivo therapeutics position
    body: >-
      Despite three disclosed pharma deals, Mammoth's serviceable addressable market cannot be quantified
      from public sources. Deal milestone ceilings exceed $2 billion in aggregate but are contingent on
      clinical and regulatory success across programs none of which has cleared Phase 1. The company's wholly-
      owned MB-111 program targets a rare disease (FCS) with an estimated US patient population in the low
      thousands. A diligence buyer must either accept this uncertainty or demand proprietary pipeline and
      royalty-rate disclosures to anchor any forward revenue model.
    claimRefs:
      - CM018
      - CM039
      - CM040
      - CM042

  - calloutType: assumption
    title: Partnership deal economics are the primary near-term market proxy
    body: >-
      In the absence of a public SAM for in vivo genetic medicines, this chapter treats the aggregate
      disclosed milestone ceiling from Regeneron, Vertex, and Bayer as the best available proxy for the
      range of economic value Mammoth could capture from its current partner relationships. This is an
      assumption, not a market estimate: milestones are ceiling values, not expected values, and
      royalty-bearing revenue requires approved products that are years away.
    claimRefs:
      - CM011
      - CM012
      - CM013
      - CM014

