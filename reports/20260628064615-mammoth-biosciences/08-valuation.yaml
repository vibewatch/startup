  - id: TV005
    title: Partnership economics
    columns:
      - Partner
      - Upfront economics
      - Milestone potential
      - Strategic read-through
    rows:
      - - Vertex
        - $41M upfront via convertible note and equity investment
        - Up to $650M across two programs plus royalties
        - Validates in vivo editing interest from a company already commercializing Casgevy with CRISPR Therapeutics.
      - - Bayer
        - $40M upfront
        - More than $1B across four disease programs plus low double-digit royalties
        - Shows large-pharma willingness to pay for Mammoth's editing toolkit despite preclinical stage.
      - - Regeneron
        - $100M upfront including $95M equity
        - Up to $370M per target plus 5%-15% royalties over a 5.5-year term
        - Freshest strategic endorsement, but still not a disclosed new valuation mark.
      - - Total
        - Approximately $181M in upfront economics across the three disclosed collaborations
        - Multi-billion aggregate milestone opportunity if programs advance
        - Strong strategic proof, but not a substitute for revenue or cash-burn disclosure.
    notes: >-
      Upfront totals reflect disclosed collaboration economics only and should not be read as recognized revenue, margin, or current cash balance.
