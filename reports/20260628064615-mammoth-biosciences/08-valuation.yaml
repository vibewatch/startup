  - id: TV006
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission
      - Action
    rows:
      - - Clinical slip
        - MB-111 misses the next communicated IND or first-patient milestone
        - Delays the only visible path from platform promise to human proof.
        - Cut the bull case and re-anchor near the bear/base boundary.
      - - Financing reset
        - New primary round prices below the low end of the base case without stronger disclosure
        - Confirms that private buyers are discounting the platform harder than current narrative implies.
        - Rebuild valuation from the new terms and likely downgrade posture.
      - - Partner stagnation
        - No visible milestone progression, scope expansion, or new target work from Regeneron, Vertex, or Bayer
        - Compresses the strategic premium supporting value above lower public peers.
        - Reduce conviction and treat partnership value as option-like rather than durable.
      - - Partner renegotiation
        - Collaboration scope narrows materially or economics are amended downward
        - Signals weaker platform pull-through and lower exit optionality.
        - Re-rate the company toward the low end of the range.
      - - Financial opacity persists
        - Management refuses to disclose cash, burn, runway, or preference stack during financing diligence
        - Raises the odds that headline valuation overstates economic value to new money.
        - Suspend diligence until financing transparency improves.
      - - Diagnostics fallback returns
        - Management shifts emphasis back to diagnostics without showing recurring commercial traction
        - Moves the story toward a lower-value fallback thesis rather than a therapeutics premium thesis.
        - Apply a sharper discount and revisit downside comps.
    notes: >-
      Triggers are monitorable events rather than generic risks so an investment committee can decide early whether the valuation thesis is breaking.
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV041
      - CV042

  - id: TV007
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Cash / runway
        - Current cash balance, monthly burn, and downside runway after layoffs and partnership receipts
        - Determines whether Mammoth can wait for clinical inflection or must raise defensively.
        - Request latest board materials, balance sheet, and 24-month cash forecast.
      - - Cap table / preferences
        - Fully diluted cap table, liquidation stack, partner side letters, and any note conversion terms
        - Headline valuation can overstate common-equity value if preference overhang is large.
        - Request financing documents and counsel-prepared cap-table memo.
      - - Collaboration accounting
        - Recognized revenue, deferred revenue, and cash actually collected from Vertex, Bayer, and Regeneron
        - Separates strategic headlines from operating traction.
        - Request ASC 606 schedules and partner contract summaries.
      - - MB-111 IND path
        - Remaining CMC, tox, and regulatory work before IND filing plus planned first-patient window
        - Clinical entry is the biggest swing factor in the valuation range.
        - Request development timeline with gating assumptions and budget.
      - - Partner program status
        - Target-level progress, milestone calendars, and internal resource allocation by collaboration
        - Clarifies whether milestone cash is near-term or still distant optionality.
        - Request program governance materials and latest joint-steering updates.
      - - Post-restructuring operating capacity
        - Headcount by function and hiring plan after the 35-person and 24-person layoff rounds
        - Tests whether Mammoth can execute internal and partnered work simultaneously.
        - Request org chart, approved hiring plan, and operating review deck.
    notes: >-
      Each ask ties directly to a valuation uncertainty that public sources cannot close, so this table doubles as the minimum viable private diligence list.
    claimRefs:
      - CV008
      - CV017
      - CV022
      - CV023
      - CV028
      - CV043
