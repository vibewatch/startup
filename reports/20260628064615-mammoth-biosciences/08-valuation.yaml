  - id: exit-and-diligence
    title: Exit paths, thesis-break triggers, and final diligence asks
    body: >-
      Mammoth's most plausible exits remain a later-stage IPO after early clinical proof or a strategic acquisition by an existing partner that wants full control of the platform. Regeneron, Vertex, and Bayer are the obvious logical acquirers because each has already spent real money to access Mammoth's CRISPR systems, but a true IPO path likely still requires an IND filing, first-patient dosing, and at least initial Phase 1 safety evidence. Until then, investors should focus less on upside storytelling and more on thesis-break triggers and diligence asks. The most important break conditions are clinical delay, partner stagnation, a financing reset, or management refusing to disclose cash runway and cap-table terms during a financing process. The highest-value diligence requests are current runway, preference stack, recognized collaboration revenue, target-level milestone timing, headcount after layoffs, and the MB-111 IND path. Those are the missing pieces that determine whether Mammoth deserves even a base-case private premium.
