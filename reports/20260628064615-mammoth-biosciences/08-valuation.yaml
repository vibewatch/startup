  - id: valuation-context
    title: Valuation context and private-market opacity
    body: >-
      Mammoth's valuation context is defined by one old price signal and several newer but incomplete strategic signals. In September 2021, Mammoth disclosed a $150 million Series D and retroactively disclosed a $45 million Series C, with coverage from MedCity News and Forbes framing the company as a unicorn valued above $1 billion. Pre-Regeneron venture financing therefore totaled roughly $255 million. In April 2024, Regeneron added a broader $100 million collaboration package that included a $95 million equity investment, but the announcement still did not disclose a new valuation mark, liquidation terms, or broader cap-table consequences. That matters because the company also does not disclose revenue, operating margins, cash, or burn, so investors cannot tell whether partnership cash is financing durable progress or merely extending runway. In practical underwriting terms, Mammoth is still a private, underdisclosed preclinical platform whose last hard price was set in a far looser biotech financing environment than the one public CRISPR names face in 2026.
    claimRefs:
