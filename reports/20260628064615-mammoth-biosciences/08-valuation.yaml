company:
  name: Mammoth Biosciences
chapter:
  number: 8
  title: Valuation
  summary: >-
    Mammoth Biosciences still has only one confirmed public valuation anchor: the September 2021 financing that pushed the company above $1 billion. Since then, the company has added real strategic proof through Vertex, Bayer, and Regeneron partnership economics, but it still has not disclosed revenue, burn, cash, cap-table terms, or a fresh priced round. The right recommendation is Track with low-medium confidence and high risk: wait for MB-111 to reach the clinic, for partnership cash generation to become visible against burn, or for entry pricing to reset toward compressed preclinical CRISPR peers.
sections:
  - id: investment-recommendation
    title: Investment recommendation and conviction
    body: >-
      Mammoth Biosciences earns a Track recommendation rather than Buy because the company-quality story is stronger than the price-discovery story. The positive case is real: Mammoth was founded around elite CRISPR science, still benefits from Jennifer Doudna's halo, and has won meaningful validation from Vertex, Bayer, and Regeneron, whose combined upfront economics total roughly $181 million. That is unusually strong external proof for a still-preclinical gene-editing platform. The problem is that valuation support lags the narrative. The last disclosed mark is the September 2021 unicorn round, the company has no public revenue or burn disclosure, and the Regeneron equity check did not publish a post-money valuation. Public CRISPR peers now span $5.40 billion for CRISPR Therapeutics down to $0.43 billion for Editas, showing that platform quality alone does not lock in premium pricing. On current evidence, Mammoth should stay on watch, not be chased. The call upgrades only if MB-111 reaches IND filing and first-patient dosing, partnership cash generation becomes visible against burn, or entry pricing resets to preclinical peer levels at or below Prime Medicine or Editas.
