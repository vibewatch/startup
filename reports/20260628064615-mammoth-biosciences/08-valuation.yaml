    - type: private-evidence-only
      severity: material
      topic: financial-opacity
      missingEvidence: >-
        Mammoth has not publicly disclosed current revenue, cash balance, burn rate, cap-table terms, or preference stack, so the chapter cannot normalize valuation against operating reality.
      whyItMatters: >-
        These missing metrics determine whether the 2021 unicorn mark still has support, whether partnership cash is extending runway meaningfully, and whether headline valuation overstates economic value to new investors.
      diligencePath: >-
        Request the latest board deck, detailed cap table, financing documents, cash forecast, and collaboration-accounting schedules during private diligence before treating TV004's peer range as investable pricing guidance.
