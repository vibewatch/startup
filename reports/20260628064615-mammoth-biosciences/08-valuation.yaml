  - id: TV004
    title: Comparable valuation table
    columns:
      - Company
      - Stage
      - Market cap / metric
      - Relevance to Mammoth
      - Limitation
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the verified June 2026 public CRISPR peer set retained for this chapter plus Caribou as a stage reference; market caps are cross-checked with CompaniesMarketCap and SEC filings where available, but the table is partial because private marks and some peers lack fully comparable disclosed metrics.
    rows:
      - - CRISPR Therapeutics
        - Approved-product CRISPR leader with Casgevy and public-company disclosure
        - $5.40B market cap
        - Shows the upper bound for a gene-editing platform with commercial validation.
        - Far more mature than Mammoth and already de-risked by an approved therapy.
      - - Beam Therapeutics
        - Clinical-stage precision-editing platform
        - $3.58B market cap
        - Useful premium comp for differentiated editing science in a public market.
        - Beam has stronger disclosure and active clinical programs that Mammoth lacks.
      - - Intellia Therapeutics
        - Clinical-stage in vivo editing platform
        - $2.33B market cap
        - Closest public reminder that in vivo editing platforms can still hold multi-billion value.
        - Intellia is both more mature and already heavily derated from prior peaks.
      - - Prime Medicine
        - Early clinical / precommercial prime-editing platform
        - $0.61B market cap
        - Good lower-middle anchor for a pre-revenue platform with scientific differentiation.
        - Prime is public and not a direct ultracompact-CRISPR analog.
      - - Editas Medicine
        - Restructured public CRISPR company
        - $0.43B market cap
        - Strongest downside warning that CRISPR category membership does not protect valuation.
        - Editas still has more public disclosure than Mammoth despite the lower market cap.
      - - Caribou Biosciences
        - Public gene-editing peer with Phase 1 allogeneic CAR-T trials
        - Market cap not retained from the verified source pack; used for stage context only
        - Highlights that Mammoth is earlier than some public peers even before valuation is compared.
        - Not directly usable for exact valuation benchmarking in this chapter because a verified market-cap figure was not retained.
    notes: >-
      Table intentionally mixes exact June 2026 market-cap snapshots with one stage-only peer; the goal is stage-aware valuation framing, not false precision from a single multiple.
