  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Type
      - Argument
      - Supporting Evidence
      - What Would Change the View
    rows:
      - - Thesis
        - Nobel-linked CRISPR science plus three blue-chip pharma partners gives Mammoth more external validation than a typical preclinical platform.
        - Vertex, Bayer, and Regeneron collectively provided about $181 million of upfront economics and large milestone pools.
        - The thesis strengthens if MB-111 reaches the clinic and a partner begins paying visible milestones.
      - - Thesis
        - Ultracompact editors can justify a strategic premium if they solve delivery constraints that limit larger CRISPR systems.
        - Public peers still support multi-billion market caps for differentiated gene-editing platforms with stronger stage proof.
        - The thesis strengthens if Mammoth publishes translational data that narrows the stage gap to Beam or Intellia.
      - - Thesis
        - Mammoth still has more than one credible exit path because current partners could become acquirers once the platform is clinically de-risked.
        - Regeneron, Vertex, and Bayer already know the technology and have contractual relationships in place.
        - The thesis strengthens if one partner deepens scope, extends term, or adds new targets.
      - - Anti-thesis
        - The last confirmed price is stale and dates to the 2021 biotech bull market rather than the compressed 2026 CRISPR market.
        - No fresh priced round or disclosed valuation mark has been published since the 2021 unicorn financing.
        - The anti-thesis weakens if a new primary round resets terms on attractive economics.
      - - Anti-thesis
        - Mammoth remains preclinical and financially opaque, so investors cannot anchor on revenue, burn, or near-term clinical proof.
        - No public revenue, margin, or runway disclosure appears in retained sources, and MB-111 has not yet entered human trials.
        - The anti-thesis weakens if management discloses runway and achieves IND filing plus first-patient dosing.
      - - Anti-thesis
        - Public CRISPR comps show severe multiple compression once execution or financing confidence fades.
        - Intellia's decline from roughly $8.79 billion to $2.33 billion and Editas's restructured status show how quickly platform premiums can compress.
        - The anti-thesis weakens if the sector re-rates upward and Mammoth earns stage progress at the same time.
    notes: >-
      Rows separate company quality from entry-price quality so the recommendation stays price-sensitive rather than narrative-driven.
