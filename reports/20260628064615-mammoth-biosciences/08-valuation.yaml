  - id: scenarios
    title: Bull, base, and bear scenarios
    body: >-
      A scenario framework is more defensible than DCF or revenue-multiple precision because Mammoth has no disclosed operating metrics. The bull case supports an implied $2 billion to $4 billion range if MB-111 reaches the clinic on time, partner programs generate milestone-bearing progress, and investors continue to reward ultracompact CRISPR as a differentiated delivery-enabling platform. The base case is narrower at roughly $0.8 billion to $1.5 billion: Mammoth retains genuine strategic value, but public evidence still justifies a discount for preclinical stage, financial opacity, and sector compression. The bear case drops below $0.8 billion if MB-111 slips, partnerships stagnate, or Mammoth needs fresh capital before human proof-of-concept. In other words, the stale unicorn mark is not obviously wrong, but it no longer deserves to be treated as the center of gravity. It sits between the top of the base case and the low end of the bull case, not as a default fair value.
