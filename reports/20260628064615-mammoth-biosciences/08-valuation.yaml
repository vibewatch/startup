  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Key assumptions
      - Implied valuation
      - Probability signal
      - Key downside trigger
    rows:
      - - Bull
        - MB-111 files an IND and doses first patients, at least one partner program progresses into milestone-bearing development, and the CRISPR public comp set remains constructive.
        - $2.0B-$4.0B
        - Requires visible clinical entry plus strategic cash-flow proof, neither of which is public today.
        - Clinical delay or partnership stagnation before the next financing event.
      - - Base
        - Mammoth stays strategically relevant and partner-backed, but remains private, preclinical, and only partially disclosed.
        - $0.8B-$1.5B
        - Best fits the current evidence set and places the 2021 unicorn mark near the high end rather than the center.
        - Financing need before human proof or a weak private-market price discovery event.
      - - Bear
        - MB-111 timing slips, partner milestones stay remote, or sector sentiment weakens further before Mammoth re-prices.
        - <$0.8B
        - Becomes likelier if management must raise capital defensively or if a collaborator reduces commitment.
        - Down round, partner renegotiation, or prolonged preclinical status.
    notes: >-
      Scenario values are underwriting ranges, not management guidance; they reflect stage, market-regime, and disclosure-quality discounts rather than DCF precision.
