  - id: comparable-analysis
    title: Comparable analysis and sector derating
    body: >-
      The best public comp set for Mammoth is not a single-point valuation method but a stage-aware range. CRISPR Therapeutics still commands about $5.40 billion, helped by approved-product status. Beam trades near $3.58 billion and Intellia near $2.33 billion, both supported by public-company disclosure and clinical progress that Mammoth does not yet have. Prime Medicine at about $0.61 billion and Editas at about $0.43 billion are the more sobering preclinical-or-restructured anchors for what a gene-editing platform can be worth when the market discounts execution risk and financing uncertainty. Caribou adds another useful read-through: it has Phase 1 CAR-T activity, so even a company with active clinical work is not a perfect premium comp for Mammoth's still-preclinical profile. The biggest message from the peer set is not that Mammoth must trade at any one number; it is that stage, disclosure quality, and market regime now matter far more than category membership. Intellia's fall from a roughly $8.79 billion peak to about $2.33 billion reinforces how much 2021-era CRISPR enthusiasm has compressed.
