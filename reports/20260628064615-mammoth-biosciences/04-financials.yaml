- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Why it matters
  - Exact diligence path
  rows:
  - - Cash and cash equivalents
    - Blocks runway calculation
    - Historic fundraises do not reveal current liquidity
    - Request latest audited or board-level balance sheet and monthly cash roll-forward
  - - Monthly burn and operating plan
    - Blocks capital-adequacy test
    - Layoffs show resizing, but not whether burn is controlled
    - Request quarterly operating cash burn since 2023 and current 12-month budget
  - - Collaboration revenue recognition
    - Blocks revenue-quality assessment
    - Cannot separate financing, deferred revenue, and recognized revenue from public partner announcements
    - Request ASC 606 policy, contract liability balances, and partner-by-partner revenue bridge
  - - Diagnostics revenue history
    - Blocks judgment on whether diagnostics ever became a durable business
    - RADx/EUA/GSK prove demand and validation, not realized sales quality
    - Request historical DETECTR sales, contract revenue, gross margin, and end-customer list
  - - Current headcount after 2025 restructuring
    - Blocks capacity assessment
    - Execution ability for MB-111 plus partner programs depends on current team depth
    - Request org chart, FTE count by function, and hiring plan
  - - Segment gross margin
    - Blocks operating-leverage analysis
    - Therapeutics collaborations, diagnostics, and manufacturing support can have very different economics
    - Request segment-level gross profit and major cost buckets
  notes: All six gaps are material. Clearing even half of them would materially improve confidence in Mammoth’s financial underwriting case.
