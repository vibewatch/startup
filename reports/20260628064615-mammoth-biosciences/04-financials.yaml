- id: what-is-still-missing-for-underwriting
  title: What is still missing for underwriting
  body: |-
    Despite unusually rich partner economics for a private platform company, Mammoth still fails the standard public-data underwriting test. No retained source discloses current cash and equivalents, a monthly burn rate, recognized revenue by partner, gross margin on diagnostics or collaboration revenue, headcount after the 2025 restructuring, or a reconciliation between financing proceeds and operating revenue. That means any attempt to model payback, operating leverage, or runway numerically would be false precision.

    The missing item that matters most is accounting clarity. The Regeneron package combines strategic equity and upfront consideration; Vertex includes a convertible note; milestone ladders are large but entirely contingent. Without a CFO bridge showing equity proceeds, deferred revenue, recognized collaboration revenue, cash collections, and forecast milestone timing, even experienced investors cannot tell whether Mammoth is capital-abundant or simply headline-rich. The same gap applies to diagnostics history: RADx, GSK, EUA, and manufacturing scale-up proved commercial interest, but public sources never show whether DETECTR became a meaningful revenue line.

    The financial verdict is therefore mixed but actionable. Revenue-quality quality is medium for collaboration economics already signed, low for future milestone ceilings, and low-to-zero for current product revenue because no active commercial diagnostics sales base is publicly visible. Margin path, burn rate, and runway remain diligence blockers, not modeling inputs.
