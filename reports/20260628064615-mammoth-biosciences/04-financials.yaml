  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-balance
    missingEvidence: Current cash and cash-equivalents balance plus board-approved cash forecast.
    whyItMatters: Runway cannot be underwritten from historical rounds and partnership headlines alone.
    diligencePath: Request latest balance sheet, 13-week cash roll-forward, and management runway case.
    relatedQuestionRefs:
    - QI018
    - QI020
  - type: private-evidence-only
    severity: blocking
    topic: burn-rate
    missingEvidence: Quarterly or monthly burn by function since 2023.
    whyItMatters: Layoffs are only directional burn signals; investors need the actual operating cash burn to assess adequacy.
    diligencePath: Request CFO operating plan and historical operating cash-flow bridge.
    relatedQuestionRefs:
    - QI019
  - type: private-evidence-only
    severity: material
    topic: collaboration-accounting
    missingEvidence: Partner-by-partner split between equity proceeds, recognized revenue, deferred revenue, and future milestone probability.
    whyItMatters: Without this bridge, headline economics can overstate current earning power and liquidity.
    diligencePath: Request ASC 606 memos, contract summaries, and revenue-recognition schedules for Regeneron, Vertex, and Bayer.
    relatedQuestionRefs:
    - QI017
    relatedTableRefs:
    - TI002
    - TI004
