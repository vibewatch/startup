      - number: '6.3'
        title: 持久性缺口与集中度
        blocks:
          - type: paragraph
            body: >-
              Mammoth 客户章节真正的弱点不是缺
              logo，而是缺持久性指标。留存公开来源没有披露活跃客户数、在运行合作伙伴项目数、NRR、GRR、流失、可被引用的续约历史、满意度或诊断复购数据。因此，投资者只能从交易结构和战略行为推断质量，而不能靠
              cohort 数学来判断。这个推断对治疗合作伙伴方向上是正面的——三家大型交易对手支付了真实预付款，并接受长期里程碑——但仍不完整。即便是最好的公开留存代理，即 Regeneron
              协议结构，也反映的是合同访问权和选择权，而不是已观察到的扩张行为。


              集中度是第二个主要问题。公开客户证明集中在 Regeneron、Vertex、Bayer、NIH 期间的诊断支持，以及现在的 M42 / Abu Dhabi。诊断业务看起来也更像历史而非当前业务：COVID
              EUA 阶段带来真实验证，但这些授权被撤销，加上 Mammoth 2023 年和 2025 年重组，意味着管理层不再把诊断视为主要商业引擎。这并不抹去 DETECTR 的价值；它把 DETECTR
              重新定位为技术和监管能力证明，而不是可见的经常性业务。承销结论因此有细微差别但很清楚：Mammoth 有真实客户信号，尤其在治疗合作上；但客户持久性和多元化仍是披露不足的尽调项目。
