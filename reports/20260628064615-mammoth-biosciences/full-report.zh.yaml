      - number: '7.3'
        title: 合作伙伴、融资与执行风险
        blocks:
          - type: paragraph
            body: >-
              最后一组主要风险是业务执行。公开证明集中在三家生物制药交易对手——Regeneron、Vertex 和 Bayer——其中 Regeneron
              的战略可见度显然最高，因为它结合了近期经济条款、肝脏之外的递送雄心，以及广泛技术访问权。这是支撑因素，但也意味着 Mammoth 的公开变现故事异常依赖少数伙伴，而这些伙伴的内部优先级可能变化。新的 Abu
              Dhabi / M42 合作方向上正面，因为它扩展生态触达和制造雄心，但也增加一层执行要求：场地准备、能力转移和建设都需要资金和管理层带宽。


              2023 年和 2025 年连续裁员让带宽问题更重要。裁员不能证明公司陷入困境——管理层明确称公司财务状况强劲——但确实证明了优先级压力，也在 Mammoth 试图进入临床时削减了一些冗余。由于 Mammoth
              是私人公司，投资者无法用当前现金、烧钱或跑道披露来抵消这种不确定性。实际结论是，Mammoth
              仍可凭战略价值获得融资，但在尽调补齐四个缺口前，剩余风险评级应保持高位：跑道、人体安全准备度、按经济条款衡量的伙伴集中度，以及当前组织能力。
