        - 基于仪器的工作流，对基础设施要求仍高于一次性格式
      - - Abbott ID NOW
        - 快速分子检测存量厂商
        - 大型快速诊断存量厂商
        - 面向去中心化场景的 CLIA 豁免等温 NAAT
        - 呼吸道工作流很快，与零售 / 急诊护理高度契合
        - 不是 CRISPR，多重化 / 菜单深度也弱于大型 PCR 综合征系统
      - - bioMérieux BioFire 系统
        - 综合征 PCR 存量厂商
        - 高通量 TORCH 平台，面板组合广
        - 嵌套多重 PCR 综合征面板
        - 菜单广度、通量和医院实验室信任度突出
        - 不如 DETECTR 愿景便携，也更少面向消费者
      - - QIAGEN QIAstat / NeuMoDx
        - 综合征 + 标准化分子检测存量厂商
        - QIAstat 加更广感染病组合，诊断足迹广
        - 基于试剂盒的综合征检测，加更广的标准化工作流
        - 单样本多重工作流，并有更广的实验室标准化存在感
        - 靠机构工作流强度竞争，而不是轻量 POC 简洁性
