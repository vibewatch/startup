chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与创立
        blocks:
          - type: paragraph
            body: >-
              Mammoth Biosciences, Inc. 是一家总部位于加州 Brisbane（旧金山湾区）的私营生物技术公司。官方材料反复表述的使命是：开发长期治愈性疗法，兑现 CRISPR 技术承诺，改变患者生活。

              公司于 2017 年共同创立（注册），2018 年 4 月公开亮相；团队根植于 University of California, Berkeley 的 Jennifer Doudna 实验室和 Stanford
              University。发布时的创始团队包括 Trevor Martin（CEO，Stanford PhD）、Ashley Tehranchi（发布时任 CTO，Stanford PhD）、Janice
              Chen（Berkeley PhD 学生，现任 CSO 兼研究总裁）、Lucas Harrington（Berkeley PhD 学生，现任首席科学官）以及 Jennifer Doudna（2020
              年诺贝尔化学奖得主、CRISPR 共同发明人，现任 SAB 主席兼联合创始人）。发布新闻稿也将 Ashley Tehranchi 列为联合创始人，但她到 2019 年 5 月前后已离开 CTO 职位；Doudna
              有时被描述为共同发明人创始人，而非运营型创始人。

              创立之初，公司把自己定位为打造全球首个基于 CRISPR 的疾病检测平台，目标是 $45 billion 全球诊断市场，产品形态为信用卡大小的即时检测纸条。专有 CRISPR
              蛋白发现引擎——用宏基因组搜索识别并表征新型 Cas 系统（Cas12、Cas13、Cas14、CasΦ）——构成科学基础。2020 年，Mammoth 将基于 Cas12 的 DETECTR 平台用于
              COVID-19 诊断，并为 SARS-CoV-2 RNA DETECTR Assay 获得 FDA 紧急使用授权。

              2022 年末至 2023 年战略评估后，公司正式把主要重心转向体内基因编辑治疗，并弱化诊断。截至运行日，Mammoth 的商业模式是：（1）基于超小型 CRISPR
              系统自建全资体内基因编辑治疗管线；（2）与大型药企开展平台授权和合作，合作方将 Mammoth 专有超小型 CRISPR 酶与自身递送技术结合使用。公司的竞争差异化来自 Cas 蛋白体积小：Cas14 约 530
              个氨基酸，CasΦ 约 757 个氨基酸，均不到 Cas9 的一半，因此可把编辑器整体装入单个 AAV 衣壳，用于向肝外组织体内递送。
