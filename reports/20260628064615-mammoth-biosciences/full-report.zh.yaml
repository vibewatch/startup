            body: >-
              Mammoth 最可能的退出仍是早期临床证明后的后期 IPO，或由希望完全控制平台的现有合作伙伴进行战略收购。Regeneron、Vertex 和 Bayer 是显而易见的逻辑收购方，因为三者都已经花真金白银获取
              Mammoth 的 CRISPR 系统；但真正的 IPO 路径很可能仍需要 IND 申报、首例患者给药，以及至少初步 Phase 1
              安全性证据。在此之前，投资者应少看上行故事，多盯论点破裂触发因素和尽调要求。最重要的破裂条件是临床延误、合作伙伴停滞、融资重置，或管理层在融资过程中拒绝披露现金跑道和 cap table
              条款。最高价值的尽调请求包括当前跑道、清算优先权栈、已确认合作收入、靶点层面的里程碑时点、裁员后员工数，以及 MB-111 IND 路径。这些缺失部分决定 Mammoth 是否配得上哪怕基准情景下的私人市场溢价。
