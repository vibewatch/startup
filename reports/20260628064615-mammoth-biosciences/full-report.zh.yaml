  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: Mammoth 在战略验证上得分最高，在当前经济账和价格发现的可见度上最弱。
    data:
      items:
        - label: 科学谱系
          value: 8/10
          detail: 创始叙事和 CRISPR 可信度在私营平台型生物科技中仍然异常强。
          tone: positive
        - label: 合作方验证
          value: 9/10
          detail: 三家大型药企交易对手已承诺有意义的经济账。
          tone: positive
        - label: 临床成熟度
          value: 3/10
          detail: MB-111 仍是第一个内部临床候选药物，Mammoth 仍处于临床前阶段。
          tone: warning
        - label: 财务披露
          value: 2/10
          detail: 本章没有保留公开收入、利润率、烧钱速度或现金披露。
          tone: negative
        - label: 估值可见度
          value: 3/10
          detail: 最后一个硬估值标记来自 2021 年，Regeneron 未发布新的投后估值。
          tone: negative
        - label: 下行不对称
          value: 4/10
          detail: 融资重置或合作方放缓可能快速压缩价值。
          tone: warning
        - label: 退出可选性
          value: 7/10
          detail: 如果进入临床，现有合作方构成可信的战略收购方集合。
          tone: positive
        - label: 观察名单优先级
          value: 8/10
          detail: Mammoth 值得主动监测，因为少数几个里程碑就可能迅速改变判断。
          tone: positive
    approximationNotes: null
    claimRefs:
