  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型和合作经济性
        blocks:
          - type: paragraph
            body: >-
              Mammoth 的前瞻收入模型最好理解为合作经济性加长期治疗可选性，而不是已规模化的诊断运营业务。官方页面和合作方公告指向三个活跃变现渠道。第一，Mammoth
              与大型生物制药合作方签署平台合作，后者支付预付现金和 / 或股权，以获取其超小型 CRISPR
              系统。第二，这些交易包含里程碑阶梯，只有合作项目穿过研究、开发、监管和商业关口后，才可能变得有意义。第三，成功产品可以带来版税；在 Regeneron 结构下，如果 Mammoth
              选择共同出资某些项目，还可获得利润分享经济性。按账面条款 看很有吸引力，但其行为完全不像签约 SaaS ARR，也不像商业诊断耗材业务。


              对一家临床前平台公司而言，公开条款强得少见。Regeneron 于 2024 年 4 月同意提供总额 $100 million 的预付款对价，其中包括 $95 million 股权投资；每个靶点最高 $370
              million 里程碑付款；个位数到中双位数版税；以及 Mammoth 对多数项目的选择加入式 共同出资 / 利润分享权。Vertex 于 2021 年同意支付 $41 million
              预付款，其中包括一笔可转债投资，另有两个适应症合计最高 $650 million 的未来里程碑付款和分层版税。Bayer 于 2022 年同意支付 $40 million
              预付款、研究经费、低双位数版税，以及五个预选体内适应症合计可能超过 $1 billion 的里程碑经济性。这些条款显示，买方对该平台有很强的付费意愿。


              但交易名义金额不等于当前收入质量。公开记录没有拆分股权收益和合作收入，也没有披露非股权预付款中已有多少被确认，更没有展示里程碑时点或概率。因此，Mammoth
              虽然有清晰变现路径和强战略验证，却仍缺少把交易标题转成可靠收入基底所需的会计细节。
