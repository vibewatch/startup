      - number: '2.4'
        title: 增长驱动、采用约束和结构性壁垒
        blocks:
          - type: paragraph
            body: >-
              体内遗传药物的宏观增长逻辑很有吸引力：2023 年 12 月 FDA 批准 exa-cel，验证了 ex vivo CRISPR
              基因疗法作为一个类别，也证明监管机构可以在可控时间线内批准复杂基因编辑疗法。Intellia 针对 ATTR 的体内 LNP-CRISPR 项目（Nex-z /
              NTLA-2001）已进入早期临床试验，验证了用于体内基因编辑的 LNP 肝脏递送。Beam Therapeutics 针对多种肝病的碱基编辑项目已处于 Phase 1/2 临床试验，包括 alpha-1
              antitrypsin 缺乏症和 GSDIa。这些先例合在一起，为 MB-111 这类项目的监管和临床框架降低了风险。

              与此同时，采用约束是结构性的，单靠临床前数据很难跨过去。AAV 约 4.7 kilobases 的载荷容量是核心物理约束：第一代 Cas9（1,368 个氨基酸，SpCas9）和 Cas12a（>1,200
              个氨基酸）与 guide RNAs 和调控元件组合后，会超过单 AAV 包装上限。Mammoth 的 NanoCas（约为 Cas9 三分之一大小）在临床前模型中应对这一约束，通过单 AAV 在 NHP
              骨骼肌中实现最高 30% 编辑——但这些仍是预印本阶段结果，尚未在人体试验中复现。NHP 疗效与人体治疗阈值之间的差距，是实质性采用约束。

              资本强度是第二个主要壁垒。Phase 1–3 基因疗法项目在获批前，开发成本通常超过数亿美元。Mammoth 的合作模式把大部分风险转给药企合作方，但也意味着 Mammoth
              只能通过版税捕获最终经济价值的一部分。对 MB-111 这样的全资项目而言，资本强度直接约束进临床速度。

              超小型核酸酶作为新类别，监管不确定性是第三个约束。NanoCas 和 CasPhi
              尚未用于任何获批人体治疗，因此监管包（安全性、脱靶、CMC）需要从零搭建。这些新型核酸酶的基因毒性、免疫原性和长期持续性，都是开放尽调问题。与此同时，更广泛行业背景并非一片顺风：Editas Medicine
              在终止领先基因编辑项目后，于 2024 年 12 月裁掉 65% 员工，说明科学承诺并不保证商业执行。Prime Medicine 的同类首创 prime editing 路径据 2025 年 12
              月报道已在两名 CGD 患者中实现「有效治愈」，这个竞争里程碑验证了更广义下一代 CRISPR 空间，也抬高了 Mammoth 的竞争门槛。

              平台选择的切换成本很高，因为药企合作方会把制造和临床基础设施绑定到特定 Cas 酶库；这创造了持久合作价值，也意味着新平台进入者要替代既有关系，门槛很高。
