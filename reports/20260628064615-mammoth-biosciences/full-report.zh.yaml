      - number: '2.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 诊断 TAM 是 Mammoth 前瞻估值的干扰项
            body: >-
              公开分析师报告把基于 CRISPR 的诊断描述为 2026 年超过 $6 billion、到 2030 年增至 $11.45 billion 的市场。Mammoth Biosciences
              经常被列入这个市场中的公司。然而，Mammoth 于 2023 年主动撤销 COVID-19 EUA，并裁撤 35 名诊断员工，明确退出商业诊断。把广义 CRISPR 诊断 TAM 套到 Mammoth
              身上的分析师和投资者，使用的是无关市场框架。Mammoth 的真实市场是体内遗传药物授权市场，规模更小、兑现更晚，并通过里程碑经济性而非产品收入进入。
