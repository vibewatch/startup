      - number: '2.3'
        title: 买方、用户与支付方分层，预算归属和采用路径
        blocks:
          - type: paragraph
            body: >-
              Mammoth 的买方版图分成三个结构完全不同的群体，它们运行在不同时间线、预算周期和采用触发点上。把它们合并成一个买方画像，会扭曲真实的上市路径。

              第一个，也是最直接相关的群体，是作为平台被授权方和共同开发方的大型药企。Regeneron、Vertex 和 Bayer 都支付了可观预付款，以获取 Mammoth 超小型 CRISPR
              技术并用于特定体内项目。预算所有者是这些公司的商务拓展和 R&D 领导层；用户是其基因治疗团队；支付方是企业资本，而非保险或政府报销体系。采用触发点包括：被证明的递送优势（载荷尺寸小于 Cas9，可实现单 AAV
              递送）、一个肝脏之外且原本难以进入的特定靶组织，以及相较既有玩家的平台差异化。Mammoth 的近期收入来自这个买方群体，由交易经济性、IP 条款和临床前数据质量驱动。

              第二个群体在 Mammoth 全资 MB-111 项目推进到商业化时才相关，由罕见病处方医生和支付方构成。医生（代谢病专家、胃肠病医生、肝病医生）会为 FCS 或 SHTG
              疗法开方；患者是最终用户；支付方则是商业保险和政府项目的混合体（Medicaid、欧洲国家医疗体系）。该群体的采用触发点与药企合作方群体根本不同：需要临床试验成功、监管批准、有利的 ICER 和 HTA
              评估，以及医生对一次性基因编辑模态的信心。预算路径是专科药房和罕见病报销框架，而非企业 R&D 资本开支。考虑到截至 2026 年中 MB-111 仍处于支持 IND
              申报的阶段，该群体至少还要数年才会进入实际接触。

              第三个群体如今基本关闭，曾是购买 CRISPR 感染病检测的临床系统、诊断实验室和政府买方。COVID-19 疫情期间，政府机构（NIH RADx 项目授予 Mammoth $23.1
              million）和医院系统是买方。消费者 / POC 路线中的商业合作方是 GSK Consumer Healthcare。临床决策者是实验室主任或医院
              C-suite；支付方则是政府合同或分子检测保险报销。Mammoth 已退出商业诊断市场，因此该买方群体不再活跃。
