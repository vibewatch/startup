      - number: '1.3'
        title: 资本基础、投资者与战略合作
        blocks:
          - type: paragraph
            body: >-
              Mammoth Biosciences 已披露四轮股权融资。2018 年 7 月，公司宣布由 Mayfield（Ursheet Parikh）领投的 $23 million Series A，NFX 和 8VC
              参投；此前已有 AME Cloud、Wireframe、Kairos 和 Boom Capital 等种子期支持。2020 年 1 月，公司宣布由 Decheng Capital 领投的 $45 million
              Series B，Mayfield、NFX、Verily、Brook Byers、Plum Alley、Pacific 8、aMoon 等参投。2021 年 9 月，Mammoth
              同时披露两轮此前未公布的融资：Redmile Group 与 Foresite Capital 领投、Amazon 和其他早期投资者参投的 $45 million Series C（2020 年末完成），以及
              Redmile Group 领投，Foresite Capital、Senator Investment Group、Sixth Street、Mayfield、Decheng Capital 和 NFX 参投的
              $150 million Series D。MedCity News 和 Forbes 均报道称，2021 年合计 $195 million 的公告把 Mammoth 估值推至 $1 billion
              以上（独角兽状态）。

              2024 年 4 月，Mammoth 与 Regeneron Pharmaceuticals 宣布广泛合作，把 Mammoth 的超小型 CRISPR 系统与 Regeneron 的抗体靶向 AAV
              递送平台配对。根据条款，Mammoth 获得 $100 million，包括 $95 million 股权投资和一笔预付款；每个靶点最高可获得 $370 million
              的开发、监管和商业里程碑付款；并按净销售额获得个位数到中双位数百分比的版税。Mammoth 还可选择加入大多数合作项目的共同出资和利润分享。

              2021 年 10 月，Mammoth 与 Vertex Pharmaceuticals 宣布就两个体内基因编辑适应症开展合作。Vertex 同意支付 $41 million
              预付款（包括一笔可转债投资），两个项目合计最高 $650 million 里程碑付款，另有分层版税。2022 年 1 月，Bayer AG 宣布与 Mammoth 就四个疾病领域的基因编辑技术达成合作协议，预付款
              $40 million，潜在里程碑付款可能超过 $1 billion。

              四轮已披露股权融资合计约 $263 million（$23M + $45M + $45M + $150M），不含未披露种子轮；加上 2024 年 Regeneron $95 million
              股权投资，已披露股权投资总额约 $358 million，尚未计入 Vertex 可转债或 Bayer 股权成分。Series D 后估值超过 $1
              billion；之后未披露任何投后估值。留存来源未披露收入、ARR 和债务工具。
