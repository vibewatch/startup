  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 推荐结论从有吸引力的科学和合作方证明出发，穿过财务不透明和板块压缩，最后落到继续跟踪。
    data:
      nodes:
        - id: market
          label: 市场
          detail: CRISPR 诊断和基因编辑市场仍然庞大且在增长，因此 Mammoth 仍处在一个真实的长周期品类中。
        - id: technology
          label: 技术
          detail: 超紧凑 CRISPR 仍是差异化科学叙事，但仍缺少人体证明。
        - id: partners
          label: 合作方
          detail: Vertex、Bayer 和 Regeneron 以约 $181M 的首付款经济账验证平台兴趣。
        - id: financials
          label: 财务
          detail: 公开来源没有披露收入、现金、烧钱速度和当前估值条款。
        - id: risk
          label: 风险
          detail: Mammoth 处于临床前阶段，暴露于板块估值倍数压缩和融资不确定性。
        - id: valuation
          label: 估值
          detail: 在 2026 年 CRISPR 市场，过时的 2021 年独角兽估值已不足以作为公允价值锚。
        - id: recommendation
          label: 推荐
          detail: 在进入临床、出现可见现金生成证据，或更低进入价格改善交易结构之前，保持跟踪。
      edges:
