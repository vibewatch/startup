  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户结构与市场进入路径
        blocks:
          - type: paragraph
            body: >-
              Mammoth 的客户故事其实是一家公司里的三条客户故事。第一条、也是现在最重要的一条，是大型生物制药：Regeneron、Vertex 和 Bayer 不只是战略 logo，而是为获取 Mammoth 超紧凑
              CRISPR 系统而支付预付款经济条款的交易对手。第二条是历史性的诊断渠道，COVID 期间触达过联邦资助的规模化、制造伙伴和受监管 CLIA 实验室流程。第三条是正在形成的生态系统开发，代表是 2026 年
              Abu Dhabi / M42 / DoH 合作；这里的价值交换较少来自即时产品收入，更多来自临床研究准入、制造能力建设和未来地理覆盖。


              这些细分市场共通的 GTM 逻辑是：Mammoth 卖的是平台杠杆，而不是一大目录成熟终端产品。官方页面把合作伙伴关系描述为把 CRISPR 组合转化为前沿应用的机制；诊断页面也明确称 DETECTR 可由
              Mammoth
              或其伙伴整合进产品。这一点重要，因为它解释了为什么客户证明在漏斗顶部很强——知名交易对手、监管里程碑、政府支持——但在漏斗底部偏薄；投资者在那里想看到的是活跃账户数、留存、复购频率或装机基础扩张。Mammoth
              有可信买家和用户；它没有公开的 SaaS 式客户分析。
