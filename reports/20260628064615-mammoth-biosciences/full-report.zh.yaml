      - number: '3.3'
        title: 差异化、IP 相关性和切换成本
        blocks:
          - type: paragraph
            body: >-
              技术上，Mammoth 仍然有真实故事。独立综述在机制层面区分 SHERLOCK 和 DETECTR——SHERLOCK 工作流面向 RNA，使用 Cas13；DETECTR 使用
              Cas12——这些综述也认为，即便既有平台在临床部署上更强，CRISPR 诊断仍可在便携性和设备负担上优于旧方法。Mammoth 更深的护城河来自今日诊断收入图景无法完全反映的资产：Cas14
              论文确立了一个极其紧凑的 ssDNA 切割核酸酶家族，支持 Cas14-DETECTR SNP 分型；CasPhi 论文显示，与 Mammoth 相关的超小型系统可用于 DNA
              检测，同时也在编辑中提供递送优势。换句话说，Mammoth 拥有的不只是一个 COVID 时代检测概念，而是一套更广的酶和旁切活性叙事。


              话虽如此，买方不会因为核酸酶优雅就切换平台。只有当工作流、报销、周转时间、装机经济性和菜单匹配度改善到足以支撑培训和采购变更时，他们才会切换。既有平台的切换成本来自封闭式 卡匣仪器、LIS
              集成、已验证标本工作流，以及已经嵌入医院、急诊护理和零售护理路径的大型检测组合。Mammoth 目前缺少这些资产。因此，DETECTR 更可能的获胜路径是合作方主导：授权或 OEM
              植入既有商业渠道，而不是正面重建 Cepheid、Roche、BioFire 或 QIAGEN 的分销。Cas14 和 CasPhi 增强谈判筹码和长期可选性，但抹不掉当前商业化路径短板。
