  - id: TM004
    title: 增长驱动因素与采用约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 对 Mammoth 的影响
      - 尽调问题
    rows:
      - - Exa-cel 获 FDA 批准（ex vivo CRISPR SCD/TDT，2023 年 12 月）
        - 正向驱动
        - 当前
        - 验证 CRISPR 基因疗法属于可获批类别；降低监管风险感知
        - 确认 ex vivo 批准先例是否会影响 Mammoth 的 in vivo IND 包
      - - Intellia in vivo LNP 项目处于早期临床（ATTR 的 Nex-z/NTLA-2001）
        - 正向驱动
        - 当前
        - 验证 in vivo CRISPR 的 LNP 肝脏递送；为 MB-111 路径建立先例
        - 跟踪 Intellia Phase 1/2 ATTR 读数，作为肝脏编辑领域的安全性 / 有效性信号
      - - AAV 载荷容量限制（约 4.7 kb）使 Cas9/Cas12a 无法单载体递送
        - 结构性约束
        - 持续
        - 为 Mammoth 的超紧凑核酸酶（NanoCas、CasPhi）创造差异化机会
        - 确认 NanoCas 在人体试验中的编辑阈值是否会匹配 NHP 临床前数据
      - - 标准 CRISPR 系统尚未解决肝外递送
        - 结构性约束
        - 持续；NanoCas 临床前工作已部分解决
        - 这是 Mammoth 市场差异化的核心主张；临床验证仍未完成
        - 要求 NanoCas 通过单个 AAV 做肝外编辑时，补齐支持 IND 申报的人体安全性数据
      - - 支持 IND 申报及 Phase 1–3 基因疗法项目的资本强度
        - 约束
        - 持续
        - 拖慢全资 MB-111 时间线；合作模式把这类风险转给药企
        - 对照 MB-111 支持 IND 申报时间线和烧钱速度，评估 Mammoth 的现金跑道
      - - 新型核酸酶的监管新颖性（NanoCas、CasPhi 缺少人体安全性先例）
        - 约束
        - 中期（3–5 年）
        - FDA 会要求新核酸酶类别提交完整的遗传毒性和免疫原性资料包
        - 量化 NHP 研究中 NanoCas 的脱靶编辑负担；确认监管建议
      - - Editas 2024 年 12 月终止 reni-cel 项目后裁员 65%
        - 反向信号 / 市场风险
        - 近期
        - 说明科学基础很强的基因编辑平台也可能走不到商业化
        - 判断 Mammoth 的合作模式能否降低这种失败模式的风险，还是只是把风险转给合作方
      - - Prime Medicine prime editing 2025 年 12 月在 CGD 患者中实现首例治愈
        - 竞争信号
        - 近期
        - 抬高下一代 CRISPR 的竞争门槛；验证更广泛领域的可信度
        - 判断 prime editing 靶点是否与 Mammoth 合作项目靶点重叠
      - - 面向 FCS/SHTG 的抗 APOC3 RNAi 和反义竞争疗法（如 inclisiran、AKCEA-APOCIII-LRx）
        - 竞争约束
        - 当前
        - 现有药物型 APOC3 敲降疗法可能削弱 MB-111 的临床差异化
        - 与一次性 CRISPR 编辑相比，评估头对头持久性、患者负担和成本效益
    notes: 方向反映对 Mammoth 市场准入或竞争位置的影响。时间为近似判断。抗 APOC3 RNAi 竞争行由靶点机制推断；具体竞争药物名称来自分析师文献，未必覆盖 MB-111 的完整竞争集。
