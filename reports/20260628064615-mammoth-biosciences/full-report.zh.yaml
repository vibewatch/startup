      - number: '6.2'
        title: 具名证明与采用阶段
        blocks:
          - type: paragraph
            body: >-
              具名客户证明最强的地方，是 Mammoth 允许交易对手公开发声的领域。Regeneron、Vertex 和 Bayer 都公开说明 Mammoth
              的超紧凑系统为什么对它们重要，以及它们愿意为获取平台支付什么。对于一家自身治疗管线仍处于临床前阶段的公司，这是异常强的证据。诊断侧，Mammoth 也已经超出实验台科学：NIH RADx
              资助其规模化进入商业实验室流程，MilliporeSigma 和 Hamilton 被引入制造并自动化流程，FDA 授权原始 DETECTR 试剂盒和高通量 DETECTR BOOST 配置用于高复杂度 CLIA
              实验室，独立实验室行业媒体也把该系统描述为人手紧张临床实验室的另一种工具。


              但采用证明不等于持久商业证明。GSK 合作显示 Mammoth 能吸引蓝筹消费健康渠道伙伴，并讲清家庭检测愿景，但留存来源没有记录该项目的公开发布、定价或收入流。同样，2026 年 Abu Dhabi / M42
              合作把 Mammoth 的客户地图扩展到主权健康生态系统，但留存证据仍描述的是一种能力建设关系：场地资格认定、研究基础设施，以及围绕 MB-111 规划的 GMP LNP 制造。用尽调语言说，Mammoth
              已经跨过从投机性科学到真实买方兴趣的门槛；但它尚未跨过持续使用、复购或客户经济公开可见的门槛。
