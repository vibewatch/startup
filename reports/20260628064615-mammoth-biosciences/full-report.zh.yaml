          - type: callout
            title: 临床阶段仍在 IND 前；估值自 2021 年独角兽轮后未更新
            body: >-
              尽管已有显著合作资本（Vertex、Bayer 和 Regeneron 已披露预付款合计约 $276M），Mammoth 的首个临床开发候选药物（MB-111）直到 2025 年才获提名，截至运行日尚未宣布
              IND 申报。最后一次披露的投后估值（>$1B）停留在 2021 年 9 月，形成近五年的估值空档。投资者应在尽调中要求提供最新 409A 或同期估值；考虑到临床时间线，可能存在显著稀释和估值重定价风险。
            calloutType: risk
            claimRefs:
              - CO023
              - CO033
              - CO034
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入和排除的支出、邻近领域与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Mammoth Biosciences 位于三个同心市场的交汇处，分析上必须拆开，否则会制造虚假的精确感。最外圈是 CRISPR 基因编辑市场，涵盖研究工具（guide RNAs、Cas
              蛋白、载体）、农业基因组学、工业生物技术和治疗性基因组编辑。The Business Research Company 的分析报告估计，这一合并品类在全球已达数十亿美元规模，其中仅基于 CRISPR 的诊断子板块
              2026 年约 $6.01 billion，并预计以 17.5% CAGR 增至 2030 年 $11.45 billion。这些头部数字可用于定向，但若作为 Mammoth
              可触达市场的代理则会误导：Mammoth 目前并不销售研究试剂盒、guide RNAs 或农业基因组工具。

              更窄的第二圈，也是与 Mammoth 当前战略相关的一圈，是体内遗传药物市场，定义为利用基因编辑在体内持久改变患者基因组的治疗项目。Mammoth
              几乎完全通过面向大型药企合作方（Regeneron、Vertex、Bayer）的带里程碑和版税的平台授权进入该市场，而非靠直接产品收入。经济性逐笔交易而定：Regeneron 同意支付 $100 million
              预付款，每个靶点最高 $370 million 里程碑付款；Vertex 支付 $41 million 预付款，未来里程碑最高 $650 million；Bayer 支付 $40 million，里程碑可能超过
              $1 billion。因此，处在这个位置的平台公司的可触达市场，不是所有基因编辑治疗支出的理论总额，而是 Mammoth 能签下的交易经济价值，以及合作方能推进到获批并产生版税的项目。

              第三圈也是最小一圈，是 Mammoth 通过 DETECTR 平台进入过的历史 CRISPR 诊断机会。该市场包括临床感染病检测、即时分子诊断和政府资助的疫情检测。Mammoth 曾通过 UCSF 在
              DETECTR 平台上获得 COVID-19 EUA，但 2023 年主动撤销，并同时裁撤 35 名诊断员工、转向治疗。因此，诊断市场在前瞻分析中属于排除支出：Mammoth 已不再推进商业诊断，分析师报告中的
              CRISPR 诊断市场数字不适用于 Mammoth 当前商业模式。

              Mammoth 体内平台授权的现状替代方案包括其他 CRISPR Cas 酶（Broad Institute 生态中的 SpCas9，授权给
              Editas；SaCas9；AsCas12a），以及替代编辑模态（Beam Therapeutics 的碱基编辑、Prime Medicine 的 prime editing、Intellia 的 LNP 递送
              NTLA / Nex-z）。在 Mammoth 已退出的诊断市场，替代方案包括 PCR（Roche、Thermo Fisher、bioMérieux /
              BIOFIRE）、等温扩增平台和抗原检测。这些诊断替代方案均不再关系到 Mammoth 的前瞻战略。
