      - number: '1.4'
        title: 里程碑、管线与运营背景
        blocks:
          - type: paragraph
            body: >-
              Mammoth 的产品和运营里程碑横跨三个阶段：最初的 CRISPR 诊断阶段（2018–2022）、诊断与治疗并行阶段（2020–2023），以及治疗优先阶段（2023 年至今）。

              诊断方面，公司开发了使用 Cas12a 的 DETECTR 平台，用于基于 CRISPR 的分子检测。COVID-19 期间，公司与 UCSF 合作开发 SARS-CoV-2 RNA DETECTR
              Assay，并获得 FDA 紧急使用授权。Mammoth 于 2020 年 7 月获得约 $23.1 million NIH RADx 资金，并在 2020 年 10 月与 MilliporeSigma 和
              Hamilton Company 签署制造放大协议。

              科学发现层面，Mammoth 研究人员发表了两篇关键论文，奠定其超小型 Cas 蛋白组合：Cas14 论文（Science，2018 年 11 月，Harrington 等）和 CasΦ
              论文（Science，2020 年 7 月，Pausch 等）。两个系统均被证明在体内场景具备治疗性基因组编辑潜力，并构成 Mammoth 治疗 IP 的核心。

              治疗管线方面，2025 年 Mammoth 提名 MB-111 为首个临床开发候选药物——一种潜在的一次性疗法，面向包括家族性乳糜微粒血症综合征和重度高甘油三酯血症在内的高甘油三酯疾病患者，使用 Mammoth
              的超小型 CRISPR 体内基因编辑系统。截至运行日，MB-111 尚未披露 IND 申报日期。2025–2026 年新闻材料提到 NanoCas 是下一代超小型平台元素。

              不利事件方面：2023 年 3 月，Mammoth 裁员约 35 人（当时描述为员工数不到 20%），作为治疗战略转型的一部分，裁掉了大部分诊断团队。裁员后约 15 人留在诊断 R&D。2025 年 5
              月，Mammoth 又宣布减少 24 个岗位；CEO Trevor Martin 将其描述为「战略校准」，以确保组织形态适合推动内部项目进入临床并支持合作关系。Martin 表示，公司在 2025
              年裁员时财务位置「独特地强」。2025 年裁员前后员工数并未清晰披露；2022 年 CNBC 报道称员工数为 130 人并将增长至 185 人，但该报道早于两轮裁员。

              截至运行日，Mammoth 在加州 Brisbane 总部运营，拥有先进实验室设施，可从 Balboa BART 和 Millbrae BART / Caltrain 乘班车抵达。公司参加了 2025 年 1
              月第 43 届和 2026 年 1 月第 44 届 J.P. Morgan Healthcare Conference，并展示管线、平台和合作关系。
