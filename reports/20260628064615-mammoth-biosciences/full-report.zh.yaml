      - number: '4.4'
        title: 承销仍缺什么
        blocks:
          - type: paragraph
            body: >-
              对一家私人平台公司而言，Mammoth 的合作伙伴经济条款异常丰厚，但它仍未通过标准的公开数据承销测试。留存来源没有披露当前现金及等价物、月度烧钱率、按合作伙伴拆分的确认收入、诊断或合作收入的毛利率、2025
              年重组后的员工数，或融资所得与经营收入之间的调节表。这意味着，任何试图量化回本、经营杠杆或跑道的模型都会是伪精确。


              最关键的缺口是会计清晰度。Regeneron 套餐把战略股权和预付款对价合在一起；Vertex 包含一张可转债；里程碑阶梯金额很大，但完全取决于未来事件。没有 CFO
              桥表展示股权收益、递延收入、已确认合作收入、现金回款和预测里程碑时点，即使经验丰富的投资者也无法判断 Mammoth 是资本充裕，还是只是头条数字好看。诊断历史也有同样缺口：RADx、GSK、EUA
              和制造规模化证明了商业兴趣，但公开来源从未显示 DETECTR 是否成为有意义的收入线。


              因此，财务结论是复杂但可行动的。已签合作经济的收入质量为中等，未来里程碑上限为低，当前产品收入为低到零，因为公开资料看不到活跃的商业诊断销售基础。利润率路径、烧钱率和跑道仍是尽调阻碍，而不是建模输入。
