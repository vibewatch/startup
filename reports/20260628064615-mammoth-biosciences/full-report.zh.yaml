  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心核酸酶组合与蛋白发现引擎
        blocks:
          - type: paragraph
            body: >-
              Mammoth Biosciences 的核心是一套由宏基因组驱动的核酸酶发现引擎，已经产出三种超紧凑 CRISPR 蛋白——Cas14、CasPhi 和 NanoCas。它们都显著小于
              Cas9，而这个尺寸差异对体内治疗递送很关键。Cas14 最早在 2018 年发表于 Science，被描述为一类来自未培养古菌的 RNA 引导核酸酶，长度为 400 至 700 个氨基酸。不同于 Cas9 或
              Cas12a，Cas14 作用于单链 DNA，不受严格 PAM 要求限制，并能触发非靶 ssDNA 的旁切活性；这一活性支撑 DETECTR 诊断，也支持高保真 SNP 分型。Mammoth 于 2019 年 3
              月从 UC Berkeley 独家授权 Cas14 的全领域权利，并把该蛋白与既有 Cas12、Cas13 权利组合起来，补齐早期诊断核酸酶工具箱。CasPhi 于 2020 年发表于
              Science，来自巨型噬菌体基因组。CasPhi 约 70 kDa，分子量约为 Cas9 的一半；它用同一个活性位点完成 guide RNA 加工和 crRNA 引导的 DNA
              切割，并能在人类和植物细胞中发挥活性，相比其他 CRISPR 蛋白具有更宽的靶标识别范围。Mammoth 于 2020 年 8 月从 UC Berkeley 独家授权 CasPhi 的全领域权利。NanoCas
              是最新、也最具治疗意义的补充，2025 年 1 月在 bioRxiv 预印本中披露。它约为 Cas9 三分之一大小，足够紧凑，可与调控元件、guide RNA 和额外编辑 machinery
              一起装入单个腺相关病毒载体。发现 NanoCas 需要筛选 Mammoth 宏基因组数据中的 176 个超紧凑 CRISPR 系统，再通过蛋白工程优化编辑效率。三种核酸酶都具有更短或替代性 PAM
              要求，能把可靶向基因组序列范围扩展到 Cas9 之外。蛋白发现引擎使用最大的宏基因组数据库之一，其中包括独家样本数据，并结合专有 AI 算法和高通量湿实验筛选来识别、验证新的 CRISPR
              架构。这形成了复利优势：数据库增长、工程方法改进后，Mammoth 不必依赖外部技术转让，也能加入新的核酸酶家族。
