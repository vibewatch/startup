  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: >-
      Mammoth 的产品栈把共享的核酸酶发现和工程化核心，铺到两条不同产品线：CasPhi LNP 肝脏线（MB-111 和后续肝脏项目）以及 NanoCas 单 AAV 肝外线（神经肌肉和 CNS）；DETECTR
      诊断平台则作为单独的、可合作层存在。
    approximationNotes: 内部管线名称、GLP 研究基础设施和 CMC 生产架构未公开。本图只停留在公司出版物、官网和新闻材料可见的产品系统层。
    data:
      layers:
        - label: 核酸酶发现与工程化引擎
          detail: 含独家样本数据的宏基因组数据库、专有 AI 搜索和高通量湿实验室筛选，产出用于治疗和诊断的新型 Cas 蛋白。
          items:
            - 宏基因组数据库（含独家样本数据）
            - 专有 AI CRISPR 搜索算法
            - 高通量湿实验室筛选和表征
            - 蛋白工程优化流水线
        - label: 超紧凑核酸酶组合
          detail: 独家授权和内部工程化的紧凑 Cas 蛋白，构成专有工具箱。
          items:
            - Cas14（400-700 aa；ssDNA；来自古菌；2019 年授权）
            - CasPhi（70 kDa；Cas9 的一半；来自巨型噬菌体；2020 年授权）
            - NanoCas（Cas9 的三分之一；兼容肝外 AAV；2025 年工程化）
            - Cas12 和 Cas13（DETECTR 诊断）
        - label: 编辑模态层
          detail: 超紧凑支架让双链断裂之外的多种编辑路径变得可行。
          items:
            - 核酸酶（双链断裂；基因敲除）
            - 碱基编辑（A-to-G 或 C-to-T 单字母改变）
            - 逆转录酶编辑（RNA 编码的插入、删除、替换）
            - 表观遗传编辑（不改变序列的基因沉默）
        - label: 递送架构
          detail: 两条递送路线对应不同组织靶点和不同治疗机制。
          items:
            - 用于肝脏递送的 LNP（脂质纳米颗粒）（CasPhi；MB-111）
            - 用于肝外递送的单 AAV（NanoCas；肌肉、CNS）
            - 多种其他递送模态可兼容超紧凑尺寸
        - label: 产品管线与平台输出
          detail: 核酸酶和递送层产出具名商业资产和平台资产。
          items:
            - MB-111（CasPhi+LNP；APOC3；FCS/sHTG；IND 支持阶段）
            - 未披露肝脏项目（LNP；多种编辑技术）
            - NanoCas 神经肌肉 / CNS 项目（单 AAV；已合作）
            - DETECTR 诊断平台（Cas12/13/14；旁切；可合作）
    claimRefs:
      - CE001
      - CE009
      - CE010
      - CE011
      - CE012
      - CE021
      - CE022
  - id: FE002
    title: 客户工作流 / 运营流
    type: flow
    layout: wide
    summary: 以接受 MB-111 的 FCS 或 sHTG 患者为例，观察到的治疗工作流从诊断、单疗程静脉给药到持久结局，并与当前护理标准对照：FCS 目前没有获批疗法。
    approximationNotes: 该流程反映公司材料中的机制描述和动物模型证据。人类临床工作流尚不存在；该流程代表拟定的首次人体路径。
    data:
      nodes:
        - id: n1
          label: 患者诊断
          detail: 通过血浆甘油三酯水平高于 1000 mg/dL，以及遗传或临床评估，识别 FCS 或 sHTG 患者。
        - id: n2
          label: 当前护理标准
          detail: 严格低脂饮食、贝特类药物、omega-3 补充；FCS 没有获批疗法；胰腺炎频繁住院仍在持续。
        - id: n3
          label: MB-111 适用性评估
          detail: 评估患者是否适合体内 CRISPR 疗法，包括肝功能、免疫状态和甘油三酯严重程度。
        - id: n4
          label: 单次静脉注射 MB-111
          detail: CasPhi-LNP 制剂经静脉给药；CRISPR 复合物进入肝脏肝细胞。
        - id: n5
          label: 肝脏 APOC3 基因敲除
          detail: CasPhi 永久破坏 APOC3 基因表达；apoC-III 蛋白生产停止或大幅下降。
        - id: n6
          label: 甘油三酯持续下降
          detail: 血浆甘油三酯持久下降；急性胰腺炎发作预计会大幅减少。
        - id: n7
          label: 证据缺口
          detail: 目前没有人体数据；NHP 和小鼠模型数据支持该机制，但临床转化仍未得到证明。
      edges:
        - from: n1
          to: n2
          label: 没有获批疗法
        - from: n1
          to: n3
          label: MB-111 可用后
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
        - from: n6
          to: n7
          label: 需要首次人体数据
        - from: n2
          to: n7
          label: 当前结局缺口
    claimRefs:
      - CE013
      - CE014
      - CE015
      - CE016
      - CE017
      - CE036
  - id: FE003
    title: 关键依赖图
    type: dag
    layout: wide
    summary: MB-111 和 NanoCas 项目依赖不同但有重叠的上游层：IP 授权、动物模型证据、递送基础设施和监管里程碑；每一层都带执行风险。
    approximationNotes: 边表示依赖方向。内部 GLP 和 CMC 节点按标准 IND 要求推断；当前状态未公开披露。本图按项目系统层归组公开依赖。
    data:
      nodes:
        - id: ip
          label: UC Berkeley 独家 IP 授权
          detail: Cas12、Cas13、Cas14、CasPhi 获得全领域独家授权；旁切专利 US10337051 和 US10253365
        - id: discovery
          label: 专有核酸酶发现引擎
          detail: 宏基因组数据库和 AI 流水线产出 Cas14、CasPhi、NanoCas；构成内部竞争护城河
        - id: mb111
          label: MB-111 项目
          detail: 用于 FCS/sHTG 的 CasPhi-LNP APOC3 敲除；IND 支持阶段；目标 2026 年进临床
        - id: nanocas
          label: NanoCas 肝外平台
          detail: 单 AAV 肌肉和 CNS 编辑平台；2025 年 bioRxiv 预印本；ASGCT 2025 展示
        - id: animal
          label: NHP 和小鼠模型证明
          detail: 饱和肝脏编辑（MB-111）和超过 30% 的 NHP 肌肉编辑（NanoCas）
        - id: lnp
          label: LNP 递送基础设施
          detail: 用于肝脏递送的成熟脂质纳米颗粒制剂；与 RNA 治疗行业路径共享
        - id: aav
          label: AAV 递送基础设施
          detail: NanoCas 的紧凑尺寸释放单 AAV 载体容量；与 Regeneron 和 Vertex 的 AAV 能力互补
        - id: ind
          label: IND 申报和监管路径
          detail: 首次人体 MB-111 所必需；尚未公开申报或宣布
        - id: partners
          label: Regeneron 和 Vertex 合作
          detail: 商业验证加 $100M/Regeneron 和 $40M/Vertex 首付款；获得 AAV 技术通道
      edges:
