      - number: '7.2'
        title: 技术与开发风险
        blocks:
          - type: paragraph
            body: >-
              第二类风险是科学转化。Mammoth 的差异化命题是真实的：超紧凑核酸酶能缓解载荷限制，并可能打开传统编辑器难以触达的组织。但更好的载荷故事不等于临床已验证疗法。MB-111 仍处于 IND-enabling
              阶段，Mammoth 自己公开的管线也显示，其余内部组合仍在研究或先导优化。为本轮保留的 2026 年文献异常清楚地表明，这个领域的难题不再只是 CRISPR 能否编辑
              DNA，而是编辑能否在活人体内以可接受的脱靶、免疫和长期基因组完整性风险完成递送。


              因此，Mammoth 面临下一代平台公司典型的悖论：新颖性既是上行来源，也是承销风险来源。CasPhi 可能小于 Cas9，且潜在更灵活，但 Mammoth
              仍必须证明编辑系统、递送载体和适应症生物学能在监管者视角下协同工作。诊断历史又增加一层复杂性。DETECTR 证明 Mammoth 能在紧急时期把科学商业化，但 COVID EUA
              被撤销、随后诊断业务收缩，说明历史牵引本身并不会创造一个持久备用业务。换句话说，Mammoth 最大的技术风险不是平台是否有意思——它显然有——而是它能否走完从差异化临床前科学到可重复临床执行的最后一公里。
