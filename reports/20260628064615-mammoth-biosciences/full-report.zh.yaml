      - number: '2.5'
        title: 保留的尽调缺口和未解决估计
        blocks:
          - type: paragraph
            body: >-
              截至运行日，若干市场规模和采用问题仍实质性悬而未决，无法用公开证据解决。

              第一，没有公开来源给出 Mammoth 在体内遗传药物市场的专属 SAM 或 SOM。交易经济性（三个合作合计潜在里程碑约 ~$2+
              billion）是最接近的可用代理，但它代表上限而非期望值，并取决于多重尚未解决的临床和监管条件。任何从分析师市场报告估计推导出的单一数字 SAM，都必须假设 Mammoth
              的交易管线和版税率，而这些都是专有信息。

              第二，在不知道 Regeneron 在合作下选择了哪些具体适应症之前，Mammoth 肝外项目（用于肌肉、CNS 及更广领域的 NanoCas）的商业潜力无法测算。Regeneron
              协议覆盖「多种组织和细胞类型」，但未披露靶点。靶点披露之前，公开来源无法得知肝外项目的 SAM。

              第三，分析师报告引用的 CRISPR 诊断市场估计，并未被 Mammoth 的转型直接反驳，但它们也不能叠加到 Mammoth 的前瞻市场机会中。报告中的大型 CRISPR 诊断 TAM，与 Mammoth
              主动退出该市场之间存在真实分析矛盾：即便市场报告预测诊断板块 17.5% CAGR，Mammoth 领导层仍判断这个机会不足以支撑商业竞争所需资本。这个战略不协调应当被保留，而不是被消解。

              第四，FCS 患者群体很小，MB-111 在美国的 SAM 很可能最多只是低数千名患者，不过孤儿药监管和定价框架可以在这一规模上支撑有商业意义的疗法。尽调应要求 Mammoth
              披露患者分层、治疗率假设，以及与已在临床开发中的 anti-APOC3 RNAi 和反义路径的竞争重叠。
