  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与 IP 风险
        blocks:
          - type: paragraph
            body: >-
              Mammoth 的第一个、也最绕不开的风险，是它同时处在两个硬监管系统里：FDA 的基因编辑安全框架，以及仍有争议的 CRISPR 专利格局。FDA 路径不只是“进入临床”。2024
              年基因组编辑指南已经要求在产品设计、制造、非临床安全和临床试验设计上提供详细信息；2026 年 NGS
              指南草案又对脱靶编辑和基因组完整性分析提出具体预期。长期随访义务进一步拉长负担，因为永久性或长效基因疗法可能需要多年监测延迟不良事件。这意味着 Mammoth
              不能只靠令人信服的临床前疗效取胜；它还必须拿出一套成熟、可面对监管审查的安全性资料包。


              IP 侧同样不是二元问题。2026 年 3 月 PTAB 裁决重申 Broad 在真核细胞 CRISPR-Cas9 上的优先权，同时 UC Berkeley 继续持有更广泛的大型专利资产，相关 ToolGen 和
              Sigma 争议也尚未解决。Mammoth 确实有自己的授权链，也围绕 CasPhi、APOC3 和其他编辑系统建立了活跃内部组合，但这并不会消除自由实施风险。承销要点是：Mammoth
              的法律护城河可能有意义，但在被视为已去风险之前，仍需要外部律师尽调；否则它仍是持续的成本和时间变量。
