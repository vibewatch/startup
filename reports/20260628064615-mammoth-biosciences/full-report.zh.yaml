      - number: '8.2'
        title: 估值背景与私募市场不透明度
        blocks:
          - type: paragraph
            body: >-
              Mammoth 的估值背景由一个旧价格信号和几个更新但不完整的战略信号定义。2021 年 9 月，Mammoth 披露 $150 million Series D，并追溯披露 $45 million Series
              C；MedCity News 和 Forbes 的报道把公司称为估值超过 $1 billion 的独角兽。因此，Regeneron 之前的风险融资总额约为 $255 million。2024 年 4
              月，Regeneron 又加入一个更广泛的 $100 million 合作套餐，其中包括 $95 million 股权投资，但公告仍未披露新的估值标记、清算条款或更广泛的 cap table
              后果。这很关键，因为公司同样不披露收入、经营利润率、现金或烧钱；投资者无法判断合作现金是在支持持久进展，还是只是延长跑道。用实际承销语言说，Mammoth
              仍是一家私人、披露不足的临床前平台公司；它最后一次硬价格形成于生物科技融资环境远比 2026 年公开 CRISPR 公司面对的环境宽松的时期。
