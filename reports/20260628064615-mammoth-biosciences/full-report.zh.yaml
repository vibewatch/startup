  - id: TV005
    title: 合作经济性
    columns:
      - 合作方
      - 首付款经济性
      - 里程碑潜力
      - 战略含义
    rows:
      - - Vertex
        - 通过可转债和股权投资支付 $41M 首付款
        - 两个项目最高 $650M，另有特许权使用费
        - Vertex 已与 CRISPR Therapeutics 商业化 Casgevy，这笔交易验证了其对体内编辑的兴趣。
      - - Bayer
        - $40M 首付款
        - 四个疾病项目合计超过 $1B，另有低双位数特许权使用费
        - 即便仍处临床前阶段，大药企也愿意为 Mammoth 的编辑工具箱付费。
      - - Regeneron
        - $100M 首付款，其中包括 $95M 股权
        - 每个靶点最高 $370M，另有 5%-15% 特许权使用费，期限 5.5 年
        - 最新的战略背书，但仍不是已披露的新估值标记。
      - - 合计
        - 三项已披露合作合计约 $181M 首付款经济性
        - 若项目推进，合计里程碑机会达数十亿美元
        - 战略验证很强，但不能替代收入或现金消耗披露。
    notes: 首付款合计只反映已披露的合作经济性，不应解读为已确认收入、利润率或当前现金余额。
