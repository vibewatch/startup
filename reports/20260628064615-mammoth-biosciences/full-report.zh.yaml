              在缺乏体内遗传药物公开 SAM 的情况下，本章把 Regeneron、Vertex 和 Bayer 已披露里程碑上限合计，作为 Mammoth
              可从当前合作方关系捕获经济价值区间的最佳可用代理。这是一个假设，不是市场估计：里程碑是上限而非期望值，版税收入需要获批产品，而这些产品仍在多年之后。
