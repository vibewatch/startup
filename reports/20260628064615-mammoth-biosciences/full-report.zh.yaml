companyProfile:
  summary: >-
    Mammoth Biosciences 是一家位于加州 Brisbane 的私营 CRISPR 公司，正在打造超小型基因编辑系统和选择性诊断资产。公司最早靠 DETECTR 诊断获得关注，随后转向体内治疗；其小型 Cas
    蛋白旨在打开传统编辑器难以抵达的组织递送。
