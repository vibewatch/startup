  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: CRISPR 原生和邻近进入者
        blocks:
          - type: paragraph
            body: >-
              Mammoth 最直接的概念竞争对手不是治疗性基因编辑公司，而是试图把分子答案带出中心实验室的初创公司。Mammoth 将 DETECTR 描述为可适配低复杂度仪器、无仪器形态和传统系统的 CRISPR
              检测平台，并强调速度、低货品成本、稳健性和多用途。历史上的 GSK Consumer Healthcare 合作展示了这种野心的实践形态：一款手持、完全一次性的 SARS-CoV-2
              检测，先面向诊所，最终面向家庭使用。同行评议的 COVID 验证证明 DETECTR 可在快速侧向流格式中运行；但截至运行日，在连续重组优先治疗而非诊断之后，Mammoth 似乎不再推动可见的独立诊断发布。


              Sherlock Biosciences 是最接近的同类参照，因为它从 Broad 生态出发追求同样的去中心化论点，但采用基于 Cas13 的 SHERLOCK 和合成生物学 INSPECTR
              工作流。Sherlock 筹集了大量风险资本，宣传无需复杂仪器即可达到 PCR 类准确度，随后在 2024 年 12 月被 OraSure Technologies 收购。OraSure
              自身文件清楚显示，战略价值并不只是 CRISPR 品牌，而是 Sherlock 的一次性分子自测平台和 CT / NG 产品路径。VedaBio 和 Caspr 属于邻近进入者，而非直接规模同业。VedaBio
              试图用无需扩增的 CRISPR Cascade 工作流和 2025 年与 Siemens Healthineers 相关的融资事件做差异化；Caspr 则强调超低成本 CRISPR Cas-12 原型。相较
              Mammoth，这些进入者更是在工作流简化和成本架构上竞争，而不是在核酸酶所有权上竞争。
