      - number: '4.2'
        title: 诊断历史和收入质量限制
        blocks:
          - type: paragraph
            body: >-
              诊断业务在财务上重要，是因为它证明 Mammoth 能把科学转成受监管产品，也能拿到外部资金支持规模化；但它同样提醒投资者，不能把概念验证误读成稳定的收入质量。Mammoth 的 DETECTR 平台在
              COVID 期间参与过多次商业化尝试：公司与 GSK 消费健康业务合作开发手持式即时检测，获得 NIH RADx 支持以扩展高通量商业实验室流程，与 MilliporeSigma 和 Hamilton
              签署制造和自动化协议，并为面向高复杂度 CLIA 实验室的 SARS-CoV-2 DETECTR Reagent Kit 拿到 FDA EUA。诊断业务页面仍用速度、低
              COGS，以及跨格式、跨疾病领域的适配能力来营销 DETECTR。


              这些都是有意义的商业化信号。它们说明 Mammoth 不是停留在纯研究状态：外部机构愿意出资支持规模化，合作伙伴愿意围绕平台制造，监管方也愿意授权产品。但留存来源都没有显示诊断销售规模、EUA
              期间的检测量是否转化为疫情后的持久收入，或 COVID 相关工作中有多少是政府合同支持、多少是产品毛利。即便是 GSK
              合作也没有披露经济条款。换句话说，诊断业务带来了技术和商业可信度，却没有公开的经常性收入记录。


              这个细节很关键，因为 Mammoth 后来已经淡化诊断业务。2023 年 3 月裁员削减了 35 名员工和大部分诊断团队，据报道诊断研发仅剩约 15 人。到 2025 年，公司提名 MB-111
              为首个开发候选药物，官方对外重心也转向治疗平台。财务上，诊断业务应被视为历史验证和偶发的非稀释性证明，而不是当前核心收入引擎。
