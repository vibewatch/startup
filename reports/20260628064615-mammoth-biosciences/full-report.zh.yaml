      - number: '2.2'
        title: 多重测算口径下的 TAM、SAM 与 SOM，并保留矛盾
        blocks:
          - type: paragraph
            body: >-
              给 Mammoth Biosciences 一个单一数字 TAM，在分析上并不诚实，因为公司位于多个市场交叉点，而这些市场的测量惯例、地理范围、纳入 /
              排除规则彼此不兼容且存在争议。本节保留全部可得估计及其矛盾。

              CRISPR 诊断市场如今已与 Mammoth 前瞻模型无关。The Business Research Company 估计其 2025 年为 $5.1 billion，2026 年以 17.8% CAGR
              增至 $6.01 billion，并在 2030 年达到 $11.45 billion。Grand View Research 另行覆盖 CRISPR 即时诊断子板块。这些估计并不代表 Mammoth 今日的
              TAM，因为 Mammoth 已不再商业化诊断。不过，它们为 Mammoth 选择退出的历史诊断机会提供了锚点。

              公开来源并未以可直接用于 Mammoth 的方式测算体内遗传药物市场。最接近的代理是一般基因治疗和基因编辑治疗交易量：Mammoth 的三笔药企交易合计在延展交易周期内包含超过 $2 billion
              的潜在里程碑付款，说明药企合作方自身认为体内编辑市场可以支撑显著价值。Regeneron 已上市产品版税率为净销售额的个位数到中双位数百分比，与 Bayer 合作中披露的交易条款（低双位数版税）一致。如果
              Regeneron 或 Vertex 合作中哪怕一个项目获批，针对罕见病或代谢疗法、按每名患者数十万美元定价的产品版税经济性，可能为 Mammoth
              带来有意义收入——但这些预测完全取决于尚未解决的临床、监管和商业变量。

              对 Mammoth 全资领先项目 MB-111（靶向 FCS 和 SHTG）而言，商业可比对象是其他罕见病基因疗法。FCS 是罕见遗传病，截至本分析时尚无 FDA
              批准疗法，患者群体很小（美国估计为低数千人）。孤儿药路径和潜在溢价定价意味着，即便患者群体很小，也可能支撑有商业意义的疗法——但 FCS 范围窄，严重甘油三酯升高的 SHTG
              患者更多，却也面临更紧的竞争集合，包括通过反义和 RNAi 路径靶向 APOC3 的药物。这形成一幅冲突图景：分析师引用广阔的 CRISPR 市场增长，但 Mammoth
              的近期商业路径要穿过一个罕见病适应症，可触达患者以千计而非以百万计。
