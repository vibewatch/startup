      - number: '3.4'
        title: 护城河持久性和反向证据
        blocks:
          - type: paragraph
            body: >-
              反向案例很直接。Sherlock 出售给 OraSure 表明 CRISPR 诊断具备战略吸引力，但也暗示独立平台若没有一个已经拥有制造、监管、报销和分销基础设施的大型所有者，可能很难放大。Mammoth
              自己的诊断收缩指向同一方向。2023 年约 35 人裁员（主要来自诊断）和 2025 年再裁 24 个岗位的重组，并未在科学上否定 DETECTR，但削弱了 Mammoth 作为 CRISPR
              诊断运营领导者的主张。历史动能存在——RADx 支持、同行评议 COVID 检测、GSK 消费者健康合作——但它尚未转化为可见的当前产品发布。


              定价证据是另一个警讯。公开来源可靠描述了包装模型和部分原型经济性，但真实仪器定价、卡匣定价和医院合同条款在整个领域仍不透明。这种不透明有利于销售动作根深蒂固的既有玩家。与此同时，邻近进入者威胁正在演化：VedaBio
              主打无需扩增的速度和多重检测，Caspr 强调超低成本便携检测，未来进入者也可借用去中心化剧本，而不必复刻 Mammoth 准确的 Cas14 / CasPhi 位置。综合来看，Mammoth
              在诊断上的护城河真实但狭窄：强酶 / IP 差异化、弱主动商业化，并明显依赖合作方才能规模化重返市场。
