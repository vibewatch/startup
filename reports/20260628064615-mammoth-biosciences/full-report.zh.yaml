      - number: '3.2'
        title: 既有快速分子平台和渠道权力
        blocks:
          - type: paragraph
            body: >-
              DETECTR 更难的商业问题，不是证明 CRISPR 能检测核酸，而是替换买方已经信任的仪器机群和检测菜单。Cepheid 的 GeneXpert
              家族把提取、扩增和检测自动化封装进封闭式一次性卡匣，系统覆盖从小型 CLIA-waived Xpress 仪器到大型模块化设备，并支持随机访问检测，手动操作时间很少。Roche 的 cobas liat
              系统用金标准 PCR 推动同样的「样本进、结果出」主张，周转时间不超过 20 分钟，CLIA-waived 菜单持续扩展，现在包括 STI 多重检测面板。Abbott 的 ID NOW
              处在稍有不同的位置——快速等温 NAAT 而非 PCR——但它同样争夺去中心化呼吸道工作流，承诺在 CLIA-waived 平台上比 PCR 更快给出分子结果。


              bioMérieux 的 BioFire 和 QIAGEN 的 QIAstat / NeuMoDx 系列不如 DETECTR 最初设想的手持形态便携，但它们有另一种优势：菜单宽度和机构嵌入。BioFire
              的综合征面板在 TORCH 平台上可覆盖 22 个呼吸道靶点、43 个血流感染靶点或 39 个关节感染靶点，手动操作约 2 分钟，日通量以数百次测试计。QIAstat-Dx
              提供一份样本、一个卡匣的多重面板，手动操作不足 1 分钟，周转约 1 小时；QIAGEN 更广的诊断足迹还延伸到标准化感染病工作流。这些既有玩家因此在运营适配、采购熟悉度和售后支持上与 Mammoth
              竞争，而不只是比分析性能。
