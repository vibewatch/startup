      - number: '1.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 诺贝尔奖联合创始人和最大 CRISPR 工具箱支撑合作可信度
            body: >-
              Jennifer Doudna 的联合创始人身份以及继续担任 SAB 主席，让 Mammoth 在合作谈判中拥有无可比拟的科学可信度——Regeneron 2024 年 4 月新闻稿对此明确引用。公司专有的
              Cas12、Cas13、Cas14 和 CasΦ 组合，是私营公司中最完整的授权 CRISPR 蛋白工具箱，既可用于诊断也可用于治疗，并支撑 Vertex、Bayer、Regeneron 三个 Big
              Pharma 合作，累计预付款 $181 million。
            calloutType: strength
            claimRefs:
              - CO005
              - CO007
              - CO025
              - CO026
              - CO027
          - type: callout
            title: 超小型 CRISPR 打开肝外体内递送，相比 Cas9 具备结构优势
            body: >-
              Cas14 约 530 个氨基酸，CasΦ 约 757 个氨基酸，均不到 Cas9（约 1,368 个氨基酸）的一半。紧凑尺寸让编辑器可与递送载体和 guide RNA 一起装入单个 AAV
              衣壳，直指体内基因编辑的主瓶颈——肝外递送。尚无其他公司公开披露可在规模上实现等效 AAV 共包装能力的 CRISPR 编辑平台。Regeneron 选择围绕 Mammoth 的酶来构建其 AAV
              抗体靶向平台，验证了这一结构优势。
            calloutType: strength
            claimRefs:
              - CO006
              - CO008
              - CO028
          - type: callout
            title: 创始人 CEO 关键人集中和未披露员工数带来运营不确定性
            body: >-
              Trevor Martin 自 2018 年创立以来一直担任唯一 CEO，未公开点名继任者或运营联合负责人。两轮人员缩减——2023 年 3 月约 35 人、2025 年 5 月 24
              人——均未披露缩减后的员工数，使外部无法评估公司能否同时推进临床开发候选药物（MB-111）和三个合作方项目。2025 年裁员被定位为战略校准而非财务困境，但集中风险叠加组织纵深不透明，仍值得尽调。
