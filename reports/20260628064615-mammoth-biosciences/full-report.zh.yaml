  - id: FO002
    title: Mammoth Biosciences 公司快照逻辑
    type: flow
    layout: standard
    summary: 这张流程图展示 Mammoth Biosciences 的 CRISPR 蛋白发现平台、超紧凑 Cas 系统、递送合作和内部管线，如何连接其商业模式与使命。
    data:
      nodes:
        - id: discovery
          label: CRISPR 蛋白发现引擎
          detail: 基于宏基因组学的平台识别新型 Cas 蛋白；组合包括 Cas12、Cas13、Cas14、CasΦ；从 UC Berkeley 获得独家许可
        - id: platform
          label: 超紧凑 CRISPR 系统
          detail: Cas14（约 530 aa）和 CasΦ（约 757 aa）——尺寸不到 Cas9 的一半；可在单个 AAV 中完成一体化包装，用于向肝外组织体内递送
        - id: delivery
          label: 递送合作
          detail: Regeneron AAV + 抗体靶向（2024 年 4 月）；Vertex Affinia AAV（2021 年 10 月）；Bayer（2022 年 1 月）；Mammoth 超紧凑系统可装入单个 AAV 衣壳
        - id: pipeline
          label: 内部管线
          detail: MB-111（高甘油三酯；家族性乳糜微粒血症综合征）；其他未披露体内项目；全资拥有的疗法
        - id: partners
          label: 合作方项目
          detail: Regeneron 合作（多个组织；每个靶点约 $370M 里程碑）；Vertex（两个适应症；最高 $650M 里程碑）；Bayer（四个领域；最高 $1B+ 里程碑）
        - id: mission
          label: 使命
          detail: 为患有危及生命和致残性疾病的患者开发长期治愈疗法；兑现 CRISPR 的全部潜力
      edges:
        - from: discovery
          to: platform
          label: 识别并表征
        - from: platform
          to: delivery
          label: 包装进合作方递送系统
        - from: platform
          to: pipeline
          label: 驱动全资疗法
        - from: delivery
          to: partners
          label: 支持合作项目
        - from: pipeline
          to: mission
          label: 内部项目走向
        - from: partners
          to: mission
          label: 合作项目走向
