  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与确信度
        blocks:
          - type: paragraph
            body: >-
              Mammoth Biosciences 的建议是跟踪而非买入，因为公司质量叙事强于价格发现叙事。正面案例是真实的：Mammoth 围绕顶级 CRISPR 科学创立，仍受益于 Jennifer Doudna
              的光环，并已获得 Vertex、Bayer 和 Regeneron 的有意义验证；三者合计预付款经济条款约 $181
              million。对于一个仍处于临床前阶段的基因编辑平台，这是异常强的外部证明。问题在于，估值支撑落后于叙事。最后一次披露价格是 2021 年 9 月独角兽轮，公司没有公开收入或烧钱披露，Regeneron
              股权支票也没有公布投后估值。公开 CRISPR 同业现在从 CRISPR Therapeutics 的 $5.40 billion 到 Editas 的 $0.43 billion
              不等，说明仅靠平台质量无法锁定溢价定价。基于现有证据，Mammoth 应留在观察名单，而不应追高。只有在 MB-111 达到 IND 申报并完成首例患者给药、合作现金生成相对于烧钱变得可见，或入场价格重置到
              Prime Medicine 或 Editas 及以下的临床前同业水平时，结论才会上调。
