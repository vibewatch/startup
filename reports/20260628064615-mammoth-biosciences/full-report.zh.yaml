  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 关键假设
      - 隐含估值
      - 概率信号
      - 关键下行触发因素
    rows:
      - - 牛市
        - MB-111 提交 IND 并完成首例患者给药，至少一个合作项目推进到产生里程碑的开发阶段，且 CRISPR 公开可比公司集合保持建设性。
        - $2.0B-$4.0B
        - 需要可见临床入场和战略性现金流证明，两者目前都未公开。
        - 下一次融资事件前出现临床延迟或合作停滞。
      - - 基准
        - Mammoth 仍具战略相关性并获得合作伙伴支持，但保持私有、临床前且只做部分披露。
        - $0.8B-$1.5B
        - 最贴合当前证据集合，并把 2021 年独角兽估值标记放在高端附近，而不是中枢。
        - 人体证据前出现融资需求，或私募市场价格发现偏弱。
      - - 熊市
        - MB-111 时间滑坡，合作伙伴里程碑仍然遥远，或 Mammoth 重新定价前板块情绪进一步走弱。
        - <$0.8B
        - 如果管理层必须防守性融资，或合作方降低承诺，该情景概率会上升。
        - 下轮融资估值下调、合作伙伴重新谈判，或临床前状态延长。
    notes: 情景估值是承销区间，不是管理层指引；它反映阶段、市场环境和披露质量折价，而不是 DCF 精度。
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV024
      - CV027
      - CV028
  - id: TV004
    title: 可比估值表
    columns:
      - 公司
      - 阶段
      - 市值 / 指标
      - 与 Mammoth 的相关性
      - 局限
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the verified June 2026 public CRISPR peer set retained for this chapter plus Caribou as a stage
        reference; market caps are cross-checked with CompaniesMarketCap and SEC filings where available, but the table
        is partial because private marks and some peers lack fully comparable disclosed metrics.
    rows:
      - - CRISPR Therapeutics
        - 拥有已获批产品 Casgevy、且有上市公司披露的 CRISPR 龙头
        - $5.40B 市值
        - 为已获商业验证的基因编辑平台划出估值上限。
        - 比 Mammoth 成熟得多，且已靠获批疗法降低风险。
      - - Beam Therapeutics
        - 临床阶段精准编辑平台
        - $3.58B 市值
        - 可作为上市市场里差异化编辑科学的高溢价参照。
        - Beam 披露更充分，也有 Mammoth 尚不具备的活跃临床项目。
      - - Intellia Therapeutics
        - 临床阶段体内编辑平台
        - $2.33B 市值
        - 最接近的上市参照：体内编辑平台仍能撑住数十亿美元价值。
        - Intellia 更成熟，同时估值已从此前高点大幅回落。
      - - Prime Medicine
        - 早期临床 / 商业化前先导编辑平台
        - $0.61B 市值
        - 对有科学差异化、尚无收入的平台，是较好的中低位锚点。
        - Prime 已上市，也不是超紧凑 CRISPR 的直接类比。
      - - Editas Medicine
        - 已重组的上市 CRISPR 公司
        - $0.43B 市值
        - 最强的下行警示：贴上 CRISPR 标签并不能保护估值。
        - 即便市值更低，Editas 的公开披露仍多于 Mammoth。
      - - Caribou Biosciences
        - 上市基因编辑同业，拥有 Phase 1 同种异体 CAR-T 试验
        - 已验证来源包未保留市值；仅用于阶段参照
        - 即便还没比较估值，也能看出 Mammoth 早于部分上市同业。
        - 本章未保留经验证的市值数字，因此不能直接用于精确估值对标。
    notes: 表格有意混合 2026 年 6 月的精确市值快照和一个仅用于阶段参照的同业；目的在于给出带阶段意识的估值框架，而不是用单一倍数制造虚假精度。
    claimRefs:
