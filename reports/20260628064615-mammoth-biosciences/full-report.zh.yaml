  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 类型
      - 论点
      - 支持证据
      - 什么会改变判断
    rows:
      - - 正方论点
        - 诺奖相关 CRISPR 科学，加上三家蓝筹药企伙伴，让 Mammoth 获得的外部验证多于典型临床前平台。
        - Vertex、Bayer 和 Regeneron 合计提供约 $181 million 前期经济利益，以及庞大的里程碑池。
        - 如果 MB-111 进入临床，且某个合作伙伴开始支付可见里程碑，正方论点会增强。
      - - 正方论点
        - 超紧凑编辑器如果能解决限制更大 CRISPR 系统的递送约束，就能支撑战略溢价。
        - 公开同业仍给具备更强阶段性证据的差异化基因编辑平台以数十亿美元市值。
        - 如果 Mammoth 发布转化数据，缩小与 Beam 或 Intellia 的阶段差距，正方论点会增强。
      - - 正方论点
        - Mammoth 仍有不止一条可信退出路径，因为一旦平台在临床上降风险，现有合作伙伴可能成为收购方。
        - Regeneron、Vertex 和 Bayer 已经了解该技术，并已建立合同关系。
        - 如果某个合作伙伴加深合作范围、延长期限或新增靶点，正方论点会增强。
      - - 反方论点
        - 上一次确认价格已经过时，属于 2021 年生物科技牛市，而不是 2026 年受压缩的 CRISPR 市场。
        - 2021 年独角兽融资之后，没有新的定价轮或披露估值标记发布。
        - 如果新的一级发行轮以有吸引力的经济条件重设条款，反方论点会削弱。
      - - 反方论点
        - Mammoth 仍处临床前，财务也不透明，投资人无法用收入、现金消耗或近期临床证据做锚。
        - 保留来源中没有公开收入、利润率或跑道披露，MB-111 也尚未进入人体试验。
        - 如果管理层披露跑道，并完成 IND 申报和首例患者给药，反方论点会削弱。
      - - 反方论点
        - 公开 CRISPR 可比公司显示，一旦执行或融资信心减弱，倍数会严重压缩。
        - Intellia 从约 $8.79 billion 跌到 $2.33 billion，Editas 也进入重组状态，说明平台溢价压缩可以很快。
        - 如果板块估值上修，同时 Mammoth 拿到阶段进展，反方论点会削弱。
    notes: 各行把公司质量和入场价格质量拆开，因此建议保持对价格敏感，而不是由叙事驱动。
