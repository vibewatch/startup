      - number: '8.3'
        title: 可比分析与板块降估值
        blocks:
          - type: paragraph
            body: >-
              对 Mammoth 最合适的公开可比集合不是单点估值方法，而是一个按阶段校准的区间。CRISPR Therapeutics 仍有约 $5.40 billion 估值，受益于已获批产品状态。Beam 交易在约
              $3.58 billion，Intellia 约 $2.33 billion，两者都有 Mammoth 尚不具备的上市公司披露和临床进展支撑。Prime Medicine 约 $0.61
              billion、Editas 约 $0.43 billion，则是更令人清醒的临床前或重组锚点，说明当市场折价执行风险和融资不确定性时，一个基因编辑平台可以值多少钱。Caribou 提供另一个有用参照：它有
              Phase 1 CAR-T 活性，因此即便已有活跃临床工作的公司，也不是 Mammoth 仍处临床前画像的完美溢价可比。同行集合最大的信号不是 Mammoth
              必须按某个数字交易，而是阶段、披露质量和市场制度现在远比类别身份更重要。Intellia 从约 $8.79 billion 峰值跌至约 $2.33 billion，也强化了 2021 年 CRISPR
              热情已经大幅压缩这一点。
