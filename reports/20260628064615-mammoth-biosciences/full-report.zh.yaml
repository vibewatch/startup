      - number: '1.2'
        title: 领导层、创始人与治理
        blocks:
          - type: paragraph
            body: >-
              Trevor Martin, Ph.D.（Stanford）自公司 2018 年创立起担任 CEO 兼联合创始人，截至运行日仍在任；相较同业，Mammoth 具备少见的创始人 CEO 连续性。他在 2025 年
              1 月和 2026 年 1 月均出席 J.P. Morgan Healthcare Conference，显示其仍积极面向机构投资者。

              Janice Chen, Ph.D.（UC Berkeley，Doudna Lab）是联合创始人、首席科学官兼研究总裁。她同时领导 CRISPR 平台科学工作，并持有 CSO / 总裁头衔；相较发布时最初的
              CTO 定位，职责已显著扩大。她在 2022 年 3 月接受 CNBC 专访，并于 2023 年被 Fierce Biotech 报道，是治疗转型的重要公开发声者。

              Lucas Harrington, Ph.D.（UC Berkeley）是联合创始人，早期新闻稿曾列其为首席科学官；较新的官方材料将其描述为联合创始人，Chen 则担任
              CSO。最新留存来源未能明确确认其当前准确头衔。

              Jennifer Doudna, Ph.D. 是联合创始人兼科学顾问委员会主席。她是 2020 年诺贝尔化学奖得主、UC Berkeley Li Ka Shing Chancellor's Chair
              教授。Doudna 未被列为运营高管，但所有合作新闻稿都显著引用她；她广泛被视为公司的声誉和智识锚点。

              Ashley Tehranchi, Ph.D.（Stanford）在 2018 年 4 月发布新闻稿和 Series A 新闻稿中被列为 CTO 兼联合创始人，但到约 2019 年 5 月已离任
              CTO。2022–2026 年的领导层材料不再列名她。

              官方 about / partner 页面列出的董事会包括：Trevor Martin（联合创始人、CEO、董事）、Jeff Huber（Triatomic Capital 主席；Grail
              前联合创始人、Illumina 前董事会成员，2020 年 1 月 Series B 时加入董事会）、Amrit Nagpal（Redmile Group）、Min Cui, Ph.D.（Decheng
              Capital）、Ursheet Parikh（Mayfield；领投 Series A）、Maneesh Jain, Ph.D.（Mirvie CEO / 联合创始人）和 Bob Brown,
              Ph.D.（Dicerna 前 EVP R&D 兼总裁）。

              创始团队之外的高管包括 Elaine Sun（COO 兼 CFO，来自 Halozyme Therapeutics；曾主导 Halozyme $800M+ 可转债发行）、Phil
              Tinmouth（首席商务官，此前任职 Pardes Biosciences，并在 Vertex Pharmaceuticals 近 20 年）以及 Siang Chin（总法律顾问，此前任职
              Affymetrix 和 Intuitive Surgical）。Peter Nell 在 Vertex 合作公布时担任首席商务官兼治疗战略负责人，后由 Tinmouth 接任。

              关键人集中：Trevor Martin 同时担任 CEO 和联合创始人，且未见公开任命的接班人，构成集中风险。Jennifer Doudna 对合作谈判的声誉价值——包括 Regeneron
              在内的合作方明确引用——构成第二层关键人依赖。两者均未公开披露正式接班计划。
