      - number: '8.4'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              情景框架比 DCF 或收入倍数精确计算更站得住脚，因为 Mammoth 没有披露经营指标。牛市情景支持隐含 $2 billion 至 $4 billion 区间，前提是 MB-111
              按时进入临床、合作项目产生带里程碑的进展，且投资者继续奖励超紧凑 CRISPR 作为差异化递送赋能平台。基准情景更窄，约 $0.8 billion 至 $1.5 billion：Mammoth
              保留真实战略价值，但公开证据仍支持因临床前阶段、财务不透明和板块压缩而打折。若 MB-111 延误、合作停滞，或 Mammoth 在人体概念验证前需要新资本，熊市情景会降至 $0.8 billion
              以下。换句话说，过时的独角兽估值不一定明显错误，但它不再值得被视为重心。它位于基准情景顶部与牛市情景低端之间，而不是默认公允价值。
