  - id: TV006
    title: 论点破裂与终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 传导机制
      - 行动
    rows:
      - - 临床滑期
        - MB-111 错过下一个已沟通的 IND 或首例患者里程碑
        - 平台承诺通向人体证据的唯一可见路径被推迟。
        - 削减牛市情景，把锚点调回熊市 / 基准边界附近。
      - - 融资重置
        - 新一级融资定价低于基准情景低端，且没有更强披露
        - 说明私募买家给平台的折价，比当前叙事暗示的更重。
        - 按新条款重建估值，并很可能下调投资姿态。
      - - 合作停滞
        - Regeneron、Vertex 或 Bayer 没有可见的里程碑推进、范围扩大或新靶点工作
        - 支撑其高于低位上市同业的战略溢价被压缩。
        - 降低信心，把合作价值视作期权，而非可持续价值。
      - - 合作重谈
        - 合作范围大幅收窄，或经济条款向下修订
        - 暗示平台拉动变弱，退出可选性下降。
        - 将公司重估到区间低端。
      - - 财务不透明延续
        - 管理层在融资尽调中拒绝披露现金、烧钱率、资金续航或优先权结构
        - 标题估值高估新钱经济价值的概率上升。
        - 暂停尽调，直到融资透明度改善。
      - - 诊断回退叙事重现
        - 管理层重新强调诊断，却拿不出经常性商业进展
        - 故事从高价值疗法溢价论点转向低价值后备论点。
        - 施加更大折价，并重新审视下行可比公司。
    notes: 这些触发因素是可监控事件，而非泛泛风险，投资委员会可据此尽早判断估值论点是否正在破裂。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV041
      - CV042
  - id: TV007
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 现金 / 资金续航
        - 裁员和合作收款后的当前现金余额、月度烧钱率、下行情景资金续航
        - 决定 Mammoth 能否等到临床拐点，还是必须防御性融资。
        - 要求提供最新董事会材料、资产负债表和 24 个月现金预测。
      - - 股权结构 / 优先权
        - 完全稀释股权结构、清算优先权栈、合作方附函、任何票据转换条款
        - 若优先权包袱较大，标题估值可能高估普通股价值。
        - 要求提供融资文件和律师准备的股权结构备忘录。
      - - 合作会计
        - 来自 Vertex、Bayer、Regeneron 的已确认收入、递延收入和实际到账现金
        - 将战略标题与经营进展分开。
        - 要求提供 ASC 606 明细表和合作方合同摘要。
      - - MB-111 IND 路径
        - IND 申报前剩余 CMC、毒理、监管工作，以及计划首例患者窗口
        - 进入临床是估值区间里最大的摆动因素。
        - 要求提供带门槛假设和预算的开发时间表。
      - - 合作项目状态
        - 按合作拆分的靶点层面进展、里程碑日历和内部资源配置
        - 厘清里程碑现金是近期机会，还是仍然遥远的可选性。
        - 要求提供项目治理材料和最新联合指导委员会更新。
      - - 重组后运营能力
        - 35 人和 24 人两轮裁员后的按职能人数和招聘计划
        - 检验 Mammoth 是否能同时推进内部与合作项目。
        - 要求提供组织架构图、已批准招聘计划和运营复盘材料。
    notes: 每一项要求都直接对应公开来源无法闭合的估值不确定性，因此这张表也是最低可行私人尽调清单。
    claimRefs:
      - CV008
      - CV017
      - CV022
      - CV023
      - CV028
      - CV043
