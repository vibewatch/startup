      - number: '5.3'
        title: DETECTR 诊断平台与监管脉络
        blocks:
          - type: paragraph
            body: >-
              DETECTR 平台是 Mammoth 超紧凑 CRISPR 核酸酶可落地为受监管诊断产品的基础展示。DETECTR 使用 guide-RNA 编程的 CRISPR
              蛋白搜寻特定核酸序列；一旦找到靶标，蛋白就激活报告分子的旁切，生成可检测信号。平台覆盖 Cas12 的双链 DNA 检测、Cas13 的单链 RNA 检测，以及 Cas14 在无严格 PAM 限制下的单链 DNA
              检测，几乎可检测任何核酸生物标志物。公司设想了多种形态：高复杂度实验室仪器、即时检测设备，以及免仪器侧向层析检测，目标是把 CRISPR 检测带到医院、即时检测场景，并最终进入家庭使用。COVID-19
              疫情期间，Mammoth 与 UCSF 共同开发 SARS-CoV-2 RNA DETECTR 检测，并于 2020 年发表于 Nature Biotechnology。该研究在 78 名患者中验证了 95%
              阳性预测一致性和 100% 阴性预测一致性，使用 CRISPR-Cas12a 侧向层析在 40 分钟内检测病毒 N 基因，代表了相较 CDC RT-PCR 基准更快的替代方案。另一路径上，Mammoth 于
              2020 年 8 月为其 SARS-CoV-2 DETECTR Reagent Kit 获得 FDA Emergency Use Authorization，授权用于高复杂度 CLIA 认证实验室；UCSF
              也为在其临床设施运行的 RNA DETECTR 检测获得平行 EUA。COVID 公共卫生紧急状态结束后，两项授权随后均被撤销。正确框定这段监管历史很重要：EUA 授予的是作为试剂盒制造商的 Mammoth
              Biosciences，确认 Mammoth 跑通过一个 CRISPR 产品的 FDA 监管路径。诊断经验还沉淀了基础 CRISPR 旁切 IP 资产。截至 2026 年 6 月，Mammoth 将
              DETECTR 宣传为可用于未来诊断合作的平台，但公开记录看不到活跃的商业诊断产品或管线项目。
