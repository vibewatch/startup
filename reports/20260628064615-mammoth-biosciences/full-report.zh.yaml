      - number: '4.3'
        title: 资本充足度、烧钱信号与跑道不确定性
        blocks:
          - type: paragraph
            body: >-
              资本充足度图景强于披露图景。留存来源至少披露了 2018 年 $23 million Series A 融资、2021 年 9 月宣布的 $195 million 融资（其中包括 $150 million
              Series D，以及此前未披露、于 2020 年底完成的 $45 million Series C），以及 2024 年 Regeneron 合作中嵌入的 $95 million
              战略股权投资。仅这些已公开资本流入就至少达到 $313 million，还未计入任何 Series B 资本、未披露的种子轮融资，或非股权合作现金。因此，公开来源支持 Mammoth
              已筹集大量资本这一结论，但不支持在没有保留意见的情况下给出一个干净的累计融资总额。


              分歧主要在分类和时点，而不是公司是否真的融过钱。Business Wire 和 MedCity 对 2021 年宣布的 $195 million 头条金额一致，但 MedCity 明确将其拆成两轮，其中
              Series C 已在 2020 年底完成。2024 年 Regeneron 交易进一步搅乱统计，因为它把 $95 million
              股权与单独的预付款合作现金放在一起。不同来源若分别计入战略股权、风险投资轮、可转债，或只计入头条融资，总融资数字会明显变动。


              公开证据没有披露的，正是投资者现在最需要的信息：当前现金余额、月度烧钱、现金跑道，或把 MB-111 推进临床所需预算。2023 年和 2025
              年裁员是最清晰的公开烧钱信号。它们意味着管理层反复围绕治疗业务执行和合作支持来调整组织规模。但管理层也在 2025
              年称公司财务状况独特地强劲，因此不能把这些裁员直接解读为困境。合理结论是：资本充足度方向上优于典型临床前生物科技公司，但仅靠公开数据无法承销跑道。
