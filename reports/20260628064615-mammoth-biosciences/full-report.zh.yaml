      - number: '5.2'
        title: 领先治疗管线、MB-111 与递送架构
        blocks:
          - type: paragraph
            body: >-
              Mammoth 的领先全资项目 MB-111 是首个获提名的临床开发候选药物，靶向
              APOC3，即肝脏甘油三酯代谢的关键调节因子。目标患者包括家族性乳糜微粒血症综合征（FCS）和重度高甘油三酯血症（sHTG）患者，其特征是血浆甘油三酯水平超过 1000
              mg/dL，导致反复急性胰腺炎并提高心血管风险。截至运行日，FCS 没有 FDA 批准疗法。MB-111 用脂质纳米颗粒（LNP）封装 CasPhi，经静脉递送至肝脏，永久破坏 APOC3
              基因表达，从而减少载脂蛋白 C-III（apoC-III）生成并降低血浆甘油三酯。CasPhi 尺寸紧凑，不到 Cas9 一半，因此能在 LNP 配方中高效封装 mRNA，并与成熟 RNA
              治疗递送路径相匹配。该项目于 2024 年被提名为临床开发候选药物，IND-enabling 研究计划同年启动，临床目标定为 2026 年。ESGCT 2025 口头数据（10 月 8
              日，Seville）显示，NHP 中肝脏编辑达到饱和、apoC-III 持续下降；在人源化高甘油三酯血症转基因小鼠模型中，apoC-III
              和血清甘油三酯大幅下降；耐受性可接受，高剂量下仅出现一过性肝功能检测升高。MB-111 之外，已披露管线包括使用多种编辑技术的未披露肝脏项目，以及内部和合作的神经肌肉、CNS 项目。肝外覆盖则由 NanoCas
              承担平台载体角色：它通过单次全身 AAV 递送，在食蟹猴骨骼肌中实现超过 30% 体内编辑效率；在人源化 DMD 小鼠模型的多种肌肉组织中实现 10% 至 40% dystrophin
              基因编辑；在小鼠肝脏中实现约 60% PCSK9 编辑——以三分之一尺寸达到 SaCas9 水平。NanoCas 的单 AAV
              架构还可在肝外组织中容纳碱基编辑、逆转录酶编辑和表观遗传编辑。因此，递送模型是双轨：LNP 用于 MB-111 等基于 CasPhi 的肝脏项目，单 AAV NanoCas 用于肝外适应症。与
              Regeneron（$100 million 预付款加股权，每个靶点最高 $370 million 里程碑）和 Vertex（$40 million 预付款，最高 $650 million
              潜在未来付款，两个体内适应症）的合作，在商业上验证了平台，也补充了 AAV 递送能力。
