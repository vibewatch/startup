      - number: '5.4'
        title: 差异化、IP 组合与质量证据缺口
        blocks:
          - type: paragraph
            body: >-
              Mammoth 的差异化建立在四项相互叠加的资产上：通过内部引擎专有发现竞争对手无法获得的超紧凑核酸酶；从 UC Berkeley 独家授权基础旁切 IP；在具有转化相关性的 NHP
              动物模型中取得临床前疗效数据；以及由诺贝尔奖得主 Jennifer Doudna 锚定的创始团队。IP 基础包括从 UC Berkeley 独家授权 Cas12、Cas13、Cas14 和 CasPhi
              的全领域权利。旁切专利资产以 US Patent 10337051（用基于 Cas13 的旁切检测目标 RNA 的方法和组合物）和 US Patent 10253365（用于 ssDNA 切割和目标 DNA
              检测的 Type V CRISPR-Cas 效应蛋白）为锚。任何基于这些 Cas 家族旁切机制的商业诊断或治疗产品都需要从 Mammoth 获得授权。临床前差异化同样有意义。NHP
              中肝脏编辑达到饱和、MB-111 ESGCT 2025 数据显示安全性耐受良好、NanoCas 在 NHP 中实现超过 30% 肌肉编辑，都是技术上令人印象深刻的结果。NanoCas 解决单 AAV
              肝外递送问题，是领域层面的进展；基于 Cas9 的竞争者尚未在相近效率下做到这一点。招聘页面确认 Mammoth 正在 Brisbane, California 设施积极招聘临床开发人才（Senior
              Clinical Scientist），支持其持续推进管线开发的说法。不过，质量和监管成熟度必须如实评估。截至 2026 年 6 月，Mammoth 在 ClinicalTrials.gov
              上没有注册介入性临床试验。MB-111 的 IND 尚未公开宣布。公司没有披露 GLP 研究报告、CMC 制造数据或正式质量体系文件。所有 MB-111 疗效数据仍停留在会议摘要和新闻稿层级；尚未找到 NHP
              APOC3 数据的同行评审期刊论文。NanoCas 数据仅以预印本形式存在。这些缺口对一家 pre-IND 阶段公司而言可以预期，但会带来实质承销风险：临床执行是否能匹配临床前表现仍未证明。
