callouts:
- calloutType: strength
  title: Nobel-Laureate Co-Founder and Largest CRISPR Toolbox Underpin Partnership Credibility
  body: Jennifer Doudna''s co-founder status and continued SAB Chair role provides Mammoth with unmatched scientific credibility in partnership negotiations—explicitly cited in the Regeneron April 2024 press release. The company''s proprietary portfolio of Cas12, Cas13, Cas14, and CasΦ represents the most comprehensive licensed CRISPR protein toolbox of any private company, enabling both diagnostic and therapeutic applications and supporting three concurrent Big Pharma collaborations (Vertex, Bayer, Regeneron) with cumulative upfront payments of $181 million.
  claimRefs:
  - CO005
  - CO007
  - CO025
  - CO026
  - CO027
- calloutType: strength
  title: Ultracompact CRISPR Enables Extrahepatic In Vivo Delivery—Structural Advantage Over Cas9
  body: Cas14 at ~530 amino acids and CasΦ at ~757 amino acids are each less than half the size of Cas9 (~1,368 amino acids). This compact size enables packaging alongside delivery vectors and guide RNA into a single AAV capsid, addressing the dominant bottleneck in in vivo gene editing—delivery beyond the liver. No other company has publicly disclosed a CRISPR editing platform with equivalent AAV co-packaging capability at scale. Regeneron''s decision to build its AAV antibody-targeting platform around Mammoth''s enzymes validates this structural advantage.
  claimRefs:
  - CO006
  - CO008
  - CO028
- calloutType: risk
  title: Founder-CEO Key-Person Concentration and Undisclosed Headcount Create Operational Uncertainty
  body: Trevor Martin has served as the sole CEO since founding in 2018, with no publicly named successor or operational co-leader. Two workforce reductions—approximately 35 staff in March 2023 and 24 staff in May 2025—have occurred without disclosure of the resulting headcount, making it impossible to assess the company''s execution capacity for its clinical development candidate (MB-111) and three partner programs simultaneously. The 2025 cut was positioned as strategic alignment rather than financial distress, but the combination of concentration risk and opaque organizational depth warrants diligence.
  claimRefs:
  - CO010
  - CO035
  - CO036
  - CO037
- calloutType: risk
  title: Clinical Stage Is Pre-IND; Valuation Not Updated Since 2021 Unicorn Round
  body: Despite significant partnership capital (total disclosed upfront payments of ~$276M from Vertex, Bayer, and Regeneron), Mammoth''s first clinical development candidate (MB-111) was only nominated in 2025, and no IND filing has been announced as of the run date. The last disclosed post-money valuation (>$1B) dates to September 2021, creating a valuation gap of nearly five years. Investors should seek a current 409A or contemporaneous valuation as part of diligence; significant dilution and valuation re-rating risk may exist given the clinical timeline.
  claimRefs:
  - CO023
  - CO033
  - CO034
