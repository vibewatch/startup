    - id: platform
      label: Ultracompact CRISPR Systems
      detail: Cas14 (~530 aa) and CasΦ (~757 aa) — less than half the size of Cas9; enables all-in-one AAV packaging for in vivo delivery to extrahepatic tissues
    - id: delivery
      label: Delivery Partnerships
      detail: Regeneron AAV + antibody targeting (April 2024); Vertex Affinia AAV (Oct 2021); Bayer (Jan 2022); Mammoth ultracompact systems fit within single AAV capsid
    - id: pipeline
      label: Internal Pipeline
      detail: MB-111 (high-triglyceride; familial chylomicronemia syndrome); additional undisclosed in vivo programs; wholly-owned therapeutics
    - id: partners
      label: Partner Programs
      detail: Regeneron collaboration (multiple tissues; ~$370M per target milestones); Vertex (two indications; up to $650M milestones); Bayer (four areas; up to $1B+ milestones)
    - id: mission
      label: Mission
      detail: Develop long-term curative therapies for patients with life-threatening and debilitating diseases; deliver on the full promise of CRISPR
