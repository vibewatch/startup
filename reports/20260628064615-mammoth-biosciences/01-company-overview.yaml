- id: capital-base-and-partnerships
  title: Capital Base, Investors, and Strategic Partnerships
  body: 'Mammoth Biosciences has disclosed four equity financing rounds. In July 2018 it announced a $23 million Series A led by Mayfield (Ursheet Parikh) with participation from NFX and 8VC; seed-stage backing from AME Cloud, Wireframe, Kairos, and Boom Capital preceded the Series A. In January 2020 it announced a $45 million Series B led by Decheng Capital with participation from Mayfield, NFX, Verily, Brook Byers, Plum Alley, Pacific 8, aMoon, and others. In September 2021, Mammoth disclosed two previously unannounced rounds simultaneously: a $45 million Series C (closed late 2020) led by Redmile Group and Foresite Capital with Amazon and other early investors, and a $150 million Series D led by Redmile Group with Foresite Capital, Senator Investment Group, Sixth Street, Mayfield, Decheng Capital, and NFX. The $195 million combined 2021 announcement vaulted Mammoth''s valuation above $1 billion (unicorn status), per both MedCity News and Forbes reporting.

    In April 2024 Mammoth and Regeneron Pharmaceuticals announced a broad collaboration pairing Mammoth''s ultracompact CRISPR systems with Regeneron''s antibody-targeted AAV delivery platform. Under the terms, Mammoth received $100 million inclusive of $95 million in equity investment and an upfront payment; is eligible for up to $370 million per target in development, regulatory, and commercial milestones; and receives royalty rates ranging from single digits to mid-teens on net sales. Mammoth also has the right to opt in to co-funding and profit sharing on a majority of collaboration programs.

    In October 2021 Mammoth and Vertex Pharmaceuticals announced a collaboration for two in vivo gene-editing indications. Vertex agreed to pay $41 million upfront (including a convertible note investment) with up to $650 million in milestones across the two programs, plus tiered royalties. In January 2022, Bayer AG announced a collaboration agreement with Mammoth for gene-editing technologies across four disease areas, with $40 million upfront and milestones potentially exceeding $1 billion.

    Total equity disclosed across the four rounds is approximately $263 million ($23M + $45M + $45M + $150M), excluding undisclosed seed; add the 2024 Regeneron equity investment of $95 million and the total disclosed equity investment reaches approximately $358 million before accounting for the Vertex convertible note or Bayer equity component. The post-Series D valuation exceeded $1 billion; no subsequent disclosed post-money figure is available. Revenue, ARR, and debt instruments are undisclosed in retained sources.'
