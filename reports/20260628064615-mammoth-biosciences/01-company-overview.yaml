chapter:
  number: 1
  title: Company Overview
  summary: Mammoth Biosciences is a private, clinical-stage biotechnology company headquartered in Brisbane, California, founded in 2017–2018 by CRISPR Nobel laureate Jennifer Doudna, Trevor Martin, Janice Chen, and Lucas Harrington—with Ashley Tehranchi as an additional co-founder named in the launch press release. The company launched publicly in April 2018 with an initial focus on CRISPR-based diagnostics, then pivoted decisively in 2023 toward in vivo gene editing therapeutics built on proprietary ultracompact CRISPR systems (Cas14, CasΦ, and successors) that are significantly smaller than conventional Cas9. Four disclosed financing rounds totaling approximately $308M in equity (Seed/pre-A, $23M Series A 2018, $45M Series B 2020, $45M undisclosed Series C late 2020, and $150M Series D 2021) propelled the company to a unicorn valuation (>$1B) in September 2021. Strategic partnerships with Vertex Pharmaceuticals ($41M upfront, up to $650M milestones, 2021), Bayer ($40M upfront, up to $1B+ milestones, 2022), and Regeneron ($100M upfront equity+cash, up to $370M per target in milestones, 2024) anchor the current business model. CEO and co-founder Trevor Martin has led the company since inception. The first clinical development candidate, MB-111 (targeting high-triglyceride diseases), was nominated in 2025. A 2023 diagnostics de-emphasis led to the layoff of approximately 35 staff, and a further 24-role reduction occurred in 2025 as part of strategic realignment. Headcount is not cleanly disclosed. Revenue and ARR are undisclosed.
