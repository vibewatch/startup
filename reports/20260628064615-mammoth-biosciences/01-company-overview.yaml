- id: leadership-governance
  title: Leadership, Founders, and Governance
  body: 'Trevor Martin, Ph.D. (Stanford) has served as CEO and co-founder since the company''s inception in 2018 and remains in that role as of the run date, giving Mammoth unusual founder-CEO continuity relative to peers. He has presented at the J.P. Morgan Healthcare Conference in both January 2025 and January 2026, signaling active leadership engagement with institutional investors.

    Janice Chen, Ph.D. (UC Berkeley, Doudna Lab) is co-founder, Chief Scientific Officer, and President of Research. Her role combines scientific leadership of the CRISPR platform with the CSO/President title, reflecting a significant expansion of her responsibilities from the original CTO designation at launch. She was profiled by CNBC in March 2022 and Fierce Biotech in 2023 and has been an important public spokesperson for the therapeutic pivot.

    Lucas Harrington, Ph.D. (UC Berkeley) is co-founder and was listed as Chief Scientific Officer in earlier press releases; more recent official materials describe his role as co-founder, with Chen occupying the CSO title. His precise current title is not definitively confirmed in the most recent retained sources.

    Jennifer Doudna, Ph.D. is co-founder and Chair of the Scientific Advisory Board. She is the 2020 Nobel Laureate in Chemistry and Li Ka Shing Chancellor''s Chair Professor at UC Berkeley. Doudna is not listed in an operating executive role but is cited prominently in all partnership press releases and is widely recognized as a reputational and intellectual anchor for the company.

    Ashley Tehranchi, Ph.D. (Stanford) was named CTO and co-founder in the April 2018 launch and Series A press releases but departed the CTO role by approximately May 2019. She is not named in leadership materials as of 2022–2026.

    The board of directors, as listed on the official about/partner page, includes: Trevor Martin (co-founder, CEO, director), Jeff Huber (Chair, Triatomic Capital; former Grail co-founder and Illumina board member, joined board at Series B in January 2020), Amrit Nagpal (Redmile Group), Min Cui, Ph.D. (Decheng Capital), Ursheet Parikh (Mayfield; led Series A investment), Maneesh Jain, Ph.D. (CEO/co-founder Mirvie), and Bob Brown, Ph.D. (former EVP R&D and President, Dicerna).

    Senior executives beyond the founding team include Elaine Sun (COO and CFO, joined from Halozyme Therapeutics; led Halozyme''s $800M+ convertible offering), Phil Tinmouth (Chief Business Officer, previously Pardes Biosciences and nearly 20 years at Vertex Pharmaceuticals), and Siang Chin (General Counsel, previously Affymetrix and Intuitive Surgical). Peter Nell served as Chief Business Officer and Head of Therapeutics Strategy during the Vertex partnership announcement but was succeeded by Tinmouth.

    Key-person concentration: Trevor Martin''s combined role as CEO and co-founder, with no apparent succession candidate named, represents a concentration risk. Jennifer Doudna''s reputational value to partnership negotiations—explicitly cited by partners including Regeneron—constitutes a secondary key-person dependency. No formal succession plan for either has been publicly disclosed.'
