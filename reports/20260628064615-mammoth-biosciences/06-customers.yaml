  body: Mammoth has unusually strong named counterparty proof for a preclinical biotech—three blue-chip pharma partners, federal diagnostics support, and a 2026 Abu Dhabi ecosystem deal—but public proof still narrows to a small set of counterparties rather than a diversified installed base.
