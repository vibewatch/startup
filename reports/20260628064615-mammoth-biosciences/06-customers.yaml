- id: durability-gaps-and-concentration
  title: Durability gaps and concentration
  body: 'The real weakness in Mammoth''s customer chapter is not lack of logos but lack of durability metrics. No retained public source discloses active customer count, live partner-program count, NRR, GRR, churn, referenceable renewal history, satisfaction, or diagnostics reorder data. Investors therefore have to infer quality from deal structures and strategic behavior rather than from cohort math. That inference is directionally positive for therapeutic partners—three large counterparties paid real upfront economics and accepted long-dated milestones—but still incomplete. Even the best public retention proxy, the structure of the Regeneron agreement, is about contractual access and optionality rather than observed expansion behavior.


    Concentration is the second major issue. Public customer proof is clustered in Regeneron, Vertex, Bayer, NIH-era diagnostics support, and now M42 / Abu Dhabi. Diagnostics also looks more historical than current: the COVID EUA period delivered real validation, but the revocation of those authorizations and Mammoth''s 2023 and 2025 restructurings imply that management no longer treats diagnostics as the main commercial engine. That does not erase the value of DETECTR; it reframes it as proof of technical and regulatory competence rather than as a visible recurring business. The underwriting conclusion is therefore nuanced but clear: Mammoth has real customer signal, especially in therapeutic partnerships, but customer durability and diversification remain under-documented diligence items.'
