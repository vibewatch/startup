company:
  name: Mammoth Biosciences
chapter:
  number: 6
  title: Customers
  summary: 'Mammoth Biosciences has credible customer proof, but it is concentrated and structurally different across therapeutics and diagnostics. The best evidence is three named biopharma counterparties—Regeneron, Vertex, and Bayer—plus NIH-backed diagnostics scale-up, FDA-authorized CLIA-lab use, a historical GSK consumer-diagnostics partnership, and a new 2026 Abu Dhabi / M42 development collaboration. What is still missing is the public-data layer investors actually need for customer quality: active customer count, renewal behavior, utilization, churn, and partner-by-partner revenue concentration.'
sections:
- id: segment-mix-and-gtm
  title: Segment mix and go-to-market
  body: 'Mammoth''s customer story is really three customer stories living inside one company. The first and now most important segment is large biopharma: Regeneron, Vertex, and Bayer are not just strategic logos but counterparties paying upfront economics for access to Mammoth''s ultracompact CRISPR systems. The second segment is a historical diagnostics channel that reached federally funded scale-up, manufacturing partners, and regulated CLIA-lab workflows during COVID. The third is emerging ecosystem development, exemplified by the 2026 Abu Dhabi / M42 / DoH collaboration, where the value exchange is less about immediate product revenue and more about clinical-research access, manufacturing capability buildout, and future geographic reach.


    The common GTM logic across these segments is that Mammoth sells platform leverage rather than a broad catalog of mature end products. Official pages describe partnerships as the mechanism for translating the CRISPR portfolio into cutting-edge applications, while the diagnostics page explicitly says DETECTR can be integrated into products by Mammoth or its partners. That matters because it explains why customer proof looks strong at the top of the funnel—well-known counterparties, regulatory milestones, government support—but thin at the bottom of the funnel where investors would want active account counts, retention, reorder frequency, or installed-base expansion. Mammoth has credible buyers and users; it does not have public SaaS-like customer analytics.'
