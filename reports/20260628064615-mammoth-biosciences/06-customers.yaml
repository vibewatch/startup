- id: TU006
  title: Go-to-market motion table
  columns:
  - Motion
  - Segment
  - Who leads commercialization
  - Why it fits Mammoth
  - Limitation
  rows:
  - - Direct platform collaboration
    - Large biopharma
    - Partner leads downstream development/commercialization after joint target selection
    - Matches Mammoth's CRISPR platform and small-company footprint
    - Creates partner concentration
  - - Government-backed scale-up
    - Public health / commercial labs
    - Mammoth plus federally supported channel build
    - Useful in emergency diagnostics buildout
    - May not persist after emergency demand
  - - Manufacturing + automation channel distribution
    - Clinical laboratories
    - MilliporeSigma / Hamilton / Agilent ecosystem
    - Lets Mammoth reach labs without building a large direct sales force
    - Channel economics undisclosed
  - - Consumer co-development
    - Home testing / retail
    - GSK consumer-health channel
    - Could have expanded DETECTR beyond labs
    - Public launch proof missing
  - - Sovereign / ecosystem collaboration
    - Health systems and national genomics programs
    - DoH + M42 + Mammoth shared buildout
    - Extends geography and manufacturing leverage
    - Still early and non-standard for biotech GTM
  notes: 'The motions vary sharply by segment: therapeutics is partner-led licensing, while diagnostics historically depended on regulatory authorization and channel partners.'
