- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Representative proof
  - Current stage
  - Strategic value
  - Gap
  rows:
  - - Large biopharma therapeutic partners
    - Buyer = partner pharma; user = joint R&D teams; payer = partner
    - Regeneron, Vertex, Bayer
    - Current and central
    - Upfront cash, milestones, royalties, validation
    - No partner-by-partner utilization or renewal disclosure
  - - Government-funded diagnostics programs
    - Buyer/payer = NIH RADx; user = Mammoth plus commercial labs
    - NIH RADx contract
    - Historical
    - Non-dilutive scale-up funding and external validation
    - No public cash-receipt bridge beyond contract references
  - - Clinical laboratories
    - Buyer/user = high-complexity CLIA labs; payer = labs/health systems
    - FDA EUA and DETECTR BOOST workflow
    - Historical / emergency-era
    - Proves regulated workflow fit
    - No current post-EUA installed-base disclosure
  - - Manufacturing and automation channel partners
    - Buyer = labs and public-health programs; user = partner-led workflow
    - MilliporeSigma and Hamilton
    - Historical support
    - Scaled manufacturing and turnkey workflow delivery
    - No disclosed recurring channel revenue
  - - Consumer / home diagnostics partner
    - Buyer = consumers eventually; user = patients/clinics; payer = retail/consumer channel
    - GSK Consumer Healthcare collaboration
    - Historical development
    - Shows ambition beyond clinical settings
    - No disclosed launch, approval, or revenue
  - - Sovereign / health-system development partners
    - Buyer/payer = Abu Dhabi ecosystem; user = clinical research sites
    - DoH Abu Dhabi + M42
    - Current but early
    - Extends geography and manufacturing ambitions
    - Commercial economics not disclosed
  - - Research institutions
    - Buyer/user unknown
    - No current named customers retained
    - Unclear
    - Could broaden platform reach if present
    - Named academic customer list not publicly found
  notes: Stages are judged as of 2026-06-28 from retained public sources; unknown customer counts are preserved as gaps rather than inferred totals.
