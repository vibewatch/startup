callouts:
- calloutType: risk
  title: The central risk is human translation, not platform novelty
  body: Mammoth has differentiated nucleases and an active IP engine, but none of that substitutes for human data. Until MB-111 clears IND and begins dosing, the biggest uncertainties remain off-target biology, immune response, delivery, and regulatory execution.
  claimRefs:
  - CR001
  - CR007
  - CR020
  - CR023
