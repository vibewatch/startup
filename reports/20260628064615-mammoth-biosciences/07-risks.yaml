- id: technology-and-development-risk
  title: Technology and development risk
  body: 'The second risk bucket is scientific translation. Mammoth''s differentiated proposition is real: ultracompact nucleases can relieve payload constraints and potentially unlock tissues that are difficult for legacy editors. But a better payload story is not the same as a clinically proven therapy. MB-111 remains at the IND-enabling stage, and Mammoth''s own public pipeline still shows the rest of the internal portfolio in research or lead optimization. The 2026 literature retained for this run is unusually clear that the field''s hard problems are no longer just whether CRISPR can edit DNA, but whether editing can be delivered with acceptable off-target, immune, and long-term genome-integrity risk in living humans.


    Mammoth therefore faces a paradox typical of next-generation platform companies: its novelty is the source of both upside and underwriting risk. CasPhi may be smaller than Cas9 and potentially more flexible, yet Mammoth still has to show that the editing system, delivery vehicle, and indication biology work together under a regulator''s lens. The diagnostics history adds another wrinkle. DETECTR proved Mammoth could commercialize science during an emergency, but the revocation of the COVID EUAs and the subsequent diagnostics retrenchment show that historical traction does not by itself create a durable fallback business. In other words, Mammoth''s biggest technology risk is not whether the platform is interesting—it clearly is—but whether it can cross the last mile from differentiated preclinical science to repeatable clinical execution.'
