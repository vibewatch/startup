company:
  name: Mammoth Biosciences
chapter:
  number: 7
  title: Risks
  summary: 'Mammoth''s risk profile is exactly what investors should expect from a preclinical gene-editing platform that has strong strategic validation but no human data: high. The company faces a layered FDA path, unresolved CRISPR patent complexity, off-target and immune-safety translation risk, concentration in a handful of large partners, and limited public runway disclosure after two restructurings. The upside is real, but so are the thesis-break triggers: MB-111 delay, safety surprises, partner attrition, deeper layoffs, or inability to show capital adequacy into the clinic.'
sections:
- id: regulatory-and-ip-risk
  title: Regulatory and IP risk
  body: 'Mammoth''s first and most inescapable risk is that it sits inside two hard regulatory systems at once: the gene-editing safety framework of the FDA and the still-contested CRISPR patent landscape. The FDA path is not just “get to clinic.” The 2024 genome-editing guidance already requires detailed information across product design, manufacturing, nonclinical safety, and clinical trial design, and the 2026 NGS draft guidance adds specific expectations around off-target editing and genome integrity analysis. Long-term follow-up obligations further extend the burden because permanent or long-acting gene therapies may require multi-year monitoring for delayed adverse events. That means Mammoth cannot win simply by showing compelling preclinical efficacy; it also has to present a sophisticated, regulator-ready safety package.


    The IP side is similarly non-binary. The March 2026 PTAB ruling reaffirmed Broad''s priority for CRISPR-Cas9 in eukaryotic cells, while UC Berkeley continues to hold a large broader patent estate and related ToolGen and Sigma disputes remain unresolved. Mammoth does have its own license chain and an active internal portfolio around CasPhi, APOC3, and other editing systems, but that does not erase freedom-to-operate risk. The underwriting takeaway is that Mammoth''s legal moat may be meaningful, yet still requires outside-counsel diligence before it can be treated as de-risked rather than as an ongoing cost and timing variable.'
  claimRefs:
  - CR006
