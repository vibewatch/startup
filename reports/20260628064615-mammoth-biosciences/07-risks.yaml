    - Re-underwrite timing and required cash burn
  - - Unexpected safety signal
    - Nonclinical NGS/off-target or immune data
    - Any finding that materially changes dose or delivery approach
    - Pause valuation step-up until root cause is closed
  - - Partner concentration
    - Regeneron/Vertex/Bayer program attrition
    - Termination, material amendment, or no new targets added
    - Rebase partnership value and require new financing cushion
  - - Capital stress
    - Runway disclosure or layoffs
    - Further broad layoffs without a new financing/partner backstop
    - Treat as thesis-break risk on execution capacity
  - - Diagnostics optionality erosion
    - No new non-COVID regulatory or commercial proof
    - Another 12 months with no new target/channel disclosure
    - Stop assigning meaningful option value to diagnostics
  - - IP / FTO deterioration
    - Patent or license challenge
    - Adverse counsel memo, field restriction, or new litigation
    - Require legal reserve and revised downside case
  notes: Thresholds are monitorable rather than predictive; they are designed to convert abstract risks into events that would change an investor's stance.
