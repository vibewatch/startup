  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment recommendation and conviction
        blocks:
          - type: paragraph
            body: >-
              Mammoth Biosciences earns a Track recommendation rather than Buy because the company-quality story is
              stronger than the price-discovery story. The positive case is real: Mammoth was founded around elite
              CRISPR science, still benefits from Jennifer Doudna's halo, and has won meaningful validation from Vertex,
              Bayer, and Regeneron, whose combined upfront economics total roughly $181 million. That is unusually
              strong external proof for a still-preclinical gene-editing platform. The problem is that valuation support
              lags the narrative. The last disclosed mark is the September 2021 unicorn round, the company has no public
              revenue or burn disclosure, and the Regeneron equity check did not publish a post-money valuation. Public
              CRISPR peers now span $5.40 billion for CRISPR Therapeutics down to $0.43 billion for Editas, showing that
              platform quality alone does not lock in premium pricing. On current evidence, Mammoth should stay on
              watch, not be chased. The call upgrades only if MB-111 reaches IND filing and first-patient dosing,
              partnership cash generation becomes visible against burn, or entry pricing resets to preclinical peer
              levels at or below Prime Medicine or Editas.
            claimRefs:
              - CV001
              - CV007
              - CV009
              - CV013
              - CV027
              - CV030
