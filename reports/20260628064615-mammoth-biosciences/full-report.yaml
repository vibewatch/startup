      - number: '2.4'
        title: Growth drivers, adoption constraints, and structural barriers
        blocks:
          - type: paragraph
            body: >-
              The macro growth case for in vivo genetic medicines is compelling: the FDA approval of exa-cel in December
              2023 validated ex vivo CRISPR gene therapy as a class and demonstrated that regulatory agencies can
              approve complex gene editing therapies within a manageable timeline. Intellia's in vivo LNP-CRISPR
              programs for ATTR (Nex-z/NTLA-2001) have advanced into early-stage clinical trials, validating LNP liver
              delivery for in vivo gene editing. Beam Therapeutics' base editing programs are in Phase 1/2 clinical
              trials for multiple liver diseases including alpha-1 antitrypsin deficiency and GSDIa. These precedents
              collectively de-risk the regulatory and clinical framework for programs like MB-111.

              At the same time, the adoption constraints are structural and not easily overcome by preclinical data
              alone. AAV payload capacity of approximately 4.7 kilobases is the central physical constraint:
              first-generation Cas9 (1,368 amino acids, SpCas9) and Cas12a (>1,200 amino acids) exceed single-AAV
              packaging limits when combined with guide RNAs and regulatory elements. Mammoth's NanoCas (approximately
              one-third the size of Cas9) addresses this constraint in preclinical models, achieving up to 30% editing
              in NHP skeletal muscle via single AAV—but these are preprint-stage results that have not been replicated
              in human trials. The gap between NHP efficacy and human therapeutic thresholds is a material adoption
              constraint.

              Capital intensity is a second major barrier. The development cost of a Phase 1–3 gene therapy program
              typically exceeds several hundred million dollars before approval. Mammoth's partnership model offloads
              most of this risk to pharma partners, but it also means Mammoth captures only a share of the eventual
              economic value via royalties. For wholly-owned programs like MB-111, capital intensity is a direct
              constraint on speed to clinic.

              Regulatory uncertainty for ultracompact nucleases as a new class is a third constraint. NanoCas and CasPhi
              have not been used in any approved human therapeutic, so the regulatory package (safety, off-target, CMC)
              will need to be built from scratch. The genotoxicity, immunogenicity, and long-term persistence of these
              novel nucleases are open diligence questions. Meanwhile, the broader industry context has not been
              uniformly positive: Editas Medicine laid off 65% of its employees in December 2024 after ending its lead
              gene-editing program, illustrating that scientific promise does not guarantee commercial execution. Prime
              Medicine's first-in-class prime editing approach did achieve "effective cure" in two CGD patients as
              reported in December 2025, providing a competitor milestone that validates the broader next-generation
              CRISPR space but also elevates the competitive bar for Mammoth.

              Switching costs in platform selection are high because pharma partners commit manufacturing and clinical
              infrastructure to specific Cas enzyme libraries; this creates durable partnership value but also means
              that new platform entrants face a high bar to displace established relationships.
