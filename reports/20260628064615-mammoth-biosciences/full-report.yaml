  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: CRISPR-native and adjacent entrants
        blocks:
          - type: paragraph
            body: >-
              Mammoth's most conceptually direct competitors are not therapeutic gene-editing companies; they are
              startups trying to deliver molecular answers outside the central lab. Mammoth describes DETECTR as a
              CRISPR-based detection platform that can be adapted to lower-complexity instruments, instrument-free
              formats, and legacy systems, with emphasis on speed, low cost of goods, robustness, and versatility. The
              historical GSK Consumer Healthcare collaboration showed what that ambition looked like in practice: a
              handheld, fully disposable SARS-CoV-2 test intended for clinics first and eventually home use.
              Peer-reviewed COVID validation demonstrated that DETECTR could work in a rapid lateral-flow format, but
              Mammoth no longer appears to be pushing a visible standalone diagnostic launch as of the run date after
              successive restructurings prioritized therapeutics over diagnostics.


              Sherlock Biosciences is the closest like-for-like reference point because it pursued the same
              decentralization thesis from the Broad ecosystem, but with Cas13-based SHERLOCK and the synthetic-biology
              INSPECTR workflow. Sherlock raised substantial venture capital and pitched PCR-like accuracy without
              complex instrumentation, then in December 2024 was acquired by OraSure Technologies. OraSure's own filings
              make clear that the strategic value was not merely CRISPR branding; it was Sherlock's disposable molecular
              self-test platform and CT/NG product path. VedaBio and Caspr represent the adjacent entrant set rather
              than direct scale peers. VedaBio is trying to differentiate with amplification-free CRISPR Cascade
              workflows and a 2025 Siemens Healthineers-linked financing event, while Caspr has emphasized ultra-cheap
              CRISPR Cas-12 prototypes. Relative to Mammoth, these entrants compete on workflow simplification and cost
              architecture more than on nuclease ownership.
