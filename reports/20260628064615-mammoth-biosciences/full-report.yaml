      - number: '1.4'
        title: Milestones, Pipeline, and Operational Context
        blocks:
          - type: paragraph
            body: >-
              Mammoth's product and operational milestones span three phases: an initial CRISPR diagnostics phase
              (2018–2022), a dual diagnostics-therapeutics phase (2020–2023), and a therapeutics-first phase
              (2023–present).

              In diagnostics, the company developed the DETECTR platform (using Cas12a) for CRISPR-based molecular
              detection. During COVID-19 it collaborated with UCSF to develop the SARS-CoV-2 RNA DETECTR Assay, which
              received FDA Emergency Use Authorization. Mammoth won approximately $23.1 million in NIH RADx funding in
              July 2020 and signed manufacturing scale-up agreements with MilliporeSigma and Hamilton Company in October
              2020.

              In the science discovery layer, Mammoth researchers published key papers establishing its portfolio of
              ultracompact Cas proteins: the Cas14 paper (Science, November 2018, Harrington et al.) and the CasΦ paper
              (Science, July 2020, Pausch et al.). Both systems were shown to have therapeutic genome-editing potential
              in in vivo settings and form the core of Mammoth's therapeutic IP.

              On the therapeutics pipeline, in 2025 Mammoth nominated MB-111 as its first clinical development
              candidate—a potential one-time treatment for patients with high-triglyceride diseases including familial
              chylomicronemia syndrome and severe hypertriglyceridemia, using Mammoth's ultracompact CRISPR in vivo gene
              editing system. No IND filing date for MB-111 has been disclosed as of the run date. NanoCas is mentioned
              in 2025–2026 press materials as the next generation ultracompact platform element.

              On adverse events: in March 2023, Mammoth laid off approximately 35 employees (described as less than 20
              percent of staff at the time), eliminating the bulk of its diagnostics team as part of the therapeutic
              strategic pivot. Approximately 15 people remained in diagnostics R&D after the reduction. In May 2025,
              Mammoth announced a further 24-role reduction, described by CEO Trevor Martin as part of a "strategic
              alignment" to ensure the right organization to drive internal programs to the clinic and support
              partnerships. Martin stated the company was in a "uniquely strong" financial position at the time of the
              2025 cut. Headcount before and after the 2025 reduction is not cleanly disclosed; the 2022 CNBC report
              cited 130 employees growing to 185, but this predates both reductions.

              As of the run date, Mammoth operates from its Brisbane, California headquarters with state-of-the-art
              laboratory facilities accessible by shuttle from Balboa BART and Millbrae BART/Caltrain. The company has
              participated in the J.P. Morgan Healthcare Conference in January 2025 (43rd annual) and January 2026 (44th
              annual), presenting on pipeline, platform, and partnerships.
