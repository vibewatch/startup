      - number: '4.2'
        title: Diagnostics history and revenue-quality limitations
        blocks:
          - type: paragraph
            body: >-
              Diagnostics matters financially because it shows Mammoth could convert science into regulated products and
              externally funded scale-up work, but it also shows why investors should not mistake proof-of-concept for
              durable revenue quality. Mammoth's DETECTR platform was used in multiple COVID-era commercialization
              attempts: the company partnered with GSK's consumer health arm on a handheld point-of-use test, won NIH
              RADx support to scale a high-throughput commercial-lab workflow, signed manufacturing and automation
              agreements with MilliporeSigma and Hamilton, and received an FDA EUA for the SARS-CoV-2 DETECTR Reagent
              Kit for high-complexity CLIA laboratories. The diagnostics page still markets DETECTR on speed, low COGS,
              and adaptability across formats and disease areas.


              Those are meaningful commercialization signals. They show that Mammoth was not operating in pure research
              mode: outside institutions were willing to fund scale-up, partners were willing to manufacture around the
              platform, and regulators were willing to authorize a product. Yet no retained source shows the size of
              diagnostic sales, whether any EUA-era testing volume converted into durable post-pandemic revenue, or how
              much of the COVID work was government contract support versus product gross profit. Even the GSK
              collaboration did not disclose economics. In other words, diagnostics created technical and commercial
              credibility but not a public recurring-revenue history.


              That nuance matters because Mammoth has since de-emphasized diagnostics. The March 2023 reduction removed
              35 employees and most of the diagnostics team, with roughly 15 people reportedly remaining in diagnostics
              R&D. By 2025 the company nominated MB-111 as its first development candidate and official surfaces
              centered the therapeutics platform. Financially, the diagnostics story should therefore be treated as
              historical validation and occasional non-dilutive proof, not as a current core revenue engine.
