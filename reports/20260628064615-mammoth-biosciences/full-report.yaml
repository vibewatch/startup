              Jennifer Doudna''s co-founder status and continued SAB Chair role provides Mammoth with unmatched
              scientific credibility in partnership negotiations—explicitly cited in the Regeneron April 2024 press
              release. The company''s proprietary portfolio of Cas12, Cas13, Cas14, and CasΦ represents the most
