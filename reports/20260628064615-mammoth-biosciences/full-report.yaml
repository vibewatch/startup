  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Founding
        blocks:
          - type: paragraph
            body: >-
              Mammoth Biosciences, Inc. is a private biotechnology company headquartered in Brisbane, California (San
              Francisco Bay Area). Its mission, stated consistently across official materials, is to transform the lives
              of patients by delivering on the promise of CRISPR technologies through the development of long-term
              curative therapies.

              The company was co-founded in 2017 (incorporated) and publicly unveiled in April 2018 by a team anchored
              in the Jennifer Doudna laboratory at the University of California, Berkeley, and at Stanford University.
              The founding team at launch comprised Trevor Martin (CEO, Stanford PhD), Ashley Tehranchi (CTO at launch,
              Stanford PhD), Janice Chen (Berkeley PhD student, now CSO and President of Research), Lucas Harrington
              (Berkeley PhD student, now Chief Scientific Officer), and Jennifer Doudna (Nobel laureate in Chemistry
              2020, CRISPR co-inventor, now SAB Chair and co-founder). The launch press release also listed Ashley
              Tehranchi as a co-founder though she departed her CTO role by May 2019; Doudna is sometimes described as a
              co-inventor-founder rather than an operational founder.

              At inception the company positioned itself as building the world's first CRISPR-based disease detection
              platform, targeting the $45 billion global diagnostics market with credit-card-sized point-of-care strips.
              The proprietary CRISPR protein discovery engine—using metagenomics-based search to identify and
              characterize novel Cas systems (Cas12, Cas13, Cas14, CasΦ)—was the scientific foundation. In 2020 Mammoth
              applied its Cas12-based DETECTR platform to COVID-19 diagnostics, receiving FDA Emergency Use
              Authorization for the SARS-CoV-2 RNA DETECTR Assay.

              Following a strategic review in late 2022 and into 2023, the company formally pivoted its primary focus to
              in vivo gene editing therapeutics, de-emphasizing diagnostics. As of the run date, Mammoth's business
              model is: (1) a wholly-owned internal pipeline of in vivo gene editing therapeutics built on ultracompact
              CRISPR systems, and (2) platform licensing and collaboration partnerships with large pharmaceutical
              partners who use Mammoth's proprietary ultracompact CRISPR enzymes combined with partners' delivery
              technologies. The company's competitive differentiation rests on the small size of its Cas proteins (Cas14
              at ~530 amino acids and CasΦ at ~757 amino acids, both less than half the size of Cas9), which enables
              all-in-one packaging into single AAV capsids for in vivo delivery to extrahepatic tissues.
