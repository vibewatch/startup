      - number: '2.2'
        title: TAM, SAM, and SOM across multiple sizing lenses with preserved contradictions
        blocks:
          - type: paragraph
            body: >-
              Any single-number TAM for Mammoth Biosciences is analytically dishonest because the company sits at the
              intersection of markets with incompatible measurement conventions, differing geographic scope, and
              contested inclusion/exclusion rules. This section preserves the full range of available estimates and
              their contradictions.

              The CRISPR diagnostics market, now irrelevant to Mammoth's forward model, was estimated by The Business
              Research Company at $5.1 billion in 2025 growing to $6.01 billion in 2026 at a 17.8% CAGR, and reaching
              $11.45 billion in 2030. Grand View Research separately covers a CRISPR point-of-care diagnostics
              sub-segment. These estimates do not represent Mammoth's TAM today because Mammoth is no longer
              commercializing diagnostics. They do, however, anchor the historical diagnostics opportunity Mammoth chose
              to exit.

              The in vivo genetic medicines market is not sized by any of the reviewed public sources in a way that is
              directly actionable for Mammoth. The closest proxy is the general gene therapy and gene editing
              therapeutic deal volume: Mammoth's three pharma deals collectively carry over $2 billion in total
              potential milestone payments across an extended deal horizon, which suggests the pharma partners
              themselves view the in vivo editing market as supporting significant value. Royalty rates on marketed
              products from Regeneron range from single to mid-teen percent of net sales, consistent with deal terms
              reported in the Bayer collaboration (low double-digit royalties). If even one program from the Regeneron
              or Vertex collaborations reaches approval, royalty economics on a rare-disease or metabolic therapy priced
              at hundreds of thousands of dollars per patient could create meaningful revenue for Mammoth—but these
              projections depend entirely on unresolved clinical, regulatory, and commercial variables.

              For Mammoth's wholly-owned lead program MB-111 targeting FCS and SHTG, the commercial comparables are
              other rare-disease gene therapies. FCS is a rare genetic disorder with no FDA-approved therapies as of the
              time of this analysis, and the patient population is small (estimated in the low thousands in the United
              States). The orphan-drug pathway and potential premium pricing suggest that even a small patient
              population could support a commercially meaningful therapy—but FCS is narrow, and SHTG patients with
              severely elevated triglycerides are more numerous but also face a tighter competitive set including drugs
              targeting APOC3 via antisense and RNAi approaches. This introduces a conflicting picture: analysts cite
              broad CRISPR market growth, but Mammoth's near-term commercial path runs through a rare-disease indication
              where the addressable population is measured in thousands, not millions.
