  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Mammoth product stack layers a shared nuclease discovery and engineering core across two distinct product tracks:
      a CasPhi LNP liver track (MB-111 and future liver programs) and a NanoCas single-AAV extrahepatic track
      (neuromuscular and CNS), with the DETECTR diagnostics platform sitting as a separate partnership-ready layer.
    approximationNotes: >-
      Internal pipeline names, GLP study infrastructure, and CMC manufacturing architecture are not public. This figure
      stays at the product-system layer visible in company publications, website, and press materials.
    data:
      layers:
        - label: Nuclease discovery and engineering engine
          detail: >-
            Metagenomic databases with exclusive sample data, proprietary AI search, and high-throughput wetlab
            screening produce novel Cas proteins for both therapeutic and diagnostic use.
          items:
            - Metagenomic database (exclusive sample data included)
            - Proprietary AI CRISPR-search algorithms
            - High-throughput wetlab screening and characterization
            - Protein engineering optimization pipeline
        - label: Ultracompact nuclease portfolio
          detail: Exclusively licensed and internally engineered compact Cas proteins forming the proprietary toolkit.
          items:
            - Cas14 (400-700 aa; ssDNA; from archaea; licensed 2019)
            - CasPhi (70 kDa; half of Cas9; from huge phages; licensed 2020)
            - NanoCas (one-third of Cas9; extrahepatic AAV-compatible; engineered 2025)
            - Cas12 and Cas13 (DETECTR diagnostics)
        - label: Editing modality layer
          detail: Ultracompact scaffolds enable multiple editing approaches beyond double-strand breaks.
          items:
            - Nuclease (double-strand break; gene knockout)
            - Base editing (A-to-G or C-to-T single-letter changes)
            - Reverse transcriptase editing (RNA-encoded insertions, deletions, substitutions)
            - Epigenetic editing (gene silencing without sequence change)
        - label: Delivery architecture
          detail: Two delivery tracks enable different tissue targets and different therapeutic mechanisms.
          items:
            - LNP (lipid nanoparticle) for liver delivery (CasPhi; MB-111)
            - Single AAV for extrahepatic delivery (NanoCas; muscle, CNS)
            - Multiple other delivery modalities compatible with ultracompact size
        - label: Product pipeline and platform outputs
          detail: The nuclease and delivery layers produce the named commercial and platform assets.
          items:
            - MB-111 (CasPhi+LNP; APOC3; FCS/sHTG; IND-enabling)
            - Undisclosed liver programs (LNP; multiple editing techniques)
            - NanoCas neuromuscular/CNS programs (single AAV; partnered)
            - DETECTR diagnostics platform (Cas12/13/14; collateral cleavage; partnership-ready)
    claimRefs:
      - CE001
      - CE009
      - CE010
      - CE011
      - CE012
      - CE021
      - CE022
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: >-
      Observed treatment workflow for an FCS or sHTG patient with MB-111, from diagnosis through single-course IV dosing
      to durable outcome, contrasted with the current standard of care which lacks any approved therapy for FCS.
    approximationNotes: >-
      This flow reflects the mechanistic description in company materials and animal model evidence. No human clinical
      workflow exists yet; the flow represents the intended first-in-human pathway.
    data:
      nodes:
        - id: n1
          label: Patient diagnosis
          detail: >-
            FCS or sHTG patient identified by plasma triglyceride level above 1000 mg/dL and genetic or clinical
            evaluation.
        - id: n2
          label: Current standard of care
          detail: >-
            Strict low-fat diet, fibrates, omega-3 supplementation; no approved therapy for FCS; frequent pancreatitis
            hospitalizations continue.
        - id: n3
          label: MB-111 eligibility assessment
          detail: >-
            Patient evaluated for in vivo CRISPR therapy eligibility including liver function, immune status, and
            triglyceride severity.
        - id: n4
          label: Single IV dose of MB-111
          detail: CasPhi-LNP formulation administered intravenously; CRISPR complex travels to liver hepatocytes.
        - id: n5
          label: APOC3 gene knockout in liver
          detail: >-
            CasPhi permanently disrupts APOC3 gene expression; apoC-III protein production stops or is substantially
            reduced.
        - id: n6
          label: Sustained triglyceride reduction
          detail: Plasma triglycerides decrease durably; acute pancreatitis episodes expected to decrease substantially.
        - id: n7
          label: Evidence gap
          detail: >-
            No human data exists; NHP and mouse model data support the mechanism but clinical translation remains
            unproven.
      edges:
