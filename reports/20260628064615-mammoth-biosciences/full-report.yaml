    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      The scenario range places Mammoth's historical unicorn mark near the top of the base case rather than at the
      center of the evidence set.
    data:
      items:
        - label: Bear
          low: 0.4
          value: 0.65
          high: 0.8
          unit: $B
          claimRef: CV021
        - label: Base
          low: 0.8
          value: 1.15
          high: 1.5
          unit: $B
          claimRef: CV020
        - label: Bull
          low: 2
          value: 3
          high: 4
          unit: $B
          claimRef: CV019
    approximationNotes: >-
      These ranges are underwriting scenarios derived from stage, disclosure quality, and public comparable compression
      rather than from a management forecast.
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV027
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: Mammoth scores best on strategic validation and worst on visibility into current economics and price discovery.
    data:
      items:
        - label: Scientific pedigree
          value: 8/10
          detail: Founding narrative and CRISPR credibility remain unusually strong for a private platform biotech.
          tone: positive
        - label: Partner validation
          value: 9/10
          detail: Three major pharma counterparties have already committed meaningful economics.
          tone: positive
        - label: Clinical maturity
          value: 3/10
          detail: MB-111 is still the first internal clinical candidate and Mammoth remains preclinical.
          tone: warning
        - label: Financial disclosure
          value: 2/10
          detail: No public revenue, margin, burn, or cash disclosures are retained in this chapter.
          tone: negative
        - label: Valuation visibility
          value: 3/10
          detail: The last hard valuation mark is from 2021 and Regeneron did not publish a new post-money.
          tone: negative
        - label: Downside asymmetry
          value: 4/10
          detail: A financing reset or partner slowdown could compress value quickly.
          tone: warning
        - label: Exit optionality
          value: 7/10
          detail: Existing collaborators create a credible strategic-acquirer set if the clinic is reached.
          tone: positive
        - label: Watchlist priority
          value: 8/10
          detail: Mammoth merits active monitoring because a small set of milestones could move the call fast.
          tone: positive
    approximationNotes: null
    claimRefs:
      - CV007
      - CV017
      - CV018
      - CV025
      - CV030
      - CV032
      - CV033
