      - number: '8.2'
        title: Valuation context and private-market opacity
        blocks:
          - type: paragraph
            body: >-
              Mammoth's valuation context is defined by one old price signal and several newer but incomplete strategic
              signals. In September 2021, Mammoth disclosed a $150 million Series D and retroactively disclosed a $45
              million Series C, with coverage from MedCity News and Forbes framing the company as a unicorn valued above
              $1 billion. Pre-Regeneron venture financing therefore totaled roughly $255 million. In April 2024,
              Regeneron added a broader $100 million collaboration package that included a $95 million equity
              investment, but the announcement still did not disclose a new valuation mark, liquidation terms, or
              broader cap-table consequences. That matters because the company also does not disclose revenue, operating
              margins, cash, or burn, so investors cannot tell whether partnership cash is financing durable progress or
              merely extending runway. In practical underwriting terms, Mammoth is still a private, underdisclosed
              preclinical platform whose last hard price was set in a far looser biotech financing environment than the
              one public CRISPR names face in 2026.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV027
              - CV037
              - CV038
              - CV040
          - type: table
            tableRef: TV005
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV037
              - CV038
      - number: '8.3'
        title: Comparable analysis and sector derating
        blocks:
          - type: paragraph
            body: >-
              The best public comp set for Mammoth is not a single-point valuation method but a stage-aware range.
              CRISPR Therapeutics still commands about $5.40 billion, helped by approved-product status. Beam trades
              near $3.58 billion and Intellia near $2.33 billion, both supported by public-company disclosure and
              clinical progress that Mammoth does not yet have. Prime Medicine at about $0.61 billion and Editas at
              about $0.43 billion are the more sobering preclinical-or-restructured anchors for what a gene-editing
              platform can be worth when the market discounts execution risk and financing uncertainty. Caribou adds
              another useful read-through: it has Phase 1 CAR-T activity, so even a company with active clinical work is
              not a perfect premium comp for Mammoth's still-preclinical profile. The biggest message from the peer set
              is not that Mammoth must trade at any one number; it is that stage, disclosure quality, and market regime
              now matter far more than category membership. Intellia's fall from a roughly $8.79 billion peak to about
              $2.33 billion reinforces how much 2021-era CRISPR enthusiasm has compressed.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
