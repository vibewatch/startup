          - type: callout
            title: Ultracompact CRISPR Enables Extrahepatic In Vivo Delivery—Structural Advantage Over Cas9
            body: >-
              Cas14 at ~530 amino acids and CasΦ at ~757 amino acids are each less than half the size of Cas9 (~1,368
              amino acids). This compact size enables packaging alongside delivery vectors and guide RNA into a single
              AAV capsid, addressing the dominant bottleneck in in vivo gene editing—delivery beyond the liver. No other
              company has publicly disclosed a CRISPR editing platform with equivalent AAV co-packaging capability at
              scale. Regeneron''s decision to build its AAV antibody-targeting platform around Mammoth''s enzymes
              validates this structural advantage.
            calloutType: strength
            claimRefs:
