    Mammoth Biosciences is a private Brisbane, California-based CRISPR company building ultracompact gene-editing
    systems and selective diagnostics assets. It first earned visibility through DETECTR diagnostics and then pivoted
    toward in vivo therapeutics, where its small Cas proteins are intended to unlock delivery to tissues that are
    difficult for legacy editors.
