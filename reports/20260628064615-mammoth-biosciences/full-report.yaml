  - id: TV006
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission
      - Action
    rows:
      - - Clinical slip
        - MB-111 misses the next communicated IND or first-patient milestone
        - Delays the only visible path from platform promise to human proof.
        - Cut the bull case and re-anchor near the bear/base boundary.
      - - Financing reset
        - New primary round prices below the low end of the base case without stronger disclosure
        - Confirms that private buyers are discounting the platform harder than current narrative implies.
        - Rebuild valuation from the new terms and likely downgrade posture.
      - - Partner stagnation
        - No visible milestone progression, scope expansion, or new target work from Regeneron, Vertex, or Bayer
        - Compresses the strategic premium supporting value above lower public peers.
        - Reduce conviction and treat partnership value as option-like rather than durable.
      - - Partner renegotiation
        - Collaboration scope narrows materially or economics are amended downward
        - Signals weaker platform pull-through and lower exit optionality.
        - Re-rate the company toward the low end of the range.
      - - Financial opacity persists
        - Management refuses to disclose cash, burn, runway, or preference stack during financing diligence
        - Raises the odds that headline valuation overstates economic value to new money.
        - Suspend diligence until financing transparency improves.
      - - Diagnostics fallback returns
        - Management shifts emphasis back to diagnostics without showing recurring commercial traction
        - Moves the story toward a lower-value fallback thesis rather than a therapeutics premium thesis.
        - Apply a sharper discount and revisit downside comps.
    notes: >-
      Triggers are monitorable events rather than generic risks so an investment committee can decide early whether the
      valuation thesis is breaking.
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV041
      - CV042
  - id: TV007
