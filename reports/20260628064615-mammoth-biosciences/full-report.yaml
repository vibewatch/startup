    type: flow
    layout: standard
    summary: >-
      Flow diagram showing how Mammoth Biosciences' CRISPR protein discovery platform, ultracompact Cas systems,
      delivery partnerships, and internal pipeline connect to its business model and mission.
    data:
      nodes:
        - id: discovery
          label: CRISPR Protein Discovery Engine
          detail: >-
            Metagenomics-based platform identifies novel Cas proteins; portfolio includes Cas12, Cas13, Cas14, CasΦ;
            exclusively licensed from UC Berkeley
        - id: platform
          label: Ultracompact CRISPR Systems
          detail: >-
            Cas14 (~530 aa) and CasΦ (~757 aa) — less than half the size of Cas9; enables all-in-one AAV packaging for
            in vivo delivery to extrahepatic tissues
        - id: delivery
          label: Delivery Partnerships
          detail: >-
            Regeneron AAV + antibody targeting (April 2024); Vertex Affinia AAV (Oct 2021); Bayer (Jan 2022); Mammoth
            ultracompact systems fit within single AAV capsid
        - id: pipeline
          label: Internal Pipeline
          detail: >-
            MB-111 (high-triglyceride; familial chylomicronemia syndrome); additional undisclosed in vivo programs;
            wholly-owned therapeutics
        - id: partners
          label: Partner Programs
          detail: >-
            Regeneron collaboration (multiple tissues; ~$370M per target milestones); Vertex (two indications; up to
            $650M milestones); Bayer (four areas; up to $1B+ milestones)
        - id: mission
          label: Mission
          detail: >-
            Develop long-term curative therapies for patients with life-threatening and debilitating diseases; deliver
            on the full promise of CRISPR
      edges:
        - from: discovery
          to: platform
          label: Identifies and characterizes
        - from: platform
          to: delivery
          label: Packaged into partner delivery systems
        - from: platform
          to: pipeline
          label: Drives wholly-owned therapeutics
        - from: delivery
          to: partners
          label: Enables partner collaboration programs
        - from: pipeline
          to: mission
          label: Internal programs toward
        - from: partners
          to: mission
          label: Partner programs toward
