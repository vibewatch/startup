  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core Nuclease Portfolio and Protein Discovery Engine
        blocks:
          - type: paragraph
            body: >-
              The core of Mammoth Biosciences is a metagenomics-driven nuclease discovery engine that has produced three
              ultracompact CRISPR proteins—Cas14, CasPhi, and NanoCas—each significantly smaller than Cas9 in ways that
              matter for in vivo therapeutic delivery. Cas14 was first described in Science in 2018 as a family of
              RNA-guided nucleases from uncultivated archaea, ranging from 400 to 700 amino acids. Unlike Cas9 or
              Cas12a, Cas14 operates on single-stranded DNA without restrictive PAM requirements and can trigger
              collateral cleavage on non-target ssDNA—an activity that underpins DETECTR diagnostics and enables
              high-fidelity SNP genotyping. Mammoth exclusively licensed Cas14 from UC Berkeley for all fields in March
              2019, combining this protein with existing Cas12 and Cas13 rights to complete its early diagnostic
              nuclease toolkit. CasPhi, published in Science in 2020, was identified in the genomes of huge
              bacteriophages. At approximately 70 kDa—about half the molecular weight of Cas9—CasPhi uses a single
              active site for both guide RNA processing and crRNA-guided DNA cutting, and is active in human and plant
              cells with expanded target recognition relative to other CRISPR proteins. Mammoth exclusively licensed
              CasPhi from UC Berkeley for all fields in August 2020. NanoCas is the most recent and therapeutically
              significant addition, described in a bioRxiv preprint in January 2025. It is approximately one-third the
              size of Cas9, compact enough to fit inside a single adeno-associated viral vector alongside regulatory
              elements, guide RNA, and additional editing machinery. Discovering NanoCas required screening 176
              ultracompact CRISPR systems found in Mammoth metagenomic data, followed by protein engineering to optimize
              editing efficiency. All three nucleases share shorter or alternative PAM requirements that expand the set
              of targetable genomic sequences beyond what Cas9 allows. The protein discovery engine uses one of the
              largest metagenomic databases, including exclusive sample data, paired with proprietary AI algorithms and
              high-throughput wetlab screening to identify and validate novel CRISPR architectures. This creates a
              compounding advantage: as the database grows and engineering methods improve, Mammoth can add new nuclease
              families without depending on external technology transfer.
