  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included and excluded spend, adjacencies, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Mammoth Biosciences sits at the junction of three concentric markets that must be analytically separated
              to avoid false precision. The broadest circle is the CRISPR gene-editing market, which encompasses
              research tools (guide RNAs, Cas proteins, vectors), agricultural genomics, industrial biotech, and
              therapeutic genome editing. Analyst reports from The Business Research Company estimate this aggregate
              category at multi-billion-dollar scale globally, with the CRISPR-based diagnostics sub-segment alone
              valued at approximately $6.01 billion in 2026 and projected to reach $11.45 billion in 2030 at a 17.5%
              CAGR. These headline figures are useful as orientation but misleading as a proxy for Mammoth's reachable
              market: Mammoth is not currently selling research kits, guide RNAs, or agricultural genomics tools.

              The narrower second circle—and the one that is relevant to Mammoth's current strategy—is the in vivo
              genetic medicines market, defined as therapeutic programs that use gene editing to durably alter a
              patient's genome inside the body. This market is accessed by Mammoth almost entirely through
              milestone-bearing and royalty-bearing platform licensing to large pharma partners (Regeneron, Vertex,
              Bayer) rather than through direct product revenue. The economics are deal-by-deal: Regeneron agreed to pay
              $100 million upfront plus up to $370 million per target in milestones; Vertex paid $41 million upfront and
              up to $650 million in future milestones; Bayer paid $40 million and could pay milestones exceeding $1
              billion. The reachable market for a platform company in this position is therefore not the theoretical
              total of all gene editing therapeutic spend—it is the negotiable economic value of deals Mammoth can sign
              and the royalty-bearing programs its partners can advance through approval.

              The third and smallest circle is the historical CRISPR diagnostics opportunity that Mammoth accessed via
              the DETECTR platform. This market includes clinical infectious disease testing, point-of-care molecular
              diagnostics, and government-funded pandemic testing. Mammoth had a COVID-19 EUA on the DETECTR platform
              through UCSF but revoked it voluntarily in 2023, and simultaneously laid off 35 diagnostics staff and
              pivoted to therapeutics. The diagnostics market thus represents excluded spend for forward-looking
              analysis: Mammoth is no longer pursuing commercial diagnostics and the CRISPR diagnostics market figures
              reported by analysts do not apply to Mammoth's current business model.

              Status-quo substitutes for Mammoth's in vivo platform licensing are other CRISPR Cas enzymes (SpCas9 from
              the Broad Institute ecosystem licensed to Editas, SaCas9, and AsCas12a), as well as alternative editing
              modalities (Beam Therapeutics base editing, Prime Medicine prime editing, and Intellia's LNP-delivered
              NTLA/Nex-z). For the diagnostics market Mammoth has now exited, substitutes include PCR (Roche, Thermo
              Fisher, bioMérieux/BIOFIRE), isothermal amplification platforms, and antigen tests. None of these
              diagnostics substitutes are relevant to Mammoth's forward strategy.
