      - number: '5.2'
        title: Lead Therapeutic Pipeline, MB-111, and Delivery Architecture
        blocks:
          - type: paragraph
            body: >-
              Mammoth lead wholly-owned program, MB-111, is the first nominated clinical development candidate and
              addresses APOC3, a key regulator of triglyceride metabolism in the liver. The target patient population
              includes individuals with familial chylomicronemia syndrome (FCS) and severe hypertriglyceridemia (sHTG),
              characterized by plasma triglyceride levels exceeding 1000 mg/dL that cause recurrent acute pancreatitis
              and elevated cardiovascular risk. FCS has no FDA-approved therapy as of the run date. MB-111 uses CasPhi
              encapsulated in lipid nanoparticles (LNP) for intravenous delivery to the liver, permanently disrupting
              APOC3 gene expression to reduce apolipoprotein C-III (apoC-III) production and lower plasma triglycerides.
              CasPhi compact size—less than half that of Cas9—enables efficient mRNA packaging in LNP formulations
              consistent with established RNA therapeutic delivery approaches. The program was nominated as a clinical
              development candidate in 2024 with IND-enabling studies targeted for initiation that year and a clinic
              goal stated as 2026. ESGCT 2025 oral data (October 8, Seville) showed saturating liver editing and
              sustained apoC-III reductions in NHPs, substantial reductions in apoC-III and serum triglycerides in a
              humanized transgenic mouse model of hypertriglyceridemia, and acceptable tolerability with only transient
              liver function test elevations at higher doses. Beyond MB-111, the disclosed pipeline includes undisclosed
              liver programs using multiple editing techniques and neuromuscular and CNS programs, both internal and
              partnered. For extrahepatic reach, NanoCas is the platform vehicle: it demonstrated more than 30 percent
              in vivo editing efficiency in skeletal muscle of cynomolgus macaques via single systemic AAV delivery, 10
              to 40 percent dystrophin gene editing across multiple muscle tissues in a humanized DMD mouse model, and
              approximately 60 percent PCSK9 editing in mouse liver—matching SaCas9 at one-third the size. NanoCas
              single-AAV architecture also accommodates base editing, reverse transcriptase editing, and epigenetic
              editing in extrahepatic tissues. The delivery model is therefore two-track: LNP for CasPhi-based liver
              programs such as MB-111, and single-AAV NanoCas for extrahepatic indications. Partnerships with Regeneron
              (100 million USD upfront plus equity, up to 370 million USD per target in milestones) and Vertex (40
              million USD upfront, up to 650 million USD in potential future payments, two in vivo indications) validate
              the platform commercially and add complementary AAV delivery capabilities.
