      - number: '3.2'
        title: Incumbent rapid molecular platforms and channel power
        blocks:
          - type: paragraph
            body: >-
              The harder commercial problem for DETECTR is not proving that CRISPR can detect nucleic acids; it is
              displacing instrument fleets and assay menus that buyers already trust. Cepheid's GeneXpert family
              automates extraction, amplification, and detection inside a closed disposable cartridge, spans systems
              from small CLIA-waived Xpress instruments to large module counts, and supports random-access testing with
              minimal hands-on time. Roche's cobas liat system pushes the same sample-to-answer proposition with
              gold-standard PCR, twenty-minute-or-less turnaround, and a steadily expanding CLIA-waived menu that now
              includes STI multiplex panels. Abbott's ID NOW occupies a slightly different niche—rapid isothermal NAAT
              rather than PCR—but it competes for the same decentralized respiratory workflow by promising molecular
              results faster than PCR on a CLIA-waived platform.


              bioMérieux's BioFire and QIAGEN's QIAstat/NeuMoDx franchise are less portable than DETECTR's original
              handheld ambition, but they have a different advantage: menu breadth and institutional embedding.
              BioFire's syndromic panels can cover 22 respiratory targets, 43 bloodstream targets, or 39 joint-infection
              targets on the TORCH platform with roughly two minutes of hands-on work and throughput measured in
              hundreds of tests per day. QIAstat-Dx offers one-sample, one-cartridge multiplex panels with less than one
              minute hands-on time and about one-hour turnaround, while QIAGEN's broader diagnostics footprint extends
              beyond syndromic testing into standardized infectious-disease workflows. These incumbents therefore
              compete with Mammoth on operational fit, procurement familiarity, and post-sale support—not only on
              analytical performance.
