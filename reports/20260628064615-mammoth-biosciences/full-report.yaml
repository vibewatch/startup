          value: 1
          unit: $B+
        - label: Prime Medicine
          value: 0.61
          unit: $B
        - label: Editas Medicine
          value: 0.43
          unit: $B
    approximationNotes: >-
      Bars mix June 2026 public-market capitalizations with Mammoth's last confirmed private unicorn mark to illustrate
