      - number: '2.5'
        title: Preserved diligence gaps and unresolved estimates
        blocks:
          - type: paragraph
            body: >-
              Several sizing and adoption questions remain materially open and cannot be resolved with publicly
              available evidence as of the run date.

              First, no public source provides a Mammoth-specific SAM or SOM for the in vivo genetic medicines market.
              The deal economics (total potential milestones of ~$2+ billion across three partnerships) are the closest
              available proxy, but they represent ceiling rather than expected values and depend on multiple unresolved
              clinical and regulatory contingencies. Any single-number SAM derived from analyst market-report estimates
              would require assumptions about Mammoth's deal pipeline and royalty rates that are proprietary.

              Second, the commercial potential of Mammoth's extrahepatic programs (NanoCas for muscle, CNS, and beyond)
              cannot be sized without knowing which specific indications Regeneron has selected under the collaboration.
              The Regeneron agreement covers "multiple tissues and cell types" but does not disclose targets. Until
              targets are disclosed, the SAM for extrahepatic programs is unknowable from public sources.

              Third, the CRISPR diagnostics market estimates cited in analyst reports are not directly contradicted by
              Mammoth's pivot, but they are not additive to Mammoth's forward market opportunity. The tension between a
              large reported CRISPR diagnostics TAM and Mammoth's voluntary exit from that market is a real analytical
              contradiction: Mammoth's leadership concluded the opportunity did not justify the capital required to
              compete commercially, even as market reports forecast 17.5% CAGR for the diagnostics segment. This
              strategic dissonance deserves preservation rather than resolution.

              Fourth, the FCS patient population is small and the SAM for MB-111 in the United States is likely in the
              low thousands of patients at most, though the orphan-drug regulatory and pricing framework can support
              commercially meaningful therapies at that scale. The diligence ask is for Mammoth to disclose patient
              stratification, treatment rate assumptions, and competitive overlap with anti-APOC3 RNAi and antisense
              approaches already in clinical development.
