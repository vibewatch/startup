  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and partnership economics
        blocks:
          - type: paragraph
            body: >-
              Mammoth's forward revenue model is best understood as partnership economics plus long-dated therapeutic
              optionality, not as a scaled diagnostics operating business. Official surfaces and partner announcements
              point to three active monetization channels. First, Mammoth signs platform collaborations with large
              biopharma partners who pay upfront cash and/or equity for access to its ultracompact CRISPR systems.
              Second, those deals include milestone ladders that can become meaningful only if partnered programs
              advance through research, development, regulatory, and commercial gates. Third, successful products can
              generate royalties or, in the Regeneron structure, profit-share economics if Mammoth elects to co-fund
              certain programs. That is economically attractive in headline terms, but it behaves nothing like
              contracted SaaS ARR or like a commercial diagnostics consumables business.


              The public terms are unusually strong for a preclinical platform company. Regeneron agreed in April 2024
              to provide $100 million total upfront consideration including a $95 million equity investment, up to $370
              million per target in milestones, single-digit to mid-teen royalties, and opt-in co-funding/profit-share
              rights for Mammoth on a majority of programs. Vertex agreed in 2021 to pay $41 million upfront, including
              a convertible note investment, plus up to $650 million in future milestone payments across two indications
              and tiered royalties. Bayer agreed in 2022 to pay $40 million upfront plus research funding,
              low-double-digit royalties, and milestone economics that can exceed $1 billion across five preselected in
              vivo indications. Those terms show strong buyer willingness to pay for the platform.


              But headline deal values are not the same as current revenue quality. The public record does not separate
              equity proceeds from collaboration revenue, does not disclose how much of the non-equity upfronts have
              been recognized, and does not show milestone timing or probability. The result is that Mammoth has clear
              monetization pathways and strong strategic validation, yet still lacks the accounting detail needed to
              turn deal headlines into a reliable revenue base.
