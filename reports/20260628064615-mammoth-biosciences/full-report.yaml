              - CO008
              - CO028
          - type: callout
            title: Founder-CEO Key-Person Concentration and Undisclosed Headcount Create Operational Uncertainty
            body: >-
              Trevor Martin has served as the sole CEO since founding in 2018, with no publicly named successor or
              operational co-leader. Two workforce reductions—approximately 35 staff in March 2023 and 24 staff in May
              2025—have occurred without disclosure of the resulting headcount, making it impossible to assess the
              company''s execution capacity for its clinical development candidate (MB-111) and three partner programs
              simultaneously. The 2025 cut was positioned as strategic alignment rather than financial distress, but the
              combination of concentration risk and opaque organizational depth warrants diligence.
