            claimRefs:
              - CV008
              - CV017
              - CV022
              - CV023
              - CV028
              - CV043
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Nobel-linked science and three-pharma validation are real strengths
            body: >-
              Mammoth has stronger strategic proof than most preclinical biotech startups because Vertex, Bayer, and
              Regeneron have each paid real money to access the platform. That partner set, combined with the company's
              CRISPR pedigree, supports a meaningful premium versus generic early-stage platform stories.
            calloutType: strength
            claimRefs:
              - CV007
              - CV025
              - CV038
          - type: callout
            title: Underdisclosed financials meet a compressed CRISPR tape
            body: >-
              The main problem is not scientific relevance but price visibility. Mammoth still does not disclose
              revenue, burn, cash, or a fresh valuation mark, while public CRISPR names have already shown how quickly
              premium platform valuations can compress when proof or financing confidence weakens.
            calloutType: risk
            claimRefs:
              - CV008
              - CV024
              - CV027
              - CV032
              - CV033
          - type: callout
            title: Track — three conditions would upgrade the call
            body: >-
              The recommendation improves only when one of three things happens: MB-111 reaches IND filing and
              first-patient dosing, partnership economics begin to show visible cash generation against burn, or
              investors can enter at or below compressed preclinical peer levels rather than at an unrefreshed unicorn
              anchor.
            calloutType: recommendation
            claimRefs:
              - CV034
              - CV035
              - CV036
          - type: callout
            title: Peer derating matters more than category labels
            body: >-
              Intellia's decline from a roughly $8.79 billion peak to about $2.33 billion, together with Editas's much
              lower current market capitalization and restructuring history, shows why Mammoth cannot be valued off the
              word CRISPR alone. Stage, disclosure quality, and financing regime now dominate category enthusiasm.
            calloutType: insight
            claimRefs:
              - CV013
              - CV024
              - CV040
