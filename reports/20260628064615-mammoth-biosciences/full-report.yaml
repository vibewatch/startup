    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Cash / runway
        - Current cash balance, monthly burn, and downside runway after layoffs and partnership receipts
        - Determines whether Mammoth can wait for clinical inflection or must raise defensively.
        - Request latest board materials, balance sheet, and 24-month cash forecast.
      - - Cap table / preferences
        - Fully diluted cap table, liquidation stack, partner side letters, and any note conversion terms
        - Headline valuation can overstate common-equity value if preference overhang is large.
        - Request financing documents and counsel-prepared cap-table memo.
      - - Collaboration accounting
        - Recognized revenue, deferred revenue, and cash actually collected from Vertex, Bayer, and Regeneron
        - Separates strategic headlines from operating traction.
        - Request ASC 606 schedules and partner contract summaries.
      - - MB-111 IND path
        - Remaining CMC, tox, and regulatory work before IND filing plus planned first-patient window
        - Clinical entry is the biggest swing factor in the valuation range.
        - Request development timeline with gating assumptions and budget.
      - - Partner program status
        - Target-level progress, milestone calendars, and internal resource allocation by collaboration
        - Clarifies whether milestone cash is near-term or still distant optionality.
        - Request program governance materials and latest joint-steering updates.
      - - Post-restructuring operating capacity
