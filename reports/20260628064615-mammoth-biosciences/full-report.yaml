      - number: '3.4'
        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The adverse case is straightforward. Sherlock's sale to OraSure shows that CRISPR diagnostics can be
              strategically attractive, but also suggests that a standalone platform may struggle to scale without a
              larger owner that already has manufacturing, regulatory, reimbursement, and distribution infrastructure.
              Mammoth's own diagnostics retrenchment points in the same direction. The 2023 reduction of roughly 35
              employees, mostly from diagnostics, and the 2025 restructuring that cut another 24 roles did not
              invalidate DETECTR scientifically, but they did weaken Mammoth's claim to be the operating leader in
              CRISPR diagnostics. Historical momentum existed—RADx support, a peer-reviewed COVID assay, and a GSK
              consumer-healthcare collaboration—but it has not translated into a visible current product launch.


              Pricing evidence is another warning sign. Public sources reliably describe packaging models and some
              prototype economics, but realized instrument pricing, cartridge pricing, and hospital contract terms
              remain opaque across the field. That opacity favors incumbents with entrenched sales motions. Meanwhile,
              the adjacent entrant threat is evolving: VedaBio pitches amplification-free speed and multiplexing, Caspr
              emphasizes ultra-low-cost portable testing, and future entrants can borrow the decentralization playbook
              without reproducing Mammoth's exact Cas14/CasPhi position. Netting it all out, Mammoth's moat in
              diagnostics is real but narrow: strong enzyme/IP differentiation, weak active commercialization, and clear
              dependence on partners to re-enter the market at scale.
