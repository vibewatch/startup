      - number: '3.3'
        title: Differentiation, IP relevance, and switching costs
        blocks:
          - type: paragraph
            body: >-
              Technically, Mammoth still has a real story. Independent reviews distinguish SHERLOCK and DETECTR at the
              mechanism level—Cas13 for RNA-oriented SHERLOCK workflows and Cas12 for DETECTR—and those same reviews
              argue that CRISPR diagnostics can outperform older methods on portability and equipment burden even when
              incumbents remain stronger on clinical deployment. Mammoth's deeper moat comes from assets that are not
              fully reflected in today's diagnostics revenue picture: the Cas14 paper established an exceptionally
              compact ssDNA-cleaving nuclease family that supports Cas14-DETECTR SNP genotyping, and the CasPhi paper
              showed that Mammoth-linked ultracompact systems can be useful for DNA detection while also providing
              delivery advantages in editing. In other words, Mammoth owns more than a single COVID-era assay concept;
              it owns a broader enzyme and collateral-cleavage story.


              That said, buyers do not switch platforms because a nuclease is elegant. They switch when workflow,
              reimbursement, turnaround, installed-base economics, and menu fit improve enough to justify retraining and
              procurement change. Incumbent switching costs come from closed-cartridge instruments, LIS integration,
              validated specimen workflows, and large assay portfolios already sitting inside hospital, urgent-care, and
              retail-care pathways. Mammoth lacks those assets today. The likely winning path for DETECTR is therefore
              partner-led: licensing or OEM placement into existing commercial channels, not a direct head-on rebuild of
              Cepheid, Roche, BioFire, or QIAGEN distribution. Cas14 and CasPhi strengthen negotiating leverage and
              long-term optionality, but they do not erase the current go-to-market deficit.
