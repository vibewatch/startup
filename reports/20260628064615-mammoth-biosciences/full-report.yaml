      - number: '2.3'
        title: Buyer, user, and payer segmentation with budget ownership and adoption path
        blocks:
          - type: paragraph
            body: >-
              Mammoth's buyer landscape has three structurally distinct segments that operate on completely different
              timelines, budget cycles, and adoption triggers. Conflating them into a single buyer persona would
              misrepresent the go-to-market reality.

              The first and most immediately relevant segment consists of large pharmaceutical companies acting as
              platform licensees and co-developers. Regeneron, Vertex, and Bayer each made substantial upfront payments
              to access Mammoth's ultracompact CRISPR technology for specific in vivo programs. The budget owner is the
              business development and R&D leadership of these firms; the user is their gene therapy team; the payer is
              corporate capital rather than any insurance or government reimbursement system. Adoption triggers include:
              a demonstrated delivery advantage (payload size smaller than Cas9 enabling single-AAV delivery), a
              specific target tissue beyond the liver that is otherwise inaccessible, and platform differentiation from
              incumbents. This buyer segment is where Mammoth's near-term revenue comes from, and it is driven by deal
              economics, IP terms, and preclinical data quality.

              The second segment, relevant for Mammoth's wholly-owned MB-111 program if it advances to
              commercialization, consists of rare-disease prescribers and payors. Physicians (metabolic disease
              specialists, gastroenterologists, hepatologists) would be the prescribers for an FCS or SHTG therapy;
              patients would be the ultimate users; and a mix of commercial insurers and government programs (Medicaid,
              European national health systems) would be the payers. Adoption triggers in this segment are fundamentally
              different from the pharma-partner segment: they require clinical trial success, regulatory approval,
              favorable ICER and HTA assessments, and physician confidence in a one-time gene-editing modality. The
              budget pathway is specialty pharmacy and rare-disease reimbursement frameworks, not corporate R&D capex.
              This segment is at least several years from engagement given MB-111's IND-enabling stage as of mid-2026.

              The third segment—now largely closed—was clinical systems, diagnostic laboratories, and government buyers
              for CRISPR-based infectious disease testing. During the COVID-19 pandemic, government agencies (NIH RADx
              program awarded Mammoth $23.1 million) and hospital systems were the buyers. The commercial partner in the
              consumer/POC track was GSK Consumer Healthcare. The clinical decision-maker was the lab director or
              hospital C-suite; the payer was either government contract or insurance reimbursement for molecular
              testing. This buyer segment is no longer active for Mammoth, which exited the commercial diagnostics
              market.
