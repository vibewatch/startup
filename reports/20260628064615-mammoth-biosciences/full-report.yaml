  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The recommendation moves from attractive science and partner proof through financial opacity and sector
      compression to a Track conclusion.
    data:
      nodes:
        - id: market
          label: Market
          detail: >-
            CRISPR diagnostics and gene-editing markets remain large and growing, so Mammoth still operates inside a
            real long-duration category.
        - id: technology
          label: Technology
          detail: Ultracompact CRISPR remains a differentiated scientific story, but it still lacks human proof.
        - id: partners
          label: Partners
          detail: Vertex, Bayer, and Regeneron validate platform interest with roughly $181M of upfront economics.
        - id: financials
          label: Financials
          detail: Revenue, cash, burn, and current valuation terms remain undisclosed in public sources.
        - id: risk
          label: Risk
          detail: Mammoth is preclinical and exposed to sector multiple compression plus financing uncertainty.
        - id: valuation
          label: Valuation
          detail: The stale 2021 unicorn mark is no longer a sufficient fair-value anchor in the 2026 CRISPR market.
        - id: recommendation
          label: Recommendation
          detail: Track until clinical entry, visible cash-generation evidence, or lower entry pricing improves the setup.
      edges:
        - from: market
          to: technology
        - from: technology
          to: partners
        - from: partners
          to: financials
        - from: financials
          to: risk
        - from: risk
          to: valuation
        - from: valuation
          to: recommendation
    approximationNotes: null
    claimRefs:
