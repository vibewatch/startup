  topStrengths:
  - Three major biopharma counterparties (Regeneron, Vertex, Bayer) validate platform demand with real upfront economics.
  - Ultracompact Cas systems create a differentiated delivery story versus legacy CRISPR editors.
  - Diagnostics history demonstrates Mammoth can translate platform science into regulated workflows and partnerships.
  topRisks:
  - No human clinical data yet for MB-111 or any other Mammoth therapeutic program.
  - CRISPR IP, regulatory, and off-target safety complexity remain high and can delay entry into the clinic.
  - Public monetization proof is concentrated in a small number of partners and runway disclosure is limited.
  unresolvedGaps:
  - Current cash runway and burn after the 2025 restructuring.
  - Program-specific off-target, immunogenicity, and long-term follow-up package for MB-111.
  - Partner-by-partner recognized revenue and current target counts.
  - Current non-COVID diagnostics roadmap and named active customers.
