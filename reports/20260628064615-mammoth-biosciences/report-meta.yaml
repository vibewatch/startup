companyProfile:
  summary: Mammoth Biosciences is a private Brisbane, California-based CRISPR company building ultracompact gene-editing systems and selective diagnostics assets. It first earned visibility through DETECTR diagnostics and then pivoted toward in vivo therapeutics, where its small Cas proteins are intended to unlock delivery to tissues that are difficult for legacy editors.
  foundedDate: '2017-01-01'
  founders:
  - name: Trevor Martin
    role: Co-founder and CEO
    background: Stanford-trained scientist and company architect who leads strategy and partnerships.
  - name: Janice Chen
    role: Co-founder and scientific leader
    background: CRISPR scientist whose work helped shape Mammoth's diagnostics and editor platform.
  - name: Lucas Harrington
    role: Co-founder
    background: CRISPR researcher tied to Mammoth's ultracompact nuclease platform.
  - name: Jennifer Doudna
    role: Co-founder and scientific advisor
    background: Nobel laureate and CRISPR co-inventor whose work underpins Mammoth's origin story.
  foundingLocation: Brisbane, California, United States
  headquarters: Brisbane, California, United States
  productSummary: Ultracompact CRISPR systems for in vivo gene editing plus DETECTR-branded molecular diagnostics technology.
  customerFocus: Large biopharma partners, public-health / clinical-lab channels, and health-system ecosystem collaborators.
  businessModel: Platform licensing and collaboration economics in therapeutics, with historical diagnostics channel partnerships and regulatory milestones.
