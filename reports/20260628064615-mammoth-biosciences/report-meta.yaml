coverageNotes: >-
  Public evidence is strongest on partnerships, platform differentiation, and historical diagnostics milestones; revenue, runway, and headcount after the 2025 restructuring remain undisclosed. Three data-quality caveats: (1) Founding year — Mammoth was incorporated in 2017 and publicly launched on April 26, 2018; sources vary by which date they cite as "founded". (2) Valuation — the last disclosed mark is the September 2021 unicorn financing round; the April 2024 Regeneron strategic equity investment did not publish a post-money valuation, so any current valuation estimate is speculative. (3) Operating metrics — revenue, ARR, gross margin, burn rate, cash runway, and current headcount are not publicly disclosed; partnership upfront economics ($181M combined from Vertex, Bayer, and Regeneron) are the only available public proxy for financial scale.
