  evidenceGaps:
  - type: missing-source
    severity: material
    topic: clinical-trials
    missingEvidence: A registered IND, IND acknowledgment letter, or ClinicalTrials.gov registration for MB-111 or any other Mammoth therapeutic program.
    whyItMatters: 'The company states a 2026 clinic goal for MB-111, but as of the run date there is no public IND, no ClinicalTrials.gov entry, and no FDA correspondence confirming IND submission. This makes the timeline claim unverifiable from public sources and introduces material execution uncertainty.'
    diligencePath: Monitor ClinicalTrials.gov monthly for MB-111 registration; request IND submission date and pre-IND meeting notes in management meetings; track FDA clinical holds or communications.
    relatedQuestionRefs:
    - QE007
    - QE008
    relatedTableRefs:
    - TE004
    - TE005
  - type: private-evidence-only
    severity: material
    topic: mb111-peer-review
    missingEvidence: A peer-reviewed journal publication of MB-111 NHP APOC3 efficacy and safety data, presenting the full dataset behind the ESGCT 2025 oral presentation.
    whyItMatters: All MB-111 public efficacy data is currently at conference abstract and press release level. No independent peer-reviewed paper has been located. Conference data is not independently reproduced and may represent selected or incomplete results.
    diligencePath: Request the full dataset and any manuscripts in preparation; ask about journal submission status and timeline; obtain GLP study synopses if available under NDA.
    relatedQuestionRefs:
    - QE013
    - QE021
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: quality-system
    missingEvidence: GLP study reports, CMC manufacturing data, quality system documentation, or regulatory agency correspondence for MB-111.
    whyItMatters: Assessing clinical readiness requires knowing whether manufacturing processes are consistent, whether GLP studies are complete, and whether pre-IND FDA feedback has been received. None of this is publicly available, which is standard for pre-IND stage but limits external quality assessment.
    diligencePath: Request GLP study summary reports, CMC file status and key analytical methods, pre-IND meeting minutes or FDA correspondence, and quality management system overview under NDA in management meetings.
    relatedQuestionRefs:
    - QE021
    - QE024
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: nanocas-peer-review
    missingEvidence: A peer-reviewed journal publication of NanoCas in vivo editing data (muscle, liver, NHP) from the January 2025 bioRxiv preprint.
    whyItMatters: The NanoCas bioRxiv preprint provides strong directional signals, but preprint data has not been independently peer-reviewed. The peer-reviewed paper may contain refined data, additional safety signals, or revised efficiency numbers.
    diligencePath: Track the bioRxiv preprint for journal submission and publication; request the submitted manuscript; check ASGCT 2025 abstract for any updated data versus the preprint.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE005
