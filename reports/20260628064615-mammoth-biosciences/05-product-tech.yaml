- id: detectr-diagnostics-and-regulatory-lineage
  title: DETECTR Diagnostics Platform and Regulatory Lineage
  body: 'The DETECTR platform is the foundational demonstration that Mammoth ultracompact CRISPR nucleases can be deployed in regulated diagnostic products. DETECTR uses guide-RNA-programmed CRISPR proteins to search for specific nucleic acid sequences; upon finding the target, the protein activates collateral cleavage of reporter molecules to generate a detectable signal. The platform spans Cas12 for double-stranded DNA, Cas13 for single-stranded RNA, and Cas14 for single-stranded DNA without restrictive PAM—enabling detection of virtually any nucleic acid biomarker. Multiple formats are envisioned: high-complexity laboratory instruments, point-of-care devices, and instrument-free lateral-flow testing, with the goal of bringing CRISPR detection to hospitals, point-of-care settings, and eventually home use. During the COVID-19 pandemic, Mammoth and UCSF co-developed the SARS-CoV-2 RNA DETECTR assay, published in Nature Biotechnology in 2020. That study validated 95 percent positive predictive agreement and 100 percent negative predictive agreement in 78 patients using CRISPR-Cas12a lateral-flow detection of the viral N gene in under 40 minutes, representing a faster alternative to the CDC RT-PCR benchmark. Separately, Mammoth received FDA Emergency Use Authorization for its SARS-CoV-2 DETECTR Reagent Kit in August 2020, authorized for high-complexity CLIA-certified laboratories; UCSF also received a parallel EUA for the RNA DETECTR assay run at their clinical facility. Both authorizations were subsequently revoked when the COVID public health emergency ended. The regulatory history is materially important to frame correctly: the EUA was granted to Mammoth Biosciences as reagent kit manufacturer, confirming that Mammoth navigated an FDA regulatory pathway for a CRISPR-based product. The diagnostic experience also produced the foundational CRISPR collateral cleavage IP estate. As of June 2026, Mammoth promotes DETECTR as a platform available for future diagnostic partnerships but no active commercial diagnostic product or pipeline program is visible in the public record.'
