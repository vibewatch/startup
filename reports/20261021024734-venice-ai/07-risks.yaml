      - ["Owned-infrastructure execution", "Reported plan to purchase GPUs and build data centers", "Medium", "High", "Planned", "Medium-High"]
    notes: "Rows combine observed source signals with qualitative risk judgments; the assigned sources provide no audited incident rate, uptime series, recovery-time metric, or security-control test."
    claimRefs: ["CR001", "CR003", "CR010", "CR014"]
  - id: "TR003"
    title: "Partner and dependency risk register"
    columns:
      - "Dependency"
      - "Counterparty or layer"
      - "Failure scenario"
      - "Concentration evidence"
      - "Severity"
      - "Mitigation"
      - "Residual exposure"
    rows:
      - ["Closed-source model access", "OpenAI and Anthropic", "Policy, price, or access change removes premium capabilities", "Provider shares and contract terms undisclosed", "High", "Contractual continuity and tested open-model fallback", "High"]
      - ["Compute capacity", "Leased GPUs and planned owned infrastructure", "Capacity shortage or build delay impairs service and margins", "Supplier mix and utilization undisclosed", "High", "Multi-supplier capacity, phased ownership, and service-level monitoring", "Medium-High"]
      - ["Token ecosystem", "VVV and DIEM markets", "Liquidity, incentive, or regulatory change reduces adoption", "Only about 8% crypto payment share is reported", "Medium", "Keep fiat pricing independent and cap token-linked economics", "Medium"]
      - ["Lean operating team", "Approximately 45 reported employees", "Key-person loss or control workload outgrows staff", "Role coverage and attrition undisclosed", "Medium", "Succession, control ownership, staffing plan, and key-person retention", "Medium"]
    notes: "Concentration and mitigation maturity remain unverified because contracts, supplier shares, staffing coverage, and token-economy financials were not available in the assigned evidence."
    claimRefs: ["CR005", "CR006", "CR009", "CR014", "CR015"]
