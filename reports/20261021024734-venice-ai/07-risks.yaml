company:
  name: "Venice AI"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    Venice AI's principal residual risks are the absence of public independent assurance
    for its core privacy claim, deliberate minimal filtering, reliance on upstream model
    and compute providers, and thin public evidence for unit economics and customer
    durability. The available evidence supports a high-caution diligence posture, not a
    conclusion that a legal violation, security incident, or liquidity problem has occurred.
sections:
  - id: "risk-prioritization"
    title: "Residual risk prioritization"
    body: >-
      The highest residual exposure is trust assurance: privacy is the central product
      promise, yet the assigned public evidence contains no independent audit of the full
      architecture. That is different from evidence of a breach; it means the control claim
      remains externally unverified. Minimal filtering creates a second high-impact
      exposure because it is an intentional product choice rather than a removable edge
      case. Upstream model access, leased compute, token mechanics, customer support, and
      unaudited operating metrics form the next tier. The heatmap therefore treats impact
      and mitigation maturity as qualitative diligence judgments, not measured incident
      probabilities. Investment should remain conditional on primary control evidence,
      contractual dependency disclosures, and independently reconcilable operating data.
    claimRefs: ["CR003", "CR007", "CR009", "CR010", "CR012", "CR014", "CR016"]
    tableRefs: ["TR002"]
    figureRefs: ["FR001"]
  - id: "regulatory-legal-and-trust"
    title: "Regulatory, legal, and trust exposure"
    body: >-
      Public explainers describe local browser storage, client-side encryption, and
      privacy modes, but one adverse reviewer says no independent third-party audit of the
      full privacy architecture has been published. That gap matters because the product's
      differentiation depends on what Venice and its processors cannot retain or associate
      with a user. The strongest encrypted mode is also reported to disable web search,
      memory, and tool-dependent workflows, creating a security-versus-function trade-off.
      Separately, VVV staking and transferable DIEM credits add legal-classification,
      disclosure, and consumer-comprehension questions that the assigned evidence does not
      resolve. No cited source is a regulator, court, or legal opinion, so the register
      records diligence paths rather than asserting regulatory approval, noncompliance, or
      the absence of proceedings.
    claimRefs: ["CR002", "CR003", "CR004", "CR007", "CR008", "CR009"]
    tableRefs: ["TR001"]
  - id: "dependencies-and-execution"
    title: "Operational dependencies and execution risk"
    body: >-
      Venice's delivery chain spans user-held API credentials, Venice endpoints, leased or
      owned compute, open models, and closed-source providers. Third-party coverage reports
      that some queries are routed to OpenAI and Anthropic, leaving availability and product
      differentiation exposed to external policy or commercial changes. Planned GPU and
      data-center investment may reduce leasing costs and increase control, but it also
      introduces capital deployment, commissioning, utilization, and reliability execution
      risk. A competitor-authored review alleges support, cancellation, overload, and
      empty-response problems; those allegations are directionally relevant but not
      independently verified. The operating scale attributed to a roughly 45-person team is
      also secondary and company-mediated, so staffing resilience and key-person coverage
      require direct confirmation.
    claimRefs: ["CR001", "CR005", "CR006", "CR010", "CR011", "CR014", "CR015"]
    tableRefs: ["TR003"]
  - id: "investment-controls"
    title: "Investment controls and thesis-break triggers"
    body: >-
      Reported profitability and more than $70 million of annualized revenue reduce the
      immediate financing-risk narrative, but they do not substitute for audited revenue,
      gross margin, churn, retention, or compute-cost evidence. The reported metrics should
      therefore be treated as company-originated indicators rather than verified financial
      performance. Before investment, require an independent privacy and security
      assessment, processor and model-provider contracts, moderation and abuse-response
      procedures, token counsel, service-level history, customer-support metrics, and a
      revenue-to-cash reconciliation. Thesis-break triggers are failure to produce those
      materials, a material provider termination, a substantiated privacy-control failure,
      sustained service degradation, or economics that deteriorate after normalizing
      infrastructure and token incentives.
    claimRefs: ["CR003", "CR005", "CR012", "CR013", "CR014", "CR016"]
