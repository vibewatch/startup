company:
  name: "Venice AI"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Venice AI is a privacy-positioned generative-AI platform launched in May 2024 that
    reached more than 3 million active users and reported more than $70 million of
    annualized run-rate revenue before its first external financing. Its July 2026
    $65 million Series A at a $1 billion valuation validates investor interest, while
    private-company governance, audited economics, current headcount, and independent
    privacy assurance remain material diligence gaps.
sections:
  - id: "identity-and-operating-model"
    title: "Identity and operating model"
    body: >-
      Venice AI launched publicly in May 2024 and is led by founder and CEO Erik
      Voorhees. The company aggregates access to more than 200 text, image, audio, and
      video models through a consumer interface and developer API. Its differentiation
      is architectural and philosophical: prompts are encrypted client-side, routed
      through an external proxy, and not retained on Venice's systems, while the
      product deliberately permits broader model behavior than mainstream assistants.
      A secondary company profile identifies Venice.ai, Inc. and Sheridan, Wyoming as
      the headquarters, but no state filing or equivalent primary record was retained,
      so legal identity and location should be confirmed before investment.
    claimRefs: [CO001, CO002, CO004, CO005, CO006]
    tableRefs: [TO001]
  - id: "leadership-and-governance"
    title: "Leadership and governance"
    body: >-
      Voorhees is the only executive consistently named across the stronger retained
      coverage, and his prior ShapeShift and Satoshi Dice experience closely links the
      company's privacy, crypto, and censorship positions to his personal thesis. One
      lower-transparency profile also names Seattle entrepreneur Jesse Proudman as a
      co-founder, but the source set does not establish his current operating role.
      No retained source identifies the board, voting rights, ownership percentages,
      executive bench, or succession plan. That absence makes key-person dependence a
      material underwriting issue rather than evidence that the governance structure
      is founder-only.
    claimRefs: [CO002, CO003, CO012]
    tableRefs: [TO002, TO003]
  - id: "financing-and-scale"
    title: "Financing and scale"
    body: >-
      On July 1, 2026, Venice announced a $65 million Series A at a $1 billion
      valuation, described as its first external fundraise. Dragonfly led the round,
      with Coinbase Ventures and North Island Ventures among the disclosed
      participants. Management told TechCrunch that Venice was profitable and
      generating more than $70 million in annualized run-rate revenue; this is neither
      audited revenue nor verified ARR, and the financing amount is not evidence of
      cash currently available. Operating scale is nevertheless notable: coverage
      reports more than 3 million active users and an average 1.7 million API calls
      per day. Management plans to direct capital toward GPUs and owned data centers
      to reduce leasing dependence and improve gross margins.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012, CO013, CO014]
  - id: "milestones-and-diligence-implications"
    title: "Milestones and diligence implications"
    body: >-
      Venice moved quickly from a May 2024 launch to web search, an early developer
      API, image generation, tokenized inference, and video capability before raising
      institutional capital in July 2026. The sequence supports a rapid product and
      distribution thesis, but it does not independently verify product reliability,
      privacy controls, or durable economics. A competitor-authored review states that
      no independent audit of the full privacy architecture had been published; its
      commercial conflict lowers evidentiary weight, yet the underlying assurance gap
      remains important because privacy is the core brand promise. Investment
      diligence should therefore prioritize board and cap-table records, audited
      financials, current workforce data, and third-party security and privacy testing.
    claimRefs: [CO001, CO011, CO014, CO015, CO016]
    figureRefs: [FO001]
