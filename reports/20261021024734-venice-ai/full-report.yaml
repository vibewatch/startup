  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Reported scale and financing establish relevance, but missing economics and downside evidence prevent a
      price-supported investment recommendation.
    data:
      nodes:
        - id: financing
          label: Financing validation
          detail: $65 million Series A at a $1 billion headline valuation
        - id: operating-scale
          label: Operating scale
          detail: Greater-than-$70 million annualized run-rate revenue is reported
        - id: valuation-screen
          label: Valuation screen
          detail: Headline ratio is below roughly 14.3x the disclosed run-rate floor
        - id: evidence-gaps
          label: Underwriting gaps
          detail: Margins, retention, cash conversion, cap table, and preferences are undisclosed
        - id: downside
          label: Downside checks
          detail: Infrastructure, token, customer-support, and moderation risks need verification
        - id: recommendation
          label: Research more / track
          detail: Price only after verified economics and financing terms
    approximationNotes: >-
      The ratio node is an arithmetic ceiling based on a rounded headline valuation and a greater-than revenue floor; it
