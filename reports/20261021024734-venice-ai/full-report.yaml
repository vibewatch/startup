      - number: '3.2'
        title: Capability, privacy, and trust trade-offs
        blocks:
          - type: paragraph
            body: >-
              The privacy proposition is the center of Venice's differentiation: multiple reviewed explainers report
              that chat history is held in the browser rather than retained on Venice servers. That is a meaningful
              contrast with mainstream cloud assistants, but it is not equivalent to local inference because requests
              still reach remote compute. The evidence also distinguishes privacy claims from assurance: one
              competitor-issued review says no independent audit of the full privacy architecture has been published.
              Buyers with strict governance requirements therefore face a trust trade-off. Venice offers less filtering
              and model choice, while mainstream suites are described as stronger in enterprise controls, collaboration,
              integrations, and demanding reasoning. Self-hosting can remove third-party processing but imposes hardware
              and technical operating costs.
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP012
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
