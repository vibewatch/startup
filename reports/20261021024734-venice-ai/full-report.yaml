chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Venice AI launched publicly in May 2024 and is led by founder and CEO Erik Voorhees. The company
              aggregates access to more than 200 text, image, audio, and video models through a consumer interface and
              developer API. Its differentiation is architectural and philosophical: prompts are encrypted client-side,
              routed through an external proxy, and not retained on Venice's systems, while the product deliberately
              permits broader model behavior than mainstream assistants. A secondary company profile identifies
              Venice.ai, Inc. and Sheridan, Wyoming as the headquarters, but no state filing or equivalent primary
              record was retained, so legal identity and location should be confirmed before investment.
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO006
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO007
              - CO008
              - CO009
