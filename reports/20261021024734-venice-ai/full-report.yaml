      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Aggregate activity is not customer durability
            body: >-
              User, traffic, token, and API-call totals establish reach but do not reveal paid conversion, logo
              retention, revenue retention, account concentration, or expansion economics.
            calloutType: risk
