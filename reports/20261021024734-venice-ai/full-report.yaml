  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: A broad product surface organized around private model access
        blocks:
          - type: paragraph
            body: >-
              Venice serves two linked workflows: individuals use a unified interface for text, images, video, search,
              document analysis, code assistance, characters, and voice-oriented experiences, while developers call the
              API for applications and agents. Independent and directory-style sources report access to more than 200
              open-source and proprietary models across text, image, video, and audio, although the assigned evidence
              does not independently enumerate that catalog. Model choice is therefore a distribution advantage rather
              than a proprietary-model moat. The user-facing differentiators are flexible model selection, configurable
              prompts and characters, and the ability to keep conversation history on the user's device. Mobile
              applications extend the same proposition to iOS and Android, but the launch evidence comes from
              Sancrisoft, the engineering partner that built them, rather than from independent release telemetry.
            claimRefs:
              - CE001
              - CE002
              - CE009
              - CE010
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
