              - CP012
              - CP013
              - CP015
      - number: '3.3'
        title: Pricing, packaging, and distribution
        blocks:
          - type: paragraph
            body: >-
              Three current third-party sources report a Venice Pro list price of $18 per month, while the free tier is
              reported at ten text prompts and fifteen image prompts per day. Toolradar's wider writing-tool sample
              places the same $18 entry price slightly above its $17.40 peer median, so Venice is not unambiguously a
              low-price leader even if it undercuts the cited $20 ChatGPT Plus and Claude Pro plans. Packaging is also
              differentiated: VVV staking can allocate daily inference capacity rather than charge per request, while
              OpenAI API compatibility lowers the engineering cost of trialing Venice. These are list-price and
              architecture comparisons, not evidence of realized contract prices, retention, or channel economics.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP010
              - CP011
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP011
              - CP013
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Venice's defensible wedge is the combination of privacy-oriented handling, permissive output policies,
              model aggregation, and alternative API economics rather than ownership of a proprietary frontier model.
              That combination may attract privacy-conscious creators and developers, but it also makes model access
              easier to imitate. Reviewed sources describe weaker performance on demanding reasoning, variable quality
              by task, and thinner enterprise controls than large suites. OpenAI-compatible APIs and model switching
              reduce adoption friction, yet they also make multi-homing and supplier substitution easier. Adverse
              evidence is material but not definitive: the strongest complaint snapshot comes from a competing vendor
              that promotes its own product, so the reported support and review problems warrant diligence rather than
              treatment as an independent benchmark.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Clear wedge, not yet a proven moat
            body: >-
              Venice combines privacy-oriented handling, low-friction API migration, model choice, and alternative
              inference economics in one offer, creating a coherent acquisition wedge.
            calloutType: strength
            claimRefs:
              - CP002
              - CP010
              - CP011
          - type: callout
            title: Assurance and quality remain diligence issues
            body: >-
              The reviewed evidence identifies variable output quality and no independent audit of the full privacy
              architecture; the most severe support complaints come from a competitor.
            calloutType: risk
            claimRefs:
