  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Venice's relevant market is narrower than all generative-AI spending. Its product boundary combines a
              consumer creation interface with a developer-facing API spanning text, images, video, music, speech,
              embeddings, and web tools. The monetizable perimeter visible in the assigned evidence is subscription
              access, usage credits, API consumption, and token-enabled inference. It excludes frontier-model training,
              hardware sales, advertising, and unrelated enterprise software. The closest status-quo substitutes are
              direct use of mainstream hosted assistants such as ChatGPT, Gemini, and Claude, plus self-hosted
              open-source models for technically capable users. Venice's differentiation is therefore privacy, model
              choice, and fewer added restrictions rather than ownership of a proprietary frontier model. This boundary
              matters because broad AI-market forecasts would include spend that Venice cannot presently capture.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The assigned sources support a bottom-up traction lens, not an industry TAM. TechCrunch reported more than
              3 million active users and an average of 1.7 million API calls per day in July 2026, while Datawallet
              recorded company-reported figures of 3.5 million registered users in July, more than 4 million users on
              the website by October, and 1.3 trillion tokens processed monthly. These figures use different dates and
              denominators, so they are not a conversion funnel and should not be divided into one another. The reported
              annualized run-rate revenue above $70 million is a current-period extrapolation, not audited ARR or total
              addressable spend. Together, the metrics demonstrate meaningful scale inside Venice's niche; they do not
              establish the size of the privacy-sensitive AI category or Venice's attainable share.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
