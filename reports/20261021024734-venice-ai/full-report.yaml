              - CE009
              - CE010
              - CE012
      - number: '5.2'
        title: Privacy is a mode-dependent control stack, not one universal guarantee
        blocks:
          - type: paragraph
            body: >-
              The official architecture describes a common Venice proxy that relays requests without storing them while
              conversation history remains on the device. Protection then changes by mode. Anonymous mode obscures
              identity from frontier-model providers but explicitly tells users to assume those providers store content.
              Private mode uses Venice-controlled GPUs or zero-retention partner infrastructure and relies on contracts.
              TEE mode adds hardware isolation and remote attestation through external partners, while E2EE encrypts on
              the device and decrypts only inside a verified TEE. This progression is meaningful because it exposes
              rather than hides the trust boundary, but it also makes the product experience conditional: the strongest
              mode has fewer models, can be slower, and disables web search and memory. Taken together, the product is
              an orchestration and privacy-control layer over multiple inference environments, not evidence of one
              locally running model stack.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
              - CE016
