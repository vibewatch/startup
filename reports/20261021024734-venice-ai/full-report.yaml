        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Unite.AI reports that the latest capital is intended to scale the consumer application and API globally,
              including infrastructure and model access. That use is strategically coherent with a compute-intensive
              router, but the $65 million financing amount is not evidence of current cash availability: the assigned
              sources do not disclose closing cash, monthly burn, working capital, capex, debt, token-related
              obligations, or runway. The financial verdict is therefore positive on demand and monetization breadth but
              provisional on revenue quality, margin durability, and capital efficiency. Investment underwriting should
              require management accounts, cohort data, model-level COGS, and a post-financing cash bridge before
              relying on the headline profitability claim.
