      - number: '1.3'
        title: Financing and scale
        blocks:
          - type: paragraph
            body: >-
              On July 1, 2026, Venice announced a $65 million Series A at a $1 billion valuation, described as its first
              external fundraise. Dragonfly led the round, with Coinbase Ventures and North Island Ventures among the
              disclosed participants. Management told TechCrunch that Venice was profitable and generating more than $70
              million in annualized run-rate revenue; this is neither audited revenue nor verified ARR, and the
              financing amount is not evidence of cash currently available. Operating scale is nevertheless notable:
              coverage reports more than 3 million active users and an average 1.7 million API calls per day. Management
              plans to direct capital toward GPUs and owned data centers to reduce leasing dependence and improve gross
              margins.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
      - number: '1.4'
        title: Milestones and diligence implications
        blocks:
          - type: paragraph
            body: >-
              Venice moved quickly from a May 2024 launch to web search, an early developer API, image generation,
              tokenized inference, and video capability before raising institutional capital in July 2026. The sequence
              supports a rapid product and distribution thesis, but it does not independently verify product
              reliability, privacy controls, or durable economics. A competitor-authored review states that no
              independent audit of the full privacy architecture had been published; its commercial conflict lowers
              evidentiary weight, yet the underlying assurance gap remains important because privacy is the core brand
              promise. Investment diligence should therefore prioritize board and cap-table records, audited financials,
              current workforce data, and third-party security and privacy testing.
            claimRefs:
              - CO001
              - CO011
              - CO014
              - CO015
              - CO016
