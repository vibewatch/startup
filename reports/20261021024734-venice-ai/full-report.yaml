    title: Company milestone timeline
    type: timeline
    summary: >-
      Venice progressed from public launch to multimodal products, tokenized inference, and institutional financing in
      roughly two years.
    data:
      items:
        - date: 2024-05
          label: Public launch
          detail: Venice launches as a private, uncensored AI platform built around open models.
          tone: neutral
          claimRefs:
            - CO001
