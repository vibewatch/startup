              - CO015
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Traction before external capital
            body: >-
              Management-reported profitability and more than $70M of annualized run-rate revenue preceded Venice's
              first external financing, an unusual sequence for an AI infrastructure and consumer platform.
            calloutType: strength
            claimRefs:
              - CO009
              - CO010
              - CO012
          - type: callout
            title: Core promise lacks retained independent assurance
            body: >-
              Privacy is central to Venice's positioning, but the assigned evidence set contains no independent security
              or privacy audit; a conflicted competitor source explicitly flags that absence.
            calloutType: risk
            claimRefs:
              - CO006
