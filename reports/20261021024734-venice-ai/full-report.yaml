      - number: '5.3'
        title: Product maturity is visible, but operational assurance remains thin
        blocks:
          - type: paragraph
            body: >-
              The platform has shipped web, API, and mobile surfaces and a named partner describes a
              JavaScript/TypeScript, Next.js, React Native, cloud, and caching stack. That is useful developer signal,
              but it is partner-issued evidence rather than an independent technical assessment. The most concrete
              adverse product evidence is a competitor-affiliated review reporting overloaded models without fallback or
              queueing; its commercial bias lowers confidence, yet the failure mode is specific enough to warrant
              testing. The same review states that no independent audit of the full privacy architecture had been
              published. Because the core differentiation depends on retention behavior across Venice and external
              infrastructure, contractual claims and remote attestation should be supplemented with third-party audit
              reports, status history, incident records, and mode-level latency and availability data before
              enterprise-grade reliability or compliance is underwritten.
            claimRefs:
              - CE011
              - CE013
              - CE014
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The privacy promise changes with the selected model
            body: >-
              Anonymous mode may expose content to a provider that stores it; Private mode is contract-enforced; only
              TEE and E2EE add hardware-verifiable controls, with narrower functionality and possible latency
              trade-offs.
            calloutType: risk
