  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Residual risk prioritization
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposure is trust assurance: privacy is the central product promise, yet the assigned
              public evidence contains no independent audit of the full architecture. That is different from evidence of
              a breach; it means the control claim remains externally unverified. Minimal filtering creates a second
              high-impact exposure because it is an intentional product choice rather than a removable edge case.
              Upstream model access, leased compute, token mechanics, customer support, and unaudited operating metrics
              form the next tier. The heatmap therefore treats impact and mitigation maturity as qualitative diligence
              judgments, not measured incident probabilities. Investment should remain conditional on primary control
              evidence, contractual dependency disclosures, and independently reconcilable operating data.
            claimRefs:
              - CR003
              - CR007
              - CR009
              - CR010
              - CR012
              - CR014
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR003
              - CR010
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and trust exposure
        blocks:
          - type: paragraph
            body: >-
              Public explainers describe local browser storage, client-side encryption, and privacy modes, but one
              adverse reviewer says no independent third-party audit of the full privacy architecture has been
              published. That gap matters because the product's differentiation depends on what Venice and its
              processors cannot retain or associate with a user. The strongest encrypted mode is also reported to
              disable web search, memory, and tool-dependent workflows, creating a security-versus-function trade-off.
              Separately, VVV staking and transferable DIEM credits add legal-classification, disclosure, and
              consumer-comprehension questions that the assigned evidence does not resolve. No cited source is a
              regulator, court, or legal opinion, so the register records diligence paths rather than asserting
              regulatory approval, noncompliance, or the absence of proceedings.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR007
              - CR008
              - CR009
              - CR010
      - number: '7.3'
        title: Operational dependencies and execution risk
        blocks:
          - type: paragraph
            body: >-
              Venice's delivery chain spans user-held API credentials, Venice endpoints, leased or owned compute, open
              models, and closed-source providers. Third-party coverage reports that some queries are routed to OpenAI
              and Anthropic, leaving availability and product differentiation exposed to external policy or commercial
              changes. Planned GPU and data-center investment may reduce leasing costs and increase control, but it also
              introduces capital deployment, commissioning, utilization, and reliability execution risk. A
              competitor-authored review alleges support, cancellation, overload, and empty-response problems; those
              allegations are directionally relevant but not independently verified. The operating scale attributed to a
              roughly 45-person team is also secondary and company-mediated, so staffing resilience and key-person
              coverage require direct confirmation.
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR010
              - CR011
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR014
              - CR015
      - number: '7.4'
        title: Investment controls and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Reported profitability and more than $70 million of annualized revenue reduce the immediate financing-risk
              narrative, but they do not substitute for audited revenue, gross margin, churn, retention, or compute-cost
              evidence. The reported metrics should therefore be treated as company-originated indicators rather than
              verified financial performance. Before investment, require an independent privacy and security assessment,
              processor and model-provider contracts, moderation and abuse-response procedures, token counsel,
              service-level history, customer-support metrics, and a revenue-to-cash reconciliation. Thesis-break
              triggers are failure to produce those materials, a material provider termination, a substantiated
              privacy-control failure, sustained service degradation, or economics that deteriorate after normalizing
              infrastructure and token incentives.
            claimRefs:
              - CR003
              - CR005
              - CR012
              - CR013
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Core promise requires independent assurance
            body: >-
              Venice's privacy architecture is its primary differentiation, but the assigned public evidence does not
              contain an independent audit of the complete control chain. Treat external assurance, processor contracts,
              and retention testing as investment conditions.
            calloutType: risk
            claimRefs:
              - CR003
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a research-more or track recommendation, with high execution and diligence risk and
              an indeterminate valuation stance rather than a buy decision. The July 2026 financing validates investor
              demand and places a current $1 billion headline mark on the company, while several outlets repeat
              management's claim of more than $70 million in annualized run-rate revenue and profitability. Those
              figures create a potentially attractive starting profile, but they do not establish recurring revenue
              quality, gross margin, retention, cash conversion, or preference-adjusted ownership value. Entry
              discipline should therefore require verified financials and full round terms before attaching a target
              return or approving a price.
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV008
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV008
              - CV011
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.2'
        title: Financing and valuation context
        blocks:
          - type: paragraph
            body: >-
              Venice announced a $65 million Series A led by Dragonfly at a $1 billion valuation and described it as its
              first outside capital. Dividing that headline valuation by the disclosed floor of more than $70 million in
              annualized run-rate revenue produces a ratio below approximately 14.3x, not an enterprise-value-to-ARR
              multiple: the valuation basis, cash, debt, token obligations, and exact revenue definition are not
              disclosed. Management says the proceeds will scale the consumer application and API, while one outlet
              reports that the company intends to build data centers and reduce reliance on leased GPU capacity. That
              use of proceeds may strengthen infrastructure control, but it also introduces capital-intensity and
              execution questions that the public evidence cannot quantify.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: Thesis, anti-thesis, and scenarios
        blocks:
          - type: paragraph
            body: >-
              The thesis is that a differentiated privacy position, reported user scale, and heavy API activity can
              support a durable consumer-and-developer platform, while claimed profitability lowers immediate financing
              risk. The anti-thesis is that reported top-line scale may not translate into durable gross profit or
              retention, token-linked access may complicate economics, and a deliberately unrestricted product may face
              safety or moderation scrutiny. Public pricing evidence is also inconsistent across 2026 sources,
              reinforcing the need to verify packaging and monetization directly. Because the retained evidence provides
              no defensible public-company, transaction, or preference-adjusted benchmark, the scenarios below use
              qualitative valuation logic and explicit evidence triggers rather than fabricated price ranges or
              probabilities.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV011
              - CV012
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness, final diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is limited despite the unicorn financing mark. The company has completed only its first
              disclosed external round, and the retained evidence contains no secondary transaction, acquisition
              benchmark, public-market pathway, ownership schedule, or liquidation-preference detail. Final diligence
              should obtain audited or bank-supported revenue, a bridge from run-rate revenue to recognized revenue,
              gross margin by product, cohort retention, compute commitments, token-related liabilities, the fully
              diluted cap table, and financing documents. The thesis should break if verified revenue materially misses
              the disclosed run-rate, profitability depends on nonrecurring token effects, retention is weak,
              infrastructure spending consumes the financing without service gains, or moderation and trust issues
              materially impair distribution or payment access.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Evidence-gated recommendation
            body: >-
              Track the company, but do not convert the $1 billion round mark into a buy price until recognized revenue,
              gross margin, retention, cash conversion, cap-table ownership, and preference terms are verified.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV008
              - CV013
          - type: callout
            title: Headline multiple is not a full valuation
            body: >-
              Less than roughly 14.3x annualized run-rate revenue is only a screening ratio; the public evidence does
              not supply enterprise value, ARR, cash, debt, token liabilities, or durable revenue quality.
            calloutType: risk
            claimRefs:
              - CV003
              - CV008
