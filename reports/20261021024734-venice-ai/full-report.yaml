  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Venice competes across more than one category. ChatGPT and Claude are the broad incumbent assistants;
              Duck.ai is a privacy-oriented aggregator; DeepAI and similar creative suites compete for price-sensitive
              multimodal use; and locally hosted open-source models are the strongest status-quo substitute for buyers
              that prioritize control over convenience. Venice itself spans chat, image, video, web-search, and API
              workflows, while a third-party directory reports more than 200 models and more than three million active
              users. The source set does not provide comparable scale or funding data for the named alternatives, so the
              profile table marks those fields unknown rather than implying parity. The positioning map is therefore an
              ordinal analytical view, not a measured market-share or benchmark chart.
            claimRefs:
