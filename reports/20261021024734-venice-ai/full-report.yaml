  - id: FM001
    title: Evidence hierarchy for Venice's addressable market
    type: pyramid
    summary: >-
      Available evidence becomes more company-specific toward the bottom, while the broad market layers remain
      unquantified.
    data:
      items:
        - label: Total generative-AI spend
          value: Not established
          detail: Assigned sources provide no external total-market denominator.
        - label: Privacy-sensitive AI demand
          value: Not established
          detail: Privacy is a product wedge, but no eligible buyer survey sizes it.
        - label: Multi-model private AI serviceable market
          value: Not established
          detail: No geography, buyer budget, or category-spend base is available.
        - label: Registered-user evidence
          value: 3.5 million
          detail: Company-reported registered users on July 1, 2026.
        - label: Active-user evidence
          value: More than 3 million
          detail: TechCrunch-reported active users in July 2026; definition undisclosed.
        - label: Monetization evidence
          value: More than $70 million
          detail: Annualized run-rate revenue reported in July 2026, not audited ARR.
    approximationNotes: >-
      This is an evidence hierarchy, not a proportional market pyramid or a conversion funnel. Mixed units and
      populations must not be divided or interpreted as nested cohorts.
    claimRefs:
      - CM002
      - CM004
      - CM006
      - CM007
  - id: FP001
    title: Competitive positioning by privacy control and suite maturity
    type: quadrant
    summary: >-
      An evidence-backed ordinal map shows Venice strongest on privacy posture but behind major suites on enterprise
      maturity, with local models maximizing control at high operating cost.
    data:
      xAxis:
        label: Privacy control
        min: 1
        max: 5
      yAxis:
        label: Product and distribution maturity
        min: 1
        max: 5
      points:
        - label: Venice AI
          x: 5
          'y': 3
          note: Browser-local history and broad multimodal access; limited enterprise controls reported.
        - label: ChatGPT
          x: 2
          'y': 5
          note: Mainstream cloud posture with broad integrations and product maturity.
        - label: Claude
          x: 3
          'y': 4
          note: Stronger privacy policy characterization than some incumbents, plus long-context workflows.
        - label: Duck.ai
          x: 4
          'y': 2
          note: No-account privacy positioning and multi-model access; narrower evidence on suite depth.
        - label: DeepAI
          x: 2
          'y': 3
          note: Broad creative tooling at a lower reported entry price; privacy controls not established.
        - label: Local models
          x: 5
          'y': 1
          note: Maximum buyer control, offset by hardware, setup, and model-capacity constraints.
    approximationNotes: >-
      Scores are analyst-authored ordinal positions from 1 (lower) to 5 (higher), derived from the cited qualitative
      comparisons; they are not market-share, benchmark, or audit scores.
    claimRefs:
      - CP002
      - CP006
      - CP012
      - CP013
      - CP014
  - id: FI001
    title: Revenue model bridge from usage to gross profit
    type: flow
    summary: >-
      Venice has multiple monetization paths, but the bridge from billed activity to gross profit is not publicly
      disclosed.
    data:
      nodes:
        - id: free-usage
          label: Free usage
          detail: Limited daily text and image prompts create an acquisition funnel.
        - id: pro-access
          label: Paid subscriptions
          detail: Pro and higher tiers monetize access, limits, advanced models, and generation credits.
        - id: api-demand
          label: API demand
          detail: Developers consume model-specific text, image, audio, and video inference.
        - id: direct-api-revenue
          label: Direct API revenue
          detail: Usage can be billed per token or through paid credits.
        - id: staked-capacity
          label: Staked VVV capacity
          detail: Active stakers receive a pro-rata daily inference allocation.
        - id: diem-capacity
          label: DIEM capacity
          detail: DIEM represents a recurring daily dollar amount of API credit.
        - id: reported-revenue
          label: Reported annualized revenue
          detail: Management-reported run-rate revenue exceeds $70 million; mix is unavailable.
        - id: gross-profit
          label: Gross profit
          detail: Not disclosed because model-level COGS, provider fees, and modality mix are unavailable.
      edges:
        - from: free-usage
          to: pro-access
          label: conversion not disclosed
        - from: pro-access
          to: reported-revenue
          label: subscription contribution
        - from: api-demand
          to: direct-api-revenue
          label: usage billing
        - from: api-demand
          to: staked-capacity
          label: alternative capacity route
        - from: staked-capacity
          to: diem-capacity
          label: locked stake creates daily credit
        - from: direct-api-revenue
          to: reported-revenue
          label: API contribution
        - from: diem-capacity
          to: reported-revenue
          label: accounting treatment undisclosed
        - from: reported-revenue
          to: gross-profit
          label: margin bridge unavailable
    approximationNotes: >-
      The diagram shows documented commercial paths, not value-proportional flows; conversion, revenue mix, and gross
      margin are unavailable.
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI005
      - CI006
      - CI013
      - CI016
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      A mode-dependent stack separates local user state, Venice routing, privacy controls, external inference, and
      delivered product surfaces.
    data:
      layers:
        - label: Client surfaces
          detail: Web, iOS, Android, and API clients initiate requests.
          modules:
            - Web workspace
            - Mobile applications
            - Developer API
          outputs:
            - User or application request
        - label: Device-local state
          detail: Conversation history remains on the user's device.
          modules:
            - Local history
            - Client-side controls
          outputs:
            - Encrypted transport
        - label: Venice proxy
          detail: The common relay obscures identity and does not store requests.
          modules:
            - Secure relay
            - Provider routing
          outputs:
            - Mode-selected request
        - label: Privacy-mode controls
          detail: Anonymous, Private, TEE, and E2EE expose different trust assumptions.
          modules:
            - Contractual controls
            - Remote attestation
            - Device encryption
          outputs:
            - Selected assurance level
        - label: Inference environment
          detail: Venice-controlled GPUs, zero-retention partners, frontier providers, or external TEEs process the prompt.
          modules:
            - Model provider
            - Controlled GPU
            - TEE partner
          outputs:
            - Model response
        - label: Product output
          detail: Text, image, audio, video, search, or agent output returns to the client.
          modules:
            - Multi-modal response
            - Application integration
          outputs:
            - Locally retained result
    approximationNotes: >-
      Conceptual synthesis of cited source descriptions; provider path and available tools vary by privacy mode, and the
      drawing does not establish independent security verification.
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
      - CE016
  - id: FU001
    title: Observable customer journey and unmeasured durability loop
    type: journey-map
    summary: >-
      Public evidence documents acquisition and access surfaces, but not conversion, renewal, or expansion rates between
      them.
    data:
      nodes:
        - id: discover
          label: Discover
          detail: Privacy and less-restricted model access attract individuals, creators, and developers.
          touchpoints:
            - Independent reviews
            - Privacy positioning
        - id: try
          label: Try
          detail: Guest and free access lowers entry friction but imposes daily usage limits.
          touchpoints:
            - Anonymous guest chat
            - Free text and image prompts
        - id: evaluate
          label: Evaluate
          detail: Users choose among models and privacy modes whose capabilities and handling differ.
          touchpoints:
            - Model selector
            - Privacy mode
        - id: upgrade
          label: Upgrade
          detail: Pro unlocks higher limits and selected document, video, and advanced-model features.
          touchpoints:
            - Pro subscription
            - Approximately $18 monthly price
        - id: integrate
          label: Integrate
          detail: Developers can move from interactive use into API-based applications and agents.
          touchpoints:
            - Developer API
            - Paid inference credits
        - id: continue-or-churn
          label: Continue or churn
          detail: Renewal and expansion are unmeasured; local-history loss and interface variability may add friction.
          touchpoints:
            - Local chat history
            - Support and cancellation experience
    approximationNotes: >-
      This is an analytical sequence of source-documented access surfaces, not an observed cohort funnel; no conversion,
      retention, or expansion rate is implied.
    claimRefs:
      - CU007
      - CU009
      - CU010
      - CU011
      - CU013
      - CU014
      - CU015
