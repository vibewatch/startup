      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The commercial path begins with a free individual user, then separates into subscription and usage-based
              branches. Pro targets individual power users and creators who value unlimited text, higher image limits,
              and API access; Pro+ and Max increase credit allocations and service levels for heavier creators and
              teams. Developers can buy API usage through ordinary credits, while crypto-native developers and
              autonomous agents can obtain capacity through VVV staking or DIEM. Budget ownership therefore ranges from
              an individual's discretionary software spend to a developer team's cloud or API budget. Enterprise
              relevance is plausible because the Max tier explicitly addresses enterprises, but the assigned evidence
              does not disclose enterprise contracts, procurement cycles, customer mix, or retention. Movement from free
              use to paid usage remains the key unobserved adoption step.
            claimRefs:
              - CM003
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Growth is supported by a clear privacy-and-control wedge, a broad model catalog, a familiar API, and
              visible consumer and developer activity. Venice can serve buyers who dislike server-side conversation
              histories, want access to multiple models through one interface, or prefer fewer platform-added content
              restrictions. The same positioning creates constraints. Anonymous mode still sends prompt text to outside
              model providers, stronger privacy modes limit some tools, and the promise of zero retention depends partly
              on company and supplier controls rather than a cited independent audit. A competitor-issued review also
              alleges support, refund, credit, and usage-limit friction; its commercial bias lowers confidence, but the
              complaints identify adoption risks worth testing. Planned data-center investment further shows that
              capacity and gross-margin improvement remain capital-intensive execution questions.
            claimRefs:
              - CM001
              - CM005
              - CM010
              - CM015
              - CM016
      - number: '2.5'
        title: Valuation relevance and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest valuation evidence is company-level traction: active users, API volume, and annualized
              run-rate revenue. None of the assigned sources supplies an independently constructed privacy-AI market
              forecast, a geography-specific spend base, enterprise customer count, paid conversion rate, retention
              cohort, or buyer-budget survey. Those omissions prevent a credible TAM-to-SAM-to-SOM bridge and make
              top-down market multiples especially fragile. Diligence should instead reconcile registered, active, and
              paying-user definitions; obtain revenue by subscription, API, and token-linked channel; and test whether
              privacy converts into durable willingness to pay. Until those data exist, the prudent market judgment is
              that Venice has validated demand within a differentiated niche, while category breadth and sustainable
              obtainable share remain unproven.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM010
              - CM016
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Size valuation from observed traction, not a generic TAM
            body: >-
              Use active users, API activity, and annualized run-rate revenue as scenario anchors, then discount for
              absent conversion, retention, margin, and independently sized market-share evidence.
            calloutType: recommendation
            claimRefs:
