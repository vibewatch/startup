              - CE008
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: A broad self-serve audience, not a disclosed enterprise roster
        blocks:
          - type: paragraph
            body: >-
              Venice appears to serve two primary usage surfaces: individuals using the web or mobile application and
              developers integrating the API. Independent reviews describe the best-fit audience as privacy-conscious
              individuals, developers, creators, researchers, writers, and small teams, while the product's anonymous
              guest entry point creates a low-friction consumer acquisition path. The payer is usually the same person
              or team that uses the product on the self-serve plans; no reviewed source identifies a separate enterprise
              procurement buyer or a channel partner that pays on the user's behalf. This breadth is strategically
              useful, but the absence of paid-account counts or revenue by segment prevents a defensible ranking of
              customer value.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
              - CU004
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.2'
        title: Adoption is large, but the denominators do not form a cohort
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption evidence is Venice's July 2026 disclosure of 3.5 million registered users, 1.3
              trillion tokens processed per month, two million developer API calls per day, and 1.3 million to 1.6
              million monthly site visits from roughly 850,000 to one million unique visitors. Independent profiles
              separately reported more than three million active users and roughly 1.7 million average daily API calls.
              Those figures indicate meaningful reach across the consumer application and API, but they use different
              populations, time bases, and labels. Registered users, active users, visitors, tokens, and calls therefore
              cannot be combined into a conversion funnel or treated as evidence of paid-customer growth.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
      - number: '6.3'
        title: Public proof stops at platform-level usage
        blocks:
          - type: paragraph
            body: >-
              None of the eight assigned, successfully fetched sources names a customer, identifies a production
              deployment, distinguishes pilots from production, or attributes an outcome to a buyer. The official
              announcement and subsequent coverage instead repeat platform-level user and traffic measures. Reviews add
              credible use-case signals, but reviewer observations are not customer references and do not establish
              procurement, renewal, or realized return on investment. The named-customer exhibit therefore records the
              public evidence boundary rather than converting audience categories into fictitious accounts. Management
              should provide a customer roster with contract status, deployment date, use case, spend, and
              referenceability before enterprise adoption receives underwriting credit.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU008
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU008
              - CU012
      - number: '6.4'
        title: Conversion, retention, and expansion remain the central diligence gap
        blocks:
          - type: paragraph
            body: >-
              The observable journey moves from anonymous or free access into an $18 monthly Pro plan or API use, but
              public sources do not quantify conversion between those surfaces. Product-local history can disappear when
              browser data is cleared, and an independent review cautions that model choice, tools, price, output
              quality, and data handling can change within the same interface. A competitor-authored review also alleges
              support and cancellation friction; its commercial conflict warrants low confidence, but the complaint is
              still an adverse signal to test. No source provides gross or net retention, churn, renewal, cohort
              behavior, expansion revenue, top-customer share, or channel dependence, so durability cannot yet be
              inferred from headline usage.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU013
              - CU014
              - CU015
