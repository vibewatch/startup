      - number: '4.3'
        title: Cost structure and unit economics remain private
        blocks:
          - type: paragraph
            body: >-
              The model-router architecture implies meaningful inference, model-provider, proxy, and infrastructure
              costs, while higher-end image and video generation may have materially different contribution margins from
              text subscriptions. The public evidence set does not disclose gross margin, gross profit, inference cost
              by model, CAC, sales cycle, payback, churn, net revenue retention, discounts, refunds, or channel
              economics. An adverse reviewer also reports that some advanced models draw from separate credits and that
              credits may not roll over, which could support monetization but also create customer friction. Without
              cohort and cost data, reported profitability cannot be translated into durable unit economics.
