              - CO011
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Voorhees is the only executive consistently named across the stronger retained coverage, and his prior
              ShapeShift and Satoshi Dice experience closely links the company's privacy, crypto, and censorship
              positions to his personal thesis. One lower-transparency profile also names Seattle entrepreneur Jesse
              Proudman as a co-founder, but the source set does not establish his current operating role. No retained
              source identifies the board, voting rights, ownership percentages, executive bench, or succession plan.
              That absence makes key-person dependence a material underwriting issue rather than evidence that the
              governance structure is founder-only.
            claimRefs:
              - CO002
              - CO003
