          x: 5
          y: 3
          note: "Browser-local history and broad multimodal access; limited enterprise controls reported."
        - label: "ChatGPT"
          x: 2
          y: 5
          note: "Mainstream cloud posture with broad integrations and product maturity."
        - label: "Claude"
          x: 3
          y: 4
          note: "Stronger privacy policy characterization than some incumbents, plus long-context workflows."
        - label: "Duck.ai"
          x: 4
          y: 2
          note: "No-account privacy positioning and multi-model access; narrower evidence on suite depth."
        - label: "DeepAI"
          x: 2
          y: 3
          note: "Broad creative tooling at a lower reported entry price; privacy controls not established."
        - label: "Local models"
          x: 5
          y: 1
          note: "Maximum buyer control, offset by hardware, setup, and model-capacity constraints."
    approximationNotes: >-
      Scores are analyst-authored ordinal positions from 1 (lower) to 5 (higher), derived
      from the cited qualitative comparisons; they are not market-share, benchmark, or audit scores.
    claimRefs: ["CP002", "CP006", "CP012", "CP013", "CP014"]
callouts:
  - calloutType: "strength"
    title: "Clear wedge, not yet a proven moat"
    body: >-
      Venice combines privacy-oriented handling, low-friction API migration, model choice,
      and alternative inference economics in one offer, creating a coherent acquisition wedge.
    claimRefs: ["CP002", "CP010", "CP011"]
  - calloutType: "risk"
    title: "Assurance and quality remain diligence issues"
    body: >-
      The reviewed evidence identifies variable output quality and no independent audit of
      the full privacy architecture; the most severe support complaints come from a competitor.
    claimRefs: ["CP008", "CP009", "CP015"]
