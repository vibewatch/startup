    title: "Competitive positioning by privacy control and suite maturity"
    type: "quadrant"
    summary: >-
      An evidence-backed ordinal map shows Venice strongest on privacy posture but behind
      major suites on enterprise maturity, with local models maximizing control at high operating cost.
    data:
      xAxis:
        label: "Privacy control"
        min: 1
        max: 5
      yAxis:
        label: "Product and distribution maturity"
        min: 1
        max: 5
      points:
