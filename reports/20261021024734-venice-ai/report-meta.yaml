companyProfile:
  summary: >-
    Venice AI is a privacy-positioned generative AI platform launched publicly in May 2024. It aggregates hundreds of
    text, image, audio, and video models across consumer applications and a developer API, pairing subscription and
    usage-based monetization with token-linked inference access.
