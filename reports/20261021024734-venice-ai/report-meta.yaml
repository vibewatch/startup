  topStrengths:
    - >-
      More than $70 million of management-reported annualized run-rate revenue and reported profitability before the
      first external financing
    - More than 3 million active users and substantial developer API activity
    - >-
      Differentiated privacy positioning, broad model choice, and diversified subscription, API, and token-linked access
