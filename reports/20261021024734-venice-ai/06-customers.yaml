        customer-level value realization.
      diligencePath: >-
        Request the top 20 consumer, API, and enterprise accounts by revenue and usage, then
        reference-check at least five customers selected by the diligence team.
      relatedQuestionRefs: [QU009]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
