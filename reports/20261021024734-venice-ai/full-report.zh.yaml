      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 受证据门槛约束的建议
            body: 跟踪公司，但在确认收入、毛利率、留存、现金转化、股权结构表所有权和偏好条款之前，不要把 $1 billion 融资估值转化为买入价格。
