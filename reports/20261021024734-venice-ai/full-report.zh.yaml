      layers:
        - label: 客户端界面
          detail: Web、iOS、Android 和 API 客户端发起请求。
          modules:
            - Web 工作区
            - 移动应用
            - 开发者 API
          outputs:
            - 用户或应用请求
        - label: 设备本地状态
          detail: 对话历史保留在用户设备上。
          modules:
            - 本地历史记录
            - 客户端控制
          outputs:
            - 加密传输
        - label: Venice 代理
          detail: 通用中继隐藏身份，且不保存请求。
          modules:
            - 安全中继
            - 供应商路由
          outputs:
            - 按模式选择的请求
        - label: 隐私模式控制
          detail: Anonymous、Private、TEE 和 E2EE 对应不同的信任假设。
          modules:
            - 合同控制
            - 远程证明
            - 设备加密
          outputs:
            - 选定的保障等级
        - label: 推理环境
          detail: Venice 控制的 GPU、零保留合作伙伴、前沿模型供应商或外部 TEE 处理提示词。
          modules:
            - 模型供应商
            - 受控 GPU
            - TEE 合作伙伴
          outputs:
            - 模型响应
        - label: 产品输出
          detail: 文本、图片、音频、视频、搜索或代理输出返回客户端。
          modules:
            - 多模态响应
            - 应用集成
          outputs:
            - 本地保留的结果
    approximationNotes: 根据引用的来源描述进行概念性归纳；供应商路径和可用工具因隐私模式而异，图示不构成独立安全验证。
