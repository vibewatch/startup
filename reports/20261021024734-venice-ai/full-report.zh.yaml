  - id: FI001
    title: 从使用到毛利的收入模型桥接
    type: flow
    summary: Venice 有多条变现路径，但从计费活动到毛利的桥接关系尚无公开披露。
    data:
      nodes:
        - id: free-usage
          label: 免费使用
          detail: 有限的每日文本和图片提示词构成获客漏斗。
        - id: pro-access
          label: 付费订阅
          detail: Pro 及更高等级通过访问权限、额度、高级模型和生成额度变现。
        - id: api-demand
          label: API 需求
          detail: 开发者消耗特定模型的文本、图片、音频和视频推理能力。
        - id: direct-api-revenue
          label: 直接 API 收入
          detail: 使用量可以按 token 计费，也可以通过付费额度计费。
        - id: staked-capacity
          label: 质押 VVV 容量
          detail: 活跃质押者按比例获得每日推理额度。
        - id: diem-capacity
          label: DIEM 容量
          detail: DIEM 代表每日持续产生的一定美元金额 API 额度。
        - id: reported-revenue
          label: 报道的年化收入
          detail: 管理层披露的运行率收入超过 $70 million；收入组合不可得。
        - id: gross-profit
          label: 毛利
          detail: 由于模型层面的 COGS、供应商费用和模态组合不可得，未予披露。
      edges:
        - from: free-usage
          to: pro-access
          label: 转化率未披露
        - from: pro-access
          to: reported-revenue
          label: 订阅贡献
        - from: api-demand
          to: direct-api-revenue
          label: 使用量计费
        - from: api-demand
          to: staked-capacity
          label: 替代性容量路径
        - from: staked-capacity
          to: diem-capacity
          label: 锁定质押产生每日额度
        - from: direct-api-revenue
          to: reported-revenue
          label: API 贡献
        - from: diem-capacity
          to: reported-revenue
          label: 会计处理未披露
        - from: reported-revenue
          to: gross-profit
          label: 毛利桥接不可得
    approximationNotes: 图示的是有文档记录的商业路径，而不是按价值比例绘制的流量；转化率、收入组合和毛利率均不可得。
