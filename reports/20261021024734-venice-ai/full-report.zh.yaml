        title: 里程碑与尽调含义
        blocks:
          - type: paragraph
            body: >-
              Venice 从 2024 年 5 月上线，到推出网页搜索、早期开发者 API、图像生成、代币化推理和视频能力，再到 2026 年 7
              月获得机构资本，推进速度很快。这一顺序支持其产品和分发能力快速发展的判断，但不能独立验证产品可靠性、隐私控制或可持续经济性。一份竞争对手撰写的评测称，完整隐私架构尚未发布独立审计；其商业冲突降低了证据权重，但由于隐私是核心品牌承诺，底层保障空白仍然重要。因此，投资尽调应优先核查董事会和股权结构表记录、经审计财务报表、当前员工数据，以及第三方安全和隐私测试。
