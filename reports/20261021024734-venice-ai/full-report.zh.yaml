      - number: '8.2'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              Venice 宣布由 Dragonfly 领投、估值 $1 billion 的 $65 million A 轮，并称这是首轮外部资本。用该头条估值除以披露的超过 $70 million
              年化收入运行率下限，得到低于约 14.3x 的比率，但这不是企业价值对 ARR 的倍数：估值基础、现金、债务、代币义务和确切收入定义均未披露。管理层称资金将用于扩展消费者应用和
              API；一家媒体则报道称，公司计划建设数据中心，降低对租赁 GPU 容量的依赖。这种资金用途可能强化基础设施控制，但也引入公开证据无法量化的资本密集度和执行问题。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: 投资论点、反论点与情景
        blocks:
          - type: paragraph
            body: >-
              投资论点是：差异化的隐私定位、已报告的用户规模和高 API
              活跃度，能够支撑持久的消费者与开发者平台；而已声称的盈利能力降低了短期融资风险。反论点是：已报告的收入规模可能无法转化为持久毛利或留存，代币挂钩访问可能使经济性更复杂，而有意不设限制的产品可能面临安全或内容审核审查。2026
              年来源中的公开定价也不一致，进一步说明需要直接核实套餐和变现。由于留存证据没有提供可信的上市公司、交易或经偏好条款调整的基准，下方情景采用定性估值逻辑和明确证据触发条件，而不是编造价格区间或概率。
