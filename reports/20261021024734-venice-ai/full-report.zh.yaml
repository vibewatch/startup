  - id: TV002
    title: 论点与反论点
    columns:
      - 立场
      - 论点
      - 证据信号
      - 什么会改变判断
    rows:
      - - 正方
        - 以隐私为核心的定位，可以让多模型平台形成差异化。
        - Venice 声称拥有 200 多个模型，并在本地保存对话记录。
        - 独立安全验证和持久的付费留存会强化这一论点。
      - - 正方
        - 使用规模可能带来经营杠杆。
        - 管理层披露有 350 万注册用户和 200 万次日 API 调用。
        - 需要用用户群留存、付费转化和工作负载层面的毛利率验证质量。
      - - 正方
        - 所称盈利能力可能降低近期对融资的依赖。
        - 多家媒体报道年化运行率收入超过 $70 million，且公司已盈利。
        - 经审计财务报表和现金流核对，才能把这一说法转成投资判断依据。
      - - 反方
        - 自有基础设施会提高资本密集度。
        - 一家媒体称，融资将支持数据中心建设，并降低对租赁 GPU 的依赖。
        - 已验证的利用率、单位成本节省和有上限的承诺，才能缓解这一担忧。
      - - 反方
        - 代币挂钩的访问机制，会让需求和负债分析更复杂。
        - 来源提到 VVV 质押和 DIEM 挂钩的推理额度，并与订阅并存。
        - 清晰的收入桥接表和代币负债明细，才能厘清可持续经济性。
      - - 反方
        - 产品信任和内容审核问题，可能限制采用率。
        - 一篇由竞争对手撰写的评论指称存在支持和使用问题，独立报道也提示了相关审查压力。
        - 核实投诉率、服务水平和政策控制，才能检验其重要性。
    notes: 公司披露的使用量和盈利能力未经独立审计；该负面评论由竞争对手发布，因此这里只把它当作尽调信号，而不是独立基准。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV011
      - CV012
      - CV015
  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 明确假设
      - 估值与回报逻辑
      - 关键风险与概率信号
    rows:
      - - 乐观
        - 报道的收入和盈利能力得到验证；付费留存强劲；自有基础设施改善单位成本。
        - 如果经确认的收入持续增长，且质量和利润率保持高位，$1 billion 估值仍可能留下上行空间。
        - 由于利润率、留存率和现金流证据不可得，目前信号偏低。
      - - 基准
        - 规模得到验证，但收入质量和基础设施回报参差不齐；代币经济仍可控。
        - 只有在谈妥持股比例和保护条款后，当前估值才可能站得住；没有公开证据支持具体回报区间。
        - 融资和使用数据得到交叉印证，但投资判断所需数据不完整，因此信号为中等。
      - - 悲观
        - 运行率收入无法转化为持久的确认收入；成本上升；信任或内容审核问题阻碍分发。
        - 下轮融资估值下调或流动性受损将变得可能，而未知的优先权和代币义务会放大下行。
        - 风险信号明确但无法量化；客户、政策和资本密集度证据仍不完整。
    notes: 这些是定性情景，不是预测；公开证据不支持概率百分比、终值倍数、退出日期或估值区间。
    claimRefs:
