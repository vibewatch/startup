  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Venice 所处的相关市场小于全部生成式 AI 支出。其产品边界将消费者创作界面与面向开发者的 API 结合起来，覆盖文本、图像、视频、音乐、语音、嵌入和网页工具。指定证据中可见的可变现范围包括订阅访问、用量
              credits、API 消耗和代币支持的推理。它不包括前沿模型训练、硬件销售、广告和无关的企业软件。最接近的现状替代方案，是直接使用 ChatGPT、Gemini、Claude
              等主流托管助手，以及技术能力较强用户自托管的开源模型。因此，Venice 的差异化在于隐私、模型选择和较少的平台额外限制，而不是拥有专有前沿模型。这个边界很重要，因为宽泛的 AI 市场预测会纳入 Venice
              当前无法获取的支出。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.2'
        title: 受证据约束的市场规模判断
        blocks:
          - type: paragraph
            body: >-
              指定来源支持的是自下而上的增长视角，而不是行业 TAM。TechCrunch 报道称，2026 年 7 月 Venice 有超过 3M 名活跃用户，API 日均调用量为 1.7
              million；Datawallet 则记录了公司自报的 7 月 3.5 million 名注册用户、截至 10 月网站上的超过 4 million 名用户，以及每月处理 1.3 trillion
              tokens。这些数字的日期和分母不同，因此不是转化漏斗，不能互相相除。上文超过 $70 million 的年化收入运行率是对当前期间的外推，不是经审计的 ARR，也不是可触达的总支出。综合来看，这些指标证明
              Venice 在自身细分市场内已有相当规模，但不能证明重视隐私的 AI 类别有多大，也不能证明 Venice 可获得的份额。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
