        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              在较强的留存报道中，Voorhees 是唯一被持续点名的高管；他在 ShapeShift 和 Satoshi Dice
              的经历，也把公司的隐私、加密和审查立场与其个人理念紧密连在一起。一份透明度较低的资料还称西雅图企业家 Jesse Proudman
              是联合创始人，但现有来源无法确认其当前运营职务。留存来源没有披露董事会、投票权、持股比例、高管梯队或继任计划。这一空白使关键人物依赖成为实质性的投资判断问题，但不能据此断言公司治理仅由创始人主导。
            claimRefs:
