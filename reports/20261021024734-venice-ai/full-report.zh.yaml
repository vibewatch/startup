        blocks:
          - type: paragraph
            body: >-
              最高的剩余风险是信任保障：隐私是核心产品承诺，但指定公开证据中没有完整架构的独立审计。这不同于存在泄露证据；它意味着控制主张仍未获外部验证。过滤最少是第二项高影响风险，因为这是有意的产品选择，而不是可以移除的边缘情况。上游模型访问、租赁计算资源、代币机制、客户支持和未经审计的运营指标构成下一层风险。因此，热力图把影响和缓解成熟度视为定性的尽调判断，而不是经过测量的事件概率。投资应继续以一手控制证据、合同依赖披露和可独立核对的运营数据为前提。
