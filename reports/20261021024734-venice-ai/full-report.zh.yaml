              - CP011
              - CP013
      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Venice 可防御的切入点，是隐私导向的处理方式、宽松的输出政策、模型聚合和替代性 API
              经济性的组合，而不是拥有专有前沿模型。这一组合可能吸引重视隐私的创作者和开发者，但也让模型访问更容易被模仿。经审阅的来源称，其在高难度推理上的表现较弱，不同任务的质量不稳定，企业控制也少于大型套件。OpenAI
              兼容 API 和模型切换降低了采用摩擦，但也让多平台并用和供应商替代更容易。反向证据值得重视，但并非定论：最强的投诉样本来自推广自身产品的竞争供应商，因此所述支持和评价问题应作为尽调事项，而不是独立基准。
