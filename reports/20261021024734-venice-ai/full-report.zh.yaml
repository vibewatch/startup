      - number: '4.3'
        title: 成本结构与单位经济仍不透明
        blocks:
          - type: paragraph
            body: >-
              模型路由架构意味着推理、模型提供商、代理和基础设施成本都不低；高端图像和视频生成的贡献利润率，也可能与文本订阅明显不同。公开证据集没有披露毛利率、毛利、按模型划分的推理成本、CAC、销售周期、回本期、流失率、净收入留存、折扣、退款或渠道经济性。一名不利评测者还称，部分高级模型使用独立
              credits，credits 可能不会滚存；这可能支持变现，也可能造成客户摩擦。没有 cohort 和成本数据，已报告的盈利能力无法转化为持久的单位经济。
