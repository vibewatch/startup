chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Venice AI 于 2024 年 5 月公开上线，由创始人兼 CEO Erik Voorhees 领导。公司通过消费者界面和开发者 API 汇聚了 200
              多个文本、图像、音频和视频模型。其差异化既来自架构，也来自理念：提示词在客户端加密，经外部代理转发，不保留在 Venice 的系统中；产品则有意允许比主流助手更宽泛的模型行为。一份二手公司资料将
              Venice.ai, Inc. 和怀俄明州 Sheridan 列为公司总部，但现有证据未留存州级登记或同等的一手记录，因此投资前应确认法律实体和所在地。
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO006
