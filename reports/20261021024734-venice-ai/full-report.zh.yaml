  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              Venice 变现的是模型访问，而不是单一的专有基础模型。公开描述显示，公司有免费获客层、每月 $18 的 Pro 订阅、包含更高 credits 的订阅、按用量计费的 API，以及一条代币路径：质押的 VVV
              分配每日推理容量，DIEM 代表持续性的 API credits。这既带来经常性收入机会，也带来与消费挂钩的收入机会，但证据没有说明订阅、直接 API 付款和代币挂钩使用之间的收入组合。当前第三方来源对 Pro
              年费也不一致——$149 与 $180——因此下文所有数字都应视为标价快照，而非实际 ARPU 或确认收入。
