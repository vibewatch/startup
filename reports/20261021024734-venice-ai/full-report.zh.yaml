      - number: '3.2'
        title: 能力、隐私与信任取舍
        blocks:
          - type: paragraph
            body: >-
              隐私主张是 Venice 差异化的中心：多份经审阅的解释资料称，聊天记录保存在浏览器中，而不是留在 Venice
              的服务器上。这与主流云端助手形成有意义的对比，但不等同于本地推理，因为请求仍会到达远程计算资源。证据也区分了隐私主张与保障：一份竞争对手发布的评测称，完整隐私架构尚未发布独立审计。因此，有严格治理要求的买方会面临信任取舍。Venice
              提供更少的过滤和更多模型选择，主流套件则更擅长企业控制、协作、集成和高难度推理。自托管可以去除第三方处理，但会带来硬件和技术运营成本。
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP012
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP012
              - CP013
              - CP015
      - number: '3.3'
        title: 定价、套餐与分发
        blocks:
          - type: paragraph
            body: >-
              三个当前第三方来源称 Venice Pro 的标价为每月 $18；免费层据称每天可发送 10 条文本提示和 15 条图像提示。Toolradar 更广泛的写作工具样本显示，同样的 $18 入门价略高于同行
              $17.40 的中位数，因此即使低于所引用的 $20 ChatGPT Plus 和 Claude Pro 套餐，Venice 也不能明确称为低价领导者。套餐设计也有差异：VVV
              质押可以分配每日推理容量，而不是按请求收费；同时，OpenAI API 兼容性降低了试用 Venice 的工程成本。这些是标价和架构比较，不是已实现合同价格、留存或渠道经济性的证据。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP010
              - CP011
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
