  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争 landscape 与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              Venice 横跨不止一个品类。ChatGPT 和 Claude 是广泛使用的在位助手；Duck.ai 是偏隐私的聚合器；DeepAI
              及类似创作套件争夺价格敏感型多模态需求；而本地托管的开源模型，则是重视控制而非便利性的买方最强的现状替代方案。Venice 本身覆盖聊天、图像、视频、网页搜索和 API 工作流，第三方目录则称其提供超过 200
              个模型、拥有超过三百万名活跃用户。现有来源没有提供这些替代方案可比的规模或融资数据，因此画像表将相关字段标为未知，而不是暗示它们规模相当。定位图是序数型分析视图，不是经过测量的市场份额或基准图表。
