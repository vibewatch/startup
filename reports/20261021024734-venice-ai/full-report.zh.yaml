            body: >-
              Venice 服务两条相连的工作流：个人用户通过统一界面使用文本、图像、视频、搜索、文档分析、代码辅助、角色和语音体验；开发者则通过 API 为应用和代理调用模型。独立来源和目录型来源称，平台可访问 200
              多个开源及专有模型，覆盖文本、图像、视频和音频，但指定证据没有独立列出完整目录。因此，模型选择是分发优势，而不是专有模型护城河。面向用户的差异化在于灵活选模、可配置提示词和角色，以及把对话历史保留在用户设备上的能力。移动应用将同一主张延伸到
              iOS 和 Android，但上线证据来自负责构建它们的工程合作伙伴 Sancrisoft，而非独立发布遥测。
