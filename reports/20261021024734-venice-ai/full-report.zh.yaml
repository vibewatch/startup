  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              证据支持“继续研究”或“跟踪”建议，执行和尽调风险较高，估值立场尚不确定，而不是直接买入。2026 年 7 月的融资验证了投资者需求，并为公司当前赋予 $1 billion 头条估值；多家媒体也重复管理层关于超过
              $70 million
              年化收入运行率和盈利的说法。这些数字构成可能有吸引力的起点，但不能证明经常性收入质量、毛利率、留存、现金转化或经偏好条款调整后的所有权价值。因此，入场纪律应要求经验证的财务数据和完整融资条款，之后才能设定目标回报或批准价格。
