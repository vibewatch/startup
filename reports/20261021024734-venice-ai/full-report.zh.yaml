  - id: FU001
    title: 可观察的客户旅程与未量化的留存循环
    type: journey-map
    summary: 公开证据记录了获客和访问界面，但没有记录它们之间的转化、续费或扩张率。
    data:
      nodes:
        - id: discover
          label: 发现
          detail: 隐私和限制更少的模型访问吸引个人用户、创作者和开发者。
          touchpoints:
            - Independent reviews
            - Privacy positioning
        - id: try
          label: 试用
          detail: 访客和免费访问降低进入门槛，但设有每日使用上限。
          touchpoints:
            - Anonymous guest chat
            - Free text and image prompts
        - id: evaluate
          label: 评估
          detail: 用户在能力和数据处理方式不同的模型与隐私模式之间做选择。
          touchpoints:
            - Model selector
            - Privacy mode
        - id: upgrade
          label: 升级
          detail: Pro 解锁更高额度，以及部分文档、视频和高级模型功能。
          touchpoints:
            - Pro subscription
            - Approximately $18 monthly price
        - id: integrate
          label: 集成
          detail: 开发者可以从交互式使用转向基于 API 的应用和代理。
          touchpoints:
            - Developer API
            - Paid inference credits
        - id: continue-or-churn
          label: 继续使用或流失
          detail: 续费和扩张尚未量化；本地历史记录丢失和界面差异可能增加摩擦。
          touchpoints:
            - Local chat history
            - Support and cancellation experience
    approximationNotes: 这是按来源记录的访问界面整理出的分析序列，不是实际观察到的用户群漏斗；不代表任何转化率、留存率或扩张率。
