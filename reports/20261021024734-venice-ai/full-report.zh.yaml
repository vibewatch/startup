      - number: '5.2'
        title: 隐私是依模式而变的控制栈，而非一项普遍保证
        blocks:
          - type: paragraph
            body: >-
              官方架构描述了一个通用 Venice 代理：转发请求但不存储请求，同时把对话历史留在设备上。保护程度会随模式变化。匿名模式会向前沿模型提供商隐藏身份，但明确要求用户假设这些提供商会存储内容。Private
              模式使用 Venice 控制的 GPU 或零保留合作方基础设施，并依靠合同约束。TEE 模式通过外部合作方增加硬件隔离和远程证明，E2EE 则在设备上加密，只在经过验证的 TEE
              内解密。这一层层增强的设计把信任边界暴露出来，而不是隐藏起来，但也使产品体验取决于模式：最强模式可用模型更少、速度可能更慢，并会禁用网页搜索和记忆。综合来看，产品是覆盖多个推理环境的编排与隐私控制层，并不能证明存在一套在本地运行的模型栈。
