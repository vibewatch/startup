      - number: '8.4'
        title: 退出准备度、最终尽调要求与论点失效触发条件
        blocks:
          - type: paragraph
            body: >-
              尽管有独角兽融资估值，退出准备度仍有限。公司只完成了首轮已披露的外部融资，留存证据中没有二级交易、收购基准、公开市场路径、持股安排或清算优先权细节。最终尽调应获取经审计或银行支持的收入、从运行率收入到确认收入的桥接、按产品划分的毛利率、cohort
              留存、计算资源承诺、代币相关负债、完全摊薄股权结构表和融资文件。如果经验证收入明显低于披露的运行率、盈利依赖非经常性代币影响、留存疲弱、基础设施支出消耗融资却未带来服务改善，或审核与信任问题严重损害分发或支付访问，投资论点应失效。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV011
