      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              商业路径从免费个人用户开始，再分成订阅和按用量收费两条分支。Pro 面向重视无限文本、更高图像额度和 API 访问的个人重度用户及创作者；Pro+ 和 Max 则为更重度的创作者及团队提高 credits
              配额和服务等级。开发者可以用普通 credits 购买 API 用量，偏加密原生的开发者和自主代理则可通过 VVV 质押或 DIEM 获得容量。因此，预算归属从个人的可自由支配软件支出，到开发者团队的云或 API
              预算不等。Max 套餐明确面向企业，因此企业相关性是合理推测，但指定证据没有披露企业合同、采购周期、客户结构或留存。从免费使用走向付费使用，仍是关键的未观测采用步骤。
            claimRefs:
              - CM003
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              增长受到清晰的隐私与控制切入点、广泛的模型目录、熟悉的 API，以及可见的消费者和开发者活跃度支持。Venice
              可以服务不喜欢服务器端保存对话历史、希望通过一个界面访问多个模型，或偏好更少平台额外内容限制的买方。同一定位也带来约束。匿名模式仍会把提示词文本发送给外部模型提供商，更强的隐私模式会限制部分工具，而零保留承诺部分依赖公司及供应商的控制，并非来自有引用的独立审计。一份竞争对手发布的评测还指称支持、退款、credits
              和用量限制存在摩擦；其商业偏见降低了可信度，但这些投诉指出了值得测试的采用风险。计划中的数据中心投资也说明，容量和毛利改善仍是资本密集型执行问题。
            claimRefs:
              - CM001
              - CM005
              - CM010
              - CM015
              - CM016
      - number: '2.5'
        title: 估值相关性与尽调空白
        blocks:
          - type: paragraph
            body: >-
              最强的估值证据来自公司层面的增长：活跃用户、API 规模和年化收入运行率。指定来源没有提供独立构建的隐私 AI 市场预测、按地域划分的支出基数、企业客户数量、付费转化率、留存 cohort
              或买方预算调查。这些空白使 TAM 到 SAM 再到 SOM 的桥接缺乏可信度，也让自上而下的市场倍数尤其脆弱。尽调应改为核对注册用户、活跃用户和付费用户的定义；获取订阅、API
              和代币挂钩渠道的分项收入；并测试隐私是否能转化为持久的付费意愿。在这些数据出现前，稳妥的市场判断是：Venice 已在差异化细分市场内验证需求，但品类宽度和可持续的可获得份额仍未验证。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM010
              - CM016
      - number: '2.6'
        title: 展示项
        blocks:
          - type: callout
            title: 依据可观察增长估值，而非套用泛化 TAM
            body: 以活跃用户、API 活跃度和年化收入运行率作为情景锚点，再对缺失的转化、留存、利润率和独立市场份额规模证据进行折价。
            calloutType: recommendation
