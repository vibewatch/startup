      - - 估值立场
        - 不确定且对价格敏感
        - 表面比率低于约 14.3 倍年化运行率收入，但它不是 EV/ARR 倍数。
        - 在经济数据标准化前，不要断言 $1 billion 名义估值便宜、合理或昂贵。
      - - 入场条件
        - 以证据为门槛
        - 资本结构表、清算优先权、确认收入、利润率、留存率和现金转化均未披露。
        - 只有在补齐缺失数据后，才能设定价格和持股目标。
    notes: 判断使用了 2026 年 7—8 月的公开来源；该比率以 $1 billion 名义估值除以高于 $70 million 的年化运行率收入下限计算，并不是企业价值或 ARR 倍数。
