      - number: '1.3'
        title: 融资与规模
        blocks:
          - type: paragraph
            body: >-
              2026 年 7 月 1 日，Venice 宣布以 $1 billion 估值完成 $65 million A 轮，并称这是首次外部融资。Dragonfly 领投，Coinbase Ventures 和
              North Island Ventures 参与其中。管理层向 TechCrunch 表示，Venice 已实现盈利，年化收入运行率超过 $70 million；这既不是经审计的收入，也未验证为
              ARR，融资金额也不能证明公司当前有可用现金。尽管如此，运营规模仍然显著：报道显示平台拥有超过 3 million 名活跃用户，API 日均调用量为 1.7 million。管理层计划把资金投向 GPU
              和自有数据中心，以降低对租赁的依赖并改善毛利率。
            claimRefs:
              - CO007
              - CO008
