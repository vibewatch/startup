  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 报道的规模和融资证明了其重要性，但经济数据和下行证据缺失，无法给出有价格支撑的投资建议。
    data:
      nodes:
        - id: financing
          label: 融资核验
          detail: $65 million A 轮融资，名义估值为 $1 billion
        - id: operating-scale
          label: 运营规模
          detail: 据报道，年化运行率收入高于 $70 million
        - id: valuation-screen
          label: 估值筛选
          detail: 表面比率低于披露运行率下限的约 14.3 倍
        - id: evidence-gaps
          label: 投资判断缺口
          detail: 利润率、留存率、现金转化、资本结构表和清算优先权未披露
        - id: downside
          label: 下行检查
          detail: 基础设施、代币、客户支持和内容审核风险需要核验
        - id: recommendation
          label: 继续研究 / 跟踪
          detail: 只有在经济数据和融资条款得到核实后才定价
    approximationNotes: 比率节点是基于四舍五入的名义估值和高于某收入下限计算出的算术上限；它不是企业价值或 ARR 倍数。
