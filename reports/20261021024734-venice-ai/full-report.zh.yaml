        - 在完成财务和融资轮条款核实前，不要批准投资。
      - - 信心
        - 中低
        - 多家媒体重复报道了融资轮条款，但运营指标大多追溯到公司披露。
        - 把公开记录当作筛选证据，而不是投资判断依据。
      - - 风险评级
        - 高
        - 基础设施扩张、代币挂钩经济、客户投诉和内容审核压力仍未解决。
