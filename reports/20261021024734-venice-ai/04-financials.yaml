      - [Pro Plus and Max, Subscription plus generation credits, User per month, "$68 and $200 respectively in one adverse review", "Single-source list prices with credit breakage risk", "Current official tiers, credit usage, rollover, and deferred-revenue policy"]
      - [Developer API, Pay per token or paid credits; VVV staking can allocate daily inference capacity, Model usage, "Model-level prices and paid volume not disclosed", "Consumption-linked but mix and margin unavailable", "Revenue by model, token, customer cohort, and payment method"]
    notes: "List-price snapshot from assigned 2026 sources; it does not establish realized pricing, revenue recognition, or stream mix."
    claimRefs: [CI002, CI003, CI004, CI005, CI014, CI015]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Offering, Price or unit, Included usage, Evidence status, Underwriting implication]
    rows:
      - [Free, "$0 per month", "About 10 text prompts and 15 image prompts daily", "Consistent across three current third-party sources", "Acquisition channel; conversion and variable cost unknown"]
      - [Pro monthly, "$18 per month", "Unlimited text is qualified by model-specific credit limits; up to 1,000 images daily is reported", "Monthly price is consistent; usage qualifications vary", "Headline price is not realized ARPU"]
      - [Pro annual, "$149 or $180 per year", "Pro features", "Current sources conflict on the annual list price", "Verify current checkout price and discounts"]
      - [Pro Plus, "$68 per month", "7,500 credits and two-month banking reported", "Single adverse-review source", "Do not model until confirmed by current first-party terms"]
      - [Max, "$200 per month", "22,500 credits and three-month banking reported", "Single adverse-review source; another review also cites about $200", "High-value tier may improve ARPU but exposes credit utilization risk"]
    notes: "Prices are third-party list-price observations; annual pricing conflicts and no source discloses realized discounts or net revenue."
    claimRefs: [CI002, CI003, CI014]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - ["Annualized run-rate revenue", "More than $70 million", "Medium; management-reported and repeated by several publishers", "Shows current revenue scale but is not ARR or audited revenue", "Monthly GAAP revenue, recurring share, and reconciliation to the run rate"]
      - [Profitability, "Reported profitable in Q1 2026", "Medium; accounting basis undisclosed", "Potentially differentiates Venice from cash-burning AI peers", "Income statement, adjusted items, stock compensation, and cash-flow reconciliation"]
      - [Active users, "More than 3 million; another report says more than 3.4 million", "Medium; company-reported", "Large top-of-funnel, but paid-user share is unknown", "Monthly active definition, paid conversion, and cohort retention"]
      - [API activity, "About 1.7 million calls per day; another source reports 85 billion tokens daily", "Medium; different units must remain separate", "Indicates infrastructure demand but not revenue or gross profit", "Paid calls, tokens by model, price realization, and inference COGS"]
      - [Gross margin, null, "Unavailable", "Core test of inference economics and model-provider exposure", "Gross margin by consumer, API, and modality"]
      - [CAC and payback, null, "Unavailable", "Determines whether growth is capital-efficient", "Blended and paid CAC, sales cycle, contribution margin, and payback"]
      - [Churn and net revenue retention, null, "Unavailable", "Determines recurring revenue durability", "Logo and revenue churn plus NRR by customer cohort"]
      - ["Cash, burn, runway, debt, and capex", null, "Unavailable; $65 million raised is not cash on hand", "Determines financing dependency and next-round timing", "Post-close balance sheet, monthly cash burn, commitments, debt, and 24-month plan"]
    notes: "Null means the metric was not disclosed in the eight assigned successful sources; reported profitability is not a substitute for cash-flow or runway data."
    claimRefs: [CI006, CI007, CI008, CI009, CI010, CI011, CI012, CI013]
figures:
  - id: FI001
    title: Revenue model bridge from usage to gross profit
    type: flow
    summary: "Venice has multiple monetization paths, but the bridge from billed activity to gross profit is not publicly disclosed."
    data:
      nodes:
        - id: free-usage
          label: Free usage
          detail: "Limited daily text and image prompts create an acquisition funnel."
        - id: pro-access
          label: Paid subscriptions
          detail: "Pro and higher tiers monetize access, limits, advanced models, and generation credits."
        - id: api-demand
          label: API demand
          detail: "Developers consume model-specific text, image, audio, and video inference."
        - id: direct-api-revenue
          label: Direct API revenue
          detail: "Usage can be billed per token or through paid credits."
        - id: staked-capacity
          label: Staked VVV capacity
          detail: "Active stakers receive a pro-rata daily inference allocation."
        - id: diem-capacity
          label: DIEM capacity
          detail: "DIEM represents a recurring daily dollar amount of API credit."
        - id: reported-revenue
          label: Reported annualized revenue
          detail: "Management-reported run-rate revenue exceeds $70 million; mix is unavailable."
        - id: gross-profit
          label: Gross profit
          detail: "Not disclosed because model-level COGS, provider fees, and modality mix are unavailable."
      edges:
        - from: free-usage
          to: pro-access
          label: conversion not disclosed
        - from: pro-access
          to: reported-revenue
          label: subscription contribution
        - from: api-demand
          to: direct-api-revenue
          label: usage billing
        - from: api-demand
          to: staked-capacity
          label: alternative capacity route
        - from: staked-capacity
          to: diem-capacity
          label: locked stake creates daily credit
        - from: direct-api-revenue
          to: reported-revenue
          label: API contribution
        - from: diem-capacity
          to: reported-revenue
          label: accounting treatment undisclosed
        - from: reported-revenue
          to: gross-profit
          label: margin bridge unavailable
    approximationNotes: "The diagram shows documented commercial paths, not value-proportional flows; conversion, revenue mix, and gross margin are unavailable."
    claimRefs: [CI001, CI002, CI004, CI005, CI006, CI013, CI016]
callouts:
  - calloutType: risk
    title: Profitability is not a runway disclosure
    body: >-
      Public reports repeat a Q1 2026 profitability claim, but no retained source
      provides the accounting basis, cash conversion, balance-sheet cash, burn, or
      debt obligations. The financing amount cannot substitute for those inputs.
    claimRefs: [CI007, CI011, CI012]
