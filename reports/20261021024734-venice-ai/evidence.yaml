  - type: private-evidence-only
    severity: material
    topic: financing-terms-gap
    missingEvidence: >-
      Fully diluted cap table, ownership sold, liquidation preferences, participation rights, anti-dilution terms, debt,
      cash balance, and token-related obligations.
    whyItMatters: >-
      Headline post-money valuation does not reveal preference-adjusted entry value, dilution, or common-equity
