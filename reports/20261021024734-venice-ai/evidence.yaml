evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board roster, cap table, voting rights, investor protections, executive bench, and succession plan.
    whyItMatters: The public evidence is too sparse to assess founder control, institutional oversight, or key-person resilience.
    diligencePath: >-
      Request the charter, bylaws, board minutes, fully diluted cap table, financing documents, and executive
      organization chart.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-quality
    missingEvidence: >-
      Audited or management financial statements reconciling recognized revenue, ARR, profitability, margins, cash, and
      burn.
    whyItMatters: >-
      A CEO-reported annualized run rate and profitability statement cannot establish recurring revenue quality or cash
      generation.
    diligencePath: >-
      Obtain monthly financial statements, bank records, revenue cohort schedules, billing exports, and a
      revenue-recognition policy.
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: privacy-assurance
    missingEvidence: >-
      Independent security and privacy assessment covering prompt handling, proxies, inference providers, retention, and
      encryption modes.
    whyItMatters: >-
      Privacy is the core product promise, while retained support is architectural description rather than independent
      control testing.
    diligencePath: >-
      Request SOC 2 materials, penetration-test reports, privacy architecture review, subprocessors, and model-provider
      retention terms.
  - type: missing-source
    severity: minor
    topic: workforce
    missingEvidence: Current employee count, functional mix, employment locations, and turnover.
    whyItMatters: >-
      Workforce capacity affects execution risk, but low-transparency profiles are insufficient for a current cover
      metric.
    diligencePath: Request a dated employee census and reconcile it to payroll, contractor records, and the organization chart.
    relatedTableRefs:
      - TO001
      - TO002
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Independent market-spend data segmented by geography, buyer, privacy requirement, and consumer versus developer
      use.
    whyItMatters: >-
      Without a denominator and segment bridge, no defensible TAM, SAM, SOM, or obtainable-share estimate can be
      produced.
    diligencePath: >-
      Commission or obtain a reputable market dataset and reconcile its category definitions to Venice's subscription
      and API products.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: conversion-and-retention
    missingEvidence: >-
      Paid-user count, free-to-paid conversion, revenue mix, cohort retention, churn, customer concentration, and
      enterprise contract data.
    whyItMatters: >-
      Public usage cannot be translated into durable monetization or a credible obtainable share without conversion and
      retention evidence.
    diligencePath: >-
      Review management cohort exports, billing data, customer segmentation, and subscription-to-API revenue
      reconciliation.
    relatedQuestionRefs:
      - QM002
      - QM003
  - type: missing-source
    severity: material
    topic: privacy-validation
    missingEvidence: >-
      Independent audit evidence covering prompt retention, supplier controls, privacy-mode enforcement, and incident
      history.
    whyItMatters: >-
      Privacy is the core adoption wedge, so unsupported implementation claims directly affect demand durability and
      enterprise procurement.
    diligencePath: >-
      Obtain third-party security assessments, processor agreements, control test results, and a complete incident
      register.
    relatedQuestionRefs:
      - QM005
  - type: private-evidence-only
    severity: material
    topic: competitor-scale
    missingEvidence: Comparable current revenue, usage, funding, headcount, and segment data for each named competitor.
    whyItMatters: >-
      Without comparable denominators, Venice's reported scale cannot be converted into a defensible relative market
      position.
    diligencePath: >-
      Obtain current peer filings, investor materials, traffic panels, and management-provided win-loss data using
      consistent periods and definitions.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: privacy-assurance
    missingEvidence: >-
      An independent security and privacy audit covering request routing, retention, identity separation, and
      third-party inference providers.
    whyItMatters: The competitive wedge depends on privacy claims that reviewed explainers repeat but do not independently test.
    diligencePath: >-
      Request the latest audit, architecture diagram, subprocessors, retention controls, penetration-test scope, and
      remediation evidence.
    relatedQuestionRefs:
      - QP005
      - QP008
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: minor
    topic: realized-pricing
    missingEvidence: >-
      Realized subscription and API pricing, discounts, credit breakage, enterprise terms, and customer switching
      behavior.
    whyItMatters: Public list prices do not establish monetization quality, retention, or sustainable price advantage.
    diligencePath: >-
      Review cohort billing exports, API usage by pricing mode, discount schedules, churn reasons, and signed enterprise
      agreements.
    relatedQuestionRefs:
      - QP003
      - QP006
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Revenue mix, gross margin by modality and stream, inference COGS, CAC, payback, churn, and net revenue retention.
    whyItMatters: These inputs determine whether reported profitability reflects durable contribution economics.
    diligencePath: >-
      Obtain monthly management accounts, cohort schedules, model-level compute invoices, and contribution-margin
      waterfalls.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Post-financing cash, monthly burn, runway, debt, working-capital needs, capex, and committed infrastructure spend.
    whyItMatters: Funding raised is not cash available, and the next financing trigger cannot be assessed without a cash bridge.
    diligencePath: >-
      Review the post-close balance sheet, 24-month cash forecast, debt documents, and committed cloud or inference
      contracts.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: pricing
    missingEvidence: >-
      Current official checkout terms for annual Pro, Pro Plus, Max, credit rollover, refunds, and model-specific
      limits.
    whyItMatters: Conflicting list prices and credit rules prevent reliable ARPU and breakage assumptions.
    diligencePath: Capture dated first-party checkout pages and reconcile them to realized billing exports and refund data.
    relatedQuestionRefs:
      - QI002
      - QI005
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: financial-verification
    missingEvidence: Audited or investor-verified financial statements supporting annualized revenue and profitability.
    whyItMatters: >-
      The retained publications largely repeat management figures without exposing accounting definitions or cash
      conversion.
    diligencePath: Reconcile bank statements, billing data, general ledger, and tax records to monthly GAAP financials.
    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: independent audit
    missingEvidence: >-
      Independent full-architecture privacy and security assessment, mode-level data-flow validation, status history,
      incident records, and latency / availability benchmarks.
    whyItMatters: >-
      Venice's differentiation depends on retention and isolation controls that span its proxy, controlled GPUs,
      contracted providers, and external TEE partners.
    diligencePath: >-
      Request current SOC 2 or ISO materials, penetration-test and privacy-assessment reports, provider data-processing
      agreements, attestation demonstrations, and twelve months of mode-level uptime and incident data.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: minor
    topic: developer adoption
    missingEvidence: >-
      Public repository activity, SDK package downloads, API changelog history, developer forum activity, and
      independently measured integration adoption.
    whyItMatters: >-
      The assigned partner case study establishes engineering activity but not ecosystem depth, external developer
      traction, or release quality.
    diligencePath: >-
      Obtain SDK and API usage cohorts, package-registry statistics, changelog exports, support-ticket metrics, and
      reference calls with production API integrators.
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A dated roster of named customers with segment, contract status, deployment date, production-versus-pilot status,
      use case, measurable outcome, and referenceability.
    whyItMatters: >-
      Aggregate users and API calls cannot establish enterprise adoption, production use, or customer-level value
      realization.
    diligencePath: >-
      Request the top 20 consumer, API, and enterprise accounts by revenue and usage, then reference-check at least five
      customers selected by the diligence team.
    relatedQuestionRefs:
      - QU009
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: >-
      Monthly paid users, free-to-paid conversion, logo and revenue churn, GRR, NRR, cohort retention, expansion
      revenue, contract duration, top-customer share, and channel mix.
    whyItMatters: >-
      Without cohort and concentration data, headline activity cannot demonstrate durable or diversified recurring
      demand.
    diligencePath: >-
      Obtain monthly cohort exports and billing records for the prior 24 months, reconcile them to revenue, and
      calculate GRR, NRR, churn, expansion, and top-10 concentration by segment.
    relatedQuestionRefs:
      - QU010
  - type: private-evidence-only
    severity: material
    topic: privacy-assurance
    missingEvidence: >-
      Independent security and privacy audit reports covering every privacy mode, processor, retention path, and
      incident-response control.
    whyItMatters: >-
      Privacy is the core differentiation, so an unsupported control claim can impair trust, enterprise adoption, and
      legal defensibility.
    diligencePath: >-
      Commission an independent assessment and obtain the latest reports, exceptions, remediation log, processor
      contracts, and technical retention tests.
    relatedQuestionRefs:
      - QR001
      - QR002
    relatedTableRefs:
      - TR001
      - TR002
  - type: missing-source
    severity: material
