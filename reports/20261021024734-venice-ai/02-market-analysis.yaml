    rows:
      - - Consumer multi-model AI
        - Individual subscriptions and premium creation features
        - Advertising and unrelated productivity software
        - Individual user / individual card or crypto wallet
        - Core consumer entry point and privacy-led differentiation
      - - Developer AI inference
        - API credits and model usage across supported modalities
        - Model training and customer-owned compute hardware
        - Developer or product team / engineering budget
        - Core usage-based expansion path
      - - Privacy-preserving inference
        - Private, TEE, and end-to-end encrypted model access
        - Security consulting and independent audit services
        - Privacy-sensitive user or security team / user or employer
        - Differentiated subset of the broader inference market
      - - Token-enabled inference
        - VVV staking and DIEM-linked daily API capacity
        - Speculative token trading and derivatives activity
        - Crypto-native developer or agent operator / token holder
        - Alternative access and payment mechanism, not a separate TAM
      - - Status quo and substitutes
        - Direct use of hosted assistants or self-hosted open models
        - Dedicated vertical software outside general AI creation
        - Same end user or development team
        - Defines switching alternatives rather than Venice revenue
    notes: >-
      Boundary is inferred from current products, pricing, and payment methods;
      no assigned source quantifies spend by segment or geography.
