      - ["Select a model for mixed media work", "Maintain separate tools or provider accounts", "Choose among a third-party-reported catalog of 200+ text, image, video, and audio models", "One interface and API for multiple modalities", "Catalog completeness, model availability, and fallback behavior are not independently verified"]
      - ["Use stronger privacy controls", "Rely on provider policy and standard transport encryption", "Choose TEE or E2EE inference with remote attestation", "Hardware isolation can limit visibility by GPU operators and Venice", "Fewer models, possible latency, and no web search or memory in E2EE"]
      - ["Continue work across devices", "Expect cloud-synchronized history", "Use separate web and mobile clients with local history", "Limits centralized retention of conversation content", "Local history can be lost and is not inherently synchronized across devices"]
    notes: "Benefits describe the mechanism supported by cited sources, not independently measured outcomes; limitations preserve each privacy mode's stated trust boundary."
    claimRefs: [CE002, CE003, CE005, CE006, CE007, CE008, CE010, CE013, CE014]
  - id: "TE003"
    title: "Technology / operating architecture table"
    columns: ["Layer or component", "Role", "Key dependency", "Material risk"]
    rows:
      - ["Client and local history", "Holds conversation history and initiates encrypted requests", "Browser or mobile device integrity", "Loss of local data, device compromise, and lack of automatic cross-device recovery"]
      - ["Venice proxy", "Obscures identity and relays requests without storing conversation content", "Venice-operated routing and TLS transport", "A central availability dependency and a control requiring audit evidence"]
      - ["Anonymous / Private inference", "Routes to frontier providers or controlled / zero-retention infrastructure", "Provider policy or contractual performance", "Retention differs by mode, and Private protection is trust-based"]
      - ["TEE / E2EE inference", "Adds enclave isolation, attestation, and optional device-to-enclave encryption", "NEAR AI Cloud, Phala Network, and available enclave-compatible models", "External-partner concentration, narrower catalog, latency, and disabled tools"]
      - ["Application delivery", "Provides web, iOS, Android, and API access", "Next.js, React Native, cloud and caching stack described by the engineering partner", "No assigned independent benchmark for uptime, deployment controls, or support quality"]
    notes: "Conceptual architecture assembled from official and partner descriptions; it is not a vendor-supplied systems diagram, and actual processing paths vary by selected privacy mode."
    claimRefs: [CE003, CE004, CE005, CE006, CE007, CE008, CE009, CE010, CE011, CE013]
