callouts:
  - calloutType: "risk"
    title: "Binary Dependence on Lead Candidate ENV-294 Clinical Progression"
    body: "Enveda's platform valuation is acutely tied to ENV-294's ongoing Phase 2a readouts in atopic dermatitis and asthma. Because the Phase 1b trial enrolled only nine patients in an open-label format without a placebo arm, positive preliminary efficacy must be replicated in randomized patient cohorts before clinical efficacy can be underwritten with confidence."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
  - calloutType: "insight"
    title: "Strategic Trade-Off Between Pipeline Retention and Partner Validation"
    body: "By choosing not to out-license early-stage assets, Enveda preserves 100% of the long-term commercial upside for ENV-294 and ENV-308. However, this posture deprives the company of non-dilutive milestone revenue and forces full clinical trial funding onto venture equity, creating high cash burn and dependence on private funding markets."
    claimRefs:
      - "CR009"
      - "CR010"
      - "CR012"
