callouts:
  - calloutType: "risk"
    title: "Formulary Gatekeeping and Biologic Incumbent Defense"
    body: "Even if ENV-294 demonstrates compelling Phase 2a clinical efficacy in atopic dermatitis and asthma, capturing market share requires dislodging entrenched injectable biologics like dupilumab. Commercial payers frequently impose aggressive step-therapy protocols requiring patients to fail topical steroids or generic immunosuppressants before approving novel branded systemics."
    claimRefs:
      - "CM001"
      - "CM008"
      - "CM009"
  - calloutType: "insight"
    title: "Strategic In-Licensing Dilemma vs. Self-Funded Commercialization"
    body: "Independent biopharma deal screening highlights that Enveda has retained full commercial rights across its 23 pipeline assets without executing pharma licensing agreements. With $845M in cumulative capital, Enveda possesses sufficient balance sheet runway to advance Phase 2 trials independently, but commercializing globally without a big-pharma marketing infrastructure represents a massive execution hurdle."
    claimRefs:
      - "CM007"
      - "CM010"
      - "CM012"
