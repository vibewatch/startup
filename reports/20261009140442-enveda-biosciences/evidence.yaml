  - type: missing-source
    severity: material
    topic: commercial-out-licensing-pipeline
    missingEvidence: >-
      Specific deal terms, target valuations, and therapeutic scope of active biopharmaceutical out-licensing
      discussions.
    whyItMatters: >-
      Directly determines near-term non-dilutive cash flow potential and validates external pharma demand for Enveda's
      clinical assets.
    diligencePath: Request confidential partnering pipeline overview and partner outreach logs under non-disclosure agreement.
    relatedQuestionRefs:
      - QU005
  - type: private-evidence-only
    severity: material
    topic: clinical-safety-dossier
    missingEvidence: >-
      Complete unblinded patient-level safety datasets, clinical adverse event frequency tables, and laboratory toxicity
      panels from Phase 1 clinical studies for ENV-294 and ENV-308.
    whyItMatters: >-
      Safety tolerability is the decisive commercial gating factor for oral immunology therapeutics competing against
      approved biologic injectables.
    diligencePath: >-
      Review confidential FDA IND investigator brochures and full Phase 1 clinical study reports under non-disclosure
      agreement.
    relatedQuestionRefs:
      - QR001
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: international-biodiversity-compliance
    missingEvidence: >-
      Public verification of source country access permits and commercial benefit-sharing agreements under the Nagoya
      Protocol for medicinal plant extracts utilized by PRISM.
    whyItMatters: >-
      Failure to secure proper genetic resource access agreements can trigger regulatory export embargoes, legal
      challenges, or title defects over derived chemical scaffolds.
    diligencePath: >-
      Audit intellectual property chain of title and source-country ABS (Access and Benefit Sharing) permits in
      corporate patent filings.
    relatedQuestionRefs:
      - QR007
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: cdmo-and-batch-supply-contracts
    missingEvidence: >-
      Contract development and manufacturing organization (CDMO) agreements, GMP batch synthesis yield reports, and
      stability testing data for ENV-294 oral tablets.
    whyItMatters: >-
      Supply chain disruptions or chemistry manufacturing and controls (CMC) batch failures would directly delay Phase 2
      clinical trial schedules.
    diligencePath: >-
      Inspect CDMO master service agreements, facility inspection histories, and Certificate of Analysis (CoA)
      documentation for clinical drug substance.
    relatedQuestionRefs:
      - QR003
