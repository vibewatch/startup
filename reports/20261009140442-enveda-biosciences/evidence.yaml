evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-financials
    missingEvidence: >-
      Audited financial statements detailing annual R&D expenditure, G&A cash burn rate, balance sheet cash reserves,
      and net cash runway to Phase 2 clinical readouts.
    whyItMatters: >-
      Without audited financial disclosures or cash runway visibility, investors cannot independently determine the
      capital adequacy of the $311M Series E before requiring subsequent financing.
    diligencePath: >-
      Obtain confidential private placement memorandum (PPM), audited GAAP financial statements, or management cap table
      during private equity secondary due diligence.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sanofi-strategic-terms
    missingEvidence: >-
      Definitive agreement terms regarding Sanofi's Series C participation, specifically whether Sanofi secured
      right-of-first-negotiation, program options, or co-development rights.
    whyItMatters: >-
      Determines whether Enveda's pipeline assets are fully unencumbered or subject to undisclosed strategic pharma call
      options.
    diligencePath: Request review of Series C investor rights agreements and side letters between Enveda Biosciences and Sanofi.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: Commercial Target Product Profile
    missingEvidence: >-
      Granular Phase 2 trial protocols, patient inclusion thresholds, and commercial target product profiles for ENV-294
      and ENV-308.
    whyItMatters: >-
      Without finalized target product profiles, estimating precise market share capture against injectable biologics
      and oral competitors remains speculative.
    diligencePath: >-
      Obtain clinical trial synopsis, investigator brochures, and FDA regulatory correspondence under confidentiality
      agreement.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: commercial-licensing-terms
    missingEvidence: >-
      Granular breakdown of commercial milestone terms, royalty rates, and option structures in Sanofi's partnership
      agreement.
    whyItMatters: Determines how much economic upside Enveda captures from partnered assets versus internal proprietary pipelines.
    diligencePath: >-
      Review confidential disclosure agreements, biopharma collaboration agreements, or future public SEC filing
      exhibits.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: revenue and commercial economics
    missingEvidence: >-
      Audited revenue by stream, realized pricing, revenue-recognition policy, partnership backlog, sales cycle, CAC,
      payback, and channel economics.
    whyItMatters: >-
      Without these inputs, current revenue quality and the path from development activity to gross profit cannot be
      underwritten.
    diligencePath: >-
      Request audited financial statements, customer and partner contracts, commercial pipeline data, and cohort-level
      acquisition and retention analysis.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI003
      - QI005
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: cash burn and runway
    missingEvidence: >-
      Post-Series E cash, restricted cash, debt, monthly burn, working capital, capex commitments, program budgets, and
      downside runway.
    whyItMatters: >-
      Capital raised does not reveal cash available or whether Enveda can fund each program through its next
      value-inflecting milestone.
    diligencePath: >-
      Obtain the post-close balance sheet, monthly cash-flow history, debt and lease schedules, Board-approved operating
      plan, and trial-by-trial funding model.
    relatedQuestionRefs:
      - QI006
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: financing totals and terms
    missingEvidence: >-
      A reconciled capitalization table and financing schedule explaining the difference between company and aggregator
      cumulative-funding totals.
    whyItMatters: >-
      Different public totals and valuation methodologies can distort dilution, preference, and capital-adequacy
      analysis.
    diligencePath: >-
      Request the fully diluted cap table, financing closing documents, certificates of incorporation, preference terms,
      and a proceeds reconciliation.
    relatedQuestionRefs:
      - QI005
      - QI006
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: preclinical-scaffold-ip
    missingEvidence: >-
      Public disclosure of chemical structures, exact biological molecular targets, and patent coverage for preclinical
      assets outside ENV-294 and ENV-308.
    whyItMatters: >-
      Prevents independent assessment of freedom-to-operate, off-target toxicity profile, and intellectual property
      exclusivity for the broader declared pipeline.
    diligencePath: >-
      Request confidential patent schedules, target validation packages, and freedom-to-operate legal opinions during
      technical diligence.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: audited-platform-benchmarks
    missingEvidence: >-
      Audited peer-reviewed benchmarking data comparing PRISM screening hit rates, cycle times, and analog synthesis
      counts against industry baseline standards.
    whyItMatters: >-
      Enveda 4X speed and 11-fold efficiency claims remain self-reported marketing benchmarks without independent
      validation.
    diligencePath: >-
      Review historical internal medicinal chemistry campaign records across finalized development candidates during
      sponsor diligence.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: sanofi-strategic-partnership-terms
    missingEvidence: >-
      Detailed contractual terms of Sanofi's Series C participation, including milestone structures, co-development
