callouts:
  - calloutType: "recommendation"
    title: "Diligence Guidance: Maintain Track Stance Until Phase 2a De-Risking"
    body: "Enveda's $311M Series E round provides ample capital cushion through 2026-2027 clinical operations, but allocating equity at a $1.83B to $2.0B private mark without validated Phase 2a human efficacy data or pharma partner validation carries asymmetric downside risk [CV001, CV003, CV009]."
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV009"
  - calloutType: "risk"
    title: "Critical Overhang: Complete Absence of Commercial Pharmaceutical Partners"
    body: "Unlike typical AI drug discovery platform peers that distribute development costs through upfront milestone-driven pharma alliances, Enveda bears 100% of clinical development expenditures internally, heightening binary trial exposure [CV009, CV010]."
    claimRefs:
      - "CV009"
      - "CV010"
