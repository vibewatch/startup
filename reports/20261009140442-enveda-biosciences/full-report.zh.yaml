      - number: '4.2'
        title: 成本基础与商业效率
        blocks:
          - type: paragraph
            body: >-
              公开证据揭示的是成本类别，而不是利润表。Enveda 表示，E 轮资金将用于后期试验、更多临床项目、PRISM
              以及为其提供支持的自动化实验室，说明临床开发和平台支出正在同步发生。公司重新发布的招聘信息还给出两个运营信号：一名高级战略与运营岗位的公开年薪为 $275,000 至 $300,000；
              印度团队正在招聘采购、供应商协调、ERP
              采购订单、海关和库存岗位。这些观察表明公司承担专业人员薪酬和实体供应链成本，但无法量化研发、临床、实验室、算力、营运资本或资本开支的总需求。由于未披露商业活动，CAC、回本周期、销售周期和渠道经济性都无法计算。
            claimRefs:
              - CI009
              - CI011
              - CI012
