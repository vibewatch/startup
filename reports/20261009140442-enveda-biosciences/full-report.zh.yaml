      - number: '8.2'
        title: 融资历史、估值基准与资本结构动态
        blocks:
          - type: paragraph
            body: >-
              Enveda 的资本化历史显示，融资轮次规模不断扩大，私募估值持续上升。2024 年末，Kinnevik 和 FPV Ventures 共同领投 $130M C 轮；随后在 Sanofi 参与下继续扩展，累计达到
              $150M。2025 年 9 月，Enveda 又以 $150M D 轮、$1.0B 投后估值成为独角兽 [CV002, CV010, CV012]。2026 年 9 月 23 日，Enveda 完成
              Catalio Capital Management 领投的 $311M E 轮，按记录九轮融资累计达到 $828M [CV001, CV002, CV008]。私募二级市场和可比公司追踪平台将 Enveda
              的投后估值标在 $1.83B 至 $2.0B 之间，相比其 $400M C 轮估值水平扩大 5.0 倍 [CV002, CV003]。不过，详细的股权结构表清算优先权、高级债务契约，以及通向 Phase 2b
              读数的确切临床资金周期，仍是严格保密的私人信息 [CV003, CV006, CV007]。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
              - CV008
              - CV010
              - CV012
