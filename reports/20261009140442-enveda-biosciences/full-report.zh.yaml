      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              最明确的公开财务事实是 2026 年 9 月的融资：Enveda 宣布完成 3.11 亿美元 E 轮，并称累计募资超过 8.45 亿美元。《华尔街日报》报道估值约为 20 亿美元；Forge 显示 18.3
              亿美元投后估值和 8.0714 亿美元总融资额。这些数字来自不同发布方，采用的方法也不同，不应强行合并成一个精确值。FundedIQ 的历史停留在 2024 年 6
              月，也说明聚合平台的总额会很快过时。更重要的是，募资额不等于可用现金。所审阅来源均未提供交割后现金、债务、受限现金、现金消耗、可支撑周期、逐项试验预算或下一轮融资触发条件；Enveda
              自己的公告也将未来融资可得性列为重大不确定性。
