      - number: '1.3'
        title: 高管团队、治理结构与临床转型
        blocks:
          - type: paragraph
            body: >-
              Enveda 由创始人兼首席执行官 Viswa Colluru 博士领导，高管团队还包括首席科学官 Hannah Gordon、首席开发官 Niranjan Rao、首席财务官 Jason Kim、首席技术官
              August Allen 和首席战略官 Inhwan Kim [CO001, CO008]。为支持从临床前发现转向中期临床试验，公司招募了多位经验丰富的制药开发高管，包括来自 Novo
              Nordisk、担任代谢战略全球负责人的 Nadeem Sarwar 博士、来自 Madrigal Pharmaceuticals 的 Michael Charlton 医学博士，以及来自 LEO Pharma
              的 Doug Maslin [CO008]。Enveda 董事会由 Catalio Capital Management、Premji Invest、Kinnevik、FPV Ventures、True
              Ventures 和 Dimension Capital 的机构投资人，以及独立董事 Mikael Dolsten 博士和 Simba Gill 组成；Dolsten 曾任 Pfizer 首席科学官兼全球研发总裁
              [CO007, CO008]。公司在战略方向上高度依赖 Colluru 博士，而治理监督也明显受到其风险投资股东联盟的影响 [CO001, CO008]。
            claimRefs:
              - CO001
              - CO007
