            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV009
              - CV011
      - number: '8.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 尽调建议：在 2a 期去风险前维持跟踪立场
            body: >-
              Enveda 的 $311M E 轮融资为其 2026—2027 年临床运营提供了充足的资金缓冲，但在尚无经验证的 2a 期人体疗效数据或制药合作伙伴验证的情况下，按 $1.83B 至 $2.0B
              的私人市场估值配置股权，仍承受不对称的下行风险 [CV001, CV003, CV009]。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV009
          - type: callout
            title: 关键悬念：完全没有商业制药合作伙伴
            body: AI 药物发现平台同业通常靠前期付款和里程碑付款的制药联盟分摊开发成本；Enveda 却独自承担 100% 的临床开发支出，试验结果的二元风险因此更高 [CV009, CV010]。
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
