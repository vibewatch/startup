companyProfile:
  summary: >-
    Enveda Biosciences 是一家总部位于 Boulder 的临床阶段生物科技公司，利用 PRISM
    平台和代谢组学流程，从天然来源中识别具有生物活性的小分子，并推进其进入人体试验。公司仍为私有企业，未披露商业产品收入；目前的资金来自 2026 年 9 月的大额 E 轮融资及此前的风险投资轮次。
