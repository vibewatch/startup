            title: 平台可扩展性与临床资产商业化
            body: Enveda 已证明 PRISM 平台能够加速生成对人体有效的临床化合物，并在 2026 年带来两项积极临床读数。但公司放弃早期制药授权合作，也就必须独自承担同时推进多个口服疗法的全部临床、监管和资本负担。
            calloutType: insight
            claimRefs:
              - CE005
