      - number: '7.4'
        title: 监测指标、尽调重点与论点失效触发条件
        blocks:
          - type: paragraph
            body: >-
              对 Enveda 做严谨投资判断，需要系统跟踪可验证的临床、监管和公司里程碑，而不是未经验证的平台声称。首要监测指标是 ENV-294 在特应性皮炎和哮喘中的盲态揭示后 Phase 2a
              临床数据读数，重点评估安慰剂校正后的 EASI-75 应答率、瘙痒减轻指标和是否出现全身不良事件。关键论点失效触发条件包括：（1）ENV-294 未能在 Phase 2a 试验中达到统计显著的疗效终点，从而摧毁
              PRISM 发现平台的临床验证；（2）出现肝毒性或机会性感染等安全信号，导致 FDA 暂停临床；（3）12 至 18
              个月内未能获得验证性制药授权合作，迫使公司在私募市场进行过度股权稀释；（4）依据国际遗传资源协议，植物生物材料采集受到重大监管执法或出口合规制裁。持续尽调必须审计机密 Phase 1b
              安全档案、Hyderabad 设施的化学合成批次放行记录，以及准确的现金可支撑周期数字。
            claimRefs:
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: 展示
        blocks:
          - type: callout
            title: 对主力候选药物 ENV-294 临床推进的二元依赖
            body: >-
              Enveda 的平台估值高度绑定 ENV-294 在特应性皮炎和哮喘中的持续 Phase 2a 读数。Phase 1b 试验采用开放标签设计且没有安慰剂组，仅纳入 9
              名患者，因此必须在随机患者队列中重复出积极的初步疗效，才能有把握地评估其临床疗效。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: 保留管线与伙伴验证之间的战略取舍
            body: >-
              Enveda 选择不对外授权早期资产，从而保留 ENV-294 和 ENV-308 100%
              的长期商业上行空间。但这一做法也让公司失去非稀释性里程碑收入，迫使其用风险股权承担全部临床试验资金，带来高额现金消耗和对私募融资市场的依赖。
            calloutType: insight
            claimRefs:
              - CR009
              - CR010
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 核心投资论点、反论点与战略支柱
        blocks:
          - type: paragraph
            body: >-
              Enveda Biosciences 的核心投资论点，是公司能够借助 PRISM 平台工业化描绘天然化学，以比传统合成或表型方法更快、化学多样性更高的方式发现口服小分子疗法 [CV004,
              CV010]。Enveda 已将平台命中发现迅速转化为覆盖四个不同疾病适应症的三个临床阶段资产，其中口服资产 ENV-294 正在进行特应性皮炎和哮喘的 Phase 2a 临床试验 [CV001,
              CV009]。但反论点揭示了严重风险：Enveda 完全采取全资持有管线的方式，在临床项目上没有获得任何制药对外授权或共同开发合作
              [CV009]。此外，保留全部临床项目的平台型生物科技公司需要巨额运营资本，使投资人暴露于大幅稀释，以及拥挤的免疫和代谢市场中的 Phase 2 疗效二元风险 [CV009, CV010]。
            claimRefs:
              - CV001
              - CV004
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
