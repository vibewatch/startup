  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群细分与运营结构
        blocks:
          - type: paragraph
            body: >-
              Enveda Biosciences
              采用混合型生物科技商业模式，将人工智能和代谢组学药物发现引擎（PRISM）与全资内部治疗管线开发结合起来。在临床阶段生物科技中，客户细分与企业软件或直接面向消费者的业务根本不同。Enveda
              不向第三方实验室客户销售订阅软件；其经济客户群分为三类主要利益相关方：生物制药授权和共同开发伙伴、医疗保险支付方与医疗系统，以及临床患者群体。大型跨国生物制药公司是近期主要商业收入渠道，可能通过资产对外授权、区域共同开发协议以及带有预付款和临床
              / 监管里程碑安排的研究合作协议产生收入。商业医疗保险公司、药品福利管理机构和国家卫生主管部门构成下游商业支付方；在将产品纳入药品目录并报销前，它们要求先证明健康经济学价值，并达到相对 dupilumab
              等成熟生物制剂的非劣效。最后，患有中重度特应性皮炎、重度哮喘和代谢疾病的确诊患者构成最终用户客户群，其治疗依从性和临床结果决定商业药物的采用及市场寿命。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
