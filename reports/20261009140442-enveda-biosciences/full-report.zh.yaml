              - CV002
              - CV008
              - CV009
              - CV011
      - number: '8.3'
        title: 情景估值建模、尽调否决触发条件与立场
        blocks:
          - type: paragraph
            body: >-
              三状态情景框架以底层临床与商业里程碑为参照，评估 Enveda 的企业回报潜力。乐观情景下，ENV-294 在特应性皮炎和哮喘上的口服 2a
              期疗效与安全性优于可比注射生物制剂，从而促成一家制药公司的数十亿美元合作，或推动公司 IPO，企业价值超过 $4.0B [CV001, CV003, CV009]。基准情景假设 2a
              期临床概念验证达到可接受水平，证明具有竞争力的生物活性，带来区域授权交易，并将估值维持在 $1.8B 至 $2.5B 区间，但仍需额外增长资本 [CV002, CV009]。悲观情景下，2a
              期试验未能证明相较标准治疗药物具有统计显著的临床差异，或暴露出不可接受的毒性，导致大幅折价融资重组，或平台重组后估值跌破 $0.6B [CV003,
              CV009]。由于估值指标由私人融资估值而非商业收入驱动，且运营现金消耗仍未披露，在临床数据公布前，采取审慎的“跟踪”立场更为合适 [CV002, CV006, CV011]。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV009
              - CV011
