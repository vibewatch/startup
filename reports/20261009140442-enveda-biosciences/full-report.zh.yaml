      - number: '6.2'
        title: 临床管线采用与运营轨迹
        blocks:
          - type: paragraph
            body: >-
              Enveda 是临床阶段药物开发商，不是商业供应商，因此月活用户、年度经常性收入和净收入留存率等传统 SaaS
              采用指标并不直接适用于其核心业务。这里应看临床试验推进、监管里程碑获批、受试者入组速度和内部实验室运营吞吐，判断采用轨迹。主力候选药物 ENV-294 是 Enveda
              的主要临床验证点，已经从计算发现推进到健康志愿者 Phase 1 试验，并进入特应性皮炎和哮喘的 Phase 2a 临床试验。与此同时，第二个临床资产 ENV-308 作为口服激素模拟物进入 Phase 1
              临床评估，面向代谢健康中的肠促胰素治疗后体重维持，拓宽了 Enveda 在不同治疗领域的潜在临床用户范围。此外，Enveda 内部运营也显示出企业科学工作流工具在 Boulder 和 Hyderabad
              两地运营中的规模化使用。运营证据确认，Enveda 的实验室部署了 Benchling 的 Deep Research Agent，使非临床实验报告起草速度最高提升
              400%，在推进更广泛开发候选物组合的同时提高内部研发速度。
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
