      - number: '4.4'
        title: 投资判断
        blocks:
          - type: paragraph
            body: >-
              Enveda
              已证明自己能够接触大型私募融资联盟，但公开记录无法证明收入质量、潜在毛利率、资本效率或现金可支撑周期。资金计划覆盖多个临床项目和平台持续扩张，因此资产负债表需求仍由里程碑驱动，规模可能很大。保留项目而不披露制药合作，或许能保留更多上行空间；但公开证据也看不到合作方提供的非稀释性现金或共同开发费用。财务判断因此是混合的：融资能力是优势，但现金转化和资本充足性尚未验证。要做出投资决定，还需要管理层财务资料、项目预算、融资条款，以及覆盖下一批价值拐点读数的概率加权融资计划。
