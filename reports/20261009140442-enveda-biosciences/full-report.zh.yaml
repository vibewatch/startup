  - id: FE001
    title: 产品架构图
    type: stack
    summary: Enveda PRISM 发现引擎及临床转化管线的多层功能架构。
    data:
      layers:
        - label: 第 1 层：天然样本获取与提取物库
          detail: 获取多样植物标本，进行标准化有机提取及高通量微量分级。
          modules:
            - 全球采购与植物标本馆登记
            - 自动化化学提取设施
            - 标准化提取物微孔板阵列
        - label: 第 2 层：分析代谢组学与质谱
          detail: 仪器层对未经纯化的化学混合物进行高分辨率串联质谱（MS/MS）分析。
          modules:
            - 高分辨率 Orbitrap MS/MS 阵列
            - 色谱分离与保留特征分析
            - 碎裂模式数字化采集
        - label: 第 3 层：机器学习与计算化学核心
          detail: 算法引擎将原始光谱碎裂数据转换为推定分子结构及生物活性预测。
          modules:
            - 计算机模拟分子结构识别
            - 知识图谱生物学映射
            - 疗效与毒性预测神经网络
        - label: 第 4 层：药物化学与候选物优化
          detail: 通过湿实验室合成验证及迭代化学精修，优化口服生物利用度和药代动力学。
          modules:
            - 合成路线设计与骨架再合成
            - 体外 / 体内 ADMET 特征分析
            - 口服固体制剂开发
        - label: 第 5 层：临床管线与转化开发
          detail: 由内部开发团队主导跨治疗领域的人体临床试验执行，不进行制药授权外包。
          modules:
            - ENV-294 IIa 期特应性皮炎与哮喘
            - ENV-308 I 期代谢健康 / 体重维持
            - ENV-6946 及临床前 IND 申报准备项目
        - label: 第 6 层：运营基础设施与全球供应
          detail: 分布式运营平台覆盖 Boulder 总部及位于海得拉巴的 Enveda Therapeutics India，负责实验室采购和海关物流。
          modules:
            - Boulder 核心实验室
            - 海得拉巴运营与供应链中心
            - ERP 采购与库存系统
    approximationNotes: 代表根据公司描述、专利披露及行业报道整理的 Enveda 概念性平台栈。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE007
      - CE011
      - CE014
  - id: FU001
    title: Enveda 客户与利益相关者价值旅程图
    type: journey-map
    summary: 展示从内部研发、战略性生物制药授权、监管批准到支付方报销的多阶段价值实现旅程。
    data:
      nodes:
        - label: 阶段 1：自然来源发现
          description: PRISM 代谢组学平台从植物提取物中识别生物活性分子，速度达到行业标准的 4 倍。
          touchpoints:
            - Mass spectrometry metabolomics scanning
            - Computational chemical structure prediction
            - Benchling AI non-clinical report drafting
        - label: 阶段 2：临床前优化与资料申报
          description: 运用现代药物化学改造候选物，并提交 IND 监管申报。
          touchpoints:
            - Medicinal chemistry optimization
            - Toxicology safety studies
            - FDA IND clearance filing
        - label: 阶段 3：临床概念验证
          description: 在特应性皮炎和哮喘人群中开展 I 期安全性试验及 IIa 期疗效研究。
          touchpoints:
            - Healthy subject Phase 1 safety dossiers
            - Scientific advisory board protocol design
            - Patient clinical trial outcome readouts
        - label: 阶段 4：战略性生物制药授权
          description: 与全球制药企业签订商业合作协议，推进后期开发。
          touchpoints:
            - Confidential data room due diligence
            - Strategic partnership milestone structuring
            - Co-development and commercial rights allocation
        - label: 阶段 5：监管批准与商业标签
          description: 开展 III 期注册研究并取得 FDA/EMA 上市许可。
          touchpoints:
            - Pivotal trial data readouts
            - NDA submission and priority review
            - Commercial product label finalization
        - label: 阶段 6：支付方报销与处方
          description: 医疗支付方为口服疗法授予处方集准入；医生为确诊患者开具处方。
          touchpoints:
            - Health economic outcome presentations
            - PBM formulary tier placement negotiations
            - Patient oral daily dosing and persistence
    approximationNotes: 展示临床阶段生物科技疗法实现终端市场价值所需的商业化顺序。
    claimRefs:
      - CU001
      - CU005
      - CU009
      - CU013
      - CU014
      - CU015
