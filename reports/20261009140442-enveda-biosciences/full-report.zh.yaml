      - number: '7.2'
        title: 运营复杂性、跨境供应链与分布式研发风险
        blocks:
          - type: paragraph
            body: >-
              Enveda 的运营执行依赖地域分割的组织结构：科罗拉多州 Boulder 的公司总部和先进实验室，与由 Hyderabad 的 Enveda Therapeutics India
              管理的高通量发现、化学处理和开发业务相连。这种分布式运营模式带来严重的跨境物流和合规漏洞。天然产物代谢组学发现始于从全球多种药用植物采购生物样本，使公司受到严格国际生物多样性条约的约束，尤其是《名古屋议定书》的获取与惠益分享要求，同时还要面对各司法辖区的进出口许可和海关审查。在
              Hyderabad，专门的采购人员协调供应商采购、基于 ERP
              的采购订单、库存仓储和海关流程，处理关键实验室耗材、特殊试剂和分析仪器。全球航空货运中断、印度或美国海关监管延误，或国际运输路线上的质量控制偏差，都可能使机器人质谱检测和湿实验室化学合成停摆，推迟早期发现候选物的关键
              IND 许可前里程碑。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
