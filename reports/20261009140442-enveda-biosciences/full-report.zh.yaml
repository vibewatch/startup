chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、运营布局与发现架构
        blocks:
          - type: paragraph
            body: >-
              Enveda Biosciences, Inc. 是一家临床阶段生物科技公司，由首席执行官 Viswa Colluru 博士和加州大学圣迭戈分校科学联合创始人 Pieter Dorrestein 博士于 2019
              年创立 [CO001]。公司主要总部和实验室位于科罗拉多州 Boulder，并在印度特伦甘纳邦 Hyderabad 设有发现与开发子公司 Enveda Therapeutics India Private
              Limited [CO002, CO008]。公司的运营架构以 PRISM 为核心，这是一个自有的计算代谢组学与机器学习平台，用于从复杂天然混合物中识别、表征和分离具有生物活性的小分子
              [CO004]。Enveda 用高分辨率质谱和机器学习模型分析天然化学多样性，绕开传统天然产物纯化的瓶颈，将进化化学转化为类似药物的口服小分子
              [CO003]。公司瞄准重大的炎症和代谢疾病，选择全资持有管线，而不是将早期发现项目对外授权 [CO006, CO009]。
            claimRefs:
              - CO001
              - CO002
              - CO003
