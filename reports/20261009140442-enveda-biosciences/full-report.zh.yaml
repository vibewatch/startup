      - number: '5.2'
        title: 治疗管线与临床资产轨迹
        blocks:
          - type: paragraph
            body: >-
              Enveda 通过推进围绕炎症和代谢适应症的内部自有管线，验证其发现平台的转化能力。主力项目 ENV-294 是同类首创、每日一次口服的小分子，采用新颖的非激酶作用机制。ENV-294
              已完成健康志愿者和中重度特应性皮炎成人患者的 Phase 1 临床试验，并在 2026 年报告良好的安全性、耐受性和早期临床读数，随后进入特应性皮炎和哮喘的两项 Phase 2a 临床试验。Enveda
              瞄准特应性疾病共有的泛内型炎症通路，采取“一款产品覆盖整条管线”的开发策略，力图提供口服便利性，并达到与 dupilumab 等注射型生物制剂相当的疗效和安全性。第二个临床项目 ENV-308
              是同类首创的每日口服激素模拟物，处于代谢健康方向的 Phase 1 开发阶段，专门用于维持减重效果，防止停止肠促胰素疗法（GLP-1 受体激动剂）后的体重反弹。其他管线资产包括正在准备中期临床试验的
              ENV-6946、正在进行 IND 许可前研究的 6 个已披露项目，以及面向未披露疾病领域的 17 个已披露开发候选物。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
