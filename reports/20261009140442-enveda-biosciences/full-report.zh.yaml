              - CE009
      - number: '5.3'
        title: 运营基础设施、战略依赖与技术尽调
        blocks:
          - type: paragraph
            body: >-
              Enveda 的运营骨架是双地域结构：总部和研究实验室位于科罗拉多州 Boulder，专门的发现与开发子公司 Enveda Therapeutics India Private Limited 位于特伦甘纳邦
              Hyderabad。印度设施设有独立的运营、供应链和采购职能，负责特殊实验室试剂、定制化学品申请、仪器部件和国际清关。不过，技术、临床和监管尽调风险仍然很大。最突出的问题，是临床资产完全没有披露制药共同开发合作：传统平台型生物科技公司会早早通过对外授权让发现引擎变现，而
              Enveda 需要自己承担全部内部开发责任和现金消耗。此外，公司发布的效率指标——每个开发候选物所需类似物减少 75%、每个骨架的成功率提高十一倍、开发周期提速 4
              4X——仍是公司加注释的运营估算，而不是经过同行评审或独立审计的行业基准。最后，临床执行风险很高：Enveda 尚无分子推进到 Phase 2a
              之后，因此在大型患者队列中的临床疗效、代谢持久性和口服生物利用度仍未经证明。
            claimRefs:
              - CE011
              - CE012
              - CE014
              - CE015
              - CE016
