        - 在商业条款或经审计账目出现前，避免为私募二级股份定价
      - - 最新投后估值
        - $1.83B - $2.0B
        - Forge Global 投后估值及 Multiples.vc E 轮基准（2026 年 9 月）
        - 代表临床阶段私人生物科技估值的前十分位层级
    notes: 评估综合了经核实的 E 轮风险融资数据、二级市场估值及临床里程碑披露。具体财务指标仍属非公开信息。
