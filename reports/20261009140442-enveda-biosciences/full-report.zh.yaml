figures:
  - id: FO001
    title: Enveda Biosciences 关键公司与临床里程碑轨迹
    type: timeline
    summary: 按时间梳理 Enveda 自 2019 年成立以来的重要融资轮次、临床进展及截至 2026 年底的董事会任命。
    data:
      items:
        - label: 公司成立
          date: '2019-12-01'
          detail: Enveda Biosciences 由 Viswa Colluru 和 Pieter Dorrestein 在科罗拉多州 Boulder 创立，旨在将机器学习用于天然产物化学。
          tone: positive
        - label: 种子轮融资
          date: '2020-12-27'
          detail: True Ventures 和 Wireframe Ventures 领投 $4.1M 种子轮融资，用于搭建初始代谢组学平台。
          tone: positive
        - label: A 轮融资
          date: '2021-06-22'
          detail: 完成 $30.2M A 轮融资，用于建设 Boulder 自动化实验室并扩大计算团队。
          tone: positive
        - label: B 轮融资
          date: '2023-04-20'
          detail: Dimension Capital 和 FPV Ventures 领投多批 B 轮融资，共募资 $95.3M，以加速先导发现。
          tone: positive
        - label: C 轮融资与进入临床
          date: '2024-11-21'
          detail: 完成 Kinnevik 和 FPV 领投的 $130M C 轮融资；推动主导资产 ENV-294 进入 I 期临床试验。
          tone: positive
        - label: Sanofi 战略扩张
          date: '2025-02-27'
          detail: Sanofi 战略投资使 C 轮规模扩大至 $150M，用于推进 AI 发现的天然小分子。
          tone: positive
        - label: D 轮融资与独角兽地位
          date: '2025-09-04'
          detail: 完成 Premji Invest 领投的 $150M D 轮融资，估值 $1.0B；ENV-294 Phase 1b 期完成首例患者入组；Dr. Mikael Dolsten 加入董事会。
          tone: positive
        - label: E 轮成长融资
          date: '2026-09-23'
          detail: 完成 Catalio Capital 领投的 $311M E 轮融资，估值 $1.83B，使累计融资达到 $845M+；George Petrocheilos 加入董事会。
          tone: positive
    approximationNotes: 日期为公开公告日期；种子阶段的成立时间反映公司最初设立时间。
    claimRefs:
      - CO001
      - CO005
      - CO007
      - CO010
      - CO012
