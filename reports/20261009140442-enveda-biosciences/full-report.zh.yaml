  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: PRISM 平台架构与天然产物解卷积
        blocks:
          - type: paragraph
            body: >-
              Enveda Biosciences
              是一家临床阶段生物科技公司，系统解码自然界尚未表征的化学多样性，开发小分子疗法。历史上获批的片剂小分子中约有一半源自天然产物，但传统天然产物药物发现存在严重运营瓶颈：复杂植物提取物需要繁琐的物理纯化，结构解析缓慢，而且经常重复发现已知化合物。Enveda
              依靠自有的 AI 原生平台 PRISM 应对这些行业瓶颈；该平台整合串联质谱、代谢组学分析和机器学习，以前所未有的速度和通量分析天然提取物。PRISM
              不必先物理纯化每个分子再做表征，而是在计算机中解析复杂植物混合物的化学成分、预测分子结构，并在投入湿实验室药物化学资源前，针对人类疾病靶点评估生物活性特征。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE003
