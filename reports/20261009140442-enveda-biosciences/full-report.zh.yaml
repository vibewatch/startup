      - number: '1.2'
        title: 融资历史、股权结构表与估值轨迹
        blocks:
          - type: paragraph
            body: >-
              自成立以来，Enveda 通过从种子轮到 E 轮的融资累计募集股权资本超过 $845M [CO005]。公司先在 2020 年完成 $4.1M 种子轮，随后于 2021 年 6 月完成 $30.2M A
              轮；2022 年 12 月至 2023 年 4 月间又完成多笔 B 轮融资，合计约 $95.3M，并于 2024 年追加 B+ 延伸轮 [CO005, CO012]。2025 年 2 月，Enveda
              在机构领投方 Kinnevik 和 FPV Ventures 参与下，将 C 轮融资扩大至 $150M，Sanofi 也进行了战略投资 [CO007, CO010]。2025 年 9 月，Enveda 完成由
              Premji Invest 领投的 $150M D 轮，报道的投后估值为 $1.0B，正式成为独角兽 [CO007, CO012]。最近一次是 2026 年 9 月 23 日，Enveda 宣布完成由
              Catalio Capital Management 领投的 $311M E 轮融资，对应估计 $1.83B 投后估值 [CO005, CO012]。不过，独立市场评论指出，Enveda
              一直全资持有整条管线，尚未签署商业制药合作协议，这加剧了未来融资依赖和临床试验的二元风险 [CO006, CO011]。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO010
              - CO011
              - CO012
