  customerFocus: 面向炎症性、自身免疫性和代谢性疾病患者，通过全资临床开发提供服务，而非依靠已披露的商业客户。
  businessModel: 通过全资临床开发推进项目，未来可选择产品销售、授权或合作；目前未披露公开收入来源。
