      - number: '2.4'
        title: 展示
        blocks:
          - type: callout
            title: 药品目录把关与生物制剂守擂
            body: >-
              即使 ENV-294 在特应性皮炎和哮喘中展现出有说服力的 Phase 2a 临床疗效，要拿到市场份额仍需撼动 dupilumab
              这类根深蒂固的注射型生物制剂。商业支付方经常设置严格的阶梯治疗方案，要求患者先使用外用类固醇或通用免疫抑制剂失败，才批准新的品牌全身用药。
            calloutType: risk
            claimRefs:
              - CM001
              - CM008
              - CM009
          - type: callout
            title: 战略授权与自筹资金商业化的两难
            body: >-
              独立生物制药交易筛选显示，Enveda 在 23 个管线资产上保留了全部商业权利，却没有签署制药授权协议。凭借 8.45 亿美元累计资本，Enveda 的资产负债表有能力独立推进 Phase 2
              试验；但没有大型制药公司的营销基础设施，想在全球商业化仍是巨大的执行障碍。
            calloutType: insight
            claimRefs:
              - CM007
              - CM010
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与分类
        blocks:
          - type: paragraph
            body: >-
              小分子药物发现领域有四类竞争者：生成式 AI
              化学平台、传统天然产物发现团队、成熟制药公司的内部筛选引擎，以及针对相近免疫学适应症的临床阶段生物科技公司。传统合成化学库的高通量筛选，在新型结构类别上的命中率不断下降，为机器学习驱动的方法打开了空间
              [CP001, CP005]。多数计算发现平台主要聚焦合成化学空间和蛋白质结构预测，而非天然化学 [CP004, CP005]。Enveda 将 PRISM
              定位在天然产物代谢组学与机器学习的交叉处，试图从进化化学中找出合成筛选流程经常绕过的生物活性分子 [CP001, CP006]。不过，在特应性皮炎等自身免疫适应症上，Enveda
              面临的直接同业竞争依然激烈，市场由已获批的全身用生物制剂和外用药主导 [CP002, CP003]。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP008
              - CP011
      - number: '3.2'
        title: 差异化与发现能力
        blocks:
          - type: paragraph
            body: >-
              Enveda 的主要技术差异化，在于将串联质谱与机器学习基础模型结合，用于测序代谢组，从复杂植物和生物混合物中直接完成结构表征，无需数月的生物测定引导分级 [CP001, CP005,
              CP006]。传统天然产物化学过去被大型制药公司放弃，原因包括纯化周期慢、化学结构模糊和合成路径难以实现；Enveda 声称，其自动化流程表征分子的速度约为传统管线的四倍
              [CP005]。相比之下，Insilico Medicine、Relay Therapeutics 和 Schrodinger 等生成式 AI
              平台，强调从头分子设计或基于物理的计算建模，针对已知蛋白靶点，而不是挖掘进化形成的次生代谢物 [CP004, CP008]。制药龙头 Sanofi 在 Enveda C
              轮中的战略支持和资金投入，为这一差异化天然产物路径提供了外部验证，尤其是在慢性免疫学适应症上 [CP002, CP003, CP007]。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP007
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP008
      - number: '3.3'
        title: 壁垒持久性、切换成本与不利竞争风险
        blocks:
          - type: paragraph
            body: >-
              评估 Enveda 的竞争持久性，要看知识产权保护、数据网络效应和生物制药合作方的切换成本。Enveda 依靠数十万种天然提取物形成的自有化学数据库、高通量机器人实验室和定制光谱机器学习模型建立防御力
              [CP001, CP005, CP006, CP009]。但外部生物制药合作方切换平台的成本仍不高：制药公司通常会在多个计算化学供应商和外部生物科技公司之间共同开发或多点布局发现项目 [CP004,
              CP008]。临床和商业风险也很突出：ENV-294 这类口服抗炎候选药物必须与成熟的标准治疗竞争，包括已有安全性记录的注射型单克隆抗体和外用制剂 [CP002,
              CP003]。如果成熟制药公司的筛选引擎复刻串联质谱机器学习流程，或 Enveda 的主力分子在 Phase 2 试验中遭遇毒性或生物利用度障碍，平台差异化可能迅速收窄 [CP008, CP010,
              CP012]。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP008
              - CP009
              - CP010
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP007
              - CP008
              - CP010
      - number: '3.4'
        title: 展示
        blocks:
          - type: callout
            title: 战略平台分化
            body: 绝大多数 AI 药物发现初创公司都在合成化学生成和靶标结构对接上竞争，而 Enveda 转向天然代谢组学；这一领域的化学复杂性历来难以适应高通量合成，因此避开了直接正面比拼。
            calloutType: insight
            claimRefs:
              - CP001
              - CP005
              - CP006
          - type: callout
            title: 临床差异化门槛
            body: 计算平台最终能否形成商业防御力，取决于 ENV-294 这类口服候选药物在临床试验中能否相较成熟生物制剂展现有竞争力的疗效和干净的安全性。
            calloutType: risk
            claimRefs:
              - CP002
              - CP003
              - CP012
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与定价边界
        blocks:
          - type: paragraph
            body: >-
              现有证据将 Enveda 描述为临床阶段药物开发商，而不是已有公开商业销售的企业。公司官网强调发现工作，独立报道则称其项目已进入人体试验，但尚无项目达到 Phase III。The Pharma Letter
              也未发现这些临床资产存在已披露的制药合作。这些事实支持一种前瞻性模型：未来价值可能来自产品销售、授权、里程碑或特许权使用费，但不能据此证明今天已经存在任何这类收入。指定来源没有提供目录定价、实际成交价、收入、ARR、收入结构或收入确认政策。因此，本章始终将股权融资与收入分开呈现。
