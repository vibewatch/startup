      - number: '6.3'
        title: 商业验证点、战略支持与伙伴参与
        blocks:
          - type: paragraph
            body: >-
              对 Enveda 披露内容的尽调显示，公司采取了明确的战略立场：没有为主力临床资产完成对外制药授权交易，而是选择用股权资本在内部推进 ENV-294 和 ENV-308。Enveda
              的主要外部战略验证来自企业投资关系，尤其是全球制药龙头 Sanofi 在其 C 轮中的战略支持。不过，Sanofi
              参与的具体商业条款——例如是否拥有优先谈判权、共同开发选择权或地域授权——在公开文件中仍未披露，这是尽调中的关键未知项。除企业投资人外，Enveda
              还与学术和科学临床试验研究者合作，组建由知名哮喘专家带领的专业科学顾问委员会，负责监督临床研究设计。运营工具上，美国和印度站点已验证采用 Benchling AI，形成了 Enveda
              内部运营自动化的有据案例；但商业药品买方客户合同仍处于商业化前阶段，等待 Phase 2 临床疗效读数。
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
