  - id: TV002
    title: 投资论点与反论点对照
    columns:
      - 支柱 / 维度
      - 投资论点
      - 反论点
      - 关键尽调触发点
    rows:
      - - 平台技术
        - PRISM 绘制未知天然化学空间，以快于行业 4 倍的速度识别具有生物活性的小分子
        - 计算代谢组学生成命中物，但尚未产出获批商业药物
        - IIa 期生物标志物及临床应答率证明新型作用机制
      - - 管线多样性
        - 4 个适应症覆盖 3 个临床资产；ENV-294 相当于产品化管线
        - 管线靶点高度相关；免疫学主靶点失败将拖垮公司价值
        - 在次要适应症（哮喘或代谢）中取得独立临床概念验证
      - - 商业合作
        - 完全自有权利保留 100% 的商业下游经济收益及授权议价能力
        - 缺乏临床阶段制药合作伙伴，使 Enveda 承担 100% 的研发消耗
        - 签署联合开发或区域授权交易，预付款超过 $100M
      - - 资本与联合投资
        - 一线投资财团（Catalio、Premji、Kinnevik、FPV、Surveyor、T. Rowe）资金实力雄厚
        - 资本快速消耗（已募资 $828M+）造成严重的清算优先权悬压
        - 股权结构表披露普通股稀释情况及高级优先权层级
    notes: 各支柱将公司的价值主张与已验证的结构性风险及独立行业评论进行对照。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV009
      - CV010
      - CV012
  - id: TV003
    title: 乐观、基准与悲观情景估值矩阵
    columns:
      - 情景
      - 运营与临床假设
      - 隐含估值逻辑
      - 下行触发点与概率信号
    rows:
      - - 乐观情景
        - ENV-294 的 IIa 期疗效达到 dupilumab 水平；ENV-308 代谢读出为阳性；达成全球制药合作
        - 通过高溢价战略收购或成功 IPO 达到 $4.0B - $6.0B
        - 概率：25%。下行触发点：II 期安全性信号或口服生物利用度较低
      - - 基准情景
        - ENV-294 展现可接受的 IIa 期疗效；管线推进；达成区域授权交易
        - 以 $1.8B - $2.5B 平稳至温和增长轮融资；估值维持 E 轮基准
        - 概率：50%。下行触发点：入组放缓；现金消耗需要过桥融资
      - - 悲观情景
        - ENV-294 未达到 IIa 期主要终点；平台未能产出差异化临床疗效；合作伙伴毫无兴趣
        - $0.3B - $0.6B 的困境资产出售或严重折价融资下的平台重组
        - 概率：25%。下行触发点：主导口服项目临床完全失败
    notes: 情景区间反映临床阶段生物科技项目经风险调整的现金流折现及私募交易可比估值。
    claimRefs:
      - CV001
      - CV002
