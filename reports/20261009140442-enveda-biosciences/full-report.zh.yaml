              - CM010
      - number: '2.2'
        title: 市场规模视角与受限的商业现实
        blocks:
          - type: paragraph
            body: >-
              评估 Enveda
              的可争取市场，必须区分自上而下的庞大疾病患病率估算与受临床条件约束的可争取支出。特应性皮炎、哮喘和肥胖这些广泛适应症，在全球每年合计对应数百亿美元以上的制药支出。但对尚无获批产品的临床阶段生物科技公司而言，现实规模必须受到治疗线次序、临床疗效门槛和支付方报销标准的约束。主力候选药物
              ENV-294 是面向中重度 2 型炎症疾病的口服非激酶小分子；只要抓住生物制剂难治或不愿打针患者中的一个细分市场，就可能形成重磅药物级商业机会。在代谢健康领域，ENV-308
              面向减重后的体重维持；与急性减重疗法相比，这一新兴市场的临床验证和长期支付方覆盖仍大体未经证明。尽调必须考虑 18.3 亿美元二级股权交易基准与早期临床阶段现实之间明显的估值脱节。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: 买方细分、支付方障碍与商业采用路径
        blocks:
          - type: paragraph
            body: >-
              Enveda 管线资产的商业采用，取决于处方医生、机构支付方 / 药品福利管理机构（PBM）和生物制药授权合作方组成的复杂三方关系。对免疫学资产 ENV-294 而言，皮肤科和肺科医生是核心临床处方方，他们要求
              Phase 2 疗效足以媲美标准治疗生物制剂，同时安全性干净，不带 JAK
              抑制剂相关的心血管或恶性肿瘤黑框警告。机构支付方和药品目录委员会掌握市场准入，要求先证明健康经济学价值，才会给予其优于通用外用类固醇或成熟生物制剂的有利目录层级。不过短期内，Enveda
              资产真正的经济“买方”是寻求管线授权或战略收购的大型跨国制药公司。独立业务开发评估显示，Enveda 虽已筛选 23
              个管线资产，却披露了零个商业制药合作伙伴，因此临床推进和估值防守完全依赖内部资产负债表资本。公司还依靠 Boulder 和 Hyderabad 两地的运营布局，支撑跨境项目战略和商业采购运营。
            claimRefs:
