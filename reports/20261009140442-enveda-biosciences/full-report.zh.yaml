              - CE015
          - type: callout
            title: 未验证的效率指标与临床 Phase 2 二元读数
            body: >-
              Enveda 声称开发速度提升 4 倍、所需类似物减少 75%、骨架成功率提高 11 倍，但这些只是公司自报的运营基准，尚未经过独立同行审计。主力资产 ENV-294 目前处于 Phase 2a
              试验阶段，平台验证从根本上仍取决于能否相对成熟生物制剂取得临床概念验证。
            calloutType: risk
