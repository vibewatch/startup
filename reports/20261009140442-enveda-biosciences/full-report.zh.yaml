      - number: '1.4'
        title: 展示
        blocks:
          - type: callout
            title: 充足的成长资本与高水平临床治理
            body: >-
              Enveda 于 2026 年 9 月成功完成 3.11 亿美元 E 轮融资，使累计募资超过 8.45 亿美元，为推进三个临床项目提供了数年的现金缓冲 [CO005]。前 Pfizer 研发负责人 Mikael
              Dolsten 博士和 Catalio 的 George Petrocheilos 加入董事会，显著增强了临床执行和后期试验治理能力 [CO007, CO008]。
            calloutType: strength
            claimRefs:
              - CO005
              - CO007
              - CO008
          - type: callout
            title: 全管线持有与加剧的临床二元风险
            body: >-
              与通常通过早期制药共同开发合作将发现引擎变现的平台型生物科技公司不同，Enveda 保留了临床资产 100% 的所有权，未签署企业授权协议
              [CO006]。这保留了全部下游股权价值，但也把临床试验的二元风险完全压在自身资产负债表资本上，使公司在竞争激烈的适应症中高度暴露于 Phase 2 疗效读数 [CO006, CO011]。
            calloutType: risk
            claimRefs:
              - CO006
              - CO011
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、治疗范围与可争取支出
        blocks:
          - type: paragraph
            body: >-
              Enveda Biosciences 处在 AI 药物发现与临床阶段生物制药开发的交叉点，专注于源自植物代谢组学的口服小分子。Enveda
              不是纯软件供应商或技术授权方，而是把资本直接投入两大治疗支柱下的自有临床资产开发：免疫学 / 炎症和代谢健康。在炎症领域，主力资产 ENV-294 针对特应性皮炎和中重度哮喘，要与 dupilumab
              等注射型生物制剂及新兴口服 JAK 抑制剂争夺制药市场支出。在代谢健康领域，候选药物 ENV-308 面向肠促胰素治疗后的体重维持，这是全球肥胖市场中快速扩张的细分领域，重点是防止停止 GLP-1
              受体激动剂后体重反弹。Enveda 的商业边界不包括外包发现 CRO 服务、通用植物提取物、软件订阅费和商业消费健康产品，因此潜在企业价值全部来自治疗管线变现。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: figure
