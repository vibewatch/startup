callouts:
  - calloutType: "strength"
    title: "Substantial Growth Capital Base and High-Caliber Clinical Governance"
    body: "Enveda's successful close of a $311M Series E round in September 2026 brings its total capital raised to over $845M, providing a multi-year cash cushion to advance three clinical programs [CO005]. The addition of former Pfizer R&D chief Dr. Mikael Dolsten and Catalio's George Petrocheilos to the board significantly enhances clinical execution and late-stage trial governance [CO007, CO008]."
    claimRefs:
      - "CO005"
      - "CO007"
      - "CO008"
  - calloutType: "risk"
    title: "Complete Pipeline Retention and Heightened Binary Clinical Exposure"
    body: "Unlike typical platform biotechnology companies that monetize discovery engines through early pharmaceutical co-development partnerships, Enveda has retained 100% ownership of its clinical assets without corporate licensing agreements [CO006]. While this preserves full downstream equity value, it concentrates binary clinical trial risk entirely on internal balance sheet capital, creating acute exposure to Phase 2 efficacy readouts in competitive indications [CO006, CO011]."
    claimRefs:
      - "CO006"
      - "CO011"
