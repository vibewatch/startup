company:
  name: "Enveda Biosciences"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Enveda Biosciences is a clinical-stage biotechnology company leveraging machine learning, tandem mass spectrometry, and metabolomics to discover oral small-molecule therapeutics from natural products. Headquartered in Boulder, Colorado, with discovery operations in Hyderabad, India, the company reached an estimated $1.83B post-money valuation following a $311M Series E round in September 2026, advancing lead candidate ENV-294 into Phase 2a trials for atopic dermatitis and asthma alongside clinical programs ENV-308 and ENV-6946."
sections:
  - id: "identity-and-operating-model"
    title: "Corporate Identity, Operating Footprint, and Discovery Architecture"
    body: "Enveda Biosciences, Inc. is a clinical-stage biotechnology company founded in 2019 by Chief Executive Officer Viswa Colluru, Ph.D., and scientific co-founder Pieter Dorrestein, Ph.D. of the University of California San Diego [CO001]. The company operates from primary corporate and laboratory headquarters in Boulder, Colorado, complemented by a discovery and development subsidiary, Enveda Therapeutics India Private Limited, located in Hyderabad, Telangana, India [CO002, CO008]. Enveda's operating architecture centers on PRISM, a proprietary computational metabolomics and machine-learning platform designed to identify, characterize, and isolate biologically active small molecules from complex natural mixtures [CO004]. By analyzing natural chemical biodiversity using high-resolution mass spectrometry and machine-learning models, Enveda bypasses traditional natural product purification bottlenecks to translate evolutionary chemistry into drug-like oral small molecules [CO003]. The company targets major inflammatory and metabolic disorders, pursuing a wholly owned pipeline strategy rather than early-stage discovery out-licensing partnerships [CO006, CO009]."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO006"
      - "CO008"
      - "CO009"
    tableRefs:
      - "TO001"
  - id: "capitalization-and-valuation"
    title: "Financing History, Cap Table Evolution, and Valuation Trajectory"
    body: "Enveda has raised more than $845 million in cumulative equity capital across seed through Series E financing rounds since its incorporation [CO005]. Following an initial $4.1M seed round in 2020 and a $30.2M Series A in June 2021, the company closed successive Series B tranches totaling approximately $95.3M between December 2022 and April 2023, followed by a Series B+ extension in 2024 [CO005, CO012]. In February 2025, Enveda expanded its Series C financing to $150M with strategic participation from Sanofi alongside institutional lead investors Kinnevik and FPV Ventures [CO007, CO010]. In September 2025, Enveda closed a $150M Series D led by Premji Invest at a reported $1.0B post-money valuation, marking its transition to unicorn status [CO007, CO012]. Most recently, on September 23, 2026, Enveda announced a $311 million Series E financing led by Catalio Capital Management, which established an estimated $1.83B post-money valuation [CO005, CO012]. However, independent market commentators note that Enveda has maintained an entirely wholly owned pipeline without signed commercial pharmaceutical partnerships, heightening future financing dependency and binary trial risk [CO006, CO011]."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO010"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO003"
  - id: "leadership-and-governance"
    title: "Executive Leadership, Governance Structure, and Clinical Transition"
    body: "Enveda is led by founder and CEO Viswa Colluru, Ph.D., supported by a specialized senior management team that includes Chief Scientific Officer Hannah Gordon, Chief Development Officer Niranjan Rao, Chief Financial Officer Jason Kim, Chief Technology Officer August Allen, and Chief Strategy Officer Inhwan Kim [CO001, CO008]. To support the operational transition from preclinical discovery to mid-stage clinical trials, the company recruited experienced pharmaceutical development executives, including Nadeem Sarwar, Ph.D. from Novo Nordisk as Global Head of Metabolic Strategy, Michael Charlton, M.D. from Madrigal Pharmaceuticals, and Doug Maslin from LEO Pharma [CO008]. Enveda's Board of Directors pairs institutional investors from Catalio Capital Management, Premji Invest, Kinnevik, FPV Ventures, True Ventures, and Dimension Capital with independent directors Dr. Mikael Dolsten, former Chief Scientific Officer and President of Worldwide R&D at Pfizer, and Simba Gill [CO007, CO008]. The company maintains significant dependence on Dr. Colluru's strategic direction, while governance oversight is substantially shaped by its venture syndicate [CO001, CO008]."
    claimRefs:
      - "CO001"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO002"
    figureRefs:
      - "FO001"
