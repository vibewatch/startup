  - id: FE001
    title: Product architecture map
    type: stack
    summary: Multi-layered functional architecture of Enveda PRISM discovery engine and clinical translation pipeline.
    data:
      layers:
        - label: 'Layer 1: Natural Sample Acquisition & Extract Library'
          detail: >-
            Physical acquisition of diverse botanical specimens, standardized organic extraction, and high-throughput
            micro-fractionation.
          modules:
            - Global Sourcing & Herbarium Accessioning
            - Automated Chemical Extraction Facility
            - Standardized Extract Micro-Plate Arraying
        - label: 'Layer 2: Analytical Metabolomics & Mass Spectrometry'
          detail: >-
            Instrumentation layer performing high-resolution tandem mass spectrometry (MS/MS) on unpurified chemical
            mixtures.
          modules:
            - High-Resolution Orbitrap MS/MS Arrays
            - Chromatographic Separation & Retention Profiling
            - Fragmentation Pattern Digital Capture
        - label: 'Layer 3: Machine Learning & Computational Chemistry Core'
          detail: >-
            Algorithmic engine translating raw spectral fragmentation data into putative molecular structures and
            bioactivity predictions.
          modules:
            - In Silico Molecular Structure Identification
            - Knowledge Graph Biological Mapping
            - Predictive Efficacy & Toxicity Neural Networks
        - label: 'Layer 4: Medicinal Chemistry & Candidate Optimization'
          detail: >-
            Wet-lab synthetic validation and iterative chemical refinement to optimize oral bioavailability and
            pharmacokinetics.
          modules:
            - Synthetic Route Design & Scaffold Resynthesis
            - In Vitro / In Vivo ADMET Profiling
            - Oral Solid Formulation Development
        - label: 'Layer 5: Clinical Pipeline & Translational Development'
          detail: >-
            Human clinical trial execution across therapeutic areas, led by internal development teams without pharma
            out-licensing.
          modules:
            - ENV-294 Phase 2a Atopic Dermatitis & Asthma
            - ENV-308 Phase 1 Metabolic Health / Weight Maintenance
            - ENV-6946 & Preclinical IND-Enabling Programs
        - label: 'Layer 6: Operational Infrastructure & Global Supply'
          detail: >-
            Distributed operational platform spanning Boulder headquarters and Enveda Therapeutics India in Hyderabad
            for laboratory procurement and customs logistics.
          modules:
            - Boulder Core Laboratories
            - Hyderabad Operations & Supply Chain Center
            - ERP Procurement & Inventory System
    approximationNotes: >-
      Represents Enveda conceptual platform stack derived from company descriptions, patent disclosures, and industry
      reporting.
