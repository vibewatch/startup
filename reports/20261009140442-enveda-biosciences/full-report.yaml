  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: PRISM Platform Architecture & Natural Product Deconvolution
        blocks:
          - type: paragraph
            body: >-
              Enveda Biosciences is a clinical-stage biotechnology company developing small-molecule therapeutics by
              systematically decoding the uncharacterized chemical diversity of the natural world. While approximately
              half of historically approved pill-form small molecules originate from natural products, traditional
              natural product drug discovery suffered from severe operational bottlenecks: laborious physical
              purification of complex plant extracts, slow structure elucidation, and high rates of rediscovery of known
              compounds. Enveda addresses these structural industry bottlenecks through its proprietary AI-native
              platform, PRISM, which integrates tandem mass spectrometry, metabolomics profiling, and machine learning
              to analyze natural extracts at unprecedented speed and throughput. Rather than physically purifying every
              molecule before characterization, PRISM resolves the chemical constituents of complex botanical mixtures
              in silico, predicts their molecular structures, and evaluates biological activity profiles against human
              disease targets before committing wet-lab medicinal chemistry resources.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE014
          - type: figure
