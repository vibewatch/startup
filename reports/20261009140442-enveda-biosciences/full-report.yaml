            Closed $150M Series D led by Premji Invest at $1.0B valuation; enrolled first patient in ENV-294 Phase 1b;
            Dr. Mikael Dolsten joined board.
          tone: positive
        - label: Series E Growth Financing
          date: '2026-09-23'
          detail: >-
            Closed $311M Series E led by Catalio Capital at $1.83B valuation, bringing total funding to $845M+; George
