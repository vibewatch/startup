      - number: '4.2'
        title: Cost Base and Commercial Efficiency
        blocks:
          - type: paragraph
            body: >-
              Public evidence reveals cost categories, not an income statement. Enveda says the Series E will fund
              later-stage trials, additional clinical programs, PRISM, and the automated laboratory that feeds it,
              indicating simultaneous clinical-development and platform spending. Company-issued job reposts add two
