              into a single precise value. FundedIQ's history stops in June 2024, further illustrating how quickly
              aggregator totals become stale. More importantly, capital raised is not cash available. None of the
              reviewed sources provides post-close cash, debt, restricted cash, burn, runway, trial-by-trial budgets, or
              a next-round trigger, and Enveda's own release lists additional financing availability among material
              uncertainties.
