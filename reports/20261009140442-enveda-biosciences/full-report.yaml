              - CI010
              - CI015
              - CI016
      - number: '4.4'
        title: Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              Enveda has demonstrated access to a large private financing syndicate, but the public record cannot
              establish revenue quality, gross-margin potential, capital efficiency, or runway. The planned use of funds
              spans multiple clinical programs and continued platform expansion, so the balance-sheet requirement
              remains milestone-driven and potentially substantial. Retaining programs without a disclosed
              pharmaceutical partnership may preserve more upside, but it also leaves no public evidence of non-dilutive
              partner cash or shared development expense. The financial verdict is therefore mixed: financing capacity
              is a strength, while cash conversion and capital adequacy are unverified. An investment decision requires
              management financials, program budgets, financing terms, and a probability-weighted funding plan through
              the next value-inflecting readouts.
            claimRefs:
              - CI002
              - CI008
              - CI009
              - CI010
              - CI015
