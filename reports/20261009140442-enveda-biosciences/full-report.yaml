  - id: FU001
    title: Enveda Customer and Stakeholder Value Journey Map
    type: journey-map
    summary: >-
      Multi-stage value realization journey spanning internal R&D, strategic biopharma licensing, regulatory approval,
      and payer reimbursement.
    data:
      nodes:
        - label: 'Stage 1: Nature-Derived Discovery'
          description: >-
            PRISM metabolomics platform identifies bioactive molecules from plant extracts 4x faster than industry
            standard.
          touchpoints:
            - Mass spectrometry metabolomics scanning
            - Computational chemical structure prediction
            - Benchling AI non-clinical report drafting
        - label: 'Stage 2: Preclinical Optimization & Dossier Filing'
          description: Candidate adaptation using modern medicinal chemistry and IND regulatory submission.
          touchpoints:
            - Medicinal chemistry optimization
            - Toxicology safety studies
            - FDA IND clearance filing
        - label: 'Stage 3: Clinical Proof-of-Concept'
          description: Phase 1 safety trials and Phase 2a efficacy studies across atopic dermatitis and asthma populations.
          touchpoints:
            - Healthy subject Phase 1 safety dossiers
            - Scientific advisory board protocol design
            - Patient clinical trial outcome readouts
        - label: 'Stage 4: Strategic Biopharma Out-Licensing'
          description: Commercial partnership agreements with global pharmaceutical enterprises for late-stage development.
          touchpoints:
            - Confidential data room due diligence
            - Strategic partnership milestone structuring
            - Co-development and commercial rights allocation
        - label: 'Stage 5: Regulatory Approval & Commercial Labeling'
          description: Phase 3 registrational studies and FDA/EMA marketing authorization.
          touchpoints:
            - Pivotal trial data readouts
            - NDA submission and priority review
            - Commercial product label finalization
        - label: 'Stage 6: Payer Reimbursement & Prescribing'
          description: Healthcare payers grant formulary access for oral therapy; physicians prescribe to diagnosed patients.
          touchpoints:
            - Health economic outcome presentations
            - PBM formulary tier placement negotiations
            - Patient oral daily dosing and persistence
    approximationNotes: >-
      Illustrates the commercialization sequence required for clinical-stage biotechnology therapeutics to reach
      end-market realization.
