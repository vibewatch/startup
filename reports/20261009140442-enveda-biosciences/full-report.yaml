      - number: '4.3'
        title: Capital Adequacy and Financing Dependence
        blocks:
          - type: paragraph
            body: >-
              The strongest public financial fact is the September 2026 financing: Enveda announced a $311 million
              Series E and said cumulative capital raised exceeded $845 million. The Wall Street Journal reported a
              valuation of about $2 billion, while Forge displays a $1.83 billion post-money valuation and $807.14
