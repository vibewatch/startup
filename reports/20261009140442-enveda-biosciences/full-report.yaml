chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Footprint, and Discovery Architecture
        blocks:
          - type: paragraph
            body: >-
              Enveda Biosciences, Inc. is a clinical-stage biotechnology company founded in 2019 by Chief Executive
              Officer Viswa Colluru, Ph.D., and scientific co-founder Pieter Dorrestein, Ph.D. of the University of
              California San Diego [CO001]. The company operates from primary corporate and laboratory headquarters in
              Boulder, Colorado, complemented by a discovery and development subsidiary, Enveda Therapeutics India
              Private Limited, located in Hyderabad, Telangana, India [CO002, CO008]. Enveda's operating architecture
              centers on PRISM, a proprietary computational metabolomics and machine-learning platform designed to
              identify, characterize, and isolate biologically active small molecules from complex natural mixtures
              [CO004]. By analyzing natural chemical biodiversity using high-resolution mass spectrometry and
              machine-learning models, Enveda bypasses traditional natural product purification bottlenecks to translate
              evolutionary chemistry into drug-like oral small molecules [CO003]. The company targets major inflammatory
              and metabolic disorders, pursuing a wholly owned pipeline strategy rather than early-stage discovery
              out-licensing partnerships [CO006, CO009].
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO006
