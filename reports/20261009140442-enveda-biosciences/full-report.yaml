        title: Exhibits
        blocks:
          - type: callout
            title: Substantial Growth Capital Base and High-Caliber Clinical Governance
            body: >-
              Enveda's successful close of a $311M Series E round in September 2026 brings its total capital raised to
              over $845M, providing a multi-year cash cushion to advance three clinical programs [CO005]. The addition
              of former Pfizer R&D chief Dr. Mikael Dolsten and Catalio's George Petrocheilos to the board significantly
              enhances clinical execution and late-stage trial governance [CO007, CO008].
            calloutType: strength
