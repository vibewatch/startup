  - id: FO001
    title: Enveda Biosciences Key Corporate and Clinical Milestone Trajectory
    type: timeline
    summary: >-
      Chronological progression of Enveda from 2019 founding through major financing rounds, clinical advancements, and
      board appointments through late 2026.
    data:
      items:
        - label: Company Founded
          date: '2019-12-01'
          detail: >-
            Enveda Biosciences founded in Boulder, Colorado by Viswa Colluru and Pieter Dorrestein to apply machine
            learning to natural product chemistry.
          tone: positive
        - label: Series Seed Financing
          date: '2020-12-27'
          detail: >-
            Secured $4.1M seed funding led by True Ventures and Wireframe Ventures to build initial metabolomics
            platform.
          tone: positive
        - label: Series A Financing
          date: '2021-06-22'
          detail: Closed $30.2M Series A financing to construct automated Boulder laboratory and expand computational team.
          tone: positive
        - label: Series B Financing
          date: '2023-04-20'
          detail: >-
            Raised $95.3M across Series B tranches led by Dimension Capital and FPV Ventures to accelerate lead
            discovery.
          tone: positive
        - label: Series C Financing & Clinical Entry
          date: '2024-11-21'
          detail: Secured $130M Series C led by Kinnevik and FPV; advanced lead asset ENV-294 into Phase 1 clinical testing.
          tone: positive
        - label: Sanofi Strategic Expansion
          date: '2025-02-27'
          detail: >-
            Expanded Series C to $150M with strategic investment from Sanofi to advance AI-discovered natural small
            molecules.
          tone: positive
        - label: Series D & Unicorn Status
          date: '2025-09-04'
