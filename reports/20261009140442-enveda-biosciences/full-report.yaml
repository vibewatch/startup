    title: Investment Thesis vs Anti-Thesis Comparison
    columns:
      - Pillar / Dimension
      - Investment Thesis Argument
      - Anti-Thesis Counter-Argument
      - Pivotal Diligence Trigger
    rows:
      - - Platform Technology
        - PRISM maps uncharted natural chemistry to identify bioactive small molecules 4X faster
        - Computational metabolomics hit generation has not yet yielded an approved commercial medicine
        - Phase 2a biomarker and clinical response rates demonstrating novel mechanism of action
      - - Pipeline Diversity
        - Three clinical assets across 4 indications; ENV-294 serves as a pipeline-in-a-product
        - High correlation in pipeline targets; failure in lead immunology target derails company value
        - Independent clinical proof-of-concept in secondary indication (asthma or metabolic)
      - - Commercial Partnerships
        - Wholly owned rights retain 100% of commercial downstream economics and licensing leverage
        - Absence of clinical pharma partnerships leaves Enveda exposed to 100% of R&D burn
        - Execution of co-development or regional licensing deal with upfront cash over $100M
      - - Capital & Syndication
        - Tier-1 syndicate (Catalio, Premji, Kinnevik, FPV, Surveyor, T. Rowe) provides deep pockets
        - Rapid capital consumption ($828M+ raised) creates severe liquidation preference overhang
        - Cap table disclosure showing common stock dilution and senior preference seniority
    notes: Pillars contrast company value propositions against verified structural risks and independent industry commentary.
