      - number: '1.2'
        title: Financing History, Cap Table Evolution, and Valuation Trajectory
        blocks:
          - type: paragraph
            body: >-
              Enveda has raised more than $845 million in cumulative equity capital across seed through Series E
              financing rounds since its incorporation [CO005]. Following an initial $4.1M seed round in 2020 and a
              $30.2M Series A in June 2021, the company closed successive Series B tranches totaling approximately
              $95.3M between December 2022 and April 2023, followed by a Series B+ extension in 2024 [CO005, CO012]. In
              February 2025, Enveda expanded its Series C financing to $150M with strategic participation from Sanofi
              alongside institutional lead investors Kinnevik and FPV Ventures [CO007, CO010]. In September 2025, Enveda
              closed a $150M Series D led by Premji Invest at a reported $1.0B post-money valuation, marking its
              transition to unicorn status [CO007, CO012]. Most recently, on September 23, 2026, Enveda announced a $311
              million Series E financing led by Catalio Capital Management, which established an estimated $1.83B
              post-money valuation [CO005, CO012]. However, independent market commentators note that Enveda has
              maintained an entirely wholly owned pipeline without signed commercial pharmaceutical partnerships,
              heightening future financing dependency and binary trial risk [CO006, CO011].
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO010
              - CO011
              - CO012
