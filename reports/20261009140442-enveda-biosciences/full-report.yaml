      - number: '1.3'
        title: Executive Leadership, Governance Structure, and Clinical Transition
        blocks:
          - type: paragraph
            body: >-
              Enveda is led by founder and CEO Viswa Colluru, Ph.D., supported by a specialized senior management team
              that includes Chief Scientific Officer Hannah Gordon, Chief Development Officer Niranjan Rao, Chief
              Financial Officer Jason Kim, Chief Technology Officer August Allen, and Chief Strategy Officer Inhwan Kim
              [CO001, CO008]. To support the operational transition from preclinical discovery to mid-stage clinical
              trials, the company recruited experienced pharmaceutical development executives, including Nadeem Sarwar,
              Ph.D. from Novo Nordisk as Global Head of Metabolic Strategy, Michael Charlton, M.D. from Madrigal
              Pharmaceuticals, and Doug Maslin from LEO Pharma [CO008]. Enveda's Board of Directors pairs institutional
              investors from Catalio Capital Management, Premji Invest, Kinnevik, FPV Ventures, True Ventures, and
              Dimension Capital with independent directors Dr. Mikael Dolsten, former Chief Scientific Officer and
              President of Worldwide R&D at Pfizer, and Simba Gill [CO007, CO008]. The company maintains significant
              dependence on Dr. Colluru's strategic direction, while governance oversight is substantially shaped by its
              venture syndicate [CO001, CO008].
