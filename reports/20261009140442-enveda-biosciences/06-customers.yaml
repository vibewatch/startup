callouts:
  - calloutType: "risk"
    title: "Commercial Customer Concentration and Binary Readout Exposure"
    body: "Enveda's lack of commercial pharmaceutical licensing agreements means the company generates zero recurring customer revenues, creating complete dependence on venture capital funding and binary Phase 2 trial readouts. If ENV-294 fails to establish clinical differentiation against established therapies, commercial out-licensing value could decline precipitously."
    claimRefs:
      - "CU001"
      - "CU015"
      - "CU016"
  - calloutType: "insight"
    title: "Oral Delivery as the Primary Commercial Value Lever"
    body: "In major inflammatory indications such as atopic dermatitis and asthma, patient adoption of injectable biologics is hindered by administration friction, while existing oral options face toxicological black-box warnings. Demonstrating oral efficacy with benign safety represents Enveda's critical competitive advantage for prospective biopharma acquirers."
    claimRefs:
      - "CU004"
      - "CU013"
      - "CU014"
