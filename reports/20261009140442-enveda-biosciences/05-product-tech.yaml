  - id: TE002
    title: Workflow / use-case table
    columns:
      - User Job / Workflow Step
      - Traditional Industry Workflow
      - Enveda PRISM Platform Solution
      - Measurable Benefit / Stated Advantage
      - Limitation & Technical Constraint
    rows:
      - - Sample Sourcing & Extraction
        - Unstructured botanical gathering and crude organic solvent extraction
        - Systematized global botanical library profiling with standardized extraction protocols
        - Broadened access to uncharacterized plant secondary metabolomes
        - Logistical, customs, and biodiversity treaty compliance barriers
      - - Molecule Identification
        - Laborious bioassay-guided physical isolation taking months to years
        - Tandem mass spectrometry coupled with machine learning spectral annotation
        - Rapid structure deconvolution directly from complex chemical mixtures
        - Spectral resolution limits for stereoisomers and isobaric molecules
      - - Target & Activity Screening
        - High-throughput empirical phenotypic screening of isolated fractions
        - Knowledge graph mapping and predictive bioactivity neural network modeling
        - High hit rate enrichment and reduced physical compound screening volume
        - In silico predictive false positives requiring wet-lab validation
      - - Lead Optimization
        - Synthesis of thousands of structural analogs over 3-5 years
        - Computational scaffolding prioritizing evolutionarily pre-optimized nature hits
        - Company-claimed 75% fewer analogs to candidate and 4X faster cycle
        - Footnoted company operational estimates lacking independent audit
      - - Candidate Selection
        - High attrition due to unexpected off-target toxicity and poor ADME
        - Multi-parameter optimization integrating oral bioavailability filters
        - 11-fold claimed improvement in scaffold success rate to development candidate
        - Real-world translation unproven beyond early Phase 2a readouts
    notes: Comparative workflow analysis based on company disclosures, Pharma Letter industry evaluations, and biopharma operational standards.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE014
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / Component
      - Role & Functional Scope
      - Operational Dependency
      - Primary Diligence & Execution Risk
    rows:
      - - Natural Extract Repository
        - Botanical specimen storage and chemical extract library generation
        - International supply chains and biodiversity treaty governance
        - Geopolitical and regulatory import/export permitting delays
      - - Tandem Mass Spectrometry
        - High-resolution fragmentation spectrometry of complex chemical mixtures
        - Specialized analytical laboratory hardware and vendor instrumentation
        - High capital expenditure and instrument downtime or calibration drift
      - - Machine Learning In Silico Core
        - Neural network spectral decoding, structure elucidation, and property modeling
        - Proprietary training datasets, computational cluster infrastructure
        - Model hallucination or misprediction on novel chemical classes
      - - Knowledge Graph Engine
        - Semantic integration of ethnomedical literature, taxonomy, and biological activity
        - Curated pharmacological databases and published biological records
        - Incomplete or unstandardized historical literature annotations
      - - Medicinal Chemistry & ADME
        - Synthetic validation, oral formulation optimization, and pharmacokinetic profiling
        - Synthetic organic chemistry capacity across US and India operations
        - Complex natural product scaffold re-synthesis bottlenecks
      - - India Operations Subsidiary
        - High-throughput procurement, ERP-managed inventory, and research operations in Hyderabad
        - Cross-border coordination, Indian regulatory and customs clearances
        - Operational friction and international intellectual property transfer controls
    notes: Evaluates technology, infrastructure, and organizational dependencies across Enveda US and India operating entities.
    claimRefs:
      - CE001
      - CE003
      - CE011
      - CE012
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Multi-layered functional architecture of Enveda PRISM discovery engine and clinical translation pipeline.
    data:
      layers:
        - label: 'Layer 1: Natural Sample Acquisition & Extract Library'
          detail: Physical acquisition of diverse botanical specimens, standardized organic extraction, and high-throughput micro-fractionation.
          modules:
            - Global Sourcing & Herbarium Accessioning
            - Automated Chemical Extraction Facility
            - Standardized Extract Micro-Plate Arraying
        - label: 'Layer 2: Analytical Metabolomics & Mass Spectrometry'
          detail: Instrumentation layer performing high-resolution tandem mass spectrometry (MS/MS) on unpurified chemical mixtures.
          modules:
            - High-Resolution Orbitrap MS/MS Arrays
            - Chromatographic Separation & Retention Profiling
            - Fragmentation Pattern Digital Capture
        - label: 'Layer 3: Machine Learning & Computational Chemistry Core'
          detail: Algorithmic engine translating raw spectral fragmentation data into putative molecular structures and bioactivity predictions.
          modules:
            - In Silico Molecular Structure Identification
            - Knowledge Graph Biological Mapping
            - Predictive Efficacy & Toxicity Neural Networks
        - label: 'Layer 4: Medicinal Chemistry & Candidate Optimization'
          detail: Wet-lab synthetic validation and iterative chemical refinement to optimize oral bioavailability and pharmacokinetics.
          modules:
            - Synthetic Route Design & Scaffold Resynthesis
            - In Vitro / In Vivo ADMET Profiling
            - Oral Solid Formulation Development
        - label: 'Layer 5: Clinical Pipeline & Translational Development'
          detail: Human clinical trial execution across therapeutic areas, led by internal development teams without pharma out-licensing.
          modules:
            - ENV-294 Phase 2a Atopic Dermatitis & Asthma
            - ENV-308 Phase 1 Metabolic Health / Weight Maintenance
            - ENV-6946 & Preclinical IND-Enabling Programs
        - label: 'Layer 6: Operational Infrastructure & Global Supply'
          detail: Distributed operational platform spanning Boulder headquarters and Enveda Therapeutics India in Hyderabad for laboratory procurement and customs logistics.
          modules:
            - Boulder Core Laboratories
            - Hyderabad Operations & Supply Chain Center
            - ERP Procurement & Inventory System
    approximationNotes: Represents Enveda conceptual platform stack derived from company descriptions, patent disclosures, and industry reporting.
