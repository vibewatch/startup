callouts:
  - calloutType: insight
    title: Platform Scalability vs. Clinical Asset Commercialization
    body: Enveda has demonstrated that its PRISM platform can generate human-active clinical compounds at an accelerated pace, delivering two positive clinical readouts in 2026. However, by eschewing early pharmaceutical licensing partnerships, the company shoulders the full clinical, regulatory, and capital burden of advancing multiple oral therapeutics simultaneously.
    claimRefs:
      - CE005
      - CE007
      - CE015
  - calloutType: risk
    title: Unverified Efficiency Metrics & Binary Clinical Phase 2 Readouts
    body: Enveda public claims of 4X faster development, 75% fewer analogs, and 11-fold higher scaffold success rates represent self-reported operational benchmarks that have not undergone independent peer audit. With lead asset ENV-294 currently in Phase 2a trials, platform validation remains fundamentally tethered to clinical proof-of-concept against established biologics.
    claimRefs:
      - CE006
      - CE014
      - CE016
