  topStrengths:
    - >-
      Strategic backing from Changan, Huawei, and CATL gives Avatr unusual access to manufacturing scale,
      intelligent-driving software, and battery technology for a private EV company.
    - >-
      IPO-era disclosures show real operating scale rather than a concept story, including RMB 15.2 billion of 2024
      revenue, positive H1 2025 gross margin, and more than 120,000 reported FY2025 sales.
    - >-
      The product portfolio spans multiple premium EV form factors with visible export ambitions and a large domestic
      retail footprint.
  topRisks:
    - >-
      Demand durability is unproven after Q1 2026 weakness, while the premium China EV segment remains extremely
      competitive and promotion-heavy.
    - >-
      Avatr's technology proposition and service strategy are deeply dependent on Huawei and CATL, limiting independent
      control over core differentiation.
    - >-
      Public evidence still does not disclose cash runway, liquidation preferences, realized model economics, or the
      terms impact of the RMB 11.5 billion Yinwang investment.
    - >-
      The Hong Kong IPO process lapsed once already, so any future listing could require fresher disclosures or a lower
      valuation anchor.
  unresolvedGaps:
    - Audited FY2025 and FY2026 financial statements, including cash, debt, burn, and runway.
    - Full cap table and preference stack after Series C and the Yinwang stake purchase.
    - Monthly 2026 sell-through, cancellation, and inventory data by model and channel.
    - Realized ASP, discounting, and gross-margin bridge by model rather than portfolio averages.
    - Cohort retention, repeat purchase, and export-market conversion data.
