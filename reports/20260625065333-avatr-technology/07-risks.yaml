- id: operational-and-partner-dependency-risk
  title: Operational and Partner Dependency Risk
  body: 'Operationally, Avatr sits in the uncomfortable middle of the China EV stack: premium enough to require flawless smart-cockpit, ADAS, service, and brand execution, but not yet large enough to absorb persistent market discounting, support costs, or repeated integration mistakes. The product and technology pages show a connected, OTA-driven vehicle architecture integrated with Huawei operating systems, while the CATL and Avatr materials point to battery and software dependence that is difficult to substitute quickly. Changan''s answer to the sales slump is backend integration with Deepal across R&D, supply chain, and manufacturing, which may improve cost control but also raises execution risk if shared functions optimise for Deepal''s scale rather than Avatr''s premium consistency. In this setting, a software release delay, a battery allocation issue, a regulatory-quality event, or a cyber/control failure would not stay inside engineering; it would immediately hit customer experience,
    channel credibility, and the already fragile financing narrative. The dependency map therefore treats Huawei, CATL, and Changan as single-point multipliers rather than ordinary vendors.'
