  evidenceGaps:
  - type: missing-source
    severity: material
    topic: avatr-recall-history
    missingEvidence: Named Avatr recall notices, SAMR defect announcements, or official service bulletins tied to Avatr VINs or model programs.
    whyItMatters: A clean public recall record would materially lower safety risk, while an undisclosed recall history would raise brand, warranty, and regulatory exposure.
    diligencePath: Query SAMR recall databases directly in Chinese, request VIN-level campaign history from Avatr, and compare with dealer service records.
    relatedQuestionRefs:
    - QR011
    relatedTableRefs:
    - TR001
    - TR002
  - type: private-evidence-only
    severity: blocking
    topic: supplier-concentration
    missingEvidence: BOM-level share of Huawei and CATL modules, substitution options, and contingency contracts for software, chips, and battery packs.
    whyItMatters: Without true concentration and fallback data, partner dependency severity cannot be bounded with confidence.
    diligencePath: Request current sourcing map, critical-component single-source list, and contingency procurement playbook from management.
    relatedQuestionRefs:
    - QR017
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current cash balance, monthly burn, covenant or sponsor support, and runway under no-IPO and delayed-IPO scenarios.
    whyItMatters: Financing risk cannot be underwritten properly when the IPO has lapsed and public liquidity disclosure is absent.
    diligencePath: Request latest management accounts, cash waterfall, financing plan, and board-approved downside runway case.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR004
    - TR005
  - type: missing-source
    severity: material
    topic: litigation-and-ip
    missingEvidence: Named court dockets, arbitration records, patent oppositions, or infringement claims involving Avatr, Changan, Huawei, or CATL specific to Avatr products.
    whyItMatters: The sampled open web does not prove absence of disputes, and any active case could change legal reserves, launch timing, or licensing terms.
    diligencePath: Run court, patent, and arbitration searches in Chinese and English and ask counsel for a current litigation schedule.
    relatedQuestionRefs:
    - QR032
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: cyber-resilience
    missingEvidence: OTA rollback procedures, penetration-test results, incident metrics, third-party cyber audits, and privacy complaint data.
    whyItMatters: Connected premium vehicles can convert software defects into safety, privacy, and reputational loss far faster than conventional car programs.
    diligencePath: Request security architecture review, OTA governance process, incident runbook, and the last two external audit reports.
    relatedQuestionRefs:
    - QR031
    relatedTableRefs:
    - TR002
    - TR005
