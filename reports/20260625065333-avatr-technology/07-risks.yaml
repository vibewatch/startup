- id: TR005
  title: Mitigation and Kill Criteria
  layout: wide
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - IPO / capital access
    - HKEX refile progress
    - No refile or no visible sponsor-update path by late 2026
    - Assume higher dilution or delayed liquidity; underwriting should pause
  - - Demand weakness
    - Quarterly deliveries
    - Another quarter near or below the 11,703-unit Q1 2026 level, or sustained YoY decline
    - Treat turnaround as unproven and move to downside case
  - - Price-war margin risk
    - Discount intensity / financing subsidies
    - Renewed deep discounting or forced zero-interest financing to move volume
    - Stress margin, working capital, and brand health simultaneously
  - - Huawei dependency
    - Sanctions / release / compatibility event
    - New official restriction, delayed Huawei stack release, or OTA interruption affecting Avatr models
    - Escalate dependency review and downgrade launch assumptions
  - - CATL dependency
    - Supply / geopolitical signal
    - Battery allocation issue, public adverse policy signal, or roadmap slippage tied to CATL
    - Rework production and export scenarios; test alternative battery path
  - - Regulatory / safety event
    - Recall, OTA freeze, or data-security enforcement
    - Any formal recall, regulator notice, or public privacy incident involving Avatr smart systems
    - Stop treating compliance as background risk; require remediation evidence before proceeding
  - - Brand dilution from integration
    - Shared-backend execution
    - Evidence that Avatr product cadence or premium autonomy is subordinated to Deepal scale targets
    - Reduce premium-brand terminal assumptions and reassess valuation discipline
  notes: Kill criteria are intentionally monitorable and designed for investors who need fast thesis updates rather than static risk labels.
