- id: mitigations-and-kill-criteria
  title: Mitigations and Kill Criteria
  body: 'Avatr''s mitigation path exists, but it is narrow and monitorable. The company can partially de-risk financing by refiling the Hong Kong prospectus quickly and pairing that with clearer disclosure on cash runway, while operationally it can use the Deepal integration to take out costs without diluting the premium brand. On regulation and quality, the minimum viable mitigation is disciplined OTA governance, test coverage, and data-compliance controls that satisfy the stronger MIIT/SAMR regime before a defect becomes a recall. On partner concentration, management needs credible contingency planning for Huawei software cadence and CATL battery access, not just marketing alignment. For investors, thesis-break triggers should be simple: no timely IPO refile or alternative capital path, another sustained delivery slump, a material recall/data incident, or evidence that backend integration is solving costs by compromising premium autonomy. The unresolved asks are likewise concrete: BOM-level
    supplier concentration, cash runway, public recall history, named litigation, and cyber-resilience procedures are still missing from open materials and should be treated as diligence requirements rather than optional polish.'
