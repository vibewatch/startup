- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Supportive evidence
  - Counterpoint / anti-thesis
  - What would change the view
  rows:
  - - Market
    - China remains the world's largest EV market and BNEF still sees 2026 EV growth led by China.
    - S&P, Wood Mackenzie, EIU, and Frost all describe fading incentives, weaker demand, and margin pressure in 2026.
    - Evidence of share gains without subsidy dependence would strengthen the thesis.
  - - Product
    - Avatr has a visible premium portfolio across the 06/07/11/12 family.
    - Premium EV competition is dense, and Q1 2026 showed weak conversion from visibility to durable sales.
    - Model-level sell-through and realized ASP by trim would clarify product-market fit.
  - - Customers
    - Brand and partner positioning help Avatr address higher-income buyers.
    - Public sources do not show cohort retention, order backlog quality, or export sell-through.
    - Monthly model/channel sell-through and cancellations would improve customer confidence.
  - - Financials
    - H1 2025 revenue and gross margin improvement show operating proof.
    - Cash runway, full-year audited profitability path, and service monetization remain opaque.
    - Audited FY2025/FY2026 statements plus a margin bridge could move the call toward track.
  - - Competition
    - Strategic backers provide manufacturing, software, and battery leverage.
    - Listed peers already offer more disclosure and public liquidity at compressed sector multiples.
    - A lower entry price or stronger disclosure could offset peer-comparison weakness.
  - - Risk
    - Backend integration could lower costs and improve leverage.
    - The same integration could also signal weaker standalone economics or brand independence.
    - Proof that cost-sharing lifts margin without damaging brand autonomy would reduce risk.
  notes: Cells summarize the strongest support and rebuttal by lens; the table is interpretive rather than a raw factual snapshot.
