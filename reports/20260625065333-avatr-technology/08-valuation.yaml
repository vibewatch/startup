- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Audited financial package
    - FY2025 and latest FY2026 revenue, gross margin, operating loss, cash, and debt statements.
    - Without audited numbers, the IPO story is still more narrative than underwriteable.
    - Management / bankers; request audited statements and management discussion bridge.
  - - Cap table and preference stack
    - Liquidation preference, anti-dilution, dividend, and conversion terms for every preferred class.
    - These terms decide whether the headline RMB 30B mark is economically real for new money.
    - Counsel / finance team; obtain shareholder agreement and cap-table waterfall.
  - - Sell-through by model and channel
    - Monthly retail and wholesale volume, backlog, cancellations, incentives, and export mix.
    - This separates a temporary Q1 dip from a deeper demand or channel problem.
    - Sales ops; request dealer, DTC, and export reporting by model.
  - - Yinwang and partner economics
    - Commercial terms linking Huawei, CATL, Changan, and the RMB 11.5B Yinwang stake.
    - Partner leverage is central to moat and margin, but economics are not public.
    - Strategy / legal; review cooperation agreements and transfer-pricing logic.
  - - Software / service monetization
    - Attach rates, subscriptions, OTA revenue, and service gross margin.
    - A software-adjacent valuation needs evidence that revenue can diversify beyond one-time vehicle sales.
    - Product finance; request cohort and monetization data by feature.
  - - IPO readiness package
    - Refiling timeline, sponsor feedback, unresolved regulator comments, and use of proceeds.
    - Exit timing determines hold period and the probability of clearing the last round valuation.
    - Bankers / legal; request latest listing timetable and comment log.
  notes: Every ask is chosen because resolving it could materially change the recommendation, confidence, or valuation stance.
