- id: valuation-context-and-financing
  title: Valuation context and financing discipline
  body: 'The core valuation problem is that Avatr has enough disclosed operating scale to invite comp-based underwriting, but not enough disclosure to justify a high-conviction private mark. Series C brought in more than RMB 11 billion and left Changan as the 40.99% holder, with CATL at 14.1%, while independent reporting said the round pushed valuation from roughly RMB 14.1 billion to around RMB 30 billion. That valuation can be framed as roughly 1.5x-2.0x 2027 revenue only if Avatr reaches about RMB 15 billion to RMB 20 billion in revenue over the next cycle. Units math makes that possible, but not safe: 50,000 to 60,000 annual vehicles at a RMB 250,000 to RMB 300,000 price band imply only about RMB 12.5 billion to RMB 18.0 billion of revenue power before mix, discounts, and services.


    Entry discipline therefore matters more than company quality rhetoric. Hong Kong remains a plausible exit venue, but the company has not yet demonstrated the listed-peer disclosure cadence that NIO and Zeekr already provide. At the same time, China''s EV market backdrop is less forgiving than the 2021-2022 expansion era. S&P, Wood Mackenzie, EIU, and Frost all describe a 2026 market with fading incentives, weaker demand, and thinner profitability for anything short of scaled winners. In that setting, a RMB 30 billion carry can still clear if Avatr reopens the IPO window with audited numbers and recovering volume, but the public evidence today points to a narrower base-case range and a real bear-case discount if the IPO slips again or integration with Deepal signals weaker standalone economics.'
