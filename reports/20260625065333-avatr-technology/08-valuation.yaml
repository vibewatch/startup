- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Public value / status
  - Scale signal
  - Relevance to Avatr
  - Limitation
  rows:
  - - NIO
    - US$12.27B market cap (Jun 2026)
    - Q1 2026 revenue RMB 25.5B; 83,465 Q1 deliveries disclosed publicly.
    - Shows what public investors pay for a disclosed premium EV platform with quarterly reporting.
    - Still loss-making and structurally different in brand mix and battery-swap strategy.
  - - Li Auto
    - US$12.43B market cap (Jun 2026)
    - Large listed Chinese EV with prior peak market cap above US$32B.
    - Useful for seeing how far public multiples compressed even for scaled domestic EV names.
    - Business mix and profitability profile differ from Avatr's thinner public record.
  - - XPeng
    - US$11.92B market cap (Jun 2026)
    - Public market cap fell sharply from 2021 highs despite scale.
    - Highlights that software-forward branding does not prevent multiple compression.
    - Different model cadence and autonomous-driving monetization path.
  - - Zeekr
    - US$6.84B market cap (Jun 2026); 222,123 deliveries in 2024
    - Nearest premium Chinese EV peer with disclosed delivery scale.
    - Relevant premium-brand comparator for delivery scale versus market value.
    - Part of a larger Geely ecosystem and already public, so governance and funding context differ.
  - - BYD
    - US$110.08B market cap (Jun 2026)
    - Scaled leader with far broader vertical integration and volume.
    - Provides the ceiling case for what true scale and integration can command.
    - Too large and diversified to serve as a direct valuation comp for Avatr.
  notes: This is a sample comparator set centered on public market snapshots and one disclosed premium-peer results release; values are point-in-time markers, not target prices.
