- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Volume recovery fails
    - Monthly sales remain below roughly 5k-7k through Q3 2026.
    - Bull case loses its operating-scale bridge and base case drifts toward bear.
    - Re-mark to the low end of the base range or suspend entry work.
  - - IPO window slips again
    - No credible Hong Kong refiling path before 2027 or clear need for a discounted deal.
    - Exit optionality weakens and last-round price support erodes.
    - Assume longer hold and lower public-clearing valuation.
  - - Integration overrides independence
    - Deepal/Changan backend sharing starts to affect brand, pricing, or channel autonomy.
    - Premium differentiation and standalone strategic value weaken.
    - Treat Avatr more like a business unit than a premium standalone equity story.
  - - Partner leverage becomes dependency drag
    - Huawei, CATL, or Changan terms constrain pricing or software economics.
    - Moat narrative flips from leverage to dependency.
    - Demand commercial-agreement detail before advancing.
  - - Disclosure still opaque after new financing work
    - Audited financials, cash runway, or preference terms remain unavailable.
    - Confidence cannot improve enough to justify underwriting.
    - Keep recommendation at research-more regardless of narrative progress.
  notes: Thresholds are monitoring triggers, not hard forecasts; each one maps directly to a thesis transmission channel relevant for IC decisions.
