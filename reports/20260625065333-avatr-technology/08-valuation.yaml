- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Evidence anchor
  - Investment implication
  rows:
  - - Recommendation
    - research-more
    - Public evidence supports strategic relevance but not a price-ready underwriting case.
    - Do not force a buy/avoid call before audited numbers and cap-table terms are available.
  - - Confidence
    - Low
    - Key valuation inputs remain undisclosed or only partially visible in public materials.
    - Treat scenario ranges as discipline tools, not precision.
  - - Risk rating
    - High
    - Q1 2026 volume weakness, partner dependence, and IPO timing risk all remain elevated.
    - Require frequent milestone checks and a wider margin of safety.
  - - Valuation stance
    - Stretched
    - ~RMB 30B private mark still assumes a recovery path not yet proven in 2026 public data.
    - Prefer a lower entry price or new evidence before underwriting the last round mark.
  - - Preferred action
    - Wait for evidence or discount
    - Public markets already offer more transparent Chinese EV exposure.
    - Hold dry powder until either price resets or disclosure improves.
  - - Return / hold / exit framing
    - Target 2x+ only if entry falls into the RMB 15B-RMB 20B range or bull milestones are met
    - Current price offers limited upside unless Avatr restores scale and reopens the IPO path.
    - Underwrite on exitability, not brand halo.
  notes: This table converts disclosed evidence into an IC stance; return framing is scenario-based because cash runway and preference terms remain undisclosed.
