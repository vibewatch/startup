company:
  name: Avatr Technology
chapter:
  number: 8
  title: Valuation
  summary: 'Avatr merits a research-more recommendation with low confidence: the business has strategic backers, improving disclosed gross margin, and a premium brand narrative, but the last private mark of roughly RMB 30 billion still looks stretched against thin public disclosure, a lapsed Hong Kong IPO, weak Q1 2026 sales, and compressed public Chinese EV multiples. Bull-case support exists only if deliveries recover toward six-figure annual scale and audited financials reopen the IPO window; base and bear outcomes point to a lower mark-to-market range and possible strategic absorption risk.'
sections:
- id: investment-thesis-and-recommendation
  title: Investment thesis and recommendation
  body: 'Avatr is easier to like as an industrial project than to underwrite as a clean-priced equity entry. The positive case is real: Changan, Huawei, and CATL give the company unusual manufacturing, software, and battery leverage; the November 2025 prospectus finally surfaced meaningful scale with RMB 12.2 billion of H1 2025 revenue and a gross-margin improvement to 10.1%; and the brand still holds premium positioning across the 06, 07, 11, and 12 model family. Those facts support a live, not hypothetical, commercialization story. They also mean Avatr is not a seed-stage concept business; it is already operating at a scale where margin and channel execution should begin to matter more than pure narrative.


    The anti-thesis is stronger for price discipline. The last widely cited private mark of roughly RMB 30 billion was set before the IPO lapsed and before the sharp 2026 slowdown became obvious. Autonewgen''s adverse review argued that Avatr''s Hong Kong IPO story ran ahead of its sales, while CarNewsChina reported Q1 2026 wholesale volume of only 11,392 units and a parallel Changan plan to fuse Avatr and Deepal mid-to-back-end operations. Public evidence also does not disclose cash runway, liquidation preferences, realized ASP by model, or whether services can become material enough to support a software-like multiple. That combination supports a research-more call rather than a buy or avoid: the company may still earn back the round price, but current public evidence does not prove that outcome at attractive risk-adjusted odds.'
