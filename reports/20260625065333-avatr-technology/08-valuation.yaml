  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: preference-stack
    missingEvidence: Shareholder agreement terms covering liquidation preferences, anti-dilution, dividends, conversion, and any ratchets from the latest round.
    whyItMatters: Headline valuation is not economically equivalent to common-equity value if the preference stack is heavy or senior rights are unusual.
    diligencePath: Request the full cap table, term sheet, and signed shareholder agreements from finance counsel.
    relatedQuestionRefs:
    - QV027
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited FY2025 and latest FY2026 statements covering revenue, gross margin, operating loss, cash, debt, and working capital.
    whyItMatters: The recommendation can only improve meaningfully if investors can test whether margin progress and liquidity are durable.
    diligencePath: Obtain audited statements, management discussion, and bank covenant materials from management and IPO counsel.
    relatedQuestionRefs:
    - QV007
    - QV030
  - type: missing-source
    severity: material
    topic: exit-alternatives
    missingEvidence: Documented alternative exit paths or strategic transactions if the Hong Kong listing continues to slip.
    whyItMatters: Hold period and downside protection depend on whether investors have a credible path other than an eventual IPO.
    diligencePath: Request board materials and banker memos describing exit options, timing, and probability.
    relatedQuestionRefs:
    - QV028
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-valuation-table sample scope
    missingEvidence: A broader set of private marks, secondary transactions, or additional public premium-EV comparables beyond the sampled list.
    whyItMatters: The current comp table is directionally useful, but wider coverage would tighten the base and bear range calibration.
    diligencePath: Expand the comp set with additional listed peers, private secondaries, and refreshed Hong Kong IPO filings during the next refresh.
    relatedTableRefs:
    - TV004
