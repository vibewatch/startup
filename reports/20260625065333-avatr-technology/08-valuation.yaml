- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Core assumptions
  - Indicative valuation range (RMB B)
  - Probability signal
  - Downside / upside trigger
  rows:
  - - Bull
    - Deliveries recover toward 100k+ annualized, gross margin keeps improving, audited disclosure reopens HK IPO in a usable window.
    - 30-40
    - Requires sustained monthly sales recovery and evidence that partner leverage translates into better economics, not just visibility.
    - Upside if IPO refiling clears without a discount and services monetization starts to matter.
  - - Base
    - IPO slips but remains live, growth normalizes, disclosure improves only partially, and public comps stay compressed.
    - 20-25
    - 'Most consistent with today''s evidence: real scale, real brand, but incomplete proof and a weaker sector tape.'
    - Moves lower if recovery stalls or cap-table terms are unfriendly.
  - - Bear
    - Q1 2026 weakness persists, backend integration deepens, and investors treat Avatr as a strategically supported but subscale premium brand.
    - 8-15
    - Triggered by continued sub-5k monthly sales, delayed refiling, or evidence that standalone economics cannot clear public markets.
    - Could converge on a strategic reset, down round, or effective absorption into a broader Changan platform.
  - - No-decision discipline
    - If new audited evidence arrives but still leaves runway or preference terms unclear, keep the company in research-more status.
    - n/a
    - Applies when the company improves optics without solving underwriting blockers.
    - Do not stretch for precision without preference, dilution, and cash data.
  notes: Ranges are scenario estimates based on disclosed revenue anchors, public peer values, and 2026 China EV market conditions rather than on management guidance.
