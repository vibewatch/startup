  evidenceGaps:
  - type: missing-source
    severity: material
    topic: gross-margin
    missingEvidence: Gross margin by vehicle line and service bucket for 2024 and H1 2025 is absent from the approved public sources.
    whyItMatters: Without gross margin, investors cannot test whether premium list pricing actually covers manufacturing, battery, software, warranty, and channel costs.
    diligencePath: Request audited management accounts or the IPO working papers showing gross profit, gross margin, and model-level cost bridges.
    relatedQuestionRefs:
    - QI007
  - type: private-evidence-only
    severity: material
    topic: public-private-metric-gap
    missingEvidence: Public traction metrics exist, but private disclosure on cash, working capital, debt, realized pricing, and operating KPIs is incomplete.
    whyItMatters: This prevents a clean comparison between visible scale and the hidden metrics needed to underwrite earnings quality and liquidity.
    diligencePath: Request the board deck or data room KPI package that reconciles public revenue and delivery metrics to margin, liquidity, and capital-structure detail.
    relatedQuestionRefs:
    - QI012
  - type: missing-source
    severity: blocking
    topic: burn-rate
    missingEvidence: No approved source discloses Avatr's monthly cash burn, quarter-end cash balance, or runway assumption set.
    whyItMatters: The IPO timetable and breakeven condition cannot be judged rigorously without knowing how long current resources can fund losses and capex.
    diligencePath: Request monthly cash waterfall, quarter-end cash balances, committed capex, and downside runway scenarios through the intended listing date.
    relatedQuestionRefs:
    - QI014
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Per-vehicle BOM, manufacturing cost, dealer margin, warranty cost, software attach, and contribution margin are all undisclosed publicly.
    whyItMatters: A premium EV story cannot be underwritten on volume growth alone; per-unit economics determine whether growth compounds value or only consumes capital.
    diligencePath: Request model-level contribution-margin bridges, channel-margin schedules, warranty reserves, and software attach-rate cohorts from finance and sales operations.
    relatedQuestionRefs:
    - QI019
