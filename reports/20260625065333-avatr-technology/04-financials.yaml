- id: pricing-gtm-unit-economics
  title: Pricing, GTM Proxies, and Unit Economics
  body: 'Avatr''s public monetization model combines premium vehicle sales with a still-small layer of service and technology revenue. The Avatr 07 starts at RMB 249,900 and the Avatr 11 facelift starts at RMB 289,900, but public materials do not disclose realized transaction prices, option take rates, financing incentives, or software attach economics. What can be observed is that the company uses a partner-heavy operating model: Changan provides manufacturing and shared platform infrastructure, Huawei supports smart-cockpit and retail-service integration, and Avatr disclosed 55 channel partners across 25 countries by December 2024. Those facts provide a GTM-efficiency proxy even without CAC disclosure, because they imply Avatr has not built every retail and service capability from scratch. Even so, the most important unit-economics fields remain absent from public evidence. Gross margin, burn per delivered unit, CAC, payback, and working-capital intensity are not disclosed, so public analysis
    can only infer that capital efficiency depends heavily on partner leverage and scale, not on proven per-unit profitability.'
