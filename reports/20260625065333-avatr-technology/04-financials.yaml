company:
  name: Avatr Technology
chapter:
  number: 4
  title: Financial Overview
  summary: 'Avatr reached RMB 12.2 B in H1 2025 revenue (+98.5% YoY), confirming rapid growth, but still reports net losses and is pre-IPO. The revenue mix is almost entirely vehicle sales; services remain sub-6%. Capital intensity is extreme: RMB 11.5 B was invested in the Yinwang ADAS stake alone. Post-Series-C valuation exceeds RMB 30 B but the company must reach breakeven before the HKEX IPO can close. Q1 2026 deliveries fell 41.6% QoQ — a significant negative signal. Core gaps are gross margin, unit-level economics, and burn rate, all undisclosed.'
sections:
- id: revenue-streams-and-mix
  title: Revenue Streams and Mix
  body: 'Avatr''s financial disclosure remains limited, but the November 2025 Hong Kong prospectus finally establishes a usable top line for underwriting. H1 2025 revenue reached RMB 12.2 billion, up 98.5% year over year, with 56,729 vehicles delivered in the same period. The mix is still overwhelmingly hardware-led: RMB 11.5 billion came from vehicle sales, while only RMB 718 million came from services, technology, and after-sales. That means Avatr is not yet a software-like recurring-revenue story despite its Huawei-linked intelligent-driving positioning. Public price points for the Avatr 07 and Avatr 11 show the brand remains premium, but the implied H1 vehicle revenue per delivered unit sits below headline list prices, suggesting promotional pricing, product mix, taxes, or channel effects dilute realized revenue. The underwriting implication is straightforward: growth is real, but revenue quality is still dominated by one-time vehicle deliveries rather than sticky recurring monetization.'
