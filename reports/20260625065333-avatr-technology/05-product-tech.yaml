  - type: missing-source
    severity: material
    topic: Huawei ADS 4.0 L3 certification and cross-border data compliance
    missingEvidence: |-
      Official Chinese L3 certification letters for ADS 4.0; HarmonyOS cross-border data routing policies for Thailand, UAE, and Australia.
    whyItMatters: |-
      L3 certification is a regulatory gate for autonomous feature marketing in multiple geographies; data compliance gaps could block or delay European market entry.
    diligencePath: |-
      Review MIIT and CAC regulatory filings; request Huawei data-residency architecture from Avatr IR.
    relatedQuestionRefs:
    - QE011
    - QE013
    relatedTableRefs:
    - TE003
