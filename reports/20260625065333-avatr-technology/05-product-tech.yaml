callouts:
- calloutType: strength
  title: "Best tech signal: CATL Shenxing Pro + Huawei ADS 4.0 on the Avatr 07"
  body: |-
    The 07 platform combines the fastest production-charging battery available as of its launch with Huawei's most advanced consumer ADS tier, creating a package that independent reviewers consistently highlight as technically superior to pure-BEV competitors in the ¥250k–300k band.
  claimRefs:
