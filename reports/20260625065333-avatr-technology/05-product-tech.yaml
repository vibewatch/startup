  title: Product & Technology
  summary: |-
    Avatr's product-tech story rests on a genuinely differentiated CHN (Changan–Huawei–CATL) co-creation architecture that bundles 800V SiC power electronics, CATL Shenxing ultra-fast charging batteries, Huawei ADS 4.0 smart-driving, and HarmonyOS 5.0 cockpit into a coherent premium EV stack no single partner could assemble alone. The line spans six production models (11, 12, 07, 06, 06T, limited 011/012) across SUV, sedan, wagon, and EREV segments. Critical risks include deep Huawei technology dependency, the aerodynamics-integrity controversy on the 12, vehicle fire incidents, escalating 07 complaint volumes, and the pending renegotiation of CHN governance terms as Avatr moves toward an IPO.
sections:
- id: portfolio
  title: "Vehicle Lineup: Six Production Models Across SUV, Sedan, Wagon, and EREV"
  body: |-
    Avatr's commercial portfolio spans six production model families anchored by the three core Qiankun (CHN) tech-tier variants. The Avatr 11 is a mid-to-large SUV offering 720 km CLTC range on its dual-motor variant and a 580 kW combined output capable of a 3.6-second 0–100 km/h run; it launched in 2022 as the brand's debut vehicle and carries entry pricing from roughly ¥358,000. The Avatr 12 is a four-door fastback sedan with 700 km CLTC range, 0–100 in 3.4 seconds, HarmonyOS 4.0 cockpit, and Huawei ADS 3.0 smart-driving; it starts around ¥299,000 and added an updated HarmonyOS 5.0 variant in 2025. The Avatr 07 is the brand's highest-volume model, available in a pure-EV variant with an 82.16 kWh CATL Shenxing battery (650 km CLTC, 420 kW peak charge) and an EREV variant with a 52 kWh Freevoy battery system (333 km EV range, 1,200 km combined); both launched in late 2025. The Avatr 06 is a smaller four-door sedan from ¥229,000, while the 06T is a five-door wagon with a 741 km CLTC range claim and 955 hp tri-motor configuration from approximately ¥209,000 in China. Limited-edition 011 and 012 models with extreme performance specifications complete the lineup for collectible-tier buyers. Design direction is led by Munich-based CDO Nader Faghihzadeh, who spent 17 years at BMW before joining Avatr, and a Munich design center supplements the Chongqing engineering base. This product breadth distinguishes Avatr from single-segment Chinese premium EV peers but also demands premium component volumes that increase working capital intensity.
