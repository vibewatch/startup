- id: quality-risks
  title: Quality, Safety Incidents, and the Aerodynamics Integrity Controversy
  body: |-
    Avatr's product-tech story carries three documented quality risks that an investor must assess before attributing full premium credibility. First, vehicle fire incidents: at least three Avatr vehicles caught fire in 2025, attracting significant Chinese social-media scrutiny and drawing regulatory attention from SAMR (the State Administration for Market Regulation). Second, complaint volume: the Avatr 07 topped the national new-energy-vehicle complaint charts in September and October 2025, accumulating 268 documented complaints—the highest figure of any model in those months—with issues concentrated in software, braking, and build quality. Third, the aerodynamics-integrity controversy: in mid-2025, Elon Musk reshared a Chinese social-media video questioning whether the Avatr 12's claimed drag coefficient of 0.21 Cd was achievable given visible styling elements; the video raised concerns about measurement methodology. Avatr issued a technical rebuttal defending its Cd figure but did not publish third-party wind-tunnel certification, leaving the question partially open. Yuantrends analysis noted these incidents in the context of a broader quality perception challenge. Independent reviewer assessments from drive.com.au and Carscoops rated the Avatr 12 and 11 positively for build quality, interior materials, and technology integration, providing partial counterbalance to the complaint data. However, the concentration of complaints on the Avatr 07—the same model targeted for high-volume export—represents a diligence risk for the international expansion thesis. An adverse manufacturing quality signal from the highest-volume model at the start of its export ramp is materially relevant.
  claimRefs:
