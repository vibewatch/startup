  evidenceGaps:
  - type: missing-source
    severity: material
    topic: Shenxing Pro battery exclusivity and supply terms
    missingEvidence: |-
      Public CATL–Avatr battery supply agreement disclosing exclusivity period, pricing mechanism, annual volume commitments, and termination rights.
    whyItMatters: |-
      If the Shenxing Pro cell is available to competing OEMs, the 420 kW charging advantage is a temporary differentiator rather than a structural moat; exclusivity would be the key investment-grade claim.
    diligencePath: |-
      Request battery supply term sheet from Avatr management; cross-reference with CATL investor disclosures and other OEM battery announcements.
    relatedQuestionRefs:
    - QE010
    - QE027
    relatedTableRefs:
