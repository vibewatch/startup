- calloutType: risk
  title: Huawei single-source dependency is the dominant technology risk
  body: |-
    Every differentiating technology element—ADS 4.0, HarmonyOS 5.0, MDC compute, Qiankun branding—runs through Huawei. Changan's ¥11.5B Yinwang stake deepens rather than reduces this lock-in. Any US-China technology restriction escalation targeting Huawei automotive products would impair Avatr's core tech proposition with no short-term substitute.
  claimRefs:
  - CE022
  - CE023
  - CE024
  - CE039
- calloutType: risk
  title: "Quality signal: 07 complaint volume and vehicle fire incidents"
  body: |-
    The Avatr 07 ranked as the most-complained-about new energy vehicle in China in September and October 2025 with 268 complaints. Three vehicle fires were reported in 2025. These are the same model being launched in Thailand and other export markets.
