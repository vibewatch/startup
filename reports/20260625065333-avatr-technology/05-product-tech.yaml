- id: roadmap
  title: "Product Roadmap: RHD Markets, EREV Extension, and International Ambitions"
  body: |-
    Avatr's 2025–2026 roadmap centres on three vectors: completing the 07/06 model family, opening right-hand-drive (RHD) export markets, and progressing the deferred Hong Kong IPO. The Avatr 07 EREV and 07 EV were launched sequentially through September–October 2025 and became the brand's highest-volume model within two months of launch. In January 2026, the first batch of RHD Avatr 07 SUVs rolled off the Chongqing production line, targeting Thailand (where 7 showrooms operate) as the launch market. The Avatr 06T extended-range wagon with 955 hp and 741 km range is positioned for European design aesthetics and was priced from approximately ¥209,900 in China for 2026. The "Strategic 2.0" programme announced in September 2025 committed to launching additional EREV powertrain variants across the lineup and expanding model refresh cycles to annual cadences. Huawei Smartcom's April 2026 retail integration deal signals an intent to merge online and offline channels, which would simplify the customer experience for new market entrants. The HK IPO application lapsed in May 2026 after six months without regulatory response; Avatr has signalled intent to refile, but the timeline remains uncertain and introduces capital-raise risk. Separately, the Changan–Avatr–Deepal operational fusion, announced in April 2026, is expected to reduce back-office and supply-chain costs by 20–30%, but it may slow dedicated product-team bandwidth for the next 12–18 months.
