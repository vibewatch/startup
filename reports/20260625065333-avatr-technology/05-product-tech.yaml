- id: platform
  title: 800V SiC Platform and CATL Shenxing Battery System
  body: |-
    Avatr's power and energy architecture is built on an 800-volt silicon-carbide (SiC) inverter platform, which enables the ultra-fast charging speeds that underpin the brand's premium positioning. The CATL Shenxing Pro battery, deployed in the Avatr 07 EV, delivers 420 kW peak charging power and is rated for a 5C charging rate that takes the cell from 10% to 80% state of charge in approximately 5.5 minutes under optimal conditions. CATL claims cell-level energy density of 460 Wh/kg for the Shenxing Pro chemistry, enabled by a new condensed-matter electrolyte structure. Independent battery-engineering analysis by BatteryDesign.net corroborates the cell-chemistry differentiation, noting that the carbon–lithium alloy anode with semi-solid electrolyte allows higher energy density than conventional NMC cells while retaining fast-charge capability. The 07 EREV variant uses CATL's Freevoy extended-range system: a 52 kWh lithium battery pack paired with a high-efficiency range extender engine delivering 1,200 km of combined range, targeting buyers with range anxiety in charging-sparse regions. Platform-level integration is managed through the CHN framework: CATL supplies battery packs and battery management systems, Changan provides the platform chassis and manufacturing, and Huawei integrates the e-drive, power electronics, and charging management. The 800V SiC advantage may narrow over 2026–2027 as BYD, NIO, and Xpeng each introduce 800V platforms in overlapping segments, putting pressure on Avatr's "first-mover in premium 800V" narrative.
