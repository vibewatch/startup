      - number: '2.4'
        title: Growth Drivers, Constraints, and Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              Avatr's market is attractive because several drivers are moving in its favor at once: China NEV
              penetration keeps climbing, Chinese brands continue taking share, premium buyers increasingly reward
              smart-cabin and ADAS performance, and overseas outlets in ASEAN and the Middle East offer some
              diversification from the domestic battlefield. But the adverse evidence is material. China's 2025 price
              war intensified, overcapacity remains unresolved, and the fastest unit growth occurred below Avatr's
              average transaction price. Competitors with much larger scale, including Li Auto, Nio, Leapmotor, Xiaomi,
              and BYD, can spread product, channel, and software costs across more deliveries. At the same time, Avatr's
              dependence on Huawei as a critical differentiation layer introduces platform concentration risk because
              Huawei supports multiple carmakers. Internationally, Thailand and wider ASEAN look more practical than the
              US or Europe, yet export channels do not eliminate the need to prove durable domestic demand and service
              quality. The resulting market picture is investable only if Avatr can defend premium positioning without
              being dragged into margin-destructive volume competition.
