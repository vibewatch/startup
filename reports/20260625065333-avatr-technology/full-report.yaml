      - number: '3.4'
        title: Moat durability, commoditization risk, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The most important competitive evidence around Avatr is adverse. CarNewsChina reported that Changan
              planned to fuse Avatr and Deepal operations in April 2026 after Avatr's Q1 sales reportedly fell 41.6
              percent year over year. That matters beyond one bad quarter because Deepal already sits lower on price and
              can blur Avatr's brand ladder if the parent optimizes for efficiency over separation. BYD's premium march
              through Yangwang and Denza, plus the scale of Zeekr and Li Auto, reinforces the same message. Avatr is
              trying to hold a premium slot in a domestic field where better-capitalized or larger-volume rivals can
              rapidly close feature gaps. Even Avatr's capital-market path underscores an unfinished moat. Its
              fundraising and Hong Kong filing support strategic ambition, but the absence of a US listing path and the
              still- private discounting picture leave open questions about how much pricing power or brand autonomy
              Avatr can really sustain. The company can win share, but on current evidence its moat is partner-enabled
              and still vulnerable to commoditization, internal overlap, and volume shocks.
