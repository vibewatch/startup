      - number: '7.4'
        title: Financial, Execution, and IPO Risk
        blocks:
          - type: paragraph
            body: >-
              The financing story is now inseparable from execution. AASTOCKS reported that Avatr's IPO application
              lapsed after six months and that management planned to refile, but a technical refile is not equivalent to
              restored listing certainty or fresh capital. At the same time, Motorist and Nepal Drives describe a
              parent-led restructuring triggered after a major Q1 2026 sales drop, with Avatr still carrying a 2030
              volume target that is far above its recent run-rate. That mismatch matters because the China EV market in
              2026 still shows fading subsidies, discount pressure, and a structurally harsher environment for mid-sized
              brands. Avatr therefore faces a double bind: it needs premium execution and partner coordination to
              rebuild demand, yet the integration response itself proves that standalone economics were not
              self-correcting. Without transparent burn, cash, and runway disclosure, investors have to assume that any
              further demand miss, delayed refiling, or partner disruption would force Avatr to depend even more heavily
              on Changan's strategic patience or a less attractive funding alternative.
