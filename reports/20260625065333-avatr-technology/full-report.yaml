      - number: '8.4'
        title: Thesis-break triggers and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to use this chapter is to separate what would improve the call from what would break it.
              The call improves if Avatr can demonstrate that the Q1 2026 slowdown was temporary, that the Hong Kong
              process can be reopened without a valuation reset, and that post-Series-C economics were not overwhelmed
              by the RMB 11.5 billion Yinwang investment. The call breaks if the company remains stuck below roughly
              5,000 to 7,000 vehicles per month, if the IPO slips into 2027 without audited progress, or if partner
              dependence turns from leverage into constraint on pricing, branding, or software economics.


              Those conditions make the final diligence list unusually concrete. Investors do not need another narrative
              memo about premium positioning; they need audited FY2025 and FY2026 financials, a full cap table with
              preference terms, channel-level sell-through by model, and the commercial logic of Huawei, CATL, and
              Yinwang arrangements. If those asks come back strong, the recommendation can move toward track or buy on a
              lower or better-supported entry price. If they do not, the most likely outcome is not an attractive
              overlooked gem but a strategically important asset whose private carrying value stays ahead of public
              market evidence.
            claimRefs:
