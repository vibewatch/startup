      - number: '3.2'
        title: Capability breadth and pricing pressure
        blocks:
          - type: paragraph
            body: >-
              Capability overlap is real, but Avatr's pricing means buyers expect more than competent hardware. The
              Avatr 07 and refreshed Avatr 11 bracket a visible premium band around RMB 249,900 to RMB 289,900, which is
              well below German luxury EV flagships but still above many domestic alternatives. NIO remains more
              expensive and differentiates with battery swap and owner-community lock-in. XPENG pushes smart-driving
              breadth and can frame city NOA coverage as a software-led reason to trade up. AITO sells Huawei-linked
              premium positioning to nearly the same buyer, but at higher flagship prices. BMW and Mercedes price much
              higher, yet their presence still matters because they set the prestige ceiling for affluent upgraders. The
              result is a squeeze from both sides. If Avatr moves down, it risks cannibalization by cheaper domestic
              group products; if it moves up, it runs into stronger brands with longer track records. Avatr's best
              defense is therefore not absolute low price, but a superior value equation at the intersection of premium
              design, Huawei-enabled features, and battery or charging confidence.
