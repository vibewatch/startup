              EVs. ZigWheels UAE user reviews show early customer sentiment in the Middle East, though delivery volumes
              in that market are not confirmed in reviewed sources. The first right-hand-drive Avatr 07 SUVs rolled off
              the Chongqing production line in January 2026 for Thailand delivery, providing production-readiness
              evidence for the RHD export ramp. CnEVPost reported this milestone, and Thai Rath confirmed the delivery
              programme was proceeding. The named-proof picture is strongest for Thailand (official distributor,
              showroom counts, Motor Expo bookings, reviewer quotes) and weakest for the UAE and Australia (review
