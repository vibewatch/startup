      - number: '3.3'
        title: Distribution power, switching cost, and partner leverage
        blocks:
          - type: paragraph
            body: >-
              Distribution and lock-in are where Avatr still trails the strongest rivals. NIO has built the clearest
              post-purchase moat in this set because its battery-swap network and owner community create practical and
              emotional switching costs that Avatr does not disclose today. BMW and Mercedes still benefit from
              long-established dealer and service trust, even when their software proposition looks less tailored to
              China's Huawei-centric premium buyer. Avatr does have leverage that a standalone startup would struggle to
              build: the Changan manufacturing base, Huawei retail and service integration, and an export network that
              had already reached 55 channel partners across 25 countries by late 2024. Those assets matter because
              premium EV conversion depends on test-drive access, service confidence, and perceived ecosystem
              continuity. Still, partner strength is not the same as owned distribution power. Huawei supports multiple
              OEMs, Avatr's export footprint is still early relative to global incumbents, and public evidence does not
              yet show the kind of proprietary infrastructure, owner network, or service density that makes buyers
              structurally captive after purchase.
