      - number: '7.2'
        title: Regulatory, Legal, and Geopolitical Risk
        blocks:
          - type: paragraph
            body: >-
              China's regulatory posture toward intelligent connected vehicles has hardened rather than relaxed. The
              February 2025 MIIT/SAMR notice pushed admission, recall, and OTA software upgrades into a tighter
              safety-governance frame and required manufacturers to treat product testing and verification as core
              obligations, not marketing claims. For Avatr, that matters because its software-heavy positioning depends
              on OTA iteration, smart-cockpit features, and driver-assistance functions that can become recall or
              enforcement matters if performance diverges from documentation. Data law adds another layer. Automotive
              compliance commentary rooted in China's Cybersecurity Law, Data Security Law, PIPL, and the 2021
              automotive-data regulations treats vehicles as mobile data centres collecting personal and environmental
              information, so Avatr's app-connected, cloud-updated fleet creates privacy, localization, and cross-border
              transfer risk as soon as international expansion broadens data flows. Geopolitically, Huawei remains under
              formal U.S. restriction architectures and CATL is publicly responding to U.S. congressional scrutiny,
              meaning Avatr's partner stack is exposed to sanctions spillover even before any direct Avatr enforcement
              event appears in public sources.
