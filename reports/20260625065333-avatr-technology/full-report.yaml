      - number: '8.3'
        title: Comparable analysis and exit readiness
        blocks:
          - type: paragraph
            body: >-
              The most useful public comparable lens is not absolute market-cap ranking but what public investors now
              require from a Chinese EV name before paying even mid-teens billions of U.S. dollars. CompaniesMarketCap
              snapshots put NIO, Li Auto, and XPeng in a narrow June 2026 band of about US$11.9 billion to US$12.4
              billion, with Zeekr at US$6.8 billion and BYD as the scaled outlier above US$110 billion. The important
              point is not that Avatr should trade at those numbers mechanically; it is that public markets are
              assigning those values to businesses with clearer reporting histories, broader model portfolios, or much
              larger delivery bases. Zeekr's 222,123 deliveries in 2024 and NIO's disclosed Q1 2026 revenue of RMB 25.5
              billion highlight how much more operating proof listed peers are already showing.


              That makes exit readiness a disclosure question as much as a demand question. Avatr has enough brand and
              partner credibility to plausibly list, but it still looks earlier in its proof curve than the comp set
              that public investors already mark every day. A successful exit at or above the last private round likely
              requires three things to happen together: delivery recovery, continued margin improvement, and a sharper
              disclosure package on cash burn, cap table terms, and software monetization. Without that trio, the listed
              comp set argues for patience rather than urgency, because public investors can already buy more
              transparent Chinese EV exposure at values that embed the same sector multiple compression.
            claimRefs:
