  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Included Spend
        blocks:
          - type: paragraph
            body: >-
              Avatr should not be analyzed as if it competes for all China auto demand or even all China NEV demand. The
              evidence points to a narrower market boundary: premium intelligent passenger EVs in China, with strongest
              relevance in upper-mid and premium sedan and SUV segments where software experience, charging performance,
              perceived battery quality, and brand status meaningfully change purchase behavior. Included spend
              therefore covers premium passenger EV purchases, financed upgrades from incumbent luxury or Tesla
              vehicles, and the service and software experience that helps close and retain those buyers. Excluded spend
              includes upstream battery manufacturing, the mass-market RMB 100,000 to RMB 200,000 volume band except
              where it acts as a price anchor, commercial truck electrification, and broad auto export value. This
              distinction matters because the broad China EV market is unquestionably large, but Avatr's practical SAM
              depends on whether premium shoppers view Huawei-enabled intelligence and CATL-backed performance as enough
              to justify a higher transaction price in a market where domestic champions are moving down- and up-market
              at the same time.
