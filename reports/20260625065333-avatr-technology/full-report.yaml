      - number: '5.4'
        title: 'Product Roadmap: RHD Markets, EREV Extension, and International Ambitions'
        blocks:
          - type: paragraph
            body: >-
              Avatr's 2025–2026 roadmap centres on three vectors: completing the 07/06 model family, opening
              right-hand-drive (RHD) export markets, and progressing the deferred Hong Kong IPO. The Avatr 07 EREV and
              07 EV were launched sequentially through September–October 2025 and became the brand's highest-volume
              model within two months of launch. In January 2026, the first batch of RHD Avatr 07 SUVs rolled off the
              Chongqing production line, targeting Thailand (where 7 showrooms operate) as the launch market. The Avatr
              06T extended-range wagon with 955 hp and 741 km range is positioned for European design aesthetics and was
              priced from approximately ¥209,900 in China for 2026. The "Strategic 2.0" programme announced in September
              2025 committed to launching additional EREV powertrain variants across the lineup and expanding model
              refresh cycles to annual cadences. Huawei Smartcom's April 2026 retail integration deal signals an intent
              to merge online and offline channels, which would simplify the customer experience for new market
              entrants. The HK IPO application lapsed in May 2026 after six months without regulatory response; Avatr
              has signalled intent to refile, but the timeline remains uncertain and introduces capital-raise risk.
              Separately, the Changan–Avatr–Deepal operational fusion, announced in April 2026, is expected to reduce
              back-office and supply-chain costs by 20–30%, but it may slow dedicated product-team bandwidth for the
              next 12–18 months.
            claimRefs:
              - CE025
              - CE026
              - CE027
              - CE028
              - CE029
              - CE031
      - number: '5.5'
        title: Quality, Safety Incidents, and the Aerodynamics Integrity Controversy
        blocks:
          - type: paragraph
            body: >-
              Avatr's product-tech story carries three documented quality risks that an investor must assess before
              attributing full premium credibility. First, vehicle fire incidents: at least three Avatr vehicles caught
              fire in 2025, attracting significant Chinese social-media scrutiny and drawing regulatory attention from
              SAMR (the State Administration for Market Regulation). Second, complaint volume: the Avatr 07 topped the
              national new-energy-vehicle complaint charts in September and October 2025, accumulating 268 documented
              complaints—the highest figure of any model in those months—with issues concentrated in software, braking,
              and build quality. Third, the aerodynamics-integrity controversy: in mid-2025, Elon Musk reshared a
              Chinese social-media video questioning whether the Avatr 12's claimed drag coefficient of 0.21 Cd was
              achievable given visible styling elements; the video raised concerns about measurement methodology. Avatr
              issued a technical rebuttal defending its Cd figure but did not publish third-party wind-tunnel
              certification, leaving the question partially open. Yuantrends analysis noted these incidents in the
              context of a broader quality perception challenge. Independent reviewer assessments from drive.com.au and
              Carscoops rated the Avatr 12 and 11 positively for build quality, interior materials, and technology
              integration, providing partial counterbalance to the complaint data. However, the concentration of
              complaints on the Avatr 07—the same model targeted for high-volume export—represents a diligence risk for
              the international expansion thesis. An adverse manufacturing quality signal from the highest-volume model
              at the start of its export ramp is materially relevant.
            claimRefs:
              - CE032
              - CE033
              - CE034
              - CE035
              - CE036
              - CE037
              - CE038
