  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked Risk Profile Overview
        blocks:
          - type: paragraph
            body: >-
              Avatr's risk stack is led by three interacting threats: financing risk from the lapsed Hong Kong IPO
              process, demand risk from weak 2026 sales in a still-destructive China EV market, and strategic dependency
              risk because core premium differentiation runs through Huawei software, CATL-linked battery technology,
              and Changan's parent-company operating decisions. These are not isolated risks. The market backdrop is
              still punishing weaker premium brands with discount pressure, excess capacity, and narrowing feature
              differentiation, while Changan's response has been to merge backend functions with Deepal rather than
              prove Avatr can scale as a fully independent operating system. That changes the investment question from
              simple growth to whether Avatr can preserve premium positioning, software cadence, and capital access
              while its parent, partners, and regulators each control critical parts of the outcome. The heatmap and
              transmission map therefore rank Huawei/CATL dependency, IPO execution, domestic sales weakness, and
              integration-led brand dilution above lower-order legal unknowns such as litigated IP disputes, because the
              former set the near-term survival envelope.
