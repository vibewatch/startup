              complaint ranking in September and October 2025 with 268 total complaints, the highest of any single model
              in those months. Complaints concentrated on software behaviour, braking response inconsistencies, and
              build quality. At least three Avatr vehicle fire incidents were reported in 2025, attracting social-media
              attention and regulatory scrutiny, though no formal recall was confirmed in reviewed sources. The
              aerodynamics controversy around the Avatr 12's claimed 0.21 Cd—where Avatr issued a rebuttal to Elon
              Musk-amplified social-media criticism but declined to publish wind-tunnel certification—damaged brand
              credibility among technically engaged Chinese buyers. YuanTrends analysis directly connected this episode
              to a luxury perception risk, arguing that premium brand positioning requires flawless technical
              credibility. The aggregate picture is a brand with strong technology appeal but growing quality-perception
              challenges precisely at the peak of its volume ramp. That the Avatr 07—the highest-volume model intended
              for international export—is the source of the complaint spike is particularly concerning for franchise
              sustainability in new markets.
