      - number: '2.2'
        title: Evidence-Constrained Market Sizing
        blocks:
          - type: paragraph
            body: >-
              The safest way to size Avatr's market is through layered lenses rather than one heroic TAM number. At the
              broadest level, China remained the world's largest auto market in 2025 with 34.4 million vehicle sales and
              record passenger-car volumes, giving Avatr a huge top-down demand pool. One level narrower, China NEV
              sales reached 16.49 million units, domestic demand remained dominant, and December penetration crossed 52
              percent. One level narrower still, 2026 outlooks from Oxford Energy, ThinkerCar, and Viotech all imply
              continued expansion toward roughly 55 to 60 percent penetration, though growth is expected to slow from
              the breakneck 2025 pace. The difficulty is that premium intelligent EV demand at Avatr's exact
              price-and-feature boundary is not cleanly disclosed in public datasets. Third-party market-value
              estimates, including a roughly $378 billion China EV market lens, are useful for context but too broad for
              Avatr's actual SAM. The chapter therefore treats China NEV totals as TAM context, premium intelligent
              passenger EVs as SAM logic, and Avatr's current sales scale as a grounded SOM proxy.
