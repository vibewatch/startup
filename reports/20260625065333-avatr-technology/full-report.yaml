            body: >-
              Customer satisfaction evidence for Avatr is mixed. Positive signals come from independent international
              reviewers (Drive.com.au, Carscoops, ZigWheels UAE), Thai customer testimonials on the Avatr Thailand
              website, and the brand's ability to sustain above-average transaction prices (¥270,000+) through 2025.
