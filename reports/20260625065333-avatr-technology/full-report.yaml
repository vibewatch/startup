  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Profile
        blocks:
          - type: paragraph
            body: >-
              Avatr's public customer evidence points to a premium-segment Chinese buyer who prioritises smart-driving
              technology, brand prestige, and charging convenience over total cost of ownership. The typical Avatr buyer
              selects from the ¥229,000 to ¥400,000+ price band, positioning Avatr above volume NEV brands (BYD, Xpeng)
              and roughly level with NIO and Li Auto at the premium EV tier. The brand explicitly targets urban
              high-income professionals in first- and second-tier Chinese cities, which aligns with its distribution
              focus on 212 cities and 700+ outlets covering 82% of prefecture-level cities as of mid-2025. By geography,
              Greater China accounts for the overwhelming majority of revenue; Thailand is the first meaningful
              international market with 1,000+ delivered units and 7 showrooms. The UAE and Australia represent early
              test markets with review coverage but limited confirmed delivery volumes. The payer profile is primarily
              the retail consumer buying the vehicle outright or through leasing, with a small but growing fleet
              component suggested by the corporate buyer mentions in official materials. No Avatr channel partner or
              fleet-buyer data has been disclosed publicly. The Avatr 07 EV and EREV became the dominant volume drivers
              from Q4 2025 onward, with the 07's lower entry price relative to the 11 and 12 broadening the addressable
              buyer pool. The 11 and 12 serve a narrower ultra-premium cohort, while the 06 and 06T extend reach
              downward to the ¥229,000 price point. Segment concentration risk is high: available evidence shows Avatr
              is deeply dependent on the domestic Chinese upper-premium EV segment, and any macro slowdown, competitive
              price war at this tier, or demand-saturation effects would materially impair the volume trajectory.
            claimRefs:
