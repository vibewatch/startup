companyProfile:
  summary: >-
    Avatr Technology is a Chongqing-based premium intelligent EV company whose current form emerged from the 2018
    Changan-NIO joint venture and the 2021 rebrand around a Changan-Huawei-CATL collaboration model. The company sells
    higher-end BEV and EREV sedans and SUVs including the Avatr 06, 07, 11, and 12, with Huawei providing the
    intelligent-driving and cockpit stack and CATL supplying core battery technology. Public IPO-era reporting shows
    rapid revenue and volume scaling through 2025, but also continued losses, partner dependence, and a 2026 demand
    slowdown that make the equity story more complex than the brand narrative alone suggests.
