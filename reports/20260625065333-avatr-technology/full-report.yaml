            body: >-
              The financial verdict is mixed. Avatr has crossed into meaningful revenue scale, and the near-doubling of
              H1 2025 revenue versus the prior year shows genuine market traction. However, the mix remains concentrated
              in vehicle sales, public disclosures stop short of gross margin and cash-burn transparency, and the
              balance sheet story looks stretched once the Yinwang purchase is considered. Adverse data further weakens
              confidence: CarNewsChina reported a 41.6% quarter-on-quarter delivery plunge in Q1 2026, and Changan
              responded by moving to fuse Avatr and Deepal operations. Those two signals suggest management is still
              optimizing the operating model rather than cruising toward self-funded scale. For diligence, the missing
              metrics are not cosmetic. Gross margin is needed to assess whether premium pricing covers battery,
              manufacturing, and channel costs; burn rate and cash balances determine whether the IPO is optional or
              necessary; and per-vehicle unit economics are required to judge whether growth is value-creating. The
