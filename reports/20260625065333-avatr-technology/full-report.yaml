        - Moves lower if recovery stalls or cap-table terms are unfriendly.
      - - Bear
        - >-
          Q1 2026 weakness persists, backend integration deepens, and investors treat Avatr as a strategically supported
          but subscale premium brand.
        - 8-15
        - >-
