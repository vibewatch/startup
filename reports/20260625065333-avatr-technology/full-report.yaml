  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, adjacents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Avatr competes in the premium intelligent-EV slice of China's market, not the mass segment. The closest
              direct peers are domestic smart-EV brands such as NIO, Zeekr, Li Auto, XPENG, and AITO, all of which ask
              buyers to pay for a mix of premium design, software, assisted driving, and service quality. Adjacent
              pressure comes from BYD's premium sub-brands Yangwang and Denza, which can use group scale to move
              up-market, while substitutes still include German luxury EVs from BMW and Mercedes for buyers who want
              prestige and dealership confidence more than a Huawei-linked software story. Avatr's own positioning is
              credible because its product pages and partner messaging consistently frame the brand around premium
              design plus Huawei and CATL technology, but the same fact also defines the risk. Avatr is not alone in
              selling premium intelligence. Rival classes therefore attack from multiple directions at once. Chinese
              smart-EV specialists compete on feature relevance and value, prestige incumbents compete on brand trust
              and financing, and internal group brands like Deepal can squeeze entry-premium demand from below.
