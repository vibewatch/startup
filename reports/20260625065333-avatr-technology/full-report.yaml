      - Core assumptions
      - Indicative valuation range (RMB B)
      - Probability signal
      - Downside / upside trigger
    rows:
      - - Bull
        - >-
          Deliveries recover toward 100k+ annualized, gross margin keeps improving, audited disclosure reopens HK IPO in
