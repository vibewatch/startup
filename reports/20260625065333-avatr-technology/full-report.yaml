      - number: '6.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Best proof: Thailand deployment with reviewer validation and Motor Expo bookings'
            body: >-
              Thailand is the strongest public international customer evidence: official distributor, 7 showrooms,
              1,000+ delivered, Motor Expo 1,103 bookings, and three independent reviewer quotes. This is
              production-ready export proof rather than concept stage.
            calloutType: strength
            claimRefs:
