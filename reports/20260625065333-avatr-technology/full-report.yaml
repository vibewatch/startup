chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and origin
        blocks:
          - type: paragraph
            body: >-
              Avatr Technology is a Chinese premium new-energy vehicle company whose current corporate identity traces
              to a July 10, 2018 joint venture between Changan Automobile and NIO. The brand did not remain static: in
              August 2021 the company was rebranded as Avatr Technology and repositioned around what management and
              partner coverage describe as a Changan-Huawei-CATL collaboration model. That origin matters because it
              explains why Avatr presents itself less as a standalone startup with one proprietary stack and more as an
              orchestrated vehicle platform that combines manufacturing, software-intelligence, and battery supply from
              different backers.


              The company’s center of gravity is Chongqing Liangjiang New Area, while public-facing materials also point
              to a broader operating footprint that includes Shanghai and a Munich Global Design Center. This gives
              Avatr both a domestic production and management base and an explicitly international design posture. The
              identity story is therefore not just “another EV brand”; it is a state-linked, partner-dependent premium
              EV platform whose early legitimacy rests on blue-chip Chinese industrial sponsors, a premium design
              narrative, and a high-end product mix rather than on bootstrapped independence or early profitability.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO011
              - CO021
              - CO058
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Avatr’s leadership profile changed materially after late 2023. Tan Benhong, the original chairman closely
              associated with the early brand-building phase, was removed in December 2023. Operational leadership then
              consolidated around Chen Zhuo, who became president in December 2023 and later the legal representative in
              February 2024. The chair role moved again in September 2025 to Wang Hui, a long-time Changan executive
              whose background signals tighter parent-company oversight at a time when Avatr was preparing for an IPO
              and trying to scale internationally.


              Governance therefore appears more institutional than founder-led by 2026. Wang Hui’s elevation, Zhu
              Huarong’s earlier interim oversight, and Changan’s central role all suggest Avatr is governed as a
              strategically important affiliate within a larger automotive system rather than as a founder-controlled
              startup. Nader Faghihzadeh’s role as chief design officer and leader of the Munich studio adds an
              important product-governance counterweight, because Avatr’s premium positioning depends heavily on design
              continuity. Even so, the public record remains incomplete on the full board roster, committee structure,
              and minority-investor governance rights, which limits external visibility into decision-making checks and
              balances.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.3'
        title: Capitalization and investors
        blocks:
          - type: paragraph
            body: >-
              Avatr is one of the more heavily funded Chinese EV startups of its cohort. Public reporting around the
              December 2024 Series C round states that the company raised RMB 11.1 billion in that financing alone and
              had raised more than RMB 19 billion across four rounds by the time it pursued a Hong Kong listing. The
              post-Series C shareholder picture disclosed in IPO reporting was led by Changan Automobile at 40.99%,
              followed by CATL at 14.1% and Chongqing Yu’an at 8.81%, while NIO no longer appeared on the current
              shareholder list. That is a notable evolution from Avatr’s original Changan-NIO origin and indicates a
              cap-table shift toward industrial incumbents and local-state capital.


              IPO-linked reporting also framed the company’s valuation in a range rather than a single confirmed number:
              one signal implied about RMB 26 billion, while another suggested roughly RMB 32 billion. Avatr filed for a
              Hong Kong IPO on November 27, 2025 with CITIC Securities and CICC as sponsors and a roughly US$1 billion
              target raise, but the application lapsed on May 27, 2026 after the standard six-month window. Management’s
              message that refiling plans were unaffected reduces immediate signaling damage, yet February 2026 CSRC
              feedback on equity compliance, foreign-investment access, and data security shows the financing path was
              not frictionless.
