      - number: '5.3'
        title: Huawei Qiankun ADS 4.0, HarmonyOS 5.0, and the CHN Co-Creation Model
        blocks:
          - type: paragraph
            body: >-
              The distinguishing technology differentiator for Avatr versus non-Huawei peers is the Qiankun suite:
              Huawei ADS 4.0 (Advanced Driving System) for autonomous and assisted driving, and HarmonyOS 5.0 for
              cockpit, OTA, and ecosystem connectivity. ADS 4.0 uses a 4D imaging radar, front LiDAR (on top-spec
              trims), and a multi-camera array fused by Huawei's MDC (Mobile Data Center) compute platform; it supports
              both highway NCA (Navigation Cruise Assist) and urban NCA, the latter covering cities in mainland China
              without HD maps. HarmonyOS 5.0 is the successor to HarmonyOS 4.0 deployed in the Avatr 12 launch variant;
              it supports seamless multi-screen continuity between phones, tablets, and in-car displays, and enables
              remote OTA updates and real-time ecosystem app deployment. The HiPlus co-creation model involves
              approximately 1,000 joint engineers from Huawei and Avatr embedded at the Chongqing headquarters, blurring
              the boundary between supplier relationship and product co-development. In April 2026, Changan and Huawei
              Smartcom signed a deeper integration agreement to merge retail and after-sales service channels, extending
              the technology dependency into the commercial operating layer. The Huawei HI (Huawei Inside) model gives
              Avatr access to Huawei's proprietary stack but also means Avatr cannot easily substitute smart-driving or
              cockpit components without a full platform re-design; this is the most material single-source technology
              risk in the diligence. Changan additionally disclosed a ¥11.5 billion investment for a 10% stake in
              Huawei's automotive subsidiary (Yinwang), intended to deepen the strategic alignment and provide
              governance influence over the joint technology roadmap.
