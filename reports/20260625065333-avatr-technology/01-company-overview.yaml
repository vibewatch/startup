company:
  name: Avatr Technology
chapter:
  number: 1
  title: Company Overview
  summary: Avatr Technology is a Chongqing-based premium Chinese EV maker founded in 2018 from the Changan-NIO joint venture and reworked in 2021 around a Changan-Huawei-CATL alliance. By mid-2026 it had raised more than RMB 19 billion, filed then lapsed a Hong Kong IPO, scaled annual sales above 120,000 in 2025, but was still loss-making and entered 2026 with a sharp Q1 sales slowdown and unresolved valuation and governance disclosure gaps.
sections:
- id: identity-and-origin
  title: Identity and origin
  body: 'Avatr Technology is a Chinese premium new-energy vehicle company whose current corporate identity traces to a July 10, 2018 joint venture between Changan Automobile and NIO. The brand did not remain static: in August 2021 the company was rebranded as Avatr Technology and repositioned around what management and partner coverage describe as a Changan-Huawei-CATL collaboration model. That origin matters because it explains why Avatr presents itself less as a standalone startup with one proprietary stack and more as an orchestrated vehicle platform that combines manufacturing, software-intelligence, and battery supply from different backers.


    The company’s center of gravity is Chongqing Liangjiang New Area, while public-facing materials also point to a broader operating footprint that includes Shanghai and a Munich Global Design Center. This gives Avatr both a domestic production and management base and an explicitly international design posture. The identity story is therefore not just “another EV brand”; it is a state-linked, partner-dependent premium EV platform whose early legitimacy rests on blue-chip Chinese industrial sponsors, a premium design narrative, and a high-end product mix rather than on bootstrapped independence or early profitability.'
