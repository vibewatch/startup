- id: products-and-technology
  title: Products and technology
  body: 'Avatr’s current product set spans the Avatr 11 SUV, Avatr 12 sedan, Avatr 07 midsize SUV, and Avatr 06 midsize sedan, giving the company a premium portfolio across both SUV and sedan body styles. The 2025 Avatr 07 launch is especially important because it embodied the partner stack Avatr wants investors to underwrite: Huawei ADS 4 as standard intelligent-driving capability, CATL batteries, and premium pricing starting above RMB 219,900. The Avatr 06’s April 2026 arrival extended that logic into another midsize segment with four BEV and range-extended variants priced at RMB 209,900 to RMB 279,900.


    The technology story is less about a proprietary single-supplier stack and more about controlled integration. Changan provides the vehicle-industrial backbone, Huawei contributes cockpit and ADAS layers, and CATL anchors batteries; Avatr then packages the result into a premium brand with design-led positioning. That approach also extends into corporate strategy. Avatr spent RMB 11.5 billion for a 10% stake in Huawei Yinwang, signed a SmartCom retail-service integration agreement with Huawei in April 2026, and used limited-edition collaborations such as Avatr 011 and 012 to build halo appeal. The trade-off is that technical differentiation and channel control remain meaningfully partner-dependent.'
