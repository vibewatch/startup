  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: A board-approved valuation memo, secondary transaction documents, or draft prospectus valuation bridge that reconciles the reported RMB 26B and RMB 32B figures.
    whyItMatters: The valuation range is too wide for a clean financing or upside analysis and can distort dilution and return scenarios.
    diligencePath: Request the latest financing model, any 409A-style valuation work, and the sponsor-prepared IPO valuation comps deck.
    relatedQuestionRefs:
    - QO009
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-founder-table
    missingEvidence: A complete board roster, committee assignments, and broader executive org chart beyond the publicly named chair, president, and design chief.
    whyItMatters: Minority investors need visibility into governance safeguards, succession depth, and whether authority is concentrated in a narrow leadership group.
    diligencePath: Request the board register, committee charters, and current executive organization chart from company counsel or the IPO data room.
    relatedQuestionRefs:
    - QO029
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: stakeholder-or-investor-map
    missingEvidence: The latest cap table showing share classes, liquidation preferences, anti-dilution terms, board rights, and minority protections for the latest rounds.
    whyItMatters: Economic control and downside protection cannot be inferred from topline shareholder percentages alone.
    diligencePath: Obtain the shareholder agreement, Series C term sheet, and current capitalization table from Avatr or lead counsel.
    relatedQuestionRefs:
    - QO030
    relatedTableRefs:
    - TO003
  - type: stale
    severity: minor
    topic: distribution
    missingEvidence: A month-end 2026 network and overseas channel report updating the May 2025 domestic coverage snapshot and late-2025 international channel count.
    whyItMatters: Channel scale is central to the 2026 demand narrative, and stale footprint counts can overstate current commercial reach.
    diligencePath: Request the latest dealer/distributor roster, outlet openings and closures, and country-level channel performance dashboard.
