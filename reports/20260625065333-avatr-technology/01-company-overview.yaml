- id: leadership-and-governance
  title: Leadership and governance
  body: 'Avatr’s leadership profile changed materially after late 2023. Tan Benhong, the original chairman closely associated with the early brand-building phase, was removed in December 2023. Operational leadership then consolidated around Chen Zhuo, who became president in December 2023 and later the legal representative in February 2024. The chair role moved again in September 2025 to Wang Hui, a long-time Changan executive whose background signals tighter parent-company oversight at a time when Avatr was preparing for an IPO and trying to scale internationally.


    Governance therefore appears more institutional than founder-led by 2026. Wang Hui’s elevation, Zhu Huarong’s earlier interim oversight, and Changan’s central role all suggest Avatr is governed as a strategically important affiliate within a larger automotive system rather than as a founder-controlled startup. Nader Faghihzadeh’s role as chief design officer and leader of the Munich studio adds an important product-governance counterweight, because Avatr’s premium positioning depends heavily on design continuity. Even so, the public record remains incomplete on the full board roster, committee structure, and minority-investor governance rights, which limits external visibility into decision-making checks and balances.'
  claimRefs:
