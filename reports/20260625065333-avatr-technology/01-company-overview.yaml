- id: scale-and-adverse-checks
  title: Scale and adverse checks
  body: 'Avatr’s scale picture improved sharply through 2025 but remained financially fragile. Revenue rose from just RMB 28 million in 2022 to RMB 5.65 billion in 2023 and RMB 15.2 billion in 2024, while H1 2025 revenue reached RMB 12.21 billion with gross margin improving to 10.1%. Deliveries scaled from 114 units in 2022 to about 27,000 in 2023, 61,588 in 2024, and more than 120,000 in full-year 2025. The company also reported a wide commercial footprint by May 2025, with more than 700 sales and service outlets in 212 cities, plus overseas entry into Thailand and Hong Kong before expanding to 40-plus countries by June 2026.


    The adverse lens is just as important. Avatr remained loss-making throughout the growth phase: net losses from 2022 through H1 2025 cumulated to roughly RMB 11.31 billion. The 2025 volume result was only about 54% of the 220,000-unit target, and Q1 2026 sales reportedly fell 53.5% year over year to 11,392 units, raising questions about demand elasticity and the durability of late-2025 momentum. Changan’s April 2026 “1445” efficiency program, which proposed shared middle- and back-office functions between Avatr and Deepal with potential 20% to 30% cost savings, suggests management already recognized the need to improve operating leverage rather than rely only on headline sales growth.'
