- id: capitalization-and-investors
  title: Capitalization and investors
  body: 'Avatr is one of the more heavily funded Chinese EV startups of its cohort. Public reporting around the December 2024 Series C round states that the company raised RMB 11.1 billion in that financing alone and had raised more than RMB 19 billion across four rounds by the time it pursued a Hong Kong listing. The post-Series C shareholder picture disclosed in IPO reporting was led by Changan Automobile at 40.99%, followed by CATL at 14.1% and Chongqing Yu’an at 8.81%, while NIO no longer appeared on the current shareholder list. That is a notable evolution from Avatr’s original Changan-NIO origin and indicates a cap-table shift toward industrial incumbents and local-state capital.


    IPO-linked reporting also framed the company’s valuation in a range rather than a single confirmed number: one signal implied about RMB 26 billion, while another suggested roughly RMB 32 billion. Avatr filed for a Hong Kong IPO on November 27, 2025 with CITIC Securities and CICC as sponsors and a roughly US$1 billion target raise, but the application lapsed on May 27, 2026 after the standard six-month window. Management’s message that refiling plans were unaffected reduces immediate signaling damage, yet February 2026 CSRC feedback on equity compliance, foreign-investment access, and data security shows the financing path was not frictionless.'
