evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: >-
      A board-approved valuation memo, secondary transaction documents, or draft prospectus valuation bridge that
      reconciles the reported RMB 26B and RMB 32B figures.
    whyItMatters: >-
      The valuation range is too wide for a clean financing or upside analysis and can distort dilution and return
      scenarios.
    diligencePath: >-
      Request the latest financing model, any 409A-style valuation work, and the sponsor-prepared IPO valuation comps
      deck.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-founder-table
    missingEvidence: >-
      A complete board roster, committee assignments, and broader executive org chart beyond the publicly named chair,
      president, and design chief.
    whyItMatters: >-
      Minority investors need visibility into governance safeguards, succession depth, and whether authority is
      concentrated in a narrow leadership group.
    diligencePath: >-
      Request the board register, committee charters, and current executive organization chart from company counsel or
      the IPO data room.
    relatedQuestionRefs:
      - QO029
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      The latest cap table showing share classes, liquidation preferences, anti-dilution terms, board rights, and
      minority protections for the latest rounds.
    whyItMatters: Economic control and downside protection cannot be inferred from topline shareholder percentages alone.
    diligencePath: >-
      Obtain the shareholder agreement, Series C term sheet, and current capitalization table from Avatr or lead
      counsel.
    relatedQuestionRefs:
      - QO030
    relatedTableRefs:
      - TO003
  - type: stale
    severity: minor
    topic: distribution
    missingEvidence: >-
      A month-end 2026 network and overseas channel report updating the May 2025 domestic coverage snapshot and
      late-2025 international channel count.
    whyItMatters: >-
      Channel scale is central to the 2026 demand narrative, and stale footprint counts can overstate current commercial
      reach.
    diligencePath: >-
      Request the latest dealer/distributor roster, outlet openings and closures, and country-level channel performance
      dashboard.
  - type: missing-source
    severity: material
    topic: sam-gap
    missingEvidence: >-
      A public dataset that isolates China's premium intelligent EV market at Avatr's price and feature boundary,
      ideally split by sedan versus SUV and buyer income band.
    whyItMatters: >-
      Without that cut, TAM and SAM claims can easily overstate the addressable market by importing mass-market NEV
      demand.
    diligencePath: >-
      Request third-party registration cuts or dealer-level pricing mix from management and compare them with segment
      data from specialist auto analysts.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-conversion
    missingEvidence: Measured showroom, test-drive, financing, and close-rate data by model and city tier.
    whyItMatters: >-
      The chapter can map a plausible adoption path, but it cannot verify where premium prospects drop out or whether
      Huawei-linked distribution materially improves close rates.
    diligencePath: >-
      Ask Avatr for city-level funnel metrics, store productivity, and service-response KPIs before underwriting
      conversion assumptions.
    relatedQuestionRefs:
      - QM012
      - QM022
  - type: conflicting-data
    severity: material
    topic: export-timing
    missingEvidence: >-
      Country-by-country launch timing, homologation status, distributor economics, and sell-through for Thailand,
      ASEAN, Middle East, and any planned EU entry.
    whyItMatters: >-
      International expansion is a key strategic release valve, but public reporting emphasizes ambition more than
      realized market traction or regulatory readiness.
    diligencePath: >-
      Request signed distributor terms, homologation calendars, and first-90-day retail sell-through data for each
      export market.
    relatedQuestionRefs:
      - QM019
      - QM026
    relatedTableRefs:
      - TM003
      - TM004
  - type: missing-source
    severity: material
    topic: ads-exclusivity
    missingEvidence: >-
      A contract term sheet or official disclosure showing whether Avatr has any exclusive preferred or timed access
      rights to Huawei ADS 4 or related components.
    whyItMatters: >-
      If Huawei grants comparable access to multiple OEMs, Avatr's headline tech differentiation is easier to
      commoditize.
    diligencePath: Request the Avatr-Huawei commercial framework, roadmap governance, and any exclusivity or priority clauses.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: material
    topic: channel-pricing
    missingEvidence: >-
      City-level dealer quotes, trade-in subsidies, financing support, and realized discount data for Avatr models and
      immediate competitors.
    whyItMatters: List prices can overstate pricing power and obscure whether Avatr is clearing volume through incentives.
    diligencePath: Collect mystery-shop quotes across tier-1 and tier-2 cities and compare net transaction pricing.
    relatedQuestionRefs:
      - QP014
  - type: missing-source
    severity: material
    topic: transaction-pricing
    missingEvidence: >-
      Verified 2026 realized transaction prices or incentive-adjusted discounts for AITO M9 and Mercedes EQS 450+ in
