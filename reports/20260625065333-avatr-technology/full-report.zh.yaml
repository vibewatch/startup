      - number: '8.3'
        title: 可比分析与退出准备度
        blocks:
          - type: paragraph
            body: >-
              最有用的公开可比视角，不是绝对市值排名，而是公开投资者如今愿意为一家中国 EV 公司支付中十亿美元级估值前，需要看到什么。CompaniesMarketCap 快照显示，2026 年 6 月 NIO、Li
              Auto 和 XPeng 集中在约 US$11.9 billion 至 US$12.4 billion 的窄区间，Zeekr 为 US$6.8 billion，BYD 则是超过 US$110 billion
              的规模异类。重点不是 Avatr 应机械地按这些数字交易；而是公开市场把这些价值给了报告历史更清楚、车型组合更广或交付基础大得多的企业。Zeekr 2024 年交付 222,123 辆，NIO 披露 2026 年
              Q1 收入 RMB 25.5 billion，都凸显上市同行已经展示了更多运营证明。


              这使退出准备度既是披露问题，也是需求问题。Avatr
              有足够的品牌和伙伴可信度，理论上可以上市；但相较公开投资者每天定价的可比公司组，它仍处在更早的证明曲线。若要在上一轮私募估值或更高水平成功退出，可能需要三件事同时发生：交付恢复、毛利率继续改善，以及在现金消耗、股权结构条款和软件变现上给出更清晰的披露包。没有这三者，可比上市公司组支持的是耐心，而不是急迫，因为公开投资者已经能以嵌入同样行业倍数压缩的估值，买到更透明的中国
              EV 敞口。
