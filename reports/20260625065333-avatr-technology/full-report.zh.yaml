      - number: '2.4'
        title: 增长驱动、约束与反向证据
        blocks:
          - type: paragraph
            body: >-
              Avatr 所在市场具备吸引力，因为几股驱动力同时向有利方向移动：中国 NEV 渗透率继续上升，中国品牌持续拿份额，高端买家越来越奖励智能座舱和 ADAS 表现，ASEAN
              和中东的海外网点也给国内战场之外提供了一些分散化。但反向证据很实在。中国 2025 年价格战加剧，产能过剩仍未解决，最快的单位增长发生在 Avatr 平均成交价之下。Li
              Auto、Nio、Leapmotor、Xiaomi 和 BYD 等规模大得多的竞争对手，可以把产品、渠道和软件成本摊到更多交付量上。与此同时，Avatr 把 Huawei 作为关键差异化层，带来平台集中风险，因为
              Huawei 同时支持多家车企。国际上，泰国和更广 ASEAN 比美国或欧洲更现实，但出口渠道不能替代对国内可持续需求和服务质量的证明。由此形成的市场图景只有在一个条件下才值得投资：Avatr
              能守住高端定位，不被拖入毁毛利的走量竞争。
