      - number: '4.3'
        title: 资本充足性与 IPO 路径
        blocks:
          - type: paragraph
            body: >-
              资本充足性是 Avatr 最核心的财务问题。公司在 2024 年 12 月 Series C 融资 RMB 11.101 billion，其中 Changan 出资 RMB 4.551 billion；该轮后
              Changan 持股 40.99%，CATL 持股 14.1%。但 Avatr 随后承诺用 RMB 11.5 billion 收购 Huawei Yinwang 10% 股权，意味着单笔战略投资规模大致等于整个
              2025 年上半年已披露收入基数，且高于 Series C 融资额本身。这个量级凸显出，相比当前变现水平，Avatr 战略仍高度耗资本。IPO 路径也未完成。Avatr 于 2025 年 11 月在香港递表，由
              CITIC Securities 和 CICC 担任保荐人；但 2026 年 3 月公开的 HKEX 文件仍显示流程在推进中，而非已经完成。独立报道还把 IPO
              完成与盈亏平衡联系起来，这显著抬高执行风险，因为公司没有公开披露烧钱率、账面现金或资金跑道。因此，投资人面对的是一个仍依赖经营改善的融资故事，只有上市落地后，资产负债表风险才可能下降。
