  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接同业、存量巨头、邻近玩家与替代品
        blocks:
          - type: paragraph
            body: >-
              Avatr 竞争的是中国市场里的高端智能 EV 切片，而不是大众市场。最接近的直接同业是 NIO、Zeekr、Li Auto、XPENG、AITO 等国内智能 EV
              品牌；它们都要求买家为高端设计、软件、辅助驾驶和服务质量的组合付费。邻近压力来自 BYD 的高端子品牌 Yangwang 和 Denza，它们能借集团规模上攻；替代品仍包括 BMW、Mercedes 的德国豪华
              EV，因为部分买家更看重声望和经销商信任，而不是 Huawei 相关软件故事。Avatr 自身定位有可信度，因为其产品页面和伙伴信息始终把品牌框在高端设计加 Huawei、CATL
              技术上；但同一事实也定义了风险。Avatr 并非唯一销售高端智能化的品牌。因此，竞争群体从多个方向同时进攻：中国智能 EV 专家拼功能相关性和性价比，豪华存量品牌拼品牌信任和金融方案，Deepal
              等集团内部品牌则从下方挤压入门高端需求。
