      - number: '5.4'
        title: 产品路线图：RHD 市场、EREV 延伸与国际化雄心
        blocks:
          - type: paragraph
            body: >-
              Avatr 2025–2026 年路线图围绕三条线展开：补齐 07/06 车型家族、打开右舵（RHD）出口市场，以及推进延期的香港 IPO。Avatr 07 EREV 和 07 EV 在 2025 年 9–10
              月先后上市，并在上市两个月内成为品牌销量最高车型。2026 年 1 月，首批 RHD Avatr 07 SUV 在重庆产线下线，目标首发市场是泰国（当地运营 7 家展厅）。Avatr 06T 增程旅行车拥有
              955 hp 和 741 km 续航，定位贴近欧洲设计审美，2026 年在中国起价约 ¥209,900。2025 年 9 月宣布的“Strategic 2.0”计划承诺，在全系推出更多 EREV
              动力版本，并把车型焕新周期扩展为年度节奏。Huawei Smartcom 2026 年 4 月零售整合协议显示，公司有意合并线上与线下渠道，从而为新市场进入者简化客户体验。香港 IPO 申请在 2026 年 5
              月满六个月后失效，期间没有监管回应；Avatr 已表示有意重新递表，但时间表仍不确定，也带来募资风险。另外，2026 年 4 月宣布的 Changan–Avatr–Deepal 运营融合预计可降低 20–30%
              中后台和供应链成本，但未来 12–18 个月可能拖慢专属产品团队的带宽。
