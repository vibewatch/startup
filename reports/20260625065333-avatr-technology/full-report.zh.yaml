      - number: '6.2'
        title: 中国国内采用：2025 年上半年激增与 2026 年一季度逆转
        blocks:
          - type: paragraph
            body: >-
              Avatr 在中国国内的采用轨迹像两幕剧。第一幕（2024 年至 2025 年上半年）是持续加速：品牌在 2024 年下半年首次跨过月交付 10,000 辆，并把这一水平连续维持 8 个月直至 2025 年 6
              月。2025 年上半年总交付达到 56,729 辆，同比提升 151.1%；仅 2025 年 6 月就录得 117% 同比激增。到 2025 年 6 月，累计历史交付超过 150,000 辆，平均成交价高于
              ¥270,000，说明客户并未下探到最便宜配置。2025 全年截至 10 月大约完成 220,000 辆目标的 47.4%，暗示全年约为 115,000–120,000 辆。第二幕（2026
              年一季度）则急剧逆转：Avatr 在 2026 年一季度仅交付 11,703 辆，较 2025 年一季度的 20,073 辆同比下降 41.6%。CarNewsChina 将下滑归因于 Huawei
              Aito、NIO、Li Auto、BYD 豪华线的竞争加剧，以及 Deepal 吸收后台资源带来的自我蚕食风险。Changan 于 2026 年 4 月宣布 Avatr-Deepal 运营融合，目标削减
              20–30% 共享成本；这验证了规模压力叙事，但也让投资人质疑品牌稀释和管理焦点。这种 V 型走势——陡升后急跌——是客户尽调的核心风险：2025 年加速可能部分来自新 07 车型的上市周期需求，而在
              ¥250k–350k 价格带竞争恶化时，持续渗透尚未被证明。
