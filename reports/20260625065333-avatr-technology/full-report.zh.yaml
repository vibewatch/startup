      - number: '5.3'
        title: Huawei Qiankun ADS 4.0、HarmonyOS 5.0 与 CHN 共创模式
        blocks:
          - type: paragraph
            body: >-
              Avatr 相比非 Huawei 同业最鲜明的技术差异化，是 Qiankun 套件：用于自动驾驶和辅助驾驶的 Huawei ADS 4.0（Advanced Driving System），以及用于座舱、OTA
              和生态连接的 HarmonyOS 5.0。ADS 4.0 使用 4D 成像雷达、前向 LiDAR（高配版本）和多摄像头阵列，并由 Huawei MDC（Mobile Data
              Center）计算平台融合；它同时支持高速 NCA（Navigation Cruise Assist）和城区 NCA，后者覆盖中国大陆城市且不依赖高精地图。HarmonyOS 5.0 是 Avatr 12
              首发版本所搭载 HarmonyOS 4.0 的继任者；它支持手机、平板和车内显示之间无缝多屏连续，也支持远程 OTA 更新和生态应用实时部署。HiPlus 共创模式把约 1,000 名 Huawei 与
              Avatr 联合工程师嵌入重庆总部，模糊了供应商关系与产品共同开发之间的边界。2026 年 4 月，Changan 与 Huawei Smartcom
              签署更深层整合协议，合并零售和售后服务渠道，把技术依赖延伸到商业运营层。Huawei HI（Huawei Inside）模式让 Avatr 获得 Huawei 专有技术栈，但也意味着 Avatr
              很难在不进行完整平台重设计的情况下替换智能驾驶或座舱组件；这是尽调中最重要的单一来源技术风险。Changan 还披露，以 ¥11.5 billion 投资 Huawei 汽车子公司（Yinwang）10%
              股权，意在深化战略协同，并对联合技术路线图取得治理影响力。
