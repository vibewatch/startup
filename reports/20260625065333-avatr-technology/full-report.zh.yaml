              除汇总交付数字外，最强的公开客户证据来自国际市场部署和独立评测覆盖。在泰国，Avatr 与 Infinite Automobile 作为本地经销商合作，开设 7 家展厅，包括曼谷 Rama 3 Road
              的旗舰店；截至 2026 年初已交付超过 1,000 辆。Motor Expo 2025 订单达到 1,103 辆，提供了来自零售客户的生产意向证明。三位泰国独立汽车评测者（Boomtharis、Spin9、Go
              Went Go）在 Avatr Thailand 官方页面发布肯定性评测，称赞续航、技术和制造质量。在澳大利亚，Drive.com.au 对 Avatr 12
              进行国际快速试驾并发布正面报道，称其内饰质量超出对中国高端 EV 的预期。ZigWheels UAE 用户评论显示中东早期客户情绪，但审阅来源没有确认该市场交付量。首批右舵 Avatr 07 SUV 于 2026
              年 1 月在重庆产线下线，面向泰国交付，为 RHD 出口爬坡提供生产就绪证据。CnEVPost 报道了这一里程碑，Thai Rath
              也确认交付计划正在推进。具名证明图景在泰国最强（官方经销商、展厅数量、Motor Expo 订单、评测者引述），在 UAE 和澳大利亚最弱（只有评测覆盖，没有确认车队或零售交付数字）。
