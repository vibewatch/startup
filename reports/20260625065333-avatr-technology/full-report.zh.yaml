            title: 留存与 cohort 数据是关键尽调缺口
            body: >-
              Avatr 尚未披露 NRR、GRR、复购率或服务续费 cohort。对一个只有三年历史、且 2026 年 Q1 已露出需求走软迹象的品牌，出资前应把从经销商取得 cohort
              存活数据，或通过客户调研补齐数据，列为最高优先级尽调事项。
