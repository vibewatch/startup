companyProfile:
  summary: >-
    Avatr Technology 是一家总部位于重庆的高端智能 EV 公司；其当前形态来自 2018 年 Changan-NIO 合资公司，并在 2021 年围绕 Changan-Huawei-CATL
    协作模式完成品牌重塑。公司销售更高端的 BEV 和 EREV 轿车、SUV，包括 Avatr 06、07、11、12；Huawei 提供智能驾驶与座舱栈，CATL 提供核心电池技术。IPO 阶段的公开报道显示，公司收入和销量到
    2025 年快速放大，但亏损仍在延续，对伙伴依赖很深，2026 年需求也在放缓；股权故事因此比单看品牌叙事复杂得多。
