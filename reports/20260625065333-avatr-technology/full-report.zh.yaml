chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与起源
        blocks:
          - type: paragraph
            body: >-
              Avatr Technology 是一家中国高端新能源汽车公司；其当前公司身份可追溯到 2018 年 7 月 10 日 Changan Automobile 与 NIO 设立的合资公司。品牌没有停在原点：2021
              年 8 月，公司更名为 Avatr Technology，并围绕管理层和合作伙伴报道所称的 Changan-Huawei-CATL 协作模式重新定位。这段起源很关键，因为它解释了 Avatr
              为什么更像一个由不同支持方拼出的整车平台，而不是只靠一套自有技术栈单打独斗的独立创业公司：制造、软件智能和电池供应分别来自不同靠山。


              公司的重心在重庆两江新区；面向公众的材料也显示，运营版图还包括上海和慕尼黑全球设计中心。Avatr 因此既有国内生产与管理基地，也明确摆出国际化设计姿态。它的身份叙事不只是“又一个 EV
              品牌”，而是一个有国资关联、依赖伙伴的高端 EV 平台；早期合法性来自中国蓝筹产业赞助方、高端设计叙事和高端产品组合，而不是自力更生或早期盈利。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO011
              - CO021
              - CO058
      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              2023 年底之后，Avatr 的领导层画像发生实质变化。与早期品牌建设紧密绑定的原董事长 Tan Benhong 在 2023 年 12 月被免职。经营领导权随后集中到 Chen Zhuo 身上：他于 2023
              年 12 月出任总裁，2024 年 2 月又成为法定代表人。董事长职位在 2025 年 9 月再次转给 Wang Hui；他是 Changan 长期高管，这一背景说明，Avatr 准备 IPO
              并尝试国际化扩张时，母公司监管在收紧。


              到 2026 年，治理看起来更像机构化体系，而非创始人主导。Wang Hui 晋升、Zhu Huarong 此前临时监督，以及 Changan 的核心角色，都说明 Avatr
              被放在更大汽车体系内，作为战略重要的关联公司来治理，而不是创始人控制的创业公司。Nader Faghihzadeh 担任首席设计官并领导慕尼黑工作室，则给产品治理增加了重要平衡点，因为 Avatr
              的高端定位高度依赖设计连续性。即便如此，公开记录仍没有完整披露董事会名单、委员会结构和少数股东治理权，外部很难看清决策制衡机制。
