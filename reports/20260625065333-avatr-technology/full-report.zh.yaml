      - number: '3.2'
        title: 能力宽度与定价压力
        blocks:
          - type: paragraph
            body: >-
              能力重叠真实存在，但 Avatr 的定价意味着买家期待的不只是合格硬件。Avatr 07 和改款 Avatr 11 把可见高端价格带框在约 RMB 249,900 到 RMB 289,900，显著低于德国豪华
              EV 旗舰，但仍高于很多国内替代品。NIO 价格更高，并靠换电和车主社区锁定形成差异化。XPENG 推进智能驾驶覆盖宽度，也能把城市 NOA 覆盖包装成软件驱动的升级理由。AITO 面向几乎同一批买家销售
              Huawei 相关高端定位，但旗舰价格更高。BMW 和 Mercedes 定价高得多，但仍然重要，因为它们为富裕升级买家设定了声望天花板。结果是两头挤压。Avatr
              若下探，就有被更便宜的国内集团产品蚕食的风险；若上攻，就会撞上历史更久、品牌更强的对手。因此，Avatr 最好的防守不是绝对低价，而是在高端设计、Huawei
              加持功能、电池或充电信心的交叉点上，给出更优价值方程。
