      - number: '3.3'
        title: 分销能力、转换成本与伙伴杠杆
        blocks:
          - type: paragraph
            body: >-
              分销和锁定，是 Avatr 仍落后于最强对手的地方。NIO 在这组公司里构建了最清晰的购后护城河，因为其换电网络和车主社区创造了实际与情感转换成本；Avatr 目前没有披露类似能力。BMW 和 Mercedes
              仍受益于长期建立的经销商和服务信任，即便它们的软件主张看起来不如中国以 Huawei 为中心的高端买家需求那么贴合。Avatr 确实拥有独立创业公司很难搭起的杠杆：Changan 制造基地、Huawei
              零售与服务整合，以及截至 2024 年底已覆盖 25 个国家 55 家渠道伙伴的出口网络。这些资产重要，因为高端 EV
              转化取决于试驾触达、服务信心和感知生态连续性。即便如此，伙伴实力不等于自有分销能力。Huawei 支持多家 OEM；Avatr
              的出口足迹相对全球存量巨头仍处早期；公开证据也尚未显示出那种让买家购后形成结构性绑定的专有基础设施、车主网络或服务密度。
