  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与结构
        blocks:
          - type: paragraph
            body: >-
              Avatr 的财务披露仍有限，但 2025 年 11 月香港招股书终于给承销分析提供了可用收入基线。2025 年上半年收入达到 RMB 12.2 billion，同比增长 98.5%，同期交付 56,729
              辆。结构仍高度硬件驱动：RMB 11.5 billion 来自整车销售，服务、技术和售后仅贡献 RMB 718 million。这意味着，即便 Avatr 有 Huawei
              相关智能驾驶定位，它还不是一个软件式经常性收入故事。Avatr 07 和 Avatr 11
              的公开价格点显示品牌仍在高端带，但按交付量倒推的上半年单车整车收入低于标价，说明促销定价、产品组合、税费或渠道因素稀释了实际收入。承销含义很直接：增长真实存在，但收入质量仍由一次性整车交付主导，而不是黏性的经常性变现。
