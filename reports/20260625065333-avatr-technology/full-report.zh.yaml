      - number: '5.5'
        title: 质量、安全事件与空气动力学真实性争议
        blocks:
          - type: paragraph
            body: >-
              Avatr 的产品技术故事带有三类有记录的质量风险，投资人在给予完整高端可信度前必须评估。第一，车辆起火事件：2025 年至少三辆 Avatr 车辆起火，引发中国社交媒体明显关注，也引来 SAMR（State
              Administration for Market Regulation）监管注意。第二，投诉量：Avatr 07 在 2025 年 9 月和 10 月登上全国新能源汽车投诉榜首，累计 268
              起有记录投诉，是这两个月所有车型中最高；问题集中在软件、制动和装配质量。第三，空气动力学真实性争议：2025 年中，Elon Musk 转发了一段中国社交媒体视频，质疑 Avatr 12 宣称的 0.21 Cd
              风阻系数在可见造型元素下是否可实现；视频也引发对测量方法的担忧。Avatr 发布技术反驳，捍卫其 Cd 数字，但没有公开第三方风洞认证，问题因此只被部分关闭。Yuantrends
              分析把这些事件放在更广泛的质量感知挑战中讨论。drive.com.au 和 Carscoops 的独立评测则对 Avatr 12 和 11
              的制造质量、内饰材料和技术整合给出正面评价，对投诉数据形成部分对冲。但投诉集中在 Avatr
              07——同一款被用于高销量出口的车型——给国际扩张论点带来尽调风险。出口爬坡开始时，销量最高车型出现反向制造质量信号，实质相关。
