      - number: '1.5'
        title: 规模与反向核查
        blocks:
          - type: paragraph
            body: >-
              Avatr 的规模画像到 2025 年明显改善，但财务仍脆弱。收入从 2022 年仅 RMB 28 million 增至 2023 年 RMB 5.65 billion、2024 年 RMB 15.2
              billion；2025 年上半年收入达到 RMB 12.21 billion，毛利率改善至 10.1%。交付量从 2022 年 114 辆，放大到 2023 年约 27,000 辆、2024 年 61,588
              辆、2025 全年超过 120,000 辆。到 2025 年 5 月，公司还报告了较广商业覆盖：在 212 个城市拥有超过 700 个销售和服务网点，并先进入泰国和香港，之后到 2026 年 6 月扩展至 40
              多个国家。


              反向视角同样重要。Avatr 在增长阶段始终亏损：2022 年至 2025 年上半年净亏损累计约 RMB 11.31 billion。2025 年销量只达到 220,000 辆目标的大约 54%；据报道，2026
              年一季度销量同比下滑 53.5% 至 11,392 辆，引发外界对需求弹性和 2025 年末动能可持续性的疑问。Changan 2026 年 4 月推出“1445”效率计划，提出 Avatr 与 Deepal
              共享中后台职能，潜在节省 20% 至 30% 成本；这说明管理层已经意识到，需要改善经营杠杆，而不能只靠表面销量增长。
