  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资 thesis 与建议
        blocks:
          - type: paragraph
            body: >-
              Avatr 作为产业项目更容易让人喜欢；作为一笔价格干净的股权进入，则更难承保。正面逻辑是真实存在的：Changan、Huawei 和 CATL 给了公司罕见的制造、软件和电池杠杆；2025 年 11
              月招股书终于披露了有意义的规模，2025 年 H1 收入达到 RMB 12.2 billion，毛利率改善至 10.1%；品牌在 06、07、11 和 12
              车型家族中仍保持高端定位。这些事实支撑的是一个正在发生、而非假设中的商业化故事。它们也意味着 Avatr 不是种子阶段概念公司；它已进入一个规模区间，利润率和渠道执行应开始比纯叙事更重要。


              反面 thesis 对价格纪律更有约束力。最后一个被广泛引用的私募估值约 RMB 30 billion，形成于 IPO 失效之前，也早于 2026 年急剧放缓变得明显之前。Autonewgen
              的负面评论认为，Avatr 的香港 IPO 故事跑在销量前面；CarNewsChina 则报道，2026 年 Q1 批发量只有 11,392 辆，同时 Changan 计划融合 Avatr 与 Deepal
              的中后台运营。公开证据也没有披露现金 runway、清算优先权、分车型实际
              ASP，或服务能否重要到支撑类软件倍数。这组事实支持「继续研究」，而不是买入或回避：公司仍可能挣回轮次价格，但当前公开证据还不能证明，这一结果在风险调整后有足够吸引力。
