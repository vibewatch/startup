      - number: '6.4'
        title: 客户满意度、投诉与质量信号
        blocks:
          - type: paragraph
            body: >-
              Avatr 的客户满意度证据好坏参半。正面信号来自独立国际评测者（Drive.com.au、Carscoops、ZigWheels UAE）、Avatr Thailand 网站上的泰国客户证言，以及品牌在
              2025 年维持高于平均的成交价（¥270,000+）的能力。但国内反向信号很实在。Avatr 07 在 2025 年 9 月和 10 月登上中国全国新能源汽车投诉榜首，共 268
              起投诉，是这两个月单一车型中的最高值。投诉集中在软件表现、制动响应不一致和装配质量。2025 年至少报告了三起 Avatr 车辆起火事件，引发社交媒体关注和监管审视；但审阅来源没有确认正式召回。围绕 Avatr
              12 宣称 0.21 Cd 的空气动力学争议——Avatr 对 Elon Musk 放大的社交媒体批评作出反驳，却拒绝发布风洞认证——损害了其在中国技术参与度较高买家中的品牌可信度。YuanTrends
              分析直接把这一事件与豪华感知风险相连，认为高端品牌定位需要无瑕的技术可信度。总体来看，Avatr 是一个技术吸引力强、但在销量爬坡高点正面临质量感知挑战的品牌。尤其令人担忧的是，投诉激增来自 Avatr
              07——这款最高销量车型正被用于国际出口；这会影响新市场的品牌可持续性。
