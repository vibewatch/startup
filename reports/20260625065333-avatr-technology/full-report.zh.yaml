      - number: '7.2'
        title: 监管、法律与地缘政治风险
        blocks:
          - type: paragraph
            body: >-
              中国对智能网联汽车的监管姿态是在收紧，而不是放松。2025 年 2 月，MIIT / SAMR 通知把准入、召回和 OTA
              软件升级纳入更严的安全治理框架，并要求制造商把产品测试和验证当作核心义务，而不是营销口号。对 Avatr 来说，这很关键：它的软件重定位依赖 OTA
              迭代、智能座舱功能和辅助驾驶，一旦实际表现与文档不一致，就可能触发召回或执法。数据法又加了一层风险。基于中国《网络安全法》《数据安全法》《个人信息保护法》和 2021
              年汽车数据规定的汽车合规评论，把车辆视作收集个人和环境信息的移动数据中心；Avatr 的 app 连接、云端更新车队，一旦国际扩张扩大数据流，就会产生隐私、本地化和跨境传输风险。地缘政治上，Huawei
              仍处在美国正式限制架构下，CATL 也在公开回应美国国会审查。这意味着即使公开来源中尚未出现针对 Avatr 的直接执法事件，Avatr 的伙伴栈也已经暴露在制裁外溢风险之下。
