  - id: TV002
    title: 正向论点 / 反向论点表
    columns:
      - 视角
      - 支持证据
      - 反向观点 / 反向论点
      - 哪些证据会改变判断
    rows:
      - - 市场
        - 中国仍是全球最大 EV 市场，BNEF 仍认为 2026 年 EV 增长由中国领跑。
        - S&P、Wood Mackenzie、EIU 和 Frost 都指出，2026 年激励退坡、需求转弱、利润率承压。
        - 如果能证明不靠补贴也能提升份额，论点会更强。
      - - 产品
        - Avatr 在 06/07/11/12 家族上已有可见的高端产品组合。
        - 高端 EV 竞争密集，2026 年一季度显示，可见度向持续销量的转化偏弱。
        - 按车型和配置披露的终端销售与实际 ASP，可澄清产品市场匹配度。
      - - 客户
        - 品牌和伙伴定位帮助 Avatr 触达更高收入买家。
        - 公开来源未显示 cohort 留存、订单积压质量或出口终端销售。
        - 按月披露车型 / 渠道终端销售和取消数据，可提升客户侧信心。
      - - 财务
        - 2025 年上半年收入和毛利率改善，给出运营证明。
        - 现金跑道、全年审计盈利路径和服务变现仍不透明。
        - FY2025/FY2026 审计报表加利润率桥接，可能把判断推向跟踪。
      - - 竞争
        - 战略股东提供制造、软件和电池杠杆。
        - 上市同业已在压缩的行业倍数下，提供更多披露和公开流动性。
        - 更低入场价格或更强披露，可能抵消同业比较劣势。
      - - 风险
        - 后台整合可能降低成本、改善杠杆。
        - 同样的整合也可能暗示独立经济性或品牌独立性更弱。
        - 如果能证明成本共担在不伤害品牌自主权的情况下抬升利润率，风险会下降。
    notes: 各单元格按分析视角概括最强支撑和反驳；这张表是解释性判断，不是原始事实快照。
