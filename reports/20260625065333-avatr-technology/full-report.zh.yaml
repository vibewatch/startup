        title: 运营与伙伴依赖风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Avatr 卡在中国 EV
              栈里一个尴尬位置：它足够高端，必须把智能座舱、ADAS、服务和品牌执行做到无瑕；但规模还不够大，无法吸收持续的市场折扣、支持成本或反复的整合失误。产品和技术页面展示的是一套连接化、OTA 驱动，并与 Huawei
              操作系统整合的车辆架构；CATL 和 Avatr 材料则指向难以快速替代的电池与软件依赖。Changan 对销量下滑的答案，是在研发、供应链和制造上与 Deepal
              做后台整合。这可能改善成本控制，但如果共享职能按 Deepal 的规模而不是 Avatr 的高端一致性优化，也会抬高执行风险。在这种设定下，软件发布延迟、电池分配问题、监管质量事件或网络 /
              控制故障，都不会只停留在工程端；它们会立刻打到客户体验、渠道可信度和本已脆弱的融资叙事。因此，依赖图把 Huawei、CATL 和 Changan 视为单点放大器，而不是普通供应商。
