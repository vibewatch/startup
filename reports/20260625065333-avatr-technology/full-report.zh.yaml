  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >-
              分析 Avatr 时，不能把它当成在争夺整个中国汽车需求，甚至也不是整个中国 NEV 需求。证据指向更窄的市场边界：中国高端智能乘用 EV，尤其是中高端和高端轿车、SUV
              细分市场；在这些市场里，软件体验、充电表现、感知电池质量和品牌地位会显著改变购买行为。因此，纳入支出包括高端乘用 EV 购买、从传统豪华车或 Tesla
              升级而来的融资购车，以及帮助成交并留住这些买家的服务和软件体验。不纳入的支出包括上游电池制造、RMB 100,000 到 RMB 200,000
              的大众市场走量带（除非它充当价格锚）、商用卡车电动化，以及宽泛的汽车出口价值。这个区分很关键：广义中国 EV 市场无疑很大，但 Avatr 的实际 SAM 取决于高端消费者是否认为，Huawei 加持的智能化和
              CATL 背书的性能，足以支撑更高成交价；而此时国内冠军品牌正同时向下、向上挤压。
