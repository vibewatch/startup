      - number: '8.2'
        title: 估值语境与融资纪律
        blocks:
          - type: paragraph
            body: >-
              Avatr 的核心估值问题在于：已披露运营规模足以让人用可比公司法承保，但披露还不足以支撑高确定性的私募估值。Series C 融资超过 RMB 11 billion，完成后 Changan 持股
              40.99%，CATL 持股 14.1%；独立报道称，该轮把估值从约 RMB 14.1 billion 推高到约 RMB 30 billion。只有当 Avatr 在下一周期把收入做到约 RMB 15
              billion 至 RMB 20 billion 时，这个估值才能被解释为约 1.5x-2.0x 2027 年收入。车辆数学让它成为可能，但并不安全：每年 50,000 至 60,000 辆、RMB
              250,000 至 RMB 300,000 的价格带，在车型组合、折扣和服务之前，只对应约 RMB 12.5 billion 至 RMB 18.0 billion 的收入能力。


              因此，进入纪律比公司质量叙事更重要。香港仍是一个可行退出场所，但公司还没有证明自己具备 NIO 和 Zeekr 已经提供的上市同行披露节奏。与此同时，中国 EV 市场背景比 2021-2022
              年扩张期更不宽容。S&P、Wood Mackenzie、EIU 和 Frost 都描述了一个 2026 年市场：激励退坡、需求转弱，除规模赢家外，盈利更薄。在这种环境下，如果 Avatr
              用审计数字和恢复中的销量重新打开 IPO 窗口，RMB 30 billion 账面估值仍可能过关；但今天的公开证据指向更窄的 base-case 区间，也指向一个真实的 bear-case 折扣——如果 IPO
              再次滑延，或与 Deepal 的整合显示独立经济性更弱。
