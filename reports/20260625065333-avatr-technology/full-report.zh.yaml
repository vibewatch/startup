        - 这些条款决定 RMB 30B 的头部标记对新资金是否有真实经济意义。
        - 律师 / 财务团队；取得股东协议和股权结构瀑布。
      - - 按车型和渠道的售出
        - 月度零售和批发量、积压订单、取消、激励以及出口组合。
        - 这能区分 Q1 临时下滑，还是更深的需求或渠道问题。
        - 销售运营；索取按车型拆分的经销商、DTC 和出口报告。
      - - Yinwang 与伙伴经济性
        - 连接 Huawei、CATL、Changan 以及 RMB 11.5B Yinwang 股权的商业条款。
        - 伙伴杠杆是护城河和利润率的核心，但经济性未公开。
        - 战略 / 法务；审查合作协议和转移定价逻辑。
      - - 软件 / 服务变现
        - 附加率、订阅、OTA 收入和服务毛利率。
        - 软件相邻估值需要证据证明收入能从一次性整车销售之外多元化。
        - 产品财务；索取按功能拆分的分群和变现数据。
      - - IPO 准备包
        - 重新递表时间线、保荐人反馈、未解决监管意见和募集资金用途。
        - 退出时点决定持有期，也决定能否通过上一轮估值。
        - 投行 / 法务；索取最新上市时间表和意见日志。
    notes: 每一项请求都经过筛选，因为一旦解决，可能实质改变建议、信心或估值立场。
    claimRefs:
      - CV010
      - CV017
      - CV031
      - CV037
      - CV040
      - CV041
      - CV042
      - CV046
