      - number: '2.3'
        title: 买家、用户与预算所有者分层
        blocks:
          - type: paragraph
            body: >-
              市场证据支持消费端主导的买家模型，而不是车队主导模型。Avatr 的产品和定价最自然对应城市高端家庭、偏技术的专业人士，以及 SUV 或轿车升级买家；他们能够自付或融资购车，且常把 Avatr 与
              Tesla、Nio、Li Auto、XPeng、Zeekr、AITO、BMW、Mercedes-Benz 或 Audi
              备选项比较。在这条购买链路里，买家、用户和付款方通常是同一个家庭；因此，采用路径更少取决于集中采购，更取决于展厅触达、试驾质量、金融方案、置换逻辑、软件信任和售后信心。Huawei 生态亲和力很重要，因为中国高端
              EV 买家越来越把座舱智能、辅助驾驶和智能设备连续性视为核心标准。CATL 也重要，因为电池信任和充电表现会降低感知换车风险。Avatr 2026 年与 Huawei Smartcom
              的零售和服务整合，因此不只是运营故事，而是市场准入杠杆：它可以扩大线下触达，并让那些在购买新国产高端品牌前要求豪华服务一致性的客户更相信这个品牌。
