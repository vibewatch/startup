      - number: '1.3'
        title: 资本结构与投资人
        blocks:
          - type: paragraph
            body: >-
              Avatr 是同代中国 EV 创业公司中融资更重的一家。围绕 2024 年 12 月 Series C 的公开报道显示，公司仅该轮就融资 RMB 11.1 billion；到推进香港上市时，四轮累计融资已超过
              RMB 19 billion。IPO 报道披露的 Series C 后股东结构中，Changan Automobile 以 40.99% 领投股权，之后是 CATL 的 14.1% 和 Chongqing
              Yu’an 的 8.81%；NIO 已不在当前股东名单上。这是从 Avatr 最初 Changan-NIO 起源演化而来的显著变化，说明股权表已转向产业存量巨头和地方国资资本。


              与 IPO 相关的报道也把公司估值放在区间里，而不是一个确认数字：一个信号指向约 RMB 26 billion，另一个信号指向约 RMB 32 billion。Avatr 于 2025 年 11 月 27
              日递交香港 IPO 申请，由 CITIC Securities 和 CICC 担任保荐人，目标募资约 US$1 billion；但申请在标准六个月窗口之后，于 2026 年 5 月 27
              日失效。管理层称重新递表计划不受影响，这降低了即时信号伤害；但 2026 年 2 月 CSRC 对股权合规、外资准入和数据安全的反馈表明，融资路径并不顺滑。
