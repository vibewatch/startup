      - number: '2.2'
        title: 受证据约束的市场规模测算
        blocks:
          - type: paragraph
            body: >-
              给 Avatr 测算市场，最稳妥的方法是用分层镜头，而不是押一个英雄式 TAM 数字。最宽口径下，中国 2025 年仍是全球最大汽车市场，销量 34.4 million 辆，乘用车销量创纪录，给 Avatr
              提供了巨大的自上而下需求池。收窄一层，中国 NEV 销量达到 16.49 million 辆，国内需求仍占主导，12 月渗透率突破 52 percent。再收窄一层，Oxford
              Energy、ThinkerCar 和 Viotech 的 2026 年展望都指向继续扩张，渗透率大约走向 55% 至 60%，尽管增速预计会从 2025 年的狂飙节奏放慢。难点在于，Avatr
              精确价格与功能边界上的高端智能 EV 需求，没有在公开数据集中被清晰披露。第三方市场价值估算，包括约 $378 billion 的中国 EV 市场口径，有助于提供背景，但对 Avatr 的实际 SAM
              过宽。因此，本章把中国 NEV 总量作为 TAM 背景，把高端智能乘用 EV 作为 SAM 逻辑，把 Avatr 当前销量规模作为更扎实的 SOM 代理。
