      - number: '8.4'
        title: 打破 thesis 的触发条件与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              使用本章最清晰的方法，是把会改善判断的因素和会打破判断的因素分开。如果 Avatr 能证明 2026 年 Q1 放缓只是暂时的，香港流程可以在不重置估值的情况下重启，并且 Series C 后的经济性没有被
              RMB 11.5 billion Yinwang 投资压垮，判断就会改善。如果公司仍卡在每月约 5,000 至 7,000 辆以下，如果 IPO 在没有审计进展的情况下滑入 2027
              年，或如果伙伴依赖从杠杆变成对定价、品牌或软件经济性的约束，判断就会破裂。


              这些条件让最终尽调清单异常具体。投资者不需要另一份关于高端定位的叙事备忘录；他们需要审计后的 FY2025 和 FY2026 财务、带优先条款的完整 cap table、按车型和渠道拆分的
              sell-through，以及 Huawei、CATL 和 Yinwang
              安排的商业逻辑。如果这些要求反馈强劲，建议可以在更低或支撑更充分的进入价格上转向跟踪或买入。如果没有，最可能的结果不是一颗被忽视的有吸引力宝石，而是一项战略上重要、但私募账面价值持续跑在公开市场证据前面的资产。
