  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 车型阵容：六个量产车型家族，覆盖 SUV、轿车、旅行车与 EREV
        blocks:
          - type: paragraph
            body: >-
              Avatr 的商业化产品组合覆盖六个量产车型家族，并由三个核心 Qiankun (CHN) 技术层级版本锚定。Avatr 11 是一款中大型 SUV，双电机版本提供 720 km CLTC 续航，综合输出 580
              kW，可在 3.6 秒完成 0–100 km/h；它于 2022 年作为品牌首款车型上市，入门价格约 ¥358,000。Avatr 12 是四门 fastback 轿车，拥有 700 km CLTC 续航、3.4
              秒 0–100、HarmonyOS 4.0 座舱和 Huawei ADS 3.0 智能驾驶；起价约 ¥299,000，并在 2025 年新增 HarmonyOS 5.0 更新版本。Avatr 07
              是品牌销量最高的车型，提供纯 EV 版本和 EREV 版本：纯 EV 版本搭载 82.16 kWh CATL Shenxing 电池（650 km CLTC，420 kW 峰值充电），EREV 版本搭载 52
              kWh Freevoy 电池系统（333 km 纯电续航，1,200 km 综合续航）；两者均在 2025 年末上市。Avatr 06 是一款较小的四门轿车，起价 ¥229,000；06T
              则是五门旅行车，在中国约 ¥209,000 起，宣称 741 km CLTC 续航，并提供 955 hp 三电机配置。面向收藏级买家的限量 011 和 012 车型，以极端性能规格补齐阵容。设计方向由常驻慕尼黑的
              CDO Nader Faghihzadeh 主导；他加入 Avatr 前曾在 BMW 工作 17 年，慕尼黑设计中心也补充了重庆工程基地。这种产品宽度让 Avatr 区别于单一细分市场的中国高端 EV
              同业，但也要求高端零部件放量，从而抬高营运资本强度。
