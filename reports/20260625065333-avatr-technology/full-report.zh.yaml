        title: 客户群分层与买家画像
        blocks:
          - type: paragraph
            body: >-
              Avatr 的公开客户证据指向中国高端细分市场买家；他们把智能驾驶技术、品牌声望和充电便利性放在总拥有成本之前。典型 Avatr 买家在 ¥229,000 到 ¥400,000+ 价格带选择车型，使 Avatr
              高于走量 NEV 品牌（BYD、Xpeng），并大致与高端 EV 层级的 NIO 和 Li Auto 平齐。品牌明确瞄准中国一二线城市的高收入城市专业人士；这与其分销重点一致：截至 2025 年中，覆盖 212
              个城市、700+ 网点，触达 82% 的地级市。按地域看，大中华区贡献绝大多数收入；泰国是第一个有意义的国际市场，已交付 1,000+ 辆并拥有 7 家展厅。UAE
              和澳大利亚是早期测试市场，有评测覆盖，但确认交付量有限。付款方画像主要是直接购车或租赁的零售消费者；官方材料提到企业买家，暗示小但增长中的车队成分。Avatr 没有公开披露任何渠道伙伴或车队买家数据。Avatr
              07 EV 和 EREV 从 2025 年四季度起成为主导销量引擎；相对 11 和 12，07 的较低入门价格扩大了可触达买家池。11 和 12 服务更窄的超高端人群，06 和 06T 则把覆盖向下延伸到
              ¥229,000 价位。细分市场集中风险很高：现有证据显示，Avatr 深度依赖中国国内上高端 EV 细分市场；任何宏观放缓、这一层级的竞争价格战或需求饱和效应，都会实质损害销量轨迹。
