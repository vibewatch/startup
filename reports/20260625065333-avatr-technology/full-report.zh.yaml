      - number: '6.5'
        title: 集中风险、留存缺口与竞争动态
        blocks:
          - type: paragraph
            body: >-
              Avatr 面临三项结构性集中风险，而现有客户证据无法解决。第一，渠道集中：2026 年 4 月 14 日签署的 Huawei Smartcom 零售整合协议，加深了对 Huawei
              商业网络的分销依赖。虽然这提供了触达 Huawei 1,700+ Smartcom 门店的机会，但也意味着一旦 Huawei-Avatr
              商业关系恶化，客户触达和售后服务会同时受损。第二，地域集中：大中华区占交付的压倒性份额。国际爬坡真实存在（泰国 1,000+ 辆），但仍处早期；任何国内需求冲击——包括 2026
              年一季度逆转——在当前规模下都无法被国际销量抵消。第三，车型集中：Avatr 07 家族现在驱动大部分月交付。如果其销售动能不能从 2026 年一季度下滑中恢复，整体品牌健康会迅速恶化。留存方面：Avatr
              没有公开披露净收入留存、总留存、客户复购率或队列存活数据。对于一个只有三年历史、产品周期仍在扩展的品牌，这很正常；但也意味着，承销未来需求时，只能依赖短期销售趋势，而不是客户层面的耐久性证据。2026
              年一季度下滑是值得连续多个季度监测的领先指标；在判断它是车型周期低谷还是结构性竞争替代之前，需要更多数据。
