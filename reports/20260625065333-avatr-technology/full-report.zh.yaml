      - number: '5.2'
        title: 800V SiC 平台与 CATL Shenxing 电池系统
        blocks:
          - type: paragraph
            body: >-
              Avatr 的动力与能量架构建立在 800 伏碳化硅（SiC）逆变器平台上；该平台支持超快充速度，撑起品牌高端定位。部署在 Avatr 07 EV 上的 CATL Shenxing Pro 电池，提供 420
              kW 峰值充电功率，标称 5C 充电倍率；在理想条件下，电芯可在约 5.5 分钟内从 10% 充至 80% SOC。CATL 称，Shenxing Pro 化学体系凭借新的凝聚态电解质结构，实现 460
              Wh/kg 的电芯级能量密度。BatteryDesign.net 的独立电池工程分析也印证了电芯化学差异化：带半固态电解质的碳锂合金负极，在保持快充能力的同时，比传统 NMC 电芯实现更高能量密度。07 EREV
              版本采用 CATL 的 Freevoy 增程系统：52 kWh 锂电池包搭配高效率增程发动机，提供 1,200 km 综合续航，瞄准充电稀疏地区存在里程焦虑的买家。平台级整合通过 CHN 框架管理：CATL
              供应电池包和电池管理系统，Changan 提供平台底盘和制造，Huawei 整合电驱、电力电子和充电管理。到 2026–2027 年，随着 BYD、NIO、Xpeng 各自在重叠细分市场推出 800V
              平台，Avatr 的“高端 800V 先发”叙事可能收窄。
