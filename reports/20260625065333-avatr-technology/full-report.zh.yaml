      - number: '4.4'
        title: 财务缺口与结论
        blocks:
          - type: paragraph
            body: >-
              财务结论是好坏参半。Avatr 已进入有意义的收入规模，2025 年上半年收入较上年接近翻倍，显示市场牵引力真实存在。但收入结构仍集中在整车销售，公开披露没有给出足够的毛利和现金消耗透明度；一旦纳入
              Yinwang 收购，资产负债表故事就显得吃紧。反向数据进一步削弱信心：CarNewsChina 报道称，2026 年一季度交付环比暴跌 41.6%，Changan 随后推动 Avatr 与 Deepal
              运营融合。这两个信号说明，管理层仍在优化运营模型，而不是已经顺滑走向自我融资规模。对尽调而言，缺失指标不是装饰性问题。需要毛利率来判断高端定价能否覆盖电池、制造和渠道成本；烧钱率和现金余额决定 IPO
              是可选项还是必要项；还需要单车单位经济来判断增长是否创造价值。本章结论是，Avatr 拥有可信规模，但尚未具备可融资的透明度。
