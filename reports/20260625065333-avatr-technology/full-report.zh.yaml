      - number: '3.4'
        title: 护城河耐久性、商品化风险与反向证据
        blocks:
          - type: paragraph
            body: >-
              Avatr 最重要的竞争证据是反向的。CarNewsChina 报道称，在 Avatr 2026 年一季度销量据称同比下滑 41.6% 之后，Changan 计划于 2026 年 4 月融合 Avatr 和
              Deepal 的运营。这件事的意义超出一个糟糕季度，因为 Deepal 本就处在更低价位；如果母公司优先优化效率而不是品牌区隔，Avatr 的品牌阶梯可能被模糊。BYD 通过 Yangwang 和 Denza
              高端上攻，加上 Zeekr 与 Li Auto 的规模，也强化了同一信息。Avatr 试图守住国内市场的高端位置，但在这个市场里，资金更足或交付量更大的对手可以迅速补齐功能缺口。就连 Avatr
              的资本市场路径也说明护城河还没完成。融资和香港递表支撑其战略雄心，但缺少美国上市路径，且未上市公司的折价图景仍不清楚，留下一个问题：Avatr
              到底能维持多少定价权或品牌自主性。公司可以拿份额，但按当前证据，其护城河由伙伴赋能，仍易受到商品化、内部重叠和销量冲击的侵蚀。
