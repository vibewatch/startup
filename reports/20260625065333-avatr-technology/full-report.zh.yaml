            title: 最强验证：泰国落地、评测背书与 Motor Expo 订单
            body: 泰国是目前最强的公开海外客户证据：官方经销商、7 家展厅、已交付 1,000+ 辆、Motor Expo 获得 1,103 个订单，还有三条独立评测引用。它证明 Avatr 已能量产出口，而不是停在概念阶段。
            calloutType: strength
            claimRefs:
              - CU014
              - CU015
              - CU016
              - CU017
          - type: callout
            title: 2026 年 Q1 同比下滑 41.6%，是最主要的反向信号
            body: >-
              2026 年 Q1 只有 11,703 辆，而 2025 年 Q1 为 20,073 辆。Avatr 面临一个结构性检验：2025 年的加速，到底是新品周期需求，还是可持续渗透。Changan 宣布与
              Deepal 融合、Huawei Aito 竞争加剧，都强化了这一结构性担忧。
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
              - CU028
          - type: callout
            title: Avatr 07 投诉激增，是最突出的客户满意度反向信号
            body: Avatr 07 在 2025 年 9 月和 10 月有 268 起投诉，并登上全国投诉榜第 1 名，直接冲击高端品牌叙事。该车型正是出口泰国、并被定位为国际销量主力的车型。
