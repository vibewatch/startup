      - number: '1.4'
        title: 产品与技术
        blocks:
          - type: paragraph
            body: >-
              Avatr 现有产品覆盖 Avatr 11 SUV、Avatr 12 轿车、Avatr 07 中型 SUV 和 Avatr 06 中型轿车，形成横跨 SUV 与轿车车身形式的高端组合。2025 年 Avatr
              07 发布尤其重要，因为它集中体现了 Avatr 希望投资人买单的伙伴技术栈：Huawei ADS 4 标配智能驾驶能力、CATL 电池，以及 RMB 219,900 以上起步的高端定价。Avatr 06 在
              2026 年 4 月上市，把这套逻辑延伸到另一个中型细分市场，提供四个 BEV 和增程版本，价格为 RMB 209,900 到 RMB 279,900。


              技术故事的核心不是自有单一供应商栈，而是可控整合。Changan 提供整车产业底盘，Huawei 贡献座舱与 ADAS 层，CATL 锚定电池；Avatr
              再把结果包装成一个以设计为主导定位的高端品牌。这一路径也延伸到公司战略。Avatr 花 RMB 11.5 billion 买入 Huawei Yinwang 10% 股权，2026 年 4 月与 Huawei
              签署 SmartCom 零售服务整合协议，并借 Avatr 011、012 等限量联名款打造光环吸引力。代价是，技术差异化和渠道控制仍明显依赖伙伴。
