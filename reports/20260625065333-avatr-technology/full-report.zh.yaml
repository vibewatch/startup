      - number: '4.2'
        title: 定价、GTM 代理指标与单位经济
        blocks:
          - type: paragraph
            body: >-
              Avatr 的公开变现模型，是高端整车销售加上一层仍很小的服务与技术收入。Avatr 07 起价 RMB 249,900，Avatr 11 改款起价 RMB
              289,900，但公开材料没有披露实际成交价、选装率、金融激励或软件附加经济。能观察到的是，公司采用伙伴很重的运营模型：Changan 提供制造和共享平台基础设施，Huawei
              支持智能座舱与零售服务整合；Avatr 披露，截至 2024 年 12 月，其在 25 个国家拥有 55 家渠道伙伴。即便没有 CAC 披露，这些事实也能充当 GTM 效率代理，因为它们意味着 Avatr
              并非从零搭建所有零售和服务能力。即便如此，最重要的单位经济字段仍缺席于公开证据。毛利率、单车交付烧钱、CAC、回本期和营运资本强度均未披露；因此，公开分析只能推断，资本效率高度依赖伙伴杠杆和规模，而不是已验证的单车盈利。
