  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序概览
        blocks:
          - type: paragraph
            body: >-
              Avatr 的风险栈由三类相互作用的威胁主导：香港 IPO 进程失效带来的融资风险，仍在淘汰弱者的中国 EV 市场中 2026 年销量疲弱带来的需求风险，以及核心高端差异化依赖 Huawei 软件、CATL
              相关电池技术和 Changan 母公司运营决策带来的战略依赖风险。这些风险不是孤立存在。市场背景仍在用折扣压力、产能过剩和功能差异收窄惩罚较弱的高端品牌；Changan 的应对方式也不是证明 Avatr
              能作为完全独立运营系统放大，而是把后台功能与 Deepal 合并。投资问题因此从简单增长，变成 Avatr
              能否在母公司、合作伙伴和监管方分别控制关键结果的情况下，守住高端定位、软件节奏和资本入口。因此，热力图和传导图把 Huawei / CATL 依赖、IPO 执行、国内销售疲弱和整合导致的品牌稀释，排在已诉讼 IP
              纠纷等较低阶法律未知项之前，因为前者决定近期生存边界。
