      - number: '7.4'
        title: 财务、执行与 IPO 风险
        blocks:
          - type: paragraph
            body: >-
              融资故事如今已和执行不可分割。AASTOCKS 报道称，Avatr 的 IPO 申请六个月后失效，管理层计划重新递表；但技术性重新递表，不等于上市确定性恢复，也不等于新资本到位。与此同时，Motorist 和
              Nepal Drives 描述的是一场由母公司主导的重组，触发点是 2026 年 Q1 销量大幅下滑，而 Avatr 仍背着一个远高于近期 run-rate 的 2030 年销量目标。这个错配很关键，因为
              2026 年中国 EV 市场仍面临补贴退坡、折扣压力，以及对中型品牌结构性更严酷的环境。Avatr 因此陷入双重约束：它需要高端执行和伙伴协同来重建需求，但整合应对本身又证明独立经济性并不会自我修复。若没有透明的
              burn、现金和 runway 披露，投资者只能假设：任何进一步需求失手、重新递表延迟或伙伴扰动，都会迫使 Avatr 更重地依赖 Changan 的战略耐心，或接受吸引力更弱的融资替代方案。
