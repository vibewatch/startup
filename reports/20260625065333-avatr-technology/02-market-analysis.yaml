- id: buyer-segmentation
  title: Buyer, User, and Budget Owner Segmentation
  body: The market evidence supports a consumer-led buyer model rather than a fleet-led one. Avatr's products and pricing map most naturally to urban premium households, technology-forward professionals, and SUV or sedan upgraders who can self-fund or finance a purchase and who often compare Avatr against Tesla, Nio, Li Auto, XPeng, Zeekr, AITO, BMW, Mercedes-Benz, or Audi alternatives. In this workflow, the buyer, user, and payer are usually the same household, which means the adoption path depends less on centralized procurement and more on showroom access, test-drive quality, financing, trade-in logic, software trust, and post-sales confidence. Huawei ecosystem affinity matters because the premium China EV buyer increasingly treats cockpit intelligence, assisted driving, and smart-device continuity as core criteria. CATL matters because battery trust and charging performance reduce perceived switching risk. Avatr's 2026 retail-and-service integration with Huawei Smartcom is therefore
    a market-access lever, not just an operations story, because it can widen offline reach and make the brand more credible to customers who want luxury service consistency before committing to a new domestic premium marque.
