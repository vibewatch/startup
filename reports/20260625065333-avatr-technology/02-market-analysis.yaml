- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for Avatr
  - Diligence ask
  rows:
  - - China NEV penetration still rising
    - Positive
    - 2025-2026
    - Supports category expansion even if growth moderates
    - Validate whether Avatr can outgrow the premium segment, not just the total market
  - - Chinese brands gaining share in NEVs
    - Positive
    - Structural
    - Helps domestic premium brands compete against foreign incumbents
    - Test whether share gains extend to the >RMB 250k premium intelligent tier
  - - Huawei- and CATL-linked product differentiation
    - Positive
    - Current
    - Improves showroom conversion and perceived technology credibility
    - Check whether differentiation survives as Huawei works with multiple OEMs
  - - Retail and service expansion through Huawei Smartcom
    - Positive
    - 2026 onward
    - Can reduce distribution friction and improve after-sales confidence
    - Measure actual store coverage, service SLAs, and conversion lift
  - - 2025 price war and margin compression
    - Negative
    - Current
    - Raises risk that Avatr sacrifices economics to chase volume
    - Request model-level gross margin and discounting discipline
  - - Industry overcapacity and consolidation
    - Negative
    - Structural
    - Increases survival pressure on subscale EV startups
    - Assess access to capital and breakeven durability
  - - Geopolitical export barriers in US/EU
    - Negative
    - 2026 onward
    - Makes overseas expansion more dependent on ASEAN and Middle East execution
    - Verify homologation, tariff, and channel economics by market
  - - Larger-scale premium rivals
    - Negative
    - Current
    - Makes volume-led competition unattractive for Avatr
    - Test whether service and software can sustain pricing power
  notes: The driver/constraint register ties category growth to execution risk. Positive factors mostly improve demand or access, while negative factors mainly pressure margins, scale efficiency, and export optionality.
