tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Avatr
  rows:
  - - China premium intelligent passenger EVs
    - Vehicles priced above the mass-market NEV band, plus premium software and service differentiation
    - Mass-market commuter EVs, battery cells, commercial vehicles, and generic auto exports
    - Affluent households and financed premium consumers
    - Core market where Avatr's pricing and feature set are directly comparable
  - - Upper-mid premium sedan and SUV upgrades
    - Trade-ins and financed upgrades from Tesla, German luxury ICE/EV, and high-end domestic brands
    - Entry EV buyers focused primarily on lowest sticker price
    - Urban household buyer who is also user and payer
    - Primary wedge for Avatr 06/07 and 11/12 families
  - - Smart-feature-led premium EV demand
    - ADAS, cockpit intelligence, charging-speed confidence, and service access tied to purchase conversion
    - Standalone software subscriptions or supplier revenue not bundled into the vehicle sale
    - Tech-forward premium buyer
    - Important because Huawei and CATL visibly shape brand preference
  - - Overseas premium EV expansion
    - Imported premium EV demand in ASEAN, Middle East, and selected emerging luxury markets
    - US/EU tariff-sensitive mass export assumptions
    - Distributor plus end-customer mix
    - Relevant as a medium-term relief valve, not the current core SAM
  notes: Boundary logic uses China NEV market totals as context but narrows included spend to premium intelligent passenger EV purchases and closely related conversion drivers; it excludes upstream battery economics and broad auto-manufacturing value.
