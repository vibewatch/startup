- id: TM002
  title: TAM/SAM/SOM or sizing lens table
  columns:
  - Lens
  - Publisher / source
  - Geography
  - Value
  - Methodology / inclusion
  - Confidence
  - Limitation
  rows:
  - - Total auto market
    - Viotech / MarkLines / CarNewsChina
    - China, 2025
    - 34.4M vehicle sales; 30.10M passenger vehicle sales
    - Top-down market context for all vehicle demand
    - Medium-high
    - Too broad for Avatr because it includes ICE and all price tiers
  - - China NEV TAM context
    - CAAM via CnEVPost / Viotech / CarNewsChina
    - China, 2025
    - 16.49M NEV sales; 47.9% penetration
    - Official or trade-report unit totals across BEV and PHEV passenger demand
    - High
    - Still far broader than Avatr's premium addressable slice
  - - 2026 penetration outlook
    - Oxford Energy / ThinkerCar / Viotech
    - China, 2026
    - ~55% to 60% penetration; domestic sales outlook up to 18.1M
    - Forward-looking demand lens using analyst and industry forecast ranges
    - Medium
    - Forecasts differ and do not isolate premium intelligent EVs
  - - Premium EV / luxury adjacency
    - DataInsightsMarket / SolarTechOnline
    - China, 2025
    - Luxury adjacency supportive; China EV market value lens about $378B
    - Broad value lens for premium and luxury demand environment
    - Low-medium
    - Methodology is broad and not specific to Avatr's price boundary
  - - Avatr grounded SOM proxy
    - CarNewsChina / CnEVPost / Reuters / Electrive
    - Avatr, 2025-H1 2026
    - 73,606 full-year 2025 sales; H1 2025 revenue RMB 12.2B
    - Uses Avatr's realized scale as the most concrete bottom-up anchor
    - Medium
    - Company scale is not a direct measure of total SAM
  notes: This table intentionally mixes broad market context, forecast bands, premium adjacency, and Avatr's own realized scale. It is evidence-constrained rather than a single-model TAM because public sources do not isolate premium intelligent EV spend at Avatr's exact boundary.
