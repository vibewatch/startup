  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Budget owner
  - Adoption trigger
  rows:
  - - Urban premium household
    - Individual household decision-maker
    - Primary driver and family
    - Same household via cash or auto finance
    - Compare domestic premium EVs versus Tesla/German incumbents
    - Household discretionary transport budget
    - Perceived upgrade in intelligence, status, and charging convenience
  - - Tech-forward professional switcher
    - Professionals already deep in Huawei or China tech ecosystems
    - Primary driver
    - Same buyer or household
    - Cross-shop cockpit, ADAS, and smartphone integration
    - Personal income / finance package
    - Huawei ADS and smart-cockpit continuity
  - - Premium SUV/sedan upgrader
    - Existing luxury ICE or EV owner
    - Primary driver plus family members
    - Same household
    - Trade in prior premium vehicle, evaluate service and resale confidence
    - Household upgrade budget
    - Luxury experience with domestic EV economics
  - - Overseas early adopter / distributor-led buyer
    - Local distributor plus end buyer in ASEAN or Middle East
    - End customer
    - Distributor and customer mix
    - Local channel introduction, test drive, then imported delivery and service support
    - Distributor inventory plus customer financing
    - Brand novelty, Chinese EV feature value, and channel confidence
  notes: Public evidence points to a consumer-led market with households as buyer, user, and payer. The overseas row is included as a channel-assisted extension, not proof that export demand is already equal to the domestic buyer base.
