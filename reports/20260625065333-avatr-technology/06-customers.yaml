- id: named-proof
  title: Named Customer Proof and International Deployments
  body: |-
    The strongest public customer evidence outside aggregate delivery numbers comes from international market deployments and independent review coverage. In Thailand, Avatr partnered with Infinite Automobile as the local distributor, opened 7 showrooms including a flagship on Rama 3 Road in Bangkok, and delivered over 1,000 units as of early 2026. Motor Expo 2025 bookings reached 1,103 units, providing production-intent proof from retail customers. Three independent Thai automotive reviewers (Boomtharis, Spin9, and Go Went Go) published affirmative reviews on the Avatr Thailand official page, with praise for range, technology, and build quality. In Australia, Drive.com.au conducted an international quick drive of the Avatr 12 and published positive coverage, describing the interior quality as exceeding expectations for Chinese premium EVs. ZigWheels UAE user reviews show early customer sentiment in the Middle East, though delivery volumes in that market are not confirmed in reviewed sources. The first right-hand-drive Avatr 07 SUVs rolled off the Chongqing production line in January 2026 for Thailand delivery, providing production-readiness evidence for the RHD export ramp. CnEVPost reported this milestone, and Thai Rath confirmed the delivery programme was proceeding. The named-proof picture is strongest for Thailand (official distributor, showroom counts, Motor Expo bookings, reviewer quotes) and weakest for the UAE and Australia (review coverage only, no confirmed fleet or retail delivery numbers).
