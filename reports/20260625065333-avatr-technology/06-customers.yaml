- id: concentration-risks
  title: Concentration Risks, Retention Gaps, and Competitive Dynamics
  body: |-
    Avatr faces three structural concentration risks that the customer evidence base cannot currently resolve. First, channel concentration: the Huawei Smartcom retail integration deal signed April 14, 2026, tightens the distribution dependency on Huawei's commercial network. While this provides access to Huawei's 1,700+ Smartcom stores, it also means any deterioration in the Huawei-Avatr commercial relationship would impair customer access and after-sales service simultaneously. Second, geographic concentration: greater China accounts for an overwhelming share of deliveries. The international ramp is real (Thailand 1,000+ units) but nascent; any domestic demand shock—including the Q1 2026 reversal—is not offset by international volumes at current scale. Third, model concentration: the Avatr 07 family now drives the majority of monthly deliveries. If its sales momentum does not recover from the Q1 2026 decline, overall brand health deteriorates rapidly. On retention: Avatr does not publicly disclose net revenue retention, gross retention, customer repurchase rates, or cohort survival data. This is normal for a brand at three years of age with a product cycle still expanding, but it means underwriting future demand requires reliance on short-term sales trends rather than customer-level durability evidence. The Q1 2026 decline is a leading indicator worth monitoring over multiple quarters before concluding whether it is a model-cycle trough or a structural competitive displacement.
