  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Customer retention and cohort data
    missingEvidence: |-
      Net revenue retention, gross retention rate, customer repurchase cohort data, annual service renewal rates, and NPS or equivalent satisfaction scores for Avatr customers in China and Thailand.
    whyItMatters: |-
      In a capital-intensive premium EV market where each vehicle costs ¥229k–400k+, customer retention directly determines lifetime value and referral quality. The Q1 2026 decline heightens this need.
    diligencePath: |-
      Request Avatr IR for cohort data, NPS, and churn reports; conduct customer surveys in Thailand via Infinite Automobile; interview 5–10 Avatr owners in Tier 1 Chinese cities.
    relatedQuestionRefs:
    - QU013
    - QU026
    - QU027
    relatedTableRefs:
    - TU002
  - type: conflicting-data
    severity: material
    topic: Q1 2026 decline – cyclical vs structural
    missingEvidence: |-
      At least two quarters of 2026 delivery data to determine whether the Q1 2026 decline is a launch-cycle demand normalisation for the Avatr 07, or a structural market-share loss to Huawei Aito and NIO.
    whyItMatters: |-
      A structural decline at the start of an IPO process and an international expansion ramp would materially impair valuation. A cyclical trough would be investable at the right entry point.
    diligencePath: |-
      Monitor Q2 and Q3 2026 monthly sales data; compare Avatr 07 trend versus Huawei Aito M7 and NIO ET5 in the same segment; request Avatr pipeline and order-backlog data from IR.
    relatedQuestionRefs:
    - QU024
    - QU023
    relatedTableRefs:
    - TU002
  - type: missing-source
    severity: material
    topic: Fleet and enterprise customer penetration
    missingEvidence: |-
      Publicly available data on fleet or enterprise buyer share of Avatr deliveries, corporate program terms, or enterprise customer names.
    whyItMatters: |-
      Fleet buyers stabilise demand troughs and provide multi-year purchase commitments; their absence or presence materially affects downside protection in a retail-demand slowdown like Q1 2026.
    diligencePath: |-
      Ask Avatr IR for fleet program structure and fleet delivery share; check Changan annual report for fleet sales breakdown.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU001
  - type: missing-source
    severity: minor
    topic: Thai Motor Expo booking-to-delivery conversion rate
    missingEvidence: |-
      Data on what fraction of the 1,103 Motor Expo 2025 bookings converted to actual Avatr deliveries in Thailand; cancellation or deposit-forfeiture rates.
    whyItMatters: |-
      Booking volume at an expo is an intent signal, not a delivered-revenue signal. Without conversion data, the 1,103 bookings cannot be treated as confirmed demand.
    diligencePath: |-
      Request Infinite Automobile for booking-to-delivery conversion report; compare with manufacturer-reported delivery counts for Thailand Q1 2026.
    relatedQuestionRefs:
    - QU028
    relatedTableRefs:
    - TU003
