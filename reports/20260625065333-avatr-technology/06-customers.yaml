callouts:
- calloutType: strength
  title: "Best proof: Thailand deployment with reviewer validation and Motor Expo bookings"
  body: |-
    Thailand is the strongest public international customer evidence: official distributor, 7 showrooms, 1,000+ delivered, Motor Expo 1,103 bookings, and three independent reviewer quotes. This is production-ready export proof rather than concept stage.
  claimRefs:
  - CU014
  - CU015
  - CU016
  - CU017
- calloutType: risk
  title: Q1 2026 41.6% YoY decline is the dominant adverse signal
  body: |-
    With only 11,703 units in Q1 2026 versus 20,073 in Q1 2025, Avatr faces a structural test of whether the 2025 acceleration was launch-cycle demand or genuine sustained penetration. Changan's Deepal fusion announcement and intensifying Huawei Aito competition both support the structural concern.
  claimRefs:
  - CU011
  - CU012
  - CU028
- calloutType: risk
  title: Avatr 07 complaint spike is the leading customer-satisfaction adverse signal
  body: |-
    268 complaints and the national #1 complaint ranking in September and October 2025 for the Avatr 07 directly contradict the premium brand thesis. This is the exact model being exported to Thailand and positioned as the international volume driver.
  claimRefs:
  - CU022
  - CU023
  - CU026
- calloutType: recommendation
  title: Retention and cohort data are critical diligence gaps
  body: |-
    Avatr has not disclosed NRR, GRR, repurchase rates, or service renewal cohorts. For a brand with a three-year history and early signs of Q1 2026 demand softness, obtaining cohort survival data from the distributor or via customer survey is a top diligence priority before committing capital.
  claimRefs:
  - CU031
  - CU032
