- id: adoption
  title: "Domestic China Adoption: H1 2025 Surge and Q1 2026 Reversal"
  body: |-
    Avatr's domestic China adoption trajectory is a story in two acts. The first act (2024 through H1 2025) was a sustained acceleration: the brand crossed 10,000 monthly deliveries for the first time in H2 2024 and maintained that level for 8 consecutive months through June 2025. H1 2025 total deliveries reached 56,729 units, a 151.1% YoY improvement, with June 2025 alone registering a 117% YoY surge. By June 2025, cumulative lifetime deliveries exceeded 150,000 units, and the average transaction price above ¥270,000 indicated customers were not trading down to the cheapest trims. Full-year 2025 ran at approximately 47.4% of the 220,000 unit target through October, suggesting the full year came in around 115,000–120,000 units. The second act (Q1 2026) was a sharp reversal: Avatr delivered only 11,703 units in Q1 2026, a 41.6% YoY decline versus Q1 2025's 20,073 units. CarNewsChina attributed the drop to intensifying competition from Huawei Aito, NIO, Li Auto, BYD luxury lines, and the self-cannibalisation risk from Deepal absorbing back-end resources. Changan's announcement of an Avatr-Deepal operational fusion in April 2026, intended to cut shared costs by 20–30%, validated the scale-pressure narrative but raised investor questions about brand dilution and focus. This V-shaped pattern—steep rise then sharp fall—is the central customer diligence risk: the 2025 acceleration may have been partly launch-cycle demand for the new 07 model, and sustained penetration against worsening competitive conditions in the ¥250k–350k bracket is undemonstrated.
  claimRefs:
