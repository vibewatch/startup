  topStrengths:
    - Changan、Huawei 和 CATL 的战略支持，让 Avatr 作为民营 EV 公司罕见地接入制造规模、智能驾驶软件和电池技术。
    - IPO 阶段披露显示公司不是概念故事，而是有真实经营规模：2024 年收入 RMB 15.2 billion，H1 2025 毛利率转正，FY2025 报告销量超过 120,000 辆。
    - 产品组合覆盖多种高端 EV 形态，同时有可见出口野心和庞大国内零售网点。
  topRisks:
    - Q1 2026 转弱后，需求韧性仍未证明；中国高端 EV 市场竞争极其激烈，促销也很重。
    - Avatr 的技术主张和服务策略深度依赖 Huawei 与 CATL，限制了公司对核心差异化的独立掌控。
    - 公开证据仍未披露现金跑道、清算优先权、已实现车型经济性，或 RMB 11.5 billion Yinwang 投资对条款的影响。
    - 香港 IPO 进程已经失效过一次，未来上市可能需要更新披露，或接受更低的估值锚。
  unresolvedGaps:
    - FY2025 和 FY2026 经审计财务报表，包括现金、债务、烧钱速度和现金跑道。
    - Series C 和 Yinwang 股权购买后的完整股权结构表和优先股堆叠。
    - 2026 年按车型和渠道拆分的月度终端销售、退订和库存数据。
    - 按车型拆分的已实现 ASP、折扣和毛利率桥，而不是组合平均数。
    - 队列留存、复购和出口市场转化数据。
