  evidenceGaps:
    - type: missing-source
      severity: material
      topic: ads-exclusivity
      missingEvidence: A contract term sheet or official disclosure showing whether Avatr has any exclusive preferred or timed access rights to Huawei ADS 4 or related components.
      whyItMatters: If Huawei grants comparable access to multiple OEMs, Avatr's headline tech differentiation is easier to commoditize.
      diligencePath: Request the Avatr-Huawei commercial framework, roadmap governance, and any exclusivity or priority clauses.
      relatedQuestionRefs: [QP007]
    - type: private-evidence-only
      severity: material
      topic: channel-pricing
      missingEvidence: City-level dealer quotes, trade-in subsidies, financing support, and realized discount data for Avatr models and immediate competitors.
      whyItMatters: List prices can overstate pricing power and obscure whether Avatr is clearing volume through incentives.
      diligencePath: Collect mystery-shop quotes across tier-1 and tier-2 cities and compare net transaction pricing.
      relatedQuestionRefs: [QP014]
    - type: missing-source
      severity: material
      topic: transaction-pricing
      missingEvidence: Verified 2026 realized transaction prices or incentive-adjusted discounts for AITO M9 and Mercedes EQS 450+ in China.
      whyItMatters: Without net pricing, the table can compare only list-price posture rather than actual competitive affordability.
      diligencePath: Obtain dealer invoices, channel checks, or insurer-backed quote sheets for both brands.
      relatedQuestionRefs: [QP021]
    - type: private-evidence-only
      severity: material
      topic: peer-unit-economics
      missingEvidence: Peer-normalized segment profitability, gross margin by model family, and channel economics for Avatr, AITO, and Zeekr.
      whyItMatters: Moat durability depends on who can sustain technology and channel spend without destroying margin.
      diligencePath: Request investor deck excerpts, public-company segmentation notes, or supplier-side margin commentary.
      relatedQuestionRefs: [QP023]
    - type: missing-source
      severity: material
      topic: brand-autonomy-governance
      missingEvidence: A post-fusion governance plan showing how Avatr and Deepal will separate branding, product planning, and commercial accountability.
      whyItMatters: Operational fusion could dilute Avatr's premium positioning and alter the investability of the standalone brand.
      diligencePath: Request Changan's integration blueprint, management KPIs, and product-line demarcation after the April 2026 announcement.
      relatedQuestionRefs: [QP025]
    - type: enumeration-incomplete
      severity: minor
      topic: competitor-profile-table coverage
      missingEvidence: Public evidence on smaller or newer premium EV entrants that could become relevant in future refreshes but are not necessary for the current top-tier comparison set.
      whyItMatters: The current profile table is sufficient for the main rivalry classes, but it is not an exhaustive census of every premium EV challenger.
      diligencePath: Refresh the competitor census quarterly and extend TP001 if new entrants achieve meaningful sales, pricing, or channel relevance.
      relatedTableRefs: [TP001]
