  claimRefs: [CO001, CO003, CO013, CO017, CO021, CO031, CO044, CO051, CV003, CV005, CV006]
summary:
  headline: Avatr is a strategically backed premium EV platform with credible scale and improving disclosed margins, but weak 2026 momentum, partner dependence, and limited valuation transparency keep the supportable call at research-more.
