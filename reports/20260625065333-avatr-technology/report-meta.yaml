companyProfile:
  summary: Avatr Technology is a Chongqing-based premium intelligent EV company whose current form emerged from the 2018 Changan-NIO joint venture and the 2021 rebrand around a Changan-Huawei-CATL collaboration model. The company sells higher-end BEV and EREV sedans and SUVs including the Avatr 06, 07, 11, and 12, with Huawei providing the intelligent-driving and cockpit stack and CATL supplying core battery technology. Public IPO-era reporting shows rapid revenue and volume scaling through 2025, but also continued losses, partner dependence, and a 2026 demand slowdown that make the equity story more complex than the brand narrative alone suggests.
  foundedDate: '2018-07-10'
  founders:
    - name: Changan Automobile
      role: Joint-venture founder
      background: Legacy Chinese automaker that formed the original Changan-NIO venture and remains Avatr's largest shareholder.
      claimRefs: [CO001, CV003]
    - name: NIO
      role: Original joint-venture co-founder
      background: Premium EV maker that partnered with Changan in the 2018 founding JV before later exiting Avatr's shareholder list.
      claimRefs: [CO001, CO012]
  foundingLocation: Chongqing, China
  headquarters: Chongqing, China
  productSummary: Premium smart electric sedans and SUVs that combine Changan vehicle engineering, Huawei ADS/HarmonyOS cockpit systems, and CATL batteries across BEV and range-extended product lines.
  customerFocus: Affluent urban Chinese buyers seeking premium intelligent EVs, plus early export-market customers in Southeast Asia, Hong Kong, the Middle East, and other distributor-led markets.
  businessModel: Primarily direct vehicle sales supported by branded retail and service outlets, Huawei-linked channel integration, after-sales services, components, and ecosystem or assisted-driving related offerings.
  stage: growth
  fundingStatus: More than RMB 11 billion of Series C financing closed in December 2024; Avatr then filed for a Hong Kong IPO in November 2025, the application lapsed in May 2026, and public reporting indicated a refiling path remained open.
