  - FO003
- id: founders-leadership-and-governance
  title: Founders, Leadership, and Governance Disclosure
  body: The founder set is Glenn Chisholm, Ben Johnson, and Matt Wolff; Hasan Imam should not be described as a founder. The distinction matters because the diligence story is founder-heavy in product and technical credibility but operator-led in the CEO seat. Chisholm remains visible as Co-Founder, Chairman, and Chief Product Officer, while Johnson and Wolff supply the CTO and chief-scientist lineage tied to Carbon Black and Cylance experience. Imam brings go-to-market and customer-leadership background from Shape Security, which Norwest connects to a roughly $1 billion F5 exit, and he is the executive quoted in the latest Series D narrative. Public leadership directories support the current CEO field but do not resolve board composition, observer rights, committee structure, or investor control. That leaves governance diligence centered on board materials, succession planning, and whether founder product authority and non-founder CEO authority are cleanly allocated.
  claimRefs:
  - CO004
  - CO005
  - CO006
  - CO007
  - CO008
  - CO029
  - CO035
  - CO036
  - CO041
  tableRefs:
