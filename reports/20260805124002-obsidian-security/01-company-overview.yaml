- id: milestones-and-competitive-context
  title: Milestone Chronology and Competitive Context
  body: The chronology shows a company that used SSPM-era investor validation to reach the AI-agent governance moment quickly. The durable foundation is the 2017 founding, followed by a June 2021 Norwest-led Series B-1 and an April 2022 $90 million Series C that still described the company as an SSPM leader. The 2026 evidence resets the narrative around AI agents, MCP inventory, runtime controls, Fortune 500 penetration, and a unicorn Series D. The adverse caveat is not an internal scandal; it is competitive timing. Zenity, a direct AI-agent security competitor, announced a larger $125 million round one day before Obsidian disclosed its own $85 million raise. That does not negate Obsidian's customer and syndicate signals, but it means the milestone record should be read as participation in an intensifying category land-grab rather than as solitary category ownership. That distinction should carry into later market, product, customer, financial, risk, and valuation chapters as shared ground truth.
