- id: funding-investors-and-scale
  title: Funding History, Investor Base, and Scale Metrics
  body: 'The capital-formation record is strong but still disclosure-limited. Greylock led the earliest Series A, Norwest led the June 2021 Series B-1, and Menlo Ventures, Norwest, and IVP led the April 2022 $90 million Series C, when total funding reached $119.5 million. The August 4, 2026 Series D added $85 million at a $1.1 billion valuation, was led by Crescent Cove Advisors, and included existing investors Greylock, Menlo, Norwest, IVP, Wing, and GV. Post-round, Obsidian reports more than $200 million raised across five rounds. The scale evidence is similarly impressive but company-reported: more than 100 customers spend over $100,000 per year, more than 14 spend over $1 million, and 60 Fortune 500 companies are customers. Those thresholds are useful because they establish a real enterprise-spend floor, yet they still do not reveal logo concentration, discounting, renewal quality, expansion cohorts, or gross retention. Revenue, ARR, NRR, gross margin, burn, runway, and headcount remain undisclosed, so the only ARR figure here is a deliberately narrow estimated floor of roughly $24 million from disclosed spend thresholds.'
