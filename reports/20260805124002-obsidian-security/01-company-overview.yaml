company:
  name: Obsidian Security
chapter:
  number: 1
  title: Company Overview
  summary: Obsidian Security is a Palo Alto-based, 2017-founded cybersecurity company that has pivoted from SSPM toward AI-agent and non-human-identity governance. The August 2026 $85 million Series D at a $1.1 billion valuation validates the platform narrative, but revenue, ARR, headcount, board composition, and exact control terms remain public evidence gaps.
sections:
- id: identity-and-positioning
  title: Identity, Headquarters, and Category Positioning
  body: Obsidian Security is best anchored as a Palo Alto, California-based private cybersecurity company founded in 2017 and currently positioned around runtime governance for AI agents and non-human identities inside enterprise third-party SaaS applications. The Palo Alto headquarters should be treated as the current canonical field because the freshest August 2026 financing coverage repeatedly uses California/Palo Alto framing; legacy profile surfaces that imply Newport Beach are not ignored, but they are weaker and stale enough to become an explicit evidence gap rather than the primary identity. The business model has also moved beyond its earlier SSPM narrative. Current official and independent coverage presents Obsidian as helping security teams inventory AI agents, MCP servers, models, non-human identities, and policy violations before actions take effect. That makes the company a late-stage AI-agent governance vendor, not merely an older SaaS posture-management tool.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO009
  - CO010
  - CO028
  - CO033
  - CO034
  - CO038
  - CO040
