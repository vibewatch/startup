- id: revenue-signals-and-arr-inference
  title: Revenue Signals and ARR Inference
  body: 'Revenue and ARR are not publicly disclosed, so this chapter treats every revenue number as either a disclosed spend threshold or a clearly labeled estimate. The cleanest hard signal is customer spend: more than 100 customers over $100,000 annually and more than 14 over $1 million. Following the chapter instruction, the implied ARR floor is calculated as 100 times $100,000 plus 14 times $1 million, or approximately $24 million. That is not reported ARR, and it may not capture overlap or discounting perfectly; it is a floor derived from public statements. A plausible analyst estimate of $40 million to $70 million ARR is used only for sensitivity work, with $50 million as the base case. The commercial quality appears enterprise-skewed because the company cites 60 Fortune 500 customers and many seven-figure accounts, but the revenue mix, net retention, expansion rate, and customer concentration remain private.'
