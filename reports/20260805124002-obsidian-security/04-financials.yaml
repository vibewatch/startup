- id: pricing-gtm-and-unit-economics
  title: Pricing, GTM, and Unit Economics
  body: 'Public pricing evidence is directional rather than underwritable. Cyberse cites a free tier to 1,000 users and an AWS Marketplace reference price near $100 per user per year, while third-party profiles also point to free trials or custom enterprise pricing above the entry tier. This supports a headcount-based subscription model, but it is list-price evidence, not realized ACV, discounting, renewal, or margin evidence. The GTM motion appears enterprise-led: the company talks about Global 2000 expansion, seven-figure customers, and custom governance for complex SaaS estates rather than transactional self-serve revenue. Unit economics are therefore the core diligence gap. CAC payback, sales cycle, gross margin, cloud cost, support burden, implementation services, NRR, logo retention, and churn are all undisclosed. The most defensible model treats these cells as null, then asks management for cohort and margin cuts before assigning software-like economics.'
