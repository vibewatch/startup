- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Native-platform commoditization
    - Microsoft/Salesforce/Google bundle comparable runtime controls
    - Controls cover core Obsidian use cases in enterprise licenses
    - Cut pricing assumptions and treat differentiation as unproven
  - - Product-efficacy failure
    - Independent red-team or customer incident shows prompt-injection/RCE bypass
    - Material bypass without rapid remediation and customer proof
    - Move recommendation toward research-more or avoid until fixed
  - - Valuation / disclosure risk
    - ARR, NRR, burn, or gross margin remains undisclosed in diligence
    - Cannot substantiate $40-70M ARR range or retention quality
    - Demand price reset, structure, or pass
  - - Market-timing risk
    - AI-agent governance pipeline does not convert from pilots to annual contracts
    - Low paid conversion or weak renewal attach after 2-3 quarters
    - Lower growth case and delay investment
  - - Competitive share loss
    - Zenity or SSPM peers repeatedly win Fortune 500 bake-offs
    - Losses tied to product gaps rather than price only
    - Reassess moat and sales productivity assumptions
  - - Customer concentration
    - 14+ $1M accounts represent excessive ARR share or one account churns
    - Top-customer concentration exceeds diligence threshold
    - Increase discount rate and require customer-reference checks
  notes: Kill criteria are observable diligence or post-close events that would directly change the risk rating or valuation
