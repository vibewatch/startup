- id: technical-legal-and-threat-risk
  title: Technical, Legal, and Threat-Landscape Risk
  body: 'The same threat environment that validates Obsidian also raises the risk that the product under-delivers in high-stakes
    settings. Prompt injection is repeatedly framed by 2026 adverse sources as the leading enterprise AI-agent risk, and Microsoft’s
    RCE research shows how agent-framework behavior can turn prompt manipulation into shell-level consequences. The Salesloft/Drift
    OAuth incident is particularly relevant because it shows how an AI-chat-agent or OAuth/NHI compromise can cascade through
    Salesforce, AWS, and Snowflake surfaces—the exact kind of SaaS environment where Obsidian says it can govern identities
    and actions. MCP vulnerability coverage and OWASP MCP guidance add another layer: inventory, least privilege, model registry,
    and runtime blocking are necessary, but they are becoming expected baseline controls. Legal and regulatory exposure is
    therefore indirect but material. Public sources do not show a current Obsidian lawsuit or enforcement action, yet enterprise
    buyers will treat false negatives, over-permissioned agents, and SaaS data exposure as contractual, privacy, and incident-response
    risks. The burden is to prove that Obsidian blocks advanced attacks before actions execute, not merely that it monitors
    a scary category. The risk is asymmetrical because one missed exploit in a flagship customer can weaken trust faster than
    many quiet blocks can build it, especially when incident narratives spread through security communities.'
  claimRefs:
