chapter:
  number: 7
  title: Risks
  summary: Obsidian’s downside is concentrated in category crowding, platform-native commoditization, market-timing uncertainty,
    high-severity AI-agent threat models, undisclosed financial durability, and execution dependence after a rich $1.1 billion
    Series D.
sections:
- id: competition-platform-and-market-timing
  title: Competition, Platform Risk, and Market Timing
  body: 'Obsidian is raising into a market that looks urgent but not yet settled. The strongest competitive warning is Zenity:
    it raised $125 million on 2026-08-03, one day before Obsidian announced its $85 million Series D, and it is explicitly
    positioned around securing autonomous AI agents. The broader field is also crowded, with Grip, Push, Nudge, Valence, AppOmni,
    and identity/security-platform incumbents competing for overlapping SSPM, SaaS discovery, browser identity, and agent-governance
    budgets. That crowding matters because Obsidian’s pivot is not a clean greenfield move from SSPM into a monopoly category;
    it is a bet that runtime AI-agent governance becomes a budget line large enough to support a unicorn valuation. Microsoft’s
    native agent-security work is the sharper platform risk. If Copilot, Defender, Salesforce, Google, or SaaS platforms embed
    enough governance controls directly into enterprise suites, Obsidian could remain technically useful but lose pricing
    power and strategic urgency. Market timing is the linked risk: 70%+ customer agent exposure and a 144:1 NHI ratio support
    the problem statement, but public sources do not yet prove renewal durability, standalone AI-governance willingness to
    pay, or how quickly budgets shift from SSPM to agent runtime controls. A further diligence concern is buyer education:
    security teams may agree that agents are risky while still postponing a new platform purchase until internal pilots create
    a breach, audit finding, or board-level mandate.'
