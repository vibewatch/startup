- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Obsidian’s customer path moves from SaaS/AI-agent risk discovery into production governance, quantified outcomes,
    and possible multi-module expansion.
  data:
    items:
    - label: Risk trigger
      description: Enterprise discovers AI agents, non-human identities, or SaaS-to-SaaS integrations operating across third-party
        apps.
    - label: Initial proof point
      description: Customer validates posture, SaaS application discovery, MCP inventory, breach clarity, or integration risk
        in one high-priority environment.
    - label: Production deployment
      description: Large customers such as Snowflake use Obsidian in complex SaaS estates rather than only a controlled pilot.
    - label: Value evidence
      description: Operational proof appears as engineering-hours savings, SaaS apps discovered quickly, modeled ROI, or peer-review
        satisfaction.
    - label: Account expansion
      description: Buyer can expand from posture discovery to runtime governance, AI-agent identity, breach clarity, and SaaS
        supply-chain controls.
    - label: Diligence fork
      description: Investors must verify renewal, concentration, and reference diversity before treating adoption proof as
        durable ARR quality.
  approximationNotes: Journey synthesized from customer stories, product surfaces, and Series D traction disclosures rather
    than a disclosed conversion funnel.
