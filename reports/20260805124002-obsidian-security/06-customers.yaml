- id: satisfaction-roi-and-durability
  title: Satisfaction, ROI, and Durability Signals
  body: 'The satisfaction and value evidence is positive, but it is not the same as retention evidence. Gartner Peer Insights
    shows roughly 4.9 out of 5 from about 22 reviews, and PeerSpot supplies another enterprise review surface. Forrester’s
    TEI calculator reports up to 192% ROI for a composite organization with $9 billion in revenue and 10,000 employees. Those
    signals matter because they triangulate buyer-perceived value outside Obsidian’s own customer pages, and the Forrester
    model is directionally consistent with Snowflake’s engineering-hours savings. The caveat is that none of these sources
    discloses Obsidian’s NRR, GRR, churn, renewal rate, contract length, or true customer cohort behavior. The planned retention
    cohort therefore has to be displayed as a disclosure map rather than an actual retention curve: public sources can identify
    a current spend cohort and a current named deployment, but they do not reveal whether the same accounts renew after six
    or twelve months. This is the central unresolved customer-quality gap.'
  claimRefs:
  - CU012
  - CU013
  - CU014
  - CU023
  - CU030
  - CU036
  - CU037
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-concentration-and-fit-risks
  title: Expansion, Concentration, and Fit Risks
  body: 'Obsidian’s expansion story is credible because the 2026 financing narrative explicitly says the company will fund
    R&D and extend deeper into the Fortune 500 and Global 2000, while product surfaces such as MCP security, breach clarity,
    SaaS supply-chain security, and AI-agent identity management create multiple cross-sell paths. The same evidence also
    creates underwriting risk. Fourteen-plus $1M customers indicate real account expansion, but they also raise concentration
    questions if those accounts dominate revenue. The 60 Fortune 500 claim proves enterprise reach, yet specific named Fortune
    500 logos are mostly undisclosed, so investors cannot independently assess renewal quality, deployment breadth, or reference
    diversity. Adverse review evidence from Work-Management.org adds a customer-fit boundary: buyers looking for one platform
    across SaaS, IaaS, and PaaS posture may view Obsidian as incomplete, and dashboard flexibility limitations may matter
    to teams with customized reporting needs. The bottom line is strong adoption proof with material disclosure gaps, not
    a clean retention-underwriting package.'
