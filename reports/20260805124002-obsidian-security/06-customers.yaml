  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table
    missingEvidence: Full customer roster behind the 60 Fortune 500 claim, including specific financial-institution, social-media,
      and telecom logos plus deployment scope.
    whyItMatters: The public record proves enterprise reach but cannot verify whether the named examples are representative
      of the whole enterprise base.
    diligencePath: Request CRM export or management-verified customer list with logo permission, segment, product module,
      ARR band, and production status.
    relatedQuestionRefs:
    - QU004
    - QU011
    - QU024
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: NRR, GRR, churn, renewal rate, contract length, and cohort retention for the >$100K and >$1M customer
      groups.
    whyItMatters: Customer adoption is proven, but durability and expansion quality cannot be underwritten without renewal
      and cohort behavior.
    diligencePath: Request anonymized cohort retention by booking year, product module, ARR band, and Fortune 500 versus non-Fortune-500
      segment.
    relatedQuestionRefs:
    - QU017
    - QU020
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-risk
    missingEvidence: Top-10 customer revenue share, largest account ARR, renewal dates for the 14+ >$1M accounts, and exposure
      by vertical.
    whyItMatters: The same large-account proof that validates adoption may hide concentration risk if a few enterprises dominate
      revenue.
    diligencePath: Request customer concentration schedule, renewal calendar, and bridge from customer count to ARR by segment.
    relatedQuestionRefs:
    - QU022
    - QU024
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: minor
    topic: social-media-telecom-deployment-detail
    missingEvidence: Named production case studies for the social media and telecom vertical claims beyond T-Mobile appearing
      in a logo list.
    whyItMatters: Segment breadth is less reliable when a vertical is disclosed but not tied to named deployments or outcomes.
    diligencePath: Ask management for two referenceable customers per disclosed vertical and independent corroboration where
      logo permission is not available.
    relatedQuestionRefs:
    - QU003
    - QU013
  - type: missing-source
    severity: minor
    topic: dashboard-flexibility-adverse-validation
    missingEvidence: Customer interviews confirming whether dashboard flexibility or lack of IaaS/PaaS posture actually blocks
      enterprise adoption.
    whyItMatters: The adverse review flags plausible fit limits, but the commercial impact needs customer-level validation.
    diligencePath: Probe security-admin and CISO references on reporting customization, cloud posture overlap, and replacement
      versus coexistence with cloud-native tools.
