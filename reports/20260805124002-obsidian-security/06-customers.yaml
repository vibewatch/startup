- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Move 100+ $100K customers toward seven-figure scope
    - 14+ $1M customers may dominate revenue
    - Positive expansion proof can also hide top-account concentration
    - Request top-10 revenue share and account-level ARR bands
  - - Deeper Fortune 500 / Global 2000 penetration after Series D
    - Specific F500 logos mostly undisclosed
    - Enterprise reach is real but hard to independently underwrite
    - Request logo-permission list or anonymized customer schedule by vertical
  - - Snowflake quantified outcome as reference selling
    - One excellent case may overrepresent median value
    - Strong sales proof, but not proof every account saves hundreds of hours
    - Request median ROI and reference-call notes across non-Snowflake accounts
  - - AI-agent runtime governance cross-sell to existing SaaS base
    - Category may still be budgeted as emerging control layer
    - Potential upsell, but adoption velocity depends on customer agent maturity
    - Request pipeline conversion for customers already allowing AI agents
  - - Breach clarity, MCP security, SaaS supply-chain add-ons
    - Module sprawl could obscure attach rates
    - Expansion story plausible but unquantified
    - Request product attach rates by cohort and net expansion bridge
  - - Finance, social, telecom vertical breadth
    - Vertical proof may cluster in a few marquee accounts
    - A broad-sounding vertical list can mask concentration
    - Request ARR split by vertical and largest account exposure
  - - SaaS-specific depth versus cloud-suite breadth
    - No IaaS/PaaS posture coverage may constrain platform consolidation wins
    - Could limit share of wallet in cloud-security-standardization projects
    - Test against customers that also run Wiz, CSPM, CNAPP, or EASM tools
  - - Executive reporting and dashboard adoption
    - Dashboard flexibility limits may affect renewal among reporting-heavy buyers
    - Can slow operational rollout even after technical win
    - Ask references about dashboard customization and board-reporting workflows
  notes: Risks are commercial transmission paths from public customer evidence; they are not claims that any named customer
    has churned.
