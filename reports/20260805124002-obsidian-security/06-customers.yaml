schemaVersion: report-v2
artifact: customers
slug: obsidian-security
runDate: '2026-08-05'
company:
  name: Obsidian Security
chapter:
  number: 6
  title: Customers
  summary: 'Obsidian has unusually strong public customer traction for a private security company, led by 100+ customers above
    $100K annually, 14+ above $1M annually, 60 Fortune 500 customers, and a quantified Snowflake customer story. The proof
    is real but still incomplete: named Fortune 500 logos, retention cohorts, NRR/GRR, and top-customer concentration remain
    largely undisclosed, and adverse review evidence limits the claim to SaaS and AI-agent governance rather than broader
    cloud posture.'
sections:
- id: enterprise-traction-and-segmentation
  title: Enterprise Traction and Segmentation
  body: 'Obsidian’s customer proof starts with scale disclosures that are unusually concrete for a private cybersecurity vendor.
    The company-reported 2026 Series D corpus says it has 100+ customers spending more than $100,000 per year, 14+ customers
    spending more than $1,000,000 per year, and 60 Fortune 500 customers across major financial institutions, social media
    networks, and telecom providers. Those facts support real enterprise adoption, not just pilots, because the disclosed
    spend thresholds imply production-budget ownership and at least some multi-stakeholder procurement. The segmentation still
    needs care: finance has the strongest external proof because an anonymous Fortune 500 bank director appears in a customer-reference
    corpus; telecom has a named logo in T-Mobile through CB Insights; social media is disclosed only as a category; Snowflake
    supplies a high-quality data-platform case. Obsidian’s product positioning around AI agents, non-human identities, and
    third-party SaaS applications explains why security, identity, and SaaS owners are likely buyers, users, and payers, but
    the public record does not yet map every disclosed segment to contract size, renewal status, or production scope.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU017
  - CU018
  - CU019
  - CU024
  - CU031
  - CU032
  - CU033
