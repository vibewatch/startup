summary:
  headline: >-
    Obsidian has genuine category leadership in the emerging AI-agent-governance market and a confirmed $1.1B unicorn
    mark, but the valuation rests on estimated rather than disclosed ARR in a rapidly crowding field, supporting
    continued tracking over conviction pricing.
