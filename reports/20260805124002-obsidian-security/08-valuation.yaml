- id: TV006
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - ARR proof miss
    - Audited ARR below ~$40M or close to the ~$24M floor.
    - Implied multiple becomes far above normal public/private cyber bands.
    - Do not underwrite at $1.1B without major price protection.
  - - Retention or concentration risk
    - Weak NRR/GRR or concentration inside the 14 $1M+ customers.
    - Customer proof stops translating into durable revenue quality.
    - Lower multiple and require cohort-level evidence.
  - - Platform commoditization
    - Microsoft or another platform absorbs agent-governance budget.
    - Scarcity premium and independent-vendor pricing power compress.
    - Reassess category share and sales-cycle assumptions.
  - - Multiple compression
    - Public cyber/private cyber medians fall below underwriting bands.
    - Exit values decline even if operations execute.
    - Use lower exit multiple and revisit ownership math.
  - - Structured terms
    - Heavy preferences, participation, or anti-dilution appear in the Series D stack.
    - Headline valuation overstates common-equity return.
    - Model liquidation stack before proceeding.
  notes: Kill triggers are tied to observable diligence outputs or market data rather than generic risk language.
  claimRefs:
  - CV038
  - CV039
  - CV040
  - CV041
  - CV043
- id: TV007
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Diligence path
  rows:
  - - ARR bridge
    - Contracted ARR, revenue, and bridge from customer-spend tiers.
    - Determines whether 22x or 46x is the right implied multiple.
    - Request CFO-certified ARR schedule and customer-tier rollforward.
  - - Growth and retention
    - Revenue growth, NRR, GRR, churn, expansion, and cohort retention.
    - Premium multiples require durable expansion, not only customer logos.
    - Request board KPI pack and cohort tables.
  - - Economics and burn
    - Gross margin, contribution margin, burn, runway, and headcount.
    - Cyera-style operating losses would increase froth risk at high multiples.
    - Request monthly financials and operating plan.
  - - Customer concentration
    - Top-10 customer share and concentration among the 14 $1M+ accounts.
    - Large accounts can support ARR or create fragility.
    - Request anonymized customer concentration schedule and references.
  - - Cap table and preferences
    - Liquidation preferences, participation, option pool, side letters, and pro rata rights.
    - Investor return can differ from enterprise value.
    - Review financing documents and capitalization model.
  - - Competitive proof
    - Win/loss versus Zenity, Microsoft-native controls, and incumbent cyber platforms.
    - Determines whether valuation deserves a scarcity premium.
    - Run customer calls and review pipeline conversion by competitor.
  notes: These asks are the minimum package needed to move from a public-evidence range to an investable price.
  claimRefs:
  - CV037
  - CV042
  - CV043
  - CV044
