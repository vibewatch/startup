chapter:
  number: 8
  title: Valuation
  summary: Obsidian Security’s $1.1B Series D is rich but defensible only if ARR is already near the high end of the estimated
    $40M-$70M range; public evidence supports a track recommendation, medium confidence, high risk, and a stretched valuation
    stance until ARR, retention, margin, and terms are verified.
sections:
- id: series-d-price-and-implied-multiple
  title: Series D Price and Implied Multiple
  body: 'Obsidian’s August 4, 2026 Series D gives the valuation chapter a clear headline and an unclear denominator. The numerator
    is well supported: the company announced an $85 million raise led by Crescent Cove Advisors at a $1.1 billion post-money
    valuation, with existing investors returning and total capital raised now above $200 million. The denominator is the hard
    part. Obsidian discloses 100+ customers spending at least $100,000 annually, 14+ spending at least $1 million, and 60
    Fortune 500 customers, but it does not disclose ARR, growth, margins, retention, burn, runway, or headcount. Using the
    canonical public-floor method from the financial chapter, the disclosed spend tiers imply about $24 million of ARR, while
    the plausible underwriting range remains roughly $40-70 million. That range makes the $1.1 billion price highly sensitive:
    about 46x at the floor, 22x at $50 million, and 15.7x at $70 million. The valuation is therefore not nonsensical, but
    it is explicitly price-sensitive and evidence-sensitive.'
  claimRefs:
