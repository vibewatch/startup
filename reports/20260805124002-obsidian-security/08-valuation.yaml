- id: scenario-recommendation-and-kpis
  title: Scenario Recommendation and KPIs
  body: 'The recommendation is to track, not buy unconditionally, because the Series D price is rich while public evidence
    is incomplete. The thesis is attractive: a large AI-agent/NHI security market, Fortune 500 proof, strong syndicate support,
    and runtime governance capabilities that align with a new enterprise control plane. The anti-thesis is equally important:
    category timing is young, Zenity raised $125 million one day earlier, Microsoft and other platforms can absorb pieces
    of the workflow, and the revenue denominator is private. The bull case needs ARR near $70 million, high growth, and premium
    public-comparable tolerance; the base case assumes $40-50 million ARR and an opacity discount; the bear case uses the
    $24 million floor and compressed multiples. Those cases translate to a stretched valuation stance with medium confidence
    and high risk. The IC should monitor market size, customer proof, moat, economics, competition, valuation, and evidence
    quality rather than treating the unicorn headline as its own proof.'
