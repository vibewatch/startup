  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >-
              不应把所有可贴上 AI 标签的网络安全或态势管理支出都计入 Obsidian 的市场规模。工作边界是企业第三方 SaaS 与 AI
              智能体治理：自动化智能体的运行时控制、非人身份安全、SSPM、SaaS-to-SaaS 集成风险，以及部分类似 ITDR
              的身份检测工作流。纳入的支出，是用于发现智能体和集成、映射权限、监控行为、阻断过度数据访问，并证明跨 SaaS 应用策略合规的预算。排除的支出包括广义云态势管理、端点安全、通用数据态势管理，以及从不触达第三方
              SaaS 智能体的原生平台控制。现状很重要，因为许多企业仍靠人工 SaaS 审查、IdP 原生控制、表格审批，或 Microsoft、Salesforce 等应用平台内置设置。市场有吸引力，因为 Obsidian
              可以指向每 1 个人类身份对应 144 个非人身份、以及超过 35,000 个第三方应用；但正因为范围很宽，更需要纪律，不能把每一美元相邻 SPM 支出都算作可服务市场。
