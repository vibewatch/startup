      - number: '2.4'
        title: 增长驱动、约束与测算缺口
        blocks:
          - type: paragraph
            body: >-
              需求由企业采用智能体、极端的 144:1 NHI 比例、SaaS 应用蔓延，以及在数据暴露前阻断智能体动作的需求驱动。约束同样关键。第一，SSPM 市场规模证据互相冲突：Research and Markets
              称 2026 年 SSPM 市场为 $3.69 billion、CAGR 12.6%；Frost 则从 2025 年仅 $484.4 million 起步，到 2030 年以 48.7% CAGR 达到
              $3.53 billion。这个分歧是反向市场测算信号，不是四舍五入误差。第二，直接竞争者 Zenity 在 Obsidian Series D 前一天融资 $125
              million，说明品类被验证，也说明一个资本充足的对手在争夺同一批企业智能体安全预算。第三，如果把 CSPM、DSPM 或通用态势产品在没有 SaaS 智能体工作流的情况下计入可寻址市场，$26.35
              billion 的广义 SPM 会抬高故事。尽调答案是保留漏斗，向管理层索取 ARR 和收入结构，并按买方画像测试客户预算，而不是直接承接总量 TAM。
            claimRefs:
