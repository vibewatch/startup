          type: company
        - id: microsoft
          label: Microsoft 原生控制
          detail: Copilot/Defender 智能体安全控制。
          type: platform
        - id: saas
          label: Salesforce / Snowflake / AWS 应用
          detail: 企业 SaaS 数据与身份面。
          type: platform
        - id: mcp
          label: MCP 服务器与智能体框架
          detail: 工具、模型与执行基础设施。
          type: technical
        - id: zenity
          label: Zenity
          detail: AI 智能体安全直接竞争对手。
          type: competitor
        - id: sspm
          label: Grip / Push / Nudge / Valence / AppOmni 等邻近厂商
          detail: 邻近 SSPM 和 SaaS 治理竞争对手。
          type: competitor
        - id: investors
          label: Crescent Cove + 现有投资者
          detail: Series D 轮资本和业绩门槛。
          type: capital
        - id: buyers
          label: Fortune 500 / Global 2000 企业买方
          detail: 企业客户与续约验证。
          type: customer
