            body: >-
              公开来源暗示的架构是图谱支撑的控制平面。API 式或无代理接入发现 SaaS 应用、非人身份、集成、MCP
              服务器、模型和智能体关系。知识图谱随后关联权限、数据敏感性、正常行为和工具调用上下文。运行时，系统评估智能体请求是否涉及权限升级、过度数据访问、策略违规、模型切换，以及未经批准的 MCP
              或工具使用；控制决策可在动作生效前阻断。这与被动审计看板有实质差异。核心尽调问题是，Obsidian 能否在决策回路中保留足够上下文，同时不在大量 SaaS API
              和智能体平台之间制造不可接受的延迟、误报或连接器脆弱性。
