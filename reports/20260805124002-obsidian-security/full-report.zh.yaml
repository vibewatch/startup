            body: >-
              退出可选性真实存在，但还不足以抹平估值风险。网络安全 M&A 活跃度、Google / Wiz、Palo Alto / CyberArk，都说明市场对稀缺安全控制平面有战略胃口；Obsidian 切入 AI
              智能体治理，也给了它一个说得通的战略叙事。不过，以 $1.1B 入场，需要公开来源没有提供的尽调证据。买方或投资人需要审计后的 ARR、基于客户层级的 ARR
              桥接表、毛利率、现金消耗、NRR、GRR、同期群留存、客户集中度、员工数和清晰的股权结构条款。最重要的否决触发点包括：ARR 低于约 $40M、$24M 下限接近真实情况的证据、14
              个百万美元级账户内部集中、平台厂商捕获预算，或网络安全倍数整体压缩。如果管理层证明 ARR 高且优先权条款干净，这一估值可以作为增长溢价型网络安全轮次来辩护；否则，D 轮按估算 ARR
