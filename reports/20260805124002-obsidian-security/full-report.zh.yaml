      - number: '2.2'
        title: TAM、SAM 与 SOM 测算口径
        blocks:
          - type: paragraph
            body: >-
              最有防守性的漏斗顶端 TAM，是 2026 年 AI Agent Security 约 $26 billion 的估算，因为 Obsidian 明确销售 AI
              智能体安全和运行时治理。但这个数字不应直接进入收入假设。更窄的 SAM 应锚定 NHI Security 和 SSPM，因为这些品类对应身份、SaaS 权限、第三方集成和治理工作流。以约 $8.22
              billion 的 NHI Security 和约 $3.69 billion 的 SSPM 为基础，并扣除重叠后，2026 年实际 SAM 区间约为 $8 billion–$12 billion。$1.65
              billion 的窄口径 Agentic AI Security 估算，可作为新生智能体专项控制的下限视角；$3.42 billion 的 ITDR 是相邻项，而不是可直接相加项。SOM
              小得多：已披露客户意味着约 $24 million ARR 下限，当前 ARR 合理区间约为 $40 million–$70 million。因此，在管理层提供
              ARR、NRR、细分结构和销售管线转化前，近期可获得市场应框定在约 $50 million–$150 million。
