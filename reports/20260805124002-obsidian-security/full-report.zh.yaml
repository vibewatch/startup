      - CV022
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 估值区间图显示，除非 ARR 已在高位，Series D 轮附近能站住的合理区间很窄。
    data:
      items:
        - label: 悲观 / ARR 下限
          low: 0.2
          mid: 0.3
          high: 0.5
          detail: ~$24M ARR 下限，约 8-13x，带下行缓冲。
          tone: negative
        - label: 基准 / 不透明折价
          low: 0.6
          mid: 0.85
          high: 1.1
          detail: $40-50M ARR，不透明折价后约 15-22x。
          tone: warning
        - label: Series D 轮价格
          low: 1.1
          mid: 1.1
          high: 1.1
          detail: 观察到的 $1.1B 投后估值。
          tone: neutral
        - label: 乐观 / 高溢价增长
          low: 1.3
          mid: 1.55
          high: 1.8
          detail: 若增长和留存得到验证，$70M+ ARR 对应约 19-25x。
          tone: positive
    approximationNotes: 区间单位为十亿美元，只表示简单倍数情景，不是正式估值意见。
    claimRefs:
      - CV001
      - CV010
      - CV011
      - CV012
      - CV034
      - CV035
      - CV036
      - CV044
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Obsidian 在市场拉力和客户验证上得分最高，在估值支撑和财务透明度上最低。
    data:
      items:
        - label: 市场拉力
          score: 8
          detail: AI 智能体 / NHI 市场增长强，企业风险紧迫感也强。
          tone: positive
        - label: 客户验证
          score: 8
          detail: 100+ 个大额支出客户、14 个 $1M+ 客户和 60 个 F500 logo 客户。
          tone: positive
        - label: 产品贴合度
          score: 8
          detail: 运行时治理和 MCP 清单贴合智能体式 AI 问题。
          tone: positive
        - label: 竞争护城河
          score: 6
          detail: Zenity 和平台厂商让稀缺性仍未被证明。
          tone: warning
        - label: 财务透明度
          score: 3
          detail: ARR、利润率、留存、烧钱速度和员工数仍未公开。
          tone: negative
        - label: 估值支撑
          score: 4
          detail: 支撑力度高度取决于 ARR 是否接近估计区间高端。
          tone: negative
        - label: 退出可选性
          score: 6
          detail: 网络安全 M&A 活跃，但退出价值仍取决于增长验证和条款。
          tone: warning
    approximationNotes: 评分是基于公开证据推导的 IC 定性评级，不是公司披露的 KPI。
    claimRefs:
      - CV021
      - CV024
      - CV027
      - CV028
      - CV031
      - CV032
      - CV033
      - CV042
