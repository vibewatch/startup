        - 下调倍数，并要求提供队列层面的证据。
      - - 平台商品化
        - Microsoft 或其他平台吞掉智能体治理预算。
        - 稀缺性溢价和独立供应商定价权受到挤压。
        - 重新评估品类份额和销售周期假设。
      - - 倍数压缩
        - 上市 / 私有网络安全公司估值中位数跌破投资测算区间。
        - 即使经营兑现，退出价值也会下降。
        - 使用更低退出倍数，并重新核算持股比例和回报。
      - - 结构性条款
        - Series D 条款栈里出现高额清算优先权、参与分配权或反稀释。
        - 名义估值高估普通股回报。
        - 推进前先建模清算瀑布。
    notes: 否决触发条件锚定可观察的尽调产出或市场数据，而不是泛泛的风险表述。
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV041
      - CV043
  - id: TV007
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - ARR 桥接
        - 合同 ARR、收入，以及从客户支出层级推导的桥接。
        - 决定隐含倍数应是 22x 还是 46x。
        - 要求提供 CFO 签认的 ARR 明细表和客户层级滚动表。
      - - 增长与留存
        - 收入增长、NRR、GRR、流失、扩张和队列留存。
        - 高溢价倍数需要持续扩张，而不只是客户名单。
        - 要求提供董事会 KPI 包和队列表。
      - - 经济模型与现金消耗
        - 毛利率、贡献利润率、现金消耗、现金跑道和员工数。
        - 若出现 Cyera 式经营亏损，高倍数下泡沫风险会放大。
        - 要求提供月度财务报表和经营计划。
      - - 客户集中度
        - 前十大客户收入占比，以及 14 个 $1M+ 账户中的集中度。
        - 大客户既能支撑 ARR，也可能带来脆弱性。
        - 要求提供匿名化客户集中度明细和客户背调名单。
      - - 股权结构和优先权
        - 清算优先权、参与分配权、期权池、附函和按比例认购权。
        - 投资人回报可能不同于企业价值。
        - 审阅融资文件和股权结构模型。
      - - 竞争证据
        - 与 Zenity、Microsoft 原生控制和既有网络安全平台相比的赢单 / 输单。
        - 决定估值是否配得上稀缺性溢价。
        - 开展客户访谈，并按竞争对手审阅销售管线转化。
    notes: 这些问题是从公开证据区间走到可投资价格所需的最低材料包。
    claimRefs:
      - CV037
      - CV042
      - CV043
      - CV044
