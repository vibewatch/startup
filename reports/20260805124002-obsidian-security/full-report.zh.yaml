        title: 身份、总部与品类定位
        blocks:
          - type: paragraph
            body: >-
              Obsidian Security 最适合被锚定为一家总部位于加州 Palo Alto、成立于 2017 年的私营网络安全公司；当前定位是为企业第三方 SaaS 应用中的 AI
              智能体和非人身份提供运行时治理。Palo Alto 总部应作为当前标准字段，因为最新的 2026 年 8 月融资报道反复使用 California/Palo Alto 口径；暗示 Newport Beach
              的旧资料并非完全忽略，但证据更弱且明显过时，应作为显性证据缺口，而不是主要身份信息。商业模式也已越过早期 SSPM 叙事。当前官方和独立报道都把 Obsidian 描述为帮助安全团队盘点 AI 智能体、MCP
              服务器、模型、非人身份和策略违规，并在动作生效前介入。也就是说，公司是后期 AI 智能体治理供应商，而不是一款旧式 SaaS 态势管理工具。
