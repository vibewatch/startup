              和首席科学家血统。Imam 带来 Shape Security 的商业化和客户领导经验，Norwest 将其关联到约 $1 billion 的 F5 退出，他也是最新 Series D
              叙事中被引用的高管。公开领导层目录支持当前 CEO 字段，但没有解决董事会构成、观察员权利、委员会结构或投资人控制。因此，治理尽调应盯住董事会材料、继任计划，以及创始人的产品权和非创始人 CEO
              权限是否划分清楚。
