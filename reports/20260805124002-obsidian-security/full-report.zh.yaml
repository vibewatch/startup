            body: >-
              Obsidian 的客户证明先来自规模披露；对私营网络安全厂商来说，这些披露异常具体。公司披露的 2026 年 Series D 资料称，其有 100+ 个年付超过 $100,000 的客户、14+ 个年付超过
              $1,000,000 的客户，以及 60 家 Fortune 500
              客户，覆盖大型金融机构、社交媒体网络和电信提供商。这些事实支持真实企业采用，而不只是试点，因为披露的付费门槛意味着生产预算归属，以及至少一定程度的多利益相关方采购。分层仍需谨慎：金融外部证明最强，因为一个匿名
              Fortune 500 银行董事出现在客户参考语料中；电信有 CB Insights 提供的 T-Mobile 具名客户 logo；社交媒体只披露为类别；Snowflake
              提供高质量数据平台案例。Obsidian 围绕 AI 智能体、非人身份和第三方 SaaS 应用的产品定位，解释了为什么安全、身份和 SaaS
              负责人可能是买方、用户和付款方；但公开记录还没有把每个已披露分层映射到合同规模、续约状态或生产范围。
