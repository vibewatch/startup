      - 阈值 / 事件
      - 传导到投资判断
      - 行动含义
    rows:
      - - ARR 证据不达标
        - 经审计 ARR 低于 ~$40M，或接近 ~$24M 底线。
        - 隐含倍数会远高于上市 / 私有网络安全公司的常规区间。
        - 若没有重大价格保护，不要按 $1.1B 投资测算。
