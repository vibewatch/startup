companyProfile:
  summary: >-
    Obsidian Security 是一家总部位于加州 Palo Alto 的网络安全公司，成立于 2017 年，已从 SaaS 安全态势管理（SSPM）延伸到面向企业第三方 SaaS 应用中的 AI
    智能体和非人身份的运行时治理与安全，覆盖 Microsoft 365、Salesforce、Workday 等。2026 年 8 月，公司完成由 Crescent Cove Advisors 领投的 $85 million
    Series D，投后估值 $1.1 billion，累计融资超过 $200 million。公司披露的商业化进展包括超过 100 个年付超过 $100,000 的客户、超过 14 个年付超过 $1 million 的客户，以及
    60 个 Fortune 500 客户，但当前收入、ARR、利润率、留存和员工数未公开。
