      - number: '5.3'
        title: 标准、信任与风险控制
        blocks:
          - type: paragraph
            body: >-
              产品论点最强的外部验证来自标准机构，而不是独立产品基准。OWASP 和 CSA 描述的 MCP 威胁模型，主要由提示词注入、工具投毒、最小权限失效、OAuth
              和授权错误、不安全服务器或工具设计构成。Obsidian 的公开主张与这套控制语言贴合，因为资产清点、模型注册表和行动前策略执行，正是运行时护栏需要的基础能力。反向读法同样重要：PipeLab 的 2026 年
              MCP 安全评估提到数千个 MCP CVE，意味着 Obsidian
              正在一个不成熟且波动很大的协议生态里建设。机会很大，产品有效性负担也很重；安全买家需要看到控制能对抗高级智能体攻击，而不只是治理覆盖的营销说法。
