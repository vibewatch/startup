        - 按产品领域索取模块附加购买率和扩张客群
      - - 基于证明的定价权
        - 100+ 客户超过 $100K、14+ 超过 $1M，外加 60 家 Fortune 500，构成溢价证据
        - Zenity 的 $125M 融资和 230+ 员工带来可信度，即便未披露估值
        - 大型智能体项目的候选名单可能变成 Obsidian 对 Zenity
        - 验证续约、NRR 和竞争替换率
      - - 摩擦最低的切入点
        - API / 无代理 SaaS 接入和运行时控制可吸引中央安全团队
        - Push 通过浏览器扩展切入；Nudge 通过发现切入；Grip 通过影子 SaaS/AI 切入；Valence 通过 SaaS 网格切入
        - 若买方痛点窄于运行时治理，竞争对手可先于 Obsidian 落地
        - 在客户访谈中梳理买方工作流、初始触发点和价值兑现时间
      - - 捆绑 / 商品化风险
        - 只有能在足够多 SaaS / 智能体界面可靠阻断策略违规，运行时执行才有差异化
        - SSPM、浏览器、身份和原生平台控制可能让发现和态势检查商品化
        - Obsidian 必须证明运行时效果和覆盖广度，而不只是品类标签
        - 在 Copilot Studio、Agentforce、n8n、Claude Code 和启用 MCP 的工作流中跑红队场景
    notes: 允许来源块中没有公开价格和折扣数据，因此本表把已观察到的包装同必要商业尽调分开。
