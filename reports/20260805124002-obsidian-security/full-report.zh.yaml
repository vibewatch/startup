  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
    rows:
      - - 乐观
        - ARR 接近 $70M+，增长仍享受溢价，智能体治理收入放量，网络安全溢价可比对象窗口仍在。
        - 约 $1.3B-$1.8B 支撑，对应约 19-25x ARR；$1.1B 入场价可能跑通。
        - 需要尚未公开的私有证据。
      - - 基准
        - ARR 约 $40M-$50M，标杆客户强，但利润率 / 留存证据不完整，投资者打入不透明折价。
        - 约 $0.6B-$1.1B 支撑，对应约 15-22x ARR；当前价格在区间顶部。
        - 最能被公开证据支撑。
      - - 悲观
        - ARR 接近 $24M 下限，品类采用放慢，或可比倍数压缩至 8-13x。
        - 约 $0.2B-$0.5B 支撑；相对 $1.1B 的下行很大。
        - ARR 未披露，不能排除。
      - - 泡沫情景
        - 尽管仍在亏损，私有网络安全融资仍以异常倍数成交。
        - 类似 Cyera 的 80x ARR 数据可能暂时验证高估值，但也抬高修正风险。
        - 这是反向信号，不是基准承销情景。
    notes: 区间是简单的 ARR 乘倍数情景，单位为美元企业价值十亿；不是管理层指引，也不是 DCF。
