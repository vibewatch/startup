  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 竞争、平台风险与市场时点
        blocks:
          - type: paragraph
            body: >-
              Obsidian 在一个看似紧迫但尚未定型的市场里融资。最强竞争警示是 Zenity：它于 2026-08-03 融资 $125 million，比 Obsidian 宣布 $85 million Series
              D 早一天，并且明确定位于保护自主 AI 智能体。更广泛的赛道也很拥挤，Grip、Push、Nudge、Valence、AppOmni，以及身份/安全平台既有玩家，都在争夺重叠的 SSPM、SaaS
              发现、浏览器身份和智能体治理预算。这种拥挤很重要，因为 Obsidian 的转向不是从 SSPM 进入一个垄断品类的干净空白市场动作；它押注的是运行时 AI
              智能体治理能成为足够大的预算线，从而支撑独角兽估值。Microsoft 原生智能体安全工作是更尖锐的平台风险。如果 Copilot、Defender、Salesforce、Google 或 SaaS
              平台把足够多的治理控制直接嵌进企业套件，Obsidian 可能仍有技术价值，却失去定价权和战略紧迫性。市场时点是相连风险：70%+ 客户智能体暴露和 144:1 NHI
              比例支持问题表述，但公开来源尚未证明续约耐久性、独立 AI 治理的付费意愿，或预算从 SSPM
              转向智能体运行时控制的速度。进一步尽调还要关注买方教育：安全团队可能认同智能体有风险，却仍会推迟购买新平台，直到内部试点引发事件、审计发现或董事会级要求。
