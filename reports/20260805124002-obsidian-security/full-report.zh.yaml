      - number: '8.2'
        title: 可比倍数框架
        blocks:
          - type: paragraph
            body: >-
              可比框架给出的是分裂结论。Windsor Drake 2026 年网络安全研究显示，普通上市网络安全公司接近 6–8x NTM 收入，云或 AI 原生头部公司约 14–22x，非上市网络安全公司约
              15.2x，顶级云 M&A 最高可到 35x。上市可比公司呈现的是离散分布，而不是单一答案：CrowdStrike 按 FY26 收入 $4.81B 和 ARR $5.25B 约 25.1x；Zscaler 按约
              $3.17B TTM 收入和约 $25B 市值约 11.7x；Palo Alto 约 15x，Cloudflare 约 31.5x，Fortinet 约 8.7x，Okta 约 5x。私有交易和 M&A
              参考更不稳定。Wiz 以 $32B 估值和 $1B+ ARR 支撑战略稀缺性溢价；Cyera 即便亏损仍被讨论 80x ARR，则是泡沫过热的反向提醒。NinjaOne
              表明，只要高速增长同时带来盈利，投资人仍愿意付高价。只有尽调验证 ARR 高、增长可持续，Obsidian 才配进入溢价组比较。
