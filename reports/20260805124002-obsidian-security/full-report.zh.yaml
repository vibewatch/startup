  - id: FE002
    title: 运行时治理数据路径
    type: flow
    layout: wide
    summary: 关键产品主张，是把发现和图谱上下文接入行动前的运行时策略决策，再延伸到事后厘清。
    data:
      nodes:
        - id: discover
          label: 发现 SaaS 应用、NHI、智能体和集成
          detail: 基于 API 或无代理接入建立清单。
        - id: map
          label: 映射到知识图谱
          detail: 关联身份、权限、数据敏感性、应用和智能体关系。
        - id: mcp
          label: 盘点 MCP 服务器和模型
          detail: 把 MCP 服务器映射到调用它们的智能体，并跟踪模型注册表。
        - id: intent
          label: 观察拟执行的智能体动作
          detail: 捕获工具调用、目标 SaaS 对象和策略上下文。
        - id: evaluate
          label: 评估运行时策略
          detail: 检查权限升级、过度访问、策略违规、模型切换和工具授权。
        - id: block
          label: 生效前阻断或放行
          detail: 在智能体动作落地前执行决策。
        - id: alert
          label: 发送 SOC / SIEM / SOAR 信号
          detail: 馈送安全运营和修复工作流。
        - id: forensics
          label: 运行入侵厘清
          detail: 借助图谱和日志上下文，缩短疑似滥用后的平均自证清白时间。
      edges:
