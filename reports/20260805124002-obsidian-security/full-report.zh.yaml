      - number: '5.4'
        title: 路线图、成熟度与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              从公开证据看，产品成熟度可信但不完整。2026 年 1 月 SaaS 供应链安全发布，显示 Obsidian 从态势延伸到集成风险。2026 年 8 月 Series D 公告随后把新资金与
              R&D、Fortune 500 扩张，以及面向 Claude Code 和 Cowork 的原生治理相连。这些里程碑与市场转向智能体化 SaaS
              工作流一致。但是，来源集合没有暴露足够硬的工程证据：没有公开阻断率基准、误报率、模型注册表结构定义、正常运行历史、按应用列出的连接器覆盖清单或详细支持 SLA。开发者信号也弱；供应商维基只是替代指标，不能替代开放
              SDK、公开变更日志或活跃社区。因此，尽调应先测试运行时有效性、SaaS 连接器可靠性和策略治理运营，再把架构视为完全已证。最后一条产品尽调线应在对抗性、接近生产的场景中测试控制平面：已批准与未批准 MCP
              服务器、一次模型替换尝试、智能体请求敏感 HR 或销售记录、带有陈旧 OAuth 授权范围的服务账号，以及开发者智能体触碰生产数据。这些测试会把公开架构从可信的图谱加策略论点，转化为可度量的安全证据；也会揭示
              Obsidian 的 SSPM 底座是否提供了足够上下文，避免运行时阻断噪声。剩余尽调应由证据牵引，而不是由路线图牵引。管理层还应展示策略变更审计轨迹、例外审批记录，以及被阻断智能体动作的客户支持升级记录。
