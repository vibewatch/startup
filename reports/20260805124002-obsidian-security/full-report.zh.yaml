  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 推荐结论从强品类证据出发，最终收束到估值偏高、必须拿证据过关。
    data:
      nodes:
        - id: category
          label: AI 智能体 / NHI 安全问题巨大
          detail: 市场报告和 144:1 的 NHI 压力支撑买方紧迫性。
        - id: traction
          label: 企业牵引可见
          detail: 100+ 个 $100K 客户、14+ 个 $1M 客户和 60 个 Fortune 500 客户。
        - id: price
          label: $1.1B Series D 轮
          detail: 名义价格已验证，但 ARR 分母未披露。
        - id: multiple
          label: 隐含倍数区间很宽
          detail: 以 $24M 下限计为 ~46x，以 $50M 计为 ~22x，以 $70M 计为 ~15.7x。
        - id: risk
          label: 竞争与泡沫风险
          detail: Zenity 竞争和 Cyera 80x ARR 信号压低信心。
        - id: call
          label: 跟踪 / 继续研究
          detail: 只有 ARR、留存、经济性和干净条款得到验证，才继续推进。
      edges:
        - to: traction
          label: 市场需求还要验证
          from: category
        - to: price
          label: 支撑独角兽轮次
          from: traction
        - to: multiple
          label: 需要 ARR 分母
          from: price
        - to: call
          label: 推动入场纪律
          from: multiple
        - to: call
          label: 抬高证据门槛
          from: risk
    approximationNotes: 该流程展示投资判断逻辑，不代表公司运营流程。
    claimRefs:
      - CV024
      - CV028
      - CV029
      - CV030
      - CV033
      - CV044
  - id: FV002
    title: 可比倍数柱状图
    type: bar
    layout: wide
    summary: 只有 ARR 已处高位，Obsidian 才接近高溢价上市公司区间；若 ARR 贴近下限，就会落入泡沫化区域。
    data:
      items:
        - label: Okta
          value: 5
          detail: 上市身份安全可比公司 EV/Revenue。
          tone: neutral
        - label: 上市网络安全中位数
          value: 7
          detail: Windsor Drake 6-8x NTM 上市网络安全区间中点。
          tone: neutral
        - label: Fortinet
          value: 8.7
          detail: 上市网络安全较低溢价参照。
          tone: neutral
        - label: Zscaler
          value: 11.7
          detail: 云安全参照。
          tone: neutral
        - label: 私有网络安全中位数
          value: 15.2
          detail: Windsor Drake 私有网络安全中位数。
          tone: warning
        - label: Palo Alto Networks
          value: 15
          detail: 大型平台型网络安全可比公司。
          tone: neutral
        - label: Obsidian，ARR $70M
          value: 15.7
          detail: $1.1B / $70M 估计 ARR。
          tone: warning
        - label: Obsidian，ARR $50M
          value: 22
          detail: $1.1B / $50M 估计 ARR。
          tone: warning
        - label: CrowdStrike
          value: 25.1
          detail: 高溢价上市网络安全可比公司。
          tone: positive
        - label: Cloudflare
          value: 31.5
          detail: 高溢价云原生可比公司。
          tone: positive
        - label: Obsidian，$24M 下限
          value: 45.8
          detail: $1.1B / $24M 估计下限。
          tone: negative
        - label: Cyera 反向信号
          value: 80
          detail: 据报道，亏损之下仍报出私有市场 ARR 倍数。
          tone: negative
    approximationNotes: 数值为 EV/Revenue 或 ARR 倍数；Obsidian 数值由披露支出层级和估值推算。
    claimRefs:
      - CV010
      - CV011
      - CV012
      - CV013
