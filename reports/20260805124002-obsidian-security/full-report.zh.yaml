            body: >-
              建议是跟踪，而不是无条件买入，因为 D 轮价格偏贵，公开证据不完整。正向论点有吸引力：AI 智能体 / NHI 安全市场很大，Fortune 500
              客户已验证，财团支持强，运行时治理能力也契合新的企业控制平面。反向论点同样重要：品类时点仍早，Zenity 早一天融资 $125M，Microsoft
              和其他平台可能吸收部分工作流，收入分母仍是私有信息。牛市情景需要 ARR 接近 $70M、高增长，且市场能容忍上市可比公司的溢价倍数；基准情景假设 ARR 为 $40M–$50M，且给予不透明折价；熊市情景采用
              $24M 下限和压缩倍数。这些情景对应的是估值偏紧、信心中等、风险较高。IC 应持续观察市场规模、客户证据、护城河、经济性、竞争、估值和证据质量，而不是把独角兽头衔本身当成证明。
