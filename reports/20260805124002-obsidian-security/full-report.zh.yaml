              估值风险取决于 ARR 分母。在约 $24 million 的已披露付费下限上，$1.1 billion 估值隐含约 46 倍 ARR；在 $50 million 基准估算上约 22 倍；在 $70
              million 高位估算上约 16 倍，接近 Finro 和 SaaS Mag 引用的私营网络安全基准区间。反向读法是，Finro 约 15.4 倍 ARR 的私营公司中位数，以及约 10–13
              倍的降估值融资压缩区间，意味着 Obsidian 的真实 ARR 必须很高，或收入质量必须异常强，才能支撑这个估值。Zenity
              的竞争融资强化了激进投入的必要性；更广泛的网络安全融资数据则显示市场支持但挑剔。结论是跟踪，不要盲目承接：Obsidian
              的公开商业化证据强于多数私营公司，但留存、毛利率、现金消耗和集中度证据到位前，不能把估值视为公平。若管理层提供 ARR、NRR、现金或队列数据，应立即刷新这组敏感性。
