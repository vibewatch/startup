              billion 估值、Crescent Cove 领投、既有投资人参投。同一组证据称，公司目前五轮累计融资超过 $200 million；历史来源还能识别 Series C、Series B-1 和最早
              Series A
              的支持者。这足以拼出融资时间线和资本充足度判断，但不足以建现金模型。轮前现金、月度现金消耗、资金可支撑月数、债务和项目融资义务均未公开。正确解读是“有容量，但消耗未知”：新一轮显然拉长了战略选项，却没有公开来源能验证它买来多少个月，或哪些经营里程碑会触发下一轮融资。
