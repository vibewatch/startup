        title: 竞争格局与可比对手集合
        blocks:
          - type: paragraph
            body: >-
              竞争格局已不再是简单的 SSPM 短名单。Obsidian 现在竞争的是企业内部治理 AI 智能体、非人身份和第三方应用中 SaaS-to-SaaS 活动的任务。这让它面对 Zenity 等直接 AI
              智能体治理厂商，Grip、Nudge、Push 等 SaaS 和影子 IT 控制厂商，Valence 等 SaaS-to-SaaS 网状治理专家，AppOmni 等成熟 SSPM 平台，来自 IdP/SaaS
              管理员的现状控制，以及内部治理自建。Zenity 是最重要的直接对手，因为它在 Obsidian Series D 前一天融资 $125 million，并公开把自己定位为覆盖企业智能体构建场景的 AI
              智能体安全公司。Obsidian 的反向定位不同：它提供可在执行前检测并阻断风险动作的运行时治理，并配套 NHI 图谱和企业 SaaS
              上下文。因此，品类有吸引力但竞争激烈，买方可能按控制插入位置分层：智能体开发、浏览器遥测、影子 SaaS 发现、SaaS 网状治理或运行时执行。
