      - number: '7.3'
        title: 估值、财务、人员与执行风险
        blocks:
          - type: paragraph
            body: >-
              估值风险高，因为 $1.1 billion 投后价格对应的是未披露的 ARR、毛利率、NRR、现金消耗、资金可支撑月数和员工数。已披露付费指标有意义——100+ 个年付超过 $100,000 的客户、14+
              个年付超过 $1 million 的客户、60 家 Fortune 500 客户——但它们只建立下限。按标准事实表方法，ARR 至少约 $24 million，合理可能在 $40 million–$70
              million；这把估值放进约 15x–45x 收入的宽估算区间。若公司是一个有耐久扩张的品类领导者，这个区间可以接受；但公开来源没有证明续约质量或收入集中度。因此，执行风险居中。Obsidian
              拥有强创始人和技术履历，也有一位具备 Shape Security 商业化经验的非创始人
              CEO；但它必须同时管理品类转向、企业平台伙伴关系、高级威胁研究和激烈竞争。正确的投资姿态不是否定公司，而是把价格、披露和阻断证明门槛说清楚。如果私有尽调不能把产品专属扩张与最新披露的客户门槛连接起来，投资人应把
              Series D 视为战略验证，而不是耐久经济性的完整证明。
