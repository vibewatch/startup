  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: D 轮价格与隐含倍数
        blocks:
          - type: paragraph
            body: >-
              Obsidian 2026 年 8 月 4 日的 D 轮融资，让估值章节有了明确标题，也留下了模糊分母。分子证据充分：公司宣布由 Crescent Cove Advisors 领投，以 $1.1B 投后估值融资
              $85M，老股东继续跟进，累计融资已超过 $200M。难点在分母。Obsidian 披露有 100+ 个客户每年支出至少 $100,000，14+ 个客户支出至少 $1M，另有 60 家 Fortune 500
              客户，但没有披露 ARR、增长、利润率、留存、现金消耗、续航期或员工数。沿用财务章节的公开下限法，已披露支出层级推导出约 $24M ARR；合理承销区间仍约为 $40M–$70M。这个区间让 $1.1B
              价格高度敏感：按下限约 46x，按 $50M 为 22x，按 $70M 为 15.7x。因此，这一估值并非讲不通，但对价格和证据都极其敏感。
