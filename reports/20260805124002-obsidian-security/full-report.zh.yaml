      - number: '2.3'
        title: 买方分层、预算责任人与采用路径
        blocks:
          - type: paragraph
            body: >-
              购买中心是跨职能的，因为运营问题横跨 AI、身份、SaaS 管理和安全运营。CISO 和安全运营团队关心攻击面和策略执行；身份团队关心 NHI 蔓延和高权限授予；SaaS 应用负责人关心业务流程连续性；AI
              平台或转型团队关心在不失去工具和数据控制的情况下部署智能体。Obsidian 披露的 60 家 Fortune 500 客户和 100
              多个六位数付费客户，支持企业预算容量，但没有说明预算负责人或产品线拆分。采用路径可能从盘点 SaaS 应用、集成、智能体和 MCP
              服务器开始；再进入风险评分和策略设计；当智能体尝试权限升级、过度访问数据或使用未经批准工具时，最终变成运行时阻断。70% 的客户智能体采用率让这成为 2026
              年当下的采购问题，而不是遥远场景；但采购仍会要求证明运行时控制能避免误报，并接入 SOC 工作流。
