        title: 技术、法律与威胁态势风险
        blocks:
          - type: paragraph
            body: >-
              同一威胁环境既验证了 Obsidian，也提高了产品在高风险场景中交付不足的风险。2026 年反向来源反复把提示词注入列为企业 AI 智能体首要风险；Microsoft 的 RCE
              研究则显示，智能体框架行为可把提示操纵转化为 shell 级后果。Salesloft/Drift OAuth 事件尤其相关，因为它说明 AI 聊天智能体或 OAuth/NHI 被攻破后，影响会沿
              Salesforce、AWS 和 Snowflake 表面级联——这正是 Obsidian 称自己能治理身份和动作的 SaaS 环境。MCP 漏洞覆盖和 OWASP MCP
              指南又加上一层：资产清点、最小权限、模型注册表和运行时阻断是必要能力，但正在变成预期中的基线控制。因此，法律和监管暴露是间接但实质的。公开来源没有显示 Obsidian
              当前有诉讼或执法行动，但企业买方会把漏报、权限过大的智能体和 SaaS 数据暴露视为合同、隐私和事件响应风险。Obsidian
              的负担是证明它能在动作执行前阻断高级攻击，而不只是监控一个听起来吓人的品类。风险是不对称的，因为一个旗舰客户错过的漏洞，削弱信任的速度会快过许多安静阻断建立信任的速度，尤其是当事件叙事在安全社区传播时。
