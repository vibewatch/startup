  headline: Obsidian 在新兴 AI 智能体治理市场有真实品类领先地位，也已确认 $1.1B 独角兽估值；但估值依赖估计而非披露 ARR，赛道又快速拥挤，因此更适合继续观察，而不是按高信心价格出手。
