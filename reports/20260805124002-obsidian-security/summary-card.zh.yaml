  topStrengths:
    - Obsidian 在第三方 SaaS 平台上的运行时 AI 智能体与非人身份治理起步早、差异化明确；这是一个市场预测规模大、增长快的新品类。
    - 公司披露的阶段性牵引力很强：100 多家客户年花费超过 $100K，14 多家超过 $1M，另有 60 家 Fortune 500 客户，并有 Snowflake 等具名背书。
    - 公司完成估值 $1.1B 的 $85M Series D 后资本充足，投资方包括 Crescent Cove、Greylock、Menlo、Norwest、IVP 等蓝筹机构，累计融资超过 $200M。
  topRisks:
    - $1.1B 估值大约对应估计 $50M ARR 的 22 倍、披露约 $24M 消费下限的 46 倍，因此定价依赖未经验证的高增长 ARR 假设。
    - 竞争正在升温：直接对手 Zenity 早一天宣布累计融资 $125M，Grip、Push、Nudge、Valence、AppOmni 等也在挤压差异化和定价权。
    - Microsoft、Salesforce、Google 正在内嵌原生智能体安全控制，平台商品化风险不小，可能侵蚀 Obsidian 独立产品价值。
    - AI 智能体治理品类还很早，采用节奏并不确定；从 SSPM 转向智能体，是押注一个可能比预测更慢成熟的市场。
  unresolvedGaps:
    - 需要审计 ARR、收入运行率、增长率，以及从已披露客户消费分层推导 ARR 的桥接。
    - 需要毛利率、净收入留存率、流失率和客户集中度数据，以证明可持续的经常性收入经济性。
    - 需要披露烧钱速度、现金跑道和员工数，以评估资本效率和执行能力。
    - 需要确认总部（Palo Alto 还是旧 Newport Beach），并在总量统计之外提供更清晰的具名 Fortune 500 客户证据。
