tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - AI-agent runtime governance
    - Agent inventory, policy design, runtime blocking, model/tool visibility
    - Generic AI productivity software without security control
    - CISO, AI platform owner, security operations
    - Core Obsidian category and primary TAM link
  - - Non-human identity security
    - Discovery, entitlement review, secrets/service-account controls, privileged NHI monitoring
    - Human-only IAM, workforce SSO seats without NHI scope
    - Identity security, IAM, CISO
    - Primary SAM anchor because NHIs are the operating entities
  - - SSPM / SaaS governance
    - Misconfiguration detection, SaaS-to-SaaS integration controls, app-permission posture
    - Cloud infrastructure posture and endpoint posture outside SaaS
    - SaaS app owners, security engineering
    - Legacy Obsidian base and current buyer bridge
  - - ITDR adjacency
    - Identity threat detection, suspicious identity behavior, response workflows
    - Full IAM replacement or endpoint detection unrelated to SaaS identities
    - SOC, IAM, threat detection teams
    - Budget adjacency but not fully countable as SAM
  - - Broad SPM adjacency
    - CSPM, DSPM, ISPM, DSPM-like posture analytics when connected to SaaS agents
    - Posture categories with no third-party SaaS or agent execution path
    - CISO, cloud security, data security
    - Useful context but excluded from direct SAM
  - - Status quo substitutes
    - Manual access reviews, IdP-native rules, spreadsheets, native platform governance
    - Dedicated third-party runtime agent-control platform
    - Security operations, application admins
    - Constrains adoption and pricing until risk is urgent
  notes: Boundary rows define Obsidian-relevant spend; broad SPM is intentionally shown as an adjacency rather than fully
    serviceable market.
