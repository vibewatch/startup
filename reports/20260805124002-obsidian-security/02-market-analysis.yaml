    - Copilot/Agentforce/n8n/Claude Code adoption
    - What false-positive tolerance is acceptable?
  - - Developer-agent environment
    - Engineering security and DevSecOps
    - Developers using autonomous coding agents
    - Engineering productivity and security budget
    - Restrict production-data access and unsanctioned tools
    - Autonomous developer agents touch sensitive repositories
    - Does Obsidian sell directly into developer workflows?
