- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - 144:1 non-human-to-human identity ratio
    - Positive driver
    - Current
    - Expands identity-governance need faster than human headcount growth
    - Validate measured ratio across Obsidian customers, not just aggregate claim
  - - 35,000+ third-party application surface
    - Positive driver
    - Current
    - Creates long-tail SaaS permissions and integration sprawl
    - Quantify average apps and integrations in won deals
  - - 70%+ customers already permitting AI agents
    - Positive driver
    - Current 2026
    - Moves category from future budget to active risk remediation
    - Ask what percentage bought agent-specific modules
  - - Runtime blocking before agent actions take effect
    - Positive driver
    - Current
    - Supports ROI narrative versus alert-only tools
    - Review false-positive rates and blocked-action case studies
  - - Fortune 500 and Global 2000 expansion
    - Positive driver
    - Near term
    - Raises ACV and enterprise credibility if sales cycles convert
    - Request pipeline by enterprise tier and vertical
  - - Research and Markets vs Frost SSPM conflict
    - Negative constraint
    - Current
    - Undermines single-number TAM precision and valuation narratives
    - Normalize SSPM taxonomies before underwriting SAM
  - - Well-funded Zenity competition
    - Negative constraint
    - Current 2026
    - Could compress win rates, pricing, and narrative ownership
    - Request competitive win/loss data against Zenity
  - - Native platform controls and status quo
    - Mixed constraint
    - Current / medium term
    - Can either validate need or commoditize parts of governance
    - Map which controls Obsidian performs better than native platforms
  notes: Rows intentionally mix drivers and constraints so market growth is tied to adoption timing and diligence asks rather
    than headline TAM alone.
