- id: buyers-and-adoption-path
  title: Buyer Segments, Budget Owners, and Adoption Path
  body: The buying center is cross-functional because the operational problem crosses AI, identity, SaaS administration, and
    security operations. CISOs and security operations teams care about attack surface and policy enforcement; identity teams
    care about NHI sprawl and privileged grants; SaaS application owners care about business-process continuity; and AI platform
    or transformation teams care about deploying agents without losing control of tools and data. Obsidian's disclosed 60
    Fortune 500 customers and 100-plus six-figure customers support enterprise budget capacity, but they do not identify budget
    owner or product-line split. Adoption likely starts with inventory of SaaS apps, integrations, agents, and MCP servers;
    moves into risk scoring and policy design; and then becomes runtime blocking when agents attempt privilege escalation,
    excessive data access, or unsanctioned tool use. The 70% customer agent-adoption figure makes this a current 2026 purchasing
    problem rather than a long-dated scenario, although procurement will still require proof that runtime controls avoid false
    positives and integrate with SOC workflows.
  claimRefs:
  - CM002
  - CM003
  - CM004
  - CM024
