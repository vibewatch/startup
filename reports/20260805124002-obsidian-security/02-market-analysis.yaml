chapter:
  number: 2
  title: Market Analysis
  summary: Obsidian sits in a credible AI-agent-security market, but the investable story depends on narrowing a ~$26B TAM
    to an estimated ~$8B–$12B enterprise SaaS/NHI SAM and a ~$50M–$150M near-term SOM tied to disclosed high-ACV customers.
sections:
- id: market-boundary
  title: Market Boundary and Included Spend
  body: 'Obsidian should not be sized against every cybersecurity or posture-management dollar that can be labeled AI. The
    working boundary is enterprise third-party SaaS and AI-agent governance: runtime controls for autonomous agents, non-human
    identity security, SSPM, SaaS-to-SaaS integration risk, and selected ITDR-like identity-detection workflows. Included
    spend is therefore the budget used to discover agents and integrations, map permissions, monitor behavior, block excessive
    data access, and prove policy compliance across SaaS applications. Excluded spend is broad cloud posture management, endpoint
    security, generic data posture management, and native platform controls that never touch third-party SaaS agents. Status
    quo matters because many enterprises still use manual SaaS reviews, IdP-native controls, spreadsheet approvals, or the
    built-in settings of Microsoft, Salesforce, and other application platforms. The market is attractive because Obsidian
    can point to 144 non-human identities for every human identity and more than 35,000 third-party apps, but the same breadth
    requires discipline in not counting every adjacent SPM dollar as serviceable market.'
  claimRefs:
  - CM005
  - CM006
  - CM007
  - CM021
  - CM022
  - CM023
  - CM028
  - CM029
  - CM036
  tableRefs:
  - TM001
- id: sizing-funnel
  title: TAM, SAM, and SOM Sizing Lenses
  body: 'The most defensible top-of-funnel TAM is the 2026 AI Agent Security estimate of roughly $26 billion, because Obsidian
    is explicitly selling security and runtime governance for AI agents. That number should not flow directly into revenue
    assumptions. A narrower SAM should be anchored in NHI Security and SSPM, because those categories map to identities, SaaS
    permissions, third-party integrations, and governance workflows. Using NHI Security at about $8.22 billion and SSPM at
    about $3.69 billion, while discounting overlap, produces a practical 2026 SAM range of approximately $8 billion to $12
    billion. The narrow Agentic AI Security estimate of $1.65 billion is a useful lower-bound lens for nascent agent-specific
    controls, while ITDR at $3.42 billion is an adjacency rather than a direct add-on. SOM is far smaller: disclosed customers
    imply an ARR floor of about $24 million and a plausible current ARR range of roughly $40 million to $70 million, so near-term
    obtainable market should be framed as approximately $50 million to $150 million until management provides ARR, NRR, segment
    mix, and pipeline conversion.'
