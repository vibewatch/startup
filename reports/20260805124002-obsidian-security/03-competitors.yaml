- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Pricing or packaging dimension
  - Obsidian read-through
  - Competitor read-through
  - Implication for buyer choice
  - Diligence ask
  rows:
  - - Public price availability
    - No standardized public list price retained in allowed source set
    - Competitor pages mostly expose positioning rather than comparable price cards
    - Procurement teams will rely on quotes, proof, and fit rather than public price tables
    - Collect live same-scope quotes from Obsidian, Zenity, Grip, Push, Nudge, Valence, and AppOmni
  - - Enterprise packaging breadth
    - AI-agent runtime governance, NHI graph, SaaS integration security, ITDR, and breach clarity can support platform packaging
    - Zenity packages agent security; AppOmni packages SSPM; Push, Nudge, Grip, and Valence package narrower control points
    - Breadth can raise ACV, but point tools may win departmental or faster deployments
    - Request module attach rates and expansion cohorts by product area
  - - Proof-based pricing power
    - 100+ customers above $100K, 14+ above $1M, and 60 Fortune 500 create premium evidence
    - Zenity's $125M round and 230+ staff create credibility even without disclosed valuation
    - The shortlist may become Obsidian versus Zenity for large agent programs
    - Verify renewal, NRR, and competitive displacement rates
  - - Lowest-friction entry point
    - API/agentless SaaS onboarding and runtime control can appeal to central security teams
    - Push enters through browser extension; Nudge through discovery; Grip through shadow SaaS/AI; Valence through SaaS mesh
    - Competitors can land before Obsidian if the buyer pain is narrower than runtime governance
    - Map buyer workflow, initial trigger, and time-to-value in reference calls
  - - Bundle/commoditization risk
    - Runtime enforcement is differentiated only if it reliably blocks policy violations across enough SaaS/agent surfaces
    - SSPM, browser, identity, and native platform controls can commoditize discovery and posture checks
    - Obsidian must prove runtime efficacy and coverage breadth, not just category labels
    - Run red-team scenarios across Copilot Studio, Agentforce, n8n, Claude Code, and MCP-enabled workflows
  notes: Public price and discount data were not available in the allowed source block, so this table separates observed packaging from required commercial diligence.
