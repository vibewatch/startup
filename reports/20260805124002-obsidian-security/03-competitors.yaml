- id: moat-durability-and-risks
  title: Moat Durability, Commoditization Risk, and Obsidian Differentiation
  body: "Obsidian's competitive defense has four pillars: runtime blocking, the non-human identity graph, disclosed enterprise traction, and breadth of agent-platform coverage. The strongest of these is runtime governance because it addresses the moment when an agent, integration, or MCP-connected workflow tries to act in SaaS. That is a clearer wedge than generic SSPM posture and more differentiated from Zenity's agent-build focus. The NHI graph also benefits from the 144:1 ratio Obsidian cites for non-human to human identities inside third-party applications. Enterprise proof matters too: 60 Fortune 500 customers and many high-ACV accounts can shorten buyer trust cycles. The risk is that this moat is still proving durability in a nascent market. Zenity has fresh capital and headcount, Grip attacks with an adverse comparison page, and incumbents or internal teams can commoditize pieces of discovery, posture, and policy. Obsidian should therefore be diligence-underwritten on runtime efficacy, integration breadth, customer expansion, and competitive-loss evidence, not on category momentum alone."
