- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat or risk
  - Direction
  - Why it matters
  - Competitive pressure
  - Monitoring signal
  rows:
  - - Runtime blocking before action
    - Moat
    - Moves Obsidian beyond static posture into active governance of agent behavior
    - Zenity if it expands deeper into runtime; native platforms if controls become bundled
    - Block-rate efficacy, false positives, and coverage across critical SaaS actions
  - - Non-human identity graph
    - Moat
    - The cited 144:1 NHI-to-human ratio creates a large graph problem that point tools may miss
    - Valence, Grip, AppOmni, and IdP-native controls
    - Number of mapped NHIs, SaaS-to-SaaS integrations, MCP servers, and risky permission paths per customer
  - - Enterprise reference base
    - Moat
    - 60 Fortune 500 customers and high-ACV accounts support procurement trust
    - Zenity's capital/headcount, AppOmni's SSPM maturity, and incumbent platforms
    - F500 logo retention, expansion, and competitive win rates
  - - Zenity capital and category narrative
    - Risk
    - A $125M Series C one day earlier can pull talent, mindshare, and budget into a direct rival
    - Zenity, its Norwest-led syndicate, and agent-builder ecosystem partners
    - Head-to-head loss rate, analyst mentions, and agent-platform partnership announcements
  - - Shadow SaaS/browser discovery wedge
    - Risk
    - Push, Nudge, and Grip can land earlier if the buyer starts with discovery or browser-layer control
    - Push, Nudge, Grip, and lightweight internal controls
    - Source-of-lead analysis and module attach after initial SaaS discovery projects
  - - SSPM commoditization
    - Risk
    - AppOmni and native SaaS controls can reduce willingness to pay for posture-only capabilities
    - AppOmni, Microsoft/native controls, IdP workflows, and internal build
    - Percent of ACV tied to runtime agent governance versus legacy SSPM modules
  notes: Risk severity is qualitative because public sources do not disclose Obsidian win/loss rates, retention, NRR, or realized ASP by module.
