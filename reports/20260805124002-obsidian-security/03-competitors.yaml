chapter:
  number: 3
  title: Competitors
  summary: Obsidian is best read as a runtime SaaS-governance challenger in a crowded AI-agent and SaaS-security field, with Zenity as the closest direct rival and Grip, Push, Nudge, Valence, and AppOmni attacking adjacent control points. Its moat rests on runtime enforcement, an NHI/SaaS graph, Fortune 500 proof, and broad agent-platform coverage, but Zenity's fresh $125M raise and build-time agent-development focus make the category highly contested.
sections:
- id: landscape-and-peer-set
  title: Landscape Shape and Competitive Peer Set
  body: "The competitive landscape is no longer a simple SSPM shortlist. Obsidian now competes for the enterprise job of governing AI agents, non-human identities, and SaaS-to-SaaS activity inside third-party applications. That puts it against direct AI-agent governance vendors such as Zenity, SaaS and shadow-IT control vendors such as Grip, Nudge, and Push, SaaS-to-SaaS mesh specialists such as Valence, established SSPM platforms such as AppOmni, status quo controls from IdP/SaaS administrators, and internal governance builds. Zenity is the most important direct rival because it raised $125 million one day before Obsidian's Series D and publicly frames itself around securing AI agents across enterprise agent-building surfaces. Obsidian's counter-positioning is different: runtime governance that can detect and block risky actions before execution, paired with an NHI graph and enterprise SaaS context. The category therefore looks attractive but contested, with buyers likely to segment by where they want controls inserted: agent development, browser telemetry, shadow-SaaS discovery, SaaS mesh governance, or runtime enforcement."
