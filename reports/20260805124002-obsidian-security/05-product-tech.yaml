- id: FE002
  title: Runtime-governance data path
  type: flow
  layout: wide
  summary: The key product claim is a pre-action loop from discovery and graph context into runtime policy decision and post-event
    clarity.
  data:
    nodes:
    - id: discover
      label: Discover SaaS apps, NHIs, agents, integrations
      detail: API-based or agentless onboarding builds the inventory.
    - id: map
      label: Map to knowledge graph
      detail: Correlates identities, entitlements, data sensitivity, apps, and agent relationships.
    - id: mcp
      label: Inventory MCP servers and models
      detail: Maps MCP servers to invoking agents and tracks the model registry.
    - id: intent
      label: Observe proposed agent action
      detail: Captures tool invocation, target SaaS object, and policy context.
    - id: evaluate
      label: Evaluate runtime policy
      detail: Checks privilege escalation, excessive access, policy violations, model switching, and tool authorization.
    - id: block
      label: Block or allow before effect
      detail: Enforces the decision before the agent action lands.
    - id: alert
      label: Send SOC / SIEM / SOAR signal
      detail: Feeds security operations and remediation workflows.
    - id: forensics
      label: Run breach clarity
      detail: Uses graph and log context to reduce mean time to innocence after suspected abuse.
    edges:
    - from: discover
      to: map
      label: inventory and identity context
    - from: map
      to: mcp
      label: agent and protocol context
    - from: mcp
      to: intent
      label: runtime tool invocation
    - from: intent
      to: evaluate
      label: policy decision
    - from: evaluate
      to: block
      label: pre-action enforcement
    - from: evaluate
      to: alert
      label: SOC workflow
    - from: alert
      to: forensics
      label: incident triage
    - from: forensics
      to: map
      label: graph enrichment
  approximationNotes: Flow describes the most supportable public control loop; actual latency and implementation details are
    not disclosed.
