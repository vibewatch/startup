- id: architecture-and-runtime-data-path
  title: Architecture and Runtime Data Path
  body: The architecture implied by public sources is a graph-backed control plane. API-based or agentless onboarding discovers
    SaaS applications, non-human identities, integrations, MCP servers, models, and agent relationships. A knowledge graph
    then correlates entitlements, data sensitivity, normal behavior, and tool invocation context. At runtime, an agent request
    is evaluated for privilege escalation, excessive data access, policy violations, model switching, and unsanctioned MCP
    or tool usage; the control decision can block before the action takes effect. That is materially different from a passive
    audit dashboard. The core diligence question is whether Obsidian can keep enough context in the decision loop without
    creating unacceptable latency, false positives, or connector fragility across many SaaS APIs and agent platforms.
  claimRefs:
  - CE005
  - CE009
  - CE010
  - CE011
  - CE012
  - CE018
  - CE021
  - CE022
  - CE037
  tableRefs:
