chapter:
  number: 5
  title: Product & Technology
  summary: Obsidian Security has a credible product arc from SSPM into runtime governance for AI agents and non-human identities,
    with MCP inventory, model registry, and SaaS graph context as the technical center. The key diligence risk is that MCP
    and agent platforms are immature, so Obsidian must prove low-latency blocking, connector depth, and false-positive control
    rather than only category positioning.
sections:
- id: runtime-governance-product-map
  title: Runtime Governance Product Map
  body: 'Obsidian Security is best understood as an SSPM company that has rebuilt its product narrative around runtime governance
    for AI agents and non-human identities inside third-party SaaS. The customer job is not merely to find an excessive permission
    after a quarterly posture scan; it is to discover which agents, MCP servers, integrations, service accounts, and models
    can touch sensitive SaaS data, then stop an unsafe action before it happens. That is a technically sharper value proposition
    because it requires inventory, identity context, behavioral baselines, policy evaluation, and enforcement in the transaction
    path. The same foundation also explains why legacy Salesforce, Workday, and Microsoft 365 SSPM experience matters: those
    systems are where new Copilot Studio, Agentforce, Workday, n8n, Claude Code, Cowork, and SaaS-to-SaaS automation risks
    show up in production.'
  claimRefs:
  - CE001
  - CE003
  - CE004
  - CE006
  - CE008
  - CE013
  - CE014
  - CE017
  - CE040
  tableRefs:
