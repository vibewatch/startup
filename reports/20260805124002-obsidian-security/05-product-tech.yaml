- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process
  - Role
  - Dependency
  - Risk
  rows:
  - - API-based / agentless onboarding
    - Discovers SaaS apps, integrations, NHIs, agents, and MCP surfaces
    - SaaS APIs, permissions, and connector reliability
    - Coverage gaps or API changes can weaken visibility
  - - Knowledge graph
    - Correlates users, NHIs, agents, apps, data sensitivity, and privileges
    - Identity data, app metadata, and behavior telemetry
    - Incorrect graph edges can create missed blocks or false positives
  - - MCP inventory
    - Tracks connected MCP servers and maps them to invoking agents
    - MCP server discovery and agent telemetry
    - Protocol immaturity and unmanaged local servers can evade inventory
  - - Model registry
    - Tracks underlying models behind agent workflows
    - Model identity and invocation metadata
    - Model switching/substitution detection needs reliable provenance
  - - Runtime policy engine
    - Evaluates and blocks risky actions before execution
    - Low-latency policy decisions and enforcement hooks
    - Latency, false positives, and bypasses are key diligence tests
  - - Forensics / breach clarity
    - Separates affected from unaffected SaaS activity after suspected abuse
    - Audit logs, graph history, and incident timelines
    - MTTI benefits are unquantified publicly
  notes: Architecture is reconstructed from product pages and coverage; no single canonical public system diagram or benchmark
