  - Relevant requirement
  - Obsidian-facing status
  - Gap
  rows:
  - - OWASP MCP Security Cheat Sheet
    - Address prompt injection, tool poisoning, authorization, and least privilege
    - Strong conceptual fit with inventory and pre-action runtime governance
