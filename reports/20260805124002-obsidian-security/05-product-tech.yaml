    - Need supported OAuth-app controls by SaaS platform
  - - SOC 2 / GDPR posture
    - Enterprise assurance and privacy/control evidence
    - FACTS.md and company surfaces indicate SOC 2/GDPR posture
    - Need current report, scope, subprocessor list, and audit exceptions
