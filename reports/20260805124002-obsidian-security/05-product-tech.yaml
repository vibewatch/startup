  - FE003
- id: standards-trust-and-risk-controls
  title: Standards, Trust, and Risk Controls
  body: 'The strongest external validation for the product thesis comes from standards bodies rather than independent product
    benchmarks. OWASP and CSA describe an MCP threat model dominated by prompt injection, tool poisoning, least-privilege
    failures, OAuth and authorization mistakes, and unsafe server or tool design. Obsidian''s public claims map well to that
    control language because inventory, model registry, and pre-action policy enforcement are exactly the primitives that
    a runtime guardrail needs. The adverse read is equally important: PipeLab''s 2026 MCP-security assessment describes thousands
    of MCP CVEs, which means Obsidian is building into an immature and volatile protocol ecosystem. The opportunity is large,
    but so is the product-efficacy burden; security buyers will need proof that controls work against advanced agent attacks,
    not only marketing claims about governance coverage.'
  claimRefs:
  - CE023
  - CE024
  - CE025
  - CE026
  - CE027
  - CE028
  - CE038
  tableRefs:
  - TE004
  figureRefs:
  - FE004
- id: roadmap-maturity-and-diligence-gaps
  title: Roadmap, Maturity, and Diligence Gaps
  body: 'Product maturity looks credible but incomplete from public evidence. The January 2026 SaaS supply-chain security
    launch shows Obsidian extending from posture into integration risk. The August 2026 Series D announcement then tied fresh
    capital to R&D, Fortune 500 expansion, and native governance for Claude Code and Cowork. Those milestones are consistent
    with the market shift toward agentic SaaS workflows. However, the source set does not expose enough hard engineering evidence:
    there is no public block-rate benchmark, false-positive rate, model-registry schema, uptime history, connector coverage
    list by application, or detailed support SLA. Developer-signal is also weak; a vendor wiki is only a proxy, not a substitute
    for an open SDK, public changelog, or active community. Diligence should therefore test runtime efficacy, SaaS-connector
    reliability, and policy-governance operations before treating the architecture as fully proven. A final product diligence
    track should therefore test the control plane in adversarial, production-like scenarios: sanctioned versus unsanctioned
    MCP servers, a model substitution attempt, an agent requesting sensitive HR or sales records, a service account with stale
    OAuth scope, and a developer agent touching production data. Those tests would convert the public architecture from a
    plausible graph-and-policy thesis into measurable security evidence and would also reveal whether Obsidian''s SSPM heritage
    creates enough context to avoid noisy runtime blocks. The remaining diligence should be evidence-led, not roadmap-led.
    Management should also show policy-change audit trails, exception approval records, and customer support escalations for
    blocked agent actions.'
  claimRefs:
