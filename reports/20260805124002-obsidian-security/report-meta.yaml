companyProfile:
  summary: Obsidian Security is a Palo Alto, California-based cybersecurity company founded in 2017 that has evolved from SaaS security posture management (SSPM) into runtime governance and security for AI agents and non-human identities operating inside enterprise third-party SaaS applications such as Microsoft 365, Salesforce, and Workday. In August 2026 it raised an $85 million Series D at a $1.1 billion post-money valuation led by Crescent Cove Advisors, bringing lifetime funding above $200 million. Company-reported traction includes more than 100 customers spending over $100,000 per year, more than 14 spending over $1 million, and 60 Fortune 500 customers, though current revenue, ARR, margins, retention, and headcount are not publicly disclosed.
  foundedDate: '2017-01-01'
  founders:
    - name: Glenn Chisholm
      role: Co-Founder, Chairman & Chief Product Officer
      background: Former CTO of Cylance and first CISO at Telstra, anchoring the company's product and security pedigree.
      claimRefs: [CO003, CO004]
    - name: Ben Johnson
      role: Co-Founder & CTO
      background: Security engineering leader with a Carbon Black co-founder background.
      claimRefs: [CO003, CO005]
    - name: Matt Wolff
      role: Co-Founder & Chief Scientist
      background: Data-science leader with roots in Cylance's machine-learning security research.
      claimRefs: [CO003, CO006]
  foundingLocation: Newport Beach, California, USA
  headquarters: Palo Alto, California, USA
  productSummary: Obsidian sells a platform that discovers and governs non-human identities and AI agents inside third-party SaaS applications, providing runtime governance that detects and blocks privilege escalation, excessive data access, and policy violations, plus MCP inventory, model registry, SaaS supply-chain security, and breach clarity/forensics.
  customerFocus: Large enterprises and Fortune 500 organizations—especially financial institutions, social media, and telecom—running many third-party SaaS applications with growing populations of AI agents and non-human identities.
  businessModel: Recurring enterprise SaaS subscriptions priced by scope of protected identities and applications, with customer spend tiered from six figures to seven figures per year.
  stage: Late-stage private (Series D unicorn)
  fundingStatus: Latest priced round is the August 4, 2026 Series D of $85 million at a $1.1 billion post-money valuation led by Crescent Cove Advisors with participation from existing investors including Greylock Partners and Menlo Ventures; lifetime funding exceeds $200 million across five rounds. Hasan Imam serves as CEO and is not one of the disclosed founders.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO007, CO011, CO012, CO015, CO019, CO021, CO026]
summary:
  headline: Obsidian has genuine category leadership in the emerging AI-agent-governance market and a confirmed $1.1B unicorn mark, but the valuation rests on estimated rather than disclosed ARR in a rapidly crowding field, supporting continued tracking over conviction pricing.
  overallScore: 6.3
  recommendation: track
