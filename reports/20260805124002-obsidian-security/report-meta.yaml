  topStrengths:
    - Obsidian holds an early, differentiated position in runtime AI-agent and non-human-identity governance across major third-party SaaS platforms, a category with large and fast-growing market forecasts.
    - Disclosed traction is strong for its stage—more than 100 customers spending over $100K/year, more than 14 over $1M/year, and 60 Fortune 500 customers—backed by named references such as Snowflake.
    - The company is well capitalized after an $85M Series D at a $1.1B valuation, with a blue-chip investor syndicate (Crescent Cove, Greylock, Menlo, Norwest, IVP) and over $200M raised.
  topRisks:
    - The $1.1B valuation implies roughly 22x on an estimated $50M ARR and about 46x on the disclosed ~$24M spend floor, so pricing depends on an unverified growth-premium ARR assumption.
    - Competition is intensifying, led by direct rival Zenity ($125M raised one day earlier) plus Grip, Push, Nudge, Valence, and AppOmni, compressing differentiation and pricing power.
    - Platform commoditization risk is material as Microsoft, Salesforce, and Google embed native agent-security controls that could erode Obsidian's standalone value.
    - The AI-agent-governance category is nascent and adoption timing is uncertain, so the SSPM-to-agent pivot is a bet on a market that may mature more slowly than forecasts imply.
  unresolvedGaps:
    - Need audited ARR, revenue run-rate, growth rate, and an ARR bridge from the disclosed customer-spend tiers.
    - Need gross margin, net revenue retention, churn, and customer-concentration data to prove durable recurring economics.
    - Need burn, runway, and headcount disclosure to assess capital efficiency and execution capacity.
    - Need confirmation of headquarters (Palo Alto vs. legacy Newport Beach) and clearer named Fortune 500 customer evidence beyond aggregate counts.
disclaimer: This report is based on publicly available information as of 2026-08-05 and is an analytical diligence artifact, not investment advice.
