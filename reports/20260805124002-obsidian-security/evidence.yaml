evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited or management-verified ARR, revenue, NRR, gross margin, burn, runway, and customer concentration detail.
    whyItMatters: The $1.1 billion valuation cannot be underwritten from spend-threshold disclosures alone.
    diligencePath: >-
      Request monthly ARR bridge, signed customer cohort schedule, revenue recognition policy, retention cohorts,
      gross-margin bridge, and cash runway model.
    relatedQuestionRefs:
      - QO008
      - QO011
      - QO019
      - QO025
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Current employee count by function, geography, attrition, and hiring plan.
    whyItMatters: >-
      Headcount is needed to assess R&D capacity, sales efficiency, burn, and whether the AI-agent governance pivot is
      sufficiently staffed.
    diligencePath: >-
      Request current HRIS export, board-approved headcount plan, open requisitions, and department-level attrition
      history.
    relatedQuestionRefs:
      - QO008
      - QO025
  - type: conflicting-data
    severity: minor
    topic: headquarters
    missingEvidence: >-
      A management-confirmed explanation reconciling Palo Alto headquarters with legacy Newport Beach profile
      references.
    whyItMatters: Later chapters need one canonical location for hiring, regulatory, and ecosystem analysis.
    diligencePath: Ask management for current headquarters address, legal entity address, and date of any office relocation.
    relatedQuestionRefs:
      - QO001
      - QO002
      - QO022
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: >-
      Complete board roster, observer rights, investor-rights agreement summary, debt/credit schedule, secondary
      history, and liquidation preferences.
    whyItMatters: Public funding announcements identify investors but not control terms or downside economics.
    diligencePath: >-
      Request board deck cover pages, cap table, financing documents, debt agreements, secondary transaction summary,
      and investor-rights agreement.
    relatedQuestionRefs:
      - QO012
      - QO018
      - QO021
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: leadership and investor map public enumeration
    missingEvidence: Management-confirmed full senior leadership list, board membership, and all material investors after the Series D.
    whyItMatters: The leadership and stakeholder tables are public-evidence maps, not exhaustive governance records.
    diligencePath: Request current org chart, board roster, cap table, and investor-rights summary from management.
    relatedQuestionRefs:
      - QO013
      - QO018
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sam-som-conversion
    missingEvidence: >-
      Management-provided ARR, NRR, churn, pipeline conversion, and revenue split by AI-agent governance, NHI, SSPM, and
      ITDR-adjacent modules.
    whyItMatters: >-
      Without product-line and retention data, SAM-to-SOM conversion remains an estimate derived from customer-count
      thresholds rather than observed revenue quality.
    diligencePath: Request cohort ARR by product, expansion rates, customer concentration, and pipeline by budget owner.
    relatedQuestionRefs:
      - QM007
      - QM010
      - QM022
      - QM025
  - type: conflicting-data
    severity: material
    topic: sspm-market-sizing
    missingEvidence: >-
      A normalized SSPM taxonomy reconciling Research and Markets $3.69B 2026 sizing with Frost $484.4M 2025 to $3.53B
      2030 sizing.
    whyItMatters: The SSPM leg of SAM changes materially depending on whether the market baseline or forecast taxonomy is used.
    diligencePath: Build a bottom-up SSPM market bridge by included modules, geography, and enterprise seat assumptions.
    relatedQuestionRefs:
      - QM009
      - QM021
      - QM023
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-budget-ownership
    missingEvidence: >-
      Independent procurement or customer-interview evidence showing whether Obsidian is paid from CISO, IAM, SaaS
      application, AI-transformation, or engineering budgets.
    whyItMatters: >-
      Budget owner determines sales cycle, competition, pricing tolerance, and whether Obsidian can expand beyond its
      initial wedge.
    diligencePath: Interview at least five customers and request pipeline tagging by economic buyer and originating pain point.
    relatedQuestionRefs:
      - QM011
      - QM014
      - QM025
    relatedTableRefs:
      - TM003
  - type: access-blocked
    severity: minor
    topic: frost-sspm-paywall
    missingEvidence: Full Frost & Sullivan SSPM report methodology behind the much lower 2025 baseline and 48.7% CAGR.
    whyItMatters: >-
      The public summary is enough to flag a conflict, but not enough to fully reconcile Frost against Research and
      Markets.
    diligencePath: Obtain the full Frost report or analyst call notes and map covered modules to the Research and Markets definition.
    relatedQuestionRefs:
      - QM009
      - QM021
      - QM023
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing-quotes
    missingEvidence: >-
      Live same-scope pricing quotes, discount schedules, and contract minimums from Obsidian, Zenity, Grip, Push,
      Nudge, Valence, and AppOmni.
    whyItMatters: Pricing and packaging power cannot be underwritten from public positioning pages alone.
    diligencePath: >-
      Run a controlled procurement simulation with identical Fortune 500 agent-governance requirements and collect
      written quotes.
    relatedQuestionRefs:
      - QP017
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: competitive-win-loss
    missingEvidence: >-
      Obsidian CRM data showing win/loss outcomes, displacement reasons, attach rates, and expansion by named
      competitor.
    whyItMatters: >-
      Public sources identify competitor pressure but do not prove whether Obsidian wins the most valuable
      opportunities.
    diligencePath: Request last-six-quarter competitive-loss exports and validate against customer-reference calls.
    relatedQuestionRefs:
      - QP018
      - QP020
  - type: missing-source
    severity: material
    topic: runtime-efficacy-benchmark
    missingEvidence: >-
      Independent technical benchmark comparing Obsidian, Zenity, Grip, Valence, AppOmni, and native controls on risky
      AI-agent actions.
    whyItMatters: >-
      Runtime governance is Obsidian's claimed moat, so efficacy and false-positive rates determine whether
      differentiation is durable.
    diligencePath: >-
      Commission red-team scenarios across Copilot Studio, Agentforce, n8n, Claude Code, Cowork, and MCP-connected SaaS
      workflows.
    relatedQuestionRefs:
      - QP004
      - QP006
  - type: conflicting-data
    severity: minor
    topic: competitor-scale
    missingEvidence: Standardized headcount, ARR, customer count, and valuation data for Obsidian and every named peer.
    whyItMatters: Zenity discloses more headcount detail than Obsidian, while other peers disclose uneven funding and scale data.
