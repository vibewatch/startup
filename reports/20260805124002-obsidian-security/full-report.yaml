      - number: '2.4'
        title: Growth Drivers, Constraints, and Sizing Gaps
        blocks:
          - type: paragraph
            body: >-
              The demand case is driven by enterprise agent adoption, the extreme 144-to-1 NHI ratio, SaaS application
              sprawl, and the need to block agent actions before data exposure occurs. The constraint case is equally
              important. First, the SSPM market-size evidence conflicts: Research and Markets reports a $3.69 billion
              2026 SSPM market with 12.6% CAGR, while Frost starts from only $484.4 million in 2025 and reaches $3.53
              billion by 2030 at 48.7% CAGR. That disagreement is an adverse market-sizing signal, not a rounding error.
              Second, direct competitor Zenity raised $125 million one day before Obsidian's Series D, implying category
              validation but also a capitalized rival fighting for the same enterprise agent-security budgets. Third,
              broad SPM at $26.35 billion can inflate the story if CSPM, DSPM, or generic posture products are counted
              as addressable without a SaaS-agent workflow. The diligence answer is to preserve the funnel, ask
              management for ARR and revenue mix, and test customer budgets by buyer persona instead of underwriting the
              headline TAM.
