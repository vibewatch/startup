      - number: '3.2'
        title: Zenity and Direct AI-Agent Governance Pressure
        blocks:
          - type: paragraph
            body: >-
              Zenity is the closest like-for-like threat, but the rivalry is not identical feature for feature. Public
              coverage describes Zenity as a fast-scaling AI-agent security company with 230-plus staff, New York
              headquarters, Tel Aviv R&D, founders Ben Kliger and Michael Bargury, and a $125 million Series C led by
              Norwest on August 3, 2026. That matters because the round was larger than Obsidian's $85 million Series D
              and arrived one day earlier, giving Zenity a strong narrative in the same news cycle. Its public pitch
              emphasizes securing AI agents everywhere and agent-development ecosystems such as Microsoft Copilot Studio
              and Salesforce Agentforce. Obsidian, by contrast, should not overclaim parity on Zenity's
              build-time/developer workflow. Its more honest differentiation is runtime SaaS governance: mapping
              non-human identities, watching the third-party application context, and blocking policy violations before
              an agent action takes effect. That runtime posture is valuable precisely because agent permissions,
              connected MCP servers, and model substitutions can change after design-time review.
