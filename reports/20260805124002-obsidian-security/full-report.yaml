  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Runtime Governance Product Map
        blocks:
          - type: paragraph
            body: >-
              Obsidian Security is best understood as an SSPM company that has rebuilt its product narrative around
              runtime governance for AI agents and non-human identities inside third-party SaaS. The customer job is not
              merely to find an excessive permission after a quarterly posture scan; it is to discover which agents, MCP
              servers, integrations, service accounts, and models can touch sensitive SaaS data, then stop an unsafe
              action before it happens. That is a technically sharper value proposition because it requires inventory,
              identity context, behavioral baselines, policy evaluation, and enforcement in the transaction path. The
              same foundation also explains why legacy Salesforce, Workday, and Microsoft 365 SSPM experience matters:
              those systems are where new Copilot Studio, Agentforce, Workday, n8n, Claude Code, Cowork, and
              SaaS-to-SaaS automation risks show up in production.
