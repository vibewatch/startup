      - number: '8.2'
        title: Comparable Multiple Frame
        blocks:
          - type: paragraph
            body: >-
              The comparable frame argues for a split verdict. Windsor Drake’s 2026 cyber work puts ordinary public
              cybersecurity nearer 6-8x NTM revenue, cloud or AI-native leaders around 14-22x, private cyber around
              15.2x, and top cloud M&A as high as 35x. Public comps show dispersion rather than a single answer:
              CrowdStrike sits at about 25.1x on $4.81 billion of FY26 revenue and $5.25 billion of ARR, Zscaler at
              about 11.7x on roughly $3.17 billion of TTM revenue and about $25 billion of market capitalization, Palo
              Alto around 15x, Cloudflare around 31.5x, Fortinet around 8.7x, and Okta around 5x. Private and M&A
              references are even more volatile. Wiz supports a strategic scarcity premium at $32 billion and $1
              billion-plus ARR, while Cyera’s 80x ARR discussion despite operating losses is an adverse froth warning.
              NinjaOne shows investors will still pay up when fast growth comes with profitability. Obsidian deserves to
              be compared to the premium set only if diligence verifies high ARR and durable growth.
            claimRefs:
