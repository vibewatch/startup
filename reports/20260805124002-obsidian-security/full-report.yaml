  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Series D Price and Implied Multiple
        blocks:
          - type: paragraph
            body: >-
              Obsidian’s August 4, 2026 Series D gives the valuation chapter a clear headline and an unclear
              denominator. The numerator is well supported: the company announced an $85 million raise led by Crescent
              Cove Advisors at a $1.1 billion post-money valuation, with existing investors returning and total capital
              raised now above $200 million. The denominator is the hard part. Obsidian discloses 100+ customers
              spending at least $100,000 annually, 14+ spending at least $1 million, and 60 Fortune 500 customers, but
              it does not disclose ARR, growth, margins, retention, burn, runway, or headcount. Using the canonical
              public-floor method from the financial chapter, the disclosed spend tiers imply about $24 million of ARR,
              while the plausible underwriting range remains roughly $40-70 million. That range makes the $1.1 billion
              price highly sensitive: about 46x at the floor, 22x at $50 million, and 15.7x at $70 million. The
              valuation is therefore not nonsensical, but it is explicitly price-sensitive and evidence-sensitive.
            claimRefs:
