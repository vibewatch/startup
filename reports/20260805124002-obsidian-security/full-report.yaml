  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Included Spend
        blocks:
          - type: paragraph
            body: >-
              Obsidian should not be sized against every cybersecurity or posture-management dollar that can be labeled
              AI. The working boundary is enterprise third-party SaaS and AI-agent governance: runtime controls for
              autonomous agents, non-human identity security, SSPM, SaaS-to-SaaS integration risk, and selected
              ITDR-like identity-detection workflows. Included spend is therefore the budget used to discover agents and
              integrations, map permissions, monitor behavior, block excessive data access, and prove policy compliance
              across SaaS applications. Excluded spend is broad cloud posture management, endpoint security, generic
              data posture management, and native platform controls that never touch third-party SaaS agents. Status quo
              matters because many enterprises still use manual SaaS reviews, IdP-native controls, spreadsheet
              approvals, or the built-in settings of Microsoft, Salesforce, and other application platforms. The market
              is attractive because Obsidian can point to 144 non-human identities for every human identity and more
              than 35,000 third-party apps, but the same breadth requires discipline in not counting every adjacent SPM
              dollar as serviceable market.
