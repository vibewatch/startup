        title: Exhibits
        blocks:
          - type: callout
            title: The $1.1B valuation is stretched on the ARR floor
            body: >-
              If Obsidian ARR is close to the inferred $24M floor, the Series D implies roughly 46x ARR, a multiple that
              should be treated as frothy absent exceptional growth proof.
