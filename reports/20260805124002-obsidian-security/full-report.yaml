      - number: '2.2'
        title: TAM, SAM, and SOM Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              The most defensible top-of-funnel TAM is the 2026 AI Agent Security estimate of roughly $26 billion,
              because Obsidian is explicitly selling security and runtime governance for AI agents. That number should
              not flow directly into revenue assumptions. A narrower SAM should be anchored in NHI Security and SSPM,
              because those categories map to identities, SaaS permissions, third-party integrations, and governance
              workflows. Using NHI Security at about $8.22 billion and SSPM at about $3.69 billion, while discounting
              overlap, produces a practical 2026 SAM range of approximately $8 billion to $12 billion. The narrow
              Agentic AI Security estimate of $1.65 billion is a useful lower-bound lens for nascent agent-specific
              controls, while ITDR at $3.42 billion is an adjacency rather than a direct add-on. SOM is far smaller:
              disclosed customers imply an ARR floor of about $24 million and a plausible current ARR range of roughly
              $40 million to $70 million, so near-term obtainable market should be framed as approximately $50 million
              to $150 million until management provides ARR, NRR, segment mix, and pipeline conversion.
