        title: Roadmap, Maturity, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Product maturity looks credible but incomplete from public evidence. The January 2026 SaaS supply-chain
              security launch shows Obsidian extending from posture into integration risk. The August 2026 Series D
              announcement then tied fresh capital to R&D, Fortune 500 expansion, and native governance for Claude Code
              and Cowork. Those milestones are consistent with the market shift toward agentic SaaS workflows. However,
              the source set does not expose enough hard engineering evidence: there is no public block-rate benchmark,
              false-positive rate, model-registry schema, uptime history, connector coverage list by application, or
              detailed support SLA. Developer-signal is also weak; a vendor wiki is only a proxy, not a substitute for
              an open SDK, public changelog, or active community. Diligence should therefore test runtime efficacy,
              SaaS-connector reliability, and policy-governance operations before treating the architecture as fully
              proven. A final product diligence track should therefore test the control plane in adversarial,
              production-like scenarios: sanctioned versus unsanctioned MCP servers, a model substitution attempt, an
              agent requesting sensitive HR or sales records, a service account with stale OAuth scope, and a developer
              agent touching production data. Those tests would convert the public architecture from a plausible
              graph-and-policy thesis into measurable security evidence and would also reveal whether Obsidian's SSPM
              heritage creates enough context to avoid noisy runtime blocks. The remaining diligence should be
              evidence-led, not roadmap-led. Management should also show policy-change audit trails, exception approval
              records, and customer support escalations for blocked agent actions.
