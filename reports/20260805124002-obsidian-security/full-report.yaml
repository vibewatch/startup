companyProfile:
  summary: >-
    Obsidian Security is a Palo Alto, California-based cybersecurity company founded in 2017 that has evolved from SaaS
    security posture management (SSPM) into runtime governance and security for AI agents and non-human identities
    operating inside enterprise third-party SaaS applications such as Microsoft 365, Salesforce, and Workday. In August
    2026 it raised an $85 million Series D at a $1.1 billion post-money valuation led by Crescent Cove Advisors,
    bringing lifetime funding above $200 million. Company-reported traction includes more than 100 customers spending
    over $100,000 per year, more than 14 spending over $1 million, and 60 Fortune 500 customers, though current revenue,
    ARR, margins, retention, and headcount are not publicly disclosed.
