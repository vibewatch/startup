      - number: '7.3'
        title: Valuation, Financial, People, and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              Valuation risk is high because the $1.1 billion post-money price is attached to undisclosed ARR, gross
              margin, NRR, burn, runway, and headcount. The disclosed spend metrics are meaningful—100+ customers above
              $100,000 annually, 14+ above $1 million, and 60 Fortune 500 customers—but they only establish a floor.
              Using the canonical fact-sheet method, ARR is at least about $24 million and plausibly $40 million to $70
              million, which puts the valuation in a wide estimated 15x to 45x revenue band. That band can be acceptable
              for a category leader with durable expansion, but public sources do not prove renewal quality or revenue
              concentration. Execution risk is therefore central. Obsidian has strong founder and technical credentials
              and a non-founder CEO with Shape Security go-to-market experience, yet it must manage a category pivot,
              enterprise platform partnerships, advanced threat research, and intense competition simultaneously. The
              right investment posture is not to dismiss the company; it is to make price, disclosure, and
              proof-of-blocking gates explicit. If private diligence cannot connect product-specific expansion to the
              latest disclosed customer thresholds, investors should treat the Series D as strategic validation rather
              than full proof of durable economics.
