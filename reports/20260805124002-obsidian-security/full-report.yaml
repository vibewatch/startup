              - CV033
              - CV042
      - number: '8.4'
        title: Exit Readiness and Final Diligence
        blocks:
          - type: paragraph
            body: >-
              Exit optionality is real but not yet enough to erase valuation risk. Cybersecurity M&A activity,
              Google/Wiz, and Palo Alto/CyberArk all support strategic appetite for scarce security control planes, and
              Obsidian’s move into AI-agent governance gives it a plausible strategic narrative. However, a $1.1 billion
              entry price requires diligence evidence that public sources do not provide. The buyer or investor needs
              audited ARR, an ARR bridge from customer tiers, gross margin, burn, NRR, GRR, cohort retention, customer
              concentration, headcount, and clear cap-table terms. The most important kill triggers are ARR below about
              $40 million, evidence that the $24 million floor is close to reality, concentration inside the 14
              million-dollar accounts, platform-vendor budget capture, or broad cyber multiple compression. If
              management proves high ARR and clean preferences, the valuation can be defended as a growth-premium cyber
              round. If not, the Series D looks stretched on estimated ARR and should be approached only with price
              protection.
            claimRefs:
              - CV021
              - CV037
              - CV038
              - CV039
              - CV040
              - CV041
              - CV042
              - CV043
