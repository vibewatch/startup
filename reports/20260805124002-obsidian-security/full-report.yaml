        title: Standards, Trust, and Risk Controls
        blocks:
          - type: paragraph
            body: >-
              The strongest external validation for the product thesis comes from standards bodies rather than
              independent product benchmarks. OWASP and CSA describe an MCP threat model dominated by prompt injection,
              tool poisoning, least-privilege failures, OAuth and authorization mistakes, and unsafe server or tool
              design. Obsidian's public claims map well to that control language because inventory, model registry, and
              pre-action policy enforcement are exactly the primitives that a runtime guardrail needs. The adverse read
              is equally important: PipeLab's 2026 MCP-security assessment describes thousands of MCP CVEs, which means
              Obsidian is building into an immature and volatile protocol ecosystem. The opportunity is large, but so is
              the product-efficacy burden; security buyers will need proof that controls work against advanced agent
              attacks, not only marketing claims about governance coverage.
