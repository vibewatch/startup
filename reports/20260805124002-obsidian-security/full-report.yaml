        title: Disclosure Baseline and Capital Capacity
        blocks:
          - type: paragraph
            body: >-
              Obsidian’s financial record is unusually strong on financing and customer-spend thresholds, but thin on
              operating statements. The company and several independent outlets converge on the same current anchor: an
              $85 million Series D announced August 4, 2026, a $1.1 billion valuation, Crescent Cove as lead, and
              participation by the existing syndicate. The same evidence says lifetime capital raised now exceeds $200
              million across five rounds, while historical sources identify the Series C, Series B-1, and earliest
              Series A backers. That is enough to build a local financing chronology and a capital-adequacy view, but
              not enough to model cash. Cash on hand before the round, monthly burn, runway months, debt, and
              project-finance obligations are not publicly disclosed. The right interpretation is therefore
              capacity-with-unknown-consumption: the new round clearly extends strategic options, yet no public source
              can verify how many months it buys or which operating milestones would trigger another financing.
