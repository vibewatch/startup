    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Category Positioning
        blocks:
          - type: paragraph
            body: >-
              Obsidian Security is best anchored as a Palo Alto, California-based private cybersecurity company founded
              in 2017 and currently positioned around runtime governance for AI agents and non-human identities inside
              enterprise third-party SaaS applications. The Palo Alto headquarters should be treated as the current
              canonical field because the freshest August 2026 financing coverage repeatedly uses California/Palo Alto
              framing; legacy profile surfaces that imply Newport Beach are not ignored, but they are weaker and stale
              enough to become an explicit evidence gap rather than the primary identity. The business model has also
              moved beyond its earlier SSPM narrative. Current official and independent coverage presents Obsidian as
              helping security teams inventory AI agents, MCP servers, models, non-human identities, and policy
              violations before actions take effect. That makes the company a late-stage AI-agent governance vendor, not
              merely an older SaaS posture-management tool.
