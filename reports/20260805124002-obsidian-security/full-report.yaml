      - number: '3.3'
        title: Pricing, Packaging, Distribution, and Switching Friction
        blocks:
          - type: paragraph
            body: >-
              Public pricing is the weakest evidence surface in this chapter. The retained competitor sources show
              product packaging and positioning, but not standardized list prices, realized ASPs, discounting, renewal
              rates, or win/loss data. For underwriting, that means competitive pricing power has to be inferred from
              packaging breadth, procurement trust, and operational lock-in rather than observed quotes. Obsidian's
              public proof points are stronger than many younger peers: more than 100 customers spending at least
              $100,000 annually, more than 14 customers spending at least $1 million annually, and 60 Fortune 500
              customers. Those disclosures suggest the product can reach enterprise ACVs and procurement trust. Still,
              switching friction is not absolute. Buyers can multi-home: deploy Obsidian for runtime SaaS governance,
