  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - What would strengthen it
      - What would change the view
    rows:
      - - Thesis
        - AI-agent and NHI security is a large, urgent control-plane problem, and Obsidian shows Fortune 500 traction.
        - Audited ARR above $50M, strong NRR/GRR, and proof that agent-governance revenue is growing quickly.
        - Weak retention, slow budget conversion, or platform-native controls absorbing the market.
      - - Thesis
        - The Series D syndicate and existing-investor participation reduce financing-quality concern.
        - Clean preference stack and insider pro rata behavior that confirms conviction rather than rescue financing.
        - Heavy preferences, structured terms, or investor fatigue in follow-on rounds.
      - - Anti-thesis
        - The $1.1B price may be ahead of public financial proof.
        - Company-provided ARR bridge from disclosed customer spend to contracted recurring revenue.
        - Audited ARR below $40M or evidence that the $24M floor is close to reality.
      - - Anti-thesis
        - Zenity and platform vendors weaken scarcity premium in a nascent category.
        - Clear win/loss proof against Zenity and Microsoft-native controls.
        - Large enterprise budgets standardize on platform controls rather than independent vendors.
    notes: >-
      The table separates company-quality arguments from price-support arguments because the valuation call is
      explicitly price-sensitive.
