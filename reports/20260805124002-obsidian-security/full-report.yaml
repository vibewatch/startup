  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Probability signal
    rows:
      - - Bull
        - ARR near $70M+, growth remains premium, agent-governance revenue scales, and cyber premium comps stay open.
        - About $1.3B-$1.8B support at roughly 19-25x ARR; the $1.1B entry could work.
        - Requires private proof not yet public.
      - - Base
        - >-
          ARR around $40M-$50M, strong logos but incomplete margin/retention proof, and investors apply opacity
          discount.
        - About $0.6B-$1.1B support at roughly 15-22x ARR; current price is top-of-range.
        - Most supportable on public evidence.
      - - Bear
        - ARR close to the $24M floor, category adoption slows, or comps compress toward 8-13x.
        - About $0.2B-$0.5B support; downside from $1.1B is material.
        - Cannot be dismissed because ARR is not disclosed.
      - - Froth case
        - Private cyber financing keeps clearing at exceptional multiples despite losses.
        - Cyera-like 80x ARR data could temporarily validate high marks but increases correction risk.
        - Adverse signal, not a base underwriting case.
    notes: >-
      Ranges are simple ARR-times-multiple scenarios in USD enterprise-value billions; they are not management guidance
      or a DCF.
