            body: >-
              The valuation risk is a function of the ARR denominator. At the approximately $24 million disclosed-spend
              floor, the $1.1 billion valuation implies roughly 46 times ARR. At the $50 million base estimate, it
              implies about 22 times. At the $70 million high estimate, it falls to roughly 16 times, near the
              private-cyber benchmark range cited by Finro and SaaS Mag. The adverse read is that Finro’s private median
              around 15.4 times ARR and down-round compression range of roughly 10 to 13 times imply Obsidian’s true ARR
              must be very high, or revenue quality must be unusually strong, to justify the mark. Competitive funding
              from Zenity reinforces the need to invest aggressively, while broader cyber funding data show a supportive
              but selective market. The verdict is track, not underwrite blindly: Obsidian has better public traction
              than most private companies, but retention, margin, burn, and concentration evidence must arrive before
              the valuation can be treated as fair. This sensitivity should be refreshed immediately if management
              provides ARR, NRR, cash, or cohort data.
