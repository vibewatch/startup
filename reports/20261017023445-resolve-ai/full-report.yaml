              - CO014
              - CO015
      - number: '1.4'
        title: Scale signals, milestone cadence, and unresolved diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The available evidence shows fast external momentum but still incomplete operating disclosure. Official
              2026 materials name enterprise customers including Coinbase, DoorDash, MongoDB, MSCI, Salesforce, and
              Zscaler, while Tracxn reports 168 employees “as of Aug 26” without stating the year or methodology in the
              fetched text. These are meaningful but differently qualified early-scale indicators for a company formed
              in 2024. The same extension announcement added Resolve AI Labs, tying new capital to longer-horizon model
              and evaluation work instead of only go-to-market expansion. Even so, the assigned public evidence does not
              disclose ARR, revenue growth, gross margin, burn, net retention, precise customer count, or financing
              preference-stack detail. Those omissions matter because the current valuation step-up is easier to
              understand narratively than to underwrite quantitatively from public evidence alone.
            claimRefs:
              - CO010
              - CO011
              - CO013
              - CO016
