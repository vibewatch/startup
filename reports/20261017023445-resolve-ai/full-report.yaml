  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adjacent categories
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence set consistently defines Resolve AI's market around operating software after
              deployment rather than around software creation. Across the homepage, the glossary, the February financing
              release, and independent profiles, the repeated workflow is alert triage, incident investigation,
              root-cause analysis, and remediation inside live production systems. That framing matters because it
              narrows the relevant spend pool to production operations budgets that already exist inside platform
              engineering, SRE, incident response, and observability-led workflows, instead of treating the company as a
              general AI assistant. The adjacent categories are coding assistants and standalone observability products:
              both are relevant substitutes for pieces of the workflow, but the sources repeatedly describe them as
              pre-deployment or data-presentation layers rather than as autonomous operators in production. That
              boundary definition is strong enough to support category logic, but the pool does not include an
              independent analyst taxonomy that proves buyers already budget this as a stable standalone software line
              item.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM010
      - number: '2.2'
        title: Evidence-constrained sizing and buyer segmentation
        blocks:
          - type: paragraph
            body: >-
              The pool supports a problem-budget lens more than a software-market-size lens. The glossary cites Oxford
              Economics for more than $400 billion in annual downtime cost across the Global 2000, while company-linked
              materials repeatedly frame the category as reducing investigation time, MTTR, and operator toil in complex
              enterprise environments. Those signals support a large economic problem, and private-market financing
              shows investors underwriting the category narrative, but neither is a substitute for a defensible TAM,
              SAM, or SOM. The same limitation applies to the customer-outcome evidence: a 72% investigation-time
              reduction, an 87% faster incident-resolution claim, and a 30% reduction in engineers required per incident
              are meaningful proof points, yet they are customer-specific and not normalized to a common population or
              buying denominator. The most supportable segmentation therefore starts with large enterprises that operate
              multi-service, business-critical software and already spend against reliability, platform, and on-call
              performance objectives, with value selling first to engineering leadership rather than to a broad
              developer seat model.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM011
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM007
              - CM008
              - CM011
              - CM012
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM007
              - CM008
              - CM013
      - number: '2.3'
        title: Adoption drivers, budget ownership, and constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption driver in the assigned sources is operational complexity, not abstract enthusiasm
              for AI. The February announcement describes cloud sprawl, frequent code changes, and tribal workflows as
              structural reasons that incidents are hard to investigate, while the glossary adds that AI coding agents
              accelerate the burden by shipping more code into production faster. That logic points to a buyer path
              where VP Engineering, platform, SRE, and trust or infrastructure leaders justify the product through
              reliability outcomes and recovered engineering time. The same sources also show why adoption may be slower
              than the headline customer logos imply: production environments require high accuracy, governance, and
              human approval for higher-autonomy actions, and the pool does not contain an independent benchmark that
              validates category-wide root-cause accuracy or safe autonomous remediation. As a result, Resolve AI looks
              easier to underwrite as a large-enterprise productivity and reliability wedge than as a fully proven
              autonomous-operations platform with portable, independently measured ROI.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM009
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM009
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Budget ownership is reliability-led, not seat-led
            body: >-
              The supportable buyer path runs through engineering leaders who already own uptime, on-call, and platform
              budgets, not through a broad per-developer productivity purchase.
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM006
          - type: callout
            title: The market story outruns the measurement story
            body: >-
              The source pool supports urgency and customer-specific outcomes, but it does not support an independent
              TAM/SAM/SOM or a portable benchmark for safe autonomous remediation.
            calloutType: risk
            claimRefs:
              - CM007
              - CM008
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set spans direct agents, incumbents, and substitutes
        blocks:
          - type: paragraph
            body: >-
              The retained public pool does not show a single clean head-to-head market. Instead, Resolve is pulled into
              four overlapping buying sets: direct AI SRE agents such as Cleric and Traversal; observability-native
              helpers such as Datadog Bits AI; workflow-first incident platforms such as incident.io, Rootly, and
              PagerDuty; and self-hosted/Kubernetes-oriented substitutes such as NudgeBee and Metoro. Tracxn's ranked
              competitor list also brings BigPanda into view, which reinforces that buyers can treat the job either as
              autonomous investigation, as incident-workflow software, or as alert-correlation/AIOps. The status quo
              substitute is still a manual or rule-based stack rather than another agent: incident.io explicitly
              separates chatbots and rule-based automation from agentic investigation, which means Resolve is often
              competing against "keep the current on-call stack and add incremental automation" rather than only against
              a pure-play peer.
            claimRefs:
              - CP004
              - CP007
              - CP009
              - CP010
              - CP014
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP007
              - CP010
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.2'
        title: Resolve differentiates on autonomy, but that also defines the trust hurdle
        blocks:
          - type: paragraph
            body: >-
              Resolve's own materials repeatedly push the company toward the aggressive end of the category. The
              homepage says the product "goes on-call" and autonomously resolves incidents, while the glossary describes
              an AI SRE as an autonomous agent that detects, investigates, and resolves production incidents and says
              autonomy should expand as trust is earned. Wetheflywheel's comparison reaches the same conclusion from the
              outside, calling Resolve one of the few tools that treats supervised production write actions as a core
              product posture rather than a distant roadmap item. That gives Resolve a differentiated wedge against
              workflow-centric alternatives, but it also means its main competitive risk is not feature parity; it is
              buyer willingness to let an agent act in production. The company is trying to reinforce that edge with
              enterprise proof points, 5x-faster-MTTR marketing, and the AI Labs roadmap focused on domain-specific
              models, evaluation, and governance.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP011
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP006
              - CP007
              - CP011
              - CP012
              - CP013
      - number: '3.3'
        title: Incumbent distribution, deployment control, and public pricing are the main counterweights
        blocks:
          - type: paragraph
            body: >-
              The strongest reasons to buy something other than Resolve in the retained pool are operational, not
              ideological. incident.io says buyers pressure-test integration depth, full lifecycle coverage, and pricing
              transparency before committing to a category-new AI SRE. Sherlocks and NudgeBee push a different objection
              set: private deployment, read-only or approval-gated action models, and easier fit with security-conscious
              or data-residency-sensitive environments. Datadog Bits AI and PagerDuty take still another angle, because
              they let a buyer keep an existing telemetry or on-call system of record rather than adding a standalone
              agent. In practice, that means Resolve's autonomy premium has to outweigh both the switching friction of a
              new tool and the procurement comfort of a bundle, especially because multiple comparison pages highlight
              that public pricing remains less transparent than at several alternatives.
            claimRefs:
              - CP008
              - CP011
              - CP012
              - CP013
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP012
              - CP013
      - number: '3.4'
        title: Durability depends on model accuracy and enterprise proof, but the public benchmark set is weak
        blocks:
          - type: paragraph
            body: >-
              The best public evidence for Resolve's moat today is still narrative rather than independently benchmarked
              performance. Company-issued material says the product is running in production at large enterprises and
              that the new AI Labs effort is aimed at model, evaluation, and governance depth, which is strategically
              sensible if the category gets commoditized at the interface layer. But most retained competitive
              comparisons are vendor-authored, self-interested, or both, and they rarely use a common benchmark for RCA
              accuracy, rollback quality, false positives, or safe autonomous action. That leaves two competing
              interpretations alive at once: Resolve may be ahead because it is willing to own supervised action earlier
              than peers, or procurement may compress the category toward lower-risk workflow, incumbent, or self-hosted
              options until independent evidence proves the autonomy advantage.
            claimRefs:
              - CP003
              - CP005
              - CP008
              - CP011
              - CP012
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Autonomy is the main wedge
            body: >-
              The retained pool repeatedly sorts vendors by whether they investigate only, guide humans, or take
              supervised action in production. Resolve's strongest public differentiation is that it embraces the last
              category earlier and more explicitly than most peers.
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
          - type: callout
            title: Control-oriented buyers have credible off-ramps
            body: >-
              Resolve does not need a perfect feature clone to lose a deal. Datadog and PagerDuty can win on
              incumbent-stack leverage, incident.io can win on workflow ownership, and self-hosted alternatives can win
              on data residency and action control before the buyer ever benchmarks autonomous remediation depth.
            calloutType: risk
            claimRefs:
              - CP008
              - CP011
              - CP012
              - CP013
              - CP014
          - type: callout
            title: Ask for benchmark and commercial proof, not just the autonomy pitch
            body: >-
              Before underwriting an autonomy premium, diligence should request independently reviewable RCA and
              remediation benchmarks, confirmed deployment options, and realized commercial terms. The retained public
              set is strong on positioning language and weak on comparable proof.
            calloutType: recommendation
            claimRefs:
              - CP003
              - CP005
              - CP008
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization evidence
        blocks:
          - type: paragraph
            body: >-
              The public record supports a software-subscription business aimed at large enterprise operations teams,
              but it is still a thin record rather than a full underwriting pack. Resolve AI's own site frames the
              product as an AI SRE platform that goes on-call, operates production tools, and improves reliability
              outcomes, while NeuronFeed lists pricing only as enterprise-with-free-trial rather than with public list
              rates or seat bands. That combination points to a high-touch land motion, likely via pilot or
              proof-of-value, followed by enterprise contract expansion if the platform reduces incident toil in
              production. Public sources do not show a price card, standard contract duration, or whether revenue is
              recognized per workload, per environment, or per platform-wide subscription.

              The strongest monetization signal is not list pricing but reported deal size and buyer quality.
              EntrepreneurLoop says Resolve is already winning high six- and seven-figure ACVs, and the company
              repeatedly cites Coinbase, DoorDash, MongoDB, MSCI, Salesforce, and Zscaler as production customers. That
              pattern is consistent with a category where value-based selling matters more than transparent packaging:
              buyers are paying to compress investigation time, reduce engineer involvement per incident, and absorb
              operational complexity. The result is a credible subscription revenue story, but not yet a disclosable
              price architecture or a corroborated view of realized net pricing.
            claimRefs:
              - CI001
              - CI002
              - CI008
              - CI009
              - CI015
          - type: table
            tableRef: TI001
            claimRefs:
              - CI002
              - CI008
