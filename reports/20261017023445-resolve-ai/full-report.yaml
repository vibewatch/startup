      - number: '7.2'
        title: Compliance posture is directionally positive but publicly under-evidenced
        blocks:
          - type: paragraph
            body: >-
              Resolve's own documentation says it does not train on customer data and that its controls support SOC 2,
              GDPR, and HIPAA requirements, which is the right directional signal for a platform that touches code,
              telemetry, and incident workflows. However, the assigned public evidence stops at high-level assertions
              and marketing language about operating in regulated environments; it does not include current certificate
              dates, DPA terms, approval boundaries, or action-logging detail for autonomous remediation. At the same
              time, the company's April 2026 release explicitly acknowledges that production operations require a very
              high bar for accuracy, reliability, and control. That combination makes governance diligence a live risk,
              not a box already closed by public artifacts.
            claimRefs:
              - CR004
              - CR005
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR008
      - number: '7.3'
        title: Operational delivery depends on integrations, model supply, and reference quality
        blocks:
          - type: paragraph
            body: >-
              Resolve's upside also defines its dependency stack. The company says useful performance requires broad
              connectivity across code, infrastructure, telemetry, runbooks, wikis, and chats, so incident quality will
              vary with customer integration depth and telemetry hygiene. The homepage also says Resolve combines its
              own domain models with frontier models, implying some ongoing exposure to external model-vendor economics
              or availability even as the company invests in proprietary systems. Finally, the public proof pack keeps
              returning to a short list of marquee enterprises and close enterprise collaboration, which is positive for
              credibility but also means reference concentration and roadmap pressure can remain high if a few flagship
              accounts shape perception of product maturity.
            claimRefs:
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR012
              - CR013
      - number: '7.4'
        title: Financial downside is hard to size from public data alone
        blocks:
          - type: paragraph
            body: >-
              The financing record shows fast markups, not operating transparency. Forge lists a $1.5B post-money
              valuation and roughly $199.93M total funding after the April 2026 Series A-2, while VCTavern described an
              earlier 2026 Series A at $1B and more than $150M total capital. That trajectory suggests strong investor
              demand, but it also means downside underwriting is constrained because the assigned pool does not provide
              current ARR, burn, gross margin, or customer-concentration disclosure. The practical kill criteria are
              therefore measurable: if an independent pilot cannot replicate materially faster RCA with low false
              positives, if security review cannot produce current audit artifacts and action-control logs, or if the
              next financing or internal data packet implies weak revenue efficiency against the 2026 mark, the
              investment case should weaken quickly.
            claimRefs:
              - CR006
              - CR009
              - CR010
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Benchmark credibility is the gating risk
            body: >-
              Resolve's public story is strongest on ambition and customer anecdotes, but the assigned pool still leaves
              the headline accuracy and MTTR claims mostly un-audited by neutral third parties.
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
          - type: callout
            title: Compliance proof is thinner than enterprise positioning
            body: >-
              Public materials point in the right direction on data handling and regulated-enterprise posture, but they
              do not yet replace a real diligence packet with current reports, certificates, and action-control
              evidence.
            calloutType: risk
            claimRefs:
              - CR004
              - CR008
          - type: callout
            title: Kill criteria should stay measurable
            body: >-
              Ask for independent incident-benchmark data, current security artifacts, and operating metrics that
              justify the 2026 valuation step-up; if any of those three packets is weak, the thesis should downgrade
              quickly.
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR008
              - CR009
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing evidence is clear; price support is not
        blocks:
          - type: paragraph
            body: >-
              Resolve AI announced a $125 million non-blended Series A at a $1.0 billion valuation in February 2026 and
              a $40 million extension at a $1.5 billion valuation in April. Forge independently displays the later
              post-money mark and reports $199.93 million of total funding, broadly corroborating the scale of capital
              raised. The disclosed marks therefore increased 50% within one financing sequence, while the extension
              added only $40 million of primary capital. That acceleration is a price signal, not evidence of equivalent
              operating-value creation. Public financial references are also internally unreliable: Business 2.0 reports
              approximately $4 million of ARR for December 2025, whereas Multiples.vc lists $360 million of "Revenue"
              for April 2026 while noting its field may mean run-rate revenue or LTM revenue. Revenue is not ARR, the
              periods differ, and neither figure is company-audited disclosure, so neither supports a defensible revenue
              multiple.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV016
      - number: '8.2'
        title: Enterprise proof offsets, but does not remove, underwriting risk
        blocks:
          - type: paragraph
            body: >-
              The strongest thesis evidence is operational rather than financial. Resolve AI names Coinbase, DoorDash,
              MongoDB, MSCI, Salesforce, and Zscaler as users, and reports a 72% reduction in Coinbase's
              critical-incident investigation time and a 30% reduction in engineers required per Zscaler incident. These
              are meaningful adoption signals, but they remain company-issued claims rather than an independently
              measured cohort. The anti-thesis is that the current mark embeds category leadership before public
              evidence establishes recurring revenue, retention, gross margin, burn, customer concentration, or
              repeatable unit economics. The official material also says production agents need environment-specific
              reasoning and that Resolve AI Labs must build domain models, evaluation systems, governance, and
              guardrails. That program can deepen the moat, but it also identifies technical work that must succeed
              before increasingly autonomous production operation is safely scalable.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV016
      - number: '8.3'
        title: Scenario discipline requires milestones, not false precision
        blocks:
          - type: paragraph
            body: >-
              Public comparables do not justify a point estimate. Multiples.vc lists PagerDuty at 2.5x LTM EV/revenue
              and Beijing Ultrapower at 1.9x, but Resolve AI lacks a verified denominator and differs materially in
              stage, growth profile, product scope, and liquidity. Applying those multiples would create precision
              unsupported by the evidence. A bull case requires independently verified expansion, durable margins, and
              safe autonomous remediation; a base case assumes enterprise adoption continues but financial visibility
              remains incomplete; a bear case combines slower conversion, technical-control limits, and private-market
              multiple compression. The $1.0 billion prior financing mark is a historical transaction reference, not a
              downside floor, while the $1.5 billion mark is an entry constraint, not an independently observed
              secondary clearing price.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.4'
        title: Recommendation and decision gates
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more, with medium confidence, high risk, and a stretched valuation stance.
              Resolve AI has financing capacity, recognizable enterprise references, and a plausible path to category
              leadership, but the public record cannot support target returns, a hold period, or an exit value without
              inventing revenue and margin assumptions. Investment consideration should be conditional on a management
              data room that reconciles ARR and recognized revenue, supplies quarterly growth, gross margin, net
              retention, burn and runway, and provides customer-level concentration and renewal cohorts. Counsel should
              verify the full preference stack, dilution, participation rights, governance, and option-pool impact
              rather than relying on Forge's displayed 1.0x multiplier alone. The thesis breaks if independent customer
              validation fails, net expansion stalls, remediation safety cannot be demonstrated, or a financing requires
              price protection inconsistent with the announced headline mark.
            claimRefs:
              - CV002
              - CV003
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV010
              - CV013
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Investment posture
            body: >-
              Research more; do not convert the $1.5B announced mark into a buy decision without verified economics,
              terms, and independent customer evidence.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV016
          - type: callout
            title: Headline valuation is not an exit price
            body: >-
              Forge reports limited market activity and no available Forge Price, so the post-money financing mark
              should not be treated as a liquid secondary-market clearing value.
            calloutType: risk
            claimRefs:
              - CV003
