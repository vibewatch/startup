          - type: callout
            title: Headline valuation progression outruns public financial disclosure
            body: >-
              Public sources support rapid valuation step-ups from seed to $1.5B, but they still do not disclose
              revenue, margin, burn, exact customer count, or full financing-governance terms, leaving underwriting
              reliant on narrative momentum more than public unit economics.
