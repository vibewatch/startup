  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Resolve's customer motion appears to start with incident pain, broaden into daily operations, and then hit
      procurement and governance scrutiny.
    data:
      nodes:
        - label: Enterprise incident pain
          actor: Buyer
          stage: Problem recognition
          touchpoints:
            - High-cost incidents, alert overload, and long RCA cycles
            - Interest in reducing MTTR and war-room staffing
          note: Official pages consistently frame the value proposition around production operations and reliability.
        - label: Production pilot
          actor: Buyer + user
          stage: Evaluation
          touchpoints:
            - Evaluate real-incident performance rather than demo-only workflows
            - Check integrations, governance, and human-in-the-loop controls
          note: Resolve's own evaluation guidance stresses wartime and peacetime proof before broader rollout.
        - label: Named production deployment
          actor: User
          stage: Initial adoption
          touchpoints:
            - Incident investigation across code, infra, and telemetry
            - DoorDash, Coinbase, Salesforce, and Zscaler appear in production-oriented proof
          note: Public evidence is strongest once the product is tied to live production workflows rather than a logo wall.
        - label: Daily operations expansion
          actor: User
          stage: Expansion
          touchpoints:
            - On-call readiness, debugging, operational reports, and onboarding
            - Institutional knowledge capture raises switching costs
          note: >-
            Official material repeatedly describes usage outside active incidents, which is the clearest land-and-expand
            signal.
        - label: ROI and trust proof
          actor: Buyer
          stage: Internal validation
          touchpoints:
            - 5x faster MTTR, 72% faster investigation, 87% faster resolution, 30% fewer engineers per incident
            - Named outcomes help justify broader deployment if they are reproducible
          note: The ROI narrative is compelling, but methodology and customer-level baselines are mostly undisclosed.
        - label: Procurement and governance friction
          actor: Buyer / security / finance
          stage: Expansion constraint
          touchpoints:
            - Pricing requires a demo
            - Some buyers may want self-hosting or tighter approval controls
          note: >-
            The main adverse signal in the assigned pool is around procurement, deployment model, and transparency
            rather than customer dissatisfaction.
    claimRefs:
      - CU005
      - CU006
      - CU008
      - CU012
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual exposure clusters around benchmark credibility, governance, and financing opacity more than around a
      single disclosed legal event.
    data:
      columns:
        - label: Likelihood
          detail: Probability of the risk surfacing in the next 12 months based on retained public evidence.
        - label: Impact
          detail: Potential damage to uptime, customer trust, or investability if the risk manifests.
        - label: Mitigation maturity
          detail: How concrete today's public mitigation evidence is.
        - label: Residual severity
          detail: Post-mitigation judgment after considering cited mitigations and gaps.
      rows:
        - label: Accuracy / benchmark risk
          note: Independent validation is thinner than company performance marketing.
          values:
            - label: Medium
              note: Pilots will test this quickly.
            - label: High
              note: Bad RCA or bad actions can deepen incidents.
            - label: Medium
              note: AI Labs and multi-agent design are directionally helpful.
            - label: High
              note: This remains the top residual risk.
        - label: Security / compliance proof risk
          note: Public control statements exist, but artifact depth is limited.
          values:
            - label: Medium
              note: Likely to surface in enterprise diligence.
            - label: High
              note: Can block regulated deployments.
            - label: Low
              note: The retained pool lacks certificate-level evidence.
            - label: High
              note: Still unresolved without audit artifacts.
        - label: Integration / tooling dependency risk
          note: Resolve's value depends on broad, clean production context.
          values:
            - label: High
              note: Integration depth is core to product value.
            - label: Medium
              note: Failures usually degrade quality more than legality.
            - label: Medium
              note: The company explains the dependency but not a universal fix.
            - label: Medium
              note: Manageable, but highly environment-specific.
        - label: Valuation / financing opacity risk
          note: Public operating disclosure lags the 2026 valuation step-up.
          values:
            - label: Medium
              note: Shows up when sizing downside or next-round risk.
            - label: High
              note: Weak unit economics would matter at the current mark.
            - label: Low
              note: Fresh capital helps, but does not solve transparency.
            - label: High
              note: A premium mark without public unit metrics stays risky.
        - label: Reference-customer concentration risk
          note: Public proof leans on a relatively short list of marquee enterprises.
          values:
            - label: Medium
              note: Shows up when a few flagship deployments carry most of the proof burden.
            - label: Medium
              note: A lost reference hurts sales momentum more than product legality.
            - label: Medium
              note: Breadth across several logos helps, but does not eliminate concentration.
            - label: Medium
              note: Manageable, but still material for perception and roadmap pressure.
        - label: Regulated-buyer diligence gap
          note: Marketing reaches regulated buyers faster than the public artifact set does.
          values:
            - label: Medium
              note: Likely to surface in enterprise procurement.
            - label: Medium
              note: Usually blocks sales or expansion rather than causing outages.
            - label: Low
              note: The retained pool lacks certificate-level mitigation evidence.
            - label: Medium
              note: Residual risk stays open until buyer-side packets are reviewed.
    approximationNotes: Heatmap cells are analyst judgments synthesized from cited sources, not source-published scores or probabilities.
    claimRefs:
      - CR005
      - CR006
      - CR007
      - CR008
      - CR009
      - CR011
      - CR012
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The decision moves from strong financing and enterprise signals through unresolved economics and execution risk to
      a research-more gate.
    data:
      nodes:
        - id: financing
          label: Financing signal
          value: $1.5B announced post-money mark
          note: Corroborated by company release and Forge.
        - id: adoption
          label: Enterprise proof
          value: Named customers and reported incident outcomes
          note: Company-issued rather than independently benchmarked.
        - id: economics
          label: Economic proof
          value: Not publicly underwritable
          note: Revenue references conflict and lack a consistent metric basis.
        - id: execution
          label: Technical execution
          value: Domain models, evaluation, and guardrails still being expanded
          note: Resolve AI Labs is intended to address these requirements.
        - id: price
          label: Entry discipline
          value: No defensible public-data price range
          note: Use verified milestones and full financing terms.
        - id: decision
          label: Recommendation
          value: Research more
          note: Medium confidence, high risk, stretched valuation.
      edges:
        - from: financing
          to: adoption
        - from: adoption
          to: economics
        - from: economics
          to: execution
        - from: execution
          to: price
        - from: price
          to: decision
    approximationNotes: The flow is a decision sequence, not a quantitative scoring or conversion model.
    claimRefs:
      - CV003
      - CV010
      - CV013
      - CV016
