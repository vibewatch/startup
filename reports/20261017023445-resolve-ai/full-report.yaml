      - number: '5.2'
        title: Documented operating architecture
        blocks:
          - type: paragraph
            body: >-
              The publicly documented architecture has five visible layers. At the edge, engineers can interact through
              the web app, Slack or Teams, or via the REST API and MCP server. Behind those surfaces, Resolve runs
              investigations that keep an evidence trail, develop and rule out theories, and produce a report with
              citations. The May 2026 release and VentureBeat coverage both describe a coordinated team of specialized
              agents that investigates multiple hypotheses in parallel and independently verifies conclusions, while the
              docs show the system reaching into logs, dashboards, deployments, and pull requests. Resolve AI Labs is
              the upstream research layer, focused on domain-specific models, long-horizon agents, and evaluation or
              verification systems tuned to production operations.
            claimRefs:
