          enterprise collaboration
        - A failed flagship deployment or reference loss weakens sales credibility disproportionately
        - High
        - Breadth across several named enterprises reduces single-logo dependence somewhat
        - >-
          Reference concentration still matters because proof quality is concentrated in a small set of sophisticated
          buyers
      - - Capital-market support for a premium valuation
        - DST Global, Salesforce Ventures, and prior backers
        - Funds growth, GTM expansion, and long-term research
        - Public funding narratives climbed from a $1B Series A framing to a $1.5B post-money mark within months
        - If growth or efficiency data do not support the mark, the next financing could reset sentiment or terms
        - High
        - Strong backer set and fresh capital reduce near-term financing stress
        - Valuation risk remains material because public operating metrics are still sparse
