chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product posture
        blocks:
          - type: paragraph
            body: >-
              Resolve AI presents itself as an AI platform for running software in production rather than a generic
              coding copilot. The company homepage says it “goes on-call on your behalf and autonomously resolves
              incidents,” while the February 2026 financing announcement describes a multi-agent system that works
              across code, infrastructure, and telemetry to triage alerts, investigate incidents, and help engineers act
              in production. Third-party profiles broadly match that positioning by describing a platform that
              participates in on-call rotations, investigates incidents, and generates operational outputs such as
              scripts or pull requests. The identity evidence is therefore directionally consistent: Resolve AI is
              selling autonomous or semi-autonomous production-operations software for enterprise engineering teams, not
              a broad horizontal enterprise-AI workflow tool.
            claimRefs:
              - CO001
              - CO002
              - CO003
