              - CI015
      - number: '4.2'
        title: Public traction is real; unit economics are still mostly private
        blocks:
          - type: paragraph
            body: >-
              Resolve's commercial proof is stronger on customer outcomes than on conventional SaaS metrics. The company
              claims 5x faster MTTR and lower cost per task on its homepage, and its glossary page plus independent
              coverage point to customer anecdotes including a 72% reduction in time to investigate critical incidents
              at Coinbase and a 30% reduction in engineers required per incident at Zscaler or another enterprise
              security deployment. Those are meaningful value signals because they map directly to labor cost, outage
              duration, and operational risk. They also help explain why independent coverage describes the product as
              already landing sizeable enterprise ACVs.

              The problem is that public outcome anecdotes are not the same thing as disclosed unit economics. Multiples
              and EntrepreneurLoop both cite ARR of about $4 million around the Series A, which implies the business is
              still early relative to its valuation. No reviewed source discloses gross margin, hosting or inference
              costs, services intensity, CAC, sales cycle, payback, NRR, or concentration. Public evidence therefore
              supports demand and buyer willingness to pay, but not revenue quality or margin durability in the form an
              investor would normally use to underwrite a $1 billion-plus company.
            claimRefs:
              - CI003
              - CI004
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI010
              - CI011
              - CI012
              - CI014
      - number: '4.3'
        title: Capital access is strong, but capital adequacy is still opaque
        blocks:
          - type: paragraph
            body: >-
              Resolve's financing history shows exceptional access to capital. The company announced a $40 million
              Series A extension at a $1.5 billion valuation in April 2026, and market-data trackers cluster cumulative
              funding around more than $190 million to roughly $200 million after the extension. Those sources also show
              the extension following a roughly $125 million Series A at a $1 billion valuation, so valuation stepped up
              materially within a short period. That trajectory indicates strong investor appetite and likely meaningful
              conviction in customer adoption, but it does not prove the company is already self-funding or even close
              to break-even.

              Public disclosures suggest the new capital is being used to expand the platform, grow go-to-market
              capacity, and fund Resolve AI Labs rather than to harvest cash flow from a mature software base. Tracxn
              lists 168 employees as of late August, and both the product narrative and Labs launch imply meaningful
              spend on model development, integrations, and governance. That is consistent with a company buying time
              and strategic position, not with a company disclosing enough to underwrite burn or runway. Without cash
              balance, burn, debt, and working-capital data, the capital stack looks ample but still not measurable.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI013
              - CI014
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Financially, Resolve AI looks like a company with authentic enterprise demand, unusually strong
              fundraising leverage, and a plausible path to large contract expansion if customer ROI stories generalize.
              The best public evidence supports a subscription-led product sold into expensive operational pain points,
              which is exactly the kind of category that can justify rapid valuation expansion when reference customers
              are strong. The same evidence also suggests the product is not a low-touch software sale: high-risk
              actions still require human governance, and the underlying stack depends on custom models, frontier
              models, integrations, and production-safe controls that are likely costly to build and serve.

              The underwriting blocker is not whether a business exists; it is whether the public record is detailed
              enough to judge the quality of that business. The reviewed sources are sufficient to show commercial
              momentum, but they are insufficient to determine realized pricing, contract duration, expansion
              concentration, margin profile, or cash runway. A serious diligence process should treat the current
              valuation as commercially plausible but financially under-evidenced until management produces cohort
              revenue data, cost structure detail, and capital-adequacy materials.
            claimRefs:
              - CI011
              - CI012
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial proof exists before full financial proof
            body: >-
              Resolve has enough public customer evidence to justify serious buyer and investor attention, but not
              enough public unit-economics data to justify a clean underwriting case on its own.
            calloutType: insight
            claimRefs:
              - CI004
              - CI009
              - CI010
              - CI011
          - type: callout
            title: Valuation outruns disclosure quality
            body: >-
              The company may deserve a premium for category leadership, but the public record still lacks the margin,
              burn, runway, and concentration data needed to test whether that premium is durable.
            calloutType: risk
            claimRefs:
              - CI005
