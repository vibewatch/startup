  - id: TV001
    title: Recommendation summary
    columns:
      - Decision factor
      - Assessment
      - Evidence
      - Decision implication
    rows:
      - - Recommendation
        - Research more
        - Financing and customer proof are material, but financial underwriting inputs are absent.
        - Do not underwrite at the headline mark before data-room verification.
      - - Confidence
        - Medium
        - Two financing marks are corroborated, while core operating metrics are not.
        - Treat price sensitivity and evidence quality as gating conditions.
      - - Risk rating
        - High
        - Autonomous production operation has technical-control risk and unverified economics.
        - Require staged deployment evidence and contractual downside protection.
      - - Valuation stance
        - Stretched
        - The announced mark rose 50% from $1.0B to $1.5B without a verified public revenue denominator.
        - Demand milestone-based entry discipline rather than a public-data multiple.
      - - Current financing context
        - $40M extension at $1.5B; more than $190M company-reported total funding
        - Forge reports $199.93M total funding and the same $1.5B post-money mark.
        - Capital availability improves execution runway but does not establish cash on hand.
    notes: >-
      Assessments use announced financing marks and third-party databases; revenue, cash balance, dilution, and return
      ranges remain unverified.
