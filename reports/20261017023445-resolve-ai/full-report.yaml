        title: Exhibits
        blocks:
          - type: callout
            title: Founder-market fit is unusually strong for this category
            body: >-
              The assigned sources consistently tie Resolve AI’s credibility to founders who previously built
              observability infrastructure, led Splunk’s observability business, and are selling directly into the
              production-operations workflow they know best.
            calloutType: strength
            claimRefs:
