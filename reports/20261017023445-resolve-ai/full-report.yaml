              - CU014
      - number: '6.3'
        title: Expansion logic is plausible; durability and concentration remain unpriced
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a land-and-expand narrative, but not a quantified one. The official material
              consistently pushes the product beyond wartime incident response into daily investigation, operational
              reporting, onboarding, and debugging, which suggests the expansion wedge is workflow depth once a team
              trusts the initial incident use case. That is strategically attractive because it can raise switching
              costs inside large engineering organizations. The problem is that the same public evidence set does not
              disclose current customer count, contract length, NRR, GRR, churn, or any top-customer concentration
              schedule, so the durability of those marquee deployments cannot be underwritten. The only clearly adverse
              source in the pool is a competitor-authored comparison that argues some buyers want self-hosting,
              approval-gated remediation, or public pricing and notes that evaluating Resolve's pricing requires a demo.
              That does not overturn the adoption story, but it does highlight that buyer friction can still emerge
              around procurement, deployment model, and governance even when technical value looks strong.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
