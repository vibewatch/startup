  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Case
      - Assumptions
      - Valuation and return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Verified net expansion, durable gross margin, repeatable enterprise deployments, and safe autonomy.
        - >-
          The $1.5B mark becomes supportable only if forward economics materially exceed mature public-software
          references.
        - Low until independently verified cohort and financial data are available.
        - Customer validation or safety benchmarks fail.
      - - Base
        - Named-enterprise adoption continues, but financial visibility and autonomy evidence improve slowly.
        - No defensible numeric return range; negotiate a milestone-gated price or defer.
        - Most consistent with the current mixed evidence.
        - Growth, retention, or gross margin misses management plan.
      - - Bear
        - Commercial conversion slows, autonomy remains constrained, or private-market multiples compress.
        - The prior $1.0B mark is not a floor; loss severity depends on undisclosed preference and dilution terms.
        - Elevated if the next financing requires price protection or a lower effective price.
        - Down round, weak renewals, or inability to demonstrate safe remediation.
    notes: >-
      Scenario probabilities and valuation ranges are intentionally qualitative because verified revenue, margins,
      retention, burn, and cap-table data are unavailable.
