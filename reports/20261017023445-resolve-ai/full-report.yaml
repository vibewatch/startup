      - number: '1.3'
        title: Funding path, valuation markers, and stakeholder concentration
        blocks:
          - type: paragraph
            body: >-
              Resolve AI’s financing cadence is the clearest public indicator of company momentum. The launch post
              announced a $35 million seed in October 2024, the company’s February 2026 announcement said it raised $125
              million in a non-blended Series A at a $1 billion valuation, and the April 2026 extension announcement
              said another $40 million came in at a $1.5 billion valuation led by DST Global and Salesforce Ventures.
              Independent market-data sources broadly corroborate the funding arc and place total funding near $200
              million, but they also highlight that some valuation framing may be more complex than the headline
              suggests. VFuture Media reported that the December 2025 round used a multi-tranche structure that implied
              a blended valuation below the $1 billion headline, which is relevant because valuation optics may be
              cleaner than public governance economics.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO014
              - CO015
