      - number: '1.2'
        title: Leadership, founder-market fit, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Public sources clearly identify the two co-founders and support unusually strong founder-market fit for
              the category. Tracxn and official materials both identify Spiros Xanthos as co-founder and CEO and Mayank
              Agarwal as co-founder and CTO, while the company’s February 2026 announcement says the founders previously
              led Splunk’s observability business and co-created OpenTelemetry. That background is directly relevant to
              a product that must reason over telemetry, production systems, and reliability workflows. The April 2026
              extension announcement also says Dhruv Mahajan joined as Chief AI Scientist to lead Resolve AI Labs,
              signaling a deliberate research push. What remains thin is governance visibility: the assigned public
              sources do not disclose board composition, voting controls, or financing preference terms in enough detail
              to underwrite downside protections.
