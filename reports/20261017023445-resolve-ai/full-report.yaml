      - number: '6.2'
        title: Named production proof is real, but mostly company-shaped
        blocks:
          - type: paragraph
            body: >-
              The strongest support in this chapter is not the logos themselves but the repeated production wording
              attached to them. Resolve's homepage features a DoorDash story about keeping a billion-dollar ads platform
              resilient in production and pairs it with a 5x faster MTTR claim. The glossary goes further by attributing
              concrete outcomes to named customers: Coinbase is said to investigate critical incidents 72% faster,
              DoorDash's advertising team is said to resolve incidents up to 87% faster, and Zscaler is said to require
              30% fewer engineers per incident while handling more than 150,000 alerts. Salesforce is the best
              individual reference because the April 2026 press release includes a named executive quote describing
              investigation work that moved from hours to a fraction of the time. That is stronger than a logo wall, but
              it is still mostly company-issued proof rather than independent customer testimony or procurement records,
              so it establishes production deployment more confidently than it establishes account breadth or long-run
              stickiness.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
