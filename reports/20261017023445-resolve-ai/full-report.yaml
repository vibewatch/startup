  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / surface
      - Role
      - Concentration signal
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Frontier-model access and economics
        - External model providers
        - Augment Resolve's domain models for reasoning and cost/performance trade-offs
        - Homepage explicitly says Resolve combines its own models with frontier models
        - Vendor-price, latency, or access changes reduce product margin or answer quality
        - Medium
        - Resolve is building domain-specific models and post-training through AI Labs
        - Exposure remains until the company can show graceful failover and stable unit economics
      - - Marquee reference customers and design-partner enterprises
        - Coinbase, DoorDash, MongoDB, MSCI, Salesforce, Zscaler, and similar accounts
        - Provide customer proof, workflow feedback, and roadmap validation
        - >-
