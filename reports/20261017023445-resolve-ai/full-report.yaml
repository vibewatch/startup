  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Top residual risk is product-proof plus control quality
        blocks:
          - type: paragraph
            body: >-
              The retained public evidence points to a classic agentic-ops asymmetry: Resolve wants to be trusted with
              on-call investigations and increasingly autonomous operating work, but the strongest public proof still
              leans on company-authored claims and customer anecdotes. Official materials say the product goes on-call
              for engineers, background agents inspect deployments continuously, and production-grade AI SREs can
              investigate alerts in minutes. The clearest independent check in the assigned pool is Marketing Scoop's
              caution that the reported more-than-2x root-cause improvement came from internal evaluation sets rather
              than a neutral third-party benchmark. That does not invalidate the thesis, but it leaves accuracy,
              false-positive, and control-boundary risk as the highest residual exposure because a wrong action in
              production can deepen an outage faster than a slow assistant can.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
