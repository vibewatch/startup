      - number: '5.3'
        title: Maturity, differentiation, and evidence quality
        blocks:
          - type: paragraph
            body: >-
              Resolve's differentiation story is specific enough to underwrite as a real product thesis: a
              production-specific environment model, multi-agent investigation, background agents for recurring
              operational work, and human-supervised escalation toward greater autonomy. External coverage supports the
              existence of that architecture and product expansion, but it also narrows the evidentiary strength of the
              headline performance claims. The reported "more than 2x" improvement in root-cause accuracy is explicitly
              tied to internal evaluation sets, not a third-party audit, and the company-described customer outcome
              anecdotes are still selective. That means the product looks materially beyond a basic copilot, yet proof
              of repeatable performance remains shallower than the commercial ambition.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE012
              - CE013
              - CE016
      - number: '5.4'
        title: Trust controls, deployment constraints, and open diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Trust and control are central because Resolve aims to influence live production systems. The retained
              evidence does show meaningful guardrail signals: the docs expose an evidence trail and inspectable
              reports, the Labs page frames autonomy as a progression from AI-assisted to human-on-the-loop operation,
              and VentureBeat reports a deployment model where inference can run as SaaS or inside a customer VPC.
              Still, public proof remains thin on named security certifications, hard reliability statistics, and the
              exact approval boundaries for automated remediation. For diligence, the key product question is no longer
              whether Resolve has a coherent architecture; it is whether independent proof of safety, accuracy, and
              operational governance will keep pace with the autonomy narrative.
            claimRefs:
              - CE005
              - CE009
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Resolve is selling a production-operations system, not a developer copilot
            body: >-
              The documented product surface spans first-response investigations, live incident collaboration,
              unattended background tasks, and external agent or API access, which puts the company closer to autonomous
              operations infrastructure than to a narrow observability add-on.
            calloutType: insight
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE010
          - type: callout
            title: Benchmark credibility still lags the autonomy narrative
            body: >-
              Resolve's strongest technical claim is a more-than-2x improvement in root-cause accuracy, but the retained
              evidence also says the measurement comes from internal evaluation sets and is not backed by a public
              third-party audit, leaving a key diligence gap for production trust.
            calloutType: risk
            claimRefs:
              - CE008
              - CE009
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segment mix and adoption signals skew toward large engineering organizations
        blocks:
          - type: paragraph
            body: >-
              Resolve AI's public customer story is centered on sophisticated engineering teams that already run complex
              production environments. Current official pages name Coinbase, DoorDash, Zscaler, Snowflake, Robinhood,
              and Toast as teams that run or use the product in production or daily operations, which implies the buyer
              is usually an engineering, SRE, infrastructure, or platform leader while the day-to-day user is the
              on-call or production engineer. The clearest historical adoption marker in the assigned pool is the
              independently curated Silicon Valley Invest Club profile, which says the company emerged from stealth in
              late 2024 with 20+ enterprise customers including Coinbase, Salesforce, and DoorDash. By April 2026, the
              company was still naming large enterprise accounts in its financing release, so the logo set appears to
              have held or broadened rather than being a one-launch splash. What is still missing is the denominator:
              public materials name marquee accounts and outcomes, but they do not disclose the current paying-customer
              count, how many accounts are fully deployed, or how revenue splits by segment.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
