      - Argument
      - Evidence status
      - What would change the view
    rows:
      - - Thesis
        - Recognizable enterprises are using the platform.
        - Company-issued customer roster.
        - Independent references confirming deployment scope, renewal, and production usage.
      - - Thesis
        - Reported incident-response outcomes indicate potential ROI.
        - Company reports 72% faster Coinbase investigation and 30% fewer engineers per Zscaler incident.
        - Customer-validated cohort results with baselines, periods, and denominators.
      - - Anti-thesis
        - The $1.5B mark outruns decision-grade financial disclosure.
