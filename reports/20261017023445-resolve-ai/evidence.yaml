evidenceGaps:
  - type: missing-source
    severity: material
    topic: financial-disclosure
    missingEvidence: Current ARR, quarterly growth, gross margin, burn, NRR, and audited revenue composition.
    whyItMatters: >-
      These metrics determine whether the 2025-2026 valuation step-up is supported by software economics rather than
      category momentum alone.
    diligencePath: Request board deck, monthly KPIs, cohort retention, and audited or reviewed financial statements for 2025-2026.
    relatedQuestionRefs:
      - QO003
      - QO006
  - type: missing-source
    severity: material
    topic: governance-and-cap-table
    missingEvidence: >-
      Board composition, investor rights, liquidation preference stack, dilution, and any special protections across the
      2025-2026 financings.
    whyItMatters: >-
      Public headline valuations can materially overstate common-equity economics when governance or preference terms
      are aggressive.
    diligencePath: Review charter, financing documents, cap table, side letters, and board observer agreements.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-stakeholder-coverage
    missingEvidence: >-
      A complete executive roster, board list, and fuller map of strategic counterparties beyond the public investor and
      customer names.
    whyItMatters: >-
      The public sources are sufficient for a founder-led overview, but not enough to judge governance depth, succession
      risk, or commercial concentration thoroughly.
    diligencePath: Request org chart, board list, and top-customer / strategic-partner summary from management.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: independent-product-validation
    missingEvidence: >-
      Independent benchmarks for root-cause accuracy, safe autonomous remediation rates, and production guardrail
      performance.
    whyItMatters: >-
      The company narrative depends on trustworthy autonomous action in production, but the assigned public evidence
      remains mostly company-issued or market-summary oriented.
    diligencePath: >-
      Request third-party evaluations, customer reference calls, and incident-level before/after data with clear
      denominators.
    relatedQuestionRefs:
      - QO007
      - QO008
  - type: missing-source
    severity: material
    topic: tam-sam-som
    missingEvidence: >-
      An independent market report or public-company disclosure that isolates AI SRE or autonomous production-operations
      software spend with a transparent methodology.
    whyItMatters: >-
      Without a defensible denominator, valuation and outcome claims cannot be translated into a reliable TAM, SAM, or
      penetration view.
    diligencePath: >-
      Obtain a current analyst market map or public-company category disclosure that breaks out production-operations
      automation budgets from broader observability or developer-tooling spend.
    relatedQuestionRefs:
      - QM003
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: roi-benchmarking
    missingEvidence: >-
      Independent benchmark data on root-cause accuracy, approval rates for autonomous actions, ACV, and payback period
      across multiple production deployments.
    whyItMatters: >-
      Customer-specific anecdotes can demonstrate traction, but they do not show whether the category is repeatable,
      safely autonomous, or economically robust across buyers.
    diligencePath: >-
      Request cohort-level customer evidence, third-party benchmarking, or procurement disclosures that normalize
      outcomes across comparable environments.
    relatedQuestionRefs:
      - QM006
      - QM008
  - type: missing-source
    severity: material
    topic: benchmarking
    missingEvidence: >-
      Independent benchmark packs comparing RCA accuracy, false-positive rates, rollback quality, and safe autonomous
      action across Resolve and named peers.
    whyItMatters: >-
      Public competition pages are mostly vendor-authored, so positioning claims cannot be cleanly converted into
      underwritten product superiority.
    diligencePath: >-
      Request customer-ready benchmark decks, methodology notes, and side-by-side evaluation criteria from Resolve and
      the top three alternatives in the live deal set.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Resolve list pricing, minimum contract terms, discounting behavior, and any usage-based components.
    whyItMatters: >-
      Pricing opacity is a repeated objection in retained comparison evidence and it affects whether incumbent or
      self-hosted alternatives clear procurement faster.
    diligencePath: >-
      Obtain a current commercial proposal from Resolve and compare it with Datadog, PagerDuty, and incident.io budget
      envelopes for a similarly sized deployment.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: switching-cost
    missingEvidence: Public customer stories describing migration off PagerDuty, Datadog, or workflow-led incident stacks into Resolve.
    whyItMatters: >-
      The competitive question is not only feature depth but also whether buyers can justify replacing an incumbent
      system of record.
    diligencePath: >-
      Ask Resolve for migration case studies, time-to-value evidence, and references that displaced incumbent incident
      or observability stacks.
    relatedQuestionRefs:
      - QP006
      - QP007
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Current ARR, quarterly growth, bookings, backlog, and revenue-recognition policy
    whyItMatters: >-
      Without current revenue and booking data, investors cannot test whether the valuation step-up reflects durable
      commercial scale or only market enthusiasm.
    diligencePath: Request the board deck, monthly finance pack, and cohort revenue exports by customer and product
    relatedQuestionRefs:
      - QI003
      - QI007
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, inference and hosting costs, services burden, CAC, sales cycle, and payback
    whyItMatters: >-
      Margin durability and go-to-market efficiency determine whether a premium valuation can compound rather than
      compress.
    diligencePath: >-
      Request a unit-economics bridge that separates hosting, inference, implementation, support, and sales / marketing
      spend
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, runway, debt obligations, and downside financing plan
    whyItMatters: Funding raised is not a substitute for cash available, and the Labs plus hiring plan likely increase forward burn.
    diligencePath: Request a cash waterfall, current balance sheet, debt schedule, and 18-month operating plan
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 customer concentration, renewal rates, contract duration, and NRR by cohort
    whyItMatters: >-
      A handful of marquee references can mask concentration risk and make ACV anecdotes look more durable than they
      are.
    diligencePath: Request customer cohort analysis, top-account revenue bridge, and standard contract terms
    relatedQuestionRefs:
      - QI002
      - QI003
      - QI007
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: independent-benchmark-validation
    missingEvidence: >-
      Public third-party benchmarks or customer-authored case studies validating the claimed 2x root-cause-accuracy gain
      and five-minute triage performance across representative incident sets.
    whyItMatters: >-
      Resolve's core autonomy thesis depends on engineers trusting investigation quality and safe escalation under real
      production conditions.
    diligencePath: >-
      Request benchmark methodology, external validation artifacts, and at least two customer references that can
      discuss false positives, override rates, and outcome quality.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: security-and-governance-controls
    missingEvidence: >-
      Named certifications, control mappings, retention policies, and public documentation of which remediation actions
      require human approval versus autonomous execution.
    whyItMatters: >-
      Buyers in regulated environments will underwrite product risk through concrete control evidence, not just
      positioning language about production readiness.
    diligencePath: >-
      Request SOC 2 or equivalent documentation, deployment architecture notes, and approval-policy matrices for
      high-risk remediation classes.
  - type: missing-source
    severity: minor
    topic: developer-and-practitioner-signal
    missingEvidence: >-
      Public OSS, package, API-community, or practitioner-proxy evidence showing external developer engagement with
      Resolve's API or MCP surface.
    whyItMatters: >-
      The product now exposes programmatic interfaces, but the retained pool does not show whether those surfaces have
      meaningful ecosystem adoption or operator mindshare.
    diligencePath: >-
      Ask for GitHub, package, usage, or partner-engineering proxy metrics and retain any public conference talks or
      engineering references tied to API or MCP usage.
  - type: missing-source
    severity: material
    topic: retention-disclosure
    missingEvidence: Current customer count, NRR, GRR, churn, renewal rates, contract length, and cohort data by vintage or segment.
    whyItMatters: >-
      Without durability metrics, marquee customer proof cannot be translated into revenue quality or expansion
      certainty.
    diligencePath: >-
      Request cohort retention tables, renewal schedules, and contract-length distribution from management or the data
      room.
    relatedQuestionRefs:
      - QU005
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-10 customer revenue share, largest-customer ACV, and any partner or channel concentration tied to customer
      acquisition.
    whyItMatters: >-
      Large recognizable logos can still hide lumpy revenue exposure or dependence on a small number of referenceable
      accounts.
    diligencePath: Obtain a customer concentration schedule and contracted ARR by account from the company.
    relatedQuestionRefs:
      - QU007
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table coverage sample only
    missingEvidence: An exhaustive customer reference list that distinguishes pilot, production, and expanded accounts.
    whyItMatters: The named customer proof table is a public sample, not a full census of live customers.
    diligencePath: Request a referenceable customer roster with deployment stage, start date, and outcome summary.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: outcome-methodology
    missingEvidence: Baseline periods, sample sizes, and measurement methodology for MTTR, RCA, and engineers-per-incident claims.
    whyItMatters: >-
      Outcome claims help justify enterprise adoption, but without methodology they remain directional rather than fully
      underwritten.
    diligencePath: Ask for customer-approved case-study methodology and raw before/after metrics for the cited accounts.
    relatedQuestionRefs:
      - QU003
  - type: missing-source
    severity: material
    topic: security-proof-gap
    missingEvidence: >-
