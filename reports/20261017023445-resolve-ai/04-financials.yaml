artifact: financials
slug: resolve-ai
runDate: 2026-10-17
company:
  name: Resolve AI
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a subscription-led enterprise AI SRE business with
    marquee customers, outcome-oriented ROI stories, and repeated valuation
    step-ups. It does not support underwriting realized pricing, gross margin,
    CAC efficiency, or runway, so the forward financial case still depends more
    on market belief and reference customers than on disclosed operating
    metrics.
sections:
  - id: revenue-model
    title: Revenue model and monetization evidence
    body: >-
      The public record supports a software-subscription business aimed at large
      enterprise operations teams, but it is still a thin record rather than a
      full underwriting pack. Resolve AI's own site frames the product as an AI
      SRE platform that goes on-call, operates production tools, and improves
      reliability outcomes, while NeuronFeed lists pricing only as
      enterprise-with-free-trial rather than with public list rates or seat
      bands. That combination points to a high-touch land motion, likely via
      pilot or proof-of-value, followed by enterprise contract expansion if the
      platform reduces incident toil in production. Public sources do not show a
      price card, standard contract duration, or whether revenue is recognized
      per workload, per environment, or per platform-wide subscription.
      
      The strongest monetization signal is not list pricing but reported deal
      size and buyer quality. EntrepreneurLoop says Resolve is already winning
      high six- and seven-figure ACVs, and the company repeatedly cites
      Coinbase, DoorDash, MongoDB, MSCI, Salesforce, and Zscaler as production
      customers. That pattern is consistent with a category where value-based
      selling matters more than transparent packaging: buyers are paying to
      compress investigation time, reduce engineer involvement per incident, and
      absorb operational complexity. The result is a credible subscription
      revenue story, but not yet a disclosable price architecture or a
      corroborated view of realized net pricing.
    claimRefs: [CI001, CI002, CI008, CI009, CI015]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-unit-economics
    title: Public traction is real; unit economics are still mostly private
    body: >-
      Resolve's commercial proof is stronger on customer outcomes than on
      conventional SaaS metrics. The company claims 5x faster MTTR and lower
      cost per task on its homepage, and its glossary page plus independent
      coverage point to customer anecdotes including a 72% reduction in time to
      investigate critical incidents at Coinbase and a 30% reduction in
      engineers required per incident at Zscaler or another enterprise security
      deployment. Those are meaningful value signals because they map directly
      to labor cost, outage duration, and operational risk. They also help
      explain why independent coverage describes the product as already landing
      sizeable enterprise ACVs.
      
      The problem is that public outcome anecdotes are not the same thing as
      disclosed unit economics. Multiples and EntrepreneurLoop both cite ARR of
      about $4 million around the Series A, which implies the business is still
      early relative to its valuation. No reviewed source discloses gross
      margin, hosting or inference costs, services intensity, CAC, sales cycle,
      payback, NRR, or concentration. Public evidence therefore supports demand
      and buyer willingness to pay, but not revenue quality or margin durability
      in the form an investor would normally use to underwrite a $1 billion-plus
      company.
    claimRefs: [CI003, CI004, CI009, CI010, CI011, CI012]
    tableRefs: [TI003]
  - id: capital-base
    title: Capital access is strong, but capital adequacy is still opaque
    body: >-
      Resolve's financing history shows exceptional access to capital. The
      company announced a $40 million Series A extension at a $1.5 billion
      valuation in April 2026, and market-data trackers cluster cumulative
      funding around more than $190 million to roughly $200 million after the
      extension. Those sources also show the extension following a roughly $125
      million Series A at a $1 billion valuation, so valuation stepped up
      materially within a short period. That trajectory indicates strong
      investor appetite and likely meaningful conviction in customer adoption,
      but it does not prove the company is already self-funding or even close
      to break-even.
      
      Public disclosures suggest the new capital is being used to expand the
      platform, grow go-to-market capacity, and fund Resolve AI Labs rather than
      to harvest cash flow from a mature software base. Tracxn lists 168
      employees as of late August, and both the product narrative and Labs
      launch imply meaningful spend on model development, integrations, and
      governance. That is consistent with a company buying time and strategic
      position, not with a company disclosing enough to underwrite burn or
      runway. Without cash balance, burn, debt, and working-capital data, the
      capital stack looks ample but still not measurable.
    claimRefs: [CI005, CI006, CI007, CI013, CI014]
  - id: verdict-and-blockers
    title: Financial verdict and diligence blockers
    body: >-
      Financially, Resolve AI looks like a company with authentic enterprise
      demand, unusually strong fundraising leverage, and a plausible path to
      large contract expansion if customer ROI stories generalize. The best
      public evidence supports a subscription-led product sold into expensive
      operational pain points, which is exactly the kind of category that can
      justify rapid valuation expansion when reference customers are strong.
      The same evidence also suggests the product is not a low-touch software
      sale: high-risk actions still require human governance, and the underlying
      stack depends on custom models, frontier models, integrations, and
      production-safe controls that are likely costly to build and serve.
      
      The underwriting blocker is not whether a business exists; it is whether
      the public record is detailed enough to judge the quality of that
      business. The reviewed sources are sufficient to show commercial momentum,
      but they are insufficient to determine realized pricing, contract
      duration, expansion concentration, margin profile, or cash runway. A
      serious diligence process should treat the current valuation as
      commercially plausible but financially under-evidenced until management
      produces cohort revenue data, cost structure detail, and capital-adequacy
      materials.
    claimRefs: [CI011, CI012, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Core AI SRE platform subscription
        - Enterprise software contract for incident investigation and remediation
        - ACV / annual subscription
        - Enterprise customer base is public; Multiples and EntrepreneurLoop place ARR near $4M around the Series A
        - Medium
        - Provide current ARR, booked ARR, backlog, and revenue-recognition policy
      - - Pilot or trial motion
        - Free trial or proof-of-value before broader rollout
        - Trial / pilot
        - NeuronFeed lists pricing as enterprise with a free trial; conversion metrics are undisclosed
        - Low
        - Share pilot-to-paid conversion, average sales cycle, and required implementation effort
      - - Expansion inside existing accounts
        - Broader scope across teams, incidents, or production environments after ROI proof
        - Expansion ACV
        - Customer-outcome case studies and fast valuation step-up imply expansion potential, but no NRR or cohort data are public
        - Low
        - Share NRR, expansion ARR, top-customer growth, and churn by cohort
      - - AI Labs-enabled premium capability
        - Potential premium module or bundled differentiation from domain-specific models
        - SKU / feature uplift
        - Labs launch is disclosed, but no standalone monetization or pricing is public
        - Low
        - Clarify whether Labs output is bundled, usage-priced, or a future upsell
    notes: >-
      Public evidence supports a subscription business and a free-trial land
      motion, but realized pricing, contract duration, and expansion mechanics
      remain undisclosed; low-status rows are hypotheses to diligence, not
      confirmed monetized lines today.
    claimRefs: [CI002, CI008, CI009, CI010, CI013, CI015]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer or signal
      - Price / unit / contract
      - Public evidence
      - Caveat
      - Implication
    rows:
      - - Public list pricing
        - null
        - No reviewed source published a price card, seat band, or usage schedule
        - Absence of list pricing is a disclosure gap, not zero price
        - Buyers likely negotiate bespoke enterprise contracts
      - - Contract model
        - Enterprise; free trial
        - NeuronFeed lists Pricing as Enterprise and free trial
        - Directory-style source, not a signed contract or order form
        - Sales motion appears high touch and pilot friendly
      - - Realized pricing signal
        - High six- and seven-figure ACVs
        - EntrepreneurLoop reports Resolve is commanding high six- and seven-figure ACVs
        - Single independent report; not reconciled to cohort ARR or discounting
        - Value-based pricing may be materially above standard observability tooling
      - - ROI selling proof
        - 72% faster investigation; 30% fewer engineers per incident
        - Resolve glossary and independent coverage cite customer outcome anecdotes
        - Outcome data support willingness to pay, not invoice price or renewal quality
        - Vendor appears to sell on labor and outage-cost compression
    notes: >-
      This table distinguishes disclosed pricing signals from actual realized
      contract economics; public sources provide selling signals and buyer ROI
      anecdotes, but not discounting, contract length, minimum commits, or
      renewal terms.
    claimRefs: [CI004, CI008, CI009, CI015]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - ARR at Series A
        - "~$4M"
        - Medium
        - Frames how stretched the valuation was at the time of the round
        - Provide current ARR, quarterly bookings, growth, and deferred revenue
      - - Employee count
        - "168 as of Aug 26"
        - Medium
        - Headcount scale plus Labs and GTM expansion imply meaningful burn even before margin disclosure
        - Provide payroll run rate, open headcount plan, and cash compensation mix
      - - Gross margin
        - null
        - Low
        - Model serving, integration, and support burden determine software durability
        - Provide hosting, inference, implementation, and support cost split
      - - CAC payback
        - null
        - Low
        - Free-trial enterprise motion could be expensive if sales cycles or implementation are long
        - Provide CAC, payback, win rate, and sales cycle by segment
      - - Burn / runway
        - null
        - Low
        - Funding raised is not cash available or evidence of runway
        - Provide current cash, monthly burn, budget, and runway base / upside / downside
      - - Customer concentration and NRR
        - null
        - Low
        - A few marquee logos can overstate revenue diversification and renewal quality
        - Provide top-10 concentration, renewal rates, and expansion / churn by cohort
    notes: >-
      Public sources disclose only proxy metrics and fundraising context; null
      values mark missing private company data that is required for underwriting,
      not zeroes.
    claimRefs: [CI004, CI010, CI011, CI012, CI014]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence suggests Resolve lands through enterprise evaluation,
      proves ROI on incident toil, then expands contract scope; the gross-profit
      bridge remains opaque because serving costs are undisclosed.
    data:
      nodes:
        - id: pain
          label: Production incident cost
          value: Enterprise engineering toil and outage cost create the budget line
        - id: trial
          label: Free trial or pilot
          value: NeuronFeed lists enterprise pricing with a free trial
        - id: deployment
          label: Production deployment
          value: Coinbase, DoorDash, MongoDB, MSCI, Salesforce, and Zscaler are cited as users
        - id: contract
          label: Annual platform contract
          value: EntrepreneurLoop reports high six- and seven-figure ACVs
        - id: expansion
          label: Expansion after ROI proof
          value: Outcome anecdotes support wider team and workflow adoption, but no NRR is public
        - id: gp
          label: Gross profit still unproven
          value: Model serving, integrations, and human-governance costs are undisclosed
      edges:
        - from: pain
          to: trial
          label: Buyer starts with operational pain
        - from: trial
          to: deployment
          label: Proof of value in live production
        - from: deployment
          to: contract
          label: Enterprise contract after referenceable results
        - from: contract
          to: expansion
          label: More teams, incidents, or environments
        - from: expansion
          to: gp
          label: Margin depends on serving and support cost discipline
    claimRefs: [CI002, CI004, CI008, CI012, CI015]
callouts:
  - calloutType: insight
    title: Commercial proof exists before full financial proof
    body: >-
      Resolve has enough public customer evidence to justify serious buyer and
      investor attention, but not enough public unit-economics data to justify a
      clean underwriting case on its own.
    claimRefs: [CI004, CI009, CI010, CI011]
  - calloutType: risk
    title: Valuation outruns disclosure quality
    body: >-
      The company may deserve a premium for category leadership, but the public
      record still lacks the margin, burn, runway, and concentration data needed
      to test whether that premium is durable.
    claimRefs: [CI005, CI006, CI011, CI012, CI016]
