figures:
  - id: "FU001"
    title: "Customer journey map"
    type: "journey-map"
    summary: "Resolve's customer motion appears to start with incident pain, broaden into daily operations, and then hit procurement and governance scrutiny."
    data:
      nodes:
        - label: "Enterprise incident pain"
          actor: "Buyer"
          stage: "Problem recognition"
          touchpoints:
            - "High-cost incidents, alert overload, and long RCA cycles"
            - "Interest in reducing MTTR and war-room staffing"
          note: "Official pages consistently frame the value proposition around production operations and reliability."
        - label: "Production pilot"
          actor: "Buyer + user"
          stage: "Evaluation"
          touchpoints:
            - "Evaluate real-incident performance rather than demo-only workflows"
            - "Check integrations, governance, and human-in-the-loop controls"
          note: "Resolve's own evaluation guidance stresses wartime and peacetime proof before broader rollout."
        - label: "Named production deployment"
          actor: "User"
          stage: "Initial adoption"
          touchpoints:
            - "Incident investigation across code, infra, and telemetry"
            - "DoorDash, Coinbase, Salesforce, and Zscaler appear in production-oriented proof"
          note: "Public evidence is strongest once the product is tied to live production workflows rather than a logo wall."
        - label: "Daily operations expansion"
          actor: "User"
          stage: "Expansion"
          touchpoints:
            - "On-call readiness, debugging, operational reports, and onboarding"
            - "Institutional knowledge capture raises switching costs"
          note: "Official material repeatedly describes usage outside active incidents, which is the clearest land-and-expand signal."
        - label: "ROI and trust proof"
          actor: "Buyer"
          stage: "Internal validation"
          touchpoints:
            - "5x faster MTTR, 72% faster investigation, 87% faster resolution, 30% fewer engineers per incident"
            - "Named outcomes help justify broader deployment if they are reproducible"
          note: "The ROI narrative is compelling, but methodology and customer-level baselines are mostly undisclosed."
        - label: "Procurement and governance friction"
          actor: "Buyer / security / finance"
          stage: "Expansion constraint"
          touchpoints:
            - "Pricing requires a demo"
            - "Some buyers may want self-hosting or tighter approval controls"
          note: "The main adverse signal in the assigned pool is around procurement, deployment model, and transparency rather than customer dissatisfaction."
    claimRefs: ["CU005", "CU006", "CU008", "CU012"]
callouts:
  - calloutType: "strength"
    title: "Customer proof clears the logo-wall bar"
    body: "Resolve's public evidence set is still company-heavy, but it repeatedly couples marquee logos with explicit production wording and outcome statements, which is materially stronger than a passive customer wall."
    claimRefs: ["CU005", "CU006", "CU007", "CU014"]
  - calloutType: "risk"
    title: "Durability is the unresolved underwriting layer"
    body: "The chapter supports enterprise adoption, but not customer-quality economics, because retention, contract duration, ACV concentration, and cohort behavior remain undisclosed in the reviewed sources."
    claimRefs: ["CU009", "CU010", "CU013"]
