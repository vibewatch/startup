schemaVersion: "report-v2"
artifact: "customers"
slug: "resolve-ai"
runDate: 2026-10-17
company:
  name: "Resolve AI"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    Resolve AI has better customer proof than a simple logo wall: company-issued materials
    repeatedly place Coinbase, DoorDash, Salesforce, and Zscaler in production use, and
    current pages attach outcome language such as faster MTTR, faster investigations, and
    fewer engineers per incident. The underwriting gap is durability rather than demand,
    because no reviewed public source discloses current customer count, retention metrics,
    contract structure, or customer concentration.
sections:
  - id: "segment-mix-and-adoption-signals"
    title: "Segment mix and adoption signals skew toward large engineering organizations"
    body: >-
      Resolve AI's public customer story is centered on sophisticated engineering teams that
      already run complex production environments. Current official pages name Coinbase,
      DoorDash, Zscaler, Snowflake, Robinhood, and Toast as teams that run or use the
      product in production or daily operations, which implies the buyer is usually an
      engineering, SRE, infrastructure, or platform leader while the day-to-day user is the
      on-call or production engineer. The clearest historical adoption marker in the assigned
      pool is the independently curated Silicon Valley Invest Club profile, which says the
      company emerged from stealth in late 2024 with 20+ enterprise customers including
      Coinbase, Salesforce, and DoorDash. By April 2026, the company was still naming large
      enterprise accounts in its financing release, so the logo set appears to have held or
      broadened rather than being a one-launch splash. What is still missing is the
      denominator: public materials name marquee accounts and outcomes, but they do not
      disclose the current paying-customer count, how many accounts are fully deployed, or
      how revenue splits by segment.
    claimRefs: ["CU001", "CU002", "CU003", "CU004"]
    tableRefs: ["TU001", "TU002"]
  - id: "named-production-proof"
    title: "Named production proof is real, but mostly company-shaped"
    body: >-
      The strongest support in this chapter is not the logos themselves but the repeated
      production wording attached to them. Resolve's homepage features a DoorDash story about
      keeping a billion-dollar ads platform resilient in production and pairs it with a 5x
      faster MTTR claim. The glossary goes further by attributing concrete outcomes to named
      customers: Coinbase is said to investigate critical incidents 72% faster, DoorDash's
      advertising team is said to resolve incidents up to 87% faster, and Zscaler is said to
      require 30% fewer engineers per incident while handling more than 150,000 alerts.
      Salesforce is the best individual reference because the April 2026 press release
      includes a named executive quote describing investigation work that moved from hours to
      a fraction of the time. That is stronger than a logo wall, but it is still mostly
      company-issued proof rather than independent customer testimony or procurement records,
      so it establishes production deployment more confidently than it establishes account
      breadth or long-run stickiness.
    claimRefs: ["CU005", "CU006", "CU007", "CU014"]
    tableRefs: ["TU003"]
  - id: "expansion-durability-and-concentration"
    title: "Expansion logic is plausible; durability and concentration remain unpriced"
    body: >-
      Public evidence supports a land-and-expand narrative, but not a quantified one. The
      official material consistently pushes the product beyond wartime incident response into
      daily investigation, operational reporting, onboarding, and debugging, which suggests
      the expansion wedge is workflow depth once a team trusts the initial incident use case.
      That is strategically attractive because it can raise switching costs inside large
      engineering organizations. The problem is that the same public evidence set does not
      disclose current customer count, contract length, NRR, GRR, churn, or any top-customer
      concentration schedule, so the durability of those marquee deployments cannot be
      underwritten. The only clearly adverse source in the pool is a competitor-authored
      comparison that argues some buyers want self-hosting, approval-gated remediation, or
      public pricing and notes that evaluating Resolve's pricing requires a demo. That does
      not overturn the adoption story, but it does highlight that buyer friction can still
      emerge around procurement, deployment model, and governance even when technical value
      looks strong.
    claimRefs: ["CU008", "CU009", "CU010", "CU011", "CU012", "CU013"]
    figureRefs: ["FU001"]
