  - id: "FR001"
    title: "Risk heatmap"
    type: "matrix"
    summary: >-
      Residual exposure clusters around benchmark credibility, governance, and financing opacity
      more than around a single disclosed legal event.
    data:
      columns:
        - label: "Likelihood"
          detail: "Probability of the risk surfacing in the next 12 months based on retained public evidence."
        - label: "Impact"
          detail: "Potential damage to uptime, customer trust, or investability if the risk manifests."
        - label: "Mitigation maturity"
          detail: "How concrete today's public mitigation evidence is."
        - label: "Residual severity"
          detail: "Post-mitigation judgment after considering cited mitigations and gaps."
      rows:
        - label: "Accuracy / benchmark risk"
          note: "Independent validation is thinner than company performance marketing."
          values:
            - { label: "Medium", note: "Pilots will test this quickly." }
            - { label: "High", note: "Bad RCA or bad actions can deepen incidents." }
            - { label: "Medium", note: "AI Labs and multi-agent design are directionally helpful." }
            - { label: "High", note: "This remains the top residual risk." }
        - label: "Security / compliance proof risk"
          note: "Public control statements exist, but artifact depth is limited."
          values:
            - { label: "Medium", note: "Likely to surface in enterprise diligence." }
            - { label: "High", note: "Can block regulated deployments." }
            - { label: "Low", note: "The retained pool lacks certificate-level evidence." }
            - { label: "High", note: "Still unresolved without audit artifacts." }
        - label: "Integration / tooling dependency risk"
          note: "Resolve's value depends on broad, clean production context."
          values:
            - { label: "High", note: "Integration depth is core to product value." }
            - { label: "Medium", note: "Failures usually degrade quality more than legality." }
            - { label: "Medium", note: "The company explains the dependency but not a universal fix." }
            - { label: "Medium", note: "Manageable, but highly environment-specific." }
        - label: "Valuation / financing opacity risk"
          note: "Public operating disclosure lags the 2026 valuation step-up."
          values:
            - { label: "Medium", note: "Shows up when sizing downside or next-round risk." }
            - { label: "High", note: "Weak unit economics would matter at the current mark." }
            - { label: "Low", note: "Fresh capital helps, but does not solve transparency." }
            - { label: "High", note: "A premium mark without public unit metrics stays risky." }
        - label: "Reference-customer concentration risk"
          note: "Public proof leans on a relatively short list of marquee enterprises."
          values:
            - { label: "Medium", note: "Shows up when a few flagship deployments carry most of the proof burden." }
            - { label: "Medium", note: "A lost reference hurts sales momentum more than product legality." }
            - { label: "Medium", note: "Breadth across several logos helps, but does not eliminate concentration." }
            - { label: "Medium", note: "Manageable, but still material for perception and roadmap pressure." }
        - label: "Regulated-buyer diligence gap"
          note: "Marketing reaches regulated buyers faster than the public artifact set does."
          values:
            - { label: "Medium", note: "Likely to surface in enterprise procurement." }
            - { label: "Medium", note: "Usually blocks sales or expansion rather than causing outages." }
            - { label: "Low", note: "The retained pool lacks certificate-level mitigation evidence." }
            - { label: "Medium", note: "Residual risk stays open until buyer-side packets are reviewed." }
    approximationNotes: >-
      Heatmap cells are analyst judgments synthesized from cited sources, not source-published
      scores or probabilities.
    claimRefs: ["CR005", "CR006", "CR007", "CR008", "CR009", "CR011", "CR012"]
callouts:
  - calloutType: "risk"
    title: "Benchmark credibility is the gating risk"
    body: >-
      Resolve's public story is strongest on ambition and customer anecdotes, but the assigned pool
      still leaves the headline accuracy and MTTR claims mostly un-audited by neutral third
      parties.
    claimRefs: ["CR006", "CR007"]
  - calloutType: "risk"
    title: "Compliance proof is thinner than enterprise positioning"
    body: >-
      Public materials point in the right direction on data handling and regulated-enterprise
      posture, but they do not yet replace a real diligence packet with current reports,
      certificates, and action-control evidence.
    claimRefs: ["CR004", "CR008"]
  - calloutType: "recommendation"
    title: "Kill criteria should stay measurable"
    body: >-
      Ask for independent incident-benchmark data, current security artifacts, and operating metrics
      that justify the 2026 valuation step-up; if any of those three packets is weak, the thesis
      should downgrade quickly.
    claimRefs: ["CR006", "CR008", "CR009", "CR010"]
