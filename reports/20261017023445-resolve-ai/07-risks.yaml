company:
  name: "Resolve AI"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    Resolve AI's biggest residual risk is not a disclosed legal event but the gap between bold
    autonomous-operations claims and still-thin independent proof of accuracy, guardrails, and
    security depth. The 2026 step-up from a $1B Series A narrative to a $1.5B post-money mark
    raises the cost of any miss on benchmark credibility, integration quality, or enterprise
    compliance diligence.
sections:
  - id: "ranked-risk-picture"
    title: "Top residual risk is product-proof plus control quality"
    body: >-
      The retained public evidence points to a classic agentic-ops asymmetry: Resolve wants to be
      trusted with on-call investigations and increasingly autonomous operating work, but the
      strongest public proof still leans on company-authored claims and customer anecdotes.
      Official materials say the product goes on-call for engineers, background agents inspect
      deployments continuously, and production-grade AI SREs can investigate alerts in minutes.
      The clearest independent check in the assigned pool is Marketing Scoop's caution that the
      reported more-than-2x root-cause improvement came from internal evaluation sets rather than a
      neutral third-party benchmark. That does not invalidate the thesis, but it leaves accuracy,
      false-positive, and control-boundary risk as the highest residual exposure because a wrong
      action in production can deepen an outage faster than a slow assistant can.
    claimRefs: ["CR001", "CR002", "CR003", "CR006", "CR007"]
    tableRefs: ["TR002"]
    figureRefs: ["FR001"]
  - id: "regulatory-and-governance"
    title: "Compliance posture is directionally positive but publicly under-evidenced"
    body: >-
      Resolve's own documentation says it does not train on customer data and that its controls
      support SOC 2, GDPR, and HIPAA requirements, which is the right directional signal for a
      platform that touches code, telemetry, and incident workflows. However, the assigned public
      evidence stops at high-level assertions and marketing language about operating in regulated
      environments; it does not include current certificate dates, DPA terms, approval boundaries,
      or action-logging detail for autonomous remediation. At the same time, the company's April
      2026 release explicitly acknowledges that production operations require a very high bar for
      accuracy, reliability, and control. That combination makes governance diligence a live risk,
      not a box already closed by public artifacts.
    claimRefs: ["CR004", "CR005", "CR008"]
    tableRefs: ["TR001"]
  - id: "operational-and-dependency"
    title: "Operational delivery depends on integrations, model supply, and reference quality"
    body: >-
      Resolve's upside also defines its dependency stack. The company says useful performance
      requires broad connectivity across code, infrastructure, telemetry, runbooks, wikis, and
      chats, so incident quality will vary with customer integration depth and telemetry hygiene.
      The homepage also says Resolve combines its own domain models with frontier models, implying
      some ongoing exposure to external model-vendor economics or availability even as the company
      invests in proprietary systems. Finally, the public proof pack keeps returning to a short
      list of marquee enterprises and close enterprise collaboration, which is positive for
      credibility but also means reference concentration and roadmap pressure can remain high if a
      few flagship accounts shape perception of product maturity.
    claimRefs: ["CR011", "CR012", "CR013"]
    tableRefs: ["TR003"]
  - id: "financial-downside-and-kill-criteria"
    title: "Financial downside is hard to size from public data alone"
    body: >-
      The financing record shows fast markups, not operating transparency. Forge lists a $1.5B
      post-money valuation and roughly $199.93M total funding after the April 2026 Series A-2,
      while VCTavern described an earlier 2026 Series A at $1B and more than $150M total capital.
      That trajectory suggests strong investor demand, but it also means downside underwriting is
      constrained because the assigned pool does not provide current ARR, burn, gross margin, or
      customer-concentration disclosure. The practical kill criteria are therefore measurable: if
      an independent pilot cannot replicate materially faster RCA with low false positives, if
      security review cannot produce current audit artifacts and action-control logs, or if the
      next financing or internal data packet implies weak revenue efficiency against the 2026 mark,
      the investment case should weaken quickly.
    claimRefs: ["CR006", "CR009", "CR010"]
