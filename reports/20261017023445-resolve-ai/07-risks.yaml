      - ["Capital-market support for a premium valuation", "DST Global, Salesforce Ventures, and prior backers", "Funds growth, GTM expansion, and long-term research", "Public funding narratives climbed from a $1B Series A framing to a $1.5B post-money mark within months", "If growth or efficiency data do not support the mark, the next financing could reset sentiment or terms", "High", "Strong backer set and fresh capital reduce near-term financing stress", "Valuation risk remains material because public operating metrics are still sparse"]
    notes: >-
      This table focuses on dependency surfaces visible in the retained public evidence; it does
      not substitute for a full vendor, customer, or cap-table diligence workstream.
    claimRefs: ["CR009", "CR010", "CR012", "CR013"]
