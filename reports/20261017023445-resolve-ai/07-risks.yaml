      - ["Always-on agents amplify bad decisions when alerts or evidence are noisy", "Official materials extend the promise from triage into background investigations and autonomous or semi-autonomous operating work", "Medium", "High", "Low to Medium", "A wrong suggestion or action can deepen outages before trust is established", "Need approval-boundary evidence, rollback policy, and action-safety controls"]
      - ["Weak integrations or incomplete telemetry degrade investigation quality", "Docs and product pages say Resolve depends on code, infrastructure, telemetry, runbooks, and knowledge sources to reason about incidents", "High", "Medium", "Medium", "Time-to-value and RCA quality may vary materially by environment maturity", "Need deployment evidence from a noisy, multi-tool customer environment rather than only polished references"]
      - ["External model-runtime cost or availability pressure", "Resolve says it combines domain models with frontier models, while AI Labs exists because generic foundation models are still insufficient for production operations", "Medium", "Medium", "Medium", "Model-vendor changes could alter cost, latency, or answer quality", "Need model mix, failover design, and gross-margin sensitivity under different vendor assumptions"]
    notes: >-
      Likelihood and residual judgments synthesize the cited public evidence; they are not incident
      frequencies or audited loss rates.
