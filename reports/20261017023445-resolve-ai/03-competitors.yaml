company:
  name: Resolve AI
chapter:
  number: 3
  title: Competitors
  summary: >-
    Retained 2026 evidence shows Resolve competing less as a generic incident-management tool and more as an
    autonomy-first AI SRE: its own materials promise autonomous incident handling and faster MTTR, while competitor
    and analyst sources frame the buying decision around how much action a team will delegate versus how much pricing,
    deployment, and workflow control it needs. The hardest competitive pressure does not come from one clone; it comes
    from safety-first peers, incumbent workflow stacks, observability-native add-ons, and self-hosted alternatives
    that reduce procurement risk.
sections:
  - id: competitive-set
    title: Competitive set spans direct agents, incumbents, and substitutes
    body: >-
      The retained public pool does not show a single clean head-to-head market. Instead, Resolve is pulled into four
      overlapping buying sets: direct AI SRE agents such as Cleric and Traversal; observability-native helpers such as
      Datadog Bits AI; workflow-first incident platforms such as incident.io, Rootly, and PagerDuty; and
      self-hosted/Kubernetes-oriented substitutes such as NudgeBee and Metoro. Tracxn's ranked competitor list also
      brings BigPanda into view, which reinforces that buyers can treat the job either as autonomous investigation, as
      incident-workflow software, or as alert-correlation/AIOps. The status quo substitute is still a manual or
      rule-based stack rather than another agent: incident.io explicitly separates chatbots and rule-based automation
      from agentic investigation, which means Resolve is often competing against "keep the current on-call stack and
      add incremental automation" rather than only against a pure-play peer.
    claimRefs: [CP004, CP007, CP009, CP010, CP014, CP015]
    tableRefs: [TP001]
  - id: autonomy-vs-control
    title: Resolve differentiates on autonomy, but that also defines the trust hurdle
    body: >-
      Resolve's own materials repeatedly push the company toward the aggressive end of the category. The homepage says
      the product "goes on-call" and autonomously resolves incidents, while the glossary describes an AI SRE as an
      autonomous agent that detects, investigates, and resolves production incidents and says autonomy should expand as
      trust is earned. Wetheflywheel's comparison reaches the same conclusion from the outside, calling Resolve one of
      the few tools that treats supervised production write actions as a core product posture rather than a distant
      roadmap item. That gives Resolve a differentiated wedge against workflow-centric alternatives, but it also means
      its main competitive risk is not feature parity; it is buyer willingness to let an agent act in production. The
      company is trying to reinforce that edge with enterprise proof points, 5x-faster-MTTR marketing, and the AI
      Labs roadmap focused on domain-specific models, evaluation, and governance.
    claimRefs: [CP001, CP002, CP003, CP005, CP006, CP016]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: procurement-tradeoffs
    title: Incumbent distribution, deployment control, and public pricing are the main counterweights
    body: >-
      The strongest reasons to buy something other than Resolve in the retained pool are operational, not ideological.
      incident.io says buyers pressure-test integration depth, full lifecycle coverage, and pricing transparency before
      committing to a category-new AI SRE. Sherlocks and NudgeBee push a different objection set: private deployment,
      read-only or approval-gated action models, and easier fit with security-conscious or data-residency-sensitive
      environments. Datadog Bits AI and PagerDuty take still another angle, because they let a buyer keep an existing
      telemetry or on-call system of record rather than adding a standalone agent. In practice, that means Resolve's
      autonomy premium has to outweigh both the switching friction of a new tool and the procurement comfort of a
      bundle, especially because multiple comparison pages highlight that public pricing remains less transparent than
      at several alternatives.
    claimRefs: [CP008, CP011, CP012, CP013, CP015]
    tableRefs: [TP003]
  - id: durability-and-gaps
    title: Durability depends on model accuracy and enterprise proof, but the public benchmark set is weak
    body: >-
      The best public evidence for Resolve's moat today is still narrative rather than independently benchmarked
      performance. Company-issued material says the product is running in production at large enterprises and that the
      new AI Labs effort is aimed at model, evaluation, and governance depth, which is strategically sensible if the
      category gets commoditized at the interface layer. But most retained competitive comparisons are vendor-authored,
      self-interested, or both, and they rarely use a common benchmark for RCA accuracy, rollback quality, false
      positives, or safe autonomous action. That leaves two competing interpretations alive at once: Resolve may be
      ahead because it is willing to own supervised action earlier than peers, or procurement may compress the category
      toward lower-risk workflow, incumbent, or self-hosted options until independent evidence proves the autonomy
      advantage.
    claimRefs: [CP003, CP005, CP008, CP011, CP012, CP016]
