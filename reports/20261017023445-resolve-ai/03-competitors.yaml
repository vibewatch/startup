      - ["Deployment / data-control model", "Public self-hosted or VPC option not confirmed in retained evidence", "Not stated in retained public evidence", "Runs inside Datadog's platform context", "Not stated in retained public evidence", "Self-hosted / readable-source positioning in retained evidence"]
