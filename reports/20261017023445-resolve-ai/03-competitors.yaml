      - ["Commercial posture", "Public list pricing not retained", "Starter / Team / Pro prices cited publicly in retained evidence", "Metered AI credits on top of Datadog usage", "Seat-priced and AI tier-gated", "Public self-hosted and per-cluster pricing cited in retained evidence"]
      - ["Typical best-fit buyer", "Large engineering org willing to trial an autonomy-first agent", "Teams that want AI investigation but lower production-action risk", "Organizations already standardized on Datadog", "Teams that primarily need incident workflow and communications", "Teams that cannot send incident data to a third-party cloud"]
    notes: >-
