      - [Cleric, "$100/month Starter; $600/month Team; $2,000/month Pro", "Autonomous investigation with human-gated remediation in retained comparison evidence", "Quoted in a competitor-authored summary rather than a retained Cleric pricing page", "Transparent headline pricing helps smaller teams screen faster"]
      - [incident.io, "$19-25/user/month Team; AI SRE on Pro or Enterprise", "Slack-native incident management with AI investigation", "Enterprise pricing is custom and AI requires higher tiers", "Compelling if incident.io already owns the workflow budget"]
      - [Datadog Bits AI, "$500 for 500 AI credits per month", "AI investigation layered into Datadog telemetry", "Economics depend on pre-existing Datadog spend and investigation volume", "Best as an incremental add-on, not a greenfield tool"]
      - [PagerDuty, "Free; $25/user/month Pro; $49/user/month Business; Enterprise custom plus metered AI Actions", "Paging, escalation, and AI-assisted automation", "Cost has both seat and automation dimensions", "Breadth can beat best-of-breed autonomy when a team values incumbent workflow continuity"]
      - [Metoro, "Hobby free; Scale $20/node/month; Enterprise custom", "Kubernetes-first investigation with PR-based remediation", "Best fit is infrastructure-centric rather than broad incident workflow", "Useful substitute for teams whose competitive lens is cluster operations more than cross-stack incident response"]
      - [NudgeBee, "Free self-hosted; two clusters free on Cloud SaaS; Team $1.5K-3K per cluster/month; Enterprise $100K+", "Self-hosted and approval-gated execution across multi-cloud and Kubernetes", "Quoted in a competitor-authored summary and paired with a smaller public reference base", "Strong control-oriented alternative if private deployment is mandatory"]
    notes: >-
      Pricing rows summarize only retained public comparison evidence; they are useful for screening alternatives, but
      they are not substitutes for vendor quotes, realized discounting, or usage-based economics in diligence.
    claimRefs: [CP008, CP012, CP013]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: Resolve sits at the autonomy-heavy end of the public field, while the strongest substitutes win on control, incumbent stack leverage, or workflow ownership.
    data:
      xAxis:
        label: Autonomy and willingness to act in production
        min: 1
        max: 5
        lowLabel: Workflow / human-led
        highLabel: Supervised remediation / autonomy-first
        scale: ordinal
      yAxis:
        label: Operational fit under control or existing-stack constraints
        min: 1
        max: 5
        lowLabel: Net-new SaaS purchase
        highLabel: Self-hosted or incumbent-stack leverage
        scale: ordinal
      points:
        - label: Resolve AI
          x: 5
          y: 2
          note: "Autonomy-first positioning and enterprise proof points are strong, but retained public evidence does not confirm public pricing or a private-deployment option."
        - label: Cleric
          x: 3
          y: 3
          note: "Read-only safety posture lowers trust friction; self-hosting is not confirmed in the retained set."
        - label: Traversal
          x: 3
          y: 3
          note: "Competes as an enterprise AI SRE peer with accuracy-first framing, but retained deployment detail is sparse."
        - label: Datadog Bits AI
          x: 2
          y: 4
          note: "Lower-action posture, but strong fit for teams that already run Datadog as the telemetry and workflow base."
        - label: incident.io
          x: 2
          y: 3
          note: "Workflow-first and Slack-native; best competitive fit when incident coordination matters more than autonomous action."
        - label: PagerDuty
          x: 2
          y: 4
          note: "Incumbent on-call distribution raises fit for existing PagerDuty estates despite a less autonomy-first story."
        - label: NudgeBee
          x: 4
          y: 5
          note: "Self-hosted, approval-gated execution and public pricing maximize control for teams with data-residency requirements."
    approximationNotes: >-
      Coordinates are ordinal synthesis scores derived from retained public evidence on action model, deployment
      control, pricing transparency, and incumbent-stack leverage; they are not measured market-share or performance
      metrics.
    claimRefs: [CP006, CP007, CP011, CP012, CP013]
callouts:
  - calloutType: insight
    title: Autonomy is the main wedge
    body: >-
      The retained pool repeatedly sorts vendors by whether they investigate only, guide humans, or take supervised
      action in production. Resolve's strongest public differentiation is that it embraces the last category earlier
      and more explicitly than most peers.
    claimRefs: [CP001, CP002, CP006, CP007]
  - calloutType: risk
    title: Control-oriented buyers have credible off-ramps
    body: >-
      Resolve does not need a perfect feature clone to lose a deal. Datadog and PagerDuty can win on incumbent-stack
      leverage, incident.io can win on workflow ownership, and self-hosted alternatives can win on data residency and
      action control before the buyer ever benchmarks autonomous remediation depth.
    claimRefs: [CP008, CP011, CP012, CP013, CP014]
  - calloutType: recommendation
    title: Ask for benchmark and commercial proof, not just the autonomy pitch
    body: >-
      Before underwriting an autonomy premium, diligence should request independently reviewable RCA and remediation
      benchmarks, confirmed deployment options, and realized commercial terms. The retained public set is strong on
      positioning language and weak on comparable proof.
    claimRefs: [CP003, CP005, CP008, CP012]
