      - number: '7.4'
        title: 仅凭公开数据难以量化财务下行风险
        blocks:
          - type: paragraph
            body: >-
              融资记录显示估值快速上调，而非运营透明度提高。Forge 列出 2026 年 4 月 A-2 轮后 $1.5B 的投后估值和约 $199.93M 累计融资；VCTavern 则将更早的 2026 年 A 轮描述为
              $1B 估值、累计资本超过 $150M。这条轨迹显示投资需求强，但也说明 下行评估受到限制，因为指定资料池没有当前 ARR、烧钱、毛利率或客户集中度披露。因此，实际的退出标准是可测的：如果独立
              试点无法在低误报下复现明显更快的 RCA；如果安全审查无法提供当前审计材料和操作控制日志；或下一轮融资、内部数据包暗示 相对于 2026 年估值收入效率很弱，投资论点就应迅速走弱。
            claimRefs:
              - CR006
              - CR009
              - CR010
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 基准可信度是闸门风险
            body: Resolve 的公开故事在雄心和客户案例上最强，但指定资料池仍显示，标题级准确率和 MTTR 主张大多没有中立第三方审计。
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
          - type: callout
            title: 合规证明薄于企业定位
            body: 公开材料在数据处理和受监管企业姿态上方向正确，但尚未以当前报告、证书和操作控制证据替代真正的尽调材料包。
            calloutType: risk
            claimRefs:
              - CR004
              - CR008
          - type: callout
            title: 退出标准应保持可测量
            body: 要求独立事故基准数据、当前安全材料和能够支撑 2026 年估值跃升的运营指标；这三套材料中只要有一套薄弱，论点就应迅速下调。
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR008
              - CR009
              - CR010
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资证据清楚；价格支撑不足
        blocks:
          - type: paragraph
            body: >-
              Resolve AI 在 2026 年 2 月宣布以 $1.0B 估值完成 $125M 非混合 A 轮，4 月又宣布以 $1.5B 估值完成 $40M 扩展轮。 Forge
              独立展示了后者的投后估值，并报告累计融资 $199.93M，大体印证了融资规模。因此，在同一融资序列中，公开 估值标记上升了 50%，而扩展轮只新增 $40M
              主要资本。这种加速是价格信号，不等于创造了同等规模的经营价值。公开财务 参考还存在内部不可靠：Business 2.0 报告 2025 年 12 月 ARR 约 $4M；Multiples.vc 则列出 2026
              年 4 月“收入”$360M，同时说明该字段可能指按运行率折算的收入或 LTM 收入。收入不等于 ARR，期间也不同，且两个数字都不是公司审计披露，因而都无法支撑可辩护的收入倍数。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
