        title: 展示项
        blocks:
          - type: callout
            title: 预算归属由可靠性驱动，而非席位驱动
            body: 有支撑的买方路径通向已经负责 uptime、on-call 和平台预算的工程领导，而不是面向每位开发者的广泛生产力采购。
