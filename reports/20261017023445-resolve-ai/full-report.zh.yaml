        - 公司材料强调人工控制、评估系统和护栏。
        - 覆盖代表性事故的独立生产基准和安全证据。
    notes: 客户结果和技术能力均由公司发布；指定证据池中没有独立群组或基准。
    claimRefs:
      - CV005
      - CV007
      - CV009
      - CV010
      - CV011
      - CV012
      - CV016
  - id: TV003
    title: 乐观、基准和悲观情景
    columns:
      - 情景
      - 假设
      - 估值与回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 经验证的净扩张、可持续毛利率、可复制的企业部署和安全自主能力。
        - 只有当未来经济性显著超过成熟上市软件公司的参考水平时，$1.5B 估值才站得住。
        - 在独立验证的群组和财务数据可得前，概率为低。
        - 客户验证或安全基准失败。
      - - 基准
        - 已点名企业继续采用，但财务透明度和自主能力证据改善缓慢。
        - 没有站得住脚的数值回报区间；应协商按里程碑定价，或暂缓。
        - 与当前混杂的证据最一致。
        - 增长、留存或毛利率低于管理层计划。
      - - 悲观
        - 商业转化放缓、自主能力仍受限，或私募市场倍数收缩。
        - 此前 $1.0B 估值不是底线；损失严重程度取决于未披露的优先权和稀释条款。
        - 如果下一轮融资需要价格保护或更低的实际价格，概率上升。
        - 下轮降价融资、续约疲弱，或无法证明安全修复能力。
    notes: 由于缺少经验证的收入、利润率、留存、烧钱和股权结构数据，情景概率和估值区间有意保持定性。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV008
      - CV010
      - CV011
      - CV012
      - CV015
      - CV016
