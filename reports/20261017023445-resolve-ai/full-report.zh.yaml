      - number: '4.3'
        title: 资本获取能力强，但资本充足性仍不透明
        blocks:
          - type: paragraph
            body: >-
              Resolve 的融资历史显示出异常强的资本获取能力。公司在 2026 年 4 月宣布以 $1.5B 估值完成 $40M A 轮扩展轮，市场数据 追踪者则将扩展轮后的累计融资额集中在超过 $190M 至约
              $200M。来源还显示，扩展轮是在约 $125M、$1B 估值的 A 轮之后 完成的，因此估值在很短时间内大幅上升。这条轨迹显示投资人胃口强，也可能意味着他们对客户采用有较高信心，但不能证明
              公司已经自我造血，甚至不能证明已接近盈亏平衡。

              公开披露暗示，新资本用于扩展平台、扩大市场拓展能力和资助 Resolve AI Labs，而不是从成熟软件基础中收割现金流。 Tracxn 列出截至 8 月下旬有 168 名员工，产品叙事和 Labs
              发布也都暗示模型开发、集成和治理需要大量投入。这更像一家 在购买时间和战略位置的公司，而不是一家披露充分、可以评估烧钱或现金续航期的公司。没有现金余额、烧钱、债务和营运资本
              数据，资本结构看起来充裕，但仍无法量化。
