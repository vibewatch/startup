      - number: '3.3'
        title: 既有厂商分发、部署控制和公开定价是主要反作用力
        blocks:
          - type: paragraph
            body: >-
              在保留的资料池中，选择 Resolve 以外方案的最强理由是运营层面的，而不是意识形态层面的。incident.io 称，买方在 承诺采用全新 AI SRE
              品类之前，会仔细测试集成深度、完整生命周期覆盖和定价透明度。Sherlocks 和 NudgeBee 则提出另一套反对理由：私有部署、只读或审批门控的操作模式，以及更适合重视安全或数据驻留的环境。Datadog
              Bits AI 和 PagerDuty 又提供另一条路径，因为它们允许买方保留现有遥测或 on-call 系统作为事实记录，而不必新增独立智能体。归根结底，Resolve
              的自主性溢价必须同时抵消新工具的切换摩擦和套件采购的便利，尤其是多份比较页面都指出，其公开价格仍不如若干替代方案透明。
            claimRefs:
              - CP008
              - CP011
              - CP012
              - CP013
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP012
