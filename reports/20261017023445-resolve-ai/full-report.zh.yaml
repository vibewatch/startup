              - CV004
              - CV005
              - CV007
              - CV008
              - CV016
      - number: '8.2'
        title: 企业证明抵消了投资评估风险，但没有消除它
        blocks:
          - type: paragraph
            body: >-
              最强的论点证据来自运营，而非财务。Resolve AI 将 Coinbase、DoorDash、MongoDB、MSCI、Salesforce 和 Zscaler 列为用户， 并报告 Coinbase
              关键事故调查时间减少 72%、Zscaler 每次事故所需工程师减少 30%。这些是有意义的采用信号，但仍是公司
              发布的主张，而非独立测量的客户队列。反方论点是，当前估值已在公开证据证明经常性收入、留存、毛利率、烧钱、客户集中度和
              可重复单位经济之前，提前计入了品类领导地位。官方材料还称，生产智能体需要针对环境推理，Resolve AI Labs 必须建设领域
              模型、评估系统、治理和护栏。这项计划可以加深护城河，但也明确了一个前提：在更高自主性的生产运营能够安全规模化之前， 这项技术工作必须成功。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV016
      - number: '8.3'
        title: 情景纪律需要里程碑，而不是虚假的精确度
        blocks:
          - type: paragraph
            body: >-
              公开可比公司不足以支持点估计。Multiples.vc 列出 PagerDuty 的 LTM EV / 收入倍数为 2.5x、Beijing Ultrapower 为 1.9x，但 Resolve AI
              没有经验证的分母，并且在阶段、增长画像、产品范围和流动性上存在重大差异。套用这些倍数会制造证据不支持的精确度。乐观情景需要独立验证的扩张、持久利润率和安全自主修复；基准情景假定企业采用继续，但财务
              可见性仍不完整；悲观情景则结合转化放慢、技术控制限制和私募市场倍数压缩。此前 $1.0B 的融资估值是历史交易参考，不是下行底价；$1.5B 估值是进入约束，也不是独立观察到的二级市场成交价。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.4'
        title: 建议与决策闸门
        blocks:
          - type: paragraph
            body: >-
              建议是继续研究，信心中等、风险高，估值偏高。Resolve AI 拥有融资能力、知名企业参考客户和成为品类领导者的合理路径，
              但公开记录不足以支撑目标回报、持有期或退出价值；否则就必须凭空假设收入和利润率。是否投资应以管理层数据室为条件：对账 ARR
              和确认收入，提供季度增长、毛利率、净留存、烧钱和现金续航期，并提供按客户划分的集中度及续约队列。法律顾问应核实完整优先股堆叠、稀释、参与权、治理和期权池影响，不能只依赖 Forge 展示的 1.0x
              倍数。如果独立客户验证失败、净扩张停滞、无法证明修复安全，或融资要求的价格保护与已公布的标题估值不一致，投资论点就会失效。
            claimRefs:
              - CV002
              - CV003
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV010
              - CV013
              - CV016
