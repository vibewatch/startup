      - number: '7.3'
        title: 运营交付依赖集成、模型供给和参考质量
        blocks:
          - type: paragraph
            body: >-
              Resolve 的上行空间也定义了它的依赖栈。公司称，要取得有用性能，需要广泛连接代码、基础设施、遥测、运行手册、知识库和 聊天，因此事故质量会随客户集成深度和遥测卫生状况变化。主页还称 Resolve
              将自有领域模型与前沿模型结合，意味着即使 公司投入专有系统，仍会持续暴露于外部模型供应商的经济性或可用性。最后，公开证明包始终回到一小批标志性企业和密切的
              企业合作，这有利于可信度，但也意味着如果少数旗舰账户塑造了市场对产品成熟度的认知，参考客户集中度和路线图压力仍可能 很高。
            claimRefs:
              - CR011
