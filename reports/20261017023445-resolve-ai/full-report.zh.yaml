      - number: '4.4'
        title: 财务结论与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              从财务角度看，Resolve AI 具备真实的企业需求、异常强的融资杠杆；如果客户 ROI 故事可以泛化，也有扩大大型合同的
              合理路径。最好的公开证据支持订阅驱动的产品，且产品切入昂贵的运营痛点；客户背书强时，这正是能够支撑估值快速扩张
              的品类。同一批证据也说明，该产品不是低接触度软件销售：高风险操作仍需人工治理，底层技术栈还依赖定制模型、前沿模型、 集成和生产安全控制，而这些东西可能都很昂贵。

              投资评估的阻塞点不是业务是否存在，而是公开记录是否足够详细，能够判断业务质量。经审阅来源足以显示商业势头，但不足以
              确定实际定价、合同期限、扩张集中度、利润率或现金续航期。严肃的尽调应将当前估值视为商业上合理、但财务证据不足，直到 管理层提供按客户队列划分的收入数据、成本结构细节和资本充足性材料。
            claimRefs:
              - CI011
              - CI012
              - CI015
              - CI016
