            body: >-
              Resolve 不需要输在功能完全相同才能丢单。Datadog 和 PagerDuty 可以靠既有技术栈优势取胜，incident.io 可以靠工作流
              归属取胜，自托管替代方案则可以在买方测试自主修复深度之前，凭数据驻留和操作控制取胜。
