      - number: '4.2'
        title: 公开商业牵引真实存在；单位经济仍主要属于私人信息
        blocks:
          - type: paragraph
            body: >-
              Resolve 的商业证明在客户结果上强于传统 SaaS 指标。公司主页声称 MTTR 提速 5 倍、单项任务成本下降；术语表页面和 独立报道则提到具体客户案例，包括 Coinbase 调查关键事故的时间减少
              72%，以及 Zscaler 或另一家企业安全部署中每次 事故所需工程师减少 30%。这些都是有意义的价值信号，因为它们直接对应人工成本、停机时长和运营风险。它们也解释了
              为什么独立报道称该产品已经拿下规模可观的企业 ACV。

              问题在于，公开的结果案例不等于披露的单位经济。Multiples 和 EntrepreneurLoop 都称，A 轮前后 ARR 约为 $4M，这说明
              相对于估值，公司仍处于早期。经审阅的来源没有披露毛利率、托管或推理成本、服务投入强度、CAC、销售周期、回本期、 NRR 或集中度。因此，公开证据支持需求和买方支付意愿，却不足以按投资人评估 $1B
              以上公司时通常采用的方式判断收入 质量或利润率持久性。
