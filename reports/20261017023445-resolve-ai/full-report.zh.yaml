      - number: '3.4'
        title: 持久性取决于模型准确率和企业证明，但公开基准薄弱
        blocks:
          - type: paragraph
            body: >-
              如今关于 Resolve 护城河的最佳公开证据仍是叙事，而非独立基准测试的性能。公司材料称产品已经在大型企业生产环境中运行，新 AI Labs
              旨在加深模型、评估和治理能力；如果该品类的接口最终商品化，这一战略是合理的。但保留的多数竞争比较由厂商撰写，带有自身利益，或两者兼具，而且很少采用统一基准衡量 RCA 准确率、回滚质量、误报或安全自主操作。
              两种相互竞争的解释仍同时成立：Resolve 可能领先，因为它比同行更早愿意承担受监督的操作；也可能是采购会将该品类压向风险更低的工作流、既有厂商或自托管方案，直到独立证据证明自主性优势。
            claimRefs:
              - CP003
              - CP005
              - CP008
              - CP011
              - CP012
              - CP016
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 自主性是主要切入口
            body: 保留的资料池反复按厂商是仅调查、指导人类，还是在生产环境中执行受监督操作来分类。Resolve 最强的公开差异在于， 它比多数同行更早、也更明确地拥抱最后一种模式。
            calloutType: insight
