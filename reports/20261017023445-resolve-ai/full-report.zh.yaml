  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争集合覆盖直接智能体、既有厂商与替代方案
        blocks:
          - type: paragraph
            body: >-
              保留的公开资料没有呈现一个清晰的正面竞争市场。相反，Resolve 同时进入四组重叠的采购集合：Cleric 和 Traversal 等直接 AI SRE 智能体；Datadog Bits AI
              等原生可观测性助手；incident.io、Rootly 和 PagerDuty 等工作流优先的事故平台；以及 NudgeBee 和 Metoro 等面向自托管 / Kubernetes 的替代方案。Tracxn
              的竞争者排名还将 BigPanda 纳入视野，进一步说明买方可以把这项工作理解为自主调查、事故工作流软件，或告警关联 / AIOps。现状替代方案仍是人工或基于规则的技术栈，
              而非另一个智能体：incident.io 明确将聊天机器人和规则自动化与智能体调查区分开来。Resolve 面对的竞争选择往往是“保留现有 on-call 技术栈、再加一点自动化”，而不只是纯同类产品。
            claimRefs:
              - CP004
              - CP007
              - CP009
              - CP010
              - CP014
              - CP015
