              保留的公开证据指向典型的智能体运营不对称：Resolve 希望获得调查 on-call 并逐步自主运营的信任，但最强的公开证明仍依赖
              公司撰写的主张和客户案例。官方材料称产品替工程师值班，后台智能体持续检查部署，生产级 AI SRE 可以在几分钟内调查告警。 指定资料池中最清晰的独立核验来自 Marketing
              Scoop，其提醒称报告中的根因准确率提升超过 2 倍来自内部评估集，而非中立第三方 基准。这并不否定论点，但使准确率、误报和控制边界成为最高的剩余风险：生产环境中的错误操作可能比缓慢的助手更快加剧 一次中断。
