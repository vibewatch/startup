  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相邻品类
        blocks:
          - type: paragraph
            body: >-
              指定证据集始终将 Resolve AI 的市场定义为部署后的运营软件，而非软件创建。主页、术语表、2 月融资公告和独立资料
              反复描述的工作流都是：在实时生产系统内分流告警、调查事故、分析根因并修复。这一定位很重要，因为它将相关支出 池收窄到平台工程、SRE、事故响应和可观测性工作流中已经存在的生产运营预算，而不是把公司当作通用 AI
              助手。相邻 品类包括编程助手和独立可观测性产品：两者都可替代其中一部分工作流，但来源反复将它们描述为部署前或数据呈现层，
              而非生产环境中的自主操作者。这个边界足以支撑品类逻辑，但证据池没有独立分析师分类法，证明买方已经把该产品预算 成稳定、独立的软件科目。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM010
      - number: '2.2'
        title: 受证据约束的市场规模与买方分层
        blocks:
          - type: paragraph
            body: >-
              现有池子更适合用问题预算视角，而不是软件市场规模视角。术语表引用 Oxford Economics 的数据称，全球 2000 强企业 每年因停机损失超过
              $400B；与公司相关的材料则反复将该品类定位为减少复杂企业环境中的调查时间、MTTR 和运营人员 繁琐工作。这些信号支持一个巨大的经济问题，私募融资也显示投资人愿意为该品类叙事定价，但两者都不能替代可辩护的
              TAM、SAM 或 SOM。同样的限制也适用于客户结果证据：调查时间减少 72%、事故解决速度提升 87%、每次事故所需工程师 减少
              30%，都是有意义的证明点，但它们针对具体客户，未按统一人群或购买分母标准化。因此，最有支撑的分层应从 运营多服务、业务关键软件且已经为可靠性、平台和 on-call
              绩效投入预算的大型企业开始，先向工程领导销售价值，而 不是采用面向广大开发者席位的模式。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM011
              - CM013
