      - number: '7.2'
        title: 合规姿态方向正确，但公开证据不足
        blocks:
          - type: paragraph
            body: >-
              Resolve 自己的文档称不会用客户数据训练模型，其控制措施支持 SOC 2、GDPR 和 HIPAA 要求；对于接触代码、遥测和事故
              工作流的平台，这一方向是对的。不过，指定公开证据停留在高层主张和关于受监管环境运营的营销语言，没有当前证书日期、 DPA 条款、审批边界或自主修复的操作日志细节。同时，公司 2026 年 4
              月发布明确承认，生产运营对准确性、可靠性和控制 有非常高的要求。这一组合说明治理尽调仍是现实风险，而不是已由公开材料关闭的事项。
            claimRefs:
              - CR004
              - CR005
              - CR008
