              - CM008
              - CM013
      - number: '2.3'
        title: 采用驱动因素、预算归属与约束
        blocks:
          - type: paragraph
            body: >-
              指定来源中最强的采用驱动因素是运营复杂度，而不是对 AI 的抽象热情。2 月公告将云环境蔓延、代码频繁变更和部落式 工作流描述为事故难以调查的结构性原因；术语表又补充称，AI
              编程智能体更快地把更多代码送入生产环境，进一步加重 负担。由此可见，买方路径可能由工程副总裁、平台、SRE、信任或基础设施负责人推动，他们用可靠性结果和节省的工程
              时间来证明产品价值。同一批来源也解释了采用速度可能慢于客户标志所暗示的水平：生产环境要求高准确率、治理，以及 对高自主性操作的人为审批；证据池没有独立基准来验证整个品类的根因准确率或安全自主修复。因此，与其把
              Resolve AI 当作拥有可迁移、独立测量 ROI、且已充分验证的自主运营平台，不如将它理解为更容易在大型企业中落地的生产力与可靠性 切入口。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM009
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM009
