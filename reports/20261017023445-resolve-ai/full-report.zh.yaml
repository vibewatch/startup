        title: 身份与产品定位
        blocks:
          - type: paragraph
            body: >-
              Resolve AI 将自己定位为运行生产软件的 AI 平台，而不是通用编程副驾驶。公司主页称其“代表你值班并自主解决 事故”；2026 年 2
              月融资公告则描述了一套跨越代码、基础设施和遥测数据的多智能体系统，用于分流告警、调查事故并 帮助工程师在生产环境中采取行动。第三方资料基本印证了这一定位，称该平台参与值班轮换、调查事故，并生成脚本或
              拉取请求等运营产出。因此，身份层面的证据方向一致：Resolve AI 销售的是面向企业工程团队的自主或半自主生产运营 软件，而不是覆盖面广的横向企业 AI 工作流工具。
