  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现证据
        blocks:
          - type: paragraph
            body: >-
              公开记录支持这是一项面向大型企业运营团队的软件订阅业务，但记录仍很薄，不能算完整投资评估材料。Resolve AI 自己的网站将产品描述为会接管值班、操作生产工具并改善可靠性结果的 AI SRE
              平台；NeuronFeed 只列出“企业版 + 免费试用” 的定价，没有公开标价或席位档位。这一组合指向高接触度的落地路径：可能先通过试点或价值验证，若平台确实减少生产
              环境中的事故琐事，再扩大企业合同。公开来源没有显示价格卡、标准合同期限，也没有说明收入按工作负载、环境，还是 全平台订阅确认。

              最强的变现信号不是标价，而是已报道的合同规模和买方质量。EntrepreneurLoop 称 Resolve 已经拿下六位数后段和七位数 前段的 ACV；公司也反复将
              Coinbase、DoorDash、MongoDB、MSCI、Salesforce 和 Zscaler 列为生产客户。这与价值销售比
              透明包装更重要的品类一致：买方付费是为了压缩调查时间、减少每次事故涉及的工程师数量，并吸收运营复杂度。结果是 一个可信的订阅收入故事，但还不是可披露的定价架构，也不能据此交叉验证实际净价格。
