      - number: '3.2'
        title: Resolve 以自主性形成差异，但这也定义了信任门槛
        blocks:
          - type: paragraph
            body: >-
              Resolve 自己的材料反复将公司推向品类中更激进的一端。主页称产品会“接管值班”并自主解决事故；术语表将 AI SRE
              定义为能够检测、调查并解决生产事故的自主智能体，并称应随着信任建立而扩大自主范围。Wetheflywheel 的外部比较也 得出相同结论，称 Resolve
              是少数将受监督的生产写操作视为核心产品定位、而不是遥远路线图项目的工具之一。这使 Resolve 相对于工作流型替代品拥有差异化切入口，但也意味着主要竞争风险不是功能是否齐全，而是买方是否愿意让智能体
              在生产环境中行动。公司正用企业证明点、5 倍更快 MTTR 的营销，以及聚焦领域模型、评估和治理的 AI Labs 路线图来 加固这一优势。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
