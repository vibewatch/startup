  - id: FM001
    title: 受证据约束的 AI SRE 采用压力视角
    type: pyramid
    summary: 指定证据池支持用问题与结果叠加的代理指标衡量市场压力，但不足以构建站得住脚的 TAM / SAM / SOM。
    data:
      nodes:
        - label: 停机暴露
          value: $400B+
          note: 词汇表引用的全球 2000 强企业年度停机成本代理指标。
          claimRefs:
            - CM007
        - label: 事故负载环境
          value: Thousands
          unit: alerts per week
          note: 词汇表称，典型云原生应用每周会产生数千条告警。
          claimRefs:
            - CM004
            - CM007
        - label: 企业证明点
          value: 150,000
          unit: alerts
          note: 词汇表称 Zscaler 处理了超过 150,000 条告警。
          claimRefs:
            - CM006
            - CM008
        - label: 调查基线
          value: 100%
          unit: of alerts
          note: 词汇表称生产级 AI SRE 能调查 100% 的告警。
          claimRefs:
            - CM002
            - CM008
        - label: 客户结果区间
          value: 72%-87%
          unit: faster investigation / resolution
          note: 词汇表和 Agent Unfolded 简介引用的客户案例。
          claimRefs:
            - CM008
        - label: 主页性能声明
          value: 5x
          unit: faster MTTR
          note: 公司主页关于生产影响的声明。
          claimRefs:
            - CM008
    approximationNotes: 本图不是 TAM / SAM / SOM 模型。由于指定的独立来源没有成功提供市场规模方法或全品类自主修复准确率基准，本图仅可视化证据池中最强的需求和 ROI 代理指标。
    claimRefs:
      - CM004
      - CM007
      - CM008
      - CM013
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: Resolve 位于公开市场中自主性较强的一端，而最强替代方案靠控制力、既有技术栈杠杆或工作流主导权取胜。
    data:
      xAxis:
        label: 自主性与生产环境行动意愿
        min: 1
        max: 5
        lowLabel: Workflow / human-led
        highLabel: Supervised remediation / autonomy-first
        scale: ordinal
      yAxis:
        label: 控制或既有技术栈约束下的运维适配度
        min: 1
        max: 5
        lowLabel: Net-new SaaS purchase
        highLabel: Self-hosted or incumbent-stack leverage
        scale: ordinal
      points:
        - label: Resolve AI
          x: 5
          'y': 2
          note: 自主优先的定位和企业证明点较强，但保留的公开证据未确认公开定价或私有部署选项。
        - label: Cleric
          x: 3
          'y': 3
          note: 只读安全姿态降低了信任阻力；保留资料未确认支持自托管。
        - label: Traversal
          x: 3
          'y': 3
          note: 以准确率优先的叙事作为企业 AI SRE 同行参与竞争，但保留的部署细节很少。
        - label: Datadog Bits AI
          x: 2
          'y': 4
          note: 行动性较低，但适合已经把 Datadog 作为遥测和工作流基础的团队。
        - label: incident.io
          x: 2
          'y': 3
          note: 工作流优先且原生适配 Slack；当事故协同比自主操作更重要时，竞争适配度最佳。
        - label: PagerDuty
          x: 2
          'y': 4
          note: 尽管自主优先叙事较弱，既有的值班分发能力仍让它适合已经部署 PagerDuty 的客户。
        - label: NudgeBee
          x: 4
          'y': 5
          note: 自托管、审批门控执行和公开定价，为有数据驻留要求的团队提供最大的控制力。
    approximationNotes: 坐标是根据保留公开证据对行动模式、部署控制、定价透明度和既有技术栈杠杆综合得出的序数评分；不是实测的市场份额或性能指标。
    claimRefs:
      - CP006
      - CP007
      - CP011
      - CP012
      - CP013
  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 公开证据表明，Resolve 通过企业评估切入，在事故处理工作量上证明 ROI，再扩大合同范围；由于服务成本未披露，毛利桥接仍然不透明。
    data:
      nodes:
        - id: pain
          label: 生产事故成本
          value: Enterprise engineering toil and outage cost create the budget line
        - id: trial
          label: 免费试用或试点
          value: NeuronFeed lists enterprise pricing with a free trial
        - id: deployment
          label: 生产部署
          value: Coinbase, DoorDash, MongoDB, MSCI, Salesforce, and Zscaler are cited as users
        - id: contract
          label: 年度平台合同
          value: EntrepreneurLoop reports high six- and seven-figure ACVs
        - id: expansion
          label: ROI 证明后的扩张
          value: Outcome anecdotes support wider team and workflow adoption, but no NRR is public
        - id: gp
          label: 毛利仍未验证
          value: Model serving, integrations, and human-governance costs are undisclosed
      edges:
        - from: pain
          to: trial
          label: 买家从运维痛点切入
        - from: trial
          to: deployment
          label: 在真实生产环境证明价值
        - from: deployment
          to: contract
          label: 有可供参考的结果后签订企业合同
        - from: contract
          to: expansion
          label: 更多团队、事故或环境
        - from: expansion
          to: gp
          label: 利润率取决于服务和支持成本纪律
    claimRefs:
      - CI002
      - CI004
      - CI008
      - CI012
      - CI015
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Resolve 在多代理调查核心之上提供多个运维入口，并配有专注于生产专用模型和评估的研究层。
    data:
      layers:
        - label: 交互界面
          detail: 公开产品界面提供的运维入口。
          items:
            - Web 调查界面
            - Slack 或 MS Teams 应用
            - 自然语言生产聊天
        - label: 调查入口
          detail: 系统在日常运维中被触发的方式。
          items:
            - 告警调查
            - 事故频道调查
            - 定时或事件驱动任务
        - label: 多代理推理核心
          modules:
            - 并行专用代理
            - 理论检验与证据链
            - 带引用的动态调查报告
        - label: 运维上下文与操作
          detail: 公开材料称 Resolve 可以检查或触发的输入和操作。
          items:
            - 日志、指标、追踪
            - 部署和 PR
            - 修复触发器与后续任务
        - label: 程序化扩展层
          outputs:
            - REST API
            - Resolve MCP 服务器
            - 集成到更广泛的代理工作流
        - label: 研究与验证基础
          detail: Resolve AI Labs 描述的上游研发层。
          items:
            - 领域专用模型
            - 学习环境
            - 评估与验证系统
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE007
      - CE010
      - CE011
      - CE015
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Resolve 的客户路径似乎从事故痛点开始，扩展到日常运维，随后面临采购和治理审查。
    data:
      nodes:
        - label: 企业事故痛点
          actor: Buyer
          stage: Problem recognition
          touchpoints:
            - High-cost incidents, alert overload, and long RCA cycles
            - Interest in reducing MTTR and war-room staffing
          note: 官方页面始终围绕生产运维和可靠性来阐述价值主张。
        - label: 生产试点
          actor: Buyer + user
          stage: Evaluation
          touchpoints:
            - Evaluate real-incident performance rather than demo-only workflows
            - Check integrations, governance, and human-in-the-loop controls
          note: Resolve 自身的评估指南强调，在扩大推广前要证明战时和常态运维表现。
        - label: 已点名的生产部署
          actor: User
          stage: Initial adoption
          touchpoints:
            - Incident investigation across code, infra, and telemetry
            - DoorDash, Coinbase, Salesforce, and Zscaler appear in production-oriented proof
          note: 当产品与真实生产工作流挂钩，而不是只展示客户 Logo 时，公开证据最有力。
        - label: 日常运维扩张
          actor: User
          stage: Expansion
          touchpoints:
            - On-call readiness, debugging, operational reports, and onboarding
            - Institutional knowledge capture raises switching costs
          note: 官方材料反复描述产品在活跃事故之外的使用，这是最清晰的“落地并扩张”信号。
        - label: ROI 与信任证明
          actor: Buyer
          stage: Internal validation
          touchpoints:
            - 5x faster MTTR, 72% faster investigation, 87% faster resolution, 30% fewer engineers per incident
            - Named outcomes help justify broader deployment if they are reproducible
          note: ROI 叙事很有吸引力，但方法论和客户层面的基线大多未披露。
        - label: 采购与治理阻力
          actor: Buyer / security / finance
          stage: Expansion constraint
          touchpoints:
            - Pricing requires a demo
            - Some buyers may want self-hosting or tighter approval controls
          note: 指定证据池中的主要负面信号集中在采购、部署模式和透明度，而非客户不满。
    claimRefs:
      - CU005
      - CU006
      - CU008
      - CU012
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险更多集中在基准可信度、治理和融资不透明，而不是某个已披露的单一法律事件。
    data:
      columns:
        - label: 可能性
          detail: 根据保留公开证据，风险在未来 12 个月显现的概率。
        - label: 影响
          detail: 风险发生时可能对正常运行时间、客户信任或可投资性造成的损害。
        - label: 缓解措施成熟度
          detail: 当前公开缓解证据的具体程度。
        - label: 剩余严重性
          detail: 考虑所引缓解措施和缺口后的事后判断。
      rows:
        - label: 准确率 / 基准风险
          note: 独立验证比公司的性能营销更薄弱。
          values:
            - label: 中
              note: 试点会很快检验这一点。
            - label: 高
              note: 错误 RCA 或错误操作可能让事故恶化。
            - label: 中
              note: AI Labs 和多代理设计在方向上有帮助。
            - label: 高
              note: 这仍是最高的剩余风险。
        - label: 安全 / 合规证明风险
          note: 有公开控制声明，但材料深度有限。
          values:
            - label: 中
              note: 可能在企业尽调中暴露。
            - label: 高
              note: 可能阻碍受监管部署。
            - label: 低
              note: 保留证据池缺少证书级证据。
            - label: 高
              note: 没有审计材料就仍未解决。
        - label: 集成 / 工具依赖风险
          note: Resolve 的价值取决于广泛且干净的生产上下文。
          values:
            - label: 高
              note: 集成深度是产品价值的核心。
            - label: 中
              note: 失败通常更多损害质量，而不是造成法律问题。
            - label: 中
              note: 公司解释了这种依赖，却没有给出通用解决方案。
            - label: 中
              note: 可管理，但高度依赖具体环境。
        - label: 估值 / 融资不透明风险
          note: 公开经营披露落后于 2026 年估值跃升。
          values:
            - label: 中
              note: 在评估下行空间或下一轮风险时会暴露。
            - label: 高
              note: 在当前估值下，疲弱的单位经济性会造成影响。
            - label: 低
              note: 新资金有帮助，但不能解决透明度问题。
            - label: 高
              note: 没有公开单位指标支撑的溢价估值仍然危险。
        - label: 参考客户集中风险
          note: 公开证明依赖一份相对精简的标杆企业名单。
          values:
            - label: 中
              note: 少数旗舰部署承担了大部分验证责任时，就会出现这种情况。
            - label: 中
              note: 失去一个参考客户，对销售势头的打击大于对产品合法性的影响。
            - label: 中
              note: 覆盖多个客户有助于分散风险，但无法消除集中度。
            - label: 中
              note: 尚可管理，但对市场认知和路线图压力的影响仍然重大。
        - label: 受监管买方尽调缺口
          note: 营销触达受监管买方的速度快于公开材料的完善速度。
          values:
            - label: 中
              note: 很可能在企业采购环节暴露。
            - label: 中
              note: 通常会阻碍销售或扩张，而不是导致服务中断。
            - label: 低
              note: 留存材料中缺少证书级别的缓解措施证据。
            - label: 中
              note: 在审阅买方材料包之前，剩余风险仍未闭合。
    approximationNotes: 热力图单元格是分析师基于所引来源综合得出的判断，并非来源发布的评分或概率。
    claimRefs:
      - CR005
      - CR006
      - CR007
      - CR008
      - CR009
      - CR011
      - CR012
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 决策从强劲的融资和企业信号出发，经过尚未解决的经济性与执行风险，最终进入“继续研究”关口。
    data:
      nodes:
        - id: financing
          label: 融资信号
          value: $1.5B announced post-money mark
          note: 公司公告和 Forge 均对此提供佐证。
        - id: adoption
          label: 企业验证
          value: Named customers and reported incident outcomes
          note: 由公司发布，未经独立基准测试。
        - id: economics
          label: 经济性验证
          value: Not publicly underwritable
          note: 收入相关表述相互冲突，也缺乏一致的指标口径。
        - id: execution
          label: 技术执行
          value: Domain models, evaluation, and guardrails still being expanded
          note: Resolve AI Labs 计划用来满足这些要求。
        - id: price
          label: 入场纪律
          value: No defensible public-data price range
          note: 采用已验证的里程碑和完整融资条款。
        - id: decision
          label: 建议
          value: Research more
          note: 中等信心、高风险、估值偏高。
      edges:
        - from: financing
          to: adoption
        - from: adoption
          to: economics
        - from: economics
          to: execution
        - from: execution
          to: price
        - from: price
          to: decision
    approximationNotes: 该流程是决策顺序，不是量化评分或转化模型。
    claimRefs:
      - CV003
      - CV010
      - CV013
      - CV016
