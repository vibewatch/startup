companyProfile:
  summary: >-
    Resolve AI is a San Francisco-based autonomous AI SRE company founded in 2024 by former Splunk observability leaders
    Spiros Xanthos and Mayank Agarwal. The company sells an AI-for-production platform that goes on-call, investigates
    incidents, drafts remediation work, and now extends that thesis through Resolve AI Labs with domain-specific models
    and agentic systems for complex production environments.
