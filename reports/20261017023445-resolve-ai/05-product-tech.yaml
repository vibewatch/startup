callouts:
  - calloutType: insight
    title: Resolve is selling a production-operations system, not a developer copilot
    body: >-
      The documented product surface spans first-response investigations, live incident
      collaboration, unattended background tasks, and external agent or API access, which puts
      the company closer to autonomous operations infrastructure than to a narrow observability
      add-on.
    claimRefs: [CE001, CE003, CE005, CE010]
  - calloutType: risk
    title: Benchmark credibility still lags the autonomy narrative
    body: >-
      Resolve's strongest technical claim is a more-than-2x improvement in root-cause accuracy,
      but the retained evidence also says the measurement comes from internal evaluation sets and
      is not backed by a public third-party audit, leaving a key diligence gap for production
      trust.
    claimRefs: [CE008, CE009]
