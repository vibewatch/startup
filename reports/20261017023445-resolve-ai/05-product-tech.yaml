    - type: missing-source
      severity: material
      topic: independent-benchmark-validation
      missingEvidence: Public third-party benchmarks or customer-authored case studies validating the claimed 2x root-cause-accuracy gain and five-minute triage performance across representative incident sets.
      whyItMatters: Resolve's core autonomy thesis depends on engineers trusting investigation quality and safe escalation under real production conditions.
      diligencePath: Request benchmark methodology, external validation artifacts, and at least two customer references that can discuss false positives, override rates, and outcome quality.
      relatedQuestionRefs: [QE007]
    - type: private-evidence-only
      severity: material
