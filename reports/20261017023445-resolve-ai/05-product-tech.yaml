company:
  name: Resolve AI
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Resolve AI's public product surface has expanded from alert investigation into a broader
    operating stack that spans live incident collaboration, always-on background agents,
    scheduled tasks, and programmatic MCP/API access. The technical story is differentiated by
    a multi-agent investigation architecture and a new AI Labs effort around domain-specific
    models and evaluation, but the strongest performance claims still rely on company-run or
    company-described benchmarks rather than independent public validation.
sections:
  - id: product-scope-and-operator-jobs
    title: Product scope in the engineering workflow
    body: >-
      Public materials consistently place Resolve AI inside day-two software operations rather
      than general developer productivity. The homepage says the platform "goes on-call on your
      behalf and autonomously resolves incidents," while the product documentation expands that
      promise into alert investigations, ad hoc production chat, incident-channel collaboration,
      scheduled tasks, and programmatic API or MCP access. In workflow terms, the product is
      trying to replace the first-response, evidence-gathering, and coordination work that sits
      between observability alerts and remediation decisions, not just provide summarization on
      top of existing tools.
    claimRefs: [CE001, CE002, CE003, CE004, CE005]
    tableRefs: [TE001, TE002]
  - id: documented-operating-architecture
    title: Documented operating architecture
    body: >-
      The publicly documented architecture has five visible layers. At the edge, engineers can
      interact through the web app, Slack or Teams, or via the REST API and MCP server. Behind
      those surfaces, Resolve runs investigations that keep an evidence trail, develop and rule
      out theories, and produce a report with citations. The May 2026 release and VentureBeat
      coverage both describe a coordinated team of specialized agents that investigates multiple
      hypotheses in parallel and independently verifies conclusions, while the docs show the
      system reaching into logs, dashboards, deployments, and pull requests. Resolve AI Labs is
      the upstream research layer, focused on domain-specific models, long-horizon agents, and
      evaluation or verification systems tuned to production operations.
    claimRefs: [CE006, CE007, CE008, CE010, CE011, CE014, CE015]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-and-differentiation
    title: Maturity, differentiation, and evidence quality
    body: >-
      Resolve's differentiation story is specific enough to underwrite as a real product thesis:
      a production-specific environment model, multi-agent investigation, background agents for
      recurring operational work, and human-supervised escalation toward greater autonomy.
      External coverage supports the existence of that architecture and product expansion, but it
      also narrows the evidentiary strength of the headline performance claims. The reported
      "more than 2x" improvement in root-cause accuracy is explicitly tied to internal evaluation
      sets, not a third-party audit, and the company-described customer outcome anecdotes are
      still selective. That means the product looks materially beyond a basic copilot, yet proof
      of repeatable performance remains shallower than the commercial ambition.
    claimRefs: [CE007, CE008, CE009, CE012, CE013, CE016]
  - id: trust-controls-and-open-gaps
    title: Trust controls, deployment constraints, and open diligence gaps
    body: >-
      Trust and control are central because Resolve aims to influence live production systems.
      The retained evidence does show meaningful guardrail signals: the docs expose an evidence
      trail and inspectable reports, the Labs page frames autonomy as a progression from
      AI-assisted to human-on-the-loop operation, and VentureBeat reports a deployment model
      where inference can run as SaaS or inside a customer VPC. Still, public proof remains thin
      on named security certifications, hard reliability statistics, and the exact approval
      boundaries for automated remediation. For diligence, the key product question is no longer
      whether Resolve has a coherent architecture; it is whether independent proof of safety,
      accuracy, and operational governance will keep pace with the autonomy narrative.
    claimRefs: [CE005, CE009, CE012, CE013, CE014]
