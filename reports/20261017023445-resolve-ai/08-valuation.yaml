artifact: valuation
slug: resolve-ai
runDate: 2026-10-17
company:
  name: Resolve AI
chapter:
  number: 8
  title: Valuation
  summary: >-
    Resolve AI's announced valuation rose from $1.0 billion to $1.5 billion in early
    2026, supported by substantial financing and named-enterprise adoption but not by
    public, decision-grade revenue or cash-flow disclosure. The appropriate stance is
    research-more with medium confidence, high risk, and stretched valuation until
    independently verified economics and full financing terms support a price-sensitive
    return case.
sections:
  - id: financing-and-price-evidence
    title: Financing evidence is clear; price support is not
    body: >-
      Resolve AI announced a $125 million non-blended Series A at a $1.0 billion
      valuation in February 2026 and a $40 million extension at a $1.5 billion
      valuation in April. Forge independently displays the later post-money mark and
      reports $199.93 million of total funding, broadly corroborating the scale of
      capital raised. The disclosed marks therefore increased 50% within one financing
      sequence, while the extension added only $40 million of primary capital. That
      acceleration is a price signal, not evidence of equivalent operating-value
      creation. Public financial references are also internally unreliable:
      Business 2.0 reports approximately $4 million of ARR for December 2025, whereas
      Multiples.vc lists $360 million of "Revenue" for April 2026 while noting its
      field may mean run-rate revenue or LTM revenue. Revenue is not ARR, the periods
      differ, and neither figure is company-audited disclosure, so neither supports a
      defensible revenue multiple.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV008]
    tableRefs: [TV001]
  - id: thesis-and-anti-thesis
    title: Enterprise proof offsets, but does not remove, underwriting risk
    body: >-
      The strongest thesis evidence is operational rather than financial. Resolve AI
      names Coinbase, DoorDash, MongoDB, MSCI, Salesforce, and Zscaler as users, and
      reports a 72% reduction in Coinbase's critical-incident investigation time and a
      30% reduction in engineers required per Zscaler incident. These are meaningful
      adoption signals, but they remain company-issued claims rather than an
      independently measured cohort. The anti-thesis is that the current mark embeds
      category leadership before public evidence establishes recurring revenue,
      retention, gross margin, burn, customer concentration, or repeatable unit
      economics. The official material also says production agents need
      environment-specific reasoning and that Resolve AI Labs must build domain models,
      evaluation systems, governance, and guardrails. That program can deepen the moat,
      but it also identifies technical work that must succeed before increasingly
      autonomous production operation is safely scalable.
    claimRefs: [CV009, CV010, CV011, CV012, CV013, CV016]
    tableRefs: [TV002]
  - id: scenarios-and-comparables
    title: Scenario discipline requires milestones, not false precision
    body: >-
      Public comparables do not justify a point estimate. Multiples.vc lists PagerDuty
      at 2.5x LTM EV/revenue and Beijing Ultrapower at 1.9x, but Resolve AI lacks a
      verified denominator and differs materially in stage, growth profile, product
      scope, and liquidity. Applying those multiples would create precision unsupported
      by the evidence. A bull case requires independently verified expansion, durable
      margins, and safe autonomous remediation; a base case assumes enterprise adoption
      continues but financial visibility remains incomplete; a bear case combines
      slower conversion, technical-control limits, and private-market multiple
      compression. The $1.0 billion prior financing mark is a historical transaction
      reference, not a downside floor, while the $1.5 billion mark is an entry constraint,
      not an independently observed secondary clearing price.
    claimRefs: [CV001, CV002, CV003, CV010, CV011, CV012, CV015, CV016]
    tableRefs: [TV003]
  - id: recommendation-and-diligence
    title: Recommendation and decision gates
    body: >-
      The recommendation is research-more, with medium confidence, high risk, and a
      stretched valuation stance. Resolve AI has financing capacity, recognizable
      enterprise references, and a plausible path to category leadership, but the
      public record cannot support target returns, a hold period, or an exit value
      without inventing revenue and margin assumptions. Investment consideration should
      be conditional on a management data room that reconciles ARR and recognized
      revenue, supplies quarterly growth, gross margin, net retention, burn and runway,
      and provides customer-level concentration and renewal cohorts. Counsel should
      verify the full preference stack, dilution, participation rights, governance, and
      option-pool impact rather than relying on Forge's displayed 1.0x multiplier alone.
      The thesis breaks if independent customer validation fails, net expansion stalls,
      remediation safety cannot be demonstrated, or a financing requires price
      protection inconsistent with the announced headline mark.
    claimRefs: [CV002, CV003, CV008, CV009, CV010, CV011, CV014, CV016]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Decision factor, Assessment, Evidence, Decision implication]
    rows:
      - [Recommendation, Research more, "Financing and customer proof are material, but financial underwriting inputs are absent.", "Do not underwrite at the headline mark before data-room verification."]
      - [Confidence, Medium, "Two financing marks are corroborated, while core operating metrics are not.", "Treat price sensitivity and evidence quality as gating conditions."]
      - [Risk rating, High, "Autonomous production operation has technical-control risk and unverified economics.", "Require staged deployment evidence and contractual downside protection."]
      - [Valuation stance, Stretched, "The announced mark rose 50% from $1.0B to $1.5B without a verified public revenue denominator.", "Demand milestone-based entry discipline rather than a public-data multiple."]
      - [Current financing context, "$40M extension at $1.5B; more than $190M company-reported total funding", "Forge reports $199.93M total funding and the same $1.5B post-money mark.", "Capital availability improves execution runway but does not establish cash on hand."]
    notes: "Assessments use announced financing marks and third-party databases; revenue, cash balance, dilution, and return ranges remain unverified."
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV007, CV008, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Argument, Evidence status, What would change the view]
    rows:
      - [Thesis, "Recognizable enterprises are using the platform.", "Company-issued customer roster.", "Independent references confirming deployment scope, renewal, and production usage."]
      - [Thesis, "Reported incident-response outcomes indicate potential ROI.", "Company reports 72% faster Coinbase investigation and 30% fewer engineers per Zscaler incident.", "Customer-validated cohort results with baselines, periods, and denominators."]
      - [Anti-thesis, "The $1.5B mark outruns decision-grade financial disclosure.", "Public revenue references are inconsistent and not audited company metrics.", "Audited ARR/revenue bridge, growth, retention, margin, burn, and runway."]
      - [Anti-thesis, "Increasing autonomy raises reliability, control, and governance execution risk.", "Company materials emphasize human control, evaluation systems, and guardrails.", "Independent production benchmarks and safety evidence across representative incidents."]
    notes: "Customer outcomes and technical capabilities are company-issued; no independent cohort or benchmark was present in the assigned evidence pool."
    claimRefs: [CV005, CV007, CV009, CV010, CV011, CV012, CV016]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Case, Assumptions, Valuation and return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Verified net expansion, durable gross margin, repeatable enterprise deployments, and safe autonomy.", "The $1.5B mark becomes supportable only if forward economics materially exceed mature public-software references.", "Low until independently verified cohort and financial data are available.", "Customer validation or safety benchmarks fail."]
      - [Base, "Named-enterprise adoption continues, but financial visibility and autonomy evidence improve slowly.", "No defensible numeric return range; negotiate a milestone-gated price or defer.", "Most consistent with the current mixed evidence.", "Growth, retention, or gross margin misses management plan."]
      - [Bear, "Commercial conversion slows, autonomy remains constrained, or private-market multiples compress.", "The prior $1.0B mark is not a floor; loss severity depends on undisclosed preference and dilution terms.", "Elevated if the next financing requires price protection or a lower effective price.", "Down round, weak renewals, or inability to demonstrate safe remediation."]
    notes: "Scenario probabilities and valuation ranges are intentionally qualitative because verified revenue, margins, retention, burn, and cap-table data are unavailable."
    claimRefs: [CV001, CV002, CV003, CV008, CV010, CV011, CV012, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: "The decision moves from strong financing and enterprise signals through unresolved economics and execution risk to a research-more gate."
    data:
      nodes:
        - id: financing
          label: Financing signal
          value: "$1.5B announced post-money mark"
          note: "Corroborated by company release and Forge."
        - id: adoption
          label: Enterprise proof
          value: "Named customers and reported incident outcomes"
          note: "Company-issued rather than independently benchmarked."
        - id: economics
          label: Economic proof
          value: "Not publicly underwritable"
          note: "Revenue references conflict and lack a consistent metric basis."
        - id: execution
          label: Technical execution
          value: "Domain models, evaluation, and guardrails still being expanded"
          note: "Resolve AI Labs is intended to address these requirements."
        - id: price
          label: Entry discipline
          value: "No defensible public-data price range"
          note: "Use verified milestones and full financing terms."
        - id: decision
          label: Recommendation
          value: "Research more"
          note: "Medium confidence, high risk, stretched valuation."
      edges:
        - from: financing
          to: adoption
        - from: adoption
          to: economics
        - from: economics
          to: execution
        - from: execution
          to: price
        - from: price
          to: decision
    approximationNotes: "The flow is a decision sequence, not a quantitative scoring or conversion model."
    claimRefs: [CV003, CV010, CV013, CV016]
callouts:
  - calloutType: recommendation
    title: Investment posture
    body: "Research more; do not convert the $1.5B announced mark into a buy decision without verified economics, terms, and independent customer evidence."
    claimRefs: [CV002, CV003, CV016]
  - calloutType: risk
    title: Headline valuation is not an exit price
    body: "Forge reports limited market activity and no available Forge Price, so the post-money financing mark should not be treated as a liquid secondary-market clearing value."
    claimRefs: [CV003]
