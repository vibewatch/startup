schemaVersion: report-v2
artifact: market-analysis
slug: resolve-ai
runDate: 2026-10-17
company:
  name: Resolve AI
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Resolve AI is trying to create a new "AI for prod" or "AI SRE" category around
    production-operations automation, with the strongest support coming from company-issued
    workflow definitions and customer-specific outcome claims rather than from independent
    TAM studies. The assigned pool supports a credible large-enterprise pain budget and
    clear buyer/user segmentation, but it does not support a rigorous TAM/SAM/SOM or an
    independent benchmark for autonomous-remediation accuracy.
sections:
  - id: market-boundary
    title: Market boundary and adjacent categories
    body: >-
      The assigned evidence set consistently defines Resolve AI's market around operating
      software after deployment rather than around software creation. Across the homepage,
      the glossary, the February financing release, and independent profiles, the repeated
      workflow is alert triage, incident investigation, root-cause analysis, and
      remediation inside live production systems. That framing matters because it narrows
      the relevant spend pool to production operations budgets that already exist inside
      platform engineering, SRE, incident response, and observability-led workflows,
      instead of treating the company as a general AI assistant. The adjacent categories
      are coding assistants and standalone observability products: both are relevant
      substitutes for pieces of the workflow, but the sources repeatedly describe them as
      pre-deployment or data-presentation layers rather than as autonomous operators in
      production. That boundary definition is strong enough to support category logic, but
      the pool does not include an independent analyst taxonomy that proves buyers already
      budget this as a stable standalone software line item.
    claimRefs: [CM001, CM002, CM003, CM010]
    tableRefs: [TM001]
  - id: sizing-and-segmentation
    title: Evidence-constrained sizing and buyer segmentation
    body: >-
      The pool supports a problem-budget lens more than a software-market-size lens. The
      glossary cites Oxford Economics for more than $400 billion in annual downtime cost
      across the Global 2000, while company-linked materials repeatedly frame the category
      as reducing investigation time, MTTR, and operator toil in complex enterprise
      environments. Those signals support a large economic problem, and private-market
      financing shows investors underwriting the category narrative, but neither is a
      substitute for a defensible TAM, SAM, or SOM. The same limitation applies to the
      customer-outcome evidence: a 72% investigation-time reduction, an 87% faster
      incident-resolution claim, and a 30% reduction in engineers required per incident
      are meaningful proof points, yet they are customer-specific and not normalized to a
      common population or buying denominator. The most supportable segmentation therefore
      starts with large enterprises that operate multi-service, business-critical software
      and already spend against reliability, platform, and on-call performance objectives,
      with value selling first to engineering leadership rather than to a broad developer
      seat model.
    claimRefs: [CM004, CM005, CM006, CM007, CM008, CM011, CM013]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: adoption-drivers-and-constraints
    title: Adoption drivers, budget ownership, and constraints
    body: >-
      The strongest adoption driver in the assigned sources is operational complexity, not
      abstract enthusiasm for AI. The February announcement describes cloud sprawl,
      frequent code changes, and tribal workflows as structural reasons that incidents are
      hard to investigate, while the glossary adds that AI coding agents accelerate the
      burden by shipping more code into production faster. That logic points to a buyer
      path where VP Engineering, platform, SRE, and trust or infrastructure leaders justify
      the product through reliability outcomes and recovered engineering time. The same
      sources also show why adoption may be slower than the headline customer logos imply:
      production environments require high accuracy, governance, and human approval for
      higher-autonomy actions, and the pool does not contain an independent benchmark that
      validates category-wide root-cause accuracy or safe autonomous remediation. As a
      result, Resolve AI looks easier to underwrite as a large-enterprise productivity and
      reliability wedge than as a fully proven autonomous-operations platform with
      portable, independently measured ROI.
    claimRefs: [CM004, CM005, CM006, CM009, CM012, CM013]
    tableRefs: [TM003]
tables:
  - id: TM001
    title: Market definition and adjacency table
    columns:
      - Segment / category
      - Included spend or workflow
      - Excluded spend or workflow
      - Buyer / payer
      - Relevance
    rows:
      - ["AI SRE / AI for prod", "Alert triage, incident investigation, root-cause analysis, remediation, and production workflow automation across code, infrastructure, and telemetry.", "Pre-deployment code generation and generic office-task copilots.", "VP Engineering / platform / SRE budgets.", "Core category Resolve AI is trying to define."]
      - ["Observability and incident management", "Logs, metrics, traces, paging, and incident coordination used as system-of-record inputs to investigation.", "Pure data collection or dashboards that stop before diagnosis or action.", "Platform engineering / observability owners.", "Critical adjacent spend and integration surface, but not the same budget thesis."]
      - ["Coding assistants", "Developer productivity before deployment, code authoring, review, and test assistance.", "Live production operations after software is already running.", "Developer productivity / engineering enablement budgets.", "Status-quo substitute only for pre-production work."]
      - ["Manual on-call and runbook operations", "Human SRE labor, ad hoc debugging, runbooks, and coordination across teams during incidents.", "Automated or autonomous diagnosis that can investigate every alert in parallel.", "Existing reliability labor budget.", "Primary status-quo alternative that establishes willingness to pay."]
    notes: >-
      Boundary rows synthesize assigned sources rather than copying a published analyst taxonomy;
      they distinguish included workflows from adjacent substitutes because the pool lacks an
      independent market map.
    claimRefs: [CM001, CM002, CM003, CM005, CM010]
  - id: TM002
    title: TAM / SAM / SOM or sizing-lens table
    columns:
      - Lens / publisher
      - Year
      - Geography / population
      - Value
      - CAGR
      - Methodology
      - Confidence
      - Limitation
    rows:
      - ["Oxford Economics cited in Resolve AI glossary", "n.d.", "Global 2000 downtime exposure", ">$400B annual downtime cost", "n.a.", "Macro problem-budget proxy for cost of outages and diagnosis delays.", "Medium", "Not a software-market estimate and not specific to AI SRE spending."]
      - ["Resolve AI homepage", "2026", "Named enterprise deployments", "5x faster MTTR", "n.a.", "Company-reported operating-outcome proxy for value delivered to buyers.", "Medium", "Outcome claim is vendor-reported and not a market-size denominator."]
      - ["Resolve AI glossary and Agent Unfolded profile", "2026", "Customer-specific deployments", "72%-87% faster investigation or resolution; 30% fewer engineers per incident", "n.a.", "Case-study proxy for buyer ROI and adoption urgency.", "Medium", "Customer examples are not normalized across the same workflow, time basis, or population."]
      - ["PR Newswire financing releases and Forge profile", "2026", "Private venture / secondary market context", "$1.0B to $1.5B valuation; >$190M raised", "n.a.", "Capital-formation proxy that investors view the category as strategically important.", "Medium", "Valuation and funding do not establish TAM, SAM, or liquidity depth."]
    notes: >-
      Because no assigned successful source provides a defensible TAM/SAM/SOM model, this table
      uses evidence-constrained proxies for pain budget, buyer ROI, and investor appetite instead
      of inventing a market size.
    claimRefs: [CM007, CM008, CM011, CM012, CM013]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - ["Large platform and SRE organizations", "VP Engineering / Head of SRE", "On-call engineers, SREs, platform teams", "Central engineering infrastructure budget", "Alert triage, RCA, remediation coordination", "Platform / reliability leadership", "High incident volume and MTTR pressure."]
      - ["Security-conscious or regulated enterprises", "CTO / infrastructure or trust leadership", "SRE plus trust / infra operators", "Infrastructure and trust budgets", "Guardrailed operations in sensitive production environments", "Central infrastructure / trust", "Need for enterprise controls and safe autonomy."]
      - ["Multi-service internet platforms", "Engineering director owning customer-facing uptime", "Service owners and incident commanders", "Business-unit engineering budgets with platform support", "Cross-service dependency investigation and fast mitigation", "Application engineering with platform sponsorship", "Revenue or customer experience depends on fast recovery."]
      - ["AI-accelerated software teams", "Platform engineering leader", "Developers shipping into shared production systems", "Developer productivity plus reliability budgets", "Operational context and incident follow-through after faster code shipping", "Platform / engineering operations", "More code and more change velocity hitting production."]
    notes: >-
      Buyer and payer roles are inferred from the workflow and named-customer pattern in the
      assigned sources; the pool does not disclose ACV, contract structure, or budget line-item
      splits by segment.
    claimRefs: [CM004, CM005, CM006, CM009]
figures:
  - id: FM001
    title: Evidence-constrained adoption-pressure lens for AI SRE
    type: pyramid
    summary: >-
      The assigned pool supports a stacked problem-and-outcome proxy for market pressure, not a
      defensible TAM/SAM/SOM.
    data:
      nodes:
        - label: Downtime exposure
          value: "$400B+"
          note: Global 2000 annual downtime-cost proxy cited in the glossary.
          claimRefs: [CM007]
        - label: Incident-load environment
          value: "Thousands"
          unit: alerts per week
          note: The glossary says a typical cloud-native application generates thousands of alerts per week.
          claimRefs: [CM004, CM007]
        - label: Enterprise proof point
          value: "150,000"
          unit: alerts
          note: The glossary says Zscaler managed over 150,000 alerts.
          claimRefs: [CM006, CM008]
        - label: Investigation baseline
          value: "100%"
          unit: of alerts
          note: The glossary says production-grade AI SREs can investigate 100% of alerts.
          claimRefs: [CM002, CM008]
        - label: Customer outcome range
          value: "72%-87%"
          unit: faster investigation / resolution
          note: Customer-specific case studies cited in the glossary and Agent Unfolded profile.
          claimRefs: [CM008]
        - label: Homepage performance claim
          value: "5x"
          unit: faster MTTR
          note: Company homepage claim for production impact.
          claimRefs: [CM008]
    approximationNotes: >-
      This figure is not a TAM/SAM/SOM model. It visualizes the strongest demand and ROI proxies
      in the assigned pool because no successful assigned independent source provides a market-size
      methodology or a category-wide benchmark for autonomous-remediation accuracy.
    claimRefs: [CM004, CM007, CM008, CM013]
callouts:
  - calloutType: insight
    title: Budget ownership is reliability-led, not seat-led
    body: >-
      The supportable buyer path runs through engineering leaders who already own uptime, on-call,
      and platform budgets, not through a broad per-developer productivity purchase.
    claimRefs: [CM004, CM005, CM006]
  - calloutType: risk
    title: The market story outruns the measurement story
    body: >-
      The source pool supports urgency and customer-specific outcomes, but it does not support an
      independent TAM/SAM/SOM or a portable benchmark for safe autonomous remediation.
    claimRefs: [CM007, CM008, CM013]
