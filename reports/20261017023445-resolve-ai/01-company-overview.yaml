company:
  name: "Resolve AI"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Resolve AI is a San Francisco AI SRE company founded in 2024 by former Splunk observability leaders Spiros Xanthos and Mayank Agarwal. The assigned public evidence supports rapid financing and marquee customer traction through 2026, but still leaves material gaps on revenue, customer-count precision, and financing-governance terms."
sections:
  - id: "identity-and-product"
    title: "Identity and product posture"
    body: |-
      Resolve AI presents itself as an AI platform for running software in production rather than a generic coding copilot. The company homepage says it “goes on-call on your behalf and autonomously resolves incidents,” while the February 2026 financing announcement describes a multi-agent system that works across code, infrastructure, and telemetry to triage alerts, investigate incidents, and help engineers act in production. Third-party profiles broadly match that positioning by describing a platform that participates in on-call rotations, investigates incidents, and generates operational outputs such as scripts or pull requests. The identity evidence is therefore directionally consistent: Resolve AI is selling autonomous or semi-autonomous production-operations software for enterprise engineering teams, not a broad horizontal enterprise-AI workflow tool.
    claimRefs: ["CO001", "CO002", "CO003"]
    tableRefs: ["TO001"]
  - id: "leadership-and-governance"
    title: "Leadership, founder-market fit, and governance visibility"
    body: |-
      Public sources clearly identify the two co-founders and support unusually strong founder-market fit for the category. Tracxn and official materials both identify Spiros Xanthos as co-founder and CEO and Mayank Agarwal as co-founder and CTO, while the company’s February 2026 announcement says the founders previously led Splunk’s observability business and co-created OpenTelemetry. That background is directly relevant to a product that must reason over telemetry, production systems, and reliability workflows. The April 2026 extension announcement also says Dhruv Mahajan joined as Chief AI Scientist to lead Resolve AI Labs, signaling a deliberate research push. What remains thin is governance visibility: the assigned public sources do not disclose board composition, voting controls, or financing preference terms in enough detail to underwrite downside protections.
    claimRefs: ["CO004", "CO005", "CO006", "CO012", "CO016"]
    tableRefs: ["TO002"]
    figureRefs: ["FO001"]
  - id: "capitalization-and-stakeholders"
    title: "Funding path, valuation markers, and stakeholder concentration"
    body: |-
      Resolve AI’s financing cadence is the clearest public indicator of company momentum. The launch post announced a $35 million seed in October 2024, the company’s February 2026 announcement said it raised $125 million in a non-blended Series A at a $1 billion valuation, and the April 2026 extension announcement said another $40 million came in at a $1.5 billion valuation led by DST Global and Salesforce Ventures. Independent market-data sources broadly corroborate the funding arc and place total funding near $200 million, but they also highlight that some valuation framing may be more complex than the headline suggests. VFuture Media reported that the December 2025 round used a multi-tranche structure that implied a blended valuation below the $1 billion headline, which is relevant because valuation optics may be cleaner than public governance economics.
    claimRefs: ["CO007", "CO008", "CO009", "CO014", "CO015"]
    tableRefs: ["TO003"]
  - id: "scale-milestones-and-open-gaps"
    title: "Scale signals, milestone cadence, and unresolved diligence gaps"
    body: |-
      The available evidence shows fast external momentum but still incomplete operating disclosure. Official 2026 materials name enterprise customers including Coinbase, DoorDash, MongoDB, MSCI, Salesforce, and Zscaler, while Tracxn reports 168 employees “as of Aug 26” without stating the year or methodology in the fetched text. These are meaningful but differently qualified early-scale indicators for a company formed in 2024. The same extension announcement added Resolve AI Labs, tying new capital to longer-horizon model and evaluation work instead of only go-to-market expansion. Even so, the assigned public evidence does not disclose ARR, revenue growth, gross margin, burn, net retention, precise customer count, or financing preference-stack detail. Those omissions matter because the current valuation step-up is easier to understand narratively than to underwrite quantitatively from public evidence alone.
    claimRefs: ["CO010", "CO011", "CO013", "CO016"]
