evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      A current cap table, board roster, committee map, and related-party transaction schedule linking Nidar,
      Hiranandani entities, and Yotta.
    whyItMatters: >-
      Late-stage infrastructure underwriting depends on knowing actual control rights, dilution, sponsor economics, and
      any non-arm’s-length arrangements.
    diligencePath: >-
      Request the latest cap table, shareholders agreement summary, board pack, and related-party schedule from
      management.
    relatedQuestionRefs:
      - QO010
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited FY2025 and trailing-2026 revenue, EBITDA, cash burn, debt, and customer concentration instead of only
      filing-linked or interview-based numbers.
    whyItMatters: >-
      The company’s valuation and capital-intensity narrative cannot be judged cleanly from projected revenue and
      qualitative demand statements alone.
    diligencePath: >-
      Request audited financial statements, management accounts, debt schedules, and the current customer revenue bridge
      before underwriting valuation.
    relatedQuestionRefs:
      - QO023
      - QO025
    relatedTableRefs:
      - TO007
  - type: missing-source
    severity: minor
    topic: cover-metrics
    missingEvidence: A company-backed customer count, headcount, and utilization bridge current to July-August 2026.
    whyItMatters: >-
      The strongest cover metrics today are valuation and GPU-roadmap numbers, but core operating-scale indicators
      remain soft and could overstate maturity if guessed.
    diligencePath: Request a current operating dashboard with customers, active GPU utilization, employees, and backlog by segment.
    relatedQuestionRefs:
      - QO022
      - QO025
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      A clean public TAM/SAM/SOM estimate specifically for sovereign Indian GPU cloud and resident AI infrastructure
      revenue.
    whyItMatters: >-
      Broad data-center MW and policy numbers can overstate Yotta’s serviceable commercial opportunity if sovereign
      demand is narrower or slower to monetize.
    diligencePath: >-
      Build a bottom-up model from IndiaAI usage, large enterprise AI budgets, and regulated workload migration plans
      rather than relying on generic DC MW figures.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Actual contracted pricing, gross margin, and utilization by segment for government, enterprise, startup, and
      anchor-partner GPU demand.
    whyItMatters: >-
      The market can be large while economics remain unattractive if subsidy-driven or partner-concentrated workloads
      set low realized yields.
    diligencePath: Request pipeline, booked utilization, pricing waterfalls, and gross-margin assumptions by segment.
    relatedQuestionRefs:
      - QM017
      - QM025
  - type: missing-source
    severity: minor
    topic: secondary-markets
    missingEvidence: >-
      More concrete public evidence on when inference-heavy demand truly shifts into Tier-II cities instead of staying
      concentrated in top metros.
    whyItMatters: >-
      The case for a broad national sovereign AI market is stronger if demand disperses; otherwise Mumbai and Noida
      remain the dominant bottlenecks.
    diligencePath: Track regional RFPs, edge deployments, and latency-sensitive enterprise wins over the next 12 months.
    relatedQuestionRefs:
      - QM022
      - QM024
    relatedTableRefs:
      - TM008
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      A reliable apples-to-apples public price comparison across sovereign GPU cloud, enterprise hybrid cloud, and
      hyperscale colocation vendors.
    whyItMatters: >-
      Competitor positioning can look stronger or weaker depending on realized pricing power, but public packaging data
      does not show margins or actual committed rates.
    diligencePath: >-
      Request customer proposals or price books from Yotta and peers, or compile channel quotes for equivalent rack,
      GPU, and cloud bundles.
    relatedQuestionRefs:
      - QP017
      - QP025
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: utilization
    missingEvidence: Current utilization, backlog, customer concentration, and contract-tenure data for Yotta versus key peers.
    whyItMatters: >-
      The best-positioned operator is not necessarily the best investment if expansion is underutilized or overly
      concentrated in a small number of anchor accounts.
    diligencePath: >-
      Request pipeline, booked utilization, contract tenor, and renewal data by segment before making a comparative
      call.
    relatedQuestionRefs:
      - QP023
      - QP024
  - type: missing-source
    severity: minor
    topic: feature-breadth
    missingEvidence: >-
      Independent third-party technical comparisons of sovereign control, GPU orchestration, and hybrid-cloud usability
      across Indian providers.
    whyItMatters: >-
      Most current feature comparisons rely on vendor self-descriptions and market profiles rather than
      product-by-product testing.
    diligencePath: Run a structured technical bake-off with representative government, enterprise, and AI-team workflows.
    relatedQuestionRefs:
      - QP011
      - QP025
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, contribution margin, and realized pricing by colocation, sovereign cloud, and AI services.
