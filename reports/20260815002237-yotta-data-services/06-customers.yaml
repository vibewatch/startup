      ]
    },
    {
      "id": "durability-and-expansion",
      "title": "Durability logic is plausible, but denominator data is still missing",
      "body": "Yotta\u2019s expansion logic is intuitive. A customer that trusts Yotta for hosting or managed cloud could plausibly buy adjacent network, AI, surveillance, or support services later, and the One Yotta portal hints at an operational surface that can reinforce post-sale stickiness. The challenge is that none of the usual durability metrics are public. There is no NRR, GRR, renewal rate, customer-count trend, or satisfaction score. As a result, the right conclusion is not that durability is weak; it is that durability is only inferable. Investors can see credible cross-sell pathways and a maturing support loop, but they still cannot tell whether flagship references are repeatable across a broad installed base or concentrated in a relatively small set of high-profile accounts. A strong reference set can coexist with weak portfolio retention if the company is still early in scaling repeatable motions, which is exactly why cohort evidence matters here. The absence of denominator data is therefore the central customer diligence blocker, not the absence of logos.",
      "claimRefs": [
        "CU014",
        "CU018",
        "CU019",
        "CU020",
        "CU035",
        "CU031"
      ],
      "tableRefs": [
        "TU004"
      ],
      "figureRefs": [
        "FU002"
      ]
    },
    {
      "id": "concentration-and-verdict",
      "title": "Customer quality is promising, but concentration and repeatability remain the key asks",
      "body": "The customer verdict is favorable on quality and unresolved on breadth. Yotta has enough named production proof to show that the company can win and operate serious accounts across public-sector and enterprise contexts. What remains unproven is concentration and repeatability. The customer story could represent the front edge of a diversified installed base, or it could be overly anchored on a small number of marquee references and procurement-linked programs. Those two possibilities lead to very different underwriting outcomes. Before taking a hard view, investors should request active-account counts, segment revenue mix, top-customer exposure, renewal data, and partner-sourced bookings. Until then, Yotta\u2019s customer evidence supports strategic credibility, but not a clean durability score. In other words, the customer story is good enough to validate relevance, but not yet complete enough to validate resilience. That is a meaningful difference for valuation and for conviction on long-term compounding.",
      "claimRefs": [
        "CU017",
        "CU034",
        "CU024",
        "CU036",
        "CU030"
      ],
      "tableRefs": [
        "TU005"
      ]
    }
  ],
