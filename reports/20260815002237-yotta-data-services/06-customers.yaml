        "FU001"
      ]
    },
    {
      "id": "named-proof",
      "title": "Named customer proof is real and mostly production-oriented",
      "body": "The named proof table is stronger than many private infrastructure companies disclose publicly. BARC, GFL, ITW, NIC, and Matrix each show a distinct workload pattern: uptime-sensitive data infrastructure, performance-focused modernization, ERP migration, sovereign public-sector infrastructure, and distributed security operations. These are not five versions of the same logo slide. They collectively suggest Yotta can translate its stack into multiple production environments. The quality of proof still varies. Customer-selected case studies are always curated, and partner-led deployments such as Matrix / Drishticam are not the same thing as a direct end-customer renewal record. Even so, the visible set is credible enough to support the claim that Yotta has moved beyond pilot-stage storytelling. That breadth of use cases is especially valuable because it lowers the odds that every reference is being driven by the exact same budget or procurement logic.",
      "claimRefs": [
        "CU004",
        "CU006",
        "CU007",
        "CU009",
        "CU008",
