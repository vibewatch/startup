  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Yotta\u2019s customer story is stronger than a generic startup cloud narrative: the public record shows real government credibility, named enterprise migrations, distributed-security use cases, and IndiaAI-linked onboarding activity. BARC, GFL, ITW, NIC/NDC NE, and Matrix together suggest production-oriented usage across several segments rather than a single narrow customer archetype. The main missing piece is denominator data\u2014retention, active-account counts, concentration, renewal, and partner-sourced mix\u2014so the customer case supports strategic credibility more clearly than it supports a quantified durability conclusion."
  },
  "sections": [
    {
      "id": "customer-base",
      "title": "The visible customer base is broader than a pure colocation story",
      "body": "Yotta\u2019s public customer evidence spans more than one buyer category. Government and public-sector references remain central because they validate sovereignty, compliance, and mission-critical operating credibility. But the named proof set also includes enterprise modernization workloads, distributed security use cases, and IndiaAI-linked onboarding across academia and startups. That matters because it suggests Yotta is not simply renting space to a handful of anchor accounts. Instead, it is trying to convert a core infrastructure platform into a broader customer portfolio that mixes government trust, enterprise modernization, and AI capacity demand. The strongest caveat is that the public record is much better at naming the categories and logos than at quantifying how many accounts sit inside each category. The visible mix also helps explain why Yotta spends so much time on sovereignty, uptime, and managed execution rather than only on abstract cloud language. That breadth gives Yotta more strategic optionality than a single-segment hosting provider.",
      "claimRefs": [
        "CU001",
        "CU002",
        "CU003",
        "CU033"
      ],
      "tableRefs": [
        "TU001",
        "TU002",
        "TU006"
      ],
