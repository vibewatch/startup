  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 相关市场是主权算力加高密度园区容量，不是泛印度软件 TAM
        blocks:
          - type: paragraph
            body: >-
              给 Yotta 的机会定规模，第一步是先划清它不是什么。Yotta 不需要整个印度云或软件市场都足够巨大，才值得关注； 它需要的是与主权云控制、高密度 GPU
              基础设施、受监管混合云和超大规模式园区交付绑定的那部分支出，增长快到足以支撑其资本强度。 第三方市场研究显示，这个条件已经存在。CBRE 称，截至 2025 年前九个月，印度运营中存量约 1,530
              MW；Cushman & Wakefield 则把 2026 年市场四舍五入到约 1.6 GW，并指出另有 3.1 GW 在建或规划中，土地阶段还有 10.5 GW。 这些数字不是收入
              TAM，但足以证明基础设施市场已经很大，且仍然供给饥渴。同样重要的是，以每 MW 覆盖人口衡量， 印度渗透率仍低，且高度集中在少数大都市。这意味着增长既可以来自需求总量扩张，也可以在 AI
              工作负载多元化时来自地理外扩。
