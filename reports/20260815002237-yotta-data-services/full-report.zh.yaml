      - number: '1.2'
        title: 领导层清晰，但治理披露明显比资本故事薄
        blocks:
          - type: paragraph
            body: >-
              Yotta 不缺看得见的发起人，缺的是完整治理披露。Darshan Hiranandani 显然是战略发起人与公开董事长， 把 Yotta 接上 Hiranandani 集团的土地、基础设施和融资能力。Sunil
              Gupta 在运营上同样关键：公开记录显示他是联合创始人、 CEO，也是 Yotta GPU、IPO 和主权云雄心的主要叙事者。他的 NTT Netmagic 背景是本案较强的创始人-市场匹配信号， 因为
              Yotta 不只是房地产资本延伸，而是接上了印度成熟数据中心运营谱系。Niranjan Hiranandani 的名誉董事长标签和 Saurabh Bharat
              的财务角色提供了发起人延续性和资金管理深度，但没有解决核心治理尽调问题：公开材料仍没有给出清晰董事会图谱、 委员会结构，或发起人与少数股东之间的准确持股拆分。Darshan Hiranandani 在 Mahua
              Moitra 事件中的发起人层面争议， 不能证明 Yotta 内部存在运营问题；但它仍是一个可复用的治理标记，因为它牵出判断力、声誉外溢，以及投资者在承销一个快速扩张的基础设施资产时，
              到底还承销了多少发起人风险。
