  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Yotta 的产品是一体化服务栈，不是单一 SKU
        blocks:
          - type: paragraph
            body: >-
              Yotta 应被当作一体化基础设施服务栈分析，而不是狭义软件或主机托管产品。公开材料显示，多层能力协同工作： 关键任务园区、运营商中立连接、主权云和托管服务、AI GPU
              容量，以及把账单和支持连接起来的客户运营门户。 这很重要，因为产品差异化存在于这些层之间的交接处。买方不是只租空间，也不是启动通用虚拟机。在证据最充分的用例里，
              买方拿到的是印度本土基础设施、合规云控制、可选合作伙伴软件叠加，以及一条通向生产环境的托管路径。 正是这种一体化设计，让 Yotta 即使不拥有每一个软件原语，也能可信地同时面向公共部门主权需求和企业现代化叙事。
              这个架构也解释了为什么 Yotta 能在同一次商务对话里同时拿出合规、连接和 GPU 规模，而不是把它们当作互不相关的产品出售。
