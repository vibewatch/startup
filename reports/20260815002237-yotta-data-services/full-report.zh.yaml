  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险框架是集中型，而不是分散型
        blocks:
          - type: paragraph
            body: >-
              Yotta 的风险画像不是由小型执行噪音主导，而是由少数集中依赖主导，每一项都可能影响很大：印度电力交付、发起人治理、 NVIDIA
              相关供给、持续融资通道，以及政策对齐的主权需求。这种集中有利有弊。它是公司能在当前市场清晰差异化的原因之一，
              但也意味着失败不会只停留在局部。电力延误会伤害交付，进而伤害收入确认时间，再伤害融资灵活性，最后伤害估值。
              因此，风险框架更像传导问题，而不是清单问题。除非后续尽调证明这些风险可独立管理，投资者应假设它们彼此相关。 这种框架的价值在于，它把尽调指向少数决定性瓶颈，而不是把注意力稀释到次要运营细节。相关性在这里很重要。
            claimRefs:
              - CR004
              - CR007
              - CR011
              - CR032
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR018
              - CR003
              - CR004
              - CR011
          - type: figure
            figureRef: FR002
            claimRefs:
              - CR022
              - CR023
              - CR027
              - CR028
      - number: '7.2'
        title: 监管和治理风险目前可管理，但并不温和
        blocks:
          - type: paragraph
            body: >-
              公开证据支持对监管和治理风险作细分判断。正面看，MeitY 和 IndiaAI 参与显示真实监管认可， Yotta 看起来与主权 AI
              优先事项一致，而不是冲突。负面看，如果政策设计或政府支出优先级变化，这种一致本身也会变成依赖。 治理风险也不能因为公开记录里没有可见的 Yotta 专属执法事件就被忽略。家族控制和 Darshan
              Hiranandani 的个人画像形成声誉链接； 一旦争议升级，它可能很快影响企业采购或资本市场信心。实践上，这意味着政策和治理今天没有打破投资逻辑，
              但足以要求长期维持更高观察等级。真正的问题不是风险是否存在，而是治理和披露纪律是否成熟得足够快， 能支撑一个资本密集型公开市场故事。这种持续警戒应被视为结构性，而非暂时性。
            claimRefs:
              - CR001
              - CR003
              - CR013
              - CR019
              - CR022
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR012
              - CR013
              - CR033
              - CR039
      - number: '7.3'
        title: 运营和伙伴风险最难分散
        blocks:
          - type: paragraph
            body: >-
              运营上，最大风险仍然是物理层：高密度 AI 园区的电力、冷却和交付能力。多个独立来源都认为这些约束解决很慢， Yotta 自身材料也隐含承认同一问题。即便 NM1 这样的强站点资质，也不能消除一个事实：更广的
              AI 建设依赖稀缺公用事业、 高难度工程和同步投产。伙伴依赖同样是结构性的。Yotta 受益于 NVIDIA、IBM、AWS 等关系，但这也意味着，
              其价值主张中所有重要层级并非都由自己完全控制。这些风险并不致命；它们只是基础设施市场快速扩张的代价， 而速度本身会制造集中度。因此，交付证据和伙伴经济性在这里比泛泛的技术市场乐观更重要。实际上，Yotta
              正在物理基础设施、 公共政策和软件伙伴关系必须按计划协同运转的前沿扩张。
            claimRefs:
              - CR006
              - CR009
              - CR008
              - CR004
              - CR026
