      - number: '2.3'
        title: 政策顺风真实存在，但价值在于转化为付费算力需求，而不是听起来有战略意义
        blocks:
          - type: paragraph
            body: >-
              印度政策框架对 Yotta 异常重要，因为它不只是宽泛政治口号，而是通过实际算力采购落地。PIB 和议会材料显示， IndiaAI 计划旨在调动私营部门 GPU 供给，初始目标为 10,000 块
              GPU，入选竞标方已提供 14,517 块 GPU； 定价机制包括平均约 Rs 115 / GPU 小时的费率，并提供最高 40% 支持。市场研究也显示，印度政府对大规模数字基础设施总体更支持： GRI
              提到新的安全港条款，以及针对部分外国云工作负载的 20 年免税期；Cushman 则把印度数据中心长期吸引力与强劲开发管线、 不断增长的电力生产联系起来。对 Yotta
              而言，意义很实际。这些政策通过补贴本土需求、验证主权基础设施、 让印度更吸引本土和外国工作负载，缩短了园区建设到付费利用之间的时间。它们不能消除执行风险，但明显改善了真正能交付容量的公司的需求背景。
