        title: 结论是战略动能有吸引力，但财务证据仍不完整
        blocks:
          - type: paragraph
            body: >-
              Yotta 的公开财务图景，足以支撑一个增长投资逻辑，但还不足以支撑硬性承销结论。公司看起来有真实需求， 收入模型比许多基础设施故事更清楚，也确实有机会把主权 AI
              定位变成持久企业相关性。同时，它似乎在完整披露成熟之前， 就已经为规模扩张融资。投资者仍缺少最关键的基础决策输入：产品层级收入组合、已签在手订单、毛利率、利用率、 实际 GPU
              定价、客户集中度、债务负担和现金跑道。没有这些，正确结论不是业务弱，而是公开证据主要证明了战略野心和运营动能，
              利润率韧性和自筹资金扩张仍未解决。对投资委员会而言，财务尽调应少看市场需求，多看现有合同能否让正在投入的资本获得可接受回本。 现有披露指向多条变现通道，但仍没有通道层面的审计经济质量。
