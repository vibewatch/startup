  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 模型看得懂，但定价和真实收入质量看不清
        blocks:
          - type: paragraph
            body: >-
              Yotta 的财务模型在概念上清晰，尽管公开 KPI 并不清楚。公司披露了三条产品线——主机托管、云和托管服务、AI 服务； 公开客户证据显示，这些产品卖给政府、受监管企业和 AI
              开发者需求的混合体。这个架构很重要，因为 Yotta 的收入并非同质。 主机托管和托管服务可以更粘、更合同化；GPU 云和主权 AI 工作负载增长可能更快，但也可能带来更多时点、利用率和硬件回本风险。
              公开材料足以解释包装和销售路径，让人看懂园区与 GPU 如何桥接到收入；但它们没有披露实际费率、产品层级组合， 或 AI
              标题里有多少会转化为持久的经常性毛利。这让故事在叙事上具备可投资性，但在分析上还不能充分承销。
