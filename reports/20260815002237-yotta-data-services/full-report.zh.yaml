      - number: '1.3'
        title: 资本形成急剧加速，但公开数字仍挤在狭窄披露通道里
        blocks:
          - type: paragraph
            body: >-
              公司概况里的证据，最强的是资本野心，最弱的是完整审计透明度。Economic Times 报道，Yotta 在 2026-07 以 $3.9B 估值募得约 $150M
              新股资本，控股股东没有减持；Bloomberg 和 CNBC TV18 则称，公司在推进后续 pre-IPO 流程，上市前还可能再融资 $500M–$600M。与此同时，2025 年 Cartica
              材料仍能看到此前美国路径： 文件记录了 YTTA 代码下、面向 Nasdaq 路径的生效 F-4。这组组合说明公司有战略灵活性，而不是只有一条固定上市路径。
              目前最有用的财务披露来自间接渠道，不是常规管理层讨论，而是 EE Times 对备案相关预测的报道：2024 年收入约 $49.2M，2025 年收入预测为 $156M，2024 年仍有可观净亏损，2025
              年预期资本开支约 $1B。 这些数字有方向意义，因为它们显示 Yotta 在公开上市前正激进押注 AI 基础设施；但它们仍替代不了审计报表、客户队列经济性， 或足以支撑后期承销的股权结构表。
