  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 真实可比公司混合了印度基础设施既有玩家和超大规模云替代品
        blocks:
          - type: paragraph
            body: >-
              Yotta 的竞争对手不能只简化成印度主机托管公司。选择 Yotta 的买方，往往同时评估三类替代方案：Nxtra、STT GDC India、 CtrlS 等本土数据中心运营商；NxtGen 等较小的 AI
              导向玩家；以及 AWS、Azure 等全球云栈——后者无需本土主权专家， 也能满足许多企业用例。正因为如此，Yotta 自身定位才格外重要。它的公开故事不是更便宜的机柜或通用托管，
              而是一个本土运营商能把主权云控制、政府级数据驻留和大规模本地 GPU 供给组合起来；外国超大规模云厂商和经典主机托管同行很难同时做到。 因此，竞争问题不在于谁总体楼最多，而在于谁拥有适合印度 AI
              时代的园区、控制平面、标杆客户和合作伙伴生态组合。
