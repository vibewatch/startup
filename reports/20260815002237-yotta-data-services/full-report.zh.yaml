      - number: '2.4'
        title: 市场受执行约束：电力、冷却和交付纪律如今和需求本身同样重要
        blocks:
          - type: paragraph
            body: >-
              当前市场研究里最重要的负面洞见是，印度 AI 基础设施热潮已经不再受需求约束，而是受执行约束。多个来源从不同角度指向同一点：
              电力可得性已经取代土地，成为一阶瓶颈；输电和最后一公里交付很重要；变压器交期很长；可再生能源并网需要储能； 转向液冷同时抬高工程复杂度和淘汰风险。GRI 和 ET EnergyWorld 说明了为什么这对
              Yotta 尤其重要。AI 工作负载密度比传统企业机柜高一个数量级， 所以赢家不是只会发布公告的运营商，而是能可靠投产、冷却和供电高密度园区的运营商。这也解释了推理为什么是市场中的重要转折。
              如果推理最终约占需求一半，那么即便远程训练集群在别处兴起，靠近都市、具备主权属性和低时延的供给仍可能稀缺。因此，Yotta 处在一个有吸引力的市场切口；
              但前提是，它能比同行更快把公告变成有韧性的投产容量，并且不让电力瓶颈侵蚀回报。
