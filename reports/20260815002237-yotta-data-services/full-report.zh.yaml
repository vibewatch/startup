              - CU025
              - CU024
              - CU036
      - number: '6.3'
        title: 持久性逻辑说得通，但分母数据仍缺失
        blocks:
          - type: paragraph
            body: >-
              Yotta 的扩张逻辑直观。一个信任 Yotta 托管或托管云的客户，之后也可能购买相邻的网络、AI、监控或支持服务； One Yotta
              门户则暗示一种能强化售后粘性的运营界面。挑战在于，常见持久性指标都没有公开。没有 NRR、GRR、续约率、
              客户数趋势或满意度分数。因此，正确结论不是持久性弱，而是只能推断。投资者能看到可信的交叉销售路径和逐渐成熟的支持闭环，
              但仍无法判断旗舰背书是否能在广泛装机基础中复现，还是集中在相对少数高知名度账户里。若公司仍处于扩展可复制动作的早期，
              强背书集也可能与弱组合留存并存；这正是客户队列证据在此重要的原因。因此，缺少分母数据才是客户尽调的核心阻碍， 不是缺少客户标识。
            claimRefs:
              - CU014
              - CU018
              - CU019
              - CU020
              - CU035
              - CU031
          - type: table
            tableRef: TU004
            claimRefs:
              - CU019
              - CU020
              - CU031
              - CU035
          - type: figure
            figureRef: FU002
            claimRefs:
              - CU013
              - CU035
              - CU023
      - number: '6.4'
        title: 客户质量有希望，但集中度和可复制性仍是关键问题
        blocks:
          - type: paragraph
            body: >-
              客户结论是质量偏正面，广度未解决。Yotta 有足够具名生产证据，说明公司能在公共部门和企业场景里赢下并运营严肃账户。
              尚未证明的是集中度和可复制性。客户故事可能代表一个多元装机基础的前沿，也可能过度锚定少数招牌背书和采购关联项目。
              这两种可能会导向非常不同的承销结果。投资者在形成硬判断前，应要求活跃账户数、分部收入组合、头部客户敞口、 续约数据和合作伙伴来源订单。在此之前，Yotta
              的客户证据支撑战略可信度，但给不出干净的持久性分数。换句话说， 客户故事足以验证相关性，但还不足以验证韧性。这个差别对估值和长期复利信心都很重要。
            claimRefs:
              - CU017
              - CU034
              - CU024
              - CU036
              - CU030
          - type: table
            tableRef: TU005
