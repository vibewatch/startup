              - CU018
      - number: '6.2'
        title: 具名客户证据真实存在，并且大多面向生产
        blocks:
          - type: paragraph
            body: >-
              这张具名证据表比许多私有基础设施公司公开披露的更强。BARC、GFL、ITW、NIC 和 Matrix 分别展示了不同工作负载模式： 对正常运行时间敏感的数据基础设施、以性能为核心的现代化、ERP
              迁移、主权公共部门基础设施，以及分布式安全运营。 这不是同一张客户标识幻灯片的五个版本。它们合在一起说明，Yotta 能把自身栈转化到多个生产环境里。 证据质量仍有差异。客户自选案例研究总是经过筛选；Matrix
              / Drishticam 这类伙伴主导部署，也不同于直接终端客户续约记录。 即便如此，可见样本已足够可信，能支撑 Yotta 已经走出试点阶段叙事的说法。用例广度尤其有价值，
              因为它降低了所有背书都由同一预算或采购逻辑驱动的概率。
            claimRefs:
              - CU004
              - CU006
              - CU007
              - CU009
              - CU008
              - CU025
              - CU026
