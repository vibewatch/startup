  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 核心问题是价格，不是相关性
        blocks:
          - type: paragraph
            body: >-
              Yotta 同时具备战略相关性和财务难度。公开证据现在支持真实市场、真实产品栈和真实客户证明； 但它并不支持为这种敞口支付几乎任何价格。据报道，$3.9B–$4.0B 的估值建立在有限披露、大额资本开支需求、
              融资依赖，以及相关联的治理 / 执行风险之上。核心估值问题因此很简单：当前估值是否已经折现了大部分上行？ 从公开可比公司看，答案是肯定的。即便给出有意义的主权 AI 溢价，相比成熟数据中心平台和高增长 AI
              基础设施可比公司， Yotta 仍显得昂贵。实际上，投资者现在被要求先为一个仍需大量证明的未来状态付钱。这并不否定 Yotta 的战略重要性； 它只是意味着，估值纪律必须比热情承担更多工作。至少目前如此。
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV032
          - type: table
            tableRef: TV001
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV032
          - type: table
            tableRef: TV004
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV021
              - CV040
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV033
              - CV014
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV001
              - CV010
              - CV011
              - CV012
      - number: '8.2'
        title: 可比逻辑指向的基准情景低于当前报道估值
        blocks:
          - type: paragraph
            body: >-
              没有完美可比公司，但方向性信息很清楚。Equinix 和 Digital Realty 是最好的成熟基础设施基准， CoreWeave 是最好的公开高增长 AI 基础设施基准。Yotta 隐含远期收入倍数约
              25x，远高于三者。这并不意味着 Yotta 在所有未来状态下都被高估； 它意味着当前价格已经要求投资者承销很大一部分上行情景。印度特定的主权 AI 稀缺性和更快增长，可以支撑溢价； 无上限溢价则不行，尤其是在
              Yotta 仍缺少公开同行那种披露深度和多元化的时候。因此，基准情景应明显低于报道估值。 比较不必完美也能有信息量；它只需要说明差距是小还是大，而这里显然很大。对投资者而言，相关结论是：
              溢价并不温和，而是很可观。价格已经假设了可观成功。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV008
              - CV009
              - CV013
              - CV033
          - type: table
            tableRef: TV003
            claimRefs:
              - CV012
              - CV010
              - CV011
              - CV037
              - CV038
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV023
              - CV024
              - CV025
      - number: '8.3'
        title: 当前估值只有在 Yotta 接近乐观情景执行时才说得通
        blocks:
          - type: paragraph
            body: >-
              仍然可以为 Yotta 接近当前估值构建一个合理情景——但前提是一组苛刻假设。公司需要兑现 GPU 路线图，
              保住融资灵活性，把企业证明扩展到招牌客户之外，并把披露改善到让投资者能够承销单位经济性，而不只是承销战略叙事。 在那个世界里，主权 AI 可选性和印度基础设施稀缺，可能支撑明显高于成熟数据中心同行的估值。问题是，
              这不是今天的证据集。今天的证据集支持乐观情景的可能性，而不是概率。因此，当前报道估值更像一个已经假设成功的价格， 而不是为投资者承担不确定性付费的价格。投资者需要把对战略相关性的尊重，与愿意支付完整情景价格分开。
              在此之前，当前价格给普通执行波动留下的空间太少。
            claimRefs:
              - CV012
              - CV037
              - CV018
              - CV019
              - CV020
          - type: table
            tableRef: TV007
            claimRefs:
              - CV033
              - CV039
      - number: '8.4'
        title: 投资建议：观察，并要求更好价格或更好证据
        blocks:
          - type: paragraph
            body: >-
              因此，投资建议是在当前报道估值下观察 / 有纪律地放弃。这不是对公司战略重要性的负面判断， 而是认为当前价格已经要求投资者对融资、执行和治理结果抱有过高信心，而这些结果仍只有部分披露。观点可以改善。
              更好的单位经济性披露、更强的续约和在手订单证据、更干净的资产负债表透明度，以及按时部署证明，
              都可能支撑更窄折价。在那之前，正确纪律是尊重资产、尊重市场机会，但克制为一个仍需基准情景证明的业务支付乐观情景价格的冲动。
              对投资者来说，今天最好的结果是更好证据或更好价格，最好两者都有。正是这种不对称，让耐心成为当前更好的策略。今天，克制胜出。
            claimRefs:
              - CV014
              - CV016
              - CV015
              - CV013
