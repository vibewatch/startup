            body: >-
              整体产品结论偏正面。Yotta 有足够硬证据——园区、合规、控制界面、案例证明、有日期的里程碑和伙伴佐证—— 显示产品不是一页主权云 PPT
              故事。信心下降的地方，是更深的软件和运营细节。公开来源没有充分证明编排质量、 基准性能、支持 SLA、事故历史或产品层级定价。因此，产品尽调应少问 Yotta 是否真的做出了东西， 多问
