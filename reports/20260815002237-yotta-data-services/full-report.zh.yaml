      - number: '3.3'
        title: 超大规模云厂商和全球平台仍决定软件广度与基础设施质量的天花板
        blocks:
          - type: paragraph
            body: >-
              Yotta 的主权故事并不能让它免于同全球领导者竞争。AWS 和 Azure 能带来软件生态、企业工具和采购熟悉度， 这些能力 Yotta 无法原生复制；所以 Yotta
              往往选择与它们合作，而不是试图在通用公有云里取代它们。Equinix 和 Digital Realty 是另一类威胁。它们并不是完美的本土主权替代品，但仍然定义了世界级互联、园区质量和 AI
              就绪主机托管规模该是什么样。 这会影响企业采购：即便买方最终想要主权或驻留方案，也会拿服务质量与跨国标准相比。实践上，这意味着 Yotta 不该试图靠无处不在的广度取胜。 它需要在本土控制、公共部门背书或专属本土
              GPU 访问权足以压过全球云栈吸引力的场景里赢。与此同时，Yotta 的运营精细度门槛也被抬高： 买方可以接受更窄的地理覆盖，但在关键场景下仍会期待接近跨国标准的服务质量和生态顺滑度。
