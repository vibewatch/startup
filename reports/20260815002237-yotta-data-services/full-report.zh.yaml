      - number: '2.2'
        title: 政府、受监管企业、初创公司和超大规模云外溢，各自走不同采用路径
        blocks:
          - type: paragraph
            body: >-
              印度主权 AI 市场不是一个单一买方池。政府需求来自 IndiaAI、Meghraj、BHASHINI 等政策背书项目， 数据驻留、合规和公民服务韧性都是明确采购触发点。受监管企业需求不同：这些客户想采用
              AI，又不能丢掉数据控制和可审计性， 所以 Yotta 与 Microsoft、IBM 的集成，比一个普通机柜故事更重要。初创公司和研究人员处在客单价光谱另一端， 但 Innovators Club 和
              IndiaAI 支持的访问路径说明它们仍有战略价值：它们能制造产品拉力和未来扩张账户， 又不迫使买方先拥有硬件。最后一块是超大规模云外溢和全球 AI 需求。CNBC、NVIDIA 和 Yotta
              自身口径都指向一点： 印度已经大到某些工作负载需要本地 GPU 容量，无论原因是时延、主权还是容量稀缺。关键在于，Yotta 不必处处打败超大规模云厂商；
              它需要赢下那些本土控制区，在那里超大规模云的经济性或治理并不完美。
