      - number: '3.4'
        title: Yotta 的护城河真实但有条件：在主权 AI 里最稳，在伙伴或触达主导处变弱
        blocks:
          - type: paragraph
            body: >-
              证据指向一条真实但有条件的护城河。主权公共部门 AI、本土 GPU 稀缺和混合控制叙事交汇处，Yotta 看起来最强。 IndiaAI Mission、Meghraj、BHASHINI、IBM、Microsoft
              以及 NVIDIA 相关容量，都在强化这个楔子。同一组证据也显示护城河会在哪里变薄。 Yotta 在软件和芯片栈的重要部分依赖合作伙伴，缺少 Nxtra 的边缘和电信触达，也无法匹配 AWS 或 Azure
              的原生广度。 市场结构让赌注更高，而不是更低。印度市场仍在扩张，但 GRI 的整合逻辑暗示，少数主导运营商会拿走大部分持久价值。 因此，只有当 Yotta 持续把战略公告转化为可靠投产容量和可复制客户胜利时，它的
              AI 优先定位才有吸引力。 如果电力、执行或合作伙伴集中度滑坡，更多元化的对手会准备接走份额。决定性证据应是重复赢单，并且续约靠经济性而不是一次性主权定位。
