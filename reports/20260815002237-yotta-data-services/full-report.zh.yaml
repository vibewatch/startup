      - number: '1.4'
        title: 2025-2026 里程碑显示，公司正从大型设施转向国家级主权 AI 基础设施
        blocks:
          - type: paragraph
            body: >-
              Yotta 当前动能更像一串相互强化的里程碑，而不是某一轮孤立融资。2025 年初进入 IndiaAI Mission 入选名单， 让 Yotta 进入政府背书的算力栈；公司披露了 9,216 块 GPU
              承诺，并明确声称拿到该任务先进算力超过一半。从那里开始， 公开记录继续铺开：BHASHINI 迁上 Yotta 托管的主权基础设施；AWS 与 Yotta 宣布为 NIC 环境部署 Meghraj 2.0
              混合云；IBM 宣布在 Shakti Cloud 上推出主权智能体 AI 栈；2026-02 的 Blackwell 发布则承诺投入超过 $2B， 建设 20,736-GPU 超级集群，其中包含重要的
              NVIDIA DGX Cloud 承购部分。甚至后来的 Gorilla 框架也强调， 这已经不只是印度本地主机托管故事；Yotta 正试图把自己卖成稀缺 AI 容量平台，同时具备主权需求和全球需求意义。
              弱点不在于缺少动作，而在于客户数、集中度、完整审计收入等关键封面指标，相比估值叙事规模仍披露不足。
