chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、运营基地，以及为什么 Yotta 不像普通印度数据中心房东
        blocks:
          - type: paragraph
            body: >-
              最准确的当下描述不是「Yotta 运营数据中心」这么简单。公司公开材料一贯把它定义为总部位于孟买的主权 AI 和云基础设施平台，目标是让印度企业和政府机构在本土控制敏感工作负载。投资者关系页面把 Tier III
              和 Tier IV 园区、Yntraa 主权云、Shakti GPU 云放进同一个体系；官网和 Microsoft 落地页也反复强调同一条主权逻辑： 基础设施托管在印度，受印度监管控制，同时性能足以承接现代 AI
              工作负载。这个定位很关键，因为 Yotta 既要和纯主机托管商拉开距离， 也要区别于外国超大规模云厂商。物理版图已经能支撑这个故事。公开设施文件显示，公司在 Navi Mumbai 有旗舰 NM1 Tier IV
              园区， 在 Greater Noida 的版图正在扩大，包括 D1 和 D2 站点；此外还有较小的 GIFT City 节点，以及位于 Guwahati、 面向公共部门的 North-East
              国家数据中心。因此，Yotta 应被当作一体化基础设施平台分析：它的产品栈和算力实际部署在哪里、 怎么部署，无法分开看。
