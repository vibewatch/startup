      - number: '4.3'
        title: 资本充足性才是核心财务问题，不是需求是否存在
        blocks:
          - type: paragraph
            body: >-
              融资依赖位于 Yotta 案例中心。2026-07 的 $150M 融资有帮助；据报道，公司还计划进行 $500M–$600M 的 pre-IPO 轮，并加上类似规模 IPO，这说明资本通道仍然打开。通过
              Cartica/Nasdaq 走向公开市场，也显示管理层在结构性思考融资， 而不是机会主义融资。即便如此，数学仍然苛刻。一个瞄准十亿美元级资本开支、数万块 GPU 和持续园区工程的业务，
              很可能需要远超一轮适中新股融资所能提供的资本。管理层提到家族资本、全球债务、股权稀释和公开市场作为资金来源， 已经隐含承认这一点。由于现金余额、融资设施条款和月度烧钱速度都未披露，投资者还不能估算现金跑道，
              也无法判断如果部署计划、需求或上市时间表滑坡，公司还剩多少融资灵活性。这种不确定性让下行融资情景比上行需求情景更重要。
