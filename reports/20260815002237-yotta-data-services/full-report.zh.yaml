        title: 公开收入增长看起来强劲，但烧钱和资本开支扩张更快
        blocks:
          - type: paragraph
            body: >-
              最强的公开财务证据，来自对 Cartica 相关备案流程的间接报道。EE Times 称，收入从 FY23 约 $22M 增至 FY24 的 $49.2M，并预计 FY25 达到约
              $156M。这是真实的收入加速。但同一报道也显示增长引擎有多昂贵： FY24 净亏损仍约 $52.8M，FY25 净亏损预计扩大到约 $113.4M，同时资本开支接近 $1B。CNBC
              和管理层评论也指向同一方向。 Yotta 不是在优化短期利润；它在把一个巨大的 AI 基础设施投资周期提前拉到当下，GPU 采购是最醒目的成本桶。财务上，
              这意味着公司正在用当前战略相关性，证明远超当前收入基座通常可承受水平的支出合理。
