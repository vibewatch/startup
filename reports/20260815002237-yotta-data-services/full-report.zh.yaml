      - number: '3.2'
        title: 本土同行对 Yotta 的压力更多来自版图、韧性履历和执行规模，而不是主权品牌
        blocks:
          - type: paragraph
            body: >-
              在印度运营商中，每个大型对手都压在 Yotta 投资逻辑的不同弱点上。Nxtra 的优势是覆盖面：这个 Airtel 支持的平台公开宣传 15 个超大规模数据中心、超过 230 MW 电力和 66
              个边缘站点；如果只比触达，Yotta 很难拿下多城市、重边缘的部署。 STT GDC India 和 CtrlS 的意义不同。它们体现了印度主机托管和关键基础设施既有玩家的深度：项目数量大、MW 版图可观、
              韧性评级明确、扩张管线充足。NxtGen 规模更小，但仍是实际 AI 算力对标方，因为它同样在押注与 IndiaAI 相关的 GPU 供给。 Yotta
              对所有这些对手的回答不是广度，而是集中：它想拿下一个高价值楔子，在那里主权 AI、驻留云控制和稀缺本地 GPU 容量， 比原始边缘节点数量或悠久主机托管历史更重要。
