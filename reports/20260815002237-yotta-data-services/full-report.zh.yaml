  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 价值对收入信心、融资可得性和执行可信度最敏感。
    data:
      items:
        - label: 收入 / 利用率信心
          value: 10
          detail: 公允价值最大驱动项。
        - label: 融资可得性
          value: 9
          detail: 扩建取决于资本可得性。
        - label: 执行 / 电力交付
          value: 9
          detail: 实体交付可能拖累增长。
        - label: 治理折价
          value: 7
          detail: 发起方背景影响容忍度。
        - label: 公开市场情绪
          value: 6
          detail: 可比公司估值下调会压缩估值倍数。
        - label: 合作伙伴集中度
          value: 6
          detail: 外部技术栈影响经济性。
    claimRefs:
      - CV023
      - CV024
      - CV025
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 仅基于公开信息的估值区间显示，当前估值需要接近乐观情景才能成立。
    data:
      items:
        - label: 悲观情景
          low: 1.5
          mid: 1.8
          high: 2.1
          unit: USD B
          detail: 融资或交付不及预期。
        - label: 基准情景
          low: 2.2
          mid: 2.5
          high: 2.8
          unit: USD B
          detail: 溢价收窄，但战略价值仍在。
        - label: 乐观情景
          low: 3.2
          mid: 3.6
          high: 4
          unit: USD B
          detail: 路线图落地，披露改善。
        - label: 据报道当前估值
          low: 3.9
          mid: 3.95
          high: 4
          unit: USD B
          detail: ET / CNBC TV18 报道的锚点。
    approximationNotes: 这些区间是基于公开证据的情景区间，不是经审计的内在价值。
    claimRefs:
      - CV001
      - CV010
      - CV011
      - CV012
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 面向投委会的评分卡支持在当前估值上保持谨慎。
    data:
      items:
        - label: 市场吸引力
          value: High
        - label: 护城河韧性
          value: Medium
        - label: 客户韧性
          value: Medium
        - label: 经济性清晰度
          value: Low
        - label: 风险评级
          value: High
        - label: 估值吸引力
          value: Low
    claimRefs:
      - CV015
      - CV032
      - CV039
