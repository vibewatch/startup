      - number: '7.4'
        title: 正确缓释措施可监控，但一旦失效，投资逻辑会很快破裂
        blocks:
          - type: paragraph
            body: >-
              Yotta 案例可投资，是因为关键风险可监控。投资者可以跟踪 GPU 部署是否按时落地，电力和冷却里程碑是否滑坡，
              主权项目是否继续扩张，融资是否按计划关闭，以及治理是否保持平静。它有风险，则是因为同一组因素高度相连。 如果其中两三项同时走错方向，投资逻辑会迅速变弱。因此，正确投资姿态不是回避，而是有纪律：只有在明确杀手条件、
              更严格入场价格纪律，以及一旦基础设施或融资执行落后于故事就愿意离场的前提下，才可支撑。简言之， Yotta 的风险可理解、也不隐藏——但它们很大、彼此相关，并且位于投资结果中心。有纪律的投资者可以承受高风险；
              真正打破案例的是未监控或复合化风险。这就是为什么可监控性几乎和绝对起始风险水平同样重要。
            claimRefs:
              - CR027
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
          - type: table
            tableRef: TR005
