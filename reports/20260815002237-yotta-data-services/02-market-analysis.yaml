  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "India's AI and data-center market is moving from a cloud-capacity growth story to an execution-constrained sovereign-compute buildout. Third-party market research and policy documents show a country that had already crossed roughly 1.5-1.6 GW of operational data-center capacity by late 2025, was carrying a 3.1 GW development pipeline and 10.5 GW land-stage potential by mid-2026, and was simultaneously wrestling with power, cooling, and talent constraints that favor operators able to combine campus delivery, sovereign compliance, and GPU access. Yotta fits the highest-growth pockets of that market\u2014government, regulated enterprise, hyperscaler spillover, and startup model builders\u2014but its upside depends on solving energy and execution bottlenecks faster than both global hyperscalers and domestic peers."
  },
  "sections": [
    {
      "id": "boundary-and-size",
      "title": "The relevant market is sovereign compute plus high-density campus capacity, not generic Indian software TAM",
      "body": "The first discipline in sizing Yotta\u2019s opportunity is defining what it is not. Yotta does not need India\u2019s entire cloud or software market to be enormous in order to matter; it needs the subset of spending tied to sovereign cloud control, high-density GPU infrastructure, regulated hybrid cloud, and hyperscale-style campus delivery to grow fast enough to support its capital intensity. Third-party market work says that condition already exists. CBRE put India\u2019s operational stock at about 1,530 MW by the first nine months of 2025, while Cushman & Wakefield rounded the market to roughly 1.6 GW in 2026 and highlighted a further 3.1 GW under construction or planned with 10.5 GW at the land stage. Those figures are not revenue TAM, but they do prove an infrastructure market that is already large and still supply hungry. Just as important, India remains underpenetrated on a people-per-MW basis and highly concentrated in a handful of metros, which means growth can come both from sheer demand expansion and from geographic broadening as AI workloads diversify.",
