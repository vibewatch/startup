      "id": "drivers-and-policy",
      "title": "Policy tailwinds are real, but they matter because they convert into paid compute demand, not because they sound strategic",
      "body": "India\u2019s policy framework is unusually relevant to Yotta because it is being expressed through actual compute procurement rather than only broad political rhetoric. PIB and parliamentary materials show an IndiaAI program designed to mobilize private-sector GPU supply, with an initial 10,000-GPU target, 14,517 GPUs already offered by empanelled bidders, and a pricing mechanism that included roughly Rs 115 per GPU hour average rates with support of up to 40%. Market research also says the state is becoming more supportive of large-scale digital infrastructure more broadly: GRI highlighted new safe-harbour provisions and a 20-year tax holiday for certain foreign cloud workloads, while Cushman tied India\u2019s long-run data-center appeal to strong development pipelines and growing electricity production. For Yotta, the significance is practical. These policies shorten the time between campus build and paid utilization by subsidizing domestic demand, validating sovereign infrastructure, and making India more attractive to both local and foreign workloads. They do not eliminate execution risk, but they clearly improve the demand backdrop for companies that can actually deliver capacity.",
