    "number": 1,
    "title": "Company Overview",
    "summary": "Yotta Data Services has emerged from the Hiranandani ecosystem as India’s best-documented domestic sovereign AI and data-center challenger, combining Tier III/Tier IV campuses, Shakti GPU cloud, and explicit government-facing sovereignty positioning. Public evidence supports a sharp 2025-2026 acceleration from IndiaAI Mission empanelment and AWS/IBM/BHASHINI partnerships to a $150 million July 2026 primary raise at a $3.9 billion valuation, but disclosure still lags on audited financials, customer concentration, and the exact governance and ownership stack behind the pre-IPO story."
  },
  "sections": [
    {
      "id": "identity-and-footprint",
      "title": "Identity, operating base, and why Yotta looks different from a normal Indian data-center landlord",
      "body": "The cleanest present-tense description of Yotta is not simply that it runs data centers. Its current public materials consistently frame it as a sovereign AI and cloud infrastructure platform headquartered in Mumbai and built to give Indian enterprises and government agencies local control over sensitive workloads. The investor-relations page ties together Tier III and Tier IV campuses, Yntraa sovereign cloud, and Shakti GPU cloud under one umbrella, while the homepage and Microsoft landing page keep returning to the same sovereignty thesis: Indian-hosted infrastructure, Indian regulatory control, and enough performance to compete for modern AI workloads. That positioning matters because Yotta is trying to differentiate itself both from pure colocation providers and from foreign hyperscalers. The physical footprint now supports that story. Public facility documentation shows a flagship NM1 Tier IV campus in Navi Mumbai, a growing Greater Noida footprint that includes the D1 and D2 sites, a smaller GIFT City node, and the public-sector North-East national data center in Guwahati. The result is a company that should be analyzed as an integrated infrastructure platform whose product stack is inseparable from where and how compute is physically deployed.",
