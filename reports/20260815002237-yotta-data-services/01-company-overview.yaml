    {
      "id": "capital-and-disclosure",
      "title": "Capital formation has accelerated sharply, but the public numbers still come through a narrow disclosure funnel",
      "body": "The company-overview record is strongest when it comes to capital ambition and weakest when it comes to fully audited transparency. Economic Times reported that Yotta raised about $150 million of primary capital in July 2026 at a $3.9 billion valuation with no promoter sell-down, while Bloomberg and CNBC TV18 described a follow-on pre-IPO process that could add another $500 million to $600 million before a public listing. At the same time, the legacy U.S. route is still visible in the 2025 Cartica materials, which documented an effective F-4 for a Nasdaq path under the YTTA ticker. That combination implies strategic flexibility rather than a single fixed listing path. The most useful financial disclosure currently comes indirectly, through EE Times’ reporting on filing-linked projections rather than through a conventional management discussion: roughly $49.2 million of 2024 revenue, a 2025 revenue projection of $156 million, a still-meaningful 2024 net loss, and approximately $1 billion of expected 2025 capex. Those numbers are directionally useful because they show Yotta as a company leaning aggressively into AI infrastructure before public listing, but they are still not a substitute for audited statements, cohort economics, or a cap-table schedule robust enough for late-stage underwriting.",
