  topStrengths:
    - Real sovereign-AI and domestic GPU infrastructure positioning in a strategically important Indian market.
    - Visible product proof across campuses, sovereign cloud, hybrid integrations, and AI capacity.
    - Named customer and public-sector references show the business is beyond pilot-stage storytelling.
    - Policy alignment through MeitY and IndiaAI increases near-term relevance and demand visibility.
    - A credible path exists to become one of India’s most important AI infrastructure platforms if execution holds.
  topRisks:
    - Power, cooling, and campus-delivery constraints remain a major execution bottleneck for AI growth.
    - The company remains highly dependent on external financing and a successful capital-markets path.
    - NVIDIA, partner-cloud, and enterprise-software dependencies limit full-stack control.
    - Sponsor governance and reputation risk deserve a persistent valuation discount.
    - The current reported private mark appears ahead of public proof on economics, backlog, and durability.
  unresolvedGaps:
    - Audited unit economics, utilization, backlog, and realized pricing by product line.
    - Cash, debt, covenant, and capex-cadence detail sufficient to judge runway and dilution risk.
    - Customer concentration, renewals, retention, and partner-vs-direct bookings data.
    - Portfolio-wide operating metrics for uptime, incidents, support SLAs, and deployment cadence.
    - Governance package covering board structure, controls, and related-party protections.
