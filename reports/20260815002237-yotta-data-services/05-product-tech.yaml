      ]
    },
    {
      "id": "technical-verdict",
      "title": "The stack looks credible, but diligence still needs software-depth and operating-metric proof",
      "body": "The overall product verdict is favorable. Yotta has enough hard evidence\u2014campuses, compliance, control surfaces, case proof, dated milestones, and partner corroboration\u2014to show that the product is more than a slideware sovereign-cloud story. Where conviction drops is deeper in the software and operating details. Public sources do not provide sufficient evidence on orchestration quality, benchmark performance, support SLAs, incident history, or product-level pricing. As a result, product diligence should focus less on whether Yotta has built something real and more on whether the AI/cloud layer is strong enough to sustain differentiation after competitors narrow the supply gap. In short, the stack is credible today; the enduring technical moat remains only partially proven. The next diligence step should therefore test live usability, operational observability, and API/tooling maturity under representative customer workloads. Until those proofs are available, the right view is that Yotta has assembled a compelling stack, but not yet a fully transparent one.",
      "claimRefs": [
        "CE024",
        "CE031",
        "CE032",
        "CE033",
        "CE034",
        "CE036"
      ],
      "tableRefs": [
        "TE006"
      ]
    }
