      "id": "domestic-peers",
      "title": "Domestic peers pressure Yotta on footprint, resilience history, and execution scale more than on sovereign branding",
      "body": "Among Indian operators, each large rival presses on a different weak spot in Yotta\u2019s thesis. Nxtra\u2019s advantage is breadth: the Airtel-backed platform publicly advertises 15 hyperscale data centers, more than 230 MW of power, and 66 edge locations, which makes it far harder for Yotta to win multi-city edge-heavy deployments on reach alone. STT GDC India and CtrlS matter differently. They show the depth of India\u2019s colocation and critical-infrastructure incumbency: large project counts, sizable MW footprints, rated resilience, and substantial expansion pipelines. NxtGen is smaller, but it is still a real AI-compute comparator because it is also leaning into IndiaAI-linked GPU supply. Yotta\u2019s answer to all of them is concentration rather than breadth: it is trying to own the high-value wedge where sovereign AI, resident cloud control, and scarce local GPU capacity matter more than raw edge count or long colocation history.",
