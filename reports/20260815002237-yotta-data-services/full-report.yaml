      - number: '7.3'
        title: Operational and partner risks remain the hardest to diversify away
        blocks:
          - type: paragraph
            body: >-
              Operationally, the biggest risk is still physical: power, cooling, and delivery capacity for dense AI
              campuses. Multiple independent sources argue that these constraints resolve slowly, and Yotta’s own
              materials implicitly acknowledge the same issue. Even strong site credentials such as NM1 do not eliminate
              the fact that the broader AI buildout depends on scarce utilities, hard engineering, and synchronized
              commissioning. Partner dependencies are similarly structural. Yotta benefits from NVIDIA, IBM, AWS, and
              other relationships, but that also means it does not fully control all important layers of its value
              proposition. These risks are not fatal; they are simply the price of scaling fast in an infrastructure
              market where speed itself creates concentration. That is why delivery evidence and partner economics
              matter more here than generic technology-market optimism. In effect, Yotta is scaling at the frontier
              where physical infrastructure, public policy, and software partnerships all have to work together on
              schedule.
