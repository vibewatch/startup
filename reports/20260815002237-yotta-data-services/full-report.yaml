      - number: '4.3'
        title: Capital adequacy is the central financial question, not whether demand exists
        blocks:
          - type: paragraph
            body: >-
              Funding dependence sits at the center of the Yotta case. The July 2026 $150 million raise is helpful, and
              reported plans for a $500 million-$600 million pre-IPO round plus a similar-sized IPO underline that
              capital access remains open. The public-markets pathway through Cartica/Nasdaq also shows management is
              thinking structurally about funding, not opportunistically. Even so, the math remains demanding. A
              business targeting billion-dollar capex, tens of thousands of GPUs, and continued campus engineering
              likely needs far more capital than one modest primary round can supply. Management has acknowledged this
              implicitly by referencing family capital, global debt, equity dilution, and public markets as funding
              sources. Because cash on hand, facility terms, and monthly burn are undisclosed, investors cannot yet
              estimate runway or judge how much financing flexibility remains if deployment schedules, demand, or
              listing timelines slip. That uncertainty makes downside funding scenarios more important than upside
              demand scenarios.
            claimRefs:
