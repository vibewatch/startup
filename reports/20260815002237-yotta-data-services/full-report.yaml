  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: The visible customer base is broader than a pure colocation story
        blocks:
          - type: paragraph
            body: >-
              Yotta’s public customer evidence spans more than one buyer category. Government and public-sector
              references remain central because they validate sovereignty, compliance, and mission-critical operating
              credibility. But the named proof set also includes enterprise modernization workloads, distributed
              security use cases, and IndiaAI-linked onboarding across academia and startups. That matters because it
              suggests Yotta is not simply renting space to a handful of anchor accounts. Instead, it is trying to
              convert a core infrastructure platform into a broader customer portfolio that mixes government trust,
              enterprise modernization, and AI capacity demand. The strongest caveat is that the public record is much
              better at naming the categories and logos than at quantifying how many accounts sit inside each category.
              The visible mix also helps explain why Yotta spends so much time on sovereignty, uptime, and managed
              execution rather than only on abstract cloud language. That breadth gives Yotta more strategic optionality
              than a single-segment hosting provider.
