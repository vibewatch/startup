  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The real peer set mixes Indian infrastructure incumbents with hyperscaler substitutes
        blocks:
          - type: paragraph
            body: >-
              Yotta’s competitor set cannot be reduced to Indian colocation companies alone. Buyers choosing Yotta are
              often evaluating three different alternatives at once: domestic data-center operators such as Nxtra, STT
              GDC India, and CtrlS; smaller AI-oriented players such as NxtGen; and global cloud stacks such as AWS and
              Azure that may satisfy many enterprise use cases without a sovereign domestic specialist. That is why
              Yotta’s own positioning matters so much. Its public story is not simply lower-cost racks or generic
              hosting. It is that a domestic operator can combine sovereign cloud control, government-grade residency,
              and large local GPU supply in ways foreign hyperscalers and classic colocation peers cannot match at the
              same time. The competitive question is therefore less about who has the most buildings overall and more
              about who owns the right combinations of campuses, control planes, reference customers, and partner
              ecosystems for India’s AI era.
