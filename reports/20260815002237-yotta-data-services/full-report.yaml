  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: The model is legible, but pricing and realized revenue quality are not
        blocks:
          - type: paragraph
            body: >-
              Yotta’s financial model is conceptually clear even though its published KPIs are not. The company
              discloses three product lines—colocation, cloud and managed services, and AI services—and its public
              customer proof suggests those lines are sold into a blend of government, regulated enterprise, and
              AI-builder demand. That architecture matters because not all Yotta revenue is created equal. Colocation
              and managed services can be sticky and contractual, while GPU-cloud and sovereign AI workloads can
              generate faster growth but may carry more timing, utilization, and hardware-payback risk. Public materials
              explain the packaging and GTM motion well enough to understand the bridge from campuses and GPUs into
              revenue, but they do not disclose realized tariffs, product-level mix, or how much of the AI headline
              translates into durable recurring gross profit. That keeps the story investable in narrative terms, but
              not yet fully underwritable in analytical terms.
