      - number: '1.2'
        title: Leadership is clear, but governance disclosure is still notably thinner than the capital story
        blocks:
          - type: paragraph
            body: >-
              Yotta is not short on visible sponsors; it is short on full governance disclosure. Darshan Hiranandani is
              plainly the strategic sponsor and public chairman, linking Yotta to the Hiranandani group’s land,
              infrastructure, and capital-raising capabilities. Sunil Gupta is just as important operationally because
              the public record shows him as co-founder, CEO, and the lead narrator for Yotta’s GPU, IPO, and sovereign
              cloud ambitions. His NTT Netmagic background is one of the stronger founder-market-fit signals in the case
              because it ties Yotta to a proven Indian data-center operating lineage rather than only real-estate
              capital. Niranjan Hiranandani’s chairman-emeritus label and Saurabh Bharat’s finance role add sponsor
              continuity and treasury depth, but they do not solve the main governance diligence problem: public
              materials still do not give a clean board map, committee structure, or exact sponsor-versus-minority
              ownership breakdown. The sponsor-level controversy around Darshan Hiranandani’s role in the Mahua Moitra
              affair does not prove an operating issue inside Yotta, yet it is still a reusable governance marker
              because it raises questions about judgment, reputational spillover, and how much sponsor risk investors
              are underwriting alongside a fast-scaling infrastructure asset.
