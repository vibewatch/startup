      - number: '4.4'
        title: The verdict is attractive strategic momentum but still incomplete financial proof
        blocks:
          - type: paragraph
            body: >-
              Yotta’s public financial picture is credible enough to support a growth thesis and too incomplete to
              support a hard underwriting call. The company appears to have genuine demand, a more legible revenue model
              than many infrastructure stories, and a real chance to turn sovereign AI positioning into durable
              enterprise relevance. It also appears to be financing scale far ahead of full disclosure maturity.
              Investors still lack the basic decision inputs that matter most: product-level revenue mix, booked
              backlog, gross margin, utilization, realized GPU pricing, customer concentration, debt burden, and runway.
              Without those, the right conclusion is not that the business is weak; it is that the public evidence
              mostly proves strategic ambition and operating momentum, while leaving margin durability and self-funded
              scale unresolved. For an investment committee, financial diligence should therefore focus less on market
              demand and more on whether current contracts can generate acceptable payback on the capital now being
              deployed. The disclosures now point to multiple monetization lanes, but still not to audited economic
              quality at the lane level.
