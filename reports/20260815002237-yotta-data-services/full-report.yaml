  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: The relevant market is sovereign compute plus high-density campus capacity, not generic Indian software TAM
        blocks:
          - type: paragraph
            body: >-
              The first discipline in sizing Yotta’s opportunity is defining what it is not. Yotta does not need India’s
              entire cloud or software market to be enormous in order to matter; it needs the subset of spending tied to
              sovereign cloud control, high-density GPU infrastructure, regulated hybrid cloud, and hyperscale-style
              campus delivery to grow fast enough to support its capital intensity. Third-party market work says that
              condition already exists. CBRE put India’s operational stock at about 1,530 MW by the first nine months of
              2025, while Cushman & Wakefield rounded the market to roughly 1.6 GW in 2026 and highlighted a further 3.1
              GW under construction or planned with 10.5 GW at the land stage. Those figures are not revenue TAM, but
              they do prove an infrastructure market that is already large and still supply hungry. Just as important,
              India remains underpenetrated on a people-per-MW basis and highly concentrated in a handful of metros,
              which means growth can come both from sheer demand expansion and from geographic broadening as AI
              workloads diversify.
