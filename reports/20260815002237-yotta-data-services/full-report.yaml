      - number: '7.4'
        title: The right mitigations are monitorable, and the thesis can break quickly if they fail
        blocks:
          - type: paragraph
            body: >-
              What makes the Yotta case investable is that the key risks are monitorable. Investors can track whether
              GPU deployments land on time, whether power and cooling milestones slip, whether sovereign programs
              continue to expand, whether financing closes on schedule, and whether governance stays quiet. What makes
              it risky is that those same factors are tightly linked. If two or three move the wrong way at once, the
              thesis weakens quickly. The correct investment posture is therefore disciplined rather than avoidant:
              supportable only with explicit kill criteria, tighter entry discipline, and a willingness to walk away if
              infrastructure or financing execution falls behind the story. In short, Yotta’s risks are understandable
              and not hidden—but they are also large, correlated, and central to the investment outcome. A disciplined
              investor can live with high risk; what breaks the case is unmonitored or compounding risk. That is why
              monitorability matters nearly as much as the absolute starting risk level.
