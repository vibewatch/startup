      - number: '8.3'
        title: The current mark only works if Yotta executes something close to the bull case
        blocks:
          - type: paragraph
            body: >-
              A fair case can still be made for Yotta approaching the current mark—but only under a demanding set of
              assumptions. The company would need to land its GPU roadmap, preserve financing flexibility, expand
              enterprise proof beyond marquee logos, and improve disclosure enough that investors can underwrite unit
              economics rather than only strategic narrative. In that world, sovereign-AI optionality and India
              infrastructure scarcity could justify a valuation meaningfully above mature data-center peers. The problem
              is that this is not today’s evidence set. Today’s evidence set supports the possibility of the bull case,
              not its probability. For that reason, the current reported mark looks like a price that already assumes
              success more than a price that pays investors for underwriting uncertainty. Investors therefore need to
              separate respect for strategic relevance from willingness to pay a full-scenario price. Until then, the
              current price leaves too little room for ordinary execution variance.
            claimRefs:
              - CV012
              - CV037
              - CV018
              - CV019
              - CV020
          - type: table
