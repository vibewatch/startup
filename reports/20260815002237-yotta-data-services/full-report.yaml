        title: Named customer proof is real and mostly production-oriented
        blocks:
          - type: paragraph
            body: >-
              The named proof table is stronger than many private infrastructure companies disclose publicly. BARC, GFL,
              ITW, NIC, and Matrix each show a distinct workload pattern: uptime-sensitive data infrastructure,
              performance-focused modernization, ERP migration, sovereign public-sector infrastructure, and distributed
              security operations. These are not five versions of the same logo slide. They collectively suggest Yotta
