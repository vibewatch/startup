      - number: '8.4'
        title: 'Recommendation: monitor and demand better price or better proof'
        blocks:
          - type: paragraph
            body: >-
              The investment recommendation is therefore monitor / disciplined pass at the current reported valuation.
              That is not a negative call on the company’s strategic importance. It is a judgment that the price already
              demands too much confidence in financing, execution, and governance outcomes that remain only partly
              disclosed. The view can improve from here. Better unit-economic disclosure, stronger evidence on renewals
              and backlog, cleaner balance-sheet transparency, and on-time deployment proof could justify a narrower
              discount. Until then, the right discipline is to respect the asset, respect the market opportunity, and
              resist the urge to pay a bull-case price for a business that still needs base-case proof. The best outcome
              for an investor today is either better evidence or a better price, and ideally both. That asymmetry is
              exactly why patience is the better current strategy. Today, restraint wins.
