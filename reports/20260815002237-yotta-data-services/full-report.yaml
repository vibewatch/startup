      - number: '2.4'
        title: >-
          The market is execution constrained: power, cooling, and delivery discipline now matter as much as demand
          itself
        blocks:
          - type: paragraph
            body: >-
              The most important negative insight from current market research is that India’s AI infrastructure boom is
              no longer demand constrained. It is execution constrained. Multiple sources now make the same point from
              different angles: power availability has displaced land as the first-order bottleneck, transmission and
              last-mile delivery matter, transformer lead times are long, renewable integration needs storage, and the
              shift to liquid cooling raises both engineering complexity and obsolescence risk. GRI and ET EnergyWorld
              show why this matters for Yotta specifically. AI workloads are denser than legacy enterprise racks by an
              order of magnitude, which means the winners will be the operators who can commission, cool, and power
              high-density campuses reliably rather than merely announce them. That is also why inference is such an
              important twist in the market. If inference ultimately becomes about half of demand, then metro-adjacent,
              sovereign, low-latency supply could stay scarce even as remote training clusters rise elsewhere. Yotta
              therefore sits in an attractive market pocket, but only if it can turn announcements into resilient
              commissioned capacity faster than its peers and without power bottlenecks eroding returns.
            claimRefs:
