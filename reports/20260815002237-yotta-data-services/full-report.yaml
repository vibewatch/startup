      - number: '2.2'
        title: >-
          Government, regulated enterprise, startups, and hyperscaler spillover each arrive through different adoption
          paths
        blocks:
          - type: paragraph
            body: >-
              India’s sovereign AI market is not one buyer pool. Government demand comes through policy-backed programs
              such as IndiaAI, Meghraj, and BHASHINI, where data residency, compliance, and citizen-service resilience
              are explicit purchase triggers. Regulated enterprise demand is different: those buyers need AI adoption
              without losing control of data or auditability, which is why Yotta’s Microsoft and IBM integrations matter
              more than a commodity rack story. Startups and researchers sit at the opposite end of the ticket-size
              spectrum, but the Innovators Club and IndiaAI-supported access paths show why they still matter
              strategically: they create product pull and future expansion accounts without forcing buyers to own
              hardware upfront. The final pocket is hyperscaler spillover and global AI demand. CNBC, NVIDIA, and
              Yotta’s own messaging all point to India becoming large enough that some workloads need local GPU
              capacity, whether for latency, sovereignty, or capacity scarcity reasons. That matters because Yotta does
              not need to beat hyperscalers everywhere; it needs to win in the local control zones where hyperscaler
              economics or governance are less perfect.
