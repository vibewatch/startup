      - number: '7.2'
        title: Regulatory and governance risk are manageable today, but not benign
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a nuanced view on regulatory and governance risk. On the positive side, MeitY and
              IndiaAI participation show real regulatory acceptance, and Yotta appears aligned with sovereign-AI
              priorities rather than in conflict with them. On the negative side, that alignment can itself become a
              dependence if policy design or government spending priorities shift. Governance risk also cannot be
              ignored simply because there is no visible Yotta-specific enforcement event in the public record. Family
              control and Darshan Hiranandani’s profile create reputational linkage that could quickly become relevant
              in enterprise procurement or capital-markets confidence if controversy escalates. In practice, this means
              policy and governance do not break the thesis today, but they do justify a permanently elevated watch
              level. The relevant question is therefore not whether risk exists, but whether governance and disclosure
              discipline are maturing quickly enough for a capital-intensive public-markets story. That ongoing
              watchfulness should be treated as structural, not temporary.
