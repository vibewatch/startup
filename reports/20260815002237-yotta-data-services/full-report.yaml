  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The headline problem is price, not relevance
        blocks:
          - type: paragraph
            body: >-
              Yotta is strategically relevant and financially difficult at the same time. The public evidence now
              supports a real market, a real product stack, and real customer proof. What it does not support is paying
              almost any price for that exposure. The reported $3.9 billion to $4.0 billion mark sits on top of limited
              disclosure, large capex needs, financing dependency, and correlated governance / execution risks. That
              makes the central valuation question simple: is the current mark already discounting most of the upside?
              The answer from public comps is yes. Even allowing for a meaningful sovereign-AI premium, Yotta screens
              expensive relative to both mature data-center platforms and a high-growth AI infrastructure comp. In
              effect, investors are being asked to pay now for a future state that still needs meaningful proof. That
              does not negate Yotta’s strategic importance; it simply means valuation discipline must do more work than
              enthusiasm. For now.
