  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: The risk frame is concentrated rather than diffuse
        blocks:
          - type: paragraph
            body: >-
              Yotta’s risk profile is not dominated by small execution noise. It is dominated by a handful of
              concentrated dependencies that can each matter a lot: India power delivery, sponsor governance,
              NVIDIA-linked supply, continued financing access, and policy-aligned sovereign demand. This concentration
              cuts both ways. It is part of why the company can differentiate itself so clearly in the current market,
              but it also means failures do not stay local. A power delay can hurt delivery, which hurts revenue timing,
              which hurts financing flexibility, which hurts valuation. The risk frame is therefore best understood as a
              transmission problem, not a checklist problem. Investors should assume correlation among these risks
              unless later diligence proves they are independently manageable. The payoff from this framing is that it
              directs diligence toward a few decisive bottlenecks instead of diluting attention across minor operating
              details. Correlation matters here.
            claimRefs:
