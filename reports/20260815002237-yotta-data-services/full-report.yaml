      - number: '6.4'
        title: Customer quality is promising, but concentration and repeatability remain the key asks
        blocks:
          - type: paragraph
            body: >-
              The customer verdict is favorable on quality and unresolved on breadth. Yotta has enough named production
              proof to show that the company can win and operate serious accounts across public-sector and enterprise
              contexts. What remains unproven is concentration and repeatability. The customer story could represent the
              front edge of a diversified installed base, or it could be overly anchored on a small number of marquee
              references and procurement-linked programs. Those two possibilities lead to very different underwriting
              outcomes. Before taking a hard view, investors should request active-account counts, segment revenue mix,
              top-customer exposure, renewal data, and partner-sourced bookings. Until then, Yotta’s customer evidence
              supports strategic credibility, but not a clean durability score. In other words, the customer story is
              good enough to validate relevance, but not yet complete enough to validate resilience. That is a
