      - number: '6.3'
        title: Durability logic is plausible, but denominator data is still missing
        blocks:
          - type: paragraph
            body: >-
              Yotta’s expansion logic is intuitive. A customer that trusts Yotta for hosting or managed cloud could
              plausibly buy adjacent network, AI, surveillance, or support services later, and the One Yotta portal
              hints at an operational surface that can reinforce post-sale stickiness. The challenge is that none of the
              usual durability metrics are public. There is no NRR, GRR, renewal rate, customer-count trend, or
              satisfaction score. As a result, the right conclusion is not that durability is weak; it is that
              durability is only inferable. Investors can see credible cross-sell pathways and a maturing support loop,
              but they still cannot tell whether flagship references are repeatable across a broad installed base or
              concentrated in a relatively small set of high-profile accounts. A strong reference set can coexist with
              weak portfolio retention if the company is still early in scaling repeatable motions, which is exactly why
              cohort evidence matters here. The absence of denominator data is therefore the central customer diligence
              blocker, not the absence of logos.
