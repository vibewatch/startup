companyProfile:
  summary: >-
    Yotta Data Services is a Mumbai-based, Hiranandani-backed infrastructure company that combines hyperscale campuses,
    sovereign cloud controls, AI GPU capacity, connectivity, and managed services for Indian enterprises and government
    buyers. The business has become one of the most visible domestic AI-infrastructure platforms in India, but its
    public financial disclosure remains sparse relative to the valuation now being discussed in pre-IPO markets.
  foundedDate: '2019-01-01'
  founders:
    - name: Sunil Gupta
      role: Co-founder, Managing Director & CEO
      background: >-
        Veteran data-center and cloud operator who is the main public operating voice for Yotta's campus, sovereign
        cloud, and AI buildout.
      claimRefs:
        - CO008
    - name: Darshan Hiranandani
      role: Co-founder / Chairman-linked sponsor
      background: >-
        Hiranandani-family executive whose sponsor network links Yotta to the broader Nidar / Hiranandani ecosystem and
        also introduces governance sensitivity.
      claimRefs:
