      - number: '8.2'
        title: Comparable logic points to a lower base case than the current reported mark
        blocks:
          - type: paragraph
            body: >-
              No comp set is perfect, but the directional message is clear. Equinix and Digital Realty are the best
              mature infrastructure benchmarks, while CoreWeave is the best public high-growth AI-infrastructure
              benchmark. Yotta’s implied forward revenue multiple of about 25x sits far above all three. That does not
              mean Yotta is overvalued in every future state. It does mean the current price is already asking investors
              to underwrite a large share of the upside case. A premium is reasonable for India-specific sovereign-AI
              scarcity and faster growth. An unlimited premium is not, especially when Yotta still lacks the disclosure
              depth and diversification of public peers. That is why the base case should sit materially below the
              reported mark. The comparison does not have to be perfect to be informative; it only has to show whether
              the gap is trivial or large, and here it is clearly large. For an investor, that is the relevant takeaway:
              the premium is not modest, it is substantial. Price already assumes substantial success.
            claimRefs:
