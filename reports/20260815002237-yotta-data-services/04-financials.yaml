    {
      "id": "capital-adequacy-and-financing-dependence",
      "title": "Capital adequacy is the central financial question, not whether demand exists",
      "body": "Funding dependence sits at the center of the Yotta case. The July 2026 $150 million raise is helpful, and reported plans for a $500 million-$600 million pre-IPO round plus a similar-sized IPO underline that capital access remains open. The public-markets pathway through Cartica/Nasdaq also shows management is thinking structurally about funding, not opportunistically. Even so, the math remains demanding. A business targeting billion-dollar capex, tens of thousands of GPUs, and continued campus engineering likely needs far more capital than one modest primary round can supply. Management has acknowledged this implicitly by referencing family capital, global debt, equity dilution, and public markets as funding sources. Because cash on hand, facility terms, and monthly burn are undisclosed, investors cannot yet estimate runway or judge how much financing flexibility remains if deployment schedules, demand, or listing timelines slip. That uncertainty makes downside funding scenarios more important than upside demand scenarios.",
      "claimRefs": [
        "CI011",
        "CI012",
        "CI017",
        "CI018",
        "CI019",
        "CI020",
        "CI033",
        "CI028",
        "CI034"
      ],
      "tableRefs": [
        "TI004"
      ]
    },
    {
      "id": "financial-verdict-and-blockers",
      "title": "The verdict is attractive strategic momentum but still incomplete financial proof",
      "body": "Yotta\u2019s public financial picture is credible enough to support a growth thesis and too incomplete to support a hard underwriting call. The company appears to have genuine demand, a more legible revenue model than many infrastructure stories, and a real chance to turn sovereign AI positioning into durable enterprise relevance. It also appears to be financing scale far ahead of full disclosure maturity. Investors still lack the basic decision inputs that matter most: product-level revenue mix, booked backlog, gross margin, utilization, realized GPU pricing, customer concentration, debt burden, and runway. Without those, the right conclusion is not that the business is weak; it is that the public evidence mostly proves strategic ambition and operating momentum, while leaving margin durability and self-funded scale unresolved. For an investment committee, financial diligence should therefore focus less on market demand and more on whether current contracts can generate acceptable payback on the capital now being deployed. The disclosures now point to multiple monetization lanes, but still not to audited economic quality at the lane level.",
      "claimRefs": [
        "CI022",
        "CI035",
        "CI036",
        "CI037",
        "CI021"
      ],
      "tableRefs": [
        "TI005"
      ]
    }
