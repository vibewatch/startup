    {
      "id": "growth-vs-burn",
      "title": "Public revenue growth looks strong, but burn and capex scale even faster",
      "body": "The strongest published financial evidence comes indirectly through reporting on the Cartica-linked filing process. EE Times said revenue grew from about $22 million in FY23 to $49.2 million in FY24 and was forecast to reach about $156 million in FY25. That is real top-line acceleration. But the same reporting also showed how expensive the growth engine is: FY24 net loss was still roughly $52.8 million and FY25 net loss was forecast to widen to about $113.4 million while capex approached $1 billion. CNBC and management commentary point in the same direction. Yotta is not trying to optimize near-term earnings; it is pulling forward a massive AI-infrastructure investment cycle, with GPU procurement the most visible cost bucket. Financially, this means the company is using current strategic relevance to justify spending levels that far exceed what its present revenue base would normally support.",
      "claimRefs": [
        "CI005",
