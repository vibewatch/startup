chapter:
  number: 4
  title: Financials
  summary: >-
    Electra is a pre-commercial deep-tech company with no disclosed revenue, ARR, or gross margin; its financial story
    is entirely one of capital formation and future monetization. The company has raised at least $271 million in equity
    across two disclosed rounds ($85M Series A in 2022; $186M Series B in April 2025), supplemented by a $50M
    Breakthrough Energy Catalyst grant, an $8M Colorado CITCO tax credit, and a $30M JPMorgan venture debt facility
    closed in early 2026. A conflicting Trellis figure reporting $214M total raises as of October 2025 likely reflects
    an intermediate state before the Series B final close. The company has 130+ employees and is building a 500-tonne/year
    demonstration facility targeting mid-2026 in Jefferson County, Colorado, while targeting commercial-scale production
    by 2029. Revenue quality cannot be underwritten from public sources alone; the highest-priority diligence asks are
    current cash, monthly burn, 2026-2029 capex plan, and per-agreement economics on the advanced purchase orders.

sections:
  - id: SEC401
    title: Revenue model and monetization architecture
    body: >-
      Electra's revenue model is pre-commercial but clearly defined: the company produces high-purity (99%) iron
      through a low-temperature electrochemical-hydrometallurgical process, and plans to sell that iron product to
      steelmakers and industrial buyers. Its primary revenue stream will be iron product sales — iron that can be fed
      into electric arc furnaces (EAFs) for green steel production, used in battery-grade applications, or delivered to
      specialty-steel distributors. A secondary revenue stream is environmental attribute credits (EACs): Meta has
      agreed to purchase the EACs associated with the emissions reductions from Electra's demonstration facility output,
      establishing a precedent for decarbonization-conscious large buyers. A third emerging stream is co-mineral sales —
      Electra's process extracts silica and alumina during refining, which can be monetized in adjacent industrial
      markets; a recent commercial hire (Director of Co-Mineral Sales) on the greenhouse job board signals this is
      moving beyond concept. No list pricing, realized revenue, or recognized revenue figures are publicly disclosed, in
      keeping with the company's private status and pre-commercial stage. The company's own website describes its
      product as carrying "no green premium," meaning pricing is claimed to be competitive with conventional iron from
      coal-fired blast furnaces, but there is no independent validation of this cost claim at scale. Any revenue
      recognition from the advanced purchase agreements signed with Nucor, Toyota Tsusho, INTERFER, and POSCO would
      follow actual delivery of iron product — none of these agreements are reported to include any upfront cash payment
      visible in public sources.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
    tableRefs:
      - TI001
      - TI002
    figureRefs:
