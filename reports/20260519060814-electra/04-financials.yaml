  - id: SEC403
    title: Capital adequacy and runway
    body: >-
      The combination of a $186M Series B (closed April 2025), a $50M Breakthrough Energy Catalyst grant, an $8M
      state tax credit, and a $30M JPMorgan venture debt facility gives Electra a substantial but not unlimited runway
      to build its demonstration facility and prepare for commercial-scale deployment. Cash on hand and monthly burn are
      not publicly disclosed. With 130+ employees on the Colorado Energy Office payroll as of May 2025, and an
      aggressive manufacturing build-out underway in Jefferson County, the company's cash consumption is likely
      significant. Based on comparable deep-tech hardware companies at a similar stage, typical burn rates range from
      $25M to $50M per year for organizations of this scale and capital intensity; at 130+ headcount and active
      facility construction, the upper end of that range is plausible. At that pace, the aggregate inflows since April
      2025 would provide an estimated 3–5 years of runway from mid-2025, reaching approximately late 2028 to mid-2030
      — consistent with the company's stated 2029 commercial facility target. The JPMorgan venture debt facility ($30M,
      closed March 2026) explicitly targets planning, engineering, and preparation for the first commercial facility,
      suggesting the company is transitioning toward project-finance structures rather than relying purely on further
      equity rounds. However, the company is likely to require additional capital for the commercial-scale facility,
      which Canary Media reported would be of "undisclosed size and capacity" with no announced project-finance
      structure. Until those parameters are disclosed, capital adequacy for the 2029 commercial build-out remains
      materially uncertain.
    claimRefs:
      - CI015
      - CI016
      - CI017
      - CI018
      - CI019
      - CI020
      - CI021
    figureRefs:
      - FI003

  - id: SEC404
    title: Unit economics and cost structure
    body: >-
      Electra's unit economics are not publicly disclosed and cannot be derived from available sources. The company's
      "no green premium" claim — that its iron will cost the same or less than conventional coal-based iron — is central
      to the investment thesis but has not been independently validated at commercial scale. The process involves
      four main cost inputs: iron ore feedstock, electricity (renewable), reagents (acid solution, hydrometallurgical
      chemicals), and capital equipment (electrowinning modules). A key claimed advantage is the ability to use
      lower-grade ore (down to 35% iron content) that is cheaper and more abundant than the high-grade ore required by
      hydrogen-based direct reduced iron (DRI) processes. Electricity cost is a major variable: the process is designed
      to run on intermittent renewable energy, which can lower cost if paired with low-cost curtailed solar or wind,
      but creates operational complexity. The demonstration facility (500 tonnes/year) is designed to prove out unit
      economics before commercial scale deployment; investor communications suggest the modular design allows cost
      learning across replicated units, similar to the learning curves observed in solar and lithium-ion batteries. On
      the gross margin side, comparable players in nascent green industrial materials (e.g., early-stage FOAK battery
      or green hydrogen producers) typically show negative or near-zero gross margin at demonstration scale, with
      improvement expected only at commercial volumes. No independent engineering or cost study for Electra's process
      has been published. The co-mineral sales (silica, alumina) could offset operating costs but represent a nascent
      revenue stream with undisclosed pricing and market size. Nucor's sustainability data shows that a conventional
      EAF produces steel at approximately 0.77 tonnes CO₂ per tonne, while blast furnaces produce roughly 2 tonnes
      CO₂ per tonne; Electra's iron product is positioned to enable the low-carbon EAF route but the per-tonne iron
      cost versus DRI-grade alternatives has not been publicly benchmarked.
    claimRefs:
      - CI022
      - CI023
      - CI024
      - CI025
      - CI026
      - CI027
      - CI028
      - CI029
      - CI030
    tableRefs:
      - TI003
    figureRefs:
      - FI002

  - id: SEC405
    title: Financial verdict and diligence blockers
    body: >-
      Electra's financial profile is consistent with a pre-commercial deep-tech company that has secured exceptional
      early capital support from strategically aligned investors, but where the decisive financial variables for
      underwriting remain private. Revenue quality is not assessable because there is no revenue. Capital adequacy
      looks strong through 2028 based on inflows, but the 2029 commercial scale-up will likely require an additional
      equity or project-finance round of similar or larger magnitude, and there is no public indication that such
      financing has been arranged. The cost structure is plausible in theory — the process claims low-temperature
      operation and broad ore flexibility — but has not been independently benchmarked. The strategic investor base
      (Nucor, Toyota Tsusho, INTERFER, POSCO, Rio Tinto, BHP, Roy Hill) provides a form of market-side diligence by
      participants with deep domain expertise, which is a positive signal, but investor conviction does not substitute
      for realized margin data. The competing public figures for total capital raised ($214M per Trellis vs $271M per
      press releases) represent a data-quality issue that should be resolved before institutional investment. The
      priority diligence package should include: (1) current cash balance and monthly burn as of May 2026; (2)
      projected capex for Jefferson County demonstration facility and post-2026 commercial facility; (3) per-tonne iron
      economics at demonstration scale including ore cost, power cost, and realized gross margin or expected margin at
      commercial scale; (4) revenue terms for the advanced purchase agreements (pricing, take-or-pay obligations,
      delivery schedule); (5) status of any project-finance structure for the first commercial facility; and (6)
      confirmation of the total equity raised figure.
    claimRefs:
      - CI031
      - CI032
      - CI033
      - CI034
      - CI035
      - CI036
    tableRefs:
      - TI005

