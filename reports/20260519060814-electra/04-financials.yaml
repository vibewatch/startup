  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-gaps
      missingEvidence: Current cash balance, monthly burn rate, and runway calculation as of May 2026
      whyItMatters: Without cash and burn, capital adequacy cannot be assessed for the 2026-2029 path to commercial deployment
      diligencePath: Request CFO-prepared balance sheet and 12-month cash flow projection from data room
      relatedQuestionRefs:
        - QI005

    - type: private-evidence-only
      severity: blocking
      topic: unit-economics
      missingEvidence: Per-tonne economics at demonstration scale — electricity, ore, reagent, and capital costs vs. realized or projected selling price
      whyItMatters: The entire 'no green premium' value proposition cannot be validated without unit economics; gross margin path is unknown
      diligencePath: Request engineering cost model including sensitivity analysis for ore grade, electricity price, and scale
      relatedQuestionRefs:
        - QI011
        - QI012
        - QI002

    - type: private-evidence-only
      severity: material
      topic: purchase-agreements
      missingEvidence: Volume, pricing, take-or-pay structure, and delivery schedule for all signed advanced purchase orders (Nucor, Toyota Tsusho, INTERFER, POSCO)
      whyItMatters: Revenue quality and backlog strength depend on whether agreements have firm minimums or are indicative commitments
      diligencePath: Request copies of all signed purchase and distribution agreements with pricing redacted if needed
      relatedQuestionRefs:
        - QI009
        - QI010
        - QI019

    - type: private-evidence-only
      severity: material
      topic: commercial-capex
      missingEvidence: Capex budget, financing structure, and equity/project-finance status for the first commercial facility (2029 target)
      whyItMatters: Commercial facility is likely the largest capital event in Electra's history; without this plan, the company's long-term capital adequacy is opaque
      diligencePath: Request preliminary project-finance term sheet, DOE/IRA program applications, and preliminary engineering cost estimate for commercial facility
      relatedQuestionRefs:
        - QI008
        - QI026

    - type: conflicting-data
      severity: material
      topic: funding-total
      missingEvidence: Confirmed total equity raised as of the run date, reconciling the $214M (Trellis) and $271M (press releases) figures
      whyItMatters: Discrepancy of $57M is material for valuation analysis and could affect investor understanding of dilution and capital deployed
      diligencePath: Request cap table summary from CFO confirming total equity raised and whether any convertible notes or SAFEs exist
      relatedQuestionRefs:
        - QI003
        - QI024

    - type: private-evidence-only
      severity: material
      topic: venture-debt
      missingEvidence: Debt service terms, covenants, maturity, and any security package on the JPMorgan $30M venture debt facility
      whyItMatters: Venture debt covenants can constrain operating flexibility; maturity timeline affects next financing trigger
      diligencePath: Request term sheet or summary covenant package from CFO
      relatedQuestionRefs:
        - QI007

