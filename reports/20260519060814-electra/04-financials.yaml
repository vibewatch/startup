callouts:
  - calloutType: risk
    title: Pre-commercial revenue with large commercial capex ahead
    body: >-
      Electra has no disclosed revenue and its commercial facility (2029 target) will likely require a financing round
      substantially larger than the Series B. Management's silence on the commercial-facility funding structure is a
      material gap for investors evaluating capital adequacy.
    claimRefs:
      - CI017
      - CI031
      - CI035
      - CI036

  - calloutType: insight
    title: Conflicting total-raises figures ($214M vs $271M)
    body: >-
      Public sources conflict on total equity raised: Trellis (Oct 2025) reports $214M while the disclosed Series A and
      Series B rounds sum to $271M. The most credible resolution is that Trellis captured the Series B at an
      intermediate close (~$129M), giving $85M + $129M = $214M, before the final $186M round closed. Investors should
      confirm the exact total with management and verify whether any convertible instruments or SAFE notes alter the
      count.
    claimRefs:
      - CI009
      - CI013
      - CI014
      - CI037

  - calloutType: strength
    title: Deeply strategic investor base de-risks market adoption
    body: >-
      The Series B investor roster includes Nucor (top US EAF steelmaker), Toyota Tsusho (automotive supply chain),
      INTERFER (European specialty steel), BHP/Rio Tinto/Roy Hill (iron ore mining), and later POSCO (Korean steelmaker
      JDA). These investors have direct financial interest in the success of Electra's commercial product, providing
      credible buy-side commitment signals beyond typical venture capital.
    claimRefs:
      - CI010
      - CI015
      - CI016

  - calloutType: recommendation
