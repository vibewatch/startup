  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value or status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Revenue per tonne iron (list)
        - Not disclosed
        - Low
        - Core pricing input for unit economics model
        - Request list price per tonne and any discount framework for strategic buyers
      - - Ore input cost per tonne iron
        - Not disclosed; likely lower than DRI-grade ore due to use of lower-grade feedstock
        - Low
        - Second largest variable cost after electricity; broad ore range claimed to reduce cost
        - Request ore sourcing plan, contracted ore cost, and grade range used in pilot
      - - Electricity cost per tonne iron
        - Not disclosed; process designed for intermittent renewables (off-peak pricing possible)
        - Low
        - Largest variable operating cost; intermittent profile enables curtailed-energy purchasing
        - Request MWh per tonne iron at pilot scale, contracted or target power cost, and load factor
      - - Reagent and chemical cost per tonne iron
        - Not disclosed; acid solutions are the primary reagent
        - Low
        - Reagent regeneration claimed to reduce cost; extent of regeneration efficiency not disclosed
        - Request reagent cost per tonne iron and regeneration recovery rate
      - - Capital cost per tonne annual capacity
        - Not disclosed for demo facility; modular design claimed to support learning-curve cost reduction
        - Low
        - Capex intensity per tonne determines project-finance viability for commercial facility
        - Request CapEx for 500-tonne/year demo facility and projected CapEx per tonne for first commercial facility
      - - Gross margin at demo scale
        - Not disclosed; likely negative at 500-tonne/year scale
        - Low
        - Demonstration-scale gross margin rarely covers fixed costs; key question is the learning rate to commercial
        - Request pro forma unit economics at demo scale and at initial commercial scale (~50,000 tonnes/year)
      - - Headcount as % of cost structure
        - 130+ employees (confirmed); cost allocation unknown
        - Medium (headcount confirmed by regulatory source)
        - High headcount relative to 500-tonne/year capacity implies high fixed-cost intensity at demo stage
        - Request fully-loaded cost breakdown at demo scale including employee costs, overhead, and facility costs
    notes: >-
      All unit economics metrics are null from public sources; all values above are marked Not Disclosed. Estimates
      of electricity and ore costs are directionally informed by comparable electrowinning processes (copper, zinc)
      and management commentary, not disclosed financial data. Comparable DRI-green-hydrogen facilities show
      negative or near-zero gross margin at first-of-a-kind scale.
    claimRefs:
      - CI022
      - CI023
      - CI024
      - CI025
      - CI026
      - CI027

