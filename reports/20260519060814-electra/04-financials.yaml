    rows:
      - - Iron product sales to EAF steelmakers
        - Per-tonne spot or contract sales of 99%-pure iron to electric arc furnace operators
        - USD per tonne of iron
        - Advanced purchase orders announced with Nucor and POSCO (JDA + investment); demonstration-scale delivery targeting mid-2026
        - "Medium: buyer identity and mechanism confirmed; no pricing or volume disclosed"
        - Request per-tonne pricing, volume commitment, take-or-pay structure, and delivery schedule for all signed agreements
      - - Iron product distribution for automotive and specialty steel
        - Distribution and resale through Toyota Tsusho (automotive) and INTERFER (specialty steel/European market)
        - USD per tonne or distribution margin
        - Toyota Tsusho invested in Series B and announced sales role; INTERFER signed MOU Dec 2024
        - "Medium-low: distribution mechanism confirmed; individual order volumes and pricing are not disclosed"
        - Request contracted volumes, pricing, and whether distribution partners have firm offtake obligations or only best-efforts commitments
      - - Environmental Attribute Credits (EACs)
        - Sale of emissions-reduction certificates linked to clean iron production, purchased by corporate decarbonization buyers
        - USD per EAC or per tonne CO₂e avoided
        - First EAC agreement signed with Meta for the demonstration facility's production
        - "Low-medium: single buyer confirmed; certificate pricing, volume, and whether this scales commercially are unknown"
        - Request EAC price per credit, total expected EAC volume from demonstration facility, and whether Meta agreement is first-right-of-refusal or exhaustive
      - - Co-mineral sales (silica, alumina)
        - Refining process captures co-minerals stripped from ore; sold to industrial buyers in cosmetics, automotive, construction
        - USD per tonne of co-mineral
        - Active hiring for Director of Co-Mineral Sales (2026 job listing); no disclosed revenue or signed buyers
        - "Low: revenue mechanism articulated but no evidence of closed deals or pricing"
        - Confirm whether any co-mineral supply agreements exist; request addressable market sizing and per-tonne economics
    notes: >-
      All revenue streams are pre-commercial as of the run date; no realized revenue, ASP, or margin figures are publicly
      disclosed. Advanced purchase orders from Nucor, Toyota Tsusho, INTERFER, and POSCO are announced but pricing and
      volume terms are private. Meta EAC agreement is the only closed non-equity commercial deal in public sources.
    claimRefs:
