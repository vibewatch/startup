  - id: TI002
    title: Pricing and monetization table
    columns:
      - Pricing lever
      - Status
      - Public evidence
      - Gap or risk
    rows:
      - - Iron product list price per tonne
        - Not disclosed
        - "Company claims 'no green premium' vs. conventional iron; no actual price is published"
        - Cannot underwrite margin without per-tonne price vs. ore + power + reagent costs
      - - Green premium claim (cost parity with blast furnace)
        - Company-claimed; not independently validated
        - Multiple press releases and CEO statements assert cost parity; no third-party cost study available
        - Engineering diligence required to validate process economics at commercial scale
      - - EAC price per tonne CO₂e
        - Not disclosed
        - Meta EAC purchase agreement is the only disclosed buyer; price is private
        - Request EAC pricing terms and whether they reflect voluntary carbon market pricing (~$10–$50/tonne) or bespoke negotiated rate
      - - Volume commitments in purchase agreements
        - Not disclosed
        - Purchase agreements with Nucor, Toyota Tsusho, INTERFER, POSCO described as "advanced purchase orders" or "agreements"; no volumes published
        - Confirm whether contracts have firm minimum-purchase obligations or are indicative/best-efforts
      - - Co-mineral pricing
        - Not disclosed
        - Silica and alumina extraction mentioned as value capture; no pricing or buyer announced
        - Request market pricing benchmarks for industrial silica and alumina and net recovery per tonne of iron produced
    notes: >-
      No list pricing, realized revenue, or realized pricing terms are in the public domain for any revenue stream.
      All pricing analysis is speculative based on market benchmarks and company narrative.
