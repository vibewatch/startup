  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing metric
      - Impact on analysis
      - Exact diligence path
    rows:
      - - Current cash on hand (as of May 2026)
        - Determines actual runway; without this, all runway estimates are based on assumed burn rates
        - Request audited or management-prepared balance sheet as of latest quarter end; minimum ask is cash and cash equivalents line
      - - Monthly operating burn rate
        - Required to size runway and determine when next financing event is needed
        - Request CFO-prepared monthly cash flow model for 2026 actuals and 2027 projections
      - - Capex plan for Jefferson County demo facility (total, spent, remaining)
        - Determines whether the $50M grant plus equity covers demo-facility build-out without overrun risk
        - Request line-item capex budget for demo facility and percent complete vs. budget as of Q1 2026
      - - Revenue terms for all signed purchase agreements
        - Cannot value backlog or revenue quality without pricing, volume, and take-or-pay obligations
        - Request all signed purchase agreements (NDA if needed) including unit pricing, committed volumes, and delivery schedule
      - - Pro forma unit economics at demo scale and first commercial scale
        - Cannot validate 'no green premium' claim or assess path to positive gross margin
        - Request engineering-derived cost model at 500-tonne/year demo scale and first commercial scale (50k+ tonnes/year)
      - - Debt service terms on JPMorgan facility
        - Venture debt covenants and repayment obligations affect capital allocation and future fundraising flexibility
        - Request term sheet or summary of covenant package, maturity, and interest rate on the $30M facility
      - - Capital plan for first commercial facility
        - Largest open financial question; commercial scale likely requires $500M–$2B+ based on green industrial facility comps
        - Request CFO-level discussion of project financing structure (equity, project finance debt, DOE programs) for first commercial facility
