  - id: SEC402
    title: Capital formation and funding chronology
    body: >-
      Electra has assembled a multi-layered capital stack across equity, grants, tax credits, and venture debt. The
      company's Series A, raised in October 2022, brought in $85 million from a diverse investor group including
      Breakthrough Energy Ventures, the Amazon Climate Pledge Fund, BHP Ventures, Temasek, S2G Ventures, Capricorn
      Investment Group, Lowercarbon Capital, Valor Equity Partners, and Baruch Future Ventures. The April 2025 Series B
      raised $186 million and attracted strategic investors from across the iron and steel value chain — including iron
      ore mining companies Rio Tinto, Roy Hill, and BHP's venture arm; steelmakers Nucor and Yamato Kogyo; and
      distribution partners INTERFER Edelstahl Group and Toyota Tsusho. The Series B therefore doubled as a
      commercial-validation signal: buyers and distributors co-invested alongside financial investors. Two public
      figures for Electra's total equity raised conflict materially: a Trellis article from October 2025 reported
      "$214 million raised," while the two disclosed press releases sum to $85M + $186M = $271 million. The most
      credible explanation is that the Trellis figure captured the Series B at an intermediate close (approximately
      $129M), before the full $186M round closed; Canary Media's own article was later corrected from $188M to $186M,
      indicating the final figure was still being settled in October 2025. The company also received $50 million in
      non-dilutive funding from Breakthrough Energy Catalyst and an $8 million Colorado Industrial Tax Credit (CITCO)
      award from the Colorado Energy Office in May 2025. In early 2026, JPMorgan provided a $30 million venture debt
      facility to support planning and development of the first commercial facility. The total disclosed capital
      deployment across all sources exceeds $359 million ($271M equity + $50M grant + $8M credit + $30M debt).
    claimRefs:
      - CI008
      - CI009
      - CI010
      - CI011
      - CI012
