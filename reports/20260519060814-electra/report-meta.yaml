companyProfile:
  summary: >-
    Electra is a Boulder, Colorado industrial climate startup founded in 2020 to decarbonize ironmaking. The
    company says its low-temperature electrochemical-hydrometallurgical process can convert a wide range of iron ores
    into 99% pure iron for electric-arc-furnace steelmaking and battery applications using renewable electricity,
    without coking coal. Public evidence shows a pre-commercial business with strategic investors and counterparties
    across mining, steel, and industrial supply chains, plus a Jefferson County demonstration plant targeting mid-2026
    startup.
  foundedDate: '2020-03-01'
  founders:
    - name: Sandeep Nijhawan
      role: Co-founder & CEO
      background: Deep-tech operator and investor with prior roles at True North Venture Partners, AquaHydrex, and Staq Energy.
      claimRefs: [CO001, CO006]
    - name: Quoc Pham
      role: Co-founder
      background: Clean-tech technical leader with prior roles at AquaHydrex, Staq Energy, EnerVault, and Evogy.
      claimRefs: [CO001, CO007]
  foundingLocation: Boulder, Colorado, USA
  headquarters: Boulder, Colorado, USA
  productSummary: >-
    High-purity clean iron produced through a low-temperature electrochemical process, positioned as a feedstock for
    EAF steelmakers and certain battery applications.
  customerFocus: >-
    Steelmakers, metals distributors, automotive-linked steel supply chains, and other industrial buyers seeking
    lower-carbon iron inputs and associated emissions reductions.
  businessModel: >-
    Sell clean-iron product and related low-carbon attributes through strategic steel and trading partners, then scale
    into larger commercial facilities backed by project finance, grants, and strategic capital.
  stage: Series B / demonstration-stage industrial startup
  fundingStatus: >-
    $186M Series B announced in April 2025 after an earlier $85M round, plus a $50M Breakthrough Energy Catalyst
    award, an $8M Colorado clean-industry tax credit, and a $30M JP Morgan venture-debt facility.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO015, CO016, CO017, CO018, CO022, CO023]
