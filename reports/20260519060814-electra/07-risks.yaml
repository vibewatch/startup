callouts:
  - calloutType: risk
    title: "Demo-to-commercial scale-up is the primary thesis-break risk"
    body: >-
      Electra's 500-ton/yr demonstration plant is targeted for mid-2026 with a commercial facility aimed
      for 2029. The five-order-of-magnitude gap between demo and commercial scales means the company must
      prove modular cell replication, industrial acid-circuit reliability, and iron purity consistency before
      project finance is achievable. Investors should track iron purity and throughput data from the demo
      facility as the primary signal for whether the 2029 commercial timeline is credible.
    claimRefs:
      - CR001
      - CR002
      - CR003

  - calloutType: risk
    title: "Regulatory stack for commercial-scale chemical processing is material and underappreciated"
    body: >-
      At commercial scale, Electra will likely trigger OSHA PSM (29 CFR 1910.119) for acid handling,
      EPA major-source permitting under the Clean Air Act, and RCRA hazardous waste management. The
      EHS function is still being built (open Senior EHS Manager role). Investors should confirm
      PSM applicability and permitting timelines before the company breaks ground on commercial capacity.
    claimRefs:
      - CR009
      - CR010
      - CR011
      - CR015

  - calloutType: insight
    title: "Nucor's dual investor-customer role is a structural governance question"
    body: >-
      Nucor is simultaneously Electra's anchor customer and a long-term investor. This creates a conflict
      of interest if Nucor ever seeks to renegotiate purchase prices or change iron specifications. Diligence
      should examine whether Nucor holds board observer rights and whether the advance purchase order is
      at arm's length pricing.
    claimRefs:
      - CR017
      - CR019

