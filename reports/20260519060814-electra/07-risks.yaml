  - id: people-execution-risk
    title: "People, execution, and competitive risk: hiring at scale while scaling technology"
    body: >-
      Electra is simultaneously commissioning its first industrial facility and recruiting heavily for
      engineering, operations, EHS, and commercial roles. As of May 2026, the company had 21 open positions
      on its Greenhouse job board, including Controls Engineers, a Senior Process Development Engineer,
      a Senior EHS Manager, an Associate Director of Manufacturing, and commercial roles such as Director
      of Co-Mineral Sales and Head of Sales. The breadth of open roles suggests the operating team for the
      demonstration facility is not yet fully staffed. Talent concentration in two co-founders (CEO Sandeep
      Nijhawan and CTO Quoc Pham) is an additional risk: the technical process know-how is held in a small
      team, and succession or departure of either founder would create material uncertainty.


      Competition risk is accelerating. Boston Metal's Molten Oxide Electrolysis (MOE) platform targets
      the same low-carbon iron supply chain using different electrochemistry and is in a similar
      demonstration phase. HYBRIT (SSAB/LKAB/Vattenfall) and Stegra's hydrogen-based direct reduced iron
      plants in Sweden have progressed to industrial scale, with Stegra targeting commercial production at
      its Boden facility. ArcelorMittal is investing in innovative ironmaking and has its own DRI
      decarbonization roadmap. If any of these alternatives achieves faster commercial qualification or
      lower delivered cost, Electra's market window narrows. The "no green premium" claim — that Electra's
      iron will cost the same as or less than conventional iron — has not been validated at commercial
      throughput or energy pricing.
    claimRefs:
      - CR025
      - CR026
      - CR027
      - CR028
      - CR029
      - CR030
      - CR031
