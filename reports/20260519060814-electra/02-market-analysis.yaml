  - id: market-sizing
    title: Market sizing — TAM, SAM, SOM and evidence-constrained estimates
    body: >-
      No independent analyst market sizing report for the clean iron segment was accessible from public sources reviewed
      in this chapter. The company characterizes its market as a "trillion-dollar opportunity" in its Series A
      materials, but this claim carries no methodology and cannot be verified from public evidence. The chapter
      therefore relies on bottom-up estimation from worldsteel production data.


      TAM: Global crude steel production was approximately 1.9 billion metric tonnes in 2023 (worldsteel; bloomberg).
      Of this, roughly 69 percent (approximately 1.31 billion tonnes) was produced via blast furnace routes, with
      primary pig iron as the dominant iron source. This volume represents the outer envelope of primary iron
      displacement if all BF steel converted to clean iron-fed EAF, a scenario that would play out over decades.


      SAM: EAF steel accounted for approximately 31 percent of global steel (roughly 590 million tonnes). EAF mills
      require roughly 0.30–0.60 tonnes of primary iron per tonne of steel output to supplement scrap, depending on
      product grade. This implies a theoretical SAM of 165–354 million tonnes per year of primary iron for EAF — but
      only the fraction produced with verified low-carbon methods (and for buyers with decarbonization mandates) is
      immediately addressable. The actual near-term commercially accessible market is far smaller, as most EAF mills
      accept commodity pig iron today.


      SOM: Electra's demonstration plant produces 500 tonnes per year; commercial scale is targeted for 2029 with
      undisclosed capacity. For context, a single U.S. steel plant produces approximately 2 million tonnes of steel
      annually, implying a first commercial facility would need to supply roughly 600,000–1,200,000 tonnes of iron per
      year to serve a single large customer at full scale — far beyond the 2029 roadmap visibility.


      The most defensible near-term market is the corporate net-zero buyer coalition: purchasers who can pay for
      environmental attribute credits (Meta) or integrate clean iron into their supply chain to document Scope 3
      reductions (Nucor, automotive OEMs). This segment is evidence-backed but volume and pricing are not publicly
      disclosed.
