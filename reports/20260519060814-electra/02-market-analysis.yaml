callouts:
  - calloutType: insight
    title: No independent TAM in dollars — size the buyer coalition instead
    body: >-
      The most analytically defensible path to market sizing for this chapter is through signed commitments rather than
      a top-down TAM: Nucor purchase order, Meta EAC agreement, Toyota Tsusho distribution investment, and a $50
      million grant contingent on those commitments together provide a more reliable valuation anchor than the
      company's unverified "trillion-dollar" characterization.
    claimRefs:
      - CM015
      - CM021
      - CM022
      - CM025
      - CM035
  - calloutType: strength
    title: Ore flexibility creates structural supply advantage vs. H-DRI
    body: >-
      Electra's ability to process ores as low as 35 percent iron content compared to ≥67 percent required for
      hydrogen DRI will become increasingly relevant as commercial-grade ores (≥62% Fe) are projected to tighten
      in supply by the early 2030s. This is not merely a current cost advantage but a structural feedstock security
      moat.
    claimRefs:
      - CM010
      - CM011
  - calloutType: risk
    title: Scale gap and undisclosed cost are the principal market underwriting risks
    body: >-
      Electra produces 500 tonnes per year at demo while a typical U.S. steel plant needs 600,000–1,200,000 tonnes of
      iron per year. Cost per tonne at commercial scale is not publicly disclosed. Until both the scaling path and
      cost curve are demonstrated, the addressable market remains aspirational for most buyers.
    claimRefs:
      - CM039
      - CM042
      - CM043
      - CM047
