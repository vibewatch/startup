  - id: buyer-segmentation
    title: Buyer segmentation, budget ownership, and adoption path
    body: >-
      Electra's buyer landscape spans five distinct segments with very different budget owners and adoption triggers. The
      core segment is EAF steelmakers who need to reduce Scope 1 and upstream Scope 3 GHG intensity. Nucor — the
      largest U.S. steelmaker, producing more than a quarter of U.S. steel entirely via EAF — has placed a purchase
      order for Electra's demonstration plant iron, with its raw materials EVP citing growing EAF demand from the
      automotive market as the adoption trigger. Toyota Tsusho, the trading arm of Toyota Group, invested in Electra and
      plans to distribute clean iron to steelmakers and automakers, integrating it into the automotive supply chain.
      Interfer Edelstahl Group, a major European specialty steel distributor, signed an MOU for clean iron supply once
      regulatory certification for specialty steel applications is obtained.


      A second, distinct buyer class is the corporate net-zero buyer purchasing environmental attribute credits (EACs):
      Meta agreed to purchase Electra's first EACs for its data center construction emissions accounting. Microsoft's
      parallel commitment to buy green steel from Stegra illustrates that hyperscale tech companies are becoming active
      participants in the clean steel value chain, directly driving demand creation. These buyers are budget-holders for
      Scope 3 emissions rather than steel product purchasers, representing a new revenue and de-risking mechanism for
      early clean iron production.


      Automotive OEMs (GM, Ford, Toyota Motor) sit further back in the value chain as indirect buyers: they commit to
      prioritize low-carbon steel procurement without directly contracting iron feedstock, creating signal but not yet
      binding offtake. Mining companies BHP, Rio Tinto, and Roy Hill participate as strategic investors, giving them an
      incentive to supply ore to Electra but not yet as commercial buyers. Adoption path: the sequence moves from
      investor/partner alignment → demo-scale purchase agreement → specialty steel certification → commercial-scale
      offtake.
