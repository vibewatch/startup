  - id: TM004
    title: Growth drivers and adoption constraints
    columns:
      - Driver/Constraint
      - Direction
      - Timing
      - Implication
      - Diligence Ask
    rows:
      - - Scope 3 disclosure mandates (CSRD, SBTI, SEC)
        - Positive (driver)
        - 2025–2030
        - Obliges large corporations to quantify and reduce upstream steel emissions; creates documented demand for certified low-carbon iron
        - Will disclosure requirements create volume-binding procurement mandates or remain aspirational targets?
      - - Corporate buyer coalitions (GM, Ford, Meta, Microsoft)
        - Positive (driver)
        - Current
        - Pre-commercial demand signals de-risk scale-up; EAC revenue provides early non-offtake income
        - Are buyer commitments binding by volume and price, or aspirational? What are committed tonnes?
      - - Iron ore grade flexibility vs. H-DRI constraint
        - Positive (driver)
        - Near-term (2026–2032)
        - Electra's ability to use ≥35% Fe ores versus H-DRI's ≥67% Fe requirement addresses projected ore shortfall by early 2030s
        - Has ore flexibility been demonstrated at pilot with diverse commercial ore compositions?
      - - Strategic mining investor alignment
        - Positive (driver)
        - Current
        - BHP, Rio Tinto, Roy Hill as investors reduces ore supply risk and aligns incentives for low-grade ore monetization
        - Do investor agreements include ore supply terms at specified grades and prices?
      - - Modular scaling learning curve
        - Positive (driver)
        - Medium-term (2027–2035)
        - Repeated production units enable cost-learning analogous to solar/lithium-ion; avoids billion-dollar single-site commitment
        - How many commercial modules must be deployed before meaningful cost reduction is demonstrated?
      - - Green premium cost sensitivity
        - Negative (constraint)
        - Current
        - If clean iron costs significantly more than BF pig iron (~$400–600/tonne), adoption may stall outside mandated buyers
        - What is Electra's projected cost per tonne at commercial scale? Has internal cost modelling been shared with investors?
      - - H-DRI first-mover scale advantage
        - Negative (constraint)
        - 2026–2030
        - Stegra (€6.5B funded; 1.5M+ t pre-sold) and HYBRIT/SSAB are scaling H-DRI in Europe before Electra reaches commercial scale
        - Can Electra demonstrate cost competitiveness with Stegra's DRI route once Boden is operational?
      - - U.S. policy reversal on industrial decarbonization
        - Negative (constraint)
        - 2025–present
        - Trump-era rollback of Biden IRA clean industry support reduces U.S.-domestic incentive environment for clean iron buyers
        - Does Electra have sufficient non-U.S. committed offtake (Toyota Tsusho, Interfer) to reduce U.S. policy risk?
      - - Incumbent low-carbon ironmaking programs
        - Negative (constraint)
        - Current
        - ArcelorMittal XCarb, SSAB Zero, Nucor Econiq give large buyers incumbent low-carbon steel options without Electra
        - What is Electra's differentiation argument versus SSAB Zero (which is already commercial) for premium buyers?
    notes: >-
      All driver/constraint assessments are based on publicly available evidence as of May 2026. Policy landscape is
      U.S.-focused unless otherwise noted. Green premium cost estimates are not Electra-sourced; BF pig iron cost
      is a market estimate for reference only.
