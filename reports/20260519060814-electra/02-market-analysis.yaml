  evidenceGaps:
    - type: access-blocked
      severity: material
      topic: market sizing
      missingEvidence: >-
        IEA detailed iron and steel sector statistics, Net Zero scenario clean steel volumes, and projected
        EAF market share growth through 2030 and 2035.
      whyItMatters: >-
        Without an authoritative third-party market growth forecast, the chapter cannot size the SAM with
        confidence, and all EAF growth estimates are derived from first principles rather than official
        projections.
      diligencePath: >-
        Obtain IEA Steel Technology Roadmap or IEA Tracking Clean Energy Progress data from a paid
        subscription or downloaded PDF.
      relatedQuestionRefs:
        - QM006
        - QM010
    - type: private-evidence-only
      severity: material
      topic: market sizing
      missingEvidence: >-
        Independent analyst clean iron market size estimate in USD (value terms), with methodology, from
        a third-party market research firm.
      whyItMatters: >-
        Without a corroborated dollar-value TAM, the company's "trillion-dollar" claim cannot be verified
        and valuation multiples cannot be benchmarked to comparable markets.
      diligencePath: >-
        Commission or acquire a Wood Mackenzie, BloombergNEF, or similar paid report specifically covering
        the clean iron / green DRI market.
      relatedQuestionRefs:
        - QM005
    - type: missing-source
      severity: material
      topic: green premium
      missingEvidence: >-
        Electra's projected cost per tonne of clean iron at commercial scale, or any comparable cost
        benchmark for electrowinning iron versus DRI or pig iron.
      whyItMatters: >-
        Without cost-per-tonne data, the green premium risk cannot be assessed and buyer willingness to
        pay cannot be modeled.
      diligencePath: >-
        Request cost modelling or techno-economic analysis from Electra management as part of investor
        due diligence.
      relatedQuestionRefs:
        - QM013
    - type: access-blocked
      severity: minor
      topic: market statistics
      missingEvidence: >-
        Detailed EAF market share by region and projected growth rates from the World Steel in Figures 2025
        publication's paginated statistics.
      whyItMatters: >-
        Regional EAF share data would sharpen the SAM calculation, particularly for the U.S. and European
        markets where Electra has buyers.
      diligencePath: >-
        Download the World Steel in Figures 2025 PDF from worldsteel.org for the EAF production table.
      relatedQuestionRefs:
        - QM004
    - type: missing-source
      severity: minor
