  - id: TM001
    title: Market definition — Electra's clean iron segments and substitutes
    columns:
      - Segment/Category
      - Included Spend
      - Excluded Spend
      - Buyer/Payer
      - Relevance
    rows:
      - - Clean iron for EAF steelmaking
        - 99%-pure primary iron sourced from decarbonized electrochemical processes for EAF furnace charging
        - Pig iron from BF-BOF, scrap-only EAF circuits, and naturally recycled content steel
        - Integrated EAF steelmakers; raw materials procurement leads
        - Core direct TAM — replaces pig iron and DRI in EAF feedstock mix
      - - Battery-grade iron for LFP cells
        - Ultra-pure iron metal for lithium-iron-phosphate cathode manufacturing
        - Standard battery-grade iron from conventional smelting; cobalt-based cathode chemistries
        - Battery cell manufacturers; EV OEMs
        - Adjacent market; Electra exploring but pre-commercial as of 2026
      - - Co-mineral byproducts (silica, alumina)
        - Silica and alumina extracted during iron ore dissolution and sold to industrial buyers
        - Bulk sand and commodity alumina from unrelated mining processes
        - Industrial mineral buyers in glass, ceramics, and cosmetics
        - Revenue diversification stream; lowers net cost of clean iron production
      - - Green steel downstream (indirect demand signal)
        - Finished EAF steel made with clean iron inputs, carrying a low-carbon attribute certificate
        - Steel made from >50% recycled scrap without primary clean iron addition
        - Automotive OEMs, hyperscale tech (data center), construction, defense
        - Indirect market driver — OEM commitments pull clean iron supply chain investment
      - - Status-quo BF-BOF pig iron (substitute to be displaced)
        - Coal-fired blast furnace pig iron at ~1,600°C; ~2 t CO2/t steel
        - Electra's electrochemical iron (excluded from this market boundary)
        - Commodity steel buyers without binding decarbonization mandates
        - Incumbent substitute; relevant as pricing reference and switching cost anchor
      - - Hydrogen DRI / green steel (H-DRI route)
        - Steel made from hydrogen-based direct reduction of high-grade iron ore (≥67% Fe)
        - Electra's electrochemical iron (different technology pathway; not included)
        - Premium green steel buyers with access to H2 supply and high-grade ore
        - Close substitute; scaling faster in Europe (Stegra, HYBRIT/SSAB) but ore-grade constrained
    notes: >-
      Market boundary as of May 2026. Battery-grade iron and co-mineral revenues are emerging opportunities, not yet
      commercially scaled by Electra. BF-BOF pig iron pricing is the reference cost Electra must match or undercut to
      avoid a sustained green premium.
