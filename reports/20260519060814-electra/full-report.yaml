      - number: '5.2'
        title: Differentiation, IP, and Feedstock Flexibility
        blocks:
          - type: paragraph
            body: >-
              Electra's clearest technical differentiation is feedstock flexibility. The company says its process can
              accept ore with iron content as low as 35 percent, materially below the thresholds typically required by
              conventional ironmaking routes and hydrogen direct-reduced iron systems. That matters because the steel
              sector is under pressure to decarbonize while high-grade ore is structurally scarce and expensive. By
              using an acid-based route, Electra argues it can bypass upstream beneficiation, grinding, and
              pelletization requirements that make low-grade ore costly to upgrade for competing green-iron pathways.

              The process also appears designed to monetize impurities rather than merely dispose of them. Public
              reporting says silica, alumina, and other co-minerals can be separated during purification and sold into
              other industrial markets, which could partially offset process cost. On the production side, Electra is
              not describing one monolithic mega-plant architecture. Instead it frames the product as a modular network
              of electrochemical cells and arrays that can be stacked and repeated, with one array reportedly reaching
              up to 50,000 tonnes per year. That modularity is reinforced by patent protection, equipment choices that
              use readily available materials, and external recognition from TIME, BloombergNEF, and other award
              programs. Relative to H2-DRI, the result is a differentiated value proposition built around ore
              flexibility, phased scaling, and a potentially lower upstream carbon burden.
