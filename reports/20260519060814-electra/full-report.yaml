      - number: '8.3'
        title: Financing context, entry discipline, and dilution/preference structure
        blocks:
          - type: paragraph
            body: >-
              Electra has raised approximately $359 million in total capital across equity, grants, and debt as of May
              2026: $85 million in Series A (October 2022, led by Breakthrough Energy Ventures), $186 million in Series
              B (April 2025, led by Capricorn Investment Group and Temasek Holdings), $50 million from the Breakthrough
              Energy Catalyst grant (demonstration facility funding), $8 million from the Colorado Office of Just
              Transition's CITCO program, and $30 million in venture debt from JP Morgan (March 2026). The burn rate and
              runway implied by this capital base are not publicly disclosed. At typical pre-commercial clean tech burn
              rates of $20–50M per year, the $271M in equity proceeds (net of grants) would provide approximately five
              to thirteen years of runway, but the demonstration facility capex and operating costs are likely to absorb
              a significant portion of this capital, compressing runway.


              Entry discipline is challenging without a disclosed valuation. A new investor entering at this stage faces
              several dilution risks: (a) commercial facility project finance will likely require raising $1–5 billion
              in a combination of project equity, green bonds, and DOE loan guarantees, potentially diluting current
              equity holders substantially; (b) the Series B preference structure has not been disclosed — if it
              includes liquidation preferences or anti-dilution ratchets, downside protection for late-stage entrants is
              limited; (c) the JP Morgan venture debt facility ($30M at undisclosed terms) adds a covenant layer that
              could restrict equity raises or create acceleration risk if milestones are missed.


              On the constructive side, the BEC grant ($50M) and CITCO grant ($8M) provide non-dilutive capital that
              improves runway without additional equity pressure. The POSCO JDA signed April 2026 potentially signals
              future strategic capital from one of the world's largest steelmakers, though financial commitments under
              the JDA are not disclosed. A DOE Loan Programs Office application for the commercial facility — which
              would represent the largest potential capital commitment — has not been announced as of the run date.
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
          - type: figure
            figureRef: FV003
            claimRefs:
