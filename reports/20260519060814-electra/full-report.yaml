        - Colorado CITCO tax credit; Breakthrough Energy grant; potential IRA-adjacent incentives
        - Stegra and HYBRIT benefit from EU/Swedish green industrial policy (higher intensity)
        - Low-medium — U.S. federal clean industry support partially rolled back under Trump administration
        - Does Electra's commercialization plan depend on federal IRA incentives that may be curtailed?
