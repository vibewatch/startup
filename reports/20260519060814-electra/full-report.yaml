      - number: '2.4'
        title: Growth drivers, adoption constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The primary growth drivers are the expanding corporate net-zero disclosure regime (Scope 3 mandatory
              reporting under CSRD and voluntary SBTI commitments), the automotive and data center sectors' documented
              green steel commitments, and the iron ore supply constraint that disadvantages H-DRI competitors (H-DRI
              requires ≥67 percent iron ore purity; commercial-grade ores ≥62 percent are projected to be in short
              supply by the early 2030s, while Electra can use ores as low as 35 percent iron content). Colorado's
              inaugural $8 million clean industry tax credit and Breakthrough Energy's $50 million Catalyst grant
              validate the policy tailwind at U.S. state level. JP Morgan's $30 million venture debt facility further
              signals institutional finance is now underwriting industrial decarbonization technology risk.


              The principal adoption constraints are: (1) scale gap — Electra is at 500 t/yr demo versus
              multi-million-tonne commercial plants; (2) green premium opacity — cost per tonne at commercial scale is
              undisclosed and may not be competitive without mandates; (3) H-DRI first-mover disadvantage — Stegra's
              Boden plant (€6.5 billion total funding; 1.5 million tonnes pre-sold; DRI tower and electrolyzer nearing
              completion in 2026) and HYBRIT/SSAB's commercial SSAB Zero product are scaling faster in Europe; (4) U.S.
              policy reversal — Bloomberg documents that H-DRI capacity buildout in the U.S. has faltered because of
              Trump-era policy rollbacks, a risk that partially applies to any U.S.-centric clean iron scale-up; (5) the
              BF-BOF incumbency — ArcelorMittal and other major integrated mills are running active low-carbon
              ironmaking programs, meaning even large buyers have incumbent options.


              Valuation relevance: The market is genuine but early. The most defensible valuation anchor is not a TAM
              multiple but the signed offtake commitments (Nucor purchase order, Meta EAC agreement, Toyota Tsusho
              investment/distribution deal) and the $50 million Catalyst grant contingent on those commitments. The
              market opportunity expands substantially if Electra can reach cost parity with pig iron at commercial
              scale, and if Scope 3 disclosure requirements tighten in major steel-buying industries.
