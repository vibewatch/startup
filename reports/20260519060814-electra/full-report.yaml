        title: Revenue model and monetization architecture
        blocks:
          - type: paragraph
            body: >-
              Electra's revenue model is pre-commercial but clearly defined: the company produces high-purity (99%) iron
              through a low-temperature electrochemical-hydrometallurgical process, and plans to sell that iron product
              to steelmakers and industrial buyers. Its primary revenue stream will be iron product sales — iron that
              can be fed into electric arc furnaces (EAFs) for green steel production, used in battery-grade
              applications, or delivered to specialty-steel distributors. A secondary revenue stream is environmental
              attribute credits (EACs): Meta has agreed to purchase the EACs associated with the emissions reductions
              from Electra's demonstration facility output, establishing a precedent for decarbonization-conscious large
              buyers. A third emerging stream is co-mineral sales — Electra's process extracts silica and alumina during
              refining, which can be monetized in adjacent industrial markets; a recent commercial hire (Director of
              Co-Mineral Sales) on the greenhouse job board signals this is moving beyond concept. No list pricing,
              realized revenue, or recognized revenue figures are publicly disclosed, in keeping with the company's
              private status and pre-commercial stage. The company's own website describes its product as carrying "no
              green premium," meaning pricing is claimed to be competitive with conventional iron from coal-fired blast
              furnaces, but there is no independent validation of this cost claim at scale. Any revenue recognition from
              the advanced purchase agreements signed with Nucor, Toyota Tsusho, INTERFER, and POSCO would follow actual
              delivery of iron product — none of these agreements are reported to include any upfront cash payment
