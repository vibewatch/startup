      - number: '1.4'
        title: Commercial Progress and Scale
        blocks:
          - type: paragraph
            body: >-
              Commercial traction is visible but still early. Public reporting says Electra is building a
              130,000-square-foot demonstration facility in Jefferson County, Colorado with capacity of up to 500 tonnes
              of iron per year and a targeted opening by mid-2026. That facility is strategically important because it
              is meant to convert laboratory and prototype credibility into customer-qualified product, purchase-order
              fulfillment, and eventually financing support for a larger commercial plant expected later in the decade.

              The customer and partner base is stronger than many pre-commercial materials startups can show publicly.
              Reporting indicates advanced purchase orders from Nucor, Toyota Tsusho, and Interfer Edelstahl Group, an
              Environmental Attribute Credit agreement with Meta, an Interfer specialty-steel MOU signed in December
              2024, and Toyota Tsusho's April 2025 investment tied to automotive-grade EAF steel distribution. Hiring
              activity also suggests real operating build-out rather than a paper partnership strategy: Electra grew
              from roughly 50 employees in 2022 to 130-plus by 2025, and job postings in May 2026 spanned engineering,
              operations, EHS, and commercial roles across Boulder and Broomfield. The remaining commercial question is
              whether this momentum is sufficient to outrun the technical and cost challenges Bloomberg highlighted
              during the scale-up race.
