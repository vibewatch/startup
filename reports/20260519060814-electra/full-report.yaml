  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Technology Overview and Process Architecture
        blocks:
          - type: paragraph
            body: >-
              Electra's core product is a clean-iron production process rather than a software platform or a finished
              steel SKU. The company describes its Oxygen-Decoupled Electrolysis, or ODE, system as a patented
              low-temperature electrochemical-hydrometallurgical route that converts iron ore into high-purity iron
              without the carbon emissions associated with blast furnaces. Public descriptions consistently outline
              three linked stages. First, iron ore is dissolved into an acidic solution. Second, co-minerals and
              impurities are removed while the chemistry is conditioned and acid is regenerated. Third, purified iron is
              electrodeposited onto metal plates through an electrowinning cell driven by electric current.

              The technical importance of the approach is that it operates at approximately 60°C rather than the roughly
              1,600°C temperatures associated with conventional blast-furnace ironmaking. That lower thermal requirement
              makes the process more compatible with renewable electricity and modular electrochemical operation.
              Electrowinning itself is well established in metals such as copper, zinc, and nickel, but applying it to
              iron is harder because iron ions shift between ferrous and ferric states instead of depositing cleanly.
              Electra's proprietary chemistry and current control are presented as the critical solution to that
              problem. The supporting patent traces back to a 2021 priority filing and cites U.S. National Science
              Foundation support, which strengthens the view that the process emerged from serious scientific work
              rather than marketing-only positioning.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
