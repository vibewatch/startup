      - number: '7.2'
        title: 'Regulatory, environmental, and safety risk: chemical processing under federal and state oversight'
        blocks:
          - type: paragraph
            body: >-
              Electra's process is built around acid-based hydrometallurgy at commercial scale — a category of
              industrial chemistry with well-established federal and state regulatory requirements that the company will
              need to navigate as it builds a commercial facility. At demonstration scale (500 tons/yr), the Jefferson
              County facility operates under Colorado Department of Public Health and Environment (CDPHE) air quality
              permits and local land-use approvals. The Colorado Energy Office and the CITCO tax credit program
              confirmed the project received state backing, which implies prior state environmental review.


              At commercial scale, Electra's facility may trigger major-source thresholds under the Clean Air Act's
              Prevention of Significant Deterioration (PSD) and Title V programs. These require pre-construction
              permits, Best Available Control Technology (BACT) analysis, and ongoing emissions monitoring. OSHA's
              Process Safety Management (PSM) standard (29 CFR 1910.119) applies to operations that use sulfuric acid,
              hydrochloric acid, or other highly hazardous chemicals above threshold quantities — a likely outcome for
              large-scale acid leaching. OSHA PSM requires a process hazard analysis, written operating procedures,
              emergency response plans, and periodic compliance audits. The open job posting for a Senior EHS Manager
              (Manufacturing) confirms EHS infrastructure is still being built.


              EPA RCRA hazardous waste regulations govern the disposal of spent acid solutions and co-mineral process
              streams. While Electra's business model converts co-minerals (silica, alumina) into sellable products, the
              fate of rejected streams and electrolyte waste at commercial scale has not been publicly disclosed. IP
              risk is contained: patent AU2022241786A1 was filed through an Australian PCT route and covers the core
              electrochemical process, but electrowinning itself is not novel and alternative approaches (alkaline
              electrowinning, molten oxide electrolysis) exist from Boston Metal and HYBRIT research consortiums. No
              litigation or IP disputes have been identified in public sources.
            claimRefs:
              - CR009
              - CR010
              - CR011
