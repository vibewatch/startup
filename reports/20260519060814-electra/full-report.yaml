      - number: '3.4'
        title: Moat durability, switching costs, lock-in, and adverse competitive evidence
        blocks:
          - type: paragraph
            body: >-
              Electra's most defensible moat is feedstock flexibility: the ability to use low-grade iron ore creates a
              supply chain alignment with mining companies that H-DRI competitors cannot replicate without changing
              chemistry. This is reinforced by the value chain investor alignment — BHP, Rio Tinto, and Roy Hill hold
              equity in Electra, creating incentive alignment between ore suppliers and the technology provider. This
              investor moat would erode if a new H-DRI technology emerged that also handled lower-grade ore, but no such
              competitor is currently in development.


              The iron purity specification moat is real but early-stage. When EAF operators tune their furnace recipe
              for 99 percent pure clean iron versus 81–88 percent DRI, they develop process specifications, yield
              models, and quality assurance workflows that are specific to that iron chemistry. This creates moderate
              switching cost once qualified, analogous to specialty chemical supplier lock-in. However, Electra has not
              yet been qualified at commercial scale by any EAF operator, so this moat is prospective, not current.


              The key adverse competitive risks are: (1) scale-based first-mover disadvantage — Stegra's Boden plant at
              commercial scale will create cost data that either validates or challenges H-DRI economics before Electra
              reaches commercial scale; if H-DRI proves out below $400/tonne ex-works, the premium Electra must charge
              for its ore-flexibility and purity advantages narrows; (2) Nucor's Econiq product already offers buyers a
              net-zero certified steel product backed by Nucor's operational scale, eliminating the urgency of paying a
              green premium for Electra's clean iron for Scope 1 buyers; (3) Boston Metal's MOE route, if it achieves
              commercial scale, would compete directly for the same 99 percent pure clean iron market with potentially
              simpler processing (no acid dissolution step); (4) ArcelorMittal and POSCO have the capital and customer
              relationships to move fast if clean iron buyer demand materializes clearly — Electra's 2029 commercial
              target gives ArcelorMittal three years to accelerate its own program.
