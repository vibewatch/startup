chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Electra presents itself as a climate-industrial company trying to reinvent ironmaking rather than merely
              optimize an existing blast-furnace route. The company is branded publicly as Electra, while a Toyota
              Tsusho announcement identifies the legal entity as Electra Steel Inc., a Colorado company founded in March
              2020 by Sandeep Nijhawan and Quoc Pham. Public company pages place headquarters in Boulder, Colorado,
              while hiring and recruiting materials point to demonstration-facility and manufacturing activity centered
              in nearby Broomfield.

              The core product claim is straightforward: Electra says it can produce 99% pure iron using a
              low-temperature electrochemical-hydrometallurgical process powered by zero-carbon electricity, with output
              suitable for electric arc furnace steelmakers and iron-based battery applications. That positioning
              matters because steel is among the largest industrial emissions sources globally, and Electra frames its
              business around removing the emissions-heavy ironmaking step without requiring premium pricing. As of the
              run date, however, Electra remains a private, pre-commercial company with no publicly disclosed revenue or
              audited financial metrics, so investors can assess the strategic logic and capital formation more easily
              than current operating performance.
