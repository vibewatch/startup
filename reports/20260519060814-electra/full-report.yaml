  - id: FE004
    title: Electra Capability Maturity Matrix
    type: matrix
    summary: Relative maturity of key process capabilities vs peer approaches (H2-DRI, blast furnace).
    data:
      columns:
        - Electra (ODE)
        - H2-DRI
        - Blast Furnace (conventional)
      rows:
        - label: Ore grade flexibility
          values:
            - High (35%+ Fe)
            - Low (67%+ Fe required)
            - Medium (62%+ Fe)
        - label: Operating temperature
          values:
            - Very low (60°C)
            - High (900°C shaft)
            - Very high (1,600°C)
        - label: Renewable energy compatibility
          values:
            - High (intermittent OK)
            - Medium (continuous H2 needed)
            - None (coal-based)
        - label: Modular / incremental scalability
          values:
            - High (stackable arrays)
            - Low (large plant economics)
            - Low (blast furnace fixed cost)
        - label: Commercial maturity (2026)
          values:
            - Demo-stage (500 t/yr)
            - Commercial-scale (Sweden/H2GS)
            - Fully commercial (global)
    approximationNotes: >-
