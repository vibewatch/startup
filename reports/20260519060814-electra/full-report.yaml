      - number: '4.3'
        title: Capital adequacy and runway
        blocks:
          - type: paragraph
            body: >-
              The combination of a $186M Series B (closed April 2025), a $50M Breakthrough Energy Catalyst grant, an $8M
              state tax credit, and a $30M JPMorgan venture debt facility gives Electra a substantial but not unlimited
              runway to build its demonstration facility and prepare for commercial-scale deployment. Cash on hand and
              monthly burn are not publicly disclosed. With 130+ employees on the Colorado Energy Office payroll as of
              May 2025, and an aggressive manufacturing build-out underway in Jefferson County, the company's cash
              consumption is likely significant. Based on comparable deep-tech hardware companies at a similar stage,
              typical burn rates range from $25M to $50M per year for organizations of this scale and capital intensity;
              at 130+ headcount and active facility construction, the upper end of that range is plausible. At that
              pace, the aggregate inflows since April 2025 would provide an estimated 3–5 years of runway from mid-2025,
              reaching approximately late 2028 to mid-2030 — consistent with the company's stated 2029 commercial
              facility target. The JPMorgan venture debt facility ($30M, closed March 2026) explicitly targets planning,
              engineering, and preparation for the first commercial facility, suggesting the company is transitioning
              toward project-finance structures rather than relying purely on further equity rounds. However, the
              company is likely to require additional capital for the commercial-scale facility, which Canary Media
              reported would be of "undisclosed size and capacity" with no announced project-finance structure. Until
              those parameters are disclosed, capital adequacy for the 2029 commercial build-out remains materially
              uncertain.
