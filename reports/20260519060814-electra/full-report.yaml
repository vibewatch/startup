      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              Electra's public leadership story is still anchored on its two co-founders. Sandeep Nijhawan is the
              visible chief executive and fundraising face of the company, while Quoc Pham remains the central technical
              architect of the electrochemical process. Their shared history matters: before Electra they worked
              together at AquaHydrex and Staq Energy, which gives the company a repeated-founder profile rather than a
              first-time founding team learning electrochemistry from scratch. The broader executive bench appears
              purpose-built for scale-up, with James Rutland handling finance, Keith Shuttlesworth leading commercial
              work into the steel market, Karen Robertson overseeing talent, and Simon Wandke adding iron-ore domain
              credibility as advisory-board chair.

              Governance transparency remains limited. Electra's official materials disclose named executives and
              advisors, but they do not publish a full board roster, independent-director map, or ownership-control
              structure. There is also a subtle role-clarity issue around Quoc Pham: the 2022 funding materials called
              him CTO, while more recent company pages emphasize his co-founder status without the same formal title.
              None of that negates the team's depth, but it does concentrate key-person risk in the founders during the
              period when process scale-up, partner conversion, and large-project financing all depend heavily on their
              continuity and credibility.
