      - number: '3.3'
        title: Capability, pricing, GTM, and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              On the three dimensions that matter most to an EAF steelmaker buyer — iron purity, ore grade flexibility,
              and process temperature / energy compatibility — Electra has distinct superiority over H-DRI routes and
              competitive parity with MOE on purity, while MOE has not demonstrated commercial availability. H-DRI
              (HYBRIT, Stegra) produces DRI at 81–87.9 percent purity; Electra produces 99 percent pure iron, which is
              cleaner than pig iron (92–95%) and more compatible with high-grade steel specifications. For EAF operators
              making high-quality automotive or specialty steel grades, this purity advantage translates into reduced
              alloying corrections and scrap segregation effort.


              Ore grade flexibility is Electra's sharpest competitive differentiator. H-DRI requires ≥67 percent iron
              content ore for efficient hydrogen reduction chemistry. Electra's hydrometallurgical dissolution step can
              process ores as low as 35 percent iron — meaning lower-grade mines become economically viable feedstock
              sources. This matters because high-grade lump ore (≥67% Fe, like direct-charge ore from BHP or Rio Tinto's
              Pilbara operations) is a globally scarce resource, and Electra's investors (BHP, Rio Tinto, Roy Hill) hold
              large reserves of lower-grade ore that currently have a smaller market. Electra's technology, if scaled,
              creates a new high-value use for that ore.


              From a GTM and distribution perspective, Electra has a structured multi-channel strategy: Nucor as a
              direct EAF customer (purchase order), Toyota Tsusho as a dedicated distribution partner for Asian and
              global automotive markets, Interfer Edelstahl as a European specialty steel distribution channel, and Meta
              as an EAC buyer for the tech/data center channel. This multi-channel, buyer-segmented approach is more
              mature than Boston Metal's (which does not have publicly confirmed distribution partners) but
              significantly less complete than Stegra's (which has 1.5M+ tonnes pre-sold to major automotive brands and
              retailers). The pricing for Electra's clean iron is not publicly disclosed, nor has Electra disclosed a
              target selling price per tonne, creating a due diligence gap on green premium and competitive price
              positioning.
