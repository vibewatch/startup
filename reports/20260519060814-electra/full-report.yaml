            body: >-
              The Trump administration's U-turn on Biden-era industrial decarbonization policies introduces a real
              demand-side risk. While Electra's advance purchase orders with Nucor, Toyota Tsusho, and Interfer are
              commercial agreements and not policy-dependent, the green premium pricing environment that supports a
              revenue uplift over commodity iron depends partly on corporate sustainability commitments driven by
              regulation and investor pressure. If carbon border adjustment mechanisms (EU CBAM is already in effect;
              U.S. equivalents are uncertain) stall or if Scope 3 reporting mandates are weakened, buyers' willingness
              to pay a premium for clean iron erodes. Bloomberg and Canary Media both noted that hydrogen DRI efforts in
              the U.S. have "faltered" under the policy shift, creating cautionary data points even if Electra's cost
              structure is different.


              The capital intensity risk is tied directly to the commercial scale timeline. The company has raised $301M
              in equity and debt to date (not counting the $50M BEC grant), but a commercial iron facility will require
              project finance at a scale that is several times the current capitalization. Burn rate and runway are not
              disclosed. The JP Morgan venture debt adds a covenant and interest burden. If commercial facility
              financing takes longer than expected or comes at unfavorable terms, the company's ability to achieve 2029
              commercial production is at risk. The demonstration facility's performance data (iron purity, throughput,
              energy efficiency, acid consumption) will be the primary gating signal for whether project finance is
              achievable.
