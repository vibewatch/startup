  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Technology and scale-up risk: the demo-to-commercial gulf remains the dominant investment risk'
        blocks:
          - type: paragraph
            body: >-
              Electra's biggest single risk is the demonstration-to-commercial execution gap. The company's Jefferson
              County facility is sized at 500 tons of clean iron per year and is targeted to open mid-2026. A typical
              commercial steelmaker demands 500,000 to 2,000,000 tons per year. That five-order-of-magnitude chasm means
              Electra must prove that its modular electrochemical cells replicate yield, energy efficiency, and
              throughput when stacked at industrial density — a regime no electrochemical ironmaking process has
              reached. The company's own CEO described the target commercial facility (2029) as "undisclosed size and
              capacity," which means the engineering basis for commercial economics has not been disclosed.


              Process variability is a closely linked second risk. Electra's acid-leaching hydrometallurgical front end
              dissolves iron ores of varying composition — phosphorus, silica, alumina, and other contaminants — before
              electrowinning deposits 99% pure iron. The "special sauce" Anthropocene Magazine referenced is managing
              ferrous/ferric ion balance and anode purity control at scale; at pilot, a square-meter cathode plate was
              the unit cell. Commercial throughput requires thousands of such cells operating in parallel with
              consistent electrolyte chemistry. Yield variance across heterogeneous ore batches could compress product
              purity or increase acid regeneration costs. Electra has not published commercial yield projections, energy
              intensity per ton, or acid consumption data.


              A third dimension is product qualification. Nucor, Toyota Tsusho, and Interfer have advance purchase
              orders but each has noted qualification requirements. Interfer explicitly stated its purchase is
              contingent on receiving "regulatory certification for specialty steel applications." Qualifying a new iron
              source for high-grade EAF steel, automotive flat-rolled, or specialty applications can take 18-36 months
              after first commercial deliveries, extending the revenue ramp.
