      - number: '1.3'
        title: Funding, Capital Structure, and Milestones
        blocks:
          - type: paragraph
            body: >-
              Electra has assembled one of the deeper financing stacks in the emerging clean-iron category, albeit still
              with limited public transparency around valuation and governance rights. The company first disclosed a
              major $85 million Series A in October 2022 and then announced a much larger $186 million Series B in April
              2025. Together with later reporting, those rounds imply $214 million of disclosed equity financing before
              non-dilutive and debt support are added. Public sources further show a layered capital stack that includes
              a $50 million Breakthrough Energy Catalyst award, an $8 million Colorado clean-industry tax credit, and a
              $30 million JP Morgan venture-debt facility tied to development of the first commercial facility.

              The investor mix is unusually strategic for a pre-revenue industrial company. The syndicate spans
              climate-tech VCs, sovereign and institutional capital, iron ore producers, steelmakers, a trading house,
              and industrial buyers, creating both financing depth and channel validation. Milestone reporting suggests
              a stepwise path from early pilot work to a 2024 externally reported commercial-size prototype milestone,
              then to a mid-2026 Colorado demonstration facility target and a 2029 commercial-scale ambition. The
              largest analytical blind spot is valuation: no retained public source provides a verified post-money
              figure for any round, making return modeling and dilution analysis impossible without data-room access.
