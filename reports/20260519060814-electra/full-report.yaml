      - number: '4.4'
        title: Unit economics and cost structure
        blocks:
          - type: paragraph
            body: >-
              Electra's unit economics are not publicly disclosed and cannot be derived from available sources. The
              company's "no green premium" claim — that its iron will cost the same or less than conventional coal-based
              iron — is central to the investment thesis but has not been independently validated at commercial scale.
              The process involves four main cost inputs: iron ore feedstock, electricity (renewable), reagents (acid
              solution, hydrometallurgical chemicals), and capital equipment (electrowinning modules). A key claimed
              advantage is the ability to use lower-grade ore (down to 35% iron content) that is cheaper and more
              abundant than the high-grade ore required by hydrogen-based direct reduced iron (DRI) processes.
              Electricity cost is a major variable: the process is designed to run on intermittent renewable energy,
              which can lower cost if paired with low-cost curtailed solar or wind, but creates operational complexity.
              The demonstration facility (500 tonnes/year) is designed to prove out unit economics before commercial
              scale deployment; investor communications suggest the modular design allows cost learning across
              replicated units, similar to the learning curves observed in solar and lithium-ion batteries. On the gross
              margin side, comparable players in nascent green industrial materials (e.g., early-stage FOAK battery or
              green hydrogen producers) typically show negative or near-zero gross margin at demonstration scale, with
              improvement expected only at commercial volumes. No independent engineering or cost study for Electra's
              process has been published. The co-mineral sales (silica, alumina) could offset operating costs but
              represent a nascent revenue stream with undisclosed pricing and market size. Nucor's sustainability data
              shows that a conventional EAF produces steel at approximately 0.77 tonnes CO₂ per tonne, while blast
              furnaces produce roughly 2 tonnes CO₂ per tonne; Electra's iron product is positioned to enable the
              low-carbon EAF route but the per-tonne iron cost versus DRI-grade alternatives has not been publicly
              benchmarked.
