companyProfile:
  summary: >-
    Electra is a Boulder, Colorado industrial climate startup founded in 2020 to decarbonize ironmaking. The company
    says its low-temperature electrochemical-hydrometallurgical process can convert a wide range of iron ores into 99%
    pure iron for electric-arc-furnace steelmaking and battery applications using renewable electricity, without coking
    coal. Public evidence shows a pre-commercial business with strategic investors and counterparties across mining,
    steel, and industrial supply chains, plus a Jefferson County demonstration plant targeting mid-2026 startup.
