      Relative ratings are qualitative.
    claimRefs:
      - CE001
      - CE007
      - CE011
      - CE023
      - CE039
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      How Electra moves a prospect from strategic interest to pre-commercial commitment, first delivery, and long-term
      supply expansion.
    data:
      items:
        - id: stage-awareness
          label: Strategic Engagement
          actor: Prospective buyer / investor
          description: >-
            EAF steelmakers, distributors, and sustainability-focused corporates engage Electra through industrial
            decarbonization discussions, investor networks, and peer clean-iron comparisons. Boston Metal and HYBRIT
            provide external evidence that incumbents are already exploring pre-commercial green iron pathways.
          channels:
            - Industry conferences
            - Investor referral networks
            - Sustainability procurement teams
        - id: stage-commitment
          label: Purchase Agreement / MOU / JDA
          actor: Procurement and strategy team
          description: >-
            The prospect signs a purchase agreement, distribution agreement, MOU, EAC agreement, or JDA, often alongside
            a strategic investment. Five named partners signed between Dec 2024 and Apr 2026.
          channels:
            - Direct negotiation with Electra commercial team
            - Series B co-investment process
            - Environmental procurement programs
        - id: stage-delivery
          label: Demo Facility Delivery (2026 target)
          actor: Buyer operations team
          description: >-
            Electra targets mid-2026 opening of its Jefferson County demonstration facility; first iron deliveries and
            first demo-linked EAC issuance would validate product purity, process stability, and contract conversion
            quality.
          channels:
            - Direct iron shipment to buyer facility
            - EAC registry or bilateral accounting process
            - Third-party quality certificate / lab report
        - id: stage-commercial
          label: Commercial Scale (2029 target)
          actor: C-suite / long-term supply chain
          description: >-
            A later commercial facility activates larger-volume agreements. Nucor, POSCO, and Toyota Tsusho are the most
            plausible initial anchors if the demo proves product quality, economics, and certification readiness.
          channels:
            - Long-term supply agreement activation
            - Project-finance-backed commercial plant
            - International logistics into Japan and Korea
    approximationNotes: >-
      Timeline stages are based on public company targets and industry adoption logic rather than disclosed internal CRM
      funnel definitions.
    claimRefs:
      - CU016
      - CU019
      - CU025
      - CU027
  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    layout: standard
    summary: >-
      Illustrative funnel from strategic prospect universe to signed counterparties and eventual demo-stage delivery
      recipients.
    data:
      items:
        - label: Identified strategic prospects
          value: 20
          description: >-
            Estimated universe of large EAF steelmakers and major distributors that could be strategic clean-iron
            counterparties based on top global EAF producers and channel players.
        - label: Engaged in bilateral discussions
          value: 10
          description: >-
            Companies believed to have engaged Electra through the Series B process, conferences, or strategic
            diligence; not all are publicly disclosed.
        - label: Named signed commitment (any form)
          value: 5
          description: >-
            Nucor, Toyota Tsusho, INTERFER, Meta, and POSCO each have at least one signed agreement, MOU, EAC agreement,
            or JDA as of May 2026.
        - label: Active investor-customers (invested + signed)
          value: 3
          description: >-
            Nucor, Toyota Tsusho, and POSCO are confirmed as both investors and signatories with a purchase,
            distribution, or JDA commitment.
        - label: Demo-stage delivery recipient (2026 target)
          value: 0
          description: >-
            No deliveries have been made as of May 2026; first delivery depends on the demo facility opening and
            qualification success.
    approximationNotes: >-
      Upper-funnel counts are analyst estimates inferred from the strategic-investor and public-prospect universe; only
      the final three stages are explicitly evidenced.
    claimRefs:
      - CU001
      - CU012
      - CU016
      - CU021
      - CU027
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Public-evidence quality by named Electra counterparty, highlighting which relationships look most commercial and
      which remain exploratory.
    data:
      columns:
        - Relationship Type
        - Public Confirmation Quality
        - Evidence Depth
        - Binding Commitment
        - Delivery Timeline
      rows:
        - label: Nucor
          values:
            - Strategic investor + purchase agreement
            - High — investor role plus independent media and Nucor sustainability evidence
            - Strong — multiple public sources across official, filing, and media
            - Likely purchase commitment but terms undisclosed
            - 2026 demo then 2029 commercial target
        - label: Toyota Tsusho
          values:
            - Distribution agreement + investor
            - High — company press release plus Series B announcement
            - Strong — official customer disclosure and Electra press coverage
            - Likely binding distribution agreement; economics private
            - 2026 demo samples then 2029 commercial scale
        - label: INTERFER
          values:
            - MOU + investor
            - Medium — public article and investor mention
            - Moderate — named but less documented than Nucor or Toyota Tsusho
            - MOU only; not binding purchase
            - 2029 commercial target more likely than demo volume
        - label: Meta
          values:
            - EAC purchase agreement
            - High — dedicated media coverage focused on the agreement
            - Strong — clearly described use case though not a physical iron offtake
            - EAC agreement; not an iron purchase
            - 2026 EAC delivery if demo opens and credits are verified
        - label: POSCO
          values:
            - JDA + investor
            - High — April 2026 announcement names both JDA and investment
            - Moderate — relationship exists but commercial structure is still unclear
            - JDA; purchase commitment not confirmed
            - Post-2029 commercial ramp most likely
    approximationNotes: Binding-strength labels are analyst interpretations from public language only; contract text was not reviewed.
    claimRefs:
