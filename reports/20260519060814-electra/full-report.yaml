      - number: '8.5'
        title: Exit readiness, thesis-break triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Exit pathways for Electra investors are conditional on demonstration success and commercial scale proof.
              The most credible near-term exit scenario is a strategic acquisition by a major steelmaker or mining
              conglomerate — POSCO, ArcelorMittal, BHP, or Nippon Steel — who would buy the company to own the
              electrowinning technology and pre-established customer relationships rather than compete with it. This
              path requires demonstration success and at least one binding commercial purchase contract. IPO is a
              longer-dated option, plausibly available after the first commercial facility reaches nameplate capacity
              (2032+ in base case). Given the company's mission-driven investor base (BEV, Temasek, Capricorn), a
              structured secondary or continuation vehicle is also possible if strategic sale and IPO are delayed.


              Thesis-break triggers (summarized in TV005) include: (1) demo facility iron purity below 97% or throughput
              below 400 t/yr at end of 2026; (2) Nucor or Toyota Tsusho publicly withdraws purchase order or investment;
              (3) commercial facility financing not secured by end 2027; (4) any OSHA citation, EPA enforcement, or
              CDPHE permit denial at Jefferson County; and (5) a publicly reported down-round or JP Morgan covenant
              acceleration event. Any single thesis-break trigger warrants an immediate re-rating to pass or sell,
              depending on severity.


              The final diligence asks (TV006) represent the minimum information package needed to move from
              research-more to a buy recommendation. The most critical ask is real-time or third-party verified demo
              facility performance data — iron purity certificates, energy consumption metrics, and throughput data for
              the first production batches. Without this data, the valuation range is too wide to support a conviction
              call. Secondary asks include the Series B preference structure, Nucor/Toyota Tsusho advance purchase order
              binding terms, commercial facility site selection and engineering study, and the DOE LPO application
              status.
            claimRefs:
              - CV035
              - CV036
