  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and steel value chain context
        blocks:
          - type: paragraph
            body: >-
              Electra's primary market is clean iron feedstock for EAF steelmaking. Steel is a foundational industrial
              material produced at roughly 1.9 billion tonnes per year globally, of which approximately 69 percent is
              made via blast furnace-basic oxygen furnace routes that burn metallurgical coal at 1,600 degrees Celsius
              and emit roughly two tonnes of CO2 per tonne of steel. Iron ore conversion to pig iron accounts for
              approximately 90 percent of steelmaking emissions that are theoretically eliminable. Electra's
              electrochemical-hydrometallurgical process replaces this step by dissolving iron ore in an acidic aqueous
              solution at 60 degrees Celsius and depositing 99-percent-pure iron via electrowinning, using intermittent
              renewable electricity. The output is a clean iron product that EAF mills can charge alongside scrap as a
              substitute for pig iron or direct reduced iron (DRI).


              The market boundary includes: (1) high-purity primary iron for EAF steelmakers (the core addressable
              market); (2) ultra-pure battery-grade iron for lithium-iron-phosphate (LFP) cells (an adjacent and
              early-stage opportunity); and (3) co-mineral byproducts (silica, alumina) extracted during ore
              dissolution, which diversify Electra's revenue pool. Excluded from the boundary are blast furnace steel
              production (the incumbent), scrap-only recycling EAF circuits that use no primary iron, and hydrogen DRI /
              molten oxide electrolysis (close substitutes operating on different technology pathways). The key
              valuation-relevant boundary distinction is that Electra sells into the primary iron feedstock slot within
              EAF steelmaking, not into the downstream steel product market. This keeps Electra's customers as
              steelmakers and distributors rather than end-product buyers, though corporate net-zero demand signals from
              automotive OEMs, hyperscale data center operators, and defense manufacturers are already visible in the
              buyer coalition.
