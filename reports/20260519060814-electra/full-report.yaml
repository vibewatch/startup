    title: Technology / operating architecture table
    columns:
      - layer / process
      - role
      - dependency
      - risk
    rows:
      - - Feedstock preparation (ore grinding)
        - Reduce ore to fine ochre sand for acid dissolution
        - Low-grade iron ore supply; water for slurry
        - Ore source variability could affect dissolution rate and purity
      - - Acid dissolution (hydrometallurgy)
        - Dissolve iron from ore into acidic aqueous solution
        - Sulfuric or similar acid supply; acid regeneration cycle
        - Acid cost, handling, regeneration efficiency; spillage/safety regulation risk
      - - Purification / co-mineral removal
        - Remove silica, alumina, phosphorous before electrodeposition
        - Process chemistry; purification unit operations
        - Inadequate purification could contaminate iron output and reduce purity below 99%
      - - Electrowinning cells (electrochemistry)
        - Deposit pure iron from solution onto steel cathode plates via electric current
        - Renewable or grid electricity; cathode plate supply; anode materials
        - Iron ion state (ferrous/ferric) management is the critical IP; any deviation degrades yield
      - - Power and controls systems
        - Regulate cell voltage, current, solution chemistry, and process parameters
        - Reliable electricity supply; sensors and automation
        - Loss of precise control risks iron state mismanagement; controls reliability is key
      - - Product recovery and packaging
        - Remove iron deposits from cathode, size to customer specs
        - Manual or automated scraping equipment; quality testing
        - Throughput bottleneck; product consistency standards for EAF not fully disclosed
