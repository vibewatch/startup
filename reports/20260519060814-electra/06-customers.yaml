- id: SEC604
  title: Retention, contract durability, and repeat purchase
  body: 'Retention analysis is necessarily provisional because Electra has not yet delivered meaningful iron volumes or disclosed revenue. That means standard SaaS-style metrics such as NRR, GRR, logo churn, cohort retention, or satisfaction scores are unavailable and, in most cases, conceptually premature. The relevant diligence question is therefore not whether Electra has proven retention, but whether there is any evidence of customer slippage before first delivery. Publicly, there is none: no buyer has announced a termination, pause, or downgrade, and no public amendment has surfaced that weakens the named agreements. Even so, that absence of negative evidence should not be mistaken for contract durability. All five agreements remain pre-delivery, and public disclosures do not reveal term length, renewal rights, take-or-pay minimums, termination penalties, exclusivity terms, or conversion milestones. The correct underwriting stance is that retention is not yet measurable, and durability
    depends on whether the Jefferson County demonstration facility can produce on-spec iron and verified EACs on the promised timeline.'
  claimRefs:
  - CU007
  - CU008
  - CU011
  - CU018
  - CU029
  - CU032
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: SEC605
  title: Customer concentration and expansion vectors
  body: 'Customer concentration is the main weakness in Electra''s otherwise strong proof set. Nucor is the obvious anchor relationship and likely the single most economically important buyer because it combines strategic relevance, purchase intent, and U.S. credibility. If that relationship weakens, Electra would lose both a potential revenue base and a major validation signal for future financing rounds. A second concentration issue is structural: all five visible counterparties are pre-revenue, so the company has no demonstrated ability to retain or expand customers after delivery. Policy risk also matters because the Meta EAC agreement and broader U.S. clean-industry demand backdrop could weaken if IRA-linked incentives or adjacent climate procurement momentum were rolled back. Offsetting those risks, Electra does have credible expansion vectors. Toyota Tsusho and POSCO expand reach in East Asia, INTERFER opens a European specialty steel channel, and the customer set spans direct supply,
    channel distribution, and carbon-attribute monetization. That geographic and model diversity improves optionality, but it does not eliminate the need for firmer volume commitments and broader post-demo diversification.'
