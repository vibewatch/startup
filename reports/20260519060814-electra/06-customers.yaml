- id: SEC602
  title: Named customer proof and partnership quality
  body: 'Named-customer proof is the strongest part of Electra''s customer story. As of May 2026, five named counterparties have signed a publicly described agreement with the company: Nucor, Toyota Tsusho, INTERFER Edelstahl Group, Meta, and POSCO. The quality of those proofs is uneven. Nucor has the highest strategic weight because the relationship combines sector relevance, strategic investment, and an advance purchase agreement. Toyota Tsusho is also high-quality proof because its own press release describes a distribution role into Japanese automakers. INTERFER''s proof is weaker because the disclosed instrument is an MOU rather than a clear binding purchase order. Meta validates willingness to pay for decarbonization attributes, but it is not a physical iron customer. POSCO adds important Asia-Pacific proof, yet the April 2026 disclosure is framed as a joint development agreement plus investment, leaving the commercial commitment ambiguous. Across all five, the main caveat is unchanged:
    public sources do not disclose price, volume, exclusivity, or delivery obligations in enough detail to underwrite revenue certainty.'
  claimRefs:
