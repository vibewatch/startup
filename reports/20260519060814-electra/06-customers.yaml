    - label: INTERFER
      values:
      - MOU + investor
      - Medium — public article and investor mention
      - Moderate — named but less documented than Nucor or Toyota Tsusho
      - MOU only; not binding purchase
      - 2029 commercial target more likely than demo volume
    - label: Meta
      values:
      - EAC purchase agreement
      - High — dedicated media coverage focused on the agreement
      - Strong — clearly described use case though not a physical iron offtake
      - EAC agreement; not an iron purchase
      - 2026 EAC delivery if demo opens and credits are verified
    - label: POSCO
      values:
      - JDA + investor
      - High — April 2026 announcement names both JDA and investment
      - Moderate — relationship exists but commercial structure is still unclear
      - JDA; purchase commitment not confirmed
      - Post-2029 commercial ramp most likely
