  - - All 5 buyers are pre-revenue
    - 'High: no tested retention and every agreement could unwind before delivery'
    - Zero proven churn resistance; policy shifts could weaken EAC and green-iron demand simultaneously
    - Request binding vs. indicative status for each agreement plus deposit, milestone, and penalty clauses
  - - U.S. market and policy exposure
    - 'Medium: 3 of 5 customers are U.S.-based or U.S.-linked'
    - If IRA-linked support or adjacent climate procurement weakens, U.S. clean-iron economics could soften
