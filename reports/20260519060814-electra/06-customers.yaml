figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: How Electra moves a prospect from strategic interest to pre-commercial commitment, first delivery, and long-term supply expansion.
  data:
    items:
    - id: stage-awareness
      label: Strategic Engagement
      actor: Prospective buyer / investor
      description: EAF steelmakers, distributors, and sustainability-focused corporates engage Electra through industrial decarbonization discussions, investor networks, and peer clean-iron comparisons. Boston Metal and HYBRIT provide external evidence that incumbents are already exploring pre-commercial green iron pathways.
      channels:
      - Industry conferences
      - Investor referral networks
      - Sustainability procurement teams
    - id: stage-commitment
      label: Purchase Agreement / MOU / JDA
      actor: Procurement and strategy team
      description: The prospect signs a purchase agreement, distribution agreement, MOU, EAC agreement, or JDA, often alongside a strategic investment. Five named partners signed between Dec 2024 and Apr 2026.
      channels:
      - Direct negotiation with Electra commercial team
      - Series B co-investment process
      - Environmental procurement programs
    - id: stage-delivery
      label: Demo Facility Delivery (2026 target)
      actor: Buyer operations team
      description: Electra targets mid-2026 opening of its Jefferson County demonstration facility; first iron deliveries and first demo-linked EAC issuance would validate product purity, process stability, and contract conversion quality.
      channels:
      - Direct iron shipment to buyer facility
      - EAC registry or bilateral accounting process
      - Third-party quality certificate / lab report
    - id: stage-commercial
      label: Commercial Scale (2029 target)
      actor: C-suite / long-term supply chain
      description: A later commercial facility activates larger-volume agreements. Nucor, POSCO, and Toyota Tsusho are the most plausible initial anchors if the demo proves product quality, economics, and certification readiness.
      channels:
      - Long-term supply agreement activation
      - Project-finance-backed commercial plant
      - International logistics into Japan and Korea
  approximationNotes: Timeline stages are based on public company targets and industry adoption logic rather than disclosed internal CRM funnel definitions.
  claimRefs:
  - CU016
  - CU019
  - CU025
  - CU027
