- id: SEC603
  title: Adoption trajectory and engagement depth
  body: 'Electra''s adoption trajectory is early but directionally encouraging. Publicly visible customer additions have appeared in three consecutive years: INTERFER and Meta in 2024, Nucor and Toyota Tsusho in 2025, and POSCO in 2026. That pacing matters because it shows the company is adding market validation before the mid-2026 opening of its 500 tonne-per-year demonstration plant rather than after operating proof exists. The counterpoint is that Electra is still tracking commitment count, segment breadth, and geography more than deployment, repeat purchase, or delivered tonnage. No named counterparty has yet received commercial product. The best interpretation is that Electra has de-risked commercial interest and cross-border relevance, not execution. Industry roadmaps from the IEA and Mission Possible Partnership support the broader thesis that major steel buyers need low-carbon iron pathways this decade, while CRU and GreenSteelWorld coverage suggest procurement interest is rising.
    Still, Electra''s entire visible funnel remains pre-revenue and pre-qualification, so today''s adoption evidence is a pipeline indicator rather than a usage metric.'
  claimRefs:
  - CU012
  - CU016
  - CU017
  - CU018
  - CU021
  - CU022
  - CU025
  - CU027
  - CU034
  - CU035
