company:
  name: Electra
chapter:
  number: 6
  title: Customers
  summary: 'Electra has assembled an unusually credible pre-revenue customer set for an industrial materials startup: five named counterparties spanning steelmakers, distributors, and a sustainability buyer across the U.S., Europe, Japan, and Korea. The commercial signal is real, but every agreement remains pre-delivery, most economics are undisclosed, and concentration around Nucor plus policy sensitivity around U.S. green-industry demand remain material diligence risks.'
sections:
- id: SEC601
  title: Customer base and market structure
  body: Electra's current customer base is best understood as a small but strategically diverse set of pre-commercial counterparties rather than a scaled revenue base. The company is selling into at least three distinct buyer archetypes. First are direct EAF steelmakers, where Nucor is the most important proof point because it represents the highest-volume iron demand and the clearest industrial validation of Electra's clean-iron thesis. Second are distributors and channel partners such as Toyota Tsusho and INTERFER, which matter because they can translate Electra's product into automotive, specialty steel, and cross-border buyer relationships without Electra needing a large direct sales force in every market. Third is the sustainability-buyer category represented by Meta, which is purchasing environmental attributes rather than physical iron. This mix gives Electra multiple monetization paths, but it also underlines that the company has not yet demonstrated recurring revenue, sector breadth
    beyond the steel value chain, or disclosed segment-level pricing and contract economics.
  claimRefs:
  - CU009
  - CU013
  - CU014
  - CU015
  - CU019
  - CU030
  - CU031
  - CU037
  - CU038
  tableRefs:
