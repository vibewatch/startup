  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: purchase-agreement-terms
    missingEvidence: Underlying contract language for volumes, pricing, duration, milestones, and remedies across Nucor, Toyota Tsusho, and other named counterparties.
    whyItMatters: Without contract terms, investor diligence cannot distinguish binding commercial demand from strategic signaling, which directly affects revenue underwriting and project-finance credibility.
    diligencePath: Request executed agreements or term sheets under NDA and confirm minimum volumes, qualification gates, and termination rights with management and counterparties.
    relatedQuestionRefs:
    - QU026
  - type: private-evidence-only
    severity: material
    topic: retention-data-pre-revenue
    missingEvidence: Any post-delivery retention data, contract renewals, churn statistics, or customer satisfaction measurements from real product shipments.
    whyItMatters: Electra has not yet reached the operational phase where retention can be observed, so customer durability remains an execution hypothesis rather than a proven metric.
    diligencePath: After demo opening, request shipment log, repeat-order cadence, counterparty feedback, and renewal mechanics for the first delivered customers.
    relatedQuestionRefs:
    - QU027
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-completeness
    missingEvidence: Confirmation of whether Electra has other named pilot users, undisclosed buyers, or additional signed commitments beyond the five public counterparties listed in TU003.
    whyItMatters: Public named-customer proof is the centerpiece of the chapter, and incomplete coverage would distort concentration analysis and the true breadth of commercial demand.
    diligencePath: Ask management for a complete customer and counterparty register, including confidential pilots, stage, contract type, geography, and whether each is revenue-generating or strategic only.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU003
