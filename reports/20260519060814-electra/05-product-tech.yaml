callouts:
  - calloutType: strength
    title: "Patented process with government-backed IP foundation"
    body: >-
      Electra's core ODE process is protected by a patent with a 2021-03 priority date, developed with US NSF
      funding (Award 2039232). Government-backed R&D origin and issued patent protection are material positive
      signals for moat durability, particularly when combined with the "special sauce" iron ion management
      know-how that is not fully described in the patent.
    claimRefs:
      - CE006
      - CE020
      - CE021

  - calloutType: risk
    title: "No independent performance verification published"
    body: >-
      As of the runDate, no independent third-party lifecycle assessment, energy audit, or cost-per-tonne
      analysis for Electra's electrowinning process has been published. The zero-green-premium claim and 99%
      purity claim are central to the investment thesis and should be treated as company-claimed until
      verified in a data room review.
    claimRefs:
      - CE036
      - CE037
      - CE035

  - calloutType: insight
    title: "Strategic investor base with embedded ore supply reinforces feedstock flexibility"
    body: >-
      Rio Tinto, Roy Hill, and BHP Ventures are all Series B investors. These mining majors have a direct
      economic incentive to supply lower-grade ores to Electra — turning a competitive threat (iron ore
      quality constraint) into a supply chain advantage. This structural alignment is unique to Electra's
      acidic electrowinning route among clean iron approaches.
    claimRefs:
      - CE007
      - CE022
      - CE039

