    - id: SE009
      publisher: "Anthropocene Magazine"
      title: "Greener Steel Through Chemistry"
      url: "https://www.anthropocenemagazine.org/2025/08/greener-steel-through-chemistry/"
      date: '2025-08-01'
      accessDate: '2026-05-19'
      accessStatus: ok
      stance: neutral
      sourceType: news
      reputationTier: medium
      independence: independent
      topics:
        - process-steps
        - feature
        - electrowinning
      keyQuote: >-
        Electra's process happens in three steps. First, chunks of rusty, oxidized iron ore are ground down
        to a fine ochre sand and placed into a tub with an acid solution that leaches out soluble minerals...
        Finally, in a process called electrowinning, the purified iron solution is placed in a tub primed with
        an anode and a steel plate... An electric current is fed into this cell through the anode, charging
        the dissolved iron ions in the solution and causing them to attach themselves to the steel plate.
