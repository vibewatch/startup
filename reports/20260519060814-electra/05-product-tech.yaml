company:
  name: Electra
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Electra is developing a low-temperature electrochemical-hydrometallurgical ironmaking platform that
    replaces coal-based blast-furnace chemistry with an acid-leach and electrowinning route operating at
    roughly 60°C. Public evidence through 2026 supports a differentiated feedstock-flexible process,
    meaningful patent coverage, and credible commercial pull from steel and carbon-accounting buyers, but
    also shows unresolved diligence gaps around independently verified performance, certification, and
    demonstration-to-commercial scale-up.
sections:
  - id: section-process-architecture
    title: "Technology Overview and Process Architecture"
    body: >-
      Electra's core product is a clean-iron production process rather than a software platform or a finished
      steel SKU. The company describes its Oxygen-Decoupled Electrolysis, or ODE, system as a patented
      low-temperature electrochemical-hydrometallurgical route that converts iron ore into high-purity iron
      without the carbon emissions associated with blast furnaces. Public descriptions consistently outline
      three linked stages. First, iron ore is dissolved into an acidic solution. Second, co-minerals and
      impurities are removed while the chemistry is conditioned and acid is regenerated. Third, purified iron
      is electrodeposited onto metal plates through an electrowinning cell driven by electric current.

      The technical importance of the approach is that it operates at approximately 60°C rather than the
      roughly 1,600°C temperatures associated with conventional blast-furnace ironmaking. That lower thermal
      requirement makes the process more compatible with renewable electricity and modular electrochemical
      operation. Electrowinning itself is well established in metals such as copper, zinc, and nickel, but
      applying it to iron is harder because iron ions shift between ferrous and ferric states instead of
      depositing cleanly. Electra's proprietary chemistry and current control are presented as the critical
      solution to that problem. The supporting patent traces back to a 2021 priority filing and cites U.S.
      National Science Foundation support, which strengthens the view that the process emerged from serious
      scientific work rather than marketing-only positioning.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE010
    tableRefs:
      - TE002
    figureRefs:
      - FE001
      - FE002

  - id: section-differentiation-ip
    title: "Differentiation, IP, and Feedstock Flexibility"
    body: >-
      Electra's clearest technical differentiation is feedstock flexibility. The company says its process can
      accept ore with iron content as low as 35 percent, materially below the thresholds typically required by
      conventional ironmaking routes and hydrogen direct-reduced iron systems. That matters because the steel
      sector is under pressure to decarbonize while high-grade ore is structurally scarce and expensive. By
      using an acid-based route, Electra argues it can bypass upstream beneficiation, grinding, and
      pelletization requirements that make low-grade ore costly to upgrade for competing green-iron pathways.

      The process also appears designed to monetize impurities rather than merely dispose of them. Public
      reporting says silica, alumina, and other co-minerals can be separated during purification and sold into
      other industrial markets, which could partially offset process cost. On the production side, Electra is
      not describing one monolithic mega-plant architecture. Instead it frames the product as a modular network
      of electrochemical cells and arrays that can be stacked and repeated, with one array reportedly reaching
      up to 50,000 tonnes per year. That modularity is reinforced by patent protection, equipment choices that
      use readily available materials, and external recognition from TIME, BloombergNEF, and other award
      programs. Relative to H2-DRI, the result is a differentiated value proposition built around ore
      flexibility, phased scaling, and a potentially lower upstream carbon burden.
    claimRefs:
      - CE007
      - CE008
      - CE009
      - CE011
      - CE012
      - CE013
      - CE014
