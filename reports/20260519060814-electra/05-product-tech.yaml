  evidenceGaps:
    - type: missing-source
      severity: material
      topic: performance-metrics
      missingEvidence: >-
        Independent third-party verification of carbon intensity (tCO2/t iron), energy consumption (kWh/t),
        and cost per tonne for Electra's electrowinning process.
      whyItMatters: >-
        The zero-green-premium claim is central to the investment thesis; without independent lifecycle or
        cost data, the claim cannot be underwritten confidently by investors or offtake buyers.
      diligencePath: >-
        Request data room access with independent lifecycle assessment results, process energy audit, and
        production cost breakdown from Electra.
      relatedQuestionRefs:
        - QE014
        - QE022
        - QE029
    - type: missing-source
      severity: material
      topic: quality-certifications
      missingEvidence: >-
        Third-party iron purity certification, ResponsibleSteel certification, and EAC methodology or verifier
        documentation.
      whyItMatters: >-
        Major steel buyers and EAC purchasers such as Meta and Nucor will require certified quality and carbon
        provenance for commercial contracts at scale.
      diligencePath: >-
        Monitor the Electra newsroom for certification announcements and request a certifications package from
        CCO Keith Shuttlesworth.
      relatedQuestionRefs:
        - QE022
        - QE023
    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: >-
        No public developer community surface, technical blog, conference talk archive, or practitioner forum
        was identified for Electra.
      whyItMatters: >-
        For hardware companies, absence of a practitioner community limits external validation of technical
        claims and makes hiring signal the primary proxy.
      diligencePath: >-
