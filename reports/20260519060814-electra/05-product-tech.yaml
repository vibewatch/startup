  - id: section-facility-roadmap
    title: "Facility Roadmap and Technology Maturity"
    body: >-
      Electra's publicly visible technology maturity is now beyond laboratory concept stage but still short of
      commercial production. Reporting describes a Boulder, Colorado R&D and pilot site with tanks, acid baths,
      electrowinning cells, and computer-regulated piping that appear sufficient for iterative process
      development and prototype work. Bloomberg's March 2024 coverage is important because it framed Electra's
      commercial-sized iron prototype milestone as a crucial proof point for a company whose technology was only
      a few years old. That milestone suggests the process works at more than benchtop scale even if continuous
      throughput economics remain undisclosed.

      The next step is the Jefferson County demonstration facility, which multiple public sources describe as a
      130,000 square foot plant targeting up to 500 tonnes per year of high-purity iron with startup planned
      for mid-2026. The stated purpose is not just production volume; it is calibration, process learning, and
      product-purity testing at a scale relevant to customer qualification and project finance. Public guidance
      then points to a larger commercial plant targeted for 2029. Taken together, the evidence supports an
      approximate technology readiness level in the 6 to 7 range: past prototype, approaching demonstration,
      but still exposed to scale-up risk. Bloomberg's reported challenges around ore dissolution rate and iron
      ion purity remain central watchpoints because they map directly to yield, throughput, and cost.
    claimRefs:
      - CE015
      - CE016
      - CE017
      - CE018
      - CE019
      - CE033
      - CE034
      - CE035
    tableRefs:
      - TE005
    figureRefs: []

  - id: section-controls-quality
    title: "Technical Operations, Controls, and Quality"
    body: >-
      Electra's public operating model looks more like an industrial electrochemical control system than a
      conventional steel mill retrofit. Media descriptions of the Boulder facility emphasize computer-regulated
      baths, process piping, and electrowinning cells, implying that the company must continuously manage
      solution chemistry, current density, and deposition conditions rather than simply run a thermal furnace.
      The hiring footprint supports that interpretation. As of May 2026 the company was recruiting controls,
      process-development, and data-science talent, which is consistent with a process stack that depends on
      automation, sensor feedback, and model-based optimization to maintain iron purity and cell performance.

      The hiring signal also suggests Electra is preparing for the operational realities of large-scale chemical
      manufacturing. Controls Engineer roles imply responsibility for automation across electrowinning cells,
      acid-bath systems, and plant instrumentation. The Principal Data Scientist opening points toward
      data-driven performance monitoring and predictive optimization, while the Senior Environmental Health &
      Safety role indicates preparation for more formal industrial chemical handling and compliance. Even so,
      public evidence still shows trust and quality gaps. No independent purity certification, lifecycle
      assessment, or ResponsibleSteel-style certification has been disclosed as of the run date. That does not
      indicate failure, but it does mean the external quality-assurance path remains less mature than the core
      process narrative.
    claimRefs:
      - CE025
      - CE026
      - CE027
      - CE028
      - CE037
      - CE038
    tableRefs:
      - TE004
    figureRefs:
      - FE003

  - id: section-customers-signal
    title: "Customers, Applications, and Developer Signal"
    body: >-
      Electra's customer evidence is unusually strong for a pre-commercial materials company. Demand pull is
      visible from both steel buyers and adjacent carbon-accounting customers. Nucor's public positioning
      around sustainable iron feedstocks for electric arc furnace steel, especially into automotive supply
      chains, aligns closely with Electra's 99 percent purity product narrative. Toyota Tsusho has invested in
      the company and said it plans to distribute Electra iron into automotive-grade EAF applications, while
      Interfer has framed the product around specialty steel opportunities in Europe. Meta adds a different
      type of validation through its Environmental Attribute Credit agreement tied to low-carbon iron used in
      data-center construction supply chains.

      Electra is also exploring adjacent applications in magnets and batteries, which broadens the potential
      addressable market beyond steel if purity and cost targets hold. What Electra does not show publicly is a
      traditional developer ecosystem. No public GitHub organization, developer API surface, SDK, or community
      forum appears tied to the product. For an industrial hardware company that absence is not fatal, but it
      means practitioner signal comes mostly from hiring, patent literature, and partner announcements rather
      than open-source communities. The founders' electrochemistry backgrounds, especially Quoc Pham's prior
      work in flow batteries and fuel cells, reinforce the technical credibility behind that practitioner-led
      signal.
    claimRefs:
      - CE029
      - CE030
      - CE031
      - CE032
      - CE040
      - CE041
      - CE042
    tableRefs:
      - TE003
    figureRefs:
      - FE004

