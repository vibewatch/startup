  - id: TP004
    title: Moat durability and competitive risk register
    columns:
      - Moat Dimension
      - Electra Position
      - Competitor Threat
      - Durability Assessment
      - Diligence Ask
    rows:
      - - Ore grade flexibility (≥35% Fe)
        - Structural advantage; no H-DRI competitor can use <67% Fe ore with current chemistry
        - No direct threat identified; MOE can use variable ore but at high energy cost
        - High — unless new H-DRI chemistry achieves lower-grade ore compatibility
        - Has the ore grade flexibility been validated across multiple commercial ore compositions at pilot scale?
      - - Iron purity (99% vs 81–88% DRI)
        - EAF furnace recipe and specification lock-in once qualified
        - Boston Metal (MOE) can theoretically match purity; no commercial scale verification
        - Medium — depends on successful EAF qualification and demonstrated yield improvement
        - Has any EAF operator formally qualified Electra iron for commercial production specification?
      - - Strategic mining investor alignment
        - BHP, Rio Tinto, Roy Hill have equity stake; incentivized to supply low-grade ore
        - None of the H-DRI or MOE competitors have equivalent mining investor alignment
        - High — mining company equity creates durable ore supply alignment
        - Do investor equity agreements include any ore supply terms or pricing protections?
      - - EAF customer early lock-in (Nucor PO)
        - Nucor purchase order and demonstrated buyer interest creates quality/specification entry
        - Stegra has 1.5M+ t pre-sold to premium brands, reducing pool of open buyers
        - Medium — Nucor's Econiq product partially satisfies the same Scope 3 buyer need
        - Is the Nucor purchase order volume and price contractually binding at commercial scale or only demo-scale?
      - - IP and patent moat
        - Multiple patents on aqueous dissolution + electrowinning process
        - Boston Metal's MOE has its own IP portfolio; not a direct overlap
        - Medium — patents cover current process but can be designed around at scale if chemistry changes
        - How broad are the claims in Electra's patent portfolio relative to alternative electrochemical routes?
      - - Modular learning curve
        - Modular design allows cost learning analogous to solar/li-ion without billion-dollar single commitment
        - H-DRI plants (Stegra €6.5B) are NOT modular; cannot iterate as cheaply
        - High — if modular learning is validated at commercial scale, unit cost declines create compounding moat
        - How many commercial modules must be deployed before meaningful learning-curve cost reduction is demonstrated?
      - - Co-mineral byproduct revenue
        - Silica and alumina extracted during dissolution reduce net clean iron cost
        - No equivalent co-product revenue in H-DRI or MOE routes
        - Medium — value depends on co-mineral market pricing and scale of production
        - What is the projected contribution of co-mineral sales to clean iron unit economics at commercial scale?
      - - U.S. policy and regulatory alignment
        - Colorado CITCO tax credit; Breakthrough Energy grant; potential IRA-adjacent incentives
        - Stegra and HYBRIT benefit from EU/Swedish green industrial policy (higher intensity)
        - Low-medium — U.S. federal clean industry support partially rolled back under Trump administration
        - Does Electra's commercialization plan depend on federal IRA incentives that may be curtailed?
      - - Multi-channel buyer base (distribution moat)
        - 4-channel model (EAF/Nucor, auto/Toyota Tsusho, specialty/Interfer, EAC/Meta)
        - Stegra has deeper customer penetration (1.5M+ t with 5 OEM brands + retailers)
        - Low-medium — buyer channels are established but volume commitments at demo scale only
        - Have any distribution channels been extended beyond demo-scale volume commitments?
    notes: >-
      Moat durability ratings (High/Medium/Low) are qualitative assessments based on publicly available evidence.
      No Electra internal strategy documents or management interviews are reflected. Durability assessments assume
      no material technology breakthrough that changes the ore grade or purity economics.
