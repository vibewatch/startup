company:
  name: Electra
chapter:
  number: 3
  title: Competitive Analysis
  summary: >-
    Electra competes in a landscape defined by two emerging clean ironmaking technology routes — hydrogen direct
    reduction iron (H-DRI) and molten oxide electrolysis (MOE) — plus incumbent integrated steelmakers accelerating
    their own decarbonization programs. The strongest near-term competitive threat comes from Stegra (formerly H2
    Green Steel), which is building a €6.5 billion H-DRI plant in Boden, Sweden with 1.5 million tonnes pre-sold,
    and from SSAB whose HYBRIT-derived SSAB Zero product is already commercial. Boston Metal's MOE route is the
    most technologically analogous to Electra but remains pre-commercial. Electra's structural moat is its ore
    grade flexibility (≥35% Fe vs. ≥67% Fe for H-DRI), which will become increasingly relevant as commercial-grade
    ore supply tightens in the early 2030s. The principal adverse evidence is the large scale and funding gap
    between Electra (demo-stage, ~$264M raised) and leading H-DRI projects (€6.5B funded), and that Nucor —
    Electra's anchor EAF customer — already has a net-zero steel product (Econiq) that some buyers may accept
    as a substitute for Electra's clean iron attribute.
sections:
  - id: competitive-landscape
    title: Competitive landscape — direct peers, incumbents, substitutes, and likely entrants
    body: >-
      The competitive landscape for clean primary iron spans three concentric rings. In the innermost ring, direct
      technology peers developing novel low-carbon ironmaking processes that directly compete for the same EAF
      feedstock slot: (1) Boston Metal with its Molten Oxide Electrolysis (MOE) platform, which uses an
      electrolytic bath at 1,600°C to separate iron from oxide ore without carbon; (2) the HYBRIT joint venture
      (SSAB, LKAB, Vattenfall) producing sponge iron via hydrogen direct reduction and commercializing as SSAB
      Zero; and (3) Stegra (formerly H2 Green Steel), building the world's first greenfield green steel mega-plant
      in Boden, Sweden using H2-DRI. All three are Electra's direct analogues in the "novel low-carbon primary
      iron" category.


      In the second ring are incumbent integrated steelmakers running active low-carbon ironmaking transitions that
      could serve the same buyers: ArcelorMittal (XCarb program, including a Midrex H-DRI plant in Ghent, Belgium,
      and a DRI plant in Texas), POSCO (HyREX hydrogen DRI program, April 2026 JDA with Electra), and Nippon Steel
      and Tata Steel at various innovation stages. These are both potential buyers/partners and potential in-house
      competitors: if ArcelorMittal or POSCO can deliver certified low-carbon steel at commercial scale from their
      own process innovations, they become a substitute supply chain for buyers like Rheinmetall or Toyota without
      needing Electra.


      In the outer ring are substitutes without a novel iron process: Nucor's Econiq net-zero steel product (already
      commercial, based on existing EAF + renewable electricity + carbon offsets, not clean primary iron), SSAB Zero
      (commercial), and scrap-fed EAF mills certifying their Scope 1 and 2 emissions with RECs. These offer a
      near-term buyer compliance pathway without requiring Electra's clean iron. The status-quo for buyers who
      cannot yet access Electra is commodity pig iron or DRI from conventional blast furnace or gas-DRI routes,
      which provide no carbon benefit but remain the price anchor.
