  - id: competitor-profiles
    title: Key competitor profiles — scale, technology, funding, and commercial status
    body: >-
      Boston Metal occupies the closest technological position to Electra — both use electricity to reduce iron
      from oxide ore without carbon — but via a fundamentally different mechanism. MOE operates at approximately
      1,600°C in a molten electrolytic bath, separating iron by electron transfer at high temperature, whereas
      Electra operates at 60°C using an aqueous acid dissolution step before electrowinning. Boston Metal was
      inducted into the Global Cleantech 100 Hall of Fame and collaborated with Outokumpu on steel applications,
      but remains pre-commercial for its MOE Steel product line as of 2026. Its MOE Critical Metals line
      (targeting battery metals like cobalt and nickel) is an alternative commercialization path that reduces its
      dependency on the steel market. Boston Metal has raised significant venture capital but total funding level
      and commercial scale targets are not publicly confirmed from accessible sources.


      Stegra represents the most formidable scaling competitor. With approximately €6.5 billion in total funding
      (equity, green bonds, project finance), 1.5 million tonnes of green steel pre-sold to customers including
      Porsche, IKEA, Mercedes-Benz, Volvo, and Scania, and a DRI tower and electrolyzer under construction in
      Boden as of 2026, Stegra is executing on the largest single clean ironmaking investment in history. Stegra
      agreed in principle on a further €1.4 billion in financing in April 2026. Microsoft committed to buy green
      steel from Stegra for data center construction in September 2025. The key vulnerability is that Stegra
      requires natural gas as a feedstock bridge (planned H2 dependency requires large-scale green H2 supply, and
      Boden's economics depend on Swedish hydropower), and the plant is a single massive capital commitment, not a
      modular system.


      HYBRIT (SSAB + LKAB + Vattenfall JV) proved its hydrogen storage technology at pilot scale in February 2025,
      removing a major technical risk for the H-DRI route. SSAB already commercialized SSAB Zero as a product
      and signed a letter of intent with Rheinmetall in January 2026 for fossil-free steel supply to defense
      manufacturing — the first defense company to formally commit to decarbonized steel. HYBRIT's pilot program
      has been extended to 2031 to continue scaling and cost reduction work. The commercial SSAB Zero product
      is based on the existing recycled scrap route plus fossil-free energy (not yet the full HYBRIT H-DRI route
      at scale), meaning the full fossil-free primary iron process is still transitioning.


      ArcelorMittal is the world's largest steelmaker and has the most diversified low-carbon ironmaking portfolio:
      Midrex H-DRI plant in Ghent (Belgium), natural gas DRI in the Americas, and its XCarb innovation fund and
      green steel product line. It also operates as an EAF buyer (it uses EAF at some sites) and as a BF-BOF
      operator globally. ArcelorMittal's scale and financial resources mean any technology it adopts becomes a
      global commercial benchmark — and Electra cannot outspend it in a direct competition. However, ArcelorMittal's
      reports and policies page was accessible but showed only navigation content without detailed product or
      capacity data.
