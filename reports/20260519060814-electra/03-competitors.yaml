  - id: FP003
    title: Moat and readiness KPIs — Electra vs. key competitors
    type: kpi
    layout: standard
    summary: >-
      Key performance indicators comparing Electra and its strongest competitors on the dimensions most relevant
      to moat durability and commercial readiness as of May 2026.
    data:
      items:
        - label: Stegra committed tonnes vs Electra
          value: 1.5M+ t vs undisclosed demo
          note: >-
            Stegra has 1.5M+ tonnes pre-sold to OEM brands; Electra's Nucor PO is demo-scale with undisclosed
            volume.
        - label: Electra ore grade advantage (min Fe%)
          value: 35% vs 67% H-DRI
          note: >-
            Electra processes ≥35% Fe ores; H-DRI competitors (Stegra, HYBRIT) require ≥67% Fe. Gap widens
            as high-grade ore supply tightens.
        - label: Electra iron purity vs DRI
          value: 99% vs 81–88%
          note: >-
            Electra 99% pure iron versus DRI range 81–87.9%. Relevant for specialty EAF grades requiring
            low residual impurities.
        - label: Stegra funding vs Electra total
          value: €6.5B vs ~$264M
          note: >-
            Stegra raised ~25× Electra's total capital. Scale differential is the most visible competitive gap.
        - label: SSAB Zero commercial headstart
          value: Commercial (2024+)
          note: >-
            SSAB Zero (scrap + renewable path) already commercial, while Electra targets 2029 for commercial
            production. First-mover buyer relationships at risk.
        - label: Electra demo capacity vs commercial need
          value: 500 t/yr vs 2M+ t/yr
          note: >-
            Demo plant 500 t/yr vs typical commercial steel plant needing 2M+ t/yr iron. Scale gap is 4,000×
            before Electra can fully serve a single large customer.
        - label: HYBRIT H2 storage validation
          value: Proven at pilot (Feb 2025)
          note: >-
            HYBRIT's hydrogen storage was the most cited H-DRI technical risk. Feb 2025 pilot success removes
            this bottleneck for HYBRIT's commercial path.
        - label: Nucor Econiq product as substitute
          value: Commercial (reputationTier high)
          note: >-
            Nucor's Econiq net-zero steel is already available to buyers seeking Scope 3 emission claims.
            Buyers who accept offset-based net-zero may not need Electra's clean iron attribute.
    approximationNotes: >-
      All comparisons based on publicly available evidence as of May 2026. Stegra total funding figure includes
      equity, green bonds, and project finance as stated by Stegra. Electra total raised excludes the $50M
      Catalyst grant and $30M JPM debt for comparability with equity-only metrics.
    claimRefs:
      - CP011
      - CP013
      - CP018
      - CP019
      - CP028
      - CP029
      - CP032
callouts:
  - calloutType: risk
    title: Stegra's scale and pre-sold backlog is the most material competitive threat
    body: >-
      Stegra has 1.5 million tonnes pre-sold to Porsche, IKEA, Mercedes-Benz, Volvo, Scania, and Microsoft
      — representing committed buyer relationships that Electra will need to build from scratch at commercial
      scale. These buyers have public decarbonization targets and may not need to buy from multiple sources
      once their volumes are committed.
    claimRefs:
      - CP011
      - CP013
      - CP033
  - calloutType: strength
    title: Ore grade flexibility is a structural moat vs. all H-DRI competitors
    body: >-
      Electra's ability to use ores ≥35% Fe versus H-DRI's ≥67% Fe requirement creates a supply chain moat
      that H-DRI competitors cannot replicate with current chemistry. This moat is reinforced by the equity
      alignment of BHP, Rio Tinto, and Roy Hill as both investors and potential ore suppliers.
    claimRefs:
      - CP020
      - CP026
      - CP027
  - calloutType: risk
    title: Nucor's Econiq product creates a near-term bypass for some Scope 3 buyers
    body: >-
      Nucor — Electra's anchor EAF customer — already offers Econiq, a commercially available net-zero steel
      product using RECs and offsets. For buyers seeking to reduce reported Scope 3 steel emissions without
      paying a physical clean iron premium, Econiq is an immediately available substitute that Electra must
      differentiate against, particularly once Electra must compete on price at commercial scale.
    claimRefs:
      - CP029
      - CP030
      - CP039
