callouts:
  - calloutType: strength
    title: "Deep strategic investor base across the steel value chain"
    body: >-
      The $186 million Series B syndicate spans iron ore miners, EAF steelmakers, trading houses, and large
      industrial buyers. That cross-value-chain alignment is unusual for a pre-commercial materials startup and
      materially improves Electra's odds of securing both feedstock and future market access.
    claimRefs:
      - CO015
      - CO021
      - CO027
  - calloutType: risk
    title: "No publicly disclosed valuation — return modeling is blind"
    body: >-
      Every retained source reviewed for this chapter leaves post-money valuation unverified. A commonly cited
      figure around $1.5 billion cannot be traced to a primary source in the retained evidence, so dilution and
      return analysis remain impossible without term sheets or a current cap table.
    claimRefs:
      - CO020
  - calloutType: insight
    title: "Shared co-founder background reduces early-stage execution risk"
    body: >-
      Sandeep Nijhawan and Quoc Pham previously worked together at AquaHydrex and Staq Energy before founding
      Electra, giving them a shared operating history in electrochemical systems rather than a newly assembled
      founding partnership. That common track record likely reduced team-friction risk during the first years of
      technology development.
    claimRefs:
      - CO042
      - CO006
      - CO007
