company:
  name: Electra
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Electra is a Boulder, Colorado clean-iron startup founded in March 2020 that says its low-temperature
    electrochemical-hydrometallurgical process can turn lower-grade iron ores into 99% pure iron with zero
    CO2 emissions and no green premium. Public reporting through May 19, 2026 shows a pre-commercial company
    with $214 million of disclosed equity funding, substantial strategic backing across the steel value chain,
    a 130,000-square-foot Colorado demonstration facility targeting mid-2026 startup, and unresolved public gaps
    around board governance, valuation, and scale-up risk.
sections:
  - id: section-identity-mission
    title: "Identity, Mission, and Business Model"
    body: >-
      Electra presents itself as a climate-industrial company trying to reinvent ironmaking rather than merely
      optimize an existing blast-furnace route. The company is branded publicly as Electra, while a Toyota Tsusho
      announcement identifies the legal entity as Electra Steel Inc., a Colorado company founded in March 2020 by
      Sandeep Nijhawan and Quoc Pham. Public company pages place headquarters in Boulder, Colorado, while hiring and
      recruiting materials point to demonstration-facility and manufacturing activity centered in nearby Broomfield.

      The core product claim is straightforward: Electra says it can produce 99% pure iron using a low-temperature
      electrochemical-hydrometallurgical process powered by zero-carbon electricity, with output suitable for electric
      arc furnace steelmakers and iron-based battery applications. That positioning matters because steel is among the
      largest industrial emissions sources globally, and Electra frames its business around removing the emissions-heavy
      ironmaking step without requiring premium pricing. As of the run date, however, Electra remains a private,
      pre-commercial company with no publicly disclosed revenue or audited financial metrics, so investors can assess
      the strategic logic and capital formation more easily than current operating performance.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO031
      - CO032
      - CO034
    tableRefs:
      - TO001
    figureRefs:
      - FO002
  - id: section-leadership-governance
    title: "Leadership and Governance"
    body: >-
      Electra's public leadership story is still anchored on its two co-founders. Sandeep Nijhawan is the visible
      chief executive and fundraising face of the company, while Quoc Pham remains the central technical architect of
      the electrochemical process. Their shared history matters: before Electra they worked together at AquaHydrex and
      Staq Energy, which gives the company a repeated-founder profile rather than a first-time founding team learning
      electrochemistry from scratch. The broader executive bench appears purpose-built for scale-up, with James Rutland
      handling finance, Keith Shuttlesworth leading commercial work into the steel market, Karen Robertson overseeing
      talent, and Simon Wandke adding iron-ore domain credibility as advisory-board chair.

      Governance transparency remains limited. Electra's official materials disclose named executives and advisors, but
      they do not publish a full board roster, independent-director map, or ownership-control structure. There is also a
      subtle role-clarity issue around Quoc Pham: the 2022 funding materials called him CTO, while more recent company
      pages emphasize his co-founder status without the same formal title. None of that negates the team's depth, but it
      does concentrate key-person risk in the founders during the period when process scale-up, partner conversion, and
      large-project financing all depend heavily on their continuity and credibility.
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO042
    tableRefs:
      - TO002
  - id: section-funding-capital
    title: "Funding, Capital Structure, and Milestones"
    body: >-
      Electra has assembled one of the deeper financing stacks in the emerging clean-iron category, albeit still with
      limited public transparency around valuation and governance rights. The company first disclosed a major $85 million
      Series A in October 2022 and then announced a much larger $186 million Series B in April 2025. Together with later
      reporting, those rounds imply $214 million of disclosed equity financing before non-dilutive and debt support are
      added. Public sources further show a layered capital stack that includes a $50 million Breakthrough Energy Catalyst
      award, an $8 million Colorado clean-industry tax credit, and a $30 million JP Morgan venture-debt facility tied to
      development of the first commercial facility.

      The investor mix is unusually strategic for a pre-revenue industrial company. The syndicate spans climate-tech VCs,
      sovereign and institutional capital, iron ore producers, steelmakers, a trading house, and industrial buyers,
      creating both financing depth and channel validation. Milestone reporting suggests a stepwise path from early pilot
      work to a 2024 externally reported commercial-size prototype milestone, then to a mid-2026 Colorado demonstration
      facility target and a 2029 commercial-scale ambition. The largest analytical blind spot is valuation: no retained
      public source provides a verified post-money figure for any round, making return modeling and dilution analysis
      impossible without data-room access.
    claimRefs:
      - CO014
      - CO015
      - CO016
      - CO017
      - CO018
      - CO019
      - CO020
      - CO021
      - CO028
    tableRefs:
      - TO003
      - TO004
    figureRefs:
      - FO001
      - FO003
  - id: section-commercial-progress
    title: "Commercial Progress and Scale"
    body: >-
      Commercial traction is visible but still early. Public reporting says Electra is building a 130,000-square-foot
      demonstration facility in Jefferson County, Colorado with capacity of up to 500 tonnes of iron per year and a
      targeted opening by mid-2026. That facility is strategically important because it is meant to convert laboratory and
      prototype credibility into customer-qualified product, purchase-order fulfillment, and eventually financing support
      for a larger commercial plant expected later in the decade.

      The customer and partner base is stronger than many pre-commercial materials startups can show publicly. Reporting
      indicates advanced purchase orders from Nucor, Toyota Tsusho, and Interfer Edelstahl Group, an Environmental
      Attribute Credit agreement with Meta, an Interfer specialty-steel MOU signed in December 2024, and Toyota Tsusho's
      April 2025 investment tied to automotive-grade EAF steel distribution. Hiring activity also suggests real operating
      build-out rather than a paper partnership strategy: Electra grew from roughly 50 employees in 2022 to 130-plus by
      2025, and job postings in May 2026 spanned engineering, operations, EHS, and commercial roles across Boulder and
      Broomfield. The remaining commercial question is whether this momentum is sufficient to outrun the technical and cost
      challenges Bloomberg highlighted during the scale-up race.
    claimRefs:
      - CO022
      - CO023
      - CO024
      - CO025
      - CO026
      - CO027
      - CO029
      - CO030
      - CO035
      - CO036
