  - id: TV005
    title: 投资逻辑击穿和否决触发表
    columns:
      - 触发项
      - 监测信号
      - 阈值
      - 行动
    rows:
      - - 示范铁质量不达标
        - Jefferson County 设施首批铁纯度证书
        - 首次披露的示范批次数据中，铁纯度 <97% 或能耗强度 >6 MWh/t
        - 投资逻辑击穿：商业化放大逻辑失效；重新评级为卖出；评估工艺能否修复，还是代表根本限制
      - - 示范产量不达预期
        - 示范设施季度产量数据
        - 商业运营后任意连续两个季度的年化产量 <300 t/yr
        - 重大负面：放大逻辑受损；重新评级为继续研究（从买入）或卖出（从持有）；重新评估资本部署
      - - 锚定客户流失
        - Nucor 或 Toyota Tsusho 的新闻稿、SEC 文件或投资人沟通
        - 任一方公开撤回采购订单、推迟认证，或出售 Electra 投资
        - 关键：锚定买家流失会击穿估值；重新评级为卖出；重估整个商业模型
      - - 商业设施融资未落实
        - 项目融资承诺或 DOE LPO 授奖的公开公告
        - 到 2027 年底仍未宣布商业设施融资
        - 重大负面：2029 年商业化目标承压；重新评估时间表、稀释路径和资本充足性
      - - 监管执法行动
        - OSHA 检查记录、EPA 案卷或 CDPHE 许可文件
        - Jefferson County 任何 OSHA 处罚通知、EPA 同意令或 CDPHE 许可拒绝
        - 中等至高，取决于严重程度；评估财务敞口和延误时间表；重新评级为继续研究或卖出
      - - 下调估值融资或契约违约
        - 媒体报道、债权人沟通或股权融资公告
        - 股权融资定价低于估计 Series B 投后估值，或公开报道出现 JPM 契约豁免请求
        - 高：资本结构承压；若伴随锚定客户走弱，重新评级为卖出
    notes: 触发阈值仅为分析师监测目的设定；并不代表 Electra 的内部运营目标或合同里程碑。投资人应结合直接尽调获取的公司运营和财务报告，补充这些外部信号。并非所有触发项都能独立核验——部分需要访问非公开公司信息。
