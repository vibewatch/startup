      - number: '5.2'
        title: 差异化、知识产权与原料灵活性
        blocks:
          - type: paragraph
            body: >-
              Electra 最清晰的技术差异化是原料灵活性。公司称，其工艺可处理铁含量低至 35%
              的矿石，明显低于传统炼铁路线和氢基直接还原铁系统通常要求的门槛。这一点重要，因为钢铁行业承受脱碳压力，而高品位矿石在结构上稀缺且昂贵。Electra
              认为，酸基路线可以绕开上游选矿、研磨和球团化要求；这些环节正是低品位矿石升级到其他绿色炼铁路径时成本上升的原因。

              该工艺看起来也不是简单处理杂质，而是试图把杂质变成收入。公开报道称，二氧化硅、氧化铝和其他共生矿物可在净化过程中分离，并出售给其他工业市场，从而部分抵消工艺成本。生产侧，Electra
              并没有描述一座单体巨型工厂架构；它把产品定位为一套由电化学单元和阵列组成的模块化网络，可以堆叠、复制。据报道，单个阵列最高可达每年 50,000 吨。这种模块化还得到专利保护、使用现成材料的设备选择，以及
              TIME、BloombergNEF 等奖项认可的支撑。相较 H2-DRI，Electra 的差异化价值主张围绕矿石灵活性、分阶段扩产，以及潜在更低的上游碳负担展开。
