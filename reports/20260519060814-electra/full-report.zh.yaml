      - number: '3.4'
        title: 护城河耐久性、切换成本、锁定效应与反向竞争证据
        blocks:
          - type: paragraph
            body: >-
              Electra 最有防御力的护城河是原料适配性：使用低品位铁矿石的能力，与矿业公司形成供应链协同，而 H-DRI 竞争者若不改变化学路径就无法复制。价值链投资方协同进一步强化这一点——BHP、Rio Tinto
              和 Roy Hill 持有 Electra 股权，使矿石供应方和技术提供方利益一致。如果出现一种新的 H-DRI 技术也能处理低品位矿，这道投资方护城河会被削弱；但目前没有此类竞争者在开发。


              铁纯度规格护城河真实存在，但仍处早期。一旦 EAF 运营商围绕 99% 纯清洁铁而不是 81–88% DRI
              调整炉料配方，就会形成针对该铁化学组成的工艺规格、产率模型和质量保证流程。产品通过认证后，这会形成中等切换成本，类似特种化学品供应商锁定。不过，Electra 尚未获得任何 EAF
              运营商的商业化规模认证，因此这道护城河是预期中的，不是当前已经具备的。


              关键反向竞争风险包括：（1）规模型先发劣势——Stegra 的 Boden 工厂达到商业化规模后，会产生成本数据，在 Electra 进入商业化规模前验证或挑战 H-DRI 经济性；如果 H-DRI
              被证明出厂价低于 $400/tonne，Electra 可为矿石适配性和纯度优势收取的溢价会收窄；（2）Nucor 的 Econiq 产品已经向买方提供由 Nucor 运营规模支撑的净零认证钢，削弱 Scope
              1 买方为 Electra 清洁铁支付绿色溢价的紧迫性；（3）Boston Metal 的 MOE 路线若实现商业化规模，将直接争夺同一个 99%
              纯清洁铁市场，并可能拥有更简单工艺（无酸溶解步骤）；（4）如果清洁铁买方需求明确显现，ArcelorMittal 和 POSCO 有资本和客户关系快速行动——Electra 2029 年商业化目标给了
              ArcelorMittal 三年时间加速自有项目。
