      - number: '3.3'
        title: 能力、定价、进入市场与分销对比
        blocks:
          - type: paragraph
            body: >-
              EAF 钢厂买方最看重三个维度：铁纯度、矿石品位适配性，以及工艺温度 / 能源兼容性。在这些维度上，Electra 相比 H-DRI 路线有明显优势，在纯度上与 MOE 大致相当，而 MOE
              尚未证明商业可得性。H-DRI（HYBRIT、Stegra）生产的 DRI 纯度为 81–87.9%；Electra 生产 99%
              纯铁，比生铁（92–95%）更干净，也更适配高等级钢规格。生产高品质汽车钢或特种钢等级的 EAF 运营商，可以用这一纯度优势减少合金修正和废钢分拣工作。


              矿石品位适配性是 Electra 最锋利的竞争差异点。H-DRI 高效完成氢还原化学反应，需要铁含量 ≥67% 的矿石。Electra 的湿法冶金溶解步骤可处理低至 35%
              铁含量的矿石——这意味着低品位矿山能成为经济可行的原料来源。该点重要，因为高品位块矿（≥67% Fe，例如 BHP 或 Rio Tinto Pilbara 业务的直装矿）是全球稀缺资源，而 Electra
              的投资方（BHP、Rio Tinto、Roy Hill）持有大量低品位矿储量，目前市场较小。如果 Electra 技术能放大，就会为这些矿石创造新的高价值用途。


              从进入市场和分销看，Electra 已搭起结构化多渠道策略：Nucor 是直接 EAF 客户（采购订单），Toyota Tsusho 是面向亚洲和全球汽车市场的专门分销伙伴，Interfer Edelstahl
              是欧洲特种钢分销渠道，Meta 是面向科技 / 数据中心渠道的 EAC 买方。这种按买方细分设计的多渠道打法，比 Boston Metal 更成熟（后者没有公开确认的分销伙伴），但明显不如 Stegra
              完整（后者已向主要汽车品牌和零售商预售 1.5M+ tonnes）。Electra 清洁铁定价未公开披露，公司也未披露每吨目标售价，因此绿色溢价和竞争价格定位仍是尽调缺口。
            claimRefs:
