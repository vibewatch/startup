      - number: '5.5'
        title: 客户、应用与开发者信号
        blocks:
          - type: paragraph
            body: >-
              对一家商业化前的材料公司来说，Electra 的客户证据异常强。需求拉动同时来自钢铁买家和相邻的碳核算客户。Nucor 围绕电弧炉钢用可持续铁原料的公开表态，尤其是面向汽车供应链的表态，与 Electra 99%
              纯度产品叙事高度吻合。Toyota Tsusho 已投资公司，并表示计划把 Electra 铁分销到汽车级 EAF 应用；Interfer 则围绕欧洲特种钢机会来定义该产品。Meta
              通过一份与数据中心建设供应链所用低碳铁挂钩的环境属性信用协议，提供了另一类验证。

              Electra 也在探索磁体和电池等相邻应用。如果纯度和成本目标站得住，这会把潜在可服务市场从钢铁进一步扩出去。Electra 公开没有展示的是传统开发者生态：没有公开 GitHub 组织、开发者 API、SDK
              或社区论坛与产品绑定。对工业硬件公司而言，这种缺失并不致命，但意味着从业者信号主要来自招聘、专利文献和合作伙伴公告，而不是开源社区。创始人的电化学背景，尤其是 Quoc Pham
              此前在液流电池和燃料电池方面的工作，进一步支撑了这种由从业者驱动的技术可信度。
