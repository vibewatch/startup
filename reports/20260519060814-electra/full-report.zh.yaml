      - number: '8.2'
        title: 建议、信心与估值立场：等待示范表现后继续研究
        blocks:
          - type: paragraph
            body: >-
              分析师建议为继续研究，信心中等。投资逻辑在结构上成立——技术差异化、世界级战略锚点、可信的脱碳刚需，以及电化学炼铁上的深厚人才护城河。不过，截至运行日期（2026-05-19），当前证据基础还不足以支持高信心买入或放弃判断，因为最重要的单一数据点——示范设施在工业规模下的铁纯度和吞吐——尚不可得。示范设施计划在
              2026 年中启用，意味着本报告后六到十二个月内，应可获得可用于尽调的性能数据。


              风险评级：高。估值未披露、商业化前规模、FOAKE
              技术风险、客户依赖集中，以及不利政策环境共同作用，使其对大多数机构投资者而言明显落入高风险区间。公司已通过战略投资者财团、赠款资金和专利保护显著降低投资逻辑风险，但商业可行性仍未证明。


              估值立场：未披露。Series B 的投后估值没有公开披露。媒体报道（Bloomberg 专题报道）曾引用 $1–2B
              区间的内部或分析师估计估值，但没有独立确认。公司顾问似乎正在商业设施融资前管理估值纪律。缺少已确认的估值锚点时，任何进入价格纪律都必须依赖情景加权结果分析（见乐观/基准/悲观部分）和可比基准。
