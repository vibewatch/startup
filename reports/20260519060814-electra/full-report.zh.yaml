              Electra 可使用 ≥35% Fe 矿石，而 H-DRI 要求 ≥67% Fe，这形成了 H-DRI 竞争者无法用当前化学路径复制的供应链护城河。BHP、Rio Tinto 和 Roy Hill
              既是投资方也可能是矿石供应方，这种股权协同进一步强化护城河。
