      - number: '4.4'
        title: 单位经济与成本结构
        blocks:
          - type: paragraph
            body: >-
              Electra
              的单位经济未公开披露，也无法从现有来源推导。公司“没有绿色溢价”主张——即其铁的成本将等于或低于传统煤基铁——是投资逻辑核心，但尚未在商业化规模获得独立验证。该工艺涉及四类主要成本投入：铁矿石原料、电力（可再生）、试剂（酸性溶液、湿法冶金化学品）和资本设备（电积模块）。一项关键声称优势是可使用更便宜、更充足的低品位矿石（低至
              35% 铁含量），而氢基直接还原铁（DRI）工艺需要高品位矿石。电力成本是重要变量：该工艺设计用于间歇性可再生能源；若与低成本弃光或弃风匹配，可降低成本，但也带来运营复杂性。示范设施（500
              tonnes/year）旨在商业化规模部署前跑通单位经济；投资人沟通材料暗示，模块化设计允许复制单元持续学习降本，类似太阳能和锂离子电池的学习曲线。从毛利率看，新兴绿色工业材料中的可比公司（例如早期 FOAK
              电池或绿色氢生产商）在示范规模通常为负毛利或接近零毛利，只有达到商业化销量后才有望改善。没有独立工程或成本研究发表 Electra
              工艺数据。共生矿物销售（硅石、氧化铝）可抵消运营成本，但仍是早期收入流，定价和市场规模未披露。Nucor 可持续发展数据显示，传统 EAF 每吨钢约产生 0.77 tonnes CO₂，而高炉每吨钢约产生 2
              tonnes CO₂；Electra 的铁产品定位是支撑低碳 EAF 路线，但其每吨铁成本相对 DRI 级替代品还没有公开基准。
