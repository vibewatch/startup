        title: 图表与证据
        blocks:
          - type: callout
            title: 从示范到商业化的放大，是主要打穿逻辑的风险
            body: >-
              Electra 的 500 吨/年示范工厂目标在 2026 年中投产，商业设施目标为 2029
              年。示范与商业规模之间相差五个数量级，意味着公司必须先证明模块化电池复制、工业酸循环可靠性和铁纯度一致性，项目融资才有可能。投资者应把示范设施的铁纯度和吞吐数据作为判断 2029
              年商业化时间表是否可信的首要信号。
            calloutType: risk
