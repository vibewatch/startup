            body: >-
              留存分析必然只能是临时性的，因为 Electra 尚未交付有意义的铁量，也没有披露收入。这意味着 NRR、GRR、logo 流失、队列留存或满意度分数等标准 SaaS
              式指标不可得，而且在多数情况下概念上也为时过早。相关尽调问题因此不是 Electra
              是否已经证明留存，而是在首次交付前是否有任何客户流失迹象。公开层面没有：没有买家宣布终止、暂停或降级，也没有公开修订削弱具名协议。即便如此，缺少负面证据不应被误读为合同耐久性。五份协议均未交付，公开披露也没有揭示期限、续约权、照付不议最低量、终止罚则、排他条款或转换里程碑。正确的承保立场是：留存尚不可衡量，耐久性取决于
              Jefferson County 示范设施能否按承诺时间表生产符合规格的铁和经过验证的 EAC。
