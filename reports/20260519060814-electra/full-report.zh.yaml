  - id: FP001
    title: 竞争定位图 — 技术成熟度 vs. 铁产出纯度
    type: quadrant
    layout: standard
    summary: >-
      按技术商业化成熟度（x 轴）和铁产品纯度（y 轴）定位六个关键清洁铁 / 绿色钢竞争者。Electra 位于高纯度、中等成熟度（示范阶段）。 Stegra 和 Nucor 成熟度最高，但纯度较低。Boston Metal
      具备高纯度潜力，但商业成熟度最低。
    data:
      points:
        - id: electra
          label: Electra
          x: 3
          'y': 9
          detail: 示范 500t/yr（2026），商业化 2029。通过电积生产 99% 纯铁。矿石品位灵活。
        - id: boston_metal
          label: Boston Metal（MOE）
          x: 2
          'y': 9
          detail: 试点 / 商业化前。MOE 平台理论上可达到 >99% 纯度。TIME Best Inventions 2025。与 Outokumpu 合作开发钢材。
        - id: hybrit_ssab
          label: HYBRIT / SSAB
          x: 7
          'y': 5
          detail: SSAB Zero 已商业化（废钢路线）。HYBRIT 试点延长至 2031。H2 储存已于 Feb 2025 验证。Rheinmetall LOI Jan 2026。
        - id: stegra
          label: Stegra（H2GS）
          x: 8
          'y': 5
          detail: 已获 €6.5B 资金。预售 1.5M+ t。Boden 工厂仍在建设（Apr 2026 新增 €1.4B 融资）。目标产量 2026–2027。
        - id: arcelormittal
          label: ArcelorMittal XCarb
          x: 5
          'y': 4
          detail: Midrex DRI Gent 正在转型。XCarb 证书已商业化。全球最大钢铁制造商。Texas DRI。BF-BOF 仍主导全球。
        - id: nucor
          label: Nucor（EAF 既有玩家）
          x: 9
          'y': 4
          detail: 美国钢铁 25%+；全 EAF。Econiq 净零商业产品。现有 Electra 示范买方。美国最大 EAF 钢厂，具备商业规模优势。
        - id: posco
          label: POSCO
          x: 5
          'y': 3
          detail: BF-BOF 主导；HyREX H-DRI 试点。Apr 2026 与 Electra 签署 JDA，合作电积。全球前五钢厂。
    approximationNotes: >-
      坐标轴为定性序数尺度。X 轴（技术成熟度）：1=实验室/概念，5=高级试点，9=完全规模化商业。 Y 轴（铁纯度）：1=原矿，5=DRI 区间（81–88%），9=电解金属（99%+）。Boston Metal
