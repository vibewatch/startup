            title: Nucor 同时是投资者和客户，是结构性治理问题
            body: >-
              Nucor 同时是 Electra 的锚定客户和长期投资者。如果 Nucor 未来试图重新谈判采购价格或改变铁规格，就会产生利益冲突。尽调应检查 Nucor
