  - id: TV006
    title: 最终尽调请求表
    columns:
      - 请求
      - 优先级
      - 重要性
      - 提供方
      - 格式
    rows:
      - - 示范设施铁纯度和产量数据（首批生产批次）
        - 关键
        - 核心技术关口：决定商业化放大逻辑是否成立，并支撑有约束力客户合同
        - 公司 + 独立实验室认证
        - 分析证书、产量日志、能耗报告
      - - Series B 投后估值和优先权结构
        - 关键
        - 若没有确认估值和清算优先权条款，无法评估入场价格纪律和下行保护
        - NDA 下由公司提供
        - 股权结构表摘要、条款清单（经删节）
      - - Nucor 和 Toyota Tsusho 预购订单约束性条款
        - 关键
        - 商业模型验证：销量、定价、期限和认证阈值决定收入模型假设
        - NDA 下由公司提供
        - 承购条款清单（经删节）
      - - 商业设施选址和 FEED 研究
        - 高
        - 若缺少 capex、时间表和监管路径的工程依据，无法承保 2029 年商业化目标
        - NDA 下由公司提供
        - FEED 研究摘要、选址标准、目标 capex 区间
      - - DOE LPO 预申请或申请状态
        - 高
        - LPO 融资会是商业化规模最大的单项资本承诺；其状态决定项目融资时间表
        - 公司或 DOE 公开披露
        - LPO 申请确认、预申请反馈函（必要时经删节）
      - - JP Morgan 风险债条款和契约
        - 高
        - 契约结构决定经营约束和加速到期风险；$30M 债务增加固定现金支出和里程碑压力
        - NDA 下由公司提供
        - 债务条款清单（经删节）、契约清单
      - - POSCO JDA 财务承诺和采购义务
        - 高
        - JDA 范围决定 POSCO 是战略资本提供方和承诺客户，还是轻量技术合作方
        - NDA 下由公司提供
        - 标明财务承诺的 JDA 条款清单
      - - 烧钱速度和现金跑道预测（18 个月滚动）
        - 高
        - 若不知道现金消耗速度，就无法评估通往商业设施融资的现金跑道；会制造资本短缺的二元风险
        - NDA 下由公司 CFO / 财务团队提供
        - 月度现金流实际值（过去 12 个月）、未来 18 个月烧钱估计
    notes: >-
      尽调请求按关键（卡住投资逻辑）和高（澄清重大风险）排序。做出任何投资承诺前，必须解决关键请求；完整提交投委会前，应处理高优先级请求。所有请求均假设已签署 NDA；针对公开可得信息（DOE LPO 状态、SEC
      文件）的请求，应先通过公开来源确认，再向公司索取文件。
