      - number: '3.2'
        title: 主要竞争者画像——规模、技术、融资与商业化状态
        blocks:
          - type: paragraph
            body: >-
              Boston Metal 与 Electra 技术位置最接近——两者都用电力在无碳条件下从氧化矿中还原铁——但底层机制完全不同。MOE 在约 1,600°C
              的熔融电解池中运行，通过高温电子转移分离铁；Electra 则在 60°C 下先用水性酸溶解，再电积。Boston Metal 已入选 Global Cleantech 100 Hall of Fame，并与
              Outokumpu 合作钢铁应用，但截至 2026 年，其 MOE Steel 产品线仍未商业化。其 MOE Critical Metals
              业务线面向钴、镍等电池金属，是另一条商业化路径，也降低了对钢铁市场的依赖。Boston Metal 已筹集大量风险资本，但可访问来源不能确认其总融资水平和商业化规模目标。


              Stegra 是最强的规模化竞争者。它拥有约 €6.5 billion 总融资（股权、绿色债券、项目融资），已向 Porsche、IKEA、Mercedes-Benz、Volvo、Scania 等客户预售 1.5
              million tonnes 绿色钢；截至 2026 年，Boden 的 DRI 塔和电解槽仍在建设中。Stegra 正在执行史上最大单体清洁炼铁投资。2026 年 4 月，Stegra 原则上同意进一步融资
              €1.4 billion。2025 年 9 月，Microsoft 承诺为数据中心建设向 Stegra 采购绿色钢。关键脆弱点在于，Stegra 需要天然气作为原料过渡（计划中的 H2 依赖大规模绿色 H2
              供应，Boden 经济性依赖瑞典水电），且该工厂是一次性巨额资本押注，并非模块化系统。


              HYBRIT（SSAB + LKAB + Vattenfall 合资）在 2025 年 2 月以试点规模验证了氢储存技术，消除了 H-DRI 路线的一项重大技术风险。SSAB 已把 SSAB Zero
              作为产品商业化，并在 2026 年 1 月与 Rheinmetall 签署意向书，为国防制造供应无化石钢——这是首家正式承诺采购脱碳钢的国防公司。HYBRIT 试点计划已延长至 2031
              年，以继续规模化和降本。商业化 SSAB Zero 产品基于既有回收废钢路线加无化石能源，而不是已经按完整 HYBRIT H-DRI 路线规模化；因此，完整无化石原生铁工艺仍处于过渡中。


              ArcelorMittal 是全球最大钢铁企业，低碳炼铁组合最分散：比利时 Ghent 的 Midrex H-DRI 工厂、美洲天然气 DRI，以及 XCarb 创新基金和绿色钢产品线。它也作为 EAF
              买方运营（部分基地使用 EAF），并在全球经营 BF-BOF。ArcelorMittal 的规模和财务资源意味着，任何被它采用的技术都会成为全球商业化标杆；Electra
              无法在正面竞争中与其拼资本投入。不过，ArcelorMittal 的报告和政策页面可以访问，但只显示导航内容，没有详细产品或产能数据。
