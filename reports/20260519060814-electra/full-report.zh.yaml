      - - 示范规模和首个商业规模的预估单位经济性
        - 无法验证「没有绿色溢价」主张，也无法评估通往正毛利的路径
        - 要求提供基于工程测算的成本模型，覆盖 500-tonne/year 示范规模和首个商业规模（50k+ tonnes/year）
