              Nucor 是 Electra 的锚定 EAF 客户，但已经提供商业可得的 Econiq 净零钢产品，使用 REC 和抵消。对希望降低已报告 Scope 3
              钢铁排放、又不想为实体清洁铁支付溢价的买方来说，Econiq 是立即可用的替代品；Electra 必须与其区分开来，尤其是在商业化规模需要拼价格之后。
