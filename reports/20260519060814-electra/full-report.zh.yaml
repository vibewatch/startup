      - number: '7.2'
        title: 监管、环境与安全风险：化学加工受联邦和州层面监管
        blocks:
          - type: paragraph
            body: >-
              Electra 的工艺建立在商业规模的酸基湿法冶金之上——这类工业化学已有成熟的联邦和州监管要求，公司建设商业设施时必须逐项处理。在示范规模（500 吨/年）下，Jefferson County 设施依据
              Colorado Department of Public Health and Environment（CDPHE） 空气质量许可和地方土地使用批准运行。Colorado Energy Office 和
              CITCO 税收抵免项目确认该项目获得州政府支持，意味着此前已经经过州层面的环境审查。


              到商业规模后，Electra 设施可能触发 Clean Air Act 下 Prevention of Significant Deterioration（PSD） 和 Title V
              项目的主要排放源门槛。这些要求施工前许可、Best Available Control Technology（BACT）分析，以及持续排放监测。OSHA 的 Process Safety
              Management（PSM）标准（29 CFR 1910.119）适用于使用硫酸、盐酸或其他高度危险化学品且超过阈值数量的运营——对大规模酸浸而言很可能如此。OSHA PSM
              要求工艺危害分析、书面操作规程、应急响应计划和定期合规审计。公开招聘 Senior EHS Manager（Manufacturing） 证实 EHS 基础设施仍在搭建。


              EPA RCRA 危险废物法规约束废酸溶液和共生矿物工艺流的处置。虽然 Electra 的商业模式把共生矿物（二氧化硅、氧化铝）转化为可销售产品，但被拒收流和商业规模电解液废物的去向尚未公开披露。IP
              风险可控：专利 AU2022241786A1 通过澳大利亚 PCT 路线提交，覆盖核心电化学工艺；但电积本身并不新，Boston Metal 和 HYBRIT
              研究联盟也有替代路线（碱性电积、熔融氧化物电解）。公开来源未发现诉讼或 IP 争议。
