              在 Electra 其他方面较强的证明组合里，客户集中度是主要弱点。Nucor 显然是锚定关系，也可能是单一经济意义最大的买家，因为它同时具备战略相关性、购买意向和美国市场信誉。如果这段关系走弱，Electra
              会同时失去潜在收入基础和未来融资轮的重要验证信号。第二个集中度问题是结构性的：五个可见交易对手全部处于收入前，因此公司尚未证明交付后保留或扩张客户的能力。政策风险也重要，因为 Meta EAC
