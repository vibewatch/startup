      - number: '4.2'
        title: 资本形成与融资时间线
        blocks:
          - type: paragraph
            body: >-
              Electra 已搭建横跨股权、补助、税收抵免和风险债的多层资本结构。公司 2022 年 10 月完成 Series A，融资 $85 million，投资方多元，包括 Breakthrough Energy
              Ventures、Amazon Climate Pledge Fund、BHP Ventures、Temasek、S2G Ventures、Capricorn Investment
              Group、Lowercarbon Capital、Valor Equity Partners 和 Baruch Future Ventures。2025 年 4 月 Series B 融资 $186
              million，并吸引了铁钢价值链上的战略投资方，包括铁矿石矿业公司 Rio Tinto、Roy Hill 和 BHP 的风险投资部门；钢厂 Nucor 和 Yamato Kogyo；以及分销伙伴
              INTERFER Edelstahl Group 和 Toyota Tsusho。因此，Series B 同时也是商业验证信号：买方和分销商与财务投资人一起投资。Electra
              公开累计股权融资数字存在重大冲突：Trellis 2025 年 10 月文章报道“已融资 $214 million”，而两份已披露新闻稿相加为 $85M + $186M = $271
              million。最可信的解释是，Trellis 捕捉到 Series B 的阶段性交割（约 $129M），早于完整 $186M 轮次最终完成；Canary Media 自身文章后来也从 $188M 更正为
              $186M，说明最终数字到 2025 年 10 月仍在厘清。公司还从 Breakthrough Energy Catalyst 获得 $50 million 非稀释资金，并在 2025 年 5 月从
              Colorado Energy Office 获得 $8 million Colorado Industrial Tax Credit（CITCO）。2026 年初，JPMorgan 提供 $30 million
              风险债设施，用于支持首座商业化设施规划和开发。所有来源合计披露的资本部署超过 $359 million（$271M 股权 + $50M 补助 + $8M 抵免 + $30M 债务）。
