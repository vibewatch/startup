  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 技术与放大风险：从示范到商业化的鸿沟仍是主导投资风险
        blocks:
          - type: paragraph
            body: >-
              Electra 最大的单一风险，是从示范到商业化的执行缺口。公司的 Jefferson County 设施设计为每年生产 500 吨清洁铁，目标在 2026 年中启用。典型商业钢铁企业需要每年 500,000 到
              2,000,000 吨。这五个数量级的鸿沟意味着，Electra 必须证明模块化电化学单元在工业密度堆叠时，仍能复制良率、能效和吞吐——这一运行状态尚无任何电化学炼铁工艺达到。公司 CEO
              曾把目标商业设施（2029）描述为“规模和产能未披露”，这意味着商业经济性的工程基础尚未披露。


              第二个紧密相关的风险是工艺波动。Electra 的酸浸湿法冶金前端会先溶解成分各异的铁矿石——磷、二氧化硅、氧化铝和其他污染物——再通过电积沉积 99% 纯铁。Anthropocene Magazine
              所说的“秘方”，是在规模化条件下管理亚铁/铁离子平衡和阳极纯度控制；在试点阶段，单位电池是一块平方米级阴极板。商业吞吐需要数千个这样的电池并行运行，并保持一致的电解液化学。不同矿石批次的成分差异可能压缩产品纯度，或提高酸再生成本。Electra
              尚未发布商业化良率预测、单位吨能耗或酸耗数据。


              第三个维度是产品认证。Nucor、Toyota Tsusho 和 Interfer 都有预购订单，但各自都提到认证要求。Interfer 明确表示，其采购取决于获得“特种钢应用的监管认证”。高等级 EAF
              钢、汽车板材或特种应用要认证新的铁源，首次商业交付后可能需要 18–36 个月，从而拉长收入爬坡。
            claimRefs:
