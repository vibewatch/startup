      - number: '1.3'
        title: 融资、资本结构与里程碑
        blocks:
          - type: paragraph
            body: >-
              在新兴清洁铁赛道里，Electra 已搭起较深的融资组合，不过围绕估值和治理权利的公开透明度仍有限。公司最早在 2022 年 10 月披露一笔 $85 million Series A，随后在 2025 年 4
              月宣布规模更大的 $186 million Series B。结合后续报道，这些轮次意味着在加入非稀释和债务支持前，已披露股权融资为 $214 million。公开来源还显示，其分层资本结构包括 $50
              million Breakthrough Energy Catalyst 奖励、$8 million 科罗拉多清洁工业税收抵免，以及与首座商业化设施开发绑定的 $30 million JP Morgan
              风险债设施。

              投资方组合对一家未产生收入的工业公司来说异常偏战略。财团横跨气候科技 VC、主权和机构资本、铁矿石生产商、钢厂、贸易商和工业买方，既带来融资深度，也验证渠道。里程碑报道显示，公司路线按步骤推进：早期试点，到
              2024 年外部报道的商业规格原型里程碑，再到 2026 年中科罗拉多示范设施目标，以及 2029
