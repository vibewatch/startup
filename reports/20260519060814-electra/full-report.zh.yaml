      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              Electra 的买方版图分为五类，各自预算负责人和采用触发点差异很大。核心细分是需要降低 Scope 1 和上游 Scope 3 温室气体（GHG）强度的 EAF 钢厂。Nucor
              是美国最大钢厂，超过四分之一的美国钢完全通过 EAF 生产；它已为 Electra 示范工厂的铁下达采购订单，其原材料 EVP 将汽车市场增长中的 EAF 需求称为采用触发点。Toyota Tsusho 是
              Toyota Group 的贸易部门，已投资 Electra，并计划向钢厂和汽车制造商分销清洁铁，把它嵌入汽车供应链。欧洲大型特种钢分销商 Interfer Edelstahl Group 签署了清洁铁供应
              MOU，前提是特种钢应用取得监管认证。


              第二类不同买方，是购买环境属性信用（EAC）的企业净零买方：Meta 同意购买 Electra 首批 EAC，用于其数据中心建设排放核算。Microsoft 承诺向 Stegra
              采购绿色钢的平行案例说明，超大规模科技公司正成为清洁钢价值链中的主动参与者，直接推动需求创造。这类买方是 Scope 3 排放预算持有人，而不是钢铁产品采购方；它为早期清洁铁生产提供了新的收入和降风险机制。


              汽车 OEM（GM、Ford、Toyota Motor）处在价值链更后端，是间接买方：它们承诺优先采购低碳钢，但没有直接签约铁原料，因此能提供信号，却还不是有约束力的包销。BHP、Rio Tinto 和 Roy
              Hill 等矿业公司以战略投资方身份参与，使它们有动力向 Electra 供矿，但目前还不是商业买方。采用路径依次是：投资方 / 合作伙伴协同 → 示范规模采购协议 → 特种钢认证 → 商业化规模包销。
