            body: >-
              具名客户证明是 Electra 客户故事中最强的一环。截至 2026 年 5 月，已有五个具名交易对手与公司签署公开描述的协议：Nucor、Toyota Tsusho、INTERFER Edelstahl
              Group、Meta 和 POSCO。这些证明的质量并不均衡。Nucor 的战略权重最高，因为这段关系同时包含行业相关性、战略投资和预购协议。Toyota Tsusho
              也是高质量证明，因为其新闻稿描述了面向日本汽车制造商的分销角色。INTERFER 的证明较弱，因为披露工具是 MOU，而不是明确有约束力的采购订单。Meta
              验证了为脱碳属性付费的意愿，但它不是实物铁客户。POSCO 带来重要的亚太证明，但 2026 年 4 月披露被表述为联合开发协议加投资，商业承诺仍不清晰。五家公司共同的主要限制条件
