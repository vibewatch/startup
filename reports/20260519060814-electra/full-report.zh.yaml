              员工，以及 Jefferson County 正在推进的激进制造建设，公司现金消耗很可能相当高。参考相似阶段、相似资本强度的深科技硬件公司，典型烧钱速度为每年 $25M 到 $50M；在 130+
              员工且设施建设活跃的情况下，该区间上限是合理假设。按这一速度，自 2025 年 4 月以来的合计流入预计可从 2025 年中支撑 3–5 年，延伸到约 2028 年末至 2030 年中——与公司提出的 2029
              年商业化设施目标一致。JPMorgan 风险债设施（$30M，2026 年 3
              月完成）明确指向首座商业化设施的规划、工程和准备，说明公司正从单纯依赖后续股权融资，转向项目融资结构。不过，公司很可能仍需要为商业化规模设施筹集额外资本；Canary Media
