      - number: '1.2'
        title: 领导团队与治理
        blocks:
          - type: paragraph
            body: >-
              Electra 的公开领导层叙事仍围绕两位联合创始人展开。Sandeep Nijhawan 是公司可见度最高的 CEO 和融资代表，Quoc Pham 则是电化学工艺的核心技术架构师。两人的共同经历很关键：创办
              Electra 之前，他们曾在 AquaHydrex 和 Staq Energy 共事。这让 Electra
              更像一支连续创业团队，而不是第一次组队、从零学习电化学的创始团队。更广的高管阵容明显为规模化而配置：James Rutland 负责财务，Keith Shuttlesworth 推进钢铁市场商业化，Karen
              Robertson 负责人才，Simon Wandke 以顾问委员会主席身份补上铁矿石领域信誉。

              治理透明度仍有限。Electra 官方材料披露了具名高管和顾问，但没有公布完整董事会名单、独立董事图谱或所有权控制结构。Quoc Pham 的角色清晰度也有细微问题：2022 年融资材料称其为
              CTO，较新的公司页面则强调其联合创始人身份，但不再同样使用正式头衔。这些并不否定团队深度，但在工艺放大、合作伙伴转化和大型项目融资都高度依赖创始人持续性和可信度的阶段，关键人风险会集中在创始人身上。
