  - id: TP004
    title: 护城河耐久度与竞争风险登记表
    columns:
      - 护城河维度
      - Electra 位置
      - 竞争者威胁
      - 耐久度评估
      - 尽调问题
    rows:
      - - 矿石品位灵活性（≥35% Fe）
        - 结构性优势；以现有化学路线看，没有 H-DRI 竞争者能使用 <67% Fe 矿石
        - 未发现直接威胁；MOE 可使用可变矿石，但能耗高
        - 高 —— 除非新 H-DRI 化学路线实现低品位矿石兼容
        - 矿石品位灵活性是否已在试点规模用多种商业矿石组成验证？
      - - 铁纯度（99% vs 81–88% DRI）
        - 一旦通过认证，可锁定 EAF 炉料配方和规格
        - Boston Metal（MOE）理论上可匹配纯度；尚无商业规模验证
        - 中 —— 取决于 EAF 认证成功，以及收益率提升得到验证
        - 是否已有 EAF 运营商正式认证 Electra 铁可用于商业生产规格？
      - - 战略矿业投资者利益一致
        - BHP、Rio Tinto、Roy Hill 持股；有动力供应低品位矿石
        - H-DRI 或 MOE 竞争者没有同等矿业投资者协同
        - 高 —— 矿业公司持股形成耐久的矿石供应协同
        - 投资者股权协议是否包含任何矿石供应条款或价格保护？
      - - EAF 客户早期锁定（Nucor PO）
        - Nucor 采购订单和已证明的买方兴趣形成质量 / 规格入口
        - Stegra 已向高端品牌预售 1.5M+ t，减少开放买方池
        - 中 —— Nucor 的 Econiq 产品部分满足同一 Scope 3 买方需求
        - Nucor 采购订单的数量和价格在商业规模下是否有合同约束，还是仅限示范规模？
      - - IP 与专利护城河
        - 围绕水相溶解 + 电积工艺拥有多项专利
        - Boston Metal 的 MOE 拥有自身 IP 组合；不直接重叠
        - 中 —— 专利覆盖当前工艺，但若化学路线变化，规模化后可能被绕开
        - Electra 专利组合权利要求相对其他电化学路线有多宽？
      - - 模块化学习曲线
        - 模块化设计允许类似太阳能 / 锂电的成本学习，无需一次性押注十亿美元级项目
        - H-DRI 工厂（Stegra €6.5B）并非模块化；迭代成本无法同样低
        - 高 —— 如果模块化学习在商业规模得到验证，单位成本下降会形成复利式护城河
        - 要部署多少个商业模块，才能证明学习曲线带来显著成本下降？
      - - 伴生矿物副产品收入
        - 溶解过程中提取硅石和氧化铝，降低清洁铁净成本
        - H-DRI 或 MOE 路线没有同等副产品收入
        - 中 —— 价值取决于伴生矿物市场价格和生产规模
        - 商业规模下，伴生矿物销售预计对清洁铁单位经济贡献多少？
      - - 美国政策与监管一致性
        - Colorado CITCO 税收抵免；Breakthrough Energy 拨款；潜在 IRA 相邻激励
        - Stegra 和 HYBRIT 受益于欧盟 / 瑞典绿色产业政策（强度更高）
        - 中低 —— Trump 政府已部分回滚美国联邦清洁工业支持
        - Electra 商业化计划是否依赖可能被削减的联邦 IRA 激励？
      - - 多渠道买方基础（分销护城河）
        - 4 渠道模型（EAF / Nucor、汽车 / Toyota Tsusho、特种 / Interfer、EAC / Meta）
        - Stegra 客户渗透更深（与 5 个 OEM 品牌 + 零售商签 1.5M+ t）
        - 中低 —— 买方渠道已建立，但数量承诺仅限示范规模
        - 是否已有分销渠道扩展到示范规模之外的数量承诺？
    notes: 护城河耐久度评级（高 / 中 / 低）基于公开可得证据作定性评估。不反映 Electra 内部战略文件或管理层访谈。耐久度评估假设没有实质技术突破改变矿石品位或纯度经济性。
