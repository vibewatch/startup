  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑：清洁铁站在拐点
        blocks:
          - type: paragraph
            body: >-
              Electra 的投资逻辑建立在三根耐久支柱上。第一，全球钢铁市场巨大——每年生产约 1.9 billion 吨钢，产生大约 $500–600 billion 收入——并贡献全球 7–9%
              温室气体排放，因此脱碳既是经济问题，也是监管必然。第二，Electra 开发了一套自研低温酸性电积工艺，不用炼焦煤即可生产 99%+ 纯铁，运行温度低于
              60°C，并被设计为可使用间歇性可再生电力；公司称其成本可与高炉铁竞争。第三，公司组建了质量极高的战略投资者财团——包括 Capricorn Investment Group、Temasek
              Holdings、BHP Ventures、Rio Tinto、Roy Hill、Nucor Corporation、Yamato Kogyo、Toyota Tsusho 和 Interfer
              Edelstahl——同时验证技术、锚定需求并锁定矿石供应。已在澳大利亚授权、并有 PCT 覆盖的专利（AU2022241786A1）保护核心工艺。POSCO JDA（2026 年 4
              月）又把全球第二大钢铁制造商带入战略合作方。IEA 的 Iron and Steel Technology Roadmap 将新型低温炼铁列为优先脱碳路径，并指出需要项目层面支持。


              反向逻辑同样严肃。估值未披露。示范设施（130,000 平方英尺，美国科罗拉多州 Jefferson County）是公司的首次工业规模测试，计划在 2026 年中启用时年产约 500 吨——大约是典型商业设施的
              1/4,000。跨越六个或更多数量级，从 500 吨/年放大到 500,000+ 吨/年，是一次首创工程挑战，目前没有公开性能数据。Canary Media
              指出，在试点测试中生产铁板“只是证明其能否以成本有效方式放大的许多步骤中的第一步”。Bloomberg 和 Anthropocene 都观察到，亚铁/铁离子平衡管理是 Electra
              尚未披露的核心“秘方”。当前政府回撤 IRA 激励，使美国绿色工业项目的政策环境恶化。全球资本化程度最高的绿色铁创业公司 Stegra（前 H2 Green
              Steel）在融资数十亿欧元后遭遇严重融资困难，提供了警示性参照。商业规模的资本强度可能需要 $1–5 billion 项目融资，而此类设施尚未宣布，也未完成融资。烧钱速度、现金跑道和 JPM 债务契约
              条款均未披露。若按预期 Series B 阶段 $500M–$2B 估值进入，投资者等于在给未来十年几乎无瑕疵的空前放大执行定价。
