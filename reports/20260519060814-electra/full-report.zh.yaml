  - id: FP003
    title: 护城河与就绪度 KPI — Electra vs. 关键竞争者
    type: kpi
    layout: standard
    summary: 截至 May 2026，在最能影响护城河耐久性和商业就绪度的维度上，对比 Electra 及其最强竞争者的关键绩效指标。
    data:
      items:
        - label: Stegra 承诺吨数 vs. Electra
          value: 1.5M+ t vs undisclosed demo
          note: Stegra 已向 OEM 品牌预售 1.5M+ tonnes；Electra 的 Nucor PO 仍是示范规模，体量未披露。
        - label: Electra 矿石品位优势（最低 Fe%）
          value: 35% vs 67% H-DRI
          note: Electra 可处理 ≥35% Fe 矿石；H-DRI 竞争者（Stegra、HYBRIT）要求 ≥67% Fe。高品位矿供应趋紧时，差距会拉大。
        - label: Electra 铁纯度 vs. DRI
          value: 99% vs 81–88%
          note: Electra 99% 纯铁，对比 DRI 区间 81–87.9%。这对要求低残余杂质的特种 EAF 钢级有意义。
        - label: Stegra 资金 vs. Electra 总额
          value: €6.5B vs ~$264M
          note: Stegra 融资约为 Electra 总资本的 ~25×。规模差异是最醒目的竞争缺口。
        - label: SSAB Zero 商业化先发
          value: Commercial (2024+)
          note: SSAB Zero（废钢 + 可再生路线）已经商业化，而 Electra 目标 2029 才商业化生产。先发买方关系存在流失风险。
        - label: Electra 示范产能 vs. 商业需求
          value: 500 t/yr vs 2M+ t/yr
          note: 示范工厂 500 t/yr，对比典型商业钢厂 2M+ t/yr 铁需求。Electra 若要完整服务单个大客户，规模差距先要缩小 4,000×。
        - label: HYBRIT H2 储存验证
          value: Proven at pilot (Feb 2025)
          note: HYBRIT 的氢储存曾是最常被引用的 H-DRI 技术风险。Feb 2025 试点成功为 HYBRIT 的商业路径移除了这个瓶颈。
        - label: Nucor Econiq 产品作为替代
          value: Commercial (reputationTier high)
          note: Nucor 的 Econiq 净零钢已可供寻求 Scope 3 排放主张的买方采购。若买方接受基于抵消的净零，就未必需要 Electra 的清洁铁属性。
    approximationNotes: >-
      所有对比均基于截至 May 2026 可公开获得的证据。Stegra 总融资数字包括 Stegra 所称的股权、绿色债券和项目融资。 为与仅股权指标可比，Electra 累计融资不含 $50M Catalyst 赠款和 $30M
