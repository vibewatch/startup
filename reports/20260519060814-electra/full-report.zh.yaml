          label: 战略接触
          actor: 潜在买方 / 投资方
          description: EAF 钢厂、分销商和重视可持续性的企业，通过工业脱碳讨论、投资人网络，以及同业清洁铁路线对比接触 Electra。Boston Metal 和 HYBRIT 提供了外部证据：既有企业已经在探索商业化前绿色铁路线。
          channels:
            - 行业会议
            - 投资人转介网络
            - 可持续采购团队
        - id: stage-commitment
          label: 采购协议 / MOU / JDA
          actor: 采购与战略团队
          description: 潜在客户签署采购协议、分销协议、MOU、EAC 协议或 JDA，往往还会同步进行战略投资。2024 年 12 月至 2026 年 4 月，五家具名合作方签署了此类文件。
          channels:
            - 与 Electra 商务团队直接谈判
            - Series B 共同投资流程
            - 环境采购项目
        - id: stage-delivery
          label: 示范设施交付（2026 目标）
          actor: 买方运营团队
          description: Electra 目标在 2026 年中开放 Jefferson County 示范设施；首批铁交付和首批绑定示范项目的 EAC 发行，将验证产品纯度、工艺稳定性和合同转化质量。
