        - 中等：绿色溢价定价承压；重新评估收入模型假设
      - - 创始人离任
        - 宣布 CEO 或 CTO 离任
        - 任一联合创始人离开公司
        - 重大：重新评级为继续研究，等待新领导层评估
      - - 产品认证失败
