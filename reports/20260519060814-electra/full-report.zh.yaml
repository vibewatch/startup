        - 公开报道的契约豁免请求或下调估值股权融资
        - 关键：资本结构承压；评估剩余现金跑道和稀释影响
    notes: 触发阈值由分析师为监测目的设定，并非 Electra 内部风险阈值。投资人应建立自己的监测节奏，锚定示范设施表现数据和商业设施融资时间表。
