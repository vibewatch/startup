    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与商业模式
        blocks:
          - type: paragraph
            body: >-
              Electra 对外把自己定义为一家气候工业公司，目标不是优化既有高炉路线，而是重做炼铁环节。公司公开品牌名为 Electra；Toyota Tsusho 的公告则把法律实体写作 Electra Steel
              Inc.，这是一家科罗拉多公司，2020 年 3 月由 Sandeep Nijhawan 和 Quoc Pham 创立。公开公司页面显示总部位于科罗拉多州 Boulder；招聘材料则指向邻近 Broomfield
              的示范设施和制造活动。

              核心产品主张很直接：Electra 称可用零碳电力驱动的低温电化学-湿法冶金工艺，生产纯度 99% 的铁，产物可用于电弧炉钢厂和铁基电池应用。这个定位重要，因为钢铁是全球最大工业排放源之一，而 Electra
              的商业叙事是去掉高排放炼铁步骤，同时不要求溢价定价。不过截至本报告运行日，Electra
              仍是一家私有、尚未商业化的公司，没有公开披露收入或经审计财务指标。因此，投资人更容易评估其战略逻辑和融资能力，难以评估当前经营表现。
