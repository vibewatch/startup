      - number: '4.3'
        title: 资本充足性与现金跑道
        blocks:
          - type: paragraph
            body: >-
              $186M Series B（2025 年 4 月完成）、$50M Breakthrough Energy Catalyst 补助、$8M 州级税收抵免和 $30M JPMorgan 风险债设施结合起来，给
