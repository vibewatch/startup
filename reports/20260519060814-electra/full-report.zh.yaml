        blocks:
          - type: callout
            title: Stegra 的规模和预售订单是最实质竞争威胁
            body: >-
              Stegra 已向 Porsche、IKEA、Mercedes-Benz、Volvo、Scania 和 Microsoft 预售 1.5 million tonnes，代表 Electra
              到商业化规模时必须从零建立的已承诺买方关系。这些买方有公开脱碳目标，一旦量已被承诺，未必需要从多个来源采购。
