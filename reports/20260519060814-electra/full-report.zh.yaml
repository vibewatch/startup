      - number: '1.4'
        title: 商业进展与规模
        blocks:
          - type: paragraph
            body: >-
              商业牵引已经可见，但仍处早期。公开报道称，Electra 正在科罗拉多州 Jefferson County 建设一座 130,000 平方英尺示范设施，年产能最高 500 tonnes 铁，目标在 2026
              年中开放。该设施具有战略意义，因为它要把实验室和原型可信度转化为客户认证产品、采购订单履约能力，并最终支撑本十年晚些时候一座更大商业化工厂的融资。

              客户和合作伙伴基础强于许多商业化前材料创业公司公开可展示的水平。报道显示，Nucor、Toyota Tsusho 和 Interfer Edelstahl Group 已下达提前采购订单，Meta
              签有环境属性信用（EAC）协议，Interfer 于 2024 年 12 月签署特种钢 MOU，Toyota Tsusho 在 2025 年 4 月投资并绑定汽车级 EAF
              钢分销。招聘活动也显示公司在真实搭建运营，而非只做纸面合作：Electra 员工数从 2022 年约 50 人增至 2025 年 130 多人，2026 年 5 月的职位覆盖 Boulder 和
              Broomfield 的工程、运营、EHS 和商业岗位。剩下的商业问题是，这股势能是否足以跑赢 Bloomberg 在规模化竞赛中指出的技术和成本挑战。
