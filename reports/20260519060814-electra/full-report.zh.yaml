companyProfile:
  summary: >-
    Electra 是一家位于科罗拉多州 Boulder 的工业气候创业公司，成立于 2020 年，目标是推动炼铁脱碳。公司称，其低温电化学-湿法冶金工艺可用可再生电力把多种铁矿石转化为纯度 99%
    的铁，供电弧炉炼钢和电池应用使用，且不需要炼焦煤。公开证据显示，Electra 仍处于商业化前阶段，但已获得采矿、钢铁和工业供应链中的战略投资方和交易对手支持，并在 Jefferson County 建设一座目标于 2026
    年中启动的示范工厂。
