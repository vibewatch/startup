  - id: FR001
    title: Electra 风险热力图：可能性 vs. 剩余严重性
    type: matrix
    layout: standard
    summary: 五乘五风险矩阵，按缓释后的可能性和剩余严重性映射 Electra 的最高风险。
    data:
      columns:
        - 低
        - 中
        - 高
        - 很高
      rows:
        - label: 严重性：关键
          values:
            - null
            - 创始人离职
            - FOAKE 放大失败
            - 锚定客户流失
        - label: 严重性：高
          values:
            - null
            - 知识产权纠纷
            - EHS / OSHA 执法；监管许可延迟
            - 产品资质验证失败
        - label: 严重性：中
          values:
            - RCRA 废弃物执法
            - POSCO JDA 转化失败；EAC 收入坍塌
            - 商业设施融资延迟；IRA 政策需求削弱
            - 示范设施调试期人员缺口
        - label: 严重性：低
          values:
            - 诉讼
            - null
            - 矿石供应中断
            - 伴生矿承购不足
    approximationNotes: 可能性和严重性是分析师基于公开证据作出的定性评估；未审阅内部风险登记表。剩余严重性只反映公开披露的缓释措施。
    claimRefs:
      - CR001
      - CR005
      - CR009
      - CR017
      - CR025
      - CR032
      - CR037
