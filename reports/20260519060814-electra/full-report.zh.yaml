  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图——直接同行、既有玩家、替代品与潜在进入者
        blocks:
          - type: paragraph
            body: >-
              清洁原生铁竞争版图可分为三个同心圆。最内层是直接技术同行，它们开发新型低碳炼铁工艺，直接争夺同一个 EAF 原料位：（1）Boston Metal 的 Molten Oxide
              Electrolysis（MOE）平台，在 1,600°C 电解熔池中把铁从氧化矿中分离出来，不用碳；（2）HYBRIT 合资公司（SSAB、LKAB、Vattenfall），通过氢直接还原生产海绵铁，并以
              SSAB Zero 商业化；（3）Stegra（原 H2 Green Steel），正在瑞典 Boden 建设全球首座全新建设的绿色钢超级工厂，采用 H2-DRI。三者都是 Electra
              在“新型低碳原生铁”类别里的直接可比对象。


              第二层是正在主动推进低碳炼铁转型的一体化钢铁既有玩家，也可能服务同一批买方：ArcelorMittal（XCarb 计划，包括比利时 Ghent 的 Midrex H-DRI 工厂和 Texas 的 DRI
              工厂）、POSCO（HyREX 氢 DRI 计划，2026 年 4 月与 Electra 签署 JDA），以及处于不同创新阶段的 Nippon Steel 和 Tata Steel。它们既可能是潜在买方 /
              合作伙伴，也可能成为内部竞争者：如果 ArcelorMittal 或 POSCO 能用自有工艺创新在商业化规模交付经认证低碳钢，就会成为 Rheinmetall 或 Toyota 等买方的替代供应链，无需
              Electra。


              最外层是没有新型炼铁工艺的替代品：Nucor 的 Econiq 净零钢产品（已商业化，基于既有 EAF + 可再生电力 + 碳抵消，而非清洁原生铁）、SSAB Zero（商业化），以及用 REC 认证 Scope
              1 和 2 排放的废钢供料 EAF 钢厂。这些路径可以让买方在近期满足合规，不必等待 Electra 的清洁铁。尚无法获得 Electra 产品的买方，现状选项是大宗生铁，或来自传统高炉和天然气 DRI 路线的
              DRI；它们没有碳收益，但仍是价格锚。
