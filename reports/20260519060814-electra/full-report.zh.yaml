  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 技术概览与工艺架构
        blocks:
          - type: paragraph
            body: >-
              Electra 的核心产品不是软件平台，也不是成品钢材 SKU，而是一套清洁铁生产工艺。公司把自己的 Oxygen-Decoupled
              Electrolysis（ODE）系统描述为一条已获专利的低温电化学—湿法冶金路线：把铁矿石转化为高纯铁，同时避开高炉炼铁带来的碳排放。公开材料对流程的描述基本一致，分为三个相连环节。第一，铁矿石先溶入酸性溶液。第二，去除共生矿物和杂质，同时调节化学体系并再生酸液。第三，经净化的铁通过电流驱动的电积槽，电沉积到金属板上。

              这条路线的技术要点在于温度：工艺大约在 60°C 运行，而传统高炉炼铁约需
              1,600°C。热需求降下来之后，流程更容易接入可再生电力，也更适合模块化电化学运行。电积本身在铜、锌、镍等金属中已经成熟，但用于铁更难，因为铁离子会在亚铁和铁离子状态之间切换，不会干净沉积。Electra
              将自研化学体系和电流控制视为解决这一问题的关键。支撑专利可追溯到 2021 年优先权申请，并引用了 U.S. National Science Foundation
              资助；这强化了一个判断：该工艺来自严肃科研工作，而不是只有营销定位。
