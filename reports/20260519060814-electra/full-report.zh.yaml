  - id: TM001
    title: 市场定义——Electra 的清洁铁细分市场与替代品
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 意义
    rows:
      - - 面向 EAF 炼钢的清洁铁
        - 由脱碳电化学工艺制成的 99% 纯原生铁，用于 EAF 炉料
        - BF-BOF 生铁、纯废钢 EAF 流程，以及天然含再生料的钢材
        - 一体化 EAF 钢厂；原材料采购负责人
        - 核心直接 TAM——替代 EAF 原料组合中的生铁和 DRI
      - - LFP 电池用电池级铁
        - 用于磷酸铁锂正极制造的超高纯铁金属
        - 传统冶炼产出的标准电池级铁；钴基正极体系
        - 电池电芯制造商；EV OEM
        - 相邻市场；截至 2026 年 Electra 仍在探索，尚未商业化
      - - 共生矿副产品（二氧化硅、氧化铝）
        - 铁矿石溶解时提取二氧化硅和氧化铝，并卖给工业买家
        - 无关采矿流程产出的散装砂和大宗氧化铝
        - 玻璃、陶瓷、化妆品行业的工业矿物买家
        - 收入多元化来源；拉低清洁铁净生产成本
      - - 下游绿色钢（间接需求信号）
        - 使用清洁铁投入制成的 EAF 成品钢，并带有低碳属性证书
        - 废钢占比 >50%、未加入原生清洁铁的钢材
        - 汽车 OEM、超大规模科技公司（数据中心）、建筑、国防
        - 间接市场拉力——OEM 承诺拉动清洁铁供应链投资
      - - 现状 BF-BOF 生铁（待替代品）
        - 煤基高炉在 ~1,600°C 生产的生铁；每吨钢 ~2 t CO2
        - Electra 电化学铁（排除在该市场边界之外）
        - 没有强制脱碳要求的大宗钢材买家
        - 现有替代品；是定价参照和切换成本锚点
      - - 氢基 DRI / 绿色钢（H-DRI 路线）
        - 高品位铁矿石（≥67% Fe）经氢基直接还原制成的钢
        - Electra 电化学铁（技术路径不同，未纳入）
        - 可获得 H2 供应和高品位矿石的高端绿色钢买家
        - 近似替代品；欧洲扩张更快（Stegra、HYBRIT/SSAB），但受矿石品位约束
    notes: 市场边界截至 2026 年 5 月。电池级铁和共生矿收入仍是新兴机会，Electra 尚未商业化放量。BF-BOF 生铁价格是 Electra 必须追平或压低的成本参照，否则绿色溢价会长期存在。
