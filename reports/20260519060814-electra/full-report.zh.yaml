      - number: '4.5'
        title: 财务结论与尽调卡点
        blocks:
          - type: paragraph
            body: >-
              Electra
              的财务画像符合一家商业化前深科技公司：它已获得与战略高度一致投资方提供的异常强早期资本支持，但决定承销判断的关键财务变量仍是私有信息。收入质量无法评估，因为公司没有收入。基于资金流入，资本充足性看起来可支撑到
              2028 年，但 2029
              年商业化放大很可能需要一轮规模相当或更大的股权或项目融资，而公开信息没有显示这类融资已安排。成本结构在理论上可信——工艺声称低温运行并可广泛适配矿石——但没有独立基准。战略投资方基础（Nucor、Toyota
              Tsusho、INTERFER、POSCO、Rio Tinto、BHP、Roy
              Hill）由具备深厚行业经验的参与者构成，提供了一种市场侧尽调，是正面信号；但投资人信心不能替代已实现毛利数据。公开累计融资数字相互冲突（Trellis 为 $214M，新闻稿合计为
              $271M），构成数据质量问题，机构投资前应解决。优先尽调资料包应包括：（1）截至 2026 年 5 月的当前现金余额和月度烧钱速度；（2）Jefferson County 示范设施和 2026
              年后商业化设施的预计资本开支；（3）示范规模每吨铁经济性，包括矿石成本、电力成本、已实现毛利或商业化规模预期毛利；（4）提前采购协议的收入条款（定价、照付不议义务、交付时间表）；（5）首座商业化设施任何项目融资结构的状态；（6）确认累计股权融资数字。
