      - number: '2.4'
        title: 增长驱动、采用约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              主要增长驱动包括：企业净零披露制度扩张（CSRD 下的 Scope 3 强制报告和自愿 SBTI 承诺）、汽车和数据中心行业已有公开文件可证的绿色钢承诺，以及不利于 H-DRI 竞争者的铁矿石供应约束（H-DRI
              要求 ≥67% 铁矿石纯度；商用品位矿石 ≥62% 预计到 2030 年代初将供给趋紧，而 Electra 可使用铁含量低至 35% 的矿石）。科罗拉多首个 $8 million 清洁工业税收抵免和
              Breakthrough Energy 的 $50 million Catalyst 补助，验证了美国州级政策顺风。JP Morgan 的 $30 million
              风险债设施进一步表明，机构金融已经开始承销工业脱碳技术风险。


              主要采用约束包括：（1）规模差距——Electra 处于 500 t/yr 示范阶段，而商业工厂是数百万吨级；（2）绿色溢价不透明——商业化规模下每吨成本未披露，若无强制要求，可能不具竞争力；（3）H-DRI
              先发带来的劣势——Stegra 的 Boden 工厂（总融资 €6.5 billion；已预售 1.5 million tonnes；DRI 塔和电解槽接近 2026 年完工）以及 HYBRIT/SSAB
              的商业化 SSAB Zero 产品在欧洲更快扩张；（4）美国政策反转——Bloomberg 记录，美国 H-DRI 产能建设因 Trump
              时代政策回撤而受挫，该风险也部分适用于任何以美国为中心的清洁铁放大；（5）BF-BOF 既有体系——ArcelorMittal 等大型一体化钢厂正在推进低碳炼铁项目，意味着即使是大型买方也有既有供应商选项。


              估值相关性：市场真实存在，但仍处早期。最站得住脚的估值锚点不是 TAM 倍数，而是已签包销承诺（Nucor 采购订单、Meta EAC 协议、Toyota Tsusho 投资 /
              分销交易），以及以这些承诺为条件的 $50 million Catalyst 补助。若 Electra 能在商业化规模达到与生铁成本持平，且 Scope 3 披露要求在主要钢铁采购行业收紧，市场机会将显著扩大。
