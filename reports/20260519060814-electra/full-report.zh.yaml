      - number: '7.4'
        title: 人才、执行与竞争风险：一边大规模招聘，一边放大技术
        blocks:
          - type: paragraph
            body: >-
              Electra 正在同时调试首座工业设施，并大量招聘工程、运营、EHS 和商业岗位。截至 2026 年 5 月，公司在 Greenhouse 招聘板上有 21 个开放职位，包括 Controls
              Engineers、Senior Process Development Engineer、Senior EHS Manager、Associate Director of Manufacturing，以及
              Director of Co-Mineral Sales、Head of Sales 等商业岗位。开放职位覆盖面说明，示范设施的运营团队尚未完全配齐。两位联合创始人（CEO Sandeep Nijhawan 和
              CTO Quoc Pham）身上的人才集中也是额外风险：技术工艺诀窍掌握在小团队中，任一创始人的继任或离开都会带来实质不确定性。


              竞争风险正在加速。Boston Metal 的 Molten Oxide
              Electrolysis（MOE）平台用不同电化学路线瞄准同一条低碳铁供应链，且处于类似示范阶段。HYBRIT（SSAB/LKAB/Vattenfall）和 Stegra
              在瑞典的氢基直接还原铁工厂已经推进到工业规模，Stegra 目标是在 Boden 设施实现商业化生产。ArcelorMittal 正在投资创新炼铁，并拥有自己的 DRI
              脱碳路线图。如果任一替代方案更快完成商业认证，或交付成本更低，Electra 的市场窗口就会收窄。“无绿色溢价”主张——即 Electra 铁成本将等于或低于传统铁——尚未在商业吞吐或能源价格下得到验证。
