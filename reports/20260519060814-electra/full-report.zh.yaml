      - number: '8.5'
        title: 退出准备度、打穿逻辑触发点与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              Electra 投资人的退出路径取决于示范成功和商业规模证明。近期最可信的退出情景，是由大型钢铁制造商或矿业集团战略收购——POSCO、ArcelorMittal、BHP 或 Nippon
              Steel——买下公司，以拥有电积技术和已经建立的客户关系，而不是与之竞争。这条路径需要示范成功，且至少有一份有约束力的商业采购合同。IPO
              是更长期的选项，基准情景下可能要等首座商业设施达到铭牌产能后（2032+）。鉴于公司的使命驱动型投资者基础（BEV、Temasek、Capricorn），如果战略出售和 IPO
              推迟，结构化老股交易或延续基金也可能出现。


              打穿逻辑触发点（TV005 汇总）包括：（1）到 2026 年底，示范设施铁纯度低于 97% 或吞吐低于 400 吨/年；（2）Nucor 或 Toyota Tsusho 公开撤回采购订单或投资；（3）到
              2027 年底仍未获得商业设施融资；（4）Jefferson County 出现任何 OSHA 处罚、EPA 执法或 CDPHE 许可拒绝；以及（5）公开报道 降估值轮或 JP Morgan
              债务契约加速事件。任何单一打穿逻辑触发点，都足以立即将评级下调为放弃或卖出，具体取决于严重程度。


              最终尽调要求（TV006）代表从继续研究转向买入建议所需的最低信息包。最关键的问题是实时或第三方验证的示范设施性能数据——首批生产批次的铁纯度证书、能耗指标和吞吐数据。没有这些数据，估值区间太宽，无法支撑有信心的判断。次要要求包括
              Series B 优先权结构、Nucor/Toyota Tsusho 预购订单约束性条款、商业设施选址和工程研究，以及 DOE LPO 申请状态。
