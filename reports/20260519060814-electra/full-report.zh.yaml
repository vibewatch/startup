      - number: '7.5'
        title: 财务、政策与终止标准：IRA 回撤和资本强度是打穿逻辑的变量
        blocks:
          - type: paragraph
            body: >-
              Trump 政府对 Biden 时代工业脱碳政策的转向，带来真实的需求侧风险。虽然 Electra 与 Nucor、Toyota Tsusho 和 Interfer
              的预购订单是商业协议，并不依赖政策，但支撑其相对大宗铁获得收入上浮的绿色溢价定价环境，部分依赖由监管和投资者压力驱动的企业可持续承诺。如果碳边境调节机制（EU CBAM 已经生效；美国同类机制仍不确定）停滞，或
              Scope 3 披露要求被削弱，买家为清洁铁支付溢价的意愿会被侵蚀。Bloomberg 和 Canary Media 都指出，美国氢基 DRI 努力在政策转向下已经“受挫”；即便 Electra
              成本结构不同，这些仍是警示性数据点。


              资本强度风险直接绑定商业规模时间线。公司迄今已通过股权和债务融资 $301M（不含 $50M BEC 赠款），但商业铁设施所需项目融资规模将是当前资本规模的数倍。烧钱速度和现金跑道没有披露。JP Morgan
              风险债务增加了债务契约和利息负担。如果商业设施融资耗时长于预期，或条款不利，公司实现 2029 年商业化生产的能力就有风险。示范设施的性能数据（铁纯度、吞吐、能效、酸耗）将是判断项目融资是否可行的首要闸门信号。
