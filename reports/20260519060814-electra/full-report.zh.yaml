      - number: '8.4'
        title: 乐观、基准与悲观情景：结果区间宽，取决于示范表现和资本可得性
        blocks:
          - type: paragraph
            body: >-
              三种情景框定了 Electra 从示范走向商业化生产的轨迹。乐观情景假设示范设施达到或超过规格——到 2026 年 Q3 交付 99%+ 纯铁，产量 ≥500 吨/年——从而使公司能够发布性能数据，把 Nucor
              和 Toyota Tsusho 预购订单锁定为有约束力合同，并以符合绿色基础设施的资本成本吸引商业设施项目融资。乐观情景下，商业化生产按目标在 2029 年开始，到 2032 年放大至
              50,000–100,000 吨/年。低碳铁相对大宗商品的绿色溢价维持在 $50–100/t，受到 EU CBAM 执行和大型买家企业 Scope 3 承诺支撑。到 2032 年商业规模时，Electra
              将代表可服务市场中有意义的一部分，并可按与特种材料公司一致的收入倍数估值至 $3–8 billion。


              基准情景假设示范部分成功——铁纯度达标，但吞吐爬坡缓慢，商业化生产推迟至 2031–2032 年。项目融资在 2029 年前拿到，但成本更高，稀释股权回报。政策逆风下绿色溢价部分侵蚀，落在 $20–50/t。到
              2034 年，公司在商业设施达到 30,000–50,000 吨/年。基准情景下，首次商业化生产时估值为 $1–2.5 billion。


              悲观情景会打穿投资逻辑：示范铁质量低于规格，或吞吐目标未达成；Nucor 或 Toyota Tsusho
              推迟或撤回采购订单，等待进一步认证；商业设施融资无法以可接受条款获得；以及/或者政策驱动的绿色溢价市场崩塌，消除经济性。在这一情景下，Electra 面临降估值轮再融资、折价战略出售或清盘。Stegra
              是相关警示案例：这家资本化 $6.5B 的绿色铁创业公司在领投方重组后遭遇生存级融资困难。


              可比公司组（TV004）提供了参照点：SSAB 作为拥有无化石钢项目的上市钢铁公司，交易约为 0.4–0.6x 收入；Nucor 约为 0.6–0.8x 收入；ArcelorMittal 为
              0.2–0.4x。Boston Metal 是可比的私营阶段清洁铁创业公司，累计融资约 ~$120M，仍处于示范阶段。这些可比项说明，Electra 可能 Series B
              估值隐含的早期溢价很大；只有商业规模得到可信证明时，这一溢价才站得住。
