  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与钢铁价值链语境
        blocks:
          - type: paragraph
            body: >-
              Electra 的核心市场是供 EAF 炼钢使用的清洁铁原料。钢铁是基础工业材料，全球年产量约 1.9 billion tonnes，其中约 69% 通过高炉-转炉路线生产。这一路线在 1,600 degrees
              Celsius 下燃烧冶金煤，每生产一吨钢约排放两吨 CO2。把铁矿石转化为生铁的环节，约占理论上可消除炼钢排放的 90%。Electra 的电化学-湿法冶金工艺用另一种方式替代该步骤：在 60 degrees
              Celsius 的酸性水溶液中溶解铁矿石，再借助电积沉积纯度 99% 的铁，并使用间歇性可再生电力。产物是清洁铁，EAF 钢厂可将其与废钢一起入炉，作为生铁或直接还原铁（DRI）的替代品。


              市场边界包括：（1）面向 EAF 钢厂的高纯原生铁，也就是核心可寻址市场；（2）用于磷酸铁锂（LFP）电池的超纯电池级铁，属于相邻且早期的机会；（3）矿石溶解过程中提取的共生矿物副产品（硅石、氧化铝），可丰富
              Electra 的收入池。边界之外包括高炉钢生产（既有路线）、不使用原生铁的纯废钢回收 EAF 回路，以及氢 DRI / 熔融氧化物电解（相近替代路线，但技术路径不同）。与估值最相关的边界差异在于，Electra
              销售的是 EAF 炼钢中的原生铁原料位，而不是下游钢铁产品市场。因此，Electra 的客户仍是钢厂和分销商，而非终端产品买家；不过汽车
              OEM、超大规模数据中心运营商和国防制造商发出的企业净零需求信号，已经能在买方联盟中看到。
