            title: 商业规模化学加工的监管堆栈重要且被低估
            body: >-
              在商业规模下，Electra 很可能因酸处理触发 OSHA PSM（29 CFR 1910.119）、Clean Air Act 下 EPA 主要排放源许可，以及 RCRA 危险废物管理。EHS
              职能仍在搭建（Senior EHS Manager 岗位开放）。投资者应在公司动工建设商业产能前，确认 PSM 适用性和许可时间表。
