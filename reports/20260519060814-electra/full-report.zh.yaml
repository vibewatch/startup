  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现架构
        blocks:
          - type: paragraph
            body: >-
              Electra
              尚未商业化，但收入模式已经清楚：公司通过低温电化学-湿法冶金工艺生产高纯度（99%）铁，并计划把该铁产品销售给钢厂和工业买方。主要收入流将来自铁产品销售——这些铁可投放到电弧炉（EAF）生产绿色钢，也可用于电池级应用，或交付给特种钢分销商。第二条收入流是环境属性信用（EAC）：Meta
              已同意购买 Electra 示范设施产出带来的减排所对应的 EAC，为重视脱碳的大型买方建立了先例。第三条新兴收入流是共生矿物销售——Electra
              工艺在精炼过程中提取硅石和氧化铝，可在相邻工业市场变现；Greenhouse
              招聘网站上最近出现的商业岗位（共生矿物销售总监）显示，这已开始越过概念阶段。公司作为私有且商业化前企业，没有公开披露标价、实际收入或已确认收入。公司官网称其产品“没有绿色溢价”，即定价据称可与煤基高炉传统铁竞争，但商业化规模下这一成本主张没有独立验证。与
              Nucor、Toyota Tsusho、INTERFER 和 POSCO 签署的提前采购协议，只有在实际交付铁产品后才会确认收入；公开来源没有显示这些协议包含任何前期现金付款。
