      - number: '7.3'
        title: 合作伙伴、客户与资本集中：管线偏薄，单一名称敞口高
        blocks:
          - type: paragraph
            body: >-
              Electra 的商业模型建立在少数具名交易对手之上，这些交易对手同时扮演投资者、客户和战略验证者。Nucor 是美国最大钢铁制造商，至少自 2022 年起就是长期投资者，也是 Series B
              共同投资者，并且是示范铁的主要具名采购方。如果 Nucor 自身资本配置、技术策略或 EAF 铁需求发生变化，Electra 会同时失去锚定买家和重要信誉信号。Toyota Tsusho
              提供了一条通向汽车供应链的平行渠道——这是一个认证周期慢的市场——但它只是一个实体，代表一个买家集群。Interfer 覆盖欧洲特种钢，但把采购条件设为监管认证，因此尚无确定收入承诺。


              POSCO 联合开发协议（2026 年 4 月）增加了第五个主要交易对手——韩国最大钢铁制造商——但 JDA 条款和财务承诺没有公开披露。Meta 的 EAC 协议是气候属性销售，不是产品采购；EAC
              价格波动大，且对政策敏感。JP Morgan 的 $30 million 风险债务安排（2026 年 3 月）显示公司可获得机构债务，但也增加了一层债务契约约束；如果错过业绩里程碑，运营可能受限。


              资本集中风险很高：$186M Series B（2025 年 4 月）和 $30M JPM 债务（2026 年 3 月）是公司接近商业设施融资时的主要资本来源。一座 50,000–500,000
              吨/年电积产能的商业设施，项目融资成本很可能达到数亿美元到数十亿美元。尚未宣布任何商业设施融资。Breakthrough Energy Catalyst $50M 赠款专门资助示范设施，未必适用于商业规模项目。
