      - number: '8.3'
        title: 融资背景、进入纪律与稀释 / 优先权结构
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 5 月，Electra 已通过股权、赠款和债务累计融资约 $359 million：$85 million Series A（2022 年 10 月，由 Breakthrough Energy
              Ventures 领投）、$186 million Series B（2025 年 4 月，由 Capricorn Investment Group 和 Temasek Holdings 领投）、$50
              million Breakthrough Energy Catalyst 赠款（示范设施资金）、Colorado Office of Just Transition 的 CITCO 项目 $8
              million，以及 JP Morgan $30 million 风险债务（2026 年 3 月）。这套资本基础隐含的烧钱速度和现金跑道没有公开披露。按商业化前清洁科技公司常见的每年 $20–50M
              烧钱速度，$271M 股权融资款（扣除赠款）大约可提供五到十三年现金跑道，但示范设施资本开支 和运营成本很可能吸收其中相当部分资金，压缩跑道。


              没有披露估值，进入纪律很难执行。此阶段新投资者面临几类稀释风险：（a）商业设施项目融资很可能需要以项目股权、绿色债券和 DOE 贷款担保的组合筹集 $1–5
              billion，可能大幅稀释当前股权持有人；（b）Series B 优先权结构尚未披露——如果包含清算优先权或反稀释棘轮，后期进入者的下行保护有限；（c）JP Morgan
              风险债务安排（$30M，条款未披露）增加了一层债务契约约束，如果错过里程碑，可能限制股权融资或产生加速到期风险。


              建设性一面是，BEC 赠款（$50M）和 CITCO 赠款（$8M）提供了非稀释资本，在不增加股权压力的情况下改善现金跑道。2026 年 4 月签署的 POSCO JDA
              可能预示未来来自全球最大钢铁制造商之一的战略资本，尽管 JDA 下的财务承诺没有披露。截至运行日期，尚未宣布面向商业设施的 DOE Loan Programs Office 申请；若有，这将代表最大潜在资本承诺。
