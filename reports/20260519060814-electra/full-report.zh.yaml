  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层级 / 工艺
      - 作用
      - 依赖
      - 风险
    rows:
      - - 原料准备（矿石研磨）
        - 将矿石磨成细赭砂，以便酸溶
        - 低品位铁矿供应；制浆用水
        - 矿石来源波动可能影响溶解速率和纯度
      - - 酸溶（湿法冶金）
        - 将矿石中的铁溶入酸性水溶液
        - 硫酸或类似酸供应；酸再生循环
        - 酸成本、处理、再生效率，以及泄漏 / 安全监管风险
      - - 净化 / 伴生矿去除
        - 电沉积前去除硅石、氧化铝、磷
        - 工艺化学；净化单元操作
        - 净化不足可能污染铁产出，使纯度降至 99% 以下
      - - 电积槽（电化学）
        - 通过电流将溶液中的纯铁沉积到钢阴极板
        - 可再生电力或电网电力；阴极板供应；阳极材料
        - 铁离子价态（亚铁 / 铁）管理是关键 IP；任何偏离都会拉低收率
      - - 电力与控制系统
        - 调节槽电压、电流、溶液化学和工艺参数
        - 可靠电力供应；传感器和自动化
        - 精确控制失效会带来铁价态管理失误；控制可靠性是关键
      - - 产品回收与包装
        - 从阴极移除铁沉积物，并按客户规格定型
        - 手动或自动刮取设备；质量测试
        - 吞吐量瓶颈；面向 EAF 的产品一致性标准未充分披露
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE007
      - CE013
      - CE025
      - CE027
    notes: 工艺架构根据公开专利、媒体和公司来源重建；确切工程参数（酸浓度、槽电压、电流密度、循环时间）属于专有信息。
