      - number: '8.6'
        title: 图表与证据
        blocks:
          - type: callout
            title: 关键尽调闸门：示范铁纯度数据决定投资逻辑
            body: >-
              最重要的缺失信息，是 Jefferson County 示范设施的实时性能数据。只要工业规模下铁纯度 ≥99%、吞吐 ≥500 吨/年尚未确认，整个估值区间——从悲观 $200M 到乐观
              $8B——都仍然打开。公司的战略投资者财团已经验证了逻辑，但任何机构投资者都不应在看到经认证的示范性能数据前作出确定承诺。示范数据预计最晚在 2027 年 Q1–Q2 可获得。
            calloutType: insight
            claimRefs:
              - CV009
              - CV010
              - CV003
          - type: callout
            title: 反向信号：Stegra/H2 Green Steel 是警示性可比对象
            body: >-
              Stegra（前 H2 Green Steel）是全球资本化程度最高的绿色铁创业公司，已承诺项目融资超过 €6.5 billion；其领投方重组后，公司在 2025–2026 年遭遇严重融资困难。Green
              Steel World 和 Bloomberg 都报道过，当资本市场转向避险时，首创型绿色铁项目有多脆弱。虽然 Electra 的技术路线不同（电积 vs. H2 DRI），且其成本结构被设计为避开拖累
              Stegra 的绿色溢价依赖，但任何商业化前绿色铁公司的资本市场风险都很实质，不应被忽视。
            calloutType: insight
            claimRefs:
              - CV030
              - CV033
              - CV034
          - type: callout
            title: 缺少估值锚点：进入纪律必须依赖情景纪律
            body: >-
              Electra 未披露 Series B 投后估值。Bloomberg 2024 年专题报道引用了大约 $1 billion
              区间的数字，但尚未确认。缺少已披露估值时，任何投资者都必须用情景分析、可比基准，以及为战略合作网络内嵌可选性付费的意愿，构建自己的进入纪律。乐观/悲观估值区间很宽（$200M 到
              $8B+），意味着进入价格敏感性极高——示范表现假设或绿色溢价耐久性的小幅变化，都会对 IRR 产生大影响。
            calloutType: insight
            claimRefs:
              - CV013
              - CV014
              - CV031
