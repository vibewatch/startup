      - number: '5.3'
        title: 设施路线图与技术成熟度
        blocks:
          - type: paragraph
            body: >-
              Electra 公开可见的技术成熟度已经越过实验室概念阶段，但仍未进入商业化生产。报道描述了其位于美国科罗拉多州 Boulder 的 R&D
              和试点基地，配有罐体、酸浴、电积槽和计算机调节管线，足以支撑迭代式工艺开发和原型工作。Bloomberg 2024 年 3 月的报道很重要，因为它把 Electra
              商业尺寸铁原型这一里程碑，定义为一家技术只有几年历史的公司必须拿出的关键证明。该里程碑说明工艺不只停留在台架规模，即便连续吞吐经济性仍未披露。

              下一步是 Jefferson County 示范设施。多家公开来源称，这是一座 130,000 平方英尺工厂，目标是年产最高 500 吨高纯铁，并计划于 2026
              年中启动。其目的不只是产量，而是在与客户认证和项目融资相关的规模上完成校准、工艺学习和产品纯度测试。公开指引随后指向一座目标 2029 年投产的更大商业工厂。合起来看，证据支持其技术就绪度大致处在 6–7
              级：已经越过原型，接近示范，但仍暴露在放大风险之下。Bloomberg 报道的矿石溶解速率和铁离子纯度挑战仍是核心观察点，因为它们直接对应良率、吞吐和成本。
