      - number: '2.2'
        title: 市场规模测算——TAM、SAM、SOM 与证据约束下的估算
        blocks:
          - type: paragraph
            body: >-
              本章审阅的公开来源中，没有可访问的独立分析师报告对清洁铁细分市场做规模测算。公司在 Series A 材料中称该市场是“万亿美元级机会”，但该说法没有方法论，也无法用公开证据核验。因此，本章只能基于
              worldsteel 产量数据做自下而上的估算。


              TAM：2023 年全球粗钢产量约为 1.9 billion metric tonnes（worldsteel；bloomberg）。其中约 69%（约 1.31 billion
              tonnes）通过高炉路线生产，主要铁源是原生生铁。若所有 BF 钢都转向由清洁铁供料的 EAF，这一体量就是原生铁替代的上限；但这个情景会跨越数十年才可能发生。


              SAM：EAF 钢约占全球钢产量的 31%（约 590 million tonnes）。EAF 钢厂通常需要每吨钢补充约 0.30–0.60 tonnes 原生铁，具体取决于产品等级。这意味着 EAF
              用原生铁的理论 SAM 为每年 165–354 million tonnes；但只有以可核验低碳方法生产、且面向有脱碳要求买方的那一部分，才是立即可触达市场。近期实际可商业进入的市场要小得多，因为多数 EAF
              钢厂今天仍接受大宗生铁。


              SOM：Electra 示范工厂每年生产 500 tonnes；商业化规模目标为 2029 年，但产能未披露。作为参照，单座美国钢厂年产钢约 2 million
              tonnes，这意味着首座商业化设施若要满负荷服务一个大型客户，每年需要供应约 600,000–1,200,000 tonnes 铁——远超 2029 年路线图当前能见度。


              最站得住脚的近期市场，是企业净零买方联盟：这些采购方可以为环境属性信用（Meta）付费，或把清洁铁纳入自身供应链，以记录 Scope 3 减排（Nucor、汽车
              OEM）。该细分市场有证据支撑，但销量和定价均未公开披露。
