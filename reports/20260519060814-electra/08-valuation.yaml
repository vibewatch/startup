callouts:
  - title: "Critical diligence gate: demo iron purity data is the thesis pivot"
    body: >-
      The single most important piece of missing information is real-time performance data from the
      Jefferson County demonstration facility. Until iron purity ≥99% and throughput ≥500 t/yr are
      confirmed at industrial scale, the entire valuation range — from $200M bear to $8B bull — remains
      open. The company's strategic investor syndicate has validated the thesis, but no institutional
      investor should make a firm commitment before seeing certified demo performance data. Demo data
      is expected to be available by Q1–Q2 2027 at the latest.
    claimRefs:
      - CV009
      - CV010
      - CV003

  - title: "Adverse signal: Stegra/H2 Green Steel is the cautionary comparable"
    body: >-
      Stegra (formerly H2 Green Steel), the most capitalised green iron startup globally with over
      €6.5 billion in committed project finance, encountered severe financing difficulties in 2025–2026
      after its lead investor restructured. Green Steel World and Bloomberg have both reported on the
      fragility of first-of-a-kind green iron projects when capital markets turn risk-off. While
      Electra's technology approach is different (electrowinning vs. H2 DRI) and its cost structure
      is designed to avoid the green premium dependency that hurt Stegra, the capital market risk for
      any pre-commercial green iron company is material and should not be dismissed.
    claimRefs:
      - CV030
      - CV033
      - CV034

  - title: "No valuation anchor: entry discipline requires scenario discipline"
    body: >-
      Electra has not disclosed its Series B post-money valuation. Bloomberg's 2024 feature cited a
      figure approximately in the $1 billion range, but this has not been confirmed. In the absence of
      a disclosed valuation, any investor must construct their own entry discipline using scenario
      analysis, comparable benchmarks, and willingness to pay for the optionality embedded in the
      strategic partnership network. The wide bull/bear valuation range ($200M to $8B+) means that
      entry price sensitivity is extremely high — small changes in demo performance assumptions or
      green premium durability have large impacts on IRR.
    claimRefs:
      - CV013
      - CV014
      - CV031

