  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: series-b-valuation
      missingEvidence: "Post-money valuation and preference structure for Electra's Series B round"
      whyItMatters: "Without a confirmed post-money valuation, any investment price discipline or IRR scenario requires an implied valuation constructed from comparables — a significant source of uncertainty. The preference structure determines downside protection for new investors."
      diligencePath: "Request Series B term sheet and cap table summary from company under NDA; engage secondary market advisors to assess Electra's implied valuation from any secondary trades"
      relatedQuestionRefs:
        - QV030
        - QV001

    - type: private-evidence-only
      severity: blocking
      topic: offtake-contract-terms
      missingEvidence: "Binding terms (volumes, pricing, duration) of Nucor and Toyota Tsusho advance purchase orders"
      whyItMatters: "Without binding terms, advance purchase orders are non-binding signals that could be withdrawn; commercial facility project finance requires firm offtake commitments with defined minimum volumes"
      diligencePath: "Request offtake term sheets from company under NDA; verify minimum volumes and qualification milestone thresholds with Nucor or Toyota Tsusho investor relations"
      relatedQuestionRefs:
