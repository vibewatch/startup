chapter:
  number: 8
  title: Valuation
  summary: >-
    Electra's valuation is undisclosed; no post-money Series B figure has been independently confirmed.
    Scenario-based analysis implies a wide range: bear case $100–400M (demo failure), base case $1–2.5B
    (commercial scale 2032–2034), bull case $3–8B (on-time commercial production 2029). Recommendation is
    research-more with high risk rating, pending demonstration facility performance data. The comparable set
    covers SSAB, ArcelorMittal, Nucor (filing sources), Boston Metal, and Stegra. Six thesis-break triggers
    and eight critical diligence asks are enumerated.

sections:
  - id: investment-thesis-and-antithesis
    title: "Investment thesis and anti-thesis: clean iron at the inflection point"
    body: >-
      Electra's investment thesis rests on three durable pillars. First, the global steel market is
      enormous — approximately 1.9 billion tonnes of steel produced annually, generating roughly
      $500–600 billion in revenue — and it is responsible for 7–9% of global greenhouse gas emissions,
      making decarbonization both an economic and regulatory inevitability. Second, Electra has developed
      a proprietary low-temperature acid electrowinning process that produces 99%+ pure iron without
      coking coal, operates below 60°C, and is designed to run on intermittent renewable electricity at
      a cost the company claims is competitive with blast-furnace iron. Third, the company has assembled
      a strategic investor syndicate of exceptional quality — including Capricorn Investment Group,
      Temasek Holdings, BHP Ventures, Rio Tinto, Roy Hill, Nucor Corporation, Yamato Kogyo, Toyota
      Tsusho, and Interfer Edelstahl — that simultaneously validates the technology, anchors demand, and
      secures ore supply. The patent (AU2022241786A1), granted in Australia with PCT coverage, protects
      the core process. The POSCO JDA (April 2026) adds the world's second-largest steelmaker as a
      strategic partner. IEA's Iron and Steel Technology Roadmap identifies novel low-temperature
      ironmaking as a priority decarbonization pathway requiring project-level support.


      The anti-thesis is equally serious. No valuation has been disclosed. The demonstration facility
      (130,000 sq ft, Jefferson County, Colorado) is the company's first industrial-scale test, targeting
      approximately 500 tonnes per year when it opens mid-2026 — roughly 1/4,000 of a typical commercial
      facility. Scale-up from 500 t/yr to 500,000+ t/yr across six or more orders of magnitude is a
      first-of-a-kind engineering challenge for which no public performance data yet exists. Canary Media
      noted that producing iron plates in pilot tests is "just the first of many steps in proving it can
      cost-effectively scale up." Bloomberg and Anthropocene have both observed that the ferrous/ferric
      ion balance management is Electra's core undisclosed "special sauce." The U.S. policy environment
      has deteriorated for green industrial projects under the current administration's rollback of IRA
      incentives. Stegra (formerly H2 Green Steel) — the most capitalized green iron startup globally —
      has encountered severe financing difficulties after raising billions of euros, offering a cautionary
      parallel. Capital intensity for commercial scale could require $1–5 billion in project finance, and
      no such facility has been announced or financed. Burn rate, runway, and JPM covenant terms are
      undisclosed. At an expected Series B-era valuation of $500M–$2B, investors are pricing near-faultless
      execution through a decade of unprecedented scale-up.
