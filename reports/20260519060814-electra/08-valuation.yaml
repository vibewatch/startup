  - id: bull-base-bear-scenarios
    title: "Bull, base, and bear scenarios: wide outcome range driven by demo performance and capital access"
    body: >-
      Three scenarios bracket Electra's trajectory from demonstration to commercial production.
      The bull case assumes the demonstration facility performs at or above spec — delivering
      99%+ pure iron at ≥500 tonnes/yr by Q3 2026 — enabling the company to publish
      performance data, lock in the Nucor and Toyota Tsusho advance purchase orders as binding
      contracts, and attract commercial facility project finance at a cost of capital consistent
      with green infrastructure. In the bull case, commercial production begins in 2029 as
      targeted, scaling to 50,000–100,000 t/yr by 2032. The green premium for low-carbon iron
      holds at $50–100/t over commodity, supported by EU CBAM enforcement and corporate Scope 3
      commitments by large buyers. At 2032 commercial scale, Electra would represent a meaningful
      fraction of the addressable market and could be valued at $3–8 billion based on a revenue
      multiple consistent with specialty materials companies.


      The base case assumes partial demo success — iron purity meets spec but throughput ramps
      slowly, with commercial production delayed to 2031–2032. Project finance is secured by 2029
      but at higher cost, diluting equity returns. Green premium partially erodes under policy
      headwinds, settling at $20–50/t. By 2034, the company reaches 30,000–50,000 t/yr at the
      commercial facility. Valuation in the base case is $1–2.5 billion by the time of first
      commercial production.


      The bear case is thesis-break: demo iron quality is below spec or throughput targets are
      not met; Nucor or Toyota Tsusho defers or walks back its purchase order pending further
      qualification; commercial facility financing cannot be secured at acceptable terms; and/or
      a policy-driven collapse of the green premium market eliminates the economic case. In this
      scenario, Electra faces a down-round refinancing, strategic sale at discounted valuation,
      or wind-down. The Stegra parallel — where a $6.5B capitalized green iron startup encountered
      existential financing difficulties after its lead investor restructured — is the relevant
      cautionary case.


      The comparable set (TV004) provides reference points: SSAB trades at approximately 0.4–0.6x
      revenue as a public steelmaker with a fossil-free steel program; Nucor at approximately 0.6–0.8x
      revenue; ArcelorMittal at 0.2–0.4x. Boston Metal as a comparable private-stage clean iron startup
      has raised ~$120M total and remains in demonstration phase. These comparables suggest that the
      early-stage premium implied by Electra's likely Series B valuation is large but defensible only
      if commercial scale is credibly demonstrated.
