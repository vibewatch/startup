evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: >-
      An authoritative post-money valuation for the Series A (term sheet, cap-table data, or a credible reporting
      source).
    whyItMatters: >-
      Valuation anchors the investment thesis; the circulated $2.25B figure is unverified and Stipple is absent from the
      TechCrunch unicorn list.
    diligencePath: >-
      Request the Series A term sheet or priced-round cap table; cross-check PitchBook/Crunchbase and any 409A
      valuation.
    relatedQuestionRefs:
      - QO009
      - QO027
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: Reconciliation between the announced $100M close and the $65.13M sold reported on the Series A Form D.
    whyItMatters: The gap affects how much capital is actually available and the accuracy of the 'into 2029' runway claim.
    diligencePath: Confirm staged-closing schedule and amended Form D filings; request audited cash position.
    relatedQuestionRefs:
      - QO008
      - QO021
  - type: private-evidence-only
    severity: minor
    topic: cover-metrics
    missingEvidence: Headcount, org structure, and any revenue or non-dilutive funding.
    whyItMatters: Scale and burn cannot be assessed without headcount and cash-runway detail.
    diligencePath: Request an org chart, headcount figure, and monthly burn from management.
    relatedQuestionRefs:
      - QO010
      - QO026
  - type: enumeration-incomplete
    severity: material
    topic: sizing-gap
    missingEvidence: A serviceable/obtainable market estimate tied to STP-100's specific target and indication.
    whyItMatters: Without the target, SOM and peak-sales potential cannot be sized, leaving valuation and market thesis unanchored.
    diligencePath: Obtain the STP-100 target/indication under NDA and map it to indication-level epidemiology and pricing.
    relatedQuestionRefs:
      - QM018
      - QM024
  - type: conflicting-data
    severity: minor
    topic: sizing
    missingEvidence: A reconciled ADC market-size figure across market-research vendors.
    whyItMatters: 2026 ADC estimates span $16.5B-$22.6B with CAGRs from 11.5% to 22.7%, materially changing growth assumptions.
    diligencePath: Normalize vendor methodologies (definition, geography, base year) or commission a bespoke sizing.
    relatedQuestionRefs:
      - QM017
      - QM025
  - type: missing-source
    severity: minor
    topic: payers
    missingEvidence: Payer coverage and pricing benchmarks specific to next-generation ADCs.
    whyItMatters: Reimbursement terms determine whether a differentiated ADC captures premium pricing.
    diligencePath: Review payer policies and net-price analytics for approved ADCs as a proxy.
    relatedQuestionRefs:
      - QM026
  - type: private-evidence-only
    severity: material
    topic: comparison-gap
    missingEvidence: STP-100's target/indication, needed to map Stipple against specific competing programs.
    whyItMatters: Without the target, competitive overlap, differentiation, and displacement risk cannot be assessed head-to-head.
    diligencePath: Obtain the target under NDA and compare against approved and pipeline ADCs on that target.
    relatedQuestionRefs:
      - QP024
      - QP026
  - type: missing-source
    severity: minor
    topic: direct-peers
    missingEvidence: Funding and pipeline detail for emerging platform peers (Tubulis, Adcendo).
    whyItMatters: Peer scale determines how contested Stipple's niche is.
    diligencePath: Pull private-company databases (PitchBook/Crunchbase) for peer financings.
    relatedQuestionRefs:
      - QP025
  - type: conflicting-data
    severity: minor
    topic: incumbents
    missingEvidence: Cross-trial Trodelvy vs Datroway efficacy is confounded by crossover and differing protocols.
    whyItMatters: It affects which TROP2 ADC ultimately leads and the competitive ceiling for new entrants.
    diligencePath: Await head-to-head or matched-adjusted indirect comparisons.
    relatedQuestionRefs:
      - QP006
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Audited cash on hand, monthly burn rate, and a line-item use of Series A funds.
    whyItMatters: >-
