  topStrengths:
    - Ring、Manglik 等科学创始人有重复创业和强学术履历，RA Capital、a16z Bio+Health、Nextech 等一线机构也已进场。
    - 表位选择性逻辑瞄准已验证但毒性高的 ADC 靶点，所在市场规模大、整合也很活跃。
    - 与 Lonza 的偶联 / 生产合作，降低了多数 ADC 项目容易卡住的化学工艺风险；公司指引资金可支撑到 2029 年。
  topRisks:
    - 这是单资产、二元结果的临床前押注，肿瘤适应症获批概率约 5-7%，且尚无人体验证数据。
    - STP-100 靶点未披露也未验证，还叠加 ADC 类别安全风险（ILD/肺炎、FDA 临床搁置）和存在争议的 ADC IP。
    - 财务透明度低：估值、现金和烧钱速度未披露；Form D 显示已售 $65.1M，也需要与公司宣布的 $100M Series A 对齐。
  unresolvedGaps:
    - STP-100 的靶点身份，以及临床前肿瘤相对正常组织的选择性 / 毒性数据。
    - 投后估值、股权结构表、优先股堆叠、经审计现金和月度烧钱速度。
    - Lonza 授权的经济条款 / 独占性，以及自由实施 / 专利意见。
    - 公司宣布完成 $100M 与 Series A Form D 显示已售 $65.1M 之间的差额解释。
