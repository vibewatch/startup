company:
  name: Stipple Bio, Inc.
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Stipple's product is a discovery platform, not yet a drug. The Pointillist Platform maps
    tumor-specific cell-surface epitopes to design binders that hit cancer cells while sparing healthy
    tissue, and its lead output STP-100 is an antibody-drug conjugate built with Lonza's GlycoConnect,
    HydraSpace, and toxSYN conjugation toolkit against an undisclosed, toxicity-limited target. The
    science rests on the founders' credentialed protein-engineering and structural-biology work, but
    the platform has no peer-reviewed validation data, no clinical evidence, and a disclosed dependency
    on Lonza for conjugation and manufacturing, so technical differentiation is promising yet unproven.
sections:
  - id: product-definition
    title: What Stipple Delivers
    body: >-
      In customer-workflow terms, Stipple delivers two connected things: a discovery capability and the
      drug candidates that come out of it. The discovery capability is the Pointillist Platform, a
      modality-agnostic system that identifies tumor-specific cell-surface epitopes — the precise
      sub-regions of an antigen that an antibody's paratope or a T-cell receptor binds. The insight is
      that a target can be expressed on both tumor and healthy tissue, but the epitope landscape differs;
      by finding epitopes that are accessible on cancer cells yet hidden or absent on normal cells,
      Stipple aims to hit validated-but-toxic targets without the on-target/off-tumor toxicity that has
      limited prior drugs. The output for a drug developer (whether Stipple itself or a future partner)
      is a differentiated binder plus a target hypothesis that widens the therapeutic index. The lead
      product of that engine is STP-100, an antibody-drug conjugate whose binder is designed to
      discriminate tumor epitopes and whose payload is delivered via Lonza's conjugation chemistry. As
      of the run date, STP-100 is pre-clinical, with clinical entry guided for early 2027, so the
      "product" is best understood as a platform plus one lead asset rather than a marketed therapy.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE030]
    tableRefs: [TE001, TE002]
    figureRefs: [FE002]
  - id: architecture
    title: Technology and Operating Architecture
    body: >-
      Stipple's operating model is a pre-clinical ADC value chain layered on top of a proprietary
      discovery front-end. The stack begins with epitope discovery (the Pointillist Platform), rooted in
      the founders' academic methods: Aaron Ring's protein-engineering and systems-immunology work
      (including the REAP antigen-discovery platform) and Aashish Manglik's structural biology of
      membrane proteins and receptors. The next layer is binder generation — antibodies engineered to
      recognize the selected tumor epitope. The third layer is conjugation, where Stipple licenses
      Lonza's site-specific GlycoConnect technology (which uses antibody glycans to attach payloads for a
      homogeneous drug-to-antibody ratio), the HydraSpace polar spacer (for stability and solubility),
      and the toxSYN linker-payload. The fourth and fifth layers are pre-clinical validation
      (internalization, normal-tissue cross-reactivity, PK, tolerability) and CMC/manufacturing, both of
      which lean heavily on Lonza. The final layer is clinical execution, not yet begun. This
      architecture concentrates Stipple's proprietary value in the discovery and binder-selection layers
      while outsourcing the chemistry and manufacturing that ADC programs most often stumble on.
    claimRefs: [CE007, CE008, CE009, CE010, CE011, CE012, CE013, CE031]
    tableRefs: [TE003]
    figureRefs: [FE001, FE003]
  - id: maturity-and-differentiation
    title: Maturity, Differentiation, and IP
    body: >-
      Technically, Stipple is early. The Pointillist Platform and STP-100 were disclosed only in April
      2026, there is no peer-reviewed publication describing Pointillist itself, no human data exist, and
      no ClinicalTrials.gov study is registered. Maturity therefore rests on inference from the founders'
      published science rather than on platform-specific validation. Differentiation is real but narrow:
      the claimed edge is epitope-level selectivity at the discovery front-end, which — if it holds up —
      lets Stipple pursue targets that incumbents cannot exploit safely. That is a data/know-how moat
      more than a chemistry moat, since the conjugation chemistry is licensed from Lonza and therefore in
      principle available to others. Intellectual property around the platform and specific epitopes is
      presumably the core defensible asset, but no patents are publicly detailed, and the broader ADC IP
      environment is contested (a 2025 Federal Circuit ruling invalidated a foundational linker patent).
      The most credible near-term technical proof points would be a peer-reviewed Pointillist dataset,
      pre-clinical tumor-versus-normal selectivity data for STP-100, and a disclosed, defensible target —
      none of which is yet public.
    claimRefs: [CE014, CE015, CE016, CE017, CE018, CE019, CE020, CE032]
    tableRefs: [TE005]
    figureRefs: [FE004]
  - id: trust-safety-quality
    title: Trust, Safety, Quality, and Compliance
    body: >-
      For an ADC, trust and quality are dominated by safety and manufacturing control. The entire
      Stipple thesis is a safety argument: epitope selectivity is meant to reduce on-target/off-tumor
      toxicity, the class liability that produces dose-limiting effects and, for several marketed ADCs,
      black-box warnings for interstitial lung disease and pneumonitis. Quality on the chemistry side
      depends on Lonza's platforms: GlycoConnect's site-specific conjugation is designed to yield a
      homogeneous, well-characterized drug-to-antibody ratio, which matters for reproducibility, safety,
      and regulatory review. On the regulatory-quality front, any STP-100 program must satisfy modern FDA
      expectations, including the 2024 clinical-pharmacology guidance for ADCs and the Project Optimus
      dose-optimization initiative, which pushes sponsors toward randomized dose-finding rather than
      maximum-tolerated-dose designs. Stipple has no GMP or clinical-quality track record of its own and
      relies on Lonza for manufacturing controls, so quality assurance is partly a partner-diligence
      question. The central unresolved safety question is empirical: whether epitope selectivity actually
      translates into a cleaner normal-tissue profile in vivo, which only pre-clinical and clinical data
      can answer.
    claimRefs: [CE021, CE022, CE023, CE024, CE025, CE026, CE027, CE028, CE029, CE033]
    tableRefs: [TE004]
callouts:
  - calloutType: strength
    title: Proprietary value sits in discovery, not chemistry
    body: >-
      Stipple concentrates its edge in epitope discovery and binder selection while outsourcing
      conjugation/CMC to Lonza — the steps where ADC programs most often fail on manufacturability.
    claimRefs: [CE009, CE013]
  - calloutType: risk
    title: No platform validation data is public
    body: >-
      There is no peer-reviewed Pointillist dataset, no STP-100 selectivity data, and no registered
      trial; the differentiation claim is scientifically plausible but empirically unproven.
    claimRefs: [CE015, CE016, CE032]
  - calloutType: assumption
    title: The safety thesis is empirical and unresolved
    body: >-
      Whether epitope selectivity yields a cleaner normal-tissue profile can only be shown with
      pre-clinical and clinical data, which do not yet exist.
    claimRefs: [CE021, CE029]
