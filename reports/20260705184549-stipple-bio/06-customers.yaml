  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: named-proof
      missingEvidence: "Any signed customer or platform-partnership contract with a named counterparty and disclosed economics."
      whyItMatters: "Without a real customer or partner deal, demand is only inferred interest; the named-customer proof table is a sample of proxies, not customers."
      diligencePath: "Request the pipeline of BD discussions, any term sheets, and confirmation of inbound biopharma interest under NDA."
      relatedQuestionRefs: [QU008, QU009]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: retention
      missingEvidence: "Any retention, renewal, or repeat-usage data."
      whyItMatters: "Durability cannot be assessed for a company with no customers or contracts."
      diligencePath: "Re-assess after first partnership or clinical adoption; track cohort behavior of any future licensees."
      relatedQuestionRefs: [QU011]
    - type: enumeration-incomplete
      severity: material
      topic: concentration
      missingEvidence: "Diversification beyond STP-100 and beyond the single Lonza supply relationship."
      whyItMatters: "Single-asset and single-supplier concentration means a program or supplier failure has no customer-base cushion."
      diligencePath: "Obtain the follow-on pipeline and any secondary-supplier or second-source manufacturing plans."
      relatedQuestionRefs: [QU012, QU013]
