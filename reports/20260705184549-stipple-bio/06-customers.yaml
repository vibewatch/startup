company:
  name: Stipple Bio, Inc.
chapter:
  number: 6
  title: Customers
  summary: >-
    Stipple has no paying customers: it is a pre-clinical company with no product, no revenue, and no
    named production adopters. Its "customers" are prospective and two-horizon — pharma partners and
    acquirers near term, and oncologists, payers, and patients after a hypothetical approval. The only
    concrete commercial relationship is with Lonza, where Stipple is the customer, plus reported but
    unnamed inbound biopharma interest in the platform. Adoption, retention, and concentration metrics
    do not yet exist, so this chapter documents demand signals and the pathway to real customers rather
    than proof of traction.
sections:
  - id: segmentation
    title: Who Pays and Who Uses
    body: >-
      Stipple's customer structure must be described on two horizons because it has no current buyers.
      Near term, the relevant "customers" are capital markets and prospective pharma partners: venture
      investors fund the company, and large pharmaceutical companies are the entities that would license
      the platform or acquire assets, as the broader 2026 deal environment (over $250B of biopharma
      licensing in 2025, with oncology and next-generation antibodies the dominant segment) makes clear.
      Stipple's CEO has said biopharma companies have approached the company to collaborate via the
      Pointillist Platform, though management has signalled a preference for wholly-owned assets. The one
      concrete commercial relationship today inverts the usual direction: under the Lonza license,
      Stipple is the customer, paying for conjugation technology and manufacturing. Long term, once (if)
      STP-100 is approved, the end-market customer chain is the standard oncology structure — oncologists
      and hospital pharmacies select and administer the drug, patients receive it, and payers own the
      budget and gate reimbursement. No customer can be segmented by revenue band, vertical, or geography
      yet because none exists; the segmentation below is therefore of prospective and proxy customers.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU030]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption
    title: Adoption Trajectory and Demand Signals
    body: >-
      There is no product adoption trajectory to measure — no active users, accounts, deployments, or
      utilization — so the evidence here is category adoption and platform demand, used as leading
      indicators rather than proof. At the category level, ADCs are now mainstream in solid-tumor
      oncology, with more than 15 approved products, worldwide ADC sales exceeding $16 billion in 2026,
      and rapid uptake in breast, lung, urothelial, and ovarian cancers; this validates the end-market
      Stipple is aiming at even though it says nothing about STP-100 specifically. At the platform level,
      pharma demand for antibody-discovery and next-generation oncology platforms is unusually strong in
      2026 (record licensing values, deals such as BMS-BioNTech and AbbVie-RemeGen), which is the demand
      pool Stipple's optional licensing model would tap. The most concrete Stipple-specific demand signal
      is the June 2026 Lonza agreement plus reported inbound interest from biopharma companies. These are
      genuine but soft signals: they show the market is receptive to differentiated ADC platforms, not
      that anyone has yet committed to Stipple's science.
    claimRefs: [CU007, CU008, CU009, CU010, CU011, CU012, CU013, CU031]
    tableRefs: [TU002]
    figureRefs: [FU002]
  - id: named-proof
    title: Named Customer Proof (and Its Absence)
    body: >-
      Honest diligence must state plainly that Stipple has no named production customers, no pilots, and
      no reference accounts, because it has no product to deploy. The closest analogues to "named
      customer proof" are: Lonza, a signed commercial counterparty (with Stipple as the paying customer
      rather than the vendor); unnamed biopharma companies that have reportedly approached Stipple about
      platform collaboration; and the investor syndicate, whose capital is a proxy vote of confidence but
      not customer demand. None of these is a customer buying Stipple's output, so the named-customer
      table below is explicitly a sample of proxy relationships with an open evidence gap, not an
      exhaustive customer roster. The quality of this "proof" is low on the conventional scale — it is
      demand-side interest and a supplier contract, not revenue or usage — and its freshness is current
      (April-June 2026). The single most valuable future proof point would be a signed platform
      collaboration or partnership with a named pharma company on disclosed economics.
    claimRefs: [CU014, CU015, CU016, CU017, CU018, CU032]
    tableRefs: [TU003, TU006]
    figureRefs: [FU003]
  - id: retention-concentration
    title: Retention, Expansion, and Concentration Risk
    body: >-
      Retention metrics — net revenue retention, gross retention, churn, renewal, cohort behavior — do
      not exist because there are no customers or contracts to retain, so every such metric is recorded
      as null with a diligence path. What can be assessed is concentration and dependency risk, and here
      the picture is stark. Stipple's "revenue" future is concentrated in a single pre-clinical asset
      (STP-100) against an undisclosed target, so program risk is effectively customer-concentration risk
      by another name: if that program fails, there is no diversified customer base to fall back on.
      Supply-and-partner concentration is also high: Lonza is the sole disclosed conjugation and
      manufacturing partner, creating a single point of dependency for the chemistry that any future
      customer relationship relies on. On expansion, the bullish case is land-and-expand at the platform
      level — one pharma collaboration validating the science could seed multiple target-by-target deals
      — but that is entirely prospective. Procurement friction for the eventual end-market (payer
      cost-effectiveness scrutiny, where many ADCs exceed common $/QALY thresholds) is a further adoption
      filter years away. Net, concentration risk is high and durability is unproven.
    claimRefs: [CU019, CU020, CU021, CU022, CU023, CU024, CU025, CU033, CU034]
    tableRefs: [TU004, TU005]
callouts:
  - calloutType: risk
    title: No customers, revenue, or usage exist yet
    body: >-
      Stipple is pre-commercial; adoption, retention, and named-customer proof do not exist. Demand
      signals (Lonza deal, inbound biopharma interest, strong platform-licensing market) are leading
      indicators, not traction.
    claimRefs: [CU001, CU014, CU008]
  - calloutType: risk
    title: Concentration risk is program risk
    body: >-
      With one pre-clinical asset and a single conjugation/manufacturing partner (Lonza), Stipple has no
      diversified customer base to cushion a program or supplier failure.
    claimRefs: [CU019, CU021]
  - calloutType: insight
    title: The platform-licensing market is a receptive demand pool
    body: >-
      Record 2026 biopharma licensing and strong ADC-platform demand mean the market is receptive to
      differentiated discovery platforms — an opportunity Stipple could tap if its science validates.
    claimRefs: [CU010, CU011]
