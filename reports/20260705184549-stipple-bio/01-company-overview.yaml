callouts:
  - calloutType: risk
    title: Announced round exceeds filed amount sold
    body: >-
      The Series A is promoted as a $100M oversubscribed close, but the April 6, 2026 Form D reports
      $65.13M sold of a $100.2M offering with $35.07M remaining. This may reflect staged closings, but
      diligence should reconcile the announced figure with the amount actually funded.
    claimRefs: [CO018, CO019, CO037]
  - calloutType: assumption
    title: Valuation is undisclosed
    body: >-
      No authoritative source confirms a valuation; the circulated $2.25B unicorn figure is not
      corroborated by the July 2026 TechCrunch unicorn list, so valuation is treated as null.
    claimRefs: [CO024, CO038]
  - calloutType: strength
    title: Credentialed, repeat founding team
    body: >-
      Ring has founded multiple clinical-stage oncology companies and Manglik is an award-winning
      structural biologist, giving the platform unusual scientific pedigree for a pre-clinical startup.
    claimRefs: [CO009, CO010, CO012]
