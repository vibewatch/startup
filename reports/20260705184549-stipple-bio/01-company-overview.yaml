company:
  name: Stipple Bio, Inc.
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Stipple Bio is a Cambridge, Massachusetts precision-oncology company founded in 2022 by academic
    cancer-biology researchers Aaron Ring and Aashish Manglik and led by CEO Jeff Landau. It emerged
    from stealth in April 2026 with a $100M oversubscribed Series A, is pre-clinical with a single
    named ADC program (STP-100) targeting an undisclosed tumor epitope, and has no revenue, products,
    or disclosed valuation. SEC Form D filings both corroborate the capital story and expose a gap
    between the announced $100M close and the $65.1M actually sold at filing.
sections:
  - id: identity-and-model
    title: Identity, Stage, and Business Model
    body: >-
      Stipple Bio, Inc. is a privately held biotechnology company headquartered in Cambridge,
      Massachusetts that is building precision-oncology medicines around tumor-specific cell-surface
      epitopes. The company was founded in 2022 by two academic cancer-biology researchers, Dr. Aaron
      Ring of the Fred Hutchinson Cancer Center and Dr. Aashish Manglik of the University of California,
      San Francisco, on the thesis that targeting tumor-specific epitopes (rather than merely
      tumor-specific gene expression) can widen the therapeutic index of cancer drugs and unlock
      targets previously considered intractable. Its core asset is the "Pointillist Platform," a
      modality-agnostic discovery engine that maps tumor-specific epitopes and pairs them with binders
      designed to avoid on-target/off-tumor toxicity. The lead program, STP-100, is an antibody-drug
      conjugate (ADC) whose molecular target and indication remain undisclosed. Stipple emerged from
      stealth only in April 2026, remains pre-clinical, and reports no revenue, no marketed products,
      and no disclosed customer base. The business model is a classic wholly-owned biotech pipeline
      play: raise venture capital, advance proprietary assets toward the clinic, and monetize through
      future partnering, acquisition, or product sales rather than near-term revenue.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO034, CO040]
    tableRefs: [TO001]
    figureRefs: [FO002, FO003]
  - id: leadership-and-governance
    title: Founders, Leadership, and Governance
    body: >-
      Stipple's identity is anchored in an unusually credentialed scientific founding team paired with
      a repeat-operator chief executive. Co-founder Aaron Ring is an Associate Professor and Anderson
      Family Chair for Immunotherapy at Fred Hutch, holds an MD/PhD from Stanford, and has previously
      founded Simcha Therapeutics, ALX Oncology, and Seranova Bio, giving him a strong founder-market
      fit and a track record of translating academic immunology into clinical-stage companies.
      Co-founder Aashish Manglik is an Associate Professor at UCSF specializing in G-protein-coupled
      receptor structural biology, trained under Nobel laureate Brian Kobilka, a 2026 Vilcek Prize
      recipient, and co-founder of Epiodyne. Chief Executive Officer Jeff Landau holds an MBA from
      Stanford Graduate School of Business and was previously a co-founder of Sunterra Bio. Governance
      is investor-heavy: the board pairs the founders and CEO with general partners and partners from
      lead investors a16z (Vineeta Agarwala), RA Capital (Derek DiRocco), and Nextech (Thilo
      Schroeder), plus independent director Owen Hughes and serial biotech founder Gregory Verdine.
      DiRocco and Schroeder joined the board in conjunction with the Series A. Key-person dependence on
      Ring's science and Landau's execution is high, and no COO, CFO, or CMO has been publicly named.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO013, CO014, CO015, CO035, CO036]
    tableRefs: [TO002]
  - id: funding-and-capital
    title: Funding History, Capital, and Cover Metrics
    body: >-
      Stipple has raised across at least three private financings that are corroborated by SEC Form D
      filings under CIK 0001932776. A 2022 seed round shows a $12.0M offering with $11.975M sold to
      seven investors (a16z Bio+Health, Emerson Collective, and OMX are named as seed backers), and a
      December 2024 Form D shows a $15.0M offering with $9.476M sold, implying roughly $21.5M of
      pre-Series A capital. In April 2026 the company announced a $100M "heavily oversubscribed" Series
      A co-led by RA Capital, a16z Bio+Health, and Nextech Invest, with participation from Emerson
      Collective (managed by Yosemite), GV (Google Ventures), LoLa Capital Partners, and GordonMD
      Global Investments; proceeds are said to fund the company into 2029. The corresponding Form D,
      filed April 6, 2026, reports a $100.2M total offering but only $65.13M sold as of filing with
      $35.07M remaining across 15 investors, a material nuance for diligence because the public
      "$100M closed" framing exceeds the amount the filing shows sold. Cover metrics such as valuation,
      revenue run-rate, customer count, and headcount are not disclosed; a widely referenced $2.25B
      unicorn valuation is not supported because Stipple does not appear on the July 2026 TechCrunch
      unicorn list, so those metrics are recorded here as null with explicit diligence paths.
    claimRefs: [CO016, CO017, CO018, CO019, CO020, CO021, CO022, CO023, CO024, CO037, CO038, CO039]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: milestones-and-adverse
    title: Milestones, Partnerships, and Adverse Checks
    body: >-
      Stipple's short public history is a compact chronology of financings, a platform reveal, and one
      commercial partnership. The company incorporated and seeded in 2022, added capital in late 2024,
      emerged from stealth alongside its $100M Series A on April 6, 2026, and in June 2026 signed a
      multi-target ADC licensing agreement with contract development and manufacturing organization
      Lonza, gaining target-specific access to Lonza's GlycoConnect, HydraSpace, and toxSYN
      (Synaffix-derived) site-specific ADC toolkit for programs including STP-100. Adverse and
      conflicting signals are modest but real: the target and indication for STP-100 are undisclosed,
      no human data exist, the IND is only guided for early 2027, and no ClinicalTrials.gov study is
      yet registered. Financially, the Series A Form D shows less capital sold ($65.1M) than the
      announced $100M close, and the promoted $2.25B valuation is unverified. No litigation, recalls,
      layoffs, sanctions, or leadership departures were found in public sources as of the run date,
      which is consistent with an early, recently unstealthed company but also reflects thin public
      disclosure rather than a clean, deeply documented record.
    claimRefs: [CO025, CO026, CO027, CO028, CO029, CO030, CO031, CO032, CO033, CO040, CO041]
    tableRefs: [TO004]
    figureRefs: [FO004]
