tables:
  - id: TV001
    title: Thesis / anti-thesis table
    columns: [Dimension, Thesis, "Anti-thesis"]
    rows:
      - ["Team", "Repeat oncology founders + strong syndicate", "Lean C-suite; key-person risk"]
      - ["Product", "Differentiated epitope selectivity", "No data; undisclosed target"]
      - ["Market", "Large ADC/precision-onc market", "Crowded (~2,800 candidates); demand cuts"]
      - ["Customers", "Inbound platform interest; Lonza deal", "No customers or revenue"]
      - ["Financials", "$100M raised; runway to 2029", "$65.1M sold; burn/valuation opaque"]
      - ["Competition/exit", "Hot ADC M&A (Firefly ~$1B)", "Incumbents own maturity + IP"]
      - ["Risk", "Design-level safety rationale", "~5-7% LOA; ADC safety class risk"]
    notes: "A balanced thesis/anti-thesis grid; every thesis point has a live counter given the pre-clinical stage."
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006]
  - id: TV002
    title: Recommendation summary table
    columns: [Field, Assessment, Rationale]
    rows:
      - ["Recommendation", "Research-more", "Key disclosures (target, price, data) missing"]
      - ["Confidence", "Low", "Pre-clinical; wide outcome dispersion"]
      - ["Risk rating", "High", "Binary asset; ~5-7% LOA"]
      - ["Valuation stance", "Unknown", "No confirmed valuation; $2.25B unverified"]
      - ["Composite score", "~4.7 / 10", "Strong sponsorship vs deep uncertainty"]
      - ["Primary catalyst", "Target + selectivity data; IND ~2027", "First real de-risking event"]
    notes: "Qualitative assessment; scores are analyst judgments, not derived from disclosed financials."
    claimRefs: [CV008, CV009, CV010, CV013, CV039, CV041]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, "Key assumptions", "Illustrative value", "Probability signal"]
    rows:
      - ["Bull", "Platform validates; clean selectivity; partnership/M&A", "$1B-$10B (Firefly to ImmunoGen analogues)", "Low"]
      - ["Base", "Reaches clinic; partial validation; Series B step-up", "$0.3B-$1B (option kept alive)", "Medium"]
      - ["Bear", "Selectivity/safety failure or target blocked; raise fails", "~Residual cash (near-zero)", "Highest single-path"]
    notes: "Illustrative risk-adjusted ranges anchored to comparable transactions; not a formal rNPV given undisclosed inputs."
    claimRefs: [CV020, CV021, CV022, CV023, CV024]
  - id: TV004
    title: Thesis-break and kill triggers table
    columns: [Trigger, "Signal to watch", "Action"]
    rows:
      - ["No selectivity advantage", "Pre-clinical tumor-vs-normal data", "Downgrade to avoid"]
      - ["Safety signal / clinical hold", "First-in-human safety; FDA action", "Downgrade to avoid"]
      - ["Target de-risked / IP-blocked", "FTO opinion; competitor filings", "Downgrade to avoid"]
      - ["Failed Series B", "Milestone raise terms", "Downgrade to avoid"]
      - ["Clean data + named partner", "Selectivity data + pharma deal", "Upgrade toward track/buy"]
      - ["Lonza relationship change", "License amendment/termination", "Reassess dependency risk"]
    notes: "Symmetric trigger list — downside kill criteria and the upside conditions that would justify an upgrade."
    claimRefs: [CV026, CV036, CV037]
  - id: TV005
    title: Comparable valuation table
    columns: [Comparable, Type, Stage, "Deal / valuation", Relevance]
    rows:
      - ["Firefly Bio (J&J)", "M&A", "Pre-clinical DAC platform", "~$1B upfront (2026)", "Closest stage/modality comp"]
      - ["ImmunoGen (AbbVie)", "M&A", "Commercial ADC (Elahere)", "$10.1B (2024)", "Upper-bound, de-risked"]
      - ["Seagen (Pfizer)", "M&A", "Commercial ADC franchise", "$43B (2023)", "Upper-bound, franchise"]
      - ["BMS-BioNTech", "License", "Clinical bispecific", "$11.1B (2025)", "Platform-demand signal"]
      - ["Oncology Series A (2026)", "Private round", "Pre-clinical", "~$75-100M pre-money", "Direct round benchmark"]
      - ["Biopharma licensing (2025)", "Market", "All stages", ">$250B; ~$1.3B avg deal", "Demand-pool context"]
    notes: "SAMPLE of representative comps, not an exhaustive universe; high comps reflect de-risking Stipple has not yet achieved. See evidence gap."
