callouts:
  - calloutType: insight
    title: The obtainable market is unquantifiable until the target is disclosed
    body: >-
      Stipple's TAM/SAM lenses are all defensible, but its serviceable-obtainable market depends entirely on which
      toxicity-limited target STP-100 addresses and how large that indication is. Until the company discloses the
      target, any SOM figure is speculative.
    claimRefs:
      - CM013
      - CM032
      - CM034
  - calloutType: risk
    title: A crowded, safety-scrutinized category
    body: >-
      With ~2,800 ADC candidates in development and known class-level toxicity (ILD/pneumonitis), Stipple must show a
      genuine therapeutic-index advantage, not just another ADC, to win share.
    claimRefs:
      - CM024
      - CM026
      - CM036
