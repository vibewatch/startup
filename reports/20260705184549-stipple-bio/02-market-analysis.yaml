company:
  name: Stipple Bio, Inc.
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Stipple Bio competes in the antibody-drug conjugate (ADC) segment of the precision-oncology market. The ADC market
    is roughly $16-23B in 2026 and is forecast to reach $46-68B by 2030-2034, nested inside a $128-146B
    precision-oncology market and an underlying cancer burden of ~20M new cases a year. Demand drivers (clinical
    validation, big-pharma M&A, unmet need in toxicity-limited targets) are strong, but the segment is crowded (~2,800
    ADC candidates), safety-constrained, and Stipple's obtainable share is unquantifiable today because STP-100's target
    and indication are undisclosed.
sections:
  - id: market-boundary
    title: Market Boundary and Substitutes
    body: >-
      Stipple Bio's relevant market is the antibody-drug conjugate (ADC) segment of oncology therapeutics, itself a
      slice of the broader precision-oncology market for targeted cancer medicines. Included spend is revenue from ADC
      products sold to treat solid and hematologic tumors, plus, more loosely, the targeted-therapy budget that
      epitope-selective ADCs could capture. Adjacent but excluded categories are immune-checkpoint inhibitors, CAR-T and
      cell therapies, bispecific antibodies, small-molecule targeted drugs, and molecular diagnostics; these are
      substitutes or complements rather than the ADC category itself. The status-quo alternatives a new ADC must
      displace are existing approved ADCs such as Enhertu (trastuzumab deruxtecan), Trodelvy, and Elahere, conventional
      cytotoxic chemotherapy, and targeted small molecules. Stipple's specific wedge is narrower still: ADCs aimed at
      tumor-specific epitopes on targets that have been clinically validated but limited by on-target/off-tumor
      toxicity. That framing makes the true addressable market a function of how many such toxicity-constrained targets
      exist and can be "unlocked," which is not publicly quantified and is treated here as an evidence-constrained
      boundary rather than a clean TAM.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM031
      - CM032
    tableRefs:
      - TM001
    figureRefs:
      - FM003
  - id: market-sizing
    title: Market Sizing Across Multiple Lenses
    body: >-
      No single number captures Stipple's opportunity, so this analysis stacks several lenses. At the broadest layer,
      global cancer incidence was roughly 20 million new cases in 2022 and is projected to rise toward 35 million by
      2050, with about 2.1 million new US cases estimated for 2026, underpinning durable demand. The precision-oncology
      market that Stipple ultimately sells into is estimated at roughly $128-146 billion in 2026, growing at high-single
      to low-double-digit rates toward $300-339 billion by the mid-2030s. The ADC segment specifically is estimated at
      about $16.7 billion (Grand View) to $22.6 billion (Fortune Business Insights) in 2026, with forecasts to $32-68
      billion by 2033-2034 at CAGRs of roughly 11.5-15%; other trackers put ADC sales past $16 billion in 2025 and above
      $46 billion by 2030. These estimates disagree by wide margins because of differing definitions, geographies, and
      base years, so they are preserved as a range rather than reconciled to one figure. The serviceable and obtainable
      layers collapse sharply for Stipple: as a single-asset pre-clinical company it has no revenue, and any obtainable
      share is a risk-adjusted fraction of one future ADC's peak sales, which cannot be sized credibly until the STP-100
      target and indication are disclosed.
    claimRefs:
      - CM006
      - CM007
      - CM008
      - CM009
      - CM010
      - CM011
      - CM012
      - CM013
      - CM033
      - CM034
    tableRefs:
      - TM002
    figureRefs:
      - FM001
      - FM002
  - id: buyers-and-adoption
    title: Buyers, Payers, and the Adoption Path
    body: >-
      For a pre-clinical platform biotech, "buyers" exist on two horizons. Near term, Stipple's effective customers are
      capital providers and potential pharma licensees: venture investors fund the pipeline, and large pharmaceutical
      companies are the acquirers or partners who ultimately pay for validated ADC assets, as evidenced by the ADC deal
      wave and Stipple's own CDMO relationship with Lonza. Long term, once (if) STP-100 reaches market, the end-market
      buyer structure is the standard oncology chain: oncologists and hospital pharmacies select and administer the
      drug, patients receive it, and payers (commercial insurers, pharmacy benefit managers, and government programs
      such as Medicare) own the budget and gate reimbursement. The adoption trigger is a sequence: FDA approval,
      inclusion in NCCN/clinical guidelines, payer coverage decisions, and demonstrated therapeutic-index advantage over
      incumbent ADCs and chemotherapy. Because ADCs are premium-priced specialty products, payer scrutiny of incremental
      benefit versus cost is a real adoption filter, and a differentiated safety profile (Stipple's core claim) is
      exactly the attribute that can justify premium positioning if it survives clinical testing.
    claimRefs:
      - CM014
      - CM015
      - CM016
      - CM017
      - CM018
      - CM019
      - CM020
      - CM035
    tableRefs:
      - TM003
    figureRefs:
      - FM004
  - id: drivers-and-constraints
    title: Growth Drivers and Adoption Constraints
    body: >-
      The tailwinds behind ADCs are substantial. Clinical validation and label expansion (led by Enhertu, which posted
      roughly $4.4-5 billion in 2025 sales) have made ADCs a core oncology pillar; big-pharma M&A has repeatedly paid up
      for the modality (Pfizer-Seagen at $43B, AbbVie-ImmunoGen at $10.1B, and J&J's ~$1B purchase of pre-clinical
      Firefly Bio); linker and payload chemistry keep improving; and there is genuine unmet need on targets that current
      drugs cannot exploit without unacceptable toxicity, which is precisely Stipple's thesis. Offsetting constraints
      are equally real. The field is crowded, with roughly 2,800 ADC candidates in development and 23 approved products,
      so differentiation is hard. ADCs carry recognized safety liabilities, most notably interstitial lung disease and
      pneumonitis with black-box warnings on leading agents, which raises the clinical and regulatory bar. Manufacturing
      and CMC are complex and capital-intensive, reinforcing dependence on partners like Lonza. And demand is not
      guaranteed to compound smoothly: Daiichi Sankyo took an $850 million charge and cut ADC facility investment as it
      trimmed demand forecasts, a caution flag for the whole segment. These countervailing forces are preserved rather
      than netted to a single verdict.
    claimRefs:
