company:
  name: Stipple Bio, Inc.
chapter:
  number: 4
  title: Financials
  summary: >-
    Stipple is a pre-revenue, pre-clinical biotech: there is no revenue, ARR, or unit economics to
    underwrite, so the financial story is entirely about capital adequacy. SEC Form D filings show a
    2022 seed ($11.975M sold), a December 2024 raise ($9.476M sold), and a 2026 Series A with a
    $100.2M offering of which $65.13M was sold at filing. Management guides runway into 2029, but cash
    on hand, monthly burn, valuation, and detailed use of funds are undisclosed, leaving the core
    underwriting inputs as diligence gaps.
sections:
  - id: revenue-model
    title: Revenue Model and Monetization
    body: >-
      Stipple has no current revenue. As a pre-clinical drug developer it recognizes no product sales,
      no service revenue, and no recurring income, and none of the usual SaaS-style metrics (ARR, GMV,
      active users) apply. Its revenue model is prospective and two-pronged. The primary path is a
      wholly-owned pipeline: advance STP-100 and follow-on ADCs through the clinic and monetize via
      product sales, out-licensing, or acquisition, mirroring how peers like Firefly Bio realized value
      through a ~$1B buyout while still pre-clinical. A secondary, optional path is platform licensing,
      in which Stipple could grant pharma partners access to Pointillist-discovered epitopes for
      upfront, milestone, and royalty payments; management has said biopharma companies have approached
      it, though it has signalled a preference for wholly-owned assets. Notably, Stipple currently sits
      on the paying side of a comparable structure: under its Lonza license it owes upfront, milestone,
      and royalty consideration for conjugation technology. Until a clinical asset or a signed platform
      deal exists, revenue quality cannot be assessed and every revenue line is recorded as null with a
      diligence path.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI020]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: cost-and-unit-economics
    title: Cost Structure and Unit Economics
    body: >-
      Because there is no product, Stipple has no cost of goods sold, no gross margin, and no
      customer-acquisition economics; conventional unit-economics analysis is not yet meaningful. The
      cost base is dominated by research and development — epitope discovery, antibody engineering,
      payload/linker work, and IND-enabling studies — plus general and administrative expense for a
      lean, largely undisclosed headcount. The go-to-market "motion" is effectively a capital-efficiency
      question: how much cash is required to reach the next value-inflection milestone (IND filing and
      first-in-human data guided for early 2027). Manufacturing is capital-light on paper because
      Stipple outsources conjugation and manufacturing to Lonza, but that outsourcing converts fixed
      capex into variable milestone and royalty obligations, and ADC CMC is notoriously complex and
      expensive. The only defensible "unit" lens today is cost-per-milestone: the Series A is explicitly
      sized to fund the company into 2029 and through multiple early-stage studies, implying a
      multi-year, tens-of-millions-per-year burn profile, but the actual figures are not disclosed and
      are treated as estimates or gaps rather than facts.
    claimRefs: [CI006, CI007, CI008, CI009, CI010, CI021, CI022]
    tableRefs: [TI003]
    figureRefs: [FI002]
  - id: capital-adequacy
    title: Capital Adequacy, Burn, and Runway
    body: >-
      Capital adequacy is the crux of Stipple's financial profile, and here SEC Form D filings provide
      hard anchors even though the company is private. A 2022 seed Form D reports a $12.0M offering with
      $11.975M sold to seven investors; a December 2024 Form D reports a $15.0M offering with $9.476M
      sold; and the April 2026 Series A Form D reports a $100.2M offering with $65.13M sold and $35.07M
      remaining across 15 investors. Summing the amounts actually sold implies roughly $21.5M raised
      before the Series A and about $86.6M sold across all filings to date, versus the promoted "$100M
      closed" headline. Management guides that the Series A funds the company into 2029, which — if the
      full $100M is ultimately collected — implies an average burn on the order of $30-35M per year over
      roughly three years; if only the $65.13M sold is available, the runway math tightens materially.
      Cash on hand, exact monthly burn, the valuation, and a line-item use of funds are all undisclosed.
      The next financing trigger is clinical progress: an IND and early human data would support a
      Series B step-up, consistent with a 2026 environment where oncology Series B rounds commonly run
      $150-250M. Financing dependency is therefore high and milestone-contingent.
    claimRefs: [CI011, CI012, CI013, CI014, CI015, CI016, CI017, CI023, CI024, CI037]
    tableRefs: [TI004]
    figureRefs: [FI003, FI004]
  - id: financial-verdict
    title: Financial Verdict and Diligence Blockers
    body: >-
      The financial verdict is that Stipple cannot be underwritten on fundamentals today because the
      fundamentals do not yet exist: there is no revenue to judge for quality, no margin path to model,
      and no unit economics to stress. What can be judged is capital posture, and it is a mixed picture.
      On the positive side, the company is well-capitalized for its stage relative to 2026 benchmarks
      (biotech Series A rounds averaged roughly $75-100M pre-money in oncology), has blue-chip investors,
      and has outsourced the most capital-intensive manufacturing steps to Lonza. On the cautious side,
      the gap between the announced $100M and the $65.13M shown sold on the Form D, the undisclosed cash
      and burn, the undisclosed valuation, and a multi-year path to any revenue make this a
      financing-dependent, binary asset. The primary diligence blockers are: obtain audited cash and
      monthly burn, reconcile the announced-versus-sold Series A amount, get a line-item use of funds,
      and quantify the Lonza economic obligations. Until those are answered, the financial profile is
      "adequately funded to the next milestone, but opaque and financing-dependent beyond it."
    claimRefs: [CI016, CI017, CI018, CI019, CI025, CI026, CI027]
    tableRefs: [TI005]
callouts:
  - calloutType: risk
    title: Announced $100M exceeds the $65.13M shown sold
    body: >-
      The Series A Form D reports $65.13M sold of a $100.2M offering with $35.07M remaining. If only the
      sold amount is in hand, the 'into 2029' runway is tighter than the headline implies.
    claimRefs: [CI013, CI016]
  - calloutType: assumption
    title: Burn and cash are estimates, not disclosures
    body: >-
      No cash balance or monthly burn is public; the ~$30-35M/year implied burn is derived from the
      raise size and the 'into 2029' runway guidance, not from disclosed financials.
    claimRefs: [CI015, CI024]
  - calloutType: insight
    title: Capital-light manufacturing, milestone-heavy obligations
    body: >-
      Outsourcing conjugation/manufacturing to Lonza limits capex but creates upfront, milestone, and
      royalty obligations whose size is undisclosed.
    claimRefs: [CI009, CI021]
