  topStrengths:
    - "Repeat, credentialed scientific founders (Ring, Manglik) and a blue-chip investor syndicate (RA Capital, a16z Bio+Health, Nextech)."
    - "Differentiated epitope-selectivity thesis aimed at validated-but-toxic ADC targets in a large, actively-consolidating market."
    - "Lonza conjugation/manufacturing partnership de-risks the chemistry that most ADC programs stumble on; capital guided into 2029."
  topRisks:
    - "Binary, single-asset, pre-clinical bet with a ~5-7% oncology likelihood of approval and no human data."
