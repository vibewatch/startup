companyProfile:
  summary: >-
    Stipple Bio is a Cambridge, Massachusetts precision-oncology company founded in 2022 by
    academic cancer-biology researchers Aaron Ring (Fred Hutch) and Aashish Manglik (UCSF) and led by
    CEO Jeff Landau. Its Pointillist Platform identifies tumor-specific cell-surface epitopes to build
    antibody-drug conjugates with a wider therapeutic index; the lead program STP-100 is a pre-clinical
    ADC against an undisclosed, toxicity-limited target with clinical entry guided for early 2027. The
    company emerged from stealth in April 2026 with a $100M Series A and has no revenue, products, or
    disclosed valuation.
  foundedDate: "2022-05-31"
  founders:
    - name: "Aaron Ring"
      role: "Co-founder; Director"
      background: "MD/PhD (Stanford); Associate Professor and Anderson Family Chair, Fred Hutch; founder of Simcha Therapeutics, ALX Oncology, and Seranova Bio."
      claimRefs: [CO009]
    - name: "Aashish Manglik"
      role: "Co-founder"
      background: "Associate Professor of structural biology at UCSF; trained under Nobel laureate Brian Kobilka; 2026 Vilcek Prize recipient."
      claimRefs: [CO010]
    - name: "Jeff Landau"
      role: "CEO; Director"
      background: "MBA (Stanford GSB); repeat biotech operator; previously a co-founder of Sunterra Bio."
      claimRefs: [CO011]
  foundingLocation: "Cambridge, Massachusetts, USA"
  headquarters: "Cambridge, Massachusetts, USA"
  productSummary: >-
    A modality-agnostic epitope-discovery platform (Pointillist) plus a lead antibody-drug conjugate
    (STP-100) that pairs tumor-specific binders with Lonza's GlycoConnect/HydraSpace/toxSYN
    conjugation chemistry to hit validated-but-toxic targets while sparing healthy tissue.
  customerFocus: >-
    None today (pre-commercial). Near-term "customers" are prospective pharma partners/acquirers and
    capital markets; the eventual end-market is oncologists, health systems, payers, and patients.
  businessModel: >-
    Venture-funded wholly-owned biotech pipeline; monetization via future product sales, out-licensing,
    or acquisition, with optional platform licensing (upfront/milestones/royalties).
  stage: "Series A (private, pre-clinical)"
  fundingStatus: >-
    $100M Series A announced April 2026 (co-led by RA Capital, a16z Bio+Health, Nextech; $65.1M sold
    per Form D), on top of ~$21.5M pre-Series A capital; guided to fund the company into 2029.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO004, CO006]
