      - number: '2.3'
        title: Buyers, Payers, and the Adoption Path
        blocks:
          - type: paragraph
            body: >-
              For a pre-clinical platform biotech, "buyers" exist on two horizons. Near term, Stipple's effective
              customers are capital providers and potential pharma licensees: venture investors fund the pipeline, and
              large pharmaceutical companies are the acquirers or partners who ultimately pay for validated ADC assets,
              as evidenced by the ADC deal wave and Stipple's own CDMO relationship with Lonza. Long term, once (if)
              STP-100 reaches market, the end-market buyer structure is the standard oncology chain: oncologists and
              hospital pharmacies select and administer the drug, patients receive it, and payers (commercial insurers,
              pharmacy benefit managers, and government programs such as Medicare) own the budget and gate
              reimbursement. The adoption trigger is a sequence: FDA approval, inclusion in NCCN/clinical guidelines,
              payer coverage decisions, and demonstrated therapeutic-index advantage over incumbent ADCs and
              chemotherapy. Because ADCs are premium-priced specialty products, payer scrutiny of incremental benefit
              versus cost is a real adoption filter, and a differentiated safety profile (Stipple's core claim) is
              exactly the attribute that can justify premium positioning if it survives clinical testing.
            claimRefs:
