      - number: '5.4'
        title: Trust, Safety, Quality, and Compliance
        blocks:
          - type: paragraph
            body: >-
              For an ADC, trust and quality are dominated by safety and manufacturing control. The entire Stipple thesis
              is a safety argument: epitope selectivity is meant to reduce on-target/off-tumor toxicity, the class
              liability that produces dose-limiting effects and, for several marketed ADCs, black-box warnings for
              interstitial lung disease and pneumonitis. Quality on the chemistry side depends on Lonza's platforms:
              GlycoConnect's site-specific conjugation is designed to yield a homogeneous, well-characterized
              drug-to-antibody ratio, which matters for reproducibility, safety, and regulatory review. On the
              regulatory-quality front, any STP-100 program must satisfy modern FDA expectations, including the 2024
              clinical-pharmacology guidance for ADCs and the Project Optimus dose-optimization initiative, which pushes
              sponsors toward randomized dose-finding rather than maximum-tolerated-dose designs. Stipple has no GMP or
              clinical-quality track record of its own and relies on Lonza for manufacturing controls, so quality
              assurance is partly a partner-diligence question. The central unresolved safety question is empirical:
              whether epitope selectivity actually translates into a cleaner normal-tissue profile in vivo, which only
              pre-clinical and clinical data can answer.
