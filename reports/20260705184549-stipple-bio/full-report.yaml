      - number: '2.2'
        title: Market Sizing Across Multiple Lenses
        blocks:
          - type: paragraph
            body: >-
              No single number captures Stipple's opportunity, so this analysis stacks several lenses. At the broadest
              layer, global cancer incidence was roughly 20 million new cases in 2022 and is projected to rise toward 35
              million by 2050, with about 2.1 million new US cases estimated for 2026, underpinning durable demand. The
              precision-oncology market that Stipple ultimately sells into is estimated at roughly $128-146 billion in
              2026, growing at high-single to low-double-digit rates toward $300-339 billion by the mid-2030s. The ADC
              segment specifically is estimated at about $16.7 billion (Grand View) to $22.6 billion (Fortune Business
              Insights) in 2026, with forecasts to $32-68 billion by 2033-2034 at CAGRs of roughly 11.5-15%; other
              trackers put ADC sales past $16 billion in 2025 and above $46 billion by 2030. These estimates disagree by
              wide margins because of differing definitions, geographies, and base years, so they are preserved as a
              range rather than reconciled to one figure. The serviceable and obtainable layers collapse sharply for
              Stipple: as a single-asset pre-clinical company it has no revenue, and any obtainable share is a
              risk-adjusted fraction of one future ADC's peak sales, which cannot be sized credibly until the STP-100
              target and indication are disclosed.
