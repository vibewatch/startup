      - number: '3.2'
        title: Competitor Profiles and Scale
        blocks:
          - type: paragraph
            body: >-
              The incumbents dwarf Stipple on every measurable axis. Daiichi Sankyo/AstraZeneca anchor the category with
              Enhertu, whose 2025 sales approached $4.4-5 billion and whose TROP2 follow-on Datroway won a first-line
              metastatic triple-negative breast cancer approval in May 2026 with the first statistically significant
              overall-survival benefit for a TROP2 ADC (median OS 23.7 months versus 18.7). Gilead's Trodelvy secured a
              broad first-line mTNBC approval in June 2026 and had treated roughly 75,000 patients by mid-2026, giving
              it entrenched physician familiarity. AbbVie's Elahere (folate-receptor-alpha ovarian cancer) and Pfizer's
              four-product Seagen franchise round out the commercial leaders. Against these, Stipple is a single-asset,
              pre-clinical company with a $100M Series A and one undisclosed-target program, STP-100. Its most
              comparable peer is Firefly Bio, which was also pre-clinical yet commanded a ~$1B acquisition on the
              strength of a novel conjugate platform for KRAS-driven tumors, a useful benchmark for how the market
              values differentiated ADC-adjacent platforms before clinical data. Emerging platform peers (Tubulis,
              Adcendo, Ona Therapeutics, and Merck-Kelun's sacituzumab tirumotecan) show the segment is filling quickly
              with credible science.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
