      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: A ~5-7% base-rate on the core asset
            body: >-
              Oncology programs have only a roughly 5-7% likelihood of approval from Phase 1, and STP-100 is Stipple's
              single near-term asset — the defining, largely unmitigated risk.
            calloutType: risk
            claimRefs:
              - CR002
              - CR024
          - type: callout
            title: The safety thesis could be falsified in the clinic
            body: >-
              ADC ILD/pneumonitis is a class liability with fatal precedents and FDA holds; Stipple's selectivity claim
              is unproven in vivo, so an early safety signal is a plausible kill trigger.
            calloutType: risk
            claimRefs:
              - CR017
              - CR018
              - CR037
          - type: callout
            title: Prioritize target, selectivity data, and FTO diligence
            body: >-
              The fastest way to compress Stipple's uncertainty is to obtain the target identity, pre-clinical
              selectivity data, and a freedom-to-operate opinion under NDA.
            calloutType: recommendation
            claimRefs:
              - CR038
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The investment thesis for Stipple is that a credentialed founding team has built a genuinely
              differentiated discovery platform — epitope-level targeting that could unlock validated-but-toxic cancer
              targets — inside a large and richly funded ADC/precision-oncology market, with a blue-chip syndicate, a
              de-risking Lonza chemistry partnership, and capital that funds the company into 2029. The market's
              willingness to pay for differentiated conjugate platforms is demonstrated by J&J's ~$1B acquisition of
              pre-clinical Firefly Bio and by record 2026 biopharma licensing. The anti-thesis is that none of this is
              yet proven: Stipple is a single-asset, pre-clinical company against an undisclosed and unvalidated target,
              oncology programs have only a ~5-7% likelihood of approval from Phase 1, ADCs carry class-level safety
              liabilities that have triggered FDA holds, ADC IP is contestable, the field is crowded, and even the
              headline capital is softer than advertised ($65.1M sold on the Form D versus the announced $100M).
              Critically, there is no confirmed valuation to test against this evidence, so entry discipline cannot be
              exercised on price today.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV040
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV008
              - CV007
              - CV038
      - number: '8.2'
        title: Recommendation, Confidence, and Risk Rating
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more. Stipple is a scientifically interesting, well-sponsored company, but
              the specific inputs needed to underwrite a price — the STP-100 target, pre-clinical selectivity data, the
              post-money valuation, and the Lonza economics — are all undisclosed, so a buy/track call would be
              speculation rather than analysis. Confidence in any point estimate is low given the pre-clinical stage and
              information gaps, and the risk rating is high: this is a binary asset whose outcome distribution is
              dominated by low-probability, high-payoff clinical events. The appropriate posture for a prospective
              investor is to treat the round as an option on platform validation and to condition participation on
              obtaining the missing disclosures under NDA. For an existing holder, the milestone path (IND and first
              human data, guided for early 2027) is the value driver to monitor. Valuation stance is unknown because no
              valuation is confirmed; if the circulated $2.25B figure were accurate, it would look
              stretched-to-expensive for a single pre-clinical asset, but that figure is unverified and should not
              anchor the analysis.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV041
          - type: table
            tableRef: TV002
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV013
              - CV039
              - CV041
          - type: figure
