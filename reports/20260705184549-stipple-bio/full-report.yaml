      - number: '5.3'
        title: Maturity, Differentiation, and IP
        blocks:
          - type: paragraph
            body: >-
              Technically, Stipple is early. The Pointillist Platform and STP-100 were disclosed only in April 2026,
              there is no peer-reviewed publication describing Pointillist itself, no human data exist, and no
              ClinicalTrials.gov study is registered. Maturity therefore rests on inference from the founders' published
              science rather than on platform-specific validation. Differentiation is real but narrow: the claimed edge
              is epitope-level selectivity at the discovery front-end, which — if it holds up — lets Stipple pursue
              targets that incumbents cannot exploit safely. That is a data/know-how moat more than a chemistry moat,
              since the conjugation chemistry is licensed from Lonza and therefore in principle available to others.
              Intellectual property around the platform and specific epitopes is presumably the core defensible asset,
              but no patents are publicly detailed, and the broader ADC IP environment is contested (a 2025 Federal
              Circuit ruling invalidated a foundational linker patent). The most credible near-term technical proof
              points would be a peer-reviewed Pointillist dataset, pre-clinical tumor-versus-normal selectivity data for
              STP-100, and a disclosed, defensible target — none of which is yet public.
