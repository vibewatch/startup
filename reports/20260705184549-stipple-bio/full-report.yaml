  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Overview
        blocks:
          - type: paragraph
            body: >-
              Stipple's risk profile is that of a single-asset, pre-clinical oncology company: concentrated, binary, and
              front-loaded with scientific uncertainty. Ranked by severity, the top risks are (1) clinical/technical
              failure — oncology programs have only a roughly 5-7% likelihood of approval from Phase 1, and Phase 2 is
              the historical "valley of death"; (2) safety — ADCs carry recognized interstitial lung disease and
              pneumonitis risks that have produced black-box warnings and at least one FDA clinical hold after fatal
              events, and Stipple's whole thesis is an unproven safety claim; (3) target risk — STP-100's target is
              undisclosed and unvalidated, so its druggability and competitive freedom are unknown; (4) IP/legal — ADC
              patents are contested, as shown by the 2025 Federal Circuit invalidation of a foundational linker patent;
              (5) dependency — reliance on Lonza for chemistry/manufacturing and on capital markets for financing; and
              (6) financial — high burn, an undisclosed valuation, and a gap between the announced $100M and the $65.1M
              sold on the Form D. Mitigation maturity is low across the board because no human data exist; residual
              exposure is therefore high, and this is an asset whose value is dominated by low-probability, high-payoff
              binary outcomes.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR040
          - type: table
