  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization
        blocks:
          - type: paragraph
            body: >-
              Stipple has no current revenue. As a pre-clinical drug developer it recognizes no product sales, no
              service revenue, and no recurring income, and none of the usual SaaS-style metrics (ARR, GMV, active
              users) apply. Its revenue model is prospective and two-pronged. The primary path is a wholly-owned
              pipeline: advance STP-100 and follow-on ADCs through the clinic and monetize via product sales,
              out-licensing, or acquisition, mirroring how peers like Firefly Bio realized value through a ~$1B buyout
              while still pre-clinical. A secondary, optional path is platform licensing, in which Stipple could grant
              pharma partners access to Pointillist-discovered epitopes for upfront, milestone, and royalty payments;
              management has said biopharma companies have approached it, though it has signalled a preference for
              wholly-owned assets. Notably, Stipple currently sits on the paying side of a comparable structure: under
              its Lonza license it owes upfront, milestone, and royalty consideration for conjugation technology. Until
              a clinical asset or a signed platform deal exists, revenue quality cannot be assessed and every revenue
              line is recorded as null with a diligence path.
