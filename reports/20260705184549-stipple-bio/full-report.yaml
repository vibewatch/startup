      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The tailwinds behind ADCs are substantial. Clinical validation and label expansion (led by Enhertu, which
              posted roughly $4.4-5 billion in 2025 sales) have made ADCs a core oncology pillar; big-pharma M&A has
              repeatedly paid up for the modality (Pfizer-Seagen at $43B, AbbVie-ImmunoGen at $10.1B, and J&J's ~$1B
              purchase of pre-clinical Firefly Bio); linker and payload chemistry keep improving; and there is genuine
              unmet need on targets that current drugs cannot exploit without unacceptable toxicity, which is precisely
              Stipple's thesis. Offsetting constraints are equally real. The field is crowded, with roughly 2,800 ADC
              candidates in development and 23 approved products, so differentiation is hard. ADCs carry recognized
              safety liabilities, most notably interstitial lung disease and pneumonitis with black-box warnings on
              leading agents, which raises the clinical and regulatory bar. Manufacturing and CMC are complex and
              capital-intensive, reinforcing dependence on partners like Lonza. And demand is not guaranteed to compound
              smoothly: Daiichi Sankyo took an $850 million charge and cut ADC facility investment as it trimmed demand
              forecasts, a caution flag for the whole segment. These countervailing forces are preserved rather than
              netted to a single verdict.
