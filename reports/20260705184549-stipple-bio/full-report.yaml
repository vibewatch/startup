              - CR002
              - CR029
      - number: '7.3'
        title: Operational, Quality, and Safety Risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, ADCs are among the hardest biologics to manufacture, and Stipple has no in-house chemistry,
              manufacturing, and controls (CMC) capability, relying instead on Lonza's GlycoConnect, HydraSpace, and
              toxSYN platforms. That outsourcing mitigates capex but concentrates manufacturing-quality risk in a single
              partner and leaves Stipple without its own GMP track record. The dominant quality risk is safety.
              Class-level data show pneumonitis in roughly 4.4% of ADC recipients (about 2.35% grade 3 or worse) and
              interstitial lung disease around 11.4% for trastuzumab deruxtecan, with fatal cases documented and
              black-box warnings on leading agents; drug- to-antibody ratio consistency, linker stability, and payload
              potency all bear on this profile. Stipple's mitigation is design-level — epitope selectivity and
              GlycoConnect's homogeneous DAR are meant to reduce off-tumor toxicity — but none of this is yet
              demonstrated in vivo. Recalls, outages, and facility risk are not applicable at this stage, but scale-up,
              comparability, and supply reliability will become acute as the program approaches the clinic.
            claimRefs:
              - CR016
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
              - CR042
