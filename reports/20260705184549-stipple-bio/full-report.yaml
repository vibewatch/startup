      - number: '7.2'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory risk begins with the sheer distance to market: STP-100's IND is only guided for early 2027, no
              trial is registered on ClinicalTrials.gov, and any program must satisfy modern FDA expectations, including
              the 2024 clinical-pharmacology guidance for ADCs and the Project Optimus dose-optimization mandate that
              pushes sponsors toward randomized dose-finding rather than maximum-tolerated-dose designs. Safety-driven
              regulatory action is a live precedent: the FDA placed a clinical hold on a Merck-Daiichi ADC after fatal
              lung-toxicity events, illustrating how quickly an ADC program can be halted. Legal and
              intellectual-property risk is equally material. The ADC IP landscape is turbulent — in December 2025 the
              Federal Circuit invalidated Seagen's foundational '039 linker patent for lack of written description and
              enablement — which cuts both ways: it can ease freedom-to-operate but also shows that ADC patents
              (potentially including Stipple's own future IP) are vulnerable. Because Stipple licenses its conjugation
              chemistry from Lonza and targets an undisclosed, possibly IP-encumbered target, its freedom-to-operate
              cannot be verified from public information, and no patent estate for the platform is publicly detailed.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR041
          - type: table
            tableRef: TR002
            claimRefs:
