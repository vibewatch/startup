    Stipple Bio is a Cambridge, Massachusetts precision-oncology company founded in 2022 by academic cancer-biology
    researchers Aaron Ring (Fred Hutch) and Aashish Manglik (UCSF) and led by CEO Jeff Landau. Its Pointillist Platform
