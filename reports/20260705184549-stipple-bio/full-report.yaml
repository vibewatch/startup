  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The Competitive Landscape
        blocks:
          - type: paragraph
            body: >-
              Stipple sits inside one of oncology's most contested arenas. The landscape spans five tiers. Direct peers
              are other next-generation ADC/conjugate platform companies pursuing better therapeutic index, most notably
              Firefly Bio (a degrader-antibody-conjugate platform acquired by Johnson & Johnson for about $1 billion
              upfront in June 2026) and European players such as Tubulis and Adcendo. Incumbents are the commercial ADC
              leaders: Daiichi Sankyo and AstraZeneca (Enhertu, the category's ~$4-5 billion flagship, plus the newly
              approved TROP2 agent Datroway), Gilead (Trodelvy), AbbVie (Elahere via the $10.1B ImmunoGen deal), and
              Pfizer (the $43B Seagen franchise of Adcetris, Padcev, Tivdak, and Tukysa). Adjacent modalities that
              compete for the same treatment slots include immune-checkpoint inhibitors, bispecific antibodies, and
              CAR-T. Substitutes and status-quo care are conventional chemotherapy and targeted small molecules.
              Finally, the most strategically important "competitor" may be internal build: every large ADC incumbent
              operates its own discovery and conjugation platform, and China-based developers are entering rapidly. With
              roughly 2,800 ADC candidates in development and 23 approved products, the field is dense, and Stipple must
              prove that epitope-level selectivity is a durable edge rather than a marginal one.
            claimRefs:
              - CP001
              - CP002
              - CP003
