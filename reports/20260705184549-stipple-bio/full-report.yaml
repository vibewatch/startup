              - CR025
              - CR032
      - number: '7.4'
        title: Partner, Dependency, and Financial Risk
        blocks:
          - type: paragraph
            body: >-
              Dependency risk is concentrated on three counterparties: Lonza (the sole disclosed chemistry and
              manufacturing partner, whose license terms and exclusivity are undisclosed), the investor syndicate
              (Stipple is financing-dependent and must raise again on clinical milestones), and the founders and lean
              executive team (key-person risk, with no publicly named CFO, COO, or CMO). Because Stipple has no
              customers, "customer concentration" manifests as single-asset concentration: STP-100 is the whole
              near-term thesis. Financial and model risk is significant. Burn is undisclosed but implied at roughly
              $30-35M per year, the Series A Form D shows $65.1M sold against a $100M announced round with $35M still to
              be collected, the post-money valuation is undisclosed, and the company is on a multi-year path to any
              revenue with a ~5-7% probability of the lead program reaching approval. Sector-level financial signals are
              also cautionary: Daiichi Sankyo took an $850M charge and cut ADC facility investment as demand forecasts
              fell, and many marketed ADCs already exceed common cost-effectiveness thresholds, foreshadowing eventual
              pricing and reimbursement pressure.
            claimRefs:
              - CR024
              - CR025
              - CR026
              - CR027
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
              - CR043
