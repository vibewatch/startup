      - number: '5.2'
        title: Technology and Operating Architecture
        blocks:
          - type: paragraph
            body: >-
              Stipple's operating model is a pre-clinical ADC value chain layered on top of a proprietary discovery
              front-end. The stack begins with epitope discovery (the Pointillist Platform), rooted in the founders'
              academic methods: Aaron Ring's protein-engineering and systems-immunology work (including the REAP
              antigen-discovery platform) and Aashish Manglik's structural biology of membrane proteins and receptors.
              The next layer is binder generation — antibodies engineered to recognize the selected tumor epitope. The
              third layer is conjugation, where Stipple licenses Lonza's site-specific GlycoConnect technology (which
              uses antibody glycans to attach payloads for a homogeneous drug-to-antibody ratio), the HydraSpace polar
              spacer (for stability and solubility), and the toxSYN linker-payload. The fourth and fifth layers are
              pre-clinical validation (internalization, normal-tissue cross-reactivity, PK, tolerability) and
              CMC/manufacturing, both of which lean heavily on Lonza. The final layer is clinical execution, not yet
              begun. This architecture concentrates Stipple's proprietary value in the discovery and binder-selection
              layers while outsourcing the chemistry and manufacturing that ADC programs most often stumble on.
