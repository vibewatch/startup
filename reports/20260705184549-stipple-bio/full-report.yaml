  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Stipple Bio's relevant market is the antibody-drug conjugate (ADC) segment of oncology therapeutics,
              itself a slice of the broader precision-oncology market for targeted cancer medicines. Included spend is
              revenue from ADC products sold to treat solid and hematologic tumors, plus, more loosely, the
              targeted-therapy budget that epitope-selective ADCs could capture. Adjacent but excluded categories are
              immune-checkpoint inhibitors, CAR-T and cell therapies, bispecific antibodies, small-molecule targeted
              drugs, and molecular diagnostics; these are substitutes or complements rather than the ADC category
              itself. The status-quo alternatives a new ADC must displace are existing approved ADCs such as Enhertu
              (trastuzumab deruxtecan), Trodelvy, and Elahere, conventional cytotoxic chemotherapy, and targeted small
              molecules. Stipple's specific wedge is narrower still: ADCs aimed at tumor-specific epitopes on targets
              that have been clinically validated but limited by on-target/off-tumor toxicity. That framing makes the
              true addressable market a function of how many such toxicity-constrained targets exist and can be
              "unlocked," which is not publicly quantified and is treated here as an evidence-constrained boundary
              rather than a clean TAM.
            claimRefs:
