      - number: '3.4'
        title: Switching Costs, Moat Durability, and Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              In therapeutics, "switching cost" is really clinical evidence and guideline entrenchment: once an ADC is
              standard of care with a mature safety profile, displacing it requires superior randomized data, which
              takes years and hundreds of millions of dollars. That dynamic favors incumbents like Trodelvy and Enhertu
              and works against a pre-clinical entrant. Stipple's potential moat is its platform IP and the quality of
              the epitopes it discovers, reinforced by the Lonza conjugation partnership. But durability is questionable
              on several fronts. First, every major incumbent has an internal ADC platform, so Stipple's discovery edge
              could be replicated or out-resourced. Second, the ADC IP landscape is turbulent: in December 2025 the
              Federal Circuit invalidated Seagen's foundational '039 linker patent for lack of written description and
              enablement, a ruling that both eases freedom-to-operate and signals how contestable ADC patents are.
              Third, adverse segment-level evidence is mounting: Daiichi took an $850M charge and cut ADC facility
              investment as it trimmed demand forecasts. Net, Stipple's moat is a plausible but entirely unproven
              discovery advantage sitting inside a fast-commoditizing, litigation-prone, capital-heavy category.
