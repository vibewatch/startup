  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Stage, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Stipple Bio, Inc. is a privately held biotechnology company headquartered in Cambridge, Massachusetts that
              is building precision-oncology medicines around tumor-specific cell-surface epitopes. The company was
              founded in 2022 by two academic cancer-biology researchers, Dr. Aaron Ring of the Fred Hutchinson Cancer
              Center and Dr. Aashish Manglik of the University of California, San Francisco, on the thesis that
              targeting tumor-specific epitopes (rather than merely tumor-specific gene expression) can widen the
              therapeutic index of cancer drugs and unlock targets previously considered intractable. Its core asset is
              the "Pointillist Platform," a modality-agnostic discovery engine that maps tumor-specific epitopes and
              pairs them with binders designed to avoid on-target/off-tumor toxicity. The lead program, STP-100, is an
              antibody-drug conjugate (ADC) whose molecular target and indication remain undisclosed. Stipple emerged
              from stealth only in April 2026, remains pre-clinical, and reports no revenue, no marketed products, and
              no disclosed customer base. The business model is a classic wholly-owned biotech pipeline play: raise
              venture capital, advance proprietary assets toward the clinic, and monetize through future partnering,
              acquisition, or product sales rather than near-term revenue.
