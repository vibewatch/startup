      - number: '7.5'
        title: Mitigations, Monitoring, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Mitigation maturity is low but not zero. Scientifically, the founders' pedigree and the design-level
              safety rationale (epitope selectivity, homogeneous DAR via GlycoConnect) partially de-risk the thesis, and
              the Lonza partnership de-risks chemistry execution. Capital is adequate to the next milestone. The key
              monitoring indicators an investor should track are: disclosure of the STP-100 target and pre-clinical
              tumor-versus-normal selectivity data; IND acceptance and first-in-human dosing; any FDA safety signal or
              hold; reconciliation of the announced-versus-sold Series A amount; and evidence of freedom-to-operate.
              Thesis-break (kill) triggers include: pre-clinical data showing no meaningful selectivity advantage; an
              IND clinical hold or serious/fatal lung toxicity in early dosing; discovery that the target is already
              IP-blocked or clinically de-risked by a competitor; a failure to raise the Series B on milestone terms; or
              a material change in the Lonza relationship. The diligence asks that would most reduce uncertainty are the
              pre-clinical data package, the target identity under NDA, the Lonza license terms, audited cash and burn,
              and a patent/FTO opinion.
            claimRefs:
              - CR033
              - CR034
              - CR035
              - CR036
              - CR037
              - CR038
              - CR039
              - CR044
          - type: table
