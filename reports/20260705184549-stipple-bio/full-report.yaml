  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What Stipple Delivers
        blocks:
          - type: paragraph
            body: >-
              In customer-workflow terms, Stipple delivers two connected things: a discovery capability and the drug
              candidates that come out of it. The discovery capability is the Pointillist Platform, a modality-agnostic
              system that identifies tumor-specific cell-surface epitopes — the precise sub-regions of an antigen that
              an antibody's paratope or a T-cell receptor binds. The insight is that a target can be expressed on both
              tumor and healthy tissue, but the epitope landscape differs; by finding epitopes that are accessible on
              cancer cells yet hidden or absent on normal cells, Stipple aims to hit validated-but-toxic targets without
              the on-target/off-tumor toxicity that has limited prior drugs. The output for a drug developer (whether
              Stipple itself or a future partner) is a differentiated binder plus a target hypothesis that widens the
              therapeutic index. The lead product of that engine is STP-100, an antibody-drug conjugate whose binder is
              designed to discriminate tumor epitopes and whose payload is delivered via Lonza's conjugation chemistry.
              As of the run date, STP-100 is pre-clinical, with clinical entry guided for early 2027, so the "product"
              is best understood as a platform plus one lead asset rather than a marketed therapy.
            claimRefs:
