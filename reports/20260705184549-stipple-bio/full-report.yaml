      - number: '3.3'
        title: Capability, Pricing, and Positioning
        blocks:
          - type: paragraph
            body: >-
              On capability, Stipple's proposition is narrow but sharp: identify tumor-specific epitopes so an ADC can
              hit a target that incumbents cannot exploit without dose-limiting toxicity. That is a differentiation
              claim on the discovery front-end, whereas the incumbents differentiate on validated payload-linker
              chemistry, breadth of approved indications, and distribution. On pricing, no comparison is yet possible
              for Stipple because it has no product; incumbent ADCs are premium-priced specialty biologics whose costs
              frequently exceed common US cost-effectiveness thresholds, so any Stipple entrant would face the same
              payer scrutiny. On go-to-market and regulatory posture, incumbents hold decisive advantages: approved
              labels, established safety databases, and manufacturing scale, while Stipple depends on a Lonza license
              for conjugation technology and has no clinical or regulatory track record of its own. The positioning map
              that follows places Stipple in the high-differentiation, low-maturity quadrant alongside Firefly and
              Tubulis, distinct from the high-maturity incumbents but exposed to the risk that maturity, not novelty, is
              what wins share and reimbursement.
            claimRefs:
