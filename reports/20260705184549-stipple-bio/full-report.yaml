            body: >-
              Because there is no product, Stipple has no cost of goods sold, no gross margin, and no
              customer-acquisition economics; conventional unit-economics analysis is not yet meaningful. The cost base
              is dominated by research and development — epitope discovery, antibody engineering, payload/linker work,
              and IND-enabling studies — plus general and administrative expense for a lean, largely undisclosed
              headcount. The go-to-market "motion" is effectively a capital-efficiency question: how much cash is
              required to reach the next value-inflection milestone (IND filing and first-in-human data guided for early
