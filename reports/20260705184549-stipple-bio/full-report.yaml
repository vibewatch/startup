      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Stipple's identity is anchored in an unusually credentialed scientific founding team paired with a
              repeat-operator chief executive. Co-founder Aaron Ring is an Associate Professor and Anderson Family Chair
              for Immunotherapy at Fred Hutch, holds an MD/PhD from Stanford, and has previously founded Simcha
              Therapeutics, ALX Oncology, and Seranova Bio, giving him a strong founder-market fit and a track record of
              translating academic immunology into clinical-stage companies. Co-founder Aashish Manglik is an Associate
              Professor at UCSF specializing in G-protein-coupled receptor structural biology, trained under Nobel
              laureate Brian Kobilka, a 2026 Vilcek Prize recipient, and co-founder of Epiodyne. Chief Executive Officer
              Jeff Landau holds an MBA from Stanford Graduate School of Business and was previously a co-founder of
              Sunterra Bio. Governance is investor-heavy: the board pairs the founders and CEO with general partners and
              partners from lead investors a16z (Vineeta Agarwala), RA Capital (Derek DiRocco), and Nextech (Thilo
              Schroeder), plus independent director Owen Hughes and serial biotech founder Gregory Verdine. DiRocco and
              Schroeder joined the board in conjunction with the Series A. Key-person dependence on Ring's science and
              Landau's execution is high, and no COO, CFO, or CMO has been publicly named.
