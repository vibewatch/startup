            claimRefs:
              - CV010
              - CV013
              - CV004
              - CV027
      - number: '8.3'
        title: Financing Context, Entry Discipline, and Price Support
        blocks:
          - type: paragraph
            body: >-
              The financing context is a $100M Series A announced in April 2026, co-led by RA Capital, a16z Bio+Health,
              and Nextech, on top of roughly $21.5M of pre-Series A capital. The corresponding SEC Form D reports a
              $100.2M offering with $65.1M sold and $35.1M still to be collected, which both confirms the round's scale
              and flags that the fully-funded headline is not yet complete. No post-money valuation is disclosed
              anywhere in company or filing sources, and Stipple does not appear on the July 2026 TechCrunch unicorn
              list, so the widely circulated $2.25B valuation is not supported by any authoritative source and is
              treated here as unverified. Because price is unknown, standard entry-discipline tests (multiple of
              invested capital, implied step-up, preference overhang) cannot be run; a prospective investor should
              assume a standard venture liquidation-preference stack (about 1x non-participating) until term-sheet
              detail is available. The honest conclusion is that public evidence does not currently support any specific
              price — it supports the existence of a large, credible round, not a defensible valuation.
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV042
          - type: table
            tableRef: TV003
            claimRefs:
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV025
              - CV030
              - CV037
      - number: '8.4'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis, not a point estimate, is the right lens for a pre-clinical asset. In the bull case, the
              Pointillist Platform validates, STP-100 shows a clean tumor-versus-normal selectivity window, the IND
              proceeds on time, and a pharma partnership or acquisition follows; comparable outcomes range from
              Firefly's ~$1B pre-clinical exit to ImmunoGen's $10.1B commercial-stage acquisition, implying a
              multi-billion-dollar upside if the science and a lead indication mature. In the base case, Stipple reaches
              the clinic with partial validation and raises a Series B at a modest step-up (2026 oncology Series B
              rounds commonly run $150-250M), keeping the option alive without a definitive outcome. In the bear case —
              the statistically most likely single path given a ~5-7% approval rate — pre-clinical or early-clinical
              data disappoint, a safety signal or clinical hold emerges, the target proves de-risked or IP-blocked, or
              the Series B fails, driving value toward residual cash. The wide dispersion between these outcomes, and
              the fact that the bear case carries the highest single-path probability, is the defining feature of the
              valuation.
            claimRefs:
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV043
          - type: table
            tableRef: TV004
            claimRefs:
              - CV026
              - CV036
              - CV037
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV021
              - CV023
              - CV032
      - number: '8.5'
        title: Comparable Set
        blocks:
          - type: paragraph
            body: >-
              Because Stipple has no revenue, comparables are transaction-based rather than multiple-based. The most
              directly relevant comp is Firefly Bio, a pre-clinical conjugate-platform company acquired by J&J for about
              $1 billion upfront in June 2026 — evidence that the market will pay nine figures for a differentiated,
              still-pre-clinical ADC-adjacent platform. Commercial-stage ADC M&A sets the upper bound: AbbVie bought
              ImmunoGen for $10.1B (for the approved Elahere) and Pfizer bought Seagen for $43B (a four-product
              franchise). Antibody-platform partnering comps (BMS-BioNTech at $11.1B, AbbVie-RemeGen at $5.6B) and the
              broader 2026 licensing market (over $250B in 2025, average deal ~$1.3B) show deep strategic demand. On the
              private side, 2026 oncology Series A rounds averaged roughly $75-100M pre-money, so Stipple's $100M raise
              is large-but-consistent for a marquee team. These comps bound the outcome space but do not price Stipple,
              because every high comparable reflects either clinical/commercial de-risking or a disclosed platform
              Stipple has not yet matched.
            claimRefs:
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV044
          - type: table
            tableRef: TV005
            claimRefs:
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
      - number: '8.6'
        title: Exit Readiness and Final Diligence
        blocks:
          - type: paragraph
            body: >-
              Exit readiness favors M&A. ADC and conjugate platforms have been serial acquisition targets (Seagen,
              ImmunoGen, Firefly), and Stipple's wholly-owned, single-asset structure is well-suited to a trade sale if
              STP-100 de-risks; an IPO is possible but would require clinical data and a more built-out pipeline. The
              final diligence asks that would most change the valuation are: the STP-100 target identity and
              pre-clinical selectivity/tox data; the post-money valuation, cap table, and preference stack; audited cash
              and monthly burn; the Lonza license economics and exclusivity; and a freedom-to-operate/patent opinion.
              The thesis-break triggers that would move the recommendation from research-more to avoid are a
              pre-clinical failure to show selectivity advantage, a serious safety signal or clinical hold, discovery
              that the target is IP-blocked or already de-risked by a competitor, or a failed Series B. Conversely, a
              disclosed target with clean selectivity data plus a named pharma partnership would justify upgrading
              toward track or buy. Until those disclosures exist, the disciplined answer is to keep researching.
            claimRefs:
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV045
          - type: table
            tableRef: TV006
            claimRefs:
              - CV035
              - CV018
              - CV015
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more, pending target and price disclosure
            body: >-
              With no disclosed valuation, target, or data, a buy/track call is speculation. Condition participation on
              obtaining the target, selectivity data, valuation, and Lonza terms under NDA.
            calloutType: recommendation
            claimRefs:
              - CV008
              - CV038
          - type: callout
            title: The $2.25B figure is unverified
            body: >-
              Stipple is absent from the July 2026 TechCrunch unicorn list and no source discloses a valuation; the
              circulated $2.25B should not anchor the analysis and would look stretched if real.
            calloutType: risk
            claimRefs:
              - CV016
              - CV013
          - type: callout
            title: Firefly Bio is the anchor comp
            body: >-
              J&J's ~$1B purchase of pre-clinical Firefly Bio shows nine-figure value is achievable pre-data for a
              differentiated conjugate platform — the clearest upside signal for Stipple.
            calloutType: insight
            claimRefs:
              - CV027
              - CV020
