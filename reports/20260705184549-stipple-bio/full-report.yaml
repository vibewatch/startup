        title: Who Pays and Who Uses
        blocks:
          - type: paragraph
            body: >-
              Stipple's customer structure must be described on two horizons because it has no current buyers. Near
              term, the relevant "customers" are capital markets and prospective pharma partners: venture investors fund
              the company, and large pharmaceutical companies are the entities that would license the platform or
              acquire assets, as the broader 2026 deal environment (over $250B of biopharma licensing in 2025, with
              oncology and next-generation antibodies the dominant segment) makes clear. Stipple's CEO has said
              biopharma companies have approached the company to collaborate via the Pointillist Platform, though
              management has signalled a preference for wholly-owned assets. The one concrete commercial relationship
              today inverts the usual direction: under the Lonza license, Stipple is the customer, paying for
              conjugation technology and manufacturing. Long term, once (if) STP-100 is approved, the end-market
              customer chain is the standard oncology structure — oncologists and hospital pharmacies select and
              administer the drug, patients receive it, and payers own the budget and gate reimbursement. No customer
              can be segmented by revenue band, vertical, or geography yet because none exists; the segmentation below
              is therefore of prospective and proxy customers.
