company:
  name: Stipple Bio, Inc.
chapter:
  number: 3
  title: Competitors
  summary: >-
    Stipple competes in a crowded ADC field against entrenched incumbents (Daiichi Sankyo/AstraZeneca's
    Enhertu and Datroway, Gilead's Trodelvy, AbbVie's Elahere, Pfizer/Seagen's franchise) and a small
    set of next-generation platform peers, most directly Firefly Bio, whose degrader-antibody-conjugate
    platform drew a ~$1B J&J acquisition in June 2026. Stipple's differentiation is an epitope-selective
    discovery platform aimed at toxicity-limited targets, but its moat is unproven: it is pre-clinical,
    its target is undisclosed, and large incumbents own approved products, capital, and in-house ADC
    engines.
sections:
  - id: landscape
    title: The Competitive Landscape
    body: >-
      Stipple sits inside one of oncology's most contested arenas. The landscape spans five tiers.
      Direct peers are other next-generation ADC/conjugate platform companies pursuing better
      therapeutic index, most notably Firefly Bio (a degrader-antibody-conjugate platform acquired by
      Johnson & Johnson for about $1 billion upfront in June 2026) and European players such as Tubulis
      and Adcendo. Incumbents are the commercial ADC leaders: Daiichi Sankyo and AstraZeneca (Enhertu,
      the category's ~$4-5 billion flagship, plus the newly approved TROP2 agent Datroway), Gilead
      (Trodelvy), AbbVie (Elahere via the $10.1B ImmunoGen deal), and Pfizer (the $43B Seagen franchise
      of Adcetris, Padcev, Tivdak, and Tukysa). Adjacent modalities that compete for the same treatment
      slots include immune-checkpoint inhibitors, bispecific antibodies, and CAR-T. Substitutes and
      status-quo care are conventional chemotherapy and targeted small molecules. Finally, the most
      strategically important "competitor" may be internal build: every large ADC incumbent operates
      its own discovery and conjugation platform, and China-based developers are entering rapidly. With
      roughly 2,800 ADC candidates in development and 23 approved products, the field is dense, and
      Stipple must prove that epitope-level selectivity is a durable edge rather than a marginal one.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP007, CP036]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: profiles
    title: Competitor Profiles and Scale
    body: >-
      The incumbents dwarf Stipple on every measurable axis. Daiichi Sankyo/AstraZeneca anchor the
      category with Enhertu, whose 2025 sales approached $4.4-5 billion and whose TROP2 follow-on
      Datroway won a first-line metastatic triple-negative breast cancer approval in May 2026 with the
      first statistically significant overall-survival benefit for a TROP2 ADC (median OS 23.7 months
      versus 18.7). Gilead's Trodelvy secured a broad first-line mTNBC approval in June 2026 and had
      treated roughly 75,000 patients by mid-2026, giving it entrenched physician familiarity. AbbVie's
      Elahere (folate-receptor-alpha ovarian cancer) and Pfizer's four-product Seagen franchise round
      out the commercial leaders. Against these, Stipple is a single-asset, pre-clinical company with
      a $100M Series A and one undisclosed-target program, STP-100. Its most comparable peer is Firefly
      Bio, which was also pre-clinical yet commanded a ~$1B acquisition on the strength of a novel
      conjugate platform for KRAS-driven tumors, a useful benchmark for how the market values
      differentiated ADC-adjacent platforms before clinical data. Emerging platform peers (Tubulis,
      Adcendo, Ona Therapeutics, and Merck-Kelun's sacituzumab tirumotecan) show the segment is filling
      quickly with credible science.
    claimRefs: [CP008, CP009, CP010, CP011, CP012, CP013, CP014, CP015, CP037]
    tableRefs: [TP002]
  - id: comparisons
    title: Capability, Pricing, and Positioning
    body: >-
      On capability, Stipple's proposition is narrow but sharp: identify tumor-specific epitopes so an
      ADC can hit a target that incumbents cannot exploit without dose-limiting toxicity. That is a
      differentiation claim on the discovery front-end, whereas the incumbents differentiate on
      validated payload-linker chemistry, breadth of approved indications, and distribution. On pricing,
      no comparison is yet possible for Stipple because it has no product; incumbent ADCs are
      premium-priced specialty biologics whose costs frequently exceed common US cost-effectiveness
      thresholds, so any Stipple entrant would face the same payer scrutiny. On go-to-market and
      regulatory posture, incumbents hold decisive advantages: approved labels, established safety
      databases, and manufacturing scale, while Stipple depends on a Lonza license for conjugation
      technology and has no clinical or regulatory track record of its own. The positioning map that
      follows places Stipple in the high-differentiation, low-maturity quadrant alongside Firefly and
      Tubulis, distinct from the high-maturity incumbents but exposed to the risk that maturity, not
      novelty, is what wins share and reimbursement.
    claimRefs: [CP016, CP017, CP018, CP019, CP020, CP021, CP022, CP038]
    tableRefs: [TP003]
    figureRefs: [FP002]
  - id: moat-and-risk
    title: Switching Costs, Moat Durability, and Adverse Evidence
    body: >-
      In therapeutics, "switching cost" is really clinical evidence and guideline entrenchment: once an
      ADC is standard of care with a mature safety profile, displacing it requires superior randomized
      data, which takes years and hundreds of millions of dollars. That dynamic favors incumbents like
      Trodelvy and Enhertu and works against a pre-clinical entrant. Stipple's potential moat is its
      platform IP and the quality of the epitopes it discovers, reinforced by the Lonza conjugation
      partnership. But durability is questionable on several fronts. First, every major incumbent has an
      internal ADC platform, so Stipple's discovery edge could be replicated or out-resourced. Second,
      the ADC IP landscape is turbulent: in December 2025 the Federal Circuit invalidated Seagen's
      foundational '039 linker patent for lack of written description and enablement, a ruling that both
      eases freedom-to-operate and signals how contestable ADC patents are. Third, adverse
      segment-level evidence is mounting: Daiichi took an $850M charge and cut ADC facility investment
      as it trimmed demand forecasts. Net, Stipple's moat is a plausible but entirely unproven
      discovery advantage sitting inside a fast-commoditizing, litigation-prone, capital-heavy category.
    claimRefs: [CP023, CP024, CP025, CP026, CP027, CP028, CP029, CP030, CP039, CP040]
    tableRefs: [TP004]
    figureRefs: [FP003]
callouts:
  - calloutType: risk
    title: Incumbents own maturity, capital, and in-house platforms
    body: >-
      Stipple's discovery edge must beat well-capitalized incumbents that already have approved ADCs,
      mature safety data, and their own conjugation platforms — a high bar for a pre-clinical single
      asset.
    claimRefs: [CP009, CP026, CP036]
  - calloutType: insight
    title: Firefly Bio is the most relevant valuation comp
    body: >-
      Firefly's ~$1B acquisition while still pre-clinical shows the market will pay for a differentiated
      conjugate platform before data — a bullish read for Stipple if its epitope edge is real.
    claimRefs: [CP012, CP013]
  - calloutType: risk
    title: ADC patents are contestable
    body: >-
      The Federal Circuit's 2025 invalidation of Seagen's core linker patent underscores that ADC IP
      moats can collapse, cutting both ways for Stipple's freedom-to-operate and its own future IP.
    claimRefs: [CP027, CP028]
