  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              Stipple Bio 的相关市场是肿瘤治疗中的抗体偶联药物（ADC）细分，本身属于更广泛精准肿瘤靶向癌症药物市场的一部分。纳入的支出包括用于治疗实体瘤和血液肿瘤的 ADC 产品收入，也较宽松地包括表位选择性
              ADC 可能抢占的靶向治疗预算。相邻但排除的类别包括免疫检查点抑制剂、CAR-T 和细胞疗法、双特异性抗体、小分子靶向药和分子诊断；它们是替代品或互补品，不是 ADC 类别本身。一个新 ADC
              需要替代的现状方案包括已获批 ADC，如 Enhertu（trastuzumab deruxtecan）、Trodelvy、Elahere，传统细胞毒化疗和靶向小分子。Stipple
              的楔子更窄：瞄准那些临床已验证、但受 on-target/off-tumor 毒性限制的靶点，开发针对肿瘤特异性表位的
              ADC。这样的框定让真实可触达市场取决于有多少这类受毒性约束的靶点存在且能被“解锁”；公开资料没有量化，因此这里把它视为受证据约束的边界，而不是干净的 TAM。
