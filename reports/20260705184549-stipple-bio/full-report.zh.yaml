              Investments 参投；公司称资金可支撑到 2029 年。对应的 Form D 于 2026 年 4 月 6 日提交，报告总发行额 $100.2M，但申报时 15 名投资者仅售出 $65.13M，尚余
              $35.07M；这对尽调是实质细节，因为公开的“已完成 $100M”表述高于申报文件显示的已售金额。估值、收入运行率、客户数和员工数等封面指标均未披露；被广泛引用的 $2.25B 独角兽估值缺乏支撑，因为
              Stipple 未出现在 2026 年 7 月 TechCrunch 独角兽名单中，因此这些指标在此记为 null，并附明确尽调路径。
