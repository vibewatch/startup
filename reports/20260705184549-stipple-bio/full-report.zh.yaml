  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局
        blocks:
          - type: paragraph
            body: >-
              Stipple 身处肿瘤学竞争最激烈的战场之一。格局分五层。直接同业是其他追求更好治疗窗的新一代 ADC / 偶联平台公司，最典型的是 Firefly Bio（降解剂-抗体偶联平台，2026 年 6 月被
              Johnson & Johnson 以约 $1 billion 首付款收购）以及 Tubulis、Adcendo 等欧洲玩家。现有巨头是商业化 ADC 龙头：Daiichi Sankyo 与
              AstraZeneca（Enhertu，这一类别约 $4-5 billion 的旗舰产品，加上新获批的 TROP2 药物 Datroway）、Gilead（Trodelvy）、AbbVie（通过 $10.1B
              ImmunoGen 交易获得 Elahere）和 Pfizer（$43B Seagen 资产组合，含
              Adcetris、Padcev、Tivdak、Tukysa）。争夺同一治疗位置的相邻模态包括免疫检查点抑制剂、双特异性抗体和
              CAR-T。替代品和现状治疗是传统化疗和靶向小分子。最后，最具战略重要性的“竞争者”可能是内部自建：每家大型 ADC 现有厂商都运营自己的发现和偶联平台，中国开发者也在快速进入。约 2,800 个 ADC
              候选物在研、23 款产品获批，赛道密度很高；Stipple 必须证明表位级选择性是持久优势，而不是边际改善。
