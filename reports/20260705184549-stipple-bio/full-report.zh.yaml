  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              Stipple 目前没有收入。作为临床前药物开发公司，它不确认产品销售、服务收入或经常性收入，常见 SaaS 指标（ARR、GMV、活跃用户）都不适用。收入模型是前瞻性的，分两条线。主路径是全资持有管线：推动
              STP-100 和后续 ADC 进入临床，并通过产品销售、对外授权或并购变现，类似 Firefly Bio 在临床前就通过约 $1B 收购实现价值。次级、可选路径是平台授权：Stipple 可以向药企伙伴开放
              Pointillist 发现的表位，换取首付款、里程碑和版税；管理层称已有生物医药公司接触合作，但也表示更偏好全资持有资产。值得注意的是，Stipple 目前在类似结构中位于付款方：根据 Lonza
              授权，它需要为偶联技术支付首付款、里程碑和版税。在临床资产或已签署平台交易出现前，收入质量无法评估，每一条收入线都按 null 记录并附尽调路径。
