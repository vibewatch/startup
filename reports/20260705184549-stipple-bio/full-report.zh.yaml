      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >-
              Stipple 的底色，是少见高配的科学创始团队，再配上一位连续创业运营者 CEO。联合创始人 Aaron Ring 是 Fred Hutch 副教授、Anderson Family Chair for
              Immunotherapy，拥有 Stanford MD/PhD，曾创立 Simcha Therapeutics、ALX Oncology 和 Seranova
              Bio；这给了他很强的创始人-市场匹配度，也证明他能把学术免疫学转成临床阶段公司。联合创始人 Aashish Manglik 是 UCSF 副教授，专攻 G-protein-coupled receptor
              结构生物学，师从诺贝尔奖得主 Brian Kobilka，获得 2026 年 Vilcek Prize，也是 Epiodyne 联合创始人。CEO Jeff Landau 拥有 Stanford Graduate
              School of Business MBA，此前为 Sunterra Bio 联合创始人。治理结构偏投资人：董事会包括创始人和 CEO，也包括主要投资方 a16z（Vineeta Agarwala）、RA
              Capital（Derek DiRocco）、Nextech（Thilo Schroeder）的普通合伙人 / 合伙人，另有独立董事 Owen Hughes 和连续生物技术创业者 Gregory
              Verdine。DiRocco 和 Schroeder 在 Series A 同时加入董事会。公司高度依赖 Ring 的科学和 Landau 的执行，且尚未公开任命 COO、CFO 或 CMO。
