      - number: '8.2'
        title: 建议、信心与风险评级
        blocks:
          - type: paragraph
            body: >-
              建议是继续研究。Stipple 科学上有吸引力，投资人也强，但给价格背书所需的具体输入——STP-100 靶点、临床前选择性数据、投后估值和 Lonza 经济条款——全部未披露；现在给出买入 /
              跟踪判断，是猜测而不是分析。鉴于公司仍处于临床前且信息缺口大，任何点估计的可信度都低；风险评级为高：这是一个二元资产，结果分布由低概率、高回报的临床事件主导。潜在投资人应把本轮视为对平台验证的期权，并把参与前提设为在
              NDA 下拿到缺失披露。对现有持有人而言，里程碑路径（IND 和首次人体数据，指引在 2027 年初）才是需要跟踪的价值驱动。估值立场未知，因为没有确认估值；如果流传的 $2.25B
              数字准确，那么对一个单一临床前资产来说会显得偏高到昂贵，但该数字未验证，不应成为分析锚点。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
