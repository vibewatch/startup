      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              ADC 的顺风很强。临床验证和标签扩展（由 Enhertu 领跑，2025 年销售约 $4.4-5 billion）已经让 ADC 成为肿瘤学核心支柱；大型药企并购一再为该模态支付高价（Pfizer-Seagen
              $43B、AbbVie-ImmunoGen $10.1B、J&J 约 $1B 收购临床前 Firefly
              Bio）；连接子和载荷化学持续改进；现有药物无法利用某些靶点而不产生不可接受毒性，这里存在真实未满足需求，也正是 Stipple 的核心论点。抵消因素同样真实。赛道拥挤，约 2,800 个 ADC
              候选物在研、23 款产品获批，差异化很难。ADC 存在已知安全负担，最突出的是领先药物带黑框警告的间质性肺病和肺炎，这抬高了临床和监管门槛。制造和 CMC 复杂且耗资本，强化了对 Lonza
              等伙伴的依赖。需求也不保证平滑复合增长：Daiichi Sankyo 计提 $850 million 费用，并在下调需求预测后削减 ADC
              设施投资，这是整个细分的警示信号。这里保留这些相反力量，而不是净成一个单一结论。
