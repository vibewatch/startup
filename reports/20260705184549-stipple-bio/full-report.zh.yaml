      - number: '7.6'
        title: 附录
        blocks:
          - type: callout
            title: 核心资产的基准成功率只有 ~5-7%
            body: 肿瘤项目从 Phase 1 走到获批的概率仅约 5-7%，而 STP-100 是 Stipple 近期唯一资产——这是最核心、也基本没有缓释的风险。
            calloutType: risk
            claimRefs:
              - CR002
              - CR024
          - type: callout
            title: 临床可能证伪安全性假设
            body: ADC ILD / 肺炎是类别性责任，已有致死先例和 FDA 暂停；Stipple 的选择性主张尚未在体内证明，因此早期安全信号完全可能成为止损触发条件。
            calloutType: risk
            claimRefs:
              - CR017
              - CR018
              - CR037
          - type: callout
            title: 优先做靶点、选择性数据和 FTO 尽调
            body: 压缩 Stipple 不确定性最快的办法，是在 NDA 下取得靶点身份、临床前选择性数据和 FTO 意见。
            calloutType: recommendation
            claimRefs:
