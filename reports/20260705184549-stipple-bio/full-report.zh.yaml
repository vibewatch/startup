      - number: '5.2'
        title: 技术与运营架构
        blocks:
          - type: paragraph
            body: >-
              Stipple 的运营模型是在专有发现前端之上叠加临床前 ADC 价值链。堆栈从表位发现开始（Pointillist Platform），根植于创始人的学术方法：Aaron Ring
              的蛋白工程和系统免疫学工作（包括 REAP 抗原发现平台），以及 Aashish Manglik
              关于膜蛋白和受体的结构生物学。下一层是结合分子生成——工程化抗体，用来识别选定的肿瘤表位。第三层是偶联，Stipple 授权 Lonza 的位点特异性 GlycoConnect
              技术（用抗体糖基连接载荷，形成均一的药物-抗体比）、HydraSpace 极性间隔臂（提升稳定性和溶解度）以及 toxSYN 连接子-载荷。第四和第五层是临床前验证（内吞、正常组织交叉反应性、PK、耐受性）和
              CMC / 制造，两者都高度依赖 Lonza。最后一层是临床执行，尚未开始。该架构把 Stipple 的专有价值集中在发现和结合分子筛选层，同时把 ADC 项目最常跌倒的化学和制造环节外包出去。
