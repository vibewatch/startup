        title: 财务结论与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              财务结论是：今天无法按基本面承销 Stipple，因为基本面尚不存在——没有收入可判断质量，没有利润率路径可建模，也没有单位经济可压力测试。能判断的是资本姿态，而图景喜忧参半。正面看，相对于 2026
              年同阶段基准（肿瘤学领域生物技术 Series A 投前估值平均约 $75-100M），公司资本较充足，投资人阵容强，并把最耗资本的制造步骤外包给 Lonza。谨慎面在于，公告 $100M 与 Form D
              显示已售 $65.13M 之间存在缺口，现金和烧钱未披露，估值未披露，且多年内没有任何收入，令其成为依赖融资的二元资产。核心尽调阻塞点是：取得经审计现金和月度烧钱，对齐 Series A
              公告金额与已售金额，拿到逐项资金用途，并量化 Lonza 经济义务。在这些问题回答前，财务画像只能写成：“足以支持下一个里程碑，但不透明，里程碑之后高度依赖融资。”
