  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Stipple 交付什么
        blocks:
          - type: paragraph
            body: >-
              从客户工作流看，Stipple 交付两件相连的东西：发现能力，以及由此产出的候选药物。发现能力就是 Pointillist
              Platform，一个模态无关系统，用来识别肿瘤特异性细胞表面表位——也就是抗原上被抗体结合位点或 T
              细胞受体结合的精确子区域。核心洞察是，同一靶点可以同时在肿瘤和健康组织表达，但表位图谱不同；只要找到癌细胞可及、正常细胞隐藏或缺失的表位，Stipple 就有机会命中已验证但有毒性的靶点，同时避开限制既往药物的
              on-target/off-tumor 毒性。对药物开发者（无论是 Stipple 自己还是未来伙伴）来说，输出是一种差异化结合分子，加上一个能扩大治疗窗的靶点假设。这个引擎的主导产品是
              STP-100，一款抗体偶联药物；其结合分子被设计用来区分肿瘤表位，载荷则通过 Lonza 的偶联化学递送。截至运行日，STP-100 处于临床前，临床进入指引为 2027
              年初，因此“产品”更应理解为一个平台加一个主导资产，而不是已上市疗法。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE030
