      - number: '5.4'
        title: 信任、安全、质量与合规
        blocks:
          - type: paragraph
            body: >-
              对 ADC 来说，信任和质量主要由安全性和制造控制决定。Stipple 整个论点就是一个安全性论点：表位选择性旨在降低 on-target/off-tumor 毒性，这种类别负担会产生剂量限制效应，并让多款已上市
              ADC 因间质性肺病和肺炎带上黑框警告。化学侧的质量取决于 Lonza 平台：GlycoConnect 的位点特异性偶联旨在产生均一、表征清晰的药物-抗体比，这关系到可重复性、安全性和监管审评。监管质量方面，任何
              STP-100 项目都必须满足 FDA 现代预期，包括 2024 年 ADC 临床药理指南和 Project Optimus 剂量优化倡议；后者推动申办方采用随机剂量探索，而不是最大耐受剂量设计。Stipple
              自身没有 GMP 或临床质量记录，制造控制依赖 Lonza，因此质量保证部分是伙伴尽调问题。核心未解安全问题仍是经验性的：表位选择性是否真的能在体内转化为更干净的正常组织画像，只有临床前和临床数据能回答。
