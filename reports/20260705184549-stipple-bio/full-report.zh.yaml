      - number: '7.3'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，ADC 属于最难生产的生物药之一；Stipple 没有内部化学、生产与控制（CMC）能力，而是依赖 Lonza 的 GlycoConnect、HydraSpace 和 toxSYN
              平台。外包降低资本开支，却把生产质量风险集中到单一合作伙伴身上，也让 Stipple 缺少自己的 GMP 记录。最核心的质量风险是安全性。类别数据表明，约 4.4% 的 ADC 接受者出现肺炎（约 2.35% 为
              3 级或以上），trastuzumab deruxtecan 的间质性肺病约
              11.4%；已有致死病例记录，头部药物也带有黑框警告。药物-抗体比一致性、连接子稳定性和有效载荷效力，都会影响这条风险曲线。Stipple 的缓释手段停留在设计层面——表位选择性和 GlycoConnect
              的均一 DAR 旨在降低脱靶毒性——但这些尚未在体内得到证明。召回、停产和设施风险现阶段不适用；不过项目接近临床后，放大生产、可比性和供应可靠性会迅速变得尖锐。
