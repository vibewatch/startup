companyProfile:
  summary: >-
    Stipple Bio 是一家位于美国马萨诸塞州剑桥的精准肿瘤公司，由学术癌症生物学研究者 Aaron Ring（Fred Hutch）和 Aashish Manglik（UCSF）于 2022 年创立，CEO 为 Jeff
    Landau。它的 Pointillist Platform 识别肿瘤特异性细胞表面表位，用来构建治疗窗更宽的抗体偶联药物；主导项目 STP-100 是一款临床前 ADC，针对一个未披露、受毒性限制的靶点，公司指引 2027
    年初进入临床。公司 2026 年 4 月带着 $100M Series A 走出隐身，目前没有收入、产品或披露估值。
