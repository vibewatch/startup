      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              对临床前资产，正确视角是情景分析，不是点估计。乐观情景下，Pointillist Platform 得到验证，STP-100 显示清晰的肿瘤相对正常组织选择性窗口，IND
              按时推进，并带来药企合作或收购；可比结果从 Firefly ~$1B 的临床前退出，到 ImmunoGen $10.1B
              的商业化阶段收购不等，意味着只要科学和领先适应症成熟，上行空间可达数十亿美元。基准情景下，Stipple 带着部分验证进入临床，并以适度升价完成 Series B（2026 年肿瘤 Series B
              轮次常见规模为 $150-250M），让期权继续存在，但还没有定论。悲观情景——在约 5-7%
              获批率下，统计上最可能的一条单一路径——是临床前或早期临床数据令人失望，出现安全信号或临床暂停，靶点被证明已去风险或被 IP 封锁，或 Series B
              失败，价值回到剩余现金附近。这些结果之间分布极宽，而且悲观情景拥有最高单一路径概率，正是本次估值的定义性特征。
            claimRefs:
