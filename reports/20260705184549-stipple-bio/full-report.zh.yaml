chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段与商业模式
        blocks:
          - type: paragraph
            body: >-
              Stipple Bio, Inc. 是一家总部位于美国马萨诸塞州剑桥的私营生物技术公司，围绕肿瘤特异性细胞表面表位开发精准肿瘤药物。公司 2022 年由两位学术癌症生物学研究者创立：Fred Hutchinson
              Cancer Center 的 Dr. Aaron Ring 和 University of California, San Francisco 的 Dr. Aashish
              Manglik。核心判断是，瞄准肿瘤特异性表位，而不只是肿瘤特异性基因表达，可以扩大癌症药物治疗窗，打开过去被认为难以成药的靶点。核心资产是 “Pointillist
              Platform”：一个模态无关的发现引擎，用来绘制肿瘤特异性表位，并把这些表位与旨在避开 on-target/off-tumor 毒性的结合分子配对。主导项目 STP-100
              是一款抗体偶联药物（ADC），分子靶点和适应症尚未披露。Stipple 直到 2026 年 4
              月才走出隐身，仍处临床前，没有收入、上市产品或披露的客户基础。商业模式是典型全资持有的生物技术管线打法：募集风险资本，推进自有资产进入临床，并通过未来合作、并购或产品销售变现，而不是依赖近期收入。
