      - number: '8.3'
        title: 融资背景、进场纪律与价格支撑
        blocks:
          - type: paragraph
            body: >-
              融资背景是 2026 年 4 月宣布的 $100M Series A，由 RA Capital、a16z Bio+Health 和 Nextech 共同领投，此外还有约 $21.5M 的 Series A
              前资本。对应的 SEC Form D 披露 $100.2M 发行，其中已售 $65.1M，仍有 $35.1M
              待收；它既确认了轮次规模，也提示“全额到位”的头条尚未完成。公司和申报材料都没有披露投后估值，Stipple 也未出现在 2026 年 7 月 TechCrunch 独角兽名单上，因此广泛流传的 $2.25B
              估值没有任何权威来源支持，本文按未验证处理。价格未知，标准进场纪律测试（投入资本倍数、隐含升价、优先权悬垂）无法执行；潜在投资人应在条款清单细节出现前，假设采用标准风险投资清算优先权结构（约 1x
              非参与）。诚实结论是，公开证据目前不支持任何具体价格——它支持的是一轮规模大、可信度高的融资存在，而不是一个可辩护的估值。
            claimRefs:
              - CV014
              - CV015
              - CV016
