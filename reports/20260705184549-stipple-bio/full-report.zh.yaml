      - number: '2.3'
        title: 买方、支付方与采用路径
        blocks:
          - type: paragraph
            body: >-
              临床前平台型生物技术公司有两个时间维度的“买方”。短期内，Stipple 的有效客户是资本提供方和潜在药企授权方：风险投资人给管线供血，大型药企则是最终为已验证 ADC 资产付费的收购方或合作伙伴；ADC
              交易潮和 Stipple 自身与 Lonza 的 CDMO 关系都能说明这一点。长期看，一旦（如果）STP-100
              上市，终端买方结构就是标准肿瘤链条：肿瘤科医生和医院药房选择并给药，患者接受治疗，支付方（商业保险、药品福利管理方以及 Medicare 等政府项目）掌握预算并把关报销。采用触发是一串步骤：FDA 批准、纳入
              NCCN / 临床指南、支付方覆盖决策，以及相对现有 ADC 和化疗证明治疗窗优势。ADC 是高价专科产品，支付方会认真审查增量获益与成本；如果 Stipple
              的差异化安全性（它的核心主张）能熬过临床检验，恰好是支撑高价定位的属性。
