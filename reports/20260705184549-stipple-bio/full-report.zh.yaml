        title: 附录
        blocks:
          - type: callout
            title: 等待披露靶点和价格前，维持继续研究
            body: 没有披露估值、靶点或数据时，买入 / 跟踪判断就是猜测。参与前提应设为在 NDA 下取得靶点、选择性数据、估值和 Lonza 条款。
            calloutType: recommendation
            claimRefs:
              - CV008
              - CV038
          - type: callout
            title: $2.25B 数字未经验证
            body: Stipple 未出现在 2026 年 7 月 TechCrunch 独角兽名单中，也没有任何来源披露估值；流传的 $2.25B 不应锚定分析，若为真也会显得偏高。
            calloutType: risk
            claimRefs:
              - CV016
              - CV013
          - type: callout
            title: Firefly Bio 是核心可比交易
            body: J&J 以 ~$1B 收购临床前 Firefly Bio，说明差异化偶联平台即使还没有数据，也可能在临床前取得九位数价值——这是 Stipple 最清晰的上行信号。
            calloutType: insight
            claimRefs:
              - CV027
