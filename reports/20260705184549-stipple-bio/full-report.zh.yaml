              年生物医药授权超过 $250B，肿瘤和新一代抗体占主导）已经说明这一点。Stipple CEO 称，生物医药公司已接触公司，希望通过 Pointillist Platform
              合作，但管理层表示更偏好全资持有资产。今天唯一具体的商业关系反过来：在 Lonza 授权下，Stipple 是客户，为偶联技术和制造付费。长期看，一旦（如果）STP-100
              获批，终端客户链条就是标准肿瘤结构——肿瘤科医生和医院药房选择并给药，患者接受治疗，支付方掌握预算并把关报销。由于客户尚不存在，无法按收入带、垂直行业或地域分层；下方分层因此针对潜在客户和代理客户。
