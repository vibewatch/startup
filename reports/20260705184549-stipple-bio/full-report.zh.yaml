      - number: '7.4'
        title: 合作伙伴、依赖与财务风险
        blocks:
          - type: paragraph
            body: >-
              依赖风险集中在三类交易对手：Lonza 是唯一披露的化学和生产伙伴，许可条款和独占性未披露；投资人财团决定后续融资，Stipple 还必须靠临床里程碑再融资；创始人和精简高管团队带来关键人风险，公开信息中没有具名
              CFO、COO 或 CMO。Stipple 没有客户，因此“客户集中度”实际体现为单资产集中度：STP-100 就是近期全部论点。财务和模型风险很高。现金消耗未披露，但隐含约 $30-35M / 年；Series
              A Form D 显示在宣布的 $100M 轮次中已售 $65.1M，仍有 $35M 待收；投后估值未披露；公司距离任何收入还有多年，领先项目获批概率约 5-7%。行业层面的财务信号也偏谨慎：Daiichi
              Sankyo 因需求预测下调计提 $850M，并削减 ADC 设施投资；不少已上市 ADC 已经超过常见成本效果阈值，预示未来会面临定价和报销压力。
            claimRefs:
              - CR024
              - CR025
