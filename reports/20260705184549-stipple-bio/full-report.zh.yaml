              的研究——再加上一支精简且大多未披露员工队伍的一般行政开支。商业化“动作”本质上是资本效率问题：需要多少现金才能抵达下一个价值拐点（IND 申报和首次人体数据，指引为 2027 年初）。纸面上，Stipple
              将偶联和制造外包给 Lonza，制造资本开支较轻；但外包把固定资本开支转成可变里程碑和版税义务，而 ADC CMC 出名地复杂且昂贵。今天唯一站得住的“单位”口径是每个里程碑成本：Series A
              明确要支撑公司到 2029 年并穿过多个早期研究，意味着多年、每年数千万美元的烧钱轮廓；但实际数字未披露，应视为估计或缺口，而不是事实。
