              是高价专科生物药，成本经常超过美国常用成本效果阈值，因此任何 Stipple 新进入者都会面对同样的支付方审查。在商业化路径和监管姿态上，现有厂商优势决定性：已获批标签、成熟安全数据库和制造规模；Stipple
              则依赖 Lonza 的偶联技术授权，自身没有临床或监管记录。后面的定位图把 Stipple 与 Firefly、Tubulis
