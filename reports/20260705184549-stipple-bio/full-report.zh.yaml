      - number: '2.2'
        title: 多重口径下的市场规模
        blocks:
          - type: paragraph
            body: >-
              没有一个数字能概括 Stipple 的机会，因此本分析叠加多个口径。最宽一层，全球癌症新发病例 2022 年约 2000 万，预计到 2050 年升至 3500 万附近；美国 2026 年预计约 210
              万新发病例，支撑长期需求。Stipple 最终进入的精准肿瘤市场，2026 年估计约 $128-146 billion，按高个位数到低双位数增速增长，到 2030 年代中期达到 $300-339
              billion。ADC 细分市场 2026 年估计约 $16.7 billion（Grand View）到 $22.6 billion（Fortune Business Insights），预测到
              2033-2034 年达到 $32-68 billion，CAGR 约 11.5-15%；其他追踪机构认为 ADC 销售 2025 年超过 $16 billion、2030 年超过 $46
              billion。这些估计因定义、地域和基准年不同而分歧很大，所以保留为区间，不强行归并为单一数字。对 Stipple 来说，可服务和可获得层急剧收窄：作为单资产临床前公司，它没有收入，任何可获得份额都只是未来一款
              ADC 峰值销售的风险调整后小片段；在 STP-100 靶点和适应症披露前，无法可信测算。
