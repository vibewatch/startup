  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              Stipple 的风险画像就是单资产、临床前肿瘤公司：集中、二元，前端压着科学不确定性。按严重程度排序，最大风险包括：（1）临床 / 技术失败——肿瘤项目从 1 期走到获批的概率仅约 5-7%，2 期
              历来是“死亡谷”；（2）安全性——ADC 存在已知间质性肺病和肺炎风险，已导致黑框警告，且至少一次 FDA 临床暂停发生在致命事件后，而 Stipple
              整个论点是一项未证明的安全性主张；（3）靶点风险——STP-100 靶点未披露、未验证，其可成药性和竞争自由度未知；（4）IP / 法律——ADC 专利存在争议，2025 年 Federal Circuit
              宣告一项基础性连接子专利无效就是例证；（5）依赖——化学 / 制造依赖 Lonza，融资依赖资本市场；（6）财务——烧钱高、估值未披露，且公告 $100M 与 Form D 已售 $65.1M
              之间存在缺口。由于没有人体数据，各项缓释成熟度都低；剩余暴露因此很高，这项资产的价值由低概率、高回报的二元结果主导。
