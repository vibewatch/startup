      - number: '7.5'
        title: 风险缓释、监测与止损标准
        blocks:
          - type: paragraph
            body: >-
              缓释成熟度低，但不是零。科学层面，创始人履历和设计层面的安全逻辑（表位选择性、借助 GlycoConnect 实现均一 DAR）部分降低了论点风险；Lonza
              合作关系降低了化学执行风险。资本足够支撑到下一个里程碑。投资人应跟踪的关键指标包括：披露 STP-100 靶点和临床前肿瘤相对正常组织选择性数据；IND 获受理和首次人体给药；任何 FDA
              安全信号或暂停；宣布金额与已售 Series A 金额之间的核对；以及 FTO 证据。打破论点的止损触发条件包括：临床前数据没有显示有意义的选择性优势；IND 临床暂停，或早期给药出现严重 /
              致死性肺毒性；发现靶点已被 IP 封锁或已被竞争对手完成临床去风险；无法按里程碑条款完成 Series B；或 Lonza 关系发生重大变化。最能降低不确定性的尽调问题，是临床前数据包、NDA
              下的靶点身份、Lonza 许可条款、经审计现金和消耗，以及专利 / FTO 意见。
            claimRefs:
              - CR033
              - CR034
              - CR035
              - CR036
              - CR037
              - CR038
              - CR039
              - CR044
