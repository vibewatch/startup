        title: 转换成本、护城河耐久性与反向证据
        blocks:
          - type: paragraph
            body: >-
              在治疗药物里，“转换成本”本质上是临床证据和指南固化：一款 ADC 一旦成为标准治疗并拥有成熟安全性画像，要替代它就需要更优的随机数据，而这需要多年和数亿美元。这个动态有利于 Trodelvy、Enhertu
              等现有药物，不利于临床前新进入者。Stipple 潜在护城河是其平台 IP 和发现的表位质量，并由 Lonza 偶联合作加强。但耐久性在多方面存疑。第一，每个主要现有厂商都有内部 ADC 平台，因此
              Stipple 的发现优势可能被复刻，或被对手靠资源追平。第二，ADC IP 格局动荡：2025 年 12 月，Federal Circuit 因书面描述和可实施性不足而宣告 Seagen 基础性 '039
              连接子专利无效；该裁决既放宽自由实施空间，也提示 ADC 专利多么容易被挑战。第三，细分层面的负面证据正在增加：Daiichi 因下调需求预测计提 $850M 费用并削减 ADC 设施投资。合计看，Stipple
              的护城河是一个合理但完全未证明的发现优势，身处一个快速商品化、诉讼频发、资本密集的类别。
