            body: >-
              资本充足性是 Stipple 财务画像的关键，在这一点上，即便公司是私营，SEC Form D 申报也提供了硬锚。2022 年种子轮 Form D 报告一项 $12.0M 发行，向 7 名投资者已售
              $11.975M；2024 年 12 月 Form D 报告一项 $15.0M 发行，已售 $9.476M；2026 年 4 月 Series A Form D 报告一项 $100.2M 发行，15 名投资者已售
              $65.13M，尚余 $35.07M。把实际已售金额相加，意味着 Series A 前约融资 $21.5M，迄今所有申报合计已售约 $86.6M，而公开标题是“已完成 $100M”。管理层指引 Series A
              可支撑公司到 2029 年；如果完整 $100M 最终到账，这意味着约三年内平均每年烧钱约 $30-35M；如果可用资金只有已售的
              $65.13M，资金续航测算会明显收紧。现金余额、准确月度烧钱、估值和逐项资金用途均未披露。下一次融资触发点是临床进展：IND 和早期人体数据会支撑 Series B 上台阶，这与 2026 年肿瘤学
              Series B 常见 $150-250M 的环境一致。因此融资依赖度高，且取决于里程碑。
