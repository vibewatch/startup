      - number: '8.5'
        title: 可比样本
        blocks:
          - type: paragraph
            body: >-
              Stipple 没有收入，因此可比样本应看交易，而不是倍数。最直接的可比交易是 Firefly Bio：这家临床前偶联平台公司在 2026 年 6 月被 J&J 以约 $1B
              首付款收购，说明市场会为差异化、仍处临床前的 ADC 邻近平台支付九位数价格。商业化阶段 ADC M&A 给出上限：AbbVie 以 $10.1B 收购 ImmunoGen（对应已获批的
              Elahere），Pfizer 以 $43B 收购 Seagen（四产品组合）。抗体平台合作可比交易（BMS-BioNTech $11.1B、AbbVie-RemeGen $5.6B）以及更广泛的 2026
              年授权市场（2025 年超过 $250B，平均交易 ~$1.3B）显示战略需求很深。私募侧，2026 年肿瘤 Series A 轮次平均临前估值约 $75-100M，因此 Stipple 的 $100M
              融资对明星团队来说规模大但并不违和。这些可比样本圈定了结果空间，却不能给 Stipple 定价，因为每个高位可比背后，要么已有临床 / 商业去风险，要么已有 Stipple 尚未拿出的公开平台证据。
            claimRefs:
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV044
          - type: table
            tableRef: TV005
            claimRefs:
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
      - number: '8.6'
        title: 退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              退出准备度更偏向 M&A。ADC 和偶联平台一直是连续收购目标（Seagen、ImmunoGen、Firefly），如果 STP-100 风险下降，Stipple 全资、单资产结构适合卖给战略买家；IPO
              也可能，但需要临床数据和更完整的管线。最能改变估值的最终尽调问题包括：STP-100 靶点身份和临床前选择性 / 毒性数据；投后估值、股权结构和优先权堆栈；经审计现金和月度消耗；Lonza
              许可经济性和独占性；以及 FTO / 专利意见。会把建议从继续研究推向回避的论点破坏触发条件包括：临床前无法显示选择性优势，严重安全信号或临床暂停，发现靶点被 IP 封锁或已由竞争对手去风险，或 Series B
              失败。反过来，如果披露靶点、拿出干净选择性数据，并获得具名药企合作，就足以把建议上调至跟踪或买入。在这些披露出现前，纪律性答案就是继续研究。
            claimRefs:
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV045
          - type: table
            tableRef: TV006
            claimRefs:
              - CV035
              - CV018
              - CV015
