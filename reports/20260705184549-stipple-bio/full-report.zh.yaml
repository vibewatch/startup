      - number: '5.3'
        title: 成熟度、差异化与 IP
        blocks:
          - type: paragraph
            body: >-
              技术上，Stipple 仍很早。Pointillist Platform 和 STP-100 直到 2026 年 4 月才披露，没有同行评审论文描述 Pointillist 本身，没有人体数据，也没有
              ClinicalTrials.gov 注册研究。因此成熟度主要来自创始人已发表科学的推断，而不是平台特异性验证。差异化真实但很窄：宣称的优势是发现前端的表位级选择性；如果成立，Stipple
              就能追逐现有厂商无法安全利用的靶点。这更像由数据和专有经验构成的护城河，而不是化学护城河，因为偶联化学来自 Lonza
              授权，原则上他人也可获得。围绕平台和具体表位的知识产权应是核心可防御资产，但没有公开披露专利细节，整体 ADC IP 环境也处于争议中（2025 年 Federal Circuit
              裁决宣告一项基础性连接子专利无效）。近期最可信的技术证明点会是同行评审的 Pointillist 数据集、STP-100 的临床前肿瘤-正常选择性数据，以及一个已披露且可防御的靶点——这些目前都没有公开。
