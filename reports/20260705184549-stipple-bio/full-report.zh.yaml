  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Stipple 的投资论点是：一支履历扎实的创始团队，在规模大、资金充足的 ADC /
              精准肿瘤市场里，搭出了真正差异化的发现平台——以表位级靶向打开那些已经验证但毒性受限的癌症靶点；公司背后有顶级投资人财团，Lonza 化学合作关系降低执行风险，现金可支撑到 2029
              年。市场愿意为差异化偶联平台买单，J&J 以 ~$1B 收购临床前 Firefly Bio，以及 2026 年生物制药授权交易创纪录，都能说明。反论点也很直接：这些还没有被证明。Stipple
              是单资产、临床前公司，靶点未披露也未验证；肿瘤项目从 Phase 1 走到获批的概率只有 ~5-7%；ADC 带有类别性安全责任，已触发过 FDA 暂停；ADC IP
              可被挑战；赛道拥挤；甚至头条融资也没有宣传中那么硬（Form D 显示已售 $65.1M，而非宣布的 $100M）。关键是，目前没有经证实的估值可拿来对照，今天无法按价格执行进场纪律。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
