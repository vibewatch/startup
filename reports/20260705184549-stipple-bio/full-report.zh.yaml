      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              监管风险首先来自离上市太远：STP-100 的 IND 时间指引只是 2027 年初，ClinicalTrials.gov 尚未登记任何试验；任何项目还要满足 FDA 的最新要求，包括 2024 年 ADC
              临床药理指导，以及 Project Optimus 对剂量优化的要求，后者把申办方推向随机剂量探索，而不是最高耐受剂量设计。安全事件触发监管动作已有现实先例：Merck-Daiichi 一款 ADC
              发生致死性肺毒性后，FDA 将其临床试验暂停，说明 ADC 项目可能多快被叫停。法律和知识产权风险同样重要。ADC IP 版图动荡——2025 年 12 月，联邦巡回法院因书面描述和可实施性不足，宣告
              Seagen 基础性 '039 连接子专利无效——影响有两面：一方面可能放宽 FTO，另一方面也说明 ADC 专利（可能包括 Stipple 未来自己的 IP）并不稳。Stipple 从 Lonza
              许可偶联化学，靶点未披露且可能受 IP 约束，公开信息无法核实其 FTO；平台的专利资产也没有公开细节。
