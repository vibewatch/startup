        blocks:
          - type: paragraph
            body: >-
              Stipple 至少有三次私募融资，均可由 CIK 0001932776 下的 SEC Form D 申报佐证。2022 年种子轮显示一项 $12.0M 发行，面向 7 名投资者已售 $11.975M（a16z
              Bio+Health、Emerson Collective 和 OMX 被列为种子轮支持方）；2024 年 12 月 Form D 显示一项 $15.0M 发行，已售 $9.476M，意味着 Series A
              前资本约 $21.5M。2026 年 4 月，公司宣布完成 $100M “大幅超额认购” Series A，由 RA Capital、a16z Bio+Health 和 Nextech Invest
