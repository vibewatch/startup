artifact: risks
slug: stipple-bio
runDate: 2026-07-05
company:
  name: Stipple Bio, Inc.
chapter:
  number: 7
  title: Risks
  summary: >-
    Stipple is a binary, pre-clinical oncology bet whose risks are dominated by clinical and scientific
    uncertainty. Oncology assets have only a ~5-7% likelihood of approval from Phase 1, ADCs carry
    class-level safety liabilities (interstitial lung disease and pneumonitis, with black-box warnings
    and at least one FDA clinical hold after fatal lung toxicity), the STP-100 target is undisclosed and
    unvalidated, ADC intellectual property is contestable (the Federal Circuit invalidated a foundational
    ADC linker patent in 2025), and the company depends on a single conjugation/manufacturing partner
    (Lonza) and on continued financing. The highest-severity risks are largely unmitigated because no
    human data yet exist.
sections:
  - id: risk-overview
    title: Severity-Ranked Risk Overview
    body: >-
      Stipple's risk profile is that of a single-asset, pre-clinical oncology company: concentrated,
      binary, and front-loaded with scientific uncertainty. Ranked by severity, the top risks are (1)
      clinical/technical failure — oncology programs have only a roughly 5-7% likelihood of approval from
      Phase 1, and Phase 2 is the historical "valley of death"; (2) safety — ADCs carry recognized
      interstitial lung disease and pneumonitis risks that have produced black-box warnings and at least
      one FDA clinical hold after fatal events, and Stipple's whole thesis is an unproven safety claim;
      (3) target risk — STP-100's target is undisclosed and unvalidated, so its druggability and
      competitive freedom are unknown; (4) IP/legal — ADC patents are contested, as shown by the 2025
      Federal Circuit invalidation of a foundational linker patent; (5) dependency — reliance on Lonza
      for chemistry/manufacturing and on capital markets for financing; and (6) financial — high burn, an
      undisclosed valuation, and a gap between the announced $100M and the $65.1M sold on the Form D.
      Mitigation maturity is low across the board because no human data exist; residual exposure is
      therefore high, and this is an asset whose value is dominated by low-probability, high-payoff
      binary outcomes.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR007, CR040]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: regulatory-legal
    title: Regulatory and Legal Risk
    body: >-
      Regulatory risk begins with the sheer distance to market: STP-100's IND is only guided for early
      2027, no trial is registered on ClinicalTrials.gov, and any program must satisfy modern FDA
      expectations, including the 2024 clinical-pharmacology guidance for ADCs and the Project Optimus
      dose-optimization mandate that pushes sponsors toward randomized dose-finding rather than
      maximum-tolerated-dose designs. Safety-driven regulatory action is a live precedent: the FDA placed
      a clinical hold on a Merck-Daiichi ADC after fatal lung-toxicity events, illustrating how quickly an
      ADC program can be halted. Legal and intellectual-property risk is equally material. The ADC IP
      landscape is turbulent — in December 2025 the Federal Circuit invalidated Seagen's foundational
      '039 linker patent for lack of written description and enablement — which cuts both ways: it can
      ease freedom-to-operate but also shows that ADC patents (potentially including Stipple's own future
      IP) are vulnerable. Because Stipple licenses its conjugation chemistry from Lonza and targets an
      undisclosed, possibly IP-encumbered target, its freedom-to-operate cannot be verified from public
      information, and no patent estate for the platform is publicly detailed.
    claimRefs: [CR008, CR009, CR010, CR011, CR012, CR013, CR014, CR015, CR041]
    tableRefs: [TR002]
    figureRefs: [FR002]
  - id: operational-quality
    title: Operational, Quality, and Safety Risk
    body: >-
      Operationally, ADCs are among the hardest biologics to manufacture, and Stipple has no in-house
      chemistry, manufacturing, and controls (CMC) capability, relying instead on Lonza's GlycoConnect,
      HydraSpace, and toxSYN platforms. That outsourcing mitigates capex but concentrates
      manufacturing-quality risk in a single partner and leaves Stipple without its own GMP track record.
      The dominant quality risk is safety. Class-level data show pneumonitis in roughly 4.4% of ADC
      recipients (about 2.35% grade 3 or worse) and interstitial lung disease around 11.4% for
      trastuzumab deruxtecan, with fatal cases documented and black-box warnings on leading agents; drug-
      to-antibody ratio consistency, linker stability, and payload potency all bear on this profile.
      Stipple's mitigation is design-level — epitope selectivity and GlycoConnect's homogeneous DAR are
      meant to reduce off-tumor toxicity — but none of this is yet demonstrated in vivo. Recalls, outages,
      and facility risk are not applicable at this stage, but scale-up, comparability, and supply
      reliability will become acute as the program approaches the clinic.
    claimRefs: [CR016, CR017, CR018, CR019, CR020, CR021, CR022, CR023, CR042]
    tableRefs: [TR003]
    figureRefs: [FR003]
  - id: partner-financial
    title: Partner, Dependency, and Financial Risk
    body: >-
      Dependency risk is concentrated on three counterparties: Lonza (the sole disclosed chemistry and
      manufacturing partner, whose license terms and exclusivity are undisclosed), the investor syndicate
      (Stipple is financing-dependent and must raise again on clinical milestones), and the founders and
      lean executive team (key-person risk, with no publicly named CFO, COO, or CMO). Because Stipple has
      no customers, "customer concentration" manifests as single-asset concentration: STP-100 is the whole
      near-term thesis. Financial and model risk is significant. Burn is undisclosed but implied at roughly
      $30-35M per year, the Series A Form D shows $65.1M sold against a $100M announced round with $35M
      still to be collected, the post-money valuation is undisclosed, and the company is on a multi-year
      path to any revenue with a ~5-7% probability of the lead program reaching approval. Sector-level
      financial signals are also cautionary: Daiichi Sankyo took an $850M charge and cut ADC facility
      investment as demand forecasts fell, and many marketed ADCs already exceed common cost-effectiveness
      thresholds, foreshadowing eventual pricing and reimbursement pressure.
    claimRefs: [CR024, CR025, CR026, CR027, CR028, CR029, CR030, CR031, CR032, CR043]
    tableRefs: [TR004]
  - id: mitigations-kill
    title: Mitigations, Monitoring, and Kill Criteria
    body: >-
      Mitigation maturity is low but not zero. Scientifically, the founders' pedigree and the design-level
      safety rationale (epitope selectivity, homogeneous DAR via GlycoConnect) partially de-risk the
      thesis, and the Lonza partnership de-risks chemistry execution. Capital is adequate to the next
      milestone. The key monitoring indicators an investor should track are: disclosure of the STP-100
      target and pre-clinical tumor-versus-normal selectivity data; IND acceptance and first-in-human
      dosing; any FDA safety signal or hold; reconciliation of the announced-versus-sold Series A amount;
      and evidence of freedom-to-operate. Thesis-break (kill) triggers include: pre-clinical data showing
      no meaningful selectivity advantage; an IND clinical hold or serious/fatal lung toxicity in early
      dosing; discovery that the target is already IP-blocked or clinically de-risked by a competitor; a
      failure to raise the Series B on milestone terms; or a material change in the Lonza relationship.
      The diligence asks that would most reduce uncertainty are the pre-clinical data package, the target
      identity under NDA, the Lonza license terms, audited cash and burn, and a patent/FTO opinion.
    claimRefs: [CR033, CR034, CR035, CR036, CR037, CR038, CR039, CR044]
    tableRefs: [TR005]
callouts:
  - calloutType: risk
    title: A ~5-7% base-rate on the core asset
    body: >-
      Oncology programs have only a roughly 5-7% likelihood of approval from Phase 1, and STP-100 is
      Stipple's single near-term asset — the defining, largely unmitigated risk.
    claimRefs: [CR002, CR024]
  - calloutType: risk
    title: The safety thesis could be falsified in the clinic
    body: >-
      ADC ILD/pneumonitis is a class liability with fatal precedents and FDA holds; Stipple's selectivity
      claim is unproven in vivo, so an early safety signal is a plausible kill trigger.
    claimRefs: [CR017, CR018, CR037]
  - calloutType: recommendation
    title: Prioritize target, selectivity data, and FTO diligence
    body: >-
      The fastest way to compress Stipple's uncertainty is to obtain the target identity, pre-clinical
      selectivity data, and a freedom-to-operate opinion under NDA.
    claimRefs: [CR038, CR014]
