        - 融资金额已公开；剩余现金、烧钱、资金分配和现金跑道未公开
        - 在项目经济性和交付规模得到证明前，资本就可能被消耗
        - 高
        - 按季度将融资所得与现金、资本开支、项目支出、已承诺订单和现金跑道进行核对
        - 信息风险高；已募资金不得视为可用现金
      - - 主权客户与项目集中度
        - 伙伴国家与国防买方
        - AI、无人机及自主系统项目客户
        - 现有资料未量化头部客户占比、已承诺积压订单或框架协议转化
        - 买方延期或框架协议未被调用，都会显著削弱收入转化
        - 若集中度高则为关键风险
        - 要求提供前十大客户收入、积压订单质量、调用记录、取消权及应收账款账龄
        - 在提供经审计的集中度与积压订单明细前维持高风险
    notes: 集中度字段区分已点名的关系与缺失的经济分母；融资额不被当作 收入、积压订单、现金跑道或可用现金。
