              integrating into 硬件 via acquisitions. Direct 欧洲 peers have rapidly scaled 在 parallel, creating intense
              rivalry across 欧洲 procurement 项目s. Stark Defence achieved €3.5B 估值 backed by prominent Silicon Valley
              investors 与 secured matching initial 合同 alongside Helsing 用于 Bundeswehr loitering munitions in Lithuania.
              Quantum Systems reached $8B 估值 backed by aerospace primes 与 财务 institutions, differentiating，含 proven
              o据ational profitability 与 dual-use aerial 平台s. Meanwhile, French startup Harmattan AI emerged as France's
              first 国防 unicorn at $1.4B 估值，含 backing from Dassault Aviation, executing 高-velocity drone 交付 under French
              DGA framework. Across the Atlantic, U.S. prime Anduril Industries dominates scale 与 Silicon Valley 资本
              access, compelling 欧洲 ministries 至 emphasize domestic technological sovereignty.
