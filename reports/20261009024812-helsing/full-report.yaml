              Helsing's financing trajectory accelerated from a €102.5 million Series A in November 2021 to a $1.8
              billion Series E in July 2026. The latest round valued the company at $18 billion, while Clay estimates
              approximately $3.3 billion of disclosed primary funding across five rounds and about 900 employees by
