  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market should be bounded around software-defined military capabilities rather than the
              whole defense budget. Helsing's core evidence spans multimodal battlefield data integration, autonomous
              aerial and maritime systems, ground robotics, and the engineering required to deploy those systems.
              Included spend therefore covers mission software, autonomy, sensors and payload integration, physical
              systems sold with that software, assurance, and field deployment. It excludes conventional platforms that
              do not use Helsing software, generic enterprise IT, civilian robotics, and private-secondary transactions.
              Status-quo substitutes include legacy crewed platforms, incumbent defense-prime systems, manual
              intelligence fusion, and internal government development. This boundary avoids treating every European
              defense appropriation as Helsing-addressable while recognizing that software and hardware are increasingly
              sold as one operational capability.
            claimRefs:
              - CM001
              - CM002
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              No retained source supplies an independent, methodology-disclosed market size for Helsing's exact product
              boundary. The only concrete demand anchor in the pool is third-party reporting that Germany approved an
              initial €269 million HX-2 contract with a framework volume of up to €1.46 billion over seven years. That
              ceiling is neither recognized revenue nor a company-wide SOM: it is one country's potential procurement
              envelope for one product family. Reported fundraising and private valuations show capital-market
              enthusiasm, but Forge describes Helsing market activity as limited and warns that its private-market data
              may rely on very few inputs. Preqin and PM Insights also gate or delay key data. A defensible SAM or SOM
              therefore requires program-level budgets, eligible geographies, unit pricing, production capacity, and
              award probability that are not public in the assigned evidence.
            claimRefs:
              - CM008
              - CM012
              - CM013
              - CM014
