  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Illustrates the structured procurement progression from sovereign defense prototype evaluation through prime
      partner co-bidding to institutionalized defense program upgrades.
    data:
      items:
        - label: Sovereign Alignment & Security Clearance
          value: 1
          detail: >-
            Establish bilateral government relationships and sovereign defense security protocols in target NATO
            nations.
          note: High regulatory barrier; multi-year pre-qualification timeline.
        - label: Frontline & Rapid Operational Prototyping
          value: 2
          detail: Deploy edge-AI sensor processing capabilities in high-urgency combat environments such as Ukraine.
          note: Proves battlefield resilience against real-world electronic jamming.
        - label: Tier-1 Prime Defense Strategic Partnership
          value: 3
          detail: Form joint bidding consortia and technology alliances with established primes like Saab and Airbus.
          note: Solves distribution and airframe hardware integration challenges.
        - label: Major Program Procurement Award
          value: 4
          detail: Win formal government program contracts such as the German Eurofighter EW upgrade and FCAS AI package.
          note: Multi-year production program integration with sticky multi-decade lifecycles.
        - label: Allied Interoperability & Regional Expansion
          value: 5
          detail: Expand operational software footprint across NATO eastern flank allies and cross-domain joint ventures.
          note: Scales customer base while managing sovereign data sovereignty requirements.
        - label: Cross-Domain Joint Ventures & Space Surveillance
          value: 6
          detail: Partner with domain specialists like OHB for space-based AI reconnaissance and targeting networks.
          note: Diversifies mission set beyond airborne and ground sensor processing.
    approximationNotes: >-
      Represents the structural operational model of European defense procurement pathways observed across Helsing's
      announced programs.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU005
      - CU007
      - CU008
      - CU014
