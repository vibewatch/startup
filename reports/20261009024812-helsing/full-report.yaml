      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              The founder team combines three complementary profiles: Torsten Reil brings consumer-technology
              company-building experience, Gundbert Scherf brings German defence and procurement context, and Niklas
              Köhler brings machine-learning product depth. Reil and Scherf are co-CEOs, while Köhler is president and
              chief product officer. That coverage is strategically coherent, yet it also concentrates product,
              customer, and external narrative authority in the founders. Public reporting names Daniel Ek and former
              Airbus CEO Tom Enders as co-chairmen, with Jeannette zu Fürstenberg and Denis Mercier also on the board.
              The disclosed roster does not establish voting rights, reserved matters, investor consent rights, or
              succession depth, so governance diligence must go beyond public titles.
