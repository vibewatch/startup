      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The principal payer is a sovereign government, typically through a defense ministry, procurement agency,
              or funded military program; operators and intelligence teams are the end users, while established defense
              contractors can be integration partners or channel participants. Preqin characterizes the target base as
              governmental agencies and defense contractors across Europe and North America and describes multi-year
              government and defense arrangements. Helsing's own hiring surface shows the practical adoption path:
              deployed engineering, program management, assurance, production quality, export control, procurement,
              logistics support, and field engineering must accompany AI and hardware development. This implies a
              longer, milestone-gated sale than a normal software subscription, with technical acceptance, security and
              export review, industrial readiness, and operator trust preceding scaled deployment.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by higher European military budgets and a shift toward autonomous and software-defined
              systems after Russia's full-scale invasion of Ukraine. The same evidence also counsels against
              extrapolating capital inflows directly into adoption: Rheinmetall's chief executive has warned of a drone
              investment bubble, and reported field performance for HX-2 is disputed. A cited German defense briefing
              said five of fourteen Donbas missions hit their targets, while Helsing attributed outcomes to intense
              electronic warfare and cited successful strikes. Procurement reporting requirements and program caps
              further show that trust, performance, and oversight can constrain conversion from framework potential to
              deliveries. Valuation should therefore be tied to won and executed programs, repeat orders, production
              throughput, and verified field outcomes rather than headline funding rounds or broad defense spending.
            claimRefs:
              - CM007
              - CM009
              - CM010
              - CM011
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Procurement evidence is the sizing anchor
            body: >-
              Treat signed and executed program awards as the bridge from broad defense budgets to company
              addressability; do not use funding or valuation as a TAM proxy.
            calloutType: insight
            claimRefs:
              - CM008
              - CM012
              - CM013
          - type: callout
            title: Framework ceilings may not convert
            body: >-
              Reported performance disputes, oversight conditions, and production demands can reduce the conversion of a
              maximum procurement framework into accepted deliveries.
            calloutType: risk
            claimRefs:
