      - number: '4.2'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              Helsing's operating model appears more capital- and labor-intensive than a pure software company. Sacra
              reports that the company front-loads research and development and sells fixed-price products, while also
              describing a factory with capacity for 1,000 drones per month. Helsing's current job board spans AI,
              avionics, production, quality, procurement, supply chain, finance, field engineering, and warehousing,
              which is consistent with an integrated software, hardware, manufacturing, and deployment cost base. That
              evidence identifies cost drivers but does not quantify them. The retained source set contains no audited
              gross margin, contribution margin, hardware bill of materials, CAC, sales-cycle length, payback,
              utilization, working-capital requirement, capex, or service-delivery burden. Sacra's cited 40-50% target
              margin is a third-party description of management's model, not an observed margin and should not be used
              as an underwriting input without contract-level and audited support.
            claimRefs:
              - CI005
              - CI006
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI011
              - CI014
              - CI016
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The July 2026 Series E provides a large pool of newly raised capital: CNBC, Value Add VC, and Tectonic
              Defense each report a $1.8 billion round at an $18 billion valuation. CNBC relays the company's stated use
              of proceeds as accelerating development and integration of new AI platforms for partner nations. Funding
              raised, however, is not the same as cash available after transaction costs, prior commitments,
              acquisitions, factory investment, or program spending. No retained source provides opening cash, debt,
              restricted cash, monthly burn, committed capex, working-capital needs, runway, or a next-round trigger.
              The official hiring footprint and reported factory scale indicate continued investment, but cannot
              quantify its pace. Capital adequacy therefore remains indeterminate despite the round; management should
              reconcile gross proceeds to current unrestricted cash and a monthly, program-level uses-of-funds plan.
            claimRefs:
              - CI006
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Financial underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              The evidence supports commercial traction and multiple monetization mechanisms, but not revenue quality or
              a margin path. EquityZen advertises access to Helsing revenue, financials, and cap-table data only after
              investor onboarding, while Value Add VC says a comparable 2025-2026 revenue figure is not publicly
              disclosed. Tectonic Defense provides the adverse signal: even before the latest round, it noted questions
              about whether Helsing could generate enough revenue to justify its valuation. The core diligence blocker
              is therefore not whether Helsing can raise capital or win announced awards; it is whether awards convert
              into recognized, collectible revenue with acceptable hardware, integration, support, and financing costs.
              Until audited financials, contract schedules, backlog conversion, customer concentration, gross margin by
              stream, cash burn, and debt obligations are available, the financial case should be underwritten as
              capital-backed execution optionality rather than demonstrated scalable economics.
            claimRefs:
              - CI011
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing is not runway
            body: >-
              The $1.8 billion Series E establishes gross financing raised, but public evidence does not reconcile it to
              unrestricted cash, burn, committed program spend, debt, or runway.
            calloutType: risk
            claimRefs:
              - CI009
              - CI010
              - CI011
          - type: callout
            title: Require a contract-to-cash bridge
            body: >-
              Obtain audited financials and a schedule connecting signed contract value, funded backlog, milestones,
              deliveries, recognized revenue, collections, gross profit, and cash consumption.
            calloutType: recommendation
            claimRefs:
              - CI007
              - CI008
              - CI011
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and User Workflow
        blocks:
          - type: paragraph
            body: >-
              The clearest current product disclosure in the assigned evidence is CA-1 Europa, which Helsing describes
              as a three-to-five-ton autonomous combat aircraft under development with Grob Aircraft. The aircraft is
              positioned for autonomous operation in contested environments and as a host for three named software
              components: Centaur for autonomous combat, Cirra for electronic warfare, and Symphony for mission
              operations. This is a coherent aircraft-plus-software proposition, but it remains a company-authored
              design description rather than proof of fielded capability. The page does not disclose test milestones,
              customers, certification state, reliability, unit economics, or delivery dates. Consequently, the product
              matrix below treats "under development" as the only verified maturity label for CA-1 and does not infer
              deployment status for the software components.
