            body: >-
              Recruiting materials describe a delivery lifecycle that spans requirements, architecture, integration,
              verification, validation, customer demonstrations, acceptance evidence, and release. Separate roles call
              for hands-on mechatronic integration, a new quality management system for the Martinsburg factory, PFMEA
              and control plans, CAPA, MES traceability, supplier qualification, and support for AS9100 implementation
              and audits. A technical-documentation role calls for operating manuals, maintenance guides, parts
              catalogues, and familiarity with S1000D, S2000M, and S3000L. This suggests Helsing is building the
              disciplines required to deliver and sustain regulated physical systems. It does not prove those controls
              are complete, that AS9100 certification has been achieved, or that any specific platform has passed
