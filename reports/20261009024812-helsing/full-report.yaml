chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Helsing is a private German defence technology company headquartered in Munich. Founded in March 2021 by
              Torsten Reil, Gundbert Scherf, and Niklas Köhler, it has expanded from an AI-software origin into a
              hardware-and-software platform spanning autonomous systems in air, land, sea, and electronic warfare. This
              makes the business model more capital-intensive than a pure software vendor: proprietary platforms,
              manufacturing capacity, and integration work sit alongside the AI layer. The company explicitly frames its
              mission around protecting democratic societies and says ethics should be embedded in defence-technology
              development. That posture is company-issued rather than independent proof of operating controls, but it is
              central to Helsing's identity, hiring message, and sovereign-European positioning.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO016
          - type: table
            tableRef: TO001
            claimRefs:
