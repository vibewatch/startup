      - number: '5.4'
        title: Differentiation and Technical Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              The potential differentiation is the combination of autonomy software, resilient distributed-system
              techniques, aircraft integration, and an emerging manufacturing and support discipline inside one company.
              Public artifacts also show practical developer activity rather than only high-level marketing. However,
              every retained source is either issued by Helsing or republishes Helsing-authored recruiting copy; none is
              an independent benchmark, customer acceptance record, regulator filing, incident report, or certification
              record. The fetched corporate homepage itself exposed only a careers message and no detailed product,
              trust, status, or certification material. The central underwriting risk is therefore evidence asymmetry:
              the architecture is legible, but operational performance, safety cases, security controls, autonomy
              governance, supply-chain qualification, and production yield remain unverified.
            claimRefs:
              - CE013
              - CE014
              - CE015
