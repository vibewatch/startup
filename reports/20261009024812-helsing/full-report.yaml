        title: Software and System Architecture
        blocks:
          - type: paragraph
            body: >-
              Helsing's engineering blog supplies useful architectural signals without establishing the configuration of
              a deployed weapon system. It describes Node Computing as an architectural foundation for distributed
              systems operating over unreliable networks, DSON as a delta-state CRDT for high-latency peer-to-peer
              communication, Twurst as a Rust implementation that supports Twirp and gRPC-style integration over
              constrained brownfield networks, and Sguaba as a strongly typed approach to coordinate transforms.
              Together these artifacts indicate attention to disconnected operation, interface compatibility, state
              convergence, and geometric type safety. A physical-products job posting adds MBSE, SysML, interface
              control, SWaP-C trade-offs, and lab and field integration to the operating model. These are credible
              design-process signals, but the sources do not map each tool to CA-1 or disclose production topology,
              compute hardware, model governance, or cyber accreditation.
