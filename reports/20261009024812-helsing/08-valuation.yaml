callouts:
  - calloutType: recommendation
    title: Valuation Stance and Monitoring Triggers
    body: >-
      At an $18B valuation and 35.9x recorded revenue, Helsing commands a premium pricing model that requires
      rapid conversion of sovereign framework agreements into high-margin recurring cash flows. Investors
      should maintain a research-more stance until verifiable disclosures on gross margin, contract backlog,
      and electronic warfare countermeasures in contested airspace are obtained [CV001, CV007, CV008, CV010, CV011].
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV010
      - CV011

