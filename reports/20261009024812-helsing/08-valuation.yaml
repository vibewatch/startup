company:
  name: Helsing

chapter:
  number: 8
  title: Valuation
  summary: >-
    Helsing's July 2026 Series E round raised $1.8B at an $18B post-money valuation led by Dragoneer and
    Lightspeed, bringing lifetime primary capital to approximately $3.3B–$3.43B across nine rounds.
    The financing represents a 50% step-up over its €12B (~$14B) Series D valuation from June 2025 and
    implies a 35.9x multiple on recorded revenue of $502M. Triangulated against private peers such as
    Anduril ($61B valuation) and Shield AI ($13B valuation), Helsing's valuation stance is stretched,
    warranting a research-more recommendation at medium confidence and high risk rating due to unverified
    operating margins, customer revenue concentration across NATO primes, and battlefield electronic
    warfare vulnerabilities reported in Ukraine.

sections:
  - id: investment-thesis-recommendation
    title: Investment thesis, anti-thesis, and recommendation summary
    body: >-
      Helsing's capital expansion to an $18B post-money valuation via its July 2026 Series E represents
      one of the largest private defense technology fundraises in European history. The investment thesis
      rests on European defense sovereignty mandates, structural growth in NATO defense expenditure toward
      3.5% of GDP, and Helsing's proven multi-domain platform capabilities spanning Altra battlefield
      sensor-fusion software, the HX-2 loitering munition, Keybotic autonomous ground robotics, and Lura
      underwater surveillance systems [CV001, CV003, CV004]. Total capital raised reached $3.3B–$3.43B
      across multiple priced rounds, backed by institutional investors including Prima Materia, General
      Catalyst, Accel, Lightspeed, Dragoneer, Goldman Sachs Alternatives, and CPP Investments [CV002,
      CV005, CV006]. Conversely, the anti-thesis reflects extreme entry multiples, lack of audited gross
      margin disclosures, heavy dependency on sovereign budget approval cycles, and operational attrition
      under intense Russian electronic warfare in Ukraine where five out of 14 HX-2 missions reached
      targets in early 2026 [CV007, CV008, CV010]. Weighing these factors, our investment stance is
      research-more at medium confidence with a high risk rating [CV011]. Table TV001 summarizes the
      core recommendation dimensions, Table TV002 evaluates the thesis and anti-thesis pillars, and Figure
      FV001 traces the decision logic across defense capability, revenue scale, operational risk, and
      valuation.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
      - CV011
    tableRefs:
      - TV001
      - TV002
    figureRefs:
      - FV001

  - id: financing-history-valuation-context
    title: Current financing, valuation multiples, and dilution context
    body: >-
      The July 13, 2026 Series E round injected $1.8B of primary capital into Helsing, setting the post-money
      benchmark at $18B [CV001, CV002]. Investor demand significantly exceeded available allocation,
      reflecting intense institutional interest in software-defined defense capabilities, while European
      ownership remained dominant at approximately 80% to preserve sovereign contracting eligibility
      [CV004, CV006, CV013]. Recorded revenue of $502M as of July 2026 indicates rapid commercial scaling
      from $10M in September 2023, yet translates to a rich 35.9x revenue multiple [CV008, CV009]. While
      this represents multiple compression from 195.5x at Series B, it prices in sustained hyper-growth
      and flawless execution across large multi-year frameworks, such as the German Bundestag's €269M
      HX-2 contract with potential expansion up to €1.46B over seven years [CV004, CV008, CV012].
      Preference overhang remains unverified due to undisclosed private liquidation preferences and
      anti-dilution structures across five major institutional rounds [CV002, CV005, CV006]. Table TV003
      details the bull, base, and bear scenarios evaluating these valuation dynamics.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV006
      - CV008
      - CV009
      - CV012
      - CV013
    tableRefs:
      - TV003

  - id: comparable-set-exit-readiness
    title: Comparable company benchmark and exit horizon analysis
    body: >-
      Helsing's 35.9x revenue multiple places it between mature public defense contractors and high-growth
      defense tech unicorns [CV008]. In the private market, US peer Anduril Industries secured a $61B
      valuation in May 2026 after generating an estimated $2.1B in 2025 revenue, while Shield AI was valued
      at $13B on $300M revenue (42.3x multiple) and Quantum Systems reached an $8B valuation on $330M
      revenue (24.2x multiple) [CV004, CV008]. By comparison, legacy primes such as Curtiss-Wright ($19B
      valuation, $3.5B revenue, 5.2x multiple) and Czechoslovak Group ($15B valuation, $7.6B revenue, 2.3x
      multiple) trade at low single-digit multiples reflecting lower growth and capital-intensive manufacturing
      profiles [CV008]. Helsing's exit pathways for the 2027–2029 window center on an eventual public listing
      on European or dual US-European exchanges, or strategic consolidation with European primes such as
      Saab AB, which participated as an industrial shareholder in earlier funding rounds [CV002, CV005].
      However, exit readiness is constrained by dual-use export control regimes, defense procurement audit
      cycles, and the necessity to demonstrate uncompromised electronic warfare resistance in active combat
      theaters [CV007, CV010].
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV007
      - CV008
      - CV010

tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Strategic and Investment Implication
    rows:
      - - Recommendation
        - research-more
        - Require audited commercial margins and electronic warfare resilience proof before capital commitment
      - - Confidence
        - medium
        - High confidence in financing scale and tier-one syndicate; medium on operating unit economics and backlog conversion
      - - Risk rating
        - high
        - Sovereign procurement concentration, combat attrition in contested EW environments, and multi-domain hardware integration
      - - Valuation stance
        - stretched
        - Multiple of 35.9x recorded revenue ($502M) leaves minimal margin of safety against execution or budget delays
      - - Decision implication
        - monitor-diligence
        - Track commercial framework deliveries, NATO budget appropriations, and next-round capital structure terms
    notes: >-
      Recommendation dimensions synthesised from disclosed financing records and public defense procurement data;
      operating margins, cash burn rate, and contract backlog remain confidential under private ownership.
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV010
      - CV011

  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Dimension
      - Investment Thesis Pillar
      - Anti-Thesis Counterargument
      - Diligence and Verification Path
    rows:
      - - Sovereign Defense AI
        - European strategic autonomy imperative drives procurement preference for homegrown software platforms
        - Geopolitical pressure could ease or US primes could offer subsidized integrated alternatives
        - Track European Defence Fund awards and national procurement quotas for domestic suppliers
      - - Revenue Trajectory
        - Recorded revenue scaled from $10M in Sep 2023 to $502M in Jul 2026 across multi-domain contracts
        - Rapid hardware ramp (HX-2, Keybotic, Lura) dilutes high software gross margins into lower industrial margins
        - Obtain audited revenue breakdown between Altra software licensing and hardware manufacturing
      - - Combat Effectiveness
        - Live deployment in Ukraine validates autonomous capability in GPS-denied environments
        - Politico reported only 5 of 14 Donbas missions hit targets due to Russian electronic warfare
        - Request verified battlefield telemetry and electronic counter-countermeasure upgrade data
      - - Capitalization & Governance
        - Backed by $3.3B+ in capital from Prima Materia, Dragoneer, Lightspeed, and institutional sovereign funds
        - Predominantly European ownership requirement may limit future global liquidity and mega-syndicate exits
        - Review cap table voting rights, Golden Share provisions, and foreign investment board review thresholds
    notes: >-
      Thesis pillars combine company mission statements and market reports; anti-thesis points reflect combat reporting,
      commercial opacity, and sovereign ownership restrictions.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV007
      - CV008
      - CV010
      - CV013

  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operating Assumptions
      - Implied Valuation & Multiple
      - Key Drivers & Risks
      - Probability Signal
    rows:
      - - Bull Case
        - 2027 revenue reaches $900M+; Bundestag €1.46B ceiling tapped; CA-1 Europa wingman passes flight trials
        - $25B–$30B (28x–33x revenue)
        - Multi-domain software lock-in across NATO allies; successful mitigation of electronic warfare jamming
        - 25%
      - - Base Case
        - 2027 revenue scales to $650M–$750M; steady procurement across Germany, UK, and France; gross margin ~50%
        - $18B–$20B (24x–28x revenue)
        - Solid European defense demand; gradual multi-year framework conversion with balanced budget execution
        - 50%
      - - Bear Case
        - Revenue plateaus at $450M–$500M; procurement delays; ongoing drone attrition under intense electronic warfare
        - $9B–$12B down-round (18x–24x revenue)
        - Defense budget reallocations; customer resistance to premium pricing; failure to demonstrate combat lethality
        - 25%
    notes: >-
      Scenario models are author estimates based on $18B Series E post-money baseline ($502M recorded revenue) and
      budgeted framework trajectories; not company-provided guidance.
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV008
      - CV009
      - CV010
      - CV012

