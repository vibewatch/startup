chapter:
  number: 5
  title: "Product & Technology"
  summary: "Helsing publicly presents CA-1 Europa as an under-development autonomous combat aircraft integrating Centaur, Cirra, and Symphony, while its engineering blog and recruiting materials indicate a broader software, systems-engineering, and industrialization stack. The available evidence is almost entirely company-issued and does not independently verify operational maturity, reliability, security certification, or production readiness."
sections:
  - id: "product-portfolio"
    title: "Product Portfolio and User Workflow"
    body: >-
      The clearest current product disclosure in the assigned evidence is CA-1 Europa, which
      Helsing describes as a three-to-five-ton autonomous combat aircraft under development
      with Grob Aircraft. The aircraft is positioned for autonomous operation in contested
      environments and as a host for three named software components: Centaur for autonomous
      combat, Cirra for electronic warfare, and Symphony for mission operations. This is a
      coherent aircraft-plus-software proposition, but it remains a company-authored design
      description rather than proof of fielded capability. The page does not disclose test
      milestones, customers, certification state, reliability, unit economics, or delivery
      dates. Consequently, the product matrix below treats "under development" as the only
      verified maturity label for CA-1 and does not infer deployment status for the software
      components.
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE015"
    tableRefs:
      - "TE001"
  - id: "software-and-system-architecture"
    title: "Software and System Architecture"
    body: >-
      Helsing's engineering blog supplies useful architectural signals without establishing
      the configuration of a deployed weapon system. It describes Node Computing as an
      architectural foundation for distributed systems operating over unreliable networks,
      DSON as a delta-state CRDT for high-latency peer-to-peer communication, Twurst as a Rust
      implementation that supports Twirp and gRPC-style integration over constrained
      brownfield networks, and Sguaba as a strongly typed approach to coordinate transforms.
      Together these artifacts indicate attention to disconnected operation, interface
      compatibility, state convergence, and geometric type safety. A physical-products job
      posting adds MBSE, SysML, interface control, SWaP-C trade-offs, and lab and field
      integration to the operating model. These are credible design-process signals, but the
      sources do not map each tool to CA-1 or disclose production topology, compute hardware,
      model governance, or cyber accreditation.
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE010"
      - "CE014"
      - "CE015"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "deployment-quality-and-support"
    title: "Deployment, Quality, and Support Model"
    body: >-
      Recruiting materials describe a delivery lifecycle that spans requirements, architecture,
      integration, verification, validation, customer demonstrations, acceptance evidence, and
      release. Separate roles call for hands-on mechatronic integration, a new quality
      management system for the Martinsburg factory, PFMEA and control plans, CAPA, MES
      traceability, supplier qualification, and support for AS9100 implementation and audits.
      A technical-documentation role calls for operating manuals, maintenance guides, parts
      catalogues, and familiarity with S1000D, S2000M, and S3000L. This suggests Helsing is
      building the disciplines required to deliver and sustain regulated physical systems.
      It does not prove those controls are complete, that AS9100 certification has been
      achieved, or that any specific platform has passed customer acceptance.
    claimRefs:
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE016"
    tableRefs:
      - "TE002"
  - id: "differentiation-and-diligence-risks"
    title: "Differentiation and Technical Diligence Risks"
    body: >-
      The potential differentiation is the combination of autonomy software, resilient
      distributed-system techniques, aircraft integration, and an emerging manufacturing and
      support discipline inside one company. Public artifacts also show practical developer
      activity rather than only high-level marketing. However, every retained source is either
      issued by Helsing or republishes Helsing-authored recruiting copy; none is an independent
      benchmark, customer acceptance record, regulator filing, incident report, or certification
      record. The fetched corporate homepage itself exposed only a careers message and no
      detailed product, trust, status, or certification material. The central underwriting risk
      is therefore evidence asymmetry: the architecture is legible, but operational performance,
      safety cases, security controls, autonomy governance, supply-chain qualification, and
      production yield remain unverified.
    claimRefs:
      - "CE013"
      - "CE014"
      - "CE015"
      - "CE016"
