chapter:
  number: 1
  title: Company Overview
  summary: >-
    Helsing is a Munich-headquartered defence technology company founded in 2021 that
    combines defence AI software with autonomous air, land, sea, and electronic-warfare
    systems. Its July 2026 Series E raised $1.8 billion at an $18 billion valuation, but
    audited revenue, customer concentration, detailed ownership, and independently
    reconciled field-performance data remain unavailable.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Helsing is a private German defence technology company headquartered in Munich.
      Founded in March 2021 by Torsten Reil, Gundbert Scherf, and Niklas Köhler, it has
      expanded from an AI-software origin into a hardware-and-software platform spanning
      autonomous systems in air, land, sea, and electronic warfare. This makes the
      business model more capital-intensive than a pure software vendor: proprietary
      platforms, manufacturing capacity, and integration work sit alongside the AI layer.
      The company explicitly frames its mission around protecting democratic societies
      and says ethics should be embedded in defence-technology development. That posture
      is company-issued rather than independent proof of operating controls, but it is
      central to Helsing's identity, hiring message, and sovereign-European positioning.
    claimRefs: [CO001, CO002, CO003, CO016]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      The founder team combines three complementary profiles: Torsten Reil brings
      consumer-technology company-building experience, Gundbert Scherf brings German
      defence and procurement context, and Niklas Köhler brings machine-learning product
      depth. Reil and Scherf are co-CEOs, while Köhler is president and chief product
      officer. That coverage is strategically coherent, yet it also concentrates product,
      customer, and external narrative authority in the founders. Public reporting names
      Daniel Ek and former Airbus CEO Tom Enders as co-chairmen, with Jeannette zu
      Fürstenberg and Denis Mercier also on the board. The disclosed roster does not
      establish voting rights, reserved matters, investor consent rights, or succession
      depth, so governance diligence must go beyond public titles.
    claimRefs: [CO002, CO007, CO008, CO009]
    tableRefs: [TO002, TO003]
  - id: capital-scale-and-milestones
    title: Capital, scale, and milestone quality
    body: >-
      Helsing's financing trajectory accelerated from a €102.5 million Series A in
      November 2021 to a $1.8 billion Series E in July 2026. The latest round valued the
      company at $18 billion, while Clay estimates approximately $3.3 billion of disclosed
      primary funding across five rounds and about 900 employees by mid-2026. These are
      funding and headcount indicators, not substitutes for revenue, backlog, cash, or
      customer concentration. Startuprad.io states that Helsing does not publish revenue,
      and no assigned source supplies audited ARR, gross margin, burn, or customer count.
      Independent reviews also preserve a material operational uncertainty: reported
      frontline HX-2 effectiveness figures have diverged from higher company or controlled
      test results. The valuation therefore rests on demonstrated access to capital and
      public-sector demand signals while core economics and performance reconciliation
      remain diligence items.
    claimRefs: [CO004, CO005, CO006, CO010, CO011, CO012, CO013, CO014, CO015]
    figureRefs: [FO001]
