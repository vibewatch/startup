    title: Capital scale is visible; operating economics are not
    body: >-
      The $18 billion valuation and approximately $3.3 billion funding total should not be
      read as revenue, cash available, or contracted backlog. Audited revenue, ARR, gross
      margin, burn, customer count, and concentration remain unavailable in the assigned
      public evidence, while independent reporting preserves unresolved product-performance
      discrepancies.
    claimRefs: [CO004, CO005, CO014, CO015]
