schemaVersion: "report-v2"
artifact: financials
slug: helsing
runDate: 2026-10-09
company:
  name: Helsing
chapter:
  number: 4
  title: Financials
  summary: Helsing has public evidence of a mixed software, integration, and hardware model, but the latest usable revenue figure is a third-party estimate of $10.4 million for 2023. A $1.8 billion Series E materially increases financing capacity, yet the retained evidence does not disclose cash, burn, runway, gross margin, backlog, or customer concentration, leaving capital adequacy and revenue quality unverified.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing evidence
    body: >-
      Public evidence points to a business-to-government model combining software licensing and integration,
      systems-development contracts, and hardware unit sales. Sacra estimates that Helsing generated $10.4
      million of revenue in 2023, up from $1.3 million in 2022, and attributes the 2023 base primarily to AI
      sensor-fusion software licensing and integration work. Later contract disclosures indicate a broader mix:
      a three-year Saab integration award was described only as a "three-digit million Euro" contract, while a
      Bundeswehr HX-2 award was reported at EUR269 million with a larger framework option. These amounts are
      contract values or frameworks, not recognized revenue, ARR, or realized unit pricing. The available sources
      also do not disclose discounts, milestone acceptance, delivery quantities, revenue-recognition timing, or
      customer-level mix, so no reliable conversion from headline awards to annual revenue can be calculated.
    claimRefs: [CI001, CI002, CI003, CI004, CI007, CI008]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: cost-structure-and-unit-economics
    title: Cost structure and unit economics
    body: >-
      Helsing's operating model appears more capital- and labor-intensive than a pure software company. Sacra
      reports that the company front-loads research and development and sells fixed-price products, while also
      describing a factory with capacity for 1,000 drones per month. Helsing's current job board spans AI,
      avionics, production, quality, procurement, supply chain, finance, field engineering, and warehousing,
      which is consistent with an integrated software, hardware, manufacturing, and deployment cost base. That
      evidence identifies cost drivers but does not quantify them. The retained source set contains no audited
      gross margin, contribution margin, hardware bill of materials, CAC, sales-cycle length, payback, utilization,
      working-capital requirement, capex, or service-delivery burden. Sacra's cited 40-50% target margin is a
      third-party description of management's model, not an observed margin and should not be used as an
      underwriting input without contract-level and audited support.
    claimRefs: [CI005, CI006, CI011, CI012, CI013]
    tableRefs: [TI003]
  - id: capital-adequacy-and-financing-dependency
    title: Capital adequacy and financing dependency
    body: >-
      The July 2026 Series E provides a large pool of newly raised capital: CNBC, Value Add VC, and Tectonic
      Defense each report a $1.8 billion round at an $18 billion valuation. CNBC relays the company's stated use
      of proceeds as accelerating development and integration of new AI platforms for partner nations. Funding
      raised, however, is not the same as cash available after transaction costs, prior commitments, acquisitions,
      factory investment, or program spending. No retained source provides opening cash, debt, restricted cash,
      monthly burn, committed capex, working-capital needs, runway, or a next-round trigger. The official hiring
      footprint and reported factory scale indicate continued investment, but cannot quantify its pace. Capital
      adequacy therefore remains indeterminate despite the round; management should reconcile gross proceeds to
      current unrestricted cash and a monthly, program-level uses-of-funds plan.
    claimRefs: [CI006, CI009, CI010, CI011, CI012]
  - id: underwriting-verdict
    title: Financial underwriting verdict
    body: >-
      The evidence supports commercial traction and multiple monetization mechanisms, but not revenue quality or
      a margin path. EquityZen advertises access to Helsing revenue, financials, and cap-table data only after
      investor onboarding, while Value Add VC says a comparable 2025-2026 revenue figure is not publicly
      disclosed. Tectonic Defense provides the adverse signal: even before the latest round, it noted questions
      about whether Helsing could generate enough revenue to justify its valuation. The core diligence blocker is
      therefore not whether Helsing can raise capital or win announced awards; it is whether awards convert into
      recognized, collectible revenue with acceptable hardware, integration, support, and financing costs. Until
      audited financials, contract schedules, backlog conversion, customer concentration, gross margin by stream,
      cash burn, and debt obligations are available, the financial case should be underwritten as capital-backed
      execution optionality rather than demonstrated scalable economics.
    claimRefs: [CI011, CI014, CI015, CI016]
callouts:
  - calloutType: risk
    title: Financing is not runway
    body: The $1.8 billion Series E establishes gross financing raised, but public evidence does not reconcile it to unrestricted cash, burn, committed program spend, debt, or runway.
    claimRefs: [CI009, CI010, CI011]
  - calloutType: recommendation
    title: Require a contract-to-cash bridge
    body: Obtain audited financials and a schedule connecting signed contract value, funded backlog, milestones, deliveries, recognized revenue, collections, gross profit, and cash consumption.
    claimRefs: [CI007, CI008, CI011]
tables:
  - id: TI001
    title: Revenue streams and quality
    columns:
      - Stream
      - Mechanism
      - Public value or status
      - Revenue quality
      - Diligence ask
    rows:
      - [Software licensing, License AI and sensor-fusion software into military platforms, "Sacra says this was a primary 2023 revenue source", "Potentially recurring, but term and renewal evidence is absent", "Revenue by license, term, renewal, and customer"]
      - [Systems integration, Development and integration milestones for military programs, "Three-year Saab award described as three-digit million euro", "Milestone-based recognition is plausible but undisclosed", "Milestone schedule, acceptance criteria, and recognized revenue"]
      - [Hardware unit sales, Delivery of autonomous systems including HX-2, "EUR269m initial Bundeswehr award reported; quantities and realized unit price unavailable", "Volume can scale, but hardware and warranty costs are unknown", "Units, realized ASP, bill of materials, warranty, and contribution margin"]
      - [Long-term defense programs, Fixed-price development and production contracts, "Sacra describes long-term military contracts; funded backlog not disclosed", "Multi-year visibility is possible but procurement and execution risk remain", "Signed backlog, funded backlog, cancellation rights, and cash milestones"]
    notes: Values are public contract descriptions or third-party characterizations, not recognized revenue; currency, scope, milestone timing, quantities, and realized pricing remain incomplete.
    claimRefs: [CI003, CI004, CI007, CI008, CI011]
  - id: TI002
    title: Pricing and monetization evidence
    columns:
      - Offering or contract
      - Public pricing evidence
      - List versus realized
      - Key uncertainty
      - Source basis
    rows:
      - [Software and integration, "No public rate card or license metric", "Neither list nor realized pricing disclosed", "License duration, seat/platform basis, services mix, and discounts", "Sacra revenue-model description"]
      - [HX-2 initial award, "EUR269m reported contract value", "Aggregate award; not a unit price", "Quantity, option exercise, delivery acceptance, and Helsing share", "Sacra contract summary"]
      - [HX-2 framework option, "Up to EUR1.46bn reported, with legislative constraints", "Ceiling rather than booked revenue", "Funded portion, producer cap, parliamentary approvals, and timing", "Sacra contract summary"]
      - [Saab Cirra-Arexis integration, "Three-digit million euro over three years", "Aggregate program description; realized economics unavailable", "Exact value, workshare, milestones, cost allocation, and margin", "Sacra contract summary"]
    notes: Contract values and framework ceilings are not revenue, ARR, cash, or unit prices; the table preserves source wording and highlights the missing denominators.
    claimRefs: [CI004, CI007, CI008, CI011]
  - id: TI003
    title: Unit economics and capital-adequacy scorecard
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["2023 revenue", "$10.4m Sacra estimate based on German annual accounts", Medium, "Only usable public revenue baseline; stale for 2026 scale", "Audited 2024-2026 revenue by stream and customer"]
      - ["2023 revenue growth", "721.5% year over year from a $1.3m base, per Sacra", Medium, "High growth from a very small denominator can overstate maturity", "Reconcile annual accounts and organic versus acquired growth"]
      - [Gross margin, null, Low, "Determines whether software economics offset hardware and field-delivery costs", "Audited gross margin by software, integration, and hardware stream"]
      - [CAC and payback, null, Low, "Tests sales efficiency in long government procurement cycles", "Fully loaded capture cost, cycle length, win rate, and payback by country"]
      - [Cash burn and runway, null, Low, "Determines financing dependency after the Series E", "Monthly burn, unrestricted cash, committed capex, debt service, and downside runway"]
      - [Backlog conversion and concentration, null, Low, "Tests award quality and dependence on a small number of ministries", "Funded backlog, revenue conversion schedule, top-five share, and cancellation rights"]
    notes: Revenue and growth are third-party estimates, not company-reported current metrics; null means the assigned public evidence did not disclose a supportable value and each row states the required diligence.
    claimRefs: [CI001, CI002, CI011, CI014, CI016]
