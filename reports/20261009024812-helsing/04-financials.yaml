      relatedQuestionRefs: [QI001, QI004, QI005, QI008]
      relatedTableRefs: [TI001, TI003]
    - type: private-evidence-only
      severity: material
      topic: contract-economics
      missingEvidence: Contract-level values, funded backlog, quantities, realized unit prices, milestone timing, acceptance terms, cancellation rights, cost allocation, and collections.
      whyItMatters: Framework ceilings and aggregate award values cannot be converted into recognized revenue, margin, or cash with the available denominators.
      diligencePath: Obtain the top-contract schedule and reconcile award value to funded backlog, deliveries, invoicing, revenue recognition, collections, and gross profit.
      relatedQuestionRefs: [QI002, QI003, QI008]
      relatedTableRefs: [TI001, TI002]
    - type: private-evidence-only
      severity: material
      topic: capital-adequacy
      missingEvidence: Unrestricted cash, debt and project-finance obligations, monthly burn, committed capex, acquisition outlays, working-capital needs, runway, and next-round trigger.
