  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing-gap
      missingEvidence: >-
        Independent market studies with explicit category boundaries, geography,
        period, methodology, and comparable TAM and SAM denominators.
      whyItMatters: >-
        Without comparable denominators, broad defense spending cannot be translated
        into a credible Helsing-addressable market or valuation multiple.
      diligencePath: >-
        Obtain current defense-AI, autonomous-systems, and program-budget datasets,
        reconcile overlaps, and map each category to Helsing's eligible products.
      relatedQuestionRefs:
        - QM002
        - QM010
      relatedTableRefs:
        - TM002
    - type: private-evidence-only
      severity: material
      topic: realizable-som
      missingEvidence: >-
        Contract backlog, unit pricing, funded quantities, delivery schedules,
        production capacity, renewal or follow-on rates, and country-level win probabilities.
      whyItMatters: >-
        These inputs determine whether framework ceilings convert into deliveries,
        revenue, and a realizable share of the bounded market.
      diligencePath: >-
        Review the contract register, order book, bid pipeline, factory capacity plan,
        acceptance milestones, and program-level probability-weighted forecast under NDA.
      relatedQuestionRefs:
        - QM010
      relatedTableRefs:
        - TM002
    - type: conflicting-data
      severity: material
      topic: operational-performance
      missingEvidence: >-
        Independently verified mission-level HX-2 outcomes with denominators,
        mission conditions, failure causes, and acceptance criteria.
      whyItMatters: >-
        Disputed field performance can change procurement timing, framework conversion,
        buyer trust, and the discount applied to addressable demand.
      diligencePath: >-
        Obtain customer acceptance records, test reports, mission logs, and the cited
        German defense briefing, then reconcile them with Helsing's response.
      relatedQuestionRefs:
        - QM006
