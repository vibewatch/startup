evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited revenue, ARR, gross margin, burn, cash balance, contract backlog, and primary-versus-secondary financing
      detail.
    whyItMatters: Funding raised and valuation cannot establish operating scale, cash runway, or economic quality.
    diligencePath: >-
      Request audited financials, monthly management accounts, cash bridge, backlog schedule, and Series E funds-flow
      statement under NDA.
    relatedQuestionRefs:
      - QO005
      - QO006
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Customer count, revenue concentration, contract call-off schedules, renewal terms, and termination rights.
    whyItMatters: >-
      Public partner-nation references do not quantify durable demand or exposure to a small number of procurement
      authorities.
    diligencePath: >-
      Obtain customer-level revenue and backlog cohorts, signed contracts, call-off history, and top-customer
      concentration under NDA.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Complete executive roster, board observer list, post-Series E capitalization table, voting rights, preferences,
      and founder succession plan.
    whyItMatters: Public titles and investor names do not establish control, economic ownership, or resilience to founder departure.
    diligencePath: >-
      Request the organization chart, board minutes, shareholder register, articles, investment agreements, and
      key-person succession plan.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO005
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: product-performance
    missingEvidence: >-
      Independently reconciled HX-2 mission-level results using consistent denominators, environments, and
      test-versus-combat definitions.
    whyItMatters: >-
      Reported frontline and controlled-test effectiveness figures are not directly comparable and affect procurement
      conversion and product credibility.
    diligencePath: >-
      Commission an independent technical review of anonymized mission logs, failure modes, test protocols, and customer
      acceptance records.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      Independent market studies with explicit category boundaries, geography, period, methodology, and comparable TAM
      and SAM denominators.
    whyItMatters: >-
      Without comparable denominators, broad defense spending cannot be translated into a credible Helsing-addressable
      market or valuation multiple.
    diligencePath: >-
      Obtain current defense-AI, autonomous-systems, and program-budget datasets, reconcile overlaps, and map each
      category to Helsing's eligible products.
    relatedQuestionRefs:
      - QM002
      - QM010
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: realizable-som
    missingEvidence: >-
      Contract backlog, unit pricing, funded quantities, delivery schedules, production capacity, renewal or follow-on
      rates, and country-level win probabilities.
    whyItMatters: >-
      These inputs determine whether framework ceilings convert into deliveries, revenue, and a realizable share of the
      bounded market.
    diligencePath: >-
      Review the contract register, order book, bid pipeline, factory capacity plan, acceptance milestones, and
      program-level probability-weighted forecast under NDA.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: operational-performance
    missingEvidence: >-
      Independently verified mission-level HX-2 outcomes with denominators, mission conditions, failure causes, and
      acceptance criteria.
    whyItMatters: >-
      Disputed field performance can change procurement timing, framework conversion, buyer trust, and the discount
      applied to addressable demand.
    diligencePath: >-
      Obtain customer acceptance records, test reports, mission logs, and the cited German defense briefing, then
      reconcile them with Helsing's response.
    relatedQuestionRefs:
      - QM006
  - type: missing-source
    severity: material
    topic: financial-competitor-margins
    missingEvidence: >-
      Audited financial disclosure comparing Helsing's gross margins, ARR, and net income against Quantum Systems'
      stated profitability.
    whyItMatters: >-
      Without verified margin and cash flow comparisons, it is impossible to validate whether Helsing's $18B software
      valuation premium over Quantum Systems ($8B) and Stark Defence (€3.5B) is supported by superior unit economics.
    diligencePath: >-
      Obtain non-disclosure access to audited commercial financials or await German corporate register filings for
      Helsing GmbH.
