chapter:
  number: 6
  title: Customers
  summary: >-
    ArsenalBio is pre-commercial, so its current “customers” are best understood as a four-party system: eligible patients, specialist cancer centers, investigator teams, and future payers or pharma partners. The strongest present adoption proof is institutional trial participation rather than paid product usage. ClinicalTrials.gov shows broad participation by major U.S. cancer centers across AB-1015, AB-2100, and AB-3028, while ArsenalBio's patient page confirms patient-facing recruitment for AB-3028. The central customer verdict is therefore credible clinical-channel engagement with no public evidence yet of commercial retention, repeat purchasing, or payer-cleared product revenue.
sections:
  - id: customer-segments-and-buying-system
    title: Customer segments and the multi-party buying system
    body: >-
      ArsenalBio does not yet sell into a normal commercial account base. Its current demand system includes patients eligible for difficult solid-tumor trials, academic or specialist cancer centers willing to run complex cell-therapy studies, investigators who judge whether the biology is worth operational effort, and eventual payers or pharma partners that would matter only if the programs move toward broader commercialization. The patient page for AB-3028 makes the beneficiary layer explicit, but ClinicalTrials.gov and the named center rosters show that the actual operational counterparties today are sophisticated oncology institutions rather than community clinics or ordinary prescribing physicians.
      
      This structure matters because clinical cell therapy has an unusually narrow channel. A site must be able to screen heavily pretreated patients, coordinate manufacturing and infusion timing, manage toxicity, and sustain trial operations. That makes major academic centers both “users” and gatekeepers. A future commercial buyer would likely be a specialized hospital program working through payer approval rather than a direct consumer or simple physician office. In short, ArsenalBio's customer base today is best described as a concentrated institutional trial network with future payer and partner overlays.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU008]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory-and-deployment
    title: 'Adoption trajectory: credible institutional participation, minimal public commercial history'
    body: >-
      ArsenalBio's public adoption evidence is meaningful but should not be overstated. The company has three active human studies on ClinicalTrials.gov, and AB-2100 and AB-3028 together involve a wide set of prominent U.S. centers. AB-1015 and AB-2100 are active not recruiting, while AB-3028 is recruiting. That mix supports real clinical participation and program continuity, but it does not prove scaling commercial demand. No reviewed public source disclosed paid orders, contracted commercial centers, payer authorization rates, repeat treatments, or production utilization per site.
      
      The correct adoption read is therefore stage-specific. ArsenalBio has already crossed the threshold from concept to multi-site trial execution, which is stronger than a platform with only preclinical rhetoric. However, it remains pre-launch from a customer-economics standpoint. Trial participation, even by elite centers, is not the same thing as broad commercial deployment. The most informative current funnel stages are site willingness, patient enrollment, and recruiting status—not revenue or retention.
    claimRefs: [CU009, CU010, CU011, CU012, CU013, CU014, CU015, CU016]
    tableRefs: [TU002]
    figureRefs: [FU002]
  - id: named-proof-and-reference-quality
    title: 'Named proof: major cancer-center participation is real, but still mostly trial proof'
    body: >-
      The quality of ArsenalBio's named institutional network is a genuine positive. City of Hope, Memorial Sloan Kettering, MD Anderson, Dana-Farber, UCSF, Fred Hutchinson, Mayo Clinic, NYU Perlmutter, Huntsman, Moffitt, and other major centers appear in one or more ArsenalBio trial rosters. Those institutions are meaningful proof because they have the expertise and reputation to be selective about which investigational cell therapies they operationalize. Their presence suggests that ArsenalBio's programs have been credible enough to earn serious site participation.
      
      At the same time, the evidence must be labeled correctly. The public file does not show that every participating center is a future paying customer, nor that any of them are already generating commercial repeat business for ArsenalBio. This is still reference-quality trial proof rather than closed-account proof. The strongest named-customer conclusion is that ArsenalBio has earned access to a very high-quality institutional bench, not that it has already built a diversified revenue customer base.
    claimRefs: [CU017, CU018, CU019, CU020, CU021, CU022, CU023, CU024, CU025]
    tableRefs: [TU003]
    figureRefs: [FU003]
  - id: durability-expansion-and-concentration
    title: Durability, expansion, and concentration risk
    body: >-
      Traditional customer-retention metrics do not map cleanly to ArsenalBio yet. There is no public NRR, GRR, contract-renewal, or recurring-account cohort because the company is not yet commercially selling an approved therapy. The closest durability proxy is whether sites continue to host programs, whether new programs expand into additional centers, and whether patient-facing recruitment remains active. On that basis, ArsenalBio shows partial durability: three visible human programs and a recruiting newest program imply ongoing institutional engagement, while the older active-not-recruiting studies highlight that customer momentum is not linear.
      
      Concentration risk is high because cell-therapy delivery depends on a small number of specialist sites. Even a seemingly broad roster of eight or nine locations per study is still narrow by commercial-medtech or pharma standards. Future commercialization, if achieved, would likely remain concentrated in top academic centers and payer relationships before broadening. The practical diligence ask is center-by-center: which sites are enrolling, which are merely listed, which would convert to a commercial launch network, and how much manufacturing and reimbursement friction each would tolerate?
    claimRefs: [CU026, CU027, CU028, CU029, CU030, CU031, CU032, CU033, CU034, CU035]
    tableRefs: [TU004, TU005]
    figureRefs: [FU004]
