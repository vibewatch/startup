  topStrengths:
    - 差异化平台叙事围绕 CITE 单位点工程、逻辑门控和延迟 CAR 表达展开，切入的是实体瘤这个高难场景。
    - 三个已进入人体阶段的项目，加上一个临床前延伸项目，让 ArsenalBio 比只停在临床前的合成生物学平台更有产品实感。
    - $325.35M Series C 和 Bristol Myers Squibb 战略合作，为一家私营细胞治疗公司提供了少见的融资厚度和生态背书。
    - 管理层、董事会和科学顾问密度足够高，即便公开证据不完整，公司仍会留在严肃尽调名单上。
  topRisks:
    - 尚无已获批的实体瘤 CAR-T 产品可作为清晰审批参照，监管和临床路径风险仍然高。
    - AB-1015 和 AB-2100 均在研但不再招募，削弱了简单的进展叙事，也抬高了验证时间的不确定性。
    - 公开资料没有披露足够深入的疗效、批次可重复性或可比性证据，制造可行性和临床转化仍缺少验证。
    - 按据报道约 $1.9B 的投后估值看，在公开数据完全支撑之前，投资人可能已经在为罕见成功提前付费。
    - 获批前很可能还需要追加资本；如果证据释放偏慢，未来稀释和融资条款结构都会变成风险。
  unresolvedGaps:
    - AB-2100 和 AB-3028 项目层面的疗效、持久性和生物标志物读数
    - 所有在研试验的入组速度和各中心启动历史
    - CMC、批次放行、可比性和周转时间指标
    - 股权结构表条款、清算优先权和未来融资计划
    - Bristol Myers Squibb 合作的详细经济条款和治理安排
