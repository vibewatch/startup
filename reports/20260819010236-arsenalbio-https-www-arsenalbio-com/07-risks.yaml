company:
  name: Arsenal Biosciences
chapter:
  number: 7
  title: Risks
  summary: 'ArsenalBio''s risk stack is the classic hard case for programmable solid-tumor CAR-T: compelling design logic and substantial funding, but no approved modality precedent in solid tumors, no published mature efficacy package, and meaningful autologous-manufacturing complexity. ClinicalTrials.gov confirms that AB-1015 and AB-2100 are active not recruiting while AB-3028 is the fresh recruiting program, so operational momentum is mixed rather than cleanly accelerating. FDA guidance, IND requirements, and peer outcomes reinforce that the central risks are regulatory, technical, manufacturing, financing, and key-person dependency rather than simple sales execution. The core underwriting stance should therefore be high potential paired with high residual exposure and explicit thesis-break triggers.'
sections:
- id: severity-ranked-core-risks
  title: Severity-ranked risk stack is still led by regulatory and proof risk
  body: ArsenalBio has the kind of risk profile that often looks attractive in narrative form and punishing in real development timelines. The company has visible human-stage programs, a large 2024 Series C, and a differentiated technical story, but those positives sit inside an especially unforgiving modality. FDA guidance and broader cell-therapy frameworks make clear that solid-tumor CAR-T sponsors must simultaneously solve analytical characterization, manufacturing control, clinical design, and safety logic. The absence of any approved solid-tumor CAR-T product on the FDA approved-cellular-and-gene-therapy list matters because it means ArsenalBio is still operating in an unproven approval category rather than iterating inside a well-established commercial blueprint. ClinicalTrials.gov also shows that two of the three visible human programs are active not recruiting, which weakens any claim of smooth portfolio momentum. The best current interpretation is not that ArsenalBio is broken,
    but that it still lives squarely in a high-uncertainty zone where technical quality, regulator-facing discipline, and time-to-proof all dominate the investment case.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
