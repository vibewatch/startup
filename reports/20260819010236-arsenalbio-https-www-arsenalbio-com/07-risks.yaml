- id: mitigations-monitors-and-thesis-breaks
  title: Mitigations help, but explicit monitors and kill criteria are still required
  body: 'The right way to handle ArsenalBio is not to label it universally attractive or universally uninvestable. The right way is to define what evidence must appear before conviction rises, and what events would break the thesis fast. Existing mitigants are real: the company has meaningful capital, multiple programs, a strategic pharma collaboration, Fast Track on AB-2100, and leadership with deep scientific and venture backing. But those mitigants mostly buy time and access rather than solving the underlying question of whether a programmable autologous solid-tumor CAR-T can generate durable human benefit at manufacturable quality. For diligence purposes, the most useful public indicators are recruiting continuity, trial-status movement, disclosed clinical data, financing cadence, and any evidence on manufacturability or comparability. Thesis-break triggers should be concrete: prolonged status stagnation in key programs, weak early efficacy, serious safety or manufacturing issues, or
    a financing need that arrives before the biology has materially de-risked.'
