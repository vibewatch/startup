- id: operational-and-scientific-execution
  title: Operational and scientific execution risk remains unusually high
  body: 'Autologous cell therapy is operationally hard even before one adds CRISPR-style engineering, logic gating, delayed CAR surface expression, and solid-tumor biology. ArsenalBio''s CITE-centered architecture may offer real design advantages, but every added control layer also raises the burden on manufacturing reproducibility and clinical translation. The company has proven enough to launch and maintain three human studies, which is meaningful. Yet public sources still do not disclose lot-release metrics, batch success, process transfer history, or durable efficacy signals. That gap matters because the difference between an interesting platform and an investable therapy company is often determined by whether manufacturing and biology compound in the same direction. The trial status mix amplifies that uncertainty: AB-1015 and AB-2100 remain active not recruiting, while AB-3028 is the newest recruiting program. That pattern suggests execution continuity, but it does not yet prove scalable
    momentum or a clean path to registrational readiness.'
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
