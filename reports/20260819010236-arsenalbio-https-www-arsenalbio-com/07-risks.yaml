- id: dependency-financing-and-people
  title: Dependency, financing, and people risk are real despite strong sponsorship
  body: 'A large financing round and a strong partner-investor set reduce near-term survivability risk, but they do not eliminate dependency risk. The Bristol Myers Squibb collaboration, senior scientific leadership, and blue-chip ecosystem connections improve credibility and optionality, yet they also remind investors that ArsenalBio is still a much smaller company negotiating within a field dominated by better-capitalized incumbents. Public-market readings on peers such as Lyell and Turnstone show how quickly sentiment can collapse when proof remains incomplete. ArsenalBio also does not yet have a broad commercial customer base; its effective present customers are specialist academic centers and enrolled patients inside trials. That means financing, partner patience, and key-person continuity matter more than conventional commercial-sales execution for now. The company is therefore not only exposed to scientific and regulatory outcomes, but also to timing risk: if proof takes longer than
    expected, dilution and strategic leverage can worsen even without a catastrophic technical failure.'
  claimRefs:
