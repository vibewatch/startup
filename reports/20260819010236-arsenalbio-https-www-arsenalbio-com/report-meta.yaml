companyProfile:
  summary: 'ArsenalBio is a private South San Francisco cell-therapy company building programmable autologous CAR-T products for solid tumors. Publicly, the company looks strongest on platform identity, investor quality, and clinical-stage seriousness: it has three visible human programs, a strategic BMS collaboration, and a 2024 Series C filing showing $325.35 million raised. Public proof is much weaker on commercial economics, efficacy depth, and manufacturing detail, so the company still reads as an unusually credible but incomplete clinical-stage platform rather than a de-risked product business.'
  founders:
  - name: E. John Wherry
    role: Co-founder and scientific advisor
    background: Penn immunology leader and prominent T-cell exhaustion researcher closely tied to ArsenalBio's scientific identity.
    claimRefs:
    - CO009
  foundingLocation: South San Francisco, CA
  headquarters: South San Francisco, CA
  productSummary: ArsenalBio develops autologous, programmable CAR-T cell therapies for solid tumors. The visible product set includes AB-1015, AB-2100, AB-3028, and the preclinical AB-7000 program, all tied to a platform narrative built around CITE single-site engineering, multi-antigen logic, and delayed CAR surface expression.
  customerFocus: Current public proof centers on trial patients, specialist academic cancer centers, and future pharma or payer stakeholders rather than on current commercial customers.
  businessModel: Likely monetization paths are eventual product revenue from approved therapies plus strategic collaboration and licensing value from differentiated programs. Public pricing, reimbursement, and collaboration economics are not disclosed.
  stage: Private, clinical-stage, Series C
  fundingStatus: SEC Form D shows a $325.35 million Series C filed on 2024-09-04 with 26 investors; press coverage associated the round with an implied roughly $1.9 billion post-money valuation.
