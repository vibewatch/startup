  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: A filing-based or company-confirmed post-money valuation for the 2024 Series C.
    whyItMatters: Press-reported implied valuation is useful but not definitive for underwriting entry price and dilution.
    diligencePath: Obtain the financing term sheet, updated cap table, or board-approved financing summary.
    relatedQuestionRefs:
      - QO011
      - QO025
