    severity: material
    topic: operating-metrics
    missingEvidence: Revenue, headcount, customer-count, and manufacturing-throughput disclosures.
    whyItMatters: Without these numbers the company cannot be benchmarked on commercial scale or operating leverage.
    diligencePath: Request management KPI pack and monthly operating dashboard.
