  topStrengths:
    - >-
      Differentiated platform narrative built around CITE single-site engineering, logic gating, and delayed CAR
      expression in a hard solid-tumor setting.
    - >-
      Three visible human-stage programs plus a preclinical extension give ArsenalBio more concrete product reality than
      a preclinical-only synthetic-biology platform.
    - >-
      A $325.35M Series C and a strategic BMS collaboration provide unusual financing and ecosystem credibility for a
      private cell-therapy company.
    - >-
      Leadership, board, and scientific-advisor density are strong enough to keep the company on serious diligence lists
      even with incomplete public proof.
  topRisks:
    - >-
      No approved solid-tumor CAR-T product exists as a clean approval analogue, so regulatory and clinical path risk
      remain high.
    - >-
      AB-1015 and AB-2100 are active not recruiting, which weakens any simple momentum narrative and increases
      time-to-proof uncertainty.
    - >-
      Public sources do not disclose meaningful efficacy depth, batch reproducibility, or comparability evidence, so
      manufacturability and translation remain under-proven.
    - >-
      At the reported ~$1.9B post-money valuation, investors may already be paying for uncommon success before public
      data fully justify it.
    - >-
      Additional capital is likely needed before approval, creating future dilution and term-structure risk if proof
      emerges slowly.
  unresolvedGaps:
    - Program-level efficacy, durability, and biomarker readouts for AB-2100 and AB-3028
    - Enrollment velocity and site-level activation history across all active trials
    - CMC, batch-release, comparability, and turnaround-time metrics
    - Cap-table terms, liquidation preferences, and future financing plan
    - Detailed economics and governance of the Bristol Myers Squibb collaboration
