  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: comparability
      missingEvidence: ArsenalBio-specific analytical comparability package, process-transfer history, and batch KPI series.
      whyItMatters: The technology moat cannot be underwritten as manufacturable without evidence that the process is stable across changes and scale.
      diligencePath: Request CMC deck, comparability study reports, and batch-release dashboard.
      relatedQuestionRefs: [QE015, QE016, QE023, QE025]
      relatedTableRefs: [TE004]
    - type: private-evidence-only
      severity: material
      topic: human-superiority
      missingEvidence: Comparative human data showing that logic gating, delayed CAR expression, or CITE insertion improve outcomes versus simpler approaches.
      whyItMatters: Product differentiation is meaningful only if it compounds into measurable clinical or operational advantage.
      diligencePath: Request translational biomarkers, persistence data, and cross-cohort product analyses.
      relatedQuestionRefs: [QE008, QE020, QE025]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: roadmap
      missingEvidence: A company-authored product roadmap with explicit future technical milestones and decision gates by program.
      whyItMatters: The public roadmap shows stages but not the internal criteria for advancing or killing programs.
      diligencePath: Request development-stage and governance milestone chart.
      relatedQuestionRefs: [QE018]
      relatedTableRefs: [TE005]
