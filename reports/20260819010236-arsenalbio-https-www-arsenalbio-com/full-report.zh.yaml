      - number: '2.2'
        title: 买方、用户、支付方和机构采用路径
        blocks:
          - type: paragraph
            body: >-
              CAR-T 疗法走的是专科机构渠道，而不是广泛的医生处方渠道。最终受益者是患者，但运营买方栈包括肿瘤科医生、学术癌症中心、单采和细胞处理团队、药房和报销团队，以及承担极高一次性治疗成本的公共或私人支付方。NCI
              的 T 细胞转移疗法页面强调了流程负担：细胞要采集，在体外改造，经预处理治疗后回输，并在高强度护理路径中监测。即使还没讨论价格，这种结构也让采用速度比普通肿瘤药更慢、资本开支更重。

              对 ArsenalBio
              来说，当前“客户”基础甚至更窄，因为公司仍处在临床阶段。今天有意义的需求信号是试验站点、研究者、愿意入组的患者，以及寻找差异化实体瘤细胞治疗路径的药企伙伴。ClinicalTrials.gov
              显示，AB-2100 和 AB-3028 已涉及 City of Hope、Mayo Clinic、Dana-Farber、Memorial Sloan Kettering、MD
              Anderson、UCSF、Fred Hutchinson
              等美国主要癌症中心。这很重要，因为它证明机构愿意运行研究。但它还不能证明常规商业报销或广泛治疗患者吞吐量。市场路径仍要穿过证据生成、站点信心、制造执行和支付方可接受性。
