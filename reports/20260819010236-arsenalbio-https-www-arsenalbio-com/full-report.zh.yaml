  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层和多方购买系统
        blocks:
          - type: paragraph
            body: >-
              ArsenalBio
              还没有卖进一个正常商业账户基础。当前需求系统包括符合困难实体瘤试验条件的患者、愿意运行复杂细胞治疗研究的学术或专科癌症中心、判断生物学是否值得投入运营精力的研究者，以及只有在项目走向更广泛商业化时才重要的未来支付方或药企伙伴。AB-3028
              患者页面把受益者层说得很清楚，但 ClinicalTrials.gov 和具名中心名单显示，今天真正的运营交易对手是成熟肿瘤机构，而不是社区诊所或普通处方医生。

              这种结构重要，因为临床细胞治疗的渠道异常狭窄。站点必须能够筛选重度既往治疗患者，协调制造和输注时间，管理毒性，并维持试验运营。这让大型学术中心同时成为“用户”和守门人。未来商业买方很可能是通过支付方批准运转的专科医院项目，而不是直接消费者或简单医生办公室。简言之，ArsenalBio
              今天的客户基础，最适合描述为一个集中的机构试验网络，外加未来支付方和伙伴叠层。
