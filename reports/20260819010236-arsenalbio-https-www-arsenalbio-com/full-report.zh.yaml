      - number: '5.3'
        title: 制造、质量和监管开发负担
        blocks:
          - type: paragraph
            body: >-
              ArsenalBio 的产品技术故事只有扛过制造和监管现实才有意义。FDA 关于纳入基因编辑的人类基因治疗产品的 2024 年指南、2024 年 CAR-T 开发指南，以及 2023
              年可比性指南，都把负担讲得很清楚：申办方必须证明产品设计理由、制造控制、分析可比性，以及基因编辑或基因改造细胞产品的临床安全逻辑。换句话说，这个领域的关键挑战不只是发明更好的
              CAR-T，而是证明改进后的构件能够可重复地制造，并且随时间调整时不牺牲质量。

              ArsenalBio 的公开材料从方向上回应了这一负担，但没有给出数字。技术页面称，CITE 支持的制造是非病毒、基于电转、经过优化以缩短治疗等待时间，并旨在提高一致性。ClinicalTrials
              描述显示了真实人体研究执行和站点足迹。但本次审阅的公开资料没有披露可比性资料包、转移指标、批次放行表现或详细偏差历史。因此，技术判断是：平台逻辑有前景、开发执行可见，但公开证据仍不足以说明那套把创新转化为可靠产品成熟度的具体质量体系。
