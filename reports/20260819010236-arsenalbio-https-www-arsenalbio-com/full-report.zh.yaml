            body: >-
              判断 ArsenalBio，不能只看科学故事听起来多先进。关键在于当前隐含价格已经打进了哪些预期。公开记录支撑几项正面因素：规模可观的 Series C、三个可见的人体项目、有差异化的产品技术叙事，以及
              Bristol Myers Squibb 释放的战略信号。这些事实足以让投资人持续关注。但反向逻辑同样有力。两个可见项目处于进行中但不招募状态，没有公开来源披露有意义的疗效深度或可制造性 KPI，实体瘤
              CAR-T 也还没有成熟的审批路径。因此，当前估值不能建立在已经验证的商业基本面上；更准确的理解，是押注一次罕见但价值很高的成功。投资人需要把公司质量和入场质量分开看。在据传约 ~$1.9 billion
              的投后估值下，相比目前公开证据，这个期权可能已经定价偏慷慨。正确判断不是不加区分地乐观，而是在更好证据出现前保持纪律性跟踪。
