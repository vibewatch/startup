  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出，以及 ArsenalBio 实际卖向哪里
        blocks:
          - type: paragraph
            body: >-
              不应把 ArsenalBio 拿去对标“整个肿瘤学”，甚至也不是“全部免疫治疗”。更有用的边界，是 CAR-T 细胞治疗市场，加上支撑下一代细胞治疗的相邻临床、制造和合作预算。MarketsandMarkets
              估算，全球 CAR-T 市场 2025 年为 59.8 亿美元，2026 年为 67.8 亿美元，到 2031 年达到 135.6 亿美元；同一来源还显示，更广义的细胞治疗技术市场 2025 年为 44.1
              亿美元，到 2030 年为 79.1 亿美元。这些自上而下数字确认，ArsenalBio 所在类别已有有意义的当前支出和增长，而不是投机性研究小众市场。

              但这一类别内的商业现状仍很窄。FDA 已批准细胞和基因治疗清单包含 Kymriah、Yescarta、Breyanzi、Carvykti 和 Abecma 等领先 CAR-T
              产品，但获批集中在血液恶性肿瘤。ArsenalBio 的差异化论点恰恰源于实体瘤仍更难。其公开管线瞄准卵巢癌、透明细胞肾细胞癌和转移性去势抵抗性前列腺癌，这些都是大医疗需求领域，但目前还不是已验证的商业
              CAR-T 终端市场。因此，正确的市场边界是“未来实体瘤 CAR-T 和可合作的下一代细胞治疗”，而不是“所有癌症药物支出”。
