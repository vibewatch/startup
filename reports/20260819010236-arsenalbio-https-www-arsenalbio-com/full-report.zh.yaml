      - number: '3.2'
        title: 下一代实体瘤和平台型同行
        blocks:
          - type: paragraph
            body: >-
              第二层竞争，是一批公司从不同角度回答同一个问题：“第一代 CAR-T 之后是什么？”Lyell 明确把自己呈现为下一代 CAR-T 公司，候选产品经过工程化设计以增强抗肿瘤活性。Imvax
              围绕用于实体瘤的个体化全肿瘤来源免疫疗法定位。Agenus 把自己定义为拥有广泛肿瘤组合的更优免疫疗法公司，NexImmune 则强调抗原导向免疫疗法。Turnstone
              即使经历了严重的公开市场压缩，仍是实体瘤细胞治疗雄心的参照点，因为它的市值崩塌显示，一旦生物学和融资时间线拉长，投资者信心可以多快重置。

              ArsenalBio 与这些公司在雄心上重叠，但执行路径并不相同。它自己的公开故事围绕 CITE 单位点插入、逻辑门控抗原识别、延迟 CAR 表面表达，以及自体 T
              细胞内的多功能编程展开。一些同行强调异体或更广泛的免疫治疗路径，另一些则强调不同的实体瘤激活策略。实际后果是，ArsenalBio
              并不是在一条只有自己的赛道里竞争。它只是几种尝试之一，目标都是让细胞治疗在更难的肿瘤情境中更好地工作；伙伴或投资人可以在多套“应该怎么做”的叙事之间选择。
