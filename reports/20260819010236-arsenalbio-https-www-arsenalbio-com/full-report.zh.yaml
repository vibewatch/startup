      - number: '8.4'
        title: 下一轮尽调应盯住能够改变建议的证据
        blocks:
          - type: paragraph
            body: >-
              采取观察或继续研究立场的主要好处，是它非常便于决策。ArsenalBio
              不需要一套完美的公开材料才会更值得投资；它需要披露少数高价值信息。最关键的是早期疗效细节、按项目和站点划分的入组速度、可制造性和可比性证据，以及围绕未来稀释或优先股压力的股权结构经济性。这些变量可以证明以高于最新估值的价格入场是否合理，也定义了投资逻辑破裂线。如果
              ArsenalBio 不能在融资压力再次出现前，把差异化科学转化为可见的人体获益，故事可以继续在智识上吸引人，却在财务上变得没有吸引力。反过来，如果 AB-2100 或 AB-3028
              拿出真正差异化的实体瘤数据，并且运营执行跟得上，当前谨慎就会显得过于保守。在那之前，耐心本身就是承销纪律的一部分。不过今天，仅靠基本面做公开市场式承销，退出准备度仍然偏低。
