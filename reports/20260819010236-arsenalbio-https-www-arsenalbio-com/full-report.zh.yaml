        title: 耐久性、扩张和集中度风险
        blocks:
          - type: paragraph
            body: >-
              传统客户留存指标还不能干净映射到 ArsenalBio。公司尚未商业化销售获批疗法，因此没有公开
              NRR、GRR、合同续签或经常性账户队列。最接近的耐久性代理，是站点是否继续承接项目、新项目是否扩展到更多中心，以及面向患者的招募是否保持活跃。按这个基础看，ArsenalBio
              呈现部分耐久性：三项可见人体项目和最新项目正在招募，说明机构参与仍在延续；较早研究进行中但不再招募的状态也提示，客户动量并非线性。

              集中度风险很高，因为细胞治疗交付依赖少数专科站点。即便每项研究看似有八九个地点，按商业医疗科技或制药
              标准仍很窄。如果未来实现商业化，初期很可能仍集中在顶尖学术中心和支付方关系，再逐步扩大。实际尽调问题要逐中心拆开：哪些站点在入组，哪些只是列名，哪些会转化成商业上市 网络，每个站点又能承受多少制造和报销摩擦？
