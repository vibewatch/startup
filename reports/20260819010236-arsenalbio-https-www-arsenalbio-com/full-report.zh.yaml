        title: 按严重度排序，监管和证明风险仍排在最前
        blocks:
          - type: paragraph
            body: >-
              ArsenalBio 的风险画像很典型：叙事上常显得有吸引力，落到真实开发时间线则很惩罚。公司有人体阶段项目可见、有 2024 年大额 Series
              C，也有差异化技术故事，但这些正面因素都嵌在一种尤其不宽容的治疗模式里。FDA 指南和更广泛细胞治疗框架说得很清楚，实体瘤 CAR-T 申办方必须同时解决分析表征、制造控制、临床设计和安全逻辑。FDA
              已批准细胞和基因治疗清单上没有任何获批实体瘤 CAR-T 产品，这一点重要，因为它意味着 ArsenalBio 仍在一个未经验证的获批类别中运营，而不是在成熟商业蓝图内迭代。ClinicalTrials.gov
              还显示，三项可见人体项目中有两项为进行中但不再招募，这削弱了任何“组合推进顺畅”的说法。当前最佳解释不是 ArsenalBio
              已经出问题，而是它仍处在高不确定性区域，技术质量、面向监管的纪律和证明时间都主导投资案例。
