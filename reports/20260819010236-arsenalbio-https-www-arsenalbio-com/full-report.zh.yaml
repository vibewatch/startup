              处理 ArsenalBio
              的正确方式，不是给它贴上“普遍有吸引力”或“普遍不可投”的标签，而是定义哪些证据出现后信念会上升，哪些事件会迅速打破论点。现有缓释因素是真实的：公司资本有分量、有多个项目、有战略药企合作、AB-2100 获得
              Fast Track，也有深厚科学和创投背景的领导层。但这些缓释因素主要买来时间和准入，并没有解决底层问题：可编程自体实体瘤 CAR-T
              能否以可制造的质量，产生持久人体获益。出于尽调目的，最有用的公开指标是招募连续性、试验状态变化、已披露临床数据、融资节奏，以及任何关于可制造性或可比性的证据。打破论点的触发器应当具体：关键项目状态长期停滞、早期疗效弱、严重安全或制造问题，或在生物学实质去风险之前就需要融资。
