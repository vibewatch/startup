      - number: '5.4'
        title: 差异化、路线图和剩余技术缺口
        blocks:
          - type: paragraph
            body: >-
              ArsenalBio 的差异化论点很窄，但有意义。公司最强的位置不是说“我们有一个 CAR-T”，而是说“我们把多种功能插到一个位置，用逻辑门控识别，并有意延迟 CAR
              表面表达来保留细胞状态”。这些设计选择瞄准的都是领域真实瓶颈。试验登记也显示，这不是只停留在临床前的故事：AB-1015、AB-2100 和 AB-3028 都已进入人体研究，最新项目正在招募。这个组合把
              ArsenalBio 同只存在于幻灯片里的合成生物学概念区分开来。

              未解问题仍然很重。公开资料没有揭示详细自由实施分析、工艺转移历史、制造批次指标，或能证明这些设计特征带来更好临床或运营结果的人体比较证据。因此，最佳承销读法是：技术有差异化，但下游证明不完整。ArsenalBio
              的产品架构可能比许多同行更周到，但投资人仍需要更强证据，证明这套架构会复利成可重复性、安全性、持久性和商业可制造性。
