      - number: '3.3'
        title: 能力、定价和分销力量
        blocks:
          - type: paragraph
            body: >-
              定价和分销力量现在掌握在已获批龙头手里，不在 ArsenalBio 或多数直接实体瘤同行手里。公开市值数据把这一点显示得很清楚。Novartis、Gilead 和 Bristol Myers Squibb
              的股权价值以数千亿美元计，而 Lyell、Agenus、Turnstone
              等相邻下一代肿瘤公司估值只有数亿美元或更低。这并不能证明大公司科学上更强；但它说明资产负债表、商业基础设施和等待时间容忍度都不对称。如果进展慢于预期，ArsenalBio
              仍可能在科学上赢，却输在时间、规模或融资灵活性上。

              分销力量重要，是因为 CAR-T 不是通过普通渠道销售。站点启用、制造档期可靠性、毒性管理信任和报销历史都会形成有意义的切换成本。ArsenalBio
              目前没有公开证据可支撑“广泛中心锁定”或“支付方熟悉度”的说法。另一方面，既有玩家也没有解决 ArsenalBio
              面对的准确问题集：它们仍集中在血癌适应症，而实体瘤还需要新的设计路径。因此，竞争问题变成：ArsenalBio 的生物学新颖性是否足够大，能否抵消其在规模和分销上的起跑劣势。
