chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、平台论点和当前阶段
        blocks:
          - type: paragraph
            body: >-
              Arsenal Biosciences, Inc.
              将自己定位为一家临床阶段的可编程细胞治疗公司，重点不是血液肿瘤，而是实体瘤。公司官方页面反复强调，它借助计算驱动和可编程细胞治疗，用合成生物学工具箱改写患者来源的 T
              细胞，让多个抗癌功能协同工作。产品构想比简单的一靶点自体 CAR-T 更激进：管理层称，这些模块旨在改善增殖、特异性、肿瘤杀伤、持久性，以及抵抗免疫逃逸的能力，所以公司强调的是“可编程”，而不是传统 CAR-T
              品牌。同一套官方材料也清楚说明 ArsenalBio 仍处在开发阶段。公开管线把 AB-1015、AB-2100 和 AB-3028 列为临床项目，AB-7000
              列为临床前项目；本次审阅的资料没有披露已上市产品或确认的商业收入。换到实际承销语境，这是一家私营临床阶段平台型生物科技公司：人体研究真实推进，工程故事有差异化，但商业模式仍取决于临床转化成功和未来融资，而不是当前产品销售。
