    rows:
      - - Lyell
        - 临床阶段、聚焦实体瘤的细胞治疗同业
        - 公开市场对证据不足的实体瘤平台故事保持谨慎
        - 阶段和技术路径参考较合理
        - 资产和运营历史不同
      - - Turnstone
        - 临床阶段 T 细胞治疗同业
        - 又一个关于证据和情绪压缩的警示信号
        - 有助于界定下行情景
        - 平台和上市公司动态不同
      - - bluebird bio
        - 发展已久的细胞治疗公司
        - 说明商业化和融资复杂性仍可能毁掉价值
        - 有用的复杂性警示
        - 疾病重点和历史不同
      - - 2seventy bio
        - 细胞治疗商业化 / 重组案例
        - 说明商业化并不会消除战略波动
        - 有助于界定下行和复杂性
        - 商业化后的动态不同于 ArsenalBio
      - - Legend Biotech
        - 已获批产品邻近 / 商业化 CAR-T 参考
        - 说明临床证据过关后的上行空间
        - 有用的上行天花板参考
        - 成熟度过高，不能直接作为定价锚
      - - BMS / Gilead / Novartis / Amgen
        - 大市值赞助方与肿瘤领域既有玩家
        - 展示规模天花板和资产负债表不对称
        - 有助于理解合作伙伴 / 退出语境
        - 不是同阶段可比对象
    notes: 这是一组有选择的可比对象，横跨下行同业和上行天花板参考，不是穷尽式生物技术筛选集。
    enumerationScope:
      coverage: sample
      basis: >-
        The table intentionally samples the most decision-useful public references across stage-near peers and
        approval-scale ceiling comps rather than every listed oncology or cell-therapy company.
