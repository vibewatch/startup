      - number: '5.2'
        title: 工程架构、CITE 和逻辑门控机制设计
        blocks:
          - type: paragraph
            body: >-
              核心技术主张在技术页面上说得很明确。ArsenalBio 表示，它所有合成生物学模块都通过一次基因改造插入 T 细胞的 11 号染色体，使用的是 CITE，即 CRISPR Integration of
              Transgene via
              Electroporation。公司把这描述为一种避免随机病毒整合、提高载荷容量，并创造更好产品同质性和一致性的方式。这是有意义的设计主张，因为细胞治疗变异性、插入风险和构件行为失控，都是整个领域持续存在的开发问题。

              第二个主要主张，是细胞产品内部的控制逻辑。ClinicalTrials.gov 对 AB-1015、AB-2100 和 AB-3028
              的描述都提到逻辑门控或可编程地识别多个抗原；技术页面则称，制造流程会生成记忆表型 T 细胞，并在初期让 CAR
              不出现在细胞表面，以便延迟耗竭，直到细胞到达肿瘤环境。这些主张合在一起，构成一套非常具体的架构：非病毒单位点插入、多功能编程、肿瘤选择性逻辑和延迟激活。机制是连贯的，但仍处在较早阶段；主要证明还停留在设计逻辑和方案描述，而不是成熟的人体比较数据。
