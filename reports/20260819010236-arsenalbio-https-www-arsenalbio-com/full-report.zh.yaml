      - number: '4.2'
        title: 成本结构、单位经济，以及自体细胞治疗不可避免的资本强度
        blocks:
          - type: paragraph
            body: >-
              即便没有数字披露，ArsenalBio 的成本结构也可以推断。技术页面描述了基于 CRISPR 电转、单位点插入和患者特异性生产的自体制造。NCI 对 T
              细胞转移疗法的描述强调了这一模式背后的运营负担：采集、体外细胞处理、预处理治疗、输注和随访都会增加成本和协调层。因此，公司未来单位经济很可能由
              CMC、临床运营、站点支持、放行检测、物流和质量体系主导，而不是低成本软件式交付。这本身没有错，只是个体化细胞治疗的商业现实。

              难点是，本次审阅的公开资料没有披露批次产量、放行成功率、制造周转时间、单患者成本、劳动强度或预期毛利率。因此，公开档案支持“资本强度高”，但不支持量化。即便 CITE 或延迟 CAR
              表达最终改善产品一致性或降低耗竭，投资人仍需要证据证明这些科学优势会转化为更好的经济性。在这座桥被证明之前，审慎立场应是假设细胞治疗单位经济仍然沉重，且披露不完整。
