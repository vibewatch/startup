      - number: '2.4'
        title: 增长驱动、采用约束和市场判断
        blocks:
          - type: paragraph
            body: >-
              ArsenalBio 的增长逻辑是真实的。CAR-T 市场在扩张，细胞治疗技术支出在上升，已获批产品组合已让细胞治疗在专科中心成为可报销的治疗模式。ArsenalBio
              的路径也贴合行业兴趣迁移的方向：更好的靶向特异性、更强持久性、更低耗竭，以及更可编程的生物学功能。Lyell、Imvax、Agenus 和 NexImmune
              的竞争者页面显示，行业仍在积极投入下一代免疫治疗路径；即便直接商业证明有限，这也支持伙伴和投资人持续关注差异化平台。

              约束同样重要。实体瘤仍是 CAR-T 最难的应用场景，原因包括抗原异质性、抑制性肿瘤微环境、归巢障碍，以及命中靶点却伤及非肿瘤组织的 毒性风险。FDA
              获批档案说明，这一类别的商业先例仍在别处；机构交付模式也让成本和运营摩擦保持高位。公开市场同行还表明，资本市场不会自动奖励平台承诺：Lyell 和 Agenus
              虽处在相邻免疫治疗类别，市值仍远低于十亿美元。因此，市场结论是方向上有吸引力，但在 ArsenalBio 同时证明生物学和经济性之前，可变现部分仍不完整。
