      - number: '8.3'
        title: 可比公司和情景分析指向谨慎的基准情景
        blocks:
          - type: paragraph
            body: >-
              可比公司集合很杂，正因为如此更要谨慎处理。Lyell、Turnstone、Bluebird 和 2seventy 说明，当验证、商业化或融资复杂度仍未解决时，公开市场会如何惩罚细胞疗法公司。Legend 以及
              Bristol Myers Squibb、Gilead、Novartis 等大型赞助方则显示，一旦临床和商业验证清晰，奖赏空间有多大。ArsenalBio
              夹在两者之间。它的科学雄心和私募融资支持强于许多承压同行，但还没有获批产品或耐久数据，无法把商业龙头直接当作定价锚。这种中间位置使情景分析比单点目标更重要。因此，基准情景应贴近最新私募估值；乐观情景必须要求突出的早期疗效和可制造性证据；悲观情景则应假设数据混杂叠加融资压力，重新打开稀释和优先权担忧。
            claimRefs:
              - CV025
