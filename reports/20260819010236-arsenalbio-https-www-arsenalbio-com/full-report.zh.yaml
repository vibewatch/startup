  - id: TR005
    title: 缓释与终止标准表
    columns:
      - 风险
      - 可监测触发因素
      - 阈值或事件
      - 行动含义
    rows:
      - - 临床停滞
        - 试验状态和数据流
        - AB-1015 和 AB-2100 持续停滞，且没有有意义更新
        - 转为观望，或大幅重定价
      - - 早期疗效不及预期
        - 初始公开应答数据
        - 没有可信信号表明逻辑门控生物学能转化为患者获益
        - 将平台优越性论点视为未证实
      - - 安全或生产事件
        - 暂停、方案中断或重大质量问题
        - 任何延迟入组或供给连续性的重大事件
        - 提高剩余风险折价，并延长尽调
      - - 融资压力
        - 新融资相对证明点的时点
        - 有意义的降风险数据出现前就需要资本
        - 建模降价轮 / 优先权风险
      - - 正向降风险事件
        - 公开临床和 CMC 披露
        - 持久应答叠加可信可制造性证据
        - 上调信心，并收窄折现率
    notes: 触发因素刻意选为公开且可监测，便于在融资轮之间跟踪。
