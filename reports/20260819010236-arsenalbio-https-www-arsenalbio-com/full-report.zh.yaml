      - number: '4.3'
        title: 公开牵引力代理指标，与仍然缺失的指标
        blocks:
          - type: paragraph
            body: >-
              ArsenalBio 确实有牵引力代理指标，但它们是科学和融资代理，而不是运营代理。公司在 ClinicalTrials.gov 上有三个人体项目，有面向患者的 AB-3028 页面、有 BMS
              合作，也有包含主要生物科技和战略投资人的投资人集团。这些事实支持一个结论：ArsenalBio
              不是缺少验证的科学项目。它们并不提供财务章节通常需要的指标：收入、按资产划分的管线贡献、递延收入、烧钱速度、现金余额、定价意图、员工增长、利用率或中心启用。公开动量因此要谨慎解读。公司显然活跃且资金充足，但在支撑运营承销信心的数字上并不透明。

              这种区分重要，因为私营生物科技公司融资会制造运营规模的错觉。ArsenalBio 可能资源非常充足，却仍完全依赖资本市场和临床进展来维持经济连续性。今天有意义的牵引力 KPI 不是客户增长或 ARR
              增长，而是把融资转化为经过验证的临床和转化进展，同时不被迫过早追加融资。公开资料不够深，无法判断这种转化是否高效。
