companyProfile:
  summary: >-
    ArsenalBio 是一家位于南旧金山的私营细胞治疗公司，正在为实体瘤开发可编程自体 CAR-T 产品。公开证据中，公司最强的地方在于平台身份、投资人质量和临床阶段的严肃性：它有三个可见的人体项目、一个 BMS 战略合作，以及
    2024 年 Series C 备案显示已募集 3.2535 亿美元。商业经济性、疗效深度和制造细节的公开证明要弱得多，因此公司更像一个异常可信但仍不完整的临床阶段平台，而不是已经去风险的产品型业务。
