      - number: '3.4'
        title: 护城河耐久性、替代风险和竞争判断
        blocks:
          - type: paragraph
            body: >-
              ArsenalBio 的护城河主张是连贯的，但仍有条件。公司并没有把自己包装成又一个通用 CAR-T 建造者。它声称通过非病毒单位点插入、双抗原逻辑门控，以及旨在支持记忆表型并降低耗竭的延迟 CAR
              表达，形成差异化工程。纸面上，这些都是真实差异化，也正好对应历史上限制实体瘤 CAR-T 的问题。如果这些机制能够转化，ArsenalBio 即便站在大得多的公司旁边，也可能占住一个有意义的利基。

              风险在于，科学新颖性本身并不创造持久竞争地位。公开资料没有显示 ArsenalBio
              已拥有商业定价、大规模制造产出或广泛伙伴锁定。竞争路径也可能通过不同设计选择抵达可行的实体瘤生物学；一些同行商业上失败，也不等于其核心科学被证伪。因此，ArsenalBio 最可能的近期胜利条件，不是立刻替代
              Novartis、Gilead、BMS 或 Legend，而是在现有路径仍不足的场景中，成为可信的授权、共同开发或聚焦临床赢家。这是一条有条件的护城河，不是已经确定的护城河。
