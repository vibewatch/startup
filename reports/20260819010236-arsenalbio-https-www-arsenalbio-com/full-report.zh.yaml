      - number: '1.3'
        title: 融资基础、投资人集团和试验动量
        blocks:
          - type: paragraph
            body: >-
              ArsenalBio 的公开融资档案明显强于运营披露。最清晰的一手证据是 2024 年 SEC Form D：Series C 募集 325,352,578 美元，首次销售日期为 2024-07-09，备案日期为
              2024-09-04，投资人 26 名。公司、融资和创投伙伴的报道还指向一个投资人集团，包括 ARCH Venture Partners、SoftBank Vision Fund 2、Regeneron
              Ventures、NVentures、Parker Institute for Cancer Immunotherapy 和 Bristol Myers
              Squibb，并有跨界投资人和行业投资人继续支持。多篇新闻报道把这笔融资与约 19
              亿美元投后估值联系在一起，但可访问的备案本身没有披露估值条款，所以这个数字应视为高关注度媒体交叉验证，而不是备案认证事实。从运营上看，这笔融资贴合真实开发路径。ClinicalTrials.gov 显示
              AB-1015 于 2022 年 11 月启动，AB-2100 于 2024 年 2 月启动，AB-3028 于 2026 年 1
              月开始招募。钱不是投向一份概念材料，而是投向一个正在运行的多项目临床平台。即便如此，两个较早研究现在显示为进行中但不再招募，说明临床时钟走得比单纯融资标题暗示的更慢。
