  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 现有商业格局和设定标准的竞争者
        blocks:
          - type: paragraph
            body: >-
              第一层竞争来自当前已获批的 CAR-T 产品组合。FDA 获批产品清单，以及 Novartis、Gilead、Bristol Myers Squibb 和 Legend
              的企业足迹，证明细胞治疗已经是一个真实商业类别，但核心仍在血液恶性肿瘤。这些公司拥有医生熟悉度、专科中心关系、制造基础设施、安全管理手册和支付方先例，任何临床阶段私营公司都无法马上匹敌。即使还没进入单品对比，这一点在结构上也重要：任何想把
              CAR-T 拓展到新肿瘤类型的进入者，不只要证明科学，还要突破既有玩家的信任优势。

              ArsenalBio 的适应症组合并不直接镜像已获批龙头，因为它的可见项目在卵巢癌、肾癌和前列腺癌，而不是 CD19 或 BCMA
              血癌产品线。但这些龙头仍定义了市场的运营和报销基准。它们证明，在合适疾病场景中，高价一次性疗法可以确立地位；它们也设定了物流、安全支持和资本需求预期。因此，ArsenalBio
              某种程度上是靠对比来竞争：如果它不能拿出令人信服的生物学或经济理由，证明实体瘤需要不同治疗方式，商业市场会继续把既有血液肿瘤 CAR-T 视为类别核心，把实体瘤进入者视为投机性延伸。
