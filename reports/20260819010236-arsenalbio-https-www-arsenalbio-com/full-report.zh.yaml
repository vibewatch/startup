  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型、变现路径，以及哪些还不是收入
        blocks:
          - type: paragraph
            body: >-
              今天不应把 ArsenalBio 建模成一家已经产生收入的商业化生物科技公司。官方页面显示临床阶段管线、患者试验触达，以及与 Bristol Myers Squibb
              的战略发现合作，但本次审阅的资料没有披露已上市产品销售、经常性合作收入、里程碑收款或已确认授权收入。这很重要，因为私营公司可以靠融资标题显得财务上很强，却仍没有运营收入基础。这里的公开档案正支持这种读法。ArsenalBio
              正在通过一条或多条路径投资未来变现——最终疗法销售、合作中的期权和授权经济，或资产级交易——但还没有展示足以让投资人承销收入质量的运营结果。

              因此，理解商业模式最干净的方式是“带有未来疗法和合作可选性的临床平台”。BMS
              发现合作具有战略重要性，因为它显示外部药企交易对手看到了平台潜在价值，但公开记录没有披露期权经济、首付款确认、里程碑结构或特许权使用费 形态。投资人应把它视为变现兴趣证明，而不是已入账收入。公开收入、ARR
              或利润率字段仍为空。
