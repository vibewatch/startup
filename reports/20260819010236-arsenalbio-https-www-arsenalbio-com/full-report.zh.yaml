      - number: '1.2'
        title: 领导层、治理和机构网络
        blocks:
          - type: paragraph
            body: >-
              对一家私营细胞治疗公司而言，ArsenalBio 的领导层故事可信，且网络异常强，但仍集中在少数可见人物身上。SEC Form D 将 Kenneth Drazan 列为高管兼董事，将 Irene
              Pleasure 列为秘书；公司介绍页面则突出由 Sean Parker 担任主席的董事会，并列出 Brook Byers、Beth Seidenberg 等董事。更广的名册重要，是因为它同时把
              ArsenalBio 接到三张强机构网络上：Parker 的免疫治疗慈善和平台打造声量、Byers 背后的 Kleiner Perkins，以及 Seidenberg 背后的 Westlake Village
              BioPartners。公开描述还把 E. John Wherry 与公司联合创始人和科学顾问身份相连，进一步说明 ArsenalBio
              的科学身份来自学术免疫学信誉，而不是纯金融工程。不过，治理披露仍比公开市场投资人希望看到的要轻。本次审阅的一手资料没有披露所有权拆分、独立董事比例、投票控制结构或正式接班计划。因此，董事会质量是优势，而公司建设对
              Drazan、科学权威对 Wherry 的关键人物依赖，仍是需要继续尽调的问题。
