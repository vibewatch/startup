      - number: '4.4'
        title: 资本充足性、融资依赖和总体财务判断
        blocks:
          - type: paragraph
            body: >-
              最强的公开财务事实，是 2024 年 Series C 的规模。3.2535 亿美元融资即使按风险投资支持的生物科技公司 标准也很大，强烈暗示 ArsenalBio 进入 2025 和 2026
              年时，有足够资本运行多项目开发计划，而不只是一个狭窄实验。投资人组合也重要：战略投资人和跨界投资人 名字意味着，成熟参与方愿意在类别难度很高的情况下继续资助平台。这是资本市场信誉的有意义证据。

              这不等于资本足够一路走到获批。本次审阅的公开资料没有披露在手现金、季度烧钱、按项目划分的募资用途、债务义务、资金续航或下一轮触发条件。自体临床阶段细胞治疗在结构上昂贵，运营指标缺失意味着投资人无法验证
              Series C 是充裕、勉强够用，还是已经被快速消耗。财务结论因此偏谨慎：ArsenalBio 披露的资金远多于平均临床阶段同行，但在临床、制造和合作里程碑更清楚之前，其经济引擎仍披露不足且依赖融资。
