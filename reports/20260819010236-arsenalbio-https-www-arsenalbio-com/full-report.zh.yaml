        title: 估值语境应锚定里程碑风险，而不是品类热度
        blocks:
          - type: paragraph
            body: >-
              ArsenalBio
              没有公开收入，没有披露利润率结构，也看不到商业客户基础。因此，大多数传统运营公司估值方法都用不上。更合适的视角，是把平台价值按里程碑加权，并对尚未解决的验证和时间风险打重折扣。市场背景有帮助，但不应主导判断。大型
              CAR-T 市场预测显示，品类价值可以很大；已经获批的细胞疗法龙头也证明，商业结果可以相当可观。不过，这些案例只能作为天花板参照，不能直接当作可比公司。ArsenalBio
              处在这个阶段，真正的问题不是细胞疗法整体是否有吸引力，而是新证据是否可能证明上一轮之后的估值上台阶合理。价格只有在证据变化时才该变化。由于两个项目目前不招募，公开疗效细节仍然稀少，在披露的临床或 CMC
              催化剂压缩不确定性之前，入场纪律应保持收紧。
