  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 当前证据
      - 改变判断的因素
    rows:
      - - 差异化平台逻辑
        - CITE、逻辑门控、延迟表达和三项人体临床项目带来真实期权价值
        - 公开疗效和 CMC 证明会显著增强判断
      - - 战略支持逻辑
        - 大额 Series C 轮和 BMS 合作支撑可信度
        - 明确的经济条款或期权行使路径会提高信心
      - - 反向逻辑：证据仍薄
        - 两个项目处于活跃但未招募，且披露疗效有限，折价仍高
        - 清晰的早期疗效会削弱这一反对点
      - - 反向逻辑：估值已经乐观
        - 相对公开证据，约 $1.9B 投后估值显得激进
        - 更好数据或更低进入价格会降低顾虑
      - - 反向逻辑：仍需再融资
        - 烧钱强度意味着获批前仍有后续稀释风险
        - 更长现金跑道或更后期证据会降低风险
    notes: 反向逻辑不是附带项；这是建议在据报价格下没有升至买入的主要原因。
