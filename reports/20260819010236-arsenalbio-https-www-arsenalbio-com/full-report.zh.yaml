  - id: TV005
    title: 投资逻辑破裂与叫停触发表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 项目停滞
        - 较早项目仍为活跃但未招募，且没有实质披露
        - 拉长证据兑现时间，削弱基准情景信心
        - 维持或降低投资测算进取度
      - - 疗效偏弱
        - 关键项目没有可信的差异化缓解信号
        - 直接伤害平台期权价值
        - 把价格下调至上一轮乐观预期以下
      - - CMC / 安全性问题
        - 重大事件拖慢供应或入组
        - 抬高折现率和烧钱风险
        - 拉长尽调，扩大下行情景
      - - 风险降低前融资
        - 更强证据出现前就需要新资金
        - 抬高稀释 / 优先权顾虑
        - 建模下轮融资或更严苛条款
      - - 强催化
        - 持久缓解叠加运营证明
        - 压低折现率，并支撑估值上调
        - 选择性上调信心
    notes: 每个触发项都按可由公开披露或定向尽调清单监测的方式表述。
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV039
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人或尽调路径
    rows:
      - - 临床疗效
        - 项目级缓解深度、持续性和生物标志物背景
        - 决定情景概率最直接
        - 向管理层 / 资料室索取临床资料包
      - - 入组动能
        - 按项目拆分的中心启动和入组速度
        - 澄清活跃但未招募是良性状态还是值得担忧
        - 索取运营仪表盘
      - - 可制造性
        - 批次成功、放行、可比性和周转指标
        - 决定科学故事是否具备可融资的运营基础
        - 索取 CMC 资料包
      - - 资本结构
        - 优先股堆叠、清算条款和未来融资计划
        - 即便科学有效，也会影响回报测算
        - 索取融资材料和法律文件
      - - 合作经济条款
        - 与 BMS 的里程碑、期权和治理安排
        - 可能显著增加或减少期权价值
        - 索取合作摘要或管理层解释
    notes: 这些问题按能多快改变建议、估值立场或下行保护来排序。
    claimRefs:
      - CV020
      - CV024
      - CV032
      - CV037
      - CV038
