            body: >-
              即便不叠加 CRISPR 式工程、逻辑门控、延迟 CAR 表面表达和实体瘤生物学，自体细胞治疗本身也很难运营。ArsenalBio 以 CITE
              为中心的架构可能带来真实设计优势，但每增加一层控制，也会加重制造可重复性和临床转化负担。公司已证明自己足以启动并维持三项人体研究，这很有意义。但公开资料仍未披露批次放行
              指标、批次成功率、工艺转移历史或持久疗效信号。这个缺口重要，因为一个有趣平台和一家可投资治疗公司之间的差别，往往取决于制造与生物学是否朝同一方向复利。试验状态组合放大了这种不确定性：AB-1015 和
              AB-2100 仍为进行中但不再招募，AB-3028 是最新招募项目。这个模式提示执行连续性，但还不能证明可规模化动量或通向注册准备的清晰路径。
