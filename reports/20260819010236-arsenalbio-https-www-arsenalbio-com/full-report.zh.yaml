  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 按工作流看，产品到底是什么
        blocks:
          - type: paragraph
            body: >-
              ArsenalBio 卖的不是通用受体构件。从产品角度看，公司正在用一个细胞产品里的多种工程化生物功能，为实体瘤打造患者特异性、可编程自体 CAR-T 疗法。公开管线说明，产品组合包括
              AB-1015、AB-2100、AB-3028 和临床前 AB-7000
              项目；患者页面也展示了至少一个产品如何直接向潜在试验参与者解释。按用户工作流看，“产品”包括细胞采集、基因组工程、制造、放行、预处理、输注和随访，而不只是转基因本身。

              这一区分重要，因为投资人常把细胞治疗当成“构件就是全部供给”来承销。在这里，操作系统与受体逻辑同样重要。ArsenalBio
              的技术论点是，可以把若干协同功能一起插入并控制，从而改善特异性、持久性、抗肿瘤活性，以及抵抗肿瘤免疫逃逸的能力。因此，实际产品读法是平台优先、带三个可见临床表达，而不是单个孤立治疗 SKU。
