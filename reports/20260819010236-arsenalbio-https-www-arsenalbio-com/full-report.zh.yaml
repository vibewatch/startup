  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - AB-2100 或 AB-3028 显示突出疗效，且可制造性证据改善
        - 平台成功概率大幅上升，高于上一轮的估值上调变得合理
        - 数据可能无法复现，或仍停留在早期
        - 需要具体临床披露
      - - 基准
        - 项目继续推进，但证据仍不完整，后续融资最终会回来
        - 价值围绕最近披露的私募估值小幅漂移
        - 时间和稀释会抵消进展
        - 与当前公开材料一致
      - - 悲观
        - 入组停滞、数据不及预期，或风险降低前就需要资金
        - 平轮到下轮逻辑占主导，优先权顾虑权重上升
        - 数据偏弱叠加时间压力
        - 同业市场警示信号支撑该情景
    notes: 这里刻意只给定性区间，并在估值区间图中明确呈现，避免假精确。
