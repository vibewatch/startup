      - number: '2.3'
        title: 按适应症、伙伴兴趣和现实 SAM 观察规模
        blocks:
          - type: paragraph
            body: >-
              只有同时使用多重视角，而不是依赖一份泛市场报告，ArsenalBio 的 TAM 才显得很大。自上而下视角来自 CAR-T 和细胞治疗市场研究。流行病学视角来自肾癌和前列腺癌统计：ACS 和 SEER 估计，美国
              2026 年约有 80,450 例新的肾及肾盂癌病例；前列腺癌来源估计新发病例 333,830 例、死亡 36,320 例。这些患者池远大于当前已获批 CAR-T
              覆盖范围。因此，临床需求视角很有吸引力，尤其是在复发性透明细胞 RCC 和 mCRPC 中，标准方案对许多后线患者仍不够。

              难点在于，这些人群数字不能直接转化为 ArsenalBio 的近期 SAM。只有部分患者符合当前方案入组标准，只有部分患者能到达专科中心，也只有部分患者在既往治疗和制造周期之后仍符合条件。AB-2100
              面向接受过免疫检查点抑制剂和 VEGF 抑制剂后的复发性晚期或转移性 ccRCC；AB-3028 面向接受过雄激素受体通路抑制剂治疗后的 mCRPC。这意味着，在证据约束下的 SAM
              不是完整发病池，而是一个后线、专科中心、方案定义的子集。现实 SOM 还要更小，因为 ArsenalBio 仍缺少公开商业化指标、定价和结局数据。
