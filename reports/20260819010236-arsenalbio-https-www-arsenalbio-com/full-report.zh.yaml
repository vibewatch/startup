      - number: '1.4'
        title: 里程碑读出、外部验证和主要未解问题
        blocks:
          - type: paragraph
            body: >-
              里程碑档案支持“这是一家严肃公司”，但还不足以让人完整承销。ArsenalBio 已经拿出足够外部信号，跨过“这是真的吗？”门槛：官方页面、SEC 记录和 ClinicalTrials.gov
              共同确认，它是一家私营公司，有大额资本支持、多个人体研究、已披露的 BMS 合作、面向患者的试验触达，以及围绕 CITE 染色体 11 插入和逻辑门控靶向的差异化工程叙事。AB-2100 和 AB-3028
              的站点版图也重要，因为它包括 City of Hope、Dana-Farber、Memorial Sloan Kettering、MD Anderson、Mayo Clinic 和 Fred Hutchinson
              等主要中心，说明高质量机构愿意参与公司的研究。未解问题不是存在性问题，而是商业和转化问题。公开资料仍未披露收入、员工规模、单患者制造成本或持久疗效数据。更重要的是，FDA
              已批准细胞和基因疗法清单中仍有用于血液恶性肿瘤的已批准 CAR-T 产品，却没有已批准实体瘤 CAR-T；这让 ArsenalBio
              所处类别拥有真实上行空间，也有历史上很难突破的先例。结论是：公司具备私营细胞治疗平台少见的强要素，也背着同样真实的执行风险。
