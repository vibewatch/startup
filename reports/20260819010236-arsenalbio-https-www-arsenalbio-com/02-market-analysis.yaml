  evidenceGaps:
    - type: missing-source
      severity: material
      topic: payer-readiness
      missingEvidence: A current payer, pricing, or episode-economics framework for any ArsenalBio program.
      whyItMatters: Market size does not convert into usable demand unless reimbursement economics are workable for specialist centers.
      diligencePath: Request target pricing, expected episode cost, and reimbursement-access assumptions by indication.
      relatedQuestionRefs: [QM014, QM024, QM025]
    - type: private-evidence-only
      severity: material
      topic: practical-som
      missingEvidence: Internal forecasts for eligible-patient counts, center activation, manufacturing capacity, and yield by program.
      whyItMatters: Without those figures the company-level SOM remains conceptual rather than underwritten.
      diligencePath: Review management forecasting model for AB-2100 and AB-3028 uptake.
      relatedQuestionRefs: [QM023, QM024, QM025]
      relatedTableRefs: [TM002]
    - type: stale
      severity: material
      topic: commercial-precedent
      missingEvidence: Updated evidence on whether any solid-tumor CAR-T candidate is approaching approval-level proof.
      whyItMatters: The category precedent gap is central to how much confidence investors can place in ArsenalBio's SAM.
      diligencePath: Refresh major conference readouts and FDA milestone announcements for solid-tumor CAR-T programs.
      relatedQuestionRefs: [QM019, QM020, QM024]
    - type: missing-source
      severity: minor
      topic: TM003 buyer map
      missingEvidence: A direct ArsenalBio document describing future commercial account ownership and payer strategy.
      whyItMatters: The current buyer map is inferred from cell-therapy workflow sources and trial design, not from a company commercialization plan.
      diligencePath: Request a go-to-market and market-access planning deck once a lead program advances.
      relatedQuestionRefs: [QM010, QM012]
      relatedTableRefs: [TM003]
