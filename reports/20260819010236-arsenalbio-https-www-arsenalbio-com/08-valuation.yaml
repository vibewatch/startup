- id: comparable-set-and-scenario-framing
  title: Comparables and scenarios support a cautious base case
  body: The comparable universe is messy, which is exactly why it must be handled carefully. Lyell, Turnstone, Bluebird, and 2seventy show how public markets punish cell-therapy companies when proof, commercialization, or financing complexity remain unresolved. Legend and major sponsors such as Bristol Myers Squibb, Gilead, and Novartis show the size of the prize when clear clinical and commercial validation exists. ArsenalBio sits between those worlds. It has stronger scientific ambition and private financing support than many struggling peers, but it does not yet have the approval or durable data that justify using commercial leaders as direct pricing anchors. That middle position is why scenario analysis matters more than single-point targets. As a result, the base case should remain close to the latest private mark, the bull case should require standout early efficacy and manufacturability evidence, and the bear case should assume mixed data plus financing pressure that re-opens dilution and preference concerns.
