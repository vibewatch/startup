- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Program stagnation
    - Older programs remain active not recruiting with no meaningful disclosure
    - Extends time-to-proof and weakens base-case confidence
    - Hold or reduce underwriting aggressiveness
  - - Weak efficacy
    - No credible differentiated response signal in key programs
    - Damages platform option value directly
    - Reprice below last-round optimism
  - - CMC / safety issue
    - Material event slows supply or enrollment
    - Raises discount rate and cash-burn risk
    - Extend diligence and widen downside case
  - - Financing before de-risking
    - New capital needed before stronger proof appears
    - Raises dilution / preference concerns
    - Model down-round or tougher terms
  - - Strong catalyst
    - Durable responses plus operational proof
    - Compresses discount rate and supports step-up
    - Upgrade conviction selectively
  notes: Every trigger is phrased so it can be monitored from public disclosures or a targeted diligence list.
