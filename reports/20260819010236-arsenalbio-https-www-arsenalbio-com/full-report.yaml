  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What the product actually is in workflow terms
        blocks:
          - type: paragraph
            body: >-
              ArsenalBio is not selling a generic receptor construct. In product terms, the company is building
              patient-specific, programmable autologous CAR-T therapies for solid tumors using multiple engineered
              biological functions in one cell product. The public pipeline makes clear that the product set includes
              AB-1015, AB-2100, AB-3028, and the preclinical AB-7000 program, while the patient page shows how at least
              one of those products is explained directly to prospective trial participants. In user-workflow terms, the
              “product” includes cell collection, genome engineering, manufacturing, release, conditioning, infusion,
              and follow-up rather than only the transgene itself.

              That distinction matters because investors often underwrite cell therapy as if the construct is the whole
              offering. Here the operating system matters as much as the receptor logic. ArsenalBio's technical thesis
              is that several coordinated functions can be inserted and controlled together to improve specificity,
              persistence, anti-tumor activity, and resistance to tumor immune evasion. The practical product read is
              therefore platform-first with three visible clinical expressions, not a single isolated therapeutic SKU.
