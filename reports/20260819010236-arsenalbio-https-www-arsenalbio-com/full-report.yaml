  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and the multi-party buying system
        blocks:
          - type: paragraph
            body: >-
              ArsenalBio does not yet sell into a normal commercial account base. Its current demand system includes
              patients eligible for difficult solid-tumor trials, academic or specialist cancer centers willing to run
              complex cell-therapy studies, investigators who judge whether the biology is worth operational effort, and
              eventual payers or pharma partners that would matter only if the programs move toward broader
              commercialization. The patient page for AB-3028 makes the beneficiary layer explicit, but
              ClinicalTrials.gov and the named center rosters show that the actual operational counterparties today are
              sophisticated oncology institutions rather than community clinics or ordinary prescribing physicians.

              This structure matters because clinical cell therapy has an unusually narrow channel. A site must be able
              to screen heavily pretreated patients, coordinate manufacturing and infusion timing, manage toxicity, and
              sustain trial operations. That makes major academic centers both “users” and gatekeepers. A future
              commercial buyer would likely be a specialized hospital program working through payer approval rather than
              a direct consumer or simple physician office. In short, ArsenalBio's customer base today is best described
              as a concentrated institutional trial network with future payer and partner overlays.
