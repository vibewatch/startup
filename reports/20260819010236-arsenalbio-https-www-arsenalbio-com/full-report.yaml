      - number: '2.3'
        title: Sizing lenses by indication, partner interest, and practical SAM
        blocks:
          - type: paragraph
            body: >-
              ArsenalBio’s TAM is large only if multiple lenses are used instead of one generic market report. The
              top-down lens comes from CAR-T and cell-therapy market research. The epidemiology lens comes from kidney-
              and prostate-cancer statistics: ACS and SEER estimate roughly 80,450 new kidney and renal-pelvis cancer
              cases in the United States in 2026, while prostate-cancer sources estimate 333,830 new cases and 36,320
              deaths. Those are much larger patient pools than current approved CAR-T address. The clinical-need lens is
              therefore compelling, especially in recurrent clear-cell RCC and mCRPC where standard options remain
              inadequate for many late-line patients.

              The challenge is that those population numbers do not convert directly into a near-term SAM for
              ArsenalBio. Only subsets of those patients fit current protocol inclusion criteria, only a subset can
              reach specialist centers, and only a subset would remain eligible after prior therapies and manufacturing
              timelines. AB-2100 also addresses recurrent advanced or metastatic ccRCC after checkpoint inhibitor and
              VEGF-inhibitor exposure, while AB-3028 addresses mCRPC after androgen-receptor pathway inhibitor
              treatment. That means the evidence-constrained SAM is not the full incidence pool; it is a late-line,
              specialist-center, protocol-defined subset. A realistic SOM is smaller again because ArsenalBio still
              lacks public commercialization metrics, pricing, and outcomes data.
            claimRefs:
              - CM019
              - CM020
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
