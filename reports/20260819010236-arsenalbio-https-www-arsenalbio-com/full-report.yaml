      - number: '5.2'
        title: Engineering architecture, CITE, and logic-gated mechanism design
        blocks:
          - type: paragraph
            body: >-
              The core technical claim is explicit on the technology page. ArsenalBio says all of its synthetic biology
              modules are inserted into T cells via a single genetic modification in Chromosome 11 using CITE, a CRISPR
              Integration of Transgene via Electroporation approach. The company frames this as a way to avoid random
              viral integration, improve payload capacity, and create better product homogeneity and consistency. That
              is a meaningful design claim because cell-therapy variability, insertional risk, and uncontrolled
              construct behavior are persistent development issues across the field.

              The second major claim is control logic inside the cell product itself. ClinicalTrials.gov descriptions
              for AB-1015, AB-2100, and AB-3028 each describe logic-gated or programmable recognition of multiple
              antigens, while the technology page says the manufacturing process creates memory phenotype T cells and
              keeps CAR off the surface initially to delay exhaustion until the cells reach tumor context. Combined,
              those claims amount to a very specific architecture: non-viral single-site insertion, multi-function
              programming, tumor-selective logic, and delayed activation. The mechanism is coherent, but it is still
              early enough that the main proof remains design logic and protocol description rather than mature human
              comparative data.
