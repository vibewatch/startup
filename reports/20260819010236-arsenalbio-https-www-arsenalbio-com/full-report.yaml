      - number: '2.4'
        title: Growth drivers, adoption constraints, and market verdict
        blocks:
          - type: paragraph
            body: >-
              The growth case for ArsenalBio is real. The CAR-T market is expanding, cell-therapy technology spend is
              rising, and the approved-product set has normalized cell therapy as a reimbursable modality in specialized
              centers. ArsenalBio’s approach also aligns with where industry appetite is moving: better targeting
              specificity, improved persistence, lower exhaustion, and more programmable biological function. Competitor
              pages from Lyell, Imvax, Agenus, and NexImmune show a field still spending aggressively on next-generation
              immunotherapy approaches, which supports ongoing partner and investor interest in differentiated platforms
              even when direct commercial proof is limited.

              The constraint case is just as important. Solid tumors remain the hardest setting for CAR-T because of
              antigen heterogeneity, suppressive tumor microenvironments, trafficking barriers, and on-target/off-tumor
              toxicity risk. The FDA approval file demonstrates that the category’s commercial precedent still sits
              elsewhere, while the institutional delivery model keeps cost and operational friction high. Public-market
              peers also show that the capital markets do not automatically reward platform promise: Lyell and Agenus
              remain far below billion-dollar market capitalizations despite operating in adjacent immunotherapy
              categories. The market verdict is therefore attractive directionally, but only partially monetizable until
              ArsenalBio proves both biology and economics.
            claimRefs:
              - CM028
              - CM029
