      - number: '4.4'
        title: Capital adequacy, financing dependence, and overall financial verdict
        blocks:
          - type: paragraph
            body: >-
              The strongest public financial fact is the size of the 2024 Series C. A $325.35 million raise is large
              even by venture-backed biotech standards and strongly suggests that ArsenalBio entered 2025 and 2026 with
              enough capital to run a multi-program development plan rather than a single narrow experiment. The
              investor mix also matters: strategic and crossover names imply that sophisticated parties were willing to
              fund the platform despite the category's difficulty. That is meaningful evidence of capital-market
              credibility.

              It is not the same as evidence of capital adequacy all the way to approval. No reviewed public source
              disclosed cash on hand, quarterly burn, planned use of proceeds by program, debt obligations, runway, or
              next-round trigger. Autologous clinical-stage cell therapy is structurally expensive, and the absence of
              operating metrics means investors cannot verify whether the Series C is ample, merely sufficient, or
              already being consumed quickly. The financial verdict is therefore cautious: ArsenalBio has far more
              disclosed funding than the average clinical-stage peer, but its economic engine remains under-disclosed
