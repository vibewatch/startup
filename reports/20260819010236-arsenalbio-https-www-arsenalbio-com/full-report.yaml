      - number: '1.4'
        title: Milestone readout, external validation, and main open questions
        blocks:
          - type: paragraph
            body: >-
              The milestone file supports a serious company, but not yet a fully underwritable one. ArsenalBio has now
              shown enough external signals to clear the “is this real?” threshold: official pages, SEC records, and
              ClinicalTrials.gov together confirm a private company with large-capital backing, multiple human studies,
              a disclosed BMS collaboration, patient-facing trial outreach, and a differentiated engineering narrative
              centered on CITE-based chromosome-11 insertion and logic-gated targeting. The site footprint on AB-2100
              and AB-3028 also matters because it includes major centers such as City of Hope, Dana-Farber, Memorial
              Sloan Kettering, MD Anderson, Mayo Clinic, and Fred Hutchinson, indicating that high-quality institutions
              are willing to participate in the company’s studies. The unresolved questions are commercial and
              translational rather than existential. Public sources still do not disclose revenue, headcount,
              manufacturing cost per patient, or durable efficacy data. More importantly, the FDA’s list of approved
              cell and gene therapies still contains approved CAR-T products for hematologic malignancies but no
              approved solid-tumor CAR-T, which keeps ArsenalBio in a category with real upside but historically
              difficult precedent. The result is a company with unusually strong ingredients for a private cell-therapy
              platform and equally real execution risk.
            claimRefs:
              - CO020
              - CO022
              - CO023
              - CO027
              - CO035
