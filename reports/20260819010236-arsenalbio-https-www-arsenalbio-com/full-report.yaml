      - number: '1.3'
        title: Funding base, investor syndicate, and trial momentum
        blocks:
          - type: paragraph
            body: >-
              ArsenalBio’s public funding file is much stronger than its operating disclosure. The clearest primary
              evidence is the 2024 SEC Form D, which shows a Series C raise of $325,352,578, a date of first sale of
              2024-07-09, filing date 2024-09-04, and 26 investors. Company, financing, and venture-partner coverage
              also point to a syndicate that includes ARCH Venture Partners, SoftBank Vision Fund 2, Regeneron Ventures,
              NVentures, Parker Institute for Cancer Immunotherapy, and Bristol Myers Squibb, with additional support
              from crossover and sector investors. Multiple news reports tie that financing to an implied valuation of
              roughly $1.9 billion post-money, though the accessible filing itself does not disclose valuation terms and
              the number should therefore be treated as high-profile press triangulation rather than a filing-certified
              fact. Operationally, the capital raise fits a real development arc. ClinicalTrials.gov shows AB-1015
              started in November 2022, AB-2100 started in February 2024, and AB-3028 began recruiting in January 2026.
              The money was not raised into a concept deck; it was raised into a live multi-program clinical platform.
              Even so, the two older studies now show active-not-recruiting status, so the clinical clock is moving more
              slowly than a pure financing headline would imply.
