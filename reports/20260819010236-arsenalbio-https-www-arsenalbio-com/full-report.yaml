  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Current evidence
      - What would change the view
    rows:
      - - Differentiated platform thesis
        - CITE, logic gating, delayed expression, and three human programs create genuine option value
        - Published efficacy and CMC proof would strengthen materially
      - - Strategic support thesis
        - Large Series C and BMS collaboration support credibility
        - Hard economics or option exercise clarity would improve conviction
      - - 'Anti-thesis: proof still thin'
        - Two programs active not recruiting and limited disclosed efficacy keep discount high
        - Clear early efficacy would weaken this objection
      - - 'Anti-thesis: valuation already optimistic'
        - ~$1.9B post-money appears ambitious versus public proof
        - Better data or lower entry price would reduce concern
      - - 'Anti-thesis: financing still returns'
        - Capital intensity implies future dilution risk before approval
        - Longer runway or later-stage proof would reduce risk
    notes: >-
      The anti-thesis is not incidental; it is the main reason the recommendation stops short of buy at the reported
      price.
