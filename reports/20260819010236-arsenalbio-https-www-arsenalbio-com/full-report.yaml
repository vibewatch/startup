      - number: '4.2'
        title: Cost structure, unit economics, and the unavoidable capital intensity of autologous cell therapy
        blocks:
          - type: paragraph
            body: >-
              ArsenalBio's cost structure is inferable even when not disclosed numerically. The technology page
              describes autologous manufacturing through CRISPR-based electroporation, single-site insertion, and
              patient-specific production. NCI's description of T-cell transfer therapy underscores the operational
              burden behind that model: collection, ex vivo cell processing, conditioning therapy, infusion, and
              follow-up all create cost and coordination layers. That means the company's future unit economics will
              likely be dominated by CMC, clinical operations, site support, release testing, logistics, and quality
              systems rather than by low-cost software-style delivery. There is nothing inherently wrong with that; it
              is simply the business reality of personalized cell therapy.

              The challenge is that no reviewed public source discloses batch yield, release success rate, manufacturing
              turnaround time, cost per patient, labor intensity, or expected gross margin. The public file therefore
              supports capital intensity but not quantification. Even if CITE or delayed CAR expression ultimately
              improve product consistency or reduce exhaustion, investors still need evidence that those scientific
              advantages translate into better economics. Until that bridge is shown, the prudent stance is to assume
              cell-therapy unit economics remain heavy and incompletely disclosed.
