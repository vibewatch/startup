chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform thesis, and current stage
        blocks:
          - type: paragraph
            body: >-
              Arsenal Biosciences, Inc. presents itself as a clinical-stage programmable cell therapy company focused on
              solid tumors rather than blood cancers. Official company pages repeatedly describe the business as a
              computationally driven and programmable cell therapy developer using a synthetic biology toolkit to
              rewrite patient-derived T cells with multiple coordinated anti-cancer functions. The product concept is
              more ambitious than a simple one-target autologous CAR-T: management says its modules are intended to
              improve growth, specificity, tumor killing, persistence, and resistance to immune evasion, which is why
              the company emphasizes “programmable” rather than conventional CAR-T branding. The same official package
              also makes clear that ArsenalBio is still development stage. Its public pipeline lists AB-1015, AB-2100,
              and AB-3028 as clinical programs and AB-7000 as preclinical, while no source reviewed discloses a marketed
              product or recognized commercial revenue. In practical underwriting terms, this is therefore a private
              clinical-stage platform biotech with real human-study activity, a differentiated engineering story, and a
              business model that still depends on successful clinical translation and future financing rather than
              current product sales.
