      - number: '3.4'
        title: Moat durability, substitution risk, and competitive verdict
        blocks:
          - type: paragraph
            body: >-
              ArsenalBio's moat claim is coherent but still conditional. The company is not presenting itself as another
              generic CAR-T builder. It claims differentiated engineering through non-viral single-site insertion,
              dual-antigen logic gating, and delayed CAR expression designed to support memory phenotype and reduce
              exhaustion. Those are real differentiators on paper, and they map to exactly the problems that have
              limited solid-tumor CAR-T historically. If they translate, ArsenalBio could occupy a meaningful niche even
              beside much larger companies.

              The risk is that scientific novelty alone does not create durable competitive position. Public sources do
              not show ArsenalBio with commercial pricing, large-scale manufacturing output, or broad partner lock-in.
              Competing approaches may also reach workable solid-tumor biology through different design choices, and
              some peers can fail commercially without invalidating their core science. The most likely near-term win
              condition for ArsenalBio is therefore not immediate displacement of Novartis, Gilead, BMS, or Legend. It
              is becoming a credible licensing, co-development, or focused clinical winner in settings where existing
              approaches are still inadequate. That is a conditional moat rather than a settled one.
