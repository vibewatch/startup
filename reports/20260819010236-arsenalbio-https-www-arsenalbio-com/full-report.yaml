      - number: '5.4'
        title: Differentiation, roadmap, and remaining technical gaps
        blocks:
          - type: paragraph
            body: >-
              ArsenalBio's differentiation case is narrow but meaningful. It is strongest where the company can say not
              merely “we have a CAR-T,” but “we insert multiple functions in one place, use logic-gated recognition, and
              intentionally delay CAR surface expression to preserve cell state.” Those are design choices aimed at real
              field bottlenecks. The trial registry also shows that this is not a preclinical-only story: AB-1015,
              AB-2100, and AB-3028 are in human studies, and the newest program is recruiting. That combination
              distinguishes ArsenalBio from a slide-only synthetic-biology concept.

              The open questions remain substantial. Public sources do not reveal detailed freedom-to-operate analysis,
              process-transfer history, manufacturing batch metrics, or human comparative evidence showing that the
              proposed design features deliver superior clinical or operational outcomes. The best underwriting read is
              therefore technical differentiation with incomplete downstream proof. ArsenalBio may have a more
              thoughtful product architecture than many peers, but investors still need stronger evidence that the
              architecture compounds into reproducibility, safety, persistence, and commercial manufacturability.
