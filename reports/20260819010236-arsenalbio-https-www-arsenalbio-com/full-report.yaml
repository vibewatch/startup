            body: >-
              ArsenalBio does have traction proxies, but they are scientific and financing proxies rather than operating
              ones. The company has three human programs on ClinicalTrials.gov, a patient-facing AB-3028 page, a BMS
              collaboration, and a syndicate that includes major biotech and strategic investors. Those facts support
              the conclusion that ArsenalBio is not a science project starved of validation. They do not provide the
              metrics usually needed in a financial chapter: revenue, pipeline contribution by asset, deferred revenue,
              burn, cash balance, pricing intent, headcount growth, utilization, or center activation. Public momentum
              should therefore be interpreted carefully. The company is visibly active and well-funded, but not visibly
              transparent on the numbers that would support operating-underwriting confidence.

              This distinction matters because private biotech financing can create the illusion of operating scale.
              ArsenalBio may be very well resourced, yet still entirely dependent on capital markets and clinical
              progress for economic continuity. The relevant traction KPI today is not customer growth or ARR growth; it
              is conversion of financing into validated clinical and translational progress without a damaging need for
              premature follow-on capital. Public sources are not deep enough to say whether that conversion is
