      - number: '3.2'
        title: Next-generation solid-tumor and platform peers
        blocks:
          - type: paragraph
            body: >-
              The second competitive layer is the set of companies attacking the same “what comes after first-generation
              CAR-T?” question from different angles. Lyell explicitly presents itself as a next-generation CAR-T
              company with product candidates engineered for stronger anti-tumor activity. Imvax positions around
              personalized whole-tumor-derived immunotherapies for solid tumors. Agenus frames itself as a
              better-immunotherapies company with a broad oncology portfolio, while NexImmune emphasizes
              antigen-directed immunotherapies. Turnstone, even after severe public-market compression, remains a
              reference point for solid-tumor cell-therapy ambition because its market-cap collapse shows how quickly
              investor confidence can reset when biology and financing timelines stretch.

              ArsenalBio overlaps with these companies in ambition but not in identical execution. Its own public story
              centers on CITE single-site insertion, logic-gated antigen recognition, delayed CAR surface expression,
              and multi-function programming inside autologous T cells. Some peers emphasize allogeneic or broader
              immunotherapy approaches, while others emphasize different solid-tumor activation strategies. The
              practical consequence is that ArsenalBio is not competing in a one-company lane. It is one of several
              attempts to make cell therapy work better in harder tumor contexts, and partners or investors can choose
              among multiple narratives about how that should be done.
            claimRefs:
