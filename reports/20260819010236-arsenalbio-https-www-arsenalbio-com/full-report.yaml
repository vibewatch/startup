  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, monetization path, and what is not yet revenue
        blocks:
          - type: paragraph
            body: >-
              ArsenalBio should not be modeled as a revenue-generating commercial biotech today. Official pages show a
              clinical-stage pipeline, patient-trial outreach, and a strategic discovery collaboration with Bristol
              Myers Squibb, but no reviewed source discloses marketed-product sales, recurring collaboration revenue,
              milestone receipts, or recognized license revenue. That matters because a private company can look
              financially impressive through financing headlines while still having no operating revenue base. The
              public file supports exactly that reading here. ArsenalBio is investing toward future monetization through
              one or more paths—eventual therapy sales, option and license economics from partnerships, or asset-level
              transactions—but not yet showing the operating results that would let an investor underwrite revenue
              quality.

              The cleanest way to think about the business model is therefore “clinical platform with future therapy and
              partnering optionality.” The BMS discovery collaboration is strategically important because it
              demonstrates that outside pharma counterparties see potential value in the platform, but the public record
              does not disclose option economics, upfront recognition, milestone structure, or royalty shape. Investors
              should treat it as monetization proof-of-interest, not as booked revenue. Public revenue, ARR, or margin
              fields remain null.
            claimRefs:
              - CI001
              - CI002
              - CI003
