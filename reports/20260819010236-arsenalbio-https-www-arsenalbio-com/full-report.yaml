      - number: '8.2'
        title: Valuation context should anchor to milestone risk rather than to category excitement
        blocks:
          - type: paragraph
            body: >-
              ArsenalBio has no public revenue, no disclosed margin structure, and no visible commercial-account base.
              That rules out most conventional operating-company valuation methods. A better lens is milestone-weighted
              platform value with a heavy discount for unresolved proof and timing risk. The market backdrop helps but
              should not dominate the decision. Large published CAR-T market forecasts show that category value can be
              very large, and approved cell-therapy leaders demonstrate that substantial commercial outcomes are
              possible. Still, those examples are ceiling references, not direct comps. For a company at ArsenalBio's
              stage, the right question is whether new proof is likely to justify step-up value from the last round, not
              whether cell therapy as a whole is interesting. Price should move only when evidence does. Because two
              programs are not currently recruiting and public efficacy detail remains sparse, entry discipline should
              stay tight until disclosed clinical or CMC catalysts compress uncertainty.
            claimRefs:
              - CV013
              - CV014
              - CV015
