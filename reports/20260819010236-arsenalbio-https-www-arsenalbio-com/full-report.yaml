      - number: '3.3'
        title: Capability, pricing, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Pricing and distribution power currently sit with approved leaders, not with ArsenalBio or most of its
              direct solid-tumor peers. Public-market-cap data illustrate that clearly. Novartis, Gilead, and Bristol
              Myers Squibb are measured in hundreds of billions of dollars of equity value, while adjacent
              next-generation oncology names such as Lyell, Agenus, and Turnstone are valued in the hundreds of millions
              or less. That does not prove scientific superiority by the large companies; it does show balance-sheet
              asymmetry, commercial infrastructure asymmetry, and tolerance-for-delay asymmetry. ArsenalBio can still
              win scientifically while losing on time, scale, or financing flexibility if progress is slower than
              expected.

              Distribution power matters because CAR-T is not sold through ordinary channels. Site onboarding,
              manufacturing-slot reliability, toxicity-management trust, and reimbursement history create meaningful
              switching costs. ArsenalBio currently has none of the public evidence that would support claims of broad
              center lock-in or payer familiarity. On the other hand, incumbents do not solve ArsenalBio's exact problem
              set either: they remain concentrated in blood-cancer indications, while solid tumors still need new design
              approaches. The competitive question is therefore whether ArsenalBio's biological novelty is large enough
              to overcome its starting disadvantage in scale and distribution.
            claimRefs:
              - CP018
              - CP019
              - CP020
              - CP021
              - CP022
              - CP023
