  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk stack is still led by regulatory and proof risk
        blocks:
          - type: paragraph
            body: >-
              ArsenalBio has the kind of risk profile that often looks attractive in narrative form and punishing in
              real development timelines. The company has visible human-stage programs, a large 2024 Series C, and a
              differentiated technical story, but those positives sit inside an especially unforgiving modality. FDA
              guidance and broader cell-therapy frameworks make clear that solid-tumor CAR-T sponsors must
              simultaneously solve analytical characterization, manufacturing control, clinical design, and safety
              logic. The absence of any approved solid-tumor CAR-T product on the FDA approved-cellular-and-gene-therapy
              list matters because it means ArsenalBio is still operating in an unproven approval category rather than
              iterating inside a well-established commercial blueprint. ClinicalTrials.gov also shows that two of the
              three visible human programs are active not recruiting, which weakens any claim of smooth portfolio
              momentum. The best current interpretation is not that ArsenalBio is broken, but that it still lives
              squarely in a high-uncertainty zone where technical quality, regulator-facing discipline, and
              time-to-proof all dominate the investment case.
