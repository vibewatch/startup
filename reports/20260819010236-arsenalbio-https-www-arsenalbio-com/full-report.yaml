  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Incumbent commercial field and standard-setting competitors
        blocks:
          - type: paragraph
            body: >-
              The first competitive layer is the current approved CAR-T set. The FDA approved-product list and the
              corporate footprints of Novartis, Gilead, Bristol Myers Squibb, and Legend demonstrate that cell therapy
              is already a real commercial category, but one centered in hematologic malignancies. These companies
              benefit from physician familiarity, specialized-center relationships, manufacturing infrastructure,
              safety-management playbooks, and payer precedent that no clinical-stage private company can match
              immediately. Even before product-by-product comparison, that matters structurally: any entrant trying to
              extend CAR-T into new tumor types must clear not just scientific proof, but also an incumbent trust
              advantage.

              ArsenalBio does not directly mirror the approved leaders on indication mix, because its visible programs
              are in ovarian, renal, and prostate cancer rather than in CD19 or BCMA blood-cancer franchises. But those
              leaders still define the market's operational and reimbursement benchmark. They prove that premium
              one-time therapies can become established in the right disease settings, and they set expectations around
              logistics, safety support, and capital requirements. ArsenalBio therefore competes partly by contrast: if
              it cannot show a compelling biological or economic reason to treat solid tumors differently, the
              commercial field will continue to view incumbent hematology CAR-T as the category core and solid-tumor
              entrants as speculative extensions.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
