  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation is price-sensitive, and the anti-thesis still matters
        blocks:
          - type: paragraph
            body: >-
              ArsenalBio is not the kind of company that should be judged only on whether the science sounds advanced.
              It must be judged on what the current implied price already assumes. The public record supports several
              positives: a large Series C, three visible human programs, a differentiated product-tech narrative, and
              strategic signaling from Bristol Myers Squibb. Those facts justify sustained investor attention. But the
              anti-thesis remains powerful. Two visible programs are active not recruiting, no public source disclosed
              meaningful efficacy depth or manufacturability KPIs, and solid-tumor CAR-T still lacks a mature approval
              playbook. That means the current valuation cannot be grounded in demonstrated business fundamentals. It is
              better understood as an option on rare but valuable success. Investors therefore need to separate company
              quality from entry quality. At the rumored ~$1.9 billion post-money, that option may already be priced
              generously relative to current public proof, so the correct call is not indiscriminate optimism but
              disciplined tracking until better evidence arrives.
