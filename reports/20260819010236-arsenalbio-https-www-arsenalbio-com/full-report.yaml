              - CV023
              - CV031
              - CV040
      - number: '8.4'
        title: The next diligence cycle should focus on evidence that can move the recommendation
        blocks:
          - type: paragraph
            body: >-
              The main advantage of a track or research-more stance is that it is highly decisionable. ArsenalBio does
              not need a perfect public package to become more investable; it needs a small number of high-value
              disclosures. The most important are early efficacy detail, enrollment velocity by program and site,
              manufacturability and comparability evidence, and clearer cap-table economics around future dilution or
              preference overhang. Those are the variables that could justify paying above the latest mark. The same
              variables define the thesis-break line. If ArsenalBio cannot convert differentiated science into visible
              human benefit before financing pressure reappears, the story can remain intellectually attractive while
              becoming financially unattractive. Conversely, if AB-2100 or AB-3028 produce genuinely differentiated
              solid-tumor data with operational follow-through, then the current caution would be too conservative.
              Until then, patience is part of the underwriting discipline. Today, however, exit readiness remains low
              for public-market style underwriting on fundamentals alone.
