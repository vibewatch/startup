      - number: '1.2'
        title: Leadership, governance, and institutional network
        blocks:
          - type: paragraph
            body: >-
              The leadership story is credible and unusually well-networked for a private cell-therapy company, but it
              still concentrates around a few visible figures. SEC Form D identifies Kenneth Drazan as an executive
              officer and director and Irene Pleasure as secretary, while the company’s about page highlights a board
              chaired by Sean Parker and includes directors such as Brook Byers and Beth Seidenberg. The broader roster
              matters because it ties ArsenalBio to three powerful institutional networks at once: Parker’s
              immunotherapy philanthropy and platform-building profile, Kleiner Perkins through Byers, and Westlake
              Village BioPartners through Seidenberg. Public descriptions also connect the company to E. John Wherry as
              a co-founder and scientific advisor, reinforcing that ArsenalBio’s scientific identity is tied to academic
              immunology credibility rather than pure financial engineering. That said, governance disclosure remains
              lighter than public-market investors would prefer. No reviewed primary source disclosed ownership split,
              independent-director mix, voting-control structure, or a formal succession plan. The board quality is
              therefore a strength, while key-person dependence on Drazan for company building and on Wherry for
              scientific authority remains a live diligence issue.
