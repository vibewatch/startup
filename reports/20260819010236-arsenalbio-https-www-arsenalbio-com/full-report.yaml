      - number: '5.3'
        title: Manufacturing, quality, and regulatory-development burden
        blocks:
          - type: paragraph
            body: >-
              ArsenalBio's product-tech story only matters if it can survive manufacturing and regulatory reality. FDA's
              2024 guidance on human gene therapy products incorporating genome editing, its 2024 CAR-T development
              guidance, and its 2023 comparability guidance all make the burden explicit: sponsors must show product
              design rationale, manufacturing controls, analytical comparability, and clinical safety logic for
              genome-edited or genetically modified cell products. In other words, the field's key challenge is not only
              inventing a better CAR-T; it is proving that the improved construct can be made reproducibly and changed
              over time without compromising quality.

              ArsenalBio's public materials address this burden directionally but not numerically. The technology page
              says CITE-enabled manufacturing is non-viral, electroporation-based, optimized to reduce time to
              treatment, and intended to improve consistency. ClinicalTrials descriptions show real human-study
              execution and site footprints. Yet no reviewed public source disclosed comparability packages, transfer
              metrics, batch-release performance, or detailed deviation history. The technical verdict is therefore
              promising platform logic plus visible development execution, but still incomplete public evidence on the
              exact quality system that would convert innovation into dependable product maturity.
