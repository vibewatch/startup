  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Program stagnation
        - Older programs remain active not recruiting with no meaningful disclosure
        - Extends time-to-proof and weakens base-case confidence
        - Hold or reduce underwriting aggressiveness
      - - Weak efficacy
        - No credible differentiated response signal in key programs
        - Damages platform option value directly
        - Reprice below last-round optimism
      - - CMC / safety issue
        - Material event slows supply or enrollment
        - Raises discount rate and cash-burn risk
        - Extend diligence and widen downside case
      - - Financing before de-risking
        - New capital needed before stronger proof appears
        - Raises dilution / preference concerns
        - Model down-round or tougher terms
      - - Strong catalyst
        - Durable responses plus operational proof
        - Compresses discount rate and supports step-up
        - Upgrade conviction selectively
    notes: Every trigger is phrased so it can be monitored from public disclosures or a targeted diligence list.
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV039
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Clinical efficacy
        - Program-level response depth, durability, and biomarker context
        - Most direct determinant of scenario probability
        - Request management / data-room clinical package
      - - Enrollment momentum
        - Site-level activation and enrollment velocity by program
        - Clarifies whether active-not-recruiting is benign or concerning
        - Request operations dashboard
      - - Manufacturability
        - Batch success, release, comparability, and turnaround metrics
        - Determines whether science is operationally financeable
        - Request CMC package
      - - Capital structure
        - Preference stack, liquidation terms, and future financing plan
        - Affects return math even if science works
        - Request financing materials and legal docs
      - - Collaboration economics
        - Milestones, options, and governance with BMS
        - Could add or subtract meaningful option value
        - Request collaboration summary or management explanation
    notes: >-
      These asks are prioritized by how quickly they could move recommendation, valuation stance, or downside
      protection.
    claimRefs:
      - CV020
      - CV024
      - CV032
      - CV037
      - CV038
