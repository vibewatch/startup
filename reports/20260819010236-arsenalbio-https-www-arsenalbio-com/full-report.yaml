        - Shows commercialization and financing complexity can still destroy value
        - Useful complexity warning
        - Different disease focus and history
      - - 2seventy bio
        - Cell-therapy commercial / restructuring case
        - Shows how commercialization does not eliminate strategic volatility
        - Useful for downside and complexity framing
        - Post-commercial dynamics differ from ArsenalBio
      - - Legend Biotech
        - Approved-product-adjacent / commercial CAR-T reference
        - Illustrates upside when clinical proof clears
        - Useful upside ceiling reference
        - Too mature for direct pricing anchor
      - - BMS / Gilead / Novartis / Amgen
        - Large-cap sponsors and oncology incumbents
        - Demonstrate scale ceiling and balance-sheet asymmetry
        - Useful for partner / exit context
        - Not like-for-like stage comps
    notes: >-
      This is a selective comparable set spanning downside peers and upside ceiling references, not an exhaustive
      biotech screenset.
