  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - AB-2100 or AB-3028 show standout efficacy and manufacturability evidence improves
        - Step-up above last round becomes reasonable because platform probability rises sharply
        - Data may not replicate or may remain early
        - Requires concrete clinical disclosure
      - - Base
        - Programs continue, but proof remains partial and financing eventually returns
        - Value stays around the last reported private mark with modest drift
        - Time and dilution can offset progress
        - Consistent with current public file
      - - Bear
        - Enrollment stagnates, data disappoint, or capital is needed before de-risking
        - Flat-to-down round logic dominates and preference concerns matter more
        - Weak data plus timing pressure
        - Supported by peer-market cautionary signals
    notes: >-
      Ranges are intentionally qualitative here and made explicit in the valuation-range figure to avoid false
      precision.
