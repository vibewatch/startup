  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and what ArsenalBio is actually selling into
        blocks:
          - type: paragraph
            body: >-
              ArsenalBio should not be modeled against “all oncology” or even “all immunotherapy.” The most useful
              boundary is the CAR-T cell-therapy market plus the adjacent clinical, manufacturing, and partnering
              budgets that support next-generation cell therapies. MarketsandMarkets places the global CAR-T market at
              $5.98 billion in 2025, $6.78 billion in 2026, and $13.56 billion by 2031, while the same source shows the
              broader cell-therapy technologies market at $4.41 billion in 2025 and $7.91 billion by 2030. Those
              top-down numbers confirm that ArsenalBio is operating in a category with meaningful current spend and
              growth rather than in a speculative research niche.

              But the commercial status quo inside that category is still narrow. The FDA’s approved cellular and gene
              therapy list contains leading CAR-T products such as Kymriah, Yescarta, Breyanzi, Carvykti, and Abecma,
              yet those approvals are concentrated in hematologic malignancies. ArsenalBio’s differentiation thesis
              exists precisely because solid tumors remain harder. Its public pipeline targets ovarian cancer,
              clear-cell renal cell carcinoma, and metastatic castration-resistant prostate cancer, which are large
              medical-need areas but not currently validated commercial CAR-T end markets. The right market boundary is
              therefore “future solid-tumor CAR-T and partnerable next-generation cell therapy,” not “all cancer drug
              spend.”
