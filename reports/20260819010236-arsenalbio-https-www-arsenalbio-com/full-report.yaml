      - number: '2.2'
        title: Buyer, user, payer, and institutional adoption path
        blocks:
          - type: paragraph
            body: >-
              CAR-T therapies move through a specialized institutional channel rather than a broad
              physician-prescription channel. The end beneficiary is the patient, but the operational buyer stack
              includes oncologists, academic cancer centers, apheresis and cell-processing teams, pharmacy and
              reimbursement groups, and public or private payers that absorb very high one-time treatment costs. NCI’s
              T-cell transfer therapy page underlines the process burden: cells are collected, modified outside the
              body, reinfused after conditioning therapy, and monitored through an intensive care pathway. That
              structure makes adoption slower and more capital-intensive than ordinary oncology drugs even before price
              is discussed.

              For ArsenalBio the current “customer” base is even narrower because the company remains clinical stage.
              Today the relevant demand signals are trial sites, investigators, patients willing to enroll, and pharma
              partners looking for differentiated solid-tumor cell therapy approaches. ClinicalTrials.gov shows that
              AB-2100 and AB-3028 already involve major U.S. cancer centers such as City of Hope, Mayo Clinic,
              Dana-Farber, Memorial Sloan Kettering, MD Anderson, UCSF, Fred Hutchinson, and others. That is important
              because it demonstrates institutional willingness to run the studies. It does not yet demonstrate routine
              commercial reimbursement or broad treated-patient throughput. The market path still runs through evidence
              generation, site confidence, manufacturing execution, and payer acceptability.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
