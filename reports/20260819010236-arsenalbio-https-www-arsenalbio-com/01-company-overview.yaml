company:
  name: Arsenal Biosciences
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Arsenal Biosciences is a South San Francisco clinical-stage cell-therapy company building programmable autologous CAR-T products for solid tumors. The public file is strongest on platform identity, trial progression, and capital formation: SEC records confirm a $325.35 million Series C filed on 2024-09-04 with 26 investors, while company and ClinicalTrials.gov materials show three human programs and one disclosed preclinical program. The underwriter's biggest open issues are operating scale and proof depth rather than existence: public sources do not disclose revenue, headcount, or a primary filing-based post-money valuation, and the two older clinical programs are active but no longer recruiting.
sections:
  - id: identity-platform-and-stage
    title: Identity, platform thesis, and current stage
    body: >-
      Arsenal Biosciences, Inc. presents itself as a clinical-stage programmable cell therapy company focused on solid tumors rather than blood cancers. Official company pages repeatedly describe the business as a computationally driven and programmable cell therapy developer using a synthetic biology toolkit to rewrite patient-derived T cells with multiple coordinated anti-cancer functions. The product concept is more ambitious than a simple one-target autologous CAR-T: management says its modules are intended to improve growth, specificity, tumor killing, persistence, and resistance to immune evasion, which is why the company emphasizes “programmable” rather than conventional CAR-T branding. The same official package also makes clear that ArsenalBio is still development stage. Its public pipeline lists AB-1015, AB-2100, and AB-3028 as clinical programs and AB-7000 as preclinical, while no source reviewed discloses a marketed product or recognized commercial revenue. In practical underwriting terms, this is therefore a private clinical-stage platform biotech with real human-study activity, a differentiated engineering story, and a business model that still depends on successful clinical translation and future financing rather than current product sales.
    claimRefs: [CO001, CO002, CO003, CO016, CO018, CO019, CO030, CO031, CO032]
    tableRefs: [TO001]
    figureRefs: [FO002, FO003]
  - id: leadership-governance-and-institutional-network
    title: Leadership, governance, and institutional network
    body: >-
      The leadership story is credible and unusually well-networked for a private cell-therapy company, but it still concentrates around a few visible figures. SEC Form D identifies Kenneth Drazan as an executive officer and director and Irene Pleasure as secretary, while the company’s about page highlights a board chaired by Sean Parker and includes directors such as Brook Byers and Beth Seidenberg. The broader roster matters because it ties ArsenalBio to three powerful institutional networks at once: Parker’s immunotherapy philanthropy and platform-building profile, Kleiner Perkins through Byers, and Westlake Village BioPartners through Seidenberg. Public descriptions also connect the company to E. John Wherry as a co-founder and scientific advisor, reinforcing that ArsenalBio’s scientific identity is tied to academic immunology credibility rather than pure financial engineering. That said, governance disclosure remains lighter than public-market investors would prefer. No reviewed primary source disclosed ownership split, independent-director mix, voting-control structure, or a formal succession plan. The board quality is therefore a strength, while key-person dependence on Drazan for company building and on Wherry for scientific authority remains a live diligence issue.
    claimRefs: [CO004, CO005, CO006, CO007, CO008, CO009, CO012, CO021, CO033, CO034]
    tableRefs: [TO002, TO003]
  - id: funding-base-and-trial-momentum
    title: Funding base, investor syndicate, and trial momentum
    body: >-
      ArsenalBio’s public funding file is much stronger than its operating disclosure. The clearest primary evidence is the 2024 SEC Form D, which shows a Series C raise of $325,352,578, a date of first sale of 2024-07-09, filing date 2024-09-04, and 26 investors. Company, financing, and venture-partner coverage also point to a syndicate that includes ARCH Venture Partners, SoftBank Vision Fund 2, Regeneron Ventures, NVentures, Parker Institute for Cancer Immunotherapy, and Bristol Myers Squibb, with additional support from crossover and sector investors. Multiple news reports tie that financing to an implied valuation of roughly $1.9 billion post-money, though the accessible filing itself does not disclose valuation terms and the number should therefore be treated as high-profile press triangulation rather than a filing-certified fact. Operationally, the capital raise fits a real development arc. ClinicalTrials.gov shows AB-1015 started in November 2022, AB-2100 started in February 2024, and AB-3028 began recruiting in January 2026. The money was not raised into a concept deck; it was raised into a live multi-program clinical platform. Even so, the two older studies now show active-not-recruiting status, so the clinical clock is moving more slowly than a pure financing headline would imply.
    claimRefs: [CO010, CO011, CO013, CO014, CO015, CO017, CO024, CO025, CO026, CO028, CO029]
    tableRefs: [TO004]
    figureRefs: [FO001]
  - id: milestone-readout-and-main-open-questions
    title: Milestone readout, external validation, and main open questions
    body: >-
      The milestone file supports a serious company, but not yet a fully underwritable one. ArsenalBio has now shown enough external signals to clear the “is this real?” threshold: official pages, SEC records, and ClinicalTrials.gov together confirm a private company with large-capital backing, multiple human studies, a disclosed BMS collaboration, patient-facing trial outreach, and a differentiated engineering narrative centered on CITE-based chromosome-11 insertion and logic-gated targeting. The site footprint on AB-2100 and AB-3028 also matters because it includes major centers such as City of Hope, Dana-Farber, Memorial Sloan Kettering, MD Anderson, Mayo Clinic, and Fred Hutchinson, indicating that high-quality institutions are willing to participate in the company’s studies. The unresolved questions are commercial and translational rather than existential. Public sources still do not disclose revenue, headcount, manufacturing cost per patient, or durable efficacy data. More importantly, the FDA’s list of approved cell and gene therapies still contains approved CAR-T products for hematologic malignancies but no approved solid-tumor CAR-T, which keeps ArsenalBio in a category with real upside but historically difficult precedent. The result is a company with unusually strong ingredients for a private cell-therapy platform and equally real execution risk.
    claimRefs: [CO020, CO022, CO023, CO027, CO035, CO036]
