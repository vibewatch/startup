  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: valuation
      missingEvidence: A filing-based or company-confirmed post-money valuation for the 2024 Series C.
      whyItMatters: Press-reported implied valuation is useful but not definitive for underwriting entry price and dilution.
      diligencePath: Obtain the financing term sheet, updated cap table, or board-approved financing summary.
      relatedQuestionRefs: [QO011, QO025]
    - type: private-evidence-only
      severity: material
      topic: operating-metrics
      missingEvidence: Revenue, headcount, customer-count, and manufacturing-throughput disclosures.
      whyItMatters: Without these numbers the company cannot be benchmarked on commercial scale or operating leverage.
      diligencePath: Request management KPI pack and monthly operating dashboard.
      relatedQuestionRefs: [QO013, QO014, QO025]
    - type: missing-source
      severity: material
      topic: governance
      missingEvidence: Detailed board composition, independent-director status, ownership split, and succession planning materials.
      whyItMatters: Key-person and control risk cannot be fully assessed from the public file alone.
      diligencePath: Request governance deck, cap table, and board observer/right schedule.
      relatedQuestionRefs: [QO007, QO025]
      relatedTableRefs: [TO002]
    - type: stale
      severity: material
      topic: trial-progress
      missingEvidence: Current topline efficacy, safety, and dose-selection disclosures for AB-1015 and AB-2100.
      whyItMatters: The active-not-recruiting status on older studies can reflect maturity, pause, or slow progress, and those implications differ materially.
      diligencePath: Review investigator presentations, ASCO/SITC abstracts, or management clinical-update deck.
      relatedQuestionRefs: [QO016, QO017, QO024]
      relatedTableRefs: [TO004]
    - type: missing-source
      severity: minor
      topic: founding-date and stakeholder-map
      missingEvidence: A primary source explicitly disclosing ArsenalBio's exact incorporation or launch date.
      whyItMatters: The public file supports approximate company age but not an exact founding date from the sources reviewed here.
      diligencePath: Pull Delaware incorporation records or a company-authorized history page with an explicit founding date.
      relatedQuestionRefs: [QO002]
      relatedTableRefs: [TO003]
