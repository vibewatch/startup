      - number: '4.2'
        title: 'GTM motion and unit economics: high-touch deployments, low public observability'
        blocks:
          - type: paragraph
            body: >-
              Goodfire's public GTM looks selective and high touch. The Series B post says the company engages deeply
              and selectively with teams building high-stakes or frontier systems, while the contact page describes a
              platform used by large enterprises, healthcare institutions, and AI research labs. The customer-story
              material shows why this matters financially: in the Prima Mente engagement, Goodfire researchers embedded
              with the customer and built a biomarker discovery pipeline around the customer's model. The terms of use
              also describe support, technical assistance, field engineering support, research activities, collaboration
              activities, and deliverables. Together, these sources suggest that at least some deployments are not pure
              seat-based software subscriptions; they likely combine platform access with bespoke scientific or
              engineering work.


              That has two opposite implications. On the positive side, embedded work can accelerate design-partner
              conversion, widen the product moat, and justify premium enterprise pricing. It can also make Goodfire
              useful in high-stakes domains where customers need interpretation help, not just dashboards. On the
              negative side, services-heavy revenue generally scales more slowly and often carries a weaker gross-margin
              profile than pure software. Public sources do not reveal how much of Goodfire's revenue, if any, comes
              from software usage, annual licenses, pilots, or research services. They also do not disclose customer
              counts, pilot-to-production conversion, sales cycle length, retention, CAC, or payback.


              The technical proof points are meaningful but not financial metrics. Goodfire's RLFR research claims a 58
              percent hallucination reduction at roughly 90 times lower cost than an LLM-as-a-judge approach, and the
              life-sciences case studies show credible customer-value stories in diagnostics and scientific discovery.
              Those are strong commercialization narratives, but they are not the same as disclosed revenue quality. For
              this reason the unit economics bridge is qualitative. It shows the likely path from a selective design
              partnership to contracted software and overages, while making clear that the realized values at each step
              are private.
