          - type: callout
            title: What is genuinely impressive
            body: >-
              The research bench, collaborator set, and investor roster are all real strengths. Goodfire is not a
              generic “AI wrapper” story: it has distinct technical work across steering, neural geometry, genomics, and
              model decomposition, plus credible enterprise-readiness signals like SOC 2 Type II. That is why the
              company belongs on a high-priority diligence list.
            calloutType: strength
            claimRefs:
