  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      Directional sensitivity of valuation conviction; positive bars strengthen willingness to pay, negative bars weaken
      it.
    data:
      items:
        - label: Proven repeatable software ARR
          value: 3
          description: Would materially increase confidence in the bull case.
        - label: Partner-to-paid conversion proof
          value: 2
          description: Would support scalable commercialization rather than bespoke work.
        - label: SOC 2 / trust readiness
          value: 1
          description: Supports high-stakes enterprise deployment credibility.
        - label: No public ARR or pricing disclosure
          value: -3
          description: Largest single drag on valuation confidence.
        - label: Category budget captured by observability vendors
          value: -2
          description: Would shrink Goodfire's unique wedge.
        - label: Private AI multiple compression
          value: -2
          description: Would push even strong companies toward the base or bear case.
    approximationNotes: >-
      Sensitivity bars are directional conviction scores, not dollar deltas, because public revenue disclosure is
      absent.
    claimRefs:
