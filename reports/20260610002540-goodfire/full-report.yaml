  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: >-
      Public evidence points to a selective enterprise journey: identify a high-stakes model problem, engage Goodfire as
      a design partner, work in a shared environment, validate technical gains, and then expand into broader monitoring
      or research programs.
    data:
      items:
        - label: Problem recognition
          value: Model team identifies black-box failure, safety, or scientific-discovery bottleneck
          note: >-
            Salesforce Ventures and Goodfire both frame the initial pain around ROI, reliability, and inability to steer
            models precisely.
        - label: Request access / scoping
          value: Prospect contacts Goodfire for early access or partnership discussion
          note: The public sales motion is contact-led and selective rather than self-serve.
        - label: Shared environment setup
          value: Goodfire provides model design environment access and instrumentation
          note: Series B materials say Goodfire collaborates with customers in a shared environment.
        - label: High-touch technical work
          value: Goodfire scientists or engineers help interpret, debug, or steer the customer model
          note: >-
            Prima Mente explicitly describes embedded Goodfire researchers; Mayo, Arc, and Radical imply similar deep
            collaboration.
        - label: Outcome validation
          value: >-
            Customer evaluates technical outputs such as biomarker hypotheses, PII guardrails, or candidate-material
            quality
          note: Outcomes are measurable, but often technical rather than commercial.
        - label: Follow-on deployment / expansion
          value: Customer continues with production guardrails, ongoing research, or broader model-design work
          note: >-
            Rakuten is the clearest production deployment; Arc and Mayo show follow-on public continuity but not
            disclosed renewals.
    claimRefs:
      - CU001
      - CU003
      - CU009
      - CU011
      - CU017
      - CU022
      - CU029
      - CU032
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: standard
    summary: >-
