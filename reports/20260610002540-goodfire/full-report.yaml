      - number: '5.3'
        title: Trust, quality, and compliance posture
        blocks:
          - type: paragraph
            body: >-
              Goodfire's public trust posture is more mature on enterprise security than on public operational
              transparency. The strongest visible procurement signal is the company's SOC 2 Type II announcement, which
              says the audit completed with no exceptions and is accompanied by a public SOC 3 summary. Health-facing
              materials add another layer by describing Mayo-specific privacy protocols and governance frameworks
              designed to reduce spurious correlations and improve clinical relevance. Those are meaningful indicators
              for buyers in regulated environments.


              The legal surface, however, makes clear that many of the operational details investors and enterprise
              architects normally want to inspect are still private. The terms of use define the platform broadly to
              include software, APIs, tools, documentation, support, and services, but the concrete economics live in
              negotiated order forms. Usage reports are authoritative for billing, overages exist, and pilots are
              explicitly provided on an AS IS basis unless an order form says otherwise. Public terms also reserve
              suspension rights for security, legal, operational, and payment reasons and allow third-party products
              into the delivery stack.


              This is credible enterprise contract scaffolding, but it still leaves important diligence gaps. Public
              materials do not disclose a self-serve API reference, a public status page, deployment-count evidence,
              tenancy architecture, or quantitative uptime history. That matters because the external frameworks
              Goodfire is selling into are increasingly intolerant of black-box governance. NIST focuses on
              trustworthiness across design, development, use, and evaluation, while Gartner warns that hidden
              governance and change-management costs can dominate ROI in high-stakes GenAI deployments. Goodfire is
              directionally aligned with those buyer needs, but still early in how much public operating evidence it
              exposes.
