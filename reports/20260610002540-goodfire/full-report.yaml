      funnel: Goodfire appears to move from selective prospecting to shared-environment work, technical validation, and
      only occasionally disclosed production rollout.
    data:
      nodes:
        - id: prospect
          label: Selective prospect
          detail: >-
            Frontier lab, healthcare institution, enterprise AI team, or model builder with a high-stakes
            interpretability problem
          type: input
        - id: access
          label: Request access
          detail: Contact-led evaluation; no public self-serve pricing or checkout
          type: process
        - id: workspace
          label: Shared workspace
          detail: Goodfire deploys its model design environment forward with customers
          type: process
        - id: engagement
          label: Deep technical engagement
          detail: Interpretability experiments, probes, steering, or embedded research support
          type: process
        - id: validation
          label: Technical validation
          detail: Customer evaluates quantified gains such as biomarker signal, PII recall, or candidate-material quality
          type: process
        - id: production
          label: Production / follow-on
          detail: Production guardrail deployment or ongoing multi-phase research relationship
