      - number: '2.3'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand-side conditions are favorable. PwC shows that AI-exposed industries are generating materially
              higher revenue per worker and paying a large skills premium, which suggests real willingness to fund tools
              that make AI systems more effective. At the same time, adjacent vendors repeatedly frame observability,
              guardrails, and evaluation as business-critical because autonomous systems now touch revenue, operations,
              and user experience. That helps Goodfire because it means the budget conversation already exists; the
              company does not need to invent the importance of reliability or control from scratch. Its scientific and
              regulated use cases also line up with the places where output-only evaluation is least sufficient and
              where deeper interpretability has the most strategic value.


              The brakes are equally important. Gartner says ROI varies widely and hidden implementation costs can be
              large. NIST-style governance expectations, data privacy rules, and clinical or scientific validation
              standards all slow deployment. Most importantly, Goodfire's own story and independent reporting agree that
              the field is still technically immature: the company markets precision engineering, but external critics
              and even Goodfire's own research papers acknowledge that interpretability still has major open problems.
              Combined with the requirement for model-internal access and the lack of public pricing or customer data,
              that means valuation should anchor on a selective high-value wedge rather than a mass-market software
              assumption.
