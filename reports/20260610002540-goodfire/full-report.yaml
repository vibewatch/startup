      - number: '8.2'
        title: Evidence-Constrained Valuation Framework and Comparable Marks
        blocks:
          - type: paragraph
            body: >-
              Because revenue is undisclosed, a conventional revenue-multiple model would create false precision. The
              right method is to combine comparable private valuation marks with scenario logic anchored on what is and
              is not public. The comparable set is useful less as a formula than as a discipline check. Anysphere,
              Harvey, and Glean all carried disclosed ARR when reporters attached multibillion-dollar marks to them,
              while Anthropic sits in a wholly different frontier-model and compute-scarcity universe. Goodfire does not
              belong in Anthropic territory, and unlike Anysphere, Harvey, or Glean it has not publicly shown the
              recurring revenue base that would let outside investors defend a multiple. That forces the current round
              to be interpreted as strategic option value.


              The bull, base, and bear cases therefore turn on milestone conversion rather than spreadsheet
              extrapolation. In the bull case, Goodfire proves that Ember converts design partners and research
              collaborators into repeatable software revenue, keeps shipping differentiated interpretability
              breakthroughs, and becomes a must-have layer for high-stakes AI deployment. In the base case, the category
              is real and Goodfire remains one of its strongest independent teams, but commercialization is still early
              and high-touch; that warrants a discount to the last round, not a premium. In the bear case, research
              remains impressive but budgets flow toward observability, guardrails, or frontier labs themselves, leaving
              Goodfire with a bespoke-services profile and a materially lower valuation. On this framing, the February
              2026 round sits near the bottom of the bull range rather than in the middle of the base range.
