  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Goodfire's commercial surface is best understood as a model-design environment rather than as a generic
              LLM observability dashboard. Silico is presented as the first platform for intentional model design, a
              workspace for training and debugging models on Goodfire infrastructure, and a system that packages
              productized interpretability around concrete jobs: seeing inside predictions, running health checks,
              debugging failures, shaping behavior, and improving generalization. The practical consequence is that the
              product sits much closer to model-development loops than to standard application-layer analytics.


              The customer workflow is also unusually high touch. Public pages repeatedly push teams into request-access
              or partnership motions instead of a self-serve onboarding path. In practice, the workflow starts with a
              model team that already controls weights, activations, or at least enough internals to let Goodfire
              inspect how the model behaves. Goodfire then pulls models, datasets, prompts, workflows, and evaluation
              tasks into a shared workspace, runs agent-assisted experiments, and translates the resulting mechanistic
              findings into interventions such as steering, diagnostics, data filtering, or reward shaping.


              The vertical pages show the same loop repeated across domains. Language teams use the stack to reduce
              hallucinations; life-sciences teams use it to extract biomarkers and variant hypotheses from model
              internals; robotics and vision teams use it to catch brittle features and leakage before deployment. The
              result is a product with real workflow specificity, but one that still depends on customer willingness to
              operate in a shared, research-adjacent environment rather than through a mature, commodity API surface.
