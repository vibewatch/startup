          low: 350
          base: 475
          high: 650
          unit: $M
          description: Commercialization stays bespoke or the category re-rates lower; about 0.3x-0.5x versus the round price.
        - label: Base case
          low: 800
          base: 950
          high: 1100
          unit: $M
          description: Real category potential but incomplete commercial proof; about 0.6x-0.9x versus the round price.
        - label: Bull case
          low: 1250
          base: 1500
          high: 1850
          unit: $M
          description: Repeatable software revenue plus durable enterprise adoption; about 1.0x-1.5x versus the round price.
        - label: Current round reference
          low: 1250
          base: 1250
          high: 1250
          unit: $M
          description: February 2026 Series B anchor used for return framing.
    approximationNotes: >-
      These are scenario ranges built from public comparables and milestone logic; they are not a substitute for
