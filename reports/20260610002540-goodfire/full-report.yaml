  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, regulatory, and contract risk
        blocks:
          - type: paragraph
            body: >-
              Goodfire's legal and regulatory posture is strong enough to clear initial enterprise diligence, but not
              yet strong enough to erase downside transfer. The positive evidence is real: Goodfire says it has achieved
              SOC 2 Type II, Mayo describes work under rigorous privacy and governance protocols, and the company frames
              interpretability as the bridge that makes sensitive AI use cases more governable. The harder underwriting
              read comes from the contracts. Default terms disclaim warranties around uninterrupted, secure, accurate,
              or error-free service; pilot and evaluation modes can operate without security or support commitments
              unless an order form says otherwise; and aggregate liability is capped to fees paid. Those are normal
              startup-software positions, but for a platform aimed at healthcare, safety, and potentially critical-
              infrastructure workflows they leave customers carrying a meaningful share of outage, breach, and
              deployment risk.

              Data-rights posture is the second sharp edge. The TOS gives Goodfire broad rights over Usage Data and a
              perpetual license over Workflow Data for improvement, evaluation, training, and commercialization, while
              also assigning feedback IP to Goodfire. That may be commercially rational for a research-driven platform,
              but it can slow procurement in regulated settings where customers want hard separation between operational
              traces, model behavior, and vendor product improvement. NIST's generative-AI profile and 2026
              critical-infrastructure concept note both point toward more explicit risk controls, and Gartner likewise
              emphasizes governance, cost discipline, and realistic measurement as adoption gates. The upshot is that
              Goodfire does not appear to face public litigation or enforcement today, but it does face a
              contract-and-governance burden: if order forms do not materially improve on the default paper, expansion
              into regulated workloads will be slower than the brand narrative implies.
            claimRefs:
