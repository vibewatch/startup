            body: >-
              Goodfire's public customer story centers on organizations that build or fine-tune foundation models rather
              than end-user application buyers. The clearest broad segmentation claim comes from the company's contact
              page, which says the platform is used by Fortune 500 enterprises, major healthcare institutions, and AI
              research labs. Product pages sharpen that picture: Silico is pitched to teams training or fine-tuning
              models across architectures and modalities, the language page targets LLM developers who want to predict
              failures and improve behavior without retraining from scratch, the life-sciences page targets genomics and
              scientific-model teams, and the robotics / vision page targets physical-AI and medical-imaging workflows.
              Across those surfaces, the likely economic buyer is an R&D, platform, or product owner responsible for
              model performance and reliability, while the day-to-day users are research scientists, ML engineers, and
              interpretability specialists.


              The important caveat is that Goodfire does not translate those segment claims into counts, revenue mix, or
              named enterprise references. Public materials do not disclose customer count, ARR, segment share, or a
              list of the Fortune 500 users behind the broad enterprise claim. The public proof set is therefore much
              deeper in vertical specificity than in commercial breadth: named evidence clusters in genomics, clinical
              research, AI-agent safety, and materials discovery, with the rest of the enterprise narrative still mostly
              unenumerated. That asymmetry suggests a selective, high-touch go-to-market motion in which Goodfire wins a
              small number of technically sophisticated design partners first and only later may broaden toward more
