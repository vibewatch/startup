    summary: >-
      The public workflow starts with a partner-led access motion, moves through shared interpretability experiments,
      and ends in targeted steering or design decisions.
    data:
      nodes:
        - id: n1
          label: Model team requests access
          detail: Request-access / partnership motion rather than public self-serve signup
          type: input
        - id: n2
          label: Pilot or scoping phase
          detail: Goodfire and customer define evaluation scope and working terms
          type: process
        - id: n3
          label: Models, data, and workflows connected
          detail: Customer materials and tasks enter the shared workspace
          type: process
        - id: n4
          label: Agent-assisted experiments run
          detail: Silico agents and researchers inspect activations, pathways, and failure modes
          type: process
        - id: n5
          label: Interpretable signals surfaced
          detail: Features, manifolds, probes, or bottlenecks become legible
          type: process
        - id: n6
          label: Targeted intervention selected
          detail: Steering, filtering, reward shaping, or redesign choice
          type: process
        - id: n7
          label: Validation and review
          detail: Buyer checks reliability, science, or deployment implications
          type: output
        - id: n8
          label: Commercial or ongoing research expansion
          detail: Pilot converts to longer commercial or collaborative program
          type: output
      edges:
        - from: n1
          to: n2
          label: Access motion
        - from: n2
          to: n3
          label: Scope and permissions
