      - number: '8.3'
        title: Exit Discipline, Thesis-Break Triggers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The near-to-mid-term exit path is almost certainly another private round or a strategic transaction, not
              an IPO. Goodfire is too early and too opaque publicly for public-market underwriting: investors do not
              have audited revenue scale, margin profile, or even a basic customer-count disclosure. That does not make
              the company unattractive; it makes the investment case diligence-dependent. The practical implication is
              that entry discipline must focus on the missing proof points that would move Goodfire from “exceptional
              research company with commercial promise” to “underwritable software infrastructure business.” Those proof
              points are recurring revenue quality, standard pricing, concentration, gross margin, and the post-Series-B
              preference stack.


              The thesis can also break in observable ways. If collaborators fail to convert into repeatable customers,
              if management cannot disclose convincing revenue quality under NDA, or if budget holders decide that
              tracing, monitoring, and guardrails from adjacent vendors are sufficient without Goodfire's deeper
              internal-control layer, the current price becomes difficult to defend. Conversely, if Goodfire can show
              repeatable software subscriptions, strong partner conversion, and evidence that interpretability is
              becoming mandatory infrastructure in regulated and high-stakes deployments, the round can grow into
              itself. Until that evidence is produced, the disciplined posture is to keep Goodfire on the front of the
              watchlist, continue diligence aggressively, and avoid treating the February 2026 price as a proven
              bargain.
            claimRefs:
