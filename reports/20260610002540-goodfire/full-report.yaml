      - number: '3.4'
        title: Moat durability and competitive risk
        blocks:
          - type: paragraph
            body: >-
              Goodfire’s moat case is easiest to believe when the buyer values mechanistic understanding itself. The
              company can point to feature steering, data attribution, PII-detection probes, and domain work in biology
              and robotics as evidence that model internals can be used for debugging, safety, and scientific discovery
              rather than just post-hoc monitoring. That gives it a more research-native product story than adjacent
              evaluation vendors. But the adverse evidence matters. MIT Technology Review quotes an outside
              mechanistic-interpretability researcher arguing that Goodfire may be adding precision to today’s alchemy
              rather than turning AI into a fully principled engineering discipline. The same article notes that Silico
              is most useful where customers can access model weights, limiting applicability on closed frontier models.
              OnHealthcare also frames the company as a 51-person, research-first organization valued aggressively
              relative to disclosed commercial traction. The highest-risk scenarios are therefore clear: larger
              observability vendors adding explain-and-steer features, frontier labs keeping the deepest
              interpretability advantages in-house, or customers deciding that trace-level controls are sufficient.
              Goodfire can still win if it becomes the default model-design layer for open-weight and domain-specific AI
              programs, but that durability is not yet proven by public win-rate, pricing, or retention evidence.
