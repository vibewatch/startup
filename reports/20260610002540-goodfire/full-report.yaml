  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Goodfire's relevant market is narrower than headline AI enthusiasm. Its own materials describe a product
              stack built around understanding model internals, debugging failures, steering behavior, shaping training,
              and in some cases monitoring production behavior. That boundary excludes generic copilots, general
              application observability, and AI infrastructure spend that never reaches a model-design workflow. The
              closest public analogs are LLM observability and evaluation vendors such as Arize, Fiddler, Datadog,
              LangSmith, Langfuse, Humanloop, Arthur, and Patronus, but even those mostly instrument prompts, traces,
              sessions, and outputs rather than model parameters or latent representations.


              Because Goodfire does not disclose pricing, customer count, or revenue, a classic TAM-SAM-SOM stack would
              overstate precision. The evidence-constrained approach is to use multiple lenses instead: first, macro
              demand signals that show AI usage and ROI pressure are spreading; second, published adjacent-tool pricing
              that establishes a software-budget floor for teams already buying observability and eval products; and
              third, an access lens that narrows the reachable market to organizations able to provide model internals
              and tolerate a services-heavy pilot motion. That combination supports a real but selective market, with
              more near-term substance in advanced model teams than in generic enterprise AI narratives.
