  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Revenue model and pricing surface: software is visible, economics are not'
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a commercial product, but not a public price book. Goodfire's official surface
              describes Silico as a model-design environment and workspace for training and debugging models on Goodfire
              infrastructure, and the vertical pages repeatedly invite teams training or fine-tuning foundation models
              to request access rather than self-serve into a public checkout flow. The contact page goes further,
              saying the platform is already used by Fortune 500 enterprises, major healthcare institutions, and AI
              research labs. Those statements support the existence of an enterprise product and an enterprise target
              market. They do not disclose the actual commercial terms those customers accept.


              The legal documents make the pricing posture clearer. The master services agreement and terms of use both
              push commercial economics into negotiated order forms. The terms explicitly contemplate fees, overage
              charges when usage exceeds contracted allotments, and dashboard or usage-report records that are
              authoritative for billing. The pilot agreement separately states that pilot access is for internal
              evaluation and that a separate commercial license is required after the evaluation period. That
              combination points to a monetization stack built around custom contracts rather than public list pricing:
              pilot fees, commercial platform fees, usage-based overages, and potentially additional service charges.


              What remains unavailable is the part investors actually need to underwrite. None of the reviewed public
              pages disclose list price, minimum annual commit, support tier pricing, discount ladders, or realized
              pricing by customer type. The pricing / monetization table therefore distinguishes verified commercial
              mechanisms from missing economics. The absence of public prices is not unusual for enterprise AI
              infrastructure, but it means external readers cannot infer ACV, customer segmentation, or software gross
              margin from the official surface alone. The right conclusion is not that Goodfire lacks revenue; it is
              that Goodfire has chosen a negotiated, opaque commercial posture.
