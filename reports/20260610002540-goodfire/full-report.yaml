chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and product positioning
        blocks:
          - type: paragraph
            body: >-
              Goodfire presents itself as a research company using interpretability to understand, learn from, and
              design AI systems, and multiple official and financing sources describe it as a San Francisco-based public
              benefit corporation. The company’s central thesis is that frontier AI is still built too much as a black
              box, so its mission is to make models understandable, debuggable, and shapeable rather than relying on
              scale alone. Official materials consistently frame the business around a “model design environment” that
              helps users inspect model internals, diagnose failure modes, and intervene on behavior at the feature or
              circuit level.


              The product story has matured over time. Series A materials in 2025 centered on Ember as Goodfire’s
              flagship interpretability platform, while by 2026 the public-facing product page markets Silico as the
              first platform for intentional model design. The go-to-market motion appears selective rather than
              mass-market: Goodfire says it works with Fortune 500 enterprises, major healthcare institutions, and AI
              research labs, and its public product copy repeatedly targets organizations training or fine-tuning
              foundation models. Public evidence therefore supports a company identity that combines research lab,
              platform vendor, and design-partner model, with customer concentration and commercial scale still largely
              undisclosed.
