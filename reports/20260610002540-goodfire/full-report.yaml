      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: research-more at the current price'
            body: >-
              Goodfire looks like one of the strongest independent interpretability companies in the market, but the
              public record still supports the company more clearly than it supports the valuation. At $1.25B, investors
              are already paying for a meaningful portion of the commercialization thesis. Until ARR, pricing,
              retention, and cap-table terms are disclosed under diligence, this should be treated as a research-more
              name rather than a buy.
            calloutType: recommendation
            claimRefs:
              - CV001
