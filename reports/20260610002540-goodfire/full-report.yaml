  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape by competitor class
        blocks:
          - type: paragraph
            body: >-
              Goodfire sits in an unusual competitive slot. Its public product language is not about post-hoc prompt
              monitoring or generic LLM telemetry; it is about intentional model design, feature steering, targeted
              failure correction, and programmatic access to model internals. MIT Technology Review frames Silico as a
              mechanistic-interpretability tool that puts techniques previously concentrated inside Anthropic, OpenAI,
              and Google DeepMind into the hands of smaller firms and research teams. That makes internal frontier-lab
              interpretability groups and sophisticated in-house research teams the closest direct alternatives for
              buyers building or adapting open-weight models. The broader commercial landscape is more crowded but more
              indirect. Arize Phoenix, LangSmith, Langfuse, Datadog, Fiddler, Arthur, and former platforms such as
              Humanloop all compete for budget tied to trustworthy AI development, yet their default control point is
              tracing, evaluation, guardrails, or governance around deployed systems rather than deep editing of learned
              representations. The practical implication is that Goodfire should be judged less like another
              observability dashboard and more like a new tooling layer for model builders who need mechanistic
              understanding before, during, and after training.
