      - number: '1.4'
        title: Chronology, cover metrics, and key diligence risks
        blocks:
          - type: paragraph
            body: >-
              The public chronology is short but dense. Goodfire surfaces from seed financing in 2024, announced its
              Series A in April 2025, publicized the Mayo Clinic collaboration in September 2025, launched a fellowship
              program and field-building educational content in late 2025, and then announced its Series B and broader
              intentional design agenda in February 2026. By April 2026, MIT Technology Review covered Silico as a
              commercial product for debugging and steering models, and by May 2026 Goodfire was emphasizing SOC 2
              certification and a growing enterprise-facing posture. This sequence shows a company trying to convert
              cutting-edge interpretability research into product and partnership credibility in under two years.


              The key cover-metric pattern is asymmetry: valuation and capital raised are well supported, while
              operating metrics remain sparse. No reviewed public source discloses revenue, ARR, or customer count.
              Headcount is not officially disclosed; one independent profile estimates about 51 employees as of January
              2026. That opacity matters because the most credible adverse evidence in the source set is not about
              misconduct, but about execution risk: MIT Technology Review quotes an external interpretability researcher
              arguing that Goodfire adds “precision to the alchemy” rather than turning AI engineering into a fully
              principled science, and an independent health-tech analysis argues the Series B valuation is aggressive
              for a research-first company with early commercial traction. The diligence burden is therefore less about
              headline credibility and more about commercial proof, governance disclosure, and how quickly
              interpretability demand converts into repeatable software revenue.
