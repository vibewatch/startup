evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding-date
    missingEvidence: >-
      Primary evidence for incorporation or legal formation date, such as charter documents or state registration
      records.
    whyItMatters: >-
      Founding date affects chronology, team velocity interpretation, and how exceptional the financing ramp actually
      is.
    diligencePath: >-
      Request formation documents or search California and Delaware corporate records to reconcile the 2023 versus 2024
      signals.
    relatedQuestionRefs:
      - QO006
  - type: enumeration-incomplete
    severity: material
    topic: governance-disclosure
    missingEvidence: A full executive roster, board composition, and investor board-seat mapping after the Series B.
    whyItMatters: >-
      Governance clarity matters for control analysis, key-person risk, and understanding how much influence lead
      investors now hold.
    diligencePath: Request an org chart, board list, and post-Series B governance summary from management or lead investors.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Exact ownership percentages, liquidation preferences, secondaries, debt terms, and any investor rights packages.
    whyItMatters: >-
      Economic ownership and downside protections are central to interpreting the meaning of the $1.25 billion
      valuation.
    diligencePath: Review the cap table, financing docs, and board consents for the seed, Series A, and Series B.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-metrics
    missingEvidence: Revenue, ARR, active-customer count, net retention, and paid-versus-experimental partner mix.
    whyItMatters: >-
      The commercial case cannot be underwritten from funding momentum alone; operating metrics are needed to test
      valuation support.
    diligencePath: Request current ARR, pipeline, customer concentration, and contract summary from management.
    relatedQuestionRefs:
      - QO028
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: compliance-posture
    missingEvidence: >-
      A clearer public record of compliance, security, and regulated-market readiness beyond SOC 2 and Mayo governance
      language.
    whyItMatters: >-
      Enterprise and healthcare adoption will depend on whether Goodfire can document controls proportionate to
      high-stakes model work.
    diligencePath: >-
      Review security materials, compliance roadmap, and customer diligence questionnaires; confirm SOC 2 scope and any
      HIPAA or other control frameworks.
    relatedQuestionRefs:
      - QO027
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: goodfire pricing and acv
    missingEvidence: Public or diligence-only ACV bands, order forms, or price sheets for Goodfire pilots and commercial licenses.
    whyItMatters: >-
      Without contract-size evidence, the chapter can only bound adjacent software price proxies and cannot translate
      segment reach into revenue pools.
    diligencePath: >-
      Request current pilot order forms, redlined MSA or commercial agreement examples, and average contract value by
      segment.
    relatedQuestionRefs:
      - QM024
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: customer and pipeline counts
    missingEvidence: Active pilot count, paying customer count, segment mix, and renewal or conversion rates from pilot to license.
    whyItMatters: >-
      Customer and conversion data are necessary to estimate Goodfire's current SOM and to judge whether scientific
      cases are repeatable commercial segments or still showcase programs.
    diligencePath: Ask management for current pipeline by segment, customer logos with stage, and pilot-to-paid conversion metrics.
    relatedQuestionRefs:
      - QM022
      - QM024
      - QM025
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: addressable model-access base
    missingEvidence: >-
      A credible public census of organizations training, fine-tuning, or otherwise controlling models deeply enough to
      grant Goodfire the access it needs.
    whyItMatters: >-
      Model-access prevalence is the core denominator for a constrained SAM, and public evidence does not currently
      quantify it.
    diligencePath: >-
      Build a target-account list from frontier labs, open-weight enterprise model builders, and scientific AI programs,
      then tag each for model-access depth and budget ownership.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: minor
    topic: scientific-ai commercialization depth
    missingEvidence: >-
      Contract scope, revenue contribution, and renewal evidence from scientific and medical collaborations such as
      Prima Mente or Mayo.
    whyItMatters: >-
      The public cases prove technical fit, but not yet whether the scientific-AI segment is already a repeatable
      commercial wedge.
    diligencePath: Request segment revenue split, reference calls, and evidence of multi-year expansion in scientific programs.
    relatedQuestionRefs:
      - QM022
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Realized Goodfire pricing, pilot terms, and renewal or expansion data by customer segment.
    whyItMatters: >-
      Without realized commercial data, it is difficult to tell whether Goodfire clears budget as a distinct
      model-design layer or only as bespoke research support.
    diligencePath: Request anonymized pricing sheets, pilot-to-production conversion rates, and net retention by cohort.
    relatedQuestionRefs:
      - QP023
      - QP026
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: closed-model-limit
    missingEvidence: >-
      Independent proof that Goodfire can deliver comparable value on proprietary or API-only model stacks, not just
      open-weight deployments.
    whyItMatters: >-
      If the product is constrained to open-weight environments, the addressable market and incumbent threat profile
      change materially.
    diligencePath: >-
      Ask for closed-model case studies or explicit roadmap documents showing what parts of the workflow work without
      direct weight access.
    relatedQuestionRefs:
      - QP007
      - QP020
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: distribution
    missingEvidence: >-
      Pipeline mix, win/loss data, and deployment depth versus Datadog, LangSmith, Langfuse, Fiddler, and internal-build
      alternatives.
    whyItMatters: >-
      Public product pages show adjacent competition, but not whether Goodfire wins the relevant buying process often
      enough to build a durable category position.
    diligencePath: >-
      Request recent competitive evaluations, top five losses, and references from customers choosing Goodfire over
      observability-led alternatives.
    relatedQuestionRefs:
      - QP024
      - QP026
    relatedTableRefs:
