companyProfile:
  summary: Goodfire is a San Francisco-based AI interpretability company and public benefit corporation building a model-design environment for understanding, debugging, and steering neural networks. The company sells selective enterprise and research partnerships around Silico/Ember-style interpretability workflows for frontier model teams, healthcare and scientific AI programs, and other high-stakes deployments, but public disclosure still leaves revenue quality and customer breadth mostly opaque.
