callouts:
- calloutType: recommendation
  title: 'Recommendation: research-more at the current price'
  body: Goodfire looks like one of the strongest independent interpretability companies in the market, but the public record still supports the company more clearly than it supports the valuation. At $1.25B, investors are already paying for a meaningful portion of the commercialization thesis. Until ARR, pricing, retention, and cap-table terms are disclosed under diligence, this should be treated as a research-more name rather than a buy.
  claimRefs:
  - CV001
  - CV036
  - CV047
  - CV048
- calloutType: strength
  title: What is genuinely impressive
  body: 'The research bench, collaborator set, and investor roster are all real strengths. Goodfire is not a generic “AI wrapper” story: it has distinct technical work across steering, neural geometry, genomics, and model decomposition, plus credible enterprise-readiness signals like SOC 2 Type II. That is why the company belongs on a high-priority diligence list.'
  claimRefs:
  - CV013
  - CV015
  - CV016
  - CV017
  - CV018
  - CV019
  - CV021
- calloutType: risk
  title: What could break the valuation quickly
  body: The downside is not that interpretability lacks value; it is that Goodfire may prove valuable without proving software-scale economics fast enough for the current round. If customers can satisfy most of their needs with tracing, monitoring, and governance tools from adjacent vendors, or if Goodfire cannot show repeatable subscription economics, the current mark becomes hard to defend.
