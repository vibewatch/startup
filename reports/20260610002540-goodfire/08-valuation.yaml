  rows:
  - - Bull
    - Ember converts research credibility into repeatable software revenue; partners become scaled reference customers; security and governance posture unlocks enterprise adoption.
    - $1.25B-$1.85B EV; roughly 1.0x-1.5x versus the last round, meaning upside exists but is not huge unless execution is exceptional.
    - Commercial conversion may stay slower than the research narrative implies.
    - Low-medium; requires proof not yet public.
  - - Base
    - Category demand is real and Goodfire remains one of the best independent teams, but monetization stays early and partially bespoke.
    - $0.80B-$1.10B EV; roughly 0.6x-0.9x versus the last round, implying weak risk-adjusted returns at today's price.
    - Public data never closes the revenue-quality gap; budgets split across adjacent vendors.
    - Medium; most consistent with current public evidence.
  - - Bear
    - Interpretability remains valuable but budgets shift toward observability, guardrails, or frontier labs; Goodfire struggles to standardize product revenue.
    - $0.35B-$0.65B EV; roughly 0.3x-0.5x versus the last round, implying material permanent-capital risk.
    - Commercialization remains bespoke; multiple compression hits AI infrastructure names.
    - Medium-low, but adverse enough to matter because disclosure is limited.
