company:
  name: Goodfire
chapter:
  number: 8
  title: Valuation
  summary: 'Public evidence supports Goodfire as a high-quality interpretability platform with elite investors, credible scientific output, and improving enterprise readiness, but not as a clearly underwritten $1.25 billion software valuation. Because revenue, ARR, pricing, retention, and customer concentration remain undisclosed, the current mark looks more like strategic option value than a fundamentals-backed multiple. Recommendation: research-more; valuation stance: stretched; only re-engage aggressively if diligence proves repeatable software revenue or pricing moves toward the base-case range.'
sections:
- id: recommendation-financing-context
  title: Recommendation, Financing Context, and Why Price Matters More Than Narrative
  body: 'Public evidence paints Goodfire as a rare, high-quality interpretability company. The company assembled an elite funding stack quickly: a $50 million Series A in April 2025 followed by a $150 million Series B at a $1.25 billion valuation in February 2026, with Menlo, Anthropic, B Capital, Salesforce Ventures, and Eric Schmidt all showing up across the cap table. Official and filing records also support the basics of institutional quality: Goodfire is a Delaware public benefit corporation founded in 2023, based in San Francisco, and by early 2026 had filed both Series A- and Series B-era Form D documents. Goodfire further claims enterprise-ready momentum via Ember, Mayo Clinic, Arc Institute, Prima Mente, Microsoft, and a February 2026 SOC 2 Type II announcement.


    Those positives matter, but this chapter is valuation work, not admiration. The evidence is strong on team quality, scientific credibility, and investor signaling; it is weak on the commercial datapoints normally used to justify a software infrastructure price. None of the public round materials in this source pack disclose ARR, revenue, pricing, customer count, retention, gross margin, or software-versus-services mix. That absence is decisive. At $1.25 billion, investors are not obviously paying for proven fundamentals; they are paying for the option that interpretability becomes core AI infrastructure and that Goodfire becomes one of the category winners. That may happen, but on public evidence alone the price already assumes more commercialization than the company has disclosed. The recommendation is therefore research-more, not buy, and the valuation stance is stretched rather than attractive.'
