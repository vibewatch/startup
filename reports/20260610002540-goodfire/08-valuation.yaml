  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Category need
    - Interpretability should become more important as enterprises demand controllable and explainable AI.
    - Enterprises may decide observability and guardrails are enough, keeping interpretability niche.
    - Budget data showing Goodfire wins a standard line item rather than an experimental spend.
  - - Product
    - Ember offers a differentiated model-internal control layer, not just post-hoc monitoring.
    - The product may still be too research-heavy or bespoke to scale as software.
    - Proof of standard pricing, time-to-value, and repeatable deployments.
  - - Scientific proof
    - Goodfire has real research outputs, including steering, neural geometry, genomics, and multimodal work.
    - Scientific credibility does not automatically translate into recurring revenue.
    - Evidence that flagship research programs convert into durable commercial accounts.
  - - Strategic demand
    - Anthropic, Salesforce, and Eric Schmidt are strong signal investors for the category.
    - Smart investors can still overpay for strategic option value in a hot AI market.
    - Independent software metrics that validate the price without relying on cap-table prestige.
  - - Valuation
    - A $1.25B mark could be justified if Goodfire becomes core AI infrastructure for high-stakes deployments.
    - Today's public evidence does not disclose the ARR or margins needed to justify that mark on fundamentals.
    - NDA disclosure of ARR, gross margin, and retention that supports a scalable software multiple.
- id: TV003
  title: Bull / base / bear scenario table
  notes: Scenario values are evidence-constrained enterprise-value ranges, not precise DCF outputs. Return logic is shown against the February 2026 $1.25B round mark.
