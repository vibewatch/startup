  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-disclosure
    missingEvidence: Current pricing, contract archetypes, and whether customers are buying software subscriptions versus bespoke research engagements.
    whyItMatters: Without pricing and contract structure, the market cannot translate product quality into recurring revenue durability or software-multiple eligibility.
    diligencePath: Request current pricing sheets, top ten contract summaries, and software-versus-services revenue mix under NDA.
    relatedQuestionRefs:
    - QV018
    - QV032
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: preference-stack
    missingEvidence: Post-Series-B cap table, liquidation preferences, pro rata rights, and any investor side letters or unusual governance protections.
    whyItMatters: Even if enterprise value is defensible, equity value can be much lower if the preference stack or dilution overhang is heavy.
    diligencePath: Request cap table, round documents, and board observer or veto-right summaries before underwriting above the base-case range.
    relatedQuestionRefs:
    - QV031
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: ARR, growth, gross margin, renewal rates, concentration, and customer logos for the current commercial base.
    whyItMatters: These are the minimum inputs needed to decide whether Goodfire deserves a software infrastructure multiple or only a strategic option premium.
    diligencePath: Obtain cohort revenue bridge, ARR waterfall, top-customer list, and gross margin bridge under NDA.
    relatedQuestionRefs:
    - QV017
    - QV027
    - QV032
    relatedTableRefs:
    - TV004
    - TV006
  - type: private-evidence-only
    severity: material
    topic: commercial-conversion
    missingEvidence: Evidence that research collaborators and design partners convert into repeatable platform customers with standard deployment patterns.
    whyItMatters: The investment case assumes Goodfire can scale beyond a small number of high-touch collaborations into a broader product business.
    diligencePath: Ask management for partner-to-paid conversion data, implementation timelines, and pipeline stage definitions.
    relatedQuestionRefs:
    - QV022
    - QV027
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: minor
    topic: ipo-readiness
    missingEvidence: Internal planning for audit readiness, controls, and timeline to public-company-grade financial disclosure.
    whyItMatters: Exit timing matters for return underwriting; the public record is enough to rule out near-term IPO optimism but not to model medium-term readiness precisely.
    diligencePath: Review audit timeline, finance-hiring plan, and board discussion materials on exit strategy.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
