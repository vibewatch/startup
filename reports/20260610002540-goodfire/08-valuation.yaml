- id: TV005
  title: Thesis-break and kill triggers table
  notes: Triggers are framed as observable diligence findings or post-investment monitoring events that would break the underwriting case.
  claimRefs:
  - CV036
  - CV043
  - CV046
  - CV049
  - CV050
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue-quality opacity persists
    - Management cannot disclose ARR, gross margin, concentration, and retention under NDA.
    - The investment remains narrative-led instead of fundamentals-led.
    - Do not underwrite above the base-case range; default to pass.
  - - No partner-to-paid conversion pattern
    - Scientific collaborators and design partners do not convert into repeatable platform revenue.
    - Goodfire looks like a high-end research shop instead of scalable infrastructure software.
    - Move valuation toward the bear case and require a lower entry or structured downside.
  - - Observability vendors satisfy the budget
    - Customers solve their pain with tracing, monitoring, and guardrails without needing model-internal control.
    - The category wedge narrows and Goodfire's TAM compresses.
    - Reduce conviction materially and reassess category ownership.
  - - Preference stack is investor-unfriendly
    - Series B documents reveal heavy seniority, unusual protections, or meaningful dilution overhang.
    - Enterprise value may not translate into acceptable equity returns.
    - Re-cut returns on an equity-value basis before proceeding.
  - - Security or governance credibility slips
    - A major trust, compliance, or governance issue undercuts the high-stakes deployment narrative.
    - The premium tied to safe and controllable AI weakens quickly.
    - Pause diligence until remediation is independently verified.
- id: TV006
  title: Final diligence asks table
  notes: These are the minimum asks needed to move Goodfire from an interesting company to an underwritable investment at or near the last round price.
  claimRefs:
  - CV027
  - CV040
  - CV049
  - CV050
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue quality
    - ARR, bookings, net retention, gross retention, gross margin, and revenue mix.
    - These are the core inputs for any valuation method beyond strategic option value.
    - CFO / finance room under NDA.
  - - Pricing and packaging
    - Current pricing sheets, pilot-to-production conversion terms, and software-versus-services monetization.
    - Determines whether the business can scale as product revenue rather than bespoke work.
    - Sales leader and product leader interview plus contract sample review.
  - - Customer concentration
    - Top ten customers, revenue concentration, deployment scope, and renewal status.
    - High concentration would make the current price much harder to defend.
    - Customer cohort review and account-level diligence.
  - - Cap table and preferences
    - Post-Series-B cap table, liquidation preferences, pro rata rights, and governance protections.
    - Equity value can differ sharply from enterprise value if preferences are heavy.
    - Legal diligence on financing documents.
  - - Commercial conversion
    - Evidence that Mayo, Arc, Microsoft, or similar relationships create repeatable paid software patterns.
    - This is the bridge between scientific credibility and a scalable investment case.
    - Management deep dive with cohort examples and implementation metrics.
