figures:
- id: FM001
  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: Public evidence supports a large AI-demand backdrop, a visible adjacent observability budget layer, and a much narrower direct Goodfire capture layer defined by model access and high-touch pilots.
  data:
    nodes:
    - label: 'Broad AI demand backdrop: AI usage rising across industries'
      detail: PwC shows broad AI uptake and stronger productivity in AI-exposed industries; this is a demand tailwind, not Goodfire revenue.
      tone: positive
    - label: 'Adjacent observability / eval budgets: published plans from $348 to $29,988+ per year'
      detail: Arize, Langfuse, Humanloop, and Fiddler show public software pricing where teams already pay for traces, evals, and guardrails.
      tone: neutral
    - label: 'Goodfire direct capture: selective pilot-first contracts for teams with model-internal access'
      detail: MIT and the pilot agreement show custom pricing and a high-touch motion, so the reachable market is far narrower than headline AI spend.
      tone: warning
  approximationNotes: This is a constrained lens stack rather than a numeric TAM-SAM-SOM waterfall. Only the adjacent-budget layer has visible public pricing; Goodfire's direct commercial layer is undisclosed.
  claimRefs:
  - CM020
  - CM019
  - CM024
  - CM026
  - CM044
  - CM045
