- id: TM003
  title: Segment / buyer map
  columns:
  - segment
  - buyer
  - user
  - payer/workflow
  - budget owner
  - adoption trigger
  rows:
  - - Frontier labs
    - Chief scientist, interpretability lead, safety lead
    - Interpretability researchers, model scientists, safety engineers
    - Research program around training control, alignment, and failure analysis
    - Frontier-model R&D and safety budgets
    - Need to debug, steer, or align internally developed frontier models
  - - Enterprise model teams
    - CTO, VP Engineering, AI platform lead
    - Applied scientists, ML engineers, eval teams
    - Owned or fine-tuned model programs with reliability or control needs
    - AI platform, infrastructure, or advanced product budgets
    - High-value model workflow where traces are insufficient and deeper control matters
  - - Life sciences / scientific AI teams
    - Research director, computational biology lead, scientific founder
    - Computational scientists, modelers, translational research teams
    - Scientific discovery or validation workflow tied to owned foundation models
    - Research program or disease-area budget
    - Need to validate that model predictions reflect real mechanisms, not confounders
  - - Regulated adopters
    - Clinical, legal, compliance, or risk executive with technical sponsor
    - Domain experts, review teams, model-risk staff
    - Pilot around high-consequence decision support or specialized model governance
    - Domain budget plus governance oversight
    - Need for transparent, auditable behavior before broader deployment
  notes: The buyer-user-payer split matters because Goodfire is sold as a high-touch capability layer. In every segment, the best trigger is a high-value model that the customer controls deeply enough to inspect.
