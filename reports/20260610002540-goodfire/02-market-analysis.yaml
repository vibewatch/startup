tables:
- id: TM001
  title: Market definition table
  columns:
  - segment/category
  - included spend
  - excluded spend
  - buyer/payer
  - relevance
  rows:
  - - Frontier-lab interpretability and model design
    - Interpretability research infrastructure, steering workflows, training-shaping tools, safety diagnostics, and production monitors tied to owned models
    - Generic AI infrastructure, pure inference hosting, and generic app analytics
    - Research leads, safety teams, and frontier-model R&D budgets
    - Most natural direct segment because labs own model internals and already value interpretability
  - - Enterprise model engineering and governance
    - Debugging, eval, steering, and monitoring for proprietary or open-weight enterprise models
    - Teams using only third-party closed APIs with no internal-model access
    - VP Engineering, AI platform leaders, ML infra, and advanced product budgets
    - Reachable when enterprises run or fine-tune their own important models
  - - Scientific AI and life-sciences model design
    - Model decoding, validation, confounder removal, and discovery workflows in genomics, biology, and robotics
    - General lab software, wet-lab tools, and non-model R&D software
    - Scientific-program leads, computational biology teams, and research budgets
    - Strong fit where internal-model understanding changes scientific or deployment quality
  - - Regulated and high-consequence adopters
    - Interpretability, governance, and validation layers for finance, healthcare, legal, or safety-critical AI
    - Commodity workplace copilots and generic knowledge-worker subscriptions
    - Clinical, compliance, risk, or domain-operations budgets with technical sponsorship
    - High-need segment, but harder to close because procurement and evidence burdens are heavier
  - - Adjacent LLM observability and evaluation stack
    - Tracing, prompt management, evals, experiments, and guardrails already budgeted in production AI teams
    - Deep parameter or latent-space control when vendors only observe outputs or traces
    - Developer tooling, platform engineering, and MLOps budgets
    - Important adjacency because these budgets define the closest public comparison set
  notes: 'The market boundary is intentionally narrow: it follows the spend that can plausibly land in model-internal understanding, steering, and validation workflows rather than all generative-AI software or infrastructure.'
