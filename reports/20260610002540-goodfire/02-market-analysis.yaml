- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Higher-stakes AI deployment
    - up
    - current
    - As AI touches science, healthcare, and autonomous workflows, demand rises for deeper validation and control
    - Ask which current customers use Goodfire for pre-deployment validation versus post hoc analysis.
  - - Productivity and labor pressure
    - up
    - 12-24 months
    - Firms that see real AI productivity gains are more willing to fund tooling that increases model reliability
    - Request proof that Goodfire shortens debugging or post-training iteration cycles enough to justify budget.
  - - Adjacent observability budget normalization
    - up
    - current
    - Tracing, evals, and guardrails are already funded categories, making the budget conversation easier
    - Ask how often Goodfire sells alongside LangSmith, Datadog, Langfuse, or similar platforms.
  - - Scientific discovery upside
    - up
    - 12-36 months
    - Biology and robotics cases broaden the market beyond software teams if outcomes prove repeatable
    - Request revenue split and renewal evidence for scientific customers or partners.
  - - Model-access dependence
    - down
    - current
    - Closed-model customers are harder to serve because Goodfire needs deeper access than most API-only users can provide
    - Request the pipeline split between open-weight, proprietary in-house, and closed-API prospects.
  - - Governance and validation burden
    - down
    - current and rising
    - Regulated buyers may value interpretability most, but their procurement cycles are longest
    - Request average sales cycle and security or governance review time by segment.
  - - Technical immaturity of mechanistic interpretability
    - down
    - 12-36 months
    - Debate over how close the field is to precision engineering can cap budget urgency
    - Request benchmark evidence that Goodfire changes outcomes on production tasks, not just research demos.
  - - Opaque Goodfire pricing and customer disclosure
    - down
    - current
    - Without public price and customer data, outside investors must underwrite a selective rather than broad-market story
    - Request ACV bands, pilot-to-license conversion, and customer-count disclosures by cohort.
  notes: The key underwriting question is not whether demand exists, but whether Goodfire can convert a real need for control into repeatable commercial deployments faster than access limits, governance friction, and field immaturity slow adoption.
