- id: FM004
  title: Adoption funnel/value-chain map
  type: flow
  layout: wide
  summary: Goodfire's public materials imply a pilot-first value chain that starts with a high-stakes model problem and expands only after model access and interpretability work prove value.
  data:
    nodes:
    - id: trigger
      label: High-stakes model problem identified
      detail: A frontier, enterprise, or scientific team hits a reliability, hallucination, safety, or mechanism-validation problem.
      tone: neutral
    - id: pilot
      label: Pilot or design-partner scoping
      detail: Goodfire contracts for internal evaluation plus services to test fit before a longer license.
      tone: neutral
    - id: access
      label: Model and data access granted
      detail: Customer must provide enough access to inspect internals and collaborate in a shared environment.
      tone: warning
    - id: analysis
      label: Interpretability and steering workbench
      detail: Goodfire runs feature, circuit, or parameter-level analysis to diagnose and intervene on behavior.
      tone: positive
    - id: expand
      label: Validation, monitoring, and longer-term license
      detail: If the pilot proves value, the workflow can extend into production monitoring or broader model-design work.
      tone: positive
    edges:
    - from: trigger
      to: pilot
      label: Need for control or validation
    - from: pilot
      to: access
      label: Pilot agreement + technical diligence
    - from: access
      to: analysis
      label: Internals available
    - from: analysis
      to: expand
      label: Outcome proves commercial value
  approximationNotes: The sequence comes from Goodfire's legal pilot agreement, product pages, and Series B narrative. Public sources do not disclose stage-by-stage conversion rates.
