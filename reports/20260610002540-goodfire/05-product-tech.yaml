- id: interpretability-primitives-and-architecture
  title: Interpretability primitives and operating architecture
  body: |-
    Goodfire's architecture pairs a shared experiment workspace with a research stack that spans activation analysis, geometry discovery, parameter decomposition, and intervention tooling. The official research surface shows sparse autoencoders, probes, and manifold methods doing the early-stage work of surfacing interpretable features; neural-geometry work argues that many important concepts live on curved internal manifolds rather than single directions; and stochastic parameter decomposition pushes the stack deeper into weights, where Goodfire tries to identify which causal components can be removed without changing outputs. That combination suggests the platform is not a single technique but a layered toolkit for interpreting, localizing, and editing model behavior.

    The R1 work is especially revealing because it shows both capability and friction. Goodfire says it trained the first public sparse autoencoders on a frontier reasoning model and had to build custom inference and interpreter-model infrastructure to do so. At the same time, the work shows that steering reasoning models is not plug-and-play: interventions had to happen after the model's stock response prefix, and some heavy-handed steering caused behavior to snap back toward the original response. That makes the core product proposition stronger, not weaker: the whole point of Silico is to expose these hidden operational constraints before customers ship or retrain blindly.

    This architecture also explains Goodfire's dependency stack. The deepest workflows require access to model internals, which makes open-weight or customer-controlled models a better fit than closed API endpoints. It also explains why Goodfire can reuse the same core ideas across domains. EVEE, Alzheimer's biomarker work, Paint With Ember, and robotics bottleneck analysis all share the same pattern: pull out internal structure, translate it into something legible, then use that understanding to debug, steer, or design the model more intentionally.
