- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Customer model and materials ingestion
    - Brings weights, datasets, files, code, prompts, and workflows into the workspace
    - Customer must control or expose enough internals for analysis
    - Closed API models and restrictive data-sharing rules can block the deepest workflows
  - - Shared workspace and agent orchestration
    - Runs experiments, captures outputs, and coordinates interpretability tasks on Goodfire infrastructure
    - Goodfire compute, inference, and agent tooling
    - Tenancy, region layout, and review/approval controls are not public
  - - Activation interpretability layer
    - Uses SAEs, probes, and related tools to localize model features and signals
    - Activation access plus trained interpreter models
    - Linear feature methods can miss global curved structure
  - - Geometry / manifold layer
    - Recovers structured concept spaces for smoother understanding and control
    - Clustering and geometry-discovery pipelines over internal representations
    - Research maturity is high, but packaged product boundaries are not fully public
  - - Parameter decomposition layer
    - Inspects weights as causal components rather than only observing activations
    - SPD-style decomposition and masking methods
    - Scalability, runtime cost, and product packaging remain partially research-stage
  - - Monitoring and failure-surfacing layer
    - Uses amplified sampling and eval-awareness analysis to catch rare post-training failures
    - Before/after checkpoints, rollout analysis, and judge infrastructure
    - Monitoring findings can depend on prompt design and may not generalize automatically
  - - Intervention and steering loop
    - Applies feature steering, filtering, reward shaping, and targeted model edits
    - Edit permissions, rollback discipline, and model-specific heuristics
    - Wrong timing or oversteering can cause route-around behavior in reasoning models
  - - Service and commercial delivery layer
    - Adds support, technical assistance, field engineering, and research collaboration around the platform
    - Order forms, Goodfire personnel, and partner workflows
    - High-touch delivery can slow scaling and hide how much value is software versus services
  notes: This is an evidence-backed operating architecture, not an official engineering diagram. It distinguishes public method layers from undisclosed infrastructure details such as tenancy, vendor stack, and data residency.
