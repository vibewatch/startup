  - CE033
  - CE036
  - CE052
- calloutType: risk
  title: Trust posture is ahead of public operating telemetry
  body: Goodfire has meaningful procurement signals like SOC 2 Type II and Mayo-governance framing, but public buyers still cannot inspect a normal enterprise trail of uptime data, API docs, deployment counts, or incident history. For a product sold into reliability-sensitive workflows, that transparency gap is the main maturity constraint visible from public evidence.
