- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Goodfire solution
  - Measurable benefit
  - Limitation
  rows:
  - - Reduce LLM hallucinations before deployment
    - Prompt tweaks, judge loops, and post-hoc output review
    - RLFR, feature steering, and the Hallucinations Viewer inside the model-design environment
    - 58% hallucination reduction and roughly 90x lower intervention cost versus LLM-as-judge claims
    - Evidence is workflow-specific and not a universal performance guarantee
  - - Debug frontier reasoning-model behavior
    - Prompt hacks and coarse response benchmarking
    - Reasoning-model SAEs, feature databases, and timing-aware steering on R1
    - Shows reasoning-specific features like backtracking and exposes steering edge cases at large scale
    - Requires weight or activation access and expert handling of model-specific behavior
  - - Extract biomarkers from a scientific model
    - Black-box prediction review and wet-lab triage
    - Embedded interpretability work using SAEs, tracing, and ablation on customer models
    - Surfaced a novel Alzheimer's biomarker class and a human-readable classifier that generalized to an independent cohort
    - Still requires downstream experimental validation
  - - Explain genome-wide variant effects
    - Opaque pathogenicity scores and coding-region-limited tools
    - Evo 2 embeddings plus probes and reasoning-model synthesis through EVEE
    - 0.997 AUROC on 839k ClinVar variants and structured hypotheses for 4.2M variants
    - Outputs are hypotheses, not diagnoses or regulatory-grade evidence
  - - Catch robotics or vision failures before deployment
    - Wait for benchmark misses or production failures
    - Inspect latent policy structure, geometry, and leakage before deployment
    - Can localize bottlenecks, unused observations, and ECG leakage in reviewed case studies
    - Public evidence is case-study based rather than product-documentation based
  - - Edit image-model behavior directly
    - Prompt-box iteration only
    - Paint With Ember canvas that manipulates latent activations and concept weights
    - Supports adding, moving, and reshaping concepts without only rewriting prompts
    - This looks like a research preview rather than the core commercial SKU
  notes: Benefits mix directly claimed research outcomes with workflow-specific demonstrations. Goodfire does not publish customer-level ROI, conversion, or usage-frequency metrics for these flows.
