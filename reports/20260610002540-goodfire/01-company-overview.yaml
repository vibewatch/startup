- id: founders-and-organization
  title: Founders, leadership, and organizational profile
  body: 'The founding team publicly centers on three cofounders: Eric Ho as CEO, Daniel Balsam as CTO, and Tom McGrath as chief scientist. Across investor and company materials, Ho is the primary public spokesperson and strategy voice; Balsam appears as the technical operator translating interpretability into product and applied research; and McGrath supplies heavyweight scientific credibility as the former founder of Google DeepMind’s interpretability team. Menlo and Salesforce materials also tie Ho and Balsam to prior operating experience at RippleMatch, reinforcing the narrative that Goodfire mixes frontier-research pedigree with startup execution.


    The broader team profile is also part of the investment case. Goodfire and its backers highlight alumni from OpenAI, Google DeepMind, Harvard, Stanford, and UC San Diego, plus named contributors such as Nick Cammarata and Leon Bergen. However, public leadership disclosure is incomplete: reviewed materials do not provide a full C-suite roster, detailed board composition, or ownership map. Even the founding date has some ambiguity. Financing materials imply the company was founded in 2024 because the Series A was said to arrive less than a year after founding and Lightspeed publicly announced a seed round in August 2024, but one independent profile describes Goodfire as founded in 2023. The office footprint disclosed publicly is also narrow: Goodfire’s careers page states roles are in person five days a week at its Telegraph Hill office in San Francisco.'
