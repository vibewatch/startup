callouts:
- calloutType: insight
  title: The financing narrative is stronger than the commercial one
  body: Goodfire’s valuation, investor roster, and research pedigree are unusually well supported for a young company, but public evidence on revenue, customer count, and ownership structure is still thin. The company is being priced like a critical AI infrastructure layer before the public record shows broad commercial scale.
  claimRefs:
  - CO018
  - CO020
  - CO021
  - CO032
  - CO040
- calloutType: risk
  title: Founding and governance details remain less clear than the headline story
  body: Public materials clearly identify the three cofounders, but they do not settle the exact founding date, disclose a full board roster, or describe post-Series B governance. Those gaps are unusual given the pace of capital formation and should be closed during diligence.
