  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding-date
    missingEvidence: Primary evidence for incorporation or legal formation date, such as charter documents or state registration records.
    whyItMatters: Founding date affects chronology, team velocity interpretation, and how exceptional the financing ramp actually is.
    diligencePath: Request formation documents or search California and Delaware corporate records to reconcile the 2023 versus 2024 signals.
    relatedQuestionRefs:
    - QO006
  - type: enumeration-incomplete
    severity: material
    topic: governance-disclosure
    missingEvidence: A full executive roster, board composition, and investor board-seat mapping after the Series B.
    whyItMatters: Governance clarity matters for control analysis, key-person risk, and understanding how much influence lead investors now hold.
    diligencePath: Request an org chart, board list, and post-Series B governance summary from management or lead investors.
    relatedQuestionRefs:
    - QO012
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Exact ownership percentages, liquidation preferences, secondaries, debt terms, and any investor rights packages.
    whyItMatters: Economic ownership and downside protections are central to interpreting the meaning of the $1.25 billion valuation.
    diligencePath: Review the cap table, financing docs, and board consents for the seed, Series A, and Series B.
    relatedQuestionRefs:
    - QO019
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-metrics
    missingEvidence: Revenue, ARR, active-customer count, net retention, and paid-versus-experimental partner mix.
    whyItMatters: The commercial case cannot be underwritten from funding momentum alone; operating metrics are needed to test valuation support.
    diligencePath: Request current ARR, pipeline, customer concentration, and contract summary from management.
    relatedQuestionRefs:
    - QO028
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: minor
    topic: compliance-posture
    missingEvidence: A clearer public record of compliance, security, and regulated-market readiness beyond SOC 2 and Mayo governance language.
    whyItMatters: Enterprise and healthcare adoption will depend on whether Goodfire can document controls proportionate to high-stakes model work.
    diligencePath: Review security materials, compliance roadmap, and customer diligence questionnaires; confirm SOC 2 scope and any HIPAA or other control frameworks.
    relatedQuestionRefs:
    - QO027
    relatedTableRefs:
    - TO004
