- id: capital-investors-and-stage
  title: Funding history, investor base, and current stage
  body: 'Goodfire has raised capital unusually quickly for a research-first infrastructure company. Public sources show a $7 million seed round led by Lightspeed in August 2024, a $50 million Series A led by Menlo Ventures in April 2025, and a $150 million Series B led by B Capital at a $1.25 billion valuation in February 2026. The Series A syndicate added Lightspeed, Anthropic, B Capital, Work-Bench, Wing, and South Park Commons, while the Series B expanded the cap table with Juniper Ventures, DFJ Growth, Salesforce Ventures, and Eric Schmidt alongside returning investors. Goodfire and third-party coverage consistently round the cumulative funding to “over $200 million,” while simple addition of disclosed rounds implies roughly $207 million.


    The investor mix matters as much as the dollars. Anthropic’s participation in the Series A is a strategic signal from a safety-oriented frontier lab; Salesforce Ventures indicates an enterprise-software adoption angle; and B Capital’s lead role at Series B reflects a belief that interpretability may become a major infrastructure layer. Still, the public record is thin on ownership stakes, liquidation structure, debt, secondaries, and board seats. Public sources reviewed label Goodfire as private, and the company should be treated as a late-venture, Series B-stage private business rather than a scaled commercial software company. That distinction matters because the financing pace and valuation far outstrip the company’s disclosed revenue and customer metrics.'
