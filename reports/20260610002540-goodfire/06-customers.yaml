- id: named-customer-proof-and-adoption-motion
  title: Named customer proof and adoption motion
  body: 'The named proof set shows that Goodfire is doing real work for customers and partners, but the type of proof varies materially by account. Prima Mente is the clearest model-to-science case study: Goodfire says it embedded researchers with Prima Mente, interpreted the Pleiades epigenomics model, and helped identify a novel class of blood-borne biomarkers for Alzheimer''s detection. Arc Institute is a strong scientific reference showing Goodfire can work with frontier biological foundation models at scale; however, Arc evidence is still best understood as a research collaboration rather than a conventional software deployment, especially because the initial steering work was described as early stage. Mayo Clinic similarly supports category credibility, governance readiness, and clinical adjacency, but the public record frames the work as research and hypothesis generation rather than routine clinical deployment.


    Rakuten stands apart because it is the clearest public production-style deployment: Goodfire says Rakuten deployed SAE probes for PII detection in AI agents after the system had to generalize from synthetic training data to real multilingual traffic with high recall requirements. Radical AI adds a fifth named proof point in materials science, but commercialization maturity remains early because the public disclosure emphasizes technical progress and promises more detail later. Taken together, the adoption motion looks consultative and deeply collaborative. Goodfire repeatedly describes a shared environment, selective design-partner engagement, embedded work, and case-by-case pricing rather than self-serve onboarding. That is a credible way to launch an advanced infrastructure product, but it also means that the current evidence base proves depth of technical engagement more clearly than repeatable, scaled software distribution.'
