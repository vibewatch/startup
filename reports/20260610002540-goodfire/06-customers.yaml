  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-count
    missingEvidence: Active customer count, segment mix, and ARR / revenue by customer type.
    whyItMatters: Without these denominators, the customer story cannot distinguish a handful of bespoke engagements from a broader installed base.
    diligencePath: Request a customer ledger showing active accounts, annualized revenue by segment, and pilot-to-paid conversion as of 2026-06-10.
    relatedQuestionRefs:
    - QU003
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: NRR, GRR, churn, renewal rates, contract lengths, and expansion metrics.
    whyItMatters: Durability is the central unresolved variable for whether Goodfire is a scalable software business or a high-end research-services business.
    diligencePath: Request cohort retention by vintage, top-20 account renewals, pricing schedules, and evidence of expansion from initial project into broader deployment.
    relatedQuestionRefs:
    - QU017
    - QU018
    - QU026
    relatedTableRefs:
    - TU004
  - type: enumeration-incomplete
    severity: material
    topic: named-enterprise-proof
    missingEvidence: Named enterprise accounts behind the public Fortune 500 claim, with use case, deployment stage, and referenceability.
    whyItMatters: The anonymous enterprise claim is one of the biggest drivers of implied breadth, but it is materially less credible than the named proof set.
    diligencePath: Request at least three named or reference-callable enterprise customers, including one outside life sciences and one in production.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: clinical-validation
    missingEvidence: Independent validation, peer-reviewed publications, or clinical workflow evidence for Prima Mente and Mayo-linked outcomes.
    whyItMatters: Scientific and healthcare proof matters to Goodfire's differentiation, but technical outputs are not yet the same as validated clinical utility.
    diligencePath: Obtain publication status, external validation results, and any IRB / clinical workflow deployment details for Prima Mente and Mayo programs.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: minor
    topic: customer-satisfaction
    missingEvidence: Public reviews, NPS, case-study testimonials with attributable customer quotes, or other satisfaction proxies.
    whyItMatters: A complete customer chapter should distinguish technical proof from user satisfaction and repeat usage.
    diligencePath: Request customer references or internal satisfaction data; absent that, gather attributable user testimonials or conference talks by named customers.
    relatedQuestionRefs:
    - QU026
    relatedTableRefs:
    - TU004
