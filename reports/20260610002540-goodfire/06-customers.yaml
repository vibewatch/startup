- calloutType: insight
  title: Rakuten is the clearest production deployment; the rest of the proof set is more research-heavy
  body: Prima Mente, Arc Institute, Mayo Clinic, and Radical AI demonstrate that sophisticated organizations trust Goodfire on real models, but their public outcomes are still framed mainly as scientific discovery, interpretability research, or early-stage design work. Rakuten is the strongest disclosed example of an enterprise production workflow using Goodfire methods in day-to-day guardrails.
