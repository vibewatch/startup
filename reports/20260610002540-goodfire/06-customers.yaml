- calloutType: risk
  title: Customer count and retention remain largely undisclosed
  body: The public record supports product relevance and several named reference accounts, but it does not disclose active customer count, ARR by segment, contract length, NRR, GRR, churn, or top-customer concentration. Any commercial diligence should request a customer ledger, cohort retention by vintage, top-10 account exposure, pricing schedules, and proof that named collaborations convert into renewable software or services revenue.
