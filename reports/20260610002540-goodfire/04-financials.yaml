- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - impact on underwriting
  - exact diligence path
  rows:
  - - Revenue / ARR by quarter
    - Cannot test whether valuation is supported by actual commercial scale.
    - Request monthly recurring revenue bridge, quarterly revenue, and last-twelve-month ARR walk.
  - - Realized pricing by customer type
    - Cannot distinguish premium software economics from service-heavy bespoke work.
    - Request anonymized signed order forms and invoice samples across enterprise, healthcare, and research customers.
  - - Software versus services revenue mix
    - Cannot underwrite gross-margin path or scalability.
    - Request management split of platform, overage, pilot, and services revenue for the last twelve months.
  - - Gross margin and contribution margin
    - Cannot assess whether consumption and embedded-delivery costs support durable unit economics.
    - Request gross margin by revenue line, plus cost buckets for compute, support, and personnel.
  - - Cash balance and burn
    - Cannot estimate runway or next financing need despite large recent rounds.
    - Request cash, debt, net burn, and planned hiring / research spend through the next 24 months.
  - - Sales efficiency and retention
    - Cannot judge whether selective GTM converts into repeatable enterprise software economics.
    - Request pipeline conversion, sales cycle, CAC, payback, logo retention, and expansion metrics.
  notes: Every row here is a material diligence blocker rather than a cosmetic omission. These gaps are the reason this chapter remains evidence-constrained.
