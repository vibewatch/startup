  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Signed order forms, rate cards, invoice samples, and discount ladders by customer segment.
    whyItMatters: Without realized pricing data, Goodfire's ACV, monetization quality, and software-versus-services mix remain unknowable.
    diligencePath: Request anonymized order forms and billing exports for pilot, enterprise, and healthcare accounts.
    relatedQuestionRefs:
    - QI010
    relatedTableRefs:
    - TI002
    - TI003
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: Sales-cycle, CAC, payback, and conversion metrics from pilot to production.
    whyItMatters: A selective GTM motion can still be attractive, but only if conversion and payback are strong enough to offset high-touch selling costs.
    diligencePath: Request pipeline funnel data, win rates, contract cycle lengths, and cohort payback analysis.
    relatedQuestionRefs:
    - QI011
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: runway
    missingEvidence: Current cash balance, monthly burn, committed spending, and management runway view.
    whyItMatters: Financing history alone does not establish capital adequacy after a large raise.
    diligencePath: Request board or finance-team runway model, cash schedule, and spend plan through the next 24 months.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: next-round-trigger
    missingEvidence: Any public or private statement on the operating milestones that would trigger another financing.
    whyItMatters: Investors need to know whether the next round depends on revenue scale, research milestones, or market timing.
    diligencePath: Ask management for explicit next-round triggers, downside financing scenarios, and fundraising contingency plans.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Software versus services revenue split and gross margin by line.
    whyItMatters: This is the key input for judging whether Goodfire merits a software-style multiple or a hybrid services/software framework.
    diligencePath: Request monthly revenue detail by line, direct cost allocations, and gross-margin bridge by product and services component.
    relatedQuestionRefs:
    - QI006
    - QI010
    relatedTableRefs:
    - TI001
    - TI003
    - TI005
