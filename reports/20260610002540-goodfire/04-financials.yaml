- id: capital-adequacy-and-financing
  title: 'Capital adequacy and financing: funding is verified, runway is not'
  body: 'The strongest financial facts in the public record are financing facts. Goodfire announced a $50 million Series A in April 2025 and a $150 million Series B at a $1.25 billion valuation in February 2026. The SEC Form D filings sharpen those announcements. The 2025 filing reports $52,029,991 sold after a first sale on 2025-04-02, and the 2026 filing reports $149,999,796 sold after a first sale on 2025-12-17, against a total offering amount of $161,674,124. On that narrow basis, at least $202.0 million of equity sold in the two disclosed rounds is directly verifiable from primary filing data, and public commentary places total funding modestly above $200 million including earlier capital.


    That financing fact pattern supports one clear conclusion: Goodfire has had strong capital access. It does not answer the central capital-adequacy question. No reviewed public source discloses cash on hand, monthly burn, runway months, debt covenants, or a next-round trigger. The public uses of funds are broad: frontier research, next-generation product development, and scaled partnerships across AI agents and life sciences. Those are real cash uses, but they are not enough to derive runway because the denominator is missing. Even the relatively small additional clue in the 2026 Form D — a total offering amount above the announced sold amount — only shows possible capacity or reserve in the round, not actual cash still available.


    The financial estimate range therefore stays disciplined and only brackets financing facts that are source-backed. It does not invent revenue, burn, or runway. Likewise, the capital-intensity map highlights where cash likely goes — product, research, embedded delivery, and enterprise compliance — while preserving the distinction between documented financing and inferred cost structure. This is the correct evidence-constrained stance: the raise is verified, but capital adequacy beyond the raise cannot be underwritten from public data.'
