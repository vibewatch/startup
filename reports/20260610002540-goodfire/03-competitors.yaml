- id: TP003
  title: Pricing / packaging comparison
  columns:
  - offering
  - public price / contract model
  - packaging details
  - included capabilities
  - unknowns / discounts
  - implication
  rows:
  - - Goodfire / Silico
    - Case-by-case fee; Goodfire declined specific pricing
    - Custom commercial engagement aligned to customer requirements
    - Model design environment, experiment agent, mechanistic debugging and steering
    - No public self-serve list price or usage meter disclosed
    - Harder for buyers to benchmark ROI; product must sell on differentiated outcomes rather than transparent entry pricing
  - - Arize AX / Phoenix
    - Free tier; AX Pro $50/month; enterprise custom
    - 50k spans/month and 10GB/month in Pro; enterprise SaaS or self-hosted
    - Tracing, evals, datasets, experiments, observability
    - Startup pricing mentioned but not publicly enumerated in detail
    - Sets a low entry point for teams that mainly need agent telemetry and eval workflows
  - - Fiddler AI
    - Free tier; Developer at $0.002 per trace; enterprise custom
    - Developer plan adds unified observability, custom evaluators, SSO, SaaS deployment
    - Observability, tests and experiments, guardrails, governance
    - Enterprise pricing not public beyond tier framing
    - Creates usage-based competition for safety and governance budgets around deployed systems
  - - Datadog LLM Observability
    - Free up to 40K LLM spans/month; Pro starts at $160/month for 100K spans
    - On-demand overage after 100K spans; discounted M2M and annual commitments
    - Agent observability, evaluations, retention options, sensitive data scanning
    - Retention add-ons and full enterprise packaging vary by commitment
    - Strong incumbent bundle for teams already standardized on Datadog
  - - LangSmith
    - Free tier for development and small production; paid plans scale with trace volume; enterprise by contact
    - Framework-agnostic SDK access with usage-based paid expansion
    - Agent tracing, observability, debugging
    - Exact public price not shown on reviewed page
    - Budget overlap is strongest where teams want workflow visibility rather than model-internal control
  - - Langfuse
    - Free Hobby tier; $29 Core; $199 Pro; $2499 Enterprise
    - Units-based billing with 50k free and 100k included in paid plans; optional $300 Teams add-on
    - Tracing, evals, prompts, analytics, compliance features, self-host options
    - Volume discounts beyond listed unit ladder
    - Transparent pricing and OSS posture put pressure on vendors pitching generic AI engineering value
  - - Humanloop (historical)
    - Free trial; enterprise/custom plans
    - 2 members, 50 eval runs, 10K logs/month; VPC add-on and enterprise support
    - Prompt management, evaluation, trustworthy LLM app workflow
    - Independent commercial future is gone after Anthropic deal
    - Shows how adjacent platform categories can disappear into a frontier lab before they mature independently
  - - In-house black-box stack
    - No software line item; internal labor plus cloud/tool spend
    - Mix of prompts, eval harnesses, fine-tuning, and guardrails from existing tools
    - Flexible substitute path for teams avoiding new vendor spend
    - True total cost often hidden in compliance review, retraining, and internal overhead
    - Status quo remains viable unless Goodfire proves materially better debugging, safety, or domain outcomes
  notes: Public pricing combines official list pricing, tier descriptions, and explicit unknowns from reviewed pages; absence of a number is treated as an evidence gap, not a hidden assumption.
