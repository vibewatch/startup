tables:
- id: TP001
  title: Competitor profile table
  columns:
  - competitor
  - category
  - scale / funding signal
  - target segment
  - key differentiation
  - key limitation versus Goodfire
  rows:
  - - Goodfire / Silico
    - Mechanistic-interpretability-native model design
    - Raised $150M Series B at $1.25B valuation; ~$209M total funding disclosed
    - Teams building or adapting open-weight and domain-specific models
    - Programmatic access to model internals, feature steering, data attribution, and pre-deployment failure diagnosis
    - Public pricing, win-rate, and installed-base evidence are sparse relative to adjacent tooling vendors
  - - Frontier-lab internal interpretability teams (Anthropic / OpenAI / Google DeepMind)
    - Direct incumbent / internal build
    - Embedded inside frontier labs rather than sold as a stand-alone product
    - Frontier model builders with closed-weight access
    - Deepest access to proprietary models and internal research talent
    - Unavailable as a commercial product for most buyers; not a purchasable vendor
  - - Arize Phoenix
    - Adjacent open-source tracing and eval platform
    - Open-source product; AX Pro starts at $50/month with enterprise tier
    - AI engineers building agents and LLM applications
    - Tracing, evals, datasets, experiments, and open-source entry point
    - Focuses on agent development observability rather than mechanistic editing of model internals
  - - Fiddler AI
    - Adjacent enterprise observability / guardrails vendor
    - Free tier, $0.002 per trace developer plan, enterprise deployment options
    - Enterprises needing monitoring, policy, and governance for AI systems
    - Unified observability, custom evaluators, real-time guardrails, SaaS/VPC/on-prem options
    - Competes at the monitoring and control-plane layer, not the feature-level model-design layer
  - - Arthur
    - Adjacent lifecycle reliability and governance vendor
    - Enterprise AI platform with monitoring and policy workflow proofs on page
    - Enterprises managing agents, GenAI, and traditional ML together
    - Continuous evals, policies, guardrails, dashboards, and oversight across the AI lifecycle
    - Little public evidence of mechanistic interpretability or targeted internal model editing
  - - Datadog LLM Observability
    - Incumbent observability platform
    - Free 40K LLM spans/month; Pro starts at $160/month with 100K spans
    - Existing Datadog customers extending APM into AI delivery
    - Bundles agent observability with backend monitoring, experiments, data retention, and enterprise controls
    - Best suited to operating production AI systems, not to reverse engineering model representations
  - - LangChain LangSmith
    - Adjacent developer workflow incumbent
    - Free tier for development and small production; paid plans scale with trace volume
    - Teams already building on LangChain or multi-framework agent stacks
    - Strong agent tracing, SDK breadth, framework adjacency, and debugging workflows
    - Public page describes observability, not mechanistic model editing or training-data attribution
  - - Langfuse
    - Adjacent open-source AI engineering platform
    - 10B+ observations/month; 100k+ engineers; free plus $29/$199/$2499 self-serve plans
    - Developers wanting OSS tracing, evals, prompts, and production feedback loops
    - OpenTelemetry base, self-hosting, transparent pricing, and large OSS distribution
    - Economic and developer-workflow strength does not translate into Goodfire-style internal model control
  - - Humanloop (historical)
    - Adjacent eval / prompt management vendor
    - Free trial with 50 eval runs and 10K logs/month; now joining Anthropic and sunsetting
    - Teams evaluating models and managing prompts for trustworthy LLM apps
    - Prompt management, evaluation metrics, private deployment add-ons
    - No longer an independent platform, which underscores category consolidation risk
  - - Weights / Weave (historical)
    - Adjacent tooling vendor absorbed by frontier lab
    - Products wound down after team joined OpenAI
    - Creators and model builders using earlier Weights products
    - Demonstrates that AI tooling talent can be absorbed by frontier labs
    - No longer a live independent competitor; mainly a signal of category absorption
  - - In-house black-box workflow
    - Status-quo substitute / internal build
    - Engineering labor plus commodity open-source or point tools
    - Teams unwilling to buy a new vendor category
    - 'Flexible and initially cheap: prompting, evals, fine-tuning, and guardrails can be assembled incrementally'
    - Keeps teams in guess-and-check loops with limited mechanistic evidence on why a model failed
  notes: Profile set intentionally mixes direct, incumbent, adjacent, historical, and substitute options because Goodfire competes for a job-to-be-done, not a single analyst-defined software category.
