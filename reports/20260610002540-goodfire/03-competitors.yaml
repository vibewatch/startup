- id: switching-costs-substitutes-and-distribution
  title: Switching costs, substitutes, and distribution power
  body: 'Switching costs in this landscape are asymmetric. Once a team standardizes on Datadog, LangSmith, or Langfuse for traces, evals, and production debugging, those tools can become the default operating surface for AI quality work even if they do not expose model internals. That distribution advantage matters because many organizations would rather extend an existing developer or observability stack than adopt a new research-native workflow. Conversely, Goodfire’s strongest use cases appear where tracing alone is not enough: open-weight model builders, safety-critical domains, and research teams that need to inspect features, attribute behaviors to training data, or intervene before deployment. The main substitute is still a black-box stack of prompting, benchmark evals, guardrails, and iterative fine-tuning, sometimes assembled in-house from open-source tools. That path is cheaper up front and familiar, but Goodfire’s argument is that it leaves teams guessing at why a model behaves
    badly. The competitive question is whether buyers feel enough pain from that guess-and-check loop to move budget from observability or prompt tooling into mechanistic model design.'
