  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Goodfire 的商业界面最好理解为模型设计环境，而不是通用 LLM 可观测性仪表盘。Silico 被描述为首个面向有意图模型设计的平台，是一个在 Goodfire
              基础设施上训练和调试模型的工作空间，也是一套围绕具体任务把可解释性产品化的系统：看进预测内部、运行健康检查、调试失效、塑造行为并改善泛化。实际结果是，产品比标准应用层分析更靠近模型开发循环。


              客户工作流也异常高接触。公开页面反复把团队推向申请访问或合作动作，而不是自助上手路径。实际中，工作流从一个已经控制权重、激活值，或至少足够内部机制的模型团队开始，让 Goodfire 能检查模型行为。随后
              Goodfire 把模型、数据集、提示词、工作流和评估任务拉进共享工作空间，运行智能体辅助实验，再把得到的机制发现转化为引导、诊断、数据过滤或奖励塑形等干预。


              垂直页面显示，同一个循环在不同领域重复。语言团队用这套栈减少幻觉；生命科学团队用它从模型内部机制中提取生物标志物和变异假设；机器人和视觉团队用它在部署前捕捉脆弱特征和泄漏。结果是一个工作流特异性很强的产品，但它仍依赖客户愿意在共享、接近研究的环境中工作，而不是通过成熟的大宗商品
              API 界面来使用。
