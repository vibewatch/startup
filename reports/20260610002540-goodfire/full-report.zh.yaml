      - number: '5.3'
        title: 信任、质量与合规姿态
        blocks:
          - type: paragraph
            body: >-
              Goodfire 的公开信任姿态，在企业安全上比在公开运营透明度上更成熟。最强的可见采购信号是公司的 SOC 2 Type II 公告，称审计无例外完成，并附有公开 SOC 3
              摘要。面向医疗的材料又加一层，描述了 Mayo 专属隐私协议和治理框架，旨在减少伪相关并提高临床相关性。对受监管环境中的买方来说，这些都是有意义的指标。


              不过，法律界面清楚显示，投资人和企业架构师通常想检查的许多运营细节仍是私有信息。使用条款把平台定义得很宽，包括软件、APIs、工具、文档、支持和服务，但具体经济性落在协商订单表中。使用报告对计费具有权威性，超额收费存在；除非订单表另有说明，试点明确按「现状」提供。公开条款还保留了出于安全、法律、运营和付款原因暂停服务的权利，并允许第三方产品进入交付栈。


              这是可信的企业合同脚手架，但仍留下重要尽调缺口。公开材料没有披露自助 API 参考、公开状态页、部署数量证据、租户架构或量化可用性历史。这一点重要，因为 Goodfire
              所进入的外部框架越来越无法容忍黑箱治理。NIST 关注设计、开发、使用和评估全链条的可信度，而 Gartner 警告，高风险 GenAI 部署中隐藏治理和变更管理成本可能主导 ROI。Goodfire
              方向上符合这些买方需求，但在公开暴露多少运营证据上仍处早期。
