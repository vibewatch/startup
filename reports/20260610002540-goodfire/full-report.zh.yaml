  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层级 / 流程 / 组件
      - 作用
      - 依赖
      - 风险
    rows:
      - - 客户模型与材料摄取
        - 将权重、数据集、文件、代码、提示词和工作流带入工作区
        - 客户必须控制或暴露足够多的内部信息，才能分析
