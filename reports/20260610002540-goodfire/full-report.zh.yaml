  - id: FU004
    title: 留存 / 重复队列
    type: cohort
    layout: standard
    summary: Goodfire 未披露真实收入留存队列，因此本图展示一个更窄的代理指标：具名公开协作队列中，后来获得额外公开后续证据的占比。它是连续性代理，不是 NRR 或客户留存。
