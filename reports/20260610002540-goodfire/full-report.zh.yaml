      - number: '3.4'
        title: 护城河耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              当买方本身重视机制理解时，Goodfire 的护城河最容易成立。公司可以用特征引导、数据归因、PII
              检测探针，以及生物学和机器人领域工作来证明，模型内部机制可用于调试、安全和科学发现，而不只是事后监控。这给了它比相邻评估供应商更研究原生的产品叙事。但反向证据也重要。MIT Technology Review
              引用一位外部机制可解释性研究者的观点，认为 Goodfire 可能只是在给当下的炼金术增加精度，而不是把 AI 变成一门完全有原则的工程学科。同一篇文章还指出，Silico
              在客户能访问模型权重的地方最有用，这限制了其在封闭前沿模型上的适用性。OnHealthcare 也把公司描述为一家 51
              人、研究优先的组织，估值相对已披露商业牵引偏激进。因此，最高风险情景很清楚：更大的可观测性供应商加入 explain-and-steer 功能，前沿实验室把最深的可解释性优势留在内部，或者客户认定 trace
              级控制已经足够。如果 Goodfire 成为开放权重和特定领域 AI 项目的默认模型设计层，它仍能赢；但公开胜率、定价或留存证据尚未证明这种耐久性。
