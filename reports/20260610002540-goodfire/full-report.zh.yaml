chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与产品定位
        blocks:
          - type: paragraph
            body: >-
              Goodfire 将自己定义为一家研究公司，用可解释性来理解、学习和设计 AI 系统；多份官方和融资来源也称其为位于 San Francisco 的公益公司。公司的核心投资逻辑是，前沿 AI
              仍过度以黑箱方式构建，因此其使命不是只靠规模，而是让模型变得可理解、可调试、可塑造。官方材料始终围绕「模型设计环境」来讲业务：帮助用户检查模型内部机制、诊断失效模式，并在特征或回路层面干预行为。


              产品叙事已经逐步成熟。2025 年 Series A 材料把 Ember 放在 Goodfire 旗舰可解释性平台的位置；到 2026 年，面向公众的产品页则把 Silico
              包装成首个面向有意图模型设计的平台。GTM 动作看起来更偏选择性，而非大众市场：Goodfire 称其与 Fortune 500 企业、大型医疗机构和 AI
              研究实验室合作，公开产品文案也反复指向训练或微调基础模型的组织。因此，公开证据支撑的公司身份是研究实验室、平台供应商与设计伙伴模式的结合体；客户集中度和商业规模仍基本未披露。
