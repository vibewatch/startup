  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资信号
      - 目标细分市场
      - 关键差异化
      - 相比 Goodfire 的关键短板
    rows:
      - - Goodfire / Silico
        - 机制可解释性原生的模型设计
        - 完成 $150M Series B，估值 $1.25B；披露总融资约 $209M
        - 构建或适配开放权重和领域专用模型的团队
        - 以编程方式访问模型内部、特征引导、数据归因和部署前失效诊断
        - 相比相邻工具厂商，公开定价、胜率和装机基数证据稀少
      - - 前沿实验室内部可解释性团队（Anthropic / OpenAI / Google DeepMind）
        - 直接在位者 / 内部自建
        - 嵌在前沿实验室内部，而不是作为独立产品销售
        - 拥有闭源权重访问权限的前沿模型构建者
        - 对专有模型和内部研究人才的访问最深
        - 对多数买方不是商业产品；无法作为供应商采购
      - - Arize Phoenix
        - 相邻开源追踪和评测平台
        - 开源产品；AX Pro 起价 $50/月，另有企业层
        - 构建 agent 和 LLM 应用的 AI 工程师
        - 追踪、评测、数据集、实验和开源入口
        - 聚焦 agent 开发可观测性，而不是机制层面编辑模型内部
      - - Fiddler AI
        - 相邻企业可观测性 / 护栏供应商
        - 免费层，开发者计划每条 trace $0.002，企业部署选项
        - 需要 AI 系统监控、策略和治理的企业
        - 统一可观测性、自定义评测器、实时护栏、SaaS/VPC/本地部署选项
        - 竞争发生在监控和控制平面层，而不是特征级模型设计层
      - - Arthur
        - 相邻生命周期可靠性和治理供应商
        - 企业 AI 平台，页面上有监控和策略工作流证明
        - 同时管理 agents、GenAI 和传统 ML 的企业
        - 覆盖 AI 生命周期的持续评测、策略、护栏、仪表盘和监督
        - 公开证据很少显示其具备机制可解释性或定向内部模型编辑
      - - Datadog LLM Observability
        - 在位可观测性平台
        - 每月免费 40K 个 LLM span；Pro 起价 $160/月，含 100K 个 span
        - 现有 Datadog 客户把 APM 延伸到 AI 交付
        - 把 agent 可观测性与后端监控、实验、数据留存和企业控制打包
        - 更适合运营生产 AI 系统，而不是逆向工程模型表征
      - - LangChain LangSmith
        - 相邻开发者工作流在位者
        - 开发和小规模生产有免费层；付费计划随 trace 量扩展
        - 已在 LangChain 或多框架 agent 栈上开发的团队
        - 强 agent 追踪、SDK 广度、框架邻近性和调试工作流
        - 公开页面描述的是可观测性，不是机制模型编辑或训练数据归因
      - - Langfuse
        - 相邻开源 AI 工程平台
        - 每月 10B+ observations；100k+ 工程师；免费以及 $29/$199/$2499 自助计划
        - 想要 OSS 追踪、评测、prompt 和生产反馈循环的开发者
        - OpenTelemetry 基础、自托管、透明定价和大型 OSS 分发
        - 经济性和开发者工作流优势，不会自动转化为 Goodfire 式内部模型控制
      - - Humanloop（历史）
        - 相邻评测 / prompt 管理供应商
        - 免费试用含 50 次 eval run 和每月 10K 条日志；现加入 Anthropic 并关闭
        - 为可信 LLM 应用评测模型、管理 prompt 的团队
        - Prompt 管理、评测指标、私有部署附加项
        - 已不再是独立平台，凸显品类整合风险
      - - Weights / Weave（历史）
        - 被前沿实验室吸收的相邻工具供应商
        - 团队加入 OpenAI 后，产品陆续关闭
        - 使用早期 Weights 产品的创作者和模型构建者
        - 说明 AI 工具人才可能被前沿实验室吸收
        - 已不再是活跃独立竞争对手；主要是品类吸收信号
      - - 内部黑箱工作流
        - 现状替代 / 内部自建
        - 工程人力加商品化开源或点状工具
        - 不愿购买新供应商品类的团队
        - 灵活且初期便宜：prompt、评测、微调和护栏可以逐步拼装
        - 让团队停留在猜测—验证循环里，缺少关于模型为何失败的机制证据
    notes: 画像有意混合直接、在位、相邻、历史和替代选项，因为 Goodfire 争夺的是一个待完成任务， 而不是单一分析师定义的软件类别。
