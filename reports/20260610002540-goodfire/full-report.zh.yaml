  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价界面：软件可见，经济性不可见
        blocks:
          - type: paragraph
            body: >-
              公开证据支持 Goodfire 已有商业产品，但不支持其有公开价目表。Goodfire 官方界面把 Silico 描述为模型设计环境，也是一个在 Goodfire
              基础设施上训练和调试模型的工作空间；各垂直页面反复邀请正在训练或微调基础模型的团队申请访问，而不是进入自助式公开结账流程。联系页面更进一步，称平台已经被 Fortune 500 企业、大型医疗机构和 AI
              研究实验室使用。这些表述支撑了企业产品和企业目标市场的存在，但没有披露这些客户接受的实际商业条款。


              法律文件让定价姿态更清楚。主服务协议和使用条款都把商业经济性推入协商后的订单表。条款明确设想费用、使用量超过合同配额时的超额费用，以及对计费具有权威性的仪表盘或使用报告记录。试点协议还单独说明，试点访问仅用于内部评估，评估期后需要另签商业许可。这一组合指向的变现栈，是围绕定制合同构建，而不是公开标价：试点费、商业平台费、按用量超额收费，以及潜在的额外服务费。


              投资人真正需要承保的部分仍不可得。已审阅公开页面没有披露标价、最低年度承诺、支持层级定价、折扣梯度，或按客户类型划分的实际成交价。因此，定价 / 变现表把已验证的商业机制与缺失的经济性分开。企业 AI
              基础设施不公开价格并不罕见，但这意味着外部读者无法仅从官方界面推断 ACV、客户分层或软件毛利率。正确结论不是 Goodfire 没有收入，而是 Goodfire 选择了协商式、不透明的商业姿态。
