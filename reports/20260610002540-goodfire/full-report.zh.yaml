      - number: '6.3'
        title: 耐久性、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Goodfire 的客户持久性，是公开记录里最薄弱的一环。已审阅来源没有披露 NRR、GRR、流失率、续约率、合同期限、席位扩张、客户集中度，也没有 NPS
              等满意度指标。公司也不公布客户数量，外部投资人无法判断业务到底靠少数大型设计伙伴撑着，还是已经有更广的装机客户基础。眼下最好的持久性代理指标，来自公开合作历史里的连续信号：Arc 从 2025
              年初的公告，推进到后来与 Nature 相关的更新；Mayo 也从 2025 年合作公告，推进到 2026 年 EVEE
              研究成果。这些信号说明部分关系持续到了足以产出更多公开工作的阶段，但不能证明付费续约、收入扩张或长期粘性。


              扩张潜力仍然可见。Goodfire 可以先切入高风险模型开发流程，再从研究支持扩展到监控、训练干预、护栏和相邻科学项目。风险在于，证明集集中在少数具名合作者，且明显偏向生命科学；更宽泛的 Fortune 500
              说法大多仍是匿名。两个独立来源强化了这份谨慎。MIT Technology Review 肯定 Silico 的实用性，但引用 Leonard Bereska 的观点称，Goodfire
              给「炼金术」增加了「精度」，而不是把模型设计变成完全有原则的工程；OnHealthcare 则认为，在公开商业披露有限的情况下，$1.25 billion
              估值显得激进。因此，客户论点有希望但仍脆弱：Goodfire 拥有可信的参考客户和技术成果，但可投资性很大程度上仍取决于账户规模、合同经济性和重复使用的私下证据。
