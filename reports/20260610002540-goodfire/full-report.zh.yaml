      - number: '1.2'
        title: 创始人、领导层与组织画像
        blocks:
          - type: paragraph
            body: >-
              创始团队公开叙事集中在三位联合创始人：Eric Ho 任 CEO，Daniel Balsam 任 CTO，Tom McGrath 任首席科学家。在投资人和公司材料中，Ho 是主要公开发言人与战略声音；Balsam
              更像把可解释性转化为产品和应用研究的技术运营者；McGrath 则以 Google DeepMind 可解释性团队前创始人的身份提供强科学背书。Menlo 和 Salesforce 材料还把 Ho、Balsam
              与 RippleMatch 的早期运营经历关联起来，强化了 Goodfire 同时具备前沿研究履历和创业执行力的叙事。


              更广义的团队画像也是投资逻辑的一部分。Goodfire 及其支持者重点提到来自 OpenAI、Google DeepMind、Harvard、Stanford 和 UC San Diego 的校友，以及 Nick
              Cammarata、Leon Bergen 等具名贡献者。不过，公开领导层披露并不完整：已审阅材料没有给出完整 C-suite 名单、详细董事会构成或股权结构图。甚至创立日期也存在一定模糊。融资材料暗示公司成立于
              2024 年，因为 Series A 被称为在成立不到一年后完成，且 Lightspeed 在 2024 年 8 月公开宣布种子轮；但一份独立简介称 Goodfire 成立于 2023
              年。公开披露的办公足迹也很窄：Goodfire 招聘页称岗位要求每周五天在 San Francisco 的 Telegraph Hill 办公室现场办公。
