  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、监管与合同风险
        blocks:
          - type: paragraph
            body: >-
              Goodfire 的法律和监管姿态足以通过初步企业尽调，但还不足以消除下行风险转移。正面证据是真实的：Goodfire 称已取得 SOC 2 Type II；Mayo
              描述合作在严格隐私和治理协议下进行；公司把可解释性定位为让敏感 AI
              用例更可治理的桥梁。更难承保的地方在合同。默认条款排除对服务不中断、安全、准确或无错误的保证；除非订单另有约定，试点和评估模式可以不承担安全或支持承诺；总赔偿责任也以已付费用为上限。这些都是创业软件公司的常见立场，但平台瞄准医疗、安全以及潜在关键基础设施流程时，客户仍要承担相当一部分宕机、泄露和部署风险。

              数据权利是第二个锋利边缘。TOS 赋予 Goodfire 对 Usage Data 的广泛权利，并授予其对 Workflow Data 的永久许可，可用于改进、评估、训练和商业化，同时还把反馈 IP 转让给
              Goodfire。对研究驱动型平台来说，这可能有商业合理性；但在受监管场景里，客户往往希望运营痕迹、模型行为和供应商产品改进之间硬隔离，这会拖慢采购。NIST 的生成式 AI profile 和 2026
              年关键基础设施概念说明，都指向更明确的风险控制；Gartner 同样强调治理、成本纪律和现实测量是采用门槛。结论是，Goodfire
              目前看不到公开诉讼或执法压力，但确实背着合同与治理负担：如果订单条款不能明显优于默认文本，进入受监管工作负载的速度会慢于品牌叙事。
