  - id: TM001
    title: 市场定义表
    columns:
      - 细分市场 / 品类
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 相关性
    rows:
      - - 前沿实验室可解释性和模型设计
        - 可解释性研究基础设施、steering 工作流、训练塑形工具、安全诊断，以及与自有模型绑定的生产监控
        - 通用 AI 基础设施、纯推理托管和通用应用分析
        - 研究负责人、安全团队和前沿模型 R&D 预算
        - 最自然的直接细分市场，因为实验室拥有模型内部结构，也已经重视可解释性
      - - 企业模型工程与治理
        - 专有或开放权重企业模型的 debugging、eval、steering 和监控
        - 只使用第三方闭源 API、没有内部模型访问权的团队
        - VP Engineering、AI 平台负责人、ML infra 和高级产品预算
        - 企业运行或微调自身重要模型时可触达
      - - 科学 AI 与生命科学模型设计
        - 基因组学、生物学和机器人学中的模型解码、验证、混杂因素剔除和发现工作流
        - 通用实验室软件、湿实验工具和非模型 R&D 软件
        - 科学项目负责人、计算生物学团队和研究预算
        - 当理解模型内部能改变科学质量或部署质量时，匹配度很强
      - - 受监管和高后果采用者
        - 面向金融、医疗、法律或安全关键 AI 的可解释性、治理和验证层
        - 商品化办公 copilots 和通用知识工作者订阅
        - 临床、合规、风险或领域运营预算，并有技术赞助
        - 需求很高，但采购和证据负担更重，成交更难
      - - 相邻 LLM 可观测性和评测 stack
        - 生产 AI 团队已编入预算的 tracing、prompt 管理、eval、实验和护栏
        - 当供应商只观察输出或 traces 时，深度参数或潜空间控制不在其中
        - 开发者工具、平台工程和 MLOps 预算
        - 重要相邻市场，因为这些预算定义了最接近的公开可比集合
    notes: 市场边界刻意收窄：它跟随可能落入模型内部理解、steering 和验证工作流的支出，而不是所有生成式 AI 软件或基础设施。
