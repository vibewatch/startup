      - number: '3.2'
        title: 相邻供应商：能力、包装与预算重叠
        blocks:
          - type: paragraph
            body: >-
              相邻供应商集合在商业上相关，因为它们争夺同一场围绕可信 AI 的买方对话，但产品通常锚定不同工作流。Arize Phoenix 强调面向智能体开发的开源追踪、评估、数据集和实验。Fiddler 与 Arthur
              更偏生命周期可观测性、护栏、政策和治理。Datadog 把智能体可观测性折进更大的应用监控资产中，这一点重要，因为既有装机基础会让「够用」的 AI 监管比独立平台更容易被采购。LangSmith 和
              Langfuse 都强调开发者工作流和生产调试；Langfuse 尤其把强开源姿态与透明自助定价结合起来，而 LangSmith 宣传免费层和按 trace volume 计费。Humanloop 历史上面向可信
              LLM 应用的开发、提示词管理和评估，但其并入 Anthropic 表明，这个类别可能被模型实验室吸收，而不一定保持独立。相较这些供应商，Goodfire
              在机制访问和定向模型编辑上看起来有差异化，但在公开定价、装机基础和广泛部署的可观测性界面上更薄。
