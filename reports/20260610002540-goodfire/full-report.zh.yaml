  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与证据约束下的规模测算
        blocks:
          - type: paragraph
            body: >-
              Goodfire 的相关市场比 AI 热潮的标题叙事更窄。公司材料把产品栈描述为围绕理解模型内部机制、调试失效、引导行为、塑造训练，并在部分场景监控生产行为来构建。这个边界排除了通用 copilot
              类工具、一般应用可观测性，以及从未进入模型设计工作流的 AI 基础设施支出。最接近的公开类比是 Arize、Fiddler、Datadog、LangSmith、Langfuse、Humanloop、Arthur
              和 Patronus 等 LLM 可观测性与评估供应商；但即便是这些公司，也主要监测提示词、追踪、会话和输出，而不是模型参数或潜在表示。


              由于 Goodfire 不披露定价、客户数或收入，经典 TAM-SAM-SOM 堆栈会夸大精确度。证据约束下的做法是改用多重视角：第一，看 AI 使用和 ROI
              压力扩散的宏观需求信号；第二，用已发布的相邻工具定价，为已经购买可观测性和评估产品的团队建立软件预算下限；第三，用访问视角把可触达市场缩窄到能够提供模型内部机制、并能承受服务较重试点动作的组织。这一组合支撑的是一个真实但选择性的市场；短期实质更集中在先进模型团队，而不是泛化的企业
              AI 叙事。
