  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与购买中心
        blocks:
          - type: paragraph
            body: >-
              Goodfire 的公开客户故事聚焦于构建或微调基础模型的组织，而不是终端应用买方。最清楚的宽口径分层主张来自公司联系页面：平台被 Fortune 500 企业、大型医疗机构和 AI
              研究实验室使用。产品页面进一步细化了这幅图景：Silico 面向跨架构和模态训练或微调模型的团队；语言页面指向希望不从头重新训练也能预测失效并改善行为的 LLM
              开发者；生命科学页面指向基因组学和科学模型团队；机器人 / 视觉页面指向物理 AI 和医学影像工作流。综合这些界面，可能的经济买方是负责模型性能和可靠性的 R&D、平台或产品负责人；日常用户则是研究科学家、ML
              工程师和可解释性专家。


              重要限定是，Goodfire 没有把这些细分主张转化为数量、收入组合或具名企业参考。公开材料没有披露客户数、ARR、细分占比，也没有列出广义企业主张背后的 Fortune 500
              用户名单。因此，公开证明集在垂直特异性上远深于商业广度：具名证据集群集中在基因组学、临床研究、AI 智能体安全和材料发现，其余企业叙事仍基本未列举。这种不对称表明，Goodfire 的 GTM
              动作是选择性、高接触的：先赢得少数技术成熟的设计伙伴，之后才可能扩展到更标准化的企业软件分发。
