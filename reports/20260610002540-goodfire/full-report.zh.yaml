      - number: '1.4'
        title: 时间线、封面指标与关键尽调风险
        blocks:
          - type: paragraph
            body: >-
              公开时间线很短，但信息密度高。Goodfire 在 2024 年通过种子融资进入公众视野，2025 年 4 月宣布 Series A，2025 年 9 月公开 Mayo Clinic 合作，2025 年末推出
              fellowship 项目和行业建设型教育内容，随后在 2026 年 2 月宣布 Series B 和更广泛的有意图设计议程。到 2026 年 4 月，MIT Technology Review 把 Silico
              作为调试和引导模型的商业产品报道；到 2026 年 5 月，Goodfire 开始强调 SOC 2 认证和日益面向企业的姿态。这条序列显示，公司试图在不到两年内，把前沿可解释性研究转化为产品与合作伙伴可信度。


              封面指标的关键模式是不对称：估值和累计融资有充分支撑，经营指标仍稀疏。已审阅公开来源没有披露收入、ARR 或客户数。员工数没有官方披露；一份独立简介估计截至 2026 年 1 月约 51
              名员工。这种不透明很重要，因为来源集中最可信的反向证据不是不当行为，而是执行风险：MIT Technology Review 引用一位外部可解释性研究者的观点，认为 Goodfire
              是给「炼金术增加精度」，而不是把 AI 工程变成完全有原则的科学；一份独立健康科技分析则认为，对一家研究优先、商业牵引仍早期的公司来说，Series B
              估值偏激进。因此，尽调负担不在标题可信度，而在商业证明、治理披露，以及可解释性需求多快能转化为可重复的软件收入。
