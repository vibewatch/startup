      - number: '5.4'
        title: 路线图、发布节奏与成熟度
        blocks:
          - type: paragraph
            body: >-
              Goodfire 的发布节奏更像一家快速移动的研究组织在产品化内部栈，而不是一家拥有稳定公开变更日志的传统企业软件供应商。一个公开线索是 2026 年 2 月对早期 SAE 演示界面和 API
              的弃用通知，暗示公司正在脱离狭窄的研究预览工具。到 2026 年 4 月末，MIT Technology Review 已经把 Silico
              作为一款外部可用产品报道；公司自己的融资新闻材料也已经把路线图框定为下一代产品开发，以及在 AI 智能体和生命科学领域扩大合作。


              发布后的节奏仍主要通过研究发布来表达。仅 2026 年 5 月，Goodfire 就发布了 eval-awareness measurement、story-shape geometry 和 SAE-based
              geometry recovery
              相关工作。对于一家试图卖进企业和受监管工作流的公司来说，这种公开迭代速度异常快。它也意味着路线图可见度是不对称的：买方能看到科学引擎快速运转，但还看不到版本化发布说明、公开事故历史或广泛集成目录等普通 SaaS
              证据链。


              因此，成熟度图景是混合但连贯的。核心科学能力看起来强，语言、基因组学和科学发现中的领域工作流也不只是概念。安全姿态具备企业可信度。主要不成熟之处在包装：访问仍需协商，许多部署看起来附带服务，几个关键可靠性和集成细节仍是私有信息。因此，Goodfire
              最成熟的形态，是为拥有严肃模型所有权的团队提供高端设计环境；最不成熟的形态，则是作为广泛标准化的开发者平台。
