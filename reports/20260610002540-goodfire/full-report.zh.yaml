      - number: '8.3'
        title: 退出纪律、论点失效触发器与最终尽调请求
        blocks:
          - type: paragraph
            body: >-
              近中期退出路径几乎肯定是另一轮私募融资或战略交易，而不是 IPO。Goodfire
              太早，也太不透明，难以支撑公开市场承保：投资人没有经审计收入规模、利润率画像，甚至没有基本客户数量披露。这并不意味着公司缺乏吸引力；它意味着投资案例取决于尽调。实际含义是，入场纪律必须盯住那些缺失证明点，它们会决定
              Goodfire 能否从「具有商业前景的杰出研究公司」变成「可承保的软件基础设施业务」。这些证明点包括经常性收入质量、标准定价、集中度、毛利率，以及 Series B 之后的优先权 stack。


              投资论点也可能以可观察方式失效。如果合作者无法转化为可复制客户，如果管理层在 NDA 下也无法披露有说服力的收入质量，或者预算持有人认为相邻供应商的 tracing、监控和护栏已经足够、不需要 Goodfire
              更深的内部控制层，当前价格就难以捍卫。反过来，如果 Goodfire
              能展示可复制软件订阅、强伙伴转化，以及可解释性正在受监管和高风险部署中成为强制性基础设施的证据，本轮估值就有机会被业绩消化。在这些证据出现之前，更有纪律的姿态是把 Goodfire
              放在观察名单前列，继续积极尽调，并避免把 2026 年 2 月价格当成已经验证的便宜货。
