      - number: '4.2'
        title: GTM 动作与单位经济：高接触部署，公开可见度低
        blocks:
          - type: paragraph
            body: >-
              Goodfire 公开 GTM 看起来选择性强、接触度高。Series B 文章称，公司与构建高风险或前沿系统的团队进行深入且选择性的合作；联系页面则描述了一个被大型企业、医疗机构和 AI
              研究实验室使用的平台。客户故事材料说明了这件事在财务上的重要性：在 Prima Mente 合作中，Goodfire
              研究人员嵌入客户团队，并围绕客户模型搭建了一个生物标志物发现流程。使用条款还描述了支持、技术协助、现场工程支持、研究活动、协作活动和交付物。合在一起，这些来源表明，至少部分部署不是纯粹按席位计费的软件订阅；它们很可能把平台访问与定制科学或工程工作结合起来。


              这带来两面影响。积极一面是，嵌入式工作可以加速设计伙伴转化、拓宽产品护城河，并支撑高端企业定价。它也能让 Goodfire
              在客户需要解释帮助而不只是仪表盘的高风险领域发挥作用。消极一面是，服务较重的收入通常扩张更慢，毛利率也往往弱于纯软件。公开来源没有说明 Goodfire
              的收入中有多少来自软件使用、年度许可、试点或研究服务——如果确有收入的话。它们也没有披露客户数、试点转生产转化率、销售周期长度、留存、CAC 或回本周期。


              技术证明点有意义，但不是财务指标。Goodfire 的 RLFR 研究称，相比 LLM-as-a-judge 方法，它以大约低 90 倍的成本把幻觉减少
              58%；生命科学案例研究也展示了诊断和科学发现中的可信客户价值故事。这些是强商业化叙事，但不等同于已披露的收入质量。因此，单位经济桥梁只能是定性的。它展示了从选择性设计伙伴关系走向合同化软件和超额用量收费的可能路径，同时明确每一步的实际数值仍是私有信息。
