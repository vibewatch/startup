      - number: '7.4'
        title: 执行、人才、资本与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              Goodfire 同时在做三件难事：推进前沿可解释性研究，把研究变成企业平台，并在受监管和高风险领域建立品类权威。公开证据显示，相比这份野心，公司规模仍小。On Healthcare 估计员工约 51
              人；可解释性专家的人才池似乎异常稀薄；招聘页也显示组织仍在扩张。同时，2026 年 2 月 Series B 把估值推到 $1.25
              billion，压缩了执行失误的容错空间。一家公司公开披露的客户广度有限、没有公开定价架构、还带有高接触服务成分，现在必须证明自己能足够快地变成可复制软件，才能撑住这个估值。

              实际投资答案，是把这些不确定性转成硬触发器。如果客户合同继续把安全和宕机风险大多留给买方，如果具名生产参考没有实质扩大，如果软件收入仍无法与嵌入式服务分开，或者相邻可观测性平台满足了买方大部分需求，投资论点会迅速走弱。反过来，如果
              Goodfire 能在受监管场景展示生产续约、明显收紧默认条款的企业合同，以及可解释性干预在部署中有效而不只是论文或定制合作中的独立证据，风险就会收缩。在那之前，Goodfire
              更像一个高上行、但仍受证明约束的控制层赌注，而不是已去风险的基础设施标准。
