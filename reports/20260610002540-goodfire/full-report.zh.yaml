  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 估值信念的方向性敏感度；正向条提高支付意愿，负向条削弱支付意愿。
    data:
      items:
        - label: 已验证可复制软件 ARR
          value: 3
          description: 会显著提高对牛市情景的信心。
        - label: 合作伙伴转付费验证
          value: 2
          description: 将支撑可规模化商业化，而不是定制项目。
        - label: SOC 2 / 信任就绪
          value: 1
          description: 支撑高风险企业部署的可信度。
        - label: 未公开披露 ARR 或定价
          value: -3
          description: 对估值信心的最大单项拖累。
        - label: 品类预算被可观测性厂商拿走
          value: -2
          description: 会压缩 Goodfire 的独特切入点。
        - label: 私有 AI 倍数压缩
          value: -2
          description: 即便是强公司，也会被推向基准或熊市情景。
    approximationNotes: 由于缺少公开收入披露，敏感性条是方向性信念分数，不是美元差值。
    claimRefs:
