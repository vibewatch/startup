      - number: '6.2'
        title: 具名客户证明与采用动作
        blocks:
          - type: paragraph
            body: >-
              具名证明集显示，Goodfire 确实在为客户和伙伴做真实工作，但证明类型因账户而异。Prima Mente 是最清楚的模型到科学案例研究：Goodfire 称其将研究人员嵌入 Prima Mente，解读
              Pleiades 表观基因组学模型，并帮助识别一类新的血源性 Alzheimer's 检测生物标志物。Arc Institute 是一个强科学参照，显示 Goodfire
              能大规模处理前沿生物基础模型；不过，Arc 证据仍最好理解为研究合作，而不是常规软件部署，尤其因为初始引导工作被描述为早期阶段。Mayo Clinic
              同样支撑品类可信度、治理准备度和临床邻近性，但公开记录把这项工作框定为研究和假设生成，而非常规临床部署。


              Rakuten 与其他案例不同，因为它是最清楚的公开生产式部署：Goodfire 称，Rakuten 在 AI 智能体中部署 SAE 探针做 PII
              检测，当时系统必须从合成训练数据泛化到真实多语言流量，并满足高召回要求。Radical AI
              提供了第五个材料科学具名证明点，但商业化成熟度仍早期，因为公开披露强调技术进展，并承诺稍后提供更多细节。合在一起，采用动作看起来是咨询式、深度协作式的。Goodfire
              反复描述共享环境、选择性设计伙伴合作、嵌入式工作和逐案定价，而不是自助上手。这是启动先进基础设施产品的可信方式，但也意味着当前证据基础更清楚地证明了技术参与深度，而不是可重复、规模化的软件分发。
