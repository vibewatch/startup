      - 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Goodfire
        - 收入未披露；$150M Series B
        - $1.25B 估值（2026 年 2 月）
        - 本章的直接市场锚点。
        - 没有公开 ARR、定价或客户数据，无法支撑软件倍数。
      - - Anysphere / Cursor
        - '>$500M ARR'
        - $9.9B 估值（2025 年 6 月）
        - 展示一家领先 AI 应用公司在估值匹配已披露规模时的样子。
        - 产品、增长曲线和开发者驱动的分发都不同。
      - - Harvey
        - $190M ARR
        - $11B 据报融资目标（2026 年 2 月）
        - 展示增长得到证明后，顶级企业 AI 估值如何跑赢传统倍数。
        - 法律 AI 是不同垂直领域，且数字来自报道，并非公司确认。
      - - Glean
        - '>$100M ARR'
        - $7.2B 估值（2025 年 6 月）
        - 在已披露 ARR 的企业 AI 价值上，是有用的应用软件参照。
        - 企业搜索和智能体比可解释性更成熟。
      - - Anthropic
        - 前沿模型与算力规模
        - $350B 估值，Google 承诺最高投入 $40B（2026 年 4 月）
        - AI 前沿模型稀缺价值的上界。
        - 运营上不可比；Goodfire 不是前沿基础模型实验室。
  - id: TV005
    title: 投资逻辑破裂与叫停触发表
    notes: 触发项被定义为可观察的尽调发现，或投后监控事件；一旦出现，就会打破承销假设。
    claimRefs:
      - CV036
      - CV043
      - CV046
      - CV049
      - CV050
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入质量持续不透明
        - 管理层在 NDA 下仍无法披露 ARR、毛利率、客户集中度和留存。
        - 投资仍由叙事驱动，而不是基本面驱动。
        - 不要按高于基准情景区间承销；默认放弃。
      - - 没有合作伙伴转付费模式
        - 科研合作者和设计伙伴不能转化为可重复的平台收入。
        - Goodfire 看起来像高端研究工作室，而不是可扩展的基础设施软件。
        - 估值转向悲观情景，要求更低入场价或结构性下行保护。
      - - 可观测性供应商满足预算需求
        - 客户靠追踪、监控和护栏解决痛点，不需要模型内部控制。
        - 品类切入点收窄，Goodfire 的 TAM 被压缩。
        - 大幅降低确信度，重新评估品类所有权。
      - - 优先股堆叠对投资者不友好
        - Series B 文件显示高额优先级、异常保护或有意义的稀释压力。
        - 企业价值可能无法转化为可接受的股权回报。
        - 继续推进前，按股权价值口径重算回报。
      - - 安全或治理可信度下滑
        - 重大信任、合规或治理问题削弱高风险部署叙事。
        - 与安全、可控 AI 绑定的溢价会快速走弱。
        - 暂停尽调，直到补救措施得到独立验证。
  - id: TV006
    title: 最终尽调要求表
    notes: 要把 Goodfire 从一家有意思的公司推进到可按上一轮价格或接近该价格承销的投资，这些是最低要求。
    claimRefs:
      - CV027
      - CV040
      - CV049
      - CV050
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入质量
        - ARR、预订额、净留存、总留存、毛利率和收入结构。
        - 要使用战略期权价值之外的任何估值方法，这些都是核心输入。
        - CFO / NDA 下的财务资料室。
      - - 定价与打包
        - 当前价格表、试点转生产条款，以及软件与服务的变现拆分。
        - 决定业务能否按产品收入而非定制项目扩张。
        - 访谈销售负责人和产品负责人，并审阅合同样本。
      - - 客户集中度
        - 前十大客户、收入集中度、部署范围和续约状态。
        - 高集中度会让当前价格更难辩护。
        - 客户队列审阅和账户级尽调。
      - - 股权结构表与优先权
        - Series B 后股权结构表、清算优先权、按比例认购权和治理保护。
        - 如果优先权很重，股权价值可能与企业价值显著不同。
        - 对融资文件做法律尽调。
      - - 商业转化
        - 证明 Mayo、Arc、Microsoft 或类似关系能形成可重复付费软件模式的证据。
        - 这是科学可信度与可扩展投资案例之间的桥。
        - 管理层深度访谈，要求提供队列案例和实施指标。
