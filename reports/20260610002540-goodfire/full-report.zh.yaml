      - number: '3.3'
        title: 切换成本、替代方案与分发力量
        blocks:
          - type: paragraph
            body: >-
              这个格局里的切换成本并不对称。一旦团队把 Datadog、LangSmith 或 Langfuse 标准化为追踪、评估和生产调试工具，即便这些工具不暴露模型内部机制，也会成为 AI
              质量工作的默认操作界面。这种分发优势很重要，因为许多组织宁愿扩展既有开发者或可观测性栈，也不愿采用新的研究原生工作流。反过来，Goodfire
              最强的用例出现在追踪本身不够的地方：开放权重模型构建者、安全关键领域，以及需要检查特征、把行为归因到训练数据、或在部署前干预的研究团队。主要替代方案仍是由提示词、基准评估、护栏和迭代式微调拼成的黑箱栈，有时由开源工具在内部组装。这条路前期更便宜，也更熟悉；但
              Goodfire 的论点是，它会让团队继续猜测模型为什么表现糟糕。竞争问题在于，买方是否已经被这种猜测—检查循环折磨到愿意把预算从可观测性或提示词工具转向机制化模型设计。
