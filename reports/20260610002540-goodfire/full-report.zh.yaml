      - number: '8.2'
        title: 证据受限的估值框架与可比标记
        blocks:
          - type: paragraph
            body: >-
              收入未披露，传统收入倍数模型会制造虚假精确。更合适的方法，是把可比私人估值标记与基于公开和未公开信息的情景逻辑结合起来。可比集合的价值不在于公式，而在于纪律检查。Anysphere、Harvey 和 Glean
              在媒体给出数十亿美元估值时，都有披露的 ARR；Anthropic 则处在完全不同的前沿模型与算力稀缺宇宙。Goodfire 不属于 Anthropic 的地带；也不同于 Anysphere、Harvey 或
              Glean，它没有公开展示能让外部投资人捍卫倍数的经常性收入基础。这迫使当前轮次只能被解读为战略期权价值。


              因此，牛市、基准和熊市情景取决于里程碑转化，而不是电子表格外推。牛市情景下，Goodfire 证明 Ember 能把设计伙伴和研究合作者转化为可复制软件收入，持续交付差异化可解释性突破，并成为高风险 AI
              部署的必备层。基准情景下，品类真实存在，Goodfire
              仍是其中最强的独立团队之一，但商业化仍早且高接触；这应当对应上一轮折价，而不是溢价。熊市情景下，研究仍令人印象深刻，但预算流向可观测性、护栏或前沿实验室本身，Goodfire
              留下的是定制服务画像，估值也会明显下修。按这个框架，2026 年 2 月轮次更接近牛市区间底部，而不是基准区间中部。
