      - number: '5.2'
        title: 可解释性原语与运行架构
        blocks:
          - type: paragraph
            body: >-
              Goodfire
              的架构把共享实验工作空间与一套研究栈配对，后者覆盖激活分析、几何发现、参数分解和干预工具。官方研究界面显示，稀疏自编码器、探针和流形方法承担早期工作，用来暴露可解释特征；神经几何工作主张，许多重要概念存在于弯曲的内部流形上，而不是单一方向上；随机参数分解则把栈推向更深的权重层，Goodfire
              试图识别哪些因果组件可以在不改变输出的情况下移除。这一组合表明，平台不是单一技术，而是用于解释、定位和编辑模型行为的分层工具包。


              R1 工作尤其能说明能力与摩擦并存。Goodfire
              称其在前沿推理模型上训练了首个公开稀疏自编码器，并为此搭建了定制推理和解释器模型基础设施。与此同时，这项工作也显示，引导推理模型并非即插即用：干预必须发生在模型默认回答前缀之后，一些过重的引导会让行为弹回原始回答。这让核心产品主张更强，而不是更弱：Silico
              的全部意义，就是在客户盲目发布或重新训练之前，把这些隐藏的运行约束暴露出来。


              这套架构也解释了 Goodfire 的依赖栈。最深的工作流需要访问模型内部机制，因此开放权重或客户可控模型比封闭 API 端点更适配。它也解释了为什么 Goodfire
              能把同一组核心想法复用于不同领域。EVEE、Alzheimer's 生物标志物工作、Paint With Ember
              和机器人瓶颈分析都遵循同一模式：抽取内部结构，把它翻译成可读内容，再用这种理解来更有意图地调试、引导或设计模型。
