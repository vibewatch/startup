  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时点
      - 含义
      - 尽调追问
    rows:
      - - 更高风险的 AI 部署
        - 上行
        - 当前
        - AI 进入科学、医疗和自主工作流后，市场会更需要深度验证和控制
        - 追问现有客户把 Goodfire 用于部署前验证，还是事后分析。
      - - 生产率和劳动力压力
        - 上行
        - 12-24 个月
        - 企业看到真实 AI 生产率收益后，更愿意为提升模型可靠性的工具付费
        - 要求证明 Goodfire 能把调试或后训练迭代周期缩短到足以支撑预算。
      - - 相邻可观测性预算常态化
        - 上行
        - 当前
        - 追踪、评测和护栏已经是获批预算类别，预算沟通更容易
        - 追问 Goodfire 多常与 LangSmith、Datadog、Langfuse 或类似平台一起销售。
      - - 科学发现上行空间
        - 上行
        - 12-36 个月
        - 如果结果可重复，生物和机器人用例会把市场从软件团队扩到更广
        - 要求提供科学客户或合作伙伴的收入拆分和续约证据。
      - - 模型访问依赖
        - 下行
        - 当前
        - 闭源模型客户更难服务，因为 Goodfire 需要的访问深度超过多数纯 API 用户能提供的水平
        - 要求拆分管线中开放权重、自有内部、闭源 API 潜在客户的占比。
      - - 治理和验证负担
        - 下行
        - 当前且上升
        - 受监管买方可能最看重可解释性，但采购周期也最长
        - 要求按细分市场提供平均销售周期，以及安全或治理审查耗时。
      - - 机制可解释性的技术不成熟
        - 下行
        - 12-36 个月
        - 业界争论该领域离精密工程还有多近，会压住预算紧迫感
        - 要求提供基准证据，证明 Goodfire 能改变生产任务结果，而不只是研究演示。
      - - Goodfire 定价和客户披露不透明
        - 下行
        - 当前
        - 缺少公开价格和客户数据，外部投资人只能承销一个选择性故事，而不是广谱市场故事
        - 要求按 cohort 披露 ACV 区间、试点到许可转化率和客户数。
    notes: 核心承销问题不是需求是否存在，而是 Goodfire 能否把真实的控制需求转成可重复的商业部署， 且速度快过访问限制、治理摩擦和领域不成熟带来的拖累。
