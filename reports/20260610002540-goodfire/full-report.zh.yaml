  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河或风险判断
      - 支撑证据
      - 反向压力
      - 严重程度
      - 缓释措施 / 尽调问题
    rows:
      - - 机制可解释性是 Goodfire 最清晰的产品护城河
        - Silico、特征调控、数据归因、Llama 调控和探针研究都指向对模型内部机制的直接干预
        - 前沿实验室内部也在做机制可解释性，外部人士也质疑这套工作流现在到底有多成体系
        - 高
        - 要求客户证据，证明机制工作流能改变部署或训练决策，而这些改变是可观测性工具做不到的
      - - 客户能检查开放权重或可适配模型时，Goodfire 最强
        - MIT 称，团队能访问模型内部机制时 Silico 最好用；Goodfire 对外销售的是训练 / 调试模型设计环境
        - 闭源前沿模型限制适用范围；许多企业买家仍从黑盒供应商调用 API
        - 高
        - 按开放权重部署与纯 API 部署拆分客户结构，并提供闭源模型路线图证明
      - - 相邻可观测性厂商能吃掉 AI 质量预算的大部分
        - Arize、Fiddler、Datadog、LangSmith、Langfuse、Arthur 和 Humanloop 都在销售 tracing、评测、护栏或治理能力
        - 这些工具并不能明显解决特征级调试或数据归因，仍给更深的设计层留下空间
        - 高
        - 测试 Goodfire 是否挂在独立预算负责人名下，还是必须挤掉可观测性支出
      - - 其他厂商透明的自助定价，让 Goodfire 不透明定价成为销售风险
        - Arize、Fiddler、Datadog 和 Langfuse 公布入门价，Goodfire 则采用逐案商业条款
        - 如果买家把 Goodfire 看成又一家工具供应商，而不是差异化研究层，价格发现会显得不划算
        - 中高
        - 要求实际成交价格、试点转生产转化率，以及首次产出价值的平均时间
      - - 研究广度只有产品化之后才能变成护城河
        - Goodfire 引用幻觉降低、PII 检测、生物学发现和扩散搜索等多个领域成果
        - 研究组合太宽也会带来聚焦风险，拖慢可重复产品包装
        - 中高
        - 询问路线图和人力中，有多少比例绑定可复用产品，而不是定制研究项目
      - - 品类整合是真实威胁
        - Humanloop 将加入 Anthropic 并停止运营；Weights 团队加入 OpenAI 后已收尾
        - 前沿实验室吸收相邻能力和人才的速度，可能快过初创公司独立规模化
        - 中
        - 评估 Goodfire 更可能成为耐久平台、另一套技术栈里的一个功能，还是有吸引力的收购标的
      - - 只有买家相信可解释性能给可观测性增量加分，治理和信任要求才会利好 Goodfire
        - NIST AI RMF 和 Gartner 都强化了敏感 AI 系统里的治理、评测和隐性运营成本问题
        - 同一批担忧也会增强 Fiddler、Arthur 和 Datadog 等护栏与可观测性既有厂商
        - 中
        - 验证受监管买家是否明确要求机制证据，还是只要 trace 级控制和政策执行就满足
    notes: 严重程度反映的是 Goodfire 自身面对的竞争压力，而不是厂商绝对质量；缓释要求聚焦公开记录缺失的证据。
