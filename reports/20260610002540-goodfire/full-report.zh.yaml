  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流
      - Goodfire 方案
      - 可衡量收益
      - 限制
    rows:
      - - 部署前降低 LLM 幻觉
        - prompt 调整、judge 循环和事后输出审查
        - 模型设计环境内的 RLFR、特征调控和 Hallucinations Viewer
        - 主张幻觉降低 58%，且干预成本比 LLM-as-judge 大约低 90x
        - 证据绑定具体工作流，不是普适性能保证
      - - 调试前沿 reasoning model 行为
        - prompt hack 和粗粒度响应 benchmark
        - R1 上的推理模型 SAE、特征数据库和时序感知调控
        - 展示 backtracking 等推理特定特征，并在大规模下暴露调控边界案例
        - 需要权重或 activation 访问，也需要专家处理模型特定行为
      - - 从科学模型中提取生物标志物
        - 黑盒预测审查和湿实验室分诊
        - 用 SAE、tracing 和 ablation 在客户模型上做嵌入式可解释性工作
        - 发现一个新的 Alzheimer's 生物标志物类别，并得到一个可推广到独立 cohort 的人类可读分类器
        - 仍需要下游实验验证
      - - 解释全基因组变异效应
        - 不透明致病性分数和仅限编码区的工具
        - Evo 2 embeddings，加上通过 EVEE 做探针和推理模型综合
        - 在 839k ClinVar 变异上达到 0.997 AUROC，并为 4.2M 变异生成结构化假设
        - 输出是研究假设，不是诊断或监管级证据
      - - 部署前捕捉机器人或视觉故障
        - 等待 benchmark 失误或生产故障出现
        - 部署前检查 latent policy 结构、几何和泄漏
        - 能在已审阅案例研究中定位瓶颈、未用观测信号和 ECG 泄漏
        - 公开证据来自案例研究，而非产品文档
      - - 直接编辑图像模型行为
        - 只能在提示词框里反复试
        - Paint With Ember 画布可操控潜在激活和概念权重
        - 支持添加、移动、重塑概念，不只是改写提示词
        - 更像研究预览，而不是核心商业 SKU
    notes: 收益项混合了研究直接声称的结果和具体工作流演示。Goodfire 没有发布这些流程的客户级 ROI、转化率或使用频率指标。
