      - - 共享工作区与智能体编排
        - 在 Goodfire 基础设施上运行实验、捕获输出，并协调可解释性任务
        - Goodfire 计算、推理和智能体工具
        - 租户、区域布局和审查 / 审批控制未公开
      - - 激活可解释性层
        - 用 SAE、探针和相关工具定位模型特征与信号
        - 激活访问权限，加上训练好的解释器模型
        - 线性特征方法可能漏掉全局弯曲结构
      - - 几何 / 流形层
        - 复原结构化概念空间，让理解和控制更平滑
        - 面向内部表征的聚类和几何发现流水线
        - 研究成熟度高，但打包后的产品边界尚未完全公开
      - - 参数分解层
        - 将权重拆成因果组件来检查，而不只是观察激活
        - SPD 式分解与掩码方法
        - 可扩展性、运行成本和产品包装仍有一部分处在研究阶段
      - - 监控与故障暴露层
        - 用放大采样和评估感知分析，捕捉训练后罕见故障
        - 前后检查点、发布分析和评审器基础设施
        - 监控发现可能取决于提示词设计，未必自动泛化
      - - 干预与 steering 闭环
        - 应用特征 steering、过滤、奖励塑形和定向模型编辑
        - 编辑权限、回滚纪律和按模型定制的启发式方法
        - 时机错误或过度 steering，可能让推理模型学会绕路
      - - 服务与商业交付层
        - 围绕平台提供支持、技术协助、现场工程和研究合作
        - 订单、Goodfire 人员和合作伙伴工作流
        - 高触达交付会拖慢扩张，也会掩盖价值中有多少来自软件、多少来自服务
    notes: 这是有证据支撑的运营架构，不是官方工程图。它区分了公开方法层，以及租户、供应商栈、数据驻留等未披露基础设施细节。
