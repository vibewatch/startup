  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 科研实力、商业不透明度和本轮价格如何共同导向投资建议。
    data:
      nodes:
        - id: research
          label: 研究实力
          detail: 顶尖团队、2026 年研究产出活跃，合作方强
          type: input
        - id: product
          label: 产品潜力
          detail: Ember 和模型设计环境提供内部调控，不只是可观测性
          type: process
        - id: commercial
          label: 商业不透明
          detail: 未公开披露 ARR、定价、留存或客户数量
          type: process
        - id: price
          label: 当前轮次价格
          detail: $1.25B 已经计入部分牛市情景
          type: process
        - id: decision
          label: 投资建议
          detail: 继续研究；估值立场偏紧；尽调必须补上收入和股权结构缺口
