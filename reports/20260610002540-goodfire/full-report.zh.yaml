  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 按竞争者类别划分的格局
        blocks:
          - type: paragraph
            body: >-
              Goodfire 处在一个不寻常的竞争位置。公开产品语言讲的不是事后提示词监控或通用 LLM 遥测，而是有意图的模型设计、特征引导、定向失效修正，以及对模型内部机制的程序化访问。MIT Technology
              Review 把 Silico 定位为一种机制可解释性工具，把此前集中在 Anthropic、OpenAI 和 Google DeepMind
              内部的技术交到更小公司和研究团队手中。因此，对构建或改造开放权重模型的买方来说，前沿实验室内部可解释性团队和成熟的内部研究团队，是最接近的直接替代方案。更广义的商业格局更拥挤，但间接性更强。Arize
              Phoenix、LangSmith、Langfuse、Datadog、Fiddler、Arthur，以及 Humanloop 等已退出独立平台的公司，都在争夺可信 AI
              开发相关预算；但它们默认的控制点是围绕已部署系统的追踪、评估、护栏或治理，而不是深入编辑已学得的表示。实际含义是，评估 Goodfire
              时不应把它当作又一个可观测性仪表盘，而应视为一层新工具，服务于需要在训练前、训练中和训练后理解机制的模型构建者。
