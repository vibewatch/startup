      - CV039
      - CV040
      - CV041
      - CV043
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 以 2026 年 2 月 $1.25B 轮次为参照、受证据约束的估值区间。
    data:
      items:
        - label: 熊市情景
          low: 350
          base: 475
          high: 650
          unit: $M
          description: 商业化停留在定制项目，或品类估值下修；约为本轮价格的 0.3x-0.5x。
        - label: 基准情景
          low: 800
          base: 950
          high: 1100
          unit: $M
          description: 品类潜力真实，但商业验证不完整；约为本轮价格的 0.6x-0.9x。
        - label: 牛市情景
          low: 1250
          base: 1500
          high: 1850
          unit: $M
          description: 可复制软件收入叠加持久企业采用；约为本轮价格的 1.0x-1.5x。
        - label: 当前轮次参照
          low: 1250
          base: 1250
          high: 1250
          unit: $M
          description: 2026 年 2 月 Series B 锚点，用于构建回报框架。
    approximationNotes: 这些情景区间来自公开可比公司和里程碑逻辑，不能替代有 NDA 支撑的财务承销。
