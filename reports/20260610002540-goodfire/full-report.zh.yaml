        - 已上线，但预览工具废弃后仍在演进
        - 直接特征调控、奖励塑形和数据过滤式编辑
        - 支持模型矩阵、回滚控制和商业包装仍为私有
      - - 语言可靠性工作流
        - 开放模型或微调团队
        - 最具体的公开工作流
