        - 前沿实验室和企业模型团队
        - 线上产品界面；访问受控
        - 围绕模型设计环境包装可解释性，而不是做应用层仪表盘
        - 无公开租户模型、API 参考或部署架构
      - - 模型科学家 agent / 实验编排
        - 研究人员和模型工程师
        - 内部已上线，并在发布材料中公开描述
        - 在同一工作区内自动化实验规划和执行
        - 人工审核规则、护栏和客户自主级别未公开
      - - 诊断和健康检查
        - 训练、评测和安全团队
        - 线上工作流主张
        - 部署前暴露瓶颈、特征塌缩、捷径学习和罕见故障
        - 未按模型类别公布 precision/recall 或 benchmark 覆盖
      - - 调控和干预控制
