      - number: '1.3'
        title: 融资历史、投资人基础与当前阶段
        blocks:
          - type: paragraph
            body: >-
              对一家研究优先的基础设施公司来说，Goodfire 的融资速度异常快。公开来源显示，公司在 2024 年 8 月完成由 Lightspeed 领投的 $7 million 种子轮，2025 年 4 月完成由
              Menlo Ventures 领投的 $50 million Series A，并在 2026 年 2 月完成由 B Capital 领投、估值 $1.25 billion 的 $150 million
              Series B。Series A 财团加入了 Lightspeed、Anthropic、B Capital、Work-Bench、Wing 和 South Park Commons；Series B
              则在原有投资人之外，把 Juniper Ventures、DFJ Growth、Salesforce Ventures 和 Eric Schmidt 加入股权结构表。Goodfire
              与第三方报道都把累计融资约为「超过 $200 million」，而简单相加已披露轮次则意味着约 $207 million。


              投资人组合与融资金额同样重要。Anthropic 参与 Series A，是来自安全导向前沿实验室的战略信号；Salesforce Ventures 指向企业软件采用角度；B Capital 在 Series B
              领投，则反映出其相信可解释性可能成为一层重要基础设施。不过，公开记录对持股比例、清算结构、债务、老股交易和董事席位披露很少。已审阅公开来源把 Goodfire
              标为私营公司；应把公司视为一家后期风投阶段、Series B 私营企业，而非已经规模化的商业软件公司。这个区分很重要，因为融资速度和估值已经远超公司已披露的收入与客户指标。
