    rows:
      - - 品类需求
        - 企业要求 AI 可控、可解释，可解释性应变得更重要。
        - 企业可能认为可观测性和护栏已经够用，让可解释性停留在小众需求。
        - 预算数据显示 Goodfire 赢下的是标准预算线，而不是实验性支出。
      - - 产品
        - Ember 提供差异化的模型内部控制层，不只是事后监控。
        - 产品可能仍过于研究化或定制化，难以作为软件扩张。
        - 标准定价、价值兑现周期和可复制部署的证据。
      - - 科学证明
        - Goodfire 有真实研究产出，包括引导、神经几何、基因组学和多模态工作。
        - 科学可信度不会自动转化为经常性收入。
        - 旗舰研究项目能转化为持久商业账户的证据。
      - - 战略需求
        - Anthropic、Salesforce 和 Eric Schmidt 是该品类的强信号投资人。
        - 热门 AI 市场里，聪明投资人仍可能为战略期权价值付高价。
        - 独立软件指标验证价格，而不是依赖股权结构表声望。
      - - 估值
        - 如果 Goodfire 成为高风险部署的核心 AI 基础设施，$1.25B 标记可以被解释。
        - 今天的公开证据没有披露支撑该标记所需的 ARR 或利润率。
        - NDA 披露的 ARR、毛利率和留存能支撑可扩张软件倍数。
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    notes: 情景值是受证据约束的企业价值区间，不是精确 DCF 输出。回报逻辑以 2026 年 2 月 $1.25B 轮次标记为基准。
