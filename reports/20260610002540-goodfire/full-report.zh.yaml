        - 围绕高后果决策支持或专门模型治理的试点
        - 领域预算加治理监督
        - 扩大部署前，需要透明、可审计的行为
    notes: 买方、用户、付款方的拆分很重要，因为 Goodfire 卖的是高接触能力层。每个细分市场里， 最好的触发点都是客户足够掌控、能够深入检查的高价值模型。
