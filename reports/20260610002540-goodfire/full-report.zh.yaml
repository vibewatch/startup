  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 产品
      - 公开价格 / 合同模式
      - 包装细节
      - 包含能力
      - 未知项 / 折扣
      - 含义
    rows:
      - - Goodfire / Silico
        - 按案例收费；Goodfire 拒绝给出具体定价
        - 按客户需求定制商业合作
        - 模型设计环境、实验 agent、机制调试和引导
        - 未披露公开自助标价或使用量计费表
        - 买方更难对标 ROI；产品必须靠差异化结果销售，而不是靠透明入门价格
      - - Arize AX / Phoenix
        - 免费层；AX Pro $50/月；企业定制
        - Pro 含每月 50k spans 和 10GB；企业可选 SaaS 或自托管
        - 追踪、评测、数据集、实验、可观测性
        - 提到创业公司定价，但未公开列出细节
        - 为主要需要 agent 遥测和评测工作流的团队设定低入门门槛
      - - Fiddler AI
        - 免费层；Developer 每条 trace $0.002；企业定制
        - Developer 计划增加统一可观测性、自定义评测器、SSO、SaaS 部署
        - 可观测性、测试和实验、护栏、治理
        - 企业定价除层级框架外未公开
        - 围绕已部署系统的安全和治理预算，形成按量竞争
      - - Datadog LLM Observability
        - 每月 40K 个 LLM spans 以内免费；Pro 起价 $160/月，含 100K 个 spans
        - 100K spans 后按需超量计费；M2M 和年度承诺有折扣
        - Agent 可观测性、评估、留存选项、敏感数据扫描
        - 留存附加项和完整企业包装随承诺不同而变化
        - 对已标准化使用 Datadog 的团队，是强在位捆绑
      - - LangSmith
        - 开发和小规模生产有免费层；付费计划随 trace 量扩展；企业需联系
        - 与框架无关的 SDK 访问，并可按使用量付费扩展
        - Agent 追踪、可观测性、调试
        - 已审阅页面未显示准确公开价格
        - 当团队需要工作流可见性而不是模型内部控制时，预算重叠最强
      - - Langfuse
        - 免费 Hobby 层；$29 Core；$199 Pro；$2499 Enterprise
        - 基于 units 计费，含 50k 免费和付费计划内 100k；可选 $300 Teams 附加项
        - 追踪、评测、prompt、分析、合规功能、自托管选项
        - 标价 unit 阶梯之外的量价折扣
        - 透明定价和 OSS 姿态，会挤压主打通用 AI 工程价值的供应商
      - - Humanloop（历史）
        - 免费试用；企业 / 定制计划
        - 2 名成员、50 次 eval run、每月 10K 条日志；VPC 附加项和企业支持
        - Prompt 管理、评测、可信 LLM 应用工作流
        - 被 Anthropic 收购后，独立商业未来已经消失
        - 说明相邻平台品类可能在独立成熟前就并入前沿实验室
      - - 内部黑箱栈
        - 无软件单列支出；内部人力加云和工具开支
        - 混合使用现有工具中的 prompt、评测框架、微调和护栏
        - 团队不愿新增供应商支出时的灵活替代路径
        - 真实总成本常藏在合规审查、再训练和内部开销里
        - 除非 Goodfire 证明调试、安全或领域结果明显更好，否则现状仍可行
    notes: 公开定价结合了官方标价、层级描述和已审阅页面明确披露的未知项； 没有数字被视为证据缺口，而不是隐藏假设。
