    rows:
      - - 乐观
        - Ember 把研究可信度转化为可复制软件收入；合作伙伴成为规模化参考客户；安全和治理姿态打开企业采用。
        - $1.25B-$1.85B EV；约为上一轮的 1.0x-1.5x，也就是说有上行，但除非执行极强，否则空间不大。
        - 商业转化可能仍比研究叙事暗示的更慢。
        - 低-中；需要尚未公开的证据。
      - - 基准
        - 品类需求真实存在，Goodfire 仍是最强的独立团队之一，但变现还早，且部分项目仍需定制。
        - $0.80B-$1.10B EV；约为上一轮的 0.6x-0.9x，意味着按当前价格计算，风险调整后回报偏弱。
        - 公开数据始终无法补上收入质量缺口；预算分流到相邻供应商。
        - 中；最符合当前公开证据。
      - - 悲观
        - 可解释性仍有价值，但预算转向可观测性、护栏或前沿实验室；Goodfire 难以把产品收入标准化。
        - $0.35B-$0.65B EV；约为上一轮的 0.3x-0.5x，意味着永久资本损失风险显著。
        - 商业化仍偏定制；多重压缩冲击 AI 基础设施公司。
        - 中-低，但披露有限，一旦不利仍足以影响判断。
