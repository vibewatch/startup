    type: flow
    layout: standard
    summary: 因客户数量未披露，采用图以部署流程而非数字漏斗呈现：Goodfire 似乎从选择性寻客推进到共享环境工作、技术验证，并且只偶尔披露生产推出。
    data:
      nodes:
        - id: prospect
          label: 选择性潜在客户
          detail: 面向有高风险可解释性问题的前沿实验室、医疗机构、企业 AI 团队或模型构建者
          type: input
        - id: access
          label: 申请访问
          detail: 接触驱动的评估；无公开自助定价或结账
          type: process
        - id: workspace
          label: 共享工作区
          detail: Goodfire 把模型设计环境前置部署给客户
          type: process
        - id: engagement
          label: 深度技术参与
          detail: 可解释性实验、探针、模型引导或嵌入式研究支持
          type: process
        - id: validation
          label: 技术验证
          detail: 客户评估可量化收益，例如生物标志物信号、PII 召回率或候选材料质量
          type: process
        - id: production
          label: 生产 / 后续
          detail: 生产护栏部署或持续多阶段研究关系
          type: output
      edges:
        - from: prospect
          to: access
          label: 入站兴趣 / 外联
        - from: access
          to: workspace
          label: 早期访问范围界定
        - from: workspace
          to: engagement
          label: 联合埋点和实验
        - from: engagement
          to: validation
          label: 衡量技术结果
        - from: validation
          to: production
          label: 部署或继续合作
    claimRefs:
      - CU009
      - CU011
      - CU022
      - CU024
      - CU029
      - CU030
      - CU031
      - CU032
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: standard
    summary: 该矩阵从披露、量化结果、生产成熟度、独立佐证和留存可见性几个维度，比较每个具名参考客户的公开质量。
    data:
      columns:
        - 具名披露
        - 结果具体性
        - 生产成熟度
        - 独立佐证
        - 留存可见性
      rows:
        - label: Prima Mente
          values:
            - 高
            - 高
            - 研究 / 预验证
            - 中
            - 低
          note: 最强的科学发现案例研究，但发表和实验验证仍待完成。
        - label: Arc Institute
          values:
            - 高
            - 中
            - 研究合作
            - 高
            - 中
          note: Nature 相关更新提升了可信度，但公开记录仍强调研究，而非生产部署。
        - label: Mayo Clinic
          values:
            - 高
            - 高
            - 研究 / 转化
            - 中
            - 中
          note: 大型机构名称和量化 EVEE 指标有帮助，但该工作仍在同行评审中，且未被描述为常规临床生产。
        - label: Rakuten
          values:
            - 高
            - 高
            - 生产部署
            - 中
            - 低
          note: 最好的生产证明，但公开的具名企业部署只有一个，且未披露续约数据。
        - label: Radical AI
          values:
            - 高
            - 中
            - 早期设计伙伴关系
            - 低
            - 低
          note: 量化技术收益值得期待，但商业化成熟度和重复使用记录仍很少。
