      - number: '2.2'
        title: 买方分层、预算所有者与采用路径
        blocks:
          - type: paragraph
            body: >-
              最清晰的买方，是既控制重要模型、又能暴露足够内部状态让 Goodfire
              做出有意义工作的团队。前沿实验室位于名单最上方，因为它们已经有可解释性工作，拥有能使用工具的研究和安全人员，并直接承受塑造模型行为的压力。企业模型团队排在其次，前提是它们拥有自研或开放权重模型，并能用 AI
              平台或先进工程预算证明专用工具的合理性。基因组学、生物学、机器人等研究密集领域的科学 AI
              团队尤其相关，因为可解释性可以验证预测到底来自真实结构还是捷径，并能暴露人类可复用的领域知识。受监管采用者需求强，但隐私、治理和证据要求叠加，拉长了成交周期。


              付款方并不总是最终用户。研究负责人、CTO、平台负责人或科学项目 owner 可能购买；模型科学家、安全团队和计算研究者使用；中央 AI
              R&D、平台或研究项目预算买单。公开法律和产品证据暗示，销售动作以试点优先：识别一个高风险模型问题，拿到模型和数据访问权限，在共享环境中运行可解释性或引导工作，证明控制或验证结果，然后才扩展到更长期的监控或授权。这套动作更适合高接触、设计伙伴型市场，而不是大规模自助式软件市场。
