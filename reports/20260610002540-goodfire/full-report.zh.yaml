      - number: '4.3'
        title: 资本充足性与融资：融资已验证，现金跑道未验证
        blocks:
          - type: paragraph
            body: >-
              公开记录中最强的财务事实是融资事实。Goodfire 在 2025 年 4 月宣布 $50 million Series A，并在 2026 年 2 月宣布估值 $1.25 billion 的 $150
              million Series B。SEC Form D 文件让这些公告更精确。2025 年文件显示，在 2025-04-02 首次出售后已售出 $52,029,991；2026 年文件显示，在
              2025-12-17 首次出售后，针对 $161,674,124 的总发行额已售出 $149,999,796。基于这个窄口径，两轮已披露融资中至少 $202.0 million
              的股权出售，可以由一级申报数据直接验证；公开评论则把包括早期资本在内的总融资略高于 $200 million。


              这一融资事实模式支撑一个清晰结论：Goodfire
              拥有强资本获取能力。但它没有回答核心的资本充足性问题。已审阅公开来源没有披露手头现金、月度烧钱速度、现金跑道月数、债务契约或下一轮触发条件。公开资金用途很宽：前沿研究、下一代产品开发，以及在 AI
              智能体和生命科学领域扩大合作。这些都是真实现金用途，但分母缺失，无法推导现金跑道。即便 2026 年 Form D
              中一个相对小的额外线索——总发行额高于已宣布售出金额——也只说明该轮可能有容量或预留，而不是实际仍可用现金。


              因此，财务估计区间保持克制，只框定有来源支持的融资事实。它不发明收入、烧钱速度或现金跑道。同样，资本强度图展示现金可能流向哪里——产品、研究、嵌入式交付和企业合规——同时保留已记录融资与推断成本结构之间的区别。这才是证据约束下的正确立场：融资得到验证，但融资之外的资本充足性无法从公开数据承保。
