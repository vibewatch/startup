      - number: '7.3'
        title: 伙伴、客户与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Goodfire 的公开市场证明，比标题听起来更窄。公司称平台被 Fortune 500 企业、医疗机构和 AI 实验室使用，但公开具名证据集中在少数合作：Prima Mente
              的阿尔茨海默病生物标志物发现、Mayo Clinic 的基因组医学、Radical AI 的材料科学，以及面向训练或微调模型公司的申请访问产品页。即便最强的案例研究，也描述 Goodfire
              研究人员嵌入客户团队、共同搭建流程。这是技术深度的有价值证据，但更像高接触交付模式，而不是清晰可复制的软件收入。MIT Technology Review 提到的逐案定价，以及 On Healthcare
              观察到的尚非可预测 SaaS 画像，都指向同一模式。

              这种集中度带来两个相连风险。第一，公开参考质量偏伙伴驱动，而非广泛客户基础：如果一个旗舰合作停滞，披露出来的体量不足以吸收叙事冲击。第二，更广泛的买方工作流里，已经有 Datadog、LangSmith
              等可观测性和评测供应商的相邻产品，为生产 AI 团队打包测试、tracing、监控和治理。这些平台不是机制可解释性的等价物，但它们争夺预算，也争夺定义生产中 AI 控制与监控形态的权利。因此，Goodfire
              需要证明深度白盒访问是一层值得单独购买的控制层，而不只是客户已理解 stack 里的高级研究插件。
