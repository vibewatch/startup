      - - 安全和正常运行时间姿态仍不透明
        - 除 SOC 2 外，没有公开正常运行时间、事件历史或运行时控制证据
        - 又一个刷新周期过去，仍没有 SLA、状态页或事件披露
        - 假设敏感工作负载中的企业渗透会更慢。
      - - 人才管线走弱
