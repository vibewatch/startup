      - number: '2.3'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              需求侧条件有利。PwC 显示，AI 暴露度高的行业正在产生显著更高的人均收入，并支付较大的技能溢价，说明企业确实愿意为提高 AI
              系统效果的工具付费。同时，相邻供应商反复把可观测性、护栏和评估描述为业务关键，因为自主系统如今已经触达收入、运营和用户体验。这对 Goodfire
              有利，因为预算对话已经存在；公司不需要从零发明可靠性或控制的重要性。其科学和受监管用例也恰好对应仅看输出的评估最不充分、深层可解释性最有战略价值的场景。


              刹车因素同样重要。Gartner 称 ROI 差异很大，隐藏实施成本可能很高。NIST 式治理预期、数据隐私规则以及临床或科学验证标准都会拖慢部署。最重要的是，Goodfire
              自身叙事和独立报道都同意，这个领域技术上仍不成熟：公司营销的是精密工程，但外部批评者、甚至 Goodfire
              自己的研究论文都承认，可解释性仍有重大开放问题。再叠加对模型内部访问的要求，以及公开定价和客户数据缺失，估值就应锚定一个选择性高价值楔子，而不是大众市场软件假设。
