        - 下一轮刷新周期内新增已点名生产参考客户少于 3 个
        - 将公司重新定价为定制研究 / 服务业务，而不是基础设施层。
      - - 研究结果没有转化为部署提升
        - 没有独立证据证明可解释性干预带来生产收益
