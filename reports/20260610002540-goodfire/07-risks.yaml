- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Contract paper remains startup-favorable
    - Enterprise MSAs still mirror public liability caps and warranty disclaimers
    - No meaningful security / outage / confidentiality carve-out in first 3 reference customers
    - Treat regulated-deployment thesis as unproven; do not underwrite healthcare or critical-infrastructure expansion.
  - - Data-rights friction blocks procurement
    - Customers require major redlines around Workflow Data or refuse data sharing entirely
    - Two or more priority accounts stall specifically on data-use terms
    - Assume slower sales cycles and weaker product-learning loop; haircut software-scale assumptions.
  - - Reference set fails to broaden
    - Named production customers do not expand beyond current collaboration-heavy proof set
    - Fewer than 3 additional named production references within the next refresh cycle
    - Re-rate company as bespoke research/services business rather than infrastructure layer.
  - - Research results do not translate into deployment lift
    - No independent evidence of production gains from interpretability interventions
    - No third-party deployment study or customer KPI showing measurable improvement
    - Reduce moat assumption and compare directly against conventional observability vendors.
  - - Security and uptime posture stays opaque
    - No public uptime, incident history, or runtime-control evidence beyond SOC 2
    - Another refresh passes without SLA, status, or incident disclosures
    - Assume slower enterprise penetration in sensitive workloads.
  - - Talent pipeline weakens
    - Hiring velocity or retention falls in core interpretability roles
    - Missed senior research / product hires for two consecutive quarters
    - Expect roadmap slippage and heavier founder / researcher concentration risk.
  - - Valuation outruns repeatability
    - Capital raised and valuation grow faster than visible revenue quality
    - No pricing standardization or software-services split by next major financing event
    - Avoid paying for category-optionality without evidence of repeatable unit economics.
  - - Observability platforms absorb the buyer problem
    - Customers adopt tracing/evaluation stacks without adding white-box interpretability
    - Reference buyers describe Goodfire as nice-to-have research tooling rather than control-plane infrastructure
    - 'Thesis break: category collapses into a feature rather than a standalone platform.'
  notes: Kill criteria are framed as observable public-or-diligence events so they can be revisited in future refreshes instead of remaining abstract concerns.
