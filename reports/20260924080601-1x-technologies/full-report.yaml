      - number: '6.2'
        title: Named proof and adoption trajectory
        blocks:
          - type: paragraph
            body: >-
              The strongest proof point in the current material is not a mature customer base; it is a pipeline of
              interest, preorder activity, and early deployment experimentation. The company's internal home testing and
              employee usage show that it is using itself as a test environment, while the EQT program shows that the
              enterprise story is still being shaped through partner distribution.


              That is a reasonable phase for a robotics company, but it should be read carefully. A preorder is a sign
              of demand, not revenue retention. A partner rollout is a sign of channel possibility, not proven
              enterprise penetration. That is enough to show interest, but not yet enough to prove durable conversion.
            claimRefs:
              - CU004
