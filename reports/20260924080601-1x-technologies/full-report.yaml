      - number: '1.4'
        title: Operating milestones and refresh deltas
        blocks:
          - type: paragraph
            body: >-
              The 2025-2026 refresh cycle is dominated by three visible milestones: NEO Gamma, the home-robot preorder
              launch, and the EQT portfolio-company partnership. Together they show a company trying to turn
              teleoperated capability into repeatable deployment, first in homes and then in controlled enterprise
              settings. The factory update adds a fourth signal by indicating that 1X is trying to scale manufacturing
              alongside product development.


              None of those milestones remove the hard questions. The company still has not published a durable autonomy
              benchmark, a verified revenue run rate, or a clean valuation anchor, so the refresh should be read as
              commercial progress rather than a completed underwriting story.
