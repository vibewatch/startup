      - number: '6.3'
        title: Concentration and durability risk
        blocks:
          - type: paragraph
            body: >-
              Concentration risk is the main customer-side caution. If a small number of strategic partners or early
              adopters generate most of the visible traction, the company becomes more sensitive to rollout delays and
              procurement friction. The missing metrics make that risk hard to quantify, which is itself a red flag for
              diligence.


              The right conclusion is not that customer demand is weak; it is that the evidence is still too thin to
              show durable expansion. Until 1X publishes stronger retention, repeat deployment, or location-level
              adoption evidence, the customer story remains earlier than the company narrative suggests.
            claimRefs:
              - CU007
              - CU009
              - CU010
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk register
        blocks:
          - type: paragraph
            body: >-
              The highest-risk issue is still the same one that makes 1X interesting: the consumer robot is compelling,
              but not yet fully autonomous. That creates privacy risk, trust risk, and margin risk simultaneously
              because the human-in-the-loop layer is both operationally expensive and socially sensitive.


              Operationally, the factory and field ramp matter just as much. Robotics can fail in the physical world in
              ways software companies do not, so yield, reliability, and safety are material. Add in competitive
              pressure, uncertain funding, and a major partner channel, and the risk stack remains clearly high rather
              than merely medium. The company should therefore treat operational controls as a strategic capability, not
              just an overhead line.
