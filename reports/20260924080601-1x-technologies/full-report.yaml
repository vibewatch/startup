      - number: '3.2'
        title: Where 1X is differentiated today
        blocks:
          - type: paragraph
            body: >-
              1X's best public differentiation is not raw autonomy leadership; it is the combination of home-first
              product design, teleoperation data collection, and a distribution channel through EQT. That combination is
              unusual and potentially valuable because it lets the company gather real-world data while using a
              partner-led commercial path to create early deployment volume.


              Still, the comparison set is unfavorable in one important respect: several competitors look more mature in
              industrial deployment proof. The company therefore needs to turn technical novelty into visible
              reliability, repeatability, and pricing power before the market treats humanoids as interchangeable.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP009
              - CP011
      - number: '3.3'
        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The moat question remains open. Public evidence supports a narrative about learning-from-use, but that is
              not the same as a durable moat. If rivals can match the form factor, undercut the price, or win the same
              early enterprise deployments, 1X will have to prove that its data flywheel is more than a marketing line.


              That is why the most useful competitive lens is not who has the flashiest prototype. It is who can sustain
              iteration speed, win deployments, and absorb the operating burden of real-world robots without losing
              safety or margin discipline.
            claimRefs:
              - CP003
              - CP008
              - CP010
              - CP012
