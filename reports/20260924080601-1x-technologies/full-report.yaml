      - number: '2.2'
        title: Buyer and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              The buyer stack is heterogeneous. Households may pay directly for NEO, but the first scaled enterprise
              buyers are more likely to come through partners like EQT or through operators that need labor substitution
              in constrained environments. This makes the company's go-to-market path look more like a staged rollout
              than a single top-down platform sale.


              That is also why adoption triggers are uneven. Consumer demand depends on trust, safety, and the
              willingness to host teleoperation, while enterprise demand depends on narrow ROI, task reliability, and a
              clear path to integration with existing workflows.
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM009
              - CM011
      - number: '2.3'
        title: Sizing evidence and market gaps
        blocks:
          - type: paragraph
            body: >-
              There is no clean public TAM in the evidence set. The company itself markets a broad labor-abundance
              narrative, but the external sources are still mostly directional: they discuss labor shortages,
              physical-AI growth, and humanoid commercialization rather than a single audited market number. That makes
              the sizing exercise more about scenario discipline than precision.


              A conservative investor should therefore treat all market-size claims as provisional. The right diligence
              question is not whether humanoids are a large market in the abstract; it is whether 1X can capture enough
              early enterprise value to fund the autonomy and manufacturing curve required for the home market.
            claimRefs:
              - CM004
              - CM008
              - CM010
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct peers, incumbents, and substitutes
        blocks:
          - type: paragraph
            body: >-
              The competitive field is broader than humanoid-only headlines suggest. Tesla, Figure, and Agility form the
              best-known US humanoid set, but the real substitute layer also includes non-humanoid home robotics,
              low-cost Chinese entrants, and even status-quo labor. That matters because 1X is not only competing for
              the future of robotics; it is also competing against cheaper or simpler ways of getting work done.


              From an investor perspective, this means the company's moat is still emergent. The field is capital
              intensive, visible, and fast-moving, so any advantage has to come from a compound of hardware, data,
              distribution, and trust rather than from one feature alone. That makes sourcing, deployment, and learning
              speed more important than prototype theatrics alone.
