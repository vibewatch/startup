  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitute set
        blocks:
          - type: paragraph
            body: >-
              1X should not be modeled as a single-category consumer robotics bet. The sourced material repeatedly
              places it across two adjacent markets: enterprise humanoids that can handle logistics, security, and
              facility work, and consumer humanoids that can eventually handle chores at home. That boundary matters
              because the substitute set is different in each case. In homes, the substitute is still human labor or a
              narrow appliance; in enterprise settings it is often a worker, contractor, or conventional automation
              stack.


              The practical implication is that 1X can win in one market before it wins in the other. Enterprise
              channels appear easier to validate economically, while the consumer product carries higher trust and
              privacy hurdles.
            claimRefs:
              - CM001
              - CM003
