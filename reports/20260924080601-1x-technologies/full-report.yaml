      - number: '7.2'
        title: Consumer, legal, and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              The consumer version of the business is the most sensitive to privacy and regulatory scrutiny because a
              home robot can see, hear, and potentially be remotely guided inside a private space. That makes
              transparency, consent, and data handling core business risks rather than just legal paperwork.


              This is also where the company's public narrative is most exposed. If buyers perceive the robot as a
              teleoperated data collector rather than a household helper, the trust premium collapses quickly.
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR011
      - number: '7.3'
        title: Operational and dependency risks
        blocks:
          - type: paragraph
            body: >-
              The Hayward factory update is encouraging, but a factory announcement is not the same as stable
              production. Yield, service burden, and reliability are still live questions. On top of that, the EQT
              channel and OpenAI relationship introduce dependency and conflict risk that can complicate execution even
              when the product is improving.


              The practical consequence is that investors need to watch not just shipment counts but also the failure
              rate, partner pace, and whether teleoperation costs shrink as the product scales. The business also needs
              enough internal process discipline to avoid turning every issue into a custom exception. Even small
              process gaps can compound quickly in a robotics business. That is the real operational moat.
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis and recommendation
        blocks:
          - type: paragraph
            body: >-
              The refreshed evidence still supports a cautious stance. 1X is a real company with impressive technical
              ambition, meaningful capital access, and visible commercial intent, but the proof set is not yet strong
              enough to call the valuation attractive. The right label is therefore track: the story is compelling
              enough to monitor closely, but not clean enough to underwrite aggressively.


              That recommendation is driven less by disbelief than by timing. The company is moving quickly, but the
              public record still leaves the critical questions open: autonomy, economics, and the convertibility of
              early interest into repeatable revenue.
