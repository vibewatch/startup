chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and product posture
        blocks:
          - type: paragraph
            body: >-
              1X Technologies is a humanoid robotics company that presents itself as a vertically integrated builder of
              both home and enterprise robots. The latest public materials place the company in Palo Alto while keeping
              manufacturing in Hayward and Moss, which matters because the build-and-train loop depends on physical
              iteration, not just software releases. The business now spans a consumer home robot, NEO, and an
              enterprise deployment path anchored by EQT, so the company should be read as a hardware-and-data platform
              rather than a single SKU startup.


              That mix makes the operating model unusually capital intensive. The visible product line has moved from
              EVE toward NEO Gamma and the 2025 preorder launch, while the public evidence still leaves revenue,
              valuation, and exact headcount unresolved. The result is a company with real commercial signals but
              incomplete financial transparency.
