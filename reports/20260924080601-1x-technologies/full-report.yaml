      - number: '1.3'
        title: Capital history and recent financing signals
        blocks:
          - type: paragraph
            body: >-
              The funding trail is strong enough to show momentum but not strong enough to eliminate uncertainty.
              Confirmed company statements cover the 2023 Series A2 and 2024 Series B, while The Information and
              Humanoids Daily point to 2025 fundraising discussions that have not been closed publicly. That leaves the
              latest capital picture as part confirmed, part reported, and part still unresolved.


              The practical takeaway is that 1X looks well backed for a robotics company, but the next financing step
              remains a live diligence item. If the rumored larger raise slips or re-prices, that would affect both
              runway and valuation discipline.
