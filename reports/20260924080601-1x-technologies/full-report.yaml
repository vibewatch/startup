      - number: '1.2'
        title: Founding, leadership, and governance signals
        blocks:
          - type: paragraph
            body: >-
              The founder and CEO story is still central to 1X's positioning. Bernt Øivind Børnich appears throughout
              the public record, which is a strength because it provides continuity through rebrands and product pivots,
              but it also creates key-person dependence. Leadership additions around AI, engineering, and people
              operations indicate that the company is trying to professionalize beyond the founder brand.


              Governance remains opaque. No public board roster, equity table, or charter materials surfaced in the
              reviewed sources, so investors must assume that board rights and control terms are still being negotiated
              privately. For diligence, that is less a problem to solve than a fact to price into the risk posture.
            claimRefs:
