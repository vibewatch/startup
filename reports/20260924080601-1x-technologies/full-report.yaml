      - number: '5.2'
        title: Hardware, software, and learning loop
        blocks:
          - type: paragraph
            body: >-
              1X presents the product stack as a closed loop: hardware collects data, the world model simulates possible
              futures, and deployment refines the policy. That architecture is important because it means the company is
              trying to make every robot serve as both product and training asset. The manufacturing footprint in
              Hayward and Norway is part of the system, not just a cost center.


              The challenge is that the loop still depends on teleoperation to fill the gap between demonstration and
              autonomy. That does not invalidate the architecture, but it does mean the company has to prove the
              transition from guided behavior to self-directed behavior in a real home.
            claimRefs:
              - CE002
              - CE003
              - CE005
              - CE008
              - CE009
              - CE011
      - number: '5.3'
        title: Trust, safety, and roadmap tension
        blocks:
          - type: paragraph
            body: >-
              The public materials lean hard into safety and physical design, which makes sense because a humanoid
              inside a home has to earn trust before it can earn revenue. Soft covers, tendon drive, and on-board
              sensing are not cosmetic details; they are the conditions that make domestic deployment plausible.


              At the same time, the most important product risk is the gap between the marketed promise and the actually
              delivered autonomy level. If expert-guided sessions remain the norm instead of the bridge, the product can
              still be useful, but the commercial thesis changes materially. That is the central commercialization
              hinge.
            claimRefs:
              - CE006
              - CE007
              - CE010
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and early demand
        blocks:
          - type: paragraph
            body: >-
              The customer picture is segmented rather than broad. On the consumer side, 1X appears to be selling to
              very early adopters who are comfortable paying for a robot that is still evolving. On the enterprise side,
              the EQT channel points to portfolio companies, which is a different buyer motion entirely. That split
              matters because the two motions have different sales cycles, trust barriers, and service expectations.


              The public evidence does show interest and early intent, but not yet a large verified installed base. That
              means the customer story is real, but still fragile: the company has proof of attention and some proof of
              commercialization, yet little proof of retention or scale.
            claimRefs:
