      - number: '4.2'
        title: Capital history and funding dependence
        blocks:
          - type: paragraph
            body: >-
              The confirmed capital base is meaningful for a robotics startup, but the company still looks dependent on
              the next financing cycle. The 2025 $1 billion raise report remains only reported, not closed, and that
              distinction matters because robotics capex can outrun enthusiasm quickly. If the larger raise does not
              happen on favorable terms, runway and dilution both become more important to the underwriting view.


              For that reason, the right financial lens is not just how much capital has been raised, but whether the
              company can support the next wave of manufacturing, deployment, and teleoperation without forcing a reset
              in valuation expectations.
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI007
              - CI008
              - CI009
      - number: '4.3'
        title: Capital intensity and unit-economics uncertainty
        blocks:
          - type: paragraph
            body: >-
              Robotics economics are hard because the bill of materials, assembly, deployment, service, and data
              collection all scale together. That means any positive ARR estimate must be interpreted against a much
              heavier cost base than a software company would face. The public set gives no way to verify gross margin,
              customer acquisition payback, or cash burn.


              The conservative conclusion is that the company could be capital efficient relative to peers, but it
              cannot yet be called economically proven. Until public evidence shows repeatable gross profit and
              deployment economics, the model should remain marked as high capital intensity with incomplete visibility.
              That is the core reason the underwriting stays conservative.
            claimRefs:
              - CI003
              - CI005
              - CI006
              - CI007
              - CI011
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer workflow and current product behavior
        blocks:
          - type: paragraph
            body: >-
              NEO is best understood as a home humanoid that can handle chores, conversation, and basic assistance, but
              not yet as a fully autonomous domestic worker. The public product pages and interviews show a system that
              is already doing useful things, while also relying on expert-guided sessions for the hard edge cases. That
              is a meaningful commercial start, but it is not the same as a hands-off consumer appliance.


              From a product perspective, that means the customer workflow is still partly mediated by remote operators,
              app scheduling, and explicit data access permissions. The core product question is therefore not whether
              the robot moves; it is how much of the desired work can be delivered without a human hidden behind the
              interface.
            claimRefs:
