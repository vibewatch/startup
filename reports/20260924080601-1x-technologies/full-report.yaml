              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.2'
        title: Bull, base, and bear cases
        blocks:
          - type: paragraph
            body: >-
              The bull case is that 1X becomes a genuine humanoid platform company: the data flywheel reduces
              teleoperation, enterprise deployments create a distribution moat, and home robots eventually follow. The
              base case is more measured: the company becomes a well-funded robotics builder that keeps improving but
              still needs capital and time. The bear case is that the product stays stuck in a teleoperated middle
              ground and economics never improve enough to justify a premium multiple.


              On balance, the public evidence makes the bull case plausible, the base case most likely, and the bear
              case non-trivial. That is enough for a watchlist position, not a leap-in buy.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
      - number: '8.3'
        title: Comparable set and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The comp set is still mostly private-company and narrative-driven, which is exactly why the valuation
              stance remains stretched. Figure and Agility help anchor industrial humanoid proof, while Tesla and the
              broader robotics set show how large the eventual prize could be. But none of those comparables solve 1X's
              immediate questions for us.


              The final diligence asks are straightforward: show the autonomy curve, show unit economics, and show the
              financing close status. Until those three move, the right decision is patience rather than enthusiasm.
              Patience is still the best default stance. Timing and discipline still matter most here. That is the only
              prudent move.
            claimRefs:
              - CV006
              - CV009
              - CV010
              - CV012
