  "sections": [
    {
      "id": "register",
      "title": "Severity-ranked risk register",
      "body": "The highest-risk issue is still the same one that makes 1X interesting: the consumer robot is compelling, but not yet fully autonomous. That creates privacy risk, trust risk, and margin risk simultaneously because the human-in-the-loop layer is both operationally expensive and socially sensitive.\n\nOperationally, the factory and field ramp matter just as much. Robotics can fail in the physical world in ways software companies do not, so yield, reliability, and safety are material. Add in competitive pressure, uncertain funding, and a major partner channel, and the risk stack remains clearly high rather than merely medium. The company should therefore treat operational controls as a strategic capability, not just an overhead line.",
      "claimRefs": [
        "CR001",
        "CR002",
        "CR003",
        "CR004",
        "CR005",
        "CR012"
      ],
      "tableRefs": [
        "TR001",
        "TR002",
        "TR003"
      ],
      "figureRefs": [
        "FR001"
      ]
    },
    {
      "id": "consumer-regulatory",
      "title": "Consumer, legal, and regulatory exposure",
      "body": "The consumer version of the business is the most sensitive to privacy and regulatory scrutiny because a home robot can see, hear, and potentially be remotely guided inside a private space. That makes transparency, consent, and data handling core business risks rather than just legal paperwork.\n\nThis is also where the company's public narrative is most exposed. If buyers perceive the robot as a teleoperated data collector rather than a household helper, the trust premium collapses quickly.",
      "claimRefs": [
        "CR001",
        "CR002",
        "CR006",
        "CR011"
      ]
    },
    {
      "id": "operations",
      "title": "Operational and dependency risks",
      "body": "The Hayward factory update is encouraging, but a factory announcement is not the same as stable production. Yield, service burden, and reliability are still live questions. On top of that, the EQT channel and OpenAI relationship introduce dependency and conflict risk that can complicate execution even when the product is improving.\n\nThe practical consequence is that investors need to watch not just shipment counts but also the failure rate, partner pace, and whether teleoperation costs shrink as the product scales. The business also needs enough internal process discipline to avoid turning every issue into a custom exception. Even small process gaps can compound quickly in a robotics business. That is the real operational moat.",
      "claimRefs": [
        "CR003",
        "CR006",
        "CR007",
        "CR008",
        "CR009",
        "CR010"
      ]
    }
  ],
