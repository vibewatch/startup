    "number": 3,
    "title": "Competitors",
    "summary": "Map direct humanoid peers, substitutes, and likely entrants, then assess whether 1X has a durable edge or just an early narrative lead."
  },
  "sections": [
    {
      "id": "landscape",
      "title": "Direct peers, incumbents, and substitutes",
      "body": "The competitive field is broader than humanoid-only headlines suggest. Tesla, Figure, and Agility form the best-known US humanoid set, but the real substitute layer also includes non-humanoid home robotics, low-cost Chinese entrants, and even status-quo labor. That matters because 1X is not only competing for the future of robotics; it is also competing against cheaper or simpler ways of getting work done.\n\nFrom an investor perspective, this means the company's moat is still emergent. The field is capital intensive, visible, and fast-moving, so any advantage has to come from a compound of hardware, data, distribution, and trust rather than from one feature alone. That makes sourcing, deployment, and learning speed more important than prototype theatrics alone.",
      "claimRefs": [
        "CP001",
        "CP002",
        "CP003",
        "CP008",
        "CP010",
        "CP012"
      ],
      "tableRefs": [
        "TP001",
        "TP002",
        "TP003"
      ],
      "figureRefs": [
        "FP001"
      ]
    },
    {
      "id": "comparison",
      "title": "Where 1X is differentiated today",
      "body": "1X's best public differentiation is not raw autonomy leadership; it is the combination of home-first product design, teleoperation data collection, and a distribution channel through EQT. That combination is unusual and potentially valuable because it lets the company gather real-world data while using a partner-led commercial path to create early deployment volume.\n\nStill, the comparison set is unfavorable in one important respect: several competitors look more mature in industrial deployment proof. The company therefore needs to turn technical novelty into visible reliability, repeatability, and pricing power before the market treats humanoids as interchangeable.",
      "claimRefs": [
        "CP004",
        "CP005",
        "CP006",
        "CP007",
        "CP009",
        "CP011"
      ]
    },
    {
      "id": "moat",
      "title": "Moat durability and adverse evidence",
      "body": "The moat question remains open. Public evidence supports a narrative about learning-from-use, but that is not the same as a durable moat. If rivals can match the form factor, undercut the price, or win the same early enterprise deployments, 1X will have to prove that its data flywheel is more than a marketing line.\n\nThat is why the most useful competitive lens is not who has the flashiest prototype. It is who can sustain iteration speed, win deployments, and absorb the operating burden of real-world robots without losing safety or margin discipline.",
      "claimRefs": [
        "CP003",
        "CP008",
        "CP010",
        "CP012"
      ]
    }
  ],
