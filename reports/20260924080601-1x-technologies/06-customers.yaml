    "title": "Customers",
    "summary": "Identify the early buyers, proof of adoption, and concentration risks, while distinguishing preorder interest from durable customer traction."
  },
  "sections": [
    {
      "id": "segmentation",
      "title": "Customer segmentation and early demand",
      "body": "The customer picture is segmented rather than broad. On the consumer side, 1X appears to be selling to very early adopters who are comfortable paying for a robot that is still evolving. On the enterprise side, the EQT channel points to portfolio companies, which is a different buyer motion entirely. That split matters because the two motions have different sales cycles, trust barriers, and service expectations.\n\nThe public evidence does show interest and early intent, but not yet a large verified installed base. That means the customer story is real, but still fragile: the company has proof of attention and some proof of commercialization, yet little proof of retention or scale.",
      "claimRefs": [
        "CU001",
        "CU002",
        "CU003",
        "CU006",
        "CU010"
      ],
      "tableRefs": [
        "TU001",
        "TU002"
      ],
      "figureRefs": [
        "FU001"
      ]
    },
    {
      "id": "proof",
      "title": "Named proof and adoption trajectory",
      "body": "The strongest proof point in the current material is not a mature customer base; it is a pipeline of interest, preorder activity, and early deployment experimentation. The company's internal home testing and employee usage show that it is using itself as a test environment, while the EQT program shows that the enterprise story is still being shaped through partner distribution.\n\nThat is a reasonable phase for a robotics company, but it should be read carefully. A preorder is a sign of demand, not revenue retention. A partner rollout is a sign of channel possibility, not proven enterprise penetration. That is enough to show interest, but not yet enough to prove durable conversion.",
      "claimRefs": [
        "CU004",
        "CU005",
        "CU008",
        "CU011",
        "CU012"
      ],
      "tableRefs": [
        "TU003"
      ]
    },
    {
      "id": "concentration",
      "title": "Concentration and durability risk",
      "body": "Concentration risk is the main customer-side caution. If a small number of strategic partners or early adopters generate most of the visible traction, the company becomes more sensitive to rollout delays and procurement friction. The missing metrics make that risk hard to quantify, which is itself a red flag for diligence.\n\nThe right conclusion is not that customer demand is weak; it is that the evidence is still too thin to show durable expansion. Until 1X publishes stronger retention, repeat deployment, or location-level adoption evidence, the customer story remains earlier than the company narrative suggests.",
      "claimRefs": [
        "CU007",
        "CU009",
        "CU010",
        "CU012"
      ]
    }
  ],
