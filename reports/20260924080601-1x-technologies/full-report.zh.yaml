      - number: '1.4'
        title: 运营里程碑与更新要点
        blocks:
          - type: paragraph
            body: >-
              2025-2026 更新周期主要由三大可见里程碑主导：NEO Gamma、家庭机器人开启预订以及与 EQT
              投资组合公司的合作。三者共同勾勒出一幅清晰图景：公司正试图将远程操控能力转化为可复制的部署，先在家庭中试水，进而在受控的企业环境中铺开。工厂最新动态释放出第四个信号，表明 1X
              正试图在推进产品研发的同时扩大制造规模。


              然而，这些里程碑并未解决根本疑虑。公司仍未公布具备持续性的自主能力基准、经过验证的收入运行率，或是明确的估值锚点，因此本次更新更应理解为商业化进展，而非一份已然成型的投资承销依据。
            claimRefs:
