      - number: '3.2'
        title: 1X 现阶段的差异化优势
        blocks:
          - type: paragraph
            body: >-
              在公开材料中，1X 最具说服力的差异化并非单纯的自主性领先，而是家庭优先的产品形态、远程操控数据采集机制以及借助 EQT
              构建的分销渠道三者结合。这种组合十分罕见且潜力巨大，使公司得以一边采集真实世界数据，一边借助合作伙伴驱动的商业化路径创造早期部署体量。


              然而，横向对比在一个核心维度上处于劣势：数家竞对在工业部署落地的实证上明显更加成熟。因此，在市场将人形机器人视为标准化大宗硬件之前，公司必须迅速将技术新颖性转化为肉眼可见的可靠性、可复现性以及定价权。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP009
              - CP011
      - number: '3.3'
        title: 护城河持久度与反向证据
        blocks:
          - type: paragraph
            body: >-
              护城河能否持久依然存疑。公开证据固然支撑“在使用中不断学习”的叙事，但这不等同于坚固的护城河。一旦对手复刻同等产品形态、压低售价，或抢占相同的早期企业部署订单，1X
              就必须拿出过硬证据，证明其数据飞轮不仅是一句营销口号。


              正因如此，最有价值的竞争视角并非去比谁的原型机更抢眼，而是观察谁能维持迭代速度、持续赢下实地部署，并在背负实体机器人沉重运营负担的同时，依然守住安全底线与毛利纪律。
            claimRefs:
              - CP003
              - CP008
              - CP010
              - CP012
