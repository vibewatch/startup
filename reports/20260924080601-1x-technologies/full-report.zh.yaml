      - number: '6.2'
        title: 实名客户证据与采纳轨迹
        blocks:
          - type: paragraph
            body: >-
              当前资料中最强有力的证据并非成熟的客户群，而是由意向线索、预订热度以及早期部署试验构成的漏斗管线。公司内部开展的家庭测试与员工内测表明，团队正把自身作为验证试验场；而 EQT
              合作计划则展示出企业端商业化正试图通过合作伙伴渠道推进。


              这对机器人公司而言是合情合理的必经阶段，但在解读时必须保持理性。预订量是需求的风向标，而非已确认的留存收入；渠道伙伴铺开代表着分销潜力，而非未经验证的企业渗透深度。这些足以展现市场兴趣，但尚未足以证实具备持续性的商业变现转化。
            claimRefs:
              - CU004
              - CU005
              - CU008
              - CU011
              - CU012
