    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 核心风险
      - 概率信号
    rows:
      - - 乐观
        - 自主能力大幅跃升，企业与家庭场景规模化落地
        - 享有高溢价的人形机器人平台
        - 执行节奏与监管壁垒
        - 较低至中等
      - - 基准
        - 产品稳步迭代，商业化变现节奏相对平缓
        - 长周期的硬科技风险投资构建
        - 重资产重资本属性
        - 中等
      - - 悲观
        - 长期受困于远程操控，资本市场流动性收紧
        - 流血融资（down-round）或估值倍数承压
        - 毛利率遭受严重挤压
        - 实质存在
    notes: 各情景侧重于战略推演而非精密数学测算；真实映射了当前的证据质量现状。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV008
      - CV009
