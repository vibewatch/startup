      - number: '1.2'
        title: 创始团队、管理层与治理信号
        blocks:
          - type: paragraph
            body: >-
              创始人和 CEO 的履历依然是 1X 市场定位的核心。Bernt Øivind Børnich 贯穿公开记录，这为品牌重塑与产品转型提供了连续性，构成优势，但同时也带来了关键人物依赖。在
              AI、工程和人力运营领域引入的高管表明，公司正在努力从创始人个人品牌走向专业化运作。


              公司治理依旧不透明。已审阅的公开来源中未见公开董事会名单、股权结构表或章程文件，投资人必须假定董事会权利与控制权条款仍在私下协商。在尽调视角下，这与其说是一个待解问题，不如说是一个应当计入风险定价的既定事实。
