              - CU011
      - number: '6.3'
        title: 集中度与业务持久性风险
        blocks:
          - type: paragraph
            body: |-
              集中度风险是客户维度的首要警惕项。假若绝大部分可感知的落地势头仅依赖少数战略伙伴或尝鲜极客支撑，公司就极易受到交付延误与采购阻力的冲击。核心指标的缺失使得这种风险难以精准量化，而这本身就是尽调中的明确警示信号。

              客观结论并非指客户需求疲软，而是现有证据过于单薄，尚无法展现业务能否实现可持续扩张。在 1X 公布更有说服力的客户留存率、重复部署数据或网点级渗透指标之前，真实的客户进展比公司对外叙事表现得更为早期。
            claimRefs:
              - CU007
              - CU009
              - CU010
              - CU012
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重度排序的风险台账
        blocks:
          - type: paragraph
            body: >-
              等级最高的风险恰恰源于赋予 1X
              想象力的核心所在：消费级机器人愿景固然诱人，但当下尚未达到完全自主。这同时引发了隐私隐患、信任危机与毛利受损三重风险，因为“人在回路”（human-in-the-loop）的远程介入层既消耗沉重运营成本，又在公众认知上极度敏感。


              运营层面，工厂量产爬坡与现场实地运转同样致命。实体硬件在现实世界中的故障破坏力远非软件代码可比，产品良率、可靠性与安全冗余具有决定性意义。叠加竞争对手步步紧逼、后续资金尚未落袋以及渠道高度依赖外部伙伴，整体风险画像明确偏向高风险，而非仅仅中等风险。因此，公司必须将精细化运营控制视为战略核心能力，而非单纯的后台杂项开支。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
