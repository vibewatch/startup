  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品集合
        blocks:
          - type: paragraph
            body: >-
              不应将 1X
              简单视为单一品类的消费级机器人赌注。多份信源材料反复将其置于两个相邻市场：一类是能够承担物流、安防及设施维护的企业级人形机器人；另一类则是最终在家庭中分担家务的消费级人形机器人。这一边界划分至关重要，因为两者的替代品集合截然不同。在家庭场景中，替代品依然是人工劳动力或单一功能家电；而在企业场景中，替代品通常是全职员工、外包外包工或传统固定自动化设备。


              实际层面的含义在于，1X 完全有可能先在一个市场拿下胜局，之后再开拓另一个市场。企业渠道在经济模型上往往更容易得到验证，而消费级产品则面临更高的信任度与隐私门槛。
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM006
              - CM007
