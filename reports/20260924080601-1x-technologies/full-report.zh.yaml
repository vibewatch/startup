      - number: '4.2'
        title: 融资历程与对后续资本的依赖
        blocks:
          - type: paragraph
            body: >-
              已确认的资本底盘对机器人初创企业而言相当可观，但公司看起来仍高度依赖下一轮融资窗口。关于 2025 年 $1B
              融资的报道仍停留在媒体传闻中，尚未正式交割完成；这一区分至关重要，因为机器人领域的重资产资本支出往往比资本市场的热情跑得更快。假若这笔大额融资无法按理想估值与条款落地，现金跑道与股权稀释都将成为投资判断中的关键考量。


              因此，恰当的财务审视视角不仅在于算清账面融了多少钱，更在于判断公司能否在无需被迫下调估值预期的情况下，持续支撑下一轮制造爬坡、现场部署与远程操控开支。
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI007
              - CI008
              - CI009
      - number: '4.3'
        title: 重资产属性与单机经济模型不确定性
        blocks:
          - type: paragraph
            body: >-
              机器人经济模型之所以艰难，在于物料清单（BOM）、组装、现场部署、售后维保与数据采集环节均伴随规模线性放大。因此任何乐观的 ARR
              估算，都必须放在远比纯软件企业沉重的成本底座之上去推敲。现阶段公开材料无法核实真实的毛利率、获客成本回本周期或现金烧钱速度。


              审慎推导的结论在于，公司相对于部分竞对或许具备资本效率，但在经济模型上绝称不上已被跑通。在公开证据展示出可复现的毛利润与部署经济性之前，应当继续将该商业模式定性为可见度有限的重资产结构。这也是整体承销态度保持克制的核心症结所在。
            claimRefs:
              - CI003
              - CI005
