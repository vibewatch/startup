      - number: '1.3'
        title: 融资历程与近期资本动态
        blocks:
          - type: paragraph
            body: >-
              融资线索足以展现推进势头，但尚不足以消除不确定性。公司官方声明确认了 2023 年 Series A2 与 2024 年 Series B 轮，而 The Information 与 Humanoids
              Daily 则指出 2025 年存在尚未公开交割的融资谈判。这使得最新的资金格局呈现出一半已确认、一半据报道、还有一部分悬而未决的状态。


              实际结论在于，作为机器人公司，1X 资金储备堪称雄厚，但下一轮融资进展依然是核心尽调关注点。如果传闻中的大额融资出现延期或重定价，将直接影响现金跑道与估值纪律。
