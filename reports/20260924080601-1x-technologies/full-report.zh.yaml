              - CE010
              - CE011
              - CE012
      - number: '5.2'
        title: 软硬件系统与学习闭环
        blocks:
          - type: paragraph
            body: >-
              1X 将其技术栈呈现为一个闭环系统：硬件端负责采集数据，世界模型仿真模拟潜在场景，真实部署则反哺打磨决策策略。这种架构之所以重要，在于公司试图让每一台交付的机器人都同时充当产品载体与训练资产。布局在
              Hayward 与挪威的制造基地并非单纯的成本中心，而是构成整个系统闭环的有机一环。


              面临的挑战在于，这套闭环依然依赖远程操控填补从“技术演示”到“全自主运行”之间的断层。这虽未动摇架构本身的合理性，但意味着公司必须在真实的家庭环境中拿出实打实的硬证据，证明系统能从被引导走向自主决策。
            claimRefs:
              - CE002
              - CE003
              - CE005
              - CE008
              - CE009
              - CE011
      - number: '5.3'
        title: 信任、安全性与路线图拉扯
        blocks:
          - type: paragraph
            body: >-
              公开宣传材料极力强调安全性与物理外观设计，这完全符合逻辑，因为进驻家庭场景的人形机器人必须先赢得信任，才有资格谈商业变现。柔软外层覆料、肌腱驱动系统以及机载感知传感器并非锦上添花的外观修饰，而是让家庭部署成为可能的硬性前提。


              与此同时，最核心的产品风险在于宣传承诺与实际交付的自主水平之间存在落差。假若专家远程引导长期成为常态而非过渡桥梁，产品固然仍有实用价值，但整套商业逻辑将发生实质性转变。这是商业化路径上最关键的枢纽。
            claimRefs:
              - CE006
              - CE007
              - CE010
              - CE012
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户画像与早期需求
        blocks:
          - type: paragraph
            body: >-
              客户画像带有明显的割裂属性。消费端方面，1X 目前似乎主要触达极早期的极客尝鲜群体，这部分人愿意为一台尚处于演进阶段的机器人自掏腰包。企业端方面，EQT
              渠道直指被投企业，构成了截然不同的采购决策逻辑。这种双轨制至关重要，因为两套销售动量在交易周期、信任门槛以及售后运维预期上完全不同。


              公开证据确实展现出外界兴趣与早期意向，但尚未披露规模化且经过核实的实际安装基数。因此客户故事虽然真实存在，但根基依然薄弱：公司拿得出手的是关注度与初步商业化线索，但在客户留存与规模化复购上几乎毫无佐证。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU006
              - CU010
