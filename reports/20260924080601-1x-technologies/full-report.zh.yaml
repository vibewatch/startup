      - - buy
        - low
        - medium
        - fair
        - 当前公开证据不足以支撑该操作
      - - avoid
        - low
        - critical
        - expensive
        - 仅当自主能力停滞不前或后续融资断裂时成立
    notes: 决策框架特意保持审慎克制，因为公司的产品落地证据明显超前于其财务维度的佐证。
