              - CV012
      - number: '8.2'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观情景下，1X
              成长为名副其实的人形机器人平台型公司：数据飞轮大幅缩减对远程操控的依赖，企业端落地构筑起坚实的分销壁垒，家庭场景随后顺理成章承接放量。基准情景更为理性克制：公司成为一家弹药充沛的硬科技建造者，产品持续迭代，但仍需消耗漫长时间与大量资金。悲观情景则是技术长期卡在依赖远程操控的半吊子状态，经济模型始终无法跑通以支撑高估值溢价。


              综合权衡现有公开证据，乐观情景具备合理性，基准情景大概率居中，而悲观情景绝非危言耸听。现阶段更适合纳入重点观察清单，而非盲目下注买入。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
      - number: '8.3'
        title: 可比标的与核心尽调诉求
        blocks:
          - type: paragraph
            body: >-
              可比公司阵营目前仍以未上市独角兽和叙事驱动为主，这正是其估值评级依然偏高（stretched）的症结所在。Figure 与 Agility 确立了工业人形机器人的落地参照，Tesla
              以及广义机器人梯队则揭示出终局天花板的诱人空间。然而，这些可比公司无法代替 1X 回答我们眼前的核心疑问。


              最终的尽调诉求清晰而具体：展示自主化能力的提升曲线、公开单机经济模型，并明确最新一轮大额融资的最终交割进展。在这三项出现实质转机之前，保持耐心是优于盲目热情的唯一合理姿态。耐心依然是最优默认立场，把握节奏与严守纪律在此刻最为关键。
            claimRefs:
              - CV006
              - CV009
              - CV010
              - CV012
