  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 客户工作流与当前产品表现
        blocks:
          - type: paragraph
            body: >-
              NEO
              的本质定位是一款能够处理家务、对话交流及基础看护的家庭人形机器人，但尚未成为全自主运行的家庭劳动力。公开产品页面与访谈展示的系统确实已能完成不少实用动作，但在棘手的长尾边缘场景中，仍然高度依赖远程专家引导。这是一个具备实质意义的商业化起点，但与彻底免于人工干预的“甩手即用”消费级家电仍有本质差距。


              从产品视角来看，客户工作流目前仍部分依赖远程操控员、应用预约排程以及显式的隐私数据授权。核心产品考核指标因此并非机器人能否动起来，而是在没有幕后人工介入的前提下，系统到底能够稳定交付多少目标任务。
            claimRefs:
              - CE001
