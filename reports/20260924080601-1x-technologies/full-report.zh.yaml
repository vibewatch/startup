chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、业务版图与产品布局
        blocks:
          - type: paragraph
            body: >-
              1X Technologies 将自己定位为兼顾家庭与企业机器人的垂直整合制造商。最新公开材料显示，公司总部位于 Palo Alto，同时在 Hayward 和 Moss
              保持制造业务；这极为关键，因为“构建-训练”闭环仰赖物理实物迭代，而非单纯依靠软件发布。业务版图目前涵盖消费级家庭机器人 NEO，以及依托 EQT 推进的企业部署路径，因此应当将公司视为硬件与数据平台，而非单
              SKU 初创团队。


              这种业务组合使得运营模式带上不同寻常的重资产属性。可见的产品线已从 EVE 演进至 NEO Gamma 以及 2025
              年开启的预订，但公开证据仍未披露明确的收入、估值与确切员工人数。最终呈现出的是一家具备真实商业信号、但财务透明度尚不完整的公司。
