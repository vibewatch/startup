      - number: '2.2'
        title: 买方与付费方细分
        blocks:
          - type: paragraph
            body: >-
              客户采购结构具有异构特征。家庭用户可能直接为 NEO 付费，但首批具备规模的企业买家更可能通过 EQT
              等合作伙伴引入，或是来自受限环境中急需替代劳动力的运营方。这使得公司的市场切入路径更像分阶段渐进铺开，而非自上而下的单一平台式直销。


              这也解释了为何技术采纳触发条件并不均衡。消费级需求取决于信任度、安全感以及对远程操控介入的接受意愿；企业级需求则取决于细分场景的投资回报率、任务可靠性以及嵌入现有工作流的顺畅程度。
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM009
              - CM011
      - number: '2.3'
        title: 规模测算证据与市场缺口
        blocks:
          - type: paragraph
            body: >-
              证据库中未见清晰且公开的总可用市场（TAM）。公司自身对外讲述宏大的“劳动力充裕”叙事，但外部信源仍以定性判断为主：讨论焦点集中在劳动力短缺、具身智能增长及人形机器人商业化，而非经过审计的具体市场规模数字。这使得规模测算更多考验情景推演的严谨度，而非数字精度本身。


              审慎的投资人应当将各类市场规模主张视为临时性假设。真正关键的尽调问题并非人形机器人抽象意义上的市场有多大，而是 1X 能否从早期企业端捕获足够价值，用以支撑家庭机器人所需的自主能力提升与制造学习曲线。
            claimRefs:
              - CM004
              - CM008
              - CM010
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接竞对、行业既有者与替代品
        blocks:
          - type: paragraph
            body: >-
              竞争版图远比人形机器人头条新闻呈现得更广阔。Tesla、Figure 和 Agility
              构成了美国知名度最高的人形机器人阵营，但真正的替代品层还包括非人形家庭机器人、中国低成本入局者，甚至是维持现状的普通人工劳动力。这极其关键，因为 1X
              争夺的不仅是机器人行业的未来，更是在同更便宜、更简便的任务完成手段正面交锋。


              从投资人视角审视，公司的护城河仍在成形阶段。该赛道具有资本密集、聚光灯聚焦且迭代迅猛的特征，任何真正的优势都必须源自硬件、数据、渠道与信任构成的复合壁垒，而非单凭某一项技术特性。因此，供应链能力、实地部署经验与学习进化速度，远比停留在演示上的原型噱头更为重要。
            claimRefs:
              - CP001
