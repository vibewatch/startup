    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与定价机制
        blocks:
          - type: paragraph
            body: >-
              公开证据指向多元化的收入模式：硬件销售、NEO 订阅选项，以及未来有望沉淀服务或软件价值的企业级部署。缺失的关键在于经过审计的明细拆分。因此当前应当将公司视为商业化探索中的进行时，而非已被证实的经常性收入业务。


              公布的价格标签颇为引人注目。NEO 标价 $20,000 的一次性买断价与每月 $499 的订阅方案切入高端消费人群，而 EQT
              渠道则暗示企业端部署有望依托渠道网络起量。但这两条业务线目前都未提供清晰公开的毛利结构。
