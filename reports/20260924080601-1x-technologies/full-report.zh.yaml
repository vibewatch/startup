  - id: TV002
    title: 投资逻辑与反向逻辑表
    columns:
      - 核心论点
      - 何种证据会扭转观点
    rows:
      - - 1X 有望成长为平台型公司
        - 需证实自主能力与毛利率能够同步产生复利效应
      - - EQT 渠道能够加速产品采纳
        - 需证明试点推广能实质转化为可持续的复购部署
      - - 远程操控仅为过渡桥梁
        - 需看到“人在回路”的综合成本出现实质性下降
      - - 公司估值当前被低估
        - 需拿出能够支撑该判断的估值与收入硬指标
    notes: 鉴于公开材料在财务与单机经济模型上仍存在缺口，投资逻辑与反向逻辑框架特意保持简明精炼。
