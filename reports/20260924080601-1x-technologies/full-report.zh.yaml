      - number: '7.2'
        title: 消费端、法律与监管合规风险
        blocks:
          - type: paragraph
            body: >-
              业务中的消费级板块对隐私与监管审查最为敏感，因为家庭机器人能够看、能听，且在私人住宅空间内随时可能受到远程操控引导。这使得透明度、用户知情同意以及数据合规治理上升为关乎商业存亡的核心风险，而非简单的法务合规文件工作。


              这也是公司对外公众形象最易受挫的薄弱点。一旦买家认定该机器人本质是一台由远程操控员驱动的数据采集装置，而非纯粹的家庭助手，前期建立的信任溢价将迅速瓦解。
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR011
      - number: '7.3'
        title: 运营执行与外部依赖风险
        blocks:
          - type: paragraph
            body: >-
              Hayward 工厂扩产动态固然鼓舞人心，但发布建厂消息绝不等于稳定量产。生产良率、售后保修重负以及设备可靠性依然是悬而未决的现实问题。此外，EQT 分销渠道与过往 OpenAI
              的合作纽带引入了外部依赖与潜在利益冲突，即便利好产品技术升级，也会加剧执行复杂性。\n\n给投资人带来的实际启示在于，不仅要紧盯发货数量，还必须密切追踪出险故障率、渠道推进节奏，以及远程操控单机成本能否随规模扩大而显著摊薄。整个业务同样需要扎实的内部流程纪律，避免将每个偶发故障都当成定制化例外来处理。在重资产机器人业务中，微小的流程疏漏往往会迅速滚雪球放大，这才是真正的运营护城河所在。
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与评级建议
        blocks:
          - type: paragraph
            body: >-
              更新后的尽调证据依旧支撑克制审慎的态度。1X
              确实是一家扎实推进的公司，技术野心令人瞩目，资本实力雄厚，且商业化意向明确，但现有实证支撑尚不足以认定当前估值具备吸引力。最恰当的评级应当是“观察”（track）：故事足够性感值得紧密跟进，但在基本面上缺乏清晰度，尚不足以支撑激进建仓。


              给出这一评级建议并非出于对团队能力的怀疑，而是出于对投资时机的考量。公司技术推进节奏虽快，但公开信息在几个核心关卡上依然留白：自主能力进阶曲线、单机经济模型，以及将早期意向转化为持续复购收入的可行性。
            claimRefs:
              - CV001
              - CV002
              - CV010
              - CV011
              - CV012
