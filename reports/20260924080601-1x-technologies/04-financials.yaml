    "number": 4,
    "title": "Financials",
    "summary": "Explain revenue logic, pricing, capital needs, and why the public evidence is still insufficient for full underwriting."
  },
  "sections": [
    {
      "id": "revenue",
      "title": "Revenue streams and pricing",
      "body": "The public evidence supports a mixed revenue model: hardware sales, a subscription option for NEO, and enterprise deployments that could carry service or software value over time. What is missing is an audited breakdown. That means the company should be viewed as a monetization story in progress rather than a proven recurring-revenue business.\n\nThe price points are eye-catching. NEO's $20,000 purchase price and $499 monthly option create a premium consumer bracket, while the EQT channel suggests enterprise volume could emerge through partner distribution. Neither line of business yet produces a clean public margin stack.",
      "claimRefs": [
        "CI002",
        "CI005",
        "CI006",
        "CI010",
        "CI012"
      ],
      "tableRefs": [
        "TI001",
        "TI002",
        "TI003"
      ],
      "figureRefs": [
        "FI001"
      ]
    },
    {
      "id": "capital",
      "title": "Capital history and funding dependence",
      "body": "The confirmed capital base is meaningful for a robotics startup, but the company still looks dependent on the next financing cycle. The 2025 $1 billion raise report remains only reported, not closed, and that distinction matters because robotics capex can outrun enthusiasm quickly. If the larger raise does not happen on favorable terms, runway and dilution both become more important to the underwriting view.\n\nFor that reason, the right financial lens is not just how much capital has been raised, but whether the company can support the next wave of manufacturing, deployment, and teleoperation without forcing a reset in valuation expectations.",
      "claimRefs": [
        "CI001",
        "CI002",
        "CI004",
        "CI007",
        "CI008",
        "CI009"
      ]
    },
    {
      "id": "economics",
      "title": "Capital intensity and unit-economics uncertainty",
      "body": "Robotics economics are hard because the bill of materials, assembly, deployment, service, and data collection all scale together. That means any positive ARR estimate must be interpreted against a much heavier cost base than a software company would face. The public set gives no way to verify gross margin, customer acquisition payback, or cash burn.\n\nThe conservative conclusion is that the company could be capital efficient relative to peers, but it cannot yet be called economically proven. Until public evidence shows repeatable gross profit and deployment economics, the model should remain marked as high capital intensity with incomplete visibility. That is the core reason the underwriting stays conservative.",
      "claimRefs": [
        "CI003",
        "CI005",
        "CI006",
        "CI007",
        "CI011",
        "CI012"
      ]
    }
  ],
