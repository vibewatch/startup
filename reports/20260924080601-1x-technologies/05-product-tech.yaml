    "number": 5,
    "title": "Product & Technology",
    "summary": "Explain what 1X delivers, how the stack works, and why the hardest technical problem is still the autonomy bridge inside real homes."
  },
  "sections": [
    {
      "id": "workflow",
      "title": "Customer workflow and current product behavior",
      "body": "NEO is best understood as a home humanoid that can handle chores, conversation, and basic assistance, but not yet as a fully autonomous domestic worker. The public product pages and interviews show a system that is already doing useful things, while also relying on expert-guided sessions for the hard edge cases. That is a meaningful commercial start, but it is not the same as a hands-off consumer appliance.\n\nFrom a product perspective, that means the customer workflow is still partly mediated by remote operators, app scheduling, and explicit data access permissions. The core product question is therefore not whether the robot moves; it is how much of the desired work can be delivered without a human hidden behind the interface.",
      "claimRefs": [
        "CE001",
        "CE004",
        "CE007",
        "CE012"
      ],
      "tableRefs": [
        "TE001",
        "TE002",
        "TE003"
      ],
      "figureRefs": [
        "FE001"
      ]
    },
    {
      "id": "architecture",
      "title": "Hardware, software, and learning loop",
      "body": "1X presents the product stack as a closed loop: hardware collects data, the world model simulates possible futures, and deployment refines the policy. That architecture is important because it means the company is trying to make every robot serve as both product and training asset. The manufacturing footprint in Hayward and Norway is part of the system, not just a cost center.\n\nThe challenge is that the loop still depends on teleoperation to fill the gap between demonstration and autonomy. That does not invalidate the architecture, but it does mean the company has to prove the transition from guided behavior to self-directed behavior in a real home.",
      "claimRefs": [
        "CE002",
        "CE003",
        "CE005",
        "CE008",
        "CE009",
        "CE011"
      ]
    },
    {
      "id": "trust",
      "title": "Trust, safety, and roadmap tension",
      "body": "The public materials lean hard into safety and physical design, which makes sense because a humanoid inside a home has to earn trust before it can earn revenue. Soft covers, tendon drive, and on-board sensing are not cosmetic details; they are the conditions that make domestic deployment plausible.\n\nAt the same time, the most important product risk is the gap between the marketed promise and the actually delivered autonomy level. If expert-guided sessions remain the norm instead of the bridge, the product can still be useful, but the commercial thesis changes materially. That is the central commercialization hinge.",
      "claimRefs": [
        "CE006",
        "CE007",
        "CE010",
        "CE012"
      ]
    }
  ],
