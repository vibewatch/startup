    "number": 1,
    "title": "Company Overview",
    "summary": "Establish the company identity, leadership continuity, funding history, and the refreshed milestone set that frames every later chapter."
  },
  "sections": [
    {
      "id": "identity",
      "title": "Identity, footprint, and product posture",
      "body": "1X Technologies is a humanoid robotics company that presents itself as a vertically integrated builder of both home and enterprise robots. The latest public materials place the company in Palo Alto while keeping manufacturing in Hayward and Moss, which matters because the build-and-train loop depends on physical iteration, not just software releases. The business now spans a consumer home robot, NEO, and an enterprise deployment path anchored by EQT, so the company should be read as a hardware-and-data platform rather than a single SKU startup.\n\nThat mix makes the operating model unusually capital intensive. The visible product line has moved from EVE toward NEO Gamma and the 2025 preorder launch, while the public evidence still leaves revenue, valuation, and exact headcount unresolved. The result is a company with real commercial signals but incomplete financial transparency.",
      "claimRefs": [
        "CO001",
        "CO002",
        "CO005",
        "CO006",
        "CO007",
        "CO012"
      ],
      "tableRefs": [
        "TO001"
      ],
      "figureRefs": [
        "FO001"
      ]
    },
    {
      "id": "leadership",
      "title": "Founding, leadership, and governance signals",
      "body": "The founder and CEO story is still central to 1X's positioning. Bernt Øivind Børnich appears throughout the public record, which is a strength because it provides continuity through rebrands and product pivots, but it also creates key-person dependence. Leadership additions around AI, engineering, and people operations indicate that the company is trying to professionalize beyond the founder brand.\n\nGovernance remains opaque. No public board roster, equity table, or charter materials surfaced in the reviewed sources, so investors must assume that board rights and control terms are still being negotiated privately. For diligence, that is less a problem to solve than a fact to price into the risk posture.",
      "claimRefs": [
        "CO001",
        "CO002",
        "CO009",
        "CO004"
      ],
      "tableRefs": [
        "TO002"
      ]
    },
    {
      "id": "capital",
      "title": "Capital history and recent financing signals",
      "body": "The funding trail is strong enough to show momentum but not strong enough to eliminate uncertainty. Confirmed company statements cover the 2023 Series A2 and 2024 Series B, while The Information and Humanoids Daily point to 2025 fundraising discussions that have not been closed publicly. That leaves the latest capital picture as part confirmed, part reported, and part still unresolved.\n\nThe practical takeaway is that 1X looks well backed for a robotics company, but the next financing step remains a live diligence item. If the rumored larger raise slips or re-prices, that would affect both runway and valuation discipline.",
      "claimRefs": [
        "CO003",
        "CO010",
        "CO011",
        "CO012"
      ],
      "tableRefs": [
        "TO003"
      ]
    },
    {
      "id": "milestones",
      "title": "Operating milestones and refresh deltas",
      "body": "The 2025-2026 refresh cycle is dominated by three visible milestones: NEO Gamma, the home-robot preorder launch, and the EQT portfolio-company partnership. Together they show a company trying to turn teleoperated capability into repeatable deployment, first in homes and then in controlled enterprise settings. The factory update adds a fourth signal by indicating that 1X is trying to scale manufacturing alongside product development.\n\nNone of those milestones remove the hard questions. The company still has not published a durable autonomy benchmark, a verified revenue run rate, or a clean valuation anchor, so the refresh should be read as commercial progress rather than a completed underwriting story.",
      "claimRefs": [
        "CO006",
        "CO007",
        "CO008",
        "CO009",
        "CO011",
        "CO012"
      ]
    }
  ],
