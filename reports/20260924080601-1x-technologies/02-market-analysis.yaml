    "title": "Market Analysis",
    "summary": "Define the market boundary, buyer stack, and adoption constraints for humanoid labor substitution without overclaiming a precise TAM."
  },
  "sections": [
    {
      "id": "market-boundary",
      "title": "Market boundary and substitute set",
      "body": "1X should not be modeled as a single-category consumer robotics bet. The sourced material repeatedly places it across two adjacent markets: enterprise humanoids that can handle logistics, security, and facility work, and consumer humanoids that can eventually handle chores at home. That boundary matters because the substitute set is different in each case. In homes, the substitute is still human labor or a narrow appliance; in enterprise settings it is often a worker, contractor, or conventional automation stack.\n\nThe practical implication is that 1X can win in one market before it wins in the other. Enterprise channels appear easier to validate economically, while the consumer product carries higher trust and privacy hurdles.",
      "claimRefs": [
        "CM001",
        "CM003",
        "CM005",
        "CM006",
        "CM007",
        "CM011"
      ],
      "tableRefs": [
        "TM001",
        "TM002",
        "TM003"
      ],
      "figureRefs": [
        "FM001"
      ]
    },
    {
      "id": "buyers",
      "title": "Buyer and payer segmentation",
      "body": "The buyer stack is heterogeneous. Households may pay directly for NEO, but the first scaled enterprise buyers are more likely to come through partners like EQT or through operators that need labor substitution in constrained environments. This makes the company's go-to-market path look more like a staged rollout than a single top-down platform sale.\n\nThat is also why adoption triggers are uneven. Consumer demand depends on trust, safety, and the willingness to host teleoperation, while enterprise demand depends on narrow ROI, task reliability, and a clear path to integration with existing workflows.",
      "claimRefs": [
        "CM002",
        "CM006",
        "CM007",
        "CM009",
        "CM011"
      ]
    },
    {
      "id": "sizing",
      "title": "Sizing evidence and market gaps",
      "body": "There is no clean public TAM in the evidence set. The company itself markets a broad labor-abundance narrative, but the external sources are still mostly directional: they discuss labor shortages, physical-AI growth, and humanoid commercialization rather than a single audited market number. That makes the sizing exercise more about scenario discipline than precision.\n\nA conservative investor should therefore treat all market-size claims as provisional. The right diligence question is not whether humanoids are a large market in the abstract; it is whether 1X can capture enough early enterprise value to fund the autonomy and manufacturing curve required for the home market.",
      "claimRefs": [
        "CM004",
        "CM008",
        "CM010",
        "CM012"
      ]
    }
  ],
