companyProfile:
  summary: >-
    1KOMMA5° is a Hamburg-founded private CleanTech company that sells whole-home electrification
    systems for residential customers, combining local consultation, installation, and service with
    a software layer called Heartbeat AI. The product set spans photovoltaics, home batteries, heat
    pumps, EV charging hardware, and dynamic electricity optimization. Its strategic ambition is to
    shift from a hardware-heavy installer network toward a broader software-led energy platform in
    which Heartbeat optimizes demand, arbitrages spot-market volatility, and aggregates distributed
    residential flexibility into a virtual power plant. Public sources support roughly €520 million
    of 2024 revenue, more than 120,000 customers, about 2,500 employees, and approximately €400
    million of cumulative equity, but the business remains privately held and key software-economics
    metrics are still undisclosed.
