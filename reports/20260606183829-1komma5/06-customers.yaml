  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-disclosure-gap
    missingEvidence: Actual NRR, GRR, churn, renewal, and contract-duration data by cohort and geography.
    whyItMatters: The recurring-software thesis cannot be underwritten from customer counts and review proxies alone.
    diligencePath: Request cohort tables for hardware-only, Heartbeat-enabled, and property-owner customers with 3-, 6-, and 12-month retention.
    relatedQuestionRefs:
    - QU009
    - QU025
  - type: missing-source
    severity: material
    topic: concentration-gap
    missingEvidence: Top-customer, top-channel, and geography concentration tables for revenue and gross profit.
    whyItMatters: A large hidden dependence on a few institutional orders, markets, or channels could distort the perceived breadth of the base.
    diligencePath: Request top-10 customer list, channel mix, and market mix for the last twelve months.
    relatedQuestionRefs:
    - QU019
    - QU020
    - QU025
  - type: enumeration-incomplete
    severity: material
    topic: proof-surface-gap
    missingEvidence: Named non-homeowner customer references with deployment scope, go-live dates, and outcome metrics.
    whyItMatters: Public order references to Lower Saxony, a Danish railway company, and property owners do not yet prove durable deployment or expansion economics.
    diligencePath: Request at least three reference calls or written case studies from a property owner, a public-sector buyer, and a portfolio deployment.
    relatedQuestionRefs:
    - QU011
    - QU013
    - QU025
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: heartbeat-attach-rate
    missingEvidence: Active paying Heartbeat households, attach rate versus installed hardware, and ARPU by market.
    whyItMatters: The software layer is central to the customer thesis, but public data only shows connected-system milestones, not monetized recurring usage.
    diligencePath: Request monthly active Heartbeat households, paying subscribers, and tariff-linked households by country.
    relatedQuestionRefs:
    - QU005
    - QU024
  - type: private-evidence-only
    severity: minor
    topic: geography-mix-gap
    missingEvidence: Revenue and customer mix by country, homeowner versus non-homeowner segment, and direct versus partner channel.
    whyItMatters: Without geography and channel mix, it is hard to assess whether the review evidence generalizes or whether a few markets dominate the story.
    diligencePath: Request segment and geography bridge for customers, orders, revenue, and gross margin.
    relatedQuestionRefs:
    - QU020
    - QU023
