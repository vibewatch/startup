- id: named-public-customer-proof
  title: Named public customer proof
  body: 'The best public customer proof is not a glossy enterprise case-study set; it is a combination of homeowner review platforms, customer testimonials, and a few dated product pages. Dutch review platform Klantenvertellen is the strongest named proof surface in the retained set. It includes a homeowner who says a solar-plus-heat-pump-plus-battery setup produced a year of free electricity and roughly €200 of cash back, another household that describes hundreds of euros of savings from solar panels, a heat pump, and a home battery, and a returning legacy customer who upgraded from solar to a smart battery and dynamic contract. Australian review pages show both upside and friction. SolarQuotes exposes a large review footprint, while Solar Choice includes named reviewers describing both successful bill reductions and severe after-sales failures. The quality caveat is important: most of this proof is self-reported retail experience, while non-homeowner orders remain largely category-level.
    The Danish railway company and Lower Saxony are real order markers, but they are not yet public go-live case studies.'
