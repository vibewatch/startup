  title: 1KOMMA5° already has a real homeowner base, not just a pre-IPO story
  body: Official sources, independent reviews, and customer testimonials together support a real installed homeowner base with production usage across solar, batteries, heat pumps, and tariff optimization. The company is not trying to prove customer existence from logos alone; the stronger issue is understanding the quality and durability of that base.
