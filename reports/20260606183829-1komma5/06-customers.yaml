tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public scale / proof
  - Strategic value
  - Gap
  rows:
  - - Core homeowner retrofit
    - Buyer=user=payer household owner or family decision-maker
    - Bundle PV, battery, heat pump, EV charging, and Heartbeat AI into one home-energy stack
    - Official home and milestone pages describe integrated consultation, installation, maintenance, and software for homes
    - Largest disclosed customer pool and the main surface for software attach
    - No public revenue split by hardware-only versus software-enabled households
  - - Existing-device homeowner
    - Buyer=user=payer household; hardware may pre-date 1KOMMA5°
    - Add Heartbeat AI and dynamic tariff to compatible third-party batteries, heat pumps, and wallboxes
    - Official 2025 materials say Heartbeat was opened to compatible systems regardless of manufacturer
    - Lets 1KOMMA5° expand without installing every device itself
    - No public conversion rate from installed third-party base into paying software users
  - - Dutch / European dynamic-tariff household
    - Buyer=user=payer household
    - Use Dynamic Pulse plus Heartbeat AI to automate charging, storage, and feed-in timing
    - Dutch Dynamic Pulse page says more than 120,000 customers trust the platform and highlights app-based control
    - Recurring tariff and software relationship is closer to utility replacement than one-off installation
    - No public household-level churn, contract length, or ARPU by market
  - - Large property owners / housing associations
    - Buyer=asset owner or portfolio manager; users=tenants / buildings; payer=owner or portfolio entity
    - Deploy Heartbeat-led optimization across portfolios with thousands of buildings
    - Official November 2025 order release says 1KOMMA5° is receiving large orders from property owners and sees housing associations becoming active
    - Opens a higher-ticket expansion lane beyond individual homeowners
    - Public sources do not name a housing-association customer or disclose rollout scope
  - - Public-sector / institutional accounts
    - Buyer=public authority or institution; users=facilities; payer=public budget
    - Order-led electrification and flexibility projects
    - Official November 2025 release names the state of Lower Saxony and a leading Danish railway company in the order intake
    - Could diversify demand beyond retail households
    - Named deployments, contract values, and go-live status are not public
  - - Australia partner-led schemes
    - Buyer=payer household, but acquisition can be mediated by councils or partners
    - Bulk-buy or council-backed solar and battery offers using local installers
    - Whirlpool discussion describes a Hunter-area scheme run with three local government councils
    - Shows channel-led acquisition outside core European direct sales
    - Forum evidence is low confidence and does not prove scaled repeatability
  notes: Rows separate the visible homeowner core from edge segments; gaps are genuine disclosure holes rather than omitted work.
