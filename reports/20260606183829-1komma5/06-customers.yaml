- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / execution risk
  - Impact
  - Diligence path
  rows:
  - - Installed-base upsell into Heartbeat, batteries, heat pumps, and tariffs
    - Public sources show cross-sell anecdotes but no attach-rate disclosure
    - Without real attach and churn data, the recurring-software thesis is difficult to underwrite
    - Request customer-cohort ladder from first install to battery, heat pump, and tariff activation
  - - Large property-owner and public-sector orders
    - Named evidence stops at categories such as Lower Saxony and a Danish railway company
    - B2B expansion may be strategically real but still too thin for concentration analysis
    - Request top ten non-household accounts, contract values, and deployment dates
  - - Google Cloud data platform
    - Heartbeat scaling and acquisition integration appear tied to Google Cloud services
    - Cloud dependency can affect uptime, integration pace, and economics
    - Request cloud-spend concentration, disaster-recovery design, and migration optionality
  - - Amber Electric and local network conditions in Australia
    - Wholesale-market value depends on retailer partnership, tariff settings, and network compatibility
    - Customer savings may vary sharply by market and may be hard to reproduce outside compatible conditions
    - Request active Australian Heartbeat households by network and realized bill savings distribution
  - - Local installer / service network
    - Independent reviews repeatedly cite poor after-sales support, missed appointments, and warranty friction
    - Service leakage can impair referrals, repeat purchases, and brand trust
    - Request installer QA metrics, subcontractor mix, and service-level agreements by region
  - - Customer concentration disclosure
    - No public top-customer, channel, or geography mix is disclosed
    - A hidden large-account concentration could skew the apparent breadth of the base
    - Request revenue and gross profit concentration by top customers, markets, and acquisition channels
  notes: This table mixes strategic expansion opportunities with the concentration and dependency risks that could cap durable customer value.
