figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: The customer journey starts with a homeowner retrofit sale but increasingly extends into software activation, tariff management, and cross-sell.
  data:
    items:
    - label: Need recognition
      detail: Households start from high power bills, electrification goals, or a desire to combine solar, storage, heating, and EV charging in one offer.
      touchpoints:
      - Energy bill pressure
      - Electrification planning
      - Home retrofit search
    - label: Quote and system design
      detail: 1KOMMA5° sells consultation, planning, financing context, and an integrated hardware stack through local teams and installers.
      touchpoints:
      - Sales consultation
      - System design
      - Installer or council-led scheme
    - label: Installation and commissioning
      detail: Regional craftsmen or contractors install the hardware and connect the household to the app and monitoring surface.
      touchpoints:
      - PV / battery / heat-pump install
      - Commissioning
      - Warranty start
    - label: Heartbeat activation
      detail: Customers enroll devices, tariffs, and automations so the software can optimize charging, feed-in, and wholesale-market participation.
      touchpoints:
      - Heartbeat app
      - Dynamic tariff or Amber link
      - Enrollment / troubleshooting
    - label: Operate and save
      detail: The value proposition shifts from one-off hardware economics to ongoing optimization, monitoring, and service.
      touchpoints:
      - Battery automation
      - Usage visibility
      - Support and updates
    - label: Expand or renew
      detail: Happy households can add more devices or tariffs, while larger property owners and institutions can expand the model into portfolios.
      touchpoints:
      - Battery or heat-pump upsell
      - Dynamic Pulse renewal
      - Property-owner expansion
