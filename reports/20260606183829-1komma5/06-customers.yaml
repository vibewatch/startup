company:
  name: 1KOMMA5°
chapter:
  number: 6
  title: Customers
  summary: '1KOMMA5°''s customer proof is strongest in its homeowner base: official sources support growth from more than 100,000 customers in late 2024 to more than 120,000 by mid-2025, while Dutch and Australian review surfaces show live production use of batteries, heat pumps, Heartbeat AI, and dynamic tariffs. Expansion beyond homeowners is plausible but thinner: the November 2025 order release mentions a Danish railway company, Lower Saxony, property owners, and housing associations, yet public retention, concentration, and named B2B deployment data remain largely undisclosed and after-sales service complaints recur across independent review platforms.'
sections:
- id: customer-segmentation-and-homeowner-core
  title: Customer segmentation and homeowner core
  body: '1KOMMA5° is still primarily a homeowner business, even though management increasingly describes a broader energy-platform ambition. Official pages define the core offer around fully electrifying a home with photovoltaics, batteries, heat pumps, EV charging, installation, maintenance, and the Heartbeat AI software layer. In that motion, the buyer, user, and payer are usually the same household decision-maker, but the monetization surface can extend beyond the initial hardware sale into a flat-fee software relationship and a dynamic tariff relationship. Dutch and Australian product pages reinforce that framing by marketing direct savings, app-based control, and ongoing monitoring to households rather than to utilities. The visible segment map does broaden at the edge: property owners, public-sector buyers, Australian council-led schemes, and existing third-party device owners appear in the record. But the company still discloses household counts far more clearly than revenue mix by
    geography, segment, or channel.'
