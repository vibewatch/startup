chapter:
  number: 3
  title: Competitors
  summary: '1KOMMA5° competes in two overlapping arenas: installer-led full-home bundles led by Enpal
    and challenged by E.ON and Svea Solar, and software or flexibility-led peers led by Kraken, Octopus,
    and sonnen. The strongest public evidence supports a real advantage in combining local installer density
    with VPP and control software, but the moat is not closed: Enpal is the closest like-for-like challenger
    at the point of sale, while Octopus and Kraken plus sonnen can pressure recurring tariff and flexibility
    economics after installation.'
sections:
- id: landscape-and-competitive-classes
  title: Landscape by competitor class and substitute set
  body: |-
    1KOMMA5° is not just competing with another solar installer. The public landscape breaks into at least five buyer-visible options: full-stack installer bundles such as Enpal and 1KOMMA5° itself; incumbent utility-led offers from E.ON; battery or community-led ecosystems from sonnen; retail or software-led flexibility players such as Octopus and Kraken; and the status quo of local specialists or self-assembled stacks. That matters because the customer job is broader than rooftop generation. Buyers increasingly want solar, storage, heat pump, charging, tariff optimization, and after-sales support to work together, and several peers now market some version of that promise.

    1KOMMA5°'s public case is that it pairs local handwork with software and scale: more than 100,000 customers, 75 sites, and a bundle that extends from PV and heat pumps to Heartbeat AI and Dynamic Pulse. Enpal is the clearest direct analogue because it markets the same hardware stack with financing and device control. E.ON, sonnen, Svea Solar, and Octopus broaden the threat model by offering trust, partner distribution, tariffs, or VPP economics without perfectly mirroring 1KOMMA5°'s local roll-up strategy. The result is a layered field rather than a single-head rival list, and the right diligence question is which layer most threatens acquisition, retention, or recurring software take-rate.
