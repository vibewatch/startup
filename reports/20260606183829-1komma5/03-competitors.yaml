- id: TP004
  title: Moat durability and competitive-risk register
  columns:
  - moat claim
  - main threat
  - severity
  - evidence
  - mitigation / diligence ask
  rows:
  - - Local installer density protects customer acquisition
    - Enpal plus trusted utilities and retail brands can still match regional execution through partners
    - high
    - 1KOMMA5° cites 75 sites; Enpal highlights regional handwerker teams; Octopus highlights local craft
      expertise
    - Request conversion and retention by postcode to test whether site density actually improves close
      rate or service outcomes
  - - Heartbeat AI and recurring software fees deepen lock-in
    - Kraken and sonnen can capture tariff and flexibility economics even without winning the rooftop
      sale
    - high
    - Kraken discloses 2 GW and 500k devices; sonnen discloses sonnenFlat and sonnenVPP; 1KOMMA5° discloses
      500 MW and 50k systems
    - Ask for attach rate, software ARPU, and churn after households switch retailer or optimizer
  - - Financing innovation is a differentiator
    - Enpal shows stronger public acquisition packaging and ABS-backed financing proof
    - high
    - EIB-backed Enpal securitization and public 0 € down messaging reduce upfront friction
    - Obtain signed quote comparisons including subsidy timing, down payment, and monthly burden
  - - Partner and channel reach can accelerate scale
    - Zolar shows channel software can matter even after consumer retreat; IKEA shows retail distribution
      can generate tariff demand
    - medium
    - 120 installers on Zolar software; IKEA/Svea dynamic tariff open beyond hardware buyers
    - Map whether channel partners own the recurring customer relationship or merely the lead
  - - Brand trust lowers perceived risk
    - Zolar insolvency shows that weak balance sheets and warranty uncertainty can quickly damage the
      customer proposition
    - high
    - Zolar ended support and handed customers toward Otovo after insolvency
    - Stress-test warranty backing, balance-sheet support, and third-party service arrangements
  - - Internal build stays a substitute
    - Households can still piece together hardware, tariffs, and control tools from specialists
    - medium
    - Multiple peers sell only parts of the stack or route work through partners, implying a modular market
      remains viable
    - Interview customers who self-assembled to quantify time, service burden, and savings delta versus
      bundled offers
  notes: Severity reflects competitive importance to 1KOMMA5° as of the 2026-06-06 run date. Risks mix
    direct rivals, substitutes, and adverse market evidence because commoditization can arrive from multiple
    directions.
