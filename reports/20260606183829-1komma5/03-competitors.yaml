figures:
- id: FP001
  title: 'Competitive positioning map: distribution control vs. software and flexibility depth'
  type: quadrant
  layout: wide
  summary: Ordinal 1-5 scoring shows 1KOMMA5° and Enpal strongest among installer-led bundles, while Octopus
    and Kraken lead on software and tariff depth rather than local installer ownership.
  data:
    points:
    - label: 1KOMMA5°
      x: 5
      y: 5
      note: Distribution control 5 from 75-site local footprint; flexibility depth 5 from Heartbeat AI
        and 500 MW disclosed VPP scale.
    - label: Enpal
      x: 5
      y: 4
      note: Strong installer control and financing package; software and tariff layer is visible but public
        flexibility scale is less explicit than 1KOMMA5° or Kraken.
    - label: E.ON
      x: 3
      y: 3
      note: Utility trust and HEMS matter, but reviewed public proof is more service-led than VPP-led.
    - label: sonnen
      x: 3
      y: 4
      note: Partner-led customer acquisition lowers distribution control, while sonnenFlat and sonnenVPP
        raise flexibility depth.
    - label: Svea/IKEA
      x: 4
      y: 3
      note: Retail reach and installer execution are strong, but public software and VPP proof is lighter
        than Kraken or Heartbeat AI.
    - label: Octopus/Kraken
      x: 2
      y: 5
      note: Local heat-pump execution exists, but the strongest public differentiation is software, tariffs,
        and utility integration.
    - label: Zolar Installer Services
      x: 2
      y: 2
      note: Channel software remains relevant, but end-customer distribution collapsed after the residential
        exit.
    - label: Local installers / internal build
      x: 4
      y: 1
      note: High local presence is possible, but software, tariff, and VPP depth are usually fragmented
        across vendors.
  approximationNotes: X-axis is public control of customer acquisition and installation from 1 (mostly
    partner or indirect) to 5 (dense local owned or controlled field execution). Y-axis is public software
    and flexibility depth from 1 (little recurring control proof) to 5 (large-scale tariff, VPP, or optimization
    proof). Scores are evidence-backed ordinals, not audited market-share data.
