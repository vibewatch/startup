  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Realized post-subsidy contract values, discounting behavior, and attach rates for
      solar-plus-storage-plus-heat-pump bundles across 1KOMMA5°, Enpal, E.ON, sonnen, and Octopus.
    whyItMatters: Public pages show only scattered price cues, so it remains hard to tell whether competitive
      advantage comes from true price leadership, financing structure, or sales execution.
    diligencePath: Request anonymized signed quotes and conversion data from at least three German postcodes
      per provider, including subsidy assumptions, financing terms, and recurring software or tariff fees.
    relatedQuestionRefs:
    - QP010
    - QP021
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: software-economics
    missingEvidence: Comparable public disclosure on recurring software ARPU, tariff attach rate, and
      flexibility revenue share for Heartbeat AI, Enpal.One+, sonnenFlat or sonnenVPP, and Kraken-linked
      tariffs.
    whyItMatters: The key moat debate is whether software and flexibility monetization can compound hardware
      installs, but the public record mostly shows device or VPP scale rather than unit economics.
    diligencePath: Obtain management commentary or customer-level examples showing monthly software fees,
      tariff margin pass-through, flexibility payouts, and attach-rate by product cohort.
    relatedQuestionRefs:
    - QP017
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: internal-build
    missingEvidence: Apples-to-apples evidence on time-to-install, warranty burden, and total cost for
      households that self-assemble with local specialists instead of buying a bundled platform offer.
    whyItMatters: Internal build is a real substitute, but without operational evidence it is hard to
      quantify how much convenience and ongoing optimization buyers truly sacrifice.
    diligencePath: Interview recent German households that chose separate installer, tariff, and device-control
      vendors, then compare commissioning time, service tickets, and realized bills to bundled-platform
      customers.
    relatedQuestionRefs:
    - QP025
