- id: software-flexibility-and-recurring-economics
  title: Software, flexibility, and recurring-economics rivalry
  body: |-
    The most important non-obvious competitor set is not another rooftop installer but the group trying to own device orchestration and tariff economics after the hardware is installed. 1KOMMA5° argues that Heartbeat AI already has residential VPP scale, with 500 MW and around 50,000 connected systems, and that its software can shift the household toward much lower power costs while monetizing flexibility through a flat software fee. Sonnen makes a smaller but conceptually similar pitch around sonnenFlat and sonnenVPP, where distributed batteries are pooled to share solar and support the grid. Octopus and Kraken push the model further toward software and retail economics: Octopus Germany markets smart tariffs for EVs, batteries, and heat pumps, while Kraken claims 2 GW and more than 500,000 connected devices across residential flexibility.

    This creates a two-front dynamic for 1KOMMA5°. Installer-led peers such as Enpal pressure the hardware sale, but Kraken-like platforms threaten the long-term value pool if utilities and retailers become the default owners of the tariff, dispatch, and optimization relationship. The public record still leaves unit economics opaque, so it is too early to call any one software layer dominant. Even so, the evidence already shows that recurring value capture can migrate away from whoever sold the rooftop system first. That means 1KOMMA5°'s software differentiation is real, but it is contested by companies whose install footprint may be weaker while their tariff and utility integration are stronger.
  claimRefs:
