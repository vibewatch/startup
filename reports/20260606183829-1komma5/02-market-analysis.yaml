  - id: growth-drivers-and-regulatory-backdrop
    title: "Growth Drivers, Regulatory Backdrop, and Policy Timeline"
    body: >-
      Germany's home electrification market is governed by an unusually dense stack of federal
      incentives and regulations that act as both the primary growth engine and the principal
      uncertainty source. The EEG 2023 feed-in tariff currently pays 8.11 ct/kWh (partial export,
      ≤10 kWp) or 12.87 ct/kWh (full export), locked for 20 years from registration — a powerful
      economic anchor for household investment cases. The KfW 442 battery grant of up to €3,200 per
      system and the 0% VAT on PV hardware and installation (since 2023) further reduce the
      payback period.

      Three structural tailwinds are reshaping the value proposition beyond simple feed-in arbitrage.
      First, the Solar Peak Act (February 2025) mandates intelligent storage integration for all new
      PV systems, directly boosting demand for battery+HEMS bundles. Second, dynamic electricity
      tariffs became mandatory for all German electricity suppliers in 2025, enabling PV+storage
      owners to achieve €50–288/year in additional savings through spot-price optimisation.
      Third, an energy-sharing regulation takes effect from June 2026, opening collective local
      renewable use and new VPP business models. Annual redispatch costs exceeding €4 billion inflate
      grid fees and shorten payback periods for commercial and residential behind-the-meter systems.

      The proposed 2027 EEG reform introduces the most significant downside risk: if passed as
      drafted, it would eliminate feed-in compensation for systems below 25 kW, removing the
      key investment-case anchor for new residential PV. BSW-Solar has warned this would slow
      expansion and endanger tens of thousands of jobs.
