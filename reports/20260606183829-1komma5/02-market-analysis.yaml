callouts:
  - calloutType: risk
    title: "Regulatory Cliff Risk: Proposed 2027 EEG Reform"
    body: >-
      A draft amendment to Germany's Renewable Energy Sources Act proposes eliminating feed-in
      compensation for newly built PV systems up to 25 kW from 2027. If enacted as drafted, this
      would remove the primary financial anchor for roughly 60% of owner-occupier buyers (survey
      data shows only ~40% would proceed without subsidies). BSW-Solar has warned the proposal
      would slow expansion and endanger tens of thousands of jobs. The risk is asymmetric for
      installers with high subsidy-dependent demand and low software/recurring revenue. 1KOMMA5°'s
      recurring HEMS/VPP revenue and multi-market footprint provide partial insulation but do not
      eliminate exposure to a hard German residential solar correction.
    claimRefs:
      - CM035
      - CM036
      - CM024
      - CM040

  - calloutType: insight
    title: "1KOMMA5° as Market-Correction Beneficiary"
    body: >-
      Counter-intuitively, the 2024–2026 residential solar correction may strengthen 1KOMMA5°'s
      competitive position. The market fragmentation that characterised the 2022–2023 boom —
      hundreds of under-capitalised installers competing on hardware price alone — is resolving
      through insolvencies and restructuring. Vertically integrated operators with recurring
      software revenue (Heartbeat AI flat fee), own procurement scale, and multi-market diversification
      are best positioned to survive consolidation. 1KOMMA5° grew organic revenue 36% in 2024 while
      peers went insolvent, a divergence that validates the full-stack model's margin durability.
    claimRefs:
      - CM037
      - CM038
      - CM041
      - CM042

