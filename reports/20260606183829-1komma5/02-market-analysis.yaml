  - id: market-headwinds-and-1komma5-fit
    title: "Market Headwinds and 1KOMMA5° Competitive Fit"
    body: >-
      Germany's residential solar market entered a meaningful correction in 2024–2026. Multiple
      installers and PV system providers became insolvent or undertook major restructuring in late
      2024, including Zolar (>50% staff cuts), ESS Kempfle (insolvency), Wegatech (insolvency), and
      Solarmax (provisional insolvency administration). The drivers of the correction were structural
      normalisation — electricity prices retreating from 2022 energy-crisis peaks, higher interest
      rates raising system financing costs, and Chinese module competition compressing margins — rather
      than fundamental demand destruction. Across the EU, residential solar fell by approximately
      5 GW in 2024. The market correction is continuing into 2026, with Q1 2026 residential
      installations 21% below the prior year.

      Against this backdrop, 1KOMMA5° demonstrated above-market resilience: organic revenue grew 36%
      (€360M to €490M) between 2023 and 2024, and total revenue reached approximately €520M in 2024
      with 15.5% year-on-year growth. Management attributes this outperformance to its vertically
      integrated model — owning both the installation and the recurring Heartbeat AI software fee —
      which insulates gross margin from the hardware price collapse.

      The Heartbeat AI platform's hardware-agnostic architecture means it is addressable to the ~20 GWh
      installed base of residential battery storage (end-2025), not just 1KOMMA5°-installed systems.
      Operating Europe's largest residential VPP at 500–600 MW of connected flexibility expands the
      addressable market into grid ancillary services, frequency regulation, and power trading —
      markets that 1KOMMA5° has already entered in Sweden.
