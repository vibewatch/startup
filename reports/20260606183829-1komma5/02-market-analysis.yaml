chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Germany's residential home electrification market — solar PV (≤30 kWp), battery storage, heat pumps,
    EV wallboxes, and AI energy management software — represents an annual addressable spend of roughly
    €10–15 billion, underpinned by approximately 16.2 million single-family homes and a 2030 national
    target of 215 GW solar. After a 17.5 GW addition in 2025, cumulative capacity reached ~117–118 GW,
    yet residential rooftop installations fell 25% in 2025 versus 2024 and slid a further 21%
    year-on-year in Q1 2026, reflecting post-crisis demand normalisation and subsidy uncertainty.
    Battery storage bucked the trend with a record Q1 2026 (+67% year-on-year), as did heat pumps
    (+55% full-year 2025). 1KOMMA5° grew organic revenue 36% in a contracting market by bundling
    full-stack hardware with Heartbeat AI's hardware-agnostic VPP, positioning it as the highest-margin
    operator in a consolidating installer landscape facing a proposed 2027 EEG reform that could
    eliminate feed-in compensation for systems below 25 kW.

sections:
  - id: market-boundary-and-structure
    title: "Market Boundary and Segment Structure"
    body: >-
      Germany's home electrification market spans five product categories that form a natural energy
      stack for the owner-occupied residential dwelling: rooftop solar PV systems (typically ≤30 kWp),
      co-located battery storage (5–15 kWh), heat pumps for space and water heating, EV wallboxes for
      home charging, and AI-driven home energy management software (HEMS) that orchestrates all assets
      against real-time electricity spot prices. Excluded from this market's scope are utility-scale
      projects above 30 kWp, ground-mounted parks, commercial and industrial installations, and public
      DC fast-charging infrastructure. Germany has approximately 16.2 million single- and two-family
      homes, making it Europe's largest addressable residential energy market by housing stock. The
      status-quo substitute is a grid-only household purchasing electricity at approximately
      €0.30–0.35/kWh while heating with a gas or oil boiler — a model increasingly undermined by
      energy-price volatility, the 2024 Building Energy Act (GEG), and regulatory preference for
      electrified heating and mobility. The five product categories reinforce one another: solar
      generates low-cost power, storage smooths self-consumption, heat pumps and wallboxes consume
      the surplus, and HEMS software monetises residual grid flexibility through virtual power plant
      (VPP) aggregation.
    claimRefs:
