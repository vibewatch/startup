    {
      "id": "installation-software-and-service-execution",
      "title": "Installation, software, and service execution risk",
      "body": "Execution risk is high because the company is trying to scale a hard-and-soft business simultaneously. Heartbeat's own materials say the product requires deep integration with manufacturers, market interfaces, local IoT gateways, smart meters, and billable circuit management. The open-market launch expands that challenge from the company's own installed base to millions of third-party systems. This is strategically attractive, but it multiplies failure modes around APIs, firmware, field commissioning, and customer support. The operating model adds another layer of complexity: 1KOMMA5° still relies on regional master craftsmen and on acquired installation businesses that must be standardized inside one operating system. Review surfaces do not prove a broken company, but they do show repeated schedule slippage, warranty delays, no-follow-up episodes, and cases where customers say support quality lagged the sales promise. For underwriting, the key issue is not whether some customers are happy—they clearly are—but whether service variance stays manageable as Heartbeat, batteries, heat pumps, and dynamic tariffs expand together.",
