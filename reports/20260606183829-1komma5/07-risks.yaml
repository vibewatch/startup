    {
      "id": "partner-capital-and-people-dependence",
      "title": "Partner, capital, and people dependence",
      "body": "Partner and organizational dependencies mean 1KOMMA5° is not just betting on product-market fit; it is betting on coordination. Google Cloud's case study makes clear that Heartbeat, analytics, and cross-site integration run through a concentrated cloud and data stack, while 1KOMMA5°'s own materials emphasize dependence on device manufacturers, market interfaces, meters, and local installers. The acquisition model speeds expansion but also creates integration risk across 72 to 80 locations and roughly 2,400 to 2,500 employees. Public communications are also highly leader-centric: the CEO, CTO, and CPO dominate the quoted record across regulatory, product, and platform announcements, while the public team page offers little executive-depth disclosure beyond recruiting copy. Near-term capital risk is lower than at many peers because the company says it is debt-free and has raised roughly €400 million of equity. But that balance-sheet strength does not eliminate funding risk: more than €100 million is earmarked for software expansion, the round is explicitly pre-IPO, and Heartbeat still has to prove scalable monetization before public-market optionality should be assumed.",
