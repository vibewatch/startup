  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "1KOMMA5°'s residual risk is high because the company must align external policy, local field execution, and software scale-up at the same time. Smart-meter rollout and dynamic-tariff policy are real gating dependencies; the Brussels complaint shows that VPP-friendly market design is still contested; and public review surfaces show that installation, warranty, and support quality remain uneven across a rapidly acquired installer footprint. The capital base buys time, but it does not solve the still-private questions on software unit economics, complaint volumes, partner concentration, or bench depth."
  },
  "sections": [
    {
      "id": "policy-and-legal-exposure",
      "title": "Policy, legal, and consumer-protection exposure",
      "body": "Regulatory exposure is the most important external gating risk because 1KOMMA5°'s software layer needs three things to line up at once: legal availability of dynamic tariffs, physical rollout of smart meters, and policy designs that actually reward decentralized flexibility. German law is directionally supportive—suppliers must offer dynamic tariffs and smart meters are the backbone of controllable loads—but execution remains uneven. BNetzA's 2026 enforcement actions show that many operators still missed rollout quotas, which means the installed-base opportunity for Heartbeat and Dynamic Pulse can be delayed by actors 1KOMMA5° does not control. At the same time, the company's Brussels complaint against gas-peaker subsidies underlines a second policy risk: if capacity-market design favors centralized gas plants over technology-neutral flexibility, 1KOMMA5°'s VPP thesis loses part of its regulatory tailwind. Legal exposure is not limited to energy policy. Public privacy and dispute-resolution pages confirm GDPR transfer obligations, consumer-complaint deadlines, and mandatory arbitration routes, but they do not quantify actual complaint volumes or jurisdiction-by-jurisdiction compliance across all markets.",
