    {
      "id": "mitigations-and-decision-thresholds",
      "title": "Mitigations, monitoring, and decision thresholds",
      "body": "The mitigation case is credible but incomplete. 1KOMMA5° does have real defenses: regulatory engagement, a visible legal and privacy surface, a sizeable capital base, a meaningful installed-system footprint, and a software platform already operating at useful scale. Google Cloud and Heartbeat materials also show that management is actively building the infrastructure required to absorb acquisitions and new device integrations rather than improvising from scratch. Still, the residual risk remains high because the decisive proof points are private or only partially disclosed. Investors need hard operational metrics—installer SLA adherence, complaint and refund rates, OEM or API breakage frequency, attach and churn data, realized savings distributions, and organization-depth evidence—before concluding that the business can safely graduate from a fast-growing installer network into a durable energy-software platform. The chapter's decision thresholds therefore focus on measurable signals: rollout progress, regulatory outcomes, service quality, customer ROI realization, and whether funding needs stay discretionary rather than reactive.",
