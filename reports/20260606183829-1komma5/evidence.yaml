evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founder-attribution
    missingEvidence: A definitive legal founder record and current role history covering all named co-founders.
    whyItMatters: >-
      Public founder attributions differ across sources, which affects historical cap-table interpretation and
      founder-market-fit mapping.
    diligencePath: >-
      Request incorporation history, founder equity history, and a management-certified founder list with current and
      former roles.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: governance-board-disclosure
    missingEvidence: A full current board roster, observer list, and committee structure.
    whyItMatters: >-
      This chapter can identify the operating bench and a single board-level clue, but not the actual governance body
      that controls strategic decisions.
    diligencePath: >-
      Request the latest board list, observer rights, committee charters, and any governance memorandum shared with
      current investors.
    relatedQuestionRefs:
      - QO007
      - QO023
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: 2024-revenue-and-valuation-precision
    missingEvidence: >-
      Audited 2024 revenue and the exact pricing terms or implied valuation mechanics of the December 2024 and July 2025
      financings.
    whyItMatters: >-
      The official 2024 revenue figure differs from one later report, and public materials still do not provide a fresh
      priced valuation for the extension.
    diligencePath: >-
      Request audited 2024 financial statements, round documents, cap-table updates, and the price per share for the
      pre-IPO round and extension.
    relatedQuestionRefs:
      - QO013
      - QO015
      - QO024
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-control-rights
    missingEvidence: >-
      Current ownership percentages, preference stack, liquidation rights, pro rata terms, and any strategic or observer
      rights for recent investors.
    whyItMatters: >-
      Later-stage climate-tech outcomes depend heavily on who controls the next financing, IPO path, and downside
      protections, none of which are public here.
    diligencePath: >-
      Request the current cap table, financing docs, investor-rights agreement, and any side letters for G2VP, CalSTRS,
      Sabanci, and earlier major backers.
    relatedQuestionRefs:
      - QO023
      - QO025
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing-tam
    missingEvidence: >-
      An authoritative published EUR-denominated annual market size figure for Germany residential home electrification
      combining solar, storage, heat pump, and wallbox segments from a single credible source.
    whyItMatters: >-
      The absence of a single combined-category residential market size makes TAM/SAM sizing reliant on author synthesis
      and limits comparability to other market reports.
    diligencePath: >-
      Commission or identify a dedicated EUPD Research, Wood Mackenzie, or Navigant/ICF market sizing report covering
      all five home electrification product categories in Germany, denominated in EUR billions.
    relatedQuestionRefs:
      - QM006
      - QM027
  - type: enumeration-incomplete
    severity: minor
    topic: market-contraction
    missingEvidence: >-
      A comprehensive, verified list of all German solar and home energy installation companies that went insolvent or
      underwent major restructuring in 2024–2025, with headcount and revenue figures.
    whyItMatters: >-
      Understanding the scale of market exit among weaker installers is important for assessing the consolidation
      opportunity for vertically integrated operators such as 1KOMMA5°.
    diligencePath: >-
      Search Handelsblatt insolvency database, Bundesanzeiger insolvency notices, and BDEW member directory for
      2024–2025 energy installer insolvencies; cross-reference with local trade press.
    relatedQuestionRefs:
      - QM021
  - type: private-evidence-only
    severity: material
    topic: 1komma5-market-fit
    missingEvidence: >-
      Verified independent data on 1KOMMA5°'s actual market share in the German residential solar installation market by
      volume and revenue, and comparable data for direct competitors (Enpal, Zolar, thermondo).
    whyItMatters: >-
      Without market share data, it is impossible to verify whether 1KOMMA5°'s outperformance vs. the market is
      share-capturing or merely bucket-specific geographic and product mix effects.
    diligencePath: >-
      Request BSW-Solar installer-level registry data; cross-reference 1KOMMA5° EEG registration volume in the
      Marktstammdatenregister against market total; obtain competitive intelligence from EUPD Research or IHS Markit.
    relatedQuestionRefs:
      - QM016
      - QM029
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Realized post-subsidy contract values, discounting behavior, and attach rates for
      solar-plus-storage-plus-heat-pump bundles across 1KOMMA5°, Enpal, E.ON, sonnen, and Octopus.
    whyItMatters: >-
      Public pages show only scattered price cues, so it remains hard to tell whether competitive advantage comes from
      true price leadership, financing structure, or sales execution.
    diligencePath: >-
      Request anonymized signed quotes and conversion data from at least three German postcodes per provider, including
