      - number: '8.2'
        title: Thesis, anti-thesis, and recommendation
        blocks:
          - type: paragraph
            body: >-
              The investment thesis is not imaginary. Public sources support real operating scale, a large financing
              base, and software ambition that is more concrete than a normal installer narrative. Heartbeat already
              controls more than 500 MW, the company says it is profitable in core hardware, and management continues to
              reinvest more than €100 million into software. Those are the ingredients of a business that could graduate
              from hardware-heavy electrification into a higher-multiple control layer. The anti-thesis is that the
              public record still reads like a transition story rather than completed proof. Europe remains soft in
              solar and heat pumps, policy design still matters for VPP economics, and the market does not know the
              current priced round or realized Heartbeat ARR. Public comparables also warn against over-romanticizing
              the category: Sunrun shows how financing structure can burden equity, while SolarEdge shows that demand
              shocks and losses can persist even for scaled players. That balance leads to a cautious recommendation:
              research-more, with medium confidence and high risk, because the company could justify a stronger view
              only after price and software evidence clear the current gap.
