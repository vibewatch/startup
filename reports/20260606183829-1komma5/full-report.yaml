            body: >-
              Public adoption evidence is concrete enough to establish real scale, but not clean enough to underwrite
              retention. Official material moved from more than 100,000 customers and 75 locations in seven countries in
              late 2024 to more than 120,000 customers, nearly 2,500 employees, and about 80 locations by July 2025. The
              same source set shows Heartbeat AI progressing from 40,000 connected systems in February 2025 to 50,000
              connected systems and 500 MW of flexibility capacity in May, then to 600 MW by November. That progression
              matters because it suggests a software adoption layer growing inside the broader installed base, even
              though only a minority of served customers are publicly shown as Heartbeat-connected so far. The November
              2025 order milestone also matters for segment expansion: 1KOMMA5° said October orders reached about €105
              million and included a leading Danish railway company, the state of Lower Saxony, large property owners
              with thousands of buildings, and growing interest from housing associations. Those are meaningful order
              signals, but they are still not the same thing as named, deployed, retained reference accounts.
