      - number: '7.3'
        title: Demand, price, and customer-economics risk
        blocks:
          - type: paragraph
            body: >-
              Customer-economics risk is material because the marketing story is strongest on best-case savings and
              weakest on cohort dispersion. 1KOMMA5° sells lower power bills, tariff optimization, and eventually VPP
              participation, yet regulator pages make clear that dynamic tariffs work best for households with flexible
              loads, smart meters, and enough consumption to benefit from price shifting. That is a narrower economic
              sweet spot than generic cheap-electricity messaging suggests. Demand timing is also politically sensitive.
              Company releases describe recession and declining solar and heat-pump demand in Europe, while independent
              market coverage says many homeowners still wait for clarity on heating rules and subsidies. If policy
              debates drag on, consumers can defer both heat-pump purchases and software attach decisions. The risk is
              not only slower hardware revenue. A weaker solar and heat-pump cycle also reduces the flow of newly
              electrified homes from which Heartbeat can harvest recurring software revenue.
            claimRefs:
              - CR003
              - CR029
              - CR030
