      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and Contradictory Estimates'
        blocks:
          - type: paragraph
            body: >-
              Germany's home electrification market requires lens-by-lens construction rather than a single top-down
              analyst figure. The broadest lens is Germany's ~16.2 million single- and two-family homes. At an average
              installed cost of approximately €14,000–18,000 for a 10 kWp PV system with 10 kWh battery storage (2026
              pricing, 0% VAT on hardware), the cumulative lifetime replacement TAM exceeds €180 billion. On an annual
              basis, combining installation volumes (~400,000–600,000 PV systems at ~€12,000–15,000 average) with heat
              pumps (~299,000 units at ~€18,000–22,000 installed) and EV wallboxes yields a combined annual TAM of
              approximately €10–15 billion for Germany alone.

              Germany added approximately 17.5 GW (BSW-Solar gross) or 16.2 GW (Fraunhofer ISE net) of solar in 2025,
              bringing cumulative capacity to roughly 117–118 GW against a 2030 target of 215 GW — requiring ~20 GW of
              annual additions through the decade. The SAM is meaningfully smaller: approximately 10–11 million
              roof-suitable homes minus ~5 million already penetrated leaves ~5–6 million greenfield households,
              translating to an annual solar+storage SAM of €6–9 billion.

              Q1 2026 data reveals a 6% overall decline and a 21% drop in residential installations year-on-year,
              confirming an ongoing demand correction. Battery storage, however, surged to a record 2 GWh in Q1 2026
              (+67% year-on-year), and Mordor Intelligence projects the Germany solar market installed base to grow from
              132 GW in 2026 to 235 GW by 2031 at a 12.23% CAGR — though that figure captures all segments, not just
              residential. Total battery storage reached ~20 GWh cumulative at end-2025, with approximately 80% in
              residential applications.
