      - number: '4.2'
        title: GTM motion and sales efficiency proxies
        blocks:
          - type: paragraph
            body: >
              Public GTM evidence points to a blended motion: local physical distribution for hardware, software-led
              expansion into existing third-party systems, and early movement into larger property-owner accounts.
              1KOMMA5° operates as a one-stop shop through local consultation, planning, installation, and maintenance,
              and publicly cited 75 locations in seven countries at the 100,000-customer milestone. By July 2025 it was
              serving more than 120,000 customers, and by October 2025 it reported around €105 million of new orders in
              a single month, including larger orders from property owners and a Danish railway company. That order flow
              is the best public sales-efficiency proxy available because the company does not disclose CAC, payback, or
              sales cycle length. The more important forward GTM signal is strategic rather than purely volumetric:
              Heartbeat AI is being opened to millions of existing third-party systems and marketed as a
              subscription-style energy service that does not require 1KOMMA5° to install every battery or heat pump
              itself. If conversion costs stay low, that should improve software sales efficiency materially versus pure
              hardware-led growth; if smart-meter rollout, integrations, or support operations stall, the expansion
              motion slows quickly.
