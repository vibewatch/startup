      - number: '6.4'
        title: Retention, channel dependence, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The durability story is more structural than disclosed. 1KOMMA5° clearly wants a long-duration household
              relationship: official materials repeatedly say Heartbeat AI is sold on a flat software-fee basis, dynamic
              tariffs sit on top of installed hardware, and customers keep using the app for monitoring, updates, and
              ongoing optimization. Review evidence also shows repeat or cross-sell behavior, with households adding
              batteries, heat pumps, and dynamic contracts after earlier solar purchases. But none of the reviewed
              public sources disclose NRR, GRR, churn, contract duration, renewal rates, or top-customer concentration.
              That omission matters more because delivery depends on partners and operating infrastructure. Google Cloud
              is positioned as critical to scaling Heartbeat and integrating acquisitions, while the Australian
              Heartbeat offer depends on Amber Electric and local network conditions for wholesale-market value.
              Meanwhile, independent review surfaces consistently point to the same weakness: after-sales support,
              commissioning delays, installer handoffs, and warranty follow-up can erode the repeat-use case even when
              the underlying hardware or software value proposition looks strong.
