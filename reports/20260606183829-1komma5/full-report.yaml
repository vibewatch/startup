      - number: '4.4'
        title: Capital adequacy, financing dependency, and verdict
        blocks:
          - type: paragraph
            body: >
              The near-term capital picture is better than the disclosure picture. Official and news sources align on
              roughly €400 million of cumulative equity raised, a €150 million pre-IPO round in December 2024, a 2025
              extension with undisclosed additional capital, continued debt-free status, and an approved €100 million
              credit line that remained unused. Those facts matter because they suggest 1KOMMA5° is funding Heartbeat
              expansion from a position of relative balance-sheet strength rather than emergency refinancing. The
              company is also explicit that it intends to spend more than €100 million on Heartbeat AI through 2027 and
              had already targeted mid-double-digit million SaaS revenue in 2025, so the next financing trigger is more
              likely software scale, IPO timing, or strategic acceleration than core hardware survival. Still, public
              underwriting remains incomplete. Reviewed sources do not disclose cash on hand, monthly burn, runway
              months, gross margin by stream, customer concentration, or the realized attach, churn, and ARPU of
              Heartbeat subscriptions. The financial verdict is therefore qualified: revenue quality and capital
              adequacy look directionally better than many European installer peers, but a clean investment case still
              requires private data on software economics, working capital, and cash efficiency.
