      - number: '1.4'
        title: Milestones, platform depth, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a company moving from fast roll-up to more software-led energy orchestration.
              Public coverage ties the founding year to 2021, the large Series A to 2022, and unicorn status to 2023. By
              2024, the company was already publicizing a Berlin TestLab, 100,000-plus customers, and stronger
              software-led positioning around Heartbeat. In 2025, it paired pre-IPO financing with evidence that the
              virtual power plant had reached 500 MW and later 600 MW, while October order intake passed €105 million
              for the first time.


              Those positives sit next to two important caution flags. First, the public record on 2024 revenue is not
              perfectly reconciled: official preliminary figures point to roughly €520 million, while Deutsche Startups
              later cited €540 million and minimal valuation uplift in the pre-IPO round. Second, the company has become
              an explicit policy combatant. In October 2025 it filed a complaint in Brussels against the German
              gas-plant subsidy plan, arguing that the framework discriminates against decentralized flexibility and
              virtual power plants.


              That does not make chapter 1 negative, but it does make it less straightforward than a simple growth
              story. 1KOMMA5° looks like a scaled climate-tech platform with visible product depth, but later chapters
              should carry forward the valuation ambiguity, the limited governance disclosure, and the real exposure to
              regulatory design in the power market.
