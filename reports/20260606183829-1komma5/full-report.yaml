      - number: '4.3'
        title: Cost structure, margin drivers, and adverse service signals
        blocks:
          - type: paragraph
            body: >
              1KOMMA5°'s cost base appears structurally mixed: hardware delivery still requires local labor, device
              procurement, integration, and service capacity, while software scale depends on cloud infrastructure,
              smart-meter connectivity, local IoT gateways, and R&D. Management has been explicit that expensive German
              polysilicon and rising sales costs pressured the 2024 margin picture even while the company stayed
              operationally profitable. The Berlin test lab and the Heartbeat product pages also point to a meaningful
              fixed-cost software organization, with around 200 developers and a dedicated research center used to train
              and refine optimization models. Public customer-review evidence adds a practical cost warning that the
              official narrative does not quantify: after-sales delays, quote overruns, warranty follow-up problems, and
              service backlogs recur across Australia and Nordic review platforms. None of that proves a broken model,
              but it does imply that contribution margin can leak through rework, customer support, and reputation drag
              if software-led expansion outruns service capacity. The biggest remaining blind spot is still gross margin
              disclosure: there is no public split between installation economics, service margins, and Heartbeat
              software contribution.
