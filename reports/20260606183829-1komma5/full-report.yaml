      - number: '3.4'
        title: Switching costs, channel risk, and displacement
        blocks:
          - type: paragraph
            body: >-
              The buyer-facing lock-in here is moderate, not absolute. Once a household has chosen a platform that
              coordinates installer access, tariff enrollment, device setup, and app-level control, there is real
              friction to switching because the software, support, and incentive layers sit on top of physical assets
              with long lifetimes. Regional installer networks make that stickier because service quality, subsidy
              paperwork, and commissioning still depend on human execution. That helps 1KOMMA5°, Enpal, sonnen, and
              Octopus more than it helps pure lead-generation marketplaces.


              But the adverse evidence is just as important. Zolar's restructuring and the transfer of end-customer
              support toward Otovo show that service continuity is a live risk when an installer platform loses
              financial resilience. Public pricing remains patchy across much of the field, which keeps multi-homing and
              replacement conversations open. And incumbents or retail brands can still displace installer-led
              specialists by pairing trust and tariff access with partner distribution, even without owning a
              1KOMMA5°-style M&A machine. The status quo alternative of assembling a solution through local specialists
              also remains viable, although it likely pushes coordination, warranty, and optimization burdens back onto
              the household. Netting those forces together, 1KOMMA5° has a meaningful but perishable moat: strong local
              presence plus software is harder to copy than hardware alone, yet not strong enough to ignore utilities,
              retailers, or flexibility platforms that can capture the recurring relationship.
