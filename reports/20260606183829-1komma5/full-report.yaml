      - number: '8.3'
        title: Scenario analysis and comparable clearing levels
        blocks:
          - type: paragraph
            body: >-
              The cleanest public comp set produces a wide but useful clearing range. In June 2026, Enphase traded
              around 5.3x sales, SolarEdge around 3.3x, and Sunrun around 1.0x on equity value, with Sunrun’s much
              higher enterprise value underscoring how capital structure can obscure what common equity is really
              buying. Private references expand the range further: Octopus carried a $9 billion valuation on a much
              larger software-and-retail platform, while Enpal’s private marks show that scaled
              residential-electrification businesses can still be worth several billion when financing depth and
              customer acquisition are proven. 1KOMMA5° sits between those endpoints. The official revenue anchor and
              unicorn status support a base band around €1.0-1.6 billion, but a bull case above €2 billion requires
              proof that Heartbeat is not just strategically important but economically material. Without that proof,
              any premium price asks the investor to underwrite a future software transition that the public record has
              not yet quantified. That is why the scenario analysis is tilted toward preserving discipline rather than
              chasing the narrative.
