      - number: '2.5'
        title: Market Headwinds and 1KOMMA5° Competitive Fit
        blocks:
          - type: paragraph
            body: >-
              Germany's residential solar market entered a meaningful correction in 2024–2026. Multiple installers and
              PV system providers became insolvent or undertook major restructuring in late 2024, including Zolar (>50%
              staff cuts), ESS Kempfle (insolvency), Wegatech (insolvency), and Solarmax (provisional insolvency
              administration). The drivers of the correction were structural normalisation — electricity prices
              retreating from 2022 energy-crisis peaks, higher interest rates raising system financing costs, and
              Chinese module competition compressing margins — rather than fundamental demand destruction. Across the
              EU, residential solar fell by approximately 5 GW in 2024. The market correction is continuing into 2026,
              with Q1 2026 residential installations 21% below the prior year.

              Against this backdrop, 1KOMMA5° demonstrated above-market resilience: organic revenue grew 36% (€360M to
              €490M) between 2023 and 2024, and total revenue reached approximately €520M in 2024 with 15.5%
              year-on-year growth. Management attributes this outperformance to its vertically integrated model — owning
              both the installation and the recurring Heartbeat AI software fee — which insulates gross margin from the
              hardware price collapse.

              The Heartbeat AI platform's hardware-agnostic architecture means it is addressable to the ~20 GWh
              installed base of residential battery storage (end-2025), not just 1KOMMA5°-installed systems. Operating
              Europe's largest residential VPP at 500–600 MW of connected flexibility expands the addressable market
              into grid ancillary services, frequency regulation, and power trading — markets that 1KOMMA5° has already
              entered in Sweden.
            claimRefs:
              - CM037
              - CM038
              - CM041
              - CM042
              - CM043
              - CM044
              - CM045
              - CM048
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Regulatory Cliff Risk: Proposed 2027 EEG Reform'
            body: >-
              A draft amendment to Germany's Renewable Energy Sources Act proposes eliminating feed-in compensation for
              newly built PV systems up to 25 kW from 2027. If enacted as drafted, this would remove the primary
              financial anchor for roughly 60% of owner-occupier buyers (survey data shows only ~40% would proceed
              without subsidies). BSW-Solar has warned the proposal would slow expansion and endanger tens of thousands
              of jobs. The risk is asymmetric for installers with high subsidy-dependent demand and low
              software/recurring revenue. 1KOMMA5°'s recurring HEMS/VPP revenue and multi-market footprint provide
              partial insulation but do not eliminate exposure to a hard German residential solar correction.
            calloutType: risk
            claimRefs:
              - CM035
              - CM036
              - CM024
              - CM040
          - type: callout
            title: 1KOMMA5° as Market-Correction Beneficiary
            body: >-
              Counter-intuitively, the 2024–2026 residential solar correction may strengthen 1KOMMA5°'s competitive
              position. The market fragmentation that characterised the 2022–2023 boom — hundreds of under-capitalised
              installers competing on hardware price alone — is resolving through insolvencies and restructuring.
              Vertically integrated operators with recurring software revenue (Heartbeat AI flat fee), own procurement
              scale, and multi-market diversification are best positioned to survive consolidation. 1KOMMA5° grew
              organic revenue 36% in 2024 while peers went insolvent, a divergence that validates the full-stack model's
              margin durability.
            calloutType: insight
            claimRefs:
              - CM037
              - CM038
              - CM041
              - CM042
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape by competitor class and substitute set
        blocks:
          - type: paragraph
            body: >-
              1KOMMA5° is not just competing with another solar installer. The public landscape breaks into at least
              five buyer-visible options: full-stack installer bundles such as Enpal and 1KOMMA5° itself; incumbent
              utility-led offers from E.ON; battery or community-led ecosystems from sonnen; retail or software-led
              flexibility players such as Octopus and Kraken; and the status quo of local specialists or self-assembled
              stacks. That matters because the customer job is broader than rooftop generation. Buyers increasingly want
              solar, storage, heat pump, charging, tariff optimization, and after-sales support to work together, and
              several peers now market some version of that promise.


              1KOMMA5°'s public case is that it pairs local handwork with software and scale: more than 100,000
              customers, 75 sites, and a bundle that extends from PV and heat pumps to Heartbeat AI and Dynamic Pulse.
              Enpal is the clearest direct analogue because it markets the same hardware stack with financing and device
              control. E.ON, sonnen, Svea Solar, and Octopus broaden the threat model by offering trust, partner
              distribution, tariffs, or VPP economics without perfectly mirroring 1KOMMA5°'s local roll-up strategy. The
              result is a layered field rather than a single-head rival list, and the right diligence question is which
              layer most threatens acquisition, retention, or recurring software take-rate.
