  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing, and disclosed revenue mix
        blocks:
          - type: paragraph
            body: >
              1KOMMA5° is no longer just an installer narrative. Public evidence shows a hybrid model in which
              integrated home-electrification projects still drive most disclosed scale, while Heartbeat AI increasingly
              functions as a software and energy-market layer on top. The core hardware business spans photovoltaics,
              storage, heat pumps, EV charging, installation, and ongoing service through local master craftsmen and
              regional sites. On top of that base, Heartbeat AI automates storage, load shifting, and electricity-market
              participation. The company has repeatedly said it charges a flat software fee rather than taking a
              supplier-like margin on electricity. Until late 2025 that pricing model was mostly directional; newer
              official product and press pages now make it more concrete, with the open-market Heartbeat box priced at
              €599 one-time and AI optimization at €14.99 per month, while Dynamic Pulse is marketed without a monthly
              base fee but still depends on smart meters and spot-market-linked consumption. That makes the monetization
              model more legible, but not yet fully underwriteable: reviewed public sources still do not break out how
              much of the ~€520 million 2024 revenue is installation hardware, service, recurring software, or
              electricity-market monetization.
