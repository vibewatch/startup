            body: >-
              Public evidence shows meaningful convergence around product breadth but weaker convergence on pricing
              transparency. Enpal discloses the clearest hardware-side acquisition cues among the reviewed installers: 0
              € down, buy-rent-finance options, a heat pump from €7,800, and a marketed electricity offer from 19 ct/kWh
              plus annual remuneration through Enpal.One+. IKEA and Svea Solar are unusually transparent on tariff
              packaging, publishing a monthly fee and partner discount for a dynamic retail offer. Octopus discloses
              consumer tariff concepts, EV savings language, and a heat-pump service package, while E.ON and sonnen
              emphasize service, trust, and partner-led fulfillment more than comparable all-in bundle pricing.


              That pricing opacity is strategically important. In a market where public pages rarely show a final
              configured system price, financing structure, subsidy handling, and quote conversion become part of the
              product. Enpal appears strongest on explicit acquisition packaging. E.ON and IKEA plus Svea can lean on
              trusted parent or retail brands. Sonnen uses certified local partners, which preserves a regional-service
              feel but reduces direct public price comparability. 1KOMMA5° sits between these approaches: it sells a
              broad integrated stack and local execution, but reviewed public pages reveal much more about the software
              and savings promise than about the realized contracted bundle price. This is enough to compete, but it
