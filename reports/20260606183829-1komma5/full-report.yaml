    rows:
      - - 1KOMMA5°
        - Installer-led full-stack incumbent
        - 100k+ customers; 75 sites in 7 countries; 500 MW Heartbeat VPP
        - Homeowners buying PV, storage, heat pump, charger, tariff, and control in one package
        - Combines local installer density with Heartbeat AI, Dynamic Pulse, and broad hardware scope
        - Public pages reveal less bundle price transparency than some peers; software economics are not fully disclosed
      - - Enpal
        - Direct full-stack installer rival
        - 0 € down; heat pump from €7,800; 19 ct/kWh marketed tariff; 80k+ equipped households via EIB note
        - German homeowners seeking financed or rented electrification bundle
        - Strong acquisition packaging, financing innovation, and integrated hardware plus software story
        - Distribution and pricing edge pressures 1KOMMA5° most directly at point of sale
      - - E.ON Home
        - Utility-led bundle
        - Solar plus storage and HEMS pages; V2G bonus up to €720/year; major trust and service awards
        - Households preferring incumbent utility brand and utility billing relationship
        - Brand trust, utility relationship, and growing flexibility offers without start-up risk
        - Reviewed public pages are quote-led and less explicit on integrated all-home pricing or VPP depth
      - - sonnen
        - Battery/community-led platform
        - Quarter-million product users claimed; 10-year battery guarantee; sonnenFlat and sonnenVPP
        - Battery-led households and partner-installed homes wanting community or grid services
        - Strong battery credibility, community narrative, and VPP-based switching frictions
        - Partner-led sales weaken direct control of customer acquisition and integrated hardware breadth
      - - Svea Solar + IKEA
        - Retail-backed installer and tariff offer
        - 55k+ customers claimed; dynamic tariff €6.99/month or €5.95 for IKEA members
        - Price-sensitive households attracted by IKEA distribution and integrated retail energy offer
        - Retail distribution plus installer execution and tariff packaging expands reach beyond pure solar buyers
        - Tariff economics are transparent, but broader software moat and VPP depth are less proven publicly
      - - Octopus Energy + Kraken
        - Retail and software-led flexibility rival
        - 1m+ German customers claimed; 2 GW and 500k devices on Kraken VPP; 90m+ global accounts on Kraken
        - Households prioritizing smart tariffs, heat pumps, EV charging, and recurring optimization
        - Best public software and utility-integration proof in the set; strong recurring-relationship threat
        - Less like-for-like on owned rooftop installer density than 1KOMMA5° or Enpal
      - - Zolar Installer Services
        - B2B installer software enabler and adverse benchmark
        - Exited end-customer business; ~120 installer businesses on software; customer support stopped in 2025
        - Local PV installers needing SaaS and workflow tools rather than a consumer brand
        - Shows software can still influence channel economics without owning the end customer
        - Insolvency and support shutdown sharply reduce near-term direct residential threat
      - - Local installers / internal build
        - Status-quo substitute
        - Pricing usually quote-based; no unified public software or tariff proof on reviewed set
        - Households assembling their own installer, tariff, battery, and control stack
        - Maximum vendor choice and potential local price competition
