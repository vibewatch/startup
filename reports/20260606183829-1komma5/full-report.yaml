        title: Capital formation, valuation signals, and stakeholder base
        blocks:
          - type: paragraph
            body: >-
              The financing record is unusually visible for a private European climate-tech company. Public sources
              support a €200 million Series A in 2022, a €215 million Series B or unicorn round in 2023 led by G2VP, a
              €150 million pre-IPO round in December 2024 led by a CalSTRS-led syndicate, and a July 2025 extension that
