              energy-platform ambition. Official pages define the core offer around fully electrifying a home with
              photovoltaics, batteries, heat pumps, EV charging, installation, maintenance, and the Heartbeat AI
              software layer. In that motion, the buyer, user, and payer are usually the same household decision-maker,
              but the monetization surface can extend beyond the initial hardware sale into a flat-fee software
              relationship and a dynamic tariff relationship. Dutch and Australian product pages reinforce that framing
              by marketing direct savings, app-based control, and ongoing monitoring to households rather than to
              utilities. The visible segment map does broaden at the edge: property owners, public-sector buyers,
              Australian council-led schemes, and existing third-party device owners appear in the record. But the
              company still discloses household counts far more clearly than revenue mix by geography, segment, or
              channel.
