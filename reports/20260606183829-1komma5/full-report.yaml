  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The decision chain runs from real scale and software promise through price opacity and policy risk to a
      research-more recommendation.
    data:
      nodes:
        - id: scale
          label: Scale proof
          type: input
          detail: €520M 2024 revenue, 120k+ customers, and 500 MW of managed flexibility show real operating scale.
        - id: software
          label: Software upside
          type: input
          detail: Heartbeat and VPP positioning offer real upside if recurring monetization becomes visible.
        - id: comps
          label: Public comp range
          type: process
          detail: Relevant public equity multiples span roughly 1.0x to 5.3x sales in June 2026.
        - id: opacity
          label: Pricing opacity
          type: process
          detail: No reviewed public source discloses the current priced valuation or preference stack.
        - id: risk
          label: Downside stack
          type: process
          detail: Europe remains soft in solar and heat pumps while policy design still matters for VPP economics.
        - id: decision
          label: 'Recommendation: research-more'
          type: output
          detail: Proceed only after price and software evidence close the current valuation gap.
        - id: upgrade
          label: Upgrade path
          type: output
          detail: A cleaner cap table plus verified software KPIs could move the call to track or buy.
      edges:
        - to: comps
          label: anchors
          from: scale
        - to: comps
          label: could lift
          from: software
        - to: opacity
          label: made uncertain by
          from: comps
        - to: risk
          label: amplifies
          from: opacity
        - to: decision
          label: pushes to caution
          from: risk
        - to: decision
          label: blocks buy call
          from: opacity
        - to: upgrade
          label: changes only if
          from: decision
    approximationNotes: >-
      This flow is an IC logic summary rather than a deterministic model; it shows the gating factors that must clear
      before valuation becomes investable.
