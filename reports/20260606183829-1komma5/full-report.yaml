  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Segment Structure
        blocks:
          - type: paragraph
            body: >-
              Germany's home electrification market spans five product categories that form a natural energy stack for
              the owner-occupied residential dwelling: rooftop solar PV systems (typically ≤30 kWp), co-located battery
              storage (5–15 kWh), heat pumps for space and water heating, EV wallboxes for home charging, and AI-driven
              home energy management software (HEMS) that orchestrates all assets against real-time electricity spot
              prices. Excluded from this market's scope are utility-scale projects above 30 kWp, ground-mounted parks,
              commercial and industrial installations, and public DC fast-charging infrastructure. Germany has
              approximately 16.2 million single- and two-family homes, making it Europe's largest addressable
              residential energy market by housing stock. The status-quo substitute is a grid-only household purchasing
              electricity at approximately €0.30–0.35/kWh while heating with a gas or oil boiler — a model increasingly
              undermined by energy-price volatility, the 2024 Building Energy Act (GEG), and regulatory preference for
              electrified heating and mobility. The five product categories reinforce one another: solar generates
              low-cost power, storage smooths self-consumption, heat pumps and wallboxes consume the surplus, and HEMS
              software monetises residual grid flexibility through virtual power plant (VPP) aggregation.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM021
              - CM025
