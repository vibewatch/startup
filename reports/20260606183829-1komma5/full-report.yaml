      - - Private pricing comes in far above public support
        - Fresh post-money implies a premium software multiple without KPI support
        - Price outruns current evidence quality.
        - Pause or reprice rather than stretch to clear the round.
      - - Software metrics stay opaque
        - No paid Heartbeat subscriber, attach, churn, ARPU, or software-margin bridge
        - Bull case remains narrative-only.
        - Keep recommendation at research-more or walk.
      - - European demand remains weak
        - Order intake or new installs fail to rebound across solar and heat pumps
        - Base case compresses toward installer-like multiples.
        - Shift toward bear-case valuation band.
      - - Policy blocks decentralized flexibility monetization
        - Smart-meter access, tariff access, or flexibility-market rules worsen
        - Heartbeat upside does not clear into realized economics.
        - Cut software-premium assumptions from the model.
      - - Capital structure is less clean than debt-free headline implies
        - Preferences, seniority, or working-capital needs erode common-equity upside
        - Equity value to new investors is lower than headline price suggests.
        - Demand stronger downside protection or decline the entry.
    notes: >-
      Every trigger is intended to be observable during diligence or in the next refresh cycle; none depend on
      management storytelling alone.
    claimRefs:
      - CV022
      - CV041
      - CV048
      - CV049
      - CV051
      - CV054
      - CV059
  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner-or-diligence path
    rows:
      - - Current valuation
        - Signed cap table, post-money, and share count for the 2024 round plus 2025 extension
        - Without the actual price there is no reliable entry discipline.
        - Request board-approved cap-table pack and latest financing documents.
      - - Preference stack
        - Liquidation preferences, ratchets, warrants, convertibles, and any senior instruments
        - Common-equity economics can differ sharply from headline valuation.
        - Request legal financing summary from counsel or CFO.
      - - Heartbeat economics
        - Paid subscribers, attach rate, churn, ARPU, and software gross margin
        - These metrics determine whether a premium software multiple is credible.
        - Request monthly KPI dashboard and cohort bridge.
      - - Cash efficiency
        - 2025 cash balance, working-capital swing, burn, and runway under expansion plans
        - Balance-sheet resilience drives downside protection and financing risk.
        - Request management accounts and cash-flow bridge.
      - - Revenue quality
        - Audited 2024 revenue, 2025 run-rate, and hardware-versus-software mix
        - The public record still carries a €520M versus €540M revenue discrepancy.
        - Request audited financials and revenue segmentation.
      - - Policy exposure
        - VPP monetization sensitivity to smart-meter rollout and German market-design rules
        - Policy and access determine whether Heartbeat economics can scale.
        - Request regulatory scenario model and market-access assumptions.
    notes: >-
      These asks are all capable of changing either the recommendation itself or the acceptable entry price; they are
      not generic housekeeping requests.
    claimRefs:
      - CV022
      - CV024
      - CV049
      - CV051
      - CV059
      - CV060
