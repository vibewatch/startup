      - number: '2.3'
        title: Buyer Segmentation and Adoption Dynamics
        blocks:
          - type: paragraph
            body: >-
              The dominant buyer profile in German residential home electrification is the owner-occupier of a
              single-family or detached two-family home who is simultaneously the buyer, user, and payer. Budget
              ownership rests entirely with the household; there is no third-party institutional procurement, making the
              market inherently fragmented and reliant on consumer trust and word-of-mouth. This owner-occupier segment
              is the primary target of 1KOMMA5°.

              A second, fast-growing segment is the urban apartment renter, who accesses the market through plug-in
              balcony solar systems (≤800 W inverter/2 kWp panel) following Solarpaket I's 2024 liberalisation. Balcony
              solar is high-volume but low revenue-per-unit (average ~€500–800 per system) and cannot host battery
              storage or heat pumps. The new-build homeowner is a third segment shaped by GEG compliance requirements,
              which mandate low-emission heating in new residential buildings, creating a pull for heat pumps and PV.
              The retrofit owner is the largest single-unit revenue opportunity, driven by both voluntary energy
              independence motives and approaching end-of-life for gas boilers (typical replacement cycle 15–20 years).

              Survey evidence indicates that without subsidies, only approximately 40% of German households would
              proceed with a solar installation, underscoring high subsidy dependency across the owner-occupier segment.
              The typical adoption path involves a 6–18 month consideration window, often triggered by a neighbour
              installation, energy-price shock, or targeted digital marketing — precisely the acquisition model 1KOMMA5°
              has scaled with its 80-location regional installer network.
            claimRefs:
              - CM019
              - CM020
              - CM022
