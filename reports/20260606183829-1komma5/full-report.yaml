  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Policy, legal, and consumer-protection exposure
        blocks:
          - type: paragraph
            body: >-
              Regulatory exposure is the most important external gating risk because 1KOMMA5°'s software layer needs
              three things to line up at once: legal availability of dynamic tariffs, physical rollout of smart meters,
              and policy designs that actually reward decentralized flexibility. German law is directionally
              supportive—suppliers must offer dynamic tariffs and smart meters are the backbone of controllable
              loads—but execution remains uneven. BNetzA's 2026 enforcement actions show that many operators still
              missed rollout quotas, which means the installed-base opportunity for Heartbeat and Dynamic Pulse can be
              delayed by actors 1KOMMA5° does not control. At the same time, the company's Brussels complaint against
              gas-peaker subsidies underlines a second policy risk: if capacity-market design favors centralized gas
              plants over technology-neutral flexibility, 1KOMMA5°'s VPP thesis loses part of its regulatory tailwind.
              Legal exposure is not limited to energy policy. Public privacy and dispute-resolution pages confirm GDPR
              transfer obligations, consumer-complaint deadlines, and mandatory arbitration routes, but they do not
              quantify actual complaint volumes or jurisdiction-by-jurisdiction compliance across all markets.
            claimRefs:
