- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer-or-process
  - role
  - dependency
  - risk
  rows:
  - - Regional installers / master craftsmen
    - Survey, size, install, commission, and maintain field systems
    - Local labor capacity and training
    - Service backlogs or inconsistent workmanship can break the full-stack promise
  - - Household devices
    - PV, batteries, heat pumps, wallboxes, AC, and app-visible controls create the controllable system
    - Device availability and supported brands
    - Compatibility breadth is still only partially public
  - - Smart meter + local control edge
    - Provides measurement, market access, and customer-site control path
    - Smart-meter rollout, gateway reliability, customer-site connectivity
    - No smart meter means much of Heartbeat value does not unlock
  - - Manufacturer and inverter integrations
    - Expose telemetry and command channels into third-party equipment
    - OEM willingness, firmware stability, API maintenance
    - A broken or absent integration can strand part of the installed base
  - - Heartbeat AI orchestration layer
    - Forecasts, optimizes, explains, and dispatches actions across the home
    - Training data, device telemetry, pricing feeds, algorithm performance
    - No public uptime or incident telemetry was found
  - - Google Cloud application and analytics stack
    - Cloud Run hosts applications; BigQuery handles large-scale device analytics and ML workflows
    - Google Cloud service availability and cost scaling
    - Third-party cloud dependency becomes operationally central as the fleet grows
  - - Dynamic Pulse and market interfaces
    - Connect day-ahead, intraday, and future ancillary-service value streams to the household stack
    - Regulatory rollout, balancing-market access, settlement logic
    - Roadmap monetization can be market-specific and uneven across countries
  notes: This table separates field operations, control edge, cloud, and market layers because 1KOMMA5’s moat depends on coordinating all of them at once.
