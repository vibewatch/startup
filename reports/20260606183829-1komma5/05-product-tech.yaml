chapter:
  number: 5
  title: Product & Technology
  summary: >-
    1KOMMA5° delivers a bundled home-electrification stack—solar, batteries, heat pumps, EV charging, dynamic tariffing, and the Heartbeat AI control layer—through local installer operations rather than software alone. Official sources support genuine technical depth in Berlin test-lab validation, Google Cloud/BigQuery-backed scaling, manufacturer-agnostic control ambitions, and smart-meter-dependent market integration. The product is differentiated, but public proof remains incomplete on security posture, uptime telemetry, and full compatibility coverage, while review platforms show that support quality is uneven once systems are live.
sections:
- id: integrated-offer-and-field-delivery-model
  title: Integrated offer and field-delivery model
  body: >-
    1KOMMA5° is best understood as a hybrid of installer, local service operator, and household energy software platform. Public company pages, recruiting copy, and external coverage consistently describe a one-stop shop spanning photovoltaics, batteries, heat pumps, EV charging, and intelligent energy management rather than a single hero device. The delivery promise is explicitly workflow-based: local master craftsmen or certified installers handle consultation, sizing, installation, commissioning, and maintenance, while smart-meter installation is bundled into the German solar and heat-pump offers so the customer can later use Heartbeat AI and Dynamic Pulse. That matters because the product definition is not just hardware in a box; it is a configured home-energy system plus software control. The product surface is also broader than a typical German PV installer. Heat-pump scale, storage-only PowerHarvester retrofits, and Australian hot-water and air-conditioning pages all show the company
    extending the same operating model into adjacent electrification jobs. The result is a stickier but more execution-dependent offer: if field operations work well, 1KOMMA5 has more control of customer experience than a software-only VPP player; if installation and after-sales support slip, the same integrated model becomes a bottleneck.
  claimRefs:
