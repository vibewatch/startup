callouts:
- calloutType: strength
  title: The moat is the combination, not any single device
  body: >-
    1KOMMA5’s strongest product-tech advantage is combining local installation control with a grid-interactive software layer. Berlin lab testing, Heartbeat AI ring-fencing, and disclosed cloud tooling make the story materially stronger than a simple installer upsell.
  claimRefs:
  - CE002
  - CE003
  - CE007
  - CE032
- calloutType: risk
  title: Support and transparency are weaker than the architecture story
  body: >-
    Public review evidence shows that after-sales communication and warranty handling can lag the sophistication of the product stack. At the same time, no reviewed source provided software-style uptime or security telemetry for Heartbeat AI.
  claimRefs:
  - CE041
  - CE042
  - CE043
- calloutType: insight
  title: Heartbeat turns an installer into an operating system vendor
