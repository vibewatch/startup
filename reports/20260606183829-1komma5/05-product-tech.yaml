  evidenceGaps:
  - type: missing-source
    severity: material
    topic: software security telemetry
    missingEvidence: A public status page, uptime history, incident log, or external software-security certification for Heartbeat AI.
    whyItMatters: Heartbeat controls grid-interactive household assets and tariff behavior, so software trust matters as much as hardware quality.
    diligencePath: Request the security pack, recent incident/postmortem history, and any external audit or certification materials for Heartbeat AI.
    relatedQuestionRefs:
    - QE020
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: compatibility matrix
    missingEvidence: A brand-by-model compatibility matrix and country-by-country device coverage list for batteries, heat pumps, wallboxes, EVs, and inverters.
    whyItMatters: Coverage percentages and selected vendor examples do not tell diligence teams how much of the installed base can really onboard without custom work.
    diligencePath: Request the live compatibility matrix, integration backlog, and onboarding failure rates by device family and country.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE001
  - type: private-evidence-only
    severity: material
    topic: grid-services maturity
    missingEvidence: Market-by-market evidence for live intraday dispatch volumes, ancillary-service eligibility, and retained versus customer economics.
    whyItMatters: Grid-service upside is a core part of the differentiation story, but public disclosures focus on milestones more than recurring economics.
    diligencePath: Request Scandinavia and Sweden qualification documents, realized dispatch volumes, and customer/company revenue splits by service type.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: support reliability metrics
    missingEvidence: Official install SLA, first-time-fix rate, warranty response time, and complaint-rate data by market.
    whyItMatters: Public review sources show both excellent installs and serious after-sales problems, so service quality cannot be underwritten from anecdotes alone.
    diligencePath: Request service KPI dashboards by market and cohort, including escalation-response times and rework rates.
    relatedQuestionRefs:
    - QE018
    - QE019
    relatedTableRefs:
    - TE004
