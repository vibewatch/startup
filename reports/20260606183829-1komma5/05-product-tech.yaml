- id: heartbeat-architecture-and-control-plane
  title: Heartbeat architecture and control plane
  body: >-
    Heartbeat AI is the real differentiator, and the reviewed sources make clear that the operating model is more sophisticated than a standard installer CRM plus tariff upsell. Heartbeat is described as the software layer that coordinates device telemetry, forecasts, household behavior, and power-market signals to decide when to charge batteries, preheat hot water, delay EV charging, or buy and later sell electricity. Berlin TechLab material says weather, device, consumption, and price forecasts are used to train and refine the system, while the Google Cloud article says 1KOMMA5 uses Cloud Run for scalable application deployment and BigQuery for large-scale device-data analysis and machine-learning workloads. The November 2024 spinout release also shows the practical plumbing behind the marketing language: manufacturer integrations, energy-market interfaces, local IoT gateways, smart meters, and billable circuit management are all explicit dependencies. That architecture is why 1KOMMA5
    can plausibly claim more than a normal installer moat—but it is also why the company depends heavily on cloud scalability, hardware interface breadth, and smart-meter rollout. Public documentation proves the direction of travel, but not yet a software-company level of transparency on APIs, uptime, or security controls.
