- id: TE002
  title: Workflow / use-case table
  columns:
  - user-job
  - current-workflow
  - company-solution
  - measurable-benefit
  - limitation
  rows:
  - - Electrify a detached home end-to-end
    - Quote multiple trades separately and coordinate installers manually
    - 1KOMMA5 bundles planning, installation, smart meter, and Heartbeat-ready devices through local teams
    - Single-point delivery model and broader device coordination
    - Execution quality is only as good as local installation and after-sales operations
  - - Retrofit an existing solar or battery system into a VPP
    - Run devices passively or manage them via separate vendor apps
    - Heartbeat box plus Dynamic Pulse adds optimization without replacing every asset
    - Company says existing systems can save up to 50% on power costs
    - Requires smart meter, supported hardware, and tariff enrollment
  - - Lower heat-pump operating costs
    - Heat when needed regardless of price or PV surplus
    - Heartbeat shifts operation toward cheap solar or market power and uses storage when helpful
    - Company claims up to 70% lower heating cost versus old gas systems in a typical single-family home
    - Public proof is marketing-led; no audited customer cohort study was found
  - - Charge an EV cheaply at home
    - Charge immediately at whatever grid price is current
    - Smart wallbox uses PV surplus, weather, price, and routine forecasts to schedule charging
    - Lower charging cost and lower grid stress through load shifting
    - Needs smart meter and compatible charger/control setup
  - - Use storage without rooftop solar
    - Remain exposed to retail prices without arbitrage capability
    - PowerHarvester pairs storage, smart meter, Dynamic Pulse, and Heartbeat AI without PV
    - Access to market-linked charging and storage from day-ahead price signals
    - Launch compatibility is narrower than the broad interoperability narrative
  notes: Benefits reflect reviewed company claims or review-site anecdotes; they are not audited customer-outcome studies.
