- id: differentiation-maturity-and-verdict
  title: Differentiation, maturity, and verdict
  body: >-
    The strongest product-tech case for 1KOMMA5 is the combination of local execution with a genuine grid-interactive software layer. Ordinary installers can sell PV, batteries, or heat pumps; utilities can sell tariffs; software vendors can promise optimization. 1KOMMA5’s evidence points to a company trying to own all three layers at once: local planning and commissioning, hardware and retrofit distribution, and a Heartbeat control plane that plugs into the electricity market. The Berlin TechLab, Heartbeat AI GmbH ring-fencing, Google Cloud stack, and grid-service roadmap all reinforce that this is not just marketing copy. The same evidence, though, exposes the remaining diligence gaps. Public compatibility proof is still high-level, public software-grade uptime or audit evidence is absent, and external reviews show the after-sales experience can lag the product ambition. The product appears mature enough to be differentiated and commercially relevant, but the trust case still relies more
    on company assertions and review-platform anecdotes than on public operational telemetry. The diligence verdict is therefore positive on architecture and breadth, qualified on reliability and transparency.
  claimRefs:
  - CE016
  - CE032
  - CE036
  - CE038
  - CE039
  - CE040
