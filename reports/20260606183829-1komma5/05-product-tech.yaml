- id: deployment-interoperability-and-support-quality
  title: Deployment, interoperability, and support quality
  body: >-
    The field evidence shows both real product maturity and real operational risk. On the maturity side, 1KOMMA5 has public proof of scale: more than 300,000 controllable systems installed worldwide, more than 10,000 heat pumps sold in Germany over two years, 500 MW of flexibility by May 2025, and 1 GW by May 2026. Official materials also give tangible signs of interoperability work, from Stiebel Eltron and Daikin heat-pump testing in Berlin to the KOSTAL inverter rollout for over 200,000 existing systems and the explicit compatibility of PowerHarvester with the company’s own storage and Enphase 5P at launch. The trust layer is more mixed. The company exposes intake flows for smart-meter rejection, connectivity problems, and damaged hardware, and its Australian business advertises a support centre, fast support, a 90-day health check, and a 30-year workmanship guarantee. But review platforms describe repeated communication delays, warranty follow-up failures, and cases where app behavior
    or system-management quality disappointed customers even after successful installations. That means underwriting should not treat deployment scale as the same thing as service reliability.
