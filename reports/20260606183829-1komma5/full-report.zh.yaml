      - number: '7.4'
        title: 合作伙伴、资本和人员依赖
        blocks:
          - type: paragraph
            body: >-
              合作伙伴和组织依赖意味着，1KOMMA5° 押注的不只是产品市场匹配，而是协调能力。Google Cloud 案例研究说得很清楚，Heartbeat、分析和跨站点整合都跑在集中的云与数据栈上；1KOMMA5°
              自己的材料也强调对设备制造商、市场接口、电表和本地安装商的依赖。收购模式能加速扩张，但也在 72 到 80 个网点、约 2,400 到 2,500 名员工之间制造整合风险。公开沟通也高度围绕领导层：CEO、CTO
              和 CPO 主导了监管、产品和平台公告中的引用记录，公开团队页面除了招聘文案之外，几乎没有披露更深的高管梯队。短期资本风险低于许多同业，因为公司称自己无债，并已融资约 €400 million
              股权资金。但资产负债表强并不消除融资风险：超过 €100 million 被指定用于软件扩张，这一轮明确是 Pre-IPO，Heartbeat 仍必须证明货币化可以规模化，然后才能假设其拥有公开市场选择权。
