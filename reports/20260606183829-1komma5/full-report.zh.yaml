      - number: '8.4'
        title: 尽调问题和投资逻辑击穿触发器
        blocks:
          - type: paragraph
            body: >-
              剩余尽调不是装饰项；它们正好决定当前故事配得上溢价，还是只能拿到类似安装商的合理倍数。第一，必须核验股权结构表和当前投后估值，因为公开来源停在独角兽底线，没有披露价格或优先权。第二，软件经济性需要从叙事变成证据：付费
              Heartbeat 订户、对现有装机底盘的附加率、流失率、ARPU、毛利率，以及从 VPP
              活动到公司留存收入的桥。第三，投委会（IC）应压力测试公开来源中已经出现的下行情景：欧洲住宅需求持续疲弱、政策规则削弱分布式灵活性、融资结构让股权看起来比实际更便宜。如果这些领域无法过关，投资逻辑击穿，不是因为公司缺乏质量，而是因为价格会要求投资者在缺少足够保护或证据的情况下为可选性买单。
