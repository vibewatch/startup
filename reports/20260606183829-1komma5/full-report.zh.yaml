      - number: '8.2'
        title: 投资逻辑、反向逻辑和建议
        blocks:
          - type: paragraph
            body: >-
              投资逻辑不是凭空想象。公开来源支持真实运营规模、大额融资底盘，以及比普通安装商叙事更具体的软件雄心。Heartbeat 已经控制超过 500 MW，公司称核心硬件业务盈利，管理层继续把超过 €100
              million 投入软件。这些都是一家公司从硬件重的家庭电气化，升级为更高倍数控制层所需的原料。反向逻辑在于，公开记录读起来仍像一个转型故事，而不是已经完成的证明。欧洲太阳能和热泵仍偏弱，VPP
              经济性仍受政策设计影响，市场也不知道当前定价轮或已实现的 Heartbeat ARR。上市可比公司也提醒不要过度美化这个品类：Sunrun 显示融资结构会拖累股权，SolarEdge
              则显示，即便规模化玩家也可能长期承受需求冲击和亏损。两边权衡后，建议应谨慎：继续研究，置信度中等、风险高；只有价格和软件证据填上当前缺口，公司才可能支撑更强的判断。
