      - - 将既有太阳能或电池系统改造成 VPP
        - 被动运行设备，或通过不同供应商 app 管理
        - Heartbeat box 加 Dynamic Pulse 可在不替换所有资产的情况下加入优化
        - 公司称既有系统电费最高可节省 50%
        - 需要智能电表、受支持硬件和电价注册
      - - 降低热泵运行成本
        - 按需供热，不管价格或 PV 余电
        - Heartbeat 将运行转向低价太阳能或市场电力，并在有帮助时调用储能
        - 公司称，在典型独户住宅中，供暖成本较老式燃气系统最高降低 70%
        - 公开证据以营销为主；未找到经审计客户队列研究
      - - 在家低价给 EV 充电
        - 按当前电网价格立即充电
        - 智能壁挂充电盒利用 PV 余电、天气、价格和日常习惯预测来安排充电
        - 通过负荷转移降低充电成本和电网压力
        - 需要智能电表和兼容的充电器 / 控制配置
      - - 不装屋顶太阳能也使用储能
        - 无法套利，只能承受零售电价
        - PowerHarvester 在无 PV 情况下组合储能、智能电表、Dynamic Pulse 和 Heartbeat AI
        - 接入基于日前价格信号的市场联动充电和储能
        - 发布初期兼容性窄于广泛互操作叙事
    notes: 收益来自已审阅公司主张或评论网站案例；它们不是经审计客户结果研究。
