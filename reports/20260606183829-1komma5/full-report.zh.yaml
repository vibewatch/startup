      - number: '3.4'
        title: 切换成本、渠道风险与替代
        blocks:
          - type: paragraph
            body: >-
              面向买方的锁定效应是中等，不是绝对。家庭一旦选择了能协调安装商接入、电价注册、设备设置和 app
              层控制的平台，切换确实有摩擦，因为软件、支持和激励层都叠在寿命很长的实物资产之上。区域安装商网络会让粘性更强，因为服务质量、补贴文件和调试仍依赖人工执行。这更有利于 1KOMMA5°、Enpal、sonnen 和
              Octopus，而不是纯线索撮合平台。


              但反向证据同样重要。Zolar 重组以及终端客户支持转向 Otovo
              表明，当安装商平台失去财务韧性时，服务连续性是现实风险。整个市场很多公开定价仍然零散，买方多家并行沟通和替换讨论仍有空间。传统公司或零售品牌也仍能用信任和电价接入配合伙伴分销，替代安装商主导的专业公司，即便它们并不拥有
              1KOMMA5° 式 M&A 机器。通过本地专业商自行拼装方案的现状替代也仍可行，虽然它大概率把协调、保修和优化负担推回家庭。综合这些力量，1KOMMA5°
              有一条有意义但有保质期的护城河：强本地存在叠加软件，比单纯硬件更难复制；但还不足以让公司忽视能捕获经常性关系的公用事业公司、零售商或灵活性平台。
