  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 决策链从真实规模和软件想象空间出发，经由价格不透明和政策风险，落到“继续研究”的建议。
    data:
      nodes:
        - id: scale
          label: 规模验证
          type: input
          detail: 2024 年营收 €520M、客户数 120k+、受管灵活性资源达 500 MW，说明公司确有运营规模。
        - id: software
          label: 软件上行空间
          type: input
          detail: 如果经常性变现变得可见，Heartbeat 和 VPP 定位会带来真实上行空间。
        - id: comps
          label: 上市可比区间
          type: process
          detail: 2026 年 6 月，可比上市公司销售额倍数约落在 1.0x–5.3x。
        - id: opacity
          label: 定价不透明
          type: process
          detail: 已审阅的公开来源没有披露当前定价估值或优先权结构。
        - id: risk
          label: 下行因素
          type: process
          detail: 欧洲光伏和热泵需求仍弱，政策设计仍会左右 VPP 经济性。
        - id: decision
          label: 建议：继续研究
          type: output
          detail: 只有价格和软件证据填平当前估值缺口，才应继续推进。
        - id: upgrade
          label: 上调路径
          type: output
          detail: 更干净的股权结构，加上经验证的软件 KPI，可能把结论推到跟踪或买入。
      edges:
        - to: comps
          label: 锚定
          from: scale
        - to: comps
          label: 可能抬升
          from: software
        - to: opacity
          label: 使其不确定
          from: comps
        - to: risk
          label: 放大
          from: opacity
        - to: decision
          label: 推向谨慎
          from: risk
        - to: decision
          label: 阻断买入
          from: opacity
        - to: upgrade
          label: 达标才改变
          from: decision
    approximationNotes: 流程本身是 IC 逻辑摘要，不是确定性模型；估值进入可投区间前，几道门槛必须先清掉。
    claimRefs:
