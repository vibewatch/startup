  - id: TV005
    title: 投资逻辑失效与否决触发表
    columns:
      - 触发因素
      - 阈值或事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 私募定价远高于公开市场支撑
        - 新一轮投后估值隐含软件溢价倍数，但缺少 KPI 支撑
        - 价格跑在当前证据质量前面。
        - 暂停或重定价，不要硬拉估值去跟这一轮。
      - - 软件指标持续不透明
        - 没有付费 Heartbeat 订阅用户、附着率、流失率、ARPU 或软件利润率桥接
        - 乐观情景仍只停留在叙事。
        - 维持“继续研究”建议，或直接退出。
      - - 欧洲需求持续疲弱
        - 太阳能和热泵订单获取或新增安装未能反弹
        - 基准情景估值向安装商倍数压缩。
        - 转向悲观情景估值区间。
      - - 政策卡住分布式灵活性变现
        - 智能电表接入、资费接入或灵活性市场规则恶化
        - Heartbeat 上行空间无法兑现成实际经济收益。
        - 从模型中砍掉软件溢价假设。
      - - 资本结构没有“零债务”标题暗示得那么干净
        - 优先权、优先级或营运资本需求侵蚀普通股上行
        - 新投资者拿到的股权价值低于标题价格暗示。
        - 要求更强下行保护，或放弃入局。
    notes: 每个触发因素都应能在尽调中或下一次刷新周期观察到；没有一个只依赖管理层叙事。
