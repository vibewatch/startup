      - number: '1.3'
        title: 资本形成、估值信号与利益方基础
        blocks:
          - type: paragraph
            body: >-
              对一家欧洲私营气候科技公司来说，1KOMMA5° 的融资记录异常可见。公开来源支撑 2022 年 €200 million Series A、2023 年由 G2VP 领投的 €215 million
              Series B / 独角兽轮、December 2024 由 CalSTRS 牵头财团领投的 €150 million pre-IPO 轮，以及 July 2025 新增 Sabanci Climate
              Ventures 的延伸轮。到 mid-2025，官方和独立材料都收敛到约 €400 million 股权融资。


              不够清楚的是价格。审阅的 2025 材料仍把 1KOMMA5° 描述为估值超过 €1 billion 的独角兽，但没有公布延伸轮的新定价估值。公司清楚释放资本市场野心：December 2024
              轮融资被官方表述为迈向资本市场的又一步，第三方报道则附上了暂定 2026 IPO 目标。


              因此，利益方透明度在“谁进入财团”上最强，在“每个投资人控制什么”上最弱。公开材料提到 G2VP、CalSTRS、Sabanci、Porsche
              Ventures、b2venture、Eurazeo、eCapital、Haniel、Schürfeld 家族、Jan Klatten
              等，但没有给出当前股权结构拆分或优先股堆叠。这个缺口很重要，因为公司规模已经足够大，估值、稀释和治理条款都可能实质性改变投资判断。
