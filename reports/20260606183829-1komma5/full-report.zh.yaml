        title: 收入模式、定价与已披露收入结构
        blocks:
          - type: paragraph
            body: >
              1KOMMA5° 已经不再只是一个安装商故事。公开证据显示，它采用混合模式：一体化家庭电气化项目仍贡献大部分已披露规模，而 Heartbeat AI
