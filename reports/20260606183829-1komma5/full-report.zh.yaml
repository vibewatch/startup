      - number: '1.2'
        title: 创始人、管理层与治理透明度
        blocks:
          - type: paragraph
            body: >-
              公开管理层阵容比公开治理架构更清晰。官方稿件持续确认 Philipp Schröder 为联合创始人兼 CEO，Micha Grüber 为 CFO 兼联合创始人，Barbara Wittenberg 为
