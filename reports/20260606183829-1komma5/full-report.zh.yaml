      - number: '2.5'
        title: 市场逆风与 1KOMMA5° 的竞争适配
        blocks:
          - type: paragraph
            body: >-
              德国住宅太阳能市场在 2024–2026 进入实质调整。多家安装商和 PV 系统供应商在 late 2024 破产或大幅重组，包括 Zolar（裁员 >50%）、ESS
              Kempfle（破产）、Wegatech（破产）和 Solarmax（临时破产管理）。调整的驱动因素是结构性正常化——电价从 2022
              能源危机高点回落、利率上升推高系统融资成本、中国组件竞争压缩利润率——而不是基本需求崩塌。整个 EU 的住宅太阳能在 2024 下降约 5 GW。市场调整延续到 2026，Q1 2026 住宅安装量较上年低
              21%。

              在这个背景下，1KOMMA5° 表现出高于市场的韧性：2023 到 2024 年，有机收入增长 36%（€360M 至 €490M），2024 总收入约 €520M，同比增长
              15.5%。管理层把这种超额表现归因于垂直整合模式——同时掌握安装和经常性 Heartbeat AI 软件费——从而让毛利率更能抵御硬件价格崩塌。

              Heartbeat AI 平台不绑定硬件，因此可覆盖住宅电池储能约 20 GWh 的已安装基础（end-2025），而不只限于 1KOMMA5° 自装系统。运营欧洲最大的住宅 VPP，连接灵活性达到
              500–600 MW，也把可服务市场扩展到电网辅助服务、频率调节和电力交易——这些市场 1KOMMA5° 已在 Sweden 进入。
            claimRefs:
              - CM037
              - CM038
              - CM041
              - CM042
              - CM043
              - CM044
              - CM045
              - CM048
      - number: '2.6'
        title: 展项
        blocks:
          - type: callout
            title: 监管悬崖风险：拟议 2027 EEG 改革
            body: >-
              德国 Renewable Energy Sources Act 的修订草案提议，自 2027 起取消新建最高 25 kW PV 系统的上网补偿。若按草案落地，将移除约 60%
              自住业主买方的主要财务锚（调查显示无补贴时只有约 40% 会推进）。BSW-Solar
              已警告，该提案会拖慢扩张，并危及数以万计岗位。对需求高度依赖补贴、软件或经常性收入较低的安装商，这个风险不对称。1KOMMA5° 的经常性 HEMS / VPP
              收入和多市场足迹提供部分缓冲，但不能消除德国住宅太阳能硬调整的暴露。
            calloutType: risk
            claimRefs:
              - CM035
              - CM036
              - CM024
              - CM040
          - type: callout
            title: 1KOMMA5° 可能受益于市场调整
            body: >-
              反直觉的是，2024–2026 住宅太阳能调整可能强化 1KOMMA5° 的竞争位置。2022–2023
              繁荣期形成的市场碎片化——数百家资本不足的安装商只拼硬件价格——正在通过破产和重组出清。垂直整合运营商若有经常性软件收入（Heartbeat AI
              固定费）、自有采购规模和多市场分散，更有希望穿过整合周期。2024 年，同行破产时 1KOMMA5° 有机收入增长 36%，这个分化验证了全栈模式的利润率韧性。
            calloutType: insight
