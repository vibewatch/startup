        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >
              公开 GTM 证据指向混合打法：硬件依靠本地实体分销，软件扩展到现有第三方系统，并开始进入更大的物业业主账户。1KOMMA5° 以一站式商店运营，覆盖本地咨询、规划、安装和维护；在达到 100,000
              名客户里程碑时，公司公开提到 7 个国家 75 个网点。到 July 2025，它服务超过 120,000 名客户；到 October 2025，公司报告单月新增订单约 €105
              million，其中包括物业业主和一家丹麦铁路公司的大额订单。公司不披露 CAC、回本周期或销售周期长度，因此订单流是目前可用的最佳公开销售效率代理指标。更重要的前瞻 GTM
              信号不是纯粹体量，而是战略变化：Heartbeat AI 正向数百万套现有第三方系统开放，并被包装成订阅式能源服务，不要求每一块电池或每一台热泵都由 1KOMMA5°
              自己安装。若转化成本保持较低，相比纯硬件牵引增长，软件销售效率应明显改善；若智能电表铺设、集成或支持运营卡住，扩张动作会很快放慢。
