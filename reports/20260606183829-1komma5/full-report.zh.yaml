      - number: '2.4'
        title: 增长驱动、监管背景与政策时间线
        blocks:
          - type: paragraph
            body: >-
              德国住宅电气化市场受一套罕见密集的联邦激励和监管约束驱动；这既是主要增长引擎，也是最大不确定性来源。EEG 2023 上网电价目前支付 8.11 ct/kWh（部分外送，≤10 kWp）或 12.87
              ct/kWh（全量外送），自登记起锁定 20 年，是家庭投资测算的强经济锚。KfW 442 电池补贴最高 €3,200 / 套，PV 硬件和安装自 2023 起适用 0% VAT，进一步缩短回本周期。

              简单上网套利之外，三条结构性顺风正在重塑价值主张。第一，Solar Peak Act（February 2025）要求所有新 PV 系统接入智能储能，直接推高电池 + HEMS 套餐需求。第二，动态电价在
              2025 成为德国所有电力供应商的强制要求，使 PV + 储能业主可通过现货价格优化每年额外节省 €50–288。第三，能源共享监管将从 June 2026 生效，打开本地集体可再生能源使用和新 VPP
              商业模式。年度 redispatch 成本超过 €4 billion，推高电网费，也缩短商业和住宅表后系统的回本周期。

              拟议 2027 EEG 改革带来最重要的下行风险：若按草案通过，25 kW 以下系统将取消上网补偿，移除新增住宅 PV 的关键投资锚。BSW-Solar 已警告，这会拖慢扩张，并危及数以万计岗位。
