companyProfile:
  summary: >-
    1KOMMA5° 是一家创立于 Hamburg 的私营清洁科技公司，面向住宅客户销售全屋电气化系统，把本地咨询、安装和服务，与名为 Heartbeat AI 的软件层结合起来。产品覆盖光伏、户用电池、热泵、EV
    充电硬件和动态电力优化。它的战略目标是从硬件占比重的安装商网络，转向更大范围的软件驱动能源平台：由 Heartbeat 优化需求、套利现货市场波动，并把分布式住宅灵活性聚合成虚拟电厂。公开来源支撑其 2024 收入约 €520
    million、客户超过 120,000、员工约 2,500、累计股权融资约 €400 million；但公司仍为私营，关键软件经济性指标尚未披露。
