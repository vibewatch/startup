  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 客户旅程始于屋主改造销售，但正越来越多延伸到软件激活、电价管理和交叉销售。
    data:
      items:
        - label: 需求识别
          detail: 家庭的起点通常是高电费、电气化目标，或希望用一个方案打包太阳能、储能、供暖和 EV 充电。
          touchpoints:
            - 电费压力
            - 电气化规划
            - 家庭改造搜索
        - label: 报价和系统设计
          detail: 1KOMMA5° 靠本地团队和安装商，把咨询、规划、融资安排和一套集成硬件栈卖给客户。
          touchpoints:
            - 销售咨询
            - 系统设计
            - 安装商或地方议会牵头方案
        - label: 安装和调试
          detail: 区域工匠或承包商安装硬件，并把家庭接入应用和监控界面。
          touchpoints:
            - 光伏 / 电池 / 热泵安装
            - 调试
            - 质保开始
        - label: Heartbeat 激活
          detail: 客户接入设备、电价和自动化规则后，软件才能优化充电、上网馈电和批发市场参与。
          touchpoints:
            - Heartbeat 应用
            - 动态电价或 Amber 链接
            - 接入 / 排障
        - label: 运行并省钱
          detail: 价值主张从一次性硬件经济性，转向持续优化、监控和服务。
          touchpoints:
            - 电池自动化
            - 用量可视化
            - 支持和更新
        - label: 扩展或续约
          detail: 满意的家庭可以增加更多设备或电价方案；更大的业主和机构则能把模式扩到资产组合。
          touchpoints:
            - 电池或热泵增购
            - Dynamic Pulse 续约
            - 业主扩张
