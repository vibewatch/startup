  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 政策、法律和消费者保护敞口
        blocks:
          - type: paragraph
            body: >-
              监管敞口是最重要的外部闸门风险，因为 1KOMMA5°
              的软件层需要三件事同时对齐：动态电价合法可用、智能电表实际铺开、政策设计真正奖励分布式灵活性。德国法律方向上支持——供应商必须提供动态电价，智能电表也是可控负荷的骨架——但执行仍不均衡。BNetzA 2026
              年的执法行动显示，许多运营商仍未达到铺设配额，也就是说 Heartbeat 和 Dynamic Pulse 面向装机底盘的机会，可能被 1KOMMA5°
              无法控制的主体拖后。同时，公司在布鲁塞尔针对燃气调峰电厂补贴提出投诉，凸显了第二层政策风险：如果容量市场设计偏向集中式燃气电厂，而不是技术中立的灵活性，1KOMMA5° 的 VPP
              逻辑会失去一部分监管顺风。法律敞口也不限于能源政策。公开隐私和争议解决页面确认了 GDPR 转移义务、消费者投诉时限和强制仲裁路径，但没有量化实际投诉量，也没有逐司法辖区披露所有市场的合规情况。
