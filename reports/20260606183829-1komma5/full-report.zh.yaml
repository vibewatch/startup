      - number: '6.4'
        title: 留存、渠道依赖和集中度风险
        blocks:
          - type: paragraph
            body: >-
              持久性叙事更像结构判断，而不是已披露事实。1KOMMA5° 明确想建立长期家庭关系：官方材料反复说明，Heartbeat AI
              采用固定软件费销售，动态电价叠加在已安装硬件之上，客户会继续用应用做监控、更新和持续优化。评论证据也显示复购或交叉销售行为，一些家庭在早期购买太阳能后，又加装电池、热泵，并签动态电价合约。但已审阅的公开来源都没有披露净留存率（NRR）、总留存率（GRR）、流失率、合同期限、续约率或头部客户集中度。这个缺口更关键，因为交付依赖合作伙伴和运营基础设施。Google
              Cloud 被放在扩展 Heartbeat、整合并购的关键位置；澳大利亚 Heartbeat 方案又依赖 Amber Electric
              和本地电网条件，才能从批发电力市场获取价值。同时，独立评论面持续指向同一个弱点：售后支持、调试延误、安装商交接和保修跟进会侵蚀复用逻辑，即便底层硬件或软件价值主张看起来很强。
