      - number: '3.3'
        title: 软件、灵活性与经常性经济性的竞争
        blocks:
          - type: paragraph
            body: >-
              最重要但不那么显眼的竞争者，并不是另一家屋顶安装商，而是试图在硬件安装后掌握设备编排和电价经济性的那一组公司。1KOMMA5° 主张 Heartbeat AI 已具备住宅 VPP 规模，拥有 500 MW 和约
              50,000 套联网系统；其软件能把家庭电费压到更低，并通过固定软件费把灵活性变现。sonnen 围绕 sonnenFlat 和 sonnenVPP
              提出规模更小但概念相近的主张：把分布式电池池化，共享太阳能并支撑电网。Octopus 和 Kraken 则把模式进一步推向软件和零售经济性：Octopus Germany 销售面向
              EV、电池和热泵的智能电价，Kraken 则声称在住宅灵活性中拥有 2 GW 和超过 500,000 台联网设备。


              这给 1KOMMA5° 带来双线压力。Enpal 这类安装商同行挤压硬件销售，但如果公用事业公司和零售商成为电价、调度和优化关系的默认拥有者，Kraken
              这类平台会威胁长期价值池。公开记录仍让单位经济性不透明，因此现在断言某一层软件占主导还太早。即便如此，证据已经显示，经常性价值捕获可以从最先卖出屋顶系统的一方迁移出去。也就是说，1KOMMA5°
              的软件差异化是真实的，但它面对的对手可能安装足迹更弱，电价和公用事业整合却更强。
