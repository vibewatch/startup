      - number: '7.5'
        title: 缓释措施、监测项和决策阈值
        blocks:
          - type: paragraph
            body: >-
              缓释逻辑可信，但还不完整。1KOMMA5° 确实有真实防线：监管参与、可见的法律和隐私页面、相当大的资本底盘、有意义的已安装系统足迹，以及已经跑到有用规模的软件平台。Google Cloud 和
              Heartbeat 材料也显示，管理层在主动搭建吸收并购和新设备集成所需的基础设施，而不是从零临时拼装。尽管如此，剩余风险仍高，因为决定性的证据点要么是私有的，要么只披露了一部分。投资者需要硬运营指标——安装商
              SLA 遵守率、投诉和退款率、OEM 或 API
              断裂频率、附加率和流失数据、实际节省分布、组织纵深证据——才能判断这家公司能否安全地从高速增长的安装网络，升级为持久的能源软件平台。因此，本章的决策阈值聚焦可衡量信号：铺设进度、监管结果、服务质量、客户 ROI
              兑现，以及融资需求是否仍是主动选择，而不是被动补血。
