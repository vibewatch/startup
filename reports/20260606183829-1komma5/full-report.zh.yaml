        blocks:
          - type: paragraph
            body: >-
              1KOMMA5° 更像安装商、本地服务运营商和家庭能源软件平台的混合体。公司公开页面、招聘文案和外部报道一致描述的是一站式商店，覆盖光伏、电池、热泵、EV
              充电和智能能源管理，而不是单一明星设备。交付承诺明确围绕流程展开：本地工匠或认证安装商负责咨询、尺寸测算、安装、调试和维护；德国太阳能和热泵方案会把智能电表安装一起打包，让客户后续可以使用 Heartbeat
              AI 和 Dynamic Pulse。这个点很重要，因为产品定义不是盒子里的硬件，而是一套配置好的家庭能源系统加软件控制。产品边界也比典型德国 PV 安装商更宽。热泵规模、纯储能 PowerHarvester
              改造，以及澳大利亚热水和空调页面，都显示公司把同一运营模式延伸到邻近电气化任务。结果是一种粘性更高、但更依赖执行的方案：若现场运营顺利，1KOMMA5 比纯软件 VPP
