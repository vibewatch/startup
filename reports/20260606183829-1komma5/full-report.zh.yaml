        - 公开页面的捆绑价格透明度低于部分同行；软件经济性披露不完整
      - - Enpal
        - 直接竞争的全栈安装商
        - 0 € 首付；热泵 €7,800 起；营销电价 19 ct/kWh；EIB 说明提到 80k+ 已装备家庭
        - 寻找融资或租赁式电气化套装的德国房主
        - 获客包装强、融资创新突出，硬件加软件叙事完整
        - 渠道和定价优势在销售端最直接挤压 1KOMMA5°
      - - E.ON Home
        - 公用事业公司主导的套装
        - 光伏加储能和 HEMS 页面；V2G 奖励最高 €720/年；大型信任和服务奖项
        - 偏好在位公用事业品牌和账单关系的家庭
        - 品牌信任、公用事业关系和不断扩展的灵活性产品，且没有初创公司风险
        - 已审阅公开页面以询价为主，对全屋集成价格或 VPP 深度披露较少
      - - sonnen
        - 电池 / 社区主导平台
        - 声称 25 万产品用户；10 年电池质保；sonnenFlat 和 sonnenVPP
        - 以电池为核心、希望获得社区或电网服务的家庭，以及由合作伙伴安装的住宅
        - 电池可信度强，社区叙事清晰，并用 VPP 增加切换摩擦
        - 合作伙伴主导销售削弱了对获客和集成硬件广度的直接控制
      - - Svea Solar + IKEA
        - 零售渠道背书的安装商和电价方案
        - 声称 55k+ 客户；动态电价 €6.99/月，IKEA 会员 €5.95
        - 被 IKEA 渠道和零售能源整合方案吸引的价格敏感家庭
        - 零售渠道、安装交付和电价包装结合，把触达范围扩展到纯光伏买家之外
        - 电价经济性透明，但更广的软件护城河和 VPP 深度公开证据较弱
      - - Octopus Energy + Kraken
        - 零售和软件主导的灵活性竞争者
        - 声称德国客户 1m+；Kraken VPP 接入 2 GW 和 500k 台设备；Kraken 全球账户 90m+
        - 重视智能电价、热泵、EV 充电和持续优化的家庭
        - 组内最强的公开软件和公用事业集成证据；持续客户关系威胁强
        - 自有屋顶安装商密度不如 1KOMMA5° 或 Enpal 可直接对比
      - - Zolar Installer Services
        - B2B 安装商软件赋能方和反向基准
        - 已退出终端客户业务；约 120 家安装商使用软件；客户支持于 2025 年停止
        - 需要 SaaS 和工作流工具、而非消费者品牌的本地光伏安装商
        - 证明即使不掌握终端客户，软件仍能影响渠道经济性
        - 破产和支持停摆大幅降低近期直接住宅市场威胁
      - - 本地安装商 / 自建
        - 现状替代方案
        - 定价通常以报价为准；审阅范围内没有统一的公开软件或电价证据
        - 自行拼装安装商、电价、电池和控制栈的家庭
        - 供应商选择最多，也可能获得本地价格竞争
        - 客户必须自行协调调试、质保、服务和优化
    notes: 所选德国和欧盟竞争类别来自简报点名对象，加上核心现状替代方案；规模和定价单元格仅使用公开披露证据，并明确保留未知项。
    enumerationScope:
