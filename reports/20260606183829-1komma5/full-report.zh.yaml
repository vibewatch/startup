      - number: '2.2'
        title: 市场规模：TAM、SAM 与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              德国住宅电气化市场不能只拿一个自上而下的分析师数字，需要逐层搭模型。最宽的一层是德国约 16.2 million 套单户和双户住宅。按 10 kWp PV 系统搭配 10 kWh 电池储能的平均安装成本约
              €14,000–18,000 计算（2026 pricing，硬件 0% VAT），累计生命周期替换 TAM 超过 €180 billion。按年度看，把安装量（约 400,000–600,000 套 PV
              系统、平均约 €12,000–15,000）与热泵（约 299,000 台、安装后约 €18,000–22,000）和 EV 壁挂充电盒合并，仅德国的年 TAM 约 €10–15 billion。

              德国在 2025 新增太阳能约 17.5 GW（BSW-Solar 毛口径）或 16.2 GW（Fraunhofer ISE 净口径），累计容量约 117–118 GW；2030 目标为 215
              GW，意味着本十年每年需要新增约 20 GW。SAM 明显更小：约 10–11 million 套适合屋顶安装的住宅，扣除约 5 million 套已渗透住宅后，剩余约 5–6 million
              套未安装家庭，对应每年太阳能 + 储能 SAM 为 €6–9 billion。

              Q1 2026 数据显示整体下降 6%、住宅安装同比下滑 21%，确认需求调整仍在继续。但电池储能在 Q1 2026 冲至创纪录的 2 GWh（同比 +67%）；Mordor Intelligence
              预计德国太阳能市场装机基础将从 2026 的 132 GW 增长到 2031 的 235 GW，CAGR 为 12.23%——不过该数字覆盖所有细分市场，不只住宅。到 end-2025，电池储能累计总量约 20
              GWh，其中约 80% 用于住宅场景。
