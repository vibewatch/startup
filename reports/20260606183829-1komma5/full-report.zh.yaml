              Heartbeat 产品和平台建设。


              运营团队之外，创始人归属不够干净。一些早期报道只提到 Schröder、Grüber 和 Schall；后续独立盘点又把 Michael Hinderer 和 Philip Liesenfeld
              纳入创始人名单。这不推翻当前管理层图景，但意味着法律层面的创始人名单和股权历史，应直接核查，而不能从单一媒体来源推断。


              治理披露仍然薄。已审阅材料里最清楚的董事会层面信号，是 2023 报道称 Ben Kortlang
