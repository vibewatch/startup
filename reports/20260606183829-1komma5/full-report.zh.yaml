  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开估值语境与入场纪律
        blocks:
          - type: paragraph
            body: >-
              公开估值叙事在融资序列上异常清楚，在实际价格上异常单薄。官方来源确认 2024 年 12 月完成 €150 million Pre-IPO 轮、2025 年 7
              月又有未披露金额的扩展；独立报道则称公司仍是独角兽，且这一轮只小幅抬高估值。这个组合比乐观标题更重要。用官方 2024 年 €520 million 收入锚点来捍卫独角兽底线并不难，因为它只意味着约 1.9x
              收入；但如果价格显著更高，就需要比现有公开记录更强的证据。缺失的部分恰好最影响定价：确认后的投后估值、清算优先权，以及 Heartbeat
              已经是有意义的经常性收入引擎，而不只是硬件规模之上的战略层。除非这些信息在私下披露，否则正确的入场纪律是把任何软件式溢价都视为尚未证实，而不是从品牌强度或 IPO 雄心中推导出来。
