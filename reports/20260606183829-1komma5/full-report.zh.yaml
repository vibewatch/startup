        title: 成本结构、利润率驱动因素与反向服务信号
        blocks:
          - type: paragraph
            body: >
              1KOMMA5° 的成本底座看起来结构性混合：硬件交付仍需要本地人工、设备采购、集成和服务能力；软件规模则依赖云基础设施、智能电表连接、本地 IoT
              网关和研发。管理层已明确表示，昂贵的德国多晶硅和上升的销售成本压迫了 2024 利润率，即便公司仍保持运营层面盈利。Berlin 测试实验室和 Heartbeat 产品页面也指向一支有分量的固定成本软件组织，约
              200
              名开发者，加上专门研究中心，用于训练和打磨优化模型。公开客户评论证据还给出官方叙事没有量化的实际成本警示：澳大利亚和北欧评论平台反复出现售后延迟、报价超支、保修跟进问题和服务积压。这些都不能证明模式已坏，但确实意味着，如果软件驱动扩张跑得比服务能力快，贡献毛利会被返工、客户支持和声誉拖累吃掉。最大的剩余盲点仍是毛利率披露：公开渠道没有安装经济性、服务毛利率和
