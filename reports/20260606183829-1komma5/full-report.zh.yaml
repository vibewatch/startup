      - number: '1.4'
        title: 里程碑、平台深度与反向信号
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，公司正从快速并购整合，转向更由软件牵引的能源编排。公开报道把创立年份指向 2021，把大额 Series A 指向 2022，把独角兽状态指向 2023。到 2024，公司已公开宣传 Berlin
              TestLab、超过 100,000 名客户，以及围绕 Heartbeat 的更强软件定位。2025 年，它一边完成 pre-IPO 融资，一边证明虚拟电厂达到 500 MW、随后达到 600
              MW；October 订单额也首次超过 €105 million。


              这些正面信号旁边，有两个重要警示。第一，公开记录中的 2024 收入并未完全对齐：官方初步数字指向约 €520 million，Deutsche Startups 后来引用 €540 million，并称
              pre-IPO 轮估值上调幅度很小。第二，公司已成为明确的政策对抗方。October 2025，它在 Brussels 针对德国燃气电厂补贴计划提出投诉，理由是该框架歧视去中心化灵活性和虚拟电厂。


              这并不让第 1 章转负，但确实让故事没有“单纯增长”那么直线。1KOMMA5°
              看起来像一家已有规模、产品深度可见的气候科技平台；但后续章节必须继续带着估值不清、治理披露有限，以及电力市场监管设计真实暴露这三项问题。
