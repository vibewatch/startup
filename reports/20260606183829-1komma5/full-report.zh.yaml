              最强的公开客户证据不是一套光鲜的企业案例，而是房主评论平台、客户证言，以及少量带日期的产品页面拼在一起。荷兰评论平台 Klantenvertellen 是保留来源中最强的具名证据面。其中一名房主称，太阳能 +
              热泵 + 电池组合带来了一年免费用电和大约 €200
              返现；另一户家庭称，太阳能板、热泵和家用电池省下了数百欧元；还有一名老客户从太阳能升级到智能电池和动态电价合约。澳大利亚评论页面同时显示上行和摩擦。SolarQuotes 展现了大量评论足迹，Solar
              Choice
              则有具名评论者描述账单下降成功，也描述严重的售后失败。质量折扣很重要：这些证据大多是零售客户自述体验，非房主订单仍主要停留在类别层面。丹麦铁路公司和下萨克森州是真实的订单标记，但还不是公开上线的案例研究。
