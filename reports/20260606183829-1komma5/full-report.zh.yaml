      - number: '3.2'
        title: 套餐深度、定价线索与分销能力
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，各家公司在产品广度上明显趋同，但在定价透明度上趋同较弱。在审阅的安装商中，Enpal 披露了最清楚的硬件侧获客线索：0 € 首付、买 / 租 / 融资选项、€7,800 起的热泵，以及 19
              ct/kWh 起的电力报价，并通过 Enpal.One+ 提供年度报酬。IKEA 和 Svea Solar 在电价打包上异常透明，公布动态零售电价的月费和合作伙伴折扣。Octopus 披露消费者电价概念、EV
              节省表述和热泵服务包；E.ON 和 sonnen 则比可比的一体化套餐价格更强调服务、信任和合作伙伴交付。


              定价不透明具有战略意义。在公开页面很少展示最终配置系统价格的市场里，融资结构、补贴处理和报价转化本身都会成为产品的一部分。Enpal 在明确获客包装上看起来最强。E.ON 和 IKEA + Svea
              可以借助可信母品牌或零售品牌。sonnen 采用认证本地伙伴，保留区域服务感，但降低了直接公开价格可比性。1KOMMA5°
              位于这些路径之间：它销售宽的一体化能源栈和本地执行，但审阅的公开页面对软件和节省承诺披露更多，对实际签约套餐价格披露更少。这足以参与竞争，但限制了外部人士声称公司只靠透明标价取胜的信心。
