chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、商业模式与当前规模
        blocks:
          - type: paragraph
            body: >-
              1KOMMA5° 更适合被看作硬件与软件混合的家庭电气化公司，而不是纯安装商。官方页面描述的是光伏、电池、热泵、EV 充电和 Heartbeat AI 的一站式商店；BDEW
              访谈则解释，公司先在本地安装系统，再用软件和实时市场控制做优化。这个差异很关键，因为公司试图把一次性安装，转成围绕家庭能源栈的经常性软件和电价关系。


              公开来源显示，规模已经不小。公司材料从 late 2024 的超过 100,000 名客户、7 个国家 75 个网点，推进到 mid-2025 的超过 120,000 名客户、近 2,500 名员工、7 个市场约
              80 个网点。同一组来源也支撑快速扩张的安装基数：February 2025 有 40,000 套联网系统，May 2025 有 50,000 套联网系统和 500 MW 灵活容量，全球已安装可控系统超过
              300,000 套。


              财务快照强，但并不完全干净。官方初步数字给出 2024 收入接近 €520 million，有机销售额 €490 million，运营层面盈利、零债务，并有未动用的 €100 million
              授信额度。管理层还表示，Heartbeat AI 通过固定软件费变现，而不是赚取电力交易差价；这进一步说明公司正在从区域工匠式整合，转向软件赋能的能源平台。
