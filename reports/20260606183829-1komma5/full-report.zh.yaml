      - number: '8.3'
        title: 情景分析和可比成交水平
        blocks:
          - type: paragraph
            body: >-
              最干净的公开可比公司组给出一个很宽、但有用的成交区间。2026 年 6 月，Enphase 约按 5.3x 收入交易，SolarEdge 约 3.3x，Sunrun 按股权价值约 1.0x；Sunrun
              高得多的企业价值也说明，资本结构会遮住普通股真正买到的东西。私有参照进一步拉宽区间：Octopus 在一个大得多的软件 + 零售平台上拿到 $9 billion 估值；Enpal
              的私有估值也显示，只要融资深度和获客被证明，规模化住宅电气化企业仍可以值数十亿。1KOMMA5° 位于这些端点之间。官方收入锚点和独角兽状态支撑约 €1.0-1.6 billion 的基准区间，但超过 €2
              billion 的乐观情景需要证明 Heartbeat
              不只是战略上重要，而是经济上已经有分量。没有这个证明，任何溢价都要求投资者承销一场未来的软件转型，而公开记录还没有量化这场转型。因此，情景分析更偏向守住纪律，而不是追逐叙事。
