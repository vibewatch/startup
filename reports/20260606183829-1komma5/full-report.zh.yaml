  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 按竞争者类型与替代方案拆解格局
        blocks:
          - type: paragraph
            body: >-
              1KOMMA5° 竞争的不是另一家太阳能安装商这么简单。公开格局至少拆成 5 类买方可见选项：Enpal 和 1KOMMA5° 这类全栈安装商套餐；E.ON 这类传统公用事业公司主导的方案；sonnen
              这类电池或社区主导生态；Octopus 和 Kraken
              这类零售或软件主导的灵活性玩家；以及本地专业商或自组能源栈的现状方案。这个拆分很重要，因为客户要完成的任务已经不止屋顶发电。买方越来越希望太阳能、储能、热泵、充电、电价优化和售后支持能一起运转，几家同行现在也在销售某种版本的同一承诺。


              1KOMMA5° 的公开叙事是把本地手工交付与软件和规模配对：超过 100,000 名客户、75 个网点，以及从 PV 和热泵延伸到 Heartbeat AI 和 Dynamic Pulse 的套餐。Enpal
              是最清晰的直接类比，因为它销售同一套硬件栈，并叠加融资和设备控制。E.ON、sonnen、Svea Solar 和 Octopus 则把威胁模型拉宽：它们提供信任、合作伙伴分销、电价或 VPP
              经济性，不需要完全复制 1KOMMA5° 的本地整合策略。结果不是单一头号对手清单，而是分层战场；正确的尽调问题是，哪一层最威胁获客、留存或经常性软件转化。
