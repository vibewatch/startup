      - number: '7.2'
        title: 安装、软件和服务执行风险
        blocks:
          - type: paragraph
            body: >-
              执行风险很高，因为公司要同时扩一门硬业务和一层软业务。Heartbeat 自己的材料称，产品需要深度接入制造商、市场接口、本地 IoT
              网关、智能电表和可计费回路管理。开放市场发布把这个挑战从公司自有装机底盘扩展到数百万套第三方系统。战略上这很有吸引力，但围绕
              API、固件、现场调试和客户支持的失败模式也成倍增加。运营模式又加了一层复杂度：1KOMMA5°
              仍依赖区域工匠师傅，也依赖收购来的安装业务，这些业务必须被标准化进同一套运营系统。评论面不能证明公司已经坏掉，但确实反复出现排期滑坡、保修延误、无人跟进，以及客户称支持质量落后于销售承诺的案例。承销时，关键问题不是是否有客户满意——显然有——而是当
              Heartbeat、电池、热泵和动态电价一起扩张时，服务方差能否保持可控。
