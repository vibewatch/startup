        - 资产负债表韧性看起来强于多数安装商叙事。
        - ~€400M 融资、无债务状态和未使用信用额度支撑近端韧性。
        - 经验证的 2025 现金和营运资本数据会让资产负债表更可承销。
      - - 反向逻辑
        - 当前价格支撑较弱。
        - 已审阅的公开来源没有披露新一轮估值或优先股堆叠。
