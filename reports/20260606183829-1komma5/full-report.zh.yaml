        - 所有新增光伏系统强制集成智能储能；高峰时段上网削减规则
        - 电池搭售率上升；系统 ASP 提高；Heartbeat AI 拉动需求
      - - 2026 年 6 月
        - 能源共享法规
        - 允许邻里和社区集体使用本地可再生电力
        - 新的 VPP 和社区光伏商业模式；聚合商平台溢价
      - - 2027 年（提议）
        - EEG 改革草案
        - 取消 ≤25 kW 光伏系统向电网送电的补偿
