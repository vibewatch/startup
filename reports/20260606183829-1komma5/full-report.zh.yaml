      - number: '2.3'
        title: 买方分层与采用动态
        blocks:
          - type: paragraph
            body: >-
              德国住宅家庭电气化的主导买方，是单户或独立双户住宅的自住业主；他同时是买方、使用者和付款人。预算完全由家庭掌握，没有第三方机构采购，因此市场天然分散，高度依赖消费者信任和口碑。这个自住业主群体是 1KOMMA5°
              的核心目标。

              第二个快速增长的群体是城市公寓租户。Solarpaket I 在 2024 放松限制后，他们通过插电式阳台光伏系统（≤800 W 逆变器 / 2 kWp 面板）进入市场。阳台光伏量大，但单套收入低（平均每套约
              €500–800），且无法承载电池储能或热泵。新建住宅业主是第三类，由 GEG 合规要求塑造；新住宅必须采用低排放供暖，从而拉动热泵和
              PV。改造型业主是单套收入最大的机会，驱动因素既包括自愿追求能源独立，也包括燃气锅炉接近寿命终点（典型更换周期 15–20 年）。

              调查证据显示，如果没有补贴，只有约 40% 的德国家庭会推进太阳能安装，凸显自住业主群体对补贴的高度依赖。典型采用路径包含 6–18 个月考虑期，触发因素往往是邻居安装、能源价格冲击或定向数字营销——这正是
              1KOMMA5° 借 80 个区域安装网点放大的获客模式。
