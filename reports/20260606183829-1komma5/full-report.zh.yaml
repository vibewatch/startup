  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与细分结构
        blocks:
          - type: paragraph
            body: >-
              德国住宅电气化市场由 5 类产品拼成，构成自住住宅的自然能源栈：屋顶太阳能 PV 系统（通常 ≤30 kWp）、同址电池储能（5–15 kWh）、用于空间和热水供暖的热泵、家用 EV 壁挂充电盒，以及 AI
              驱动的家庭能源管理软件（HEMS），由它按实时电力现货价格编排全部资产。这个市场不包括 30 kWp 以上的公用事业级项目、地面电站、商业和工业安装，以及公共 DC 快充基础设施。德国约有 16.2
              million 套单户和双户住宅，按住房存量看，是欧洲最大的可服务住宅能源市场。现状替代方案是仅从电网购电、以燃气或燃油锅炉供暖的家庭，电价约 €0.30–0.35/kWh；能源价格波动、2024
              Building Energy Act（GEG）以及监管对电气化供暖和出行的偏好，正在削弱这个模式。5 类产品彼此强化：太阳能发低成本电，储能平滑自发自用，热泵和 EV 壁挂充电盒消纳余电，HEMS
              软件再把剩余并网灵活性聚合成虚拟电厂（VPP）来变现。
