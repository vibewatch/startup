  - id: TV006
    title: 最终尽调问题表
    columns:
      - 议题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前估值
        - 2024 轮及 2025 延展的已签署股权结构表、投后估值和股数
        - 没有实际价格，就没有可靠的入场纪律。
        - 索取董事会批准的股权结构表包和最新融资文件。
      - - 优先股堆叠
        - 清算优先权、反稀释调价、认股权证、可转债及任何优先工具
        - 普通股经济性可能与标题估值差异很大。
        - 向法律顾问或 CFO 索取融资法律摘要。
      - - Heartbeat 经济性
        - 付费订阅用户、附着率、流失率、ARPU 和软件毛利率
        - 这些指标决定软件溢价倍数是否站得住。
        - 索取月度 KPI 看板和队列桥接。
      - - 现金效率
        - 2025 年现金余额、营运资本波动、烧钱速度以及扩张计划下的现金跑道
        - 资产负债表韧性决定下行保护和融资风险。
        - 索取管理账和现金流桥接。
      - - 收入质量
        - 经审计的 2024 年收入、2025 年运行率，以及硬件与软件收入组合
        - 公开记录仍存在 €520M 与 €540M 的收入差异。
        - 索取审计财报和收入分拆。
      - - 政策敞口
        - VPP 变现对智能电表铺设和德国市场设计规则的敏感度
        - 政策和接入决定 Heartbeat 经济性能否放大。
        - 索取监管情景模型和市场接入假设。
    notes: 这些问题都可能改变建议本身或可接受入场价；它们不是例行资料清单。
