      - number: '7.3'
        title: 需求、价格和客户经济性风险
        blocks:
          - type: paragraph
            body: >-
              客户经济性风险很实在，因为营销叙事最强的是最佳情景节省，最弱的是不同队列的分散程度。1KOMMA5° 卖的是更低电费、电价优化，以及未来的 VPP
              参与，但监管机构页面说得很清楚：动态电价最适合有灵活负荷、智能电表、且用电量足以从移峰中受益的家庭。这个经济甜蜜点比“便宜电力”的泛化话术更窄。需求节奏也受政治影响。公司新闻稿提到欧洲经济衰退、太阳能和热泵需求下滑；独立市场报道则称，许多房主仍在等待供暖规则和补贴明朗。如果政策争论拖长，消费者既可以推迟买热泵，也可以推迟软件加购决策。风险不只是硬件收入放慢。更弱的太阳能和热泵周期，也会减少新电气化家庭流入，Heartbeat
              可从这些家庭收割经常性软件收入的池子会变小。
