- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - side
  - argument
  - evidence anchor
  - what would change the view
  rows:
  - - thesis
    - Scaled operating base already exists.
    - ~€520M 2024 revenue, 120k+ customers, and 500 MW of VPP capacity are public.
    - Sustained 2025 growth and audited 2024 financials would strengthen conviction.
  - - thesis
    - Software optionality is more than branding.
    - Heartbeat, VPP scale, flat software-fee model, and >€100M planned software spend are public.
    - Disclosed paid-subscriber metrics and software gross margin would justify a higher multiple.
  - - thesis
    - Balance-sheet resilience looks better than most installer narratives.
    - ~€400M raised, debt-free status, and unused credit line support near-term resilience.
    - Verified 2025 cash and working-capital data would make the balance sheet more underwriteable.
  - - anti-thesis
    - Current price support is weak.
    - No reviewed public source discloses the fresh round valuation or preference stack.
    - A verified post-money and clean terms could move the call toward track.
  - - anti-thesis
    - The market backdrop is still fragile.
    - Management itself cites recession and shrinking solar/heat-pump demand in Europe.
    - A clear volume rebound or software-led mix shift would reduce downside.
  - - anti-thesis
    - VPP economics remain policy-sensitive.
    - The Brussels complaint shows regulation can alter decentralized-flexibility economics materially.
    - A technology-neutral market design with smart-meter progress would improve the bull case.
  notes: The anti-thesis is not a claim that the company is weak; it is a claim that valuation support is still thinner than company-quality support.
