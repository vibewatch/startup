- id: diligence-asks-and-thesis-break-triggers
  title: Diligence asks and thesis-break triggers
  body: 'The remaining diligence is not cosmetic; it is exactly what determines whether the current story deserves a premium or only a fair installer-like multiple. First, the cap table and current post-money must be verified, because public sources stop at the unicorn floor and do not disclose either price or preferences. Second, software economics need to move from narrative to evidence: paid Heartbeat subscribers, attach rate to the existing installed base, churn, ARPU, gross margin, and the bridge from VPP activity to retained company revenue. Third, the IC should pressure-test downside triggers that already appear in public sources: continued weakness in European residential demand, policy rules that handicap decentralized flexibility, and financing structures that can leave equity looking cheaper than it really is. If those areas do not clear, the thesis breaks not because the company lacks quality but because the price would be asking investors to fund optionality without enough protection
    or proof.'
