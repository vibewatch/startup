  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-priced-valuation
    missingEvidence: The exact post-money valuation for the December 2024 round and July 2025 extension, including whether any internal mark materially above the unicorn floor was actually used.
    whyItMatters: Public sources support only the unicorn floor; without the actual price the IC cannot know whether it is paying a fair or stretched multiple.
    diligencePath: Obtain the signed financing summary, cap table, and investor presentation that disclose the priced round mechanics.
    relatedQuestionRefs:
    - QV003
    - QV011
  - type: private-evidence-only
    severity: material
    topic: preference-stack
    missingEvidence: Liquidation preferences, ratchets, warrants, convertibles, and any senior instruments sitting ahead of common equity.
    whyItMatters: A headline valuation can overstate new-investor common-equity upside if preferences or seniority absorb value first.
    diligencePath: Request legal financing documents and a CFO-certified cap-table waterfall.
    relatedQuestionRefs:
    - QV004
  - type: private-evidence-only
    severity: material
    topic: heartbeat-arr-and-margin
    missingEvidence: Paid Heartbeat subscribers, attach rate, churn, ARPU, software gross margin, and VPP-related retained revenue.
    whyItMatters: These are the core variables that determine whether a premium software-style multiple is deserved rather than speculative.
    diligencePath: Request monthly Heartbeat KPI dashboards, cohort analysis, and the hardware-versus-software gross-margin bridge.
    relatedQuestionRefs:
    - QV007
    - QV023
  - type: conflicting-data
    severity: minor
    topic: audited-2024-revenue
    missingEvidence: A final audited 2024 revenue figure that reconciles the official ~€520M preliminary disclosure with a later independent €540M report.
    whyItMatters: Even a modest top-line difference changes implied trading multiples and can affect how much of the public support band is defensible.
    diligencePath: Request audited 2024 financial statements and any restated management bridge.
    relatedQuestionRefs:
    - QV006
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-valuation-table coverage
    missingEvidence: A broader, cleaner set of directly comparable European home-electrification valuations with disclosed pricing and software KPIs.
    whyItMatters: The current comp table is decision-useful but necessarily mixed because the public market lacks a perfect like-for-like benchmark.
    diligencePath: Extend the comp set with private data-room marks or banker materials covering direct European peers.
    relatedQuestionRefs:
    - QV014
    - QV018
    relatedTableRefs:
    - TV004
