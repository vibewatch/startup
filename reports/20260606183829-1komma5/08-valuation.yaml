- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner-or-diligence path
  rows:
  - - Current valuation
    - Signed cap table, post-money, and share count for the 2024 round plus 2025 extension
    - Without the actual price there is no reliable entry discipline.
    - Request board-approved cap-table pack and latest financing documents.
  - - Preference stack
    - Liquidation preferences, ratchets, warrants, convertibles, and any senior instruments
    - Common-equity economics can differ sharply from headline valuation.
    - Request legal financing summary from counsel or CFO.
  - - Heartbeat economics
    - Paid subscribers, attach rate, churn, ARPU, and software gross margin
    - These metrics determine whether a premium software multiple is credible.
    - Request monthly KPI dashboard and cohort bridge.
  - - Cash efficiency
    - 2025 cash balance, working-capital swing, burn, and runway under expansion plans
    - Balance-sheet resilience drives downside protection and financing risk.
    - Request management accounts and cash-flow bridge.
  - - Revenue quality
    - Audited 2024 revenue, 2025 run-rate, and hardware-versus-software mix
    - The public record still carries a €520M versus €540M revenue discrepancy.
    - Request audited financials and revenue segmentation.
  - - Policy exposure
    - VPP monetization sensitivity to smart-meter rollout and German market-design rules
    - Policy and access determine whether Heartbeat economics can scale.
    - Request regulatory scenario model and market-access assumptions.
  notes: These asks are all capable of changing either the recommendation itself or the acceptable entry price; they are not generic housekeeping requests.
