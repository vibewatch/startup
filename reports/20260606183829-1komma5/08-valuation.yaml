    - Do not underwrite a buy call from public evidence alone.
  - - Confidence
    - medium
    - Scale, financing, and software ambition are visible, but key pricing inputs remain private.
    - Treat the view as actionable for diligence triage, not for final pricing.
  - - Risk rating
    - high
    - Market softness, policy design, financing opacity, and software proof all matter at once.
    - Assume downside can widen quickly if private diligence disappoints.
  - - Valuation stance
    - stretched
    - Only the unicorn floor is publicly supported; a premium software price is not.
    - Push back on any ask materially above the public support band.
  - - Entry discipline
    - verify price, terms, software KPIs
    - Cap table, preferences, cash, ARR, and Heartbeat unit economics are decision-critical.
    - Require a private data room before setting an acceptable range.
