chapter:
  number: 8
  title: Valuation
  summary: '1KOMMA5° screens as a real scaled operator with credible software optionality, but the public record still supports only the unicorn floor rather than a fresh priced post-money. Official and independent sources support roughly €520 million of 2024 revenue, debt-free status, about €400 million of equity raised, and more than 500 MW of VPP capacity, yet they do not disclose the current round price, preference stack, or realized Heartbeat economics. That makes the current call price-sensitive: research-more with medium confidence, high risk, and a stretched valuation stance unless diligence proves a materially stronger software business or a lower entry price.'
sections:
- id: public-valuation-context-and-entry-discipline
  title: Public valuation context and entry discipline
  body: 'The public valuation story is unusually visible on funding sequence and unusually thin on actual price. Official sources confirm a €150 million pre-IPO round in December 2024 and an undisclosed extension in July 2025, while independent coverage says the company remains a unicorn and that the round only lifted valuation marginally. That combination matters more than the headline optimism. A unicorn floor is easy to defend against the official €520 million 2024 revenue anchor because it implies only about 1.9x sales, but a materially higher price would need stronger public proof than the current record provides. The missing pieces are exactly the price-sensitive ones: a confirmed post-money, liquidation preferences, and evidence that Heartbeat is already a meaningful recurring-revenue engine rather than mainly a strategic layer on top of hardware scale. Until those are disclosed privately, the right entry discipline is to treat any premium software-style price as unproven rather than
    to interpolate it from brand strength or IPO ambition.'
