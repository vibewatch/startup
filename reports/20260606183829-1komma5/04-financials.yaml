callouts:
  - calloutType: strength
    title: "Balance-sheet strength is real, even if liquidity detail is missing"
    body: >
      Roughly €400 million of equity, an undrawn €100 million credit line, and continued debt-free
      status give 1KOMMA5° more room than a typical European installer to fund software expansion
      without obvious distress financing.
    claimRefs:
      - CI004
      - CI005
      - CI039

  - calloutType: risk
    title: "Public revenue scale does not solve the underwriting gap"
    body: >
      The decisive missing metrics remain gross margin by stream, cash, burn, runway, CAC, payback,
      and realized Heartbeat subscription economics. Without them, investors can describe the model
      but cannot properly price it.
    claimRefs:
      - CI027
      - CI028
      - CI036
      - CI040

  - calloutType: insight
    title: "Heartbeat is the financial pivot, not just the product pivot"
    body: >
      The most important financial change is the move from hardware-led growth toward a recurring
      software-and-energy-service layer that can also monetize third-party installed systems. That
      could materially improve economics, but only if attach, retention, and service quality hold.
    claimRefs:
      - CI022
      - CI029
      - CI031
      - CI042

