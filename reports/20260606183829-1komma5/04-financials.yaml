  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: "hardware pricing"
      missingEvidence: "Public hardware list pricing, discounting policy, and realized ASP by PV, battery, heat pump, and wallbox category."
      whyItMatters: "Without standardized hardware pricing evidence, it is impossible to compare realized hardware economics across markets or test discount pressure."
      diligencePath: "Request current price books, quote waterfall, and realized ASP by product family and country for the last four quarters."
      relatedQuestionRefs:
        - QI004
      relatedTableRefs:
        - TI002
    - type: private-evidence-only
      severity: material
      topic: "2025 extension amount"
      missingEvidence: "Exact incremental euro amount raised in the July 2025 extension of the pre-IPO round."
      whyItMatters: "The undisclosed extension size affects the true cash buffer and investor appetite signal entering the next financing cycle."
      diligencePath: "Request signed financing documents or board materials showing extension proceeds, valuation, and any changed investor rights."
      relatedQuestionRefs:
        - QI010
      relatedTableRefs:
        - TI004
    - type: private-evidence-only
      severity: blocking
      topic: "gross margin and profitability"
      missingEvidence: "Consolidated and stream-level gross margin, EBITDA, net income, and warranty reserve data."
      whyItMatters: "The financial verdict hinges on whether recurring software margin can outweigh hardware and service pressure; public sources do not show that bridge."
      diligencePath: "Obtain audited financial statements and management accounts with gross margin by stream and country for 2024 and 2025."
      relatedQuestionRefs:
        - QI019
      relatedTableRefs:
        - TI003
    - type: private-evidence-only
      severity: blocking
      topic: "sales efficiency"
      missingEvidence: "CAC, payback, close rates, sales-cycle length, and subscription attach-to-install conversion by channel."
      whyItMatters: "The thesis that Heartbeat expansion can become materially more efficient than installer-led growth cannot be tested without channel economics."
      diligencePath: "Request funnel dashboards for homeowners, property owners, and third-party installed-base conversions, including CAC and payback by cohort."
      relatedQuestionRefs:
        - QI020
      relatedTableRefs:
        - TI003
    - type: private-evidence-only
      severity: blocking
      topic: "cash burn and runway"
      missingEvidence: "Current cash balance, monthly burn, free cash flow, and management runway under base and downside cases."
      whyItMatters: "Capital adequacy cannot be underwritten from public funding history alone because software scaling may consume cash faster than top-line growth implies."
      diligencePath: "Request latest balance sheet, trailing 12-month cash flow, and board-approved runway plan with financing trigger thresholds."
      relatedQuestionRefs:
        - QI021
      relatedTableRefs:
        - TI004
