slug: 1komma5
runDate: "2026-06-06"
company:
  name: "1KOMMA5°"
chapter:
  number: 4
  title: Financials
  summary: >
    1KOMMA5°'s public financial story is unusually strong on growth and capital signals but still
    incomplete for underwriting. Official sources support roughly €520 million of 2024 revenue,
    €490 million of organic sales, operational profitability in the core hardware business,
    debt-free status, roughly €400 million of cumulative equity, an undrawn €100 million credit
    line, and more than €100 million of planned software investment through 2027. The business
    model is increasingly legible: integrated hardware-and-installation revenue is being layered
    with Heartbeat AI subscription fees and dynamic-tariff monetization, including a newly
    disclosed €599 one-time device fee and €14.99 monthly AI fee for open-market Heartbeat users.
    The main diligence blockers are unchanged: no public gross margin split, burn, runway, CAC,
    payback, or realized hardware-versus-software revenue mix.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model, pricing, and disclosed revenue mix
    body: >
      1KOMMA5° is no longer just an installer narrative. Public evidence shows a hybrid model in
      which integrated home-electrification projects still drive most disclosed scale, while
      Heartbeat AI increasingly functions as a software and energy-market layer on top. The core
      hardware business spans photovoltaics, storage, heat pumps, EV charging, installation, and
      ongoing service through local master craftsmen and regional sites. On top of that base,
      Heartbeat AI automates storage, load shifting, and electricity-market participation. The
      company has repeatedly said it charges a flat software fee rather than taking a supplier-like
      margin on electricity. Until late 2025 that pricing model was mostly directional; newer
      official product and press pages now make it more concrete, with the open-market Heartbeat
      box priced at €599 one-time and AI optimization at €14.99 per month, while Dynamic Pulse is
      marketed without a monthly base fee but still depends on smart meters and spot-market-linked
      consumption. That makes the monetization model more legible, but not yet fully underwriteable:
      reviewed public sources still do not break out how much of the ~€520 million 2024 revenue is
      installation hardware, service, recurring software, or electricity-market monetization.
    claimRefs:
      - CI001
      - CI002
      - CI009
      - CI011
      - CI012
      - CI013
      - CI014
      - CI015
      - CI029
      - CI031
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001

  - id: gtm-and-sales-efficiency-proxies
    title: GTM motion and sales efficiency proxies
    body: >
      Public GTM evidence points to a blended motion: local physical distribution for hardware,
      software-led expansion into existing third-party systems, and early movement into larger
      property-owner accounts. 1KOMMA5° operates as a one-stop shop through local consultation,
      planning, installation, and maintenance, and publicly cited 75 locations in seven countries
      at the 100,000-customer milestone. By July 2025 it was serving more than 120,000 customers,
      and by October 2025 it reported around €105 million of new orders in a single month,
      including larger orders from property owners and a Danish railway company. That order flow is
      the best public sales-efficiency proxy available because the company does not disclose CAC,
      payback, or sales cycle length. The more important forward GTM signal is strategic rather
      than purely volumetric: Heartbeat AI is being opened to millions of existing third-party
      systems and marketed as a subscription-style energy service that does not require 1KOMMA5° to
      install every battery or heat pump itself. If conversion costs stay low, that should improve
      software sales efficiency materially versus pure hardware-led growth; if smart-meter rollout,
      integrations, or support operations stall, the expansion motion slows quickly.
    claimRefs:
      - CI010
      - CI018
      - CI019
      - CI020
      - CI021
      - CI022
      - CI031
      - CI042
      - CI043
    tableRefs:
      - TI003
    figureRefs:
      - FI002

  - id: cost-structure-margin-drivers-and-adverse-signals
    title: Cost structure, margin drivers, and adverse service signals
    body: >
      1KOMMA5°'s cost base appears structurally mixed: hardware delivery still requires local labor,
      device procurement, integration, and service capacity, while software scale depends on cloud
      infrastructure, smart-meter connectivity, local IoT gateways, and R&D. Management has been
      explicit that expensive German polysilicon and rising sales costs pressured the 2024 margin
      picture even while the company stayed operationally profitable. The Berlin test lab and the
      Heartbeat product pages also point to a meaningful fixed-cost software organization, with
      around 200 developers and a dedicated research center used to train and refine optimization
      models. Public customer-review evidence adds a practical cost warning that the official
      narrative does not quantify: after-sales delays, quote overruns, warranty follow-up problems,
      and service backlogs recur across Australia and Nordic review platforms. None of that proves a
      broken model, but it does imply that contribution margin can leak through rework, customer
      support, and reputation drag if software-led expansion outruns service capacity. The biggest
      remaining blind spot is still gross margin disclosure: there is no public split between
      installation economics, service margins, and Heartbeat software contribution.
    claimRefs:
      - CI023
      - CI024
      - CI025
      - CI026
      - CI027
      - CI028
      - CI032
      - CI033
      - CI034
      - CI035
      - CI036
      - CI037
      - CI038
      - CI041
    figureRefs:
      - FI004

  - id: capital-adequacy-and-financial-verdict
    title: Capital adequacy, financing dependency, and verdict
    body: >
      The near-term capital picture is better than the disclosure picture. Official and news sources
      align on roughly €400 million of cumulative equity raised, a €150 million pre-IPO round in
      December 2024, a 2025 extension with undisclosed additional capital, continued debt-free
      status, and an approved €100 million credit line that remained unused. Those facts matter
      because they suggest 1KOMMA5° is funding Heartbeat expansion from a position of relative
      balance-sheet strength rather than emergency refinancing. The company is also explicit that it
      intends to spend more than €100 million on Heartbeat AI through 2027 and had already targeted
      mid-double-digit million SaaS revenue in 2025, so the next financing trigger is more likely
      software scale, IPO timing, or strategic acceleration than core hardware survival. Still,
      public underwriting remains incomplete. Reviewed sources do not disclose cash on hand, monthly
      burn, runway months, gross margin by stream, customer concentration, or the realized attach,
      churn, and ARPU of Heartbeat subscriptions. The financial verdict is therefore qualified:
      revenue quality and capital adequacy look directionally better than many European installer
      peers, but a clean investment case still requires private data on software economics, working
      capital, and cash efficiency.
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
      - CI027
      - CI039
      - CI040
      - CI042
