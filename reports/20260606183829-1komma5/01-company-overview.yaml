  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founder-attribution
    missingEvidence: A definitive legal founder record and current role history covering all named co-founders.
    whyItMatters: Public founder attributions differ across sources, which affects historical cap-table interpretation and founder-market-fit mapping.
    diligencePath: Request incorporation history, founder equity history, and a management-certified founder list with current and former roles.
    relatedQuestionRefs:
    - QO005
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: material
    topic: governance-board-disclosure
    missingEvidence: A full current board roster, observer list, and committee structure.
    whyItMatters: This chapter can identify the operating bench and a single board-level clue, but not the actual governance body that controls strategic decisions.
    diligencePath: Request the latest board list, observer rights, committee charters, and any governance memorandum shared with current investors.
    relatedQuestionRefs:
    - QO007
    - QO023
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: material
    topic: 2024-revenue-and-valuation-precision
    missingEvidence: Audited 2024 revenue and the exact pricing terms or implied valuation mechanics of the December 2024 and July 2025 financings.
    whyItMatters: The official 2024 revenue figure differs from one later report, and public materials still do not provide a fresh priced valuation for the extension.
    diligencePath: Request audited 2024 financial statements, round documents, cap-table updates, and the price per share for the pre-IPO round and extension.
    relatedQuestionRefs:
    - QO013
    - QO015
    - QO024
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-control-rights
    missingEvidence: Current ownership percentages, preference stack, liquidation rights, pro rata terms, and any strategic or observer rights for recent investors.
    whyItMatters: Later-stage climate-tech outcomes depend heavily on who controls the next financing, IPO path, and downside protections, none of which are public here.
    diligencePath: Request the current cap table, financing docs, investor-rights agreement, and any side letters for G2VP, CalSTRS, Sabanci, and earlier major backers.
    relatedQuestionRefs:
    - QO023
    - QO025
    relatedTableRefs:
    - TO003
