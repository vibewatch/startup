company:
  name: 1KOMMA5°
chapter:
  number: 1
  title: Company Overview
  summary: 1KOMMA5° is a Hamburg-founded 2021 home-electrification company combining local installation capability with Heartbeat AI software and a growing residential virtual power plant. Public materials support roughly €520 million of 2024 revenue, about 2,500 employees, more than 120,000 customers, about €400 million of equity raised, and a debt-free balance sheet with an unused €100 million credit line. The main chapter-1 caveats are inconsistent founder attribution outside the core operating team, limited public board and cap-table disclosure, and a still-undisclosed fresh valuation for the 2025 extension despite a visible IPO intention.
sections:
- id: identity-business-model-and-scale
  title: Identity, business model, and current scale
  body: '1KOMMA5° is best understood as a blended hardware-and-software home-electrification company rather than a pure installer. Official pages describe a one-stop shop for photovoltaics, batteries, heat pumps, EV charging, and Heartbeat AI, while the BDEW interview explains that the company installs systems locally and then optimizes them through software and real-time market control. That distinction matters because the company is trying to turn one-time installation work into a recurring software and tariff relationship around the home energy stack.


    Scale is already material in public sources. Company materials moved from more than 100,000 customers and 75 locations in seven countries in late 2024 to more than 120,000 customers, nearly 2,500 employees, and roughly 80 locations in seven markets by mid-2025. The same source set supports a rapidly expanding installed base: 40,000 connected systems by February 2025, 50,000 connected systems and 500 MW of flexible capacity by May 2025, and more than 300,000 controllable systems installed worldwide.


    The financial snapshot is strong but not perfectly clean. Official preliminary figures put 2024 revenue close to €520 million, with organic sales at €490 million, operational profitability, zero debt, and an undrawn €100 million credit line. Management also says Heartbeat AI is monetized via a flat software fee rather than electricity-trading margin, reinforcing the transition from regional craftsmanship roll-up to software-enabled energy platform.'
