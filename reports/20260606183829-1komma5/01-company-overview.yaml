- id: founders-leadership-and-governance-visibility
  title: Founders, leadership, and governance visibility
  body: 'The public leadership bench is clearer than the public governance bench. Official releases consistently identify Philipp Schröder as co-founder and CEO, Micha Grüber as CFO and co-founder, Barbara Wittenberg as CTO, and Jannik Schall as co-founder and CPO. Schröder’s prior Tesla and sonnen experience is part of the external credibility story, while Wittenberg and Schall are tied directly to the Heartbeat product and platform build-out.


    Founder attribution is less clean outside the operating team. Some earlier coverage named only Schröder, Grüber, and Schall, while later independent roundups expanded the founder set to include Michael Hinderer and Philip Liesenfeld. That does not invalidate the current management picture, but it means the legal founder roster and equity history should be checked directly rather than inferred from a single media source.


    Governance disclosure remains thin. The clearest reviewed board-level signal is a 2023 report that Ben Kortlang became vice-chairman, but public sources still do not disclose a full current board roster, ownership percentages, or board rights. For underwriting purposes, this chapter can identify the operating bench and key visible backers, not settle control.'
