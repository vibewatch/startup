- id: capital-formation-valuation-signals-and-stakeholders
  title: Capital formation, valuation signals, and stakeholder base
  body: 'The financing record is unusually visible for a private European climate-tech company. Public sources support a €200 million Series A in 2022, a €215 million Series B or unicorn round in 2023 led by G2VP, a €150 million pre-IPO round in December 2024 led by a CalSTRS-led syndicate, and a July 2025 extension that added Sabanci Climate Ventures. By mid-2025, both official and independent materials converged on roughly €400 million of equity raised.


    What remains less clear is pricing. The reviewed 2025 materials still describe 1KOMMA5° as a unicorn worth more than €1 billion, but they stop short of publishing a fresh priced valuation for the extension. The company clearly signals capital-markets ambition: the December 2024 round was officially framed as another step toward the capital market, while third-party coverage attached a tentative 2026 IPO target.


    Stakeholder visibility is therefore strongest on who is in the syndicate and weakest on what each investor controls. Public materials name G2VP, CalSTRS, Sabanci, Porsche Ventures, b2venture, Eurazeo, eCapital, Haniel, the Schürfeld family, Jan Klatten, and others, but not the current cap-table split or preference stack. That gap matters because this company is already large enough that valuation, dilution, and governance terms could move the investment case materially.'
