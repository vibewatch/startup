- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Company solution
  - Measurable benefit
  - Limitation
  rows:
  - - Find something worth watching
    - Browse a curated landing page and editorial context
    - Home page, Now Showing, Library, and Notebook surfaces
    - Higher discovery efficiency for niche or arthouse titles
    - No public evidence on recommendation precision or search-to-play conversion
  - - Watch on the move
    - Use iOS or Android app and optionally download for offline viewing
    - Mobile apps with offline licenses and Wi-Fi-friendly download guidance
    - Films can be carried offline for travel or commuting
    - Downloads are mobile-only and expire after 30 days unused or 48 hours after playback starts
  - - Watch on the big screen at home
    - Install app on TV device or cast from phone
    - Apple TV, Fire TV / Fire OS, Android TV-class devices, AirPlay, and Chromecast support
    - Moves the niche catalog into the living-room environment
    - No public device-by-device performance metrics or supported-console presence
  - - Redeem the weekly theatrical entitlement
    - Open GO app, pick theater/showtime, redeem at box office
    - Weekly hand-picked title plus QR or code-based ticket workflow
    - Creates habitual cinema attendance and a stronger premium use case than plain streaming
    - Availability depends on local cinemas, showtimes, and partner acceptance
  - - Stay inside MUBI for criticism and context
    - Read Notebook or buy Notebook Magazine around titles and directors
    - Owned publication and print layer
    - Extends product engagement beyond runtime alone
    - No public evidence on whether editorial consumption increases retention or ticket uptake
  - - Track films across territories and languages
    - Browse catalog with region-specific availability and subtitle constraints
    - Localized service plus film pages and territory-specific rights windows
    - Supports global breadth without promising the same catalog everywhere
    - Catalog and subtitle availability remain rights-constrained by country
  notes: Benefits are stated in workflow terms rather than financial ROI because public evidence is stronger on product mechanics than on conversion or retention outcomes.
