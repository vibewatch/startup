- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / quality signal
  - Status
  - Scope
  - Gap
  rows:
  - - Google Play data-safety disclosure
    - Published
    - Streaming app lists data-sharing/collection categories, encrypted in transit, and deletion request path
    - Not a substitute for public security architecture, audit results, or incident reporting
  - - Apple App Privacy labels
    - Published
    - iOS app lists linked data categories and platform privacy disclosures
    - Consumer privacy labels do not expose internal data governance or retention design
  - - GO anti-sharing rules
    - Published
    - Terms restrict use to one active device and one user; vouchers are non-transferable
    - No public abuse-rate or fraud-prevention metrics
  - - Accessibility / subtitle controls
    - Partial
    - Subtitles can be customized in browser or device settings; language support varies by film and market
    - Controls are less flexible than larger streaming platforms and not unified across devices
