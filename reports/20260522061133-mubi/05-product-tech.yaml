    - Mixed
    - Strong ratings on core app and mature device breadth suggest a workable service
    - Public complaints still mention glitches, location gaps, and regional catalog frustration
  - - Public security / reliability artifacts
    - Limited
    - Privacy links and support pages are visible
    - No public status page, API docs, engineering blog, or certification set surfaced in retained sources
  notes: The table intentionally separates consumer-facing trust signals from enterprise-grade assurance artifacts, because the retained public record supports the former far better than the latter.
