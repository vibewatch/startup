figures:
- id: FE001
  title: Product architecture map
  type: stack
  layout: wide
  summary: 'The public architecture is clearest from the outside in: membership and editorial surfaces on top, client apps in the middle, and a partially opaque rights-and-operations layer underneath.'
  data:
    layers:
    - label: Membership and discovery surface
      detail: Homepage, curated plans, Now Showing / Library entry points, and the about page’s multi-identity framing.
      items:
      - Curated streaming membership
      - Student path
      - GO upgrade path
      - Film discovery and browsing
    - label: Editorial and publishing layer
      detail: Notebook and Notebook Magazine keep criticism, context, and brand voice inside the MUBI ecosystem.
      items:
      - Notebook daily publication
      - Notebook Magazine
      - MUBI Editions / ancillary brand surfaces
    - label: Client delivery layer
      detail: Native mobile, TV, and web clients expose playback, downloads, casting, and account flows.
      items:
      - iOS / Android apps
      - Apple TV / Android TV / Fire TV class devices
      - Mac / PC web access
      - QR / code-based TV activation
    - label: Fulfillment and entitlement layer
      detail: Operational rules that translate membership into streamable or redeemable experiences.
      items:
      - Offline license windows
      - Two simultaneous screens / five devices
      - Weekly GO entitlement
      - Billing-country and seat-availability rules
    - label: Rights, partner, and release operations
      detail: Territorial rights, cinema partners, subtitle/localization coverage, and film acquisition or distribution operations determine what can actually be delivered.
      items:
      - Territory-specific catalog availability
      - Partner-cinema showtimes
      - Subtitle / localization coverage
      - Theatrical rights and release execution
  approximationNotes: The figure is deliberately outside-in because public evidence documents product surfaces and operating dependencies, not the internal cloud or service topology.
