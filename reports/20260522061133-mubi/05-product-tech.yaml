- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process
  - Role
  - Dependency
  - Risk
  rows:
  - - Editorial curation and publishing
    - Shapes discovery through curated lineup, Notebook, and magazine surfaces
    - MUBI editorial and publishing operations
    - Editorial authority is visible, but ranking, recommendation, and conversion logic are undisclosed
  - - Consumer apps and web clients
    - Deliver browsing, playback, account management, and subscription flows
    - Apple, Google, web browsers, TV OS ecosystems
    - Platform-policy changes or app regressions can affect distribution and billing
  - - Playback and offline license handling
    - Supports HD streaming, mobile downloads, and time-limited offline viewing
    - Mobile operating systems and device storage constraints
    - No public detail on DRM, CDN, license-refresh logic, or playback observability
  - - TV activation and casting
    - Moves usage from handheld screens to living-room devices
    - QR / code activation, AirPlay, Chromecast, smart-TV apps
    - Fragmented device matrix raises support and documentation-consistency risk
  - - MUBI GO redemption workflow
    - Translates membership entitlement into a weekly cinema ticket
    - Partner cinemas, showtimes, billing-country rules, and box-office redemption
    - Local supply gaps and sold-out screenings can degrade perceived product value
  - - Rights, localization, and subtitle layer
    - Determines what each subscriber can actually watch in a given market
    - Territorial licensing, subtitle availability, and localized service footprint
    - Global brand promise is limited by rights windows and language coverage
  - - Distribution and release operations
    - Handles film acquisitions and territorial releases beyond streaming
    - Rights sellers, exhibitors, and release planning processes
    - Public tooling and process detail are sparse despite larger title commitments
  notes: This table captures only the layers that are evidenced in public sources; the missing cloud, data, recommendation, and security internals are an explicit evidence gap rather than an inferred stack.
