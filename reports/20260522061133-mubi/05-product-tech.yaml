  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: go-partner-density
    missingEvidence: A current city-by-city and cinema-by-cinema GO coverage map, plus redemption and sell-out rates.
    whyItMatters: GO’s real usefulness depends on local partner density, not just on the headline promise of one weekly ticket.
    diligencePath: Request the active exhibitor roster, city coverage, weekly title fill rate, and member redemption cohorts by market.
    relatedQuestionRefs:
    - QE012
  - type: private-evidence-only
    severity: material
    topic: technical-architecture-opacity
    missingEvidence: System diagrams or credible technical documentation covering cloud hosting, playback stack, DRM, recommendation services, and core data pipelines.
    whyItMatters: Public product polish does not answer whether MUBI’s back end is scalable, resilient, or overly dependent on vendors and manual workarounds.
    diligencePath: Ask engineering leadership for architecture diagrams, top vendor list, service ownership map, and reliability metrics for core playback and entitlement flows.
    relatedQuestionRefs:
    - QE019
    - QE025
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: public-security-assurance
    missingEvidence: Public security certifications, trust-center material, incident history, or a status page tied to the consumer product.
    whyItMatters: Consumer privacy labels are useful, but they do not substitute for evidence about security controls, uptime discipline, or incident response maturity.
    diligencePath: Request SOC / ISO status if any, last major incident log, security organization ownership, and customer-facing uptime or outage reporting practice.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: product-reliability-telemetry
    missingEvidence: Playback failure rates, crash rates, activation success rates, subtitle coverage percentages, and GO fulfillment metrics.
    whyItMatters: Public ratings and complaints show direction, but they do not tell an investor how reliably the product performs at scale or in edge cases.
    diligencePath: Request product analytics dashboards for app stability, playback QoE, device-specific failure rates, and GO ticket-claim completion funnels.
    relatedQuestionRefs:
    - QE020
    - QE021
  - type: conflicting-data
    severity: minor
    topic: device-support-mismatch
    missingEvidence: One authoritative compatibility matrix that reconciles devices-page minimum OS versions with FAQ minimums.
    whyItMatters: Documentation drift is not existential, but it is a visible quality signal for a product that relies on many device variants.
    diligencePath: Ask product support to reconcile marketing and FAQ device requirements and explain the version-governance process for public docs.
    relatedQuestionRefs:
    - QE007
    relatedTableRefs:
    - TE003
