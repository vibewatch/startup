- id: go-publishing-and-distribution-operations
  title: GO, publishing, and distribution turn the app into an operating stack
  body: 'MUBI’s clearest product differentiation is not that it curates films—Criterion, OVID, BFI Player, and other specialty services also sell curation—but that it stitches curation to real-world exhibition and owned publishing. GO is structurally different from a premium streaming tier because entitlement depends on weekly title selection, partner-cinema availability, box-office redemption, billing-country rules, and anti-sharing controls. That makes it an operating workflow with live partner dependencies, not merely a pricing add-on. Notebook and Notebook Magazine create a second non-streaming layer by keeping discovery, criticism, and editorial authority inside the brand. The theatrical/distribution side pushes MUBI still further away from a standard niche streamer: Variety’s Cannes coverage of the $24 million “Die, My Love” deal shows that the company is making rights-acquisition and territorial-release decisions that belong to a film distributor, not just to a software subscription
    business. The practical implication is that MUBI’s technology organization likely sits inside a larger rights, partner, and release-operations machine. Public sources make that organizational breadth visible, but they do not disclose how much of the process is supported by bespoke internal tooling versus vendor software and manual operational coordination.'
