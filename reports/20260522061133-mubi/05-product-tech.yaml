- id: trust-quality-and-unknowns
  title: Trust, quality signals, and evidence-based unknowns
  body: 'MUBI’s public trust story is consumer-facing rather than enterprise-technical. The strongest visible signals are Apple and Google app-store disclosures: encrypted-in-transit language on Google Play, data deletion requests, privacy-category labels on iOS, recent app updates, and explicit device or account rules in GO terms. These are useful but limited controls. They say the company is operating mature mobile software, not that it has published a security architecture, uptime discipline, or certification regime. Quality evidence is similarly mixed. The streaming app has scale and generally strong ratings, while the GO app’s smaller review base surfaces a real operating constraint: the product is only as good as local theater density and showtime coverage. AppBrain and Google Play also capture complaints about glitches, regional catalog frustration, and login or playback problems, which is consistent with PCMag’s more formal critique that MUBI lacks multiple profiles and richer subtitle
    controls. The correct technical conclusion is therefore nuanced. MUBI has a credible shipped consumer product with recognizable release cadence and device breadth, but a diligence process should treat public engineering transparency as thin and ask management directly for system architecture, reliability metrics, security controls, and partner-integration tooling rather than infer them from the polished consumer experience.'
