chapter:
  number: 5
  title: Product & Technology
  summary: 'MUBI’s product is best understood as a curated-film operating system with four visible layers: streaming membership, the MUBI GO weekly-ticket workflow, an owned editorial publishing surface through Notebook, and a growing theatrical/distribution layer. Public evidence is strong on apps, device support, offline rules, and cinema-redemption mechanics, but weak on the underlying cloud, data, security, and reliability architecture; the right diligence stance is to separate a polished consumer surface from an opaque technical back end.'
sections:
- id: curation-led-product-surface
  title: Curation-led product surface and user jobs
  body: 'MUBI’s public product surface is deliberately broader than a normal subscription-video storefront. The company’s own about page says it is simultaneously a streaming service, curator, publisher, and distributor, and the navigation on the consumer homepage makes that concrete by putting MUBI GO, Notebook, Notebook Magazine, and Editions alongside the core streaming plan. That means the first product question is not simply “what can I stream?” but “what job is MUBI trying to do for a film enthusiast?” The retained sources support six recurring user jobs: discover films through editorial curation, stream a rotating specialty catalog, download films for offline viewing, watch on living-room devices, redeem one theatrical ticket per week through GO, and stay inside a MUBI-controlled publishing and community environment rather than jumping out to third-party film media. Notebook strengthens this positioning because it is not incidental blog content; MUBI describes it as a daily international
    film publication, while Notebook Magazine adds a paid print layer. The result is a product that acts less like a pure app and more like a vertically integrated cinephile membership that mixes discovery, viewing, and cultural context.'
