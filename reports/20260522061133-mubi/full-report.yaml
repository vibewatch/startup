          Current valuation depends on whether the $200M headline is high-quality recurring revenue or hybrid revenue
          with volatile film economics
        - Finance team data room; audited statements and management bridge
      - - Cap table and liquidation preferences
        - Full ownership table, preference stack, participation rights, and employee-option dilution
        - Realized investor returns could differ materially from enterprise-value ranges
        - Legal / finance workstream; board-approved cap-table export
      - - Subscriber quality
        - Cohort retention, plan mix, geography mix, and GO attach rate around the 1.7M subscriber rebound
        - Needed to separate durable demand from awards-season or controversy rebound noise
        - Growth analytics request; cohort dashboard and churn bridge
      - - Title-level economics
        - P&L for The Substance, Die My Love, and forward minimum-guarantee commitments
        - >-
          The bull and bear cases hinge on whether MUBI can repeat good slate outcomes without taking unacceptable cash
          risk
        - Content-finance workstream; title-level investment committee materials
      - - Governance process
        - >-
          Board composition, reserved matters, escalation rights, and evidence the ethical-funding policy is operating
          in practice
        - Valuation already proved sensitive to investor alignment and response speed
        - Board and legal diligence; minutes, policy workflow, and case log
      - - Cash runway and commitments
        - Current cash balance, working-capital swings, debt if any, and off-balance-sheet content obligations
        - Needed to judge downside funding risk if another film miss or subscriber drawdown hits
        - Treasury and FP&A diligence package
    notes: >-
      These asks are the minimum package required to move from a directional valuation view to a commit-or-pass
      decision.
