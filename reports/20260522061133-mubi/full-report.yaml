        - id: n3
          label: Economics remain opaque
          detail: Public record does not disclose clean revenue mix, margins, or cap table
          type: process
        - id: n4
          label: Price already demanding
          detail: $1B ≈ 5x reported 2025 revenue and ~$588–$833 per subscriber
