          - type: callout
            title: MUBI deserves more credit than a pure niche-streaming comp
            body: >-
              The company is not just a shelf of indie films. Its positioning as a streamer, curator, publisher, and
              distributor, plus the evidence from The Substance, supports some premium over pure niche SVOD peers. The
              problem is not that there is no premium case. The problem is that the current round already charges
              investors for much of it.
            calloutType: strength
            claimRefs:
              - CV008
              - CV018
