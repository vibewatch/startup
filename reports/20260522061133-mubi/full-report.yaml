      - number: '5.2'
        title: Applications, delivery workflow, and the limits of public architecture detail
        blocks:
          - type: paragraph
            body: >-
              The most knowable part of MUBI’s technology stack is the client layer. Official device and help pages show
              a mature cross-platform distribution surface: mobile apps, smart-TV and media-player apps, web access on
              Mac and PC, AirPlay and Chromecast support, offline downloads, QR-code or six-digit device activation, and
              a multi-device concurrency model. The GO workflow is equally explicit: pick the weekly film, choose a
              theater and showtime, redeem in app, then convert the voucher into a cinema ticket at the box office.
              Support articles also expose practical delivery constraints that matter more than marketing copy, such as
              downloads being mobile-only, expiring after 30 days unused or 48 hours after playback starts, and surround
              sound or subtitle customization being device-dependent rather than universal. What public sources do not
              reveal is the underlying engineering architecture that would make these experiences work at scale. The
              retained set does not identify cloud providers, CDN partners, DRM vendors, recommendation systems, data
              pipelines, observability tooling, or internal service topology. Even the public support matrix is not
              perfectly synchronized: the devices page advertises newer iOS and Android minimums than the FAQ article,
              suggesting the consumer-facing documentation is maintained in multiple layers rather than from a single
              authoritative compatibility source.
