      - number: '3.3'
        title: Switching costs, multi-homing, and distribution power
        blocks:
          - type: paragraph
            body: >-
              For pure streaming memberships, switching cost is structurally low. Criterion, OVID, BFI, Netflix, and
              MUBI all present monthly or trial-led consumer purchases rather than hard contracts, which means many
              users can add, cancel, or rotate services with relatively little friction. That matters because MUBI is
              not defending a proprietary operating system, unique device footprint, or deeply embedded workflow. The
              strongest lock-in in the retained set comes from distribution or payer structure rather than technology.
              Kanopy is harder to displace in a different way because the library or university, not the viewer, is the
              payer. Prime Video, Max, and AMC+ gain distribution power from being one element of a larger bundle or
              household content stack. MUBI GO creates some real friction because it depends on billing country,
              selected cinemas, and weekly title availability, but that same operational complexity can also constrain
              scale. The practical result is a market where multi-homing is common and where MUBI's competitive defense
              depends more on identity and habit than on hard contractual lock-in.
