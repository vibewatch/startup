      - number: '8.3'
        title: Bull, base, and bear framework
        blocks:
          - type: paragraph
            body: >-
              The scenario work should start with what is actually public, not with heroic terminal-value stories. The
              base case assumes the reported 2025 revenue level of about $200 million is directionally right, that the
              Q1 2026 subscriber rebound holds broadly, and that MUBI keeps some hybrid premium over small public
              specialty streamers because it can monetize both memberships and film rights. Under that setup, a 3.5x to
              5.0x multiple on roughly $200 million to $225 million of revenue supports only about $700 million to $1.1
              billion of equity value. That means the current $1 billion mark already sits near the upper end of the
              base case.


              The bear case assumes another controversy, another large title miss, or evidence that recurring
              subscription economics are weaker than the headline revenue figure suggests. In that world, the multiple
              compresses toward the 2.0x to 3.5x public specialty range and value falls to about $400 million to $700
              million. The bull case needs more than a simple subscriber rebound. It requires revenue closer to $260
              million to $300 million, repeatable content wins that look more like The Substance than Die My Love, and
              enough discipline that the market is willing to pay 5.0x to 7.0x revenue for a hybrid indie-media
              platform. Only then does the value range expand to roughly $1.3 billion to $2.1 billion.
            claimRefs:
              - CV003
