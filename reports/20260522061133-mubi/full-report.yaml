  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Recurring subscriptions sit beside a more volatile film-rights business
        blocks:
          - type: paragraph
            body: |-
              MUBI's posted monetization starts with a familiar streaming ladder but quickly becomes more
              complicated than a typical SVOD plan sheet. The standard U.S.-facing plan is $14.99 per month,
              the student plan is $9.99 per month after a free trial, and MUBI GO is a premium tier that bundles
              full streaming access with one cinema ticket each week. That matters because GO is not just premium
              pricing; it introduces a second cost center in the form of theater redemption and local partner
              operations. The FAQ and fine print make clear that the product only works in selected countries and
              cities, on qualifying screenings, and within a seven-day redemption window. At the same time, MUBI's
              own help pages explain that the visible film database is much broader than the watchable catalog and
              that each territory has a different lineup because rights are divided geographically. Financially,
              that means list pricing is easy to observe, but monetizable inventory, realized ARPU, and gross
              margin are not. The public evidence also supports a second revenue family beyond subscriptions:
              theatrical distribution, acquisitions, and production-adjacent activity around titles such as
              “The Substance” and “Die, My Love.” Revenue quality therefore depends on two engines at once — a
              recurring consumer membership business and a title-driven film-rights business whose cash timing and
              margin volatility are much harder to see from outside.
