            body: >-
              MUBI does show visible land-and-expand logic: students can step into the standard plan, core streaming
              members can upgrade to GO, and hit-film or awards cycles can pull new users into the funnel before
              curation and community try to hold them. But concentration risk is real. GO depends on selected cinemas
              and local coverage, so MUBI does not control the entire experience. The broader subscriber base also
              appears concentrated in a comparatively narrow cinephile segment that is willing to pay for taste and
              prestige rather than library breadth or low price. The clearest adverse evidence is reputational: trade
              coverage says MUBI lost 200,000 subscribers during the 2025 backlash, showing that the customer base can
              react quickly to controversy. The rebound to 1.7 million is encouraging, but because public sources do not
              split recovery by plan, market, or title cohort, investors should treat customer resilience as plausible
              rather than proven. The key open risk is not whether demand exists; it is how portable and repeatable that
              demand remains across cohorts.
