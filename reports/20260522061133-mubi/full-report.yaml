      - number: '1.2'
        title: Leadership, capital, and stakeholder structure
        blocks:
          - type: paragraph
            body: >-
              Public leadership evidence is thinner than product evidence. Efe Cakarel is clearly the enduring
              founder-CEO and public operator in both databases and 2026 press coverage, but the retained official pages
              do not provide a fully transparent executive roster or board list. Tracxn names Gabe da Silveira as a
              co-founder, yet that detail is not repeated prominently in MUBI’s current official pages, so founder
              history is supportable but not perfectly surfaced. Capital formation is clearer. Multiple retained sources
              converge on a Sequoia-led $100 million financing in 2025 at a $1 billion valuation, with prior backing
              from Summit Partners and Zhang Xin/Closer Media also visible in public company-database and trade-press
              coverage. The harder question is not whether capital arrived, but what rights came with it. Backlash
              reporting, filmmaker letters, and MUBI’s own rebuttals all show that governance influence became a live
              diligence issue after the Sequoia round. Coverage and open letters treated Andrew Reed and Sequoia as
              having board-level significance, while Cakarel later said Reed was not on the board and that Sequoia had
              no control over programming, editorial, or financial decisions. That contradiction does not defeat the
              core fact that Sequoia is strategically important; it does mean a diligence process should ask for the
              actual board roster, shareholder rights, and any observer or veto mechanics rather than infer them from
              public controversy alone.
