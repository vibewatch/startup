          - type: callout
            title: What would move the call
            body: >-
              A lower entry price alone could improve the recommendation, but the cleaner path is evidence. Audited
              revenue mix, cap-table terms, retention data, and title-level ROI could move the current stance from
              stretched to fair. Without that package, the prudent move is to keep MUBI on the research-more list rather
              than force a buy case from incomplete public data.
