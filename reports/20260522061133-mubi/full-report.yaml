companyProfile:
  summary: >
    MUBI is a 2007-founded, London-led private film platform built around curated streaming, the premium MUBI GO
    weekly-ticket membership, Notebook editorial publishing, and increasingly theatrical distribution and
    production-adjacent activity. Founder-CEO Efe Cakarel remains the core public operator; Tracxn also identifies Gabe
    da Silveira as a co-founder, though current official pages surface him less prominently. Public reporting converges
    on a 2025 Sequoia-led $100M raise at a $1B valuation, roughly 1.7M paying subscribers by Q1 2026 after a
    backlash-driven 2025 dip, 20M registered users, and a service footprint spanning 195+ territories. The core
    diligence tension is that MUBI has real scale and prestige-film momentum, but its cumulative funding history,
    revenue mix, and cap-table terms remain publicly incomplete.
