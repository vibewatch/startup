  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitive set
        blocks:
          - type: paragraph
            body: >-
              The most useful competitor frame for MUBI starts with specialty film services, not with the entire
              streaming universe. Criterion Channel, OVID, BFI Player, and Curzon Home Cinema all market hand-picked,
              world, independent, or film-culture-oriented viewing rather than the broad TV utility that dominates
              Netflix, Prime Video, HBO Max, and AMC+. That makes them MUBI's closest direct peers on taste-led
              discovery, editorial framing, and willingness to pay for cinema identity. At the same time, the household
              budget is not partitioned so neatly. Netflix, Prime Video, Max, and AMC+ still compete because they offer
              cheaper or comparable entry points inside much broader entertainment packages. Kanopy matters as a
              different kind of substitute again: it offers ad-free film viewing at zero end-user price when a library
              or university is paying. Theatrical moviegoing also remains both substitute and channel, because MUBI GO
              explicitly ties the membership to one selected weekly cinema ticket and competitors such as BFI and Curzon
              also sit close to cinema or rental ecosystems.
