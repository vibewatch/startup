      - number: '8.4'
        title: Comparable valuation context
        blocks:
          - type: paragraph
            body: >-
              The right comparison set is specialty streaming and film-distribution analogs, not generic SaaS. Public
              small-cap media names give the most useful downside anchor even though each has its own noise.
              CuriosityStream trades at roughly 2.1x to 2.3x revenue, Cineverse around 1.0x, and AMC Global Media around
              0.17x. Those are not perfect peers, but they are exactly why a $1 billion MUBI mark is hard to call cheap
              on public evidence alone. If MUBI were just a premium niche streamer, the gap to those ratios would look
              too wide.


              The best case for paying up is that MUBI is not just a streamer. It has a higher monthly price than
              Criterion, OVID, and BFI Player, a pay-per-title adjacent offering through GO and distribution, and a
              stronger cultural brand than most public micro-cap specialty peers. Netflix provides a loose upper-bound
              ceiling at about 8x revenue, but that is a scale and profitability benchmark, not a direct comparable. The
              more relevant transaction anchor is Sony's 2021 Crunchyroll acquisition: it cleared $1.175 billion, but
              against 5 million SVOD subscribers, implying about $235 per subscriber. MUBI's current mark implies
              materially more per subscriber on a much smaller paid base. That does not kill the thesis, but it does
              show why the current round should be treated as stretched unless diligence reveals better economics than
              public data can prove.
