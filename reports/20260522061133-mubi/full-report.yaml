      - number: '4.4'
        title: The real blocker is missing disclosure, not missing demand
        blocks:
          - type: paragraph
            body: |-
              A private company does not need to publish audited segment detail to be investable, but MUBI's public
              gap set is unusually material because its model has become more capital-intensive. The available data
              is enough to show that people pay for the product, that subscriber growth can recover after a shock,
              and that the company can create title-level upside when a prestige release works. It is not enough to
              tell an underwriter how much of reported revenue is recurring subscription cash, how much GO depresses
              gross margin through ticket reimbursement, how much working capital is tied up in film guarantees and
              P&A, or how much cash remained after the Q4 2025 drawdown. Public streamers publish machine-readable
              filing data that make these questions routine; MUBI does not. The correct verdict is therefore mixed:
              revenue demand looks real, but revenue quality, margin path, and capital adequacy remain opaque enough
              that a serious diligence process should treat this as a disclosure problem first and a growth story
              second.
