      - number: '8.2'
        title: Thesis and anti-thesis tied to earlier chapters
        blocks:
          - type: paragraph
            body: >-
              The pro case rests on the parts of the earlier report that were strongest. MUBI has a real premium
              audience, a higher-than-mass-market price point, and a cultural position that commodity streamers do not
              own. The service recovered to a record 1.7 million subscribers in Q1 2026, and the contrast between The
              Substance and Die My Love shows why bulls remain interested: MUBI can still turn curation and film
              selection into theatrical upside, awards relevance, and subscriber momentum. The company's own positioning
              as a streamer, curator, publisher, and distributor also explains why it may deserve some premium to pure
              niche SVOD peers.


              The anti-thesis is equally concrete. Earlier chapters showed that MUBI operates in a narrow premium niche,
              faces low switching costs in core streaming, and relies on a business model whose revenue mix is hard to
              verify publicly. The 2025 backlash proved that governance and investor alignment can hit subscriber growth
              directly, not just reputation. The Die My Love miss then showed how a single prestige-content bet can drag
              cash flow. The result is a company that looks strategically interesting but still behaves like a
              high-variance media asset, not a predictable software platform. That is why the investment call has to be
              price-sensitive and evidence-sensitive rather than a generic quality score.
