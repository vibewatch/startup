      - number: '3.2'
        title: Pricing, packaging, and capability comparison
        blocks:
          - type: paragraph
            body: >-
              Posted pricing and packaging reinforce that MUBI is selling a premium niche offer, not a discount
              specialty product. Criterion advertises $10.99 per month, OVID $6.99, and BFI Player £6.99, while AMC+
              sells a lower-priced multi-brand bundle and Netflix's ad tier starts below MUBI's standard plan. PCMag's
              review makes the contrast explicit by noting that Criterion costs less than MUBI while MUBI GO costs more
              because it includes a weekly hand-picked movie ticket in select cities. Capability-wise, the direct
              specialty set is closer to parity than the pricing spread suggests. Criterion, OVID, BFI, Curzon, and
              Kanopy all foreground curation, discovery, or film education in some form, while device access, downloads,
              and TV support are no longer distinctive enough to be a durable moat on their own. The real divergence is
              packaging logic: MUBI sells curation plus theatrical access, Kanopy shifts payment to institutions, Curzon
              keeps a transactional no-subscription route, and incumbents sell broader household utility with bundles,
              live channels, or sports.
