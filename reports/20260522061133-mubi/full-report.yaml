chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and geographic footprint
        blocks:
          - type: paragraph
            body: >-
              MUBI’s identity is broader than a conventional streaming app. Its own about page asks whether the company
              is “a streaming service,” “a curator,” “a publisher,” or “a distributor,” then answers yes to all of them,
              which is directionally consistent with the storefront, jobs page, and MUBI GO terms. In practical terms,
              the company monetizes a curated subscription-video offering, a higher-priced membership that includes one
              weekly cinema ticket, and a wider film business that now includes distribution, publishing, and
              production-adjacent activity. The platform’s consumer surface is also mature enough to look like a scaled
              direct-to-consumer business rather than a boutique website: MUBI advertises monthly and annual plans, a
              separate student tier, native mobile apps, major living-room device support, offline downloads, and
              multi-device usage. Geographic evidence is similarly mixed but directionally clear. Third-party company
              databases and MUBI’s jobs page anchor the legal and organizational center in London, while the jobs page
              also shows established entities in New York, Berlin, and Istanbul and a much wider distributed workforce.
              That combination supports a simple diligence framing: MUBI is London-led, globally distributed, and built
              as a hybrid film platform whose identity now depends on both software distribution and film-rights
              execution.
