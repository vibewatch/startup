            body: >-
              MUBI’s public retention story is suggestive but incomplete. On the positive side, the main streaming app
              has strong public satisfaction markers—4.4 on Google Play and 4.7 on the App Store—and PCMag credits daily
              new content and community features. Those facts support a reasonable hypothesis that curation and
              editorial framing help build weekly habits. On the negative side, PCMag also flags missing profiles and
              limited subtitle controls, and broader app-store evidence points to friction around playback, account
              experience, and regional catalog variation. The GO tier looks weaker than the core app on public ratings,
              which fits a product that depends on local partner-cinema logistics. Most importantly, there is no public
              NRR, GRR, renewal, or cohort churn disclosure in the retained set. That means any hard retention
              conclusion would be invented. The right diligence stance is to treat ratings and subscriber rebound as
              encouraging but incomplete proxies for actual durability.
