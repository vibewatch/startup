  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adjacencies
        blocks:
          - type: paragraph
            body: >-
              The right boundary for MUBI is narrower than “global streaming” but broader than “one more arthouse app.”
              Its core market is premium curated film streaming: an ad-free subscription whose value proposition is
              selection, taste, editorial framing, and global cinema rather than catalog breadth, sports, or live-TV
              utility. MUBI's public storefront makes that explicit by leading with curated streaming and a separate
              MUBI GO tier that adds a weekly cinema ticket, while Criterion, OVID, BFI Player, and Curzon Home Cinema
              all frame their own offers around hand-picked, art-house, or independent film discovery. That is MUBI's
              closest comparable set. Netflix, Prime Video, Max, and AMC+ still matter because they compete for the same
              discretionary entertainment budget, but their homepages emphasize mass-market breadth, bundles, sports,
              live TV, and mainstream series rather than cinephile curation. A further outer ring is film-commerce
              adjacency: Curzon and BFI mix subscription with rentals or cinema institutions, while investor-facing
              surfaces from Netflix, AMC Global Media, Cineverse, and CuriosityStream show that public comparables span
              not just general SVOD but broader content-platform and distribution models. The market boundary should
              therefore include curated-film subscription spend and hybrid streaming-plus-theatrical membership, treat
              general SVOD as the main substitute wallet, and treat theatrical or distribution economics as
              strategically important adjacencies rather than imaginary TAM.
