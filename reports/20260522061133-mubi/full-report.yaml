      - number: '1.4'
        title: Milestones, backlash, and open diligence questions
        blocks:
          - type: paragraph
            body: >-
              The company’s chronology now has two competing interpretations. On one axis, MUBI looks like a successful
              arthouse platform broadening into a prestige mini-studio: it was founded in 2007, rebranded from The
              Auteurs, layered in partnerships and acquisitions, released or backed major awards titles, raised
              unicorn-stage capital, and rebounded to record subscriber levels by early 2026. On the other axis, 2025
              shows how exposed the model has become to reputation and content-allocation risk. Filmmaker backlash to
              the Sequoia financing escalated into open letters, venue withdrawals, event cancellations, staff
              departures, layoffs, subscriber losses, and press scrutiny of revenue, losses, and cash flow. MUBI’s
              response—an ethical-funding process, advisory mechanisms, and repeated claims of editorial
              independence—matters because it signals management saw the problem as existential to brand trust, not
              merely social-media noise. The chapter-level diligence conclusion is therefore balanced: MUBI has real
              global brand equity and a differentiated film proposition, but the next layer of underwriting depends less
              on curation rhetoric than on private disclosures around cap-table control, financial durability, and how
              much balance-sheet risk management is prepared to absorb as the company buys larger films and tries to
              scale beyond boutique streaming.
