  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              MUBI’s public customer surface is consumer, not enterprise. The homepage, memberships page, terms, and
              jobs page all describe a film-lover membership built around discovery, curation, and community rather than
              family entertainment bundles or B2B licensing. That yields three visible paying cohorts. First is the core
              streaming member paying $14.99 per month for curated viewing. Second is the lower-priced student entrant
              paying $9.99 per month after a free-trial period, which functions as an acquisition wedge for younger,
              price-sensitive cinephiles. Third is the $19.99 MUBI GO member, a heavier-engagement customer willing to
              pay for both streaming and one weekly theatrical ticket. The public record also implies a non-paying or
              lightly paying editorial audience that browses Notebook and wider MUBI surfaces before converting.
              Relative to Criterion, OVID, BFI Player, and Curzon, MUBI’s customer proposition is the most explicitly
              aimed at highly engaged film enthusiasts who value curation and a bridge between home viewing and
              theatrical attendance.
