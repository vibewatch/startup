      - number: '7.4'
        title: Partner / platform / channel dependency
        blocks:
          - type: paragraph
            body: >-
              MUBI’s customer promise depends on counterparties that sit outside the company’s direct control. Content
              licensors determine what can stream where and for how long. Apple, Google, and Roku can intermediate
              discovery, billing, ratings, and cancellation for users who subscribe through those channels. Browser
              vendors and Google’s Widevine stack shape who can watch on the web. Partner cinemas determine whether GO
              actually delivers a weekly seat in a way customers experience as reliable. Each dependency is manageable
              on its own; the issue is that several of them stack on the same user journey.


              This stack is visible in public sources. The help center routes Apple, Google Play, and Roku billing
              issues back to those third parties. The browser articles route troubleshooting through current browser
              versions, supported operating systems, and manual DRM updates. GO terms route part of the ticketing risk
              to unaffiliated cinemas and their own terms. App-review evidence adds a real-world check: GO reviews
              complain that the film of the week is not consistently available outside major cities, while main-app
              reviews flag playback and subtitle frustrations despite strong affection for curation.


              For investors, the key implication is that MUBI cannot treat channel power as merely a support function.
              Channel dependency affects churn, gross-to-net revenue, refund burden, product perception, and ultimately
              how much of the customer relationship MUBI truly owns.
