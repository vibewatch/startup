      - number: '3.4'
        title: Moat durability and competitive risk
        blocks:
          - type: paragraph
            body: >-
              The chapter-level moat conclusion is nuanced. MUBI does have a differentiated position: GO's weekly cinema
              ticket is visibly distinct in the retained set, and MUBI's own about page claims a broader
              curator-publisher-distributor role than a simple streaming app. But the underlying curation proposition is
              not exclusive. Criterion, OVID, BFI, Curzon, and Kanopy all market taste, film education, global cinema,
              or thoughtful discovery, so the direct-peer set can reproduce much of the same emotional value proposition
              at lower list prices or with institution-paid access. That makes premium willingness to pay and brand
              trust central to the underwriting question. Variety's reporting that MUBI lost subscribers during its 2025
              PR storm is therefore competitively relevant: a niche cultural brand can lose retention if buyers decide
              its identity no longer justifies the premium. Meanwhile, incumbents retain the option to respond through
              cheaper ad tiers, broader bundles, live or sports utility, or prestige-film acquisition without asking
              households to add yet another specialty subscription. Public data still does not reveal peer share, churn,
              overlap, or cohort retention, so durable competitive advantage remains only partly observable from
              outside.
