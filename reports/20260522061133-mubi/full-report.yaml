  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              MUBI is attractive as a company-quality story but still price-sensitive as an investment. The strongest
              public facts support a real brand, a genuine recovery in paying subscribers, and a differentiated hybrid
              position that spans streaming, curation, distribution, and increasingly production. But the same public
              record also says the current reference price is already demanding. Sequoia's 2025 $100 million round
              valued MUBI at $1 billion, while trade reporting tied to the Wall Street Journal says 2025 revenue was
              about $200 million and year-end subscribers were only about 1.2 million before a Q1 2026 rebound to 1.7
              million. That math puts the current mark at about 5x revenue and roughly $588 to $833 per subscriber,
              depending on which subscriber base is used.


              Those ratios are not absurd for a fast-growing premium media asset, but they do not leave much room for
              error. Public small-cap specialty-media comparables trade much lower, while Netflix's richer multiple sits
              on radically better scale, diversification, and margin proof. The right conclusion is not that MUBI is
              overhyped by definition. It is that investors should treat the $1 billion price as a top-of-range entry
              that requires proof on revenue quality, slate discipline, and cap-table cleanliness before it deserves a
              conviction buy. My recommendation is research-more with medium confidence, high risk, and a stretched
              valuation stance at the current mark.
            claimRefs:
              - CV001
