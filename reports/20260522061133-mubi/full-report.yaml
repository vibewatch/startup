      - number: '2.3'
        title: Buyers, users, payers, and adoption paths
        blocks:
          - type: paragraph
            body: >-
              MUBI's buyer map is consumer-led, but it is not one generic streaming customer. The standard curated plan
              is best understood as a direct-to-consumer purchase by a core cinephile who values hand-picked global
              cinema, editorial context, and library differentiation more than breadth. The student plan creates a
              distinct price-sensitive cohort whose budget owner is still the individual user, but whose purchase
              trigger is a deeper discount and longer free-trial path. MUBI GO is structurally different again: the
              buyer and payer are still the consumer, yet the user journey includes theater availability, weekly title
              selection, and ticket redemption, so the value chain touches exhibitors rather than ending inside the app.
              A fourth segment is the prestige-minded household that already has mainstream services and adds MUBI
              selectively for festival, awards, or culture-driven viewing. Public app-store surfaces show how these
              segments enter the funnel: discovery through app-store search, reviews, awards buzz, or title-specific
              interest; trial through free periods or the student discount; then activation on phones, tablets, TVs, and
              downloads. The implication for diligence is that MUBI's user, buyer, and payer are usually the same
              person, but their budget logic, trigger event, and substitution set vary materially by segment and by
              whether the offer is pure streaming or the GO hybrid.
