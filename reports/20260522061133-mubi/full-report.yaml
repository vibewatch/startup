      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The $1B mark already assumes a premium to public specialty-media peers
            body: >-
              Public-market specialty peers do not support a casual view that $1B is cheap. The current mark is roughly
              5x the reported 2025 revenue base, versus roughly 2x for CuriosityStream, about 1x for Cineverse, and well
              below 1x for AMC Global Media. That premium can be justified only if MUBI's hybrid model and brand create
              better revenue quality than the public record currently proves.
            calloutType: risk
            claimRefs:
              - CV029
              - CV033
              - CV034
