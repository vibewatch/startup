- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Subscriber reversal
    - Paid subscribers fall more than 15% from the 1.7M Q1 2026 level without evidence of planned price optimization
    - Breaks the resilience thesis and weakens the premium-multiple argument
    - Move to avoid or demand repricing well below the last round
  - - Slate economics miss
    - Another prestige-title bet loses money on a Die My Love-like scale without a balancing hit
    - Shows vertical integration is adding volatility faster than it is adding franchise value
    - Pause investment until title-level ROI discipline is visible
  - - Recurring margin disappointment
    - Data room shows core subscription gross margin is structurally weak or subsidized by volatile film economics
    - Removes the main reason to pay above public specialty-media multiples
    - Rebase underwriting to bear-case comp band
  - - Governance / brand shock
    - Another investor- or board-linked controversy causes creator exits, venue pullouts, or major subscriber losses
    - Confirms brand trust is a core valuation variable, not background noise
    - Treat as thesis break unless management can prove fast containment
  - - Cap-table overhang
    - Preference stack or participation rights materially impair common-equity outcomes below roughly $1.5B exit value
    - Makes even a seemingly fair enterprise value unattractive for new money
    - Do not invest at the round terms without structural protection
  notes: These are observable kill criteria rather than generic risks. Each one is chosen because it can move both revenue quality and exit value quickly.
