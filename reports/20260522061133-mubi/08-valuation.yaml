- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric / status
  - Multiple / valuation signal
  - Relevance
  - Limitation
  rows:
  - - Netflix
    - Public; $376.0B market cap; $46.9B TTM revenue
    - ~8.0x market cap / revenue
    - Best scaled global SVOD ceiling for what a premium streaming multiple can look like
    - Mass-market global platform with far better scale, diversification, and margin proof than MUBI
  - - CuriosityStream
    - Public; ~$153M market cap; $66.6M–$71.7M revenue
    - ~2.1x–2.3x market cap / revenue
    - Useful niche-SVOD floor for a focused premium content service
    - Factual-documentary niche with a different content and licensing mix
  - - AMC Global Media
    - Public; $395.4M market cap; $2.30B TTM revenue
    - ~0.17x market cap / revenue
    - Shows how public markets discount legacy/specialty media with streaming exposure
    - Conglomerate and linear-TV baggage make it only a rough downside anchor
  - - Cineverse
    - Public; $53.2M market cap; $55.3M TTM revenue; 1.55M SVOD subs
    - ~1.0x market cap / revenue
    - Closest public hybrid of digital distribution plus streaming at small scale
    - Much smaller business with more ad/library exposure and lower cultural pricing power
  - - Crunchyroll
    - 2021 Sony acquisition; 5M SVOD subscribers; 120M registered users
    - $1.175B deal value; about $235 per SVOD subscriber
    - Best direct transaction precedent for a premium fandom streaming asset clearing $1B
    - 2021 transaction in a hotter market and with a much larger paid base than MUBI
  - - MUBI current round
    - Private 2025 mark; ~$200M reported 2025 revenue; 1.2M year-end 2025 to 1.7M Q1 2026 subscribers
    - ~5.0x revenue; roughly $588–$833 per subscriber
    - Current reference price to underwrite
    - Private round, opaque cap table, and uncertain revenue mix make the mark hard to verify fully
  enumerationScope:
    coverage: partial
    basis: Rows cover the most decision-relevant public specialty streaming, hybrid distribution, and transaction analogs visible from retained sources; many private niche peers lack disclosed valuation data or comparable financial detail.
  notes: The table intentionally mixes public-market ratios with a transaction precedent and MUBI's private round. It is a decision table, not an apples-to-apples comp set, because the specialty-streaming peer universe is thin and disclosure quality varies sharply.
