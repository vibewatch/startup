- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What changes the view
  rows:
  - - Brand and curation
    - MUBI has real premium demand, cultural relevance, and pricing power in a cinephile niche
    - A narrow niche with low switching costs can still lose momentum quickly when trust wobbles
    - Show 12-month churn, plan mix, and pricing resilience after the 2025 backlash
  - - Hybrid model
    - Streamer + curator + distributor + producer can justify a premium over pure niche SVOD
    - Hybrid exposure also imports film-bet volatility, cash timing risk, and working-capital swings
    - Disclose revenue split and title-level contribution margins
  - - Subscriber proof
    - Rebound to 1.7M subscribers shows resilience and hit-driven demand
    - Year-end 2025 still fell to about 1.2M and badly missed the 2M internal goal
    - Prove that rebound is durable across cohorts rather than award-season noise
  - - Content economics
    - The Substance showed MUBI can monetize great taste into cultural and commercial upside
    - Die My Love showed one expensive miss can reverse the cash story quickly
    - Provide slate discipline rules and post-release ROI by title
  - - Governance and funding
    - New ethical-funding policy and public response show management can adapt under pressure
    - The backlash showed investor alignment can directly damage subscribers, partnerships, and creator trust
    - Show board process, escalation rights, and evidence the policy is operationalized
  - - Exit path
    - A strategic buyer could value MUBI as a premium indie-media asset with global rights relationships
    - Public specialty-media multiples and private preference overhang can still cap realized returns
    - Clarify exit pathway, dilution, and downside protections before investing
  notes: This table intentionally mixes strengths and disconfirming evidence because the recommendation is price-sensitive. A positive company-quality view does not override a stretched entry price.
