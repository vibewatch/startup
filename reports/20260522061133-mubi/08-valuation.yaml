  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cap-table
    missingEvidence: Full cap table, liquidation preferences, participation rights, and option dilution by class.
    whyItMatters: Headline valuation ranges do not translate into investor returns without knowing the waterfall.
    diligencePath: Request counsel-approved cap-table export and financing documents in the data room.
    relatedQuestionRefs:
    - QV023
    - QV029
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Audited split among streaming subscriptions, GO, theatrical/distribution, and production revenue plus gross-margin bridge.
    whyItMatters: The current mark is hard to assess if the public $200M revenue figure contains volatile film economics rather than durable recurring revenue.
    diligencePath: Obtain audited financial statements and a management bridge between segment revenue and gross margin.
    relatedQuestionRefs:
    - QV002
    - QV004
    - QV024
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: title-level-roi
    missingEvidence: P&L and cash-commitment data for The Substance, Die My Love, and the forward acquisition slate.
    whyItMatters: The bull and bear cases diverge mainly on whether MUBI can repeat good slate outcomes without taking unacceptable cash risk.
    diligencePath: Request title-level investment memos, recoupment tracking, and minimum-guarantee exposure schedules.
    relatedQuestionRefs:
    - QV008
    - QV017
    - QV018
    - QV029
    relatedTableRefs:
    - TV003
    - TV006
  - type: missing-source
    severity: material
    topic: retention-and-plan-mix
    missingEvidence: Cohort churn, plan mix, geography mix, and GO attach-rate data around the 2025-2026 subscriber swing.
    whyItMatters: Without retention quality, the rebound to 1.7M subscribers could reflect temporary noise rather than durable value creation.
    diligencePath: Request subscriber bridge by quarter, churn cohorts, and plan-level ARPU report.
    relatedQuestionRefs:
    - QV003
    - QV004
    - QV029
    relatedTableRefs:
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set
    missingEvidence: Additional disclosed private specialty-streaming or film-distribution transactions and any secondary marks closer to MUBI's mix.
    whyItMatters: The comp table is necessarily partial because the most relevant private peers rarely publish valuation and financial detail.
    diligencePath: Supplement public sources with banker books, cap-table marks, and management-supplied private-comp references during diligence.
    relatedQuestionRefs:
    - QV010
    - QV012
    - QV021
    relatedTableRefs:
    - TV004
