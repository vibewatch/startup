callouts:
- calloutType: risk
  title: The $1B mark already assumes a premium to public specialty-media peers
  body: Public-market specialty peers do not support a casual view that $1B is cheap. The current mark is roughly 5x the reported 2025 revenue base, versus roughly 2x for CuriosityStream, about 1x for Cineverse, and well below 1x for AMC Global Media. That premium can be justified only if MUBI's hybrid model and brand create better revenue quality than the public record currently proves.
  claimRefs:
  - CV029
  - CV033
  - CV034
  - CV035
  - CV036
- calloutType: strength
  title: MUBI deserves more credit than a pure niche-streaming comp
  body: The company is not just a shelf of indie films. Its positioning as a streamer, curator, publisher, and distributor, plus the evidence from The Substance, supports some premium over pure niche SVOD peers. The problem is not that there is no premium case. The problem is that the current round already charges investors for much of it.
  claimRefs:
  - CV008
  - CV018
  - CV041
- calloutType: recommendation
  title: What would move the call
  body: A lower entry price alone could improve the recommendation, but the cleaner path is evidence. Audited revenue mix, cap-table terms, retention data, and title-level ROI could move the current stance from stretched to fair. Without that package, the prudent move is to keep MUBI on the research-more list rather than force a buy case from incomplete public data.
  claimRefs:
  - CV049
  - CV052
  - CV053
  - CV054
  - CV055
