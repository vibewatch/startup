- id: exit-readiness-diligence-and-kill-triggers
  title: Exit readiness, kill triggers, and final diligence asks
  body: 'Exit optionality exists, but it is not yet clean. A strategic sale to a larger media or platform buyer is easier to imagine than a near-term IPO, because public specialty-media valuations are weak and MUBI''s hybrid mix would require more disclosure than the company currently gives. The strategic logic is understandable: MUBI owns a premium brand, global rights relationships, and a differentiated bridge between curation, streaming, and theatrical distribution. But the same hybrid model means buyers will scrutinize title-level P&Ls, minimum guarantees, working-capital swings, and governance risk.


    That is why final diligence matters more than spreadsheet precision. Before leaning into a $1 billion entry, investors need audited revenue split by streaming, GO, theatrical, and production/distribution; cohort retention and plan mix by geography; title-level economics for The Substance, Die My Love, and the forward slate; the full cap table with liquidation preferences; and a governance process that shows the 2025 backlash response has been institutionalized rather than left to founder discretion. If those asks come back clean, the current mark can move from stretched to fair. If they do not, the thesis should break quickly because public upside is still too narrow relative to downside.'
