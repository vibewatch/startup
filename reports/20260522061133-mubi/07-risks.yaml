  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: policy-execution
    missingEvidence: Board-approved implementation record for the Ethical Funding and Investment Policy, including exceptions, escalation routes, and completed reviews.
    whyItMatters: Without operating evidence, the new policy cannot be treated as a proven mitigation for future fundraising controversy.
    diligencePath: Request board minutes, ownership matrix, policy review cadence, and one completed case file under the new policy.
    relatedQuestionRefs:
    - QR005
    - QR025
    relatedTableRefs:
    - TR001
    - TR004
  - type: private-evidence-only
    severity: material
    topic: succession-depth
    missingEvidence: Named succession plan, delegated authorities, and current board-composition detail beyond founder and investor narratives.
    whyItMatters: Founder concentration is investable only if governance depth exists behind the public story.
    diligencePath: Request current board roster, committee structure, succession document, and executive retention plan.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: go-density
    missingEvidence: City-level partner-cinema count, redemption rates, out-of-stock frequency, and refund or complaint rates for MUBI GO.
    whyItMatters: The public promise of weekly cinema access is only valuable if supply depth is broad and reliable outside a few major cities.
    diligencePath: Request GO coverage map, weekly redemption dashboard, partner churn data, and top-city support tickets.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: title-roi
    missingEvidence: Title-level acquisition economics, downstream streaming impact, and post-release ROI for large film bets such as Die My Love and The Substance.
    whyItMatters: Without title-level economics, investors cannot distinguish healthy strategic risk-taking from value-destructive content concentration.
    diligencePath: Request acquisition budgets, marketing spend, box-office share, streaming lift, and postmortems for top-10 title bets.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR002
    - TR005
  - type: private-evidence-only
    severity: material
    topic: backlash-cohorts
    missingEvidence: Churn bridge by geography, plan, and creator or festival cohort during and after the Sequoia backlash.
    whyItMatters: A 200,000-subscriber drawdown is directionally important, but investment risk depends on which customers and partners actually left and why.
    diligencePath: Request monthly churn and reacquisition cohorts, customer-support tagging, and partner cancellation log for 2025-2026.
    relatedQuestionRefs:
    - QR001
    - QR003
    - QR030
    relatedTableRefs:
    - TR002
    - TR005
  - type: private-evidence-only
    severity: material
    topic: privacy-assurance
    missingEvidence: Independent assurance evidence such as SOC 2, penetration-test summary, DPA artifacts, and any regulator inquiry history.
    whyItMatters: Customer trust and legal exposure depend not only on privacy disclosures but on operational control evidence that is absent from the public set.
    diligencePath: Request privacy program owner, latest assurance reports, vulnerability management summary, and any regulator correspondence log.
    relatedQuestionRefs:
    - QR017
    relatedTableRefs:
    - TR001
    - TR002
