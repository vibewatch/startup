- id: people-execution-and-kill-criteria
  title: People / execution concentration and kill criteria
  body: >-
    Execution risk is concentrated because MUBI is still a relatively lean organization for the breadth of what it is trying to do. Public reporting points to roughly 400 employees across 14 or 15 offices, which is meaningful scale for a niche film company but modest scale for a business simultaneously running subscriptions, apps, rights windows, theatrical releasing, festivals, magazine and editorial surfaces, and GO operations. The layoffs and content-leadership overhaul reported after the PR storm suggest the organization is still adjusting while asking the market to believe in bigger bets.


    Leadership concentration is equally important. Public reporting centers the company’s governance story on founder and CEO Efe Cakarel, who says he remains the largest shareholder and retains control. That preserves curatorial coherence, but it also concentrates judgment over financing, risk appetite, and mission interpretation. Public materials do not yet give investors a clear read on succession depth, committee structure, or how much of the ethical-funding response is institutionalized below the founder level.


    The practical answer is to treat MUBI as investable only with hard monitoring discipline. Investors should require observable thresholds around subscriber shocks, large-title economics, GO fulfillment, leadership stability, and governance process. If those thresholds slip, the thesis changes quickly because the same small set of variables drives both growth and downside.
