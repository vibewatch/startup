- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Backlash recurrence
    - Net subscriber movement after financing or political controversy
    - More than 10% subscriber drawdown in a quarter or partner withdrawals across at least three markets
    - Pause underwriting of growth durability and re-price brand resilience
  - - Prestige-title concentration
    - Large acquisition spend versus downstream monetization evidence
    - Repeated >$20m bets without clear recoupment path or two consecutive major misses
    - Require tighter title-underwriting and apply a valuation discount
  - - Territorial-rights complexity
    - Blocked-title, travel, subtitle, or portability complaint growth
    - Sustained rise in rights-related complaints in core markets or failed expansion launches
    - Discount global portability assumptions and re-score product consistency
  - - GO fulfillment dependency
    - City coverage, sell-out frequency, refund requests, and repeated-film incidence
    - Persistent failures outside major cities or declining partner-cinema footprint
    - Treat GO as optional upside rather than core value driver
  - - Platform and billing dependency
    - Support tickets, involuntary churn, or dispute rates by Apple / Google / Roku / web channel
    - Meaningful channel-specific churn or repeated browser / DRM incidents
    - Push harder toward direct billing and fund support plus QA remediation
  - - People / governance concentration
    - Founder departure, senior content turnover, or no evidence of policy review cadence
    - Founder exit, multiple senior departures, or no funding-policy review in twelve months
    - Move from invest to research-more or thesis-break depending on severity
  notes: Kill criteria are designed to be monitorable from diligence requests or recurring management reporting rather than from broad narrative judgments.
