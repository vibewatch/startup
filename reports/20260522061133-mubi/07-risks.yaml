company:
  name: MUBI
chapter:
  number: 7
  title: Risks
  summary: >-
    MUBI’s highest-conviction risks are mission-linked reputational shocks, concentration in prestige-content bets, and dependence on third parties for rights, app distribution, DRM, and GO cinema fulfillment. Public evidence shows the Sequoia backlash cost more than 200,000 subscribers before a rebound to 1.7 million, while MUBI’s own terms and support materials show how catalog rights, platform billing, browser support, and venue availability can all weaken the user promise. The mitigation story is real but young: MUBI now has an ethical funding policy and founder-controlled governance response, yet public evidence remains thin on implementation depth, succession, title-level ROI, and GO operating quality.
sections:
- id: risk-ranking-framework
  title: Risk-ranking framework
  body: >-
    This chapter ranks MUBI’s risks by combining observable evidence on likelihood, impact, mitigation maturity, and residual exposure rather than by guessing from startup archetypes. The company is unusual because it is not just a streamer. It sits across streaming subscriptions, theatrical distribution, festival-adjacent programming, and MUBI GO’s cinema-ticket workflow. That hybrid model gives it multiple monetization paths, but it also multiplies failure surfaces: a financing controversy can affect filmmakers and venues, a territorial-rights gap can affect perceived catalog quality, and a browser or billing issue can become churn if the customer cannot easily fix it.


    The public record supports one clear conclusion: MUBI is resilient but not shock-proof. Variety reported that the Sequoia controversy cost more than 200,000 subscribers before the base recovered to a record 1.7 million in Q1 2026, which means the brand can absorb controversy but not without real revenue and trust damage. At the same time, MUBI’s most visible successes and setbacks cluster around prestige-film outcomes such as The Substance and Die My Love. That makes risk transmission unusually direct: content economics, creative relationships, platform reliability, and capital-governance decisions can all move the same subscriber and valuation levers.


    Where public evidence is thin, this chapter leaves explicit gaps rather than overstating certainty. The deepest unknowns are not whether these risks exist; they are how concentrated they are inside churn cohorts, title-level ROI, GO city coverage, and founder-level decision rights.
