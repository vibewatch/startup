- id: reputational-and-content-economics
  title: Political / reputational and content-economics risk
  body: >-
    The sharpest non-technical risk is that MUBI’s brand sits close to its artistic community, so capital decisions can transmit quickly into creators, venues, and subscribers. The Sequoia episode is the reference case. Public coverage shows that the backlash was not confined to commentary online: filmmakers signed open letters, festivals and venues pulled out of MUBI-linked programming, boycott calls circulated, and Variety later reported that MUBI lost more than 200,000 subscribers before the base recovered. That pattern matters because MUBI sells taste, trust, and community, not commodity catalog breadth. A brand built on values and curation can recover, but it is structurally more exposed to mission misalignment than a generic entertainment bundle.


    The second major risk is concentration in prestige-title economics. MUBI’s recent public narrative pairs a breakout upside case with a downside case. The Substance became a visible success and was tied to subscriber momentum, while Die My Love was reported as a $24 million Cannes acquisition and later as a weaker commercial outcome. Investors should read that not as proof that MUBI should stop bidding for films, but as proof that large bets can swing sentiment and returns. MUBI is large enough to make consequential acquisitions and still small enough for a few misses or controversies to matter.


    Mitigation exists but remains incomplete. Management responded with an ethical funding policy, an artists advisory structure, and public clarification that Sequoia is a minority investor. Those are useful moves, yet they do not erase the demonstrated path by which financing choices and slate choices can both hit growth, partner trust, and valuation at once.
