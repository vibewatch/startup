- id: legal-licensing-and-product-limits
  title: Legal / licensing / product-limitation risk
  body: >-
    Licensing and territorial complexity is not a side issue for MUBI; it is part of the product contract. MUBI’s own terms say the service is not available in all countries, that content availability varies with licensing, and that some offline titles will not play where streaming rights do not permit it. The travel FAQ adds that audio and subtitle options also vary by country. That means the same subscription can feel materially different across markets, which raises both customer-experience risk and operational complexity for any thesis that assumes global portability of the brand.


    The GO product adds a separate legal and operational layer. GO is available only in a limited set of countries, offers one selected 2D ticket per week, and makes no guarantee on cinema, showtime, or title availability. MUBI is explicit that it is not directly affiliated with the listed cinemas and is not responsible when screenings sell out or change. That candor lowers disclosure risk but confirms dependency risk. It also means that a customer can blame MUBI for a failure surface that MUBI does not fully control.


    Product quality limitations are likewise openly acknowledged. MUBI says HD and 4K depend on the quality of available masters, recommends at least 10 Mbps and sub-100ms latency for strong playback, supports only current browser versions on desktop, and sometimes requires users to update Widevine or operating systems to keep watching. Downloads must stay on internal memory. These are not fatal flaws, but together they show that MUBI’s experience is bounded by rights, source masters, hardware, OS, browser, and DRM realities. Public privacy disclosures also show live data-handling obligations without revealing assurance depth.
