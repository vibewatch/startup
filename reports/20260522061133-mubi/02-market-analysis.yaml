- id: growth-drivers-constraints-and-valuation-relevance
  title: Growth drivers, constraints, and valuation relevance
  body: 'The market setup around MUBI is attractive in one sense and unforgiving in another. The attractive side is that overall entertainment-and-media spending is still growing, specialty services can justify premium pricing when they own a strong taste proposition, and MUBI''s curated plus theatrical format gives it a sharper identity than yet another all-purpose SVOD app. Criterion, OVID, BFI, and Curzon all reinforce that buyers still pay for selection and cultural framing, while MUBI''s multi-device and download messaging removes some of the historical usability discount that once attached to niche streamers. The difficult side is that consumer wallet data, churn, and ad-supported migration all point the other way. Deloitte shows consumers are not expanding subscription budgets indefinitely, Comscore shows value-seeking behavior is pushing viewing toward FAST and ad tiers, and MUBI''s own standard price overlaps with cheaper entry points from much broader substitutes. The public evidence
    also leaves crucial unknowns: peer share is opaque, GO is geographically constrained, and MUBI''s revenue split between streaming, theatrical, and broader film commerce is undisclosed. For valuation, that means the upside case depends on premium willingness-to-pay, catalog differentiation, and hybrid cinema economics, while the downside case is ordinary streaming churn plus specialty-rights friction. Underwriting should therefore focus less on generic streaming TAM rhetoric and more on cohort retention, regional rights coverage, GO unit economics, and the margin profile of non-subscription revenue.'
