  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: market-sizing-gap
    missingEvidence: A management-grade model or third-party market workbook isolating curated-film SVOD households, subscriber counts, and spend by geography.
    whyItMatters: Without this, TAM/SAM/SOM for MUBI's true niche remains an evidence-constrained range exercise rather than an underwritten market-size estimate.
    diligencePath: Request management's internal market model and any specialist research on curated-film or prestige-cinema subscription demand by region.
    relatedQuestionRefs:
    - QM019
    - QM020
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: revenue-mix-gap
    missingEvidence: A current revenue split for MUBI across standard subscriptions, student plans, GO memberships, theatrical distribution, and any production or rights income.
    whyItMatters: The correct comparable set and margin profile change meaningfully depending on how much of MUBI's economics come from software subscription versus film-commerce activity.
    diligencePath: Request a recent product-line P&L and gross-margin bridge covering subscription, GO, theatrical, and distribution revenue.
    relatedQuestionRefs:
    - QM017
    - QM021
    - QM025
  - type: private-evidence-only
    severity: material
    topic: cohort-economics
    missingEvidence: Plan-level conversion, retention, churn, and GO redemption data by geography and acquisition channel.
    whyItMatters: Public app installs and public prices do not reveal whether MUBI's premium positioning is durable enough to support valuation assumptions.
    diligencePath: Request cohort tables for free-trial conversion, monthly retention, reactivation, and GO usage by city and plan.
    relatedQuestionRefs:
    - QM010
    - QM011
    - QM022
    - QM023
    - QM024
  - type: private-evidence-only
    severity: minor
    topic: rights-coverage
    missingEvidence: A regional rights and catalog-availability matrix covering where key titles and plan types are actually purchasable.
    whyItMatters: Regional rights constraints can break the connection between app discovery, title demand, and paid conversion.
    diligencePath: Request a territory-by-territory catalog availability report and plan-availability map for standard, student, and GO tiers.
    relatedQuestionRefs:
    - QM024
