- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Hand-picked curation and editorial framing
    - Driver
    - Near term
    - Supports willingness to pay despite a narrower library because buyers are selecting for taste, not catalog breadth
    - Request retention and conversion data by title cadence and editorial engagement
  - - Hybrid GO bridge between streaming and theaters
    - Driver
    - Near to medium term
    - Differentiates MUBI from pure SVOD and may lift brand salience if redemption economics work
    - Request city-level GO redemption, subsidy, and partner-theater unit economics
  - - Overall E&M growth and prestige-film demand
    - Driver
    - Medium term
    - Shows the outer entertainment envelope is still expanding even if MUBI only captures a thin slice of it
    - Request management's internal market model linking prestige demand to paid conversion
  - - Fixed consumer entertainment budget and SVOD churn
    - Constraint
    - Immediate
    - Caps add-on subscription appetite and raises the risk that MUBI is treated as rotational rather than permanent
    - Request churn, reactivation, and tenure by plan and geography
  - - Ad-supported and FAST migration
    - Constraint
    - Immediate to medium term
    - Pushes consumers toward cheaper or free substitutes that MUBI does not mirror because its positioning is premium and ad-free
    - Request willingness-to-pay testing, promo strategy, and bundle experiments
  - - Price overlap with broader SVOD alternatives
    - Constraint
    - Immediate
    - MUBI must justify premium pricing against cheaper entry tiers from Netflix, Prime Video, and Max
    - Request win/loss research on why buyers choose or reject MUBI at current prices
  - - Rights, geography, and product-quality friction
    - Constraint
    - Medium term
    - Regional catalog limits, GO city availability, and app-performance complaints can slow adoption or raise churn
    - Request regional rights coverage, plan availability, and complaint-resolution metrics
  notes: The driver/constraint mix matters more than a single TAM figure because MUBI's premium niche can grow with strong taste differentiation yet still underperform if wallet pressure or regional friction dominate.
