chapter:
  number: 2
  title: Market Analysis
  summary: 'MUBI sits in a narrow premium-curated-film niche inside a much larger entertainment and streaming wallet, so the market cannot be summarized with one oversized TAM. The strongest public evidence is a set of lenses: PwC''s broad global entertainment-and-media envelope, Deloitte and Comscore signals that consumer streaming budgets are finite and moving toward cheaper ad-supported options, and public price/positioning evidence showing that MUBI competes most directly with taste-driven specialty services while still fighting for the same household wallet as Netflix, Prime Video, and Max. MUBI''s key differentiator is the hybrid GO model that links curated streaming to weekly theatrical attendance, but accessible public sources do not isolate a clean curated-film SAM or reveal the split between MUBI''s subscription and distribution economics.'
sections:
- id: market-boundary-and-adjacencies
  title: Market boundary and adjacencies
  body: 'The right boundary for MUBI is narrower than “global streaming” but broader than “one more arthouse app.” Its core market is premium curated film streaming: an ad-free subscription whose value proposition is selection, taste, editorial framing, and global cinema rather than catalog breadth, sports, or live-TV utility. MUBI''s public storefront makes that explicit by leading with curated streaming and a separate MUBI GO tier that adds a weekly cinema ticket, while Criterion, OVID, BFI Player, and Curzon Home Cinema all frame their own offers around hand-picked, art-house, or independent film discovery. That is MUBI''s closest comparable set. Netflix, Prime Video, Max, and AMC+ still matter because they compete for the same discretionary entertainment budget, but their homepages emphasize mass-market breadth, bundles, sports, live TV, and mainstream series rather than cinephile curation. A further outer ring is film-commerce adjacency: Curzon and BFI mix subscription with rentals
    or cinema institutions, while investor-facing surfaces from Netflix, AMC Global Media, Cineverse, and CuriosityStream show that public comparables span not just general SVOD but broader content-platform and distribution models. The market boundary should therefore include curated-film subscription spend and hybrid streaming-plus-theatrical membership, treat general SVOD as the main substitute wallet, and treat theatrical or distribution economics as strategically important adjacencies rather than imaginary TAM.'
