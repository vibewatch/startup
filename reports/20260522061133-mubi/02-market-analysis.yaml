- id: sizing-lenses-and-where-precision-breaks
  title: Sizing lenses and where precision breaks
  body: 'Accessible public evidence supports multiple market lenses, not a single precise MUBI TAM. At the widest level, PwC says global entertainment-and-media revenue reached US$2.9 trillion in 2024 and could rise to US$3.5 trillion by 2029, but that category includes advertising, internet access, games, and many other segments far outside MUBI''s operating reality. A more decision-useful lens is the current consumer streaming wallet: Deloitte says U.S. subscribers report spending an average of $69 per month across four paid streaming services, while 39% say they canceled at least one paid SVOD service in the prior six months. Comscore adds that viewing mix is shifting toward ad-supported and FAST options, reinforcing that consumer budgets are finite even while total media revenue grows. The closest public lens to MUBI''s actual niche is price and positioning. OVID and BFI Player anchor the low end of the curated-film band, MUBI and MUBI GO sit in the middle and high end, and Netflix,
    Prime Video, and Max show where mainstream substitutes price broad-library convenience. App-store downloads show discovery reach, but not willingness to pay. Because retained public sources do not disclose peer subscriber counts or a clean split between MUBI''s streaming and theatrical economics, the defensible conclusion is evidence-constrained: use boundary, wallet, price, and discovery lenses together and do not pretend a clean curated-film SAM is publicly observable.'
