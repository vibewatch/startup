figures:
- id: FM001
  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: Boundary lens moving from the broad entertainment envelope down to the narrower premium curated-film niche that MUBI can plausibly address with public evidence.
  data:
    nodes:
    - label: 'Outer envelope: global entertainment & media revenue = US$2.9T in 2024, heading to US$3.5T by 2029'
      detail: PwC's broad category captures far more than streaming and should be treated only as the outer context.
      tone: neutral
    - label: 'Consumer streaming wallet: US subscribers report spending US$69 per month across four paid services'
      detail: Deloitte's wallet lens is much closer to the real budget battle MUBI faces than the outer E&M envelope.
      tone: neutral
    - label: 'Premium curated-film price band: roughly US$6.99 to US$19.99 per month in public specialty offers'
      detail: OVID, MUBI, MUBI GO, and BFI show the narrow public niche where taste-based film services actually price.
      tone: positive
    - label: 'MUBI-specific niche: ad-free curated streaming plus a weekly cinema-ticket membership'
      detail: MUBI GO narrows the market further by linking streaming to local theatrical attendance rather than competing only as generic SVOD.
      tone: positive
  approximationNotes: The layers intentionally mix revenue, wallet, and pricing lenses because retained public sources do not expose a clean specialty-curated TAM/SAM. The figure is a boundary pyramid, not an additive waterfall.
