tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Premium curated film streaming
    - Ad-free subscriptions centered on hand-picked global, independent, prestige, or art-house film catalogs
    - Broad TV utility, sports, live news, and mass-market volume libraries
    - Individual cinephile or culture-focused household paying directly
    - This is MUBI's core market and the closest fit with its standard plan
  - - Hybrid streaming + theatrical membership
    - Subscription revenue tied to weekly cinema-ticket redemption plus at-home catalog access
    - Standalone box-office trips without membership, or generic SVOD with no local redemption step
    - Individual moviegoer pays directly; exhibitors participate in the redemption chain
    - This is MUBI's most distinctive extension beyond pure SVOD via MUBI GO
  - - General SVOD / bundle platforms
    - Mass-market subscriptions spanning originals, franchises, ads, sports, live TV, and bundles
    - Taste-led curation as the primary reason to buy
    - Household entertainment budget owner
    - These are the main substitute services competing for the same wallet
  - - Specialty niche streaming peers
    - Art-house, documentary, or independent-film subscriptions and related editorial/context products
    - Mass-market breadth and live-TV utility
    - Individual cinephile, student, or prestige-oriented household
    - This is the closest public comparable set for MUBI's curated positioning
  - - Theatrical / distribution adjacency
    - Rentals, cinema memberships, and film-commerce or distribution economics that convert discovery into ticket or rights revenue
    - Pure software-only subscription economics
    - Consumer plus exhibitor, rights-holder, or distributor ecosystem
    - Relevant because MUBI's hybrid offer and broader film strategy sit next to this adjacency
  notes: Boundary logic deliberately separates MUBI's core curated-subscription niche from broader streaming substitutes and from theatrical/distribution adjacencies instead of collapsing them into one TAM.
