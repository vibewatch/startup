  foundingLocation: "London, United Kingdom"
  headquarters: "London, United Kingdom"
  productSummary: >
    MUBI sells a curated streaming membership, a higher-priced MUBI GO tier that adds one selected weekly
    cinema ticket, owned editorial publishing through Notebook, and a widening film-distribution / rights
    operation around prestige titles.
  customerFocus: >
    Direct-to-consumer cinephiles, students, urban moviegoers using MUBI GO, and prestige-oriented households
    willing to pay for curation, community, and art-house discovery rather than mass-market breadth.
  businessModel: >
    Consumer subscription revenue from standard, student, and GO memberships sits alongside publishing,
    theatrical distribution, and production-adjacent film-rights economics, making MUBI a hybrid streaming and
    film-commerce business rather than a pure SVOD service.
  stage: "Growth-stage private / unicorn-stage"
  fundingStatus: >
