artifact: competitors
slug: mubi
runDate: "2026-05-22"
company:
  name: MUBI
chapter:
  number: 3
  title: Competitors
  summary: >-
    MUBI's closest direct competitors are specialty film services such as Criterion Channel,
    OVID, BFI Player, and Curzon Home Cinema rather than only mass-market streamers, and
    those direct peers generally post lower entry prices for similarly curation-led value
    propositions. MUBI's sharpest differentiation is the GO weekly-cinema-ticket bundle and
    its broader curator-publisher-distributor identity, but pure streaming switching costs are
    low because device support and downloads are largely commoditized while incumbents attack
    from the other side with cheaper entry tiers, bundles, live or sports utility, and free
    institution-paid alternatives such as Kanopy. Competitive durability therefore rests less
    on technical lock-in than on MUBI's ability to sustain premium willingness to pay,
    city-level GO utility, and brand trust.
sections:
  - id: landscape-and-competitive-set
    title: Landscape and competitive set
    body: >-
      The most useful competitor frame for MUBI starts with specialty film services, not with
      the entire streaming universe. Criterion Channel, OVID, BFI Player, and Curzon Home
      Cinema all market hand-picked, world, independent, or film-culture-oriented viewing
      rather than the broad TV utility that dominates Netflix, Prime Video, HBO Max, and
      AMC+. That makes them MUBI's closest direct peers on taste-led discovery, editorial
      framing, and willingness to pay for cinema identity. At the same time, the household
      budget is not partitioned so neatly. Netflix, Prime Video, Max, and AMC+ still compete
      because they offer cheaper or comparable entry points inside much broader entertainment
      packages. Kanopy matters as a different kind of substitute again: it offers ad-free film
      viewing at zero end-user price when a library or university is paying. Theatrical
      moviegoing also remains both substitute and channel, because MUBI GO explicitly ties the
      membership to one selected weekly cinema ticket and competitors such as BFI and Curzon
      also sit close to cinema or rental ecosystems.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP006
