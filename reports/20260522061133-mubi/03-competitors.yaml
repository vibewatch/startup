figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    layout: wide
    summary: >-
      Ordinal positioning of key competitors across two evidence-backed axes: breadth and
      convenience utility on the x-axis and curation or theatrical distinctiveness on the y-axis.
    data:
      points:
        - label: "MUBI"
          x: 4
          y: 9
          detail: "High curation distinctiveness and GO theatrical bridge, but much narrower breadth than incumbents"
        - label: "Criterion Channel"
          x: 3
          y: 8
          detail: "Very strong cinephile positioning and editorial extras, but no theatrical bundle"
        - label: "OVID"
          x: 2
          y: 7
          detail: "Strong art-house and documentary identity at low price, but narrower scale and utility"
        - label: "BFI Player"
          x: 4
          y: 8
          detail: "Strong film-culture authority with subscription, rental, and free layers"
        - label: "Curzon Home Cinema"
          x: 5
          y: 7
          detail: "Cinema-linked curation with latest-films-at-home positioning, but more transactional than subscription-led"
        - label: "Kanopy"
          x: 5
          y: 6
          detail: "Library-backed free substitute with thoughtful film positioning and broad device access"
        - label: "Netflix"
          x: 10
          y: 2
          detail: "Maximum household breadth and utility, minimal taste-led differentiation"
        - label: "Prime Video"
          x: 10
          y: 3
          detail: "Very broad utility because sports, live TV, and subscriptions sit alongside films"
        - label: "HBO Max"
          x: 8
          y: 4
          detail: "Premium series and movie utility with bundle leverage, but not a cinephile-first proposition"
        - label: "AMC+"
          x: 6
          y: 4
          detail: "Stronger bundle and genre-pack value than specialty taste singularity"
    approximationNotes: >-
      Axes are ordinal and evidence-backed, not independently benchmarked metrics. Breadth and
      convenience utility reflects bundle scope, mainstream content breadth, and household-use
      flexibility; curation and theatrical distinctiveness reflects the degree to which the offer
      is framed around taste authority, film culture, or cinema adjacency.
