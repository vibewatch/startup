      - FP001
  - id: pricing-packaging-and-capability-comparison
    title: Pricing, packaging, and capability comparison
    body: >-
      Posted pricing and packaging reinforce that MUBI is selling a premium niche offer, not a
      discount specialty product. Criterion advertises $10.99 per month, OVID $6.99, and BFI
      Player £6.99, while AMC+ sells a lower-priced multi-brand bundle and Netflix's ad tier
      starts below MUBI's standard plan. PCMag's review makes the contrast explicit by noting
      that Criterion costs less than MUBI while MUBI GO costs more because it includes a weekly
      hand-picked movie ticket in select cities. Capability-wise, the direct specialty set is
      closer to parity than the pricing spread suggests. Criterion, OVID, BFI, Curzon, and
      Kanopy all foreground curation, discovery, or film education in some form, while device
      access, downloads, and TV support are no longer distinctive enough to be a durable moat on
      their own. The real divergence is packaging logic: MUBI sells curation plus theatrical
      access, Kanopy shifts payment to institutions, Curzon keeps a transactional no-subscription
      route, and incumbents sell broader household utility with bundles, live channels, or
      sports.
    claimRefs:
      - CP015
      - CP016
      - CP017
      - CP018
      - CP019
      - CP020
      - CP021
      - CP037
      - CP038
      - CP039
    tableRefs:
      - TP002
      - TP003
    figureRefs:
      - FP002
  - id: switching-costs-multi-homing-and-distribution-power
    title: Switching costs, multi-homing, and distribution power
    body: >-
      For pure streaming memberships, switching cost is structurally low. Criterion, OVID, BFI,
      Netflix, and MUBI all present monthly or trial-led consumer purchases rather than hard
      contracts, which means many users can add, cancel, or rotate services with relatively
      little friction. That matters because MUBI is not defending a proprietary operating
      system, unique device footprint, or deeply embedded workflow. The strongest lock-in in the
      retained set comes from distribution or payer structure rather than technology. Kanopy is
      harder to displace in a different way because the library or university, not the viewer,
      is the payer. Prime Video, Max, and AMC+ gain distribution power from being one element of
      a larger bundle or household content stack. MUBI GO creates some real friction because it
      depends on billing country, selected cinemas, and weekly title availability, but that same
      operational complexity can also constrain scale. The practical result is a market where
      multi-homing is common and where MUBI's competitive defense depends more on identity and
      habit than on hard contractual lock-in.
    claimRefs:
      - CP022
      - CP023
      - CP024
      - CP025
      - CP030
      - CP031
      - CP033
      - CP040
  - id: moat-durability-and-competitive-risk
    title: Moat durability and competitive risk
    body: >-
      The chapter-level moat conclusion is nuanced. MUBI does have a differentiated position:
      GO's weekly cinema ticket is visibly distinct in the retained set, and MUBI's own about
      page claims a broader curator-publisher-distributor role than a simple streaming app.
      But the underlying curation proposition is not exclusive. Criterion, OVID, BFI, Curzon,
      and Kanopy all market taste, film education, global cinema, or thoughtful discovery, so
      the direct-peer set can reproduce much of the same emotional value proposition at lower
      list prices or with institution-paid access. That makes premium willingness to pay and
      brand trust central to the underwriting question. Variety's reporting that MUBI lost
      subscribers during its 2025 PR storm is therefore competitively relevant: a niche cultural
      brand can lose retention if buyers decide its identity no longer justifies the premium.
      Meanwhile, incumbents retain the option to respond through cheaper ad tiers, broader
      bundles, live or sports utility, or prestige-film acquisition without asking households to
      add yet another specialty subscription. Public data still does not reveal peer share,
      churn, overlap, or cohort retention, so durable competitive advantage remains only partly
      observable from outside.
    claimRefs:
      - CP026
      - CP027
      - CP028
      - CP029
      - CP032
      - CP034
      - CP035
      - CP036
