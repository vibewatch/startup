  - id: scale-traction-and-film-strategy
    title: Scale signals, traction, and film-strategy evolution
    body: >-
      MUBI now presents itself less like a niche catalog subscription and more like a scaled,
      vertically ambitious film company, but its public metrics require careful normalization. Tech
      Funding News described the platform as having 20 million registered users globally, while 2026
      trade reporting citing the Wall Street Journal said MUBI ended 2025 near 1.2 million paying
      subscribers and then recovered to a record 1.7 million in the first quarter of 2026. Latka, by
      contrast, advertises 8.4 million customers and $77 million of 2024 revenue, while public app
      listings show 5 million-plus Android downloads. These are useful signals, but they are not the
      same funnel, so the right read is directional scale rather than a single canonical audience
      number. Strategically, the stronger story is MUBI’s move up the value chain. Wikipedia and
      Tech Funding News describe ownership of The Match Factory and a majority stake in Cinéart,
      while official MUBI film pages and Oscars evidence show the company leaning into prestige film
      distribution around titles such as “The Substance” and “The Zone of Interest.” The 2025 Cannes
      purchase of “Die, My Love” for a reported $24 million then demonstrates the other side of that
      ambition: MUBI is taking larger content-risk positions that can influence both brand prestige
      and financial volatility.
