evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: public-leadership-roster
    missingEvidence: A full current executive roster, board list, and governance chart for MUBI.
    whyItMatters: >-
      Leadership concentration and governance oversight are central to underwriting a founder-led private media company,
      especially after the Sequoia controversy.
    diligencePath: Request the latest board deck, cap-table summary, and executive organization chart from management.
    relatedQuestionRefs:
      - QO014
      - QO025
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-board-rights
    missingEvidence: >-
      Exact Sequoia ownership percentage, liquidation terms, board or observer rights, and any veto provisions tied to
      the 2025 round.
    whyItMatters: >-
      Public reporting confirms the round but not the control mechanics that matter for downside protection, strategic
      flexibility, and governance risk.
    diligencePath: Review financing documents, shareholder agreements, and the post-round board consent package.
    relatedQuestionRefs:
      - QO014
      - QO025
      - QO027
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount-and-audience-metric-definitions
    missingEvidence: >-
      A reconciled KPI pack defining registered users, paying subscribers, customers, app users, and active employees on
      the same reporting date.
    whyItMatters: >-
      Scale metrics are directionally useful today but not directly comparable, which can distort both valuation comps
      and operating-leverage assumptions.
    diligencePath: Ask management for time-series KPI definitions and the exact numerator/denominator for each published metric.
    relatedQuestionRefs:
      - QO011
      - QO020
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table-coverage
    missingEvidence: >-
      A full internal chronology covering licensing, legal, regulatory, and internal launch milestones in addition to
      the public events retained here.
    whyItMatters: >-
      The public chronology is sufficient for orientation, but later diligence should know whether undisclosed
      regulatory or licensing events altered risk.
    diligencePath: >-
      Request a management timeline and legal summary covering key approvals, disputes, and internal launches since
      2024.
    relatedQuestionRefs:
      - QO024
      - QO026
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: audited-financial-performance
    missingEvidence: >-
      Audited financial statements, cash-burn detail, content amortization policy, and direct evidence for subscriber
      economics or ARR.
    whyItMatters: >-
      Trade reporting gives useful snapshots, but investment judgment requires verified financial durability rather than
      single-article disclosures.
    diligencePath: >-
      Request audited FY2024-FY2025 financials, monthly subscriber waterfall data, and content-cash-commitment
      schedules.
    relatedQuestionRefs:
      - QO019
      - QO025
      - QO027
  - type: private-evidence-only
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      A management-grade model or third-party market workbook isolating curated-film SVOD households, subscriber counts,
      and spend by geography.
    whyItMatters: >-
      Without this, TAM/SAM/SOM for MUBI's true niche remains an evidence-constrained range exercise rather than an
      underwritten market-size estimate.
    diligencePath: >-
      Request management's internal market model and any specialist research on curated-film or prestige-cinema
      subscription demand by region.
    relatedQuestionRefs:
      - QM019
      - QM020
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: revenue-mix-gap
    missingEvidence: >-
      A current revenue split for MUBI across standard subscriptions, student plans, GO memberships, theatrical
      distribution, and any production or rights income.
    whyItMatters: >-
      The correct comparable set and margin profile change meaningfully depending on how much of MUBI's economics come
      from software subscription versus film-commerce activity.
    diligencePath: >-
      Request a recent product-line P&L and gross-margin bridge covering subscription, GO, theatrical, and distribution
      revenue.
    relatedQuestionRefs:
      - QM017
      - QM021
      - QM025
  - type: private-evidence-only
    severity: material
    topic: cohort-economics
    missingEvidence: Plan-level conversion, retention, churn, and GO redemption data by geography and acquisition channel.
    whyItMatters: >-
      Public app installs and public prices do not reveal whether MUBI's premium positioning is durable enough to
      support valuation assumptions.
    diligencePath: Request cohort tables for free-trial conversion, monthly retention, reactivation, and GO usage by city and plan.
    relatedQuestionRefs:
      - QM010
      - QM011
      - QM022
      - QM023
      - QM024
  - type: private-evidence-only
    severity: minor
    topic: rights-coverage
    missingEvidence: >-
      A regional rights and catalog-availability matrix covering where key titles and plan types are actually
      purchasable.
    whyItMatters: Regional rights constraints can break the connection between app discovery, title demand, and paid conversion.
    diligencePath: >-
      Request a territory-by-territory catalog availability report and plan-availability map for standard, student, and
      GO tiers.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: peer-share-and-scale
    missingEvidence: >-
      Specialty-peer subscriber counts, viewing share, and overlap data for Criterion, OVID, BFI Player, Curzon, and
      Kanopy.
    whyItMatters: >-
      Without direct-peer scale data, the analysis can classify competitors and pricing pressure but cannot quantify
      share capture or exact relative scale.
    diligencePath: >-
      Request management's peer-benchmarking deck and any third-party audience overlap analysis used in planning or
      investor materials.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: minor
    topic: apples-to-apples-pricing
    missingEvidence: >-
      Market-specific standalone Prime Video pricing and a comparable retained benchmark for theatrical out-of-pocket
      spend.
    whyItMatters: >-
      The pricing table can show directionally that incumbents pressure MUBI, but it cannot produce a perfect
      like-for-like consumer price ladder across every substitute.
    diligencePath: >-
      Pull the exact retail pricing pages for the target geography and add a current average-ticket benchmark for the
      same cities where MUBI GO operates.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: retention-and-switching-cost
    missingEvidence: >-
      Cohort retention, reactivation, overlap, and city-level GO redemption economics across MUBI standard, GO, and key
      substitute cohorts.
    whyItMatters: >-
      Public surfaces show positioning and packaging but cannot prove whether MUBI's curation and theatrical bundle
      create durable retention or simply expensive acquisition.
    diligencePath: >-
      Request monthly cancellation, reactivation, and GO redemption dashboards segmented by geography, plan, and
      source-of-acquisition.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: subscription-arpu
    missingEvidence: >-
      Realized net subscription ARPU by geography, billing channel, and plan tier after app-store fees, taxes, and
      promotions.
    whyItMatters: Without realized ARPU the public subscriber counts cannot be reconciled to reported revenue quality or margin.
    diligencePath: Request monthly billing extracts by plan, country, and store plus discount schedules for FY2025 through Q1 2026.
    relatedQuestionRefs:
      - QI014
      - QI015
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: gtm-efficiency
    missingEvidence: CAC, paid versus organic acquisition mix, churn, payback, cohort retention, and GO redemption rates.
    whyItMatters: >-
      The public surface only shows a self-serve consumer motion; it does not reveal whether growth is efficient or
      subsidized.
    diligencePath: >-
      Request cohort tables, paid-media spend by channel, GO redemption and upgrade funnels, and contribution margin by
      cohort.
    relatedQuestionRefs:
      - QI016
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: >-
      Actual cash on hand, restricted cash, debt, vendor finance, content liabilities, and any undrawn facilities or
      covenants.
    whyItMatters: >-
      Runway cannot be underwritten when the only public lenses are an annual net loss and a one-quarter negative
      cash-flow anecdote.
    diligencePath: Request month-end balance sheets from the Sequoia close through Q1 2026 plus debt and covenant schedules.
    relatedQuestionRefs:
      - QI021
      - QI022
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: blocking
    topic: content-commitments
    missingEvidence: >-
      Title-level minimum guarantees, P&A commitments, co-financing recoup waterfalls, and off-balance-sheet release
      obligations.
    whyItMatters: >-
      Larger film bets can swing cash needs far more than the subscription P&L, especially when box office misses
      acquisition cost.
    diligencePath: Request a slate-by-slate cash-flow calendar and contract summary for every title acquired or produced since 2024.
    relatedQuestionRefs:
      - QI019
      - QI022
