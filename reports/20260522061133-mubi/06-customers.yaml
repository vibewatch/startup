- id: adoption-trajectory-and-where-it-is-strongest
  title: Adoption trajectory and where it is strongest
  body: 'The strongest public adoption signal is the core streaming app, especially on Android. Google Play shows 5M+ downloads, 113k reviews, and a 4.4 rating, while Apple shows 4.7 out of 5 from 11K ratings; AppBrain independently records 81,289 reviews on Android. Those are unusually visible proof points for a niche film service. By contrast, the GO tier is much smaller and more operationally constrained: its Android app shows 50K+ downloads, 597 reviews, and a 3.9 rating. Trade reporting adds the best available top-line customer metric: Variety and IndieWire say MUBI lost 200,000 subscribers during the 2025 backlash but rebounded to a record 1.7 million subscribers in Q1 2026. Taken together, that suggests adoption is strongest in the global streaming membership and much thinner in GO, where local cinema availability and billing-country rules limit addressable depth. It also means app-store reach should not be confused with paying-customer count; the cleanest durability number is still
    missing.'
