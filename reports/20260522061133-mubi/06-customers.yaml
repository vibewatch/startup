- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Maps the likely journey from discovery into paid streaming, community-led habit formation, and optional GO upgrade for MUBI’s core cinephile customer.
  data:
    items:
    - label: Awareness
      note: Customer encounters MUBI through festival buzz, prestige titles, word of mouth, Notebook/editorial surfaces, or specialty-film comparisons.
    - label: Trial and evaluation
      note: Prospect tests the service through the free trial, student pricing, app stores, or curiosity around a specific acclaimed title.
    - label: Paid membership
      note: Customer chooses the standard streaming plan or student plan and begins using the app across web, mobile, and living-room devices.
    - label: Weekly habit
      note: Repeat usage depends on curation, daily additions, community framing, and watch-anywhere convenience rather than library bulk alone.
    - label: Expansion or advocacy
      note: Heavier-engagement users upgrade into GO, stay for prestige releases, or recommend the service to other film enthusiasts.
