- id: retention-repeat-usage-and-satisfaction
  title: Retention, repeat usage, and satisfaction
  body: MUBI’s public retention story is suggestive but incomplete. On the positive side, the main streaming app has strong public satisfaction markers—4.4 on Google Play and 4.7 on the App Store—and PCMag credits daily new content and community features. Those facts support a reasonable hypothesis that curation and editorial framing help build weekly habits. On the negative side, PCMag also flags missing profiles and limited subtitle controls, and broader app-store evidence points to friction around playback, account experience, and regional catalog variation. The GO tier looks weaker than the core app on public ratings, which fits a product that depends on local partner-cinema logistics. Most importantly, there is no public NRR, GRR, renewal, or cohort churn disclosure in the retained set. That means any hard retention conclusion would be invented. The right diligence stance is to treat ratings and subscriber rebound as encouraging but incomplete proxies for actual durability.
  claimRefs:
  - CU029
  - CU030
  - CU031
  - CU032
  - CU033
  tableRefs:
  - TU004
  figureRefs: []
- id: expansion-concentration-and-adverse-signals
  title: Expansion, concentration, and adverse signals
  body: 'MUBI does show visible land-and-expand logic: students can step into the standard plan, core streaming members can upgrade to GO, and hit-film or awards cycles can pull new users into the funnel before curation and community try to hold them. But concentration risk is real. GO depends on selected cinemas and local coverage, so MUBI does not control the entire experience. The broader subscriber base also appears concentrated in a comparatively narrow cinephile segment that is willing to pay for taste and prestige rather than library breadth or low price. The clearest adverse evidence is reputational: trade coverage says MUBI lost 200,000 subscribers during the 2025 backlash, showing that the customer base can react quickly to controversy. The rebound to 1.7 million is encouraging, but because public sources do not split recovery by plan, market, or title cohort, investors should treat customer resilience as plausible rather than proven. The key open risk is not whether demand exists;
    it is how portable and repeatable that demand remains across cohorts.'
