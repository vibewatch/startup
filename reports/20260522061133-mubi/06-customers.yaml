artifact: customers
slug: mubi
runDate: '2026-05-22'
company:
  name: MUBI
chapter:
  number: 6
  title: Customers
  summary: 'MUBI is best evidenced as a direct-to-consumer cinephile subscription business with three visible paying cohorts: a $14.99 standard streaming member, a $9.99 student entrant, and a smaller $19.99 MUBI GO member who also redeems a weekly cinema ticket. Public adoption proof is strongest in the core streaming app—5M+ Android downloads, 113k Google Play reviews, and 4.7/5 on 11K iOS ratings—while trade reporting says subscriptions fell by 200,000 during the 2025 backlash before rebounding to a record 1.7 million in Q1 2026. Curation, community, and hit-film momentum appear to support repeat usage, but MUBI does not publicly disclose cohort retention, plan mix, or geography-level durability.'
sections:
- id: customer-base-and-payer-segmentation
  title: Customer base and payer segmentation
  body: MUBI’s public customer surface is consumer, not enterprise. The homepage, memberships page, terms, and jobs page all describe a film-lover membership built around discovery, curation, and community rather than family entertainment bundles or B2B licensing. That yields three visible paying cohorts. First is the core streaming member paying $14.99 per month for curated viewing. Second is the lower-priced student entrant paying $9.99 per month after a free-trial period, which functions as an acquisition wedge for younger, price-sensitive cinephiles. Third is the $19.99 MUBI GO member, a heavier-engagement customer willing to pay for both streaming and one weekly theatrical ticket. The public record also implies a non-paying or lightly paying editorial audience that browses Notebook and wider MUBI surfaces before converting. Relative to Criterion, OVID, BFI Player, and Curzon, MUBI’s customer proposition is the most explicitly aimed at highly engaged film enthusiasts who value curation
    and a bridge between home viewing and theatrical attendance.
