- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Student tier feeds standard membership
    - Discount cohort may churn after promotional pricing ends
    - Could make entry funnel look broader than long-term paid base
    - Request student-to-standard conversion, renewal, and CAC payback by cohort
  - - Standard members can upgrade to GO
    - GO depends on selected cinemas and local supply
    - High-value cohort may be capacity constrained or city-concentrated
    - Request GO active members by city, partner cinema, and redemption frequency
  - - Prestige releases and awards moments can pull in new members
    - Customer demand may be hit-driven rather than structurally durable
    - Growth can spike around content events and soften between them
    - Request subscriber adds tied to title cohorts and 90/180-day retention
  - - Community and curation deepen engagement
    - Audience is concentrated in cinephiles willing to pay for taste and prestige
    - Limits TAM relative to broader entertainment streamers
    - Test overlap with Criterion, OVID, BFI, and Curzon in win/loss and churn surveys
  - - Direct subscription model preserves customer ownership
    - App stores and cinemas still mediate parts of billing, discovery, or fulfillment
    - Margin and experience can be influenced by third parties
    - Request gross-to-net revenue split by web, app-store, and GO partner channel
  - - Brand can rebound after controversy
    - The 200,000-subscriber shock shows reputational sensitivity
    - Customer base may be more values-sensitive than a pure commodity catalog
    - Ask management for churn bridge, reacquisition cost, and controversy-response playbook
  notes: Expansion logic is visible, but the public record does not disclose the actual movement rates between plans, channels, or geographies.
