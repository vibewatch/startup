- id: proof-of-real-customer-use
  title: Proof of real customer use
  body: 'Because MUBI is a B2C subscription service, named-customer proof does not come in the usual enterprise case-study format. Instead, the best production-use evidence comes from public audience surfaces: large app-store review volumes, high platform ratings, live pricing pages, and press reporting on aggregate subscriber movement. The Android and iOS storefronts prove the core product is actively used at scale; the GO app proves a real but much smaller theater-going cohort; and the student page proves MUBI operates a discounted acquisition program rather than a single undifferentiated membership. Community also matters here. The jobs page and PCMag both frame MUBI as more than a catalog streamer, and that matters because a curation-led service only keeps customers if discovery feels active enough to justify repeat opening of the app. The gap is that MUBI does not publish named customer cohorts, verified annual-plan mix, or any analogous deployment ledger that would let diligence separate
    passionate super-users from casual trialists.'
  claimRefs:
