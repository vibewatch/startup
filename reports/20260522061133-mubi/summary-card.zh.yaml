summary:
  headline: MUBI 确实拥有高端艺术电影品牌，订阅数回升到 1.7M，也跑出了「流媒体 + 策展 + 发行」的差异化模型；但品牌反噬敏感、电影经济高度押爆款、分部利润率不透明，$1B 估值下更适合继续研究。
