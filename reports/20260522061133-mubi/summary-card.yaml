summary:
  headline: >-
    MUBI has a real premium arthouse brand, a rebound to 1.7M subscribers, and a differentiated
    streamer-curator-distributor model, but backlash sensitivity, hit-driven film economics, opaque segment margins, and
    a $1B mark justify a research-more stance.
