  topStrengths:
    - >-
      MUBI owns a differentiated premium arthouse brand that combines curation, editorial context, and a higher-priced
      GO weekly-ticket bundle rather than competing only as another catalog app.
    - >-
      Subscriber recovery to a record 1.7M in Q1 2026 and reported ~$200M of 2025 revenue show real demand and
      monetization beyond boutique scale.
    - >-
      Hybrid streamer-curator-distributor positioning gives MUBI more upside levers than pure niche SVOD, including
      prestige distribution and occasional breakout film economics.
    - >-
      Global reach across 195+ territories and strong app-store adoption provide unusually visible consumer proof for a
      specialty film service.
  topRisks:
    - >-
      The Sequoia backlash cost more than 200,000 subscribers and strained creator or venue relationships, proving brand
      trust can break revenue momentum quickly.
    - >-
      Prestige-content economics are volatile: The Substance was a hit, but the $24M Die, My Love bet and reported $65M
      Q4 2025 negative cash flow show one miss can matter.
    - >-
      Revenue mix, CAC, churn, gross margin, GO reimbursement costs, and cap-table terms remain opaque, making public
      underwriting of unit economics weak.
    - >-
      A $1B mark implies roughly 5x reported 2025 revenue and about $588-$833 per subscriber, leaving limited
      public-evidence upside at the current price.
    - >-
      MUBI depends on licensors, app stores, browser or DRM vendors, and partner cinemas for key parts of delivery and
      customer experience.
  unresolvedGaps:
    - >-
      Audited split of revenue and gross profit across core streaming, GO, theatrical distribution, production, and
      publishing.
    - >-
      Cohort retention, plan mix, geography mix, GO attach rate, and the churn bridge behind the rebound to 1.7M
      subscribers.
    - >-
      Title-level P&L, minimum guarantees, and forward commitments for The Substance, Die My Love, and the upcoming
      slate.
    - >-
      Full cap table, liquidation preferences, board or observer rights, and proof that the ethical-funding response is
      institutionalized.
    - >-
      GO city density, cinema reimbursement economics, and service-level data on availability failures or support
      volume.
