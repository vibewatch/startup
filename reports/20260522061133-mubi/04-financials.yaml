    - territory-rights package
    - MUBI can stream in 195+ territories but each has a unique lineup; database breadth exceeds current watchability
    - 'Low: catalog breadth is public but effective monetizable inventory is not'
    - Provide title-count, viewing, and revenue concentration by territory and rights window.
