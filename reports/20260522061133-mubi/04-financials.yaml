- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Cash balance and restricted cash
    - Runway cannot be estimated credibly and next-round timing cannot be judged
    - Request month-end cash balances from the Sequoia close through Q1 2026, including restricted cash and escrow.
  - - Debt, credit facilities, vendor finance, and content liabilities
    - Hidden fixed claims could make the equity round far less protective than it appears
    - Request debt schedules, covenant packages, content-payable aging, and any recourse or non-recourse facilities.
  - - Revenue split by stream
    - Total revenue alone cannot separate recurring quality from volatile title economics
    - Request audited FY2024-FY2026 bridge across standard subs, student, GO, theatrical, licensing, production, and ancillary revenue.
  - - Gross margin and contribution margin by stream
    - Margin path is impossible to underwrite when GO and film rights may have very different economics from base streaming
    - Request COGS detail, content amortization policy, and stream-level gross margin.
  - - CAC, churn, cohort retention, and GO redemption
    - GTM efficiency and lifetime value cannot be assessed from public data
    - Request acquisition-channel mix, cohort tables, churn, CAC, payback, and GO redemption cost per member.
  - - Store and country mix after fees and taxes
    - Public list price almost certainly overstates realized net ARPU
    - Request billing mix by app store, direct web, and geography with net take rates.
  - - Title-level MG, P&A, and co-financing recoup waterfalls
    - One or two slate decisions could dominate cash needs more than the subscription base does
    - Request slate cash-flow calendar and contract summaries for all major acquisitions and productions since 2024.
  - - Reconciled funding chronology and cap-table rights
    - Database disagreement makes dilution history and financing dependency uncertain
    - Request signed round-by-round schedule with amounts, post-money values, board rights, and investor protections.
  notes: These are the missing fields that matter most for underwriting. The issue is not whether MUBI has demand; it is whether public information is precise enough to separate recurring economics from film-bet volatility.
