    - 'Medium to low: top-line price is public, margin is opaque because ticket reimbursement is undisclosed'
    - Provide redemption rate, cinema reimbursement cost, and contribution margin per active GO member.
  - - Theatrical distribution
    - Acquire rights, release films theatrically, then monetize downstream windows
    - title / territory
    - Clearly evidenced by The Substance and Die, My Love title economics
    - 'Low to medium: title upside is visible but recoup waterfalls and P&A are private'
    - Provide title-level MG, P&A, theatrical, PVOD, and licensing recoup schedules.
  - - Production / co-financing
    - Finance or co-finance originals and auteur slate titles
    - title / slate
    - TFN says capital is funding originals and acquired films; Variety says MUBI struck an IPR.VC co-financing pact
    - 'Low: public evidence confirms activity, not economics'
