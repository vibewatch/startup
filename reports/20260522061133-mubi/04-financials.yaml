- id: capital-needs-and-content-bet-volatility
  title: Capital adequacy hinges on content bets, not only subscriber growth
  body: 'The most important public financial evidence on MUBI is adverse, not promotional. The company raised

    $100 million at a $1 billion valuation in 2025 and said the capital would support global distribution

    and a larger original and acquired-film pipeline. That narrative is easy to believe because the slate

    behavior matches it. “Die, My Love” cost about $24 million across multiple territories and Screen

    reported a 45-day theatrical commitment, while Variety and IndieWire later reported that the film

    grossed only about $12 million theatrically. By contrast, trade coverage says “The Substance” was a

    $12 million acquisition that generated roughly $77 million to $80 million of box office and prestige

    spillover. In other words, MUBI has moved from a relatively clean subscription model into a portfolio

    model where one or two film outcomes can distort quarterly cash needs. That is why the annual net loss

    figure and the Q4 negative cash-flow figure lead to totally different burn lenses. It is also why the

    company''s late-2025 staffing actions and the newly reported IPR.VC co-financing pact matter: both are

    signals that capital structure and slate finance now affect the business as much as subscriber growth.

    Without actual cash balances, debt schedules, or title-commitment disclosures, public runway analysis

    can only be illustrative.'
  claimRefs:
  - CI015
  - CI016
  - CI017
  - CI018
