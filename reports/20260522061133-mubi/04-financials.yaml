- id: traction-unit-economics-and-public-math
  title: Public traction exists, but the revenue math does not reconcile cleanly
  body: 'MUBI''s public traction evidence is directionally strong but financially inconsistent. Trade reporting

    says the company fell to roughly 1.2 million subscribers by the end of 2025, then recovered to a

    record 1.7 million by the end of the first quarter of 2026. Tech Funding News separately says MUBI

    has 20 million registered users, while Latka says it has 8.4 million customers. Those are clearly

    not the same funnel. The same inconsistency appears on the revenue line. Latka lists 2024 revenue at

    $77 million, while Variety and Screen Daily report about $200 million of 2025 revenue from people

    familiar with the situation. If one simply annualizes visible list prices across 1.2 million to 1.7

    million paying subscribers, the implied billing range lands roughly between $144 million and $408

    million depending on plan mix. That overlap with the reported $200 million figure is the point: end-

    period subscribers, list prices, and total annual revenue are not directly comparable because the

    true mix of standard, student, GO, geography, discounts, app-store fees, and non-subscription film

    revenue is private. The GTM motion also appears to be self-serve and app-led rather than sales-led,

    which means CAC and payback are probably governed by marketing efficiency and retention more than by

    human sales productivity. But those decisive unit-economics fields — churn, CAC, payback, gross

    margin, contribution margin, and realized ARPU — are not publicly disclosed.'
