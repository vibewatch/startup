  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: subscription-arpu
    missingEvidence: Realized net subscription ARPU by geography, billing channel, and plan tier after app-store fees, taxes, and promotions.
    whyItMatters: Without realized ARPU the public subscriber counts cannot be reconciled to reported revenue quality or margin.
    diligencePath: Request monthly billing extracts by plan, country, and store plus discount schedules for FY2025 through Q1 2026.
    relatedQuestionRefs:
    - QI014
    - QI015
    relatedTableRefs:
    - TI002
    - TI003
  - type: private-evidence-only
    severity: material
    topic: gtm-efficiency
    missingEvidence: CAC, paid versus organic acquisition mix, churn, payback, cohort retention, and GO redemption rates.
    whyItMatters: The public surface only shows a self-serve consumer motion; it does not reveal whether growth is efficient or subsidized.
    diligencePath: Request cohort tables, paid-media spend by channel, GO redemption and upgrade funnels, and contribution margin by cohort.
    relatedQuestionRefs:
    - QI016
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Actual cash on hand, restricted cash, debt, vendor finance, content liabilities, and any undrawn facilities or covenants.
    whyItMatters: Runway cannot be underwritten when the only public lenses are an annual net loss and a one-quarter negative cash-flow anecdote.
    diligencePath: Request month-end balance sheets from the Sequoia close through Q1 2026 plus debt and covenant schedules.
    relatedQuestionRefs:
    - QI021
    - QI022
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: blocking
    topic: content-commitments
    missingEvidence: Title-level minimum guarantees, P&A commitments, co-financing recoup waterfalls, and off-balance-sheet release obligations.
    whyItMatters: Larger film bets can swing cash needs far more than the subscription P&L, especially when box office misses acquisition cost.
    diligencePath: Request a slate-by-slate cash-flow calendar and contract summary for every title acquired or produced since 2024.
