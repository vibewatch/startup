    - Shows one private-database estimate for the earlier period
    - Provide audited FY2024 revenue by stream and explain any difference from database estimates.
  - - 2025 revenue lens
    - ~$200M (WSJ cited by trade press)
    - medium
    - This is the most relevant current revenue datapoint in public circulation
    - Provide audited FY2025 revenue with stream mix and quarterly cadence.
  - - Annualized list-price billing at 1.2M subs
    - ~$144M-$288M
    - medium-estimated
    - Frames how much plan mix changes any quick ARR-style inference
    - Provide active paying subscribers by plan, geography, and billing channel.
  - - Annualized list-price billing at 1.7M subs
    - ~$204M-$408M
    - medium-estimated
    - Shows why current subs cannot be read as a clean revenue run-rate without private detail
    - Provide Q1 2026 realized net ARPU and recurring billings by plan.
  - - Gross margin / contribution margin
    - null
    - private
    - This is the core question for separating software-like recurring revenue from film-rights economics
    - Provide gross margin by stream and contribution margin for GO versus standard streaming.
  - - CAC / payback / churn / LTV
    - null
    - private
    - Without these, GTM efficiency cannot be underwritten
    - Provide acquisition-source mix, customer cohorts, churn, CAC, and payback by plan.
  - - GO ticket reimbursement cost
    - null
    - private
    - The cinema ticket is the single biggest reason GO should not be treated like plain SVOD
    - Provide average reimbursement per redemption and redemption frequency per GO member.
  - - Revenue recognition by stream
    - null
    - private
    - Reported total revenue is not enough when subscriptions, theatrical, and production economics coexist
    - Provide accounting policy and recognition timing for each stream.
  notes: Rows deliberately preserve contradictory public lenses instead of forcing a single ARR number. Estimated rows use visible plan prices and end-period subscriber counts only; they are not realized revenue.
