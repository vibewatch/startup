  title: Capital adequacy table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Latest primary capital
    - $100M Sequoia round at $1B valuation
    - medium
    - This is the last clearly reported equity infusion and the natural anchor for any runway discussion
    - Provide closing cash bridge from the round date through Q1 2026.
  - - Reported 2025 net result
    - ~$7.3M loss on ~$200M revenue
    - medium
    - Shows accounting profitability remained slightly negative despite meaningful scale
    - Provide audited income statement and reconcile any unusual items or timing effects.
  - - Reported Q4 2025 cash signal
    - $65M negative cash flow
    - medium
    - A single quarter appears to have consumed far more cash than the annual net loss implies
    - Provide quarterly cash-flow statements and explain the Q4 working-capital drivers.
  - - Content outlay example
    - $24M Die, My Love rights package plus 45-day theatrical commitment
    - medium
    - Illustrates how one title can create large upfront cash exposure
    - Provide MG, P&A, and recoup waterfall for the top 10 titles since 2024.
  - - Operating pressure signal
    - Buyouts / layoffs affecting roughly a dozen roles in late 2025
    - medium
    - Staff actions imply management was reacting to cash or growth pressure, not simply optimizing
    - Provide board materials on headcount plans, savings, and revised budget assumptions.
  - - Financing beyond equity
    - Multi-year IPR.VC co-financing pact reported in 2026
    - medium
    - Suggests external slate funding matters to future capital adequacy
    - Provide co-financing agreements, recoup order, and any minimum funding commitments.
  - - Cash, debt, facilities, covenants
    - null
    - private
    - These are the missing variables that determine true runway and next-round timing
    - Provide current balance sheet, debt schedule, and covenant headroom.
  - - Illustrative runway from fresh $100M
    - ~4.6 months on the Q4 cash-use lens vs ~164 months on the annual-loss lens
    - estimated
    - The absurd width proves public data is not sufficient for underwriting-quality runway analysis
    - Provide monthly cash bridge and unrestricted cash balances.
  notes: The runway row is intentionally illustrative, not underwritable. It compares two incompatible public lenses — annual net loss and one-quarter negative cash flow — to show how much private balance-sheet detail is missing.
