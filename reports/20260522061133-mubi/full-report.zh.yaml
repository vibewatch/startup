  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与竞争集合
        blocks:
          - type: paragraph
            body: >-
              对 MUBI 最有用的竞争框架，应从专业电影服务开始，而不是整个流媒体宇宙。Criterion Channel、OVID、BFI Player 和 Curzon Home Cinema
              都营销人工精选、世界电影、独立电影或电影文化取向的观看，而不是 Netflix、Prime Video、HBO Max 和 AMC+
              所主导的宽电视效用。这让它们在品味驱动发现、编辑框架，以及为电影身份付费的意愿上，成为 MUBI 最接近的直接同行。与此同时，家庭预算并不会被切得这么整齐。Netflix、Prime Video、Max 和
              AMC+ 仍然竞争，因为它们在更宽娱乐包里提供更低或可比的入门价格。Kanopy 又是另一类替代品：当图书馆或大学付款时，它以终端用户零价格提供无广告电影观看。院线观影也同时是替代品和渠道，因为 MUBI GO
              明确把会员绑定到每周一张精选电影票，而 BFI、Curzon 等竞争者也靠近影院或租赁生态。
