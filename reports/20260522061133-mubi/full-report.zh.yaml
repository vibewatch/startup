      - number: '4.4'
        title: 真正阻碍是披露缺口，不是需求缺失
        blocks:
          - type: paragraph
            body: >-
              私营公司不需要公布经审计的分部细节才值得投资，但 MUBI
              的公开缺口格外重要，因为其模式已经更资本密集。现有数据足以说明用户愿意为产品付费，订阅增长能在冲击后恢复，公司也能在精品发行成功时创造单片级上行。它不足以告诉承销人：报道收入中有多少是经常性订阅现金，GO
              通过票务报销压低了多少毛利率，电影保底和 P&A 占用了多少营运资本，Q4 2025 现金流下滑后还剩多少现金。上市流媒体公司会发布机器可读的申报数据，让这些问题成为常规分析；MUBI
              不会。正确判断因此是混合的：收入需求看起来真实，但收入质量、利润率路径和资本充足性仍足够不透明，严肃尽调应先把它视为披露问题，其次才是增长故事。
