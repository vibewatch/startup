      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              MUBI
              的买方图谱由消费者主导，但不是一个泛化的流媒体客户。标准策展计划最好理解为核心影迷的直接面向消费者购买：他们更看重人工精选的全球电影、编辑语境和片库差异，而不是宽度。学生计划创造了一个价格敏感的独立群体，预算所有者仍是个人用户，但购买触发来自更深折扣和更长免费试用路径。MUBI
              GO
              又有结构性差异：买方和付款方仍是消费者，但用户旅程包含影院可用性、每周片名选择和票券兑换，因此价值链触及放映商，而不是止步于应用内部。第四类是精品取向家庭，它们已经拥有主流服务，会为了电影节、奖项或文化驱动的观看选择性加购
              MUBI。公开应用商店界面显示这些群体如何进入漏斗：通过应用商店搜索、评论、奖项热度或特定片名兴趣被发现；借助免费期或学生折扣试用；随后在手机、平板、电视和下载场景激活。对尽调的含义是，MUBI
              的用户、买方和付款方通常是同一个人，但他们的预算逻辑、触发事件和替代集合会因细分群体以及产品是纯流媒体还是 GO 混合形态而显著不同。
