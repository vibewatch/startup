        - 全球品牌承诺受版权窗口和语言覆盖限制
      - - 分发和发行运营
        - 处理流媒体之外的影片采购和地域发行
        - 版权卖方、院线 / 放映方和发行规划流程
        - 即便片目承诺扩大，公开工具和流程细节仍稀少
