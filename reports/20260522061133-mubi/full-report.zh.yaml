  - id: FV004
    title: 投资关键指标
    type: kpi
    layout: compact
    summary: 按投委会口径，用 1-5 分评价市场、验证、护城河、经济性、风险、估值和退出清晰度。
    approximationNotes: 分数是分析师判断，综合本章和前文留存证据；5 代表最强，1 代表最弱。
    data:
      items:
        - label: 市场 / 需求验证
          value: 4
          unit: /5
          note: 订阅用户回升至 1.7M，高端观众付费意愿真实存在
        - label: 差异化
          value: 4
          unit: /5
          note: 流媒体、策展方、发行方混合定位，在这个小众赛道有差异化
        - label: 收入质量可见度
          value: 2
          unit: /5
          note: 公开来源仍未清楚拆分经常性收入和波动性收入
        - label: 治理韧性
          value: 2
          unit: /5
          note: 2025 年的反弹事件表明，信任和投资人一致性会影响业务
        - label: 内容执行纪律
          value: 3
          unit: /5
          note: The Substance 加分，Die My Love 提醒不要高估可复制性
        - label: 估值吸引力
          value: 2
          unit: /5
          note: $1B 高于小型上市垂直影视同行，基准情景上行空间有限
        - label: 退出清晰度
          value: 2
          unit: /5
          note: 战略并购路径说得通；IPO 路径噪音仍多
        - label: 综合评分
          value: 2.7
          unit: /5
          note: 资产有意思，但当前价格和尽调缺口让它还达不到确信阈值
    claimRefs:
      - CV005
      - CV008
      - CV036
      - CV041
      - CV048
      - CV049
      - CV050
      - CV051
