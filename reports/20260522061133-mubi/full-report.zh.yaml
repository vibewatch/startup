  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: standard
    summary: 从 MUBI 的高端需求和混合模式出发，经过透明度不足和下行风险，推导当前建议。
    data:
      nodes:
        - id: n1
          label: 高端需求已验证
          detail: 经历 2025 年回落后，2026 年 Q1 末订阅用户达 1.7M
          type: input
        - id: n2
          label: 混合模式仍有上行
          detail: 流媒体 + 策展方 + 发行方 + 制片方，可把爆款变现延伸到纯 SVOD 之外
          type: process
        - id: n3
          label: 经济模型仍不透明
          detail: 公开记录没有清楚披露收入结构、利润率或股权结构表
          type: process
        - id: n4
          label: 价格已偏高
          detail: $1B ≈ 已报道 2025 年收入的 5x，每名订阅用户约 $588–$833
          type: process
        - id: n5
          label: 上市垂直影视可比公司更低
          detail: 可比收入倍数：CuriosityStream ~2x，Cineverse ~1x，AMC ~0.17x
          type: process
        - id: n6
          label: 继续研究
          detail: 置信度中等、风险高、估值偏高
          type: output
      edges:
        - from: n1
          to: n6
          label: 支撑关注
        - from: n2
          to: n6
          label: 支撑溢价
        - from: n3
          to: n6
          label: 压低确信度
        - from: n4
          to: n6
          label: 限制上行空间
        - from: n5
          to: n6
          label: 要求保持纪律
    claimRefs:
