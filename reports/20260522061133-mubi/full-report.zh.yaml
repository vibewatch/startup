  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 经常性订阅旁边，是波动更大的电影版权业务
        blocks:
          - type: paragraph
            body: >-
              MUBI 公开呈现的变现从熟悉的流媒体阶梯开始，但很快比典型 SVOD 价格表更复杂。面向美国的标准计划是每月 $14.99，学生计划在免费试用后每月 $9.99，MUBI GO
              则是高端层级，把完整流媒体访问与每周一张电影票打包。这个差异重要，因为 GO 不只是高端定价；它引入了第二个成本中心，即影院兑换和本地合作伙伴运营。FAQ
              和细则说得很清楚：产品只在指定国家和城市、符合条件的场次、七天兑换窗口内有效。与此同时，MUBI
              自己的帮助页面解释，可见影片数据库远宽于可观看片库，而且每个地区因版权按地理拆分而片单不同。财务上，这意味着标价容易观察，但可变现库存、实际 ARPU
              和毛利率并不容易。公开证据还支持订阅之外的第二类收入：围绕「The Substance」和「Die, My
              Love」等片名的院线发行、收购和贴近制作的活动。因此，收入质量同时取决于两台引擎——一个经常性消费者会员业务，以及一个由片名驱动的电影版权业务；后者的现金时点和利润率波动，从外部更难看清。
