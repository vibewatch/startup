  - id: TP004
    title: 护城河耐久度 / 竞争风险清单
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 为什么重要
      - 缓解措施 / 尽调要求
    rows:
      - - 由品味驱动的策展品牌
        - Criterion、OVID、BFI、Curzon 和 Kanopy 也都主打策展或有思考的发现
        - 中
        - MUBI 的情绪定位真实存在，但在垂直内容直连竞品里并不独占
        - 要求提供同时订阅直接竞品用户的品牌 NPS、留存和观看份额数据
      - - MUBI GO 每周电影票捆绑
        - GO 依赖指定影院、账单国家规则和座位供给
        - 高
        - 最有辨识度的功能，也可能最难在全球或不同城市统一扩张
        - 核查城市级核销、流失、贡献利润和影院合作方集中度
      - - 溢价定价
        - 垂直竞品更便宜，既有玩家还能靠捆绑包或广告档压价
        - 高
        - 一旦溢价付费意愿走弱，MUBI 单靠价格防守的空间有限
        - 按套餐测试留存和重新激活，并对照 Criterion、OVID、Netflix 和 AMC+ 的价格变化
      - - 技术便利性
        - 下载、电视 App 和多设备支持在竞品中已普遍具备
        - 中
        - 产品趋同后，便利性是必要条件，却很少成为决定因素
        - 不要把设备支持单独写进护城河假设；重点看参与度和独占使用场景
      - - 避开机构渠道的空档
        - Kanopy 通过图书馆和大学，向符合条件的用户提供免费无广告观看
        - 中
        - 学生和电影向观众可能无需再付费订阅，也能满足小众需求
        - 衡量 MUBI 学生 / GO 队列与图书馆、大学访问资格的重叠
      - - 品牌信任与文化身份
        - Variety 对公关风暴的报道显示，争议会伤到订阅增长势头
        - 高
        - 小众文化品牌一旦信任开裂，付费用户流失可能快过工具型捆绑包
        - 要求提供 2025 年争议前后的取消 / 重新激活队列，并按地区比较恢复情况
      - - 既有玩家反击能力
        - Netflix、Prime Video、HBO Max 和 AMC+ 可把精品内容塞进更宽的家庭套餐
        - 高
        - MUBI 面对的公司能用更宽的使用价值补贴电影发现
        - 要求提供 CAC、自然获客和独占内容 ROI 证据，检验 MUBI 获客漏斗到底多能防守
    notes: 严重性是基于留存公开材料的定性投资判断，不是概率预测。缓解措施列聚焦尽调要求：把公开信号转成能支撑投资判断的证据。
