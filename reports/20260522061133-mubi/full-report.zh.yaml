      - number: '3.2'
        title: 定价、打包与能力对比
        blocks:
          - type: paragraph
            body: >-
              公开定价和打包进一步说明，MUBI 卖的是高端小众产品，而不是折扣型专业产品。Criterion 标价每月 $10.99，OVID 为 $6.99，BFI Player 为 £6.99；AMC+
              销售价格更低的多品牌捆绑，Netflix 广告层级起价低于 MUBI 标准计划。PCMag 的评测把对比说得很直接：Criterion 比 MUBI 便宜，MUBI GO
              更贵，因为它在指定城市包含每周一张人工精选电影票。从能力看，直接专业集合比价差暗示的更接近平价。Criterion、OVID、BFI、Curzon 和 Kanopy
              都以某种形式突出策展、发现或电影教育；设备接入、下载和电视支持也不再足够独特，不能单独构成持久护城河。真正分叉的是打包逻辑：MUBI 卖策展加院线访问，Kanopy 把付款转给机构，Curzon
              保留无订阅的交易路径，现有巨头则用捆绑、直播频道或体育来销售更宽的家庭效用。
