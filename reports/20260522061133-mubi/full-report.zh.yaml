      - number: '1.3'
        title: 规模信号、增长牵引与电影战略演进
        blocks:
          - type: paragraph
            body: >-
              MUBI 如今呈现得不太像小众片库订阅，更像一家有规模、垂直野心更强的电影公司，但它的公开指标必须谨慎归一。Tech Funding News 称平台全球注册用户为 20M；2026 年行业报道援引 Wall
              Street Journal 称，MUBI 在 2025 年末接近 1.2M 付费订阅用户，随后在 2026 年第一季度恢复到创纪录的 1.7M。相比之下，Latka 标示有 8.4M 客户和 $77M 的
              2024 年收入，公开应用列表则显示 Android 下载量超过 5M。这些信号有用，但并非同一个漏斗，因此正确读法是方向性规模，而不是一个唯一权威受众数字。战略上，更强的故事是 MUBI
              沿价值链上移。Wikipedia 和 Tech Funding News 描述了其对 The Match Factory 的所有权，以及对 Cinéart 的多数股权；官方 MUBI 影片页面和 Oscars
              证据也显示，公司正围绕「The Substance」和「The Zone of Interest」等片名加码精品电影发行。2025 年 Cannes 以据报道 $24M 购入「Die, My
              Love」则展示了这一野心的另一面：MUBI 正承担更大的内容风险头寸，足以同时影响品牌声望和财务波动。
