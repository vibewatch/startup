        - 业务规模小得多，广告 / 片库敞口更高，文化定价权更低
      - - Crunchyroll
        - 2021 年 Sony 收购；5M SVOD 订户；120M 注册用户
        - $1.175B 交易价值；每个 SVOD 订户约 $235
        - 高端粉丝向流媒体资产突破 $1B 的最佳直接交易先例
        - 2021 年市场更热，付费基数也远大于 MUBI
      - - MUBI 当前轮
        - 2025 年私人市场标记；报道 2025 年收入约 $200M；2025 年底 1.2M 订户、2026 年 Q1 升至 1.7M
        - 约 5.0x 收入；每订户约 $588–$833
        - 当前承销参考价格
        - 私人轮、股权结构表不透明、收入组合不确定，使该估值标记很难完全核验
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the most decision-relevant public specialty streaming, hybrid distribution, and transaction analogs
        visible from retained sources; many private niche peers lack disclosed valuation data or comparable financial
        detail.
