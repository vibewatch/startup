            claimRefs:
              - CV040
              - CV049
              - CV050
              - CV052
              - CV053
              - CV054
              - CV055
      - number: '8.6'
        title: 图表与附录
        blocks:
          - type: callout
            title: $1B 估值标记已经假设相对公开垂直媒体同行的溢价
            body: >-
              公开市场垂直媒体同行并不支持轻易认为 $1B 便宜。当前标记约为报道中 2025 年收入基数的 5x，而 CuriosityStream 约 2x，Cineverse 约 1x，AMC Global Media
              则远低于 1x。只有当 MUBI 的混合模式和品牌能创造出比公开记录目前证明的更好收入质量时，这个溢价才说得通。
            calloutType: risk
            claimRefs:
              - CV029
              - CV033
              - CV034
              - CV035
              - CV036
          - type: callout
            title: MUBI 应比纯细分流媒体可比对象获得更多认可
            body: >-
              公司不是只把独立电影摆上架。它把自己定位为流媒体、策展方、出版方和发行方，再加上 The Substance 的证据，支持它相对纯细分 SVOD
              同行享有一定溢价。问题不在于没有溢价情景；问题在于，当前轮次已经向投资人收取了其中相当一部分。
            calloutType: strength
            claimRefs:
              - CV008
              - CV018
              - CV041
          - type: callout
            title: 什么会改变判断
            body: >-
              更低的入场价本身可以改善建议，但更干净的路径是证据。经审计收入组合、股权结构表条款、留存数据和单片级 ROI，可能把当前立场从偏高推向合理。没有这一整包证据，更谨慎的做法是把 MUBI
              留在继续研究名单上，而不是用不完整的公开数据硬凑买入情景。
            calloutType: recommendation
            claimRefs:
              - CV049
              - CV052
              - CV053
              - CV054
              - CV055
