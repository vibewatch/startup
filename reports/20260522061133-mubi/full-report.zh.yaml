        - 在电视设备安装应用，或从手机投屏
        - 支持 Apple TV、Fire TV / Fire OS、Android TV 类设备、AirPlay 和 Chromecast
        - 把小众片库带进客厅场景
        - 没有逐设备性能指标或游戏主机支持情况的公开信息
      - - 兑换每周影院权益
        - 打开 GO 应用，选择影院 / 场次，在售票处兑换
        - 每周手选片目，配套 QR 码或代码式取票流程
        - 培养固定观影习惯，也比单纯流媒体更能支撑高价权益
        - 可用性取决于当地影院、场次和合作方受理情况
      - - 留在 MUBI 内阅读评论和背景
        - 围绕影片和导演阅读 Notebook，或购买 Notebook Magazine
        - 自有出版和纸刊层
        - 把产品互动从播放时长延伸出去
        - 编辑内容消费能否提高留存或票券领取，没有公开证据
      - - 跨地区、跨语言追踪影片
        - 浏览带有地区可用性和字幕限制的片库
        - 本地化服务、影片页面和按地域划分的版权窗口
        - 支撑全球覆盖，但不承诺各地片库相同
        - 片库和字幕可用性仍受各国版权限制
    notes: 收益按工作流表述，而非财务 ROI；公开证据对产品机制更充分，对转化或留存结果支撑较弱。
