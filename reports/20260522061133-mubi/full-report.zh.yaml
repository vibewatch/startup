      - number: '2.2'
        title: 市场测算视角与精确性失效处
        blocks:
          - type: paragraph
            body: >-
              可取得的公开证据支持多种市场视角，而不是一个精确的 MUBI TAM。最宽口径下，PwC 称全球娱乐与媒体收入在 2024 年达到 US$2.9T，到 2029 年可能升至
              US$3.5T，但这个类别包括广告、互联网接入、游戏和许多远离 MUBI 经营现实的细分。更有决策价值的视角是当前消费者流媒体钱包：Deloitte 称，美国订阅用户报告每月平均在四项付费流媒体服务上花费
              $69，39% 表示过去六个月内至少取消过一项付费 SVOD 服务。Comscore 补充说，观看组合正在转向广告支持和 FAST 选项，进一步说明即便总媒体收入增长，消费者预算也有限。最接近 MUBI
              实际小众市场的公开视角是价格和定位。OVID 与 BFI Player 锚定策展电影带的低端，MUBI 和 MUBI GO 位于中高端，Netflix、Prime Video 和 Max
              则展示了主流替代品对宽片库便利性的定价。应用商店下载量能说明发现触达，不能说明付费意愿。由于保留的公开来源没有披露同行订阅用户数，也没有干净拆分 MUBI
              的流媒体和院线经济，可辩护结论只能是受证据约束：把边界、钱包、价格和发现视角合起来用，不要假装公开层面能观察到干净的策展电影 SAM。
