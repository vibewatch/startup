        - 当 GO 和电影版权的经济账可能与基础流媒体差异很大时，利润率路径无法支撑投资判断
        - 要求提供 COGS 明细、内容摊销政策和收入来源级毛利率。
      - - CAC、流失、队列留存和 GO 核销
        - 公开数据无法评估 GTM 效率和 LTV
        - 要求提供获客渠道结构、队列表、流失、CAC、回本周期和每名会员 GO 核销成本。
      - - 扣除费用和税后的应用商店与国家结构
        - 公开标价几乎肯定高估实际净 ARPU
        - 要求按应用商店、官网直销和地区披露计费结构及净实收率。
      - - 单片 MG、P&A 和联合融资回收瀑布
        - 一两项片单决策对现金需求的影响，可能超过订阅基本盘
        - 要求提供 2024 年以来所有重大收购和制作的片单现金流日历和合同摘要。
      - - 经调节的融资时间线和股权结构权利
        - 数据库分歧让稀释历史和融资依赖程度都不确定
        - 要求提供已签署的逐轮时间表，列明金额、投后估值、董事会权利和投资人保护条款。
    notes: 这些是投资判断最关键的缺失字段。问题不在于 MUBI 是否有需求，而在于公开信息是否足够精确，能把经常性经济账和电影押注波动拆开。
