      - number: '8.4'
        title: 可比估值语境
        blocks:
          - type: paragraph
            body: >-
              正确的比较组是垂直流媒体和电影发行类比对象，不是泛 SaaS。公开小市值媒体公司给了最有用的下行锚，虽然每家公司都有自己的噪音。CuriosityStream 的交易约为 2.1x 至 2.3x
              收入，Cineverse 约 1.0x，AMC Global Media 约 0.17x。这些不是完美同行，但它们正说明，仅凭公开证据，很难说 MUBI 的 $1 billion 标记便宜。如果 MUBI
              只是一个高端细分流媒体，它与这些比率的差距就显得过宽。


              愿意付高价的最好理由是，MUBI 不只是流媒体。它的月费高于 Criterion、OVID 和 BFI Player；通过 GO
              和发行，它还有接近按片付费的供给；文化品牌也强于多数公开微型市值垂直同行。Netflix 约 8x 收入提供了一个宽松上限，但那是规模和盈利能力基准，不是直接可比对象。更有用的交易锚是 Sony 2021 年收购
              Crunchyroll：成交价 $1.175 billion，对应 5 million SVOD 订阅用户，隐含每名订阅用户约 $235。MUBI
              当前标记在付费基数小得多的情况下，隐含每名订阅用户价值高出不少。这不会杀死投资逻辑，但它说明，除非尽调揭示出比公开数据能证明的更好经济性，否则当前轮次应被视为偏高。
