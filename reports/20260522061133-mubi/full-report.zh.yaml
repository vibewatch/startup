      - number: '7.2'
        title: 政治 / 声誉风险与内容经济风险
        blocks:
          - type: paragraph
            body: >-
              最尖锐的非技术风险在于，MUBI 品牌离艺术社群很近，因此资本决策能快速传导到创作者、场馆和订阅用户。Sequoia 事件就是参照案例。公开报道显示，抵制不只停留在网上评论：电影人签署公开信，电影节和场馆退出与
              MUBI 相关的节目，抵制呼声流传，Variety 后来报道 MUBI 在用户基础恢复前流失超过 200,000 名订阅用户。这个模式重要，因为 MUBI
              卖的是品味、信任和社群，而不是商品化片库宽度。建立在价值观和策展上的品牌可以恢复，但结构上比通用娱乐捆绑更容易暴露于使命错位。


              第二个主要风险是精品片名经济的集中度。MUBI 近期公开叙事把一个上行情景和一个下行情景并列在一起。The Substance 成为可见成功，并与订阅用户势头相连；Die My Love 则被报道为 Cannes
              $24M 收购，后来商业表现较弱。投资者不应把这解读为 MUBI 应停止竞价买片，而应解读为大额下注会摆动市场情绪和回报。MUBI 已经大到能做有分量的收购，也仍小到少数失手或争议就会产生影响。


              缓释措施存在，但仍不完整。管理层以伦理融资政策、艺术家顾问结构，以及公开澄清 Sequoia
              是少数股东作为回应。这些动作有用，但不能抹去已经被证明的传导路径：融资选择和片单选择都可能同时冲击增长、伙伴信任和估值。
