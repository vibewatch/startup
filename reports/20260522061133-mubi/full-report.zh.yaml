  - id: TV005
    title: 投资逻辑失效和终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 订户反转
        - 付费订户较 2026 年 Q1 的 1.7M 下滑超过 15%，且没有计划内价格优化证据
        - 打破韧性逻辑，削弱溢价倍数论据
        - 转为回避，或要求估值远低于上一轮
      - - 片单经济性失手
        - 又一部声誉片下注出现 Die My Love 级别亏损，且没有爆款对冲
        - 说明纵向整合带来的波动快于它带来的 IP / 品牌价值
        - 暂缓投资，直到单片 ROI 纪律可见
      - - 经常性利润率不及预期
        - 数据室显示核心订阅毛利率结构性偏弱，或由波动的电影经济性补贴
        - 支付高于公开专业媒体倍数的主要理由消失
        - 将承销重设到悲观可比区间
      - - 治理 / 品牌冲击
        - 又一次与投资人或董事会相关的争议导致创作者退出、场地方撤出或重大订户流失
        - 证实品牌信任是核心估值变量，而非背景噪音
        - 除非管理层能证明快速控场，否则视为投资逻辑失效
      - - 股权结构表悬置
        - 优先股堆叠或参与权显著损害约 $1.5B 以下退出价值中的普通股结果
        - 即使企业价值看似合理，新资金回报也会变得缺乏吸引力
        - 没有结构性保护，就不要按该轮条款投资
    notes: 这些是可观察的终止标准，不是泛泛风险。每一项都入选，是因为它能快速同时撬动收入质量和退出价值。
    claimRefs:
      - CV004
      - CV005
      - CV016
      - CV017
      - CV027
      - CV028
      - CV041
      - CV042
      - CV053
      - CV056
  - id: TV006
    title: 最终尽调事项表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入组合与利润率桥
        - 经审计的流媒体、GO、院线、发行和制片收入拆分，以及毛利率桥
        - 当前估值取决于 $200M 表层收入究竟是高质量经常性收入，还是带有波动电影经济性的混合收入
        - 财务团队数据室；经审计报表和管理层桥表
      - - 股权结构表与清算优先权
        - 完整持股表、优先股堆叠、参与权和员工期权稀释
        - 实际投资人回报可能与企业价值区间显著不同
        - 法务 / 财务工作流；董事会批准的股权结构表导出
      - - 订户质量
        - 围绕 1.7M 订户反弹的队列留存、套餐结构、地域结构和 GO 附加率
        - 需要借此区分可持续需求与奖季或争议反弹噪音
        - 增长分析请求；队列仪表盘和流失率桥
      - - 单片经济性
        - The Substance、Die My Love 的 P&L，以及未来最低保证承诺
        - 乐观和悲观情景取决于 MUBI 能否在不承担不可接受现金风险的情况下复现优质片单结果
        - 内容财务工作流；单片投资委员会材料
      - - 治理流程
        - 董事会构成、保留事项、升级权利，以及伦理融资政策实际运行的证据
        - 估值已证明会受投资人一致性和响应速度影响
        - 董事会和法务尽调；会议纪要、政策流程和案例日志
      - - 现金跑道与承诺
        - 当前现金余额、营运资金摆动、债务（如有）和表外内容义务
        - 需要借此判断若再出现影片失手或订户回落，下行融资风险多大
        - 资金管理和 FP&A 尽调包
    notes: 这些要求是从方向性估值判断推进到投或不投决定所需的最低材料包。
    claimRefs:
      - CV040
      - CV049
      - CV050
      - CV052
      - CV053
      - CV054
      - CV055
