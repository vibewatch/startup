      - number: '8.3'
        title: 乐观、基准和悲观框架
        blocks:
          - type: paragraph
            body: >-
              情景分析应从真正公开的信息出发，而不是从英雄式终值故事出发。基准情景假设，报道中的 2025 年收入约 $200 million 大方向正确，Q1 2026 订阅用户反弹大体守住，且 MUBI
              因为能同时变现会员和电影版权，相对小型公开垂直流媒体保有一定混合模式溢价。在这个设定下，对约 $200 million 至 $225 million 收入给 3.5x 至 5.0x 倍数，只能支撑约 $700
              million 至 $1.1 billion 股权价值。也就是说，当前 $1 billion 标记已经接近基准情景上沿。


              悲观情景假设再次爆发争议、又有大单片失手，或出现证据表明经常性订阅经济性弱于表观收入数字。在这种情况下，倍数会压向公开垂直媒体的 2.0x 至 3.5x 区间，价值落到约 $400 million 至 $700
              million。乐观情景需要的不只是订阅用户反弹。它要求收入接近 $260 million 至 $300 million，内容胜仗可重复且更像 The Substance 而不是 Die My
              Love，并且纪律足够强，让市场愿意为一个混合独立媒体平台支付 5.0x 至 7.0x 收入。只有到那时，价值区间才会扩到约 $1.3 billion 至 $2.1 billion。
