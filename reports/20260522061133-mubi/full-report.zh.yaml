      - number: '8.5'
        title: 退出准备度、止损触发器与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              退出选择权存在，但还不干净。相比近期 IPO，更容易想象的是卖给更大的媒体或平台买家；公开垂直媒体估值偏弱，MUBI 的混合业务也需要比公司目前提供的更多披露。战略逻辑并不难懂：MUBI
              拥有高端品牌、全球版权关系，以及连接策展、流媒体和院线发行的差异化桥梁。但同一个混合模式也意味着，买家会审查单片 P&L、最低保底、营运资金波动和治理风险。


              因此，最终尽调比表格精度更重要。投资人在押注 $1 billion 入场价之前，需要拿到经审计、按流媒体、GO、院线和制作 / 发行拆分的收入；按地理划分的队列留存和套餐组合；The Substance、Die
              My Love 以及前瞻片单的单片经济性；包含清算优先权的完整股权结构表；以及能证明 2025
              年反弹回应已经制度化、而非留在创始人自由裁量里的治理流程。如果这些问题回答干净，当前标记可以从偏高走向合理。如果不能，投资逻辑应迅速破裂，因为相对下行，公开上行仍然太窄。
