      - number: '4.3'
        title: 资本充足性取决于内容下注，而不只是订阅用户增长
        blocks:
          - type: paragraph
            body: >-
              MUBI 最重要的公开财务证据是反向证据，不是宣传材料。公司在 2025 年以 $1B 估值融到 $100M，并称资本将支持全球发行以及更大的原创和收购影片管线。这个叙事容易相信，因为片单行为与之吻合。「Die,
              My Love」在多个地区花费约 $24M，Screen 报道还有 45 天院线承诺；Variety 和 IndieWire 后来报道称该片院线票房只有约 $12M。相比之下，行业报道称「The
              Substance」是一笔 $12M 收购，带来约 $77M 到 $80M 的票房和声望外溢。换句话说，MUBI
              已经从相对干净的订阅模式进入组合模式，一两部电影的结果就能扭曲季度现金需求。这也是为什么年度净亏损数字和 Q4 负现金流数字会导向完全不同的烧钱速度视角。它同样解释了公司 2025 年末人员动作和新近报道的
              IPR.VC 共同融资协议为何重要：两者都表明，资本结构和片单融资现在像订阅用户增长一样影响业务。没有实际现金余额、债务计划或片名承诺披露，公开现金跑道分析只能是示意性的。
