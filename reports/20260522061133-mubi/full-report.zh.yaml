  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相邻业务
        blocks:
          - type: paragraph
            body: >-
              MUBI 的正确边界比「全球流媒体」窄，但比「又一个艺术片应用」宽。它的核心市场是高端策展电影流媒体：一种无广告订阅，价值主张不是片库宽度、体育或直播电视效用，而是选择、品味、编辑框架和全球电影。MUBI
              的公开店面把这一点说得很明白：主打策展式流媒体，另设 MUBI GO 层级，每周增加一张电影票；Criterion、OVID、BFI Player 和 Curzon Home Cinema
              也都围绕人工精选、艺术院线或独立电影发现来包装自己的产品。这是 MUBI 最接近的可比集合。Netflix、Prime Video、Max 和 AMC+
              仍然重要，因为它们争夺同一份可自由支配娱乐预算，但它们的首页强调的是大众化宽片库、捆绑、体育、直播电视和主流剧集，而不是影迷策展。再外一圈是电影商业相邻业务：Curzon 和 BFI
              把订阅与租赁或影院机构混在一起；Netflix、AMC Global Media、Cineverse 和 CuriosityStream 面向投资者的材料则显示，公开可比公司横跨的不只是一般
              SVOD，还有更宽的内容平台和发行模式。因此，市场边界应纳入策展电影订阅支出和流媒体加院线的混合会员，把一般 SVOD 视为主要替代钱包，并把院线或发行经济视为战略重要的相邻业务，而不是想象出来的 TAM。
