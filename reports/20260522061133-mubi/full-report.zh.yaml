      - number: '3.4'
        title: 护城河耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              本章级别的护城河结论较为微妙。MUBI 确实有差异化位置：GO 的每周电影票在保留集合中明显独特，MUBI
              自己的关于页面也声称其角色比简单流媒体应用更广，覆盖策展、出版和发行。但底层策展主张并不排他。Criterion、OVID、BFI、Curzon 和 Kanopy
              都营销品味、电影教育、全球电影或有思考的发现，因此直接同行能以更低标价或机构代付访问复制相当多的情感价值主张。这让高端付费意愿和品牌信任成为承销核心问题。Variety 报道 MUBI 在 2025
              年公关风暴中流失订阅用户，因此具有竞争相关性：小众文化品牌一旦买方认为其身份不再支撑溢价，就可能损失留存。与此同时，现有巨头仍可通过更便宜的广告层级、更宽捆绑、直播或体育效用，或精品电影收购来回应，而无需让家庭再增加一个专业订阅。公开数据仍没有揭示同行份额、流失、重叠或队列留存，所以持久竞争优势从外部看只可部分观察。
