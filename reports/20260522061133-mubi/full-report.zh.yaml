  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 策展驱动的产品界面与用户任务
        blocks:
          - type: paragraph
            body: >-
              MUBI 的公开产品界面有意比普通订阅视频店面更宽。公司自己的关于页面说它同时是流媒体服务、策展人、出版方和发行方；消费者首页导航把 MUBI GO、Notebook、Notebook Magazine 和
              Editions 与核心流媒体计划并列，使这一点变得具体。因此，第一个产品问题不只是「我能看什么流媒体？」而是「MUBI
              试图为电影爱好者完成什么任务？」保留来源支持六个反复出现的用户任务：通过编辑策展发现电影、观看轮换专业片库、离线下载影片、在客厅设备上观看、通过 GO 每周兑换一张院线票，以及留在 MUBI
              控制的出版和社群环境里，而不是跳到第三方电影媒体。Notebook 强化了这个定位，因为它不是附带博客内容；MUBI 将其描述为每日更新的国际电影出版物，而 Notebook Magazine
