      - number: '5.2'
        title: 应用、交付流程与公开架构细节的边界
        blocks:
          - type: paragraph
            body: >-
              MUBI 技术栈最可知的部分是客户端层。官方设备和帮助页面显示出成熟的跨平台分发表面：移动应用、智能电视和媒体播放器应用、Mac 和 PC 网页访问、AirPlay 和 Chromecast
              支持、离线下载、二维码或六位数设备激活，以及多设备并发模型。GO
              工作流也同样明确：选择每周影片，选择影院和场次，在应用内兑换，再到影院票房把凭证换成电影票。支持文章还暴露出比营销文案更重要的实际交付约束，例如下载仅限移动端，未使用时 30 天后过期、开始播放后 48
              小时过期，环绕声或字幕自定义取决于设备而非普遍可用。公开来源没有揭示的，是让这些体验能够规模化运转的底层工程架构。保留集合没有说明云服务商、CDN 合作伙伴、DRM
              供应商、推荐系统、数据管线、可观测性工具或内部服务拓扑。即便公开支持矩阵也没有完全同步：设备页面宣传的 iOS 和 Android 最低版本新于 FAQ
              文章，暗示面向消费者的文档由多个层维护，而不是来自单一权威兼容性来源。
