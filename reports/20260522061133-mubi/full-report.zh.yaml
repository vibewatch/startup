companyProfile:
  summary: >
    MUBI 是一家成立于 2007 年、以伦敦为运营重心的私营电影平台，核心包括策展式流媒体、高端 MUBI GO 每周观影票会员、Notebook 编辑出版，以及正在扩大的院线发行和贴近制作的业务。创始人兼 CEO Efe
    Cakarel 仍是主要公开操盘者；Tracxn 也将 Gabe da Silveira 列为联合创始人，尽管 MUBI 当前官方页面不再突出呈现他。公开报道共同指向：2025 年由 Sequoia 领投 $100M、估值
    $1B；经历 2025 年争议引发的下滑后，2026 年 Q1 付费订阅用户约 1.7M；注册用户 20M；服务覆盖 195+ 个国家 / 地区。核心尽调张力在于，MUBI
    确实有规模和精品电影势头，但累计融资历史、收入结构和股权结构条款在公开层面仍不完整。
