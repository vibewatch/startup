  - id: FU001
    title: 客户旅程地图
    type: journey-map
    layout: wide
    summary: 描绘 MUBI 核心影迷客户可能的路径：从发现进入付费流媒体，养成社区驱动的使用习惯，并可选择升级 GO。
    data:
      items:
        - label: 认知
          note: 客户通过电影节热度、高声望片目、口碑、Notebook / 编辑界面，或专业电影服务对比接触 MUBI。
        - label: 试用与评估
          note: 潜在客户通过免费试用、学生价、应用商店，或对某部获赞片目的好奇来测试服务。
        - label: 付费会员
          note: 客户选择标准流媒体计划或学生计划，并开始在 Web、移动端和客厅设备上使用应用。
        - label: 每周习惯
          note: 重复使用靠策展、每日新增、社区叙事和随处可看的便利，而不只是片库规模。
        - label: 扩展或推荐
          note: 参与度更高的用户升级 GO，为高声望发行留下，或把服务推荐给其他电影爱好者。
