      - number: '4.2'
        title: 公开增长证据存在，但收入算术无法干净对齐
        blocks:
          - type: paragraph
            body: >-
              MUBI 的公开增长证据方向上强，但财务上不一致。行业报道称，公司到 2025 年末跌至约 1.2M 订阅用户，随后到 2026 年第一季度末恢复到创纪录的 1.7M。Tech Funding News 另称
              MUBI 有 20M 注册用户，Latka 则称其有 8.4M 客户。这些显然不是同一个漏斗。同样的不一致也出现在收入线上。Latka 列示 2024 年收入为 $77M，Variety 和 Screen
              Daily 则援引知情人士报道称 2025 年收入约 $200M。如果简单把 1.2M 到 1.7M 付费订阅用户乘以可见标价并年化，隐含计费区间大约落在 $144M 到 $408M
              之间，取决于计划组合。这个区间与报道的 $200M 数字重叠，正是重点所在：期末订阅用户、标价和全年总收入不能直接相比，因为标准、学生、GO、地理、折扣、应用商店费用和非订阅电影收入的真实组合都是私有信息。GTM
              动作也看起来更像自助式、应用驱动，而不是销售驱动，这意味着 CAC 和回本周期可能更多由营销效率和留存决定，而非人工销售生产率。但那些决定性的单位经济字段——流失、CAC、回本周期、毛利率、贡献利润率和实际
              ARPU——并未公开披露。
