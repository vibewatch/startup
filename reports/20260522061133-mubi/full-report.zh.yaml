      - number: '7.4'
        title: 合作伙伴 / 平台 / 渠道依赖
        blocks:
          - type: paragraph
            body: >-
              MUBI 的客户承诺靠一批公司无法直接控制的交易对手撑着。内容授权方决定哪些内容能在哪里播放、能播放多久。通过 Apple、Google 和 Roku
              订阅的用户，发现、计费、评分和取消都可能被这些渠道中介。浏览器厂商和 Google 的 Widevine 栈决定谁能在网页端观看。合作影院决定 GO
              能否真正以用户感到可靠的方式每周交付一个座位。单看每项依赖都可管理；问题在于，它们有好几项叠在同一段用户旅程上。


              这种依赖栈在公开资料里看得很清楚。帮助中心把 Apple、Google Play 和 Roku 的计费问题导回这些第三方。浏览器文章把故障排查导向当前浏览器版本、受支持操作系统和手动 DRM 更新。GO
              条款把部分出票风险导向无关联影院及其自有条款。应用评论证据给了现实校验：GO 评论抱怨每周影片在大城市之外并不稳定可用，主应用评论则在强烈认可策展的同时，标出播放和字幕挫折。


              投资人要抓住的关键含义是，MUBI 不能把渠道权力只当作支持职能。渠道依赖会影响流失、毛收入到净收入、退款负担、产品感知，并最终决定 MUBI 到底真正拥有多少客户关系。
