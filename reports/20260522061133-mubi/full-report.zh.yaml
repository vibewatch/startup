      - number: '7.3'
        title: 法律 / 授权 / 产品限制风险
        blocks:
          - type: paragraph
            body: >-
              授权和地域复杂性不是 MUBI 的边角问题，而是产品契约的一部分。MUBI 自己的条款写明，服务并非覆盖所有国家，内容可用性随授权而变；部分离线片目在没有流媒体播放权的地区也无法播放。旅行 FAQ
              还补充，音轨和字幕选项也按国家变化。也就是说，同一份订阅在不同市场可能有实质差异；任何把 MUBI 品牌视为全球可携带的投资逻辑，都要承担客户体验风险和运营复杂度。


              GO 产品又叠了一层法律和运营负担。GO 只在有限国家开放，每周提供一张精选 2D 影票，并不保证影院、场次或片目一定可用。MUBI 明确表示，它与所列影院没有直接关联；放映售罄或变更时，MUBI
              不承担责任。这种坦诚降低了披露风险，但也确认了依赖风险。用户仍可能把一个 MUBI 无法完全控制的失效点归咎于 MUBI。


              MUBI 也公开承认产品质量边界。MUBI 称，HD 和 4K 取决于可用母版质量；流畅播放建议至少 10 Mbps、延迟低于 100ms；桌面端只支持当前浏览器版本；有时用户还必须更新 Widevine
              或操作系统才能继续观看。下载必须保存在内部存储里。这些不是致命缺陷，但合在一起说明，版权、源母版、硬件、操作系统、浏览器和 DRM 现实共同限定了 MUBI
              的体验。公开隐私披露还显示，公司仍承担数据处理义务，但没有揭示保障深度。
