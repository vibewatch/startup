            body: >-
              MUBI 的公开信任叙事面向消费者，而不是企业技术。最强的可见信号来自 Apple 和 Google 应用商店披露：Google Play 上的传输中加密表述、数据删除请求、iOS
              隐私类别标签、近期应用更新，以及 GO
              条款中的明确设备或账户规则。这些控制有用但有限。它们说明公司在运营成熟的移动软件，不说明它发布了安全架构、正常运行时间纪律或认证体系。质量证据同样混合。流媒体应用有规模且总体评分强，GO
              应用较小的评论基础暴露出一个真实运营约束：产品质量取决于本地影院密度和场次覆盖。AppBrain 和 Google Play 还捕捉到关于故障、区域片库不满、登录或播放问题的投诉，这与 PCMag
              更正式的批评一致，即 MUBI 缺少多用户资料和更丰富的字幕控制。正确的技术结论因此需要细分。MUBI
