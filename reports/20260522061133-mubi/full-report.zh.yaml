      - number: '7.5'
        title: 人员 / 执行集中度与止损标准
        blocks:
          - type: paragraph
            body: >-
              MUBI 要做的事很宽，但组织仍相对精瘦，因此执行风险集中。公开报道指向约 400 名员工、分布在 14 或 15
              个办公室；对一家细分电影公司来说，这已经有规模，但若同时跑订阅、应用、版权窗口、院线发行、电影节、杂志和编辑界面、GO 运营，规模仍不算厚。PR
              风波后报道的裁员和内容领导层调整说明，组织还在调整，却已经要求市场相信更大的押注。


              领导层集中同样重要。公开报道把公司的治理叙事聚焦在创始人兼 CEO Efe Cakarel
              身上；他称自己仍是最大股东并保有控制权。这保住了策展一致性，但也把融资、风险偏好和使命解释的判断集中到一人身上。公开材料还没有让投资人清楚看见继任纵深、委员会结构，或伦理融资回应在创始人层级以下制度化到什么程度。


              实际做法是，只有配上硬性的监控纪律，MUBI 才具备可投性。投资人应围绕订阅用户冲击、大单片经济性、GO
              交付、领导层稳定性和治理流程设置可观察阈值。一旦这些阈值滑坡，投资逻辑会很快改变，因为驱动增长和下行的正是同一小组变量。
