  - id: TM004
    title: 增长驱动与约束因素表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间窗口
      - 影响
      - 尽调需询问
    rows:
      - - 人工精选和编辑策展
        - 驱动因素
        - 近期
        - 买家买的是品味，不是片库宽度；因此即便片库更窄，仍能支撑付费意愿
        - 要求按片名节奏和编辑互动拆分留存与转化数据
      - - 连接流媒体与影院的混合 GO 模式
        - 驱动因素
        - 近期至中期
        - 如果兑票经济模型跑得通，MUBI 可区别于纯 SVOD，并可能抬升品牌显著性
        - 要求城市级 GO 兑票、补贴和合作影院单位经济数据
      - - 整体 E&M 增长与精品电影需求
        - 驱动因素
        - 中期
        - 表明娱乐大盘仍在扩张，即便 MUBI 只能吃到很薄一片
        - 要求管理层提供将精品电影需求与付费转化相连的内部市场模型
      - - 固定消费者娱乐预算与 SVOD 流失
        - 约束
        - 当前
        - 限制加购订阅意愿，也提高 MUBI 被当作轮换订阅而非长期订阅的风险
        - 要求按套餐和地区拆分流失、再激活和订阅时长
      - - 向广告支持和 FAST 迁移
        - 约束
        - 当前至中期
        - 消费者会被推向更便宜或免费的替代品；MUBI 走高端、无广告定位，无法照搬
        - 要求付费意愿测试、促销策略和捆绑实验
      - - 与更广谱 SVOD 替代品价格重叠
        - 约束
        - 当前
        - 面对 Netflix、Prime Video 和 Max 更便宜的入门档，MUBI 必须证明高价合理
        - 要求研究买家在当前价格下选择或拒绝 MUBI 的赢单 / 输单原因
      - - 版权、地区和产品质量摩擦
        - 约束
        - 中期
        - 地区片库限制、GO 城市覆盖和 App 性能投诉可能拖慢采用或推高流失
        - 要求地区版权覆盖、套餐可用性和投诉解决指标
    notes: 驱动 / 约束组合比单一 TAM 数字更关键，因为 MUBI 的高端小众定位能靠强品味差异化增长；但如果钱包压力或地区摩擦占上风，表现仍可能不及预期。
