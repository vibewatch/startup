      - number: '5.3'
        title: GO、出版与发行把应用变成运营栈
        blocks:
          - type: paragraph
            body: >-
              MUBI 最清晰的产品差异化不在于它策展电影——Criterion、OVID、BFI Player 等专业服务也卖策展——而在于它把策展缝到现实放映和自有出版上。GO
              在结构上不同于高端流媒体层级，因为权益取决于每周片名选择、合作影院可用性、票房兑换、账单国家规则和防共享控制。这让它成为一个带实时合作伙伴依赖的运营工作流，而不只是定价加项。Notebook 和 Notebook
              Magazine 通过把发现、评论和编辑权威留在品牌内部，创造了第二层非流媒体业务。院线 / 发行侧又把 MUBI 推得更远，离标准小众流媒体更远：Variety 对 Cannes $24M「Die, My
              Love」交易的报道显示，公司正在做版权收购和地区发行决策，这属于电影发行方，而不只是软件订阅业务。实际含义是，MUBI
              的技术组织很可能嵌在更大的版权、伙伴和发行运营机器中。公开来源让这种组织宽度可见，但没有披露流程中有多少由自研内部工具支撑，多少靠供应商软件和人工运营协调。
