  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序框架
        blocks:
          - type: paragraph
            body: >-
              本章给 MUBI 风险排序，不靠套用创业公司原型猜测，而是结合可观察到的可能性、影响、缓释成熟度和剩余暴露。公司不寻常，因为它不只是流媒体。它横跨流媒体订阅、院线发行、贴近电影节的节目编排，以及 MUBI GO
              的影院票工作流。这个混合模式给了它多条变现路径，也放大了失败面：融资争议会影响电影人和场馆，区域版权缺口会影响用户感知的片库质量，浏览器或账单问题如果客户无法轻松解决，就会变成流失。


              公开记录支持一个明确结论：MUBI 有韧性，但并非抗冲击。Variety 报道称，Sequoia 争议在用户基础恢复到 2026 年 Q1 创纪录的 1.7M 之前，造成超过 200,000
              名订阅用户流失；这意味着品牌能够吸收争议，但不能避免真实收入和信任损伤。与此同时，MUBI 最可见的成功与挫折集中在精品电影结果上，例如 The Substance 和 Die My
              Love。这让风险传导异常直接：内容经济、创作者关系、平台可靠性和资本治理决策，都能撬动同一组订阅用户和估值杠杆。


              公开证据薄弱之处，本章留下明确缺口，而不是夸大确定性。最深的未知不是这些风险是否存在，而是它们在流失队列、单片 ROI、GO 城市覆盖和创始人层面决策权内有多集中。
