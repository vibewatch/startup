      - number: '3.3'
        title: 切换成本、多平台并用与分发权力
        blocks:
          - type: paragraph
            body: >-
              对纯流媒体会员来说，切换成本在结构上很低。Criterion、OVID、BFI、Netflix 和 MUBI
              都呈现月付或试用驱动的消费者购买，而不是硬合同，这意味着许多用户可以相对低摩擦地添加、取消或轮换服务。这个事实重要，因为 MUBI
              防守的不是自有操作系统、独特设备覆盖或深度嵌入的工作流。保留集合中最强的锁定效应来自分发或付款方结构，而不是技术。Kanopy 以另一种方式更难被替代，因为付款方是图书馆或大学，而不是观众。Prime
              Video、Max 和 AMC+ 的分发权力来自更大捆绑或家庭内容栈中的一个元素。MUBI GO
              制造了一些真实摩擦，因为它依赖账单国家、指定影院和每周片名可用性，但同样的运营复杂性也可能约束规模。实际结果是，这是一个多平台并用普遍的市场；MUBI 的竞争防线更多依赖身份和习惯，而不是硬性的合同锁定。
            claimRefs:
              - CP022
              - CP023
              - CP024
              - CP025
              - CP030
