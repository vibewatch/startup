        - 纪录片、艺术院线和全球电影观众
        - 入门价格低，内容合作伙伴模式明确
        - 品牌覆盖更小，保留材料中没有公开订阅规模
      - - BFI Player
        - 直接垂直同业 / 机构
        - British Film Institute 背书的服务；月费 £6.99，含订阅、租赁和免费层
        - 英国和电影文化受众
        - 机构信任、租赁、免费节目和 BFI Replay
        - 地理偏英国，且保留材料中无公开订阅数
      - - Curzon Home Cinema
        - 直接垂直同业 / 邻近
        - 与 Curzon 影院相连的家庭平台；保留首页显示无需订阅
        - 艺术院线租片用户和影院关联观众
        - 影院邻近性和“最新电影到家”定位
        - 交易关系复购性更弱，全球扩展性也更低
      - - Kanopy
        - 替代品 / 图书馆模式
        - OverDrive 旗下、由机构付费的平台；拥有合格图书馆或大学访问权限的终端用户可免费使用
        - 学生、图书馆用户和预算敏感的影迷
        - 用户零价格、无广告访问和机构分发
        - 资格取决于赞助机构，而非面向所有消费者开放
      - - Netflix
        - 存量替代品
        - 上市全球 SVOD 龙头；首页和套餐页展示低于 $10 的广告档及多层级家庭效用
        - 大众家庭娱乐
        - 内容广度、原创内容、额外成员灵活性和家庭默认地位
        - 定位不围绕策展或全球电影品味权威
      - - Prime Video
        - 存量替代品
        - Amazon 生态服务；保留首页更强调体育、直播电视和订阅，而非垂直电影
        - Prime 家庭和广谱娱乐买家
        - 捆绑和生态效用远超电影策展
        - 保留首页未披露独立消费者价格
      - - HBO Max
        - 存量替代品
        - Warner 背书的高端服务；首页营销套餐和起价 $10.99 的多服务捆绑
        - 高端剧集和电影家庭
        - 精品内容加捆绑杠杆
        - 不是专门的影迷发现产品
      - - AMC+
        - 小众存量捆绑
        - AMC Networks 流媒体捆绑；披露月费 $8.99 或年化 $83.88
        - 类型片、精品剧和独立电影观众
