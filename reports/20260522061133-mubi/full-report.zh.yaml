      - number: '1.4'
        title: 里程碑、争议与待解尽调问题
        blocks:
          - type: paragraph
            body: >-
              公司的时间线现在有两种相互竞争的解读。一条轴线上，MUBI 像一个成功的艺术电影平台，正在扩展成精品迷你制片厂：2007 年创立、从 The Auteurs
              更名、叠加合作和收购、发行或支持重要奖项片、融到独角兽阶段资本，并在 2026 年初反弹到创纪录订阅用户水平。另一条轴线上，2025 年显示这个模式对声誉和内容配置风险已经有多暴露。电影人对 Sequoia
              融资的反对升级为公开信、场馆退出、活动取消、员工离职、裁员、订阅用户流失，以及媒体对收入、亏损和现金流的审视。MUBI
              的回应——伦理融资流程、顾问机制，以及反复声明编辑独立性——很重要，因为它说明管理层把问题视为品牌信任的生死题，而不只是社交媒体噪音。因此，本章级别的尽调结论需要平衡：MUBI
              拥有真实的全球品牌资产和差异化电影主张，但下一层承销更少取决于策展话术，更多取决于围绕股权结构控制、财务耐久性，以及公司在买入更大电影、尝试突破精品流媒体时准备吸收多少资产负债表风险的私人披露。
