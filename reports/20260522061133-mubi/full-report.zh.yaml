      - number: '1.2'
        title: 领导层、资本与利益相关方结构
        blocks:
          - type: paragraph
            body: >-
              公开领导层证据比产品证据薄。无论在数据库还是 2026 年媒体报道中，Efe Cakarel 都清楚地是长期创始人兼 CEO 和公开操盘者，但保留的官方页面没有给出完全透明的高管名单或董事会名单。Tracxn 将
              Gabe da Silveira 称为联合创始人，不过这一细节没有在 MUBI 当前官方页面上被醒目重复，因此创始人历史可被支持，却没有被充分展示。融资脉络更清楚。多个保留来源共同指向 2025 年
              Sequoia 领投的 $100M 融资，估值 $1B；此前 Summit Partners 和 Zhang Xin/Closer Media
              的支持也出现在公开公司数据库和行业媒体中。更难的问题不是资本是否到位，而是资本附带了什么权利。争议报道、电影人公开信和 MUBI 自身反驳都说明，Sequoia
              轮之后，治理影响力变成了现实尽调议题。报道和公开信把 Andrew Reed 与 Sequoia 视作具有董事会层面意义；Cakarel 后来则称 Reed 不在董事会，Sequoia
              也不控制节目编排、编辑或财务决策。这一矛盾不推翻 Sequoia 具有战略重要性的核心事实；它意味着尽调应要求实际董事会名单、股东权利，以及任何观察员或否决机制，而不是只从公开争议中推断。
