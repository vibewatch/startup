      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              MUBI 周围的市场环境一面有吸引力，另一面很苛刻。有吸引力的一面是，整体娱乐与媒体支出仍在增长，专门化服务只要拥有强品味主张，就能证明高端定价合理；MUBI 的策展加院线格式也让它比又一个通用 SVOD
              应用有更锋利的身份。Criterion、OVID、BFI 和 Curzon 都印证了买方仍愿意为选择和文化框架付费；MUBI
              的多设备和下载信息也消除了过去附着在小众流媒体上的部分易用性折价。困难的一面是，消费者钱包数据、流失和向广告支持迁移都指向相反方向。Deloitte 显示消费者不会无限扩大订阅预算，Comscore
              显示逐价行为正把观看推向 FAST 和广告层级，而 MUBI 自身标准价格与宽得多的替代品低价入口重叠。公开证据还留下关键未知：同行份额不透明，GO 受地理限制，MUBI
              在流媒体、院线和更宽电影商业之间的收入拆分未披露。放到估值上，乐观情景取决于高端付费意愿、片库差异化和混合影院经济；悲观情景则是普通流媒体流失叠加特色版权摩擦。因此，承销应少看泛化流媒体 TAM
              话术，多看队列留存、区域版权覆盖、GO 单位经济，以及非订阅收入的利润率画像。
