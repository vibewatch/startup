chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、产品与地理覆盖
        blocks:
          - type: paragraph
            body: >-
              MUBI 的身份已经不只是传统流媒体应用。公司自己的关于页面先问它究竟是「流媒体服务」「策展人」「出版方」还是「发行方」，再回答四者皆是；这与其店面、招聘页面和 MUBI GO
              条款大体一致。落到业务上，公司变现的是策展式订阅视频服务、包含每周一张电影票的高价会员，以及更宽的电影业务，后者已经包括发行、出版和贴近制作的活动。它的消费者界面也足够成熟，更像有规模的直接面向消费者业务，而不是精品小站：MUBI
              宣传月付和年付计划、独立学生层级、原生移动应用、主流客厅设备支持、离线下载和多设备使用。地理证据同样混杂，但方向清楚。第三方公司数据库和 MUBI
              招聘页面把法律和组织中心锚定在伦敦，同时招聘页面还显示它在纽约、柏林、伊斯坦布尔有既有实体，并拥有更广泛的分布式员工队伍。这组合支撑一个简单的尽调框架：MUBI
              由伦敦牵头、全球分布，并被搭成混合型电影平台；如今它的身份同时取决于软件分发和电影版权执行。
