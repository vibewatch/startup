        - 首页、Now Showing、Library 和 Notebook 界面
        - 提高小众或艺术片发现效率
        - 推荐精度或从搜索到播放的转化没有公开证据
      - - 在路上观看
        - 使用 iOS 或 Android 应用，并可下载后离线观看
        - 移动应用支持离线授权，并提供适合 Wi-Fi 环境的下载指引
        - 出差或通勤时可离线携带影片
