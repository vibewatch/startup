  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              MUBI
              作为公司质地故事有吸引力，但作为投资仍然高度价格敏感。最强的公开事实支持几项判断：品牌真实存在，付费订阅用户确实恢复，流媒体、策展、发行并逐步延伸到制作的混合定位也有差异化。但同一组公开记录也说明，当前参考价格已经不低。Sequoia
              2025 年 $100 million 融资把 MUBI 估到 $1 billion；援引 Wall Street Journal 的行业报道则称，2025 年收入约 $200 million，年末订阅用户在
              Q1 2026 反弹至 1.7 million 之前仅约 1.2 million。按这组数字，当前标记约为 5x 收入；按采用的订阅用户基数不同，每名订阅用户约 $588 至 $833。


              对一个快速增长的高端媒体资产来说，这些比率并不荒唐，但容错空间不大。公开小市值垂直媒体可比公司的交易倍数低得多；Netflix 更高的倍数则建立在完全不同的规模、多元化和利润率证明上。正确结论不是 MUBI
              天然被高估，而是投资人应把 $1 billion
              价格视为区间高位入场价。只有收入质量、片单纪律和股权结构表干净度得到证明，它才配得上有把握的买入。我的建议是继续研究，置信度中，风险高；在当前标记下，估值立场偏高。
