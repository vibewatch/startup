      - number: '8.2'
        title: 与前文相连的投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              正向情景建立在前文章节中最强的部分上。MUBI 有真实的高端受众，定价高于大众市场，并占住了同质化流媒体没有的文化位置。服务在 Q1 2026 恢复到 1.7 million 订阅用户的纪录高位；The
              Substance 与 Die My Love 的对比也解释了为什么多头仍有兴趣：MUBI
              仍能把策展和选片转化为院线上行、奖项声量和订阅动能。公司把自己同时定位为流媒体、策展方、出版方和发行方，也解释了它为什么可能相对纯细分 SVOD 同行享有一定溢价。


              反向逻辑同样具体。前文章节显示，MUBI 处在狭窄的高端细分市场，核心流媒体切换成本低，商业模式里的收入组合又很难从公开资料验证。2025 年反弹证明，治理和投资人一致性不仅会伤害声誉，也会直接打到订阅增长。随后
              Die My Love 失手，又显示单个高端内容押注如何拖累现金流。结果是，公司在战略上有意思，但行为仍像高波动媒体资产，而不是可预测的软件平台。因此，投资判断必须对价格和证据敏感，不能只给一个笼统的质量分。
