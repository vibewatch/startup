  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - [Thesis, "Scaled platform proof exists: 450+ kitchens, 45+ brands, more than 70 cities, and more than two million customers support relevance.", "A downgrade would follow if updated disclosures show customer or kitchen counts masking weak same-store productivity."]
      - [Thesis, "Owned-channel and franchise claims suggest Rebel can spread kitchen software, supply chain, and brand assets across more order occasions.", "The argument weakens if audited direct-order share or franchise economics prove materially below vendor and company marketing claims."]
      - [Anti-thesis, "Public valuation anchors look reset rather than compounding: about $500 million in 2019, $1.4 billion in 2021, and a reported $750 million in late 2024.", "The concern eases only if the company discloses a cleaner, current mark with terms that protect new-money returns."]
      - [Anti-thesis, "Group profitability is still unproven, and quick-delivery experimentation has already produced one reported shutdown due to cash burn.", "A better view would require audited margin improvement, lower losses, and evidence that new formats clear hurdle rates without subsidy."]
    notes: >-
      Arguments consolidate cited funding, operating, and channel evidence; they are analytical
      judgments rather than management guidance.
    claimRefs: [CV003, CV006, CV007, CV009, CV010, CV012, CV014, CV015, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Direct ordering and franchise-style expansion prove real, kitchen density keeps improving, and new capital arrives without punitive preference overhang.", "Upside comes from a cleaner exit multiple on a larger revenue base plus lower dilution, but only if profitability inflects.", "Vendor-published channel metrics may overstate defensibility; capital terms remain undisclosed.", "Possible, but unsupported by enough public proof today."]
      - [Base, "Revenue keeps growing, losses narrow gradually, and the latest usable price context stays closer to the reported 2024 reset than the 2021 unicorn mark.", "Returns depend on disciplined entry and term protection rather than multiple expansion from headline growth alone.", "Ongoing losses, channel dependence, and cap-table opacity cap conviction.", "Best fit with the assigned evidence."]
      - [Bear, "Quick-delivery or expansion formats keep burning cash, channel dependence stays high, and new financing comes with senior economics or down-round signaling.", "Equity upside compresses because dilution and preference terms absorb value before common shareholders benefit.", "Public sources do not yet disprove this outcome.", "Must be taken seriously because the source pool already contains burn and shutdown evidence."]
    notes: >-
      Scenario logic is directional because current valuation terms, liquidation preferences, and
      audited FY26 data are not public in the assigned pool.
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV009, CV010, CV012, CV013, CV014, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic under channel dependence
    type: flow
    summary: Scale and sponsorship keep Rebel investable, but unresolved terms and still-negative economics hold the chapter at research-more.
    data:
      nodes:
        - label: Scaled platform proof
          description: A December 2024 joint announcement reported 450 kitchens and more than 70 cities; Rebel's company page still listed 450+ kitchens and 70+ cities when accessed in October 2026.
          tone: positive
        - label: Some channel control
          description: Direct-order and franchise software claims suggest owned-distribution leverage, but the strongest evidence is still partly company or vendor supplied.
          tone: medium
        - label: Losses still matter
          description: FY25 operating revenue improved 13.9%, yet net loss remained ₹336.6 crore.
          tone: adverse
        - label: Valuation reset signal
          description: Assigned sources span about $500 million in 2019, $1.4 billion in 2021, and a reported $750 million late-2024 mark.
          tone: adverse
        - label: Terms still missing
          description: The KKR announcement did not disclose entry valuation, preference stack, or how much recent headline funding actually reached the balance sheet.
          tone: warning
        - label: "Recommendation: research more"
          description: Wait for cleaner price discovery and audited unit-economics proof before underwriting a buy.
          tone: risk
      edges:
        - from: Scaled platform proof
          to: Some channel control
          label: Scale matters if demand is increasingly owned
        - from: Some channel control
          to: Losses still matter
          label: Owned channels help only if they improve margins
        - from: Losses still matter
          to: Valuation reset signal
          label: Unproven profit durability compresses acceptable price
        - from: Valuation reset signal
          to: Terms still missing
          label: Ambiguous marks raise the underwriting bar
        - from: Terms still missing
          to: "Recommendation: research more"
          label: No buy without term and margin clarity
    approximationNotes: >-
      Ordered flow shows underwriting logic, not a quantified conversion rate between steps.
    claimRefs: [CV003, CV005, CV006, CV007, CV008, CV011, CV013, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Public evidence supports waiting for cleaner price discovery
    body: >-
      Rebel Foods is too scaled and too well-sponsored to dismiss, but the assigned pool still
      supports a research-more posture because the latest usable valuation signals and economic
      terms are incomplete.
    claimRefs: [CV003, CV004, CV013, CV015, CV016]
  - calloutType: risk
    title: Downside is driven by terms and cash burn, not by lack of market presence
    body: >-
      The highest-risk branch is not irrelevance; it is paying through unresolved preference and
      dilution overhang while operating losses or new formats continue to absorb cash.
    claimRefs: [CV005, CV006, CV007, CV012, CV013]
