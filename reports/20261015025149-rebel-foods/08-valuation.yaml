  evidenceGaps:
    - type: missing-source
      severity: material
      topic: term-opacity
      missingEvidence: Current cap table, liquidation preferences, anti-dilution provisions, KKR entry valuation, and a verified primary-versus-secondary split for the latest financing.
      whyItMatters: These terms determine whether a reported headline valuation can actually convert into attractive common-equity returns for a new investor.
      diligencePath: Request the latest financing documents, cap table, preference waterfall, and board-approved proceeds memo before setting an entry price.
      relatedQuestionRefs: [QV006, QV009, QV010]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Audited brand-level contribution margins, direct-versus-aggregator order mix, repeat-order cohorts, CAC payback, and kitchen-level payback by format.
      whyItMatters: Scenario ranges are highly sensitive to whether scale and owned channels are actually improving gross profit and cash conversion rather than just revenue volume.
      diligencePath: Obtain audited operating KPI packs for FY25 and FY26, including channel mix, kitchen cohorts, and board reporting on new-format economics.
      relatedQuestionRefs: [QV007, QV008, QV009]
