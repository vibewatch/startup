      - number: '6.2'
        title: Adoption proof is real, and named partner deployments show the model travels
        blocks:
          - type: paragraph
            body: >-
              The strongest public adoption proof is scale plus named deployment evidence. A 2019 Google case study said
              Rebel was already serving about one million consumers per month, operating in 15 Indian cities, and
              offering at least seven brands from each kitchen. More recent public sources describe a much larger
              footprint: roughly 450 kitchens across 75 cities on current official and Mint surfaces, and a December
              2024 company-issued release claiming more than two million customers globally plus more than 5,000
              internet restaurants. The partner side is also visible. YesPress describes Rebel Launcher as a route
              through which outside brands can use Rebel's sourcing, technology, and kitchen network; it then cites
              concrete examples such as Wendy's, Foodpanda, and Easybites. Those examples are important because they
              move the story beyond brand logos: they indicate actual deployment or operating relationships, even though
              the public record still omits contract duration, renewal rates, and revenue contribution by partner.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU006
              - CU008
              - CU014
      - number: '6.3'
        title: Durability still rests on partial proof, with aggregator and format risk intact
        blocks:
          - type: paragraph
            body: >-
              Public evidence on retention and concentration is materially thinner than evidence on scale. Mint reported
              in March 2025 that Swiggy and Zomato still generated "a good chunk" of Rebel's business, which means the
              company has not escaped marketplace dependence even as it builds direct channels. The best public
              direct-channel metrics in the assigned pool come from Ordering.co, which claims that over 80% of orders in
              key cities now flow through EatSure and that those buyers repeat 20-30% more than marketplace users;
              because that source is a marketing blog rather than audited company reporting or independent transaction
              data, those claims should be treated as directional rather than decision-grade. PrivateCircle adds another
              soft signal by interpreting a roughly 32% drop in advertising spend as a shift toward organic or retained
              users, but again this is analysis, not disclosed cohort math. Net: Rebel appears to have several expansion
              loops working, yet public proof of NRR, GRR, channel concentration, and brand-level repeat behavior
              remains a diligence gap.
            claimRefs:
              - CU007
              - CU008
              - CU014
              - CU015
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
