            title: Retention quality is still more asserted than proven
            body: >-
              Direct-order and repeat-purchase claims exist in the assigned pool, but they come from low-reputation
              marketing content rather than disclosed cohort tables, leaving customer durability and concentration
              under-verified.
            calloutType: risk
            claimRefs:
