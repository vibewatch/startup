          Public valuation anchors look reset rather than compounding: about $500 million in 2019, $1.4 billion in 2021,
          and a reported $750 million in late 2024.
        - >-
          The concern eases only if the company discloses a cleaner, current mark with terms that protect new-money
          returns.
      - - Anti-thesis
        - >-
          Group profitability is still unproven, and quick-delivery experimentation has already produced one reported
          shutdown due to cash burn.
        - >-
          A better view would require audited margin improvement, lower losses, and evidence that new formats clear
          hurdle rates without subsidy.
    notes: >-
      Arguments consolidate cited funding, operating, and channel evidence; they are analytical judgments rather than
      management guidance.
    claimRefs:
      - CV003
      - CV006
      - CV007
      - CV009
      - CV010
      - CV012
      - CV014
      - CV015
      - CV016
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Direct ordering and franchise-style expansion prove real, kitchen density keeps improving, and new capital
          arrives without punitive preference overhang.
        - >-
          Upside comes from a cleaner exit multiple on a larger revenue base plus lower dilution, but only if
          profitability inflects.
        - Vendor-published channel metrics may overstate defensibility; capital terms remain undisclosed.
        - Possible, but unsupported by enough public proof today.
      - - Base
        - >-
          Revenue keeps growing, losses narrow gradually, and the latest usable price context stays closer to the
          reported 2024 reset than the 2021 unicorn mark.
        - >-
          Returns depend on disciplined entry and term protection rather than multiple expansion from headline growth
          alone.
        - Ongoing losses, channel dependence, and cap-table opacity cap conviction.
        - Best fit with the assigned evidence.
      - - Bear
        - >-
          Quick-delivery or expansion formats keep burning cash, channel dependence stays high, and new financing comes
          with senior economics or down-round signaling.
        - >-
          Equity upside compresses because dilution and preference terms absorb value before common shareholders
          benefit.
        - Public sources do not yet disprove this outcome.
        - Must be taken seriously because the source pool already contains burn and shutdown evidence.
    notes: >-
      Scenario logic is directional because current valuation terms, liquidation preferences, and audited FY26 data are
      not public in the assigned pool.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      The public timeline shows repeated format pivots, financing steps, and a 2025-2026 operating reset rather than a
      straight-line scale story.
    data:
      items:
        - date: '2011'
          label: Current company form established
          detail: >-
            Recent profile and current pages identify 2011 as the founding point for Rebel Foods under Jaydeep Barman
            and Kallol Banerjee.
          tone: positive
          claimRefs:
            - CO001
        - date: '2019'
          label: Rebel Launcher in market
          detail: >-
            The platform narrative had expanded beyond owned brands into infrastructure and launch support for third
            parties by the end of the 2010s.
          tone: positive
          claimRefs:
            - CO007
            - CO015
        - date: '2020'
          label: EatSure launch period
          detail: >-
            The direct-ordering push moved Rebel toward owning checkout, cross-brand baskets, and more of the customer
            relationship.
          tone: positive
          claimRefs:
            - CO007
        - date: 2024-12
          label: KKR investment announced
          detail: >-
            KKR said its investment would support expansion in India and the Middle East and additional
            food-and-beverage brands.
          tone: positive
          claimRefs:
            - CO008
        - date: 2024-12
          label: Temasek-led round reported
          detail: >-
            Mint separately reported a $210 million Series G at a $750 million valuation, widening the financing
            narrative beyond the KKR release.
          tone: neutral
          claimRefs:
            - CO009
        - date: 2025-02
          label: QuickiES launched
          detail: The 15-minute delivery experiment showed Rebel trying to extend EatSure into faster-delivery occasions.
          tone: neutral
          claimRefs:
            - CO013
            - CO016
        - date: 2025-07
          label: Leadership reshuffle
          detail: Ankush Grover moved into the global CEO role while Jaydeep Barman shifted to chairman and group CEO.
          tone: neutral
          claimRefs:
            - CO011
        - date: '2026'
          label: QuickiES setback reported
          detail: >-
            Inc42's reporting turned the 15-minute push into an adverse milestone by tying it to cash-burn pressure and
            weak traction.
          tone: warning
