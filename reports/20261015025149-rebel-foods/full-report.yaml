  - id: FP001
    title: Competitive positioning map (x = customer relationship control; y = supply-side control)
    type: quadrant
    summary: >-
      Ordinal 1-5 scores based only on retained evidence; higher x means more direct control of the customer
      relationship and higher y means more direct control of food production and kitchen infrastructure.
    data:
      points:
        - label: Rebel Foods
          x: 4
          'y': 5
          detail: >-
            Own kitchens, multi-brand network, EatSure, and partner infrastructure create the strongest retained mix of
            supply-side control with partial direct demand.
        - label: Curefoods / EatClub
          x: 3
          'y': 4
          detail: >-
            Retained sources identify them as alternative multi-brand operators, but do not provide the same breadth of
            direct-channel or infrastructure evidence.
        - label: Swiggy / Zomato
          x: 5
          'y': 2
          detail: >-
            Customer discovery, ranking, and repeat traffic sit with the marketplace, but food production remains
            merchant-side.
        - label: Blinkit Bistro / Swiggy Snacc / Zepto Cafe / Swish
          x: 4
          'y': 3
          detail: >-
            Quick-food entrants compete on speed and app frequency, but retained evidence does not show Rebel-equivalent
            kitchen breadth.
        - label: Independent restaurants
          x: 2
          'y': 2
          detail: >-
            They can own local reputation and food quality, but usually lack multi-brand reuse and scaled digital demand
            control.
        - label: Internal build by a regional chain
          x: 3
          'y': 3
          detail: >-
            A chain can assemble more of the stack itself, but must recreate software, sourcing, and marketplace
            management without Rebel's packaged infrastructure.
    approximationNotes: >-
      Scores are evidence-backed ordinal judgments from the retained pool, not market-share measurements or inferred
      conversion rates.
    claimRefs:
      - CP003
      - CP006
      - CP007
      - CP009
      - CP010
      - CP013
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence describes a shared-kitchen platform that converts demand from direct and marketplace channels into
      food revenue, but still leaves gross-profit and net-profit conversion opaque.
    data:
      nodes:
        - id: diners
          label: Diners
          note: Demand originates with food occasions rather than software seats or subscriptions.
        - id: channels
          label: Ordering channels
          detail: EatSure direct ordering plus third-party marketplaces
        - id: brands
          label: Brand portfolio
          detail: Owned and partner brands address different food missions
        - id: kitchens
          label: Shared kitchens
          detail: 450-kitchen operating network with standardized workflows and software
        - id: revenue
          label: Recognized revenue
          detail: Primarily food sales with a smaller service-revenue component
        - id: gross-profit
          label: Gross-profit pool
          detail: Revenue after ingredients, labor, packaging, and channel or logistics costs
        - id: group-earnings
          label: Group earnings
          detail: Central overhead, expansion, and financing costs determine whether growth reaches profit
      edges:
        - from: diners
          to: channels
          label: Orders originate in direct and marketplace demand
        - from: channels
          to: brands
          label: Basket spans multiple Rebel and partner brands
        - from: brands
          to: kitchens
          label: Shared operations execute production
        - from: kitchens
          to: revenue
          label: Meals sold become reported top-line
        - from: revenue
          to: gross-profit
          label: Variable food, labor, packaging, and delivery costs absorb part of each order
        - from: gross-profit
          to: group-earnings
          label: Corporate overhead, growth bets, and debt service decide net result
    approximationNotes: >-
      This figure is a qualitative operating bridge drawn from public sources. It does not infer undisclosed conversion
      rates or gross-margin values.
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI013
