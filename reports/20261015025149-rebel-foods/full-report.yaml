  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and the buyer stack
        blocks:
          - type: paragraph
            body: >-
              Rebel Foods should be framed as a delivery-first food-commerce platform, not just as a chain of virtual
              restaurants. Its own materials describe brands being created around consumer "food missions" such as
              lunch, dinner, snacks, and weekend gatherings, while independent writeups describe the kitchen as a shared
              factory floor that can host many storefronts from the same site. That creates a multi-sided market
              boundary: the end user is a consumer ordering a meal, the immediate payer is usually the household food
              budget, the discovery layer often sits on Swiggy or Zomato, and a second buyer set consists of partner
              brands or franchise investors purchasing access to Rebel's kitchen, logistics, and operating system. The
              valuation-relevant point is that Rebel is competing simultaneously for order demand, for brand
              distribution, and for capital-efficient kitchen utilization.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM009
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM005
              - CM009
              - CM010
              - CM013
      - number: '2.2'
        title: Evidence-constrained sizing lenses and demand drivers
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports several market lenses, but not a single definitive TAM/SAM/SOM stack. At the
              broadest level, Restaurant India cites India's food-services market as projected to exceed USD 125 billion
              by 2030, which establishes the outer demand envelope but not Rebel's reachable share. At the company lens,
              Rebel and independent summaries point to roughly 450 kitchens, 75 cities, and about 4,000 internet
              restaurants, showing a scaled supply network that can spread fixed infrastructure across many brands.
              Demand-side evidence also explains why Rebel invested in EatSure and quick delivery: legacy storefront
              visibility mattered less when delivery already drove most orders, while owned-channel economics promised
              better data ownership and lower dependence on aggregator commissions. QuickiES adds a newer growth vector,
              but the disclosed evidence still describes it more as a rollout and strategic bet than as a proven revenue
              engine.
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM006
              - CM007
              - CM008
              - CM011
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM008
              - CM011
              - CM012
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM010
              - CM011
              - CM012
      - number: '2.3'
        title: Adoption constraints and unresolved market gaps
        blocks:
          - type: paragraph
            body: >-
              The same evidence that supports Rebel's scale also shows why the market story remains more operational
              than purely financial. Quick delivery compresses execution windows and can trade margin for frequency,
              while Inc42 explicitly describes the format as low margin and says Rebel has not disclosed traction data
              for QuickiES. Regulatory and trust constraints also matter: Restaurant India frames food safety,
              traceability, and operational governance as increasingly central to restaurant growth as the Indian market
              scales. Finally, public sources still do not isolate the pieces investors would want for underwriting a
              sharper market share story, including owned-channel GMV, partner-program economics, repeat-order cohorts,
              and a bounded SAM/SOM for Rebel Launcher or the franchise layer. That means the chapter can justify why
              the market is meaningful and strategically attractive, but not claim a precise, source-backed reachable
              market share.
            claimRefs:
              - CM008
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The market is multi-sided, not a single restaurant TAM
            body: >-
              Rebel's valuation sensitivity comes from how efficiently it converts one kitchen network into consumer
              demand, partner distribution, and franchise expansion, so network metrics, household demand, and channel
              economics should not be collapsed into one additive TAM figure.
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM009
              - CM010
              - CM014
          - type: callout
            title: Quick delivery expands relevance before it proves economics
            body: >-
              QuickiES fits a real demand shift, but the current evidence supports it as a strategic response to
              fast-delivery competition rather than as a disclosed, margin-accretive business line.
            calloutType: risk
            claimRefs:
