      - number: '1.3'
        title: Capital signals, milestones, and current watchpoints
        blocks:
          - type: paragraph
            body: >
              Rebel Foods has enough public financing and operating history to look like a late-stage private company,
              but not enough aligned disclosure to support one uncontested valuation or readiness conclusion. The
              cleanest confirmed recent milestone is KKR's December 2024 investment announcement; separate reporting
              then introduced a $210 million Temasek-led round at a reported $750 million valuation and, later, a
              reported $25 million QIA investment at $1.4 billion. That mismatch, combined with still-loss-making FY25
              financials, means the chapter should treat valuation as unresolved rather than precise. The same caution
              applies to QuickiES: the 15-minute delivery push showed product ambition, but the assigned adverse
              reporting suggests the format did not become durable proof of a stronger business model.
