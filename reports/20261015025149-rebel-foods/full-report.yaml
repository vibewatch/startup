  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Residual risk ranking
        blocks:
          - type: paragraph
            body: >-
              Rebel Foods' highest residual risks come from coordinating a very large, multi-brand operating network
              while still proving durable economics outside growth capital. Current public materials describe roughly
              450 kitchens, 4,000-5,000 internet restaurants, and more than 70 cities, which is enough scale for a
              single process or vendor-control lapse to propagate quickly across brands and formats. Independent
              reporting also says Swiggy and Zomato still contribute a good chunk of demand, FY25 remained loss-making,
              and the 15-minute QuickiES experiment reportedly shut after high cash burn. That makes the underwriting
              debate less about consumer awareness and more about compliance discipline, channel control, and capital
              efficiency.
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR011
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR005
              - CR007
              - CR009
              - CR011
              - CR014
              - CR015
      - number: '7.2'
        title: Regulatory and food-safety exposure
        blocks:
          - type: paragraph
            body: >-
              The regulatory risk is not a disclosed lawsuit or enforcement event against Rebel in the assigned pool; it
              is the absence of kitchen-level compliance evidence against a backdrop of stricter restaurant enforcement.
              Startuptalky says hygiene and worker-welfare concerns have periodically shadowed Rebel's rise, while
              Restaurant India describes a Maharashtra FDA crackdown that now emphasizes documentation, traceability,
              supplier governance, and due process. For an operator with company-owned kitchens, franchised formats, and
              delivery-first brands, the missing public inventory of FSSAI licenses, inspection outcomes, CAPA logs, and
              incident reporting leaves a real diligence gap. Until management discloses those records, food safety
              should be treated as a high-severity but only partially evidenced risk.
            claimRefs:
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.3'
        title: Operating-model and execution risk
        blocks:
          - type: paragraph
            body: >-
              Operational complexity is intrinsic to Rebel's model, not an incidental scale effect. Public sources
              describe a network spanning 45+ brands, partner ventures, franchises, and thousands of internet
              restaurants, while the franchise program requires Rebel software, registered equipment vendors, and
              company-supplied core ingredients. Mint adds that the Quickies launch needed kitchen and workflow upgrades
              for 15-minute delivery, and LinkedIn lists the company at 5,001-10,000 employees. The result is a business
              where kitchen consistency, staff training, vendor traceability, and dispatch reliability all have to work
              in parallel; management has visible scale advantages, but the public evidence does not yet show
              operator-level KPIs that prove those controls are consistently holding.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR010
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR010
              - CR011
              - CR012
              - CR015
      - number: '7.4'
        title: Partner, financial, and kill-criteria view
        blocks:
          - type: paragraph
            body: >-
              The channel and financing stack still carries meaningful downside. Mint says Swiggy and Zomato remain
              strategic partners that generate a good chunk of business, while Ordering.co frames why that matters by
              citing commissions as high as 35% on marketplace orders. At the same time, YesPress reports FY25 operating
              revenue of ₹1,617.4 crore with a net loss of ₹336.6 crore, says the December 2024 $210 million round mixed
              primary and secondary shares, and notes a later ₹150 crore debt raise at a reported 13.9% coupon. KKR's
              expansion mandate can help, but only if it translates into better channel mix and contribution economics
              rather than more capital intensity. The main thesis-break triggers are a fresh compliance incident, a
              continued inability to disclose channel-level economics, or evidence that quick-delivery formats still
              need subsidized cash burn to compete.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR011
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break triggers to watch
            body: >-
              A fresh food-safety or license issue at kitchen level; continued reliance on aggregator demand without
              disclosed direct-channel improvement; evidence that quick-delivery formats still need subsidized cash
              burn; or rising leverage without a clear path to group profitability would all move this chapter from
              underwriteable risk to thesis-break territory.
            calloutType: risk
            claimRefs:
              - CR005
              - CR007
              - CR009
              - CR011
              - CR014
              - CR015
          - type: callout
            title: What would most improve confidence
            body: >-
              Rebel can reduce residual risk fastest by producing kitchen-level compliance records, channel-mix and
              contribution-margin disclosure, and debt or covenant detail that shows recent capital is extending durable
              unit economics rather than funding another subsidized growth push.
            calloutType: assumption
            claimRefs:
              - CR003
              - CR007
              - CR008
              - CR009
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The public-evidence case is strong enough to keep Rebel Foods on an active watchlist, but not strong
              enough to underwrite a buy at an undisclosed or premium mark. The positive side of the ledger is real:
              multiple sources still describe a large multi-brand kitchen network, customer reach above two million, and
              infrastructure that can support both owned and partner brands. The limiting factor is underwriting
              quality. Assigned sources show that Rebel was valued at about $1.4 billion in 2021, but later reporting
              tied the late-2024 Series G to a $750 million mark and the subsequent KKR announcement did not publish
              transaction terms. Combined with ongoing losses and incomplete cap-table visibility, that leaves the right
              recommendation as research-more, with any upgrade dependent on clearer price and margin disclosure.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV013
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV013
              - CV015
              - CV016
      - number: '8.2'
        title: Financing context and underwriting bar
        blocks:
          - type: paragraph
            body: >-
              The usable comparable set inside the assigned pool is Rebel's own financing history rather than a clean
              public-peer multiple frame. AgFunder put the 2019 Series D at an estimated $500 million valuation,
              TechCrunch reported a $1.4 billion valuation in the 2021 Series F, and Mint later reported that the
              December 2024 Series G valued Rebel at $750 million. That sequence points to a reset in acceptable price
              rather than a smooth step-up curve. It also matters that one late-2024 source says the $210 million round
              mixed new and existing shares; secondary purchases pay sellers, not necessarily the company, so the
              headline round size is not the same thing as fresh operating capital. Until Rebel discloses the
              primary-secondary split, preference stack, and KKR entry terms, investors should treat any aggressive
              return case as unproven.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV009
              - CV010
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: Scenarios and downside triggers
        blocks:
          - type: paragraph
            body: >-
              The bull case depends on scale converting into cleaner unit economics: large kitchen density, more direct
              ordering, and franchise or partner channels that widen contribution margins without forcing another heavy
              build-out cycle. The base case is less generous. Rebel still posted a FY25 net loss of ₹336.6 crore even
              as operating revenue grew 13.9%. The downside case is not a remote tail because the assigned pool already
              contains one reported failed experiment: Yespress says QuickiES shut earlier in 2026 because of high cash
              burn. That means scenario work should be built around durability of margins and cash efficiency, not
              around GMV or brand-count optics alone.
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Rebel has enough brand breadth, geographic spread, and sponsor interest to preserve strategic and eventual
              IPO optionality, but the chapter's evidence does not yet support calling the business exit-ready on public
              terms alone. Mint says management was gearing up for a 2025-26 listing window, yet the same source also
              shows dependence on Swiggy and Zomato for a meaningful share of demand. Before moving from research-more
              to buy, an investor should ask for the current cap table, liquidation preferences,
              primary-versus-secondary proceeds for the last round, debt and covenant schedules, and audited brand-level
              contribution economics split by direct and aggregator channels. The thesis should break if updated
              disclosures show persistent negative unit economics, senior preference overhang that traps common returns,
              or growth that still requires cash-burn formats such as QuickiES.
            claimRefs:
              - CV005
              - CV008
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public evidence supports waiting for cleaner price discovery
            body: >-
              Rebel Foods is too scaled and too well-sponsored to dismiss, but the assigned pool still supports a
              research-more posture because the latest usable valuation signals and economic terms are incomplete.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV004
              - CV013
              - CV015
              - CV016
          - type: callout
            title: Downside is driven by terms and cash burn, not by lack of market presence
            body: >-
              The highest-risk branch is not irrelevance; it is paying through unresolved preference and dilution
              overhang while operating losses or new formats continue to absorb cash.
            calloutType: risk
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV012
              - CV013
