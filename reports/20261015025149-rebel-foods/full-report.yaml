              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Multiple demand surfaces reduce single-channel dependence
            body: >-
              Rebel is not relying on one storefront alone: public evidence points to owned-app ordering, marketplace
              demand, offline formats, and partner-brand deployments sharing the same kitchen and software backbone.
            calloutType: strength
            claimRefs:
              - CU004
              - CU007
