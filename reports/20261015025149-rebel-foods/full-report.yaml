  - id: FV001
    title: Recommendation logic under channel dependence
    type: flow
    summary: >-
      Scale and sponsorship keep Rebel investable, but unresolved terms and still-negative economics hold the chapter at
      research-more.
    data:
      nodes:
        - label: Scaled platform proof
          description: >-
            A December 2024 joint announcement reported 450 kitchens and more than 70 cities; Rebel's company page still
            listed 450+ kitchens and 70+ cities when accessed in October 2026.
          tone: positive
        - label: Some channel control
          description: >-
            Direct-order and franchise software claims suggest owned-distribution leverage, but the strongest evidence
            is still partly company or vendor supplied.
          tone: medium
        - label: Losses still matter
          description: FY25 operating revenue improved 13.9%, yet net loss remained ₹336.6 crore.
          tone: adverse
        - label: Valuation reset signal
          description: >-
            Assigned sources span about $500 million in 2019, $1.4 billion in 2021, and a reported $750 million
            late-2024 mark.
          tone: adverse
        - label: Terms still missing
          description: >-
            The KKR announcement did not disclose entry valuation, preference stack, or how much recent headline funding
            actually reached the balance sheet.
          tone: warning
        - label: 'Recommendation: research more'
          description: Wait for cleaner price discovery and audited unit-economics proof before underwriting a buy.
          tone: risk
      edges:
        - from: Scaled platform proof
          to: Some channel control
          label: Scale matters if demand is increasingly owned
        - from: Some channel control
          to: Losses still matter
          label: Owned channels help only if they improve margins
        - from: Losses still matter
          to: Valuation reset signal
          label: Unproven profit durability compresses acceptable price
        - from: Valuation reset signal
          to: Terms still missing
          label: Ambiguous marks raise the underwriting bar
        - from: Terms still missing
          to: 'Recommendation: research more'
          label: No buy without term and margin clarity
    approximationNotes: Ordered flow shows underwriting logic, not a quantified conversion rate between steps.
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV007
      - CV008
      - CV011
      - CV013
      - CV015
      - CV016
