        title: Identity, footprint, and operating model
        blocks:
          - type: paragraph
            body: >
              Rebel Foods presents itself as an internet-restaurant and cloud-kitchen operator rather than a
              conventional chain, with Rebel OS positioned as the operating layer that lets it launch, scale, and
              support multiple food brands from shared infrastructure. The strongest verified identity facts are stable:
              current sources place the company in Mumbai, show a 2011 founding, and tie the business to founders
              Jaydeep Barman and Kallol Banerjee. The scale story is directionally clear but not perfectly reconciled:
              the current "who we are" page says 4,000+ internet restaurants, 450+ kitchens, 70+ cities, 10 countries,
              and 2M+ customers, while another current company page lists 3 countries and 75 cities. That discrepancy
              matters because later chapters will depend on this chapter as the ground-truth reference for operating
              footprint and maturity.
