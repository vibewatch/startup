        title: Exhibits
        blocks:
          - type: callout
            title: Scale is not a reliability or security attestation
            body: >-
              Kitchen counts, brands launched and partner case studies demonstrate deployment breadth, but none of the
              assigned sources provides current uptime, incident, security, certification or privacy-control evidence.
            calloutType: risk
            claimRefs:
              - CE001
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segments span end consumers, owned channels, and partner demand
        blocks:
          - type: paragraph
            body: >-
              Rebel's customer architecture is broader than a single food-delivery buyer persona. The company's own
              "What We Do" page says its brands are built around distinct food missions such as lunch, dinner, snacks,
              and weekend gatherings, while third-party descriptions emphasize the operational logic of serving those
              occasions through multiple virtual brands from shared kitchens. That points to at least four practical
              customer surfaces: direct end consumers ordering a specific brand, multi-brand households using EatSure,
              marketplace users reached through Swiggy and Zomato, and external brands or franchise partners that use
              Rebel's kitchen and software footprint. This breadth matters because it diversifies acquisition paths, but
              it also makes customer economics harder to judge from public material alone. Public sources do not
              disclose revenue or order mix by channel, so the most defensible conclusion is that Rebel has meaningful
              demand across several segments without enough outside evidence to rank their profitability or stickiness.
            claimRefs:
              - CU001
              - CU007
