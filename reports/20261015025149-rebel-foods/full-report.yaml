        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >
              Leadership appears founder-led but increasingly split between strategy and execution. Jaydeep Barman
              remains central to the story and, according to recent coverage, moved into a chairman and group-CEO role
              while Ankush Grover became global CEO in 2025. That looks consistent with a company preparing itself for a
              larger financing and eventual IPO process, but the assigned pool still leaves material blind spots: it
              names founders, current operators, and some investors, yet it does not surface a current board roster,
              committee structure, or decision-rights summary. The practical takeaway is that Rebel's public narrative
