callouts:
  - calloutType: risk
    title: Thesis-break triggers to watch
    body: >-
      A fresh food-safety or license issue at kitchen level; continued reliance on aggregator demand
      without disclosed direct-channel improvement; evidence that quick-delivery formats still need
      subsidized cash burn; or rising leverage without a clear path to group profitability would all
      move this chapter from underwriteable risk to thesis-break territory.
    claimRefs: [CR005, CR007, CR009, CR011, CR014, CR015]
  - calloutType: assumption
    title: What would most improve confidence
    body: >-
      Rebel can reduce residual risk fastest by producing kitchen-level compliance records,
      channel-mix and contribution-margin disclosure, and debt or covenant detail that shows recent
      capital is extending durable unit economics rather than funding another subsidized growth push.
    claimRefs: [CR003, CR007, CR008, CR009, CR015]
