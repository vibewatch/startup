  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: food-safety-compliance
      missingEvidence: Kitchen-level FSSAI licence inventory, inspection findings, CAPA logs, and disclosed food-safety incidents across Rebel-owned and partner-operated sites.
      whyItMatters: Without site-level compliance evidence, the top-severity regulatory risk cannot be reduced from a narrative concern to a verified control assessment.
      diligencePath: Request a current kitchen register with FSSAI numbers, inspection history, non-conformance logs, corrective actions, and any regulator notices by city.
      relatedQuestionRefs: [QR008]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: channel-mix
      missingEvidence: Direct versus aggregator order mix, contribution margins, repeat cohorts, and brand-level profitability by channel and geography.
      whyItMatters: Channel dependence is central to Rebel's margin story, but public evidence does not show whether owned-channel growth is meaningfully de-risking aggregator economics.
      diligencePath: Obtain board or investor reporting for direct-order share, commissions as a percent of GMV, cohort retention, and contribution margins by major brand.
