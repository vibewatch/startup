  - id: "TE003"
    title: "Technology and operating architecture"
    columns: ["Layer or component", "Disclosed role", "Key dependency", "Principal risk"]
    rows:
      - ["Consumer and channel interfaces", "Accept orders through applications, brand sites and partner channels", "Mobile, web and aggregator availability", "Fragmented customer identity and channel dependence"]
      - ["Location and routing services", "Geocode customers, estimate arrival time and direct drivers", "Google Maps Platform APIs and implementation partner", "External API cost, availability and model drift"]
      - ["Data and forecasting", "Support inventory recommendations, demand and workforce planning", "BigQuery, historical behavior and usable order data", "Sparse public evidence on accuracy, governance and privacy"]
      - ["Kitchen orchestration", "Coordinate inventory, kitchen work and delivery", "Rebel OS, Rebel+ and local staff adoption", "Operational complexity across brands and sites"]
      - ["Physical production and supply", "Prepare multiple menus with shared facilities and standardized inputs", "Brand-specific equipment, core ingredients and trained labor", "Supply disruption, food quality and cross-brand execution variance"]
    notes: "The architecture is reconstructed from 2019-2025 public disclosures; current component versions, ownership boundaries and control coverage remain unverified."
    claimRefs: [CE004, CE005, CE006, CE008, CE009, CE010, CE011, CE013]
