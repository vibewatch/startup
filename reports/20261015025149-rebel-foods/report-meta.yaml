companyProfile:
  summary: >-
    Rebel Foods is a privately held Mumbai-based food-tech platform built around shared kitchens, multi-brand internet
    restaurants, direct ordering through EatSure, and partner infrastructure such as franchise and launcher formats. The
    public record supports a scaled operating base and multiple financing milestones, but it still leaves valuation,
    geography, workforce, and governance details partly unresolved.
