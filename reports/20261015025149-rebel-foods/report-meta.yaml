  topStrengths:
    - Scaled kitchen and brand footprint gives Rebel operational reach that smaller peers cannot match.
    - >-
      Direct ordering and partner infrastructure give it more control over demand than a pure marketplace-dependent
      model.
    - Recent financing and sponsor interest keep the company strategically relevant and exit-optional.
  topRisks:
    - >-
      Current valuation and financing terms remain incompletely disclosed and internally conflicted across public
      sources.
    - Public evidence still does not prove durable, company-wide profitability or channel economics.
    - Dependence on aggregators, quick-delivery experiments, and governance opacity can compress returns.
  unresolvedGaps:
    - >-
      Current cap table, liquidation preferences, and primary-versus-secondary split for the latest financing remain
      undisclosed.
    - Brand-level contribution margins and direct-versus-aggregator economics are still not publicly audited.
    - Kitchen-level food-safety disclosure and inspection history remain incomplete in the public record.
    - Public valuation anchors still conflict across 2019, 2021, and late-2024 reporting.
