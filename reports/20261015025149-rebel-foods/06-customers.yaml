  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-metrics
      missingEvidence: Brand-, city-, and channel-level retention evidence such as NRR, GRR, churn, cohort curves, and repeat-order frequency.
      whyItMatters: Without disclosed cohort math, it is hard to distinguish durable owned-channel behavior from promotional or marketplace-assisted demand.
      diligencePath: Request cohort tables for EatSure, marketplaces, and major brands, including cohort definitions and at least four rolling periods.
      relatedQuestionRefs: [QU005]
      relatedTableRefs: [TU002]
    - type: private-evidence-only
      severity: material
      topic: channel-concentration
      missingEvidence: Revenue or order mix by EatSure, Swiggy, Zomato, offline formats, franchise, and partner-brand channels.
      whyItMatters: Customer concentration risk cannot be judged from public headlines alone when marketplaces still contribute a meaningful share.
      diligencePath: Obtain channel-mix, take-rate, and contribution-margin reporting for the latest 12 months, with top-brand concentration by GMV or orders.
      relatedQuestionRefs: [QU004, QU008]
      relatedTableRefs: [TU001, TU002]
    - type: private-evidence-only
      severity: material
      topic: partner-economics
      missingEvidence: Contract duration, renewal rates, revenue share, and kitchen-level economics for Rebel Launcher, franchise, and named partner deployments.
      whyItMatters: Named proofs show the network is used, but they do not show whether those relationships are sticky or financially attractive.
      diligencePath: Review sample agreements and cohort performance for Wendy's, Easybites, franchise partners, and any still-active channel partnerships.
      relatedQuestionRefs: [QU003, QU006]
      relatedTableRefs: [TU003]
