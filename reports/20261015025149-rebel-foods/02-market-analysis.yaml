    title: Market sizing lens
    type: pyramid
    summary: Rebel's market story is best read as stacked evidence lenses rather than a single additive TAM estimate.
    data:
      items:
        - label: India food-services envelope
          value: 125
          unit: USD bn by 2030
          note: Industry-wide projection, not a Rebel-specific TAM.
          claimRefs: [CM011]
        - label: Geographic operating footprint
          displayValue: 75 cities / 3 countries
          note: Official coverage lens showing where the network can already serve or launch brands.
          claimRefs: [CM002]
        - label: Kitchen network
          value: 450
          unit: kitchens
          note: Supply-side density that supports multiple brands per site.
          claimRefs: [CM002, CM003]
        - label: Internet restaurant storefronts
          value: 4000
          unit: internet restaurants
          note: One kitchen can host multiple storefronts; this is not the same as unique physical outlets.
          claimRefs: [CM002, CM003]
        - label: Franchise entry budget
          displayValue: 90 Lacs-1cr
          note: Capital requirement for the dine-in plus cloud-kitchen franchise route.
          claimRefs: [CM010]
        - label: Quick-delivery service promise
          displayValue: 15 minutes
          note: Strategic convenience wedge; public sources do not yet disclose traction or margin outcomes.
          claimRefs: [CM008, CM012]
    approximationNotes: >-
      The layers are evidence-backed market lenses with mixed units, so the pyramid communicates scope and sequence rather than an additive value bridge.
    claimRefs: [CM002, CM003, CM008, CM010, CM011, CM012]
