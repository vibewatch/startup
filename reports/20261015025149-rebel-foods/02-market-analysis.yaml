      - [Aggregator marketplace demand, "Discovery-led meal orders routed through Swiggy/Zomato and similar marketplaces", "Orders already migrated into Rebel-owned channels", "Consumer pays; Rebel effectively pays commission for access", "Still a major discovery layer and competitive benchmark for reach and delivery expectations."]
      - [Multi-brand kitchen infrastructure, "Kitchen capacity, shared procurement, launch tooling, and operating systems supporting multiple brands per site", "Standalone single-brand restaurants with dedicated back-of-house economics", "Rebel brand teams and operating management", "Explains why one physical network can support many storefronts and food missions."]
      - [Partner and franchise enablement, "Rebel Launcher and franchise formats that package kitchens, sourcing, technology, and brand distribution", "Pure software vendors or restaurant consultancies without fulfillment infrastructure", "Partner brand operator or franchise investor", "Adds a second buyer stack beyond the end consumer and broadens the revenue opportunity."]
    notes: >-
      This is a boundary table, not an additive TAM bridge. Rebel participates in consumer demand, marketplace distribution, and partner infrastructure at the same time.
    claimRefs: [CM001, CM003, CM004, CM005, CM009, CM010]
  - id: TM002
    title: TAM / SAM / SOM or sizing lens table
    columns:
      - Lens
      - Publisher / period
      - Geography
      - Value or proxy
      - Growth / timing
      - Methodology
      - Confidence
      - Limitation
    rows:
      - ["Broad food-services envelope", "Restaurant India, 2026 article citing 2030 projection", India, "USD 125 billion by 2030", "2030 endpoint; CAGR not stated", "Industry projection used as outer market context", medium, "Not specific to cloud kitchens, owned-channel delivery, or Rebel's reachable share."]
      - ["Current operating footprint", "Rebel Foods official site and Petpooja, current/FY25 context", "India + UAE + UK", "450 kitchens; 75 cities; about 4,000 internet restaurants", "Current operating snapshot", "Supply-side network proxy showing distribution density", medium, "Company-reported footprint, not a revenue or demand measure."]
      - ["Company revenue base", "Petpooja citing FY25 accounts", "Company-wide", "₹1,617 crore revenue; ₹336 crore loss", "FY25, +14% revenue y/y", "Financial scale lens for what the current network is monetizing", medium, "Company-wide result does not isolate EatSure, QuickiES, or partner-program revenue."]
      - ["Fast-delivery expansion lens", "Mint and Inc42, 2025", "Mumbai launch with planned metro expansion", "15-minute QuickiES promise; rollout to NCR, Bengaluru, Chennai, and Pune in 6-12 months", "2025 launch window", "SOM-adjacent demand test tied to convenience and speed", medium, "No disclosed GMV, order density, or margin data for the product line."]
    notes: >-
      The rows use different denominators and should be read as complementary sizing lenses. Public sources do not support a clean, source-backed SAM/SOM stack for EatSure or Rebel Launcher.
    claimRefs: [CM002, CM008, CM011, CM012, CM014]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner / adoption trigger
      - Implication
    rows:
      - ["Meal-mission consumer", "End consumer choosing lunch/dinner/snack occasions", "Same individual or household members", "Household food budget", "Order a branded meal through EatSure or an aggregator", "Convenience, trusted quality, bundled ordering, and delivery speed", "Explains why Rebel organizes brands around food missions instead of one master brand."]
      - ["Owned-channel app customer", "Consumer already familiar with Rebel brands", "Same", "Household food budget", "Use EatSure for multi-brand ordering and direct relationship", "Lower-friction repeat ordering and perceived trust versus marketplace-only ordering", "Owned channel matters because data ownership and margin control improve relative to third-party marketplaces."]
      - ["Partner brand operator", "Restaurant or food brand seeking expansion without building the full stack", "Commercial and operations teams", "Partner P&L", "Use Rebel Launcher / shared kitchens / sourcing / logistics", "Faster go-to-market and lower capex versus self-building", "This makes the market partly B2B infrastructure, not only consumer food delivery."]
      - ["Franchise investor / offline operator", "Local investor or operator", "Store and kitchen teams", "Franchisee capex and operating budget", "Open dine-in plus cloud-kitchen format tied to Rebel brands", "90 Lacs-1cr investment, 1500 sqft requirement, and channel diversification", "Offline expansion is also a market-access move to reduce pure aggregator dependence."]
    notes: >-
      The buyer map spans both sides of the platform. Consumer demand and partner/franchise adoption should be assessed separately because their budgets, payback expectations, and switching costs differ.
    claimRefs: [CM001, CM005, CM009, CM010, CM013]
figures:
