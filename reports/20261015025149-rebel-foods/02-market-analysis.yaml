  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: sizing-gap
      missingEvidence: A management-quality breakout of EatSure GMV, owned-channel share, partner-program revenue, and any internal SAM/SOM framework by city or cohort.
      whyItMatters: Without it, the market argument stays at the level of broad industry and operating-footprint proxies rather than a reachability model.
      diligencePath: Request board or fundraising materials showing channel mix, city penetration, and revenue by owned channel, aggregator channel, and partner services.
      relatedQuestionRefs: [QM002, QM008]
      relatedTableRefs: [TM002]
    - type: missing-source
      severity: material
      topic: quick-delivery
      missingEvidence: QuickiES order volume, repeat rate, contribution margin, and service-level performance after launch.
      whyItMatters: Quick delivery can expand demand and frequency, but it can also destroy margin if density and basket economics are weak.
      diligencePath: Ask for QuickiES cohort dashboards, city launch scorecards, and any internal margin analysis by fulfillment radius.
      relatedQuestionRefs: [QM006, QM007]
    - type: missing-source
      severity: minor
      topic: compliance
      missingEvidence: A complete public inventory of kitchen-level FSSAI licences, inspection history, and standardized hygiene ratings across Rebel's footprint.
      whyItMatters: Food safety and traceability are increasingly part of adoption and brand trust, especially as delivery-first brands scale nationally.
      diligencePath: Compile kitchen-level licence and inspection records from regulators or request a verified compliance data room extract from the company.
      relatedQuestionRefs: [QM007]
