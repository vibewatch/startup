evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: >-
      A signed cap-table snapshot and financing term summary that reconciles the December 2024 and 2025 valuation
      references.
    whyItMatters: >-
      The current record points to materially different valuation anchors, which changes how later chapters interpret
      ownership dilution and pricing risk.
    diligencePath: >-
      Request the post-money cap table, primary-versus-secondary share split, and investor rights summary for the
      December 2024 and 2025 financings.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: geography
    missingEvidence: >-
      A management-confirmed operating-footprint table for countries, cities, kitchens, and internet restaurants as of a
      single date.
    whyItMatters: >-
      Later market, operations, and valuation chapters need one reconciled footprint baseline rather than conflicting
      current website counts.
    diligencePath: >-
      Request a current operating dashboard or board pack page that lists the latest footprint metrics and their as-of
      date.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee structure, liquidation preferences, and any debt covenant summary.
    whyItMatters: >-
      Control rights and financing obligations can materially change downside protection and IPO readiness even when
      top-line growth looks intact.
    diligencePath: Request the board deck front matter, shareholder agreement summary, and current debt term sheets.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: headcount-and-customers
    missingEvidence: A dated management metric sheet for current headcount, active customers, repeat rates, and direct-order share.
    whyItMatters: >-
      The assigned pool shows platform-profile ranges and company claims, but not the dated operating metrics needed to
      benchmark efficiency and channel quality.
    diligencePath: Request the latest monthly operating KPI pack with workforce, customer, repeat, and channel-mix metrics.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A management-quality breakout of EatSure GMV, owned-channel share, partner-program revenue, and any internal
      SAM/SOM framework by city or cohort.
    whyItMatters: >-
      Without it, the market argument stays at the level of broad industry and operating-footprint proxies rather than a
      reachability model.
    diligencePath: >-
      Request board or fundraising materials showing channel mix, city penetration, and revenue by owned channel,
      aggregator channel, and partner services.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: quick-delivery
    missingEvidence: QuickiES order volume, repeat rate, contribution margin, and service-level performance after launch.
    whyItMatters: >-
      Quick delivery can expand demand and frequency, but it can also destroy margin if density and basket economics are
      weak.
    diligencePath: >-
      Ask for QuickiES cohort dashboards, city launch scorecards, and any internal margin analysis by fulfillment
      radius.
    relatedQuestionRefs:
      - QM006
      - QM007
  - type: missing-source
    severity: minor
    topic: compliance
    missingEvidence: >-
      A complete public inventory of kitchen-level FSSAI licences, inspection history, and standardized hygiene ratings
      across Rebel's footprint.
    whyItMatters: >-
      Food safety and traceability are increasingly part of adoption and brand trust, especially as delivery-first
      brands scale nationally.
    diligencePath: >-
      Compile kitchen-level licence and inspection records from regulators or request a verified compliance data room
      extract from the company.
    relatedQuestionRefs:
      - QM007
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Public menu-price parity, commission terms, discounting rules, and contribution economics for Rebel, EatSure,
      marketplaces, and named direct peers.
    whyItMatters: >-
      Without like-for-like public pricing and subsidy evidence, competitive intensity is directionally clear but margin
      durability is not underwritten.
    diligencePath: >-
      Gather current city-level menu screenshots, promo terms, and partner contracts for Rebel, Curefoods, EatClub,
      Swiggy, and Zomato.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: peer-comparables
    missingEvidence: >-
      Current peer-owned disclosures on funding, kitchen count, active cities, and brand count for Curefoods, EatClub,
      and quick-food entrants.
    whyItMatters: >-
      The retained pool is strong enough to frame the competitive landscape, but not to size rivals' balance-sheet
      capacity or rollout speed on an apples-to-apples basis.
    diligencePath: >-
      In a later refresh, add direct peer-company and peer-investor disclosures that are already allocated to the
      competitors chapter rather than inferring from Rebel-focused coverage.
  - type: missing-source
    severity: material
    topic: company-specific-governance
    missingEvidence: Rebel-specific inspection history, kitchen-level quality metrics, and disclosed incident or remediation data.
    whyItMatters: >-
      Trust and regulatory posture matter in restaurant competition, but the retained pool supports the criterion more
      clearly than it supports Rebel's own performance against it.
    diligencePath: >-
      Add company-specific food-safety disclosures, regulator records, or credible incident reporting for Rebel and
      direct peers before using compliance as a stronger comparative moat claim.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: material
    topic: channel-economics
    missingEvidence: Brand-level profitability, direct-versus-aggregator mix, repeat-order cohorts, and contribution margin by channel.
    whyItMatters: These inputs determine whether growth is improving underlying economics or simply scaling a low-margin order base.
    diligencePath: Request management reporting by brand, channel, and city, including cohorts, take rates, and contribution margins.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: blocking
    topic: liquidity
    missingEvidence: Current cash on hand, monthly burn, runway, debt maturity schedule, covenant package, and security structure.
    whyItMatters: Capital adequacy cannot be underwritten from valuation headlines or fundraising announcements alone.
    diligencePath: >-
      Obtain the latest board pack or lender package with cash balance, cash flow forecast, debt terms, and downside
      covenants.
    relatedQuestionRefs:
      - QI005
      - QI008
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Realized discounts, marketplace commissions, franchise royalty rates, and net revenue recognition by monetization
      lane.
    whyItMatters: >-
      Public list economics do not show how much value Rebel actually retains from each order, partner contract, or
      franchise relationship.
    diligencePath: >-
      Review partner contracts, franchise agreements, and monthly revenue waterfalls from gross order value to net
      recognized revenue.
    relatedQuestionRefs:
      - QI001
      - QI007
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: quick-delivery-unit-economics
    missingEvidence: >-
      Basket margin, free-order incidence, cancellation rate, rider cost, and kitchen utilization for Quickies versus
      the core model.
    whyItMatters: >-
      The quick-delivery shutdown is strategically important, but public evidence still does not quantify exactly where
      the format broke.
    diligencePath: >-
      Ask for Quickies launch and closure postmortem materials, including city-level contribution margin and refund
      data.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Current security certifications, privacy and data-retention architecture, uptime history, penetration-test
      summary, food-safety control metrics and incident disclosures.
    whyItMatters: >-
      The system coordinates consumer location, order, workforce and kitchen data across a large physical network, so
      unverified controls could create operational, regulatory and reputational exposure.
    diligencePath: >-
      Request the current trust pack, system and data-flow diagrams, subprocessor list, incident register, status
      history, audit reports and food-safety control dashboard.
    relatedQuestionRefs:
      - QE006
  - type: stale
    severity: material
    topic: operating-stack
    missingEvidence: >-
      A current architecture inventory showing which 2019-2023 cloud, analytics, automation and kitchen-management
      components remain in production.
    whyItMatters: >-
      Historical partner and teaching cases cannot establish the present build-versus-buy boundary, technical debt,
      scalability or support obligations.
    diligencePath: >-
      Obtain a 2026 architecture review with component owners, versions, service levels, spend, failure modes and
      deprecation roadmap.
    relatedQuestionRefs:
      - QE003
      - QE008
  - type: conflicting-data
    severity: material
    topic: roadmap-execution
    missingEvidence: >-
      Company confirmation of Quickies' operating status, closure timing, affected markets and unit-economics
      postmortem.
    whyItMatters: >-
      The reported closure tests whether the shared-kitchen technology can support faster delivery without uneconomic
      last-mile and operating costs.
    diligencePath: >-
      Request launch and closure decision papers, city cohorts, preparation and delivery SLAs, contribution margins and
      cash-burn reconciliation.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: >-
      Brand-, city-, and channel-level retention evidence such as NRR, GRR, churn, cohort curves, and repeat-order
      frequency.
    whyItMatters: >-
      Without disclosed cohort math, it is hard to distinguish durable owned-channel behavior from promotional or
      marketplace-assisted demand.
    diligencePath: >-
      Request cohort tables for EatSure, marketplaces, and major brands, including cohort definitions and at least four
      rolling periods.
    relatedQuestionRefs:
      - QU005
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
    topic: channel-concentration
    missingEvidence: Revenue or order mix by EatSure, Swiggy, Zomato, offline formats, franchise, and partner-brand channels.
    whyItMatters: >-
      Customer concentration risk cannot be judged from public headlines alone when marketplaces still contribute a
      meaningful share.
    diligencePath: >-
      Obtain channel-mix, take-rate, and contribution-margin reporting for the latest 12 months, with top-brand
      concentration by GMV or orders.
    relatedQuestionRefs:
      - QU004
      - QU008
    relatedTableRefs:
      - TU001
      - TU002
  - type: private-evidence-only
    severity: material
    topic: partner-economics
    missingEvidence: >-
      Contract duration, renewal rates, revenue share, and kitchen-level economics for Rebel Launcher, franchise, and
      named partner deployments.
    whyItMatters: >-
      Named proofs show the network is used, but they do not show whether those relationships are sticky or financially
      attractive.
    diligencePath: >-
      Review sample agreements and cohort performance for Wendy's, Easybites, franchise partners, and any still-active
      channel partnerships.
    relatedQuestionRefs:
      - QU003
      - QU006
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: food-safety-compliance
    missingEvidence: >-
      Kitchen-level FSSAI licence inventory, inspection findings, CAPA logs, and disclosed food-safety incidents across
      Rebel-owned and partner-operated sites.
    whyItMatters: >-
      Without site-level compliance evidence, the top-severity regulatory risk cannot be reduced from a narrative
      concern to a verified control assessment.
    diligencePath: >-
      Request a current kitchen register with FSSAI numbers, inspection history, non-conformance logs, corrective
      actions, and any regulator notices by city.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: channel-mix
    missingEvidence: >-
      Direct versus aggregator order mix, contribution margins, repeat cohorts, and brand-level profitability by channel
      and geography.
