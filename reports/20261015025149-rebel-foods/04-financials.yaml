    claimRefs: [CI004, CI012]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / signal
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - FY24 revenue versus expenses
        - ₹1,420 crore revenue from operations versus ₹1,857 crore expenses
        - medium
        - Shows scale without group profitability
        - Audited FY25/FY26 P&L, cash flow statement, and segment bridge
      - - FY25 revenue versus net loss
        - ₹1,617.4 crore operating revenue versus ₹336.6 crore net loss
        - medium
        - Improvement is visible, but breakeven is still unproven
        - EBITDA, gross margin by brand, and overhead allocation
      - - Shared-kitchen fixed-cost leverage
        - Founder retrospective says an upstairs pilot kitchen had rent 80% below a comparable high-street site
        - low
        - Illustrates why the model can reduce fixed costs if demand utilization is strong
        - Mature kitchen cohort payback, utilization, and closure rates
      - - Quick-delivery deployment
        - Quickies launched off a full-stack setup across 50-odd locations with incremental kitchen and workflow upgrades
        - medium
        - Reuse of installed base can lower entry cost for new formats, but does not prove positive unit economics
        - Basket margin, cancellation or free-order rate, and rider cost by zone
      - - Cost of debt
        - ₹150 crore debt at a reported 13.9% annual coupon
        - medium
        - Financing is no longer free and directly affects equity value
        - Maturity profile, security package, and covenant headroom
    notes: >-
      This table mixes reported financials with public operating proxies. Null
      private metrics are converted into diligence asks rather than estimated.
    claimRefs: [CI005, CI006, CI009, CI010, CI011, CI012, CI013]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence describes a shared-kitchen platform that converts demand
      from direct and marketplace channels into food revenue, but still leaves
      gross-profit and net-profit conversion opaque.
    data:
      nodes:
        - id: diners
          label: Diners
          note: Demand originates with food occasions rather than software seats or subscriptions.
        - id: channels
          label: Ordering channels
          detail: EatSure direct ordering plus third-party marketplaces
        - id: brands
          label: Brand portfolio
          detail: Owned and partner brands address different food missions
        - id: kitchens
          label: Shared kitchens
          detail: 450-kitchen operating network with standardized workflows and software
        - id: revenue
          label: Recognized revenue
          detail: Primarily food sales with a smaller service-revenue component
        - id: gross-profit
          label: Gross-profit pool
          detail: Revenue after ingredients, labor, packaging, and channel or logistics costs
        - id: group-earnings
          label: Group earnings
          detail: Central overhead, expansion, and financing costs determine whether growth reaches profit
      edges:
        - from: diners
          to: channels
          label: Orders originate in direct and marketplace demand
        - from: channels
          to: brands
          label: Basket spans multiple Rebel and partner brands
        - from: brands
          to: kitchens
          label: Shared operations execute production
        - from: kitchens
          to: revenue
          label: Meals sold become reported top-line
        - from: revenue
          to: gross-profit
          label: Variable food, labor, packaging, and delivery costs absorb part of each order
        - from: gross-profit
          to: group-earnings
          label: Corporate overhead, growth bets, and debt service decide net result
    approximationNotes: >-
      This figure is a qualitative operating bridge drawn from public sources.
      It does not infer undisclosed conversion rates or gross-margin values.
    claimRefs: [CI001, CI003, CI004, CI013]
callouts:
  - calloutType: risk
    title: Capital still outruns proof of self-funding
    body: >-
      The best public signs of growth are real, but late-2024 and 2025 sources
      still show a lower valuation band than the 2021 unicorn round and a
      meaningful new debt coupon. That combination implies investors and lenders
      still matter to Rebel's operating runway and strategic optionality.
    claimRefs: [CI006, CI008, CI009, CI011]
  - calloutType: insight
    title: Public list economics are not realized economics
    body: >-
      Franchise investment and partner-program disclosures prove Rebel has more
      than one way to monetize its kitchen network, but they do not reveal
      realized pricing, take rates, repeat behavior, or contribution margin.
      Those remain diligence asks, not underwritable facts.
    claimRefs: [CI004, CI012]
