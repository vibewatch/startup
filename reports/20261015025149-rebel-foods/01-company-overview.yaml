chapter:
  number: 1
  title: "Company Overview"
  summary: "Rebel Foods is a privately held Mumbai food-tech platform built around multi-brand internet restaurants, shared kitchens, and its Rebel OS operating stack. The current public record supports meaningful scale and financing milestones, but it does not yet reconcile key valuation, geography, workforce, and governance details into one clean anchor."
sections:
  - id: "identity-and-scale"
    title: "Identity, footprint, and operating model"
    body: |
      Rebel Foods presents itself as an internet-restaurant and cloud-kitchen operator rather than a conventional chain, with Rebel OS positioned as the operating layer that lets it launch, scale, and support multiple food brands from shared infrastructure. The strongest verified identity facts are stable: current sources place the company in Mumbai, show a 2011 founding, and tie the business to founders Jaydeep Barman and Kallol Banerjee. The scale story is directionally clear but not perfectly reconciled: the current "who we are" page says 4,000+ internet restaurants, 450+ kitchens, 70+ cities, 10 countries, and 2M+ customers, while another current company page lists 3 countries and 75 cities. That discrepancy matters because later chapters will depend on this chapter as the ground-truth reference for operating footprint and maturity.
    claimRefs: ["CO001", "CO002", "CO003", "CO004", "CO005", "CO006", "CO007", "CO015"]
    tableRefs: ["TO001"]
  - id: "leadership-and-governance"
    title: "Leadership, governance, and key-person dependence"
    body: |
      Leadership appears founder-led but increasingly split between strategy and execution. Jaydeep Barman remains central to the story and, according to recent coverage, moved into a chairman and group-CEO role while Ankush Grover became global CEO in 2025. That looks consistent with a company preparing itself for a larger financing and eventual IPO process, but the assigned pool still leaves material blind spots: it names founders, current operators, and some investors, yet it does not surface a current board roster, committee structure, or decision-rights summary. The practical takeaway is that Rebel's public narrative still concentrates around a small set of named leaders, with limited board-level transparency for outsiders doing diligence.
    claimRefs: ["CO001", "CO005", "CO011", "CO016"]
    tableRefs: ["TO002", "TO003"]
  - id: "capital-milestones-and-watchpoints"
    title: "Capital signals, milestones, and current watchpoints"
    body: |
      Rebel Foods has enough public financing and operating history to look like a late-stage private company, but not enough aligned disclosure to support one uncontested valuation or readiness conclusion. The cleanest confirmed recent milestone is KKR's December 2024 investment announcement; separate reporting then introduced a $210 million Temasek-led round at a reported $750 million valuation and, later, a reported $25 million QIA investment at $1.4 billion. That mismatch, combined with still-loss-making FY25 financials, means the chapter should treat valuation as unresolved rather than precise. The same caution applies to QuickiES: the 15-minute delivery push showed product ambition, but the assigned adverse reporting suggests the format did not become durable proof of a stronger business model.
    claimRefs: ["CO008", "CO009", "CO010", "CO012", "CO013", "CO014", "CO016"]
    figureRefs: ["FO001"]
