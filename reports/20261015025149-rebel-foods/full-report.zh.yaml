      - number: '3.3'
        title: 护城河存在，但平台、线下模式和执行复杂度会压缩它
        blocks:
          - type: paragraph
            body: >-
              最强的反证是 Rebel 仍未完全控制需求。独立来源明确描述了聚合平台在排名、佣金和客户所有权上的卡口；Inc42 和 YesPress 都描述 Rebel
              回到美食广场、餐厅和快速配送试验，而非坚持纯云厨房。可见公司自身也在重视原模式未能清晰覆盖的渠道和场景。再加上运营 45+
              个品牌的复杂度，以及行业对食品安全治理日益严格的审视，竞争故事更像“仍需持续证明单位经济性和信任的规模化运营商”，而非“赢家通吃的平台”。
