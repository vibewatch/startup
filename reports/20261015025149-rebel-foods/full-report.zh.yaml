  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与公开规模
        blocks:
          - type: paragraph
            body: >-
              公开证据指向餐厅平台模型，而非纯软件业务。最清晰的支持来自自有食品品牌、通过 EatSure 直接订餐、配送平台分销，以及额外的合作伙伴 / 加盟变现。YesPress 明确称
              Rebel“主要靠销售产品收入，服务收入占比较小”，这很重要：判断收入增长时，应同时看食品、人工、包装和渠道成本，而不是 SaaS 式软件经常性利润率。


              规模确实存在，但公开页面仍把运营覆盖与变现组合混在一起。Rebel 自有页面继续推广 450 间厨房的网络和多品牌运营系统，Business Wire 则称全球客户超过 200 万、品牌 45+
              个。这些都是强规模信号，但没有披露收入有多少来自直接订单与聚合平台、自有品牌与合作品牌，或重资产厨房与更轻的加盟和授权渠道。相比标题式覆盖范围，这一遗漏更重要，因为它使收入质量仍未得到验证。
            claimRefs:
              - CI001
