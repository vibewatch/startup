      - number: '4.2'
        title: 利润逻辑与单位经济性代理指标
        blocks:
          - type: paragraph
            body: >-
              公开单位经济性故事在概念上自洽，但数字并不完整。Rebel 的云厨房主张是，多家虚拟品牌共用同一人工、租金和设备基础，使固定成本能摊到比单一品牌餐厅更多的订单上。Cloud Kitchen Adda
              将该模式概括为每间厨房把固定成本“摊到 4–6 个品牌”，Rebel 创始人在 YesPress 的回顾中还提供了具体试点细节：楼上的厨房租金大约比临街门店低 80%。


              已报道的损益表说明为何不能把该模式当成已证明的利润杠杆。Mint 报道 FY24 经营收入为 ₹1,420 crore、费用为 ₹1,857 crore；YesPress 报道 FY25 经营收入
              ₹1,617.4 crore、净亏损 ₹336.6 crore。这是进展，不是逃逸速度。加盟披露同样需要谨慎：Rebel 加盟页面宣传合作方回本期和所需投资，但那是加盟运营商的标价经济性，不代表 Rebel
              已解决实际定价、贡献利润或公司管理费用吸收问题。
            claimRefs:
              - CI005
              - CI006
              - CI012
              - CI013
