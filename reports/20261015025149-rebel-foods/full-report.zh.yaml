      - number: '8.2'
        title: 融资背景与投资判断门槛
        blocks:
          - type: paragraph
            body: >-
              现有材料中可用的可比集合，是 Rebel 自身的融资历史，而不是干净的公开同业倍数框架。AgFunder 估计 2019 年 Series D 的估值为 $500 million，TechCrunch 报道
              2021 年 Series F 估值 $1.4 billion，Mint 后来报道 2024 年 12 月 Series G 将 Rebel 估值定为 $750
              million。这一序列显示的是可接受价格重置，而非平滑上升曲线。还要注意，一份 2024 年末来源称 $210 million
              轮混合新股和老股；二级购买款支付给卖方，不一定进入公司，因此标题式轮次规模不等于新增运营资本。在 Rebel 披露新老股比例、优先股堆叠和 KKR 进入条款前，投资人应把任何激进回报情景视为未经证明。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV009
              - CV010
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: 情景与下行触发点
        blocks:
          - type: paragraph
            body: >-
              乐观情景取决于规模能否转化成更干净的单位经济性：更高的厨房密度、更多直接订餐，以及扩大贡献利润且无需再进行重投入建设周期的加盟或合作渠道。基准情景没有那么慷慨。即使经营收入增长 13.9%，Rebel 在
              FY25 仍录得 ₹336.6 crore 净亏损。下行情景也不是遥远尾部风险，因为材料已包含一次据报失败的试验：Yespress 称 QuickiES 因现金消耗高于 2026
              年初关闭。因此，情景分析应围绕利润持久性和现金效率，而不只是 GMV 或品牌数量表象。
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
