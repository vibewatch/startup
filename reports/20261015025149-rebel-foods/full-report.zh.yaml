              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              Rebel 拥有足够的品牌广度、地域分布和赞助方兴趣，可以保留战略退出及未来 IPO 的选择权，但本章证据尚不足以仅凭公开条款称其已准备好退出。Mint 称管理层正为 2025–26
              上市窗口做准备，但同一来源也显示公司有相当一部分需求依赖 Swiggy 和
              Zomato。从继续研究升级到买入前，投资人应索取当前股权结构表、清算优先权、上一轮新老股所得、债务和契约安排，以及按直接渠道和聚合渠道拆分的经审计品牌层面贡献经济性。若更新披露显示单位经济性持续为负、优先权压制锁住普通股回报，或增长仍需
              QuickiES 这类烧钱模式，论点应被判定为失效。
            claimRefs:
              - CV005
              - CV008
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 公开证据支持等待更清晰的价格发现
            body: Rebel Foods 的规模和赞助方实力都不容忽视，但现有材料仍支持继续研究，因为最近可用的估值信号和经济性条款并不完整。
