      - number: '1.3'
        title: 资本信号、里程碑与当前观察点
        blocks:
          - type: paragraph
            body: >-
              Rebel Foods 的公开融资和运营历史足以让它看起来像一家后期非上市公司，但披露尚未对齐，无法支持一个无争议的估值或上市准备度结论。最近最清晰的已确认里程碑是 KKR 于 2024 年 12
              月宣布投资；随后独立报道提出 Temasek 牵头、据报按 $750 million 估值完成的 $210 million 轮融资，之后又报道 QIA 以 $1.4 billion 估值投资 $25
              million。这一矛盾，加上 FY25 仍在亏损，意味着本章应将估值视为未解，而非精确数字。QuickiES 也应同样谨慎：15 分钟配送显示了产品野心，但现有不利报道暗示该模式没有成为更强商业模型的持久证明。
