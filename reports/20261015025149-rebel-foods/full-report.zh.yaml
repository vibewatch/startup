      - number: '2.2'
        title: 受证据约束的规模视角与需求驱动
        blocks:
          - type: paragraph
            body: >-
              公开证据支持多个市场视角，但不足以搭出唯一确定的 TAM/SAM/SOM。最宽口径下，Restaurant India 引用印度食品服务市场预计到 2030 年超过 USD 125
              billion，这确立了需求外沿，却不能说明 Rebel 可触达的份额。从公司口径看，Rebel 及独立摘要指向约 450 间厨房、75 座城市和约 4,000
              家互联网餐厅，显示出可将固定基础设施摊到多个品牌上的供应网络。需求侧证据也解释了 Rebel 为何投入 EatSure
              和快速配送：配送已驱动大多数订单后，传统门店曝光的重要性下降；自有渠道则有望带来更好的数据所有权并降低对聚合平台佣金的依赖。QuickiES
              增添了新的增长方向，但披露证据仍更多把它描述为推出中的战略押注，而非已验证的收入引擎。
            claimRefs:
