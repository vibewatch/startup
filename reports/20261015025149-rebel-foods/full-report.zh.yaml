  - id: FV001
    title: 渠道依赖下的建议逻辑
    type: flow
    summary: 规模和资本支持让 Rebel 仍值得投资，但未解决的条款和仍为负的经济性，使本章维持“继续研究”判断。
    data:
      nodes:
        - label: 平台规模已有证据
          description: 2024 年 12 月的一份联合公告披露了 450 个厨房和 70 多座城市；2026 年 10 月访问时，Rebel 公司页面仍列出 450+ 个厨房和 70+ 座城市。
          tone: positive
        - label: 具备一定渠道控制
          description: 直接订单和加盟软件的主张表明公司拥有分销杠杆，但最强证据仍有一部分来自公司或供应商。
          tone: medium
        - label: 亏损仍然重要
          description: FY25 营业收入增长 13.9%，但净亏损仍为 ₹336.6 crore。
          tone: adverse
        - label: 估值重置信号
          description: 指定来源覆盖了 2019 年约 5 亿美元、2021 年 14 亿美元以及 2024 年末据报的 7.5 亿美元估值。
          tone: adverse
        - label: 条款仍缺失
          description: KKR 公告没有披露入场估值、优先股堆叠，或近期公开宣称的融资金额中有多少实际进入资产负债表。
          tone: warning
        - label: 建议：继续研究
          description: 在把买入纳入投资判断前，等待更清晰的价格发现和经审计的单位经济性证据。
          tone: risk
      edges:
        - from: Scaled platform proof
          to: Some channel control
          label: 如果需求越来越多由公司掌握，规模就有意义
        - from: Some channel control
          to: Losses still matter
          label: 只有改善利润率，自有渠道才有帮助
        - from: Losses still matter
          to: Valuation reset signal
          label: 盈利持续性未证实，会压低可接受价格
        - from: Valuation reset signal
          to: Terms still missing
          label: 估值标记模糊，提高投资判断门槛
        - from: Terms still missing
          to: 'Recommendation: research more'
          label: 条款和利润率不清晰，就不能买入
    approximationNotes: 有序流程展示投资判断逻辑，不是步骤之间的量化转化率。
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV007
      - CV008
      - CV011
      - CV013
      - CV015
      - CV016
