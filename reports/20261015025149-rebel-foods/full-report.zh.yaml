  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争集合不止云厨房同业
        blocks:
          - type: paragraph
            body: >-
              保留来源不支持“Rebel 对一家同业”的狭窄框架。Rebel 仍看起来比材料中任何单一替代者更大，但真正的竞争跨越多种方案：Curefoods 和 EatClub 等多品牌云厨房同业，Swiggy 和
              Zomato 等需求聚合平台，Blinkit Bistro 和 Swiggy Snacc
              等快速配送进入者，以及在需要氛围的场景中占优的传统餐饮市场。买方要解决的不是“从云厨房点餐”，而是“为这个场合弄到一顿饭”；不同对手可能靠便利、发现、速度或堂食体验取胜。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP014
