      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              融资时间线属于公司概览；这里的财务问题是，最新公开信号对充足性意味着什么。它们意味着公司仍需要外部资本提供选择权。YesPress 指出，2024 年 12 月 Temasek 牵头的轮次混合了新股和老股，因此
              $210 million 的标题金额不能理解为全部进入资产负债表的现金。Mint 和 Economic Times 也把 2024 年末和 2025 年的估值锚在 2021 年独角兽估值以下，约为 $750
              million 至 $800-860 million。


              后续融资信号进一步强化这一点。YesPress 报道 QIA 于 2025 年 4 月追加投资 $25 million，并于 2025 年 9 月以据报 13.9% 年票息发行 ₹150 crore
              债务。债务可以支撑扩张，但也会给风险定价，并对未来现金生成提出固定债权主张。最能说明问题的是战略上的反向证据：Mint 将 Quickies 描述为在现有厨房之上渐进搭建，但 YesPress
              后来报道该服务因现金消耗高而于 2026 年初关闭。这不否定核心厨房网络，却说明并非每个增长邻接业务都能覆盖 Rebel 的资本成本。
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
      - number: '4.4'
        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              公开记录支持这样一家企业：规模真实、变现杠杆不止一个，共享厨房的运营逻辑可信。但它尚不足以支持对收入质量、利润持久性或自我融资增长进行投资判断。最强的正面证据是收入在 FY25
              仍增长，亏损收窄；最强的负面证据是公开估值从 2021 年独角兽轮次向下重置，债务以有意义的票息重新进入资本结构，而快速配送邻接业务似乎烧钱过快，最终关停。


              缺失输入具体而非泛泛：品牌层面盈利能力、直接渠道与聚合平台占比、复购队列、实际折扣、厨房层面回本期、当前现金余额、债务契约和现金跑道。在这些信息披露前，正确的财务解读是：Rebel
              在仍亏损的食品业务之上叠加了有吸引力的轻资本愿景，而不是已经证明拥有干净软件经济性的复利平台。
            claimRefs:
              - CI001
              - CI006
              - CI008
              - CI009
              - CI011
              - CI012
      - number: '4.5'
        title: 展示项
        blocks:
          - type: callout
            title: 资本仍跑在自我融资证明之前
            body: 增长的最佳公开信号确实存在，但 2024 年末和 2025 年来源仍显示估值区间低于 2021 年独角兽轮次，且新增债务票息不低。这一组合意味着投资人和贷款人仍会影响 Rebel 的运营跑道和战略选择权。
            calloutType: risk
            claimRefs:
              - CI006
              - CI008
