  - id: FP001
    title: 竞争定位图（x = 客户关系控制；y = 供给侧控制）
    type: quadrant
    summary: 1—5 分仅基于保留证据；x 越高代表对客户关系的直接控制越强，y 越高代表对食品生产和厨房基础设施的直接控制越强。
    data:
      points:
        - label: Rebel Foods
          x: 4
          'y': 5
          detail: 自有厨房、多品牌网络、EatSure 和合作伙伴基础设施，形成了保留样本中最强的供给侧控制与部分直接需求组合。
        - label: Curefoods / EatClub
          x: 3
          'y': 4
          detail: 保留来源将其认定为多品牌运营商，但没有提供同等广度的直接渠道或基础设施证据。
        - label: Swiggy / Zomato
          x: 5
          'y': 2
          detail: 客户发现、排序和复购流量掌握在平台手中，但食品生产仍由商户负责。
        - label: Blinkit Bistro / Swiggy Snacc / Zepto Cafe / Swish
          x: 4
          'y': 3
          detail: 快餐新进入者围绕速度和 App 使用频率竞争，但保留证据没有显示其厨房广度达到 Rebel 的水平。
        - label: 独立餐厅
          x: 2
          'y': 2
          detail: 它们可以掌握本地声誉和食品质量，但通常缺乏多品牌复用能力和规模化数字需求控制。
        - label: 区域连锁内部自建
          x: 3
          'y': 3
          detail: 连锁品牌可以自行组装更多环节，但必须在没有 Rebel 打包基础设施的情况下重建软件、采购和平台管理能力。
    approximationNotes: 分数是基于保留来源池的序数分析判断，不是市场份额测量，也不是推算出的转化率。
    claimRefs:
      - CP003
      - CP006
      - CP007
      - CP009
      - CP010
      - CP013
  - id: FI001
    title: 收入模式桥
    type: flow
    summary: 公开证据描述了一个共享厨房平台：它把直接渠道和平台渠道的需求转化为食品收入，但毛利和净利润的转化仍不透明。
    data:
      nodes:
        - id: diners
          label: 食客
          note: 需求来自用餐场景，而不是软件席位或订阅。
        - id: channels
          label: 订餐渠道
          detail: EatSure 直接订餐加第三方平台
        - id: brands
          label: 品牌组合
          detail: 自有品牌和合作品牌满足不同的用餐需求
        - id: kitchens
          label: 共享厨房
          detail: 450 个厨房组成的运营网络，采用标准化流程和软件
        - id: revenue
          label: 确认收入
          detail: 主要是食品销售收入，另有较小的服务收入部分
        - id: gross-profit
          label: 毛利池
          detail: 扣除食材、人工、包装以及渠道或物流成本后的收入
        - id: group-earnings
          label: 集团盈利
          detail: 中央管理费用、扩张投入和融资成本决定增长能否转化为利润
      edges:
        - from: diners
          to: channels
          label: 订单来自直接需求和平台需求
        - from: channels
          to: brands
          label: 购物篮覆盖多个 Rebel 和合作品牌
        - from: brands
          to: kitchens
          label: 共享运营执行生产
        - from: kitchens
          to: revenue
          label: 售出餐食成为报告中的收入
        - from: revenue
          to: gross-profit
          label: 食品、人工、包装和配送等变动成本吸收每笔订单的一部分价值
        - from: gross-profit
          to: group-earnings
          label: 公司管理费用、增长押注和偿债成本决定净结果
    approximationNotes: 该图是根据公开来源绘制的定性运营桥，不推断未披露的转化率或毛利率数值。
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI013
  - id: FE001
    title: Rebel Foods 披露的产品架构
    type: stack
    summary: 从消费者需求到共享实体生产的一套有来源支持的运营栈。
    data:
      items:
        - label: 需求入口
          value: EatSure, brand sites and aggregators
          detail: 通过自有渠道和合作伙伴渠道捕捉用餐需求与订单。
        - label: 定位与配送
          value: Places, Geocoding and Directions APIs
          detail: 确定客户位置、路线和预计配送时间。
        - label: 数据与预测
          value: BigQuery and AI-based forecasting
          detail: 使用订单和行为数据规划库存、需求和人力。
        - label: 订单与厨房编排
          value: Rebel OS and Rebel+
          detail: 协调多品牌订单、餐厅管理和合作伙伴部署。
        - label: 实体生产
          value: Shared kitchens, automation and brand equipment
          detail: 通过共用设施和标准化流程执行多套菜单。
        - label: 供应与规模化
          value: Core ingredients, training and launch support
          detail: 在自有、合作伙伴和加盟地点复制运营标准。
    approximationNotes: 仅作概念性排序；公开证据没有披露当前服务边界、数据流或每个组件的所有权。
    claimRefs:
      - CE003
      - CE005
      - CE006
      - CE008
      - CE010
      - CE013
      - CE015
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Rebel 把用餐需求发现、渠道选择、共享厨房和合作伙伴扩张编织成一个运营循环。
    data:
      items:
        - label: 发现用餐场景
          actor: 终端消费者
          stage: 需求形成
          channel: 品牌认知、App 发现和复购意愿
          touchpoints:
            - Rebel 官方网站明确列出午餐、晚餐、零食和周末聚会等用餐场景。
            - 品牌组合覆盖面广，帮助 Rebel 匹配不同场景，而无需改变底层厨房覆盖。
          tone: positive
        - label: 选择品牌
          actor: 终端消费者
          stage: 组合匹配
          channel: 单个品牌店面或 EatSure 购物篮
          touchpoints:
            - Google 的案例研究称，2019 年每个厨房至少提供七个品牌。
            - 组合模式让一个家庭需求对应到多个品牌菜单。
          tone: positive
        - label: 选择渠道
          actor: 终端消费者
          stage: 订餐入口
          channel:
            - EatSure
            - Swiggy / Zomato
          touchpoints:
            - Mint 表示，平台仍贡献了相当一部分业务。
            - Ordering.co 声称，在重点城市直接订单占主导，但该指标未经独立审计。
          tone: warning
        - label: 分配厨房
          actor: Rebel 运营系统
          stage: 履约路由
          channel: 共享厨房加软件
          touchpoints:
            - Rebel+ 及相关运营工具覆盖数百个厨房。
            - 共享厨房让多个品牌和合作伙伴业态复用同一覆盖网络。
          tone: positive
        - label: 履约场景
          actor: 厨房、骑手或线下门店
          stage: 配送 / 自取 / 堂食
          channel:
            - Cloud kitchen delivery
            - EatSure food court
            - Franchise or partner outlet
          touchpoints:
            - Mint 在线下组合中提到 EatSure 美食广场、Oven Story 堂食店和 Wendy's 门店。
            - 客户体验已不再局限于纯幽灵厨房模式。
          tone: positive
        - label: 扩张循环
          actor: Rebel 加合作品牌
          stage: 规模化与复用
          channel: Rebel Launcher、加盟和渠道合作伙伴
          touchpoints:
            - YesPress 以 Wendy's、Easybites 和 Foodpanda 为网络复用的可见案例。
            - 关于续约、留存和合作伙伴经济性的公开证据仍然薄弱。
          tone: warning
    approximationNotes: null
    claimRefs:
      - CU001
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
