      - number: '2.3'
        title: 采用约束与未解的市场缺口
        blocks:
          - type: paragraph
            body: >-
              支持 Rebel 规模的同一批证据，也说明市场故事为何更偏运营而非纯财务。快速配送压缩执行窗口，并可能以利润换频次；Inc42 明确称该模式利润率低，且 Rebel 未披露 QuickiES
              的牵引数据。监管和信任约束同样重要：Restaurant India 认为，随着印度市场扩大，食品安全、可追溯性和运营治理日益成为餐厅增长的核心。最后，公开来源仍未拆出投资人最想看到的项目，包括自有渠道
              GMV、合作项目经济性、复购队列，以及 Rebel Launcher 或加盟层的限定 SAM/SOM。因此本章可以说明市场为何重要且具战略吸引力，但不能声称存在精确、有来源支持的可触达市场份额。
            claimRefs:
              - CM008
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 市场是多边的，不是单一餐厅 TAM
            body: Rebel 的估值敏感性取决于它把同一厨房网络转化为消费者需求、合作伙伴分销和加盟扩张的效率，因此网络指标、家庭需求和渠道经济性不应合并成一个相加的 TAM 数字。
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM009
              - CM010
              - CM014
          - type: callout
            title: 快速配送先扩大相关性，再证明经济性
            body: QuickiES 契合真实的需求变化，但当前证据只支持将其看作对快速配送竞争的战略回应，而不是已披露、能增厚利润的业务线。
