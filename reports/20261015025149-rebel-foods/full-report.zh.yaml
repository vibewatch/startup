            body: >-
              领导层看起来仍由创始人主导，但战略与执行正逐步分开。Jaydeep Barman 仍是核心人物；据近期报道，他转任董事长兼集团 CEO，Ankush Grover 于 2025 年出任全球
              CEO。这与公司为更大规模融资及未来 IPO 做准备的迹象一致，但现有材料仍留下重要盲区：虽列出创始人、现任运营者和部分投资人，却没有当前董事会名单、委员会架构或决策权摘要。实际含义是，Rebel
