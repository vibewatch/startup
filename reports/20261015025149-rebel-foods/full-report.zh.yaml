      - number: '3.2'
        title: Rebel 的优势在于厨房控制、自有需求与合作伙伴基础设施的组合
        blocks:
          - type: paragraph
            body: >-
              Rebel 最有证据支持的差异化来自架构而非菜单。共享厨房让公司把固定产能分摊到多个品牌，EatSure 在市场平台之上提供直接订餐层，Launcher
              和加盟项目则让公司能把基础设施卖给外部运营商，而不只逐品牌竞争。这种组合比单一食品品牌更难复制，因为进入者需要运营软件、厨房密度、采购纪律，以及足够宽的品牌组合来维持网络利用率。代价是，公开证据在包装和运营逻辑上远强于同口径消费者定价。
