          - type: callout
            title: 公开标价经济性不等于实际经济性
            body: 加盟投资和合作伙伴项目披露证明 Rebel 不止一种方式变现厨房网络，但没有揭示实际定价、抽成率、复购行为或贡献利润。这些仍是尽调问题，而非可据此投资判断的事实。
            calloutType: insight
