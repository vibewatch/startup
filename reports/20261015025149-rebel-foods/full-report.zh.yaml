  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与买方层级
        blocks:
          - type: paragraph
            body: >-
              Rebel Foods
              应被定义为以配送为先的食品电商平台，而不只是虚拟餐厅连锁。其材料称品牌围绕午餐、晚餐、零食和周末聚会等消费者“用餐任务”打造；独立文章则把厨房描述为共享工厂，同一地点可以容纳多个店面。这形成多边市场边界：终端用户是点餐消费者，直接付款方通常是家庭食品预算，发现层常在
              Swiggy 或 Zomato，另一组买方则是购买 Rebel 厨房、物流和运营系统使用权的合作品牌或加盟投资人。与估值相关的要点是，Rebel 同时争夺订单需求、品牌分销和高效利用厨房的资本。
            claimRefs:
              - CM001
              - CM002
