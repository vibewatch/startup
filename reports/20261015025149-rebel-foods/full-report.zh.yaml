      - - 论点
        - 自有渠道和加盟模式的主张表明，Rebel 可以把厨房软件、供应链和品牌资产铺到更多订单场景。
        - 如果审计后的直接订单占比或加盟经济性明显低于供应商和公司营销主张，这一论点就会走弱。
      - - 反论点
        - 公开估值锚点看起来是在重置，而不是持续复利：2019 年约 5 亿美元、2021 年 14 亿美元，2024 年末据报为 7.5 亿美元。
