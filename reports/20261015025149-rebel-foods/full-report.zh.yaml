    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、覆盖范围与运营模式
        blocks:
          - type: paragraph
            body: >-
              Rebel Foods 将自己定位为互联网餐厅和云厨房运营商，而非传统连锁；Rebel OS
              是运营层，让公司能依托共享基础设施推出、扩张并支持多个餐饮品牌。已核实的身份信息基本稳定：当前来源将公司置于孟买，显示其成立于 2011 年，并将业务与创始人 Jaydeep Barman、Kallol
              Banerjee 联系起来。规模叙事方向明确但未完全对账：当前“who we are”页面称有 4,000+ 家互联网餐厅、450+ 间厨房、70+ 座城市、10 个国家和 2M+ 客户，另一当前公司页面却列出
              3 个国家和 75 座城市。这一差异很重要，因为后续章节会把本章作为运营覆盖和成熟度的基准。
