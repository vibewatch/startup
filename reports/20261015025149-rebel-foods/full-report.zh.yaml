        title: 展示项
        blocks:
          - type: callout
            title: Rebel 的护城河是一套组合，不是单一品牌
            body: 保留材料中最清晰的差异化，是共享厨房、自有订餐层和合作伙伴赋能的组合。它比菜单或明星品牌护城河更宽，也解释了 Rebel 为何能同时争取终端客户和第三方餐饮运营商。
