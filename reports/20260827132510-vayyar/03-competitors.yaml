  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing and ASP data
    missingEvidence: Per-program pricing, software attach, support fees, and actual landed ASPs for Vayyar and rival solutions.
    whyItMatters: Without price evidence, capability comparisons can overstate differentiation or understate incumbents bundling advantage.
    diligencePath: Request win/loss pricing sheets and target BOM ranges by program.
