chapter:
  number: 3
  title: Competitors
  summary: Vayyar competes in a crowded landscape where larger semiconductor incumbents control radar channel power and camera-based interior-sensing vendors already disclose production scale. Its best competitive wedge is privacy-preserving multifunction radar for full-cabin and adjacent safety use cases, but moat durability depends on system-level integration and design wins rather than on raw RFIC claims alone.
sections:
- id: landscape
  title: 'Landscape: Direct Peers, Incumbents, and Substitutes'
  body: 'Vayyar does not face a single competitor class. In automotive radar, it competes against semiconductor incumbents such as TI, NXP, and Infineon as well as specialist radar players such as Arbe and Uhnder. In the cabin, it also competes indirectly against camera-centric interior-sensing vendors such as Smart Eye and Seeing Machines. The substitute set matters because an OEM choosing cabin safety can solve parts of the job with cameras, simpler presence sensing, or existing Tier-1 stacks rather than Vayyar''s radar specifically.


    Vayyar''s own positioning emphasizes privacy, multifunctionality, and single-chip breadth. That sits closest to specialist radar challengers on technology narrative, but the commercial battlefield is more uneven: incumbents control broader chip portfolios and established channels, while camera players can point to already-disclosed production footprints. The practical takeaway is that Vayyar''s competition is not only about who has the best sensor, but who can ship a validated, affordable, scalable system that fits an OEM or care workflow.'
