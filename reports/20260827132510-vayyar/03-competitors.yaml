    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: competitive win-rate
    missingEvidence: Program win/loss data, design-win count, production volumes, and displacement examples.
    whyItMatters: This is the cleanest way to tell whether Vayyar differentiation is translating into sustainable competitive share.
    diligencePath: Request pipeline, booked wins, named losses, and production launch schedule.
