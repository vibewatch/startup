- id: profiles-and-comparisons
  title: Competitor Profiles and Capability Comparison
  body: 'The profile comparison breaks into three groups. First are large platform incumbents: TI, NXP, and Infineon all offer radar portfolios that can be bundled into broader automotive electronics programs. Their advantage is channel power, safe-and-secure product families, and the ability to price radar as one part of a larger OEM relationship. Second are focused perception companies: Arbe and Uhnder push imaging-radar performance narratives, while Smart Eye and Seeing Machines push interior sensing and monitoring from camera-first positions. Smart Eye''s disclosed road footprint is especially notable because it proves commercial scale that Vayyar does not publicly disclose.


    Vayyar''s differentiators are strongest where privacy or multifunctionality matter. Its materials emphasize full-cabin monitoring with one radar-on-chip, support for multiple seat and safety applications, and extension from 60 GHz cabin sensing into 79 GHz exterior safety. Those traits create real differentiation versus narrow DMS-only substitutes, but they do not erase the reality that larger rivals can match pieces of the stack and often arrive with deeper OEM relationships.'
