callouts:
- calloutType: strength
  title: Vayyar competes best when privacy and cabin breadth matter
  body: Where a buyer wants camera-free sensing across multiple cabin use cases, Vayyar has a credible product narrative that many rivals do not match as cleanly. That matters most in privacy-sensitive cabins, care rooms, and programs that want one sensor to do several jobs.
  claimRefs:
  - CP021
  - CP031
  - CP032
- calloutType: risk
  title: Incumbents own the distribution advantage
  body: TI, NXP, and similar incumbents do not need to out-story Vayyar; they only need to be good enough while being easier to buy, bundle, and support. That is the central competitive risk for a private specialist vendor.
  claimRefs:
  - CP019
  - CP023
  - CP026
  - CP035
