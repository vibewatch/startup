- id: demand-lenses
  title: Demand Lenses Instead of One Generic TAM
  body: 'Public evidence supports large underlying problem pools even when direct dollar TAM is imprecise. On the care side, WHO says falls are the second leading cause of unintentional injury deaths worldwide, with 684,000 annual fatalities and 37.3 million falls serious enough to require medical attention. The United Nations separately says global ageing is widespread and that by 2050 one in six people in the world will be over age 65. Those figures do not directly translate into Vayyar revenue, but they establish that the problem Vayyar Care addresses is structural rather than niche.


    On the automotive side, regulation and safety scoring are the stronger demand lens. Euro NCAP''s current and future protocol stack explicitly includes child-occupant and occupant-monitoring surfaces, while NHTSA and Kids and Car Safety keep heatstroke prevention in the public policy conversation. Japan provides an even clearer trigger: the Aisin / Vayyar materials say child-presence detection became required in tens of thousands of kindergarten and related buses. That is not the same as a global automotive TAM, but it is a concrete demand wedge with a regulatory budget trigger.


    The result is an evidence-constrained market view: large global problem pools, strong regulatory and demographic tailwinds, but only partial visibility into how much of that spend is actually reachable by Vayyar, through which channels, and at what ASP or recurring-software mix.'
