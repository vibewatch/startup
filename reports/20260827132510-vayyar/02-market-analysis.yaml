callouts:
- calloutType: insight
  title: The market is regulated and demographic, not discretionary gadget spend
  body: 'Vayyar''s strongest markets exist where harm reduction, privacy, and compliance matter: vehicle cabins and care environments. That is a better backdrop than pure consumer IoT, but it also means sales depend on evidence and qualification, not quick e-commerce velocity.'
  claimRefs:
