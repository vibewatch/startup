  - - Retail / robotics
    - Traffic analytics, collision avoidance, human-robot awareness
    - Generic analytics SaaS without edge sensing
    - Retail ops leaders, OEMs
    - Option value, but likely secondary to core safety markets
  notes: 'Market boundary is intentionally narrow: it focuses on monetizable sensing layers, not the full radar, AI, or IoT stack.'
