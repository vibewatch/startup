- id: drivers-constraints
  title: Growth Drivers, Constraints, and Gaps
  body: 'The strongest market drivers are regulatory pull, privacy sensitivity, and multifunctionality. Euro NCAP scoring evolution, Japanese child-presence requirements, and NHTSA heatstroke awareness all reinforce the automotive need for better in-cabin sensing. In care, rising older populations and the scale of fall-related harm create durable demand for technologies that can monitor rooms without cameras. Vayyar''s privacy-by-design positioning is especially relevant where cameras face cultural or operational resistance. Multifunctionality is the other structural driver: the company repeatedly argues that one radar sensor can cover multiple safety jobs, which speaks directly to OEM cost and complexity pressure.


    The biggest adoption constraints are equally clear. Automotive sales require long validation cycles, supply-chain reliability, and design wins that may take years to convert into volume revenue. Care deployments need evidence of reduced falls, alarm-fatigue management, staff workflow fit, and budget justification. In both segments, public data is too thin to isolate Vayyar''s reachable share, price realization, or conversion from pilots to scaled deployments.


    Accordingly, the market is attractive in shape but not yet precisely measurable in dollars from public evidence alone. Investors should underwrite the automotive and care wedges as the near-term core, treat buildings / retail / robotics as upside options, and require management to quantify where real pipeline, budget ownership, and deployment velocity sit inside that broad platform story.'
