  evidenceGaps:
  - type: missing-source
    severity: material
    topic: dollar TAM and SAM
    missingEvidence: Public market reports or company disclosures that isolate Vayyar's monetizable addressable spend by segment and geography.
    whyItMatters: A strong problem pool does not automatically translate into reachable revenue or attractive unit economics.
    diligencePath: Request management's TAM/SAM model with assumptions, pipeline coverage, and realized ASP by segment.
    relatedQuestionRefs:
    - QM010
    - QM022
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: care adoption proof
    missingEvidence: Controlled before/after deployment data on falls, response times, staffing efficiency, occupancy, and resident outcomes.
    whyItMatters: Without outcome evidence, care-market ROI remains more narrative than underwritten.
    diligencePath: Ask for customer cohort data and independent case-study metrics across multiple facilities.
