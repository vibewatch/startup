chapter:
  number: 2
  title: Market Analysis
  summary: Vayyar participates in a narrow but expanding privacy-preserving sensing market rather than a generic all-radar opportunity. The clearest demand pull comes from automotive in-cabin safety and long-term-care fall monitoring, where regulation, demographic ageing, and privacy-sensitive use cases create real adoption pressure, but long qualification cycles and unclear public market sizing still limit precision.
sections:
- id: market-boundary
  title: Market Boundary and What Counts
  body: 'Vayyar''s real market is best defined as privacy-preserving environmental sensing for safety, monitoring, and automation, not as the entire global radar market and not as the entire AI-sensor stack. The company sells a common radar core into several vertical wrappers — automotive in-cabin sensing, exterior ADAS / ARAS, senior-care monitoring, smart buildings, retail, and robotics — but the commercial logic differs by vertical. In automotive, the buyer cares about safety requirements, qualification, integration complexity, and vehicle cost. In senior care, the buyer cares about falls, hidden events, staff efficiency, occupancy, privacy, and integration with nurse-call workflows. In buildings and retail, the proposition becomes occupancy, traffic, and emergency response.


    That boundary matters because a giant undifferentiated TAM would overstate near-term monetizable demand. The 2024 restructuring report that Vayyar narrowed focus to smart home and automotive is useful market evidence: management itself appears to have decided that not every theoretical radar use case deserves equal go-to-market investment. The practical market for this report is therefore concentrated in automotive cabin / safety sensing and care-environment monitoring, with smart buildings, retail, and robotics as adjacent option value rather than the core underwriting base.'
