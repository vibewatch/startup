companyProfile:
  summary: >-
    Vayyar is an Israeli 4D imaging-radar company founded in 2011 and headquartered in
    Yehud-Monosson. It began with an RF-based breast-cancer screening thesis and later expanded into a
    multi-vertical radar-on-chip platform spanning automotive safety, senior care, smart building,
    retail, robotics, and consumer wall-scanning applications. The company reached unicorn status in
    its June 2022 Series E, and public sources still cluster around a roughly $1B valuation anchor in
    2026, although tracker and press sources disagree on exact capital raised and whether later 2024
    financings changed the effective mark. Vayyar has credible public proof in automotive and care,
    including Toyota, Aisin, Austco, and TekTone-linked evidence, but current revenue, margin,
    concentration, and runway remain undisclosed.
  foundedDate: '2011-01-01'
  founders:
    - name: Raviv Melamed
      role: Co-founder and CEO
      background: Former vice president in Intel's architecture group; longstanding public face of Vayyar.
      claimRefs: [CO013, CO016]
    - name: Naftali Chayat
      role: Co-founder and CTO
      background: Technical co-founder tied to Vayyar's RF and platform development story.
      claimRefs: [CO014]
    - name: Miri Ratner
      role: Co-founder and VP R&D
      background: R&D co-founder publicly associated with the company's early technical build-out.
      claimRefs: [CO015]
  foundingLocation: Yehud-Monosson, Israel
  headquarters: Yehud-Monosson, Israel
  productSummary: >-
    Vayyar sells a shared 4D imaging-radar platform across in-cabin monitoring, ADAS/ARAS,
    elderly-care fall detection and analytics, smart-building and security surfaces, and the Walabot
    consumer line. The public product story emphasizes privacy-preserving sensing, point-cloud data,
    single-chip consolidation, and integrations into automotive and nurse-call workflows.
  customerFocus: >-
    Automotive OEMs and Tier-1 programs, elderly-care operators and channel partners, smart-home and
    adjacent sensing partners, and a smaller consumer Walabot audience.
  businessModel: >-
    Hardware-plus-software commercialization through automotive design wins, care deployments with
    channel integrations, and adjacent consumer or developer surfaces. Revenue likely mixes device,
    integration, software, and support elements, but the public record does not disclose the stream
    mix or contribution margins.
  stage: late-stage private / Series E
  fundingStatus: >-
    Public sources agree on a $108M Series E in June 2022 and disagree on cumulative capital, with a
    conservative public range of roughly $296M to $323M depending on whether later 2024 financings are
    included. Public 2026 tracker surfaces still cluster around a ~$1B valuation anchor.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO017, CO019, CO023, CO026, CV001, CV002, CV006, CV007, CV017]
summary:
  headline: >-
    Vayyar combines credible 4D radar traction in automotive and care with sparse financial disclosure,
    making the current unicorn-level valuation plausible but not yet fully underwriteable.
  overallScore: 5.6
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 1000
    revenueRunRateUsdM: null
    arrUsdM: null
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 300
    customerCount: null
    headcount: 200
  topStrengths:
    - >-
      Shared 4D imaging-radar platform spans automotive and care with a genuine privacy-preserving
      differentiation relative to camera-heavy alternatives.
    - >-
      Public customer and partner proof is real: Toyota, Aisin, Austco, TekTone, and named care sites
      show the technology has moved beyond lab-only positioning.
    - >-
      Historical fundraising and lead-investor continuity indicate that sophisticated backers repeatedly
      financed the platform through multiple stages.
    - >-
      Automotive qualification language and care clinical-safety positioning suggest Vayyar understands
      the regulatory and workflow constraints of its highest-value markets.
  topRisks:
    - >-
      Revenue, margin, renewal, and customer-concentration data remain private, so investors cannot
      independently determine whether public traction actually supports the current valuation.
    - >-
      The 2024 layoff and burn-reduction signal raise the possibility that commercialization has not yet
      compounded quickly enough to de-risk capital adequacy.
    - >-
      Care workflows depend on Amazon and nurse-call partners, while automotive upside depends on a
      relatively small set of flagship OEM or Tier-1 programs.
    - >-
      The public valuation record is internally inconsistent, with sources spanning roughly $1B current
      anchors, older ~$1.5B peak narratives, and ambiguous later 2024 financing activity.
  unresolvedGaps:
    - Current revenue by stream, gross margin by stream, and customer concentration are undisclosed.
    - Retention, renewal, and cohort-level ROI data for Vayyar Care are not publicly available.
    - Current cash balance, burn, runway, and the quality of any 2024-2026 financing terms are unknown.
    - Cap-table seniority, liquidation preferences, secondary activity, and dilution terms are not public.
    - Public sources do not reconcile the exact total capital raised or whether later 2024 rounds changed valuation.
