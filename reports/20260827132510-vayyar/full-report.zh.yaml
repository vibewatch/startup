      - number: '3.2'
        title: 竞争对手画像与能力对比
        blocks:
          - type: paragraph
            body: >-
              能力对比分成三组。第一组是大型平台既有厂商：TI、NXP 和 Infineon 都提供雷达产品组合，并能捆入更广的汽车电子项目。它们的优势是渠道权力、安全可靠的产品族，以及把雷达作为更大 OEM
              关系的一部分来定价的能力。第二组是聚焦感知的公司：Arbe 和 Uhnder 主打成像雷达性能叙事，Smart Eye 和 Seeing Machines 则从摄像头优先位置切入内饰感知与监测。Smart Eye
              披露的道路覆盖尤其值得注意，因为它证明了 Vayyar 并未公开披露的商业规模。


              Vayyar 的差异化在隐私或多功能性重要的场景里最强。材料强调用一个雷达单芯片覆盖全座舱、支持多个座位和安全应用，并从 60 GHz 座舱感知延伸到 79 GHz 外部安全。这些特征相比只做 DMS
              的狭窄替代方案确实构成差异化，但无法抹掉一个现实：更大的竞争对手可以匹配技术栈的一部分，并常常带着更深的 OEM 关系进入。
