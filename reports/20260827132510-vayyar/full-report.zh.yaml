      - number: '8.4'
        title: 最后尽调要求与放弃触发器
        blocks:
          - type: paragraph
            body: >-
              决定性下一步不是继续提高赛道热情，而是数据室。Vayyar 现在需要证明，它最强的公开信号背后有私下经营质量支撑：按收入流拆分的当前 ARR
              或收入、各收入流毛利率、汽车与护理收入占比、头部项目收入集中度、留存或续约行为、当前现金和资金可支撑时间，以及 2024 年或之后任何融资的结构。
              没有这些证据，投资人实际上是在数据追踪平台、媒体和公司营销之间选择叙事。这不足以支撑有信心的买入建议。打破论点的触发器同样具体。融资轮偏弱或结构化程度很高、再次重组、持续无法披露汽车量产收入，或护理经济性仍停留在轶事层面，都会把结论推向放弃或大幅折价。
              反过来，如果管理层证明耐久经常性经济性、干净合规状态和分散的项目转化，公司就可能支持接近或高于当前独角兽区间的估值。
