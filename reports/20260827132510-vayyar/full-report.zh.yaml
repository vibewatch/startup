  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：直接对手、既有厂商与替代方案
        blocks:
          - type: paragraph
            body: >-
              Vayyar 面对的不是单一竞争类别。汽车雷达里，它既与 TI、NXP、Infineon 等半导体既有厂商竞争，也与 Arbe、Uhnder
              等专业雷达玩家竞争。座舱内，它还间接竞争以摄像头为中心的内饰感知厂商，如 Smart Eye 和 Seeing Machines。替代方案集合很重要，因为 OEM
              选择座舱安全方案时，可以用摄像头、更简单的存在感知或现有 Tier-1 栈解决部分任务，而不一定选择 Vayyar 雷达。


              Vayyar 自身定位强调隐私、多功能性和单芯片宽度。在技术叙事上，这最接近专业雷达挑战者；但商业战场更不均衡：既有厂商掌握更宽的芯片组合和成熟渠道，摄像头玩家则可以拿出已披露的量产足迹。实际结论是，Vayyar
              的竞争不只是谁的传感器最好，而是谁能交付一个经验证、可负担、可规模化，并能适配 OEM 或照护工作流的系统。
