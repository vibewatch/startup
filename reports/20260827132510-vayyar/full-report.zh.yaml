  - id: TV005
    title: 投资逻辑破裂与叫停触发器表
    columns:
      - 触发器
      - 阈值
      - 如何传导到投资逻辑
      - 行动含义
    rows:
      - - 融资质量偏弱
        - 降价轮、优先权堆栈结构过重，或惩罚性过桥融资
        - 坐实资本压力，并压缩上行空间
        - 重新定价或放弃
      - - 汽车业务未转化
        - 标杆项目没有清晰量产收入证明
        - 打破最大的规模化论点
        - 下调乐观情景，并扩大折价
      - - 护理经济性仍停留在个案
        - 没有续约、留存或 ROI 队列证据
        - 削弱第二核心垂直的可复制性
        - 护理价值只能视为战略性，但尚未证实
      - - 再次重组
        - 大规模追加裁员，或产品线收缩
        - 说明商业化仍追不上投入
        - 审阅新运营计划前暂停
      - - 合规问题浮现
        - 重大隐私、安全、出口或临床治理问题
        - 同时抬高风险折价和成交周期
        - 解决前转为继续研究 / 不投
    notes: 这些触发器用于控制投资决策，并非预测事件会发生。
    claimRefs:
      - CV017
      - CV023
      - CV029
      - CV034
      - CV040
  - id: TV006
    title: 最终尽调资料要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 责任方 / 尽调路径
    rows:
      - - 收入质量
        - 按收入流拆分的当前收入、类 ARR 组成、按收入流拆分的毛利率
        - 决定公开可比公司能否使用
        - CFO / 财务数据室
      - - 客户集中度
        - 前 10 大客户、OEM/Tier-1 组合、项目收入、续约状态
        - 检验标杆客户名头能否转成可持续经济性
        - 销售运营 + 客户成功导出
      - - 资本充足性
        - 现金、现金消耗、现金跑道、契约 / 债务数据、2024-2026 年融资条款
        - 界定下行风险和紧迫性
        - 董事会材料和融资文件
      - - 股权结构表 / 优先权
        - 清算优先权、优先级、期权池、二级交易
        - 实际回报测算离不开它
        - 法律顾问和股权结构模型
      - - 合规与主张支撑
        - 临床安全材料包、隐私 / 安全材料、产品认证证据
        - 避免估值夸大未经验证的就绪度
        - 法律 / QA / 产品尽调
    notes: 如果管理层无法满足其中大部分要求，正确动作是等待，而不是乐观加码。
    claimRefs:
      - CV023
      - CV033
      - CV034
      - CV035
