        - Walabot 标价和定性成本效率主张
        - 核心业务的公开价格数据最弱
        - 要求提供价格瀑布和前 20 大交易清单
      - - 分产品线毛利率
        - 区分战略承诺与单位经济性现实
        - TI 和 Ouster 可比公司文件
        - 无法判断规模化已经有吸引力，还是仍深度为负
        - 要求按收入来源提供毛利率桥，以及保修 / 安装负担
      - - 现金、烧钱速度和现金跑道
        - 资本充足性的核心测试
        - 历史融资总额和裁员信号
        - 无法清晰判断融资风险
        - 要求提供月度烧钱、当前现金和下行情景现金跑道
      - - 客户集中度
        - 判断汽车和护理客户基础的脆弱性
        - 合作伙伴标识和案例研究
        - 标识证明不等于收入证明
        - 要求提供前 10 大客户集中度和分阶段管线
      - - 营运资本 / 库存承诺
        - 硬件业务可能在确认收入前先吃掉现金
        - 安装要求和公开硬件可比公司
        - 无法建模现金转换周期
        - 要求提供库存天数、供应商条款和采购义务
    notes: 这是主要尽调瓶颈。公开材料足以支撑主题兴趣，但不足以做投资级财务判断。
