      - number: '1.4'
        title: 里程碑、合作伙伴与轨迹
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，Vayyar 一再把同一套雷达核心转译成新的商业化渠道。公司 2011 年成立，2012 年完成首笔披露融资，2013 年推出第一代硅片。Walabot 消费品牌在 2016 年问世，给
              Vayyar 带来一个可见的零售产品，也证明公司能把 RF 感知封装给非工业用户。到 2018 年，第二代 IC 和养老照护 / B2B 产品出现；随后是 2019 年 Koch 领投的大额 Series D
              轮，以及 2020-2021 年更多汽车商业化进展。


              汽车里程碑尤其重要，因为它把技术成熟度连接到真实 OEM 和 Tier-1 采用路径。Toyota Connected 的 Cabin Awareness 概念在原型 Sienna 和 May Mobility
              shuttle 中使用 Vayyar 雷达。紧急立法之后，Aisin 与 Vayyar 宣布在日本幼儿园巴士部署儿童遗留检测传感器。Piaggio Fast Forward 选择 Vayyar 雷达用于机器人和
              ARAS 相关应用；Vayyar 也强调获得 CLEPA 认可，并参与全球汽车协会活动。这些证据的商业分量并不相同，但合在一起说明 Vayyar 已从实验室级 RF 能力跨入经合作伙伴验证的安全用例。


              轨迹里还包含一次战略转向。到 2024 年 9
              月，管理层不再讲一个最大化的多垂直增长故事，而是在裁员以降低烧钱速度、聚焦核心市场。这是反向信号，但未必致命。在硬件领域，减少活跃商业化战线，反而可能提高穿过漫长认证周期的概率。核心尽调问题是：2024
              年重置究竟是纪律化聚焦的开始，还是证明早期多垂直扩张未能产出足够高毛利销量。
