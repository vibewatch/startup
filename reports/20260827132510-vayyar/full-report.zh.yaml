  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品线与模块图谱
        blocks:
          - type: paragraph
            body: >-
              Vayyar 的产品集不是单一 SKU，而是一套共享的雷达单芯片和软件平台，向多个终端市场封装分叉：60 GHz 座舱内汽车感知、79 GHz 外部 ADAS / ARAS 感知、Vayyar
              Care、Walabot 消费设备，以及历史上的医疗、机器人和智能建筑用例。共同主题不是某个单一应用，而是一套共同技术栈：RF
              硬件、信号处理、点云生成、嵌入式计算和应用层软件。这一点很重要，因为产品故事部分建立在平台复用上。Vayyar 反复主张，一个多功能传感器可以替代多个更窄的传感器，并把数据开放给合作伙伴开发应用。


              平台复用能降低买方复杂度的地方，产品逻辑最强。汽车场景的主张是更少传感器、更少 ECU 或外部处理器，以及更好的座舱或外部覆盖。照护场景的主张是不用摄像头或可穿戴设备也能连续监测。Walabot
              则把平台重新封装给开发者或消费者直接使用。因此，产品组合很宽，但公开成熟度不均，大多数证据仍由公司自己撰写，而不是由中立技术数据集做基准测试。
