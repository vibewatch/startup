      - number: '3.4'
        title: 护城河持久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Vayyar
              的护城河看起来真实，但有条件。公司在系统层面似乎有差异化：全座舱雷达覆盖、隐私友好感知，以及一个横跨座舱和外部用例的单芯片叙事。这些优势在特定购买情境中有意义。但护城河并不绝对。大型半导体厂商可以随时间把雷达硬件商品化，摄像头玩家可以为部分项目解决足够多的内饰感知任务，OEM
              或 Tier-1 也可以把更多技术栈集成内化，而这不是 Vayyar 想看到的。


              因此，持久护城河不是抽象意义上的「更好雷达」。它是一组组合：经验证的安全用例、合作伙伴准入、监管适配，以及真实部署中 OEM 偏好 Vayyar 架构的证据。主要反向竞争证据不是 Vayyar
              出了丑闻，而是竞争对手已经拥有公开规模、渠道权力和披露优势。在 Vayyar 披露产量、设计定点数量或中标率数据之前，竞争排序只能说在小众用例中方向性有利，还不能证明整体占优。
