companyProfile:
  summary: >-
    Vayyar 是一家以色列 4D 成像雷达公司，成立于 2011 年，总部位于 Yehud-Monosson。公司最初围绕 RF
    乳腺癌筛查立项，之后扩展为覆盖汽车安全、养老照护、智能建筑、零售、机器人和消费级墙体扫描等场景的多垂直雷达单芯片平台。公司在 2022 年 6 月 Series E 轮跻身独角兽；到 2026 年，公开来源仍大多围绕约 $1B
    估值锚点展开，但公开追踪平台与媒体对累计融资的精确金额、以及 2024 年后续融资是否改变有效估值存在分歧。Vayyar 在汽车与照护场景有可信公开验证，包括 Toyota、Aisin、Austco 以及与 TekTone
    相关的证据；但当前收入、利润率、集中度和现金跑道仍未披露。
