  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与论点平衡
        blocks:
          - type: paragraph
            body: >-
              Vayyar 的公开证据足以支持继续尽调，但还不足以按表面信息写完承销备忘录。正面看，公司打造了差异化 4D
              成像雷达平台，拿到可信的汽车背书，维持了有具名渠道伙伴的真实护理工作流，也反复吸引机构资本。这些都不是普通科研项目的迹象。
              问题在于，证据质量恰好在价格纪律最重要的地方下降。公开来源没有披露当前收入、毛利率、续约、客户集中度、烧钱速度、资金可支撑时间或股权结构表条款。即便融资和估值历史，不同来源也并非完全一致。因此，投资人面对的是方向上有吸引力、数字上支撑不足的论点。
              所以，合适结论是继续研究 / 跟踪：Vayyar 好到值得留在流程中，并可能投资；但前提是管理层提供当前财务和集中度数据，要么证明现有独角兽级别估值合理，要么揭示一个更保守的成交价格。
