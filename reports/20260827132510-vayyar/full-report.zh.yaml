      - number: '2.3'
        title: 买方、用户与付款方细分
        blocks:
          - type: paragraph
            body: >-
              Vayyar 的买方图谱很碎片化，既是机会，也是执行负担。汽车场景中，直接商业客户很可能是 OEM 或 Tier-1
              供应商；终端用户是司机、乘客或车队运营方；付款则嵌入整车物料清单。因此销售周期慢，围绕设计导入展开，并高度依赖认证和安全证据。Toyota Connected 的 Cabin Awareness 概念与
              Aisin 关系，展示了 Vayyar 如何先通过创新、软件或 Tier-1 渠道进入，再等待更广泛的车型项目放量。


              养老照护场景中，买方通常是养老机构运营方、护士呼叫厂商或医疗系统采购负责人；用户是护理人员；被监测对象是住户或患者；付款方可能是运营方、服务提供者或设施业主。Austco 和 TekTone
              在这里很重要，因为它们把 Vayyar 嵌入现有护士呼叫和紧急呼叫系统，降低集成负担。Vayyar 自己的照护材料把入住率、入住转化、护理等级清晰度、隐蔽跌倒捕捉和员工效率作为购买触发点。


              建筑、零售和机器人又是另一条采用路径：设施管理者、分析负责人或 OEM 会用较低风险预算评估感知价值，这能促成试点，但紧迫性也可能弱于汽车监管或照护安全事件。
