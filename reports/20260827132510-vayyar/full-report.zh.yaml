  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律敞口
        blocks:
          - type: paragraph
            body: >-
              Vayyar 的汽车和护理业务都触及受监管流程，尽管公司本身既不是上市公司，也不是披露密集的医疗器械巨头。在汽车领域，公司公开强调 AEC-Q100 认证、ASIL-B 合规、FCC
              豁免，以及儿童遗留检测、乘员监测等广泛安全用例。 关键不只是传感器性能，而是产品能否嵌入安全、认证和 OEM 审批流程；这些流程都可能拖慢或卡住收入。欧洲政策又增加了一层变量。2026 年 AI Act
              指引强调，高风险 AI 系统和基于 AI 的安全组件上市前需要履行义务；即使供应商核心硬件具备隐私保护特性，文档和客户资质周期也可能拉长。 在护理领域，Vayyar 的隐私政策和 DCB0129
              材料显示，公司虽主打无摄像头定位，仍承担真实的法律和临床治理义务。这些既是缓释因素，也是风险：它们说明公司有意识，但也证明业务不能只靠产品主张扩张；法律、隐私和临床安全运营必须在不同司法辖区和合作伙伴之间持续跟上。
