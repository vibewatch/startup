      - number: '5.2'
        title: 架构与开发者工作流
        blocks:
          - type: paragraph
            body: >-
              Vayyar 描述的架构在各页面之间一致。高度集成的雷达单芯片把模拟和数字 RF 组件与片上 DSP、MCU 资源组合在一起。硬件生成丰富的 4D
              点云数据，底层雷达算法和自研多层软件再把原始电磁信号连接到图像处理、机器学习和客户应用。面向合作伙伴，公司最重要的接口是 API 层：Vayyar 反复称，客户可以基于点云输出开发，而不需要深厚雷达专业知识。


              这种架构取向带来两个好处。第一，它通过交付参考设计、底层算法和可直接使用的软硬件平台，压缩合作伙伴开发负担。第二，Vayyar 可以销售一个技术难度高的核心，同时让客户或伙伴扩展用例。Walabot API 和
              SDK 是最清晰的公开证据，证明 Vayyar 过去曾开放面向开发者的工具。但核心汽车平台的公开开发者界面很薄：Vayyar 的公开 GitHub 足迹极少，因此大部分技术深度来自营销页面、API
              参考和合作伙伴表述，而不是活跃开源协作。
