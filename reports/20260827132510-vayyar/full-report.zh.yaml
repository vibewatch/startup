  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入范围
        blocks:
          - type: paragraph
            body: >-
              Vayyar 的真实市场最好定义为服务安全、监测和自动化的隐私保护型环境感知，而不是整个全球雷达市场，也不是整套 AI 传感器栈。公司把同一个雷达核心卖进多个垂直封装——汽车座舱内感知、外部 ADAS /
              ARAS、养老照护监测、智能建筑、零售和机器人——但每个垂直市场的商业逻辑不同。汽车买家关心安全要求、认证、集成复杂度和整车成本。养老照护买家关心跌倒、隐蔽事件、员工效率、入住率、隐私，以及与护士呼叫工作流的集成。建筑和零售场景里，价值主张则变成占用率、人流和应急响应。


              这个边界很重要，因为一个巨大的、未区分的 TAM 会高估近期可变现需求。2024 年重组报道称 Vayyar
              将重心收窄到智能家居和汽车，这本身就是有用的市场证据：管理层似乎也判断，并非每一个理论上的雷达用例都值得投入同等销售资源。因此，本报告采用的实际市场集中在汽车座舱 /
              安全感知和照护环境监测；智能建筑、零售和机器人则作为相邻期权价值，而非核心投资测算基础。
