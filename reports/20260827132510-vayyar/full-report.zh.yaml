      - number: '7.2'
        title: 运营、质量与产品执行风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，Vayyar 像是在同时把一个雷达内核变现到多个要求很高的垂直场景。质量页面释放正面信号——列出 ISO 9001、IATF 16949、ASPICE 和 ISO
              26262——汽车页面也声称产品已可量产。
              但这些页面没有披露现场可靠性、退货率、召回历史、故障分析指标或部署规模下的缺陷趋势。护理业务的公开案例研究方向上积极，但仍由供应商主导：它们展示了具名站点更快告警、更少跌倒、更好的排班故事，却不是经审计的多站点队列。
              因此，公司呈现典型商业化风险画像：确实有真实证据，但证据更偏向头部背书和案例研究，而非可复制运营数据。产品组合也依然很宽。公司页面仍在营销汽车、老年护理、智能建筑、公共安全、零售等场景，而 2024
              年后的报道称管理层已把重心收窄到智能家居和汽车。 这种不匹配不能证明失败，但会引出执行问题：重组之后，工程、支持、合规和渠道能力还能在多少个赌注之间摊开。
