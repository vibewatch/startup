      - number: '1.2'
        title: 创始人、领导层与治理信号
        blocks:
          - type: paragraph
            body: >-
              创始团队在公开资料中的表述很稳定：Raviv Melamed（CEO）、Naftali Chayat（CTO）和 Miri Ratner（VP R&D）。独立报道补充了创始人与市场匹配的背景：Melamed 曾任
              Intel 架构事业部副总裁，Chayat 和 Ratner 则出身于 Alvarion 技术领导岗位。这段履历有意义，因为 Vayyar 的产品战略靠定制 RFIC
              设计、嵌入式软件、信号处理，以及进入受监管或安全敏感环境的商业化能力支撑；这不是一支围绕通用 SaaS 增长打法拼起来的创始团队。


              公开治理披露仍比理想状态薄。Vayyar 官网没有公布完整董事会名单、投资人权利或委员会结构。公开可见的是一组经历多轮融资后仍可信的投资人，包括 Koch Disruptive
              Technologies、Battery Ventures、Bessemer、Regal Four、GLy Capital Management 和 Atreides。2019 年融资新闻稿称 Raviv
              Melamed 为联合创始人、CEO 兼董事长，暗示战略控制权较集中于创始人。2022 年和 2024 年的报道也显示创始人延续性较强，而非因人员更替陷入困境。


              进入日本是公开记录里少数可见的高管扩张动作之一。Vayyar 于 2022 年初开设东京办公室，并任命半导体高管 Tomo Taguchi
              负责，明确瞄准日本汽车和养老照护机会。这释放出积极信号，说明公司认真做本地商业落地。核心治理缺口不是创始人可信度，而是董事会不透明：投资人仍无法核验当前董事会构成、观察员权利、清算优先权，或 2024
              年后重组是否改变了高管职责范围。
