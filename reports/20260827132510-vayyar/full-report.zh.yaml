      - number: '5.3'
        title: 部署、质量与信任控制
        blocks:
          - type: paragraph
            body: >-
              部署和支持与硅片故事同样重要。Vayyar 的照护栈需要实体传感器布点、供电、房间覆盖假设、接入护士呼叫或照护系统，以及持续软件更新。汽车场景也呈现类似运营封装：紧凑
              PCB、经过测试的参考设计、功能安全姿态和监管适配。公司质量页面明确把运营模型绑定到 ISO 9001、IATF 16949、ASPICE 和 ISO 26262；照护材料则增加隐私内建设计主张和 DCB0129
              临床安全里程碑。


              实际解读是，Vayyar 销售的是技术平台加部署纪律，而不只是一颗芯片。这提高了可信度，但也带来对制造、认证、集成伙伴和客户专属工程的依赖。公开客户和合作伙伴证据——Toyota
              Connected、Aisin、Austco 和 TekTone——有助于证明平台能嵌入真实工作流。仍不够可见的是投资人通常想看的可靠性数据：现场故障率、召回历史、误报率，以及详细生产支持指标。
