      - number: '7.3'
        title: 合作伙伴、客户与渠道依赖
        blocks:
          - type: paragraph
            body: >-
              Vayyar 最强的公开证据，往往来自别人的工作流。在护理领域，系统接入 Amazon Alexa Together 做 B2C 告警，也接入 Austco、TekTone
              等护士呼叫合作伙伴，服务机构场景。这样能提升分发和实施适配度，但也意味着 Vayyar 不能完全控制告警最后一公里、护理人员工作流或生态经济性。 在汽车领域，Toyota 概念项目、Aisin 校车部署和
              Piaggio 历史案例都具备战略参考价值，但仍没有说明任何单一项目贡献多少经常性量产收入，客户集合是否足够分散。借助合作伙伴上市本身并不弱，尤其对硬件公司而言。 风险在于，Vayyar 可能掌握核心感知
              IP，却因为集成商、OEM
              或平台运营方掌握预算、客户关系或安装标准，而损失时间、利润率或可见度。由于公开来源没有披露集中度、续约或单项目经济性，投资人必须先把公司视为依赖较重，除非管理层用合同结构、销售管线转化和渠道组合数据证明相反。
