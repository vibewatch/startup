          label: 历史融资池
          detail: 累计风险资本支持大约 $300M+
          tone: positive
        - id: rfic
          label: RFIC / 软件研发
          detail: 芯片、算法、安全和平台开发支出
          tone: warning
        - id: inventory
          label: 认证 + 库存需求
          detail: 硬件和汽车项目通常需要前置营运资金
          tone: warning
        - id: deployments
          label: 安装 + 支持
          detail: 护理部署会增加勘测、安装、集成和支持工作
          tone: warning
        - id: programs
          label: 产能爬坡 / 续约
          detail: 收入质量取决于设计定点能否转化、合同能否留住
          tone: neutral
        - id: next
          label: 下一轮融资依赖
          detail: 缺少现金和烧钱速度披露，风险无法判断；裁员说明风险真实存在
