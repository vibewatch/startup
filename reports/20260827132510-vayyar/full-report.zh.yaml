      - number: '4.4'
        title: 财务结论与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              平衡后的财务结论是，Vayyar
              的公开商业验证足以支持继续尽调，但不足以完成一份严肃投资备忘录。照护案例研究和合作伙伴集成，让产品创造运营价值这件事变得可信。汽车证据点显示，公司能接触真实安全项目。历史融资证明投资人多次为这个故事下注。但公开材料仍停在可承保财务披露之前：没有已发布收入、没有收入流构成、没有披露毛利率、没有客户集中度、没有烧钱速度、没有现金跑道，也没有公开解释
              2024 年后战略重置是否提升了效率。


              因此，尽调要聚焦转化和质量。投资人需要知道多少部署或设计定点已经转化为经常性或可重复毛利；照护收入更像设备销售还是软件式 ARR；汽车定点是否集中在少数项目中。在此之前，标题结论是：Vayyar
              的商业模式看起来在商业上可信，但资本效率和近期融资依赖仍未解决。
