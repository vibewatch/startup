      - number: '2.2'
        title: 需求视角，而不是一个笼统 TAM
        blocks:
          - type: paragraph
            body: >-
              即便直接美元 TAM 不精确，公开证据仍支持底层问题池很大。照护侧，WHO 称跌倒是全球意外伤害死亡的第二大原因，每年造成 684,000 人死亡，另有 37.3 million
              次跌倒严重到需要医疗处置。United Nations 另称全球老龄化普遍存在，到 2050 年，全球每六个人中就有一人超过 65 岁。这些数字不能直接换算成 Vayyar 收入，但说明 Vayyar Care
              处理的是结构性问题，而非小众需求。


              汽车侧，更强的需求视角来自监管和安全评分。Euro NCAP 当前和未来协议栈明确纳入儿童乘员与乘员监测场景；NHTSA 以及 Kids and Car Safety
              也让中暑预防持续出现在公共政策讨论中。日本触发点更清晰：Aisin / Vayyar 材料称，数万辆幼儿园及相关巴士被要求安装儿童遗留检测。这不等同于全球汽车 TAM，但它是一个带有监管预算触发器的具体需求楔子。


              结果是一种受证据约束的市场判断：全球问题池很大，监管和人口结构顺风强，但 Vayyar 真正可触达多少支出、通过哪些渠道触达、以及以何种 ASP 或经常性软件组合变现，公开信息只给出部分能见度。
