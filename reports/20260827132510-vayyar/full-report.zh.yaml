      - number: '6.4'
        title: 客户结论与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              客户侧结论很清楚：Vayyar
              已经拿出足够多真实场景证据，能证明需求存在；但公开披露还不足以验证大规模客户质量。公司显然不是还没有客户：真实组织已经把这套技术接进汽车、公交车、护士呼叫系统和护理场景。汽车、护理、合作伙伴和消费端场景并存，也降低了对单一买方类型的依赖。
              但客户叙事仍高度依赖合作伙伴通路和公司自己提供的证据。因此，集中度风险、可复制性和扩张效率，比原始客户名录看上去更难判断。


              尽调时，最先问的客户问题不应停留在主题层面，而要落到操作层面：各细分市场有多少活跃付费部署，护理客户有多大比例续约或扩张，汽车销售管线有多少转成
              SOP，以及是否有单一合作伙伴或项目主导未来收入。这一区分很关键，因为仅有采用证据，还不足以承销客户经济性或集中度。
