      - number: '1.3'
        title: 融资历史、估值与规模信号
        blocks:
          - type: paragraph
            body: >-
              Vayyar 的公开融资史一半清楚、一半嘈杂。公司关于页面给出明确里程碑阶梯：2012 年 $12 million、2015 年 $22 million、2017 年 $45 million、2019 年
              $109 million、2022 年 $108 million。合计约 $296 million，与公司新闻稿和独立媒体常用的「融资约 $300 million」表述一致。2019 年 Series D 轮由
              Koch Disruptive Technologies 领投，2022 年 6 月 Series E 轮同样由 Koch 领投，GLy Capital 和 Atreides 参投。


              估值证据更含糊一些。Vayyar 自己转载的 Geektime 文章称，公司在 2022 年融资后估值约 $1 billion；Calcalist 则报道管理层称投后估值超过 $1.5 billion。到
              2026 年仍可访问的二级市场式追踪页面，如 Caplight 和 Notice，仍把 2022 年 6 月 Series E
              轮作为最近定价轮，并将公司锚在独角兽门槛附近，而不是显示新的溢价估值。因此，Vayyar 可以合理称为私营独角兽，但还不能干净地归为 2024-2026 年重新定价后的成长赢家。


              另一个复杂点是第三方追踪记录显示，2024 年 10 月有一笔 $25 million 的 Series F
              或未披露轮融资。可访问的公开记录没有对应的官方公告、定价估值或详细轮次条款，因此只能把这项事实记为部分佐证。若该记录成立，累计融资将高于已披露融资阶梯中的 $296
              million。规模信号却朝相反方向走：Calcalist 报道 2022 年中员工约 330 人，但 CTech 报道 2024 年末裁员期间员工约 200
              人，裁员目标是降低烧钱速度并重新聚焦业务。稳定的最近定价独角兽估值、有争议的后续融资细节、以及重组后更低员工数放在一起，说明公司仍在保留核心技术价值，同时收缩运营范围。
