      - number: '3.3'
        title: 切换成本、多栖采购与分销权力
        blocks:
          - type: paragraph
            body: >-
              汽车切换成本在认证之后会变高，因此早期评估动态与量产动态不同。探索阶段，OEM 和 Tier-1
              可以在雷达、摄像头和混合方案之间多栖试验。一旦感知架构通过验证并嵌入车型项目，换供应商的成本就会上升，因为软件、安全逻辑、封装和合规证据都需要返工。这一动态通常有利于已有项目存在感和广泛分销的供应商。


              这正是 Vayyar 相对 TI、NXP 或根基很深的摄像头系统供应商的核心结构性劣势。大厂能捆绑技术、现场应用支持和长期生命周期供货承诺。Vayyar 与 Toyota Connected 和 Aisin
              的公开合作伙伴证据之所以有价值，正是因为它帮助弥补这项差距。公司可能在两种情况下取胜：买方足够看重隐私保护型雷达和多功能性，愿意接受更专业的供应商关系；或者 Tier-1 合作伙伴把 Vayyar 带入量产。
