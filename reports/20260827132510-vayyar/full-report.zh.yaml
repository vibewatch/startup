      - number: '8.2'
        title: 估值语境与可比公司集合
        blocks:
          - type: paragraph
            body: >-
              公开材料最适合给出的估值语境是一段区间，而不是一个点估计。VC Cafe 仍在 2026 年 7 月把 Vayyar 放在 $1B 桶内，Tracxn 则记录 2022 年 6 月 E 轮融资
              $108M，投后估值 $1B。 相比之下，CTech 2022 年报道把同一笔融资描述为把 Vayyar 推到投后超过 $1.5B；startupim 后来列出总融资 $323M、2024 年 9 月 $25M
              F 轮，以及 2024 年 10 月一轮未披露融资。这个组合强烈暗示，公司融资活动多于最简单的“2022 年独角兽”叙事，但公开披露还不足以建立干净的实时估值。 公开可比公司有助于框定范围。Ouster 和
              Ambarella 的市值分别高于 $2.5B 和 $3B，并披露了公开市场指标；indie Semiconductor 约 $0.9B，Arbe 低得多。因此，Vayyar 约 $1B
              的估值按相对规模并不荒唐，但对一家未披露收入或利润率基础、无法支撑公开可比公司映射的私营公司而言，要求仍然很高。
