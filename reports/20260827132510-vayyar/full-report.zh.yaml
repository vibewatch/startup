      - number: '2.4'
        title: 增长驱动因素、约束与缺口
        blocks:
          - type: paragraph
            body: >-
              最强的市场驱动因素是监管拉力、隐私敏感度和多功能性。Euro NCAP 评分演进、日本儿童遗留要求、NHTSA
              中暑意识，都强化了汽车对更好座舱内感知的需求。照护场景中，老年人口上升和跌倒伤害规模，创造了对无摄像头房间监测技术的持久需求。Vayyar
              的隐私内建设计定位在摄像头遭遇文化或运营阻力的场景中尤其相关。多功能性是另一个结构性驱动因素：公司反复主张一个雷达传感器可以覆盖多项安全任务，直指 OEM 的成本和复杂度压力。


              最大的采用约束同样清楚。汽车销售需要漫长验证周期、供应链可靠性，以及可能多年后才转化为规模收入的设计定点。照护部署需要证明能减少跌倒、管理报警疲劳、适配员工工作流，并让预算说得通。两个细分市场里，公开数据都太薄，无法拆出
              Vayyar 可触达份额、实际售价或从试点转向规模部署的转化率。


              因此，市场形态有吸引力，但仅凭公开证据还无法精确量成美元。投资人应把汽车和照护楔子作为近期核心来测算，把建筑 / 零售 /
              机器人视为上行期权，并要求管理层量化真实销售管线、预算归属和部署速度在这套宽平台故事中的位置。
