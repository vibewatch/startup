        title: 留存、扩张与集中度读数
        blocks:
          - type: paragraph
            body: >-
              留存和持久性是客户故事中公开证据最弱的部分。Vayyar 确实展示了具名站点的持续使用、接入现有工作流，以及可能支持扩张的软件 / 报告功能。Essex 提到分阶段部署；Sambrook 和 Denham
              描述持续审阅警报和报告；Austco 与 TekTone 把 Vayyar 定位为更大安装基础上的平台增强。这些都是积极信号，因为它们暗示 Vayyar 可以从一次性硬件出货，进入嵌入式运营工作流。


              但已审阅的公开来源没有披露 GRR、NRR、续约率、合同期限、流失或头部客户集中度。即便最强的具名证据，也无法清楚回答 Vayyar
              赢得扩张是因为客户热爱产品、合作伙伴把它带入市场，还是监管推动采用。投资人因此应把持久性视为合理但尚未完成承保。
