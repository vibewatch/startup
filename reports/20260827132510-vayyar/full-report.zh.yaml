      - number: '1.5'
        title: 覆盖缺口、未支撑指标与反向信号
        blocks:
          - type: paragraph
            body: >-
              公开记录最大的限制不是产品模糊，而是财务不透明。Vayyar
              不公开披露收入、毛利率、客户数、出货量、续约率或分部构成。即使在规模上，现有最佳信号也只是方向性而非定论：官方页面证明地理存在和平台宽度，外部报道则暗示重组后员工数压缩。投资人因此仍无法从外部核验 ARR
              质量、设计定点转化、多垂直收入集中度等基础证据，这些都还是开放尽调项。


              可访问的反向证据有分量。2024 年末 CTech 报道称，Vayyar 裁掉数十名员工，以降低烧钱速度并更聚焦智能家居和汽车。这并不否定公司的技术；但它确实削弱了一个论点，即 Vayyar
              已经解决了所有原始垂直市场的商业化扩张。2024 年 10 月融资记录存在争议，也是另一个警示信号，因为它意味着要么公司融资披露不足，要么二级数据库维护噪音较大；无论哪种，都不利于透明度。


              也有一些较温和的缺口。Vayyar 的董事会名单不公开，公司不披露老股交易或债务工具；公开证据也不足以判断消费级 Walabot
              产品线是否具有战略意义，还是主要只是遗留品牌。因此，后续章节应得出一个混合结论：公司有真实技术、真实伙伴和真实监管进展，但支撑经济性或治理质量判断的公开数据仍不完整。
