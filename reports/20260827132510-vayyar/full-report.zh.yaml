  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户细分、买方与用例
        blocks:
          - type: paragraph
            body: >-
              Vayyar 的客户群最好按终端市场和进入路径拆分，而不是塞进一个笼统的「企业」桶里。主要可见群体包括汽车 OEM 和 Tier-1 项目、养老照护运营方与照护渠道、战略技术合作伙伴，以及规模较小的
              Walabot / 开发者社区。汽车场景里，付款方通常是 OEM、Tier-1
              或出行平台运营方，终端用户则是司机、乘客或乘员。照护场景里，运营方和渠道伙伴似乎是买方，护理人员是日常用户，住户则是受保护的最终受益人。这种拆分很重要，因为各细分市场的证据质量差异很大：汽车证据在具名合作上更强，在产量上更弱；照护证据在工作流结果上更强，在定价或留存上更弱。


              因此，本章核心客户结论是混合但令人鼓舞。Vayyar 的确在多个细分市场拥有具名客户和合作伙伴证据。不过，这些引用质量不一：有些是概念部署，有些是合作伙伴集成，有些是案例研究，只有一部分清楚显示规模化或长期部署。
