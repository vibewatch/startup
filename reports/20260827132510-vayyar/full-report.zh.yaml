      - number: '4.2'
        title: 定价能见度与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              公开定价透明度极低。Walabot 的 $179.95 消费价格可见，但 Vayyar 不公布汽车项目
              ASP、照护房间定价、软件附加率、实施费或支持条款。因此，最好的公开线索来自产品功能和客户如何描述部署。照护场景中，Vayyar
              营销入住率、入住时长和员工效率收益；合作伙伴页面则强调与现有护士呼叫系统集成、减少报警疲劳。案例研究声称响应时间改善、跌倒数量下降、住院减少，这些都支持付费意愿。但它们没有说明经济性到底以一次性硬件、年度许可、监测服务费还是混合合同沉淀。


              硬件可比公司凸显了这个模型可能多么依赖销量和规模。Texas Instruments 的汽车半导体业务在规模化后释放强劲利润率，而专业传感器公司 Ouster 仍报告低得多的毛利率和净亏损。Vayyar
              自己的路径大概率介于两者之间，但公开记录不足以判断具体位置。投资测算含义很简单：收入质量可见，利润率质量不可见。
