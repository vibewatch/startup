      - number: '8.3'
        title: 情景范围与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Vayyar 同时揉合硬件、软件、安全和护理分析，却没有披露投资人最需要的核心私营指标，因此情景纪律比精细表格输出更重要。牛市情景需要尽调中看到三件事：第一，Toyota、Aisin、Piaggio
              等背书项目转化为有意义的量产收入；第二，Vayyar Care 像可复制的工作流产品，而不是孤立项目收入；第三，2024 年重组提升了效率，却没有伤害平台路线图。
              这些条件成立时，估值回到历史区间上沿就说得通。基准情景假设公司真实存在、战略相关、仍是独角兽，但在收入质量和集中度被证明之前，投资人应锚定在该区间下沿附近。熊市情景不是技术失败，而是商业化、利润率或融资证据始终追不上故事。
              因此，入场纪律应奖励证据里程碑，而不只是过去头条轮次的光环。
