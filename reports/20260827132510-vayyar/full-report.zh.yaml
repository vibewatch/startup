      - number: '7.4'
        title: 资本、人员与放弃标准
        blocks:
          - type: paragraph
            body: >-
              到 2026 年，Vayyar 最可投资的解读不是公司缺乏产品可信度，而是公开记录还没有证明这种可信度能在可接受风险下转化为耐久经济性。CTech 2024 年报道称 Vayyar
              裁员数十人以降低烧钱速度，这是材料里最明确的负面信号，因为它说明即便有大量历史融资，管理层仍需要保住资金可支撑时间、收紧重心。 Workable
              和公司页面仍在呈现广泛规模，但这些材料不能替代当前现金、订单、积压订单或客户集中度披露。人员风险同样披露不足。公开页面确认公司跨多个办公室开展国际运营和同步项目，但没有披露团队厚度、项目归属或重组后业务的继任计划。
              这意味着，核心论点破坏因素都很具体：无法把头部汽车背书转成具名量产收入，无法在孤立案例研究之外证明护理
              ROI，重组后融资压力再次出现，或在隐私、出口、临床安全流程中出现重大合规滑坡。尽调和价格纪律都应围绕这些门槛展开。
