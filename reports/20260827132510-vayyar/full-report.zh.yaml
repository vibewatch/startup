chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与平台范围
        blocks:
          - type: paragraph
            body: >-
              Vayyar 是一家以色列感知公司，围绕一套核心技术栈搭建：在高度集成的雷达单芯片硬件上跑 4D 成像雷达，并配套自研信号处理软件。公司称，2011
              年最早从医疗命题切入——用射频感知更早发现早期乳腺癌——随后把同一套底层感知能力扩展到汽车、养老照护、智能建筑、机器人、零售、公共安全和消费级家装产品。这条扩展轨迹对尽调很关键：它一方面证明技术确实可迁移，另一方面也暴露出一个反复出现的战略诱惑，即把工程资源摊到过多垂直市场。


              公司总部位于以色列 Yehud-Monosson；官方关于页面还列出 Haifa、Kfar Sava、Chicago、Tokyo、Suzhou 和 Stockholm 等站点。Vayyar
              反复强调隐私内建设计：不同于摄像头系统，雷达不捕捉光学图像，这在卧室、浴室、车辆座舱和长者照护环境里是实质优势。公司官网和产品页把 Vayyar
              定位为雷达平台公司，而不是单品创业公司；截至本报告日期，汽车、照护、智能建筑、零售、机器人、医疗和 Walabot 消费产品线仍各自在线。


              私营硬件公司通常不会把技术身份铺得这么宽。Vayyar 称其 RFIC 覆盖 3-81 GHz、最高 72 个收发器；汽车业务则拆成 60 GHz 座舱内感知与 79 GHz ADAS / ARAS
              感知。Walabot 仍是底层技术栈最清晰的消费级呈现：一个独立品牌站销售的可视化墙柱探测器。合在一起，公开证据支持这样的判断：Vayyar
              不只是汽车传感器创业公司，而是一家多市场雷达平台供应商，只是商业重心已经随时间收窄。
