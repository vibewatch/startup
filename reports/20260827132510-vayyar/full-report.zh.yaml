      - number: '5.4'
        title: 差异化、成熟度与技术风险
        blocks:
          - type: paragraph
            body: >-
              Vayyar 最强的技术差异化来自多功能性、隐私、宽视场，以及一个主张：单个雷达端点可以替代多个传统传感器，并在之后持续启用新的软件定义功能。60 GHz 座舱平台强调无摄像头识别三排乘员。79 GHz XRR
              平台强调 0-300m 距离、宽 FoV、片上处理，以及相对多芯片雷达或 LiDAR 替代方案更低的成本。这些主张有意义，因为它们打的是买方在复杂度和成本上的痛点，而不只是原始性能。


              主要产品技术风险不是架构听起来薄弱，而是独立公开验证比公司野心更薄。开发者信号温和，公开基准数据稀缺，制造设置、现场可靠性、超出保密措辞之外的网络安全控制、以及当前路线图排序等几个重要事实都只有部分证据。因此，技术结论可信但仍重尽调：平台看起来有差异化，封装也经过思考，但验证仍过度依赖公司控制材料和合作伙伴证言。
