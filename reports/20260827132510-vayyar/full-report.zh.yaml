  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式：多条收入流，披露不均
        blocks:
          - type: paragraph
            body: >-
              Vayyar 显然不止一种赚钱方式，但公司没有公开拆分哪条最重要。最强可见收入流包括汽车 B2B 项目、Vayyar Care 部署、规模较小的 Walabot
              消费业务，以及面向研究人员的开发套件销售。汽车看起来是典型设计定点模式：公司把雷达硬件和软件卖入 OEM 或 Tier-1
              安全项目，然后等待认证和量产爬坡。照护不同。公司营销的是一套安装式监测系统，可接入护士呼叫和照护工作流，意味着前期硬件收入，加上随后软件、分析、支持和集成经济性。Walabot
              提供唯一清晰的公开标价，但它更适合作为 Vayyar 能直接成交的证明，而不是公司核心经济性的证据。


              因此，财务解读是混合的。收入流宽度是优点，因为它分散终端市场，并创造多条商业化路径。但披露质量恰恰在投资人最需要的地方薄弱：实际定价、按收入流划分的贡献利润率、客户集中度，以及毛利中汽车、照护、消费活动各占多少。
