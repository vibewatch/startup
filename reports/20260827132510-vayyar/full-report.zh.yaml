      - number: '4.3'
        title: 资本充足性：融过大钱，但仍对烧钱敏感
        blocks:
          - type: paragraph
            body: >-
              从历史看，Vayyar 确实融到过风险投资规模的大额资本。公司自己的历史页记录，在正式宣布的 $108M Series E 轮之前，早期轮次为 $12M、$22M、$45M 和
              $109M。第三方追踪平台随后出现分歧：有的把累计融资放在 $296M 至 $300M 附近，startupim 则列出 $323M 和一笔 2024 年末额外融资事件。相比这些分歧，2024
              年末运营信号更重要。CTech 报道称，公司裁掉数十名员工，明确是为了降低烧钱速度，并重新聚焦智能家居和汽车。换句话说，大额累计融资并没有消除节约资本的必要。


              投资人可以推断，Vayyar
              仍是一家对资本敏感的硬件公司。汽车认证周期漫长，照护部署需要安装和支持，硬件业务往往在收入完全成熟前吸收营运资本和库存风险。公开来源无法推断的，是决定紧迫性的那个数字：账上现金相对于月度烧钱速度。除非管理层披露现金跑道，或尽调拿到董事会材料和队列经济性，否则外部证据只能说明资本充足性看似合理，尚未被证明。
