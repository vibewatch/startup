chapter:
  number: 6
  title: Customers
  summary: Vayyar has enough named-customer and partner proof to show real adoption across automotive and care, but the quality of that proof is uneven. Care case studies provide the clearest workflow outcomes, while automotive references provide the strongest strategic credibility; what remains missing is scaled public disclosure on renewals, concentration, and conversion from logo to durable revenue.
sections:
- id: segmentation
  title: Customer Segments, Buyers, and Use Cases
  body: 'Vayyar’s customer base is best segmented by end market and route to market rather than by a single generic “enterprise” bucket. The main visible groups are automotive OEM and Tier-1 programs, senior-care operators and care channels, strategic technology partners, and the smaller Walabot / developer community. In automotive, the payer is typically an OEM, Tier-1, or mobility platform operator, while the end users are drivers, passengers, or riders. In care, operators and channel partners appear to be the buyers, caregivers are the daily users, and residents are the protected end beneficiaries. This segmentation matters because evidence quality differs sharply across segments: automotive proof is stronger on named partnerships than on production volume, while care proof is stronger on workflow outcomes than on pricing or retention.


    The chapter’s core customer conclusion is therefore mixed but encouraging. Vayyar does have named-customer and partner evidence in multiple segments. However, those references vary in quality: some are concept deployments, some are partner integrations, some are case studies, and only a subset clearly show scaled or durable rollouts.'
