  rows:
  - - Automotive OEM / Tier-1
    - 'Buyer: OEM/Tier-1; User: vehicle safety teams; End beneficiary: occupants/riders'
    - In-cabin monitoring, CPD, ARAS, ADAS
    - Named proof exists; program volumes opaque
    - Potentially high strategic value per design win
    - Need SOP volume and production-conversion data
  - - Senior-care operators
    - 'Buyer: care operator or council; User: caregivers; End beneficiary: residents'
    - Fall detection, behavior insight, response acceleration
    - Strongest workflow-outcome evidence
    - Likely important recurring or repeat deployment segment
    - Need renewal and per-site contract data
  - - Care channel partners
    - 'Buyer: partner or joint account; User: partner sales / installed base'
    - Nurse-call and communications integration
    - Austco and TekTone broaden reach
    - May lower CAC and speed adoption
    - Need partner concentration and margin-share data
  - - Mobility / partner programs
    - 'Buyer: mobility or adjacent platform operator'
    - Cabin awareness and concept safety programs
    - Toyota Connected proof exists
    - High signaling value even if not large revenue yet
    - Need conversion from concept to production
  - - Consumer / developer users
    - 'Buyer: individual customer or developer'
    - Walabot DIY and experimentation
    - Active but likely smaller than core B2B segments
    - Proof of breadth, not necessarily core revenue
    - Need revenue share and retention by product line
  notes: Customer segmentation is clearer than customer counts. Public proof identifies who uses the product before it reveals how big each segment is.
