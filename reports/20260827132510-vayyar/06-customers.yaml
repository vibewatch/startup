- id: named-proof
  title: Named Customer Proof and Adoption Signals
  body: 'The named-proof set is richer in care and safety-adjacent automotive use cases than in broad disclosed customer counts. Vayyar has public references involving Toyota Connected, Aisin, Piaggio Fast Forward / Piaggio Group, Austco, TekTone, Essex County Council, Denham Manor, Stowford House, and Sambrook House. Those names matter because they tie the technology to real workflows: cabin awareness, kindergarten-bus heatstroke prevention, motorcycle safety modules, nurse-call integrations, and care-home fall detection.


    But named logos are not all equivalent. Toyota Connected’s concept shows meaningful technical credibility, yet it is still a concept rather than a disclosed high-volume SOP. Aisin and Piaggio evidence sit closer to deployment language. Care case studies are more explicit about operational outcomes, but they come mostly from Vayyar-authored stories. So the customer base looks real, but public proof of scaled repeat purchase and broad production conversion is still patchy.'
