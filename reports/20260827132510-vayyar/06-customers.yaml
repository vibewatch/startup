- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Care channel integrations
    - Dependence on a few nurse-call or care-tech partners
    - Could constrain distribution or margin capture
    - Request partner-attributed pipeline and contract economics
  - - Automotive regulation and safety mandates
    - Programs may bunch around a small number of OEMs or Tier-1s
    - Revenue can become lumpy and concentrated
    - Request top-program pipeline and SOP timing
  - - Public-sector care deployments
    - Long procurement cycles and grant dependence
    - Expansion may be slower than case studies imply
    - Request procurement win/loss and funding sources
  - - Named-logo selling
    - A few marquee logos can overstate broader penetration
    - May distort go-to-market quality read
    - Request active paid accounts by segment
  - - Consumer / developer branch
    - Walabot or developer activity may distract from core B2B focus
    - Strategic ambiguity more than direct revenue risk
    - Request revenue contribution by product family
  - - Partner-led sales motion
    - Partners may own customer relationship and renewal leverage
    - Can weaken Vayyar’s direct retention visibility
    - Request direct versus indirect ARR / revenue split
  notes: The logo set is helpful, but investors need to know whether expansion is broad-based or dependent on a narrow band of counterparties.
