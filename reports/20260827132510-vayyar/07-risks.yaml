- id: partner-customer-and-channel-dependencies
  title: Partner, customer, and channel dependencies
  body: Vayyar's strongest public proof often arrives through somebody else's workflow. In care, the system plugs into Amazon Alexa Together for B2C alerting and into nurse-call partners such as Austco and TekTone for institutional workflows. That improves distribution and implementation fit, but it also means Vayyar does not fully control the last mile of alerting, caregiver workflow, or ecosystem economics. In automotive, Toyota concept work, Aisin school-bus deployment, and Piaggio history are strategically valuable references, yet they still leave open how much recurring production revenue any one program contributes and whether the customer set is diversified. Partner-assisted go-to-market is not inherently weak, especially for hardware. The risk is that Vayyar could own the core sensing IP but still lose time, margin, or visibility because integrators, OEMs, or platform operators own the budget, the customer relationship, or the installation standard. Since public sources do not disclose
    concentration, renewal, or per-program economics, investors have to treat the company as dependency-heavy until management proves otherwise with contract structure, pipeline conversion, and channel mix data.
  claimRefs:
