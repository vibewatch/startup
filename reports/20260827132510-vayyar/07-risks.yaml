  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cash, burn, and runway
    missingEvidence: Current cash balance, monthly burn, restructuring savings, debt if any, and downside runway scenario.
    whyItMatters: The 2024 layoff signal makes capital adequacy the most time-sensitive unresolved risk.
    diligencePath: Request monthly management accounts, board cash bridge, financing pipeline, and 12-18 month base/bear plan.
    relatedQuestionRefs:
    - QR011
    - QR021
    - QR029
    relatedTableRefs:
    - TR004
    - TR005
  - type: private-evidence-only
    severity: material
    topic: customer concentration and production revenue
    missingEvidence: Named automotive production volumes, per-program revenue, top-customer share, renewal status, and pipeline conversion by stage.
    whyItMatters: Partner logos are strong, but without concentration and revenue detail they can overstate commercial durability.
    diligencePath: Request top-10 customer revenue bridge, OEM/Tier-1 pipeline by SOP stage, and customer reference calls.
    relatedQuestionRefs:
    - QR023
    - QR026
    - QR029
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: clinical, privacy, and security assurance
    missingEvidence: Incident logs, security architecture, independent audits, DPIAs where relevant, clinical safety case, and support escalation evidence.
    whyItMatters: Camera-free positioning lowers some privacy anxiety but does not prove compliance maturity or operational resilience.
    diligencePath: Request privacy/security memo, penetration-test summary, incident history, DCB0129 artifact set, and sample deployment governance pack.
    relatedQuestionRefs:
    - QR003
    - QR004
    - QR017
    - QR028
    relatedTableRefs:
    - TR001
    - TR002
  - type: enumeration-incomplete
    severity: minor
    topic: full dependency population
    missingEvidence: A complete list of critical platforms, integrators, suppliers, and customer programs by revenue contribution.
    whyItMatters: Public evidence surfaces the most visible dependencies, but hidden concentration can materially change residual risk.
    diligencePath: Ask management for partner register, supply-chain map, and concentration analysis tied to current-year revenue.
    relatedQuestionRefs:
    - QR014
    - QR015
    - QR018
    relatedTableRefs:
    - TR001
    - TR003
    - TR004
