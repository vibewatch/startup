company:
  name: Vayyar
chapter:
  number: 7
  title: Risks
  summary: Vayyar's risk stack is led by execution and underwriting opacity rather than by a single known legal blow-up. The highest practical risks are (1) capital and restructuring risk after the 2024 layoff-driven burn response, (2) customer-conversion risk because flagship automotive and care references do not disclose durable revenue, (3) partner/platform risk because care workflows rely on Amazon and nurse-call integrators while automotive depends on OEM and Tier-1 programs, and (4) regulatory/compliance risk spanning automotive safety, export controls, and healthcare/privacy obligations. Public evidence shows real mitigations — FCC progress, quality frameworks, DCB0129 compliance claims, privacy-by-design positioning — but not enough quantified proof to clear the residual exposure.
sections:
- id: regulatory-and-legal-exposure
  title: Regulatory and legal exposure
  body: 'Vayyar''s automotive and care businesses both touch regulated workflows even though the company is not itself a public issuer or a medical-device giant with dense disclosure. In automotive, the company publicly highlights AEC-Q100 qualification, ASIL-B compliance, FCC waivers, and broad safety use cases such as child presence detection and occupant monitoring. That matters because the product story is not just sensor performance; it is the ability to fit within safety, homologation, and OEM approval processes that can delay or block revenue. European policy adds another moving layer. The 2026 AI Act guidance emphasizes obligations for high-risk AI systems and AI-based safety components before market placement, which can lengthen documentation and customer qualification cycles even when the supplier''s core hardware is privacy-preserving. In care, Vayyar''s privacy policy and DCB0129 materials show that the company carries real legal and clinical-governance obligations despite its
    camera-free positioning. Those are mitigations as much as risks: they show awareness, but they also prove the business cannot scale on product claims alone; it must keep legal, privacy, and clinical-safety operations current across jurisdictions and partners.'
  claimRefs:
