- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Capital stress after restructuring
    - New financing, burn commentary, or renewed layoffs
    - Another material layoff round or opaque financing under distress terms
    - Pause underwriting and demand full cash/runway package
  - - Automotive proof fails to monetize
    - Named SOP revenue, production volume, or additional OEM disclosures
    - No clearer production-revenue proof by next diligence cycle
    - Discount automotive upside and lower valuation range
  - - Care ROI remains anecdotal
    - Audited cohort outcomes, renewal data, and deployment counts
    - Only isolated case studies remain available
    - Treat care economics as unproven and require customer calls
  - - Platform / partner dependency worsens
    - Amazon, nurse-call, or OEM workflow dependency becomes more concentrated
    - Loss or weakening of a critical integration or flagship reference
    - Increase channel-risk discount and revisit go-to-market assumptions
  - - Compliance posture slips
    - Privacy, clinical safety, export, or spectrum issue surfaces publicly
    - Material incident, regulator inquiry, or deployment suspension
    - Move to research-more / no-go until resolved
  notes: Kill criteria are investment-monitoring thresholds, not assertions that any one trigger has already occurred.
