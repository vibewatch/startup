company:
  name: Vayyar
chapter:
  number: 1
  title: Company Overview
  summary: Vayyar is a privately held Israeli 4D imaging radar company founded in 2011 in Yehud-Monosson. The company has built a multi-vertical radar-on-chip platform spanning automotive safety, senior-care monitoring, smart buildings, retail, robotics, medical, and consumer wall-scanning applications, reached unicorn status in its June 2022 Series E, and then restructured in late 2024 to reduce cash burn and focus more tightly on automotive and smart-home priorities.
sections:
- id: identity-and-platform
  title: Identity, Headquarters, and Platform Scope
  body: 'Vayyar is an Israeli sensing company built around a single core technology stack: 4D imaging radar implemented on highly integrated radar-on-chip hardware and in-house signal-processing software. The company says it began in 2011 with a medical thesis — better early-stage breast-cancer detection using radio-frequency sensing — and then expanded the same sensing primitives into automotive, senior care, smart buildings, robotics, retail, public-safety, and consumer home-improvement products. That expansion matters for diligence because it shows both genuine technology portability and a recurring strategic temptation to spread engineering effort across too many verticals.


    The company''s headquarters are in Yehud-Monosson, Israel, and the official about page lists additional sites in Haifa, Kfar Sava, Chicago, Tokyo, Suzhou, and Stockholm. Vayyar repeatedly emphasizes privacy-by-design: unlike camera systems, its radar does not capture optical imagery, which is a material advantage in bedrooms, bathrooms, vehicle cabins, and elder-care environments. The corporate website and product pages position Vayyar as a radar platform company rather than a single-product startup, with separate automotive, care, smart-building, retail, robotics, medical, and Walabot consumer surfaces all live as of the run date.


    The technical identity is unusually broad for a private hardware company. Vayyar states that its RFIC covers 3-81 GHz and up to 72 transceivers, while the auto business splits into 60 GHz in-cabin sensing and 79 GHz ADAS / ARAS sensing. Walabot remains the clearest consumer product manifestation of the underlying stack: a visual stud finder sold on a separate brand site. Taken together, the public evidence supports the view that Vayyar is not merely an automotive sensor startup but a multi-market radar platform vendor whose commercial focus has narrowed over time.'
