- id: funding-valuation-and-scale
  title: Funding History, Valuation, and Scale Signals
  body: 'Vayyar''s public funding history is partly clear and partly noisy. The company''s about page provides an explicit milestone ladder: $12 million in 2012, $22 million in 2015, $45 million in 2017, $109 million in 2019, and $108 million in 2022. That sequence sums to about $296 million and lines up with the widely cited “~$300 million raised” description used by company releases and independent press coverage. The 2019 Series D was led by Koch Disruptive Technologies, and the June 2022 Series E was also led by Koch, with GLy Capital and Atreides joining.


    Valuation evidence is somewhat more ambiguous. Vayyar''s own republished Geektime article described the company as worth about $1 billion after the 2022 round, while Calcalist reported management saying valuation crossed $1.5 billion post-money. Secondary-style tracker surfaces available in 2026, such as Caplight and Notice, still anchor to the June 2022 Series E as the latest priced round and place the company around the unicorn threshold rather than showing an updated premium mark. That means Vayyar can fairly be called a private unicorn, but not a cleanly re-priced 2024-2026 growth winner.


    A further wrinkle is a third-party tracker entry indicating a $25 million October 2024 Series F or undisclosed round. The accessible public record does not show a matching official announcement, priced valuation, or detailed round terms, so the fact can be noted only as partially corroborated. If valid, it would imply cumulative funding above the $296 million disclosed round ladder. Scale signals moved in the opposite direction: Calcalist reported roughly 330 employees in mid-2022, but CTech reported around 200 employees during late-2024 layoffs aimed at reducing cash burn and refocusing the business. That combination — stable last-priced unicorn valuation, disputed later financing detail, and lower headcount after restructuring — is consistent with a company preserving core technical value while retrenching operational scope.'
