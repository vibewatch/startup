- id: milestones-and-commercial-trajectory
  title: Milestones, Partnerships, and Trajectory
  body: 'The milestone record shows a company that repeatedly translated the same radar core into new commercialization channels. The company was established in 2011, raised its first disclosed funding in 2012, and launched first-generation silicon in 2013. The Walabot consumer brand arrived in 2016, giving Vayyar a visible retail product and evidence that the company could package RF sensing for non-industrial users. Second-generation ICs and elderly-care / B2B products appeared by 2018, followed by the large Koch-led Series D in 2019 and additional automotive commercialization in 2020-2021.


    Automotive milestones are especially important because they connect technology maturity to real OEM and Tier-1 adoption paths. Toyota Connected''s Cabin Awareness concept used Vayyar radar in a prototype Sienna and May Mobility shuttle. Aisin and Vayyar announced deployment of child-presence-detection sensors in Japanese kindergarten buses after emergency legislation. Piaggio Fast Forward selected Vayyar radar for robots and ARAS-related applications, while Vayyar also highlighted CLEPA recognition and global automotive association activity. These are not all equal in commercial weight, but together they demonstrate that Vayyar has crossed from lab-grade RF capability into partner-validated safety use cases.


    The trajectory also captures a strategic pivot. By September 2024, management was no longer telling a maximalist multi-vertical growth story; it was cutting staff to reduce burn and focus on core markets. That is an adverse signal, but not necessarily a fatal one. In hardware, narrowing the number of active commercialization fronts can improve odds of surviving long qualification cycles. The core diligence question is whether the 2024 reset was the start of disciplined focus or evidence that earlier multi-vertical expansion failed to produce enough high-margin volume.'
