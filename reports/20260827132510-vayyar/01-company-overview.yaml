callouts:
- calloutType: strength
  title: Real platform breadth, not a single-demo sensor company
  body: Vayyar has credible evidence of the same radar core showing up in automotive safety, senior-care monitoring, building analytics, robotics, and the Walabot consumer product. That breadth can dilute focus, but it also makes the underlying RF / algorithm stack harder to dismiss as a one-customer science project.
  claimRefs:
  - CO005
  - CO006
  - CO008
  - CO011
  - CO031
  - CO032
  - CO033
- calloutType: risk
  title: Post-unicorn restructuring is the key adverse signal
  body: The clearest negative datapoint is the September 2024 report that Vayyar laid off dozens of employees to reduce cash burn and narrow focus. Investors should treat the 2022 unicorn label as historical proof of fundraising success, not proof that commercialization across all verticals worked as planned.
  claimRefs:
  - CO021
  - CO026
  - CO028
- calloutType: insight
  title: Automotive and senior care look like the surviving strategic center
  body: 'Japan expansion, Toyota Connected, Aisin, Austco, and TekTone all cluster around two use-case families: safety in vehicles and monitoring in care settings. That pattern suggests the sprawling early platform narrative has already been internally reprioritized toward verticals with clearer ROI and regulatory pull.'
