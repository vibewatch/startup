  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board governance
    missingEvidence: Current board roster, observer rights, committee structure, and founder control provisions.
    whyItMatters: Governance concentration and investor protections cannot be assessed from public sources alone.
    diligencePath: Request current board deck, cap-table summary, and charter documents from management or lead investor.
    relatedQuestionRefs:
    - QO007
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: material
    topic: 2024 financing
    missingEvidence: Official term sheet, press release, or investor confirmation for the tracker-reported October 2024 $25M round.
    whyItMatters: This affects total raised, current capitalization, and whether valuation held up post-2022.
    diligencePath: Ask management for signed financing chronology and confirm with lead investors or counsel.
    relatedQuestionRefs:
    - QO012
    relatedTableRefs:
    - TO003
    - TO004
  - type: private-evidence-only
    severity: material
    topic: commercial metrics
    missingEvidence: Revenue, ARR, shipment volumes, customer count, and segment mix by vertical.
    whyItMatters: Without these metrics, later valuation and financial-quality conclusions remain lower-confidence.
    diligencePath: Request monthly management reporting and booked / shipped revenue by vertical.
    relatedQuestionRefs:
    - QO014
    - QO015
    - QO025
  - type: stale
    severity: minor
    topic: headcount
    missingEvidence: A current company-confirmed employee count after the 2024 restructuring.
    whyItMatters: Headcount is a useful but imperfect proxy for scale, burn, and post-reset operating scope.
    diligencePath: Ask for current org chart and payroll headcount by geography.
    relatedQuestionRefs:
    - QO016
  - type: missing-source
    severity: minor
    topic: capital structure extras
    missingEvidence: Public evidence of debt facilities, venture credit, or secondary transactions.
    whyItMatters: These can materially affect dilution, liquidity, and downside protection.
    diligencePath: Request debt schedule, shareholder register, and any tender or secondary history.
    relatedQuestionRefs:
    - QO024
