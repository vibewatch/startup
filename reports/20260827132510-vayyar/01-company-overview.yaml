- id: founders-governance-leadership
  title: Founders, Leadership, and Governance Signals
  body: 'The founding team is consistently described as Raviv Melamed (CEO), Naftali Chayat (CTO), and Miri Ratner (VP R&D). Independent reporting adds useful color on founder-market fit: Melamed previously served as a vice president in Intel''s architecture group, while Chayat and Ratner came from Alvarion technical leadership roles. That background is relevant because Vayyar''s product strategy depends on custom RFIC design, embedded software, signal processing, and commercialization into regulated or safety-sensitive environments; this is not a founder set assembled around generic SaaS growth playbooks.


    Public governance disclosure remains thinner than ideal. Vayyar''s website does not publish a full board roster, investor rights, or committee structure. What is public is a credible investor set built over multiple rounds, including Koch Disruptive Technologies, Battery Ventures, Bessemer, Regal Four, GLy Capital Management, and Atreides. Raviv Melamed was described as co-founder, CEO, and chairman in the 2019 financing release, suggesting founder-centralized strategic control. The 2022 and 2024 reporting also implies meaningful founder continuity rather than turnover-driven distress.


    Leadership expansion into Japan is one of the few visible executive additions in the public record. Vayyar opened a Tokyo office in early 2022 and appointed semiconductor executive Tomo Taguchi to lead it, explicitly targeting Japanese automotive and senior-care opportunities. That is a positive signal for local go-to-market seriousness. The core governance gap is not founder credibility but board opacity: an investor still cannot verify current board composition, observer rights, liquidation preferences, or whether the post-2024 restructuring altered executive scope.'
