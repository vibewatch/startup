      - number: '6.4'
        title: Customer Verdict and Remaining Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The customer verdict is that Vayyar has enough real-world proof to validate demand, but not enough public
              disclosure to validate customer quality at scale. The company clearly is not pre-customer: real
              organizations have integrated the technology into cars, buses, nurse-call systems, and care settings. The
              mix of automotive, care, partner, and consumer surfaces also reduces dependence on a single buyer type.
              However, the customer story remains highly dependent on partner routes and company-authored evidence. That
              makes concentration risk, repeatability, and expansion efficiency harder to judge than the raw logo list
              suggests.


              For diligence, the first customer questions should be practical rather than thematic: how many active paid
              deployments exist by segment, what percent of care accounts renew or expand, what share of automotive
              pipeline has converted to SOP, and whether any single partner or program dominates forward revenue. That
              distinction matters because adoption evidence alone is not enough to underwrite customer economics or
              concentration.
            claimRefs:
              - CU033
