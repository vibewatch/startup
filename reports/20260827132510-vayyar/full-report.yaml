              Vayyar’s customer base is best segmented by end market and route to market rather than by a single generic
              “enterprise” bucket. The main visible groups are automotive OEM and Tier-1 programs, senior-care operators
              and care channels, strategic technology partners, and the smaller Walabot / developer community. In
              automotive, the payer is typically an OEM, Tier-1, or mobility platform operator, while the end users are
              drivers, passengers, or riders. In care, operators and channel partners appear to be the buyers,
              caregivers are the daily users, and residents are the protected end beneficiaries. This segmentation
              matters because evidence quality differs sharply across segments: automotive proof is stronger on named
              partnerships than on production volume, while care proof is stronger on workflow outcomes than on pricing
              or retention.


