    title: Comparable valuation table
    enumerationScope:
      coverage: sample
      basis: >-
        This table samples the most decision-relevant public comparable and tracker anchors reviewed for Vayyar; it is
        not an exhaustive peer set or a full private-market transaction ledger.
    columns:
