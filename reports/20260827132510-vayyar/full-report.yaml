            body: >-
              Vayyar’s strongest technical differentiators are multifunctionality, privacy, wide field of view, and the
              claim that one radar endpoint can replace several traditional sensors while enabling new software-defined
              features over time. The 60 GHz cabin platform emphasizes camera-free classification of occupants across
              three rows. The 79 GHz XRR platform emphasizes 0-300m range, wide FoV, on-chip processing, and lower cost
              versus multi-chip radar or LiDAR alternatives. These are meaningful claims because they attack buyer pain
