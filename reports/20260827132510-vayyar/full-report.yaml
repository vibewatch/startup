      - number: '8.3'
        title: Scenario range and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Because Vayyar blends hardware, software, safety, and care analytics while withholding the core private
              metrics investors need, scenario discipline matters more than precise spreadsheet outputs. The bull case
              requires three things to become visible in diligence: first, that automotive references such as Toyota-,
              Aisin-, and Piaggio-linked programs convert into meaningful production revenue; second, that Vayyar Care
              behaves like a repeatable workflow product rather than isolated project revenue; and third, that 2024
              restructuring improved efficiency without damaging the platform roadmap. Under those conditions, a
              valuation back toward the upper end of the historical range can be defended. The base case assumes the
              company is real, strategically relevant, and still a unicorn, but that investors should anchor near the
              lower end of that range until revenue quality and concentration are proven. The bear case is not
              technology failure; it is that commercialization, margin, or financing evidence never catches up to the
              story. Entry discipline should therefore reward proof milestones, not just the prestige of a past headline
              round.
