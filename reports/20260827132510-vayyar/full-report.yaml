  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Vayyar's automotive and care businesses both touch regulated workflows even though the company is not
              itself a public issuer or a medical-device giant with dense disclosure. In automotive, the company
              publicly highlights AEC-Q100 qualification, ASIL-B compliance, FCC waivers, and broad safety use cases
              such as child presence detection and occupant monitoring. That matters because the product story is not
              just sensor performance; it is the ability to fit within safety, homologation, and OEM approval processes
              that can delay or block revenue. European policy adds another moving layer. The 2026 AI Act guidance
              emphasizes obligations for high-risk AI systems and AI-based safety components before market placement,
              which can lengthen documentation and customer qualification cycles even when the supplier's core hardware
              is privacy-preserving. In care, Vayyar's privacy policy and DCB0129 materials show that the company
              carries real legal and clinical-governance obligations despite its camera-free positioning. Those are
              mitigations as much as risks: they show awareness, but they also prove the business cannot scale on
              product claims alone; it must keep legal, privacy, and clinical-safety operations current across
              jurisdictions and partners.
            claimRefs:
