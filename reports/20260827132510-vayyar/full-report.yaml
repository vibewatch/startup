        - Revenue and margin remain private
        - Named production revenue and stream-level gross margin
      - - 'Thesis: still a real unicorn candidate'
        - VC Cafe and Tracxn still support ~$1B band
        - Later financing terms are not fully disclosed
        - Signed financing documents or refreshed lead-investor memo
      - - 'Anti-thesis: peak mark outran fundamentals'
        - 2024 layoffs and sparse financial disclosure
        - Could still be temporary belt-tightening
        - Proof that restructuring improved economics
      - - 'Anti-thesis: multi-vertical scope dilutes focus'
        - Broad platform across many surfaces
        - Shared core tech may still create leverage
        - Current product P&L and resource allocation by vertical
    notes: The anti-thesis is about price sensitivity and proof burden, not disbelief in the product.
