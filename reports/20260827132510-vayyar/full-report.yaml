      - number: '7.4'
        title: Capital, people, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The most investable reading of Vayyar in 2026 is not that the company lacks product credibility; it is
              that the public record does not yet prove that credibility converts into durable economics at acceptable
              risk. CTech's 2024 report that Vayyar laid off dozens of employees to reduce cash burn is the clearest
              adverse signal in the file because it shows management needed to preserve runway and sharpen focus despite
              a large historical funding base. Workable and company pages still project broad scale, but those materials
              are not substitutes for current cash, bookings, backlog, or customer concentration disclosure. People risk
              is similarly under-documented. Public pages confirm multi-office international operations and simultaneous
              projects, yet they do not disclose bench depth, program ownership, or succession plans for a reorganized
              business. That means the key thesis-breakers are operationally concrete: failure to turn marquee
              automotive references into named production revenue, inability to evidence care ROI beyond isolated case
              studies, renewed financing pressure after restructuring, or material compliance slippage in privacy,
              export, or clinical-safety workflows. Those are the thresholds that should govern diligence and price
              discipline.
