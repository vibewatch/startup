companyProfile:
  summary: >-
    Vayyar is an Israeli 4D imaging-radar company founded in 2011 and headquartered in Yehud-Monosson. It began with an
    RF-based breast-cancer screening thesis and later expanded into a multi-vertical radar-on-chip platform spanning
    automotive safety, senior care, smart building, retail, robotics, and consumer wall-scanning applications. The
    company reached unicorn status in its June 2022 Series E, and public sources still cluster around a roughly $1B
    valuation anchor in 2026, although tracker and press sources disagree on exact capital raised and whether later 2024
    financings changed the effective mark. Vayyar has credible public proof in automotive and care, including Toyota,
    Aisin, Austco, and TekTone-linked evidence, but current revenue, margin, concentration, and runway remain
    undisclosed.
