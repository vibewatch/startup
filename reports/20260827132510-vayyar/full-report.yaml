  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and What Counts
        blocks:
          - type: paragraph
            body: >-
              Vayyar's real market is best defined as privacy-preserving environmental sensing for safety, monitoring,
              and automation, not as the entire global radar market and not as the entire AI-sensor stack. The company
              sells a common radar core into several vertical wrappers — automotive in-cabin sensing, exterior ADAS /
              ARAS, senior-care monitoring, smart buildings, retail, and robotics — but the commercial logic differs by
              vertical. In automotive, the buyer cares about safety requirements, qualification, integration complexity,
              and vehicle cost. In senior care, the buyer cares about falls, hidden events, staff efficiency, occupancy,
              privacy, and integration with nurse-call workflows. In buildings and retail, the proposition becomes
              occupancy, traffic, and emergency response.


              That boundary matters because a giant undifferentiated TAM would overstate near-term monetizable demand.
              The 2024 restructuring report that Vayyar narrowed focus to smart home and automotive is useful market
              evidence: management itself appears to have decided that not every theoretical radar use case deserves
              equal go-to-market investment. The practical market for this report is therefore concentrated in
              automotive cabin / safety sensing and care-environment monitoring, with smart buildings, retail, and
              robotics as adjacent option value rather than the core underwriting base.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
