      - number: '7.2'
        title: Operational, quality, and product execution risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Vayyar looks like a company trying to monetize one radar core across several demanding
              verticals at once. The quality page is constructive — it names ISO 9001, IATF 16949, ASPICE, and ISO 26262
              — and the automotive page claims production-ready status. But those pages do not disclose field
              reliability, return rates, recall history, failure analysis metrics, or deployment-scale defect trends. In
              care, the public case studies are directionally positive yet still vendor-led: they show faster alerts,
              fewer falls, and better staffing stories at named sites, but not audited multi-site cohorts. The result is
              a classic commercialization risk profile: real proof exists, yet the evidence is skewed toward headline
              references and case studies rather than repeatable operating data. The product portfolio also remains
              broad. Corporate pages still market automotive, senior care, smart building, public safety, retail, and
              other surfaces, while post-2024 reporting says management narrowed focus to smart home and automotive.
              That mismatch does not prove failure, but it does raise execution questions about how much engineering,
              support, compliance, and channel capacity can be spread across multiple bets after restructuring.
