  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and thesis balance
        blocks:
          - type: paragraph
            body: >-
              The public evidence base for Vayyar is strong enough to justify diligence, but not strong enough to close
              an underwriting memo at face value. On the positive side, the company has built a differentiated 4D
              imaging radar platform, won credible automotive references, maintained a real care workflow with named
              channel partners, and repeatedly attracted institutional capital. Those are not the signs of a trivial
              science project. The problem is that the evidence quality drops precisely where price discipline matters
              most. Public sources do not disclose current revenue, gross margin, renewal, customer concentration, burn,
              runway, or cap-table terms. Even the funding and valuation history is not perfectly aligned across
              sources. That leaves investors with a thesis that is directionally attractive but numerically
              under-supported. The right call, therefore, is research-more / track: Vayyar looks good enough to keep in
              process and potentially invest in, but only after management supplies current financial and concentration
              data that either justifies the existing unicorn-level mark or reveals a more conservative clearing price.
            claimRefs:
