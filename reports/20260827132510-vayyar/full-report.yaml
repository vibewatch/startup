      - number: '3.4'
        title: Moat Durability and Competitive Risks
        blocks:
          - type: paragraph
            body: >-
              Vayyar's moat looks real but conditional. The company appears differentiated at the system level:
              full-cabin radar coverage, privacy-friendly sensing, and a single-chip narrative spanning cabin and
              exterior use cases. Those are meaningful advantages in specific buying situations. But the moat is not
              absolute. Large semiconductor vendors can commoditize radar hardware over time, camera players can solve
              enough of the interior-sensing job for some programs, and OEMs or Tier-1s can internalize more stack
              integration than Vayyar would like.


              Accordingly, the durable moat is not “better radar” in the abstract. It is a combination of validated
              safety use cases, partner access, regulatory alignment, and evidence that OEMs prefer Vayyar's
              architecture in real deployments. The main adverse competitor evidence is not a scandal at Vayyar; it is
              the public scale, channel power, and disclosure advantage that rivals already possess. Until Vayyar
              discloses production volumes, design-win count, or win-rate data, competitive ranking remains
              directionally favorable in niche use cases but not conclusively dominant overall.
