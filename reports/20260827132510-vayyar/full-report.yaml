      - number: '8.4'
        title: Final diligence asks and kill triggers
        blocks:
          - type: paragraph
            body: >-
              The decisive next step is not more category enthusiasm. It is a data room. Vayyar now needs to prove that
              its strongest public signals are backed by private operating quality: current ARR or revenue by stream,
              gross margin by stream, the share of revenue tied to automotive versus care, concentration among top
              programs, retention or renewal behavior, present cash and runway, and the structure of any 2024 or later
              financing. Without that evidence, investors are effectively choosing between competing narratives from
              trackers, press, and company marketing. That is not sufficient for a confident buy recommendation. The
              thesis-break triggers are equally concrete. A weak or highly structured financing round, another
              restructuring, continued inability to disclose production revenue from automotive, or care economics that
              remain anecdotal would all push the call toward pass or deep discount. By contrast, if management shows
              durable recurring economics, clean compliance posture, and diversified program conversion, the company
              could justify valuation support closer to or above the current unicorn band.
