      - number: '1.5'
        title: Coverage Gaps, Unsupported Metrics, and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              The biggest limitation of the public record is not product ambiguity but financial opacity. Vayyar does
              not publicly disclose revenue, gross margin, customer count, shipment volumes, renewal rates, or segment
              mix. Even on scale, the best available signals are directional rather than definitive: official pages
              prove geographic presence and platform breadth, while external coverage suggests headcount compression
              after restructuring. For an investor, this means basic proof points such as ARR quality, design-win
              conversion, and multi-vertical revenue concentration remain open diligence items rather than externally
              verified facts.


              The accessible adverse evidence is meaningful. The late-2024 CTech report says Vayyar laid off dozens of
              employees to reduce cash burn and sharpen focus on smart home and automotive. That does not invalidate the
              company's technology; it does, however, weaken any thesis that Vayyar had already solved commercial
              scaling across all of its original verticals. The disputed October 2024 financing entry is another warning
              signal because it implies either under-disclosed capital raising or noisy secondary-database maintenance,
              neither of which helps transparency.


              There are also more benign gaps. Vayyar's board roster is not public, the company does not disclose
              secondaries or debt facilities, and the public evidence is insufficient to decide whether the consumer
              Walabot line is strategically meaningful or mostly a legacy brand. The correct takeaway for later chapters
              is therefore mixed: the company has real technology, real partners, and real regulatory progress, but the
              public data needed to underwrite economics or governance quality is still incomplete.
            claimRefs:
              - CO022
              - CO023
              - CO024
              - CO026
              - CO028
              - CO038
              - CO039
