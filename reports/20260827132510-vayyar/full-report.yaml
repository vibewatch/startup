      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Vayyar's buyer map is fragmented, which is both an opportunity and an execution burden. In automotive, the
              likely direct commercial customer is an OEM or Tier-1 supplier, while the end user is the driver,
              passenger, or fleet operator and the payer is embedded inside the vehicle bill of materials. Sales cycles
              are therefore slow, design-in oriented, and heavily dependent on qualification and safety proof. Toyota
              Connected's Cabin Awareness concept and the Aisin relationship show how Vayyar can enter through
              innovation, software, or Tier-1 channels before broad vehicle-program rollouts.


              In senior care, the buyer is typically a care-home operator, nurse-call vendor, or health-system
              procurement lead; the user is the caregiver; the subject being monitored is the resident or patient; and
              the payer may be the operator, provider, or facility owner. Austco and TekTone matter here because they
              reduce the integration burden by embedding Vayyar into existing nurse-call and emergency-call systems.
              Vayyar's own care materials push occupancy, move-ins, care-level clarity, hidden-fall capture, and staff
              efficiency as buying triggers.


              Buildings, retail, and robotics have a different adoption path again: facility managers, analytics owners,
              or OEMs evaluate sensing value against lower-stakes budgets, which can enable pilots but may also create
              weaker urgency than auto regulation or care safety events.
