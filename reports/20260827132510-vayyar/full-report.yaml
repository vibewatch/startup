  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Direct Peers, Incumbents, and Substitutes'
        blocks:
          - type: paragraph
            body: >-
              Vayyar does not face a single competitor class. In automotive radar, it competes against semiconductor
              incumbents such as TI, NXP, and Infineon as well as specialist radar players such as Arbe and Uhnder. In
              the cabin, it also competes indirectly against camera-centric interior-sensing vendors such as Smart Eye
              and Seeing Machines. The substitute set matters because an OEM choosing cabin safety can solve parts of
              the job with cameras, simpler presence sensing, or existing Tier-1 stacks rather than Vayyar's radar
              specifically.


              Vayyar's own positioning emphasizes privacy, multifunctionality, and single-chip breadth. That sits
              closest to specialist radar challengers on technology narrative, but the commercial battlefield is more
              uneven: incumbents control broader chip portfolios and established channels, while camera players can
