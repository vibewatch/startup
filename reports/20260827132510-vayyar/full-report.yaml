        title: Financial Verdict and Remaining Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The balanced financial verdict is that Vayyar has enough public commercial proof to justify diligence, but
              not enough to close a serious investment memo. Care case studies and partner integrations make it
              believable that the product creates operational value. Automotive proof points show the company has
              credible access to real safety programs. Historical fundraising confirms investors have repeatedly
              financed the story. But the public package still stops short of underwriteable financial disclosure. There
              is no published revenue, no stream mix, no disclosed gross margin, no customer concentration, no burn, no
              runway, and no public explanation of whether the post-2024 strategy reset improved efficiency.


              That leaves diligence focused on conversion and quality. Investors need to know how many deployments or
              design wins have converted into recurring or repeatable gross profit, whether care revenue behaves like
              equipment sales or software-like ARR, and whether automotive wins are concentrated in a small number of
              programs. Until then, the headline conclusion is that Vayyar’s business model looks commercially credible,
              but its capital efficiency and near-term financing dependency remain unresolved.
