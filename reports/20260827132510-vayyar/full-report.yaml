      - number: '6.3'
        title: Retention, Expansion, and Concentration Readout
        blocks:
          - type: paragraph
            body: >-
              Retention and durability are the weakest public parts of the customer story. Vayyar does show evidence of
              ongoing use at named sites, integration into existing workflows, and software/reporting features that
              could support expansion. Essex cites a phased deployment; Sambrook and Denham describe ongoing review of
              alerts and reports; Austco and TekTone frame Vayyar as a platform enhancement to broader installed bases.
              These are positive signs because they suggest Vayyar can move beyond a one-off hardware shipment into
              embedded operating workflows.


              Still, none of the reviewed public sources disclose GRR, NRR, renewal rates, contract length, churn, or
              top-customer concentration. Even the strongest named proofs do not cleanly answer whether Vayyar wins
              expand because customers love the product, because partners pull it through, or because regulation pushes
              adoption. Investors should therefore view durability as plausible but not yet underwritten.
            claimRefs:
