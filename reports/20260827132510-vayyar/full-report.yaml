      - number: '4.2'
        title: Pricing Visibility and Unit-Economics Proxies
        blocks:
          - type: paragraph
            body: >-
              Public pricing transparency is extremely limited. Walabot’s $179.95 consumer price is visible, but Vayyar
              does not publish automotive program ASPs, care-room pricing, software attach rates, implementation fees,
              or support terms. As a result, the best public clues come from what the product does and how customers
              describe deployments. In care, Vayyar markets occupancy, length-of-stay, and staff-efficiency benefits,
              while partner pages emphasize integration with existing nurse-call systems and reduced alarm fatigue. Case
              studies claim better response times, lower fall counts, and fewer hospitalizations, which all support
              willingness to pay. But they do not reveal whether economics accrue as one-time hardware, annual licenses,
              monitored-service fees, or blended contracts.


              Hardware comparables underscore how sensitive the model likely is to volume and scale. Texas Instruments’
              automotive semiconductor business throws off strong margins at scale, while specialist sensor company
              Ouster still reports far lower gross margin and net losses. Vayyar’s own path is probably somewhere in
              between, but the public record is insufficient to know where. The underwriting implication is simple:
              revenue quality is visible, margin quality is not.
