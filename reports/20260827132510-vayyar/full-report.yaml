      - number: '8.2'
        title: Valuation context and comparable set
        blocks:
          - type: paragraph
            body: >-
              The best public read on valuation context is a band, not a point estimate. VC Cafe still places Vayyar in
              the $1B bucket as of July 2026, while Tracxn records the June 2022 Series E as a $108M round at a $1B
              post-money valuation. By contrast, 2022 CTech coverage described the same financing as taking Vayyar above
              $1.5B after money, and startupim later listed $323M total funding plus a $25M September 2024 Series F and
              an undisclosed October 2024 round. That combination strongly suggests the company has had more financing
              activity than the simplest 2022-unicorn narrative, but not enough public disclosure to establish a clean
              live mark. Public comparables help frame the envelope. Ouster and Ambarella trade above $2.5B and $3B
              respectively with disclosed public-market metrics, while indie Semiconductor sits near $0.9B and Arbe far
              lower. Vayyar at around $1B is therefore not absurd on relative scale, but it is still a demanding
              valuation for a private company that does not disclose the revenue or margin base needed to justify
              public-comparable carryover.
