      - number: '5.2'
        title: Architecture and Developer Workflow
        blocks:
          - type: paragraph
            body: >-
              The architecture Vayyar describes is consistent across pages. A highly integrated radar-on-chip combines
              analog and digital RF components with on-chip DSP and MCU resources. That hardware produces rich 4D
              point-cloud data, while low-level radar algorithms and in-house multilayered software connect raw
              electromagnetic signals to image processing, machine learning, and customer applications. For partners,
              the company’s most important interface is the API layer: Vayyar repeatedly says customers can develop over
              the point-cloud output without needing deep radar expertise.


              This architectural stance creates two benefits. First, it compresses the partner-development burden by
              shipping reference designs, low-level algorithms, and ready-to-use software-hardware platforms. Second, it
              allows Vayyar to sell a technically difficult core while letting customers or partners extend use cases.
              The Walabot API and SDK are the clearest public proof that Vayyar has historically exposed
              developer-facing tooling. But the public developer surface for the core automotive platform is thin:
              Vayyar’s public GitHub footprint is minimal, so most technical depth is visible through marketing pages,
              API references, and partner statements rather than through active open-source collaboration.
