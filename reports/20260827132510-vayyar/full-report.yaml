            body: >-
              Deployment and support are as important as the silicon story. Vayyar’s care stack requires physical sensor
              placement, power, room-coverage assumptions, integrations into nurse-call or care systems, and ongoing
              software updates. Automotive surfaces show similar operational packaging: compact PCBs, tested reference
              designs, functional-safety posture, and regulatory alignment. The company’s quality page explicitly ties
              its operating model to ISO 9001, IATF 16949, ASPICE, and ISO 26262, while care materials add
              privacy-by-design claims and the DCB0129 clinical-safety milestone.


              The practical interpretation is that Vayyar is selling a technical platform plus deployment discipline,
              not just a chip. That increases credibility, but it also creates dependencies on manufacturing,
