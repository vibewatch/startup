  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Weak financing quality
        - Down round, structure-heavy preference stack, or punitive bridge
        - Confirms capital stress and shrinks upside
        - Reprice or pass
      - - Automotive non-conversion
        - No clear production-revenue proof from marquee programs
        - Breaks biggest scale argument
        - Cut bull case and widen discount
      - - Care economics remain anecdotal
        - No renewal, retention, or ROI cohort evidence
        - Reduces repeatability of second core vertical
        - Treat care value as strategic but unproven
      - - Another restructuring
        - Material additional layoffs or product retrenchment
        - Signals commercialization still not catching up to spend
        - Pause until new operating plan is reviewed
      - - Compliance problem surfaces
        - Material privacy, safety, export, or clinical-governance issue
        - Raises both risk discount and time-to-close
        - Shift to research-more / no-go until resolved
    notes: These triggers are intended for investment decision control, not as predictions that the events will occur.
    claimRefs:
      - CV017
      - CV023
      - CV029
      - CV034
      - CV040
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Revenue quality
        - Current revenue by stream, ARR-like components, gross margin by stream
        - Determines whether public comps are usable
        - CFO / finance data room
      - - Customer concentration
        - Top-10 customers, OEM/Tier-1 mix, program revenue, renewal status
        - Shows whether marquee logos equal durable economics
        - Sales ops + customer success export
      - - Capital adequacy
        - Cash, burn, runway, covenant/debt data, 2024-2026 financing terms
        - Sets downside risk and urgency
        - Board deck and financing documents
      - - Cap table / preferences
        - Liquidation preferences, seniority, option pool, secondary activity
        - Needed for actual return math
        - Legal counsel and cap-table model
      - - Compliance and claims support
        - Clinical-safety pack, privacy/security artifacts, product qualification evidence
        - Prevents valuation from overstating unverified readiness
        - Legal / QA / product diligence
    notes: If management cannot satisfy most of these asks, the right action is wait, not optimism.
    claimRefs:
      - CV023
      - CV033
      - CV034
      - CV035
