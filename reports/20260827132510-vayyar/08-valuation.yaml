  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue, margin, and concentration
    missingEvidence: Current revenue by stream, gross margin by stream, customer concentration, renewal behavior, and production-revenue contribution from flagship automotive programs.
    whyItMatters: These are the core inputs required to map public proof into valuation support.
    diligencePath: Request audited or board-level revenue bridge, cohort gross-margin detail, and top-customer concentration report.
    relatedQuestionRefs:
    - QV012
    - QV013
    - QV016
    - QV030
    relatedTableRefs:
    - TV001
    - TV004
    - TV006
  - type: private-evidence-only
    severity: material
    topic: capital adequacy and financing terms
    missingEvidence: Current cash, monthly burn, runway, debt/covenants if any, 2024-2026 financing documents, and whether any new capital included structure-heavy preferences.
    whyItMatters: The 2024 layoff signal turns financing quality into a direct valuation driver.
    diligencePath: Request board cash bridge, financing term sheets, cap table, and downside operating plan.
    relatedQuestionRefs:
    - QV003
    - QV018
    - QV024
    - QV029
    relatedTableRefs:
    - TV003
    - TV005
    - TV006
  - type: conflicting-data
    severity: material
    topic: public valuation and funding inconsistency
    missingEvidence: A management-confirmed financing history reconciling total raised, post-money marks, and whether later rounds were priced, extension capital, or undisclosed structures.
    whyItMatters: Without reconciliation, investors may over-anchor on whichever tracker is most flattering.
    diligencePath: Obtain CFO-certified financing table and lead-investor confirmation for the latest priced round and any later financings.
    relatedQuestionRefs:
    - QV001
    - QV002
    - QV004
    - QV006
    relatedTableRefs:
    - TV001
    - TV004
  - type: enumeration-incomplete
    severity: minor
    topic: comparable and channel population completeness
    missingEvidence: Full peer set, all customer/channel relationships, and the complete list of current strategic programs by stage.
    whyItMatters: A public-source sample can overweight the most visible success stories and understate hidden concentration.
    diligencePath: Request management pipeline export, peer deck, and channel contribution analysis.
    relatedQuestionRefs:
    - QV009
    - QV019
    - QV030
    relatedTableRefs:
    - TV002
    - TV004
    - TV006
