- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: sample
    basis: This table samples the most decision-relevant public comparable and tracker anchors reviewed for Vayyar; it is not an exhaustive peer set or a full private-market transaction ledger.
  columns:
  - Comparable
  - Observed metric
  - Multiple / valuation
  - Relevance
  - Limitation
  rows:
  - - Vayyar public tracker band
    - VC Cafe and Tracxn anchors
    - ~$1.0B current public anchor; older 2022 coverage as high as ~$1.5B+
    - Direct subject-company valuation references
    - Private marks conflict and may lag current fundamentals
  - - Ouster
    - Public lidar/sensor company
    - ~$2.63B market cap; 12.62x PS; 11.43x EV/S
    - Shows sensor market can support premium public values
    - Different mix, public liquidity, and disclosed financials
  - - Ambarella
    - Public edge vision silicon
    - ~$3.12B market cap; 7.74x PS; 7.08x EV/S
    - Helpful for disclosed silicon + perception valuation context
    - Broader software/video heritage and public market profile
  - - indie Semiconductor
    - Public automotive/edge silicon
    - ~$0.90B market cap; 3.91x PS; 5.18x EV/S
    - Closest current public-value band to Vayyar’s unicorn anchor
    - Still not a clean radar-only analogue
  - - Arbe Robotics
    - Public imaging-radar specialist
    - ~$82M market cap; 43.80x PS; 35.41x EV/S
    - Useful warning that early radar equities can trade on tiny revenue bases
    - Very small scale and volatile metrics reduce transferability
  notes: Comparable metrics are public-market snapshots as of the 2026-08-27 research anchor and should be used only as directional brackets.
