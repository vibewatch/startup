- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Assumptions
  - Valuation / return logic
  - Probability signal
  - Downside trigger
  rows:
  - - Bull
    - Automotive production ramps, care renewals look durable, margins improve after restructuring
    - $1.3B-$1.6B supportable if recurring economics and concentration are clean
    - Needs management evidence, not just partner logos
    - Any weak financing or stalled SOP proof breaks the case
  - - Base
    - Company is real and strategically relevant, but economics remain only partly visible
    - $0.8B-$1.2B best fits current public support
    - Most consistent with tracker and press blend
    - If private data disappoints, band moves down
  - - Bear
    - Automotive conversion is slower, care economics stay anecdotal, capital raises get harder
    - $0.5B-$0.8B or structured financing risk
    - Triggered by opacity persistence plus renewed cost pressure
    - Another layoff cycle or punitive financing terms
  - - No-go / wait
    - Management cannot resolve revenue, margin, runway, or cap-table gaps
    - Return math cannot be defended
    - Evidence quality fails underwriting threshold
    - Pause process until data room is available
  notes: Ranges are illustrative private-value bands in USD, meant to show decision sensitivity rather than false precision.
