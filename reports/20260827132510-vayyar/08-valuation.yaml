chapter:
  number: 8
  title: Valuation
  summary: Vayyar merits a research-more / track stance rather than a clean buy because the company has credible product and customer proof but insufficient public evidence to underwrite the price with precision. The best current public valuation anchor is about $1.0B, while older 2022 coverage pointed to a $1.5B+ post-money peak and newer trackers disagree on whether later financings reset or merely supplemented that mark. Public comps show that successful sensor and edge-silicon companies can support billion-dollar values, but they also show that the spread between strong markets and weak commercialization is wide. Without current revenue, gross margin, retention, concentration, and cap-table terms, Vayyar should be priced as an evidence-sensitive private hardware/software platform with meaningful upside only if management proves durable economics beyond marquee references.
sections:
- id: recommendation-and-thesis-balance
  title: Recommendation and thesis balance
  body: 'The public evidence base for Vayyar is strong enough to justify diligence, but not strong enough to close an underwriting memo at face value. On the positive side, the company has built a differentiated 4D imaging radar platform, won credible automotive references, maintained a real care workflow with named channel partners, and repeatedly attracted institutional capital. Those are not the signs of a trivial science project. The problem is that the evidence quality drops precisely where price discipline matters most. Public sources do not disclose current revenue, gross margin, renewal, customer concentration, burn, runway, or cap-table terms. Even the funding and valuation history is not perfectly aligned across sources. That leaves investors with a thesis that is directionally attractive but numerically under-supported. The right call, therefore, is research-more / track: Vayyar looks good enough to keep in process and potentially invest in, but only after management supplies
    current financial and concentration data that either justifies the existing unicorn-level mark or reveals a more conservative clearing price.'
