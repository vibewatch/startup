  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: manufacturing and supply-chain setup
    missingEvidence: Contract manufacturing model, foundry/packaging dependencies, yield or warranty data, and production QA metrics.
    whyItMatters: A hardware platform can sound excellent technically while still failing on manufacturability, cost, or quality in production.
    diligencePath: Request manufacturing map, key suppliers, yield trends, field returns, and warranty reserve history.
    relatedQuestionRefs:
    - QE016
    - QE024
    relatedTableRefs:
    - TE003
    - TE004
  - type: missing-source
    severity: material
    topic: public security and privacy documentation depth
    missingEvidence: Dedicated public security architecture, penetration-testing evidence, data-retention policies, and privacy impact documentation beyond marketing copy.
    whyItMatters: Privacy-by-design is a major selling point; investors need proof of operational controls, not only camera-free positioning.
    diligencePath: Request security whitepaper, privacy documentation, DPA, and incident-response materials.
    relatedQuestionRefs:
    - QE019
    - QE022
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: field reliability and false-positive performance
    missingEvidence: False-positive / false-negative rates, recall history, incident logs, MTBF, and customer support burden metrics.
    whyItMatters: Technical differentiation matters less if real-world reliability creates customer or safety friction.
    diligencePath: Request field-performance dashboards, escalation logs, and customer quality scorecards.
    relatedQuestionRefs:
    - QE021
    - QE023
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: minor
    topic: active public developer community around core automotive stack
    missingEvidence: Broader public repo activity, forums, release cadence, or external contributor signal around core Vayyar automotive tooling.
    whyItMatters: Thin public developer signal does not disprove technical strength, but it reduces external validation of interfaces and adoption.
    diligencePath: Request SDK adoption metrics, API customers, and examples of partner-developed applications.
    relatedQuestionRefs:
    - QE008
    - QE009
    - QE010
    relatedTableRefs:
    - TE001
