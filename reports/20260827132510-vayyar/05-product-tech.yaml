    - Faster response through existing handsets / workflows
    - Support ownership across partners can be blurry
  - - Build sensing applications as a developer / researcher
    - Custom RF hardware and signal-processing stack
    - Walabot SDK or Vayyar API plus reference designs
    - Lower development burden and faster experimentation
    - Public code ecosystem is thin
  notes: The workflow table focuses on what the customer is trying to get done, not only on what Vayyar says its chips can do.
