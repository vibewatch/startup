chapter:
  number: 5
  title: Product & Technology
  summary: 'Vayyar looks more like a shared radar-platform company than a single-product vendor: the same radar-on-chip, embedded compute, and point-cloud software stack is repackaged for automotive, care, consumer, and developer surfaces. The platform story is technically credible and commercially thoughtful, but independent proof is thinner than the company’s ambition, especially around public developer activity, field reliability, cybersecurity detail, and manufacturing maturity.'
sections:
- id: portfolio-and-modules
  title: Product Lines and Module Map
  body: 'Vayyar’s product set is not a single SKU. It is a shared radar-on-chip and software platform that branches into multiple end-market packages: 60 GHz in-cabin automotive sensing, 79 GHz exterior ADAS / ARAS sensing, Vayyar Care, Walabot consumer devices, and historical medical, robotics, and smart-building use cases. The common theme is not a single app but a common technical stack: RF hardware, signal processing, point-cloud generation, embedded compute, and application-layer software. That matters because the product story is partly one of platform reuse. Vayyar repeatedly argues that one multifunction sensor can replace several narrower sensors and then expose data for partner-developed applications.


    The product thesis is strongest where platform reuse lowers buyer complexity. In automotive, the claim is fewer sensors, fewer ECUs or external processors, and better cabin or exterior coverage. In care, the claim is continuous monitoring without cameras or wearables. In Walabot, the platform is repackaged for direct developer or consumer use. The portfolio is therefore broad, but its public maturity is uneven and most evidence remains company-authored rather than benchmarked by neutral technical datasets.'
