- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Radar-on-chip RF hardware
    - Captures RF signals and hosts core compute
    - Silicon design, manufacturing, packaging
    - Hardware defects or supply bottlenecks hit every product line
  - - MIMO antenna array
    - Resolution and field-of-view driver
    - Board design and installation geometry
    - Performance can degrade if installation assumptions fail
  - - DSP / MCU on chip
    - Runs low-level signal and image processing
    - Embedded software and thermal / power constraints
    - On-chip limits may shape extensibility and performance
  - - Low-level radar algorithms
    - Convert raw signal into usable sensing primitives
    - In-house algorithm quality
    - Algorithm errors can create false alerts or missed detections
  - - Point-cloud / API layer
    - Lets partners build use cases without radar expertise
    - Developer documentation and stable interfaces
    - Thin public community means lower outside validation
  - - Application and ML layer
    - Supports classification, alerts, analytics, and future features
    - Customer data, tuning, and integration work
    - Customer-specific behavior may require heavier support than marketing implies
  notes: The architecture is more specific than generic “AI + sensor” marketing because Vayyar repeatedly describes the chip, point cloud, API, and application layering.
