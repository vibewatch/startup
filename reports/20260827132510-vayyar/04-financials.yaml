tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Who pays
  - Mechanism
  - Public proof
  - Quality
  - Diligence ask
  rows:
  - - Automotive OEM / Tier-1 programs
    - OEMs, Tier-1s, mobility partners
    - Radar hardware plus embedded software into in-cabin, CPD, ARAS, and ADAS programs
    - Official automotive pages, Series E post, Toyota/Aisin references
    - Strategically important but commercially opaque
    - Request SOP schedule, per-program ASP, software attach, and top-program revenue share
  - - Vayyar Care room deployments
    - Care operators, providers, councils, channel partners
    - Installed radar units plus fall alerts, analytics, workflow integration, and support
    - Care product pages plus Essex, Denham, Stowford, and Sambrook case studies
    - Best public value evidence; pricing still opaque
    - Request contract structure, annual recurring software share, and churn/renewal data
  - - Channel-partner integrations
    - Austco, TekTone, and similar distributors/integrators
    - Joint selling through nurse-call and communications platforms
    - Austco and TekTone partner announcements
    - Potential leverage for lower CAC but margin-sharing unknown
    - Request partner margin split, pipeline contribution, and implementation ownership
  - - Consumer Walabot
    - DIY consumers / contractors
    - Direct e-commerce hardware sale
    - Walabot site shows live pricing
    - Visible but likely non-core to current thesis
    - Request revenue share, attach rate, and current strategic priority
  - - Research / development kits
    - Researchers, universities, RF developers
    - Development kit sale with API access and discounts
    - Mini-Circuits / Vayyar EVK post
    - Useful monetization edge, probably niche
    - Request annual unit sales and gross margin profile
  - - Strategic / international collaborations
    - JV or program counterparties
    - Could include localized commercialization or co-development economics
    - Haier/Amazon/Piaggio milestones suggest commercial relationships
    - Exists, but accounting treatment is unclear
    - Request whether revenue is recognized as product, service, royalty, or joint-venture income
  notes: The public record proves multiple monetization paths but does not quantify revenue mix or how much of each stream is recurring versus one-time.
