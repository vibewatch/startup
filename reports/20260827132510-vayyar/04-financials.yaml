- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Consumer list price
    - Walabot regular price $179.95
    - Medium
    - Shows Vayyar can transact direct and package hardware for retail
    - Request gross margin and annual units by Walabot SKU
  - - Care operator ROI claim
    - Up to $250k extra annual benefits for an average community
    - Medium
    - Suggests willingness-to-pay and operator ROI framing
    - Request methodology, base assumptions, and realized customer outcomes
  - - Care deployment outcome evidence
    - Essex cites >316 sensors, >435 beneficiaries, zero hospital admissions / long lies in participating properties
    - Medium
    - Supports commercial relevance and buyer ROI story
    - Request contract value, payback period, and phase-two economics
  - - Installation footprint
    - One device covers up to 16m² / 169ft² with power and install requirements
    - Medium
    - Implies hardware count per room and deployment labor burden
    - Request BOM, install minutes, and gross margin by site type
  - - Public margin comparator band
    - TI gross margin 58.1%; Ouster gross margin 36%
    - High
    - Frames plausible spread for radar/sensor hardware outcomes at scale versus specialty volume
    - Request Vayyar gross margin by product line and how far it is from target state
  - - Inventory / working capital analogue
    - TI inventory $4.53B and 241 days at scale; Vayyar discloses none
    - Medium
    - Shows sensor businesses can absorb meaningful working-capital risk
    - Request Vayyar inventory days, warranty reserve, and purchase commitments
  - - Private core metrics
    - Revenue, ARR, CAC, payback, NRR, customer concentration, runway not public
    - High
    - These determine financial quality more than headline funding
    - Request monthly management accounts and board KPI pack
  notes: This table deliberately separates public proof from management-only data. The main blocker is not absence of product value; it is absence of realized economic disclosure.
