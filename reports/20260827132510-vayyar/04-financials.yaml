chapter:
  number: 4
  title: Financials
  summary: 'Public evidence supports a multi-stream hardware-plus-platform business, but the numbers that matter most for underwriting—revenue, gross margin, burn, runway, and concentration—remain private. The clearest financial signal is not disclosed topline but the 2024 restructuring: despite roughly $300M+ historically raised, Vayyar still needed to cut cash burn and narrow focus, implying capital adequacy depends on turning automotive and care traction into higher-quality, scalable gross profit.'
sections:
- id: revenue-model
  title: 'Revenue Model: Multiple Streams, Uneven Disclosure'
  body: 'Vayyar clearly has more than one way to make money, but it does not publicly break out what matters most. The strongest visible streams are automotive B2B programs, Vayyar Care deployments, a smaller consumer Walabot business, and development-kit sales for researchers. Automotive appears to be a classic design-win model: the company sells radar hardware and software into OEM or Tier-1 safety programs, then waits for qualification and production ramps. Care looks different. The company markets an installed monitoring system that integrates into nurse-call and care workflows, which implies hardware revenue up front plus software, analytics, support, and integration economics over time. Walabot provides the only clean public list price, but it is more useful as proof that Vayyar can transact directly than as evidence of the company’s core economics.


    The financial reading is therefore mixed. Revenue-stream breadth is a strength because it diversifies end markets and creates multiple commercialization paths. But disclosure quality is weak exactly where investors need it most: realized pricing, contribution margin by stream, customer concentration, and what share of gross profit comes from automotive versus care versus consumer activity.'
