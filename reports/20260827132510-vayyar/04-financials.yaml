- id: TI004
  title: Capital adequacy table
  columns:
  - Dimension
  - Public evidence
  - Current read
  - Implication
  - Diligence ask
  rows:
  - - Historical capital raised
    - Official history + Series E post + trackers place cumulative funding around $296M-$323M
    - Well funded historically
    - Not a bootstrapped story; investors have repeatedly financed growth
    - Request cap table, round chronology, and current cash balance
  - - Latest clearly official round
    - $108M Series E announced June 2022
    - Last fully official major raise is now mature
    - Time since last clearly official raise raises importance of burn discipline
    - Request post-Series-E cash bridge to present
  - - Late-2024 financing ambiguity
    - startupim lists $25M Series F and Oct 2024 undisclosed round; official corroboration not surfaced
    - Possible additional capital, but weakly corroborated
    - Headline funding totals may be stale or inconsistently classified
    - Request signed financing documents and board approvals
  - - Burn signal
    - CTech reports layoffs to significantly reduce cash burn and narrow focus
    - Adverse but informative
    - Management was optimizing sustainability, not simply growing at all costs
    - Request pre/post-restructuring burn and savings realized
  - - Capital intensity
    - Hardware qualification, installs, support, and inventory all imply up-front cash needs
    - Likely meaningful
    - Capital adequacy depends on conversion speed, not only cumulative money raised
    - Request working-capital forecast and supply commitments
  - - Debt / project finance
    - No public debt facility or project-finance disclosure found in reviewed materials
    - Probably limited or undisclosed
    - Absence of public debt is not proof of no obligations
    - Request debt schedule, leases, and contingent liabilities
  notes: Company Overview holds the full round chronology; this table focuses on whether the public evidence is enough to judge forward cash adequacy. It is not.
