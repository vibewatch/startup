- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Why it matters
  - Public substitute
  - Impact
  - Diligence path
  rows:
  - - Revenue by segment
    - Determines whether care, automotive, or consumer actually drives the business
    - Case studies and product pages only
    - Cannot judge quality or concentration of revenue
    - Request last 12 quarters by segment and geography
  - - Realized pricing / ASP
    - Needed to assess competitiveness and gross profit
    - Walabot list price and qualitative cost-efficiency claims
    - Public price data is weakest in the core business
    - Request price waterfall and top-20 deal sheets
  - - Gross margin by product line
    - Separates strategic promise from unit economics reality
    - Comparator filings from TI and Ouster
    - Cannot know if scale is already attractive or still deeply negative
    - Request GM bridge by stream and warranty / install burden
  - - Cash, burn, and runway
    - The central capital adequacy test
    - Historical funding totals and layoff signal
    - Impossible to underwrite financing risk cleanly
    - Request monthly burn, current cash, and downside runway case
  - - Customer concentration
    - Determines fragility of the automotive and care base
    - Partner logos and case studies
    - Logo proof is not revenue proof
    - Request top-10 customer concentration and pipeline by stage
  - - Working capital / inventory commitments
    - Hardware businesses can consume cash before revenue recognition
    - Install requirements and public hardware comparables
    - Cannot model cash conversion cycle
    - Request inventory days, supplier terms, and purchase obligations
  notes: This is the main diligence bottleneck. Public materials are adequate for thematic interest but not for investment-grade financial underwriting.
