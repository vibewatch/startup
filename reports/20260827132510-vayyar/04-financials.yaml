- id: capital-adequacy
  title: 'Capital Adequacy: Funded, But Still Cash-Burn Sensitive'
  body: 'Historically, Vayyar has raised real venture-scale capital. The company’s own history page records early rounds of $12M, $22M, $45M, and $109M before the officially announced $108M Series E. Third-party trackers then diverge: some place cumulative funding near $296M to $300M, while startupim lists $323M and an additional late-2024 financing event. That disagreement matters less than the operational signal from late 2024. CTech reported layoffs affecting dozens of employees specifically to reduce cash burn and refocus the company on smart home and automotive. In other words, large cumulative funding did not remove the need to conserve capital.


    What investors can infer is that Vayyar remains a capital-aware hardware company. Automotive qualification cycles are long, care deployments require installation and support, and hardware businesses often absorb working-capital and inventory risk before revenue fully matures. What investors cannot infer from public sources is the number that decides urgency: cash on hand versus monthly burn. Until management discloses runway, or diligence supplies board materials and cohort economics, capital adequacy remains plausible but unproven from outside evidence alone.'
