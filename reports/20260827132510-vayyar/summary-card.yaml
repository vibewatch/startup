  topStrengths:
    - >-
      Shared 4D imaging-radar platform spans automotive and care with a genuine privacy-preserving differentiation
      relative to camera-heavy alternatives.
    - >-
      Public customer and partner proof is real: Toyota, Aisin, Austco, TekTone, and named care sites show the
      technology has moved beyond lab-only positioning.
    - >-
      Historical fundraising and lead-investor continuity indicate that sophisticated backers repeatedly financed the
      platform through multiple stages.
    - >-
      Automotive qualification language and care clinical-safety positioning suggest Vayyar understands the regulatory
      and workflow constraints of its highest-value markets.
  topRisks:
    - >-
      Revenue, margin, renewal, and customer-concentration data remain private, so investors cannot independently
      determine whether public traction actually supports the current valuation.
    - >-
      The 2024 layoff and burn-reduction signal raise the possibility that commercialization has not yet compounded
      quickly enough to de-risk capital adequacy.
    - >-
      Care workflows depend on Amazon and nurse-call partners, while automotive upside depends on a relatively small set
      of flagship OEM or Tier-1 programs.
    - >-
      The public valuation record is internally inconsistent, with sources spanning roughly $1B current anchors, older
      ~$1.5B peak narratives, and ambiguous later 2024 financing activity.
  unresolvedGaps:
