  topStrengths:
    - 共用的 4D 成像雷达平台横跨汽车和照护，相比重度依赖摄像头的方案，确实有隐私保护差异化。
    - 公开客户和合作伙伴证据是真实的：Toyota、Aisin、Austco、TekTone 以及具名照护场所显示，这项技术已经不只是实验室定位。
    - 历史融资和领投方连续性说明，成熟投资人多轮持续为平台输血。
    - 汽车认证表述和照护临床安全定位显示，Vayyar 理解最高价值市场里的监管和工作流约束。
  topRisks:
    - 收入、利润率、续约和客户集中度数据仍属私有，投资人无法独立判断公开进展是否真的撑得住当前估值。
    - 2024 年裁员和降烧钱信号说明，商业化可能还没有足够快地复利增长，资本充足性风险仍未解除。
    - 照护工作流依赖 Amazon 和护士呼叫系统伙伴；汽车上行空间则取决于相对少数旗舰 OEM 或 Tier-1 项目。
    - 公开估值记录内部并不一致：资料横跨约 $1B 的当前锚点、较早的约 $1.5B 峰值叙事，以及后续 2024 年融资活动的模糊信息。
  unresolvedGaps:
    - 按业务流拆分的当前收入、毛利率和客户集中度未披露。
    - Vayyar Care 的留存、续约和队列级 ROI 数据没有公开来源。
    - 当前现金余额、烧钱速度、现金跑道，以及任何 2024-2026 年融资条款质量仍未知。
    - 股权结构表优先级、清算优先权、老股交易活动和稀释条款未公开。
    - 公开来源无法对齐确切累计融资额，也无法说明后续 2024 年轮次是否改变估值。
