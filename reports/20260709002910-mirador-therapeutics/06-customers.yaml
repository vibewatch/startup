- id: durability-retention-and-concentration
  title: Durability, retention, and concentration
  body: 'Every classic customer-durability metric is missing from public view. Mirador discloses no NRR, GRR, churn, renewal, contract duration, cohort behavior, or satisfaction scores. That is expected for a private pre-commercial biotech, but it also means there is no public way to tell whether counterparties return, whether sites expand, or whether any one partner dominates relationship quality. The current public relationship set is effectively binary: financing counterparties on one side and a single named data partner on the other.


    This creates an unusual concentration profile. Traditional top-customer concentration cannot be measured because no customer revenue is visible, but dependency concentration is high because public proof of external validation rests heavily on 23andMe and on investor support. If Mirador later commercializes successfully, concentration risk will likely migrate toward a small number of payer decisions, specialist centers, or partner geographies. Today, though, concentration is better understood as counterparty and evidence concentration rather than revenue concentration.'
  claimRefs:
  - CU014
  - CU016
  - CU017
  - CU018
  - CU019
