company:
  name: Mirador Therapeutics
chapter:
  number: 6
  title: Customers
  summary: 'Mirador has a future customer map but almost no current commercial customer proof. Public materials show a pre-commercial biotech whose visible external stakeholders are investors, a strategic data collaborator, clinical trial site staff and investigators, and prospective patients or partners who contact the company. The eventual economic buyers and users are easier to identify than to quantify: prescribing gastroenterologists, rheumatologists, and pulmonologists; payers and formularies; specialty pharmacies or channel partners; and patients whose treatment pathways are today managed through specialist care and often trial-and-error sequencing. The chapter''s core conclusion is therefore structural rather than traction-driven: Mirador''s customer opportunity is real, but public adoption, retention, and concentration metrics are almost entirely absent.'
sections:
- id: buyer-user-payer-segmentation
  title: Buyer, user, and payer segmentation
  body: 'Mirador does not yet have a publicly visible commercial customer base, so segmentation has to start from the care workflow it is trying to enter. Future users are likely the specialist physicians who manage immunology and fibrotic disease pathways: gastroenterologists in Crohn''s disease and ulcerative colitis, rheumatologists in RA, and pulmonologists in IPF. Future economic buyers or gatekeepers are payers, formularies, health systems, specialty pharmacies, and any commercialization partners that help Mirador reach those specialists. Patients are the end beneficiaries, but they are unlikely to be the direct economic buyers in the U.S. specialty-drug model.


    Current public stakeholders are narrower and more transactional. Mirador''s privacy policy says the company handles website inquiries, investor interactions, and information about clinical trial site staff and investigators, while not collecting trial-subject personal information directly from patients. Its terms of use describe the website as an informational and marketing channel rather than a product-purchase channel. That means the visible user base today is a pre-launch ecosystem—partners, investigators, and interested stakeholders—not a paying installed base.'
