- id: named-proof-and-adoption-evidence
  title: Named proof and adoption evidence
  body: 'Public named-customer proof is thin. The only named operational counterparty in retained sources is 23andMe, which is a strategic research collaborator rather than a therapy customer, payer, or health-system buyer. Mirador''s Series B and launch materials show exceptionally strong investor appetite, but funding is not the same as user adoption. Public sources do not disclose active accounts, physician sites, trial-center counts, patient starts, utilization, or repeat-purchase behavior. The result is an evidence ladder with a strong top rung on financing credibility and a weak middle rung on real-world customer adoption.


    The disease-area sources nevertheless clarify who the future users must be. GI sources describe Crohn''s disease as a chronic condition with recurring management needs; rheumatology sources emphasize early treatment and durable control in RA; and pulmonary-fibrosis sources show specialized center networks and therapy selection tailored to disease type. That makes Mirador''s future customer base legible even if its current adoption proof is not.'
