  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Real adoption metrics
    missingEvidence: No public data shows active physician sites, accounts, patient starts, utilization, or expansion over time.
    whyItMatters: Without usage data, investors cannot distinguish stakeholder interest from actual adoption.
    diligencePath: Request launch-readiness dashboard or clinical-site engagement metrics including active sites, patient-screening volumes, and investigator repeat engagement.
    relatedQuestionRefs:
    - QU010
    - QU022
    relatedTableRefs:
