    - TU003
  - type: private-evidence-only
    severity: material
    topic: Customer durability and reference quality
    missingEvidence: No public NRR, GRR, churn, contract duration, satisfaction, or named customer references exist.
    whyItMatters: Durability separates a one-time proof point from a repeatable customer model.
    diligencePath: Request partner-renewal, investigator-repeat, and post-readout stakeholder-engagement data plus any reference accounts or KOL commitments.
