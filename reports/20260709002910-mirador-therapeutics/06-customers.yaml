- id: TU005
  title: Procurement friction table
  columns:
  - Friction point
  - Public evidence
  - Why it matters
  - Missing proof
  rows:
  - - Specialist-channel adoption
    - GI, RA, and PF care all rely on specialist-managed pathways
    - Mirador must win expert trust before broad use
    - No public KOL, site, or education evidence
  - - Payer budget pressure
    - ASHP projects U.S. drug spend above $1T with specialty therapies important to growth
    - Access evidence will face budget scrutiny
    - No Mirador pricing or HEOR plan is public
  - - Government price pressure
    - CMS 2026 negotiated-price materials show immunology categories under policy pressure
    - Commercial headroom can be constrained even after approval
    - No plan for gross-to-net or contracting disclosed
  - - Partner-dependence risk
    - 23andMe collaboration later sits inside bankruptcy and privacy constraints
    - Named proof can erode if partner value declines
    - No contingency partner roster or replacement-data plan public
  - - Channel build strategy
    - No distributor, specialty-pharmacy, or co-promotion model disclosed
    - Channel choice shapes expansion speed and cost
    - No launch-channel blueprint is public
  notes: Procurement friction is likely to be at least as important as scientific novelty in determining customer adoption.
