  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition in clinical-workflow terms
        blocks:
          - type: paragraph
            body: >-
              Mirador is building precision medicines for immune-mediated inflammatory and fibrotic diseases, but the
              public product definition is broader than any single therapeutic candidate. On its homepage and vision
              pages, the company frames Mirador360 as an end-to-end discovery and development engine that combines
              biology, multi-modal data, AI, and advanced analytics to identify novel targets, select combinations,
              choose indications, and pinpoint patients most likely to benefit. In other words, the product is partly a
              pipeline and partly a decision system that is meant to improve how the pipeline is chosen.


              In customer-workflow terms, Mirador is trying to intervene before a physician's conventional
              trial-and-error sequence fully plays out. NIDDK, NIAMS, and NHLBI each describe Crohn's disease,
              rheumatoid arthritis, and IPF as heterogeneous conditions that require multi-factor diagnosis and
              treatment decisions rather than one simple test. Mirador's thesis is that genetics- and data-guided
              stratification can make target selection and later patient selection more precise in exactly those messy
              workflows. What remains missing publicly is the handoff from that engine to specific, named product
              candidates and clinical protocols.
