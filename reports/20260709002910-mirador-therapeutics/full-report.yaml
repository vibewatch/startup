companyProfile:
  summary: >
    Mirador Therapeutics is a San Diego-based private clinical-stage biotech founded in 2024 by former Prometheus
    Biosciences CEO Mark C. McKenna. The company combines a precision-development engine, Mirador360, with a multi-asset
    pipeline spanning Crohn's disease, ulcerative colitis, rheumatoid arthritis, and idiopathic pulmonary fibrosis.
    Public materials emphasize genetics, multiomics, machine learning, and patient stratification as the core of its
    discovery and development process, while leaving asset-level mechanisms, routes, and trial protocols largely
    undisclosed. Mirador has nevertheless raised more than $650 million across launch and Series B financings, giving it
    unusual private-market depth for a pre-commercial biotech.
