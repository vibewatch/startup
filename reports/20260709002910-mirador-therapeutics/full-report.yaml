      - number: '8.2'
        title: Financing context and price discipline
        blocks:
          - type: paragraph
            body: >-
              Public financing context is strong but incomplete. Mirador officially disclosed a >$400 million launch and
              a $250 million Series B that pushed total capital raised above $650 million. Independent secondary
              coverage of the Series B emphasizes strong investor appetite and, in some cases, discusses IPO
              optionality. But none of the retained official or accessible secondary sources disclose a precise
              post-money valuation, liquidation preference stack, or per-share pricing framework that would allow a
              clean private-market mark.


              That omission matters. When exact price is absent, valuation discipline has to move from price anchoring
              to milestone anchoring. Investors should treat round size as evidence of access to capital, not evidence
              that any specific premium valuation is deserved. A good private-entry process here would be conditional on
              asset-level disclosure and readout quality, not on social proof from brand-name investors alone. The
              valuation conversation therefore starts with humility rather than precision.
            claimRefs:
              - CV001
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV036
