      - number: '6.4'
        title: Expansion path and procurement friction
        blocks:
          - type: paragraph
            body: >-
              Mirador's plausible expansion logic is indication-led. If the company proves better target or responder
              selection in one high-value specialist channel, it can expand that credibility across adjacent immunology
              and fibrotic indications. Public materials already describe this breadth strategy across IBD, RA, and IPF.
              But expansion will not be driven by self-serve adoption; it will be driven by evidence strength, physician
              trust, and payer access in expensive specialty-drug categories. ASHP's 2026 drug-spending outlook and
              CMS's 2026 drug-negotiation materials both reinforce that specialty therapies operate under increasingly
              intense budget and pricing scrutiny.


              The commercial implication is that Mirador cannot count on science alone. It will need evidence packages
              that win over specialist prescribers and withstand payer resistance. Because there is no public customer
              base yet, the right chapter verdict is that Mirador's customer architecture is strategically sensible but
              empirically unproven, with the hardest work still ahead in access, retention, and channel execution.
