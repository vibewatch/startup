        title: GTM, pricing, and unit-economics visibility
        blocks:
          - type: paragraph
            body: >-
              Mirador is still pre-commercial in public view, so normal biotech launch metrics are absent. There is no
              public price list, no gross-to-net discussion, no revenue-recognition policy for customers, no field-force
              footprint, no specialty-pharmacy or distribution model, and no disclosed patient-support or market-access
              plan. The lack of these metrics does not imply weakness by itself for a clinical-stage company, but it
              does mean investors cannot yet underwrite customer-acquisition cost, payback, channel mix, or
              sales-efficiency conversion in the way they could for a launched therapy business.


              The more important underwriting point is that Mirador's public traction is scientific and financial rather
              than commercial. Management talks about multi-asset proof-of-concept plans and a large
              precision-immunology data engine, not customers or booked revenue. So the GTM question is not "how
              efficient is the sales model today?" but "what kind of launch model will be required if the pipeline
              works?" Public sources do not yet answer that.
