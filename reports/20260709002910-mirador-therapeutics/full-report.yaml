  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The long thesis is straightforward. Mirador has assembled unusual private capital for a newly launched
              biotech, positioned a precision-immunology platform around genetics, multiomics, and patient
              stratification, and already claims a multi-asset clinical pipeline across four major indications with more
              than 10 readouts expected by the end of 2027. Independent launch coverage and follow-on financing coverage
              reinforce that sophisticated investors are backing not just a single drug, but a broader
              precision-development architecture.


              The anti-thesis is equally clear. Public materials do not disclose the specific assets, mechanisms,
              routes, protocols, current cash balance, customer evidence, or exact private valuation needed to
              underwrite that story. The 23andMe dependency adds partner risk, while payer-pressure sources show that
              even successful specialty assets can struggle to capture full theoretical value. In valuation terms,
              Mirador looks like a high-quality option on future proof rather than a currently de-risked franchise.
            claimRefs:
              - CV001
              - CV002
              - CV003
