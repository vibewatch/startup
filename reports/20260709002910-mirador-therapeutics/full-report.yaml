  - id: FE001
    title: Precision-clinical workflow bridge
    type: flow
    layout: wide
    summary: >-
      Flow diagram showing how Mirador positions its platform between disease heterogeneity and eventual treatment
      selection in immunology and fibrosis.
    data:
      nodes:
        - id: disease-heterogeneity
          label: Heterogeneous disease presentation
          detail: Crohn's disease, RA, and IPF all show variable diagnosis, progression, and treatment response.
          tone: warning
        - id: multimodal-inputs
          label: Genetics, multiomics, and patient data
          detail: Mirador says Mirador360 uses large patient-profile, human-genetics, and analytics inputs.
          tone: positive
        - id: target-selection
          label: Target and combination selection
          detail: Platform aims to identify novel targets and optimal combinations rather than rely on trial-and-error.
          tone: positive
        - id: patient-enrichment
          label: Precision-driven patient selection
          detail: Mirador says it wants to pinpoint patients most likely to benefit and improve clinical signal.
          tone: positive
        - id: poc-readouts
          label: Proof-of-concept readouts
          detail: Public roadmap targets 10+ readouts by year-end 2027 across current programs.
          tone: neutral
        - id: future-therapy-use
          label: Future therapy and diagnostic use
          detail: Final physician or payer workflow remains undisclosed publicly.
          tone: neutral
      edges:
        - from: disease-heterogeneity
          to: multimodal-inputs
          label: Creates need for better signal
        - from: multimodal-inputs
          to: target-selection
          label: Informs biology decisions
        - from: target-selection
          to: patient-enrichment
          label: Narrows who should benefit
        - from: patient-enrichment
          to: poc-readouts
          label: Seeks clearer trial outcomes
        - from: poc-readouts
