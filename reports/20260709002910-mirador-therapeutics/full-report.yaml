      - number: '8.4'
        title: Recommendation, exit readiness, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The practical recommendation is selective and conditional rather than bullish-at-any-price. Mirador
              appears to be a serious precision-immunology platform with the capital to generate meaningful data, but
              the public record does not support paying for a fully formed blockbuster narrative. A disciplined investor
              can justify staying engaged, but only if entry terms reflect the still-large gap between platform
              architecture and product proof.


              Exit readiness is also mixed. Positive readouts and a receptive market could make IPO or partnership
              routes credible, especially given the size of the Series B and the company's investor roster. Yet no
              public source confirms exact pricing expectations, ownership structure, liquidation preferences, or
              near-term commercial readiness. The final diligence asks are therefore straightforward: reveal the assets,
              reveal the economics, reveal the channel plan, and show at least one readout strong enough to prove that
              Mirador360 creates enterprise value rather than just an attractive story.
