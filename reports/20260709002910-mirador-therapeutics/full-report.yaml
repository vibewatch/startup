      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map across Mirador's target diseases is specialist-led and payer-gated. In IBD,
              gastroenterologists and academic centers diagnose, select therapy, and monitor relapse, while commercial
              insurers, Medicare, and increasingly sophisticated utilization-management systems control coverage. In RA,
              rheumatologists own prescribing decisions but usually work through a treatment ladder that begins with
              conventional DMARDs before escalating to biologics or targeted agents. In IPF, pulmonologists and
              interstitial-lung-disease centers manage a smaller but medically urgent patient group. Across all three
              segments, patients are the users, but they are not the real budget owners; plans, PBMs, and health systems
              ultimately decide whether novel therapies enter pathways smoothly or face step edits and prior
              authorization.


              This means Mirador's adoption path is not just “show efficacy.” It is “show superior value at the exact
              point in the treatment algorithm where a payer and specialist are willing to move.” Public market-access
              commentary suggests regulatory approval alone is no longer sufficient. Payers increasingly want
              comparative effectiveness, durability of response, quality-of-life data, total-cost-of-care logic, and
              real-world evidence planning. In chronic categories with multiple incumbents, a new therapy can be
              clinically interesting yet still encounter slow uptake if its evidence package does not justify better
              placement in treatment pathways.


              Mirador's precision thesis is relevant here. The company argues that genetics, multiomics, and
              biomarker-driven stratification can match the right target and therapy to the right patient. If that
              works, it could shorten the trial-and-error cycle that characterizes many IBD and RA treatment journeys.
              But the same precision layer also creates adoption work: diagnostics need validation, clinicians need
              workflows they trust, and payers need evidence that stratification improves real outcomes rather than just
              generating an additional test cost. For market analysis purposes, the buyer-user-payer map therefore
              favors companies that can combine strong clinical data with credible companion evidence, not just novel
              mechanisms.
