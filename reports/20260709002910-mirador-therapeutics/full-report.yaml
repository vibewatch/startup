      - number: '1.2'
        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              Mirador was founded by Mark C. McKenna, who also serves as founder, chairman, and CEO. McKenna is not a
              first-time biotech sponsor: he previously ran Prometheus Biosciences through its 2021 IPO and June 2023
              sale to Merck for $10.8 billion. Mirador's operating bench is intentionally built from that prior
              playbook. Public biographies show Olivier Laurent as chief scientific officer, Allison Luo as chief
              medical officer, William Sandborn as chief strategy officer, Tim Andrews as chief legal officer, Maulik
              Shah as chief financial officer, Jordan Zwick as chief business officer, Nori Ebersole as chief people
              officer, and Vika Brough as chief accounting officer. Most of this team has direct prior Prometheus
              experience, while Sandborn adds external clinical and inflammatory-bowel-disease depth from UC San Diego
              and multiple company-building roles.


              The board and advisory bench also reinforce that Mirador is a continuation, not a reset. Mirador publicly
              names Kristina Burow of ARCH Venture Partners, David Bonita of OrbiMed, Paul Berns, and Joseph Papa as
              directors, adding investors and experienced public-company operators to the governance surface. The
              combination of Prometheus alumni, blue-chip investors, and well-known industry executives is a real
              strength because it supports recruiting, financing access, and translational immunology judgment. But it
              also creates clear key-person concentration. McKenna is simultaneously founder, chair, chief executive,
              financing face, and strategic narrator; many other executives are drawn from the same predecessor company;
              and the website does not disclose committee structure, independent-director mechanics, or other governance
              process detail beyond the named leadership roster.


              For diligence purposes, the leadership story is therefore double-edged. The team is unusually credible for
              a sub-two-year-old private biotech, and the prior Prometheus outcome gives Mirador evidence of execution
              in precision immunology. At the same time, Mirador is still founder-centric, and public governance
              disclosure has not caught up with the size of its capital base. That does not undermine the company's
              operating capability, but it does mean investors should treat governance transparency, succession depth,
              and decision-right clarity as live diligence asks rather than assumed strengths.
