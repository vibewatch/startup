      - number: '1.4'
        title: Milestones, disclosure limits, and diligence caveats
        blocks:
          - type: paragraph
            body: >-
              Mirador's milestone record is short but consequential. In less than two years the company moved from
              launch financing to a recognized startup award, a strategic genetics collaboration, and clinical-stage
              disclosure across four major immuno-fibrotic indications. The pace supports management's stated emphasis
              on speed and parallel execution, and the shift from an initially undisclosed launch pipeline to a named
              2026 indication set is evidence that the company has progressed materially beyond concept stage.


              The main caution is that Mirador still reveals less than its financing scale might imply. Independent
              March 2024 coverage repeatedly highlighted that the company was not naming specific targets, disease
              priorities, or asset-level details at launch. Even after the January 2026 update, public materials still
              stop short of disclosing exact program names, a public valuation, revenue, customer count, or exact
              headcount. That level of opacity is not unusual for a private clinical-stage biotech, but it does narrow
              the set of facts that can be independently underwritten and forces investors to depend more heavily on
              team quality, syndicate quality, and future data readouts.


              Accordingly, the company-overview verdict is favorable on identity, talent, financing depth, and strategic
              coherence, but incomplete on operating transparency. Mirador looks like a serious, well-capitalized
              continuation of the Prometheus precision-immunology thesis with stronger tooling and broader ambition. The
              unresolved diligence work is no longer whether a real company exists—it clearly does—but rather how
              differentiated the current assets are, how efficiently the capital base is being deployed, and what
              valuation or governance expectations the private market is already embedding before proof-of-concept data
              are broadly public.
