  - id: FE002
    title: Mirador360 operating model
    type: flow
    layout: wide
    summary: Publicly described closed-loop operating model from data collection to clinical-strategy decisions.
    data:
      nodes:
        - id: data-layer
          label: Data layer
          detail: Multi-modal data, human genetics, patient profiles, and external de-identified data inputs.
          tone: positive
        - id: analytics-layer
          label: Analytics layer
          detail: AI, advanced analytics, and combinatorial biology transform inputs into ranked hypotheses.
          tone: positive
        - id: portfolio-layer
          label: Portfolio decision layer
          detail: Target validation, indication selection, and combination logic guide which programs advance.
          tone: neutral
        - id: clinical-layer
          label: Clinical strategy layer
          detail: Precision-driven clinical strategies and patient stratification aim to improve proof-of-concept.
          tone: neutral
        - id: learning-loop
          label: Dynamic learning loop
          detail: Science page says every iteration strengthens system capability and confidence.
          tone: positive
      edges:
