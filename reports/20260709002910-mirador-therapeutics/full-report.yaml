  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization today
        blocks:
          - type: paragraph
            body: >-
              Mirador's current public economic model is capital-funded, not revenue-funded. The strongest verified
              facts are its launch financing and follow-on fundraising: the company launched in March 2024 saying it had
              raised more than $400 million, and SEC Form D notices filed on April 3, 2024 show two exempt offerings
              totaling $412,999,976. Mirador then announced a $250 million Series B on January 12, 2026 and said total
              capital raised now exceeded $650 million. Those items demonstrate financing strength, but they do not
              create operating revenue.


              No retained public source discloses product sales, license revenue, milestone receipts, service revenue,
              or any recognized collaboration revenue. The November 2024 23andMe collaboration is strategically relevant
              because it adds human-genetics data to Mirador360, but the press release and secondary coverage do not
              disclose upfront cash, milestone payments, royalties, or cost sharing. That means revenue quality today is
              best understood as zero or undisclosed recurring revenue with a future option on product, licensing, or
              data-enabled monetization rather than a presently visible business model.
