        - Direct precision-immunology peer
        - Big Pharma; Prometheus acquired for $11B in 2023; Phase 3 UC data in 2026
        - IBD first, with RA and other IMIDs in development
        - Anti-TL1A biology explicitly framed around immuno-fibrosis; broad clinical program; precision-IBD heritage
        - >-
