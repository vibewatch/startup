  - id: FV001
    title: Scenario valuation range
    type: range
    layout: wide
    summary: >-
      Illustrative valuation bands for Mirador based on public financing context, disclosed uncertainty, and
      precision-immunology comparables. These are scenario ranges, not quoted market marks.
    data:
      items:
        - label: Bear case enterprise-value band (USD billions)
          low: 0.6
          high: 1
          displayValue: $0.6B-$1.0B
          detail: >-
            Assumes ambiguous or delayed first readouts, continued opacity, and compression toward capital-backed option
            value rather than premium platform value.
          tone: warning
        - label: Base case enterprise-value band (USD billions)
          low: 1
          high: 1.8
          displayValue: $1.0B-$1.8B
          detail: >-
            Assumes one or two credible proof points, continued financing access, and partial narrowing of execution
            risk without full public de-risking.
          tone: neutral
        - label: Bull case enterprise-value band (USD billions)
          low: 2.5
          high: 4.5
          displayValue: $2.5B-$4.5B
          detail: >-
            Assumes several strong proof-of-concept signals, partner diversification, and a credible IPO or
            large-partnering path.
          tone: positive
        - label: Gross capital raised to date (USD billions)
          low: 0.65
          high: 0.663
          displayValue: '>$0.65B confirmed'
          detail: >-
            Publicly disclosed financing base provides a concrete lower-bound anchor for option value, though it is not
            a substitute for current cash or a direct valuation mark.
          tone: neutral
    approximationNotes: >-
      These bands are inferred from public financing scale, public-peer funding benchmarks, and current uncertainty
      rather than from disclosed market pricing. Use only as a diligence framing tool.
    claimRefs:
      - CV001
      - CV012
      - CV013
      - CV018
      - CV020
      - CV021
      - CV022
