      - number: '3.3'
        title: RA, IPF, and status-quo competition
        blocks:
          - type: paragraph
            body: >-
              Rheumatoid arthritis and idiopathic pulmonary fibrosis change the shape of the competitive problem. In RA,
              Mirador would not be entering an open field; it would be entering one of the most protocolized
              immune-therapy markets in medicine. AbbVie's Rinvoq is already approved in RA and positioned after
              TNF-blocker use, while BMS's Orencia remains an established IV/SC biologic option and TNF blockers still
              anchor the standard sequence. That means Mirador needs either a clearly safer or more targeted story, or a
              biomarker-selected population where incumbent sequencing works poorly. Without that, RA becomes a
              distribution-and-reimbursement fight against companies that already know how to navigate treatment
              ladders.


              IPF is somewhat different. The unmet need is high, but the commercial surface is narrower and specialized.
              PatSnap and the Pulmonary Fibrosis Foundation both show that nintedanib and pirfenidone still define the
              standard of care and that no current therapy reverses fibrosis. At the same time, the pipeline is active:
              BMS's admilparant (BMS-986278) is in Phase 3 as the most advanced LPA1 antagonist, and Boehringer remains
              the incumbent leader in fibrotic lung disease. For Mirador, IPF therefore offers more room for mechanistic
              differentiation than IBD or RA, but also a smaller patient base and a clinical bar set by physicians
              already used to progression-slowing—not curative—therapy. Across both RA and IPF, the status quo is
              powerful because physicians can already escalate within existing algorithms without taking the risk of an
              unproven private-company asset.
