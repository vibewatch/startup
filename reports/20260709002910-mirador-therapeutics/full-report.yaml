      - number: '1.3'
        title: Funding, partners, and capital base
        blocks:
          - type: paragraph
            body: >-
              Mirador launched with more than $400 million in financing, a scale that multiple independent outlets
              described as one of the largest private biotech Series A rounds of 2024 and potentially record-breaking
              for a preclinical company. The round was led by ARCH Venture Partners, with early investments from OrbiMed
              and Fairmount and participation from Fidelity Management & Research Company, Point72, Farallon Capital
              Management, Boxer Capital, TCGX, Invus, Logos Capital, Moore Strategic Ventures, Blue Owl Healthcare
              Opportunities, Sanofi Ventures, Woodline Partners, Venrock Healthcare Capital Partners, RTW Investments,
              and Alexandria Venture Investments. Latham & Watkins separately disclosed its role advising the financing,
              corroborating the size and timing of the capital event.


              Mirador added a second major financing leg in the third quarter of 2025, closing a $250 million Series B
              that brought total capital raised to more than $650 million by January 2026. New Series B capital came
              from T. Rowe Price Investment Management, Adage Capital Partners, and additional Fidelity funds, while
              multiple prior investors re-upped. Management said the proceeds are intended to take all current programs
              to proof-of-concept and to support additional pipeline candidates. That use-of-proceeds message is
              notable: Mirador is not capitalizing only one lead asset, but a parallel-development portfolio that
              depends on a large balance sheet and disciplined capital allocation.


              The other strategically important capital-adjacent event is Mirador's November 2024 collaboration with
              23andMe. Under the agreement, Mirador gets access to a targeted set of aggregated, de-identified genetic
              and phenotypic data from 23andMe's research database to augment Mirador360. This is not a
              revenue-generating commercial partnership, but it is a meaningful signal about Mirador's data strategy and
              partner credibility. It also means part of Mirador's moat claim rests on continued access to external data
              relationships and on the privacy, consent, and continuity standards surrounding those datasets.
