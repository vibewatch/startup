chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform, and stage
        blocks:
          - type: paragraph
            body: >-
              Mirador Therapeutics launched publicly on March 21, 2024 as a San Diego-based precision medicine company
              focused on immune-mediated inflammatory and fibrotic diseases. From the start, management positioned
              Mirador as a next-generation immunology and inflammation company rather than a single-asset biotech. Its
              one-line business model is to use a proprietary precision discovery-and-development engine, Mirador360, to
              identify genetically grounded targets, build first- or best-in-class therapies, and pair them with
              diagnostics or patient-selection tools that improve the probability of success in heterogeneous diseases.


              Official company materials describe Mirador360 as combining human genetics, multi-modal data, cutting-edge
              biology, artificial intelligence, and advanced analytics. At launch, the company said the platform
              harmonized millions of patient molecular profiles; by January 2026, Mirador said the engine supported more
              than 2.5 million patient profiles across immunology and inflammation diseases. The platform thesis is
              end-to-end: discover and validate targets, identify optimal combinations or multi-specific approaches,
              choose the best indication, and stratify patients most likely to benefit. That positioning matters because
              Mirador is not selling an existing commercial product; it is underwriting a platform-plus-pipeline model
              whose value depends on whether its data engine can repeatedly improve target selection and clinical
              design.


              The company was deliberately broad but also guarded at launch. Independent coverage in March 2024 said
              Mirador intended to work in gastrointestinal, lung, and skin diseases, yet McKenna declined to disclose
              specific disease priorities or named targets. By January 2026, Mirador had moved from stealth-platform
              story to clinical-stage company and publicly named four indications—Crohn's disease, ulcerative colitis,
              rheumatoid arthritis, and idiopathic pulmonary fibrosis—with more than 10 clinical readouts targeted by
              year-end 2027. The change in disclosure level is important: Mirador has crossed the threshold into a real
              pipeline company, but public visibility still remains at the indication level rather than the
              asset-by-asset level typically preferred by later-stage private-market investors.
