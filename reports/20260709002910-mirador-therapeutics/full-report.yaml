      - number: '2.2'
        title: Disease burden and evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Among Mirador's disclosed focus areas, inflammatory bowel disease is the clearest large-scale burden pool.
              U.S. prevalence is estimated at roughly 2.4 to 3.1 million people, or more than 0.7% of Americans—nearly 1
              in 100. Within that pool, ulcerative colitis accounts for approximately 1.25 million cases and Crohn's
              disease for roughly 1.01 million. IBD also matters economically because costs are rising and prescribed
              medicines account for 71% of the approximately $8.5 billion in annual U.S. IBD healthcare costs cited by
              CDC. This is exactly the sort of market where a more precise therapy can create value both by improving
              remission and by reducing expensive trial-and-error switching.


              Rheumatoid arthritis is similarly large but commercially distinct. Public sources put U.S. RA prevalence
              at roughly 1.3 to 1.5 million adults, and RA sits inside a much broader arthritis umbrella that affects
              more than 53 million U.S. adults. That gap matters: most arthritis prevalence is not Mirador's market, and
              even within RA, targeted biologics generally come after initial DMARD treatment rather than as universal
              first-line therapy. In other words, raw prevalence overstates commercial accessibility. Still, RA remains
              a meaningful specialty market because disease activity is chronic, disability and work-loss costs are
              substantial, and payers are accustomed to funding expensive immune modulators when they deliver clinically
              durable benefit.


              Idiopathic pulmonary fibrosis is different again: rare by patient count, severe by consequence, and
              commercially meaningful because progression is serious and current options remain limited. A 2025
              meta-analysis found pooled North American IPF prevalence of 27.2 per 100,000 and incidence of 9.0 per
              100,000. NHLBI describes IPF as a serious chronic disease with no cure, where treatments may slow
              progression but not reverse disease. That makes IPF a smaller but high-need market. The right conclusion
              is not to force these lenses into one false TAM number. Instead, public evidence supports a multi-lens
              view: a huge long-run immune-disease burden, a very large specialty-spend market, and a narrower
              advanced-therapy-eligible pool for the indications Mirador is most likely to enter first.
