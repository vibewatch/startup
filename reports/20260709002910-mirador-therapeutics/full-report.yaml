        - Market interest exists
        - Exact private valuation, preference stack, and ownership are opaque
      - - Exit window
        - Some secondary sources mention IPO consideration
        - Public-market route may be possible if data cooperate
        - No official IPO timing or target range disclosed
    notes: This table distinguishes capital access from actual price discovery.
