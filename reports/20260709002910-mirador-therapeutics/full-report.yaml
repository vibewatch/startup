      - number: '7.5'
        title: Mitigations, monitoring, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Mirador does have meaningful mitigants. The capital base is deep, the team publicly projects
              cross-disciplinary precision-medicine experience, and the company has structured at least some data flows
              around de-identification, pseudonymization, and written safeguards. The scientific thesis is also not
              irrational: external development data suggests biomarker-informed programs can improve success
              probabilities. But mitigations are credible only if they become observable in asset-level execution.


              The best monitoring indicators are therefore concrete. Positive signals would include named asset
              disclosure, clear proof-of-concept readouts, disclosed diagnostic strategy, additional partner
              diversification, and greater cash/burn transparency. Kill criteria would include failed or ambiguous
              initial readouts, visible loss or legal impairment of key data rights, inability to articulate
              commercialization channels, or any sign that capital is being consumed without narrowing the
              platform-to-product gap.
