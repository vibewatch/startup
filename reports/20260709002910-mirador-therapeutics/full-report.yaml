  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              Mirador's highest-ranked risks are not abstract. First, public asset opacity makes it impossible to verify
              whether the molecules, modalities, and clinical designs under Mirador360 are strong enough to justify the
              platform story. Second, the company is trying to move several programs toward proof-of-concept across
              different disease areas, which creates sequencing, resource-allocation, and clinical-execution complexity.
              Third, public counterparty risk is concentrated in 23andMe, whose bankruptcy turned a platform-strength
              narrative into a continuity and privacy management problem.


              Lower down the stack—but still material—sit financing transparency, commercialization readiness,
              data-governance obligations, and future pricing pressure. Mirador's >$650 million gross funding base is a
              meaningful mitigation, yet it does not answer the central underwriting question of whether the company can
              convert platform architecture into molecule-level wins before capital intensity, partner disruption, or
              payer skepticism erode optionality.
