  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive rings: direct precision peers, incumbents, and status quo'
        blocks:
          - type: paragraph
            body: >-
              Mirador does not face one clean competitor set. Its disclosed indication list—Crohn's disease, ulcerative
              colitis, rheumatoid arthritis, and idiopathic pulmonary fibrosis—pulls it into several overlapping arenas
              at once. The first ring contains direct precision-immunology peers, above all Merck's Prometheus-derived
              tulisokibart program, which explicitly targets immuno-fibrosis and already has positive Phase 3
              ulcerative-colitis data. The second ring is made up of entrenched commercial franchises in IBD and
              rheumatology: AbbVie's Skyrizi and Rinvoq, Johnson & Johnson's Tremfya and legacy Stelara base, Takeda's
              Entyvio, Lilly's Omvoh, Pfizer's Velsipity, and BMS's Orencia. The third ring is disease-specific status
              quo therapy, especially sequential biologic/JAK escalation in IBD and RA and the nintedanib/pirfenidone
              standard of care in IPF.


              This structure matters because Mirador's competitive job is not merely to beat one molecule on efficacy.
              It must persuade investors, clinicians, and later payers that a still-undisclosed asset set can outperform
              approved drugs, fit existing treatment algorithms, and use biomarkers or genetics in a way that changes
              outcomes rather than just adding complexity. Publicly, Mirador's strongest differentiator is its
              Mirador360 precision-development engine and its cross-indication immuno-fibrotic framing. Publicly, its
              weakest point is the absence of asset-level detail. Competitors already disclose mechanisms, routes,
              real-world persistence, phase design, and in several cases head-to-head studies; Mirador does not.
