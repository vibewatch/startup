      - number: '3.4'
        title: Moat durability, route economics, and switching friction
        blocks:
          - type: paragraph
            body: >-
              Mirador's best moat argument is conceptual breadth. Publicly, it is one of the few private companies
              claiming a single precision-development engine can produce first- or best-in-class programs across IBD,
              RA, and IPF while using genetics, machine learning, and patient stratification as a common operating
              layer. If that engine really selects better targets and better responder subsets, Mirador could avoid
              competing head-on as a me-too entrant in each indication.


              But the public evidence today favors the incumbents on almost every practical readiness dimension. Merck
              already has phase-advanced immuno-fibrosis data. AbbVie has sales scale, real-world evidence, and
              frontline/second-line coverage through Skyrizi and Rinvoq. J&J is using both Tremfya's expanding route
              flexibility and Icotyde's oral IL-23 ambition to defend the post-Stelara franchise. Takeda, Lilly, Pfizer,
              BMS, and Boehringer already own specialist relationships, patient-support infrastructure, and payer
              experience. Even price discipline is working against new entrants: ICER's 2026 Entyvio review argued the
              evidence did not support a premium over ustekinumab and supported only a limited premium over infliximab,
              while biosimilars keep resetting what payers think a mature immunology market should cost. The competitive
              verdict is therefore selective rather than bullish: Mirador may have a genuine platform angle, but until
              it discloses asset-level proof, the market should assume incumbents own the current moat and Mirador owns
              only the option value of future differentiation.
