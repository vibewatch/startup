company:
  name: Mirador Therapeutics
chapter:
  number: 4
  title: Financials
  summary: Mirador has elite access to capital but almost no public operating disclosure. The company has documented more than $400 million of launch financing through two 2024 Form D notices and then added a $250 million Series B announced in January 2026, taking total raised above $650 million. That gives Mirador far more balance-sheet depth than most private biotech peers, yet public materials still do not disclose revenue, cash on hand, burn, debt, pricing, gross margin, or commercialization economics. The only visible near-term economics are equity financing and a 23andMe research collaboration with undisclosed terms, while 23andMe's 2025 Chapter 11 filing introduces counterparty risk rather than monetization proof.
sections:
- id: revenue-model-and-monetization-today
  title: Revenue model and monetization today
  body: 'Mirador''s current public economic model is capital-funded, not revenue-funded. The strongest verified facts are its launch financing and follow-on fundraising: the company launched in March 2024 saying it had raised more than $400 million, and SEC Form D notices filed on April 3, 2024 show two exempt offerings totaling $412,999,976. Mirador then announced a $250 million Series B on January 12, 2026 and said total capital raised now exceeded $650 million. Those items demonstrate financing strength, but they do not create operating revenue.


    No retained public source discloses product sales, license revenue, milestone receipts, service revenue, or any recognized collaboration revenue. The November 2024 23andMe collaboration is strategically relevant because it adds human-genetics data to Mirador360, but the press release and secondary coverage do not disclose upfront cash, milestone payments, royalties, or cost sharing. That means revenue quality today is best understood as zero or undisclosed recurring revenue with a future option on product, licensing, or data-enabled monetization rather than a presently visible business model.'
