- id: capital-adequacy-and-financing-dependency
  title: Capital adequacy and financing dependency
  body: 'Capital adequacy is the strongest part of Mirador''s public financial profile. The filing-backed launch financing is unusually large for a newly formed biotech, and the January 2026 Series B extended that advantage. Mirador explicitly said the Series B would support proof-of-concept across its current programs and additional candidates, which suggests management believes the round was sized to reach major value-inflection data rather than merely to keep the lights on. No retained public source discloses debt, royalty financing, or project-finance obligations, so the visible capital stack is almost entirely equity.


    The caveat is that gross capital raised is not the same as cash on hand. Public sources do not disclose Mirador''s current cash balance, quarterly burn, or runway, so outsiders cannot know how much of the $650 million-plus is still available. There is also a specific counterparty risk: 23andMe, Mirador''s genetics-data collaborator, entered Chapter 11 in March 2025, obtained $35 million of DIP financing, and subjected any customer-data sale to privacy-policy and legal constraints. Because collaboration economics were never disclosed, the bankruptcy matters more as execution and data-access risk than as a visible revenue impairment.'
