- id: TI002
  title: Pricing / monetization table
  columns:
  - Topic
  - Public status
  - What is known
  - Why it matters
  - Missing proof
  rows:
  - - Future therapy pricing
    - Not publicly disclosed
    - No launched asset or price anchor appears in retained sources.
    - Net price and gross margin drive launch value capture.
    - Asset stage, route, label breadth, and payer strategy
  - - Collaboration economics
    - Not publicly disclosed
    - 23andMe collaboration text explains data use but not economics.
    - Determines whether partnerships can offset burn before approval.
    - Upfront cash, milestones, royalties, cost sharing
  - - Channel / commercialization model
    - Not publicly disclosed
    - No specialty-pharmacy, hospital, or partner-led channel plan is public.
    - Channel choice affects CAC, gross-to-net, and working capital.
    - Distribution model and geography-by-geography plan
  - - Sales-efficiency metrics
    - Not applicable publicly yet
    - No customer acquisition, conversion, or payback metrics exist for a pre-commercial company.
    - Investors cannot benchmark launch readiness.
    - Launch staffing plan and adoption funnel assumptions
  - - Revenue-recognition complexity
    - Unknown
    - Without visible contracts, there is no public revenue-recognition issue to model.
    - Milestones or data deals could create lumpy recognition later.
    - Contract structure if Mirador signs partnered deals
  - - Customer concentration
    - Unknown
    - No customer list or paying counterparties disclosed.
    - Single-partner dependence can distort quality of revenue.
    - Whether any one pharma or data partner dominates economics
  notes: This table is intentionally gap-heavy because Mirador is still pre-commercial. The key conclusion is absence of pricing and channel evidence, not a hidden pricing insight.
