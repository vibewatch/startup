- id: cost-structure-and-peer-benchmark-bounds
  title: Cost structure and peer-benchmark bounds
  body: 'Mirador does not publish a P&L, so cost structure must be framed conservatively. The obvious operating cost buckets are discovery and translational work around Mirador360, clinical-trial spending across multiple immunology and fibrotic programs, CMC and outsourced manufacturing scale-up, and corporate overhead. What is not public is the size of any one bucket, whether the company owns meaningful laboratory or manufacturing assets, or whether current program breadth already implies a public-company-like burn profile.


    Public peer disclosures show how wide the possible operating envelope can be. Zura Bio''s Q1 2026 results imply a roughly $102 million annualized R&D-plus-G&A cost base, Apogee Therapeutics implies roughly $331 million, and Alumis reported $477.9 million of FY2025 R&D plus G&A. Those are not Mirador numbers, but they are useful anchors for what a multi-asset immunology company may consume once several clinical programs move in parallel. The result is a clear conclusion with an unclear magnitude: Mirador is likely capital intensive, but the public record is too thin to quantify gross margin, working capital, or true burn.'
