- id: TI003
  title: Unit economics table
  columns:
  - Metric / driver
  - Public reading
  - Best available anchor
  - Underwriting use
  - Caveat
  rows:
  - - Revenue run rate
    - None disclosed
    - No public operating revenue sources retained
    - Confirms business is not yet self-funding
    - Absence of revenue does not imply low scientific value
  - - Gross margin / COGS per patient
    - Not estimable
    - No product, price, or manufacturing disclosures
    - Prevents contribution-margin modeling
    - Will depend on modality, route, and CMC footprint
  - - Quarterly operating-cost proxy
    - Wide peer range
    - Zura ~$25.5M, Apogee ~$82.8M, Alumis ~$119.5M of R&D+G&A per quarter
    - Provides scenario bounds for capital intensity
    - Peer values are not Mirador-specific
  - - Annual burn benchmark
    - Wide peer range
    - Roughly $100M-$480M annualized from public immunology peers
    - Shows how quickly even large private rounds can be consumed
    - Real Mirador burn could sit outside the range
  - - Working capital drivers
    - Mostly undisclosed
    - Clinical enrollment, CRO bills, CMC slots, and corporate overhead are the obvious buckets
    - Highlights cash-timing risk before revenue exists
    - No quantified public cash-conversion cycle
  - - Capex intensity
    - Low to unknown publicly
    - No retained source shows owned manufacturing build-out or large fixed-asset commitments
    - Suggests a likely outsourced model until proven otherwise
    - Public absence is not proof of negligible capex
  - - Sales CAC / payback
    - Not available
    - No commercial organization yet visible
    - Confirms sales efficiency cannot be underwritten today
    - Could change rapidly near launch
  - - Debt service burden
    - None visible publicly
    - No debt or royalty-finance facility disclosed in retained sources
    - Simplifies capital-stack analysis for now
    - Private debt could still exist but is not public
  notes: The only defensible numeric ranges come from public peers, not Mirador. Treat every quantified row here as a scenario anchor rather than a company-specific metric.
