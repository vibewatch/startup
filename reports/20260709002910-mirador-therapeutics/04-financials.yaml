tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Public evidence
  - Current status
  - Recognition reality
  - Financial implication
  - Key unknown
  rows:
  - - Product sales
    - No retained source shows an approved Mirador product or commercial launch.
    - None disclosed
    - No recognized product revenue visible publicly
    - Current revenue quality is effectively zero/undisclosed
    - Launch timing, price, and addressable patient uptake
  - - Collaboration / data partnerships
    - 23andMe collaboration announced for genetics-enabled research support to Mirador360.
    - Strategic, terms undisclosed
    - No upfront, milestone, royalty, or cost-share amount disclosed
    - Could be strategically valuable without being financially material today
    - Whether any cash changed hands and who bears ongoing data-access costs
  - - Out-licensing / regional partnerships
    - No public deal announcements found in retained sources.
    - None disclosed
    - No visible license revenue or milestones
    - Future option, not current economic support
    - Whether Mirador plans to partner ex-US or by asset
  - - Precision-diagnostics / services monetization
    - Mirador360 is presented as a development engine, not a priced service.
    - None disclosed
    - No service contracts or subscription revenue disclosed
    - Platform value is strategic rather than recognized as revenue
    - Whether biomarkers or companion tools will ever be sold separately
  - - Equity financing
    - Launch financing above $400M plus $250M Series B announced in 2026.
    - Active and visible
    - Financing inflow, not operating revenue
    - Current operations are funded by investors rather than customers
    - Remaining cash after undisclosed spend
  notes: Public evidence supports a financing-led model today. Any future revenue model depends on pipeline success or partnership terms that have not been publicly disclosed.
