- id: TI005
  title: Public financial gaps table
  columns:
  - Missing input
  - Why it matters
  - Public status
  - Diligence ask
  rows:
  - - Cash on hand
    - Needed to convert fundraising history into runway
    - Not publicly disclosed
    - Request latest balance sheet and cash bridge since Series B close
  - - Quarterly burn
    - Determines financing dependency and next-round timing
    - Not publicly disclosed
    - Request monthly or quarterly operating cash burn by function
  - - Collaboration economics
    - Needed to know whether partnerships offset spend or are purely strategic
    - Not publicly disclosed
    - Request all cash and milestone terms for 23andMe or other data / pharma deals
  - - Manufacturing and CMC model
    - Drives margin path, scale-up cost, and working-capital needs
    - Not publicly disclosed
    - Request internal-vs-outsourced manufacturing plan and expected COGS drivers
  - - Headcount and functional mix
    - Helps judge productivity and overhead absorption
    - Not publicly disclosed
    - Request current headcount by R&D, tech/data, CMC, and G&A
  - - Commercialization plan
    - Determines whether Mirador will need to build a sales force or partner
    - Not publicly disclosed
    - Request geography-by-geography launch and partnering strategy
  - - Debt, warrants, and investor rights
    - Hidden obligations can compress future equity value
    - Not publicly disclosed in retained sources
    - Request capitalization table, side letters, and any debt or royalty-finance documents
  notes: These are not cosmetic omissions. They are the minimum private datapoints required to turn Mirador from a fundraising story into an underwritable financial model.
