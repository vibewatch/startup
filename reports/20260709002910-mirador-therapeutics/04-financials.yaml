- id: TI004
  title: Capital adequacy table
  columns:
  - Topic
  - Public evidence
  - Read-through
  - Strength / risk
  - Remaining gap
  rows:
  - - Launch financing scale
    - Mirador said it launched with more than $400M in financing.
    - Extraordinary starting balance for a newly formed biotech
    - Strength
    - Current remaining cash unknown
  - - Filing-backed exempt offerings
    - SEC Form D notices show $80M and $332,999,976 offerings, both filed April 3, 2024 under Rule 506(b).
    - Confirms official launch financing with transaction-level detail
    - Strength
    - Does not show current cash or future draws
  - - Series B follow-on
    - Mirador announced a $250M Series B in January 2026.
    - Extended funding base after launch year
    - Strength
    - Exact closing cash and investor rights undisclosed
  - - Total capital raised
    - Official company statement says more than $650M raised.
    - Supports multi-program proof-of-concept ambition
    - Strength
    - Cannot be converted into runway without burn and cash data
  - - Use of funds
    - Company said Series B should advance all current programs to proof-of-concept and support additional candidates.
    - Round appears sized to reach value inflection milestones
    - Strength
    - Milestone-by-milestone budget is not public
  - - Debt / project finance
    - No public debt, royalty financing, or project-finance obligation was retained.
    - Visible capital stack is equity-led
    - Mixed
    - Private obligations cannot be ruled out entirely
  - - Counterparty exposure
    - 23andMe entered Chapter 11 and received $35M DIP financing; any buyer of customer data must honor privacy rules.
    - Data partner disruption could slow or complicate collaboration value capture
    - Risk
    - Whether Mirador replaced, amended, or ring-fenced the collaboration
  - - Runway disclosure
    - None public
    - Outsiders cannot determine whether capital is abundant or already partly consumed
    - Risk
    - Cash on hand and monthly / quarterly burn
  - - Next financing trigger
    - Not disclosed explicitly
    - Likely tied to proof-of-concept readouts or future commercial build-out
    - Risk
    - Exact covenant, board, or investor milestone thresholds
  notes: Mirador scores exceptionally well on fundraising visibility and poorly on operating-liquidity visibility.
