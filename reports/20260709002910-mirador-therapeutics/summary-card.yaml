  topStrengths:
    - >-
      Capital access is exceptional for a private biotech: launch financing exceeded $400M and total capital raised is
      now above $650M.
    - >-
      Mirador360 gives the company a coherent precision-development narrative built around genetics, multiomics, and
      patient stratification across multiple disease areas.
    - >-
      The company has multiple shots on goal across Crohn's disease, ulcerative colitis, rheumatoid arthritis, and
      idiopathic pulmonary fibrosis, with 10+ readouts targeted by end 2027.
    - >-
      Leadership credibility is unusually high for a sub-two-year-old startup because the team is concentrated in
      Prometheus Biosciences alumni and veteran immunology operators.
  topRisks:
    - >-
      Asset-level opacity is still the biggest blocker: public sources do not identify named molecules, routes, detailed
      protocols, or validation metrics for Mirador360.
    - >-
      Partner and data-rights risk is real because 23andMe—the only named public operational counterparty—entered
      Chapter 11 and sits inside privacy-sensitive restructuring.
    - >-
      Commercial value capture is impossible to underwrite from public sources because Mirador discloses no customers,
      no launch channel, no pricing corridor, and no HEOR or payer strategy.
    - >-
      Exact private valuation, current cash, burn, and preference stack remain undisclosed, so round size cannot be
      converted into a precise entry price.
  unresolvedGaps:
    - No public post-money valuation, cap table, liquidation preferences, or current cash bridge.
    - No public asset-level disclosure, protocol details, or diagnostic / assay roadmap.
    - No public commercialization, channel, payer, or customer-retention data.
