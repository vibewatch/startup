      - number: '2.3'
        title: 买方、用户、支付方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Mirador 目标疾病的买方地图由专科医生主导、支付方把关。在 IBD 中，胃肠科医生和学术中心负责诊断、选择疗法并监测复发，商业保险、Medicare 和越来越成熟的用量管理系统控制覆盖。在 RA
              中，风湿科医生掌握处方决策，但通常沿着治疗阶梯推进，先用传统 DMARD，再升级到生物制剂或靶向药。在 IPF
              中，肺科医生和间质性肺病中心管理规模更小但医学上更紧迫的患者群。三个细分里，患者都是使用者，但不是真正的预算所有者；医保计划、PBM 和医疗系统最终决定新疗法能否顺畅进入路径，还是遭遇阶梯限制和事先授权。


              这意味着 Mirador
              的采用路径不是简单地「证明有效」。它必须在支付方和专科医生愿意移动的治疗算法具体节点上，证明更高价值。公开市场准入评论显示，单有监管批准已不够。支付方越来越想看到比较有效性、响应持久性、生活质量数据、总医疗成本逻辑和真实世界证据规划。在已有多个既有产品的慢性品类中，新疗法可以在临床上很有意思，但如果证据包无法证明它应在治疗路径中获得更好位置，采用仍可能很慢。


              Mirador 的精准医学假设在这里有意义。公司主张，遗传学、多组学和生物标志物驱动的分层，能把正确靶点和疗法匹配给正确患者。如果奏效，它可能缩短许多 IBD 和 RA
              治疗旅程中常见的试错周期。但同一层精准能力也带来采用工作：诊断需要验证，临床医生需要可信流程，支付方需要证据证明分层改善真实结局，而不是只增加一项检测成本。因此，从市场分析角度看，买方—用户—支付方地图更有利于能把强临床数据与可信伴随证据结合起来的公司，而不只是有新机制的公司。
