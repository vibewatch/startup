      - number: '6.3'
        title: 持久性、留存与集中度
        blocks:
          - type: paragraph
            body: >-
              所有经典客户持久性指标都不在公开视野里。Mirador 没有披露
              NRR、GRR、流失、续约、合同期限、队列行为或满意度分数。对一家尚未商业化的私营生物科技公司，这符合预期；但外界也因此无法判断交易方是否会回来、站点是否会扩张，或某一个合作方是否主导关系质量。当前公开关系集基本是二元结构：一边是融资交易方，另一边是唯一具名的数据合作方。


              集中度形态也不寻常。传统大客户集中度无法衡量，因为看不到客户收入；但依赖集中度很高，因为外部验证的公开证据很大程度压在 23andMe 和投资人支持上。如果 Mirador
              后续成功商业化，集中度风险很可能转向少数支付方决策、专科中心或合作方地域。今天更准确的理解是交易方和证据集中，而不是收入集中。
