      - number: '7.2'
        title: 监管、法律与隐私风险
        blocks:
          - type: paragraph
            body: >-
              Mirador 的差异化依赖数据驱动的患者选择，这比普通单资产生物科技故事带来更重的监管和隐私暴露面。FDA 材料明确显示，临床研究必须走正式的方案、入选标准和 IND
              路径；当疗法成功取决于找到合适患者时，富集和伴随诊断逻辑会成为核心。同时，HHS、NIH 和 FTC 材料显示，去标识化、泄露通知、基因组数据共享和保密不是软性规范，而是带有运营后果的明确治理框架。


              Mirador
              自身政策给出部分缓释：试验受试者数据会假名化，部分合作方数据会去标识化并由协议约束。但纳入的公开记录仍没有显示第三方数据集的确切权利、审计控制、再识别测试或破产应急安排。因此，风险不只是一次假设性泄露；精准平台能撑多久，可能取决于最不透明的数据权利假设。
