chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、平台与阶段
        blocks:
          - type: paragraph
            body: >-
              Mirador Therapeutics 于 2024 年 3 月 21 日公开亮相，定位为一家总部在 San Diego 的精准医学公司，聚焦免疫介导的炎症和纤维化疾病。管理层从一开始就把 Mirador
              讲成下一代免疫学与炎症公司，而不是单资产生物技术公司。它的一句话商业模式是：用自有精准发现和开发引擎 Mirador360
              找到有遗传学支撑的靶点，打造同类首创或同类最佳疗法，并配套诊断或患者筛选工具，在高度异质的疾病中提高成功概率。


              公司官方材料称，Mirador360 结合人类遗传学、多模态数据、前沿生物学、人工智能和高级分析。启动时，公司称该平台已整合数百万份患者分子谱；到 2026 年 1 月，Mirador
              称该引擎覆盖免疫学和炎症疾病中超过 2.5 million 份患者档案。平台假设贯穿全链条：发现并验证靶点，识别最佳组合或多特异性方案，选择最合适适应症，并分层出最可能受益的患者。这个定位重要，因为
              Mirador 并不销售现成商业产品；它让投资人承销的是「平台加管线」模式，价值取决于数据引擎能否反复改善靶点选择和临床设计。


              启动时，公司有意把边界铺得很宽，但披露仍很谨慎。2024 年 3 月的独立报道称，Mirador 计划布局胃肠、肺部和皮肤疾病，但 McKenna 拒绝披露具体疾病优先级或具名靶点。到 2026 年 1
              月，Mirador 已从隐身期平台叙事推进为临床阶段公司，并公开点名四个适应症——克罗恩病、溃疡性结肠炎、类风湿关节炎和特发性肺纤维化——目标是在 2027 年底前产生超过 10
              个临床读出。披露层级的变化很关键：Mirador 已跨过门槛，成为真正的管线公司，但公开可见度仍停在适应症层面，而不是后期私募投资人通常更希望看到的逐资产层面。
