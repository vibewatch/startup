      - number: '8.2'
        title: 融资背景与价格纪律
        blocks:
          - type: paragraph
            body: >-
              公开融资背景强，但不完整。Mirador 官方披露了 >$400 million 的发布融资，以及一笔 $250 million Series B，使累计融资超过 $650 million。Series B
              的独立第三方报道强调投资人兴趣很强，部分报道还讨论了 IPO 选择权。但纳入的官方来源或可访问第三方来源，都没有披露精确投后估值、清算优先权堆叠或每股定价框架，无法给出干净的私募市场标记。


              缺口很重要。确切价格缺位时，估值纪律必须从价格锚定转向里程碑锚定。投资人应把轮次规模视为资本获取能力的证据，而不是某个特定溢价估值理应成立的证据。好的私募进入流程应取决于资产级披露和读出质量，而不是只看知名投资人的社会证明。因此，这场估值讨论应从谦逊开始，而不是从精确开始。
            claimRefs:
              - CV001
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
