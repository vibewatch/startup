      - number: '7.4'
        title: 合作方、财务与商业风险
        blocks:
          - type: paragraph
            body: >-
              23andMe 是最清晰的可见依赖风险。合作带来去标识化遗传和健康数据洞察，但 23andMe 的 Chapter 11 申请、DIP
              融资、债权申报流程和隐私出售限制显示，外部数据合作即便战略逻辑成立，也会变得不稳定。这不能证明合作失败，但意味着 Mirador 唯一具名的公开合作方已经不能再被当作简单正面信号。


              财务和商业风险同样不对称。Mirador 作为私营生物科技公司已经融到异常多的资本，能缓冲现金跑道风险，但仍未披露当前现金、烧钱速度或渠道计划。如果科学跑通，ASHP 和 CMS
              来源显示，公司会进入一个承受实质预算和定价压力的专科治疗环境。缺少客户采用指标，也缺少已披露上市渠道，意味着公司同时面对证明前和证明后的风险。
