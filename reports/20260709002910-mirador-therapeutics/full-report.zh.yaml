      - number: '5.2'
        title: 平台、管线与运营模式
        blocks:
          - type: paragraph
            body: >-
              Mirador 的公开运营模式在架构层面异常明确。科学页面称，Mirador360
              围绕三项原则构建：设计上精准优先、动态学习系统、面向真实世界交付。愿景页面把它展开成一条序列：用遗传学和多组学发现并验证靶点，借助组合生物学识别增强疗效机会，把靶点匹配到适应症，再分层出正确患者。公司称，这套流程应通过把项目建立在因果生物学而非宽泛经验主义上，降低试验和开发风险。


              管线层比公开资产层更宽。Mirador 的 2026 年融资公告称，公司如今在克罗恩病、溃疡性结肠炎、类风湿关节炎和特发性肺纤维化中拥有多资产临床管线，并预计到 2027 年底产生超过 10
              个读出。但同一批公开材料没有披露资产名称、机制、给药路径或试验 ID。因此，运营模式很清楚——数据引擎进入管线选择，再进入概念验证——但模型内部的具体分子仍大多不透明。
