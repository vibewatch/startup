        - RA 既有玩家加 IPF 后期进入者
        - 成熟 RA 生物制剂，加 IPF 3 期项目
        - 类风湿关节炎和特发性肺纤维化
        - RA 中既有地位，具备 IV/SC 剂型；IPF 中最先进的 LPA1 拮抗剂
        - 没有公开证据显示 BMS 能在两个业务线都解决 Mirador 式精准分层
      - - Boehringer Ingelheim / IPF 产品线
        - IPF 既有玩家
