      - number: '3.2'
        title: IBD 与精准免疫学格局
        blocks:
          - type: paragraph
            body: >-
              最重要的直接信号来自 Merck。Tulisokibart 是 Merck 通过 2023 年收购 Prometheus 买入的抗 TL1A 抗体，2026 年 6 月在 3
              期溃疡性结肠炎中达到主要和关键次要终点，并被定位为首个在该场景下证明 12 周临床缓解的抗 TL1A 生物制剂。Merck 也把 TL1A 描述为免疫纤维化靶点，并在克罗恩病、类风湿关节炎和其他免疫介导疾病中研究
              tulisokibart。从战略上看，Merck 最清楚地证明 Prometheus 式精准 IBD 假设能够吸引资本、大药企背书和高级临床执行。它也意味着 Mirador 实际上是在与自己概念前身的放大版竞争。


              Merck 周围是拥挤的 IBD 既有玩家。AbbVie 已把 Skyrizi 和 Rinvoq 做成双线进攻组合，Skyrizi 主导 IBD 一线 IL-23 捕获，Rinvoq
              覆盖口服、用过生物制剂后以及更难治患者。Johnson & Johnson 正围绕 Tremfya 重塑免疫学产品组合，同时 Stelara
              在生物类似药压力下被侵蚀；它还借助给药路径创新——皮下注射以及静脉诱导——做差异化。Takeda 的 Entyvio 仍被胃肠科医生高度熟悉，Lilly 的 Omvoh 和 Pfizer 的 Velsipity
              则扩大了给药路径和机制选项。对 Mirador 的含义很清楚：在 IBD 中，仅有新颖性不够。新进入者必须胜过或补足一个已经拥有 IL-23 抗体、JAK 抑制、抗整合素、S1P 调节以及后期 TL1A
              生物学的市场。
