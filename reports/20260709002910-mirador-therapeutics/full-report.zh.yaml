      - number: '2.2'
        title: 疾病负担与受证据约束的测算口径
        blocks:
          - type: paragraph
            body: >-
              在 Mirador 已披露的重点领域中，炎症性肠病是最清晰的大规模负担池。美国患病人数估计约为 2.4 million 至 3.1 million 人，占美国人口超过 0.7%——接近每 100 人 1
              人。在这一人群中，溃疡性结肠炎约有 1.25 million 例，克罗恩病约有 1.01 million 例。IBD 的经济意义也很强，因为成本在上升，CDC 引用的美国 IBD 年度医疗成本约为 $8.5
              billion，其中处方药占 71%。这正是更精准疗法可以创造价值的市场：一方面提高缓解率，另一方面减少昂贵的试错式换药。


              类风湿关节炎同样规模可观，但商业特征不同。公开来源显示，美国 RA 患病成年人约 1.3 million 至 1.5 million；RA 又位于更大的关节炎伞形类别中，后者影响超过 53 million
              美国成年人。这个差距很重要：大多数关节炎患病率不是 Mirador 的市场；即便在 RA 内，靶向生物制剂通常也排在初始 DMARD
              治疗之后，而不是全民一线疗法。换句话说，原始患病率高估了商业可及性。尽管如此，RA
              仍是有意义的专科市场，因为疾病活动长期存在，残疾和误工成本很高，只要昂贵免疫调节剂能带来临床上持久的获益，支付方已经习惯为其买单。


              特发性肺纤维化又是另一类问题：患者数量少，后果严重，商业上仍有意义，因为进展凶险、现有选项有限。2025 年一项荟萃分析发现，北美 IPF 汇总患病率为每 100,000 人 27.2，发病率为每 100,000
              人 9.0。NHLBI 将 IPF 描述为一种严重慢性病，目前无法治愈，治疗可能减缓进展，但不能逆转疾病。因此，IPF 是一个更小但需求很高的市场。正确结论不是把这些口径硬挤成一个虚假的 TAM
              数字。公开证据更支持多镜头视角：长期免疫疾病负担巨大，专科支出市场很大，但 Mirador 最可能先进入的适应症，对应的是更窄的先进疗法适用人群。
