      - number: '4.3'
        title: 成本结构与同业基准边界
        blocks:
          - type: paragraph
            body: >-
              Mirador 不发布 P&L，所以成本结构必须保守框定。显而易见的运营成本项包括围绕 Mirador360 的发现和转化工作、多个免疫学和纤维化项目的临床试验支出、CMC
              和外包制造放大，以及公司开销。未公开的是任一成本项的规模、公司是否拥有有意义的实验室或制造资产，以及当前项目宽度是否已经意味着接近上市公司级别的烧钱曲线。


              公开同业披露显示，潜在运营区间可以非常宽。Zura Bio 的 2026 年一季度结果隐含约 $102 million 年化 R&D 加 G&A 成本基数，Apogee Therapeutics 隐含约 $331
              million，Alumis 报告 FY2025 R&D 加 G&A 为 $477.9 million。这些不是 Mirador
              的数字，但可作为多资产免疫学公司在多个临床项目并行推进后可能消耗多少资金的锚点。结果是一个结论清楚、量级不清的判断：Mirador 很可能资本密集，但公开记录太薄，无法量化毛利率、营运资本或真实烧钱速度。
