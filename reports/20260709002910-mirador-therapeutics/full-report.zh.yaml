        title: 图表
        blocks:
          - type: callout
            title: 很少有私营生物技术公司公开把 IBD、RA 和 IPF 作为一个精准免疫纤维化组合来讲
            body: >-
              Mirador 异常之处在于，它公开用同一个遗传学和数据驱动的开发引擎，把炎症性肠病、类风湿关节炎和特发性肺纤维化连在一起。如果 Mirador360
              真能跨多个疾病家族改善靶点选择和患者分层，而不是只在一个产品组合里有效，这种宽度就可能很重要。
            calloutType: strength
