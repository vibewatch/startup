  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 从临床流程看产品定义
        blocks:
          - type: paragraph
            body: >-
              Mirador 正在为免疫介导的炎症和纤维化疾病开发精准药物，但公开产品定义宽于任何单一治疗候选物。在官网首页和愿景页面上，公司把 Mirador360 描述为端到端发现和开发引擎，结合生物学、多模态数据、AI
              和高级分析，用于识别新靶点、选择组合、挑选适应症，并锁定最可能受益的患者。换句话说，产品一部分是管线，一部分是旨在改善管线选择方式的决策系统。


              放在客户流程里，Mirador 试图在医生常规试错序列完全展开之前介入。NIDDK、NIAMS 和 NHLBI 都把克罗恩病、类风湿关节炎和 IPF
              描述为异质性疾病，需要多因素诊断和治疗决策，而不是一项简单检测。Mirador
              的假设是，遗传学和数据引导的分层，能在这些混乱流程中让靶点选择和后续患者选择更精准。公开层面仍缺失的是：这个引擎如何交接到具体、具名产品候选物和临床方案。
