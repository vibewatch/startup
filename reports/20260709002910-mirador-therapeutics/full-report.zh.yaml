  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              多头逻辑很直接。Mirador 为一家刚公开亮相的生物科技公司募集到异常多的私募资本，围绕遗传学、多组学和患者分层搭起精准免疫学平台，并且已经声称拥有覆盖四个主要适应症的多资产临床管线，预计到 2027 年底前有
              10+ 项读出。独立的发布报道和后续融资报道进一步说明，成熟投资人押注的不只是一款单药，而是更广的精准开发架构。


              反向逻辑也同样清楚。公开材料没有披露支撑这一故事所需的具体资产、作用机制、给药途径、方案、当前现金余额、客户证据或确切私募估值。23andMe
              依赖增加合作方风险，而支付方压力来源显示，即便专科资产成功，也可能难以捕获完整理论价值。从估值角度看，Mirador 更像是一张押注未来证据的高质量期权，而不是已经充分去风险的成熟业务组合。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
