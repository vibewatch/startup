  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 买方、用户与支付方分层
        blocks:
          - type: paragraph
            body: >-
              Mirador 还没有公开可见的商业客户群，所以分层必须从它试图进入的照护流程开始。未来用户很可能是管理免疫学和纤维化疾病路径的专科医生：克罗恩病和溃疡性结肠炎中的胃肠科医生，RA 中的风湿科医生，以及 IPF
              中的肺科医生。未来经济买方或守门人是支付方、用药目录、医疗系统、专科药房，以及帮助 Mirador 触达这些专科医生的任何商业化合作伙伴。患者是最终受益者，但在美国专科药模式下，他们不太可能是直接经济买方。


              当前公开利益相关方更窄，也更偏交易性。Mirador
              的隐私政策称，公司处理网站问询、投资者互动，以及临床试验中心员工和研究者的信息，但不直接从患者处收集试验受试者个人信息。其使用条款把网站描述为信息和营销渠道，而不是产品购买渠道。因此，今天可见的用户基础是一个上市前生态——合作伙伴、研究者和感兴趣的利益相关方——而不是付费客户基础。
