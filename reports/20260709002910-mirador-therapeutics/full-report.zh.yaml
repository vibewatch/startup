      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Mirador 由 Mark C. McKenna 创立，他同时担任创始人、董事长和 CEO。McKenna 不是首次操盘生物技术公司：他此前带领 Prometheus Biosciences 完成 2021 年
              IPO，并在 2023 年 6 月以 $10.8 billion 出售给 Merck。Mirador 的运营班底有意沿用那套打法。公开履历显示，Olivier Laurent 任首席科学官，Allison Luo
              任首席医学官，William Sandborn 任首席战略官，Tim Andrews 任首席法务官，Maulik Shah 任首席财务官，Jordan Zwick 任首席商务官，Nori Ebersole
              任首席人事官，Vika Brough 任首席会计官。团队多数人都有 Prometheus 的直接经历；Sandborn 则带来 UC San Diego 以及多次公司构建中的外部临床和炎症性肠病深度。


              董事会和顾问阵容也说明 Mirador 是延续，而不是重置。Mirador 公开点名的董事包括 ARCH Venture Partners 的 Kristina Burow、OrbiMed 的 David
              Bonita、Paul Berns 和 Joseph Papa，把投资人和成熟上市公司运营者都放进治理层。Prometheus
              老班底、蓝筹投资人和知名行业高管的组合是真正优势，能支撑招聘、融资渠道和转化免疫学判断。但关键人物集中也很明显。McKenna
              同时是创始人、董事长、CEO、融资门面和战略叙事者；许多其他高管来自同一家前身公司；网站除具名领导名单外，并未披露委员会架构、独立董事机制或其他治理流程细节。


              从尽调角度看，领导层叙事因此是一把双刃剑。对一家成立不到两年的私营生物技术公司来说，这支团队罕见地可信，Prometheus 之前的结果也给 Mirador 的精准免疫学执行力提供了证据。与此同时，Mirador
              仍高度围绕创始人运转，公开治理披露还没有跟上资本底座的规模。这不会削弱公司的运营能力，但意味着投资人应把治理透明度、继任厚度和决策权清晰度视为仍需追问的尽调议题，而不是默认强项。
