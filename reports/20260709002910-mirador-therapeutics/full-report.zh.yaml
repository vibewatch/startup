        - 进入拥挤 IL-23 市场较晚，早期医生采用速度慢于顶尖可比药上市
      - - Pfizer / Velsipity
        - 邻近口服进入者
        - 大市值药企的口服 UC 资产
        - 溃疡性结肠炎
        - 口服 S1P 机制为既往治疗后的患者提供非注射选择
        - 留存来源中的公开定位仅限 UC；早期采用预计低于最强可比药
