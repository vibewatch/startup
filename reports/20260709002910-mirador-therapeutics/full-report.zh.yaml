      - 为什么重要
      - 合格答案
      - 投资影响
    rows:
      - - 具名资产和方案
        - 需要用产品级证据替代架构故事
        - 清晰的 MOA、给药路径、试验和里程碑
        - 最大的信心解锁点
      - - 股权结构表和当前现金桥
        - 需要把融资历史转化为真实入场价格纪律
        - 投后估值、优先权、持股比例、当前现金和烧钱速度
        - 直接改变入场区间
      - - 诊断与数据权利计划
        - 需要判断精准主张在运营和法律上能否持续
        - 检测路线图，加上合作伙伴数据受损时的应急方案
        - 实质性降低平台逻辑风险
      - - 商业渠道与支付方计划
        - 需要判断获批后价值能否真正被捕获
        - 支付方证据路线图、支持模式和上市合作伙伴策略
        - 降低终值不确定性
      - - 首次概念验证读数
        - 需要验证 Mirador360 是否在创造经济价值
        - 信号强度足以收窄情景分布
        - 继续 / 放弃决策的核心触发器
    notes: 在这些问题得到回答之前，入场纪律应锚定里程碑。
    claimRefs:
      - CV015
      - CV024
      - CV026
      - CV027
      - CV028
      - CV029
  - id: TV006
    title: 价格发现阻碍表
    columns:
      - 缺失输入
      - 为什么会挡住估值精度
      - 什么能收窄区间
    rows:
      - - 确切投后估值
        - 没有它，轮次规模无法换算为经持股比例调整的入场价格
        - 上一轮定价和持股摘要
      - - 优先股堆叠
        - 清算和反稀释条款会实质性改变下行情景
        - 条款清单和优先权明细
      - - 当前现金和烧钱速度
        - 融资总额不等于剩余资产价值
        - 当前资产负债表和烧钱桥
      - - 资产级披露
        - 没有资产，平台叙事无法按产品组合来估值
        - 具名分子、给药路径和里程碑
      - - 商业化计划
        - 终值取决于准入和渠道执行
        - 支付方、HEOR 和渠道路线图
    notes: 这些是最低限度的私募数据点，才能把 Mirador 从情景区间推进到更清晰的价格讨论。
    claimRefs:
      - CV015
      - CV024
      - CV026
      - CV029
      - CV036
