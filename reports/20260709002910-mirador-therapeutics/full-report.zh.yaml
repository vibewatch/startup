      - number: '7.3'
        title: 临床、运营与技术风险
        blocks:
          - type: paragraph
            body: >-
              核心运营问题不是架构听起来是否现代，而是 Mirador360 能否把决策质量提高到足以改变临床结局。Mirador
              称平台是动态、会学习、为真实世界交付而建，但公开来源没有给出定量验证统计、方案级证据或具名资产，外界无法检验这一说法。公司因此暴露在精准生物科技常见失败模式之下：生物标志物或 AI
              叙事很强，却没有公开证据证明它实质性提高阶段转换概率。


              更广泛的临床开发数据也支持这一点。被引用的最大成功率分析发现，药物开发总体成功概率很低，不过有生物标志物指导的试验可以比没有生物标志物的试验表现更好。对 Mirador
              来说，精准逻辑是潜在缓释，不是临床淘汰的豁免。公开材料缺少制造、CMC 和资产级试验设计，也增加了一层执行风险，因为即使生物学假设正确，也可能在研究设计、放大生产或运营排序上失败。
