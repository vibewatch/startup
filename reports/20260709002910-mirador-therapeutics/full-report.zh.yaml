      - number: '3.4'
        title: 护城河耐久性、给药路径经济性与切换摩擦
        blocks:
          - type: paragraph
            body: >-
              Mirador 最好的护城河论点是概念宽度。公开层面，它是少数声称能用同一个精准开发引擎，在 IBD、RA 和 IPF
              中产出同类首创或同类最佳项目的私营公司之一，并把遗传学、机器学习和患者分层作为共同运营层。如果这个引擎真的能选出更好的靶点和更好的响应者子集，Mirador 就有可能避免在每个适应症里以跟随者身份硬碰硬竞争。


              但今天的公开证据在几乎所有实际准备度维度上都更偏向既有公司。Merck 已经拥有阶段靠前的免疫纤维化数据。AbbVie 通过 Skyrizi 和 Rinvoq 拥有销售规模、真实世界证据以及一线 /
              二线覆盖。J&J 正借助 Tremfya 不断扩展的给药路径灵活性和 Icotyde 的口服 IL-23 野心，守住后 Stelara 时代的产品组合。Takeda、Lilly、Pfizer、BMS 和
              Boehringer 已经掌握专科医生关系、患者支持基础设施和支付方经验。价格纪律也在压制新进入者：ICER 2026 年对 Entyvio 的评估认为，证据不支持其相对 ustekinumab
              的溢价，只支持相对 infliximab 的有限溢价；生物类似药也不断重置支付方对成熟免疫学市场成本的认知。因此，竞争结论是选择性而非乐观：Mirador
              可能确有平台角度，但在披露资产层面证据前，市场应假设既有公司拥有当前护城河，而 Mirador 只拥有未来差异化的期权价值。
