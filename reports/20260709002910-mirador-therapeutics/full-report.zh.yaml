companyProfile:
  summary: >
    Mirador Therapeutics 是一家总部位于 San Diego 的私营临床阶段生物技术公司，由 Prometheus Biosciences 前 CEO Mark C. McKenna 于 2024
    年创立。公司把精准开发引擎 Mirador360
    与多资产管线结合，覆盖克罗恩病、溃疡性结肠炎、类风湿关节炎和特发性肺纤维化。公开材料强调，遗传学、多组学、机器学习和患者分层是其发现与开发流程的核心，但资产层面的作用机制、给药路径和试验方案大多未披露。即便如此，Mirador
