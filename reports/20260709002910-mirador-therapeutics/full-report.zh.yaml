      - number: '7.5'
        title: 缓释因素、监控指标与终止标准
        blocks:
          - type: paragraph
            body: >-
              Mirador
              确实有重要缓释因素。资本基础很深，团队公开展示跨学科精准医学经验，公司也至少让部分数据流围绕去标识化、假名化和书面保障运行。科学逻辑也并非没有道理：外部开发数据表明，有生物标志物指导的项目可以提高成功概率。但缓释因素只有在资产级执行中变得可观察，才真正可信。


              最好的监控指标因此都很具体。正面信号包括披露具名资产、清晰的概念验证读出、已披露诊断策略、更多合作方多元化，以及更高的现金 /
              烧钱速度透明度。终止标准包括初始读出失败或含混、关键数据权利明显流失或受到法律损害、无法说清商业化渠道，或任何显示资本消耗却没有缩小平台到产品缺口的迹象。
