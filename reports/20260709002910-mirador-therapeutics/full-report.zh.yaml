        - from: mirador-data
          to: gds
          label: 要求共享治理
        - from: deid
          to: breach
          label: 控制薄弱会抬高泄露风险
        - from: coc
          to: breach
          label: 处置不当会制造法律暴露
    claimRefs:
      - CR010
      - CR011
      - CR012
      - CR013
  - id: FR003
    title: 临床开发风险漏斗
    type: flow
    layout: wide
    summary: 漏斗式流程显示，精准生物技术项目从方案设计到概念验证仍会遭遇损耗。
    data:
      nodes:
        - id: hypothesis
          label: 精准假设
          detail: 遗传学和生物标志物用于选择靶点和可能响应者。
          tone: positive
        - id: protocol
          label: 方案与筛选设计
          detail: FDA 监管下的试验设计把理论落到入排标准和终点。
          tone: neutral
        - id: execution
          label: 试验执行与 CMC
          detail: 入组、运营和生产准备度可能绕开生物学逻辑单独失手。
          tone: warning
        - id: transition
          label: 阶段推进概率
          detail: 即便项目设计审慎，药物开发的基准成功率仍然偏低。
          tone: warning
        - id: poc
          label: 概念验证结果
          detail: 生物标志物逻辑可能提高胜率，但无法消除失败风险。
          tone: neutral
      edges:
        - from: hypothesis
          to: protocol
          label: 必须落地执行
        - from: protocol
          to: execution
          label: 必须跑得干净
        - from: execution
          to: transition
          label: 必须跑赢基准成功率
        - from: transition
          to: poc
          label: 必须拿出清晰信号
    claimRefs:
      - CR014
      - CR015
      - CR016
      - CR017
      - CR023
  - id: FR004
    title: 融资与商业依赖图谱
    type: flow
    layout: wide
    summary: 这张依赖图展示资本、合作伙伴和市场准入压力如何交织成 Mirador 的风险结构。
    data:
      nodes:
        - id: funding
          label: 总融资实力
          detail: 已融资超过 $650M，支撑更宽的研发铺排。
          tone: positive
        - id: cash-opacity
          label: 现金 / 消耗不透明
          detail: 当前流动性和资金跑道尚未公开披露。
          tone: warning
        - id: partner
          label: 23andMe 依赖
          detail: 公开具名合作伙伴卡在重组和隐私约束里。
          tone: warning
        - id: payer
          label: 支付方 / 定价压力
          detail: 专科药预算和政府谈判抬高商业化摩擦。
          tone: warning
        - id: launch
          label: 商业化准备缺口
          detail: 公开资料看不到渠道、支持或采用指标。
          tone: warning
      edges:
        - from: funding
          to: cash-opacity
          label: 总融资不等于资金跑道
        - from: funding
          to: launch
          label: 仍要支撑商业化设计
        - from: partner
          to: launch
          label: 数据证明可能改写市场叙事
        - from: payer
          to: launch
          label: 准入压力左右采用
        - from: cash-opacity
          to: launch
          label: 压低时间表可信度
    claimRefs:
      - CR007
      - CR018
      - CR020
      - CR021
      - CR022
  - id: FV001
    title: 情景估值区间
    type: range
    layout: wide
    summary: 基于公开融资背景、已披露不确定性和精准免疫学可比公司，为 Mirador 勾勒示意性估值区间。这些是情景区间，不是市场报价。
    data:
      items:
        - label: 悲观情景企业价值区间（十亿美元）
          low: 0.6
          high: 1
          displayValue: $0.6B-$1.0B
          detail: 假设首次读数含混或延后，披露继续不透明，估值向资本托底的期权价值收缩，而不是享受高溢价平台价值。
          tone: warning
        - label: 基准情景企业价值区间（十亿美元）
          low: 1
          high: 1.8
          displayValue: $1.0B-$1.8B
          detail: 假设出现一两个可信验证点、融资通道继续打开，执行风险有所收窄，但尚未完成公开层面的全面去风险。
          tone: neutral
        - label: 乐观情景企业价值区间（十亿美元）
          low: 2.5
          high: 4.5
          displayValue: $2.5B-$4.5B
          detail: 假设出现多个强概念验证信号、合作伙伴更多元，并跑出可信的 IPO 或大型合作路径。
          tone: positive
        - label: 迄今总融资额（十亿美元）
          low: 0.65
          high: 0.663
          displayValue: '>$0.65B confirmed'
          detail: 公开披露的融资基础为期权价值提供一个具体下限锚点，但不能替代当前现金，也不是直接估值标记。
          tone: neutral
    approximationNotes: 这些区间不是来自已披露的市场定价，而是根据公开融资规模、上市同业融资基准和当前不确定性推断而来。仅用于尽调框架。
    claimRefs:
      - CV001
      - CV012
      - CV013
      - CV018
      - CV020
      - CV021
      - CV022
  - id: FV002
    title: 价值创造桥
    type: flow
    layout: wide
    summary: 流程图把 Mirador 当前公开优势与必须跨过的里程碑串起来；只有这些里程碑落地，高溢价估值才站得住。
    data:
      nodes:
        - id: capital
          label: 资本基础
          detail: 已融资超过 $650M，给 Mirador 换来时间和选择权。
          tone: positive
        - id: platform
          label: 精准平台叙事
          detail: Mirador360 声称在遗传学、多组学和分层上具备优势。
          tone: positive
        - id: assets
          label: 资产级证据缺口
          detail: 具名分子、给药路径和试验方案尚未公开。
          tone: warning
        - id: readouts
          label: 概念验证读出
          detail: 预计到 2027 年底前出现 10+ 次数据读出，这是公开层面的主要价值触发点。
          tone: neutral
        - id: premium
          label: 高溢价估值理由
          detail: 需要能实质压缩不确定性的数据。
          tone: neutral
      edges:
        - from: capital
          to: platform
          label: 为论点供血
        - from: platform
          to: assets
          label: 必须具体化
        - from: assets
          to: readouts
          label: 必须经受临床检验
        - from: readouts
          to: premium
          label: 必须验证叙事
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV024
  - id: FV003
    title: 下行情景触发图
    type: flow
    layout: wide
    summary: 梳理会把 Mirador 估值区间压向悲观情景的主要事件。
    data:
      nodes:
        - id: weak-data
          label: 数据偏弱或延后
          detail: 概念验证信号含混，资产不透明仍然无解。
          tone: warning
        - id: partner-risk
          label: 合作方或数据权利恶化
          detail: 23andMe 的约束或关键数据流失，会削弱平台可信度。
          tone: warning
        - id: burn-risk
          label: 烧钱不透明
          detail: 里程碑延后时，资本消耗仍藏在黑箱里。
          tone: warning
        - id: payer-risk
          label: 准入价值压缩
          detail: 定价和预算压力限制终局经济性。
          tone: warning
        - id: range-compression
          label: 估值区间压缩
          detail: 高溢价私募叙事向现金加选择权逻辑下滑。
          tone: warning
      edges:
        - from: weak-data
          to: range-compression
          label: 临床论点未能收窄
        - from: partner-risk
          to: range-compression
          label: 平台差异化流失
        - from: burn-risk
          to: range-compression
          label: 资本价值衰减
        - from: payer-risk
          to: range-compression
          label: 未来上行收窄
    claimRefs:
      - CV007
      - CV008
      - CV020
      - CV021
      - CV022
  - id: FV004
    title: 退出准备度决策树
    type: flow
    layout: wide
    summary: 这棵决策树判断 Mirador 是否已具备高溢价私募定价条件，还是更适合继续私募融资，或走公开市场 / 合作路径。
    data:
      nodes:
        - id: current
          label: 当前状态
          detail: 融资强、披露弱，公开层面没有资产级证据。
          tone: neutral
        - id: data-good
          label: 早期数据读出强劲
          detail: 出现多个有说服力的概念验证信号。
          tone: positive
        - id: data-mixed
          label: 数据混杂或不完整
          detail: 期权价值仍在，但高溢价更难自圆其说。
          tone: warning
        - id: exit-window
          label: IPO / 合作窗口
          detail: 只有数据和渠道可信度改善，窗口才会打开。
          tone: positive
        - id: private-bridge
          label: 继续私募融资
          detail: 如果仍有部分价值、但去风险不完整，这一路径更可能出现。
          tone: neutral
      edges:
        - from: current
          to: data-good
          label: 最佳情景路径
        - from: current
          to: data-mixed
          label: 基准 / 悲观路径
        - from: data-good
          to: exit-window
          label: 数据支撑高溢价路线
        - from: data-mixed
          to: private-bridge
          label: 还需要更多证据
    claimRefs:
      - CV016
      - CV023
      - CV024
      - CV025
