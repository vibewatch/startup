      - number: '1.3'
        title: 融资、合作伙伴与资本底座
        blocks:
          - type: paragraph
            body: >-
              Mirador 启动时融资超过 $400 million，这一规模被多家独立媒体称为 2024 年私营生物技术公司最大 A 轮之一，甚至可能刷新临床前公司纪录。本轮由 ARCH Venture Partners
              领投，OrbiMed 和 Fairmount 早期投资，Fidelity Management & Research Company、Point72、Farallon Capital
              Management、Boxer Capital、TCGX、Invus、Logos Capital、Moore Strategic Ventures、Blue Owl Healthcare
              Opportunities、Sanofi Ventures、Woodline Partners、Venrock Healthcare Capital Partners、RTW Investments 和
              Alexandria Venture Investments 参投。Latham & Watkins 另行披露了其为融资提供法律顾问的角色，印证了这次资本事件的规模和时间。


              2025 年第三季度，Mirador 又补上一笔重大融资，完成 $250 million B 轮，并在 2026 年 1 月前把累计募资推高到超过 $650 million。新的 B 轮资金来自 T. Rowe
              Price Investment Management、Adage Capital Partners 和 Fidelity
              的其他基金，多家既有投资人继续跟投。管理层称，资金将用于把所有当前项目推进到概念验证，并支持额外管线候选物。这个资金用途信息值得注意：Mirador
              不是只为一个主导资产输血，而是在推进一个并行开发组合，依赖大额资产负债表和克制的资本配置。


              另一件对资本故事很关键的事件，是 Mirador 2024 年 11 月与 23andMe 的合作。根据协议，Mirador 可访问 23andMe
              研究数据库中一组有针对性的汇总、去标识化遗传和表型数据，用于增强 Mirador360。这不是创收型商业合作，但对 Mirador 的数据战略和伙伴可信度是有分量的信号。它也意味着，Mirador
              护城河叙事的一部分压在外部数据关系的持续访问上，也压在围绕这些数据集的隐私、同意和连续性标准上。
