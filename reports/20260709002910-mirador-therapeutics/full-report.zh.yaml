  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 当前收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              Mirador 目前公开可见的经济模式由资本供给，而不是由收入供给。最强的已验证事实是启动融资和后续融资：公司在 2024 年 3 月启动时称已募资超过 $400 million，2024 年 4 月 3
              日提交的 SEC Form D 通知显示两笔豁免发行合计 $412,999,976。Mirador 随后在 2026 年 1 月 12 日宣布 $250 million B 轮，并称累计融资已超过 $650
              million。这些事件证明融资能力强，但不会创造经营收入。


              本报告留存的公开来源没有披露产品销售、许可收入、里程碑收款、服务收入或任何已确认合作收入。2024 年 11 月与 23andMe 的合作有战略意义，因为它把人类遗传学数据加入
              Mirador360，但新闻稿和二级报道没有披露预付款、里程碑付款、特许权使用费或成本分担。因此，今天的收入质量最好理解为零或未披露的经常性收入，并保留未来通过产品、许可或数据赋能模式变现的期权，而不是一个当下可见的商业模式。
