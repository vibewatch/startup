      - number: '5.3'
        title: 部署、路线图与差异化
        blocks:
          - type: paragraph
            body: >-
              Mirador 的公开路线图以开发为中心，而不是以商业化为中心。公司谈的是把所有当前项目推进到概念验证、到 2027 年底产生超过 10 个读出，并用 Mirador360
              洞察塑造临床策略。对一个生物技术平台来说，这是一条有意义的里程碑路径，但它不是部署细节。公开来源没有披露任何未来疗法将如何与诊断配套，是否会有任何软件层对外开放，也没有披露商业化将由公司单独完成还是与合作伙伴完成。


              差异化在概念层面仍很清楚。Mirador 声称把超过 2.5 million
              份患者档案、人类遗传学、机器学习、多组学和组合生物学放进同一个引擎。独立启动报道也强化了一个判断：投资人押注的是一体化、精准优先的免疫学平台，而不是单资产公司。防御性上的公开证据更薄：留存来源没有展示专利、算法验证统计，也没有展示
              Mirador360 胜过传统靶点选择方法的头对头证据。
