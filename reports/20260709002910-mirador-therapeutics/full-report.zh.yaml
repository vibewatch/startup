      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              资本充足性是 Mirador 公开财务画像中最强的一块。由备案支撑的启动融资对一家新成立生物技术公司来说异常庞大，2026 年 1 月 B 轮又扩大了这一优势。Mirador 明确称，B
              轮将支持当前项目和新增候选物的概念验证，这说明管理层认为该轮规模足以抵达重大价值拐点数据，而不只是续命。本报告留存的公开来源没有披露债务、特许权融资或项目融资义务，所以可见资本结构几乎全是股权。


              但总融资额不等于手上现金。公开来源没有披露 Mirador 当前现金余额、季度烧钱速度或资金跑道，外部人无法知道 $650 million 以上资金还剩多少。还有一个具体交易对手风险：Mirador
              的遗传学数据合作方 23andMe 于 2025 年 3 月进入 Chapter 11，获得 $35 million DIP
              融资，并让任何客户数据出售都受隐私政策和法律约束。由于合作经济条款从未披露，破产事件更像执行和数据访问风险，而不是可见收入受损。
