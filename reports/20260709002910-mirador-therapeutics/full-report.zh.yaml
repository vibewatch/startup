              - CP031
          - type: callout
            title: 市场已经属于掌握生物学、给药路径或支付渠道的公司
            body: >-
              Merck 通过 tulisokibart 掌握最可见的精准 IBD 继任假设；AbbVie 和 J&J 控制增长最快的 IBD 商业化产品组合；Takeda 拥有根深蒂固的 GI 专科医生关系；BMS 加
              Boehringer 定义关键 RA 或 IPF 对照物。在 Mirador 披露资产层面证据前，举证责任几乎完全落在这家初创公司身上，而不是既有公司身上。
