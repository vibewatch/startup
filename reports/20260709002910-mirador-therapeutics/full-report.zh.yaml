  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              Mirador 排名最高的风险并不抽象。第一，公开资产不透明，外界无法验证 Mirador360
              之下的分子、治疗模态和临床设计是否足以支撑平台故事。第二，公司试图把多个项目推向不同疾病领域的概念验证，带来排序、资源分配和临床执行复杂度。第三，公开交易方风险集中在
              23andMe；后者破产后，原本的平台实力叙事变成了连续性和隐私管理问题。


              风险栈再往下，但仍属重大的是融资透明度、商业化准备度、数据治理义务和未来定价压力。Mirador 已有 >$650 million
              的总融资基础，能提供有意义的缓释，但没有回答核心投资判断问题：在资本强度、合作方扰动或支付方怀疑侵蚀选择权之前，公司能否把平台架构转成单个分子层面的成功。
            claimRefs:
              - CR001
