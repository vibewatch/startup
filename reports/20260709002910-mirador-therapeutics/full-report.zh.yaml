        - IBD、银屑病、银屑病关节炎；布局口服 IL-23
        - 唯一在 IBD 中同时强调 IV 和 SC 诱导的 IL-23 产品线；口服 IL-23 肽策略拓宽便利性叙事
        - 产品线换挡仍在进行，Stelara 下滑加大紧迫感
      - - Takeda / Entyvio
        - 既有 GI 专科产品线
        - 大市值药企，GI 关系网络扎实；Entyvio 面临 Medicare 价格审查
        - 溃疡性结肠炎和克罗恩病
        - 胃肠科医生熟悉，缓解数据强，IV 和 SC 选择齐全，专科支持深入
        - ICER 评审压住溢价叙事，SC 扩展更像剂型防守，而不是颠覆式增长
      - - Eli Lilly / Omvoh
        - 邻近增长进入者
        - 大市值药企；IBD 中较新的 IL-23 进入者
