      - number: '5.4'
        title: 信任、隐私与技术结论
        blocks:
          - type: paragraph
            body: >-
              信任和合规在这里很重要，因为 Mirador 的差异化依赖人类数据、患者分层，并最终会影响临床决策。FDA 指南解释，富集策略和伴随诊断可能成为决定哪些患者应接受某种疗法的核心；FDA 的 AI/ML
              设备页面也显示，机器学习工具已经进入正式监管路径。NHGRI 也明确指出，基因组数据共享处在 Common Rule、NIH 数据共享、HIPAA、GINA 和保密框架之内，尤其是信息可识别时。


              Mirador 与 23andMe 的合作同时凸显上行空间和约束。合作把去标识化、汇总的遗传和健康数据加入 Mirador360，但 23andMe
              后续破产以及隐私出售限制说明，数据访问不是没有摩擦的大宗商品。因此，技术结论是选择性的：Mirador 拥有连贯的精准开发架构和强资本支持，但资产层面执行、验证和长期数据控制耐久性的公开证据，仍落后于平台野心。
