      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              需求端增长驱动很清楚。自身免疫和免疫介导疾病带来巨大且持续的负担；IBD
              患病率继续上升；慢性专科药物仍是医院和诊所支出的核心；既有公司仍能贡献数十亿美元级免疫学收入。这些条件为差异化疗法留下空间，只要它们能改善缓解率、持久性或患者筛选。Mirador
              的策略也契合行业从一刀切免疫学转向更好富集人群的愿望，尤其是在许多患者需要轮换多种疗法才找到持久获益的疾病中。


              约束同样清楚，而且对承销可能更关键。联邦政策正在直接施加定价压力：CMS 已为 2026 年首批十种 Medicare Part D 药物谈判最高公平价格，其中包括 Stelara 和
              Enbrel，并预计带来大量总节省。商业支付方现在对可接受净价有了更清晰参照，市场准入分析师预计用量管理、阶梯治疗和返利模式扰动会加强。生物类似药竞争已经体现在既有公司业绩中：Johnson & Johnson
              明确提到 Stelara 压力，AbbVie 的 Humira 下滑也在继续重塑免疫学格局。这些变化不会消灭差异化新疗法的机会，但会压缩跟随型产品的空间。


              对 Mirador
              而言，这意味着只有公司能证明自己不只是泛泛创新，市场才有吸引力。可服务价值位于这样的位置：生物标志物支撑的差异化，能够证明溢价报销、优先路径位置或更好的总成本结果。否则，让市场变大的同一批力量——既有产品巨额支出和成熟支付方审查——也会让市场变得敌意十足。市场章节的结论因此是建设性但选择性很强：Mirador
              瞄准的品类足以支撑独角兽结果，但最终采用曲线更多取决于证据质量、伴随精准策略和报销执行，而不是大标题里的患病率统计。
