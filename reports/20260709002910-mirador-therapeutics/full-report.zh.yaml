      - number: '6.4'
        title: 扩张路径与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              Mirador 合理的扩张逻辑由适应症牵引。如果公司能在一个高价值专科渠道证明更好的靶点或响应者选择，就能把可信度扩到相邻免疫学和纤维化适应症。公开材料已经把这套宽度策略铺到 IBD、RA 和
              IPF。但扩张不会靠自助式采用驱动；真正的驱动力是证据强度、医生信任，以及昂贵专科药类别里的支付方准入。ASHP 的 2026 药品支出展望和 CMS 的 2026
              药品谈判材料都说明，专科治疗正面临越来越强的预算和定价审视。


              商业含义很直接：Mirador 不能只押科学。公司需要证据包赢得专科开方医生，也要顶住支付方阻力。由于还没有公开客户基础，本章判断应是：Mirador
              的客户架构在战略上说得通，但经验数据尚未证明；最难的工作仍在准入、留存和渠道执行。
