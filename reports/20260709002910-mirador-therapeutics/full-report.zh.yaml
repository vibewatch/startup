      - number: '1.4'
        title: 里程碑、披露边界与尽调提示
        blocks:
          - type: paragraph
            body: >-
              Mirador
              的里程碑记录很短，但分量不轻。不到两年里，公司从启动融资走到创业公司奖项认可、战略遗传学合作，并在四个主要免疫纤维化适应症上进入临床阶段披露。这个速度支撑了管理层强调的快速推进和并行执行；从最初未披露的启动管线，到
              2026 年具名适应症组合，也证明公司已实质性越过概念阶段。


              主要警示在于，Mirador 披露的信息仍少于融资规模本应带来的期待。2024 年 3 月的独立报道反复强调，公司启动时没有点名具体靶点、疾病优先级或资产层面细节。即便经过 2026 年 1
              月更新，公开材料仍未披露准确项目名称、公开估值、收入、客户数或准确员工数。这种不透明度对私营临床阶段生物技术公司并不罕见，但它确实压缩了可被独立承销的事实集，也迫使投资人更依赖团队质量、财团质量和未来数据读出。


              因此，公司概览结论是：身份、人才、融资厚度和战略连贯性偏正面，但运营透明度仍不完整。Mirador 看起来是一家严肃、资金充足的公司，延续 Prometheus
              的精准免疫学假设，同时工具更强、野心更大。未解决的尽调工作不再是「是否真有一家公司」——答案显然是有——而是当前资产到底多么差异化、资本底座部署效率如何，以及在概念验证数据广泛公开前，私募市场已经嵌入了怎样的估值或治理预期。
