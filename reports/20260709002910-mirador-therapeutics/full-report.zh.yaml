      - number: '8.4'
        title: 建议、退出准备度与尽调问题
        blocks:
          - type: paragraph
            body: >-
              实际建议是选择性、带条件，而不是任何价格都看多。Mirador
              看起来是一个严肃的精准免疫学平台，也有资本生成有意义的数据，但公开记录不足以支持投资人为一套已经成型的重磅药物叙事付费。纪律严明的投资人可以保持跟进，但进入条款必须反映平台架构与产品证据之间仍然很大的缺口。


              退出准备度也好坏参半。正面读出和友好的市场窗口可能让 IPO 或合作路线变得可信，尤其考虑到 Series B
              规模和公司的投资人阵容。但没有公开来源确认确切定价预期、股权结构、清算优先权或近期商业化准备度。最终尽调问题很直接：披露资产、披露经济条款、披露渠道计划，并拿出至少一个足够强的读出，证明 Mirador360
              创造企业价值，而不只是一个好故事。
