      - number: '3.3'
        title: RA、IPF 与现有疗法竞争
        blocks:
          - type: paragraph
            body: >-
              类风湿关节炎和特发性肺纤维化会改变竞争问题的形状。在 RA 中，Mirador 进入的不是空白市场，而是医学里最流程化的免疫疗法市场之一。AbbVie 的 Rinvoq 已在 RA 获批，并定位于 TNF
              阻断剂使用之后；BMS 的 Orencia 仍是成熟的 IV / SC 生物制剂选项，TNF 阻断剂仍锚定标准序列。这意味着 Mirador
              要么需要一个明显更安全或更靶向的故事，要么需要一个生物标志物筛选人群，在那里既有序列效果不佳。否则，RA 会变成一场分销和报销战，对手都是已经懂得如何穿过治疗阶梯的公司。


              IPF 略有不同。未满足需求很高，但商业覆盖面更窄、更专科。PatSnap 和 Pulmonary Fibrosis Foundation 都显示，nintedanib 和 pirfenidone
              仍定义标准治疗，而且当前没有疗法能逆转纤维化。与此同时，管线很活跃：BMS 的 admilparant（BMS-986278）作为最领先的 LPA1 拮抗剂已进入 3 期，Boehringer
              仍是纤维化肺病的既有领导者。因此，IPF 给 Mirador 的机制差异化空间大于 IBD 或 RA，但患者基数更小，临床门槛也由已经习惯「减缓进展」而非「治愈」疗法的医生设定。横跨 RA 和
              IPF，现有疗法都很强势，因为医生已经可以在既有算法内升级治疗，而无需承担未经验证的私营公司资产风险。
