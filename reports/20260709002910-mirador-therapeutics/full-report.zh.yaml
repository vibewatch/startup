  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争圈层：直接精准医学同行、既有玩家与现有疗法
        blocks:
          - type: paragraph
            body: >-
              Mirador 面对的不是一组干净的竞争对手。它披露的适应症清单——克罗恩病、溃疡性结肠炎、类风湿关节炎和特发性肺纤维化——把公司同时拉进多个重叠战场。第一圈是直接精准免疫学同行，尤其是 Merck 从
              Prometheus 承接的 tulisokibart 项目；该项目明确瞄准免疫纤维化，并已拿到积极的 3 期溃疡性结肠炎数据。第二圈是 IBD 和风湿领域根深蒂固的商业化产品组合：AbbVie 的
              Skyrizi 和 Rinvoq，Johnson & Johnson 的 Tremfya 以及传统 Stelara 底盘，Takeda 的 Entyvio，Lilly 的 Omvoh，Pfizer 的
              Velsipity，以及 BMS 的 Orencia。第三圈是各疾病自己的现有疗法，尤其是 IBD 和 RA 中生物制剂 / JAK 逐级升级，以及 IPF 中 nintedanib / pirfenidone
              标准治疗。


              这个结构很重要，因为 Mirador
              的竞争任务不只是让某个分子在疗效上胜出。它必须说服投资人、临床医生和后续支付方：一组仍未披露的资产，能够胜过已获批药物，嵌入既有治疗算法，并以生物标志物或遗传学改变结局，而不是只增加复杂度。公开层面，Mirador
              最强的差异化点是 Mirador360
              精准开发引擎，以及跨适应症的免疫纤维化框架。公开层面，最弱的一点是缺少资产层面细节。竞争对手已经披露机制、给药路径、真实世界持久性、试验阶段设计，若干案例还有头对头研究；Mirador 没有。
