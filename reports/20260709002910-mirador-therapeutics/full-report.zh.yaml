      - number: '4.5'
        title: 财务结论与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              Mirador
              的财务结论因此分成两面。正面看，公司已经证明自己能募集顶级规模的私募资本，留存来源也支持这样的判断：投资人押注的是一个宽口径精准免疫学平台，而不是单一窄资产。负面看，除融资能力外，所有核心承销输入仍在公开视野中缺失：当前现金、烧钱速度、收入、利润率、员工数、合作经济条款、制造模式和上市计划。这让
              Mirador 更容易让人佩服，而不是建模。


              从尽调角度看，正确姿态不是看空偿付能力，而是对不透明保持谨慎。Mirador
              可能拥有充足资金跑道，但公开层面无法确认。它未来也可能有合作议价能力，但没有公开来源显示管理层能拿到怎样的经济条款。在私有材料补齐这些缺口前，公司应被视为一家高度依赖股权融资的临床阶段生物技术公司，融资渠道异常强，公开财务透明度也异常弱。
