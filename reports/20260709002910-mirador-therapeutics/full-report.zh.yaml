      - number: '4.2'
        title: GTM、定价与单位经济可见度
        blocks:
          - type: paragraph
            body: >-
              Mirador
              在公开视野中仍处于商业化前，所以常规生物技术上市指标都不存在。没有公开价目表，没有毛到净价讨论，没有面向客户的收入确认政策，没有销售团队足迹，没有专科药房或分销模式，也没有披露患者支持或市场准入计划。缺少这些指标本身并不意味着一家临床阶段公司薄弱，但确实意味着投资人还不能像评估已上市疗法业务那样，承销获客成本、回本期、渠道组合或销售效率转化。


              更重要的承销点在于，Mirador 的公开牵引力是科学和财务层面的，不是商业层面的。管理层谈的是多资产概念验证计划和大型精准免疫学数据引擎，不是客户或已确认收入。所以 GTM
              问题不是「今天的销售模型效率多高？」而是「如果管线跑通，需要怎样的上市模型？」公开来源尚未回答这个问题。
