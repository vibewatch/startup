      - number: '8.3'
        title: 可比公司组合与情景框架
        blocks:
          - type: paragraph
            body: >-
              最干净的公开可比公司并不完全匹配，但仍有用。Alumis 显示，2024 年公开市场投资人愿意为一个拥有明确主资产和自研分析叙事的精准免疫学平台提供多少资金。Apogee 和 Zura
              则显示，公开市场免疫学投资人对多资产或管线中心型故事能容忍的现金厚度和现金跑道逻辑。按这个标准，Mirador 的私募融资基础已经很大，支持公司即使上市前也属于高梯队私募融资队列。


              缺失的一块是去风险阶段。公开可比公司披露资产、试验数据和财务报表；Mirador 没有。因此，本章情景区间应被理解为选择权区间，而不是硬估值。乐观情景假设出现多个有说服力的概念验证信号，并且 IPO
              或合作窗口打开。基准情景假设早期证据可信，但不透明持续存在，并需要分阶段融资。悲观情景假设资本仍然充足，但由于证据延迟、含混或运营受损，平台溢价压缩到现金加选择权价值。
