  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类经济性
        blocks:
          - type: paragraph
            body: >-
              Mirador
              的市场不能定义为「所有自身免疫病」，甚至也不应定义为全部免疫学药物支出。更有用的边界更窄：慢性免疫介导的炎症和纤维化疾病。在这些疾病里，专科医生开具先进疗法，支付方主动管理报销，更好的患者筛选可能显著改善疗效或经济性。Mirador
              自己把免疫学和炎症描述为美国第二大药物支出品类，大药企结果也支撑这个框架。AbbVie 仅 2025 年就取得 $30.4 billion 免疫学收入，Bristol Myers Squibb 仍从
              Orencia 获得 $3.7 billion、从 Sotyktu 获得近 $0.3 billion。Johnson & Johnson 报告称，免疫学增长由 Tremfya 和 Simponi 推动，即便
              Stelara 已面临巨大生物类似药压力。因此，按既有产品销售额看，这个品类已经极其庞大。


              但宽口径品类支出不等于 Mirador 的可服务市场。公开证据显示，Mirador
              当前管线重点集中在炎症性肠病、类风湿关节炎和特发性肺纤维化。也就是说，现实市场边界是这些慢性专科疾病里的先进处方疗法，以及最终可能出现的伴随诊断或分层工具。它不包括急性炎症护理、非处方症状缓解、多数初级保健中的关节炎管理，也不包括
              Mirador 尚未表达项目意图的其他自身免疫类别。「约每 10 人 1 人」的广义自身免疫负担统计，对长期相关性有方向意义，但会大幅夸大一家临床阶段生物技术公司近期能触达的昂贵靶向疗法患者池。


              这个市场有经济吸引力，因为疾病慢性、疗效结果重要，现有疗法已经吞下很大预算。但它也按疾病领域碎片化，每个领域都有不同专科医生、路径和支付方规则。可信的 Mirador
              市场分析必须同时抓住两点：免疫纤维化疾病已是数百亿美元流动的品类，但 Mirador 能现实进入的子集更窄，是一个重证据的专科疗法市场，每个适应症都必须单独跨过报销和流程门槛。
