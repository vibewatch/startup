- id: trust-privacy-and-technical-verdict
  title: Trust, privacy, and technical verdict
  body: 'Trust and compliance matter here because Mirador''s differentiator depends on human data, patient stratification, and eventually clinical decision consequences. FDA guidance explains that enrichment strategies and companion diagnostics can become central to determining which patients should receive a therapy, and FDA''s AI/ML device page shows that machine-learning-enabled tools already sit inside formal oversight pathways. NHGRI also makes clear that genomic data sharing sits within Common Rule, NIH data-sharing, HIPAA, GINA, and confidentiality frameworks, especially when information is identifiable.


    Mirador''s 23andMe collaboration highlights both the upside and the constraint. The collaboration adds de-identified, aggregated genetic and health data to Mirador360, but 23andMe''s later bankruptcy and privacy-sale restrictions show that data access is not a frictionless commodity. The technical verdict is therefore selective: Mirador has a coherent precision-development architecture and strong capital backing, but public proof of asset- level execution, validation, and long-term data-control durability still trails the ambition of the platform.'
