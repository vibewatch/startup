- id: TE005
  title: Trust, compliance, and quality-controls table
  columns:
  - Topic
  - Public evidence
  - Why it matters
  - Remaining gap
  rows:
  - - Enrichment strategy governance
    - FDA guidance explains how enrichment can support effectiveness demonstrations in clinical trials.
    - Mirador's precision thesis may depend on enrichment logic being regulator-ready.
    - No Mirador trial design or enrichment plan is public
  - - Companion diagnostic readiness
    - FDA says companion diagnostics can be essential for safe and effective therapy use.
    - A stratified therapy may eventually need assay co-development.
    - No public diagnostic partner or assay program disclosed
  - - AI / ML oversight
    - FDA maintains oversight pathways for AI/ML-enabled devices.
    - Any patient-facing or decision-critical tool can face validation and governance demands.
    - No public description of whether Mirador will externalize any algorithmic component
  - - Genomic privacy
    - NHGRI summarizes Common Rule, NIH data-sharing, HIPAA, GINA, and confidentiality protections.
    - Human-data access is core to the platform's trust model.
    - Exact consent, governance, and data-rights structure are undisclosed
  - - Partner data durability
    - 23andMe privacy commitments and bankruptcy show that data access can be constrained by legal process.
    - Dependency risk can affect platform continuity.
    - No public amendment or contingency plan is disclosed
  notes: Trust controls are more visible at the industry-policy level than at the Mirador-specific implementation level.
