company:
  name: Mirador Therapeutics
chapter:
  number: 5
  title: Product & Technology
  summary: 'Mirador''s public product is not a launched drug but a precision-development engine designed to turn genetics, multi-modal data, and analytics into better target selection, combination logic, and patient stratification across immuno-fibrotic diseases. The company calls that engine Mirador360 and now pairs it with a multi-asset clinical pipeline spanning Crohn''s disease, ulcerative colitis, rheumatoid arthritis, and idiopathic pulmonary fibrosis. Public materials are strong on concept and weak on molecule-level disclosure: Mirador explains the data-and-biology workflow, but it does not identify specific assets, mechanisms, routes, diagnostic assays, or validation metrics. The technology story is therefore promising but still mostly architectural rather than experimentally transparent.'
sections:
- id: product-definition-in-clinical-workflow-terms
  title: Product definition in clinical-workflow terms
  body: 'Mirador is building precision medicines for immune-mediated inflammatory and fibrotic diseases, but the public product definition is broader than any single therapeutic candidate. On its homepage and vision pages, the company frames Mirador360 as an end-to-end discovery and development engine that combines biology, multi-modal data, AI, and advanced analytics to identify novel targets, select combinations, choose indications, and pinpoint patients most likely to benefit. In other words, the product is partly a pipeline and partly a decision system that is meant to improve how the pipeline is chosen.


    In customer-workflow terms, Mirador is trying to intervene before a physician''s conventional trial-and-error sequence fully plays out. NIDDK, NIAMS, and NHLBI each describe Crohn''s disease, rheumatoid arthritis, and IPF as heterogeneous conditions that require multi-factor diagnosis and treatment decisions rather than one simple test. Mirador''s thesis is that genetics- and data-guided stratification can make target selection and later patient selection more precise in exactly those messy workflows. What remains missing publicly is the handoff from that engine to specific, named product candidates and clinical protocols.'
