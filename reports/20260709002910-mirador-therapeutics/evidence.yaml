evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-gap
    missingEvidence: >-
      Board committee charters, observer rights, independence thresholds, and any governance policies beyond the
      named-director roster.
    whyItMatters: >-
      Governance transparency is thin relative to the capital base and could affect oversight quality, decision speed,
      and investor-protection terms.
    diligencePath: Request board deck index, committee list, charter summaries, and most recent board composition memo.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Exact Series B valuation, share class terms, liquidation preferences, and employee option-pool refresh data.
    whyItMatters: >-
      The company-overview chapter can verify financing size but cannot judge entry discipline or dilution without the
      actual pricing and security terms.
    diligencePath: Request cap table, Series B term sheet summary, and any investor-rights agreement excerpts.
    relatedQuestionRefs:
      - QO022
  - type: private-evidence-only
    severity: material
    topic: commercial-disclosure
    missingEvidence: Current headcount, operating budget, revenue, customer metrics, and commercial timeline disclosures.
    whyItMatters: These metrics anchor scale, burn, and organizational readiness but are absent from the public record.
    diligencePath: >-
      Request KPI dashboard covering headcount by function/site, monthly burn, and any business-development or
      diagnostics revenue.
    relatedQuestionRefs:
      - QO023
      - QO024
  - type: missing-source
    severity: material
    topic: asset-disclosure
    missingEvidence: Named public assets with exact targets, modalities, and stage-by-stage development history.
    whyItMatters: Program-level differentiation cannot be underwritten fully while public sources stop at the indication level.
    diligencePath: Request confidential pipeline sheet, target rationale deck, and IND/CTA status tracker for each current program.
    relatedQuestionRefs:
      - QO025
  - type: private-evidence-only
    severity: minor
    topic: investor-ownership
    missingEvidence: Current ownership percentages and any concentration among launch and Series B backers.
    whyItMatters: The public investor list shows quality but not control, signal hierarchy, or financing dependence.
    diligencePath: Request post-Series-B ownership table and pro-rata participation history.
    relatedQuestionRefs:
      - QO009
      - QO010
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone chronology
    missingEvidence: >-
      Additional dated product, regulatory, hiring, and business-development milestones between launch and the 2026
      update.
    whyItMatters: >-
      The public chronology is good enough for a high-level overview but not yet dense enough to prove a
      quarter-by-quarter operating cadence.
    diligencePath: >-
      Request internal milestone tracker or board-update timeline to fill private milestones between public
      announcements.
    relatedTableRefs:
      - TO004
  - type: enumeration-incomplete
    severity: material
    topic: IPF sizing uncertainty
    missingEvidence: >-
      A harmonized U.S.-only diagnosed and treated IPF patient count that can be combined cleanly with IBD and RA
      estimates.
    whyItMatters: >-
      Without a clean IPF numerator, any multi-indication SAM model risks overstating or understating Mirador's fibrotic
      contribution.
    diligencePath: Request payer-claims or epidemiology cut specific to U.S. diagnosed-and-treated IPF patients.
    relatedQuestionRefs:
      - QM021
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: advanced-therapy eligibility
    missingEvidence: >-
      Actual proportions of IBD and RA patients who are advanced-therapy candidates in Mirador's intended launch
      geographies.
    whyItMatters: >-
      The public prevalence figures are too broad to underwrite a precise SAM without line-of-therapy and payer-coverage
      conversion data.
    diligencePath: >-
      Request epidemiology-to-commercial funnel by indication, including line of therapy, prior failures, and payer
      coverage assumptions.
    relatedQuestionRefs:
      - QM022
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: diagnostic reimbursement
    missingEvidence: >-
      Evidence on payer willingness to reimburse companion diagnostics or biomarker workflows in immunology outside
      oncology.
    whyItMatters: >-
      Mirador's precision thesis is economically stronger if biomarker selection is reimbursed rather than absorbed by
      providers or sponsors.
    diligencePath: Request companion-diagnostic reimbursement strategy and any payer feedback or pilot data.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM003
      - TM004
  - type: missing-source
    severity: minor
    topic: ex-us-market-access
    missingEvidence: >-
      A public Europe and ex-U.S. market-access view for IBD, RA, and IPF that matches the retained U.S. evidence
      quality.
    whyItMatters: >-
      Public U.S. evidence is stronger than ex-U.S. evidence, so global TAM claims would be overstated without
      additional support.
    diligencePath: Add EMA, NICE, and EU epidemiology / reimbursement sources in a refresh cycle.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: first-beachhead indication
    missingEvidence: >-
      Mirador's confidential indication-prioritization logic, including the first commercial beachhead and biomarker
      strategy by program.
    whyItMatters: >-
      The most important market question is not just total size but which segment Mirador can enter first with the
      strongest evidence and payer fit.
    diligencePath: Request portfolio prioritization deck and launch-sequence assumptions by asset.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: Mirador asset-level disclosure
    missingEvidence: Public materials do not identify the specific assets, mechanisms, or comparator strategy for each Mirador program.
    whyItMatters: Without asset-level disclosure, competitive judgments remain category-level rather than molecule-level.
    diligencePath: >-
      Request confidential pipeline deck with mechanism, route, stage, and intended comparator set for each disclosed
      indication.
    relatedQuestionRefs:
