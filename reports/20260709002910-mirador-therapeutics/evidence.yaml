      - TP002
  - type: private-evidence-only
    severity: material
    topic: Mirador market-access plan
    missingEvidence: >-
      No public information describes Mirador's future pricing, contracting, specialty-pharmacy, or patient-support
      model.
    whyItMatters: Route and access strategy are now a central part of competition in IBD and RA, not a post-approval detail.
    diligencePath: >-
      Request market-access roadmap including launch sequencing, hub model, payer evidence plan, and support-program
