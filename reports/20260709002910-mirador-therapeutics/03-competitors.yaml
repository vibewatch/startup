callouts:
- calloutType: strength
  title: Few private biotechs publicly frame IBD, RA, and IPF as one precision-immuno-fibrotic portfolio
  body: Mirador is unusual in publicly linking inflammatory bowel disease, rheumatoid arthritis, and idiopathic pulmonary fibrosis through one genetics- and data-driven development engine. That breadth could matter if Mirador360 genuinely improves target selection and patient stratification across multiple disease families rather than only within one franchise.
  claimRefs:
  - CP001
  - CP002
  - CP031
- calloutType: risk
  title: The market already belongs to companies that own either the biology, the route, or the payer channel
  body: Merck owns the most visible precision-IBD successor thesis through tulisokibart; AbbVie and J&J control the fastest-growing IBD commercial franchises; Takeda owns entrenched GI specialist relationships; and BMS plus Boehringer define critical RA or IPF comparators. Until Mirador discloses asset-level proof, the burden of evidence rests almost entirely on the startup, not on the incumbents.
