- id: ibd-and-precision-immunology-landscape
  title: IBD and precision-immunology landscape
  body: 'The most important direct signal comes from Merck. Tulisokibart, the anti-TL1A antibody Merck bought through its 2023 Prometheus acquisition, met primary and key secondary endpoints in Phase 3 ulcerative colitis in June 2026 and is positioned as the first anti-TL1A biologic to show 12-week clinical remission in that setting. Merck also describes TL1A as an immuno-fibrosis target and is studying tulisokibart in Crohn''s disease, rheumatoid arthritis, and other immune-mediated diseases. Strategically, that makes Merck the clearest evidence that the Prometheus-style precision-IBD thesis can attract capital, large-pharma sponsorship, and advanced clinical execution. It also means Mirador is effectively competing against a scaled version of its own conceptual predecessor.


    Around Merck sits a crowded IBD incumbent field. AbbVie has turned Skyrizi and Rinvoq into a paired offensive line, with Skyrizi dominating frontline IL-23 capture in IBD and Rinvoq covering oral, post-biologic, and more refractory patients. Johnson & Johnson is reshaping its immunology franchise around Tremfya while Stelara erodes under biosimilar pressure, and it is using route innovation—subcutaneous as well as intravenous induction—to differentiate. Takeda''s Entyvio remains deeply familiar to gastroenterologists, while Lilly''s Omvoh and Pfizer''s Velsipity widen the set of route and mechanism options. The implication for Mirador is clear: in IBD, novelty alone is not enough. A new entrant must beat or complement a field that already offers IL-23 antibodies, JAK inhibition, anti-integrins, S1P modulation, and now late-stage TL1A biology.'
