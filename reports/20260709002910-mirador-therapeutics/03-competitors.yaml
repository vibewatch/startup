  rows:
  - - Merck / tulisokibart (Prometheus-derived)
    - Direct precision-immunology peer
    - Big Pharma; Prometheus acquired for $11B in 2023; Phase 3 UC data in 2026
    - IBD first, with RA and other IMIDs in development
    - Anti-TL1A biology explicitly framed around immuno-fibrosis; broad clinical program; precision-IBD heritage
    - Still biologic-led and Merck-owned; Mirador could differentiate only if its undisclosed assets show superior responder selection or broader platform productivity
  - - AbbVie / Skyrizi + Rinvoq
    - Incumbent commercial franchise
    - Skyrizi $17.5B and Rinvoq $8.3B in 2025 sales; paired immunology platform
    - Crohn's disease, ulcerative colitis, rheumatoid arthritis and adjacent IMIDs
    - Frontline IL-23 strength plus oral JAK follow-on, real-world data, payer leverage, global commercial force
    - Crowded class, JAK safety baggage for Rinvoq, and biosimilar overhang from Humira show that scale does not eliminate price pressure
  - - Johnson & Johnson / Tremfya + Stelara + Icotyde
    - Incumbent franchise transition
    - Tremfya $5.2B 2025 sales; Stelara legacy base under biosimilar pressure
    - IBD, psoriasis, psoriatic arthritis; oral IL-23 ambition
    - Only IL-23 franchise emphasizing both IV and SC induction in IBD; oral IL-23 peptide strategy broadens convenience story
    - Franchise transition is still in progress and Stelara erosion raises urgency
  - - Takeda / Entyvio
    - Incumbent specialist GI franchise
    - Large-cap pharma with entrenched GI relationships; Medicare price scrutiny on Entyvio
    - Ulcerative colitis and Crohn's disease
    - Gastroenterologist familiarity, strong remission data, IV and SC options, deep specialty support
    - ICER review limits premium pricing narrative and SC expansion appears more like formulation defense than disruptive growth
  - - Eli Lilly / Omvoh
    - Adjacent growth entrant
    - Large-cap pharma; newer IL-23 entrant in IBD
    - Ulcerative colitis and Crohn's disease
    - First IL-23 approved in UC; IV induction plus SC maintenance; clear biologic packaging
    - Later entrant in a crowded IL-23 market and slower early prescriber adoption than top analog launches
  - - Pfizer / Velsipity
    - Adjacent oral entrant
    - Large-cap pharma oral UC asset
    - Ulcerative colitis
    - Oral S1P mechanism gives non-injectable option for post-prior-therapy patients
    - UC-only public positioning in retained sources; early adoption projected below strongest analogs
  - - BMS / Orencia and admilparant (BMS-986278)
    - RA incumbent plus IPF late-stage entrant
    - Established RA biologic plus Phase 3 IPF program
    - Rheumatoid arthritis and idiopathic pulmonary fibrosis
    - RA incumbency with IV/SC format; most advanced LPA1 antagonist in IPF
    - No public evidence that BMS solves Mirador-style precision stratification across both franchises
  - - Boehringer Ingelheim / IPF franchise
    - IPF incumbent
    - PatSnap describes Boehringer as current IPF category leader with multiple active Phase 3 programs
    - Idiopathic pulmonary fibrosis and progressive fibrotic lung disease
    - Controls standard-of-care expectations in fibrosis and sets the clinical comparator bar
    - Narrower precision-medicine narrative than Mirador; still focused on slowing progression rather than responder selection
  - - Status quo / sequential specialty care
    - Substitute / internal standard
    - Already embedded across specialist practices and formularies
    - IBD, RA, and IPF treatment algorithms
    - Physicians can already escalate among TNF, IL-23, JAK, anti-integrin, S1P, and antifibrotic options without taking private-company risk
    - Does not address Mirador's platform thesis, but remains the easiest default if Mirador's proof is not clearly superior
  notes: This profile table covers the most decision-relevant direct, incumbent, adjacent, and substitute options visible in public materials as of the run date; it does not attempt to enumerate every biologic, biosimilar, or early-stage pipeline program.
