- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Mirador360 enables better target and patient selection across multiple diseases
    - Public materials still do not reveal asset-level proof, biomarkers, or head-to-head logic
    - High
    - Request asset-by-asset mechanism map, biomarker plan, and any internal responder-segmentation evidence
  - - Cross-indication immuno-fibrotic platform is broader than single-disease rivals
    - Merck already owns the Prometheus/TL1A precision-IBD analog and is expanding into RA and fibrosis-adjacent disease
    - High
    - Compare Mirador programs directly against tulisokibart and successor precision-IBD programs
  - - Large balance sheet allows parallel development
    - Incumbents combine larger balance sheets with approved-product cash flow and global distribution
    - High
    - Underwrite whether $650M+ is enough to reach differentiated proof-of-concept before another raise
  - - Potential for biomarker-backed premium positioning
    - ICER-style value scrutiny, biosimilars, and payer step edits compress premium room
    - High
    - Request preliminary pricing/access strategy and evidence-generation plan for reimbursement
  - - Mirador may exploit white space in IPF precision medicine
    - Boehringer and BMS already define the current and next IPF comparator set
    - Medium
    - Ask for precise IPF mechanism, route, and comparator assumptions
  - - RA entry could leverage precision rather than brute-force share gain
    - RA algorithms already favor incumbents with oral JAK or established biologics
    - Medium
    - Request target patient subset, safety differentiation thesis, and sequencing assumptions in RA
  notes: Severity reflects the likely impact on Mirador's ability to establish durable differentiation rather than on overall drug-market attractiveness.
