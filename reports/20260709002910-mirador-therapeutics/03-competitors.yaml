  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Mirador asset-level disclosure
    missingEvidence: Public materials do not identify the specific assets, mechanisms, or comparator strategy for each Mirador program.
    whyItMatters: Without asset-level disclosure, competitive judgments remain category-level rather than molecule-level.
    diligencePath: Request confidential pipeline deck with mechanism, route, stage, and intended comparator set for each disclosed indication.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP001
    - TP002
  - type: private-evidence-only
    severity: material
    topic: Mirador market-access plan
    missingEvidence: No public information describes Mirador's future pricing, contracting, specialty-pharmacy, or patient-support model.
    whyItMatters: Route and access strategy are now a central part of competition in IBD and RA, not a post-approval detail.
    diligencePath: Request market-access roadmap including launch sequencing, hub model, payer evidence plan, and support-program assumptions.
    relatedQuestionRefs:
    - QP021
    - QP025
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: Biomarker comparison versus Merck precision lineage
    missingEvidence: No public source explains whether Mirador's patient-selection logic is materially better than the Prometheus/Merck precision-IBD approach.
    whyItMatters: This is the single most important direct-peer comparison in the chapter.
    diligencePath: Request biomarker architecture, response-enrichment evidence, and any internal benchmarking against Prometheus-era methods.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP002
  - type: missing-source
    severity: minor
    topic: Exact public net-pricing and route-preference benchmarks
    missingEvidence: Retained public sources provide only partial pricing and adoption signals rather than a clean apples-to-apples net-price and route-preference comparison across IBD and RA brands.
    whyItMatters: Packaging and access pressure are clear, but the field still lacks a clean public answer on when oral convenience outweighs biologic depth in durable prescribing behavior.
    diligencePath: Add payer-contracting, prescriber-survey, or claims sources that quantify the tradeoff between route convenience and efficacy depth in a refresh cycle.
    relatedQuestionRefs:
    - QP021
    - QP022
    - QP023
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: Commercial-partner assumptions
    missingEvidence: Mirador has not publicly disclosed whether it plans to commercialize alone, partner by geography, or out-license specific programs.
    whyItMatters: Go-to-market structure determines whether Mirador can realistically challenge companies with embedded specialist and payer channels.
    diligencePath: Request commercialization decision tree by indication and geography, including partnership triggers.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP004
