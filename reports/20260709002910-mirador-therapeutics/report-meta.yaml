companyProfile:
  summary: >
    Mirador Therapeutics is a San Diego-based private clinical-stage biotech founded in 2024 by former Prometheus Biosciences CEO Mark C. McKenna. The company combines a precision-development engine, Mirador360, with a multi-asset pipeline spanning Crohn's disease, ulcerative colitis, rheumatoid arthritis, and idiopathic pulmonary fibrosis. Public materials emphasize genetics, multiomics, machine learning, and patient stratification as the core of its discovery and development process, while leaving asset-level mechanisms, routes, and trial protocols largely undisclosed. Mirador has nevertheless raised more than $650 million across launch and Series B financings, giving it unusual private-market depth for a pre-commercial biotech.
  foundedDate: '2024-03-20'
  founders:
    - name: Mark C. McKenna
      role: Founder, Chairman & CEO
      background: Former CEO of Prometheus Biosciences, which was acquired by Merck in 2023; Mirador is publicly framed as a continuation of that precision-immunology operating playbook.
      claimRefs: [CO013, CO014, CO015]
  foundingLocation: 'San Diego, CA'
  headquarters: 'San Diego, CA'
  productSummary: >
    Mirador360 is an end-to-end precision discovery and development engine that integrates human genetics, multi-modal data, analytics, and patient stratification to support a multi-asset pipeline in immuno-fibrotic disease.
  customerFocus: Gastroenterologists, rheumatologists, pulmonologists, payers, and potential commercialization partners in specialty immunology and fibrosis.
  businessModel: Pre-commercial precision-biotech model funded by private equity financing today, with future value expected from successful clinical readouts, partnerships, and eventual product commercialization.
  stage: 'Private clinical-stage biotech / pre-commercial'
