  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-gap
    missingEvidence: Board committee charters, observer rights, independence thresholds, and any governance policies beyond the named-director roster.
    whyItMatters: Governance transparency is thin relative to the capital base and could affect oversight quality, decision speed, and investor-protection terms.
    diligencePath: Request board deck index, committee list, charter summaries, and most recent board composition memo.
    relatedQuestionRefs:
    - QO020
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Exact Series B valuation, share class terms, liquidation preferences, and employee option-pool refresh data.
    whyItMatters: The company-overview chapter can verify financing size but cannot judge entry discipline or dilution without the actual pricing and security terms.
    diligencePath: Request cap table, Series B term sheet summary, and any investor-rights agreement excerpts.
    relatedQuestionRefs:
    - QO022
  - type: private-evidence-only
    severity: material
    topic: commercial-disclosure
    missingEvidence: Current headcount, operating budget, revenue, customer metrics, and commercial timeline disclosures.
    whyItMatters: These metrics anchor scale, burn, and organizational readiness but are absent from the public record.
    diligencePath: Request KPI dashboard covering headcount by function/site, monthly burn, and any business-development or diagnostics revenue.
    relatedQuestionRefs:
    - QO023
    - QO024
  - type: missing-source
    severity: material
    topic: asset-disclosure
    missingEvidence: Named public assets with exact targets, modalities, and stage-by-stage development history.
    whyItMatters: Program-level differentiation cannot be underwritten fully while public sources stop at the indication level.
    diligencePath: Request confidential pipeline sheet, target rationale deck, and IND/CTA status tracker for each current program.
    relatedQuestionRefs:
    - QO025
  - type: private-evidence-only
    severity: minor
    topic: investor-ownership
    missingEvidence: Current ownership percentages and any concentration among launch and Series B backers.
    whyItMatters: The public investor list shows quality but not control, signal hierarchy, or financing dependence.
    diligencePath: Request post-Series-B ownership table and pro-rata participation history.
    relatedQuestionRefs:
    - QO009
    - QO010
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone chronology
    missingEvidence: Additional dated product, regulatory, hiring, and business-development milestones between launch and the 2026 update.
    whyItMatters: The public chronology is good enough for a high-level overview but not yet dense enough to prove a quarter-by-quarter operating cadence.
    diligencePath: Request internal milestone tracker or board-update timeline to fill private milestones between public announcements.
    relatedTableRefs:
    - TO004
