- id: partner-financial-and-commercial-risk
  title: Partner, financial, and commercial risk
  body: '23andMe is the clearest visible dependency risk. The collaboration adds de-identified genetics and health-data insights, but 23andMe''s Chapter 11 filing, DIP financing, claims process, and privacy-sale restrictions show that external data partnerships can become unstable even when their strategic logic is sound. That does not prove the collaboration failed, but it does mean Mirador''s single named public partner can no longer be treated as a simple positive signal.


    Financial and commercial risks are similarly asymmetrical. Mirador has raised unusual amounts of capital for a private biotech, which buffers runway risk, but it still does not disclose current cash, burn, or channel plan. And if the science works, ASHP and CMS sources show the company would enter a specialty-therapy environment under material budget and pricing pressure. Lack of customer adoption metrics and lack of disclosed launch channels mean the company faces both pre-proof and post-proof risk at the same time.'
