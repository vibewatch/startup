- id: TR002
  title: Regulatory / legal risk register
  columns:
  - Risk area
  - Public evidence
  - Why it matters
  - Current mitigation
  - Remaining gap
  rows:
  - - Patient-selection regulation
    - FDA enrichment and companion-diagnostic materials
    - Precision claims may require regulator-ready assay and trial logic
    - Mirador publicly emphasizes stratification and genetics
    - No disclosed assay, diagnostic partner, or regulatory plan
  - - Human-subject protocol risk
    - FDA clinical-research materials emphasize protocol design and selection criteria
    - Trial design mistakes can erase scientific advantage
    - Mirador says it is built for precision-driven clinical strategy
    - No public protocol detail or trial IDs
  - - Genomic data-sharing obligations
    - NIH GDS policy and CoC materials require careful handling of human genomic research data
    - Mishandled data rights can impair research and trust
    - Mirador describes pseudonymized and de-identified handling in policy text
    - No public institutional-certification or governance detail
  - - De-identification and re-identification risk
    - HHS de-identification guidance explains safe harbor and expert-determination standards
    - Weak de-identification can create privacy or legal failure points
    - Mirador says collaborator data is de-identified and safeguarded by agreement
    - No public method, audit, or testing disclosure
  - - Breach-notification exposure
    - HHS and FTC breach rules show notification duties for unsecured health information
    - Incident response can become reputationally and operationally expensive
    - No public Mirador incident disclosed in retained sources
    - No public breach-response or cybersecurity controls disclosed
  notes: The privacy stack is visible at the policy level but not at the operational-control level.
