- id: regulatory-legal-and-privacy-risk
  title: Regulatory, legal, and privacy risk
  body: 'Mirador''s differentiation depends on data-driven patient selection, which creates a heavier regulatory and privacy surface than a generic one-asset biotech story. FDA materials make clear that clinical research must run through formal protocol, selection-criteria, and IND pathways, and that enrichment and companion-diagnostic logic can become central when therapy success depends on identifying the right patients. At the same time, HHS, NIH, and FTC materials show that de-identification, breach notification, genomic-data sharing, and confidentiality are not soft norms; they are explicit governance frameworks with operational consequences.


    Mirador''s own policies partially mitigate this by stating that trial-subject data is pseudonymized and that some collaborator data is de-identified and governed by agreements. But the retained public record still does not show exact rights, audit controls, re-identification testing, or bankruptcy contingencies for third-party datasets. The risk is therefore not simply a hypothetical breach; it is that a precision platform may be only as durable as its least visible data-rights assumption.'
  claimRefs:
