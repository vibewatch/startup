summary:
  headline: |
    Mirador 兼具顶级私募融资和可信的精准免疫学平台；但公开记录对资产、估值和商业化准备度仍过于不透明，难以支撑已充分计价的溢价逻辑；建议继续研究，置信度中等、风险高。
