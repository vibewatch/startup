  topStrengths:
    - 对一家私营 biotech 来说，融资能力异常强：启动融资超过 $400M，累计融资现在高于 $650M。
    - Mirador360 让公司讲出一条自洽的精准开发主线，围绕遗传学、多组学和多疾病领域的患者分层展开。
    - >-
      公司在 Crohn's disease、ulcerative colitis、rheumatoid arthritis 和 idiopathic pulmonary fibrosis 上有多个下注点，并计划到 2027 年底拿到
      10+ 个读出。
    - 对一家成立不到两年的 startup 来说，管理层可信度异常高，因为团队集中来自 Prometheus Biosciences 校友和资深免疫学操盘手。
  topRisks:
    - 资产层面不透明仍是最大卡点：公开来源没有披露具名分子、给药路径、详细方案或 Mirador360 验证指标。
    - 合作伙伴和数据权利风险真实存在，因为唯一公开具名运营对手方 23andMe 已进入 Chapter 11，并处在隐私敏感的重组中。
    - 公开来源无法承保商业价值捕获，因为 Mirador 没披露客户、上市渠道、价格区间，也没有披露 HEOR 或 payer 策略。
    - 精确私募估值、当前现金、烧钱速度和优先股堆叠仍未披露，因此轮次规模无法换算成精确入场价格。
  unresolvedGaps:
    - 没有公开轮后估值、股权结构表、清算优先权或当前现金桥接。
    - 没有公开资产级披露、方案细节或诊断 / assay 路线图。
    - 没有公开商业化、渠道、payer 或客户留存数据。
