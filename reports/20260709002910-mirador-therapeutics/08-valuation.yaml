- id: TV001
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Bullish read
  - Bearish read
  - What would break the tie
  rows:
  - - Platform thesis
    - Mirador360 could improve target and responder selection across multiple major IMIDs
    - Public architecture may outrun product evidence
    - Named assets plus persuasive proof-of-concept
  - - Capital access
    - '>$650M raised implies elite investor backing and deep optionality'
    - Gross capital can mask undisclosed burn and preference overhang
    - Current cash bridge and cap table detail
  - - Pipeline breadth
    - Four-indication scope creates multiple shots on goal
    - Breadth can dilute focus and inflate execution risk
    - Program-level prioritization and budget allocation
  - - Commercial future
    - Precision positioning may support differentiated value capture
    - No customer, channel, or HEOR proof is public
    - Launch model and payer-evidence plan
  - - Partner proof
    - 23andMe validated external interest in the platform
    - Partner distress weakens reference quality and data-rights durability
    - Updated partner roster and contingency plan
  notes: Mirador remains investable as a thesis, but not yet easily markable as a price.
