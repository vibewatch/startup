- id: TV004
  title: Bull / base / bear assumption table
  columns:
  - Scenario
  - Core assumptions
  - Evidence that supports it
  - Main failure mode
  rows:
  - - Bull
    - Multiple proof-of-concept wins, partner diversification, and public-market or partnership opening
    - Deep capital base, broad pipeline, platform architecture, and strong investor roster
    - Data disappoint or platform premium fails to translate into molecule-level value
  - - Base
    - One or two credible signals emerge, but opacity remains high and financing stays milestone-linked
    - Public funding and pipeline breadth support continued option value
    - Readouts are mixed, delaying clean repricing
  - - Bear
    - Readouts are delayed, ambiguous, or weak while burn and channel opacity persist
    - Public record already shows high uncertainty and partner dependence
    - Premium private narrative compresses toward cash-and-optionality value
  notes: Scenarios are intentionally assumption-led because exact private pricing is not publicly disclosed.
