  - CV026
  - CV027
  - CV028
  - CV029
- id: TV006
  title: Price-discovery blockers table
  columns:
  - Missing input
  - Why it blocks valuation precision
  - What would tighten the range
  rows:
  - - Exact post-money valuation
    - Without it, round size cannot be translated into ownership-adjusted entry price
    - Last-round pricing and ownership summary
  - - Preference stack
    - Liquidation and anti-dilution terms change downside materially
    - Term-sheet and preference schedule
  - - Current cash and burn
    - Gross financing does not equal remaining asset value
    - Current balance sheet and burn bridge
  - - Asset-level disclosure
    - Platform narrative cannot be valued like a product portfolio without assets
    - Named molecules, routes, and milestones
  - - Commercialization plan
    - Terminal value depends on access and channel execution
    - Payer, HEOR, and channel roadmap
  notes: These are the minimum private datapoints required to convert Mirador from a scenario range into a sharper price discussion.
