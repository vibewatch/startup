- id: comparable-set-and-scenario-framing
  title: Comparable set and scenario framing
  body: 'The cleanest public comparables are not exact, but they are useful. Alumis shows what public investors were willing to fund for a precision-immunology platform with a defined lead asset and a proprietary analytics story in 2024. Apogee and Zura show the cash depth and runway logic public immunology investors tolerate for multi-asset or pipeline-centric stories. Mirador''s private funding base is already large by that standard, which supports the idea that the company belongs in an upper-tier private-financing cohort even before listing.


    The missing piece is de-risking stage. Public comps disclose assets, trial data, and financial statements; Mirador does not. That is why the scenario ranges in this chapter should be read as optionality bands rather than hard marks. The bull case assumes multiple convincing proof-of-concept signals and an open IPO or partnering window. The base case assumes credible early proof but continuing opacity and staged financing. The bear case assumes that capital remains substantial but the platform premium compresses toward cash-and-optionality value because proof is delayed, ambiguous, or operationally impaired.'
