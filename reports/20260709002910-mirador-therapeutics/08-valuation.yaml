- id: TV005
  title: Final diligence and entry-discipline table
  columns:
  - Ask
  - Why it matters
  - What a good answer looks like
  - Investment impact
  rows:
  - - Named assets and protocols
    - Needed to replace architecture story with product-level evidence
    - Clear MOAs, routes, trials, and milestones
    - Biggest confidence unlock
  - - Cap table and current cash bridge
    - Needed to convert financing history into real price discipline
    - Post-money, preferences, ownership, current cash, and burn
    - Changes entry range directly
  - - Diagnostic and data-rights plan
    - Needed to judge whether precision claims are operationally and legally durable
    - Assay roadmap plus contingency plans if partner data becomes impaired
    - De-risks platform thesis materially
  - - Commercial channel and payer plan
    - Needed to know if post-approval value can actually be captured
    - Payer-evidence roadmap, support model, and launch partner strategy
    - Reduces terminal-value uncertainty
  - - First proof-of-concept readouts
    - Needed to validate whether Mirador360 is creating economic value
    - Signal strength strong enough to narrow scenario spread
    - Central trigger for go / no-go decision
  notes: Entry discipline should be milestone-anchored until these asks are answered.
  claimRefs:
