  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: IPF sizing uncertainty
    missingEvidence: A harmonized U.S.-only diagnosed and treated IPF patient count that can be combined cleanly with IBD and RA estimates.
    whyItMatters: Without a clean IPF numerator, any multi-indication SAM model risks overstating or understating Mirador's fibrotic contribution.
    diligencePath: Request payer-claims or epidemiology cut specific to U.S. diagnosed-and-treated IPF patients.
    relatedQuestionRefs:
    - QM021
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: advanced-therapy eligibility
    missingEvidence: Actual proportions of IBD and RA patients who are advanced-therapy candidates in Mirador's intended launch geographies.
    whyItMatters: The public prevalence figures are too broad to underwrite a precise SAM without line-of-therapy and payer-coverage conversion data.
    diligencePath: Request epidemiology-to-commercial funnel by indication, including line of therapy, prior failures, and payer coverage assumptions.
    relatedQuestionRefs:
    - QM022
    relatedTableRefs:
    - TM002
    - TM003
  - type: missing-source
    severity: material
    topic: diagnostic reimbursement
    missingEvidence: Evidence on payer willingness to reimburse companion diagnostics or biomarker workflows in immunology outside oncology.
    whyItMatters: Mirador's precision thesis is economically stronger if biomarker selection is reimbursed rather than absorbed by providers or sponsors.
    diligencePath: Request companion-diagnostic reimbursement strategy and any payer feedback or pilot data.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM003
    - TM004
  - type: missing-source
    severity: minor
    topic: ex-us-market-access
    missingEvidence: A public Europe and ex-U.S. market-access view for IBD, RA, and IPF that matches the retained U.S. evidence quality.
    whyItMatters: Public U.S. evidence is stronger than ex-U.S. evidence, so global TAM claims would be overstated without additional support.
    diligencePath: Add EMA, NICE, and EU epidemiology / reimbursement sources in a refresh cycle.
    relatedQuestionRefs:
    - QM024
  - type: private-evidence-only
    severity: material
    topic: first-beachhead indication
    missingEvidence: Mirador's confidential indication-prioritization logic, including the first commercial beachhead and biomarker strategy by program.
    whyItMatters: The most important market question is not just total size but which segment Mirador can enter first with the strongest evidence and payer fit.
    diligencePath: Request portfolio prioritization deck and launch-sequence assumptions by asset.
    relatedQuestionRefs:
    - QM025
