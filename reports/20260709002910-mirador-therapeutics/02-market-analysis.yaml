- id: growth-drivers-and-adoption-constraints
  title: Growth drivers and adoption constraints
  body: 'The demand-side growth drivers are clear. Autoimmune and immune-mediated diseases impose a large and persistent burden; IBD prevalence continues to rise; chronic specialty drugs remain central to hospital and clinic spending; and incumbents still produce multi-billion-dollar immunology revenues. These conditions create room for differentiated therapies that can improve remission, durability, or patient selection. Mirador''s strategy also aligns with a broader industry desire to move from one-size-fits-all immunology toward better-enriched populations, especially in diseases where many patients cycle through multiple therapies before finding durable benefit.


    The constraints are equally clear and arguably more important for underwriting. Federal policy is now exerting direct pricing pressure: CMS negotiated maximum fair prices for the first ten Medicare Part D drugs for 2026, including Stelara and Enbrel, and projects large aggregate savings. Commercial payers now have clearer reference points for what they regard as acceptable net pricing, and market-access analysts expect utilization management, step therapy, and rebate-model disruption to intensify. Biosimilar competition is already visible in incumbent performance: Johnson & Johnson explicitly cited Stelara pressure, and AbbVie''s Humira erosion continues to reshape the immunology landscape. These changes do not eliminate opportunity for differentiated new therapies, but they do shrink the room for me-too products.


    For Mirador, this means the market is attractive only if the company can show more than generic innovation. The addressable value sits where biomarker-backed differentiation can justify premium reimbursement, preferred placement, or better total-cost outcomes. Without that, the same forces that make the market large—heavy incumbent spend and sophisticated payer scrutiny—also make it hostile. The market chapter verdict is therefore constructive but selective: Mirador is targeting a category big enough to support a unicorn outcome, but its eventual adoption curve will be governed by evidence quality, companion precision strategy, and reimbursement execution far more than by headline prevalence statistics.'
