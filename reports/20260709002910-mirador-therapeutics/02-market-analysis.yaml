- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Autoimmune disease burden around one in ten people
    - positive
    - long-term
    - Supports large strategic TAM for immune-directed innovation
    - Test whether Mirador's chosen segments map to that burden rather than just citing it
  - - Rising IBD prevalence and multi-billion-dollar cost burden
    - positive
    - current
    - Creates large budget pool where better-targeted therapies can matter
    - Quantify where Mirador can improve remission or reduce switching costs
  - - Large incumbent immunology revenue base
    - positive
    - current
    - Proves buyers already pay at scale for effective chronic immune therapies
    - Benchmark Mirador targets against current spend concentrations
  - - Biomarker-driven stratification potential
    - positive
    - mid-term
    - Could differentiate response rates and justify premium placement
    - Request biomarker plan, assay readiness, and payer evidence roadmap
  - - CMS negotiated prices and IRA reference benchmarks
    - negative
    - current
    - Increases pricing pressure and constrains premium-room assumptions
    - Model launch price against post-IRA payer expectations
  - - Prior authorization, step therapy, and utilization management
    - negative
    - current
    - Can slow uptake even after approval
    - Request market-access strategy by indication and site of care
  - - Biosimilar pressure on incumbent brands
    - mixed
    - current
    - Creates desire for better therapies but also resets price expectations
    - Assess whether Mirador must beat lower-priced standards or merely match efficacy
  - - Evidence expectations beyond regulatory approval
    - negative
    - current to mid-term
    - Payers want comparative effectiveness, durability, and total-cost evidence
    - Check whether upcoming trials are designed for coverage decisions, not just approval
  notes: Direction reflects likely impact on Mirador adoption, not on the overall attractiveness of the entire category.
