company:
  name: Mirador Therapeutics
chapter:
  number: 2
  title: Market Analysis
  summary: 'Mirador addresses a very large but uneven market: immune-mediated inflammatory disease burden is population-scale, while the practical commercial opportunity narrows to high-cost specialty therapies in inflammatory bowel disease, rheumatoid arthritis, and idiopathic pulmonary fibrosis. Public evidence shows strong demand and multi-billion-dollar incumbent spend—especially in IBD and broader immunology—but also tightening payer controls, biosimilar price pressure, and a growing requirement for biomarker-backed evidence beyond regulatory approval. The key conclusion is that Mirador''s TAM is broad, but its underwritable near-term SAM is much smaller and defined more by specialist workflow and reimbursement friction than by prevalence alone.'
sections:
- id: market-boundary-and-current-spend
  title: Market boundary and why the category is economically attractive
  body: 'Mirador''s market should not be defined as “all autoimmune disease,” nor even as all immunology drug spend. The useful boundary is narrower: chronic immune-mediated inflammatory and fibrotic diseases where specialty physicians prescribe advanced therapies, payers actively manage reimbursement, and better patient selection could materially improve efficacy or economics. Mirador itself frames immunology and inflammation as the second-largest drug-spend category in the United States, and large-cap pharma results support that framing. AbbVie generated $30.4 billion of immunology revenue in 2025 alone, while Bristol Myers Squibb still generated $3.7 billion from Orencia and nearly $0.3 billion from Sotyktu. Johnson & Johnson reported that immunology growth was driven by Tremfya and Simponi, even while Stelara faced large biosimilar pressure. The category is therefore already enormous on an incumbent-sales basis.


    But broad category spend is not the same thing as Mirador''s addressable market. Public evidence suggests that Mirador''s current pipeline focus clusters around inflammatory bowel disease, rheumatoid arthritis, and idiopathic pulmonary fibrosis. That means the practical market boundary is advanced prescription therapies—and eventually companion diagnostics or stratification tools—within these chronic specialty diseases. It excludes acute inflammatory care, over-the-counter symptom relief, most primary-care arthritis management, and unrelated autoimmune categories where Mirador has not signaled program intent. The broad autoimmune-burden statistic of around one in ten people is directionally useful for long-run relevance, but it dramatically overstates the near-term pool of patients who could receive expensive targeted therapies from a clinical-stage biotech.


    The market is economically attractive because the diseases are chronic, outcomes matter, and current therapies already absorb very large budgets. Yet it is fragmented across disease areas with different specialists, pathways, and payer rules. A credible market analysis for Mirador therefore has to preserve both truths at once: immuno-fibrotic disease is a category where tens of billions of dollars already change hands, but the subset Mirador can realistically enter is a narrower, evidence-intensive specialty-therapy market where each indication must clear its own reimbursement and workflow gate.'
