    - Specialists, lab partners, and market-access teams
    - Patients selected for therapy response likelihood
    - Payers deciding test coverage
    - Evidence-generation and diagnostic reimbursement budgets
    - Validated biomarker utility that changes treatment decisions
  notes: Buyer map highlights that Mirador sells into specialist decision pathways but wins or loses at the payer and evidence threshold layers.
