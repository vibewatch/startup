tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Broad immune-mediated inflammatory disease specialty therapies
    - Advanced branded biologics, targeted small molecules, specialty-administered immune modulators
    - OTC symptom relief, acute-care anti-inflammatories, unrelated autoimmune categories
    - Specialists prescribe; payers and PBMs fund
    - Shows why Mirador is entering a category with very large incumbent spend
  - - Inflammatory bowel disease (Crohn's disease + ulcerative colitis)
    - Chronic prescription therapies, biologics, oral targeted therapies, monitoring and related specialist care
    - General GI symptom management without IBD diagnosis
    - Gastroenterologists, health systems, commercial/Medicare/Medicaid payers
    - Likely largest disclosed near-term burden pool
  - - Rheumatoid arthritis targeted therapy
    - DMARD escalation, biologics, targeted oral immunology drugs
    - Broad non-RA arthritis population and OTC pain management
    - Rheumatologists and payer formularies
    - Large but highly algorithmic market where differentiation must fit treatment ladders
  - - Idiopathic pulmonary fibrosis specialty treatment
    - Disease-modifying or progression-slowing specialist therapies and future targeted adjuncts
    - General pulmonary care unrelated to fibrotic progression
    - Pulmonologists / ILD centers and specialty payers
    - Smaller patient count but high unmet need and severity
  - - Precision-diagnostic / stratification layer
    - Validated biomarker tests, patient-selection workflows, and evidence generation tied to therapy choice
    - Consumer genetics and unvalidated exploratory testing
    - Providers, labs, payers, and pharma market-access teams
    - Could become a multiplier if Mirador can prove selection improves outcomes
  notes: Market definition separates broad autoimmune burden from the narrower specialty-therapy and companion-diagnostic slices that Mirador could realistically monetize.
