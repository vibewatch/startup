  - - PubMed meta-analysis / IPF prevalence
    - '2025'
    - North America
    - 27.2 per 100,000 prevalence; 9.0 per 100,000 incidence
    - Systematic review and meta-analysis of 26 studies
    - high
    - North American pooled rate is not directly a U.S.-only commercial market figure
  - - Incumbent revenue lens / AbbVie + BMS
    - '2025'
    - Global branded revenue
