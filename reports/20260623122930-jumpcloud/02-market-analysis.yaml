  - id: section-market-sizing
    title: TAM, SAM, and SOM sizing — multiple lenses and contradictory estimates
    body: >
      No single authoritative figure covers JumpCloud's exact addressable market because the
      company operates across IAM, UEM, and emerging agentic identity, and most published reports
      size these categories independently. This section assembles a bottom-up view from the
      published estimates with contradictions preserved.

      The broadest TAM lens is total IAM spend. Published 2026 estimates conflict materially:
      Grand View Research cites $26.2 billion (11.3% CAGR through 2033); The Business Research
      Company cites $25.23 billion for 2026 (15.7% CAGR to 2030); MarketsandMarkets implies
      approximately $28.5 billion in 2026 (interpolated from its $25.96 billion 2025 base and
      10.4% CAGR), projecting $42.61 billion by 2030; Mordor Intelligence places the cloud-only
      IAM software sub-segment at $10.91 billion in 2026. Fortune Business Insights publishes
      a 2026 IAM estimate in the $37 billion range when managed services are included. These
      spreads — from $25 billion to $37 billion for the same year — reflect scope disagreements
      about whether managed services, CIAM, and professional services are included. None of the
      published figures can be independently verified at the full-population level.

      Adding UEM ($8.85 billion, Mordor Intelligence, 2026) to the cloud-IAM sub-segment
      ($10.91 billion) yields a combined $19.76 billion cloud identity plus endpoint management
      TAM for 2026. This is the closest analog to JumpCloud's full product scope, though it
      under-counts on-premises IAM and ZTNA adjacency value.

      The Serviceable Addressable Market (SAM) for JumpCloud is constrained by its go-to-market
      focus on organizations with 50–5,000 employees, Linux/Mac/Windows heterogeneous fleets,
      and no deep legacy Oracle or SAP IAM infrastructure to protect. Published sources do not
      isolate this segment. An informal triangulation: if SMEs represent approximately 19.7%
      of cloud IAM spend (Mordor's SME share figure) applied to the $10.91 billion cloud IAM
      total and 24.95% of UEM spend applied to $8.85 billion, the combined SME cloud identity
      plus UEM opportunity is approximately $2.15 billion plus $2.21 billion, or roughly
      $4.3 billion for 2026. This triangulation is estimates-upon-estimates and should be treated
      as an illustrative bound, not an audited figure.

      JumpCloud's Serviceable Obtainable Market (SOM) is unquantifiable from public evidence.
      The company's $200 million estimated ARR (GetLatka, 2024, unconfirmed) against this
      $4.3 billion SME segment estimate implies approximately 4–5% SAM penetration. The agentic
      IAM market (non-human identity governance) has no mature analyst sizing as of June 2026;
      Gartner is cited in press coverage as predicting 70% of AI projects may be delayed due to
      governance failures by 2027, signaling demand but not quantifying it.
