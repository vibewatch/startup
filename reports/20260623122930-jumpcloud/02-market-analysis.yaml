  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: sam-sizing-unverifiable
      missingEvidence: >-
        No analyst report reviewed isolates the 50–5,000 employee cloud directory and UEM
        spending market that constitutes JumpCloud's primary SAM. The $4.3 billion SAM
        estimate is derived by applying Mordor's SME share percentage to Mordor's cloud IAM
        and UEM totals — two rounds of estimation. The true SAM requires either a company
        prospectus or a commissioned segmentation study defining 50–5,000 employee cloud
        identity spend.
      whyItMatters: >-
        Incorrect SAM sizing affects JumpCloud's addressable penetration calculus and
        valuation multiples; a smaller actual SAM would imply higher current penetration
        (less headroom) while a larger SAM implies greater growth potential.
      diligencePath: >-
        Request JumpCloud's internal TAM/SAM sizing model and customer revenue by segment
        size under NDA; alternatively, commission a segmentation study from a tier-one
        analyst firm.
      relatedTableRefs:
        - TM002
      relatedQuestionRefs:
        - QM001
        - QM012

    - type: missing-source
      severity: material
      topic: agentic-iam-tam
      missingEvidence: >-
