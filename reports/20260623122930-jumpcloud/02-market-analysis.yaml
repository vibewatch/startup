  - id: FM003
    title: TAM / SAM / SOM sizing pyramid
    type: pyramid
    layout: standard
    summary: >-
      JumpCloud's TAM includes the combined cloud IAM and UEM markets ($19.76 billion in 2026);
      the SME-focused SAM is estimated at approximately $4.3 billion using published SME share
      percentages; SOM is unquantifiable from public evidence.
    data:
      items:
        - label: Total Addressable Market (TAM)
          value: "$19.8B"
          detail: >-
            Cloud IAM ($10.91B, Mordor 2026) + UEM ($8.85B, Mordor 2026); excludes on-prem IAM
            and ZTNA adjacency. Combined cloud identity and device management platform opportunity.
        - label: Serviceable Addressable Market (SAM)
          value: "~$4.3B"
          detail: >-
            SME share of cloud IAM (19.7% of $10.91B = ~$2.15B) + SME share of UEM
            (24.95% of $8.85B = ~$2.21B); illustrative estimate based on Mordor SME share data.
            JumpCloud primarily targets 50–5,000 employee organizations.
        - label: Serviceable Obtainable Market (SOM)
          value: "Not sized"
          detail: >-
            ~4–5% SAM penetration implied by $200M estimated ARR vs. $4.3B SAM;
            third-party ARR estimate, not company-confirmed. SOM not isolatable from public data.
    approximationNotes: >-
      SAM is estimates-upon-estimates: applies Mordor SME share percentages to Mordor 2026 market
      totals. TAM represents cloud-only IAM plus UEM and is an undercount of JumpCloud's full
      opportunity (excludes on-prem IAM, ZTNA adjacency, and nascent agentic IAM). Treat as
      illustrative lower-bound, not an audited figure.
    claimRefs:
      - CM010
      - CM011
      - CM012
      - CM013
      - CM014

  - id: FM004
    title: Buyer adoption journey — from awareness to deployment
    type: flow
    layout: standard
    summary: >-
      JumpCloud's buyer journey is short for SMBs (days to weeks with self-serve trial) and
      lengthens materially for mid-market organizations requiring Active Directory migration
      or SAML federation with existing applications.
    data:
      nodes:
        - id: awareness
          label: Awareness
          detail: >-
            G2 reviews (#1 Cloud Directory, Summer 2026), peer referrals from IT communities,
            and MSP partner channels are primary discovery paths for JumpCloud.
          tone: neutral
        - id: trial
          label: Free trial / self-serve evaluation
          detail: >-
            JumpCloud's free tier (10 devices, 10 users) enables hands-on evaluation without
            a sales cycle. SMB buyers often self-qualify; competitive POC typical at 100+ employees.
          tone: positive
        - id: tech-validation
          label: Technical validation
          detail: >-
            Agent deployment across Windows, macOS, and Linux; LDAP/SAML federation test with
            Google Workspace or M365. Cross-OS enrollment is the critical technical gate.
          tone: neutral
        - id: budget-approval
          label: Business case and budget approval
          detail: >-
            Sub-200 employee: CFO/CEO approval within one budget cycle at ~$9–$20 per user/month.
            Mid-market: multi-quarter procurement; SOC 2 report review and data processing agreement.
          tone: neutral
        - id: deployment
          label: Deployment
          detail: >-
            SMB: days to weeks. Mid-market AD migration: weeks to months. MSP: phased rollout
            across end-customer base via multi-tenant console.
          tone: positive
        - id: expansion
          label: Expansion and renewal
          detail: >-
            Module upsell (PAM, MDM, SSO, SaaS Spend Management) drives NRR. Customers who
            onboard more modules have higher stickiness per JumpCloud's per-feature pricing model.
          tone: positive
      edges:
        - from: awareness
          to: trial
        - from: trial
          to: tech-validation
        - from: tech-validation
          to: budget-approval
        - from: budget-approval
          to: deployment
        - from: deployment
          to: expansion
    approximationNotes: >-
      Journey stages derived from JumpCloud's public pricing page, G2 reviews, and JumpCloud's
      official product messaging. No company-confirmed conversion rate or churn data was
      available from public sources.
    claimRefs:
      - CM016
      - CM017
      - CM019
      - CM020

