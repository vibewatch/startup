callouts:
  - calloutType: insight
    title: IAM market estimates vary by 45% across publishers for the same year
    body: >-
      The spread between the lowest ($25.23 billion, Business Research Company) and highest
      ($37+ billion, Fortune Business Insights including managed services) published IAM market
      estimates for 2026 is approximately 45%. The spread is driven by differing scope decisions
      on whether managed services, customer IAM, and professional services are included.
      JumpCloud's investor and press messaging should be cross-referenced against the specific
      report methodology rather than the headline number.
    claimRefs:
      - CM007
      - CM008
      - CM009
  - calloutType: risk
    title: Microsoft Entra ID price-to-zero dynamic constrains SSO and directory expansion
    body: >-
      Azure Active Directory (Microsoft Entra ID) is bundled into M365 E3 and E5 licenses
      already held by the majority of SMBs. For organizations already on Microsoft, JumpCloud
      must justify its incremental cost against a zero-marginal-cost incumbent, a structurally
      difficult argument for identity modules sold on a per-user basis.
    claimRefs:
      - CM031
      - CM032
  - calloutType: strength
    title: SMB cybersecurity spend trajectory aligns directly with JumpCloud's platform scope
    body: >-
      Analysys Mason's projection of $109 billion in global SMB cybersecurity spend by 2026 —
      with remote management security alone exceeding $45 billion — aligns precisely with
      JumpCloud's unified remote management, identity, and device security value proposition.
      The MSP-channel growth trajectory (MSPs reaching 40% route-to-market share) is a
      structural tailwind for JumpCloud's MSP program.
    claimRefs:
      - CM024
      - CM025
      - CM018
  - calloutType: assumption
    title: Agentic IAM TAM has no analyst-verified sizing as of June 2026
    body: >-
      The non-human identity governance segment is cited in JumpCloud's own research and press
      materials as having significant demand, but no third-party analyst report reviewed during
      this diligence run provides an audited TAM for agentic or machine-identity IAM specific
      to JumpCloud's mid-market target. The $12 billion IDC AI security spend figure cited in
      press coverage covers broad AI security, not agentic identity specifically.
    claimRefs:
      - CM033
      - CM034

