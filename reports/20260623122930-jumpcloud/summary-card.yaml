summary:
  headline: >-
    JumpCloud's cloud-native IAM platform serves 250,000+ organizations at an estimated $200M ARR, but the $2.625B
    Series F anchor is 2–4x above current analytically supportable fair value; the stance is Hold/Watch pending
    secondary entry below $1.2B with confirmed ARR and exit-path clarity.
