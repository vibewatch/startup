    notes: >-
      Derived from FedRAMP Marketplace (June 2026), JumpCloud data-protection and security pages,
      and analysis of EU AI Act Regulation (EU) 2024/1689 scope criteria as applied to Agentic IAM.
      Coverage is partial; other frameworks (HIPAA, PCI-DSS, SOC 2) are relevant but handled
      elsewhere in this report.
    enumerationScope:
      coverage: partial
      basis: >-
        Major frameworks with explicit bearing on JumpCloud's enterprise sales reach and compliance
        posture, prioritized by investor-relevant market-access impact as of June 2026
    rows:
      - - FedRAMP (Federal Risk and Authorization Management Program)
        - United States federal
        - Not authorized — no listing on FedRAMP Marketplace as of June 23, 2026
        - Certain — federal customers cannot procure JumpCloud under current rules
        - Critical — permanently excludes US federal agency market and most CMMC L2/L3 contractors
        - None for federal segment; separate GovCloud architecture would require from-scratch build
        - Permanent exclusion from US federal segment until authorization obtained (12-36 months)
      - - GDPR / Standard Contractual Clauses
        - EU / EEA (and adequacy-decision countries)
        - DPA with SCCs available; AWS and Salesforce listed as sub-processors; DPO contact public
        - Low — DPA framework in place; SCCs provide legal transfer mechanism
        - Moderate — SCCs face ongoing legal uncertainty (Schrems II successor risk)
        - GDPR-compliant DPA; EU region data center; DPO engagement channel
        - Residual SCC legal uncertainty; some telemetry routing outside EU cannot be fully excluded
      - - EU AI Act (Regulation 2024/1689)
        - European Union
        - Uncertain — Agentic IAM (April 2026) may require risk classification; no determination published
        - Medium — Agentic IAM automates access policy with potential impact on employment / rights
        - Moderate — non-compliance with risk classification could require product changes or CE marking
        - No conformity assessment published; AI Act compliance framework under evaluation
        - Until classification is published, EU enterprise prospects face procurement uncertainty
      - - India Digital Personal Data Protection Act 2023
        - India
        - Partial — India data center available; some telemetry may flow outside India per own docs
        - Low-medium — Indian enterprise market is modest share of JumpCloud ARR currently
        - Low-moderate — potential notification/localization requirement for Indian data subjects
        - India-region deployment option; ongoing telemetry routing review
        - Residual exposure from telemetry routing; DPDP consent mechanism details unconfirmed
