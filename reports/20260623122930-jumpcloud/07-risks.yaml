  - id: TR004
    title: People / execution risk register
    columns:
      - Role/function
      - Dependency or gap
      - Likelihood
      - Severity
      - Mitigation
      - Diligence path
    notes: >-
      Sources: JumpCloud leadership page, TeamBlind and Indeed reviews, JumpCloud press releases.
      Employee review scores: TeamBlind 2.9/5 (30 reviews), Indeed (limited sample). All
      probability assessments are analyst judgments based on public signals; no insider information.
    rows:
      - - CEO (Rajat Bhargava, co-founder)
        - Single founder-CEO with 13-year tenure governing all strategic decisions; no disclosed succession plan
        - Low (near-term departure unlikely given no signals); Medium if growth stalls
        - Critical — founder departure would require simultaneous CEO search and strategy pivot
        - None visible — no disclosed successor, COO, or independent board oversight documented
        - Request board composition, independent director qualifications, succession plan, and CEO comp structure
      - - CRO / Go-to-market (Shianne Sampson, recent hire)
        - Recent hire from Eventbrite and New Relic; CRO role requires 6-12 months ramp to full productivity
        - Medium — CRO transitions carry inherent ramp risk; no track record at JumpCloud yet established
        - High — sales productivity loss during CRO transition directly impacts new ARR bookings
        - CRO named and onboarded; past experience in SaaS growth; prior track record at New Relic
        - Request sales pipeline conversion data, quota attainment before/after transition, and sales headcount trend
      - - Engineering talent retention (offshoring concerns)
        - TeamBlind and Indeed reviews cite recurring offshoring of US engineering/CS roles to India and LatAm
        - Medium — consistent multi-year pattern in reviews; post-pandemic hiring normalization
        - Moderate — talent retention issues can slow product velocity and increase technical debt
        - India and LatAm engineering hubs provide cost efficiency; JumpCloud University as culture carrier
        - Request engineering headcount by region and function, voluntary attrition rate by tenure, and salary benchmarks
      - - CISO (Roland Palmer, appointed post-breach)
        - Appointed post-2023 breach; security org maturity depends on CISO continuity
        - Low — CISO was appointed deliberately for security certification and compliance maturity
        - High if departure — security regression risk; SOC 2/ISO 27001 renewal depends on program continuity
        - Roland Palmer has FedRAMP, ISO 27001, HIPAA, and SOC 2 experience from prior roles
        - Confirm CISO reporting line, team size, annual security budget, and board-level security committee structure
