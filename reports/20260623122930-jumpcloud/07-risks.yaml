  evidenceGaps:
    - type: data-unavailable
      severity: material
      topic: eu-ai-act-classification
      missingEvidence: >-
        No conformity assessment, EU AI Act risk-tier classification, or CE marking process has
        been announced or published for JumpCloud's April 2026 Agentic IAM product; the product's
        exact scope of automated access decisions affecting natural persons has not been publicly
        specified.
      whyItMatters: >-
        If Agentic IAM is classified as a high-risk AI system under the EU AI Act, JumpCloud would
        face mandatory conformity assessment, human oversight requirements, and documentation
        obligations before EU enterprise deployment — potentially creating a sales delay of 12-24
        months in the EU market and requiring product architecture changes.
      diligencePath: >-
        Request JumpCloud's internal EU AI Act classification analysis and any external legal
        opinion on Agentic IAM risk tier; confirm whether a DPIA under GDPR Art. 35 has been
        conducted for automated access decisions.
      relatedQuestionRefs:
        - QR006
      relatedTableRefs:
        - TR001

    - type: private-evidence-only
      severity: material
      topic: arr-growth-rate-2024-2025
      missingEvidence: >-
        No JumpCloud ARR, revenue, or growth-rate data for 2024 or 2025 is publicly available;
        Sacra's 2023 estimate ($105M ARR, 31% YoY) is the most recent third-party estimate found
        and may be materially outdated given the company's product expansions and acquisitions.
      whyItMatters: >-
        Without current ARR and growth data, it is impossible to assess whether JumpCloud's
        Sacra-estimated $105M 2023 ARR has sustained 30%+ growth (which would be required to
        support any near-2021-valuation liquidity event) or has decelerated materially.
      diligencePath: >-
        Request audited or reviewed ARR by product tier, segment, and channel (direct vs. MSP)
        for 2023, 2024, and trailing twelve months; request ARR waterfall showing new, expansion,
        contraction, and churn components.
      relatedQuestionRefs:
        - QR012

    - type: private-evidence-only
      severity: material
      topic: ipo-exit-timeline
      missingEvidence: >-
        No IPO filing, SPAC announcement, secondary market tender offer, or strategic M&A
        transaction has been disclosed for JumpCloud as of June 2026; the company's liquidity
        path and timeline are entirely opaque.
      whyItMatters: >-
        The 2021 valuation of $2.625 billion is now more than four years old; without a disclosed
        exit pathway, investors holding growth-stage positions face open-ended illiquidity; the
        valuation overhang risk cannot be modeled without understanding the likely exit form and
        timeline.
      diligencePath: >-
        Directly question management on liquidity planning horizon, any board-level discussions
        of IPO readiness, and whether secondary market or tender offer programs exist for employee
        or investor liquidity; review board composition for investment bankers or exit-experienced
        directors.
