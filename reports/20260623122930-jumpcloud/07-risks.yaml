  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    notes: >-
      Ordered by severity. Breach-related risks derive from JumpCloud official disclosures,
      Mandiant/Google Cloud, SentinelOne, and BleepingComputer reporting. Reliability data from
      IsDown, StatusGator, IncidentHub, and StatusField as of June 2026.
    rows:
      - - Nation-state breach recurrence (DPRK / TraderTraitor supply-chain targeting)
        - Medium — confirmed nation-state targeting; JumpCloud remains high-value IAM supply-chain node
        - Critical — compromise of commands framework could impact downstream 200K+ organizations
        - Mature — multi-party access, SOC 2 Type 2, ISO 27001, CrowdStrike IR partner engaged
        - Medium — structural supply-chain target status cannot be remediated through policy alone
        - No independent public confirmation of multi-party access effectiveness; breach-test results not disclosed
      - - Service reliability / CDN dependency failure
        - Medium — 4.1 incidents/month avg; Cloudflare outage June 22, 2026 confirmed dependency
        - High — authentication service outage prevents logins for all 250K+ organizations
        - Moderate — Cloudflare WAF, multi-AZ deployment; no public SLA above 99.9% confirmed
        - Medium — cloud-only architecture has no on-premises fallback; CDN dependency confirmed
        - No multi-CDN redundancy disclosed; public SLA terms not published; MTTR 154 min avg
      - - Product / API defects and undisclosed vulnerabilities
        - Low-medium — standard SaaS operational risk; no CVEs in JumpCloud core platform cited
        - High — identity platform defects can cause mass account lockouts or access violations
        - Moderate — SOC 2 Type 2; bug bounty program assumed but terms not publicly confirmed
        - Low-medium — certification provides baseline but does not guarantee zero critical defects
        - Bug bounty scope and maximum bounty not publicly confirmed; penetration test results undisclosed
      - - Post-breach insider threat / privileged access abuse
        - Low — multi-party access controls implemented post-2023; insider risk elevated after offshoring
        - High — insider with privileged access could modify commands for any downstream organization
        - Moderate — multi-party access model for privileged operations; monitoring not quantified
