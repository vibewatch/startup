  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk scenario
      - Monitorable trigger
      - Threshold / kill criterion
      - Action implication
    notes: >-
      Monitoring triggers are based on publicly observable signals only; internal financial or
      security metrics are not accessible without data-room access. Kill criteria are analyst
      assessments, not company guidance.
    rows:
      - - Nation-state breach recurrence
        - Disclosed security incident, customer notification, API key rotation, incident blog post
        - Second material breach within 24 months of investment close
        - Pause deployment of additional capital; require independent forensic review and customer impact disclosure before thesis continuation
      - - Microsoft M365 displacement accelerating
        - Ramp Rate IDP adoption delta (quarterly); PeerSpot ranking; named customer win/loss announcements
        - JumpCloud IDP adoption falls below 10% on Ramp Rate OR YoY decline exceeds 5 pp for two consecutive quarters
        - Reassess TAM assumptions; require evidence of enterprise tier offset (2,000+ employee wins) before growth-stage valuation support
      - - Financial runway deterioration
        - Undisclosed; proxy indicators include layoff announcements, headcount reductions, and executive departures
        - Any disclosed workforce reduction exceeding 15% OR bridge financing at materially lower valuation
        - Require data-room financial access (burn, runway, NRR, GDR) as condition for continued investment or new commitment
      - - FedRAMP absence extended beyond 2028
        - FedRAMP Marketplace listing status; 3PAO engagement announcement; JABS sponsor identification
        - No in-process FedRAMP listing by end of 2027 with no JABS sponsor identified
        - Permanently discount US public-sector TAM; evaluate whether non-federal TAM at current valuation still supports return thesis
    claimRefs:
