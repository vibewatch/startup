  evidenceGaps:
    - type: private-evidence-only
      severity: minor
      topic: Headcount not officially disclosed
      missingEvidence: >-
        JumpCloud has not publicly disclosed an employee count. The approximately 1,165 figure
        used in this chapter is from Revelio Labs workforce analytics (December 2025); GetLatka
        and other sources cite ranges from 900 to 1,200. No official headcount has been published
        by the company.
      whyItMatters: >-
        Headcount triangulates burn rate, hiring pace, and revenue-per-employee as proxies for
        operational health and capital efficiency; without it these ratios cannot be verified.
      diligencePath: >-
        Request official headcount by department and geography under NDA; supplement with
        LinkedIn data for team composition and growth trajectory.
      relatedQuestionRefs:
        - QO005
    - type: private-evidence-only
      severity: minor
      topic: No equity round publicly announced since October 2021 Series F
      missingEvidence: >-
        No public announcement, filing, or credible report of a new equity financing round since
        the Series F close in October 2021 has been found in research conducted through June 2026.
        It is possible that secondary transactions, debt facilities, or undisclosed primary
        capital events have occurred.
      whyItMatters: >-
        A four-year gap between the last disclosed round and the current run date means the $2.625B
        valuation may be substantially stale; any capital structure changes (debt, secondaries, new
        equity) since 2021 are material to current valuation anchoring.
      diligencePath: >-
        Request current cap table, any debt or credit agreements, and secondary transaction
        history under NDA; review SEC EDGAR for any Form D filings.
      relatedQuestionRefs:
        - QO013
    - type: private-evidence-only
      severity: material
      topic: Audited GAAP revenue and financial statements not publicly available
      missingEvidence: >-
        JumpCloud has never publicly disclosed audited financial statements or GAAP-basis revenue.
        The $200M ARR estimate (GetLatka, 2024) and the $105M ARR estimate (Sacra, 2023) are
        third-party models, not company-confirmed figures. The company does not file with the SEC
        as a private company.
      whyItMatters: >-
        Without audited financials, all revenue, margin, burn rate, and unit economics assertions
        are unverifiable. Valuation and investment decisions based on third-party ARR estimates
        carry material model risk.
      diligencePath: >-
        Request audited FY2022–FY2025 financial statements including income statement, balance
        sheet, and cash flow statement under NDA.
      relatedQuestionRefs:
        - QO021
    - type: private-evidence-only
      severity: material
      topic: Full cap table and post-Series F governance rights not publicly disclosed
      missingEvidence: >-
        The complete post-Series F cap table, including exact ownership percentages per investor,
        preference waterfall mechanics, anti-dilution provisions, liquidation preferences, any
        super-voting rights held by founders, and secondary transaction history since 2021, are
        not in the public record. The 34 investor count from Tracxn is confirmed; individual
        stakes are not.
      whyItMatters: >-
        Cap table structure, preference overhang, and governance rights are central to any
        investment or acquisition diligence. Founder control and investor alignment in a follow-on
        round or exit scenario cannot be assessed without this information.
      diligencePath: >-
        Request full cap table, voting rights schedule, shareholder agreement, and any side letters
        under NDA; request a summary of any secondary transactions since October 2021.
      relatedQuestionRefs:
        - QO025
    - type: enumeration-incomplete
      severity: minor
      topic: Leadership and founder table is a sample of known named executives and board members
      missingEvidence: >-
        The leadership table (TO002) lists named executives and board members drawn from the official
        JumpCloud leadership page and press releases as of June 2026. It does not include all
        vice-presidents, regional leads, or advisors who may hold material roles. The company does
        not publish a complete org chart.
