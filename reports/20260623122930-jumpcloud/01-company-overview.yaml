    title: Company snapshot logic
    type: flow
    layout: standard
    summary: >-
      JumpCloud's value creation logic flows from a cloud-native open directory core through a
      SaaS platform that serves SME and enterprise IT buyers, powered by an ecosystem of security
      and productivity partners, and now extending into AI agent governance.
    data:
      nodes:
        - id: directory-core
          label: Cloud-native open directory
          detail: >-
            First open, cloud-based directory built to replace Microsoft Active Directory across
            heterogeneous OS, cloud, and device environments.
          tone: positive
        - id: saas-platform
          label: Unified IT management platform
          detail: >-
            SaaS subscription model consolidating identity, device, SSO, MFA, password, and
            privileged access into one admin console.
          tone: positive
        - id: sme-mid-market
          label: SME and mid-market customers
          detail: >-
            250,000+ organizations in 160+ countries; primarily 50–2,000 employee companies
            seeking Active Directory replacement or cloud-first IAM.
          tone: positive
        - id: ecosystem
          label: Strategic partner ecosystem
          detail: >-
            Google Workspace co-sell, Atlassian and CrowdStrike integrations (both strategic
            investors), and NTT Docomo for Japan market reach.
          tone: positive
        - id: agentic-expansion
          label: Agentic IAM and AI lifecycle
          detail: >-
            2026 product extension governs AI agents alongside human users; LLM-agnostic
            platform expands TAM beyond human headcount.
          tone: positive
      edges:
        - from: directory-core
          to: saas-platform
        - from: saas-platform
          to: sme-mid-market
