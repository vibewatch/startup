  - id: section-2
    title: Founders, leadership, board, and governance
    body: >
      JumpCloud was co-founded by Rajat Bhargava (CEO) and Greg Keller (CTO), with Larry Middle
      also cited as a co-founder in Wikipedia's sourced history. Bhargava is an MIT graduate
      described by the company as a ten-time entrepreneur with seven exits, including two IPOs and
      five trade sales; he remains the primary public face, strategic decision-maker, and
      fundraising lead. Keller has approximately 30 years of technology experience and was
      responsible for the inception and launch of JumpCloud's original cloud directory platform;
      he continues to lead technical architecture and platform innovation. Key-person concentration
      in the founder pair is notable: Bhargava and Keller together represent original product
      vision, external trust, capital relationships, and technical continuity.


      The 2026 executive team was materially strengthened by two hires. Roland Palmer joined as
      Chief Information Security Officer and Vice President of Security on March 2, 2026, bringing
      over 20 years of security experience including eight years as VP of Security and Compliance
      at Sumo Logic. Shianne Sampson joined as Chief Revenue Officer on March 23, 2026, with 20+
      years of revenue leadership experience at Eventbrite, New Relic, Zenefits, and Yelp. The
      addition of both CISO and CRO roles in the same quarter signals active organizational
      scaling in advance of enterprise and global market expansion.


      JumpCloud's board includes Brad Feld (Foundry Group, early investor), Alex Crisses (Managing
      Director at General Atlantic), Amol Kulkarni (former CrowdStrike Chief Product and
      Engineering Officer), Maria Martinez (former Cisco EVP/COO), Tracy Knox (three-time public
      company CFO, serving as Audit Chair), Jose Morales (Francisco Partners Operating Partner),
      and Will Herman (angel investor). The board composition reflects long-term VC continuity
      (Foundry), growth-equity alignment (General Atlantic), security-ecosystem credibility
      (Kulkarni/CrowdStrike), and independent governance oversight (Knox). Governance details
      including voting control, shareholder agreements, and any founder super-voting rights are
      not publicly disclosed and represent a material diligence gap.
