company:
  name: JumpCloud
chapter:
  number: 1
  title: Company Overview
  summary: >-
    JumpCloud is a Louisville, Colorado-based cloud-native identity and IT management company that
    operates the first open, cloud-based directory platform built to replace legacy Microsoft Active
    Directory for modern, distributed organizations. Founded in 2012 and formally launched at
    TechCrunch Disrupt Battlefield in September 2013, JumpCloud reached unicorn status in October
    2021 with a $2.625 billion valuation following a $225 million Series F led by Sapphire Ventures.
    As of June 2026 the company serves over 250,000 organizations across 160+ countries, reports
    $400M+ in total capital raised, and has disclosed an estimated $200 million in annual recurring
    revenue for 2024. The company is evolving from a cloud directory for human users into an
    AI-powered unified IT management platform governing both human and agentic identities. Key
    2026 executive additions and the April 2026 Agentic IAM launch signal active platform expansion.
    A July 2023 North Korea state-sponsored cyberattack, affecting fewer than five customers, is the
    material adverse event on record and was publicly disclosed with indicators of compromise.

sections:
  - id: section-1
    title: Identity, headquarters, and operating model
    body: >
      JumpCloud is an American enterprise software company headquartered in Louisville, Colorado.
      The company was formally launched at TechCrunch Disrupt Battlefield in September 2013 with
      an automated server management tool as its initial product. Since then JumpCloud has
      repositioned itself as the AI-powered unified IT management platform that consolidates
      identity, device, and access management into a single control plane designed to serve
      organizations managing both human employees and autonomous AI agents. The company's own
      website characterizes its origin as a direct response to the limitations of Microsoft Active
      Directory in cloud-first, remote-work, and heterogeneous-device environments.


      JumpCloud's current operating stage is late private-growth: the last publicly disclosed
      equity round is the October 2021 Series F at a $2.625 billion post-money valuation, and no
      subsequent equity round has been publicly announced as of the June 2026 run date. The company
      operates on a subscription SaaS model with per-user per-month pricing; third-party analysts
      estimate the base offering at approximately $9 to $20 per user per month with add-on modules
      available at incremental per-feature rates. JumpCloud targets small and mid-sized enterprises
      with heterogeneous IT environments as its primary buyer segment, though leadership language in
      2025 and 2026 press releases suggests active upmarket movement. The company states it serves
      250,000+ organizations across 160+ countries, making it one of the broadest-reach identity
      management platforms in its valuation tier.
