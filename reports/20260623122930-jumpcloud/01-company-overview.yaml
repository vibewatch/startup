  - id: section-4
    title: Scale metrics, milestones, and adverse events
    body: >
      JumpCloud's public scale metrics as of June 2026 reflect a company that has grown
      significantly since its 2021 financing peak. The company's website states 250,000+
      organizations across 160+ countries, a substantial increase from the 120,000 organizations
      cited in its 2021 Series F announcement. GetLatka, a revenue intelligence platform that
      surveys SaaS founders and triangulates from public data, estimated JumpCloud's annual
      recurring revenue reached $200 million in November 2024, up from $105 million estimated by
      Sacra for 2023. Revelio Labs workforce analytics estimated approximately 1,165 employees as
      of December 2025. None of these external revenue or headcount figures are audited or
      officially disclosed; they should be used as directional indicators rather than confirmed
      financials. Audited GAAP revenue has never been publicly disclosed by this private company.


      The milestone record spans founding, multiple financing rounds, five acquisitions, major
      partnerships, a significant adverse security event, and four 2026 strategic moves. Key
      product milestones include the conditional access policies launch in December 2020, the
      Google Workspace partnership in April 2023, the Agentic IAM launch in April 2026, and
      acquisitions of MYKI (2022), Zercurity (2023), Resmo (2024), Stack Identity (2025), and
      VaultOne (2025) that progressively expanded the platform from directory services into
      password management, device compliance, SaaS asset management, identity governance, and
      privileged access management. The single material adverse event on record is the July 2023
      North Korea state-sponsored cyberattack, disclosed by JumpCloud's CISO and confirmed by
      CrowdStrike as involving a sophisticated spear-phishing campaign starting June 22, 2023;
      fewer than five customers and fewer than ten devices were affected, and JumpCloud published
      indicators of compromise. The incident highlights the platform's critical infrastructure
      status and demonstrates a transparent incident response posture.
