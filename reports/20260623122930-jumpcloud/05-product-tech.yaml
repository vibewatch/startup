  - id: section-device-management
    title: Cross-platform device management, operating architecture, and dependencies
    body: >
      JumpCloud's device management module is a principal technical differentiator and the
      architectural layer most directly enabled by the cross-OS agent. The Unified Endpoint
      Management (UEM) capability manages macOS, Windows, Linux (with Ubuntu as the primary
      supported distribution for patch management), iOS/iPadOS, and Android from a single
      admin console. This cross-platform scope distinguishes JumpCloud from competitors: Jamf
      covers only Apple, Microsoft Intune provides only compliance enrollment for Linux (not
      full policy management), and Kandji focuses exclusively on Apple MDM.

      JumpCloud's Linux management capability provides full-depth policy management, patch
      management via Ubuntu package management, script execution, and SSH key management—
      capabilities that no direct competitor delivers natively without a multi-tool stack. For
      macOS and iOS, JumpCloud uses Apple's Declarative Device Management (DDM) protocol,
      ensuring compatibility with Apple's evolving management model and enabling native OS
      patch delivery for macOS, iOS, and iPadOS. Patch management covers Windows (with
      granular KB-level dashboard for specific update tracking), macOS/iOS via DDM, Ubuntu
      Linux, and Chrome browser patching. Remote Access provides a secure, agent-based remote
      session capability without requiring end-users to have a VPN configured.

      The critical architectural dependency is the JumpCloud Agent. When the agent loses
      connectivity to JumpCloud's cloud backend, policy changes, command execution, and
      non-TOTP MFA scenarios are disrupted—local device logins with cached TOTP continue to
      work, but the platform's most differentiated capabilities (remote policy push, device
      trust enforcement, real-time monitoring) require cloud connectivity. This dependency was
      exposed during the March 12, 2026 incident, when a five-hour Agent backend degradation
      prevented policy and command synchronization for all agent-enrolled devices. JumpCloud's
      infrastructure relies on Google Cloud for the Agentic IAM Gateway, Cloudflare for CDN
      and firewall services, and distributes its core services across multiple cloud availability
      zones and geographic regions (including EU regional endpoints) to reduce single-region
      failure risk.
