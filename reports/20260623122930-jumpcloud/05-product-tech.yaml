  - id: section-agentic-iam-roadmap
    title: Agentic IAM, Zero Trust extension, and 2026 product roadmap
    body: >
      JumpCloud's most strategically significant 2026 product move is Agentic IAM, launched
      publicly on April 27, 2026. The launch addressed a structural gap in enterprise identity
      governance: as organizations deploy autonomous AI agents to perform work at machine speed,
      traditional IAM systems—built around static human credentials—cannot govern agents that
      dynamically authenticate, delegate authority, and access data without human initiation.
      JumpCloud's own 2026 Agentic IAM Pulse Report, drawing on data from hundreds of IT and
      security decision-makers across the US and UK, found that 72% of organizations already
      have AI agents in production, 66% grant AI agents equal or greater system access than
      human users, and only 37% have fully integrated AI agents into formal IAM policies.

      Agentic IAM is organized as four capabilities: AI Discovery and Directory (discovering all
      agents across the enterprise, including locally running Model Context Protocol servers,
      and registering them in a governed inventory); AI Access and Governance (an AI Gateway
      that registers human, non-human, and agent identities and enforces authentication via
      OpenID Connect for every Agent-to-Agent and API flow); AI Device Trust (real-time
      verification that agents operate only on healthy, managed hardware across Windows, macOS,
      and Linux); and Human-in-the-Loop governance (requiring explicit human authorization
      before high-impact AI actions execute). The platform provides a centralized kill switch
      to immediately revoke any agent's access, addressing the rogue-agent risk scenario.

      On June 11, 2026, JumpCloud deepened its Google Cloud partnership by announcing that
      Agentic IAM is hosted on Google Cloud infrastructure and optimized for Gemini Enterprise,
      with biometric and device-health verification for Gemini Enterprise sessions and a
      first-party integration enabling customers to deploy AI agents against JumpCloud's 900+
      application catalog. JumpCloud is LLM-agnostic and platform-independent, supporting
      Claude, Cursor, and other third-party AI tools in addition to Gemini. The 2026 roadmap
      continues rolling out Managed AI Connectors and centralized token management, expanded AI
      Device Trust for Gemini Enterprise sessions, and Agent-to-Agent trust controls allowing
      more granular policy enforcement as agents delegate authority across systems. The Google
      Cloud partnership extends the earlier "Work Transformation Set" commercial arrangement
      integrating Google Workspace with JumpCloud's unified IT management plane.
