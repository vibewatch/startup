  - id: FE002
    title: JumpCloud employee lifecycle workflow — from HR event to audited access
    type: flow
    layout: standard
    summary: >-
      JumpCloud's core customer workflow converts an HR system event into governed, audited
      access across devices and applications in a single automated motion.
    data:
      nodes:
        - id: hris-event
          label: HRIS Event (hire / role change / offboard)
          detail: >-
            HR system (Workday, BambooHR, Rippling, etc.) triggers a lifecycle event. JumpCloud
            monitors via SCIM or native connector. Event is the authoritative identity trigger.
          tone: neutral
        - id: jc-provision
          label: JumpCloud Provisioning Engine
          detail: >-
            SCIM 2.0 or API call creates or deactivates the user record. Group assignment
            based on HR attributes automatically provisions access to all connected resources.
          tone: positive
