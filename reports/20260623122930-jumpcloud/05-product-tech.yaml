    summary: >-
      JumpCloud's cloud-native delivery creates upstream dependencies on Google Cloud, Cloudflare,
      and third-party HRIS systems; the on-endpoint JumpCloud Agent is the most critical
      single-point component in day-to-day operations.
    data:
      nodes:
        - id: jc-platform
          label: JumpCloud SaaS Control Plane
          detail: >-
            Multi-tenant control plane hosting admin console, directory, SCIM, API, and
            federation. Distributed across cloud AZs with US and EU regional endpoints.
        - id: google-cloud
          label: Google Cloud (AI Gateway Host)
          detail: >-
            Hosts Agentic IAM gateway; provides global infrastructure for AI-speed identity
            operations. June 2026 launch deepens Google Cloud dependency for agentic features.
        - id: cloudflare
          label: Cloudflare CDN / WAF
          detail: >-
            Content delivery and DDoS/firewall protection for JumpCloud's web properties and
            admin console. A June 22, 2026 Cloudflare outage caused console loading delays.
        - id: jc-agent
          label: JumpCloud Agent (Endpoint — Windows/macOS/Linux)
          detail: >-
            Lightweight agent installed on managed devices. Most critical dependency for
            policy enforcement, device trust, and non-TOTP MFA. Agent outage = policy sync loss.
        - id: hris-system
          label: HRIS / HR Platform (Workday, BambooHR, etc.)
          detail: >-
            Authoritative identity lifecycle trigger. SCIM or native connector feeds user
            provisioning and deprovisioning. Loss of HRIS sync creates identity drift.
        - id: saml-apps
          label: SAML / OIDC Application Catalog (900+ apps)
          detail: >-
            Third-party SaaS applications that depend on JumpCloud as the IdP for SSO.
            JumpCloud outage prevents app logins that require federated authentication.
