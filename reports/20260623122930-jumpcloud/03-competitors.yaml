  - id: TP004
    title: Moat durability and competitive risk register
    columns:
      - Moat Claim
      - Primary Threat
      - Severity (2026)
      - Mitigation Evidence
      - Diligence Ask
    rows:
      - - Cross-OS agent-based directory model creates multi-week migration switching cost
        - Microsoft expands Intune Linux and Entra ID non-Windows parity
        - High — if Microsoft closes Linux gap, key win condition erodes
        - JumpCloud RADIUS/LDAP support for legacy infrastructure adds further friction beyond MDM
        - Monitor Microsoft Intune Linux roadmap quarterly; track JumpCloud deal-loss reasons
      - - Unified identity + device platform at SMB price point eliminates tool sprawl
        - Rippling bundles HRIS + IAM + MDM as a single employee graph purchase
        - Medium — affects mid-market 100–500 employee segment primarily
        - JumpCloud's IT-only landing motion remains faster than Rippling's HR-first onboarding
        - Request JumpCloud NRR cohort data for accounts where Rippling displaced JumpCloud
      - - Linux management depth is a structural advantage vs. Microsoft and Okta
        - Jamf expands into Linux via Identity Automation; third-party MDM vendors add Linux support
        - Low-to-medium — Linux MDM is a niche market; most enterprises are Apple or Windows-first
        - No current competitor offers Linux MDM + cloud directory in a single SMB-priced product
        - Track Jamf Linux roadmap post Identity Automation integration; monitor Fleet.dm (open source)
      - - G2 market leadership in Cloud Directory and PAM categories (150+ leader badges, 4,000+ reviews)
        - Okta, Microsoft expand G2 review programs; negative reviews cluster around pricing at scale
        - Low — G2 leadership is a lagging indicator; does not gate enterprise deals
        - JumpCloud earns top honors in Spring 2026 G2 Grid across 150 categories per press release
        - Request NPS and churn data to confirm G2 leadership reflects actual customer retention
      - - RADIUS and LDAP protocol support integrates with legacy VPN, Wi-Fi, and on-premises apps
        - SaaS-native organizations eliminate VPN and on-prem apps, reducing RADIUS/LDAP value
        - Medium — affects organizations modernizing to zero-trust network access gradually
        - Zero-trust shift drives demand for conditional access, not RADIUS elimination; LDAP remains
        - Track share of new JumpCloud deals citing RADIUS/LDAP as a key requirement vs. SSO-only
    notes: >-
      Severity ratings are qualitative assessments based on competitive evidence as of June 2026;
      no internal deal-level data was available to quantify displacement rates. Diligence asks
      represent questions answerable only with access to JumpCloud's internal revenue and
      retention data.
