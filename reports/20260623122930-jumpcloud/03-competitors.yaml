          x: 7
          y: 8
          detail: >-
            Cloud directory + cross-OS MDM (Win/Mac/Linux) + MFA + SSO at SMB price point.
            Linux MDM strength distinguishes it in mixed-OS accounts. x=identity depth (1–10),
            y=device management breadth (1–10). Scores are evidence-backed ordinal assessments.
        - id: microsoft
          label: Microsoft Entra ID + Intune
          x: 9
          y: 7
          detail: >-
            Deepest Windows identity and device management; Entra Governance + conditional access;
            Linux MDM limited to compliance enrollment only. Bundled in M365 E3/E5.
        - id: okta
          label: Okta
          x: 9
          y: 2
          detail: >-
