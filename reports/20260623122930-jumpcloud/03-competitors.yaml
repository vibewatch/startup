  - id: section-competitor-profiles
    title: Competitor profiles — scale, funding, target customer, and strategic direction
    body: >
      Microsoft Entra ID and Intune are part of Microsoft's commercial cloud, which reported
      $135.7 billion in FY2025 revenue. Microsoft does not break out Entra ID or Intune as
      separate revenue lines, but the products are central to the company's security and
      productivity upsell from Microsoft 365 Business Premium to E3 and E5 tiers. Microsoft's
      strategic direction for Entra ID in 2026 includes Entra Identity Governance (IGA layer),
      Entra External ID (B2B and B2C), and Entra Workload ID (non-human identity), placing it
      in structural competition with JumpCloud's Agentic IAM launch. Microsoft Intune's Linux
      support remains limited to device compliance enrollment and conditional access, without
      the full policy management, patch management, and script execution that JumpCloud provides
      for Linux endpoints.

      Okta is the only publicly traded independent IAM pure-play. Its fiscal year 2026 (ended
      January 31, 2026) total revenue reached $2.919 billion, a 12% year-over-year increase.
      Subscription revenue represented $2.855 billion of that total. Remaining performance
      obligations (RPO) stood at $4.827 billion, a 15% YoY increase, indicating strong forward
      visibility. Non-GAAP operating margin was 26% in Q4 FY2026. Okta's dual-platform strategy
      (Workforce Identity Cloud and Customer Identity Cloud via Auth0) addresses both internal
      employee access and external consumer authentication. Okta does not provide native device
      management; organizations using Okta for IAM must pair it with a separate MDM solution such
      as Microsoft Intune, Jamf, or JumpCloud's MDM modules.

      Cisco Duo was acquired by Cisco in 2018 for $2.35 billion and is embedded in Cisco's
      Security business, which exceeded $4 billion in revenue in FY2025. Duo does not publish
      stand-alone revenue. Its published 2026 pricing tiers are: Free ($0, 10 users, basic MFA),
      Essentials ($3/user/month, unlimited users, phishing-resistant MFA, SSO), Advantage
      ($6/user/month, device trust, risk-based authentication, advanced policies), and Premier
      ($9/user/month, passwordless, VPN-less remote access). Duo is positioned as a security
      overlay on top of an existing directory, not as a directory replacement, which makes it
      an additive tool in JumpCloud accounts rather than a direct swap.

      Rippling's $450 million Series G in May 2025, led by Baillie Gifford, valued the company
      at $16.8 billion. The company is approaching $1 billion ARR in 2026 with revenue growth
      over 30% year-over-year. Rippling's core differentiation is the unified employee graph
      that drives zero-touch provisioning and deprovisioning across HR, IT, and finance with no
      manual integration steps. However, Rippling requires buyers to adopt the full HR platform
      as a foundation; pure IT-only buyers face a higher adoption threshold than with JumpCloud.

      Jamf, with $627 million in FY2024 revenue and approximately 9% ARR growth, is the dominant
      Apple MDM vendor, ranked as a leader in IDC MarketScape for Unified Endpoint Management
      (Apple-first) in 2025-2026. Francisco Partners acquired Jamf in October 2025 for $2.2
      billion, taking the company private. Jamf holds approximately 11% market share in education
      Apple MDM and is adding Android device support in 2026. Its acquisition of Identity
      Automation for $215 million in 2024 represents a strategic move toward unified
      identity-plus-device management. Kandji, which rebranded as Iru in late 2025, is priced
      at $1.60 to $8.56 per device per month, offers 300+ prebuilt compliance templates
      (SOC 2, ISO 27001, CIS benchmarks), and targets lean IT teams seeking fast Apple MDM
      deployment without dedicated Apple admin expertise.
