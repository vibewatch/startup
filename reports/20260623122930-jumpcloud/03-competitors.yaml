figures:
  - id: FP001
    title: Competitive positioning map — identity management depth vs. device management breadth
    type: quadrant
    layout: standard
    summary: >-
      JumpCloud occupies a unique position combining strong cross-OS device management with a
      solid cloud directory foundation; Okta and Microsoft anchor opposite quadrants — Microsoft
      leads on both axes for Windows-centric environments while Okta leads identity with no device
      management at all.
