callouts:
  - calloutType: risk
    title: Microsoft Entra ID bundling creates structural pricing pressure in Windows-centric accounts
    body: >-
      For organizations already paying for Microsoft 365 E3 or E5, Entra ID is included at no
      incremental cost, and Intune is either bundled or available at a modest add-on price.
      JumpCloud must demonstrate cross-OS or Linux value to justify its per-seat fee in these
      accounts. As Microsoft closes the Linux parity gap in Intune, JumpCloud's primary win
      condition in Microsoft-adjacent accounts narrows. This is the single highest-severity
      displacement risk in JumpCloud's competitive landscape.
    claimRefs:
      - CP002
      - CP032
      - CP042

  - calloutType: strength
    title: Cross-OS agent model is a unique position no competitor replicates without a multi-tool stack
    body: >-
      JumpCloud is the only vendor in the comparison set that manages Windows, macOS, Linux,
      iOS, and Android endpoints from a single cloud directory console at SMB-accessible pricing.
      Microsoft requires Intune (strong Windows, weak Linux), Okta requires a separate MDM
      partner, Jamf covers only Apple, and Rippling lacks Linux management. This creates a
      structural win condition for JumpCloud in the 40%+ of organizations running Linux or
      heterogeneous device fleets.
    claimRefs:
      - CP021
      - CP039
      - CP033

