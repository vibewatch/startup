summary:
  headline: >-
    JumpCloud's cloud-native IAM platform serves 250,000+ organizations at an estimated
    $200M ARR, but the $2.625B Series F anchor is 2–4x above current analytically
    supportable fair value; the stance is Hold/Watch pending secondary entry below $1.2B
    with confirmed ARR and exit-path clarity.
  overallScore: 5.5
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: expensive
  keyMetrics:
    valuationUsdM: 2625
    revenueRunRateUsdM: null
    arrUsdM: 200
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 400
    customerCount: 250000
    headcount: 1165
  topStrengths:
    - >-
      Cloud-native Open Directory Platform with full-depth Linux MDM and cross-OS UEM
      across all five OS families is technically differentiated; no direct competitor
      replicates the single-agent model at this breadth
    - >-
      250,000+ organizations across 160+ countries creates a large product-led growth
      conversion funnel and structural directory-embedded switching costs once deployed
    - >-
      Google Workspace partnership (April 2023) and April 2026 Agentic IAM launch extend
      distribution leverage and expand the addressable market into agentic identity
      governance with no current mature alternative
    - >-
      Strong third-party customer satisfaction signals: G2 Top-10 in 150+ Spring 2026
      Grid categories with 4.5/5 from 4,000+ reviews and TrustRadius 9.2/10
    - >-
      IAM market TAM of $25–30B+ growing at 12–15% CAGR with secular shift from
      on-premises Active Directory to cloud-native identity creates durable long-term
      revenue opportunity
  topRisks:
    - >-
      Microsoft Entra ID bundled in M365 E3/E5 at near-zero marginal cost creates a
      structural competitive dynamic; Ramp data shows JumpCloud IDP adoption at 14%,
      down 2pp YoY with declining share at the M365 activation boundary
    - >-
      $2.625B Series F valuation anchor (October 2021) is 2–4x above base-case fair
      value (~$1.2B at 6x × $200M ARR under Q1 2026 SaaS multiples) with no secondary
      market signal or new primary round to revise the mark
    - >-
      2023 nation-state breach by North Korean APT UNC4899 (TraderTraitor) established
      JumpCloud as a high-value supply-chain target for 250,000+ organizations; ongoing
      operational incidents average 4.1/month per IsDown tracking
    - >-
      Severe financial opacity: no NRR, gross margin, EBITDA, burn rate, or audited
      revenue publicly disclosed; the entire valuation model rests on unverified
      third-party ARR estimates with no company confirmation
    - >-
      FedRAMP authorization absent, permanently excluding US federal agency market and
      CMMC-adjacent contractors; EU AI Act risk classification for Agentic IAM
      unresolved as of June 2026
  unresolvedGaps:
    - >-
      Audited financials, NRR, gross dollar retention, gross margin, burn rate, and
      runway not publicly disclosed; underwriting depends entirely on third-party ARR
      estimates (Sacra, GetLatka) with no company confirmation
    - >-
      Paying-customer count not updated since October 2021 (5,000+ against 120,000+
      total); current free-to-paid conversion ratio, paying-customer ARR concentration,
      and revenue quality cannot be independently assessed
    - >-
      No secondary-market transaction price exists for JumpCloud shares; Forge shows
      Limited activity; the $2.625B valuation anchor has not been revised in 56+ months
      with no IPO filing or new equity round announced
    - >-
      MSP channel ARR concentration and top-partner departure risk unquantified;
      MacSolution acquisition (Q1 2026) indicates management engagement but financial
      terms and channel ARR percentage remain undisclosed
    - >-
      EU AI Act risk classification for the April 2026 Agentic IAM launch not published;
      FedRAMP authorization path or GovCloud architecture plan not announced

disclaimer: >-
  This report is based solely on publicly available information as of June 23, 2026.
