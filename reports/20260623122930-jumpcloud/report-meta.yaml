companyProfile:
  summary: >-
    JumpCloud is a Louisville, Colorado-based cloud-native identity and IT management
    company operating the first open, cloud-based directory platform built to replace
    legacy Microsoft Active Directory for modern distributed organizations. Founded in
    2012 and formally launched at TechCrunch Disrupt Battlefield in September 2013,
    JumpCloud reached unicorn status in October 2021 with a $2.625 billion valuation
    following a $225 million Series F led by Sapphire Ventures. As of June 2026 the
    company serves over 250,000 organizations across 160+ countries, reports $400M+
    in total capital raised, and third-party analysts estimate approximately $200 million
    in annual recurring revenue for 2024. The company is evolving from a cloud directory
    for human users into an AI-powered unified IT management platform governing both
    human and agentic identities, with the April 2026 Agentic IAM launch and the Google
    Workspace partnership as key strategic growth drivers.
  foundedDate: "2012-12-01"
  founders:
    - name: Rajat Bhargava
      role: CEO and board member
      background: >-
        MIT graduate; ten-time entrepreneur with seven exits including two IPOs and five
        trade sales; leads strategy, fundraising, and product direction at JumpCloud
      claimRefs: [CO003, CO004]
    - name: Greg Keller
      role: CTO and co-founder
      background: >-
        ~30 years technology experience spanning startups and growth-stage companies;
        designed and launched JumpCloud's original cloud directory platform
      claimRefs: [CO003, CO005]
    - name: Larry Middle
      role: Co-founder
      background: null
      claimRefs: [CO003]
  foundingLocation: Louisville, Colorado
  headquarters: Louisville, Colorado, USA
  productSummary: >-
    Cloud-native, agent-based Open Directory Platform spanning identity management
    (Cloud Directory, SSO, MFA, PAM, Agentic IAM for human and AI-agent identities),
    device management (cross-OS UEM for Windows, macOS, Linux, iOS, Android), and
    access management (Cloud LDAP, Cloud RADIUS, Conditional Access, Zero Trust).
    Delivered exclusively as multi-tenant SaaS with a permanently free tier for up to
    10 users and 10 devices and paid tiers from $9 per user per month.
  customerFocus: >-
    Small and mid-sized enterprises (50–2,000 employees) with heterogeneous device
    environments migrating from on-premises Microsoft Active Directory to cloud-native
    identity management; served through product-led growth, direct sales, and a
    significant MSP/VAR channel
  businessModel: >-
    Per-user per-month SaaS subscription with a product-led growth free tier
    (≤10 users/devices); tiered packages from $9/user/month (Device Management) through
    Platform Prime; enterprise bundles requiring sales engagement; significant MSP
    channel distribution
  stage: Late private-growth; last disclosed round Series F ($225M, October 2021)
  fundingStatus: >-
    $400M+ total raised across approximately 11 rounds (seed December 2012 through
    Series F October 2021 at a $2.625B post-money valuation); no new primary equity
    round publicly announced in 56+ months; no IPO filing or SPAC announcement
