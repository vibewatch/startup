summary:
  headline: >-
    JumpCloud 的云原生 IAM 平台服务 250,000+ 个组织，估计 ARR 约 $200M；但 $2.625B Series F 估值锚点比当前可分析支撑的公允价值高 2-4 倍。立场是持有 / 观察，等待 $1.2B
    以下二级买点，并确认 ARR 和退出路径。
