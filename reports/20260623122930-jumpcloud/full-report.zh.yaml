      - number: '5.2'
        title: 按客户工作流理解身份、访问与认证模块
        blocks:
          - type: paragraph
            body: >
              按客户工作流看，JumpCloud 的 IAM 和访问模块覆盖员工从入职到离职的生命周期。新员工加入组织后，HRIS Integration 模块可以通过 SCIM 2.0 或
              Workday、BambooHR、Rippling 等系统的原生连接器，自动触发 JumpCloud 中的账号开通。JumpCloud 在 Cloud Directory
              中创建标准用户身份，根据岗位属性把用户分配到相应组，并自动为连接的 SAML 和 OIDC 应用开通访问权限——IT 不需要为每个 SaaS 工具手工介入。

              SSO 模块通过 JumpCloud Application Catalog 中维护的 900 多个预配置应用连接器，提供 SAML 2.0 和 OpenID Connect（OIDC）联邦。用户通过
              JumpCloud User Portal 完成一次认证，即可无摩擦访问所有已授权应用。SSO 层与 MFA 深度集成：JumpCloud 支持 TOTP、通过免费认证器应用 JumpCloud Protect
              做推送认证、FIDO2/WebAuthn 硬件密钥、自有的 JumpCloud GO 无密码方式（硬件保护、抗钓鱼），以及生物识别认证。基于风险的条件访问策略，会根据设备健康、网络上下文和用户风险信号动态调整
              MFA 执行强度——包括与 Google Chrome Enterprise 集成，在未受管设备上执行浏览器侧策略。

              Cloud LDAP 为需要对云托管身份做传统 LDAP 目录查询的本地应用、防火墙和服务，提供符合标准的 LDAPS 与 STARTTLS 连接。Cloud RADIUS 支持 Wi-Fi 网络和 VPN
              集中器（Cisco Meraki、Ubiquiti UniFi、Fortinet FortiGate 等）使用 PEAP-MSCHAPv2 认证，让网络访问控制绑定到与 SSO 和设备管理相同的
              JumpCloud 身份上。Privileged Access Management 提供基于浏览器的安全网关，支持会话录制、实时监控和不可变审计日志，让用户无需 VPN
              即可对服务器和关键基础设施进行特权访问。Directory Insights API 暴露 SSO、LDAP、RADIUS 和 agent 会话中的认证事件结构化日志，从而支持 SIEM 集成和合规审计轨迹。
