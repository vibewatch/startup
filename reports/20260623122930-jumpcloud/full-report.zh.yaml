  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: JumpCloud 可见客户旅程从免费层发现开始，经自然转化、生产部署和模块扩张，延伸到由合作伙伴中介的 MSP 交付；MSP 路径与直销路径相似，但通过第三方关系压缩并抽象了终端客户。
    data:
      nodes:
        - id: j1
          label: 免费层发现与评估（≤10 个用户 / 设备）
          detail: >-
            产品驱动增长入口：组织自助注册，最多 10 个用户和 10 台设备可免费使用完整平台功能。开发者、创业公司和通用型 IT 人员是主要评估者。JumpCloud University 为潜在用户和 MSP
            提供自助培训与认证。
          tone: neutral
        - id: j2
          label: 强制转化触发点（第 11 个用户或设备）
          detail: 硬上限触发自动变现事件。增长超过免费门槛且意向强的组织，必须选择付费层级才能继续使用。由此形成低摩擦、近零 CAC 的自然 SMB 转化。MSP 账户可通过多租户门户绕过单个限制。
          tone: positive
        - id: j3
          label: 核心付费部署（Device Mgmt、SSO 或 Device Identity Mgmt 层级）
          detail: >-
            组织在端点部署 JumpCloud agent，通过 SCIM 连接 HRIS，配置 SSO 连接器（900+），并将设备纳入 MDM。部署深度与 ARPU 相关：跨 OS MDM 加目录再加 SSO
            的部署更难被替换。案例研究记录了 SMB 一天完成全量迁移。
          tone: positive
        - id: j4
          label: 合规嵌入与审计周期锁定
          detail: >-
            组织用 JumpCloud 收集 SOC 2、ISO 27001 或 HIPAA 证据时，会在平台内累积审计轨迹数据。Bright Defense 记录约 50% 的 IAM
            合规控制开箱即满足。年度审计周期带来结构性续约压力：审计中途换平台成本过高。
          tone: positive
        - id: j5
          label: 模块扩张至 Platform Prime（PAM、SaaS Mgmt、Shadow AI、Agentic IAM）
          detail: >-
            组织增长或合规要求加深后，会从核心层级扩张到 Platform Prime 或附加模块：Privileged Access Management、SaaS Discovery、SaaS Spend
            Optimization、Shadow AI Governance 和 Agentic IAM（2026 年 4 月推出）。DECKED、Stord 和 Attainable Security 均在 Platform
            Prime 层级运行。
          tone: positive
        - id: j6
          label: MSP 中介交付（平行渠道路径）
          detail: >-
            170+ 个国家的 MSP 将 JumpCloud 打包进面向 SMB 和中端市场客户的托管 IT 服务。多租户门户支持用单一控制台管理所有客户环境。MSP 按客户、按席位赚收入；JumpCloud
            获得按席位订阅费。扩张沿用同样的合规嵌入路径，但由合作伙伴关系中介。
          tone: neutral
        - id: j7
          label: 续约、扩张与拥护
          detail: >-
            年度或多年合同续约；通过模块附加和席位增长扩张 ARPU；参与 G2/TrustRadius 评论项目（4,000+ 条评论）；发布案例研究；在合作伙伴生态内转介绍。2026 Customer
            Awards（TestMu、Lightcast、OOONO）代表可见度最高的拥护层级。
          tone: positive
    approximationNotes: 旅程阶段由案例研究叙述、合作伙伴项目文档和定价层级结构推断。JumpCloud 未公开披露量化漏斗转化率或逐阶段流失指标。
    claimRefs:
      - CU001
      - CU007
      - CU008
      - CU010
      - CU026
      - CU033
