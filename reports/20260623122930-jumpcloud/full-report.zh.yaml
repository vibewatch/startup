      - number: '5.4'
        title: Agentic IAM、零信任延伸与 2026 年产品路线图
        blocks:
          - type: paragraph
            body: >
              JumpCloud 2026 年最具战略意义的产品动作，是 2026 年 4 月 27 日公开推出 Agentic IAM。该发布瞄准企业身份治理的结构性缺口：组织开始部署自主 AI
              agent，以机器速度执行工作；传统 IAM 系统围绕静态人类凭据构建，无法治理那些会动态认证、委派权限并在无人发起的情况下访问数据的 agent。JumpCloud 自己的 2026 Agentic IAM
              Pulse Report 基于美国和英国数百名 IT 与安全决策者的数据发现，72% 的组织已经在生产环境中使用 AI agent，66% 赋予 AI agent 等同或高于人类用户的系统访问权限，只有 37%
              已把 AI agent 完全集成进正式 IAM 策略。

              Agentic IAM 由四项能力组成：AI Discovery and Directory（发现企业内所有 agent，包括本地运行的 Model Context Protocol
              服务器，并登记到受治理清单）；AI Access and Governance（AI Gateway 登记人类、非人类和 agent 身份，并通过 OpenID Connect 对每一条
              Agent-to-Agent 和 API 流执行认证）；AI Device Trust（实时验证 agent 只在健康、受管的 Windows、macOS 和 Linux 硬件上运行）；以及
              Human-in-the-Loop 治理（高影响 AI 动作执行前，要求明确的人类授权）。平台提供集中式 kill switch，可立即撤销任意 agent 的访问权限，用来应对 rogue-agent
              风险场景。

              2026 年 6 月 11 日，JumpCloud 加深与 Google Cloud 的合作，宣布 Agentic IAM 托管在 Google Cloud 基础设施上，并针对 Gemini Enterprise
              优化；它为 Gemini Enterprise 会话提供生物识别和设备健康验证，并通过第一方集成，让客户能面向 JumpCloud 900+ 应用目录部署 AI agent。JumpCloud 不绑定
              LLM，也不绑定平台；除 Gemini 外，还支持 Claude、Cursor 和其他第三方 AI 工具。2026 年路线图继续推出 Managed AI Connectors 和集中式 token
              管理，扩展面向 Gemini Enterprise 会话的 AI Device Trust，并推出 Agent-to-Agent 信任控制，让 agent 跨系统委派权限时可以执行更细颗粒度策略。Google
              Cloud 合作延续了早前 “Work Transformation Set” 商业安排，该安排把 Google Workspace 与 JumpCloud 统一 IT 管理平面集成在一起。
