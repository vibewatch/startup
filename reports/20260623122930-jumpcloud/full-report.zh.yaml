  - id: TM004
    title: 增长驱动因素与采用约束
    columns:
      - 驱动因素或约束
      - 方向
      - 时间
      - 对 JumpCloud 的影响
      - 尽调问题
    rows:
      - - 监管零信任强制要求（EO 14028、OMB M-22-09、NIST SP 800-207）
        - 驱动
        - 近期（2024–2026，持续）
        - 联邦和承包商分群扩张；政府相邻 SMB 因合规进入销售管线
        - 确认 FedRAMP 或 StateRAMP 认证状态；评估政府部门管线占比
      - - SMB 网络安全支出增长（2026 年全球 $109B，10% CAGR）
        - 驱动
        - 近期
        - 预算存在；JumpCloud 必须从 MSP 和单点工具竞争者手中抢到份额
        - 在 NDA 下索取渠道收入拆分和 MSP 项目 ARR 贡献
      - - 云目录替代 Active Directory
        - 驱动
        - 中期（2025–2028）
        - 没有云目录的组织带来大块绿地机会；迁移复杂度限制推进速度
        - 确认 AD 替代交易相对 Azure AD Sync 路径的胜率数据
      - - AI agent 扩散拉动非人身份需求
        - 驱动
        - 新兴至近期（2026+）
        - Agentic IAM 把 TAM 扩到员工人数之外；中型市场尚无成熟竞争者
        - 跟踪 agentic IAM 预订额作为先行指标；首批报告发布后评估分析师测算
      - - 远程与混合办公常态化
        - 驱动
        - 持续
        - JumpCloud 的云原生远程 IT 管理在结构上匹配这一趋势；Medhacloud 称，到 2026 年底 SMB 工作负载 83% 将在云端
        - 监控远程优先客户群的净推荐值和流失率
      - - Microsoft Entra ID 以零增量成本捆绑
        - 约束
        - 持续
        - 使用 M365 E3/E5 的客户，SSO 和目录价格被打到零；JumpCloud 必须证明跨 OS 和 Linux 价值
        - 索取按主要竞争替代对象拆分的丢单分析
      - - 与传统本地应用集成复杂
        - 约束
        - 中期
        - 实施周期拉长，推高小型 IT 团队的价值兑现时间和流失风险
        - 评估实施支持能力、上线时间数据，以及交易队列的首年留存
      - - 全球 IAM 技能缺口
        - 约束
        - 持续
