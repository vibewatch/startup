  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层、买方画像与渠道构成
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，JumpCloud 披露的 250,000+ 家组织覆盖 160+ 个国家和六个全球区域，但这个头部数字把付费组织和免费层组织混在一起，没有区分。2021 年 10 月 Series
              F 新闻稿给出的比例，是约 5,000 家付费客户对应 120,000+ 家总组织，意味着当时约 95% 的基础在永久免费层；随着总数增至 250,000+，公司仍未发布更新后的付费 /
              免费拆分。付费基础才是收入分析真正有战略意义的部分。

              在付费部分，客户构成明显偏向中端市场公司。Ramp 2026 年 6 月供应商分析数据显示，JumpCloud 在身份提供商类别中采用率为 14%（总排名第四）；中端市场公司采用率最高，为 20%，随后是 SMB
              的 12% 和企业的 9%。在 Ramp 平台上，中端市场买方约占 JumpCloud 构成的 66%。核心买方画像是 50–2,000 人组织中的 IT 经理或小型 IT
              团队；这些组织运营异构设备机队（Windows、macOS、Linux），并正从本地 Active Directory 迁向云原生身份与设备管理。

              JumpCloud 的渠道结构由三条不同路径组成：直接产品驱动增长（PLG），组织通过免费层自助使用，并在达到第 11 名用户 / 设备门槛时自然转化；面向 Platform Prime 和需要合同谈判的企业
              bundle 的直接销售辅助中端市场动作；以及 MSP 和 VAR 渠道，JumpCloud 被打包进第三方合作伙伴交付给 SMB 与中端市场客户的托管 IT 服务。JumpCloud 通过合作伙伴生态在
              170+ 个国家开展业务。MSP 渠道在数量上很重要——CRN 2026 年初报道称，MSP 占 JumpCloud 增长的“相当大一部分”——但具体渠道 ARR 拆分未公开披露。

              公司未正式披露垂直行业集中度，但案例研究证据最明显地集中在几类：技术和 SaaS 公司（云优先、远程优先、合规驱动）、专业服务（托管 IT 和网络安全咨询），以及推进 AD 替代和运营合规的制造与物流公司。
