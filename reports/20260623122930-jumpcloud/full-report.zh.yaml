  - id: FI001
    title: JumpCloud 收入模型桥 — 从客户活动到 ARR
    type: flow
    layout: standard
    summary: JumpCloud 的收入模型从免费层评估开始，经强制转化触发，进入按用户、按月订阅计费，并累积为 ARR；毛利润估计为已收经常性收入的 65–75%。
    data:
      nodes:
        - id: free-signup
          label: 免费层评估（≤10 名用户 / ≤10 台设备）
          detail: 产品驱动增长入口；组织使用成本为 $0。完整平台功能可用于测试身份、设备和 SSO 能力。当组织超过 10 名用户或 10 台设备时触发转化。
          tone: neutral
        - id: conversion-trigger
          label: 强制转化（第 11 名用户或设备）
          detail: 硬上限制造自动变现事件。超过免费阈值的组织必须选择付费层级才能继续使用。对高意向 SMB 客户来说，销售摩擦接近零。
          tone: positive
        - id: per-user-billing
          label: 按用户、按月订阅（标价 $9–$13；Platform 需联系销售）
          detail: >-
            年付计费下分层收费：$9（Device Mgmt）、$11（SSO）或 $13（Device Identity Mgmt）/用户/月。附加模块约 ~$3–4/功能/用户/月。Enterprise Platform 和
            Platform Prime 需要销售谈判。
          tone: positive
        - id: arr-pool
          label: Annual Recurring Revenue 池（2024 年估算 $200M）
          detail: 来自所有付费组织的已签约经常性收入累积。第三方估算 2024 年 ARR 为 $200M（GetLatka，2025 年 11 月）。该数字未经公司确认。
          tone: positive
        - id: gross-profit-estimate
          label: 毛利润（估算为 ARR 的 65–75%）
          detail: 扣除云基础设施、支持和第三方授权 COGS 之后。未公开披露；根据同业基准和竞争成本结构分析估算。公开可比公司 Okta 在 FY2026 实现 77–79% 订阅毛利率。
          tone: neutral
      edges:
        - from: free-signup
          to: conversion-trigger
        - from: conversion-trigger
          to: per-user-billing
        - from: per-user-billing
          to: arr-pool
        - from: arr-pool
          to: gross-profit-estimate
    approximationNotes: ARR 数字为第三方估算（GetLatka，2025 年 11 月），未经公司确认。毛利润估算基于分析师基准和同业比较；JumpCloud 未披露实际毛利率。除免费注册与转化机制外，所有节点均为估算或推断。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI023
      - CI024
  - id: FI002
    title: 单位经济桥 — 从获客到客户级经济性
    type: flow
    layout: standard
    summary: JumpCloud 的单位经济路径从获客走到 ACV 和估算毛利率，再走到回本；关键输入（CAC、NRR、EBITDA）未公开披露，因此用定性节点表示，并在可得处加入行业基准。
    data:
      nodes:
        - id: customer-acquisition
          label: 获客（CAC 未披露）
          detail: >-
            JumpCloud 未按渠道披露 CAC。免费层把 PLG 有机转化的获客成本压近零。销售辅助的中端市场交易获客成本更高。Benchmarkit 2024 年 B2B SaaS CAC 比率中位数：每 $1 新
            ARR 需 $1.76；最高四分位：$2.03。
          tone: neutral
        - id: acv
          label: 平均合同价值（中端市场约 $39K/年，Vendr 估算）
          detail: >-
            Vendr 交易数据显示，中端市场 ACV 中位数约为每年 $39,000。用户数超过 100 的组织可获得 10–25% 的批量折扣。多年合同还会带来额外 10–20% 折扣。该数字为第三方估算，未经
            JumpCloud 确认。
          tone: neutral
        - id: gross-margin-node
          label: 估算毛利率（65–75%）
          detail: 分析师基于与 Okta（FY2026 为 77–79%）的同业对比和竞争成本结构分析作出的估算。JumpCloud 未公开披露。 设备管理工作负载意味着 COGS 高于纯身份管理同业。
          tone: neutral
        - id: gross-profit-per-customer
          label: 单客户毛利（ACV 为 $39K、毛利率 65–75% 时约 $25–29K/年）
          detail: 推导估算：$39K ACV × 65–75% 毛利率 = 每个中端市场客户每年约 $25–29K 毛利。所有输入均为估算；实际毛利未知。
          tone: neutral
        - id: payback-period
          label: CAC 回收期（未披露；行业参照为 8–18 个月）
          detail: JumpCloud 未公开披露回收期。SMB SaaS 最优水平（PLG）：8–12 个月。中端市场销售辅助：14–18 个月。没有实际 CAC 数据，无法计算回收期。
          tone: neutral
      edges:
        - from: customer-acquisition
          to: acv
        - from: acv
          to: gross-margin-node
        - from: gross-margin-node
          to: gross-profit-per-customer
        - from: gross-profit-per-customer
          to: payback-period
    approximationNotes: >-
      除 customer-acquisition 外，所有节点均来自第三方基准和行业数据的估算或推断。JumpCloud 不公开披露 CAC、NRR、毛利率、EBITDA 或回收期。
      gross-profit-per-customer 节点用估算输入推导而来；实际数值可能存在重大差异。行业基准来自 Benchmarkit 2024 SaaS Performance Metrics 研究。
    claimRefs:
      - CI015
      - CI016
      - CI020
      - CI022
      - CI025
      - CI036
