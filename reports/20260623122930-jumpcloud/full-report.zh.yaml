      - number: '7.5'
        title: 客户集中、SMB 宏观敏感性与基础设施依赖风险
        blocks:
          - type: paragraph
            body: >
              JumpCloud 的客户基础从多个方向叠加集中风险：免费层基数不透明、依赖 MSP 渠道、SMB 对宏观环境敏感、 以及基础设施单一供应商暴露。这些风险会相互作用：如果宏观衰退压缩 SMB IT
              预算，最大的付费细分会同时承压， MSP 合作伙伴整合压力也会被触发，并最终传导为 ARR 受损；而公开资料中没有任何早期预警指标可用来预判幅度。

              免费层集中风险是结构性的。JumpCloud 2021 年 10 月披露服务 120,000 多个组织，其中付费组织 5,000 多个， 暗示当时免费到付费转化率约 4%。当前总数超过
              250,000，但付费基数和转化率四年多没有更新； 收入基础质量无法独立评估。以 SMB 为核心的 SaaS 平台在衰退环境中，历史上会面临 30-55% 的年化总流失率， 因为可自由支配的 IT
              预算会被削减；SMB 构成了 JumpCloud 可识别客户基础的大多数。

              MSP 渠道集中带来部分可见的依赖风险。CRN 2026 年报道把 MSP 描述为 JumpCloud 增长的重要组成部分。 2026 年第一季度收购 MacSolution，把 JumpCloud 在巴西最大的
              MSP 合作伙伴收入囊中，交易条款未披露。 这表明至少一个 MSP 关系大到值得纵向整合，也表明头部 MSP 流失风险是管理层已经明确处理过的情景。 MSP 来源 ARR 占比和合作伙伴集中度画像仍未披露。

              基础设施依赖形成单一供应商集中风险。JumpCloud 的纯云 SaaS 平台运行在 AWS 上，没有公开确认的多云故障切换； Cloudflare 提供 CDN 和 DDoS 防护。2026 年 6 月 22
              日管理员控制台降级事件确认二者都是重要依赖。 JumpCloud 的具名案例库完全没有公共部门客户，也与 FedRAMP 缺口一致。
