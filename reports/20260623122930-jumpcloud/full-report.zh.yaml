companyProfile:
  summary: >-
    JumpCloud 是一家总部位于科罗拉多州 Louisville 的云原生身份与 IT 管理公司，运营首个开放、云端目录平台，目标是替代传统 Microsoft Active Directory，服务现代分布式组织。公司成立于
    2012 年，并于 2013 年 9 月在 TechCrunch Disrupt Battlefield 正式发布；2021 年 10 月，Sapphire Ventures 领投 $225M Series F
    后，JumpCloud 估值达 $2.625B，进入独角兽行列。截至 2026 年 6 月，公司服务 160 多个国家的 250,000 多家组织，披露累计融资超过 $400M；第三方分析师估算其 2024 年 ARR 约为
    $200M。公司正从面向人类用户的云目录，演进为由 AI 驱动的统一 IT 管理平台，同时治理人类身份与智能体身份；2026 年 4 月推出 Agentic IAM 以及与 Google Workspace
    的合作，是关键战略增长引擎。
