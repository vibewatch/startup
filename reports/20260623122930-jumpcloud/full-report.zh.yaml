          label: Microsoft Entra ID + Intune
          x: 9
          'y': 7
          detail: Windows 身份和设备管理最深；具备 Entra Governance + 条件访问；Linux MDM 仅限合规注册。打包在 M365 E3/E5 中。
        - id: okta
          label: Okta
          x: 9
          'y': 2
          detail: 市场领先 IAM，拥有 7,500+ SaaS 集成、IGA 和 Auth0 CIAM；零原生设备管理。完全依赖伙伴 MDM。FY2026 收入 $2.919B。
        - id: cisco-duo
          label: Cisco Duo
          x: 4
          'y': 3
          detail: 仅 MFA 和设备信任覆盖层；不是目录替代品。定价 $3–$9/用户/月。为任何现有目录增加安全层；没有 MDM 能力。
        - id: rippling
          label: Rippling
          x: 6
          'y': 6
          detail: HR-IT 融合；provisioning 绑定 HRIS；有 MDM 模块但没有 Linux。估值 $16.8B。身份深度随模块采用增加；部署速度慢于 JumpCloud。
        - id: jamf
          label: Jamf
          x: 3
          'y': 9
          detail: 行业领先 Apple MDM（macOS、iOS、tvOS）；通过收购 Identity Automation 获得身份能力。没有 Linux 或 Windows 设备管理。FY2024 收入 $627M。
        - id: kandji-iru
