  - id: TV005
    title: 论点击穿与终止触发表
    columns:
      - 触发因素
      - 阈值或事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 新一轮主股融资大幅折价
        - JumpCloud 以低于 $1.0B 的估值融资（较 Series F 低 >62%）
        - 确认估值重置，并验证熊案企业价值；释放投资者对 2021 年锚点失去信心的信号；触发对所有现有持有人的优先股堆栈分析
        - 立即退出持仓；不要按任何与 2021 年估值标记挂钩的价格投资；只有在完整分析新一轮条款的股权结构瀑布后才重新评估
      - - NRR 确认低于 100%
        - 任何公开披露或投资者披露显示净美元留存低于 100%（客户群萎缩）
        - 收入模型出现结构性受损；压低可持续 ARR 增速；倍数进一步向 3x 底部压缩（依据 iMerge NRR 断崖数据）
        - 下调至规避；$200M 规模下客户群持续萎缩的漏桶式 ARR 模型，在任何情形下都撑不起溢价倍数
      - - Microsoft Entra ID 在中端市场零增量成本打包
        - Microsoft 调整授权，将 Entra ID 以无额外成本纳入覆盖 JumpCloud 核心 50–2,000 人员工区间的 Microsoft 365 Business Premium 层级
        - 摧毁 JumpCloud 的核心定价权；免费层价值主张被现有巨头打包消解；TAM 实质收缩
        - 立即规避；可服务市场收缩速度快于 JumpCloud 向上游市场或 Agentic IAM 收入转向的速度
      - - 融资缺口超过 60 个月且没有披露
        - 到 2026 年 Q4 末仍无新主股融资、IPO 申报或收购公告
        - 释放资本充足性担忧，或说明公司无法以可接受条款取得股权资本；困境融资事件概率上升
        - 升级尽调；要求现有股东披露财务；没有确认 runway 数据前，不做新的二级市场承诺
    claimRefs:
      - CV003
      - CV014
      - CV019
      - CV037
      - CV040
      - CV043
    notes: >
      触发阈值是基于可得市场基准构建的分析框架，并非 JumpCloud 已确认的经营目标。NRR 阈值来自 iMerge 2026 年 Q1 数据，显示估值在 100% NRR 处出现断崖。Microsoft
      打包情景是竞争分析中的风险假设；截至 2026 年 6 月 23 日，尚未发现此类打包公告。
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - ARR 与 NRR 确认
        - 没有公司确认的 ARR、NRR、总美元留存或队列级收入数据；所有数字均为第三方估算，范围为 $105M–$200M
        - ARR 是所有情形下的核心价值驱动；ARR 变动 $50M，在 6x 倍数下会改变 $300M 基础案 EV；NRR 决定倍数底部与顶部
        - 向 Series F 投资者（Sapphire Ventures、BlackRock、General Atlantic）或 JumpCloud 直接索取经审计或管理层确认的 ARR 明细，作为任何融资流程的一部分
      - - 股权结构瀑布与优先股堆栈分析
        - Forge COI 数据显示 Series F 为 1.0x 非参与型清算优先权；所有轮次及任何债务工具的完整优先股堆栈未公开
        - 在任何低于 $2.625B 的退出中，优先权瀑布决定普通股和更早期优先股能分到多少价值；这是建模二级市场进入回报的关键
        - 从律师或拥有访问权的共同投资人处取得 Series F 公司注册证书、投资者权利协议及任何附函
      - - 盈利指标与 burn rate
        - >-
          未公开披露毛利率、EBITDA、经营利润率、burn rate 或 runway 数据；Revelio Labs 员工数（约 1,165 人，2025 年 12 月）与估算 ARR 合并推算，每员工收入约
          $172K，但无法解答盈利能力
        - 按 iMerge 2026 年 Q1，Rule of 40 状态和 EBITDA 利润率是倍数溢价 / 折价的主要驱动；未知 burn rate 让 56 个月融资缺口下的资本充足性更不确定
        - 在任何新融资流程中索取月度财务报表，或至少索取 LTM EBITDA 与自由现金流；替代路径是通过前员工披露或 Glassdoor 薪酬数据三角验证
      - - Google 合作经济性与收入贡献
        - Google Workspace Work Transformation Set 合作结构、收入分成、排他条款和商业表现指标均未公开披露
        - 该合作可能是有意义的分销加速器（支撑牛案），也可能是单点依赖风险（触发合作伙伴 / 依赖风险）；所有量化模型都未纳入该项，造成重大不确定性
        - 向 JumpCloud 或 Google 索取合作收入贡献、Google 渠道获客数据和合同条款（排他性、续约、控制权变更条款）
    claimRefs:
      - CV003
      - CV021
      - CV031
      - CV035
      - CV027
      - CV044
    notes: 尽调问题为指示性；能否解决取决于能否取得公开来源没有的公司财务数据、股权结构文件和合作协议披露。
