      - number: '1.3'
        title: 资本基础、融资历史与投资人图谱
        blocks:
          - type: paragraph
            body: >
              JumpCloud 从种子轮到 Series F 约十一轮累计融资超过 $400M。融资曲线始于 2012 年 12 月 Foundry Group 投入的 $1.2M 种子轮，随后是 2014 年 1 月
              $3.07M Series A（Foundry 与 Techstars），2015 年两笔 Series B 合计约 $9M，2017 年 11 月 $20M Series C（OpenView 与
              Foundry），2019 年 5 月 General Atlantic 领投 $50M Series D，以及 2020 年 11 月和 2021 年 1 月 BlackRock 领投、合计 $100M 的
              Series E。


              Series F 是最大、也最具影响力的一轮融资。首笔 $159M 于 2021 年 9 月 13 日宣布，估值 $2.56B，由 Sapphire Ventures 领投，Owl Rock、Whale Rock
              Capital、Sands Capital、Endeavor Catalyst 参投，原有投资人 General Atlantic、BlackRock 和 H.I.G. Growth Partners
              跟投。2021 年 10 月 19 日宣布的第二笔 $66M 将本轮总额推至 $225M，投后估值升至 $2.625B；该笔引入战略投资人 Atlassian Ventures、CrowdStrike
              Falcon Fund、NTT Docomo Ventures、STEADFAST Capital Ventures、Waterman Ventures 和 OurCrowd。Tracxn 记录各轮共有 34
              家机构投资人；不同数据库给出的累计融资额在 $408M–$418M 之间，而公司自称为 $400M+，差异来自对分批融资的计数方法不同，并不构成事实冲突。自 2021 年 10
              月以来，公司未公开宣布后续股权融资；因此 $2.625B 仍是最新披露估值。完整股权结构、Series F 之后的清算优先权瀑布以及任何二级交易历史均未公开。
