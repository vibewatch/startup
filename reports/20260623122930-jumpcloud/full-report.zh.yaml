        - 各类规模；在 Windows 中心和 Microsoft 365 客户中占优
        - 在 M365 E3/E5 中零增量成本捆绑；Windows 和 Azure AD 集成最深
        - Linux MDM 弱；Microsoft 生态外价值较低；非 Microsoft 买方定价复杂
      - - Okta
        - 独立 IAM（无 MDM）
        - 上市（OKTA）；FY2026 收入 $2.919B；同比增长 12%；RPO $4.827B
        - 中型市场到大型企业；同时覆盖员工身份 + 客户身份平台
        - 7,500+ SaaS 集成；Lifecycle Management；Auth0 CIAM；企业 IAM 份额估计 41%
        - 无原生设备管理；单席价格更高；模块化成本随功能采用增加
      - - Cisco Duo
        - MFA 叠加层 + 设备信任（无目录）
        - Cisco Security 的一部分（FY2025 收入 >$4B）；Duo 未单独拆分
        - SMB 到企业；安全优先买方在现有目录上叠加 MFA
        - 增量 MFA + 自适应访问，$3–$9/用户/月；可与任何目录集成
        - 不替代目录；无完整 MDM；高级功能依赖 Cisco 生态
      - - OneLogin (One Identity)
        - 独立云 IAM（SSO + 生命周期）
        - 私有；2021 年 1 月被 One Identity（Quest Software）收购；收入未披露
        - SMB 和低端中型市场；SSO 优先且追求性价比 IAM 的买方
        - 更简单的云 SSO，带自助门户；纯 SSO 用例具备成本竞争力
        - 无设备管理；应用目录小于 Okta；收购后 R&D 投入减少
      - - Rippling
        - HR-IT 融合（HRIS + IAM + MDM）
        - 私有；2025 年 5 月 Series G 融资 $450M，估值 $16.8B；2026 年 ARR 约 $1B
        - 中型市场（100–2,000 名员工），HR + IT 统一采购
        - 单一员工图谱驱动零接触预配；HRIS、薪资、身份、MDM 合一
