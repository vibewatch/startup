  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 这张因果图展示 JumpCloud 四项主要外部风险输入——国家级攻击、Microsoft 捆绑、SMB 宏观衰退和 FedRAMP 排除——如何经由客户信任、市场份额和 ARR 增长传导，最终推高估值和流动性风险。
    data:
      nodes:
        - id: breach
          label: 国家级攻击复发
          detail: 2023 年 UNC4899 入侵确认 DPRK 供应链攻击；考虑到 JumpCloud 是 200K+ 组织的身份控制平面，复发风险具有结构性。
        - id: bundling
          label: Microsoft M365 捆绑压力
          detail: Entra ID 已纳入 M365 E3/E5，边际成本接近零；Ramp Rate 显示，截至 2026 年 6 月，JumpCloud IDP 采用率同比下降 2 个百分点至 14%。
        - id: macro
          label: SMB 宏观 / 衰退冲击
          detail: 面向 SMB 的 SaaS 平台在衰退中面临 30-55% 年化 gross churn；JumpCloud 较重的 SMB 权重带来周期性收入敞口。
        - id: fedramp
          label: FedRAMP 市场排除
          detail: 截至 2026 年 6 月仍无 FedRAMP 授权；在获得授权之前，美国联邦和多数受 CMMC 要求约束的承包商采购会被持续阻断。
        - id: trust
          label: 客户信任侵蚀
          detail: 入侵事件或可靠性事故会侵蚀客户对身份提供商的信任；IAM 品类中的信任损失不对称——失去容易，修复更难。
        - id: share
          label: IDP 市场份额流失
          detail: 捆绑替代和 FedRAMP 排除会移除可触达细分；PeerSpot 在 SSO 品类中将 JumpCloud 排第 11，Entra ID 排第 1。
        - id: arr
          label: ARR 增长减速
          detail: 流失抬升（宏观 + 信任侵蚀）叠加新 logo 获取减少（份额流失 + FedRAMP 缺口），会压缩净 ARR 增长。
        - id: multiple
          label: 估值倍数压缩
          detail: ARR 增速降低会削弱可辩护的收入倍数；2022 年后的 SaaS 压缩已把市场推至 5-10x ARR，而 JumpCloud 2021 年轮次为 46.5x。
        - id: exit
          label: 下轮降价 / IPO 受阻
          detail: $2.625B 的 2021 年估值需要持续高增长，才能在当前倍数下撑住；任何低于水位线的事件都会阻断或推迟投资者流动性。
        - id: impairment
          label: 收入与增长受损
          detail: ARR 持续减速会削弱支撑投资论点所需的增长叙事；公开 NRR 或队列数据缺失，也无法提供早期预警。
      edges:
        - from: breach
          to: trust
          label: 抬升客户担忧
        - from: bundling
          to: share
          label: 续约时替代
        - from: macro
          to: arr
          label: 减少净新增 ARR
        - from: fedramp
          to: share
          label: 排除市场细分
        - from: trust
          to: arr
          label: 抬升 gross churn
        - from: share
          to: arr
          label: 限制新 logo 增长
        - from: arr
          to: multiple
          label: 增长降低压缩倍数
        - from: multiple
          to: exit
          label: 阻断高于水位线退出
        - from: arr
          to: impairment
          label: 直接 ARR 减速
    claimRefs:
      - CR001
      - CR008
      - CR011
      - CR017
      - CR019
      - CR026
      - CR034
  - id: FR003
    title: 依赖图
    type: dag
    layout: standard
    summary: 网络视图展示 JumpCloud 为维持平台可靠性、增长和合规必须协调的关键外部节点——基础设施提供商、渠道伙伴、竞争生态、监管机构和组织核心人物。
    data:
      nodes:
        - id: platform
          label: JumpCloud SaaS 控制平面
          detail: 服务 200K+ 组织的多租户身份和设备管理平台；仅云交付，没有本地 fallback 模式。
        - id: aws
          label: AWS（IaaS 基础设施）
          detail: 所有 JumpCloud SaaS 组件均托管在 AWS；没有公开确认的多云或混合架构；IaaS 集中在单一厂商。
        - id: cloudflare
          label: Cloudflare（CDN / WAF）
          detail: 为管理控制台和端点提供 CDN 加速及 DDoS/WAF 保护；2026 年 6 月 22 日故障直接触发管理控制台降级。
        - id: msp
          label: MSP 渠道伙伴（170+ 国家）
          detail: 据 CRN，ARR 增长中相当一部分来自该渠道；MacSolution 收购显示至少存在一个重要单一伙伴依赖；集中度未披露。
        - id: microsoft
          label: Microsoft（M365/Entra 竞争生态）
          detail: 在 M365 E3/E5 中以近零边际成本捆绑 Entra ID；Microsoft 安全功能持续扩展进基础 SKU，形成长期定价逆风。
        - id: fedramp
          label: FedRAMP 授权机构（JABS/3PAO）
          detail: 美国联邦采购要求授权；JumpCloud 未列入在审清单；进入该市场需要多年投入。
        - id: ceo
          label: Rajat Bhargava（CEO / 联合创始人）
          detail: 自 2013 年起担任唯一 founder-CEO；所有战略愿景和投资者关系集中于一人；无公开继任计划。
        - id: ciso
          label: Roland Palmer（CISO）
          detail: 2023 年入侵后任命；持有 FedRAMP、ISO 27001 和 HIPAA 资质；安全认证连续性取决于 CISO 对项目的主导权。
        - id: customers
          label: 250,000+ 个组织
          detail: 覆盖 160+ 个国家的总组织数 250K+；最后披露的付费数量为 5,000+（2021 年 10 月）；免费转付费比例和 NRR 未知。
      edges:
        - from: aws
          to: platform
          label: 承载全部 IaaS
        - from: cloudflare
          to: platform
          label: CDN / DDoS 层
        - from: ceo
          to: platform
          label: 愿景与治理
        - from: ciso
          to: platform
          label: 安全项目
        - from: platform
          to: customers
          label: 交付 IAM 服务
        - from: msp
          to: customers
          label: 渠道交付服务
        - from: microsoft
          to: platform
          label: 竞争替代
        - from: fedramp
          to: platform
          label: 授权门槛
    claimRefs:
      - CR039
      - CR040
      - CR012
      - CR030
      - CR037
      - CR020
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: |
      从市场机会、产品验证、财务信号、竞争风险和估值锚点出发，结合 2026 年 Q1 估值倍数压缩背景， 推导出对 JumpCloud 的持有 / 观察建议。
    data:
      nodes:
        - id: market-proof
          label: 市场与验证：IAM TAM $25–30B+，12–15% CAGR 增长；已服务 250K+ 家组织；PLG 模型在 SMB / 中端市场跑通了 产品市场匹配
        - id: product-moat
          label: 产品与护城河：云原生、OS 无关目录，叠加 Google 合作和 Agentic IAM 计划；但 Microsoft Entra ID 是近乎无处不在的 在位产品
        - id: financials
          label: 财务：估计 2024 ARR $200M（Latka）；收入 / 员工约 $172K（Revelio）；NRR、毛利率、EBITDA 和烧钱速度均未披露
        - id: risks
          label: 风险：高 —— $2.625B 优先权包袱；无二级市场价格信号；融资空窗 56 个月；2026 年 Q1 SaaS 估值倍数压缩至十余年低点
        - id: valuation
          label: 估值：基准情形 $1.2B（6x × $200M ARR）；乐观情形 $1.84B（8x × $230M）；Series F 锚点 $2.625B，是任何情景区间的 2–4x
        - id: recommendation
          label: 建议：持有 / 观察 —— 不按 2021 年 Series F 价格投资；若二级入场估值低于 $1.2B，且确认 ARR ≥$200M 并完成股权结构分析，可考虑
      edges:
        - from: market-proof
          to: product-moat
          label: 验证
        - from: product-moat
          to: financials
          label: 提供依据
        - from: financials
          to: risks
          label: 放大
        - from: risks
          to: valuation
          label: 约束
        - from: valuation
          to: recommendation
          label: 驱动
    claimRefs:
      - CV001
      - CV010
      - CV027
      - CV033
      - CV035
      - CV043
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: >
      在三个 ARR 情景（悲观 $175M、基准 $200M、乐观 $230M）下，按 4x–8x EV/ARR 倍数区间测算隐含企业价值（$M）， 并标出 $2.625B Series F
      锚点作参照。结果显示，在可辩护的分析区间内，没有任何 ARR 与倍数组合能达到 2021 年融资标记。
    data:
      items:
        - label: 悲观 ARR $175M @ 4x
          value: 700
        - label: 悲观 ARR $175M @ 6x
          value: 1050
        - label: 基准 ARR $200M @ 5.3x
          value: 1060
        - label: 基准 ARR $200M @ 6x
          value: 1200
        - label: 基准 ARR $200M @ 8x
          value: 1600
        - label: 乐观 ARR $230M @ 8x
          value: 1840
        - label: Series F 锚点（2021 年 10 月）
          value: 2625
    approximationNotes: >
      ARR 数据为第三方估计（Sacra、Latka）。倍数取自 iMerge 2026 年 Q1 私营 SaaS 指数、SaaS Capital 2025 模型和 Okta 上市 EV/Sales。EV
      为企业价值，未经过优先清算权栈的瀑布分配，不代表各类股份的权益价值。
