  - id: TE002
    title: JumpCloud 使用场景工作流表——用户任务、传统做法、JumpCloud 方案、收益与限制
    columns:
      - 用户任务
      - 传统工作流
      - JumpCloud 方案
      - 可衡量收益
      - 已知限制
    rows:
      - - 员工入职
        - IT 手工创建 AD 账户、发送凭据、配置 VPN，并逐个开通 SaaS 工具
        - HRIS 触发 → SCIM 开通 → 自动分组 → 自动 SSO 访问 + 设备注册
        - 零接触入职；访问开通从数小时压到数分钟
        - HRIS 连接器目录小于 Okta；部分 HR 系统需要自定义 SCIM 设置
      - - 远程设备管理
        - 按 OS 使用现场 IT 或端点 agent（SCCM、Jamf、Intune）；控制台彼此分离
        - 用一个 JumpCloud 控制台管理 Win/macOS/Linux/iOS/Android 策略和补丁
        - 一个控制台省掉按 OS 购买工具许可；Linux 原生受管
        - macOS 深度功能尚未完全追平 Jamf；Linux 补丁仅支持 Ubuntu
      - - SaaS 应用访问（SSO）
        - 用户为每个 SaaS 应用管理独立密码；IT 反复重置遗忘密码
        - 900+ 个 SAML/OIDC 连接器；一个门户；按策略强制 MFA
        - 减少密码支持工单；可选抗钓鱼 JumpCloud GO
        - 高级 OAuth 2.0 配置档尚未确认；不提供面向外部 / 客户身份的 CIAM
      - - MFA 强制与合规
        - 仅靠 VPN 访问；通过邮件手工注册 MFA；逐应用配置 MFA
        - 策略驱动 MFA，支持 TOTP、推送、FIDO2 和基于上下文风险的强制执行
        - 从一个管理门户统一覆盖设备、应用、VPN 和 Wi-Fi 的 MFA
        - Agent 中断会扰乱 MFA 同步（TOTP 本地登录继续；推送停止）
      - - AI agent 治理（Agentic IAM）
        - 没有正式治理；agent 使用共享服务账户或真人凭据运行
        - AI Discovery → AI Gateway → OIDC 认证 → HITL 检查点 → 审计日志
        - 补上「归因缺口」；用集中熔断开关撤销失控 agent
        - 能力会在 2026 年持续推出；Gemini Enterprise 集成度最高；其他仍处 beta
    notes: 工作流描述综合自 JumpCloud 官方产品页、用户评论（PeerSpot、G2/AWS Marketplace）和专家评测分析。收益来自 JumpCloud 声明或用户反馈；ROI 数据未经独立验证。
