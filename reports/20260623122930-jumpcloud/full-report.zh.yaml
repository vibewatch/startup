  - id: TE001
    title: JumpCloud 产品模块矩阵——类别、OS/协议支持、成熟度、差异化与尽调缺口
    enumerationScope:
      coverage: exhaustive
      basis: >-
        All modules listed on JumpCloud's official platform navigation as of June 2026 access; covers Identity
        Management, Access Management, Device Management, and AI & SaaS Management pillars
    columns:
      - 模块
      - 类别
      - OS / 协议支持
      - GA / 成熟度状态
      - 关键差异化
      - 尽调缺口
    rows:
      - - Cloud Directory
        - 身份管理
        - 全 OS（LDAP、RADIUS、SCIM）
        - 已全面可用
        - 无需本地服务器的云 LDAP/RADIUS 替代方案；每名用户单一身份
        - 无 SoD 或访问认证功能；无自托管选项
      - - Single Sign-On（SSO）
        - 访问管理
        - SAML 2.0、OIDC/OAuth 2.0
        - 已全面可用
        - 900+ 个预构建连接器；与 MFA 和条件访问原生集成
        - 高级 OAuth 2.0 配置（PAR、DPoP、mTLS）未确认；无 CIAM 能力
      - - Multi-Factor Authentication（MFA）
        - 访问管理
        - TOTP、推送、FIDO2/WebAuthn、生物识别、JumpCloud GO
        - 已全面可用
        - JumpCloud GO 提供硬件保护的无密码；免费 Protect 认证器应用
        - 生物识别深度弱于企业 IdP；离线 MFA 在故障中会中断
      - - Unified Endpoint Management（UEM）
        - 设备管理
        - Windows、macOS、Linux、iOS/iPadOS、Android 五类 OS
        - 已全面可用
        - 唯一具备完整深度跨 OS 覆盖并包含 Linux 策略管理的厂商
        - Ubuntu 是主要 Linux 发行版；其他发行版支持有限
      - - 补丁管理
        - 设备管理
        - Windows（KB）、macOS/iOS（DDM）、Ubuntu Linux、Chrome 等补丁源
        - 已正式可用
        - 采用 Apple DDM，原生下发 OS 补丁；Windows KB 仪表盘粒度更细
        - Linux 补丁支持仅限 Ubuntu；未覆盖 ChromeOS 补丁
      - - 特权访问管理（PAM）
        - 访问管理
        - 基于浏览器（任意 OS）
        - 已正式可用
        - 浏览器原生网关支持会话录制；不需要 VPN
        - 面向企业 PAM 场景，成熟度不及 CyberArk 或 BeyondTrust
      - - 条件访问
        - 访问管理
        - Windows、macOS、Chrome Enterprise（非托管）
        - 已正式可用
        - 打通设备健康、网络和用户风险；承接 Chrome Enterprise
        - 设备信任仅覆盖受管终端；非托管 BYOD 仍有缺口
      - - Agentic IAM
        - 身份管理 / AI
        - Windows、macOS、Linux；不绑定特定 LLM
        - Beta / 2026 年陆续推出
        - 率先用统一控制平面管理 AI agent 生命周期，并套上 Zero Trust
        - 能力仍在推出；Gemini Enterprise 集成最成熟
      - - Cloud LDAP / Cloud RADIUS
        - 访问管理
        - LDAP、RADIUS（PEAP-MSCHAPv2）
        - 已正式可用
        - 云托管 LDAP/RADIUS；可接入遗留应用和网络设备
        - 仅限 JumpCloud 管理的云；不为 Kerberos/NTLM 做协议桥接
      - - SaaS 管理与 Shadow AI 治理
        - AI 与 SaaS 管理
        - SaaS（无 agent 发现）
        - 已正式可用
        - 发现 Shadow AI 工具和未授权 SaaS；内置支出优化
        - 成熟度低于专门的 SaaS 管理厂商（Torii、BetterCloud）
    notes: 模块清单来自 JumpCloud 截至 2026 年 6 月的官方平台导航。GA / 成熟度状态由 JumpCloud 声明；暂无独立成熟度评估。「尽调缺口」单元格基于用户评论和竞争分析，由分析师判断。
