      - number: '3.3'
        title: 功能、能力与定价对比
        blocks:
          - type: paragraph
            body: >
              JumpCloud 最重要的结构性能力差异，是从单一控制台原生管理 Windows、macOS、Linux、iOS 和 Android 的跨 OS 设备管理。Microsoft Intune 对 Windows
              和 macOS 管理完整，但截至 2026 年 6 月，其 Linux 支持仅限设备合规注册和条件访问策略执行，缺少 JumpCloud 为 Linux 端点提供的完整策略管理、补丁管理、脚本执行和应用部署。这一
              Linux 对等缺口，是 JumpCloud 对抗 Microsoft 打包技术栈的主要胜利条件。

              JumpCloud 2026 年公开定价结构为：Device Management（年付 $9/user/month，跨 OS MDM、补丁管理、远程管理）、SSO（年付 $11/user/month，不限
              SSO 应用、MFA、密码管理器）和 Device Identity Management（年付 $13/user/month，云目录、MDM 与条件访问组合）。免费层覆盖 10 个用户和 10
              台设备。Microsoft Entra ID P1 独立订阅价格为 $6/user/month，P2 为 $9/user/month；但对已经使用 M365 E3 或 E5
              的组织来说，增量成本实际上为零。Microsoft Intune 作为独立产品约 $8/user/month，也包含在 M365 Business Premium（$22/user/month）中。对已使用
              M365 E3 与 Intune 的纯 Windows 客户，身份加设备组合全包成本为 $36/user/month，而 JumpCloud Device Identity Management 为
              $13/user/month；不过，对依赖 Azure AD Connect、hybrid join 或深度 Microsoft 365 安全工具的组织，JumpCloud 并不可完全替换。

              Okta 定价模块化，基础 SSO（Okta Workforce Identity Standard）约 $2/user/month 起，包含 Lifecycle Management 和 Identity
              Governance 的完整平台达到 $17+/user/month。根据 Costbench 数据，25 席 Okta 实施的实际年支出中位数约 $1,800/year，而 JumpCloud 约
              $1,000/year。Okta 的 7,500+ 预构建 SaaS 集成，使其在 SaaS 组合复杂、或需要大规模细粒度生命周期自动化的企业中拥有决定性优势。

              G2 功能评分（来自 G2 对比页面的 Wayback Machine 快照，反映截至 2025 年中累计评论数据）显示，JumpCloud 在易用性（9.0）和 MFA（9.1）上得分最高；Microsoft
              Entra ID 在角色管理（9.2）、集中管理（9.3）和审批工作流（9.0）上领先。对比 Okta，JumpCloud 在 SSO 集成（9.1 vs 9.6）、MFA 广度（9.1 vs
              9.6）和自动化开通（8.7 vs 9.5）上落后。独立评测者批评 JumpCloud 的 Directory Insights
              报告筛选、定制查询支持和告警创建能力有限，这限制了其对需要高级审计轨迹的安全运营团队的吸引力。JumpCloud 也缺少专门的自助密码重置门户，因此相较 Microsoft Entra ID，会增加 IT
              helpdesk 工作量。
