      - number: '2.2'
        title: TAM、SAM 与 SOM 测算——多重视角与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >
              没有一个权威数字能覆盖 JumpCloud 精确的可服务市场，因为公司横跨 IAM、UEM 和新兴智能体身份，多数公开报告又分别测算这些类别。本节从已发布估算中拼出自下而上的视角，并保留其中的矛盾。

              最宽的 TAM 视角是总 IAM 支出。2026 年公开估算存在实质冲突：Grand View Research 给出 $26.2B（到 2033 年 CAGR 为 11.3%）；The Business
              Research Company 给出 2026 年 $25.23B（到 2030 年 CAGR 为 15.7%）；MarketsandMarkets 从 2025 年 $25.96B 基数和 10.4%
              CAGR 推算，暗示 2026 年约 $28.5B，并预测 2030 年达到 $42.61B；Mordor Intelligence 将仅云端 IAM 软件子板块定在 2026 年 $10.91B。Fortune
              Business Insights 若纳入托管服务，发布的 2026 年 IAM 估算在 $37B 区间。这些从 $25B 到 $37B 的同年差异，反映的是托管服务、CIAM
              和专业服务是否纳入范围的口径分歧。任何公开数字都无法在全样本层面独立验证。

              将 UEM（$8.85B，Mordor Intelligence，2026）与云端 IAM 子板块（$10.91B）相加，得到 2026 年云身份加端点管理 TAM 合计 $19.76B。这最接近
              JumpCloud 的完整产品范围，但低估了本地 IAM 和 ZTNA 相邻价值。

              JumpCloud 的可服务市场（SAM）受其 go-to-market 聚焦限制：50–5,000 名员工、Linux/Mac/Windows 异构设备队列，并且没有需要保护的深度遗留 Oracle 或 SAP
              IAM 基础设施。公开来源未单独拆出该细分。一个非正式三角估算是：若 SME 占云 IAM 支出约 19.7%（Mordor 的 SME 份额），套用到 $10.91B 云 IAM 总额；再将 UEM 支出的
              24.95% 套用到 $8.85B，则 SME 云身份加 UEM 机会约为 $2.15B 加 $2.21B，即 2026 年约 $4.3B。该三角估算是在估算之上再估算，只应视作示意性边界，而非经审计数字。

              从公开证据无法量化 JumpCloud 的可获得市场（SOM）。公司 $200M 估算 ARR（GetLatka，2024，未确认）相对于上述 $4.3B SME 细分估算，暗示 SAM 渗透率约 4–5%。截至
              2026 年 6 月，智能体 IAM 市场（非人类身份治理）尚无成熟分析师测算；媒体报道引用 Gartner 预测称，到 2027 年 70% 的 AI
              项目可能因治理失败而延迟，这说明有需求，但没有量化市场规模。
