      - number: '1.2'
        title: 创始人、管理层、董事会与治理
        blocks:
          - type: paragraph
            body: >
              JumpCloud 由 Rajat Bhargava（CEO）和 Greg Keller（CTO）共同创立；Wikipedia 有来源的公司历史也将 Larry Middle 列为联合创始人。Bhargava
              毕业于 MIT，公司称其为连续创业十次的企业家，已有七次退出，包括两次 IPO 和五次并购出售；他仍是公司最主要的公众代表、战略决策者和融资负责人。Keller 拥有约 30 年技术经验，负责 JumpCloud
              最初云目录平台的构思与发布，并继续领导技术架构和平台创新。创始人双核的人物集中度值得注意：Bhargava 与 Keller 共同承载了原始产品愿景、外部信任、资本关系和技术连续性。


              2026 年，JumpCloud 高管团队因两项任命明显增强。Roland Palmer 于 2026 年 3 月 2 日加入，担任首席信息安全官和安全副总裁，带来 20 多年安全经验，其中包括在 Sumo
              Logic 担任安全与合规副总裁八年。Shianne Sampson 于 2026 年 3 月 23 日加入，担任首席营收官，拥有 20 多年营收领导经验，曾任职 Eventbrite、New
              Relic、Zenefits 和 Yelp。同一季度补齐 CISO 与 CRO 两个角色，显示公司正在为企业客户和全球市场扩张主动扩组织。


              JumpCloud 董事会包括 Brad Feld（Foundry Group，早期投资人）、Alex Crisses（General Atlantic 董事总经理）、Amol Kulkarni（前
              CrowdStrike 首席产品与工程官）、Maria Martinez（前 Cisco EVP/COO）、Tracy Knox（三次担任上市公司 CFO，现任审计主席）、Jose
              Morales（Francisco Partners 运营合伙人）和 Will Herman（天使投资人）。董事会构成体现了长期 VC 延续性（Foundry）、成长股权协同（General
              Atlantic）、安全生态可信度（Kulkarni/CrowdStrike）以及独立治理监督（Knox）。投票控制、股东协议以及创始人是否享有超级投票权等治理细节均未公开披露，构成重要尽调缺口。
