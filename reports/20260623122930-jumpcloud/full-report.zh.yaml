    summary: 截至 2026 年 6 月，按严重度排列 JumpCloud 八项主要投资风险在概率、影响和分析师风险评级维度上的热力图；国家级攻击复发、Microsoft 替代和 FedRAMP 市场排除录得最高综合风险评级。
    approximationNotes: 概率和影响标签是分析师基于公开证据作出的判断；JumpCloud 未披露内部企业风险管理矩阵。概率标签反映未来 12 个月可能性。影响反映风险一旦落地，对收入、客户信任或估值的潜在量级。
