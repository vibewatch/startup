  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型、定价与 ARR 轨迹
        blocks:
          - type: paragraph
            body: >
              JumpCloud 采用纯订阅 SaaS 收入模型，通过分层套餐按用户、按月向客户收费。变现漏斗始于长期免费的层级，限制为 10 个用户和 10
              台设备；该层级作为产品驱动增长（PLG）入口，当组织超过门槛时自然触发转化。官方定价页公开标价显示，年付时 Device Management 层级起价为每用户每月 $9，SSO 层级为每用户每月
              $11，Device Identity Management 层级为每用户每月 $13（月付为每月 $15）。Platform Essentials、Platform 和 Platform Prime
              套餐需要联系销售，未公布按席位价格；Platform Essentials 上限为 300 个用户。根据 Sacra 的商业模式描述，SAML
              SSO、RADIUS、补丁管理和高级集成等附加模块价格约为每功能、每用户、每月 $3–4。


              第三方分析师估算的收入轨迹显示，公司五年内实现了实质增长。Sacra 模型估算 ARR 从 2020 年约 $25M 增至 2021 年 $55M（同比 +120%）、2022 年 $80M（+45%）和
              2023 年 $105M（+31%）。GetLatka 另行报告称，JumpCloud 2024 年达到 $200M，引用 JumpCloud 官网作为来源，数据更新于 2025 年 11
              月。这些数字均未获公司确认；两者都来自第三方估算模型。Sacra 与 Latka 在 2022–2023 年数字上存在差异：Latka 时间线显示 2022 年 11 月为 $71.6M、2023 年 11 月为
              $76.6M（均标注“Estimated”），而 Sacra 的年末 ARR 估算分别为 $80M 和
              $105M——差异反映方法不同，不是已验证底层数字。在缺少经审计财务的情况下，两类来源都只能作为近似信号，而非已确认指标。JumpCloud 披露截至 2026 年 6 月服务组织总数超过 250,000 家，但
              2021 年 10 月 Series F 新闻稿只提到“more than 5,000 paying customers”，说明绝大多数组织使用免费层。
