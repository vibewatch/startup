  - id: FE001
    title: JumpCloud Open Directory Platform——产品架构栈
    type: stack
    layout: standard
    summary: JumpCloud 平台以单一云原生代理交付，分为五层：顶部是 AI 与 SaaS 治理，底部是平台基础设施。
    data:
      layers:
        - label: AI 与 SaaS 治理
          detail: >-
            Shadow AI Governance、SaaS App Discovery、SaaS Spend Optimization、SaaS Access Control、SaaS Security
            Insights——在身份与设备控制平面之上叠加的无代理 SaaS 发现。
        - label: Agentic IAM（2026 年 4 月推出）
          detail: >-
            AI Discovery & Directory、AI Gateway（OIDC、MCP、A2A）、AI Device Trust、Human-in-the-Loop 治理，以及覆盖 AI agent
            生命周期的集中式 kill switch。托管在 Google Cloud；面向 Gemini Enterprise 优化。
        - label: 身份与访问管理
          detail: >-
            Cloud Directory（LDAP/RADIUS）、SSO（SAML 2.0/OIDC——900+ 连接器）、MFA（TOTP/push/FIDO2/WebAuthn/JumpCloud
            GO）、Conditional Access、Cloud LDAP、Cloud RADIUS、PAM、Password Manager、Access Request、Directory Insights API。
        - label: 设备管理
          detail: >-
            跨 Windows、macOS、Linux、iOS/iPadOS、Android 的统一端点管理。Patch Management（Apple DDM、Windows KB、Ubuntu
            Linux、Chrome）、System Insights、Remote Access、Asset Management。
        - label: 平台基础设施
          detail: >-
            云原生 SaaS（无本地服务器）。端点上的 JumpCloud Agent（TLS 1.2+ 通道）。REST APIs v1/v2。AI Gateway 托管在 Google Cloud。Cloudflare
            CDN/WAF。美国和欧盟端点支撑多区域 HA。
    approximationNotes: 层级边界基于 JumpCloud 截至 2026 年 6 月的官方平台分类。Agentic IAM 单独成层，是为反映其 2026 年推出状态和仍在推进的分阶段推广。
    claimRefs:
