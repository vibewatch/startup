      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              在 JumpCloud 客户组织内，买方、用户和付款方往往不是同一个人；随着公司规模和 go-to-market 渠道变化，组合也会明显变化。

              主要买方和技术决策者，是 IT 团队规模 2–20 人的组织中的 IT 管理员或 IT 经理。该角色要在异构设备队列中管理身份、设备和访问，通常使用 3–10 个单点工具，而 JumpCloud
              主张把这些工具整合起来。典型职务包括 IT Administrator、IT Manager、Systems Administrator 和 Director of IT。买方最核心动机是运营效率——替代手工入职
              / 离职流程，去掉对 VPN 的依赖，并在不招聘专职安全团队的情况下，为 SOC 2、HIPAA 或 GDPR 做好审计准备。

              经济付款方通常是同一组织中的 CFO、COO 或运营副总裁，他们在运营预算中批准 IT 工具支出。JumpCloud 按用户、按月定价（约每用户每月
              $9–$20），映射到按员工数计算的订阅支出，因此成本可预测，200 人以下公司的审批路径也更短。采用触发点通常是合规要求、安全事件、远程 / 混合办公转型，或淘汰实体办公室服务器。

              用户是所有身份、设备和应用访问由 JumpCloud 管理的员工；按定义，这一群体等同于客户员工数。用户体验（UX）质量和变更管理成本会影响采用：如果 MFA 推出或设备注册造成干扰，IT
              管理员会遭遇内部阻力，部署可能停滞甚至回滚。

              MSP（Managed Service Provider）渠道构成第二类买方。MSP 购买 JumpCloud，是为了替多个终端客户组织管理 IT，通常是 50 人以下 SMB。Analysys Mason
              发现，到 2025 年，MSP 和 SI 预计将成为 SMB 网络安全支出的主导 go-to-market 路径，占渠道 40%；因此该渠道尤其重要。JumpCloud 有专门的 MSP 计划和 MSP
              专属定价，形成了一个有多租户管理需求的独立买方画像。

              中端市场和企业买方（500–5,000 名员工）销售周期更长，需要与遗留应用做 SAML/OIDC 联邦，并更重视供应商 SLA、企业支持层级和合规认证。JumpCloud 2026 年新增高管（CISO
              Roland Palmer 与 CRO Shianne Sampson）显示公司正有意上探该细分。
