  - id: FE002
    title: JumpCloud 员工生命周期流程——从 HR 事件到可审计访问
    type: flow
    layout: standard
    summary: JumpCloud 的核心客户流程用一个自动化动作，把 HR 系统事件转成跨设备和应用的受治理、可审计访问。
    data:
      nodes:
        - id: hris-event
          label: HRIS 事件（入职 / 角色变更 / 离职）
          detail: HR 系统（Workday、BambooHR、Rippling 等）触发生命周期事件。JumpCloud 通过 SCIM 或原生连接器监控。该事件是权威身份触发器。
          tone: neutral
        - id: jc-provision
          label: JumpCloud 配置引擎
          detail: SCIM 2.0 或 API 调用创建或停用用户记录。基于 HR 属性的群组分配，会自动为所有已连接资源配置访问权限。
          tone: positive
        - id: device-enroll
          label: 通过 JumpCloud Agent 注册设备
          detail: IT 在端点（Windows/macOS/Linux）部署 agent，或由用户自助注册移动设备。Agent 注册设备、拉取策略，并把设备绑定到用户身份。
          tone: positive
        - id: sso-mfa
          label: SSO + MFA 认证（900+ 应用）
          detail: 用户访问 JumpCloud 门户；通过 SAML/OIDC 认证进入 900+ 应用。MFA 按条件访问策略执行（设备健康、网络、风险等级）。
          tone: positive
        - id: policy-enforce
          label: 条件访问与实时策略执行
          detail: 每次访问请求都会运行设备合规检查。不合规或未托管设备会被拦截。同一设备上的 AI agents 也要接受设备信任检查。
          tone: positive
        - id: audit-log
          label: Directory Insights 审计日志（SIEM 导出）
          detail: 所有认证事件（SSO、LDAP、RADIUS、agent、AI gateway）都会写入 Directory Insights API。客户导出到 SIEM，用于合规和取证。
          tone: neutral
      edges:
        - from: hris-event
          to: jc-provision
        - from: jc-provision
          to: device-enroll
        - from: jc-provision
          to: sso-mfa
        - from: device-enroll
          to: policy-enforce
        - from: sso-mfa
          to: policy-enforce
        - from: policy-enforce
          to: audit-log
    claimRefs:
      - CE008
      - CE013
      - CE014
      - CE015
      - CE024
  - id: FE003
    title: JumpCloud 关键依赖图——平台组件与上游依赖
    type: dag
    layout: standard
    summary: JumpCloud 的云原生交付形成对 Google Cloud、Cloudflare 和第三方 HRIS 系统的上游依赖；端点上的 JumpCloud Agent 是日常运营中最关键的单点组件。
    data:
      nodes:
        - id: jc-platform
          label: JumpCloud SaaS 控制平面
          detail: 多租户控制平面承载管理控制台、目录、SCIM、API 和联合身份。分布在云 AZ 中，并设有美国和欧盟区域端点。
        - id: google-cloud
          label: Google Cloud（AI Gateway 主机）
          detail: 承载 Agentic IAM gateway；为 AI 速度的身份操作提供全球基础设施。2026 年 6 月发布后，agentic 功能对 Google Cloud 的依赖加深。
        - id: cloudflare
          label: Cloudflare CDN / WAF
          detail: 为 JumpCloud 网站资产和管理控制台提供内容分发及 DDoS/防火墙保护。2026 年 6 月 22 日 Cloudflare 故障曾导致控制台加载延迟。
        - id: jc-agent
          label: JumpCloud Agent（端点——Windows/macOS/Linux）
          detail: 安装在托管设备上的轻量级 agent。它是策略执行、设备信任和非 TOTP MFA 的最关键依赖。Agent 故障 = 策略同步丢失。
        - id: hris-system
          label: HRIS / HR 平台（Workday、BambooHR 等）
          detail: 权威身份生命周期触发器。SCIM 或原生连接器向用户开通和停用流程供给数据。HRIS 同步丢失会造成身份漂移。
        - id: saml-apps
          label: SAML / OIDC 应用目录（900+ 应用）
          detail: 依赖 JumpCloud 作为 SSO IdP 的第三方 SaaS 应用。JumpCloud 故障会阻断需要联合认证的应用登录。
      edges:
        - from: google-cloud
          to: jc-platform
        - from: cloudflare
          to: jc-platform
        - from: hris-system
          to: jc-platform
        - from: jc-platform
          to: jc-agent
        - from: jc-platform
          to: saml-apps
        - from: jc-agent
          to: jc-platform
    claimRefs:
      - CE001
      - CE036
      - CE042
      - CE043
      - CE021
  - id: FE004
    title: JumpCloud 产品能力成熟度——模块强度、成熟度水平、竞争位置与缺口
    type: matrix
    layout: standard
    summary: JumpCloud 在面向 SMB/中端市场的跨 OS 设备管理和 SSO/IAM 上最强；Agentic IAM 先发但仍处早期成熟度；FedRAMP 和完整 IGA 仍是结构性缺口。
    data:
      columns:
        - 成熟度水平
        - 竞争强度
        - 关键缺口
      rows:
        - label: Cloud Directory（LDAP/RADIUS）
          values:
            - 高
            - 强——厂商中立的跨 OS 目录，无本地服务器
            - 无访问认证或 SoD；无自托管选项
        - label: SSO（SAML 2.0 / OIDC）
          values:
            - 高
            - 强——900+ 连接器；原生集成 MFA 和条件访问
            - 高级 OAuth 2.0 配置文件（PAR/DPoP/mTLS）未确认；无 CIAM
        - label: MFA / JumpCloud GO
          values:
            - 高
            - 强——硬件保护的无密码能力；免费验证器应用
            - Agent 故障期间 MFA push 受扰；生物识别深度弱于企业级 IdP
        - label: 跨 OS UEM / MDM
          values:
            - 高
            - 市场最强——唯一用一个 agent 覆盖 Win+Mac+Linux+iOS+Android 的厂商
            - Linux 补丁仅限 Ubuntu；Jamf 在 Apple 侧更深；无本地 MDM 选项
        - label: 补丁管理
          values:
            - 高
            - 强——原生 Apple DDM；Windows KB 细粒度仪表板
            - Linux 仅限 Ubuntu；无 ChromeOS 操作系统级补丁
        - label: 特权访问管理
          values:
            - 中
            - 增长中——带会话录制的浏览器网关；无需 VPN
            - 面向企业 PAM 场景时成熟度低于 CyberArk/BeyondTrust
        - label: Agentic IAM（AI Agent 治理）
          values:
            - 早期 / 2026 年分阶段推出
            - 先发——统一控制人类 + AI agent 身份的控制平面
            - 核心功能 GA；A2A trust 和托管连接器仍在开发
        - label: FedRAMP / 美国公共部门
          values:
            - 未获授权
            - 缺口——截至 2026 年未列入 FedRAMP Marketplace
            - 美国联邦和 DoD 相邻客户的实质性阻碍
    approximationNotes: >-
      成熟度水平由分析师基于官方产品页面、用户评论和竞争分析评估。「高」表示功能已普遍可用、广泛采用，且独立评价信号正面。「早期」表示公司确认 GA，但能力仍在扩展。竞争强度评估仅相对于 SMB/中端市场 IAM 和 MDM
      细分赛道。
