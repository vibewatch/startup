      - number: '3.2'
        title: 竞争对手画像——规模、融资、目标客户与战略方向
        blocks:
          - type: paragraph
            body: >
              Microsoft Entra ID 和 Intune 属于 Microsoft 商业云；该业务 FY2025 收入为 $135.7B。Microsoft 不单独披露 Entra ID 或 Intune
              收入，但这些产品是公司从 Microsoft 365 Business Premium 向 E3、E5 层级进行安全和生产力增购的核心。2026 年，Microsoft Entra ID 的战略方向包括
              Entra Identity Governance（IGA 层）、Entra External ID（B2B 与 B2C）和 Entra Workload ID（非人类身份），与 JumpCloud 的
              Agentic IAM 发布形成结构性竞争。Microsoft Intune 的 Linux 支持仍局限于设备合规注册和条件访问，缺少 JumpCloud 为 Linux
              端点提供的完整策略管理、补丁管理和脚本执行能力。

              Okta 是唯一公开上市的独立 IAM 纯玩家。其 2026 财年（截至 2026 年 1 月 31 日）总收入达到 $2.919B，同比增长 12%。订阅收入占其中 $2.855B。剩余履约义务（RPO）为
              $4.827B，同比增长 15%，显示前瞻可见性强。FY2026 Q4 非 GAAP 经营利润率为 26%。Okta 的双平台战略（Workforce Identity Cloud，以及通过 Auth0 提供的
              Customer Identity Cloud）同时覆盖内部员工访问和外部消费者认证。Okta 不提供原生设备管理；用 Okta 做 IAM 的组织必须搭配 Microsoft Intune、Jamf 或
              JumpCloud 的 MDM 模块等独立 MDM 方案。

              Cisco Duo 于 2018 年被 Cisco 以 $2.35B 收购，并嵌入 Cisco Security 业务；该业务 FY2025 收入超过 $4B。Duo 不披露独立收入。其 2026
              年公开定价层级为：Free（$0，10 个用户，基础 MFA）、Essentials（$3/user/month，不限用户、抗钓鱼
              MFA、SSO）、Advantage（$6/user/month，设备信任、基于风险的认证、高级策略）和 Premier（$9/user/month，无密码、无 VPN 远程访问）。Duo
              定位为叠加在既有目录之上的安全层，而不是目录替代品；因此在 JumpCloud 账户中，它更像增量工具，而非直接替换。

              Rippling 2025 年 5 月完成 $450M Series G，由 Baillie Gifford 领投，估值 $16.8B。公司 2026 年 ARR 接近 $1B，收入同比增长超过
              30%。Rippling 的核心差异化是统一员工图谱，它驱动 HR、IT 和财务之间的零接触开通与停用，不需要手工集成步骤。不过，Rippling 要求买方先采用完整 HR 平台作为基础；对纯 IT
              买方而言，采用门槛高于 JumpCloud。

              Jamf FY2024 收入 $627M，ARR 增长约 9%，是主导 Apple MDM 供应商，并在 2025–2026 年 IDC MarketScape for Unified Endpoint
              Management（Apple-first）中被列为领导者。Francisco Partners 于 2025 年 10 月以 $2.2B 收购 Jamf，使其私有化。Jamf 在教育 Apple MDM
              中约占 11% 市场份额，并在 2026 年增加 Android 设备支持。2024 年以 $215M 收购 Identity Automation，代表其向统一身份加设备管理迈出的战略一步。Kandji 于
              2025 年底更名为 Iru，定价为每台设备每月 $1.60–$8.56，提供 300+ 预置合规模板（SOC 2、ISO 27001、CIS benchmarks），面向希望快速部署 Apple
              MDM、但没有专职 Apple 管理员经验的精简 IT 团队。
