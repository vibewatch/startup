  - id: FP001
    title: 竞争定位图 — 身份管理深度 vs. 设备管理广度
    type: quadrant
    layout: standard
    summary: >-
      JumpCloud 的位置独特：把强跨 OS 设备管理与扎实云目录基础结合起来；Okta 和 Microsoft 分别锚定相反象限——Microsoft 在 Windows 中心环境里两条轴都领先，Okta
      则在没有任何设备管理的情况下领先身份。
