  - id: TR001
    title: 监管 / 法律风险登记表
    columns:
      - 监管领域
      - 司法辖区
      - JumpCloud 状态
      - 可能性（前瞻）
      - 严重性
      - 已部署缓释措施
      - 剩余暴露
    notes: >-
      来自 FedRAMP Marketplace（2026 年 6 月）、JumpCloud 数据保护与安全页面，以及把 EU AI Act Regulation (EU) 2024/1689 范围标准套用于 Agentic IAM
      的分析。覆盖不完整；其他框架（HIPAA、PCI-DSS、SOC 2）也相关，但本报告在别处处理。
    enumerationScope:
      coverage: partial
      basis: >-
        Major frameworks with explicit bearing on JumpCloud's enterprise sales reach and compliance posture, prioritized
        by investor-relevant market-access impact as of June 2026
    rows:
      - - FedRAMP（美国联邦风险与授权管理计划）
        - 美国联邦
        - 未获授权——截至 2026 年 6 月 23 日，FedRAMP Marketplace 无记录
        - 确定——按现行规则，联邦客户不能采购 JumpCloud
        - 关键——永久排除美国联邦机构市场和多数 CMMC L2/L3 承包商
        - 联邦细分市场无缓释；单独 GovCloud 架构需要从零建设
        - 获得授权前（12-36 个月），持续被排除在美国联邦细分市场之外
      - - GDPR / Standard Contractual Clauses
        - EU / EEA（及充分性决定国家）
        - 提供含 SCC 的 DPA；AWS 和 Salesforce 列为子处理方；DPO 联系方式公开
        - 低——DPA 框架到位；SCC 提供合法传输机制
        - 中等——SCC 面临持续法律不确定性（Schrems II 后续风险）
        - 符合 GDPR 的 DPA；欧盟区域数据中心；DPO 沟通渠道
        - SCC 剩余法律不确定性；部分遥测路由无法完全排除在欧盟之外
      - - EU AI Act（Regulation 2024/1689）
        - European Union
        - 不确定——Agentic IAM（2026 年 4 月）可能需要风险分类；未发布判定
        - 中——Agentic IAM 自动化访问策略，可能影响就业 / 权利
        - 中等——风险分类不合规可能迫使产品调整或 CE 标志认证
        - 未发布符合性评估；AI Act 合规框架仍在评估
        - 分类发布前，欧盟企业潜在客户面临采购不确定性
      - - India Digital Personal Data Protection Act 2023（印度数字个人数据保护法）
        - India
        - 部分——已有印度数据中心；按其自有文档，部分遥测可能流出印度
        - 低-中——印度企业市场目前只占 JumpCloud ARR 的较小份额
        - 低-中等——印度数据主体可能触发通知 / 本地化要求
        - 印度区域部署选项；持续复核遥测路由
        - 遥测路由带来剩余暴露；DPDP 同意机制细节未确认
