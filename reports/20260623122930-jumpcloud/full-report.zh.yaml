        - 在 NDA 下确认 2023–2025 年净收入留存（NRR）趋势
    notes: 时间判断基于证据估算；没有公司提供的管线数据。监管强制要求是唯一带有明确法定期限的驱动因素。所有财务影响均为分析推断；JumpCloud 内部管线数据可用于确认。
