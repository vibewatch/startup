  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台架构、交付模式与模块分类
        blocks:
          - type: paragraph
            body: >
              JumpCloud 完全以多租户 SaaS 交付，没有本地服务器组件。核心架构是 agent 模式：每台受管终端——Windows、macOS、Linux、iOS/iPadOS 和
              Android——都会安装一个轻量软件 agent，并与 JumpCloud 云控制平面保持加密通道。正是这个 agent
              模式，让平台能在操作系统异构、没有统一目录底座的环境中执行设备信任、下发策略变更、推送补丁、运行管理脚本，并认证用户。管理员控制台以 Web 应用形式提供，对所有受管设备、用户、组和策略给出单一视图。

              JumpCloud 公开平台分类把能力拆成五根支柱。Identity Management 覆盖 Cloud Directory（云托管 LDAP/RADIUS 替代）、带 SCIM 的 Identity
              Lifecycle Management、HRIS Integration，以及 2026 年推出、用于 AI agent 治理的 Agentic IAM。Access Management 覆盖 Single
              Sign-On（SAML 2.0、OIDC、900+ 预置连接器）、Cloud LDAP、Cloud RADIUS、Multi-Factor
              Authentication（TOTP、推送、FIDO2/WebAuthn、JumpCloud GO、生物识别）、Privileged Access Management、Conditional
              Access、Directory Insights 事件日志 API、Password Manager 和 Access Request。Device Management 覆盖 Unified Endpoint
              Management、Patch Management（包括 Apple Declarative Device Management）、System Insights、Remote Access、Windows
              Management、Apple MDM、Linux Management、Android EMM 和 Asset Management。AI and SaaS Management 覆盖 Shadow AI
              Governance、SaaS Discovery、SaaS Spend Optimization 和 SaaS Security Insights。平台开放 RESTful API（v1 和 v2）以及
              Directory Insights API，用于外部 SIEM 和合规工作流集成。JumpCloud 状态页监控 13 个不同服务组件，包括 Admin Console、Agent、AI
              Gateway、Android EMM、Apple MDM、Federation、G Suite Integration、LDAP、RADIUS 和 Groups，覆盖美国和欧盟区域部署。
