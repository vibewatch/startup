      - number: '1.4'
        title: 规模指标、里程碑与负面事件
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，JumpCloud 公开规模指标显示，公司较 2021 年融资高点已有显著增长。公司官网称服务 160 多个国家的 250,000 多家组织，较 2021 年 Series F
              公告中提到的 120,000 家大幅增加。GetLatka 是一家收入情报平台，通过向 SaaS 创始人调研并结合公开数据三角验证；其估算 JumpCloud 年度经常性收入在 2024 年 11 月达到
              $200M，高于 Sacra 对 2023 年 $105M 的估算。Revelio Labs 劳动力分析估算，截至 2025 年 12 月公司约有 1,165
              名员工。这些外部收入或员工数均未经审计，也非公司官方披露；应作为方向性指标，而不是已确认财务数据。作为私营公司，JumpCloud 从未公开披露经审计 GAAP 收入。


              里程碑覆盖公司创立、多轮融资、五次收购、重大合作、一次重要负面安全事件，以及 2026 年的四项战略动作。关键产品里程碑包括 2020 年 12 月推出条件访问策略、2023 年 4 月与 Google
              Workspace 合作、2026 年 4 月推出 Agentic IAM，以及先后收购 MYKI（2022）、Zercurity（2023）、Resmo（2024）、Stack Identity（2025）和
              VaultOne（2025）。这些收购逐步把平台从目录服务扩展到密码管理、设备合规、SaaS 资产管理、身份治理和特权访问管理。记录中唯一重大负面事件是 2023 年 7 月朝鲜国家支持的网络攻击，由
              JumpCloud CISO 披露，并由 CrowdStrike 确认，涉及一场从 2023 年 6 月 22 日开始的复杂鱼叉式网络钓鱼行动；受影响客户少于五家、设备少于十台，JumpCloud
              发布了入侵指标。该事件凸显平台的关键基础设施地位，也展示了透明的事件响应姿态。
