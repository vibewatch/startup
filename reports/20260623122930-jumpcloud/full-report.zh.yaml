  - id: FP003
    title: JumpCloud 竞争护城河 / 就绪度 KPIs
    type: kpi
    layout: compact
    summary: 截至 2026 年 6 月，JumpCloud 的关键竞争护城河指标包括：市场认可、平台宽度，以及竞争对手若不堆叠多个工具就无法复制的协议差异化。
    data:
      items:
        - id: g2-grid-rank
          label: G2 Cloud Directory 排名（2026 年春季）
          value: '#1'
          detail: >-
            JumpCloud 在 150+ 份 G2 2026 年春季 Grid Reports 中获得最高荣誉，覆盖 Cloud Directory Services、PAM 和 Password Policy
            Enforcement 类别，基于 4,000+ 条已验证用户评论。
        - id: os-coverage
          label: 具备原生 MDM 的 OS 平台
          value: '5'
          detail: Windows、macOS、Linux、iOS、Android——对比组中唯一能从单一云控制台管理五类 OS 的供应商。竞争对手最多覆盖 2–3 个平台。
        - id: legacy-protocol-depth
          label: 旧协议支持（LDAP、RADIUS）
          value: Both
          detail: JumpCloud 原生支持 LDAP 和 RADIUS，可接入 VPN 设备、Wi-Fi 认证（802.1x）和本地应用；Okta 这类纯云 IAM 供应商没有附加连接器就够不到这些场景。
        - id: switching-cost
          label: 估算迁移工作量（基于代理的目录）
          value: Weeks
          detail: 替换 JumpCloud 需要重新注册所有设备，并重新联合所有通过 JumpCloud 代理管理的应用——形成有意义的切换成本，保护已安装客户群免于轻易流失。
        - id: pricing-advantage-vs-stack
          label: 价格 vs. 等效 Okta + Jamf 组合
          value: Lower (SMB)
          detail: >-
            JumpCloud Device Identity Management $13/用户/月，可替代单独的 Okta Workforce 订阅（$12–17+/用户/月）和 Jamf（Apple MDM
            $4–$12.50/设备/月）——对设备异构的 SMB 买家，总堆栈节省 $3–$16+/用户/月。
    approximationNotes: >-
      G2 排名来自 JumpCloud 新闻稿（2026 年 3 月 17 日）。OS 数量来自 JumpCloud 价格页和官方产品文档。价格比较为近似值；实际节省取决于层级选择、设备数量和谈判折扣。迁移工作量估算来自典型 MDM
