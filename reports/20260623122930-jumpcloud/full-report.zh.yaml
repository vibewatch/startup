  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局——类别分类与替代品映射
        blocks:
          - type: paragraph
            body: >
              JumpCloud 的竞争格局最好理解为四个相互重叠的类别，而不是单一市场。第一类也是最重要的一类，是打包销售的 Microsoft 存量方案：Microsoft Entra ID（原 Azure Active
              Directory）搭配 Microsoft Intune 做 MDM，二者都包含在 Microsoft 365 E3（$36/user/month）和 E5（$57/user/month）订阅中。对于已经为
              M365 付费的组织，Entra ID 在身份决策点几乎免费，因此在 Windows 中心型账户中，结构上最难被 JumpCloud 替代。

              第二类是独立 IAM 专家：Okta（企业 IAM 市场领导者，FY2026 收入 $2.919B）、Cisco Duo（MFA 优先的设备信任叠加层，定价 $3–$9/user/month）和
              OneLogin（2021 年被 One Identity 收购，2026 年 shortlist 中存在感下降）。这些供应商身份优先，但缺少原生跨 OS 设备管理；采用它们的买方还必须另购 MDM
              工具，整体技术栈成本上升。

              第三类是设备驱动替代品：Jamf（Apple MDM，FY2024 收入 $627M，2025 年 10 月被 Francisco Partners 收购）和 Kandji/Iru（纯云 Apple
              MDM，2025 年底更名）。这些供应商能更深地配置 macOS 和 iOS、管理 Apple 设备，但都不原生管理 Linux 端点，也不提供云目录替代。Jamf 2024 年以 $215M 收购
              Identity Automation，释放出向身份扩张的战略信号，可能威胁 JumpCloud 在 Apple-heavy 账户中的差异化。

              第四类是 HR-IT 融合套件，以 Rippling 为代表（2025 年 5 月 Series G 估值 $16.8B，2026 年 ARR 接近 $1B）。Rippling 用单一员工图谱统一
              HRIS、薪资、身份开通和设备管理，实现零接触入职与离职。对把 IT 视为 HR 运营延伸的组织来说，Rippling 的统一模型是 JumpCloud 以 IT 优先切入动作的有力替代。

              现状和内部自建替代品包括：本地 Active Directory（最常见遗留替代品）、Google Workspace Admin（适用于 MDM 需求有限的 Google
              中心型组织）、ManageEngine/Zoho（适用于无云迁移要求、预算受限 SMB 的本地 IAM 和 MDM），以及完全没有正式身份平台（常见于 25 人以下、依赖共享凭证或个人账号的组织）。
