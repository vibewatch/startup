              JumpCloud 2026 年 4 月推出 Agentic IAM，并在 2026 年 6 月与 Google Cloud 建立合作，使其成为首个通过单一控制平面同时治理人类身份和 AI agent 身份的统一
              IAM 供应商。JumpCloud 自有研究显示，只有 37% 的组织已把 AI agent 纳入正式 IAM 策略，治理缺口很大。如果 Agentic IAM 能成熟为差异化企业能力，而不只是定位叙事，它可能把
