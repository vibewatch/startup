  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: |
      JumpCloud 从低到高的企业价值情景与 $2.625B Series F 锚点对比，说明 Series F 投资者回报压力很大； 即便理论上的二级买家，也只能在当前分析可支撑价格下入场。
    data:
      items:
        - label: 悲观情形 EV（$M）
          low: 700
          high: 750
        - label: 基准情形 EV（$M）
          low: 1100
          high: 1300
        - label: 乐观情形 EV（$M）
          low: 1600
          high: 1900
        - label: Series F 盈亏平衡（1x 回报，$M）
          low: 2625
          high: 2625
        - label: Series F 所需 2x 回报（$M）
          low: 5250
          high: 5250
    approximationNotes: >
      悲观 / 基准 / 乐观 EV 区间以 ARR 估计和截至 2026 年 6 月的市场倍数搭建。Series F 盈亏平衡和回报测算假设整笔 $225M Series F 均按 $2.625B
      估值投入；实际每股回报需要完整的股权结构瀑布分析，纳入所有优先权类别、股息、 反稀释条款和任何债务工具。若 Series F 投资者要达到机构门槛下的 2x 回报，退出估值约需 $5.25B，意味着约 $525M ARR、
      10x 倍数——近期任何情景都支撑不了。
    claimRefs:
      - CV001
      - CV002
      - CV031
      - CV032
      - CV033
      - CV034
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: |
      截至 2026 年 6 月 23 日，从市场机会、产品验证、竞争护城河、财务经济性、估值、风险画像和证据质量几个维度， 给 JumpCloud 做投资委员会可用评分。
    data:
      items:
        - label: 市场机会
          value: 7
          max: 10
          note: IAM TAM $25–30B+，12–15% CAGR 增长；云身份转型是长期趋势；Agentic IAM 扩大可服务市场。
        - label: 产品验证
          value: 6
          max: 10
          note: 已服务 250K+ 家组织；G2 Leader 地位；Google Workspace 合作已确认；Agentic IAM 于 2026 年推出。 采用信号强，但企业级扩展能力仍未确认。
        - label: 竞争护城河
          value: 5
          max: 10
          note: OS 无关的云目录相对 Active Directory 有差异化；但 Microsoft Entra ID 占据 85%+ 大型企业，护城河只剩 SMB，且在收窄。
        - label: 财务经济性
          value: 3
          max: 10
          note: 估计 ARR $200M（2024，Latka）；收入 / 员工约 $172K；NRR、毛利率、EBITDA 均无确认。56 个月未融资后， 资本结构不透明。
        - label: 估值
          value: 2
          max: 10
          note: 基准情形 EV 约 $1.2B，按 6x ARR 计算，比 $2.625B 锚点低 54%。在任何 2026 年可辩护倍数下， 都看不到达到 $2.625B 的路径。按 2021 年价格极不具吸引力。
        - label: 风险画像
          value: 3
          max: 10
          note: 高：估值包袱、财务不透明、无二级市场信号、优先权栈、SaaS 倍数处于十余年低点、Microsoft 竞争压力。
        - label: 证据质量
          value: 4
          max: 10
          note: 无经审计财务、无确认 ARR、无二级市场价格。整套分析都压在第三方 ARR 估计和上市可比外推上。
