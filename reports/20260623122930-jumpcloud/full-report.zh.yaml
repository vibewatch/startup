      - number: '5.5'
        title: 安全态势、合规认证、可靠性与产品缺口
        blocks:
          - type: paragraph
            body: >
              JumpCloud 公开的安全承诺包括 SOC 2 Type 2 审查（客户和潜在客户签署保密协议后，可向 accounts@jumpcloud.com 申请获取）以及 2024 年 11 月取得的 ISO
              27001 认证，认证机构为 Schellman and Company。ISO 27001 范围覆盖 JumpCloud 的开放目录平台，涵盖风险评估、安全控制、治理政策和持续改进承诺。JumpCloud
              CISO Robert Phan 在 2024 年 11 月新闻稿中表示，该认证“巩固了 JumpCloud 作为身份、访问和设备管理可信提供商的地位”。LDAP、RADIUS、SAML 和 agent
              通信通道中的所有传输数据都使用 TLS 1.2 或更高版本加密，所有数据库都启用静态加密。开发流程在构建流水线中纳入 SAST 和 DAST 工具、SSDLC 变更控制流程，并设有公开 Vulnerability
              Disclosure Program，供安全研究人员负责任披露。

              JumpCloud 的 Conditional Access 产品页称支持达成 SOC 2、HIPAA、GDPR、PCI 和 EU AI Act 合规，把平台定位为合规赋能工具，而不是受监管实体本身。缺少
              FedRAMP 授权是实质性缺口：美国联邦机构和受监管政府承包商需要 FedRAMP 授权供应商，而 JumpCloud 目前未列入 FedRAMP Marketplace。PeerSpot
              用户评价确认，政府相关组织曾将这点列为迁离 JumpCloud 的原因。同样，JumpCloud 不提供完整 Identity Governance and
              Administration（IGA）能力，例如访问认证或 Segregation of Duties（SoD）执行——这些功能在 Sailpoint、Saviynt 或 Okta 的 Identity
              Governance 附加产品中可用——这限制了它在合规要求成熟的大企业中的可服务市场。可靠性方面，IsDown 自 2020 年 4 月以来监控 JumpCloud 的 13 个服务组件，六年记录 300
              起事件，平均每月约 4.1 起，中位解决时间为 154 分钟。2026 年 3 月 12 日持续五小时的 Agent 后端事件是近期最重大事件；JumpCloud 披露，本地登录仍可运行，但策略同步、命令执行和
              TOTP 之外的部分 MFA 场景受到影响。G2 Spring 2026 基于 4,000+ 条经验证用户评价，将 JumpCloud 评为 MDM、IAM、SSO、PAM、GRC 和 Cloud
              Directory 等 150 个 Grid® 报告中的领导者。
