      points:
        - id: jumpcloud
          label: JumpCloud
          x: 7
          'y': 8
          detail: >-
            云目录 + 跨 OS MDM（Win/Mac/Linux）+ MFA + SSO，价格面向 SMB。Linux MDM 能力让它在混合 OS
            账户中拉开差异。x=身份深度（1–10），y=设备管理广度（1–10）。分数为证据支持的序数评估。
