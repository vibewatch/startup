      - number: '6.4'
        title: 评价信号、满意度得分与反向证据
        blocks:
          - type: paragraph
            body: >
              JumpCloud 在聚合评价平台上的足迹确认，其核心用例满意度很强。G2 Spring 2026 Grid Reports 于 2026 年 3 月发布，JumpCloud 凭借 4,000
              多条经验证用户评价进入 150+ 个类别；2025 年 12 月 Winter 报告中为 3,722 条评价。G2 总体评分为 4.5/5 星，覆盖近 4,000 条评价。JumpCloud 在 2026 年 2
              月获得 G2 Best Software Awards 五个类别奖项：Best GRC Products、Best IT Infrastructure Software Products、Best IT
              Management Software Products、Best Security Software Products 和 Best Global Software Companies。TrustRadius
              截至 2026 年记录 52 条经验证评价，得分 9.2/10；SpotSaaS 聚合 267 条评价，主要为 4–5 星。对 ARR 约 $200M 的平台而言，这些都是很强的满意度指标。

              多个可信来源记录了反向证据。最重大的运营故障是 2026 年 3 月 12 日持续五小时的 Agent 后端宕机，扰乱策略同步和登录，尤其影响依赖高级 MFA 配置的客户。IsDown 自 2020 年 4
              月起持续监控 JumpCloud，六年记录约 300 次宕机，平均每月 4.1 起，典型解决时间为 154 分钟。StatusGator 在 2026 年 6 月 22 日前后 24 小时窗口记录了 29
              条用户宕机报告，与 Cloudflare 相关的管理员控制台退化有关。这些数字确认 JumpCloud
              并非没有事故；它对云托管控制平面的关键依赖意味着，任何后端中断都会同时传导到所有已连接客户的认证、设备管理和策略执行。

              PeerSpot 和 SpotSaaS 上记录的用户投诉包括：v1 与 v2 端点之间 API 不一致，导致自动扩缩容环境需要手工绕行；混合 OS 环境中的 Linux 用户 ID
              冲突；复杂技术支持升级响应慢；教育行业客户经理更替频繁；价格随时间上涨；高级策略管理的定制选项有限。一名自 2018 年起使用 JumpCloud 的 PeerSpot 评价者明确记录了由 FedRAMP
              驱动的迁离，称原因“不是技术”，而是合同层面：JumpCloud 缺少 FedRAMP
              授权，对美国联邦承包商和受监管组织构成合规障碍。这是结构性市场限制，不是产品缺陷，但在美国公共部门和国防工业基础细分市场会造成真实收入后果。
