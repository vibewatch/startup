      - number: '7.6'
        title: 附录
        blocks:
          - type: callout
            title: 2023 年入侵让 JumpCloud 永久坐实为国家级攻击目标
            body: >-
              JumpCloud 不只是经历过一次入侵的公司；它现在已经被确认是朝鲜国家力量眼中的高价值供应链目标。 TraderTraitor（UNC4899）有意选择 JumpCloud 作为入口，以触达下游加密货币组织。
              该平台的架构——用一个统一的管理命令框架为 200,000 多个组织管理终端配置——正好提供了供应链攻击者想要的杠杆。 事后缓解措施（多人访问、SOC 2 Type 2、聘任
              CISO）有意义，但不改变结构性现实： 只要 JumpCloud 还处在身份栈的这个位置，它就会继续是高级国家行为体的优先目标。投资者必须把这种永久目标状态计入对其安全态势的预期。
            calloutType: risk
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR008
          - type: callout
            title: Microsoft 捆绑是结构性定价逆风，不是可弥补的功能缺口
            body: >-
              Microsoft Entra ID 的竞争威胁，核心不在功能对等或品牌认知，而在定价架构。对已经为 Microsoft 生产力软件付费的组织， Entra ID 随 Microsoft 365 E3 和 E5
              一起交付，边际成本为零。JumpCloud 无法与 $0 替代品拼价格； 唯一可行的回应，是守住跨平台和非 Windows 细分市场，那里 Microsoft 的 Windows 中心型技术栈确实更弱。 Ramp
              Rate 显示 IDP 采用份额同比下滑 2 pp 至 14%，PeerSpot 将 JumpCloud 排第十一、Entra ID 排第一， 都是 Microsoft 相邻边界遭侵蚀的早期信号。随着
              Microsoft 把 Entra ID 覆盖扩展到 macOS 和 Linux 终端， JumpCloud 的跨平台差异化护城河会进一步变窄。
            calloutType: risk
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR017
              - CR018
          - type: callout
            title: 承销 JumpCloud 财务必须进入数据室——公开指标不存在
            body: >-
              仅靠公开来源，投资者无法承销 JumpCloud 的单位经济、客户质量或资本效率。 净收入留存、总美元留存、付费客户数（最后更新于 2021 年 10 月）、烧钱率、跑道和队列层面流失率均未披露。 最后一次披露的
              ARR 估计来自 Sacra 2023 年研究（$105 million，31% 同比增长）；任何公开数据库都没有 2024 或 2025 年数据。 2021 年 $2.625 billion 估值——按
              46.5x ARR 倍数定价——形成一个包袱，未来要么证明持续高增长，要么在流动性事件中接受下调。 任何投资决定都应以完整财务数据室披露为条件，包括按队列和细分市场拆分的 NRR，然后才能承诺出资。
            calloutType: risk
            claimRefs:
              - CR026
              - CR027
              - CR033
              - CR034
          - type: callout
            title: 缺席 FedRAMP 永久排除一个结构性大且高 ASP 的市场细分
            body: >-
              JumpCloud 缺席 FedRAMP Marketplace，不是一个短期冲刺项，而是多年授权流程：需要第三方评估组织参与、联邦机构或 JABS 赞助，
              以及专门的合规工程投入。在拿到授权前，JumpCloud 不能销售给美国联邦机构；其面向国防工业基础承包商的 CMMC 定位，
              也只能提供基础工作流支持，缺少平台认证。美国联邦身份管理市场不只是绝对规模大；它还是一个结构性高 ASP 细分， 平台切换成本最高、流失最低——这正是最能改善 JumpCloud
              财务质量指标的客户画像。投资论点必须要么计入这部分 TAM 排除， 要么把授权流程作为资本用途来支持。
