  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域与现状替代品
        blocks:
          - type: paragraph
            body: >
              JumpCloud 处在云目录服务、身份与访问管理、设备管理和零信任访问控制的交叠处。界定其市场边界，需要把分析师单独测算、但在 JumpCloud 平台上被运营性整合的多个类别拆开看。

              核心类别是身份与访问管理（IAM）市场，覆盖认证、访问开通、单点登录（SSO）、多因素认证（MFA）、特权访问管理（PAM）、身份治理与管理（IGA）以及目录服务。这是用于测算 JumpCloud
              的最常见类别，既包括人类用户身份（workforce IAM），也包括截至 2026 年 4 月出现的非人类 / 智能体身份（JumpCloud 的 Agentic IAM）。Cloud IAM
              是增长中的子集：Mordor Intelligence 估算，2026 年云端 IAM 软件市场规模为 $10.91B，到 2031 年 CAGR 为 19.52%。

              相邻的统一端点管理（UEM）类别，是 JumpCloud 第二个直接产品面，覆盖跨平台设备生命周期控制，包括 MDM、补丁管理、配置执行和远程擦除。Mordor Intelligence 将 2026
              年该市场规模测算为 $8.85B。UEM 并不总被纳入 IAM 市场测算，因此已发布 TAM 数字存在模糊性。JumpCloud 产品明确横跨两者。

              零信任网络访问（ZTNA）市场在 2026 年由 Mordor Intelligence 测算为 $47.45B，属于战略相邻领域：JumpCloud
              通过条件访问策略、设备信任和硬件绑定无密码认证（JumpCloud Go™）落地零信任原则，但不提供网络层 ZTNA 网关或 SD-WAN 叠加产品。除非公司推进网络层产品，ZTNA 对 JumpCloud
              来说更多是需求驱动因素，而不是直接 TAM。

              买方用于替代 JumpCloud 的现状方案包括：本地 Microsoft Active Directory 搭配 Azure AD Connect（拥有既有 Windows
              基础设施的组织中最主导的存量方案）；作为 AD 云端叠加层的 Microsoft Entra ID；面向 Google 中心型组织的 Google Workspace 管理控制台；同类最佳单点工具（如 Okta
              做 SSO、Jamf 做 Apple MDM、ManageEngine 做本地 IAM）；以及完全没有正式目录（常见于 25 人以下、依赖共享凭证或个人账号的组织）。MSP
              托管服务转售上述任何方案，是并行渠道路径，而不是竞争产品。
