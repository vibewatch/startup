  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资历史、估值锚点与资本缺口分析
        blocks:
          - type: paragraph
            body: >
              JumpCloud 的资本形成历史以 2021 年 10 月 Series F 达到高点；这是自 2019 年 5 月 $50M Series D 以来， 唯一公开披露的一级融资事件。Series F
              分两批完成：2021 年 9 月先关闭 $159M，投后估值 $2.56 billion； 2021 年 10 月再延展 $66M，把最终估值定在 $2.625 billion。该轮由 Sapphire
              Ventures 领投， 每股优先股价格 $5.99；Atlassian Ventures、CrowdStrike Falcon Fund、NTT Docomo Ventures、Owl Rock、 Whale
              Rock Capital、Sands Capital、BlackRock、General Atlantic 和 H.I.G. Growth Partners 参投。 自 2012
              年创立以来，按不同数据聚合方口径，公司九到十二轮融资合计公开披露约 $408–418M。 Series F 关闭时，Sacra 估计 JumpCloud 追踪 ARR 约 $55 million，意味着融资倍数约
              46.5x ARR—— 反映 2021 年创投周期最后一个季度，对云原生身份管理的零利率高峰热情。


              截至 2026 年 6 月 23 日运行日，没有新的一级股权融资公开宣布，形成约 56 个月的融资空窗。 这个空窗含义模糊：它可能说明资本效率显著、公司靠内生现金生成接近盈利、管理层有意等待更好的 IPO 窗口，
              也可能说明 2021 年以来 SaaS 倍数大幅压缩后，公司难以按可接受条款获得新资本。SEC EDGAR 中没有 S-1 或同等 IPO 申报； 截至 2026 年 6 月，Forge Global 的
              Pre-IPO 平台显示 JumpCloud 股票二级市场活动为「Limited」，没有撮合价格。 二级市场价格信号完全缺席，使得外部无法像分析 Anthropic 或 Databricks 这类 Forge
              市场活跃公司一样， 对照 2021 年锚点三角测算当前标记。JumpCloud 的 Forge COI 数据确实披露，Series E-1 优先股于 2021 年 1 月以每股 $1.82 发行 （隐含估值
              $695.73M），Series D 股份每股 $0.72（估值 $231.11M）。这些历史锚点展示了通向 Series F 的倍数扩张有多剧烈， 也展示了今天若按市价重估，隐含压缩幅度有多大。


              SaaS Capital Index 是最常被跟踪的公开 SaaS ARR 倍数基准；截至 2025 年初为 7.0x， 较 2021 年峰值下降约 60%。SaaS Capital
              针对私募股权支持公司的专有模型预测， 在 2025 年市场条件下 ARR 倍数为 5.3x。到 2026 年第一季度，SCI 已跌至十多年低点， 因为市场激进地把 AI 定价为对 SaaS
              商业模式的生存威胁。这些基准框定了估值包袱的严重性： $2.625B Series F 锚点在发行当时无论多合理，截至报告日都与任何可观察市场可比对象深度不一致。
