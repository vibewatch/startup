      - number: '8.2'
        title: 上市可比公司组与 IAM 市场倍数分析
        blocks:
          - type: paragraph
            body: >
              JumpCloud 可用的公开可比公司组横跨两条轴线：身份、访问和设备管理领域的直接上市股权同业， 以及可作为倍数基准的更广义高增长网络安全 SaaS 平台。最直接的上市可比是 Okta（NASDAQ:
              OKTA）， 它位于云身份、SSO 和员工身份管理的交汇处。截至 2026 年 6 月 23 日，Okta 企业价值为 $17.97 billion， 对应约 $3.00 billion 的过去十二个月收入，隐含
              EV/Sales 约 6.0x。Okta 2026 财年（截至 2026 年 1 月 31 日） 收入为 $2.919 billion，同比增长 11.84%，毛利率 77.36%，经营利润率转正至
              5.10%—— 相比多年重投入阶段亏损，已明显成熟。2026 年 6 月 23 日，Okta 市销率为 6.73x。 尽管 Okta 规模显著大于
              JumpCloud，且越来越聚焦企业身份治理和员工身份，它仍是云原生身份管理最直接的公开基准。


              截至 2026 年 6 月 23 日，CrowdStrike（NASDAQ: CRWD）EV/Sales 倍数高达 33.21x， 反映其平台整合叙事、AI 原生终端安全定位，以及 $5.09 billion 的
              TTM 收入和 23% 增长。 CrowdStrike 的溢价是网络安全 SaaS 空间中的离群值，由平台商业模式、主导市场地位和 AI 差异化驱动； JumpCloud 并不具备这些特征，用 CRWD
              作可比会实质性高估任何合理的 JumpCloud 估值。 Acquiry（2026 年 2 月）和 iMerge（2026 年第一季度）的研究框架也印证了这一分层： ARR 增速 15–30% 的传统 SaaS
              公司交易在 3–5x ARR；增速 30%+ 的公司可拿到 5–8x。 只有增速超过 50% 的 AI 原生 SaaS 企业，才在 2026 年交易中达到 10–20x ARR。


              SaaS Capital Index（SCI）提供了最全面的纵向公开 SaaS 基准。截至 2025 年初，SCI 中位数为 7.0x ARR； 前十分位公司（CrowdStrike
              20.8x、ServiceNow 19.5x）反映平台和 AI 溢价。到 2026 年第一季度， SCI 跌至十多年低点；SaaS Capital 的 ARRG 分析（ARR 倍数 ÷
              增长率）提示仍有下行脆弱性， 因为即便经历第一季度抛售，该指标仍高于此前低点，意味着市场尚未完全计入增长放缓风险。 Aventis Advisors 的历史序列记录了从 2021 年 20–40x
              峰值，到当前传统 SaaS 5–8x 区间的峰谷压缩。 映射到 JumpCloud：如果 JumpCloud 增长约 25–30%（与 Sacra / Latka 的 ARR 轨迹一致）， 它落在「传统 SaaS
              >30% 增长」类别，对应 5–8x，而不是 AI 原生溢价层。 没有任何已确认的 AI 原生 ARR 贡献，连 5–8x 上限都偏乐观。
