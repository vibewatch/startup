          detail: 在 Windows、macOS 和 Linux 上部署代理；用 Google Workspace 或 M365 测试 LDAP/SAML federation。跨 OS 注册是关键技术门槛。
          tone: neutral
        - id: budget-approval
          label: 商业案例与预算批准
          detail: 200 人以下：CFO/CEO 在一个预算周期内批准，价格约 $9–$20/用户/月。中端市场：多季度采购；审阅 SOC 2 报告和数据处理协议。
          tone: neutral
        - id: deployment
          label: 部署
          detail: SMB：几天到几周。中端市场 AD 迁移：几周到几个月。MSP：通过多租户控制台在终端客户群中分阶段推出。
          tone: positive
        - id: expansion
          label: 扩展与续约
          detail: 模块加售（PAM、MDM、SSO、SaaS Spend Management）驱动 NRR。按 JumpCloud 按功能计价模型，导入更多模块的客户粘性更高。
          tone: positive
      edges:
        - from: awareness
          to: trial
        - from: trial
          to: tech-validation
        - from: tech-validation
          to: budget-approval
        - from: budget-approval
          to: deployment
        - from: deployment
          to: expansion
