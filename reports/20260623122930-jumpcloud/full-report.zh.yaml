      - number: '5.3'
        title: 跨平台设备管理、运行架构与依赖
        blocks:
          - type: paragraph
            body: >
              JumpCloud 的设备管理模块是主要技术差异化，也是跨 OS agent 最直接撑起的架构层。Unified Endpoint Management（UEM）能力通过单一管理员控制台管理
              macOS、Windows、Linux（补丁管理主要支持 Ubuntu）、iOS/iPadOS 和 Android。这样的跨平台范围把 JumpCloud 和竞争对手区分开：Jamf 只覆盖
              Apple，Microsoft Intune 对 Linux 只提供合规注册（不是完整策略管理），Kandji 则专注于 Apple MDM。

              JumpCloud 的 Linux 管理能力提供完整深度的策略管理、通过 Ubuntu 包管理做补丁管理、脚本执行和 SSH 密钥管理——这些能力没有直接竞争对手能在不叠加多套工具的情况下原生提供。对于
              macOS 和 iOS，JumpCloud 使用 Apple 的 Declarative Device Management（DDM）协议，确保兼容 Apple 不断演进的管理模型，并支持 macOS、iOS 和
              iPadOS 的原生 OS 补丁交付。补丁管理覆盖 Windows（带细颗粒度 KB 级看板，用于跟踪具体更新）、通过 DDM 管理的 macOS/iOS、Ubuntu Linux，以及 Chrome
              浏览器补丁。Remote Access 提供安全的 agent 远程会话能力，不要求终端用户配置 VPN。

              关键架构依赖是 JumpCloud Agent。agent 与 JumpCloud 云后端失联时，策略变更、命令执行和非 TOTP MFA 场景都会中断——带缓存 TOTP
              的本地设备登录仍可继续，但平台最具差异化的能力（远程策略推送、设备信任执行、实时监控）都需要云连接。2026 年 3 月 12 日事件暴露了这个依赖：Agent 后端退化持续五小时，导致所有已注册 agent
              的设备无法同步策略和命令。JumpCloud 基础设施依赖 Google Cloud 承载 Agentic IAM Gateway，依赖 Cloudflare 提供 CDN
              和防火墙服务，并把核心服务分布在多个云可用区和地理区域（包括欧盟区域端点），以降低单一区域故障风险。
