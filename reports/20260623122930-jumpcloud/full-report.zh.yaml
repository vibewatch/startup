  - id: FM001
    title: JumpCloud 市场边界 — 产品面 vs. 分析师类别
    type: flow
    layout: standard
    summary: JumpCloud 平台跨越三个被分析师分别测算的类别——IAM、UEM 和 ZTNA——由此形成的综合可寻址面大于任何单一已发布 TAM。
    data:
      nodes:
        - id: iam-core
          label: 身份与访问管理（IAM）
          detail: $26.2B（GVR，2026）；云子市场 $10.91B（Mordor，2026）。核心产品面：目录、SSO、MFA、PAM、IGA、provisioning。
          tone: positive
        - id: uem-adjacent
          label: 统一端点管理（UEM）
          detail: $8.85B（Mordor，2026）；到 2031 年 CAGR 为 25.74%。直接产品面：跨 OS MDM、补丁管理、设备信任策略。
          tone: positive
        - id: ztna-adjacency
          label: 零信任网络访问（ZTNA）
          detail: $47.45B（Mordor，2026）；CAGR 18.20%。战略相邻：JumpCloud 通过条件访问和设备信任执行 ZT 原则，但不销售 ZTNA 网关。
          tone: neutral
        - id: agentic-nascent
          label: Agentic / 非人类身份（早期）
          detail: 无分析师测算；2026 年 4 月以 JumpCloud Agentic IAM 推出。TAM 随每个客户部署 AI 代理的数量按比例扩张。
          tone: neutral
        - id: jumpcloud-platform
          label: JumpCloud 统一平台
          detail: 覆盖 IAM + UEM 产品面；相邻 ZTNA；Agentic IAM 尚处早期。云原生、OS 无关、按用户计费的 SaaS 模型。
