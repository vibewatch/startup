      - number: '6.2'
        title: 采用轨迹、增长信号与部署深度
        blocks:
          - type: paragraph
            body: >
              JumpCloud 组织覆盖数从 2021 年 10 月 Series F 时的约 120,000 家，增长到 2026 年 6 月的 250,000+ 家，不到五年翻了一倍以上。G2
              评价量增长也印证了这条轨迹：平台在 G2 Winter 2026 报告中有 3,722 条经验证评价（2025 年 12 月公布），到 Spring 2026 报告（2026 年 3 月公布）时超过 4,000
              条经验证评价，使其成为同类竞争组中评价最多的平台之一。

              Ramp 2026 年 6 月数据显示，在拥有身份提供商的组织中，JumpCloud 采用率为 14%，同比下降两个百分点，约从 16% 降至当前水平，在类别中排第四，落后于 Microsoft、Okta 和
              Google。两个百分点下滑是温和反向信号；尽管绝对客户基础仍在增长，但说明新进入者和 Microsoft Entra ID 扩张，部分抵消了 JumpCloud 在中端市场边界的新 logo 获取。

              案例研究中的部署深度指标很强：DECKED（一家覆盖 35 个国家的消费品制造商）把整个 Active Directory 环境迁移到 JumpCloud Platform Prime；Stord（100
              个履约地点、年 GMV $15 billion）把 JumpCloud 作为覆盖 Windows 和 macOS 的唯一 MDM 与身份平台；Quincy Manufacturing
              在零停机下完成了一夜之间的完整迁移。这些部署说明，JumpCloud 已从小众工具升级为目标客户群中的主要身份层。

              免费转付费机制是结构性触发，不主要靠销售驱动：JumpCloud 的 10 用户 / 10 设备免费层设置自动硬上限，第 11 名用户或设备会触发强制转化事件。对 SMB
              和初创公司客群而言，这形成了一条高意向、低摩擦、近零获客成本的转化路径。平台在 G2 2026 Best Software Awards 中，于 GRC、IT Infrastructure、IT
              Management、Security 和 Global Software 等类别获得 Product of the Year 认可，也进一步记录了持续的市场存在感增长。
