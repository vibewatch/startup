              后端事件证明，后端退化时，即便本地 agent 已安装，策略同步和非 TOTP MFA 场景仍会失败。受监管行业或对离线运行要求严格的组织面临架构风险；没有 FedRAMP 授权或自托管选项就无法缓释，而
