      - number: '7.3'
        title: 监管与合规暴露——FedRAMP 缺口、GDPR、EU AI Act、印度 DPDP
        blocks:
          - type: paragraph
            body: >
              JumpCloud 面临的监管与合规风险可按投资相关性排成四块：FedRAMP 授权缺口、 GDPR 与数据传输暴露、Agentic IAM 在 EU AI Act 下的不确定性，以及印度 Digital
              Personal Data Protection Act 带来的合规摩擦。

              最关键的监管缺口是没有 FedRAMP 授权。截至 2026 年 6 月 23 日，JumpCloud 既未以已授权身份出现在 FedRAMP Marketplace，
              也未显示为申请中。由美国联邦机构使用或代表其使用的软件，FedRAMP 是强制采购要求； CMMC 相邻指引也越来越多要求承包商满足这一门槛。JumpCloud 是运行在商业云基础设施上的纯云、多租户 SaaS
              架构； 要拿授权，就需要完整的第三方评估组织（3PAO）评估，以及 JABS 或机构赞助协议。 这一流程通常需要十二到三十六个月，并投入专门的合规工程资源。在拿到授权前，JumpCloud
              将长期被排除在一个结构性大、 高价值、高 ASP 的市场细分之外。

              欧洲部署方面，JumpCloud 提供符合 GDPR 的 Data Processing Agreement，纳入 Standard Contractual Clauses， 并列明 AWS 和
              Salesforce 为关键子处理方，同时公开数据保护官联系方式。印度 DPDP Act 2023 引入数据本地化和同意要求； JumpCloud 的印度区域数据中心降低但没有消除暴露，因为 JumpCloud
              自身文档承认部分遥测可能会路由到印度境外。 JumpCloud 2026 年 4 月推出 Agentic IAM，用 AI 自动生成访问策略建议；如果该产品被认定会显著影响自然人权利， 可能需要按 EU AI
              Act 做风险分类。目前尚未发布任何符合性评估或分类结论。SOC 2 Type 2 和 ISO 27001 认证可提供， 但需签 NDA，限制了独立验证范围。
