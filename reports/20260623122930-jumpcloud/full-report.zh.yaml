      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              推动 JumpCloud 可服务市场加速扩张的因素是结构性的，且很大程度上由政策驱动，因此比周期性需求信号更持久。

              最具约束力的外部驱动因素，是零信任架构的监管要求。美国行政令 14028（2021 年 5 月）和 OMB 备忘录 M-22-09 要求所有联邦行政分支机构达到具体零信任安全目标。NIST SP 800-207
              给出技术架构标准，NSA 又在 2026 年发布新的 Zero Trust Implementation Guidelines，把指导范围从 Department of Defense 扩展到更广泛的
              Defense Industrial Base 和企业部门。这些要求会外溢到政府承包商、受 HIPAA 约束的医疗机构，以及受 SOX 和 GLBA
              约束的金融服务公司；这些组织都必须落地以身份为中心的访问控制，直接对应 JumpCloud 的价值主张。

              第二个结构性驱动因素是替代 Active Directory。Microsoft Active Directory 为本地、Windows 同质环境设计；如今 91% 的 SMB 已将 Microsoft 365
              或 Google Workspace 作为主要生产力套件（Gartner，经 Medhacloud/IDC 汇编），但许多组织仍缺少云原生身份层，无法统一治理所有 OS 类型和第三方 SaaS
              应用。JumpCloud 的“云优先目录”用例，明确瞄准那些已迁移生产力工具、但尚未迁移身份层的组织。

              第三，SMB IT 支出增长强劲：IDC 预测 2026 年全球 SMB IT 支出为 $1.18T，增长 7.2%；72% 的 SMB 将网络安全列为最优先投资事项（Techaisle）。Analysys
              Mason 预测，到 2026 年全球 SMB 网络安全支出将达 $109B，较 2022 年 $76B 以 10% CAGR 增长；其中远程管理安全预计超过 $45B，是最大且增长最快的单一子类别。

              第四，AI 智能体扩散正在催生早期非人类身份治理市场。JumpCloud 2026 年 4 月发布 Agentic IAM 正是直接回应：公司称，在其调研组织中，超过一半管理的非人类身份多于人类身份；72% 已有
              AI 智能体投入生产，但 92% 缺少足够控制。该细分尚无成熟分析师测算，但 JumpCloud 自身 pulse research 将其称为董事会层面的需求信号。

              采用约束同样重要。集成复杂性是最常被提到的障碍：把云目录接入遗留本地应用（例如依赖 LDAP 的数据库、通过 Kerberos
              认证的内网系统）需要部署代理、修改防火墙规则并分阶段迁移，销售周期因此拉长，流失风险也上升。Microsoft Entra ID 的存量优势是最主要竞争约束：据 6sense 竞争分析（2026 年 6
              月），Azure Active Directory 在 IAM 类别安装基数中占 20.06%；Microsoft 又把身份服务打包进 M365 E3/E5 许可证，对既有 Microsoft
              客户不额外按席位收费，给 JumpCloud 的 SSO 和目录模块造成“价格归零”压力。SMB 预算敏感和“DIY”倾向（依赖内置 OS 目录功能）也是反复出现的障碍。即便采购决策已经做出，全球 IAM
              技能架构师短缺仍可能拖慢部署速度。
