      - number: '7.2'
        title: 竞争替代风险——Microsoft 捆绑与多线市场压力
        blocks:
          - type: paragraph
            body: >
              JumpCloud 最大的竞争风险，不是某个功能级挑战者，而是 Microsoft 的结构性捆绑策略。 Microsoft Entra ID——这套云身份平台此前名为 Azure Active
              Directory——已包含在 Microsoft 365 E3 和 E5 授权里；对已经标准化采用 Microsoft 生产力套件的组织来说，边际成本近乎为零。 任何已经押注 M365 的企业或中端市场公司评估
              JumpCloud 时，都要隐含承担一笔 TCO 溢价： 它原本可以直接启用已经买过的身份平台。这一动态是结构性的，单靠产品投入或调价无法消化。

              Ramp 2026 年 6 月的 Ramp Rate 数据显示，JumpCloud 在 IDP 品类的采用率为 14%， 总体排名第四，位于 Microsoft、Okta 和 Google 之后，同比从约 16%
              下滑两个百分点。 中端市场组织采用率最高，为 20%；在 Ramp 平台上，JumpCloud 的构成中 66% 来自该细分市场。 但边际下滑说明，在组织启用 M365 E3 并把 Entra ID
              当作捆绑权益拿到手的转化边界上， JumpCloud 正遭遇竞争侵蚀。PeerSpot 的比较分析把 Microsoft Entra ID 排在 SSO / 身份提供商品类第一， JumpCloud
              排在第十一，显示 JumpCloud 与既有龙头之间的品牌和能力差距。

              SelectHub 2026 年 6 月的分析确认，JumpCloud 对使用异构设备环境（Windows、macOS、Linux）的组织具备技术差异化， 但相较 Entra ID，Directory
              Insights 的筛选能力偏弱。JumpCloud 自己的比较材料也承认， Microsoft Entra ID / Intune 是 Windows 中心型组织的主要替代方案，同时把 JumpCloud
              定位在跨平台环境。 Okta、Google Workspace / BeyondCorp、Cisco Duo 和 Rippling 也在 SMB 与中端市场层面施加额外竞争压力。 Microsoft
              正把更多安全功能加进基础 M365 SKU，且不额外收费；这是一股长期逆风，靠自身产品速度很难逆转。
