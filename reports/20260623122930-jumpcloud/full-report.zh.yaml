chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与运营模式
        blocks:
          - type: paragraph
            body: >
              JumpCloud 是一家美国企业软件公司，总部位于科罗拉多州 Louisville。公司于 2013 年 9 月在 TechCrunch Disrupt Battlefield
              正式发布，最初产品是一款自动化服务器管理工具。此后，JumpCloud 将自身重新定位为 AI 驱动的统一 IT 管理平台，把身份、设备和访问管理整合进单一控制平面，服务同时管理人类员工和自主 AI
              智能体的组织。公司官网将其起源描述为对 Microsoft Active Directory 局限性的直接回应：云优先、远程办公、异构设备环境下，传统 AD 已经不够用。


              JumpCloud 当前处于后期私营成长期：最后一次公开披露股权融资是 2021 年 10 月 Series F，投后估值 $2.625B；截至 2026 年 6
              月本次报告生成日，之后未公开宣布新的股权融资。公司采用订阅 SaaS 模式，按用户、按月计费；第三方分析师估算基础产品约为每用户每月 $9–$20，附加模块按功能另行加价。JumpCloud 的核心买方是 IT
              环境异构的中小企业，但 2025 和 2026 年新闻稿中的管理层措辞显示，公司正在主动上探更大客户。公司称服务 160 多个国家的 250,000 多家组织，使其成为同估值层级中覆盖最广的身份管理平台之一。
