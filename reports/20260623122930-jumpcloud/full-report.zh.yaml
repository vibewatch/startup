  - id: TM001
    title: 市场定义——纳入和排除的支出
    columns:
      - 品类
      - 纳入口径的支出
      - 排除的支出
      - 主要买方 / 付款方
      - 与 JumpCloud 的相关性
    rows:
      - - 身份与访问管理（IAM）
        - SSO、MFA、PAM、IGA、云目录服务、密码管理、审计与治理
        - 网络层访问控制、VPN 基础设施、CASB、物理门禁
        - IT 经理或 CISO；由 CFO 或 COO 批准
        - 核心产品；分析师报告引用的主要 TAM
      - - 统一终端管理（UEM）
        - 跨 OS 设备注册、MDM、补丁管理、配置策略、远程擦除
        - OT/SCADA 终端管理、加固型 IoT 硬件
        - IT 管理员；由 IT 总监或运营副总裁批准
        - 直接产品覆盖面；常与 IAM 捆绑销售
      - - 零信任网络访问（ZTNA）
        - 网络策略执行、微分段、安全访问服务边缘（SASE）
        - 网络硬件、防火墙设备、SD-WAN
        - CISO 或网络架构师；由 CTO 或董事会批准
        - 相邻领域；JumpCloud 靠设备信任和条件访问落地零信任原则，但不销售网络网关
      - - 云目录服务（IAM 子赛道）
        - LDAP-as-a-service、RADIUS、通过 SCIM 做用户预配、跨平台认证
        - 本地 Active Directory 服务器授权
        - IT 管理员；由 IT 总监批准
        - 旗舰用例；替代或补充本地 AD
      - - 代理式 / 非人身份管理
        - AI agent 发现、NHI 注册、生命周期治理、人在回路检查点
        - 机器人流程自动化（RPA）工具、CI/CD 密钥管理
        - IT 管理员或 CTO；由 CISO 或 CTO 批准
        - 新兴市场；JumpCloud Agentic IAM 于 2026 年 4 月推出
