    rows:
      - - Thesis
        - IAM TAM of $25–30B+ growing at 12–15% CAGR creates durable long-term revenue opportunity; secular shift from on-premises AD to cloud identity is structural and continuing
        - High — analyst consensus from Sacra, SaaS Capital, and market research
        - Market TAM contraction, hyperscaler bundling of identity at zero cost, or adoption of FIDO2/passkey eliminating directory-based identity
      - - Thesis
        - Product-led growth model with 250,000+ organizations served provides large conversion funnel; Google Workspace partnership creates distribution leverage and strategic optionality
        - Medium — Sacra confirms PLG model; 250K orgs cited by JumpCloud official pages; Google partnership confirmed in press releases
        - Conversion rate undisclosed; if free-to-paid conversion is below 2–3%, funnel economics do not support premium valuation; Google altering partnership terms
      - - Thesis
        - Estimated ARR compounding from $25M in 2020 to ~$200M in 2024 without additional primary capital demonstrates capital efficiency; Agentic IAM expands addressable market
        - Medium — ARR figures are third-party estimates (Sacra, Latka); capital efficiency plausible but unconfirmed; Agentic IAM is nascent
        - Confirmed audited ARR significantly below $200M; Agentic IAM delayed or blocked by regulatory framework uncertainty
      - - Anti-thesis
        - The $2.625B Series F anchor implies 13x the Latka-estimated 2024 ARR and 2–4x current comparable valuations; a new round at market rates would likely be 43–62% below the 2021 mark
        - High — supported by SaaS Capital Index, iMerge Q1 2026, Acquiry, multiple public EV/Sales comps all confirming 5–8x range for traditional SaaS
        - Broad SaaS multiple re-rating driven by AI integration, IPO at premium, or strategic acquisition at control premium above $2.5B
      - - Anti-thesis
        - No NRR, gross margin, EBITDA, burn rate, or customer lifetime value data has been publicly disclosed; the entire valuation model rests on unverified third-party ARR estimates
        - High — absence confirmed across all public sources; no SEC filing, no investor deck, no audited report available
        - Voluntary disclosure ahead of a fundraising event or IPO preparation; audited financial filing resolving material uncertainty
