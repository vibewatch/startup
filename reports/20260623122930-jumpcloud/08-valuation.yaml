  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing-evidence
      - why-it-matters
      - diligence-path
    rows:
      - - ARR and NRR confirmation
        - No company-confirmed ARR, NRR, gross dollar retention, or cohort-level revenue data; all figures are third-party estimates spanning $105M–$200M
        - ARR is the primary value driver in all scenarios; a $50M swing in ARR changes base-case EV by $300M at 6x; NRR determines multiple floor vs. ceiling
        - Request audited or management-confirmed ARR schedule from Series F investors (Sapphire Ventures, BlackRock, General Atlantic) or from JumpCloud directly as part of any financing process
      - - Cap-table waterfall and preference-stack analysis
        - Forge COI data shows Series F at 1.0x non-participating liquidation preference; full preference stack across all rounds and any debt instruments not publicly available
        - At any exit below $2.625B, the preference waterfall determines how much value reaches common shareholders and earlier preferred classes; essential for modeling secondary entry returns
        - Obtain Series F Certificate of Incorporation, investor rights agreements, and any side letters from counsel or co-investors with access rights
      - - Profitability indicators and burn rate
        - No gross margin, EBITDA, operating margin, burn rate, or runway data publicly disclosed; Revelio Labs headcount (~1,165 employees, December 2025) combined with estimated ARR implies ~$172K revenue-per-employee but does not resolve profitability
        - Rule of 40 status and EBITDA margin are the primary multiple premium/discount drivers per iMerge Q1 2026; unknown burn rate creates capital adequacy uncertainty over the 56-month funding gap
        - Request monthly financial statements or at minimum LTM EBITDA and free cash flow from any new financing process; alternatively triangulate from former employee disclosures or Glassdoor salary data
      - - Google partnership economics and revenue contribution
        - Google Workspace Work Transformation Set partnership structure, revenue share, exclusivity terms, and commercial performance metrics are not publicly disclosed
        - Partnership could represent either a meaningful distribution accelerant (supporting bull case) or a single-point dependency risk (triggering partner/dependency risk); its absence from all quantitative models creates material uncertainty
        - Request partnership revenue contribution, customer acquisition data through Google channel, and contractual terms (exclusivity, renewal, change-of-control provisions) from JumpCloud or Google
    claimRefs:
      - CV003
      - CV021
      - CV031
      - CV035
      - CV027
      - CV044
    notes: >-
      Diligence asks are indicative; resolution depends on access to company financial data,
      cap-table documents, and partnership agreement disclosures not available in public sources.

figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >
      Chain from market opportunity, product proof, financial signals, competitive risks,
      and valuation anchor through the Q1 2026 multiple compression context to the
      Hold/Watch recommendation for JumpCloud.
    data:
      nodes:
        - id: market-proof
          label: "Market & Proof: IAM TAM $25–30B+ growing 12–15% CAGR; 250K+ orgs served; PLG model with validated product-market fit in SMB/mid-market"
        - id: product-moat
          label: "Product & Moat: Cloud-native, OS-agnostic directory with Google partnership and Agentic IAM initiative; but Microsoft Entra ID is near-ubiquitous incumbent"
        - id: financials
          label: "Financials: Est. $200M ARR 2024 (Latka); ~$172K revenue/employee (Revelio); no NRR, gross margin, EBITDA, or burn rate disclosed"
        - id: risks
          label: "Risks: High — $2.625B preference overhang; no secondary price signal; 56-month funding gap; SaaS multiple compression at decade-plus lows Q1 2026"
        - id: valuation
          label: "Valuation: Base case $1.2B (6x × $200M ARR); bull $1.84B (8x × $230M); Series F anchor $2.625B is 2–4x any scenario range"
        - id: recommendation
          label: "Recommendation: Hold / Watch — do not invest at 2021 Series F price; secondary entry below $1.2B with confirmed ARR ≥$200M and cap-table analysis could be considered"
      edges:
        - from: market-proof
          to: product-moat
          label: validates
        - from: product-moat
          to: financials
          label: informs
        - from: financials
          to: risks
          label: amplifies
        - from: risks
          to: valuation
          label: constrains
        - from: valuation
          to: recommendation
          label: drives
    claimRefs:
      - CV001
      - CV010
      - CV027
      - CV033
      - CV035
      - CV043

  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >
      Implied enterprise value ($M) across a 4x–8x EV/ARR multiple range at three ARR
      scenarios ($175M bear, $200M base, $230M bull), with the $2.625B Series F anchor
      marked for reference. Illustrates that no ARR-multiple combination within the
      analytically defensible range reaches the 2021 financing mark.
    data:
      items:
        - label: "Bear ARR $175M @ 4x"
          value: 700
        - label: "Bear ARR $175M @ 6x"
          value: 1050
        - label: "Base ARR $200M @ 5.3x"
          value: 1060
        - label: "Base ARR $200M @ 6x"
          value: 1200
        - label: "Base ARR $200M @ 8x"
          value: 1600
        - label: "Bull ARR $230M @ 8x"
          value: 1840
        - label: "Series F Anchor (Oct 2021)"
          value: 2625
    approximationNotes: >
      ARR figures are third-party estimates (Sacra, Latka). Multiples drawn from iMerge Q1
      2026 private SaaS index, SaaS Capital 2025 model, and Okta public EV/Sales. EV figures
      are enterprise value, pre-preference-stack waterfall, and do not represent equity value
      per share class.
    claimRefs:
      - CV010
      - CV012
      - CV014
      - CV023
      - CV032
      - CV033
      - CV034

  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >
      Low-to-high enterprise value scenarios for JumpCloud versus the $2.625B Series F
      anchor, illustrating the challenging return profile for Series F investors versus
      any theoretical secondary buyer at current analytically supportable prices.
    data:
      items:
        - label: "Bear Case EV ($M)"
          low: 700
          high: 750
        - label: "Base Case EV ($M)"
          low: 1100
          high: 1300
        - label: "Bull Case EV ($M)"
          low: 1600
          high: 1900
        - label: "Series F Break-Even (1x return, $M)"
          low: 2625
          high: 2625
        - label: "Series F 2x Return Needed ($M)"
          low: 5250
          high: 5250
    approximationNotes: >
      Bear/base/bull EV ranges are scenario-based constructs using ARR estimates and market
      multiples as of June 2026. Series F break-even and return figures assume full $225M
      Series F is invested at $2.625B; actual per-share returns require full cap-table
      waterfall analysis including all preference classes, dividends, anti-dilution provisions,
      and any debt instruments. A 2x return for Series F investors at institutional hurdle rates
      requires an exit at approximately $5.25B, implying ~$525M ARR at 10x — not supportable
      in any near-term scenario.
    claimRefs:
      - CV001
      - CV002
      - CV031
      - CV032
      - CV033
      - CV034

  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >
      Investment committee-ready scoring across market opportunity, product proof, competitive
      moat, financial economics, valuation, risk profile, and evidence quality for JumpCloud
      as of June 23, 2026.
    data:
      items:
        - label: "Market Opportunity"
