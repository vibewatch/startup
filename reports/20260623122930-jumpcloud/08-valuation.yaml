        - label: "Financial Economics"
          value: 3
          max: 10
          note: "Est. $200M ARR (2024, Latka); ~$172K revenue/employee; zero confirmed NRR, gross margin, or EBITDA. Capital structure opaque after 56-month no-raise gap."
        - label: "Valuation"
