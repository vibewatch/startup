  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold-or-event
      - transmission-to-thesis
      - action-implication
    rows:
      - - New primary equity round at deep discount
        - JumpCloud raises at valuation below $1.0B (>62% below Series F)
        - Confirms valuation reset and validates bear-case enterprise value; signals investor loss of confidence in 2021 anchor; triggers preference-stack analysis for all existing holders
        - Exit position immediately; do not invest at any price tied to the 2021 mark; re-evaluate only after full cap-table waterfall analysis of the new round's terms
      - - NRR confirmed below 100%
        - Any public or investor disclosure showing net dollar retention below 100% (shrinking cohorts)
        - Structural revenue model impairment; reduces sustainable ARR growth rate; compresses multiple further toward 3x floor (per iMerge NRR cliff data)
        - Downgrade to Avoid; a leaky-bucket ARR model at $200M scale with declining cohorts cannot support a premium multiple under any scenario
      - - Microsoft Entra ID bundled at zero incremental cost in mid-market
        - Microsoft changes licensing to include Entra ID at no additional cost in Microsoft 365 Business Premium tiers covering JumpCloud's core 50–2,000 employee segment
        - Destroys JumpCloud's core pricing power; free-tier value proposition rendered moot by incumbent bundling; TAM effectively contracts
        - Immediate Avoid; addressable market contracts faster than JumpCloud can pivot upmarket or to Agentic IAM revenue
      - - Continued funding gap beyond 60 months with no disclosure
        - No new primary round, IPO filing, or acquisition announcement by end of Q4 2026
        - Signals capital adequacy concern or inability to access equity on acceptable terms; increases probability of distressed financing event
        - Escalate diligence; demand financial disclosure from existing shareholders; do not make new secondary commitments without confirmed runway data
