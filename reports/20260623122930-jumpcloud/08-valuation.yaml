  - id: public-comparable-set-and-multiple-analysis
    title: Public comparable set and IAM market multiple analysis
    body: >
      The publicly available comparable set for JumpCloud spans two axes: direct public-
      equity peers in identity, access, and device management, and broader high-growth
      cybersecurity SaaS platforms that serve as multiple benchmarks. The most direct public
      comp is Okta (NASDAQ: OKTA), which operates at the intersection of cloud identity,
      SSO, and workforce identity management. As of June 23, 2026, Okta trades at an
      enterprise value of $17.97 billion against trailing-twelve-months revenue of
      approximately $3.00 billion, implying an EV/Sales multiple of approximately 6.0 times.
      Okta's fiscal year 2026 (ending January 31, 2026) revenue was $2.919 billion, up
      11.84% year-over-year, with a gross margin of 77.36% and a positive operating margin
      of 5.10% — a significant maturation from years of heavy investment-phase losses.
      Okta's price-to-sales ratio on June 23, 2026 stands at 6.73x. While Okta is materially
      larger than JumpCloud and increasingly focused on enterprise identity governance and
      workforce identity, it serves as the most direct public benchmark for cloud-native
      identity management.


      CrowdStrike (NASDAQ: CRWD) commands a dramatically higher EV/Sales multiple of 33.21
      times as of June 23, 2026, reflecting its platform consolidation narrative, AI-native
      endpoint security positioning, and $5.09 billion in TTM revenue with 23% growth.
      CrowdStrike's premium is an outlier within the cyber-SaaS space and is driven by a
      platform business model, dominant market position, and AI differentiation that
      JumpCloud does not replicate; using CRWD as a comp would materially overstate any
      reasonable JumpCloud valuation. The Acquiry (February 2026) and iMerge (Q1 2026)
      research frameworks corroborate the segmentation: traditional SaaS companies growing
      at 15–30% ARR trade at 3–5x ARR, while those growing at 30%+ command 5–8x. Only
      AI-native SaaS businesses with >50% growth are reaching 10–20x ARR in 2026
      transactions.


      The SaaS Capital Index (SCI) provides the most comprehensive longitudinal public SaaS
      benchmark. As of early 2025, the SCI median stood at 7.0x ARR, with the top-decile
      names (CrowdStrike at 20.8x, ServiceNow at 19.5x) reflecting platform and AI premiums.
      By Q1 2026, the SCI fell to decade-plus lows; SaaS Capital's ARRG analysis (ARR
      multiple ÷ growth rate) suggests further vulnerability since the metric remains above
      prior lows even after the Q1 sell-off, implying the market has not yet fully priced in
      growth deceleration risk. Aventis Advisors' historical series documents the peak-to-
      trough compression from 20–40x in 2021 to the current 5–8x band for traditional SaaS.
      Mapping this to JumpCloud: if JumpCloud is growing at approximately 25–30% (consistent
      with the Sacra/Latka ARR trajectory), it falls in the "traditional SaaS >30% growth"
      category commanding 5–8x, not the AI-native premium tier. The absence of any confirmed
      AI-native ARR contribution makes even the 5–8x upper bound aspirational.
