      missingEvidence: >-
        Cash on hand, monthly burn rate, and financial runway are not publicly disclosed.
        No cash flow statement or treasury position has been provided in any public venue.
      whyItMatters: >-
        Capital adequacy assessment is impossible without cash and burn data; with no new equity
        round since October 2021, the runway trajectory and any near-term financing dependency
