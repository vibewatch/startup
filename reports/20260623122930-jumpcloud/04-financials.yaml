    - type: private-evidence-only
      severity: material
      topic: ebitda-non-disclosure
      missingEvidence: >-
        EBITDA, operating income, and net income have never been publicly disclosed by JumpCloud.
        The company's profitability path and Rule of 40 score cannot be calculated from public
        data.
      whyItMatters: >-
        EBITDA and the Rule of 40 (revenue growth rate + EBITDA margin) are standard SaaS
        investment metrics; their absence prevents assessment of whether JumpCloud has transitioned
        from growth-mode losses toward sustainable unit economics.
      diligencePath: >-
        Request GAAP P&L including operating income, EBITDA, and net income for FY2022–FY2025;
