company:
  name: JumpCloud
chapter:
  number: 4
  title: Financials
  summary: >-
    JumpCloud operates a per-user per-month SaaS subscription model with a product-led growth free
    tier; third-party estimates place 2024 ARR at approximately $200M, but no audited financial
    statements, gross margin, EBITDA, NRR, or burn rate have ever been publicly disclosed. The
    $2.625B Series F valuation from October 2021 is the last disclosed anchor and reflects a
    ~46.5x ARR multiple that is materially inconsistent with 2025–2026 SaaS market conditions.

sections:
  - id: section-revenue-model
    title: Revenue model, pricing, and ARR trajectory
    body: >
      JumpCloud operates an exclusively subscription-based SaaS revenue model, billing customers
      on a per-user per-month basis through a tiered package structure. The monetization funnel
      begins with a permanently free tier limited to 10 users and 10 devices, which serves as a
      product-led growth (PLG) entry point and creates a natural conversion trigger when
      organizations exceed that threshold. Published list pricing on the official pricing page
      starts at $9 per user per month on annual billing for the Device Management tier, $11 per
      user per month for the SSO tier, and $13 per user per month for the Device Identity
      Management tier ($15 per month on monthly billing). The Platform Essentials, Platform, and
      Platform Prime bundles require contacting sales and carry no published per-seat prices;
      Platform Essentials is capped at 300 users. Add-on modules—including SAML SSO, RADIUS, patch
      management, and advanced integrations—are available at approximately $3–4 per feature per
      user per month according to Sacra's business model description.


      Revenue trajectory, as estimated by third-party analysts, shows material growth over five
      years. Sacra's model estimates ARR grew from approximately $25 million in 2020 to $55 million
      in 2021 (+120% year-over-year), $80 million in 2022 (+45%), and $105 million in 2023 (+31%).
      GetLatka separately reported that JumpCloud reached $200 million in 2024, citing JumpCloud's
      own website as the source, with data updated November 2025. None of these figures are
      company-confirmed; both are derived from third-party estimation models. Sacra and Latka
      differ on 2022–2023 figures: Latka's timeline shows $71.6 million in November 2022 and
      $76.6 million in November 2023 (both labeled "Estimated"), while Sacra's year-end ARR
      estimates are $80 million and $105 million respectively—the divergence reflects different
      methodologies, not a verified underlying number. In the absence of audited financials, both
      sources must be treated as approximate signals rather than confirmed metrics. JumpCloud
      disclosed over 250,000 total organizations served as of June 2026, but the October 2021
      Series F press release cited only "more than 5,000 paying customers," suggesting the
      overwhelming majority of organizations use the free tier.
