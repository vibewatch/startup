        third-party analyst profiles.
      whyItMatters: >-
        NRR is the primary SaaS expansion metric; without it, the ARR growth trajectory cannot
        be decomposed into new logo growth versus expansion, making future ARR projections
        unreliable.
      diligencePath: >-
        Request cohort-level NRR by customer segment and calendar year; request gross and net
