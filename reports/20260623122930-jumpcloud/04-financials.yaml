  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: gross-margin-non-disclosure
      missingEvidence: >-
        JumpCloud has not publicly disclosed gross margin, COGS breakdown, or any income
        statement data. The 65–75% gross margin estimate is derived from competitive benchmarks
        (Okta public filings) and qualitative cost structure analysis only.
      whyItMatters: >-
        Gross margin is the primary measure of platform scalability and incremental profitability;
        without it, the company's long-term unit economics and margin expansion path cannot be
        assessed or modeled.
      diligencePath: >-
        Request audited GAAP income statement with full COGS breakdown (infrastructure, support,
        third-party licenses, professional services) for FY2022–FY2025 in data room.
      relatedQuestionRefs:
        - QI003
      relatedTableRefs:
