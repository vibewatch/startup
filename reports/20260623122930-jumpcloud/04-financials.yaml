        but do not represent JumpCloud-specific data.
      whyItMatters: >-
        CAC and payback period measure the capital intensity of growth; without them, sales
        efficiency and the efficiency of JumpCloud's blended PLG/outbound GTM motion cannot be
        assessed.
      diligencePath: >-
        Request blended and segmented CAC by GTM motion (PLG, inbound, outbound); request
