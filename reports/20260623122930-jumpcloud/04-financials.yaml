      whyItMatters: >-
        Customer concentration affects revenue risk; a large enterprise customer loss could
        produce a material ARR decline. For a company with a stated SMB focus, concentration
        in a small number of large accounts would be a nuanced risk that the public record
        does not allow assessment of.
      diligencePath: >-
