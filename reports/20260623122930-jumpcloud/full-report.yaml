      - number: '7.5'
        title: Customer concentration, SMB macro sensitivity, and infrastructure dependency risks
        blocks:
          - type: paragraph
            body: >
              JumpCloud's customer base presents compounding concentration risks from multiple vectors: free-tier base
              opacity, MSP channel dependency, SMB macro sensitivity, and infrastructure single-vendor exposure. These
              risks interact: a macroeconomic recession that drives SMB budget cuts would simultaneously stress the
              largest paying segment, trigger MSP-partner consolidation pressure, and flow through to ARR impairment
              with no public early-warning metric to anticipate the magnitude.

              Free-tier concentration risk is structural. JumpCloud disclosed 5,000-plus paying organizations against
              120,000-plus total in October 2021, implying approximately 4% free-to-paid conversion at that date. At the
              current 250,000-plus total count, the paying base and conversion ratio have not been updated in over four
              years; the revenue base quality cannot be independently assessed. SMB-focused SaaS platforms historically
              face 30-55% annualized gross churn in recessionary environments as discretionary IT budgets are cut, and
              the SMB segment constitutes the majority of JumpCloud's identifiable customer base.

              MSP channel concentration adds dependency risk that is partly visible. CRN's 2026 reporting describes MSPs
              as a significant portion of JumpCloud's growth. The MacSolution acquisition in Q1 2026 brought JumpCloud's
              top Brazilian MSP partner in-house with undisclosed terms, signaling that at least one MSP relationship
              was large enough to warrant vertical integration — and that top-MSP departure risk is a scenario that
              management has explicitly engaged with. The MSP-originated ARR percentage and partner concentration
              profile remain undisclosed.

              Infrastructure dependencies create single-vendor concentration risk. JumpCloud's cloud-only SaaS platform
              operates on AWS with no publicly confirmed multi-cloud failover, and Cloudflare provides CDN and DDoS
              protection — both confirmed as material dependencies by the June 22, 2026 admin console degradation event.
              Public-sector customers are entirely absent from JumpCloud's named case study library, consistent with the
              FedRAMP gap.
