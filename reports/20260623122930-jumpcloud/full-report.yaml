      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >
              JumpCloud's buyer, user, and payer roles are often held by different people within the same organization,
              and the mix shifts significantly by company size and go-to-market channel.

              The primary buyer and technical decision-maker is the IT administrator or IT manager at organizations with
              2–20 person IT teams. This persona manages identity, device, and access across a heterogeneous fleet,
              often using 3–10 point tools that JumpCloud proposes to consolidate. Job titles include IT Administrator,
              IT Manager, Systems Administrator, and Director of IT. The buyer's dominant motivation is operational
              efficiency — replacing manual onboarding/offboarding, eliminating VPN dependencies, and achieving
              audit-readiness for SOC 2, HIPAA, or GDPR without hiring a dedicated security team.

              The economic payer is typically the CFO, COO, or VP of Operations at the same organization, who approves
              IT tool spend as part of an operating budget. JumpCloud's per-user per-month pricing model (approximately
              $9–$20 per user per month) maps to head-count-based subscription spend, making the cost predictable and
              the approval path short for sub-200 person companies. The adoption trigger is usually a compliance
              requirement, a security incident, a remote/hybrid work transition, or the elimination of a physical office
              server.

              The user is every employee whose identity, device, and application access is governed by JumpCloud — a
              population that is by definition the same as the customer's headcount. User experience (UX) quality and
              change-management overhead are adoption variables: if MFA rollout or device enrollment is disruptive, IT
              administrators face internal resistance that can stall or reverse deployment.

              The MSP (Managed Service Provider) channel represents a secondary buyer category. MSPs purchase JumpCloud
              to manage IT for multiple end-customer organizations, typically SMBs under 50 employees. This channel is
              particularly relevant given Analysys Mason's finding that MSPs and SIs are projected to be the dominant
              route-to-market for SMB cybersecurity spend, accounting for 40% of the channel by 2025. JumpCloud has a
              dedicated MSP program and MSP-specific pricing, creating a distinct buyer persona with multi-tenant
              management requirements.

              Mid-market and enterprise buyers (500–5,000 employees) have a longer sales cycle, require SAML/OIDC
              federation with legacy applications, and place more emphasis on vendor SLAs, enterprise support tiers, and
              compliance certifications. JumpCloud's 2026 executive additions (CISO Roland Palmer and CRO Shianne
              Sampson) signal deliberate upmarket movement into this segment.
