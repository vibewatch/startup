  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base segmentation, buyer profile, and channel composition
        blocks:
          - type: paragraph
            body: >
              JumpCloud's disclosed organization count of 250,000+ spans 160+ countries and six global regions as of
              June 2026, but this headline figure aggregates paying and free-tier organizations without distinction. The
              October 2021 Series F press release established a ratio of approximately 5,000 paying customers against
              120,000+ total organizations, implying roughly 95% of the base on the permanent free tier at that date; no
              updated paying/free breakdown has been published as the total count grew to 250,000+. The paying base is
              the strategically relevant segment for revenue analysis.

              Within the paying segment, the customer composition skews decisively toward mid-market companies. Ramp's
              June 2026 vendor analytics data shows JumpCloud holding a 14% adoption rate in the identity provider
              category (ranked fourth overall) with mid-market companies representing the highest segment adoption rate
              at 20%, followed by SMB at 12% and enterprise at 9%. Mid-market buyers account for approximately 66% of
              JumpCloud's composition on the Ramp platform. The core buyer persona is an IT manager or small IT team at
              a 50–2,000 employee organization operating a heterogeneous device fleet (Windows, macOS, Linux) and
              migrating away from on-premises Active Directory toward cloud-native identity and device management.

              JumpCloud's channel structure comprises three distinct routes to market: direct product-led growth (PLG),
              where organizations self-serve through the free tier and convert organically at the 11-user/device
              threshold; direct sales-assisted mid-market motion for Platform Prime and enterprise bundles requiring
              contract negotiation; and the MSP and VAR channel, where JumpCloud is bundled into managed IT service
              offerings delivered to SMBs and mid-market clients by third-party partners. JumpCloud operates in 170+
              countries through its partner ecosystem. The MSP channel is quantitatively material — CRN reporting from
              early 2026 described MSPs as accounting for "a significant portion" of JumpCloud's growth — but the exact
              channel ARR split has not been publicly disclosed.

              Vertical concentration is not officially disclosed, but case study evidence clusters most clearly in:
              technology and SaaS companies (cloud-first, remote-first, compliance-driven), professional services
              (managed IT and cybersecurity consultancies), and manufacturing and logistics firms pursuing AD
              replacement and operational compliance.
