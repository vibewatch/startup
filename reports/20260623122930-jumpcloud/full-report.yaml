      - number: '1.3'
        title: Capital base, funding history, and investor map
        blocks:
          - type: paragraph
            body: >
              JumpCloud has raised over $400 million in venture capital across approximately eleven rounds from seed
              through Series F. The financing arc begins with a $1.2 million seed from Foundry Group in December 2012
              and proceeds through a $3.07 million Series A (January 2014, Foundry and Techstars), two Series B tranches
              totaling approximately $9 million (2015), a $20 million Series C in November 2017 (OpenView and Foundry),
              a $50 million Series D in May 2019 led by General Atlantic, and a $100 million Series E across November
              2020 and January 2021 led by BlackRock.


              The Series F is the largest and most consequential financing event. The initial $159 million tranche was
              announced September 13, 2021 at a $2.56 billion valuation, led by Sapphire Ventures with participation
              from Owl Rock, Whale Rock Capital, Sands Capital, and Endeavor Catalyst alongside existing investors
              General Atlantic, BlackRock, and H.I.G. Growth Partners. A second $66 million tranche announced October
              19, 2021 brought the round to $225 million total and the post-money valuation to $2.625 billion; it added
              strategic investors Atlassian Ventures, CrowdStrike Falcon Fund, NTT Docomo Ventures, STEADFAST Capital
              Ventures, Waterman Ventures, and OurCrowd. Tracxn records 34 total institutional investors across all
              rounds, and different databases cite cumulative raises of $408 million to $418 million against the
              company's own stated $400M+ figure; this variance reflects methodological differences in counting tranches
              and does not represent a factual conflict. No subsequent equity round has been publicly announced since
              October 2021; the $2.625 billion valuation therefore remains the most recent disclosed figure. The full
              cap table, post-Series F preference waterfall, and any secondary transaction history are not publicly
              available.
