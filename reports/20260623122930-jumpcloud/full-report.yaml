  - id: FR002
    title: Risk Transmission Map
    type: dag
    layout: wide
    summary: >-
      Causal map showing how JumpCloud's four primary external risk inputs — nation-state targeting, Microsoft bundling,
      SMB macro recession, and FedRAMP exclusion — transmit through customer trust, market share, and ARR growth to
      drive valuation and liquidity risk.
    data:
      nodes:
        - id: breach
          label: Nation-state breach recurrence
          detail: >-
            Confirmed DPRK supply-chain targeting via 2023 UNC4899 compromise; recurrence risk is structural given
            JumpCloud's position as identity control plane for 200K+ orgs.
        - id: bundling
          label: Microsoft M365 bundling pressure
          detail: >-
            Entra ID included in M365 E3/E5 at near-zero marginal cost; Ramp Rate shows JumpCloud IDP adoption declining
            2 pp YoY to 14% as of June 2026.
        - id: macro
          label: SMB macro / recession shock
          detail: >-
            SMB-focused SaaS platforms face 30-55% annualized gross churn in recessions; JumpCloud's heavy SMB weighting
            creates cyclical revenue exposure.
        - id: fedramp
          label: FedRAMP market exclusion
          detail: >-
            No FedRAMP authorization as of June 2026; US federal and most CMMC-mandated contractor procurement is
            permanently blocked until authorization is obtained.
        - id: trust
          label: Customer trust erosion
          detail: >-
            Breach events or reliability incidents erode customer trust in the identity provider; trust loss in the IAM
            category is asymmetric — easier to lose than restore.
        - id: share
          label: IDP market share loss
          detail: >-
            Bundling displacement and FedRAMP exclusion remove accessible segments; PeerSpot ranks JumpCloud 11th vs.
            Entra ID 1st in SSO category.
        - id: arr
          label: ARR growth deceleration
          detail: >-
            Combination of elevated churn (macro + trust erosion) and reduced new logo acquisition (share loss + FedRAMP
            gap) compress net ARR growth.
        - id: multiple
          label: Valuation multiple compression
          detail: >-
            Lower ARR growth rate reduces the defensible revenue multiple; post-2022 SaaS compression has already moved
            market to 5-10x ARR vs. 46.5x at JumpCloud's 2021 round.
        - id: exit
          label: Down-round / IPO blockage
          detail: >-
            2021 valuation of $2.625B requires sustained high-growth to support at current multiples; any
            below-watermark event blocks or delays liquidity for investors.
        - id: impairment
          label: Revenue and growth impairment
          detail: >-
            Sustained ARR deceleration impairs the growth narrative required to sustain the investment thesis; no public
            NRR or cohort data provides early warning.
      edges:
        - from: breach
          to: trust
          label: Elevates customer concern
        - from: bundling
          to: share
          label: Displaces at renewal
        - from: macro
          to: arr
          label: Reduces net new ARR
        - from: fedramp
          to: share
          label: Excludes market segment
        - from: trust
          to: arr
          label: Elevates gross churn
        - from: share
          to: arr
          label: Limits new logo growth
        - from: arr
          to: multiple
          label: Lower growth compresses multiple
        - from: multiple
          to: exit
          label: Blocks above-watermark exit
        - from: arr
          to: impairment
          label: Direct ARR deceleration
    claimRefs:
