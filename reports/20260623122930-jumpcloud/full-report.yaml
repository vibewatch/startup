      - number: '8.3'
        title: ARR estimation framework, intrinsic valuation range, and scenario analysis
        blocks:
          - type: paragraph
            body: >
              Two structural challenges define the JumpCloud valuation analysis: all ARR and revenue figures are
              third-party estimates with no company confirmation, and no secondary market price exists to provide an
              independent mark. Working from the available evidence: Sacra estimates $105M ARR at year-end 2023, growing
              31% from $80M in 2022. GetLatka records $200M ARR in 2024, citing JumpCloud's own website as the source,
              last updated November 2025. Latka's own historical timeline separately shows $76.6M in November 2023
              (labeled Estimated), creating a 37% discrepancy with Sacra's $105M year-end 2023 figure that reflects
              methodological differences rather than a confirmed underlying number. CompWorth estimates $144.3M for a
              period it labels as current but acknowledges is derived from stale inputs. IncFact places JumpCloud in a
              broad $100M–$500M range with no specific year-end figure. Given this data mosaic, the most defensible ARR
              anchor is $200M for 2024 (Latka), extrapolating from JumpCloud's own website, with a meaningful downside
              tail to $150–160M (consistent with Sacra/CompWorth trajectories). Projecting growth at 15–25% into
              mid-2026 yields an estimated current ARR range of approximately $175M (bear) to $250M (bull), with
              $200–210M as the base case.


              Three valuation scenarios are constructed using ARR as the primary value driver and EV/ARR as the
              multiple, informed by the comparable set:


              The bear case assumes $175M ARR at a 4.0x multiple (bottom of the Q1 2026 private SaaS scale range,
              consistent with compressed market sentiment and slower growth), yielding an implied enterprise value of
              $700M. This scenario is triggered by ARR growth deceleration to below 15%, competitive displacement by
              Microsoft Entra ID continuing to erode SMB market share, or further SaaS multiple compression driven by AI
              disruption narratives.


              The base case assumes $200M ARR at a 6.0x multiple (in line with the Okta public comparable and the upper
              end of the iMerge Q1 2026 scale-tier range), yielding an implied enterprise value of $1.2 billion. This is
              the most probable scenario given available evidence and represents approximately 54% below the $2.625B
              Series F anchor.


              The bull case assumes $230M ARR at an 8.0x multiple (top-quartile private SaaS for NRR >110% and Rule of
              40 >40%, which JumpCloud might achieve if Google partnership drives expansion revenue and Agentic IAM
              gains enterprise traction), yielding an implied enterprise value of $1.84 billion. Even in this bull
              scenario, the implied enterprise value is 30% below the Series F anchor.


              Sensitivity analysis confirms that the multiple is the dominant driver: moving from 4x to 8x at $200M ARR
              shifts value from $800M to $1.6B — an 100% spread driven entirely by market sentiment. ARR uncertainty is
              secondary: a $50M ARR miss at 6x costs $300M in implied value. At no ARR-or-multiple combination within
              any analytically defensible scenario does JumpCloud's enterprise value approach the $2.625B Series F mark;
              that mark would require $328M ARR at 8x or $525M ARR at 5x, neither of which is supportable from available
              evidence by the run date.
