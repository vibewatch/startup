  - id: FE002
    title: JumpCloud employee lifecycle workflow — from HR event to audited access
    type: flow
    layout: standard
    summary: >-
      JumpCloud's core customer workflow converts an HR system event into governed, audited access across devices and
      applications in a single automated motion.
    data:
      nodes:
        - id: hris-event
          label: HRIS Event (hire / role change / offboard)
          detail: >-
            HR system (Workday, BambooHR, Rippling, etc.) triggers a lifecycle event. JumpCloud monitors via SCIM or
            native connector. Event is the authoritative identity trigger.
          tone: neutral
        - id: jc-provision
          label: JumpCloud Provisioning Engine
          detail: >-
            SCIM 2.0 or API call creates or deactivates the user record. Group assignment based on HR attributes
            automatically provisions access to all connected resources.
          tone: positive
        - id: device-enroll
          label: Device Enrollment via JumpCloud Agent
          detail: >-
            IT deploys agent on endpoint (Windows/macOS/Linux) or user self-enrolls mobile. Agent registers device,
            pulls policy, binds device to user identity.
          tone: positive
        - id: sso-mfa
          label: SSO + MFA Authentication (900+ apps)
          detail: >-
            User accesses JumpCloud portal; authenticates via SAML/OIDC to 900+ apps. MFA enforced based on conditional
            access policy (device health, network, risk level).
          tone: positive
        - id: policy-enforce
          label: Conditional Access & Real-time Policy Enforcement
          detail: >-
            Device compliance check runs on every access request. Non-compliant or unmanaged devices blocked. AI agents
            on same device are also subject to device trust check.
          tone: positive
        - id: audit-log
          label: Directory Insights Audit Log (SIEM export)
          detail: >-
            All authentication events (SSO, LDAP, RADIUS, agent, AI gateway) written to Directory Insights API.
            Customers export to SIEM for compliance and forensics.
          tone: neutral
      edges:
        - from: hris-event
          to: jc-provision
        - from: jc-provision
          to: device-enroll
        - from: jc-provision
          to: sso-mfa
        - from: device-enroll
          to: policy-enforce
        - from: sso-mfa
          to: policy-enforce
        - from: policy-enforce
          to: audit-log
    claimRefs:
      - CE008
      - CE013
      - CE014
      - CE015
      - CE024
  - id: FE003
    title: JumpCloud critical dependency map — platform components and upstream dependencies
    type: dag
    layout: standard
    summary: >-
      JumpCloud's cloud-native delivery creates upstream dependencies on Google Cloud, Cloudflare, and third-party HRIS
      systems; the on-endpoint JumpCloud Agent is the most critical single-point component in day-to-day operations.
    data:
      nodes:
        - id: jc-platform
          label: JumpCloud SaaS Control Plane
          detail: >-
            Multi-tenant control plane hosting admin console, directory, SCIM, API, and federation. Distributed across
            cloud AZs with US and EU regional endpoints.
        - id: google-cloud
          label: Google Cloud (AI Gateway Host)
          detail: >-
            Hosts Agentic IAM gateway; provides global infrastructure for AI-speed identity operations. June 2026 launch
            deepens Google Cloud dependency for agentic features.
        - id: cloudflare
          label: Cloudflare CDN / WAF
          detail: >-
            Content delivery and DDoS/firewall protection for JumpCloud's web properties and admin console. A June 22,
            2026 Cloudflare outage caused console loading delays.
        - id: jc-agent
          label: JumpCloud Agent (Endpoint — Windows/macOS/Linux)
          detail: >-
            Lightweight agent installed on managed devices. Most critical dependency for policy enforcement, device
            trust, and non-TOTP MFA. Agent outage = policy sync loss.
        - id: hris-system
          label: HRIS / HR Platform (Workday, BambooHR, etc.)
          detail: >-
            Authoritative identity lifecycle trigger. SCIM or native connector feeds user provisioning and
            deprovisioning. Loss of HRIS sync creates identity drift.
        - id: saml-apps
          label: SAML / OIDC Application Catalog (900+ apps)
          detail: >-
            Third-party SaaS applications that depend on JumpCloud as the IdP for SSO. JumpCloud outage prevents app
            logins that require federated authentication.
