          Confirms valuation reset and validates bear-case enterprise value; signals investor loss of confidence in 2021
          anchor; triggers preference-stack analysis for all existing holders
        - >-
          Exit position immediately; do not invest at any price tied to the 2021 mark; re-evaluate only after full
          cap-table waterfall analysis of the new round's terms
      - - NRR confirmed below 100%
        - Any public or investor disclosure showing net dollar retention below 100% (shrinking cohorts)
        - >-
          Structural revenue model impairment; reduces sustainable ARR growth rate; compresses multiple further toward
          3x floor (per iMerge NRR cliff data)
        - >-
          Downgrade to Avoid; a leaky-bucket ARR model at $200M scale with declining cohorts cannot support a premium
          multiple under any scenario
      - - Microsoft Entra ID bundled at zero incremental cost in mid-market
        - >-
          Microsoft changes licensing to include Entra ID at no additional cost in Microsoft 365 Business Premium tiers
          covering JumpCloud's core 50–2,000 employee segment
        - >-
          Destroys JumpCloud's core pricing power; free-tier value proposition rendered moot by incumbent bundling; TAM
          effectively contracts
        - >-
          Immediate Avoid; addressable market contracts faster than JumpCloud can pivot upmarket or to Agentic IAM
          revenue
      - - Continued funding gap beyond 60 months with no disclosure
        - No new primary round, IPO filing, or acquisition announcement by end of Q4 2026
        - >-
          Signals capital adequacy concern or inability to access equity on acceptable terms; increases probability of
          distressed financing event
        - >-
          Escalate diligence; demand financial disclosure from existing shareholders; do not make new secondary
          commitments without confirmed runway data
    claimRefs:
      - CV003
      - CV014
      - CV019
      - CV037
      - CV040
      - CV043
    notes: >
      Trigger thresholds are analytical constructs based on available market benchmarks and are not confirmed JumpCloud
      operational targets. The NRR threshold draws on iMerge Q1 2026 data showing the valuation cliff at 100% NRR.
      Microsoft bundling scenario is a risk hypothesis from competitive analysis; no announcement of such bundling is
      known as of June 23, 2026.
  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing-evidence
      - why-it-matters
      - diligence-path
    rows:
      - - ARR and NRR confirmation
        - >-
          No company-confirmed ARR, NRR, gross dollar retention, or cohort-level revenue data; all figures are
          third-party estimates spanning $105M–$200M
        - >-
          ARR is the primary value driver in all scenarios; a $50M swing in ARR changes base-case EV by $300M at 6x; NRR
          determines multiple floor vs. ceiling
        - >-
          Request audited or management-confirmed ARR schedule from Series F investors (Sapphire Ventures, BlackRock,
          General Atlantic) or from JumpCloud directly as part of any financing process
      - - Cap-table waterfall and preference-stack analysis
        - >-
          Forge COI data shows Series F at 1.0x non-participating liquidation preference; full preference stack across
          all rounds and any debt instruments not publicly available
        - >-
          At any exit below $2.625B, the preference waterfall determines how much value reaches common shareholders and
          earlier preferred classes; essential for modeling secondary entry returns
        - >-
          Obtain Series F Certificate of Incorporation, investor rights agreements, and any side letters from counsel or
          co-investors with access rights
      - - Profitability indicators and burn rate
        - >-
          No gross margin, EBITDA, operating margin, burn rate, or runway data publicly disclosed; Revelio Labs
          headcount (~1,165 employees, December 2025) combined with estimated ARR implies ~$172K revenue-per-employee
          but does not resolve profitability
        - >-
          Rule of 40 status and EBITDA margin are the primary multiple premium/discount drivers per iMerge Q1 2026;
          unknown burn rate creates capital adequacy uncertainty over the 56-month funding gap
        - >-
          Request monthly financial statements or at minimum LTM EBITDA and free cash flow from any new financing
          process; alternatively triangulate from former employee disclosures or Glassdoor salary data
      - - Google partnership economics and revenue contribution
        - >-
          Google Workspace Work Transformation Set partnership structure, revenue share, exclusivity terms, and
          commercial performance metrics are not publicly disclosed
        - >-
          Partnership could represent either a meaningful distribution accelerant (supporting bull case) or a
          single-point dependency risk (triggering partner/dependency risk); its absence from all quantitative models
          creates material uncertainty
        - >-
          Request partnership revenue contribution, customer acquisition data through Google channel, and contractual
          terms (exclusivity, renewal, change-of-control provisions) from JumpCloud or Google
    claimRefs:
      - CV003
      - CV021
      - CV031
      - CV035
      - CV027
      - CV044
    notes: >-
      Diligence asks are indicative; resolution depends on access to company financial data, cap-table documents, and
      partnership agreement disclosures not available in public sources.
