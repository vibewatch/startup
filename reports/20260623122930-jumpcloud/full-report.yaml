  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape — category taxonomy and substitute mapping
        blocks:
          - type: paragraph
            body: >
              JumpCloud's competitive landscape is best understood as four overlapping categories rather than a single
              market. The first and most significant category is the bundled Microsoft incumbent: Microsoft Entra ID
              (formerly Azure Active Directory) paired with Microsoft Intune for MDM, both of which are included in
              Microsoft 365 E3 ($36/user/month) and E5 ($57/user/month) subscriptions. For organizations already paying
              for M365, Entra ID is effectively free at the point of identity decision, making it structurally the
              hardest competitor for JumpCloud to displace in Windows-centric accounts.

              The second category comprises standalone IAM specialists: Okta (the enterprise IAM market leader at $2.919
              billion in FY2026 revenue), Cisco Duo (MFA-first device trust overlay priced from $3 to $9/user/month),
              and OneLogin (acquired by One Identity in 2021 and less prominent in 2026 shortlists). These vendors are
              identity-first but lack native cross-OS device management, meaning buyers who adopt them must also
              purchase a separate MDM tool, increasing total stack cost.

              The third category is device-led alternatives: Jamf (Apple MDM at $627 million FY2024 revenue, acquired by
              Francisco Partners in October 2025) and Kandji/Iru (cloud-only Apple MDM, rebranded in late 2025). These
              vendors manage Apple devices with far deeper macOS and iOS configurability than JumpCloud, but neither
              manages Linux endpoints natively nor provides a cloud directory replacement. Jamf's acquisition of
              Identity Automation for $215 million in 2024 signals a strategic identity expansion that could threaten
              JumpCloud's differentiation in Apple-heavy accounts.

              The fourth category is HR-IT convergence bundles, led by Rippling (valued at $16.8 billion in its May 2025
              Series G, approaching $1 billion ARR in 2026). Rippling unifies HRIS, payroll, identity provisioning, and
              device management in a single employee graph, enabling zero-touch onboarding and offboarding. For
              organizations that treat IT as an extension of HR operations, Rippling's unified model is a compelling
              alternative to JumpCloud's IT-first landing motion.

              Status-quo and internal-build alternatives include: on-premises Active Directory (most common legacy
              substitute), Google Workspace Admin (for Google-centric organizations with limited MDM needs),
              ManageEngine/Zoho (on-premises IAM and MDM for budget-constrained SMBs without cloud mandates), and no
              formal identity platform at all (prevalent in sub-25 employee organizations relying on shared credentials
              or personal accounts).
