          - type: callout
            title: Financial underwriting of JumpCloud requires data-room access — no public metrics exist
            body: >-
              An investor cannot underwrite JumpCloud's unit economics, customer quality, or capital efficiency from
              public sources alone. Net revenue retention, gross dollar retention, paying-customer count (last updated
              October 2021), burn rate, runway, and cohort-level churn are all undisclosed. The last disclosed ARR
              estimate is from Sacra's 2023 research ($105 million, 31% YoY growth); no 2024 or 2025 figures exist in
              any public database. The 2021 valuation of $2.625 billion — set at a 46.5x ARR multiple — creates an
              overhang that requires either demonstrating sustained high growth or accepting a mark-down at a future
              liquidity event. Any investment decision must be conditioned on full financial data-room disclosure,
              including NRR by cohort and segment, before commitment.
            calloutType: risk
