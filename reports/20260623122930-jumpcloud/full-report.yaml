      - number: '6.5'
        title: MSP/partner channel, expansion dynamics, and concentration risks
        blocks:
          - type: paragraph
            body: >
              JumpCloud's MSP channel is structurally central to its growth. The company operates a four-tier partner
              program for MSPs and VARs, offering escalating discounts, co-marketing access, early feature previews, and
              dedicated technical support as partners advance through tiers. The multi-tenant portal allows MSPs to
              manage all client environments from a single interface without multiple logins, integrating with existing
              MSP tooling for billing and workflows. Antoine Jebara (co-founder and General Manager of Channels &
              Alliances) leads this business, and JumpCloud's MSP page states that 78% of MSPs say open integration
              capabilities help drive bottom-line profits, and that MSPs evolving into strategic partners can see client
              lifetime value increase by up to 40% over three years.

              The most significant 2026 channel development was JumpCloud's acquisition of MacSolution, its largest MSP
              partner in the Americas, headquartered in São Paulo, Brazil. This was JumpCloud's second acquisition in
              Brazil after identity security firm VaultOne and positions São Paulo as a new strategic hub, with CRN
              quoting Jebara saying Brazil is "one of our fastest-growing regions." MacSolution's expertise in
              large-scale enterprise migrations from legacy AD and fragmented identity stacks is now available directly
              to JumpCloud's global customer and partner base. The 2026 Partner Awards spanned six geographic tiers
              (AMER, EMEA, APAC India, APAC ASEAN/ANZ, and sub-regions), with Partner of the Year MSP going to Macktez
              (AMER) and Totality Services (EMEA), signaling active partner investment globally.

              The land-and-expand motion is well evidenced: the 10-user free tier triggers natural module expansion
              conversations as organizations grow, and MSP case studies document steady upsell from core identity to
              Platform Prime (which bundles MDM, SaaS Management, PAM, and Conditional Access). Concentration risks are
              less well documented. JumpCloud does not disclose top-customer revenue concentration, MSP-channel ARR as a
              percentage of total, or the ARR attributable to its largest partners. The MacSolution acquisition signals
              that at least one partner relationship was substantial enough to acquire, creating a question about
              revenue dependency on top MSP partners. Geographic concentration risk exists to the extent that AMER
              currently dominates the disclosed partner network, though the MacSolution acquisition and six-region
              partner award structure indicate active LATAM and APAC expansion.
