      - number: '5.5'
        title: Security posture, compliance certifications, reliability, and product gaps
        blocks:
          - type: paragraph
            body: >
              JumpCloud's published security commitments include SOC 2 Type 2 examination (available to customers and
              prospects under a signed non-disclosure agreement upon request to accounts@jumpcloud.com) and ISO 27001
              certification achieved in November 2024, issued by certification body Schellman and Company. The ISO 27001
              scope covers JumpCloud's open directory platform and encompasses risk assessment, security controls,
              governance policies, and continuous improvement commitments. JumpCloud's CISO, Robert Phan, noted in the
              November 2024 press release that the certification "solidifies JumpCloud's position as a trusted provider
              of identity, access, and device management." All data in transit is encrypted with TLS 1.2 or higher
              across LDAP, RADIUS, SAML, and agent communication channels, and all databases are protected with
              encryption at rest. The development process incorporates SAST and DAST tools in the build pipeline, an
              SSDLC change-control process, and a public Vulnerability Disclosure Program for responsible disclosure by
              security researchers.

              JumpCloud's Conditional Access product page states support for achieving compliance with SOC 2, HIPAA,
              GDPR, PCI, and the EU AI Act, positioning the platform as a compliance enablement tool rather than a
              regulated-entity itself. The absence of FedRAMP authorization is a material gap: US federal agencies and
              regulated government contractors require FedRAMP- authorized vendors, and JumpCloud is not currently
              listed on the FedRAMP Marketplace. PeerSpot user reviews confirm this was cited as a reason for migration
              away from JumpCloud in government-adjacent organizations. Similarly, JumpCloud does not offer full
              Identity Governance and Administration (IGA) capabilities such as access certifications or Segregation of
              Duties (SoD) enforcement—features available in Sailpoint, Saviynt, or Okta's Identity Governance
              add-on—which limits its addressable market in enterprises with mature compliance requirements. On
              reliability, IsDown's monitoring of JumpCloud's 13 service components since April 2020 records 300
              incidents over six years, averaging approximately 4.1 per month with a median resolution time of 154
              minutes. The March 12, 2026 five-hour Agent backend incident was the most significant recent event;
              JumpCloud disclosed that local logins continued to function but policy synchronization, command execution,
              and certain MFA scenarios beyond TOTP were disrupted. G2 Spring 2026 recognized JumpCloud as leader in 150
              Grid® reports across MDM, IAM, SSO, PAM, GRC, and Cloud Directory categories on the basis of 4,000+
              verified user reviews.
