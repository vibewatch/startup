            title: Free-to-paid conversion funnel creates implicit monetization leverage at scale
            body: >-
              JumpCloud's free tier serves a dual purpose: generating pipeline at near-zero acquisition cost for
              PLG-driven conversions and creating organizational lock-in before monetization begins. The hard 10-user
              and 10-device cap means that every growing SMB eventually hits an automatic conversion trigger embedded in
