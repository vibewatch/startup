          - type: callout
            title: FedRAMP absence permanently excludes a structurally large and high-ASP market segment
            body: >-
              JumpCloud's absence from the FedRAMP Marketplace is not a near-term sprint item — it is a multi-year
              authorization process that requires a third-party assessment organization engagement, a federal agency or
              JABS sponsor, and a dedicated compliance engineering investment. Until authorization is obtained,
              JumpCloud cannot sell to US federal agencies, and its CMMC positioning for defense-industrial-base
              contractors is limited to basic workflow support without platform certification. The US federal identity
              management market is not merely large in absolute terms; it represents a structurally high-ASP segment
              where platform switching costs are maximal and churn is minimal — exactly the customer profile that would
              most improve JumpCloud's financial quality metrics. The investor thesis must either account for the TAM
              exclusion or fund the authorization process as a capital use.
