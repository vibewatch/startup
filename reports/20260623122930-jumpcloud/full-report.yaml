  - id: FE001
    title: JumpCloud Open Directory Platform — product architecture stack
    type: stack
    layout: standard
    summary: >-
      JumpCloud's platform is organized as five layers delivered through a single cloud-native agent, from AI and SaaS
      governance at the top to the platform infrastructure at the base.
    data:
      layers:
        - label: AI & SaaS Governance
          detail: >-
            Shadow AI Governance, SaaS App Discovery, SaaS Spend Optimization, SaaS Access Control, SaaS Security
            Insights — agentless SaaS discovery layered on top of the identity and device control plane.
        - label: Agentic IAM (Launched April 2026)
          detail: >-
            AI Discovery & Directory, AI Gateway (OIDC, MCP, A2A), AI Device Trust, Human-in-the-Loop governance,
            centralized kill switch for AI agent lifecycle. Hosted on Google Cloud; optimized for Gemini Enterprise.
        - label: Identity & Access Management
          detail: >-
            Cloud Directory (LDAP/RADIUS), SSO (SAML 2.0/OIDC — 900+ connectors), MFA
            (TOTP/push/FIDO2/WebAuthn/JumpCloud GO), Conditional Access, Cloud LDAP, Cloud RADIUS, PAM, Password
            Manager, Access Request, Directory Insights API.
        - label: Device Management
          detail: >-
            Unified Endpoint Management across Windows, macOS, Linux, iOS/iPadOS, Android. Patch Management (Apple DDM,
            Windows KB, Ubuntu Linux, Chrome). System Insights, Remote Access, Asset Management.
        - label: Platform Infrastructure
          detail: >-
            Cloud-native SaaS (no on-premises server). JumpCloud Agent on endpoints (TLS 1.2+ channel). REST APIs v1/v2.
            Google Cloud hosting for AI Gateway. Cloudflare CDN/WAF. Multi-region HA with US and EU endpoints.
    approximationNotes: >-
      Layer boundaries are based on JumpCloud's official platform taxonomy as of June 2026. The Agentic IAM layer is
      separated to reflect its 2026 launch status and ongoing rollout.
