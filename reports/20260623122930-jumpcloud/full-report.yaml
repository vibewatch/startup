  - id: FM001
    title: JumpCloud market boundary — product surface vs. analyst category
    type: flow
    layout: standard
    summary: >-
      JumpCloud's platform spans three separately sized analyst categories — IAM, UEM, and ZTNA — creating a combined
      addressable surface larger than any single published TAM.
    data:
      nodes:
        - id: iam-core
          label: Identity and Access Management (IAM)
          detail: >-
            $26.2B (GVR, 2026); cloud sub-segment $10.91B (Mordor, 2026). Core product surface: directory, SSO, MFA,
            PAM, IGA, provisioning.
          tone: positive
        - id: uem-adjacent
          label: Unified Endpoint Management (UEM)
          detail: >-
            $8.85B (Mordor, 2026); 25.74% CAGR through 2031. Direct product surface: cross-OS MDM, patch management,
            device trust policies.
          tone: positive
        - id: ztna-adjacency
          label: Zero Trust Network Access (ZTNA)
          detail: >-
            $47.45B (Mordor, 2026); 18.20% CAGR. Strategic adjacency: JumpCloud enforces ZT principles via conditional
            access and device trust but does not sell a ZTNA gateway.
          tone: neutral
        - id: agentic-nascent
          label: Agentic / non-human identity (nascent)
          detail: >-
            No analyst sizing; launched April 2026 as JumpCloud Agentic IAM. TAM expands proportionally to AI agent
            deployments per customer.
          tone: neutral
        - id: jumpcloud-platform
          label: JumpCloud unified platform
          detail: Spans IAM + UEM surface; ZTNA adjacent; Agentic IAM nascent. Cloud-native, OS-agnostic, per-user SaaS model.
          tone: positive
      edges:
        - from: iam-core
          to: jumpcloud-platform
        - from: uem-adjacent
          to: jumpcloud-platform
        - from: ztna-adjacency
          to: jumpcloud-platform
        - from: agentic-nascent
          to: jumpcloud-platform
