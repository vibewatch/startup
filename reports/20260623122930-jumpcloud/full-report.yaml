      - number: '5.2'
        title: Identity, access, and authentication modules in customer workflow terms
        blocks:
          - type: paragraph
            body: >
              In customer workflow terms, JumpCloud's IAM and access modules address the employee lifecycle from hire to
              retire. When a new employee joins an organization, the HRIS Integration module can automatically trigger
              provisioning in JumpCloud via SCIM 2.0 or native connectors to systems such as Workday, BambooHR,
              Rippling, and others. JumpCloud creates a canonical user identity in the Cloud Directory, assigns the user
              to relevant groups based on job-function attributes, and provisions access to connected SAML and OIDC
              applications automatically—without manual IT intervention for each SaaS tool.

              The SSO module provides SAML 2.0 and OpenID Connect (OIDC) federation to more than 900 pre-configured
              application connectors maintained in JumpCloud's Application Catalog. Users authenticate once through the
              JumpCloud User Portal and receive frictionless access to all entitled applications. The SSO layer is
              tightly integrated with MFA: JumpCloud supports TOTP, push-based authentication via the JumpCloud Protect
              free authenticator app, FIDO2/ WebAuthn hardware keys, the proprietary JumpCloud GO passwordless method
              (hardware-protected and phishing-resistant), and biometric authentication. Risk-based conditional access
              policies adjust MFA enforcement dynamically based on device health, network context, and user risk
              signals—including integration with Google Chrome Enterprise for browser-based policy enforcement on
              unmanaged devices.

              Cloud LDAP provides standards-compliant LDAPS and STARTTLS connectivity for on-premises applications,
              firewalls, and services that require legacy LDAP directory lookups against cloud-hosted identity. Cloud
              RADIUS enables PEAP-MSCHAPv2 authentication for Wi-Fi networks and VPN concentrators (Cisco Meraki,
              Ubiquiti UniFi, Fortinet FortiGate, and others), allowing network access control to be bound to the same
              JumpCloud identity as SSO and device management. Privileged Access Management provides a browser-based
              secure gateway with session recording, real-time monitoring, and immutable audit logs for privileged
              access to servers and critical infrastructure without requiring a VPN. The Directory Insights API exposes
              structured event logs for authentication events across SSO, LDAP, RADIUS, and agent sessions, enabling
              SIEM integration and compliance audit trails.
