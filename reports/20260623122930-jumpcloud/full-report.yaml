  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >
      Investment committee-ready scoring across market opportunity, product proof, competitive moat, financial
      economics, valuation, risk profile, and evidence quality for JumpCloud as of June 23, 2026.
    data:
      items:
        - label: Market Opportunity
          value: 7
          max: 10
          note: >-
            IAM TAM $25–30B+ growing 12–15% CAGR; cloud identity transformation secular; Agentic IAM extends addressable
            market.
        - label: Product Proof
          value: 6
          max: 10
          note: >-
            250K+ orgs served; G2 Leader status; Google Workspace partnership confirmed; Agentic IAM launched 2026.
            Strong adoption signal; enterprise scalability unconfirmed.
        - label: Competitive Moat
          value: 5
          max: 10
          note: >-
            OS-agnostic cloud directory is differentiated vs. Active Directory; but Microsoft Entra ID commands 85%+
            large enterprise; moat is SMB-only and narrowing.
        - label: Financial Economics
          value: 3
          max: 10
          note: >-
            Est. $200M ARR (2024, Latka); ~$172K revenue/employee; zero confirmed NRR, gross margin, or EBITDA. Capital
            structure opaque after 56-month no-raise gap.
        - label: Valuation
          value: 2
          max: 10
          note: >-
            Base-case EV ~$1.2B at 6x ARR is 54% below $2.625B anchor. No path to $2.625B under any analytically
            defensible 2026 multiple. Deeply unattractive at 2021 price.
        - label: Risk Profile
          value: 3
          max: 10
          note: >-
            High: valuation overhang, financial opacity, no secondary-market signal, preference stack, SaaS multiple
            decade lows, Microsoft competitive pressure.
        - label: Evidence Quality
          value: 4
          max: 10
          note: >-
            No audited financials, no confirmed ARR, no secondary market price. Entire analysis rests on third-party ARR
            estimates and public-comp extrapolation.
