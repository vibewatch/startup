          - type: callout
            title: Microsoft bundling is a structural pricing headwind — not a feature gap to close
            body: >-
              The competitive threat from Microsoft Entra ID is not primarily about feature parity or brand recognition
              — it is about pricing architecture. Entra ID ships in Microsoft 365 E3 and E5 at zero marginal cost for
              organizations already paying for Microsoft productivity software. JumpCloud cannot price-compete with a $0
              alternative; its only viable response is to hold the cross-platform and non-Windows segments where
              Microsoft's Windows-centric stack is genuinely weaker. The Ramp Rate 2 pp YoY decline in IDP adoption
              share (to 14%) and PeerSpot's ranking of JumpCloud eleventh vs. Entra ID first are early signals of
              erosion at the Microsoft-adjacent boundary. As Microsoft expands Entra ID coverage to macOS and Linux
              endpoints, JumpCloud's cross-platform differentiation moat narrows further.
            calloutType: risk
            claimRefs:
              - CR011
