      JumpCloud's public history runs from a Colorado seed in 2012 through unicorn status in 2021, five platform
      acquisitions, a disclosed security breach in 2023, and the 2026 Agentic IAM launch. The trajectory is one of
      consistent capital access and deliberate platform expansion into adjacent identity and security categories.
