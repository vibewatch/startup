      - number: '4.2'
        title: Funding history, capital structure, and capital adequacy
        blocks:
          - type: paragraph
            body: >
              JumpCloud's capital structure reflects a staged sequence of venture and growth-equity financing events
              detailed in the Company Overview chapter; this section focuses on the forward capital adequacy assessment
              relevant to underwriting. The material anchor facts are: the company confirmed over $400 million in total
              equity capital raised; the most recent publicly announced round was the $225 million Series F completed in
              two tranches—an initial $159 million in September 2021 at a $2.56 billion post-money valuation and a $66
              million extension in October 2021 at $2.625 billion, led by Sapphire Ventures with participation from
              Atlassian Ventures, CrowdStrike Falcon Fund, NTT Docomo Ventures, Owl Rock, Whale Rock Capital, Sands
              Capital, and Endeavor Catalyst, alongside existing investors General Atlantic, BlackRock, and H.I.G.
              Growth Partners. General Atlantic has been an investor since the $50 million Series D in May 2019. The
              sole disclosed debt instrument is a $10 million conventional debt round from Comerica in September 2018;
              no subsequent credit facility, convertible note, or debt financing has been identified in public sources.


              No new equity round has been publicly announced since October 2021, a gap of approximately 56 months to
              the June 2026 run date. At the time of the Series F, Sacra estimated JumpCloud's trailing ARR at
              approximately $55 million, implying a financing multiple of approximately 46.5 times ARR. At the
              third-party estimated 2024 ARR of $200 million, the same $2.625 billion valuation implies approximately 13
              times ARR. The SaaS Capital Index as of early 2025 registered a median public SaaS ARR multiple of 7.0
              times, down approximately 60% from its 2021 peak, and SaaS Capital's model predicts a 5.3 times multiple
              for private equity-backed companies under 2025 market conditions. These benchmarks indicate material
              compression in the implied financing multiple relative to the 2021 Series F anchor. Cash on hand, monthly
              burn rate, and runway are not publicly disclosed; no large-scale layoffs, financial distress signals, or
              public credit events have been identified through June 2026. The company added headcount through at least
              early 2026 per Revelio Labs workforce analytics, which is consistent with continued operational investment
              rather than cost-driven contraction.
