companyProfile:
  summary: >-
    JumpCloud is a Louisville, Colorado-based cloud-native identity and IT management company operating the first open,
    cloud-based directory platform built to replace legacy Microsoft Active Directory for modern distributed
    organizations. Founded in 2012 and formally launched at TechCrunch Disrupt Battlefield in September 2013, JumpCloud
    reached unicorn status in October 2021 with a $2.625 billion valuation following a $225 million Series F led by
    Sapphire Ventures. As of June 2026 the company serves over 250,000 organizations across 160+ countries, reports
    $400M+ in total capital raised, and third-party analysts estimate approximately $200 million in annual recurring
    revenue for 2024. The company is evolving from a cloud directory for human users into an AI-powered unified IT
    management platform governing both human and agentic identities, with the April 2026 Agentic IAM launch and the
    Google Workspace partnership as key strategic growth drivers.
