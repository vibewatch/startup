      - number: '4.3'
        title: Cost structure, gross margin, and unit economics
        blocks:
          - type: paragraph
            body: >
              JumpCloud's cost structure follows a cloud-native SaaS pattern. Estimated cost of goods sold (COGS)
              includes multi-tenant cloud infrastructure hosting the directory, endpoint management processing, and MDM
              agent workloads; customer support and customer success personnel; and third-party protocol and integration
              license fees. Operating expenses above the gross profit line include R&D for platform and agentic IAM
              development, S&M for customer acquisition and expansion, and G&A. JumpCloud has never publicly disclosed a
              gross margin figure, income statement, or COGS breakdown. Market observers and competitive analysis
              suggest an estimated gross margin in the 65–75% range, moderately below the identity-pure- play benchmark.
              For comparison, Okta's fiscal year 2026 results showed a subscription gross margin of approximately
              77–79%, reflecting the higher infrastructure efficiency of a single-focus identity SaaS platform.
              JumpCloud's device management workloads (cross-OS MDM, endpoint patching, system insights) imply
              materially higher infrastructure COGS than identity-only peers, supporting the lower end of the gross
              margin estimate range.


              On unit economics, Vendr's anonymized transaction dataset reports a typical median annual contract value
              for JumpCloud mid-market deployments of approximately $39,000 per year. Volume discounts of 10–25% are
              common for organizations with 100 or more users, and multi-year contracts (two to three years) unlock
              incremental discounts of 10–20%. Vendr also notes that JumpCloud's fiscal year ends in January, making Q4
              (October–December) a favorable negotiation window due to end-of-quarter quota pressure. At an estimated
              headcount of approximately 1,165 employees (Revelio Labs, December 2025) and an estimated $200 million
              ARR, the implied revenue per employee is approximately $172,000—a reasonable but unverified proxy for
              operating leverage. The Benchmarkit 2024 SaaS Performance Metrics study found a median new customer CAC
              ratio of $1.76 across approximately 1,000 B2B SaaS companies. JumpCloud's own CAC and payback period are
              not publicly disclosed. An ESG/TechTarget economic validation commissioned by JumpCloud (May 2023) found
              that customers reported cost reductions of 40–60% compared to prior identity and access management
              infrastructure; this figure reflects customer-reported savings, not JumpCloud's own margin structure.
