      - number: '3.3'
        title: Feature, capability, and pricing comparison
        blocks:
          - type: paragraph
            body: >
              The most structurally important capability differentiator for JumpCloud is native cross-OS device
              management that spans Windows, macOS, Linux, iOS, and Android from a single console. Microsoft Intune
              provides comprehensive Windows and macOS management but its Linux support as of June 2026 is restricted to
              device compliance enrollment and conditional access policy enforcement without the full policy management,
              patch management, script execution, or app deployment that JumpCloud delivers for Linux endpoints. This
              Linux parity gap is JumpCloud's primary win condition against the Microsoft bundled stack.

              JumpCloud's published 2026 pricing is structured as: Device Management ($9/user/month annual, cross-OS
              MDM, patch management, remote management), SSO ($11/user/month annual, unlimited SSO apps, MFA, password
              manager), and Device Identity Management ($13/user/month annual, combined cloud directory with MDM and
              conditional access). A free tier covers 10 users and 10 devices. Microsoft Entra ID P1 is priced at
              $6/user/month and P2 at $9/user/month as standalone subscriptions, but is effectively zero incremental
              cost for organizations already on M365 E3 or E5. Microsoft Intune as a standalone product is approximately
              $8/user/month, or included in M365 Business Premium ($22/user/month). For a pure Windows shop on M365 E3
              with Intune, the identity-plus-device combination costs $36/user/month all-in, compared to JumpCloud's
              Device Identity Management at $13/user/month, though JumpCloud is not interchangeable for organizations
              dependent on Azure AD Connect, hybrid join, or deep Microsoft 365 security tooling.

              Okta's pricing is modular, starting at approximately $2/user/month for basic SSO (Okta Workforce Identity
              Standard) and reaching $17+/user/month for the full platform including Lifecycle Management and Identity
              Governance. According to Costbench data, the median actual annual spend for a 25-seat Okta implementation
              is approximately $1,800/year, compared to approximately $1,000/year for JumpCloud. Okta's 7,500+ pre-built
              SaaS integrations give it a decisive advantage for enterprises with complex SaaS portfolios or those
              needing granular lifecycle automation at scale.

              G2 feature ratings (sourced from Wayback Machine snapshots of G2 comparison pages, which reflect
              accumulated review data through mid-2025) show JumpCloud scoring highest on Ease of Use (9.0) and MFA
              (9.1), while Microsoft Entra ID leads on Role Management (9.2), Centralized Management (9.3), and Approval
              Workflows (9.0). Against Okta, JumpCloud trails on SSO integration (9.1 vs 9.6), MFA breadth (9.1 vs 9.6),
              and automated provisioning (8.7 vs 9.5). JumpCloud's Directory Insights reporting has been criticized by
              independent reviewers for limited filtering, custom query support, and alert creation capabilities, which
              constrains its appeal for security operations teams requiring advanced audit trails. JumpCloud also lacks
              a dedicated self-service password reset portal, increasing IT helpdesk workload relative to Microsoft
              Entra ID.
