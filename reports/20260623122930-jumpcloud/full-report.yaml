  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform architecture, delivery model, and module taxonomy
        blocks:
          - type: paragraph
            body: >
              JumpCloud is delivered exclusively as a multi-tenant SaaS with no on-premises server component. The core
              architectural pattern is an agent-based model: a lightweight software agent is installed on every managed
              endpoint—Windows, macOS, Linux, iOS/iPadOS, and Android—and maintains an encrypted channel to JumpCloud's
              cloud control plane. This agent model is what enables the platform to enforce device trust, execute policy
              changes, push patches, run administrative scripts, and authenticate users even in environments with
              heterogeneous operating systems and no common directory substrate. The admin console, served as a web
              application, provides a single pane of glass across all managed devices, users, groups, and policies.

              JumpCloud's public platform taxonomy organizes capabilities into five pillars. Identity Management covers
              the Cloud Directory (cloud-hosted LDAP/RADIUS replacement), Identity Lifecycle Management with SCIM, HRIS
              Integration, and the 2026-launched Agentic IAM for AI agent governance. Access Management covers Single
              Sign-On (SAML 2.0, OIDC, 900+ pre-built connectors), Cloud LDAP, Cloud RADIUS, Multi-Factor Authentication
              (TOTP, push, FIDO2/WebAuthn, JumpCloud GO, biometrics), Privileged Access Management, Conditional Access,
              Directory Insights event log API, Password Manager, and Access Request. Device Management covers Unified
              Endpoint Management, Patch Management (including Apple Declarative Device Management), System Insights,
              Remote Access, Windows Management, Apple MDM, Linux Management, Android EMM, and Asset Management. AI and
              SaaS Management covers Shadow AI Governance, SaaS Discovery, SaaS Spend Optimization, and SaaS Security
              Insights. The platform exposes RESTful APIs (v1 and v2) and a Directory Insights API for external SIEM and
              compliance workflow integration. JumpCloud's status page monitors 13 distinct service components,
              including the Admin Console, Agent, AI Gateway, Android EMM, Apple MDM, Federation, G Suite Integration,
              LDAP, RADIUS, and Groups, across US and EU regional deployments.
