      - CR008
      - CR011
      - CR017
      - CR019
      - CR026
      - CR034
  - id: FR003
    title: Dependency Map
    type: dag
    layout: standard
    summary: >-
      Network view of the critical external nodes — infrastructure providers, channel partners, competitive ecosystem,
      regulatory authorities, and organizational principals — that JumpCloud must coordinate to sustain platform
      reliability, growth, and compliance.
    data:
      nodes:
        - id: platform
          label: JumpCloud SaaS Control Plane
          detail: >-
            Multi-tenant identity and device management platform serving 200K+ organizations; cloud-only delivery with
            no on-premises fallback mode.
        - id: aws
          label: AWS (IaaS Infrastructure)
          detail: >-
            All JumpCloud SaaS components hosted on AWS; no publicly confirmed multi-cloud or hybrid architecture;
            single-vendor IaaS concentration.
        - id: cloudflare
          label: Cloudflare (CDN / WAF)
          detail: >-
            CDN acceleration and DDoS/WAF protection for admin console and endpoints; June 22, 2026 outage directly
            triggered admin console degradation.
        - id: msp
          label: MSP channel partners (170+ countries)
          detail: >-
            Significant portion of ARR growth per CRN; MacSolution acquisition signals at least one material
            single-partner dependency; concentration undisclosed.
        - id: microsoft
          label: Microsoft (M365/Entra competitive ecosystem)
          detail: >-
            Bundles Entra ID at near-zero marginal cost in M365 E3/E5; secular expansion of Microsoft security features
            into base SKUs creates permanent pricing headwind.
        - id: fedramp
          label: FedRAMP authorization body (JABS/3PAO)
          detail: >-
            Authorization required for US federal procurement; JumpCloud has no in-process listing; multi-year
            engagement required to access this market.
        - id: ceo
          label: Rajat Bhargava (CEO / co-founder)
          detail: >-
            Sole founder-CEO since 2013; all strategic vision and investor relationships concentrated in one individual;
            no public succession plan.
        - id: ciso
          label: Roland Palmer (CISO)
          detail: >-
            Appointed post-2023 breach; holds FedRAMP, ISO 27001, and HIPAA credentials; security certification
            continuity depends on CISO program ownership.
        - id: customers
          label: 250,000+ organizations
          detail: >-
            250K+ total orgs across 160+ countries; last disclosed paying count 5,000+ (Oct 2021); free-to-paid ratio
            and NRR unknown.
      edges:
