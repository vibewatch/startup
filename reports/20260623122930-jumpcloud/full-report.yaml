  - id: FI001
    title: JumpCloud revenue model bridge — customer activity to ARR
    type: flow
    layout: standard
    summary: >-
      JumpCloud's revenue model flows from free-tier evaluation through a forced conversion trigger into per-user
      per-month subscription billing that accumulates as ARR, with gross profit estimated at 65–75% of collected
      recurring revenue.
    data:
      nodes:
        - id: free-signup
          label: Free tier evaluation (≤10 users / ≤10 devices)
          detail: >-
            Product-led growth entry point; $0 cost for organizations. Full platform features available to test
            identity, device, and SSO capabilities. Conversion trigger fires when the organization exceeds 10 users or
            10 devices.
          tone: neutral
        - id: conversion-trigger
          label: Forced conversion (11th user or device)
          detail: >-
            Hard cap creates an automatic monetization event. Organizations that grow beyond the free threshold must
            select a paid tier to continue. Creates near-zero sales friction for high-intent SMB customers.
          tone: positive
        - id: per-user-billing
          label: Per-user per-month subscription ($9–$13 list; contact sales for Platform)
          detail: >-
            Tiered billing at $9 (Device Mgmt), $11 (SSO), or $13 (Device Identity Mgmt) per user per month on annual
            billing. Add-on modules at ~$3–4/feature/user/mo. Enterprise Platform and Platform Prime require sales
            negotiation.
          tone: positive
        - id: arr-pool
          label: Annual Recurring Revenue pool (estimated $200M in 2024)
          detail: >-
            Accumulated contracted recurring revenue from all paying organizations. Third-party estimate $200M ARR in
            2024 (GetLatka, Nov 2025). Figure is not company-confirmed.
          tone: positive
        - id: gross-profit-estimate
          label: Gross profit (estimated 65–75% of ARR)
          detail: >-
            After cloud infrastructure, support, and third-party license COGS. Not publicly disclosed; estimated from
            peer benchmarks and competitive cost structure analysis. Okta public peer achieved 77–79% subscription gross
            margin in FY2026.
          tone: neutral
      edges:
        - from: free-signup
          to: conversion-trigger
        - from: conversion-trigger
          to: per-user-billing
        - from: per-user-billing
          to: arr-pool
        - from: arr-pool
          to: gross-profit-estimate
    approximationNotes: >-
      ARR figure is a third-party estimate (GetLatka, Nov 2025) and not company-confirmed. Gross profit estimate is
      based on analyst benchmarks and peer comparison; actual gross margin has not been disclosed by JumpCloud. All
      nodes except free-signup and conversion mechanics are estimated or inferred.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI023
      - CI024
  - id: FI002
    title: Unit economics bridge — acquisition to customer-level economics
    type: flow
    layout: standard
    summary: >-
      JumpCloud's unit economics path from customer acquisition through ACV and estimated gross margin to payback; key
      inputs (CAC, NRR, EBITDA) are not publicly disclosed and are represented as qualitative nodes with industry
      benchmarks where available.
    data:
      nodes:
        - id: customer-acquisition
          label: Customer acquisition (CAC not disclosed)
          detail: >-
            JumpCloud does not disclose CAC by channel. Free tier reduces PLG acquisition cost toward zero for organic
            conversions. Sales-assisted mid-market deals carry higher acquisition costs. Benchmarkit 2024 median CAC
            ratio across B2B SaaS: $1.76 per $1 new ARR; top quartile: $2.03.
          tone: neutral
        - id: acv
          label: Average contract value (~$39K/year mid-market, Vendr estimate)
          detail: >-
            Vendr transaction data indicates median mid-market ACV of approximately $39,000 per year. Volume discounts
            of 10–25% for 100+ user organizations. Multi-year contracts yield additional 10–20% discounts. Figure is a
            third-party estimate; not confirmed by JumpCloud.
          tone: neutral
        - id: gross-margin-node
          label: Estimated gross margin (65–75%)
          detail: >-
            Analyst estimate from peer comparison with Okta (77–79% FY2026) and competitive cost structure analysis. Not
            publicly disclosed by JumpCloud. Device management workloads imply higher COGS than identity-only peers.
          tone: neutral
        - id: gross-profit-per-customer
          label: Gross profit per customer (~$25–29K/year at $39K ACV and 65–75% margin)
          detail: >-
            Derived estimate: $39K ACV × 65–75% gross margin = approximately $25–29K gross profit per mid-market
            customer per year. All inputs are estimated; actual gross profit is unknown.
          tone: neutral
        - id: payback-period
          label: CAC payback period (not disclosed; industry reference 8–18 months)
          detail: >-
            JumpCloud's payback period is not publicly disclosed. SMB SaaS best-in-class (PLG): 8–12 months. Mid-market
            sales-assisted: 14–18 months. Payback cannot be calculated without actual CAC data.
          tone: neutral
      edges:
        - from: customer-acquisition
          to: acv
        - from: acv
          to: gross-margin-node
        - from: gross-margin-node
          to: gross-profit-per-customer
        - from: gross-profit-per-customer
          to: payback-period
    approximationNotes: >-
      All nodes except customer-acquisition are estimated or inferred from third-party benchmarks and industry data.
      JumpCloud does not publicly disclose CAC, NRR, gross margin, EBITDA, or payback period. The
      gross-profit-per-customer node is a derived estimate using estimated inputs; actual values may differ materially.
      Industry benchmarks from Benchmarkit 2024 SaaS Performance Metrics study.
    claimRefs:
