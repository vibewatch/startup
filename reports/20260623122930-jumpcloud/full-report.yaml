      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >
              The growth drivers accelerating JumpCloud's addressable market are structural and largely policy-driven,
              giving them longer durability than cyclical demand signals.

              The most binding external driver is the regulatory mandate for zero-trust architecture. U.S. Executive
              Order 14028 (May 2021) and OMB Memorandum M-22-09 require all federal executive-branch agencies to meet
              specific zero-trust security objectives. NIST SP 800-207 provides the technical architecture standard, and
              the NSA has released new Zero Trust Implementation Guidelines in 2026 expanding the guidance beyond the
              Department of Defense to the wider Defense Industrial Base and enterprise sector. These mandates have a
              spillover effect on government contractors, healthcare organizations under HIPAA, and financial services
              firms subject to SOX and GLBA — all of which must implement identity-centric access controls that map
              directly to JumpCloud's value proposition.

              The second structural driver is Active Directory displacement. Microsoft Active Directory was designed for
              on-premises, Windows-homogeneous environments; 91% of SMBs now use Microsoft 365 or Google Workspace as
              their primary productivity suite (Gartner, per Medhacloud/IDC compilation), yet many still lack a
              cloud-native identity layer to govern all OS types and third-party SaaS apps. JumpCloud's "cloud-first
              directory" use case is explicitly positioned to fill this gap for organizations that have migrated
              productivity but not identity.

              Third, SMB IT spending is growing robustly: IDC projects global SMB IT spending at $1.18 trillion in 2026,
              up 7.2%, with cybersecurity ranked the top investment priority by 72% of SMBs (Techaisle). Analysys Mason
              forecasts SMB cybersecurity spend will reach $109 billion globally by 2026, growing at a 10% CAGR from $76
              billion in 2022, with remote management security projected to exceed $45 billion — the largest and
              fastest- growing single sub-category.

              Fourth, AI agent proliferation is creating a nascent non-human identity governance market. JumpCloud's
              April 2026 Agentic IAM launch is a direct response: it reported that over half of surveyed organizations
              manage more non-human than human identities and that 72% have AI agents in production but 92% lack
              adequate controls. This segment has no mature analyst sizing but is cited in JumpCloud's own pulse
              research as a board-level demand signal.

              Adoption constraints are also meaningful. Integration complexity is the most-cited barrier: connecting a
              cloud directory to legacy on-premises applications (e.g., LDAP-dependent databases, Kerberos-authenticated
              intranet systems) requires agent deployment, firewall rule changes, and staged migration that extends
              sales cycles and increases churn risk. Microsoft Entra ID incumbency is the dominant competitive
              constraint: Azure Active Directory held 20.06% of the installed-base in the IAM category per 6sense
              competitor analysis (June 2026), and Microsoft bundles identity services into M365 E3/E5 licenses at no
              incremental per-seat cost for existing Microsoft shops, creating a price-to-zero dynamic for JumpCloud's
              SSO and directory modules. SMB budget sensitivity and the "DIY" instinct (relying on built-in OS directory
