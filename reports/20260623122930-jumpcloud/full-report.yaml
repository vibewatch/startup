      - number: '3.4'
        title: Win/loss dynamics, moat durability, and displacement risk
        blocks:
          - type: paragraph
            body: >
              JumpCloud's most consistent win pattern is the mixed-OS replacement deal: organizations running a
              combination of Windows, macOS, and Linux endpoints that need a single identity and device management
              console without the operational complexity of maintaining separate tools for each OS. In these accounts,
              the Microsoft alternative requires Intune for Windows and macOS, a separate Linux management solution (or
              Intune's limited Linux capability), and a third-party IdP if the organization is not fully Azure AD. This
              multi-tool complexity is JumpCloud's primary value-proposition opening.

              JumpCloud's most consistent loss pattern is the Microsoft M365 shop where the buyer has already
              standardized on Microsoft 365, Azure AD Sync, and Intune for Windows. In these accounts, Entra ID is
              included in the existing license, switching costs are high, and JumpCloud's incremental value is
              constrained to its Linux or Google Workspace integration strength. SelectHub's analysis (June 2026)
              confirms that Microsoft shops see diminishing marginal returns from adding JumpCloud because the Microsoft
              ecosystem ties generate less value for non-Microsoft workloads. PeerSpot's June 2026 buyer guide states
              that Microsoft Entra ID "seems to have the upper hand due to its seamless integration with Microsoft 365,
              extensive security features, and capabilities."

              Against Okta, JumpCloud wins by bundling device management at lower SMB price points, eliminating the need
              for a separate MDM product. JumpCloud loses to Okta in enterprise deals requiring advanced identity
              governance and administration, broad SaaS catalog depth (7,500+ integrations), or customer identity (via
              Okta's Auth0). JumpCloud's enterprise gap is a recognized constraint: the company's IGA capabilities are
              not yet competitive with Okta Identity Governance for organizations needing policy-based access
              certification or complex segregation-of-duties controls.

              The primary structural moat protecting JumpCloud's installed base is the agent-based directory model. The
              JumpCloud system agent manages user authentication, device policy enforcement, and access controls at the
              OS level across all managed devices. Replacing it requires re-enrolling all devices and re-federating all
              applications, creating a multi-week migration effort that represents a meaningful switching cost.
              JumpCloud's RADIUS and LDAP protocol support for legacy network infrastructure (VPN appliances, Wi-Fi
              authentication, on-premises applications) adds further switching friction for organizations with
              non-cloud-native stacks.

              The most material displacement risk is commoditization of the SSO layer by Microsoft. As Microsoft expands
              Entra ID's cross-platform and non-Windows capabilities, the incremental value JumpCloud delivers in
              Microsoft-adjacent accounts will narrow. A secondary risk is Jamf's strategic expansion into identity
              management through its Identity Automation acquisition, which could close the unified identity-plus-device
              gap in Apple-heavy enterprise accounts. Rippling's HR-IT convergence model represents a different kind of
              displacement risk: not feature-by-feature competition but organizational consolidation where IT tools are
              folded into an HR-led platform purchase.
