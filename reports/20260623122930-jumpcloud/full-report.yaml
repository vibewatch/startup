      - number: '7.3'
        title: Regulatory and compliance exposure — FedRAMP gap, GDPR, EU AI Act, India DPDP
        blocks:
          - type: paragraph
            body: >
              The regulatory and compliance risk landscape for JumpCloud encompasses four material areas ranked by
              investment relevance: FedRAMP authorization gap, GDPR and data-transfer exposure, EU AI Act uncertainty
              for Agentic IAM, and India Digital Personal Data Protection Act compliance friction.

              The most consequential regulatory gap is the absence of FedRAMP authorization. JumpCloud does not appear
              on the FedRAMP Marketplace as either authorized or in-process as of June 23, 2026. FedRAMP is a mandatory
              procurement requirement for software used by or on behalf of US federal agencies and is increasingly
              required by contractors under CMMC-adjacent guidance. JumpCloud's cloud-only, multi-tenant SaaS
              architecture on commercial cloud infrastructure means that authorization would require a full third-party
              assessment organization (3PAO) evaluation and JABS or agency-sponsor agreement — a process that typically
              requires twelve to thirty-six months and significant dedicated compliance engineering investment. The
              absence permanently excludes JumpCloud from a structurally large, high-value, and high-ASP market segment
              until authorization is obtained.

              For European deployments, JumpCloud offers a GDPR-compliant Data Processing Agreement incorporating
              Standard Contractual Clauses, with AWS and Salesforce listed as key sub-processors, and a publicly
              accessible data protection officer contact. India's DPDP Act 2023 introduces data localization and consent
              requirements; JumpCloud's India-region data center reduces but does not eliminate exposure, as JumpCloud's
              own documentation acknowledges some telemetry may route outside India. JumpCloud's April 2026 launch of
              Agentic IAM — which uses AI to automate access policy recommendations — may require risk classification
              under the EU AI Act if the product is deemed to significantly affect the rights of natural persons; no
              conformity assessment or classification determination has been published. SOC 2 Type 2 and ISO 27001
              certifications are available but provided under NDA, limiting independent verification scope.
            claimRefs:
