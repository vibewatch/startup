  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >
              JumpCloud occupies the overlap of cloud directory services, identity and access management, device
              management, and zero-trust access control. Defining its market boundary requires separating categories
              that are separately sized by analysts but are operationally unified on JumpCloud's platform.

              The core category is the Identity and Access Management (IAM) market, which encompasses authentication,
              access provisioning, single sign-on (SSO), multi-factor authentication (MFA), privileged access management
              (PAM), identity governance and administration (IGA), and directory services. This is the most widely cited
              category for JumpCloud sizing purposes and represents both human-user identity (workforce IAM) and, as of
              April 2026, non-human/agentic identity (JumpCloud's Agentic IAM). Cloud IAM is a growing subset: Mordor
              Intelligence estimated the cloud-specific IAM software market at $10.91 billion in 2026, growing at a
              19.52% CAGR through 2031.

              The adjacent Unified Endpoint Management (UEM) category — cross-platform device lifecycle control
              including MDM, patch management, configuration enforcement, and remote wipe — is a second direct product
              surface for JumpCloud. Mordor Intelligence pegs this at $8.85 billion in 2026. It is not always included
              in IAM market sizing, creating ambiguity in published TAM figures. JumpCloud's product explicitly spans
              both.

              The Zero Trust Network Access (ZTNA) market, sized at $47.45 billion by Mordor Intelligence in 2026,
              represents a strategic adjacency: JumpCloud implements zero-trust principles through conditional access
              policies, device trust, and hardware-bound passwordless authentication (JumpCloud Go™), but does not offer
              network-level ZTNA gateways or SD-WAN overlay products. ZTNA is a demand driver rather than a direct TAM
              for JumpCloud unless the company makes a network-layer product move.

              Status-quo substitutes that buyers use instead of JumpCloud include: on-premises Microsoft Active
              Directory with Azure AD Connect (the dominant incumbent for organizations with existing Windows
              infrastructure); Microsoft Entra ID as a cloud overlay for AD; Google Workspace admin console for
              Google-centric organizations; best-of-breed point tools (e.g., Okta for SSO, Jamf for Apple MDM,
              ManageEngine for on-prem IAM); and no formal directory at all (common in organizations under 25 employees
              relying on shared credentials or personal accounts). MSP-managed services reselling any of the above
              represent a parallel channel path rather than a competing product.
