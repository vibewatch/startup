  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing history, valuation anchor, and capital gap analysis
        blocks:
          - type: paragraph
            body: >
              JumpCloud's capital formation history culminates in its October 2021 Series F, the only publicly disclosed
              primary financing event since the $50M Series D in May 2019. The Series F closed in two tranches: a $159M
              initial close in September 2021 at a $2.56 billion post-money valuation, followed by a $66M extension in
              October 2021 that set the final $2.625 billion mark. The round was led by Sapphire Ventures at $5.99 per
              preferred share, with participation from Atlassian Ventures, CrowdStrike Falcon Fund, NTT Docomo Ventures,
              Owl Rock, Whale Rock Capital, Sands Capital, BlackRock, General Atlantic, and H.I.G. Growth Partners.
              Total disclosed funding across all rounds reaches approximately $408–418M, depending on the aggregator,
              across nine to twelve rounds since the 2012 founding. At the time of the Series F close, Sacra estimated
              JumpCloud's trailing ARR at approximately $55 million, implying a financing multiple of approximately 46.5
              times ARR — reflecting peak-ZIRP enthusiasm for cloud-native identity management in the final quarter of
              the 2021 venture cycle.


              As of the June 23, 2026 run date, no new primary equity round has been publicly announced, creating a
              funding gap of approximately 56 months. This gap is ambiguous: it could indicate meaningful capital
              efficiency, organic cash generation approaching profitability, deliberate patience ahead of a better IPO
              window, or difficulty accessing new capital on acceptable terms given the dramatic compression in SaaS
              multiples since 2021. No S-1 or equivalent IPO filing has appeared in SEC EDGAR, and Forge Global's
              pre-IPO platform shows "Limited" secondary market activity with no matched price for JumpCloud shares as
              of June 2026. The complete absence of secondary-market price signals makes it impossible to triangulate a
              current mark against the 2021 anchor the way one can for companies like Anthropic or Databricks with
              active Forge markets. JumpCloud's Forge COI data does reveal the Series E-1 preferred shares were issued
              at $1.82 per share (January 2021, implied valuation $695.73M), and Series D shares at $0.72 per share
              ($231.11M valuation), providing a historical anchor that shows the dramatic multiple expansion leading
              into the Series F and the scale of compression implied by any mark-to-market today.


              The SaaS Capital Index, the most closely tracked benchmark for public SaaS ARR multiples, stood at 7.0
              times as of early 2025, down approximately 60% from its 2021 peak. SaaS Capital's proprietary model
              applied to private equity-backed companies predicted a 5.3 times ARR multiple under 2025 market
              conditions. By Q1 2026, the SCI had fallen to decade-plus lows as markets aggressively priced AI as an
              existential threat to the SaaS business model. These benchmarks frame the severity of the valuation
              overhang: the $2.625B Series F anchor, however legitimate at the time of issuance, is deeply inconsistent
              with any market-observable comparable as of the report date.
