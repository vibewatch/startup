          high: 5250
    approximationNotes: >
      Bear/base/bull EV ranges are scenario-based constructs using ARR estimates and market multiples as of June 2026.
      Series F break-even and return figures assume full $225M Series F is invested at $2.625B; actual per-share returns
      require full cap-table waterfall analysis including all preference classes, dividends, anti-dilution provisions,
      and any debt instruments. A 2x return for Series F investors at institutional hurdle rates requires an exit at
      approximately $5.25B, implying ~$525M ARR at 10x — not supportable in any near-term scenario.
