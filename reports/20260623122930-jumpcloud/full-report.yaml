  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and operating model
        blocks:
          - type: paragraph
            body: >
              JumpCloud is an American enterprise software company headquartered in Louisville, Colorado. The company
              was formally launched at TechCrunch Disrupt Battlefield in September 2013 with an automated server
              management tool as its initial product. Since then JumpCloud has repositioned itself as the AI-powered
              unified IT management platform that consolidates identity, device, and access management into a single
              control plane designed to serve organizations managing both human employees and autonomous AI agents. The
              company's own website characterizes its origin as a direct response to the limitations of Microsoft Active
              Directory in cloud-first, remote-work, and heterogeneous-device environments.


              JumpCloud's current operating stage is late private-growth: the last publicly disclosed equity round is
              the October 2021 Series F at a $2.625 billion post-money valuation, and no subsequent equity round has
              been publicly announced as of the June 2026 run date. The company operates on a subscription SaaS model
              with per-user per-month pricing; third-party analysts estimate the base offering at approximately $9 to
              $20 per user per month with add-on modules available at incremental per-feature rates. JumpCloud targets
              small and mid-sized enterprises with heterogeneous IT environments as its primary buyer segment, though
              leadership language in 2025 and 2026 press releases suggests active upmarket movement. The company states
              it serves 250,000+ organizations across 160+ countries, making it one of the broadest-reach identity
              management platforms in its valuation tier.
