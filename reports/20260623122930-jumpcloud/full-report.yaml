  - id: FE004
    title: JumpCloud product capability maturity — module strength, maturity level, competitive position, and gap
    type: matrix
    layout: standard
    summary: >-
      JumpCloud is strongest in cross-OS device management and SSO/IAM for SMB/mid-market; Agentic IAM is a first-mover
      with early-stage maturity; FedRAMP and full IGA remain structural gaps.
    data:
      columns:
        - Maturity Level
        - Competitive Strength
        - Key Gap
      rows:
        - label: Cloud Directory (LDAP/RADIUS)
          values:
            - High
            - Strong — vendor-agnostic cross-OS directory with no on-prem server
            - No access certifications or SoD; no self-hosted option
        - label: SSO (SAML 2.0 / OIDC)
          values:
            - High
            - Strong — 900+ connectors; native MFA and conditional access integration
            - Advanced OAuth 2.0 profiles (PAR/DPoP/mTLS) unconfirmed; no CIAM
        - label: MFA / JumpCloud GO
          values:
            - High
            - Strong — hardware-protected passwordless; free authenticator app
            - MFA push disrupted during agent outage; biometric depth limited vs enterprise IdPs
        - label: Cross-OS UEM / MDM
          values:
            - High
            - Strongest in market — only vendor with Win+Mac+Linux+iOS+Android in one agent
            - Ubuntu-only Linux patch; Jamf deeper on Apple; no on-premises MDM option
        - label: Patch Management
          values:
            - High
            - Strong — Apple DDM native; Windows KB granular dashboard
            - Linux limited to Ubuntu; no ChromeOS OS-level patching
        - label: Privileged Access Management
          values:
            - Medium
            - Growing — browser gateway with session recording; no VPN needed
            - Less mature than CyberArk/BeyondTrust for enterprise PAM use cases
        - label: Agentic IAM (AI Agent Governance)
          values:
            - Early / Rolling out 2026
            - First-mover — unified control plane for human + AI agent identity
            - Core features GA; A2A trust and managed connectors still in development
        - label: FedRAMP / US Public Sector
          values:
            - Not authorized
            - Gap — not listed on FedRAMP Marketplace as of 2026
            - Material blocker for US federal and DoD-adjacent customers
    approximationNotes: >-
      Maturity levels are analyst-assessed from official product pages, user reviews, and competitive analysis. "High"
