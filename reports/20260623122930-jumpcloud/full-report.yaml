      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Five-year valuation gap and SaaS multiple compression create a material mark-to-market risk
            body: >-
              The $2.625 billion Series F valuation from October 2021 was established at approximately 46.5 times
              estimated trailing ARR—a multiple reflecting peak 2021 SaaS market conditions. SaaS Capital reports the
              median public SaaS ARR multiple fell to 7.0 times by early 2025, down roughly 60% from the 2021 peak; the
              predicted multiple for private equity-backed companies is 5.3 times. Applying a 5.3 times multiple to the
              estimated $200M 2024 ARR would imply a hypothetical mark-to-market valuation of approximately $1.06
              billion—roughly 60% below the 2021 anchor. Without a refreshed equity round, independent third-party
              valuation, or disclosed cash flow data, the 2021 $2.625 billion figure is not a reliable current value
              reference. Any investment decision, secondary transaction, or M&A process must derive a current-market
              valuation using updated growth rate, NRR, margin, and profitability inputs.
