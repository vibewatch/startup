  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >
      Chain from market opportunity, product proof, financial signals, competitive risks, and valuation anchor through
      the Q1 2026 multiple compression context to the Hold/Watch recommendation for JumpCloud.
    data:
      nodes:
        - id: market-proof
          label: >-
            Market & Proof: IAM TAM $25–30B+ growing 12–15% CAGR; 250K+ orgs served; PLG model with validated
            product-market fit in SMB/mid-market
        - id: product-moat
          label: >-
            Product & Moat: Cloud-native, OS-agnostic directory with Google partnership and Agentic IAM initiative; but
            Microsoft Entra ID is near-ubiquitous incumbent
        - id: financials
          label: >-
            Financials: Est. $200M ARR 2024 (Latka); ~$172K revenue/employee (Revelio); no NRR, gross margin, EBITDA, or
            burn rate disclosed
        - id: risks
          label: >-
            Risks: High — $2.625B preference overhang; no secondary price signal; 56-month funding gap; SaaS multiple
            compression at decade-plus lows Q1 2026
        - id: valuation
          label: >-
            Valuation: Base case $1.2B (6x × $200M ARR); bull $1.84B (8x × $230M); Series F anchor $2.625B is 2–4x any
            scenario range
        - id: recommendation
          label: >-
            Recommendation: Hold / Watch — do not invest at 2021 Series F price; secondary entry below $1.2B with
            confirmed ARR ≥$200M and cap-table analysis could be considered
      edges:
        - from: market-proof
          to: product-moat
          label: validates
        - from: product-moat
          to: financials
          label: informs
        - from: financials
          to: risks
          label: amplifies
        - from: risks
          to: valuation
          label: constrains
        - from: valuation
          to: recommendation
          label: drives
    claimRefs:
      - CV001
      - CV010
      - CV027
      - CV033
      - CV035
      - CV043
