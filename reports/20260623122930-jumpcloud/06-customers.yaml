  - id: section-adoption-trajectory
    title: Adoption trajectory, growth signals, and deployment depth
    body: >
      JumpCloud's organizational reach grew from approximately 120,000 organizations at the
      October 2021 Series F to 250,000+ by June 2026, more than doubling in under five years.
      This trajectory is corroborated by G2 review volume growth: the platform had 3,722 verified
      reviews in the G2 Winter 2026 reports (announced December 2025) and surpassed 4,000 verified
      reviews by the Spring 2026 reports (announced March 2026), placing it among the most heavily
      reviewed platforms in its category peer group.

      Ramp's June 2026 data shows JumpCloud's adoption rate at 14% among organizations with an
      identity provider, down two percentage points year-over-year from approximately 16%, placing
      it at fourth in its category behind Microsoft, Okta, and Google. The two-percentage-point
      decline is a mild adverse signal in an otherwise growing absolute customer base, suggesting
      that new entrants and Microsoft Entra ID expansion are partially offsetting JumpCloud's new
      logo acquisition at the mid-market boundary.

      Deployment depth indicators from case studies are strong: DECKED (a 35-country consumer
      goods manufacturer) migrated its entire Active Directory environment to JumpCloud Platform
      Prime; Stord (100 fulfillment locations, $15 billion annual GMV) deployed JumpCloud as its
      sole MDM and identity platform across Windows and macOS; Quincy Manufacturing executed a
      complete overnight migration with zero downtime. These deployments signal that JumpCloud has
      graduated from niche tool to primary identity layer in its target customer segment.

      The free-to-paid conversion mechanism is structural rather than sales-driven: JumpCloud's
      10-user/10-device free tier imposes an automatic hard limit that fires a forced conversion
      event at the 11th user or device. For the SMB and startup segment, this creates a high-
      intent, low-friction conversion path with near-zero customer acquisition cost. The platform's
      Product of the Year recognition from G2 in the 2026 Best Software Awards across GRC, IT
      Infrastructure, IT Management, Security, and Global Software categories further documents
      sustained market-presence growth.
