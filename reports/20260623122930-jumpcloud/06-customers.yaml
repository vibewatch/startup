  - id: section-review-adverse
    title: Review signals, satisfaction scores, and adverse evidence
    body: >
      JumpCloud's review footprint across aggregator platforms confirms strong satisfaction in its
      core use case. G2's Spring 2026 Grid Reports, published March 2026, recognized JumpCloud in
      150+ categories fueled by over 4,000 verified user reviews, up from 3,722 reviews in the
      December 2025 Winter reports. The overall G2 rating stands at 4.5 out of 5 stars across
      nearly 4,000 reviews. JumpCloud earned G2 Best Software Awards in February 2026 across five
      categories: Best GRC Products, Best IT Infrastructure Software Products, Best IT Management
      Software Products, Best Security Software Products, and Best Global Software Companies.
      TrustRadius records a 9.2 out of 10 score from 52 verified reviews as of 2026, and SpotSaaS
      aggregates 267 reviews, predominantly 4–5 stars. These are strong satisfaction indicators
      for a platform in the $200M ARR range.

      Adverse evidence is documented from multiple credible sources. The most significant
      operational failure was a March 12, 2026 five-hour Agent backend outage that disrupted
      policy syncing and logins, particularly for customers relying on advanced MFA configurations.
      IsDown has continuously monitored JumpCloud since April 2020 and documented approximately
      300 outages over six years, averaging 4.1 incidents per month, with a typical resolution time
      of 154 minutes. StatusGator recorded 29 outage reports from users in the 24-hour window
      around June 22, 2026, associated with a Cloudflare-related admin console degradation. These
      figures confirm that JumpCloud is not incident-free; the critical dependency on a cloud-
      hosted control plane means any backend disruption propagates to authentication, device
      management, and policy enforcement for all connected customers simultaneously.

      User review complaints documented on PeerSpot and SpotSaaS include: API inconsistencies
      between v1 and v2 endpoints that required manual workarounds for auto-scale environments;
      Linux user ID collision issues in mixed-OS environments; slow response times during complex
      technical support escalations; high account representative turnover in the education sector;
      pricing increases over time; and limited customization options for advanced policy management.
      One PeerSpot reviewer who used JumpCloud since 2018 explicitly documented a FedRAMP-driven
      shift away from the platform, stating the reason was "not technical" but rather contractual:
      JumpCloud lacks FedRAMP authorization, creating a compliance blocker for US federal
      contractors and regulated organizations. This represents a structural market limitation
      rather than a product defect, but it has real revenue consequences in the US public-sector
      and defense-industrial-base segments.
