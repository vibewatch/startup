callouts:
  - calloutType: strength
    title: Compliance embedding creates durable annual-renewal pressure
    body: >-
      Organizations that embed JumpCloud as their SOC 2, ISO 27001, or HIPAA evidence platform
      accumulate audit trails within the product. Bright Defense documents 50% of IAM compliance
      controls covered out of the box, and Stord's case study narrates the platform as a single
      source for audit evidence. Annual audit cycles create a structural switching cost: replacing
      the platform resets evidence collection and requires re-proving control effectiveness. This
      dynamic converts annual renewals from a churn-risk moment into a natural lock-in event
      for the compliance-embedded cohort.
    claimRefs:
      - CU010
      - CU013

  - calloutType: risk
    title: FedRAMP absence blocks meaningful public-sector and defense-contractor segment
    body: >-
      A PeerSpot reviewer who used JumpCloud since 2018 explicitly documented an organizational
      shift away from the platform driven by FedRAMP requirements — described as a contractual
      necessity, not a technical deficiency. JumpCloud's cloud-only, multi-tenant architecture on
      Google Cloud has not received FedRAMP authorization. US federal agencies, defense industrial
      base contractors (CMMC requirements aside from the basic tier), and heavily regulated
      healthcare organizations with federal reimbursement dependencies face a procurement blocker
      that forces evaluation of FedRAMP-authorized alternatives. This is not a recoverable gap
      through product features alone — it requires a multi-year authorization process — and
      represents a structurally excluded TAM slice until authorization is obtained.
    claimRefs:
      - CU021
      - CU024
      - CU034

  - calloutType: insight
    title: MSP channel represents the highest-leverage growth lever and the least-disclosed risk
    body: >-
      CRN reporting from early 2026 describes the MSP channel as accounting for a significant
      portion of JumpCloud's growth, and the MacSolution acquisition signals that at least one
      partner relationship was material enough to internalize. The MSP model has attractive unit
      economics for JumpCloud (partners acquire and manage customers, reducing direct CAC), but
      it also concentrates risk in a set of partner relationships whose individual revenue
      contribution is not disclosed. The four-tier partner program in 170+ countries creates
      broad diversification, but the top-MSP concentration profile is unknown, and loss of a
      top-tier partner could create a lumpy ARR decline not visible in headline customer-count
      metrics.
    claimRefs:
      - CU015
      - CU016
      - CU028

  - calloutType: risk
    title: Outage frequency is elevated for an always-on authentication platform
    body: >-
      IsDown documents approximately 300 JumpCloud outages since April 2020 — averaging 4.1
      per month with a 154-minute average resolution time. The March 2026 five-hour Agent backend
      outage directly disrupted logins and policy enforcement. For a platform that positions itself
      as the authentication control plane for an organization's entire device and identity stack,
      a 154-minute average outage resolution time is a material SLA concern, particularly for
      MSPs who have client contractual obligations. The platform's cloud-only architecture means
      there is no on-premises fallback mode; customers cannot fail gracefully to a local directory
      during a JumpCloud backend incident.
    claimRefs:
      - CU022
      - CU023

