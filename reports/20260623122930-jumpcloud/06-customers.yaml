chapter:
  number: 6
  title: Customers
  summary: >-
    JumpCloud serves 250,000+ organizations across 160+ countries as of June 2026, but the
    overwhelming majority are on the permanently free tier; the October 2021 Series F press
    release cited only 5,000+ paying customers against 120,000+ total, and no updated paying-
    customer count has been published since. The customer base skews heavily toward mid-market
    companies (20% IDP-category adoption, 66% of JumpCloud's composition per Ramp), with MSPs
    acting as the dominant growth channel, driving adoption across SMBs they serve. Named
    production case studies — DECKED, Stord, Bright Defense, Athena IT, Noovis, Quincy
    Manufacturing, Attainable Security, and 2026 award winners TestMu and Lightcast — document
    concrete outcomes including 50%→95% device compliance improvement, 75% faster SOC 2
    onboarding, 600%+ client headcount scaling on flat IT overhead, and overnight AD migrations.
    G2 recognition in 150+ Spring 2026 Grid categories from 4,000+ verified reviews (4.5/5 rating)
    and a TrustRadius score of 9.2/10 reflect strong satisfaction, while adverse signals include
    a March 2026 five-hour Agent backend outage, 37+ incidents/year tracked by IsDown, customer
    complaints about account-rep turnover and API inconsistencies, and FedRAMP absence causing
    documented displacement in regulated US-government deployments. NRR, GDR, contract-length
    distribution, and MSP-channel ARR split are not publicly disclosed and represent the core
    diligence gap.

sections:
  - id: section-segmentation
    title: Customer base segmentation, buyer profile, and channel composition
    body: >
      JumpCloud's disclosed organization count of 250,000+ spans 160+ countries and six global
      regions as of June 2026, but this headline figure aggregates paying and free-tier
      organizations without distinction. The October 2021 Series F press release established a
      ratio of approximately 5,000 paying customers against 120,000+ total organizations, implying
      roughly 95% of the base on the permanent free tier at that date; no updated paying/free
      breakdown has been published as the total count grew to 250,000+. The paying base is the
      strategically relevant segment for revenue analysis.

      Within the paying segment, the customer composition skews decisively toward mid-market
      companies. Ramp's June 2026 vendor analytics data shows JumpCloud holding a 14% adoption
      rate in the identity provider category (ranked fourth overall) with mid-market companies
      representing the highest segment adoption rate at 20%, followed by SMB at 12% and enterprise
      at 9%. Mid-market buyers account for approximately 66% of JumpCloud's composition on the
      Ramp platform. The core buyer persona is an IT manager or small IT team at a 50–2,000
      employee organization operating a heterogeneous device fleet (Windows, macOS, Linux) and
      migrating away from on-premises Active Directory toward cloud-native identity and device
      management.

      JumpCloud's channel structure comprises three distinct routes to market: direct product-led
      growth (PLG), where organizations self-serve through the free tier and convert organically
      at the 11-user/device threshold; direct sales-assisted mid-market motion for Platform Prime
      and enterprise bundles requiring contract negotiation; and the MSP and VAR channel, where
      JumpCloud is bundled into managed IT service offerings delivered to SMBs and mid-market
      clients by third-party partners. JumpCloud operates in 170+ countries through its partner
      ecosystem. The MSP channel is quantitatively material — CRN reporting from early 2026
      described MSPs as accounting for "a significant portion" of JumpCloud's growth — but the
      exact channel ARR split has not been publicly disclosed.

      Vertical concentration is not officially disclosed, but case study evidence clusters most
      clearly in: technology and SaaS companies (cloud-first, remote-first, compliance-driven),
      professional services (managed IT and cybersecurity consultancies), and manufacturing and
      logistics firms pursuing AD replacement and operational compliance.
