figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      JumpCloud's visible customer journey proceeds from free-tier discovery through organic
      conversion, production deployment, and module expansion to partner-mediated MSP delivery;
      the MSP lane mirrors the direct lane but telescopes through a third-party relationship
      that abstracts the end customer.
    data:
      nodes:
        - id: j1
          label: Free-tier discovery and evaluation (≤10 users/devices)
          detail: >-
            Product-led growth entry: organizations self-sign-up, access full platform features
            for up to 10 users and 10 devices at no cost. Developer, startup, and IT-generalist
            personas are primary evaluators. JumpCloud University provides self-guided training
            and certification for prospective users and MSPs.
          tone: neutral
        - id: j2
          label: Forced conversion trigger (11th user or device)
          detail: >-
            Hard cap fires automatic monetization event. High-intent organizations that have
            grown beyond the free threshold must select a paid tier to continue. Creates low-
            friction, near-zero-CAC conversion for organic SMB growth. MSP accounts bypass
            individual limits through the multi-tenant portal.
          tone: positive
        - id: j3
          label: Core paid deployment (Device Mgmt, SSO, or Device Identity Mgmt tier)
          detail: >-
            Organizations deploy the JumpCloud agent on endpoints, connect HRIS via SCIM,
            configure SSO connectors (900+), and enroll devices in MDM. Deployment depth
            correlates with ARPU: cross-OS MDM plus directory plus SSO deployments are harder
            to displace. Case studies document 1-day full migrations for SMBs.
          tone: positive
        - id: j4
          label: Compliance embedding and audit cycle lock-in
          detail: >-
            Organizations using JumpCloud for SOC 2, ISO 27001, or HIPAA evidence collection
            accumulate audit trail data within the platform. Bright Defense documents ~50% of
            IAM compliance controls satisfied out of the box. Annual audit cycles create
            structural renewal pressure: switching platforms mid-audit is cost-prohibitive.
          tone: positive
        - id: j5
          label: Module expansion to Platform Prime (PAM, SaaS Mgmt, Shadow AI, Agentic IAM)
          detail: >-
            As organizations grow or compliance requirements deepen, they expand from core tiers
            to Platform Prime or add-on modules: Privileged Access Management, SaaS Discovery,
            SaaS Spend Optimization, Shadow AI Governance, and Agentic IAM (launched April 2026).
            DECKED, Stord, and Attainable Security all operate at Platform Prime level.
          tone: positive
        - id: j6
          label: MSP-mediated delivery (parallel channel lane)
          detail: >-
            MSPs in 170+ countries bundle JumpCloud into managed IT offerings for SMB and
            mid-market clients. The multi-tenant portal enables single-console management across
            all client environments. MSPs earn revenue per client per seat; JumpCloud earns
            per-seat subscription fees. Expansion follows the same compliance-embedding path
            but is mediated through the partner relationship.
          tone: neutral
        - id: j7
          label: Renewal, expansion, and advocacy
          detail: >-
            Annual or multi-year contract renewals; ARPU expansion through module add-ons and
            seat growth; participation in G2/TrustRadius review programs (4,000+ reviews);
            case study publication; referral within partner ecosystem. 2026 Customer Awards
            (TestMu, Lightcast, OOONO) represent the highest-visibility advocacy tier.
          tone: positive
    approximationNotes: >-
      Journey stages are inferred from case study narratives, partner program documentation, and
      pricing tier structure. No quantitative funnel conversion rates or stage-by-stage dropout
      metrics are publicly disclosed by JumpCloud.
    claimRefs:
      - CU001
      - CU007
      - CU008
      - CU010
      - CU026
      - CU033

