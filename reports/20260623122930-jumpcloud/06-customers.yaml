  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Driver or risk
      - Mechanism
      - Current evidence
      - Severity
      - Diligence path
    notes: >-
      Expansion evidence is sourced from case studies and partner program data. Concentration
      risks are inferred from structural characteristics; JumpCloud does not disclose top-customer
      concentration, MSP-channel ARR, or geographic ARR split.
    rows:
      - - "Land-and-expand: free tier to Platform Prime"
        - PLG entry at 11-user threshold; module add-ons (PAM, SaaS Mgmt, Shadow AI, Agentic IAM) drive ARPU expansion
        - DECKED, Stord, Attainable Security all on Platform Prime; case studies note multi-module use
        - Positive (revenue driver)
        - Track ARPU expansion YoY by cohort; request module attachment rate and upgrade frequency
      - - "Land-and-expand: MSP client-base growth"
        - MSP acquires new client → JumpCloud adds per-seat revenue without direct sales cost
        - Partner program in 170+ countries; MacSolution acquisition to deepen LATAM; case studies from Bright Defense, Noovis, Attainable Security
        - Positive (revenue driver)
        - Disclose MSP-originated ARR % and per-MSP seat growth; track top-10 MSP concentration
      - - Compliance-cycle lock-in
        - SOC 2, ISO 27001, HIPAA audit evidence embedded in JumpCloud; switching mid-audit is prohibitively expensive
        - "Bright Defense: 50% of IAM SOC 2 controls covered out of box; Stord: annual audit evidence sourced from JC"
        - High positive (retention driver)
        - Confirm compliance-certified customer cohort renewal rate vs. non-compliance cohort
      - - Top-customer revenue concentration
        - Unknown; no enterprise megacustomer named publicly; mid-market skew implies distributed base
        - No individual named customer revenue disclosed; MacSolution acquisition suggests one significant partner dependency existed
        - Unknown risk (medium concern)
        - Request top-10 customer and top-10 MSP-partner revenue concentration as % of total ARR
      - - MSP channel dependency
        - Significant share of growth through channel per CRN; MacSolution internalized; no ARR % disclosed
        - Partners in 170+ countries; annual Partner Awards across 6 global regions; channel strategy doubling down per CRN
        - Medium risk (channel dependency)
        - Disclose direct vs. channel ARR split; assess top-MSP departure scenario impact
