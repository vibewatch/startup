  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: nrr-gdr-retention
      missingEvidence: >-
        JumpCloud's NRR, gross dollar retention, logo churn rate, and average contract length
        are not publicly disclosed in any source retrieved during this research run.
      whyItMatters: >-
        Without retention metrics, it is impossible to assess whether the 250,000+ organization
        count represents durable recurring revenue or high-churn free-tier signups; NRR is the
        single most important customer metric for a SaaS underwriting decision.
      diligencePath: >-
        Request audited NRR and GDR by cohort year, product tier, and segment (direct SMB,
        direct mid-market, MSP-delivered) from JumpCloud CFO; review enterprise contract
        templates for minimum commitment terms and renewal clauses.
      relatedQuestionRefs:
        - QU015
        - QU019
      relatedTableRefs:
        - TU004

    - type: private-evidence-only
      severity: material
      topic: top-customer-concentration
      missingEvidence: >-
        Top-10 customer revenue concentration, largest single-account ARR, and MSP-channel
        ARR as a percentage of total are not disclosed in any public source.
      whyItMatters: >-
        The MacSolution acquisition signals at least one partner relationship was material
        enough to internalize; loss of a top-tier MSP partner could create lumpy ARR decline
        not visible in headline organization-count metrics.
      diligencePath: >-
        Request top-10 customer and top-10 MSP-partner revenue concentration as percentage
        of total ARR; request direct vs. channel ARR split; model top-partner departure scenario.
      relatedQuestionRefs:
        - QU016
        - QU020
      relatedTableRefs:
        - TU005

    - type: private-evidence-only
      severity: material
      topic: paying-customer-count
      missingEvidence: >-
        The paying customer count has not been updated since October 2021 (5,000+ disclosed
        at Series F against 120,000+ total); no public source confirms the paying count at
        the 250,000+ organization total of June 2026.
      whyItMatters: >-
        The free-to-paid ratio is a critical revenue quality indicator; if the ratio remained
        near 4% (the 2021 implied level), the paying base would be approximately 10,000 at
        250,000+ total — implying a much smaller revenue base than broad adoption metrics suggest.
      diligencePath: >-
        Request current paying customer count broken down by tier (Device Mgmt, SSO, Platform
        Essentials, Platform, Platform Prime), cohort vintage, and channel (direct vs. MSP-delivered).
      relatedQuestionRefs:
        - QU018
        - QU021
      relatedTableRefs:
        - TU002

    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-enumeration
      missingEvidence: >-
        JumpCloud's full paying-customer roster is private; the 62+ case study library is the
        best available proxy but represents a curated sample; independent third-party corroboration
        of outcome metrics in any case study is absent.
      whyItMatters: >-
        All case study evidence is JumpCloud-authored; outcome percentages (75% faster onboarding,
        30% cost reduction, 600% headcount scaling) are customer-reported and not independently
        audited; the true representativeness of the sample is unknown.
      diligencePath: >-
        Request independently verified reference customers for on-the-record outcome validation;
        seek customer references across at least three segments (SMB direct, mid-market direct,
        MSP-delivered) and one compliance-certified cohort.
      relatedQuestionRefs:
        - QU003
        - QU010
      relatedTableRefs:
        - TU003

    - type: data-unavailable
      severity: minor
      topic: competitor-satisfaction-comparison
      missingEvidence: >-
        Comparable customer satisfaction metrics (G2 scores, review volume, recency, independent
        corroboration) for JumpCloud's primary identity provider competitors — Microsoft Entra ID,
        Okta, and Google Workspace — were not retrieved in this research run; review platform pages
        for competitors were not fetched, and G2 competitor grid comparison data was not available
        from the sources accessed.
      whyItMatters: >-
        JumpCloud's 4.5/5 G2 score and 9.2/10 TrustRadius score are strong in absolute terms,
        but without benchmarking against Okta (typically rated 4.4-4.5) or Microsoft Entra ID,
        the relative satisfaction advantage and customer-switching dynamics cannot be quantified;
        comparative freshness and independence of review signals informs customer stickiness
        assessment.
      diligencePath: >-
        Pull G2 grid comparison for JumpCloud vs. Okta vs. Microsoft Entra ID vs. Duo vs.
        OneLogin in Cloud Directory Services and UEM categories; review sentiment trends
        quarterly for each competitor; assess NPS benchmarks if available from B2B SaaS
        survey data.
      relatedQuestionRefs:
        - QU025
      relatedTableRefs:
        - TU004
