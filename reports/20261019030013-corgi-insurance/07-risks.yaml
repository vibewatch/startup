      - Jurisdiction / scope
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Diligence path
    rows:
      - [TRRG structure and guaranty-fund gap, Multi-state for policies written through TRRG, Medium, High, Moderate, High, Request policy mix by carrier plus statutory-capital and guaranty-fund exposure analysis.]
      - [Admitted-paper partner-carrier dependence, State and line-specific admitted placements, Medium, High, Moderate, Medium-High, Obtain carrier-panel concentration by state line and attachment-point usage.]
      - [Licensing and appointment scope, Producer licensing plus carrier appointments where operating, Low-Medium, Medium, Moderate, Medium, Verify DOI licenses active appointments and any state declination or non-renewal history.]
      - [AI output data and bias disputes, AI customers using model-driven workflows, Medium, High, Low-Moderate, High, Review underwriting guidelines exclusions claims examples and policy wording for AI-specific loss scenarios.]
    notes: Public register of the material legal and regulatory exposures visible in assigned sources; it is not a substitute for statutory filings, treaty review, or policy-form diligence.
    enumerationScope:
      coverage: partial
      basis: Publicly documented structural and legal issues visible in the assigned source pool as of 2026-10-19, not the full universe of regulatory exposures.
    claimRefs: [CR002, CR003, CR004, CR012, CR013, CR014, CR015]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - [Instant-quote promise breaks on non-standard risks, Medium, Medium-High, Moderate, Medium, Public sources do not show quote-to-bind conversion by risk class or the share of cases routed into manual review.]
      - [Operating breadth outruns process maturity as claims and new verticals expand, Medium-High, High, Low-Moderate, High, No public loss-ratio claims-operations or service-level disclosure for the broader product set.]
      - [Seven-day office culture and multi-city hiring strain controls, Medium, Medium-High, Low-Moderate, Medium-High, No public retention compliance-incident or management-depth disclosure to show the model scales cleanly.]
    notes: Severity reflects operational impact on underwriting, service quality, and control consistency rather than a prediction that failure has already occurred.
    claimRefs: [CR001, CR005, CR010, CR011, CR016]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - [Admitted paper, Affiliated or partner carriers, Required when customers or states prefer admitted coverage, Potentially high but undisclosed, Carrier appetites tighten or a key carrier pulls back and quote speed no longer converts into bindable capacity, High, Maintain multiple rated partners and steer risks between TRRG and admitted paper, Medium-High]
      - [Capital providers and valuation momentum, Existing and new investors, Fund expansion and reinforce perceived balance-sheet strength, High in current public narrative, Capital markets cool or mark discipline returns before public operating evidence catches up, High, Preserve underwriting profitability and disclose more claims and solvency metrics, High]
      - [Specialized compliance and regulatory talent, Key compliance regulatory and portfolio-risk hires, Keeps multi-line expansion within licensing and filing guardrails, Moderate, Talent turnover or thin bench slows launches or weakens filings reviews, Medium-High, Add depth beyond recent named hires and document governance cadence, Medium]
    notes: Public sources identify the dependency categories, but not the actual counterparty concentration percentages or contractual protections behind them.
    claimRefs: [CR003, CR006, CR007, CR008, CR013, CR016]
