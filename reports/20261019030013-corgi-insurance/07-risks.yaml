  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: regulatory-risk-register
      missingEvidence: Full carrier-entity map, admitted-paper split, and state-by-state product availability across the portfolio.
      whyItMatters: The public sources identify the structural issues but do not show how much premium or risk actually sits in the more fragile parts of the stack.
      diligencePath: Request entity chart, admitted-vs-TRRG premium mix, and state/line coverage matrix from compliance leadership.
      relatedQuestionRefs: [QR001, QR003]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: capital-adequacy-and-reinsurance
      missingEvidence: Statutory surplus, RBC or analogous solvency metrics, fronting or reinsurance counterparties, attachment points, and treaty limits.
      whyItMatters: The carrier-structure risk cannot be underwritten cleanly without seeing how much balance-sheet protection exists behind the public growth story.
      diligencePath: Obtain carrier financial statements, reinsurance schedule, and board-level capital planning materials.
      relatedQuestionRefs: [QR008]
    - type: private-evidence-only
      severity: material
      topic: claims-performance
      missingEvidence: Loss ratio, combined ratio, claims frequency and severity by product line, and evidence that AI underwriting improves outcomes rather than just speed.
      whyItMatters: Without actual claims-performance data, public profitability and valuation claims cannot be translated into durable underwriting economics.
      diligencePath: Request audited or board-reviewed claims dashboards by cohort, product, and underwriting vintage.
      relatedQuestionRefs: [QR008]
    - type: missing-source
      severity: minor
      topic: security-and-compliance-disclosure
      missingEvidence: Public security, privacy, incident-history, DPA, or certification evidence for the operating platform.
      whyItMatters: The assigned pool shows AI and cyber risk positioning, but not the control environment investors would want to see behind that positioning.
      diligencePath: Pull trust-center materials, audit letters, and incident-response history directly from management or customer diligence rooms.
      relatedQuestionRefs: [QR008]
