  topStrengths:
    - Direct quote-and-bind workflow and startup-specific packaging create a clear operating-model wedge.
    - Public fundraising momentum and investor backing remain strong.
    - Evidence of real startup customer adoption is stronger than in the prior refresh.
  topRisks:
    - Public underwriting economics, claims performance, and reserve quality remain opaque.
    - Public valuation references have risen faster than disclosed carrier fundamentals.
