company:
  name: Corgi Insurance
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Corgi's addressable market is best described as modular commercial insurance
    for venture-backed startups and technology companies, with demand tied to
    financing, enterprise contracts, hiring, and AI-specific liability. The
    assigned evidence pool provides useful operating proxies such as $40M+ ARR,
    company-issued package prices, and workflow triggers, but it does not
    contain an independent TAM/SAM/SOM study, so market sizing remains
    evidence-constrained rather than valuation-grade.
sections:
  - id: market-boundary
    title: Market boundary and included spend
    body: >-
      The strongest evidence in the assigned pool defines Corgi's market as
      commercial insurance for technology companies and startups rather than as
      a generic SMB or personal-lines opportunity. Across the About page, launch
      announcement, and product pages, Corgi describes a full-stack operating
      model spanning underwriting, policy design, servicing, and claims, with a
      coverage stack that includes D&O, Tech E&O or AI liability, cyber, CGL,
      HNOA, fiduciary, and adjacent commercial lines. That matters because the
      market boundary is set by startup workflow needs such as fundraising,
      enterprise diligence, governance, and product risk, not by a single
      policy SKU. The broadest number in the pool is Corgi's own "$1T+"
      description of the insurance industry, but that is an ambition statement
      rather than a defensible startup-insurance TAM. The evidence therefore
      supports a boundary-first framing of the market, not a top-down sizing
      model.
    claimRefs: [CM001, CM002, CM005, CM010]
    tableRefs: [TM001]
  - id: buyer-path
    title: Buyer path, demand drivers, and adoption constraints
    body: >-
      Demand in this category appears milestone-driven rather than purely
      annualized. First Citizens and SVB frame insurance as part of operational
      readiness, fundraising, hiring, and customer acquisition, while Corgi's
      D&O guide says coverage becomes required when startups raise
      institutional capital, add independent directors, or enter contracts that
      bring governance scrutiny. Company-issued comparison pages extend the same
      logic to software and AI workloads: enterprise MSAs, trust motions such as
      cyber diligence, and model-risk concerns push founders toward Tech E&O,
      Cyber, and AI-specific liability alongside D&O. The product-market
      implication is that buyer, user, and payer rarely collapse to one person.
      Founders and finance leaders may initiate spend, but boards, enterprise
      customers, auditors, and banking partners can effectively force adoption.
      That makes channel access and speed-to-bind as important as price.
    claimRefs: [CM003, CM004, CM006, CM007, CM008, CM009, CM014]
    tableRefs: [TM003]
  - id: sizing-lenses
    title: Evidence-constrained sizing and valuation relevance
    body: >-
      The chapter's sizing evidence is useful but narrow. Corgi disclosed ARR
      above $40 million after July 2025 regulatory approval, which demonstrates
      live demand but not the market ceiling. Company-issued AI-startup guidance
      adds stage-price proxies of $2,000 to $5,000 for pre-seed packages and
      $5,000 to $15,000 for Series A packages, suggesting insurance can fit
      venture-backed software budgets. AIFI Map contributes a broader reach
      proxy of 40K+ customers across 49 states, but the same page conflicts
      with official disclosures on founder identity, website, and employee
      count, so it should not anchor a valuation-grade model. The result is an
      evidence-constrained sizing stack: enough to show how spend enters the
      startup workflow, but not enough to isolate TAM, SAM, or durable share
      without independent broker, regulator, or public-company benchmarks.
    claimRefs: [CM010, CM011, CM012, CM013]
    tableRefs: [TM002]
    figureRefs: [FM001]
