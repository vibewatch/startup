callouts:
  - calloutType: insight
    title: Insurance attach point is milestone-driven
    body: >-
      The strongest cross-source pattern is that insurance spend shows up when
      startups raise capital, add directors, sign enterprise contracts, or
      enter AI-sensitive workflows; the market behaves more like infrastructure
      purchased at trigger events than a flat annual SaaS budget line.
    claimRefs: [CM003, CM004, CM008]
  - calloutType: risk
    title: Sizing remains promotional and proxy-based
    body: >-
      Every numeric market lens in the assigned pool is company-issued or only
      weakly corroborated. Without an independent TAM study, broker benchmark,
      or public loss and retention data, this chapter can support boundary logic
      and price proxies but not a defensible share-of-market model.
    claimRefs: [CM010, CM012, CM013]
