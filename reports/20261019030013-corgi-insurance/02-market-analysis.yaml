      - ["Growth-stage tech company", "Finance, legal, or risk lead", "Leadership, employees, and counterparties", "Finance or treasury budget", "Higher limits plus fiduciary or transaction-related coverage", "Hiring scale, employee benefits, or M&A and secondary activity"]
