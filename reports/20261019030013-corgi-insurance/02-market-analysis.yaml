      - ["Stage package pricing (Series A)", "Corgi AI-startup guide", "2026", "Unspecified / likely U.S.", "$5,000–$15,000 per year", "Company-issued example of Series A package price", "Low", "Promotional example rather than benchmark survey"]
      - ["Reach proxy", "AIFI Map", "2026", "U.S.", "40K+ customers across 49 states", "Directory snapshot of current footprint", "Low", "Same page conflicts with official company metadata"]
    notes: "This table preserves every numeric lens found in the assigned pool and flags when a row is promotional, top-of-funnel, or internally inconsistent."
    claimRefs: [CM010, CM011, CM012, CM013]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment / moment
      - Buyer
      - User / beneficiary
      - Payer / budget owner
      - Workflow
      - Adoption trigger
    rows:
      - ["Pre-seed / seed AI or software startup", "Founder or COO", "Company, founders, and early board", "Operating budget", "Baseline CGL + D&O + Tech E&O + Cyber stack", "First outside capital, office lease, or pilot launch"]
