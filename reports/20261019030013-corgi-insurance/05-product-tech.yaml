  evidenceGaps:
    - type: missing-source
      severity: material
      topic: technical-transparency
      missingEvidence: Evidence beyond a job-post-derived React, Python, and AWS stack hint, including public API or integration documentation, a status page, uptime metrics, incident history, and implementation references for the underwriting and servicing stack.
      whyItMatters: The core differentiation claim depends on software leverage, but a third-party stack label does not let diligence separate strong distribution messaging from durable operating technology.
      diligencePath: Request the underlying engineering postings, API docs, customer implementation references, uptime and incident metrics, and service-level reports for quote, bind, and claims workflows.
      relatedQuestionRefs: [QE008]
      relatedTableRefs: [TE003]
    - type: private-evidence-only
      severity: material
      topic: quote-to-bind
