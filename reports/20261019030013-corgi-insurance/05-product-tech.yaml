company:
  name: Corgi Insurance
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Corgi's public product surface is best evidenced as a full-stack carrier workflow for
    venture-backed and AI-heavy startups rather than as a deeply documented software platform.
    The assigned sources support modular coverage, quote-to-bind speed, and regulatory routing
    across in-house underwriting, servicing, and claims, but they leave meaningful diligence gaps
    around implementation detail, uptime, security controls, and line-by-line operating maturity.
sections:
  - id: product-scope-and-buyer-jobs
    title: Product scope and buyer workflow
    body: >-
      The strongest primary evidence presents Corgi as a startup-focused commercial insurance
      carrier rather than a generic SMB broker. Its public pages consistently position the product
      around technology-company pain points: getting insurable fast enough to close contracts,
      satisfy board or financing requirements, and package AI-specific liability with more standard
      commercial lines. The product definition is therefore less "insurance app" than an operating
      workflow that starts with digital intake, routes either to instant quoting or underwriting
      review, and ends with binding, policy documents, and COI access. That is a credible value
      proposition for founders on tight timelines, but the evidence is mostly company-authored and
      does not include public pricing ladders, conversion rates, or loss experience by module.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE012]
    tableRefs: [TE001, TE002]
  - id: carrier-architecture-and-controls
    title: Carrier architecture and controls
    body: >-
      Corgi's public architecture is best understood as an operating stack that combines digital
      intake, AI-assisted underwriting, carrier-paper routing, servicing, and claims administration.
      That stack matters because the company's differentiation claim depends on compressing the
      broker-to-carrier handoff into a single carrier-controlled workflow. The evidence is strongest
      on regulatory and paper-routing structure: the company says coverage is primarily underwritten
      by TRRG, while some admitted access comes from affiliated or partner carriers rated A- or
      better by AM Best. The same sources also make clear that coverage availability still depends
      on jurisdiction, line, and underwriting approval, which means the "full-stack" story is not
      the same as unconditional one-paper nationwide availability.
    claimRefs: [CE006, CE007, CE008, CE010, CE011]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-differentiation-and-public-gaps
    title: Maturity, differentiation, and public gaps
    body: >-
      Differentiation is publicly framed around in-house underwriting control, modular stage-based
      packages, and better fit for AI and software risks than generalist carriers or brokers. That
      positioning is plausible and somewhat corroborated by independent reporting, especially on the
      shift beyond startup insurance into trucking and other adjacent lines. Even so, the assigned
      pool does not expose technical documentation, uptime metrics, integration references, breach
      history, or public claims-service SLAs. Third-party metadata also diverges on scale and
      breadth, which makes outside profiles useful for triangulation but not sufficient to establish
      detailed platform architecture on their own. For diligence, the core question is whether the
      software and operational stack is as durable as the quote-speed narrative implies.
    claimRefs: [CE007, CE008, CE009, CE010, CE011, CE013, CE014]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / product line
      - Primary user
      - Status / maturity
      - Differentiation evidence
      - Diligence gap
    rows:
      - - Startup Program core commercial lines
        - Venture-backed startups needing fast contract, fundraising, and hiring coverage
        - Publicly launched in Jan 2026; instant quoting only for eligible risks
        - Official sources describe direct quote-to-bind workflow across major startup liability lines
        - No public attach-rate, quote-conversion, or loss-ratio disclosure by module
      - - AI liability coverage
        - AI companies selling models, agents, or software with output/data risk
        - Publicly marketed in 2026
        - Primary page explicitly references model output claims, training-data disputes, and bias scenarios
        - No specimen wording, exclusions, or limit structure in the assigned evidence
      - - Stage-based package design
        - Founders, finance leads, and legal operators across Pre-Seed to Growth
        - Repeated across official comparison and buying-flow pages
        - Modular packaging is presented as a way to add only the coverages needed at each stage
        - No public price bands, limit ladders, or upgrade frequency data
      - - Newer vertical extensions
        - Non-startup commercial accounts such as trucking
        - Expansion is externally reported, but operating maturity is not independently quantified
        - Suggests the same underwriting stack is being reused beyond startup insurance
        - Need written-premium mix, claims performance, and unit economics by vertical
    notes: Public evidence mixes official marketing and third-party summaries; null operational metrics reflect undisclosed quote, bind, and claims-performance data.
    claimRefs: [CE001, CE002, CE003, CE004, CE009, CE012, CE013]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow trigger
      - Company solution
      - Measurable benefit in evidence
      - Key limitation
    rows:
      - - Close an enterprise contract or vendor onboarding
        - A buyer needs a COI and required liability limits quickly
        - Online quote, bind path, and COI/document access
        - Official and company-authored comparison sources say quote in minutes and same-day binding in most cases
        - No public median bind time, approval rate, or exception rate
      - - Close a financing round or add a board
        - Investors or directors require D&O and related governance coverages
        - Stage-based startup package bundles D&O with adjacent commercial lines
        - Official startup-program materials list D&O, Fiduciary, EPLI, HNOA, and CGL in one program
        - No public evidence on how often manual underwriting interrupts the stated fast path
      - - Sell AI software into enterprise accounts
        - Customers ask about model, privacy, contract, and leadership exposures
        - AI package frames coverage around output risk, training-data disputes, cyber exposure, and customer contracts
        - Primary page spells out hallucination, bias, and training-data claim scenarios
        - No public control framework, breach history, or claims-outcome evidence in the pool
      - - Meet state or paper requirements
        - A buyer or partner needs admitted paper or jurisdiction-specific availability
        - Corgi routes some coverage through TRRG and some through affiliated or partner admitted carriers
        - About and AI pages explicitly mention A-rated admitted access where required
        - State-by-state availability, carrier split, and line routing are not disclosed
    notes: Benefits are drawn from public quote-flow language and scenario pages; missing values are structural diligence asks, not assumed negatives.
    claimRefs: [CE003, CE004, CE005, CE006, CE008, CE010, CE011]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process
      - Role
      - Dependency
      - Risk
    rows:
      - - Digital intake and eligibility
        - Collects applicant inputs and routes requests to instant quote or underwriting review
        - Accurate applicant data plus line/state eligibility rules
        - Public materials do not disclose decline logic, eligibility thresholds, or review volumes
      - - AI-assisted underwriting and risk modeling
        - Supports the quote-in-minutes narrative for startup and AI risks
        - Model quality, governance, and enough domain data by product line
        - No public metrics on model overrides, drift, false positives, or adjudication quality
      - - Carrier / paper routing
        - Places coverage through TRRG, admitted affiliates, or partner carriers depending on risk and jurisdiction
        - Carrier relationships, state rules, and underwriting approval
        - Availability varies by jurisdiction and not all products are available in all states
      - - Servicing, policy docs, and COIs
        - Keeps post-bind documents and servicing inside the same buying flow
        - Operational tooling and staffing behind servicing workflows
        - No public service-level metrics or implementation references
      - - Public technology-stack proxy
        - Signals implementation choices attributed to engineering job posts
        - A third-party profile lists React, Python, and AWS without linking the underlying postings
        - No repository, release, contributor, package, integration, or production-performance telemetry
    notes: This table reconstructs the public operating model from marketing, press, and third-party descriptions; it is not a code-level software architecture disclosure.
    claimRefs: [CE005, CE006, CE007, CE008, CE010, CE011, CE013, CE014]
figures:
  - id: FE001
    title: Publicly evidenced product architecture map
    type: stack
    summary: >-
      Public evidence supports a quote-to-bind operating stack spanning intake, underwriting,
      carrier routing, coverage modules, and servicing rather than a deeply documented API or
      infrastructure architecture.
    data:
      layers:
        - label: Buyer trigger
          detail: Contract, fundraise, audit, or board event creates a time-sensitive insurance need.
        - label: Intake and triage
          detail: Founders answer a short question set and are routed either to instant quote or underwriting review.
        - label: Underwriting engine
          detail: AI-assisted in-house underwriting and risk modeling support the quote-in-minutes proposition.
        - label: Carrier / paper routing
          detail: Coverage may route through TRRG, admitted affiliates, or partner carriers depending on state, line, and risk.
        - label: Coverage modules
          detail: D&O, Tech E&O, Cyber, EPLI, Media, Fiduciary, HNOA, CGL, and AI-liability modules can be combined by stage.
        - label: Servicing and claims
          detail: Policy documents, COIs, servicing, and claims administration are presented as part of the same platform.
    approximationNotes: >-
      This is a reconstruction of the public operating stack from assigned sources, not a direct
      diagram of internal software components or system boundaries.
    claimRefs: [CE001, CE003, CE004, CE005, CE006, CE007, CE008, CE010]
