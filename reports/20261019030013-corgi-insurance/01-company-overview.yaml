      - [Technology Risk Retention Group (TRRG), "Risk retention group identified as primary underwriting vehicle", "Core carrier paper and regulatory exposure point", high, "Request capital, solvency, and claims-governance materials."]
      - [Admitted partner carriers, "Official pages say admitted paper can be placed through A-rated partner carriers", "Coverage availability and claims-payment chain depend on carrier mix", high, "Request named carriers, state coverage map, and reinsurance structure."]
    notes: >-
      This is a partial stakeholder map built from named investors and underwriting entities in the
      assigned pool; it is not a full cap table, board-rights schedule, or reinsurance panel.
    enumerationScope:
      coverage: partial
      basis: "Sample of stakeholders explicitly named in assigned company and third-party funding materials through May 2026."
    claimRefs: [CO004, CO006, CO008, CO015, CO016]
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      The supportable timeline runs from a 2024 founding claim through the May 2026 financing spike,
      with later scale markers clearly labeled as lower-confidence third-party reporting.
    data:
      items:
        - year: "2024"
          label: "Third-party sources place the founding in 2024"
          detail: >-
            AIFI Map and Silicon Valley Invest Club both place Corgi's founding in 2024; current
            official assigned pages do not restate the year directly.
          tone: neutral
          claimRefs: [CO002, CO012]
        - date: "2025-07"
          label: "Regulatory approval reported"
          detail: >-
            The official Series B release says Corgi received regulatory approval in July 2025
            before launching as a licensed carrier.
          tone: positive
          claimRefs: [CO005]
        - date: "2026-01-08"
          label: "Series A appears in third-party profiles"
          detail: >-
            Two third-party profiles place a roughly $108 million Series A at about a $630 million
            valuation on January 8, 2026, but the assigned official pool does not include the
            underlying announcement.
          tone: warning
          claimRefs: [CO015]
        - date: "2026-01-19"
          label: "Startup Program launch"
          detail: >-
            PR Newswire says Corgi launched a Startup Program with instant online quoting for core
            commercial lines used in fundraising, hiring, and enterprise contracting.
          tone: positive
          claimRefs: [CO007]
        - date: "2026-05-07"
          label: "Series B official disclosure"
          detail: >-
            Corgi officially announced a $160 million Series B at a $1.3 billion valuation led by
            TCV, taking cumulative capital raised above $268 million at that point.
          tone: positive
          claimRefs: [CO006]
        - date: "2026-05-28"
          label: "Forbes reports B1 follow-on"
          detail: >-
            Forbes reported another $106 million at a $2.6 billion valuation in a B1 round limited
            to existing investors, again led by TCV.
          tone: warning
          claimRefs: [CO008, CO016]
        - period: "2026-05"
          label: "Tear sheet reports profitability and ~$100M annualized revenue"
          detail: >-
            Silicon Valley Invest Club says Corgi reached profitability and roughly $100 million of
            annualized revenue by May 2026, while also warning that the figures mix company
            disclosures with third-party estimates.
          tone: warning
          claimRefs: [CO013]
        - period: "2026-07"
          label: "Later third-party scale markers move higher"
          detail: >-
            The same tear sheet lists a reported $4.0 billion July 2026 valuation and a 201-500
            employee LinkedIn band, neither of which is company-confirmed in the assigned pool.
          tone: warning
          claimRefs: [CO013]
    approximationNotes: >-
      Events using only third-party profiles are preserved as lower-confidence milestones rather
      than upgraded into official company facts.
    claimRefs: [CO005, CO006, CO007, CO008, CO013, CO015, CO016]
callouts:
  - calloutType: risk
    title: Underwriting speed is real, but carrier complexity is the hidden diligence issue
    body: >-
      Corgi's pitch is built on faster quoting and binding, yet the same official pages say paper
      can sit with TRRG or admitted partner carriers and that availability still varies by
      jurisdiction and underwriting approval. The diligence question is therefore not just quote
      velocity, but whether capital, carrier mix, reinsurance, and claims governance are strong
      enough to support the growth narrative.
    claimRefs: [CO004, CO014]
  - calloutType: insight
    title: Market repricing is easier to verify than operating scale
    body: >-
      The official May 2026 Series B and Forbes' later B1 report strongly suggest a rapid valuation
      step-up, but the assigned pool is much weaker on current customer count, revenue quality,
      claims performance, and headcount. Investors can underwrite the financing path faster than
      they can underwrite operating durability from these sources alone.
    claimRefs: [CO006, CO008, CO009, CO013]
