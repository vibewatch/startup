schemaVersion: "report-v2"
artifact: company-overview
slug: corgi-insurance
runDate: 2026-10-19
company:
  name: Corgi Insurance
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Corgi presents itself as an AI-native, full-stack insurance carrier/platform for startups and
    technology companies, with official evidence for a $160 million Series B at a $1.3 billion
    valuation on 2026-05-07 and product surfaces centered on rapid self-serve quoting. Public
    evidence for later scale is materially thinner: Forbes reported a $106 million B1 at a $2.6
    billion valuation three weeks later, but current headcount, customer count, revenue quality,
    claims history, and governance depth remain only partially verified in the assigned pool.
sections:
  - id: identity-and-structure
    title: Identity, product scope, and underwriting structure
    body: >-
      Corgi's official materials consistently frame the company as an AI-native, full-stack
      insurance platform or carrier built for startups and technology companies, rather than as a
      generic broker marketplace. The current homepage and AI-specific product page emphasize
      instant quoting, same-day binding where eligible, and modular packages aligned to startup
      stages from pre-seed through growth. That positioning matters for later diligence chapters:
      this is a regulated insurance workflow business whose speed claim depends on controlling more
      of underwriting and servicing, not just a software front end. The legal structure is also
      more complex than the marketing shorthand suggests, because official pages say coverage may
      sit with Technology Risk Retention Group or admitted partner carriers while Corgi Insurance
      Services acts as the licensed producer and program administrator.
    claimRefs: [CO001, CO003, CO004, CO005, CO010, CO014]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership visibility, governance depth, and key-person dependence
    body: >-
      The assigned pool clearly names only two operators at the center of the story: co-founders
      Nico Laqua and Emily Yuan. Official and syndicated company materials repeatedly put Nico in
      the external spokesperson role and identify Emily as the co-founder and COO, but they do not
      provide an independent board list, committee structure, or a broader operating roster that
      would let an investor judge delegation depth. That disclosure gap is meaningful because the
      business claims unusually fast underwriting, product expansion, and financing velocity while
      public leadership visibility stays concentrated in the founders. The overview chapter can
      therefore treat founder identity as verified ground truth, but it should treat governance
      resilience and bench depth as open diligence questions rather than solved facts.
    claimRefs: [CO002, CO011]
    tableRefs: [TO002]
  - id: financing-scale-and-stakeholders
    title: Financing path, stakeholder concentration, and scale signals
    body: >-
      The strongest verified financing fact in the assigned pool is the official 2026-05-07 Series
      B announcement: $160 million at a $1.3 billion valuation led by TCV, taking total capital
      raised to more than $268 million at that point. Later public reporting extends the story, with
      Forbes saying Corgi raised another $106 million in a B1 round at a $2.6 billion valuation,
      while low-confidence directory and tear-sheet sources push valuation, revenue, customer, and
      headcount figures even higher. Those later numbers are directionally useful for understanding
      how aggressively the market may have repriced the company, but they are not equivalent to
      company-confirmed current operating metrics. TCV is the clearest economically important
      stakeholder visible in the pool, and TRRG plus admitted partner carriers are the clearest
      operationally important non-equity counterparties.
    claimRefs: [CO006, CO007, CO008, CO009, CO012, CO013, CO015, CO016]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: what-remains-unverified
    title: What remains unverified before this chapter can serve as full ground truth
    body: >-
      This chapter is strong enough to anchor identity, founder names, underwriting structure, and
      the official May 2026 financing event, but it is not strong enough to anchor current scale or
      governance quality without qualification. The assigned pool does not contain audited
      financials, loss ratio or combined ratio disclosure, claims experience, reinsurance structure,
      capital adequacy detail, or a public board roster. It also contains conflicting third-party
      summaries on founder identity, website, ARR, customer count, headcount, and latest valuation.
      Later chapters should therefore reuse the verified facts here, but preserve uncertainty around
      scale and underwriting performance unless stronger source types appear in their own assigned
      pools.
    claimRefs: [CO009, CO011, CO012, CO013, CO014]
