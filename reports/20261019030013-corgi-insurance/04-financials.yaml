schemaVersion: report-v2
artifact: financials
slug: corgi-insurance
runDate: 2026-10-19
company:
  name: Corgi Insurance
chapter:
  number: 4
  title: Financials
  summary: >-
    Corgi's public financial case is strongest on distribution speed and access to
    capital, not on disclosed underwriting economics. Public sources support a
    fast quote-to-bind workflow, at least $374 million of disclosed capital
    raised through the May 2026 B1 round, and directional top-line momentum, but
    they still do not disclose loss ratio, combined ratio, cash, runway, or
    realized pricing.
sections:
  - id: revenue-model-and-coverage-stack
    title: Revenue model and coverage stack
    body: >-
      Corgi's public financial story starts with insurance-product architecture
      rather than GAAP disclosure. The company markets direct quote-and-bind
      coverage for startup lines such as D&O, cyber, and tech E&O, but its own
      disclosures show that risk can sit with multiple entities: Technology Risk
      Retention Group (TRRG), Corgi Insurance Company, and partner admitted
      carriers, while Corgi Insurance Services acts as program administrator and
      producer. That supports a broader monetization stack than a simple SaaS
      subscription, yet outside readers still cannot tell how much economics come
      from retained underwriting margin versus MGA or producer fees, partner
      carrier commissions, or other paper-specific arrangements.
    claimRefs: [CI001, CI003, CI004, CI005, CI006]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-gtm-and-public-traction
    title: Pricing, GTM, and public traction
    body: >-
      Public evidence supports a fast, product-led sales motion more than a fully
      disclosed pricing model. Corgi says eligible startups can complete a short
      online flow, receive an instant quote or underwriting review, bind
      coverage, and access COIs; its comparison content also emphasizes
      quote-in-minutes speed and modular expansion by funding stage. What is
      missing is a public rate card, realized premium by product, discounting, or
      broker-versus-direct mix. Third-party summaries repeat strong early-2026
      traction claims around more than $40 million of ARR and 40,000-plus
      customers, while later aggregation points to roughly $100 million of
      annualized revenue by May 2026, but those figures remain company-sourced or
      compiled rather than audited.
    claimRefs: [CI002, CI011, CI012, CI013, CI014, CI016]
    tableRefs: [TI002]
  - id: capital-adequacy-and-cost-base
    title: Capital adequacy and cost base
    body: >-
      Capital has moved faster than public operating disclosure. Public reporting
      supports a $108 million Seed and Series A in January 2026, a $160 million
      Series B in May 2026, and a $106 million Series B1 later that month,
      implying at least $374 million raised before any later extension. Forbes
      quotes management framing the follow-on round as necessary financial
      strength for a regulated financial institution, which fits a carrier model
      that must support underwriting, claims administration, compliance, and
      admitted-paper relationships. Even so, public artifacts do not disclose
      ending cash, statutory capital by entity, reinsurance or cession structure,
      debt, or monthly burn.
    claimRefs: [CI007, CI008, CI009, CI010]
  - id: verdict-and-diligence-blockers
    title: Verdict and diligence blockers
    body: >-
      The underwriting case is stronger on growth velocity than on revenue
      quality. Independent review coverage argues Corgi still lacks a multi-year
      claims history and public payout statistics, while the company's own pages
      stress illustrative limits and variable admitted-paper availability rather
      than realized pricing. That leaves the central insurance questions—loss
      ratio, combined ratio, reserve adequacy, and true customer acquisition
      efficiency—outside the public record. Financially, Corgi looks like a
      well-funded, fast-scaling full-stack carrier, but the next diligence step
      has to move from valuation headlines to statutory, cohort-level, and
      product-level operating data.
    claimRefs: [CI006, CI013, CI014, CI015]
    tableRefs: [TI003]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - [Core startup policies, Direct quote-and-bind coverage through the Startup Program, Policy premium / annual policy, Active; instant quoting marketed for eligible startups, Medium, Provide written premium policy counts and product-level mix.]
      - [AI-company and growth-stage modules, Stage-based package and add-on expansion path, Package premium / endorsement, Active; packaging is public but realized pricing is not, Low, Provide attachment rates average premium and expansion revenue by stage.]
      - [TRRG-underwritten paper, Coverage primarily underwritten by Technology Risk Retention Group, Gross written premium / underwriting margin, Active; public disclosures confirm TRRG role but not ceded-risk economics, Low, Provide gross versus net written premium loss ratio and reinsurance or cession terms.]
      - [Partner-carrier admitted paper, Placement through affiliated or partner carriers rated A- or better when admitted paper is required, Commission / program fee / underwriting split, Active in some states and risks; economics undisclosed, Low, Provide admitted-paper share carrier economics and state or line mix.]
    notes: >-
      Public materials disclose monetization mechanisms and underwriting entities,
      not product-level revenue mix; rows summarize observable revenue pathways
      and the diligence needed to convert them into revenue-quality evidence.
    claimRefs: [CI001, CI004, CI005, CI006, CI016]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Price/unit/contract
      - List vs realized pricing
      - Discounts/unknowns
      - Source
    rows:
      - [Startup Program core lines, Custom quote; no public rate card, Only workflow speed is public; realized premium is undisclosed, Eligibility screening and underwriting review can change outcome, PRNewswire release]
      - [AI-company packages, Illustrative limits retentions and terms; no public premium schedule, Website describes packages rather than binding premiums, Terms vary by jurisdiction and actual policy, AI insurance page]
      - [Stage-based modular coverage, Coverage modules toggled by growth stage; pricing not published, Public pages describe packaging rather than take rate or ARPU, No disclosed bundle discount or expansion pricing, Corgi vs Vouch page]
      - [Admitted-paper placements, Pricing depends on state line and risk characteristics, No disclosed carrier pass-through versus Corgi economics, Availability varies and not all coverages are available through every carrier, About and AI disclaimers]
    notes: >-
      This table is intentionally gap-heavy because Corgi publishes workflow and
      packaging detail, not list pricing or realized premium; nulls are replaced
      with explicit unknowns so pricing opacity is visible to readers.
    claimRefs: [CI001, CI002, CI013, CI014, CI016]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value/null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Early-2026 ARR and customer traction, '>$40M ARR and 40K+ customers across 49 states', Medium, Shows strong demand but traces back to company-sourced disclosures repeated by third parties, Provide audited premium or revenue bridge and cohort retention by product line.]
      - [May 2026 annualized revenue, '~$100M', Medium, Indicates rapid scale-up before the B and B1 rounds, Provide reconciliation between ARR written premium earned premium and recognized revenue.]
      - [2026 projected revenue, '~$450M projected', Low, Suggests aggressive growth assumptions embedded in the private-market narrative, Provide board plan budget assumptions and monthly actuals.]
      - [Disclosed capital raised through B1, '$374M+', High, Sets a floor for external capital raised before later extensions or debt, Provide ending cash statutory capital and restricted-versus-operating cash balances.]
      - [Public gross margin / loss ratio / combined ratio, null, Low, Core underwriting quality is impossible to assess without these metrics, Provide gross and net loss ratio combined ratio reserve development and claims paid data.]
      - [Public CAC / payback / sales efficiency, null, Low, Tests whether instant quoting truly lowers acquisition cost, Provide CAC payback conversion funnel and broker or partner channel economics.]
      - [Public runway / burn, null, Low, Capital adequacy depends on cash burn and required insurance capital not just money raised, Provide monthly burn runway and capital plan by legal entity.]
    notes: >-
      Values mix company statements and third-party aggregation; null means the
      metric is not publicly disclosed rather than economically irrelevant.
    claimRefs: [CI009, CI011, CI012, CI013, CI015]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports the commercial workflow from startup demand trigger
      to policy binding, but not the final split between retained underwriting
      margin and fee-based economics.
    data:
      nodes:
        - id: trigger
          label: Fundraising, hiring, or enterprise-contract trigger
          note: Public materials position insurance purchase around startup growth milestones and customer requirements.
        - id: intake
          label: Online intake
          note: The Startup Program starts with a short online application.
        - id: decision
          label: Instant quote or underwriting review
          note: Eligible companies receive an instant quote; others route to underwriting review.
        - id: selection
          label: Coverage and limits selection
          note: Core disclosed lines include D&O, cyber, tech E&O, EPLI, HNOA, fiduciary, media liability, and general liability.
        - id: bind
          label: Bind coverage and issue COIs
          note: Same-day binding and immediate COI access are central to the public GTM pitch.
        - id: economics
          label: Premium and fee economics across carrier, TRRG, and partner paper
          note: Public pages disclose multiple entities but not revenue mix, commissions, cessions, gross margin, or loss ratio.
    approximationNotes: >-
      The bridge reflects disclosed workflow steps and entity roles, not a
      quantified margin waterfall; public sources do not expose premium mix or
      profitability by node.
    claimRefs: [CI001, CI002, CI004, CI005, CI006]
callouts:
  - calloutType: risk
    title: Underwriting proof still lags valuation pace
    body: >-
      Public sources are rich on fundraising and workflow speed but thin on loss
      ratios, claims paid, reserve development, or GAAP/statutory revenue
      bridges.
    claimRefs: [CI009, CI012, CI015]
  - calloutType: insight
    title: The model can compress sales cycles
    body: >-
      If the instant-quote workflow works at scale, Corgi may turn insurance from
      a broker-led friction point into a faster product motion for venture-backed
      startups.
    claimRefs: [CI002, CI003, CI016]
