      - number: '1.4'
        title: 本章成为完整事实底稿前仍未核实的内容
        blocks:
          - type: paragraph
            body: >-
              本章足以锚定公司身份、创始人姓名、承保结构和官方 2026 年 5
              月融资事件，但若不加限定，尚不足以锚定当前规模或治理质量。指定资料池没有经审计财务数据、赔付率或综合成本率披露、理赔主张经验、再保险结构、资本充足率细节或公开董事会名单。资料中还存在关于创始人身份、网站、ARR、客户数、员工数和最新估值的相互冲突的第三方摘要。后续章节应复用这里已核实的事实，但除非各自资料池出现更强的来源类型，否则必须保留对规模和承保表现的不确定性。
