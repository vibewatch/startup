          - type: paragraph
            body: >-
              公开融资证据呈现的是：融资轮次加速，但外部承保披露仍有限。与公司相关的 1 月来源称，Corgi 在监管批准后已融资 $108M，ARR 已超过 $40M；第三方目录则将当时融资估值置于 $630M。随后
              Forbes 报道，5 月 28 日的 $106M Series B1 使估值升至 $2.6B，而几周前完成的 $160M Series B 估值为 $1.3B。Silicon Valley Invest
              Club 后续融资摘要将估值推至报道的 $4.0B，累计融资超过 $374M，但也警告该估值来自报道，并非公司确认。


              这套证据基础直接关系到入场纪律。公开档案最能说明融资速度，却最难说明定价机制：没有公开股权结构表、清算优先权（优先股堆叠）、内部人按比例认购细节，或能可靠地将 ARR
              类指标桥接到承保商价值创造的数据。即使同一份融资摘要也提醒，财务数字混合了公司披露和第三方估算，可能采用不同的 ARR 或收入定义。因此，在估值工作中，可以描述上行案例，但下行空间只能用很宽的误差区间来界定。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV013
              - CV014
      - number: '8.3'
        title: 情景区间与回报逻辑
        blocks:
          - type: paragraph
            body: >-
              乐观情景是：Corgi 正在打造一项稀缺资产——一家能直接为初创企业保险报价、出单和提供管理服务，并在客户需要时增加获准承保渠道的 AI
              原生承保商。如果公司能将这一结构转化为持久的承保表现、更快的出单速度，以及向相邻险种盈利扩张的能力，那么私人估值的快速上升可能是一个品类定义型保险商正在形成的早期信号。公开证据还显示，公司正在积极包装 AI
              风险，并推出更广泛的 2026 年 1 月初创企业项目，这支持产品广度在扩大而非收窄的判断。


              基准和悲观情景取决于估值上涨中有多少是叙事、多少是持久经济性。官方披露明确，部分保障通过 TRRG 结构运行，这些结构不受所有州保险法约束，也没有州担保基金支持；Simplify
              的评论则把扩张和州层面的反弹列为观察事项。在没有公开损失率、准备金、再保险或留存群组数据的情况下，审慎的基准情景应假设仅凭融资牵引力不足以支撑追逐最新估值；悲观情景则假设，一旦承保结果和资本结构接受检验，下轮融资或持平轮融资都会变得合理。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV012
              - CV013
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              退出准备度目前仍更多是愿景，而非已有证据。公开记录显示了真实的产品化、广泛的投资人阵容和足以支持继续私募融资的融资节奏，但尚未展示高确信度后期保险投资所需的披露包。对承保商而言，估值必须锚定保费质量、损失发展、准备金充足性、再保险结构和续约行为，而不能只看
              ARR 类比或客户数标题。上述核心保险经济性在这里都没有公开可得。


              最可能改变建议的尽调要求很具体。第一，取得经审计或董事会层面的财务数据，将 ARR 类表述桥接到毛承保保费、已赚保费、损失率、综合成本率和现金生成。第二，检查当前股权结构表，以及 2026
              年各轮融资中的全部优先权、延期和内部人配额条款。第三，审查州可用性、获准承保文件占比、TRRG
              使用情况、再保险对手方，以及与扩张相关的监管沟通。如果这些材料能以明显更好的入场价格支持承保持久性，建议可以上调；在此之前，论点破坏风险仍高。
            claimRefs:
              - CV007
              - CV008
              - CV010
              - CV011
              - CV013
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 跟踪，不追价
            body: Corgi 的公开产品和融资证明足以让它留在主动观察名单中，但公开承保或资本结构披露不足以支持按最新报道的私人市场估值买入。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV010
              - CV011
          - type: callout
            title: 保险结构风险比 SaaS 式 ARR 表象更重要
            body: TRRG 的使用、获准承保文件约束，以及公开损失率或准备金数据缺失，意味着下行空间可能比顶线估值标题暗示的更快扩大。
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV011
              - CV013
          - type: callout
            title: 故事跑在证明之前
            body: 公开来源始终支持速度、产品广度和融资需求，但尚未弥合一个引人注目的保险科技叙事与一家具备完整承保依据的后期承保商估值之间的差距。
            calloutType: insight
            claimRefs:
              - CV003
              - CV006
              - CV009
              - CV010
              - CV011
