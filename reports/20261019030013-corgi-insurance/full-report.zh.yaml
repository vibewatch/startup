              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.3'
        title: 持久性有一定可能，但老牌公司仍掌握信任和规模优势
        blocks:
          - type: paragraph
            body: >-
              护城河叙事可信但不完整。当买方重视初创企业和 AI 专属工作流时，Corgi 看起来确有差异化；但保留的证据也指出了老牌公司的主要切入口：对承保文件本身及其背后资产负债表的信任。QuoteSweep
              强调，TRRG 承保文件没有州担保基金支持和 AM Best 评级；Corgi 自己的 About 页面则称，必要时会使用获准的 A 级合作承保文件。Corgi
              可以为部分账户切换到更强的承保文件，但这也说明仅靠“全栈”速度，未必能解决企业客户或采购部门的疑虑。Next 构成了更大的威胁。Munich Re
              的收购将一家拥有自动化承保、大量客户和深厚老牌资本的规模化数字保险商带入同一美国商业保险市场。因此，最可信的替代风险不只是初创企业模仿者，而是得到资本支持的保险商或分销商，以数字体验叠加更广泛的获准承保信任和既有分销网络。
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP008
              - CP012
              - CP015
