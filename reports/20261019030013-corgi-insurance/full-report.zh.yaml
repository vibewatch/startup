      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 承保控制才是真正的同业切入点
            body: 保留的证据始终支持这样的判断：Corgi 最强的竞争主张是控制承保工作流、保单设计和理赔管理，而不只是改善经纪商 UX。
            calloutType: strength
            claimRefs:
              - CP001
              - CP003
              - CP011
          - type: callout
            title: 承保文件信任仍是老牌公司的切入口
            body: 需要获准、具评级的承保文件，或只是偏好独立保险商资产负债表的买方，仍有理由选择由老牌公司支持或经纪商比价的替代方案，而不是 TRRG 主导的安排。
            calloutType: risk
