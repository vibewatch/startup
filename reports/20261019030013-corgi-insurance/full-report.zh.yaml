            body: >-
              资本增长快于公开经营披露。公开报道支持这样的融资路径：2026 年 1 月 Seed 和 Series A 合计 $108 million，2026 年 5 月 Series B $160
              million，同月稍晚 B1 轮 $106 million；在任何后续扩展融资前，累计融资至少达到 $374 million。Forbes
              引述管理层称，后续融资是受监管金融机构所需的财务实力，这与必须支持承保、理赔管理、合规和获准承保关系的承保商模式相符。即便如此，公开材料没有披露期末现金、各实体的法定资本、再保险或分保结构、债务或月度现金消耗。
