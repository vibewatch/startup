            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM010
              - CM011
              - CM014
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 保险购买节点由里程碑触发
            body: 跨来源最强的共同模式是：初创企业在融资、增加董事、签署企业合约或进入 AI 敏感型工作流时才会产生保险支出；这个市场更像在触发事件发生时购买的基础设施，而不是固定的年度 SaaS 预算项目。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM008
          - type: callout
            title: 规模测算仍偏宣传性，且依赖代理指标
            body: 指定资料池中的每个市场数字，要么来自公司，要么只有很弱的交叉佐证。没有独立 TAM 研究、经纪商基准或公开损失和留存数据，本章可以支持市场边界逻辑和价格代理值，但无法支撑可辩护的市场份额模型。
            calloutType: risk
            claimRefs:
              - CM010
              - CM012
              - CM013
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 按竞争者类别看格局，而不是一组平铺的同业
        blocks:
          - type: paragraph
            body: >-
              保留的资料显示，Corgi 面对的不是一个同质化的“保险科技竞争者”市场。市场可分为直接服务初创企业的专业公司、更广泛的数字保险商，以及经纪商撮合或通用 SMB 承保商等替代购买路径。Corgi 自己的对比页面将
              Vouch 定位为最接近的初创企业专业经纪商，而其他官方对比页面则把 Corgi 与更广泛的数字经纪商和小企业承保商相比较，而不只是与获风投支持的同业相比。独立证据也强化了这一分层。QuoteSweep 将
              Corgi 描述为纵向整合集团，其相对于经纪商模式的结构性差异在于控制关联承保文件和理赔主张运营。相比之下，TechCrunch 和 ERGO 将 Next Insurance 定位为面向更广泛美国 SMB
              市场的规模化数字保险商。实际而言，买方权衡的是初创企业专属工作流适配度、承保文件结构、分销广度和资本深度，而不是简单挑选看起来最好的前端报价流程。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP007
              - CP008
              - CP010
              - CP013
              - CP015
              - CP016
