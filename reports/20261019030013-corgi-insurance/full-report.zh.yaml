          valueNote: 相比标准 SaaS 理赔主张，AI 工作流增加了输出、溯源和监管暴露。
          claimRefs:
            - CM005
            - CM014
        - label: 当前观察到的需求代理指标
          displayValue: $40M+ ARR
          valueNote: 2025 年 7 月获得监管批准后由公司披露的经常性收入；这是业务进展的证据，不代表完整市场规模。
          claimRefs:
            - CM011
    approximationNotes: 指定来源池只有顶层和底层具备明确数值。中间层是有来源支撑的边界筛选条件和采用触发点，因为来源池没有针对初创企业商业保险的独立 TAM/SAM/SOM 研究。
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM010
      - CM011
      - CM014
  - id: FP001
    title: 竞争定位图：承保控制力（x）对初创企业适配度（y）
    type: quadrant
    summary: 最有证据支撑的划分，是承保控制力 / 保险牌照归属与初创企业专属工作流适配度，而不是“好竞争者”和“坏竞争者”之分。
    data:
      points:
        - label: Corgi
          x: 5
          'y': 5
          tone: positive
          note: 全栈承保和理赔主张控制，加上面向初创阶段的产品组合。
        - label: Vouch
          x: 2
          'y': 4
          tone: neutral
          note: 聚焦初创企业的经纪商模式，依赖第三方保险公司的承保牌照。
        - label: NEXT Insurance
          x: 4
          'y': 2
          tone: opportunity
          note: 大型数字保险公司，提供自动化承保和定价，并获 Munich Re 支持。
        - label: 数字经纪商类别
          x: 2
          'y': 3
          tone: neutral
          note: 面向科技公司的保险覆盖，但不掌握保险公司自有的承保控制权。
        - label: 综合型 SMB 保险公司
          x: 1
          'y': 1
          tone: low
          note: 面向广泛市场的小企业保险，初创企业专属适配度较弱。
        - label: 传统获准经营保险公司
          x: 5
          'y': 1
          tone: warning
          note: 牌照可信度信号最强，但从保留证据看速度更慢、针对初创企业的程度也更低。
    approximationNotes: 1–5 的序数坐标综合了商业模式、牌照结构和初创企业适配度方面的引证证据；它们用于相对定位，不是实测基准分数。
    claimRefs:
      - CP010
      - CP011
      - CP012
      - CP013
  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 公开证据支持从初创企业需求触发到保单承保的商业流程，但不足以判断留存承保利润与费用型收入的最终拆分。
    data:
      nodes:
        - id: trigger
          label: 融资、招聘或企业合同触发点
          note: 公开材料将保险采购放在初创企业增长里程碑和客户要求的背景下。
        - id: intake
          label: 在线录入
          note: Startup Program 从一份简短的在线申请开始。
        - id: decision
          label: 即时报价或承保审核
          note: 符合条件的公司可获得即时报价；其他公司则转入承保审核。
        - id: selection
          label: 保险覆盖与限额选择
          note: 已披露的核心险种包括 D&O、网络安全险、科技 E&O、EPLI、HNOA、受托责任险、媒体责任险和一般责任险。
        - id: bind
          label: 绑定保险并签发 COI
          note: 当日绑定和即时获取 COI 是其公开 GTM 叙事的核心。
        - id: economics
          label: 保险公司、TRRG 与合作伙伴牌照之间的保费和费用经济性
          note: 公开页面披露了多个实体，但没有披露收入构成、佣金、分出保费、毛利率或赔付率。
    approximationNotes: 这张桥接图反映已披露的工作流步骤和实体角色，不是量化的利润瀑布；公开来源没有按节点披露保费构成或盈利能力。
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI005
      - CI006
  - id: FE001
    title: 有公开证据支撑的产品架构图
    type: stack
    summary: 公开证据支持一套从录入到绑定的运营栈，覆盖录入、承保、保险公司路由、保险模块和保单服务；但没有形成详尽的 API 或基础设施架构文档。
    data:
      layers:
        - label: 买方触发点
          detail: 合同、融资、审计或董事会事件催生有时效要求的保险需求。
        - label: 录入与分流
          detail: 创始人回答一组简短问题，随后被分流到即时报价或承保审核。
        - label: 承保引擎
          detail: AI 辅助的内部承保和风险建模支撑“几分钟报价”的主张。
        - label: 保险公司 / 牌照路由
          detail: 保险覆盖可能根据州别、险种和风险，经由 TRRG、获准经营的关联公司或合作保险公司承保。
        - label: 保险覆盖模块
          detail: D&O、Tech E&O、Cyber、EPLI、Media、Fiduciary、HNOA、CGL 和 AI 责任模块可按公司阶段组合。
        - label: 保单服务与理赔
          detail: 保单文件、COI、保单服务和理赔管理都被呈现为同一平台的一部分。
    approximationNotes: 这是根据指定来源重构的公开运营栈，不是内部软件组件或系统边界的直接架构图。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE010
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据描绘了一条围绕限时采购、直接绑定和按公司阶段模块化扩展的初创企业买方旅程。
    data:
      nodes:
        - label: 融资或董事会触发点
          stage: Trigger
          actor: Founder, CFO, board, or outside counsel
          touchpoints:
            - Institutional capital or board formation makes D&O a diligence item.
            - Governance requirements start before public-company scale.
        - label: 企业或 AI 风险触发点
          stage: Qualification
          actor: Founder, legal, procurement, or security lead
          touchpoints:
            - Enterprise contracts require proof of insurance.
            - AI buyers need coverage for model output and training-data risk.
        - label: 简短录入与报价路径
          stage: Quoting
          actor: Founder or operations lead
          touchpoints:
            - Start a quote online and answer a short set of questions.
            - Eligible companies can receive an instant quote.
        - label: 直接绑定或承保人审核
          stage: Binding
          actor: Corgi underwriting and the startup buyer
          touchpoints:
            - Corgi says it can quote and bind directly as a licensed carrier.
            - Same-day binding is positioned as typical in most cases, subject to underwriting.
        - label: 保险证明交付结果
          stage: Customer proof
          actor: Enterprise customer or startup operator
          touchpoints:
            - Eligible buyers can bind coverage and access policy documents or COIs.
            - Artisan says coverage was bound in two days for enterprise demand.
        - label: 模块化扩展，但持久性披露有限
          stage: Ongoing relationship
          actor: Finance and risk owner
          touchpoints:
            - Coverage can expand from pre-seed to Series A and growth-stage packages.
            - Public evidence does not disclose NRR, GRR, or concentration metrics.
    approximationNotes: 该顺序反映检索来源描述的常见购买路径，不是带有已披露转化率的实测漏斗。
    claimRefs:
      - CU004
      - CU005
      - CU007
      - CU008
      - CU016
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 公开证据显示，Corgi 的主要风险集中在保险公司结构、承保能力依赖和资本市场纪律，而不是产品需求。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余风险
      rows:
        - label: TRRG / 保险保障基金缺口
          values:
            - label: 中
              score: 3
              note: TRRG 可以承保，但州保险保障基金无法提供保障。
            - label: 高
              score: 5
            - label: 中等
              score: 3
            - label: 高
              score: 5
        - label: 依赖获准经营的牌照保险公司
          values:
            - label: 中
              score: 3
              note: 可用性会因州别、险种和风险特征而异。
            - label: 高
              score: 5
            - label: 中等
              score: 3
            - label: 中高
              score: 4
        - label: 披露之前的估值重估
          values:
            - label: 高
              score: 4
              note: 公开估值从 1.3B 升至 2.6B，之后又据报道超过 4B。
            - label: 高
              score: 5
            - label: 低至中等
              score: 2
            - label: 高
              score: 5
        - label: 即时报价资格错配
          values:
            - label: 中
              score: 3
              note: 并非所有申请人都有资格获得即时报价。
            - label: 中高
              score: 4
            - label: 中等
              score: 3
            - label: 中
              score: 3
        - label: 扩张与理赔流程复杂度
          values:
            - label: 中高
              score: 4
              note: 新垂直领域和理赔管理扩大了执行范围。
            - label: 高
              score: 5
            - label: 低至中等
              score: 2
            - label: 高
              score: 5
        - label: 文化 / 控制压力
          values:
            - label: 中
              score: 3
              note: 每周七天到岗文化和多城市招聘压缩了管理余量。
            - label: 中高
              score: 4
            - label: 低至中等
              score: 2
            - label: 中高
              score: 4
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR008
      - CR010
      - CR013
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 公开证据支持商业化势头，但估值上升速度和保险结构复杂度使建议仍停留在跟踪。
    data:
      nodes:
        - id: proof
          label: 产品验证
          detail: Startup Program 和即时报价展示了真实的商业化引擎。
        - id: scale
          label: 规模标志
          detail: 与公司相关的来源称 ARR 超过 $40M，且覆盖广泛的初创企业客户。
        - id: structure
          label: 保险公司结构
          detail: 直接保险公司定位，加上 TRRG 和获准经营牌照路径，可能构成护城河。
        - id: constraints
          label: 结构性约束
          detail: TRRG 披露和按州别变化的可用性限制，增加了监管和理赔主张兜底的复杂度。
        - id: pricing
          label: 定价张力
          detail: 公开估值参考的重定价速度，远快于公开披露保险公司经济性的速度。
        - id: outcome
          label: 结论
          detail: 在承保、资本结构和入场价格尽调补上缺口之前，继续跟踪。
      edges:
        - from: proof
          to: scale
        - from: scale
          to: structure
        - from: structure
          to: constraints
        - from: constraints
          to: pricing
        - from: pricing
          to: outcome
        - from: scale
          to: pricing
    approximationNotes: 这是证据链而非概率模型；它排列了主要估值驱动因素，但不推断转化率或数值权重。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
      - CV011
      - CV013
