        - 经验证的承保转化、续约和损失数据，可将这一点从“有希望的证明”提升为持久的价值证据。
      - - 投资逻辑：结构性护城河
        - 保险公司审批，加上 TRRG 和认可保险凭证路径，可能构成比纯经纪模式更难复制的承保 / 分销体系。
        - 顺畅的多州扩张证据和持久的再保险能力，将确认这道护城河。
      - - 反向逻辑：估值跑在披露之前
        - 融资路径在数月内将估值从 $630M 重定价至 $2.6B，之后又据报道达到 $4.0B，但没有公开保险公司经济性披露。
        - 经审计的承保经济性或明显更低的进入价格，将收窄这一担忧。
      - - 反向逻辑：监管与资本复杂度
        - 官方页面披露了 TRRG 使用情况和按司法辖区划分的保障限额；外部评论则指出，随着扩张扩大，部分州可能出现阻力。
