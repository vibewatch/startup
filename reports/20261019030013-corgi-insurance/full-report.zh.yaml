chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、产品范围与承保结构
        blocks:
          - type: paragraph
            body: >-
              Corgi 的官方材料始终将公司定位为面向初创企业和科技公司的 AI 原生全栈保险平台或承保商，而不是泛化的经纪市场。当前首页和 AI 专属产品页强调即时报价、符合条件时当天出单，以及覆盖从 pre-seed
              到成长期的模块化方案。这一定位对后续尽调章节很重要：Corgi
              属于受监管的保险工作流业务，其速度主张依赖于掌握更多承保和保单服务环节，而不只是提供软件前端。其法律结构也比营销口径更复杂，因为官方页面称，承保可能由 Technology Risk Retention
              Group 或获准合作承保商提供，而 Corgi Insurance Services 担任持牌经纪人和项目管理人。
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
              - CO010
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
              - CO008
              - CO009
              - CO012
              - CO013
      - number: '1.2'
        title: 管理层可见度、治理深度与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              指定资料池明确点名的核心运营者只有两位：联合创始人 Nico Laqua 和 Emily Yuan。官方及联合发布的公司材料反复将 Nico 置于对外发言人位置，并确认 Emily 是联合创始人兼
              COO；但资料没有提供独立董事名单、委员会架构或更完整的运营团队名册，投资人无法据此判断授权和分工深度。这一披露缺口很重要，因为公司一方面宣称承保、产品扩张和融资速度异常快，另一方面公开可见的领导层仍高度集中于创始人。因而，本章可以把创始人身份视为已核实事实，但治理韧性和人才梯队仍应作为开放的尽调问题，而非已解决的事实。
            claimRefs:
              - CO002
              - CO011
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO011
      - number: '1.3'
        title: 融资路径、利益相关方集中度与规模信号
        blocks:
          - type: paragraph
            body: >-
              指定资料池中最强的已核实融资事实，是官方于 2026-05-07 发布的 Series B 公告：由 TCV 领投，融资 $160 million，估值 $1.3 billion，当时累计融资超过 $268
              million。后续公开报道继续延伸这一故事：Forbes 称 Corgi 在 B1 轮又融资 $106 million，估值达到 $2.6
              billion；而低置信度的目录和融资摘要资料则给出更高的估值、收入、客户和员工数。这些后续数字有助于判断市场对公司的重估幅度，但不等于公司确认的当前经营指标。资料池中，TCV 是最明确的经济利益相关方；TRRG
              和获准合作承保商则是最重要的非股权运营对手方。
