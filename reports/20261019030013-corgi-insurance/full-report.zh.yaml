        blocks:
          - type: paragraph
            body: >-
              最高优先级的风险是结构性的，而不只是商业风险：Corgi 自己的页面称，保障可以通过 Technology Risk Retention Group
              承保，而获准承保文件取决于合作承保商；同一批披露还称，可用性因州、险种和风险类别而异。模式顺利运行时，这会带来真实的执行杠杆；但也意味着整本保单的法律保护、破产兜底和承保能力并不统一。第二项风险是资本市场纪律：公开证据显示，Corgi
              从 2026 年 5 月 6 日估值 $1.3 billion 的 Series B，跃升至 5 月 28 日估值 $2.6 billion 的 Series B1；第三方追踪者后来又发布了 $4 billion
              和超过 $5 billion 的报道估值。第三项风险是运营控制成熟度，因为公司在扩大产品范围、跨城市招聘和开拓新垂直领域的同时，仍没有公开披露赔付率、再保险或安全控制。
