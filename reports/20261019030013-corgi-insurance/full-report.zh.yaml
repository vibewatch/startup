        - Corgi 将快速报价和保险公司控制力转化为持久的承保利润，顺利扩展到相邻险种，并验证 AI 驱动的理赔主张和服务效率。
        - 如果承保杠杆和保费增长的复合速度快于在位公司应对速度，最新私募估值可能证明过于保守。
        - 赔付准备金充足性、对再保险的依赖和州级审批复杂度仍然重要。
        - 需要经审计的经济性和续约行为，而当前公开证据尚未达到这一要求。
      - - 基准
        - 商业牵引力真实存在，但承保指标趋于正常，投资人会要求更传统的保险公司披露，才会支持下一轮大幅提价。
        - 回报取决于以低于最新据报道估值的价格进入，或获得结构化下行保护。
        - ARR / 收入定义混杂、优先股堆叠不确定，以及监管执行风险。
        - 与当前公开证据集最一致。
      - - 悲观
        - 增长跑在承保能力得到验证之前，州别或产品复杂度拖慢扩张；一旦真实的保险经济性浮出水面，后续融资可能重置估值。
        - 2026 年重定价周期带来的表面光环，会被持平轮或下行轮抹掉。
        - 赔付率、准备金发展或监管摩擦都可能迫使估值重置。
        - 如果尽调无法核实承保表现和清晰的融资条款，这种情形更可能发生。
    notes: 由于公开记录缺少经审计的保费、赔付率、准备金和股权表数据，无法建立更精确的定价回报模型，因此情景区间仅作定性判断。
