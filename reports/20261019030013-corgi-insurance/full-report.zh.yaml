              列为核心承保载体。但同一 AI 产品披露给出了更尖锐的风险信号：TRRG 承保文件不受所有州保险法约束，这些保单也无法享受州担保基金；获准承保文件则要根据司法辖区和风险特征，通过关联或合作承保商取得。对 AI
