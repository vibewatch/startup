      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 承保速度确实存在，但承保商复杂度才是隐藏的尽调问题
            body: >-
              Corgi 的卖点建立在更快的报价和出单之上，但同一批官方页面也称，承保文件可能来自 TRRG
              或获准合作承保商，且可用性仍取决于司法辖区和承保审批。因此，尽调问题不只是报价速度，还包括资本、承保商组合、再保险和理赔治理是否足以支撑增长叙事。
            calloutType: risk
            claimRefs:
              - CO004
              - CO014
          - type: callout
            title: 市场重估比经营规模更容易核实
            body: >-
              官方 2026 年 5 月 Series B 和 Forbes 后续 B1
              报道都强烈暗示估值快速上升，但指定资料池对当前客户数、收入质量、理赔主张表现和员工数的证据弱得多。仅凭这些来源，投资人可以更快评估融资路径，却无法同样快地评估经营韧性。
            calloutType: insight
            claimRefs:
              - CO006
              - CO008
              - CO009
              - CO013
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入的支出
        blocks:
          - type: paragraph
            body: >-
              指定资料池中最强的证据将 Corgi 的市场定义为面向科技公司和初创企业的商业保险，而不是泛 SMB 或个人险机会。在 About 页面、发布公告和产品页面中，Corgi
              都将自身描述为覆盖承保、保单设计、服务和理赔的全栈运营模式，险种包括 D&O、Tech E&O 或 AI
              责任险、网络险、CGL、HNOA、受托人责任险及相邻商业险种。这一点很重要，因为市场边界由初创企业的工作流需求——融资、企业尽调、治理和产品风险——决定，而不是由某一个保单 SKU 决定。资料池中最宽泛的数字是
              Corgi 自称保险行业规模为 "$1T+"，但这属于雄心表述，并非可辩护的初创保险 TAM。因此，证据支持的是先定义边界的市场框架，而不是自上而下的市场规模模型。
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
      - number: '2.2'
        title: 买方路径、需求驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              这一品类的需求似乎由里程碑驱动，而不是单纯按年度发生。First Citizens 和 SVB 将保险置于运营准备、融资、招聘和客户获取的一部分；Corgi 的 D&O
              指南则称，初创企业在筹集机构资本、增加独立董事或签署引发治理审查的合同时，就会需要保险。公司发布的对比页面将同一逻辑延伸到软件和 AI 工作负载：企业 MSA、网络安全尽调等信任建设，以及模型风险，会推动创始人在
              D&O 之外购买 Tech E&O、网络险和 AI
              专属责任险。由此，买方、使用者和付款方很少是同一个人。创始人和财务负责人可能发起支出，但董事会、企业客户、审计师和银行合作方都可能实际强制采用。这使渠道触达和出单速度与价格同等重要。
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM008
              - CM013
      - number: '2.3'
        title: 受证据约束的规模测算与估值相关性
        blocks:
          - type: paragraph
            body: >-
              本章的规模证据有用但范围窄。Corgi 披露称，在 2025 年 7 月监管批准后 ARR 超过 $40 million，这能证明存在真实需求，却不能说明市场上限。公司发布的 AI
              初创企业指南又给出了分阶段的价格代理值：pre-seed 方案 $2,000 至 $5,000，Series A 方案 $5,000 至 $15,000，说明保险支出能够纳入风投支持的软件公司的预算。AIFI
              Map 提供了更宽的触达代理值：覆盖 49 个州、40K+
              客户；但同一页面与官方披露的创始人身份、网站和员工数冲突，因此不应作为估值级模型的锚点。最终得到的是受证据约束的规模阶梯：足以说明支出如何进入初创企业工作流，但不足以在没有独立经纪商、监管机构或上市公司基准的情况下拆分
              TAM、SAM 或可持续份额。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
