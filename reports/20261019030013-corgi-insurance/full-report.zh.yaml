            body: >-
              建议是**跟踪**，而不是按最新公开参考价格投资。公开来源显示，Corgi 的估值从 2026 年 1 月的 $630M 参考值，快速升至 4 月下旬 $1.3B 的 Series B，再到 5 月 28 日
              $2.6B 的 Series B1；2026 年 7 月，第三方登记资料又显示 $4.0B
              的估值标记。这一速度说明投资人胃口强劲，但也意味着价格发现由融资速度主导，而不是由已披露的承保经济性主导。最强的公开收入数据点仍来自与公司关联的陈述和口径不一的第三方汇编，而非经审计的保费、损失率、综合成本率或准备金披露。


              现有证据足以相信 Corgi 确有产品市场牵引力：2026 年 1 月发布材料显示核心初创企业险种支持即时报价，公司则称在 2025 年 7 月承保批准后 ARR 超过 $40M。问题不在于 Corgi
              是否有势头，而在于新资金进入的价格是否为承保失误、监管摩擦或未来重置留下空间——届时私人投资人可能要求更传统的保险承保商证明。在尽调补齐这些缺口之前，估值支撑仍显吃紧，而非具备投资吸引力。
