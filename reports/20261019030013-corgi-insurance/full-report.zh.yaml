              - CP010
              - CP013
              - CP015
              - CP016
      - number: '3.2'
        title: 差异化来自承保控制和工作流设计
        blocks:
          - type: paragraph
            body: >-
              Corgi 最有证据支持的差异化来自结构和工作流，而不是价格。官方页面反复强调即时报价、当天出单、模块化方案和按初创阶段设计的保障，尤其面向软件和机器学习公司。              官方对 Vouch
              的比较将经纪商模式归于 Vouch，并明确称外部承保商的时限仍会影响其流程。QuoteSweep
              则给出了更重要的经济解释：真正的差异在于，以关联承保文件为基础，减少交接并加强承保控制，而不是在市场上比价后再安排承保。需要快速完成融资、招聘或企业合约的创始人，会把这视为重要的购买标准差异。证据无法证明的是价格领先。Corgi
              发布的预计年度方案价格为：pre-seed 和 seed 公司 $2,000-$5,000，Series A 公司 $5,000-$15,000；但保留的来源没有提供
              Corgi、Vouch、Next、Embroker、Thimble 或获准承保商现有方案之间可比的报价篮子。因此，公开记录更能支持方案和流程比较，而非净成本结论。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP011
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
