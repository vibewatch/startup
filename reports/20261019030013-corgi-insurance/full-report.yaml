      - number: '6.2'
        title: Adoption proof and procurement speed
        blocks:
          - type: paragraph
            body: >-
              Public adoption proof is real but uneven. Company-controlled materials and a startup profile both point to
              named customers such as Deel, Artisan, and Eragon, while independent Forbes reporting at least confirms
              Deel as a customer example. The strongest recurring signal is not a cohort chart or renewal table; it is
              procurement velocity. Corgi's own pages repeatedly emphasize instant quoting, direct binding, and same-day
              or two-day turnaround when coverage is blocking a contract or financing event. That fits the category
              economics of startup insurance, where the immediate value proposition is often unblocking revenue,
              fundraising, or partner diligence rather than demonstrating a mature multi-year claims history.
            claimRefs:
              - CU004
              - CU005
              - CU007
              - CU010
              - CU012
              - CU013
