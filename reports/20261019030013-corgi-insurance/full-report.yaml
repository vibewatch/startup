  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Public evidence supports commercialization momentum, but valuation velocity and insurance-structure complexity
      keep the recommendation at track.
    data:
      nodes:
        - id: proof
          label: Product proof
          detail: Startup Program and instant quoting show a real commercialization engine.
        - id: scale
          label: Scale markers
          detail: Company-linked sources report ARR above $40M and broad startup reach.
        - id: structure
          label: Carrier structure
          detail: Direct carrier positioning plus TRRG and admitted-paper pathways can be a moat.
        - id: constraints
          label: Structural constraints
          detail: TRRG disclosures and state-by-state availability limits add regulatory and claims-backstop complexity.
        - id: pricing
          label: Pricing tension
          detail: Public valuation references repriced much faster than public carrier economics were disclosed.
        - id: outcome
          label: Outcome
          detail: Track until underwriting, capital-structure, and entry-price diligence close the gap.
      edges:
        - from: proof
          to: scale
        - from: scale
          to: structure
        - from: structure
          to: constraints
        - from: constraints
          to: pricing
        - from: pricing
          to: outcome
        - from: scale
          to: pricing
    approximationNotes: >-
      This is an evidence chain rather than a probabilistic model; it orders the main valuation drivers but does not
      infer conversion rates or numeric weights.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
      - CV011
      - CV013
