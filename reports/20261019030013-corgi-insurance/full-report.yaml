  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying triggers
        blocks:
          - type: paragraph
            body: >-
              The retrieved evidence consistently points to a focused customer base rather than a broad small-business
              audience. Corgi describes itself as an AI-native, full-stack platform for technology companies and frames
              its product around underwriting, policy design, servicing, and claims administration in one workflow,
              which matters because startup buyers often purchase insurance under deadline rather than as a
              discretionary annual review. The most concrete demand triggers in the public record are fundraising, board
              formation, enterprise procurement, and AI-specific liability concerns such as model output, training-data
              disputes, and customer-contract requirements. That makes the buyer/user/payer pattern look like founder,
              finance, legal, and security stakeholders inside venture-backed software and AI companies, with governance
              buyers becoming more important as firms raise institutional capital or add outside directors.
            claimRefs:
              - CU001
