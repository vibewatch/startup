chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and underwriting structure
        blocks:
          - type: paragraph
            body: >-
              Corgi's official materials consistently frame the company as an AI-native, full-stack insurance platform
              or carrier built for startups and technology companies, rather than as a generic broker marketplace. The
              current homepage and AI-specific product page emphasize instant quoting, same-day binding where eligible,
              and modular packages aligned to startup stages from pre-seed through growth. That positioning matters for
              later diligence chapters: this is a regulated insurance workflow business whose speed claim depends on
              controlling more of underwriting and servicing, not just a software front end. The legal structure is also
              more complex than the marketing shorthand suggests, because official pages say coverage may sit with
              Technology Risk Retention Group or admitted partner carriers while Corgi Insurance Services acts as the
              licensed producer and program administrator.
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
              - CO010
              - CO014
