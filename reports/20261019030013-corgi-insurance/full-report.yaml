        title: Evidence-constrained sizing and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The chapter's sizing evidence is useful but narrow. Corgi disclosed ARR above $40 million after July 2025
              regulatory approval, which demonstrates live demand but not the market ceiling. Company-issued AI-startup
              guidance adds stage-price proxies of $2,000 to $5,000 for pre-seed packages and $5,000 to $15,000 for
              Series A packages, suggesting insurance can fit venture-backed software budgets. AIFI Map contributes a
              broader reach proxy of 40K+ customers across 49 states, but the same page conflicts with official
              disclosures on founder identity, website, and employee count, so it should not anchor a valuation-grade
              model. The result is an evidence-constrained sizing stack: enough to show how spend enters the startup
              workflow, but not enough to isolate TAM, SAM, or durable share without independent broker, regulator, or
              public-company benchmarks.
