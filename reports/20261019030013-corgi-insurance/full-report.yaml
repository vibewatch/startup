      - number: '3.3'
        title: Durability is plausible, but incumbents still own the trust and scale flank
        blocks:
          - type: paragraph
            body: >-
              The moat case is credible but incomplete. Corgi appears differentiated when the buyer values startup- and
              AI-specific workflows, yet the retained evidence also identifies the main opening for incumbents: trust in
              the underlying paper and the balance sheet behind it. QuoteSweep highlights that TRRG paper lacks state
              guaranty-fund backing and AM Best ratings, while Corgi's own about page says admitted A-rated partner
              paper is used when required. That means Corgi's product can flex into stronger paper for some accounts,
              but it also suggests that "full-stack" speed alone may not settle enterprise or procurement objections.
              Next illustrates the larger threat. Munich Re's acquisition brings a scaled digital insurer with automated
              underwriting, large customer base, and deep incumbent capital into the same U.S. commercial insurance
              arena. The most credible displacement risk is therefore not a startup copycat alone, but a capital-backed
              insurer or distributor that pairs a digital experience with broader admitted-paper trust and existing
              distribution.
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP008
              - CP012
              - CP015
              - CP016
