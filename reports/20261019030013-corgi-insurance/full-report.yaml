              - CR005
              - CR006
              - CR008
              - CR010
              - CR013
              - CR016
      - number: '7.2'
        title: Regulatory and legal constraints are manageable but not fully de-risked
        blocks:
          - type: paragraph
            body: >-
              Corgi does have more real regulatory substance than a typical startup broker pitch. Its About page says
              the producer entity is licensed in all states where it operates, and its pages explicitly name Technology
              Risk Retention Group as a core underwriting vehicle. That said, the same AI product disclosure is the
              sharper risk signal: TRRG paper is not subject to all state insurance laws and state guaranty funds are
              unavailable for those policies, while admitted paper is only available through affiliated or partner
              carriers depending on jurisdiction and risk characteristics. For AI customers, Corgi itself highlights
              model-output harm, bias, and training-data disputes as common triggers, so underwriting judgment and
              wording discipline matter as much as sales velocity. Public sources are still missing the statutory
              capital, reinsurance, and claims-development data needed to clear this category decisively.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.3'
        title: Operating speed is a strength, but it also compresses control margins
        blocks:
          - type: paragraph
            body: >-
              Corgi's differentiator is the direct-carrier model: it says it underwrites and issues policies itself
              instead of acting as a broker, and its startup-program release positions that as the reason it can quote
              and bind faster. The caveat is in the disclaimers, not the marketing headline. The same release says not
              every applicant qualifies for instant quoting, and the AI page says availability varies by state, line,
              and carrier. That means the promise of instant coverage can break at the exact moment a customer needs
              admitted paper, higher limits, or a less standard risk class. Operating stretch is also visible in the
              public footprint: Y Combinator lists hiring across several cities, Forbes describes a seven-day in-person
              culture, and the B1 proceeds are earmarked for expansion into trucking, small business, sports, and other
              verticals. That combination can drive speed, but it also raises failure-mode risk around compliance,
              staffing, and consistent claims handling.
            claimRefs:
              - CR001
              - CR005
              - CR010
              - CR011
              - CR013
              - CR016
          - type: table
