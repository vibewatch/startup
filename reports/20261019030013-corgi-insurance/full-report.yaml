              argues Corgi still lacks a multi-year claims history and public payout statistics, while the company's own
              pages stress illustrative limits and variable admitted-paper availability rather than realized pricing.
              That leaves the central insurance questions—loss ratio, combined ratio, reserve adequacy, and true
              customer acquisition efficiency—outside the public record. Financially, Corgi looks like a well-funded,
              fast-scaling full-stack carrier, but the next diligence step has to move from valuation headlines to
