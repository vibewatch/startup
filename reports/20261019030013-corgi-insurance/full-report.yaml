  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and included spend
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence in the assigned pool defines Corgi's market as commercial insurance for technology
              companies and startups rather than as a generic SMB or personal-lines opportunity. Across the About page,
              launch announcement, and product pages, Corgi describes a full-stack operating model spanning
              underwriting, policy design, servicing, and claims, with a coverage stack that includes D&O, Tech E&O or
              AI liability, cyber, CGL, HNOA, fiduciary, and adjacent commercial lines. That matters because the market
              boundary is set by startup workflow needs such as fundraising, enterprise diligence, governance, and
              product risk, not by a single policy SKU. The broadest number in the pool is Corgi's own "$1T+"
              description of the insurance industry, but that is an ambition statement rather than a defensible
              startup-insurance TAM. The evidence therefore supports a boundary-first framing of the market, not a
              top-down sizing model.
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
      - number: '2.2'
        title: Buyer path, demand drivers, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Demand in this category appears milestone-driven rather than purely annualized. First Citizens and SVB
              frame insurance as part of operational readiness, fundraising, hiring, and customer acquisition, while
              Corgi's D&O guide says coverage becomes required when startups raise institutional capital, add
              independent directors, or enter contracts that bring governance scrutiny. Company-issued comparison pages
              extend the same logic to software and AI workloads: enterprise MSAs, trust motions such as cyber
              diligence, and model-risk concerns push founders toward Tech E&O, Cyber, and AI-specific liability
              alongside D&O. The product-market implication is that buyer, user, and payer rarely collapse to one
              person. Founders and finance leaders may initiate spend, but boards, enterprise customers, auditors, and
              banking partners can effectively force adoption. That makes channel access and speed-to-bind as important
              as price.
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
