      - number: '1.2'
        title: Leadership visibility, governance depth, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              The assigned pool clearly names only two operators at the center of the story: co-founders Nico Laqua and
              Emily Yuan. Official and syndicated company materials repeatedly put Nico in the external spokesperson
              role and identify Emily as the co-founder and COO, but they do not provide an independent board list,
              committee structure, or a broader operating roster that would let an investor judge delegation depth. That
              disclosure gap is meaningful because the business claims unusually fast underwriting, product expansion,
              and financing velocity while public leadership visibility stays concentrated in the founders. The overview
              chapter can therefore treat founder identity as verified ground truth, but it should treat governance
              resilience and bench depth as open diligence questions rather than solved facts.
