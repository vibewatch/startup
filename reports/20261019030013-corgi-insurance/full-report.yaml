  - id: FP001
    title: 'Competitive positioning map: underwriting control (x) vs startup fit (y)'
    type: quadrant
    summary: >-
      The strongest evidence-backed split is between underwriting control / paper ownership and startup-specific
      workflow fit, not between "good" and "bad" competitors.
    data:
      points:
        - label: Corgi
          x: 5
          'y': 5
          tone: positive
          note: Full-stack underwriting and claims control plus startup-stage packaging.
        - label: Vouch
          x: 2
          'y': 4
          tone: neutral
          note: Startup-focused broker model that relies on third-party carrier paper.
        - label: NEXT Insurance
          x: 4
          'y': 2
          tone: opportunity
          note: Large digital insurer with automated underwriting/pricing and Munich Re backing.
        - label: Digital broker class
          x: 2
          'y': 3
          tone: neutral
          note: Tech-oriented coverage without carrier-owned underwriting control.
        - label: General SMB carrier
          x: 1
          'y': 1
          tone: low
          note: Broad-market small-business coverage with weaker startup-specific fit.
        - label: Traditional admitted carrier
          x: 5
          'y': 1
          tone: warning
          note: Strongest paper trust signal, but slower and less startup-specific in retained evidence.
    approximationNotes: >-
      Ordinal 1-5 coordinates synthesize cited evidence on business model, paper structure, and startup fit; they are
      relative positioning aids, not measured benchmark scores.
    claimRefs:
      - CP010
      - CP011
      - CP012
      - CP013
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports the commercial workflow from startup demand trigger to policy binding, but not the final
      split between retained underwriting margin and fee-based economics.
    data:
      nodes:
        - id: trigger
          label: Fundraising, hiring, or enterprise-contract trigger
          note: Public materials position insurance purchase around startup growth milestones and customer requirements.
        - id: intake
          label: Online intake
          note: The Startup Program starts with a short online application.
        - id: decision
          label: Instant quote or underwriting review
          note: Eligible companies receive an instant quote; others route to underwriting review.
        - id: selection
          label: Coverage and limits selection
          note: >-
            Core disclosed lines include D&O, cyber, tech E&O, EPLI, HNOA, fiduciary, media liability, and general
            liability.
        - id: bind
          label: Bind coverage and issue COIs
          note: Same-day binding and immediate COI access are central to the public GTM pitch.
        - id: economics
          label: Premium and fee economics across carrier, TRRG, and partner paper
          note: >-
            Public pages disclose multiple entities but not revenue mix, commissions, cessions, gross margin, or loss
            ratio.
    approximationNotes: >-
      The bridge reflects disclosed workflow steps and entity roles, not a quantified margin waterfall; public sources
      do not expose premium mix or profitability by node.
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI005
      - CI006
  - id: FE001
    title: Publicly evidenced product architecture map
    type: stack
    summary: >-
      Public evidence supports a quote-to-bind operating stack spanning intake, underwriting, carrier routing, coverage
      modules, and servicing rather than a deeply documented API or infrastructure architecture.
    data:
      layers:
        - label: Buyer trigger
          detail: Contract, fundraise, audit, or board event creates a time-sensitive insurance need.
        - label: Intake and triage
          detail: Founders answer a short question set and are routed either to instant quote or underwriting review.
        - label: Underwriting engine
          detail: AI-assisted in-house underwriting and risk modeling support the quote-in-minutes proposition.
        - label: Carrier / paper routing
          detail: >-
            Coverage may route through TRRG, admitted affiliates, or partner carriers depending on state, line, and
            risk.
        - label: Coverage modules
          detail: D&O, Tech E&O, Cyber, EPLI, Media, Fiduciary, HNOA, CGL, and AI-liability modules can be combined by stage.
        - label: Servicing and claims
          detail: Policy documents, COIs, servicing, and claims administration are presented as part of the same platform.
    approximationNotes: >-
      This is a reconstruction of the public operating stack from assigned sources, not a direct diagram of internal
      software components or system boundaries.
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE010
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence portrays a startup buyer journey centered on time-sensitive procurement, direct binding, and
      modular expansion by company stage.
    data:
      nodes:
        - label: Funding or board trigger
          stage: Trigger
          actor: Founder, CFO, board, or outside counsel
          touchpoints:
            - Institutional capital or board formation makes D&O a diligence item.
            - Governance requirements start before public-company scale.
        - label: Enterprise or AI risk trigger
          stage: Qualification
          actor: Founder, legal, procurement, or security lead
          touchpoints:
            - Enterprise contracts require proof of insurance.
            - AI buyers need coverage for model output and training-data risk.
        - label: Short intake and quote path
          stage: Quoting
          actor: Founder or operations lead
          touchpoints:
            - Start a quote online and answer a short set of questions.
            - Eligible companies can receive an instant quote.
        - label: Direct bind or underwriter review
          stage: Binding
          actor: Corgi underwriting and the startup buyer
          touchpoints:
            - Corgi says it can quote and bind directly as a licensed carrier.
            - Same-day binding is positioned as typical in most cases, subject to underwriting.
        - label: Proof-of-insurance outcome
          stage: Customer proof
          actor: Enterprise customer or startup operator
          touchpoints:
            - Eligible buyers can bind coverage and access policy documents or COIs.
            - Artisan says coverage was bound in two days for enterprise demand.
        - label: Modular expansion with limited durability disclosure
          stage: Ongoing relationship
          actor: Finance and risk owner
          touchpoints:
            - Coverage can expand from pre-seed to Series A and growth-stage packages.
            - Public evidence does not disclose NRR, GRR, or concentration metrics.
    approximationNotes: >-
      Sequence reflects the common buying path described across retrieved sources, not a measured funnel with disclosed
      conversion rates.
    claimRefs:
      - CU004
      - CU005
      - CU007
      - CU008
      - CU016
