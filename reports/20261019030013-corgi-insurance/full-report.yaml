              - CP016
      - number: '3.2'
        title: Differentiation comes from underwriting control and workflow design
        blocks:
          - type: paragraph
            body: >-
              Corgi's strongest supported differentiation is structural and workflow-based, not price based. Official
              pages repeatedly emphasize instant quotes, same-day binding, modular packages, and startup-stage coverage
              design, especially for software and machine-learning companies. Those messages matter because the official
              Vouch comparison attributes a broker model to Vouch and explicitly says external carrier timelines still
              shape its process. QuoteSweep adds the more important economic interpretation: the real contrast is fewer
              handoffs and more underwriting control in exchange for affiliated paper rather than a market-shopped
              placement. That is a meaningful buying-criteria difference for founders who need speed to close
              fundraising, hiring, or enterprise contracts. What the evidence does not prove is price leadership. Corgi
              publishes estimated annual package ranges of $2,000-$5,000 for pre-seed and seed companies and
              $5,000-$15,000 for Series A companies, but the retained sources do not provide a matched quote basket
              across Corgi, Vouch, Next, Embroker, Thimble, or the admitted status quo. The public record therefore
              supports packaging and process comparisons far better than net-cost claims.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP011
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
