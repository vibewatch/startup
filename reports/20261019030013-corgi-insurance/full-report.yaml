        title: Exhibits
        blocks:
          - type: callout
            title: Underwriting control is the real peer wedge
            body: >-
              The retained evidence consistently supports Corgi's strongest competitive claim as control of underwriting
              workflow, policy design, and claims administration rather than a mere broker UX improvement.
            calloutType: strength
            claimRefs:
