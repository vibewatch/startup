  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk landscape
        blocks:
          - type: paragraph
            body: >-
              The highest-priority risk is structural rather than purely commercial: Corgi's own pages say coverage can
              be written through Technology Risk Retention Group while admitted paper depends on partner carriers, and
              the same disclosures say availability varies by state, line, and risk class. That creates real execution
              leverage when the model works, but it also means legal protections, insolvency backstops, and carrier
              capacity are not uniform across the book. The second risk is capital-mark discipline: public evidence
              shows Corgi jumping from a $1.3 billion Series B on May 6, 2026 to a $2.6 billion Series B1 on May 28,
              with third-party trackers later publishing reported marks of $4 billion and above $5 billion. The third
              risk is operating-control maturity, because the company is simultaneously expanding product scope,
              geographic hiring, and new verticals without public claims-ratio, reinsurance, or security-control
              disclosure.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR006
              - CR007
              - CR008
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
