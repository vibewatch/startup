  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and coverage stack
        blocks:
          - type: paragraph
            body: >-
              Corgi's public financial story starts with insurance-product architecture rather than GAAP disclosure. The
              company markets direct quote-and-bind coverage for startup lines such as D&O, cyber, and tech E&O, but its
              own disclosures show that risk can sit with multiple entities: Technology Risk Retention Group (TRRG),
              Corgi Insurance Company, and partner admitted carriers, while Corgi Insurance Services acts as program
              administrator and producer. That supports a broader monetization stack than a simple SaaS subscription,
              yet outside readers still cannot tell how much economics come from retained underwriting margin versus MGA
