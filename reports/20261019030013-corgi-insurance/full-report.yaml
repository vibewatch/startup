            body: >-
              The strongest verified financing fact in the assigned pool is the official 2026-05-07 Series B
              announcement: $160 million at a $1.3 billion valuation led by TCV, taking total capital raised to more
              than $268 million at that point. Later public reporting extends the story, with Forbes saying Corgi raised
