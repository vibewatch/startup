          detail: >-
            The official Series B release says Corgi received regulatory approval in July 2025 before launching as a
            licensed carrier.
          tone: positive
          claimRefs:
            - CO005
        - date: '2026-01-08'
          label: Series A appears in third-party profiles
          detail: >-
            Two third-party profiles place a roughly $108 million Series A at about a $630 million valuation on January
            8, 2026, but the assigned official pool does not include the underlying announcement.
          tone: warning
          claimRefs:
            - CO015
        - date: '2026-01-19'
          label: Startup Program launch
          detail: >-
            PR Newswire says Corgi launched a Startup Program with instant online quoting for core commercial lines used
            in fundraising, hiring, and enterprise contracting.
          tone: positive
          claimRefs:
            - CO007
        - date: '2026-05-07'
          label: Series B official disclosure
          detail: >-
            Corgi officially announced a $160 million Series B at a $1.3 billion valuation led by TCV, taking cumulative
            capital raised above $268 million at that point.
          tone: positive
          claimRefs:
            - CO006
        - date: '2026-05-28'
          label: Forbes reports B1 follow-on
          detail: >-
            Forbes reported another $106 million at a $2.6 billion valuation in a B1 round limited to existing
            investors, again led by TCV.
          tone: warning
          claimRefs:
            - CO008
            - CO016
        - period: 2026-05
          label: Tear sheet reports profitability and ~$100M annualized revenue
          detail: >-
            Silicon Valley Invest Club says Corgi reached profitability and roughly $100 million of annualized revenue
            by May 2026, while also warning that the figures mix company disclosures with third-party estimates.
          tone: warning
          claimRefs:
            - CO013
        - period: 2026-07
          label: Later third-party scale markers move higher
          detail: >-
            The same tear sheet lists a reported $4.0 billion July 2026 valuation and a 201-500 employee LinkedIn band,
            neither of which is company-confirmed in the assigned pool.
          tone: warning
          claimRefs:
            - CO013
    approximationNotes: >-
      Events using only third-party profiles are preserved as lower-confidence milestones rather than upgraded into
      official company facts.
