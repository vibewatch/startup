            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR008
              - CR013
              - CR016
      - number: '7.4'
        title: Capital-mark discipline and missing operating disclosures are the main thesis-break zone
        blocks:
          - type: paragraph
            body: >-
              The public capital story is strong enough to support momentum, but not yet strong enough to support
              complacency. Company and Forbes reporting corroborate that Corgi moved from a $1.3 billion valuation to
              $2.6 billion within weeks, while SetterVC later published a reported $4 billion July mark and a reported
              valuation above $5 billion in September. That leaves a familiar late-stage underwriting problem: the mark
              has escalated faster than public evidence on loss ratio, combined ratio, reinsurance coverage, or solvency
              buffer. Management also self-reported profitability in May 2026, but there is no public audited bridge
              from pricing speed to durable underwriting earnings. An investor should treat missing capital-adequacy and
              claims-performance disclosure as live kill criteria, not paperwork to tidy up after a deal is signed.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price sensitivity
        blocks:
          - type: paragraph
            body: >-
              The recommendation is **track**, not invest at the latest publicly referenced prices. Public sources show
              Corgi moving quickly from a January 2026 $630M valuation reference to a late-April $1.3B Series B, then a
              May 28 $2.6B Series B1, with a later July 2026 third-party registry mark at $4.0B. That pace indicates
              strong investor appetite, but it also means price discovery is being led by financing velocity rather than
              by disclosed carrier economics. The strongest public revenue datapoints still come from company-linked
              statements and mixed-definition third-party compilations rather than audited premium, loss-ratio,
              combined-ratio, or reserve disclosures.


              There is enough evidence to believe Corgi has real product-market pull: January 2026 launch materials
              showed instant quoting for core startup lines, and the company states ARR surpassed $40M after July 2025
              carrier approval. The issue is not whether Corgi has momentum; it is whether new money is entering at a
              price that leaves room for underwriting misses, regulatory friction, or a later reset once private
              investors demand more conventional insurance-carrier proof. Until diligence closes those gaps, valuation
              support looks stretched rather than investable.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV013
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Public financing evidence points to a story of accelerating rounds layered on top of still-limited
              external underwriting disclosure. Company-linked January sources say Corgi had raised $108M after
              regulatory approval and had crossed $40M ARR, while third-party directories placed that January financing
              at a $630M valuation. Forbes then reported that a $106M Series B1 on May 28 doubled valuation to $2.6B
              only weeks after a $160M Series B at $1.3B. A later Silicon Valley Invest Club tear sheet pushes the mark
              to a reported $4.0B and total funding above $374M, but it also warns that the valuation is reported rather
              than company-confirmed.


              That evidence base matters for entry discipline. The public file is strongest on fundraising speed and
              weakest on pricing mechanics: there is no public cap table, liquidation preference stack, insider pro-rata
              detail, or reliable bridge from ARR-like metrics to carrier value creation. Even the same tear sheet warns
              that financial figures mix company disclosures with third-party estimates that may use different ARR or
              revenue definitions. For valuation work, that means the upside case can be described, but the downside can
              only be bounded with wide error bars.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV013
              - CV014
      - number: '8.3'
        title: Scenario ranges and return logic
        blocks:
          - type: paragraph
            body: >-
              The bull case is that Corgi is building a scarce asset: an AI-native carrier that can quote, bind, and
              administer startup insurance directly while adding admitted-paper access where customers need it. If the
              company can turn that structure into durable underwriting performance, faster binding, and profitable
              expansion into adjacent lines, the rapid step-up in private valuation could prove to be an early read on a
              category-defining insurer. Public evidence also shows active packaging for AI risks and a broader January
              2026 startup program, which supports the idea that product breadth is widening rather than narrowing.


              The base and bear cases depend on how much of the valuation uplift is narrative versus durable economics.
              Official disclosures make clear that some coverage runs through TRRG structures that are not subject to
              all state insurance laws and do not carry state guaranty-fund support, while Simplify's commentary flags
              expansion and state-level pushback as watch items. Without public loss-ratio, reserve, reinsurance, or
              retention-cohort data, the prudent base case assumes financing traction alone is not enough to justify
              chasing the latest mark; the bear case assumes a down-round or flat-round becomes plausible once
              underwriting results and capital structure are tested.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV012
              - CV013
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is still more aspirational than evidenced. The public record shows real productization, a
              broad investor set, and a fundraising cadence that can support continued private financing, but it does
              not yet show the disclosure package needed for a high-conviction late-stage insurance investment. For a
              carrier, valuation needs to be anchored in premium quality, loss development, reserve adequacy,
              reinsurance structure, and renewal behavior, not only ARR analogies or customer-count headlines. None of
              those core insurance economics are publicly available here.


              The diligence asks that would most move the recommendation are specific. First, obtain audited or
              board-level financials that bridge ARR-style statements to gross written premium, earned premium, loss
              ratio, combined ratio, and cash generation. Second, inspect the current cap table and all preference,
              extension, and insider allocation terms across the 2026 rounds. Third, review state availability,
              admitted-paper mix, TRRG usage, reinsurance counterparties, and any regulator correspondence tied to
              expansion. If those materials support underwriting durability at a materially better entry price, the
              recommendation can move; without them, thesis-break risk remains high.
            claimRefs:
              - CV007
              - CV008
              - CV010
              - CV011
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, not chase
            body: >-
              Corgi has enough public product and financing proof to stay on the active watchlist, but not enough public
              underwriting or capital-structure disclosure to justify paying to the latest reported private marks.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV010
              - CV011
          - type: callout
            title: Insurance-structure risk matters more than SaaS-style ARR optics
            body: >-
              TRRG usage, admitted-paper constraints, and absent public loss-ratio or reserve data mean the downside can
              widen faster than top-line valuation headlines suggest.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV011
              - CV013
          - type: callout
            title: The story is ahead of the proof
            body: >-
              Public sources consistently support speed, product breadth, and fundraising demand, but they do not yet
              close the gap between a compelling insurtech narrative and a fully underwritten late-stage carrier
              valuation.
            calloutType: insight
            claimRefs:
              - CV003
              - CV006
              - CV009
              - CV010
              - CV011
