      - number: '6.3'
        title: Durability, expansion, and concentration gaps
        blocks:
          - type: paragraph
            body: >-
              The chapter supports a plausible land-and-expand thesis because Corgi advertises modular coverage that can
              grow from pre-seed packages to Series A and growth-stage programs, and customer testimonials focus on
              progressively more complex buying moments. What the evidence does not show is just as important: there is
              no independently substantiated NRR, GRR, renewal, multi-year claims experience, or top-customer
              concentration disclosure in the retrieved pool. AIFI Map repeats aggressive scale and churn numbers, but
              the same directory page contains conflicting company metadata, so it is better read as low-confidence
              repetition than as audited durability proof. The net result is a credible story on who buys and why they
              buy quickly, but only a partial story on how durable or concentrated the book is after binding.
            claimRefs:
              - CU003
              - CU009
