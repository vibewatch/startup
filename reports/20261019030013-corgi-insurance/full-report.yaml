  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape by competitor class, not one flat peer set
        blocks:
          - type: paragraph
            body: >-
              The retained pool shows that Corgi is not fighting one uniform "insurtech competitor" market. The field
              separates into direct startup specialists, broader digital insurers, and substitute buying paths such as
              broker-mediated placements or general SMB carriers. Corgi's own comparison pages frame Vouch as the
              closest direct startup-oriented broker, while its other official comparison pages contrast Corgi with
              broader digital-broker and small-business-carrier alternatives rather than only with venture-backed peers.
              Independent evidence reinforces that segmentation. QuoteSweep describes Corgi as a vertically integrated
              group whose structural difference versus broker models is control of affiliated underwriting paper and
              claims operations. By contrast, TechCrunch and ERGO position Next Insurance as a scaled digital insurer
              aimed at the broader U.S. SMB market. The practical implication is that buyers are weighing
              startup-specific workflow fit against paper structure, distribution breadth, and capital depth, not simply
              picking the best-looking front-end quote flow.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP007
              - CP008
              - CP010
              - CP013
              - CP015
