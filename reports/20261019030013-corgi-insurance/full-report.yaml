          valueNote: Observed coverage boundary across company-issued product and launch materials.
          claimRefs:
            - CM001
            - CM002
        - label: Fundraising and board trigger
          displayValue: D&O often required
          valueNote: Purchase often begins with outside capital, independent directors, or governance diligence.
          claimRefs:
