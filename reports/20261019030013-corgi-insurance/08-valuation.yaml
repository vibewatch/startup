artifact: valuation
slug: corgi-insurance
runDate: 2026-10-19
company:
  name: Corgi Insurance
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports real commercialization momentum at Corgi, but it does not support paying up to the latest reported private marks without deeper diligence. The financing path moved from a $630M January 2026 valuation reference to $1.3B in late April, $2.6B in late May, and a later $4.0B reported July mark faster than public sources establish carrier economics, cap-table terms, or underwriting performance.
sections:
  - id: recommendation-and-price-sensitivity
    title: Recommendation and price sensitivity
    body: |-
      The recommendation is **track**, not invest at the latest publicly referenced prices. Public sources show Corgi moving quickly from a January 2026 $630M valuation reference to a late-April $1.3B Series B, then a May 28 $2.6B Series B1, with a later July 2026 third-party registry mark at $4.0B. That pace indicates strong investor appetite, but it also means price discovery is being led by financing velocity rather than by disclosed carrier economics. The strongest public revenue datapoints still come from company-linked statements and mixed-definition third-party compilations rather than audited premium, loss-ratio, combined-ratio, or reserve disclosures.

      There is enough evidence to believe Corgi has real product-market pull: January 2026 launch materials showed instant quoting for core startup lines, and the company states ARR surpassed $40M after July 2025 carrier approval. The issue is not whether Corgi has momentum; it is whether new money is entering at a price that leaves room for underwriting misses, regulatory friction, or a later reset once private investors demand more conventional insurance-carrier proof. Until diligence closes those gaps, valuation support looks stretched rather than investable.
    claimRefs: [CV001, CV002, CV003, CV005, CV009, CV010, CV011, CV014, CV015, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-context-and-entry-discipline
    title: Financing context and entry discipline
    body: |-
      Public financing evidence points to a story of accelerating rounds layered on top of still-limited external underwriting disclosure. Company-linked January sources say Corgi had raised $108M after regulatory approval and had crossed $40M ARR, while third-party directories placed that January financing at a $630M valuation. Forbes then reported that a $106M Series B1 on May 28 doubled valuation to $2.6B only weeks after a $160M Series B at $1.3B. A later Silicon Valley Invest Club tear sheet pushes the mark to a reported $4.0B and total funding above $374M, but it also warns that the valuation is reported rather than company-confirmed.

      That evidence base matters for entry discipline. The public file is strongest on fundraising speed and weakest on pricing mechanics: there is no public cap table, liquidation preference stack, insider pro-rata detail, or reliable bridge from ARR-like metrics to carrier value creation. Even the same tear sheet warns that financial figures mix company disclosures with third-party estimates that may use different ARR or revenue definitions. For valuation work, that means the upside case can be described, but the downside can only be bounded with wide error bars.
    claimRefs: [CV001, CV002, CV004, CV005, CV009, CV010, CV011, CV014, CV015, CV016]
    tableRefs: [TV002]
  - id: scenario-ranges-and-return-logic
    title: Scenario ranges and return logic
    body: |-
      The bull case is that Corgi is building a scarce asset: an AI-native carrier that can quote, bind, and administer startup insurance directly while adding admitted-paper access where customers need it. If the company can turn that structure into durable underwriting performance, faster binding, and profitable expansion into adjacent lines, the rapid step-up in private valuation could prove to be an early read on a category-defining insurer. Public evidence also shows active packaging for AI risks and a broader January 2026 startup program, which supports the idea that product breadth is widening rather than narrowing.

      The base and bear cases depend on how much of the valuation uplift is narrative versus durable economics. Official disclosures make clear that some coverage runs through TRRG structures that are not subject to all state insurance laws and do not carry state guaranty-fund support, while Simplify's commentary flags expansion and state-level pushback as watch items. Without public loss-ratio, reserve, reinsurance, or retention-cohort data, the prudent base case assumes financing traction alone is not enough to justify chasing the latest mark; the bear case assumes a down-round or flat-round becomes plausible once underwriting results and capital structure are tested.
    claimRefs: [CV005, CV006, CV007, CV008, CV012, CV013, CV015]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence-asks
    title: Exit readiness and final diligence asks
    body: |-
      Exit readiness is still more aspirational than evidenced. The public record shows real productization, a broad investor set, and a fundraising cadence that can support continued private financing, but it does not yet show the disclosure package needed for a high-conviction late-stage insurance investment. For a carrier, valuation needs to be anchored in premium quality, loss development, reserve adequacy, reinsurance structure, and renewal behavior, not only ARR analogies or customer-count headlines. None of those core insurance economics are publicly available here.

      The diligence asks that would most move the recommendation are specific. First, obtain audited or board-level financials that bridge ARR-style statements to gross written premium, earned premium, loss ratio, combined ratio, and cash generation. Second, inspect the current cap table and all preference, extension, and insider allocation terms across the 2026 rounds. Third, review state availability, admitted-paper mix, TRRG usage, reinsurance counterparties, and any regulator correspondence tied to expansion. If those materials support underwriting durability at a materially better entry price, the recommendation can move; without them, thesis-break risk remains high.
    claimRefs: [CV007, CV008, CV010, CV011, CV013]
