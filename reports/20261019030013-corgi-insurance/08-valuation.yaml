  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Current argument
      - What would change the view
    rows:
      - ["Thesis: commercialization proof", "January 2026 launch materials show instant quoting for core startup lines, supporting a real go-to-market engine rather than only fundraising optics.", "Verified binding conversion, renewal, and loss data would strengthen this from promising proof to durable value evidence."]
      - ["Thesis: structural moat", "Carrier approval plus TRRG and admitted-paper pathways can create a harder-to-copy underwriting/distribution stack than a broker-only model.", "Evidence of smooth multi-state scaling and durable reinsurance capacity would confirm the moat."]
      - ["Anti-thesis: valuation outruns disclosure", "The financing path repriced from $630M to $2.6B in months and later to a reported $4.0B without public carrier-economics disclosure.", "Audited underwriting economics or a materially lower entry price would narrow this concern."]
      - ["Anti-thesis: regulatory and capital complexity", "Official pages disclose TRRG use and coverage limits by jurisdiction, while external commentary highlights possible state pushback as expansion broadens.", "Regulator correspondence, admitted-paper mix, and cap-table terms that show clean scalability would reduce the concern."]
    notes: >-
      This table separates investment arguments from the evidence gaps that could reverse them; it does not assume disclosed valuation marks are fully comparable across rounds.
    claimRefs: [CV001, CV002, CV006, CV007, CV008, CV010, CV011, CV013, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - ["Bull", "Corgi converts rapid quoting and carrier control into durable underwriting profits, expands cleanly into adjacent lines, and validates AI-led claims and servicing efficiency.", "Latest private marks prove conservative if underwriting leverage and premium growth compound faster than incumbents can respond.", "Reserve adequacy, reinsurance dependence, and state approval complexity still matter.", "Would require audited economics and renewal behavior that exceed current public evidence."]
      - ["Base", "Commercial traction is real, but underwriting metrics normalize and investors demand more conventional carrier disclosure before supporting another steep mark-up.", "Returns depend on entering below the latest reported marks or with structured downside protection.", "Mixed ARR/revenue definitions, uncertain preference stack, and regulatory execution risk.", "Most consistent with current public evidence set."]
      - ["Bear", "Growth expands ahead of underwriting proof, state or product complexity slows scaling, and later financing resets valuation once true insurance economics surface.", "A flat or down round erases the optics from the 2026 repricing cycle.", "Loss ratios, reserve development, or regulator friction could force the reset.", "Becomes more likely if diligence cannot verify underwriting performance and clean financing terms."]
    notes: >-
      Scenario ranges are qualitative because the public record lacks audited premium, loss-ratio, reserve, and cap-table data needed for a tighter priced-return model.
    claimRefs: [CV003, CV005, CV007, CV008, CV010, CV011, CV012, CV013]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Public evidence supports commercialization momentum, but valuation velocity and insurance-structure complexity keep the recommendation at track.
    data:
      nodes:
        - id: proof
          label: Product proof
          detail: Startup Program and instant quoting show a real commercialization engine.
        - id: scale
          label: Scale markers
          detail: Company-linked sources report ARR above $40M and broad startup reach.
        - id: structure
          label: Carrier structure
          detail: Direct carrier positioning plus TRRG and admitted-paper pathways can be a moat.
        - id: constraints
          label: Structural constraints
          detail: TRRG disclosures and state-by-state availability limits add regulatory and claims-backstop complexity.
        - id: pricing
          label: Pricing tension
          detail: Public valuation references repriced much faster than public carrier economics were disclosed.
        - id: outcome
          label: Outcome
          detail: Track until underwriting, capital-structure, and entry-price diligence close the gap.
      edges:
        - from: proof
          to: scale
        - from: scale
          to: structure
        - from: structure
          to: constraints
        - from: constraints
          to: pricing
        - from: pricing
          to: outcome
        - from: scale
          to: pricing
    approximationNotes: >-
      This is an evidence chain rather than a probabilistic model; it orders the main valuation drivers but does not infer conversion rates or numeric weights.
    claimRefs: [CV005, CV006, CV007, CV008, CV010, CV011, CV013]
callouts:
  - calloutType: recommendation
    title: Track, not chase
    body: >-
      Corgi has enough public product and financing proof to stay on the active watchlist, but not enough public underwriting or capital-structure disclosure to justify paying to the latest reported private marks.
    claimRefs: [CV001, CV002, CV005, CV010, CV011]
  - calloutType: risk
    title: Insurance-structure risk matters more than SaaS-style ARR optics
    body: >-
      TRRG usage, admitted-paper constraints, and absent public loss-ratio or reserve data mean the downside can widen faster than top-line valuation headlines suggest.
    claimRefs: [CV007, CV008, CV011, CV013]
  - calloutType: insight
    title: The story is ahead of the proof
    body: >-
      Public sources consistently support speed, product breadth, and fundraising demand, but they do not yet close the gap between a compelling insurtech narrative and a fully underwritten late-stage carrier valuation.
    claimRefs: [CV003, CV006, CV009, CV010, CV011]
