evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-visibility
    missingEvidence: Independent board roster, committee structure, and fuller executive biographies.
    whyItMatters: >-
      Governance depth and delegation are central to judging whether Corgi can scale underwriting and carrier operations
      beyond founder bandwidth.
    diligencePath: Request the current board deck, org chart, and director / officer list directly from management.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: insurance-performance
    missingEvidence: >-
      Audited financials, loss ratio, combined ratio, claims-history disclosure, reinsurance structure, and capital
      adequacy materials.
    whyItMatters: >-
      A carrier-style business cannot be underwritten responsibly from fundraising headlines alone; underwriting and
      claims performance drive durability.
    diligencePath: Request audited financials, actuarial packs, statutory filings, and reinsurance summaries under NDA.
    relatedQuestionRefs:
      - QO009
  - type: conflicting-data
    severity: material
    topic: scale-metrics
    missingEvidence: Current company-confirmed customer count, ARR / revenue bridge, headcount, and post-B1 cap-table summary.
    whyItMatters: >-
      The assigned third-party sources disagree on founder identity, website, valuation, revenue, customer count, and
      employee scale, which weakens current-state sizing.
    diligencePath: >-
      Ask management for a dated KPI sheet that reconciles revenue, customers, headcount, and financing through the
      latest close.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map
    missingEvidence: >-
      Complete cap table, ownership concentrations, board / observer rights, and the named carrier or reinsurance
      counterparties behind each line.
    whyItMatters: >-
      The stakeholder table captures only the parties explicitly named in public materials, so it cannot by itself
      reveal control or concentration risk.
    diligencePath: Request the full cap table, investor rights summary, and carrier / reinsurance schedule.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: An independent TAM, SAM, or SOM estimate for startup and technology-company commercial insurance.
    whyItMatters: >-
      Without an external market-size benchmark, valuation conclusions must lean on company proxies rather than
      defendable share-of-market math.
    diligencePath: >-
      Retain a broker market update, regulator dataset, or public-company segment disclosure that isolates startup or
      technology commercial-insurance spend.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: retention-economics
    missingEvidence: Loss ratio, retention, claims frequency, and cohort performance by product or stage.
    whyItMatters: >-
      Demand signals without claims and renewal performance are not enough to judge durable market share or underwriting
      quality.
    diligencePath: >-
      Request underwriting, renewal, and claims cohort data directly from management or through investor diligence
      materials.
  - type: access-blocked
    severity: minor
    topic: regulator-industry-statistics
    missingEvidence: A working regulator or trade-association snapshot for insurance-industry segmentation.
    whyItMatters: >-
      A regulator-grade anchor would help separate broad insurance industry spend from the narrower startup-commercial
      submarket.
    diligencePath: >-
      Replace the unusable prior NAIC snapshot URL with a currently accessible regulator or trade-association
      publication in the next refresh.
    relatedQuestionRefs:
      - QM002
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Comparable quote baskets or filed premium examples across Corgi, Vouch, Next, and substitute paths for matched
      startup risk profiles.
    whyItMatters: >-
      Without quote-level evidence, the chapter can compare workflow and package design but cannot prove cost leadership
      or discount pressure.
    diligencePath: Request bound or indicative quotes for at least three startup archetypes across the main competitor classes.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: >-
      Win-loss, retention, broker-appointment, or multi-homing data showing whether startups actually stay with Corgi
      once they scale or add admitted-paper needs.
    whyItMatters: >-
      Workflow differentiation is more durable if buyers stay on-platform instead of re-brokering after the first
      enterprise or board requirement.
    diligencePath: Request cohort retention, re-broker rates, and reasons-for-loss by company stage and policy class.
    relatedQuestionRefs:
      - QP004
  - type: private-evidence-only
    severity: minor
    topic: claims-performance
    missingEvidence: Public claims-cycle, loss-ratio, or payout-quality evidence for Corgi by product line and paper type.
    whyItMatters: >-
      Trust versus incumbent carriers depends partly on claims performance, not only on quote speed and startup-friendly
      packaging.
