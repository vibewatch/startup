  evidenceGaps:
    - type: missing-source
      severity: material
      topic: pricing-transparency
      missingEvidence: Comparable quote baskets or filed premium examples across Corgi, Vouch, Next, and substitute paths for matched startup risk profiles.
      whyItMatters: Without quote-level evidence, the chapter can compare workflow and package design but cannot prove cost leadership or discount pressure.
      diligencePath: Request bound or indicative quotes for at least three startup archetypes across the main competitor classes.
      relatedQuestionRefs: [QP006]
      relatedTableRefs: [TP003]
    - type: private-evidence-only
      severity: material
      topic: switching-cost
      missingEvidence: Win-loss, retention, broker-appointment, or multi-homing data showing whether startups actually stay with Corgi once they scale or add admitted-paper needs.
      whyItMatters: Workflow differentiation is more durable if buyers stay on-platform instead of re-brokering after the first enterprise or board requirement.
      diligencePath: Request cohort retention, re-broker rates, and reasons-for-loss by company stage and policy class.
      relatedQuestionRefs: [QP004]
    - type: private-evidence-only
      severity: minor
      topic: claims-performance
      missingEvidence: Public claims-cycle, loss-ratio, or payout-quality evidence for Corgi by product line and paper type.
      whyItMatters: Trust versus incumbent carriers depends partly on claims performance, not only on quote speed and startup-friendly packaging.
      diligencePath: Request management reporting or statutory evidence on claims handling, reinsurance, and loss performance.
      relatedQuestionRefs: [QP005]
