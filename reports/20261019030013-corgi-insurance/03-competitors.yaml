      - [Vouch, Direct startup specialist / broker, Startups needing digital brokerage, "Retained evidence supports model positioning, not current scale metrics", "Startup-focused workflow without requiring the buyer to navigate legacy broker paperwork", "External carrier timelines and third-party paper still shape the experience"]
      - ["NEXT Insurance", Broader digital insurer / incumbent-backed benchmark, "U.S. SMBs", "$548M 2024 top line; >600k customers; acquired by Munich Re/ERGO at $2.6B", "Scale, automated underwriting/pricing, and deep-capital backing", "Retained evidence is stronger on SMB scale than on startup-specific packaging"]
      - ["Digital broker class", Adjacent alternative, "Tech companies wanting broker-style market access", "Official comparison shows specialized tech coverage but only partial instant workflow", "Can shop external carrier paper while still offering tech-focused service", "Less end-to-end control than a carrier-owned workflow"]
      - ["General SMB carrier class", Substitute / status quo, "Micro-SMBs and straightforward vendor requirements", "Official comparison and ML page show fast basic availability for broader-market needs", "Accessible entry point for simple commercial cover", "Weaker fit for startup-specific Tech E&O, cyber, and model-risk needs"]
    notes: >-
      Mixes company-issued comparison pages with independent reporting on Next; profile rows
      compare supported positioning signals, not market share or audited profitability.
    claimRefs: [CP003, CP004, CP005, CP007, CP008, CP009, CP010, CP013, CP015, CP016]
  - id: TP002
    title: Feature / capability matrix
    columns:
      - Buying criterion
      - Corgi
      - Vouch
      - NEXT Insurance
      - Generic broker / SMB substitute
    rows:
      - ["Underwriting control", "Full-stack model across underwriting, policy design, servicing, and claims admin", "Broker placement through third-party carriers", "Digital insurer with automated underwriting/pricing and carrier paper", "Usually broker-mediated or generic small-business paper"]
      - ["Startup / AI specialization", "High: startup-stage packages and AI / ML risk framing", "High for startups, per Corgi comparison page", "Lower in retained evidence; benchmark points to broad SMB orientation", "Variable to low depending on provider class"]
      - ["Workflow speed signal", "Quotes in minutes; same-day binding emphasized", "Digital workflow, but carrier timelines still matter", "Digital platform at scale, but retained evidence does not show instant startup-specific binding", "Fast for simple cases; less evidence of tailored complex-tech workflows"]
      - ["Paper trust signal", "TRRG primary; admitted A-rated partner paper available when required", "Depends on third-party carrier selected through the broker", "Incumbent-backed insurer platform after Munich Re acquisition", "Often benefits from admitted/rated paper or broader market access"]
    notes: >-
      Vouch and generic-substitute cells rely on Corgi-issued comparison pages and should be
      treated as directional model comparisons, not independent scorecards.
    claimRefs: [CP001, CP002, CP003, CP004, CP006, CP007, CP008, CP013]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Alternative
      - Public price disclosure in assigned evidence
      - Packaging signal
      - What is actually comparable today
    rows:
      - ["Corgi pre-seed and seed", "$2,000-$5,000 estimated annual package", "CGL, D&O, Tech E&O, and Cyber", "Company-authored estimate; limits, retentions, and realized premiums are not disclosed"]
      - ["Corgi Series A", "$5,000-$15,000 estimated annual package", "D&O, Tech E&O, CGL, Media Liability, EPLI, and Cyber", "Company-authored estimate; no matched competitor quote"]
      - [Vouch, "No public premium schedule in retained sources", "Startup-focused digital brokerage model", "Can compare model and process, not rate-card competitiveness"]
      - ["NEXT Insurance", "No public premium schedule in retained sources", "Scaled digital insurer for SMB coverage", "Can compare scale, capital, and digital operations, not startup-specific pricing"]
      - ["Embroker / Thimble-style substitutes", "No public premium schedule in retained sources", "Broader-market packages with some fast quoting", "Supports substitute-path analysis, not a demonstrated cheapest-price ranking"]
    notes: >-
      Assigned evidence supports packaging and workflow positioning far better than side-by-side
      price comparability; any premium claim would require fresh quote collection.
    claimRefs: [CP005, CP007, CP011, CP014]
figures:
  - id: FP001
    title: "Competitive positioning map: underwriting control (x) vs startup fit (y)"
    type: quadrant
    summary: >-
      The strongest evidence-backed split is between underwriting control / paper ownership and
      startup-specific workflow fit, not between "good" and "bad" competitors.
    data:
      points:
        - label: Corgi
          x: 5
          y: 5
          tone: positive
          note: Full-stack underwriting and claims control plus startup-stage packaging.
        - label: Vouch
          x: 2
          y: 4
          tone: neutral
          note: Startup-focused broker model that relies on third-party carrier paper.
        - label: NEXT Insurance
          x: 4
          y: 2
          tone: opportunity
          note: Large digital insurer with automated underwriting/pricing and Munich Re backing.
        - label: Digital broker class
          x: 2
          y: 3
          tone: neutral
          note: Tech-oriented coverage without carrier-owned underwriting control.
        - label: General SMB carrier
          x: 1
          y: 1
          tone: low
          note: Broad-market small-business coverage with weaker startup-specific fit.
        - label: Traditional admitted carrier
          x: 5
          y: 1
          tone: warning
          note: Strongest paper trust signal, but slower and less startup-specific in retained evidence.
    approximationNotes: >-
      Ordinal 1-5 coordinates synthesize cited evidence on business model, paper structure, and
      startup fit; they are relative positioning aids, not measured benchmark scores.
    claimRefs: [CP010, CP011, CP012, CP013]
