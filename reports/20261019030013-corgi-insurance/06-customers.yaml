company:
  name: Corgi Insurance
chapter:
  number: 6
  title: Customers
  summary: >-
    Corgi's customer story is strongest around venture-backed and AI startup buyers
    that need insurance quickly for fundraising, enterprise contracts, and board
    governance, with named references including Deel, Artisan, and Eragon. The public
    evidence supports procurement speed and stage-based package fit more clearly
    than long-term durability: independent proof of renewal, cohort retention, and
    customer concentration remains sparse.
sections:
  - id: customer-segments-and-buying-triggers
    title: Customer segments and buying triggers
    body: >-
      The retrieved evidence consistently points to a focused customer base rather
      than a broad small-business audience. Corgi describes itself as an
      AI-native, full-stack platform for technology companies and frames its
      product around underwriting, policy design, servicing, and claims
      administration in one workflow, which matters because startup buyers often
      purchase insurance under deadline rather than as a discretionary annual
      review. The most concrete demand triggers in the public record are
      fundraising, board formation, enterprise procurement, and AI-specific
      liability concerns such as model output, training-data disputes, and
      customer-contract requirements. That makes the buyer/user/payer pattern look
      like founder, finance, legal, and security stakeholders inside venture-backed
      software and AI companies, with governance buyers becoming more important as
      firms raise institutional capital or add outside directors.
    claimRefs: [CU001, CU002, CU004, CU006, CU008]
    tableRefs: [TU001]
  - id: adoption-proof-and-procurement-speed
    title: Adoption proof and procurement speed
    body: >-
      Public adoption proof is real but uneven. Company-controlled materials and a
      startup profile both point to named customers such as Deel, Artisan, and
      Eragon, while independent Forbes reporting at least
      confirms Deel as a customer example. The strongest recurring signal is not a
      cohort chart or renewal table; it is procurement velocity. Corgi's own pages
      repeatedly emphasize instant quoting, direct binding, and same-day or
      two-day turnaround when coverage is blocking a contract or financing event.
      That fits the category economics of startup insurance, where the immediate
      value proposition is often unblocking revenue, fundraising, or partner
      diligence rather than demonstrating a mature multi-year claims history.
    claimRefs: [CU004, CU005, CU007, CU010, CU012, CU013]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-expansion-and-concentration-gaps
    title: Durability, expansion, and concentration gaps
    body: >-
      The chapter supports a plausible land-and-expand thesis because Corgi
      advertises modular coverage that can grow from pre-seed packages to Series A
      and growth-stage programs, and customer testimonials focus on progressively
      more complex buying moments. What the evidence does not show is just as
      important: there is no independently substantiated NRR, GRR, renewal,
      multi-year claims experience, or top-customer concentration disclosure in the
      retrieved pool. AIFI Map repeats aggressive scale and churn numbers, but the
      same directory page contains conflicting company metadata, so it is better
      read as low-confidence repetition than as audited durability proof. The net
      result is a credible story on who buys and why they buy quickly, but only a
      partial story on how durable or concentrated the book is after binding.
    claimRefs: [CU003, CU009, CU014, CU015, CU016]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Venture-backed software startups
        - Founder, finance lead, and legal/risk buyer; company pays
        - D&O, Cyber, Tech E&O, EPLI, GL, and related coverage for fundraising and contract readiness
        - Startup Program and D&O guidance are both written around venture-backed milestones
        - Core ICP for Corgi's startup-focused direct carrier model
        - No disclosed split by funding stage, premium band, or direct-vs-broker channel
      - - AI companies
        - Founder, product, security, and finance stakeholders; company pays
        - Coverage for model output, training-data disputes, leadership, and customer contracts
        - Dedicated AI page and named Artisan example for enterprise demand
        - High-strategic segment because Corgi positions AI liability as differentiated coverage
        - No public count of active AI customers or loss experience by AI product line
      - - Companies at board / financing milestones
        - CEO, CFO, board, and outside counsel influence purchase; company pays
        - D&O and governance stack when raising institutional capital or adding directors
        - D&O blog ties purchase timing to priced rounds, directors, and diligence
        - Important because insurance is treated as deal-enablement infrastructure
        - No data on conversion rates from quote to bind at these milestones
      - - Enterprise-selling growth startups
        - Operations, legal, procurement-facing teams, and finance; company pays
        - Fast COI issuance and higher limits to satisfy enterprise customers
        - The Startup Program and Artisan example both describe deal or demand pressure
        - Supports land-and-expand logic as customers graduate to larger contracts
        - Public evidence is testimonial-heavy and lacks disclosed renewal or upsell rates
    notes: >-
      Sources combine company pages, a syndicated launch release, and one
      independent startup profile; rows summarize target segments and buying
      triggers rather than measured revenue mix.
    claimRefs: [CU001, CU004, CU006, CU007, CU008, CU012]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Named customer base
        - Thousands of startup customers including Deel, Artisan, and Eragon
        - "2026-05"
        - Silicon Valley Investclub
        - Medium
        - Suggests breadth across startup accounts and multiple use cases
        - No breakdown by active policies, premium volume, or retention cohort
      - - Customer count / geography
        - 40K+ customers across 49 states
        - "2026 (undated directory snapshot)"
        - AIFI Map
        - Low
        - Indicates the scale claim is circulating outside company pages
        - Directory metadata conflict with official details and no active-vs-historical definition is disclosed
      - - Enterprise procurement unblock
        - Eligible applicants can progress from a short intake to quote, coverage selection, binding, and policy documents or COIs
        - "2026-01-19"
        - Company-issued Startup Program release
        - Medium
        - Establishes the disclosed digital acquisition and binding workflow
        - No applicant volume, eligibility rate, quote-to-bind conversion, or active-policy count
      - - Named AI customer bind speed
        - Coverage bound in two days for Artisan
        - "2026"
        - Corgi AI page
        - Medium
        - Demonstrates a concrete adoption outcome tied to enterprise demand
        - One case study with no premium size, retention, or claims follow-through
    notes: >-
      This table mixes quantitative and testimonial adoption signals because the
      public evidence does not disclose a clean operating funnel; low-confidence
      rows reflect third-party repetition rather than audited book data.
    claimRefs: [CU004, CU007, CU012, CU014]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Deel
        - HR / payroll software startup
        - Listed as a startup Corgi insures
        - Customer relationship referenced; production status not disclosed
        - Independent reporting confirms Deel as a customer example
        - No policy scope, spend, retention, or case-study outcome disclosed
      - - Artisan
        - AI sales company
        - Needed higher limits for growing enterprise demand
        - Procurement event documented; longer-term production depth not disclosed
        - Founder says coverage was bound in two days
        - Hosted on a Corgi-controlled page with no independent corroboration in this pool
      - - Eragon
        - Technology startup; narrower vertical not disclosed
        - Named as a customer; policy line and workflow not disclosed
        - Unknown
        - null
        - Single directory mention with no independent deployment or outcome evidence
    notes: >-
      This is a partial sample of named customer proof assembled from one
      independent article, one startup profile, and company-hosted customer
      testimonials; logos alone are not treated as proof of retention or production depth.
    enumerationScope:
      coverage: sample
      basis: >-
        Sample built from the assigned pool's named customer references and
        direct testimonials; the chapter found only three entries with enough
        supporting text to describe a use case or outcome.
    claimRefs: [CU007, CU012, CU013]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence portrays a startup buyer journey centered on time-sensitive
      procurement, direct binding, and modular expansion by company stage.
    data:
      nodes:
        - label: Funding or board trigger
          stage: Trigger
          actor: Founder, CFO, board, or outside counsel
          touchpoints:
            - Institutional capital or board formation makes D&O a diligence item.
            - Governance requirements start before public-company scale.
        - label: Enterprise or AI risk trigger
          stage: Qualification
          actor: Founder, legal, procurement, or security lead
          touchpoints:
            - Enterprise contracts require proof of insurance.
            - AI buyers need coverage for model output and training-data risk.
        - label: Short intake and quote path
          stage: Quoting
          actor: Founder or operations lead
          touchpoints:
            - Start a quote online and answer a short set of questions.
            - Eligible companies can receive an instant quote.
        - label: Direct bind or underwriter review
          stage: Binding
          actor: Corgi underwriting and the startup buyer
          touchpoints:
            - Corgi says it can quote and bind directly as a licensed carrier.
            - Same-day binding is positioned as typical in most cases, subject to underwriting.
        - label: Proof-of-insurance outcome
          stage: Customer proof
          actor: Enterprise customer or startup operator
          touchpoints:
            - Eligible buyers can bind coverage and access policy documents or COIs.
            - Artisan says coverage was bound in two days for enterprise demand.
        - label: Modular expansion with limited durability disclosure
          stage: Ongoing relationship
          actor: Finance and risk owner
          touchpoints:
            - Coverage can expand from pre-seed to Series A and growth-stage packages.
            - Public evidence does not disclose NRR, GRR, or concentration metrics.
    approximationNotes: >-
      Sequence reflects the common buying path described across retrieved sources,
      not a measured funnel with disclosed conversion rates.
    claimRefs: [CU004, CU005, CU007, CU008, CU016]
