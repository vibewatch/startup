      - number: '8.4'
        title: Recommendation, Confidence, and Risk Rating
        blocks:
          - type: paragraph
            body: >-
              The recommendation is TRACK. EnergyX has demonstrated real strategic optionality—a proven laboratory-scale
              DLE technology, strategic investors (GM Ventures, POSCO, Eni), a signed EXIM Bank LOI, a completed
              pre-feasibility study, and a large retail investor community. These are genuine strengths that create
              asymmetric upside if commercial scale is achieved. However, the $3.26 billion pre-money implied valuation
              is STRETCHED relative to the evidence base: there is no commercial revenue, no independent valuation, no
              disclosed Series C pipeline, no binding offtake agreements, and no resolved going-concern doubt. The
              recommendation does not meet BUY threshold because the thesis-supporting milestones have not been achieved
              and the entry price does not provide adequate downside protection. Confidence is LOW given the severe data
              gaps: the cap table beyond publicly disclosed Series B and retail holdings is opaque, the Series C status
              is unknown, and the implied $3.26 billion valuation has no independent corroboration. Risk rating is HIGH:
              the company faces commercial-scale execution risk, capital market risk, liquidity risk (no public market
              for shares), technology risk, lithium price risk, and regulatory/financing risk on the EXIM Bank
              conditionality. A move to BUY would require: (1) a closed Series C from institutional investors at a
              valuation supported by independent analysis; (2) binding DLE licensing contracts with verifiable
              milestones; and (3) either EXIM Bank project financing confirmed or equivalent project capital secured.
              The kill triggers include failure to close any institutional round by end-2026, termination or material
              adverse modification of the EXIM Bank LOI, or departure of Teague Egan as CEO before commercial milestone
              achievement.
