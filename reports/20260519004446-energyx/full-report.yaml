            body: >-
              EnergyX currently operates two active pilot plant locations: an Austin, Texas laboratory and pilot
              facility (Headway site, ~22,150 sq ft including ~1 acre outdoor space), and an Antofagasta, Chile Testbed
              facility (expanded to 5,500 m² with a warehouse). Demonstration-scale plants are under development at both
