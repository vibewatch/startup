  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Technology and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              EnergyXs central execution risk is the gap between a technically plausible DLE platform and repeatable
              commercial-scale proof. The companys own risk factors say the technology has not yet been demonstrated at
              scale, while the H1 2025 filing still says there are no commercial operations and no material revenue from
              licensing or product sales. That combination matters because EnergyX is simultaneously trying to prove
              GET-Lit across multiple technical elements, move from pilots to demonstrations in both Chile and the
              United States, and integrate a newly acquired Arkansas resource position. The company does have more
              substance than a slide-deck concept: filings and current marketing describe active pilot or demo assets,
              branded process components, and ambitious production targets for Black Giant and Lonestar. But that still
              leaves major scale-up risk around recoveries, uptime, impurity handling, engineering handoff, and whether
              pilot data survives the transition to fully financed project buildout.
