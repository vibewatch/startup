        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: TRACK — Valuation Stretched Ahead of Milestones'
            body: >-
              EnergyX has genuine strategic optionality and a credible DLE technology franchise, but the $3.26 billion
              pre-money implied valuation is 2–3.5× ahead of the evidence-supported midpoint. The entry price does not
              provide adequate downside protection at current evidence quality. Track until a Series C institutional
              round, binding licensing contracts, or confirmed project financing closes.
            calloutType: recommendation
            claimRefs:
              - CV001
