              competitor complicates the likelihood of a licensing contract. Eni Next invested approximately $8.5
              million through Elohim-SW Energy Fund in the same joinder.

              Despite these relationships, no binding commercial contract with GM, POSCO, Eni, or ExxonMobil has been
              publicly disclosed as of May 2026. ExxonMobil is independently developing DLE operations at the same
              Smackover Formation, creating a structural conflict between EnergyX's ambition to license technology to
              Exxon and EnergyX's own planned production at Project Black Giant. All three strategic investors remain
              equity holders only, and their conversion to commercial customers is not guaranteed.
