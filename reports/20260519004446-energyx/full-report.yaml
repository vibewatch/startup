              remain attractive at the exact moment Black Giant or Lonestar would need financing and customer
              commitments. Its own risk factors already concede that lithium-price volatility, demand shifts, and
              substitute technologies can impair project viability. Third-party data make that warning more timely: USGS
              says 2025 output jumped sharply and oversupply concerns kept prices low, while Benchmark still shows
              volatile carbonate and hydroxide pricing rather than a clean recovery trend. Commercial risk compounds the
              commodity problem. The H1 2025 filing still shows no material licensing or product revenue, meaning
              EnergyX lacks broad public proof that strategic-investor relationships convert into paying customers on
              project timelines that matter for debt underwriting. TechCrunchs description of customer decisions as
