  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Profile and Ideal Customer
        blocks:
          - type: paragraph
            body: >-
              EnergyX's stated target market is lithium brine resource owners and producers — companies that control
              salt-flat brine deposits in the Lithium Triangle (Chile, Argentina, Bolivia) or domestic U.S. formations
              such as the Smackover and Clayton Valley. Secondary segments include geothermal brine operators who could
              extract co-produced lithium, and automotive OEMs seeking to secure U.S.-sourced battery-grade lithium to
              meet Inflation Reduction Act critical-mineral content requirements. The company's 2026 offering circular
              describes three distinct commercial pathways: (1) direct lithium offtake from EnergyX's own production
              operations, (2) technology licensing to producers who want to deploy LiTAS membranes on their own
              deposits, and (3) consumable membrane sales to licensed operators on a recurring replacement cycle. Each
              pathway targets a different buyer persona — offtake buyers are downstream battery manufacturers or OEMs;
              licensing buyers are upstream producers; consumable buyers are existing licensees.

              Lithium was designated a U.S. critical mineral by the Federal Register in February 2022, elevating
              strategic urgency for domestic supply chains. Automotive OEMs face IRA incentives to source lithium from
              Free Trade Agreement partners or domestic production, making EnergyX's Smackover-based output an
              attractive supply option for GM and other domestic assemblers. The addressable global market spans
              hundreds of known brine deposits across South America, North America, Asia, and Europe, though EnergyX is
              presently focusing on North American formations as its initial reference market.
            claimRefs:
