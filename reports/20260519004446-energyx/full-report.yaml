      - number: '2.2'
        title: Market Sizing — Multiple Lenses and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >-
              No single authoritative figure captures EnergyX's addressable market because the relevant markets span
              technology licensing, lithium chemicals, and brine project development, each with distinct sizing
              methodologies. This section documents multiple lenses and deliberately preserves contradictions rather
              than collapsing them to a single number. The broadest top-down lens is the global lithium market in dollar
              terms. Grand View Research estimates the global lithium market at $32.38 billion in 2025, projected to
              reach $96.45 billion by 2033 at a CAGR of 14.5%. Mordor Intelligence sizes the same market differently in
              volume terms: 1.54 million LCE tons in 2025, growing to 4.43 million LCE tons by 2031 at a CAGR of 19.24%.
              Global X LIT ETF cites a narrower volume forecast: demand of 1.6 million metric tonnes LCE in 2025 rising
              to 3.6 million metric tonnes by 2030. These three estimates are not fully reconcilable: Mordor's 4.43M LCE
              tons by 2031 implies substantially larger demand than Global X's 3.6M by 2030, a spread of approximately
              23%. Converting Mordor's 2031 volume at current depressed spot prices (~$9,000-$10,000/ton) yields an
              implied market value of roughly $40-44 billion, well below Grand View's $96.45 billion—a difference
              attributable to price scenario assumptions. These contradictions are unresolved and material for modeling
              EnergyX's revenue potential. The downstream demand signal is more consistent: Grand View Research sizes
              the global EV battery market at $61.31 billion in 2024, growing to $198.86 billion by 2030 at a CAGR of
              22.2%, with lithium-ion batteries at 67.4% share. For DLE-specific sizing, no independent market research
              report provides a peer-reviewed standalone estimate of the DLE technology licensing market. Mordor
              Intelligence identifies DLE pilot breakthroughs as contributing a +2.9% CAGR uplift to its overall lithium
              market forecast. The lithium hydroxide sub-market—the battery-grade chemical most relevant to high-nickel
              NMC cathodes used in premium EVs—is sized by Mordor Intelligence at 229.30 LCE kilotons in 2025, growing
              to 787.92 kilotons by 2031 at 22.85% CAGR. Battery-grade material holds 69.30% of this segment. The USGS
              confirms global consumption reached 263,000 tons (all forms) in 2025, up 20% from 2024. Annual average
              U.S. battery-grade LiCO3 price fell to $9,000/ton in 2025, a 31% decline from $11,800/ton in 2024.
              Benchmark Mineral Intelligence tracked Lithium Carbonate Index at approximately 451 and Lithium Hydroxide
              Index at approximately 350 in its most recent index data, suggesting partial recovery from 2024 lows.
            claimRefs:
