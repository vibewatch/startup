      - number: '5.3'
        title: Performance Claims, Evidence Quality, and Reliability Gaps
        blocks:
          - type: paragraph
            body: >-
              EnergyX's most cited performance benchmarks are: ~96% lithium recovery (pilot scale, Chile and Texas), 1–2
              day processing cycle versus 12–18 months for evaporation ponds, fresh water consumption of ~800 gallons
              per ton of lithium versus ~18,000 gallons for conventional ponds, and a claimed cost of ~$2,500/ton versus
              ~$4,200/ton for evaporation-pond operations. Power requirements are claimed at less than $100/ton. These
              figures appear in the EnergyX investor materials and technology webpage, and the recovery rate of
              approximately 96% appears in the 2026 Regulation A offering circular as a pilot-plant result. The
              Preliminary Feasibility Study (PFS) completed April 9, 2025 by Worley — a global EPC firm — confirmed
              capital expenditure estimates placing Project Black Giant near the lower end of the global cost curve and
              included pilot-scale results supporting anticipated commercial scalability, while explicitly flagging that
              results from small-scale pilot tests may not be replicated at commercial scale. The PFS also used Inferred
              mineral resource categories (less certain than Indicated/Measured), adding geological uncertainty on top
              of the technology scale-up uncertainty. Key diligence items that remain unsupported in public documents:
              final battery-grade purity specifications (% LiOH or Li₂CO₃ grade), documented membrane replacement
              cadence and cost, full lifecycle environmental performance at commercial scale, and independently
              corroborated operating uptime or system reliability data. The technology page comparisons (against
              nanofiltration, reverse osmosis, ion sorption, and ion exchange) are authored by EnergyX without
              independent third-party validation at commercial scale. The DOE awarded EnergyX a $5 million grant to
              extract lithium from geothermal brines — a government technical endorsement of the approach — but no
              published DOE performance evaluation has been identified.
