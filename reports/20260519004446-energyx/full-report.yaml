      - number: '2.5'
        title: Sizing and Adoption Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Several critical sizing and adoption diligence gaps remain unresolved and bear directly on EnergyX's
              valuation and investor risk assessment. First, there is no independent, peer-reviewed market sizing study
              of the DLE technology licensing sub-market; all available estimates embed DLE as a sub-driver within
              broader lithium market forecasts rather than sizing the licensing fee market separately. Without this,
              EnergyX's SAM for technology licensing cannot be independently verified. Second, the spread between
              analyst forecasts is material: Grand View Research's $96.45 billion market by 2033 versus Mordor
              Intelligence's volume-based forecast implying roughly $40-44 billion at current depressed prices
              represents a near-2.5x discrepancy. This gap has not been reconciled and depends entirely on price
              scenario assumptions that are themselves highly uncertain given the $81,500/ton to $9,000/ton price
              collapse observed between 2022 and 2025. Third, EnergyX's investor materials cite a pre-money implied
              valuation of $3.26 billion derived solely from the Reg A offering share price, without an independent
              institutional appraisal or comparable transaction analysis; at $9,000/ton LiCO3 spot prices, backing into
              a revenue multiple for the eventual project yield is highly sensitive to price recovery assumptions.
              Fourth, DLE's commercial deployment status is unverified at scale: EnergyX claims 98% real-world pilot
              recovery, but no third-party independent audit of pilot throughput, uptime, or cost per ton has been made
              public. Albemarle's acknowledgment that DLE remains pre-commercial confirms the technology is not yet
              de-risked across the industry. Fifth, the adoption trigger timeline for oilfield brine and geothermal
              brine buyer segments is unclear: while Exxon has acquired Smackover brine rights and SLB provides
              geothermal infrastructure, the commercial pathway and timeline for large-scale U.S. brine lithium output
              remains unquantified. These gaps are partially mitigated by EnergyX's strategic investors (GM, POSCO, Eni)
              who provide non-public due diligence signals, but they remain open for independent diligence purposes.
            claimRefs:
              - CM035
              - CM036
              - CM044
              - CM031
              - CM030
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Lithium Price Collapse Threatens DLE Project Economics
            body: >-
              Annual average U.S. battery-grade lithium carbonate prices fell to $9,000/ton in 2025, a 31% decline
              year-over-year and nearly 86% below the 2022 peak. At these price levels, many DLE projects—requiring
              substantial upfront capex and operating cost per ton—are sub-economic without a price recovery assumption.
              This is EnergyX's single largest market-driven risk: its crowdfunded valuation of $3.26 billion pre-money
              implies a revenue multiple that only makes sense if prices recover to $20,000+/ton or if technology
              licensing fee income is substantial and relatively price-insensitive.
            calloutType: risk
            claimRefs:
              - CM030
              - CM014
              - CM044
          - type: callout
            title: DLE Has No Standalone Market Size — Sizing Gap Creates Valuation Risk
            body: >-
              No independent market research firm has published a peer-reviewed standalone DLE technology licensing
              market size. All major analyst reports (Mordor, Grand View, BNEF) treat DLE as a sub-driver rather than a
              separate market. This means EnergyX's investors cannot independently verify the TAM claim implied by the
              company's $3.26 billion pre-money valuation. A dedicated DLE licensing market study—analogous to what
              exists for carbon capture technology licensing—is a diligence priority.
            calloutType: insight
            claimRefs:
              - CM035
              - CM044
          - type: callout
            title: 30-60% Brine Share Applied to Derive SAM
            body: >-
              The SAM estimate for brine-addressable lithium is derived by applying EnergyX's own cited figure (30-60%
              of world lithium from brine sources) to the Mordor Intelligence 2025 base of 1.54 million LCE tons,
              yielding an estimated 462,000-924,000 LCE tons. This is an agent-derived calculation, not a
              publisher-reported SAM figure. The 30-60% share figure appears in EnergyX's SEC 1-K filing but is not
              attributed to an independent source within that filing.
            calloutType: assumption
