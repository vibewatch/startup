      - number: '3.5'
        title: Market Structure, Win/Loss Factors, and Evidence Gaps
        blocks:
          - type: paragraph
            body: |
              The DLE market in 2026 is fragmented and pre-revenue, with five or more credible technology
              developers plus oil-major entrants all competing for a limited pool of near-term brine project
              opportunities. The absence of any commercial DLE production means competition is currently won
              and lost on: (1) quality of pilot data and demonstration duration, (2) offtake and partner
              credibility, (3) engineering completion milestones (FEED, FEL-3), (4) regulatory and
              environmental permit progress, and (5) capital access. On all five dimensions, EnergyX's
              publicly disclosed position lags Standard Lithium and Lilac Solutions as of May 2026. EnergyX
              has not disclosed binding offtake agreements, FEL-3 engineering completion, a continuous
              multi-year pilot dataset, or environmental permit approvals comparable to those of its two
              leading peers. This gap is not evidence of fundamental technology failure — it may reflect
              EnergyX's earlier-stage development timeline or a deliberate project sequencing choice — but
              it is a material unresolved question for competitive diligence.

              Win conditions for EnergyX: securing a strategic brine project partnership (similar to
              Standard Lithium's Equinor tie-up or Lilac's Traxys relationship), demonstrating multi-year
              continuous pilot performance at or above peer benchmarks, and converting its OEM relationships
              into exclusive or volume-committed supply agreements. Loss conditions: if Lilac achieves first
              commercial production at Great Salt Lake in 2027 as targeted, or Standard Lithium commissions
              the SWA Project in 2029, EnergyX's first-mover option in North American DLE narrows
              significantly. The Smackover Formation is the most advanced DLE brine basin in the US, and
              both Standard Lithium and ExxonMobil are already occupying it.

              Evidence still missing to complete competitive diligence: EnergyX's brine pilot operating hours
              and cycle data; comparative CAPEX and OPEX per tonne LCE estimates from independent engineering
              firms; EnergyX's patent portfolio breadth and freedom-to-operate analysis; and confirmation of
              whether EnergyX's GM and Samsung partnerships include any volume commitments or capital
              co-investment beyond technology validation.
            claimRefs:
              - CP040
      - number: '3.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Commercial Execution Gap: EnergyX Lags Peers on Key Milestones'
            body: >-
              As of May 2026, EnergyX has not disclosed binding offtake agreements, completion of FEL-3 or FEED
              engineering, a multi-year continuous pilot dataset at peer scale, or regulatory permit approvals
              comparable to Lilac Solutions (FEL-3 done, 2027 production target) or Standard Lithium (6-year demo, FID
              targeted 2026). This lag does not confirm technology inferiority, but it raises material questions about
              commercialisation timeline and competitive position as Lilac approaches construction-readiness.
            calloutType: risk
            claimRefs:
              - CP030
              - CP034
              - CP040
          - type: callout
            title: DLE Triangle Controversy
            body: >-
              ExSorbtion's public critique of the DLE industry — that most technologies fail to meet all three
              requirements of long sorbent life (>500 cycles), fast adsorption (<5 min), and high selectivity
              simultaneously — is an adversarial data point. If valid, it challenges the commercial feasibility claims
              of all pre-commercial DLE players including EnergyX. The claim remains unverified by independent testing
              but underscores the systemic risk that none of the DLE technologies have been proven at full commercial
              scale.
            calloutType: insight
            claimRefs:
              - CP019
              - CP021
              - CP039
          - type: callout
            title: Standard Lithium's Data Moat Is the Highest Competitive Bar
            body: >-
              Standard Lithium's six-year continuous demonstration plant record — 1 million barrels of real brine
              processed, 15,000 DLE cycles, zero safety incidents — constitutes the most credible engineering evidence
              base in the North American DLE space. Project lenders and brine resource owners are likely to require
              demonstrated process reliability at this level before committing project capital, making SLI's data set a
              genuine procurement barrier.
            calloutType: strength
            claimRefs:
              - CP011
              - CP035
          - type: callout
            title: EnergyX Technology Validation Assumed from Partnership Signals
            body: >-
              EnergyX's GM and Samsung SDI partnerships are treated as technology validation proxies in the absence of
              published pilot performance data. This analysis assumes those partnerships involved some degree of
              technical due diligence, but cannot confirm the depth or exclusivity of the relationships from public
              disclosures.
