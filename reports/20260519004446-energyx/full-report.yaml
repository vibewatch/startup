  - id: FE002
    title: Brine-to-Battery-Grade Lithium Process Flow
    type: flow
    layout: standard
    summary: Sequential process flow from raw brine feed through GET-Lit™ sub-modules to battery-grade lithium output.
    data:
      nodes:
        - id: brine-intake
          label: Brine Intake & Pre-filtration
          note: Removes solids; conditions pH/temperature
        - id: mmm-ed
