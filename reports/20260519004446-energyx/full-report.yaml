  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Definitions, and Adjacencies
        blocks:
          - type: paragraph
            body: >-
              EnergyX's addressable market is multi-layered and must be defined before sizing is meaningful. At the
              broadest level, EnergyX participates in the global lithium supply chain, a market driven almost entirely
              by the rechargeable battery sector. According to USGS Mineral Commodity Summaries 2026, batteries
              accounted for 88% of global lithium end use, with ceramics and glass at 4%, lubricating greases at 2%, and
              all other uses comprising the remainder. Within lithium supply, EnergyX's primary operating segment is
              brine-based lithium, not hard-rock spodumene mining (the latter dominant in Australia, Canada, and
              Zimbabwe). The Lithium Triangle—Chile, Argentina, and Bolivia—is estimated in EnergyX's own SEC filing to
              hold over 50% of the world's known lithium deposits, making it the core brine geography. EnergyX's SEC 1-K
              annual report filed in April 2026 explicitly frames the company's technology as a processing mechanism for
              lithium-enriched brines found in salt flats and formation waters. Three distinct revenue models flow from
              this: (1) DLE technology licensing and equipment sales to brine-operating producers who retrofit or
              greenfield operations with GET-Lit/LiTAS membrane technology; (2) lithium chemicals offtake from
              EnergyX-operated production assets such as Project Black Giant (Chile) and Project Lonestar (Texas); and
              (3) future battery materials or lithium metal sales. The excluded spend is substantial: hard-rock mining,
              battery cell manufacturing, battery recycling at scale, and solar evaporation ponding without DLE
              retrofits are not addressable by EnergyX's current technology stack. The status-quo substitute for DLE is
              traditional solar evaporation ponding, which the industry consensus places at 30-40% lithium recovery and
              18-24 months evaporation time. Adjacent markets include utility-scale battery energy storage (BESS),
              battery recycling/black-mass processing, and next-generation lithium-metal batteries where EnergyX claims
              research interests. The multi-layer framing is important for diligence: EnergyX's market size claims in
              investor materials mix global lithium demand projections (top-down TAM), DLE-addressable brine markets
              (SAM), and its own project production targets (SOM)—these must not be conflated.
