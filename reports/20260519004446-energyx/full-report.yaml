      - number: '5.6'
        title: Technical Diligence Gaps and Failure Modes
        blocks:
          - type: paragraph
            body: >-
              The central technology risk is the gap between pilot-plant results and commercial-scale performance.
              EnergyX explicitly acknowledges in its risk factors that "there can be no assurances that results obtained
              in small-scale laboratory tests, pilot plants, or demonstration plants will be duplicated in larger scale
              commercial operations." Critical scaling steps include confirming the stability of key chemical
              components, establishing the expected useful life of membranes, and achieving consistent purity
              specifications across variable brine chemistries. The company has yet to demonstrate continuous operation
              of the full brine-to-battery-grade lithium chain at commercial throughput. The technology comparison table
              on energyx.com is company-authored without independent validation. Key unsupported claims include: (1) the
              ~$2,500/ton operational cost target — derived from the PFS and not from commercial operations; (2) purity
              specifications for the lithium product (LiOH, Li₂CO₃ grades) — not publicly disclosed; (3) membrane
              replacement cadence — not disclosed; (4) the SoLiS™ timeline and technical milestones for coin/pouch cells
              to pilot lithium-metal production. Additional failure modes include: brine chemistry variability at scale
              (competitor DLE projects have encountered scaling challenges); country risk in Chile (water rights,
              regulatory approvals); membrane fouling at high salinity over time; solvent-extraction reagent costs and
              environmental handling; and competition from well-capitalized incumbents (Exxon, SLB, Standard Lithium,
              Lilac Solutions) that are also advancing DLE. The DOE grant endorses the geothermal brine application but
              does not validate commercial performance. NUKE-it™ technology is at a nascent stage with no technical
              disclosure sufficient for diligence. The overall technology readiness level (TRL) appears to be ~5–6
              (pilot demonstrated in relevant environment), with commercial readiness (TRL 9) requiring successful
              demonstration plant completion and positive DFS.
            claimRefs:
              - CE036
              - CE037
              - CE038
              - CE039
              - CE040
              - CE041
