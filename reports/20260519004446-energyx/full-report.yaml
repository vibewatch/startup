    sections:
      - number: '1.1'
        title: Identity, legal form, and operational scope
        blocks:
          - type: paragraph
            body: >-
              Energy Exploration Technologies, Inc., operating publicly as EnergyX, was incorporated in Puerto Rico on
              December 18, 2018, and is classified under SIC code 2810 (Industrial Inorganic Chemicals). The company's
              principal operational presence is in Austin, Texas, with its mailing address at 2535 Ridgepoint Drive
              #100, Austin TX 78754, and its registered corporate address in San Juan, Puerto Rico. On its CIK
              0001830166, the SEC classifies EnergyX as an "emerging growth company" under Regulation A of the
              Securities Act. The company's stated mission is to solve the global lithium shortage by developing and
              commercializing direct lithium extraction technology alongside lithium-rich brine resource projects in
              Chile, Texas, Arkansas, and through partnerships in Utah. EnergyX's official homepage states "110+"
              employees and "140+" patents, though its FY2025 annual report filed with the SEC in April 2026 discloses
              61 full-time and 7 part-time employees as of the filing date, with the discrepancy likely attributable to
              contractors and consultants not captured in the 1-K headcount. As of the April 2026 offering circular,
              EnergyX was offering shares at $13.00 per share in a continuing Regulation A campaign, with its investor
              portal reporting approximately $177.9 million raised and over 49,000 investors in aggregate across all
              campaigns.
