              Austin partnership also included $150,000 in sponsored research. EnergyX's careers page highlights that
              40% of employees hold PhDs, the team spans 22 universities globally and 7 countries, and the company has
              filed over 100 patents (self-reported round number, confirmed by the precise count of 134 in SEC filings).
              Key technical leadership includes CTO Dr. Amit Patwardhan. The company recruits across separation
              technologies, battery engineering, and corporate positions, with Austin, TX as its science headquarters
              and San Juan, Puerto Rico as its corporate headquarters, plus Chile operations. Developer signal is
              observable through patent filing velocity, academic partnerships, and technical hiring, but EnergyX has no
