  - id: TE002
    title: 'GET-Lit™ Technical Architecture: Process Layers and Risk'
    columns:
      - Layer / Process Step
      - Component / Sub-System
      - Role in Brine-to-Battery Chain
      - Key Dependency
      - Risk
    rows:
      - - Feed Preparation
        - Brine intake / pre-filtration
        - Remove solids; condition salinity and pH
        - Brine quality (salinity, Mg/Li ratio, temperature)
        - Variable brine chemistry at Black Giant vs test brine used in pilot
      - - Primary Separation
        - Mixed-Matrix Membrane (MMM) electrodialysis modules
        - Concentrate Li⁺; reject Na⁺, Mg²⁺, Ca²⁺
        - Membrane selectivity ratio; power supply stability
        - Membrane fouling, degradation, and replacement frequency at commercial scale
      - - Secondary Concentration
        - Solvent Extraction (SX) circuits
        - Strip Li into concentrated organic phase; back-extract as LiCl
        - Organic solvent supply, handling, and waste management
        - Reagent cost escalation; environmental handling at volume
      - - Polishing / Upgrading
        - Ion Adsorption (AX) media
        - Final purity upgrade to battery-grade Li compound
        - Adsorbent selectivity; regeneration cycle cost
        - Purity specification not publicly confirmed; regeneration data not disclosed
      - - Product Conversion
        - Crystallization / precipitation (implied)
        - Convert LiCl to LiOH·H₂O or Li₂CO₃
        - Reagent input (NaOH); energy input
        - Step not described in public technical materials
      - - Membrane Manufacturing
        - Roll-to-roll (R2R) manufacturing equipment
        - In-house MMM production for own use and licensing
        - Capital equipment operability; chemical precursors
        - R2R equipment procured but commercial production not yet confirmed
      - - Scale-Out Architecture
        - Module cluster racks → electrodialysis units → facility
        - 'Modular expansion: thousands of module stacks linked'
        - Civil/structural engineering; materials supply at scale
        - Scale-up from pilot to commercial is the primary unvalidated step
    notes: >-
      Architecture derived from EnergyX technology page, offering circular (form253g2.htm), and SEC annual filing
      (part-ii.htm FY2025). Product conversion step (LiCl → LiOH/Li₂CO₃) is inferred from standard DLE industry
      practice; not separately described in EnergyX public documents. Battery-grade purity specification not publicly
      confirmed.
