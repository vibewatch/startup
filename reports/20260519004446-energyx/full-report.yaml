    lithium from natural and industrial brines, sold as pilot units and equipment packages today and targeting a
    Technology-as-a-Service licensing model and lithium-production revenue from owned brine projects at commercial
    scale.
  customerFocus: >-
    Lithium producers, brine-resource owners, battery materials companies, and sovereign energy entities seeking
