        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory exposure spans securities law, mining and brine permitting, export controls, and Chile-facing
              title or fiscal uncertainty. EnergyXs own filings acknowledge risk from South American salars,
              counterparty exposure in South America, and difficulty acquiring accurate title to land and mineral
              rights. For U.S. buildout, the permit surface is fragmented rather than singular: TCEQ controls broad
              environmental authorizations in Texas, the Railroad Commission covers oil-and-gas, injection, and
              brine-production pathways relevant to lithium projects, EPA overlays Class II injection-well rules, and
              Arkansas maintains a state regulator for brine-resource conservation and environmental protection. That
              multiplies schedule risk because any commercial DLE path touching oilfield brines or disposal wells can
              face sequential approvals rather than one permit package. On the legal side, exempt-offering rules do not
              relax disclosure obligations; they relocate them into a framework where rescission rights,
              misleading-statement exposure, and filing-quality problems can still produce contingent liability or
              transaction friction.
