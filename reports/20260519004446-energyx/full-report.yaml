      - number: '3.4'
        title: Claimed Moats and Where They Are Weak
        blocks:
          - type: paragraph
            body: |
              EnergyX's claimed moats include its LiBRE membrane IP, strategic partnerships with General Motors
              and Samsung SDI, and its positioning as a US-based DLE company eligible for IRA and DOE support.
              The GM and Samsung SDI partnerships signal OEM-level technical validation and imply access to
              downstream demand. However, these partnerships appear non-exclusive based on public disclosures,
              and GM's pivot toward capital preservation in EV scaling raises questions about the durability of
              the strategic relationship. The IRA policy tailwind faces political risk under changing
              administrations, and China's scale in DLE-adjacent sorbent manufacturing could undercut
              equipment cost advantages.

              Against EnergyX's moats, Lilac Solutions' commercial position is materially stronger on key
              indicators as of May 2026: FEL-3 engineering complete, binding 100%-of-Phase-1 offtake with a
              Tier-1 commodity trader (Traxys), and manufacturing capacity for IX media at a dedicated Nevada
              facility. Standard Lithium's six-year continuous demonstration dataset — 1 million barrels
              processed, 15,000 DLE cycles, zero safety incidents — constitutes an engineering evidence dossier
              that competing technologies without comparable operating hours cannot match in procurement
              evaluations requiring demonstrated process reliability. This data moat is the highest-severity
              competitive risk for EnergyX, as brine project owners and lenders increasingly demand demonstrated
              cycle life at relevant scale before committing CAPEX.

              Switching costs in DLE are high once a technology is selected for a project: sorbent sizing,
              membrane specifications, brine chemistry tuning, and process engineering are all vendor-specific.
              This creates lock-in for the project sponsor but also creates high commitment risk for EnergyX —
              the company must demonstrate enough de-risked operational data to be selected in initial
              procurement. The IEA outlook for critical minerals notes that DLE-enabling technologies are
              essential for expanding global lithium supply, giving DLE in general a structural tailwind,
              but this tailwind is shared across all DLE players and does not differentiate EnergyX within the
              peer group.
