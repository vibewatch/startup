  - id: FV001
    title: Recommendation Logic Flow
    type: flow
    layout: standard
    summary: Chain from evidence layers through risk and valuation assessment to TRACK recommendation for EnergyX.
    data:
      nodes:
        - id: evidence
          label: Evidence Base
          description: Technology validated at lab; $151M raised; DLE patent portfolio; strategic investors (GM, POSCO, Eni)
        - id: market
          label: Market Context
          description: IEA critical minerals demand; $8.1B DLE market by 2029 (MarketsandMarkets); lithium supply gap risk
        - id: valuation
          label: Valuation Reality Check
          description: $3.26B implied vs. $887M–$1.68B public comps; 2,963× revenue multiple; no independent appraisal
        - id: risk
          label: Key Risks
          description: No commercial revenue; going concern; no Series C; conditional EXIM/GEM; institutional price gap
        - id: recommendation
          label: 'Recommendation: TRACK'
          description: Real optionality but stretched valuation; entry at $13 requires more evidence before BUY
