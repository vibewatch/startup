      - number: '8.5'
        title: Uncertainty and Data-Quality Discounts
        blocks:
          - type: paragraph
            body: >-
              The valuation chapter carries materially higher uncertainty than typical early-stage assessments because
              of several structural data gaps. First, there is no independent third-party valuation of EnergyX
              shares—the offering price is set by management and the SEC Form C explicitly acknowledges this as a risk.
              Second, the full capitalization table is not publicly disclosed beyond Series B preferred (18.7 million
              shares post-split) and common stock sold via Reg A and Reg CF; options, RSAs, warrants, and
              milestone-based shares from the Pantera acquisition may be materially dilutive. Third, the going-concern
              warning recurs across all annual filings (FY2023 C-AR, FY2024 1-K, FY2025 C-AR), indicating structural
              dependence on continued equity raises rather than self-funded operations. Fourth, the absence of any
              institutional Series C lead or co-investor at current valuation levels is a material adverse signal: if
              sophisticated institutions with access to the same information decline to price EnergyX above $4.00/share
              equivalent, retail investors pricing at $13.00/share face an adverse selection risk. Fifth, EXIM Bank and
              GEM PIPE commitments are conditional and cannot be treated as committed capital for valuation purposes.
              Applying a standard data-quality discount of 30–40% to the $3.26 billion management-implied valuation
              yields an evidence-adjusted range of $1.95–2.28 billion. This is still above the evidence-supported
              midpoint of $900 million–$1.5 billion, suggesting the current entry price remains stretched even after
              discounting. Diligence priorities include: a Series C term sheet (independent price discovery), a signed
              DLE licensing contract with disclosed terms, and an independently audited feasibility study. The
              MarketsandMarkets $8.1 billion DLE market projection by 2029 and IEA's critical minerals demand trajectory
              provide long-run support for the narrative, but narrative support does not close the gap between current
              evidence and current price.
