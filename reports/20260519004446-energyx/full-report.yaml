      - number: '1.4'
        title: Capital formation, investor mix, and crowdfunding strategy
        blocks:
          - type: paragraph
            body: >-
              EnergyX has raised approximately $151 million in total financing through December 31, 2025, per the FY2025
              annual report filed with the SEC in April 2026. The company's investor portal (invest.energyx.com)
              reported approximately $177.9 million raised as of mid-2026, reflecting the continuing $13-per-share
              Regulation A offering. The funding composition is unusual: EnergyX conducted the largest institutional
              round, a December 2022 Series B of $15 million led by GM Ventures, and later attracted strategic investors
              including POSCO's IMM Battery Fund III ($8 million, June 2023) and Eni SpA through Eni Next. However, over
              $80 million of the company's capital came from retail investors through DealMaker Securities-operated
              Regulation A offerings, making EnergyX one of the largest crowdfunding recipients in clean-tech history.
              The KingsCrowd analysis of EnergyX's December 2024 Regulation CF round published a pre-money valuation of
              approximately $1.145 billion; the company's investor portal states "Valued at Over $1 Billion," though no
              post-money valuation from any institutional round has been publicly disclosed. A binding commitment from
              GEM Global Yield provides up to $450 million in PIPE financing upon a future public market listing. The
              TechCrunch 2024 article noted that Teague Egan owns approximately 47% of shares on a fully diluted basis,
              that the CEO was "considering" both a SPAC path and a traditional Series C, and characterized the
              crowdfunding strategy as a deliberate choice to build a retail-investor community and avoid full
              venture-capital dilution while retaining founder control.
