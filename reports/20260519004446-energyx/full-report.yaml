  - id: FE001
    title: 'EnergyX Technology Stack: GET-Lit™ Platform Layers'
    type: stack
    layout: standard
    summary: Hierarchical view of EnergyX's GET-Lit™ product platform layers from raw brine input to final output.
    data:
      layers:
        - label: End Markets
          modules:
