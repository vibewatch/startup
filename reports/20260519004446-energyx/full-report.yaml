      - number: '4.4'
        title: Project-Level Economics and Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              EnergyX's capital requirements dwarf its current balance sheet, and the company relies on a layered
              financing strategy to bridge to commercial production. The US Department of Energy selected EnergyX for a
              $5 million grant to develop a lithium-extraction demonstration facility from geothermal brines in East
              Texas; the investor portal confirms the "Demo plant fully operational in East Texas (with $5M DOE
              support)" as of the time of current filings. In July 2024, EnergyX signed a Letter of Intent (LOI) with
              the US Export-Import Bank (EXIM) for $690 million in project financing for Project Black Giant in Chile,
              with Goldman Sachs engaged as a capital-strategy advisor; this LOI is non-binding and conditional on
              achieving commercial milestones and final investment decision. In April 2025, EnergyX completed a
              Pre-Feasibility Study (PFS) for Project Black Giant in partnership with Worley, a global EPC engineering
              firm, which "confirms the economic viability of Project Black Giant." No PFS-derived capital cost
              estimate, operating cost per tonne, NPV, or IRR has been publicly disclosed, leaving the economic case
              substantially opaque to outside investors. Project Lonestar (East Texas, via the EXSO LLC subsidiary)
              similarly completed a PFS with a major EPC firm by year-end 2025, but specific economics remain
              undisclosed. EnergyX secured a site for the Lonestar demonstration plant at TexAmericas Center—a
              ~12,000-acre industrial campus in Texarkana, Texas operated by a political agency—under an option
              structure that requires EXSO to invest $100 million in capital improvements to exercise the land purchase
              right. The Compass Minerals partnership ("America's Lithium Future") targets 30,000 tpa from the Great
              Salt Lake brine; no commercial timeline, capex, or offtake terms are publicly disclosed. An early
              Netcapital filing (2021, stale) suggested the EnergyX-portion capital requirement for a 15,000-tpa
              facility is roughly $15 million, but the current Black Giant Phase I/II targets 52,500 tpa—implying far
              higher aggregate capex. The EXIM LOI of $690 million, if consummated, would cover the bulk of debt
              financing for Chile, but triggers require a bankable DFS, environmental approvals, and a commercially
              proven extraction process.
