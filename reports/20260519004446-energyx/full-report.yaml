      - number: '7.2'
        title: Financing and Capital Structure Risk
        blocks:
          - type: paragraph
            body: >-
              Financing risk is the most immediate thesis threat because it can halt every other workstream even if the
              technical case improves. EnergyX has now disclosed going-concern language in two consecutive annual
              reports, and the same filings warn that additional capital may need to be raised on unfavorable terms or
              in down rounds. The company has shown real fundraising capacity through repeated Regulation A activity and
              a record-setting retail raise, but that history also proves continued dependence on capital markets rather
              than self-funding operations. The 2026 offering circular adds a more specific securities-law overhang:
              investors in a narrow 2024 sales window may hold statutory rescission rights if those sales are ultimately
              found non-compliant. The March 2025 non-reliance filing is separate from that issue but compounds
              disclosure-quality risk. Meanwhile, the widely cited EXIM letter of intent remains a conditional financing
              pathway, not interchangeable with funded debt already available for draw.
