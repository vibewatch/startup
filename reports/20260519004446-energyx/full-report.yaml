            body: >-
              Governance risk is not abstract here; it sits directly in the offering documents. EnergyXs annual reports
              say the company is heavily reliant on key personnel, and the FY2025 filing says founder and CEO Teague
              Egan will control a majority of voting power after the offering. That matters because the company is
