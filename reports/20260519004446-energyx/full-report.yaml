              Teague Egan, age 37 at the time of the April 2026 offering circular, is the sole named founder and serves
              simultaneously as Chief Executive Officer, President, Chairman of the Board, and the controlling
              shareholder of EnergyX, holding approximately 63.76% of total voting power. Egan holds an MBA in
