  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Revenue Quality
        blocks:
          - type: paragraph
            body: >-
              EnergyX's FY2025 revenue of $1.1 million is composed of two small, pre-commercial streams: approximately
              $243,675 from brine-testing services (analyzed under short-term contracts with potential commercial
              partners) and the balance—roughly $857,000—from membrane equipment sales, principally EnergyX's GET-Lit™
              DLE membrane systems sold to third-party testers and early adopters. Neither stream represents
              commercial-scale recurring revenue; the company's own 1-K filing classifies itself as a "pre-commercial
              revenue, development stage, energy technology company" that has "not generated any revenues from licensing
              our technology." FY2024 contained only trace testing income with no equipment product revenue on any
              material scale, and FY2023 likewise reported zero commercial revenue. The company's forward revenue model
              has three legs: (1) a Technology-as-a-Service ("TaaS") membrane-replacement model where customers buy
              consumable membranes and extractants on a 2-3 year replacement cycle; (2) upstream lithium-production
              revenue once Project Black Giant (Chile), Project Lonestar (East Texas/Arkansas), and the Compass Minerals
              Great Salt Lake partnership reach commercial scale; and (3) equipment licensing fees to major producers.
              The TechCrunch interview quotes the CEO as noting that equipment licensing to major producers involves
              "multi-hundred [million] if not billion-dollar final investment decisions" with long sales cycles. Gross
              margin on the existing revenue streams is not publicly disclosed; neither the FY2025 nor FY2024 1-K breaks
              out cost of goods sold or gross profit as a separate line item, rendering margin analysis unavailable from
              public sources. No contracted forward revenue, customer concentration disclosures, or backlog figures are
              published. The Netcapital 2021 Reg CF filing noted a projected 30-40% IRR for producers who adopt EnergyX
              technology and estimated the company's portion of a 15,000-tpa commercial facility at roughly $15
              million—but that figure pre-dates the company's scale-up strategy and should be treated as a rough, stale
              proxy only.
