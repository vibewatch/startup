            body: >-
              EnergyX's most credible near-term customer prospects are its strategic investors. GM Ventures led the
              December 2022 Series B round and Stefon Crawford (a GM Ventures Partner) joined the EnergyX Board of
              Directors. TechCrunch reported in October 2024 that EnergyX plans to sell DLE equipment to POSCO and
