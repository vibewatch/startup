companyProfile:
  summary: >-
    Energy Exploration Technologies, Inc. (EnergyX) is a pre-commercial direct lithium extraction technology and
    lithium-resource company incorporated in Puerto Rico in December 2018 and headquartered operationally in Austin,
    Texas. The company's flagship GET-Lit™ DLE membrane system—rooted in foundational research from the University of
    Texas at Austin—claims up to 90% lithium recovery from brine versus roughly 30–40% with traditional solar
    evaporation, and is backed by 140+ patents. EnergyX raised approximately $151 million through December 2025 via
    Regulation A/CF retail crowdfunding, a $15 million GM Ventures-led Series B, and strategic investments from POSCO's
    IMM Battery Fund and Eni Next. The company generated $1.1 million in FY2025 revenue from pre-commercial membrane
    equipment sales and brine-testing services, and its independent auditors issued going-concern qualifications in both
    FY2024 and FY2025. A Worley pre-feasibility study for Project Black Giant in Chile was completed in April 2025, and
    an EXIM Bank letter of intent for up to $690 million in project financing was signed, though both remain conditional
    on milestones not yet achieved.
