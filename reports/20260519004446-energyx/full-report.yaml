      - number: '8.2'
        title: Comparable Companies and Peer Set
        blocks:
          - type: paragraph
            body: >-
              Establishing a peer set for EnergyX is methodologically complex because it occupies a rare intersection: a
              pre-commercial DLE technology company with a technology-licensing business model, a retail-investor
              capital structure, and an early-stage project developer profile. The cleanest direct public comparables
              are Standard Lithium (NYSE: SLI) and Lithium Americas (NYSE: LAC), both pre-commercial or
              early-development-stage DLE/lithium project developers with no material revenue. As of May 18, 2026,
              Standard Lithium had a market capitalization of approximately $887 million despite operating a DLE
              demonstration plant in Arkansas—a more advanced operational milestone than EnergyX has achieved. Lithium
              Americas traded at $1.68 billion market cap with a fully-permitted Nevada lithium project substantially
              further along in project development. EnergyX's $3.26 billion implied valuation is 3.7× Standard Lithium
              and 1.9× Lithium Americas—both of which have independently audited financials, exchange listings, and
              institutional shareholders. For commercial lithium producers Albemarle ($20.7 billion market cap on $1.43
              billion revenue, 14.5× P/Rev) and SQM ($23.6 billion market cap on $1.32 billion revenue, 17.9× P/Rev),
              EnergyX would need to achieve approximately $225 million in revenue at SQM-equivalent multiples to justify
              $3.26 billion— versus its current $1.1 million. Private DLE peers include Lilac Solutions, which raised
              approximately $145 million through a Series B in 2023 and remains private with no disclosed valuation, and
              International Battery Metals (IBAT), publicly listed with minimal disclosed revenue. S&P Global Commodity
              Insights noted in 2023 that no DLE company had yet reached commercial production scale. The most
              defensible valuation anchor for EnergyX against the peer set is the $800 million–$1.5 billion range,
              reflecting project-developer multiples with a technology-option premium, not the $3.26 billion implied by
              the management-set offering price.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
