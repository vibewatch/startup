      - number: '3.3'
        title: Technical and Commercial Comparison
        blocks:
          - type: paragraph
            body: |
              The DLE competitive landscape divides into three technology families: ion exchange (Lilac),
              adsorption-based processes (Standard Lithium via KTS/Aquatech partnership, ExSorbtion), and
              membrane-based selective extraction (EnergyX). Each presents distinct tradeoffs in OPEX
              (reagent, sorbent replacement), CAPEX (infrastructure, membrane area), brine grade flexibility,
              and freshwater consumption. Standard Lithium's SiFT process adds a purification stage that
              produces battery-grade carbonate without a separate hydroxide conversion step, providing a
              potential cost advantage in certain application segments. Lilac's IX technology claims 5–20
              m³/tonne LCE freshwater consumption and operation across 20–5,000 mg/L brine grades, the
              widest claimed operating range in the peer group.

              A critical market observation as of May 2026 is that no DLE technology company has achieved
              commercial-scale lithium production. All leading DLE players — EnergyX, Lilac, Standard Lithium,
              ExSorbtion — remain in the pre-commercial or late demonstration phase. Standard Lithium is the
              furthest along on operational demonstration maturity, with its 6-year continuous Arkansas demo
              and binding offtake in place. Lilac leads on commercial structuring with FEL-3 engineering
              complete and a binding 100%-of-Phase-1 offtake securing a clear pathway to construction.
              EnergyX lags both on comparable disclosed metrics: no binding offtake, no disclosed FEL-3
              completion, and no published continuous pilot data at Lilac or Standard Lithium scale.

              The pricing and packaging comparison reveals that DLE technology pricing is largely opaque.
              EnergyX has not disclosed licensing fees or project development fees. Lilac's offtake pricing
              is market-index linked (per the Traxys agreement). Standard Lithium is a project developer
              rather than a technology licensor, so its "price" is embedded in equity project economics.
              SQM and Albemarle compete on commodity pricing for lithium carbonate and hydroxide on spot and
              long-term contract markets, representing the ultimate benchmark that DLE-produced lithium must
              meet or undercut.
