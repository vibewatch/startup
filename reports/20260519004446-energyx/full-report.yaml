            body: >-
              As of the 2025 annual filing, EnergyX holds 134 patents or patent applications covering separation media,
              process configurations, manufacturing methods, and battery technology. Of these, 50 are published. The
              company has filed utility patent applications in the US and internationally covering compositions of
              matter, processes, and manufacturing articles for both GET-Lit™ (DLE) and SoLiS™ (battery). IP protection
              is multi-layered, combining patents, trade secrets, and trademark rights. The LiTAS® trademark was
              registered in January 2025. EnergyX has two university IP agreements: a Second UT Austin Patent License
              Agreement (January 2023) for jointly owned IP covering battery framework and selective ion transport (3%
