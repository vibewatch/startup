          - type: callout
            title: 'Critical Adverse Signal: No Institutional Follow-On Above Series B Price'
            body: >-
              No institutional investor has invested at valuations above the $4.00/share (pre-split) Series B price set
              in 2023. All pricing above that level has been established through management-set retail offering prices.
              This absence of institutional price discovery at current valuation levels is the single most important
              adverse signal for retail investors evaluating the $13.00/share offering.
            calloutType: risk
            claimRefs:
              - CV022
              - CV024
              - CV041
          - type: callout
            title: 'Key Assumption: Valuation Multiples Require Commercial Technology Licensing'
            body: >-
              The bull case valuation of $2–4 billion requires EnergyX to transition from laboratory and pilot-scale
              demonstration to binding commercial licensing agreements at scale. This has not occurred in any DLE
              company as of the run date. The base case multiples are derived from project-developer benchmarks, not
              technology-licensing benchmarks, because no revenue has been generated at commercial scale.
            calloutType: assumption
            claimRefs:
