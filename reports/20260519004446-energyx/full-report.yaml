    title: Investment KPI Scorecard
    type: kpi
    layout: standard
    summary: >-
      IC-ready scoring across market, commercial proof, moat, economics, risk, valuation, and evidence quality
      dimensions.
    data:
      items:
        - label: Market Opportunity
          value: 8
          unit: /10
          note: IEA critical minerals demand + $8.1B DLE market by 2029; large and growing TAM
        - label: Commercial Proof
          value: 2
          unit: /10
          note: $1.1M FY2025 revenue; no commercial-scale production; going concern active
        - label: Technology Moat
          value: 7
          unit: /10
          note: Patent portfolio, UT license, 3× recovery claim; but unproven at commercial scale
        - label: Team / Execution
          value: 5
          unit: /10
          note: CEO Teague Egan strong retail narrative; experienced advisors; key-person risk
        - label: Capital Structure
          value: 3
          unit: /10
          note: Retail-only at premium; no institutional Series C; GEM/EXIM conditional only
        - label: Valuation vs. Evidence
          value: 2
          unit: /10
          note: $3.26B implied is 2–3.5× evidence-supported midpoint; no independent appraisal
        - label: Evidence Quality
          value: 4
          unit: /10
          note: Strong SEC disclosure; but opaque cap table, NDA-bound customer pipeline, no audited valuation
        - label: Downside Protection
          value: 2
          unit: /10
          note: No public market; illiquid; possible down-round risk; 1-year resale restriction
    approximationNotes: >-
      Scores are qualitative assessments (1–10 scale) based on analyst judgment and publicly available evidence as of
      May 2026.
