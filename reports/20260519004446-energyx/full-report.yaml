      - number: '8.3'
        title: Scenario Analysis and Sensitivity
        blocks:
          - type: paragraph
            body: >-
              Valuation under uncertainty for EnergyX requires explicit scenario decomposition, as the company's
              fundamental value is a function of three largely unproven variables: commercial-scale DLE deployment,
              technology licensing uptake, and access to project-scale capital. In the bull case, EnergyX successfully
              pilots Project Black Giant commercially by mid-2027, closes a Series C of $75–150 million at institutional
              terms, secures 2+ major licensing deals, and reaches $80–120 million in ARR by 2028–2029. At a 25–35×
              revenue multiple appropriate for a high-growth, IP-protected technology company with strong market
              tailwinds, this scenario supports a valuation of $2–4 billion—broadly consistent with the current $3.26
              billion implied. In the base case, EnergyX closes a Series C of $50–100 million by end-2026, completes its
              Black Giant pilot but licensing revenue grows slowly (below $20 million through 2027), and the path to
              commercial scale extends through 2028. A project-developer multiple of 6–12× projected 2029 revenue on
              $50–80 million supports a $600 million–$960 million valuation, rising to $1–1.5 billion with a
              technology-option premium. In the bear case, EnergyX cannot close a Series C, faces another Reg A bridge
              round, delays project financing, and lithium prices remain depressed. Without commercial revenue, the
              company may trade at a 50–70% discount to the current implied valuation, yielding $400–650 million—in line
              with early-stage DLE developers that have failed to reach commercial production. The total capital
              requirement through commercial production is estimated at $600–900 million (base to bull), with the EXIM
              Bank LOI, Goldman Sachs advisory, and Worley PFS providing credible but unconfirmed pathways. Benchmark
              Minerals data suggests lithium prices remain cyclically depressed from their 2022 peaks, creating a timing
              risk for project economics. IEA data supports structural long-run demand, but short-run price weakness is
              a material sensitivity driver.
