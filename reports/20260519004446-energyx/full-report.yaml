            - Defense / Nuclear (NUKE-it™)
            - Energy Storage (SoLiS™ lithium-metal batteries)
        - label: Product / Output
          modules:
            - Battery-grade lithium carbonate (Li₂CO₃)
            - Battery-grade lithium hydroxide (LiOH)
            - Lithium dihydrogen phosphate
            - Lithium metal (SoLiS™ — pre-commercial)
        - label: Downstream Processing
          modules:
            - Crystallization / precipitation (LiCl → LiOH or Li₂CO₃)
            - Lithium refinery module (implied; not separately described)
        - label: GET-Lit™ Core Platform
          modules:
            - Mixed-Matrix Membrane (MX) electrodialysis — primary Li separation
            - Solvent Extraction (SX) — concentration and stripping
            - Ion Adsorption (AX) — polishing to battery-grade purity
        - label: Infrastructure
          modules:
            - Roll-to-roll membrane manufacturing equipment (in-house)
            - Module cluster racks → electrodialysis units → facility
            - 'Pilot plants: Austin TX (Headway) + Antofagasta Chile (Testbed)'
        - label: Feed / Input
          modules:
            - Hypersaline brine (salt flats — Salar de Punta Negra, Smackover formation)
            - Geothermal brine (DOE grant application)
    approximationNotes: >-
      Downstream processing (crystallization/refinery) step is inferred from DLE industry practice; EnergyX does not
      separately describe this step in public technical materials.
