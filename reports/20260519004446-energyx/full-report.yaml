      - number: '4.3'
        title: Balance Sheet, Burn Rate, and Runway
        blocks:
          - type: paragraph
            body: >-
              The FY2025 balance sheet reveals a sharp liquidity deterioration: cash and cash equivalents fell from
              $36.0 million at December 31, 2024, to $8.6 million at December 31, 2025—a net reduction of approximately
              $27.4 million. The gross cash outflow from operations, capital expenditure (pilot and demonstration plants
              in Texas and Chile), and the $3.7 million initial cash payment on the Pantera acquisition exceeded $46
              million, partially offset by the $19 million in new Reg A proceeds during 2025. Working capital remains
              modestly positive ($9.9 million current assets versus $5.5 million current liabilities), but thin relative
              to the annual burn rate of roughly $20-21 million in operating losses. Management's liquidity disclosure
              in the FY2025 1-K states explicitly that "the Company had sufficient cash resources to fund its plan of
              operations through the end of Q2 2026"—placing the next funding cliff at approximately May-June 2026,
              coincident with the filing date of this report. Total liabilities of $10.5 million are dominated by lease
              obligations ($3.6 million operating and $0.6 million financing) and deferred purchase consideration for
              Pantera ($2.46 million across short- and long-term tranches); there are no interest-bearing bank loans,
              bonds, or revolving credit facilities. The company also maintains a $500,000 irrevocable standby letter of
              credit backing its Ridgepoint Drive lease, with no amounts drawn. Total assets of $96.1 million are
              inflated by intangible assets ($42.2 million, largely the Pantera mineral rights acquisition) and
              property/plant/equipment ($35.8 million), with cash at just 8.9% of total assets. Depreciation expense
              accelerated from $0.66 million in FY2024 to $3.17 million in FY2025, reflecting commissioning of
              demonstration-plant and laboratory capital equipment. Salary and consulting expenditure remained flat at
              approximately $11.4 million in both years, confirming no material change in headcount-driven burn.
