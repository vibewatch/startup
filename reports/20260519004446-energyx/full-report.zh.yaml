      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              EnergyX 所处市场的结构性驱动因素，是能源转型中最持久的一组：电气化强制目标按多年节奏收紧，主流车型电池成本平价已经达成，全球电网储能部署加速。电池成本最关键，因为它同时推动 EV
              采用（扩大锂需求），也验证低成本 DLE 供应的经济性（扩大 EV 总拥有成本优势）。BNEF November 2023 年度电池价格调查显示，锂离子电池包价格触及 $139/kWh 的历史低位；Mordor
              Intelligence 报告称，到 2025 年 LFP 电池包价格为 $108/kWh，低于紧凑型和中型车与内燃机总拥有成本平价的门槛。2025 年中国乘用 EV 市场超过 10 million
              辆，新注册量约 40%。EU 车队平均 CO2 规则在 2025 年收紧至 93.6 grams per kilometer，实质上要求零排放车辆销量至少达到 20%，否则会被罚款。California
              Advanced Clean Cars II 要求到 2026 年零排放车辆销量达到 35%。IRS clean vehicle tax credit（IRC Section 30D 下最高
              $7,500）在美国创造 EV 需求拉动，也间接给符合 IRA 电池组件来源要求的本土加工锂材料带来紧迫性溢价。电网级储能强制目标——尤其是美国、EU
              和中国沿海省份要求的四小时或更长时长配置——形成增长中的非汽车需求向量；Mordor Intelligence 估计它为 CAGR 预测贡献
              +4.2%。这些顺风之外，采用约束同样实质。锂价波动是近期最尖锐的风险：仅在 2023 年，现货价格就从约 $81,500/ton 摆动到 $22,500/ton；2025 年美国电池级 LiCO3 年均合同价为
              $9,000/ton，低于许多高成本项目的盈亏平衡点，包括尚未达到商业规模的 DLE 试点。Albemarle 公开承认 DLE “尚未完全商业化但可能具有革命性”，确认还没有 DLE
              技术以有竞争力成本实现持续商业规模吞吐。锂卤水项目资本强度高：50,000+ tpa 设施的项目融资需要数亿美元 capex，Atacama
              卤水运营的许可制度（水使用权、环境影响评估）又增加多年周期风险。从太阳能蒸发切换到 DLE，即使存量生产商已经持有卤水权，也需要大量新资本，形成采用惯性。地缘供应集中——Argentina
              四个卤水项目、Chile 两个、China 九个——给外国 DLE 技术部署带来政策风险。USGS 显示，截至 2025 年末，美国对锂的关税（氢氧化锂和碳酸锂 3.7% ad
              valorem）给进口增加边际成本摩擦。
