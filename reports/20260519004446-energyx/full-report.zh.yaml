      - number: '8.2'
        title: 可比公司与同业组
        blocks:
          - type: paragraph
            body: >-
              为 EnergyX 建立同业组在方法上很复杂，因为它处在一个少见交叉点：商业化前的 DLE 技术公司，采用技术许可商业模式，同时又有散户投资者资本结构和早期项目开发商特征。最干净的直接上市可比公司是
              Standard Lithium（NYSE: SLI）和 Lithium Americas（NYSE: LAC），两者都是商业化前或开发早期的 DLE / 锂项目开发商，均没有实质收入。截至 May 18,
              2026，Standard Lithium 市值约 $887 million，尽管它在 Arkansas 运营 DLE 示范厂，这一运营里程碑已比 EnergyX 更先进。Lithium Americas 市值为
              $1.68 billion，其 Nevada 锂项目已完全获批，项目开发进度明显更靠前。EnergyX 的 $3.26 billion 隐含估值分别是 Standard Lithium 的
              3.7×、Lithium Americas 的 1.9×；后两者都有独立审计财务、交易所上市和机构股东。商业化锂生产商 Albemarle（市值 $20.7 billion、收入 $1.43
              billion、P/Rev 14.5×）和 SQM（市值 $23.6 billion、收入 $1.32 billion、P/Rev 17.9×）显示，如果按 SQM 同等倍数支撑 $3.26
              billion，EnergyX 需要实现约 $225 million 收入——而当前收入只有 $1.1 million。私人 DLE 同业包括 Lilac Solutions；该公司截至 2023 年
              Series B 累计融资约 $145 million，仍为私人公司且未披露估值；另有 International Battery Metals（IBAT），已上市但披露收入很少。S&P Global
              Commodity Insights 在 2023 指出，当时还没有任何 DLE 公司达到商业生产规模。相对于同业组，EnergyX 最可辩护的估值锚点是 $800 million–$1.5 billion
              区间，反映带技术选择权溢价的项目开发商倍数，而不是管理层设定发行价隐含的 $3.26 billion。
