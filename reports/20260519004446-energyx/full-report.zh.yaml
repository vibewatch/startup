      - number: '8.3'
        title: 情景分析与敏感性
        blocks:
          - type: paragraph
            body: >-
              EnergyX 的不确定性估值必须拆成清晰情景，因为公司基本价值取决于三项大体未证实的变量：商业规模 DLE 部署、技术许可采用，以及取得项目级资本。在乐观情景中，EnergyX 到 mid-2027 成功把
              Project Black Giant 跑成商业化试点，以机构条款完成 $75–150 million 的 Series C，拿下 2+ 个主要许可交易，并在 2028–2029 达到 $80–120
              million ARR。对一家高增长、IP 受保护且受强市场顺风支撑的技术公司，25–35× 收入倍数较合适；该情景可支撑 $2–4 billion 估值，大体吻合当前 $3.26 billion
              隐含估值。在基准情景中，EnergyX 到 end-2026 完成 $50–100 million 的 Series C，完成 Black Giant 试点，但许可收入增长缓慢（2027 前低于 $20
              million），商业规模路径延至 2028。按项目开发商倍数，对 2029 年预计收入 $50–80 million 施加 6–12×，可支撑 $600 million–$960 million
              估值；若加上技术选择权溢价，可升至 $1–1.5 billion。悲观情景中，EnergyX 无法完成 Series C，再做一轮 Reg A
              过桥，项目融资延后，锂价继续低迷。没有商业收入时，公司可能相对当前隐含估值折价 50–70%，对应 $400–650 million——与未能进入商业生产的早期 DLE 开发商一致。到商业生产前，总资本需求估计为
              $600–900 million（基准至乐观），EXIM Bank LOI、Goldman Sachs 顾问和 Worley PFS 提供了可信但未确认的路径。Benchmark Minerals
              数据显示，锂价仍较 2022 峰值处于周期低位，给项目经济性带来时点风险。IEA 数据支持长期结构性需求，但短期价格疲弱是重要敏感性驱动因素。
