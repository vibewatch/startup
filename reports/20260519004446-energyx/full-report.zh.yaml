          - type: callout
            title: DLE 三角争议
            body: >-
              ExSorbtion 对 DLE 行业的公开批评——多数技术无法同时满足吸附剂寿命长（>500 cycles）、吸附快（<5 min）和高选择性三项要求——是一个对抗性数据点。如果成立，它会挑战包括
              EnergyX 在内所有商业化前 DLE 玩家关于商业可行性的主张。该主张仍未经过独立测试验证，但凸显了系统性风险：没有任何 DLE 技术已经在完整商业规模上得到证明。
            calloutType: insight
