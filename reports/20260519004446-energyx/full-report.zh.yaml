  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 技术与执行风险
        blocks:
          - type: paragraph
            body: >-
              EnergyX 的核心执行风险，是技术上看似可行的 DLE 平台与可重复的商业规模证明之间仍有距离。公司自己的风险因素称，该技术尚未完成规模化展示；H1 2025
              文件仍称公司没有商业运营，也没有来自许可或产品销售的重大收入。这个组合很重要：EnergyX 正同时试图证明 GET-Lit 的多个技术环节，把 Chile 和美国 两地从试点推进到示范，并整合新收购的
              Arkansas 资源地位。公司确实比幻灯片概念更有实质：文件和当前营销材料描述了活跃试点或示范资产、带品牌的流程组件，以及 Black Giant 和 Lonestar
              的激进产量目标。但这仍留下重大放大风险：回收率、运行时间、杂质处理、工程交接能否成立，以及试点数据能否经受完全融资项目建设的过渡。
