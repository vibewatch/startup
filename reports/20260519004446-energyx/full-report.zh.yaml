      - number: '1.5'
        title: 资源项目、财务数据与关键风险
        blocks:
          - type: paragraph
            body: >-
              EnergyX 的四个主要资源和商业项目覆盖美洲。公司旗舰锂卤水项目 Project Black Giant 位于 Chile 的 Salar de Punta Negra（约 100,000 gross
              acres），目标是分两阶段实现每年 52,500 tonnes 碳酸锂当量。Worley 在 April 9, 2025 完成的 Preliminary Feasibility
              Study，在高层面确认了项目经济可行性。Project Lonestar 位于 East Texas 的 Smackover geothermal brine formation（约 12,500
              acres），按 mid-2025 半年报，DOE 资助的 $5 million 示范工厂已投入运行，目标 50,000 tpa。EnergyX 在 October 1, 2025 通过 $26 million
              收购 Pantera Lithium 和 Daytona Lithium，取得 Smackover Arkansas 锂矿权面积（约 35,000 gross acres）。第四个项目“America's
              Lithium Future”与 Compass Minerals 合作，目标是在 Great Salt Lake 回收锂，最高 30,000 tpa。四个项目合计在完全商业化生产时指向超过 150,000
              tonnes 的潜在年产量，但所有项目仍处商业化前阶段。EnergyX 的 FY2025 财务结果——$1.1 million 收入、$20.9 million 净亏损、$73.3 million
              累计净亏损——以及审计师持续经营疑虑段落，都说明公司距离有意义规模的商业锂生产仍有数年。USGS 报告称，2024 年全球电池级碳酸锂均价约为 $14,000 per metric ton，较 2023 年下降
              66%，给新项目经济性带来潜在逆风。
