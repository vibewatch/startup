              年发行说明书中把“与关键客户部署试点工厂”列为计划支出驱动因素。这一表述暗示公司正与多名客户积极谈判，但未披露名称、时间表或财务承诺。EnergyX 的 $5 million DOE
              赠款从联邦政府角度验证了技术，但它不是客户关系，也不能降低商业采用风险。US EXIM Bank LOI 同样代表项目融资支持，而非客户需求。

