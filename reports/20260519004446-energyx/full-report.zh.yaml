            body: >-
              Energy Exploration Technologies, Inc. 对外以 EnergyX 运营，December 18, 2018 在 Puerto Rico 注册，归类为 SIC code
              2810（工业无机化学品）。公司主要运营地点在 Austin, Texas，邮寄地址为 2535 Ridgepoint Drive #100, Austin TX 78754，注册公司地址在 San Juan,
              Puerto Rico。在 CIK 0001830166 下，SEC 将 EnergyX 归类为 Securities Act 下 Regulation A
              的“新兴成长公司”。公司称使命是开发并商业化直接锂提取技术，同时推进 Chile、Texas、Arkansas 的富锂卤水资源项目，以及 Utah 的合作项目，以解决全球锂短缺。EnergyX
              官网披露“110+”名员工和“140+”项专利，但 April 2026 向 SEC 提交的 FY2025 年报显示，截至提交日公司有 61 名全职员工和 7 名兼职员工；差异可能来自未纳入 1-K
              员工数的承包商和顾问。截至 April 2026 发行说明书，EnergyX 在持续进行的 Regulation A 发行中以 $13.00/share 发售股份，投资者门户报告所有活动合计融资约 $177.9
              million、投资者超过 49,000 名。
