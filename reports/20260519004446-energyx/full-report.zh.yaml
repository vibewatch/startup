      - number: '5.4'
        title: 部署、路线图与运营设施
        blocks:
          - type: paragraph
            body: >-
              EnergyX 目前运营两个活跃试点工厂地点：Austin, Texas 实验室和试点设施（Headway 场址，约 22,150 sq ft，含约 1 英亩户外空间），以及 Chile Antofagasta
              Testbed 设施（扩建至 5,500 m²，并配有仓库）。两地都在开发示范规模工厂，用于把试点（实验室 / 小型系统）推进到商业化（完整设施）规模。公司与 Texas Texarkana 的
              TexAmericas Center 签署土地协议，作为其所称美国第一座商业规模 DLE 锂生产设施的场址。2024 年 7 月，公司为 Chile 的 Project Black Giant 与 U.S.
              Export-Import Bank 签署 $690 million 项目融资 LOI，并由 Goldman Sachs 提供顾问服务。2025 年 3 月，EnergyX 为 Texas 和 Chile
              运营使用的两套试点规模系统单元签订租赁安排。公司的商业路线图瞄准 Project Black Giant（Chile，Phase I+II 52,500 tpa）和 Project
              Lonestar（Texas/Arkansas，50,000 tpa），两个项目都已完成 PFS 级工程。此外，EnergyX 于 2025 年 10 月以 $26M 收购 Daytona Lithium
              Pty. Ltd.（Pantera Lithium 衍生公司），取得 Arkansas Smackover 卤水锂资源约 35,000
              总英亩。示范工厂完工和确定性可行性研究（DFS）是商业融资前提——两者都未披露为已完成。SoLiS™ 电池项目据称已生产纽扣电池和软包电池，并瞄准试点规模锂金属生产，但未公开披露时间表或技术规格。NUKE-it™
              平台只出现在营销材料和导航菜单中。
