  - id: FE001
    title: EnergyX 技术栈：GET-Lit™ 平台层级
    type: stack
    layout: standard
    summary: EnergyX GET-Lit™ 产品平台从原始卤水输入到最终产出的分层视图。
    data:
      layers:
        - label: 终端市场
          modules:
            - EV 电池供应链（LiOH / Li₂CO₃ 包销）
            - 国防 / 核（NUKE-it™）
            - 储能（SoLiS™ 锂金属电池）
        - label: 产品 / 产出
          modules:
            - 电池级碳酸锂（Li₂CO₃）
            - 电池级氢氧化锂（LiOH）
            - 磷酸二氢锂
            - 锂金属（SoLiS™——商业化前）
        - label: 下游处理
          modules:
            - 结晶 / 沉淀（LiCl → LiOH 或 Li₂CO₃）
            - 锂精炼模块（推断；未单独描述）
        - label: GET-Lit™ 核心平台
          modules:
            - 混合基质膜（MX）电渗析——主要 Li 分离
            - 溶剂萃取（SX）——浓缩与反萃
            - 离子吸附（AX）——抛光至电池级纯度
        - label: 基础设施
          modules:
            - 卷对卷膜制造设备（自有）
            - 模块集群机架 → 电渗析单元 → 工厂
            - 试点工厂：Austin TX（Headway）+ Antofagasta Chile（Testbed）
        - label: 进料 / 输入
          modules:
            - 高盐卤水（盐滩——Salar de Punta Negra、Smackover 地层）
            - 地热卤水（DOE 拨款申请）
    approximationNotes: 下游处理（结晶 / 精炼）步骤根据 DLE 行业惯例推断；EnergyX 没有在公开技术材料中单独描述该步骤。
    claimRefs:
      - CE001
      - CE002
      - CE006
      - CE007
  - id: FE002
    title: 卤水到电池级锂工艺流程
    type: flow
    layout: standard
    summary: 从原始卤水进料，经 GET-Lit™ 子模块，到电池级锂产出的顺序流程。
    data:
      nodes:
        - id: brine-intake
          label: 卤水进料与预过滤
          note: 去除固体；调节 pH / 温度
        - id: mmm-ed
          label: MMM 电渗析（MX 模块）
          note: 输运 Li⁺；截留 Na⁺、Mg²⁺、Ca²⁺；连续工艺；可处理高盐度
        - id: sx-circuit
          label: 溶剂萃取（SX 回路）
          note: Li 进入浓缩有机相；反萃为 LiCl
        - id: ax-polish
          label: 离子吸附 / 抛光（AX）
          note: 最终去除杂质；提升至电池级纯度
        - id: conversion
          label: 产品转化（结晶）
          note: LiCl → LiOH·H₂O 或 Li₂CO₃（步骤为推断；未单独描述）
        - id: output
          label: 电池级锂产品
          note: 声称约 96% Li 回收率（试点）；纯度等级未公开披露
      edges:
        - from: brine-intake
          to: mmm-ed
          label: 调理后卤水
        - from: mmm-ed
          to: sx-circuit
          label: 富 Li 电渗析产出
        - from: sx-circuit
          to: ax-polish
          label: 浓缩 LiCl 流
        - from: ax-polish
          to: conversion
          label: 高纯 LiCl 溶液
        - from: conversion
          to: output
          label: 成品
    approximationNotes: 产品转化步骤（LiCl → LiOH/Li₂CO₃）根据行业标准推断；EnergyX 未在公开技术文件中单独描述。
