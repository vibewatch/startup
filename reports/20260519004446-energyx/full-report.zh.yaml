      - number: '6.4'
        title: 销售模式与渠道结构
        blocks:
          - type: paragraph
            body: >-
              EnergyX 完全依赖直销关系；截至 2026 年发行说明书，公司未披露任何渠道合作伙伴、系统集成商或经销商。全球工程公司 Worley 受聘为 Project Black Giant 执行预可行性研究，并作为
              EPC（工程、采购和施工）伙伴。Worley 在大型矿业和能源运营商中的网络，可能成为通向潜在许可客户的关系桥，但这只是推测，并非正式渠道安排。

              US EXIM Bank 提供 $690 million 项目融资的 LOI 对 EnergyX 自身资本需求很重要，但它是 EnergyX 生产设施的项目融资，不是客户需求信号。Texarkana 的
              TexAmericas Center 设施正被定位为概念验证生产工厂，目的是在潜在许可客户承诺商业规模部署前验证 DLE
              技术。三层收入模型（包销、许可、耗材）提供商业选择权，但也带来组织复杂度：每种模型都需要不同销售动作、客户画像和关系结构。商业规模上，还没有任何一个模型被付费客户验证。
