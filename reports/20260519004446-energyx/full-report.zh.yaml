      - number: '4.3'
        title: 资产负债表、烧钱速度与现金跑道
        blocks:
          - type: paragraph
            body: >-
              FY2025 资产负债表显示流动性急剧恶化：现金及现金等价物从 2024-12-31 的 $36.0 million 降至 2025-12-31 的 $8.6 million，净减少约 $27.4
              million。经营、资本开支（Texas 和 Chile 的试点及示范工厂）以及 Pantera 收购 $3.7 million 首期现金付款带来的总现金流出超过 $46 million，2025 年新增
              Reg A 融资 $19 million 只抵消了一部分。营运资本仍小幅为正（流动资产 $9.9 million，流动负债 $5.5 million），但相对每年约 $20-21 million
              经营亏损的烧钱速度很薄。管理层在 FY2025 1-K 中明确披露，“公司有足够现金资源支持运营计划至 2026 年 Q2 结束”——下一道融资悬崖大约落在 2026 年 5-6
              月，正好贴近本报告提交日期。负债总额 $10.5 million，主要是租赁义务（经营租赁 $3.6 million、融资租赁 $0.6 million）和 Pantera 递延购买对价（短期、长期合计
              $2.46 million）；公司没有计息银行贷款、债券或循环信贷。公司还为 Ridgepoint Drive 租约保留一张 $500,000 不可撤销备用信用证，尚未提款。总资产 $96.1 million
              被无形资产（$42.2 million，主要是 Pantera 矿权收购）和不动产 / 厂房 / 设备（$35.8 million）撑高，现金只占总资产 8.9%。折旧费用从 FY2024 的 $0.66
              million 跳升至 FY2025 的 $3.17 million，反映示范工厂和实验室资本设备投运。薪酬与咨询支出两年都约为 $11.4 million，说明由人员驱动的烧钱速度没有实质变化。
