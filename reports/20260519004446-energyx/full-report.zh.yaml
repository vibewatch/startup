  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与收入质量
        blocks:
          - type: paragraph
            body: >-
              EnergyX FY2025 年收入为 $1.1 million，由两条规模很小、尚未商业化的收入流构成：约 $243,675 来自卤水测试服务（按与潜在商业伙伴签订的短期合同分析），其余约 $857,000
              来自膜设备销售，主要是卖给第三方测试方和早期采用者的 EnergyX GET-Lit™ DLE 膜系统。两条收入流都不是商业规模的经常性收入；公司自己的 1-K 文件把 EnergyX
              定义为“商业化前收入、开发阶段的能源技术公司”，并称公司“尚未通过技术许可产生任何收入”。 FY2024 只有零星测试收入，没有任何具备实质规模的设备产品收入；FY2023
              同样没有商业收入。公司的前瞻收入模型有三条腿： （1）Technology-as-a-Service（“TaaS”）膜更换模式，客户按 2-3 年更换周期购买耗材膜和萃取剂； （2）Project Black
              Giant（Chile）、Project Lonestar（East Texas/Arkansas）和 Compass Minerals Great Salt Lake 合作达到商业规模后，上游锂生产贡献收入；
              （3）向大型生产商收取设备许可费。TechCrunch 采访援引 CEO 的说法，向大型生产商发放设备许可涉及“数亿甚至十亿美元级最终投资决策”，销售周期很长。现有收入流的毛利率没有公开披露； FY2025 和
              FY2024 的 1-K 都没有单列商品销售成本或毛利，因此公开资料无法做毛利率分析。公司也未披露已签约远期收入、客户集中度或在手订单。 Netcapital 2021 年 Reg CF 文件曾指出，采用
              EnergyX 技术的生产商预计 IRR 为 30-40%，并估算公司在一座 15,000-tpa 商业设施中可获得的部分约为 $15 million——但该数字早于公司扩产战略，只能作为粗略且过时的代理指标。
