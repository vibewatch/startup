  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、定义与相邻领域
        blocks:
          - type: paragraph
            body: >-
              EnergyX 的可服务市场有多层，先界定边界，规模测算才有意义。最宽口径下，EnergyX 参与全球锂供应链，这个市场几乎完全由可充电电池行业驱动。根据 USGS Mineral Commodity
              Summaries 2026，电池占全球锂最终用途的 88%，陶瓷和玻璃占 4%，润滑脂占 2%，其余用途占剩余部分。在锂供应内部，EnergyX 的主要运营板块是卤水锂，而非硬岩锂辉石开采（后者在
              Australia、Canada 和 Zimbabwe 占主导）。EnergyX 自身 SEC 文件估计，Lithium
              Triangle——Chile、Argentina、Bolivia——拥有全球已知锂矿床超过 50%，因此是核心卤水地理区域。EnergyX 在 April 2026 提交的 SEC 1-K
              年报明确把公司技术定位为一种处理机制，用于盐沼和地层水中的富锂卤水。由此延伸出三种收入模式：(1) 向卤水运营生产商销售 DLE 技术授权和设备，用 GET-Lit/LiTAS
              膜技术改造存量项目或新建项目；(2) 从 EnergyX 运营的生产资产（如 Project Black Giant（Chile）和 Project Lonestar（Texas））获得锂化学品承购收入；(3)
              未来电池材料或锂金属销售。被排除的支出也很大：硬岩开采、电池电芯制造、大规模电池回收，以及没有 DLE 改造的太阳能蒸发池，都不是 EnergyX 现有技术栈可触达的市场。DLE
              的现状替代方案是传统太阳能蒸发池；行业共识给出的锂回收率为 30-40%，蒸发时间为 18-24 months。相邻市场包括公用事业级电池储能（BESS）、电池回收 / 黑粉处理，以及 EnergyX
              声称有研究兴趣的下一代锂金属电池。多层框架对尽调很关键：EnergyX 投资者材料里的市场规模主张混合了全球锂需求预测（自上而下 TAM）、DLE
              可触达卤水市场（SAM）和自身项目产量目标（SOM）——三者不能混为一谈。
