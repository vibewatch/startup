      - number: '5.3'
        title: 性能主张、证据质量与可靠性缺口
        blocks:
          - type: paragraph
            body: >-
              EnergyX 最常被引用的性能基准包括：约 96% 锂回收率（Chile 和 Texas 试点规模）、1–2 天处理周期而非蒸发池的 12–18 个月、每吨锂淡水消耗约 800 加仑而非传统蒸发池约
              18,000 加仑，以及声称成本约 $2,500/ton、低于蒸发池运营的约 $4,200/ton。公司称电力需求低于 $100/ton。这些数字出现在 EnergyX 投资者材料和技术网页中，约 96%
              的回收率也作为试点工厂结果出现在 2026 年 Regulation A 发行说明书中。全球 EPC 公司 Worley 于 2025-04-09 完成的预可行性研究（PFS）确认，资本开支估算把 Project
              Black Giant 放在全球成本曲线较低端，并纳入支持预期商业可扩展性的试点规模结果；同时，PFS 明确提醒，小规模试点测试结果未必能在商业规模复现。PFS 还使用了 Inferred
              矿产资源类别（确定性低于 Indicated/Measured），在技术放大不确定性之上又增加地质不确定性。公开文件仍缺少支持的关键尽调项目包括：最终电池级纯度规格（% LiOH 或 Li₂CO₃
              品位）、有记录的膜更换节奏和成本、商业规模全生命周期环境表现，以及经独立佐证的运行时间或系统可靠性数据。技术网页上的比较（相对纳滤、反渗透、离子吸附和离子交换）由 EnergyX
              自行撰写，缺少商业规模独立第三方验证。DOE 向 EnergyX 授予 $5 million 赠款，用于从地热卤水中提取锂——这构成政府层面对技术路径的认可——但尚未发现已发布的 DOE 性能评估。
