        title: 图表
        blocks:
          - type: callout
            title: 商业执行缺口：EnergyX 在关键里程碑上落后同业
            body: >-
              截至 May 2026，EnergyX 未披露有约束力的承购协议、FEL-3 或 FEED 工程完成、同业规模的连续多年试点数据集，或可与 Lilac Solutions（FEL-3 已完成，目标 2027
              年生产）和 Standard Lithium（6-year demo，FID 目标 2026）相比的监管许可批准。这种落后不能确认技术劣势，但在 Lilac
              接近建设就绪时，它提出了关于商业化时间线和竞争位置的实质问题。
            calloutType: risk
