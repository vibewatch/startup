            body: >-
              EnergyX 承受的风险不只是长期锂需求会不会增长，更在于 Black Giant 或 Lonestar
              需要融资和客户承诺的那个时点，锂价是否仍有吸引力。公司自己的风险因素已经承认，锂价波动、需求变化和替代技术都可能削弱项目可行性。第三方数据让这条警告更紧迫：USGS 称 2025
              产量大幅跳升，供应过剩担忧压低价格；Benchmark 仍显示碳酸锂和氢氧化锂价格波动，而不是清晰复苏。商业风险又放大了大宗商品问题。H1 2025 文件仍没有显示实质性许可或产品收入，也就是说，EnergyX
              尚缺少公开、广泛的证据，证明战略投资者关系能在债务承销所需的项目时间表内转化为付费客户。TechCrunch 将客户决策描述为数亿美元或十亿美元级最终投资决策，凸显试点兴趣要变成可融资收入有多慢。
