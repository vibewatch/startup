      - number: '5.6'
        title: 技术尽调缺口与失败模式
        blocks:
          - type: paragraph
            body: >-
              核心技术风险在于，试点工厂结果与商业规模表现之间仍有缺口。EnergyX
              在风险因素中明确承认，“不能保证小规模实验室测试、试点工厂或示范工厂取得的结果会在更大规模商业运营中复现”。关键放大步骤包括确认关键化学组分稳定性、确定膜的预期使用寿命，以及在不同卤水化学组成下稳定达到纯度规格。公司尚未展示以商业吞吐量连续运行完整“卤水到电池级锂”链条。energyx.com
              上的技术比较表由公司自行撰写，没有独立验证。关键未支撑主张包括：（1）约 $2,500/ton 运营成本目标——来自 PFS，而非商业运营；（2）锂产品纯度规格（LiOH、Li₂CO₃
              品位）——未公开披露；（3）膜更换节奏——未披露；（4）SoLiS™ 从纽扣 / 软包电池走向试点锂金属生产的时间表和技术里程碑。其他失败模式包括：规模化后的卤水化学差异（竞争性 DLE
              项目已遇到放大挑战）；Chile 国家风险（水权、监管审批）；高盐度下膜随时间结垢；溶剂萃取试剂成本和环境处理；以及来自资金雄厚的在位者（Exxon、SLB、Standard Lithium、Lilac
              Solutions）的竞争，这些公司也在推进 DLE。DOE 赠款认可地热卤水应用，但不验证商业性能。NUKE-it™ 技术仍处萌芽期，公开技术披露不足以支撑尽调。总体技术成熟度（TRL）似乎约为
              5–6（在相关环境中完成试点展示），商业成熟度（TRL 9）则需要示范工厂成功完工和正向 DFS。
