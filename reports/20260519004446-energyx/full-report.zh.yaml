      - number: '6.2'
        title: 商业进展与收入证据
        blocks:
          - type: paragraph
            body: >-
              EnergyX 历史上唯一收入流，是客户卤水测试费和 2025 年 2 月的一笔设备订单。Customer Testing Income 最早在 2023 年 Q2 作为单独科目追踪，H1 2023 确认
              $34,750。H1 2024 增至 $245,000，跳升 605%，暗示管线活动加速；但 H1 2025 又急跌至 $39,000，同比下降
              84%。管理层未公开解释收缩原因；这可能反映组合自然从小测试合同转向更大的设备交易，但同样也可能说明卤水所有者兴趣降温。

              2025 年 2 月 $1.3 million 销售订单覆盖一套面向未具名客户的定制双极电渗析示范系统，是 EnergyX 第一份具备实质规模的产品收入合同。截至 2025-06-30，该订单仍有
              $730,748 递延收入，等待履约义务完成；截至 2025-12-31，FY2025 全年客户预付款合计 $770,748，另有 $386,379
              未开票收入，代表已完成但尚未开票的工作。公司尚未宣布第二笔设备订单。公司在 H1 2025 半年度文件中明确确认，截至 2025-06-30，其没有商业运营，也没有从许可或产品销售中产生重大收入。
