        - Black Giant 卤水化学组成与试点测试卤水存在差异
      - - 一次分离
        - 混合基质膜（MMM）电渗析模块
        - 富集 Li⁺；排斥 Na⁺、Mg²⁺、Ca²⁺
        - 膜选择性比；供电稳定性
        - 商业规模下的膜污染、衰减和更换频率
      - - 二次浓缩
