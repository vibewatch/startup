      - number: '2.2'
        title: 市场规模测算——多重视角与互相冲突的估计
        blocks:
          - type: paragraph
            body: >-
              没有单一权威数字能概括 EnergyX
              的可服务市场，因为这些市场横跨技术授权、锂化学品和卤水项目开发，每一类都有不同的测算方法。本节记录多重视角，并刻意保留矛盾，而不是压成一个数字。最宽的自上而下口径，是按美元计的全球锂市场。Grand View
              Research 估计，全球锂市场 2025 年为 $32.38 billion，到 2033 年将达到 $96.45 billion，CAGR 为 14.5%。Mordor Intelligence
              用销量口径给出不同测算：2025 年 1.54 million LCE tons，到 2031 年增至 4.43 million LCE tons，CAGR 为 19.24%。Global X LIT ETF
              引用的销量预测更窄：2025 年需求为 1.6 million metric tonnes LCE，到 2030 年升至 3.6 million metric tonnes。三组估计无法完全对齐：Mordor 到
              2031 年的 4.43M LCE tons，隐含需求显著高于 Global X 到 2030 年的 3.6M，差距约 23%。用当前低迷现货价格（~$9,000-$10,000/ton）折算 Mordor 的
              2031 年销量，隐含市场价值约 $40-44 billion，远低于 Grand View 的 $96.45 billion；差异来自价格情景假设。这些矛盾尚未解决，并会实质影响 EnergyX
              收入潜力建模。下游需求信号更一致：Grand View Research 将 2024 年全球 EV 电池市场测算为 $61.31 billion，到 2030 年增至 $198.86 billion，CAGR
              为 22.2%，其中锂离子电池占 67.4%。DLE 专项规模方面，没有独立市场研究报告给出经过同行评审的 DLE 技术授权市场独立估计。Mordor Intelligence 将 DLE
              试点突破识别为其整体锂市场预测的 +2.9% CAGR 提升因素。氢氧化锂子市场——最贴近高端 EV 所用高镍 NMC 正极需求的电池级化学品——Mordor Intelligence 测算 2025 年为
              229.30 LCE kilotons，到 2031 年增至 787.92 kilotons，CAGR 为 22.85%。电池级材料占该细分市场 69.30%。USGS 确认 2025 年全球消费量达到
              263,000 tons（所有形态），较 2024 年增长 20%。美国电池级 LiCO3 年均价在 2025 年降至 $9,000/ton，较 2024 年 $11,800/ton 下降
              31%。Benchmark Mineral Intelligence 最新指数数据中 Lithium Carbonate Index 约为 451，Lithium Hydroxide Index 约为
              350，显示较 2024 年低点已有部分修复。
