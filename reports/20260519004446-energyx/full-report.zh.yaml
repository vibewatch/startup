      - number: '1.4'
        title: 融资形成、投资者结构与众筹策略
        blocks:
          - type: paragraph
            body: >-
              根据 April 2026 向 SEC 提交的 FY2025 年报，截至 December 31, 2025，EnergyX 累计融资约 $151
              million。公司投资者门户（invest.energyx.com）截至 mid-2026 报告融资约 $177.9 million，反映 $13/share Regulation A
              发行仍在继续。融资构成并不常见：EnergyX 最大的机构轮是 December 2022 由 GM Ventures 领投的 $15 million Series B，之后又吸引 POSCO 的 IMM
              Battery Fund III（$8 million，June 2023）和 Eni 通过 Eni Next 参投。然而，公司超过 $80 million 资本来自由 DealMaker Securities
              运营的 Regulation A 发行中的零售投资者，使 EnergyX 成为清洁技术史上最大的众筹融资方之一。KingsCrowd 对 EnergyX December 2024 Regulation CF
              轮的分析发布了约 $1.145 billion 的投前估值；公司投资者门户写着“Valued at Over $1 Billion”，但任何机构轮的投后估值都未公开披露。GEM Global Yield
              的有约束力承诺可在未来公开市场上市后提供最高 $450 million PIPE 融资。TechCrunch 2024 文章指出，Teague Egan 在完全摊薄基础上持有约 47% 股份，CEO
              在“考虑”SPAC 路径和传统 Series C 两种选择，并把众筹策略描述为刻意选择：建立零售投资者社区、避免完全按风投方式稀释，同时保留创始人控制权。
