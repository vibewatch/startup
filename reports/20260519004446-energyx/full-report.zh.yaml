        title: 客户集中度与留存风险
        blocks:
          - type: paragraph
            body: >-
              截至 2025 年中，EnergyX 客户基础由数量未披露的匿名卤水测试客户，加一名未具名设备订单客户组成。设备买方贡献 EnergyX 产品收入的
              100%，造成极端客户集中。卤水测试合同是离散且非经常性的；它们不产生订阅、保留费或续约收入，每份合同都必须单独获取并签下。

              以 EnergyX 当前阶段，净收入留存无法计算，也没有实质意义——公司没有具备已知续约历史的经常性客户。测试收入从 H1 2024 到 H1 2025 同比下降
              84%，是早期警示信号。销售周期长是公认挑战；TechCrunch 在 2024 年 10 月公司报道中明确提到，基础设施规模采矿技术合同通常需要 2–5 年才能签下。GM 和 POSCO
              的战略投资者关系虽有验证价值，但如果这些伙伴内部 DLE 项目与 EnergyX 许可业务竞争，也会带来潜在利益冲突。International Battery Metal Ltd（IBAT）和其他 DLE
              竞争者也在积极争夺同一批 Lithium Triangle 客户，加剧早期商业合同竞争。
