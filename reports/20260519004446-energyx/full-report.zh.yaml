      - number: '7.6'
        title: 风险联动与情景分析
        blocks:
          - type: paragraph
            body: >-
              EnergyX 的风险高度耦合。锂价疲弱会让项目债务更难落地，进而提高对稀释性股权的依赖，也会放大创始人控制和披露敏感性。许可延误会拉长时间表，使本已受十亿美元级最终投资决策拖慢的客户沟通更难转化。若 EXIM
              LOI 不能变成可承销融资，不只是 Black Giant 出现资金缺口；客户信心会受损，工程排期会更难，Arkansas 或其他 DLE
              盆地的同业也更可能率先锁定承购或示范可信度。反过来，若示范证据、许可、工程和融资在同一个大宗商品窗口里顺利叠上，乐观路径仍然存在。下面的传导图说明，承销 EnergyX
