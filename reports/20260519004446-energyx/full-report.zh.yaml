          - type: callout
            title: EnergyX 的技术验证建立在合作信号假设上
            body: 在缺少已发布试点表现数据的情况下，EnergyX 与 GM、Samsung SDI 的合作被视作技术验证代理。本分析假设这些合作包含一定程度的技术尽调，但无法从公开披露中确认关系的深度或排他性。
