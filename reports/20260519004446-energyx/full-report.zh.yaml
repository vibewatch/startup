      - number: '3.2'
        title: 存量生产商与相邻替代方案
        blocks:
          - type: paragraph
            body: >
              DLE 的主导锂供应替代方案是太阳能蒸发卤水提取和硬岩（锂辉石）开采，两者都已在商业规模验证。SQM（Sociedad Química y Minera de Chile）用大规模太阳能蒸发池在 Atacama
              Desert 运营全球最具成本竞争力的锂生产，卤水品位超过 1,500 mg/L lithium——约为 Lilac 在 Great Salt Lake 目标品位的 20x。SQM
              的多年生产周期和既有基础设施，构成很高的固定资产替代壁垒。全球最大锂生产商 Albemarle 在 US、Chile 和 Australia 运营卤水和硬岩提取。USGS 2026 Mineral
              Commodity Summaries 确认，太阳能蒸发和锂辉石开采是全球主导供应路线。MarketsandMarkets 的市场情报将 SQM、Livent（Arcadium）、Albemarle、Tianqi
              和 Ganfeng 识别为锂化合物存量龙头，它们控制大量全球产能，并拥有成熟承购关系。


              两家石油巨头已经进入 DLE 领域，但更像潜在相邻玩家，而非纯存量生产商。ExxonMobil 在 2023 年宣布 Arkansas DLE pilot test facility，目标 Smackover
              Formation——与 Standard Lithium 已开发六年的同一地层——并公开表示要到 2030 年成为美国最大锂生产商。ExxonMobil 和 Standard Lithium 同时押注
              Smackover，造成地理资源竞争；如果 EnergyX 目标也是 Arkansas 卤水，这可能影响新 DLE 进入者取得卤水租约。Rio Tinto 通过收购 Rincon Mining 的
              Argentina salar project 进入锂市场，在另一地理区域提供存量规模。


              Lithium Americas 是硬岩替代方案，正在 Nevada 开发 Thacker Pass
              项目，作为美国本土硬岩锂来源。与同等品位的卤水提取相比，硬岩开采能源成本更高，但它受益于已知资本成本结构和成熟许可路径。IEA 的 Global Critical Minerals Outlook 将 DLE
              识别为释放蒸发岩矿床以外更多卤水资源的关键赋能技术，意味着 DLE 和蒸发路线会共存，而不是由 DLE 完全取代存量路线。
