      - number: '7.7'
        title: 缓释措施、否决标准与尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              正确姿态不是自动否定 EnergyX，而是把下一阶段尽调改成里程碑驱动。现有最好的缓释因素包括：公司已筹集有意义的资金，吸引了可识别的战略投资者，拼出足够的技术和项目叙事以获得政策关注，并接入
              Worley、TexAmericas 和 EXIM
              路径等外部基础设施。这些缓释因素真实存在，但都有条件。它们都不能替代关于许可状态、融资条件、放大表现或董事会层面风险控制的硬证据。最清晰的否决标准可以量化：如果商业规模表现证明没有改善，如果下一轮重大资本周期后仍没有确定性项目融资，如果许可进展无法用文件证明，或创始人控制和披露问题恶化，风险调整后的投资逻辑会迅速走弱。因此，下列未决尽调阻断点不是小修小补；它们是判断这个故事能否融资，而不只是叙事动听的证据请求。
