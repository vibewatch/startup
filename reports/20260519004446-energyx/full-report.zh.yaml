      - number: '3.5'
        title: 市场结构、胜负因素与证据缺口
        blocks:
          - type: paragraph
            body: >
              2026 年 DLE 市场分散且尚未产生商业规模收入，五家或更多可信技术开发商，加上石油巨头进入者，都在争夺有限的近期卤水项目机会。没有任何商业 DLE 生产，意味着竞争当前取胜或失败取决于：(1)
              试点数据质量和示范时长，(2) 承购与合作伙伴可信度，(3) 工程完成里程碑（FEED、FEL-3），(4) 监管和环境许可进展，(5) 资本获取能力。截至 May 2026，在五个维度上，EnergyX
              公开披露位置均落后 Standard Lithium 和 Lilac Solutions。EnergyX 未披露有约束力的承购协议、FEL-3
              工程完成、连续多年试点数据集，或可与两家领先同业相比的环境许可批准。这个缺口并不能证明底层技术失败——它可能反映 EnergyX 开发时间线更早，或刻意安排项目顺序——但它是竞争尽调中的实质未解问题。


              EnergyX 的取胜条件：拿下战略性卤水项目合作（类似 Standard Lithium 与 Equinor 绑定，或 Lilac 与 Traxys 的关系），展示达到或超过同业基准的多年连续试点表现，并把
              OEM 关系转化为排他或有量承诺的供应协议。失败条件：如果 Lilac 按目标在 2027 年于 Great Salt Lake 实现首次商业生产，或 Standard Lithium 在 2029 年投产
              SWA Project，EnergyX 在 North American DLE 的先发选择权会显著收窄。Smackover Formation 是美国最先进的 DLE 卤水盆地，Standard Lithium
              和 ExxonMobil 已经占位。


              完成竞争尽调仍缺的证据包括：EnergyX 的卤水试点运行小时数和循环数据；独立工程公司给出的每 tonne LCE 比较 CAPEX 和 OPEX 估计；EnergyX 专利组合广度和自由实施分析；以及确认
              EnergyX 与 GM、Samsung 的合作是否包含技术验证之外的任何量承诺或资本共同投资。
            claimRefs:
              - CP040
