  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 技术平台：GET-Lit™、SoLiS™ 与 NUKE-it™
        blocks:
          - type: paragraph
            body: >-
              EnergyX 在其一体化平台下运营三条技术线。旗舰产品是 GET-Lit™（此前以 LiTAS® – Lithium-Ion Transport and Separation
              注册商标），这是一套模块化直接锂提取（DLE）系统，设计目标是把几乎任何高盐卤水处理成电池级锂化合物。GET-Lit™
              平台整合三类核心分离子模块：（1）用于电渗析锂分离的自研混合基质膜（MX）；（2）把锂剥离进浓缩物流的溶剂萃取回路（SX）；
              （3）用于抛光并提升锂浓度的离子吸附介质（AX）。这些子模块可按顺序组合，也可按卤水化学性质选择性使用，支撑公司所谓“普适卤水适配性”的说法。第二条技术线 SoLiS™ 是早期电池和锂金属项目，借助
              GET-Lit™ 纳米技术开发从卤水直接制备锂金属的流程，目标是把能量密度较现有锂离子电池提高 2–5×。第三条新兴技术线 NUKE-it™ 面向核锂材料（用于聚变和裂变应用的锂-6/7 分离）以及铀 /
              钍分离，但该业务仍处于商业化前阶段，公开资料很少。EnergyX 的既定目标是实现从卤水到电池级产品的全链条垂直整合，同时通过向第三方卤水资源所有者许可 GET-Lit™ 形成第二收入流。
