      - number: '2.5'
        title: 规模测算与采用尽调缺口
        blocks:
          - type: paragraph
            body: >-
              几个关键规模测算和采用尽调缺口仍未解决，并直接影响 EnergyX 的估值和投资者风险评估。第一，DLE 技术授权子市场没有独立、经过同行评审的市场规模研究；现有估计都把 DLE
              嵌入更宽的锂市场预测，作为一个子驱动因素，而不是单独测算授权费市场。没有这一点，EnergyX 的技术授权 SAM 无法被独立验证。第二，分析师预测之间差距实质：Grand View Research 到
              2033 年 $96.45 billion 的市场规模，与 Mordor Intelligence 基于销量、按当前低迷价格隐含的约 $40-44 billion 相比，差不多有 2.5x
              差异。这个缺口尚未调和，并且完全取决于价格情景假设；鉴于 2022 至 2025 年观察到 $81,500/ton 到 $9,000/ton 的价格崩塌，这些假设本身高度不确定。第三，EnergyX
              投资者材料引用的 $3.26 billion 投前隐含估值，完全来自 Reg A 发行股价，没有独立机构评估或可比交易分析；在 LiCO3 现货价格 $9,000/ton
              时，倒推最终项目产量的收入倍数，对价格修复假设极其敏感。第四，DLE 的商业部署状态尚未在规模上验证：EnergyX 声称真实世界试点回收率为 98%，但没有第三方独立审计公开验证试点吞吐、正常运行时间或
              cost per ton。Albemarle 承认 DLE 仍处商业化前阶段，也确认全行业尚未去风险。第五，油田卤水和地热卤水买方群体的采用触发时间线不清晰：尽管 Exxon 已收购 Smackover
              卤水权，SLB 也提供地热基础设施，美国大规模卤水锂产出的商业路径和时间表仍未量化。EnergyX
              的战略投资者（GM、POSCO、Eni）提供了非公开尽调信号，部分缓释这些缺口，但从独立尽调角度看，问题仍然开放。
            claimRefs:
              - CM035
              - CM036
              - CM044
              - CM031
              - CM030
      - number: '2.6'
        title: 图表
        blocks:
          - type: callout
            title: 锂价暴跌威胁 DLE 项目经济性
            body: >-
              美国电池级碳酸锂年均价在 2025 年降至 $9,000/ton，同比下降 31%，较 2022 年高点低近 86%。在这些价格水平下，许多 DLE 项目需要大量前期 capex
              和每吨运营成本，如果不假设价格修复，经济性并不成立。这是 EnergyX 最大的单一市场驱动风险：其众筹形成的 $3.26 billion 投前估值隐含一个收入倍数，只有当价格回到
              $20,000+/ton，或技术授权费收入可观且对价格相对不敏感时，才说得通。
            calloutType: risk
            claimRefs:
              - CM030
              - CM014
              - CM044
          - type: callout
            title: DLE 没有独立市场规模——规模测算缺口带来估值风险
            body: >-
              没有独立市场研究公司发布经过同行评审的 DLE 技术授权市场独立规模。所有主要分析师报告（Mordor、Grand View、BNEF）都把 DLE 当作子驱动因素，而非独立市场。这意味着 EnergyX
              投资者无法独立验证公司 $3.26 billion 投前估值隐含的 TAM 主张。类似碳捕集技术授权市场已有研究那样，一份专门的 DLE 授权市场研究，是尽调优先项。
            calloutType: insight
            claimRefs:
              - CM035
              - CM044
          - type: callout
            title: 用 30-60% 卤水占比推导 SAM
            body: >-
              卤水可触达锂的 SAM 估计，是把 EnergyX 自己引用的数值（世界锂有 30-60% 来自卤水来源）应用到 Mordor Intelligence 2025 年 1.54 million LCE tons
              基准上，得到估计 462,000-924,000 LCE tons。这是由代理推导的计算，不是发布方报告的 SAM 数字。30-60% 占比出现在 EnergyX 的 SEC 1-K
              文件中，但该文件没有把这一数字归因于独立来源。
            calloutType: assumption
            claimRefs:
              - CM016
              - CM003
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接 DLE 技术同业
        blocks:
          - type: paragraph
            body: >
              直接 DLE 同业包括四家技术公司：Lilac Solutions、Standard Lithium、ExSorbtion 和 SLB。每家公司采用不同提取化学路线。Lilac Solutions
              使用自研离子交换（IX）技术，October 2025 发布时已迭代到第五代。Lilac 的 Great Salt Lake 设施——目标为 Phase 1 5,000 tpa、Phase 2 20,000
              tpa——在 2025 年试点运营中，从 70 mg/L 超低品位卤水中实现 87% 锂回收率；January 2026，公司与 Traxys 签下有约束力的 10-year 承购协议，总量 50,000
              tonnes。FEL-3 工程已完成，许可正在推进，目标 2027 年首产。IX 介质制造基地在 Fernley, Nevada，有助于支撑本土供应链目标。Lilac 的商业模式是授权加供应结构——出售 IX
              介质和工程服务，而不是直接开发项目。


              Standard Lithium (NYSE:SLI) 采用与 Aquatech（前 Koch Technology Solutions）合作的 DLE 卤水提取流程，并使用自研 SiFT
              分级结晶工艺生产电池级碳酸锂（>99.9% purity）。Arkansas 示范工厂已连续运行六年，处理超过 1 million barrels Smackover 卤水，并完成超过 15,000 个 DLE
              循环——这是 North American DLE 同业中最充分的公开示范记录。South West Arkansas (SWA) Project 与 Equinor 合作开发，Phase 1 目标 22,500
              tpa。Q1 2026，Standard Lithium 与 Trafigura 签下有约束力的 10-year、8,000 tpa 承购协议；公司持有 $141 million 现金且没有债务。FID
              和开工目标为 2026，首次商业生产在 2029。


              ExSorbtion（此前通过 internationalbatterymetal.com 运营，之后重定向到 exsorbtion.com）是一家早期吸附式 DLE 公司，声称吸附剂寿命 >500
              cycles、反应时间 <5-minute、锂回收率 90%——也就是它所谓的“DLE 三角”要求。公司获得 $1.8 million DOE 合同，用于加速商业化。ExSorbtion 直接批评竞争性 DLE
              技术无法同时满足三项三角标准，并指出如果循环寿命不足，吸附剂更换成本会高到难以承受。公司称其流程直接产出碳酸锂，而不是多数竞争性 DLE 路线产出的较低价值氯化锂。


              SLB（前 Schlumberger）在其地热和卤水解决方案部门下提供集成 DLE 服务，把自己定位为卤水项目开发商的潜在供应商，而非独立 DLE 开发商。其规模和油田服务基础设施，可能在 DLE
              项目需要钻井和卤水管理能力时形成优势。
