companyProfile:
  summary: >-
    Energy Exploration Technologies, Inc. (EnergyX) 是一家尚未商业化的直接锂提取技术和锂资源公司，December 2018 在 Puerto Rico 注册，运营总部在 Austin,
    Texas。公司旗舰 GET-Lit™ DLE 膜系统源自 University of Texas at Austin 的基础研究；公司称，该系统可从卤水中回收最高 90% 的锂，而传统太阳能蒸发约为 30–40%，并由 140+
    项专利支撑。截至 December 2025，EnergyX 通过 Regulation A/CF 零售众筹、GM Ventures 领投的 $15 million Series B，以及 POSCO 的 IMM Battery
    Fund 和 Eni Next 战略投资，累计融资约 $151 million。公司 FY2025 通过商业化前膜设备销售和卤水测试服务产生 $1.1 million 收入；独立审计师在 FY2024 和 FY2025
    均出具持续经营疑虑意见。Chile 的 Project Black Giant 已在 April 2025 完成 Worley 预可行性研究，并签署 EXIM Bank 最高 $690 million
    项目融资意向书，但两者仍取决于尚未达成的里程碑。
