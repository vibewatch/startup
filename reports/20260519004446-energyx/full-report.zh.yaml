      - number: '5.7'
        title: 附录
        blocks:
          - type: callout
            title: 具备学术 IP 根基的模块化 DLE 平台
            body: >-
              GET-Lit™ 把电渗析膜、溶剂萃取和离子吸附组合进一套可连续运行、适应高盐度的系统，针对竞争性 DLE 技术的关键弱点。134 项专利和申请、双大学 IP 协议（UT Austin + Oslo），以及
              40% 员工拥有 PhD，为其提供可信技术基础，也使其区别于纯项目开发商。
            calloutType: strength
            claimRefs:
              - CE028
              - CE029
              - CE001
          - type: callout
            title: 从试点到商业化放大是最大的未解风险
            body: >-
              行业内还没有任何参与者验证过商业规模 DLE 运营。EnergyX 自己的发行说明书明确警告，试点结果未必能在商业规模复现。示范工厂（TexAmericas）仍在建设、尚未完成；Black Giant 的 DFS
              尚未启动；纯度规格、膜寿命和全生命周期成本仍未披露。即便按早期 DLE 标准看，技术风险也偏高。
            calloutType: risk
            claimRefs:
              - CE036
              - CE037
              - CE038
              - CE039
          - type: callout
            title: 首次外部技术销售（2025 年 2 月）是有意义信号
            body: >-
              2025 年 2 月，向第三方客户销售定制双极电渗析示范系统的订单，是 GET-Lit™ 技术首次得到确认的外部验证。这只是一个小里程碑，但对许可收入逻辑很重要。它说明有非内部买方愿意为自己的卤水项目付费使用
              EnergyX 技术。
            calloutType: insight
            claimRefs:
              - CE013
              - CE027
          - type: callout
            title: 性能主张依赖试点数据，而非商业运营
            body: >-
              所有量化技术主张（96% 回收率、1–2 天处理、$2,500/ton 成本、800 gal/ton 用水）都基于试点工厂测试和 PFS 建模，而不是商业运营数据。PFS 由 Worley 编制，并采用预 DFS
              项目的标准工程估算方法，同时使用 Inferred 资源类别，并承认放大不确定性。
            calloutType: assumption
            claimRefs:
              - CE014
              - CE015
              - CE016
              - CE017
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户画像与理想客户
        blocks:
          - type: paragraph
            body: >-
              EnergyX 所称目标市场是锂卤水资源所有者和生产商——控制 Lithium Triangle（Chile、Argentina、Bolivia）盐滩卤水矿床，或美国本土 Smackover、Clayton
              Valley 等地层的公司。第二层客群包括可提取伴生锂的地热卤水运营商，以及希望锁定美国来源电池级锂、满足 Inflation Reduction Act 关键矿物含量要求的汽车 OEM。公司 2026
              年发行说明书描述了三条不同商业路径： （1）从 EnergyX 自有生产运营直接签订锂包销；（2）向希望在自有矿床部署 LiTAS
              膜的生产商许可技术；（3）按经常性更换周期向获许可运营商销售耗材膜。每条路径对应不同买方画像——包销买方是下游电池制造商或 OEM；许可买方是上游生产商；耗材买方是现有被许可方。

              2022 年 2 月，Federal Register 将锂指定为美国关键矿物，提升了国内供应链的战略紧迫性。汽车 OEM 面临 IRA 激励，需要从自由贸易协定伙伴或国内生产中采购锂，因此 EnergyX 基于
              Smackover 的产出，对 GM 和其他国内组装商具备吸引力。全球可触达市场覆盖南美、北美、亚洲 和欧洲数百个已知卤水矿床，不过 EnergyX 目前把北美地层作为初始参考市场。
