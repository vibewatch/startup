      - number: '1.3'
        title: 创始人、管理团队与董事会治理
        blocks:
          - type: paragraph
            body: >-
              April 2026 发行说明书发布时，Teague Egan 37 岁，是唯一具名创始人，同时担任 EnergyX 的首席执行官、总裁和董事会主席，并作为控股股东持有约 63.76% 总投票权。Egan 拥有
              USC Marshall 创业 MBA，曾在 2013 年以个人身份投资 Tesla；Netcapital 活动称他是公司的“主要投资者和股东”。现任高管层包括 Dr. Amit
              Patwardhan（CTO，52 岁），拥有 Southern Illinois University 化学工程 PhD，此前在 Rio Tinto 担任高级技术和创新职位；Mayank Sharma（CFO
              兼司库，46 岁），2023 年 6 月加入，此前任职 HSBC 和 Imperium3；以及 Simonida Tilton（总法律顾问兼秘书，39 岁），2023 年 8 月加入。五人董事会包括董事长
              Teague Egan、其父 Michael Egan（86 岁，前 Alamo Rent A Car 董事长）、Kris Haber（副董事长，前 Lazard 董事总经理和 Safanad
              COO）、Stefon Crawford（GM Ventures Partner，December 2022 加入）和 Paul Leggett（Mithril Capital 董事总经理，January
              2024 加入）。EnergyX 未公开披露董事会委员会结构、正式治理章程或高管股权持有表；相较已经募集的外部资本规模，治理可见度偏薄。
