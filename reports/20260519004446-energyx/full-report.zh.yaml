      - number: '4.6'
        title: 融资需求与未来情景
        blocks:
          - type: paragraph
            body: >-
              现金跑道只到 2026 年 Q2，年度经营亏损约 $21 million；以 2026 年 5 月 runDate 计算，EnergyX 必须在数周内筹集大量新资本。当前 Regulation A 发行（5
              million 股、每股 $11.00、最高合计 $55 million）截至 2026-04-01 约完成 31% 认购（约 1.56 million 股 × $11 = 约 $17.1
              million）；若发行维持历史节奏，可带来数月额外跑道。CEO 已公开表示，在公开上市或 IPO 前，至少还需要一轮大型机构融资（“Series C”）。$450 million GEM Global
              Yield PIPE 取决于公开发行，不能作为紧急过桥资金使用。EnergyX 未来 12-24 个月资本前景由四个合理情景主导。基准情景下，Regulation A 发行全额完成（约 $55 million
              毛额），并在 2026 年底或 2027 年初完成 $50-100 million 的机构 Series C，提供两年以上现金跑道，并支持 Black Giant 在 EXIM
              框架下首次施工提款。悲观情景下，Reg A 只募得 $20-30 million，且没有机构轮落地，迫使公司再做一轮 Reg A 过桥、推迟资本开支，并可能收缩运营。乐观情景下，超过 $100 million
              的加速 Series C，或 Egan 提到过的来自大型油气公司的战略收购要约，会提供风险显著降低的路径。稀释轨迹已经相当明显： 2-for-1 拆股、Pantera 股权对价（2.34 million
              新股）、当前 Reg A 发行（最高 5 million 股）、IPO 时 1.5% GEM 认股权证，以及大量未归属员工股权池，都会显著叠加每股稀释。从财务结论看，EnergyX
              的资本结构风险高、稀释重，并完全依赖非经常性的散户融资和有条件的机构 PIPE。商业规模项目经济性仍不透明，单位经济性论证依赖管理层预测，而不是经审计的生产成本数据。
