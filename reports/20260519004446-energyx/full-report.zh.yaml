            body: >-
              截至 2025 年年度文件，EnergyX 持有 134 项专利或专利申请，覆盖分离介质、工艺配置、制造方法和电池技术。其中 50 项已公开。公司已在美国和国际范围提交实用专利申请，覆盖
              GET-Lit™（DLE）和 SoLiS™（电池）的物质组成、流程和制造品。IP 保护是多层结构，结合专利、商业秘密和商标权。LiTAS® 商标于 2025 年 1 月注册。EnergyX 有两项大学 IP
              协议：一项是 Second UT Austin Patent License Agreement（2023 年 1 月），覆盖电池框架和选择性离子传输的共同拥有 IP（按产品净销售额收取 3%
              权利金）；另一项是与 ProfMOF AS 的 Sublicense Agreement（2020 年 11 月），涵盖 University of Oslo 关于离子选择性分离的
              IP，并按产量收取阶梯式权利金。UT Austin 合作还包括 $150,000 赞助研究。EnergyX 招聘页面强调，40% 员工拥有 PhD，团队覆盖全球 22 所大学和 7 个国家，并已提交超过 100
              项专利（公司自报的约数，SEC 文件中 134 项的精确数量予以确认）。关键技术领导包括 CTO Dr. Amit Patwardhan。公司在分离技术、电池工程和企业岗位招聘，Austin, TX
