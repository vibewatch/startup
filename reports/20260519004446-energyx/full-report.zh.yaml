        title: 财务质量、审计问题与治理风险
        blocks:
          - type: paragraph
            body: >-
              EnergyX 的财务质量画像有几项重大隐忧。第一，独立审计师在 FY2024 和 FY2025
              两年的审计报告中都加入持续经营疑虑段落，理由是“现金储备有限、营运资本赤字、累计亏损……以及持续依赖股权和债务融资”。连续两年持续经营状态，是机构贷款人和股权承销商通常会标出的反向信号。第二，2025 年 3 月
              EnergyX 提交 Form 1-U，披露因会计方法变化，FY2023 经审计财务报表不应再被依赖：管理层决定将 2023 年 Reg A 融资招揽成本资本化（与 FY2024
              处理一致），而不是计入费用，因此需要重述。影响尚未重大到需要重新取得 SEC 评议资格，但削弱了期间可比性。第三，FY2025 发行说明书披露，2024-09-27 至 2024-10-03
              之间购买股票的投资者可能拥有法定撤销权，形成一项规模未在任何已提交文件中量化的或有负债。第四，Teague Egan（CEO）和 Michael Egan 在 2022 年 9 月各签署 $1 million
              可转换本票，原定在 2024-12-31 后到期应付；FY2025 1-K 和发行说明书都没有披露转换或偿还状态，构成未披露的关联方义务。第五，CEO 认购协议中的代理投票条款授予 CEO
              对投资者投票的广泛控制权，且 CEO 在完全稀释基础上仍持有约 47%
              股份，形成结构性治理集中，限制少数股东救济。当前小规模业务的收入确认相对直接（测试服务在完成时确认；设备销售在交付并附标准质保条款时确认），但转向大规模 TaaS
              或项目层面收入后，需要新的收入确认框架，目前尚未披露。
