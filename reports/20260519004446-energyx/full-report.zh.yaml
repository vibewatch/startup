      - number: '7.3'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              监管暴露横跨证券法、采矿和卤水许可、出口管制，以及面向 Chile 的权属或财政不确定性。EnergyX
              自己的文件承认，南美盐滩、南美交易对手暴露，以及准确取得土地和矿权权属都存在风险。在美国建设方面，许可面不是单一的，而是碎片化的：TCEQ 负责 Texas 广泛环境授权，Railroad Commission
              覆盖与锂项目相关的油气、注入和卤水生产路径，EPA 叠加 Class II 注入井规则，Arkansas 也有州级机构负责卤水资源保护和环境保护。这会放大进度风险，因为任何触及油田卤水或处置井的商业 DLE
              路径，可能面对顺序审批，而不是一个整合许可包。法律层面，豁免发行规则不会放松披露义务；只是把义务放进另一个框架，在那里撤销权、误导性陈述暴露和文件质量问题仍可能产生或有负债或交易摩擦。
