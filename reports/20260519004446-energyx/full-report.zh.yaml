  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 机构 Series C 轮
        - 2023 年后，没有任何机构共同投资方披露条款清单、投资者名单或估值
        - 机构价格发现是最可靠的独立估值信号；缺席本身就是最大单一风险
        - 向 EnergyX IR 索取；跟踪 SEC Form D 文件
      - - 独立估值或公平性意见
        - 未发布第三方评估、DCF 或可比分析
        - Form C 明确警示，缺少独立估值时，股票价值可能低于发行价
        - 委托独立分析；向 EnergyX 索取；检查后续 SEC 文件
      - - 完整股权结构表披露
        - 期权、RSA、认股权证、里程碑股份（Pantera）和 GEM 认股权证尚未在公开文件中完整合并
        - 相比总流通股方法，完全摊薄可能显著压低每股价值
        - 正式向公司索取股权结构表；交叉核对 SEC 年度文件
      - - 有约束力的 DLE 授权合同
        - 没有公开披露签署且包含商业条款的合同；所有关系都称受 NDA 限制
        - 授权是 TaaS 商业模式的核心；这一阶段没有合同是重大缺口
        - 向 EnergyX 索取可披露摘要；跟踪新闻稿和 SEC Form 1-U 文件
      - - EXIM Bank 尽调状态
        - 自 October 2024 公告以来，EXIM Bank LOI 向有约束力承诺推进的情况没有公开更新
        - LOI 有条件；若未推进为有约束力条款，它只是愿景，不是可靠资本
        - 跟踪 EXIM Bank 公开通知；直接询问 EnergyX IR
      - - Project Black Giant 完整可行性研究
        - 预可行性研究（PFS）已完成（April 2025）；确定性可行性研究（DFS）和 FEED 尚未获资金或签约
        - PFS 释放积极信号，但项目融资需要 DFS/FEED；缺口是额外 12–24 个月工作
        - 跟踪 EnergyX 项目更新；核查 Worley 和其他 EPC 承包商公告
    notes: 尽调要求按重要性排序；每项都是二元的投资逻辑验证里程碑。所有项目都重要，或构成阻断项。
    claimRefs:
      - CV003
      - CV015
      - CV022
      - CV034
      - CV035
      - CV045
