      - number: '3.3'
        title: 技术与商业对比
        blocks:
          - type: paragraph
            body: >
              DLE 竞争格局分为三类技术族群：离子交换（Lilac）、吸附式流程（Standard Lithium 通过 KTS/Aquatech
              合作，ExSorbtion）和基于膜的选择性提取（EnergyX）。每类技术在 OPEX（试剂、吸附剂更换）、CAPEX（基础设施、膜面积）、卤水品位适应性和淡水消耗上都有不同取舍。Standard
              Lithium 的 SiFT 工艺增加了一个纯化阶段，无需单独氢氧化物转化步骤即可生产电池级碳酸盐，在某些应用细分中可能形成成本优势。Lilac 的 IX 技术声称淡水消耗为 5–20 m³/tonne
              LCE，并可在 20–5,000 mg/L 卤水品位范围内运行，是同业中声称最宽的运行范围。


              截至 May 2026，一个关键市场观察是：没有任何 DLE 技术公司实现商业规模锂生产。所有领先 DLE 玩家——EnergyX、Lilac、Standard
              Lithium、ExSorbtion——仍处商业化前或后期示范阶段。Standard Lithium 在运营示范成熟度上走得最远，拥有连续六年的 Arkansas 示范和已签承购。Lilac
              在商业结构上领先，FEL-3 工程完成，并以有约束力的 Phase 1 100% 承购锁定了清晰建设路径。EnergyX 在可比披露指标上落后两者：没有有约束力的承购，没有披露 FEL-3 完成，也没有发布达到
              Lilac 或 Standard Lithium 规模的连续试点数据。


              定价和打包对比显示，DLE 技术定价高度不透明。EnergyX 未披露授权费或项目开发费。Lilac 的承购价格与市场指数挂钩（根据 Traxys 协议）。Standard Lithium
              是项目开发商而非技术授权方，所以它的“价格”嵌入股权项目经济性。SQM 和 Albemarle 则在碳酸锂和氢氧化锂的现货与长期合同市场上按商品价格竞争，这是 DLE 产锂必须达到或低于的最终基准。
