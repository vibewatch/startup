      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              EnergyX 运营的是双边市场结构：技术被授权方（卤水运营商）和锂化学品买方（车企、电池
              OEM）各自通向不同收入路径，预算归属和采用触发点也不同。主要技术买方是控制盐沼矿权、希望提高回收率并缩短项目周期的存量卤水锂生产商。EnergyX 的 SEC 文件把这一群体称为核心目标：“大多数 Tier 1
              锂生产商以及锂勘探和资源公司”。Albemarle 在 Chile 的 Atacama 和 Nevada 运营卤水提取，并明确指出 DLE “尚未完全商业化”；如果 Albemarle 将内部 DLE
              项目商业化，它既可能是潜在授权客户，也可能构成竞争威胁。SQM（Sociedad Química y Minera de Chile）是另一家主导 Atacama 卤水运营商。油田卤水运营商是新兴买方：在
              Arkansas 的 Smackover formation
              和其他美国地层卤水中运营的石油巨头，正积极评估从采出水联产锂，这是一条完全绕开蒸发池经济性的新建采用路径。地热卤水运营商构成第三类卤水来源：California Imperial Valley 的 Salton
              Sea 地热区，在地热采出水中含有大量溶解锂。SLB（前 Schlumberger）已把自己定位在地热解决方案中，是 DLE 部署中可能的油田服务渠道伙伴。下游付款方是车企和电池 OEM。2025
              年车企占全球锂需求 51.14%（Mordor），汽车端 CAGR 预计到 2031 年为 21.73%。General Motors 通过 GM Ventures 领投 EnergyX 的 Series
              B，持有锂供应承购权，并计划到 2035 年每年采购 400,000 tons 锂，以支撑 EV 生产。EnergyX 投资者门户列出 GM、POSCO（韩国大型钢铁和电池材料公司）和
              Eni（意大利能源巨头）为战略投资者，说明企业买入背后既有技术获取，也有进入南美卤水区的地理触达。政府融资实体（DOE Loan Programs、EXIM
              Bank）是补充付款方，为符合本土采购标准的锂项目开发商提供非稀释或低成本资本，尤其在 IRA Section 30D 下，它为美国来源电池材料制造需求拉动。采用路径通常是：卤水运营商与 EnergyX 确定
              DLE 试点 → 验证回收率和 cost/ton → 协商技术授权费或 JV 结构 → 扩大到商业化生产 → 下游买方承购协议锁定销量。
