      - number: '8.4'
        title: 建议、信心与风险评级
        blocks:
          - type: paragraph
            body: >-
              建议为观察。EnergyX 已展现真实的战略选择权——已验证的实验室规模 DLE 技术、战略投资者（GM Ventures、POSCO、Eni）、已签署的 EXIM Bank
              LOI、已完成的预可行性研究，以及庞大的散户投资者社区。如果商业规模跑通，这些真正的优势会带来非对称上行。但 $3.26 billion 投前隐含估值相对于证据基础已经偏高：没有商业收入，没有独立估值，没有披露
              Series C 管线，没有约束性承购协议，也没有解决持续经营疑虑。建议未达到买入门槛，因为支撑投资逻辑的里程碑尚未实现，入场价格也没有提供足够的下行保护。鉴于严重数据缺口，信心为低：除公开披露的 Series
              B 和散户持股外，股权结构表不透明；Series C 状态未知；$3.26 billion
              隐含估值没有独立佐证。风险评级为高：公司面临商业规模执行风险、资本市场风险、流动性风险（股票没有公开市场）、技术风险、锂价风险，以及 EXIM Bank 条件性带来的监管 /
              融资风险。若要上调至买入，需要：(1) 机构投资者完成 Series C，且估值有独立分析支撑；(2) 签署带可验证里程碑的约束性 DLE 许可合同；(3) EXIM Bank
              项目融资确认，或拿到等效项目资本。否决触发点包括：到 end-2026 仍未完成任何机构轮，EXIM Bank LOI 终止或出现重大不利修改，或 Teague Egan 在商业里程碑达成前离任 CEO。
