          - type: callout
            title: Standard Lithium 的数据护城河是最高竞争门槛
            body: >-
              Standard Lithium 连续六年的示范工厂记录——处理 1 million barrels 真实卤水、15,000 个 DLE 循环、零安全事故——构成 North American DLE
              领域最可信的工程证据基础。项目贷款方和卤水资源所有者在投入项目资本前，很可能要求看到这种级别的工艺可靠性验证，使 SLI 的数据集成为真正的采购壁垒。
            calloutType: strength
