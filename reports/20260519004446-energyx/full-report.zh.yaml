      - number: '1.2'
        title: 技术组合与竞争差异化
        blocks:
          - type: paragraph
            body: >-
              EnergyX 的核心商业技术是 GET-Lit™ Direct Lithium Extraction 系统，用锂选择性膜从天然和工业卤水中提取电池级锂。该技术此前品牌名为 LiTAS® (Lithium
              Ionic Transport and Separation)，源自 University of Texas at Austin Dr. Benny Freeman 实验室的基础膜研究；Freeman
              教授也曾进入 EnergyX 早期科学顾问委员会。公司技术页面称，GET-Lit™ 可从卤水中回收最高 90% 的可用锂，而 Atacama 锂三角主导生产方式——传统太阳能蒸发池——约能达到 30 至
              40%。EnergyX 已积累 140 项以上与膜配方和提取工艺设计有关的专利。第二条技术线 SoLiS™ 聚焦固态电池开发，但公司公开材料和 SEC 文件显示，相比近期 DLE
              商业化重点，固态工作是更长期的计划。IP 储备强，但 EnergyX 的 GET-Lit™ 技术尚未在完全运营的商业规模锂提取设施中部署；公司 East Texas 示范工厂和经 Worley 验证的
              Project Black Giant PFS，是目前公开证据中最靠前的验证点。技术到商业规模之间的缺口仍是后续尽调章节的核心风险。
