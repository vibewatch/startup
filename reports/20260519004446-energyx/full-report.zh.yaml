      - number: '4.2'
        title: 历史融资与资本结构
        blocks:
          - type: paragraph
            body: >-
              截至 2025-12-31，EnergyX 累计融资约 $151 million，未扣除发行费用和佣金，资金来源组合不寻常：机构股权、战略企业投资和散户众筹。公司先靠创始人资本和 2021 年
              Netcapital 上的早期 Regulation CF 融资起步，随后完成 Series A 和可转债；2022 年 12 月，GM Ventures 领投 $15 million Series B。2023
              年中，后续 Series B 加入协议又引入 Elohim-SW Energy Fund（POSCO 关联方）约 $8.5 million，以及 IMM Battery Fund III $8.0
              million。2023-2024 年 Regulation A+ 发行贡献超过 $73.7 million，每股价格从 $8.00 升至 $9.50。2025 年 7 月，EnergyX 以每股 $10.00
              启动新的 Regulation A 发行（2.7 million 股加 200,000 股奖励股，2025 年 10 月售罄）；年末前按 $10.00 募得约 $17.6 million，2025 年 10
              月提价至每股 $11.00 后又募得 $1.4 million，2025 年合计 $19.0 million。2026 年 4 月发行说明书把发行扩展至 5 million 股，每股 $11.00，最高 $55
              million；截至 2026-04-01 已售约 1.56 million 股。资本结构中没有已提款债务：FY2024 和 FY2025 公司均未报告利息费用。不过，2022 年 4 月签署的 GEM
              Global Yield Share Purchase Agreement 提供最高 $450 million PIPE 融资，但只能在公开市场上市（IPO、SPAC 或同等事件）后行使，并授予 GEM
              一份可按公开发行价购买全部流通股 1.5% 的认股权证。2025-03-21 生效的 2-for-1 远期拆股把流通股数量翻倍；截至 2025-12-31，普通股流通股为 114.9 million
              股。KingsCrowd 按 2024 年 12 月 Reg CF 收盘价 $9.50/股测算，投前隐含估值约 $1.145 billion；投资者门户目前按总流通股乘以 $11.00 发行价给出约 $3.26
              billion 隐含估值，但两者都不是经谈判确定的机构轮投后估值。
