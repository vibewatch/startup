      - number: '3.4'
        title: EnergyX 声称的护城河及其薄弱处
        blocks:
          - type: paragraph
            body: >
              EnergyX 声称的护城河包括 LiBRE 膜 IP、与 General Motors 和 Samsung SDI 的战略合作，以及作为美国 DLE 公司可获得 IRA 和 DOE 支持的定位。GM 和
              Samsung SDI 合作释放 OEM 层面的技术验证信号，也暗示可触达下游需求。但基于公开披露，这些合作似乎并非排他；GM 在 EV 扩张上转向保全资本，也让战略关系的持续性受到质疑。IRA
              政策顺风会受政府更替影响，面临政治风险；China 在 DLE 相邻吸附剂制造上的规模，也可能压低设备成本优势。


              与 EnergyX 的护城河相比，截至 May 2026，Lilac Solutions 在关键指标上的商业位置明显更强：FEL-3 工程完成，与 Tier-1 大宗商品交易商 Traxys 签下有约束力的
              Phase 1 100% 承购，并在专用 Nevada 设施拥有 IX 介质制造能力。Standard Lithium 连续六年的示范数据集——处理 1 million barrels、15,000 个 DLE
              循环、零安全事故——构成一套工程证据档案，是没有相当运营小时数的竞争技术在采购评估中无法匹配的。这个数据护城河是 EnergyX 最高严重度的竞争风险，因为卤水项目所有者和贷款方越来越要求在投入 CAPEX
              之前，先看到同等规模下已验证的循环寿命。


              一旦项目选定 DLE 技术，切换成本很高：吸附剂尺寸、膜规格、卤水化学调校和工艺工程都绑定具体供应商。这为项目发起方制造锁定效应，但也给 EnergyX
              带来高承诺风险——公司必须展示足够去风险的运营数据，才能在初始采购中被选中。IEA 关键矿产展望指出，DLE 赋能技术对扩大全球锂供应至关重要，给 DLE 整体带来结构性顺风，但这股顺风由所有 DLE
              玩家共享，无法在同业中区分 EnergyX。
