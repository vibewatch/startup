      - number: '4.4'
        title: 项目层面经济性与资本强度
        blocks:
          - type: paragraph
            body: >-
              EnergyX 的资本需求远大于当前资产负债表规模，公司依靠分层融资策略跨到商业化生产。US Department of Energy 选中 EnergyX，给予 $5 million 赠款，用于在 East
              Texas 从地热卤水中开发锂提取示范设施；投资者门户在当前申报文件中确认，“East Texas 示范工厂已全面投入运营（获 $5M DOE 支持）”。2024 年 7 月，EnergyX 与 US
              Export-Import Bank（EXIM）签署意向书（LOI），为 Chile 的 Project Black Giant 提供 $690 million 项目融资，Goldman Sachs
              担任资本战略顾问；该 LOI 不具约束力，并以达成商业里程碑和最终投资决策为条件。2025 年 4 月，EnergyX 与全球 EPC 工程公司 Worley 合作完成 Project Black Giant
              的预可行性研究（PFS），该研究“确认了 Project Black Giant 的经济可行性”。PFS 衍生的资本成本估算、每吨运营成本、NPV 或 IRR
              均未公开披露，外部投资者几乎看不清经济账。Project Lonestar（East Texas，经 EXSO LLC 子公司）同样在 2025 年底前与一家大型 EPC 公司完成
              PFS，但具体经济指标仍未披露。EnergyX 已为 Lonestar 示范工厂锁定 TexAmericas Center 场址——这是 Texas Texarkana 一个约 12,000
              英亩、由政治机构运营的工业园区——采用期权结构，要求 EXSO 投入 $100 million 资本改良后才能行使土地购买权。Compass Minerals 合作（“America's Lithium
              Future”）目标是从 Great Salt Lake 卤水中实现 30,000 tpa；商业时间表、资本开支和包销条款均未公开。早期 Netcapital 文件（2021
              年，已经过时）曾暗示，15,000-tpa 设施中 EnergyX 承担的资本需求约为 $15 million，但当前 Black Giant Phase I/II 目标为 52,500
              tpa，意味着总资本开支要高得多。若 $690 million EXIM LOI 最终落地，可覆盖 Chile 项目大部分债务融资；但触发条件需要可融资的 DFS、环境审批和经过商业验证的提取流程。
