        - Q4 2026 过去后仍未完成机构轮融资
        - 说明成熟资本拒绝验证 $3.26B 估值；Reg A 过桥意味着估值可能下行
        - 下调至回避；估值支撑坍塌
      - - EXIM Bank LOI 终止或重大修改
        - EXIM Bank 官方沟通撤回或大幅下调 $690M LOI
        - 主要项目融资路径消失；Project Black Giant 融资承压
        - 重新评估项目可行性；大概率下调至回避
      - - Teague Egan 离任 CEO
        - 在商业规模里程碑前宣布 CEO 离任
        - 关键人风险；团队围绕创始人搭建；投资者社区锚定创始人叙事
        - 重新评估领导层厚度；新领导层被证明前大概率回避
      - - 折价 Reg A 发行（价格低于 $13）
        - EnergyX 提交下调股价的 Reg A 补充文件
        - 释放市场需求走弱信号；散户信心受损
        - 确认原因；若是结构性问题（不是市场时点），下调至回避
      - - 竞争 DLE 公司率先实现商业化生产
        - Standard Lithium 或 Lilac Solutions 宣布首批商业 DLE 吨位
        - 先发叙事优势转向竞争对手；未来授权定价承压
        - 跟踪 EnergyX 竞争应对；重估技术护城河
      - - 锂价低于 $8,000/tonne LCE 且持续 12+ 个月
        - 碳酸锂现货价格低于项目经济性阈值
        - 削弱项目经济性；降低被授权方对新增产能的需求
        - 重估项目 NPV 假设；商业化规模可能推迟
    notes: 触发项基于公开披露和 SEC 文件风险因素；阈值是分析估计，不是合同条款。
