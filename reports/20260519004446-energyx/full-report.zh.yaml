      - number: '5.2'
        title: GET-Lit™ 架构：机制与营销口径
        blocks:
          - type: paragraph
            body: >-
              GET-Lit™ 系统在膜层面使用混合基质膜（MMM）——在聚合物基体中嵌入选择性纳米填料——从而实现基于电渗析的锂离子传输。成型的大尺寸 MMM
              膜片被堆叠成模块簇，数千个模块堆再连接进电渗析单元，组成完整提取设施。该系统按连续流程运行，而非批次流程；这是一个关键工程主张，用来区别于离子交换树脂和离子吸附材料，后两者需要周期性再生，会压低吞吐量并增加试剂消耗。EnergyX
              称，MMM 可在高盐度（>10%）环境下运行且无需淡水稀释——这是纳滤膜会失效的工况——并保持锂 / 钠、锂 / 镁选择性。2025 年 2 月，EnergyX
              执行了一份销售订单，为客户提供定制双极电渗析示范系统，这是公司首次披露的技术许可事件。公司还采购了用于膜制造的商业化卷对卷生产设备，可支持内部规模化生产膜。溶剂萃取（SX）回路在电渗析后浓缩氯化锂物流，吸附（AX）抛光步骤则去除残余杂质，以满足电池级纯度规格。可是，公司尚未公开披露纯度规格（Li₂CO₃
              或 LiOH 纯度 %）、单步骤质量平衡数据或膜更换节奏——这些都是商业规模尽调的关键项目。该技术源于 University of Texas at Austin（Benny Freeman
              团队）的膜研究，以及从 ProfMOF AS 获得的再许可专利；ProfMOF AS 是 University of Oslo 技术转移办公室 Inven2 的衍生公司，专利覆盖离子选择性分离方法。EnergyX
              于 2023 年 1 月签署 Second UT Patent License Agreement，取得共同拥有的 IP，覆盖电池框架技术和选择性离子传输；若商业化，按产品净销售额支付 3% 权利金。
