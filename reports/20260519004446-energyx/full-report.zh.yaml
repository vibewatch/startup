      - number: '8.5'
        title: 不确定性与数据质量折价
        blocks:
          - type: paragraph
            body: >-
              由于几项结构性数据缺口，本估值章节的不确定性显著高于典型早期评估。第一，EnergyX 股票没有独立第三方估值——发行价由管理层设定，SEC Form C 明确认定这是风险。第二，除 Series B
              优先股（拆股后 18.7 million 股）以及通过 Reg A 和 Reg CF 出售的普通股外，完整股权结构表没有公开披露；期权、RSA、认股权证以及 Pantera
              收购带来的里程碑股份都可能造成实质稀释。第三，所有年度文件（FY2023 C-AR、FY2024 1-K、FY2025
              C-AR）都反复出现持续经营警示，表明公司结构性依赖持续股权融资，而非自我造血运营。第四，在当前估值水平没有任何机构 Series C 领投方或跟投方，这是实质反向信号：如果能接触同样信息的成熟机构不愿以高于
              $4.00/share 等效价格为 EnergyX 定价，那么以 $13.00/share 入场的散户投资者就面临逆向选择风险。第五，EXIM Bank 和 GEM PIPE
              承诺带条件，估值时不能视为已承诺资本。对 $3.26 billion 管理层隐含估值施加 30–40% 的标准数据质量折价，得到 $1.95–2.28 billion 的证据调整区间。这个区间仍高于证据支持的
              $900 million–$1.5 billion 中点，说明即使折价后，当前入场价格仍然偏高。尽调优先事项包括：Series C 条款清单（独立价格发现）、已签署且披露条款的 DLE
              许可合同，以及独立审计的可行性研究。MarketsandMarkets 关于 2029 DLE 市场达 $8.1 billion 的预测，以及 IEA
              的关键矿产需求轨迹，为叙事提供长期支撑；但叙事支撑无法弥合当前证据与当前价格之间的差距。
            claimRefs:
              - CV003
              - CV004
              - CV015
              - CV021
              - CV031
              - CV032
              - CV034
              - CV040
              - CV042
              - CV043
              - CV045
          - type: table
            tableRef: TV006
            claimRefs:
              - CV003
              - CV015
              - CV022
              - CV034
              - CV035
              - CV045
      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 建议：观察 — 估值已先于里程碑偏高
            body: >-
              EnergyX 拥有真实的战略选择权和可信的 DLE 技术版图，但 $3.26 billion 投前隐含估值比证据支持的中点高出 2–3.5×。以当前证据质量看，入场价格没有提供足够下行保护。应继续观察，直到
              Series C 机构轮、约束性许可合同或已确认项目融资完成。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV017
              - CV030
          - type: callout
            title: 关键反向信号：没有机构在 Series B 价格之上继续投资
            body: >-
              没有机构投资者在高于 2023 年 Series B 价格 $4.00/share（拆股前）的估值上投资。所有高于这一水平的定价，都来自管理层设定的散户发行价格。对于评估 $13.00/share
              发行的散户投资者，当前估值水平缺少机构价格发现，是最重要的单一反向信号。
            calloutType: risk
            claimRefs:
              - CV022
              - CV024
              - CV041
          - type: callout
            title: 关键假设：估值倍数要求商业化技术许可
            body: >-
              $2–4 billion 的乐观估值要求 EnergyX 从实验室和试点规模示范，转向规模化约束性商业许可协议。截至运行日期，任何 DLE
              公司都尚未做到这一点。基准情景倍数来自项目开发商基准，而不是技术许可基准，因为商业规模尚未产生收入。
            calloutType: assumption
            claimRefs:
              - CV018
              - CV025
              - CV027
