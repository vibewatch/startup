  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚点与轮次历史
        blocks:
          - type: paragraph
            body: >-
              EnergyX 在连续几次面向散户的股权发行中设置了多个估值锚点，且均由管理层确定，没有独立第三方评估。最早的锚点是 December 2022 的 Series B，GM Ventures、Elohim-SW
              和 IMM/POSCO 合计投入约 $31.5 million，价格为每股 $4.00（拆股前口径），对应拆股前完全稀释口径约 $480 million 的投前估值。到 late 2024，公司
              Regulation A+ 发行价格为每股 $9.50；KingsCrowd 按 December 2024 Regulation CF 关闭时的总流通股数，计算出投前隐含估值
              $1,145,622,034。March 2025，EnergyX 实施 2-for-1 正向拆股，所有流通股翻倍，并把 July 2025 Regulation A+ 重启时的每股定价重置为
              $10.00/share。随后在 October 2025、February 2026 和 May 2026 提交的发行通函补充文件，分别把价格提高到 $11.00、$12.00 和每股 $13.00。截至
              May 2026 253g2 补充文件，EnergyX 投资者门户显示投前隐含估值为 $3,258,556,886——按总流通股（拆股后约 250.7 million 股）乘以 $13.00/share
              计算。截至 April 1, 2026，公司在当前发行中已售出约 3.67 million 股，平均价格 $9.95，募集毛额 $36.6 million。GEM Global Yield PIPE
              承诺（$450 million）和 EXIM Bank LOI（$690 million）完全带条件，不构成股权价值或确定融资；两者分别需要公开市场上市或项目获批，而这两件事都尚未发生。关键是，SEC Form
              C 明确写道，公司股票“没有独立估值，这意味着这些股票价值可能低于每股价格”。没有机构投资者在高于 $4.00/share Series B 价格的估值上参与；2023 后所有定价都只是管理层设定的散户发行价格。
