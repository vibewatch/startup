      - number: '6.3'
        title: 战略投资者关系与潜在首批客户
        blocks:
          - type: paragraph
            body: >-
              EnergyX 近期最可信的客户前景来自其战略投资者。GM Ventures 领投 2022 年 12 月 Series B，GM Ventures Partner Stefon Crawford 加入
              EnergyX 董事会。TechCrunch 2024 年 10 月报道，EnergyX 计划向 POSCO 和 ExxonMobil 销售 DLE
              设备，并把这些关系描述为带有商业意向的伙伴关系，而不只是财务投资。

              POSCO 是韩国钢铁和电池材料巨头，通过 IMM Battery Fund III 参与 EnergyX 2023 年 6 月 Series B 加入协议，投入约 $8 million。POSCO 运营自己的
              DLE 项目，并已在 Chile 运营中部署 DLE 技术；这种既是投资方又是潜在竞争者的双重角色，会削弱许可合同落地的可能性。Eni Next 在同一加入协议中通过 Elohim-SW Energy Fund
              投入约 $8.5 million。

              尽管存在这些关系，截至 2026 年 5 月，EnergyX 未公开披露与 GM、POSCO、Eni 或 ExxonMobil 的任何有约束力商业合同。ExxonMobil 正在同一 Smackover
              Formation 独立开发 DLE 运营，这让 EnergyX 向 Exxon 许可技术的野心，与 EnergyX 自己在 Project Black Giant
              的生产计划之间出现结构性冲突。三家战略投资者仍只是股权持有人，转化为商业客户并无保证。
