      - number: '7.5'
        title: 治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              这里的治理风险并不抽象；它直接写在发行文件里。EnergyX 年报称，公司高度依赖关键人员；FY2025 文件称，创始人兼 CEO Teague Egan
              在本次发行后将控制多数投票权。问题在于，公司还在同时推进技术放大、项目开发和反复资本市场融资，却仍是私人发行人，持续披露有限，远不如上市矿业或工业同业。公开网站仍然以创始人为中心，但已审阅的公开材料没有同等披露独立董事会流程、正式继任计划或专门的风险管理架构。投资者因此面对的不只是理论上的少数股东权利问题；治理集中会影响资本配置、披露节奏、关联方容忍度，以及项目里程碑延误时问题暴露的速度。
