      - number: '7.2'
        title: 融资与资本结构风险
        blocks:
          - type: paragraph
            body: >-
              融资风险是最迫近的投资逻辑威胁，因为即便技术论证改善，资金也可能让所有其他工作线停摆。EnergyX
              已连续两份年度报告披露持续经营表述，同一批文件还警告，公司可能需要以不利条款或下轮估值融资继续筹资。公司通过反复 Regulation A
              活动和创纪录散户融资，展示了真实筹资能力；但这段历史也证明，公司仍依赖资本市场，而不是自我造血。2026 年发行说明书增加了一个更具体的证券法悬念：如果 2024
              年某个狭窄销售窗口内的销售最终被认定不合规，投资者可能拥有法定撤销权。2025 年 3 月的非依赖文件与该问题相互独立，但会叠加披露质量风险。与此同时，被广泛引用的 EXIM
              意向书仍是一条有条件融资路径，不能等同于已经可提款的已融资债务。
