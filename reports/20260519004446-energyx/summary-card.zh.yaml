summary:
  headline: EnergyX 确有 DLE 技术期权，也拿到了战略投资人验证；但 $3.26 billion 的管理层设定隐含估值缺少商业收入、独立评估或机构跟投支撑，因此只能给观察，置信度低、风险高。
