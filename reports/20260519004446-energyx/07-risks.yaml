  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: EXIM-closing-conditions
    missingEvidence: The exact milestone package, covenants, U.S.-content assumptions, lender conditions precedent, and closing timeline for the EXIM letter of intent.
    whyItMatters: Without the underlying conditions, investors cannot determine whether the headline 690 million dollar figure is realistically financeable or merely directional.
    diligencePath: Request the LOI, side letters, adviser memo, and management financing workplan under NDA.
    relatedQuestionRefs:
    - QR033
    relatedTableRefs:
    - TR003
    - TR004
  - type: missing-source
    severity: blocking
    topic: project-permit-status
    missingEvidence: A project-by-project permit matrix listing each Texas, Arkansas, and Chile permit, filing date, current status, appeal status, and owning agency.
    whyItMatters: Permits are critical-path dependencies for both construction and project debt, and public pages identify agencies but not EnergyX-specific status.
    diligencePath: Obtain counsel-prepared permit tracker and copies of filed applications or approvals.
    relatedQuestionRefs:
    - QR034
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: blocking
    topic: Chile-title-water-community
    missingEvidence: Concession documents, title opinions, water-right instruments, indigenous or community agreements, and local permitting correspondence for Project Black Giant.
    whyItMatters: Title, water, and community readiness directly influence bankability, schedule, and the durability of any Chile valuation case.
    diligencePath: Require Chilean counsel memo, title chain, water-right file, and stakeholder-engagement packet.
    relatedQuestionRefs:
    - QR035
    relatedTableRefs:
    - TR001
    - TR004
  - type: missing-source
    severity: material
    topic: strategic-investor-commercial-contracts
    missingEvidence: Executed offtake, licensing, equipment, pilot, or exclusivity agreements showing whether strategic investors are customers, only investors, or both.
    whyItMatters: The commercial case changes materially if anchor strategic names are under contract rather than merely supportive shareholders.
    diligencePath: Request counterparty list and executed commercial agreements or a negative confirmation that none exist.
    relatedQuestionRefs:
    - QR036
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: board-independence-and-succession
    missingEvidence: Board committee charters, independent-director roster, succession plan, emergency CEO replacement authority, and risk-governance documentation.
    whyItMatters: Founder control is already explicit in the filings, so the mitigating question is whether counterbalancing governance actually exists.
    diligencePath: Request board package, governance guidelines, and investor-rights summary under NDA.
    relatedQuestionRefs:
    - QR037
    relatedTableRefs:
    - TR005
  - type: missing-source
    severity: material
    topic: export-classification-analysis
    missingEvidence: An itemized export-classification analysis for process equipment, software, source code, and technical data used in South American deployments.
    whyItMatters: EAR exposure may be minor, but investors need confirmation before assuming frictionless cross-border engineering and data sharing.
    diligencePath: Have trade counsel prepare an ECCN and licensing memo covering Chile and Argentina workflows.
    relatedQuestionRefs:
    - QR038
    relatedTableRefs:
    - TR001
