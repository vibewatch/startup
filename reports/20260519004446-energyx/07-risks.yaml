- id: mitigations-kill-criteria-blockers
  title: Mitigations, Kill Criteria, and Diligence Blockers
  body: 'The right posture is not to reject EnergyX automatically, but to treat the next diligence phase as milestone-driven. The best available mitigants are that the company has raised meaningful capital, attracted recognizable strategic names, built enough technical and project narrative to secure policy attention, and engaged external infrastructure such as Worley, TexAmericas, and an EXIM pathway. Those mitigants are real but conditional. None removes the need for hard evidence on permit status, financing conditions, scale-up performance, or board-level risk controls. The clearest kill criteria are measurable: if commercial-scale performance proof does not improve, if definitive project financing remains absent after the next major capital cycle, if permit progress cannot be documented, or if founder-control and disclosure issues worsen, the risk-adjusted case deteriorates quickly. The open diligence blockers below are therefore not minor clean-up items; they are the evidence requests
    that determine whether the story is financeable or merely narratively compelling.'
  claimRefs:
