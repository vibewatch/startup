- id: TR006
  title: Mitigation and Kill Criteria
  columns:
  - Risk
  - Monitorable trigger
  - Threshold or event
  - Action implication
  rows:
  - - Commercial-scale DLE gap
    - Third-party technical validation
    - No independent validation or sustained demo performance before next major financing round
    - Pause underwriting or require steep structure protection
  - - Going-concern / financing stress
    - Definitive financing close
    - No binding project debt and no clearly funded runway extension
    - Assume emergency capital raise and re-price entry
  - - Permitting schedule slip
    - Permit critical-path evidence
    - Management cannot provide filed permit list, approval status, and agency feedback by asset
    - Treat build schedule as non-bankable and defer commitment
  - - Customer-proof weakness
    - Binding customer contracts
    - No binding offtake, licensing, or equipment contracts beyond strategic-investor narrative
    - Model slower revenue start and lower debt availability
  - - Commodity-price compression
    - Lithium price and oversupply trend
    - Persistently weak carbonate/hydroxide pricing plus oversupply evidence during financing window
    - Raise hurdle rate and haircut project economics
  - - Founder-control / disclosure concern
    - Governance remediation
    - No stronger independent oversight after rescission and non-reliance issues
    - Escalate governance discount or avoid minority position
  notes: Kill criteria are intentionally observable and investor-usable rather than generic management aspirations.
