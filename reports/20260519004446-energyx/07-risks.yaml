- id: TR007
  title: Scenario Matrix
  columns:
  - Scenario
  - Key drivers
  - Expected 24-month outcome
  - Investment implication
  rows:
  - - Bear
    - EXIM LOI stalls, permits remain opaque, lithium oversupply persists, and no customer contract emerges
    - EnergyX requires another dilutive raise before bankable project financing; Black Giant and Lonestar timelines slip materially
    - Avoid or invest only with hard downside protection and milestone tranches
  - - Base
    - Demo progress continues but definitive financing and permits remain incomplete; strategic backers stay supportive but non-binding
    - Company extends runway through additional private capital while moving projects forward incrementally
    - Proceed only if valuation compensates for execution and financing lag
  - - Bull
    - Independent scale evidence improves, permit matrix is documented, EXIM or alternate debt path converts, and a binding customer contract appears
    - EnergyX can finance first commercial build with materially better credibility and lower dilution pressure
    - Underwriting can shift from narrative-risk to project-execution risk
