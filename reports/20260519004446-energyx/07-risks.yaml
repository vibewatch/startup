callouts:
- calloutType: risk
  title: Two consecutive going-concern opinions make financing timing existential
  body: This is not a one-off audit comment. Consecutive going-concern language means investors should assume another funding event is required before EnergyX reaches self-sustaining operations.
  claimRefs:
  - CR001
  - CR012
  - CR018
- calloutType: risk
  title: Commercial-scale proof remains the first thesis gate
  body: EnergyX may have meaningful pilots and demonstrations, but its own filings still state that the technology has not been demonstrated at scale. That makes every downstream milestone conditional.
  claimRefs:
  - CR002
  - CR005
  - CR006
- calloutType: risk
  title: EXIM LOI should be treated as optionality, not cash in hand
  body: The LOI is strategically helpful, but official EXIM product rules and the absence of a disclosed final close mean investors should not underwrite it as funded debt.
  claimRefs:
  - CR019
  - CR020
- calloutType: risk
  title: Securities-law exposure is unusually tangible for a private startup
  body: The rescission-right disclosure and the 2025 non-reliance filing together create a concrete legal overhang that can affect future capital formation and diligence friction.
  claimRefs:
  - CR015
  - CR016
  - CR022
- calloutType: risk
  title: Permitting is a multi-agency path, not a single checkbox
  body: Texas, Arkansas, and federal well rules touch different parts of the brine-production stack, so schedule slippage can appear even if one regulator is supportive.
  claimRefs:
  - CR024
  - CR025
  - CR026
  - CR027
- calloutType: insight
  title: Strategic-investor validation is real but not equivalent to customer proof
  body: Backing from GM, POSCO, and Eni improves credibility, yet the reviewed filings still show a pre-commercial business without public evidence of binding offtake from those names.
  claimRefs:
  - CR017
  - CR034
  - CR037
- calloutType: risk
  title: Weak lithium pricing can multiply every other risk
  body: Low prices do not just hurt economics directly; they also make debt, customer conversion, and project timing less forgiving.
  claimRefs:
  - CR031
  - CR032
  - CR033
- calloutType: recommendation
  title: Demand a document-level permit and financing matrix before investing
  body: The next diligence step should request filed permits, agency correspondence, EXIM milestones, site-control documents, and independent engineering deliverables rather than more narrative marketing.
  claimRefs:
  - CR020
  - CR024
  - CR025
  - CR041
  - CR042
- calloutType: assumption
  title: Arkansas peer progress raises the bar for EnergyXs new Smackover asset
  body: The competitive issue is not only who has a resource; it is who can show process durability, FID readiness, and customer proof first in the same basin.
  claimRefs:
  - CR036
