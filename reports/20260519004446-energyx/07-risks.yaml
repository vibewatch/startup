company:
  name: Energy Exploration Technologies, Inc. (EnergyX)
chapter:
  number: 7
  title: Risks
  summary: EnergyXs risk profile is dominated by a commercial-scale execution gap, recurring financing dependence, and a permit-heavy regulatory path that must all resolve within a still-volatile lithium market. The most decision-relevant issues are consecutive going-concern disclosures, the non-binding nature of the EXIM financing path, securities-law cleanup from the Reg A process, and founder-centered governance layered onto limited public customer proof. Meaningful mitigants exist, but the case is not yet ready to underwrite on narrative momentum alone.
sections:
- id: technology-execution-risk
  title: Technology and Execution Risk
  body: 'EnergyXs central execution risk is the gap between a technically plausible DLE platform and repeatable commercial-scale proof. The companys own risk factors say the technology has not yet been demonstrated at scale, while the H1 2025 filing still says there are no commercial operations and no material revenue from licensing or product sales. That combination matters because EnergyX is simultaneously trying to prove GET-Lit across multiple technical elements, move from pilots to demonstrations in both Chile and the United States, and integrate a newly acquired Arkansas resource position. The company does have more substance than a slide-deck concept: filings and current marketing describe active pilot or demo assets, branded process components, and ambitious production targets for Black Giant and Lonestar. But that still leaves major scale-up risk around recoveries, uptime, impurity handling, engineering handoff, and whether pilot data survives the transition to fully financed project
    buildout.'
  claimRefs:
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  - CR009
  - CR010
  - CR011
  tableRefs:
  - TR002
- id: financing-capital-structure-risk
  title: Financing and Capital Structure Risk
  body: 'Financing risk is the most immediate thesis threat because it can halt every other workstream even if the technical case improves. EnergyX has now disclosed going-concern language in two consecutive annual reports, and the same filings warn that additional capital may need to be raised on unfavorable terms or in down rounds. The company has shown real fundraising capacity through repeated Regulation A activity and a record-setting retail raise, but that history also proves continued dependence on capital markets rather than self-funding operations. The 2026 offering circular adds a more specific securities-law overhang: investors in a narrow 2024 sales window may hold statutory rescission rights if those sales are ultimately found non-compliant. The March 2025 non-reliance filing is separate from that issue but compounds disclosure-quality risk. Meanwhile, the widely cited EXIM letter of intent remains a conditional financing pathway, not interchangeable with funded debt already
    available for draw.'
  claimRefs:
  - CR001
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR018
  - CR019
  - CR020
