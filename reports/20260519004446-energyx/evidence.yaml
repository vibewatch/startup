evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: No post-money institutional valuation has been publicly disclosed for any EnergyX funding round
    missingEvidence: >-
      Post-money valuation from the December 2022 Series B, Series B joinders in June 2023, or any subsequent
      institutional transaction; secondary pricing data; board-approved 409A or fair-market-value determination.
    whyItMatters: >-
      Valuation is a foundational cover metric for the report; the only public valuation signals are the crowdfunding
      offering prices ($8, $10, $13/share) and KingsCrowd's pre-money estimate of $1.145 billion. These are insufficient
      for institutional underwriting.
    diligencePath: >-
      Obtain Series B term sheet, any subsequent 409A valuation, most recent board-approved FMV memo, and secondary
      share-transaction pricing from management.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs: []
  - type: enumeration-incomplete
    severity: material
    topic: Leadership and founder table lacks board committee structure and executive equity ownership schedules
    missingEvidence: >-
      Current board committee assignments, governance charter, independent director designations, executive
      compensation-linked equity grants, vesting schedules, and any founder lock-up provisions.
    whyItMatters: >-
      Chapter 1 should anchor governance for later risk and valuation chapters. EnergyX's highly concentrated control
      structure (63.76% Egan voting power) makes governance transparency especially important.
    diligencePath: >-
      Request board charter, committee assignments, investor rights agreement, cap table with equity grants and vesting
      schedules, and any board-approved succession or key-person risk plan.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: Stakeholder map cannot resolve full cap table ownership percentages or investor control provisions
    missingEvidence: >-
      Full cap table with precise percentage holdings for each institutional and strategic investor; liquidation
      preference stacks; anti-dilution protections; pro-rata rights; information rights; and any investor veto rights.
    whyItMatters: >-
      The public sources identify named investors and round amounts but do not resolve the economic and control
      structure underlying EnergyX's capitalization, which is essential for later valuation and governance chapters.
    diligencePath: Request the current cap table, investor rights agreement, and side letters from management.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: No public source discloses a commercial production timeline for any EnergyX project
    missingEvidence: >-
      A dated, engineering-backed schedule showing when EnergyX expects to begin commercial lithium production at scale
      from Project Black Giant, Project Lonestar, or the Smackover Arkansas acreage.
    whyItMatters: >-
      Without a production timeline, the gap between EnergyX's current $1.1M revenue and its multi-billion-dollar
      project potential cannot be assessed. The going-concern concern also depends on how long the company needs to
      remain pre-commercial.
    diligencePath: >-
      Request project development schedules, permitting timelines, offtake framework agreements, and construction
      financing commitments from management.
    relatedQuestionRefs:
      - QO020
      - QO026
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: minor
    topic: UT Austin technology license terms and scope are not publicly disclosed
    missingEvidence: >-
      The scope, royalty structure, field-of-use restrictions, exclusivity, and sublicensing rights of EnergyX's
      foundational technology agreement with the University of Texas at Austin.
    whyItMatters: >-
      EnergyX's IP foundation rests partly on Dr. Freeman's UT Austin research; the terms of any IP license or
      commercialization agreement affect EnergyX's exclusive access to its core technology.
    diligencePath: >-
      Request the technology license agreement, any sponsored research agreement with UT Austin, and the IP ownership
      schedule from management.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs: []
  - type: missing-source
    severity: material
    topic: DLE-addressable brine SAM
    missingEvidence: >-
      An independent market estimate of the brine-addressable lithium volume that is technically suitable for DLE
      deployment, with published methodology distinguishing DLE-applicable brine chemistry from unsuitable or
      hard-to-reach deposits.
    whyItMatters: >-
      Without a DLE-specific SAM, the ~462,000-924,000 LCE ton estimate (derived from EnergyX's own 30-60% brine share)
      cannot be independently validated; the range is too wide to underpin project pipeline or licensing revenue
      modeling.
    diligencePath: >-
      Request Wood Mackenzie or S&P Global Commodity Insights to provide a DLE-suitability screen of global brine
      deposits; alternatively, build a bottom-up estimate from per-country brine resource databases filtered by lithium
      concentration threshold and operator control.
    relatedQuestionRefs:
      - QM002
  - type: missing-source
    missingEvidence: >-
      An independent, peer-reviewed market sizing study of the DLE technology licensing market specifically, covering
      addressable operators, typical licensing fee structures ($M/year or $/ton royalty), and total licensing pool
      value.
    whyItMatters: >-
      Without a DLE-specific market size, EnergyX's TAM claim cannot be independently validated; investor valuation at
      $3.26 billion pre-money is unsupported by any third-party revenue-based TAM for the technology licensing segment.
    diligencePath: >-
      Commission a DLE licensing fee comparable transaction analysis from Wood Mackenzie, S&P Global Commodity Insights,
      or Roskill; alternatively, model a bottom-up estimate from known brine asset counts × pilot success rate × typical
      licensing multiples.
    relatedQuestionRefs:
      - QM001
  - type: private-evidence-only
    severity: material
    topic: DLE commercialization status
    missingEvidence: >-
      Third-party independent audit of EnergyX's pilot throughput, uptime, and cost-per-ton data for Project Lonestar
      and the Chile pilot; EnergyX asserts 98% recovery rate but no external validation has been published.
    whyItMatters: >-
      Incumbent brine producers and project finance lenders require validated pilot performance data before committing
      capital; the absence of a public audit makes the technology risk opaque.
    diligencePath: >-
      Request EnergyX's pilot performance reports and contract Wood Mackenzie or an independent process engineering firm
      to conduct a technical due diligence review with site access.
    relatedQuestionRefs:
      - QM013
      - QM015
  - type: missing-source
    severity: material
    topic: DOE LPO commitment
    missingEvidence: >-
      Public confirmation of any DOE Loan Programs Office conditional commitment or term sheet for EnergyX; the investor
      portal references DOE backing but no LPO press release or DOE official confirmation has been located.
    whyItMatters: >-
      A DOE LPO commitment would substantially de-risk project finance and validate technology readiness; absence of
      independent confirmation raises the risk that the claim is promotional rather than contractual.
    diligencePath: >-
      Search DOE LPO conditional commitment announcements; request EnergyX to provide the DOE term sheet or commitment
      letter as part of commercial diligence.
    relatedQuestionRefs:
      - QM016
  - type: conflicting-data
    severity: material
    topic: market size contradiction
    missingEvidence: >-
      Reconciliation of Grand View Research's $96.45 billion 2033 estimate with Mordor Intelligence's volume-based
      forecast implying $40-44 billion at current prices; the 2.5x gap reflects incompatible price scenario assumptions.
    whyItMatters: >-
      The spread materially affects EnergyX's revenue potential modeling; at $9,000/ton LiCO3 the market is structurally
      different from the $20,000-$30,000/ton environment embedded in higher-end forecasts.
    diligencePath: >-
      Build a custom price-scenario model using USGS historical prices, Benchmark Mineral Intelligence forward curves,
      and Rho Motion demand forecasts to derive EnergyX-specific revenue range under bear/base/bull price assumptions.
    relatedQuestionRefs:
      - QM022
  - type: missing-source
    severity: material
    topic: DLE CAPEX and OPEX comparison
    missingEvidence: >-
      Independent engineering estimates for CAPEX and OPEX per tonne LCE for membrane DLE (EnergyX), IX DLE (Lilac), and
      adsorption DLE (Standard Lithium) versus solar evaporation at equivalent scale.
    whyItMatters: >-
      Without comparable cost estimates, it is impossible to determine whether EnergyX's technology is cost-competitive
      with peers or with incumbent evaporation methods at commercial scale.
    diligencePath: >-
      Commission or obtain a published independent techno-economic assessment (TEA) comparing the four main DLE
      technology families at 5,000–25,000 tpa scale.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: material
