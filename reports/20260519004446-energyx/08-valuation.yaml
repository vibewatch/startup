company:
  name: Energy Exploration Technologies, Inc. (EnergyX)
chapter:
  number: 8
  title: Valuation
  summary: >-
    EnergyX's current Regulation A+ offering implies a pre-money valuation of $3.26 billion at $13.00/share—a
    figure unsupported by commercial revenue ($1.1 million in FY2025), any independent appraisal, or institutional
    follow-on above the 2023 Series B price. Against comparable pre-commercial DLE developers Standard Lithium ($887 million)
    and Lithium Americas ($1.68 billion), the implied valuation is 2–3.5× ahead of evidence-supported midpoints. The recommendation
    is TRACK with LOW confidence and HIGH risk; the valuation stance is STRETCHED. A move to BUY requires a closed Series C,
    binding licensing contracts, and independently validated project economics.

sections:
  - id: valuation-anchors-and-round-history
    title: Valuation Anchors and Round History
    body: >-
      EnergyX has assembled multiple valuation anchors across consecutive retail equity offerings, each set by management
      without independent third-party appraisal. The earliest anchor is the December 2022 Series B, where GM Ventures, Elohim-SW,
      and IMM/POSCO collectively invested approximately $31.5 million at $4.00 per share (pre-split equivalent), implying a
      pre-money valuation of roughly $480 million on a pre-split fully-diluted basis. By late 2024, the company's Regulation A+
      offering priced at $9.50 per share, and KingsCrowd calculated a pre-money implied valuation of $1,145,622,034 based on total
      shares outstanding at the December 2024 Regulation CF close. In March 2025, EnergyX executed a 2-for-1 forward stock split,
      doubling all outstanding shares and resetting per-share pricing for the July 2025 Regulation A+ relaunch at $10.00/share.
      Subsequent offering circular supplements filed in October 2025, February 2026, and May 2026 increased the price to $11.00,
      $12.00, and $13.00 per share respectively. As of the May 2026 253g2 supplement, EnergyX's investor portal states the pre-money
      implied valuation is $3,258,556,886—calculated as total shares outstanding (approximately 250.7 million post-split) multiplied
      by $13.00/share. As of April 1, 2026, the company had sold approximately 3.67 million shares at an average price of $9.95,
      raising $36.6 million gross in the current offering. The GEM Global Yield PIPE commitment ($450 million) and the EXIM Bank LOI
      ($690 million) are entirely conditional and do not constitute equity value or assured financing; both require a public-market
      listing or project approval, respectively, neither of which has occurred. Crucially, the SEC Form C explicitly states there
      has been "no independent valuation of our shares, which means that such shares may be worth less than the price per share."
      No institutional investor has participated at valuations above the $4.00/share Series B price; all post-2023 pricing reflects
      management-set retail offering prices only.
