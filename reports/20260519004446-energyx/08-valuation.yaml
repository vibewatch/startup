  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: independent-valuation
      missingEvidence: "Independent third-party valuation or fairness opinion of EnergyX shares from a recognized financial institution or investment bank."
      whyItMatters: "The Form C explicitly warns that the offering price is not supported by independent appraisal. Without it, all valuation conclusions rest on management-set retail offering prices rather than arms-length price discovery."
      diligencePath: "Request EnergyX to commission an independent valuation; alternatively, monitor for any future Series C institutional term sheet that would provide independent price discovery."
      relatedQuestionRefs:
        - QV011
        - QV025

    - type: private-evidence-only
      severity: blocking
      topic: series-c
      missingEvidence: "Term sheet, investor list, or valuation data from an institutional Series C round in EnergyX."
      whyItMatters: "An institutional Series C is the single most important valuation event that would either confirm or invalidate the $3.26B management-set implied valuation. Its absence is the key adverse signal in this chapter."
      diligencePath: "Monitor SEC Form D filings; request direct update from EnergyX investor relations; track EnergyX press releases and news coverage for Series C announcements."
      relatedQuestionRefs:
        - QV005
        - QV012

    - type: missing-source
      severity: material
      topic: comparable-dleacquisition
      missingEvidence: "Publicly disclosed M&A transaction data for DLE or lithium technology company acquisitions with transaction multiples."
      whyItMatters: "Strategic M&A comps would provide a third valuation methodology beyond public market comparables and DCF analysis, potentially revealing acquisition premiums that institutional buyers would pay for EnergyX technology."
      diligencePath: "Review S&P Global Commodity Insights, PitchBook, and Bloomberg data for DLE/lithium technology M&A transactions from 2020 to present."
      relatedQuestionRefs:
        - QV024
      relatedTableRefs:
        - TV004

    - type: private-evidence-only
      severity: material
      topic: exim-bank-status
      missingEvidence: "Official update from EXIM Bank or EnergyX on LOI progression beyond the October 2024 announcement."
      whyItMatters: "The $690M LOI is a material conditional capital commitment. If it has progressed toward binding terms, valuation support improves; if it has stalled or been withdrawn, this represents a major thesis-break event."
      diligencePath: "Monitor EXIM Bank public project notifications; direct IR inquiry to EnergyX; review any SEC Form 1-U filings that may disclose progress or setbacks."
      relatedQuestionRefs:
        - QV019
        - QV016

    - type: missing-source
      severity: material
      topic: full-cap-table
      missingEvidence: "Complete consolidated capitalization table including all dilutive securities: options, RSAs, warrants, milestone-contingent shares from the Pantera acquisition, and the GEM warrant."
      whyItMatters: "Full dilution could materially reduce per-share value relative to the total-shares-outstanding method used by the company to calculate the $3.26B implied valuation."
      diligencePath: "Request formal cap table from EnergyX IR; cross-reference all SEC filings mentioning stock options, warrants, and contingent shares to construct a bottom-up fully-diluted share count."
      relatedQuestionRefs:
        - QV003

