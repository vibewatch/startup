      - CO005
      - CO006
    tableRefs:
      - TO001
    figureRefs:
      - FO003
  - id: section-technology
    title: Technology portfolio and competitive differentiation
    body: >-
      EnergyX's core commercial technology is the GET-Lit™ Direct Lithium Extraction system, which uses lithium-selective
      membranes to extract battery-grade lithium from naturally occurring and industrial brines. The technology was
      previously branded LiTAS® (Lithium Ionic Transport and Separation) and evolved from foundational membrane research
      conducted in Dr. Benny Freeman's laboratory at the University of Texas at Austin, a professor who also served on
      EnergyX's early science advisory board. The company's technology page claims that GET-Lit™ can recover up to 90% of
      available lithium from brine, compared to approximately 30 to 40% achievable through traditional solar evaporation
      ponds, the dominant production method in the Atacama lithium triangle. EnergyX has accumulated 140 or more patents
      related to its membrane formulations and extraction process designs. A secondary technology program, SoLiS™, focuses
      on solid-state battery development, though the company's public materials and SEC filings indicate that solid-state
      work is a longer-term initiative versus the near-term DLE commercialization focus. Despite the strong intellectual
      property position, EnergyX's GET-Lit™ technology has not yet been deployed at commercial scale in a fully
      operational lithium-extraction facility; the company's East Texas demonstration plant and the Worley-validated
      Project Black Giant PFS represent the most advanced public proof points. The technology-to-commercial-scale gap
      remains the central risk for downstream diligence chapters.
    claimRefs:
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
