chapter:
  number: 1
  title: Company Overview
  summary: >-
    Energy Exploration Technologies, Inc. (EnergyX) is a pre-commercial direct lithium extraction (DLE) technology and
    lithium-resource company founded in Puerto Rico in December 2018 and headquartered operationally in Austin, Texas.
    The company has raised approximately $151 million through December 2025, primarily through Regulation A and Regulation
    CF crowdfunding campaigns and a $15 million institutional Series B led by GM Ventures. EnergyX's flagship GET-Lit™ DLE
    membrane technology, developed from foundational research at the University of Texas at Austin, claims recovery rates of
    up to 90% from brine versus the roughly 30–40% achievable with traditional solar evaporation. Its key resource project,
    Project Black Giant in Chile's Atacama region, completed a Preliminary Feasibility Study in April 2025. The company
    generated only $1.1 million in revenue in fiscal year 2025 and carries a cumulative net loss of $73.3 million; its
    auditors issued a going-concern doubt paragraph. The primary unresolved diligence items are: institutional post-money
    valuation from any round, exact commercial production timelines for all projects, board governance charter, and the
    path from $1.1 million in annual revenue to commercial-scale lithium production.
sections:
  - id: section-identity
    title: Identity, legal form, and operational scope
    body: >-
      Energy Exploration Technologies, Inc., operating publicly as EnergyX, was incorporated in Puerto Rico on December 18,
      2018, and is classified under SIC code 2810 (Industrial Inorganic Chemicals). The company's principal operational
      presence is in Austin, Texas, with its mailing address at 2535 Ridgepoint Drive #100, Austin TX 78754, and its
      registered corporate address in San Juan, Puerto Rico. On its CIK 0001830166, the SEC classifies EnergyX as an
      "emerging growth company" under Regulation A of the Securities Act. The company's stated mission is to solve the
      global lithium shortage by developing and commercializing direct lithium extraction technology alongside lithium-rich
      brine resource projects in Chile, Texas, Arkansas, and through partnerships in Utah. EnergyX's official homepage
      states "110+" employees and "140+" patents, though its FY2025 annual report filed with the SEC in April 2026 discloses
      61 full-time and 7 part-time employees as of the filing date, with the discrepancy likely attributable to contractors
      and consultants not captured in the 1-K headcount. As of the April 2026 offering circular, EnergyX was offering
      shares at $13.00 per share in a continuing Regulation A campaign, with its investor portal reporting approximately
      $177.9 million raised and over 49,000 investors in aggregate across all campaigns.
    claimRefs:
      - CO001
      - CO002
      - CO003
