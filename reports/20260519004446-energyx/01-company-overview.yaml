  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: No post-money institutional valuation has been publicly disclosed for any EnergyX funding round
      missingEvidence: >-
        Post-money valuation from the December 2022 Series B, Series B joinders in June 2023, or any subsequent
        institutional transaction; secondary pricing data; board-approved 409A or fair-market-value determination.
      whyItMatters: >-
        Valuation is a foundational cover metric for the report; the only public valuation signals are the
        crowdfunding offering prices ($8, $10, $13/share) and KingsCrowd's pre-money estimate of $1.145 billion.
        These are insufficient for institutional underwriting.
      diligencePath: >-
        Obtain Series B term sheet, any subsequent 409A valuation, most recent board-approved FMV memo, and
        secondary share-transaction pricing from management.
      relatedQuestionRefs:
        - QO008
      relatedTableRefs: []
    - type: enumeration-incomplete
      severity: material
      topic: Leadership and founder table lacks board committee structure and executive equity ownership schedules
      missingEvidence: >-
        Current board committee assignments, governance charter, independent director designations, executive
        compensation-linked equity grants, vesting schedules, and any founder lock-up provisions.
      whyItMatters: >-
        Chapter 1 should anchor governance for later risk and valuation chapters. EnergyX's highly concentrated
        control structure (63.76% Egan voting power) makes governance transparency especially important.
      diligencePath: >-
        Request board charter, committee assignments, investor rights agreement, cap table with equity grants
        and vesting schedules, and any board-approved succession or key-person risk plan.
      relatedQuestionRefs:
        - QO012
      relatedTableRefs:
        - TO002
    - type: enumeration-incomplete
      severity: material
      topic: Stakeholder map cannot resolve full cap table ownership percentages or investor control provisions
      missingEvidence: >-
        Full cap table with precise percentage holdings for each institutional and strategic investor; liquidation
        preference stacks; anti-dilution protections; pro-rata rights; information rights; and any investor
        veto rights.
      whyItMatters: >-
        The public sources identify named investors and round amounts but do not resolve the economic and control
        structure underlying EnergyX's capitalization, which is essential for later valuation and governance chapters.
      diligencePath: >-
        Request the current cap table, investor rights agreement, and side letters from management.
      relatedQuestionRefs: []
      relatedTableRefs:
        - TO003
    - type: missing-source
      severity: material
      topic: No public source discloses a commercial production timeline for any EnergyX project
      missingEvidence: >-
        A dated, engineering-backed schedule showing when EnergyX expects to begin commercial lithium production
        at scale from Project Black Giant, Project Lonestar, or the Smackover Arkansas acreage.
      whyItMatters: >-
        Without a production timeline, the gap between EnergyX's current $1.1M revenue and its multi-billion-dollar
        project potential cannot be assessed. The going-concern concern also depends on how long the company
        needs to remain pre-commercial.
      diligencePath: >-
        Request project development schedules, permitting timelines, offtake framework agreements, and
        construction financing commitments from management.
      relatedQuestionRefs:
        - QO020
        - QO026
      relatedTableRefs:
        - TO004
    - type: missing-source
      severity: minor
      topic: UT Austin technology license terms and scope are not publicly disclosed
      missingEvidence: >-
        The scope, royalty structure, field-of-use restrictions, exclusivity, and sublicensing rights of
        EnergyX's foundational technology agreement with the University of Texas at Austin.
      whyItMatters: >-
        EnergyX's IP foundation rests partly on Dr. Freeman's UT Austin research; the terms of any IP license
        or commercialization agreement affect EnergyX's exclusive access to its core technology.
      diligencePath: >-
        Request the technology license agreement, any sponsored research agreement with UT Austin, and the IP
        ownership schedule from management.
      relatedQuestionRefs:
        - QO021
      relatedTableRefs: []
