      - FO002
  - id: section-leadership
    title: Founders, executive team, and board governance
    body: >-
      Teague Egan, age 37 at the time of the April 2026 offering circular, is the sole named founder and serves
      simultaneously as Chief Executive Officer, President, Chairman of the Board, and the controlling shareholder of
      EnergyX, holding approximately 63.76% of total voting power. Egan holds an MBA in Entrepreneurship from USC Marshall
      and previously made a personal investment in Tesla in 2013; the Netcapital campaign described him as the company's
      "leading investor and shareholder." The current executive bench includes Dr. Amit Patwardhan (CTO, age 52), who
      earned a PhD in Chemical Engineering from Southern Illinois University and previously held senior technology and
      innovation roles at Rio Tinto; Mayank Sharma (CFO and Treasurer, age 46), who joined in June 2023 after roles at
      HSBC and Imperium3; and Simonida Tilton (General Counsel and Secretary, age 39), who joined in August 2023. The
      board of five includes Teague Egan as Chairman, his father Michael Egan (age 86, former Alamo Rent A Car chairman),
      Kris Haber (Vice Chairman, former Lazard Managing Director and Safanad COO), Stefon Crawford (GM Ventures Partner,
      joined December 2022), and Paul Leggett (Mithril Capital Managing Director, joined January 2024). EnergyX does not
      publicly disclose a board committee structure, formal governance charter, or executive equity ownership schedule,
      leaving governance visibility thin relative to the level of outside capital raised.
