  - id: section-projects
    title: Resource projects, financials, and key risks
    body: >-
      EnergyX's four primary resource and commercial projects span the Americas. Project Black Giant, the company's
      flagship lithium-brine project in Chile's Salar de Punta Negra (approximately 100,000 gross acres), targets 52,500
      tonnes per year of lithium carbonate equivalent across two phases. A Preliminary Feasibility Study completed by
      Worley on April 9, 2025 confirmed the project's economic viability at a high level. Project Lonestar operates in
      the Smackover geothermal brine formation in East Texas (approximately 12,500 acres) with a DOE-funded $5 million
      demonstration plant operational as of the mid-2025 semi-annual report, targeting 50,000 tpa. EnergyX acquired the
      Smackover Arkansas lithium acreage (approximately 35,000 gross acres) on October 1, 2025, through the $26 million
      acquisition of Pantera Lithium and Daytona Lithium. A fourth project, "America's Lithium Future," targets up to
      30,000 tpa in partnership with Compass Minerals from lithium recovery at the Great Salt Lake. Combined, the four
      project footprints project more than 150,000 tonnes of potential annual output at full commercial production,
      though all projects remain pre-commercial. EnergyX's FY2025 financial results—$1.1 million in revenue, $20.9
      million net loss, and $73.3 million in cumulative net losses—and the auditor's going-concern doubt paragraph
      underscore that the company is still years from commercial lithium production at meaningful scale. The USGS
      reported that the global average battery-grade lithium carbonate price was approximately $14,000 per metric ton in
      2024, a 66% decline from 2023, creating potential headwinds for new project economics.
