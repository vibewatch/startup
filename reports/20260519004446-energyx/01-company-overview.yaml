callouts:
  - calloutType: strength
    title: GM Ventures, POSCO, and Eni anchor EnergyX's strategic investor tier
    body: >-
      EnergyX's Series B attracted GM Ventures (EV supply chain), POSCO's battery fund, and Eni Next, giving it
      three strategic investors directly embedded in the global battery materials supply chain. The GM Ventures board
      seat provides ongoing monitoring and positions EnergyX within GM's active EV transition program.
    claimRefs:
      - CO023
      - CO029
  - calloutType: risk
    title: Going-concern doubt and $1.1M FY2025 revenue versus $20.9M annual loss signal acute funding pressure
    body: >-
      EnergyX's auditors issued a going-concern doubt paragraph in the FY2025 annual report, citing continued losses and
      limited revenue. The company must continue raising capital through retail offerings or institutional rounds while
      its projects remain years from commercial lithium production. The 66% lithium price decline in 2024 also reduces
      projected project economics.
    claimRefs:
      - CO036
      - CO037
      - CO038
      - CO040
  - calloutType: insight
    title: Retail crowdfunding strategy built a community of 49,000+ investors but concentrated founder control
    body: >-
      EnergyX's use of DealMaker Securities for Regulation A offerings raised over $80M from retail investors, building
      a large grassroots investor base that doubled as a marketing channel. The tradeoff is that Teague Egan retained
      63.76% of voting power, making this effectively a founder-controlled company with thin independent governance checks
      despite significant outside capital.
    claimRefs:
      - CO015
      - CO024
      - CO027
      - CO028
