  - id: section-buyer-segmentation
    title: Buyer, User, and Payer Segmentation
    body: >-
      EnergyX operates a dual-sided market structure where technology licensees (brine operators) and lithium chemical buyers
      (automakers, battery OEMs) each represent distinct revenue pathways with different budget ownership and adoption triggers.
      The primary technology buyer segment comprises incumbent brine-operating lithium producers who control salt flat mineral rights
      and are seeking to improve recovery rates and reduce project timelines. EnergyX's SEC filing names this segment as the core
      target: "most of the Tier 1 lithium producers and lithium exploration and resource companies." Albemarle, which operates brine
      extraction in Chile's Atacama and Nevada and explicitly notes DLE is "not-yet-fully commercialized," represents both a
      potential licensee and a competitive threat if Albemarle commercializes its own internal DLE program. SQM (Sociedad Química
      y Minera de Chile) is the other dominant Atacama brine operator. Oilfield brine operators are an emerging buyer segment: oil
      majors operating the Smackover formation in Arkansas and other U.S. formation brines are actively evaluating lithium
      co-production from produced water, representing a greenfield adoption pathway that avoids evaporation pond economics entirely.
      Geothermal brine operators represent a third brine-source segment: the Salton Sea geothermal area in California's Imperial Valley
      contains significant dissolved lithium in geothermal produced water. SLB (formerly Schlumberger) has positioned itself in
      geothermal solutions and is a plausible oilfield-services channel partner for DLE deployment. The downstream payer segment is
      automakers and battery OEMs. Automakers accounted for 51.14% of global lithium demand in 2025 (Mordor), with automotive CAGR
      projected at 21.73% through 2031. General Motors, which led EnergyX's Series B through GM Ventures, holds offtake rights for
      lithium supply and plans to source 400,000 tons per year of lithium annually by 2035 to support EV production. The EnergyX
      investor portal identifies GM, POSCO (a major Korean steel and battery materials company), and Eni (Italian energy major) as
      strategic investors, reflecting that both technology access and geographic reach into South American brine fields motivate
      corporate buy-in. Government financing entities (DOE Loan Programs, EXIM Bank) are a complementary payer segment, providing
      non-dilutive or low-cost capital to lithium project developers meeting domestic sourcing criteria, particularly under IRA
      Section 30D which creates demand pull for U.S.-sourced battery materials. The adoption path typically runs: brine operator
      secures DLE pilot with EnergyX → validates recovery rate and cost/ton → negotiates technology licensing fee or JV structure →
      scales to commercial production → downstream buyer offtake agreement locks in volume.
