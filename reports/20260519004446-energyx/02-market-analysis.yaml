  - id: section-growth-drivers
    title: Growth Drivers and Adoption Constraints
    body: >-
      The structural drivers for EnergyX's market are among the most durable in the energy transition: electrification mandates
      tightening on a multi-year schedule, battery cost parity already achieved for mainstream vehicle categories, and grid storage
      deployment accelerating globally. Battery cost is the most consequential driver because it simultaneously drives EV adoption
      (expanding lithium demand) and validates the economics of lower-cost DLE supply (expanding the EV total cost of ownership
      advantage). BNEF's November 2023 annual battery price survey found lithium-ion battery packs hit a record low of $139/kWh,
      with Mordor Intelligence reporting LFP pack prices at $108/kWh by 2025, below the total-cost-of-ownership parity threshold
      with internal combustion engines for compact and midsize cars. China's passenger EV market surpassed 10 million units and
      roughly 40% of new registrations in 2025. The EU fleet-average CO2 rule tightened to 93.6 grams per kilometer in 2025,
      effectively requiring at least 20% zero-emission vehicle sales to avoid penalties. California's Advanced Clean Cars II requires
      35% zero-emission vehicle sales by 2026. The IRS clean vehicle tax credit (up to $7,500 under IRC Section 30D) creates demand
      pull for EVs in the U.S. and indirectly creates an urgency premium for domestically processed lithium materials that qualify
      for the IRA's battery component sourcing requirements. Grid-scale storage mandates—specifically four-hour or longer duration
      configurations required in the U.S., EU, and Chinese coastal provinces—represent a growing non-automotive demand vector
      that Mordor Intelligence estimates contributes +4.2% to its CAGR forecast. Against these tailwinds sit material adoption
      constraints. Lithium price volatility is the most acute near-term risk: spot prices swung from approximately $81,500/ton to
      $22,500/ton during 2023 alone, and the 2025 annual average U.S. contract price for battery-grade LiCO3 was $9,000/ton—below
      breakeven for many high-cost projects including DLE pilots not yet at commercial scale. Albemarle publicly acknowledges
      DLE is "not-yet-fully commercialized but potentially revolutionary," confirming that no DLE technology has yet achieved
      sustained commercial-scale throughput at competitive cost. The capital intensity of lithium brine projects is high: project
      finance for a 50,000+ tpa facility requires hundreds of millions in capex, and the permitting regime for Atacama brine
      operations (water use rights, environmental impact assessments) adds multi-year timeline risk. Switching costs from solar
      evaporation to DLE require substantial new capital even when the incumbent producer holds the brine rights, creating an
      adoption inertia. Geopolitical supply concentration—four brine operations in Argentina, two in Chile, nine in China—creates
      policy risk for foreign DLE technology deployment. U.S. tariffs on lithium (3.7% ad valorem for lithium hydroxide and
      carbonate at year-end 2025, per USGS) add marginal cost friction for imports.
