callouts:
  - calloutType: risk
    title: "Lithium Price Collapse Threatens DLE Project Economics"
    body: >-
      Annual average U.S. battery-grade lithium carbonate prices fell to $9,000/ton in 2025, a 31% decline year-over-year and
      nearly 86% below the 2022 peak. At these price levels, many DLE projects—requiring substantial upfront capex and operating
      cost per ton—are sub-economic without a price recovery assumption. This is EnergyX's single largest market-driven risk:
      its crowdfunded valuation of $3.26 billion pre-money implies a revenue multiple that only makes sense if prices recover
      to $20,000+/ton or if technology licensing fee income is substantial and relatively price-insensitive.
    claimRefs:
      - CM030
      - CM014
      - CM044

  - calloutType: insight
    title: "DLE Has No Standalone Market Size — Sizing Gap Creates Valuation Risk"
    body: >-
      No independent market research firm has published a peer-reviewed standalone DLE technology licensing market size. All
      major analyst reports (Mordor, Grand View, BNEF) treat DLE as a sub-driver rather than a separate market. This means
      EnergyX's investors cannot independently verify the TAM claim implied by the company's $3.26 billion pre-money valuation.
      A dedicated DLE licensing market study—analogous to what exists for carbon capture technology licensing—is a diligence priority.
    claimRefs:
      - CM035
      - CM044

  - calloutType: assumption
    title: "30-60% Brine Share Applied to Derive SAM"
    body: >-
      The SAM estimate for brine-addressable lithium is derived by applying EnergyX's own cited figure (30-60% of world lithium
      from brine sources) to the Mordor Intelligence 2025 base of 1.54 million LCE tons, yielding an estimated 462,000-924,000
      LCE tons. This is an agent-derived calculation, not a publisher-reported SAM figure. The 30-60% share figure appears in
      EnergyX's SEC 1-K filing but is not attributed to an independent source within that filing.
    claimRefs:
      - CM016
      - CM003

