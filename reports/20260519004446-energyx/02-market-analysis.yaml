  - id: section-diligence-gaps
    title: Sizing and Adoption Diligence Gaps
    body: >-
      Several critical sizing and adoption diligence gaps remain unresolved and bear directly on EnergyX's valuation and investor
      risk assessment. First, there is no independent, peer-reviewed market sizing study of the DLE technology licensing sub-market;
      all available estimates embed DLE as a sub-driver within broader lithium market forecasts rather than sizing the licensing
      fee market separately. Without this, EnergyX's SAM for technology licensing cannot be independently verified. Second, the
      spread between analyst forecasts is material: Grand View Research's $96.45 billion market by 2033 versus Mordor Intelligence's
      volume-based forecast implying roughly $40-44 billion at current depressed prices represents a near-2.5x discrepancy. This
      gap has not been reconciled and depends entirely on price scenario assumptions that are themselves highly uncertain given the
      $81,500/ton to $9,000/ton price collapse observed between 2022 and 2025. Third, EnergyX's investor materials cite a pre-money
      implied valuation of $3.26 billion derived solely from the Reg A offering share price, without an independent institutional
      appraisal or comparable transaction analysis; at $9,000/ton LiCO3 spot prices, backing into a revenue multiple for the
      eventual project yield is highly sensitive to price recovery assumptions. Fourth, DLE's commercial deployment status is
      unverified at scale: EnergyX claims 98% real-world pilot recovery, but no third-party independent audit of pilot throughput,
      uptime, or cost per ton has been made public. Albemarle's acknowledgment that DLE remains pre-commercial confirms the
      technology is not yet de-risked across the industry. Fifth, the adoption trigger timeline for oilfield brine and geothermal
      brine buyer segments is unclear: while Exxon has acquired Smackover brine rights and SLB provides geothermal infrastructure,
      the commercial pathway and timeline for large-scale U.S. brine lithium output remains unquantified. These gaps are partially
      mitigated by EnergyX's strategic investors (GM, POSCO, Eni) who provide non-public due diligence signals, but they remain
      open for independent diligence purposes.
    claimRefs:
      - CM035
