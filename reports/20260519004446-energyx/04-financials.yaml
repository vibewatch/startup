callouts:
  - calloutType: risk
    title: Cash Runway Expires at Report Date
    body: >-
      Management's FY2025 1-K states cash is sufficient only "through the end of Q2 2026,"
      which coincides with the May 2026 runDate of this report. With $8.6 million in cash
      against ~$1.7 million per month in implied burn, EnergyX requires material new
      capital within weeks to avoid operational disruption, regardless of the outcome
      of ongoing Reg A sales.
    claimRefs:
      - CI023
      - CI024
      - CI025

  - calloutType: risk
    title: Dual Going-Concern Audits Signal Structural Funding Dependency
    body: >-
      Independent auditors issued going-concern qualifications in both the FY2024 and FY2025
      audit reports, the second consecutive year of such qualification. This is unusual for a
      company with $151 million in cumulative capital raised and signals that existing
      sources cannot guarantee continuity without perpetual equity issuance.
    claimRefs:
      - CI034
      - CI035

  - calloutType: insight
    title: GEM PIPE Is a Mirage Until IPO
    body: >-
      The $450 million GEM Global Yield PIPE is often cited as a financial backstop, but
      it is entirely contingent on a public-market listing event. The CEO has stated EnergyX
      needs "at least one more major institutional round" (Series C) and substantial positive
      EBITDA before going public. As a result, the GEM PIPE provides no near-term liquidity
      protection and should not be counted in any near-term capital-adequacy analysis.
    claimRefs:
      - CI010
      - CI042

