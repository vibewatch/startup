  - id: financing-scenarios
    title: Financing Needs and Forward Scenarios
    body: >-
      With cash runway through Q2 2026 and annual operating losses of approximately
      $21 million, EnergyX must raise material new capital within weeks of the May 2026
      runDate. The current Regulation A offering (5 million shares at $11.00 per share,
      up to $55 million aggregate) was approximately 31% subscribed as of April 1, 2026
      (~1.56 million shares × $11 = ~$17.1 million), suggesting several months of
      additional runway if the offering continues at its historical pace. The CEO has
      stated publicly that at least one more major institutional round (a "Series C") is
      required before a public listing or IPO. The GEM Global Yield PIPE of $450 million
      is contingent on a public offering and not available as an emergency bridge facility.
      Four plausible scenarios govern EnergyX's 12-24 month capital outlook. In the base
      case, the Regulation A offering closes fully (~$55 million gross) and a Series C
      of $50-100 million institutional round closes by late 2026 or early 2027, providing
      two or more years of runway and enabling first construction drawdown for Black Giant
      under the EXIM framework. In a downside scenario, the Reg A raises only $20-30
      million and no institutional round closes, forcing another Reg A bridge, delayed
      capital expenditure, and potential operational contraction. In an upside scenario,
      an accelerated Series C of over $100 million or a strategic acquisition offer from
      a major oil and gas company (mentioned by Egan as a possible outcome) provides a
      materially de-risked path. The dilution trajectory is already substantial: the
      2-for-1 stock split, the Pantera equity consideration (2.34 million new shares),
      the current Reg A offering (up to 5 million shares), a 1.5% GEM warrant at IPO,
      and a significant unvested employee equity pool all compound per-share dilution
      meaningfully. From a financial-verdict standpoint, EnergyX's capital structure is
      high-risk, highly dilutive, and entirely dependent on non-recurring retail capital
      raises and a conditional institutional PIPE. Commercial-scale project economics
      remain opaque, and the unit-economics case rests on management projections rather
      than audited production cost data.
    claimRefs:
      - CI041
      - CI042
      - CI043
      - CI044
      - CI045
      - CI046
    tableRefs:
      - TI006
    figureRefs:
      - FI004

