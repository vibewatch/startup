  - id: financial-quality
    title: Financial Quality, Audit Issues, and Governance Exposures
    body: >-
      EnergyX's financial quality profile contains several material concerns. First,
      independent auditors included going-concern doubt paragraphs in the audit reports
      for both FY2024 and FY2025, citing "limited cash reserves, working capital deficit,
      accumulated deficit … and ongoing dependence on equity and debt financing." This
      dual-year going-concern status is an adverse signal that institutional lenders and
      equity underwriters typically flag. Second, in March 2025 EnergyX filed a Form 1-U
      disclosing that its FY2023 audited financial statements should no longer be relied
      upon due to an accounting methodology change: management decided to capitalize Reg A
      fundraising solicitation costs in 2023 (consistent with its FY2024 treatment) rather
      than expense them, requiring a restatement. The impact was not material enough to
      requalify the filing for SEC comment, but it undermines period-to-period comparability.
      Third, the FY2025 offering circular discloses that investors who purchased shares
      between September 27 and October 3, 2024 may hold statutory rescission rights, creating
      a contingent liability whose magnitude is not quantified in any filed document. Fourth,
      Teague Egan (CEO) and Michael Egan entered into $1 million convertible promissory notes
      each in September 2022, originally due and payable after December 31, 2024; neither the
      FY2025 1-K nor the offering circular discloses conversion or repayment status,
      representing an undisclosed related-party obligation. Fifth, the CEO's subscription
      agreement proxy provision grants the CEO broad authority over investor votes, and the
      CEO retains approximately 47% of shares on a fully diluted basis, creating a structural
      governance concentration that limits minority investor recourse. Revenue recognition is
      straightforward for the current small-scale business (testing services recognized on
      completion; equipment sales on delivery with standard warranty terms), but the move
      to large-scale TaaS or project-level revenue will require new recognition frameworks
      that have not yet been disclosed.
    claimRefs:
