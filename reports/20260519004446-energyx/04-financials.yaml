  - id: capital-formation
    title: Historical Capital Formation and Capital Stack
    body: >-
      EnergyX has assembled approximately $151 million in total financing through
      December 31, 2025, before offering costs and commissions, through an unusual blend of
      institutional equity, strategic corporate investment, and retail crowdfunding. The
      company began with founder capital and early Regulation CF offerings on Netcapital in
      2021, then completed a Series A and convertible notes before raising a $15 million
      Series B in December 2022 led by GM Ventures; subsequent Series B joinder agreements
      added approximately $8.5 million from Elohim-SW Energy Fund (POSCO affiliate) and
      $8.0 million from IMM Battery Fund III in mid-2023. Over $73.7 million came from a
      2023-2024 Regulation A+ campaign at prices escalating from $8.00 to $9.50 per share.
      In July 2025, EnergyX launched a new Regulation A offering at $10.00 per share
      (2.7 million shares plus 200,000 bonus shares, exhausted by October 2025); it
      raised approximately $17.6 million in gross proceeds by year-end at $10.00 and an
      additional $1.4 million after a price increase to $11.00 per share in October 2025,
      for a combined $19.0 million in 2025. The April 2026 offering circular extended
      the offering to 5 million shares at $11.00 per share for up to $55 million, with
      approximately 1.56 million shares sold as of April 1, 2026. The capital stack
      carries no drawn debt: the company reports no interest expense in either FY2024 or
      FY2025. However, the GEM Global Yield Share Purchase Agreement—signed April 2022—
      provides up to $450 million in PIPE financing, exercisable only upon a public-market
      listing (IPO, SPAC, or equivalent), and grants GEM a warrant to purchase 1.5% of all
      shares outstanding at the public-offering price. A 2-for-1 forward stock split
      effected on March 21, 2025 doubled outstanding share counts, and as of December 31,
      2025, common shares outstanding stood at 114.9 million. KingsCrowd calculated a
      pre-money implied valuation of approximately $1.145 billion at $9.50/share for the
      December 2024 Reg CF close; the investor portal currently states an implied valuation
      of approximately $3.26 billion based on total shares outstanding multiplied by the
      $11.00 offering price, though neither figure reflects a negotiated institutional
      post-money valuation.
