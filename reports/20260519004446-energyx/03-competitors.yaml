  - id: win-loss
    title: "Market Structure, Win/Loss Factors, and Evidence Gaps"
    body: |
      The DLE market in 2026 is fragmented and pre-revenue, with five or more credible technology
      developers plus oil-major entrants all competing for a limited pool of near-term brine project
      opportunities. The absence of any commercial DLE production means competition is currently won
      and lost on: (1) quality of pilot data and demonstration duration, (2) offtake and partner
      credibility, (3) engineering completion milestones (FEED, FEL-3), (4) regulatory and
      environmental permit progress, and (5) capital access. On all five dimensions, EnergyX's
      publicly disclosed position lags Standard Lithium and Lilac Solutions as of May 2026. EnergyX
      has not disclosed binding offtake agreements, FEL-3 engineering completion, a continuous
      multi-year pilot dataset, or environmental permit approvals comparable to those of its two
      leading peers. This gap is not evidence of fundamental technology failure — it may reflect
      EnergyX's earlier-stage development timeline or a deliberate project sequencing choice — but
      it is a material unresolved question for competitive diligence.

      Win conditions for EnergyX: securing a strategic brine project partnership (similar to
      Standard Lithium's Equinor tie-up or Lilac's Traxys relationship), demonstrating multi-year
      continuous pilot performance at or above peer benchmarks, and converting its OEM relationships
      into exclusive or volume-committed supply agreements. Loss conditions: if Lilac achieves first
      commercial production at Great Salt Lake in 2027 as targeted, or Standard Lithium commissions
      the SWA Project in 2029, EnergyX's first-mover option in North American DLE narrows
      significantly. The Smackover Formation is the most advanced DLE brine basin in the US, and
      both Standard Lithium and ExxonMobil are already occupying it.

      Evidence still missing to complete competitive diligence: EnergyX's brine pilot operating hours
      and cycle data; comparative CAPEX and OPEX per tonne LCE estimates from independent engineering
      firms; EnergyX's patent portfolio breadth and freedom-to-operate analysis; and confirmation of
      whether EnergyX's GM and Samsung partnerships include any volume commitments or capital
      co-investment beyond technology validation.
    claimRefs:
      - CP040
    tableRefs: []
    figureRefs: []

