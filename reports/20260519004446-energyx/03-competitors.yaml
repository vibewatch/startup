callouts:
  - calloutType: risk
    title: "Commercial Execution Gap: EnergyX Lags Peers on Key Milestones"
    body: >-
      As of May 2026, EnergyX has not disclosed binding offtake agreements, completion of FEL-3
      or FEED engineering, a multi-year continuous pilot dataset at peer scale, or regulatory permit
      approvals comparable to Lilac Solutions (FEL-3 done, 2027 production target) or Standard
      Lithium (6-year demo, FID targeted 2026). This lag does not confirm technology inferiority,
      but it raises material questions about commercialisation timeline and competitive position as
      Lilac approaches construction-readiness.
    claimRefs:
      - CP030
      - CP034
      - CP040

  - calloutType: insight
    title: "DLE Triangle Controversy"
    body: >-
      ExSorbtion's public critique of the DLE industry — that most technologies fail to meet
      all three requirements of long sorbent life (>500 cycles), fast adsorption (<5 min), and
      high selectivity simultaneously — is an adversarial data point. If valid, it challenges the
      commercial feasibility claims of all pre-commercial DLE players including EnergyX. The
      claim remains unverified by independent testing but underscores the systemic risk that
      none of the DLE technologies have been proven at full commercial scale.
    claimRefs:
      - CP019
      - CP021
      - CP039

  - calloutType: strength
    title: "Standard Lithium's Data Moat Is the Highest Competitive Bar"
    body: >-
      Standard Lithium's six-year continuous demonstration plant record — 1 million barrels of
      real brine processed, 15,000 DLE cycles, zero safety incidents — constitutes the most
      credible engineering evidence base in the North American DLE space. Project lenders and
      brine resource owners are likely to require demonstrated process reliability at this level
      before committing project capital, making SLI's data set a genuine procurement barrier.
    claimRefs:
      - CP011
      - CP035

  - calloutType: assumption
    title: "EnergyX Technology Validation Assumed from Partnership Signals"
    body: >-
      EnergyX's GM and Samsung SDI partnerships are treated as technology validation proxies in
      the absence of published pilot performance data. This analysis assumes those partnerships
      involved some degree of technical due diligence, but cannot confirm the depth or exclusivity
      of the relationships from public disclosures.
    claimRefs:
      - CP033
      - CP044

