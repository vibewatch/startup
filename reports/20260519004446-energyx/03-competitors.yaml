  - id: incumbents-adjacents
    title: "Incumbent Producers and Adjacent Substitutes"
    body: |
      The dominant lithium supply alternatives to DLE are solar evaporation brine extraction and
      hard-rock (spodumene) mining, both commercially proven at scale. SQM (Sociedad Química y Minera
      de Chile) operates the world's most cost-competitive lithium production from the Atacama Desert
      using vast solar evaporation ponds with brine grades exceeding 1,500 mg/L lithium — roughly
      20x the grade Lilac targets at the Great Salt Lake. SQM's multi-year production cycles and
      established infrastructure create high fixed-asset barriers to displacement. Albemarle, the
      world's largest lithium producer, operates brine and hard-rock extraction across the US, Chile,
      and Australia. The USGS 2026 Mineral Commodity Summaries confirm that solar evaporation and
      spodumene mining are the dominant global supply routes. Market intelligence from MarketsandMarkets
      identifies SQM, Livent (Arcadium), Albemarle, Tianqi, and Ganfeng as the incumbent leaders in
      lithium compounds, controlling significant global capacity with established offtake relationships.

      Two oil majors have entered the DLE space as potential adjacent players rather than pure
      incumbents. ExxonMobil announced a DLE pilot test facility in Arkansas in 2023 targeting the
      Smackover Formation — the same formation Standard Lithium has been developing for six years —
      and has publicly stated ambitions to become the largest US lithium producer by 2030. The
      convergence of ExxonMobil and Standard Lithium on the Smackover creates geographic resource
      competition that could affect brine lease access for new DLE entrants including EnergyX if it
      targets Arkansas brines. Rio Tinto entered the lithium market by acquiring Rincon Mining's
      Argentina salar project, providing incumbent scale in a different geography.

      Lithium Americas represents the hard-rock alternative, developing the Thacker Pass project in
      Nevada as a domestic US hard-rock lithium source. While hard-rock mining has higher energy cost
      than brine extraction at equivalent grade, it benefits from known capital cost structures and
      established permitting pathways. IEA's Global Critical Minerals Outlook recognises DLE as a key
      enabling technology for unlocking additional brine resources beyond evaporite deposits, implying
      that DLE and evaporation routes will coexist rather than DLE fully displacing incumbents.
