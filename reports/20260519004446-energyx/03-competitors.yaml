company:
  name: Energy Exploration Technologies, Inc. (EnergyX)

chapter:
  number: 3
  title: "Competitive Landscape"
  summary: >-
    The DLE technology market in 2026 is a pre-commercial race among four technology families — ion exchange
    (Lilac Solutions), adsorption/SiFT (Standard Lithium), sorbent adsorption (ExSorbtion), and
    membrane/selective extraction (EnergyX) — against incumbents using century-old solar evaporation
    and hard-rock mining. No DLE player has achieved commercial-scale production; Standard Lithium leads
    on demonstration maturity (6-year demo, 15,000 DLE cycles) while Lilac leads on commercial structuring
    (FEL-3 complete, binding offtake). EnergyX's GM and Samsung SDI partnerships signal technical
    validation but disclosed milestones lag those of its closest peers.

sections:
  - id: dle-peers
    title: "Direct DLE Technology Peers"
    body: |
      The direct DLE peer set comprises four technology firms: Lilac Solutions, Standard Lithium,
      ExSorbtion, and SLB. Each pursues a distinct extraction chemistry. Lilac Solutions employs
      proprietary ion exchange (IX) technology, now at its fifth-generation iteration unveiled in
      October 2025. Lilac's Great Salt Lake facility — targeting 5,000 tpa Phase 1 and 20,000 tpa
      Phase 2 — achieved 87% lithium recovery from a 70 mg/L ultra-low-grade brine during 2025 pilot
      operations, and in January 2026 the company secured a binding 10-year offtake agreement with
      Traxys for 50,000 tonnes total. FEL-3 engineering is complete and permitting is in progress,
      with first production targeted for 2027. Manufacturing of IX media is anchored in Fernley, Nevada,
      supporting domestic supply chain goals. Lilac's commercial model is a licensing-and-supply
      structure — it sells IX media and engineering services rather than developing projects directly.

      Standard Lithium (NYSE:SLI) pursues a DLE process partnered with Aquatech (formerly Koch
      Technology Solutions) for brine extraction and its proprietary SiFT fractional crystallisation
      process for battery-grade lithium carbonate (>99.9% purity). The Arkansas demonstration plant
      has operated continuously for six years, processing over 1 million barrels of Smackover brine
      and completing over 15,000 DLE cycles — the most extensive public demonstration record among
      North American DLE peers. The South West Arkansas (SWA) Project, developed in partnership with
      Equinor, targets 22,500 tpa Phase 1. In Q1 2026 Standard Lithium signed a binding 10-year
      offtake with Trafigura for 8,000 tpa, and the company holds $141 million cash with no debt.
      FID and construction start are targeted for 2026, with first commercial production in 2029.

      ExSorbtion (operating via internationalbatterymetal.com before redirecting to exsorbtion.com)
      is an early-stage adsorption DLE company claiming sorbent longevity of >500 cycles, <5-minute
      reaction time, and 90% lithium recovery — its so-called "DLE triangle" requirements. It received
      a $1.8 million DOE contract for commercialisation acceleration. ExSorbtion directly criticises
      competing DLE technologies for failing to meet all three triangle criteria simultaneously, citing
      the prohibitive sorbent replacement cost if cycle life is inadequate. It claims its process
      produces lithium carbonate directly rather than the lower-value lithium chloride produced by
      most competing DLE routes.

      SLB (formerly Schlumberger) offers integrated DLE services as part of its geothermal and brine
      solutions division, positioning it as a potential supplier to brine project developers rather
      than a standalone DLE developer. Its scale and oilfield services infrastructure give it potential
      advantage as DLE projects require drilling and brine management expertise.
