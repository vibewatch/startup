  headline: >-
    EnergyX holds genuine DLE technology optionality and strategic-investor validation, but a $3.26 billion
    management-set implied valuation unsupported by commercial revenue, independent appraisal, or institutional
    follow-on keeps the stance at TRACK with LOW confidence and HIGH risk.
