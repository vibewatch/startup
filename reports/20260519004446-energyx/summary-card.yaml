  topStrengths:
    - >-
      GET-Lit™ DLE membrane technology has 140+ patents and UT Austin academic IP roots, with GM Ventures, POSCO's IMM
      Battery Fund, and Eni Next as strategic validators in the EV supply chain.
    - >-
      Completed Worley pre-feasibility study for Project Black Giant (Chile, April 2025) and a signed EXIM Bank LOI for
      up to $690 million in conditional project financing demonstrate tangible de-risking milestones.
    - >-
      Modular, high-salinity-capable DLE system combining electrodialysis membranes, solvent extraction, and ion
      adsorption addresses weaknesses in competing DLE approaches and differentiates EnergyX from pure-play project
      developers.
    - >-
      Large, loyal retail investor community (49,000+ investors, $177.9 million raised in aggregate including ongoing
      offering) provides a unique grassroots capital base and brand awareness in the DLE space.
  topRisks:
    - >-
      $3.26 billion pre-money implied valuation is entirely management-set via retail offering price; no independent
      appraisal exists, no institutional investor has followed on above the $4.00/share Series B price, and FY2025
      revenue was only $1.1 million.
    - >-
      Cash fell to $8.6 million at year-end 2025 with management disclosing runway only through Q2 2026 absent new
      capital; consecutive going-concern audit qualifications make financing timing existential.
    - >-
      Commercial-scale DLE deployment has not been demonstrated; all downstream milestones—licensing contracts, project
      financing, lithium production revenue—are conditional on a proof-of-scale step not yet achieved.
    - >-
      No binding DLE technology licensing contract with disclosed economics exists; Series C institutional round has not
      been announced; and the EXIM Bank LOI requires a public-market listing or equivalent project approval that has not
      occurred.
    - >-
      Founder-concentrated governance (Teague Egan controls 63.76% of voting power as sole founder, CEO, Chairman, and
      President) combined with limited board independence and undisclosed committee charters adds governance risk.
  unresolvedGaps:
    - >-
      Independent third-party valuation or institutional Series C term sheet providing arms-length price discovery for
      EnergyX shares.
    - Signed, binding DLE technology licensing contract with disclosed counterparty, economics, and milestone schedule.
    - Commercial-scale GET-Lit™ deployment result and independently validated project economics for Project Black Giant.
    - >-
      Confirmed EXIM Bank project financing drawdown or equivalent project capital securing the path to first commercial
      production.
    - >-
      Disclosed cap table beyond Series B and retail holdings, including full dilution schedule and any existing Series
      C pipeline.
