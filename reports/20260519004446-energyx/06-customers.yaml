  claims:
    - id: CU001
      statement: >-
        EnergyX's primary target customers are lithium brine resource owners and producers, including
        companies with deposits in the Lithium Triangle (Chile, Argentina, Bolivia) and U.S. formations
        such as the Smackover and Clayton Valley, with a stated goal of reaching hundreds of global
        brine-deposit operations within a five-year horizon.
      type: company-claimed
      topic: customer-profile
      sourceRefs:
        - SU014
        - SU029
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QU008
        - QU018
        - QU021

    - id: CU002
      statement: >-
        EnergyX's addressable customer base also includes automotive OEMs seeking domestic IRA-compliant
        lithium supply and geothermal brine operators who could extract co-produced lithium using DLE
        technology.
      type: company-claimed
      topic: customer-profile
      sourceRefs:
        - SU014
        - SU026
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QU008

    - id: CU003
      statement: >-
        EnergyX offers three commercial revenue pathways: (1) lithium offtake from EnergyX's own
        production, (2) technology licensing to third-party brine producers, and (3) consumable membrane
        sales to licensees.
      type: company-claimed
      topic: business-model
      sourceRefs:
        - SU014
        - SU018
      confidence: high
      freshness: current

    - id: CU004
      statement: >-
        EnergyX's technology licensing model would generate recurring revenue from consumable LiTAS
        membrane replacements on an estimated 2–3 year service life cycle, creating a
        subscription-like revenue stream the company calls "Technology-as-a-Service."
      type: company-claimed
      topic: business-model
      sourceRefs:
        - SU014
        - SU018
      confidence: medium
      freshness: current

    - id: CU006
      statement: >-
        Lithium was formally classified as a U.S. critical mineral by the Federal Register in February
        2022, elevating strategic urgency for domestic supply chains and increasing buyer motivation for
        DLE technology adoption.
      type: observed
      topic: regulatory-context
      sourceRefs:
        - SU010
        - SU028
      confidence: high
      freshness: historical
      answersQuestionRefs:
        - QU023

    - id: CU007
      statement: >-
