artifact: customers
slug: energyx
runDate: "2026-05-19"
company:
  name: Energy Exploration Technologies, Inc. (EnergyX)

chapter:
  number: 6
  title: Customers
  summary: >-
    EnergyX remains fully pre-commercial with no named paying customers as of June 30, 2025.
    Revenue consists solely of brine testing fees ($39K in H1 2025, down 84% from H1 2024's
    $245K) and a single anonymous $1.3M equipment order with $730,748 in deferred revenue still
    unrecognized at period-end. Strategic investors GM Ventures, POSCO, and Eni Next represent
    potential future customers but have not executed any commercial contracts. Long sales cycles,
    undisclosed customer identities, and extreme concentration risk are material diligence concerns.

sections:
  - id: customer-profile-icp
    title: Customer Profile and Ideal Customer
    body: >-
      EnergyX's stated target market is lithium brine resource owners and producers — companies that
      control salt-flat brine deposits in the Lithium Triangle (Chile, Argentina, Bolivia) or domestic
      U.S. formations such as the Smackover and Clayton Valley. Secondary segments include geothermal
      brine operators who could extract co-produced lithium, and automotive OEMs seeking to secure
      U.S.-sourced battery-grade lithium to meet Inflation Reduction Act critical-mineral content
      requirements. The company's 2026 offering circular describes three distinct commercial pathways:
      (1) direct lithium offtake from EnergyX's own production operations, (2) technology licensing to
      producers who want to deploy LiTAS membranes on their own deposits, and (3) consumable membrane
      sales to licensed operators on a recurring replacement cycle. Each pathway targets a different
      buyer persona — offtake buyers are downstream battery manufacturers or OEMs; licensing buyers are
      upstream producers; consumable buyers are existing licensees.

      Lithium was designated a U.S. critical mineral by the Federal Register in February 2022, elevating
      strategic urgency for domestic supply chains. Automotive OEMs face IRA incentives to source lithium
      from Free Trade Agreement partners or domestic production, making EnergyX's Smackover-based output
      an attractive supply option for GM and other domestic assemblers. The addressable global market
      spans hundreds of known brine deposits across South America, North America, Asia, and Europe, though
      EnergyX is presently focusing on North American formations as its initial reference market.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU006
      - CU007
    tableRefs:
      - TU002
    figureRefs:
      - FU004

  - id: commercial-traction-revenue
    title: Commercial Traction and Revenue Evidence
    body: >-
      EnergyX's only historical revenue streams are customer brine testing fees and a single equipment
      order placed in February 2025. Customer Testing Income was first tracked as a separate line item
      in Q2 2023, with $34,750 recognized for H1 2023. This grew to $245,000 in H1 2024 — a 605% jump
      that suggested accelerating pipeline activity — but then fell sharply to $39,000 in H1 2025, an
      84% year-over-year decline. Management has not publicly explained the contraction; it may reflect
      a natural portfolio shift from small testing contracts to the larger equipment deal, but it could
      equally indicate a cooling of brine-owner interest.

      The February 2025 sales order for $1.3 million — covering a custom bipolar electrodialysis
      demonstration system for an unnamed customer — is EnergyX's first product-revenue contract of
      material size. As of June 30, 2025, $730,748 of that order remained in deferred revenue pending
      completion of performance obligations; by December 31, 2025, FY2025 full-year customer advance
      payments totaled $770,748 with an additional $386,379 in unbilled revenue representing work
      completed but not yet invoiced. No second equipment order has been announced. The company
      explicitly confirmed in its H1 2025 semiannual filing that it had no commercial operations and had
      not generated material revenues from licensing or product sales as of June 30, 2025.
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
      - CU017
      - CU018
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: strategic-investor-relationships
    title: Strategic Investor Relationships and Potential First Customers
    body: >-
      EnergyX's most credible near-term customer prospects are its strategic investors. GM Ventures led
      the December 2022 Series B round and Stefon Crawford (a GM Ventures Partner) joined the EnergyX
      Board of Directors. TechCrunch reported in October 2024 that EnergyX plans to sell DLE equipment
      to POSCO and ExxonMobil, framing these relationships as commercial-intent partnerships rather than
      purely financial investments.

      POSCO, the South Korean steel and battery-materials giant, participated in EnergyX's June 2023
      Series B joinder through IMM Battery Fund III for approximately $8 million. POSCO operates its own
      DLE program and has deployed DLE technology at its operations in Chile; this dual role as both
      investor and potential competitor complicates the likelihood of a licensing contract. Eni Next
      invested approximately $8.5 million through Elohim-SW Energy Fund in the same joinder.

      Despite these relationships, no binding commercial contract with GM, POSCO, Eni, or ExxonMobil has
      been publicly disclosed as of May 2026. ExxonMobil is independently developing DLE operations at the
      same Smackover Formation, creating a structural conflict between EnergyX's ambition to license
      technology to Exxon and EnergyX's own planned production at Project Black Giant. All three strategic
      investors remain equity holders only, and their conversion to commercial customers is not guaranteed.
    claimRefs:
      - CU019
      - CU020
      - CU021
      - CU022
      - CU023
      - CU024
      - CU025
    tableRefs:
      - TU003

  - id: go-to-market-channels
    title: Sales Model and Channel Structure
    body: >-
      EnergyX relies entirely on direct sales relationships; no channel partners, system integrators,
      or resellers have been disclosed as of the 2026 offering circular. Worley, the global engineering
      firm, was engaged to perform the Preliminary Feasibility Study for Project Black Giant and functions
      as an EPC (engineering, procurement, and construction) partner. Worley's network among large
      mineral and energy operators could serve as a relationship bridge to prospective licensing customers,
      though this is speculative rather than a formal channel arrangement.

      The US EXIM Bank LOI for $690 million in project financing — while significant for EnergyX's own
      capital needs — is project financing for EnergyX's production facilities, not a customer demand
      signal. The TexAmericas Center facility in Texarkana is being positioned as a proof-of-concept
      production plant intended to validate DLE technology for prospective licensing customers before they
      commit to commercial-scale deployments. The three-tier revenue model (offtake, licensing, consumables)
      provides commercial optionality but introduces organizational complexity: each model requires a
      distinct sales motion, customer profile, and relationship structure. No single model has been
      validated by a paying customer at commercial scale.
    claimRefs:
      - CU026
      - CU027
      - CU028
      - CU029
      - CU030
      - CU031
    tableRefs:
      - TU004

  - id: pipeline-engagement-signals
    title: Pipeline and Demand Signals
    body: >-
      Beyond the disclosed brine testing program and the single equipment order, EnergyX has cited
      "deployment of pilot plants with key customers" as a planned expenditure driver in its 2025 offering
      circular. This language implies active negotiations with multiple customers, though no names, timelines,
      or financial commitments are disclosed. EnergyX's $5 million DOE grant validates the technology from
      a federal-government perspective, but it is not a customer relationship and does not de-risk commercial
      adoption. The US EXIM Bank LOI similarly represents project financing support, not customer demand.

      Compass Minerals, a major North American mineral producer with brine operations in the Great Salt Lake
      region, has been mentioned in EnergyX's investor communications as a prospective partner, but no
      executed agreement or press release from Compass Minerals confirms any partnership as of May 2026.
      In the competitive landscape, Lilac Solutions signed a binding 10-year offtake agreement with Traxys
      and Standard Lithium achieved major operational milestones at its Arkansas demonstration plant in May
      2026, setting a higher commercial bar for EnergyX's pipeline development.
    claimRefs:
      - CU032
      - CU033
      - CU034
      - CU035
      - CU036
      - CU037
    tableRefs:
      - TU005

  - id: concentration-retention-risk
    title: Customer Concentration and Retention Risk
    body: >-
      EnergyX's customer base as of mid-2025 consists of an undisclosed number of anonymous brine testing
      clients plus one unnamed equipment order customer. The equipment buyer accounts for 100% of EnergyX's
      product revenue, creating extreme customer concentration. Brine testing contracts are discrete and
      non-recurring; they generate no subscription, retainer, or renewal revenue, and each contract must
      be individually sourced and closed.

      Net revenue retention is not calculable or meaningful at EnergyX's current stage — there are no
      recurring customers with known renewal histories. The 84% year-over-year decline in testing income
      from H1 2024 to H1 2025 is an early warning signal. Long sales cycles are an acknowledged challenge;
      TechCrunch cited this explicitly in its October 2024 profile, noting that infrastructure-scale mining
      technology contracts routinely take 2–5 years to close. Strategic investor relationships with GM and
      POSCO, while validating, also introduce potential conflicts of interest if those partners' own internal
      DLE programs compete with EnergyX's licensing business. International Battery Metal Ltd (IBAT) and
      other DLE competitors are actively targeting the same Lithium Triangle customer base, intensifying
      competition for early commercial contracts.
    claimRefs:
      - CU038
      - CU039
      - CU040
      - CU041
      - CU042
      - CU043
    figureRefs:
      - FU002
      - FU003

