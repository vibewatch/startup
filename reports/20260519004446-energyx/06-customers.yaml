callouts:
  - calloutType: strength
    title: Strategic-Investor Validation Anchors Near-Term Customer Pipeline
    body: >-
      Equity participation by GM Ventures, POSCO, and Eni Next — three of the world's largest lithium
      demand-side actors — provides credible market validation and a warm-introduction path to commercial
      contracts. Board-level representation by Stefon Crawford (GM Ventures Partner) embeds EnergyX in
      GM's technology decision-making process, increasing the probability of an offtake agreement once
      Black Giant achieves production milestones.
    claimRefs:
      - CU019
      - CU020
      - CU021

  - calloutType: risk
    title: No Named Paying Customers — Extreme Concentration at Pre-Commercial Stage
    body: >-
      As of June 30, 2025, EnergyX has zero named paying customers and a single anonymous equipment
      buyer representing 100% of its product revenue. The 84% year-over-year decline in brine testing
      income from H1 2024 to H1 2025 is an adverse signal. Undisclosed customer identities prevent
      independent verification of pipeline quality, and long mining-sector sales cycles (2–5 years)
      mean commercial revenue at scale remains years away.
    claimRefs:
      - CU009
      - CU010
      - CU016
      - CU038
      - CU041

  - calloutType: insight
    title: The $1.3M Equipment Order Signals a Pivot Toward Product Revenue
    body: >-
      The February 2025 bipolar electrodialysis demo system order is EnergyX's first significant
      product-revenue contract and represents a strategic inflection from testing-fee services to
      equipment-first commercialization. If the demo system performs well for the anonymous customer,
      it could serve as EnergyX's first public reference case, catalyzing named licensing discussions.
    claimRefs:
      - CU013
      - CU017
      - CU032

  - calloutType: risk
    title: Competitor Customer Progress Creates Urgency Risk
    body: >-
      Lilac Solutions has already secured a binding 10-year offtake agreement and Standard Lithium
      achieved demonstration milestones in May 2026. These competitive advances reduce EnergyX's
      window for capturing first-mover licensing relationships with Tier-1 brine producers.
    claimRefs:
      - CU035
      - CU036
      - CU043

