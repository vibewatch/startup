  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: customer-identity
      missingEvidence: >-
        Identities of all brine testing clients and the anonymous $1.3M equipment order customer are
        withheld under NDA; independent verification of contract terms, customer size, or commercial
        intent is impossible from public sources.
      whyItMatters: >-
        Without named customers, investors cannot independently assess pipeline quality, customer
        creditworthiness, or the likelihood of conversion to commercial contracts after 7 years of
        operations.
      diligencePath: >-
        Request a customer reference list and redacted contract summaries during a Series C or
        commercial partnership due diligence process; negotiate for customer introductions.
      relatedQuestionRefs:
        - QU002
      relatedTableRefs:
        - TU003

    - type: missing-source
      severity: blocking
      topic: commercial-contracts
      missingEvidence: >-
        No publicly filed or announced offtake agreement, technology licensing agreement, or consumable
        supply contract exists for any EnergyX revenue model as of May 2026. Revenue contribution by
        model through 2030 cannot be estimated from public data.
      whyItMatters: >-
        The absence of any binding commercial contract means EnergyX's entire revenue thesis —
        offtake, licensing, and consumables — remains unvalidated by a willing buyer at commercial
        scale. Competitors have advanced to binding agreements.
      diligencePath: >-
        Monitor SEC Form 1-U current reports (filed within 4 business days of material events) for
        any commercial contract announcement; track EnergyX press releases via EDGAR alerts.
      relatedQuestionRefs:
        - QU022
      relatedTableRefs:
        - TU003

    - type: missing-source
      severity: material
      topic: pipeline-depth
      missingEvidence: >-
        EnergyX does not disclose the number of active brine testing clients, brine testing
        cancellations or non-renewals, or any pipeline stage metrics. The 84% decline in testing
        income in H1 2025 cannot be explained from public data.
      whyItMatters: >-
        Pipeline depth and customer churn are core indicators of near-term commercial conversion
        potential and retention health. Their absence makes it impossible to assess whether the
        testing income decline signals pipeline thinning.
      diligencePath: >-
        Seek investor update meetings where management discusses pipeline metrics under NDA;
        review quarterly 1-U filings for any material contract disclosures.
      relatedQuestionRefs:
        - QU019

    - type: enumeration-incomplete
      severity: minor
      topic: competitive-pricing-technical-thresholds
      missingEvidence: >-
        EnergyX has not disclosed its brine testing fee schedule, minimum lithium concentration
        threshold for LiTAS economic viability, or pricing comparison versus SLB's DLE offering.
        Compass Minerals' alleged engagement is unconfirmed from public sources.
      whyItMatters: >-
        Pricing and minimum brine concentration are key commercial adoption barriers that determine
        which customer segments EnergyX can realistically serve. Without this information, the ICP
        analysis remains incomplete.
      diligencePath: >-
        Request commercial term sheet from EnergyX; compare to Lilac Solutions' published minimum
        concentration threshold (70 mg/L Li+) and SLB's pilot project economics.
      relatedQuestionRefs:
        - QU005
        - QU010
      relatedTableRefs:
        - TU002

