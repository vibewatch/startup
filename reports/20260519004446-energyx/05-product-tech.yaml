  - id: ip-partnerships-team
    title: "IP Portfolio, Academic Partnerships, and Developer Signal"
    body: >-
      As of the 2025 annual filing, EnergyX holds 134 patents or patent applications covering separation
      media, process configurations, manufacturing methods, and battery technology. Of these, 50 are
      published. The company has filed utility patent applications in the US and internationally covering
      compositions of matter, processes, and manufacturing articles for both GET-Lit™ (DLE) and SoLiS™
      (battery). IP protection is multi-layered, combining patents, trade secrets, and trademark rights.
      The LiTAS® trademark was registered in January 2025. EnergyX has two university IP agreements:
      a Second UT Austin Patent License Agreement (January 2023) for jointly owned IP covering battery
      framework and selective ion transport (3% royalty on net product sales), and a Sublicense Agreement
      with ProfMOF AS (November 2020) for University of Oslo IP on ion-selective separation, with sliding-scale
      royalties based on production volume. The UT Austin partnership also included $150,000 in sponsored
      research. EnergyX's careers page highlights that 40% of employees hold PhDs, the team spans 22
      universities globally and 7 countries, and the company has filed over 100 patents (self-reported
      round number, confirmed by the precise count of 134 in SEC filings). Key technical leadership
      includes CTO Dr. Amit Patwardhan. The company recruits across separation technologies, battery
      engineering, and corporate positions, with Austin, TX as its science headquarters and San Juan,
      Puerto Rico as its corporate headquarters, plus Chile operations. Developer signal is observable
      through patent filing velocity, academic partnerships, and technical hiring, but EnergyX has no
      public GitHub repository, no API surface, and no open-source component observable.
