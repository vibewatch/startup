  - id: technical-architecture
    title: "GET-Lit™ Architecture: Mechanism Versus Marketing Claims"
    body: >-
      The GET-Lit™ system at the membrane level uses mixed-matrix membranes (MMM) — polymer matrices
      embedded with selective nano-fillers — that enable electrodialysis-based lithium-ion transport.
      Large formed sheets of MMM are stacked into module clusters, and thousands of module stacks are
      linked in electrodialysis units to form a complete extraction facility. The system operates as a
      continuous (not batch) process, a key engineering claim distinguishing it from ion-exchange resins
      and ion-sorption sorbents, which require periodic regeneration cycles that reduce throughput and
      increase reagent consumption. EnergyX claims the MMM operates at high salinity (>10%) without
      freshwater dilution — a regime where nanofiltration membranes fail — and maintains lithium/sodium
      and lithium/magnesium selectivity. In February 2025, EnergyX executed a sales order to provide a
      customer with a custom-built bipolar electrodialysis demo system, its first disclosed technology
      licensing event. The company has also procured commercial roll-to-roll manufacturing equipment for
      membrane fabrication, which would enable in-house membrane production at scale. The solvent
      extraction (SX) circuit concentrates the lithium chloride stream following electrodialysis, and the
      adsorption (AX) polishing step removes residual impurities to meet battery-grade purity
      specifications. However, the company has not publicly disclosed purity specifications (Li₂CO₃ or
      LiOH purity %), individual-step mass-balance data, or membrane replacement cadence — all key
      commercial-scale diligence items. The technology's origins trace to membrane research at the University
      of Texas at Austin (Benny Freeman group) and a sub-licensed patent from ProfMOF AS, a spinout of
      the University of Oslo's technology transfer office Inven2, covering ion-selective separation
      methodology. EnergyX entered a Second UT Patent License Agreement in January 2023 for jointly owned
      IP covering battery framework technology and selective ion transport, with a 3% royalty on net product
      sales if commercialized.
