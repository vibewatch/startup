  - id: deployment-status
    title: "Deployment, Roadmap, and Operational Facilities"
    body: >-
      EnergyX currently operates two active pilot plant locations: an Austin, Texas laboratory and
      pilot facility (Headway site, ~22,150 sq ft including ~1 acre outdoor space), and an Antofagasta,
      Chile Testbed facility (expanded to 5,500 m² with a warehouse). Demonstration-scale plants are
      under development at both locations to bridge from pilot (lab/small system) to commercial
      (full-facility) scale. The company signed a land agreement with TexAmericas Center in Texarkana,
      Texas as the site for what it bills as the first commercial-scale DLE lithium production facility
      in the United States. A $690 million LOI with the U.S. Export-Import Bank for project financing —
      with Goldman Sachs advising — was signed in July 2024 for Project Black Giant in Chile. In March
      2025, EnergyX entered lease arrangements for two pilot-scale system units used at Texas and
      Chile operations. The company's commercial roadmap targets Project Black Giant (Chile, 52,500 tpa
      Phase I+II) and Project Lonestar (Texas/Arkansas, 50,000 tpa), with both projects having completed
      PFS-level engineering. Additionally, EnergyX acquired Daytona Lithium Pty. Ltd. (Pantera Lithium
      spinout) in October 2025 for $26M, securing ~35,000 gross acres of Smackover brine lithium resources
      in Arkansas. Demonstration plant completion and definitive feasibility studies (DFS) are prerequisites
      for commercial financing — neither has been disclosed as complete. The SoLiS™ battery program has
      reportedly produced coin and pouch cells and targets pilot-scale lithium-metal production, but no
      timeline or technical specification has been publicly disclosed. The NUKE-it™ platform is referenced
      only in marketing and navigation menus.
