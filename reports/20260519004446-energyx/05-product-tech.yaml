callouts:
  - calloutType: strength
    title: "Modular DLE Platform with Academic IP Roots"
    body: >-
      GET-Lit™'s combination of electrodialysis membranes, solvent extraction, and ion adsorption in a
      continuous, high-salinity-capable system addresses the key weaknesses of competing DLE technologies.
      The 134 patents and applications, dual university IP agreements (UT Austin + Oslo), and 40%
      PhD-holding workforce provide a credible technical foundation differentiated from pure-play project
      developers.
    claimRefs:
      - CE028
      - CE029
      - CE001

  - calloutType: risk
    title: "Pilot-to-Commercial Scale-Up Is the Dominant Unresolved Risk"
    body: >-
      No commercial-scale DLE operation has been validated by any player in the industry. EnergyX's own
      offering circular warns explicitly that pilot results may not replicate at commercial scale. The
      demo plant (TexAmericas) is under construction but not complete; DFS for Black Giant has not been
      initiated; and purity specifications, membrane longevity, and full lifecycle cost remain undisclosed.
      The technology risk profile is high even by early-stage DLE standards.
    claimRefs:
      - CE036
      - CE037
      - CE038
      - CE039

  - calloutType: insight
    title: "First External Technology Sale (Feb 2025) Is a Meaningful Signal"
    body: >-
      The February 2025 sales order for a custom bipolar electrodialysis demo system to a third-party
      customer represents the first confirmed external validation of the GET-Lit™ technology. This is a
      small milestone but matters for the licensing revenue thesis. It shows a non-internal buyer was
      willing to pay for EnergyX technology for its own brine program.
    claimRefs:
      - CE013
      - CE027

  - calloutType: assumption
    title: "Performance Claims Rest on Pilot Data, Not Commercial Operations"
    body: >-
      All quantitative technology claims (96% recovery, 1–2 day processing, $2,500/ton cost, 800 gal/ton
      water use) are based on pilot-plant tests and PFS modeling, not commercial operations data. The PFS
      was prepared by Worley and uses standard engineering estimation methodologies for pre-DFS projects,
      with Inferred resource categories and acknowledged scale-up uncertainty.
    claimRefs:
      - CE014
      - CE015
      - CE016
      - CE017

