company:
  name: Energy Exploration Technologies, Inc. (EnergyX)

chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    EnergyX's GET-Lit™ (formerly LiTAS®) platform combines proprietary mixed-matrix membranes,
    solvent extraction, and ion adsorption in a modular direct lithium extraction system that has
    demonstrated ~96% lithium recovery rates at pilot scale in Chile and Texas. The company has
    filed 134 patents or applications and holds exclusive licenses from UT Austin and the University
    of Oslo. Commercial demonstration plants are under development; no commercial revenue has been
    generated and scale-up from pilot to commercial remains the central unresolved technical risk.

sections:
  - id: product-platform-overview
    title: "Technology Platform: GET-Lit™, SoLiS™, and NUKE-it™"
    body: >-
      EnergyX operates three technology verticals under its integrated platform. The flagship product
      is GET-Lit™ (formerly trademarked as LiTAS® – Lithium-Ion Transport and Separation), a modular
      direct lithium extraction (DLE) system designed to process virtually any hypersaline brine into
      battery-grade lithium compounds. The GET-Lit™ platform integrates three core separation sub-modules:
      (1) proprietary mixed-matrix membranes (MX) for electrodialysis-based lithium separation; (2) solvent
      extraction circuits (SX) for stripping lithium into a concentrated stream; and (3) ion adsorption
      media (AX) for polishing and upgrading lithium concentration. These sub-modules can be combined in
      sequence or used selectively depending on the brine chemistry, giving the company its claim of
      "universal brine adaptability." The second vertical, SoLiS™, is an early-stage battery and
      lithium-metal program that leverages GET-Lit™ nanotechnology to develop a direct-brine-to-lithium-metal
      process — targeting 2–5× energy density improvement over current lithium-ion cells. A third emerging
      vertical, NUKE-it™, addresses nuclear-lithium materials (lithium-6/7 separation for fusion and
      fission applications) and uranium/thorium separation, though this line is pre-commercial and
      sparsely documented. EnergyX's stated goal is full vertical integration from brine to battery-grade
      output, with a secondary revenue stream from licensing GET-Lit™ to third-party brine resource owners.
