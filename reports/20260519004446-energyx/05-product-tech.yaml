  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: purity-specifications
      missingEvidence: "Battery-grade purity specifications (% LiOH·H₂O or Li₂CO₃ purity) for GET-Lit™ output at pilot or commercial scale."
      whyItMatters: "Offtake customers and project finance lenders require confirmed battery-grade purity; without this, the value and saleability of the lithium output cannot be assessed."
      diligencePath: "Request product quality specification sheet and third-party assay results from at least one pilot batch."
      relatedQuestionRefs: [QE003]

    - type: missing-source
      severity: material
      topic: membrane-cadence
      missingEvidence: "Membrane replacement cadence (hours of continuous operation before replacement), unit replacement cost, and annual membrane OpEx at commercial scale."
      whyItMatters: "Membrane consumables are the key recurring cost in the GET-Lit™ model; without this data, the $2,500/ton cost estimate and the in-house membrane revenue stream cannot be verified."
      diligencePath: "Request membrane lifetime testing data and replacement cost estimates from EnergyX; compare to electrodialysis membrane industry norms (typically 2–5 year replacement cycles in water treatment)."
      relatedQuestionRefs: [QE004, QE015]

    - type: missing-source
      severity: material
      topic: DFS-timeline
      missingEvidence: "Definitive Feasibility Study (DFS) initiation date, scope, and expected completion timeline for Project Black Giant."
      whyItMatters: "DFS is required before binding project finance commitments from EXIM Bank or other lenders; the gap between PFS and DFS typically takes 18–36 months and requires significant engineering and drilling investment."
      diligencePath: "Engage with EnergyX management on DFS timeline, estimated cost, and whether a DFS firm has been selected."
      relatedQuestionRefs: [QE011, QE022]

    - type: missing-source
      severity: material
      topic: demo-plant-timeline
      missingEvidence: "Confirmed completion date and operating specs for the East Texas demonstration plant at TexAmericas Center."
      whyItMatters: "The demo plant is the critical bridge step between pilot (~96% recovery at lab scale) and commercial production; failure or delay here is the primary technical risk to the commercialization timeline."
      diligencePath: "Request construction progress reports, commissioning schedule, and target throughput specifications from EnergyX."
      relatedQuestionRefs: [QE008]

    - type: private-evidence-only
      severity: material
      topic: SoLiS-timeline
      missingEvidence: "SoLiS™ development roadmap, cell-level performance data (cycle life, energy density, coulombic efficiency), and pilot-scale production timeline."
      whyItMatters: "SoLiS™ is positioned as a major future revenue driver but has no public technical disclosure beyond marketing descriptions and the existence of coin/pouch cell production."
      diligencePath: "Request internal technical summary of SoLiS™ cell performance versus industry benchmarks (e.g., versus QuantumScape, Solid Power)."
      relatedQuestionRefs: [QE013]

    - type: missing-source
      severity: material
      topic: environmental-permits
      missingEvidence: "Status of environmental and water permits for the Chile (Black Giant) and Texas/Arkansas (Lonestar) projects."
      whyItMatters: "Without permits, both project timelines are undefined; Chile has increasingly complex mining regulatory environments and water rights issues in the Atacama."
      diligencePath: "Review public mining permit databases for EnergyX Chile SpA and EXSO LLC; request permitting status from EnergyX management."
      relatedQuestionRefs: [QE018, QE025]

    - type: missing-source
      severity: minor
      topic: solvent-extraction-chemistry
      missingEvidence: "Identity of solvent extraction reagents used in GET-Lit™, their environmental handling requirements, and waste stream management plan."
      whyItMatters: "SX reagents can pose environmental risks and add to operating costs; regulatory scrutiny is increasing for DLE solvent use."
      diligencePath: "Request SX reagent disclosure and environmental handling plan from EnergyX."
      relatedQuestionRefs: [QE020]

    - type: missing-source
      severity: minor
      topic: NUKE-it-disclosure
      missingEvidence: "Technical basis, IP coverage, and commercial pathway for the NUKE-it™ nuclear-lithium platform."
      whyItMatters: "NUKE-it™ is referenced in EnergyX's technology navigation and investor materials but has no technical disclosure in SEC filings; it may be a nascent revenue thesis or a marketing placeholder."
      diligencePath: "Review any patent filings referencing isotope separation by EnergyX; ask management for a technology brief on NUKE-it™."
      relatedQuestionRefs: [QE014]

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      TE002 (GET-Lit™ architecture table) and TE003 (performance comparison table) include data-source notes inline
      in each table's notes field describing estimation basis and source confidence; no additional notes needed beyond what is provided.
  - dimension: paywallRisk
    reason: >-
      7 of 25 sources (28%) carry restricted accessStatus. Five are EnergyX press-release pages (SE004–SE008)
      that returned 404 broken at access time — these URLs are in the fetch trail and were fetched; the
      content is sourced from SEC filings and the projects/technology pages instead. One is a broken UT Austin
      news page (SE011) and one is LinkedIn (SE021, JS-only). All claimed facts from these sources are
      corroborated by working SEC or official sources; no fact relies solely on a restricted source.
