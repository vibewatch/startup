  foundingLocation: San Juan, Puerto Rico
  headquarters: Austin, Texas
  productSummary: >-
    GET-Lit™ Direct Lithium Extraction: modular, membrane-based DLE system for
    continuous extraction of battery-grade lithium from natural and industrial
    brines, sold as pilot units and equipment packages today and targeting a
    Technology-as-a-Service licensing model and lithium-production revenue from
    owned brine projects at commercial scale.
  customerFocus: >-
    Lithium producers, brine-resource owners, battery materials companies, and
    sovereign energy entities seeking higher-recovery, lower-footprint alternatives
    to solar evaporation ponds.
  businessModel: >-
    Pre-commercial stage; current revenue from membrane equipment sales and
    brine-testing services. Target model has three legs: (1) Technology-as-a-Service
    membrane licensing, (2) upstream lithium-production revenue from owned brine
    projects (Chile, Texas, Arkansas), and (3) co-development partnerships with
    strategic investors.
  stage: Pre-commercial private
  fundingStatus: >-
    Approximately $151 million raised through December 31, 2025: Series B ($31.5 million,
    GM Ventures lead, POSCO/IMM Battery Fund III, Eni Next), Regulation A and CF
    retail offerings ($100+ million aggregate), $5 million DOE grant, and early
    convertible notes. Ongoing Regulation A+ offering at $13.00/share as of May 2026;
    no institutional Series C disclosed.
