      - ["Emergency response and public safety", "Emergency and civil-affairs agencies", "Response crews and dispatch centers", "Public or provincial budget", "Rescue, disaster supply, and monitoring", "Demonstrated reliability in difficult terrain and approved operating procedures"]
      - ["Logistics and industrial transport", "Logistics operators and industrial asset owners", "Flight operators and receiving sites", "Operating or capital budget", "Cargo movement and remote-site resupply", "Payload economics, landing access, insurance, and repeat utilization"]
      - ["Agriculture, utilities, and environmental monitoring", "Agricultural cooperatives, utilities, and public agencies", "Field teams and inspectors", "Departmental operating budget", "Crop protection, line inspection, patrol, and weather missions", "Measured labor or fuel savings plus certification and workflow integration"]
    notes: Buyer and payer assignments are analytical segmentation, not disclosed Tengden contracts. Adoption requires mission-level proof beyond a maiden flight or exhibition listing.
    claimRefs: [CM009, CM010, CM011, CM012]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: The broad low-altitude ecosystem is the top-of-funnel context; the heavy-UAV mission set is narrower, and Tengden-specific SAM/SOM remains unquantified.
    data:
      items:
        - label: China low-altitude economy ecosystem
          value: "Broad ecosystem; deployment indicators reported"
          detail: "People's Daily reports more than 300000 agricultural drones by 2025 and 1081 registered enterprises as of 2025-12-30."
        - label: Heavy UAV and mission-system applications
          value: "Narrower, evidence-backed use-case layer"
          detail: "Tengden materials describe large transport, emergency, weather, patrol, and defense applications."
        - label: Tengden SAM/SOM
          value: "Not disclosed"
          detail: "No retained source isolates serviceable market, obtainable share, unit shipments, realized pricing, or recurring order volume."
        - label: Agricultural deployment lens
          value: "300000+ aircraft reported by 2025"
          detail: "Sector deployment indicator, not Tengden-specific demand."
        - label: Registered-sector lens
          value: "1081 enterprises; 3623 product types"
          detail: "Broad ecosystem inventory reported as of 2025-12-30."
        - label: Tengden financial lens
          value: "RMB175m to RMB379m revenue, 2023-2025"
          detail: "Reported revenue series; not SAM, SOM, or market share."
    approximationNotes: The pyramid expresses analytical narrowing, not proportional market magnitude; the layers are not numerically comparable and do not imply a calculated TAM, SAM, or SOM.
    claimRefs: [CM004, CM008, CM013]
callouts:
  - calloutType: strength
    title: Ecosystem access
    body: State-linked capital, public-sector demand, and a multi-mission product portfolio can shorten access to strategically important UAV programs.
    claimRefs: [CM002, CM005, CM013]
  - calloutType: risk
    title: Capture and profitability gap
    body: "Broad sector growth should not be used as a proxy for Tengden market share: the IPO evidence reports large net losses and does not disclose recurring order volume or unit economics."
    claimRefs: [CM007, CM014, CM015]
