    notes: Coverage is partial rather than an exhaustive current leadership or board enumeration; titles, tenure, board independence, and leadership changes require primary confirmation.
    enumerationScope:
      coverage: partial
      basis: "Publicly named founder, operating entities, and ownership groups discussed in retained 2024-2026 sources; private board and executive roster not fully disclosed."
    claimRefs: [CO005, CO006, CO008]
  - id: TO003
    title: Stakeholder or investor map
    columns: [Stakeholder, Role, Control or economic importance, Diligence ask]
    rows:
      - [Founder Nie Haitao, "Founder and technical leader", "Core technical credibility and possible key-person concentration", "Review succession plan, voting rights, and related-party interests"]
      - [Government-linked investors, "Reported holders of major holding-company stakes", "Potential capital, policy, and procurement access", "Confirm current ownership, control rights, and exit terms"]
      - [Huakong Fund / Boyuan Capital / CICC Capital, "Reported market-oriented financing participants", "External validation and financing network", "Confirm round sizes, preference terms, and remaining ownership"]
      - [PLA-related end users, "Reported operational/procurement constituency", "Supports defense demand but increases policy and export risk", "Obtain customer concentration, contract backlog, and approval constraints"]
      - [Commercial and civil operators, "Target users for logistics, emergency, weather, and patrol missions", "Potential diversification beyond defense", "Verify paid deployments, utilization, and unit economics"]
      - [IPO investors, "Potential subscribers to planned RMB 3.021 billion offering", "New capital and disclosure milestone", "Review prospectus, dilution, use of proceeds, and listing conditions"]
    notes: This map combines reported financing participants, state-linked stakeholders, military demand signals, and prospective IPO stakeholders; it is not a cap table and does not establish contractual control or customer revenue.
    enumerationScope:
      coverage: partial
      basis: "Stakeholders named or directly implied by retained ownership, financing, operational, and IPO reporting through 2026-06; complete cap table and customer roster unavailable."
    claimRefs: [CO006, CO009, CO010, CO014, CO016]
