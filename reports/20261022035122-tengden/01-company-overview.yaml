company:
  name: Tengden
chapter:
  number: 1
  title: Company Overview
  summary: Tengden is a privately owned Chinese large-UAV developer founded in 2016, with products spanning military, logistics, emergency-response, and weather-related missions. Public evidence supports a technically substantial and state-linked platform company, while current financial disclosure remains incomplete despite reported IPO acceptance and material losses.
sections:
  - id: identity-and-platform
    title: Identity, origins, and platform breadth
    body: >-
      Tengden is described as a privately owned drone manufacturer specializing in
      medium-to-large unmanned aerial systems for military and civilian applications.
      Independent China Aerospace Studies Institute research says the company was
      founded in 2016 and that its first Zigong Aviation Industry Park facility was
      completed in 2022. The product family is broader than a single airframe:
      public exhibition material dates first flights for the Twin-Tailed Scorpion
      A, B, and D, while independent aviation reporting documents a later cargo
      aircraft. Public descriptions span emergency, weather, patrol, and transport
      missions. This breadth creates multiple application paths, but it also makes
      product-level adoption and economics difficult to infer from demonstrations
      alone.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-ownership-and-scale
    title: Leadership, ownership, and operating scale
    body: >-
      The strongest public leadership evidence centers on founder Nie Haitao, whom
      36Kr reports previously worked at the Chengdu Aircraft Design and Research
      Institute and participated in development work on the J-10 and FC-1 fighter
      programs before founding Tengden in 2016. Wikipedia's cited synthesis describes
      direct and indirect government-linked ownership stakes and says Nie directly
      owned about two percent of the listed holding entity; those ownership details
      should be treated as reported rather than independently audited here. A 2025
      exhibition profile says the group had more than 900 employees, but the
      assigned evidence does not provide a current filing-based figure or define
      the consolidated employee perimeter. Headcount is therefore a dated company
      claim rather than a settled current metric.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: financing-ipo-and-risk
    title: Financing, IPO process, and underwriting risks
    body: >-
      The refreshed evidence materially improves visibility into financing but does
      not make the company financially transparent. 36Kr reports a July 2023 C+
      round above RMB 1 billion and a post-round valuation above RMB 12.2 billion;
      it also says the later round's amount and post-money valuation were
      undisclosed. A June 2026 IPO-acceptance report gives
      2023–2025 revenue of approximately RMB 175 million, RMB 315 million, and RMB
      379 million, alongside attributable net losses of approximately RMB 469
      million, RMB 364 million, and RMB 426 million, and a planned RMB 3.021 billion
      raise. These are reported figures, not a substitute for the prospectus,
      audited cash-flow data, debt schedule, or board disclosures.
    claimRefs: [CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO003]
  - id: evidence-boundaries
    title: Evidence boundaries and decision implications
    body: >-
      Operational evidence is stronger than commercial evidence. CASI links the
      company's expanding facilities and TB-001 variants to likely PLA procurement,
      while explicitly noting that the evidence is not conclusive proof of PLAN
      operational fielding. Aviationist and The War Zone independently describe the
      August 2024 maiden flight of Tengden's cargo UAV and its stated 2,000-kilogram
      payload, but The War Zone also says Tengden had not released details on the
      aircraft's autonomy. The company's public profile therefore supports engineering
      depth and state-linked demand, not a verified customer count, recurring revenue
      profile, cash runway, or sustainable margin. Those gaps should constrain any
      valuation conclusion. People's Daily reported 18 civilian-drone approvals
      during 2021-2025 and nearly 30 ton-class drones under development by the end
      of 2025; that is evidence of an active adjacent market, not proof of Tengden
      customer demand.
    claimRefs: [CO007, CO014, CO015, CO016]
    tableRefs: []
callouts:
  - calloutType: strength
    title: Engineering depth is visible
    body: CASI documents facility expansion and multiple operationally relevant TB-001 configurations, while independent aviation reporting corroborates a 2,000-kilogram cargo-UAV flight.
    claimRefs: [CO003, CO014, CO015]
  - calloutType: risk
    title: Financial visibility is weak
    body: Reported revenue growth coexists with large attributable net losses, and public sources do not establish cash, debt, runway, board composition, or customer concentration.
    claimRefs: [CO011, CO012, CO013]
  - calloutType: assumption
    title: Ownership and headcount require primary confirmation
    body: Government-linked ownership and employee-count figures are reported by secondary or exhibition sources and should be checked against the IPO prospectus and current corporate filings.
    claimRefs: [CO006, CO007, CO008]
