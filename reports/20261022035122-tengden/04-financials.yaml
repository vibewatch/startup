chapter:
  number: 4
  title: Financials
  summary: Tengden's public financial picture shows a rapidly scaling but loss-making aerospace manufacturer whose planned IPO proceeds are intended for product development, capacity expansion, research, and working capital. Public materials do not disclose enough detail to underwrite recurring revenue quality, gross margin, cash runway, customer concentration, or realized unit economics.
sections:
  - id: revenue-and-monetization
    title: Revenue model and monetization
    body: >-
      Tengden appears to monetize complete unmanned-aircraft systems and related services rather than a recurring software product. A supplier profile describes research, manufacturing, and applications across the Twin-Tailed Scorpion, Hunjianglong, Moyujian, and unmanned-transport-aircraft families, while coverage of the planned listing describes research and development, production, sales, and related services for high-end UAV systems. That combination supports a hardware-plus-services model, but the public record does not separate aircraft sales from engineering, support, training, or other service revenue. Official or public list prices, realized prices, contract terms, discounts, revenue recognition policies, backlog, and customer-level concentration are not disclosed in the assigned evidence. The D18 production article reports a 2-billion-yuan investment and planned annual capacity above 50 fixed-wing aircraft, but those are capacity and capex signals, not revenue or demand proof. The underwriting implication is that reported growth should be tested against delivered units, acceptance milestones, deposits, backlog conversion, and customer payment terms rather than treated as recurring revenue. A third-party estimate of USD4–6 million for the competing Wing Loong II, including munitions, ground control stations, and after-sales support, shows that package scope can materially affect apparent aircraft pricing; it is not evidence of Tengden's own price realization.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI016]
    tableRefs: [TI001, TI002]
  - id: operating-economics
    title: Cost structure and operating economics
    body: >-
      The disclosed economics are dominated by aerospace development and production costs. The IPO coverage reports operating revenue of approximately 175 million yuan in 2023, 315 million yuan in 2024, and 379 million yuan in 2025, alongside attributable net losses of approximately 469 million, 364 million, and 426 million yuan respectively. These figures indicate that revenue grew while accounting losses remained substantial; they do not establish cash burn because working-capital movements, non-cash items, capitalized development, subsidies, and financing flows are not provided. The D18 article describes a four-engine commercial UAV, a dedicated assembly line, testing and flight-test functions, training, and a planned capacity above 50 aircraft annually, all of which imply meaningful fixed-cost, certification, tooling, maintenance, and service-delivery requirements. Industry reporting also describes a broad low-altitude ecosystem and expanding use cases, but sector growth cannot be substituted for Tengden-specific gross margin, utilization, or sales efficiency. CAC, payback, contribution margin, warranty reserves, inventory turns, receivables aging, and project-level profitability remain open diligence items.
    claimRefs: [CI006, CI007, CI008, CI009, CI010]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: >-
      Tengden's proposed financing is strategically important because the company is loss-making while funding aircraft development and manufacturing capacity. The reported ChiNext filing sought approximately 3.021 billion yuan before issuance expenses, allocated in priority order to large-UAV product development and production-capacity improvement, an unmanned-sub-aircraft production and research base, industrial-UAV development and industrialization, a UAV research institute, and supplementary working capital. The source does not provide cash on hand, debt, committed facilities, monthly burn, runway, or the timing of these uses, so the raise should be viewed as planned financing rather than cash currently available. A 2026 government report places China's low-altitude-economy market at a projected 3.5 trillion yuan by 2035, and other coverage records expanding applications, but those market figures do not remove execution, policy, certification, or customer-concentration risk. The financial verdict is research-more: the company has evidence of product breadth, financing access, and capacity investment, but underwriting requires audited statements, a cash bridge, backlog quality, customer concentration, unit cost by aircraft family, and a financing-dependency scenario.
    claimRefs: [CI011, CI012, CI013, CI014]

