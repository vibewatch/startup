callouts:
  - calloutType: strength
    title: Financing access and capacity investment
    body: Public coverage reports a proposed RMB3.021bn IPO and a D18 assembly investment program, indicating access to capital and an effort to industrialize production; neither item proves demand conversion or funding sufficiency.
    claimRefs: [CI003, CI011, CI012]
  - calloutType: risk
    title: Losses and disclosure gaps constrain underwriting
    body: Reported attributable losses remained hundreds of millions of yuan through 2025, while cash, burn, runway, gross margin, backlog, and customer concentration are not disclosed in the assigned sources.
    claimRefs: [CI007, CI008, CI009, CI010]
  - calloutType: recommendation
    title: Require audited cash and contract evidence
    body: Before underwriting, obtain audited statements, a cash-and-debt bridge, aircraft-family unit costs, customer concentration, signed backlog, acceptance terms, and a financing-dependency scenario.
    claimRefs: [CI009, CI010, CI013, CI014]

