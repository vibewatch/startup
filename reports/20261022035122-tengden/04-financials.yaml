    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Operating revenue, "RMB175m (2023); RMB315m (2024); RMB379m (2025)", high, "Shows reported scale and growth trajectory", "Reconcile audited revenue to deliveries, acceptance, backlog, and customer concentration"]
      - [Attributable net profit, "RMB-469m (2023); RMB-364m (2024); RMB-426m (2025)", high, "Losses materially exceed disclosed revenue", "Obtain bridge from accounting loss to operating cash flow and non-cash items"]
      - [Gross margin, null, low, "Cannot assess aircraft-level contribution or margin path", "Provide gross margin by aircraft family and service stream"]
      - ["Cash, burn, and runway", null, low, "Determines financing dependency and solvency buffer", "Provide latest cash, restricted cash, debt, monthly burn, commitments, and runway"]
      - ["CAC, payback, and contribution margin", null, low, "Tests whether growth is economically repeatable", "Provide channel spend, sales cycle, contract margin, and cohort economics"]
      - [Planned IPO proceeds, "Approximately RMB3.021bn before issuance expenses", high, "Potential funding source for capacity and R&D", "Confirm offering status, net proceeds, timing, and use-of-funds milestones"]
    notes: "Revenue, losses, and proposed proceeds are reported figures from the cited coverage; unavailable private metrics remain null and require diligence rather than imputation."
    claimRefs: [CI006, CI007, CI011, CI012, CI013, CI014]

