      - [Liquidity and dilution, "IPO plans to raise approximately RMB3.021bn; terms and pricing are not disclosed.", "Prospectus, price range, fully diluted cap table, and preference treatment.", unresolved]
    notes: "The table distinguishes operational evidence from financing evidence; an IPO fundraising target is not treated as current cash or valuation."
    claimRefs: [CV001, CV004, CV005, CV006, CV011]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation or return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Capacity converts into repeat PLA and civil contracts; losses narrow after funded expansion; IPO terms are not punitive.", "Potential re-rating after verified margin and backlog disclosure; no numeric target is supportable.", "Policy dependence and execution.", low-to-medium]
      - [Base, "Strategic demand persists; IPO process advances; financial disclosure improves only gradually.", "Track rather than underwrite; wait for price, cap table, cash, and margin evidence.", "Opaque economics and dilution.", medium]
      - [Bear, "Losses persist; IPO pricing reflects the prior mark; orders or exports are constrained.", "Downside through dilution, multiple compression, and weak liquidity.", "Regulatory, concentration, and commercialization failure.", medium]
      - [Trigger, "A priced prospectus or audited update changes the denominator or risk profile.", "Re-score only after reconciling enterprise value, net cash, shares, and normalized earnings.", "Premature precision.", high relevance]
    notes: "Scenarios are qualitative because public sources do not provide the fully diluted share count, current price, net debt, or a reliable earnings base for a numeric valuation range."
    claimRefs: [CV006, CV007, CV008, CV011, CV014, CV015]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Strategic relevance and technical traction are offset by losses, disclosure gaps, and policy-linked downside, leading to a research-more recommendation.
    data:
      nodes:
        - {id: scale, label: "Facility and production scale", detail: "CASI reports expansion and approximately 200 large UAVs of annual capacity."}
        - {id: proof, label: "Operational proof", detail: "TB-001 service and testing evidence supports technical relevance."}
        - {id: demand, label: "Demand potential", detail: "PLA and low-altitude-economy applications provide strategic demand signals."}
        - {id: losses, label: "Persistent losses", detail: "Reported attributable net losses continue through 2025."}
        - {id: opacity, label: "Price and cap-table opacity", detail: "Current IPO price, dilution, preferences, cash, and backlog are unresolved."}
        - {id: call, label: "Research-more", detail: "Wait for priced, audited, fully diluted evidence before entry."}
    claimRefs: [CV001, CV004, CV005, CV006, CV007, CV015]
callouts:
  - calloutType: recommendation
    title: Research-more pending priced disclosure
    body: >-
      Tengden has credible strategic and engineering evidence, but the public record does not support a current price-sensitive buy decision. Require the prospectus, audited statements, cap table, backlog, customer concentration, and margin bridge before underwriting entry.
    claimRefs: [CV004, CV005, CV006, CV007, CV015]
  - calloutType: risk
    title: The prior private mark is not a current valuation
    body: >-
      The reported valuation above RMB12bn followed a 2023 financing round, while the later IPO report shows continuing attributable losses. Without current price and dilution terms, treating the private mark as fair value would be false precision.
    claimRefs: [CV003, CV005, CV006]
