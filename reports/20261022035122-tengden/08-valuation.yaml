company:
  name: Tengden
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a technically credible, strategically relevant UAV business, but it does not support a precise current valuation or a buy recommendation. The June 2026 IPO filing provides revenue and loss data while independent market evidence points to execution, disclosure, policy, and multiple-compression risks.
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: >-
      Tengden's positive case is built on observable engineering and procurement traction rather than on recurring-revenue evidence. China Aerospace Studies Institute (CASI) reports that the company expanded production facilities and that the TB-001 is already in PLA service; it also describes likely procurement interest from the PLA, while explicitly noting that the evidence is not conclusive for PLAN operational fielding. A public market-oriented profile reports that Tengden completed a financing round of more than RMB1 billion in 2023 and was valued at more than RMB12 billion after that round. The anti-thesis is stronger for underwriting purposes. A June 2026 IPO report gives 2023–2025 revenue of approximately RMB175 million, RMB315 million, and RMB379 million, alongside attributable net losses of approximately RMB469 million, RMB364 million, and RMB426 million. That revenue-loss profile makes the prior private valuation difficult to assess without a cap table, preferred-rights terms, cash balance, order backlog, and margin bridge. The recommendation is therefore research-more: the company may have strategic value, but the public record does not establish an investable entry price.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001]
  - id: financing-and-entry-discipline
    title: Financing context and entry discipline
    body: >-
      The latest disclosed financing context is incomplete. The 36Kr-hosted profile says the June 2025 financing round did not disclose either the amount raised or the post-money valuation, even though it compares the company with other low-altitude-economy unicorns using the prior RMB12.2 billion valuation. The June 2026 IPO acceptance report instead states that Tengden plans to raise approximately RMB3.021 billion, after issuance expenses, for product development, production capacity, an unmanned-sub-aircraft base, an industrial-UAV project, a research institute, and working capital. A proposed IPO raise is not cash available before issuance and is not equivalent to enterprise value. The two market-data pages provide a public comparable rather than a Tengden valuation: EHang's market capitalization is reported at $0.26 billion as of October 2026 by CompaniesMarketcap, while Macrotrends reports $0.771 billion as of June 10, 2026 and $0.073 billion of revenue. The conflicting dates and values make the pages a directional range, not a precise comp multiple. Entry discipline should therefore require verified IPO pricing, fully diluted shares, preferred preferences, net cash or debt, and a reconciliation from reported revenue to gross margin and cash burn.
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV002]
  - id: scenarios-and-downside
    title: Scenarios, comparables, and thesis-break triggers
    body: >-
      The bull case assumes the IPO funds capacity without punitive dilution, PLA and civil demand convert into repeat orders, and losses narrow as production scales. CASI's observation that the expanded facility is associated with approximately 200 large UAVs of annual production capacity is a capacity signal, not proof of shipments or profitability. The base case assumes strategic demand persists but public disclosures remain too thin to underwrite a return, so the appropriate posture is to track the IPO process and request primary financial statements. The bear case combines persistent losses, dilution or preference overhang, a lower-than-expected order conversion, export or policy restrictions, and public-market multiple compression. The broader Chinese low-altitude market is expanding, but People's Daily also reports that many demonstration zones remain focused on single functions and are still some distance from an integrated ecosystem; sector growth should not be substituted for Tengden-specific economics. The most important thesis-break triggers are an IPO price implying a premium to the undisclosed private mark without stronger margins, a failure to disclose backlog and customer concentration, continued losses without a credible path to contribution margin, or restrictions that limit military and civil commercialization.
    claimRefs: [CV011, CV012, CV013, CV014, CV015]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: diligence-and-exit
    title: Exit readiness and final diligence asks
    body: >-
      Exit readiness cannot be scored confidently from public evidence. An IPO filing process creates a possible liquidity path, but acceptance is not listing, pricing, or successful settlement. The diligence package should obtain the latest prospectus, audited financial statements, revenue by customer and product, backlog aging, gross-margin reconciliation, cash and debt schedule, cap table, preferred rights, related-party transactions, and board composition. It should also test whether the TB-001 and related platforms are being procured under repeatable contracts or under policy-supported programs with uncertain duration. Army Recognition's comparison of another Chinese armed-UAV platform illustrates that lower-cost positioning can be commercially attractive while still leaving performance and export-policy trade-offs; it is a market-context source, not a Tengden price benchmark. Until those questions are answered, the defensible conclusion is research-more with a high risk rating and unknown-to-stretched valuation stance rather than a price target.
    claimRefs: [CV004, CV006, CV015]
  - id: exhibits
    title: Exhibits
    body: >-
      The exhibits separate company-specific evidence from directional public comparables and scenario assumptions. Values are retained in their reported currencies and periods; no conversion, implied multiple, probability-weighted valuation, or return is presented where the public record does not supply the required denominator. This prevents a reported financing target, an old private mark, or a date-specific public market capitalization from being mistaken for a current enterprise value. The tables therefore emphasize decision gates and missing inputs rather than invented price targets.
    claimRefs: [CV003, CV006, CV009, CV014]
