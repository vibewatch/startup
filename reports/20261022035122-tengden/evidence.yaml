evidenceGaps:
  - type: missing-source
    severity: material
    topic: leadership
    missingEvidence: >-
      A current official executive and board roster with governance rights, related-party disclosures, and succession
      coverage.
    whyItMatters: >-
      Founder concentration and state-linked ownership can materially affect control, execution continuity, and investor
      protections.
    diligencePath: >-
      Review the IPO prospectus, current corporate registry extracts, articles of association, and shareholder agreement
      disclosures.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A current audited or filing-based employee count defining the consolidated entity and worker categories.
    whyItMatters: >-
      The dated 900-plus company profile does not establish current scale, and an undefined denominator can distort
      productivity and burn analysis.
    diligencePath: Reconcile the latest prospectus employee table, payroll records, and consolidated-subsidiary scope.
    relatedQuestionRefs:
      - QO006
  - type: private-evidence-only
    severity: blocking
    topic: financials
    missingEvidence: Audited cash, debt, operating cash flow, backlog, customer concentration, and runway data.
    whyItMatters: >-
      Reported accounting losses and planned financing do not establish cash available, burn, solvency, or sustainable
      unit economics.
    diligencePath: >-
      Obtain the accepted IPO prospectus and diligence-room financial statements, debt schedule, contract backlog, and
      customer concentration analysis.
    relatedQuestionRefs:
      - QO005
      - QO006
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: commercial-demand
    missingEvidence: >-
      Named commercial customers, paid deployments, utilization, pricing, and renewal or repeat-order evidence outside
      defense-linked demand.
    whyItMatters: >-
      Product demonstrations and military procurement signals do not prove diversified commercial revenue or recurring
      demand.
    diligencePath: >-
      Request customer contracts, deployment logs, order backlog by end market, and reference calls covering civil
      applications.
    relatedQuestionRefs:
      - QO008
      - QO009
  - type: missing-source
    severity: material
    topic: policy-risk
    missingEvidence: >-
      A current legal, sanctions, export-control, and procurement-compliance review covering Tengden and its principal
      stakeholders.
    whyItMatters: >-
      State-linked defense exposure can create export, sanctions, customer-concentration, and cross-border financing
      constraints.
    diligencePath: >-
      Run a current sanctions and litigation search and review the IPO risk factors, export licenses, and
      government-contract compliance controls.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Tengden-specific SAM, SOM, unit shipments, realized prices, customer concentration, and recurring order volume by
      mission category.
    whyItMatters: >-
      Broad ecosystem deployment cannot be translated into Tengden revenue, market share, or valuation capture without
      company-level denominators.
    diligencePath: >-
      Request segment revenue, backlog, shipment, ASP, utilization, and customer-level contract data under
      confidentiality.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: adoption
    missingEvidence: >-
      Independent evidence of repeat commercial operations, certification status, and realized workflow savings for
      Tengden aircraft.
    whyItMatters: >-
      A successful demonstration or product exhibition does not prove recurring utilization or attractive unit
      economics.
    diligencePath: >-
      Obtain customer references, flight-hour logs, certification records, renewal rates, and mission-level gross-margin
      data.
    relatedQuestionRefs:
      - QM005
      - QM007
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: >-
      Reconciliation of the approximately $1.7 billion January 2024 valuation reported by PrivateMarketView with the
      above-RMB12-billion valuation reported after 2023 financing.
    whyItMatters: Different currencies, dates, and methodologies can materially change the valuation benchmark used in underwriting.
    diligencePath: >-
      Verify transaction dates, post-money definitions, share classes, exchange-rate convention, and whether each figure
      is a priced round or secondary mark.
    relatedQuestionRefs:
      - QM002
      - QM008
  - type: missing-source
    severity: minor
    topic: competition
    missingEvidence: Comparable pricing, delivery cadence, and win-loss evidence for Chinese heavy-UAV and mission-system alternatives.
    whyItMatters: >-
      The market may grow while Tengden's attainable share is constrained by incumbent defense suppliers or lower-cost
      alternatives.
    diligencePath: Collect procurement awards, tender records, export contracts, competitor ASPs, and independent fleet counts.
    relatedQuestionRefs:
      - QM007
  - type: missing-source
    severity: material
    topic: competitive pricing
    missingEvidence: >-
      Comparable realized prices, contract sizes, payment terms, and support costs for Tengden and its nearest cargo and
      MALE competitors.
    whyItMatters: >-
      Without comparable economics, nominal payload and capability differences cannot establish customer value, pricing
      power, or a defensible competitive moat.
    diligencePath: >-
      Request anonymized bid, contract, and aftermarket data by aircraft family and mission, then benchmark against
      public tenders and competitor disclosures.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: installed base
    missingEvidence: >-
      Verified delivered-aircraft counts, active fleet, repeat orders, customer identities, utilization, and renewal or
      service data.
    whyItMatters: A broad product catalog and reported test flights do not show adoption, distribution power, or switching costs.
    diligencePath: >-
      Obtain a model-level delivery ledger, customer reference calls, backlog reconciliation, and service-revenue cohort
      data.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP001
      - TP003
  - type: access-blocked
    severity: minor
    topic: CGTN competitor context
    missingEvidence: Readable article body and source-specific details from the assigned CGTN URL.
    whyItMatters: >-
      The source was successfully prefetched but its retained text is only a transcript marker, so it cannot support
      detailed competitor claims.
    diligencePath: >-
      Review the original article through an approved accessible copy during a future refresh; do not infer facts from
      the title.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Latest audited balance sheet, cash flow statement, restricted cash, debt schedule, monthly burn, committed capex,
      and runway.
    whyItMatters: Reported losses and planned capacity investment make financing dependency central to solvency and dilution risk.
    diligencePath: Request audited statements and a month-by-month cash bridge from the company and IPO materials.
    relatedQuestionRefs:
      - QI006
  - type: missing-source
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Revenue by aircraft family and service stream, signed backlog, customer concentration, acceptance terms, deposits,
      and payment history.
    whyItMatters: Aggregate revenue does not establish repeatability, collection quality, or realized unit economics.
    diligencePath: Obtain customer-level revenue concentration, backlog aging, contract samples, and delivery/acceptance schedules.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI003
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin and contribution margin by aircraft family, including warranty, support, engineering, and
      certification costs.
    whyItMatters: Without product-level margins, reported growth cannot support a credible path to profitability.
    diligencePath: >-
      Request costed bills of materials, labor and overhead allocation, warranty reserves, and realized price
      waterfalls.
    relatedQuestionRefs:
      - QI004
  - type: missing-source
    severity: material
    topic: developer-and-practitioner-signal
    missingEvidence: >-
      A public software repository, package or API surface, engineering talk, practitioner forum, integration-partner
      technical post, or other credible developer-signal proxy for Tengden.
    whyItMatters: >-
      Without a public developer or practitioner signal, the assigned evidence cannot test engineering ecosystem depth,
      release cadence, integration maturity, or external technical adoption.
    diligencePath: >-
      Request engineering repositories, release notes, integration documentation, named technical partners, and public
      engineering presentations, then corroborate activity with independent practitioner sources.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: material
    topic: trust-and-safety
    missingEvidence: >-
      Aircraft-level certification, safety cases, environmental qualification, incident history, secure-development
      controls, privacy practices, command-link testing, and degraded-mode procedures.
    whyItMatters: >-
      Large unmanned aircraft operate in regulated and high-consequence environments where control failures, insecure
      links, or undocumented safety performance can prevent deployment.
    diligencePath: >-
      Obtain regulator records, certification matrices, flight-test reports, incident logs, cybersecurity assessments,
      link-loss procedures, and customer acceptance documents for each configuration.
    relatedQuestionRefs:
      - QE007
      - QE008
  - type: private-evidence-only
    severity: material
    topic: production-and-support
    missingEvidence: >-
      Configuration-specific production output, supplier qualification, yield, fleet hours, uptime, maintenance
      intervals, spares availability, warranty terms, and support response performance.
    whyItMatters: >-
      A flight demonstration and planned capacity projects do not establish repeatable manufacturing quality or an
      economically supportable operational fleet.
    diligencePath: >-
      Review factory acceptance data, quality escapes, supplier concentration, recurring test results, maintenance
      records, field reliability, and service-level commitments.
    relatedQuestionRefs:
      - QE003
      - QE006
      - QE007
  - type: access-blocked
    severity: minor
    topic: independent-comparison
    missingEvidence: >-
      Accessible, configuration-matched competitor technical documentation and independent flight-test or procurement
