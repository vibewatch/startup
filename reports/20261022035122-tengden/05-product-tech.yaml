company:
  name: Tengden
chapter:
  number: 5
  title: Product & Technology
  summary: Tengden has assembled a broad family of large fixed-wing, cargo, amphibious, and rotary-wing unmanned aircraft, with public evidence of flight tests and mission-specific configurations. The evidence is strongest on airframe specifications and airdrop testing, while production repeatability, command-and-control architecture, certification, reliability, cybersecurity, and support remain material diligence gaps.
sections:
  - id: product-portfolio
    title: Product portfolio and user workflows
    body: "Tengden is pursuing a platform-family strategy rather than a single-purpose aircraft. Public reporting and company-supplied exhibition material identify the Twin-Tailed Scorpion family, a separate large unmanned transport aircraft, the amphibious Hunjianglong, and the Meiyu Jian unmanned helicopter. The stated workflows span emergency response, weather services, wide-area patrol, cargo transport, airdrop, maritime management, search and rescue, surveying, and communications relay. This breadth creates reuse opportunities across airframes, payloads, and operating teams, but the evidence primarily establishes product definitions and claimed missions. It does not establish installed fleet size, production volume, customer acceptance, utilization, or service economics."
    claimRefs: [CE002, CE003, CE004, CE005, CE006, CE010, CE011]
    tableRefs: [TE001]
  - id: architecture-and-technical-proof
    title: Architecture and technical proof
    body: "The disclosed architecture centers on mission-configurable aircraft rather than a documented software stack. Tengden-supplied material describes multiple airframes with different propulsion layouts, endurance profiles, payload capacities, and takeoff environments. Independent reporting provides a stronger proof point for the four-engine cargo configuration: three containers totaling 1.2 tonnes were dropped from 300 meters and landed within 100 meters of the target. The same source describes a modular cargo compartment and more than 600 kilometers of loaded airdrop range. However, it also says control and navigation details were not disclosed. The resulting architecture map is therefore an evidence-bounded operating model, not a representation of a verified autonomy, communications, or cybersecurity design."
    claimRefs: [CE003, CE004, CE005, CE006, CE007, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-deployment-and-roadmap
    title: Maturity, deployment, and roadmap
    body: "Maturity varies materially by product. The Twin-Tailed Scorpion variants have reported first-flight dates from 2020 to 2022, while the separate transport aircraft first flew in 2024 and the amphibious Hunjianglong completed a river-surface takeoff and landing in March 2025. The cargo-drop report is explicit that its prototype remained at the beginning of testing only 34 days after first flight, so a successful demonstration should not be treated as evidence of production reliability. Separately, IPO reporting describes planned spending on large-UAV development, production-capacity improvement, an unmanned-aircraft production and research base, industrialization, and a research institute. Those projects indicate roadmap intent, not completed capacity."
    claimRefs: [CE003, CE004, CE007, CE008, CE010, CE012, CE016]
    tableRefs: [TE002]
  - id: differentiation-trust-and-verdict
    title: Differentiation, trust, and diligence verdict
    body: "Tengden's clearest differentiation is large-airframe and mission-modularity know-how: its disclosed family covers long-endurance fixed-wing platforms, heavy cargo and airdrop configurations, amphibious operations, and a medium unmanned helicopter. An external Wing Loong II profile shows that payload, endurance, control range, sensors, and support are normal comparison dimensions for Chinese medium-altitude long-endurance systems, but that competitor profile does not independently validate Tengden's claims. Sector reporting also shows that certification and ecosystem integration remain nontrivial across China's low-altitude market. Underwriting should therefore focus on aircraft-level certification, repeat flight-test results, command-link resilience, secure autonomy, supplier quality, maintenance, spares, incident history, and customer acceptance before treating prototypes as scalable products."
    claimRefs: [CE001, CE009, CE012, CE013, CE014, CE015]
