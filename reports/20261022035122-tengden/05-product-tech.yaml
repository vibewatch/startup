      - ["Twin-Tailed Scorpion A", "Patrol, artificial rain, and emergency response", "First flight reported on 2020-01-16", "Three-engine layout; claimed 8,000 km range and 40-hour endurance", "Independent performance validation and operating history"]
      - ["Twin-Tailed Scorpion B", "Rescue, weather, patrol, and delivery missions", "First flight reported on 2022-05-08", "Composite configuration; claimed 8,500 km range and 46-hour endurance", "Payload-specific endurance and customer acceptance"]
      - ["Twin-Tailed Scorpion D", "Cargo transport, airdrop, and aerial dispersal", "First flight reported on 2022-10-25; later cargo-drop test reported", "Claimed 1,800 kg commercial payload and 1,200 kg airdrop capacity", "Repeat tests, safety case, and production status"]
      - ["Large unmanned transport aircraft", "Airport-to-airport cargo and airdrop", "First flight reported on 2024-08-11", "Claimed 2,000 kg payload, modular cargo hold, and short-field operation", "Certification, route approvals, and dispatch reliability"]
      - ["Hunjianglong amphibious UAV", "Maritime management, water rescue, island logistics, and enforcement", "River-surface takeoff and landing reported on 2025-03-26", "Land, water, road, and grass-field operating concept", "Saltwater qualification, sea-state limits, and customer deployments"]
      - ["Meiyu Jian unmanned helicopter", "External lift, rescue, mapping, patrol, and communications relay", "First flight reported on 2019-12-17", "Claimed 550 kg maximum takeoff weight, 1,000 km range, and 9-hour endurance", "Fleet hours, payload limits, and maintenance burden"]
    notes: "Specifications and first-flight dates are company-supplied claims reproduced by the exhibition organizer; third-party reporting corroborates only the cited cargo-drop test and should not be read as validation of the full portfolio."
    claimRefs: [CE002, CE003, CE004, CE005, CE006, CE007, CE010, CE011]
  - id: TE002
    title: Workflow and use-case evidence
    columns: [User job, Product configuration, Evidence of benefit or maturity, Current limitation]
    rows:
      - ["Deliver cargo into hard-to-reach areas", "Four-engine modular cargo aircraft", "A reported test dropped 1.2 tonnes in three containers from 300 meters", "One early-stage test does not establish repeatability or dispatch reliability"]
      - ["Move cargo between suitable airports", "Large twin-engine transport aircraft", "Company-supplied specifications claim a 2,000 kg payload and 600 km full-load range", "No public route economics, certification status, or service history"]
      - ["Conduct emergency, weather, and wide-area missions", "Twin-Tailed Scorpion A and B", "Multiple first-flight dates and mission configurations are publicly described", "No public customer acceptance, uptime, or outcome data"]
      - ["Operate from water and improvised surfaces", "Hunjianglong amphibious UAV", "A river-surface takeoff and landing was reported in March 2025", "No independent environmental qualification or recurring deployment evidence"]
      - ["Perform lift, survey, patrol, and relay missions", "Meiyu Jian helicopter", "Company-supplied material reports a 2019 first flight and a multi-mission design", "No public installed base, flight-hour, maintenance, or safety record"]
    notes: "Benefits are limited to the specific demonstrations or company-supplied specifications identified; no row implies commercial production, certification, or recurring deployment."
    claimRefs: [CE003, CE004, CE006, CE007, CE008, CE010, CE011]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or component, Evidenced role, Dependency, Principal risk or diligence request]
    rows:
      - ["Mission layer", "Cargo, airdrop, rescue, weather, patrol, survey, maritime, and relay workflows", "Payload fit, operating approvals, and trained crews", "Obtain mission-level customer acceptance and utilization data"]
      - ["Air vehicle layer", "Fixed-wing multi-engine, amphibious, and rotary-wing platforms", "Airframe, propulsion, flight controls, and supplier quality", "Verify type-specific test hours, configuration control, and production yields"]
      - ["Payload and cargo layer", "Mission payload carriage and modular cargo or airdrop configurations", "Mechanical interfaces, restraint, power, and payload qualification", "Review reconfiguration time, load envelopes, and release-system safety"]
      - ["Command and autonomy layer", "Navigation, control, and autonomous flight functions", "Ground control, communications links, software, and sensors", "Control and navigation details were not disclosed in the assigned independent report"]
      - ["Deployment layer", "Launch, recovery, route planning, and field operations", "Airspace permissions, weather limits, facilities, and operators", "Request environmental qualification, route approvals, and degraded-mode procedures"]
      - ["Sustainment and scale layer", "Manufacturing, maintenance, spares, upgrades, and support", "Production assets, qualified suppliers, quality systems, and service organization", "Planned IPO projects do not establish completed capacity, fleet uptime, or support levels"]
    notes: "This architecture is constrained to disclosed product features and operating dependencies; undocumented software, communications, cybersecurity, certification, and support capabilities are shown as diligence gaps rather than inferred."
    claimRefs: [CE002, CE006, CE009, CE012, CE013]
figures:
  - id: FE001
    title: Evidence-bounded product architecture map
    type: stack
    summary: Tengden's disclosed system progresses from mission applications through platform and payload choices to largely undisclosed control, deployment, and sustainment layers.
    data:
      layers:
        - label: Mission applications
          items: ["Cargo and airdrop", "Emergency and weather", "Patrol and survey", "Maritime and relay"]
          detail: "Public materials describe a broad set of civil and dual-use workflows."
        - label: Platform family
          items: ["Twin-Tailed Scorpion A/B/D", "Large transport aircraft", "Hunjianglong", "Meiyu Jian"]
          detail: "The family spans fixed-wing, amphibious, and rotary-wing configurations."
        - label: Airframe and propulsion
          items: ["Multi-engine fixed wing", "Composite variant", "Amphibious airframe", "Unmanned helicopter"]
          detail: "Configurations are publicly described, but independent qualification data are limited."
        - label: Payload and cargo
          items: ["Mission payloads", "Modular cargo hold", "Airdrop containers", "External lift"]
          detail: "A 1.2-tonne airdrop test is the strongest independent technical proof in the assigned pool."
        - label: Command and autonomy
          items: ["Navigation", "Ground control", "Communications", "Autonomous flight"]
          detail: "The assigned independent test report says control and navigation details were not disclosed."
        - label: Deployment and sustainment
          items: ["Certification", "Field operations", "Maintenance and spares", "Production quality"]
          detail: "IPO materials describe planned capacity projects, not demonstrated output or fleet support."
    approximationNotes: "The ordering is analytical and does not imply that Tengden has publicly disclosed a complete software, communications, security, certification, or support architecture."
    claimRefs: [CE006, CE007, CE009, CE012, CE015]
callouts:
  - calloutType: strength
    title: Concrete cargo demonstration
    body: "The reported 1.2-tonne, three-container airdrop is a measurable technical milestone and supports the modular-cargo concept, but it remains a single early-stage test."
    claimRefs: [CE006, CE007, CE008]
  - calloutType: risk
    title: Undisclosed assurance stack
    body: "The assigned evidence does not establish command-link resilience, secure autonomy, airworthiness, incident performance, fleet uptime, or service support for Tengden's aircraft."
    claimRefs: [CE009, CE012, CE013]
