      - [AVIC HH-100, Chinese direct/adjacent cargo UAV, "700 kg stated payload; 300 km/h and 520 km reported", low-altitude cargo and logistics, lower-payload cargo-drone alternative, "realized cost, production status, and customer adoption not retained"]
      - [Feihong FH-98, Chinese direct/adjacent cargo UAV, "1.5-ton reported capacity; 5.25-ton MTOW; prior benchmark", remote logistics and cargo, established transport-UAV reference point, "Aviationist reports a 2024 test crash; current fleet and economics unknown"]
      - ["Wing Loong II", "Chinese armed MALE competitor", "Army Recognition reports operation or export to multiple countries", "ISR, strike, and some dual-use missions", "lower-cost and permissive-export positioning", "source is not a Tengden product or contract comparison"]
      - ["MQ-9 Reaper", "US armed MALE competitor", "Army Recognition reports higher payload and altitude than Wing Loong II", "allied ISR and strike procurement", "performance and interoperability", "higher cost and stricter export controls are reported qualitatively"]
      - [Bayraktar Akinci, Turkish armed MALE competitor, "Army Recognition identifies it as a heavy multi-role platform", non-NATO and other strike buyers, heavy strike capability and domestic weapons, "price, deliveries, and direct Tengden overlap unknown"]
      - [Hermes 900, Israeli MALE competitor, "Army Recognition describes a more compact ISR-oriented system", dual-use and military ISR, compact endurance-oriented positioning, "price and buyer-level trade-offs not retained"]
      - ["Crewed logistics, helicopter, ship, or internal build", "substitute/status quo", "People.cn reports drones replacing portions of vessel and helicopter work in some scenarios", "regulated transport and existing workflows", "installed assets and internal control", "task-by-task economics and switching costs are not quantified"]
    notes: "Rows synthesize the assigned prefetched sources; competitor scale is not normalized across aircraft, payload, country, or procurement stage, and unknown cells are not estimates."
    claimRefs: [CP001, CP002, CP003, CP004, CP009]
  - id: TP002
    title: Capability and buying-criteria comparison
    columns: [Buying criterion, Tengden evidence, Competitor or substitute evidence, Implication, Confidence]
    rows:
      - [Payload and volume, "2,000 kg and 12 m3 stated for unnamed cargo UAV", "HH-100 700 kg; FH-98 1.5 tons reported", "Tengden may target a higher-payload cargo tier, subject to validation", medium]
      - [Mission breadth, "Twin-Tailed Scorpion, amphibious, helicopter, and cargo products listed", "Wing Loong II supports ISR/strike and some civilian configurations", "Portfolio breadth can help cross-sell but does not prove deployment scale", medium]
      - [Price and export access, "Tengden price and terms unavailable", "Wing Loong II estimated at USD 4–6 million including support; fewer political restrictions described", "Price and policy flexibility may be decisive, but comparison is not like-for-like", low]
      - [Autonomy and communications, "Cargo aircraft shows antenna dome; autonomy details not released", "Wing Loong II described with satellite-link and ground-control options", "System integration and beyond-line-of-sight evidence are diligence priorities", medium]
      - [Safety and trust, "Maiden flights and product claims reported; operational safety dataset unavailable", "FH-98 test crash reported; WorldAttention summarizes IPO scrutiny", "Trust and certification may outweigh nominal payload in regulated procurement", medium]
      - [Distribution and installed base, "No verified delivered-fleet or repeat-order count retained", "Wing Loong II reported in several foreign and PLA contexts; Chinese ecosystem is broad", "Installed-base advantage cannot be assigned to Tengden from current evidence", medium]
    notes: "The matrix separates retained facts from implications; no unsupported cells are converted into scores, prices, or market shares."
    claimRefs: [CP005, CP006, CP007, CP008, CP009, CP010]
  - id: TP003
    title: Moat durability and diligence checklist
    columns: [Moat or risk dimension, Current evidence, Competitive implication, Required evidence]
    rows:
      - [Airframe and payload engineering, "Multiple Tengden aircraft and stated payload specifications are publicly described", "Technical breadth may reduce single-product dependence", "Independent flight-test, certification, reliability, and delivered-aircraft records"]
      - [Mission software and autonomy, "Communications and autonomous-flight details are incomplete", "Software integration could create switching costs if proven", "Controller architecture, autonomy logs, cybersecurity, and operator-training data"]
      - [Distribution and support, "No retained source quantifies service network or repeat orders", "Support may differentiate in remote or regulated missions", "Customer references, parts lead times, service revenue, and renewal data"]
      - [Supply and partner access, "IPO reporting raises questions about prepayments and counterparties", "Governance and supply-chain transparency can affect trust", "Audited delivery receipts, supplier concentration, and related-party review"]
      - [Incumbent response and crowding, "People.cn reports 1,081 enterprises and nearly 30 ton-class drones under development", "Commoditization and state-backed alternatives may compress pricing power", "Win/loss data, backlog, unit economics, and competitor tender outcomes"]
    notes: "This is a diligence-oriented risk table, not a quantified moat score; public evidence is incomplete for every requested dimension."
    claimRefs: [CP009, CP010, CP011, CP012]
