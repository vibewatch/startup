      - {label: "Broad / accessible", xMin: 2.5, xMax: 4, yMin: 2.5, yMax: 4}
      - {label: "Broad / constrained", xMin: 2.5, xMax: 4, yMin: 1, yMax: 2.5}
      - {label: "Narrow / accessible", xMin: 1, xMax: 2.5, yMin: 2.5, yMax: 4}
      - {label: "Narrow / constrained", xMin: 1, xMax: 2.5, yMin: 1, yMax: 2.5}
    note: "Coordinates are ordinal author judgments anchored to the retained descriptions, not measured market data."
    claimRefs: [CP001, CP003, CP005, CP007, CP009]
callouts:
  - calloutType: risk
    title: Competitive conclusion
    body: Tengden appears differentiated by a broad Chinese unmanned-aircraft portfolio and a stated 2,000 kg cargo platform, but the evidence does not establish a durable moat over AVIC, Feihong, Wing Loong, or existing transport workflows. The highest-value diligence is realized delivery, support, safety, pricing, and repeat-order evidence.
    claimRefs: [CP001, CP009, CP010, CP012]
