callouts:
  - calloutType: risk
    title: Primary thesis-break trigger
    body: "The investment case should be re-underwritten if the proposed financing does not close on acceptable terms, if recurring losses persist without a documented funding runway, or if export and procurement rules materially exclude Tengden's target models."
    claimRefs: [CR003, CR009, CR010]
  - calloutType: assumption
    title: Evidence boundary
    body: "The assigned public record does not establish current accident, cyber, outage, recall, customer-concentration, cash, burn, debt, or board data; these are diligence gaps rather than evidence of absence."
    claimRefs: [CR008, CR010, CR012]
