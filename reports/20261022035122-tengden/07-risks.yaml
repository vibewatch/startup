company:
  name: Tengden
chapter:
  number: 7
  title: Risks
  summary: Tengden's principal underwriting risks are policy exposure, opaque ownership and finances, and execution complexity across a dual-use large-UAV portfolio. Public evidence shows meaningful state and military linkages and a widening regulatory perimeter, but does not establish current incident rates, customer concentration, or standalone liquidity.
sections:
  - id: policy-and-legal
    title: Policy, regulatory, and legal exposure
    body: "Tengden's dual-use position creates a structural policy risk rather than a single disclosed legal incident. The China Aerospace Studies Institute described the company as ostensibly private while documenting government-linked ownership, military-equipment certifications, weapons-export licensing, and cooperation with PLA-linked institutions. That combination can support procurement and funding, but it also increases exposure to export controls, sanctions, end-use scrutiny, and changing national-security policy. The January 2026 Bureau of Industry and Security rule eased licensing for some civil UAVs and certain long-range cargo or agricultural drones to specified partners, while retaining notification and reporting requirements; it is not evidence that Tengden products qualify. Separately, a July 2025 U.S. Senate release proposed treating UAS differently in defense-transfer rules to help American suppliers compete with Chinese military technology. These policy signals point in opposite directions, so the monitorable risk is jurisdiction- and product-specific eligibility, not a blanket conclusion about access."
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: operating-and-technical
    title: Operating, quality, and technical execution
    body: "Tengden is scaling a heterogeneous fleet: the 2025 exposition listing describes two-, three-, and four-engine fixed-wing platforms, a large unmanned transport aircraft, an amphibious system, and a highland unmanned helicopter. That breadth creates integration, certification, maintenance, and support complexity across different airfields, payloads, weather conditions, and mission profiles. The same listing reports performance specifications and intended applications, but it is an exhibitor source and does not establish production yield, fleet availability, reliability, or independent acceptance testing. Independent technical descriptions of the TB-001 similarly identify demanding operating environments and multiple communications and payload configurations. The most important unresolved operating risk is therefore not whether the designs have plausible specifications, but whether Tengden can repeatedly deliver safe, supportable systems at scale. Public evidence supplied for this run does not verify a company-specific accident, outage, cyber incident, recall, or quality rate."
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: dependencies-and-financial-resilience
    title: Dependencies, financial resilience, and thesis breaks
    body: "The financing profile is a material risk because the June 2026 IPO report describes rapidly rising operating revenue alongside recurring attributable net losses: approximately RMB175 million, RMB315 million, and RMB379 million of revenue in 2023–2025, with attributable net losses of approximately RMB469 million, RMB364 million, and RMB426 million, respectively. The proposed RMB3.021 billion offering is presented as funding product development, production capacity, a research base, an industrial UAV program, a research institute, and working capital; it is a proposed financing plan, not cash already available. The same report does not provide standalone cash, burn, runway, debt, or customer concentration. Older independent analysis also describes government investment, tax credits, and large facility expansion, while a named SF Express logistics collaboration and Huawei repair deployment demonstrate dependency and customer-proof surfaces without proving repeat commercial demand. The thesis should break or be materially downgraded if the IPO is withdrawn or materially downsized, losses continue without credible funding, production capacity does not convert into accepted deployments, or export and military end-use restrictions close the target markets."
    claimRefs: [CR009, CR010, CR011, CR012]
    tableRefs: [TR003]
