      - [Foreign export-control and end-use restrictions, United States and partner jurisdictions, "BIS rule effective 2026-01-20 eases access for specified civil UAV categories but retains notification/reporting requirements; it does not establish Tengden eligibility.", Medium, High, "Screen destination, model, payload, technology, and counterparties before each transaction.", High, "Secure counsel memo mapping Tengden models and components to current EAR and partner rules."]
      - [Policy discrimination against Chinese military-drone suppliers, United States and allies, "The July 2025 LEAD Act release says the bill would reduce restrictions for U.S. UAS sales and decrease dependence on Chinese military technology; it is a legislative proposal, not enacted law in this evidence.", Medium, High, "Track enactment, procurement rules, sanctions, and allied-country restrictions.", High, "Run a country-by-country market-access and sanctions screen."]
    notes: "Rows synthesize public regulatory and policy documents; legislative proposals are not enacted rules, and license currency or product eligibility remains unverified."
    enumerationScope:
      coverage: partial
      basis: "Publicly documented policy and licensing exposures found in the assigned 2025-2026 source pool"
    claimRefs: [CR001, CR002, CR003, CR004]
  - id: TR002
    title: Operational, quality, and security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Multi-platform integration and support across fixed-wing, amphibious, helicopter, and transport systems", Medium, High, Partial, High, "No public fleet availability, maintenance, or production-yield data."]
      - ["High-altitude, maritime, or adverse-weather mission failure", Medium, High, Partial, Medium-High, "Independent acceptance testing and incident history are not disclosed."]
      - ["Command, satellite-link, or payload integration failure", Medium, High, Partial, High, "Public technical descriptions list link options but do not establish operational reliability or cybersecurity controls."]
      - ["Safety, quality, or recall event during scale-up", Unknown, Critical, "Early evidence only", High, "No company-specific accident, outage, recall, or defect-rate evidence was supplied."]
    notes: "Risk ratings are bounded judgments from the documented system breadth and disclosed evidence gaps; they are not measured incident probabilities."
    claimRefs: [CR005, CR006, CR007, CR008]
  - id: TR003
    title: Partner, dependency, and financial risk register
    columns: [Dependency, Counterparty or role, Concentration or reliance, Likelihood, Failure scenario, Severity, Mitigation, Residual exposure, Diligence path]
    rows:
      - ["Government and defense-policy support", "Provincial investors and PLA-linked institutions", "CASI describes government-linked ownership, investment, tax support, and military cooperation.", High, "Policy or procurement change reduces funding and demand", High, "Diversify civilian and export revenue with verified contracts", High, "Obtain current cap table, subsidy schedule, and contract backlog by end market."]
      - ["Logistics and customer validation", "SF Express and named civil users", "SF Express collaboration and Huawei repair deployment are documented; repeat paid deployments and concentration are not.", Medium, "Partner program does not scale or becomes non-recurring", High, "Convert pilots and demonstrations into disclosed contracted backlog", High, "Request customer references, contract terms, renewal history, and revenue share."]
      - ["Capital for capacity expansion", "Proposed IPO and working capital", "2026 report describes RMB3.021bn proposed raise and recurring 2023-2025 attributable net losses.", High, "IPO delay, downsizing, or continued losses constrain production", Critical, "Stage capacity commitments against cash and financing milestones", High, "Obtain cash, debt, burn, runway, use-of-proceeds, and post-IPO ownership details."]
      - ["Specialized components and engines", "Suppliers and affiliated aerospace ecosystem", "Public evidence describes an alleged engine/component cooperation and a broad multi-engine fleet; supplier concentration is not disclosed.", Medium, "Component shortage or export restriction delays deliveries", High, "Qualify alternate suppliers and hold critical spares", "Medium-High", "Obtain top-supplier list, sole-source exposure, lead times, and quality agreements."]
    notes: "Dependency evidence distinguishes disclosed relationships from unverified concentration; funding raised is not treated as cash available."
    claimRefs: [CR009, CR010, CR011, CR012]
