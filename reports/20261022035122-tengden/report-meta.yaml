companyProfile:
  summary: >-
    Tengden is a privately owned Chinese developer and manufacturer of large unmanned aircraft spanning military, cargo,
    emergency-response, weather-modification, and related civil missions. Public evidence supports meaningful
    engineering capability, flight-test activity, strategic relevance, and an expanding production footprint, but the
    public record remains incomplete on current ownership, customer concentration, backlog quality, cash runway, and
    product-level economics.
