  topStrengths:
    - Broad large-UAV product and mission portfolio with documented flight-test and production activity.
    - Strategic relevance and evidence of government, defense-industrial, and civil-response demand.
    - Proposed financing and facility expansion could support capacity and product development if successfully funded.
  topRisks:
    - >-
      Persistent large accounting losses and insufficient public evidence on cash runway, unit economics, and backlog
