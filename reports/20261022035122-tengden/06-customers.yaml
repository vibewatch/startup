company:
  name: Tengden
chapter:
  number: 6
  title: Customers
  summary: Tengden's disclosed customer base is concentrated in government, defense-industrial, research, emergency-response, weather-modification, and aviation-operator segments rather than broad self-serve demand. The strongest current adoption evidence is a named D18 emergency-relief flight test and disclosed production-line/flight milestones, while the prospectus identifies high top-five customer concentration, seasonal acceptance, receivables exposure, and limited public retention evidence.
sections:
  - id: customer-segmentation
    title: Buyer and user segmentation
    body: >-
      Tengden's prospectus describes a multi-segment model spanning defense equipment, low-altitude economy, and general aviation. Its disclosed end-user groups include military and defense-industrial customers, central state-owned enterprises, research institutes, large general-aviation operators, government emergency departments, and weather-modification departments. The same filing says the product set includes large fixed-wing UAVs, unmanned helicopters, amphibious UAVs, and swarm sub-aircraft, with applications in reconnaissance and strike, battlefield support, emergency communications, weather modification, and logistics. This is a programmatic, procurement-led customer model: the relevant buyer, user, and payer can differ, and the filing does not disclose a complete account list, revenue split, or repeat-purchase denominator.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Adoption and named deployment proof
    body: Public evidence supports engineering and operational milestones, but it does not establish a broad installed base or durable recurring usage. A Wuhu government-affiliated news report describes D18 completing a 1.2-ton, three-package continuous airdrop test at 300 meters, with claimed landing accuracy within 100 meters, and identifies emergency scenarios including earthquakes, floods, and maritime disasters. The report also names a production-line start date, a first flight, and planned highland tests. Aviation Week independently reported the D18 display at Aero Asia 2025 and described its 4,350-kilogram gross weight and first flight, but the accessible text is subscription-limited. These sources support named product and test evidence, not customer contracts, paid deployment, or retention.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: durability-and-concentration
    title: Durability, expansion, and concentration
    body: The prospectus reports that the five largest customers represented 85.16%, 87.01%, and 76.55% of sales in the disclosed reporting periods, and attributes the concentration to specific end users and relationships with leading customers. It also explains that defense and other institutional buyers use budget management and centralized procurement, so implementation and acceptance are weighted toward the second half of the year. The filing identifies receivables from specific customers, defense state-owned enterprises, research institutes, general-aviation operators, government emergency departments, and weather-modification departments, with collection timing exposed to budget and operating conditions. No public source in the assigned pool provides NRR, GRR, churn, renewal rates, contract length, cohort retention, or a verified customer count; expansion should therefore be treated as an underwriting question rather than an established operating metric.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
  - id: customer-diligence
    title: Customer diligence implications
    body: The evidence indicates that Tengden's commercial proof is strongest at the product-validation and mission-demonstration layer, while customer durability remains less transparent. The central diligence questions are whether D18 and other platforms have paid production deployments, which counterparties are the economic buyers, how much revenue is defense versus civil and emergency use, and whether acceptance schedules create material working-capital swings. The U.S. Covered List separately illustrates that foreign-produced UAS and critical components can face procurement restrictions in U.S. government-related channels, and the State Department describes case-by-case UAS export review; these are market-access constraints, not evidence that Tengden itself is named on either page.
    claimRefs: [CU013, CU014]
callouts:
  - calloutType: strength
    title: Mission-specific proof exists
    body: A named D18 test demonstrates a concrete emergency-response use case with reported payload and flight-test results, stronger than an unaudited logo list but still short of paid production adoption.
    claimRefs: [CU005, CU006]
  - calloutType: risk
    title: Concentration and retention remain material gaps
    body: Disclosed top-five customer concentration above 76% in each cited period, together with seasonal acceptance and no public retention metrics, leaves customer durability and cash conversion highly sensitive to a small number of institutional programs.
    claimRefs: [CU009, CU010, CU011]
