      - [Weather-modification departments, Weather and civil aviation, Large-UAV weather-modification application, Application target, "Prospectus identifies weather modification as a target use", "No named department, flight record, contract, or outcome is disclosed"]
      - [Large general-aviation operators, Civil aviation and logistics, Cargo transport and airdrop applications, Application target / potential deployment, "Prospectus identifies the customer class and receivables exposure", "No named operator, fleet count, contract term, or retention metric is disclosed"]
    enumerationScope:
      coverage: partial
      basis: "Named counterparties and customer classes visible in the assigned 2025-2026 public sources; confidential defense and institutional accounts are not enumerated."
    notes: "The table intentionally separates named customer classes from named legal entities. A test or application target is not treated as proof of a paid production account."
    claimRefs: [CU003, CU004, CU005, CU011]
