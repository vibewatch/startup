      - [D18 displayed at Aero Asia, "4,350 kg gross weight; first flight reported", "2025-11-27 to 2025-11-30", "Aviation Week", medium, "Provides independent visibility for the cargo-UAV platform", "Accessible article is subscription-limited and does not disclose sales or customer adoption"]
    notes: "This is a milestone trajectory, not a customer-count or recurring-revenue series. Values and dates are reported as stated by the cited sources; a missing denominator means the evidence cannot be converted into penetration, conversion, or retention."
    claimRefs: [CU005, CU006, CU007, CU008]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or counterparty, Segment, Deployment/use case, Production vs pilot, Outcome, Limitation]
    rows:
