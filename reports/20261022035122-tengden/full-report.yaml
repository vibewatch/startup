      - number: '1.2'
        title: Leadership, ownership, and operating scale
        blocks:
          - type: paragraph
            body: >-
              The strongest public leadership evidence centers on founder Nie Haitao, whom 36Kr reports previously
              worked at the Chengdu Aircraft Design and Research Institute and participated in development work on the
              J-10 and FC-1 fighter programs before founding Tengden in 2016. Wikipedia's cited synthesis describes
              direct and indirect government-linked ownership stakes and says Nie directly owned about two percent of
              the listed holding entity; those ownership details should be treated as reported rather than independently
              audited here. A 2025 exhibition profile says the group had more than 900 employees, but the assigned
              evidence does not provide a current filing-based figure or define the consolidated employee perimeter.
              Headcount is therefore a dated company claim rather than a settled current metric.
            claimRefs:
              - CO005
