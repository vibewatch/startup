          tone: positive
        - date: '2024-08-11'
          label: 2,000-kilogram cargo UAV maiden flight
          details: Independent aviation reports say Tengden's unnamed cargo UAV flew for approximately 20 minutes.
          tone: positive
        - date: '2026-06-16'
          label: ChiNext IPO accepted
