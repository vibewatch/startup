        title: Financing, IPO process, and underwriting risks
        blocks:
          - type: paragraph
            body: >-
              The refreshed evidence materially improves visibility into financing but does not make the company
              financially transparent. 36Kr reports a July 2023 C+ round above RMB 1 billion and a post-round valuation
