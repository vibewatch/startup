chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, origins, and platform breadth
        blocks:
          - type: paragraph
            body: >-
              Tengden is described as a privately owned drone manufacturer specializing in medium-to-large unmanned
              aerial systems for military and civilian applications. Independent China Aerospace Studies Institute
              research says the company was founded in 2016 and that its first Zigong Aviation Industry Park facility
              was completed in 2022. The product family is broader than a single airframe: public exhibition material
              dates first flights for the Twin-Tailed Scorpion A, B, and D, while independent aviation reporting
              documents a later cargo aircraft. Public descriptions span emergency, weather, patrol, and transport
              missions. This breadth creates multiple application paths, but it also makes product-level adoption and
              economics difficult to infer from demonstrations alone.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
