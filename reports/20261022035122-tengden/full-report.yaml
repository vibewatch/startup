  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not all drones or all low-altitude activity. For Tengden, the defensible boundary
              is medium- and large-scale unmanned aircraft, mission payloads, system integration, and associated
              services sold into defense, emergency response, logistics, inspection, agriculture, and weather-related
              operations. Consumer camera drones, small recreational aircraft, and the broader eVTOL passenger market
              are excluded because the retained evidence does not show Tengden competing there. The company’s own
              exhibition profile lists the Twin-Tailed Scorpion family, an unmanned transport aircraft, an amphibious
              system, and a medium helicopter across emergency rescue, weather service, wide-area patrol, and air
              transport applications (SM007). This makes the status quo heterogeneous: buyers can continue using crewed
              aircraft, ships, helicopters, manual inspection, or conventional logistics, or procure smaller drones for
              narrower missions. The market therefore grows through mission-level replacement and augmentation rather
              than a single uniform drone category.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
      - number: '2.2'
        title: Sizing lenses and evidence limits
        blocks:
          - type: paragraph
            body: >-
              The broadest retained lens is China’s low-altitude economy. People’s Daily reports more than 300,000
              agricultural drones operating by 2025, covering 460 million mu, and describes inspection, offshore
              logistics, agriculture, and emergency-response use cases (SM003). That is an ecosystem-demand indicator,
              not Tengden revenue or a heavy-UAV TAM. A second lens is the industrial heavy-UAV submarket: the retained
              company profile describes a 2,000 kg maximum commercial payload for its 2024 unmanned transport aircraft
              and applications across air transport and aerial delivery (SM007). A third lens is capital formation and
              public-market access: 36Kr reports more than RMB1 billion in 2023 financing and a valuation above RMB12
              billion, while a June 2026 IPO report gives 2023-2025 revenue of approximately RMB175 million, RMB315
              million, and RMB379 million, respectively (SM005, SM006). These lenses are not interchangeable. No
              retained source isolates Tengden’s SAM, SOM, unit shipments, realized prices, or share of the Chinese
              low-altitude market, so a precise bottom-up market size would be fabricated.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM008
              - CM013
      - number: '2.3'
        title: Buyer segmentation and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer is mission-led and budget ownership differs by segment. Defense and security buyers value
              persistent ISR, strike or patrol capability, export permissions, and integration with command systems; the
              evidence places Tengden’s products in PLA service and describes export-oriented Chinese MALE systems, but
              does not disclose Tengden contract volumes (SM002, SM008). Civil agencies and state-linked operators buy
              emergency response, weather, patrol, agricultural, and environmental capabilities, where procurement
              depends on certification, operating permissions, and demonstrable workflow savings. Logistics operators
              and industrial infrastructure owners care about payload, range, reliability, landing-site access, and
              total operating cost. People’s Daily reports that drone inspection and offshore operations can replace
              parts of manual, ship, or helicopter work and quantifies savings for one offshore deployment, but that
              case concerns the broader sector rather than Tengden (SM003). Adoption therefore proceeds from
              demonstrations and public-sector pilots to certified, repeatable missions; the commercial proof point is
              recurring utilization, not merely a successful maiden flight.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand drivers include China’s policy support for low-altitude applications, growing agricultural and
              inspection deployment, state-linked capital, and Tengden’s ability to span military and civil missions.
              The retained evidence also shows an expanding local ecosystem: 36Kr cites more than 500
              low-altitude-economy enterprises in Chengdu and multiple industrial funds, while People’s Daily reports
              1,081 registered enterprises and 3,623 product types nationally as of December 30, 2025 (SM005, SM003).
              Constraints are equally material. Public sources do not establish Tengden’s repeat commercial order book,
              unit economics, or attributable market share; 2026 IPO reporting shows attributable net losses of
              approximately RMB469 million, RMB364 million, and RMB426 million for 2023-2025 despite revenue growth
              (SM006). Export controls, airspace and certification requirements, mission reliability, switching costs,
              and dual-use policy scrutiny can slow conversion from prototype or demonstration to recurring deployment.
              A valuation case should therefore underwrite ecosystem growth separately from Tengden-specific capture and
              profitability.
            claimRefs:
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Ecosystem access
            body: >-
              State-linked capital, public-sector demand, and a multi-mission product portfolio can shorten access to
              strategically important UAV programs.
            calloutType: strength
            claimRefs:
              - CM002
              - CM005
              - CM013
          - type: callout
            title: Capture and profitability gap
            body: >-
              Broad sector growth should not be used as a proxy for Tengden market share: the IPO evidence reports large
              net losses and does not disclose recurring order volume or unit economics.
            calloutType: risk
            claimRefs:
              - CM007
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Tengden's closest disclosed alternatives depend on the mission. In heavy unmanned logistics, the retained
              reporting places its unnamed twin-engine cargo aircraft alongside AVIC's HH-100, which was reported with a
              700 kg payload, and the Feihong FH-98, reported with a 1.5-ton capacity. The Aviationist also describes
              the FH-98 as a prior Chinese benchmark and notes its reported crash during testing, while Tengden's 2024
              aircraft was described as a 2,000 kg, 12-cubic-meter design. This is a capability comparison, not proof
              that the products serve the same procurement requirement or have the same certification status. In armed
              MALE systems, Army Recognition compares China's Wing Loong II with the US MQ-9 Reaper, CH-5, Türkiye's
              Bayraktar Akinci, and Israel's Hermes 900. That comparison implies a segmented battlefield: payload and
              altitude favor some Western systems, while lower price and fewer political restrictions can favor Chinese
              exports. Civil alternatives also include crewed aircraft, helicopters, ships, and manual inspection;
              People.cn reports drones already replacing portions of vessel and helicopter work in offshore logistics
              and power inspection. Internal build is a plausible alternative for state-linked buyers, but the retained
              sources do not quantify its cost or prevalence.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP009
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP007
              - CP009
      - number: '3.2'
        title: Capability, distribution, and trust trade-offs
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a capability-led differentiation thesis, not a durable moat conclusion. Tengden's
              cargo aircraft was reported with 2,000 kg of stated payload, 12 cubic meters of internal space, a 16.1 m
              wingspan, and a maiden flight lasting about 20 minutes; an industry-expo listing also describes multiple
              Twin-Tailed Scorpion variants, an amphibious platform, and an unmanned helicopter for rescue, inspection,
              and meteorological use. Those are product-scope signals, while not independent proof of operational scale.
              Army Recognition reports that the Wing Loong II is exported to multiple countries and can be offered with
              ground control, sensors, and munitions; it estimates a USD 4–6 million package, but that estimate is not a
              Tengden price and should not be used as a direct valuation input. The likely buying criteria are payload,
              range, runway or terrain flexibility, autonomy, mission payload integration, after-sales support, export
              permissions, and safety or airworthiness evidence. No retained source provides comparable Tengden list
              pricing, contract terms, customer concentration, or verified delivered-fleet utilization.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
      - number: '3.3'
        title: Switching costs, displacement risk, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Switching costs are likely to be highest after a buyer integrates a platform into mission software,
              operator training, maintenance, communications, and regulatory procedures, but the retained evidence does
              not measure those costs. Tengden's stated modularity and multiple airframe variants could support
              cross-mission reuse, while the presence of AVIC, Feihong, Wing Loong, and other Chinese systems indicates
              that airframe supply is not automatically scarce. The market is also exposed to commoditization and
              incumbent response: People.cn records 1,081 enterprises and 3,623 product types registered in China's
              low-altitude economy as of December 30, 2025, and reports that nearly 30 ton-class drones were under
              development. Those figures describe a crowded national ecosystem, not Tengden's addressable share. Adverse
              diligence is material: WorldAttention summarizes reporting that the IPO faces questions about prepayments,
              related-party disclosure, inventory, losses, and regulatory scrutiny. That does not establish wrongdoing,
              but it can weaken buyer and investor trust until the company provides verifiable explanations. Before
              underwriting a competitive position, request delivered-aircraft counts by model, recurring service
              revenue, win/loss data, realized prices, safety incidents, certification status, customer renewal or
              repeat-order data, and evidence separating company-issued product claims from independent operational
              proof.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Competitive conclusion
            body: >-
              Tengden appears differentiated by a broad Chinese unmanned-aircraft portfolio and a stated 2,000 kg cargo
              platform, but the evidence does not establish a durable moat over AVIC, Feihong, Wing Loong, or existing
              transport workflows. The highest-value diligence is realized delivery, support, safety, pricing, and
              repeat-order evidence.
            calloutType: risk
            claimRefs:
              - CP001
              - CP009
              - CP010
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Tengden appears to monetize complete unmanned-aircraft systems and related services rather than a
              recurring software product. A supplier profile describes research, manufacturing, and applications across
              the Twin-Tailed Scorpion, Hunjianglong, Moyujian, and unmanned-transport-aircraft families, while coverage
              of the planned listing describes research and development, production, sales, and related services for
              high-end UAV systems. That combination supports a hardware-plus-services model, but the public record does
              not separate aircraft sales from engineering, support, training, or other service revenue. Official or
              public list prices, realized prices, contract terms, discounts, revenue recognition policies, backlog, and
              customer-level concentration are not disclosed in the assigned evidence. The D18 production article
              reports a 2-billion-yuan investment and planned annual capacity above 50 fixed-wing aircraft, but those
              are capacity and capex signals, not revenue or demand proof. The underwriting implication is that reported
              growth should be tested against delivered units, acceptance milestones, deposits, backlog conversion, and
              customer payment terms rather than treated as recurring revenue. A third-party estimate of USD4–6 million
              for the competing Wing Loong II, including munitions, ground control stations, and after-sales support,
              shows that package scope can materially affect apparent aircraft pricing; it is not evidence of Tengden's
              own price realization.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI016
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI016
      - number: '4.2'
        title: Cost structure and operating economics
        blocks:
          - type: paragraph
            body: >-
              The disclosed economics are dominated by aerospace development and production costs. The IPO coverage
              reports operating revenue of approximately 175 million yuan in 2023, 315 million yuan in 2024, and 379
              million yuan in 2025, alongside attributable net losses of approximately 469 million, 364 million, and 426
              million yuan respectively. These figures indicate that revenue grew while accounting losses remained
              substantial; they do not establish cash burn because working-capital movements, non-cash items,
              capitalized development, subsidies, and financing flows are not provided. The D18 article describes a
              four-engine commercial UAV, a dedicated assembly line, testing and flight-test functions, training, and a
              planned capacity above 50 aircraft annually, all of which imply meaningful fixed-cost, certification,
              tooling, maintenance, and service-delivery requirements. Industry reporting also describes a broad
              low-altitude ecosystem and expanding use cases, but sector growth cannot be substituted for
              Tengden-specific gross margin, utilization, or sales efficiency. CAC, payback, contribution margin,
              warranty reserves, inventory turns, receivables aging, and project-level profitability remain open
              diligence items.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI011
              - CI012
              - CI013
              - CI014
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI011
              - CI012
      - number: '4.3'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Tengden's proposed financing is strategically important because the company is loss-making while funding
              aircraft development and manufacturing capacity. The reported ChiNext filing sought approximately 3.021
              billion yuan before issuance expenses, allocated in priority order to large-UAV product development and
              production-capacity improvement, an unmanned-sub-aircraft production and research base, industrial-UAV
              development and industrialization, a UAV research institute, and supplementary working capital. The source
              does not provide cash on hand, debt, committed facilities, monthly burn, runway, or the timing of these
              uses, so the raise should be viewed as planned financing rather than cash currently available. A 2026
              government report places China's low-altitude-economy market at a projected 3.5 trillion yuan by 2035, and
              other coverage records expanding applications, but those market figures do not remove execution, policy,
              certification, or customer-concentration risk. The financial verdict is research-more: the company has
              evidence of product breadth, financing access, and capacity investment, but underwriting requires audited
              statements, a cash bridge, backlog quality, customer concentration, unit cost by aircraft family, and a
              financing-dependency scenario.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing access and capacity investment
            body: >-
              Public coverage reports a proposed RMB3.021bn IPO and a D18 assembly investment program, indicating access
              to capital and an effort to industrialize production; neither item proves demand conversion or funding
              sufficiency.
            calloutType: strength
            claimRefs:
              - CI003
              - CI011
              - CI012
          - type: callout
            title: Losses and disclosure gaps constrain underwriting
            body: >-
              Reported attributable losses remained hundreds of millions of yuan through 2025, while cash, burn, runway,
              gross margin, backlog, and customer concentration are not disclosed in the assigned sources.
            calloutType: risk
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
          - type: callout
            title: Require audited cash and contract evidence
            body: >-
              Before underwriting, obtain audited statements, a cash-and-debt bridge, aircraft-family unit costs,
              customer concentration, signed backlog, acceptance terms, and a financing-dependency scenario.
            calloutType: recommendation
            claimRefs:
              - CI009
              - CI010
              - CI013
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product portfolio and user workflows
        blocks:
          - type: paragraph
            body: >-
              Tengden is pursuing a platform-family strategy rather than a single-purpose aircraft. Public reporting and
              company-supplied exhibition material identify the Twin-Tailed Scorpion family, a separate large unmanned
              transport aircraft, the amphibious Hunjianglong, and the Meiyu Jian unmanned helicopter. The stated
              workflows span emergency response, weather services, wide-area patrol, cargo transport, airdrop, maritime
              management, search and rescue, surveying, and communications relay. This breadth creates reuse
              opportunities across airframes, payloads, and operating teams, but the evidence primarily establishes
              product definitions and claimed missions. It does not establish installed fleet size, production volume,
              customer acceptance, utilization, or service economics.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE010
              - CE011
          - type: table
            tableRef: TE001
            claimRefs:
