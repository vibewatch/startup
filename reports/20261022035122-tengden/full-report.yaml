              - CE015
      - number: '5.3'
        title: Maturity, deployment, and roadmap
        blocks:
          - type: paragraph
            body: >-
              Maturity varies materially by product. The Twin-Tailed Scorpion variants have reported first-flight dates
              from 2020 to 2022, while the separate transport aircraft first flew in 2024 and the amphibious
              Hunjianglong completed a river-surface takeoff and landing in March 2025. The cargo-drop report is
              explicit that its prototype remained at the beginning of testing only 34 days after first flight, so a
              successful demonstration should not be treated as evidence of production reliability. Separately, IPO
              reporting describes planned spending on large-UAV development, production-capacity improvement, an
              unmanned-aircraft production and research base, industrialization, and a research institute. Those
              projects indicate roadmap intent, not completed capacity.
            claimRefs:
              - CE003
              - CE004
              - CE007
              - CE008
              - CE010
              - CE012
              - CE016
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE007
              - CE008
              - CE010
              - CE011
      - number: '5.4'
        title: Differentiation, trust, and diligence verdict
        blocks:
          - type: paragraph
            body: >-
              Tengden's clearest differentiation is large-airframe and mission-modularity know-how: its disclosed family
              covers long-endurance fixed-wing platforms, heavy cargo and airdrop configurations, amphibious operations,
              and a medium unmanned helicopter. An external Wing Loong II profile shows that payload, endurance, control
              range, sensors, and support are normal comparison dimensions for Chinese medium-altitude long-endurance
              systems, but that competitor profile does not independently validate Tengden's claims. Sector reporting
              also shows that certification and ecosystem integration remain nontrivial across China's low-altitude
              market. Underwriting should therefore focus on aircraft-level certification, repeat flight-test results,
              command-link resilience, secure autonomy, supplier quality, maintenance, spares, incident history, and
              customer acceptance before treating prototypes as scalable products.
            claimRefs:
              - CE001
              - CE009
              - CE012
              - CE013
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Concrete cargo demonstration
            body: >-
              The reported 1.2-tonne, three-container airdrop is a measurable technical milestone and supports the
              modular-cargo concept, but it remains a single early-stage test.
            calloutType: strength
            claimRefs:
              - CE006
              - CE007
              - CE008
          - type: callout
            title: Undisclosed assurance stack
            body: >-
              The assigned evidence does not establish command-link resilience, secure autonomy, airworthiness, incident
              performance, fleet uptime, or service support for Tengden's aircraft.
            calloutType: risk
            claimRefs:
              - CE009
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer and user segmentation
        blocks:
          - type: paragraph
            body: >-
              Tengden's prospectus describes a multi-segment model spanning defense equipment, low-altitude economy, and
              general aviation. Its disclosed end-user groups include military and defense-industrial customers, central
              state-owned enterprises, research institutes, large general-aviation operators, government emergency
              departments, and weather-modification departments. The same filing says the product set includes large
              fixed-wing UAVs, unmanned helicopters, amphibious UAVs, and swarm sub-aircraft, with applications in
              reconnaissance and strike, battlefield support, emergency communications, weather modification, and
              logistics. This is a programmatic, procurement-led customer model: the relevant buyer, user, and payer can
              differ, and the filing does not disclose a complete account list, revenue split, or repeat-purchase
              denominator.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption and named deployment proof
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports engineering and operational milestones, but it does not establish a broad
              installed base or durable recurring usage. A Wuhu government-affiliated news report describes D18
              completing a 1.2-ton, three-package continuous airdrop test at 300 meters, with claimed landing accuracy
              within 100 meters, and identifies emergency scenarios including earthquakes, floods, and maritime
              disasters. The report also names a production-line start date, a first flight, and planned highland tests.
              Aviation Week independently reported the D18 display at Aero Asia 2025 and described its 4,350-kilogram
              gross weight and first flight, but the accessible text is subscription-limited. These sources support
              named product and test evidence, not customer contracts, paid deployment, or retention.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU005
              - CU007
              - CU010
              - CU012
      - number: '6.3'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              The prospectus reports that the five largest customers represented 85.16%, 87.01%, and 76.55% of sales in
              the disclosed reporting periods, and attributes the concentration to specific end users and relationships
              with leading customers. It also explains that defense and other institutional buyers use budget management
              and centralized procurement, so implementation and acceptance are weighted toward the second half of the
              year. The filing identifies receivables from specific customers, defense state-owned enterprises, research
              institutes, general-aviation operators, government emergency departments, and weather-modification
              departments, with collection timing exposed to budget and operating conditions. No public source in the
              assigned pool provides NRR, GRR, churn, renewal rates, contract length, cohort retention, or a verified
              customer count; expansion should therefore be treated as an underwriting question rather than an
              established operating metric.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU011
      - number: '6.4'
        title: Customer diligence implications
        blocks:
          - type: paragraph
            body: >-
              The evidence indicates that Tengden's commercial proof is strongest at the product-validation and
              mission-demonstration layer, while customer durability remains less transparent. The central diligence
              questions are whether D18 and other platforms have paid production deployments, which counterparties are
              the economic buyers, how much revenue is defense versus civil and emergency use, and whether acceptance
              schedules create material working-capital swings. The U.S. Covered List separately illustrates that
              foreign-produced UAS and critical components can face procurement restrictions in U.S. government-related
              channels, and the State Department describes case-by-case UAS export review; these are market-access
              constraints, not evidence that Tengden itself is named on either page.
            claimRefs:
              - CU013
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Mission-specific proof exists
            body: >-
              A named D18 test demonstrates a concrete emergency-response use case with reported payload and flight-test
              results, stronger than an unaudited logo list but still short of paid production adoption.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
          - type: callout
            title: Concentration and retention remain material gaps
            body: >-
              Disclosed top-five customer concentration above 76% in each cited period, together with seasonal
              acceptance and no public retention metrics, leaves customer durability and cash conversion highly
              sensitive to a small number of institutional programs.
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Policy, regulatory, and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Tengden's dual-use position creates a structural policy risk rather than a single disclosed legal
              incident. The China Aerospace Studies Institute described the company as ostensibly private while
              documenting government-linked ownership, military-equipment certifications, weapons-export licensing, and
              cooperation with PLA-linked institutions. That combination can support procurement and funding, but it
              also increases exposure to export controls, sanctions, end-use scrutiny, and changing national-security
              policy. The January 2026 Bureau of Industry and Security rule eased licensing for some civil UAVs and
              certain long-range cargo or agricultural drones to specified partners, while retaining notification and
              reporting requirements; it is not evidence that Tengden products qualify. Separately, a July 2025 U.S.
              Senate release proposed treating UAS differently in defense-transfer rules to help American suppliers
              compete with Chinese military technology. These policy signals point in opposite directions, so the
              monitorable risk is jurisdiction- and product-specific eligibility, not a blanket conclusion about access.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operating, quality, and technical execution
        blocks:
          - type: paragraph
            body: >-
              Tengden is scaling a heterogeneous fleet: the 2025 exposition listing describes two-, three-, and
              four-engine fixed-wing platforms, a large unmanned transport aircraft, an amphibious system, and a
              highland unmanned helicopter. That breadth creates integration, certification, maintenance, and support
              complexity across different airfields, payloads, weather conditions, and mission profiles. The same
              listing reports performance specifications and intended applications, but it is an exhibitor source and
              does not establish production yield, fleet availability, reliability, or independent acceptance testing.
              Independent technical descriptions of the TB-001 similarly identify demanding operating environments and
              multiple communications and payload configurations. The most important unresolved operating risk is
              therefore not whether the designs have plausible specifications, but whether Tengden can repeatedly
              deliver safe, supportable systems at scale. Public evidence supplied for this run does not verify a
              company-specific accident, outage, cyber incident, recall, or quality rate.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR009
              - CR011
      - number: '7.3'
        title: Dependencies, financial resilience, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              The financing profile is a material risk because the June 2026 IPO report describes rapidly rising
              operating revenue alongside recurring attributable net losses: approximately RMB175 million, RMB315
              million, and RMB379 million of revenue in 2023–2025, with attributable net losses of approximately RMB469
              million, RMB364 million, and RMB426 million, respectively. The proposed RMB3.021 billion offering is
              presented as funding product development, production capacity, a research base, an industrial UAV program,
              a research institute, and working capital; it is a proposed financing plan, not cash already available.
              The same report does not provide standalone cash, burn, runway, debt, or customer concentration. Older
              independent analysis also describes government investment, tax credits, and large facility expansion,
              while a named SF Express logistics collaboration and Huawei repair deployment demonstrate dependency and
              customer-proof surfaces without proving repeat commercial demand. The thesis should break or be materially
              downgraded if the IPO is withdrawn or materially downsized, losses continue without credible funding,
              production capacity does not convert into accepted deployments, or export and military end-use
              restrictions close the target markets.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break trigger
            body: >-
              The investment case should be re-underwritten if the proposed financing does not close on acceptable
              terms, if recurring losses persist without a documented funding runway, or if export and procurement rules
              materially exclude Tengden's target models.
            calloutType: risk
            claimRefs:
              - CR003
              - CR009
              - CR010
          - type: callout
            title: Evidence boundary
            body: >-
              The assigned public record does not establish current accident, cyber, outage, recall,
              customer-concentration, cash, burn, debt, or board data; these are diligence gaps rather than evidence of
              absence.
            calloutType: assumption
            claimRefs:
              - CR008
              - CR010
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Tengden's positive case is built on observable engineering and procurement traction rather than on
              recurring-revenue evidence. China Aerospace Studies Institute (CASI) reports that the company expanded
              production facilities and that the TB-001 is already in PLA service; it also describes likely procurement
              interest from the PLA, while explicitly noting that the evidence is not conclusive for PLAN operational
              fielding. A public market-oriented profile reports that Tengden completed a financing round of more than
              RMB1 billion in 2023 and was valued at more than RMB12 billion after that round. The anti-thesis is
              stronger for underwriting purposes. A June 2026 IPO report gives 2023–2025 revenue of approximately RMB175
              million, RMB315 million, and RMB379 million, alongside attributable net losses of approximately RMB469
              million, RMB364 million, and RMB426 million. That revenue-loss profile makes the prior private valuation
              difficult to assess without a cap table, preferred-rights terms, cash balance, order backlog, and margin
              bridge. The recommendation is therefore research-more: the company may have strategic value, but the
              public record does not establish an investable entry price.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The latest disclosed financing context is incomplete. The 36Kr-hosted profile says the June 2025 financing
              round did not disclose either the amount raised or the post-money valuation, even though it compares the
              company with other low-altitude-economy unicorns using the prior RMB12.2 billion valuation. The June 2026
              IPO acceptance report instead states that Tengden plans to raise approximately RMB3.021 billion, after
              issuance expenses, for product development, production capacity, an unmanned-sub-aircraft base, an
              industrial-UAV project, a research institute, and working capital. A proposed IPO raise is not cash
              available before issuance and is not equivalent to enterprise value. The two market-data pages provide a
              public comparable rather than a Tengden valuation: EHang's market capitalization is reported at $0.26
              billion as of October 2026 by CompaniesMarketcap, while Macrotrends reports $0.771 billion as of June 10,
              2026 and $0.073 billion of revenue. The conflicting dates and values make the pages a directional range,
              not a precise comp multiple. Entry discipline should therefore require verified IPO pricing, fully diluted
              shares, preferred preferences, net cash or debt, and a reconciliation from reported revenue to gross
              margin and cash burn.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV011
      - number: '8.3'
        title: Scenarios, comparables, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The bull case assumes the IPO funds capacity without punitive dilution, PLA and civil demand convert into
              repeat orders, and losses narrow as production scales. CASI's observation that the expanded facility is
              associated with approximately 200 large UAVs of annual production capacity is a capacity signal, not proof
              of shipments or profitability. The base case assumes strategic demand persists but public disclosures
              remain too thin to underwrite a return, so the appropriate posture is to track the IPO process and request
              primary financial statements. The bear case combines persistent losses, dilution or preference overhang, a
              lower-than-expected order conversion, export or policy restrictions, and public-market multiple
              compression. The broader Chinese low-altitude market is expanding, but People's Daily also reports that
              many demonstration zones remain focused on single functions and are still some distance from an integrated
              ecosystem; sector growth should not be substituted for Tengden-specific economics. The most important
              thesis-break triggers are an IPO price implying a premium to the undisclosed private mark without stronger
              margins, a failure to disclose backlog and customer concentration, continued losses without a credible
              path to contribution margin, or restrictions that limit military and civil commercialization.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV011
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV015
      - number: '8.4'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness cannot be scored confidently from public evidence. An IPO filing process creates a possible
              liquidity path, but acceptance is not listing, pricing, or successful settlement. The diligence package
              should obtain the latest prospectus, audited financial statements, revenue by customer and product,
              backlog aging, gross-margin reconciliation, cash and debt schedule, cap table, preferred rights,
              related-party transactions, and board composition. It should also test whether the TB-001 and related
              platforms are being procured under repeatable contracts or under policy-supported programs with uncertain
              duration. Army Recognition's comparison of another Chinese armed-UAV platform illustrates that lower-cost
              positioning can be commercially attractive while still leaving performance and export-policy trade-offs;
              it is a market-context source, not a Tengden price benchmark. Until those questions are answered, the
              defensible conclusion is research-more with a high risk rating and unknown-to-stretched valuation stance
              rather than a price target.
            claimRefs:
              - CV004
              - CV006
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits separate company-specific evidence from directional public comparables and scenario
              assumptions. Values are retained in their reported currencies and periods; no conversion, implied
              multiple, probability-weighted valuation, or return is presented where the public record does not supply
              the required denominator. This prevents a reported financing target, an old private mark, or a
              date-specific public market capitalization from being mistaken for a current enterprise value. The tables
              therefore emphasize decision gates and missing inputs rather than invented price targets.
            claimRefs:
              - CV003
              - CV006
              - CV009
              - CV014
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more pending priced disclosure
            body: >-
              Tengden has credible strategic and engineering evidence, but the public record does not support a current
              price-sensitive buy decision. Require the prospectus, audited statements, cap table, backlog, customer
              concentration, and margin bridge before underwriting entry.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV015
          - type: callout
            title: The prior private mark is not a current valuation
            body: >-
              The reported valuation above RMB12bn followed a 2023 financing round, while the later IPO report shows
              continuing attributable losses. Without current price and dilution terms, treating the private mark as
              fair value would be false precision.
            calloutType: risk
            claimRefs:
              - CV003
              - CV005
              - CV006
