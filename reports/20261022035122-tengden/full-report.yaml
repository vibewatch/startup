      - number: '1.4'
        title: Evidence boundaries and decision implications
        blocks:
          - type: paragraph
            body: >-
              Operational evidence is stronger than commercial evidence. CASI links the company's expanding facilities
              and TB-001 variants to likely PLA procurement, while explicitly noting that the evidence is not conclusive
              proof of PLAN operational fielding. Aviationist and The War Zone independently describe the August 2024
              maiden flight of Tengden's cargo UAV and its stated 2,000-kilogram payload, but The War Zone also says
              Tengden had not released details on the aircraft's autonomy. The company's public profile therefore
              supports engineering depth and state-linked demand, not a verified customer count, recurring revenue
              profile, cash runway, or sustainable margin. Those gaps should constrain any valuation conclusion.
              People's Daily reported 18 civilian-drone approvals during 2021-2025 and nearly 30 ton-class drones under
              development by the end of 2025; that is evidence of an active adjacent market, not proof of Tengden
              customer demand.
