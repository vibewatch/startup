  - id: FE001
    title: Evidence-bounded product architecture map
    type: stack
    summary: >-
      Tengden's disclosed system progresses from mission applications through platform and payload choices to largely
      undisclosed control, deployment, and sustainment layers.
    data:
      layers:
        - label: Mission applications
          items:
