          details: Exhibition material dates the Scorpion A first flight to 16 January 2020.
          tone: positive
        - date: '2022'
          label: Original Zigong facility completed
          details: CASI reports the first facility at Zigong Aviation Industry Park was completed in 2022.
          tone: positive
        - date: '2022-05-08'
