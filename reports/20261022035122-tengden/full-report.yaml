        - A prior private mark above RMB12bn is reported; current post-IPO value is undisclosed.
        - The prior mark cannot be validated against current losses or dilution.
        - unknown
    notes: >-
      Company-specific financing and operating figures are reported by the cited sources; no current equity price or
      fully diluted share count is available.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Argument
      - Evidence
      - What would change the view
      - Current assessment
    rows:
      - - Engineering and procurement traction
        - CASI reports facility expansion and TB-001 service or testing evidence involving PLA elements.
        - Audited backlog and repeat-customer contracts.
        - positive but unpriced
      - - Strategic market relevance
        - TB-001 is described as a PLA-used MALE UCAV and the sector has broad Chinese deployment examples.
        - Evidence of paid, repeat civil and defense orders.
        - supportive
      - - Financial quality
        - 2023–2025 revenue rises from RMB175m to RMB379m while each reported year remains loss-making.
        - Audited gross margin, cash conversion, and a credible loss-reduction plan.
        - adverse
      - - Liquidity and dilution
        - IPO plans to raise approximately RMB3.021bn; terms and pricing are not disclosed.
        - Prospectus, price range, fully diluted cap table, and preference treatment.
        - unresolved
    notes: >-
      The table distinguishes operational evidence from financing evidence; an IPO fundraising target is not treated as
      current cash or valuation.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV011
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation or return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Capacity converts into repeat PLA and civil contracts; losses narrow after funded expansion; IPO terms are not
          punitive.
        - Potential re-rating after verified margin and backlog disclosure; no numeric target is supportable.
        - Policy dependence and execution.
        - low-to-medium
      - - Base
        - Strategic demand persists; IPO process advances; financial disclosure improves only gradually.
        - Track rather than underwrite; wait for price, cap table, cash, and margin evidence.
        - Opaque economics and dilution.
        - medium
      - - Bear
        - Losses persist; IPO pricing reflects the prior mark; orders or exports are constrained.
        - Downside through dilution, multiple compression, and weak liquidity.
        - Regulatory, concentration, and commercialization failure.
        - medium
      - - Trigger
        - A priced prospectus or audited update changes the denominator or risk profile.
        - Re-score only after reconciling enterprise value, net cash, shares, and normalized earnings.
        - Premature precision.
        - high relevance
    notes: >-
      Scenarios are qualitative because public sources do not provide the fully diluted share count, current price, net
      debt, or a reliable earnings base for a numeric valuation range.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV011
      - CV014
      - CV015
