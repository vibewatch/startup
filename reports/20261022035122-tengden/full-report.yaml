              - CE004
              - CE005
              - CE006
              - CE007
              - CE010
              - CE011
      - number: '5.2'
        title: Architecture and technical proof
        blocks:
          - type: paragraph
            body: >-
              The disclosed architecture centers on mission-configurable aircraft rather than a documented software
              stack. Tengden-supplied material describes multiple airframes with different propulsion layouts, endurance
              profiles, payload capacities, and takeoff environments. Independent reporting provides a stronger proof
              point for the four-engine cargo configuration: three containers totaling 1.2 tonnes were dropped from 300
              meters and landed within 100 meters of the target. The same source describes a modular cargo compartment
              and more than 600 kilometers of loaded airdrop range. However, it also says control and navigation details
              were not disclosed. The resulting architecture map is therefore an evidence-bounded operating model, not a
              representation of a verified autonomy, communications, or cybersecurity design.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
