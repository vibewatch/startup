evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited revenue, gross margin, burn, and operating cash-flow statements for Inceptio were not available in the
      reviewed public source set.
    whyItMatters: >-
      Without real financial statements, commercialization milestones cannot be converted into unit economics or
      durability of capital-runway judgments.
    diligencePath: >-
      Request management financials, audited investor materials, or an eventual IPO filing; cross-check with
      customer-procurement evidence and manufacturing economics.
    relatedQuestionRefs:
      - QO019
      - QO022
    relatedTableRefs:
      - TO001
      - TO004
  - type: missing-source
    severity: material
    topic: governance-structure
    missingEvidence: >-
      The reviewed English-language sources do not expose a clean current board roster, CFO ownership, or
      independent-director structure.
    whyItMatters: >-
      Leadership concentration around Julian Ma may be acceptable, but investors still need to understand succession,
      finance control, and governance checks.
    diligencePath: >-
      Obtain Chinese corporate records, board materials, or management briefing documents that identify directors,
      finance leadership, and voting/control arrangements.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: funding-reconciliation
    missingEvidence: >-
      Total funding figures from Reuters and private-company databases exceed the sum of the publicly detailed 2020-2022
      rounds in the reviewed source set.
    whyItMatters: >-
      A clean funding history is necessary to estimate dilution, investor entry points, and any implied private-market
      valuation step-ups before an IPO or trade sale.
    diligencePath: >-
      Rebuild the cap table from legal financing documents, shareholder registers, or data-room cap-table exports rather
      than relying on press-release summaries.
    relatedQuestionRefs:
      - QO008
      - QO023
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: brand-vs-legal-entity
    missingEvidence: >-
      Official website footers reference Jiluo Technology (Shanghai) Co., Ltd., but the precise relationship between
      that entity and the Inceptio Technology brand is not fully explained publicly.
    whyItMatters: >-
      Entity mapping matters for contracting, intellectual-property ownership, and any future IPO or restructuring
      analysis.
    diligencePath: >-
      Pull Chinese registration records and corporate filings to map operating, holding, and IP-owning entities under
      the Inceptio brand.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: corridor-level-sam
    missingEvidence: >-
      The retained public sources do not provide a route-by-route map of which Chinese freight corridors permit which
      autonomy levels, operators, or remote-operations models.
    whyItMatters: >-
      Without a corridor inventory, the difference between headline TAM and real serviceable market remains too large
      for precise penetration modeling.
    diligencePath: >-
      Build a corridor-by-corridor permit database from municipal pilot notices, OEM permits, and operator deployment
      records.
    relatedQuestionRefs:
      - QM020
      - QM024
    relatedTableRefs:
      - TM004
    relatedFigureRefs:
      - FM004
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Public route-economics evidence relies mostly on company-linked or analyst-reported case studies rather than on
      audited fleet cohorts, retention data, or software attach margins.
    whyItMatters: >-
      Adoption willingness and valuation both depend on whether savings persist across heterogeneous fleets and whether
      Inceptio captures a durable software gross margin.
    diligencePath: Request fleet-cohort reporting by route, attach-rate, accident, utilization, renewal, and gross-margin outcomes.
    relatedQuestionRefs:
      - QM013
      - QM025
    relatedTableRefs:
      - TM004
  - type: conflicting-data
    severity: material
    topic: market-methodology
    missingEvidence: >-
      The retained sources mix freight spend, broad AV forecasts, heavy-truck penetration, and scenario-based
      autonomous-truck revenue without a common denominator or harmonized methodology.
    whyItMatters: >-
      Using the largest number without scope normalization would materially overstate the market opportunity relevant to
      Inceptio.
    diligencePath: >-
      Normalize all TAM inputs by scope, year, unit, and buyer type before converting any market lens into a valuation
      case.
    relatedQuestionRefs:
      - QM022
      - QM023
    relatedTableRefs:
      - TM002
    relatedFigureRefs:
      - FM001
      - FM002
  - type: missing-source
    severity: minor
    topic: shipper-budget-ownership
    missingEvidence: >-
      The public corpus does not clearly disclose which share of the autonomy budget is borne by fleet owners versus
      shippers in later-stage managed-service deployments.
    whyItMatters: >-
      Monetization architecture changes meaningfully depending on whether Inceptio sells truck features, subscriptions,
      or freight-service outcomes.
    diligencePath: >-
      Interview current customers and review commercial contracts to separate capex buyers, opex buyers, and
      freight-service payers.
    relatedQuestionRefs:
      - QM015
    relatedTableRefs:
      - TM003
    relatedFigureRefs:
      - FM003
  - type: private-evidence-only
    severity: material
    topic: peer-pricing-disclosure
    missingEvidence: >-
      Realized contract pricing, per-mile tariffs, or list-to-net waterfalls for Aurora, Kodiak, Waabi, Torc, and most
      other peers were not publicly disclosed in the retained source set.
    whyItMatters: >-
      Without clean peer pricing, investors cannot benchmark whether Inceptio's route-level economics are genuinely
      superior or simply better publicized.
    diligencePath: >-
      Request signed commercial pricing schedules or anonymized customer contracts for the most directly comparable
      freight routes.
    relatedQuestionRefs:
      - QP015
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: peer-funding-comparability
    missingEvidence: >-
      A consistent, audited funding or valuation framework across public, private, and captive trucking peers was not
      available from retained public sources.
    whyItMatters: >-
      Capital scale affects runway and speed of commercialization, but noisy database comparisons can easily mislead
      underwriting.
    diligencePath: >-
      Normalize peer capital by date, net cash, business mix, and current ownership status before using it in any moat
      model.
    relatedQuestionRefs:
      - QP022
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: customer-lock-in-metrics
    missingEvidence: >-
      No public renewal rates, attach rates, exclusivity clauses, or expansion cohorts were found for Inceptio's OEM or
      fleet relationships.
    whyItMatters: >-
      The strongest-looking deployment moat can still be fragile if customers multi-home or OEMs preserve easy
      switching.
    diligencePath: Request renewal cohorts, program duration, exclusivity terms, and expansion revenue by OEM and fleet account.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: revenue-recognition
    missingEvidence: >-
      No public contract or accounting disclosure shows whether Inceptio books revenue at truck delivery, option
      activation, software service, or managed-operation milestones.
    whyItMatters: Revenue timing and mix directly affect the quality, seasonality, and scalability of the model.
    diligencePath: Request sample customer contracts, revenue-recognition memo, and audited stream-level revenue bridge.
    relatedQuestionRefs:
      - QI012
    relatedTableRefs:
      - TI001
      - TI005
  - type: private-evidence-only
    severity: material
    topic: cash-burn-runway
    missingEvidence: No public cash balance, monthly burn, runway months, or downside financing plan appears in retained materials.
    whyItMatters: >-
      Without runway data, investors cannot judge dilution timing, solvency, or whether commercialization can be
      self-funded through the next milestone.
    diligencePath: Request latest cash balance, monthly cash bridge, base / bear runway, and next-round trigger thresholds.
    relatedQuestionRefs:
      - QI017
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: debt-and-obligations
    missingEvidence: No public debt, lease, guarantee, or project-finance schedule was found.
    whyItMatters: Hidden leverage or partner commitments can materially change equity risk and cash needs.
    diligencePath: Request complete obligations schedule, covenant package, and contingent-liability summary.
    relatedQuestionRefs:
      - QI018
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-renewals
    missingEvidence: >-
      Public materials name customers but do not disclose concentration percentages, renewal rates, cohort retention, or
      expansion economics.
    whyItMatters: A small set of large fleets could dominate revenue and compress pricing power.
    diligencePath: Request top-10 customer revenue share, renewal history, contract duration, and expansion metrics by cohort.
    relatedQuestionRefs:
      - QI021
    relatedTableRefs:
      - TI005
  - type: private-evidence-only
    severity: material
    topic: software-attach-and-recurring-mix
    missingEvidence: >-
      No public attach-rate, recurring-revenue mix, or contribution-margin disclosure was found for the software and
      service layer.
    whyItMatters: >-
      The investment case depends on whether Inceptio can capture recurring economics beyond hardware-enabled truck
      programs.
    diligencePath: Request attach rates, recurring-revenue cohorts, gross margin by stream, CAC, and payback by channel.
    relatedQuestionRefs:
      - QI023
    relatedTableRefs:
      - TI001
      - TI003
      - TI005
