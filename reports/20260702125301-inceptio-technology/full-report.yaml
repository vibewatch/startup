      - number: '5.5'
        title: Dependencies and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              The biggest product risk is not whether Inceptio can demo autonomy on a single route; it is whether the
              company can industrialize the stack fast enough, across enough OEM programs, while still accumulating the
              data needed for L4. The public dependency map shows three tight couplings: Horizon’s chip roadmap,
              partner-OEM production cadence, and regulatory tolerance for supervised-to-driverless progression. Taurus
              reduces integration complexity, but it also increases the importance of a specific silicon and software
              co-design path.


              There are also evidence-quality limits. Public materials disagree on some presentation details such as
              current production sensor range framing, and no reviewed source publishes the platform-level breakdown for
              failures, interventions, or dual-sourcing strategy. CNBC’s 2026 reporting underscores the main gating
              reality: generative-AI excitement does not shorten the path if real truck data, production partners, and
              approvals remain the bottlenecks. That is why the right diligence posture is to treat the stack as
              advanced and commercially proven in supervised highway operation, but still dependent on several external
              systems for the L4 end state.
