  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >-
              Inceptio should be analyzed first as a China freight-efficiency company and only second as an autonomy
              story. The most useful market boundary starts with China road freight because that is where fleets,
              shippers, and logistics operators already spend on tractors, drivers, utilization, safety, and fuel.
              Inside that denominator, Inceptio's practical near-term wedge is smart heavy-duty trucking:
              factory-installed autonomous-driving systems on serial-production trucks, initially at L2+/L3 and only
              later moving toward driverless freight services on specific corridors. Broad autonomous-vehicle spending
              is directionally relevant, but it mixes passenger autonomy, robotaxis, consumer ADAS, and non-freight use
              cases whose buyers and deployment rules differ materially from long-haul trucking.


              The excluded categories are therefore important. Passenger AV, warehouse robots, rail or ocean freight,
              pure fleet-software spend, and generic charging infrastructure all touch the logistics technology stack,
              but they are not the buyer job Inceptio is solving. The current substitute set is much more concrete:
              manually driven diesel tractors, manually operated electric heavy-duty trucks, and labor-intensive relay
              or drop-and-hook operations on trunk routes. IDTechEx's China analysis is especially useful here because
              it frames autonomous trucking as an assist-first, automate-later market: freight routes are fixed, costs
              are measurable, and the immediate budget case comes from labor, fuel, safety, and utilization rather than
              from speculative full-L4 timelines.
            claimRefs:
