        title: Trust, Safety, Cybersecurity, and Quality Controls
        blocks:
          - type: paragraph
            body: >-
              The trust stack is more concrete than many private autonomy companies publish. Inceptio has public claims
              around SGS ASIL-D functional-safety certification, TÜV Rheinland ISO/SAE 21434 cybersecurity
              certification, Tencent Keen Labs testing, ASPICE CL2 process certification, and Taurus EV/DV/PV validation
              with ASIL-B and ISO 21434 references. The white-paper and roadmap materials also emphasize “Safety First”
              as a development-system principle spanning R&D, testing, and serial production.


              Even so, diligence should distinguish between process credentials and field reliability data.
              Certifications show that Inceptio invested early in automotive-grade development methods and cyber
              controls, which is useful for OEM credibility. They do not, on their own, disclose disengagement rates,
              MTBF by platform, incident investigation process, or failure distribution across sensor, compute, and
              control subsystems. The control framework therefore looks directionally strong, but independent operating
              evidence remains thinner than the marketing surface of the certification stack.
