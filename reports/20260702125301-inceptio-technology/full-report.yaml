      - number: '3.4'
        title: Moat Durability, Regulatory Friction, and Competitive Verdict
        blocks:
          - type: paragraph
            body: >-
              Inceptio’s moat is durable only if its China deployment lead compounds into a harder-to-copy data, OEM,
              and customer relationship advantage before driverless commercialization fully opens elsewhere. The
              positive case is real: route data at scale, OEM-preload integration, supplier credibility improvements
              such as ASPICE CL2, and repeated evidence that large express fleets are willing to deploy Inceptio-powered
              trucks. The disconfirming evidence is also real. Aurora already has a true driverless commercial freight
              narrative in the U.S.; Torc shows that a major OEM may keep autonomy value captive; AI model progress does
              not eliminate regulatory gates; and Inceptio itself has said the U.S. market is beyond reach for
              geopolitical reasons. The balanced verdict is that Inceptio currently leads the China commercialization
              lane and has one of the strongest disclosed trucking data flywheels, but its moat is still more domestic,
              distribution-driven, and OEM-dependent than globally proven at L4.
