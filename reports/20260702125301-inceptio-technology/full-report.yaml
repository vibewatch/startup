      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              The buyer map is multi-stage because Inceptio is effectively selling a stack: a smart truck platform, an
              assisted-driving operating layer, and eventually a higher-autonomy freight service. In phase one, the
              direct buyer is usually the fleet owner, leasing arm, or transport operator deciding on truck capex. The
              user is a combination of driver, dispatcher, safety manager, and route operator; the payer is usually the
              fleet P&L owner or CFO-equivalent who cares about TCO, asset utilization, financing, and downtime. In
              phase two, the budget case shifts toward operating economics. The truck is already in service, and the
              question becomes whether the autonomy layer pays back through fewer drivers, safer operations, lower fuel
              burn, and better route productivity.


              This is why line-haul carriers, express networks, contract logistics providers, and other high-frequency
              freight operators matter more than generic AV enthusiasts. Reuters and adjacent commercialization sources
              suggest Inceptio's early customer base already spans express, full-truckload, less-than-truckload, and
              brand-linked contract logistics. The buyer logic is corridor-specific rather than sector-generic: routes
              with predictable demand, labor pressure, and high annual mileage are much easier to underwrite than
              one-off or irregular freight. OEM partnerships with Dongfeng, Sinotruk, and Foton also matter because
              adoption rides on factory-installed platforms and service networks, not on a pure aftermarket-retrofit
              model. In practice, that means budget ownership sits where truck replacement, route economics, and safety
              accountability already live.
