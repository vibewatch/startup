      - number: '7.3'
        title: OEM, partner, and marquee-customer dependencies compress strategic flexibility even as they prove demand
        blocks:
          - type: paragraph
            body: >-
              Inceptio’s commercialization model is clearly working through mass production with OEM partners and
              through large logistics accounts willing to serve as proof points. The 2023 PRNewswire milestone
              highlighted Dongfeng and Sinotruk, while the 2024 ZTO delivery coverage tied one of the company’s most
              visible reference accounts to Dongfeng Commercial Vehicle. That partner structure is a strength because it
              lets Inceptio ship factory-integrated trucks instead of retrofits. It is also a concentration risk because
              product breadth, deployment speed, and customer credibility all depend on counterparties outside the
              company’s direct control.


              Customer concentration risk is similarly double-edged. PRNewswire cited Budweiser, Nestlé, JD Logistics,
              and Deppon Express as early users, and the ZTO deployment became the public symbol of scale in at least
              six different trade outlets. That is great for narrative formation, but it also means the market could
              re-rate quickly if a few flagship fleets fail to renew, if labor or fuel savings are weaker than expected,
              or if a high-profile deployment produces safety or uptime problems. Inceptio does not look like a
              single-customer company, but its public proof still relies heavily on a narrow group of marquee examples.
              That creates residual risk around renewal, reference quality, and pricing leverage.
            claimRefs:
