  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - No real filing or audited economics
        - No filing-grade disclosure despite continued IPO signaling
        - Turns the story into a valuation narrative without a pricing foundation
        - Keep the stance at track or downgrade to research-more if pricing rises
      - - Permit path slips materially
        - No visible progress toward driverless commercial approval by 2027-2028 window
        - Reduces the value of the current kilometer lead as a valuation differentiator
        - Compress toward the low band
      - - Customer concentration proves too narrow
        - A handful of fleets account for most real deployment proof or repeat orders
        - Weakens the claim that commercialization is broad and repeatable
        - Apply a concentration discount even if top-line momentum looks strong
      - - Preferred stack or dilution is aggressive
        - New terms meaningfully subordinate common shareholders or raise fully diluted entry price
        - Cuts real return potential without changing the headline valuation
        - Require cap-table adjustment before investing
      - - Public peers de-rate while Inceptio stays private and opaque
        - China AV sentiment weakens faster than deployment milestones improve
        - Expands the disclosure discount and narrows exit windows
        - Re-underwrite using the low-case band
    notes: These triggers are designed to convert the current broad valuation band into concrete go / no-go checkpoints.
    claimRefs:
