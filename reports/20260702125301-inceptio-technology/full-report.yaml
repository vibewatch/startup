      - number: '2.4'
        title: Growth Drivers, Constraints, and What Still Needs Diligence
        blocks:
          - type: paragraph
            body: >-
              The strongest macro driver is structural inefficiency in Chinese logistics. China Daily, citing the China
              Logistics Information Center, says total logistics costs were 18.2 trillion yuan in 2023, equal to 14.4%
              of GDP, versus less than 10% in developed markets. That gap creates a clear ROI pool for any system that
              can lower labor intensity, reduce accidents, improve fuel economy, and increase truck utilization. Mordor
              adds two more supportive industry facts: the market is fragmented, the driver workforce is aging and
              short, and fleets still face empty-backhaul and cost volatility. Electrification is another important
              driver because smart or autonomous features attach much more naturally to fleets already refreshing into
              connected new-energy heavy-duty trucks.


              The constraints are equally material. Assisted-driving economics are real, but the most compelling public
              numbers still come from company-linked or analyst-reported case studies rather than from audited fleet
              cohorts. Regulation also remains a gating factor. China's policy direction is supportive, but
              higher-autonomy public-road deployment still depends on local pilots, corridor permissions, national
              safety standards still being finalized, and strict data and liability rules. The result is that market
              adoption should be underwritten as staged commercialization, not as immediate nationwide L4 freight
              substitution. Investors can reasonably believe the market is large and improving, while still demanding
              corridor-level permit maps, route-level unit economics, and normalized TAM methodologies before making
              aggressive penetration assumptions.
            claimRefs:
              - CM020
              - CM021
              - CM022
