      - number: '7.2'
        title: Operational and safety risk rises with scale because commercialization is now real, not hypothetical
        blocks:
          - type: paragraph
            body: >-
              Inceptio’s public operating evidence is strong enough to prove the company is not a concept-stage autonomy
              story, but that same fact increases operational and safety exposure. CNBC said the company had reached
              about 700 million commercial kilometers by late April 2026, while the Taurus release said the system now
              covers more than 97% of China’s expressways and is deployed on several thousand intelligent trucks. Edge
              AI and Vision Alliance also described the broader Chinese autonomous-truck category as surpassing one
              million kilometers a day by late 2025. At that level of activity, safety, hardware reliability, data
              transmission, and field-support failures stop being edge cases and become portfolio risks.


              The good news is that Inceptio has visible mitigants. Taurus claims ASIL-B functional safety, ISO 21434
              cybersecurity, automotive-grade validation, and better compute efficiency. The harder question is whether
              those mitigants are enough to de-risk a transition from assisted and supervised freight autonomy into
              driverless commercial operations. CNBC explicitly warned that better large-language models do not remove
              operations or regulatory bottlenecks, and the Taurus release itself highlights how much the system still
              depends on robust field data, network tolerance, and hardware validation. The risk is therefore not lack
              of progress; it is that the last ten percent of commercialization will be slower, costlier, and more
              incident-sensitive than the public mileage curve suggests.
            claimRefs:
