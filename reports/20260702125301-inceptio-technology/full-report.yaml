      - number: '3.3'
        title: Pricing, Packaging, and Buyer Economics
        blocks:
          - type: paragraph
            body: >-
              Public pricing remains one of the biggest blind spots in this market, so comparisons must be anchored in
              what is actually disclosed. Inceptio has the clearest public economic signal in this source set because
              IDTechEx and company-backed materials point to an approximately RMB 100,000 L2+ option, 10–24 month
              payback, and route-level labor and fuel savings. Aurora, by contrast, markets higher asset utilization,
              better fuel efficiency, and lower insurance cost potential, but does not publish realized per-mile
              pricing. PlusAI, Kodiak, Torc, Waabi, and Einride similarly disclose strategic value propositions more
              often than contract economics. That means buyer comparison today depends more on route fit, OEM
              integration depth, and proof of operational savings than on a clean public price sheet. It also means
              Inceptio’s disclosed route-level economics are a meaningful advantage in investor messaging even if
              realized list-to-net pricing and contribution margin remain private. That disclosure edge matters because
              buyers and investors can at least anchor procurement ROI, even while the company-level pricing waterfall,
              renewal patterns, and margin capture remain opaque. for investors today. Still.
