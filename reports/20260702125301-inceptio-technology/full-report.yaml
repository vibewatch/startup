      - number: '8.5'
        title: The final call should move only when diligence closes the handful of inputs that can truly change value
        blocks:
          - type: paragraph
            body: >-
              The final investment debate is not whether Inceptio deserves attention; it clearly does. The real question
              is which missing facts could move the band enough to justify underwriting. Another milestone on cumulative
              kilometers matters, but it will not matter as much as a real filing, a revenue bridge, gross-margin
              disclosure, customer concentration data, or a clean view of the preference stack. Likewise, another
              customer case study helps, but it will not matter as much as evidence that the company can convert current
              L2+/L3 scale into driverless commercial approvals on something close to management’s timetable.


              That is why the chapter stays disciplined. If a filing emerges, if the company discloses revenue quality,
              and if the permit path becomes more concrete, the high case becomes more believable quickly. If disclosure
              remains thin while the IPO clock keeps moving and regulators remain cautious, even the base case should be
              discounted. The practical next step is therefore to ask for the smallest diligence pack that can change
              the recommendation: economics, concentration, cap table, and permit roadmap.
