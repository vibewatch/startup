      - CV027
      - CV028
      - CV033
      - CV034
      - CV037
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: Low, base, and high ranges highlight why disclosure quality is the main gating factor for upside today.
    approximationNotes: >-
      Ranges are analytical valuation bands in USD billions built from floor, funding, commercialization status, and
      disclosure quality.
    data:
