  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Inceptio’s product should be understood as a supervised highway-autonomy stack sold into the line-haul
              truck workflow, not as a consumer self-driving feature. A fleet buyer or logistics operator procures a
              serial-production truck from an OEM partner with Inceptio’s autonomous-driving package preloaded at the
              factory. The truck then runs long-distance express, LTL, FTL, contract-logistics, or cold-chain routes
              with a human in the cab acting as safety supervisor while Truck-NOA handles the repetitive highway work:
              cruising, ramp transitions, lane changes, intelligent following, and fuel-aware speed planning.


              That workflow matters because the buyer does not need to redesign dispatch around a robot-only operating
              model. The practical commercial pitch is easier-to-staff long-haul lanes, lower fatigue, lower warning
              rates, better fuel control, and a path from today’s supervised L2+/L3 operation toward future L4 service.
              Inceptio’s pages repeatedly frame the technology around safer and more efficient line-haul logistics
              rather than generalized autonomy, which is consistent with the company’s route, OEM, and customer
              disclosures.
