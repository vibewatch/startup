  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      Illustrative valuation anchors show how disclosure and milestone quality move the defendable band more than raw
      mileage headlines do.
    approximationNotes: Values are editorial anchor points in USD billions, not quoted market marks or management guidance.
    data:
