  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation
        blocks:
          - type: paragraph
            body: >-
              Inceptio’s public customer surface is broader than one headline ZTO deal. The visible base spans express
              parcel carriers (ZTO, YTO, STO, ZTO Freight, Yunyi), less-than-truckload and express specialists (Kuayue),
              contract-logistics operators (Huatai), cold-chain carriers (Deshun), and brand-owner lanes routed through
              logistics partners (Budweiser and Nestlé). That segmentation matters because the buyer, user, and payer
              are not always the same entity. Sometimes the buyer is a fleet operator or logistics service provider;
              sometimes the strategic demand signal comes from a brand owner that wants greener, safer replenishment;
              and the user remains a professional driver acting as safety supervisor.


              The practical commonality is long-haul route economics. Public cases emphasize 700- to 1,500-kilometer
              corridors where a supervised autonomy system can replace a two-driver workflow, lower fatigue, and improve
              fuel efficiency without waiting for L4 regulation. That explains why Inceptio’s strongest public proof
              appears in Chinese line-haul logistics rather than in general-purpose urban distribution.
