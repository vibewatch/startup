      - number: '1.3'
        title: Funding History, Unicorn Status, and IPO Optionality
        blocks:
          - type: paragraph
            body: >-
              Publicly described funding rounds create a credible but still incomplete capital history. Reviewed sources
              detail a $120 million round in November 2020 led by CATL, a $270 million Series B in August 2021 co-led by
              JD Logistics, Meituan, and PAG, and a $188 million Series B+ in February 2022 co-led by Sequoia China and
              Legend Capital. Reuters, Tracxn, and CB Insights all place Inceptio's total funding at roughly $678
              million to $678.68 million, which is directionally consistent with a well-funded private company but does
              not reconcile cleanly with the publicly itemized round totals alone.


              That mismatch matters because valuation is still opaque. A January 2025 Bloomberg report, summarized by
              TechNode, said Inceptio was exploring a U.S. IPO that could raise roughly $100 million to $200 million,
              but the reviewed source set does not show a public filing, a confirmed exchange, or a disclosed price
              range as of the canonical run date. Separately, a Changning district government page says Inceptio was
              included in the 2024 Hurun China Top 50 AI Enterprises list and explicitly labels it a unicorn enterprise;
              the same page notes the list's entry threshold was RMB 6 billion. That is useful directional evidence that
              market observers view Inceptio as a unicorn, but it is not a substitute for a disclosed post-money
              valuation or a current cap table.
