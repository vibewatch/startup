companyProfile:
  summary: >-
    Inceptio Technology is a Shanghai-based autonomous trucking company founded in April 2018 and led by founder-CEO
    Julian Ma. The company develops the proprietary Inceptio Autonomous Driving System for heavy-duty trucks, works with
    OEM partners such as Dongfeng, Sinotruk, and Foton to preload that stack into series-production trucks, and aims to
    extend those operations into a nationwide autonomous Transportation-as-a-Service freight network over time. Public
    milestones show the company moving from the industry's first series-production L3 heavy-duty trucks in late 2021 to
    more than 700 million kilometers of commercial operations by June 2026, alongside named logistics deployments such
    as a 400-truck delivery to ZTO Express. Funding history is well supported through the February 2022 Series B+
    extension, but revenue, gross margin, burn, and current valuation remain undisclosed in retained public sources.
