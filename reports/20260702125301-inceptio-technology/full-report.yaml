      - number: '8.2'
        title: The thesis is rare commercial density in autonomous trucking; the anti-thesis is missing financial disclosure
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is straightforward. TechNode, CNBC, the Taurus release, the Next Truck 2025 roadmap,
              and the ZTO delivery coverage all point in the same direction: Inceptio has built unusual real-world scale
              for a private autonomous-trucking company. Public evidence supports a move from more than 200 million
              kilometers in 2024 to around 700 million kilometers in 2026, several thousand trucks in operation, and
              route coverage across most of China’s expressways. That is materially stronger operational proof than many
              autonomy startups can show.


              The anti-thesis is equally clear. The same source pack that proves strategic relevance fails to provide
              filing-grade financial disclosure. Without a retained public filing, investors cannot test revenue
              quality, customer concentration, preferred-share overhang, gross margins, or capital efficiency. In other
              words, Inceptio may well deserve a venture-scale valuation, but the case for paying a public-market-style
              premium is still unproven. The company can be good while the current price is still too high; that
              distinction is the core discipline for this chapter.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
