            body: >-
              Public materials show a layered product portfolio rather than a single monolithic “truck.” At the software
              level, Inceptio markets Truck-NOA functions and the broader Inceptio Autonomous Driving System. At the
              vehicle level, it advertises supported serial-production platforms from DFCV, Sinotruk, Sitrak, Foton, and
              Chenglong. At the hardware level, it exposes multiple ADCU generations, moving from the original Xuanyuan
              launch configuration to Gen2 and now Taurus.


              This matters for diligence because Inceptio’s commercialization strategy depends on OEM compatibility and
              standardized adaptation work. The technology page claims a standardized SDK can adapt the stack to new
              vehicle models in 9–12 months, and Taurus is explicitly marketed as open and OEM-friendly. Those
              statements support an integration thesis: Inceptio wants to be inserted into existing commercial-truck
              programs as a repeatable platform supplier. They also define a core dependency risk: if OEM programs stall
              or chip-roadmap assumptions break, the commercial scaling engine slows with them.
