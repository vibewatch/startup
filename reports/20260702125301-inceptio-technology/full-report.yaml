      - number: '7.5'
        title: Mitigations exist, but the top kill triggers are measurable and should be monitored explicitly
        blocks:
          - type: paragraph
            body: >-
              Inceptio has real mitigants. The company is no longer proving basic product-market relevance; it has a
              visible installed base, a growing route footprint, named OEM relationships, and evidence that some
              customers are already standardizing autonomy features in new-truck procurement. Taurus also shows that
              management is still investing in safety, cybersecurity, and operating efficiency rather than simply
              marketing kilometers. Those are meaningful strengths and they make the company more investable than a
              purely pre-revenue autonomy lab.


              But the top risks are still measurable enough that investors should define kill criteria in advance
              instead of narrating around them. If China’s permit environment remains frozen or highly restrictive into
              2027, the driverless thesis is delayed. If the company misses its own mid-2028 driverless
              commercialization target, the L2+/L3 data-flywheel story becomes less valuable. If a flagship OEM or
              customer relationship weakens, the public proof stack loses credibility quickly. And if the listing path
              stays unfinished while external capital needs continue, financing optionality can disappear faster than
              the company’s operational headlines suggest. The right stance is therefore to monitor milestone
              conversion, not just headline mileage.
            claimRefs:
