      - number: '6.4'
        title: Retention, Durability, and Expansion Signals
        blocks:
          - type: paragraph
            body: >-
              Public retention evidence is much thinner than public deployment evidence. The cleanest repeat-purchase
              signal is STO: Inceptio explicitly disclosed earlier deliveries followed by a 350-truck follow-on order,
              which is strong evidence that the buyer saw enough value to expand. ZTO’s 400-truck purchase is itself
              meaningful scale proof, and the Taurus release’s claim that several express and delivery customers have
              made autonomy a standard feature in new-truck procurement suggests repeat behavior at the portfolio level.
              Deppon’s ongoing usage from 2021 into a 2024 independent ride-along also implies durability, though the
              public record does not disclose fleet size, contract term, or utilization trend.


              What is missing is standard software-style retention disclosure: no NRR, GRR, churn, contract duration, or
              customer-life-cycle table is public. Satisfaction is inferred from reorders, route continuity, driver
              quotes, and award programs rather than from disclosed renewal metrics. That means the chapter can support
              adoption and expansion qualitatively, but not precise retention underwriting.
