  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Market Shape
        blocks:
          - type: paragraph
            body: >-
              Inceptio competes in a field that is narrower than the broad autonomous-vehicle label suggests. The direct
              competition is other companies trying to automate freight movement on heavy-duty or line-haul routes:
              Aurora in U.S. hub-to-hub trucking, PlusAI in OEM-embedded autonomous trucks, Kodiak in driverless ground
              autonomy, Waabi in simulation-first autonomous trucks, Torc as Daimler’s captive Freightliner effort, and
              selected Pony.ai truck programs. Adjacent alternatives include Einride’s electric freight platform and
              fleet software, while the status quo substitute remains human-driven trucking plus progressively better
              ADAS. Inceptio’s own position is unusually specific: an OEM-preloaded, China-first, assist-first
              commercialization model that already spans express delivery, LTL, full-truckload, and contract logistics.
              That gives it more disclosed real-world freight exposure than most peers, but also means the most relevant
              comparisons are on deployment model and route economics, not on a generic AV ranking alone. This framing
              also avoids overstating generic autonomy rankings.
