        title: Revenue Model and What Is Actually Public
        blocks:
          - type: paragraph
            body: >-
              The public record supports a clear commercial architecture but not a public income statement. Inceptio
              describes itself as both an autonomous-trucking technology provider and a future TaaS freight-network
              operator, which implies at least three monetization layers: OEM-preloaded vehicle programs, optional
              assisted-driving packages, and operations or service revenue as autonomous freight scales. Reuters adds
              that Inceptio develops the technology while Dongfeng manufactures the trucks and fleets buy the vehicles,
              reinforcing that current monetization is embedded in truck programs rather than a disclosed pure-software
              subscription. The strongest public traction evidence is operational rather than financial: large customer
              deployments, thousands of trucks, and several hundred million commercial kilometers. But no retained
              source discloses revenue, ARR, deferred revenue, or a stream-by-stream recognition policy. Investors can
              see how the business should make money; they cannot see how much it is making today or how that revenue is
              booked.
