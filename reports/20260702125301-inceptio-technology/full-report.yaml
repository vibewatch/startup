  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner or diligence path
    rows:
      - - Revenue and gross margin
        - Current annualized revenue, gross margin by product, and any recurring-software contribution
        - These are the fastest ways to confirm whether the company deserves a premium above the unicorn floor.
        - Request latest board deck or audited management accounts.
      - - Customer concentration
        - Top 10 customers, repeat-order cadence, and share of deployed trucks by customer
        - Commercial proof looks strong, but valuation quality depends on how broad that proof really is.
        - Request customer concentration schedule and cohort renewal data.
      - - OEM concentration
        - Volume by truck OEM and model plus switching costs for future integrations
        - OEM dependence can amplify execution and pricing risk.
        - Request OEM partner scorecard and contract summary.
      - - Preference stack and dilution
        - Preferred terms, liquidation preferences, employee option pool, and fully diluted share count
        - Headline valuation is less useful if downside protection sits above new investors.
        - Request cap-table waterfall and last-round term sheet summary.
      - - Permit and regulatory roadmap
        - Current corridor approvals, next permit milestones, and expected path to driverless operations
        - Regulatory sequencing is a primary determinant of upside timing.
        - Request regulatory workplan and external counsel memo.
      - - Cash use and runway
        - Current burn, capex needs, and financing contingency plan if listing timing slips
        - Capital intensity can change the base case more than another mileage milestone.
        - Request 24-month operating plan with downside cases.
    notes: These asks are the smallest diligence pack likely to move the recommendation or the valuation band materially.
    claimRefs:
      - CV005
      - CV029
      - CV037
      - CV041
      - CV042
