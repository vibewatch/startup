  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: >-
          Recommendation is track because commercialization proof is real, but public valuation support is still
          incomplete
        blocks:
          - type: paragraph
            body: >-
              Inceptio is no longer a pure optionality story. Public sources show an autonomy company with large
              real-world deployment, named logistics customers, OEM integration, and enough financing history to stay
              strategically relevant. The hurdle is not whether the asset matters; it is whether outside investors can
              price it with enough confidence today. Hurun-related evidence supports a unicorn floor, the funding
              history supports a value above that floor, and Caplight plus TechNode show that an IPO path has at least
              been contemplated publicly. Those are real positives.


              The problem is that the key pricing inputs are still private. The retained SEC search source does not give
              this chapter a company-specific filing, and the public pack still lacks revenue, gross margin, cash-burn,
              and cap-table detail. That means a classic buy-versus-avoid framework would be too blunt. The right answer
              is track: keep the company in the investable set, but only underwrite entry if pricing is near a
              disciplined band or if diligence produces a real disclosure package. The evidence today supports medium
              confidence, high risk, and a fair-to-stretched valuation stance depending on where the next round or
              listing actually lands.
            claimRefs:
              - CV001
              - CV003
              - CV004
