        - label: Economics visibility
          value: 2
          unit: /5
          note: Revenue and gross margin remain undisclosed publicly.
        - label: Regulatory timing confidence
          value: 2
          unit: /5
          note: Mid-2028 target and permit uncertainty still cap conviction.
        - label: Valuation clarity
          value: 2
          unit: /5
          note: Band logic is possible; precision pricing is not.
