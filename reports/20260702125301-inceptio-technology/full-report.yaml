  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and cross-border risk is still the highest-severity constraint on the driverless thesis
        blocks:
          - type: paragraph
            body: >-
              China’s autonomy rules are progressing, but they are still not the same thing as an always-open national
              commercial market for driverless heavy trucks. Electrive, Law.asia, and CMS all describe an environment
              where the legal framework is moving toward clearer Level 3 and Level 4 rules, yet still relies on pilot
              logic, local implementation, and transitional regulatory layering before the July 2027 national standard
              takes effect. That means timing risk is structural: even a technically capable operator can be slowed by
              certification sequencing, local permit practice, or corridor-specific approvals.


              The policy backdrop became more fragile in April 2026 when CNBC reported that Chinese authorities
              suspended new autonomous-driving licenses after Baidu Apollo Go incidents in Wuhan. Inceptio itself was
              not named as the cause, but the signal matters because category-wide pauses can reset deployment
              timetables for everyone. Cross-border expansion adds a second legal problem. Carnegie argues that Chinese
              access to data and connected-technology control is increasingly treated as a national-security issue in
              the United States and partner markets. For a trucking-autonomy company that wants to expand abroad, the
              risk is not just product compliance; it is whether host regulators are comfortable with the software,
              data, and infrastructure stack in the first place.
            claimRefs:
