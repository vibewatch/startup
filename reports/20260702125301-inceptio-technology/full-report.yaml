      - number: '3.2'
        title: Capability, Commercialization, and Distribution Comparison
        blocks:
          - type: paragraph
            body: >-
              The cleanest buyer-side comparison is not “who has the best autonomy stack,” but who can put useful
              freight miles on the road with a scalable distribution model. Inceptio’s advantage is that it already
              sells or enables preloaded trucks through OEM relationships and claims thousands of deployed units,
              several hundred million commercial kilometers, and strong route engagement rates. Aurora’s advantage is
              different: it is already hauling loads today in Texas with a driverless service model, supported by
              freight-service tooling and a future path toward customer-owned autonomous trucks. PlusAI shows broader
              global OEM ambition, Waabi markets an AI-first and simulation-heavy path, Kodiak emphasizes a
              purpose-built autonomy platform, and Torc brings Daimler’s captive distribution muscle. Pony.ai and
              Einride matter because they show adjacent ways to commercialize autonomy and freight orchestration, but
              their disclosed public emphasis is less centered on China-style heavy-duty preloaded line-haul trucks than
              Inceptio’s current business.
