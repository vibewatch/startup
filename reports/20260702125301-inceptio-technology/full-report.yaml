      - CV034
      - CV037
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      IC-style scoring shows that commercialization and strategic relevance score well, while valuation clarity and
      disclosure still lag.
    approximationNotes: Scores use a 1-5 editorial scale based on retained public evidence as of the run date.
    data:
