  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-recognition
    missingEvidence: No public contract or accounting disclosure shows whether Inceptio books revenue at truck delivery, option activation, software service, or managed-operation milestones.
    whyItMatters: Revenue timing and mix directly affect the quality, seasonality, and scalability of the model.
    diligencePath: Request sample customer contracts, revenue-recognition memo, and audited stream-level revenue bridge.
    relatedQuestionRefs:
    - QI012
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: material
    topic: cash-burn-runway
    missingEvidence: No public cash balance, monthly burn, runway months, or downside financing plan appears in retained materials.
    whyItMatters: Without runway data, investors cannot judge dilution timing, solvency, or whether commercialization can be self-funded through the next milestone.
    diligencePath: Request latest cash balance, monthly cash bridge, base / bear runway, and next-round trigger thresholds.
    relatedQuestionRefs:
    - QI017
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: debt-and-obligations
    missingEvidence: No public debt, lease, guarantee, or project-finance schedule was found.
    whyItMatters: Hidden leverage or partner commitments can materially change equity risk and cash needs.
    diligencePath: Request complete obligations schedule, covenant package, and contingent-liability summary.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-renewals
    missingEvidence: Public materials name customers but do not disclose concentration percentages, renewal rates, cohort retention, or expansion economics.
    whyItMatters: A small set of large fleets could dominate revenue and compress pricing power.
    diligencePath: Request top-10 customer revenue share, renewal history, contract duration, and expansion metrics by cohort.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: software-attach-and-recurring-mix
    missingEvidence: No public attach-rate, recurring-revenue mix, or contribution-margin disclosure was found for the software and service layer.
    whyItMatters: The investment case depends on whether Inceptio can capture recurring economics beyond hardware-enabled truck programs.
    diligencePath: Request attach rates, recurring-revenue cohorts, gross margin by stream, CAC, and payback by channel.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI001
    - TI003
