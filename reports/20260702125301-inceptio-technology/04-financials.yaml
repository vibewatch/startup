tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - OEM-preloaded autonomous truck content
    - Technology is embedded into serial-production trucks sold through OEM partners
    - Per truck / program
    - Commercial today, but no public revenue split
    - Likely real and current, but recognition mechanics are undisclosed
    - Request contract structure, take rate by OEM, and revenue-recognition policy
  - - L2+ / T-NOA option package
    - Fleet buyer pays for assisted-driving capability on a truck order
    - RMB per truck option
    - Approx. RMB 100,000 public proxy
    - Best disclosed monetization anchor in public sources
    - Request realized ASP, attach rate, and discount ladder by route and customer type
  - - Operations / TaaS freight services
    - Company mission includes operating a nationwide autonomous freight network
    - Managed route / service
    - Strategic model is public; current revenue not disclosed
    - High strategic relevance, low public quantification
    - Request current managed-service revenue, gross margin, and customer concentration
  - - Data / software improvement loop
    - Commercial operations create data used to improve future L4 products
    - Not directly monetized in public sources
    - Clearly valuable but no direct public revenue line
    - Economic value is strategic rather than booked today
    - Request capitalization policy, data-asset economics, and R&D efficiency metrics
  - - Future driverless freight layer
    - Commercialization milestone targeted around mid-2028
    - Per route / per mile / service contract
    - Not yet public or priced
    - Future upside only
    - Request launch assumptions, pricing model, and unit-economics plan for driverless service
  notes: Public sources make the structure of monetization visible, but not the booked revenue mix or accounting policy for each stream.
