- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Revenue and revenue mix
    - Cannot distinguish hardware-enabled program revenue from recurring software or service revenue
    - Request audited revenue by stream, geography, and customer cohort
  - - Gross margin by stream
    - Cannot tell whether current commercialization is margin accretive or subsidized for future data capture
    - Request gross margin split across hardware, software, services, and support
  - - Cash balance, burn, and runway
    - Cannot judge solvency, dilution timing, or financing urgency
    - Request latest cash position, monthly burn bridge, and downside runway model
  - - Debt, guarantees, and off-balance-sheet obligations
    - Capital intensity may be understated if equipment, service, or partner commitments sit outside public view
    - Request full obligation schedule including leases, guarantees, and supplier commitments
  - - Customer concentration and renewals
    - A few large express fleets could dominate the revenue base and bargaining power
    - Request top-customer revenue share, renewal rates, and expansion cohort data
  - - Revenue recognition mechanics
    - Booked revenue could differ materially depending on whether value is recognized at truck sale, activation, or managed service delivery
    - Request accounting memo and sample customer contracts
  - - Realized pricing and discounting
    - Public ROI claims do not reveal how much of the savings pool Inceptio keeps
    - Request invoice-level pricing, rebates, channel economics, and support attach rates
  notes: These are not cosmetic disclosure asks; each one blocks a specific underwriting conclusion that public evidence alone cannot support.
