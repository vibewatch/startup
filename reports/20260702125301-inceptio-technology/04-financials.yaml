- id: section-capital
  title: Capital Intensity, Regulation, and Financing Dependency
  body: 'Publicly visible capital signals are mixed. On the positive side, Inceptio has raised more than US$678 million according to retained databases and Reuters, and the disclosed 2020–2022 rounds were large enough to fund product buildout, electrification work, and mass-production programs. The company also reportedly explored a U.S. IPO in 2025, and Caplight shows an “IPO announced” marker. But those facts do not answer the harder question of capital adequacy today. The source set includes no public SEC registration statement, no annual report, and no balance-sheet view for cash, debt, or working capital. Regulation adds another reason to be cautious: Chinese Level 3/4 rules tighten in 2027, while legal guides still describe fragmented liability, data transfer, and insurance treatment. That means commercialization will keep absorbing capital through compliance, industrialization, and ecosystem work long before investors can verify self-funded profitability from public filings.'
