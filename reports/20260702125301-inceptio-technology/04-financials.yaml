callouts:
- calloutType: strength
  title: Fleet-level ROI is more concrete than at most autonomy peers
  body: Public route data, option pricing, and payback ranges make Inceptio easier to understand from a customer-value perspective than many autonomy startups. Investors can see why fleets adopt the product even though they still cannot see Inceptio’s own revenue and margin capture.
  claimRefs:
  - CI004
  - CI005
  - CI006
  - CI007
  - CI008
  - CI023
- calloutType: risk
  title: Commercial traction does not equal underwritable financial transparency
  body: The central financial risk is not lack of adoption. It is lack of public disclosure on revenue, cash, gross margin, burn, and debt. That means even a commercially credible business can remain impossible to model tightly from public evidence alone.
  claimRefs:
  - CI015
  - CI021
  - CI022
  - CI039
  - CI041
  - CI042
  - CI044
  - CI045
- calloutType: risk
  title: Regulation and industrialization still consume capital before driverless upside arrives
  body: Rules tightening into 2027, fragmented liability treatment, and the need for OEM-scale compliance mean that AI progress alone does not eliminate the need for continuing capital support. This is exactly why the absence of cash-runway disclosure matters.
  claimRefs:
  - CI031
  - CI032
