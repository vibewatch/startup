- id: TI002
  title: Pricing / monetization table
  columns:
  - Offer / lever
  - Public price / metric
  - List vs realized pricing
  - What is included
  - Unknowns
  - Implication
  rows:
  - - L2+ option
    - Approx. RMB 100,000 upfront
    - Only a public proxy; realized discounting not disclosed
    - Highway autonomy assistance on preloaded truck
    - Attach rate, channel margin, and list-to-net waterfall are private
    - Shows the company can anchor monetization at truck-purchase time
  - - Payback promise
    - 10–24 months
    - Case-study style, not disclosed by customer cohort
    - Labor, fuel, and operational savings
    - No public sensitivity by route, fleet size, or driver wage band
    - Strong buyer message, but not a substitute for company margin disclosure
  - - Fuel savings
    - 3–7% versus strong human drivers
    - Operational benefit rather than price sheet
    - Algorithmic driving efficiency
    - No disclosed share of savings captured by Inceptio
    - Supports willingness to pay but not revenue retention math
  - - Labor savings
    - Around 40% or 40–50% on cited routes
    - Economic proxy only
    - Driver-count reduction and better duty-cycle economics
    - No public evidence on whether savings are shared with OEMs or passed through to fleets
    - Main reason the option can clear procurement hurdles
  - - Insurance benefit
    - Fleet payout ratios below 10% versus traditional ~90% cited by IDTechEx
    - Indirect monetization via lower risk cost
    - Safer operating profile and lower case severity
    - Dataset size and insurer contract terms are not disclosed
    - Important to buyer ROI but still early as a pricing anchor
  - - Future TaaS / driverless service
    - No public tariff
    - Not yet disclosed
    - Potential managed freight service layer
    - No public per-mile, per-route, or minimum-guarantee terms
    - Largest upside source, but not currently underwritable from public evidence
  notes: The table preserves operational ROI proxies and explicitly separates them from realized company pricing, which remains largely private.
