- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Value / status
  - Source / basis
  - Why it matters
  - Diligence ask
  rows:
  - - Cumulative disclosed funding
    - More than US$678 million
    - Reuters plus Tracxn / database references
    - Shows meaningful historical capitalization
    - Reconcile by round date, primary vs secondary, and cash still on balance sheet
  - - Latest fully disclosed primary round
    - US$188 million Series B+ in Feb 2022
    - PR Newswire, CnEVPost, ACN Newswire
    - Most concrete disclosed funding anchor in retained primary materials
    - Request complete funding chronology and post-money valuations
  - - IPO process signal
    - TechNode reported U.S. IPO interest; Caplight marks IPO announced in Jan 2025
    - Independent news plus market-data page
    - Suggests desire for new capital or liquidity event
    - Request bankers, jurisdiction, proceeds target, and current status
  - - Public filing availability
    - No retained public U.S. filing or audited financial statement
    - SEC EDGAR search surface and retained source set
    - Without a filing, audited cash / revenue / risk factors are missing
    - Request draft prospectus or audited financial package under NDA
  - - Cash on hand
    - Not publicly disclosed
    - No retained source provides a balance-sheet figure
    - Core input for runway analysis
    - Request latest cash, restricted cash, and undrawn facilities
  - - Monthly burn / runway
    - Not publicly disclosed
    - No retained source provides a burn bridge
    - Necessary to judge dilution risk and next-round timing
    - Request monthly burn bridge and base / bear runway cases
  - - Debt / project finance
    - Not publicly disclosed
    - No retained source provides obligations schedule
    - Leverage can alter equity value and liquidity risk
    - Request debt, lease, guarantee, and covenant schedule
  - - Compliance and industrialization burden
    - Likely ongoing through L3/L4 regulation and OEM programs
    - Legal guides, 2027 rules, certification disclosures
    - Explains why commercialization does not automatically mean self-funded scale
    - Request compliance budget, warranty / service reserves, and capex plan
  notes: This table distinguishes disclosed historical funding from the still-missing cash-runway evidence needed to underwrite capital adequacy today.
