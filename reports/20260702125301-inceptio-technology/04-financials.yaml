- id: section-pricing
  title: Pricing, Unit Economics, and Sales-Efficiency Proxies
  body: Inceptio has unusually concrete public economics for a private autonomy company. Independent summaries and management remarks converge around an approximately RMB 100,000 L2+ option, 10–24 month payback, 95–99% autonomous-mileage engagement on deployed routes, and meaningful fuel, labor, and insurance benefits. The route case studies are the most useful part of the evidence set because they tie the technology to labor substitution and asset-utilization logic that a fleet buyer would actually underwrite. This is far better than the usual “future savings” marketing language. The limitation is that these are still proxy economics. Public sources do not show realized discounts, customer-level take rates, CAC, payback by channel, support costs, or contribution margin. So the economics clearly justify buyer interest, but they do not yet prove the company captures enough of that value to produce durable software-like margins.
