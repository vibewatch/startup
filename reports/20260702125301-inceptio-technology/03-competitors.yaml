  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: peer-pricing-disclosure
    missingEvidence: Realized contract pricing, per-mile tariffs, or list-to-net waterfalls for Aurora, Kodiak, Waabi, Torc,
      and most other peers were not publicly disclosed in the retained source set.
    whyItMatters: Without clean peer pricing, investors cannot benchmark whether Inceptio's route-level economics are genuinely
      superior or simply better publicized.
    diligencePath: Request signed commercial pricing schedules or anonymized customer contracts for the most directly comparable
      freight routes.
    relatedQuestionRefs:
    - QP015
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: peer-funding-comparability
    missingEvidence: A consistent, audited funding or valuation framework across public, private, and captive trucking peers
      was not available from retained public sources.
    whyItMatters: Capital scale affects runway and speed of commercialization, but noisy database comparisons can easily mislead
      underwriting.
    diligencePath: Normalize peer capital by date, net cash, business mix, and current ownership status before using it in
      any moat model.
    relatedQuestionRefs:
    - QP022
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: customer-lock-in-metrics
    missingEvidence: No public renewal rates, attach rates, exclusivity clauses, or expansion cohorts were found for Inceptio's
      OEM or fleet relationships.
    whyItMatters: The strongest-looking deployment moat can still be fragile if customers multi-home or OEMs preserve easy
      switching.
    diligencePath: Request renewal cohorts, program duration, exclusivity terms, and expansion revenue by OEM and fleet account.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP004
