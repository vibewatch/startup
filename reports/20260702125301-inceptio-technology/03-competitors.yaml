callouts:
- calloutType: strength
  title: China commercialization is Inceptio’s real moat today
  body: The company’s strongest differentiator is not a vague AI claim. It is the combination of OEM-preloaded trucks, disclosed
    route-level economics, and very large commercial mileage inside China. That is a harder operating loop to copy quickly
    than marketing-led autonomy positioning.
  claimRefs:
  - CP005
  - CP006
  - CP007
  - CP008
  - CP027
  - CP036
- calloutType: risk
  title: Aurora remains the benchmark for driverless heavy-truck commercialization
  body: Inceptio’s scale narrative is strong, but the market’s most important disconfirming fact is that Aurora already operates
    commercial driverless freight in the U.S. This keeps Inceptio’s current lead grounded in L2+/L3 operating scale rather
    than fully proven L4 monetization.
  claimRefs:
  - CP010
  - CP011
  - CP036
  - CP039
- calloutType: risk
  title: Geopolitics and regulation can narrow the addressable moat
  body: Management itself has said the U.S. market is beyond reach for geopolitical reasons, while legal and regulatory materials
    show that cross-border software, data, liability, and compliance issues remain active. That makes the China lead valuable,
    but not automatically exportable.
  claimRefs:
  - CP022
  - CP023
  - CP024
  - CP037
  - CP038
