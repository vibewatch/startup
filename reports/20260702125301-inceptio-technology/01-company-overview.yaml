- id: section-milestones
  title: Commercialization Milestones, Scale Indicators, and Explicit Gaps
  body: >-
    Inceptio's milestone arc is strong on commercialization evidence even though it is weak on public financial disclosure. The company reported 40 million kilometers of accident-free trucking by July 2023, surpassed 100 million commercial kilometers by the end of April 2024, and completed a 400-truck delivery to ZTO Express in 2024 that multiple outlets described as the largest single intelligent heavy-duty truck delivery globally. By November 2025, the company said more than 4,000 L2+/L3 trucks had accumulated over 400 million kilometers of commercial operations; by March 2026 it reported more than 500 million kilometers; and by June 2026 the latest official update put cumulative commercial mileage above 700 million kilometers while Taurus, its next-generation autonomous driving control unit, entered mass production.


    The latest source vintage should govern the headline metric, so the June 2026 700 million kilometer figure is the right current anchor, with older 40 million, 100 million, 400 million, and 500 million milestones preserved only as dated waypoints. At the same time, several cover metrics remain unsupported. Reviewed public sources do not provide audited revenue, a current headcount beyond third-party database estimates, or a transparent 2026 unit-sales figure. Bloomberg's IPO-reporting and Reuters' note that the U.S. market was beyond reach for geopolitical reasons both reinforce that Inceptio's public narrative is commercially ambitious but still dependent on external capital markets, regulation, and manufacturing partners.
