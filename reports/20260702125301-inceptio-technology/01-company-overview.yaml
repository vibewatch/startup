company:
  name: Inceptio Technology
chapter:
  number: 1
  title: Company Overview
  summary: 'Inceptio Technology is a Shanghai-based autonomous trucking developer founded in 2018 and led by founder-CEO Julian Ma. Public sources support strong commercialization milestones — from the first series-production L3 heavy-duty trucks in late 2021 to more than 700 million kilometers of commercial operations by June 2026 — and a funding history that outside databases and Reuters place at roughly $679 million. The diligence caveats are equally important: public English-language sources reviewed do not disclose audited revenue, a clean current cap table, or a confirmed post-money valuation, while Bloomberg/TechNode reported only exploratory U.S. IPO work rather than a filed transaction.'
sections:
- id: section-identity
  title: Identity, Headquarters, and Business Model
  body: >-
    Inceptio Technology presents itself as a full-stack autonomous driving technology company for heavy-duty trucks, focused on line-haul freight rather than passenger autonomy. Official English-language materials describe a dual-track model: sell and support serial-production trucks preloaded with the Inceptio Autonomous Driving System today, while using those real-world operations to build a future autonomous Transportation-as-a-Service freight network. The company says it partnered with OEMs to launch the industry's first series-production L3 autonomous trucks in late 2021 and won China's first public-road-testing permit for driverless heavy-duty trucks in 2022.


    Identity details are mostly clear but not perfectly clean. Public sources consistently place the company's founding in 2018 and identify Julian Ma as founder and CEO. Reuters and CnEVPost describe Inceptio as having been founded in April 2018 with backing from G7, GLP, and NIO Capital, suggesting a sponsor-backed origin rather than a single-founder bootstrapped start. The company's public web footprint anchors headquarters in Yangpu district, Shanghai, while the official site footer also lists a Silicon Valley office in Santa Clara. The same footer attributes copyright to Jiluo Technology (Shanghai) Co., Ltd., which appears to be an operating legal entity behind the Inceptio brand but is not fully mapped in the reviewed public materials.
