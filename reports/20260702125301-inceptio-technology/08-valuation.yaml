- id: floor-and-band-logic
  title: The best current valuation anchor is a floor-plus band, not a multiple-driven point estimate
  body: 'Because public revenue is undisclosed, the chapter should not pretend that a revenue multiple or DCF can produce
    a trustworthy single number. A better method is to build from the strongest observed anchors. First, the Hurun threshold
    gives a defendable lower bound at roughly $820 million. Second, Tracxn, CB Insights, and the retained financing coverage
    show a cumulative funding base around $678 million plus continued listing intent. Third, Inceptio’s commercialization
    metrics are stronger than the average private autonomy startup, which argues for a premium to the simple floor.


    That logic supports a broad band rather than a precision target. A low case around $0.8 billion to $1.1 billion assumes
    the company is valued only at or slightly above the Hurun floor while disclosure remains thin and IPO timing slips. A
    base case around $1.2 billion to $1.8 billion assumes continued kilometer growth, customer standardization, and IPO optionality
    without audited public revenue. A high case around $2.0 billion to $3.0 billion requires real filing progress, clearer
    economics, and visible movement toward driverless commercial approval. Above that level, the chapter would view valuation
    as more narrative-driven than evidence-driven.'
