      above the Hurun floor.
    - $0.8B-$1.1B; floor-plus logic with little premium for unresolved economics.
    - Even strong mileage growth may not offset missing filings and cap-table opacity.
    - Credible whenever public disclosure fails to improve.
  - - Base
    - Kilometer growth, fleet adoption, and customer standardization continue, but the company still lacks public revenue
      and margin detail.
