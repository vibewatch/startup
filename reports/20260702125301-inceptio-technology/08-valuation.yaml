    - Base case still assumes commercialization strength is real and financing stays available.
    - Most consistent with retained evidence today.
  - - High / bull
    - A filing appears, revenue quality becomes visible, and permit progress suggests the mid-2028 driverless target is still
      credible.
    - $2.0B-$3.0B; requires real disclosure and regulatory derisking before investors should pay a larger premium.
    - Bull case fails if driverless approvals lag or public markets de-rate China autonomy names.
    - Possible, but not yet supported strongly enough for underwriting.
