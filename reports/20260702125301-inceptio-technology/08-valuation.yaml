- id: peer-status-context
  title: Public and private peer status supports relevance, but not blind premium transfer
  body: 'Peer context matters here more as a status check than as a clean comp set. Pony.ai provides a valuable public China
    autonomy reference because it has disclosed revenue, unit-economics progress, and rapid fleet expansion. Aurora provides
    a public trucking-autonomy reference with real commercial freight operations in Texas. Private peers such as Waabi, PlusAI,
    Einride, Kodiak, and Torc show that capital continues to chase trucking autonomy and adjacent freight platforms globally.
    Tracxn’s staging of those peers — public, Series C, Series E, or acquired — helps frame where Inceptio sits on the maturity
    curve.


    But those peers also show why precise multiple transfer is dangerous. Some are software-heavy, some are freight-platform
    plays, some are robotaxi hybrids, and some are geography-specific. Their public disclosures differ dramatically from Inceptio’s.
    The right readthrough is therefore qualitative: Inceptio is credible enough to sit in a serious peer set, but its lack
    of public economics means it still deserves a disclosure discount relative to peers that already publish revenue or unit-economics
    evidence.'
