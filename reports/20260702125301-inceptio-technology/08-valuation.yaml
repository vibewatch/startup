- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - No real filing or audited economics
    - No filing-grade disclosure despite continued IPO signaling
    - Turns the story into a valuation narrative without a pricing foundation
    - Keep the stance at track or downgrade to research-more if pricing rises
  - - Permit path slips materially
    - No visible progress toward driverless commercial approval by 2027-2028 window
    - Reduces the value of the current kilometer lead as a valuation differentiator
    - Compress toward the low band
  - - Customer concentration proves too narrow
    - A handful of fleets account for most real deployment proof or repeat orders
    - Weakens the claim that commercialization is broad and repeatable
    - Apply a concentration discount even if top-line momentum looks strong
  - - Preferred stack or dilution is aggressive
    - New terms meaningfully subordinate common shareholders or raise fully diluted entry price
    - Cuts real return potential without changing the headline valuation
    - Require cap-table adjustment before investing
  - - Public peers de-rate while Inceptio stays private and opaque
    - China AV sentiment weakens faster than deployment milestones improve
    - Expands the disclosure discount and narrows exit windows
    - Re-underwrite using the low-case band
  notes: These triggers are designed to convert the current broad valuation band into concrete go / no-go checkpoints.
  claimRefs:
  - CV003
  - CV005
  - CV029
  - CV034
  - CV037
  - CV038
  - CV042
- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Revenue and gross margin
    - Current annualized revenue, gross margin by product, and any recurring-software contribution
    - These are the fastest ways to confirm whether the company deserves a premium above the unicorn floor.
    - Request latest board deck or audited management accounts.
  - - Customer concentration
    - Top 10 customers, repeat-order cadence, and share of deployed trucks by customer
    - Commercial proof looks strong, but valuation quality depends on how broad that proof really is.
    - Request customer concentration schedule and cohort renewal data.
  - - OEM concentration
    - Volume by truck OEM and model plus switching costs for future integrations
    - OEM dependence can amplify execution and pricing risk.
    - Request OEM partner scorecard and contract summary.
  - - Preference stack and dilution
    - Preferred terms, liquidation preferences, employee option pool, and fully diluted share count
    - Headline valuation is less useful if downside protection sits above new investors.
    - Request cap-table waterfall and last-round term sheet summary.
  - - Permit and regulatory roadmap
    - Current corridor approvals, next permit milestones, and expected path to driverless operations
    - Regulatory sequencing is a primary determinant of upside timing.
    - Request regulatory workplan and external counsel memo.
  - - Cash use and runway
    - Current burn, capex needs, and financing contingency plan if listing timing slips
    - Capital intensity can change the base case more than another mileage milestone.
    - Request 24-month operating plan with downside cases.
  notes: These asks are the smallest diligence pack likely to move the recommendation or the valuation band materially.
