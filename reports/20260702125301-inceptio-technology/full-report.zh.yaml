            body: >-
              Inceptio 的里程碑曲线在商业化证据上很强，尽管公开财务披露薄弱。公司报告称，截至 2023 年 7 月已完成 40 million kilometers 无事故货运；到 2024 年 4 月底商业运营突破
              100 million kilometers；并在 2024 年向 ZTO Express 完成 400 辆卡车交付，多家媒体称这是全球最大单笔智能重卡交付。到 2025 年 11 月，公司称 4,000 多辆
              L2+/L3 卡车累计商业运营超过 400 million kilometers；2026 年 3 月报告超过 500 million kilometers；到 2026 年 6
              月，最新官方更新把累计商业里程推到 700 million kilometers 以上，同时下一代自动驾驶控制单元 Taurus 进入量产。


              头部指标应由最新来源版本决定，因此 2026 年 6 月的 700 million kilometers 是当前正确锚点；更早的 40 million、100 million、400 million 和 500
              million 里程碑只应作为带日期的路标保留。同时，几个封面指标仍缺乏支持。已审阅公开来源没有提供经审计收入、超出第三方数据库估计的当前员工数，或透明的 2026 年销量数字。Bloomberg 关于 IPO
              的报道，以及 Reuters 关于美国市场因地缘政治原因不可及的表述，都进一步说明 Inceptio 的公开叙事商业野心很强，但仍依赖外部资本市场、监管和制造伙伴。
