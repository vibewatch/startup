      - - 反向论点
        - 公司仍缺少留存的公开收入、毛利率、现金消耗和优先权披露，所以即便技术叙事真实， 估值也可能跑在证据前面。
        - 如果 IPO 时间继续拉长且没有申报文件，或公开指标增长持续快于披露质量，应迅速下调判断。
    notes: 反论点针对的是估值支撑缺失，而不是否认 Inceptio 已达到有意义的运营规模。
    claimRefs:
      - CV011
      - CV012
      - CV016
      - CV029
      - CV038
      - CV039
      - CV040
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 低 / 熊市
        - IPO 时间滑坡，披露仍薄，监管保持谨慎，投资者只按 Hurun 底线或略高估值给公司定价。
        - $0.8B-$1.1B；底线加小幅溢价逻辑，未解决经济性几乎拿不到溢价。
        - 即便里程增长强劲，也未必能抵消申报缺失和股权结构不透明。
        - 只要公开披露没有改善，这一情景就可信。
      - - 基准
        - 公里数增长、车队采用和客户标准化继续推进，但公司仍缺少公开收入和利润率细节。
        - $1.2B-$1.8B；有规模的未上市自动驾驶资产，战略相关性清晰但经济性不完整，这一区间公允。
        - 基准情景仍假设商业化实力真实，且融资渠道保持可用。
        - 与目前留存证据最一致。
      - - 高 / 牛市
        - 申报文件出现，收入质量变得可见，许可进展表明 2028 年中无人驾驶目标仍可信。
        - $2.0B-$3.0B；投资者支付更高溢价前，需要真实披露和监管去风险。
        - 如果无人驾驶审批滞后，或公开市场下调中国自动驾驶标的估值，牛市情景就失效。
        - 有可能，但证据还不足以支撑投资判断。
    notes: 区间是基于底线、融资、状态和里程碑逻辑搭建的分析性美元估值带，而不是来自已披露收入倍数。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
      - CV037
      - CV038
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Pony.ai
        - 公开市场中的中国自动驾驶同业，披露 2025 年收入和单位经济性进展
        - 上市；2025 年收入 $90M；深圳和广州 UE 盈亏平衡；2026 年目标车队 3,000 辆
        - 可展示「披露 + 商业化」形态的最佳中国公开自动驾驶参照。
        - Robotaxi 与自动驾驶卡车组合不同于 Inceptio 的重卡焦点。
      - - Aurora
        - 公开卡车自动驾驶运营商
        - 上市；在 Texas 开展商业自动驾驶货运运营
        - 最接近的公开卡车自动驾驶状态基准。
        - 美国路线和监管环境与中国显著不同。
      - - PlusAI
        - 未上市、以 OEM 为中心的自动驾驶同业
        - 未上市；7M+ 自动驾驶里程；6 家 OEM 合作伙伴；3 大洲
        - 有助于比较 OEM 主导的商业化路径。
        - 公开财务披露仍有限。
      - - Waabi
        - 未上市 AI 原生自动驾驶平台
        - 未上市 Series C 同业，聚焦卡车和 Robotaxi
        - 展示 AI 原生战略溢价在一级市场可能出现的位置。
        - 平台叙事领先于 Inceptio 这种规模的商业货运部署。
      - - Einride
        - 跨区域运营的未上市货运平台
        - 未上市 Series E 同业；在欧洲、美国和中东运营
        - 可作为比较规模和战略可选性的货运科技参照。
        - 商业模式混合货运平台、电动化和自动驾驶。
      - - Kodiak / Torc
        - 成熟美国卡车自动驾驶参照
        - Tracxn 将 Kodiak 列为上市；Torc 列为被收购
        - 证明该赛道有多个资本实力充足的严肃运营商。
        - 两者都无法为今天的 Inceptio 提供干净的直接估值迁移。
    notes: 本表穷尽了本章估值逻辑明确使用的留存同业参照；重点放在状态和相关性，而不是虚假的精确倍数迁移。
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Exhaustive set of the retained public and private trucking-autonomy peer references that directly shape this
        chapter’s valuation logic and recommendation.
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 没有实质性申报或经审计的经济性数据
        - 尽管持续释放 IPO 信号，仍没有达到申报标准的披露
        - 把故事变成没有定价基础的估值叙事
        - 维持跟踪立场；若价格上涨，则下调至继续研究
      - - 许可路径实质滑坡
        - 到 2027-2028 年窗口，通向无人驾驶商业审批仍无可见进展
        - 削弱当前公里数领先作为估值差异化因素的价值
        - 向低估值带压缩
      - - 客户集中度被证明过窄
        - 少数车队贡献大部分真实部署证据或复购订单
        - 削弱商业化广泛且可复制的主张
        - 即便营收动能看起来强，也要施加集中度折价
      - - 优先权结构或稀释过于激进
        - 新条款实质压低普通股股东顺位，或抬高完全摊薄入场价
        - 不改变名义估值，却削弱真实回报潜力
        - 投资前要求调整股权结构
      - - 上市同业估值下修，而 Inceptio 仍为私有且披露不透明
        - 中国 AV 情绪恶化快于部署里程碑改善
        - 披露折价扩大，退出窗口收窄
        - 按低情景区间重新承销
    notes: 这些触发项把当前偏宽的估值区间落到具体的推进 / 否决检查点。
    claimRefs:
      - CV003
      - CV005
      - CV029
      - CV034
      - CV037
      - CV038
      - CV042
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 收入与毛利率
        - 当前年化收入、分产品毛利率，以及经常性软件收入贡献
        - 这些指标最快能验证公司是否配得上高于独角兽底线的溢价。
        - 索取最新董事会材料或经审计的管理账。
      - - 客户集中度
        - 前 10 大客户、复购节奏，以及各客户占已部署卡车的比例
        - 商业化证据看起来强，但估值质量取决于这些证据到底有多分散。
        - 索取客户集中度明细和分群续约数据。
      - - OEM 集中度
        - 按卡车 OEM 和车型拆分的销量，以及未来集成的切换成本
        - OEM 依赖会放大执行和定价风险。
        - 索取 OEM 合作伙伴评分表和合同摘要。
      - - 优先权结构与稀释
        - 优先股条款、清算优先权、员工期权池，以及完全稀释股数
        - 如果下行保护排在新投资人之上，名义估值的参考价值就有限。
        - 索取股权结构瀑布和上一轮 term sheet 摘要。
      - - 许可与监管路线图
        - 当前走廊批文、下一批许可里程碑，以及通往无人驾驶运营的预期路径
        - 监管推进顺序决定上行兑现节奏。
        - 索取监管工作计划和外部律师备忘录。
      - - 现金用途与现金跑道
        - 当前现金消耗、资本开支需求，以及上市时点推迟时的融资预案
        - 资本强度比新增一个里程碑更可能改写基准情景。
        - 索取包含下行情景的 24 个月运营计划。
    notes: 这组问题是最小尽调包，足以实质性推动建议或估值区间变化。
    claimRefs:
      - CV005
      - CV029
      - CV037
      - CV041
      - CV042
