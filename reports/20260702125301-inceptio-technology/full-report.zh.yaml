      - number: '8.4'
        title: 公私同行状态支撑相关性，但不能盲目转移溢价
        blocks:
          - type: paragraph
            body: >-
              同行语境在这里更像状态检查，而不是干净可比公司组。Pony.ai 是有价值的中国自动驾驶公开参照，因为它披露了收入、单位经济性进展和车队快速扩张。Aurora 则提供了公开的卡车自动驾驶参照，且在 Texas
              有真实商业货运运营。Waabi、PlusAI、Einride、Kodiak、Torc 等私有同行显示，全球资本仍在追逐卡车自动驾驶和相邻货运平台。Tracxn 对这些同行的阶段划分——上市、Series
              C、Series E 或被收购——有助于框定 Inceptio 在成熟曲线上的位置。


              但这些同行也说明，精确转移倍数很危险。有些公司软件占比更高，有些是货运平台，有些混合自动驾驶出租车业务，有些只聚焦特定地理市场。它们的公开披露与 Inceptio
              差异很大。因此，正确的读法是定性判断：Inceptio 足够可信，可以进入严肃同行组；但它缺少公开经济性，仍应相对那些已经发布收入或单位经济性证据的同行承受披露折价。
