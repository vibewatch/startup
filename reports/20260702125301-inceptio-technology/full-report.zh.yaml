      - number: '7.3'
        title: OEM、合作伙伴和标杆客户依赖在证明需求的同时压缩战略灵活性
        blocks:
          - type: paragraph
            body: >-
              从量产落地看，Inceptio 的商业化模式已经跑通：一端靠 OEM 伙伴量产，另一端靠大型物流客户充当样板。2023 年 PRNewswire 的里程碑稿点名 Dongfeng 和 Sinotruk；2024
              年 ZTO 交付报道又把公司最醒目的标杆客户之一同 Dongfeng Commercial Vehicle 绑定起来。这样的伙伴结构是优势，因为 Inceptio
              可以交付工厂集成的卡车，而不是事后改装；但它也是集中度风险，因为产品广度、部署速度和客户背书，都押在公司无法直接控制的交易对手身上。


              客户集中度风险同样两面。PRNewswire 提到 Budweiser、Nestlé、JD Logistics 和 Deppon Express 等早期用户；ZTO 部署又被至少 6
              家行业媒体写成规模化样板。这有利于叙事成型，但如果少数旗舰车队不续约、劳动力或燃油节省低于预期，或者高曝光部署暴露安全或可用率问题，市场也可能迅速重估。Inceptio
              不像单客户公司，但它公开证据仍高度依赖一小组头部案例，续约、背书质量和定价权都留下尾部风险。
