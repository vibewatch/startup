      - number: '6.3'
        title: 具名客户证明：量产还是试点
        blocks:
          - type: paragraph
            body: >-
              最强的量产证据来自具名交付和线路级案例研究。YTO 的 300 辆交付、STO 的 300 多辆加 350 辆追加订单、ZTO 的 400 辆交付，看起来都是真实车队项目，而不是只有 logo
              的营销。Huatai 的 40 辆汽车零部件部署、Deshun 的冷链线路显示，系统并不局限在快递双寡头。Nestlé 和 Budweiser
              通过把平台绑定到具体长途线路、里程占比和获奖案例研究上，进一步加深了证明力；不过这些部署往往通过物流供应商运行，而不是品牌主直接拥有卡车。


              不是每个具名客户都同样有力。Deppon 通过独立跟车报道提供了异常丰富的线路级证据，但文章仍把 2021 年起点称为“trial operations”。Kuayue 和 Yunyi
              是可信补充，但独立后续跟踪比 ZTO、STO 或 Huatai 更浅。正确解读是，Inceptio 有多个真实部署，但不同客户的证明质量不均。
