      - number: '7.2'
        title: 商业化已经真实而非假设，运营与安全风险会随规模上升
        blocks:
          - type: paragraph
            body: >-
              Inceptio 的公开运营证据已经足够强，能证明公司不是概念阶段的自动驾驶故事；但同一事实也增加了运营和安全暴露。CNBC 称公司到 2026 年 4 月底商业运营里程约 700 million
              kilometers；Taurus 发布称系统现在覆盖中国超过 97% 的高速公路，并部署在数千辆智能卡车上。Edge AI 和 Vision Alliance 也描述了更广泛的中国自动驾驶卡车类别：到 2025
              年底，日均里程超过 1 million kilometers。活动达到这个量级后，安全、硬件可靠性、数据传输和现场支持故障不再是边缘案例，而会成为组合风险。


              好消息是 Inceptio 有可见缓释措施。Taurus 声称具备 ASIL-B 功能安全、ISO 21434
              网络安全、汽车级验证和更高算力效率。更难的问题是，这些缓释措施是否足以为从辅助、受监督货运自动驾驶转向无人商业运营去风险。CNBC 明确警告，更好的大语言模型不会移除运营或监管瓶颈；Taurus
              发布本身也突出，系统仍高度依赖稳健实地数据、网络容忍度和硬件验证。因此，风险不是没有进展，而是商业化最后 10% 会比公开里程曲线暗示的更慢、更贵，也更容易受事故影响。
