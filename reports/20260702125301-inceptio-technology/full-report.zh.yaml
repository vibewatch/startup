  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：跟踪——商业化证据真实，但公开估值支撑仍不完整
        blocks:
          - type: paragraph
            body: >-
              Inceptio 已不再是纯期权故事。公开来源显示，这是一家具备大规模真实部署、具名物流客户、OEM
              集成和足够融资历史的自动驾驶公司，战略相关性仍在。门槛不在于资产是否重要，而在于外部投资人今天能否有足够信心给它定价。Hurun 相关证据支撑独角兽估值底线，融资历史支撑高于该底线的价值，Caplight 和
              TechNode 又显示 IPO 路径至少已被公开讨论。这些都是实质利好。


              问题在于，关键定价输入仍是私有信息。保留的 SEC
              检索来源没有给本章带来公司专属申报文件，公开资料包仍缺收入、毛利率、现金消耗和股权结构细节。因此，用买入或回避的经典框架会过于粗糙。正确答案是跟踪：把公司留在可投资名单里，但只有在价格接近纪律性区间，或尽调拿到真正的披露包时，才承销入场。当前证据支持中等信心、高风险；估值判断从公允到偏高不等，取决于下一轮融资或上市最终落在哪里。
