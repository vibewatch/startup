      - number: '6.4'
        title: 留存、耐久性与扩张信号
        blocks:
          - type: paragraph
            body: >-
              公开留存证据远薄于公开部署证据。最干净的复购信号是 STO：Inceptio 明确披露过早期交付，随后又有 350 辆跟进订单；这有力说明买方看到了足够价值并扩张。ZTO 的 400
              辆采购本身就是有意义的规模证明；Taurus 发布称数家快递和配送客户已把自动驾驶作为新车采购标配，也说明组合层面存在重复行为。Deppon 从 2021 年持续使用到 2024
              年独立跟车报道，也暗示耐久性；但公开记录没有披露车队规模、合同期限或利用率趋势。


              缺失的是标准软件式留存披露：没有
              NRR、GRR、流失、合同期限或客户生命周期表。满意度来自追加订单、线路连续性、司机引述和奖项项目推断，而不是来自已披露续约指标。因此，本章可以定性支持采用和扩张，但不能精确承保留存。
