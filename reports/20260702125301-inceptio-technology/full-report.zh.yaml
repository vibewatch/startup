      - number: '1.2'
        title: 领导层、治理与利益相关方结构
        blocks:
          - type: paragraph
            body: >-
              在本次审阅的英文材料中，Julian Ma 是唯一持续出现的运营高管，也仍是战略、融资、国际定位和产品叙事的关键人物锚点。公司的公开叙事强调，他把技术开发、货运运营和 OEM 伙伴关系串在一起。Ma
              之外，公开英文材料对高管梯队披露很薄；这是真正的治理尽调缺口，不是格式问题：外部投资者还无法从已审阅来源验证完整董事会、CFO 权责或独立董事结构。


              利益相关方图谱比正式治理图谱更容易观察。Inceptio 的创始支持方叙事把公司与 G7、GLP、NIO Capital 绑定在一起；后续融资引入了 CATL、JD
              Logistics、Meituan、PAG、HongShan（原 Sequoia China）、Legend Capital，以及若干交叉轮或战略投资者。运营层面，Dongfeng、Sinotruk 和
              Foton 的重要性几乎不亚于财务投资者，因为 Inceptio
              的商业化路径依赖工厂预装卡车平台，而不是纯售后改装模式。客户集中度没有公开量化，但具名客户清单——快递车队、大型货运运营商、以及使用合同物流的消费品牌——意味着采用可信度取决于数量相对有限的高吞吐物流网络。
