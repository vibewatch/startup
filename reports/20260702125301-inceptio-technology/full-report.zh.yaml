      - number: '3.3'
        title: 定价、包装与买方经济性
        blocks:
          - type: paragraph
            body: >-
              公开定价仍是这个市场最大的盲点之一，因此比较必须锚定实际披露内容。在这组来源中，Inceptio 的公开经济信号最清楚，因为 IDTechEx 和公司背书材料都指向大约 RMB 100,000 的 L2+
              选装、10–24 个月回本，以及线路级劳动力和燃油节省。相比之下，Aurora 营销更高资产利用率、更好燃油效率和更低保险成本潜力，但不公布已实现的每英里定价。PlusAI、Kodiak、Torc、Waabi 和
              Einride 同样更常披露战略价值主张，而不是合同经济性。这意味着，今天的买方比较更多取决于线路匹配、OEM 集成深度和运营节省证明，而不是清晰公开价目表。也意味着，Inceptio
              披露的线路级经济性在投资者叙事中是有意义的优势，即便已实现的标价到净价、贡献毛利仍属私密。这个披露优势重要，因为买方和投资者至少能锚定采购
              ROI，即使公司层面的定价瀑布、续约模式和利润捕获仍不透明。对今天的投资者来说仍是如此。
