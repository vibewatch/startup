      - number: '5.2'
        title: 模块、SKU 与 OEM 集成地图
        blocks:
          - type: paragraph
            body: >-
              公开材料显示的是分层产品组合，而不是单一整体“卡车”。软件层面，Inceptio 营销 Truck-NOA 功能和更广的 Inceptio Autonomous Driving System。车辆层面，它宣传支持
              DFCV、Sinotruk、Sitrak、Foton 和 Chenglong 的量产平台。硬件层面，它展示多代 ADCU，从最初的 Xuanyuan 发布配置，推进到 Gen2，再到如今的 Taurus。


              对尽调来说，这很重要，因为 Inceptio 的商业化战略依赖 OEM 兼容性和标准化适配工作。技术页面称，标准化 SDK 可在 9–12 个月内把栈适配到新车型；Taurus 也被明确营销为开放且对 OEM
              友好。这些表述支持一种集成逻辑：Inceptio 想作为可重复的平台供应商插入现有商用卡车项目。它们也定义了一个核心依赖风险：如果 OEM 项目停滞，或芯片路线图假设失效，商业化扩张引擎也会随之放慢。
