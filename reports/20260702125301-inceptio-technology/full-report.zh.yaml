      - number: '6.2'
        title: 采用轨迹与部署规模
        blocks:
          - type: paragraph
            body: >-
              对一家私营卡车自动驾驶供应商来说，公司采用轨迹异常可见。公开里程碑从 2023 年 8 月大约 600 辆在役卡车，到 2023 年 7 月累计 40 million kilometers，到 2024 年 5
              月 100 million，到 2024 年底 200 million 且超过 2,000 辆卡车，再到 2026 年 6 月累计 700 million kilometers
              加数千辆卡车。这个模式比任何单篇新闻稿都重要，因为它显示客户基础通过反复线路部署在增长，而不是靠一辆孤立展示车撑场。


              规模也体现在线路和趟次数上。2023 年 8 月订单公告称，Inceptio 已在 340 条线路上为 100 多家货运和物流客户完成近 50,000 趟运输。Reuters 独立报道了管理层预期：到 2024
              年中，在役卡车数将从约 600 辆翻两番；这与后续里程碑披露方向一致。活跃卡车与闲置卡车的确切分母仍未披露，但轨迹支持的是量产部署叙事，而不是实验室演示叙事。
