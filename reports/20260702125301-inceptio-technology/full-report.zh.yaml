        - 留存来源未提供义务时间表
        - 杠杆可能改变股权价值和流动性风险
        - 要求提供债务、租赁、担保和契约时间表
      - - 合规与产业化负担
        - 可能会随 L3/L4 监管和 OEM 项目持续存在
        - 法律指南、2027 年规则、认证披露
