      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              买方图谱分阶段，因为 Inceptio
              实际销售的是一整套栈：智能卡车平台、辅助驾驶运营层，以及最终更高自动化的货运服务。第一阶段，直接买方通常是决定卡车资本开支的车队所有者、租赁主体或运输运营商。用户由司机、调度员、安全经理和线路运营人员共同构成；付款方通常是关注
              TCO、资产利用率、融资和停运时间的车队 P&L 负责人或 CFO 等价角色。第二阶段，预算逻辑转向运营经济性。卡车已经投入服务，问题变成自动驾驶层能否靠减少司机、更安全运营、更低燃油消耗和更高线路产出回本。


              这就是为什么干线承运商、快递网络、合同物流供应商和其他高频货运运营商比泛泛的 AV 爱好者更重要。Reuters 和相邻商业化来源显示，Inceptio
              的早期客户基础已经覆盖快递、整车、零担和品牌相关合同物流。买方逻辑按走廊展开，而不是按泛行业展开：需求可预测、劳动力压力大、年里程高的线路，比一次性或不规律货运更容易承保。与 Dongfeng、Sinotruk
              和 Foton 的 OEM 伙伴关系也重要，因为采用依托工厂预装平台和服务网络，而不是纯售后改装模式。实践中，预算归属就落在卡车置换、线路经济性和安全责任本来所在的位置。
