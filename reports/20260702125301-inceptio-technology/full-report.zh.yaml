  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与市场形态
        blocks:
          - type: paragraph
            body: >-
              Inceptio 所处赛道比广义自动驾驶汽车标签暗示的更窄。直接竞争来自其他试图把重型卡车或干线线路货运自动化的公司：美国 hub-to-hub 卡车货运里的 Aurora，嵌入 OEM 的自动驾驶卡车公司
              PlusAI，做无人地面自动驾驶的 Kodiak，simulation-first 自动驾驶卡车公司 Waabi，Daimler 体系内围绕 Freightliner 的 Torc，以及部分 Pony.ai
              卡车项目。相邻替代方案包括 Einride 的电动货运平台和车队软件；现状替代仍是人工驾驶卡车，再叠加逐步改进的 ADAS。Inceptio 自身位置异常具体：OEM
              预装、中国优先、先辅助的商业化模式，已经覆盖快递配送、LTL、整车和合同物流。这让它比多数同业披露了更多真实货运暴露，但也意味着最相关比较应放在部署模式和线路经济性上，而不是只看泛 AV
              排名。这个框架也避免夸大通用自动驾驶排名。
