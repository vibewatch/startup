      - number: '5.4'
        title: 信任、安全、网络安全与质量控制
        blocks:
          - type: paragraph
            body: >-
              Inceptio 公开的信任栈比许多私营自动驾驶公司更具体。公司公开声称拥有 SGS ASIL-D 功能安全认证、TÜV Rheinland ISO/SAE 21434 网络安全认证、Tencent Keen
              Labs 测试、ASPICE CL2 过程认证，以及 Taurus EV/DV/PV 验证，附带 ASIL-B 和 ISO 21434 引用。白皮书和路线图材料也强调“Safety First”是贯穿
              R&D、测试和量产的开发体系原则。


              即便如此，尽调仍应区分流程资质和实地可靠性数据。认证显示 Inceptio 早早投入汽车级开发方法和网络安全控制，这有助于建立 OEM 可信度。但认证本身不会披露脱离接管率、按平台划分的
              MTBF、事故调查流程，或传感器、算力和控制子系统之间的故障分布。因此，控制框架方向上看起来强，但独立运营证据仍比认证栈的营销表面更薄。
