      - number: '8.2'
        title: 正向论点是自动驾驶重卡少见的商业密度；反向论点是财务披露缺失
        blocks:
          - type: paragraph
            body: >-
              正向论点很直接。TechNode、CNBC、Taurus 发布稿、Next Truck 2025 路线图和 ZTO 交付报道，都指向同一方向：在私有自动驾驶卡车公司里，Inceptio
              已经跑出少见的真实世界规模。公开证据支持公司从 2024 年超过 200 million 公里，走向 2026 年约 700 million
              公里；运营车辆达到数千辆，路线覆盖中国大部分高速公路。这样的运营证据明显强于许多自动驾驶创业公司。


              反向论点同样清楚。同一套能证明战略相关性的资料，却给不出申报级财务披露。没有保留的公开申报文件，投资人无法检验收入质量、客户集中度、优先股负担、毛利率或资本效率。换句话说，Inceptio
              可能确实配得上风险投资级估值，但为公共市场式溢价付费的理由仍未被证明。公司可以很好，当前价格也仍可能过高；区分这两件事，是本章的核心纪律。
