      - number: '6.5'
        title: 集中度风险与证据限制
        blocks:
          - type: paragraph
            body: >-
              客户集中度是客户侧最大的未解尽调问题。同一小簇名字——ZTO、STO、YTO、JD、SF，加上少数品牌主线路——几乎主导所有公开披露。这不能证明集中，但意味着公开可见基础偏向少数大型中国物流运营商。已审阅来源从未披露头部客户收入占比、单线路钱包份额、流失或非活跃车队比例。买方侧佐证也不一致：SF
              和 JD 反复出现在卖方撰写的里程碑发布中，但本次审阅的公开集合没有包含专门的买方确认页面。


              部署质量也有边界。CNBC 2026 年文章明确指出，当前商业关系仍是受监督 L2+/L3 项目，而不是无人驾驶 L4 运营。The Standard 的 IPO
              文章点名客户，但没有提供客户数或收入结构透明度。结果是一条有真实量产证据的可信采用故事，但对集中度、留存，以及规模化量产与持续试点措辞之间的边界，仍缺乏完整可见性。
