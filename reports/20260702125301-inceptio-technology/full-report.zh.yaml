      - number: '3.4'
        title: 护城河耐久性、监管摩擦与竞争结论
        blocks:
          - type: paragraph
            body: >-
              Inceptio 的护城河只有在中国部署领先优势，在其他地方完全打开无人驾驶商业化之前，复利成更难复制的数据、OEM 和客户关系优势时，才算耐久。正向逻辑是真实的：规模化线路数据、OEM 预装集成、ASPICE
              CL2 等供应商可信度提升，以及大型快递车队愿意部署 Inceptio-powered 卡车的反复证据。反向证据也真实存在。Aurora 在美国已经有真正的无人驾驶商业货运叙事；Torc 显示大型 OEM
              可能把自动驾驶价值留在体系内；AI 模型进步不会消除监管闸门；Inceptio 自己也说过，美国市场因地缘政治原因不可及。平衡结论是，Inceptio
              目前领先中国商业化车道，并拥有披露最强的卡车数据飞轮之一，但其护城河仍更偏国内、更依赖分销和 OEM，而不是已经在全球被 L4 证明。
