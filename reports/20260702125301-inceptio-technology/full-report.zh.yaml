      - number: '5.3'
        title: 全栈架构与 L2+/L3 到 L4 路线图
        blocks:
          - type: paragraph
            body: >-
              Inceptio 最强的公开技术细节来自技术页面、白皮书落地页、2021 年 Xuanyuan 发布，以及后续 Taurus 披露。公司描述的全栈覆盖感知、规划 /
              控制、燃油效率算法、算力和量产部署工具。ULRS、HPLS、ARC 和 FEAD 被呈现为差异化算法模块，而 ADCU 代际则承载算力路线图，从 Xuanyuan 时代的 245 TOPS 硬件，走向
              Taurus 的 128 TOPS 单芯片 Journey 6M 实现。


              路线图明确是演进式。Inceptio 称，当前商业运营正在生成未来 L4 开发所需数据；管理层继续把完全无人驾驶商业化绑定到 2028 年底前 5 billion kilometer
              数据集。这意味着，今天的产品最好理解为一个产生数据的 L2+/L3 商业系统，终点是 L4，而不是市场上已经隐藏存在的无人车队。因此，架构和路线图互相缠绕：量产部署本身就是 R&D 引擎的一部分。
