companyProfile:
  summary: >-
    Inceptio Technology 是一家总部位于上海的自动驾驶卡车公司，成立于 2018 年 4 月，由创始人兼 CEO Julian Ma 领导。公司为重型卡车开发自研 Inceptio Autonomous Driving
    System，与 Dongfeng、Sinotruk、Foton 等 OEM 伙伴合作，把这套系统预装进量产卡车，并计划随时间把运营延伸成全国性的自动驾驶 Transportation-as-a-Service
    货运网络。公开里程碑显示，公司从 2021 年底推出行业首批量产 L3 重型卡车，推进到 2026 年 6 月商业运营里程超过 700 million kilometers；同时也有向 ZTO Express 交付 400
    辆卡车等具名物流部署。融资历史到 2022 年 2 月 Series B+ 延展轮为止有较充分公开支持，但收入、毛利率、烧钱速度和当前估值在保留的公开来源中仍未披露。
