  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              分析
              Inceptio，应先把它看作中国货运效率公司，其次才是自动驾驶故事。最有用的市场边界从中国公路货运开始，因为车队、货主和物流运营商已经在这里为牵引车、司机、利用率、安全和燃油付费。在这个分母内，Inceptio
              的近端实际切口是智能重卡：量产卡车上的工厂预装自动驾驶系统，先从 L2+/L3 起步，之后才向特定走廊上的无人货运服务推进。广义自动驾驶汽车支出方向上相关，但它混合了乘用车自动驾驶、robotaxi、消费级
              ADAS 和非货运场景；这些场景的买方和部署规则都与长途卡车货运差异很大。


              因而，被排除的类别很重要。乘用车 AV、仓储机器人、铁路或海运货运、纯车队软件支出、通用充电基础设施都触及物流技术栈，但不是 Inceptio
              正在解决的买方任务。当前替代集合要具体得多：人工驾驶柴油牵引车、人工运营电动重卡，以及干线上的劳动密集型接驳或甩挂作业。IDTechEx
              的中国分析在这里尤其有用，因为它把自动驾驶卡车界定为先辅助、后自动化的市场：货运线路固定，成本可衡量，近期预算逻辑来自劳动力、燃油、安全和利用率，而不是投机性的全 L4 时间表。
