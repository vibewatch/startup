      - number: '1.3'
        title: 融资历史、独角兽地位与 IPO 可选性
        blocks:
          - type: paragraph
            body: >-
              公开披露的融资轮次拼出了一条可信但仍不完整的资本历史。已审阅来源详细列出：2020 年 11 月由 CATL 领投的 $120 million 融资，2021 年 8 月由 JD
              Logistics、Meituan 和 PAG 共同领投的 $270 million Series B，以及 2022 年 2 月由 Sequoia China 和 Legend Capital 共同领投的
              $188 million Series B+。Reuters、Tracxn 和 CB Insights 都把 Inceptio 的累计融资置于大约 $678 million 到 $678.68
              million；这个量级与一家资金充足的私营公司方向一致，但不能仅靠公开逐项列出的轮次总额干净对账。


              这个差异重要，因为估值仍不透明。TechNode 摘要的 2025 年 1 月 Bloomberg 报道称，Inceptio 正在探索美国 IPO，可能募资大约 $100 million 到 $200
              million；但截至规范运行日期，已审阅来源集合没有显示公开申报、确认交易所或披露价格区间。另有一页长宁区政府页面称，Inceptio 入选 2024 胡润中国 AI 企业 Top
              50，并明确标注为独角兽企业；同页指出该榜单入围门槛为 RMB 6 billion。这是有用的方向性证据，说明市场观察者把 Inceptio 视为独角兽，但它不能替代已披露的投后估值或当前股权结构表。
