    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Inceptio 的产品应被理解为卖进干线卡车工作流的受监督高速自动驾驶栈，而不是面向消费者的自动驾驶功能。车队买方或物流运营商从 OEM 伙伴采购一辆量产卡车，工厂已预装 Inceptio
              自动驾驶包。随后，卡车在驾驶室内有真人担任安全监督员的情况下，运行长途快递、LTL、FTL、合同物流或冷链线路；Truck-NOA
              负责重复性的高速工作：巡航、匝道切换、变道、智能跟车，以及考虑燃油效率的速度规划。


              这个工作流重要，因为买方不需要围绕纯机器人运营模式重做调度。实际商业卖点是：长途线路更容易配司机、疲劳更低、告警率更低、燃油控制更好，并从今天受监督的 L2+/L3 运营通向未来 L4 服务。Inceptio
              页面反复围绕更安全、更高效的干线物流来组织技术叙事，而不是泛化自动驾驶；这与公司的线路、OEM 和客户披露一致。
