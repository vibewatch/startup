        - id: a2
          label: 首批交付或试点路线
        - id: a3
          label: 真实有人监督商业运营
        - id: a4
          label: 已衡量的人力 / 燃油 / 安全收益
        - id: a5
          label: 规模化车队采购或复购
        - id: a6
          label: 常态化纳入新车采购
      edges:
        - from: a1
          to: a2
          label: 启动
        - from: a2
          to: a3
          label: 路线上线
        - from: a3
          to: a4
          label: 运营数据
        - from: a4
          to: a5
          label: 扩张
        - from: a5
          to: a6
          label: 采购标准化
    claimRefs:
      - CU013
      - CU027
      - CU034
      - CU035
  - id: FU003
    title: 客户验证矩阵
    type: matrix
    layout: wide
    summary: 矩阵把强部署证据，与留存可见度弱、买方佐证稀疏的问题分开。
    data:
      columns:
        - 部署成熟度
        - 成效具体度
        - 独立佐证
        - 留存可见度
        - 买方佐证
      rows:
        - label: ZTO
          values:
            - label: 高
              tone: positive
              detail: 400 辆卡车交付规模大，而且足够近期。
            - label: 中
              tone: neutral
              detail: 收益有所披露，但量化不深。
            - label: 中
              tone: neutral
              detail: 行业媒体跟进报道。
            - label: 低
              tone: risk
              detail: 续约节奏未披露。
            - label: 低
              tone: risk
              detail: 审阅材料中未发现买方披露文件确认。
        - label: STO
          values:
            - label: 高
              tone: positive
              detail: 300 多辆卡车，再加后续订单。
            - label: 中
              tone: neutral
              detail: 燃油和人力指标已披露。
            - label: 中
              tone: neutral
              detail: 订单簿有外部报道。
            - label: 中
              tone: positive
              detail: 350 辆复购是真实的持续性信号。
            - label: 低
              tone: risk
              detail: 买方主导的公开披露仍然很少。
        - label: YTO
          values:
            - label: 高
              tone: positive
              detail: 300 辆交付显示路线使用已具规模。
            - label: 中
              tone: neutral
              detail: 单司机路线案例和节油数据较具体。
            - label: 低
              tone: risk
              detail: 独立跟进有限。
            - label: 低
              tone: risk
              detail: 尚未披露复购。
            - label: 低
              tone: risk
              detail: 审阅材料中未发现买方确认。
        - label: Nestlé
          values:
            - label: 中
              tone: neutral
              detail: 一个详细路线案例已公开。
            - label: 高
              tone: positive
              detail: 里程占比、成本和预警率变化都有具体披露。
            - label: 低
              tone: risk
              detail: 证据多由卖方撰写。
            - label: 低
              tone: risk
              detail: 没有公开合同或续约数据。
            - label: 低
              tone: risk
              detail: 未审阅到买方直接披露的物流材料。
        - label: Budweiser
          values:
            - label: 中
              tone: neutral
              detail: 材料描述了一条常态化示范路线，以及供应商采购的卡车。
            - label: 中
              tone: neutral
              detail: 里程占比和零事故说法较具体。
            - label: 低
              tone: risk
              detail: 证据主要由卖方撰写，并带有奖项背景。
            - label: 低
              tone: risk
              detail: 未披露复购或持续时间指标。
            - label: 低
              tone: risk
              detail: 未审阅到买方路线披露。
        - label: Huatai
          values:
            - label: 中高
              tone: positive
              detail: 40 辆卡车跑在具名路线，是有分量的合同物流证据。
            - label: 高
              tone: positive
              detail: 司机配比和 TCO 影响已量化。
            - label: 中
              tone: neutral
              detail: Gasgoo 提供了外部佐证。
            - label: 低
              tone: risk
              detail: 续约数据未公开。
            - label: 低
              tone: risk
              detail: 未审阅到客户主导的财务披露。
        - label: Deshun
          values:
            - label: 中
              tone: neutral
              detail: 冷链使用自 2023 年起已上线运行。
            - label: 中
              tone: neutral
              detail: 单司机和节油说法较具体。
            - label: 低
              tone: risk
              detail: 主要来自一篇通稿分发的来源。
            - label: 低
              tone: risk
              detail: 复购指标未公开。
            - label: 低
              tone: risk
              detail: 未审阅到买方披露。
        - label: Deppon
          values:
            - label: 中
              tone: neutral
              detail: 独立随车报道显示真实路线有连续性。
            - label: 高
              tone: positive
              detail: 系统参与、预警和燃油使用都有观察记录。
            - label: 高
              tone: positive
              detail: 独立一线报道异常扎实。
            - label: 中
              tone: neutral
              detail: 连续性可见，但合同指标不可见。
            - label: 低
              tone: risk
              detail: 未审阅到买方申报文件或案例研究披露。
    claimRefs:
      - CU010
      - CU018
      - CU021
      - CU023
      - CU025
      - CU036
      - CU042
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 最高严重度风险集中在监管节奏、OEM/客户集中度和未完成上市披露，而不是原始市场需求。
    data:
      columns:
        - label: 高影响
        - label: 中等影响
        - label: 可管理影响
      rows:
        - label: 高可能性
          values:
            - label: 许可驱动的部署瓶颈
              tone: critical
            - label: 无人驾驶时间表滑坡
              tone: negative
            - label: 买方持续施压价格
              tone: warning
        - label: 中高可能性
          values:
            - label: OEM 集中度冲击
              tone: negative
            - label: 旗舰客户表现不及预期
              tone: negative
            - label: 现场运营可靠性负担
              tone: warning
        - label: 中等可能性
          values:
            - label: IPO 时点 / 披露缺口
              tone: negative
            - label: 跨境数据审查
              tone: warning
            - label: 网络安全问题
              tone: warning
    claimRefs:
      - CR003
      - CR004
      - CR005
      - CR021
      - CR026
      - CR031
      - CR037
      - CR042
      - CR044
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 主要下行路径从许可和验证，传导到客户信心、融资灵活性，最终压到估值支撑。
    approximationNotes: 传导箭头是根据保留来源推断的分析性链接，不是数值模拟。
    data:
      nodes:
        - id: n1
          label: 许可瓶颈
          detail: 品类层面或地方审批限制，会拖慢高级自动驾驶运营
        - id: n2
          label: 运营验证负担
          detail: 硬件、现场数据和在线率仍需在规模上跑通
        - id: n3
          label: OEM 与客户集中度
          detail: 少数合作伙伴和标杆部署扛着整套证明链
        - id: n4
          label: 客户 ROI 信心
          detail: 人力、燃油和安全节省必须持续可见
        - id: n5
          label: 融资灵活性
          detail: 上市和后续融资只是选项，并非确定性保障
        - id: n6
          label: 估值支撑
          detail: 只有里程碑按时兑现，叙事才能守住溢价
      edges:
        - from: n1
          to: n4
          label: 审批放慢削弱采用信心
        - from: n1
          to: n5
          label: 延迟推高资金需求
        - from: n2
          to: n4
          label: 在线率和安全表现塑造 ROI 证据
        - from: n3
          to: n4
          label: 标杆客户结果影响可信度
        - from: n4
          to: n5
          label: 客户证据影响融资通道
        - from: n5
          to: n6
          label: 融资路径未完成会压缩价值
    claimRefs:
      - CR005
      - CR006
      - CR019
      - CR021
      - CR026
      - CR033
      - CR037
      - CR044
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Inceptio 的部署模型，需要监管方、OEM、旗舰车队和资本提供方按顺序推进，而不是各自独立行动。
    approximationNotes: 仅展示保留来源中有直接证据的交易对手或依赖类别。
    data:
      nodes:
        - id: d1
          label: 中国监管方
          detail: 高级卡车自动驾驶的许可和规则解释
        - id: d2
          label: OEM 合作伙伴
          detail: Dongfeng、Sinotruk 和工厂集成路径
        - id: d3
          label: 旗舰物流车队
          detail: ZTO 和其他大型参考客户
        - id: d4
          label: 资本提供方
          detail: 私募投资者和潜在 IPO 买方
        - id: d5
          label: Inceptio 自动驾驶栈
          detail: Taurus、T-NOA、数据管线和验证闭环
        - id: d6
          label: 商业规模叙事
          detail: 支撑更多订单和融资的证据
      edges:
        - from: d1
          to: d5
          label: 审批边界
        - from: d2
          to: d5
          label: 工厂集成和车型广度
        - from: d3
          to: d6
          label: 参考部署
        - from: d5
          to: d6
          label: 安全与成本表现
        - from: d4
          to: d5
          label: 研发和资本开支续航
        - from: d6
          to: d4
          label: 支撑未来融资信心
    claimRefs:
      - CR020
      - CR024
      - CR026
      - CR030
      - CR031
      - CR033
      - CR037
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议逻辑从底部支撑和商业化证据出发，再落到披露缺口和最终价格纪律。
    data:
      nodes:
        - id: n1
          label: 存在独角兽底部支撑
          detail: Hurun 门槛意味着至少 ~RMB 6B / ~$820M
        - id: n2
          label: 商业化证据较少见
          detail: 2024 年 200M+ km，到 2026 年 ~700M km，数千辆卡车
        - id: n3
          label: 融资深度真实
          detail: 已募资 ~$678M，且 IPO 信号可见
        - id: n4
          label: 财务披露缺失
          detail: 保留材料中没有公司专属公开申报文件，也没有公开收入材料包
        - id: n5
          label: 用区间，不用单点目标
          detail: 按状态和里程碑估值，比套倍数更站得住
        - id: n6
          label: 带着价格纪律跟踪
          detail: 接近基础区间算合理；披露改善前，高于 ~$2B 就显得偏贵
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV011
      - CV027
      - CV028
      - CV035
      - CV037
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 示意性估值锚点显示，披露和里程碑质量，比单纯里程大数更能推动可辩护区间。
    approximationNotes: 数值是以十亿美元计的编辑锚点，不是市场报价或管理层指引。
    data:
      items:
        - label: 仅 Hurun 底部
          value: 0.82
        - label: 融资底部加成
          value: 1
        - label: 当前基础中点
          value: 1.5
        - label: 具备申报级经济性
          value: 2.2
        - label: 具备申报 + 许可进展
          value: 2.7
    claimRefs:
      - CV001
      - CV027
      - CV028
      - CV033
      - CV034
      - CV037
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 低、基础和高位区间说明，披露质量为何是当前上行空间的主要门槛。
    approximationNotes: 区间是分析用估值带，以十亿美元计，结合估值底线、融资情况、商业化状态和披露质量拼出。
    data:
      items:
        - label: 低情景——估值底线守住，披露仍薄
          low: 0.8
          high: 1.1
          unit: $B
        - label: 基准情景——规模得到验证，叠加 IPO 选择权
          low: 1.2
          high: 1.8
          unit: $B
        - label: 高情景——申报与无人驾驶路径改善
          low: 2
          high: 3
          unit: $B
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV037
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 按投委会口径打分，商业化和战略价值拿分较高，估值清晰度和披露仍拖后腿。
    approximationNotes: 评分采用 1-5 的编辑量表，依据截至生成日留存的公开证据。
    data:
      items:
        - label: 商业化验证
          value: 4
          unit: /5
          note: 公开证据显示，作为一家私有卡车自动驾驶公司，其车队和里程规模已经较大。
        - label: 市场 / 战略价值
          value: 4
          unit: /5
          note: 物流成本压力仍大，自动驾驶选择权也仍然可观。
        - label: 技术 / 路线覆盖
          value: 4
          unit: /5
          note: 97% 高速公路覆盖率和 OEM 集成是实质优势。
        - label: 经济性可见度
          value: 2
          unit: /5
          note: 收入和毛利率仍未公开披露。
        - label: 监管节奏信心
          value: 2
          unit: /5
          note: 2028 年中目标和许可不确定性仍压住信心。
        - label: 估值清晰度
          value: 2
          unit: /5
          note: 可以搭出区间逻辑，但还无法精确定价。
    claimRefs:
      - CV011
      - CV012
      - CV014
      - CV016
      - CV035
      - CV036
      - CV037
