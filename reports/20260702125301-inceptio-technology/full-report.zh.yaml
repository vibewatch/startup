      - 对承销的影响
      - 精确尽调路径
    rows:
      - - 收入和收入结构
        - 无法区分硬件带动的项目收入、经常性软件收入或服务收入
        - 要求按收入流、地区和客户群组提供经审计收入
      - - 按收入流拆分的毛利率
        - 无法判断当前商业化是在增厚毛利，还是为未来数据捕获补贴
        - 要求拆分硬件、软件、服务和支持的毛利率
      - - 现金余额、烧钱和跑道
        - 无法判断偿付能力、稀释时点或融资紧迫性
        - 要求提供最新现金头寸、月度烧钱桥和下行情景跑道模型
      - - 债务、担保和表外义务
        - 如果设备、服务或合作伙伴承诺在公开视野之外，资本强度可能被低估
        - 要求提供完整义务时间表，包括租赁、担保和供应商承诺
      - - 客户集中度和续约
        - 少数大型快递车队可能主导收入基础和议价权
        - 要求提供头部客户收入占比、续约率和扩张群组数据
      - - 收入确认机制
        - 入账收入可能因价值是在售车、激活还是托管服务交付时确认而出现实质差异
        - 要求提供会计备忘录和客户合同样本
      - - 实际定价和折扣
        - 公开 ROI 主张看不出 Inceptio 保留了多少节省池
        - 要求提供发票级定价、返点、渠道经济性和支持附加率
    notes: 这些不是表面性的披露要求；每一项都卡住公开证据本身无法支持的具体承销结论。
