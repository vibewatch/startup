      - number: '4.4'
        title: 牵引力与缺失指标，以及承保结论
        blocks:
          - type: paragraph
            body: >-
              这里最容易犯的错误，是把缺少公开财务数据直接称作业务本身的弱点。那会过头。保留证据清楚显示商业采用、线路级价值、OEM
              集成和客户部署意愿。它没有显示的是，这些运营胜利如何转化为收入质量、利润率耐久性或现金跑道。没有公开收入线，没有 ARR 披露，没有毛利率桥，没有债务期限表，没有客户集中度表，也没有公开证据说明 Inceptio
              从节省池中捕获多少、又与 OEM 和车队分享多少。即便同业比较也只能走到这里：Aurora 和 Pony.ai 也更强调服务经济性和伙伴结构，而不是透明公开定价。因此，财务结论受限但有用：Inceptio
              看起来商业可信且战略重要，但公开证据仍过于稀疏，无法有把握地承保完整远期
              P&L、烧钱曲线或稀释路径。正确的尽调姿态，是把公开证据视为需求形成和运营有效性的证明，同时把任何关于利润率或现金跑道的确信留给私有数据审阅。
