      - number: '7.4'
        title: 资本强度高且上市状态未完成，是主要财务风险；公开披露仍落后于技术进展
        blocks:
          - type: paragraph
            body: >-
              资本故事很重，但还没有完全去风险。Tracxn 和 CB Insights 估算累计融资约 $678 million；ACN Newswire、CNEVPost 和 PRNewswire 也都确认，公司在
              2022 年初完成 $188 million Series B+，此前 2020、2021 年已拿过大额融资。融资历史说明投资人支持很深，也说明公司走到今天已经消耗了大量外部资本。TechNode 援引
              Bloomberg 称，公司曾考虑赴美 IPO，募资规模只有 $100 million 到 $200 million；Caplight 则把公司标为「已宣布
              IPO」。这些不是坏信号，但信号不完整。它们提示：在外部投资人看清经济性之前，公司仍需要保留公共市场选项。


              披露缺口才是核心财务风险。虽然保留了一条 SEC 检索来源，但本章公开资料包没有公司专属申报文件。Inceptio
              的运营口径很强，却仍来自公司或合作伙伴披露，而不是经审计的公开收入、毛利率或现金消耗数据。也就是说，投资人能清楚看到商业化动能，却仍无法独立给营运资金需求、客户集中度或优先股负担定价。如果 IPO
              延后、公开市场风险偏好恶化，或者资本市场决定先要经审计的经济性再奖励自动驾驶故事，公司可能在无人驾驶部署成本上升的节点遭遇融资缺口。
