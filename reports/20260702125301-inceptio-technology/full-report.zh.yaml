      - number: '2.2'
        title: 市场规模视角与相互矛盾的预测
        blocks:
          - type: paragraph
            body: >-
              最干净的自上而下锚点是中国公路货运运输，而不是自动驾驶软件。Mordor Intelligence 估算，中国公路货运在 2026 年为 $500.9 billion，到 2031 年达到 $668.55
              billion；这给出了任何卡车平台、车队软件供应商或自动驾驶运营商必须争夺份额的相关支出基础。China Daily 提供第二个运营视角：它把长途物流描述为万亿元级市场，并强调中国物流成本占 GDP
              的比例仍异常高。对尽调而言，这些货运分母比一个不加区分的 AV TAM 更重要，因为它们对应真正购买卡车和物流服务的预算。


              同时，几个相邻规模视角也重要到不能忽略。GII Research 对中国广义自动驾驶汽车的预测指向 2025 年 $22.84 billion，到 2034 年增长至 $218.95
              billion；这说明自动化支出增长很快，但显然夸大了与 Inceptio 的相关性，因为它包含乘用车和非货运类别。EqualOcean 的重卡情景窄得多，也对货运更乐观：预计中国物流体系内有 6.27
              million 辆重卡，到 2030 年自动驾驶卡车收入达到 853.9 billion yuan。新能源重卡数据提供第四个视角：2025 年销量 231,100 辆，渗透率 28.89%，预期 2026 年约
              35% 渗透率，2030 年超过 50%。正确结论不是选一个预测并称其为事实，而是诚实保留不匹配，把 Inceptio 的真实 SAM 估算为电动化、获准通行、重复线路货运走廊的子集，而不是整个中国 AV 市场。
