  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与跨境风险仍是无人驾驶逻辑中严重程度最高的约束
        blocks:
          - type: paragraph
            body: >-
              中国自动驾驶规则在推进，但这仍不等同于一个始终开放的全国无人重卡商业市场。Electrive、Law.asia 和 CMS 都描述了这样的环境：法律框架正走向更清晰的 Level 3 和 Level 4
              规则，但在 2027 年 7 月国家标准生效前，仍依赖试点逻辑、本地执行和过渡性监管叠层。这意味着时间风险是结构性的：即便技术上有能力的运营商，也可能被认证顺序、本地许可实践或走廊特定审批拖慢。


              2026 年 4 月，CNBC 报道称，武汉 Baidu Apollo Go 事故后，中国主管部门暂停发放新的自动驾驶牌照，政策背景随之更脆弱。Inceptio
              本身没有被点名为原因，但这个信号重要，因为全类别暂停会重置所有人的部署时间表。跨境扩张又带来第二个法律问题。Carnegie
              认为，在美国和伙伴市场，中国对数据的访问以及对联网技术的控制，正越来越被视为国家安全问题。对一家希望出海的卡车自动驾驶公司来说，风险不只是产品合规，而是东道国监管者一开始是否接受其软件、数据和基础设施栈。
