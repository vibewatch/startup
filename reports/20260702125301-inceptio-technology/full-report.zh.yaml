        title: 收入模式与实际公开信息
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一套清晰的商业架构，但不支持一份公开损益表。Inceptio 把自己描述为自动驾驶卡车技术提供商，也是未来 TaaS 货运网络运营商，这意味着至少三层变现：OEM
              预装车辆项目、可选辅助驾驶包，以及自动驾驶货运规模扩大后的运营或服务收入。Reuters 补充称，Inceptio 开发技术，Dongfeng
              制造卡车，车队购买车辆；这进一步说明当前变现嵌在卡车项目中，而不是已披露的纯软件订阅。最强的公开牵引证据是运营层面而非财务层面：大型客户部署、数千辆卡车、数亿商业公里。但保留来源没有披露收入、ARR、递延收入或分流的收入确认政策。投资者能看出这门生意应当如何赚钱；却看不到今天赚了多少，以及收入如何入账。
