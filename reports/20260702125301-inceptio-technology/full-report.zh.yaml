      - number: '8.5'
        title: 只有当尽调补齐少数真正能改变价值的输入时，最终判断才该移动
        blocks:
          - type: paragraph
            body: >-
              最终投资辩论不是 Inceptio
              值不值得关注；它显然值得。真正问题是，哪些缺失事实足以移动估值区间，从而支持承销。累计里程再创一个里程碑当然重要，但重要性不如真实申报文件、收入桥、毛利率披露、客户集中度数据，或清晰的优先股结构。同样，再来一个客户案例有帮助，但不如证明公司能按接近管理层时间表，把当前
              L2+/L3 规模转化为无人驾驶商业批准。


              因此，本章保持纪律。如果申报文件出现、公司披露收入质量、牌照路径更具体，高情景会很快更可信。如果披露仍薄、IPO
              时钟继续往后移、监管者仍谨慎，即使基准情景也应打折。务实的下一步，是索取最小但足以改变建议的尽调包：经济性、集中度、股权结构和牌照路线图。
