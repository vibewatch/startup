      - number: '5.5'
        title: 依赖项与技术风险
        blocks:
          - type: paragraph
            body: >-
              最大产品风险不是 Inceptio 能否在单条线路上演示自动驾驶，而是公司能否在足够多 OEM 项目中足够快地把栈工业化，同时继续积累 L4 所需数据。公开依赖图谱显示三组紧耦合：Horizon
              的芯片路线图、伙伴 OEM 的量产节奏，以及监管对从受监督到无人驾驶推进的容忍度。Taurus 降低了集成复杂度，但也提高了对特定硅片和软硬件协同设计路径的依赖。


              证据质量也有限。公开材料在一些呈现细节上存在分歧，例如当前量产传感器范围的表述；已审阅来源没有发布按平台划分的故障、干预或双供应策略明细。CNBC 2026
              年报道强调了主要闸门现实：如果真实卡车数据、量产伙伴和审批仍是瓶颈，生成式 AI 热潮不会缩短路径。因此，正确的尽调姿态，是把这个栈视为先进且已在受监督高速运营中商业证明，但其 L4 终局仍依赖多个外部系统。
