  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础分层
        blocks:
          - type: paragraph
            body: >-
              Inceptio 的公开客户表面比一个 ZTO 头部交易更宽。可见基础覆盖快递包裹承运商（ZTO、YTO、STO、ZTO
              Freight、Yunyi）、零担和快运专业方（Kuayue）、合同物流运营商（Huatai）、冷链承运商（Deshun），以及通过物流伙伴运行的品牌主线路（Budweiser 和
              Nestlé）。这个分层重要，因为买方、用户和付款方并不总是同一实体。有时买方是车队运营商或物流服务商；有时战略需求信号来自希望补货更绿色、更安全的品牌主；用户仍是担任安全监督员的专业司机。


              实际共同点是长途线路经济性。公开案例强调 700 到 1,500 公里的走廊，在这些线路上，受监督自动驾驶系统无需等待 L4 监管，就能替代双司机工作流、降低疲劳并提升燃油效率。这解释了为什么 Inceptio
              最强的公开证明出现在中国干线物流，而不是通用城市配送。
