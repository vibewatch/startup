chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              Inceptio Technology 把自己定位为面向重型卡车的全栈自动驾驶技术公司，重点放在干线货运，而不是乘用车自动驾驶。官方英文材料描述的是双轨模式：眼下销售并支持预装 Inceptio
              Autonomous Driving System 的量产卡车，同时用真实运营积累，搭建未来自动驾驶 Transportation-as-a-Service 货运网络。公司称，2021 年底与 OEM
              合作推出行业首批量产 L3 自动驾驶卡车，并在 2022 年拿到中国首张无人驾驶重型卡车公开道路测试许可。


              身份信息大体清楚，但并不完全干净。公开来源一致把公司成立时间放在 2018 年，并将 Julian Ma 识别为创始人兼 CEO。Reuters 和 CnEVPost 称 Inceptio 于 2018 年 4
              月成立，背后有 G7、GLP 和 NIO Capital 支持，这更像是有发起方背书的起点，而不是单一创始人白手起家。公司的公开视频足迹把总部锚定在上海杨浦区，官网页脚还列出位于 Santa Clara
              的硅谷办公室。同一页脚把版权归属于 Jiluo Technology (Shanghai) Co., Ltd.，这看起来是 Inceptio 品牌背后的运营法律实体，但在本次审阅的公开材料中尚未被完整映射。
