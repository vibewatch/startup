      - number: '2.4'
        title: 增长驱动、约束与仍需尽调的内容
        blocks:
          - type: paragraph
            body: >-
              最强的宏观驱动是中国物流的结构性低效。China Daily 援引 China Logistics Information Center 称，2023 年社会物流总费用为 18.2 trillion
              yuan，相当于 GDP 的 14.4%，而发达市场低于 10%。这个差距为任何能够降低劳动强度、减少事故、改善燃油经济性、提高卡车利用率的系统创造了清晰的 ROI 池。Mordor
              还补充了两个支持性行业事实：市场分散，司机队伍老化且短缺，车队仍面临空驶回程和成本波动。电动化也是重要驱动，因为智能或自动驾驶功能更自然地附着在已经更新为联网新能源重卡的车队上。


              约束同样实质。辅助驾驶经济性是真实的，但最有说服力的公开数字仍来自公司相关或分析师转述的案例研究，而不是经审计的车队队列。监管也是闸门因素。中国政策方向支持，但更高等级自动驾驶的公开道路部署仍依赖本地试点、走廊许可、仍在最终定稿的国家安全标准，以及严格的数据和责任规则。结果是，市场采用应按分阶段商业化承保，而不是按全国立即替代
              L4 货运承保。投资者可以合理相信市场庞大且在改善，同时在做激进渗透假设前，仍应要求走廊级许可地图、线路级单位经济性和标准化 TAM 方法论。
