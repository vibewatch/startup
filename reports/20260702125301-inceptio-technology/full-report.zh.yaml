      - number: '8.3'
        title: 当前最佳估值锚是底线加区间，而不是倍数驱动的单点估计
        blocks:
          - type: paragraph
            body: >-
              由于公开收入未披露，本章不应假装收入倍数或 DCF 能算出可信的单一数字。更好的方法，是从最强的可观察锚点往上搭。第一，Hurun 门槛给出约 $820 million 的可辩护下限。第二，Tracxn、CB
              Insights 和保留的融资报道显示，累计融资基数约 $678 million，且公司仍有上市意图。第三，Inceptio 的商业化指标强于普通私有自动驾驶创业公司，因此有理由相对简单底线享有溢价。


              这个逻辑支持宽区间，而不是精确目标。低情景约 $0.8 billion 到 $1.1 billion，假设披露仍薄、IPO 时间推迟，公司估值只在 Hurun 底线或略高于底线。基准情景约 $1.2
              billion 到 $1.8 billion，假设里程继续增长、客户采购标准化、IPO 选项仍在，但没有经审计的公开收入。高情景约 $2.0 billion 到 $3.0
              billion，需要真实申报进展、更清晰经济性，以及朝无人驾驶商业批准迈出可见一步。高于这一水平，本章会把估值视为叙事驱动多于证据驱动。
