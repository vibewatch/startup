- id: adoption-trajectory
  title: Adoption Trajectory and Deployment Scale
  body: |-
    The company’s adoption trajectory is unusually visible for a private trucking-autonomy vendor. Public milestones move from roughly 600 trucks in service in August 2023, to 40 million cumulative kilometers in July 2023, to 100 million by May 2024, to 200 million and more than 2,000 trucks by late 2024, and to 700 million cumulative kilometers plus several thousand trucks by June 2026. That pattern matters more than any single press release because it shows the customer base growing through repeated route deployment rather than one isolated showcase vehicle.

    Scale also appears through route and trip counts. The August 2023 order announcement said Inceptio had already made nearly 50,000 trips on 340 routes for more than 100 freight and logistics customers. Reuters independently reported management’s expectation that in-service truck count would quadruple from around 600 by mid-2024, which aligns directionally with later milestone disclosures. The exact denominator for active versus idle trucks remains undisclosed, but the trajectory supports a production-deployment narrative rather than a lab-demo one.
  claimRefs:
  - CU014
  - CU027
  - CU028
  - CU029
  - CU034
