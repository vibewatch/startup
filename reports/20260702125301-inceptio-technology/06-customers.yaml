  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: customer-roster
    missingEvidence: A complete customer roster with active units, live routes, and status labels for every named logo.
    whyItMatters: The named-customer table is clearly partial; without a full roster, deployment breadth and concentration can be overstated.
    diligencePath: Request the current customer ledger with columns for pilot, live route, scaled fleet, reorder, suspended, and exited status.
    relatedQuestionRefs:
    - QU001
    - QU002
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: blocking
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, contract duration, and utilization by customer or segment.
    whyItMatters: Customer durability is a core underwriting variable, and the public record does not disclose any standard retention metrics.
    diligencePath: Request customer-cohort tables, contract terms, and account-level expansion or contraction history.
    relatedQuestionRefs:
    - QU018
    - QU019
    - QU021
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, wallet share, or gross-profit contribution by account.
    whyItMatters: A visible roster dominated by a few major carriers can hide a concentrated revenue base with asymmetric downside.
    diligencePath: Request top-10 customer exposure, revenue concentration by segment, and scenario analysis for loss of a top carrier.
    relatedQuestionRefs:
    - QU020
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: buyer-side-corroboration
    missingEvidence: Direct buyer-side disclosures for SF Express and JD Logistics, plus stronger corroboration for YTO and STO from customer-controlled channels.
    whyItMatters: Repeated seller-side naming is not the same as buyer-authenticated proof of fleet size, renewal, or spend.
    diligencePath: Search annual reports, investor decks, and procurement disclosures from SF, JD, YTO, and STO; ask management for customer reference calls.
    relatedQuestionRefs:
    - QU023
    - QU025
    - QU026
    relatedTableRefs:
    - TU006
  - type: stale
    severity: minor
    topic: pilot-vs-production-labels
    missingEvidence: A program-by-program status taxonomy separating early trials, live route operations, scaled fleets, and reorder-backed deployments.
    whyItMatters: Public materials use pilot and commercial language inconsistently, which can blur maturity assessment.
    diligencePath: Ask management for a standardized deployment taxonomy and the date each named program moved from pilot to scaled commercial status.
    relatedQuestionRefs:
    - QU017
