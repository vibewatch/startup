company:
  name: Inceptio Technology
chapter:
  number: 6
  title: Customers
  summary: |-
    Inceptio’s customer proof is strongest in Chinese line-haul logistics, where public sources document fleet-scale deployments with ZTO, YTO, STO, Huatai, Deshun, Kuayue, and Yunyi, plus route-level brand-owner cases for Nestlé and Budweiser. The adoption trajectory is material: public disclosures move from roughly 600 trucks in service in August 2023 to more than 2,000 by late 2024 and several thousand by mid-2026, while cumulative commercial mileage rises from 40 million to 700 million kilometers over the same period. The key customer-side weakness is not lack of named deployments, but lack of retention and concentration disclosure: public evidence says little about churn, NRR, buyer-side confirmation quality, or top-customer revenue dependence.
sections:
- id: customer-segmentation
  title: Customer Base Segmentation
  body: |-
    Inceptio’s public customer surface is broader than one headline ZTO deal. The visible base spans express parcel carriers (ZTO, YTO, STO, ZTO Freight, Yunyi), less-than-truckload and express specialists (Kuayue), contract-logistics operators (Huatai), cold-chain carriers (Deshun), and brand-owner lanes routed through logistics partners (Budweiser and Nestlé). That segmentation matters because the buyer, user, and payer are not always the same entity. Sometimes the buyer is a fleet operator or logistics service provider; sometimes the strategic demand signal comes from a brand owner that wants greener, safer replenishment; and the user remains a professional driver acting as safety supervisor.

    The practical commonality is long-haul route economics. Public cases emphasize 700- to 1,500-kilometer corridors where a supervised autonomy system can replace a two-driver workflow, lower fatigue, and improve fuel efficiency without waiting for L4 regulation. That explains why Inceptio’s strongest public proof appears in Chinese line-haul logistics rather than in general-purpose urban distribution.
