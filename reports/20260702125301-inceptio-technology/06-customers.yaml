  figureRefs:
  - FU002
- id: named-proof
  title: 'Named Customer Proof: Production Versus Pilot'
  body: |-
    The strongest production evidence sits with named deliveries and route-level case studies. YTO’s 300-truck delivery, STO’s 300-plus trucks plus a 350-unit reorder, and ZTO’s 400-truck delivery all look like real fleet programs rather than logo-only marketing. Huatai’s 40-truck auto-parts deployment and Deshun’s cold-chain routes show that the system is not confined to the express duopoly. Nestlé and Budweiser deepen the proof by tying the platform to concrete long-haul routes, mileage shares, and award-backed case studies, although those deployments often run through logistics suppliers rather than direct brand-owner truck ownership.

    Not every named customer is equally strong proof. Deppon has unusually rich route-level evidence through an independent ride-along, but the article still uses “trial operations” language for the 2021 starting point. Kuayue and Yunyi are credible additions, yet they have shallower independent follow-through than ZTO, STO, or Huatai. The right read is that Inceptio has multiple real deployments, but proof quality is uneven by customer.
