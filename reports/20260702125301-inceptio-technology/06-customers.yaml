- id: concentration-limits
  title: Concentration Risk and Evidence Limits
  body: |-
    Customer concentration is the main unresolved customer-side diligence issue. The same small cluster of names — ZTO, STO, YTO, JD, SF, plus a handful of brand-owner lanes — dominates nearly every public disclosure. That does not prove concentration, but it does mean the publicly visible base is skewed toward a few large Chinese logistics operators. The reviewed sources never disclose top-customer revenue share, wallet share per route, churn, or inactive-fleet rates. Buyer-side corroboration is also inconsistent: SF and JD are repeatedly named in seller-authored milestone releases, yet the public set reviewed here does not include dedicated buyer-side confirmation pages.

    There is also a deployment-quality limit. CNBC’s 2026 article makes clear that current commercial relationships are still supervised L2+/L3 programs, not driverless L4 operations. The Standard’s IPO article names customers but provides no customer-count or revenue-mix transparency. The result is a credible adoption story with real production evidence, but still incomplete visibility into concentration, retention, and the boundary between scaled production and persistent trial terminology.
  claimRefs:
