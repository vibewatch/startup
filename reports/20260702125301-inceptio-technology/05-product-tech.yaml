- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer or component
  - public role
  - key public detail
  - dependency
  - risk
  rows:
  - - Sensor fusion
    - Vehicle perception
    - LiDAR, radar, camera fusion on productized trucks
    - Sensor supply chain and calibration quality
    - Model-specific sensor layouts vary publicly and are not fully normalized
  - - ULRS / HPLS perception
    - Long-range and lateral sensing
    - 400m perception framing and 54% better lateral accuracy claim
    - Training data, perception compute, clean sensor inputs
    - Current production range and benchmark methodology are not independently published
  - - ARC 2.0 control
    - Articulated truck stability and path control
    - <8cm control error against varying load and tractor-trailer flexibility
    - Vehicle model accuracy and real-time control latency
    - Few independent route observations beyond the Deppon ride-along
  - - FEAD 2.0
    - Fuel optimization
    - Velocity optimization based on massive operational data
    - Route coverage, map context, driver acceptance
    - Savings range still comes largely from company-selected cases
  - - ADCU / Taurus
    - Compute, storage, and real-time control
    - Taurus integrates CPU+BPU+MCU on Journey 6M at 137K DMIPS and 128 TOPS
    - Horizon silicon roadmap and thermal qualification
    - Single-chip concentration can become a bottleneck if supplier plans slip
  - - OTA + deployment toolkit
    - Vehicle adaptation and software iteration
    - Standardized SDK and OTA path support new-model rollout
    - OEM E/E architecture cooperation and validation gates
    - No public per-model integration cost or revalidation cycle time
  notes: 'Notes: table mixes current production claims with roadmap-era disclosures; where independent corroboration is thin, that limitation is stated explicitly in the risk column.'
