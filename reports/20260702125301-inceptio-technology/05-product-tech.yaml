- id: architecture-roadmap
  title: Full-Stack Architecture and L2+/L3 to L4 Roadmap
  body: |-
    Inceptio’s strongest public technical detail comes from the technology page, the white-paper landing page, the 2021 Xuanyuan launch, and later Taurus disclosures. The company describes a full stack spanning perception, planning/control, fuel-efficiency algorithms, compute, and serial-production deployment tooling. ULRS, HPLS, ARC, and FEAD are presented as the differentiated algorithmic building blocks, while ADCU generations carry the compute roadmap from 245 TOPS Xuanyuan-era hardware to Taurus’s 128 TOPS single-chip Journey 6M implementation.

    The roadmap is explicitly evolutionary. Inceptio says current commercial operations generate the data needed for future L4 development, and management continues to tie fully driverless commercialization to a 5 billion kilometer dataset by late 2028. That means today’s product is best understood as a data-generating L2+/L3 commercial system with an L4 destination, not a hidden driverless fleet already in market. The architecture and roadmap are therefore intertwined: production deployment is itself part of the R&D engine.
