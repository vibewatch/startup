company:
  name: Inceptio Technology
chapter:
  number: 5
  title: Product & Technology
  summary: |-
    Inceptio’s current commercial product is a supervised highway-autonomy stack for serial-production heavy-duty trucks, sold through OEM-integrated programs rather than retrofit kits. Public materials support a real full-stack architecture story — ULRS/HPLS perception, ARC control, FEAD fuel optimization, and an ADCU roadmap that now culminates in Taurus on Horizon Journey 6M — plus a credible trust stack spanning ASIL-D, ISO/SAE 21434, ASPICE CL2, and public-road L4 testing permits. The central technical question is no longer whether the company can automate line-haul highway driving at L2+/L3 scale, but whether Horizon supply, OEM production cadence, and regulator-approved data accumulation can carry the same platform from today’s supervised product to a 2028 driverless target.
sections:
- id: product-workflow
  title: Product Definition and Customer Workflow
  body: |-
    Inceptio’s product should be understood as a supervised highway-autonomy stack sold into the line-haul truck workflow, not as a consumer self-driving feature. A fleet buyer or logistics operator procures a serial-production truck from an OEM partner with Inceptio’s autonomous-driving package preloaded at the factory. The truck then runs long-distance express, LTL, FTL, contract-logistics, or cold-chain routes with a human in the cab acting as safety supervisor while Truck-NOA handles the repetitive highway work: cruising, ramp transitions, lane changes, intelligent following, and fuel-aware speed planning.

    That workflow matters because the buyer does not need to redesign dispatch around a robot-only operating model. The practical commercial pitch is easier-to-staff long-haul lanes, lower fatigue, lower warning rates, better fuel control, and a path from today’s supervised L2+/L3 operation toward future L4 service. Inceptio’s pages repeatedly frame the technology around safer and more efficient line-haul logistics rather than generalized autonomy, which is consistent with the company’s route, OEM, and customer disclosures.
