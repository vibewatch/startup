  - type: private-evidence-only
    severity: material
    topic: supplier-dependency
    missingEvidence: A current dual-sourcing map for compute, sensors, and vehicle-control hardware by platform generation.
    whyItMatters: Single-supplier dependence can turn a technology edge into a deployment bottleneck when scaling OEM programs.
    diligencePath: Request a current supplier matrix, fallback part numbers, and any dual-sourcing qualification plan for Taurus and successor ADCUs.
