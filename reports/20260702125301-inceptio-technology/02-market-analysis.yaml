- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - China logistics cost intensity remains high at 14.4% of GDP
    - Positive
    - Current
    - Creates a large macro ROI pool for freight-efficiency technology
    - Validate how savings are captured between fleet, driver, and shipper
  - - Driver shortage, aging workforce, and fragmentation pressure fleets to automate
    - Positive
    - Current to near-term
    - Supports willingness to pay for labor-saving and safety-improving tools
    - Check which segments are most exposed by corridor and cargo type
  - - New-energy heavy-duty truck penetration is scaling rapidly
    - Positive
    - Current to near-term
    - Creates a hardware install base for smart-truck and autonomy attach
    - Verify whether penetration is concentrated in specific fleet segments
  - - Assisted-driving case studies show labor, fuel, and safety benefits
    - Positive
    - Near-term
    - Supports L2+/L3 adoption before full L4 is legal at scale
    - Request fleet-level cohort data rather than single-route anecdotes
  - - National and local policy direction is supportive
    - Positive
    - Current to medium-term
    - Improves pilot-to-commercialization visibility
    - Map which permits are corridor-specific versus generally usable
  - - Vehicle and autonomy stack capital intensity remains high
    - Negative
    - Current
    - Delays profitability and raises financing dependence
    - Request unit economics by truck, software attach, and route
  - - Regulatory permissions remain local and staged
    - Negative
    - Current to medium-term
    - Constrains real SAM versus headline TAM
    - Build corridor-level permit inventory and commercialization map
  - - Liability, data-governance, and methodology uncertainty persist
    - Negative
    - Current to medium-term
    - Slows aggressive adoption assumptions and makes TAM narratives fragile
    - Review legal responsibility, data controls, and source-methodology differences
  notes: Near-term positives are strongest at the electrification and assisted-driving layers; the hardest constraints still sit at the national-scale higher-autonomy layer.
