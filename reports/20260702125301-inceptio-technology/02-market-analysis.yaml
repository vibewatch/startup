- id: market-sizing
  title: Market Sizing Lenses and Contradictory Forecasts
  body: |-
    The cleanest top-down anchor is China road freight transport, not autonomous software. Mordor Intelligence sizes China road freight at $500.9 billion in 2026 and $668.55 billion by 2031, which gives the relevant spend base from which any truck platform, fleet software supplier, or autonomy operator must win share. China Daily provides a second operational lens by describing long-haul logistics as a trillion-yuan market and by highlighting how China still carries unusually high logistics costs as a share of GDP. Those freight denominators matter more for diligence than an undifferentiated AV TAM because they map to the budgets that actually buy trucks and logistics services.

    At the same time, several adjacent sizing lenses are too important to ignore. GII Research's broad China autonomous-vehicles forecast points to $22.84 billion in 2025 growing to $218.95 billion by 2034, which signals rapid automation spending but clearly overstates Inceptio relevance because it includes passenger and non-freight categories. EqualOcean's heavy-duty-truck scenario is much narrower and more bullish for freight specifically, projecting 6.27 million heavy-duty trucks in China's logistics system and 853.9 billion yuan of autonomous-truck revenue by 2030. New-energy heavy-duty truck data provide a fourth lens: 231,100 units sold in 2025, 28.89% penetration, expectations for roughly 35% penetration in 2026, and more than 50% by 2030. The right conclusion is not to choose one forecast and call it truth. It is to preserve the mismatch honestly and size Inceptio's real SAM as a subset of electrified, permitted, repeat-route freight corridors rather than as the entire China AV market.
