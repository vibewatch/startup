              - CP003
              - CP004
              - CP005
              - CP006
      - number: '3.2'
        title: 直接同业差异化：Payhawk、Soldo 与 Moss
        blocks:
          - type: paragraph
            body: >-
              欧洲支出管理的直接竞争，暴露出主要金融科技挑战者之间关键的架构和工作流取舍。Pleo 采用共享企业钱包，员工卡从单一中央企业余额中扣款，并受细粒度支出限额和自动审批阈值约束。相比之下，Soldo
              为每位用户提供预充值钱包，给管理员设定硬性支出上限，特别适合不能容忍超支的建筑、物流和依靠拨款运营的组织。在中端市场，来自索非亚和伦敦的 Payhawk 凭借与 Oracle
              NetSuite、SAP、Microsoft Dynamics 等企业 ERP 的原生双向同步，积极定位在 Pleo 之上；Pleo 的原生深度则主要集中于云会计平台 Xero 和 QuickBooks。柏林的
              Moss 通过提供大量面向代理机构数字广告支出的虚拟卡竞争，但对国际交易收取更高外汇费用。Pleo
              以六个原生货币钱包（GBP、EUR、USD、DKK、SEK、NOK）应对，可消除匹配币种支出的换汇加价，在多币种欧洲贸易中保持持久优势。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP009
              - CP010
              - CP011
      - number: '3.3'
        title: 定价包装与员工数扩张经济性
        blocks:
          - type: paragraph
            body: >-
              Pleo 的商业模式由基础月度平台订阅层级和按用户收费组成，费用随客户员工数直接增长。按年计费时，付费方案包括 Essential（每月 £39）、Advanced（每月 £99）和 Beyond（每月
              £199）；每个层级含 3 名用户，新增用户每月另收 £11 至 £18。Pleo 还在 2026 年取消传统免费 Starter 层，设立每月起价 £9.50 的入门 Starter
              方案，使微型企业不再享有零成本采用。对于 10 至 50 人、因不再人工追收收据而获得较高投资回报的小组织，按席位定价很有吸引力；但企业扩大到 100 至 150
              人时，摩擦会急剧上升。更大的中端市场组织月度软件成本快速增加，功能深度却没有同步扩展，因此 Payhawk 等按量分层或统一费率的竞争者更具经济性。此外，Pleo
              是电子货币机构而非持牌银行，客户资金受电子货币法规保护，而不是由法定存款保障计划承保。
            claimRefs:
              - CP007
              - CP008
              - CP011
