  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源、变现机制与监管费用驱动因素
        blocks:
          - type: paragraph
            body: >-
              Pleo 的变现依赖两种主要机制：经常性软件订阅和支付交易量交换费。在早期规模化阶段，交易交换费约占公司收入的 70%。然而，欧洲监管将消费者和商业支付卡交换费严格限制为借记交易 0.2%、贷记交易
              0.3%。这一上限使 Pleo 无法复制 Ramp 或 Brex 等美国同业以交换费为主的变现模式。因此，Pleo 逐步把经济引擎转向更高层级的 SaaS 订阅套餐和多币种企业账户。Sacra Sacra
              的市场估算显示，Pleo 2025 年收入达到 $150 million，较 2024 年的 $113 million 同比增长 33%。与此同时，Kinnevik 在 2025 年末报告称，Pleo
              整体毛利率保持在 80% 以上，净收入流失低于 1%，说明一旦会计工作流、自动收据 OCR 和 ERP 集成嵌入客户财务团队，平台粘性很强。
