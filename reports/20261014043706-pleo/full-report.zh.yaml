  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、产品范围与可服务支出
        blocks:
          - type: paragraph
            body: >-
              企业支出管理市场位于一线运营采购和后台企业资源规划系统之间，是金融基础设施的关键层。Pleo 将核心可服务边界定义为员工卡支出、自动收据采集、自付费用报销和应付账款发票处理，同时明确避开制造业 ERP
              和总账会计的重运营范围。不同于依赖事后费用报告和人工纸质核对的传统企业信用卡项目，现代支出管理把实时授权规则直接嵌入通过 Mastercard 发行的实体和虚拟支付卡。Pleo
              获英国金融行为监管局和丹麦金融监管局监管授权，将支付发卡与工作流软件结合，在购买发生的瞬间采集交易数据。公司还通过多币种资金管理，以及 Embedded
              合作分销渠道扩大可服务范围，让第三方会计平台无需投入内部软件工程资源即可提供集成费用工作流。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
      - number: '2.2'
        title: 市场规模视角：TAM、SAM 与 SOM 的约束
        blocks:
          - type: paragraph
            body: >-
              评估欧洲支出管理的可服务市场，需要把宏观交易总量拆解为现实的软件和支付收入池。全球商业卡和企业支出构成超过 300 亿美元的总可服务市场，但 Pleo 的机会受地域重点和目标组织画像限制。欧盟和英国约有
              2,500 万家中小企业；不过，只有员工数达到 10 人或以上的企业，组织复杂度才足以支撑专门的支出管理软件。这形成了约 45 亿至 60 亿欧元的欧洲可服务市场，覆盖软件订阅和支付交换费。在其活跃覆盖的 16
              个欧洲司法辖区内，Pleo 的可获得服务市场估计为 8.5 亿至 12 亿欧元，目标约 35 万个潜在中端市场账户。Pleo 已披露超过 40,000 家活跃企业客户，年度收入运行率超过 1.5
              亿美元，商业势头已经可观；但要维持快速的市场份额扩张，仍需向现有客户交叉销售应付账款和现金管理产品。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM009
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM009
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM011
              - CM015
      - number: '2.3'
        title: 目标细分、买方画像与采购触发点
        blocks:
          - type: paragraph
            body: >-
              欧洲支出管理的采用动力，体现为小企业、中端市场企业和平台分销伙伴各自不同的买方优先级。员工数为 10 至 50
              人的组织，通常由创始人或董事总经理直接负责采购，主要痛点是纸质收据遗失和共享信用卡无人监控带来的行政负担。企业扩展到 50 至 250 人的中端市场后，经济买方转为 CFO
              或财务总监，重点关注自动化增值税核对、部门预算控制，以及与 Xero、DATEV、NetSuite 等会计平台的无缝同步。对于员工数最高达 1,000
              人的中上端企业，多实体子公司合并、外汇成本控制和严格审计轨迹成为首要要求。同时，Pleo 的 Embedded 分销策略面向独立软件供应商和会计 SaaS
              提供商的首席产品官，将其作为中间分销渠道，使合作伙伴平台能在现有客户工作流中直接嵌入白标支付卡和费用自动化。
            claimRefs:
              - CM007
              - CM008
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM010
              - CM011
      - number: '2.4'
        title: 增长催化剂、采用摩擦与投资判断不确定性
        blocks:
          - type: paragraph
            body: >-
              自动化支出管理的市场需求主要由严重的行政摩擦推动：近一半企业财务团队表示，人工审核工作流拖慢了运营速度。能够自动执行支出政策、加快月度结账的自主人工智能代理出现后，软件的付费意愿可能获得显著催化。尽管如此，欧洲各市场的采用约束仍然明显。跨境扩张必须应对各国电子发票要求、地方税务机关合规标准的碎片化，以及本土商业银行的防御性留客举措。从投资尽调角度看，重要的投资判断缺口仍未解决。Pleo
              是私营公司，关键单位经济——包括客户毛留存、净收入留存、队列流失，以及卡支付交换费与经常性软件订阅费的贡献拆分——严格保密，投资者只能以足够审慎的方式评估市场扩张。
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 卡与资金管理的多产品扩张
            body: Pleo 已将功能范围从企业智能费用卡扩展到发票应付账款和多币种现金管理。多产品整合提高平台粘性，覆盖交易量对应的支付交换费，并在欧洲 SMB 和中端市场客户中建立了抵御单功能点解决方案的能力。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM009
          - type: callout
            title: 司法辖区碎片化与私人指标不透明
            body: 在 16 个欧洲国家应对不同税制、电子发票要求和会计集成，会持续带来运营及本地化拖累。此外，缺乏关于队列毛留存、净收入留存和卡业务与 SaaS 利润率拆分的审计披露，要求采用保守的投资判断假设。
            calloutType: risk
            claimRefs:
              - CM013
              - CM014
              - CM015
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与替代品类别
        blocks:
          - type: paragraph
            body: >-
              企业支出管理和企业费用市场中，Pleo 面临四类竞争者：直接的去中心化卡片挑战者、中端市场 ERP 专家、细分及预付卡供应商，以及传统企业差旅和费用套件。Pleo
              通过为欧洲中小企业提供以员工为中心的支出体验，建立了主要市场地位。它不要求员工先垫付或处理繁琐的月度费用申报，而是发行与集中企业账户绑定的实体和虚拟 Mastercard
              卡。不过，市场日益拥挤。Payhawk、Soldo 和 Moss 以不同架构模式争夺欧洲企业支出的重叠细分市场；SAP Concur 和 Coupa 等成熟企业玩家仍拥有牢固的企业分销能力，Ramp
              等国际现代支出平台也在北美和全球软件评估中树立了强大的功能基准。随着规模扩大，Pleo 的核心挑战是同时对模块化软件替代品和传统银行企业卡保持差异化。
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
