chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、运营版图与市场地位
        blocks:
          - type: paragraph
            body: >-
              Pleo 由前 Tradeshift 高管 Jeppe Rindom 和 Niccolo Perra 于 2015 年在哥本哈根创立，使命是简化欧洲企业支出管理，消除官僚化的费用报销。公司通过丹麦 Pleo
              Technologies A/S、Pleo Financial Services UK Ltd 等主要实体运营；后者获英国金融行为监管局授权，作为电子货币机构运营，企业参考号为 1020730。Pleo
              已将商业覆盖扩展到 16 个欧洲国家、超过 40,000 家企业客户，以哥本哈根总部为中心，并在伦敦、柏林、斯德哥尔摩、马德里、里斯本、巴黎、阿姆斯特丹设有区域枢纽，在钦奈设有工程运营中心。核心产品将
              Mastercard 品牌实体卡和虚拟费用卡、多币种企业支付、自动发票管理，以及与标准会计系统的深度同步结合起来，从而简化分布式团队的支出流程。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO006
              - CO008
      - number: '1.2'
        title: 管理层、治理结构与人才动态
        blocks:
          - type: paragraph
            body: >-
              Pleo 仍由创始人主导，CEO Jeppe Rindom 的职业经历包括担任丹麦商业交易先驱 Tradeshift 的早期 CFO。联合创始人 Niccolo Perra
              最初搭建平台工程架构，之后将运营管理交给经验丰富的职能负责人，包括目前负责 Pleo 向自主代理工作流转型的首席产品与技术官 Marija Nakevska。外部公司登记资料显示，CFO Søren Westh
              Lønning 和 COO Thorbjørn Fink 为公司运营提供支持；整体员工规模估计在 501 至 1,000 人之间。不过，2026 年年中媒体调查披露高管离职、文化紧张，以及约 50
              人的定向裁员，显示这家金融科技公司正在调整运营开支，以贴合可持续的财务目标。
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO005
              - CO006
      - number: '1.3'
        title: 资本化历程、机构股东阵容与估值基准
        blocks:
          - type: paragraph
            body: >-
              Pleo 在 2021 年 7 月完成由 Bain Capital Ventures 和 Thrive Capital 联合领投的 5,000 万 Series C 融资后，成为欧洲金融科技独角兽；该轮融资对应约
              .7 billion 的投后估值。交易完成后，Bain Capital Ventures 合伙人 Keri Gohman 加入 Pleo 董事会，机构股东阵容还包括瑞典投资公司
              Kinnevik、北欧早期风险投资机构 Creandum、美国成长型投资者 Stripes、Seedcamp、Founders A/S、Alkeon Capital Management 和 Coatue
              Management。随后追加的 Series C 分期使已披露股权融资达到 5,000 万，另有 HSBC Innovation Banking
              的欧洲债务额度支持营运资金透支。尽管北欧财务报告显示其年度营业额创纪录，Pleo 仍持续承担净经营亏损，因此有必要重点核查私人股权结构表权利、二级股份折价和最新股东净资产估值。
            claimRefs:
              - CO008
              - CO009
              - CO010
          - type: table
            tableRef: TO003
            claimRefs:
              - CO008
              - CO009
              - CO010
      - number: '1.4'
        title: 战略里程碑、技术架构与代理路线图
        blocks:
          - type: paragraph
            body: >-
              Pleo 十年来有意从本地化收据采集，转向覆盖欧洲的综合多产品支出管理基础设施。2026 年，公司推出以五个自主 AI 代理为核心的激进产品路线图：Policy Agent、Pleo MCP、Accounts
              Payable Agent、Treasury Agent 和 Accounting Agent，目标是自动执行政策、核对发票并主动管理现金。Pleo 还率先采用开放的 Model Context
              Protocol（MCP）标准，让企业财务团队可以查询平台支出数据，并直接通过 Claude、ChatGPT、Microsoft Copilot 等第三方前沿语言模型授权费用操作。加上 2026 年 5
              月与英国中端市场会计专业公司 iplicit 的生态合作，以及 Gartner Peer Insights 上较好的用户满意度指标，Pleo 正积极让平台同时抵御传统企业软件供应商和激进金融科技挑战者。
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO014
