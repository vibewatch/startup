        - stretched
        - Series C 延轮的峰值估值为 $4.7B，历史融资轮估值为 $1.7B，对应 $183.9M 预估收入运行率的 9 倍至 25 倍收入倍数。
        - 若未验证 ARR 同比增长超过 40%，不接受隐含估值高于 $1.0B–$1.2B 的二级市场进入。
      - - 风险评级
        - high
        - 负面媒体报道显示净经营亏损持续、员工人数减少（约 50 人）、高管变动，以及宏观支出逆风。
        - 要求董事会观察员权利、清算优先权顺位审查，以及明确的下行保护契约。
      - - 信心水平
        - medium
        - 公开报道证实客户采用度和平台广度，但缺少经审计的队列流失率、NRR 和毛利率拆分。
        - 对市场定位高度确信；由于披露不对称，对企业股权价值的确信度为中等。
    notes: 基于已披露融资里程碑、平台指标和负面运营信号形成投资判断；信心水平反映私有披露的局限。
    claimRefs:
      - CV004
      - CV009
      - CV011
      - CV012
      - CV013
  - id: TV002
    title: 正论 / 反论表
    columns:
      - 投资判断支柱
      - 乐观论点
      - 悲观反论
      - 论点失效 / 观点变化触发条件
    rows:
      - - 产品广度与黏性
        - 企业卡、费用自动化、应付账款和账单支付一体化，让 40,000+ 家企业形成高频日常工作流锁定。
        - SMB 支出管理进入门槛低，竞争对手和新银行可以拆解核心企业卡功能。
        - 已披露 NRR 降至 105% 以下，或账户总流失率升至每月 1.5% 以上。
      - - 变现与多产品
        - 分层订阅（Starter 起价 £9.50/mo，Essential £39/mo）叠加交换费和授信额度，分散收入来源。
        - 欧洲监管上限压缩交换费率，限制支付抽成的上行空间，使软件订阅成为主要利润驱动。
        - 经审计申报中，软件订阅收入占净收入低于 50%。
      - - 运营效率
        - 501 至 1,000 名员工和自动 OCR 处理能力，支持平台在 6 个核心市场扩大规模时释放显著经营杠杆。
        - 员工减少和已报道的高管变动，凸显实现 GAAP 经营盈利仍面临持续阻力。
        - 12 个月内无法证明 ARR 运行率达到 $200M+ 时已实现 GAAP 经营盈亏平衡。
      - - 估值与退出窗口
        - Pleo 在欧洲 SMB 支出领域的市场领先地位，使其成为全球企业收购方的优质并购标的，也可能最终成为 IPO 候选。
        - $4.7B 峰值估值留下巨大的优先股堆叠障碍，使普通股股东和后期股权面临严重稀释。
        - 定价二级交易或下轮融资将估值重置至低于 $1.0B。
    notes: 结构化评估正论与反论，将战略乐观驱动因素与运营风险及可监测的失效标准对应起来。
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV009
      - CV010
      - CV011
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 隐含估值（$M）
      - 估值方法与倍数
      - 核心运营假设
      - 下行风险与概率信号
    rows:
      - - 乐观情景
        - 2400
        - 预计未来收入 $200M，按 12.0x ARR 倍数计
        - 增长重新加速至同比 >35%，中型市场 AP 增购成功，产生正自由现金流，利润率趋稳。
        - 低概率（20% 信号）；需要宏观环境全面复苏以及企业软件重新估值。
      - - 基准情景
        - 1200
        - $184M 预估运行率对应 6.5x ARR 倍数
        - 收入稳定增长 20-25%，逐步实现经营盈亏平衡，40,000+ 个 SMB 客户持续使用卡片。
        - 基准概率（55% 信号）；反映欧洲金融科技估值压缩的合理私有二级市场估值。
      - - 悲观情景
        - 650
        - $184M 收入基数对应 3.5x ARR 倍数
        - 增长放缓至 <15%，运营消耗持续，交换费利润率收缩，客户流失至打包服务的新银行。
        - 较高概率（25% 信号）；持续现金消耗并需要稀释性资本重组时触发。
    notes: 远期估值情景将当前欧洲 B2B 金融科技 ARR 倍数应用于预估运营规模；不包括清算优先权调整。
    claimRefs:
      - CV006
      - CV011
      - CV012
