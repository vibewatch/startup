      - number: '3.4'
        title: 护城河持久性、运营脆弱性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Pleo 的防御性护城河显示，发卡和基础光学收据扫描已成为欧洲金融科技的商品化标配。真正的防御力在于其与 SMB
              会计生态的深度双向账簿集成：收据采集和交易分类直接同步到会计科目，带来较高的员工使用习惯和小团队较低的行政流失。但当组织升级为复杂的多实体企业，需要复杂采购、多阶段发票匹配和全球差旅行程管理时，这种防御力会减弱，SAP
              Concur 和专业 ERP 工具可能取代 Pleo。公司也面临内部执行压力。2026 年行业报道记录了领导层重组、约 50
              人裁员、估值较历史峰值收缩和持续经营亏损。随着资金充足的金融科技公司和传统银行改善移动费用体验，Pleo 必须加快企业产品扩张，同时抵御低价且以交易变现的竞争者，守住核心 SMB 客户。
            claimRefs:
              - CP012
              - CP014
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 按员工数扩张的定价惩罚
            body: >-
              Pleo 按用户收费（每名新增员工每月 £11 至 £18），给扩张中的中端市场企业带来明显经济摩擦。员工数低于 100 人时价值很高，但企业接近 150+ 人后软件成本迅速攀升，推动其转向 Payhawk
              等按量竞争者。
            calloutType: risk
            claimRefs:
              - CP007
              - CP008
          - type: callout
            title: 会计同步是主要防御性护城河
            body: Pleo 在欧洲 SMB 市场最强的竞争护城河不是已高度商品化的支付卡发行，而是与 Xero、QuickBooks 等云会计平台的深度双向核对。该自动化消除了月末费用申报摩擦，稳住了终端用户的高采用率。
            calloutType: insight
            claimRefs:
