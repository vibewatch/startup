        title: 财务结论、单位经济与关键尽调缺口
        blocks:
          - type: paragraph
            body: >-
              从投资判断角度看，Pleo
              具备由广泛客户采用和英国金融行为监管局依据《电子货币条例》授权支撑的高毛利软件特征。从依赖交换费转向软件订阅，为公司提供更可防御的经常性现金流，缓解欧洲交换费压缩。然而，缺乏产品层面的单位经济、月度净现金消耗和下行情景现金续航期限的公开审计披露，是关键投资判断障碍。若没有按销售渠道拆分客户获客成本回收期、并披露
