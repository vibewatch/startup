  topStrengths:
    - Broad spend-management workflow spanning cards, expenses, AP, cash management, and AI-assisted finance features.
    - Large European customer base with 40,000+ businesses and durable product adoption signals.
    - Subscription-led monetization and reported gross margins above 80% indicate meaningful software leverage.
    - Regulatory authorization and named partner rails support the operating model.
  topRisks:
    - Cash burn, runway, and full unit-economics disclosure remain private.
    - The historical $4.7B peak mark and current multiple compression create valuation downside.
    - >-
      Counterparty and regulatory dependencies run through Mastercard, Banking Circle, lemon.markets, and FCA-regulated
      entities.
    - AI-agent and integration reliability risks are not yet publicly quantified.
  unresolvedGaps:
    - Obtain current cash balance, monthly burn, debt draw, covenant detail, and downside runway assumptions.
    - Obtain GRR, NRR, churn, renewal, and customer-concentration metrics by segment and module.
    - >-
      Break out gross margin and contribution margin by subscriptions, cards, AP/payments, credit, and treasury
      products.
    - >-
      Confirm current cap table, liquidation preferences, option overhang, and any priced 2026 round or secondary
      transaction after the Kinnevik mark.
    - Quantify attach, retention, fraud-loss, and economics data for cash management, embedded, and credit products.
