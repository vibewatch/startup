companyProfile:
  summary: >-
    Pleo is a Copenhagen-founded European spend-management fintech that combines corporate cards, expenses, accounts
    payable, cash-management tools, and an emerging AI-agent layer for SMB and mid-market finance teams. The public
    evidence supports strong product breadth, a large customer base, and durable regulatory positioning, but it still
    leaves key operating questions—especially cash burn, retention, and full unit economics—partly opaque.
