evidenceGaps:
  - type: missing-source
    severity: material
    topic: audited-financial-metrics
    missingEvidence: >-
      Audited standalone financial filings breaking down ARR, subscription revenue versus interchange revenue, and gross
      profit margins.
    whyItMatters: >-
      Understanding exact ARR and unit economics is required to validate whether Pleo's .7 billion valuation mark
      remains justified in current market conditions.
    diligencePath: >-
      Request management financial presentations or inspect Danish Erhvervsstyrelsen regulatory filings for Pleo
      Technologies A/S.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table-scope
    missingEvidence: Full executive committee roster and independent board member listings beyond public co-founder profiles.
    whyItMatters: Comprehensive governance analysis requires clarity on board representation and independent oversight.
    diligencePath: Review Danish central business register (CVR) governance filings for Pleo Technologies A/S board resolutions.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: stakeholder-or-investor-map-equity
    missingEvidence: >-
      Full share cap table detailing exact percentage ownership, liquidation preferences, and secondary transaction
      discounts.
    whyItMatters: >-
      Institutional investor ownership distribution and seniority terms directly dictate common shareholder recovery and
      dilution.
    diligencePath: Obtain company share register from Danish business registry or request cap table model under NDA.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: diligence-gaps
    missingEvidence: >-
      Audited gross retention, net revenue retention (NRR), and unit economics split between card interchange volume and
      recurring SaaS user seat subscriptions.
    whyItMatters: >-
      Without segmented retention and contribution margin data, underwriting long-term customer lifetime value and
      defensible market share in European spend management remains uncertain.
    diligencePath: >-
      Request company management financial disclosures detailing cohort retention, gross margins by product line, and
      interchange pass-through economics during commercial diligence.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: customer-churn-and-multihoming
    missingEvidence: >-
      Segment-level customer retention, logo churn, and multi-homing rates comparing Pleo customers against Payhawk and
      Moss in shared European markets.
    whyItMatters: >-
      Without granular cohort churn and competitive displacement statistics, it is difficult to determine whether Pleo's
      40,000 customer base is vulnerable to erosion from rivals offering transaction-based or free pricing.
    diligencePath: >-
      Request customer renewal cohort data, net revenue retention (NRR) benchmarks by headcount tier, and win/loss
      analysis records against Payhawk and Moss.
    relatedQuestionRefs:
      - QP010
  - type: private-evidence-only
    severity: minor
    topic: enterprise-rfp-win-loss
    missingEvidence: >-
      Direct win/loss metrics and RFP evaluation outcomes for accounts scaling above 150 employees transitioning from
      Pleo to ERP-native platforms.
    whyItMatters: >-
      Identifies whether Pleo's product ceiling causes systematic churn to enterprise T&E vendors (SAP Concur, Navan) or
      mid-market ERP specialists (Payhawk).
    diligencePath: Review sales exit interview transcripts, mid-market migration logs, and NetSuite partner pipeline records.
    relatedQuestionRefs:
      - QP010
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Audited financial statements detailing Pleo's net monthly cash burn rate, exact gross margin breakdown by
      subscription versus interchange versus lending, and verified cash runway duration.
    whyItMatters: >-
      Without audited disclosure of unit-level contribution margins and cash burn, underwriter models cannot determine
      whether Pleo can achieve self-sustaining cash flow without future equity dilutive financing.
    diligencePath: >-
      Request confidential management accounts, product-level P&L breakdowns, and covenant compliance certificates for
      the HSBC debt facility under NDA.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current debt facility utilization, outstanding covenant thresholds, and interest service schedule on the HSBC
      Innovation Banking credit facility.
    whyItMatters: >-
      Debt service costs and covenant constraints directly affect forward liquidity and working capital flexibility for
      Pleo's overdraft and credit card products.
    diligencePath: Review credit agreement covenants, current draw amount, and collateral pledged to HSBC Innovation Banking.
    relatedQuestionRefs:
      - QI004
      - QI009
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: reliability and security assurance
    missingEvidence: >-
      Audited control reports, penetration-test summaries, uptime and incident history, recovery objectives, data-flow
      diagrams, and partner service levels.
    whyItMatters: >-
      Payment availability and sensitive financial-data handling cannot be underwritten from marketing labels or legal
      footers alone.
    diligencePath: >-
      Request current SOC or equivalent reports, PCI attestation scope, architecture and data-flow diagrams,
      twelve-month incident logs, disaster-recovery tests, and partner SLAs.
    relatedQuestionRefs:
      - QE004
      - QE006
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: developer and practitioner signal
    missingEvidence: >-
      A public API or developer portal, repository or package activity, technical talks, engineering documentation, or
      an independent practitioner-community proxy.
    whyItMatters: >-
      Without a developer or practitioner surface, the public record cannot demonstrate integration quality, ecosystem
      adoption, or engineering execution.
    diligencePath: >-
      Request API documentation, integration adoption metrics, release history, engineering reliability reviews, and
      references from customers operating complex ERP integrations.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: AI governance and maturity
    missingEvidence: >-
      Production availability by agent, model evaluations, approval boundaries, audit-log design, data-retention rules,
      human escalation controls, and incident results.
    whyItMatters: >-
      Automated financial actions create accuracy, authorization, privacy, and audit risks that an announced roadmap
      does not resolve.
    diligencePath: >-
      Obtain the AI control framework, production release matrix, evaluation scorecards, red-team findings, permission
      model, model-provider terms, and customer pilot outcomes.
    relatedQuestionRefs:
      - QE007
      - QE008
    relatedTableRefs:
      - TE001
      - TE003
  - type: missing-source
    severity: material
    topic: retention-and-churn
    missingEvidence: >-
      Audited cohort net revenue retention (NRR), gross revenue retention (GRR), and logo churn metrics broken out by
