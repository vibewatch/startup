  topStrengths:
    - 覆盖卡片、费用、应付账款、现金管理和 AI 辅助财务功能的完整支出管理工作流。
    - 欧洲客户基础庞大，服务 40,000+ 家企业，产品采用信号也较为持久。
    - 订阅驱动的变现模式，加上报告称毛利率超过 80%，显示出明显的软件杠杆。
    - 监管授权和明确列出的合作伙伴通道为运营模式提供支撑。
  topRisks:
    - 现金消耗、现金续航和完整的单位经济学仍未公开披露。
    - 历史上 $4.7B 的峰值估值与当前倍数压缩带来估值下行风险。
    - 交易对手方和监管依赖贯穿 Mastercard、Banking Circle、lemon.markets 以及受 FCA 监管的实体。
    - AI 代理和集成可靠性风险尚未见公开量化。
  unresolvedGaps:
    - 获取当前现金余额、月度烧钱、债务提款、契约细节和下行情景下的续航假设。
    - 按客户群和模块获取 GRR、NRR、流失、续约及客户集中度指标。
    - 按订阅、卡片、应付账款 / 支付、信贷和资金管理产品拆分毛利率与贡献利润率。
    - 确认当前股权结构表、清算优先权、期权稀释压力，以及 Kinnevik 标记之后是否有定价的 2026 轮融资或二级交易。
    - 量化现金管理、嵌入式和信贷产品的附加销售、留存、欺诈损失及经济性数据。
