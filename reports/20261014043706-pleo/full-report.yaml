      - number: '5.2'
        title: Modules and Evidence of Maturity
        blocks:
          - type: paragraph
            body: >-
              The most mature public surfaces are cards and expense management: multiple current Pleo pages describe
              receipt capture, spend controls, and accounting synchronization as live workflows. Accounts payable is
              also presented as part of the current suite, and third-party reporting describes invoice processing and
              OCR-supported data extraction. Cash Management broadens the product from spend recording into liquidity
              operations through linked bank accounts, sub-accounts, transfer rules, six supported currencies, and an
              investment account powered by lemon.markets. The AI layer is less mature. June 2026 coverage said the
              Policy Agent was live while other agents were entering beta testing, so the announced AP, Treasury,
              Accounting, and MCP capabilities should be treated as staged roadmap execution rather than a uniformly
              production-proven product line.
