          and macro spend headwinds.
        - >-
          Require board observer rights, liquidation preference seniority review, and clean downside protective
          covenants.
      - - Confidence Level
        - medium
        - >-
          Public reporting confirms customer adoption and platform breadth, but lacks audited cohort churn, NRR, and
          gross margin breakdowns.
        - >-
          High conviction on market positioning, medium conviction on enterprise equity value due to disclosure
          asymmetry.
