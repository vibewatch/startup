  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Underwriting Pillar
      - Bull Thesis Argument
      - Bear Anti-Thesis Argument
      - Thesis-Break / View-Change Trigger
    rows:
      - - Product Breadth & Stickiness
        - >-
          Integrated corporate cards, expense automation, accounts payable, and bill payments drive high daily workflow
          lock-in across 40,000+ businesses.
        - >-
          Low barriers to entry in SMB spend management allow competitors and neobanks to unbundle core corporate card
          features.
        - Disclosed NRR falling below 105% or gross account churn increasing beyond 1.5% monthly.
      - - Monetization & Multi-Product
        - >-
          Tiered subscriptions (Starter from £9.50/mo, Essential £39/mo) combined with interchange and credit facilities
          diversify revenue streams.
        - >-
          Interchange compression under European regulatory caps limits payment take-rate upside, leaving software
          subscriptions as the primary margin driver.
        - Software subscription revenue contributing less than 50% of net revenue in audited filings.
      - - Operational Efficiency
        - >-
          Between 501 and 1,000 employees and automated OCR processing support significant operating leverage as
          platform volume expands across 6 core markets.
        - >-
          Workforce reductions and reported executive turnover highlight persistent friction in achieving GAAP operating
          profitability.
        - Failure to demonstrate GAAP operating break-even at $200M+ ARR run-rate within 12 months.
      - - Valuation & Exit Window
        - >-
          Market leader positioning in European SMB spend makes Pleo a prime M&A target for global enterprise acquirers
          or an eventual IPO candidate.
        - >-
          A peak $4.7B valuation overhang creates massive preference stack hurdles, leaving common shareholders and late
          equity vulnerable to severe dilution.
        - Priced secondary transaction or down-round reset clearing below $1.0B valuation.
    notes: >-
      Structured thesis and anti-thesis evaluation mapping strategic bull drivers against operating risks and
      monitorable invalidation criteria.
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV009
      - CV010
      - CV011
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Implied Valuation ($M)
      - Valuation Methodology & Multiple
      - Core Operating Assumptions
      - Downside Risk & Probability Signal
    rows:
      - - Bull Case
        - 2400
        - 12.0x ARR multiple on projected $200M forward revenue
        - >-
          Re-accelerating growth >35% YoY, successful mid-market AP upsell, positive free cash flow generation, and
          stabilized margins.
        - Low probability (20% signal); requires complete macro recovery and enterprise software re-rating.
      - - Base Case
        - 1200
        - 6.5x ARR multiple on $184M estimated run-rate
        - >-
          Stable 20-25% revenue growth, gradual path to operating break-even, steady card active usage across 40,000+
          SMB customers.
        - Base probability (55% signal); realistic private secondary mark reflecting European fintech compression.
      - - Bear Case
        - 650
        - 3.5x ARR multiple on $184M revenue base
        - >-
          Growth deceleration <15%, persistent operational burn, interchange margin contraction, and customer churn to
          bundled neobanks.
        - Elevated probability (25% signal); triggered by continued cash burn requiring dilutive recapitalization.
    notes: >-
      Forward valuation scenarios apply contemporary European B2B fintech ARR multiples to estimated operational
      footprint; excludes liquidation preference adjustments.
    claimRefs:
      - CV006
      - CV011
      - CV012
