chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Footprint, and Market Position
        blocks:
          - type: paragraph
            body: >-
              Pleo was founded in Copenhagen in 2015 by former Tradeshift executives Jeppe Rindom and Niccolo Perra,
              establishing its corporate mission around simplifying European business spend management and eliminating
              bureaucratic expense reporting. The company operates through primary corporate entities including Pleo
              Technologies A/S in Denmark and Pleo Financial Services UK Ltd, which holds authorization from the UK
              Financial Conduct Authority as an electronic money institution under firm reference number 1020730. Pleo
              has expanded its commercial reach to more than 40,000 corporate customers across 16 European nations,
              anchored by its Copenhagen headquarters alongside regional hubs in London, Berlin, Stockholm, Madrid,
              Lisbon, Paris, Amsterdam, and an engineering operations center in Chennai. The core product combines smart
              physical and virtual Mastercard-branded expense cards, multi-currency corporate payments, automated
              invoice management, and deep synchronization with standard accounting systems to streamline spend across
              distributed workforces.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO006
              - CO008
      - number: '1.2'
        title: Executive Leadership, Governance Structure, and Talent Dynamics
        blocks:
          - type: paragraph
            body: >-
              Pleo remains founder-led under Chief Executive Officer Jeppe Rindom, whose professional background
              includes serving as early Chief Financial Officer at Danish business commerce pioneer Tradeshift.
              Co-founder Niccolo Perra initially established the platform's engineering architecture before
              transitioning operational management to seasoned functional leaders, including Chief Product and
              Technology Officer Marija Nakevska, who currently directs Pleo's transition into autonomous agentic
              workflows. External corporate registries indicate operational support from Chief Financial Officer Søren
              Westh Lønning and Chief Operating Officer Thorbjørn Fink across an overall workforce estimated between 501
              and 1,000 employees. However, organizational stability faced public headwinds in mid-2026 when media
              investigations revealed executive departures, cultural strains, and a targeted workforce reduction of
              approximately 50 employees as the fintech adjusted operational overhead to align with sustainable
              financial goals.
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO005
              - CO006
      - number: '1.3'
        title: Capitalization History, Institutional Syndicate, and Valuation Benchmarks
        blocks:
          - type: paragraph
            body: >-
              Pleo achieved European fintech unicorn status in July 2021 after completing a landmark 50 million Series C
              financing round co-led by Bain Capital Ventures and Thrive Capital, which priced the business at an
              approximate .7 billion post-money valuation. Following the transaction, Bain Capital Ventures partner Keri
              Gohman joined Pleo's board of directors, augmenting an elite institutional shareholder syndicate that
              includes Swedish investment company Kinnevik, early Nordic venture backer Creandum, US growth investor
              Stripes, Seedcamp, Founders A/S, Alkeon Capital Management, and Coatue Management. Disclosed equity
              funding reached 50 million following subsequent Series C tranches, supplemented by European debt
              facilities from HSBC Innovation Banking to support working capital overdrafts. Despite sustaining record
              annual turnover according to Nordic financial reporting, Pleo continues to absorb net operating losses,
              creating an urgent diligence imperative to review private cap table rights, secondary share discounts, and
              updated shareholder net asset marks.
            claimRefs:
              - CO008
              - CO009
              - CO010
          - type: table
            tableRef: TO003
            claimRefs:
              - CO008
              - CO009
              - CO010
      - number: '1.4'
        title: Strategic Milestones, Technology Architecture, and Agentic Roadmap
        blocks:
          - type: paragraph
            body: >-
              Pleo's decade-long corporate evolution illustrates a deliberate transition from localized receipt capture
              into a comprehensive, multi-product spend management infrastructure across Europe. During 2026, the
              company introduced an ambitious product roadmap centered on five autonomous AI agents—Policy Agent, Pleo
              MCP, Accounts Payable Agent, Treasury Agent, and Accounting Agent—designed to automate policy enforcement,
              invoice reconciliation, and proactive cash management. Pleo has uniquely embraced the open Model Context
              Protocol (MCP) standard, enabling corporate finance teams to query platform spend data and authorize
              expense actions directly from third-party frontier language models such as Claude, ChatGPT, and Microsoft
              Copilot. Combined with ecosystem integration partnerships like its May 2026 collaboration with UK
              mid-market accounting specialist iplicit and solid user satisfaction metrics across Gartner Peer Insights,
              Pleo is actively positioning its platform to defend against both legacy enterprise software providers and
              aggressive fintech challengers.
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO008
              - CO012
              - CO013
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Expansion from Card Issuance to Agentic Spend Platform
            body: >-
              Pleo has systematically expanded its product scope from basic corporate expense cards into autonomous
              financial workflows, integrating invoice processing, treasury monitoring, and LLM-compatible agent
              infrastructure.
            calloutType: insight
            claimRefs:
              - CO012
              - CO013
              - CO015
