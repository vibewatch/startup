            body: >-
              Pleo's legal footer identifies its UK entity as FCA-authorized under the Electronic Money Regulations 2011
              and states that cards are issued under a Mastercard license. A separate company page uses the labels
              "Bank-level security" and "FSA & PCI regulated," but the fetched material does not define the relevant
              entity, audit scope, certification version, auditor, or validity period. More importantly, none of the
              retained sources provides uptime history, service-level objectives, incident reporting, penetration-test
              results, SOC reports, encryption architecture, disaster-recovery targets, or AI evaluation data. This is
              not evidence that controls or incidents are absent; it means the public evidence cannot establish
              reliability or security maturity. Technical underwriting should therefore prioritize primary control
              reports, incident history, dependency SLAs, and AI approval safeguards before assigning defensibility to
