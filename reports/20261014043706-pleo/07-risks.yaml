callouts:
  - calloutType: risk
    title: "Interchange Regulation and Structural Revenue Exposure"
    body: "Pleo's reliance on commercial card interchange for approximately 70% of historical revenues creates structural vulnerability. If European regulators move to narrow the gap between consumer and commercial card interchange rates, or if card networks adjust scheme fee tiers, Pleo's gross margins could face sharp downward pressure unless subscription pricing compensates."
    claimRefs:
      - CR003
      - CR004
  - calloutType: risk
    title: "Concentration in Credit Facility and Banking Rails"
    body: "Underwriting European overdraft facilities through a single 40 million euro HSBC Innovation Banking facility creates vulnerability to borrowing base covenants. Simultaneously, all corporate card issuing and multi-currency clearing flow through Mastercard and Banking Circle, creating single points of failure that require active operational hedging."
    claimRefs:
      - CR002
      - CR007
      - CR009
  - calloutType: insight
    title: "Governance Guardrails for Autonomous Agent Deployments"
    body: "Rolling out autonomous agentic AI across expense approvals and invoice payments introduces operational and compliance risks around automated authorizations. Preventing bookkeeping errors and audit failures requires strict human-in-the-loop oversight and configurable threshold controls across client finance teams."
    claimRefs:
      - CR011
      - CR012
      - CR013
