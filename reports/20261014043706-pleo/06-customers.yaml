figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  summary: Customer progression from card distribution to full autonomous spend and cash management.
  claimRefs:
  - CU003
  - CU005
  - CU011
  - CU013
  data:
    items:
    - label: Discovery & Procurement
      actor: Finance Director / Operations Lead
      touchpoints:
      - Self-serve onboarding or sales-assisted evaluation
      - Review of local European VAT handling and ledger integrations
      description: Initial discovery driven by pain in reconciling distributed employee spend and missing paper receipts.
    - label: Policy Setup & Card Issuance
      actor: Finance Team & Department Leads
      touchpoints:
      - Configuring individual and department spend limits
      - Instant generation of virtual cards and physical Mastercard issuance
      description: Finance configures proactive spending boundaries and issues employee cards, replacing shared cards.
    - label: Point-of-Sale Execution
      actor: Employee / Cardholder
      touchpoints:
      - In-store and online payments across European currencies
      - Instant mobile push notification prompting photo receipt capture
      description: Employees make authorized purchases while mobile OCR extracts receipt metadata within seconds.
    - label: Automated Bookkeeping Sync
      actor: Bookkeeper / External Accountant
      touchpoints:
      - Direct sync to Datev, Xero, Exact, Visma e-conomic, or NetSuite
      - Automated VAT categorization and expense code assignment
      description: Transactions flow directly into local accounting systems pre-reconciled, eliminating month-end expense
        reports.
    - label: Cash & Treasury Optimization
      actor: CFO / Head of Treasury
      touchpoints:
      - Consolidated multi-currency liquidity overview via open banking
      - Automated bank balance top-ups and FX reduction
      description: Expansion into Pleo Cash Management to monitor real-time cash position and avoid FX transaction fees.
    - label: Autonomous Finance Expansion
      actor: Finance Strategy Team
      touchpoints:
      - Policy Agent exception monitoring and MCP query integration
      - AP invoice automation and treasury liquidity alerts
      description: Maturation into multi-agent workflows managing accounts payable, policy enforcement, and financial close.
callouts:
- calloutType: insight
  title: Card-First Architecture Converts Point-of-Sale Adoption into Frictionless Retention
  body: Pleo's primary retention lever is workflow stickiness at the point of purchase. By enforcing spend controls on the
    card itself and prompting for digital receipt capture immediately via mobile push notifications, the platform eliminates
    retrospective expense filings. Once an organization shifts employee purchasing habits and connects its European accounting
    ledger, switching costs rise substantially.
  claimRefs:
  - CU003
  - CU008
- calloutType: risk
  title: Enterprise Multi-Entity Deficits and Macro Downsizing Create Mid-Market Exposure
  body: While Pleo dominates European SMB spend management, independent product diligence indicates thinner multi-entity governance
    and limited global multi-currency functionality compared to enterprise alternatives like Payhawk and Yokoy. Combined with
    mid-2026 workforce restructuring and ongoing operating losses, Pleo faces retention pressure if expanding mid-market customers
    outgrow its workflow capabilities.
  claimRefs:
  - CU010
  - CU011
  - CU012
