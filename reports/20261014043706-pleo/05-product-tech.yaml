  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "reliability and security assurance"
      missingEvidence: "Audited control reports, penetration-test summaries, uptime and incident history, recovery objectives, data-flow diagrams, and partner service levels."
      whyItMatters: "Payment availability and sensitive financial-data handling cannot be underwritten from marketing labels or legal footers alone."
      diligencePath: "Request current SOC or equivalent reports, PCI attestation scope, architecture and data-flow diagrams, twelve-month incident logs, disaster-recovery tests, and partner SLAs."
      relatedQuestionRefs:
        - "QE004"
        - "QE006"
        - "QE008"
      relatedTableRefs:
        - "TE003"
    - type: "missing-source"
      severity: "material"
      topic: "developer and practitioner signal"
      missingEvidence: "A public API or developer portal, repository or package activity, technical talks, engineering documentation, or an independent practitioner-community proxy."
      whyItMatters: "Without a developer or practitioner surface, the public record cannot demonstrate integration quality, ecosystem adoption, or engineering execution."
      diligencePath: "Request API documentation, integration adoption metrics, release history, engineering reliability reviews, and references from customers operating complex ERP integrations."
      relatedQuestionRefs:
        - "QE009"
      relatedTableRefs:
        - "TE003"
    - type: "private-evidence-only"
      severity: "material"
      topic: "AI governance and maturity"
      missingEvidence: "Production availability by agent, model evaluations, approval boundaries, audit-log design, data-retention rules, human escalation controls, and incident results."
      whyItMatters: "Automated financial actions create accuracy, authorization, privacy, and audit risks that an announced roadmap does not resolve."
      diligencePath: "Obtain the AI control framework, production release matrix, evaluation scorecards, red-team findings, permission model, model-provider terms, and customer pilot outcomes."
      relatedQuestionRefs:
        - "QE007"
