company:
  name: "Pleo"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Pleo's public product surface spans cards, expense capture, accounts payable, cash management, integrations, and an emerging AI-agent layer. The workflow is well evidenced at the feature level, but the reviewed sources do not expose system architecture, audited security controls, reliability history, or a public developer surface, making technical defensibility and operational resilience material diligence gaps."
sections:
  - id: "product-workflow"
    title: "Product Scope and Customer Workflow"
    body: >-
      Pleo packages employee cards and finance-team controls into a workflow that begins at the
      transaction rather than at month-end reconciliation. Current product pages describe physical
      and virtual cards, immediate receipt prompts, real-time spend visibility, configurable card
      limits, review thresholds, and accounting export. The broader company profile places automated
      expenses, accounts payable, and cash management in the same platform, while independent
      coverage confirms that receipt handling, invoice payments, and multi-entity onboarding were
      already product priorities by 2023. This breadth is meaningful because it links employee
      purchasing to finance administration, but most quantified efficiency evidence remains
      company-issued: Pleo's pages claim 138 hours saved annually and reduced reconciliation effort
      without publishing the sampling method needed to generalize those outcomes.
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE004"
      - "CE011"
      - "CE014"
    tableRefs:
      - "TE002"
  - id: "modules-and-maturity"
    title: "Modules and Evidence of Maturity"
    body: >-
      The most mature public surfaces are cards and expense management: multiple current Pleo pages
      describe receipt capture, spend controls, and accounting synchronization as live workflows.
      Accounts payable is also presented as part of the current suite, and third-party reporting
      describes invoice processing and OCR-supported data extraction. Cash Management broadens the
      product from spend recording into liquidity operations through linked bank accounts,
      sub-accounts, transfer rules, six supported currencies, and an investment account powered by
      lemon.markets. The AI layer is less mature. June 2026 coverage said the Policy Agent was live
      while other agents were entering beta testing, so the announced AP, Treasury, Accounting, and
      MCP capabilities should be treated as staged roadmap execution rather than a uniformly
      production-proven product line.
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE008"
      - "CE012"
      - "CE013"
    tableRefs:
      - "TE001"
  - id: "operating-architecture"
    title: "Operating Architecture and External Dependencies"
    body: >-
      Public evidence supports a product-level operating model, not a verified internal software
      architecture. Employee transactions and uploaded invoices feed policy, receipt, and approval
      workflows; accounting and ERP connectors then move records into systems including DATEV,
      Xero, Visma e-conomic, QuickBooks, and Oracle NetSuite. Cash features depend on linked bank
      accounts, Mastercard, Banking Circle, and lemon.markets, creating regulated partner
      dependencies alongside Pleo's own application layer. The 2026 MCP announcement adds a
      connection layer for Claude, ChatGPT, and Copilot, but the reviewed material does not disclose
      hosting design, data isolation, model-provider routing, latency, failure modes, or API
      guarantees. The architecture map below is therefore a functional decomposition of evidenced
      interfaces and dependencies, not a representation of proprietary implementation.
    claimRefs:
      - "CE003"
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE012"
      - "CE013"
      - "CE016"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "trust-reliability-and-diligence"
    title: "Trust, Reliability, and Technical Diligence"
    body: >-
      Pleo's legal footer identifies its UK entity as FCA-authorized under the Electronic Money
      Regulations 2011 and states that cards are issued under a Mastercard license. A separate
      company page uses the labels "Bank-level security" and "FSA & PCI regulated," but the fetched
      material does not define the relevant entity, audit scope, certification version, auditor, or
      validity period. More importantly, none of the retained sources provides uptime history,
      service-level objectives, incident reporting, penetration-test results, SOC reports,
      encryption architecture, disaster-recovery targets, or AI evaluation data. This is not
      evidence that controls or incidents are absent; it means the public evidence cannot establish
      reliability or security maturity. Technical underwriting should therefore prioritize primary
      control reports, incident history, dependency SLAs, and AI approval safeguards before
      assigning defensibility to the product stack.
    claimRefs:
      - "CE007"
      - "CE009"
      - "CE010"
      - "CE015"
      - "CE016"
