callouts:
  - calloutType: "insight"
    title: "Breadth Is Visible; Technical Defensibility Is Not"
    body: "Pleo publicly demonstrates a broad workflow from card transaction through accounting and cash management, but the evidence does not isolate proprietary technology, performance, or switching-cost advantages from integrations and regulated partner rails."
    claimRefs:
      - "CE001"
      - "CE003"
      - "CE007"
      - "CE016"
  - calloutType: "risk"
    title: "AI Roadmap Outruns Public Assurance Evidence"
    body: "The Policy Agent was reported live and a broader agent suite was scheduled for beta, yet public sources do not provide evaluation results, permission boundaries, audit-log design, or production incident evidence for autonomous financial workflows."
    claimRefs:
      - "CE012"
      - "CE013"
      - "CE015"
