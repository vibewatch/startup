      - ["Net Revenue Churn", "< 1% (Q4 2025)", "Medium", "Reflects platform stickiness and operational integration into finance workflows", "Obtain cohort-level gross vs net revenue retention tables"]
      - ["Annual Recurring Revenue (ARR)", "EUR 164M (Q4 2025)", "Medium", "Baseline commercial traction supporting enterprise valuation multiples", "Request Q3 2026 ARR bridge showing new logos, expansion, and contraction"]
      - ["Customer Count", "40,000+ businesses", "High", "Scale proxy demonstrating broad European SME and mid-market adoption", "Confirm active paying customer accounts versus dormant registered entities"]
      - ["Customer Acquisition Cost (CAC)", null, "Low", "Critical for assessing sales efficiency and GTM payback period", "Request fully loaded CAC and payback period by acquisition channel"]
      - ["Net Monthly Cash Burn", null, "Low", "Determines runway cushion and time to cash-flow breakeven", "Require trailing 12-month cash flow statements and monthly burn projections"]
    notes: "Metrics reflect Kinnevik investor materials and Sacra estimates where available; null values indicate confidential private metrics required for complete underwriting."
    claimRefs:
      - "CI001"
      - "CI008"
      - "CI012"
