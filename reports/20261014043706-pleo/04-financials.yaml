callouts:
  - calloutType: "insight"
    title: "European Interchange Caps Enforce a Subscription-First Margin Model"
    body: "Unlike US spend management peers that generate substantial interchange income from uncapped interchange rates, Pleo was forced by European regulatory caps (0.2% on consumer debit and 0.3% on credit) to build an early software subscription model. This regulatory boundary created a structurally stickier, higher-margin SaaS revenue foundation that Kinnevik estimates yields gross margins exceeding 80%."
    claimRefs:
      - "CI004"
      - "CI005"
      - "CI012"
  - calloutType: "risk"
    title: "Lack of Audited Operating Cash Flow and Burn Metrics Precludes Definitive Underwriting"
    body: "Despite reporting record turnover and over 40,000 corporate customers, Pleo has not disclosed audited net monthly burn, exact GTM acquisition payback periods, or cash runway duration. Coupled with recent reports of operating losses, job cuts, and an internal mark down from $4.7 billion to $1.7 billion, forward capital adequacy remains a central diligence unknown."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI008"
      - "CI009"
      - "CI010"
  - calloutType: "recommendation"
    title: "Require Cohort Contribution P&L and Credit Facility Covenants Before Underwriting"
    body: "Underwriters should condition further investment evaluation on receiving management accounts detailing gross margin and contribution margin by product tier, cohort net revenue retention, and covenants governing the $43 million HSBC Innovation Banking credit facility."
    claimRefs:
      - "CI003"
      - "CI012"
      - "CI013"
