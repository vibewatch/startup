      - ["Accounts Payable & Invoicing", "OCR automation and SEPA vendor payment processing fees", "Per invoice / payment", "Growing expansion module across European mid-market accounts", "High (sticky ERP integration)", "Invoice volume, AP software attach rate, and fee realization"]
      - ["Credit & Overdraft Facilities", "Interest spread and financing fees backed by HSBC credit facility", "Interest rate / fee on balance", "Active across UK, Germany, Sweden, Denmark, and Netherlands", "Moderate (credit loss exposure)", "Historical default rate, facility draw, and net interest margin"]
