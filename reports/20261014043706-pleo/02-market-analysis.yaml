      - Pleo Strategic Relevance
    rows:
      - - Corporate Card & Out-of-Pocket Expense
        - Employee travel & entertainment, remote stipends, per diem, ad hoc procurement
        - Core payroll, heavy capital expenditures, long-term asset purchases
        - CFO / Finance Director; Corporate Treasury
        - Core initial wedge; automated receipt matching and smart card limits
      - - Accounts Payable & Invoice Automation
        - Supplier invoices, utility bills, contractor invoices, recurring vendor bills
        - Direct raw material inventory procurement, global treasury hedging
        - Finance Controller / AP Manager; Operating Accounts
        - High-frequency expansion; domestic and cross-border invoice payment workflows
      - - Treasury & Cash Liquidity Management
        - Operational liquidity buffers, FX conversions, multi-currency sub-accounts
        - Corporate debt underwriting, investment portfolio asset management
        - Head of Treasury / VP Finance; Enterprise Reserve
        - Emerging liquidity product; yield generation and zero-FX payment controls
      - - Embedded Spend Solutions
        - White-labeled corporate cards and partner expense modules inside accounting SaaS
        - Proprietary bespoke core banking systems, merchant acquiring networks
        - Partner Product Leaders / Neobanks; Shared Revenue
        - B2B2B partnership channel expanding addressable base without direct CAC
    notes: Market boundary distinguishes core operational expense automation from enterprise ERP general ledgers and complex manufacturing procurement.
