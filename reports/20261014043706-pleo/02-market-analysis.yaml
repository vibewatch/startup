  - id: TM003
    title: Segment and buyer workflow map
    columns:
      - Segment Profile
      - Economic Buyer
      - Day-to-Day User
      - Payer Entity
      - Primary Operational Workflow
      - Budget Ownership
      - Adoption Trigger
    rows:
      - - Small Business (10-50 employees)
        - Founder / Managing Director
        - All employees incurring expenses
        - Operating Company Checking Account
        - Receipt capture, monthly expense reimbursement, virtual card creation
        - General Administrative Budget
        - Loss of control over shared physical credit cards; missing receipt chaos
      - - Mid-Market (51-250 employees)
        - Chief Financial Officer / Finance Director
        - Department managers and traveling staff
        - Dedicated Corporate Disbursement Account
        - Multi-tier approval workflows, department budgets, VAT reconciliation
        - Finance & Accounting Software Budget
        - Finance team overwhelmed by month-end reconciliation; audit requirements
      - - Upper Mid-Market (251-1,000+ employees)
        - VP Finance / Group Controller
        - Project managers, procurement leads, AP clerks
        - Multi-Entity Treasury Accounts
        - Accounts payable matching, multi-currency vendor payments, ERP integration
        - Corporate Treasury & IT Operations Budget
        - Cross-border payment fees, multi-entity consolidation delays across subsidiaries
      - - Platform / Embedded Partners
        - Chief Product Officer / Head of Partnerships
        - Partner SME end-clients
        - Platform Revenue Share / Direct Billing
        - In-app card issuance and white-label spend management via API
        - Product R&D & Strategic Partnership Budget
        - Competitive pressure to offer integrated financial services alongside accounting software
    notes: Workflow mapping reflects Pleo target organizational tiers across European markets, illustrating the migration from founder-led purchasing to structured corporate finance controls.
