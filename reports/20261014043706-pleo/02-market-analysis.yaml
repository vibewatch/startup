callouts:
  - calloutType: insight
    title: Multi-Product Expansion Across Cards and Treasury
    body: Pleo has successfully expanded its functional footprint from corporate smart expense cards into invoice accounts payable and multi-currency cash management. This multi-product consolidation increases platform stickiness, captures payment interchange across transaction volumes, and establishes defensibility against single-feature point solutions across European SMB and mid-market accounts.
    claimRefs:
      - CM001
      - CM002
      - CM009
  - calloutType: risk
    title: Jurisdictional Fragmentation and Private Metric Opacity
    body: Navigating divergent tax regimes, electronic invoicing mandates, and accounting integrations across 16 European nations creates ongoing operational and localization drag. Furthermore, the lack of audited disclosures regarding cohort gross retention, net revenue retention, and card-versus-SaaS margin splits requires conservative underwriting assumptions.
    claimRefs:
      - CM013
      - CM014
      - CM015
