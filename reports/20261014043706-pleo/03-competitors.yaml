callouts:
  - calloutType: "risk"
    title: "Headcount-Scaled Pricing Penalty"
    body: "Pleo's per-user charging model (£11 to £18 per added employee monthly) creates significant economic friction for expanding mid-market businesses. While delivering exceptional value for teams under 100 employees, organizations scaling toward 150+ staff face rapidly mounting software costs, incentivizing transitions to volume-based rivals like Payhawk."
    claimRefs:
      - "CP007"
      - "CP008"
  - calloutType: "insight"
    title: "Accounting Sync as Primary Defensive Moat"
    body: "Pleo's strongest competitive moat in the European SMB segment is not payment card issuance, which has become largely commoditized, but its deep, bidirectional reconciliation with cloud accounting platforms Xero and QuickBooks. This automation eliminates month-end expense filing friction, securing high end-user adoption."
    claimRefs:
      - "CP001"
      - "CP009"
