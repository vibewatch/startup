evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: A current valuation, share count, and post-2025 ownership summary tied to the latest financing.
    whyItMatters: >-
      Without a current valuation and ownership view, later judgment on dilution, investor mark-up, and valuation stance
      is under-supported.
    diligencePath: Request the latest cap table, financing deck, and any board-approved valuation materials from management.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: debt-terms
    missingEvidence: >-
      The maturity schedule, covenant package, collateral terms, and outstanding balances for the J.P. Morgan and
      BTG/Citi/Itaú debt facilities.
    whyItMatters: >-
      Debt now appears central to Merama's operating model, so leverage constraints could matter as much as equity
      appetite.
    diligencePath: >-
      Collect lender agreements, board materials, and treasury reporting that reconcile each facility and refinancing
      use of proceeds.
    relatedQuestionRefs:
      - QO004
      - QO005
      - QO006
  - type: conflicting-data
    severity: material
    topic: financing-disclosure
    missingEvidence: >-
      A reconciled financing ledger that separates disclosed equity rounds, debt facilities, and any totals management
      quotes publicly.
    whyItMatters: >-
      Public totals currently range from $230M to more than $520M, which weakens confidence in simple capital-raised
      comparisons.
    diligencePath: >-
      Build a round-by-round and facility-by-facility financing bridge from management records and investor
      confirmations.
    relatedQuestionRefs:
      - QO004
      - QO007
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: current-scale-metrics
    missingEvidence: >-
      Current exact headcount, customer/account counts, brand count by ownership type, and any clean revenue or GMV
      disclosure.
    whyItMatters: >-
      Later chapters need scale anchors, but the assigned evidence only supports a headcount band, selected historical
      brand counts, and EBITDA.
    diligencePath: >-
      Request an operating dashboard or board pack that shows current headcount, brand roster, revenue/GMV, and customer
      metrics.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map
    missingEvidence: >-
      A full cap table and lender / board-rights schedule covering equity investors, lenders, and brand-level founder
      operators.
    whyItMatters: The stakeholder table captures disclosed names but cannot prove present-day control or economic ranking.
    diligencePath: Request the latest cap table, debt summary, board observer list, and brand-level ownership schedules.
    relatedQuestionRefs:
      - QO004
      - QO006
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sam-som
    missingEvidence: >-
      A current brand-by-brand bridge showing revenue, channel mix, geography, and how many acquisition-ready brands
      remain inside Merama's six-brand focus.
    whyItMatters: >-
      Without a bottom-up bridge, the public TAM evidence stays too broad to underwrite Merama's actual addressable
      market or platform-level upside.
    diligencePath: >-
      Request a current portfolio workbook with brand revenue, channel split, ownership stake, geography, and pipeline
      counts by category.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: channel-economics
    missingEvidence: >-
      Current brand-level gross margin, CAC, return-rate, and logistics contribution by marketplace versus owned-site
      channels.
    whyItMatters: >-
      The chapter can show why channel diversification matters, but not whether the economics actually improve enough to
      justify valuation multiples.
    diligencePath: >-
      Obtain management reporting for the six core brands with channel P&Ls, logistics costs, and repeat-purchase
      cohorts.
    relatedQuestionRefs:
      - QM004
      - QM008
    relatedTableRefs:
      - TM003
  - type: stale
    severity: minor
    topic: refreshed-top-down-market-data
    missingEvidence: >-
      An independent 2025 or 2026 regional market-size update that uses a transparent method comparable with the 2021
      Balderton lens.
    whyItMatters: >-
      Current public market-growth claims mix different years and methodologies, which weakens any direct valuation
      narrative built from headline TAM alone.
    diligencePath: >-
      Add a current third-party market report or public-company filing with explicit Latin America e-commerce market
      methodology.
    relatedQuestionRefs:
      - QM002
  - type: private-evidence-only
    severity: material
    topic: deal-economics
    missingEvidence: >-
      Negotiated purchase multiples, earn-out mechanics, pricing terms, and realized brand-level economics for Merama
      and the closest regional peers.
    whyItMatters: >-
      Public comparison on control and support is possible today, but underwriting pricing power or superior returns is
      not.
    diligencePath: Request anonymized recent transaction terms and post-acquisition unit economics by brand and category.
    relatedQuestionRefs:
      - QP006
  - type: missing-source
    severity: material
    topic: peer-benchmarking
    missingEvidence: >-
      Independent current operating disclosure for Bamboo, JUGGERNAUT, and other regional brand-acquisition vehicles
      beyond name-level mention.
    whyItMatters: >-
      The retained pool identifies alternatives, but it does not provide enough evidence to rank them on scale, service
      breadth, or founder outcomes.
    diligencePath: >-
      Pull current independent coverage, company materials, and transaction examples for named peers before treating the
      peer set as complete.
    relatedQuestionRefs:
      - QP001
      - QP007
  - type: private-evidence-only
    severity: minor
    topic: channel-dependence
