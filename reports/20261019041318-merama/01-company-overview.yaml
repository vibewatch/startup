    approximationNotes: null
    claimRefs: [CO001, CO003, CO004, CO005, CO007, CO008, CO009, CO010, CO011, CO012]
callouts:
  - calloutType: insight
    title: Model shift is real, not cosmetic
    body: >-
      The 2025 evidence no longer reads like a broad Thrasio-style land grab; it reads like a
      smaller set of larger brands financed with repeat equity plus lender oversight.
    claimRefs: [CO010, CO011, CO012]
  - calloutType: risk
    title: Disclosure quality still lags financing scale
    body: >-
      Current public materials do not reconcile valuation, lifetime capital raised, debt terms,
      or even the exact title ownership of the current leadership team.
    claimRefs: [CO013, CO014, CO015, CO016]
