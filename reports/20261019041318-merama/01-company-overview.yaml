schemaVersion: report-v2
artifact: company-overview
slug: merama
runDate: 2026-10-19
company:
  name: Merama
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Merama still presents as a growth-stage Latin American brand-holding company with repeat
    equity backers and multiple debt facilities, but the current public record is thinner than
    the financing history would suggest. The strongest evidence supports the founding story,
    original 2021 unicorn milestone, 2024-2025 debt-backed financing, and a strategic shift
    from a broad aggregator toward a tighter six-brand holding-company model, while valuation,
    cap-table, and current leadership disclosures remain inconsistent.
sections:
  - id: identity-and-model
    title: Identity, footprint, and operating model
    body: |-
      Merama was founded in 2020 and is headquartered in Mexico City, with early reporting
      describing a Mexico- and Brazil-based operating footprint and a brand portfolio spanning
      Mexico, Brazil, Chile, Colombia, Peru, and later the U.S. The consistent through-line
      across independent coverage is that Merama does not behave like a pure marketplace
      software vendor: it takes stakes in consumer brands, supplies working capital, and adds
      operating support in ecommerce, logistics, marketing, and technology. The model also
      evolved over time. Earlier coverage framed Merama as a Latin American ecommerce
      aggregator; 2025 reporting instead describes a more selective holding-company strategy
      focused on fewer, larger brands and preserving brand-level operating independence. That
      makes the company easier to compare with a capital-intensive portfolio operator than with
      a recurring-revenue software business, which matters for how later chapters should treat
      scale metrics, financing needs, and concentration risk.
    claimRefs: [CO001, CO002, CO011]
    tableRefs: [TO001]
  - id: founders-leadership-and-governance
    title: Founders, leadership, and governance visibility
    body: |-
      The founding bench is well documented and unusually operator-heavy for a regional
      roll-up: public sources consistently name Sujay Tyle, Felipe Delgado, Olivier Scialom,
      Renato Andrade, and Guilherme Nosralla, with backgrounds spanning Frontier Car Group,
      Beetmann Energy, Petsy, McKinsey, and Wildlife Studios. That coverage supports strong
      founder-market fit in cross-border ecommerce scaling, capital deployment, and growth.
      Governance visibility is materially weaker than founder visibility. The Official Board
      page exposes only two director names and one executive departure, while later third-party
      directories and interviews do not cleanly reconcile who currently holds the CEO title.
      For diligence purposes, that means key-person dependence remains concentrated in the
      founding team, but the public record is not yet sufficient to treat board oversight,
      decision rights, or succession planning as well evidenced.
    claimRefs: [CO004, CO007, CO015, CO016]
    tableRefs: [TO002]
  - id: funding-history-and-control-surface
    title: Funding history and control surface
    body: |-
      Merama raised capital at exceptional speed in 2021, moving from an initial mixed
      debt-and-equity round to a large Series B and then a December follow-on that put the
      company at a reported $1.2 billion valuation within roughly a year of incorporation.
      The 2024 and 2025 financing pattern matters more for current diligence: the company
      refinanced debt with J.P. Morgan in 2024 and then returned in 2025 with a package that
      paired fresh equity from repeat investors with a larger debt facility led by BTG
      Pactual, Citi, and Itaú. That combination implies lenders and repeat financial sponsors
      still view the platform as financeable, but it also means the economic and governance
      surface now extends beyond venture ownership into debt covenants, maturity schedules, and
      potential collateral terms that are not publicly disclosed in the assigned evidence set.
    claimRefs: [CO003, CO005, CO008, CO010, CO014]
    tableRefs: [TO003]
  - id: milestones-scale-and-open-risks
    title: Milestones, current scale, and open risks
    body: |-
      The milestone record shows a company that expanded quickly, then deliberately narrowed
      its scope. In 2021, TechCrunch described more than 180 employees and 20 brands across
      five Latin American countries; by 2025, Contxto described a six-brand portfolio and a
      shift toward brand-level autonomy. LatamList separately reported EBITDA above $100
      million in 2023 and an April 2024 refinancing, which helps confirm operational scale but
      does not solve the core disclosure gaps. Public sources still do not reconcile current
      valuation, exact lifetime capital raised, debt terms, customer count, or an exact current
      headcount. Those are not cosmetic omissions: they affect leverage tolerance, owner
      concentration, and whether Merama's post-2025 profile is still best read as venture-style
      hypergrowth or as a more mature portfolio operator optimizing a smaller set of brands.
    claimRefs: [CO006, CO009, CO011, CO012, CO013, CO014]
    figureRefs: [FO001]
tables:
  - id: TO001
    title: Snapshot KPI table
    columns:
      - Metric
      - Value / status
      - Date
      - Confidence
      - Gap / note
    rows:
      - ["Founded", "2020", "2020", "High", "Well supported by independent company-profile coverage."]
      - ["Headquarters", "Mexico City, Mexico", "Current directory / historical coverage", "High", "Independent sources align on Mexico City even as operating footprint spans multiple countries."]
      - ["Business model", "Holding company / majority-stake operator for ecommerce and DTC brands", "2025 framing", "High", "Model shifted from broad aggregator language toward a focused holding-company description."]
      - ["Latest explicit valuation", "$1.2B disclosed; newer valuation undisclosed but described as still above $1B", "Dec 2021 / Apr 2025", "Medium", "No current exact valuation disclosed in the assigned evidence set."]
      - ["Total capital raised", "Public range runs from $230M in disclosed rounds to >$520M including debt and venture capital", "Oct 2026 / 2025 interview", "Medium", "Sources do not reconcile debt-inclusive totals with database-tracked disclosed rounds."]
      - ["Latest financing", "$215M package: $45M equity + $170M debt", "2025", "Medium", "Lenders and investors are named, but debt covenants and maturities are not public here."]
      - ["Headcount", "101-250 employee band; older 2021 report said >180 employees", "Oct 2026 / Dec 2021", "Medium", "Current exact headcount is not publicly disclosed in the assigned pool."]
      - ["Portfolio size", "Six brands currently; >20 brands in 2021", "2025 / Dec 2021", "Medium", "Portfolio narrowed materially as strategy shifted toward fewer, larger platforms."]
      - ["Revenue / run-rate", null, "Current", "Low", "LatamList reports EBITDA >$100M in 2023, but that is not revenue or ARR."]
      - ["Customer count", null, "Current", "Low", "No public customer or account-count metric appears in the assigned evidence set."]
    notes: >-
      Null means the metric is not supportable from the assigned public evidence; mixed 2021,
      2025, and 2026 figures are shown only when the source period is explicit.
    claimRefs: [CO001, CO002, CO003, CO009, CO010, CO011, CO013, CO014]
  - id: TO002
    title: Leadership and founder table
    columns:
      - Person
      - Role in public record
      - Background
      - Founder-market fit / functional coverage
      - Key-person dependency
    rows:
      - ["Sujay Tyle", "Co-founder; identified as CEO in 2021 coverage", "Former co-founder and CEO of Frontier Car Group; Balderton venture partner", "Cross-border ecommerce scaling, fundraising, and investor signaling", "High"]
      - ["Felipe Delgado", "Co-founder; quoted as CFO and president in 2025 coverage", "Previously CEO/CFO at Beetmann Energy", "Capital structure, finance, and portfolio operating model", "High"]
      - ["Olivier Scialom", "Co-founder; quoted as COO in 2025 coverage", "Former co-founder and COO of Petsy", "Brand operations, portfolio rationalization, and category execution", "High"]
      - ["Renato Andrade", "Co-founder; FundedIQ lists him as CEO in 2026", "Former associate partner at McKinsey & Company", "Strategy, operating discipline, and executive bench depth", "Medium"]
      - ["Guilherme Nosralla", "Co-founder", "Former head of growth at Wildlife Studios", "Growth, performance marketing, and digital scaling", "Medium"]
    notes: >-
      This is an exhaustive list of publicly named co-founders in the assigned source set;
      current title ownership is not fully reconciled across 2021-2026 sources.
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Exhaustive against the assigned founder and leadership sources: TechCrunch's 2021
        founder list, Balderton's Series A profile, Contxto's 2025 executive quotes, and
        FundedIQ's 2026 directory page.
    claimRefs: [CO004, CO015]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control or economic importance
      - Diligence ask
    rows:
      - ["Advent International", "Repeat equity investor", "Co-led the 2021 Series B and the 2021 follow-on; still part of the 2025 equity syndicate", "Clarify ownership %, board rights, and any structured preference terms."]
      - ["SoftBank Group", "Repeat equity investor", "Co-led the 2021 Series B and remained in the 2025 equity package", "Confirm current pro rata, governance rights, and valuation step-up mechanics."]
      - ["Valor Capital / Monashees / Balderton", "Early equity backers", "Anchored the 2021 mixed debt-and-equity formation round and remained visible in later financing narratives", "Request initial ownership, follow-on participation, and any investor protections that survived refinancings."]
      - ["BTG Pactual / Citi / Itaú", "Debt lenders", "Led the $170M debt facility in 2025 and therefore likely shape leverage discipline", "Obtain debt size by lender, collateral package, maturities, and covenant definitions."]
      - ["J.P. Morgan", "Debt lender", "Led the $80M 2024 financing used to refinance existing debt", "Reconcile what was refinanced, remaining balances, and whether JPM debt sits alongside or inside the 2025 facility."]
      - ["Marcel Telles", "New 2025 equity investor", "Signals new sponsor support in the latest disclosed package", "Confirm ticket size, any strategic role, and whether the investment came with governance influence."]
      - ["Founder-operators of portfolio brands", "Operating counterparties", "Merama's model depends on them retaining control while Merama supplies capital and operating support", "Review brand-level ownership splits, earn-outs, and veto rights by brand."]
    notes: >-
      This is a partial map of disclosed financiers and operator stakeholders, not a cap table;
      public sources name the parties but do not provide current ownership percentages.
    enumerationScope:
      coverage: partial
      basis: >-
        Partial against disclosed 2021-2025 financing coverage in TechCrunch, LAVCA,
        Balderton, LatamList, Dealflow.la, and Contxto; the assigned evidence does not include
        a current cap table, lender schedule, or board-rights summary.
    claimRefs: [CO002, CO004, CO005, CO008, CO010]
