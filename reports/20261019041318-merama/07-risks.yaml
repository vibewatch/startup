company:
  name: Merama
chapter:
  number: 7
  title: Risks
  summary: >-
    Merama's biggest underwritten risk is not demand collapse but balance-sheet and
    disclosure opacity: the public record shows fresh debt layered onto repeat equity,
    while covenant headroom, maturities, and current cash remain undisclosed. Operational
    risk has also become more concentrated because the portfolio narrowed to six brands
    and still relies on local operators even under majority ownership.
sections:
  - id: capital-structure-and-financing
    title: Capital structure and financing flexibility
    body: >-
      Merama's risk stack starts with financing rather than pure market demand. Public
      reporting shows a debt component in both its 2021 launch round and its April 2025
      financing, with Contxto adding that the company raised $250 million of debt within
      one year after an $80 million J.P. Morgan facility in April 2024. That debt can be
      productive when used for inventory, brand investment, and tuck-in M&A, but the same
      sources do not disclose covenants, collateral, maturity timing, or current cash
      coverage. Merama also says that from 2025 onward it will stop reporting growth on a
      global basis and instead report by brand, which reduces outside visibility just as
      leverage appears to be increasing. Until diligence proves that covenant headroom and
      refinancing are conservative, investors should treat debt-service flexibility as a
      thesis-break variable rather than a footnote.
    claimRefs: [CR002, CR003, CR009, CR013, CR015]
    tableRefs: [TR003]
  - id: portfolio-concentration-and-execution
    title: Portfolio concentration and execution dependence
    body: >-
      Merama has shifted from breadth to concentration. Contxto says the company has
      focused on operational efficiency, moving from more than two dozen online retail
      brands to six, while also fully acquiring Growth Supplements, a business it says
      exceeds $400 million in annual sales. That shift can improve focus, but it also
      means a small number of platforms can now drive outsized performance, working-capital
      needs, and downside if one category stalls. The operating model still leaves brand
      founders or local teams running day-to-day businesses under Merama's majority-stake
      approach, so execution quality remains partly outside centralized control. The sector
      comparison is also sobering: Contxto explicitly ties Merama's starting model to
      Thrasio, which it says filed for bankruptcy in the United States, underscoring that
      roll-up economics can fail when leverage, integration, and inventory discipline slip.
    claimRefs: [CR004, CR005, CR006, CR011, CR012, CR014]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: legal-control-surface-and-kill-criteria
    title: Legal, control-surface, and disclosure kill criteria
    body: >-
      The legal and regulatory posture is less alarming than opaque. The assigned public
      evidence does not surface an active lawsuit, enforcement action, or disclosed
      privacy/security incident, but it also does not establish that those surfaces are
      clean. Tracxn links Merama to an active Brazilian holding entity and a deadpooled
      U.S. entity, while Bloomberg's older profile still described a portfolio spanning
      more than 20 brands across six countries. That combination implies meaningful
      cross-border compliance, tax, and contractual complexity even before brand-level
      consumer, advertising, and product obligations are reviewed. The practical kill
      criteria are therefore monitorable: if diligence cannot reconcile the entity map,
      if lender documentation shows tight covenant headroom, or if brand-level reporting
      hides concentration or working-capital stress, the risk should be treated as
      structural rather than temporary.
    claimRefs: [CR006, CR007, CR008, CR010, CR015, CR016]
    tableRefs: [TR001]
