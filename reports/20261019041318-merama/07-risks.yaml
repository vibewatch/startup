  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / asset
      - Role
      - Concentration signal
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Debt capital providers
        - BTG Pactual / Citi / Itaú / J.P. Morgan
        - Working-capital and acquisition financing
        - Public sources show at least $250M of debt raised in one year.
        - Tighter credit or refinancing shock constrains inventory, M&A, or brand support.
        - High
        - Multiple institutions have financed Merama rather than a single lender.
        - The maturity stack and covenant package remain undisclosed.
      - - Repeat equity backers
        - Advent / SoftBank / Monashees / Valor / Balderton / Marcel Telles
        - Equity support and signaling
        - 2025 equity came from returning investors plus one new backer.
        - Slower follow-on support would leave leverage carrying more of the growth burden.
        - Medium
        - Repeat backing suggests incumbent support remains available.
        - Public valuation reset terms and investor protections are not disclosed.
      - - Brand founders and operators
        - Majority-owned portfolio brands
        - Day-to-day commercial execution
        - Bloomberg says founders retain ownership and continue operating even after Merama buys majority stakes.
        - Underperforming local teams can impair brands Merama owns but does not fully centralize operationally.
        - High
        - Merama adds capital, technology, and supply-chain services to partner brands.
        - No public brand-level operating scorecard proves consistent execution quality.
    notes: Dependency table focuses on counterparties and operating assets that Merama appears to rely on for capital access or day-to-day execution.
    claimRefs: [CR002, CR003, CR006, CR011, CR013]
