callouts:
  - calloutType: risk
    title: Debt headroom is the clearest thesis-break trigger
    body: >-
      If the 2024-2025 debt stack carries tight covenants, near maturities, or collateral
      constraints, Merama's roll-up and working-capital model can flip from offensive to
      defensive quickly.
    claimRefs: [CR002, CR003, CR013, CR015]
  - calloutType: risk
    title: Portfolio focus improves discipline but raises concentration
    body: >-
      The shift from more than two dozen brands to six may improve execution, yet it also
      means a weak quarter at one or two major brands can materially change consolidated
      performance and lender comfort.
    claimRefs: [CR004, CR005, CR014]
