  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sam-som
      missingEvidence: A current brand-by-brand bridge showing revenue, channel mix, geography, and how many acquisition-ready brands remain inside Merama's six-brand focus.
      whyItMatters: Without a bottom-up bridge, the public TAM evidence stays too broad to underwrite Merama's actual addressable market or platform-level upside.
      diligencePath: Request a current portfolio workbook with brand revenue, channel split, ownership stake, geography, and pipeline counts by category.
      relatedQuestionRefs: [QM008]
      relatedTableRefs: [TM002, TM003]
    - type: private-evidence-only
      severity: material
      topic: channel-economics
      missingEvidence: Current brand-level gross margin, CAC, return-rate, and logistics contribution by marketplace versus owned-site channels.
      whyItMatters: The chapter can show why channel diversification matters, but not whether the economics actually improve enough to justify valuation multiples.
      diligencePath: Obtain management reporting for the six core brands with channel P&Ls, logistics costs, and repeat-purchase cohorts.
      relatedQuestionRefs: [QM004, QM008]
      relatedTableRefs: [TM003]
    - type: stale
      severity: minor
      topic: refreshed-top-down-market-data
