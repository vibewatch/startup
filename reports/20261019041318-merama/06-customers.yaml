  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-disclosure
      missingEvidence: Brand-level NRR, GRR, churn, renewal cadence, repeat-purchase cohorts, and contract duration.
      whyItMatters: Without durability metrics, public evidence cannot distinguish temporary growth from repeatable portfolio retention.
      diligencePath: Request brand-by-brand cohort tables and renewal metrics from management, ideally tied to the six current brands.
      relatedQuestionRefs: [QU005]
    - type: private-evidence-only
      severity: material
      topic: concentration-disclosure
      missingEvidence: Revenue and gross-profit concentration by brand, marketplace, geography, and top channel partners after the six-brand pivot.
      whyItMatters: A concentrated holdco can look diversified in logos while still depending on one brand or one marketplace for most economics.
      diligencePath: Obtain a brand/channel/geography concentration bridge for 2024 and LTM 2025-2026 performance.
      relatedQuestionRefs: [QU008]
    - type: enumeration-incomplete
      severity: material
      topic: named-brands
