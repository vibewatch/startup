company:
  name: Merama
chapter:
  number: 6
  title: Customers
  summary: >-
    Merama's "customers" are founder-led ecommerce brands rather than end
    consumers, and the public record shows the company narrowing from 20+ brands
    in 2022 to a six-brand holdco by 2025. Public adoption proof is strongest
    around the named portfolio and Growth Supplements, while retention,
    concentration, and channel-level sell-through disclosure remains thin.
sections:
  - id: brand-partner-segments
    title: Brand partners are the core counterparties
    body: >-
      Merama positions itself as a strategic partner to ecommerce brands, not as
      a software vendor or retail marketplace. Its own site says it invests
      directly into partner companies, seeks a substantial stake rather than
      full ownership, and leaves governance plus day-to-day operating control
      with founders. Third-party descriptions are broadly consistent: Merama is
      repeatedly described as targeting founder-led, profitable direct-to-
      consumer brands that already have meaningful online traction and need
      capital, operating expertise, and technology support to scale across Latin
      America and into the U.S. This means buyer, user, and payer are typically
      brand founders and operating teams, while the economic thesis depends on
      how much incremental growth Merama can drive after taking ownership.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: public-adoption-proof
    title: Public adoption proof shows a narrower but more explicit portfolio
    body: >-
      The clearest adoption evidence is not end-customer demand data but public
      proof that Merama has assembled and kept operating a real portfolio of
      brands. Bloomberg Línea reported in early 2022 that Merama already had
      more than 20 brands across six geographies. By April 2025, Contxto said
      the company had moved from more than two dozen online retail brands to a
      six-brand structure focused on larger assets, while Growth Engineer also
      described a curated portfolio of six major brands. Contxto named Growth
      Supplements, Mercadazo, and Oceane as current portfolio companies and
      described Growth Supplements as a long-running alliance that Merama fully
      acquired after claiming more than 10x growth during the relationship.
      That is stronger than logo-only evidence, but it still falls short of a
      broad set of independently verified customer case studies.
    claimRefs: [CU005, CU006, CU007, CU010, CU011]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-expansion-and-concentration
    title: Expansion logic is clear, but durability and concentration are still opaque
    body: >-
      Merama's expansion loop is explicit: inject working capital, add central
      expertise in marketplace management, logistics, marketing, and technology,
      then scale each brand across channels and geographies. The 2025 financing
      announcement reinforced that logic by saying new capital would consolidate
      and expand leading direct-to-consumer brands while founders kept
      operational control. What remains materially under-disclosed is durability.
      Public sources reviewed do not publish NRR, GRR, churn, renewal rates,
      contract duration, or repeat-purchase cohorts for the brand portfolio, and
      they do not quantify concentration by brand, channel, or geography after
      the pivot to six brands. Contxto reported 30% sales growth in 2024, down
      from the prior year. The Official Board separately recorded the departure
      of Merama's vice president of international expansion in October 2023;
      that is a narrow historical execution signal, not evidence of customer
      churn. A third-party database also estimated only about 78 employees as of
      August 2026, which may indicate a lean central layer but is not
      independently auditable from Merama's own disclosures.
    claimRefs: [CU008, CU009, CU012, CU013, CU014, CU015, CU016]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale
      - Revenue / strategic value
      - Gap
    rows:
      - - Founder-led profitable DTC brands
        - Founder-operators are buyer, user, and seller; Merama is the capital provider and control shareholder
        - Sell a substantial stake while keeping operating control and using Merama growth support
        - Targeted as multi-million-dollar brands in Latin America and the U.S.
        - Core entry point for Merama's ownership model
        - No public qualification thresholds by revenue, margin, or geography
      - - Brands seeking cross-border expansion
        - Brand leadership teams use Merama experts and working capital
        - Expand from home market into other LatAm countries and the U.S.
        - Public sources cite operations in Mexico, Brazil, Chile, Peru, Colombia, and the U.S.
        - Expands TAM without forcing a full founder exit
        - No public data on success rate by geography or channel
      - - Brands inside current focused categories
        - Category operating teams remain in place while Merama centralizes support
        - Scale brands in supplements, beauty, omnichannel commerce, furniture, kitchen/home, and baby
        - Six-brand portfolio described in 2025
        - Concentrates resources on fewer, larger assets
        - Three of six brands remain unnamed in public sources reviewed
      - - Existing portfolio brands using Merama toolkits
        - Brand teams are users of marketing, BI, logistics, and platform support
        - Improve LTV, pricing, demand planning, fulfillment, and new product/category expansion
        - Merama frames these as recurring operating levers rather than one-off projects
        - Suggests land-and-expand value after investment
        - No public before/after KPI set by brand
    notes: >-
      Public evidence describes Merama's ownership and support model, but not a
      uniform threshold for brand size, margin, or channel mix.
    claimRefs: [CU001, CU002, CU003, CU004, CU007, CU008]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Portfolio breadth
        - 20+ brands in portfolio across six countries plus the U.S.
        - 2022-01
        - Bloomberg Línea
        - High
        - Shows Merama had already assembled a broad multi-country brand base early
        - No brand-by-brand revenue or survival breakdown
      - - Early customer model
        - Acquire stakes in ecommerce businesses and support international expansion
        - 2021-05
        - LAVCA
        - High
        - Confirms customer thesis from early scaling stage
        - No disclosed conversion rate from sourced brands to closed deals
      - - Portfolio focus after pivot
        - More than two dozen brands historically, now focus on six
        - 2025-04
        - Contxto plus Growth Engineer
        - Medium
        - Suggests higher average importance per remaining brand
        - No disclosure of how much revenue each retained brand represents
      - - Growth Supplements partnership outcome
        - Merama said the brand grew more than 10x during the alliance and was then fully acquired
        - 2025-04
        - Contxto
        - Medium
        - Strongest named proof of operating engagement beyond a passive stake
        - No independently verified base value or time-series denominator
      - - Growth Supplements scale
        - Annual sales above US$400 million
        - 2025-04
        - Contxto
        - Medium
        - Implies at least one large production asset inside the portfolio
        - No audited revenue bridge or profitability data
      - - Reported topline growth
        - Sales grew 30% in 2024, versus 40% in 2023
        - 2025-04
        - Contxto
        - Medium
        - Indicates growth is still positive but moderating
        - No brand-level contribution, customer retention, or channel mix
      - - Central team scale estimate
        - Approximately 78 employees across 3 continents
        - 2026-08
        - LeadIQ
        - Low
        - Suggests a relatively lean central organization versus a multi-brand portfolio
        - Commercial-database estimate, not company-audited disclosure
    notes: >-
      This table mixes historical and recent snapshots from different sources;
      absence of consistent brand-level denominators limits comparability.
    claimRefs: [CU004, CU005, CU006, CU010, CU011, CU014, CU016]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Growth Supplements
        - Sports nutrition / wellness brand
        - Merama alliance plus later full acquisition inside focused portfolio
        - Production asset
        - Merama said the brand grew more than 10x during the partnership; Contxto also described sales above US$400 million
        - Evidence is mediated through one 2025 news report; no direct customer quote, retention data, or audited KPI bridge
      - - Mercadazo
        - Omnichannel ecommerce brand
        - Named as one of Merama's six current brands
        - Production asset implied by inclusion in six-brand holdco
        - Public naming confirms the portfolio is not purely theoretical
        - No public operating metrics, contract terms, or independently reported outcomes in the assigned pool
      - - Oceane
        - Beauty brand
        - Named as one of Merama's six current brands
        - Production asset implied by inclusion in six-brand holdco
        - Shows category breadth beyond supplements and marketplaces
        - No public revenue, renewal, or geographic expansion KPI in the assigned pool
    notes: >-
      Public brand-level proof is partial: Contxto names only three of the six
      current brands, and the assigned source pool includes no direct customer
      case study authored by those brands themselves.
    enumerationScope:
      coverage: partial
      basis: >-
        Partial enumeration of the publicly named current portfolio brands found
        in the assigned 2025 source pool; three of six brands were explicitly
        named.
    claimRefs: [CU006, CU007, CU010, CU011]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Merama's customer journey runs from brand sourcing and investment through
      centralized scaling support and a later optional founder exit.
    data:
      items:
        - label: Source profitable founder-led brand
          actor: Merama deal team and brand founders
          phase: Entry
          touchpoints:
            - Brand selection
            - Majority-stake discussion
            - Governance retention
        - label: Make initial investment
          actor: Merama plus founder-operators
          phase: Transaction
          touchpoints:
            - Cash-out on sold shares
            - Working-capital infusion
        - label: Keep founders operating the business
          actor: Brand management team
          phase: Stabilization
          touchpoints:
            - Day-to-day operations stay local
            - Merama avoids full absorption
        - label: Apply centralized growth levers
          actor: Merama operating specialists
          phase: Enablement
          touchpoints:
            - Marketing and BI
            - Pricing and demand planning
            - Logistics and platform support
        - label: Expand channels and geographies
          actor: Brand teams plus Merama
          phase: Scaling
          touchpoints:
            - Cross-border expansion
            - New products and categories
            - Marketplace optimization
        - label: Create a later exit option
          actor: Founders and Merama
          phase: Monetization
          touchpoints:
            - 3-5 year horizon on official site
            - Value capture after brand growth
    approximationNotes: >-
      This is a qualitative operating sequence synthesized from official and
      reported descriptions; public sources do not provide stage conversion rates
      or per-brand time-to-expansion data.
    claimRefs: [CU002, CU008, CU009]
callouts:
  - calloutType: strength
    title: Narrower portfolio increases the credibility of active ownership
    body: >-
      The combination of founder-retained control, a six-brand focus, and the
      named Growth Supplements outcome suggests Merama is trying to operate as a
      concentrated holdco rather than a passive logo collector.
    claimRefs: [CU002, CU006, CU010, CU011]
  - calloutType: risk
    title: Public durability evidence is still too thin for a hard adoption moat
    body: >-
      Merama has public proof of portfolio assembly and some growth anecdotes,
      but the source set still lacks retention cohorts, renewal rates, channel
      concentration, and independently sourced brand-by-brand outcome reporting.
    claimRefs: [CU012, CU013, CU014, CU016]
