company:
  name: Merama
chapter:
  number: 8
  title: Valuation
  summary: >-
    Merama still looks investable only at a clearly disciplined entry price, not at a generic quality score. Public evidence supports that the company remained above a $1 billion valuation after the April 2025 recapitalization, but the exact post-money, capital-stack economics, and current cash-and-covenant position remain undisclosed while public funding totals and operating metrics conflict across data providers. That leaves the chapter at TRACK with medium confidence, high risk, and a stretched valuation stance until fresh private evidence closes the underwriting gaps.
sections:
  - id: recommendation
    title: Recommendation and entry discipline
    body: >-
      The evidence supports a TRACK recommendation rather than a buy call. Merama did complete a meaningful April 2025 recapitalization, with Tracxn listing $170 million of debt and $45 million of equity while Contxto reported that the financing kept the company above a $1 billion valuation. That is enough to show continued investor support, but not enough to justify underwriting a fresh entry on price because the exact 2025 post-money valuation, preference stack, and debt terms remain undisclosed. Public evidence is also stale on core operating proof: the clearest revenue mark still traces back to 2021, and public headcount and cumulative funding figures disagree across providers. In practice, the investment case improves only if management can prove that the 2025 balance-sheet reinforcement translated into durable brand-level growth, clean cash conversion, and covenant headroom at a valuation meaningfully better than the current public markers imply.
    claimRefs: [CV001, CV002, CV003, CV004, CV008, CV009, CV013]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-context
    title: Financing context and anti-thesis
    body: >-
      Merama's valuation story is inseparable from its financing structure. Public records agree that the company became a unicorn in 2021, but they diverge sharply on what happened afterward: Multiples reports $390 million raised across four rounds, Tracxn reports $430 million across eight rounds, SetterVC estimates $560 million across six rounds, and Contxto says more than $520 million across venture capital and debt. That inconsistency matters because the April 2025 package was not a simple clean up-round; it included another $170 million of debt after an $80 million J.P. Morgan financing in 2024. The anti-thesis is therefore not that Merama lacks scale, but that public evidence still cannot separate operating strength from capital support. Management's shift from a broad aggregator narrative toward a smaller portfolio of six core brands helps the story, yet it also reinforces that future returns depend on execution inside a concentrated set of assets rather than on limitless portfolio roll-up optionality.
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV011, CV014]
    tableRefs: [TV002]
  - id: scenarios-and-comps
    title: Scenario framing and comparable discipline
    body: >-
      The cleanest comparable anchor is not a precise revenue multiple but a scenario range tied to evidence quality. Public sources still point to the last explicit valuation mark of $1.2 billion in December 2021, while the 2025 round only confirms a value above $1 billion. Multiples still links the old 2021 mark to roughly $250 million of revenue, but that figure is historical and should not be treated as current run-rate proof. Meanwhile, Contxto reported 30 percent sales growth in 2024 and highlighted Growth Supplements as a more than $400 million annual-sales asset, which shows the portfolio still contains meaningful scale. The problem is comparability: Merama is neither a pure software platform nor a fully centralized Thrasio-style roll-up, because Bloomberg and SetterVC both describe majority-stake acquisitions with founders left in operating control. That structure justifies scenario underwriting, but not false precision on exit multiples or target returns without current brand-by-brand statements.
    claimRefs: [CV002, CV003, CV006, CV007, CV008, CV010, CV014]
    tableRefs: [TV003]
  - id: diligence-gates
    title: Final diligence asks and thesis-break triggers
    body: >-
      To move from TRACK to invest, Merama needs to prove that the 2025 recapitalization reduced financing risk rather than merely extending it. The highest-priority requests are a current cap table that separates priced equity from debt and any preference terms, audited or lender-grade consolidated financials, brand-level revenue and margin bridges for the six current platforms, and the covenant package plus maturity profile on the BTG Pactual, Citi, Itau, and J.P. Morgan debt. A thesis break would be evidence that 2024's slower growth persisted into 2025 while debt service tightened strategic flexibility, or that reported scale rests disproportionately on one or two brands without repeatable portfolio economics. The upside case requires the opposite: brand-level growth durability, clean working-capital discipline, and a demonstrated path to value creation that does not rely on another opaque financing event.
    claimRefs: [CV005, CV007, CV009, CV010, CV012, CV013]
