  evidenceGaps:
    - type: missing-source
      severity: material
      topic: current-valuation
      missingEvidence: Exact post-money valuation, dilution terms, and any liquidation or preference stack attached to the April 2025 equity.
      whyItMatters: Without exact price and preference terms, recommendation quality cannot move from track to invest with high confidence.
      diligencePath: Request the 2025 financing deck, updated cap table, and signed term summaries from counsel or finance.
      relatedQuestionRefs: [QV001, QV003]
    - type: private-evidence-only
      severity: material
      topic: debt-covenants
      missingEvidence: Current cash balance, covenant package, maturity schedule, pricing, and security package for the BTG Pactual, Citi, Itau, and J.P. Morgan debt facilities.
      whyItMatters: Debt service and covenant headroom determine whether equity upside is being protected or structurally subordinated.
      diligencePath: Obtain the debt summary schedule and lender reporting package used by management and financing counterparties.
      relatedQuestionRefs: [QV002, QV007]
    - type: conflicting-data
      severity: material
      topic: external-data-consistency
      missingEvidence: A reconciled bridge for total capital raised, headcount, and current revenue that explains why public datasets diverge.
      whyItMatters: Inconsistent public baselines make comparable analysis and return framing less reliable than the headline unicorn label suggests.
      diligencePath: Reconcile third-party data providers against management's board materials and audited or lender-grade operating statements.
      relatedQuestionRefs: [QV005, QV008]
    - type: missing-source
      severity: material
      topic: brand-level-performance
      missingEvidence: Brand-by-brand revenue, gross margin, marketing efficiency, and working-capital profiles for the six current platforms.
      whyItMatters: The upside and downside cases both depend on whether value is diversified across the focused portfolio or concentrated in one flagship asset.
      diligencePath: Request a brand bridge for 2024 and year-to-date 2025 with management commentary on repeatability and concentration.
      relatedQuestionRefs: [QV004, QV007]
