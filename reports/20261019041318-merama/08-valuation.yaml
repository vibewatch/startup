  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Argument
      - What would change the view
    rows:
      - [Thesis, "Repeat investors funded another 2025 round and public sources still place Merama above a $1 billion valuation.", "Upgrade if management shows the exact 2025 price, dilution, and current liquidity profile."]
      - [Thesis, "Management has narrowed the portfolio to six larger brands and reported 30% sales growth in 2024, suggesting a sharper operating focus.", "Upgrade if brand-level statements show that growth is durable and not concentrated in a single hero asset."]
      - [Anti-thesis, "Public sources disagree on total funding, headcount, revenue, and valuation marks, so the external data room is materially incomplete.", "Mitigate if audited or lender-grade statements reconcile capital raised, revenue, and current organizational scale."]
      - [Anti-thesis, "The 2025 round added more debt after the 2024 J.P. Morgan facility, so returns may depend on leverage tolerance as much as on brand growth.", "Mitigate if the company discloses covenant headroom, maturity schedule, and cash conversion by brand."]
    notes: "Rows synthesize independent public sources rather than management-only material; they are meant to frame price-sensitive diligence, not to imply a finished investment memo."
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV009]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Six-brand portfolio compounds brand-level growth, Growth Supplements scale expands, and debt remains comfortably serviceable.", "A current valuation modestly above the 2021 unicorn mark could still work if fresh financials show better margins and cash conversion than the market fears.", "Portfolio concentration, marketplace dependence, and debt still matter.", "Requires audited or lender-grade proof that post-2025 operations justify a premium to stale 2021 benchmarks."]
      - [Base, "Merama remains a focused holding company with useful scale, but public data stays sparse and leverage reduces underwriting room for error.", "Entry only works at a disciplined discount to optimistic private marks because current public evidence supports continuity, not clear re-rating.", "Opaque cap table, covenant risk, and stale revenue disclosure.", "Best fit for TRACK while diligence remains incomplete."]
      - [Bear, "2024 growth slowdown persists, debt absorbs flexibility, and one or two brands carry most of the portfolio value.", "If the undisclosed 2025 mark embeds aggressive expectations, downside could come from multiple compression and recapitalization risk rather than operating collapse alone.", "Concentrated asset risk, refinancing dependence, and no current public financial bridge.", "Any evidence of weak covenant headroom or deteriorating brand-level profitability would push the case toward PASS."]
    notes: "Scenario ranges are qualitative because public evidence does not disclose a current exact valuation, cap-table terms, or brand-level financial statements."
    claimRefs: [CV002, CV003, CV005, CV007, CV010, CV013, CV014]
