callouts:
  - calloutType: recommendation
    title: Current call
    body: "Track, not buy: Merama may still compound value, but current public evidence does not support underwriting a fresh entry at an undisclosed 2025 price."
    claimRefs: [CV003, CV004, CV013]
  - calloutType: risk
    title: Core underwriting risk
    body: "The key risk is not that Merama lacks scale; it is that leverage and opaque current valuation terms make it hard to tell how much of the upside is already priced in."
    claimRefs: [CV005, CV010, CV013]
