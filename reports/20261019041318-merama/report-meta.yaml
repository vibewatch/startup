companyProfile:
  summary: >-
    Merama is a growth-stage Latin American ecommerce holdco that buys or backs founder-led consumer brands, keeps
    founders and local operators in place, and adds working capital plus operating support across marketplaces,
    logistics, marketing, and technology. The public record shows a company that scaled quickly in 2021, then shifted
    toward a smaller six-brand portfolio by 2025 while continuing to attract repeat equity and debt support.
