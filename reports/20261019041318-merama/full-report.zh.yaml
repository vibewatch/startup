  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 这是一张序数图，横轴是 Merama 及保留资料中主要替代方案所保留的创始人控制权，纵轴是运营支持的广度。
    xAxis:
      label: 保留的创始人控制权
      min: 1
      max: 5
      low: Buyer-controlled
      high: Founder-retained
      description: Ordinal synthesis from disclosed deal structure
      scale: ordinal
    yAxis:
      label: 运营支持广度
      min: 1
      max: 5
      low: Capital only / self-build
      high: Capital plus marketplace, logistics, and tech support
      description: Ordinal synthesis from source-described services
      scale: ordinal
    data:
      points:
        - label: Merama（2025 模式）
          x: 4
          'y': 5
          note: 多数股权结构，保留创始人连续性，并提供广泛运营支持。
        - label: Valoreo
          x: 2
          'y': 3
          note: 公开披露为聚焦 FBA 的收购载体；保留创始人的细节在保留资料中没有公开。
        - label: Bamboo / JUGGERNAUT
          x: 2
          'y': 3
          note: 一篇评审资料提到的披露有限的同行，公开运营细节稀少。
        - label: Thrasio 式滚动收购
          x: 1
          'y': 3
          note: 可作为通过收购实现规模化的有用基准，但保留资料主要把它作为警示性对照。
        - label: PE / 战略买家
          x: 1
          'y': 2
          note: 可以提供流动性或资本，但保留证据显示其运营支持较少专注于 DTC。
        - label: 内部孵化 / 保持独立
          x: 5
          'y': 1
          note: 控制权保留程度最高，但品牌必须自行承担物流、工具和扩张成本。
    approximationNotes: 坐标是分析师根据披露的控制权和支持描述赋予的 1-5 序数分数，不是公司报告的指标、市场份额数据或独立基准结果。
    claimRefs:
      - CP002
      - CP003
      - CP004
      - CP006
      - CP010
      - CP011
      - CP012
      - CP013
  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 公开来源描述了从品牌收购、资金支持到品牌销售的流程，但没有披露完成投资判断模型所需的毛利率和现金转化环节。
    data:
      nodes:
        - label: 来源品牌
          detail: Merama 识别领先电商品牌，并收购多数股权。
        - label: 创始人运营的组合
          detail: 创始人继续经营业务，同时保留运营控制权。
        - label: 注入资本
          detail: 股权和债务资金投入营运资金、库存及有选择的收购。
        - label: 共享运营支持
          detail: 平台运营、物流、营销、制造和技术能力被集中起来，成为共享支持杠杆。
        - label: 组合销售
          detail: 公开证据显示 2024 年销售额增长，但没有按品牌披露当前合并收入桥接。
        - label: 毛利和现金生成
          detail: 公开证据没有披露利润率、现金转化和契约余量。
      edges:
        - from: Source brands
          to: Founder-operated portfolio
          label: 多数股权合作
        - from: Founder-operated portfolio
          to: Capital injection
          label: 股权加债务融资
        - from: Capital injection
          to: Shared operating support
          label: 营运资金和能力建设
        - from: Shared operating support
          to: Portfolio sales
          label: 渠道、物流和技术扩张
        - from: Portfolio sales
          to: Gross profit and cash generation
          label: 经济性尚未完全披露
    approximationNotes: 关系流程有来源支持，但没有公开来源量化商品交易需求到收入、毛利和自由现金流的桥接。
    claimRefs:
      - CI001
      - CI004
      - CI008
      - CI009
      - CI010
      - CI011
      - CI012
      - CI014
  - id: FE001
    title: 公开披露的品牌、渠道与共享服务运营栈
    type: stack
    summary: 可见的产品栈从平台需求捕获开始，经由品牌平台延伸至共享服务，再到记录有限的内部工具。
    data:
      layers:
        - label: 需求渠道
          detail: 客户需求通过大型平台和跨境线上渠道进入。
          modules:
            - Mercado Libre
            - Amazon
            - Shopee
          outputs:
            - 合作品牌的流量和交易
        - label: 品牌平台
          detail: Merama 将资本和运营人员集中到规模更小的品牌业务单元。
          modules:
            - Growth Supplements
            - Mercadazo
            - Oceane
            - 其他家居、厨房、家具和母婴品牌
          outputs:
            - 按品类划分的产品组合
            - 品牌层面的扩张平台
        - label: 品类打法
          detail: 每个重点品类都可以采用独立运营方案，而不是套用一套统一的聚合器流程。
          modules:
            - 运动营养
            - 美妆
            - 家具 / 家居 / 母婴
          outputs:
            - 品牌专属的商品运营和扩张方案
        - label: 共享运营服务
          detail: 集中化能力旨在提升组合品牌的执行质量。
          modules:
            - 平台运营管理
            - 数字营销
            - 供应链和物流
            - 库存和营运资金支持
          outputs:
            - 国际扩张
            - 品牌增长服务
        - label: 资本和治理
          detail: 多数股权和营运资金支持属于运营栈的一部分，而不只是融资安排。
          modules:
            - 多数股权结构
            - 营运资金安排
            - 董事会和运营监督
          outputs:
            - 创始人保持连续性，同时组合控制更紧
        - label: 内部平台
          detail: 内部工具和 Merama Labs 是记录最少、但杠杆作用最重要的一层。
          modules:
            - 自动化工具
            - Merama Labs
            - 品类内并购打法
          outputs:
            - 流程自动化
            - 新品牌孵化
    approximationNotes: 各层边界反映的是公开证据集合，而不是内部架构图。
    claimRefs:
      - CE003
      - CE006
      - CE010
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Merama 的客户旅程从寻找品牌和投资开始，经过集中化扩张支持，最终可选择由创始人退出。
    data:
      items:
        - label: 寻找盈利的创始人主导品牌
          actor: Merama 交易团队和品牌创始人
          phase: 进入
          touchpoints:
            - 品牌筛选
            - 多数股权讨论
            - 治理权保留
        - label: 进行初始投资
          actor: Merama 与创始人运营者
          phase: 交易
          touchpoints:
            - 出售股份后的现金退出
            - 注入营运资金
        - label: 保持创始人经营业务
          actor: 品牌管理团队
          phase: 稳定
          touchpoints:
            - 日常运营留在本地
            - Merama 避免完全吸收
        - label: 运用集中化增长杠杆
          actor: Merama 运营专家
          phase: 赋能
          touchpoints:
            - 营销和 BI
            - 定价和需求规划
            - 物流和平台支持
        - label: 扩展渠道和地域
          actor: 品牌团队与 Merama
          phase: 扩张
          touchpoints:
            - 跨境扩张
            - 新产品和品类
            - 平台优化
        - label: 创造后续退出选择
          actor: 创始人与 Merama
          phase: 变现
          touchpoints:
            - 官网所述的 3-5 年时间框架
            - 品牌增长后的价值兑现
    approximationNotes: 这是根据官方和媒体报道综合出的定性运营流程；公开来源没有提供阶段转化率或单品牌扩张所需时间。
    claimRefs:
      - CU002
      - CU008
      - CU009
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险最高的区域集中在融资不透明、品牌集中，以及对外部运营者和资本的依赖。
    data:
      columns:
        - 可能性
        - 影响
        - 缓解成熟度
      rows:
        - label: 债务和契约不透明
          note: 公开来源指出了贷款人和债务金额，但没有披露契约余量或到期日。
          values:
            - 高
            - 高
            - 低
        - label: 组合收窄后的品牌集中
          note: Merama 目前聚焦六个品牌，因此品牌层面的业绩不佳影响更大。
          values:
            - 高
            - 高
            - 中
        - label: 创始人 / 运营者依赖
          note: 多数股权并不能消除对继续经营业务的本地运营者的依赖。
          values:
            - 中
            - 高
            - 中
        - label: 法律和控制面不透明
          note: 分配到的公开证据无法清晰证明诉讼、执法或隐私 / 安全状况。
          values:
            - 中
            - 中
            - 低
        - label: 按品牌分散披露
          note: 管理层表示，自 2025 年起将不再按全球口径报告增长。
          values:
            - 高
            - 中
            - 低
        - label: 领导层和扩张连续性
          note: 公开证据记录了至少一名国际扩张高管离职。
          values:
            - 中
            - 中
            - Unknown
    approximationNotes: 定性单元总结本章基于来源的排序；审阅债务文件和品牌层面报告后应更新。
    claimRefs:
      - CR003
      - CR006
      - CR013
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 在经营证据、资本结构和价格透明度对齐前，继续跟踪公司。
    data:
      nodes:
        - label: 2025 年完成资本重组
          detail: 公开来源显示，2025 年 4 月完成 $45M 股权加 $170M 债务融资。
        - label: 规模证据仍然存在
          detail: 据报道，2024 年销售额增长 30%，且 Growth Supplements 年销售额被描述为超过 $400M。
        - label: 数据室仍不一致
          detail: 第三方来源之间的公开融资、收入和员工人数数据相互冲突。
        - label: 债务负担仍然重要
          detail: 公司在 2024 年从 J.P. Morgan 获得 $80M 融资后，于 2025 年进一步增加债务。
        - label: 确切价格缺乏充分支持
          detail: 最新的确切公开估值仍是 2021 年的 $1.2B 轮融资，而 2025 年仅被描述为“超过 $1B”。
        - label: 推荐维持跟踪
          detail: 只有在披露确切估值、股权结构和按品牌拆分的财务证据后，才应上调判断。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV007
      - CV010
      - CV013
