          detail: 同一 Balderton 视角把投资逻辑与电商更快的结构性普及联系起来。
        - label: 渗透率追赶
          value: 9% LatAm vs 20% U.S.
          detail: Balderton 的渗透率差距解释了上行空间；Redalyc 随后显示该地区 2023 年渗透率已超过 20%。
        - label: 核心国家集中度
          value: Brazil 41%, Mexico 24%, Argentina 13%
          detail: Redalyc 显示，三个国家贡献了区域电商销售额的大部分。
        - label: 平台基础设施
