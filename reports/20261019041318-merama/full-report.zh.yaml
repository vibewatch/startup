      - number: '1.4'
        title: 里程碑、当前规模与开放风险
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，公司先快速扩张，随后有意收窄业务范围。2021 年，TechCrunch 称公司在五个拉美国家拥有超过 180 名员工和 20 个品牌；到 2025 年，Contxto
              则称其组合缩减为六个品牌，并转向品牌层面的自主运营。LatamList 另行报道，公司 2023 年 EBITDA 超过 1 亿美元，并在 2024 年 4
              月完成再融资。这些信息有助于确认运营规模，但没有解决核心披露缺口。公开来源仍无法核对当前估值、累计融资总额、债务条款、客户数量或准确的当前员工数。这些并非表面上的遗漏：它们会影响公司对杠杆的承受度、所有权集中度，以及
              Merama 在 2025 年之后究竟更像风险投资式高速增长公司，还是正在优化少数品牌的成熟组合运营商。
