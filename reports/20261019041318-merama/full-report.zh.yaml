        - 当前运营商 / 控股公司模式
        - '>$520m 累计股权 + 债务融资，截至 2025 年；收购 >2 打品牌后拥有 6 个品牌'
        - 拉美和美国由创始人主导的 DTC 品牌
        - 多数股权模式，创始人继续经营，同时提供电商平台、物流、技术和营运资金支持
        - 协商定价和实际经济性属于非公开信息，因此护城河证据只能看运营表现，财务情况并不透明
      - - Valoreo
        - 直接区域同业
        - KASZEK 后续投资；此前于 2021 年完成 USD50m 轮融资
        - 聚焦拉美的 FBA 企业
        - 收购、运营并扩大 Amazon 原生业务
        - 保留证据池未披露创始人留任条款和当前支持范围
