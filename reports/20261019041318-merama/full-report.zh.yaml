  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与不属于边界的部分
        blocks:
          - type: paragraph
            body: >-
              相关市场不是整个拉美零售市场，甚至也不是整个区域电商市场。Merama 从已经通过 Mercado Libre、Amazon 等 marketplace
              成功销售的创始人主导消费品牌切入，再提供多数股权资本、营运资金、运营支持和跨境扩张能力。因此，本章中的实际“买方”是决定是否出售多数股权的创始人或控股运营者；终端消费者则处于组合品牌层面的下游。主要替代方案包括继续独立经营、在没有运营方支持的情况下筹集传统债务或风险资本，或者出售给不让创始人继续日常运营的传统私募股权或战略买家。这个边界很重要，因为宽泛的区域电商
              TAM 会高估 Merama 实际能触达的支出。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
      - number: '2.2'
        title: 公开规模口径宽泛，并非 Merama 专属
        blocks:
          - type: paragraph
            body: >-
              最好的公开需求口径仍是自上而下的估算。Balderton 将拉美电商规模定为 $67b，年增长率为 24%，且线上渗透率低于美国；学术案例研究则显示，渗透率从 2019 年约 10% 上升到 2023 年超过
              20%。Redalyc 还显示，需求高度集中：巴西和墨西哥占据区域销售主导，Mercado Libre 仍是关键 marketplace
              渠道。这些事实支持一个规模庞大且仍在成熟的外围市场，但无法单独识别其中有多少支出来自 Merama 仍想持有的、盈利且由创始人主导的品牌。本证据池中唯一更具体的公开口径，是墨西哥 1,500
              万消费者规模的膳食补充剂市场，但这仍只是 Merama 当前收购漏斗的部分代理指标。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM011
