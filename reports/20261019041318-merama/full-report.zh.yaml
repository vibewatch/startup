  - id: TV003
    title: 看涨 / 基准 / 看跌情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 看涨
        - 六品牌组合实现品牌层面的复合增长，Growth Supplements 规模扩大，债务仍能轻松偿付。
        - 如果最新财务数据表明利润率和现金转化好于市场担忧，即使当前估值略高于 2021 年独角兽估值，这笔投资仍可能成立。
        - 组合集中度、对平台的依赖和债务仍然重要。
        - 需要经审计或达到贷款人要求的证据，证明 2025 年后的经营表现足以支撑相对陈旧的 2021 年基准溢价。
      - - 基准
        - Merama 仍是一家聚焦型控股公司，规模已有一定基础，但公开数据依然稀少，杠杆也压缩了投资判断的容错空间。
        - 只有在相对乐观的私募估值上给予严格折价时，入场才成立，因为当前公开证据支持的是延续性，而不是明确的估值重评。
        - 股权结构表不透明、契约风险和陈旧的收入披露。
        - 在尽调尚未完成前，最适合维持跟踪。
      - - 看跌
        - 2024 年的增长放缓持续，债务吞噬灵活性，且一两个品牌承载了组合的大部分价值。
        - 如果未披露的 2025 年估值包含过于激进的预期，下行风险可能来自估值倍数压缩和资本重组，而不只是经营崩溃。
        - 资产集中风险、对再融资的依赖，以及缺少当前公开财务桥接数据。
        - 任何契约余量薄弱或品牌层面盈利能力恶化的证据，都可能把结论推向放弃。
    notes: 由于公开证据没有披露当前确切估值、股权结构条款或品牌层面的财务报表，情景区间采用定性表达。
    claimRefs:
      - CV002
