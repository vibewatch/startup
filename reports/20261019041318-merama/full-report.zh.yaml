        title: 展示项
        blocks:
          - type: callout
            title: 公开规模口径对估值而言仍宽了一层
            body: 现有证据足以证明区域电商环境规模大且仍在成熟，但没有披露在 Merama 当前六品牌重点中有多少品牌已准备好被收购，也没有披露各品牌当前的渠道经济性。
