companyProfile:
  summary: >-
    Merama 是一家处于成长阶段的拉美电商控股公司，收购或投资创始人主导的消费品牌，保留创始人和本地运营团队，同时在 marketplace、物流、营销和技术方面提供营运资金与运营支持。公开记录显示，公司在 2021
    年快速扩张，随后到 2025 年转向规模更小的六品牌组合，同时继续获得老投资人提供的股权和债务支持。
