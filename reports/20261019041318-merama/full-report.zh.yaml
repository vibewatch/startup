              - CV009
      - number: '8.3'
        title: 情景框架与可比纪律
        blocks:
          - type: paragraph
            body: >-
              最干净的可比锚点不是精确收入倍数，而是与证据质量挂钩的情景区间。公开来源仍指向 2021 年 12 月最后一次明确估值 12 亿美元；2025 年融资只能确认估值高于 10 亿美元。Multiples 仍把
              2021 年旧估值与约 2.5 亿美元收入联系起来，但该数字属于历史数据，不应视为当前 run-rate 证明。同时，Contxto 报道 2024 年销售额增长 30%，并强调 Growth
              Supplements 是一家年销售额超过 4 亿美元的资产，说明组合仍有可观规模。问题在于可比性：Merama 既不是纯软件平台，也不是完全中心化的 Thrasio 式 roll-up，因为 Bloomberg
              和 SetterVC 都描述其收购多数股权并让创始人继续运营。这种结构支持情景式投资判断，但在没有当前逐品牌财务报表的情况下，不支持对退出倍数或目标回报作出虚假的精确估计。
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV007
              - CV008
              - CV010
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV007
              - CV010
              - CV013
              - CV014
      - number: '8.4'
        title: 最终尽调请求与投资论点击穿触发器
        blocks:
          - type: paragraph
            body: >-
              若要从“跟踪”转为投资，Merama 需要证明 2025
              年资本重组降低了融资风险，而不是仅仅把风险往后延。最高优先级请求包括：一份将定价股权、债务和任何优先股条款分开的当前股权结构表；经过审计或达到贷款人标准的合并财务报表；六个平台按品牌拆分的收入和利润率桥接表；以及
              BTG Pactual、Citi、Itau 和 J.P. Morgan 债务的契约包与到期结构。若证据显示 2024 年放缓的增长延续至 2025
              年，同时偿债进一步压缩战略灵活性，或披露规模过度依赖一两个品牌而没有可重复的组合经济性，投资论点就会被击穿。上行情景则要求相反：品牌级增长持久、营运资金纪律清晰，并且有一条不依赖下一次不透明融资事件的价值创造路径。
            claimRefs:
              - CV005
              - CV007
              - CV009
              - CV010
              - CV012
              - CV013
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 当前结论
            body: 跟踪，不买入：Merama 仍可能持续创造价值，但当前公开证据不足以支持在 2025 年未披露价格下进行新的投资判断。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV004
              - CV013
          - type: callout
            title: 核心投资风险
            body: 关键风险不是 Merama 缺乏规模，而是杠杆和当前估值条款不透明，让人难以判断上行空间有多少已经反映在价格中。
            calloutType: risk
            claimRefs:
              - CV005
              - CV010
              - CV013
