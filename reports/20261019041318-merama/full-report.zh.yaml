          detail: 平台集中度决定品牌如何被收购、扩张和降风险。
        - label: 当前可投资细分市场
          value: Six core brands
          detail: Merama 在 2025 年采取更窄的组合策略，在补剂等选定垂直领域内扩张。
    approximationNotes: 这座金字塔综合了不同的公开视角，并不是数学上嵌套的 TAM/SAM/SOM 桥接；每一层都保留原始指标和时间口径，没有人为换算成单一分母。
