  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开经营表现
        blocks:
          - type: paragraph
            body: >-
              Merama 的变现模式不是公开标价的软件或服务费。指定来源一致描述了一种结构：Merama 收购消费品牌的多数股权，让创始人继续经营，同时加入营运资金、marketplace
              经验、物流支持和技术工具来推动品牌扩张。因此，经济表现应看组合品牌的收入增长、毛利和现金转化，而不是 SaaS 的 ARR 等指标。公开经营表现证据有限但并非不存在：投资人 Balderton 描述了公司
              2021 年初高度盈利的运营状态；Contxto 则报道，在组合收窄至六个品牌后，公司 2024 年销售额增长 30%。这些增长证据质量不一，因为公司从 2025
              年起不再公开披露整体增长，且指定来源没有提供按品牌或渠道拆分的合并审计收入桥接表。
