      - number: '4.2'
        title: 定价、成本结构与单位经济性透明度
        blocks:
          - type: paragraph
            body: >-
              公开记录对机制的说明比对实际经济性的说明更清楚。Merama
              似乎通过被收购品牌内部的所有权经济性变现，而不是采用标准公开价目表，因此列表定价实际上无法获得。近期资本用途披露指向几个关键成本驱动因素：库存营运资金、营销和品牌定位、制造与物流能力，以及现有业务单元内持续并购。这些用途意味着资产负债表暴露于库存和供应链风险，与轻资产
              marketplace 或 SaaS roll-up
              完全不同。缺失的仍是判断模式能否复利的指标：当前毛利率、贡献利润率、获客成本、回本期、留存、各品牌回报，以及组合内部融资或转移定价的实际成本。指定证据中最乐观的利润率表述来自 Balderton 2021
              年的文章，方向上有参考价值，但已经过时，而且由投资合伙人撰写。
