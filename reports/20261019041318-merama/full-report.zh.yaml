  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 替代方案全景
        blocks:
          - type: paragraph
            body: >-
              留存证据支持的竞争集合，比简单罗列聚合器 logo 更广。Merama 起初是面向 marketplace
              原生品牌的电商卖家聚合器，因此创始人的次优选择可以是另一家聚合器、企业买家、私募股权投资人，或者继续独立经营并通过 Amazon 和 Mercado Libre 销售。留存证据中最清楚、最接近同类的区域同行是
              Valoreo；Bamboo 和 JUGGERNAUT 仅作为描述很少的替代方案出现。因此，实际买家比较的重点不是市场份额，而是控制权、资本和运营支持。
            claimRefs:
