      - number: '2.3'
        title: 采用驱动因素和约束来自运营，而不只是需求
        blocks:
          - type: paragraph
            body: >-
              当品牌已有产品—市场匹配度，却仍受库存融资、物流、marketplace 经验，以及进入自有渠道或新地域的能力限制时，Merama 的方案最具吸引力。同一批证据也说明，这不是一个无摩擦的 roll-up
              市场：marketplace 费用和仓储成本会压缩利润率，物流仍是区域瓶颈，而美国 Thrasio 式聚合器的崩溃也让运营纪律成为首要筛选条件。Merama 自己在 2025
              年的定位也反映出这次重置：强调六个平台、运营效率，以及现有垂直领域内的品牌并购，而不是无限制扩展品类。对估值而言，执行质量和渠道经济性比“区域市场很大”这样的泛泛判断更重要。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
