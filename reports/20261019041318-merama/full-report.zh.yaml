              公司自有材料和独立报道都将 Merama 描述为希望扩大规模、但不愿完全退出的数字原生消费品牌的买方或主导合作方。反复出现的工作流很一致：Merama
              收购多数或控制性股权，保留品牌运营者，然后叠加营运资金、电商专家、marketplace 管理和自动化工具。这使交付的产品更像面向组合品牌的共享运营平台，而不是直接面向消费者的软件
              SKU。最清楚的证明仍然来自商业和结构，而非技术：截至 2021 年底，公开披露的品牌超过 20 个，而公开渠道叙事仍围绕 Mercado Libre、Amazon、Shopee
