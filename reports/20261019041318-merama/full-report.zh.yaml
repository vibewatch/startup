chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、覆盖范围与运营模式
        blocks:
          - type: paragraph
            body: >-
              Merama 成立于 2020 年，总部位于墨西哥城。早期报道称其运营中心位于墨西哥和巴西，品牌组合覆盖墨西哥、巴西、智利、哥伦比亚、秘鲁，后来又进入美国。不同独立报道有一个共同结论：Merama 并不是纯粹的
              marketplace 软件供应商。它投资消费品牌、提供营运资金，并补充电商、物流、营销和技术运营能力。模式也随时间变化。早期报道将 Merama 定义为拉美电商聚合器；2025
              年报道则描述其转向更精选的控股公司策略，聚焦更少但更大的品牌，同时保留品牌层面的运营独立性。因此，相比经常性收入软件公司，Merama
              更适合与资本密集型组合运营商比较；后续章节分析规模指标、融资需求和集中度风险时，需要以此为前提。
            claimRefs:
              - CO001
              - CO002
              - CO011
