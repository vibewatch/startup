      - number: '3.4'
        title: 尽调含义
        blocks:
          - type: paragraph
            body: >-
              当前证据支持把 Merama 看作一家比纯粹 Thrasio 式 roll-up 更精选的控股公司运营商，但还不足以认定其拥有清晰且持久的护城河。公开来源中的直接同行很少，Merama
              的谈判经济性属于私人信息，连审阅式来源中提到的替代方案在留存证据池里也缺少独立运营披露。投资判断的关键问题是：Merama
              对创始人友好的控制模式和运营服务，能否带来可重复的收购后业绩，让同行和替代方案无法只靠资本追上。
            claimRefs:
              - CP006
              - CP010
              - CP011
              - CP013
              - CP015
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: Thrasio 是警示，不是结论
            body: >-
              留存证据中最清楚的反向证据，是 Merama 起初所模仿的全球打法后来失灵。Merama 转向更少、更大的品牌和业务单元层面并购，削弱了这种类比，但并未消除一个根本风险：当资本、渠道费用或整合纪律恶化时，品牌
              roll-up 的经济性可能崩溃。
            calloutType: risk
