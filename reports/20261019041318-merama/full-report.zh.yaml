              Merama 的风险链条首先来自融资，而不是单纯的市场需求。公开报道显示，2021 年启动轮和 2025 年 4 月融资都包含债务成分；Contxto 还称，公司在 2024 年 4 月获得 J.P.
              Morgan 8,000 万美元额度后的一年内筹集了 2.5 亿美元债务。用于库存、品牌投入和补充并购时，这些债务可以提高产出；但同一批来源没有披露契约、抵押、到期时间或当前现金覆盖。Merama 还表示，从
              2025 年起将停止按全球口径报告增长，改为按品牌报告；这会在杠杆似乎上升之际进一步降低外部可见度。在尽调证明契约余量和再融资安排足够保守之前，投资人应把偿债灵活性视为可能击穿投资论点的变量，而不是脚注。
