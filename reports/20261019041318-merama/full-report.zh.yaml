      - number: '3.2'
        title: 定位与能力取舍
        blocks:
          - type: paragraph
            body: >-
              在留存的 2021-2025 年资料中，Merama 的公开差异化叙事异常一致：多数股权交易、创始人持续参与、营运资金、跨境扩张支持，以及覆盖 marketplace
              管理、物流和技术的运营支持。Balderton 明确表示，公司不同于许多 Amazon 聚合器，因为它购买的是股权而非整家公司；Bloomberg Línea
              也将同一模式描述为保留创始人并由专家主导。因此，竞争问题不在于 Merama 是否提供一揽子支持，而在于这套组合是否明显强于同行、投资人或内部团队仅靠资本就能复制的方案。
