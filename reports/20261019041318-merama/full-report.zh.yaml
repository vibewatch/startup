              2021 年，公开员工数和累计融资额在不同提供商之间存在冲突。实际上，只有当管理层证明 2025
              年资产负债表加固带来了持久的品牌级增长、干净的现金转化，以及相对于当前公开指标明显更有利的估值下仍有契约余量时，投资论点才会改善。
