  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Merama 从 2020 年成立走到 2021 年独角兽里程碑，随后进入 2024—2025 年债务支持下的优化阶段，组合也日益集中。
    data:
      items:
        - period: '2020'
          label: 成立
          detail: Merama 于 2020 年成立，并将总部设在墨西哥城。
          tone: positive
          claimRefs:
            - CO001
        - period: Apr 2021
          label: 种子轮 / A 轮组建融资
          detail: 公开融资报道称，该公司获得了由 Valor、Monashees 和 Balderton 牵头的 $60M 股权和 $100M 债务组合。
          tone: positive
          claimRefs:
