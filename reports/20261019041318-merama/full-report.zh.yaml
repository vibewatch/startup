      - number: '3.3'
        title: 护城河持久性与反向证据
        blocks:
          - type: paragraph
            body: >-
              留存证据中最强的反向证据来自行业，而非公司特有风险。Contxto 称，Merama 现在将自己描述为控股公司，而不是最初启动时的聚合器模式；该报道还把这一重新定位与 Thrasio
              式基准联系起来，而该品类龙头后来申请破产。Merama 的应对方式是提高集中度而非扩大范围：到 2025
              年，品牌数已从两打以上缩减至六个更大的平台。这可能减少整合扩张，但公开证据仍没有展示足以证明其支持体系难以复制的品牌级经济性。
