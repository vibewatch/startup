      - number: '1.2'
        title: 创始人、领导层与治理透明度
        blocks:
          - type: paragraph
            body: >-
              创始团队资料记录充分，这家区域性 roll-up 公司的运营背景也异常突出。公开来源持续提及 Sujay Tyle、Felipe Delgado、Olivier Scialom、Renato Andrade 和
              Guilherme Nosralla；他们分别来自 Frontier Car Group、Beetmann Energy、Petsy、McKinsey 和 Wildlife
              Studios。这些经历说明团队擅长跨境电商扩张、资本配置和增长。治理透明度则明显弱于创始人信息。Official Board 页面只展示两名董事姓名和一名高管离任信息；后来的第三方名录和访谈也无法清楚核对现任
              CEO。对尽调而言，关键人依赖仍集中在创始团队；但公开记录尚不足以充分证明董事会监督、决策权或继任规划。
            claimRefs:
              - CO004
              - CO007
              - CO015
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO015
      - number: '1.3'
        title: 融资历史与控制面
        blocks:
          - type: paragraph
            body: >-
              Merama 在 2021 年以异常快的速度完成融资：先完成一轮债股混合融资，随后完成大额 B 轮，又在 12 月追加融资，使公司在成立约一年内达到据报道的 $1.2b 估值。对当前尽调更重要的是 2024 和
              2025 年的融资模式：公司在 2024 年通过 J.P. Morgan 再融资，2025 年又推出一套融资方案，由老投资人提供新增股权，同时由 BTG Pactual、Citi 和 Itaú
              牵头更大规模的债务融资。这一组合说明贷款人和老金融投资人仍认为平台具备融资能力，但也意味着经济权利和治理边界已从风险投资持股扩展到债务契约、到期安排和潜在抵押条款，而这些内容在本次证据集内并未公开。
            claimRefs:
