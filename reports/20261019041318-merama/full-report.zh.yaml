      - number: '4.3'
        title: 资本充足性与投资判断
        blocks:
          - type: paragraph
            body: >-
              Merama 最近的融资历史说明外部资本仍是模式核心。最有代表性的当前数据点是 2025 年 4 月的 4,500 万美元股权加 1.7 亿美元循环信贷额度，此前公司在 2024 年 4 月从 J.P.
              Morgan 获得 8,000 万美元债务融资。管理层还向 Contxto 表示，仅过去一年就筹集了 2.5 亿美元债务；2025
              年新增资本主要投向营运资金和品牌定位，并继续在现有品类内寻找补充收购机会。这足以确认 Merama 仍依靠有资金支持的资产负债表容量来增长，但不足以有把握地评估下一轮融资或债务负担。本章结论因此是混合的：随着
              Merama 聚焦更少、更大的品牌，收入质量可能改善；但现金余额、现金跑道、契约条款、到期安排、毛利率结构和按品牌拆分的披露缺失，仍是实质性尽调阻碍。指定的一个新增资料页 URL
