      - number: '3.3'
        title: Moat durability and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The strongest adverse evidence in the retained pool is category-level, not company-specific. Contxto says
              Merama now describes itself as a holding company rather than the aggregator model it launched with, and it
              ties that repositioning to a Thrasio-like benchmark whose category leader later filed for bankruptcy.
              Merama's own response has been concentration rather than breadth: by 2025 it had narrowed from more than
              two dozen brands to six larger platforms. That may reduce integration sprawl, but public evidence still
              does not show the brand-level economics needed to prove that Merama's support stack is uniquely hard to
              copy.
            claimRefs:
              - CP008
