      - number: '6.3'
        title: Expansion logic is clear, but durability and concentration are still opaque
        blocks:
          - type: paragraph
            body: >-
              Merama's expansion loop is explicit: inject working capital, add central expertise in marketplace
              management, logistics, marketing, and technology, then scale each brand across channels and geographies.
              The 2025 financing announcement reinforced that logic by saying new capital would consolidate and expand
              leading direct-to-consumer brands while founders kept operational control. What remains materially
              under-disclosed is durability. Public sources reviewed do not publish NRR, GRR, churn, renewal rates,
              contract duration, or repeat-purchase cohorts for the brand portfolio, and they do not quantify
              concentration by brand, channel, or geography after the pivot to six brands. Contxto reported 30% sales
              growth in 2024, down from the prior year. The Official Board separately recorded the departure of Merama's
              vice president of international expansion in October 2023; that is a narrow historical execution signal,
              not evidence of customer churn. A third-party database also estimated only about 78 employees as of August
              2026, which may indicate a lean central layer but is not independently auditable from Merama's own
              disclosures.
            claimRefs:
              - CU008
              - CU009
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Narrower portfolio increases the credibility of active ownership
            body: >-
              The combination of founder-retained control, a six-brand focus, and the named Growth Supplements outcome
              suggests Merama is trying to operate as a concentrated holdco rather than a passive logo collector.
            calloutType: strength
            claimRefs:
              - CU002
              - CU006
              - CU010
              - CU011
          - type: callout
            title: Public durability evidence is still too thin for a hard adoption moat
            body: >-
              Merama has public proof of portfolio assembly and some growth anecdotes, but the source set still lacks
              retention cohorts, renewal rates, channel concentration, and independently sourced brand-by-brand outcome
              reporting.
            calloutType: risk
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Capital structure and financing flexibility
        blocks:
          - type: paragraph
            body: >-
              Merama's risk stack starts with financing rather than pure market demand. Public reporting shows a debt
              component in both its 2021 launch round and its April 2025 financing, with Contxto adding that the company
              raised $250 million of debt within one year after an $80 million J.P. Morgan facility in April 2024. That
              debt can be productive when used for inventory, brand investment, and tuck-in M&A, but the same sources do
              not disclose covenants, collateral, maturity timing, or current cash coverage. Merama also says that from
              2025 onward it will stop reporting growth on a global basis and instead report by brand, which reduces
              outside visibility just as leverage appears to be increasing. Until diligence proves that covenant
              headroom and refinancing are conservative, investors should treat debt-service flexibility as a
              thesis-break variable rather than a footnote.
            claimRefs:
              - CR002
              - CR003
              - CR009
              - CR013
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR011
              - CR013
      - number: '7.2'
        title: Portfolio concentration and execution dependence
        blocks:
          - type: paragraph
            body: >-
              Merama has shifted from breadth to concentration. Contxto says the company has focused on operational
              efficiency, moving from more than two dozen online retail brands to six, while also fully acquiring Growth
              Supplements, a business it says exceeds $400 million in annual sales. That shift can improve focus, but it
              also means a small number of platforms can now drive outsized performance, working-capital needs, and
              downside if one category stalls. The operating model still leaves brand founders or local teams running
              day-to-day businesses under Merama's majority-stake approach, so execution quality remains partly outside
              centralized control. The sector comparison is also sobering: Contxto explicitly ties Merama's starting
              model to Thrasio, which it says filed for bankruptcy in the United States, underscoring that roll-up
              economics can fail when leverage, integration, and inventory discipline slip.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR011
              - CR012
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR010
              - CR014
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR006
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.3'
        title: Legal, control-surface, and disclosure kill criteria
        blocks:
          - type: paragraph
            body: >-
              The legal and regulatory posture is less alarming than opaque. The assigned public evidence does not
              surface an active lawsuit, enforcement action, or disclosed privacy/security incident, but it also does
              not establish that those surfaces are clean. Tracxn links Merama to an active Brazilian holding entity and
              a deadpooled U.S. entity, while Bloomberg's older profile still described a portfolio spanning more than
              20 brands across six countries. That combination implies meaningful cross-border compliance, tax, and
              contractual complexity even before brand-level consumer, advertising, and product obligations are
              reviewed. The practical kill criteria are therefore monitorable: if diligence cannot reconcile the entity
              map, if lender documentation shows tight covenant headroom, or if brand-level reporting hides
              concentration or working-capital stress, the risk should be treated as structural rather than temporary.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR010
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
              - CR008
              - CR015
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Debt headroom is the clearest thesis-break trigger
            body: >-
              If the 2024-2025 debt stack carries tight covenants, near maturities, or collateral constraints, Merama's
              roll-up and working-capital model can flip from offensive to defensive quickly.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR013
              - CR015
          - type: callout
            title: Portfolio focus improves discipline but raises concentration
            body: >-
              The shift from more than two dozen brands to six may improve execution, yet it also means a weak quarter
              at one or two major brands can materially change consolidated performance and lender comfort.
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a TRACK recommendation rather than a buy call. Merama did complete a meaningful
              April 2025 recapitalization, with Tracxn listing $170 million of debt and $45 million of equity while
              Contxto reported that the financing kept the company above a $1 billion valuation. That is enough to show
              continued investor support, but not enough to justify underwriting a fresh entry on price because the
              exact 2025 post-money valuation, preference stack, and debt terms remain undisclosed. Public evidence is
              also stale on core operating proof: the clearest revenue mark still traces back to 2021, and public
              headcount and cumulative funding figures disagree across providers. In practice, the investment case
              improves only if management can prove that the 2025 balance-sheet reinforcement translated into durable
              brand-level growth, clean cash conversion, and covenant headroom at a valuation meaningfully better than
              the current public markers imply.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV009
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV007
              - CV010
              - CV013
      - number: '8.2'
        title: Financing context and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Merama's valuation story is inseparable from its financing structure. Public records agree that the
              company became a unicorn in 2021, but they diverge sharply on what happened afterward: Multiples reports
              $390 million raised across four rounds, Tracxn reports $430 million across eight rounds, SetterVC
              estimates $560 million across six rounds, and Contxto says more than $520 million across venture capital
              and debt. That inconsistency matters because the April 2025 package was not a simple clean up-round; it
              included another $170 million of debt after an $80 million J.P. Morgan financing in 2024. The anti-thesis
              is therefore not that Merama lacks scale, but that public evidence still cannot separate operating
              strength from capital support. Management's shift from a broad aggregator narrative toward a smaller
              portfolio of six core brands helps the story, yet it also reinforces that future returns depend on
              execution inside a concentrated set of assets rather than on limitless portfolio roll-up optionality.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV011
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
      - number: '8.3'
        title: Scenario framing and comparable discipline
        blocks:
          - type: paragraph
            body: >-
              The cleanest comparable anchor is not a precise revenue multiple but a scenario range tied to evidence
              quality. Public sources still point to the last explicit valuation mark of $1.2 billion in December 2021,
              while the 2025 round only confirms a value above $1 billion. Multiples still links the old 2021 mark to
              roughly $250 million of revenue, but that figure is historical and should not be treated as current
              run-rate proof. Meanwhile, Contxto reported 30 percent sales growth in 2024 and highlighted Growth
              Supplements as a more than $400 million annual-sales asset, which shows the portfolio still contains
              meaningful scale. The problem is comparability: Merama is neither a pure software platform nor a fully
              centralized Thrasio-style roll-up, because Bloomberg and SetterVC both describe majority-stake
              acquisitions with founders left in operating control. That structure justifies scenario underwriting, but
              not false precision on exit multiples or target returns without current brand-by-brand statements.
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV007
              - CV008
              - CV010
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV007
              - CV010
              - CV013
              - CV014
      - number: '8.4'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              To move from TRACK to invest, Merama needs to prove that the 2025 recapitalization reduced financing risk
              rather than merely extending it. The highest-priority requests are a current cap table that separates
              priced equity from debt and any preference terms, audited or lender-grade consolidated financials,
              brand-level revenue and margin bridges for the six current platforms, and the covenant package plus
              maturity profile on the BTG Pactual, Citi, Itau, and J.P. Morgan debt. A thesis break would be evidence
              that 2024's slower growth persisted into 2025 while debt service tightened strategic flexibility, or that
              reported scale rests disproportionately on one or two brands without repeatable portfolio economics. The
              upside case requires the opposite: brand-level growth durability, clean working-capital discipline, and a
              demonstrated path to value creation that does not rely on another opaque financing event.
            claimRefs:
              - CV005
              - CV007
              - CV009
              - CV010
              - CV012
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Current call
            body: >-
              Track, not buy: Merama may still compound value, but current public evidence does not support underwriting
              a fresh entry at an undisclosed 2025 price.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV004
              - CV013
          - type: callout
            title: Core underwriting risk
            body: >-
              The key risk is not that Merama lacks scale; it is that leverage and opaque current valuation terms make
              it hard to tell how much of the upside is already priced in.
            calloutType: risk
            claimRefs:
              - CV005
              - CV010
              - CV013
