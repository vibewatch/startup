  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      The public evidence narrows from a broad regional e-commerce TAM toward a much smaller, execution-heavy niche of
      founder-led brands that can absorb capital and channel expansion.
    data:
      items:
        - label: Regional e-commerce TAM
          value: US$67B
          detail: Broad 2021 Latin America e-commerce estimate from Balderton; this is the outer market, not Merama's SAM.
        - label: Regional growth rate
          value: 24% annual growth
          detail: Same Balderton lens ties the thesis to faster structural e-commerce adoption.
        - label: Penetration catch-up
          value: 9% LatAm vs 20% U.S.
          detail: Balderton's penetration gap explains upside; Redalyc later shows the region above 20% in 2023.
        - label: Core country concentration
          value: Brazil 41%, Mexico 24%, Argentina 13%
          detail: Redalyc shows three countries account for most regional e-commerce sales.
        - label: Marketplace infrastructure
          value: Mercado Libre 32%; Americanas 8%; Magazine Luiza 7%
          detail: Platform concentration shapes how brands are acquired, scaled, and de-risked.
        - label: Current investable niche
          value: Six core brands
          detail: Merama's 2025 posture is a narrower portfolio with expansion inside selected verticals such as supplements.
    approximationNotes: >-
      This pyramid is a synthesis of different public lenses rather than a mathematically nested TAM/SAM/SOM bridge;
      each layer preserves the original metric and time basis instead of inventing a single converted denominator.
    claimRefs:
      - CM004
      - CM005
      - CM006
      - CM007
      - CM010
      - CM011
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal map of founder control retained versus operating-support breadth across Merama and the main alternatives
      visible in the retained pool.
    xAxis:
      label: Founder control retained
      min: 1
      max: 5
      low: Buyer-controlled
      high: Founder-retained
      description: Ordinal synthesis from disclosed deal structure
      scale: ordinal
    yAxis:
      label: Operating support breadth
      min: 1
      max: 5
      low: Capital only / self-build
      high: Capital plus marketplace, logistics, and tech support
      description: Ordinal synthesis from source-described services
      scale: ordinal
    data:
      points:
        - label: Merama (2025 model)
          x: 4
          'y': 5
          note: Majority-stake structure with founder continuity and broad operating support.
        - label: Valoreo
          x: 2
          'y': 3
          note: >-
            Disclosed as an FBA-focused acquisition vehicle; founder-retention detail is not public in the retained
            pool.
        - label: Bamboo / JUGGERNAUT
          x: 2
          'y': 3
          note: Lightly disclosed peer set named by a review source, with sparse public operating detail.
        - label: Thrasio-style roll-up
          x: 1
          'y': 3
          note: >-
            Useful benchmark for scale-through-acquisition, but the retained pool uses it mainly as a cautionary
            comparator.
        - label: PE / strategic buyer
          x: 1
          'y': 2
          note: Can provide liquidity or capital, but retained evidence suggests less DTC-specialized operating support.
        - label: Internal build / stay independent
          x: 5
          'y': 1
          note: Highest control retention, but the brand must self-fund logistics, tooling, and expansion.
    approximationNotes: >-
      Coordinates are analyst-assigned 1-5 ordinal scores from disclosed control and support descriptions, not
      company-reported metrics, market-share data, or independently benchmarked outcomes.
    claimRefs:
      - CP002
      - CP003
      - CP004
      - CP006
      - CP010
      - CP011
      - CP012
      - CP013
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public sources describe a flow from brand acquisition and funding support into brand sales, but stop short of
      disclosing the gross-margin and cash-conversion steps that would complete an underwriting model.
    data:
      nodes:
        - label: Source brands
          detail: Merama identifies leading e-commerce brands and acquires majority stakes.
        - label: Founder-operated portfolio
          detail: Founders continue running the businesses while retaining operational control.
        - label: Capital injection
          detail: Equity and debt proceeds are deployed into working capital, inventory, and selective acquisitions.
        - label: Shared operating support
          detail: >-
            Marketplace, logistics, marketing, manufacturing, and technology capabilities are centralized support
            levers.
        - label: Portfolio sales
          detail: Public evidence shows 2024 sales growth, but not a current consolidated revenue bridge by brand.
        - label: Gross profit and cash generation
          detail: Margin, cash conversion, and covenant headroom remain undisclosed in public evidence.
      edges:
        - from: Source brands
          to: Founder-operated portfolio
          label: Majority-stake partnership
        - from: Founder-operated portfolio
          to: Capital injection
          label: Equity plus debt funding
        - from: Capital injection
          to: Shared operating support
          label: Working capital and capability build
        - from: Shared operating support
          to: Portfolio sales
          label: Channel, logistics, and tech scaling
        - from: Portfolio sales
          to: Gross profit and cash generation
          label: Economics not fully disclosed
    approximationNotes: >-
      Relationship flow is source-backed, but no public source provides a quantified bridge from gross merchandise
      demand to revenue, gross profit, and free cash flow.
    claimRefs:
      - CI001
      - CI004
      - CI008
      - CI009
      - CI010
      - CI011
      - CI012
      - CI014
  - id: FE001
    title: Public operating stack disclosed across brands, channels, and shared services
    type: stack
    summary: >-
      The visible product stack runs from marketplace demand capture through brand platforms into shared services and
      lightly documented internal tooling.
    data:
      layers:
        - label: Demand channels
          detail: Customer demand enters through large marketplaces and cross-border online channels.
          modules:
            - Mercado Libre
            - Amazon
            - Shopee
          outputs:
            - Traffic and transactions for partner brands
        - label: Brand platforms
          detail: Merama concentrates capital and operators into a smaller set of branded business units.
          modules:
            - Growth Supplements
            - Mercadazo
            - Oceane
            - Other home, kitchen, furniture, and baby brands
          outputs:
            - Category-specific product assortment
            - Brand-level expansion platforms
        - label: Category playbooks
          detail: Each focus category can receive its own operating plan instead of one uniform aggregator workflow.
          modules:
            - Sports nutrition
            - Beauty
            - Furniture / home / baby
          outputs:
            - Brand-specific merchandising and expansion plans
        - label: Shared operating services
          detail: Centralized capabilities are meant to raise execution quality across portfolio brands.
          modules:
            - Marketplace management
            - Digital marketing
            - Supply chain and logistics
            - Inventory and working-capital support
          outputs:
            - International expansion
            - Brand growth services
        - label: Capital and governance
          detail: Majority ownership and working-capital support are part of the operating stack, not just financing.
          modules:
            - Majority-stake structures
            - Working-capital facilities
            - Board and operating oversight
          outputs:
            - Founder continuity with tighter portfolio control
        - label: Internal platform
          detail: Internal tooling and Merama Labs are the least documented but most important leverage layer.
          modules:
            - Automation tools
            - Merama Labs
            - In-category M&A playbooks
          outputs:
            - Process automation
            - New brand incubation
    approximationNotes: Layer boundaries reflect the public evidence set rather than an internal architecture diagram.
    claimRefs:
      - CE003
      - CE006
      - CE010
      - CE012
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Merama's customer journey runs from brand sourcing and investment through centralized scaling support and a later
      optional founder exit.
    data:
      items:
        - label: Source profitable founder-led brand
          actor: Merama deal team and brand founders
          phase: Entry
          touchpoints:
            - Brand selection
            - Majority-stake discussion
            - Governance retention
        - label: Make initial investment
          actor: Merama plus founder-operators
          phase: Transaction
          touchpoints:
            - Cash-out on sold shares
            - Working-capital infusion
        - label: Keep founders operating the business
          actor: Brand management team
          phase: Stabilization
          touchpoints:
            - Day-to-day operations stay local
            - Merama avoids full absorption
        - label: Apply centralized growth levers
          actor: Merama operating specialists
          phase: Enablement
          touchpoints:
            - Marketing and BI
            - Pricing and demand planning
            - Logistics and platform support
        - label: Expand channels and geographies
          actor: Brand teams plus Merama
          phase: Scaling
          touchpoints:
            - Cross-border expansion
            - New products and categories
            - Marketplace optimization
        - label: Create a later exit option
          actor: Founders and Merama
          phase: Monetization
          touchpoints:
            - 3-5 year horizon on official site
            - Value capture after brand growth
    approximationNotes: >-
      This is a qualitative operating sequence synthesized from official and reported descriptions; public sources do
      not provide stage conversion rates or per-brand time-to-expansion data.
    claimRefs:
      - CU002
      - CU008
      - CU009
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Highest residual exposure clusters around financing opacity, brand concentration, and dependence on external
      operators and capital.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
      rows:
        - label: Debt and covenant opacity
          note: Public sources identify lenders and debt amounts, but not covenant headroom or maturities.
          values:
            - High
            - High
            - Low
        - label: Brand concentration after portfolio narrowing
          note: Merama now focuses on six brands, making brand-level underperformance more consequential.
          values:
            - High
            - High
            - Medium
        - label: Founder / operator dependency
          note: Majority stakes do not eliminate dependence on local operators who continue running the businesses.
          values:
            - Medium
            - High
            - Medium
        - label: Legal and control-surface opacity
          note: Assigned public evidence does not establish litigation, enforcement, or privacy/security posture cleanly.
          values:
            - Medium
            - Medium
            - Low
        - label: Disclosure fragmentation by brand
          note: Management says growth will no longer be reported globally from 2025 onward.
          values:
            - High
            - Medium
            - Low
        - label: Leadership and expansion continuity
          note: Public evidence includes at least one recorded international-expansion executive departure.
          values:
            - Medium
            - Medium
            - Unknown
    approximationNotes: >-
      Qualitative cells summarize the chapter's source-backed ranking and should be updated once debt documents and
      brand-level reporting are reviewed.
    claimRefs:
      - CR003
      - CR006
      - CR013
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Track the company until operating proof, capital structure, and price visibility align.
    data:
      nodes:
        - label: 2025 recapitalization happened
          detail: Public sources show $45M equity plus $170M debt in April 2025.
        - label: Scale evidence remains real
          detail: 2024 sales reportedly grew 30%, and Growth Supplements was described above $400M in annual sales.
        - label: Data room is still inconsistent
          detail: Public funding, revenue, and headcount figures conflict across third-party sources.
        - label: Debt overhang still matters
          detail: The company added 2025 debt after an $80M 2024 J.P. Morgan facility.
        - label: Exact price is under-supported
          detail: The latest exact public valuation mark remains the 2021 $1.2B round, while 2025 is only 'above $1B'.
        - label: Recommendation stays track
          detail: Upgrade only after exact valuation, cap-table, and brand-level financial proof are disclosed.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV007
      - CV010
      - CV013
