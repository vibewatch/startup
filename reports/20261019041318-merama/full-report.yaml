      - number: '3.2'
        title: Positioning and capability tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Merama's public differentiation story is unusually consistent across the retained 2021-2025 sources:
              majority-stake deals, founder continuity, working capital, cross-border expansion help, and operating
              support spanning marketplace management, logistics, and technology. Balderton explicitly framed the
              company as different from many Amazon aggregators because it buys stakes rather than whole companies, and
              Bloomberg Línea described the same model as founder-retentive and expert-led. The competitive question is
              therefore not whether Merama offers a bundle of support, but whether that bundle is materially stronger
              than what a peer, sponsor, or an internally built team can reproduce.
