              - CI012
              - CI014
      - number: '4.2'
        title: Pricing, cost structure, and unit-economics visibility
        blocks:
          - type: paragraph
            body: >-
              The public record is clearer on mechanism than on realized economics. Merama appears to monetize through
              ownership economics inside acquired brands, not through a standard public price card, so list pricing is
              effectively unavailable. Recent capital-use disclosures point to the key cost drivers: working capital for
              inventory, marketing and brand positioning, manufacturing and logistics capacity, and continuing M&A
              inside existing business units. Those uses imply a balance sheet with inventory and supply-chain exposure,
              which is a very different risk profile from an asset-light marketplace or SaaS roll-up. What remains
              missing are the metrics that would let an investor test whether the model compounds: current gross margin,
              contribution margin, customer-acquisition cost, payback, retention, return by brand, and the realized cost
              of internal financing or transfer pricing across the portfolio. The most bullish margin statement in the
              assigned evidence comes from Balderton's 2021 write-up, which is directionally useful but stale and
              partner-authored.
            claimRefs:
              - CI001
              - CI003
              - CI008
              - CI010
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI004
              - CI005
              - CI010
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI009
              - CI011
              - CI013
              - CI014
      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Merama's recent financing history shows that external capital remains central to the model. The strongest
              current datapoint is the April 2025 package of $45 million in equity plus a $170 million revolving credit
              line, following an $80 million debt financing from J.P. Morgan in April 2024. Management also told Contxto
              that the last year alone included $250 million of debt raising, while new 2025 capital would be directed
              primarily into working capital and brand positioning, with further tuck-in acquisitions pursued inside
              existing categories. That is enough to conclude that Merama still relies on funded balance-sheet capacity
              to grow, but not enough to underwrite the next round or debt load confidently. The chapter's verdict is
              therefore mixed: revenue quality may be improving as Merama concentrates on fewer, larger brands, yet the
              missing cash balance, runway, covenant package, maturity schedule, gross margin profile, and brand-level
              disclosure remain material diligence blockers. One assigned net-new profile URL also returned unrelated
              content, so none of its valuation or financing search snippets are used as evidence.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI008
              - CI009
              - CI011
              - CI012
              - CI014
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Merama sells capital plus operating leverage into brand workflows
        blocks:
          - type: paragraph
            body: >-
              Merama is presented across company-issued and independent coverage as a buyer or lead partner for
              digital-native consumer brands that want scale without a full founder exit. The recurring workflow is
              consistent: Merama acquires a majority or controlling stake, keeps the brand operators in place, and
              layers in working capital, e-commerce specialists, marketplace management, and automation tooling. That
              makes the delivered product closer to a shared operating platform for portfolio brands than to a
              consumer-facing software SKU. The clearest proof is still commercial and structural, not technical: more
              than 20 brands were disclosed by late 2021, and the public channel story remains anchored in Mercado
              Libre, Amazon, Shopee, and cross-border growth rather than in a separately disclosed software product.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE010
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE005
              - CE010
              - CE012
      - number: '5.2'
        title: The public architecture is layered, but the software layer is lightly documented
        blocks:
          - type: paragraph
            body: >-
              The retained sources do outline a usable architecture. Merama appears to combine brand ownership or
              control, commercial execution on major marketplaces, shared enablement in marketing and supply chain, and
              an internal tooling layer meant to automate repetitive processes and improve capital efficiency. Merama
              Labs adds a disclosed incubation or product-creation layer for selected categories such as supplement,
              beauty, and fashion brands. What is missing is as important as what is visible: none of the retained
              public sources document APIs, implementation patterns, reliability metrics, customer support SLAs, or a
              named security/compliance framework for the internal platform. That leaves the technology story credible
              at the category level but thin at the implementation level.
            claimRefs:
              - CE003
              - CE010
              - CE011
              - CE012
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE010
              - CE011
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE003
              - CE006
              - CE010
              - CE012
      - number: '5.3'
        title: Maturity has shifted from broad aggregation to fewer, larger brand platforms
        blocks:
          - type: paragraph
            body: >-
              The 2025 evidence materially updates product maturity. Management told Contxto that Merama moved away from
              a centralized aggregator model toward a more independent holding structure and reduced its focus from more
              than two dozen brands to six bigger platforms. That shift narrows execution onto fewer brands and suggests
              a more deliberate operating-model design, including category-specific investments such as the full
              acquisition of Growth Supplements and continued M&A within existing business units. The tradeoff is
              concentration: public proof now points to deeper execution in selected assets, but it also implies that
              portfolio performance depends more heavily on a smaller set of brands and on Merama's ability to
              standardize shared services across them.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE014
      - number: '5.4'
        title: Controls, reliability, and developer proof remain open diligence items
        blocks:
          - type: paragraph
            body: >-
              For diligence purposes, the biggest technology risk is not that Merama lacks an operating stack; it is
              that the stack is described almost entirely through fundraising and profile coverage rather than through
              technical or trust artifacts. Public sources support claims about marketplace know-how, logistics, supply
              chain, and automation, but they do not expose code repositories, package telemetry, certifications, uptime
              history, privacy controls, or a status page. That is manageable for a holding-company model, yet it
              meaningfully limits underwriting of software defensibility, security posture, integration complexity, and
              incident readiness without direct diligence from management and operating teams.
            claimRefs:
              - CE011
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Brand partners are the core counterparties
        blocks:
          - type: paragraph
            body: >-
              Merama positions itself as a strategic partner to ecommerce brands, not as a software vendor or retail
              marketplace. Its own site says it invests directly into partner companies, seeks a substantial stake
              rather than full ownership, and leaves governance plus day-to-day operating control with founders.
              Third-party descriptions are broadly consistent: Merama is repeatedly described as targeting founder-led,
              profitable direct-to- consumer brands that already have meaningful online traction and need capital,
              operating expertise, and technology support to scale across Latin America and into the U.S. This means
              buyer, user, and payer are typically brand founders and operating teams, while the economic thesis depends
              on how much incremental growth Merama can drive after taking ownership.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU007
              - CU008
      - number: '6.2'
        title: Public adoption proof shows a narrower but more explicit portfolio
        blocks:
          - type: paragraph
            body: >-
              The clearest adoption evidence is not end-customer demand data but public proof that Merama has assembled
              and kept operating a real portfolio of brands. Bloomberg Línea reported in early 2022 that Merama already
              had more than 20 brands across six geographies. By April 2025, Contxto said the company had moved from
              more than two dozen online retail brands to a six-brand structure focused on larger assets, while Growth
              Engineer also described a curated portfolio of six major brands. Contxto named Growth Supplements,
              Mercadazo, and Oceane as current portfolio companies and described Growth Supplements as a long-running
              alliance that Merama fully acquired after claiming more than 10x growth during the relationship. That is
              stronger than logo-only evidence, but it still falls short of a broad set of independently verified
              customer case studies.
            claimRefs:
              - CU005
