              - CP010
              - CP011
              - CP014
              - CP015
      - number: '3.4'
        title: Diligence implications
        blocks:
          - type: paragraph
            body: >-
              The current evidence supports treating Merama as a more curated holding-company operator than a pure
              Thrasio-style roll-up, but not yet as a clearly durable moat. The direct peer set in public sources is
              thin, Merama's negotiated economics are private, and even the alternatives named in review-style sources
              lack independent operating disclosure in the retained pool. For underwriting, the key question is whether
              Merama's founder-friendly control model and operating services translate into repeatable post-acquisition
              performance that substitutes and peers cannot match with capital alone.
            claimRefs:
              - CP006
              - CP010
              - CP011
              - CP013
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thrasio is a warning, not a verdict
            body: >-
              The clearest adverse signal in the retained pool is the failure of the global playbook Merama originally
              resembled. Merama's move toward fewer, larger brands and business-unit-level M&A reduces that analogy, but
              it does not remove the underlying risk that brand roll-up economics break when capital, channel fees, or
              integration discipline deteriorate.
            calloutType: risk
            claimRefs:
              - CP008
              - CP009
              - CP014
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Merama's monetization model is not a posted software or service fee. The assigned sources consistently
              describe a structure in which Merama acquires majority stakes in consumer brands, leaves founders running
              those businesses, and adds working capital, marketplace know-how, logistics support, and technology
              tooling to expand them. That means economic performance should be judged through portfolio-brand revenue
              growth, gross profit, and cash conversion rather than SaaS metrics like ARR. Public traction evidence is
              limited but not nonexistent: investor Balderton described a highly profitable early-2021 operating
              profile, and Contxto reported 30% sales growth in 2024 after the portfolio had been narrowed to six
              brands. The quality of that traction evidence is uneven because the company is no longer reporting
              aggregate growth publicly from 2025 onward and none of the assigned sources provide a consolidated audited
              revenue bridge by brand or channel.
            claimRefs:
              - CI001
              - CI002
              - CI007
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
