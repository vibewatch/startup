  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what sits outside it
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not all Latin American retail and not even all regional e-commerce. Merama's model
              starts with founder-led consumer brands that already sell successfully through marketplaces such as
              Mercado Libre and Amazon, then adds majority-capital ownership, working capital, operating help, and
              cross-border scaling support. That makes the practical "buyer" in this chapter the founder or controlling
              operator deciding whether to sell a majority stake, while the end consumer remains downstream at the
              portfolio-brand level. The main substitutes are staying independent, raising conventional debt or venture
              capital without an operator, or selling to a traditional private-equity or strategic buyer that does not
              keep founders as day-to-day operators. This boundary matters because a broad regional e-commerce TAM can
              overstate the spend Merama can actually access.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
      - number: '2.2'
        title: Public sizing lenses are broad, not Merama-specific
        blocks:
          - type: paragraph
            body: >-
              The best public demand lenses are still top-down. Balderton framed Latin American e-commerce at US$67
              billion with 24% annual growth and lower online penetration than the U.S., while the academic case study
              shows penetration rising from roughly 10% in 2019 to above 20% in 2023. Redalyc also shows that demand is
              concentrated: Brazil and Mexico dominate regional sales, and Mercado Libre remains the key marketplace
              rail. Those facts support a large and still maturing outer market, but they do not isolate how much of
              that spend belongs to profitable, founder-led brands in categories Merama still wants to own. The only
              more specific public lens in this pool is category-level demand such as Mexico's 15-million-consumer
              dietary supplements market, which is still only a partial proxy for Merama's current acquisition funnel.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM010
              - CM011
      - number: '2.3'
        title: Adoption drivers and constraints sit in operations, not just demand
        blocks:
          - type: paragraph
            body: >-
              Merama's proposition is attractive when a brand has product-market fit but is still constrained by
              inventory financing, logistics, marketplace know-how, and expansion into owned channels or new
              geographies. The same evidence also shows why this is not a frictionless roll-up market: marketplace fees
              and storage costs can compress margins, logistics remains a regional bottleneck, and the collapse of
              Thrasio-style aggregators in the U.S. turned operational discipline into a first-order screen. Merama's
              own 2025 positioning reflects that reset, emphasizing six larger platforms, operational efficiency, and
              brand-level M&A inside existing verticals rather than unconstrained category expansion. For valuation,
              that means execution quality and channel economics matter more than a generic statement that the regional
              market is "large."
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM009
              - CM010
              - CM011
              - CM013
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public sizing is still one layer too broad for valuation work
            body: >-
              The evidence is strong enough to show a large and still-maturing regional e-commerce backdrop, but it does
              not disclose how many acquisition-ready brands exist inside Merama's present six-brand focus or what the
              current channel economics look like by brand.
            calloutType: risk
            claimRefs:
