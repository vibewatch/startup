  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape of alternatives
        blocks:
          - type: paragraph
            body: >-
              The retained pool supports a wider competitive set than a simple list of aggregator logos. Merama started
              as an e-seller aggregator for marketplace-native brands, so the next-best option for a founder can be
              another aggregator, a corporate buyer, a private-equity sponsor, or remaining independent while continuing
              to sell through Amazon and Mercado Libre. The clearest disclosed regional like-for-like peer in the
              retained pool is Valoreo, while Bamboo and JUGGERNAUT appear only as lightly described alternatives. That
              makes the practical buyer comparison less about market share and more about control, capital, and
              operating help.
