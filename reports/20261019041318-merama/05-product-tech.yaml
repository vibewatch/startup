      - ["Build or incubate category-specific brands", "Selected categories need internal tooling and tighter portfolio leverage", "Merama Labs and brand-platform investments support automation and brand creation within chosen sectors", "Fresh capital in 2021-2022 was tied to launching or strengthening this layer", "No public module list or evidence of software usage by brand operators"]
    notes: "Benefits reflect disclosed portfolio and operating claims, not audited performance; missing quantitative proof remains in the limitation column."
    claimRefs: ["CE003", "CE005", "CE010", "CE012"]
  - id: "TE003"
    title: "Technology / operating architecture table"
    columns:
      - "Layer / process / component"
      - "Role"
      - "Dependency"
      - "Risk"
    rows:
      - ["Capital and governance layer", "Acquire majority stakes, fund working capital, and shape portfolio strategy", "Continued access to equity, debt, and operator trust", "Capital intensity and financing dependency can constrain product investment cadence"]
      - ["Commercial execution layer", "Run marketplace growth, marketing, and international expansion for brands", "Platform relationships with Mercado Libre, Amazon, Shopee, and cross-border logistics", "Marketplace concentration and changing channel economics can compress outcomes"]
      - ["Shared enablement layer", "Provide logistics, supply chain, inventory management, and brand growth services", "Operational talent, third-party providers, and cross-country coordination", "Service quality can vary across brands without public SLA or process transparency"]
      - ["Internal tooling / automation layer", "Automate processes and support Merama Labs / internal infrastructure", "Internal product build quality and brand adoption", "No public documentation, reliability metrics, or control-framework evidence"]
    notes: "This is an inferred public-architecture view synthesized from retained sources; it should be validated against management's internal org and systems map."
    claimRefs: ["CE003", "CE010", "CE011", "CE014"]
