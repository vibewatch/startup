- id: capability-pricing
  title: Capability and Pricing Comparison
  body: 'On capability, Stardust''s strongest card is manipulation: its S1 demonstrated end-effector speeds
    up to about 10 m/s with roughly 0.1 mm repeatability, among the fastest publicly shown, and its ''Design-for-AI''
    full-stack pairs an AI model and embodied OS with a rope/tendon-driven body. Most rivals rely on conventional
    motor or harmonic-drive joints, so the actuation approach is a genuine technical differentiator. On
    price, the T1 at RMB89,900 sits in the affordable tier alongside Unitree''s ~$16,000 G1, well below
    US units like 1X''s ~$20,000 Neo and enterprise-only offerings from UBTech, Apptronik, and Fourier
    whose pricing is undisclosed. Enterprise buyers weigh dexterity, autonomy, price, reliability, and
    deployment support; Stardust scores well on the first three but is unproven on reliability at scale,
    where Unitree and AgiBot lead on mass-production maturity. The capability matrix therefore shows Stardust
    strong in narrow dimensions but behind incumbents on production and brand.'
