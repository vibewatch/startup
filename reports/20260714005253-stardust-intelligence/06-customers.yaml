- id: adoption-proof
  title: Adoption Trajectory and Named Proof
  body: 'Adoption has progressed from visibility to orders to launch. The S1''s WRC 2024 debut generated
    global interest; in September 2025 SEER (Xiangong) placed what is reported as China''s first thousand-unit-scale
    humanoid order, a landmark industrial demand signal; at CHTF in November 2025 Stardust secured additional
    orders and a developer-platform MOU involving Baidu and Jishu Diedai; and in May 2026 the T1 launched
    at RMB89,900. The strongest named proof is therefore the SEER order, supplemented by the Kede Education
    channel and the CHTF partnerships. However, the reference quality of these proofs is moderate: they
    are press-reported orders and MOUs rather than independently verified production deployments with
    quantified outcomes. Named end-user identities, production-versus-pilot status, and measurable results
    (productivity, cost savings) behind the headline order figures are largely undisclosed. Prudent diligence
    treats the thousand-unit figure as a bookings signal pending delivery and acceptance, and seeks evidence
    of how much of the reported demand has converted into deployed, revenue-generating units.'
  claimRefs:
  - CU002
  - CU003
  - CU004
  - CU005
  - CU007
  - CU015
  - CU017
  - CU018
  - CU025
  - CU030
