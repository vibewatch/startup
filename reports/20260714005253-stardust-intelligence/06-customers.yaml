- id: customer-verdict
  title: Customer Verdict
  body: The customer verdict is that Stardust has generated genuinely strong early demand signals but
    has thin evidence of durable, productive adoption. On the positive side, the SEER thousand-unit order
    is a real, first-of-its-kind industrial milestone, multi-city deployment shows operational breadth,
    and the education and developer channels provide diversification options within a supportive, policy-backed
    Chinese demand environment. On the cautious side, named production deployments, retention, repeat
    purchase, and quantified customer outcomes are all undisclosed; demand is concentrated in a few marquee
    deals and partner channels; and the critical pilot-to-production conversion is unproven. Customer
    evidence is fresh - current to late-2025 and mid-2026 - but describes bookings and announcements more
    than delivered, sustained value. Diligence should prioritize verifying delivered units against order
    headlines, obtaining named-customer references and outcome data, assessing pipeline and channel diversification,
    and securing any available cohort or repeat-order evidence before crediting the traction narrative
    in full.
  claimRefs:
  - CU008
  - CU024
  - CU026
  - CU027
  - CU031
  - CU032
