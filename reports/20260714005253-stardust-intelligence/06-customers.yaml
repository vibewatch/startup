  - FU003
- id: retention-expansion
  title: Retention, Expansion, and Concentration
  body: 'Evidence on durability is the weakest part of the customer picture. No public retention, repeat-purchase,
    churn, utilization, or satisfaction metrics exist - unsurprising for a young private hardware company,
    but a material gap nonetheless. Repeat and expansion orders beyond the initial announcements are not
    yet documented, so land-and-expand potential remains a hypothesis: it exists if pilots convert to
    multi-site production, but conversion evidence is pending. Meanwhile, concentration risk is real.
    A small number of marquee orders, above all SEER, dominate visible demand, making early revenue lumpy
    and dependent on individual deals converting and delivering. Go-to-market also concentrates on partner
    channels - the SEER distributor relationship and the Kede education channel - adding channel dependence,
    while the developer MOUs are non-binding and their uptake is unproven. The key unproven step across
    the whole base is the adoption-funnel conversion from showcase interest and pilots to sustained, repeat
    production deployments, precisely where sector analysts warn that humanoid orders can outrun demonstrated
    ROI.'
  claimRefs:
  - CU009
  - CU010
  - CU016
  - CU021
  - CU022
  - CU023
  - CU028
  - CU034
  - CU036
