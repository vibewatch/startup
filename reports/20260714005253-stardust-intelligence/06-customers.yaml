company:
  name: Stardust Intelligence
chapter:
  number: 6
  title: Customers
  summary: Stardust Intelligence's customer base spans industrial, retail/commercial, and education buyers
    across roughly six Chinese cities, with demand signaled through large multi-unit orders rather than
    disclosed account counts or revenue. Its highest-profile proof is a first-of-its-kind thousand-unit
    industrial humanoid order from SEER (Xiangong) in September 2025, complemented by orders and a developer-platform
    MOU secured at CHTF in November 2025 and an education channel via Kede Education. These are strong
    early demand signals, but named production deployments, retention, repeat purchase, and end-user outcomes
    are largely undisclosed, and sector analysts caution that humanoid orders often outrun proven, sustained
    commercial ROI.
sections:
- id: segmentation
  title: Customer Base and Segmentation
  body: Stardust's customers cluster in three primary segments plus research and developer channels. Industrial
    and logistics buyers - exemplified by SEER - purchase for material handling and repetitive tasks,
    funded by corporate capex, and represent the most concrete, largest-scale demand to date. Retail and
    commercial buyers deploy T1 units for customer-facing service across multiple cities, though named
    accounts are limited and reported at the scenario level. Education and vocational buyers acquire training
    units through the Kede Education channel, drawing on institutional or state budgets for recurring
    but modest per-unit demand, while research buyers purchase the S1 as a manipulation testbed. A fifth,
    nascent channel is developers and integrators reached via the CHTF developer-platform MOU. Across
    segments, buyer, user, and payer frequently differ - a school's procurement office, its students,
    and a state budget, for instance - which lengthens sales cycles. Government and municipal programs
    in Wuxi and Shenzhen further shape the pipeline through scenario funding. The company reports deployment
    across roughly six Chinese cities, indicating operational breadth even where per-site depth is unclear.
  claimRefs:
  - CU001
  - CU006
