company:
  name: Stardust Intelligence
chapter:
  number: 7
  title: Risks
  summary: Stardust Intelligence carries a very high, front-loaded risk profile. The most severe risks
    are technology reliability (unproven rope/cable-driven actuators at commercial scale), financial opacity
    and capital intensity (undisclosed revenue and margins against an aggressive RMB89,900 price amid
    sector-wide bubble warnings), and regulatory/geopolitical exposure (emerging China HEIS 2026 safety
    standards plus escalating US legislative efforts to restrict or ban Chinese humanoid robots). Operational
    scale-up, customer concentration in a few marquee orders, partner-channel dependence, and key-person
    reliance on founder Lai Jie compound these. Mitigations are early-stage, so residual exposure across
    most categories remains material to critical.
sections:
- id: regulatory-legal
  title: Regulatory, Legal, and Geopolitical Risk
  body: 'Regulatory and legal exposure is a top-tier risk with a distinctive geopolitical edge. Domestically,
    China released the world-first HEIS 2026 national standards for humanoid robots and embodied AI, which
    legitimize the sector but impose certification effort and compliance cost during scale-up; China''s
    Civil Code creates product-liability exposure for defective robots, partly mitigated by Shenzhen''s
    new embodied-AI liability insurance; and an evolving AI-governance regime, including a draft AI law,
    may add future obligations. The sharper risk is external: US lawmakers introduced legislation - a
    House Select Committee bill and the American Security Robotics Act - to ban or restrict government
    purchases of Chinese humanoid robots, and the proposed GUARD Act would extend the FCC covered-list
    framework to robotics. These measures reflect rising strategic-security scrutiny of Chinese robots
    and could cap Stardust''s international expansion, narrowing its addressable market. Standards fragmentation
    between China and international regimes could further raise export-compliance friction. The assessment
    is current to mid-2026 and reflects the latest standards and legislative activity.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR015
  - CR016
  - CR017
  - CR023
  - CR024
