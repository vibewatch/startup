- id: operational-quality
  title: Operational, Quality, and Safety Risk
  body: Operational risk centers on the very technology that differentiates Stardust. Rope/cable-driven
    actuator reliability at sustained commercial scale is unproven and is the single most material technology
    risk; cable wear and complex tendon routing are recognized engineering challenges that could raise
    maintenance and failure rates, and no public MTBF or field-failure data exists. Manufacturing scale-up
    at the new Wuxi facility carries execution, yield, and working-capital risk, compounded by reliance
    on a single flagship facility for continuity. Human-robot-interaction safety - collision and force
    risks in public and commercial settings - requires robust controls, partly aided by the lower inertia
    of compliant rope-driven limbs but unsupported by published safety-test data. Quality and certification
    evidence is also undisclosed. Ranked by severity, actuator failure at scale (critical impact, low
    mitigation maturity) and a Wuxi ramp shortfall (high impact) are the leading operational exposures,
    both with immature mitigations and material-to-high residual risk.
  claimRefs:
  - CR004
  - CR005
  - CR012
  - CR018
  - CR033
  tableRefs:
  - TR002
  figureRefs:
  - FR001
- id: financial-partner-people
  title: Financial, Partner, and People Risk
  body: 'Financial-model risk is high. Undisclosed revenue and margins against a sub-RMB90,000 price point
    imply potentially thin or negative unit economics, while sector-wide bubble and overcapacity warnings
    - with investors explicitly flagging humanoid robotics as a possible next AI bubble - threaten future
    capital access and could trigger margin-compressing price wars. Partner and dependency risk is concentrated:
    a few marquee orders, above all SEER, dominate visible demand; go-to-market leans on partner channels
    (SEER, Kede Education); AI-compute and chip supply is exposed to export restrictions; and strategic-investor
    reliance on Thundersoft adds continuity risk. People and execution risk includes founder key-person
    concentration around Lai Jie, whose robotics vision and Tencent-derived credibility anchor the company,
    thinly documented technical-team credentials, and unproven mass-manufacturing execution - with little
    public evidence of bench-depth or succession mitigation. Across these categories, risks transmit into
    the thesis through weak revenue, compressed margins, constrained financing, and ultimately valuation
    multiple compression.'
  claimRefs:
  - CR007
  - CR008
  - CR009
  - CR010
  - CR011
  - CR013
