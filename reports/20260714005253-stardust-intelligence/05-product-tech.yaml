company:
  name: Stardust Intelligence
chapter:
  number: 5
  title: Product & Technology
  summary: 'Stardust Intelligence builds general-purpose humanoid robots on a self-described ''Design-for-AI''
    (DFAI) full stack: an AI model layer, an embodied operating system (DuoCore), and a distinctive rope/cable-driven
    (tendon-driven) hardware body. Its flagship S1 dual-arm system, which debuted at WRC 2024, demonstrated
    end-effector speeds up to ~10 m/s with ~0.1 mm repeatability, while the T1 humanoid (launched May
    2026 at RMB89,900) brings 23 degrees of freedom and multi-scenario capability to a mass-market price.
    The rope-driven actuation is the core technical differentiator - moving motors into the torso and
    transmitting force via cables for lighter, faster, more compliant limbs - but its long-term reliability
    at commercial scale is unproven and represents the central technology risk.'
sections:
- id: product-definition
  title: Product Definition and Portfolio
  body: Stardust builds general-purpose humanoid robots that perform physical tasks in customer workflows.
    Its portfolio centers on two hardware platforms plus a software stack. The S1, a dual-arm wheeled
    system with 7-DoF arms and roughly 5 kg per-arm payload, debuted at the World Robot Conference in
    August 2024 and drew global attention by demonstrating end-effector speeds up to about 10 m/s with
    roughly 0.1 mm repeatability - exceptional dexterity for a humanoid-class manipulator. The T1, launched
    in May 2026 at RMB89,900, is a full humanoid standing about 1.53-1.55m, weighing around 66kg, with
    23 degrees of freedom and roughly 5 kg per-arm payload, positioned for light manipulation across home,
    commercial, research/education, tourism, and light-industrial scenarios rather than heavy industrial
    loads. Above the hardware sits a 'Design-for-AI' software stack - the Lumo AI model for perception,
    planning, and manipulation and the DuoCore embodied OS, which the company positions as a platform
    for third-party applications. Product maturity is highest for the demonstrated S1 and the core actuators,
    and earliest-stage for T1 reliability at scale and the benchmarked capability of the AI layer.
