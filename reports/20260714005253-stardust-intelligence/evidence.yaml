evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials-gap
    missingEvidence: Revenue, ARR, gross margin, burn, runway, and headcount.
    whyItMatters: Without financials, valuation and traction cannot be underwritten beyond order announcements.
    diligencePath: Request audited or management financials and a headcount figure in a data room.
    relatedQuestionRefs:
      - QO016
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: Round-by-round Series B amounts, ownership percentages, and total lifetime raised.
    whyItMatters: Aggregate figures are third-party reported; the split and dilution profile affect entry economics.
    diligencePath: Obtain the cap table and round-by-round terms from management.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Board roster, control/veto rights, and investor governance terms.
    whyItMatters: Governance and control shape refresh risk and downside protection.
    diligencePath: Request the shareholders' agreement and board composition in diligence.
    relatedQuestionRefs:
      - QO020
  - type: missing-source
    severity: minor
    topic: funding
    missingEvidence: Identity and terms of the earliest angel/seed round beyond the reported Yunqi lead.
    whyItMatters: Seed terms and early ownership inform founder dilution and investor rights.
    diligencePath: Confirm the angel round size, date, and syndicate with management.
    relatedQuestionRefs:
      - QO025
  - type: enumeration-incomplete
    severity: minor
    topic: leadership and founder table
