company:
  name: Stardust Intelligence
chapter:
  number: 8
  title: Valuation & Recommendation
  summary: 'At a >RMB10 billion (~$1.38B) valuation reached in mid-2026 on roughly $150M raised, Stardust
    Intelligence is priced as a frontier humanoid leader despite undisclosed revenue and unproven unit
    economics - a stance we judge expensive. Comparable private humanoid valuations (Unitree ~$7B, Figure
    ~$39B, Apptronik ~$5.5B, Galbot ~$3B) and a large but distant TAM (Goldman ~$38B by 2035) frame both
    the upside and the froth. Our recommendation is track: the commercial-traction and differentiation
    signals are real, but the wide bull-to-bear outcome range, thin disclosure, and very high risk profile
    argue for monitoring defined triggers before committing capital.'
sections:
- id: recommendation-thesis
  title: Recommendation and Investment Thesis
  body: 'Our recommendation is track, with an overall score of 6.2 out of 10 at low-to-medium confidence.
    The logic runs from genuine early traction - thousand-unit-scale orders, multi-city deployments, and
    a commercially priced flagship - and a differentiated rope/cable-driven architecture, through a very
    high risk profile and thin financial disclosure, to a valuation we judge expensive relative to demonstrated
    fundamentals. The bull thesis is that rope-driven differentiation, combined with first-mover commercial
    pricing and policy-supported domestic demand, could translate into outsized share of a large future
    market. The anti-thesis is equally credible: the core actuator technology is unproven at scale, orders
    are concentrated bookings rather than delivered value, unit economics are undisclosed, competition
    from the Unitree-AgiBot duopoly is intense, and geopolitical restrictions could cap global expansion.
    Because both narratives are plausible and the disclosure needed to adjudicate them is absent, monitoring
    defined triggers is more prudent than committing capital now. Conditions that would upgrade the view
    to buy are disclosed positive unit economics and independently proven actuator reliability at scale.'
