- id: triggers-diligence
  title: Thesis-Break Triggers and Diligence Asks
  body: Because the investment case hinges on facts not yet disclosed, we translate the risks into monitorable
    triggers and gating diligence asks. The primary thesis-break triggers are evidence of systemic actuator
    failure, a failed Wuxi production ramp, persistent negative margins once financials are disclosed,
    or a financing-market freeze; competitive displacement by the duopoly and an enacted US ban are secondary
    triggers that would force a TAM reassessment. The investment KPIs to track are delivered units, gross
    margin, order-backlog conversion, financing runway, and field-failure rate. Before an investment decision,
    the gating diligence asks are audited financials, unit economics by product, actuator reliability
    and MTBF data, order-to-delivery conversion evidence, and cap-table and round terms, with a team and
    org-chart review to assess execution depth. Clearing the financial and reliability asks with positive
    results would justify upgrading from track to buy; failing them, or hitting any thesis-break trigger,
    would argue for standing down. The key unresolved gap is that essentially all fundamental valuation
    inputs - revenue, margins, and reliability data - remain undisclosed, capping the precision of any
    valuation view.
  claimRefs:
