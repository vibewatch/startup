companyProfile:
  summary: "Stardust Intelligence (Astribot, 星尘智能) is a Shenzhen-based humanoid robotics startup founded in December 2022 by ex-Tencent Robotics X engineer Lai Jie, known for its rope/cable-driven (tendon-driven) actuator technology that it claims enables lighter and safer humanoid robots. The company reached unicorn status (>RMB10 billion valuation, ~$1.38B) in mid-2026 through three consecutive Series B rounds raising over RMB1 billion, advised by China Renaissance and backed by Thundersoft, Kede Education, the Liangxi fund, and others. Its T1 humanoid, priced from RMB89,900, launched in May 2026 following the S1 research platform, with thousand-unit orders reported across industrial, retail, and education customers and deployments spanning roughly six Chinese cities."
  foundedDate: "2022-12-01"
  founders:
    - name: "Lai Jie (赖杰)"
      role: "Founder & CEO"
      background: "First engineer at Tencent Robotics X with roughly 16 years of robotics experience; holds a master's degree."
      claimRefs: [CO004]
    - name: "Dai Yuan (戴媛)"
      role: "Co-founder"
      background: "Identified as a co-founder of Stardust Intelligence."
      claimRefs: [CO032]
  foundingLocation: "Shenzhen, China"
  headquarters: "Shenzhen (Nanshan district), China"
  productSummary: "S1 dual-arm research platform (2024) and T1 full-body humanoid (RMB89,900, launched May 2026), built on a Design-for-AI stack combining a Lumo-style AI model, DuoCore-style OS, and a rope/cable-driven body; deployed in industrial, retail, and education settings."
  customerFocus: "B2B enterprise customers across industrial/logistics, retail, and education sectors; deployments across roughly six Chinese cities."
  businessModel: "Hardware sales to enterprise and institutional buyers, with partner/distribution channels; targeting mass-manufacturing scale at its Wuxi facility."
  stage: "Series B"
