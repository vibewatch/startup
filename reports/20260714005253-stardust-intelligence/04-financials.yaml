- id: unit-economics
  title: Unit Economics and Margin Risk
  body: The financial heart of the Stardust question is whether a humanoid can be sold profitably at RMB89,900.
    No gross margin, bill-of-materials cost, CAC, or per-unit service cost is disclosed, so nearly every
    unit-economics metric is null. The aggressive sub-RMB90,000 price - a deliberate market-expansion
    move enabled by China's dense, low-cost supply chain - raises a direct margin-sustainability question,
    because humanoid bill-of-materials costs remain high and global supply-chain constraints could push
    component prices up during scale-up. Deployed robots also require ongoing service and support, adding
    to cost of delivery, and sector analysts stress that humanoid unit economics are unproven industry-wide,
    with ROI contingent on effective real-world output. The only external anchor is listed peer UBTech,
    whose public financials show humanoid makers running losses despite high valuations. The reasonable
    base case is that Stardust's near-term contribution margins are thin or negative, funded by equity
    rather than operations - a hypothesis diligence must test against an actual margin bridge.
  claimRefs:
  - CI006
  - CI012
  - CI016
  - CI018
  - CI027
  - CI031
  - CI034
  - CI036
