  - FI002
- id: capital-adequacy
  title: Capital Adequacy, Burn, and Financing Dependency
  body: 'Stardust''s capital position is its strongest financial fact. As detailed in the Company Overview
    funding chronology, it raised more than RMB1 billion across three consecutive Series B rounds (B,
    B+, B++) in roughly three months in mid-2026, reaching a valuation above RMB10 billion (~$1.38B),
    atop an estimated $150 million lifetime raise, with a syndicate including Thundersoft, Kede Education,
    Liangxi Fund, a Yangzhou core-chip fund, and Zhongbo Juli, advised by China Renaissance. Proceeds
    are earmarked for mass production, R&D, and go-to-market. Yet cash on hand, monthly burn, and runway
    are all undisclosed, and no debt or project finance is evident, so the company appears equity-funded.
    Capital intensity is real: a Wuxi (Liangxi) mass-production build-out implies meaningful capex and
    working-capital needs, potentially partly offset by municipal subsidies. The rapid three-round raise
    signals strong investor demand but also aggressive planned capital consumption; the likely next-round
    trigger is hitting Wuxi production and revenue milestones. Because sector-wide bubble and overcapacity
    warnings could tighten future capital access, financing durability is a material - and currently unquantifiable
    - risk.'
