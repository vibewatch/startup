company:
  name: Stardust Intelligence
chapter:
  number: 4
  title: Financials
  summary: 'Stardust Intelligence is a private, pre-revenue-disclosure company: it has not published revenue,
    margins, burn, or runway. What is public is its capital base - more than RMB1 billion raised across
    three consecutive Series B rounds in mid-2026 at a valuation above RMB10 billion (~$1.38B), on top
    of roughly $150 million lifetime funding - and its pricing (T1 at RMB89,900) and order signals (a
    first-of-its-kind thousand-unit industrial order and additional CHTF orders). Revenue quality, unit
    economics, and capital intensity of its Wuxi mass-production build-out are the central unknowns, and
    sector-wide bubble warnings make financing durability a material diligence question.'
sections:
- id: revenue-model
  title: Revenue Streams and Monetization
  body: 'Stardust monetizes primarily through one-time hardware sales: the T1 humanoid at RMB89,900, the
    higher-priced S1 research system (estimated $100,000-150,000), multi-unit enterprise and industrial
    contracts, an education channel via Kede Education, and a nascent developer-platform track seeded
    by a CHTF MOU. Critically, the company discloses no revenue, so every stream is characterized by status
    signals rather than financials. The clearest traction signal is a first-of-its-kind thousand-unit
    industrial humanoid order from SEER in September 2025, plus additional orders at CHTF, and deployment
    across roughly six Chinese cities. But order announcements are not recognized revenue: recognition
    on large multi-unit deals carries timing risk tied to delivery, acceptance, and deployment milestones,
    and long enterprise sales cycles mean bookings may convert to revenue slowly. Revenue mix is inferred
    to skew heavily toward hardware today, with education and software revenue immaterial. For diligence,
    converting the headline order signals into verified shipped-unit revenue and average selling prices
    is the first priority.'
