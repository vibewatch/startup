- id: financial-verdict
  title: Financial Verdict and Diligence Blockers
  body: The financial verdict is that Stardust is capital-rich but revenue-opaque. Public evidence confirms
    a strong equity base, an aggressive T1 price, and genuine order signals, but it cannot establish revenue,
    margins, burn, runway, or customer-level economics - all of which are undisclosed. The valuation-to-revenue
    relationship is therefore unmeasurable, the single most important diligence blocker. Financing facts
    are current to mid-2026 and are the freshest available, but they describe capital raised, not capital
    efficiency. The investment case rests almost entirely on unproven unit economics and on the company's
    ability to execute manufacturing scale-up in Wuxi while defending margins against a sub-RMB90,000
    price point. Diligence must obtain audited financials, a BOM and gross-margin bridge, shipment and
    acceptance data behind the order signals, deal-level CAC/payback, and a capex schedule. Until then,
    the financial profile should be treated as high-risk and evidence-light, consistent with an early-stage
    hardware company priced on future potential rather than demonstrated economics.
  claimRefs:
  - CI006
  - CI026
  - CI030
  - CI032
  - CI034
  - CI035
  - CI023
