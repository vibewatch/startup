- id: founders-leadership
  title: Founders, Leadership, and Governance
  body: 'The company''s public identity is tightly bound to founder, chairman, and CEO Lai Jie, whose
    pedigree spans Tencent Robotics X (as its first engineer) and Baidu''s Xiaodu robot program, with
    roughly sixteen years of robotics experience reported. The founding engineering team is drawn largely
    from the same Tencent Robotics X cohort, and Dai Yuan is identified as a co-founder. This concentration
    is a strength for technical credibility but a clear key-person risk: nearly all press coverage, product
    narrative, and investor messaging flow through Lai Jie, and no successor, named COO, or full C-suite
    is publicly documented. Governance disclosure is thin - no board roster, control rights, or ownership
    percentages have been published, even after the Series B added multiple strategic and state-backed
    investors. For diligence, confirming the cap table, board composition, and any investor control or
    veto rights is a priority, as is mapping the depth of the technical bench beneath the founder.'
  claimRefs:
  - CO004
  - CO005
  - CO030
  - CO031
  - CO032
  - CO035
  tableRefs:
  - TO002
- id: funding-capital
  title: Funding History, Valuation, and Capital Structure
  body: Stardust Intelligence progressed rapidly through the capital stack. Chinese trackers describe
    an angel round led by Yunqi Partners in 2023, a Pre-A led by Matrix Partners China in 2024, and an
    A round with Jinqiu Capital and Ant Group, with aggregate lifetime capital estimated by aggregators
    at roughly $150 million. The headline event is the mid-2026 Series B, which Chinese financial media
    report exceeded RMB1 billion raised across three consecutive rounds within about three months, with
    China Renaissance acting as sole financial advisor. Disclosed Series B backers include Thundersoft,
    Kede Education, the Liangxi fund, the Yangzhou Longtou core-chip fund, and Zhongbo Juli. The round
    pushed the company's valuation past RMB10 billion (about $1.38 billion), formally granting unicorn
    status and reinforcing Shenzhen's embodied-AI cluster. Thundersoft's participation is notably strategic,
    pairing capital with operating-system, manufacturing, and channel cooperation at thousand-unit scale.
    Round-by-round amounts, ownership stakes, and preference terms remain undisclosed.
  claimRefs:
  - CO007
