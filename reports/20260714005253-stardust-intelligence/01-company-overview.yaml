- id: snapshot-metrics-gaps
  title: Snapshot Metrics and Evidence Gaps
  body: 'The supportable cover metrics are a valuation above RMB10 billion, a Series B exceeding RMB1
    billion, a flagship T1 price of RMB89,900, a December 2022 founding date, and reported thousand-unit
    orders. Against these, the most important numbers for underwriting are simply unavailable: revenue,
    ARR, gross margin, unit economics, burn, runway, headcount, and a verified active-customer count are
    all undisclosed, consistent with a private Chinese hardware company. Traction is expressed through
    order announcements rather than recognized revenue, so the gap between booked orders and delivered,
    paid units is material. The company''s valuation places it among a cohort of Chinese humanoid unicorns
    formed in 2025-2026, but the same period has drawn explicit bubble and overvaluation warnings from
    analysts and Chinese officials, which frames the snapshot with caution. Diligence should convert order
    announcements into a delivery and revenue schedule and obtain a data-room view of financials and headcount.'
  claimRefs:
  - CO008
  - CO009
  - CO015
  - CO018
  - CO023
  - CO025
  - CO026
  tableRefs:
  - TO001
  figureRefs:
  - FO003
- id: milestones-traction
  title: Milestones, Products, and Commercial Traction
  body: 'The company''s chronology accelerated sharply after its 2022 founding. The S1 dual-arm, rope-driven
    robot debuted at the World Robot Conference in August 2024 and went viral for arm speed and dexterity,
    establishing the brand internationally. Commercial proof points followed: in September 2025 SEER (Xiangong
    Intelligence) signed what was described as China''s first thousand-unit industrial humanoid order
    to be delivered over two years, and in November 2025 the company signed an embodied-AI order and developer-platform
    partnership with Baidu and Jishu Diedai at CHTF. The T1 humanoid launched in May 2026 at RMB89,900,
    an aggressive price aimed at opening business, research, and education markets, targeting five scenario
    families spanning home service, commercial stores, research/education, tourism, and light industry.
    These milestones underpin the mid-2026 Series B and unicorn valuation, though the company competes
    in an intensely crowded Chinese humanoid market led on volume by Unitree and AgiBot.'
  claimRefs:
