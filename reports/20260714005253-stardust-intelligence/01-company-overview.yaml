callouts:
- calloutType: strength
  title: Early, priced commercial traction with a differentiated actuator
  body: 'Stardust pairs a genuinely differentiated rope/cable-driven actuation approach with early, priced
    commercial traction: a RMB89,900 T1 and a reported China-first thousand-unit industrial order from
    SEER. That combination of differentiation plus order flow is rare among humanoid startups and underpins
    the unicorn valuation.'
  claimRefs:
  - CO017
  - CO015
  - CO019
  - CO008
- calloutType: risk
  title: Key-person concentration and thin governance disclosure
  body: The company's narrative, technical direction, and investor relationships concentrate in founder-CEO
    Lai Jie, with no public successor or full C-suite and no disclosed board or control rights. This key-person
    and governance opacity is a material diligence item for any investor.
  claimRefs:
  - CO031
  - CO035
- calloutType: assumption
  title: Traction measured in orders, not recognized revenue
  body: Reported thousand-unit orders are treated as demand signals, not delivered revenue. Actual recognized
    revenue, delivery cadence, and cancellation risk are unknown; the analysis assumes bookings materially
    overstate near-term paid installs until a delivery schedule is verified.
  claimRefs:
  - CO018
  - CO023
- calloutType: insight
  title: Valuation sits inside a flagged sector bubble
  body: The ~RMB10B valuation places Stardust among a wave of 2025-2026 Chinese humanoid unicorns during
    a period when analysts and Chinese officials have explicitly warned of bubble and overcapacity risk
    - context that should temper the entry multiple.
  claimRefs:
  - CO026
  - CO025
