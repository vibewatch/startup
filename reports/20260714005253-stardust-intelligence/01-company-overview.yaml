company:
  name: Stardust Intelligence
chapter:
  number: 1
  title: Company Overview
  summary: Stardust Intelligence (Astribot, 星尘智能) is a Shenzhen humanoid-robotics company founded December
    2022 by ex-Tencent Robotics X engineer Lai Jie. It is known for rope/cable-driven (tendon) humanoids
    (S1, T1). In mid-2026 it reached unicorn status at a valuation above RMB10B (~$1.38B) after a Series
    B exceeding RMB1B raised across three rounds, with China Renaissance as sole financial advisor. Its
    T1 launched May 2026 at RMB89,900 with reported thousand-unit orders across industrial, retail, and
    education customers. Revenue, headcount, and unit economics are undisclosed.
sections:
- id: identity-product-model
  title: Identity, Product, and Business Model
  body: Stardust Intelligence, operating under the Astribot brand (Chinese name 星尘智能, Xingchen Zhineng),
    is a Shenzhen-based humanoid-robotics company founded in December 2022 by Lai Jie, the first engineer
    at Tencent Robotics X and a former leader of Baidu's Xiaodu robot team. The legal entity is Astribot
    (Shenzhen) Co., Ltd. The company's defining technical bet is rope/cable-driven (tendon) actuation,
    which it argues yields lighter, safer, and more compliant humanoids than conventional motor-driven
    joints. It pursues a full-stack 'Design for AI' (DFAI) architecture that couples proprietary AI models,
    an embodied operating system, and the rope-driven body. Commercially, Stardust sells hardware to enterprise
    buyers across industrial, retail, research, and education segments, positioning itself around 'Physical
    AI' commercialization rather than pure research demos. Its lead products are the S1 dual-arm robot
    and the T1 humanoid launched in May 2026.
  claimRefs:
