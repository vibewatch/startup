      - number: '2.3'
        title: Buyers, Segments, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Demand originates from a diverse buyer set. Industrial and logistics operators buy to automate repetitive
              or dangerous material handling, funded by corporate capex; retail, tourism, and hospitality venues buy
              customer-facing service and differentiation; universities and labs buy research platforms on grants; and
              vocational schools and universities buy training units, frequently on state or institutional budgets and
              through channels like Kede Education. Across segments the adoption path runs from demo and showcase
              interest, to a paid pilot, to limited production, and only then to scaled multi-site rollout and expansion
              - each stage gated by demonstrated ROI. Because many deployed humanoids still operate at only 20-30% of
              human efficiency, conversion from pilot to scaled production is the critical bottleneck. Public showcases
              such as CHTF and Hong Kong's InnoEx 2026 signal rising interest, and government deployment programs
              shorten procurement in policy-backed verticals, but genuine production economics remain the gating factor.
            claimRefs:
