      - number: '2.4'
        title: Growth Drivers, Constraints, and Contested Estimates
        blocks:
          - type: paragraph
            body: >-
              The market's tailwinds are strong: sharp cost declines exemplified by sub-RMB90,000 humanoids, the
              world-first HEIS 2026 national standards, and MIIT/SASAC deployment programs that create state-backed
              demand. Massive capital is flowing - embodied-AI financing exceeded RMB33.5 billion in the first eleven
              months of 2025 (about four times the prior year), and 2026 has seen over 500 robotics financing rounds
              worth roughly RMB96 billion, with tech giants and carmakers entering. Yet the constraints are equally real
              and explicitly documented: unproven ROI, reliability, battery and safety limits, semiconductor import
              restrictions capping AI progress, and repeated bubble and overcapacity warnings from banks such as Morgan
              Stanley and from Chinese officials. National standards will reduce fragmentation but take time to adopt
              industry-wide. For diligence, the divergence of market estimates and the gap between order announcements
              and proven production ROI are the central unresolved questions, and the most bearish analyst views should
              be weighted, not dismissed.
