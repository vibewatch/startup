          - type: callout
            title: Peer marks bound the range widely
            body: >-
              Chinese peers (Unitree ~$7B, Galbot ~$3B, UBTech listed) and US peers (Figure ~$39B, Apptronik ~$5.5B)
              frame a very wide plausible range, underscoring the scenario spread.
            calloutType: insight
            claimRefs:
