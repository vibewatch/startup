        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              The company's public identity is tightly bound to founder, chairman, and CEO Lai Jie, whose pedigree spans
              Tencent Robotics X (as its first engineer) and Baidu's Xiaodu robot program, with roughly sixteen years of
              robotics experience reported. The founding engineering team is drawn largely from the same Tencent
              Robotics X cohort, and Dai Yuan is identified as a co-founder. This concentration is a strength for
              technical credibility but a clear key-person risk: nearly all press coverage, product narrative, and
              investor messaging flow through Lai Jie, and no successor, named COO, or full C-suite is publicly
              documented. Governance disclosure is thin - no board roster, control rights, or ownership percentages have
              been published, even after the Series B added multiple strategic and state-backed investors. For
              diligence, confirming the cap table, board composition, and any investor control or veto rights is a
              priority, as is mapping the depth of the technical bench beneath the founder.
