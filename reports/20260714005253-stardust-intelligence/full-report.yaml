      - number: '8.2'
        title: Valuation, Scenarios, and Sensitivity
        blocks:
          - type: paragraph
            body: >-
              Stardust reached a valuation exceeding RMB10 billion (~$1.38B) in mid-2026, having raised over RMB1
              billion across three consecutive Series B rounds in roughly three months, with cumulative capital of
              approximately $150M and China Renaissance advising. Crucially, no public revenue, ARR, or margin figures
              exist, so no fundamentals-based multiple can be computed; the mark reflects frontier-leader optionality
              rather than demonstrated economics. Valuation sensitivity is dominated by assumed unit volume, gross
              margin, and terminal market share, with TAM-realization timing a secondary factor given the opportunity is
              large but distant. Across scenarios the outcome range is wide: the bull case assumes a successful Wuxi
              scale-up, proven actuator reliability, and multi-sector order conversion, yielding a high return multiple;
              the base case assumes gradual commercialization and modest share in a growing but competitive China market
              for a moderate outcome; and the bear case - actuator or manufacturing failure, a financing freeze, or
              duopoly displacement - implies substantial impairment. Sector bubble and overcapacity warnings add
              multiple-compression risk if humanoid enthusiasm cools, reinforcing the expensive stance. This data is
              current to mid-2026.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV013
