      - number: '3.3'
        title: Moat, Switching Costs, and Durability
        blocks:
          - type: paragraph
            body: >-
              Stardust's moat is real but narrow. Its actuator know-how and full-stack integration are meaningful today,
              yet both are replicable by better-capitalized rivals over time, and the sector is commoditizing as
              suppliers share actuators, sensors, and AI toolkits and as national standards reduce differentiation
              across the field. Switching costs for buyers are moderate - integration, safety certification, and
              retraining create some lock-in, but enterprises can multi-home across vendors, and internal build or
              continued human labor remain default alternatives for cost-sensitive customers. Potential durable
              advantages would come from a developer ecosystem around the DuoCore OS or from proven reliability at
              scale, but neither is established today. Crucially, Stardust trails Unitree and AgiBot on scale, funding,
              and production maturity, and its dexterity leadership remains demo-stage rather than field-validated. The
              competitive verdict is that Stardust holds a defensible wedge on affordability plus full-stack design, but
              its moat durability is contingent on execution and on proving that rope-driven actuators are reliable in
              real, sustained commercial deployments rather than showcase demonstrations.
