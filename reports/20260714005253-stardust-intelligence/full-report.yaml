  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Portfolio
        blocks:
          - type: paragraph
            body: >-
              Stardust builds general-purpose humanoid robots that perform physical tasks in customer workflows. Its
              portfolio centers on two hardware platforms plus a software stack. The S1, a dual-arm wheeled system with
              7-DoF arms and roughly 5 kg per-arm payload, debuted at the World Robot Conference in August 2024 and drew
              global attention by demonstrating end-effector speeds up to about 10 m/s with roughly 0.1 mm repeatability
              - exceptional dexterity for a humanoid-class manipulator. The T1, launched in May 2026 at RMB89,900, is a
              full humanoid standing about 1.53-1.55m, weighing around 66kg, with 23 degrees of freedom and roughly 5 kg
              per-arm payload, positioned for light manipulation across home, commercial, research/education, tourism,
              and light-industrial scenarios rather than heavy industrial loads. Above the hardware sits a
              'Design-for-AI' software stack - the Lumo AI model for perception, planning, and manipulation and the
              DuoCore embodied OS, which the company positions as a platform for third-party applications. Product
              maturity is highest for the demonstrated S1 and the core actuators, and earliest-stage for T1 reliability
              at scale and the benchmarked capability of the AI layer.
