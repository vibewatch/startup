        title: Customer Base and Segmentation
        blocks:
          - type: paragraph
            body: >-
              Stardust's customers cluster in three primary segments plus research and developer channels. Industrial
              and logistics buyers - exemplified by SEER - purchase for material handling and repetitive tasks, funded
              by corporate capex, and represent the most concrete, largest-scale demand to date. Retail and commercial
              buyers deploy T1 units for customer-facing service across multiple cities, though named accounts are
              limited and reported at the scenario level. Education and vocational buyers acquire training units through
              the Kede Education channel, drawing on institutional or state budgets for recurring but modest per-unit
              demand, while research buyers purchase the S1 as a manipulation testbed. A fifth, nascent channel is
              developers and integrators reached via the CHTF developer-platform MOU. Across segments, buyer, user, and
              payer frequently differ - a school's procurement office, its students, and a state budget, for instance -
              which lengthens sales cycles. Government and municipal programs in Wuxi and Shenzhen further shape the
              pipeline through scenario funding. The company reports deployment across roughly six Chinese cities,
              indicating operational breadth even where per-site depth is unclear.
