      - number: '7.3'
        title: Financial, Partner, and People Risk
        blocks:
          - type: paragraph
            body: >-
              Financial-model risk is high. Undisclosed revenue and margins against a sub-RMB90,000 price point imply
              potentially thin or negative unit economics, while sector-wide bubble and overcapacity warnings - with
              investors explicitly flagging humanoid robotics as a possible next AI bubble - threaten future capital
              access and could trigger margin-compressing price wars. Partner and dependency risk is concentrated: a few
              marquee orders, above all SEER, dominate visible demand; go-to-market leans on partner channels (SEER,
              Kede Education); AI-compute and chip supply is exposed to export restrictions; and strategic-investor
              reliance on Thundersoft adds continuity risk. People and execution risk includes founder key-person
              concentration around Lai Jie, whose robotics vision and Tencent-derived credibility anchor the company,
              thinly documented technical-team credentials, and unproven mass-manufacturing execution - with little
              public evidence of bench-depth or succession mitigation. Across these categories, risks transmit into the
              thesis through weak revenue, compressed margins, constrained financing, and ultimately valuation multiple
              compression.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
