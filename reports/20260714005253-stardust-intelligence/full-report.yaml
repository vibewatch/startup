      - number: '5.4'
        title: Trust, Safety, Compliance, and Verdict
        blocks:
          - type: paragraph
            body: >-
              Trust and safety evidence is thinner than the capability story. China's HEIS 2026 national standards set
              emerging safety and interoperability requirements applicable to Stardust, and Shenzhen's 2026 introduction
              of embodied-AI liability insurance signals a maturing compliance framework for humanoid deployment.
              Rope-driven design plausibly aids interaction safety through lower-inertia limbs, and safety controls must
              address collision avoidance and force limiting. However, company-specific evidence is scarce:
              certifications, safety-test results, actuator MTBF, and data/privacy policies are all undisclosed, and
              quality-and-compliance disclosure is a material gap. The product/technology verdict is therefore
              two-sided: Stardust has genuine, demonstrated dexterity leadership and a distinctive, defensible-looking
              actuation approach, offset by unproven at-scale reliability, an undisclosed AI-benchmark record, and thin
              compliance transparency. Technical diligence should prioritize independent reliability and dexterity
              benchmarking, actuator durability data, AI-model evaluation, and evidence of standards certification
              before relying on the technology claims.
