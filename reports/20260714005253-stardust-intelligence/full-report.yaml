  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Stardust competes in China's market for enterprise service and light-industrial humanoid robots - bipedal
              or dual-arm systems sold to organizations for real tasks - a subset of the broader embodied-AI landscape.
              In-market spend covers general-purpose and light-industrial humanoids, education and research units, and
              retail/tourism service robots. Excluded from the boundary are quadruped robots (e.g., Unitree's Go line),
              fixed factory automation and PLC-driven cells, and standalone collaborative arms, which are treated as
              substitutes or adjacencies rather than direct market. The most important status-quo substitute remains
              human labor, followed by fixed automation and cobots for structured tasks. This boundary matters because
              headline 'humanoid market' figures often blend these categories; defining Stardust's addressable slice as
              enterprise humanoids clarifies which demand and competitors are truly relevant and prevents overstating
              the reachable opportunity. In practice the boundary is porous at the edges, because a buyer weighing a
              humanoid will also price a cobot or additional shift labor for the same task, so competing budgets extend
              well beyond named humanoid vendors.
            claimRefs:
              - CM011
              - CM012
