      - number: '7.4'
        title: Mitigations, Kill Criteria, and Risk Verdict
        blocks:
          - type: paragraph
            body: >-
              Mitigations exist but are early-stage. Stardust's freshly raised equity, strategic backers, alignment with
              emerging standards, availability of liability insurance, and multi-scenario product diversification reduce
              some exposure, but none neutralizes the core technology and financial risks, so residual exposure remains
              material-to-critical across most categories. Investors should track a defined set of monitorable triggers
              and kill criteria: actuator field-failure rates, delivered units versus the Wuxi production plan, margin
              disclosure, financing runway and round progress, US legislation status, and customer-order
              diversification. The principal thesis-break events are evidence of systemic actuator failures, a failed
              Wuxi production ramp, or a financing-market freeze that leaves the company unable to fund scale-up; a US
              market-access ban would materially shrink the addressable market. The overall risk verdict is very high,
              driven by unproven technology reliability, financial opacity, and rising regulatory and geopolitical
              exposure. The remaining unresolved gap is the near-total absence of disclosed operating, reliability, and
              team data on which to base a more precise risk quantification.
            claimRefs:
              - CR022
              - CR026
