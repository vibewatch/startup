      - number: '5.3'
        title: Deployment, Roadmap, and Manufacturing
        blocks:
          - type: paragraph
            body: >-
              Deploying a Stardust humanoid follows a repeatable operating flow: scope the task or scenario, integrate
              and configure the robot on site, complete safety validation and operator training, run autonomous
              operation through the Lumo/DuoCore stack, perform ongoing maintenance and actuator servicing, and expand
              to more units or sites once value is proven. The roadmap runs from the S1 research debut (2024) to the T1
              mass-market launch (May 2026) to production scale-up at a Wuxi (Liangxi) facility in 2026 - a step whose
              execution will test whether the affordable RMB89,900 price, enabled by design simplification and China's
              dense component supply chain, can be sustained at volume. The T1's 23-DoF full-humanoid form is inherently
              more complex to manufacture reliably than the S1's wheeled dual-arm base, raising execution risk. Critical
              dependencies span actuator and cable suppliers, sensors, the domestic robotics supply chain, and AI
              compute - the last exposed to semiconductor export restrictions affecting Chinese robotics. Manufacturing
              scale-up and supply resilience are therefore the near-term technology-execution questions.
