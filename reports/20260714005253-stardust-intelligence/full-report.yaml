  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Investment Thesis
        blocks:
          - type: paragraph
            body: >-
              Our recommendation is track, with an overall score of 6.2 out of 10 at low-to-medium confidence. The logic
              runs from genuine early traction - thousand-unit-scale orders, multi-city deployments, and a commercially
              priced flagship - and a differentiated rope/cable-driven architecture, through a very high risk profile
              and thin financial disclosure, to a valuation we judge expensive relative to demonstrated fundamentals.
              The bull thesis is that rope-driven differentiation, combined with first-mover commercial pricing and
              policy-supported domestic demand, could translate into outsized share of a large future market. The
              anti-thesis is equally credible: the core actuator technology is unproven at scale, orders are
              concentrated bookings rather than delivered value, unit economics are undisclosed, competition from the
              Unitree-AgiBot duopoly is intense, and geopolitical restrictions could cap global expansion. Because both
              narratives are plausible and the disclosure needed to adjudicate them is absent, monitoring defined
              triggers is more prudent than committing capital now. Conditions that would upgrade the view to buy are
              disclosed positive unit economics and independently proven actuator reliability at scale.
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV024
              - CV025
              - CV030
              - CV036
