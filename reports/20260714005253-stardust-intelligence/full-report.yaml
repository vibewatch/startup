      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, pending disclosure and reliability proof
            body: >-
              Real traction and differentiation justify attention, but an expensive valuation on undisclosed
              fundamentals and very high risk argue for tracking defined triggers rather than committing capital now.
            calloutType: recommendation
            claimRefs:
