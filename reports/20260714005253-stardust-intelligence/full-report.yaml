          - type: callout
            title: Geopolitical and financing risks are escalating
            body: >-
              US legislative moves to ban Chinese robots could cap expansion, while sector bubble warnings threaten
              capital access and could spark margin-crushing price wars - compounding financial-model risk.
            calloutType: risk
            claimRefs:
