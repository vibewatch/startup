      - number: '7.2'
        title: Operational, Quality, and Safety Risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk centers on the very technology that differentiates Stardust. Rope/cable-driven actuator
              reliability at sustained commercial scale is unproven and is the single most material technology risk;
              cable wear and complex tendon routing are recognized engineering challenges that could raise maintenance
              and failure rates, and no public MTBF or field-failure data exists. Manufacturing scale-up at the new Wuxi
              facility carries execution, yield, and working-capital risk, compounded by reliance on a single flagship
              facility for continuity. Human-robot-interaction safety - collision and force risks in public and
              commercial settings - requires robust controls, partly aided by the lower inertia of compliant rope-driven
              limbs but unsupported by published safety-test data. Quality and certification evidence is also
              undisclosed. Ranked by severity, actuator failure at scale (critical impact, low mitigation maturity) and
              a Wuxi ramp shortfall (high impact) are the leading operational exposures, both with immature mitigations
              and material-to-high residual risk.
