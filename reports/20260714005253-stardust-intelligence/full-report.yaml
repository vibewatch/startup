          - type: callout
            title: Track defined kill criteria before scaling exposure
            body: >-
              Monitor actuator field-failure rates, Wuxi delivered-unit ramp, margin disclosure, financing runway, and
              US legislation status. Systemic actuator failure, a failed ramp, or a financing freeze should trigger
              exit.
            calloutType: recommendation
