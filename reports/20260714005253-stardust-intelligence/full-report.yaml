  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Monetization
        blocks:
          - type: paragraph
            body: >-
              Stardust monetizes primarily through one-time hardware sales: the T1 humanoid at RMB89,900, the
              higher-priced S1 research system (estimated $100,000-150,000), multi-unit enterprise and industrial
              contracts, an education channel via Kede Education, and a nascent developer-platform track seeded by a
              CHTF MOU. Critically, the company discloses no revenue, so every stream is characterized by status signals
              rather than financials. The clearest traction signal is a first-of-its-kind thousand-unit industrial
              humanoid order from SEER in September 2025, plus additional orders at CHTF, and deployment across roughly
              six Chinese cities. But order announcements are not recognized revenue: recognition on large multi-unit
              deals carries timing risk tied to delivery, acceptance, and deployment milestones, and long enterprise
              sales cycles mean bookings may convert to revenue slowly. Revenue mix is inferred to skew heavily toward
              hardware today, with education and software revenue immaterial. For diligence, converting the headline
              order signals into verified shipped-unit revenue and average selling prices is the first priority.
