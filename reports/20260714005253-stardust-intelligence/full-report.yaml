      - number: '2.2'
        title: Market Sizing and Growth
        blocks:
          - type: paragraph
            body: >-
              Sizing the China humanoid market requires multiple lenses because published estimates diverge
              dramatically. EmbodiedGlobal cites a 2026 China figure near RMB104.7 billion, while other framings reach
              as high as RMB1,047 billion, and analysts describe CAGRs above 65% into the next decade. Globally, Axis
              Intelligence estimates 2026 sector revenue near $6.24 billion, and Goldman Sachs projects a roughly $38
              billion global TAM by 2035, with longer-run banks envisioning trillion-dollar-scale markets by
              mid-century. On a unit basis, Morgan Stanley forecasts about 50,000 China humanoid sales in 2026. China's
              structural dominance is clear - about 90% of global output in 2025 and roughly 85% of shipments in 2026,
              with output forecast to surge about 94% year-on-year. Against these figures, Stardust's serviceable
              obtainable market is a small early slice measured in thousands of units near-term. The wide dispersion of
              estimates - a genuine RMB1,047B outlier included - is itself a material finding preserved for diligence.
