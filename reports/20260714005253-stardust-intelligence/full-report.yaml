      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Unproven actuator reliability is the top technology risk
            body: >-
              Rope/cable-driven actuation is Stardust's differentiator but its reliability at commercial scale is
              unproven, with no public MTBF or field-failure data. Systemic actuator failure is a thesis-break event.
            calloutType: risk
            claimRefs:
