              - CV019
      - number: '8.3'
        title: Comparable Valuations and Market Context
        blocks:
          - type: paragraph
            body: >-
              Comparable humanoid valuations frame both the opportunity and the froth. In China, Unitree is pursuing an
              IPO at roughly $7B and Galbot has reached about $3B, while UBTech offers a public-market reality check
              whose exchange valuation typically sits well below the multiples implied by hot private rounds. In the US,
              Figure AI (~$39B) and Apptronik (~$5.5B) show how far private marks can run in a different capital-market
              and hype environment. Against these, Stardust's ~$1.38B mark sits below the leaders, consistent with its
              earlier commercialization stage. On the market side, Goldman Sachs projects a global humanoid TAM of
              roughly $38B by 2035, and China accounts for the overwhelming majority of global humanoid output,
              underpinning a credible domestic base-case growth path; more speculative trillion-dollar narratives exist
              but are distant and should not anchor near-term value. Additional domestic entrants - AgiBot and Fourier
              among them - broaden the comparable set and intensify competition for the same capital and customers,
              pressuring relative valuation. Analysts also caution that Chinese output is outpacing demonstrated demand,
              a risk to the growth assumptions embedded in any bullish comparable read-across.
            claimRefs:
              - CV005
