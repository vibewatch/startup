companyProfile:
  summary: >-
    Stardust Intelligence (Astribot, 星尘智能) is a Shenzhen-based humanoid robotics startup founded in December 2022 by
    ex-Tencent Robotics X engineer Lai Jie, known for its rope/cable-driven (tendon-driven) actuator technology that it
    claims enables lighter and safer humanoid robots. The company reached unicorn status (>RMB10 billion valuation,
    ~$1.38B) in mid-2026 through three consecutive Series B rounds raising over RMB1 billion, advised by China
    Renaissance and backed by Thundersoft, Kede Education, the Liangxi fund, and others. Its T1 humanoid, priced from
    RMB89,900, launched in May 2026 following the S1 research platform, with thousand-unit orders reported across
    industrial, retail, and education customers and deployments spanning roughly six Chinese cities.
