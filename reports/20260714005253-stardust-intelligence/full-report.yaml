            body: >-
              With no public revenue or margins, the ~$1.38B mark reflects frontier optionality. Bubble and overcapacity
              warnings add multiple-compression risk if humanoid enthusiasm cools.
            calloutType: risk
            claimRefs:
              - CV012
              - CV021
