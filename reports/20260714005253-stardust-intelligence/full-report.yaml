      - number: '1.5'
        title: Milestones, Products, and Commercial Traction
        blocks:
          - type: paragraph
            body: >-
              The company's chronology accelerated sharply after its 2022 founding. The S1 dual-arm, rope-driven robot
              debuted at the World Robot Conference in August 2024 and went viral for arm speed and dexterity,
              establishing the brand internationally. Commercial proof points followed: in September 2025 SEER (Xiangong
              Intelligence) signed what was described as China's first thousand-unit industrial humanoid order to be
              delivered over two years, and in November 2025 the company signed an embodied-AI order and
              developer-platform partnership with Baidu and Jishu Diedai at CHTF. The T1 humanoid launched in May 2026
              at RMB89,900, an aggressive price aimed at opening business, research, and education markets, targeting
              five scenario families spanning home service, commercial stores, research/education, tourism, and light
              industry. These milestones underpin the mid-2026 Series B and unicorn valuation, though the company
              competes in an intensely crowded Chinese humanoid market led on volume by Unitree and AgiBot.
