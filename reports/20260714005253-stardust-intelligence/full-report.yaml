  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Geopolitical Risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory and legal exposure is a top-tier risk with a distinctive geopolitical edge. Domestically, China
              released the world-first HEIS 2026 national standards for humanoid robots and embodied AI, which
              legitimize the sector but impose certification effort and compliance cost during scale-up; China's Civil
              Code creates product-liability exposure for defective robots, partly mitigated by Shenzhen's new
              embodied-AI liability insurance; and an evolving AI-governance regime, including a draft AI law, may add
              future obligations. The sharper risk is external: US lawmakers introduced legislation - a House Select
              Committee bill and the American Security Robotics Act - to ban or restrict government purchases of Chinese
              humanoid robots, and the proposed GUARD Act would extend the FCC covered-list framework to robotics. These
              measures reflect rising strategic-security scrutiny of Chinese robots and could cap Stardust's
              international expansion, narrowing its addressable market. Standards fragmentation between China and
              international regimes could further raise export-compliance friction. The assessment is current to
              mid-2026 and reflects the latest standards and legislative activity.
            claimRefs:
              - CR001
              - CR002
