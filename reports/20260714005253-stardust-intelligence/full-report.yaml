  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Entrants
        blocks:
          - type: paragraph
            body: >-
              Stardust operates in one of the most crowded technology markets of 2026: over fifty Chinese humanoid
              developers plus major US players. The China market is effectively a duopoly, with Unitree and AgiBot
              together holding roughly 80% of domestic share. Unitree, targeting an IPO reportedly valuing it near $7
              billion, combines brand strength, viral demos, and a low-cost G1 humanoid around $16,000. AgiBot (Zhiyuan)
              pursues mass production with heavy state and investor backing. Well-funded peers include Galbot (~$3B
              valuation), the listed UBTech with its Walker series, rehabilitation-rooted Fourier with its GR-series,
              and emerging startups such as EngineAI. Abroad, Figure AI (~$39B), 1X (Neo at ~$20,000), Apptronik
              (~$5.5B), and Tesla's Optimus command vast capital. Likely new entrants - tech giants such as Alibaba and
              ByteDance and carmakers such as BYD and XPeng - will intensify rivalry further. Against this backdrop
              Stardust is a comparatively small, though rapidly funded, challenger.
            claimRefs:
