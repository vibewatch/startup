      - number: '5.2'
        title: Architecture and the Rope-Driven Differentiator
        blocks:
          - type: paragraph
            body: >-
              The defining technical choice is rope/cable-driven (tendon-driven) actuation. Instead of placing heavy
              motors and gearboxes at each joint, Stardust relocates motors into the torso and transmits force through
              cables to the limbs. This lowers limb inertia, enabling the high speeds and compliance the S1 showcased,
              and can improve human-robot interaction safety because lighter, lower-inertia limbs are less dangerous on
              contact. Most competitors - including Unitree's G1 and Fourier's GR-series - rely on conventional motor or
              harmonic-drive joints, so the approach is a genuine differentiator and the heart of Stardust's IP and
              know-how, though public patent breadth is not detailed. The full stack layers the Lumo AI model and
              DuoCore OS above this body, with a public GitHub presence signaling intent to cultivate a developer
              ecosystem. The critical caveat is reliability: complex tendon routing and cable wear are recognized
              engineering challenges, and the long-term durability and maintenance burden of rope-driven actuators under
              sustained commercial load are not independently validated. Dexterity leadership is real in demonstrations
              but has not been proven in standardized, independent benchmarks.
            claimRefs:
