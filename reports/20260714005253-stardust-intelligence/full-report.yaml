      - number: '3.4'
        title: Distribution Power, Likely Entrants, and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              Beyond today's field, distribution power and new entrants shape the competitive trajectory. Unitree's
              brand recognition and viral demonstrations grant it distribution and mindshare advantages that Stardust,
              despite its own attention-grabbing S1 debut at WRC 2024, does not match. All Chinese players benefit from
              a dense domestic supply chain that keeps costs low, so cost advantage alone is not proprietary. The most
              consequential future threats are well-resourced entrants: tech giants such as Alibaba and ByteDance and
              carmakers such as BYD and XPeng are moving into humanoid robotics, bringing manufacturing scale, capital,
              and existing enterprise relationships. Displacement risk is therefore high - as sub-RMB100,000 humanoids
              proliferate and shared toolkits converge feature sets, a smaller specialist like Stardust could be
              squeezed between the incumbent duopoly above and a wave of deep-pocketed entrants. Its best defense is to
              convert early dexterity and cost leadership into either a sticky developer ecosystem or a demonstrable,
              independently verified reliability advantage before parity erases its wedge.
            claimRefs:
              - CP020
              - CP021
              - CP024
              - CP025
              - CP033
              - CP034
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Genuine technical and price differentiation
            body: >-
