      - number: '1.3'
        title: Funding History, Valuation, and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Stardust Intelligence progressed rapidly through the capital stack. Chinese trackers describe an angel
              round led by Yunqi Partners in 2023, a Pre-A led by Matrix Partners China in 2024, and an A round with
              Jinqiu Capital and Ant Group, with aggregate lifetime capital estimated by aggregators at roughly $150
              million. The headline event is the mid-2026 Series B, which Chinese financial media report exceeded RMB1
              billion raised across three consecutive rounds within about three months, with China Renaissance acting as
              sole financial advisor. Disclosed Series B backers include Thundersoft, Kede Education, the Liangxi fund,
              the Yangzhou Longtou core-chip fund, and Zhongbo Juli. The round pushed the company's valuation past RMB10
              billion (about $1.38 billion), formally granting unicorn status and reinforcing Shenzhen's embodied-AI
              cluster. Thundersoft's participation is notably strategic, pairing capital with operating-system,
              manufacturing, and channel cooperation at thousand-unit scale. Round-by-round amounts, ownership stakes,
              and preference terms remain undisclosed.
