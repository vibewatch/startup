        title: 里程碑、产品与商业牵引
        blocks:
          - type: paragraph
            body: >-
              公司在 2022 年成立后，发展节奏迅速加快。绳驱动 S1 双臂机器人于 2024 年 8 月在 World Robot Conference
              亮相，凭借手臂速度和灵巧性出圈，并在国际上建立品牌认知。商业证据随后出现：2025 年 9 月，SEER（Xiangong
              Intelligence）签下据称为中国首个千台级工业人形机器人订单，计划两年内交付；2025 年 11 月，公司又在 CHTF 与 Baidu、Jishu Diedai 签署具身 AI 订单和开发者平台合作。
              T1 人形机器人于 2026 年 5 月发布，定价 RMB89,900，价格激进，意在打开商业、研究和教育市场；目标场景覆盖家庭服务、商业门店、科研/教育、文旅和轻工业五大类。上述里程碑支撑了 2026 年中的
              Series B 和独角兽估值，但公司也处在极其拥挤的中国人形机器人市场，按出货量看，Unitree 和 AgiBot 领先。
