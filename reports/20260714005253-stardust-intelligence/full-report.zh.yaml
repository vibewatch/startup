  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              Stardust 竞争的是中国企业服务和轻工业人形机器人市场——面向组织销售、执行真实任务的双足或双臂系统——这是更广义具身 AI
              版图中的一个子集。市场内支出包括通用和轻工业人形机器人、教育和研究设备，以及零售/文旅服务机器人。 边界之外包括四足机器人（例如 Unitree 的 Go 系列）、固定式工厂自动化和 PLC
              驱动产线单元，以及独立协作机械臂；这些更应视为替代品或相邻市场，而不是直接市场。最重要的现状替代品仍然是人力，其次是在结构化任务中使用固定自动化和协作机器人。这个边界很重要，因为标题式的「人形机器人市场」数据常把这些类别混在一起；把
              Stardust
              的可服务切片定义为企业人形机器人，才能看清真正相关的需求和竞争者，也避免夸大可触达机会。实际边界并不硬：买家评估人形机器人时，也会为同一任务比较协作机器人或新增班次人力，因此竞争预算远超具名人形机器人厂商。
