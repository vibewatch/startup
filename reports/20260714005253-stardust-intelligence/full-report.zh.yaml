              财务模型风险很高。收入和利润率未披露，而价格低于 RMB90,000，意味着单位经济可能很薄或为负；全行业泡沫和产能过剩警示——投资人明确把人形机器人列为可能的下一个 AI
              泡沫——会威胁未来资本可得性，并可能引发压缩利润率的价格战。 合作伙伴和依赖风险集中：少数标志性订单，尤其 SEER，主导可见需求；市场拓展依赖合作伙伴渠道（SEER、Kede Education）；AI
              算力和芯片供应暴露于出口限制；对战略投资方 Thundersoft 的依赖也带来连续性风险。人员和执行风险包括创始人关键人物集中在 Lai Jie 身上，他的机器人愿景和 Tencent
              背景可信度支撑公司；技术团队履历公开记录很薄；量产执行未证明，也缺少团队厚度或继任缓释的公开证据。上述风险会通过收入偏弱、利润率受压、融资受限，最终传导为估值倍数压缩。
