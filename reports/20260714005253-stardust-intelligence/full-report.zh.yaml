      - number: '5.3'
        title: 部署、路线图与制造
        blocks:
          - type: paragraph
            body: >-
              部署 Stardust 人形机器人遵循可重复的运营流程：界定任务或场景，在现场集成并配置机器人，完成安全验证和操作员培训，通过 Lumo/DuoCore
              技术栈运行自主作业，持续维护和保养执行器，并在价值被证明后扩展到更多设备或站点。 路线图从 S1 研究首秀（2024）推进到 T1 大众市场发布（2026 年 5 月），再到 2026
              年无锡（梁溪）工厂扩产——这一步将检验由设计简化和中国密集零部件供应链支撑的 RMB89,900 低价，能否在规模化下维持。T1 的 23-DoF 全人形形态，天生比 S1
              的轮式双臂底座更难可靠制造，执行风险更高。关键依赖覆盖执行器和缆绳供应商、传感器、国内机器人供应链，以及 AI
              算力；最后一项受半导体出口限制影响，暴露中国机器人产业风险。因此，制造扩张与供应韧性是近期技术执行问题。
