    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              Stardust Intelligence 以 Astribot 品牌运营，中文名为星尘智能（Xingchen Zhineng），是一家深圳人形机器人公司，由 Tencent Robotics X 首位工程师、前
              Baidu Xiaodu 机器人团队负责人 Lai Jie 于 2022 年 12 月创立。法律实体为 Astribot (Shenzhen) Co., Ltd.。
              公司的核心技术押注是绳/缆驱动（肌腱）执行机构；公司认为，相比传统电机驱动关节，该方案能做出更轻、更安全、更柔顺的人形机器人。Stardust 采用全栈 Design for AI（DFAI）架构，把自有 AI
              模型、具身操作系统和绳驱动机体接在一起。商业上，公司向工业、零售、研究和教育领域的企业买家销售硬件，定位于「Physical AI」商业化，而不是纯研发演示。主打产品是 S1 双臂机器人，以及 2026 年 5
              月发布的 T1 人形机器人。
