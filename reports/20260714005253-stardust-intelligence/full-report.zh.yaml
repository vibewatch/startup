            body: >-
              客户结论是：Stardust 确实产生了强劲早期需求信号，但耐久、有效采用的证据很薄。积极面看，SEER
              千台级订单是真实且同类首创的工业里程碑，多城市部署显示运营覆盖面，教育和开发者渠道也在政策支持的中国需求环境中提供多元化选项。
