      - number: '5.4'
        title: 信任、安全、合规与结论
        blocks:
          - type: paragraph
            body: >-
              信任与安全证据比能力叙事更薄。中国 HEIS 2026 国家标准为 Stardust 适用的安全和互操作要求定下新框架，深圳 2026 年推出的具身 AI
              责任保险也显示，人形机器人部署的合规框架正在成熟。绳驱动设计借助低惯量肢体，合理上有助于交互安全；安全控制还必须覆盖碰撞避免和力限制。 但公司层面的证据稀缺：认证、安全测试结果、执行器
              MTBF、数据/隐私政策均未披露，质量与合规披露构成实质缺口。因此产品/技术结论是双面的：Stardust 拥有真实且已展示的灵巧性领先，以及独特、看似可防守的执行方案；但大规模可靠性未证实，AI
              基准记录未披露，合规透明度也很薄。技术尽调应优先获取独立可靠性和灵巧性基准、执行器耐久数据、AI 模型评估，以及标准认证证据，再把技术主张纳入投资判断。
