      - number: '2.4'
        title: 增长驱动、约束与有争议的估算
        blocks:
          - type: paragraph
            body: >-
              市场顺风很强：低于 RMB90,000 的人形机器人代表成本快速下行，HEIS 2026 成为全球首个国家标准，MIIT/SASAC 部署项目创造国资背景需求。大量资本正在涌入——2025 年前 11 个月，具身
              AI 融资超过 RMB33.5B，约为上一年的四倍；2026 年至今，机器人融资轮次超过 500 起，总额约 RMB96B，科技巨头和车企也在入场。 但约束同样真实且已有明确记录：ROI
              尚未证明，可靠性、电池和安全限制仍在，半导体进口限制会封顶 AI 进展，Morgan Stanley
              等银行和中国官方反复提示泡沫与产能过剩风险。国家标准会降低碎片化，但全行业采用需要时间。尽调中，市场估算分歧以及订单公告与已验证生产 ROI
              之间的落差，是两个核心未解问题；最悲观的分析师观点应被加权，而不是被忽略。
