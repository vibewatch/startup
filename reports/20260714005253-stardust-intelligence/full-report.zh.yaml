      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              公司的公开形象几乎绑定在创始人、董事长兼 CEO Lai Jie 身上。他履历覆盖 Tencent Robotics X（首位工程师）和 Baidu Xiaodu 机器人项目，据报道拥有约 16
              年机器人经验。创始工程团队很大程度上来自同一批 Tencent Robotics X 人才，Dai Yuan 被列为联合创始人。
              这种集中度强化了技术可信度，但也带来明确的关键人物风险：几乎所有媒体报道、产品叙事和投资人沟通都经由 Lai Jie；公开资料没有继任者、具名 COO 或完整高管团队。治理披露很薄——即便 Series B
              引入多家战略和国资背景投资方，公司也没有披露董事会名单、控制权安排或持股比例。尽调应优先确认股权结构、董事会构成，以及投资方是否拥有控制权或否决权；同时摸清创始人之下技术梯队的厚度。
