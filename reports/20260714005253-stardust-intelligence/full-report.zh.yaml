      - number: '1.3'
        title: 融资历史、估值与资本结构
        blocks:
          - type: paragraph
            body: >-
              Stardust Intelligence 在资本栈上推进很快。中文数据库显示，2023 年 Yunqi Partners 领投天使轮，2024 年 Matrix Partners China 领投 Pre-A
              轮，随后 Jinqiu Capital 和 Ant Group 参与 A 轮；聚合平台估算累计融资约 $150M。最醒目的事件是 2026 年中的 Series
              B：中文财经媒体称，公司在约三个月内连续完成三轮融资，总额超过 RMB1B，China Renaissance 担任独家财务顾问。 已披露的 Series B 投资方包括 Thundersoft、Kede
              Education、Liangxi fund、Yangzhou Longtou 核心芯片基金和 Zhongbo Juli。该轮把公司估值推过 RMB10B（约 $1.38B），正式进入独角兽行列，也强化了深圳具身
              AI 集群。Thundersoft 的参与尤其具战略性，不只是资本，还带来操作系统、制造和渠道协同，目标指向千台级规模。逐轮融资金额、持股比例和优先权条款仍未披露。
