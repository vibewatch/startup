      - number: '2.2'
        title: 市场规模与增长
        blocks:
          - type: paragraph
            body: >-
              衡量中国人形机器人市场需要多重视角，因为公开估算差异极大。EmbodiedGlobal 给出的 2026 年中国规模接近 RMB104.7B，其他口径则高达 RMB1,047B；分析师还描述，未来十年 CAGR
              超过 65%。全球看，Axis Intelligence 估算 2026 年行业收入约 $6.24B，Goldman Sachs 预计 2035 年全球 TAM 约
              $38B，更长期的银行预测则设想本世纪中叶达到万亿美元级市场。 按单位计，Morgan Stanley 预测 2026 年中国人形机器人销量约 50,000 台。中国的结构性主导地位很清晰：2025
              年约占全球产量 90%，2026 年约占出货量 85%，预计产量同比增长约 94%。放在这些数字面前，Stardust 的可服务可获取市场近期只是以数千台计的早期小切片。估算跨度很宽——其中保留了一个真实的
              RMB1,047B 离群值——本身就是需要纳入尽调的重要发现。
