companyProfile:
  summary: >-
    Stardust Intelligence（Astribot，星尘智能）是一家总部位于深圳的人形机器人创业公司，2022 年 12 月由前 Tencent Robotics X 工程师 Lai Jie 创立。
    公司以绳/缆驱动（肌腱驱动）执行器技术见长，并称该技术可让人形机器人更轻、更安全。2026 年中，公司通过连续三轮 Series B 融资跻身独角兽，估值超过 RMB10B（约 $1.38B），融资额超过 RMB1B；China
    Renaissance 担任顾问，投资方包括 Thundersoft、Kede Education、Liangxi fund 等。 继 S1 研发平台之后，公司于 2026 年 5 月推出 T1 人形机器人，起价
    RMB89,900；据报道，工业、零售和教育客户已给出千台级订单，部署覆盖约六个中国城市。
