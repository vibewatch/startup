        title: 客户基础与细分
        blocks:
          - type: paragraph
            body: >-
              Stardust 的客户集中在三大主要细分市场，外加研究和开发者渠道。工业和物流买家——以 SEER
              为代表——用企业资本开支采购，目标是物料搬运和重复任务自动化；这是目前最具体、规模最大的需求。零售和商业买家在多个城市部署 T1，用于面向客户的服务，但具名账户有限，报道更多停留在场景层面。
              教育和职业培训买家通过 Kede Education 渠道采购训练设备，依托机构或政府预算，形成可重复但单台规模不大的需求；研究买家则采购 S1 作为操控测试平台。第五条早期渠道是通过 CHTF 开发者平台
              MOU
              触达的开发者和集成商。各细分市场中，买家、用户和付款方经常不同——例如学校采购办、学生和政府预算——这会拉长销售周期。无锡和深圳的政府与市政项目也通过场景资金塑造销售管线。公司报告已在约六个中国城市部署，说明运营覆盖面存在，即便单站点深度仍不清楚。
