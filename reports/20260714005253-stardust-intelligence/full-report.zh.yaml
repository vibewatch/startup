      - number: '7.2'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              运营风险集中在 Stardust 用来差异化的同一项技术上。绳/缆驱动执行器在持续商业规模下的可靠性未被证明，是最重要的单一技术风险；缆绳磨损和复杂肌腱走线是公认工程挑战，可能推高维护和故障率，公开资料也没有
              MTBF 或现场故障数据。无锡新工厂扩产带来执行、良率和营运资金风险，且连续性依赖单一旗舰工厂，风险进一步叠加。
              公共和商业场景中的人机交互安全——碰撞和力风险——需要稳健控制；低惯量柔顺绳驱动肢体可部分帮助，但没有公开安全测试数据支撑。质量与认证证据同样未披露。按严重性排序，大规模执行器故障（关键影响，缓释成熟度低）和无锡爬坡不达预期（高影响）是主要运营暴露；两者缓释都不成熟，残余风险为实质到高。
