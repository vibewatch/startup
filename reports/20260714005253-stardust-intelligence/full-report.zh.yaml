            body: >-
              缓释手段有，但仍在早期。Stardust
              刚完成的新股权融资、战略股东、与新兴标准接轨、可获得责任保险，以及产品布局分散到多个场景，能压低部分风险；但没有一项能中和核心技术和财务风险，因此多数类别的剩余敞口仍处于重大到关键水平。投资人应盯住一组可监测触发项和止损标准：执行器现场失效率、无锡量产计划下的实际交付量、毛利率披露、融资续航和新轮融资进展、美国立法状态，以及客户订单多元化。最核心的推翻投资假设事件包括：出现系统性执行器故障证据、无锡产能爬坡失败，或融资市场冻结导致公司无力为扩产供血；美国市场准入禁令会显著压缩可服务市场。总体风险判断为很高，主要由未经验证的技术可靠性、财务不透明，以及上升中的监管和地缘政治敞口驱动。剩余未解缺口是：公司几乎没有披露运营、可靠性和团队数据，无法更精确量化风险。
            claimRefs:
