      - number: '8.3'
        title: 可比估值与市场背景
        blocks:
          - type: paragraph
            body: >-
              可比人形机器人估值同时勾勒机会和泡沫。中国方面，Unitree 正以约 $7B 估值推进 IPO，Galbot 估值约 $3B；UBTech
              作为上市公司，提供了公开市场的现实校准，其交易所估值通常低于热门私募轮次暗示的倍数。美国方面，Figure AI（约 $39B）和 Apptronik（约
              $5.5B）说明，在另一套资本市场和炒作环境里，私募估值可以跑到多远。对照这些公司，Stardust 约 $1.38B 的估值低于头部公司，符合其更早的商业化阶段。市场侧，Goldman Sachs 预计
              2035 年全球人形机器人 TAM 约 $38B，中国占全球人形机器人产量的绝大多数，支撑可信的国内基准增长路径；更投机的万亿美元叙事也存在，但距离太远，不应锚定近期价值。AgiBot、Fourier
              等更多国内玩家进入，扩大了可比样本，也加剧了同一批资本和客户的竞争，压低相对估值。分析师还警告，中国产量增速快于已验证需求，这会冲击任何乐观可比估值里隐含的增长假设。
