              财务结论是：Stardust 资本充足，但收入不透明。公开证据确认了强劲股权资金基础、激进 T1
              定价和真实订单信号，却无法建立收入、利润率、现金消耗、资金跑道或客户级经济性——这些全部未披露。因此估值与收入的关系无法衡量，这是最重要的尽调阻断项。 融资事实截至 2026
