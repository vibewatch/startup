  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与组合
        blocks:
          - type: paragraph
            body: >-
              Stardust 打造能在客户工作流中执行物理任务的通用人形机器人。产品组合以两款硬件平台和一套软件栈为中心。S1 是双臂轮式系统，手臂 7-DoF，单臂载荷约 5 kg；它于 2024 年 8 月在 World
              Robot Conference 首秀，并以最高约 10 m/s 的末端执行器速度和约 0.1 mm 的重复定位精度吸引全球关注——以人形机器人级操控器而言，这是异常突出的灵巧性。 T1 于 2026 年 5
              月发布，定价 RMB89,900，是一款全人形机器人，高约 1.53-1.55m，重约 66kg，23 个自由度，单臂载荷约 5
              kg；定位是家庭、商业、科研/教育、文旅和轻工业场景中的轻量操控，而不是重工业负载。硬件之上是 Design-for-AI 软件栈——Lumo AI 模型负责感知、规划和操控，DuoCore 具身 OS
              则被公司定位为第三方应用平台。产品成熟度最高的是已展示的 S1 和核心执行器；最早期的是 T1 的规模化可靠性，以及 AI 层经过基准测试的能力。
