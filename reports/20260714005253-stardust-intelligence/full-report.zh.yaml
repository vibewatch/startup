      - number: '7.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 执行器可靠性未验证，是最大技术风险
            body: 绳 / 缆驱动执行器是 Stardust 的差异化来源，但商业规模下的可靠性尚未验证，也没有公开 MTBF 或现场故障数据。若执行器出现系统性故障，投资假设就会失效。
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR028
          - type: callout
            title: 地缘政治和融资风险持续抬升
            body: 美国立法动向若禁止中国机器人，可能给扩张设上限；行业泡沫预警会削弱资本可得性，也可能引发压垮毛利的价格战，进一步放大财务模型风险。
            calloutType: risk
            claimRefs:
              - CR002
              - CR007
              - CR032
          - type: callout
            title: 加大敞口前，先盯住明确止损标准
            body: 重点监控执行器现场失效率、无锡交付爬坡、毛利率披露、融资续航和美国立法状态。系统性执行器故障、爬坡失败或融资冻结，都应触发退出。
            calloutType: recommendation
            claimRefs:
              - CR027
              - CR028
              - CR029
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与论点
        blocks:
          - type: paragraph
            body: >-
              我们的建议是跟踪，整体评分 6.2/10，置信度低到中等。判断链条很清楚：公司确有早期牵引力——千台级订单、多城市部署、旗舰产品已按商业价格销售——也有差异化的绳 /
              缆驱动架构；但风险极高、财务披露很薄，我们认为现估值相对已验证基本面偏贵。多头逻辑是，绳驱差异化叠加先发商业定价和政策支持的国内需求，可能在未来大市场里换来超额份额。反面论点同样站得住：核心执行器技术尚未在规模化场景验证，订单更像集中签单，而非已交付价值，单台经济性未披露，来自
              Unitree-AgiBot
              双寡头的竞争激烈，地缘政治限制可能给全球扩张封顶。两套叙事都合理；要判断孰是孰非，所需披露仍然缺位，因此现在承诺资本不如先监控明确触发项。若披露的单台经济性转正，且执行器可靠性在规模上获得独立验证，可上调至买入。
