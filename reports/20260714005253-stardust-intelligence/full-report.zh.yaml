      - number: '8.4'
        title: 推翻投资假设的触发项与尽调问题
        blocks:
          - type: paragraph
            body: >-
              投资逻辑取决于尚未披露的事实，因此我们把风险转成可监控触发项和必须过关的尽调问题。主要推翻投资假设的触发项包括：系统性执行器故障证据、无锡产能爬坡失败、财务披露后持续负毛利，或融资市场冻结；被双寡头挤出、美国禁令落地是次级触发项，但会迫使
              TAM 重新评估。需要跟踪的投资 KPI 是实际交付量、毛利率、订单积压转化、融资续航和现场失效率。投资前必须完成的尽调问题包括：经审计财务、按产品拆分的单台经济性、执行器可靠性和 MTBF
              数据、订单到交付的转化证据、股权结构和融资条款，并审阅团队与组织架构以评估执行纵深。若财务和可靠性问题给出正面结果，可支持从跟踪上调到买入；若未通过，或触发任一推翻投资假设的信号，则应放弃。关键未解缺口在于，几乎所有基本估值输入——收入、毛利和可靠性数据——都未披露，估值判断精度因此被封顶。
