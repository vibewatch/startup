      - number: '2.3'
        title: 买家、细分市场与采用路径
        blocks:
          - type: paragraph
            body: >-
              需求来自多元买家。工业和物流运营方用企业资本开支采购，用于自动化重复或危险的物料搬运；零售、文旅和酒店场所采购面向客户的服务与差异化体验；高校和实验室用科研经费采购研究平台；职业学校和高校采购训练设备，资金常来自政府或机构预算，并经
              Kede Education 等渠道。 各细分市场的采用路径通常从演示和展示兴趣开始，进入付费试点，再到有限生产，最后才是多站点规模化铺开和扩张——每一步都要用已验证 ROI
              过关。许多已部署人形机器人仍只达到人类效率的 20-30%，因此从试点转向规模化生产才是关键瓶颈。CHTF、Hong Kong InnoEx 2026
              等公开展示显示兴趣上升，政府部署项目也会缩短政策支持垂直领域的采购周期，但真正的生产经济性仍是闸门。
