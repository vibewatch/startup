      - number: '5.2'
        title: 架构与绳驱动差异化
        blocks:
          - type: paragraph
            body: >-
              核心技术选择是绳/缆驱动（肌腱驱动）执行。Stardust 不把沉重电机和齿轮箱放在每个关节，而是把电机移到躯干，再通过缆绳向四肢传力。这样降低了肢体惯量，支撑 S1
              展示出的高速和柔顺性；因为更轻、低惯量的肢体在接触时危险性更低，也可能提升人机交互安全。 大多数竞争者——包括 Unitree G1 和 Fourier GR
              系列——依赖传统电机或谐波减速关节，因此该路径确实是差异化点，也是 Stardust IP 和技术诀窍的核心，尽管公开专利覆盖宽度并不详细。完整技术栈把 Lumo AI 模型和 DuoCore OS
              叠在这一机体之上，公开 GitHub
              存在则显示公司有意培育开发者生态。关键但书是可靠性：复杂肌腱走线和缆绳磨损是公认工程挑战，绳驱动执行器在持续商业负载下的长期耐久性和维护负担尚未被独立验证。灵巧性领先在演示中真实存在，但还没有在标准化、独立基准中证明。
