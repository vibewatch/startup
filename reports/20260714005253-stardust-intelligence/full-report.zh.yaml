  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与地缘政治风险
        blocks:
          - type: paragraph
            body: >-
              监管和法律暴露是最高层级风险，并带有鲜明地缘政治边缘。中国国内发布了全球首个面向人形机器人和具身 AI 的 HEIS 2026
              国家标准，既让赛道获得合法性，也在扩产期间带来认证工作量和合规成本；中国《民法典》带来缺陷机器人产品责任，深圳新的具身 AI 责任保险可部分缓释；包括 AI 法草案在内的 AI 治理制度演进，未来可能增加义务。
              更尖锐的风险来自外部：美国立法者提出法案——包括 House Select Committee 法案和 American Security Robotics Act——禁止或限制政府采购中国人形机器人；拟议中的
              GUARD Act 则会把 FCC 覆盖名单框架扩展到机器人。这些措施反映出针对中国机器人的战略安全审查上升，可能封顶 Stardust
              的国际扩张，收窄其可触达市场。中外标准碎片化还可能进一步提高出口合规摩擦。本评估截至 2026 年中，反映最新标准与立法活动。
