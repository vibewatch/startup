      - number: '8.2'
        title: 估值、情景与敏感性
        blocks:
          - type: paragraph
            body: >-
              Stardust 估值在 2026 年中超过人民币 100 亿元（约 $1.38B），约三个月内连续完成三轮 Series B 融资，合计超过人民币 10 亿元，累计融资约 $150M，由 China
              Renaissance 担任顾问。关键问题是，公司没有公开收入、ARR
              或毛利率，因此无法计算基于基本面的倍数；这一定价反映的是前沿龙头可选性，而非已验证经济性。估值敏感性主要受假设销量、毛利率和终局市场份额支配，TAM
              兑现节奏是次要变量，因为机会很大但仍很远。不同情景下结果区间很宽：牛市情景假设无锡扩产成功、执行器可靠性获得验证、多行业订单转成交付，可产生高回报倍数；基准情景假设商业化逐步推进，并在增长但竞争激烈的中国市场拿到适度份额，对应中等结果；熊市情景——执行器或制造失败、融资冻结，或被双寡头挤出——意味着大幅减值。若人形机器人热度降温，行业泡沫和产能过剩预警会增加倍数压缩风险，进一步支持估值偏贵的判断。本数据截至
              2026 年中。
