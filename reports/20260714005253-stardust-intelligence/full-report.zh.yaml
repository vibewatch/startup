            body: >-
              Stardust 财务问题的核心，是一台人形机器人能否以 RMB89,900 盈利出售。公司没有披露毛利率、BOM 成本、CAC 或单台服务成本，因此几乎所有单位经济指标都是空白。低于 RMB90,000
              的激进价格，是公司有意扩大市场的动作，也受益于中国密集且低成本的供应链；但它直接提出了利润率能否持续的问题，因为人形机器人 BOM 成本仍高，全球供应链约束还可能在扩产时推高零部件价格。
              已部署机器人还需要持续服务和支持，交付成本会上升；行业分析师也强调，人形机器人的单位经济在全行业尚未证明，ROI 取决于真实世界有效产出。唯一外部锚点是上市同行
              UBTech，其公开财务显示，在高估值之下，人形机器人厂商仍在亏损。合理的基准判断是，Stardust 近期贡献利润率很薄或为负，靠股权融资而非经营现金流支撑——这一假设必须用真实利润率桥来验证。
