  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与进入者
        blocks:
          - type: paragraph
            body: >-
              Stardust 所处的是 2026 年最拥挤的科技市场之一：中国已有 50 多家人形机器人开发商，还有美国主要玩家。中国市场实际上接近双寡头，Unitree 和 AgiBot 合计约占国内 80%
              份额。Unitree 据称以近 $7B 估值冲刺 IPO，拥有品牌强度、病毒式演示和约 $16,000 的低成本 G1 人形机器人。AgiBot（Zhiyuan）凭借重度国资和投资人支持推进量产。
              资金充足的同行还包括估值约 $3B 的 Galbot、上市公司 UBTech 及其 Walker 系列、以康复起家的 Fourier 及其 GR 系列，以及 EngineAI
              等新兴创业公司。海外方面，Figure AI（约 $39B）、1X（Neo 约 $20,000）、Apptronik（约 $5.5B）和 Tesla Optimus
              都掌握巨额资本。潜在新进入者——Alibaba、ByteDance 等科技巨头，以及 BYD、XPeng 等车企——会进一步加剧竞争。在这个背景下，Stardust 虽然融资速度很快，但仍是体量相对较小的挑战者。
