    approximationNotes: 收入 / 烧钱区间有意排除 —— 没有公开依据可给出边界。
  - id: FI004
    title: 资本强度 / 现金流图
    type: flow
    layout: standard
    data:
      nodes:
        - id: equity
          label: 股权融资：B 轮 > RMB1B + 此前轮次
        - id: rd
          label: 研发：AI 模型、OS、绳驱执行器
        - id: capex
          label: 资本开支：无锡量产基地
        - id: workingcap
          label: 营运资本：库存 + 零部件
        - id: deployment
          label: 约 6 个城市的部署 / 服务
        - id: burn
          label: 现金消耗（未披露）-> 下一轮融资触发点
      edges:
        - from: equity
          to: rd
        - from: equity
          to: capex
        - from: capex
          to: workingcap
        - from: workingcap
          to: deployment
        - from: deployment
          to: burn
    claimRefs:
      - CI007
      - CI011
      - CI013
      - CI028
      - CI036
    summary: 股权资本流向：研发、制造资本开支、营运资本和部署。
    approximationNotes: 现金流规模为定性；只有融资额已量化。
  - id: FE001
    title: 产品架构图
    type: stack
    layout: standard
    data:
      layers:
        - label: 应用 / 场景
          detail: 家庭、商业、科研 / 教育、旅游、轻工业
        - label: AI 模型（Lumo）
          detail: 具身智能：感知、规划、操作
        - label: 具身 OS（DuoCore）
          detail: 机器人控制与第三方应用平台
        - label: 绳 / 缆驱动机身
          detail: 躯干电机通过缆绳向柔顺肢体传力
        - label: 感知与驱动硬件
          detail: 视觉、力觉、本体感知；肌腱执行器
    claimRefs:
      - CE003
      - CE004
      - CE009
      - CE017
      - CE027
    summary: DFAI 全栈从应用场景一直下探到绳驱硬件。
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: standard
    data:
      nodes:
        - id: scope
          label: 界定任务 / 场景（如搬运、服务）
        - id: integrate
          label: 现场集成并配置机器人
        - id: validate
          label: 安全验证与操作员培训
        - id: operate
          label: 通过 Lumo/DuoCore 自主运行
        - id: maintain
          label: 维护与执行器服务
        - id: expand
          label: 扩展到更多台数 / 站点
      edges:
        - from: scope
          to: integrate
        - from: integrate
          to: validate
        - from: validate
          to: operate
        - from: operate
          to: maintain
        - from: maintain
          to: expand
    claimRefs:
      - CE007
      - CE022
      - CE009
      - CE016
