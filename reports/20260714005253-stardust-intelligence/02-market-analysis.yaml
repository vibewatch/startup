chapter:
  number: 2
  title: Market Analysis
  summary: Stardust Intelligence sells into China's humanoid / embodied-AI robotics market, one of the
    fastest-growing and most policy-supported technology markets of 2026. China accounted for roughly
    90% of global humanoid output in 2025 and output is forecast to surge ~94% in 2026, with sizing estimates
    for the China market ranging widely from tens of billions to over RMB1 trillion RMB depending on methodology.
    Buyers are enterprises across industrial, retail/commercial, tourism, research, and education segments,
    with strong state and municipal backing. Growth is driven by cost declines, national standards, and
    government deployment programs, but constrained by unproven ROI, reliability limits, and explicit
    bubble warnings.
sections:
- id: market-boundary
  title: Market Boundary and Substitutes
  body: Stardust competes in China's market for enterprise service and light-industrial humanoid robots
    - bipedal or dual-arm systems sold to organizations for real tasks - a subset of the broader embodied-AI
    landscape. In-market spend covers general-purpose and light-industrial humanoids, education and research
    units, and retail/tourism service robots. Excluded from the boundary are quadruped robots (e.g., Unitree's
    Go line), fixed factory automation and PLC-driven cells, and standalone collaborative arms, which
    are treated as substitutes or adjacencies rather than direct market. The most important status-quo
    substitute remains human labor, followed by fixed automation and cobots for structured tasks. This
    boundary matters because headline 'humanoid market' figures often blend these categories; defining
    Stardust's addressable slice as enterprise humanoids clarifies which demand and competitors are truly
    relevant and prevents overstating the reachable opportunity. In practice the boundary is porous at
    the edges, because a buyer weighing a humanoid will also price a cobot or additional shift labor for
    the same task, so competing budgets extend well beyond named humanoid vendors.
  claimRefs:
  - CM011
  - CM012
  - CM013
  - CM022
  - CM036
  tableRefs:
  - TM001
  figureRefs:
  - FM003
- id: market-sizing
  title: Market Sizing and Growth
  body: Sizing the China humanoid market requires multiple lenses because published estimates diverge
    dramatically. EmbodiedGlobal cites a 2026 China figure near RMB104.7 billion, while other framings
    reach as high as RMB1,047 billion, and analysts describe CAGRs above 65% into the next decade. Globally,
    Axis Intelligence estimates 2026 sector revenue near $6.24 billion, and Goldman Sachs projects a roughly
    $38 billion global TAM by 2035, with longer-run banks envisioning trillion-dollar-scale markets by
    mid-century. On a unit basis, Morgan Stanley forecasts about 50,000 China humanoid sales in 2026.
    China's structural dominance is clear - about 90% of global output in 2025 and roughly 85% of shipments
    in 2026, with output forecast to surge about 94% year-on-year. Against these figures, Stardust's serviceable
    obtainable market is a small early slice measured in thousands of units near-term. The wide dispersion
    of estimates - a genuine RMB1,047B outlier included - is itself a material finding preserved for diligence.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
