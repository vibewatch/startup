- id: buyers-adoption
  title: Buyers, Segments, and Adoption Path
  body: Demand originates from a diverse buyer set. Industrial and logistics operators buy to automate
    repetitive or dangerous material handling, funded by corporate capex; retail, tourism, and hospitality
    venues buy customer-facing service and differentiation; universities and labs buy research platforms
    on grants; and vocational schools and universities buy training units, frequently on state or institutional
    budgets and through channels like Kede Education. Across segments the adoption path runs from demo
    and showcase interest, to a paid pilot, to limited production, and only then to scaled multi-site
    rollout and expansion - each stage gated by demonstrated ROI. Because many deployed humanoids still
    operate at only 20-30% of human efficiency, conversion from pilot to scaled production is the critical
    bottleneck. Public showcases such as CHTF and Hong Kong's InnoEx 2026 signal rising interest, and
    government deployment programs shorten procurement in policy-backed verticals, but genuine production
    economics remain the gating factor.
  claimRefs:
  - CM013
  - CM016
  - CM019
  - CM021
  - CM022
  - CM026
  - CM031
  tableRefs:
  - TM003
  figureRefs:
  - FM004
- id: drivers-constraints
  title: Growth Drivers, Constraints, and Contested Estimates
  body: 'The market''s tailwinds are strong: sharp cost declines exemplified by sub-RMB90,000 humanoids,
    the world-first HEIS 2026 national standards, and MIIT/SASAC deployment programs that create state-backed
    demand. Massive capital is flowing - embodied-AI financing exceeded RMB33.5 billion in the first eleven
    months of 2025 (about four times the prior year), and 2026 has seen over 500 robotics financing rounds
    worth roughly RMB96 billion, with tech giants and carmakers entering. Yet the constraints are equally
    real and explicitly documented: unproven ROI, reliability, battery and safety limits, semiconductor
    import restrictions capping AI progress, and repeated bubble and overcapacity warnings from banks
    such as Morgan Stanley and from Chinese officials. National standards will reduce fragmentation but
    take time to adopt industry-wide. For diligence, the divergence of market estimates and the gap between
    order announcements and proven production ROI are the central unresolved questions, and the most bearish
    analyst views should be weighted, not dismissed.'
