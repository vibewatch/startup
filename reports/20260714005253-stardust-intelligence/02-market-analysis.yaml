callouts:
- calloutType: strength
  title: Structural tailwinds and Chinese output dominance
  body: China's ~90% share of 2025 global humanoid output, ~94% forecast output growth in 2026, national
    standards, and state deployment programs give Stardust a uniquely supportive home market with abundant
    capital and policy demand.
  claimRefs:
  - CM001
  - CM002
  - CM014
  - CM015
- calloutType: risk
  title: Estimates diverge wildly and ROI is unproven
  body: China 2026 market estimates span from tens of billions to over RMB1 trillion RMB, and deployed
    humanoids often run at just 20-30% of human efficiency. The gap between hype-driven sizing and proven
    production ROI is the market's central risk.
  claimRefs:
  - CM004
  - CM018
  - CM019
- calloutType: insight
  title: Cost leadership is redefining the addressable market
  body: By pricing humanoids below RMB90,000, Chinese makers including Stardust are expanding the addressable
    buyer pool beyond research labs into education, retail, and light industry - the key mechanism converting
    a research market into a commercial one.
  claimRefs:
  - CM017
  - CM013
  - CM034
