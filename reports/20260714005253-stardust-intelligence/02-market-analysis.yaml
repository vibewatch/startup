  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: Reconciliation of divergent China 2026 humanoid market estimates (RMB100B vs RMB1,047B).
    whyItMatters: A 10x spread in market size undermines any top-down valuation anchored to market share.
    diligencePath: Commission or obtain a bottom-up sizing (units x ASP by segment) and reconcile against
      published figures.
    relatedQuestionRefs:
    - QM025
    - QM003
  - type: private-evidence-only
    severity: material
    topic: som
