callouts:
  - calloutType: risk
    title: Adoption can expand before reimbursement broadens
    body: >-
      The best evidence in the pool suggests oral convenience can create new demand quickly, but persistence, side
      effects, and payer policy still determine whether that early uptake becomes durable revenue.
    claimRefs: [CM004, CM005, CM006]
