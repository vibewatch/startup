chapter:
  number: 6
  title: "Customers"
  summary: "Kailera still presents as a precommercial obesity biotech, so the strongest customer evidence is trial participation and future access-channel logic rather than named paying accounts. The retained sources support meaningful clinical reach and a large end-market, but they do not show Kailera-specific renewals, payer wins, or production deployments."
sections:
  - id: "customer-surface"
    title: "Current customer surface is clinical, not commercial"
    body: "The retained evidence does not show a disclosed commercial customer base for Kailera today. Third-party market pages still describe the company as clinical-stage, list annual sales as not available, and note that broader commercial operations remain thinly disclosed. The clearest real-world user surface is KaiNETIC-1: a Kailera-sponsored obesity study spread across 110 locations, which demonstrates operational reach into patient and investigator workflows but does not yet prove paying demand, recurring use, or post-launch adoption. For this chapter, the practical buyer/user/payer segmentation is therefore future-facing: patients and prescribers as users, self-pay or reimbursed channels as payers, and Kailera itself as the current sponsor financing evidence generation."
    claimRefs: ["CU001", "CU003", "CU004", "CU005", "CU007"]
    tableRefs: ["TU001"]
  - id: "adoption-proof"
    title: "Adoption metrics are pipeline-operating metrics"
    body: "What Kailera can support publicly today is adoption of trial infrastructure, not product-market fit. ClinicalTrials.gov shows a randomized, double-masked ribupatide-versus-placebo design, and Fierce Biotech says IPO proceeds are earmarked to keep three global phase 3 trials running through the second quarter of 2028. That combination matters because it shows the company is building exposure among trial participants, sites, and investigators, while still waiting for the kind of evidence that commercial customers, payers, and prescribers will need before broad uptake. Even basic operating disclosure remains narrow: one public market page lists 145 employees, while another transcript snippet still frames key readouts as future events rather than reported commercial traction."
    claimRefs: ["CU002", "CU004", "CU005", "CU006", "CU012"]
    tableRefs: ["TU002"]
    figureRefs: ["FU001"]
  - id: "durability-and-expansion"
    title: "Expansion depends on access and tolerability, with no Kailera-specific retention proof yet"
    body: "The market context is large enough to matter, but the durability question is still unresolved for Kailera itself. IQVIA expects self-pay, employer programmes, and digital health platforms to remain important routes to patients, which suggests Kailera could reach users before broad reimbursement if its data are strong enough. But the same sources also show why retention is hard: persistence differs widely across brands and countries, tolerability is a common reason patients stop GLP-1 therapy, and competitor trial misses can quickly reset demand and market-share expectations. In other words, Kailera's expansion path likely runs through differentiated efficacy, acceptable side effects, and payer evidence rather than any currently visible land-and-expand base."
    claimRefs: ["CU008", "CU009", "CU010", "CU011", "CU013"]
    tableRefs: ["TU003"]
