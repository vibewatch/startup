    title: Product module / asset matrix
    columns:
      - Asset / module
      - Primary user / buyer context
      - Public maturity status
      - Differentiation signal
      - Diligence gap
    rows:
      - [Ribupatide injection (KAI-9531), Obesity prescribers and patients in late-stage development, Global Phase 3 KaiNETIC plus enrolled U.S. Phase 2b high-dose cohort, Lead asset with the deepest disclosed global program, No head-to-head global evidence versus Lilly or Novo products in assigned sources]
      - [Oral ribupatide, Obesity patients needing a non-injectable option, Planned global Phase 3 entry in H1 2027, Same molecule family extends Kailera beyond injectables, Global formulation/commercial readiness evidence is not public in assigned sources]
      - [KAI-7535, Obesity prescribers seeking follow-on modality optionality, Phase 2 at Kailera with China Phase 3 progress attributed to Hengrui, Adds a small-molecule once-daily injectable follow-on path, Cross-region reproducibility and eventual label strategy remain unclear]
      - [KAI-4729, Earlier-stage obesity program, Phase 1 in China / expected Phase 1 start by end-2026 in cited market commentary, Gives Kailera a tri-agonist style upside option, Very limited public mechanism and safety detail in assigned pool]
      - [Licensed ex-China portfolio wrapper, Kailera development organization and future commercial teams, Active licensing and co-development structure, Four-asset breadth outside a single lead program, Exact operational handoffs between licensor and licensee remain incompletely disclosed]
    notes: Public evidence mixes trial-stage facts with company or market commentary; null-equivalent gaps reflect missing public proof rather than negative evidence.
    claimRefs: [CE001, CE002, CE005, CE006, CE007]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job / workflow step
      - Current workflow
      - Kailera solution surface
      - Measurable benefit signal
      - Limitation
    rows:
      - [Treat obesity without diabetes in a late-stage trial setting, Weekly trial visits and placebo-controlled weight-loss measurement, Ribupatide injection in KaiNETIC-1, Primary outcome is percent change from baseline body weight at Week 76, Trial design is public but real-world adherence and launch workflow are not]
      - [Serve patients who may prefer non-injectable therapy, Future oral obesity-treatment workflow, Oral ribupatide slated for global Phase 3 in 2027, Creates a route-of-administration expansion path, No public global efficacy readout or commercial dosing workflow in assigned pool]
      - [Sequence follow-on mechanisms after the lead asset, Clinical-development portfolio management, KAI-7535 and KAI-4729 extend modality depth, Multiple programs reduce single-asset dependence, Public mechanism detail is shallow and later-stage evidence is not yet visible]
      - ["Run safety and quality surveillance through obesity trials", "Protocol-driven monitoring of efficacy, antibodies, and adverse events", "ClinicalTrials.gov endpoints include TEAEs and antibody monitoring", "Trust controls are visible at the study-design level", "Manufacturing QA and post-market pharmacovigilance processes are not publicly documented here"]
    notes: This table uses customer-workflow language where possible for a clinical-stage biotech; several downstream commercial steps remain unavailable in public evidence.
    claimRefs: [CE002, CE003, CE004, CE005]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process
      - Role
      - Dependency
      - Risk
    rows:
      - [License and territory split, Gives Kailera ex-Greater-China rights while China remains with Hengrui, Hengrui relationship and contract economics, Territory boundaries and change-of-control or manufacturing dependencies can complicate strategic flexibility]
      - ["Lead global trial execution", "Generates pivotal evidence for injectable ribupatide", "Trial enrollment, site execution, and eventual data cleanliness", "Delay or weaker global replication would undermine the main valuation thesis"]
      - [Clinical supply and tech transfer, Supports ongoing studies and future scale-up, Hengrui manufacturing clinical materials on request plus Kailera-funded territory work, Public evidence does not yet show commercial-scale CMC readiness or backup supply]
      - [Follow-on asset staging, Preserves optionality beyond a single injectable readout, Management capital allocation and Hengrui-origin data packages, Follow-on programs may still lag peers or fail to differentiate]
      - ["Public trust / disclosure surface", "Provides outsiders with operating evidence", "Assigned pool is thin on Kailera-authored technical docs and filing text", "Limited disclosure makes security, privacy, quality-system, and integration diligence hard to complete from public sources"]
    notes: Architecture here refers to development and operating architecture, not software architecture; missing fields reflect absent public documentation in the assigned source pool.
    claimRefs: [CE004, CE006, CE007, CE011, CE012]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Kailera's visible architecture is a layered clinical-development system spanning licensed rights, trial execution, follow-on assets, and evidence controls.
    data:
      layers:
        - label: Rights and sourcing layer
          detail: Ex-Greater-China rights from Hengrui define what Kailera can develop and eventually commercialize.
          modules:
            - label: Territory rights
              note: U.S., Europe, and Japan while Greater China stays with Hengrui
            - label: Asset package
              note: Four GLP-1-based obesity programs
          outputs:
            - label: Pipeline access
              note: Licensed platform breadth
          note: The core dependency is the licensor relationship, not a fully disclosed in-house discovery stack.
        - label: Lead clinical engine
          detail: Injectable ribupatide is the main value driver and the only deeply described global program in the assigned pool.
          modules:
            - label: KaiNETIC program
              note: Global Phase 3 plus U.S. Phase 2b context
            - label: Patient population
              note: Adults with obesity or overweight with comorbidities and no diabetes
          outputs:
            - label: Pivotal evidence
              note: 2027-2028 readout path
        - label: Follow-on route expansion
          detail: Oral ribupatide adds route-of-administration optionality beyond weekly injection.
          modules:
            - label: Oral ribupatide
              note: Planned global Phase 3 in 2027
          outputs:
            - label: Convenience thesis
              note: Non-injectable obesity pathway
        - label: Portfolio hedge layer
          detail: KAI-7535 and KAI-4729 broaden modality optionality if the lead asset disappoints.
          modules:
            - label: KAI-7535
              note: Kailera Phase 2 / Hengrui China Phase 3 context
            - label: KAI-4729
              note: Early tri-agonist style option
          outputs:
            - label: Additional shots on goal
              note: Breadth outside a single molecule
        - label: Quality and safety controls
          detail: Publicly visible controls are mostly clinical-study controls rather than commercial operating controls.
          modules:
            - label: Trial design
              note: Randomized, parallel, double-masked
            - label: Safety endpoints
              note: TEAEs, antibodies, biomarker follow-up
          outputs:
            - label: Trust signal
              note: Protocol discipline
        - label: Public proof gap layer
          detail: The weakest layer is commercial and technical transparency outside trials.
          modules:
            - label: Disclosure surface
              note: Nasdaq page lacked key operating data; SEC browse capture was unusable
            - label: Missing external proxy
              note: No practitioner or developer signal in assigned pool
          outputs:
            - label: Diligence blocker
              note: Hard to verify scale-up and controls from public evidence alone
    claimRefs: [CE001, CE003, CE006, CE011, CE012]
