      - number: '5.2'
        title: Development architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The technical architecture visible in public evidence is a partnership operating model more than a
              standalone drug-engineering stack. Kailera controls ex-Greater-China rights, funds territory development,
              and is using IPO proceeds to carry multiple programs forward, but Hengrui remains central to the original
              asset package and, according to the quoted licensing summary, manufactures clinical materials on request.
              ClinicalTrials.gov gives the clearest reader-visible quality-control evidence: the lead KaiNETIC study is
              randomized, parallel-assignment, and double-masked, with weight, biomarker, antibody, and adverse-event
              endpoints that fit a disciplined late-stage obesity program. Even so, the assigned pool does not give a
              Kailera-authored CMC, device, pharmacovigilance, or launch-operations surface, so manufacturing transfer
              and commercialization readiness remain underdocumented.
            claimRefs:
              - CE003
              - CE004
              - CE006
