              - CU005
              - CU007
          - type: callout
            title: Commercial upside is real, but the bottleneck is durability
            body: >-
              The market is large and access channels exist, yet persistence, tolerability, and reimbursement evidence
              are what turn initial demand into durable adoption.
            calloutType: insight
