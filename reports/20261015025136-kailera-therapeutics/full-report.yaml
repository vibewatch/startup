companyProfile:
  summary: >-
    Kailera Therapeutics is a public, clinical-stage obesity biotech with a four-asset GLP-1-based pipeline licensed
    from Jiangsu Hengrui. The company now trades as KLRA on Nasdaq, is headquartered in Waltham, Massachusetts, and has
    been recapitalized through a $400 million Series A, a $600 million Series B, and a record-scale 2026 IPO. Its
    product story remains centered on ribupatide and other follow-on obesity assets, while its commercial profile is
    still pre-revenue and evidence-led rather than customer-led.
