              - CR013
      - number: '7.2'
        title: Regulatory and clinical risk remain the chapter's kill-criteria core
        blocks:
          - type: paragraph
            body: >-
              Public evidence still points to a long path from promising China-derived data to a fully de-risked global
              obesity asset. Xtalks and BioSpace both tie Kailera's story to 2027-2028 milestones, while the assigned
              ClinicalTrials.gov record shows at least one large, multi-site, randomized study with a Week 76 primary
              endpoint and safety follow-up beyond that. The implication is that regulatory momentum still depends on
              sustained trial execution, bridging confidence from China data into global populations, and the absence of
              class-safety surprises that have already hurt other oral GLP-1 programs. Until global readouts arrive,
              most of the evidence still describes plans, study design, or prior China outcomes rather than completed
              multinational proof.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR008
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
              - CR012
      - number: '7.3'
        title: Operational, dependency, and visibility gaps are manageable but still material
        blocks:
          - type: paragraph
            body: >-
              Kailera's public-company disclosure surface is broader than a private biotech's, but this worker's
              assigned pool still left several critical gaps. The BioPharma Dive and archived PubMed URLs did not
              deliver usable underlying articles, the assigned EDGAR browse URL did not resolve to a usable filing
              listing in fetched text, and Nasdaq did not return usable key-data fields. Those misses do not disprove
              the story, but they do mean diligence still needs accession-specific filings, operating metrics, and class
              benchmark evidence before the investment case should be treated as fully triangulated. In practice, they
              raise the residual chance that investors over-read a well-funded IPO narrative without yet having the best
              public tools to pressure-test it.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR008
              - CR010
