chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and current operating scope
        blocks:
          - type: paragraph
            body: >-
              The assigned official and exchange evidence places Kailera as a newly public obesity biotech rather than a
              commercial operator. On its homepage, Kailera describes an obesity-first platform with four clinical-stage
              product candidates spanning multiple GLP-1-based mechanisms and routes of administration, while BioSpace
              and Fierce tie that portfolio to assets licensed from Jiangsu Hengrui. Nasdaq and BioSpace also anchor the
              current public-company identity: Kailera trades on the Nasdaq Global Select Market under KLRA, and
              third-party reporting locates the company in Waltham, Massachusetts. The available record therefore
              supports a concise operating identity—public, clinical-stage, obesity-focused, Hengrui-linked—but not a
              mature commercial profile with disclosed revenue, customers, or staffing scale.
