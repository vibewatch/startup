            body: >-
              The retained evidence does not show a disclosed commercial customer base for Kailera today. Third-party
              market pages still describe the company as clinical-stage, list annual sales as not available, and note
              that broader commercial operations remain thinly disclosed. The clearest real-world user surface is
              KaiNETIC-1: a Kailera-sponsored obesity study spread across 110 locations, which demonstrates operational
              reach into patient and investigator workflows but does not yet prove paying demand, recurring use, or
              post-launch adoption. For this chapter, the practical buyer/user/payer segmentation is therefore
              future-facing: patients and prescribers as users, self-pay or reimbursed channels as payers, and Kailera
              itself as the current sponsor financing evidence generation.
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
              - CU007
          - type: table
            tableRef: TU001
            claimRefs:
