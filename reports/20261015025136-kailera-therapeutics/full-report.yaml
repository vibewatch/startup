  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing
        blocks:
          - type: paragraph
            body: >-
              The useful boundary for Kailera is not "all obesity spend" or even every GLP-1-adjacent therapy, but the
              branded prescription obesity-medicines market plus the near-term lanes that can expand it: oral
              formulations, broader self-pay access, and differentiated follow-on agents. IQVIA's lens is the cleanest
              market anchor in the assigned pool, because it distinguishes the monetized prescription market from the
              broader disease burden. That distinction matters: the disease pool is enormous, but the near-term
              commercial opportunity still depends on who can pay, what routes of administration patients will tolerate,
              and how quickly new products widen treatment eligibility or affordability. Kailera therefore sits inside a
              large but still filtered market, not an automatically addressable one.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
