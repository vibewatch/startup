        title: Exhibits
        blocks:
          - type: callout
            title: Financing, not unit economics, is the current proof point
            body: >-
              The strongest public evidence is that Kailera raised unusually large equity capital for a clinical-stage
              obesity biotech and has already mapped that capital to specific development programs; the weakest evidence
              is still commercialization math.
            calloutType: insight
            claimRefs:
