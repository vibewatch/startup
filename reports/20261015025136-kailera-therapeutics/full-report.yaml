      - number: '4.2'
        title: Capital base and funded development path
        blocks:
          - type: paragraph
            body: >-
              Kailera has financed speed with equity. Independent reporting says the April 2026 IPO added about $625
              million of gross proceeds after a $400 million Series A in 2024 and a $600 million Series B in 2025. The
              same IPO reporting says management intended to devote roughly $625 million to injectable ribupatide
              through the second quarter of 2028, around $150 million to oral ribupatide late-stage work, and about $50
              million to KAI-7535, with the balance for other R&D and corporate use. Clinical and registry disclosures
              reinforce why that cash plan is heavy: KaiNETIC-1 alone targets roughly 1,800 participants with a Week-76
              primary endpoint, and the program spans three global Phase 3 trials.
