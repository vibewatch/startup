  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Broad disease burden is much larger than the currently monetized obesity-medicines market, and Kailera's
      preapproval opportunity sits behind access and adoption filters.
    data:
      items:
        - label: Disease burden
          value: '>1B people'
          detail: >-
            Global population living with overweight or obesity in 2024; this is the outer need pool, not current pharma
            revenue.
          claimRefs:
            - CM011
        - label: Economic burden
          value: $3T annually by 2030
          detail: Shows why the category attracts policy and capital attention, but it is not a prescription-sales figure.
          claimRefs:
            - CM011
        - label: Current prescription market
          value: $66B
          detail: IQVIA 2025 list-price obesity-medicines sales value.
          claimRefs:
            - CM001
        - label: Near-term forecast
          value: $92B
          detail: IQVIA 2026 forecast as launches and access broaden.
          claimRefs:
            - CM001
            - CM003
        - label: Medium-term range
          value: $105B-$200B
          detail: IQVIA 2027+ range, dependent on segmentation, competition, and long-term outcomes.
          claimRefs:
            - CM002
        - label: Access filter
          value: ≈1/3 of new-to-brand Rx
          detail: >-
            Within eight weeks, oral Wegovy captured about one-third of new-to-brand prescriptions, mostly through
            cash-pay channels.
          claimRefs:
            - CM004
    approximationNotes: >-
      Layers mix burden, sales, and access indicators; they are ordered from broad need to narrower commercial filters
      and should not be read as a cumulative funnel.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM011
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal scoring places Kailera as broad for a prelaunch biotech, but still below incumbents on commercial proof
      and only level with direct peers on late-stage validation.
    xAxis:
      label: Portfolio breadth and modality optionality
      min: 1
      max: 5
      lowLabel: single-format
      highLabel: multi-format
      description: Evidence-backed ordinal score from public modality breadth and asset diversity.
    yAxis:
      label: Commercial or late-stage proof
      min: 1
      max: 5
      lowLabel: early or unproven
      highLabel: marketed or entrenched
      description: Evidence-backed ordinal score from public commercial presence and trial maturity.
    data:
      points:
        - label: Kailera
          x: 4
          'y': 3
          tone: opportunity
          detail: >-
            Four clinical-stage obesity assets across injectable and oral formats; KaiNETIC Phase 3 is public, but there
            is no marketed product or head-to-head proof.
          claimRefs:
            - CP001
            - CP002
            - CP007
            - CP008
            - CP011
        - label: Viking
          x: 3
          'y': 3
          tone: opportunity
          detail: Oral and subcutaneous VK2735 are public, with Phase 2 oral data and an ongoing Phase 3 VANQUISH-1 program.
          claimRefs:
            - CP003
            - CP015
        - label: Novo Nordisk
          x: 4
          'y': 5
          tone: positive
          detail: >-
            IQVIA cites Wegovy pill launch and established portfolio strategy, indicating both commercialization and
            modality breadth.
          claimRefs:
            - CP004
            - CP009
        - label: Eli Lilly
          x: 4
          'y': 5
          tone: positive
          detail: >-
            Zepbound is the head-to-head benchmark Kailera still has not tested against, and IQVIA also cites Lilly's
            oral expansion.
          claimRefs:
            - CP008
            - CP009
        - label: China-origin innovators
          x: 4
          'y': 2
          tone: warning
          detail: >-
            IQVIA describes China as a major innovation source with multiple developers moving beyond the domestic
            market.
          claimRefs:
