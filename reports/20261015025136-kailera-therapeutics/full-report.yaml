      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              The current financial case is balance-sheet durability plus category optionality, not proven revenue
              quality. Kailera appears exceptionally well funded for a clinical-stage obesity entrant, and the post-IPO
              sponsor base remains anchored by Bain Capital and Hengrui, which may help future financing access. But the
              underwrite still depends on facts the retained public evidence does not resolve: realized launch pricing,
              gross-to-net deductions, royalty and milestone obligations under the Hengrui license, commercial build
              cost, and whether Phase 3 readouts arrive before cash needs pull the company back to the market. That
              keeps the chapter's verdict at "capitalized but still diligence-blocked," not "commercially de-risked."
            claimRefs:
              - CI008
              - CI012
              - CI014
              - CI016
