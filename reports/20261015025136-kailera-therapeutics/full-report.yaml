      - number: '4.3'
        title: What the public numbers do and do not prove
        blocks:
          - type: paragraph
            body: >-
              The sharpest public balance-sheet figures in the assigned pool come indirectly, not from a retained SEC
              filing. Baidu Baike relays an accumulated deficit of $368.7 million at year-end 2025, $652.7 million of
              cash on hand, and management's expectation that post-IPO cash could fund operations until mid-2028. Those
              figures are directionally useful because they fit the disclosed Phase 3 allocation plan, but they are not
              yet underwriting-grade on their own. The accessible Nasdaq quote page in this pool adds little
              triangulation because it explicitly says key data is unavailable, so live price, liquidity, and market-cap
              checks are missing from the retained evidence set.
            claimRefs:
