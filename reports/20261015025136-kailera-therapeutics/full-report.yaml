              - CI004
              - CI007
              - CI008
          - type: callout
            title: Pricing power and market triangulation remain soft spots
            body: >-
              The retained evidence set still lacks direct gross-to-net, margin, and live trading data, while category
              evidence already points to lower prices, oral competition, and cash-pay dynamics that could compress
              future launch economics.
            calloutType: risk
            claimRefs:
              - CI014
