              - CU013
      - number: '6.2'
        title: Adoption metrics are pipeline-operating metrics
        blocks:
          - type: paragraph
            body: >-
              What Kailera can support publicly today is adoption of trial infrastructure, not product-market fit.
              ClinicalTrials.gov shows a randomized, double-masked ribupatide-versus-placebo design, and Fierce Biotech
              says IPO proceeds are earmarked to keep three global phase 3 trials running through the second quarter of
              2028. That combination matters because it shows the company is building exposure among trial participants,
              sites, and investigators, while still waiting for the kind of evidence that commercial customers, payers,
              and prescribers will need before broad uptake. Even basic operating disclosure remains narrow: one public
              market page lists 145 employees, while another transcript snippet still frames key readouts as future
              events rather than reported commercial traction.
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU006
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
