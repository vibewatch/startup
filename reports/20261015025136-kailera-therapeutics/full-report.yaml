      - number: '3.2'
        title: Kailera's real advantage is modality breadth, not proven superiority
        blocks:
          - type: paragraph
            body: >-
              Kailera's strongest competitive feature today is that it is trying to cover more than one patient
              preference set before launch. The public record shows a weekly injectable dual agonist in KaiNETIC, an
              oral ribupatide follow-on, an oral small-molecule GLP-1 program, and a tri-agonist backup. That is broader
              than a single-asset peer such as Viking in this source set, but the advantage is still prospective: The
              Pharma Letter says the company's differentiation claim is portfolio-based, and Fierce notes Kailera has
              not yet run a head-to-head trial against Lilly's Zepbound. The current moat is therefore optionality, not
              demonstrated switching or superior outcomes.
            claimRefs:
