      - number: '1.2'
        title: Capitalization moved faster than underlying disclosure depth
        blocks:
          - type: paragraph
            body: >-
              Kailera's financing history in the assigned pool is unusually compressed. Fierce and BioSpace both
              describe a $400 million 2024 Series A and a $600 million 2025 Series B before the company reached public
              markets. By June 2026, the same two outlets were describing the IPO as record-breaking, while Fierce
              detailed final pricing at 39 million shares, $16 per share, and $625 million in gross proceeds. That
              capital trajectory matters because it explains why later chapters can treat Kailera as exceptionally well
              funded relative to most precommercial biotechs, while still separating verified public-market
              capitalization events from weaker, less corroborated burn-rate commentary.
