              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
              - CU013
      - number: '6.3'
        title: Expansion depends on access and tolerability, with no Kailera-specific retention proof yet
        blocks:
          - type: paragraph
            body: >-
              The market context is large enough to matter, but the durability question is still unresolved for Kailera
              itself. IQVIA expects self-pay, employer programmes, and digital health platforms to remain important
              routes to patients, which suggests Kailera could reach users before broad reimbursement if its data are
              strong enough. But the same sources also show why retention is hard: persistence differs widely across
              brands and countries, tolerability is a common reason patients stop GLP-1 therapy, and competitor trial
              misses can quickly reset demand and market-share expectations. In other words, Kailera's expansion path
              likely runs through differentiated efficacy, acceptable side effects, and payer evidence rather than any
              currently visible land-and-expand base.
            claimRefs:
              - CU008
              - CU009
              - CU010
