  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture is still driven by ribupatide timing and capital concentration
        blocks:
          - type: paragraph
            body: >-
              The highest-severity downside is not near-term insolvency but the combination of long-duration pivotal
              work and concentration of both narrative and spending into the ribupatide franchise. Independent coverage
              still frames ribupatide as the lead asset, while the IPO proceeds are largely spoken for by the same
              pipeline through 2028 rather than by diversified commercial cash flow. That leaves investors underwriting
              years of execution, licensor coordination, and competitive positioning before a decisive global efficacy
              and safety de-risking event arrives. A generous cash cushion helps, but it does not by itself compress the
              timeline or solve the concentration problem if the lead asset under-delivers.
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR003
            claimRefs:
