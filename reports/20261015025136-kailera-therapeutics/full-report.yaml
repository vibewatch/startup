  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and maturity
        blocks:
          - type: paragraph
            body: >-
              Kailera is not yet a commercial obesity company with a shipped care workflow; it is a clinical-development
              stack built around four licensed GLP-1-based assets whose near-term "product" is successful progression
              through late-stage trials. The strongest public evidence in the assigned pool supports a lead-asset story
              rather than a fully documented platform story: ribupatide injection is already in the KaiNETIC Phase 3
              program, while oral ribupatide, KAI-7535, and KAI-4729 create additional shots on goal across oral,
              peptide, and small-molecule formats. That breadth matters because it gives Kailera multiple ways to stay
              relevant if the lead program slips, but it does not yet prove a winner on efficacy, tolerability, or
              launch readiness in global populations.
            claimRefs:
