              - CR012
              - CR013
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break markers before de-risking data
            body: >-
              The clearest kill criteria are visible rather than theoretical: material slippage to the KaiNETIC
              timetable, weaker-than-expected global bridging versus China data, evidence of oral-class safety friction,
              or a need to redirect cash away from the current development map before ribupatide is validated.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR008
          - type: callout
            title: Highest-value diligence asks
            body: >-
              The fastest way to shrink residual uncertainty is to review accession-specific SEC filings, the Hengrui
              agreement schedules, Kailera's operating metrics for enrollment and spend, and a usable independent class
              benchmark rather than relying on inaccessible assigned URLs.
            calloutType: assumption
            claimRefs:
