  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Commercial status and monetization path
        blocks:
          - type: paragraph
            body: >-
              Kailera's financial narrative is still pre-revenue and development-led, not recurring-revenue-led. The
              retained evidence describes the company as clinical-stage, with ribupatide only in global Phase 3 and no
              public disclosure of approved products or current product revenue. That means near-term monetization still
              runs through a future launch stack - approval, payer coverage, realized net pricing, and persistence -
              rather than booked sales. IQVIA's 2026 market review matters because it shows that obesity medicines are
              growing quickly, but also that oral entrants, lower prices, and cash-pay uptake are already changing
              access dynamics. For underwriting, upside comes from category expansion; downside comes from entering a
              market where price realization may weaken before Kailera launches.
            claimRefs:
