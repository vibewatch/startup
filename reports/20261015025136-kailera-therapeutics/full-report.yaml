              - CP012
              - CP015
              - CP016
      - number: '3.4'
        title: The main risk is crowding before Kailera proves it deserves premium positioning
        blocks:
          - type: paragraph
            body: >-
              Kailera looks better capitalized than many biotech peers, but capital alone does not solve crowding. IQVIA
              says oral formats, generic or off-patent semaglutide in some markets, and portfolio-led strategies from
              major pharma will keep fragmenting the field. Fierce adds that Kailera still lacks a head-to-head dataset
              against Zepbound even while management frames ribupatide as potentially best in class. That leaves the
              company exposed to two kinds of displacement at once: direct share loss to better-distributed incumbents
              and a slower erosion from maintenance substitutes or newer entrants that make buyer multi-homing easier.
              The next proof points are global Phase 3 durability, tolerability, and launch-path evidence, not another
              broad portfolio claim.
            claimRefs:
              - CP004
              - CP008
              - CP009
              - CP011
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is Kailera's best current wedge
            body: >-
              Kailera looks less like a one-asset obesity startup than most prelaunch peers because the public record
              already shows injectable and oral ribupatide plus two additional mechanism bets. That breadth gives it
              more shots on goal if one route underdelivers.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP012
              - CP014
          - type: callout
            title: The market can crowd Kailera before Kailera proves premium value
            body: >-
              Incumbents already control commercialization, direct peers are closing the oral gap, and substitutes
              remain active because cost and discontinuation are still unresolved. Without public head-to-head or
              payer-readiness proof, Kailera's best-in-class framing stays vulnerable.
            calloutType: risk
            claimRefs:
