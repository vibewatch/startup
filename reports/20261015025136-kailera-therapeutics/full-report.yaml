  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Disclosed capital sources feed development programs now; commercial revenue remains downstream of approval and
      pricing.
    data:
      nodes:
        - id: capital-pool
          label: Capital pool
          detail: Series A, Series B, and IPO proceeds fund the company before commercial revenue exists.
        - id: injectable-phase3
          label: Injectable ribupatide Phase 3
          detail: Roughly $625m is earmarked through 2Q 2028 for three ongoing global Phase 3 trials.
        - id: oral-ribupatide
          label: Oral ribupatide development
          detail: Around $150m is planned for late-stage work expected to start as early as 1H 2027.
        - id: kai-7535
          label: KAI-7535 development
          detail: About $50m is planned to support Phase 2 completion.
        - id: other-r-and-d
          label: Other R&D and G&A
          detail: Remaining proceeds are earmarked for other R&D activity and general corporate operations.
        - id: commercial-revenue
          label: Commercial revenue
          detail: Timing, price realization, and margins remain undisclosed and depend on approval plus payer access.
      edges:
        - from: capital-pool
          to: injectable-phase3
          label: Lead use of IPO proceeds
        - from: injectable-phase3
          to: oral-ribupatide
          label: Follow-on obesity franchise funding
        - from: oral-ribupatide
          to: kai-7535
          label: Additional program allocation
        - from: kai-7535
          to: other-r-and-d
          label: Balance of proceeds supports platform and overhead
        - from: other-r-and-d
          to: commercial-revenue
          label: Revenue only emerges after successful development and launch
    approximationNotes: >-
      This is a disclosed fund-use sequence, not a quarter-by-quarter cash-flow model; the figure does not imply
      approval timing, launch probability, or realized revenue yield.
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
      - CI012
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Kailera's visible architecture is a layered clinical-development system spanning licensed rights, trial execution,
      follow-on assets, and evidence controls.
    data:
      layers:
        - label: Rights and sourcing layer
          detail: Ex-Greater-China rights from Hengrui define what Kailera can develop and eventually commercialize.
          modules:
            - label: Territory rights
              note: U.S., Europe, and Japan while Greater China stays with Hengrui
            - label: Asset package
              note: Four GLP-1-based obesity programs
          outputs:
            - label: Pipeline access
              note: Licensed platform breadth
          note: The core dependency is the licensor relationship, not a fully disclosed in-house discovery stack.
        - label: Lead clinical engine
          detail: >-
            Injectable ribupatide is the main value driver and the only deeply described global program in the assigned
            pool.
          modules:
            - label: KaiNETIC program
              note: Global Phase 3 plus U.S. Phase 2b context
            - label: Patient population
              note: Adults with obesity or overweight with comorbidities and no diabetes
          outputs:
            - label: Pivotal evidence
              note: 2027-2028 readout path
        - label: Follow-on route expansion
          detail: Oral ribupatide adds route-of-administration optionality beyond weekly injection.
          modules:
            - label: Oral ribupatide
              note: Planned global Phase 3 in 2027
          outputs:
            - label: Convenience thesis
              note: Non-injectable obesity pathway
        - label: Portfolio hedge layer
          detail: KAI-7535 and KAI-4729 broaden modality optionality if the lead asset disappoints.
          modules:
            - label: KAI-7535
              note: Kailera Phase 2 / Hengrui China Phase 3 context
            - label: KAI-4729
              note: Early tri-agonist style option
          outputs:
            - label: Additional shots on goal
              note: Breadth outside a single molecule
        - label: Quality and safety controls
          detail: Publicly visible controls are mostly clinical-study controls rather than commercial operating controls.
          modules:
            - label: Trial design
              note: Randomized, parallel, double-masked
            - label: Safety endpoints
              note: TEAEs, antibodies, biomarker follow-up
          outputs:
            - label: Trust signal
              note: Protocol discipline
        - label: Public proof gap layer
          detail: The weakest layer is commercial and technical transparency outside trials.
          modules:
            - label: Disclosure surface
              note: Nasdaq page lacked key operating data; SEC browse capture was unusable
            - label: Missing external proxy
              note: No practitioner or developer signal in assigned pool
          outputs:
            - label: Diligence blocker
              note: Hard to verify scale-up and controls from public evidence alone
    claimRefs:
      - CE001
      - CE003
      - CE006
      - CE011
      - CE012
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Kailera's current path to customers starts with trial recruitment, then moves through evidence readouts,
      access-channel formation, and retention-sensitive commercialization.
    data:
      items:
        - label: Recruit trial participants
          detail: Current user surface is patient enrollment rather than a live customer account base.
          touchpoints:
            - ClinicalTrials.gov says KaiNETIC-1 has 110 locations.
            - The study is sponsored by Kailera.
        - label: Run pivotal evidence generation
          detail: The product is still proving safety and efficacy in controlled settings.
          touchpoints:
            - KaiNETIC-1 is randomized, parallel-assignment, and double-masked.
            - Fierce says IPO funds support 3 global phase 3 trials through Q2 2028.
        - label: Approach early access channels
          detail: Initial commercialization is more likely to begin in easier-access routes than in broad reimbursement.
          touchpoints:
            - IQVIA says self-pay will continue to lead access in many countries.
            - Employer programmes and digital health platforms are listed as routes to patients.
        - label: Win prescriber and payer confidence
          detail: Customer expansion requires evidence that goes beyond logos or category excitement.
          touchpoints:
            - Commercial evidence is still prospective rather than current.
            - No retained source discloses Kailera-specific payer or partner logos tied to launch.
        - label: Manage retention and tolerability
          detail: Repeat prescribing depends on persistence, not just initial demand.
          touchpoints:
            - IQVIA says persistence varies markedly between brands and countries.
            - Patients most often cite tolerability issues as the primary reason for stopping GLP-1 treatment.
        - label: Expand or lose share
          detail: The obesity market rewards differentiated efficacy and punishes second-best outcomes.
          touchpoints:
            - BioPharma Dive shows stronger efficacy can still come with higher discontinuation.
            - The Independent says inferior trial performance can curb demand and market-share expectations.
    approximationNotes: >-
      This journey map abstracts the likely customer path from retained public evidence; it does not imply current
      commercial conversion rates.
    claimRefs:
      - CU005
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU013
