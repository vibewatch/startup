      - number: '3.3'
        title: Access, persistence, and regulatory execution still favor incumbents
        blocks:
          - type: paragraph
            body: >-
              Kailera and Viking both remain prelaunch programs with no public list pricing or payer contracting in this
              pool, so the access comparison defaults to what the class already shows. AAFP describes obesity drugs as
              effective but hard to keep patients on because of adverse effects, cost, and varied efficacy, and it says
              coverage remains inconsistent when use is solely for weight loss. That makes patient persistence and payer
              support as important as efficacy headlines. On trust and execution, Kailera at least has a visible
              randomized, double-masked week-76 Phase 3 design in ClinicalTrials.gov, but EMA's guidance still
              underlines that new entrants must justify deviations and keep close regulatory dialogue rather than
              treating China-generated or early-stage data as enough.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP009
              - CP010
              - CP012
