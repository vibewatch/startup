      - number: '1.3'
        title: Lead-program scale is visible; commercialization metrics are not
        blocks:
          - type: paragraph
            body: >-
              The cleanest current execution signal in the assigned evidence is not revenue or customer traction but
              clinical deployment. Fierce reports that Kailera intended to use IPO proceeds to fund injectable
              ribupatide through three ongoing global Phase 3 trials into the second quarter of 2028, while also
              reserving capital for oral ribupatide and KAI-7535. ClinicalTrials.gov independently shows Kailera as
              sponsor of a randomized, double-masked KaiNETIC-1 study with 110 locations and a week-76 body-weight
              endpoint. The same pool also includes only a paywalled preview on Kailera's triple-G program and no
              reliable company-level revenue, customer, or headcount disclosure, so the scale picture is strong on R&D
              execution and weak on operating disclosure.
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
      - number: '1.4'
        title: Leadership visibility is narrow and creates diligence follow-up
        blocks:
          - type: paragraph
            body: >-
              Leadership evidence in the assigned pool is materially thinner than financing and trial evidence. Fierce
              names Ron Renaud as CEO and notes his prior role leading Cerevel Therapeutics, which supports a credible
              biotech-financing and development profile, but the same pool does not surface comparable board, founder,
              or committee-level detail. ClinicalTrials.gov adds an unnamed Kailera medical director as study director
              for KaiNETIC-1, which is useful for operational context but not a substitute for named governance
              visibility. As a result, the current chapter can establish key-person concentration around the CEO and
              active clinical execution, but it must leave founder history, board composition, and insider-control
              questions as explicit gaps rather than implied facts.
