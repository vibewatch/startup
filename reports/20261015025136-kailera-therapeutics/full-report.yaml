      - number: '2.2'
        title: Buyers, users, and payers
        blocks:
          - type: paragraph
            body: >-
              The adoption path is already splitting by use case. IQVIA's 2026 market commentary suggests oral GLP-1s
              are opening new-to-brand demand through convenience and cash-pay channels rather than merely shuffling
              existing injectable users. That implies multiple budget owners at once: patients in self-pay channels,
              employers or insurers where reimbursement exists, and biopharma sponsors while products are still
              preapproval. Kailera itself remains in that sponsor-funded stage today. The ClinicalTrials.gov record for
              KaiNETIC-1 shows a late-stage obesity or overweight study rather than a launched commercial product, so
              the immediate "buyer" around ribupatide is still the trial-and-site ecosystem, with broad payer-backed
              prescribing a later milestone.
            claimRefs:
              - CM004
              - CM007
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM007
              - CM008
              - CM009
              - CM013
      - number: '2.3'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Three drivers stand out in the pool: sheer disease burden, oral convenience, and continuing capital
              formation around differentiated obesity assets. At the same time, the same evidence shows why adoption is
              not frictionless. IQVIA emphasizes persistence, pricing, and increasingly segmented positioning; BioPharma
              Dive's oral GLP-1 comparison shows efficacy gains can come with higher discontinuation from side effects;
              and BiotechResearch's Kailera-specific note says the company wants to compete through science and flexible
              dosing rather than low prices. That combination points to the real commercial bottleneck: better outcomes
              alone may not be enough if tolerability, reimbursement, and incumbent competition keep patients or payers
              from staying on therapy.
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM006
              - CM009
              - CM010
              - CM012
              - CM016
      - number: '2.4'
        title: Unresolved sizing and policy questions
        blocks:
          - type: paragraph
            body: >-
              The assigned pool also preserves the gaps that matter most for valuation. Oral ribupatide timing is not
              clean: one retained article says global Phase 3 could start as early as the first half of 2027, while
              another says IPO funds support planned Phase 3 trials beginning in the second quarter of 2028. That timing
              difference changes how investors should discount launch and cash-needs assumptions. Separately, the pool
              does not provide a directly relevant primary source on obesity-drug reimbursement or China-sourcing
              policy. The only federal-policy URL retained for this worker resolves to the HIRE CREDIT Act, so
              payer-policy and sourcing-friction diligence still needs filing-level or regulator-level evidence.
            claimRefs:
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Adoption can expand before reimbursement broadens
            body: >-
              The best evidence in the pool suggests oral convenience can create new demand quickly, but persistence,
              side effects, and payer policy still determine whether that early uptake becomes durable revenue.
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
              - CM006
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The field is no longer a single-peer race
        blocks:
          - type: paragraph
            body: >-
              Kailera does not enter obesity against one obvious biotech comp. Public evidence in this pool shows a
              stack of competitors and substitutes: direct clinical-stage peers such as Viking, incumbents Novo Nordisk
              and Eli Lilly with marketed products and oral expansion, China-origin innovators that can globalize assets
              or feed licensing supply, large pharma entrants buying or partnering into portfolios, and status-quo
              maintenance paths that do not require switching into a new branded program. That breadth matters because
              IQVIA explicitly frames 2026-2030 as a shift away from a duopoly, while Kailera's own current
              differentiation is still portfolio breadth rather than commercial proof.
            claimRefs:
              - CP001
              - CP003
