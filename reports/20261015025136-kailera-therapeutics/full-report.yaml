        title: Exhibits
        blocks:
          - type: callout
            title: Broad pipeline, narrow proof surface
            body: >-
              Kailera's strongest product advantage is optionality across four obesity assets, but the assigned public
              evidence is still much richer on trial progression than on commercial operations, manufacturing transfer,
              or trust infrastructure.
            calloutType: insight
            claimRefs:
