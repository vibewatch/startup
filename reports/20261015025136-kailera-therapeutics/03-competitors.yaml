      - ['China-origin innovators (Hengrui, Hansoh, Innovent, Sciwind)', adjacent or likely entrants, "China is both a major volume market and an increasingly important source of innovation", "obesity markets emphasizing oral, combo, and next-wave assets", "External innovation supply can produce licensing, partnership, or future direct competition", "Commercialization outside China remains uneven in the public record here"]
      - ["Large-pharma build or BD entrants (Pfizer, Roche, AstraZeneca, Amgen)", likely entrants or internal-build alternatives, "Acquisitions, partnerships, and pipeline build-outs already underway", broad obesity and cardiometabolic segments, "Can buy or partner into portfolios instead of starting from zero", "Timing and asset quality still depend on transaction execution"]
      - ["Status-quo maintenance paths", substitute, "Dose de-escalation, interval dosing, and add-on oral therapy already discussed in primary care", "cost-sensitive, maintenance, or adverse-effect-limited patients", "Can reduce injection fatigue or ongoing spend without a new branded switch", "Lower efficacy ceiling and rebound risk versus successful incretin continuation"]
    notes: >-
      Public profile snapshot only. Scale, pricing, and commercial breadth are incomplete for
      prelaunch assets, and likely-entrant rows aggregate named companies rather than implying
      identical readiness or product quality.
    claimRefs: [CP001, CP003, CP004, CP005, CP006, CP008, CP012, CP013, CP016]
  - id: TP002
    title: Feature and capability matrix
    columns:
      - Buying criterion
      - Kailera
      - Viking
      - Incumbents (Novo or Lilly)
      - Entrants or substitutes
    rows:
      - ["Injectable + oral obesity option in public record", "Yes: weekly ribupatide injection plus oral ribupatide plan", "Yes: subcutaneous plus oral VK2735", "Yes: marketed injectables and 2026 oral expansion", "Mixed: entrants vary; substitutes rely on tapering or add-on oral use"]
      - ["Multi-asset portfolio beyond one lead mechanism", "Yes: four clinical-stage assets", "No public evidence in this pool beyond VK2735-led obesity franchise", "Yes: IQVIA describes portfolio-led strategies across multiple assets", "Mixed: China-origin and large-pharma entrants are broader than maintenance substitutes"]
      - ["Commercial obesity product on market", "No public evidence", "No public evidence", "Yes", "Substitutes already exist, but not as Kailera-style new-branded launches"]
      - ["Public head-to-head or persistence proof cited here", "No public head-to-head against Zepbound", "No public head-to-head in assigned pool", "Persistence matters, but AAFP still reports high discontinuation for the class", "Substitutes exist because discontinuation and cost remain active problems"]
      - ["Visible trust and regulatory signal", "KaiNETIC randomized, parallel, double-masked week-76 design is public", "VANQUISH-1 Phase 3 and oral Phase 2 posters are public", "Marketed approvals and labeled expansion already exist", "EMA guidance implies every new entrant still carries execution burden"]
    notes: >-
      Unsupported cells are marked as no public evidence rather than inferred. This matrix uses
      only the assigned pool and should not be read as a full product-specification sheet.
