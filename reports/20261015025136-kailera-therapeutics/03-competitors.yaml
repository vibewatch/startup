  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Option
      - Public pricing or access signal
      - Delivery cadence
      - Public contract model
      - Included capability or support signal
      - Implication
    rows:
      - ["Kailera ribupatide franchise", "No public list price in assigned pool", "Weekly injection plus planned daily oral", "Not disclosed", "Large capital allocation and multiple programs, but no public payer or patient-support stack", "Clinical differentiation has to be proven before pricing power is visible"]
      - ["Viking VK2735", "No public list price in assigned pool", "Subcutaneous plus oral candidate", "Not disclosed", "Company pitches a transition path from injection to oral using the same active agent", "Direct peer pressure is more about convenience and data timing than price transparency today"]
      - ["Wegovy/Zepbound class", "AAFP says weight-loss-only coverage is inconsistent and monthly out-of-pocket cost is several hundred dollars", "Injectable today with oral expansion noted by IQVIA", "Payer and self-pay mix; exact rebates not public here", "Incumbents combine efficacy, labels, and channel reach", "Access advantage may matter more than nominal clinical deltas"]
      - ["Maintenance or substitute strategies", "Can lower effective spend versus continuous branded full-dose use", "Interval dosing or add-on oral use", "Clinician-guided rather than standardized branded contracting", "AAFP describes taper, interval, and add-on options for discontinuation management", "Patients have non-switch alternatives when cost or tolerability breaks loyalty"]
    notes: >-
      Prelaunch biotech pricing is largely undisclosed, so this table compares public access and
      packaging signals rather than claiming exact net prices or contract economics.
    claimRefs: [CP005, CP006, CP009, CP012, CP015, CP016]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal scoring places Kailera as broad for a prelaunch biotech, but still below incumbents
      on commercial proof and only level with direct peers on late-stage validation.
    xAxis:
      label: Portfolio breadth and modality optionality
      min: 1
      max: 5
      lowLabel: single-format
      highLabel: multi-format
      description: Evidence-backed ordinal score from public modality breadth and asset diversity.
    yAxis:
      label: Commercial or late-stage proof
      min: 1
      max: 5
      lowLabel: early or unproven
      highLabel: marketed or entrenched
      description: Evidence-backed ordinal score from public commercial presence and trial maturity.
    data:
      points:
        - label: Kailera
          x: 4
          y: 3
          tone: opportunity
          detail: Four clinical-stage obesity assets across injectable and oral formats; KaiNETIC Phase 3 is public, but there is no marketed product or head-to-head proof.
          claimRefs: [CP001, CP002, CP007, CP008, CP011]
        - label: Viking
          x: 3
          y: 3
          tone: opportunity
          detail: Oral and subcutaneous VK2735 are public, with Phase 2 oral data and an ongoing Phase 3 VANQUISH-1 program.
          claimRefs: [CP003, CP015]
        - label: Novo Nordisk
          x: 4
          y: 5
          tone: positive
          detail: IQVIA cites Wegovy pill launch and established portfolio strategy, indicating both commercialization and modality breadth.
          claimRefs: [CP004, CP009]
        - label: Eli Lilly
          x: 4
          y: 5
          tone: positive
          detail: Zepbound is the head-to-head benchmark Kailera still has not tested against, and IQVIA also cites Lilly's oral expansion.
          claimRefs: [CP008, CP009]
        - label: China-origin innovators
          x: 4
          y: 2
          tone: warning
          detail: IQVIA describes China as a major innovation source with multiple developers moving beyond the domestic market.
          claimRefs: [CP013]
        - label: Status-quo substitutes
          x: 2
          y: 4
          tone: neutral
          detail: These options are commercially available and already used in practice, but they do not offer a novel efficacy step-up.
          claimRefs: [CP005, CP006, CP016]
    approximationNotes: >-
      Scores are fixed 1-5 ordinal judgments derived from the cited claims; they are not inferred
      market-share, efficacy, or valuation rankings.
    claimRefs: [CP001, CP003, CP004, CP005, CP006, CP008, CP009, CP013, CP016]
callouts:
  - calloutType: strength
    title: Breadth is Kailera's best current wedge
    body: >-
      Kailera looks less like a one-asset obesity startup than most prelaunch peers because the
      public record already shows injectable and oral ribupatide plus two additional mechanism
      bets. That breadth gives it more shots on goal if one route underdelivers.
    claimRefs: [CP001, CP002, CP012, CP014]
  - calloutType: risk
    title: The market can crowd Kailera before Kailera proves premium value
    body: >-
      Incumbents already control commercialization, direct peers are closing the oral gap, and
      substitutes remain active because cost and discontinuation are still unresolved. Without
      public head-to-head or payer-readiness proof, Kailera's best-in-class framing stays
      vulnerable.
    claimRefs: [CP005, CP006, CP008, CP009, CP013, CP016]
