      - [Viking Therapeutics, direct biotech peer, "Ongoing Phase 3 VANQUISH-1 program plus oral Phase 2 VK2735 data", obesity and metabolic-disorder patients, "Same obesity franchise across oral and subcutaneous VK2735", "Still precommercial and evidence here is mostly company-issued"]
