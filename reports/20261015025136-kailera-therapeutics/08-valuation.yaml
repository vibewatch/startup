    title: Recommendation logic
    type: flow
    summary: Public capital and Phase 3 proof support engagement, but missing valuation precision and rising category pressure keep the call at track.
    data:
      nodes:
        - id: scale
          label: Scale
          detail: "$625M IPO indicates strong investor demand."
        - id: proof
          label: Proof
          detail: "Multiple randomized Phase 3 ribupatide studies are active."
        - id: market
          label: Market tailwind
          detail: "Independent forecasts still call for major obesity / incretin growth through 2030."
        - id: pressure
          label: Market pressure
          detail: "Oral competition, broader access, generic entry, and segmentation raise the bar."
        - id: gaps
          label: Valuation gaps
          detail: "Retained sources still do not give a clean live valuation or overhang picture."
        - id: recommendation
          label: Recommendation
          detail: "Track until data, timing, or price improve the underwriting setup."
      edges:
        - from: scale
          to: proof
        - from: proof
          to: market
        - from: market
          to: pressure
        - from: pressure
          to: gaps
        - from: gaps
          to: recommendation
    approximationNotes: null
    claimRefs: [CV003, CV006, CV008, CV009, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Supportable call
    body: >-
      Kailera is investable to watch, but the retained public evidence still supports a track call
      more cleanly than a buy because valuation precision and commercialization readiness lag the
      quality of the financing headline.
    claimRefs: [CV003, CV005, CV008, CV009, CV016]
  - calloutType: risk
    title: Main valuation trap
    body: >-
      The largest trap is treating a blockbuster IPO or a hot strategic obesity comparable as if it
      already settled Kailera's intrinsic value despite unresolved trial, access, and overhang
      questions.
    claimRefs: [CV003, CV009, CV012, CV016]
