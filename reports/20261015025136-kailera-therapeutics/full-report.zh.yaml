  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模
        blocks:
          - type: paragraph
            body: >-
              Kailera 的有效市场边界不是“所有肥胖症支出”，甚至也不是所有 GLP-1
              相关疗法，而是品牌处方肥胖症药物市场，加上能够在近期扩大市场的几条路径：口服制剂、更广泛的自费可及性，以及有差异化的后续药物。IQVIA
              的视角是指定资料池中最清晰的市场锚点，因为它把可变现的处方市场与更广泛的疾病负担区分开来。这个区别很重要：疾病患者池极其庞大，但近期商业机会仍取决于谁能支付、患者能接受哪种给药方式，以及新产品能多快扩大治疗资格或提高可负担性。因此，Kailera
              所处的是一个庞大但经过筛选的市场，并非天然可触达的市场。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
