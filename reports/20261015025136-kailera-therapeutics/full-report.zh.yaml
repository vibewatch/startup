  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 市场不再是单一同业竞争
        blocks:
          - type: paragraph
            body: >-
              Kailera 会不进入 肥胖症 对阵 一项 明显 生物科技 可比公司. 公开市场 证据 在 该 资料池 显示 一项 堆栈 的 竞争对手 与 替代品: 直接 临床阶段 同业 此类 作为 Viking, 现有巨头
              Novo Nordisk 与 Eli Lilly，并 市场ed 产品 与 oral 扩张, China-origin 创新者 该 可以 全球化 资产s 或 输送 授权 供应, 大型 pharma 进入者 买入 或
              合作 进入 组合, 与 状态-现状 维持 路径 该 做不要求 切换 进入 一项 新 品牌化 项目. 该 广度 重要 因为 IQVIA 明确地 框定 2026-2030 作为 一项 转变 离开 来自 一项 双寡头,
              而 Kailera's 拥有 当前 差异化是仍然 组合 广度 而非 比 商业 证明.
