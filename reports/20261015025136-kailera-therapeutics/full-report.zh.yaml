              - CP015
      - number: '3.3'
        title: 可及性、持续用药和监管执行仍偏向现有巨头
        blocks:
          - type: paragraph
            body: >-
              Kailera 和 Viking 都还处于上市前阶段；在这份资料池中，没有公开的目录价或支付方签约信息，因此准入比较只能以该品类已有的公开情况为基准。AAFP
              认为肥胖症药物有效，但不良反应、成本和疗效差异会让患者难以坚持用药；如果用途仅限于减重，报销覆盖也并不稳定。因此，患者持续用药和支付方支持与疗效本身同等重要。就信任和执行而言，Kailera 至少已经在
              ClinicalTrials.gov 上公开了随机、双盲、76 周的 3 期设计，但 EMA 指南仍强调，新进入者必须为偏离标准做出合理说明并保持密切监管沟通，不能把中国生成的数据或早期数据直接视为充分证据。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP009
              - CP010
              - CP012
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
