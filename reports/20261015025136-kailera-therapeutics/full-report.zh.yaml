  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 公开融资和 Phase 3 证据支持继续跟踪，但估值精度不足、品类压力上升，因此结论仍是跟踪。
    data:
      nodes:
        - id: scale
          label: 规模
          detail: $625M IPO 表明投资者需求强劲。
        - id: proof
          label: 验证
          detail: 多项随机化 ribupatide Phase 3 研究正在进行。
        - id: market
          label: 市场顺风
          detail: 独立预测仍认为，减重 / 肠促胰素市场将持续增长至 2030 年。
        - id: pressure
          label: 市场压力
          detail: 口服药竞争、更广泛的可及性、仿制药进入和市场细分抬高了门槛。
        - id: gaps
          label: 估值缺口
          detail: 保留资料仍未给出清晰的当前估值或潜在抛压图景。
        - id: recommendation
          label: 推荐
          detail: 在数据、时间表或价格改善投资判断之前，继续跟踪。
      edges:
        - from: scale
          to: proof
        - from: proof
          to: market
        - from: market
          to: pressure
        - from: pressure
          to: gaps
        - from: gaps
          to: recommendation
    approximationNotes: null
    claimRefs:
      - CV003
      - CV006
      - CV008
      - CV009
      - CV015
      - CV016
