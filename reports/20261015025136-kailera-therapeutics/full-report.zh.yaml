      - number: '3.2'
        title: Kailera 的真正优势是技术形态广度，而非已证实的优越性
        blocks:
          - type: paragraph
            body: >-
              Kailera 目前最强的竞争特征，是在上市前就试图覆盖不止一种患者偏好。公开记录显示，公司拥有 KaiNETIC 每周注射双重激动剂、口服 ribupatide 后续产品、口服小分子 GLP-1
              项目和三重激动剂备选项目。这比本资料集中的单一资产同业 Viking 更广，但这项优势尚未兑现：The Pharma Letter 称公司的差异化主张建立在产品组合上，Fierce 则指出 Kailera
              尚未针对 Lilly 的 Zepbound 开展头对头试验。因此，当前护城河是选择权，而不是已经证明的切换优势或疗效优势。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
              - CP011
              - CP014
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
