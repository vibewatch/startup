  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 广泛的疾病负担远大于当前已实现变现的肥胖药物市场；Kailera 获批前的机会还要经过准入与采用率筛选。
    data:
      items:
        - label: 疾病负担
          value: '>1B people'
          detail: 2024 年全球超重或肥胖人口；这是外层需求池，不是当前药企收入。
          claimRefs:
            - CM011
        - label: 经济负担
          value: $3T annually by 2030
          detail: 说明该品类为何吸引政策与资本关注，但不是处方销售额。
          claimRefs:
            - CM011
        - label: 当前处方药市场
          value: $66B
          detail: IQVIA 2025 年按目录价计算的减重药销售额。
          claimRefs:
            - CM001
        - label: 近期预测
          value: $92B
          detail: IQVIA 2026 年预测，随着产品上市和可及性扩大而变化。
          claimRefs:
            - CM001
            - CM003
        - label: 中期区间
          value: $105B-$200B
          detail: IQVIA 2027+ 区间，取决于市场细分、竞争格局和长期疗效结果。
          claimRefs:
            - CM002
        - label: 可及性筛选
          value: ≈1/3 of new-to-brand Rx
          detail: 上市八周内，口服 Wegovy 获得了约三分之一的新品牌处方，主要来自自费渠道。
          claimRefs:
            - CM004
    approximationNotes: 各层混合了疾病负担、销售额和可及性指标，按从广泛需求到更窄商业筛选的顺序排列，不应理解为累计漏斗。
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM011
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 序数评分显示，Kailera 对一家尚未上市的生物科技公司而言覆盖面较广，但商业验证仍落后于现有巨头，在后期验证上也仅与直接同业相当。
    xAxis:
      label: 产品组合广度与给药形式选择
      min: 1
      max: 5
      lowLabel: single-format
      highLabel: multi-format
      description: Evidence-backed ordinal score from public modality breadth and asset diversity.
    yAxis:
      label: 商业或后期验证
      min: 1
      max: 5
      lowLabel: early or unproven
      highLabel: marketed or entrenched
      description: Evidence-backed ordinal score from public commercial presence and trial maturity.
    data:
      points:
        - label: Kailera
          x: 4
          'y': 3
          tone: opportunity
          detail: 4 个处于临床阶段的减重资产，覆盖注射和口服剂型；KaiNETIC Phase 3 信息已公开，但尚无上市产品或头对头验证。
          claimRefs:
            - CP001
            - CP002
            - CP007
            - CP008
            - CP011
        - label: Viking
          x: 3
          'y': 3
          tone: opportunity
          detail: 口服和皮下注射 VK2735 信息已公开，已有口服剂型的 Phase 2 数据，VANQUISH-1 Phase 3 项目正在进行。
          claimRefs:
            - CP003
            - CP015
        - label: Novo Nordisk
          x: 4
          'y': 5
          tone: positive
          detail: IQVIA 提到 Wegovy 药片上市及成熟的产品组合策略，显示其同时具备商业化能力和给药形式广度。
          claimRefs:
            - CP004
            - CP009
        - label: Eli Lilly
          x: 4
          'y': 5
          tone: positive
          detail: Zepbound 是 Kailera 尚未进行对比测试的头对头基准，IQVIA 还提到 Lilly 正在扩展口服产品。
          claimRefs:
            - CP008
            - CP009
        - label: 中国本土创新者
          x: 4
          'y': 2
          tone: warning
          detail: IQVIA 将中国描述为重要的创新来源，多个开发商正走出国内市场。
          claimRefs:
            - CP013
        - label: 现有方案替代品
          x: 2
          'y': 4
