  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: 已披露的资金来源目前支撑研发项目；商业收入仍取决于获批和定价。
    data:
      nodes:
        - id: capital-pool
          label: 资金池
          detail: 在商业收入产生前，Series A、Series B 和 IPO 募资为公司提供资金。
        - id: injectable-phase3
          label: 注射型 ribupatide Phase 3
          detail: 约 $625m 预留至 2Q 2028，用于 3 项正在进行的全球 Phase 3 试验。
        - id: oral-ribupatide
          label: 口服 ribupatide 研发
          detail: 计划投入约 $150m，用于预计最早于 1H 2027 启动的后期研发。
        - id: kai-7535
          label: KAI-7535 研发
          detail: 计划投入约 $50m，以支持完成 Phase 2。
        - id: other-r-and-d
          label: 其他 R&D 与 G&A
          detail: 其余募资预留给其他 R&D 活动和一般公司运营。
        - id: commercial-revenue
          label: 商业收入
          detail: 时间、价格实现和利润率仍未披露，取决于获批及支付方可及性。
      edges:
        - from: capital-pool
          to: injectable-phase3
          label: IPO 募资的首要用途
        - from: injectable-phase3
          to: oral-ribupatide
          label: 后续减重产品线融资
        - from: oral-ribupatide
          to: kai-7535
          label: 其他项目分配
        - from: kai-7535
          to: other-r-and-d
          label: 余下募资支持平台与管理费用
        - from: other-r-and-d
          to: commercial-revenue
          label: 成功完成研发并上市后才会产生收入
    approximationNotes: 这是已披露的资金用途顺序，不是逐季度现金流模型；图中不代表获批时间、上市概率或实际收入收益率。
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
      - CI012
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Kailera 的可见架构是一套分层临床开发体系，覆盖授权权利、试验执行、后续资产和证据控制。
    data:
      layers:
        - label: 权利与来源层
          detail: Hengrui 授予的大中华区以外权利，决定 Kailera 能够开发并最终商业化哪些资产。
          modules:
            - label: 地域权利
              note: U.S., Europe, and Japan while Greater China stays with Hengrui
            - label: 资产包
              note: Four GLP-1-based obesity programs
          outputs:
            - label: Pipeline access
              note: Licensed platform breadth
          note: The core dependency is the licensor relationship, not a fully disclosed in-house discovery stack.
        - label: 核心临床引擎
          detail: 注射型 ribupatide 是主要价值驱动因素，也是指定资产池中唯一得到深入描述的全球项目。
          modules:
            - label: KaiNETIC 项目
              note: Global Phase 3 plus U.S. Phase 2b context
            - label: 患者群体
              note: Adults with obesity or overweight with comorbidities and no diabetes
          outputs:
            - label: Pivotal evidence
              note: 2027-2028 readout path
        - label: 后续给药途径扩展
          detail: 口服 ribupatide 在每周注射之外增加了给药途径选择。
          modules:
            - label: 口服 ribupatide
              note: Planned global Phase 3 in 2027
          outputs:
            - label: Convenience thesis
              note: Non-injectable obesity pathway
        - label: 产品组合对冲层
          detail: 如果核心资产表现不及预期，KAI-7535 和 KAI-4729 可拓宽给药形式选择。
          modules:
            - label: KAI-7535
              note: Kailera Phase 2 / Hengrui China Phase 3 context
            - label: KAI-4729
              note: Early tri-agonist style option
          outputs:
            - label: Additional shots on goal
              note: Breadth outside a single molecule
        - label: 质量与安全控制
          detail: 公开可见的控制措施主要针对临床研究，而非商业运营。
          modules:
            - label: 试验设计
              note: Randomized, parallel, double-masked
            - label: 安全性终点
              note: TEAEs, antibodies, biomarker follow-up
          outputs:
            - label: Trust signal
              note: Protocol discipline
        - label: 公开验证缺口层
          detail: 最薄弱的一层是试验之外的商业和技术透明度。
          modules:
            - label: 披露面
              note: Nasdaq page lacked key operating data; SEC browse capture was unusable
            - label: 缺失的外部代理指标
              note: No practitioner or developer signal in assigned pool
          outputs:
            - label: Diligence blocker
              note: Hard to verify scale-up and controls from public evidence alone
    claimRefs:
      - CE001
      - CE003
      - CE006
      - CE011
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Kailera 当前触达客户的路径始于试验招募，随后经过证据读出、可及渠道建立，最终进入对留存高度敏感的商业化阶段。
    data:
      items:
        - label: 招募试验参与者
          detail: 当前用户触点是患者入组，而不是已运营的客户账户基础。
          touchpoints:
            - ClinicalTrials.gov 显示 KaiNETIC-1 有 110 个地点。
            - 该研究由 Kailera 发起。
        - label: 生成关键验证证据
          detail: 产品仍在受控环境中验证安全性和疗效。
          touchpoints:
            - KaiNETIC-1 采用随机、平行分组、双盲设计。
            - Fierce 称 IPO 资金将支持 3 项全球 Phase 3 试验至 Q2 2028。
        - label: 接近早期可及渠道
          detail: 初期商业化更可能从容易触达的渠道开始，而不是广泛报销。
          touchpoints:
            - IQVIA 称，在许多国家，自费将继续主导可及性。
            - 雇主项目和数字健康平台被列为触达患者的渠道。
        - label: 赢得处方方与支付方信任
          detail: 扩大客户基础需要超越品牌标识或品类热度的证据。
          touchpoints:
            - 商业证据仍是前瞻性的，而非当前已具备的证据。
            - 留存资料中没有公开与上市相关的 Kailera 特定支付方或合作伙伴标识。
        - label: 管理留存与耐受性
          detail: 持续复购处方取决于坚持使用，而不只是初始需求。
          touchpoints:
            - IQVIA 称，不同品牌和国家之间的持续用药差异显著。
            - 患者最常将耐受性问题列为停止 GLP-1 治疗的首要原因。
        - label: 扩大份额或失去份额
          detail: 减重市场奖励差异化疗效，也会惩罚仅次于最佳的结果。
          touchpoints:
            - BioPharma Dive 显示，更强的疗效也可能伴随更高的停药率。
            - The Independent 称，试验表现较弱会压低需求和市场份额预期。
    approximationNotes: 这张旅程图根据保留的公开证据抽象出可能的客户路径；不代表当前商业转化率。
    claimRefs:
      - CU005
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU013
