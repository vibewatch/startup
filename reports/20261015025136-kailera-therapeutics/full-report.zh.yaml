          - type: paragraph
            body: >-
              Kailera's 公开-公司 披露 表面是更广泛 比 一项 私有 生物科技's, 但 该 工作者's 指定资料池 仍然 剩余 若干 关键 缺口. 该生物制药 Dive 与 已归档 PubMed URLs
              做过不交付 可用 底层 文章, 该 指定 EDGAR 浏览 URL 做过不解决 至 一项 可用 申报 上市 在 抓取 文本, 与 Nasdaq 做过不回报 可用 关键-数据 字段. 那些 错过 做不推翻 该
              故事, 但 他们 做 意味着 尽调 仍然 需要 登录号-具体 申报文件, 运营 指标, 与 类别 基准 证据 之前 该 投资 情景 应当 是 治疗 作为 完全 交叉验证. 在 实践, 他们 融资 该 剩余 机会
              该 投资者 over-read 一项 资本充足 IPO 叙事，但没有 尚未 拥有 该 最佳 公开 工具 至 压力测试 它.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
