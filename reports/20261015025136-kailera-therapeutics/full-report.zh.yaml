      - number: '4.3'
        title: 公开数字能证明什么、不能证明什么
        blocks:
          - type: paragraph
            body: >-
              指定资料池中最清晰的公开资产负债表数字来自间接转述，而不是留存的 SEC 申报。Baidu Baike 转述称，截至 2025 年年末累计亏损为 $368.7m、手头现金为 $652.7m，管理层预计 IPO
              后现金可能支撑运营至 2028 年年中。这些数字与已披露的 3 期资金分配计划大致吻合，方向上有参考价值，但单独来看尚未达到投资判断所需的可信度。资料池中的 Nasdaq
              可访问报价页几乎没有增加交叉验证，因为页面明确说明关键数据不可用；因此，实时价格、流动性和市值核查在留存证据集中仍然缺失。
