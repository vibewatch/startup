  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 商业状态与变现路径
        blocks:
          - type: paragraph
            body: >-
              Kailera 的财务叙事仍是商业化前、以研发为主，而不是靠经常性收入驱动。留存证据将公司描述为临床阶段企业，ribupatide 仅推进至全球 3
              期，且没有公开披露已获批产品或当前产品收入。因此，短期变现仍要依次经过未来上市链条：获批、支付方覆盖、实现净价和患者持续用药，而不是已经确认的销售额。IQVIA 的 2026
              年市场回顾之所以重要，是因为它显示肥胖症药物增长很快，但口服产品、较低价格和自费使用也已在改变准入格局。投资判断的上行空间来自品类扩张，下行风险则来自 Kailera 上市前价格实现可能已经走弱的市场环境。
            claimRefs:
              - CI001
              - CI002
              - CI013
              - CI014
