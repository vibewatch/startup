      - number: '4.2'
        title: 资本基础与有资金保障的开发路径
        blocks:
          - type: paragraph
            body: >-
              Kailera 依靠股权融资快速补充资金。独立报道显示，2026 年 4 月的 IPO 募集约 $625m 总额，此前公司已于 2024 年完成 $400m A 轮、于 2025 年完成 $600m B
              轮。同一组 IPO 报道称，管理层计划在 2028 年第二季度前向注射型 ribupatide 投入约 $625m，向口服 ribupatide 的后期研发投入约 $150m，并向 KAI-7535 投入约
              $50m，其余资金用于其他研发和公司运营。临床与注册信息也说明了这套资金计划为何规模很重：仅 KaiNETIC-1 就计划招募约 1,800 名参与者，以第 76 周为主要终点，整个项目覆盖三项全球 3 期试验。
