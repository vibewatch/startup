        title: 资本扩张速度快于底层披露深度
        blocks:
          - type: paragraph
            body: >-
              Kailera 在指定资料池中的融资历程异常密集。 Fierce 和 BioSpace 均称，公司进入公开市场前已完成 2024 年 4 亿美元 一项 轮和 2025 年 6 亿美元 B 轮。 到 2026 年
              6 月，这两家媒体都将 IPO 描述为创纪录交易；Fierce 进一步披露最终定价为 3900 万股、每股 16 美元、募集总额 6.25 亿美元。 这条资本轨迹解释了为什么后文可以将 Kailera
              视为相对多数商业化前生物科技公司资本异常充足，同时仍需把已验证的公开市场融资事件与较弱、佐证不足的烧钱速度评论分开。
