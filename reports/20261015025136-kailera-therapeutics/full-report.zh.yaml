  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围与成熟度
        blocks:
          - type: paragraph
            body: >-
              Kailera是不尚未 一项 商业 肥胖症 公司，并 一项 已交付 治疗 工作流; 它是一项 临床-开发 堆栈 构建 围绕 四 已授权 GLP-1-基于 资产s 其 近期 "产品"是成功 推进 通过 后期阶段
              试验s. 该最强 公开 证据 在 该 指定资料池 支持s 一项 核心-资产 故事 而非 比 一项 完全 有记录的 平台 故事: ribupatide 注射剂是已经 在 该 KaiNETIC 阶段 3 项目, 而
              oral ribupatide, KAI-7535, 与 KAI-4729 创建 额外 机会 在 目标 覆盖 oral, 肽, 与 小分子 形态. 该 广度 重要 因为 它 给予 Kailera 多个 方式 至
              保持 相关 如果 该 核心 项目 滑落, 但 它 会不尚未 证明 一项 赢家 在 疗效, 耐受性, 或 上市 准备度 在 全球 人群.
