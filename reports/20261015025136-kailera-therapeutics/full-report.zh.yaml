      - number: '3.4'
        title: Kailera 证明自身值得溢价定位前，市场拥挤是主要风险
        blocks:
          - type: paragraph
            body: >-
              Kailera 看起来比许多生物科技同业拥有更充足的资本，但资本本身无法解决市场拥挤。IQVIA 指出，口服剂型、部分市场中的仿制或专利到期
              semaglutide，以及主要药企以产品组合为核心的策略，都会继续分割这个领域。Fierce 补充称，尽管管理层把 ribupatide 描述为潜在的同类最佳，Kailera 仍缺少针对 Zepbound
              的头对头数据。这让公司同时暴露于两种替代压力：一方面，分销更强的现有巨头会直接夺走份额；另一方面，维持治疗替代品或新进入者会逐步削弱公司地位，并让买方更容易采用多种产品。下一步需要验证的是全球 3
              期试验的持久性、耐受性和上市路径，而不是再提出一个宽泛的产品组合主张。
            claimRefs:
              - CP004
              - CP008
              - CP009
              - CP011
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: 图表
        blocks:
          - type: callout
            title: 广度是 Kailera 当前最好的切入口
            body: >-
              Kailera 看起来 较少 如同 一项 一项-资产 肥胖症 初创公司 比 大多数 上市前 同业 因为 该 公开 记录 已经 显示 注射型 与 oral ribupatide 加上 两 额外 机制 押注. 该
              广度 给予 它 更多 机会 在 目标 如果 一项 途径 underdelivers.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP012
              - CP014
          - type: callout
            title: Kailera 证明溢价价值前，市场就可能拥挤
            body: >-
              现有巨头 已经 控制 商业化, 直接 同业是接近 该 oral 缺口, 与 替代品仍然活跃 因为 成本 与 停药是仍然 未解决. 没有 公开 头对头 或 支付方-准备度 证明, Kailera's 最佳-在-类别
              框架化 保持 脆弱.
            calloutType: risk
