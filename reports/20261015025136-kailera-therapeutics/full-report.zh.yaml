            body: >-
              该技术 架构 可见 在 公开 证据是一项 合作 运营 模型 更多 比 一项 独立 药物-工程 堆栈. Kailera 控制措施 ex-Greater-China 权利, 资金 区域 开发, 与是使用 IPO
              所得款项 至 推进 多个 项目s 前瞻, 但 Hengrui仍是central 至 该 原始 资产 包 以及, 根据 至 该 引用 授权 摘要, 生产 临床 材料 在 请求. ClinicalTrials.gov
              给予 该 最清晰 reader-可见 质量-控制 证据: 该 核心 KaiNETIC 研究是随机, 平行分组, 与 双盲,，并 体重, 生物标志物, 抗体, 与 不良-事件 终点 该 匹配 一项 严谨 后期阶段
              肥胖症 项目. 甚至 so, 该 指定资料池 会不给予 一项 Kailera-撰写的 CMC, 设备, 药物警戒, 或 上市-运营 表面, so 制造 转移 与 商业化 准备度仍然披露不足.
