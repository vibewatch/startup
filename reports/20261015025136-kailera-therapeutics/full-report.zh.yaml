chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与当前运营范围
        blocks:
          - type: paragraph
            body: >-
              指定的官方及交易所证据显示，Kailera 是一家刚上市的肥胖症生物科技公司，而非商业化运营商。 Kailera 在官网将自己描述为以肥胖症为首要方向的平台，拥有四项临床阶段候选产品，覆盖多种基于 GLP-1
              的机制和给药途径；BioSpace 与 Fierce 则将该组合与从 Jiangsu Hengrui 授权的资产联系起来。 Nasdaq 和 BioSpace 也确认了其当前的上市公司身份：Kailera 以
              KLRA 在 Nasdaq 全球 Select Market 交易，第三方报道将公司所在地列为马萨诸塞州 Waltham。 因此，现有记录支持一个简洁的运营身份：已上市、临床阶段、聚焦肥胖症、与 Hengrui
              相关；但不足以支持一个已披露收入、客户或人员规模的成熟商业画像。
