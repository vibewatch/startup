companyProfile:
  summary: >-
    Kailera Therapeutics 是一家已上市、处于临床阶段的肥胖症生物科技公司，拥有从 Jiangsu Hengrui 授权而来的四项 GLP-1 管线资产。 公司目前以 KLRA 代码在 Nasdaq
    交易，总部位于马萨诸塞州 Waltham，并通过 4 亿美元 一项 轮、6 亿美元 B 轮及创纪录规模的 2026 年 IPO 完成资本重组。 其产品叙事仍围绕 ribupatide
    及其他后续肥胖症资产展开，但商业画像仍处于收入前阶段，靠证据而非客户牵引。
