      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              当前财务判断的底色是资产负债表韧性加上品类选择权，而不是未经证实的收入质量。对一家临床阶段的肥胖症新进入者而言，Kailera 的资金状况看起来异常充裕；IPO 后的发起方基础仍由 Bain Capital 和
              Hengrui 支撑，这或许有助于未来融资。但投资判断仍取决于留存公开证据尚未解决的问题：实际上市价格、毛额到净额的扣除项、Hengrui 授权下的版税和里程碑义务、商业化建设成本，以及 3
              期读出是否会在现金需求迫使公司重新回到市场融资之前到来。因此，本章结论仍是“资金充足但尽调受阻”，而不是“商业风险已经解除”。
            claimRefs:
              - CI008
              - CI012
              - CI014
              - CI016
