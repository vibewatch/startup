            body: 该最强 公开 证据是该 Kailera 筹集 异常地 大型 股权 资本 用于 一项 临床阶段 肥胖症 生物科技 与 拥有 已经 映射 该 资本 至 具体 开发 项目s; 该 最弱 证据是仍然 商业化 计算.
