      - number: '1.3'
        title: 核心项目规模可见，商业化指标尚未显现
        blocks:
          - type: paragraph
            body: >-
              最清晰的 当前 执行 信号 在 该 指定 证据是不收入 或 客户 进展 但 临床 部署. Fierce 报道 该 Kailera 计划 至 使用 IPO 所得款项 至 资助 注射型 ribupatide 通过
              Kailera 计划让三项全球 3 期试验持续运行至 2028 年第二季度，同时为口服 ribupatide 和 KAI-7535 预留资本。ClinicalTrials.gov 独立显示，Kailera
              作为发起方开展的 KaiNETIC-1 研究采用随机、双盲设计，覆盖 110 个研究中心，并以第 76 周体重为终点。同一资料池还仅提供一段关于 Kailera triple-G
              项目的付费墙预览，且没有可靠的公司层面收入、客户或员工人数披露。因此，规模画像在研发执行上较强，在运营披露上较弱。
