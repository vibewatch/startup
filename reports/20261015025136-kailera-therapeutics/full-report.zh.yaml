      - number: '2.2'
        title: 买方、用户与支付方
        blocks:
          - type: paragraph
            body: >-
              该采用 路径是已经 拆分 由 使用 情景. IQVIA's 2026 市场 评论 表明 oral GLP-1s是开启 新-至-品牌 需求 通过 便利性 与 自费 渠道 而非 比 仅仅 重新分配 现有 注射型
              用户. 该 意味着 多个 预算 所有者 于 once: 患者 在 自费 渠道, 雇主 或 保险公司 其中 报销 存在, 与 生物制药 发起方 而 产品是仍然 批准前. Kailera 本身仍是在 该
              发起方-有资金支持 阶段 目前. 该ClinicalTrials.gov 记录 用于 KaiNETIC-1 显示 一项 后期阶段 肥胖症 或 超重 研究 而非 比 一项 已上市 商业 产品, so 该 即时
              "买方" 围绕 ribupatide是仍然 该 试验-以及中心 生态系统,，并 广泛 支付方-支持 处方 一项 之后 里程碑.
            claimRefs:
              - CM004
              - CM007
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM007
              - CM008
              - CM009
              - CM013
      - number: '2.3'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              三 驱动因素 站在 外部 在 该 资料池: 巨大 疾病 负担, oral 便利性, 与 持续 资本 形成 围绕 差异化 肥胖症 资产s. 在 该 相同 时间, 该 相同 证据 显示 为何 采用是不无摩擦.
              IQVIA 强调 持续用药, 定价, 与 日益 细分 定位; 生物制药 Dive's oral GLP-1 比较 显示 疗效 收益 可以 来自，并 更高 停药 来自 副作用 影响; 与
              BiotechResearch's Kailera-具体 说明 称 该 公司 希望 至 竞争 通过 科学 与 灵活 给药 而非 比低价格. 该 组合 点 至 该 真实 商业 瓶颈: 更好 结果 单独 可能不是
              足够 如果 耐受性, 报销, 与 现有巨头 竞争 保持 患者 或 支付方s 来自 保持 在 治疗.
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM006
              - CM009
              - CM010
              - CM012
              - CM016
      - number: '2.4'
        title: 规模与政策问题仍未解决
        blocks:
          - type: paragraph
            body: >-
              该指定资料池 也 保留 该 缺口 该 重要 大多数 用于 估值. Oral ribupatide 时间安排是不清晰: 一项 留存 文章 称 全球 阶段 3 可能 开始 作为 早期 作为 该 第一 一半 的
              2027, 而 另一项 称 IPO 资金 支持 计划中的 阶段 3 试验s 开始 在 该 第二 季度 的 2028. 该 时间安排 差异 变化 如何 投资者 应当 折现 上市 与 现金需求 假设.
              Separately, 该 资料池 会不提供 一项 直接 相关 主要 来源 在 肥胖症-药物 报销 或 China-采购 政策. 该仅 联邦政策 URL 留存 用于 该 工作者 解决 至 该 HIRE
              CREDIT Act, so 支付方-政策 与 采购-摩擦 尽调 仍然 需要 申报层级 或 监管层级 证据.
            claimRefs:
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 报销范围扩大前，采用率也可能先增长
            body: 该最佳 证据 在 该 资料池 表明 oral 便利性 可以 创建 新 需求 快速, 但 持续用药, 副作用 影响, 与 支付方 政策 仍然 决定 是否 该 早期 采用 变成 持久 收入.
            calloutType: risk
