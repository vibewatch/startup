evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      An accessible prospectus, proxy, or governance page that names founders, directors, committees, insider ownership,
      and formal board composition.
    whyItMatters: >-
      Without a named board and founder record, later judgment on control, succession, and governance quality would
      overstate certainty.
    diligencePath: >-
      Pull the accessible S-1, 424B4, proxy, or investor-relations governance materials in a later pass and map every
      named board and insider holder.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Current revenue, customer count, headcount, and office footprint disclosures.
    whyItMatters: The chapter can establish funding and clinical scale, but not commercial maturity or organizational depth.
    diligencePath: >-
      Use earnings releases, 10-Qs, investor presentations, or management commentary to verify whether any commercial
      metrics are now public.
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: cash-burn
    missingEvidence: A filing-grade source for 2025 cash use, cash balance, and runway after the IPO.
    whyItMatters: >-
      The only explicit burn figure in the assigned pool comes from a low-reputation publisher, so cash-efficiency
      conclusions remain provisional.
    diligencePath: >-
      Confirm year-end and post-IPO liquidity through accessible SEC filings or audited financial statements before
      treating burn and runway as established.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: license-economics
    missingEvidence: Detailed Hengrui license economics, operational responsibilities, and termination rights.
    whyItMatters: >-
      Counterparty concentration is clear, but valuation and risk analysis later in the report need the actual economics
      of the Hengrui agreement.
    diligencePath: >-
      Review the prospectus or material-agreement disclosure and extract upfronts, milestones, royalties, territories,
      and control clauses.
    relatedQuestionRefs:
      - QO005
  - type: conflicting-data
    severity: material
    topic: oral-ribupatide-timing
    missingEvidence: A filing-level or management-confirmed timeline for when global oral ribupatide Phase 3 actually starts.
    whyItMatters: >-
      Launch timing changes valuation discounting, capital-needs modeling, and how much time Kailera has before the
      market crowds further.
    diligencePath: Review the S-1, 10-Q, and earnings-call transcript to reconcile the 1H 2027 versus Q2 2028 timing difference.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: payer-access
    missingEvidence: >-
      Kailera-specific pricing corridor, reimbursement assumptions, and launch-market access strategy for injectable and
      oral ribupatide.
    whyItMatters: >-
      Market size can expand on paper while real adoption stalls if self-pay remains the default or payers restrict
      coverage.
    diligencePath: >-
      Pull management commentary, payer strategy materials, or launch-planning disclosures that spell out target
      channels and reimbursement sequencing.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM008
  - type: missing-source
    severity: material
    topic: policy-and-sourcing
    missingEvidence: >-
      Direct primary sources on obesity-drug reimbursement policy and China-sourcing or biosecurity rules that would
      affect Kailera's licensed pipeline.
    whyItMatters: >-
      Cross-border manufacturing, reimbursement, or policy friction could slow adoption or compress valuation even if
      the clinical data remain strong.
    diligencePath: >-
      Replace the off-topic Congress URL with actual bill text, CMS guidance, or company sourcing disclosures tied to
      obesity medicines.
    relatedQuestionRefs:
      - QM006
      - QM008
  - type: private-evidence-only
    severity: material
    topic: launch-pricing
    missingEvidence: Kailera and Viking public list pricing, expected net pricing, rebate assumptions, and payer-contract structure.
    whyItMatters: >-
      Pricing and reimbursement leverage are central to switching, access, and gross-margin durability, but prelaunch
      biotech disclosures here are minimal.
    diligencePath: >-
      Request launch pricing assumptions, payer-planning materials, and any public-access pilot data from management or
      underwriting materials.
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: comparative-proof
    missingEvidence: >-
      Head-to-head or durable comparative data versus Zepbound, Wegovy, or oral peers on efficacy, tolerability, and
      persistence.
    whyItMatters: >-
      Kailera's moat and best-in-class framing are not underwritten until switching-relevant proof exists against
      incumbent benchmarks.
    diligencePath: >-
      Track KaiNETIC readouts, comparator trials, and real-world adherence disclosures; request any unpublished payer or
      KOL comparative decks.
  - type: private-evidence-only
    severity: material
    topic: commercial-readiness
    missingEvidence: >-
      Kailera's patient-support, distribution, and reimbursement-readiness plan versus incumbent obesity launch
      infrastructure.
    whyItMatters: >-
      Capital and pipeline breadth do not automatically translate into uptake if persistence support and payer
      navigation lag incumbents.
