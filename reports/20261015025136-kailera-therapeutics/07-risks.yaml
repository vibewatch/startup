  evidenceGaps:
    - type: missing-source
      severity: material
      topic: license-economics
      missingEvidence: Accession-specific S-1 / final prospectus URLs and the Hengrui agreement schedules that spell out milestone, royalty, governance, and termination mechanics.
      whyItMatters: Residual legal and economic downside cannot be ranked precisely until the actual filing text and agreement terms are reviewed line by line.
      diligencePath: Retrieve the direct SEC accession pages and attachment indexes, then reconcile the agreement clauses against management commentary and cash-use plans.
      relatedQuestionRefs:
        - QR003
        - QR005
      relatedTableRefs:
        - TR001
    - type: access-blocked
      severity: material
      topic: external-benchmarking
      missingEvidence: A usable independent article and a usable peer-reviewed or review-style class benchmark for oral GLP-1 efficacy and safety.
      whyItMatters: The current pool confirms that those two URLs were unavailable, but it does not replace the missing analytical context they were expected to provide.
      diligencePath: Pull fresh accessible substitutes for the blocked BioPharma Dive and archived PubMed titles, then re-test oral-class risk and competitive positioning.
      relatedQuestionRefs:
        - QR004
        - QR007
    - type: private-evidence-only
      severity: material
      topic: operating-triggers
      missingEvidence: Enrollment cadence, protocol-amendment history, manufacturing-readiness detail, and actual burn-versus-plan updates between the IPO and pivotal readouts.
      whyItMatters: Those are the monitorable triggers most likely to show thesis breakage before 2027-2028 toplines, but they are not fully visible in this public fast-profile pool.
      diligencePath: Request management or filing-level operating updates each quarter and compare them against the disclosed use-of-proceeds plan and study timeline.
      relatedQuestionRefs:
        - QR008
