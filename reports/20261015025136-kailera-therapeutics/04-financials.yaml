schemaVersion: report-v2
artifact: financials
slug: kailera-therapeutics
runDate: 2026-10-15
company:
  name: Kailera Therapeutics
chapter:
  number: 4
  title: Financials
  summary: >-
    Kailera's financial case is still balance-sheet first: the retained evidence
    centers on a record $625 million IPO, disclosed program allocations, and a
    claimed runway into mid-2028 rather than any current product revenue or
    reported unit economics. The underwriting question is therefore whether the
    present capital base can carry global Phase 3 execution and launch
    preparation before pricing, margin, and commercialization assumptions become
    externally verifiable.
sections:
  - id: commercial-status-and-monetization
    title: Commercial status and monetization path
    body: >-
      Kailera's financial narrative is still pre-revenue and development-led,
      not recurring-revenue-led. The retained evidence describes the company as
      clinical-stage, with ribupatide only in global Phase 3 and no public
      disclosure of approved products or current product revenue. That means
      near-term monetization still runs through a future launch stack -
      approval, payer coverage, realized net pricing, and persistence - rather
      than booked sales. IQVIA's 2026 market review matters because it shows
      that obesity medicines are growing quickly, but also that oral entrants,
      lower prices, and cash-pay uptake are already changing access dynamics.
      For underwriting, upside comes from category expansion; downside comes
      from entering a market where price realization may weaken before Kailera
      launches.
    claimRefs: [CI001, CI002, CI013, CI014]
    tableRefs: [TI001, TI002]
  - id: capital-base-and-funded-development
    title: Capital base and funded development path
    body: >-
      Kailera has financed speed with equity. Independent reporting says the
      April 2026 IPO added about $625 million of gross proceeds after a
      $400 million Series A in 2024 and a $600 million Series B in 2025. The
      same IPO reporting says management intended to devote roughly
      $625 million to injectable ribupatide through the second quarter of 2028,
      around $150 million to oral ribupatide late-stage work, and about
      $50 million to KAI-7535, with the balance for other R&D and corporate
      use. Clinical and registry disclosures reinforce why that cash plan is
      heavy: KaiNETIC-1 alone targets roughly 1,800 participants with a Week-76
      primary endpoint, and the program spans three global Phase 3 trials.
    claimRefs: [CI002, CI003, CI004, CI005, CI006, CI007, CI008]
    figureRefs: [FI001]
  - id: public-number-quality
    title: What the public numbers do and do not prove
    body: >-
      The sharpest public balance-sheet figures in the assigned pool come
      indirectly, not from a retained SEC filing. Baidu Baike relays an
      accumulated deficit of $368.7 million at year-end 2025, $652.7 million of
      cash on hand, and management's expectation that post-IPO cash could fund
      operations until mid-2028. Those figures are directionally useful because
      they fit the disclosed Phase 3 allocation plan, but they are not yet
      underwriting-grade on their own. The accessible Nasdaq quote page in this
      pool adds little triangulation because it explicitly says key data is
      unavailable, so live price, liquidity, and market-cap checks are missing
      from the retained evidence set.
    claimRefs: [CI010, CI011, CI012, CI015]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict
    body: >-
      The current financial case is balance-sheet durability plus category
      optionality, not proven revenue quality. Kailera appears exceptionally
      well funded for a clinical-stage obesity entrant, and the post-IPO sponsor
      base remains anchored by Bain Capital and Hengrui, which may help future
      financing access. But the underwrite still depends on facts the retained
      public evidence does not resolve: realized launch pricing, gross-to-net
      deductions, royalty and milestone obligations under the Hengrui license,
      commercial build cost, and whether Phase 3 readouts arrive before cash
      needs pull the company back to the market. That keeps the chapter's
      verdict at "capitalized but still diligence-blocked," not "commercially
      de-risked."
    claimRefs: [CI008, CI012, CI014, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Injectable ribupatide
        - Future prescription sales after approval, payer coverage, and persistence
        - Net sales per treated patient
        - No current revenue disclosed; lead asset remains pre-commercial
        - Potential core stream but entirely unproven today
        - Request launch model by geography, payer mix, gross-to-net, and uptake
      - - Oral ribupatide
        - Future oral obesity prescriptions if late-stage work succeeds
        - Net sales per treated patient
        - Study-start timing is disclosed, but no launch economics are public
        - Option value only; not underwritable revenue yet
        - Request formulation economics, target geographies, and launch sequence
      - - KAI-7535
        - Future oral GLP-1 sales or partnering receipts after development
        - Net sales or milestone cash
        - Phase 2 funding is disclosed, but monetization terms are not
        - Speculative until rights strategy and registrational path are clearer
        - Request commercialization rights, partner strategy, and regulatory plan
      - - Ex-US or partnership monetization
        - Potential milestones, royalties, or co-development support
        - Contract cash / royalty %
        - Assigned evidence does not disclose Kailera's forward milestone or royalty receipts
        - High uncertainty; economics may be material
        - Request full Hengrui license schedule and any territorial carve-outs
    notes: >-
      Public evidence supports the launch pathway and funding context, but not
      realized pricing, royalties, or booked revenue; unknown cells reflect
      non-disclosure, not zero economics.
    claimRefs: [CI001, CI013, CI014]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Program / price point
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - Injectable ribupatide
        - null
        - No list or realized price is disclosed in the assigned pool
        - Payer rebates, coverage limits, and ex-US net pricing are unknown
        - Public evidence gap; current sources only support pre-launch context
      - - Oral ribupatide
        - null
        - No list or realized price is disclosed in the assigned pool
        - Oral convenience may widen access, but category pricing is tightening
        - IQVIA says lower prices and cash-pay uptake are reshaping access
      - - Category backdrop
        - $66bn list-price sales in 2025; $92bn forecast in 2026
        - Category growth is visible, but Kailera realized pricing is not
        - Off-patent semaglutide and oral entrants may pressure net price
        - IQVIA market context; not a Kailera revenue forecast
    notes: >-
      Null price cells mean the retained public evidence does not disclose a
      Kailera list price or net price; the only usable pricing evidence here is
      category context from IQVIA.
    claimRefs: [CI001, CI013, CI014]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - 2025 year-end cash
        - $652.7m
        - Low
        - Sets runway against the current Phase 3 spending plan
        - Confirm directly from retained SEC filing or latest 10-Q
      - - 2025 accumulated deficit
        - $368.7m
        - Low
        - Shows how much capital has already been consumed before launch
        - Confirm directly from retained SEC filing or latest 10-Q
      - - Post-IPO runway
        - Through mid-2028
        - Low
        - Defines the likely next financing trigger versus trial milestones
        - Request a quarterly cash bridge with downside scenarios
      - - KaiNETIC-1 trial scale
        - 1,800 participants; 110 visible locations; Week-76 primary endpoint
        - Medium
        - Large global enrollment implies multi-year operating burn
        - Request enrollment pace, per-site cost, and screening-failure assumptions
      - - Gross margin / royalty burden
        - null
        - Unavailable
        - Future margin will depend on manufacturing, fill-finish, and Hengrui economics
        - Request COGS build, royalty range, and milestone schedule
      - - CAC / payback / launch spend
        - null
        - Unavailable
        - Commercial efficiency cannot be inferred from a pre-launch biotech without a field plan
        - Request launch org size, channel mix, and payback assumptions
    notes: >-
      Quantified rows are secondary relays unless otherwise stated; null means
      the assigned public evidence does not disclose the metric, not that the
      metric is zero or irrelevant.
    claimRefs: [CI002, CI010, CI011, CI012, CI015]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Disclosed capital sources feed development programs now; commercial revenue remains downstream of approval and pricing.
    data:
      nodes:
        - id: capital-pool
          label: Capital pool
          detail: Series A, Series B, and IPO proceeds fund the company before commercial revenue exists.
        - id: injectable-phase3
          label: Injectable ribupatide Phase 3
          detail: Roughly $625m is earmarked through 2Q 2028 for three ongoing global Phase 3 trials.
        - id: oral-ribupatide
          label: Oral ribupatide development
          detail: Around $150m is planned for late-stage work expected to start as early as 1H 2027.
        - id: kai-7535
          label: KAI-7535 development
          detail: About $50m is planned to support Phase 2 completion.
        - id: other-r-and-d
          label: Other R&D and G&A
          detail: Remaining proceeds are earmarked for other R&D activity and general corporate operations.
        - id: commercial-revenue
          label: Commercial revenue
          detail: Timing, price realization, and margins remain undisclosed and depend on approval plus payer access.
      edges:
        - from: capital-pool
          to: injectable-phase3
          label: Lead use of IPO proceeds
        - from: injectable-phase3
          to: oral-ribupatide
          label: Follow-on obesity franchise funding
        - from: oral-ribupatide
          to: kai-7535
          label: Additional program allocation
        - from: kai-7535
          to: other-r-and-d
          label: Balance of proceeds supports platform and overhead
        - from: other-r-and-d
          to: commercial-revenue
          label: Revenue only emerges after successful development and launch
    approximationNotes: >-
      This is a disclosed fund-use sequence, not a quarter-by-quarter cash-flow
      model; the figure does not imply approval timing, launch probability, or
      realized revenue yield.
    claimRefs: [CI003, CI004, CI005, CI006, CI007, CI008, CI012]
callouts:
  - calloutType: insight
    title: Financing, not unit economics, is the current proof point
    body: >-
      The strongest public evidence is that Kailera raised unusually large
      equity capital for a clinical-stage obesity biotech and has already mapped
      that capital to specific development programs; the weakest evidence is
      still commercialization math.
    claimRefs: [CI003, CI004, CI007, CI008]
  - calloutType: risk
    title: Pricing power and market triangulation remain soft spots
    body: >-
      The retained evidence set still lacks direct gross-to-net, margin, and
      live trading data, while category evidence already points to lower prices,
      oral competition, and cash-pay dynamics that could compress future launch
      economics.
    claimRefs: [CI014, CI015]
