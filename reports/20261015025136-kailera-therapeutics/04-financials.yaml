      severity: material
      topic: launch-pricing
      missingEvidence: Kailera list pricing, gross-to-net assumptions, payer mix, rebates, and ex-US pricing corridor.
      whyItMatters: Revenue quality cannot be underwritten without knowing whether eventual net price survives payer friction and category-wide price pressure.
      diligencePath: Request launch pricing model, payer strategy deck, and gross-to-net bridge by launch geography.
      relatedQuestionRefs: [QI006]
      relatedTableRefs: [TI002]
    - type: private-evidence-only
      severity: blocking
      topic: license-economics
      missingEvidence: The full Hengrui license economics, including milestones, royalties, termination rights, and any cost-sharing obligations.
      whyItMatters: Royalty and milestone structure will directly determine long-run gross margin and the cash burden of advancing multiple obesity assets.
      diligencePath: Obtain the complete license agreement or a management-prepared schedule of payment triggers and ranges.
      relatedQuestionRefs: [QI004]
      relatedTableRefs: [TI001, TI003]
    - type: missing-source
      severity: blocking
      topic: burn-bridge
      missingEvidence: A direct retained SEC filing or latest quarterly statement tying pre-IPO cash, IPO proceeds, burn, and runway into a current quarter-by-quarter cash bridge.
      whyItMatters: Indirect secondary relays are not enough to size dilution timing or test whether cash reaches key Phase 3 readouts.
      diligencePath: Add the S-1, 10-Q, and management runway bridge used for board forecasting.
      relatedQuestionRefs: [QI005]
      relatedTableRefs: [TI003]
    - type: access-blocked
      severity: material
      topic: live-market-data
      missingEvidence: Live or recent price, liquidity, and market-cap data beyond the retained Nasdaq placeholder page.
      whyItMatters: Without visible current trading data, investors cannot triangulate financing flexibility or how much market support remains after the IPO.
      diligencePath: Retain an accessible market-data or company-filing source with current share count, price, and float context.
      relatedQuestionRefs: [QI007]
