company:
  name: "Kailera Therapeutics"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Kailera is now a public, obesity-focused clinical-stage biotech trading as KLRA, built around four GLP-1-based assets licensed from Jiangsu Hengrui and recapitalized through unusually large 2024-2026 financings. The strongest near-term ground truth is the combination of a record-scale 2026 IPO, a still-concentrated leadership bench visible in the assigned evidence, and a lead ribupatide program already operating a 110-site global study footprint."
sections:
  - id: "identity-and-scope"
    title: "Identity and current operating scope"
    body: "The assigned official and exchange evidence places Kailera as a newly public obesity biotech rather than a commercial operator. On its homepage, Kailera describes an obesity-first platform with four clinical-stage product candidates spanning multiple GLP-1-based mechanisms and routes of administration, while BioSpace and Fierce tie that portfolio to assets licensed from Jiangsu Hengrui. Nasdaq and BioSpace also anchor the current public-company identity: Kailera trades on the Nasdaq Global Select Market under KLRA, and third-party reporting locates the company in Waltham, Massachusetts. The available record therefore supports a concise operating identity—public, clinical-stage, obesity-focused, Hengrui-linked—but not a mature commercial profile with disclosed revenue, customers, or staffing scale."
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: "capitalization-and-public-market-entry"
    title: "Capitalization moved faster than underlying disclosure depth"
    body: "Kailera's financing history in the assigned pool is unusually compressed. Fierce and BioSpace both describe a $400 million 2024 Series A and a $600 million 2025 Series B before the company reached public markets. By June 2026, the same two outlets were describing the IPO as record-breaking, while Fierce detailed final pricing at 39 million shares, $16 per share, and $625 million in gross proceeds. That capital trajectory matters because it explains why later chapters can treat Kailera as exceptionally well funded relative to most precommercial biotechs, while still separating verified public-market capitalization events from weaker, less corroborated burn-rate commentary."
    claimRefs: [CO005, CO006, CO007, CO009]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: "lead-program-scale-and-deployment"
    title: "Lead-program scale is visible; commercialization metrics are not"
    body: "The cleanest current execution signal in the assigned evidence is not revenue or customer traction but clinical deployment. Fierce reports that Kailera intended to use IPO proceeds to fund injectable ribupatide through three ongoing global Phase 3 trials into the second quarter of 2028, while also reserving capital for oral ribupatide and KAI-7535. ClinicalTrials.gov independently shows Kailera as sponsor of a randomized, double-masked KaiNETIC-1 study with 110 locations and a week-76 body-weight endpoint. The same pool also includes only a paywalled preview on Kailera's triple-G program and no reliable company-level revenue, customer, or headcount disclosure, so the scale picture is strong on R&D execution and weak on operating disclosure."
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015]
  - id: "leadership-and-governance-visibility"
    title: "Leadership visibility is narrow and creates diligence follow-up"
    body: "Leadership evidence in the assigned pool is materially thinner than financing and trial evidence. Fierce names Ron Renaud as CEO and notes his prior role leading Cerevel Therapeutics, which supports a credible biotech-financing and development profile, but the same pool does not surface comparable board, founder, or committee-level detail. ClinicalTrials.gov adds an unnamed Kailera medical director as study director for KaiNETIC-1, which is useful for operational context but not a substitute for named governance visibility. As a result, the current chapter can establish key-person concentration around the CEO and active clinical execution, but it must leave founder history, board composition, and insider-control questions as explicit gaps rather than implied facts."
    claimRefs: [CO010, CO013]
    tableRefs: [TO002]
