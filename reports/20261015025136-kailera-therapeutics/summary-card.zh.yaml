    - 按触发条件、终止权和运营责任拆分的 Hengrui 授权经济条款。
    - 经核实的员工人数、职能配置计划，以及 2026 年第一季度之后的运营烧钱轨迹。
    - Kailera 针对支付方准入的策略、定价区间和上市顺序假设。
    - 能证明在中国生成的 ribupatide 和 KAI-7535 数据，能在全球人群和试验设计中稳定复现。
