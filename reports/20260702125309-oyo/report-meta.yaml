companyProfile:
  summary: >-
    OYO, whose parent company Oravel Stays now uses PRISM as its corporate brand, has
    evolved from an India-focused budget-hotel aggregator into a global hospitality
    platform spanning Hotels, Homes, and Listings. The business now combines branded
    distribution, revenue management, partner operating software, and franchise- or
    service-fee streams across OYO, Townhouse, Motel 6, Studio 6, Belvilla, DanCenter,
    and Checkmyguest. The June 2026 UDRHP shows a business that is materially more
    international, more profitable, and more filing-ready than during earlier IPO attempts,
    but still not fully transparent on leverage-adjusted economics, cap-table detail,
    and several underwriting-critical operating metrics.
  foundedDate: '2013-01-01'
  founders:
    - name: Ritesh Agarwal
      role: Founder & Group CEO
      background: >-
        Founder who remains the public face of OYO / PRISM's strategy, international
        expansion, and renewed IPO process.
      claimRefs:
        - CO002
        - CO009
  foundingLocation: Gurugram, India
  headquarters: Gurugram, Haryana, India
  productSummary: >-
    Branded and managed stays, vacation homes, listings, and partner operating tools
    sold through consumer booking surfaces and owner software, with monetization from
    room-night sales, commissions, royalties, listing fees, marketing services, and
    related hospitality adjacencies.
  customerFocus: >-
    Budget-to-midscale leisure and business travelers, extended-stay guests through
    Motel 6 and Studio 6, vacation-home guests in Europe, and hotel-owner partners
    that use OYO's revenue-management, onboarding, and operations tools.
  businessModel: >-
    Asset-light hospitality platform combining demand generation, branding, revenue
    management, franchising, and service fees, with increasing international exposure
    and a more franchise-weighted mix after the G6 Hospitality acquisition.
  stage: pre-IPO
  fundingStatus: >-
    PRISM's 2026 UDRHP proposes an all-fresh ₹6,650 crore IPO, while public reporting
    says existing shareholders include SoftBank, Microsoft, Airbnb, Peak XV, Lightspeed,
    Khazanah, and Greenoaks. Public vendor estimates of cumulative historical funding
    vary, so the report relies on filing-backed issue structure rather than an uncorroborated
    lifetime-raised figure.
