summary:
  headline: >-
    Track: OYO's filed turnaround and global-scale repositioning now support a real IPO
    conversation, but leverage, litigation, profit-quality adjustments, and a stretched
    $7-8 billion ask still require disciplined underwriting.
  overallScore: 6.2
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 7500
    revenueRunRateUsdM: 732
    arrUsdM: null
    revenueGrowthYoYPct: 16
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: null
    customerCount: null
    headcount: null
  topStrengths:
    - Filing-backed turnaround data now supports the narrative, with FY25 revenue of ₹6,252.8 crore, FY25 profit of ₹244.8 crore, and stronger 9M FY26 performance already visible.
    - "OYO is no longer an India-only budget-stay story: the UDRHP shows 293,554 storefronts across more than 35 countries and a revenue mix that is overwhelmingly international."
    - The G6 acquisition adds scale and a more franchise-like royalty-and-brand-services revenue stream through Motel 6 and Studio 6.
    - The platform spans Hotels, Homes, and Listings with partner software, direct booking surfaces, and multiple monetization layers rather than a single marketplace fee rail.
  topRisks:
    - The marketed $7-8 billion valuation remains materially above the 2024 private-mark references and is not yet validated by a public market-clearing price.
    - Borrowings remain high and most IPO proceeds are earmarked for debt repayment, keeping leverage and refinancing dependency central to the equity story.
    - Litigation and regulatory overhangs—including Zostel, partner disputes, and competition or tax-related issues—remain meaningful even after operational improvement.
    - Public disclosure still lacks full cap-table economics, cash and debt-maturity detail, segment profitability, and a verified current headcount.
    - Recent profitability is real but not perfectly clean, because public adverse reporting says FY25 benefited materially from a deferred tax gain.
  unresolvedGaps:
    - Final cap-table, preference, and any pre-IPO placement terms before bookbuilding.
    - Cash balance, debt-maturity ladder, and post-repayment interest-cost bridge.
    - Segment-level profitability and normalized economics across Hotels, Homes, Listings, and G6.
    - Verified current employee headcount and regional staffing mix.
    - Market-clearing IPO price band and actual demand signals once the public book opens.
disclaimer: >-
  This report is based on publicly available information as of 2026-07-02. It is not
  investment advice. Any investment decision should be conditioned on prospectus-grade
  issuer disclosure, management diligence, and the eventual public price band.
