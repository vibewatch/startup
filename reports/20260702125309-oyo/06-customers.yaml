  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, renewal, repeat-booking, and cohort-survival data by customer segment or geography.
    whyItMatters: Customer durability is central to underwriting OYO, yet current public proof is dominated by top-of-funnel breadth and adverse anecdotes rather than renewal data.
    diligencePath: Request cohort data for guests and hotel-owner partners, plus churn reasons by brand and market.
    relatedQuestionRefs:
    - QU012
    - QU025
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Revenue concentration by brand, geography, top hotel-owner cohorts, and corporate-travel accounts.
    whyItMatters: OYO's public surfaces show many brands and many partners, but they do not show which groups economically dominate the network.
    diligencePath: Request GMV, room-night, and revenue contribution by brand, geography, top partner, and corporate account buckets.
    relatedQuestionRefs:
    - QU022
  - type: missing-source
    severity: minor
    topic: current-success-cohort
    missingEvidence: A current 2025–2026 cohort of named satisfied hotel owners with multi-period retention and economic outcomes.
    whyItMatters: Most named owner-side evidence available publicly is either historical launch proof or adverse legal conflict, which biases diligence toward risk rather than durability.
    diligencePath: Ask OYO for a current owner reference set with occupancy, OTA mix, payout timeliness, and retention data.
    relatedQuestionRefs:
    - QU007
    - QU014
    relatedTableRefs:
    - TU003
