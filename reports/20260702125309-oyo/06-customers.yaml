- id: TU003
  title: Named customer proof table
  columns:
  - Customer / partner
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome / evidence
  - Limitation
  rows:
  - - Rajesh Yadav (first patron, Gurugram)
    - Independent hotel owner / supply partner
    - Early proof that OYO could help a small hotel owner get more customers
    - Production launch partner
    - Official about page names him as first patron; NDTV recounts founder saying word-of-mouth from Yadav Ji helped OYO take off
    - Very old proof point; no current economics or retention data
  - - Surjendu Shaker Panda
    - Hotel owner onboarded through OYO360
    - Used self-onboarding and owner-growth products such as OTA Powerplay and Discover OYO
    - Production owner, but launch-era reference
    - Quoted saying onboarding was smooth and occupancy was already rising with OYO products
    - Single company-selected reference; no multi-period retention disclosed
  - - Rakesh Yadav / Yellow White Residency Hotel
    - Former OYO hotel partner and creditor
    - Pursued payment dispute under master service agreement
    - Production partner in dispute
    - Reportedly settled for INR 16 lakh after insolvency proceedings were initiated
    - Proof is adverse; does not show a healthy durable cohort
  - - Madan Jain / Samskara Resort
    - Hotel owner / adverse claimant
    - Alleged fictitious OYO bookings created GST liabilities
    - Production partner in dispute
    - Reported ₹2.66 crore GST demand against bookings allegedly logged before the resort existed
    - Serious allegation from lower-reputation media; needs court or regulator confirmation
  notes: This table is a sampled named-proof set rather than an exhaustive customer census. It intentionally mixes positive and adverse owner-side proof because current public evidence is stronger on operator anecdotes than on disclosed cohorts.
