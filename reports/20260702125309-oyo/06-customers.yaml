  - - TherealDeal / Hospitality News
    - Operational disputes and backlash
    - Manager dispute, layoffs, owner protest narrative
    - Operators and staff
    - Shows partner-side disputes can spill into reputation and continuity risk
  notes: 'Complaint sources are heterogeneous and partly self-selected. Their value here is triangulation: multiple independent channels point at the same failure modes.'
