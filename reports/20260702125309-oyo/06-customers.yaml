- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration or friction risk
  - Impact
  - Evidence
  - Diligence path
  rows:
  - - OYO360 brings offline owners online
    - Owner economics may disappoint if payouts or guarantees fail
    - Supply growth can be fast, but trust can unwind quickly
    - Hotelier India / ETTravelWorld plus dispute sources
    - Request cohort economics by owner-vintage and market
  - - Co-OYO pricing and promo tools encourage deeper usage
    - Algorithmic pricing or promo dependence can shift margin away from owners
    - Platform engagement may improve occupancy but increase dependence
    - Co-OYO feature set and owner testimonials
    - Request take-rate and promo economics before and after program opt-in
  - - Multiple lodging brands diversify demand
    - Public materials do not disclose revenue concentration by brand or geography
    - One brand or market could dominate economics despite broad surface area
    - Belvilla, Motel 6, Studio 6, Townhouse, Collection O, SilverKey pages
    - Request revenue and room-night split by brand and market
  - - Corporate-travel channel broadens use cases
    - No disclosed concentration in top corporate accounts
    - Could create lumpy B2B exposure or procurement friction
    - OYO for Business claim only
    - Request top-account and contract-renewal concentration
  - - Independent hotel-owner network provides scale
    - Legal claims and adverse anecdotes suggest owner-trust fragility
    - Partner churn could propagate quickly through the network
    - FE, Inc42, vLex, The420, UnlistedZone, Hospitality News
    - Request gross and net supply additions, owner churn, and dispute aging
  notes: The core concentration risk is not a single named customer; it is dependence on a very large long-tail network of hotel owners whose economics are not publicly disclosed.
