  figureRefs: []
- id: adoption-and-usage-proxies
  title: Adoption signals and usage proxies
  body: 'Current public adoption proof is far stronger on breadth than on depth. The consumer app still shows large review volume—1.96 million reviews at a 4.6 rating when fetched—which indicates substantial top-of-funnel usage. On the owner side, OYO360 remains the clearest historical adoption proof: trade coverage said more than 70 percent of incoming owners had never sold online, digital demand moved toward 80 percent on average from 10–20 percent before joining, and the first 100 owners onboarded via OYO360 were seeing about 95 percent online bookings. The Co-OYO app reinforces the idea that owner-side engagement is ongoing rather than one-time; it exposes payouts, occupancy, ARR, reviews, and escalation management. What is missing is the connective tissue between these signals and durable economics. None of the fetched sources say how many of those app users book repeatedly, how many owners churn, or which brands or markets concentrate demand.'
  claimRefs:
  - CU005
  - CU006
  - CU013
  - CU014
  - CU016
  - CU017
  - CU035
  - CU036
  tableRefs:
  - TU002
  - TU004
  figureRefs:
  - FU002
- id: named-customer-proof
  title: Named customer and partner proof
  body: 'Named proof exists, but it is skewed toward owner-side stories and disputes rather than a pristine enterprise-reference set. The cleanest positive proof is historical: OYO names Rajesh Yadav as its first patron, and NDTV quotes Ritesh Agarwal saying Yadav Ji later told friends that OYO got him more customers, helping word of mouth take off. Launch-era owner proof is still visible through Hotelier India, which quotes Surjendu Shaker Panda saying OYO360 was efficient and that OTA Powerplay and Discover OYO were already lifting occupancy. After that, the named record turns more adverse. Venture Intelligence, Financial Express, Inc42, and vLex all show owner-side payment or guarantee disputes, from Rakesh Yadav and Mona Agarwalla to Shree Veer and Chief Hospitality. Rajasthan allegation coverage adds Madan Jain and Nitin as named hoteliers who say fabricated bookings created severe tax exposure. The public record therefore proves that OYO''s owner network is real, economically meaningful,
    and litigable; it does not prove a broadly disclosed durable success cohort.'
  claimRefs:
  - CU011
  - CU012
  - CU015
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU024
  - CU025
  - CU039
