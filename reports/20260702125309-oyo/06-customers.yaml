  - FU003
- id: retention-expansion-and-concentration
  title: Retention, expansion, and concentration risk
  body: OYO's public expansion levers are visible, but its retention math is not. Co-OYO gives owners recurring tools for pricing, promotions, payouts, and guest-experience management, which suggests the company expects continuing owner engagement after signup. OYO for Business suggests a corporate channel, and the brand portfolio shows a diversified surface across budget transient, business, vacation-home, motel, and extended-stay use cases. Those are positives. The problem is that current public sources do not disclose NRR, GRR, repeat-booking rates, top-account concentration, or what percentage of network economics sits in any one brand or geography. In that vacuum, concentration risk shifts from a small number of big logos to the long tail of owner relationships. If owner trust deteriorates—through payment disputes, guarantee disputes, or booking-integrity issues—the supply base can fragment quickly. OYO may still have meaningful expansion loops; it simply does not disclose enough current
    cohort data to verify how durable they are.
  claimRefs:
  - CU003
  - CU016
  - CU017
  - CU035
  - CU036
  - CU038
  - CU040
  tableRefs:
  - TU005
  figureRefs:
  - FU001
- id: adverse-evidence-and-churn-gaps
  title: Adverse evidence and churn gaps
  body: 'The strongest current public evidence in this chapter is unfortunately adverse. Guest review platforms converge on the same themes: refunds that never arrive, confirmed bookings not honored, extra charges at the property, and support channels that do not close the loop. The owner side has even heavier downside signals in legal and trade-media coverage, from guarantee disputes in the US to GST-linked booking allegations in Rajasthan and a manager dispute in New York. This does not prove that OYO is failing across the board; it proves that public current evidence is much richer on failure modes than on retention math. Because OYO does not publish guest repeat-booking rates or partner churn cohorts, the best public churn indicators are precisely these complaint channels. That leaves a diligence gap: OYO may have a large and active customer base, but outsiders cannot yet tell whether that base is compounding, merely transacting, or quietly churning beneath the headline inventory count.'
