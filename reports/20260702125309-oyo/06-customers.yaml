  - - Trustpilot
    - 1.4 / 5
    - Refund delays, nonexistent bookings, no-response support
    - Guests
    - Highlights service-recovery weakness across countries
  - - SmartCustomer
    - 1.4 stars / 81 reviews
    - Double charging, properties no longer affiliated, poor refunds
    - Guests
    - Corroborates booking-integrity risk
