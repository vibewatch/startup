  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Contrasts the guest and hotel-owner journeys that make OYO a two-sided network.
  data:
    nodes:
    - id: g1
      label: Guest discovers OYO or partner brand
      detail: App, web, OTA partners, Motel 6, Studio 6, Belvilla, Townhouse, or Collection O surface.
      tone: neutral
    - id: g2
      label: Guest books and expects smooth confirmation
      detail: OYO markets easy cancellations, payment flexibility, and support.
      tone: positive
    - id: g3
      label: Guest stay succeeds or escalates
      detail: Good outcomes can drive word of mouth; bad outcomes trigger refund or affiliation disputes on review sites.
      tone: warning
    - id: o1
      label: Owner learns about OYO
      detail: Offline or lightly digitized owner sees a path to occupancy growth.
      tone: neutral
    - id: o2
      label: Owner self-onboards via OYO360
      detail: Launch-era proof says 30-minute onboarding with OTA autofill and AI photo checks.
      tone: positive
    - id: o3
      label: Owner runs live property in Co-OYO
      detail: Daily pricing, invoices, reviews, occupancy, payouts, and escalations create ongoing dependency.
      tone: positive
    - id: o4
      label: Owner expands or disputes economics
      detail: Good cohorts opt into programs like OTA Powerplay; bad cohorts appear in legal or complaint channels.
      tone: warning
