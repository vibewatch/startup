company:
  name: OYO
chapter:
  number: 6
  title: Customers
  summary: 'OYO''s customer base is two-sided: guests and corporates book inventory through a large multi-brand lodging surface, while hotel and home owners are the critical supply-side customers who onboard, price, and operate properties through OYO tools. Public proof of breadth is strong—large review volume, broad brand coverage, and visible owner-onboarding claims—but public proof of durability is weak because OYO does not disclose repeat-booking, renewal, or churn metrics. The most current named owner evidence is disproportionately adverse, making partner-trust and booking-integrity risk the key open questions.'
sections:
- id: customer-base-and-segmentation
  title: Customer base and segmentation
  body: 'OYO''s customer base is best understood as a two-sided network. On the demand side, it serves budget transient travelers, business travelers, couples and local leisure guests, US motel and extended-stay guests through Motel 6 and Studio 6, and vacation-home users through Belvilla. On the supply side, its critical customers are hotel and home owners who join the network, often with limited prior digital-distribution experience. The root OYO surface still markets more than 174,000 hotels and homes across 35+ countries and 5,000 corporates on OYO for Business. Public brand pages reinforce segment diversity: Townhouse targets millennial and work-friendly stays, SilverKey listings skew toward longer-stay amenity sets, Collection O shows high-volume leisure demand, and Belvilla extends the footprint into European vacation rentals. This breadth is strategically useful, but it does not disclose which segments actually drive revenue or repeat usage.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU029
  - CU030
  - CU031
  - CU032
  - CU033
  - CU034
  tableRefs:
