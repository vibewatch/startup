tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Observed scale signal
  - Revenue / strategic value
  - Gap
  rows:
  - - Budget transient guests
    - Individual traveler is buyer and user; guest pays
    - One-night or short-stay budget booking
    - Consumer app, root web, review volume, OTA exposure
    - Core demand engine and brand funnel
    - No market-level GMV split by segment
  - - Corporate and business travelers
    - Travel manager or employee books; employer pays or reimburses
    - Business trips and repeat city stays
    - OYO for Business claims 5,000 corporates; Townhouse work-friendly amenities
    - Higher-frequency, potentially lower-CAC demand
    - No disclosed retention or account concentration
  - - Hotel and home owners
    - Property owner or operator joins; OYO and owner share economics
    - Bring supply online, run operations, increase occupancy
    - OYO360 and Co-OYO evidence; Rajesh and Surjendu proof; disputes show economic relevance
    - Most strategic supply-side customer set
    - Public data lacks owner churn and payout aging
  - - Vacation-home guests and hosts
    - Leisure traveler books; host lists property
    - European vacation rentals
    - Belvilla 40k+ homes and 2.8M guests in 2020
    - Diversifies beyond city budget hotels
    - Cross-sell with core OYO stack not disclosed
  - - US roadside and extended-stay guests
    - Driver or longer-stay worker pays
    - Weekly or monthly motel / kitchenette stays
    - Motel 6 weekly and monthly offers; Studio 6 kitchen-led value prop
    - Broadens US use cases and length-of-stay mix
    - Public economics by US brand absent
  - - Couples / local leisure guests in India
    - Guest pays directly
    - Affordable, amenity-light short stays
    - Collection O host page cites 1000+ couple stays; app review channels show heavy leisure usage
    - High-volume transactional demand
    - Repeat frequency and cancellation rates undisclosed
  notes: Segments combine guest-side and owner-side customers because OYO operates a two-sided network. Scale signals come from current public surfaces rather than audited revenue segmentation.
