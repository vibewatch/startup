- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Debt paydown underdelivers
    - IPO proceeds for borrowings are materially reduced or refinancing pressure persists
    - The balance-sheet repair argument weakens immediately.
    - Move valuation stance more negative and widen downside range.
  - - Book price prints below expectation
    - Public price band or institutional feedback lands well below the marketed $7-8B range
    - The headline ask loses credibility before listing.
    - Treat the market-clearing band, not marketing headlines, as the new anchor.
  - - Litigation or franchise noise worsens
    - New material legal disclosure tied to Zostel, partner disputes, or G6
    - Risk discount expands just as public investors are asked to buy growth.
    - Lower confidence and push closer to bear-case pricing.
  - - Profit quality disappoints
    - Segment margin or G6 synergy data fail to support the recent earnings trajectory
    - The valuation case becomes a temporary bounce story rather than a durable rerating.
    - Hold off until better evidence or a lower price appears.
  - - Terms are investor-unfriendly
    - Preferences, side letters, or dilution economics materially reduce common-equivalent upside
    - Headline valuation stops representing investable value.
    - Do not participate at headline price.
  notes: These triggers are written as investable discipline checkpoints rather than broad business risks.
