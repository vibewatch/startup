- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - thesis
  - what would change the view
  rows:
  - - Reopened IPO path
    - A fresh-issue-only structure, strong nine-month FY26 numbers, and a cleaner SEBI path show the story is no longer purely turnaround theater.
    - If book-building stalls or the company needs a deeper discount despite these improvements, confidence in the reopening fades.
  - - Global mix and G6 scale
    - The business now looks more international and franchise-weighted than the earlier India-only narrative suggested.
    - If G6 turns out to be mostly complexity rather than cash-flow quality, the strategic premium shrinks.
  - - Valuation gap
    - A rebound from 2024 private marks is possible because the denominator and financing profile improved materially.
    - If the market refuses to bridge from $2.4-2.5 billion toward the ask, the IPO story reverts to price discipline.
  - - Public comp discipline
    - Mid-single-digit sales references from travel platforms and franchise peers can support a better mark than the downround if momentum holds.
    - If OYO prices like a premium hotel chain without similar visibility, the anti-thesis dominates.
  - - Balance-sheet repair
    - Using proceeds to reduce debt can unlock equity value if refinancing pressure meaningfully declines.
    - If debt paydown is mostly a patch rather than a lasting fix, equity upside remains capped.
  notes: The anti-thesis is mostly about price and proof quality, not about denying that OYO improved operationally.
