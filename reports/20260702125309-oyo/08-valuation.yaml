- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Cap table and preferences
    - Liquidation stack, participation rights, side letters, and founder / promoter economics.
    - Headline value can diverge sharply from actual investable economics.
    - Counsel-led financing document review and board package.
  - - Segment profitability and G6 integration
    - Business-unit margin bridge and synergy realization by geography and brand.
    - Public earnings improvement may not be durable without this detail.
    - Finance diligence plus G6 post-merger operating review.
  - - Debt and refinancing detail
    - Covenant package, debt maturity ladder, and effect of proposed prepayment.
    - Debt reduction is the central use-of-proceeds story.
    - Treasury diligence and lender documentation.
  - - Litigation and regulatory reserve posture
    - Current reserve treatment and probability estimates for disclosed cases.
    - Legal overhang can change both pricing and timing.
    - External counsel memorandum and audit-committee materials.
  - - Market-clearing evidence
    - Price band, anchor book, and real demand feedback.
    - Until the book speaks, the marketed valuation remains aspirational.
    - Re-run the chapter at RHP / book-build stage.
  notes: If these items remain opaque, the rational stance is patience rather than headline-driven enthusiasm.
