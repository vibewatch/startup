  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-terms
    missingEvidence: Detailed preference stack, ratchets, participation rights, founder economics, and any secondary or structured pre-IPO term sheets.
    whyItMatters: Headline valuation can diverge materially from investable economics when preferences and structured liquidity sit above new investors.
    diligencePath: Review the latest cap table, board-approved financing documents, and counsel summary of liquidation preferences and side letters.
    relatedQuestionRefs:
    - QV023
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: segment-profitability
    missingEvidence: Segment-level contribution margin, G6 integration synergies, and bridge from reported profit to durable operating cash generation.
    whyItMatters: The public package shows improvement, but investors still cannot tell how much of profitability is durable versus assisted by mix, one-offs, or financing changes.
    diligencePath: Request monthly business-unit P&Ls, G6 synergy plan, and management bridge from EBITDA to free cash flow.
    relatedQuestionRefs:
    - QV024
    - QV027
    relatedTableRefs:
    - TV006
  - type: stale
    severity: material
    topic: public-market-clearing-price
    missingEvidence: Live order-book feedback or a public price range showing where institutional demand really clears.
    whyItMatters: Today's valuation stance is based on target headlines and comps, not on a demonstrated book-building outcome.
    diligencePath: Re-run the valuation chapter once the red herring prospectus, price band, and anchor book are public.
    relatedQuestionRefs:
    - QV008
    - QV017
    - QV030
    relatedTableRefs:
    - TV003
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set
    missingEvidence: A broader exhaustively screened set of private and public hospitality-technology references with matching geography, brand model, and leverage profile.
    whyItMatters: The comparable table is decision-useful but intentionally non-exhaustive because many relevant private references are either opaque or not fresh enough.
    diligencePath: Expand the comp screen with banker books, recent block trades, and sponsor marks before pricing.
    relatedQuestionRefs:
    - QV011
    - QV012
    - QV016
    relatedTableRefs:
    - TV004
