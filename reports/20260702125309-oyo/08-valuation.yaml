- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  rows:
  - - OYO 2026 marketed ask
    - IPO target range
    - $7B-$8B headline range
    - Current decision anchor investors are being asked to evaluate.
    - Not yet a proven public-market clearing price.
  - - OYO 2024 downround
    - Private financing valuation
    - ~$2.5B
    - Best clean public reminder that the private-market reset was real.
    - Different macro moment and pre-G6 business mix.
  - - OYO late-2024 secondary
    - Private secondary mark
    - ~$3.9B
    - Shows some rebound before the 2026 filing story matured.
    - Secondary transactions can be illiquid and non-control.
  - - MakeMyTrip
    - FY2026 revenue / P-S / market cap
    - $1.04B revenue; 5.29x P/S; $5.52B market cap
    - Closest India travel-platform reference by geography and public listing familiarity.
    - Different asset model and lower lodging-control exposure.
  - - Wyndham Hotels & Resorts
    - 2025 revenue / P-S / market cap
    - $1.43B revenue; 4.35x P/S; $6.25B market cap
    - Useful asset-light hotel-franchise comp near OYO's marketed market-cap zone.
    - Mature U.S. franchisor with cleaner disclosure.
  - - Choice Hotels
    - 2025 revenue / P-S / market cap
    - $1.60B revenue; 4.99x P/S; $4.97B market cap
    - Another economy- and franchise-relevant comp near OYO's marketed range.
    - More mature and less volatile than OYO.
  - - Airbnb
    - 2025 revenue / P-S / market cap
    - $12.24B revenue; 6.91x P/S; $87.42B market cap
    - Premium travel-platform comp that shows what strong marketplace narratives can command.
    - Far larger scale and cleaner public-market history.
  - - Booking Holdings
    - 2025 revenue / P-S / market cap
    - $26.92B revenue; 5.11x P/S; $141.52B market cap
    - Large online-travel reference that bounds platform-style public multiples.
    - Massively larger, more profitable, and far more disclosed.
  - - Marriott
    - 2025 revenue / P-S / market cap
    - $26.19B revenue; 13.52x P/S; $97.12B market cap
    - Shows how high-quality branded lodging assets can still trade at premium multiples.
    - Global premium brand and not a like-for-like technology platform.
  - - Hilton
    - 2025 revenue / P-S / market cap
    - $12.04B revenue; 14.91x P/S; ~$75.9B market cap
    - Useful upper-bound branded-lodging premium reference.
    - Different asset profile, maturity, and public-market trust.
  notes: The set deliberately mixes travel platforms and asset-light franchise operators because OYO now spans both narratives more than it did in earlier filings.
