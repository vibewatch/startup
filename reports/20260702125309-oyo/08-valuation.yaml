sections:
- id: S801
  title: Recommendation and what is actually disclosed
  body: 'The public-evidence recommendation on OYO today is track, not immediate enthusiasm. The improvement story is real: Prism has filed an updated prospectus, the issue is structured as a fresh issue with no offer-for-sale, the company disclosed strong nine-month FY26 revenue and profit versus FY25, and the book is being presented as a cleaner third attempt rather than a distressed last try. But the marketed valuation remains an ambition, not a cleared price. Nearly ₹4,987.5 crore of proceeds are earmarked for debt repayment, which is constructive, yet it also reveals that the offer is solving a balance-sheet problem as much as funding growth. That does not invalidate the story; it simply means valuation should be judged on disciplined terms. Until the public band and demand are visible, OYO looks investable to watch closely, but not yet priced to chase.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV005
  - CV006
