company:
  name: OYO
chapter:
  number: 8
  title: Valuation
  summary: 'OYO''s 2026 filing finally provides enough public evidence to frame a real valuation debate, but not enough to accept the marketed $7-8 billion range without discipline. The most defensible public-evidence stance is track with a stretched valuation view: progress on profitability, international scale, and debt paydown is meaningful, yet the jump from 2024 private marks to the new ask still runs ahead of what public comps and disclosure quality prove cleanly.'
tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - dimension
  - value
  - rationale
  rows:
  - - Recommendation
    - track
    - The filing shows real progress, but the public record still does not justify treating the marketed valuation as already cleared.
  - - Confidence
    - medium
    - There is enough data to bound outcomes, but not enough to underwrite terms, segment economics, or final price.
  - - Risk Rating
    - high
    - Leverage relief, litigation overhang, and the valuation gap versus 2024 marks still matter.
  - - Valuation Stance
    - stretched
    - The top-end ask needs cleaner proof than public evidence currently supplies.
  - - Decision implication
    - Stay engaged only with price discipline and an explicit diligence list.
    - The right posture is active tracking rather than automatic participation.
  notes: This table is price-sensitive and assumes the marketed $7-8 billion range remains the decision anchor until a public price band proves otherwise.
