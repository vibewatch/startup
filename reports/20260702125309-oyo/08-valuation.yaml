- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - probability signal
  - core assumptions
  - valuation logic
  - implied equity value
  rows:
  - - Bull
    - Book demand accepts global mix, debt paydown, and G6 optionality as evidence of a much stronger OYO than 2024 implied.
    - FY26 momentum holds, litigation stays contained, debt falls sharply, and investors award a premium over Wyndham/Choice-like references.
    - Approach the top-end ask and modestly above if the market accepts premium positioning.
    - $7.0B-$8.5B
  - - Base
    - Investors credit progress but still demand a discount for leverage history, legal overhang, and incomplete unit economics.
    - Debt repayment lands, revenue remains strong, but price support settles closer to mid-single-digit-billion references.
    - Re-rate above the trough but below the top-end marketing range.
    - $5.0B-$6.5B
  - - Bear
    - The market reanchors on 2024 private marks, legal noise, or doubts about earnings quality and G6 integration.
    - Debt relief helps less than hoped, public investors refuse a premium, or new litigation weakens confidence.
    - Value falls back toward private marks and closer-size public references.
    - $2.5B-$4.0B
  - - Decision anchor
    - Current public headlines center on a marketed ask rather than a proven book-clearing price.
    - Until the price band is public, treat the marketed range as an ambition, not a fact.
    - Do not assume the top end is earned before the market says so.
    - $7.0B-$8.0B target range
  notes: These ranges are price-discipline scenarios anchored to public evidence, private valuation history, and current comp placement rather than to a full DCF.
