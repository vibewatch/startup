  rows:
  - - Discover stay options
    - Guest finds budget or business-travel inventory
    - Consumer app / root web surface
    - Nearby search, last-minute deals, OTA partner reach, discounts
    - Discovery breadth is disclosed; conversion metrics are not
  - - Complete booking
    - Guest prepays or reserves and expects confirmation
    - Consumer app plus partner OTAs
    - Multiple payment methods and member discounts claimed
    - Review data shows refund and booking-integrity failures when execution breaks
  - - Resolve a support issue
    - Guest seeks help about an existing reservation
    - OYO Help Assistant via booking ID
    - A direct self-service entry point exists
    - Public help experience is narrow and does not expose full service workflows
  - - Onboard supply
    - Hotel owner wants to join the network quickly
    - OYO360 / patron surface
    - 30-minute digital onboarding and OTA autofill at launch
    - Current onboarding SLAs and failure modes are not public
  - - Operate property daily
    - Owner/staff manage rooms, guests, and payouts
    - Co-OYO partner app
    - 24x7 support, invoices, occupancy and ARR tracking, escalation visibility
    - No public evidence on data export, reconciliation latency, or audit trails
  - - Optimize revenue
    - Owner tunes availability, promotions, and price controls
    - Co-OYO + OYO Link
    - Wizard, Discover OYO, OTA Powerplay, flash sales, price-insight tools
    - Opaque algorithm design means pricing-side downside is hard to audit
  notes: Observed benefits come from public app listings and onboarding articles. Limitations reflect the absence of public operational metrics and the presence of review-driven support failures.
