  figureRefs: []
tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / Brand
  - Primary User
  - Core Value Proposition
  - Observed Tooling / Workflow
  - Status / Maturity
  - Diligence Gap
  rows:
  - - Core OYO booking platform
    - Budget and midscale guests
    - Search, compare, book, pay, and get support from one mobile-first surface
    - Nearby search, last-minute deals, prepaid bookings, OTA-partnered discovery
    - High maturity; live consumer app updated Jun 2026
    - No public checkout, cancellation, or failure-rate telemetry
  - - Co-OYO partner app
    - Hotel owners and on-property staff
    - Operate the property, manage bookings, and optimize pricing from one app
    - Booking management, invoices, reviews, price controls, payouts, live escalations
    - High maturity; full feature list public on Google Play
    - No public API or admin-permission schema
  - - OYO Link dashboard
    - Distribution and partner teams
    - Expose live inventory with real-time pricing and partner support
    - Global live inventory, 99%+ uptime claim, B2B pricing and coupons
    - Medium-high maturity; public landing page exists
    - Login gate hides deeper workflow details and integration methods
  - - OYO360 / partner onboarding
    - New hotel and home owners
    - Digitize property signup and bring new supply online quickly
    - 30-minute onboarding, AI photo checks, OTA autofill, simplified contracts
    - Launch-era proof available; still important in 2026 diligence
    - Current daily throughput and current adoption curve undisclosed
  - - Townhouse / SilverKey / Collection O
    - Segmented guest cohorts
    - Wrap the core stack in differentiated stay formats and amenity mixes
    - Townhouse business-travel amenities; SilverKey and Collection O listing templates
    - Live brand surfaces, but public docs are mostly property-listing level
    - Brand-level back-end separation vs sharing is not disclosed
  - - Belvilla / Motel 6 / Studio 6
    - Vacation-home and US drive-to / extended-stay guests
    - Expand OYO beyond India-first budget hotels into vacation rentals and longer-stay formats
    - Belvilla property-supply listing; Motel 6 weekly/monthly offers; Studio 6 kitchens
    - Mature adjacent brands with active booking surfaces
    - Public evidence does not show stack-level integration depth
  notes: Rows synthesize current public landing pages and app-store descriptions rather than private product specs. Maturity is an analyst assessment of surface completeness, not audited uptime or defect rate.
