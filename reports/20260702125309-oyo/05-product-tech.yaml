- id: developer-signal-and-public-docs
  title: Developer signal, public documentation, and integration visibility
  body: OYO still leaves a public engineering trail, but it is thin enough to matter in diligence. OYOTech remains live with follower counts, GitHub still shows some public repositories with recent timestamps, and a public Medium profile for OYO Engineering & Data Science exists. That is enough to establish that OYO continues to maintain some outward engineering identity. It is not enough to establish strong developer ergonomics. The oyotech organization has no public repositories, and the fetched OYO360, help-desk, and partner-acquisition pages are mostly title-level or login-oriented. In other words, OYO has visible product brands and visible partner apps, but not the kind of public API, webhook, changelog, or integration documentation that would let an outside investor or strategic partner quickly audit implementation depth. For a hotel marketplace this is not fatal, but it does reduce confidence in how extensible or transparent the tooling really is.
  claimRefs:
  - CE017
  - CE018
  - CE019
  - CE020
  - CE047
  tableRefs:
  - TE006
  figureRefs: []
- id: trust-reliability-and-risks
  title: Trust, reliability, and product risks
  body: 'OYO''s public trust surface is mixed. On the positive side, the consumer app advertises encryption in transit and deletion requests, Townhouse markets 24x7 security and fire safety, and OYO Link claims 99%+ uptime. On the negative side, third-party review platforms consistently converge on booking-integrity and refund issues: SmartCustomer and Trustpilot rate OYO poorly, while JustUseApp and Play reviews repeat complaints about multiple payments, extra charges at the property, and support channels that do not resolve problems quickly. HospitalityNews also frames recent layoffs and backlash as operating-model stress. The practical takeaway is that OYO has a visible stack for guest demand, supply onboarding, and property operations, but public reliability proof is much thinner than public feature proof. That imbalance is survivable if the company can furnish private uptime reports and service-recovery metrics; without them, the feature set looks stronger than the execution evidence.'
  claimRefs:
  - CE014
  - CE024
  - CE036
  - CE042
  - CE043
  - CE045
  - CE046
  - CE048
