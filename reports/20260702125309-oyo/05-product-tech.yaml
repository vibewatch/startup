  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-api-docs
    missingEvidence: Public API, integration, and schema documentation for OYO Link, Co-OYO, and OYO360 beyond marketing-level descriptions.
    whyItMatters: A real product diligence process needs to know whether partner tooling is configurable, extensible, and observable or merely operational front ends.
    diligencePath: Request product documentation, partner onboarding manuals, webhook/API references, and sample integration specs from OYO product or solutions engineering.
    relatedQuestionRefs:
    - QE024
  - type: missing-source
    severity: material
    topic: incident-history
    missingEvidence: A public incident log, status page history, or independently auditable uptime record for OYO booking and partner systems.
    whyItMatters: Marketing claims of 99%+ uptime are not enough to underwrite reliability, guest support load, or compensation risk during outages.
    diligencePath: Ask for historical uptime reports, incident postmortems, service credits, and property-level remediation policies.
    relatedQuestionRefs:
    - QE025
  - type: private-evidence-only
    severity: minor
    topic: brand-integration-depth
    missingEvidence: Documentation showing how Motel 6, Studio 6, Belvilla, Townhouse, SilverKey, and Collection O actually share data, inventory, pricing, or trust controls on a common stack.
    whyItMatters: The public surfaces prove brand breadth but do not prove unified back-end operations or shared support tooling.
    diligencePath: Obtain architecture maps and brand-level operating manuals that show shared versus separate systems.
    relatedQuestionRefs:
    - QE023
    - QE026
