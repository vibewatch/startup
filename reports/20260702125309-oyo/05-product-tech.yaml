- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process
  - Publicly visible component
  - Role in the operating model
  - Dependency
  - Risk / caveat
  rows:
  - - Guest acquisition
    - Consumer app + OTA partner distribution
    - Generates demand and routes bookings into OYO inventory
    - Third-party travel channels named in the app
    - Channel dependence and pricing parity rules are not disclosed
  - - Booking support
    - Booking-ID help assistant
    - Routes users into support for active reservations
    - Clean booking-data linkage and customer-service staffing
    - The public help surface is thin and reviews cite poor issue resolution
  - - Partner supply acquisition
    - Patron page + OYO360
    - Converts hotel supply into OYO-managed inventory
    - Image quality checks, contract simplification, OTA data import
    - Public pages do not expose QA, fraud, or exception-handling rules
  - - Property operations
    - Co-OYO
    - Coordinates staff actions, reviews, invoices, availability, and guest escalations
    - App adoption by staff and accurate permissioning
    - No public documentation on offline mode, reconciliation, or security logging
  - - Network controls
    - OYO Link
    - Centralizes live inventory, pricing, and B2B commercial levers
    - Availability of reliable, low-latency inventory feeds
    - 99%+ uptime is asserted but not independently audited
  - - Brand wrappers
    - Townhouse / SilverKey / Collection O / Belvilla / Motel 6 / Studio 6
    - Package the same or adjacent supply base for distinct customer segments
    - Consistent service controls across brands
    - Shared versus separate systems are unclear from public materials
  notes: This table maps the observed operating stack from public surfaces only. It does not imply direct access to internal APIs or architectural source code.
