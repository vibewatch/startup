- id: guest-and-owner-workflow
  title: Guest booking and owner workflow
  body: The guest-facing workflow is easy to infer from public surfaces even though the back end is opaque. Discovery begins on the consumer app or root web surface, where OYO advertises nearby search, last-minute deals, business-travel relevance, and inventory from named OTA partners. When bookings or support issues arise, the public help surface routes users through a booking-ID based assistant rather than exposing a rich self-service knowledge base. On the supply side, OYO has made the owner workflow more legible than the guest support workflow. Co-OYO exposes booking management, invoices, reviews, occupancy, average room rate, payouts, live escalations, and price controls; OYO Link markets live inventory and real-time pricing; and the company has kept a long-running theme of algorithmic revenue management visible since the 2016 dynamic-pricing launch. This makes OYO look most credible as an operating console for hotel owners rather than as a deeply documented platform product for developers.
  claimRefs:
  - CE007
