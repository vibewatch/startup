summary:
  headline: >-
    Track: OYO's filed turnaround and global-scale repositioning now support a real IPO conversation, but leverage,
    litigation, profit-quality adjustments, and a stretched $7-8 billion ask still require disciplined underwriting.
  overallScore: 6.2
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
