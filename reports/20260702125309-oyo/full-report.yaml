      - number: '5.3'
        title: Onboarding, pricing, and partner enablement
        blocks:
          - type: paragraph
            body: >-
              The clearest product proof in public sources is OYO360 and the surrounding owner toolchain. Trade coverage
              of the launch described a move from roughly 15 days of manual onboarding to a 30-minute digital flow with
              AI-based photo checks, OTA auto-fill, and simplified property activation. Those same launch reports
              claimed that more than 70 percent of incoming owners had never sold online before joining OYO, that the
              first 100 OYO360 patrons were already seeing roughly 95 percent online bookings, and that OYO patrons
              averaged around 80 percent digital demand versus 10–20 percent before joining. Co-OYO extends that
              onboarding pitch into ongoing operations: owners can activate Wizard, Discover OYO, Guest+, flash sales,
              and OTA Powerplay without leaving the app. The core implication is that OYO's moat is operational
              enablement plus centralized demand and pricing. The main caveat is that the public proof is still
              launch-era and marketing-adjacent rather than independently updated for 2026.
