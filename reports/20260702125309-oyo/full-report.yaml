      - number: '1.4'
        title: Adverse history and underwriting caveats
        blocks:
          - type: paragraph
            body: >-
              The main chapter-level adverse item remains Zostel. Public legal and business reporting describes a
              decade-long dispute over the aborted 2015 ZO Rooms deal, and SCC Online’s summary of the Delhi High Court
              ruling indicates that OYO won a meaningful 2025 court reversal by getting the arbitral award set aside.
              That is helpful, but it does not fully remove underwriting risk because the 2026 UDRHP still preserves the
              issue as a live risk factor and explicitly warns about the possibility of up to 7% dilution or an
              equivalent cash payment if proceedings ultimately go the wrong way. The other caveat is capital-market
              discipline. Business Standard reported that SoftBank pushed back on earlier IPO timing and valuation
              expectations, while the UDRHP discloses a promoter-level share pledge. Together those facts suggest the
              company is stronger operationally than it was during earlier failed listing attempts, but governance,
              litigation, and financing-structure diligence still matter materially. It also means later chapters should
              reuse the filing-based risk framing rather than assuming the court win fully resolved the issue.
            claimRefs:
