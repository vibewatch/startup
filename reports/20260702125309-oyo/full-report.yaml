              The strongest current public evidence in this chapter is unfortunately adverse. Guest review platforms
              converge on the same themes: refunds that never arrive, confirmed bookings not honored, extra charges at
              the property, and support channels that do not close the loop. The owner side has even heavier downside
              signals in legal and trade-media coverage, from guarantee disputes in the US to GST-linked booking
