  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The current call stays disciplined because operational improvement is real, but the marketed valuation still
      outruns what public evidence cleanly proves.
    data:
      nodes:
        - id: a
          label: Real progress
          detail: Fresh-issue-only structure, strong 9M FY26 metrics, and clearer SEBI path.
          tone: positive
        - id: b
          label: Strategic expansion
          detail: G6 acquisition and international revenue mix support a broader narrative.
          tone: positive
        - id: c
          label: Valuation gap
          detail: The ask still jumps sharply from 2024 private marks.
          tone: warning
        - id: d
          label: Evidence gap
          detail: Cap table, segment profitability, and final clearing price remain opaque.
          tone: negative
        - id: e
          label: Decision
          detail: Track with discipline rather than chase the marketed range blindly.
          tone: neutral
      edges:
        - from: a
          to: e
        - from: b
          to: e
        - from: c
          to: e
        - from: d
          to: e
