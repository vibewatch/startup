      - number: '4.3'
        title: Unit economics and the best available GTM efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              OYO does not disclose the clean SaaS-style unit economics that many private-market investors would want,
              so the chapter has to rely on proxies. The best public proxy is management’s strategic emphasis on
              company-serviced hotels in India. Business Standard and Hotelier India both say OYO wants that cohort to
              rise from roughly 1,300 properties to 1,800 and from 22% to 44% of booking revenue by FY26. That suggests
              management believes tighter operating control and premium positioning produce better revenue quality than
              pure marketplace inventory. The UDRHP’s revenue notes strengthen that interpretation by showing several
              monetization layers on top of room sales: commissions, royalty income, listing fees, marketing services,
              subscriptions, and add-on categories. Still, public monetization structure is not the same as public unit
              economics. We do not have vertical gross margins, property-level contribution margins,
              customer-acquisition cost, payback, or retention economics. The company-serviced expansion target is
              directionally positive, but it is a strategic claim, not proof of superior realized economics without
              internal cohort data.
