      - number: '2.3'
        title: Buyer, payer, and regional mix
        blocks:
          - type: paragraph
            body: >-
              The user is not always the buyer, and the buyer is not always the payer. In leisure demand, the traveler
              is usually all three. In corporate travel, the employee is the user but a travel admin or finance team
              often controls the workflow, reimbursement policy, and GST-compliant billing requirement. On the supply
              side, the economic buyer is the hotel owner or local operator choosing whether a brand or OTA relationship
              improves occupancy, ADR realization, and working capital enough to justify standardization. India’s
              geography makes this distinction more important. Government and industry sources show that domestic
              tourism remains the deepest demand base, while Goibibo’s own positioning around business, leisure, and
              religious travel suggests that multiple missions matter simultaneously. Hotelivate and Horwath both point
              to growing opportunity outside legacy metros, with branded supply moving into 177 new markets and with
              tier 2, tier 3, and religious destinations likely to absorb more formal inventory over time. OYO’s
              underwriting question is therefore not only whether demand grows; it is whether OYO can match each buyer
              journey with the right booking, trust, and owner-economics proposition.
            claimRefs:
              - CM010
              - CM017
              - CM018
              - CM019
              - CM021
              - CM028
              - CM029
              - CM030
              - CM031
              - CM032
