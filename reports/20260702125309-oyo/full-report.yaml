        - label: Bear case
          low: 2.5
          mid: 3.2
          high: 4
          displayValue: $2.5B-$4.0B
          detail: Reanchors near 2024-2025 private marks and legal discount.
          tone: negative
        - label: Base case
          low: 5
          mid: 5.8
          high: 6.5
          displayValue: $5.0B-$6.5B
          detail: Credits real progress but still discounts the marketed top end.
          tone: warning
        - label: Bull case
          low: 7
          mid: 7.7
          high: 8.5
          displayValue: $7.0B-$8.5B
          detail: Requires book support, debt paydown, and cleaner proof quality.
          tone: positive
