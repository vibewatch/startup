        title: Inherited U.S. franchise and cross-border exposure
        blocks:
          - type: paragraph
            body: >-
              The G6 transaction made OYO more globally relevant, but it also imported a different risk set. Business
              Wire and CNBC frame G6 as a meaningful U.S. franchise platform acquired for $525 million, with roughly
              1,500 hotels and a strong fee base. That scale is attractive. It also means OYO now has direct exposure to
              the litigation and franchise-governance standards of the U.S. economy-lodging market. Current trafficking
              suits show the risk is not hypothetical: one Washington case was dismissed for failure to connect
              franchisor knowledge and agency, while California claims against G6 have been allowed to proceed.
              Meanwhile, G6 has already clashed publicly with AAHOA over economy-brand representation. Pair that with
              OYO's disclosed revenue mix—more than 83% outside India, including 27% from the U.S. and 24% from
              Europe—and cross-border litigation becomes central rather than peripheral to the investment case.
