  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct domestic peers and adjacent Indian chains
        blocks:
          - type: paragraph
            body: >-
              The clearest direct peers are Treebo and FabHotels because they compete with OYO on the same three things:
              standardized value inventory, owner acquisition, and discount-driven direct demand. Treebo’s official
              surfaces emphasize lowest price, service reliability, and Treebo Club points, while its about page says
              the brand is present in 120+ cities. FabHotels presents an even more explicit value-engineering pitch:
              1,500+ hotels across 80+ cities, 500,000+ verified guests, sub-brands for different price points,
              franchise recruitment, and corporate deals. These are not side projects; they are direct attacks on the
              same budget-travel and owner-conversion wedge that OYO uses. Lemon Tree is more adjacent than direct, but
              still relevant because it shows how Indian branded supply has moved far beyond premium hotels. Its own
              history says latent midscale and economy demand was the opportunity. That matters for OYO because the real
              owner decision is not simply “OYO or independence.” In many markets it is OYO versus another branded
              system promising trust, better ADR management, or more formal owner support.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP031
              - CP036
