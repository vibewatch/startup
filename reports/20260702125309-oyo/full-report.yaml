      - number: '8.3'
        title: Public comps and where OYO might fit
        blocks:
          - type: paragraph
            body: >-
              The most useful public discipline comes from two buckets: travel platforms and asset-light hotel
              franchises. Booking and Airbnb show that premium travel platforms can still sustain meaningful sales
              multiples, but they do so at enormous scale and with much cleaner disclosure. Wyndham, Choice, and
              MakeMyTrip are closer in market-cap neighborhood and cluster around the mid-single-digit sales range.
              Marriott and Hilton demonstrate that branded lodging can command richer public multiples, but those are
              global premium franchises with deep public trust and no comparable disclosure gap. That leaves OYO in an
              awkward but understandable place. If investors treat it like a maturing travel-and-franchise hybrid with
              improving numbers, a mid-single-digit billion value is supportable. If investors want to give it the full
              premium narrative immediately, the $7 billion to $8 billion target becomes possible. The problem is that
              today's public evidence is stronger on direction than on proof quality.
