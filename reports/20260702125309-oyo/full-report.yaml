  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      OYO scores well on strategic relevance and improved momentum, but only middling on price support and evidence
      sufficiency.
    data:
      items:
        - label: Momentum improvement
          score: 7
          detail: Filed numbers and profit trend are materially better than the trough years.
          tone: positive
        - label: Strategic breadth
          score: 7
          detail: International mix and G6 broaden the story beyond India budget hotels.
          tone: positive
        - label: Balance-sheet clarity
          score: 5
          detail: Use of proceeds is explicit, but leverage still needs the IPO to resolve.
          tone: warning
        - label: Public valuation support
          score: 4
          detail: The ask still sits ahead of what public marks prove cleanly.
          tone: negative
        - label: Evidence sufficiency
          score: 4
          detail: Cap table, segment margins, and final book-clearing price are still missing.
          tone: negative
        - label: Downside protection
          score: 4
          detail: History shows the market has already repriced OYO sharply once before.
          tone: warning
    approximationNotes: Scores are ordinal 0-10 judgments anchored to the chapter evidence, not management KPIs.
    claimRefs:
      - CV003
      - CV005
      - CV013
      - CV017
      - CV036
