  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - Debt paydown underdelivers
        - IPO proceeds for borrowings are materially reduced or refinancing pressure persists
        - The balance-sheet repair argument weakens immediately.
        - Move valuation stance more negative and widen downside range.
      - - Book price prints below expectation
        - Public price band or institutional feedback lands well below the marketed $7-8B range
        - The headline ask loses credibility before listing.
        - Treat the market-clearing band, not marketing headlines, as the new anchor.
      - - Litigation or franchise noise worsens
        - New material legal disclosure tied to Zostel, partner disputes, or G6
        - Risk discount expands just as public investors are asked to buy growth.
        - Lower confidence and push closer to bear-case pricing.
      - - Profit quality disappoints
        - Segment margin or G6 synergy data fail to support the recent earnings trajectory
        - The valuation case becomes a temporary bounce story rather than a durable rerating.
        - Hold off until better evidence or a lower price appears.
      - - Terms are investor-unfriendly
        - Preferences, side letters, or dilution economics materially reduce common-equivalent upside
        - Headline valuation stops representing investable value.
        - Do not participate at headline price.
    notes: These triggers are written as investable discipline checkpoints rather than broad business risks.
    claimRefs:
      - CV003
      - CV007
      - CV013
      - CV017
      - CV036
      - CV039
      - CV040
      - CV043
      - CV044
      - CV045
      - CV046
  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner or diligence path
    rows:
      - - Cap table and preferences
        - Liquidation stack, participation rights, side letters, and founder / promoter economics.
        - Headline value can diverge sharply from actual investable economics.
        - Counsel-led financing document review and board package.
      - - Segment profitability and G6 integration
        - Business-unit margin bridge and synergy realization by geography and brand.
        - Public earnings improvement may not be durable without this detail.
        - Finance diligence plus G6 post-merger operating review.
      - - Debt and refinancing detail
        - Covenant package, debt maturity ladder, and effect of proposed prepayment.
        - Debt reduction is the central use-of-proceeds story.
        - Treasury diligence and lender documentation.
      - - Litigation and regulatory reserve posture
        - Current reserve treatment and probability estimates for disclosed cases.
        - Legal overhang can change both pricing and timing.
        - External counsel memorandum and audit-committee materials.
      - - Market-clearing evidence
        - Price band, anchor book, and real demand feedback.
        - Until the book speaks, the marketed valuation remains aspirational.
        - Re-run the chapter at RHP / book-build stage.
    notes: If these items remain opaque, the rational stance is patience rather than headline-driven enthusiasm.
    claimRefs:
      - CV003
