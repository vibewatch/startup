  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and segmentation
        blocks:
          - type: paragraph
            body: >-
              OYO's customer base is best understood as a two-sided network. On the demand side, it serves budget
              transient travelers, business travelers, couples and local leisure guests, US motel and extended-stay
              guests through Motel 6 and Studio 6, and vacation-home users through Belvilla. On the supply side, its
              critical customers are hotel and home owners who join the network, often with limited prior
              digital-distribution experience. The root OYO surface still markets more than 174,000 hotels and homes
              across 35+ countries and 5,000 corporates on OYO for Business. Public brand pages reinforce segment
              diversity: Townhouse targets millennial and work-friendly stays, SilverKey listings skew toward
              longer-stay amenity sets, Collection O shows high-volume leisure demand, and Belvilla extends the
              footprint into European vacation rentals. This breadth is strategically useful, but it does not disclose
              which segments actually drive revenue or repeat usage.
