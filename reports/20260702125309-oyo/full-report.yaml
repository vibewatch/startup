      - number: '1.3'
        title: Milestones, expansion, and the renewed IPO path
        blocks:
          - type: paragraph
            body: >-
              The public chronology shows a company that kept expanding its geographic and asset scope even while
              capital-market timing moved around. OYO’s official history records the step from India into Malaysia in
              2016 and then into the US, Europe, and the Middle East in 2019, alongside the @Leisure acquisition for
              vacation homes. The next structural jump came with the G6 Hospitality transaction. Blackstone announced a
              $525 million all-cash sale that brought about 1,500 Motel 6 and Studio 6 locations into the portfolio, and
              later reporting shows OYO using that base to keep adding US properties. In India, the company is
              simultaneously pushing its company-serviced model toward 1,800 hotels and more than 300 cities. On the
              financing side, the chronology matters because PRISM moved from a failed 2021 filing to a confidential
              December 2025 submission, a June 2026 public UDRHP, and a renewed valuation ambition in the $7 billion to
              $8 billion band rather than the much higher 2021 aspiration.
