              OYO still leaves a public engineering trail, but it is thin enough to matter in diligence. OYOTech remains
              live with follower counts, GitHub still shows some public repositories with recent timestamps, and a
              public Medium profile for OYO Engineering & Data Science exists. That is enough to establish that OYO
