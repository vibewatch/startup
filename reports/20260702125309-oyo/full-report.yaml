        title: Retention, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              OYO's public expansion levers are visible, but its retention math is not. Co-OYO gives owners recurring
              tools for pricing, promotions, payouts, and guest-experience management, which suggests the company
              expects continuing owner engagement after signup. OYO for Business suggests a corporate channel, and the
              brand portfolio shows a diversified surface across budget transient, business, vacation-home, motel, and
              extended-stay use cases. Those are positives. The problem is that current public sources do not disclose
              NRR, GRR, repeat-booking rates, top-account concentration, or what percentage of network economics sits in
              any one brand or geography. In that vacuum, concentration risk shifts from a small number of big logos to
              the long tail of owner relationships. If owner trust deteriorates—through payment disputes, guarantee
              disputes, or booking-integrity issues—the supply base can fragment quickly. OYO may still have meaningful
              expansion loops; it simply does not disclose enough current cohort data to verify how durable they are.
