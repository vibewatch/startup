  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Residual risk is highest where live litigation, partner trust, and cross-border franchise exposure intersect the
      IPO path.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Zostel appellate downside
          values:
            - label: medium
              tone: warning
              detail: OYO won a major ruling, but the prospectus still flags economic downside.
            - label: high
              tone: negative
              detail: Equity transfer or cash equivalent could hit valuation and confidence directly.
            - label: medium
              tone: warning
              detail: Public disclosure is good, but appellate detail remains limited.
            - label: high
              tone: negative
              detail: This is the cleanest legal thesis-break trigger.
        - label: CCI / antitrust overhang
          values:
            - label: medium
              tone: warning
              detail: The order is known, but appeals and commercial consequences still matter.
            - label: high
              tone: negative
              detail: Competition remedies can constrain important OTA behavior.
            - label: medium
              tone: warning
              detail: Some mitigation exists because the case is disclosed and old.
            - label: medium-high
              tone: warning
              detail: Residual risk is lower than Zostel, but still IPO-relevant.
        - label: Hotel-owner reporting disputes
          values:
            - label: medium-high
              tone: negative
              detail: The FIR and GST notice are live, and broader-pattern allegations persist.
            - label: moderate-high
              tone: warning
              detail: If replicated, partner churn and tax scrutiny can hurt supply quality.
            - label: low-medium
              tone: warning
              detail: Publicly visible mitigation is mostly litigation response rather than system proof.
            - label: high
              tone: negative
              detail: Residual risk stays high until dispute scope is verified.
        - label: Motel 6 / G6 trafficking and franchise risk
          values:
            - label: medium
              tone: warning
              detail: Cases are live, but fact patterns vary.
            - label: high
              tone: negative
              detail: Adverse fact patterns can create outsized brand and legal damage.
            - label: medium
              tone: warning
              detail: Franchisor defenses exist, but control disclosures are thin.
            - label: high
              tone: negative
              detail: The risk matters more now that G6 is part of OYO.
        - label: Leverage and de-leveraging execution
          values:
            - label: medium
              tone: warning
              detail: Borrowings are disclosed and the fix depends heavily on IPO execution.
            - label: moderate-high
              tone: warning
              detail: Missed debt paydown would undermine the balance-sheet reset story.
            - label: medium
              tone: neutral
              detail: Fresh-issue structure is a visible mitigation.
            - label: medium-high
              tone: warning
              detail: Residual severity remains elevated until cash actually lands.
    approximationNotes: null
    claimRefs:
      - CR003
      - CR007
      - CR010
      - CR021
      - CR022
      - CR033
      - CR034
      - CR039
      - CR040
      - CR041
