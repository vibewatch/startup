chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founding, and operating scope
        blocks:
          - type: paragraph
            body: >-
              OYO’s own materials still provide the cleanest anchor for the core identity story. The official about page
              places the first OYO in South City 1, Gurugram in 2013 and ties the company directly to founder Ritesh
              Agarwal. That consumer-facing history is now complemented by the 2026 UDRHP, which is more useful for
              underwriting because it frames PRISM as a full-stack hospitality technology operator rather than only a
              budget-hotel brand. The filing says the company runs Hotels, Homes, and Listings verticals, names brands
              spanning OYO, Sunday, Townhouse, Palette, Motel 6, Studio 6, Belvilla, DanCenter, and Checkmyguest, and
              discloses a much broader multi-country footprint. The result is an identity that has clearly migrated from
              India-centric branded stays to a portfolio model built around software, demand generation, revenue
              management, and brand services across owned consumer channels and partner storefronts.
