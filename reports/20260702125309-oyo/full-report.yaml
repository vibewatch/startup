      - number: '5.5'
        title: Trust, reliability, and product risks
        blocks:
          - type: paragraph
            body: >-
              OYO's public trust surface is mixed. On the positive side, the consumer app advertises encryption in
              transit and deletion requests, Townhouse markets 24x7 security and fire safety, and OYO Link claims 99%+
              uptime. On the negative side, third-party review platforms consistently converge on booking-integrity and
              refund issues: SmartCustomer and Trustpilot rate OYO poorly, while JustUseApp and Play reviews repeat
              complaints about multiple payments, extra charges at the property, and support channels that do not
              resolve problems quickly. HospitalityNews also frames recent layoffs and backlash as operating-model
              stress. The practical takeaway is that OYO has a visible stack for guest demand, supply onboarding, and
              property operations, but public reliability proof is much thinner than public feature proof. That
              imbalance is survivable if the company can furnish private uptime reports and service-recovery metrics;
              without them, the feature set looks stronger than the execution evidence.
