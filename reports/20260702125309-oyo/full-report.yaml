  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              OYO should not be framed as participating in one simple “budget hotel” market. The company touches at
              least five overlapping pools: standardized budget and economy hotels, OTA-led digital accommodation
              distribution, asset-light hotel affiliation networks, vacation-rental substitution, and supply-side hotel
              operating workflows. The competitive pressure is therefore multi-directional. A traveler comparing OYO
              with Treebo or FabHotels is making one decision; a hotel owner choosing between OYO, Lemon Tree
              affiliation, Wyndham conversion, or independence is making another; and a corporate travel admin choosing
              between OYO B, Booking.com, or MakeMyTrip is making a third. Booking.com and Airbnb show why that boundary
              matters. Booking bundles hotels, homes, transport, and attractions inside one marketplace, while Airbnb
              explicitly names hotel chains as competitors and layers experiences and services onto the same customer
              relationship. OYO also markets corporate booking and rapid property onboarding on its own homepage, which
              confirms that the market boundary includes both room-demand acquisition and owner-side monetization. The
              real status quo is not merely an independent hotel room; it is a fragmented stack of offline
              relationships, OTA funnels, budget chains, and alternative stays.
            claimRefs:
              - CM009
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM020
              - CM021
              - CM022
