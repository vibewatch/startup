  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked legal overhang
        blocks:
          - type: paragraph
            body: >-
              OYO's risk profile is now shaped by a rare combination of legacy India litigation, active competition-law
              history, and newly inherited U.S. brand liability. The cleanest top-tier risk is the Zostel matter because
              the company's own filing still warns that an adverse outcome could force a transfer or issuance of up to
              7% of equity or a cash equivalent. That is unusually concrete downside language for a company trying to
              re-enter public markets. The second legal overhang is the CCI case tied to MakeMyTrip-Go, FabHotels, and
              Treebo, where OYO was fined and the broader OTA contracting model was found to involve anti-competitive
              restrictions. Neither issue proves immediate distress, but both remain material because they can shape
              investor confidence, management bandwidth, and public-market narrative at exactly the moment OYO is asking
              buyers to finance balance-sheet repair.
