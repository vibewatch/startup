      - number: '2.2'
        title: Sizing lenses and growth outlook
        blocks:
          - type: paragraph
            body: >-
              Public market evidence supports a large and still-growing backdrop, but it also shows why investors should
              resist a lazy “travel is huge” narrative. The broad India hospitality market is projected at USD 27.96
              billion in 2026, while the narrower India online accommodation market is projected at USD 9.85 billion.
              Those figures are materially smaller than India’s total travel economy and far smaller than the macro
              visitor-spend numbers highlighted by WTTC and IBEF. Hotel operating data also matters: Hotelivate reported
              68% occupancy in 2024/25, while Horwath’s 2025 snapshot showed 64% occupancy with ADR of ₹8,624 and RevPAR
              of ₹5,522, so operating momentum remained positive even if exact datasets differ. Investment appetite
              reinforces the growth story. JLL data cited by The Economic Times says India’s hotel transaction market
              could approach USD 1 billion in 2026 after strong 2025 and Q1 2026 volumes. The right interpretation is
              that OYO’s TAM is not the whole travel sector and not even the whole hospitality sector. The relevant lens
              is the subset where standardized value lodging, digital booking, and owner-affiliation economics overlap.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
              - CM008
