      - number: '4.5'
        title: Adverse adjustments and the biggest diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The strongest public financial caution is that recent profitability is not purely operational. Inc42
              reported that FY25 net profit depended on a large deferred tax gain and that, absent that benefit, the
              company would have shown a pre-tax loss. The UDRHP itself reinforces the point by warning that future
              losses may recur if revenue and expenses do not stay in balance. Investors should also treat litigation
              and promoter financing structure as financial risks, not only governance footnotes: the filing preserves
              the Zostel matter as a live dilution-or-cash-risk factor and separately discloses a pledge over a promoter
              vehicle’s share capital. The unresolved list remains long. Public sources still do not give a current cash
              balance, a debt maturity ladder, interest-cost detail, vertical gross margins, property-level take rates,
              or customer concentration. That means the headline turnaround is real enough to keep the IPO conversation
              alive, but not transparent enough to underwrite without a proper data room and management walk-through of
              definitions, segment economics, and liabilities.
