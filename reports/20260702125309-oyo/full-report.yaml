  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: Seven-step flow from guest discovery through owner operations and service recovery.
    data:
      nodes:
        - id: discover
          label: Guest discovers OYO inventory via app / web / OTA partners
        - id: book
          label: Guest books or prepays and receives reservation data
        - id: support
          label: Booking-ID support surface handles questions or issues
        - id: live
          label: Reservation lands at the property / live inventory system
        - id: operate
          label: Owner or staff manage booking, availability, invoice, and review signals in Co-OYO
        - id: optimize
          label: Owner adjusts price / promotions through OTA Powerplay, Wizard, Discover OYO, and price controls
        - id: recover
          label: Guest escalation or refund problem loops back into support and property operations
      edges:
        - from: discover
          to: book
          label: Search, compare, decide
        - from: book
          to: support
          label: If questions arise
        - from: book
          to: live
          label: Confirmed reservation
        - from: live
          to: operate
          label: Property execution
        - from: operate
          to: optimize
          label: Revenue and occupancy feedback
        - from: operate
          to: recover
          label: Escalations or complaints
        - from: recover
          to: support
          label: Support and refund loop
    approximationNotes: >-
