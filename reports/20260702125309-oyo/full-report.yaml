      - number: '3.2'
        title: OTAs, alternative accommodations, and trip-bundle substitutes
        blocks:
          - type: paragraph
            body: >-
              OYO also competes with a structurally different class of rival: demand aggregators. MakeMyTrip and Goibibo
              capture travelers across flights, holidays, and hotel search; Booking.com goes further by combining
              hotels, homes, transportation, and attractions; and Airbnb fuses alternative stays with experiences and
              trust tooling. These products matter because they intercept demand before a traveler ever decides which
              hotel brand to book. Booking’s 10-K shows enormous supply breadth, and its revenue model spans merchant,
              agency, and advertising streams, which means it has more ways to monetize hotel demand than a branded
              operator does. Airbnb’s own filing says hotel chains are direct competitors, and its experiences product
              makes it more than a room marketplace. Expedia and Vrbo reinforce the same point from another direction:
              vacation rentals and trip bundling remain durable substitutes for hotel-first brands. OYO therefore does
              not just need better hotels than Treebo or FabHotels; it also needs to keep travelers from solving the
              trip at the marketplace layer before OYO becomes part of the shortlist.
            claimRefs:
