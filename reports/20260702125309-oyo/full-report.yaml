      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: OYO still looks unusually broad for a domestic value-lodging operator
            body: >-
              The published combination of 174,000+ hotels and homes, 35+ countries, and a 5,000-corporate travel
              message suggests OYO is trying to compete on both traveler demand and owner/distribution breadth at once.
              Few domestic peers show comparable public footprint messaging.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
          - type: callout
            title: The biggest competitive threat is structural, not cosmetic
            body: >-
              OTAs own bundled demand, global chains own formal owner systems, and domestic peers still fight
              aggressively on price and standardization. OYO can win some city-by-city battles and still lose margin or
              owner stickiness if it remains too dependent on external channels or incentives.
            calloutType: risk
            claimRefs:
