      - number: '4.2'
        title: Revenue mix and monetization architecture
        blocks:
          - type: paragraph
            body: >-
              The UDRHP is unusually useful on business-model shape even though it still leaves realized pricing opaque.
              It shows PRISM monetizing Hotels, Homes, and Listings, with additional lines for marketing, data and
              analytics, performance listing, weddings and events, co-working rent, food, and subscription income. The
              filing is especially helpful on G6 because it says commission and royalty income includes fees charged to
              G6 hotel owners for use of the Motel 6 and Studio 6 brands and related marketing services. That means the
              North American acquisition is not only a scale move; it also introduces a more franchise-like fee stream
              than the classic India budget-hotel narrative suggests. Geography has also shifted dramatically. Multiple
              2026 sources say more than 84% of revenue is now generated outside India, with the US and Europe
              contributing the largest shares. Moneycontrol goes further and says India is now below 12% of revenue.
              This is financially important because it means underwriting should focus on a cross-border portfolio of
              revenue mechanisms, not a single India hotel model.
