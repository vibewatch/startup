      - number: '3.3'
        title: Global chain owner systems and distribution power
        blocks:
          - type: paragraph
            body: >-
              The biggest strategic mistake would be to treat Marriott, Hilton, or Wyndham as irrelevant because they
              are “too premium” or “too global.” Their threat is not that every OYO guest will defect to a Hilton. Their
              threat is that owners, lenders, and professional operators often prefer formal franchise, development, and
              loyalty systems when deciding how to affiliate supply. Marriott’s filing highlights franchised, licensed,
              and managed properties as core system structures; Hilton frames itself as an engine of opportunity for
              owners; and Wyndham explicitly targets conversions and new developments while dominating economy through
              upper-midscale rooms in many markets. These systems create switching costs that are not easily matched by
              discount-led digital acquisition. Loyalty programs, owner playbooks, and development pipelines can keep
              standardized inventory away from OYO even where traveler price points overlap. In other words, OYO’s
              competitive set includes chains that may not look similar on the customer-facing app screen but still
              compete on the economically decisive owner side.
            claimRefs:
              - CP021
              - CP022
              - CP023
              - CP024
              - CP025
              - CP026
              - CP027
              - CP033
              - CP039
