        - CO009
  foundingLocation: Gurugram, India
  headquarters: Gurugram, Haryana, India
  productSummary: >-
    Branded and managed stays, vacation homes, listings, and partner operating tools sold through consumer booking
    surfaces and owner software, with monetization from room-night sales, commissions, royalties, listing fees,
    marketing services, and related hospitality adjacencies.
  customerFocus: >-
    Budget-to-midscale leisure and business travelers, extended-stay guests through Motel 6 and Studio 6, vacation-home
    guests in Europe, and hotel-owner partners that use OYO's revenue-management, onboarding, and operations tools.
  businessModel: >-
    Asset-light hospitality platform combining demand generation, branding, revenue management, franchising, and service
    fees, with increasing international exposure and a more franchise-weighted mix after the G6 Hospitality acquisition.
  stage: pre-IPO
  fundingStatus: >-
