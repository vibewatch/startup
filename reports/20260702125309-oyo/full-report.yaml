      - number: '1.2'
        title: Leadership, governance, and control
        blocks:
          - type: paragraph
            body: >-
              Leadership visibility is better than cap-table visibility. The official about page publicly names a
              recognizable board slate including Aditya Ghosh, Bejul Somaia, Deepa Malik, Troy Alstead, and W. Steve
              Albrecht, while rebrand coverage positions Ritesh Agarwal as founder and Group CEO of PRISM. The more
              important 2026 governance development is SoftBank’s return to the board through Sumer Juneja, because it
              signals a more active investor posture ahead of another IPO attempt. The UDRHP also clarifies promoter
              control better than the website does: Ritesh Agarwal, RA Hospitality Holdings (Cayman), and SVF India
              Holdings (Cayman) are named as promoters. That makes SoftBank not just a historical investor but part of
              the formal promoter architecture. What remains missing is the precise post-round ownership split,
              shareholder-rights package, committee structure, and any public explanation of how promoter pledges
              interact with governance resilience.
