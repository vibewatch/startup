        title: Platform definition and brand architecture
        blocks:
          - type: paragraph
            body: >-
              OYO's public materials support treating the company as a two-sided hospitality operating platform rather
              than only a discount-hotel app. The about page frames OYO as full-stack technology for entrepreneurs and
              small hotel or home businesses, while the root booking surface still markets a global inventory footprint
              and a business-travel channel. The brand layer is broad: the core OYO booking surface sits alongside
              Townhouse for a more polished mid-market stay, SilverKey and Collection O for differentiated listing
              formats, Belvilla for vacation homes, and the acquired US brands Motel 6 and Studio 6 for budget roadside
              and extended-stay demand. The individual brand pages are heterogeneous—some are polished landing pages and
              others are property listings—but together they show OYO wrapping one demand-and-supply engine in multiple
              lodging concepts. This breadth matters because it suggests OYO's product scope is not only guest
              acquisition; it is also merchandising, segmentation, and supply activation across several lodging types.
