      - number: '8.4'
        title: Diligence items and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The final recommendation moves only if a short list of missing facts becomes visible. First, investors
              need the real economics of the capital structure: preferences, secondaries, and any terms that distort the
              headline price. Second, they need better evidence on segment profitability and how much of the recent
              earnings improvement survives once G6 integration and financing effects are normalized. Third, they need
              actual market-clearing evidence from the eventual book. Those missing facts matter because the main bear
              trigger is obvious: the market decides OYO has improved, but not enough to justify the marketed range. A
              lower print would not disprove the business; it would simply reset the entry point. The right decision
              discipline, therefore, is to stay close, define price limits in advance, and refuse to let the IPO
              narrative outrun the evidence. The same discipline applies to timing: if the public band appears only
              after more legal, debt, or integration detail is released, investors should update the case with that
              fresher evidence rather than anchoring on stale aspiration headlines.
            claimRefs:
