companyProfile:
  summary: >-
    OYO, whose parent company Oravel Stays now uses PRISM as its corporate brand, has evolved from an India-focused
    budget-hotel aggregator into a global hospitality platform spanning Hotels, Homes, and Listings. The business now
    combines branded distribution, revenue management, partner operating software, and franchise- or service-fee streams
    across OYO, Townhouse, Motel 6, Studio 6, Belvilla, DanCenter, and Checkmyguest. The June 2026 UDRHP shows a
    business that is materially more international, more profitable, and more filing-ready than during earlier IPO
    attempts, but still not fully transparent on leverage-adjusted economics, cap-table detail, and several
    underwriting-critical operating metrics.
  foundedDate: '2013-01-01'
  founders:
