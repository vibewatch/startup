      - number: '7.4'
        title: Monitoring, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The filing makes clear that OYO is not raising capital just to accelerate growth; it is also raising
              capital to repair the balance sheet. Borrowings remain material and almost ₹4,987.5 crore of planned
              proceeds are earmarked for repayment or prepayment. That creates a useful mitigation because the structure
              is fresh-issue-only, but it also sharpens the kill criteria. If the Zostel appeal hardens into a
              quantified equity transfer, if owner disputes spread across a wider hotel cohort, if trafficking or
              franchise-control cases show a repeat pattern, or if the listing slips and debt paydown remains
              unresolved, the company's risk-adjusted valuation could reset quickly. The public record also lacks the
              non-public evidence that would most improve confidence: current appellate materials, a complete partner
              dispute register, and G6 control documentation. Until those are available, the prudent posture is to treat
              OYO as a company with improving scale and disclosure, but still with a high residual-risk profile.
              Management should also prove exactly how debt repayment sequencing, litigation reserves, and G6 control
              remediation interact if the book launches late or below expectation. That extra documentation is what
              separates a manageable risk stack from a merely postponed one.
