evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-disclosure
    missingEvidence: A current fully diluted cap table with exact ownership percentages, preference stack, and reserved-matter rights.
    whyItMatters: >-
      The public record names promoters and several major shareholders but does not show who actually controls economic
      upside or blocking rights ahead of the IPO.
    diligencePath: >-
      Request the latest shareholder register, preference schedule, and board/committee charters from the company data
      room.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: minor
    topic: headcount-disclosure
    missingEvidence: A verified global employee count and regional headcount split as of 2026.
    whyItMatters: >-
      Headcount is a useful proxy for cost base, integration load, and operating leverage, but public materials reviewed
      here do not provide a reliable current figure.
    diligencePath: Request HR MIS or statutory employee registers by legal entity and region.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: public-governance-roster
    missingEvidence: The complete board, committee, and observer structure including any investor-specific governance rights.
    whyItMatters: >-
      Public bios identify the headline directors but are insufficient for governance diligence on audit, risk, and
      nomination control.
    diligencePath: Request board packs, committee composition, and shareholder-rights summary.
    relatedTableRefs:
      - TO002
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: full-milestone-chronology
    missingEvidence: >-
      A management-approved full chronology of financings, restructurings, and cross-border brand launches with exact
      dates.
    whyItMatters: >-
      The chapter carries only the highest-signal public milestones and cannot substitute for an internal chronology of
      record.
    diligencePath: Request a board-approved corporate timeline or IPO working-group chronology.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: channel-mix
    missingEvidence: Current direct, OTA, and corporate share of OYO bookings by geography and product line.
    whyItMatters: >-
      Without channel mix, it is impossible to judge how much of OYO’s footprint converts into repeatable high-margin
      demand.
    diligencePath: Request cohort-level booking source mix, contribution margin by channel, and repeat-rate data for core cities.
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: material
    topic: owner-economics
    missingEvidence: Realized owner payout, brand fee, take-rate, and onboarding payback by property type and market.
    whyItMatters: >-
      Owner economics determine whether OYO can retain supply against domestic peers, OTAs, and global conversion
      brands.
    diligencePath: Request property-level contribution data, owner contracts, churn by vintage, and city-level payback cohorts.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: minor
    topic: footprint-mix
    missingEvidence: Breakout of OYO footprint among hotels, homes, corporate inventory, and other lodging formats.
    whyItMatters: Public footprint counts do not reveal which inventory types actually drive revenue or strategic positioning.
    diligencePath: Request run-rate room-night and property counts by format, country, and monetization model.
    relatedQuestionRefs:
      - QM025
  - type: missing-source
    severity: minor
    topic: sizing-sam-som
    missingEvidence: A public OYO-specific SAM or SOM model that isolates organized value lodging reachable by OYO economics.
    whyItMatters: >-
      Headline market data can overstate the opportunity if the owner-affiliation layer is much smaller than digital
      travel demand.
    diligencePath: >-
      Build a bottom-up city-by-city SAM using branded budget room supply, average occupancy, ADR, and OYO conversion
      eligibility.
    relatedQuestionRefs:
      - QM023
      - QM024
  - type: private-evidence-only
    severity: material
    topic: owner-fee-comparison
    missingEvidence: Comparable franchise, management, or take-rate economics for OYO, Treebo, FabHotels, and global conversion brands.
    whyItMatters: >-
      Owner acquisition and retention are core to competitive durability, but public surfaces do not reveal which
      platform actually delivers the best economics.
    diligencePath: Collect owner contracts, realized payout data, and churn reasons across converted properties and cities.
    relatedQuestionRefs:
      - QP021
      - QP022
  - type: private-evidence-only
    severity: material
    topic: demand-acquisition-efficiency
    missingEvidence: Direct traffic, OTA concentration, CAC, repeat rate, and app retention data for OYO and direct peers.
    whyItMatters: >-
      Public footprint claims do not show whether OYO can defend demand without subsidized discounts or third-party
      channels.
    diligencePath: Request cohort-level booking-source mix and marketing efficiency metrics by geography.
    relatedQuestionRefs:
      - QP015
      - QP016
  - type: private-evidence-only
    severity: minor
    topic: city-level-overlap
    missingEvidence: City-by-city overlap of OYO, Treebo, FabHotels, Lemon Tree, OTA inventory, and vacation-rental substitution.
    whyItMatters: National footprint statements can hide that rivalry is concentrated in a smaller number of corridors.
    diligencePath: Build a corridor map for top revenue cities, including ADR, occupancy, and owner churn by competitor.
    relatedQuestionRefs:
      - QP003
      - QP005
      - QP010
  - type: private-evidence-only
    severity: material
    topic: cash-and-runway
    missingEvidence: Current unrestricted cash balance, monthly burn, and management runway model by scenario.
    whyItMatters: >-
      Positive recent operating cash flow does not substitute for a real liquidity view when leverage is still high and
      IPO proceeds are earmarked for debt repayment.
    diligencePath: Request treasury dashboard, monthly cash bridge, and board-approved liquidity scenarios.
    relatedQuestionRefs:
      - QI022
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: debt-maturities
    missingEvidence: Debt-by-lender maturity schedule, interest rates, covenants, and collateral package.
    whyItMatters: >-
      The IPO debt-paydown case cannot be underwritten without knowing which maturities and covenants are actually
      relieved by the proceeds.
    diligencePath: Request lender schedule and financing agreements for all material borrowing entities.
    relatedQuestionRefs:
      - QI023
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, take rate, ADR, occupancy, CAC, payback, and retention by operating stream.
    whyItMatters: >-
      Public revenue-structure disclosure is not enough to assess whether growth is compounding or simply masking weak
      contribution economics.
    diligencePath: Request cohort P&Ls and channel-level performance dashboards by geography.
    relatedQuestionRefs:
      - QI024
    relatedTableRefs:
      - TI003
      - TI005
  - type: missing-source
    severity: minor
    topic: customer-concentration
    missingEvidence: A direct disclosure of concentration among the largest US corporate accounts and repeat-booking cohorts.
    whyItMatters: >-
      Recent US growth claims are encouraging, but concentration could distort the apparent quality of the acquired G6
      revenue base.
    diligencePath: Request top-account concentration, channel mix, and repeat-booking cohorts by market.
    relatedQuestionRefs:
      - QI025
    relatedTableRefs:
      - TI003
      - TI005
  - type: missing-source
    severity: material
    topic: public-api-docs
    missingEvidence: >-
      Public API, integration, and schema documentation for OYO Link, Co-OYO, and OYO360 beyond marketing-level
      descriptions.
    whyItMatters: >-
      A real product diligence process needs to know whether partner tooling is configurable, extensible, and observable
      or merely operational front ends.
    diligencePath: >-
      Request product documentation, partner onboarding manuals, webhook/API references, and sample integration specs
      from OYO product or solutions engineering.
    relatedQuestionRefs:
      - QE024
  - type: missing-source
    severity: material
    topic: incident-history
    missingEvidence: >-
      A public incident log, status page history, or independently auditable uptime record for OYO booking and partner
      systems.
    whyItMatters: >-
      Marketing claims of 99%+ uptime are not enough to underwrite reliability, guest support load, or compensation risk
      during outages.
    diligencePath: Ask for historical uptime reports, incident postmortems, service credits, and property-level remediation policies.
    relatedQuestionRefs:
      - QE025
  - type: private-evidence-only
    severity: minor
    topic: brand-integration-depth
    missingEvidence: >-
      Documentation showing how Motel 6, Studio 6, Belvilla, Townhouse, SilverKey, and Collection O actually share data,
      inventory, pricing, or trust controls on a common stack.
    whyItMatters: The public surfaces prove brand breadth but do not prove unified back-end operations or shared support tooling.
    diligencePath: Obtain architecture maps and brand-level operating manuals that show shared versus separate systems.
    relatedQuestionRefs:
      - QE023
      - QE026
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, renewal, repeat-booking, and cohort-survival data by customer segment or geography.
    whyItMatters: >-
      Customer durability is central to underwriting OYO, yet current public proof is dominated by top-of-funnel breadth
      and adverse anecdotes rather than renewal data.
    diligencePath: Request cohort data for guests and hotel-owner partners, plus churn reasons by brand and market.
    relatedQuestionRefs:
      - QU012
      - QU025
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Revenue concentration by brand, geography, top hotel-owner cohorts, and corporate-travel accounts.
