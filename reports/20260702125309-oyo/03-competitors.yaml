- id: TP003
  title: Pricing / packaging comparison
  columns:
  - vendor
  - price/unit/contract model
  - included capabilities
  - discount or unknowns
  - implication
  rows:
  - - OYO
    - Discount-led nightly rates plus owner-affiliation economics not publicly disclosed
    - Standardized stay, member offers, corporate booking signal, property onboarding
    - Realized owner take rates and direct-vs-OTA mix not public
    - Scale alone does not reveal unit economics or stickiness
  - - Treebo
    - Direct-booking value positioning with loyalty points; owner economics not public
    - Guaranteed lowest price pitch, points, standardized support
    - No public realized owner fee schedule
    - Competes with OYO on value plus repeat-user incentives
  - - FabHotels
    - Discount-led nightly pricing plus franchise/corporate packaging
    - Sub-brands, discounts, safe-stay messaging, corporate deals
    - Owner economics and corporate contract detail not public
    - Likely wins when price and perceived safety dominate
  - - MakeMyTrip / Goibibo
    - Marketplace transaction model with discounting and search filters
    - Travel bundle, broad inventory, comparison UI
    - Effective commission rates and hotel take rates undisclosed
    - Strong on demand capture even without operating control
  - - Booking.com
    - Merchant, agency, and advertising revenue model
    - Hotels, homes, transport, attractions, low-rate promise
    - Property-specific commission schedules not public in cited materials
    - High acquisition power can pressure branded hotel direct margin
  - - Airbnb
    - Marketplace booking economics spanning stays and experiences
    - Alternative stays, experiences, trust standards
    - Take-rate detail and hotel penetration by geography not public here
    - Strong substitute for group or experiential travel
  - - Global chains
    - Franchise/management fee structures tied to brand, loyalty, and owner support
    - Brand ladder, loyalty, development support, system standards
    - Exact fee schedules vary by contract and are not public in cited sources
    - Compete for owners who prefer formal brand infrastructure over OTA dependence
  notes: The table compares contract and packaging logic rather than nightly list price because hotel prices vary by city and date. The underwriteable question is monetization architecture, not one scraped room rate.
