- id: TP001
  title: Competitor profile table
  columns:
  - competitor
  - category
  - scale/funding
  - target segment
  - differentiation
  - limitation
  rows:
  - - OYO
    - Direct peer / asset-light value lodging
    - 174,000+ hotels and homes across 35+ countries; trusted by 5,000 corporates
    - Budget leisure, SME corporate travel, hotel owners
    - Scale, standardized budget focus, B2B travel signal, owner onboarding
    - Public disclosures do not show direct-vs-OTA mix or owner economics
  - - Treebo
    - Direct peer / branded budget chain
    - Present in 120+ cities; backing from Accor and InterGlobe
    - Indian budget travelers and property owners
    - Direct-booking loyalty, service standardization, institutional backing
    - Still showing profitability pressure and smaller footprint than OYO
  - - FabHotels
    - Direct peer / branded budget chain
    - 1,500+ hotels across 80+ cities; 500,000+ verified guests; outside funding
    - Budget leisure and corporate travelers; franchise owners
    - Discount-led positioning, franchise recruitment, sub-brand ladder
    - Less global reach and weaker loyalty moat than OTAs or global chains
  - - Lemon Tree
    - Adjacent incumbent / Indian branded chain
    - One of India’s largest hotel chains; spans upscale to economy
    - Travelers and owners seeking branded trust across segments
    - Broader brand ladder and formal hotel-chain infrastructure
    - Less focused on ultra-budget digital acquisition than OYO
  - - MakeMyTrip / Goibibo
    - OTA incumbent
    - Hundreds of thousands of hotels worldwide plus multi-brand travel stack
    - Hotel shoppers across business, leisure, and religious trips
    - Bundle breadth, strong demand capture, high travel intent volume
    - Does not control hotel operations or standardized supply directly
  - - Booking Holdings / Booking.com
    - Global OTA incumbent
    - 5 core brands in 220+ countries; Booking.com at 4.4M properties
    - Global and Indian travelers seeking one-stop trip planning
    - Massive supply breadth and multi-stream monetization
    - Owner-side operating support is weaker than hotel-chain franchisors
  - - Airbnb
    - Alternative accommodation and experience platform
    - Public-company scale with homes plus experiences/services
    - Leisure, group, flexible, and host-led trip demand
    - Substitute inventory plus local-experience retention
    - Does not offer the same standardized hotel operating promise as OYO
  - - Marriott / Hilton / Wyndham
    - Global branded-chain incumbents
    - Millions of rooms or hundreds of thousands of rooms with franchise/development systems
    - Owners and travelers seeking brand trust, loyalty, and system economics
    - Deep owner tooling, loyalty, and franchise infrastructure
    - Indian budget-hotel overlap is partial rather than exact
  notes: Rows mix direct peers, OTA incumbents, alternative-stay platforms, and global hotel-chain incumbents because buyers and owners can solve the same job through several structurally different paths.
