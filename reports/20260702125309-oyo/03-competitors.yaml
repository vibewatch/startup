chapter:
  number: 3
  title: Competitors
  summary: 'OYO faces three overlapping competitive rings: direct Indian branded-budget peers such as Treebo and FabHotels; OTA and alternative-accommodation demand aggregators such as MakeMyTrip, Booking.com, Airbnb, and Expedia/Vrbo; and global hotel franchisors such as Marriott, Hilton, and Wyndham that compete for owners through brand and development infrastructure. Public evidence suggests OYO’s scale is meaningful, but its moat remains less formalized than the owner systems of global chains and less distribution-heavy than the major marketplaces.'
sections:
- id: domestic-peers
  title: Direct domestic peers and adjacent Indian chains
  body: 'The clearest direct peers are Treebo and FabHotels because they compete with OYO on the same three things: standardized value inventory, owner acquisition, and discount-driven direct demand. Treebo’s official surfaces emphasize lowest price, service reliability, and Treebo Club points, while its about page says the brand is present in 120+ cities. FabHotels presents an even more explicit value-engineering pitch: 1,500+ hotels across 80+ cities, 500,000+ verified guests, sub-brands for different price points, franchise recruitment, and corporate deals. These are not side projects; they are direct attacks on the same budget-travel and owner-conversion wedge that OYO uses. Lemon Tree is more adjacent than direct, but still relevant because it shows how Indian branded supply has moved far beyond premium hotels. Its own history says latent midscale and economy demand was the opportunity. That matters for OYO because the real owner decision is not simply “OYO or independence.” In many
    markets it is OYO versus another branded system promising trust, better ADR management, or more formal owner support.'
