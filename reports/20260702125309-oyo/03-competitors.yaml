- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - evidence
  - mitigation/diligence ask
  rows:
  - - OYO footprint scale is enough to dominate domestic value lodging
    - OTAs and global chains may still own stronger demand or owner infrastructure
    - High
    - Booking property scale, Hilton/Marriott/Wyndham owner systems, OYO public messaging gap on economics
    - Request channel mix, direct traffic, owner churn, and cohort profitability
  - - Domestic peers remain fragmented and undercapitalized
    - Treebo now has Accor/InterGlobe backing and FabHotels remains funded
    - High
    - Treebo Accor stake article and FabHotels investor profile
    - Assess supply overlap city by city and watch new branded partnerships
  - - Price-led competition is manageable with member discounts
    - Discounting can drive revenue growth without durable profit
    - Critical
    - Treebo FY24 revenue up but losses widened; Fab and OTA pages stay discount-heavy
    - Test gross margin after discounts and cancellation behavior
  - - OYO can outgrow OTA dependence through scale alone
    - Booking, MakeMyTrip, and Expedia own trip-planning funnels and marketplace breadth
    - High
    - Marketplace sites bundle hotels with transport, attractions, or homes
    - Require direct booking share, paid-marketing efficiency, and OTA concentration
  - - Global hotel chains are too upmarket to matter
    - Marriott, Hilton, Wyndham, and Lemon Tree all court owners through asset-light systems
    - Medium
    - Filings and development pages show formal owner pipelines and brand ladders
    - Measure owner win/loss reasons against conversion brands
  - - Alternative stays are outside OYO’s real market
    - Airbnb competes for hotel nights and expands into experiences and trust tooling
    - Medium
    - Airbnb 10-K plus experiences and standards pages
    - Quantify family/group substitution and city-level overlap with homes inventory
  notes: Severity reflects underwriting relevance, not moral judgment. Most risks come from structural channel or owner-economics differences rather than from superficial feature gaps.
