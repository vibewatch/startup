- id: moat-risks
  title: Switching costs, multi-homing, and adverse evidence
  body: OYO’s moat case rests on footprint scale, recognizable consumer brand, and the possibility that a large standardized value-lodging network can compound supply and repeat demand faster than smaller peers. Public evidence only partially supports that story. Treebo’s Accor and InterGlobe backing suggests institutional capital and global-brand know-how are now entering the domestic direct-peer set. The Economic Times also reports that Treebo grew revenue 23% in FY24 while losses widened 15%, which is adverse evidence that scale in this segment can still require aggressive spend. FabHotels’ homepage remains intensely price- and convenience-led, reinforcing how discounting continues to shape the category. Meanwhile, OTA power remains a persistent threat because marketplaces own comparison, sorting, and trip-bundle behavior. On the owner side, global chains can offer development infrastructure that OYO’s public surfaces do not yet match. The result is a market where multi-homing risk is
    real, switching costs are asymmetric, and the single biggest diligence question is whether OYO can turn raw network breadth into stable direct demand and owner retention rather than subsidized occupancy.
