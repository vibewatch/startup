  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "OYO’s official and filing-backed record now describes a far broader business than the original budget-hotel narrative: parent company Oravel Stays has rebranded to PRISM, the 2026 UDRHP discloses a three-vertical lodging and listings platform across more than 35 countries, and the G6 Hospitality acquisition has made the US materially more important. Governance visibility is improving through a SoftBank board return and a public UDRHP, but litigation, promoter-financing structure, and the still-opaque cap table remain live diligence points."
  },
  "sections": [
    {
      "id": "identity-and-operating-scope",
      "title": "Identity, founding, and operating scope",
      "body": "OYO’s own materials still provide the cleanest anchor for the core identity story. The official about page places the first OYO in South City 1, Gurugram in 2013 and ties the company directly to founder Ritesh Agarwal. That consumer-facing history is now complemented by the 2026 UDRHP, which is more useful for underwriting because it frames PRISM as a full-stack hospitality technology operator rather than only a budget-hotel brand. The filing says the company runs Hotels, Homes, and Listings verticals, names brands spanning OYO, Sunday, Townhouse, Palette, Motel 6, Studio 6, Belvilla, DanCenter, and Checkmyguest, and discloses a much broader multi-country footprint. The result is an identity that has clearly migrated from India-centric branded stays to a portfolio model built around software, demand generation, revenue management, and brand services across owned consumer channels and partner storefronts.",
