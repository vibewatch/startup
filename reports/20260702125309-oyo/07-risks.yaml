chapter:
  number: 7
  title: Risks
  summary: 'OYO''s key residual risks are not generic hotel cyclicality; they are concentrated in a few decision-critical areas: Zostel and CCI legal overhang, partner trust and GST-reporting disputes, and inherited U.S. franchise litigation through G6 and Motel 6. The public filing shows real progress on scale and profitability, but it also confirms heavy international dependence and debt-paydown needs, leaving the right investor stance as closely monitored rather than fully de-risked.'
