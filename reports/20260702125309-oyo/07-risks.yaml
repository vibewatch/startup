  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: partner-dispute-scope
    missingEvidence: A property-by-property record of GST notices, police complaints, and dispute outcomes across Rajasthan and other affected hotel-owner cohorts.
    whyItMatters: The public record mixes one well-documented FIR with low-reputation claims of a broader pattern, so supply-risk severity cannot be fully ranked without a verified dispute inventory.
    diligencePath: Request a management dispute register, major owner churn data, and external counsel summary of tax, police, and civil actions by property and state.
    relatedQuestionRefs:
    - QR008
    - QR021
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: zostel-appeal
    missingEvidence: Current docket materials, pleadings, and settlement posture for the post-Delhi-HC Zostel appeal process.
    whyItMatters: The filing discloses potentially meaningful equity or cash downside, but public sources do not quantify timing, probability, or reserve treatment.
    diligencePath: Obtain external counsel memo, current Section 37 docket status, and management explanation of whether any negotiated resolution has been discussed.
    relatedQuestionRefs:
    - QR001
    - QR003
    - QR005
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: g6-anti-trafficking-controls
    missingEvidence: Current anti-trafficking training, escalation, audit, insurance, and indemnity controls across the G6 franchise system after OYO ownership.
    whyItMatters: Current U.S. lawsuits show exposure is not hypothetical, but public filings do not reveal whether control changes are strong enough to lower recurrence risk.
    diligencePath: Request G6 litigation schedule, franchise manual updates, incident escalation metrics, and insurer / counsel summaries for trafficking-related claims.
    relatedQuestionRefs:
    - QR010
    - QR011
    - QR012
    - QR026
    relatedTableRefs:
    - TR001
  - type: enumeration-incomplete
    severity: minor
    topic: public-legal-risk-register
    missingEvidence: A complete list of all public legal, competition, tax, and franchise disputes beyond the decision-useful sample summarized in the chapter.
    whyItMatters: The legal-risk register is intentionally partial because only the most decision-relevant cases were reviewed from public evidence.
    diligencePath: Run full counsel-led litigation and regulator sweeps in India, the U.S., and key overseas jurisdictions before committing to price or size.
