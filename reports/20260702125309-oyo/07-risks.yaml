- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Zostel downside crystallizes
    - Appellate or settlement outcome
    - Any confirmed obligation to transfer equity, issue up to 7% stake, or pay cash equivalent
    - Re-cut dilution and legal-cost assumptions before underwriting any public price.
  - - Antitrust overhang worsens
    - Appeal or follow-on enforcement
    - New restrictions, follow-on damages claims, or evidence of non-compliance with parity/exclusivity remedies
    - Raise legal discount and cut confidence in OTA-dependent growth.
  - - Partner disputes spread
    - Owner grievance pattern
    - Verified multi-property pattern of fake-booking or GST complaints across states
    - Assume higher churn, higher support cost, and weaker India supply resilience.
  - - U.S. franchise risk turns systemic
    - Litigation/control failure
    - Pattern of trafficking or franchise-governance cases that defeats current evidentiary defenses
    - Apply harsher U.S. reputation and control discount; pause bull-case integration assumptions.
  - - IPO de-leveraging slips
    - Capital-markets timing
    - Listing delay or materially reduced debt paydown versus the filed plan
    - Treat balance-sheet repair as unresolved and widen downside valuation range.
