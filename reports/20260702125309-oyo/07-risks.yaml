sections:
- id: S701
  title: Severity-ranked legal overhang
  body: OYO's risk profile is now shaped by a rare combination of legacy India litigation, active competition-law history, and newly inherited U.S. brand liability. The cleanest top-tier risk is the Zostel matter because the company's own filing still warns that an adverse outcome could force a transfer or issuance of up to 7% of equity or a cash equivalent. That is unusually concrete downside language for a company trying to re-enter public markets. The second legal overhang is the CCI case tied to MakeMyTrip-Go, FabHotels, and Treebo, where OYO was fined and the broader OTA contracting model was found to involve anti-competitive restrictions. Neither issue proves immediate distress, but both remain material because they can shape investor confidence, management bandwidth, and public-market narrative at exactly the moment OYO is asking buyers to finance balance-sheet repair.
  claimRefs:
  - CR001
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  - CR009
  - CR039
  - CR040
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: S702
  title: Partner trust and reporting controls
  body: 'The Jaipur GST and fake-booking dispute matters even if OYO eventually wins because it attacks a sensitive part of the business model: trust between the platform and the hotel owner who provides supply. Multiple reports say Samskara Resort alleged that OYO-reported bookings inflated turnover far above the hotel''s own records and triggered a large GST notice. The Rajasthan High Court stay lowers immediate coercive pressure but does not answer the deeper diligence question: whether the case is isolated, a documentation problem, or evidence of broader control weakness. Low-reputation reports now claim that other Rajasthan hotels received similar notices and that OYO tried to push back on media coverage tied to the FIR. That is not strong enough to treat as confirmed systemic misconduct, but it is strong enough to keep residual partner risk high until management can show reconciliations, dispute counts, and owner-retention outcomes.'
  claimRefs:
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR018
  - CR041
  tableRefs:
  - TR002
  - TR003
  figureRefs:
  - FR002
- id: S703
  title: Inherited U.S. franchise and cross-border exposure
  body: 'The G6 transaction made OYO more globally relevant, but it also imported a different risk set. Business Wire and CNBC frame G6 as a meaningful U.S. franchise platform acquired for $525 million, with roughly 1,500 hotels and a strong fee base. That scale is attractive. It also means OYO now has direct exposure to the litigation and franchise-governance standards of the U.S. economy-lodging market. Current trafficking suits show the risk is not hypothetical: one Washington case was dismissed for failure to connect franchisor knowledge and agency, while California claims against G6 have been allowed to proceed. Meanwhile, G6 has already clashed publicly with AAHOA over economy-brand representation. Pair that with OYO''s disclosed revenue mix—more than 83% outside India, including 27% from the U.S. and 24% from Europe—and cross-border litigation becomes central rather than peripheral to the investment case.'
  claimRefs:
  - CR019
  - CR020
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  - CR028
  - CR030
  - CR031
  - CR038
  tableRefs:
  - TR004
  figureRefs:
  - FR003
- id: S704
  title: Monitoring, mitigations, and thesis-break triggers
  body: 'The filing makes clear that OYO is not raising capital just to accelerate growth; it is also raising capital to repair the balance sheet. Borrowings remain material and almost ₹4,987.5 crore of planned proceeds are earmarked for repayment or prepayment. That creates a useful mitigation because the structure is fresh-issue-only, but it also sharpens the kill criteria. If the Zostel appeal hardens into a quantified equity transfer, if owner disputes spread across a wider hotel cohort, if trafficking or franchise-control cases show a repeat pattern, or if the listing slips and debt paydown remains unresolved, the company''s risk-adjusted valuation could reset quickly. The public record also lacks the non-public evidence that would most improve confidence: current appellate materials, a complete partner dispute register, and G6 control documentation. Until those are available, the prudent posture is to treat OYO as a company with improving scale and disclosure, but still with a high
    residual-risk profile. Management should also prove exactly how debt repayment sequencing, litigation reserves, and G6 control remediation interact if the book launches late or below expectation. That extra documentation is what separates a manageable risk stack from a merely postponed one.'
  claimRefs:
  - CR033
  - CR034
  - CR035
  - CR036
  - CR037
  - CR039
  - CR040
  - CR041
  - CR042
  tableRefs:
  - TR005
