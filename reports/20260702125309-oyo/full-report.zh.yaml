  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              不应把 OYO 简化为参与一个单一的「平价酒店」市场。公司至少触及五个彼此重叠的池子：标准化平价及经济型酒店、OTA
              主导的数字住宿分销、轻资产酒店联盟网络、度假租赁替代品，以及供给侧酒店运营工作流。因此，竞争压力来自多个方向。旅客在 OYO 与 Treebo 或 FabHotels 之间比较，是一种决策；酒店业主在
              OYO、Lemon Tree 加盟、Wyndham 转换或独立经营之间选择，是另一种决策；企业差旅管理员在 OYO B、Booking.com 或 MakeMyTrip
              之间选择，又是第三种决策。Booking.com 和 Airbnb 说明了为什么这个边界重要。Booking 把酒店、民宿、交通和景点打包进一个市场平台；Airbnb
              则明确把酒店连锁列为竞争对手，并把体验和服务叠加到同一客户关系上。OYO
              也在自家首页营销企业预订和快速物业上线，确认市场边界同时包括房间需求获取和业主侧变现。真正的现状替代并不只是一个独立酒店房间，而是一组碎片化的线下关系、OTA 漏斗、平价连锁和替代住宿。
