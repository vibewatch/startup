      - number: '3.4'
        title: 转换成本、多平台经营与负面证据
        blocks:
          - type: paragraph
            body: >-
              OYO 的护城河叙事建立在版图规模、可识别的消费者品牌，以及一个大型标准化高性价比住宿网络能比小同行更快复合供给和重复需求的可能性上。公开证据只部分支持这个故事。Treebo 获 Accor 和
              InterGlobe 支持，说明机构资本和全球品牌经验正在进入本土直接同行集合。The Economic Times 还报道称 Treebo FY24 收入增长 23%、亏损扩大
              15%，这是一个反向证据：该细分市场的规模化仍可能需要激进投入。FabHotels 首页依旧强烈围绕价格和便利性，也强化了折扣仍在塑造品类。与此同时，OTA
              权力仍是持续威胁，因为市场平台掌握比较、排序和行程打包行为。业主侧，全球连锁能提供 OYO 公开页面尚未匹配的开发基础设施。结果是，这个市场里多平台经营风险真实存在，转换成本并不对称，最大的尽调问题是：OYO
              能否把原始网络宽度转化为稳定的直接需求和业主留存，而不是补贴出来的入住率。
