              G6 交易让 OYO 的全球相关性更高，但也带入了一组不同风险。Business Wire 和 CNBC 把 G6 描述为以 $525 million 收购的有意义美国特许经营平台，约有 1,500
              家酒店和强收费基础。这个规模有吸引力，也意味着 OYO 现在直接暴露于美国经济型住宿市场的诉讼和特许经营治理标准。当前人口贩卖诉讼显示，风险并非假设：华盛顿一案因未能连接特许人知识与代理关系而被驳回，加州针对
