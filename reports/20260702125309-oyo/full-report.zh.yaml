  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - OYO 2026 营销要价
        - IPO 目标区间
        - $7B-$8B 头条区间
        - 投资者当前被要求评估的决策锚。
        - 尚未成为已验证的公开市场出清价。
      - - OYO 2024 下轮降估
        - 私募融资估值
        - ~$2.5B
        - 私募市场重置真实发生过，这是最干净的公开提醒。
        - 宏观时点不同，且处于 G6 之前的业务结构。
      - - OYO 2024 年末二级交易
        - 私募二级估值标记
        - ~$3.9B
        - 显示 2026 申报故事成熟前已有一定反弹。
        - 二级交易可能缺乏流动性，也不代表控制权价格。
      - - MakeMyTrip
        - FY2026 收入 / P-S / 市值
        - $1.04B 收入；5.29x P/S；$5.52B 市值
        - 从地域和公开上市熟悉度看，这是最接近的印度旅游平台参照。
        - 资产模式不同，住宿控制敞口更低。
      - - Wyndham Hotels & Resorts
        - 2025 收入 / P-S / 市值
        - $1.43B 收入；4.35x P/S；$6.25B 市值
        - 接近 OYO 营销市值区间的轻资产酒店特许经营可比公司。
        - 成熟美国特许经营商，披露更干净。
      - - Choice Hotels
        - 2025 收入 / P-S / 市值
        - $1.60B 收入；4.99x P/S；$4.97B 市值
        - 另一家经济型酒店和特许经营相关可比公司，接近 OYO 营销区间。
        - 比 OYO 更成熟，波动也更小。
      - - Airbnb
        - 2025 收入 / P-S / 市值
        - $12.24B 收入；6.91x P/S；$87.42B 市值
        - 高溢价旅游平台参照，说明强平台叙事可以拿到怎样的定价。
        - 规模大得多，公开市场历史也更干净。
      - - Booking Holdings
        - 2025 收入 / P-S / 市值
        - $26.92B 收入；5.11x P/S；$141.52B 市值
        - 大型在线旅游参照，框定平台型公开市场倍数。
        - 规模、盈利能力和披露程度都远高于 OYO。
      - - Marriott
        - 2025 收入 / P-S / 市值
        - $26.19B 收入；13.52x P/S；$97.12B 市值
        - 显示高质量品牌住宿资产仍可按溢价倍数交易。
        - 全球高端品牌，不是完全可比的技术平台。
      - - Hilton
        - 2025 收入 / P-S / 市值
        - $12.04B 收入；14.91x P/S；~$75.9B 市值
        - 有用的品牌住宿溢价上限参照。
        - 资产属性、成熟度和公开市场信任度均不同。
    notes: 这组可比公司刻意混合旅游平台和轻资产特许经营商，因为 OYO 现在同时横跨这两种叙事，比早期申报时更明显。
    enumerationScope:
      coverage: partial
      basis: >-
        This comparable set prioritizes decision-useful 2026 public references that bracket OYO's marketed range and
        recent private marks, but it is not exhaustive of all global lodging or travel technology companies.
