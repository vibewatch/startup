            body: >-
              申报文件明确显示，OYO 融资不只是为了加速增长，也是在修复资产负债表。借款仍然重大，计划募资中几乎 ₹4,987.5 crore
              将用于还款或提前还款。全新股发行结构提供了一个有用缓释，但也让否决条件更尖锐：如果 Zostel
              上诉固化为量化股权转让，如果业主争议扩散到更广酒店队列，如果人口贩卖或特许经营控制案件显示重复模式，或如果上市推迟、债务偿还仍未解决，公司风险调整后估值可能迅速重置。公开记录也缺少最能提升信心的非公开证据：当前上诉材料、完整合作伙伴争议登记，以及
              G6 控制文件。在这些材料可得之前，审慎姿态是把 OYO 视为一家规模和披露正在改善、但残余风险仍高的公司。管理层还应证明，如果簿记建档启动延迟或低于预期，债务偿还顺序、诉讼准备金和 G6
              控制整改将如何相互作用。额外文档才能把可管理的风险栈与只是被推迟的风险栈区分开。
