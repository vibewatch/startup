companyProfile:
  summary: >-
    OYO 的母公司 Oravel Stays 现已把 PRISM 用作企业品牌；公司已从聚焦印度的平价酒店聚合商，演进为覆盖 Hotels、Homes 和 Listings
    的全球酒店住宿平台。业务现在把品牌化分销、收入管理、合作伙伴运营软件，以及特许经营或服务费收入流组合在一起，横跨 OYO、Townhouse、Motel 6、Studio 6、Belvilla、DanCenter 和
    Checkmyguest。2026 年 6 月的 UDRHP 显示，较早期 IPO 尝试时，公司国际化程度更高、盈利能力更强，也更接近上市申报要求；但杠杆调整后的经济性、股权结构细节，以及几项承销关键运营指标仍未完全透明。
