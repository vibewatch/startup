        title: 留存、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              OYO 的公开扩张杠杆可见，但留存数学不可见。Co-OYO 给业主提供定价、促销、打款和住客体验管理的反复使用工具，说明公司预期业主注册后会继续互动。OYO for Business
              指向企业渠道，品牌组合展示出覆盖平价短住、商务、度假屋、汽车旅馆和长住场景的多元界面。这些都是正面因素。问题是，当前公开来源没有披露
              NRR、GRR、重复预订率、头部客户集中度，或网络经济性有多少落在任何单一品牌或地理区域。在这个真空里，集中度风险从少数大
              标杆客户转移到了业主关系的长尾。若业主信任因付款争议、保底争议或预订完整性问题恶化，供给基础可能快速碎片化。OYO 可能仍有有意义的扩张循环；只是它没有披露足够的当前队列数据，证明这些循环有多耐久。
