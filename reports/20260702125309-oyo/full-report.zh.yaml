      - number: '2.2'
        title: 规模测算视角与增长展望
        blocks:
          - type: paragraph
            body: >-
              公开市场证据支持一个庞大且仍在增长的背景，但也说明投资人不该偷懒地讲「旅行很大」这个故事。广义印度酒店住宿市场预计 2026 年达到 USD 27.96 billion；更窄的印度在线住宿市场预计为 USD
              9.85 billion。这些数字显著小于印度整体旅行经济，也远小于 WTTC 和 IBEF 强调的宏观游客消费数字。酒店运营数据同样重要：Hotelivate 报告 2024/25 年入住率为
              68%，Horwath 的 2025 年快照显示入住率为 64%、ADR 为 ₹8,624、RevPAR 为 ₹5,522；即便具体数据集不同，运营动能仍为正。投资胃口也支撑增长故事。The Economic
              Times 引用的 JLL 数据称，印度酒店交易市场在强劲的 2025 年和 2026 年一季度成交量之后，2026 年可能接近 USD 1 billion。正确解读是，OYO 的 TAM
              既不是整个旅行行业，甚至也不是整个酒店住宿行业。更相关的视角，是标准化高性价比住宿、数字预订和业主联盟经济性发生重叠的那一块。
