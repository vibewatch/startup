      - number: '8.3'
        title: 上市可比公司以及 OYO 可能的位置
        blocks:
          - type: paragraph
            body: >-
              最有参考价值的公开估值约束来自两类公司：旅行平台和轻资产酒店特许经营商。Booking 和 Airbnb 说明，高端旅行平台仍能撑住有意义的销售额倍数，但前提是规模极大、披露也干净得多。
              Wyndham、Choice 和 MakeMyTrip 的市值区间更接近 OYO，销售额倍数集中在中个位数。 Marriott 和 Hilton
              证明，品牌住宿可以拿到更高的公开市场倍数，但它们是全球高端特许经营体系， 公共信任深，也不存在可比的披露缺口。因此 OYO 处在一个尴尬但可理解的位置。若投资人把它看作
              一家逐步成熟、数字改善的旅行与特许经营混合体，中个位数十亿美元估值站得住。若投资人愿意立刻 给足高端叙事，$7 billion 到 $8 billion 的目标也可能成立。问题在于，今天的公开证据更能支撑
              方向判断，证明质量还不够。
