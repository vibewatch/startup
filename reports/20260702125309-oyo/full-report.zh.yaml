    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立与运营范围
        blocks:
          - type: paragraph
            body: >-
              OYO 自有材料仍是梳理核心身份故事最干净的锚点。官方关于页面把第一家 OYO 放在 2013 年的 Gurugram South City 1，并把公司直接连接到创始人 Ritesh Agarwal。2026
              年 UDRHP 又补上了消费者叙事之外的承销视角：文件把 PRISM 描述为全栈酒店住宿技术运营商，而不只是平价酒店品牌。申报文件称，公司经营 Hotels、Homes 和 Listings 三条垂直线，品牌覆盖
              OYO、Sunday、Townhouse、Palette、Motel 6、Studio 6、Belvilla、DanCenter 和
              Checkmyguest，并披露了宽得多的多国版图。结果是，公司身份已经明显从印度中心的品牌住宿，迁移到一个投资组合模型：围绕软件、需求获取、收入管理和品牌服务，在自有消费者渠道与合作伙伴门店之间运转。
