  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 印度本土直接同行与相邻连锁
        blocks:
          - type: paragraph
            body: >-
              最清晰的直接同行是 Treebo 和 FabHotels，因为它们和 OYO 争夺同三件事：标准化高性价比库存、业主获取，以及折扣驱动的直接需求。Treebo 的官方页面强调最低价、服务可靠性和 Treebo
              Club 积分；关于页面称品牌已覆盖 120+ 个城市。FabHotels 的价值工程主张更直白：80+ 个城市、1,500+ 家酒店、500,000+
              名已验证住客、面向不同价位的子品牌、特许经营招募和企业合作。这些不是副业，而是直接攻击 OYO 所用的平价旅行和业主转化切口。Lemon Tree
              更偏相邻而非直接竞争，但仍然相关，因为它展示了印度品牌化供给早已越过高端酒店。其自身历史称，潜在的中端和经济型需求就是机会。这对 OYO 很重要，因为真正的业主决策并非简单的「OYO
              还是独立经营」。在很多市场里，业主是在 OYO 与另一个承诺信任、更好 ADR 管理或更正规业主支持的品牌化系统之间选择。
