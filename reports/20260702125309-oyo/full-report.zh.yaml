  - id: TV005
    title: 论点破坏与终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 降债不及预期
        - 用于偿还借款的 IPO 募资显著减少，或再融资压力持续存在
        - 资产负债表修复论点会立即变弱。
        - 让估值立场更负面，并扩大下行区间。
      - - 建簿价格低于预期
        - 公开价格区间或机构反馈明显低于市场传闻的 $7-8B 区间
        - 头条要价在上市前就失去可信度。
        - 把市场出清区间作为新锚，而不是营销头条。
      - - 诉讼或特许经营噪音恶化
        - 出现与 Zostel、合作伙伴争议或 G6 有关的新增重大法律披露
        - 公开市场投资者正被要求买入增长时，风险折价扩大。
        - 降低信心，并把价格推近悲观情境。
      - - 利润质量令人失望
        - 分部利润率或 G6 协同数据无法支撑近期盈利轨迹
        - 估值论点会从持久重估变成短期反弹故事。
        - 等到更好证据或更低价格出现前暂缓。
      - - 条款对投资者不友好
        - 优先权、附函或稀释经济性显著压低普通股等价上行
        - 头条估值不再代表可投资价值。
        - 不按头条价格参与。
    notes: 这些触发项写成可投资的纪律检查点，而不是宽泛业务风险。
    claimRefs:
