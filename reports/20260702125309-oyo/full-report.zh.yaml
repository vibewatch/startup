      - number: '4.2'
        title: 收入组合与变现架构
        blocks:
          - type: paragraph
            body: >-
              UDRHP 对商业模型形态异常有用，尽管已实现定价仍不透明。文件显示 PRISM 通过 Hotels、Homes 和 Listings
              变现，并另有营销、数据与分析、绩效型房源推广、婚礼及活动、联合办公租金、餐饮和订阅收入。申报文件在 G6 上尤其有帮助：它称佣金和特许权使用费收入包括向 G6 酒店业主收取的 Motel 6 和 Studio 6
              品牌使用费及相关营销服务费。这意味着北美收购不只是规模动作，也带来了一条比经典印度平价酒店叙事更接近特许经营的收费流。地域也发生了剧烈迁移。多家 2026 年来源称，现在超过 84%
              的收入来自印度以外，美国和欧洲贡献最大份额。Moneycontrol 更进一步称印度收入占比已低于 12%。这在财务上很关键，因为承销应聚焦一组跨境收入机制，而不是单一印度酒店模型。
