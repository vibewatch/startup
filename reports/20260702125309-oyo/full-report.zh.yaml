      - number: '5.5'
        title: 信任、可靠性与产品风险
        blocks:
          - type: paragraph
            body: >-
              OYO 的公开信任页面好坏参半。正面看，消费者应用宣传传输加密和删除请求，Townhouse 营销 24x7 安保和消防安全，OYO Link 声称 99%+
              可用时间。负面看，第三方评价平台持续收敛到预订完整性和退款问题：SmartCustomer 和 Trustpilot 对 OYO 评分很差，JustUseApp 和 Play
              评价反复出现多次付款、到店加收费用，以及支持渠道无法快速解决问题的投诉。HospitalityNews 也把近期裁员和反弹描述为运营模型压力。实际结论是，OYO
              有一套可见的住客需求、供给上线和物业运营栈，但公开可靠性证据远薄于公开功能证据。若公司能提供私下可用时间报告和服务恢复指标，这种不平衡可以承受；如果没有，功能集看起来强于执行证据。
