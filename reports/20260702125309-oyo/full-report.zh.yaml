  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 未决诉讼、合作方信任、跨境特许经营暴露与 IPO 路径交汇的地方，残余风险最高。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 残余严重度
      rows:
        - label: Zostel 上诉下行风险
          values:
            - label: 中
              tone: warning
              detail: OYO 赢得一项关键裁决，但招股书仍提示经济损失风险。
            - label: 高
              tone: negative
              detail: 股权转让或现金等价补偿，可能直接打击估值和信心。
            - label: 中
              tone: warning
              detail: 公开披露较充分，但上诉细节仍有限。
            - label: 高
              tone: negative
              detail: 这是最清晰的法律层面、足以击穿投资论点的触发点。
        - label: CCI / 反垄断悬而未决
          values:
            - label: 中
              tone: warning
              detail: 裁定已公开，但上诉和商业后果仍重要。
            - label: 高
              tone: negative
              detail: 竞争救济措施可能限制关键 OTA 行为。
            - label: 中
              tone: warning
              detail: 案件已披露且年代较久，已有部分缓释。
            - label: 中高
              tone: warning
              detail: 残余风险低于 Zostel，但仍影响 IPO。
        - label: 酒店业主对账与申报争议
          values:
            - label: 中高
              tone: negative
              detail: FIR 和 GST 通知仍在推进，更广泛模式指控仍未消散。
            - label: 中高
              tone: warning
              detail: 若类似模式在更多案例中复现，合作方流失和税务审查会伤到供给质量。
            - label: 中低
              tone: warning
              detail: 公开可见的缓释，多是诉讼回应，而不是系统性证据。
            - label: 高
              tone: negative
              detail: 在争议范围核实前，残余风险仍高。
        - label: Motel 6 / G6 人口贩运与特许经营风险
          values:
            - label: 中
              tone: warning
              detail: 案件仍在审理，但事实模式各不相同。
            - label: 高
              tone: negative
              detail: 不利事实模式会放大品牌和法律损害。
            - label: 中
              tone: warning
              detail: 特许人有抗辩理由，但控制权披露有限。
            - label: 高
              tone: negative
              detail: G6 纳入 OYO 后，风险权重更高。
        - label: 杠杆与降杠杆执行
          values:
            - label: 中
              tone: warning
              detail: 借款已披露，修复高度依赖 IPO 执行。
            - label: 中高
              tone: warning
              detail: 若未按计划偿债，会削弱资产负债表重置叙事。
            - label: 中
              tone: neutral
              detail: 新股发行结构是可见缓释。
            - label: 中高
              tone: warning
              detail: 现金真正到账前，残余严重度仍偏高。
