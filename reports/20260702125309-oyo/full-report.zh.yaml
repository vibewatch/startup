      - number: '4.3'
        title: 单位经济性与目前最好的 GTM 效率代理指标
        blocks:
          - type: paragraph
            body: >-
              OYO 没有披露很多私募市场投资人想看的干净 SaaS 式单位经济性，因此本章只能依赖代理指标。最好的公开代理，是管理层在印度对公司服务型酒店的战略强调。Business Standard 和 Hotelier
              India 都称，OYO 希望该队列到 FY26 从约 1,300 家物业增至 1,800 家，并从预订收入的 22% 提高到 44%。这说明管理层相信，更紧的运营控制和更高端定位会比纯
              市场平台库存带来更好的收入质量。UDRHP
              的收入附注也强化了这一解读：房间销售之上还有多层变现，包括佣金、特许权使用费、房源费、营销服务、订阅和附加品类。问题是，公开变现结构不等于公开单位经济性。我们仍看不到各垂直线毛利率、物业级贡献利润率、获客成本、回本周期或留存经济性。公司服务型
              扩张目标方向上积极，但没有内部队列数据时，它只是战略主张，不是已实现经济性更优的证据。
