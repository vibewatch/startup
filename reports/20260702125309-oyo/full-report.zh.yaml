  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              OYO 的客户基础最好理解为一个双边网络。需求侧，它服务平价短住旅客、商务旅客、情侣和本地休闲客群，通过 Motel 6 和 Studio 6 服务美国汽车旅馆与长住客群，并通过 Belvilla
              服务度假屋用户。供给侧，关键客户是加入网络的酒店和民宿业主，他们此前常常缺少数字分销经验。OYO 根页面仍在营销 35+ 个国家的 174,000+ 家酒店和民宿，以及 OYO for Business 上的
              5,000 家企业客户。公开品牌页面也强化了客群多样性：Townhouse 瞄准千禧一代和适合工作的住宿，SilverKey 房源偏长住设施组合，Collection O 显示高频休闲需求，Belvilla
              把版图延伸到欧洲度假租赁。这种宽度有战略价值，但没有披露哪些分层真正驱动收入或重复使用。
