              重回董事会；这意味着在公司再次尝试 IPO 前，投资人姿态更主动。UDRHP 也比官网更清楚地说明了发起人控制权：Ritesh Agarwal、RA Hospitality Holdings (Cayman) 和
              SVF India Holdings (Cayman) 被列为发起人。由此，SoftBank
              不只是历史投资人，也进入了正式发起人架构。仍然缺失的是精确的本轮后持股拆分、股东权利包、委员会结构，以及发起人质押如何影响治理韧性的公开解释。
