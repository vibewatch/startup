      - number: '2.4'
        title: 增长驱动、渠道依赖与约束
        blocks:
          - type: paragraph
            body: >-
              最明显的增长驱动来自国内收入扩张、连通性改善、移动预订，以及酒店供给持续正规化。Mordor 强调中等收入旅行增加、航空和公路走廊改善，以及智能手机和 UPI 降低结账摩擦的作用。IBEF
              指向旅游基础设施项目和更高游客消费。但渠道故事和需求故事一样重要。Booking 的商户与代理结构显示，第三方渠道如何从住宿流量中变现；Mordor 也明确指出，运营商现在需要在自有渠道和 OTA
              发现之间保持平衡以守住利润率。这对 OYO 很关键，因为借中介快速增长，仍可能让公司暴露在分销权力之下。信任和监管又叠加了一层。Airbnb
              的标准和申报披露显示，支付、隐私、保险、AI、竞争和消费者保护规则，越来越多地塑造 市场平台经济性。结果是，市场确有上行空间，但可投资层比标题暗示的更窄。真正的门槛问题是自有渠道与 OTA
              的组合、业主回本周期，以及 OYO 公开的大版图里，有多少是真正可变现的标准化住宿，而不是房屋和物业的宽口径计数。
