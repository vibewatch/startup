      - number: '1.4'
        title: 负面历史与承销保留事项
        blocks:
          - type: paragraph
            body: >-
              章节层面的主要负面事项仍是 Zostel。公开法律和商业报道描述了一场围绕 2015 年 ZO Rooms 流产交易、持续十年的争议；SCC Online 对 Delhi High Court
              裁决的摘要显示，OYO 在 2025 年取得了有意义的法院逆转，仲裁裁决被撤销。这对公司有利，但没有完全移除承销风险，因为 2026 年 UDRHP
              仍把该事项保留为存续风险因素，并明确警告：若程序最终走向不利，公司可能最多稀释 7% 股权，或支付等值现金。另一项保留事项是资本市场纪律。Business Standard 报道称，SoftBank 曾反对更早的
              IPO 时点和估值预期；UDRHP 又披露了发起人
              层面的股份质押。合在一起，这些事实说明公司运营上强于早期失败上市尝试时，但治理、诉讼和融资结构尽调仍然很关键。后续章节也应沿用申报文件中的风险框架，而不是假设法院胜诉已经彻底解决问题。
