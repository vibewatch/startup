              Jaipur GST 和虚假预订争议很重要，即便 OYO 最终胜诉也一样，因为它攻击了商业模型里敏感的一环：平台与提供供给的酒店业主之间的信任。多篇报道称，Samskara Resort 指控 OYO
              报告的预订把营业额抬高到远超酒店自有记录，并触发一张大额 GST 通知。Rajasthan High Court
              的暂缓令降低了即时强制压力，但没有回答更深的尽调问题：该案是孤例、文档问题，还是更广泛控制弱点的证据。低声誉报道现在称，Rajasthan 其他酒店也收到类似通知，且 OYO 试图反击与 FIR
              相关的媒体报道。这些还不足以被视为已确认的系统性不当行为，但足以让残余合作伙伴风险保持高位，直到管理层拿出对账、争议数量和业主留存结果。
