  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 披露业绩以及为什么指标对齐很重要
        blocks:
          - type: paragraph
            body: >-
              做承销时，2026 年 UDRHP 应被视为核心财务数据的标准公开来源，而不是创始人的内部大会口径。申报文件披露 FY25 运营收入 ₹6,252.8 crore、重述利润 ₹244.8 crore、EBITDA
              ₹953.4 crore；此前 FY23 要弱得多，仍处于亏损。文件还显示，FY26 前九个月收入已超过 FY25，利润和 EBITDA
              也明显更高。这足以支撑真实的扭转叙事，但不等于公开数字已经完全干净。管理层未经审计的 FY25
              内部大会数字更高，而这个差距重要，因为投资人需要知道眼前的是调整后管理口径、年报处理，还是申报质量的重述数据。正确结论不是某一组数据必然为假，而是公司在任何收入质量或利润率论证能按表面值被相信之前，仍需要仔细做指标定义尽调。
