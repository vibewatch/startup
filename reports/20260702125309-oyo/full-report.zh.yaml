  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 股权结构和优先权
        - 清算顺位、参与权、附函，以及创始人 / 发起人经济性。
        - 头条价值可能与实际可投资经济性大幅背离。
        - 由律师主导审查融资文件和董事会材料。
      - - 分部盈利能力和 G6 整合
        - 按地域和品牌拆分的业务单元利润率桥接，以及协同兑现情况。
        - 没有这些细节，公开盈利改善未必可持续。
        - 财务尽调加 G6 并购后运营审查。
      - - 债务和再融资细节
        - 契约包、债务到期梯队，以及拟议提前还款的影响。
        - 降债是募集资金用途叙事的核心。
        - 财资尽调和贷款方文件。
      - - 诉讼与监管准备金立场
        - 已披露案件的当前准备金处理和概率估计。
        - 法律压力可能同时改变定价和时点。
        - 外部律师备忘录和审计委员会材料。
      - - 市场出清证据
        - 价格区间、锚定订单簿和真实需求反馈。
        - 在订单簿给出信号前，营销估值仍只是目标。
        - 到 RHP / 建簿阶段重跑本章。
    notes: 若这些项目仍不透明，理性立场应是等待，而不是被头条情绪带动。
    claimRefs:
