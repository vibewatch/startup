      - number: '8.2'
        title: 为什么估值反弹有可能，但不会自动发生
        blocks:
          - type: paragraph
            body: >-
              OYO 已不再是早期 IPO 尝试失败时投资人看到的同一个故事。申报文件现在显示，公司收入大多来自国际市场，声称自有渠道强劲，并通过 G6 和 Motel 6
              扩大了版图。这是多头基础。同时，公开估值历史很残酷，也无法忽视。TechCrunch 记录了 2024 年约 $2.5 billion 的降估值融资轮，Sacra 描述了后来接近 $3.9 billion
              的二级市场估值标记，StartUpTalky 则强调这些估值标记 与新 $7 billion 至 $8 billion 雄心之间的差距。因此，投资人不需要判断 OYO
              是否改善——他们需要判断今天应资本化多少改善。这就是本章把结论保持在跟踪的原因：反弹有可能，但从 2024 到 2026 的价格桥仍是存续承销问题，不是既定事实。
