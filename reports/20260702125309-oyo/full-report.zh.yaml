      - number: '4.4'
        title: 资本充足性、杠杆与资产负债表压力
        blocks:
          - type: paragraph
            body: >-
              申报文件清楚显示，PRISM 发行新股并不只是为了可选性。FY25 总借款仍高于 ₹7,100 crore，FY26 前九个月已高于 ₹7,400 crore，因此约 ₹4,987.5 crore 的 IPO
              募资将用于还款或提前还款。仅这一点就说明，这笔交易有真实的去杠杆功能。公司确实显示出更好的经营现金生成，并在 9M FY26 报告更强的净资产，但这不能消除资本密集度担忧。G6 收购耗资 $525
              million，Blackstone 称支撑该资产的是 $1.7 billion 总房费收入网络，管理层仍想扩张公司服务型酒店、整合国际品牌，并保留进一步增长的可选性。最高 ₹1,330 crore 的 IPO
              前配售选项也很说明问题：它给公司多一个杠杆，以在公开交易定价前优化时点和资产负债表弹性。公开看来，PRISM 已有改善，但仍依赖融资，而非已经自我造血到足以消除资产负债表风险。
