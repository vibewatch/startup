  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的法律包袱
        blocks:
          - type: paragraph
            body: >-
              OYO 的风险画像现在由罕见组合塑造：印度遗留诉讼、活跃的竞争法历史，以及新继承的美国品牌责任。最干净的一线风险是 Zostel 事项，因为公司自己的申报文件仍警告，若结果不利，可能被迫转让或发行最多 7%
              股权，或支付现金等价物。对一家试图重返公开市场的公司来说，这类下行情形表述异常具体。第二个法律包袱，是与 MakeMyTrip-Go、FabHotels 和 Treebo 相关的 CCI 案件；其中 OYO
              被罚款，更广泛的 OTA 合约模型被认定存在反竞争限制。两件事都不证明公司立即陷入困境，但都很重要，因为它们可能在 OYO 正要求买方为资产负债表修复融资的时点，影响投资人信心、管理层带宽和公开市场叙事。
