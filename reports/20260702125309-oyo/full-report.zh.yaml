      - number: '3.3'
        title: 全球连锁业主系统与分销权力
        blocks:
          - type: paragraph
            body: >-
              最大的战略误判，是因为 Marriott、Hilton 或 Wyndham「太高端」或「太全球化」就把它们视为无关。它们的威胁不在于每个 OYO 住客都会转投
              Hilton；威胁在于，业主、贷款人和专业运营商决定如何让供给接入体系时，往往偏好正规的特许经营、开发和忠诚度系统。Marriott 的申报文件把特许经营、授权和管理物业列为核心系统结构；Hilton
              把自己描述为业主机会引擎；Wyndham 则明确瞄准转换和新开发，并在许多市场主导经济型至中高端客房。这些系统制造的转换成本，不容易靠折扣驱动的数字获客匹配。忠诚度计划、业主操作手册
              和开发管线，可以在旅客价格带重叠的市场里，把标准化库存挡在 OYO 之外。换句话说，OYO 的竞争集合包括一些在消费者应用屏幕上看起来并不相似、却在经济上决定性的业主侧展开竞争的连锁。
