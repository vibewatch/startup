      - number: '3.2'
        title: OTA、替代住宿与行程打包替代品
        blocks:
          - type: paragraph
            body: >-
              OYO 还面对一类结构上完全不同的对手：需求聚合器。MakeMyTrip 和 Goibibo 横跨机票、度假和酒店搜索捕获旅客；Booking.com 更进一步，把酒店、民宿、交通和景点合在一起；Airbnb
              则把替代住宿与体验、信任工具融合。这些产品重要，因为它们在旅客决定预订哪个酒店品牌之前就拦截了需求。Booking 的 10-K 显示供给宽度巨大，收入模型横跨商户、代理
              和广告流，也就是说，它比品牌运营商有更多方式从酒店需求中变现。Airbnb 自己的申报文件称酒店连锁是直接竞争对手，而其体验产品让它不止是房间市场平台。Expedia 和 Vrbo
              从另一个方向强化了同一点：度假租赁和行程打包仍是酒店优先品牌的耐久替代品。因此，OYO 不只需要酒店比 Treebo 或 FabHotels 更好；还需要在 OYO 进入候选名单之前，阻止旅客先在市场平台
              层面解决整趟行程。
