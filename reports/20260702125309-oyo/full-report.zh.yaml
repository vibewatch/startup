      - number: '8.4'
        title: 尽调事项与投资论点破裂触发点
        blocks:
          - type: paragraph
            body: >-
              最终建议只有在一小串缺失事实浮出水面后才会调整。第一，投资人需要看清资本结构的真实经济性： 优先权、老股转让，以及任何扭曲表面价格的条款。第二，需要更扎实的分部盈利证据，并判断剔除 G6
              整合和融资影响后，近期盈利改善还能留下多少。第三，需要最终簿记给出的真实市场出清证据。缺失 事实很关键，因为核心空头触发点很清楚：市场承认 OYO 改善了，但改善幅度不足以支撑对外推介区间。
              较低发行价不会证伪业务，只会重置入场点。因此，正确的决策纪律是保持跟进，预先划定价格上限， 不让 IPO 叙事跑在证据前面。同样的纪律也适用于时点：如果公开价格区间是在更多法律、债务或整合
              细节披露后才出现，投资人应基于更新证据重估，而不是锚定过时的愿景式标题。
