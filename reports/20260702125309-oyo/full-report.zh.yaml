        title: 负面调整与最大的尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              最强的公开财务警示，是近期盈利并非纯经营性。Inc42 报道称，FY25 净利润依赖一笔大额递延所得税收益；若没有该收益，公司会出现税前亏损。UDRHP
              本身也强化了这一点：如果收入与费用不能保持平衡，未来亏损可能复现。投资人还应把诉讼和 发起人融资结构视为财务风险，而不只是治理脚注：申报文件把 Zostel
              事项保留为存续稀释或现金风险因素，并单独披露了对一个发起人载体股本的质押。未解决清单仍然很长。公开来源仍未给出现有现金余额、债务到期梯队、利息成本细节、垂直线毛利率、物业级
              抽佣率或客户集中度。因此，标题层面的扭转足够真实，能让 IPO 讨论继续；但透明度还不足以在没有正式尽调资料室以及管理层逐项解释定义、分部经济性和负债的情况下完成承销。
