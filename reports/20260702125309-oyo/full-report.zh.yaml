      - number: '2.3'
        title: 买方、付款方与区域组合
        blocks:
          - type: paragraph
            body: >-
              使用者不总是买方，买方也不总是付款方。在休闲需求里，旅客通常三者合一。在企业差旅里，员工是使用者，但差旅管理员或财务团队往往控制工作流、报销政策和 GST 合规账单要求。供给侧的经济买方，则是决定品牌或 OTA
              关系能否把入住率、ADR 实现和营运资本改善到足以抵消标准化成本的酒店业主或本地运营商。印度地理结构让这一区分更重要。政府和行业来源显示，国内旅游仍是最深的需求底座；Goibibo
              围绕商务、休闲和宗教旅行的定位也说明，多种出行任务同时存在。Hotelivate 和 Horwath 都指向传统一线城市之外的增长机会：品牌化供给进入 177 个新市场，tier 2、tier 3
              和宗教目的地可能随着时间吸收更多正规库存。因此，OYO 的承销问题不只是需求是否增长；关键是 OYO 能否为每一条买方旅程匹配合适的预订、信任和业主经济性主张。
