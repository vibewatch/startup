  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资
      - 目标客群
      - 差异化
      - 局限性
    rows:
      - - OYO
        - 直接同业 / 轻资产平价住宿
        - 35+ 个国家拥有 174,000+ 家酒店和民宿；获得 5,000 家企业信任
        - 预算型休闲旅客、中小企业差旅、酒店业主
        - 规模、标准化平价定位、B2B 差旅信号、业主入驻
        - 公开披露未显示直营与 OTA 占比或业主经济性
      - - Treebo
        - 直接同业 / 品牌化经济型连锁
        - 覆盖 120+ 个城市；获得 Accor 和 InterGlobe 支持
        - 印度预算型旅客和物业业主
        - 直订忠诚度、服务标准化、机构背书
        - 仍有盈利压力，覆盖规模小于 OYO
      - - FabHotels
        - 直接同业 / 品牌化经济型连锁
        - 80+ 个城市有 1,500+ 家酒店；500,000+ 名已验证住客；有外部融资
        - 预算型休闲和企业旅客；加盟业主
        - 折扣驱动定位、加盟招募、子品牌梯队
        - 全球触达弱于 OTA 或全球连锁，忠诚度护城河也更弱
      - - Lemon Tree
        - 相邻在位者 / 印度品牌连锁
        - 印度最大酒店连锁之一；覆盖高端到经济型
        - 跨细分市场寻求品牌信任的旅客和业主
        - 更宽的品牌梯队和正规酒店连锁基础设施
        - 不如 OYO 聚焦超低价位数字化获客
      - - MakeMyTrip / Goibibo
        - OTA 在位者
        - 全球数十万家酒店，加上多品牌旅行产品栈
        - 商务、休闲和宗教旅行场景下的酒店搜索用户
        - 打包品类宽、需求捕获强、旅行意图流量高
        - 不直接控制酒店运营或标准化供给
      - - Booking Holdings 与 Booking.com
        - 全球 OTA 在位者
        - 5 个核心品牌覆盖 220+ 个国家；Booking.com 覆盖 4.4M 处物业
        - 寻求一站式行程规划的全球和印度旅客
        - 供给极广，多收入流变现
        - 业主侧运营支持弱于酒店连锁特许经营方
      - - Airbnb
        - 另类住宿与体验平台
        - 上市公司规模，覆盖民宿以及体验 / 服务
        - 休闲、团体、灵活出行和房东主导的旅行需求
        - 替代型房源，加本地体验留存
        - 不提供 OYO 同类标准化酒店运营承诺
      - - Marriott / Hilton / Wyndham
        - 全球品牌连锁在位者
        - 通过特许经营 / 开发体系管理数百万或数十万间客房
        - 寻求品牌信任、忠诚度和体系经济性的业主与旅客
        - 业主工具、忠诚度和特许经营基础设施深
        - 与印度经济型酒店的重叠只是部分，而非完全对位
    notes: 行中混合了直接同业、OTA 在位者、另类住宿平台和全球酒店连锁在位者，因为买家和业主可以通过几条结构差异很大的路径完成同一件事。
