  - id: TV003
    title: 乐观 / 基准 / 悲观情境表
    columns:
      - 情境
      - 概率信号
      - 核心假设
      - 估值逻辑
      - 隐含股权价值
    rows:
      - - 乐观
        - 建簿需求把全球结构、降债和 G6 可选性视为证据，说明 OYO 比 2024 年暗示的状态强得多。
        - FY26 动能守住，诉讼受控，债务大幅下降，投资者给出高于 Wyndham / Choice 等参照的溢价。
        - 如果市场接受溢价定位，估值接近高端要价，并可略高于该水平。
        - $7.0B-$8.5B
      - - 基准
        - 投资者认可进展，但仍要求对杠杆历史、法律压力和不完整的单元经济性打折。
        - 债务偿还落地，收入保持强劲，但价格支撑更接近中个位数十亿美元参照。
        - 从低谷重估，但低于营销区间高端。
        - $5.0B-$6.5B
      - - 悲观
        - 市场重新锚定 2024 年私募估值标记、法律噪音，或对盈利质量和 G6 整合的怀疑。
        - 债务缓释低于预期，公开市场投资者拒绝给溢价，或新诉讼削弱信心。
        - 价值回落到私募估值标记，以及规模更接近的公开参照附近。
        - $2.5B-$4.0B
      - - 决策锚
        - 当前公开头条围绕市场传闻要价，而不是已验证的建簿出清价格。
        - 在价格区间公开前，把营销区间视为目标，而不是事实。
        - 市场确认前，不要假设高端价格已经挣到。
        - $7.0B-$8.0B 目标区间
    notes: 这些区间是价格纪律情境，锚定公开证据、私募估值历史和当前可比公司位置，而不是完整 DCF。
