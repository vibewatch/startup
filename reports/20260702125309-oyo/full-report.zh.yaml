  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议以及实际披露了什么
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，今天对 OYO 的建议是跟踪观察，而不是立即热情买入。改善故事真实存在：Prism 已提交更新版招股书，发行结构为全新股且没有现有股东出售，公司披露 FY26 前九个月收入和利润相对 FY25
              强劲增长，本次建簿也被包装为更干净的第三次尝试，而不是困境中的最后一搏。但营销中的估值仍是雄心，不是已清算价格。近 ₹4,987.5 crore
              募资指定用于偿债，这是建设性的；但它也揭示出，这次发行解决资产负债表问题的程度不亚于为增长融资。这不推翻故事，只意味着估值应按纪律性条件判断。在公开价格区间和需求可见之前，OYO
              值得密切跟踪，但还没有到按当前定价追逐的地步。
