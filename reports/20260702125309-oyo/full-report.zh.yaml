      - number: '1.3'
        title: 里程碑、扩张与重启 IPO 路径
        blocks:
          - type: paragraph
            body: >-
              公开时间线显示，公司即便在资本市场窗口反复变化时，也持续扩张地理范围和资产边界。OYO 官方历史记录，2016 年公司从印度进入马来西亚，2019 年进入美国、欧洲和中东，并通过收购 @Leisure
              切入度假屋。下一次结构性跃迁来自 G6 Hospitality 交易。Blackstone 宣布以 $525 million 全现金出售，约 1,500 家 Motel 6 和 Studio 6
              门店进入组合；后续报道又显示，OYO 以这块基础继续增加美国物业。在印度，公司同时把公司服务型模式推向 1,800 家酒店和 300 多个城市。融资侧的时间线同样关键：PRISM 从 2021 年失败申报，走到
              2025 年 12 月保密递交、2026 年 6 月公开 UDRHP，并把估值雄心重新放在 $7 billion 至 $8 billion 区间，而非 2021 年高得多的目标。
