    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 公开证据支持一个较宽区间；除非降杠杆和经营质量都守住，否则中枢低于完整推介要价。
    data:
      items:
        - label: 悲观情景
          low: 2.5
          mid: 3.2
          high: 4
          displayValue: $2.5B-$4.0B
          detail: 重新锚定在 2024-2025 年私募估值和法律折价附近。
          tone: negative
        - label: 基准情景
          low: 5
          mid: 5.8
          high: 6.5
          displayValue: $5.0B-$6.5B
          detail: 承认真实进展，但仍对推介估值上沿打折。
          tone: warning
        - label: 乐观情景
          low: 7
          mid: 7.7
          high: 8.5
          displayValue: $7.0B-$8.5B
          detail: 需要账簿支持、偿债落地和更干净的证据质量。
          tone: positive
    approximationNotes: 区间是根据公开估值、可比公司位置和已披露经营进展得出的情景锚点，而不是 DCF。
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
      - CV042
      - CV043
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: OYO 在战略相关性和动能改善上得分较好，但价格支撑和证据充分性只属中等。
    data:
      items:
        - label: 动能改善
          score: 7
          detail: 申报数据和利润趋势较低谷年份明显改善。
          tone: positive
        - label: 战略宽度
          score: 7
          detail: 国际收入结构和 G6 让故事超出印度经济型酒店。
          tone: positive
        - label: 资产负债表清晰度
          score: 5
          detail: 募资用途明确，但杠杆仍需 IPO 解决。
          tone: warning
        - label: 公开估值支撑
          score: 4
          detail: 要价仍高于公开估值能清楚证明的水平。
          tone: negative
        - label: 证据充分性
          score: 4
          detail: 股权结构、分部利润率和最终簿记定价仍缺失。
          tone: negative
        - label: 下行保护
          score: 4
          detail: 历史显示，市场此前已经大幅重估过 OYO。
          tone: warning
    approximationNotes: 分数是锚定章节证据的 0-10 序数判断，不是管理层 KPI。
    claimRefs:
      - CV003
      - CV005
      - CV013
      - CV017
      - CV036
      - CV038
      - CV045
      - CV046
