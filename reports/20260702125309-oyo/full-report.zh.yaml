  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 论点
      - 正方观点
      - 什么会改变判断
    rows:
      - - IPO 路径重启
        - 仅发行新股结构、强劲的 FY26 前九个月数据，以及更干净的 SEBI 路径表明，这个故事不再只是转型叙事。
        - 如果建簿停滞，或公司虽有这些改善仍需要更深折价，重启信心会减弱。
      - - 全球结构与 G6 规模
        - 相比早期印度单一叙事，业务现在看起来更国际化，也更偏特许经营。
        - 如果 G6 最终主要带来复杂度，而不是现金流质量，战略溢价会收缩。
      - - 估值缺口
        - 公司有可能从 2024 年私募估值标记反弹，因为分母和融资结构都已明显改善。
        - 如果市场不愿从 $2.4-2.5 billion 向要价靠拢，IPO 故事会回到价格纪律。
      - - 公开可比公司纪律
        - 如果动能守住，旅游平台和特许经营同业的中个位数销售倍数参照，可以支撑比下轮降估更好的估值标记。
        - 如果 OYO 按高端酒店链定价，却没有类似可见度，反方观点占优。
      - - 资产负债表修复
        - 如果再融资压力显著下降，用募资降债可以释放股权价值。
        - 如果降债主要是补丁，而不是持久修复，股权上行仍会受限。
    notes: 反方观点主要围绕价格和证据质量，而不是否认 OYO 的运营确有改善。
