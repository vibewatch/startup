    {
      "id": "capital-adequacy-and-balance-sheet-pressure",
      "title": "Capital adequacy, leverage, and balance-sheet pressure",
      "body": "The filing makes it clear that PRISM is not raising fresh equity only for optionality. Total borrowings were still above ₹7,100 crore in FY25 and above ₹7,400 crore by the first nine months of FY26, which is why roughly ₹4,987.5 crore of IPO proceeds are earmarked for repayment or prepayment. That alone tells you the transaction has a genuine deleveraging function. The company does show better operating cash generation and stronger reported net worth by 9M FY26, but that does not remove capital-intensity concerns. The G6 acquisition cost $525 million, Blackstone described a $1.7 billion gross room revenue network underpinning the asset, and management still wants to expand company-serviced hotels, integrate international brands, and preserve optionality for further growth. The pre-IPO placement option up to ₹1,330 crore is also revealing: it gives the company another lever to optimize timing and balance-sheet flexibility before pricing the public deal. Publicly, PRISM looks improved, but still financing-dependent rather than self-funding in a way that would eliminate balance-sheet risk.",
