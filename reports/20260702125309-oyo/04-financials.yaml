  "chapter": {
    "number": 4,
    "title": "Financials",
    "summary": "PRISM’s 2026 UDRHP finally puts filing-grade numbers behind OYO’s turnaround story: FY25 revenue from operations was ₹6,252.8 crore, FY25 restated profit was ₹244.8 crore, and 9M FY26 revenue already exceeded the full prior year. The business model is now a multi-stream, cross-border mix spanning room-night sales, commissions, listing fees, G6 royalty and brand-service revenue, and several adjacencies; but the public record still withholds cash balance, debt maturities, and real unit-economics data. The result is a more credible IPO candidate, not yet a fully underwritable one."
  },
  "sections": [
    {
      "id": "reported-results-and-reconciliation",
      "title": "Reported results and why metric reconciliation matters",
      "body": "For underwriting, the 2026 UDRHP should be treated as the canonical public source for headline financials, not the founder’s internal townhall messaging. The filing reports FY25 revenue from operations of ₹6,252.8 crore, restated profit of ₹244.8 crore, and EBITDA of ₹953.4 crore, following a much weaker FY23 that was still loss-making. It also shows that the first nine months of FY26 had already exceeded FY25 revenue and produced meaningfully higher profit and EBITDA. That is enough to support a real turnaround narrative, but it is not the same thing as saying public numbers are fully clean. Management’s unaudited FY25 townhall figures were higher, and that gap matters because investors need to know whether they are looking at adjusted management reporting, annual-report treatment, or filing-quality restatements. The right conclusion is not that one dataset must be false; it is that the company still requires careful metric-definition diligence before any revenue-quality or margin argument can be trusted at face value.",
