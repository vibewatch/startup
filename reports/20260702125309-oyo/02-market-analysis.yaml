  title: Adoption funnel for organized value lodging
  type: funnel
  layout: wide
  summary: Demand can grow faster than supply, but only a smaller subset clears digital-discovery, trust, and owner-economics hurdles in ways that benefit organized asset-light brands such as OYO.
  data:
    items:
    - label: India travel demand pool
