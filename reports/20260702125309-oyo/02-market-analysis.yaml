callouts:
- calloutType: insight
  title: The relevant OYO market is narrower than the headline travel economy
  body: The broad India hospitality and travel figures are useful context, but the underwriteable market is the subset where standardized budget inventory, OTA-led discovery, owner affiliation, and repeat demand intersect. That is large enough to matter, but much smaller than a generic tourism TAM claim would suggest.
  claimRefs:
  - CM001
  - CM002
  - CM009
  - CM022
- calloutType: risk
  title: Channel power and compliance can compress the value of raw footprint scale
  body: OYO’s published footprint and corporate-travel signals are meaningful, but margin capture still depends on direct-versus-OTA mix, owner retention, and the ability to navigate trust, payments, and consumer-protection rules that increasingly govern online accommodation.
  claimRefs:
  - CM012
  - CM016
  - CM021
  - CM033
  - CM037
