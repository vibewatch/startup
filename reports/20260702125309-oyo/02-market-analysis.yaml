- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Domestic income growth and better road/air connectivity
    - Positive
    - Current to medium term
    - Expands weekend and business travel demand outside major metros
    - Measure OYO city mix versus fastest-growing domestic corridors
  - - Formalization into 177 new branded markets
    - Positive
    - Current to medium term
    - Creates more conversion candidates for asset-light chains and OTAs
    - Check OYO new-supply pipeline by tier 2/3 market
  - - Smartphone, UPI, and AI-personalized booking flows
    - Positive
    - Current
    - Raises conversion and makes mobile-led OTA competition more intense
    - Estimate direct-app retention versus OTA acquisition for OYO
  - - Corporate GST and policy-compliance workflows
    - Positive
    - Current
    - Supports OYO B and similar B2B travel products
    - Quantify corporate share of OYO room nights and repeat rate
  - - Marketplace trust, licensing, insurance, and payment rules
    - Negative
    - Current
    - Raises compliance cost for vacation-rental and experience-adjacent expansion
    - Map OYO compliance overhead versus Airbnb and OTA peers
  - - OTA dependency and merchant/agency economics
    - Negative
    - Current
    - Intermediaries can take margin and control demand discovery
    - Disclose direct versus OTA booking mix and effective take rate
  - - Supply fragmentation in tier 2/3 and religious markets
    - Mixed
    - Current to medium term
    - Creates large owner-acquisition opportunity but complicates quality control
    - Measure standardization cost per converted property
  - - Geopolitical and inbound-travel volatility
    - Negative
    - Current
    - Can slow foreign demand even when domestic travel is resilient
    - Stress-test OYO exposure to inbound-heavy gateway markets
  notes: The table blends demand-side and supply-side forces because OYO’s market is shaped by both traveler conversion and owner economics. Positive drivers do not eliminate margin or compliance pressure.
