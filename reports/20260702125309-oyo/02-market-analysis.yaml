tables:
- id: TM001
  title: Market definition table
  columns:
  - segment/category
  - included spend
  - excluded spend
  - buyer/payer
  - relevance
  rows:
  - - Organized budget and economy hotels
    - Room-night spend at standardized branded budget and economy hotels, including corporates and repeat travelers
    - Luxury resorts, pure vacation villas, and unbranded homestays without standardization
    - Leisure travelers, SMEs, travel admins, and OTA shoppers
    - Core category OYO monetizes through branded, standardized inventory
  - - OTA-led online accommodation distribution
    - Marketplace commissions, payment intermediation, mobile search, bundled transport and attraction discovery
    - Offline walk-ins without digital discovery and purely direct unmanaged owner relationships
    - Travelers pay; platforms and hotel partners share economics
    - Determines customer acquisition cost, pricing power, and margin leakage
  - - Franchised and managed hotel networks
    - Affiliation fees, standards, revenue management, loyalty, owner services, and centralized distribution
    - Owned real-estate economics and pure construction/development profits
    - Hotel owners pay; guests indirectly fund through room demand
    - Defines owner-side competition against Marriott, Hilton, Wyndham, Lemon Tree, and OYO
  - - Vacation rentals and alternative stays
    - Homes, apartments, serviced stays, and experience-led leisure booking linked to Airbnb and OTA inventory
    - Long-term residential leases and purpose-built luxury villas outside travel demand cycles
    - Traveler pays; host or property manager is supplier
    - Acts as a substitute for family or group travel that might otherwise book economy hotels
  - - Hotel operating and corporate travel tools
    - Corporate booking workflows, GST/compliance support, property onboarding, pricing, and distribution tech
    - Standalone ERP, airline-only travel tools, and unrelated back-office software
    - Corporate travel admin or hotel owner is economic buyer
    - Supports the B2B adoption path and supply-side retention economics OYO increasingly markets
  notes: Boundary is defined around accommodation demand and owner-side affiliation economics, not the full travel economy. OTA, franchise, and alternative-stay layers are included because they shape both acquisition and supply retention.
