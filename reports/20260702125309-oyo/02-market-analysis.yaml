      value: 62
      description: Demand that flows through OTA, app, or direct digital journeys.
    - label: Standardized budget/economy shortlist
      value: 35
      description: Users filtering for reliable, low-cost, standardized stays or corporate-compliant options.
    - label: Owner-economics viable inventory
      value: 15
      description: Properties whose conversion economics, quality standards, and channel mix support organized affiliation.
    - label: Durable repeat + corporate demand
      value: 6
      description: Subset that can sustain repeat booking, direct traffic, and owner retention with acceptable margin.
