- id: TM003
  title: Segment / buyer map
  columns:
  - segment
  - buyer
  - user
  - payer/workflow
  - budget owner
  - adoption trigger
  rows:
  - - Budget leisure traveler
    - Traveler or family decision maker
    - Guest staying at economy or value hotel
    - App or OTA booking, often mobile and UPI-enabled
    - Household discretionary travel budget
    - Price transparency, standardized stay promise, convenient location
  - - SME corporate travel
    - Travel admin, founder, finance team
    - Employee on work trip
    - Managed booking workflow with GST invoice and policy compliance
    - Operations or finance manager
    - Need for low-friction billing, compliant invoices, and broad city coverage
  - - Hotel owner / converted property operator
    - Property owner or local operator
    - Owner revenue-management and operations team
    - Affiliation decision across brand, OTA, or independent operation
    - Owner P&L and financing stack
    - Occupancy support, distribution reach, revenue management, faster onboarding
  - - Religious and domestic event traveler
    - Traveler or tour organizer
    - Guest visiting pilgrimage or event destination
    - Mostly short-stay booking, often near event dates
    - Household or group travel budget
    - Connectivity improvements and formalized inventory in tier 2/3 or religious markets
  - - Vacation-rental or group-stay guest
    - Lead traveler for group or family
    - Group accommodation user
    - Marketplace booking that compares homes with hotels
    - Household leisure budget
    - Need for space, flexibility, and bundled experience discovery rather than only low nightly rate
  notes: The same city may host several distinct buyer journeys. OYO’s underwriting-relevant buyers are not only leisure guests; they include hotel owners and corporate travel administrators who control adoption on the supply and demand sides.
