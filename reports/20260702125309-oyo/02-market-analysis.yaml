chapter:
  number: 2
  title: Market Analysis
  summary: OYO sits at the intersection of India’s fast-growing hospitality market, the narrower but still sizable online accommodation layer, and a fragmented owner-affiliation ecosystem shaped by OTA distribution power. The evidence supports real demand growth, but the underwriteable market is smaller than generic travel TAM claims because trust, regulation, and owner economics create a hard filter between broad travel demand and monetizable standardized budget lodging.
sections:
- id: market-boundary
  title: Market boundary and status-quo substitutes
  body: 'OYO should not be framed as participating in one simple “budget hotel” market. The company touches at least five overlapping pools: standardized budget and economy hotels, OTA-led digital accommodation distribution, asset-light hotel affiliation networks, vacation-rental substitution, and supply-side hotel operating workflows. The competitive pressure is therefore multi-directional. A traveler comparing OYO with Treebo or FabHotels is making one decision; a hotel owner choosing between OYO, Lemon Tree affiliation, Wyndham conversion, or independence is making another; and a corporate travel admin choosing between OYO B, Booking.com, or MakeMyTrip is making a third. Booking.com and Airbnb show why that boundary matters. Booking bundles hotels, homes, transport, and attractions inside one marketplace, while Airbnb explicitly names hotel chains as competitors and layers experiences and services onto the same customer relationship. OYO also markets corporate booking and rapid property
    onboarding on its own homepage, which confirms that the market boundary includes both room-demand acquisition and owner-side monetization. The real status quo is not merely an independent hotel room; it is a fragmented stack of offline relationships, OTA funnels, budget chains, and alternative stays.'
  claimRefs:
