- id: drivers-constraints
  title: Growth drivers, channel dependence, and constraints
  body: The most obvious growth drivers are domestic-income expansion, improved connectivity, mobile booking, and continued formalization of hotel supply. Mordor highlights rising middle-income travel, better air and road corridors, and the role of smartphones and UPI in reducing checkout friction. IBEF points to tourism infrastructure programs and higher visitor spending. But the channel story is just as important as the demand story. Booking’s merchant and agency structure shows how third-party channels monetize accommodation flows, and Mordor explicitly notes that operators now need to balance direct channels with OTA discovery to defend margin. That matters for OYO because rapid growth through intermediaries can still leave the company exposed to distribution power. Trust and regulation add another layer. Airbnb’s standards and filing disclosures show that payments, privacy, insurance, AI, competition, and consumer-protection rules increasingly shape marketplace economics. The result
    is a market with real upside but a narrower investable layer than headlines imply. The gating questions are direct-versus-OTA mix, owner payback, and how much of OYO’s large published footprint is truly monetized standardized lodging rather than a broad count of homes and properties.
