  topStrengths:
    - 申报文件背书的扭亏数据已经撑起叙事：FY25 收入 ₹6,252.8 crore、利润 ₹244.8 crore，9M FY26 表现也已经更强。
    - OYO 不再只是印度经济型住宿故事：UDRHP 显示，其在 35+ 个国家拥有 293,554 个经营点位，收入结构也压倒性偏国际化。
    - G6 收购带来规模，也通过 Motel 6 和 Studio 6 增加更接近特许经营的特许权使用费与品牌服务收入流。
    - 平台覆盖 Hotels、Homes 和 Listings，靠合作伙伴软件、直营网订入口和多层变现运转，而不是只有一条 marketplace fee 收入轨。
  topRisks:
    - 市场传出的 $7-8 billion 估值仍显著高于 2024 年私募市场参考价，尚未被公开市场出清价格验证。
    - 借款仍高，多数 IPO 募资用于偿债，杠杆和再融资依赖仍是股权故事核心。
    - 诉讼和监管悬顶——包括 Zostel、合作伙伴纠纷，以及竞争或税务相关问题——即使运营改善后仍有分量。
    - 公开披露仍缺完整 cap-table economics、现金与债务到期明细、分部盈利和经验证当前员工数。
    - 近期盈利真实，但并不完全干净，因为公开负面报道称 FY25 明显受益于递延税项收益。
  unresolvedGaps:
    - 建簿前最终 cap table、优先权和任何 IPO 前配售条款。
    - 现金余额、债务到期阶梯，以及偿债后的利息成本桥。
    - Hotels、Homes、Listings 和 G6 的分部盈利与正常化经济性。
    - 经验证的当前员工数和区域人员结构。
    - 公开簿记开启后的市场出清 IPO 价格区间和真实需求信号。
