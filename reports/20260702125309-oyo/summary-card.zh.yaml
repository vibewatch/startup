summary:
  headline: 跟踪：OYO 已提交文件背书的扭亏和全球化规模重定位，足以支撑真实 IPO 讨论；但杠杆、诉讼、利润质量调整，以及 $7-8 billion 的偏高要价，仍需要严谨承销。
