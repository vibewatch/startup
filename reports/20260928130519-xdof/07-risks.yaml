schemaVersion: "report-v2"
artifact: risks
slug: xdof
runDate: 2026-09-28
company:
  name: XDOF
chapter:
  number: 7
  title: Risks
  summary: >-
    XDOF's highest-evidence risks are executional rather than proven misconduct: it must scale a
    human-intensive data operation, protect personal and customer data, and convert rapid reported
    growth into durable economics while financing terms, customer concentration, security
    certifications, incidents, and legal exposure remain unverified.
sections:
  - id: ranked-risk-posture
    title: Ranked risk posture
    body: >-
      The principal risk is pace mismatch. XDOF reportedly moved from a $70 million Series A to
      discussions of another round within roughly three months while annualized revenue approached
      $50 million, and it intends to expand a worldwide network of teleoperators and sensor-wearing
      collectors. Those facts indicate demand and access to capital, but neither reported annualized
      revenue nor funding raised establishes recurring revenue, cash availability, runway, or
      operating leverage. The base underwriting posture should therefore be high impact and medium
      likelihood for financing-and-scale execution until management supplies audited revenue
      composition, gross margin, burn, cash, and milestone-linked hiring plans. A second high-impact
      exposure is data security and privacy: XDOF's own policy acknowledges that no transmission or
      storage system is fully secure. The heatmap ranks residual exposure from disclosed facts and
      gaps; it does not assert that an incident has occurred.
    claimRefs: [CR003, CR006, CR007, CR008, CR010, CR013, CR016]
    figureRefs: [FR001]
  - id: legal-regulatory-and-security
    title: Legal, regulatory, and security controls
    body: >-
      XDOF's published privacy policy is the only primary legal-control artifact in the assigned
      evidence. It covers website and communications data, describes California rights, identifies
      a general counsel, security contact, and data protection officer, and contemplates transfers
      outside a visitor's home jurisdiction. These are meaningful policy-level mitigations, but they
      do not evidence operating effectiveness, customer-data controls, workforce consent practices,
      contractual data-processing terms, insurance, certifications, or regulatory approvals. The
      policy also allows disclosures to service providers and certain business partners, expanding
      the vendor-control surface. No inference of clean incident or litigation history is warranted:
      the available source pool contains no regulator record, court record, status history,
      certification report, or incident register. Investment approval should require those primary
      materials rather than treating policy publication as control validation.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR014]
    tableRefs: [TR001]
  - id: operating-model-exposure
    title: Operating-model and quality exposure
    body: >-
      XDOF is building an outsourced data supply chain with collection tools, annotation systems,
      remote robot operation, and human motion capture. That model creates linked risks in worker
      training, consent, task consistency, hardware uptime, annotation quality, and secure transfer
      of customer data. Public reports place the organization at roughly 60 employees and about 20
      customers, while XDOF plans to expand collectors globally; the operating span may therefore
      grow faster than the disclosed control base. Customer identities, contract terms, acceptance
      criteria, dataset defect rates, rework, service levels, and insurance are not available in the
      assigned evidence. The kill criterion is not one isolated quality miss but a pattern of failed
      customer acceptance, rising rework, material safety events, or collection growth that does not
      produce improving gross margin and repeat orders.
    claimRefs: [CR003, CR009, CR010, CR011, CR012, CR014]
    tableRefs: [TR002]
  - id: dependencies-financing-and-thesis-breaks
    title: Dependencies, financing, and thesis-breaks
    body: >-
      The disclosed dependency map is concentrated around a small, mostly unnamed customer base,
      human collectors, technology and analytics providers, a university research relationship, and
      prospective capital providers. Reporting says XDOF works with about 20 customers including
      several frontier AI labs, but the evidence does not disclose revenue concentration, renewal
      terms, production-versus-pilot mix, or switching behavior. The UC Berkeley AI Research Lab
      relationship supports dataset development, yet ownership, exclusivity, continuity, and
      commercialization rights are not public in this pool. Proposed Series B terms were reported as
      non-final, so valuation headlines should not be treated as cash on hand or financing certainty.
      Thesis-break triggers are loss of a major customer without replacement, inability to document
      dataset provenance and worker consent, a material security or safety event, adverse IP or
      regulatory findings, or a financing plan that requires growth without credible unit-economics
      evidence.
    claimRefs: [CR002, CR007, CR009, CR013, CR014, CR015, CR016]
    tableRefs: [TR003]
