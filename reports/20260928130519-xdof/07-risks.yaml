      - - Cross-border personal-data transfer
        - EEA and other non-US jurisdictions
        - Policy contemplates transfers to the United States and other countries
        - Medium
        - High
        - Stated safeguards, legal compliance, and DPO contact
        - Medium-high; transfer instruments and subprocessors are undisclosed
        - Review DPAs, SCCs, transfer-impact assessments, and subprocessor inventory
      - - Security, breach, and customer-data obligations
