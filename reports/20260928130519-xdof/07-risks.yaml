        - About 20 customers, several described as frontier AI labs
        - Buyers of collection and training-data services
        - Revenue concentration and customer identities are not disclosed
        - One or more large programs pause, internalize collection, or reject data
        - High
        - Reported customer breadth, subject to verification
        - High until contract and concentration evidence is reviewed
      - - Research and dataset collaboration
        - UC Berkeley AI Research Lab
        - Partner in the reported ABC dataset release
        - Ownership and exclusivity terms are not disclosed
        - Relationship, rights, or research continuity changes
        - Medium-high
        - Existing research relationship
        - Medium pending IP and commercialization agreements
      - - Follow-on capital
        - Prospective Series B investors, reportedly including 8VC
        - Funds scaling after the Series A
        - Reported terms were non-final and amount was undisclosed
        - Round does not close or imposes restrictive economics
        - High
        - Prior $70 million Series A
        - Medium-high without cash, burn, runway, and signed terms
      - - Data and analytics vendors
        - Unnamed service, fraud-protection, and analytics providers
        - Process website and interaction information
        - Subprocessor list and criticality are not disclosed
        - Vendor breach, outage, or cross-border compliance failure
        - High
        - Contractual providers and stated safeguards
        - Medium-high pending vendor inventory and control evidence
    notes: >-
      Concentration fields are gaps where the public evidence names a dependency but does not disclose
      contractual share, exclusivity, revenue contribution, or replacement time.
    claimRefs: [CR002, CR006, CR007, CR009, CR014, CR015]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Analytical placement of material exposures by impact and likelihood, preserving unknowns where
      the assigned evidence cannot support a probability estimate.
    data:
      columns:
        - id: low-likelihood
          label: Low likelihood
        - id: medium-likelihood
          label: Medium likelihood
        - id: high-or-unknown-likelihood
          label: High or unknown likelihood
      rows:
        - label: Critical impact
          values:
            - label: No risk placed
              detail: No assigned evidence supports a low-likelihood classification here.
            - label: Financing and scale execution
              detail: Fast fundraising, hiring, and collector-network expansion must convert into durable economics.
            - label: Security or privacy control failure
              detail: Impact is critical; probability is unknown without audits, certifications, and incident records.
        - label: High impact
          values:
            - label: No risk placed
              detail: No assigned evidence supports a low-likelihood classification here.
            - label: Collector quality and pipeline reliability
              detail: Human-intensive collection and annotation create scaling and consistency dependencies.
            - label: Customer concentration
              detail: Roughly 20 customers are reported, but revenue shares and contract durability are unavailable.
        - label: Medium-high impact
          values:
            - label: Research-partner continuity
              detail: Collaboration is reported, but ownership and commercialization terms are unavailable.
            - label: Competitive compression
              detail: Tracxn lists 46 active competitors, including 19 funded competitors.
            - label: Vendor and subprocessor dependency
              detail: Providers are acknowledged, but the inventory and criticality are not disclosed.
        - label: Medium impact
          values:
            - label: No risk placed
              detail: No assigned evidence supports a low-likelihood classification here.
            - label: Valuation-expectation pressure
              detail: Reported financing discussions raise milestone expectations, but the terms remain non-final.
            - label: No risk placed
              detail: No assigned evidence supports a high-likelihood classification at this impact level.
        - label: Low impact
          values:
            - label: No risk placed
              detail: No material risk is classified as both low impact and low likelihood.
            - label: No risk placed
              detail: No material risk is classified as low impact and medium likelihood.
            - label: No risk placed
              detail: No material risk is classified as low impact and high likelihood.
        - label: Impact not quantifiable
          values:
            - label: No risk placed
              detail: The evidence does not justify a low-likelihood estimate for unquantified exposure.
            - label: No risk placed
              detail: The evidence does not justify a medium-likelihood estimate for unquantified exposure.
            - label: Legal, incident, and certification history
              detail: Primary records are absent, so impact and probability remain unquantified diligence gaps.
    approximationNotes: >-
      Qualitative placement only; no incident frequencies, loss distributions, audited concentration,
      or company risk scores were available.
    claimRefs: [CR002, CR003, CR007, CR009, CR010, CR012, CR015, CR016]
callouts:
  - calloutType: risk
    title: Do not equate financing with runway
    body: >-
      The $70 million Series A is funding raised, not verified cash available; require current cash,
      burn, commitments, working-capital needs, and financing terms before sizing runway.
    claimRefs: [CR006, CR007, CR013]
  - calloutType: recommendation
    title: Conditional investment gate
    body: >-
      Require customer concentration and renewal evidence, audited revenue composition, unit
      economics, security-control reports, incident and litigation histories, worker-consent
      controls, and the Berkeley collaboration agreements before treating rapid growth as de-risking.
    claimRefs: [CR001, CR003, CR008, CR009, CR010, CR015, CR016]
