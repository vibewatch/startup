        - No cohort-level quality or collector productivity data
      - - Teleoperation, sensor, or annotation pipeline disruption
        - Medium
        - High
        - Undisclosed beyond general website-security language
        - High
        - Uptime, failed sessions, data loss, and recovery time
        - No service-level, disaster-recovery, or customer-security evidence
      - - Customer requirements vary faster than reusable tooling
        - Medium
        - High
