        - Unknown
        - High
        - Physical, electronic, and administrative safeguards are stated
        - Unknown; no certification, penetration test, or incident record was available
        - Obtain SOC reports, penetration tests, incident log, cyber insurance, and customer security addenda
    notes: >-
      Partial register based on XDOF's June 2026 website privacy policy and independent descriptions
      of its data-supply-chain model; absence of a cited case or incident is not evidence of absence.
    enumerationScope:
