callouts:
  - calloutType: "insight"
    title: "The Physical World Training Data Bottleneck"
    body: "Unlike software large language models that scaled by crawling public internet text, embodied robotic intelligence requires grounded physical demonstration data that must be captured in real-world environments. This dynamic creates an urgent infrastructure market for specialized teleoperation and sensor collection networks."
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM005"
  - calloutType: "risk"
    title: "Buyer Quality Perception and Modest Switching Costs"
    body: "While enterprise willingness to outsource physical data collection is strong among early frontier AI teams, buyer interviews indicate modest switching costs and ongoing scrutiny regarding whether outsourced teleoperation trajectories match the fidelity of internal research lab captures."
    claimRefs:
      - "CM007"
      - "CM011"
