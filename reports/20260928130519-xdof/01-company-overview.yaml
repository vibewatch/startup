company:
  name: "XDOF"
chapter:
  number: 1
  title: "Company Overview"
  summary: "XDOF, Inc. is a physical AI and robotics infrastructure company founded in October 2024 by UC Berkeley researchers behind the GELLO teleoperation system. Emerging from stealth in June 2026 with a $70 million Series A from Thrive Capital, Andreessen Horowitz, Lux Capital, Spark Capital, and WndrCo, the company provides data pipelines, remote teleoperation systems, and annotation tooling for general-purpose robot foundation models, reportedly entering discussions for a $1.2 billion Series B round within three months of launch."
sections:
  - id: "company-identity-and-mission"
    title: "Company Identity, Corporate Structure, and Mission"
    body: "XDOF, Inc. is a robotics infrastructure and physical artificial intelligence company founded in October 2024 and operating with primary executive offices in San Mateo, California, having originated from academic research in Berkeley, California [CO001, CO013]. The company addresses the central data bottleneck in embodied intelligence: while digital foundation models benefit from massive internet-scale text and image archives, general-purpose physical robots lack real-world interaction data [CO005]. XDOF builds end-to-end data pipelines, proprietary low-cost teleoperation tooling, and human annotation systems designed to serve as an outsourced physical data supply chain for robotics manufacturers and frontier artificial intelligence laboratories [CO005, CO006]. By combining remote robot teleoperation with egocentric human wearable sensors, XDOF captures rich, high-fidelity demonstrations of physical manipulation tasks, enabling frontier labs to train multi-task robotic foundation models without incurring the prohibitive capital cost of internal data-collection infrastructure [CO005, CO006]."
    claimRefs:
      - "CO001"
      - "CO005"
      - "CO006"
      - "CO013"
    tableRefs:
      - "TO001"
  - id: "founders-and-leadership-governance"
    title: "Founders, Technical Leadership, and Governance"
    body: "The company was co-founded by UC Berkeley robotics researchers Philipp Wu and Fred Shentu, alongside technical co-founder Nemo Jin, in October 2024 [CO001]. Chief Executive Officer Philipp Wu previously researched how physical robots learn from large-scale demonstration datasets as a doctoral researcher at UC Berkeley, identifying the lack of open, multi-task physical manipulation data as the critical impediment to physical artificial intelligence [CO001, CO006]. Collaborating with Chief Technology Officer Fred Shentu, Wu developed GELLO, an open-source, low-cost teleoperation interface that dramatically lowered the financial barrier to collecting dexterous manipulation trajectories [CO006]. XDOF commercializes and expands upon this academic lineage [CO006]. However, formal institutional governance structures remain undisclosed; neither XDOF nor its Series A investors have publicly detailed board seat allocations, independent director representation, or founder voting control covenants, representing a material governance diligence gap for prospective capital partners [CO014]."
    claimRefs:
      - "CO001"
      - "CO006"
      - "CO010"
      - "CO014"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-investor-syndicate"
    title: "Capitalization History, Valuation, and Investor Syndicate"
    body: "XDOF operated in stealth until June 17, 2026, when it announced a $70 million Series A financing round that constitutes its entire documented institutional equity capital to date [CO002]. The round brought together a prominent syndicate of venture capital funds, including Thrive Capital, Andreessen Horowitz (a16z), Lux Capital, Spark Capital, and WndrCo [CO003]. Independent venture analysis indicates that syndicating five tier-one venture franchises across an initial financing round introduces follow-on financing risk: because no single venture investor holds a dominant ownership percentage, no single sponsor bears sole fiduciary stewardship to guarantee future capital support [CO011]. Within three months of its stealth emergence, venture capital interest propelled XDOF into late-stage talks for a Series B financing round at an approximate valuation of $1.2 billion led by 8VC [CO004]. However, this transaction remains unclosed as of September 2026, and terms remain subject to negotiation, underscoring the risk of valuation volatility ahead of verified commercial metrics [CO004, CO014]."
    claimRefs:
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO011"
      - "CO014"
    tableRefs:
      - "TO003"
  - id: "operational-milestones-and-commercial-scale"
    title: "Operational Milestones, Dataset Distribution, and Scale"
    body: "Upon emerging from stealth in June 2026, XDOF released ABC-130K, an open-source manipulation dataset developed in partnership with UC Berkeley's AI Research lab comprising over 130,000 trajectories across 195 bimanual manipulation tasks, establishing the company's technical credibility across the embodied AI community [CO007]. Commercial traction materialized rapidly, with XDOF reporting approximately 20 active paying customers at its launch, including several unnamed frontier artificial intelligence laboratories [CO008]. By September 2026, secondary reports indicated annualized revenue run-rates approaching $50 million, supported by an expanding core team of roughly 60 employees [CO009, CO010]. To satisfy escalating customer demand, XDOF has initiated global recruiting campaigns across North America, Latin America, and Southeast Asia to scale networks of remote teleoperators and field data collectors [CO010]."
    claimRefs:
      - "CO002"
      - "CO004"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
    figureRefs:
      - "FO001"
  - id: "diligence-evaluation-and-evidence-gaps"
    title: "Diligence Assessment, Governance Risks, and Unresolved Gaps"
    body: "From an investment diligence perspective, XDOF presents a compelling strategic position at the intersection of foundation model development and physical robotics, yet several critical diligence gaps remain unresolved [CO009, CO012]. Most notably, reported annualized revenue figures approaching $50 million are third-party press estimates that lack audited GAAP verification, customer cohort retention metrics, or gross margin disclosures [CO009]. The operational reality of managing distributed human teleoperators and hardware sensor fleets worldwide creates heavy structural cost exposure that could erode unit economics if pricing power softens [CO011, CO012]. Furthermore, the complete opacity surrounding board governance, voting rights, and lead investor commitment necessitates confirmatory legal inspection before underwriting late-stage equity valuation multiples [CO011, CO014]."
    claimRefs:
      - "CO009"
      - "CO011"
      - "CO012"
      - "CO014"
