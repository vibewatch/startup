callouts:
  - calloutType: "insight"
    title: "Outsourced Physical Data Layer for Robotics Foundation Models"
    body: "Unlike software large language models that scaled on pre-existing public internet text, embodied robotics AI faces a severe bottleneck in physical interaction data. XDOF positions itself as the physical equivalent of Scale AI, combining low-cost teleoperation hardware with distributed human operators to capture high-fidelity manipulation datasets for frontier AI labs."
    claimRefs:
      - "CO001"
      - "CO005"
      - "CO006"
      - "CO007"
  - calloutType: "risk"
    title: "Multi-Party Syndicate Governance and Operational Burn Exposure"
    body: "XDOF's $70 million Series A was syndicated across five high-profile venture funds without a single disclosed majority lead. This structure creates governance complexity where no individual firm has sole stewardship to anchor follow-on capital. Simultaneously, scaling a global workforce of human teleoperators introduces heavy recurring operational burn that requires rapid customer monetization to sustain."
    claimRefs:
      - "CO002"
      - "CO003"
      - "CO011"
      - "CO012"
      - "CO014"
