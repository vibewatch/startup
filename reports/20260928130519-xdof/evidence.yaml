evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Official board of directors seat allocations, independent director appointments, and voting agreements for Series
      A investors.
    whyItMatters: >-
      Board composition dictates whether founder control is preserved or whether institutional investors hold veto
      rights over operational and financing decisions.
    diligencePath: >-
      Inspect Delaware Certificate of Incorporation, voting agreements, and investor rights agreements during
      confirmatory legal diligence.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: financial-metrics
    missingEvidence: >-
      Audited financial statements, gross margin breakdown between data collection hardware/field operations and
      software licenses, and GAAP net revenue.
    whyItMatters: >-
      Unverified annualized revenue estimates approaching $50 million may reflect non-recurring pilot contracts or gross
      data delivery billings rather than high-margin recurring software revenue.
    diligencePath: >-
      Request audited trailing twelve-month income statement, customer-level billing schedules, and gross margin
      reconciliations under NDA.
    relatedQuestionRefs:
      - QO005
  - type: private-evidence-only
    severity: material
    topic: market-sizing-sam
    missingEvidence: >-
      Detailed audited breakdown of total enterprise robotics data procurement spend and segment-level budget
      allocations across tier-1 humanoid robotics developers.
    whyItMatters: >-
      Without segmented customer procurement budgets, bottom-up SAM and SOM calculations must rely on proxy revenue
      run-rates and disclosed vendor contract averages rather than verified market-wide figures.
    diligencePath: >-
      Request customer contract cohort schedules, annual data consumption volumes, and pricing tier renewals during
      commercial diligence.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: buyer-retention-rates
    missingEvidence: >-
      Multi-year customer retention figures, net revenue retention (NRR), and empirical switching cost benchmarks across
      frontier AI labs.
    whyItMatters: >-
      Early customer interviews report modest switching costs; validating long-term renewal durability is essential to
      assess whether data supply chains become commoditized.
    diligencePath: Interview data engineering leads at customer labs regarding internal vs outsourced data collection cost curves.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-and-contract-terms
    missingEvidence: >-
      Audited per-hour teleoperation rates, per-trajectory unit pricing, and multi-year enterprise volume discount
      schedules across XDOF and its competitors.
    whyItMatters: >-
      Without public contract rate cards, comparative unit economic margins and pricing power between dedicated robotics
      data suppliers and internal lab collection cannot be independently verified.
    diligencePath: >-
      Request customer procurement contracts, master services agreements (MSAs), and rate cards under NDA from XDOF and
      benchmark against custom pricing proposals from Scale AI and Encord.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Audited gross margin figures, cost of goods sold per collection hour, and teleoperator labor wage schedules.
    whyItMatters: >-
      Without verified COGS and labor expenditure schedules, underwriting cannot determine whether XDOF can achieve
      software-level gross margins or if unit economics deteriorate as collection scales.
    diligencePath: >-
      Request management profit and loss statements breaking out teleoperation hardware subsidies, human collector
      wages, and cloud compute ingestion costs by customer cohort.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Customer-by-customer revenue breakdown, annual contract values (ACV), net revenue retention (NRR), and contract
      duration terms.
    whyItMatters: >-
      Given reported customer count of ~20 and annualized revenue of ~$50 million, average ACV is roughly $2.5 million;
      single-customer churn represents a material financial risk.
    diligencePath: >-
      Review master service agreements and statement of work schedules for the top 5 frontier AI lab customers to verify
      renewal commitments and cancellation provisions.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: trust-controls
    missingEvidence: >-
      Product-specific security architecture, access-control design, tenant isolation, data-retention policy,
      subprocessor inventory, certifications, penetration-test results, and incident log.
    whyItMatters: >-
      Website privacy language does not establish whether sensitive robot telemetry and customer training data are
      protected to enterprise standards.
    diligencePath: >-
      Request the security package, architecture and data-flow diagrams, latest independent audit or penetration test,
      certification scope, subprocessor list, and complete incident register.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: delivery-reliability
    missingEvidence: >-
      Contracted and realized service levels, delivery lead times, dataset acceptance rates, defect and rework
      distributions, outage history, and customer escalation records.
    whyItMatters: >-
      Hiring responsibilities describe intended controls but cannot verify repeatable production delivery or
      customer-accepted quality.
    diligencePath: >-
      Review twelve months of delivery dashboards, SLA reports, quality scorecards, acceptance tests, incident
      postmortems, and three customer reference calls.
    relatedTableRefs:
      - TE002
      - TE003
  - type: missing-source
    severity: material
    topic: technical-maturity
    missingEvidence: >-
      Public repositories, package releases, API documentation, changelogs, status pages, and independently reproduced
      technical benchmarks.
    whyItMatters: >-
      Job reposts are useful developer signals but do not establish shipped interfaces, release cadence, system
      performance, or external adoption.
    diligencePath: >-
      Request product documentation and release history, inspect source and deployment artifacts under NDA, and
      reproduce representative ingestion, retrieval, and evaluation workloads.
    relatedTableRefs:
      - TE001
      - TE003
  - type: private-evidence-only
    severity: material
    topic: scaling-economics
    missingEvidence: >-
      Cost and throughput by collection mode, robot utilization, operator productivity, venue economics, storage and
      egress cost, and gross margin by delivery type.
    whyItMatters: >-
      The operating model combines labor, hardware, facilities, and cloud infrastructure, so dataset growth may not
      translate into scalable economics.
    diligencePath: >-
      Reconcile job-level cost accounting to delivered hours and accepted trajectories for representative target-robot,
      lower-cost teleoperation, and egocentric projects.
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      No named commercial customer, deployment status, customer-authored outcome, or reference contact is present in the
      assigned evidence.
    whyItMatters: >-
      Without named references, diligence cannot distinguish paid production use from pilots or verify the quality and
      durability of adoption.
    diligencePath: >-
      Obtain a complete customer roster and select at least three references across frontier labs and robotics
      developers for independent calls and contract verification.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-and-renewal
    missingEvidence: >-
      No GRR, NRR, churn, renewal rate, contract duration, cohort schedule, or pilot-to-production conversion metric is
      public.
    whyItMatters: >-
      The customer count and annualized-revenue report cannot establish repeatability, recurring revenue quality, or
      customer lifetime value.
    diligencePath: >-
      Request account-level cohort schedules, signed contract terms, renewal histories, and revenue-recognition support
      reconciled to the reported annualized revenue.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      The retained evidence does not disclose top-customer revenue shares, segment mix, or dependence on any single
      frontier lab.
    whyItMatters: A small reported customer base could create material concentration even if aggregate commercial velocity is high.
    diligencePath: >-
      Review anonymized top-1, top-3, and top-5 revenue concentration, pipeline exposure, and termination rights by
      customer.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: financial-model
    missingEvidence: >-
      Current cash, monthly burn, committed spend, gross margin by program, working-capital cycle, audited revenue
      composition, runway, and signed financing terms.
    whyItMatters: >-
      Funding raised and reported annualized revenue do not establish available cash, recurring revenue, cash burn, or
      the capital required to scale the operating model.
    diligencePath: >-
      Review bank statements, management accounts, revenue contracts, cohort gross margins, hiring plan, cap table,
      board materials, and signed or draft financing documents.
    relatedQuestionRefs:
      - QR005
  - type: missing-source
    severity: material
    topic: legal-security-history
    missingEvidence: >-
      Regulator and court searches, licenses or approvals, certification reports, penetration tests, incident and outage
      histories, claims history, insurance, and customer security audits.
    whyItMatters: >-
      A website privacy policy describes intentions but cannot establish control effectiveness or prove the absence of
      incidents, litigation, enforcement, or safety failures.
    diligencePath: >-
      Obtain counsel confirmations, jurisdictional regulator checks, litigation searches, SOC or equivalent reports,
      penetration-test summaries, incident logs, status history, and insurance.
    relatedQuestionRefs:
      - QR007
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Customer identities, production-versus-pilot status, top-customer revenue shares, contract duration, renewal,
      acceptance criteria, churn, switching behavior, and pipeline conversion.
