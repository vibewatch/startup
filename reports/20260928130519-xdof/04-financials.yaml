callouts:
  - calloutType: "risk"
    title: "Linear Cost Scaling in Human Data Acquisition"
    body: "Unlike pure-play foundational model or enterprise software businesses, XDOF's data supply chain relies directly on human operators piloting hardware rigs and wearing motion-capture sensors. Because labor and hardware deployment costs scale linearly with collection volume, gross margins face persistent structural compression relative to standard SaaS profiles."
    claimRefs:
      - "CI008"
      - "CI012"
  - calloutType: "insight"
    title: "Valuation Sensitivity to Extreme Customer Concentration"
    body: "Negotiating a Series B at a $1.2 billion valuation against ~$50 million in annualized revenue yields a mid-20s multiple. With roughly 20 customers total, a defection or in-sourcing move by even two or three anchor frontier AI labs could destabilize cash inflows and impair the revenue base."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI013"
