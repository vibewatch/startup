figures:
  - id: "FE001"
    title: "Evidence-backed robotics-data delivery stack"
    type: "stack"
    summary: >-
      The public evidence describes a vertically integrated path from task
      definition through physical collection, data operations, delivery, and
      evaluation, with ABC-130K as the clearest disclosed output.
    data:
      layers:
        - label: "1. Customer task definition"
          detail: "Translate target tasks, robot embodiment, data format, and acceptance needs into delivery specifications."
          items:
            - label: "Requirements and sequencing"
              note: "Described in customer-delivery job reposts; no public cycle-time metric."
        - label: "2. Physical demonstration"
          detail: "Collect target-robot, lower-cost teleoperation, or egocentric human-motion data."
          items:
            - label: "Robots, sensors, operators, and venues"
              note: "Collection modes are reported; sensor and hardware specifications remain undisclosed."
        - label: "3. Ingestion and orchestration"
          detail: "Move recorded data into processing, storage, and researcher workflows."
          items:
            - label: "Compute, pipelines, and multi-tenant storage"
              note: "Scope comes from hiring text rather than an independently tested production system."
        - label: "4. Annotation and quality control"
          detail: "Apply annotation, audit guidelines, scoring, calibration, and root-cause analysis."
          items:
            - label: "Quality standards and corrective loops"
              note: "No public distribution of error, rework, or customer-acceptance rates."
        - label: "5. Dataset delivery and tooling"
          detail: "Provide datasets, visualizers, exploration tools, and customer-facing issue resolution."
          items:
            - label: "Self-serve and managed delivery"
              note: "Availability, packaging, API surface, and realized service levels are not public."
        - label: "6. Evaluation and feedback"
          detail: "Use model evaluation and customer feedback to target subsequent collection and improvement."
          items:
            - label: "ABC-130K proof point"
              note: "Independent sources report 130,000-plus trajectories or episodes across 195 tasks."
    approximationNotes: >-
      This is a synthesis of disclosed workflow components, not a verified
      internal systems diagram; sequence does not imply measured latency or
      production readiness.
    claimRefs:
      - "CE002"
      - "CE004"
      - "CE009"
      - "CE010"
      - "CE011"
callouts:
  - calloutType: "strength"
    title: "A tangible research-scale proof point"
    body: >-
      ABC-130K gives XDOF a more concrete technical artifact than a purely
      conceptual data-infrastructure pitch, although its scale does not by
      itself establish commercial data quality or customer outcomes.
    claimRefs:
      - "CE009"
      - "CE010"
  - calloutType: "risk"
    title: "The moat must emerge from repeatable quality, not collection volume alone"
    body: >-
      Hardware, operators, venues, calibration, and audits create operational
      complexity, while customers can insource strategically important data.
      Underwriting therefore requires quality, transferability, and delivery
      economics rather than a raw trajectory count.
    claimRefs:
      - "CE008"
      - "CE014"
