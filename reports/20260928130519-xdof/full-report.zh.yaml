        - 年化收入增至 $100M+；遥操作网络转向人机协同自动化；前沿实验室客户从 20 家增至 60+ 家
        - 下一次流动性事件估值达到 $2.5B-$3.0B；凭借物理 AI 赛道领先地位，估值倍数扩大 2.0x-2.5x
        - 客户把遥操作收回自营；毛利率降至 40% 以下
        - 20%
      - - 基准情景
        - Series B 以 $1.0B-$1.2B 交割；年化收入稳定在 $50M-$65M、毛利率为 50%；签有 20-30 份活跃企业合同
        - 维持 $1.0B-$1.2B 账面估值；回报取决于运营执行，以及收入能否稳步转化为 ARR
        - 领投机构之间的银团谈判停滞；招聘和烧钱持续消耗现金储备
        - 55%
      - - 悲观情景
        - Series B 未能以 $1.2B 交割；收入最终被证实来自一次性项目支出；60+ 名员工及遥操作员带来的高额开支耗尽 $70M 资本
        - 降轮融资或以 $300M-$500M 进行结构化资本重组；高级清算优先权造成严重稀释
        - 前沿实验室转向仿真或扩散策略；遥操作人工成本耗尽现金
        - 25%
    notes: 情景概率与回报逻辑是作者基于一级市场机器人可比公司所作的建模，假设历史融资为 $78M、员工约 60 人。
    claimRefs:
      - CV002
      - CV004
      - CV006
      - CV008
      - CV012
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: XDOF 从 UC Berkeley 学术研究起步，随后走出隐身、完成 Series A 融资并拓展商业化。
    data:
      items:
        - label: GELLO 项目启动
          date: 2024-03
          detail: Philipp Wu 与 Fred Shentu 在 UC Berkeley 开发 GELLO，用低成本遥操作装置缓解机器人训练数据短缺。
          tone: positive
        - label: XDOF 公司注册成立
          date: 2024-10
          detail: Philipp Wu、Fred Shentu 与 Nemo Jin 创立 XDOF, Inc.，将物理 AI 遥操作基础设施商业化。
          tone: neutral
        - label: 隐私与运营合规框架
          date: '2026-06-16'
          detail: XDOF 在公开亮相前搭建企业合规框架、制定隐私政策，并建设数字数据基础设施。
          tone: neutral
        - label: 走出隐身并宣布 $70M Series A
          date: '2026-06-17'
          detail: XDOF 走出隐身，宣布获得由 Thrive、a16z、Lux、Spark 和 WndrCo 支持的 $70M Series A 融资。
          tone: positive
        - label: ABC-130K 开源数据集发布
          date: '2026-06-18'
          detail: 联合 UC Berkeley AI Research 发布 ABC-130K，提供涵盖 195 项任务的 130,000 条双臂操作轨迹。
          tone: positive
        - label: 客户与运营进展
          date: '2026-06-20'
          detail: 确认已与约 20 家活跃客户签约，其中包括领先前沿 AI 实验室；团队约 60 人。
          tone: positive
        - label: 全球员工与采集员网络扩张
          date: '2026-08-15'
          detail: 启动在拉丁美洲和东南亚的跨国招聘，招募遥操作员和第一视角数据采集员。
          tone: neutral
        - label: Series B 洽谈，目标估值 $1.2B
          date: '2026-09-04'
          detail: 据报道，$50M 收入运行率的增长势头吸引风投机构接洽 XDOF；双方洽谈由 8VC 领投、目标估值约 $1.2B 的 Series B。
          tone: positive
    claimRefs:
      - CO001
      - CO002
      - CO004
      - CO006
      - CO007
      - CO008
      - CO010
      - CO013
  - id: FM001
    title: 物理机器人数据基础设施市场规模金字塔
    type: pyramid
    summary: 从宏观机器人自动化支出逐层收敛至近期可服务的遥操作收入，估算物理 AI 数据基础设施市场。
    approximationNotes: 顶层 TAM 代表物理 AI 训练数据的宏观预测；中层 SAM 和 SOM 反映基于活跃研究团队与平均合同价值的自下而上测算。
    claimRefs:
      - CM004
      - CM008
      - CM014
      - CM016
    data:
      items:
        - label: 宏观物理 AI 市场（TAM）
          value: $18.0B
          detail: 具身智能基础模型、工业机器人和消费级自动化领域的全球长期支出。
          tone: neutral
        - label: 机器人训练基础设施（SAM）
          value: $2.5B
          detail: 专用物理数据采集、遥操作工具链及传感器管线的近期潜在市场。
          tone: opportunity
        - label: 前沿实验室数据外包（SOM）
          value: $250M
          detail: 约 50 家活跃前沿 AI 实验室和人形机器人开发商构成的近期可服务企业市场。
          tone: positive
        - label: 多任务轨迹数据集
          value: $120M
          detail: 高价值操作数据集细分赛道，以密集多角度双臂任务库为代表。
          tone: neutral
        - label: 全球人工遥操作网络
          value: $80M
          detail: 分布式网络负责实时远程操控机器人，并采集第一视角传感器演示数据。
          tone: warning
        - label: XDOF 当前收入运行率
          value: $50M
          detail: 截至 2026 年 Q3，据报道约 20 家企业客户贡献了这项年化收入运行率。
          tone: positive
  - id: FP001
    title: 战略定位：物理机器人专业化程度与数据基础设施规模
    type: quadrant
    summary: 比较物理 AI 数据供应商、数字标注老牌企业和内部自建方案的硬件专业度与数据基础设施规模。
    data:
      points:
        - label: XDOF
          x: 8.5
          'y': 7
          description: 具备极高的物理机器人遥操作专业化程度，专用数据基础设施扩张迅速。
        - label: Scale AI
          x: 3
          'y': 9.5
          description: 数字数据平台体量庞大、资产负债表实力雄厚，但在物理硬件遥操作上的积累较浅。
        - label: Mecka AI
          x: 8
          'y': 4
          description: 专注真实场景机器人数据采集，融资规模仍处早期阶段。
        - label: Encord
          x: 5
          'y': 5.5
          description: 多模态 AI 数据标注工具链，在 $60M 风险投资支持下拓展物理 AI 业务。
        - label: Micro1
          x: 2.5
          'y': 6
          description: 人工数据平台从 LLM 扩展至其他领域，业务仍以远程数字人才和软件任务为主。
        - label: 实验室内部 DIY
          x: 7.5
          'y': 3
          description: 围绕特定专有模型具备深厚技术专长，但受内部研发团队产能限制。
    approximationNotes: 坐标代表基于 2026 年已披露数据集规模、硬件遥操作能力及据报道风险融资规模的 1–10 分序数评分。
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP011
      - CP014
  - id: FI001
    title: 收入模型桥
    type: waterfall
    summary: 以典型企业级物理 AI 数据训练合同为例，展示合同预订总额扣除硬件、遥操作人工和算力成本后，如何形成预估贡献利润率。
    data:
      items:
        - label: 合同总价值
          value: 100
        - label: GELLO 装置硬件摊销
          value: -12
        - label: 人工遥操作员成本
          value: -38
        - label: 数据接入与云端算力
          value: -15
        - label: 标注质检与视频审核
          value: -10
        - label: 预估贡献利润率
          value: 25
    approximationNotes: 按合同金额占比构建的示意模型，基于据报道的劳动密集型采集流程和遥操作硬件需求；经审计的公司整体毛利率仍未披露。
    claimRefs:
      - CI008
      - CI009
      - CI012
  - id: FE001
    title: 循证机器人数据交付栈
    type: stack
    summary: 公开资料呈现一条从任务定义、物理采集到数据运营、交付和评估的垂直流程；ABC-130K 是其中最清晰的公开成果。
    data:
      layers:
        - label: 1. 客户任务定义
          detail: 将目标任务、机器人本体、数据格式和验收要求转化为交付技术规范。
          items:
            - label: 需求制定与任务排序
              note: Described in customer-delivery job reposts; no public cycle-time metric.
        - label: 2. 物理演示采集
          detail: 采集目标机器人演示数据、低成本遥操作数据，或第一视角的人体运动数据。
          items:
            - label: 机器人、传感器、操作员与场地
              note: Collection modes are reported; sensor and hardware specifications remain undisclosed.
        - label: 3. 数据接入与编排
          detail: 把采集数据送入处理、存储和研究人员工作流。
          items:
            - label: 算力、数据管线与多租户存储
              note: Scope comes from hiring text rather than an independently tested production system.
        - label: 4. 标注与质量控制
          detail: 完成数据标注，并落实审核规范、评分、校准和根因分析。
          items:
            - label: 质量标准与纠错闭环
              note: No public distribution of error, rework, or customer-acceptance rates.
        - label: 5. 数据集交付与工具链
          detail: 提供数据集、可视化与探索工具，并处理客户问题。
          items:
            - label: 自助式与托管式交付
              note: Availability, packaging, API surface, and realized service levels are not public.
        - label: 6. 评估与反馈
          detail: 利用模型评估和客户反馈指导后续针对性采集与持续改进。
          items:
            - label: ABC-130K 验证标杆
              note: Independent sources report 130,000-plus trajectories or episodes across 195 tasks.
    approximationNotes: 本图整合已披露的工作流环节，并非经核实的内部系统架构；图示顺序不代表实际延迟或已达到生产就绪状态。
    claimRefs:
      - CE002
      - CE004
      - CE009
      - CE010
      - CE011
  - id: FU001
    title: 客户旅程与未经证实的扩张闭环
    type: journey-map
    summary: 据报道的交付环节为客户账户扩张提供了合理基础，但续约和客户集中度仍缺公开证据。
    data:
      items:
        - label: 1. 数据瓶颈
          detail: 前沿实验室或机器人开发商缺少足量的物理世界训练数据。
          touchpoints:
            - 研究团队与机器人团队
        - label: 2. 企业采购评估
          detail: 采购方评估外包采集工具、数据管线和标注服务。
          touchpoints:
            - 技术评估
            - 采购
        - label: 3. 采集方案设计
          detail: 按客户的模型开发需求设计采集任务和方式。
          touchpoints:
            - 遥操作
            - 传感器支持的人工采集
        - label: 4. 数据生产
          detail: 人工操作员和机器人系统生成物理世界中的操作演示。
          touchpoints:
            - 操作员网络
            - 机器人系统
        - label: 5. 标注与交付
          detail: 采集数据经标注后，进入客户侧的数据基础设施。
          touchpoints:
            - 标注系统
            - 数据管线
        - label: 6. 扩张或续约
          detail: 长期服务关系和软件更新机制可能支撑客户扩张，但尚无公开续约证据。
          touchpoints:
            - 服务关系
            - 软件更新
    approximationNotes: 阶段 1-5 汇总了据报道的工作流程；阶段 6 只是潜在机制，并非经验证的转化或续约路径。
    claimRefs:
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 按影响程度和发生概率梳理重大风险敞口；指定证据不足以估算概率时，保留未知项。
    data:
      columns:
        - id: low-likelihood
          label: 低概率
        - id: medium-likelihood
          label: 中概率
        - id: high-or-unknown-likelihood
          label: 高概率 / 概率未知
      rows:
        - label: 极严重影响
          values:
            - label: 未列风险
              detail: 指定证据不足以支持将风险归为低概率。
            - label: 融资与规模化执行
              detail: 快速融资、招聘和采集员网络扩张，最终都必须转化为可持续的经济效益。
            - label: 安全或隐私控制失效
              detail: 影响属极严重级别；缺少审计、认证和事件记录，无法判断发生概率。
        - label: 高影响
          values:
            - label: 未列风险
              detail: 指定证据不足以支持将风险归为低概率。
            - label: 采集员质量与管线可靠性
              detail: 采集和标注高度依赖人力，规模扩张与质量一致性都受此制约。
            - label: 客户集中度
              detail: 据报道，公司约有 20 家客户；各客户收入占比和合同稳定性尚不可得。
        - label: 中高影响
          values:
            - label: 科研伙伴关系持续性
              detail: 据报道存在合作关系，但合作权属安排和商业化条款尚不可得。
            - label: 竞争挤压
              detail: Tracxn 列出 46 家活跃竞争对手，其中 19 家已获融资。
            - label: 供应商与子处理方依赖
              detail: 已确认存在第三方服务商，但其名单和关键程度未披露。
        - label: 中影响
          values:
            - label: 未列风险
              detail: 指定证据不足以支持将风险归为低概率。
            - label: 估值预期压力
              detail: 据报道，融资洽谈抬高了里程碑预期，但融资条款仍未敲定。
            - label: 未列风险
              detail: 指定证据不足以将此影响级别的风险归为高概率。
        - label: 低影响
          values:
            - label: 未列风险
              detail: 没有重大风险同时落在低影响、低概率两档。
            - label: 未列风险
              detail: 没有重大风险落在低影响、中概率两档。
            - label: 未列风险
              detail: 没有重大风险落在低影响、高概率两档。
        - label: 影响无法量化
          values:
            - label: 未列风险
              detail: 现有证据不足以估算未量化风险敞口属于低概率。
            - label: 未列风险
              detail: 现有证据不足以估算未量化风险敞口属于中概率。
            - label: 法律事项、事件与认证记录
              detail: 缺少一手记录，影响程度和发生概率都无法量化，仍是尽调缺口。
    approximationNotes: 这里只作定性归类；目前没有事件频率、损失分布、经审计的集中度数据或公司风险评分。
    claimRefs:
      - CR002
      - CR003
      - CR007
      - CR009
      - CR010
      - CR012
      - CR015
      - CR016
  - id: FV001
    title: 建议决策逻辑
    type: flow
    summary: 从物理数据市场瓶颈出发，经收入扩张、人工成本压力和估值倍数，最终落到「观察」建议。
    data:
      nodes:
        - id: n1
          label: 物理数据瓶颈
          description: 前沿 AI 实验室缺少互联网级规模的真实世界机器人演示数据
        - id: n2
          label: 收入运行率快速攀升
          description: 20 家实验室客户贡献的年化收入接近 $50M，推动风投机构需求升温
        - id: n3
          label: 遥操作人力成本
          description: 人工遥操作员和 60+ 名员工让公司持续烧钱
        - id: n4
          label: 多基金联合融资
          description: 多家基金分摊投资份额，后续轮次没有单一投资方全额负责
        - id: n5
          label: 估值倍数偏高
          description: 据传 Series B 目标估值为 $1.2B，相当于早期收入约 24x
        - id: n6
          label: 决策：观察 / 暂缓投资
          description: 估值尚未核实，毛利率和客户流失数据也待审计；审计完成前暂不投资
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
    claimRefs:
      - CV008
      - CV010
      - CV011
      - CV014
