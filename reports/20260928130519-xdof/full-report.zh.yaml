    title: 核心论点 / 反方论点表
    columns:
      - 视角
      - 投资论点
      - 反方反驳论点
      - 何种情况会改变观点
    rows:
      - - 物理数据瓶颈
        - 机器人缺少互联网级训练语料；XDOF 的真实场景遥操作管线承担着物理世界版 Scale AI 的角色
        - 物理采集无法像网络抓取那样低成本扩张；劳动密集型操作员网络限制了毛利率上限
        - 若有证据表明合成数据可迁移，或自动化、自监督采集能减少人工操作时长
      - - 先发规模
        - ABC-130K 开源数据集与 UC Berkeley 学术背景确立了标准双臂操作基准
        - 开源基准模型降低了采集方案门槛，一线实验室可在内部复刻设备
        - 与一线前沿 AI 实验室签署排他性协议或多年期专有数据供应协议
      - - 收入增速
        - 据报道，走出隐身模式后 3 个月内年化收入接近 $50M，显示实验室需求极为迫切
        - 早期收入只是预训练初期的一次性项目预算，并非持久的经常性软件 ARR
        - 披露客户群留存、净收入留存率（NRR）超过 120% 以及多年期订阅承诺
      - - 资本结构
        - Thrive、Spark、a16z 与 Lux 的支持带来一线机构背书，也为后续融资提供资本储备
        - 投资人持股分散；若下一轮融资延迟，没有一家领投机构持有足够份额来确保过桥资金
        - 若有机构领投方拿出定价条款清单，并保障至少 24 个月现金跑道
    notes: 核心论点与反方论点反映了物理数据采集经济效益、约 20 家前沿实验室客户的集中度风险以及银团结构。
