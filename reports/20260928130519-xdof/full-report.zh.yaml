            body: >-
              最大风险是业务扩张速度与验证进度不匹配。据报道，XDOF 完成 $70 million Series A 后约 3 个月就开始洽谈新一轮融资，年化收入接近 $50
              million，并计划在全球扩充遥操作员和穿戴传感器采集员网络。这说明市场有需求、公司能接触资本，却不能证明收入具有经常性、现金可用、跑道充足或运营杠杆已改善。在管理层提供经审计的收入结构、毛利率、烧钱速度、可用现金及与里程碑挂钩的招聘计划前，融资和扩张执行风险应评为“高影响度、中等发生概率”。另一项高影响度风险是数据安全与隐私：XDOF
              的官方政策承认，没有任何数据传输或存储系统能做到绝对安全。风险热力图根据已披露事实和信息缺口排列剩余风险，并不表示安全事故已经发生。
