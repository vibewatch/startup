      - number: '7.4'
        title: 外部依赖、融资脆弱性与逻辑否决触发条件
        blocks:
          - type: paragraph
            body: >-
              公开资料显示，XDOF 依赖少数主要但未具名的客户、线下采集员、技术和分析服务商、高校合作伙伴，以及潜在投资方。据报道，公司约有 20 家客户，其中包括数家前沿 AI
              实验室；但资料没有披露收入集中度、续约条款、生产部署与试点的比例，也没有说明客户是否更换供应商。XDOF 与 UC Berkeley AI Research
              实验室合作开发数据集，但相关证据没有公开知识产权归属、独家性、合作期限或商业化权益。据报道，Series B
              条款仍未敲定，因此高估值融资消息不等于现金已到账或融资确定。以下情况将推翻投资逻辑：主要客户流失且无法及时补上；无法证明数据集来源和采集员知情同意；发生重大安全或生产事故；遭遇不利知识产权诉讼或监管处罚；或融资扩张计划依赖缺乏可信单位经济数据支撑的增长假设。
