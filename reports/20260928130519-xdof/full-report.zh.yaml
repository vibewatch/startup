            body: >-
              XDOF
              正用采集工具、标注系统、机器人遥操作和人体动作捕捉搭建外包数据供应链。业务涉及人员培训、知情同意、任务执行一致性、硬件可用率、标注质量和客户数据安全传输，任何环节出问题都可能影响交付。公开报道显示，公司约有 60
              名员工和 20
              家客户，并计划在全球扩招采集员；运营规模可能比现有内控体系扩张得更快。指定证据没有披露客户身份、合同条款、验收标准、数据集缺陷率、返工率、服务水平或商业保险。真正的否决信号不是偶发的一次质量失误，而是客户反复验收失败、返工增加、重大安全事故，或采集规模增长却没有带来毛利率改善和客户复购。
