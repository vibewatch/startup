chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业定位、公司架构与核心使命
        blocks:
          - type: paragraph
            body: >-
              XDOF, Inc. 于 2024 年 10 月成立，源自加利福尼亚州 Berkeley 的学术研究，主要管理办公室位于加利福尼亚州 San Mateo [CO001,
              CO013]。具身智能发展的核心瓶颈是数据：数字基础模型可利用海量互联网文本和图像，通用实体机器人却缺少真实交互数据 [CO005]。XDOF
              自研低成本遥操作工具和人工标注系统，搭建端到端数据流水线，替机器人制造商和前沿 AI 实验室采集物理数据 [CO005,
              CO006]。公司结合机器人遥操作与第一人称视角穿戴传感器，采集高保真的物理操作示范，帮助前沿实验室训练多任务机器人基础模型，也让它们不必承担自建数据采集设施的高额资本开支 [CO005, CO006]。
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO008
              - CO009
              - CO010
              - CO013
      - number: '1.2'
        title: 创始人背景、技术领导力与公司治理
        blocks:
          - type: paragraph
            body: >-
              XDOF 于 2024 年 10 月成立，由 UC Berkeley 机器人研究者 Philipp Wu、Fred Shentu 联合创办，Nemo Jin 是技术联合创始人 [CO001]。Philipp Wu
              曾在 UC Berkeley 攻读博士，研究机器人如何从大规模示范数据中学习；他认为，缺少开源、多任务的物理操作数据，是具身智能发展的关键障碍 [CO001, CO006]。Wu 与首席技术官 Fred
              Shentu 共同开发了开源、低成本遥操作接口 GELLO，降低了采集灵巧操作轨迹的成本门槛 [CO006]。XDOF 将这项学术成果商业化并继续拓展 [CO006]。但公司尚未披露正式治理架构；XDOF 和
              Series A 投资方都没有公开董事席位分配、独立董事安排或创始人投票权条款，潜在投资者仍需补做重要的治理尽调 [CO014]。
            claimRefs:
              - CO001
              - CO006
              - CO010
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO006
              - CO010
      - number: '1.3'
        title: 股权融资历程、估值演进与资方财团
        blocks:
          - type: paragraph
            body: >-
              XDOF 一直低调研发，直到 2026 年 6 月 17 日才宣布完成 $70 million Series A；这是目前公开记录中公司唯一一轮机构股权融资 [CO002]。本轮投资方包括 Thrive
              Capital、Andreessen Horowitz (a16z)、Lux Capital、Spark Capital 和 WndrCo [CO003]。独立风投分析指出，5
              家一线机构共同参与首轮融资也带来后续融资风险：没有哪一家持有主导性股权，也没有单一投资方承担确保后续资金到位的受托责任 [CO011]。公开亮相后不到 3 个月，风投机构的兴趣便推动 XDOF 进入 Series
              B 后期谈判；拟议估值约 $1.2 billion，由 8VC 领投 [CO004]。但截至 2026 年 9 月，交易尚未完成，条款仍在谈判；在商业指标得到验证前，估值仍可能大幅波动 [CO004,
              CO014]。
            claimRefs:
              - CO002
              - CO003
              - CO004
              - CO011
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO002
              - CO003
              - CO011
              - CO014
      - number: '1.4'
        title: 运营里程碑、数据集分发与业务规模
        blocks:
          - type: paragraph
            body: >-
              2026 年 6 月公开亮相后，XDOF 与 UC Berkeley AI Research 实验室联合发布开源操作数据集 ABC-130K，收录 195 项双臂操作任务、超过 130,000
              条轨迹，提升了公司在具身智能社区的技术公信力 [CO007]。公司称，发布初期约有 20 家活跃付费客户，其中包括数家未具名的前沿 AI 实验室 [CO008]。据报道，截至 2026 年 9
              月，公司年化收入运行率接近 $50 million，核心团队约 60 人 [CO009, CO010]。为承接增长的客户需求，XDOF 已在北美、拉美和东南亚招聘，扩充远程遥操作员及现场数据采集员队伍
              [CO010]。
            claimRefs:
              - CO002
              - CO004
              - CO007
              - CO008
              - CO009
              - CO010
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO006
              - CO007
              - CO008
              - CO010
              - CO013
      - number: '1.5'
        title: 尽调评估、治理风险与未决缺口
        blocks:
          - type: paragraph
            body: >-
              XDOF 位于基础模型与实体机器人发展的交汇点，战略位置有利，但仍有几项重要尽调问题待解 [CO009, CO012]。最突出的是，据报道接近 $50 million 的年化收入只是第三方媒体估算，尚无经审计的
              GAAP 财务数据、客户留存率或毛利率披露 [CO009]。公司需要在全球管理分散的遥操作员和硬件传感器，运营成本负担沉重；若定价能力减弱，单位经济效益可能恶化 [CO011,
              CO012]。此外，董事会治理、投票权安排和领投方后续出资承诺都不透明；评估后期股权估值倍数前，投资者必须完成法律核查 [CO011, CO014]。
            claimRefs:
              - CO009
              - CO011
              - CO012
              - CO014
      - number: '1.6'
        title: 重点图表
        blocks:
          - type: callout
            title: 具身基座模型的外包型物理数据层
            body: 软件大语言模型可以依靠公开互联网文本扩展，具身机器人 AI 却缺少物理交互数据。XDOF 将自己定位为物理世界的 Scale AI，结合低成本遥操作硬件和分布式操作员网络，为前沿 AI 实验室采集高保真操作数据。
            calloutType: insight
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO007
          - type: callout
            title: 多家投资方带来的治理复杂性与运营开支
            body: >-
              XDOF 的 $70 million Series A 由 5
              家知名风投共同投资，但没有披露哪家机构持股占主导并领投。股权分散使治理更复杂，也没有单一机构承担确保后续融资到位的受托责任。同时，全球扩张人工遥操作团队会持续推高运营开支，公司必须尽快把客户需求转化为收入。
            calloutType: risk
            claimRefs:
              - CO002
              - CO003
              - CO011
              - CO012
              - CO014
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 具身智能基础设施与市场边界界定
        blocks:
          - type: paragraph
            body: >-
              物理交互基础模型兴起，正在改变商用机器人软件市场。前沿 AI
              实验室擅长训练网络规模的数字语言模型，但实体机器人需要密集、多模态的交互数据，公开互联网无法提供这类数据。这也划定了具身智能数据基础设施的市场范围：外包遥操作系统、第一人称人体传感器数据流，以及标准化操作轨迹标注。通用文本抓取、传统机器人硬件制造和确定性工业可编程逻辑控制器（PLC）工程不在其中。XDOF
              等专业供应商为实体机器人搭建端到端数据供应链，让基础 AI 实验室和人形机器人开发商不必投入大量资金、精力自建物理数据采集体系。
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM009
      - number: '2.2'
        title: 不同口径下的可触达市场规模
        blocks:
          - type: paragraph
            body: >-
              估算物理机器人训练基础设施的市场，不能把宏观预测和企业眼下的实际预算混为一谈。自上而下的预测认为，未来 10 年，随着人形和服务机器人进入商业物流与消费场景，更广义的具身 AI 训练和自动化市场可能扩大至
              $12.5B 至 $18.0B。近期尽调则应聚焦规模较小的可服务市场（SAM）：$1.8B 至 $2.5B，代表前沿 AI
              实验室和资金充足的机器人基础模型团队当前的数据采购预算。近期可获取市场（SOM）的年化合同需求约为 $150M 至 $250M。据报道，XDOF 公开亮相后 3 个月内，年化收入运行率就接近 $50
              million，显示其迅速拿下客户预算；但投资者仍需衡量巨额首轮融资带来的高估值门槛。
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM011
              - CM014
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM008
              - CM014
              - CM016
      - number: '2.3'
        title: 客户类型、采购决策与预算来源
        blocks:
          - type: paragraph
            body: >-
              专业物理数据采集的主要买家有两类：前沿 AI 基础模型实验室，以及自主研发人形机器人的企业；工业自动化和物流履约运营商则是新兴的次级客群。实验室通常由具身智能负责人（Head of Physical
              AI）或研究副总裁（VP of Research）推动采购，使用集中管理的基础模型研发与训练预算。商用人形机器人开发商的预算通常由工程副总裁（VP of Engineering）或自主系统副总裁（VP of
              Autonomy）掌握；他们希望加快灵巧操作能力的开发，又不耽误机械硬件进度。合同通常包括多任务轨迹交付许可和持续的平台支持，结合按量交付数据与企业软件订阅。合作能否深入，还取决于服务等级协议（SLA）能否保证交付、传感器标定是否严格，以及任务规格能否适配客户各自的机器人构型。
            claimRefs:
              - CM002
              - CM003
              - CM009
              - CM010
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM013
      - number: '2.4'
        title: 采用驱动力、结构性瓶颈与尽调风险
        blocks:
          - type: paragraph
            body: >-
              高质量物理操作数据极度稀缺，是通用人形机器人落地面临的最大技术障碍，也推动了市场需求。但行业顺风并不能消除落地约束和尽调风险。Altis
              的独立研究指出，一些企业买家认为第三方遥操作数据不如内部采集的数据，也认为不同采集服务商之间切换成本不高。扩大物理数据采集还要管理庞大的分布式操作员队伍；在拉美和东南亚设点会增加运营复杂度、硬件维护开支和跨国用工管理难度。Mecka
              AI、Encord 等资金充足的对手正在进入，Scale AI 等数字标注龙头也在跨界扩张。若 XDOF 建不成专有的数据质量和合成能力壁垒，标准化示范采集就可能陷入低价竞争。
            claimRefs:
              - CM001
              - CM007
              - CM011
              - CM012
              - CM015
      - number: '2.5'
        title: 重点图表
        blocks:
          - type: callout
            title: 物理世界训练数据短缺
            body: 软件大语言模型可以爬取公开互联网文本扩展训练数据，具身机器人则需要在真实环境中采集物理操作示范。这种差异催生了对专业遥操作和传感器采集网络的迫切需求。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM005
          - type: callout
            title: 买方质量认知与有限转换成本
            body: 早期前沿 AI 团队有意外包物理数据采集，但买家访谈显示，供应商之间切换成本不高；客户也在持续检验外包遥操作轨迹能否达到自建实验室采集数据的保真度。
            calloutType: risk
            claimRefs:
              - CM007
              - CM011
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局总览与同业分层
        blocks:
          - type: paragraph
            body: >-
              XDOF 面对三类竞争者：具身智能数据服务商、数字人工数据标注龙头，以及前沿 AI 实验室的内部采集团队。Mecka AI、Encord 等初创公司专攻机器人数据流水线和多模态标注。Scale AI（2024
              年以 $13.8 billion 估值融资 $1 billion）、Micro1 等数字数据标注公司资金雄厚，也在从大语言模型数据拓展至实体机器人场景。风投支持的人才平台 Mercor 据报道在 2025
              年底估值达到 $10 billion，反映投资者对人工数据众包的兴趣。对 XDOF 威胁最大的替代方案仍是基础模型开发者自己采集数据：这些团队通常先部署自有遥操作设备，再评估外部数据供应商。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP009
              - CP011
              - CP012
      - number: '3.2'
        title: 技术能力矩阵与数据采集差异化
        blocks:
          - type: paragraph
            body: >-
              具身智能模型需要结构化的真实交互数据，公开网络上无法抓取。XDOF 的差异化来自 UC Berkeley GELLO
              项目：公司把低成本遥操作机械臂与人体第一人称穿戴传感器结合起来，采集日常居家操作数据。这套技术也支撑了 XDOF 与 UC Berkeley AI 研究实验室联合发布 ABC-130K，收录 195
              项双臂操作任务、超过 130,000 条轨迹。数字数据标注龙头则主要提供文本和视觉标注软件，没有整合硬件遥操作。为维持数据产能，XDOF
              在美国、墨西哥和印度尼西亚运营跨国采集与视频审核网络，并执行结构化质控；规模较小的同类初创公司仍主要在本地运营。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP007
              - CP008
              - CP012
      - number: '3.3'
        title: 销售组合与单位经济
        blocks:
          - type: paragraph
            body: >-
              机器人数据服务通常采用高客单价企业合同，而非标准化的自助订阅。据报道，2026 年年中 XDOF 约有 20 家客户，年化收入接近 $50 million；据此推算，前沿 AI
              实验室客户的平均年合同额（ACV）约为 $2.5
              million。公司通过企业直销打包销售软件许可、硬件和持续支持服务，并按功能和轨迹复杂度分级定价。前沿实验室外包数据供应链，可省去招聘、管理全球遥操作团队所需的高额资本开支和运营精力。不过，客户仍高度集中；单条轨迹或每小时遥操作的单位经济效益，则取决于定制谈判的企业主服务协议（MSA）。
            claimRefs:
              - CP009
              - CP010
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
              - CP009
              - CP010
              - CP012
      - number: '3.4'
        title: 护城河能否持久
        blocks:
          - type: paragraph
            body: >-
              XDOF
              能否守住长期护城河，取决于能否提高现场采集效率，同时抵御服务商品化。行业分析师的独立专家访谈显示，前沿实验室会确保不同供应商的数据可以互通，因此更换机器人数据流水线的成本不高。资金充足的传统标注巨头也有能力借助雄厚资产负债表和现成的大客户采购渠道，在需求成熟时迅速进入物理数据采集市场。XDOF
              凭借 Berkeley 学术渊源和早期进入前沿实验室取得先发优势，但基础模型开发者也可能扩大合成数据模拟，用来补充遥操作示范。要保持差异化，XDOF
              必须持续提供高质量轨迹、自研第一人称传感器采集工具，并签下有保护力的企业级服务协议。
