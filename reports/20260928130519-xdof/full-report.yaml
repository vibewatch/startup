      - number: '7.2'
        title: Legal, regulatory, and security controls
        blocks:
          - type: paragraph
            body: >-
              XDOF's published privacy policy is the only primary legal-control artifact in the assigned evidence. It
              covers website and communications data, describes California rights, identifies a general counsel,
              security contact, and data protection officer, and contemplates transfers outside a visitor's home
              jurisdiction. These are meaningful policy-level mitigations, but they do not evidence operating
              effectiveness, customer-data controls, workforce consent practices, contractual data-processing terms,
              insurance, certifications, or regulatory approvals. The policy also allows disclosures to service
              providers and certain business partners, expanding the vendor-control surface. No inference of clean
              incident or litigation history is warranted: the available source pool contains no regulator record, court
              record, status history, certification report, or incident register. Investment approval should require
              those primary materials rather than treating policy publication as control validation.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
