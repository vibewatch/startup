              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not equate financing with runway
            body: >-
              The $70 million Series A is funding raised, not verified cash available; require current cash, burn,
              commitments, working-capital needs, and financing terms before sizing runway.
            calloutType: risk
            claimRefs:
