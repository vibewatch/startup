        title: Exhibits
        blocks:
          - type: callout
            title: Commercial proof remains anonymized
            body: >-
              A roughly 20-customer count and reported annualized revenue do not reveal named production deployments,
              renewal behavior, outcomes, or the revenue share of the largest accounts.
            calloutType: risk
            claimRefs:
              - CU004
              - CU005
