  - id: FM001
    title: Physical Robotics Data Infrastructure Market Sizing Pyramid
    type: pyramid
    summary: >-
      Constrained bottom-up sizing layers for physical AI data infrastructure, spanning macroeconomic robotics
      automation down to immediate serviceable teleoperation revenue.
    approximationNotes: >-
      Top-level TAM represents macroeconomic projections for physical AI training data; intermediate SAM and SOM layers
      reflect bottom-up calculations based on active research teams and average contract values.
    claimRefs:
      - CM004
      - CM008
      - CM014
      - CM016
    data:
      items:
        - label: Macro Physical AI Market (TAM)
          value: $18.0B
          detail: Long-term global spend across embodied AI foundation models, industrial robotics, and consumer automation.
          tone: neutral
        - label: Robotics Training Infrastructure (SAM)
          value: $2.5B
          detail: >-
            Near-term addressable market for specialized physical data collection, teleoperation tooling, and sensor
            pipelines.
          tone: opportunity
        - label: Frontier Lab Data Outsourcing (SOM)
          value: $250M
          detail: >-
            Immediate serviceable enterprise opportunity across ~50 active frontier AI labs and humanoid robotics
            developers.
          tone: positive
        - label: Multi-Task Trajectory Datasets
          value: $120M
          detail: High-value manipulation dataset segment, exemplified by dense multi-angle bimanual task libraries.
          tone: neutral
        - label: Global Human Teleoperation Network
          value: $80M
          detail: Distributed network operations for real-time remote robot piloting and egocentric sensor demonstration.
          tone: warning
        - label: XDOF Current Run-Rate Position
          value: $50M
          detail: Reported annualized revenue run-rate across ~20 enterprise customer accounts as of Q3 2026.
          tone: positive
  - id: FP001
    title: 'Strategic Positioning: Physical Robotics Specialization vs Data Infrastructure Scale'
    type: quadrant
    summary: >-
      Evaluation of physical AI data providers, digital labeling incumbents, and internal alternatives across physical
      hardware specialization and data infrastructure scale.
    data:
