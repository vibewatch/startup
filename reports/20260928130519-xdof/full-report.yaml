  - id: FE001
    title: Evidence-backed robotics-data delivery stack
    type: stack
    summary: >-
      The public evidence describes a vertically integrated path from task definition through physical collection, data
      operations, delivery, and evaluation, with ABC-130K as the clearest disclosed output.
    data:
      layers:
        - label: 1. Customer task definition
          detail: Translate target tasks, robot embodiment, data format, and acceptance needs into delivery specifications.
          items:
            - label: Requirements and sequencing
              note: Described in customer-delivery job reposts; no public cycle-time metric.
        - label: 2. Physical demonstration
          detail: Collect target-robot, lower-cost teleoperation, or egocentric human-motion data.
          items:
            - label: Robots, sensors, operators, and venues
              note: Collection modes are reported; sensor and hardware specifications remain undisclosed.
        - label: 3. Ingestion and orchestration
          detail: Move recorded data into processing, storage, and researcher workflows.
          items:
            - label: Compute, pipelines, and multi-tenant storage
              note: Scope comes from hiring text rather than an independently tested production system.
        - label: 4. Annotation and quality control
          detail: Apply annotation, audit guidelines, scoring, calibration, and root-cause analysis.
          items:
            - label: Quality standards and corrective loops
              note: No public distribution of error, rework, or customer-acceptance rates.
        - label: 5. Dataset delivery and tooling
          detail: Provide datasets, visualizers, exploration tools, and customer-facing issue resolution.
          items:
            - label: Self-serve and managed delivery
              note: Availability, packaging, API surface, and realized service levels are not public.
        - label: 6. Evaluation and feedback
          detail: Use model evaluation and customer feedback to target subsequent collection and improvement.
          items:
            - label: ABC-130K proof point
              note: Independent sources report 130,000-plus trajectories or episodes across 195 tasks.
    approximationNotes: >-
      This is a synthesis of disclosed workflow components, not a verified internal systems diagram; sequence does not
      imply measured latency or production readiness.
    claimRefs:
      - CE002
      - CE004
      - CE009
      - CE010
      - CE011
  - id: FU001
    title: Customer journey and unverified expansion loop
    type: journey-map
    summary: >-
      Reported delivery steps lead to plausible account expansion, but public evidence stops before renewal or
      concentration proof.
    data:
      items:
        - label: 1. Data bottleneck
          detail: A frontier lab or robotics developer lacks sufficient physical-world training data.
          touchpoints:
            - Research and robotics teams
        - label: 2. Enterprise qualification
          detail: The buyer evaluates outsourced collection tools, pipelines, and annotation.
          touchpoints:
            - Technical evaluation
            - Procurement
        - label: 3. Collection design
          detail: Tasks and collection methods are configured for the customer's model-development needs.
          touchpoints:
            - Teleoperation
            - Sensor-based human collection
        - label: 4. Data production
          detail: Human operators and robotic systems generate physical-world demonstrations.
          touchpoints:
            - Operator network
            - Robotic systems
        - label: 5. Annotation and delivery
          detail: Collected data moves through annotation and customer-facing data infrastructure.
          touchpoints:
            - Annotation systems
            - Data pipelines
        - label: 6. Expansion or renewal
          detail: Long-term service and software-update structures could support expansion, but no renewal evidence is public.
          touchpoints:
            - Service relationship
            - Software updates
    approximationNotes: >-
      Stages 1-5 synthesize reported workflow elements; stage 6 is a potential mechanism, not a verified conversion or
      renewal sequence.
    claimRefs:
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Analytical placement of material exposures by impact and likelihood, preserving unknowns where the assigned
      evidence cannot support a probability estimate.
    data:
      columns:
        - id: low-likelihood
          label: Low likelihood
        - id: medium-likelihood
          label: Medium likelihood
        - id: high-or-unknown-likelihood
          label: High or unknown likelihood
      rows:
        - label: Critical impact
          values:
            - label: No risk placed
              detail: No assigned evidence supports a low-likelihood classification here.
            - label: Financing and scale execution
              detail: Fast fundraising, hiring, and collector-network expansion must convert into durable economics.
            - label: Security or privacy control failure
              detail: Impact is critical; probability is unknown without audits, certifications, and incident records.
        - label: High impact
          values:
            - label: No risk placed
              detail: No assigned evidence supports a low-likelihood classification here.
            - label: Collector quality and pipeline reliability
              detail: Human-intensive collection and annotation create scaling and consistency dependencies.
            - label: Customer concentration
              detail: Roughly 20 customers are reported, but revenue shares and contract durability are unavailable.
        - label: Medium-high impact
          values:
            - label: Research-partner continuity
              detail: Collaboration is reported, but ownership and commercialization terms are unavailable.
            - label: Competitive compression
              detail: Tracxn lists 46 active competitors, including 19 funded competitors.
            - label: Vendor and subprocessor dependency
              detail: Providers are acknowledged, but the inventory and criticality are not disclosed.
        - label: Medium impact
          values:
            - label: No risk placed
              detail: No assigned evidence supports a low-likelihood classification here.
            - label: Valuation-expectation pressure
              detail: Reported financing discussions raise milestone expectations, but the terms remain non-final.
            - label: No risk placed
              detail: No assigned evidence supports a high-likelihood classification at this impact level.
        - label: Low impact
          values:
            - label: No risk placed
              detail: No material risk is classified as both low impact and low likelihood.
            - label: No risk placed
              detail: No material risk is classified as low impact and medium likelihood.
            - label: No risk placed
              detail: No material risk is classified as low impact and high likelihood.
        - label: Impact not quantifiable
          values:
            - label: No risk placed
              detail: The evidence does not justify a low-likelihood estimate for unquantified exposure.
            - label: No risk placed
              detail: The evidence does not justify a medium-likelihood estimate for unquantified exposure.
            - label: Legal, incident, and certification history
              detail: Primary records are absent, so impact and probability remain unquantified diligence gaps.
    approximationNotes: >-
      Qualitative placement only; no incident frequencies, loss distributions, audited concentration, or company risk
      scores were available.
    claimRefs:
      - CR002
      - CR003
      - CR007
      - CR009
      - CR010
      - CR012
      - CR015
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Sequential logic chain connecting physical data market bottlenecks, revenue scaling, labor cost overhang, and
      valuation multiple to the final track recommendation.
    data:
      nodes:
        - id: n1
          label: Physical Data Bottleneck
          description: Frontier AI labs lack internet-scale real-world robotic demonstration data
        - id: n2
          label: Rapid Revenue Run-Rate
          description: Annualized revenue approaching $50M across 20 lab customers drives VC demand
        - id: n3
          label: Teleoperation Labor Overhead
          description: Human teleoperators and 60+ headcount drive continuous capital burn
        - id: n4
          label: Syndicate Financing Structure
          description: Multi-fund allocation leaves no single backer fully responsible for follow-ons
        - id: n5
          label: Stretched Valuation Multiple
          description: Rumored $1.2B Series B target implies ~24x multiple on early revenue
        - id: n6
          label: 'Decision: Track / Hold'
          description: Withhold investment at unverified price pending audited gross margin and churn data
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
    claimRefs:
      - CV008
      - CV010
      - CV011
      - CV014
