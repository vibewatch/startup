      - number: '7.3'
        title: Operating-model and quality exposure
        blocks:
          - type: paragraph
            body: >-
              XDOF is building an outsourced data supply chain with collection tools, annotation systems, remote robot
              operation, and human motion capture. That model creates linked risks in worker training, consent, task
              consistency, hardware uptime, annotation quality, and secure transfer of customer data. Public reports
              place the organization at roughly 60 employees and about 20 customers, while XDOF plans to expand
              collectors globally; the operating span may therefore grow faster than the disclosed control base.
              Customer identities, contract terms, acceptance criteria, dataset defect rates, rework, service levels,
              and insurance are not available in the assigned evidence. The kill criterion is not one isolated quality
              miss but a pattern of failed customer acceptance, rising rework, material safety events, or collection
              growth that does not produce improving gross margin and repeat orders.
            claimRefs:
              - CR003
              - CR009
              - CR010
              - CR011
              - CR012
