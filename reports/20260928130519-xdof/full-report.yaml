        - label: XDOF
          x: 8.5
          'y': 7
          description: High physical robotics teleoperation specialization with rapidly expanding dedicated data infrastructure.
        - label: Scale AI
          x: 3
          'y': 9.5
          description: >-
            Massive digital data platform scale and enterprise balance sheet, but lower physical hardware teleoperation
            depth.
        - label: Mecka AI
          x: 8
          'y': 4
          description: Dedicated focus on real-world robotics data collection, operating at earlier venture funding scale.
        - label: Encord
          x: 5
          'y': 5.5
          description: Multimodal AI data annotation tooling expanding into physical AI workloads with $60M venture backing.
        - label: Micro1
          x: 2.5
          'y': 6
