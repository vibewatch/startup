      - number: '6.3'
        title: Durability, Expansion, and Concentration
        blocks:
          - type: paragraph
            body: >-
              Public evidence describes plausible expansion surfaces but not proven expansion. Preqin says XDOF combines
              direct system sales, software licenses, long-term service relationships, and software-update
              subscriptions. Tech Funding News describes delivery through teleoperation, human collectors, and
              annotation systems, with plans to expand the operator network globally. Those activities could deepen an
              account as data needs broaden, but no retained source reports renewal rates, contract duration, GRR, NRR,
              churn, cohort behavior, or expansion revenue. Nor does the roughly 20-customer count reveal the revenue
              share of the largest accounts. Tech Funding News explicitly leaves scaling of the collection model as an
              open question, while a fundraising analysis warns that the large first round creates milestones rather
              than customer validation. Durability and concentration therefore remain material underwriting gaps.
            claimRefs:
