              - CR012
              - CR014
              - CR016
      - number: '7.4'
        title: Dependencies, financing, and thesis-breaks
        blocks:
          - type: paragraph
            body: >-
              The disclosed dependency map is concentrated around a small, mostly unnamed customer base, human
              collectors, technology and analytics providers, a university research relationship, and prospective
              capital providers. Reporting says XDOF works with about 20 customers including several frontier AI labs,
              but the evidence does not disclose revenue concentration, renewal terms, production-versus-pilot mix, or
              switching behavior. The UC Berkeley AI Research Lab relationship supports dataset development, yet
              ownership, exclusivity, continuity, and commercialization rights are not public in this pool. Proposed
              Series B terms were reported as non-final, so valuation headlines should not be treated as cash on hand or
              financing certainty. Thesis-break triggers are loss of a major customer without replacement, inability to
              document dataset provenance and worker consent, a material security or safety event, adverse IP or
              regulatory findings, or a financing plan that requires growth without credible unit-economics evidence.
            claimRefs:
