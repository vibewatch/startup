              - CI007
      - number: '4.2'
        title: Commercial Traction, Customer Concentration, and Information Asymmetry
        blocks:
          - type: paragraph
            body: >-
              Public reporting indicates that XDOF achieved annualized revenue approaching $50 million by September
              2026, roughly three months after emerging from stealth. This run-rate expansion is concentrated across
              approximately 20 active customer accounts, implying an average annualized contract value near $2.5
              million. While this rapid adoption validates urgent industry demand for real-world physical manipulation
              training datasets, it creates significant account concentration risk. Because a small cohort of frontier
              AI labs accounts for the vast majority of billings, single-customer non-renewals, insourcing decisions, or
              research roadmap pivots represent immediate threats to top-line stability. Private financial statements,
              detailed net revenue retention figures, and renewal cohorts remain undisclosed.
            claimRefs:
              - CI005
              - CI006
              - CI009
              - CI015
      - number: '4.3'
        title: Cost Structure, Variable Labor Intensity, and Unit Economic Drag
        blocks:
          - type: paragraph
            body: >-
              Unlike pure-play foundational model or software businesses that benefit from near-zero marginal
              distribution costs, XDOF operates a highly labor-intensive physical data supply chain. Data generation
              requires human teleoperators remotely maneuvering GELLO robotic arms alongside sensor-equipped collectors
              performing manual physical tasks. Consequently, operating expenditures scale in near-linear proportion to
              data collection volume. Operational postings confirm active hiring for international data collection and
              video quality audit hubs in low-cost jurisdictions such as Indonesia and Mexico. While geographic labor
              arbitrage mitigates raw headcount expenditures, teleoperation hardware maintenance, high-throughput cloud
              compute ingestion, and quality control auditing compress gross margins below standard software thresholds.
            claimRefs:
              - CI004
              - CI008
              - CI012
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI008
              - CI015
          - type: figure
            figureRef: FI001
            claimRefs:
