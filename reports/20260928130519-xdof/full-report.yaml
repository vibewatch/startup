              - CI009
              - CI012
      - number: '4.4'
        title: Capital Adequacy, Cash Burn Trajectory, and Valuation Sustainability
        blocks:
          - type: paragraph
            body: >-
              XDOF raised $70 million in June 2026 Series A funding backed by Thrive Capital, Andreessen Horowitz, Lux
              Capital, and Spark Capital, establishing its primary balance sheet reserves. Rapid revenue growth prompted
              unsolicited inbound term sheet discussions, with 8VC reportedly leading late-stage negotiations for a
              Series B financing round valuing XDOF at approximately $1.2 billion. At ~$50 million in annualized
              revenue, this proposed valuation represents a rich revenue multiple in the mid-20s. Sustaining this
              multiple requires underwriting XDOF not as a cyclical human-in-the-loop services vendor, but as an
              indispensable proprietary data infrastructure monopoly. Cash runway appears adequate following the Series
              A round, yet sustained global facility expansion will drive elevated capital intensity.
            claimRefs:
              - CI007
              - CI010
              - CI011
              - CI013
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Linear Cost Scaling in Human Data Acquisition
            body: >-
              Unlike pure-play foundational model or enterprise software businesses, XDOF's data supply chain relies
              directly on human operators piloting hardware rigs and wearing motion-capture sensors. Because labor and
              hardware deployment costs scale linearly with collection volume, gross margins face persistent structural
              compression relative to standard SaaS profiles.
            calloutType: risk
            claimRefs:
              - CI008
              - CI012
          - type: callout
            title: Valuation Sensitivity to Extreme Customer Concentration
            body: >-
              Negotiating a Series B at a $1.2 billion valuation against ~$50 million in annualized revenue yields a
              mid-20s multiple. With roughly 20 customers total, a defection or in-sourcing move by even two or three
              anchor frontier AI labs could destabilize cash inflows and impair the revenue base.
            calloutType: insight
            claimRefs:
              - CI005
              - CI006
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: A robotics-data product, not a single robot SKU
        blocks:
          - type: paragraph
            body: >-
              The clearest public description of XDOF is a managed data system for physical AI rather than a finished
              general-purpose robot. Independent reporting consistently places remote robot teleoperation, human-worn
              sensors, annotation, and evaluation inside the delivery workflow. One account further describes three
              collection tiers: demonstrations on a customer's target robot, lower-cost teleoperated systems for more
              general data, and egocentric capture of people performing everyday tasks. Job reposts indicate a parallel
              product surface for self-serve data acquisition and dataset exploration, while a humanoid-engineering role
              suggests XDOF is also developing robotics hardware and control capability. A Preqin profile goes further
              and characterizes XDOF as selling robotics systems and foundation models for household and industrial
              tasks, but that description is not corroborated by the stronger workflow reporting. Those hiring
              specifications show intended work, not a verified catalog of generally available products, so maturity and
              commercial packaging remain open diligence items.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
              - CE015
          - type: table
            tableRef: TE001
            claimRefs:
              - CE002
              - CE003
              - CE006
              - CE015
      - number: '5.2'
        title: The operating model joins physical collection to data delivery
        blocks:
          - type: paragraph
            body: >-
              XDOF's proposed value is the integration of physical operations and data infrastructure. Public
              descriptions begin with a customer's training need, move through robot or human demonstrations, and
              continue into ingestion, annotation, quality control, dataset tooling, delivery, and evaluation. Current
              role descriptions call for coordination across data operations, engineering, algorithms, and annotation,
              with explicit responsibility for accuracy, schedules, service levels, costs, and issue resolution. They
              also describe field teams that deploy and maintain hardware and convert operational learning into standard
              procedures. This is evidence of the operating design, not evidence that published service levels are being
              achieved; no uptime history, delivery-quality distribution, or customer acceptance data appears in the
              assigned public evidence.
            claimRefs:
              - CE001
              - CE004
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE004
              - CE007
              - CE009
      - number: '5.3'
        title: Data infrastructure breadth is visible; production scale is not
        blocks:
          - type: paragraph
            body: >-
              The technical surface described in hiring materials includes computation at ingestion, orchestration,
              internal researcher workflows, multi-tenant data-lake management, large-scale warehouse tooling, backend
              pipelines, visualizers, and hardware-to-cloud integration. The ABC-130K release is the strongest public
              artifact connected to the thesis: independent accounts report at least 130,000 bimanual manipulation
              episodes or trajectories across 195 tasks, while one detailed account also describes released training
              code, models, simulation infrastructure, and evaluation resources. That demonstrates an ability to
              assemble and expose a substantial research dataset. It does not validate the advertised exabyte-scale
              infrastructure ambition, tenant isolation, production latency, or model-performance uplift for paying
              customers.
            claimRefs:
              - CE004
              - CE005
              - CE009
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE005
              - CE008
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE004
              - CE009
              - CE010
              - CE011
      - number: '5.4'
        title: Differentiation depends on execution, data quality, and trust
        blocks:
          - type: paragraph
            body: >-
              The defensible core, if it develops, is likely the feedback loop between collection hardware, operational
              protocols, annotation, and evaluation, reinforced by the founders' reported GELLO teleoperation work. The
              same model carries material execution risk: physical collection requires equipment, trained operators,
              calibration, maintenance, and consistent quality across sites, while sophisticated customers may choose to
              keep strategically important data operations in-house. The only direct trust document in the assigned pool
              is XDOF's website privacy policy. It describes safeguards and rights for website and communications data,
              but does not establish controls for robot telemetry, customer datasets, model artifacts, access isolation,
              incident response, or certifications. No absence-of-incident conclusion is therefore supportable.
            claimRefs:
              - CE008
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: A tangible research-scale proof point
            body: >-
              ABC-130K gives XDOF a more concrete technical artifact than a purely conceptual data-infrastructure pitch,
              although its scale does not by itself establish commercial data quality or customer outcomes.
            calloutType: strength
            claimRefs:
              - CE009
              - CE010
          - type: callout
            title: The moat must emerge from repeatable quality, not collection volume alone
            body: >-
              Hardware, operators, venues, calibration, and audits create operational complexity, while customers can
              insource strategically important data. Underwriting therefore requires quality, transferability, and
              delivery economics rather than a raw trajectory count.
            calloutType: risk
            claimRefs:
              - CE008
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments and Buying Context
        blocks:
          - type: paragraph
            body: >-
              XDOF's public positioning and third-party coverage point to an enterprise customer base rather than a
              demonstrated consumer business. Built In's company-issued profile describes XDOF as an infrastructure
              partner to robotics builders, while TechCrunch coverage says its data pipelines, collection tools, and
              annotation systems are intended for frontier AI labs and robotics companies that cannot readily build
              those capabilities themselves. Preqin broadens the stated target set to residential users and businesses
              in manufacturing and logistics, but its profile does not identify a deployment in any of those segments.
              The investable evidence is therefore strongest for frontier labs and robotics developers; the consumer,
              manufacturing, and logistics categories should be treated as asserted targets, not verified customer
              cohorts.
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU008
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU007
      - number: '6.2'
        title: Adoption and Reference Proof
        blocks:
          - type: paragraph
            body: >-
              The clearest adoption metric is approximately 20 customers. TechCrunch reported that XDOF said it was
              working with 20 customers, including several frontier AI labs; Altis separately labels the count at the
              funding announcement as about 20 active paying customers. TechCrunch also reported annualized revenue
              approaching $50 million in September 2026. That figure is annualized revenue, not ARR or audited
              recognized revenue, and the retained sources do not disclose its period, recurring mix, or customer
              denominator. More importantly, no commercial customer is named in the retained evidence. The available
              record supports early demand and paid activity, but it cannot distinguish production deployments from
              pilots, verify customer outcomes, or establish reference quality.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU014
              - CU015
