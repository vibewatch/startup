    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operating Assumptions
      - Valuation / Return Logic
      - Key Risks & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Annualized revenue scales to $100M+; teleoperation network automates into hybrid human-in-the-loop; expands
          from 20 to 60+ frontier labs
        - >-
          $2.5B-$3.0B valuation at next liquidity event; 2.0x-2.5x multiple expansion driven by physical AI category
          leadership
        - Customer insourcing of teleoperation; margin compression below 40%
        - 20%
      - - Base Case
        - >-
          Series B closes at $1.0B-$1.2B; annualized revenue stabilizes at $50M-$65M with 50% gross margins; 20-30
          active enterprise contracts
        - $1.0B-$1.2B holding mark; returns tied to operational execution and steady ARR conversion
        - Lead investor syndicate negotiations stall; hiring to balance burns reserves
        - 55%
      - - Bear Case
        - >-
          Series B fails to close at $1.2B; revenue proves non-recurring project spend; burn on 60+ headcount and
          teleoperators depletes $70M capital
        - Down-round or structured recapitalization at $300M-$500M; severe dilution from senior liquidation preferences
        - Frontier labs shift to simulation/diffusion policies; teleoperation labor costs exhaust cash
        - 25%
    notes: >-
      Scenario probabilities and return logic represent author modeling based on private market robotics comparables,
      assuming $78M historical funding and ~60 employees.
    claimRefs:
      - CV002
      - CV004
      - CV006
      - CV008
      - CV012
