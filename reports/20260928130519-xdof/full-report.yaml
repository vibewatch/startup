chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity, Corporate Structure, and Mission
        blocks:
          - type: paragraph
            body: >-
              XDOF, Inc. is a robotics infrastructure and physical artificial intelligence company founded in October
              2024 and operating with primary executive offices in San Mateo, California, having originated from
              academic research in Berkeley, California [CO001, CO013]. The company addresses the central data
              bottleneck in embodied intelligence: while digital foundation models benefit from massive internet-scale
              text and image archives, general-purpose physical robots lack real-world interaction data [CO005]. XDOF
              builds end-to-end data pipelines, proprietary low-cost teleoperation tooling, and human annotation systems
              designed to serve as an outsourced physical data supply chain for robotics manufacturers and frontier
              artificial intelligence laboratories [CO005, CO006]. By combining remote robot teleoperation with
              egocentric human wearable sensors, XDOF captures rich, high-fidelity demonstrations of physical
              manipulation tasks, enabling frontier labs to train multi-task robotic foundation models without incurring
              the prohibitive capital cost of internal data-collection infrastructure [CO005, CO006].
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO008
              - CO009
              - CO010
              - CO013
      - number: '1.2'
        title: Founders, Technical Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              The company was co-founded by UC Berkeley robotics researchers Philipp Wu and Fred Shentu, alongside
              technical co-founder Nemo Jin, in October 2024 [CO001]. Chief Executive Officer Philipp Wu previously
              researched how physical robots learn from large-scale demonstration datasets as a doctoral researcher at
              UC Berkeley, identifying the lack of open, multi-task physical manipulation data as the critical
              impediment to physical artificial intelligence [CO001, CO006]. Collaborating with Chief Technology Officer
              Fred Shentu, Wu developed GELLO, an open-source, low-cost teleoperation interface that dramatically
              lowered the financial barrier to collecting dexterous manipulation trajectories [CO006]. XDOF
              commercializes and expands upon this academic lineage [CO006]. However, formal institutional governance
              structures remain undisclosed; neither XDOF nor its Series A investors have publicly detailed board seat
              allocations, independent director representation, or founder voting control covenants, representing a
              material governance diligence gap for prospective capital partners [CO014].
            claimRefs:
              - CO001
              - CO006
              - CO010
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO006
              - CO010
      - number: '1.3'
        title: Capitalization History, Valuation, and Investor Syndicate
        blocks:
          - type: paragraph
            body: >-
              XDOF operated in stealth until June 17, 2026, when it announced a $70 million Series A financing round
              that constitutes its entire documented institutional equity capital to date [CO002]. The round brought
              together a prominent syndicate of venture capital funds, including Thrive Capital, Andreessen Horowitz
              (a16z), Lux Capital, Spark Capital, and WndrCo [CO003]. Independent venture analysis indicates that
              syndicating five tier-one venture franchises across an initial financing round introduces follow-on
              financing risk: because no single venture investor holds a dominant ownership percentage, no single
              sponsor bears sole fiduciary stewardship to guarantee future capital support [CO011]. Within three months
              of its stealth emergence, venture capital interest propelled XDOF into late-stage talks for a Series B
              financing round at an approximate valuation of $1.2 billion led by 8VC [CO004]. However, this transaction
              remains unclosed as of September 2026, and terms remain subject to negotiation, underscoring the risk of
              valuation volatility ahead of verified commercial metrics [CO004, CO014].
            claimRefs:
              - CO002
              - CO003
              - CO004
              - CO011
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO002
              - CO003
              - CO011
              - CO014
      - number: '1.4'
        title: Operational Milestones, Dataset Distribution, and Scale
        blocks:
          - type: paragraph
            body: >-
              Upon emerging from stealth in June 2026, XDOF released ABC-130K, an open-source manipulation dataset
              developed in partnership with UC Berkeley's AI Research lab comprising over 130,000 trajectories across
              195 bimanual manipulation tasks, establishing the company's technical credibility across the embodied AI
              community [CO007]. Commercial traction materialized rapidly, with XDOF reporting approximately 20 active
              paying customers at its launch, including several unnamed frontier artificial intelligence laboratories
              [CO008]. By September 2026, secondary reports indicated annualized revenue run-rates approaching $50
              million, supported by an expanding core team of roughly 60 employees [CO009, CO010]. To satisfy escalating
              customer demand, XDOF has initiated global recruiting campaigns across North America, Latin America, and
              Southeast Asia to scale networks of remote teleoperators and field data collectors [CO010].
            claimRefs:
              - CO002
              - CO004
              - CO007
              - CO008
              - CO009
              - CO010
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO006
              - CO007
              - CO008
              - CO010
              - CO013
      - number: '1.5'
        title: Diligence Assessment, Governance Risks, and Unresolved Gaps
        blocks:
          - type: paragraph
            body: >-
              From an investment diligence perspective, XDOF presents a compelling strategic position at the
              intersection of foundation model development and physical robotics, yet several critical diligence gaps
              remain unresolved [CO009, CO012]. Most notably, reported annualized revenue figures approaching $50
              million are third-party press estimates that lack audited GAAP verification, customer cohort retention
              metrics, or gross margin disclosures [CO009]. The operational reality of managing distributed human
              teleoperators and hardware sensor fleets worldwide creates heavy structural cost exposure that could erode
              unit economics if pricing power softens [CO011, CO012]. Furthermore, the complete opacity surrounding
              board governance, voting rights, and lead investor commitment necessitates confirmatory legal inspection
              before underwriting late-stage equity valuation multiples [CO011, CO014].
            claimRefs:
              - CO009
              - CO011
              - CO012
              - CO014
      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Outsourced Physical Data Layer for Robotics Foundation Models
            body: >-
              Unlike software large language models that scaled on pre-existing public internet text, embodied robotics
              AI faces a severe bottleneck in physical interaction data. XDOF positions itself as the physical
              equivalent of Scale AI, combining low-cost teleoperation hardware with distributed human operators to
              capture high-fidelity manipulation datasets for frontier AI labs.
            calloutType: insight
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO007
          - type: callout
            title: Multi-Party Syndicate Governance and Operational Burn Exposure
            body: >-
              XDOF's $70 million Series A was syndicated across five high-profile venture funds without a single
              disclosed majority lead. This structure creates governance complexity where no individual firm has sole
              stewardship to anchor follow-on capital. Simultaneously, scaling a global workforce of human teleoperators
              introduces heavy recurring operational burn that requires rapid customer monetization to sustain.
            calloutType: risk
            claimRefs:
              - CO002
              - CO003
              - CO011
              - CO012
              - CO014
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Physical AI Infrastructure and Market Boundaries
        blocks:
          - type: paragraph
            body: >-
              The commercial robotics software market is undergoing a structural paradigm shift driven by the rise of
              foundation models for physical interaction. While frontier artificial intelligence laboratories
              established deep expertise in web-scale digital language models, physical robotic systems require dense,
              multi-modal interaction data that cannot be scraped from the public internet. This fundamental constraint
              establishes the market boundary for physical AI data infrastructure: the market comprises outsourced
              teleoperation systems, egocentric human sensor feeds, and standardized manipulation trajectory annotation.
              It explicitly excludes generic text scraping, classical robotic hardware manufacturing, and traditional
              deterministic industrial programmable logic controller (PLC) engineering. By providing an end-to-end data
              supply chain for physical robotics, specialized infrastructure vendors like XDOF enable foundation AI labs
              and humanoid robotics developers to bypass the capital-intensive and operationally grueling process of
              building proprietary physical collection operations.
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM009
      - number: '2.2'
        title: Addressable Market Sizing Across Divergent Lenses
        blocks:
          - type: paragraph
            body: >-
              Evaluating the addressable market for physical robotics training infrastructure requires separating
              speculative macro projections from near-term enterprise spending commitments. Top-down macroeconomic
              forecasts project the broader physical AI training and embodied automation market to expand toward $12.5B
              to $18.0B over the next decade as humanoid and service robots enter commercial logistics and consumer
              environments. However, near-term diligence must anchor on a constrained serviceable addressable market
              (SAM) of $1.8B to $2.5B representing active data acquisition budgets across frontier AI labs and
              well-capitalized robotic foundation teams. At the serviceable obtainable market (SOM) layer, immediate
              annualized contract demand spans approximately $150M to $250M. XDOF's reported trajectory—approaching $50
              million in annualized revenue run-rate within three months of exiting stealth—demonstrates rapid customer
              budget capture, even as investors weigh the valuation multiple hurdles implied by large initial funding
              rounds.
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM011
              - CM014
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM008
              - CM014
              - CM016
      - number: '2.3'
        title: Customer Segmentation, Buyer Personas, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              Customer demand for specialized physical data collection is concentrated across two primary institutional
              cohorts: frontier AI foundation labs and autonomous humanoid robotics manufacturers, alongside an emerging
              secondary cohort of industrial automation and fulfillment operators. Within frontier AI labs, procurement
              is championed by Heads of Physical AI or VPs of Research, drawing upon centralized foundation model
              research and training budgets. For commercial humanoid developers, budget authority sits with VPs of
              Engineering and Autonomy seeking to accelerate dexterous manipulation capabilities without slowing down
              mechanical development cycles. Contracts typically combine multi-task trajectory delivery licenses with
              ongoing platform support, reflecting a blend of consumption-based data delivery and enterprise software
              subscriptions. Commercial relationships depend on guaranteed delivery SLAs, sensor calibration rigor, and
              proprietary task specifications tailored to each buyer's robot embodiment.
            claimRefs:
              - CM002
              - CM003
              - CM009
              - CM010
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM013
      - number: '2.4'
        title: Adoption Drivers, Structural Bottlenecks, and Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              The core growth driver propelling commercial adoption is the severe scarcity of high-quality physical
              manipulation data, which remains the single largest technical barrier to deploying generalist humanoid
              robots. However, critical adoption constraints and diligence risks temper this tailwind. Independent
              sector research from Altis highlights that some enterprise buyers evaluate third-party teleoperation data
              quality below that of internal captures, while also reporting modest switching costs between competing
              collection providers. Furthermore, scaling physical collection infrastructure requires managing extensive
              distributed human operator networks, introducing operational complexity, hardware maintenance overhead,
              and cross-border labor management challenges across global hubs in Latin America and Southeast Asia.
              Finally, the emergence of well-funded competitors such as Mecka AI and Encord, alongside expansion by
              digital annotation incumbents like Scale AI, threatens to commoditize standardized demonstration capture
              unless proprietary data quality and synthesis moats are established.
            claimRefs:
              - CM001
              - CM007
              - CM011
              - CM012
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Physical World Training Data Bottleneck
            body: >-
              Unlike software large language models that scaled by crawling public internet text, embodied robotic
              intelligence requires grounded physical demonstration data that must be captured in real-world
              environments. This dynamic creates an urgent infrastructure market for specialized teleoperation and
              sensor collection networks.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM005
          - type: callout
            title: Buyer Quality Perception and Modest Switching Costs
            body: >-
              While enterprise willingness to outsource physical data collection is strong among early frontier AI
              teams, buyer interviews indicate modest switching costs and ongoing scrutiny regarding whether outsourced
              teleoperation trajectories match the fidelity of internal research lab captures.
            calloutType: risk
            claimRefs:
              - CM007
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Peer Segmentation
        blocks:
          - type: paragraph
            body: >-
              XDOF competes across three distinct categories: specialized physical AI data providers, digital human-data
              incumbents, and in-house collection efforts at frontier AI laboratories. Specialized startups including
              Mecka AI and Encord focus directly on physical robotics data pipelines and multimodal annotation systems.
              Digital data-labeling incumbents such as Scale AI, which raised $1 billion at a $13.8 billion valuation in
              2024, and Micro1 represent heavily capitalized potential entrants expanding beyond large language model
              data into physical embodiment. Additionally, venture-backed talent platform Mercor reached a reported $10
              billion valuation in late 2025, demonstrating massive investor appetite for human data sourcing. However,
              the dominant alternative to XDOF remains internal data collection by foundation model developers who
              initially deploy proprietary teleoperation rigs before evaluating commercial data supply partners.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP009
              - CP011
              - CP012
      - number: '3.2'
        title: Technical Capabilities and Data Collection Differentiation
        blocks:
          - type: paragraph
            body: >-
              Physical AI model training requires structured real-world interaction data that cannot be scraped from the
              public internet. XDOF differentiates through its origins in the UC Berkeley GELLO project, combining
              low-cost remote teleoperation arms with human egocentric body-worn sensors capturing everyday household
              manipulation tasks. This architecture supported the release of the public ABC-130K manipulation dataset in
              partnership with the UC Berkeley AI Research Lab, encompassing over 130,000 trajectories across 195
              bimanual tasks. In contrast, digital data incumbents primarily offer software-based text and vision
              annotation tools lacking hardware teleoperation integration. To maintain data throughput, XDOF operates an
              international data collection and video auditing network across facilities in the United States, Mexico,
              and Indonesia with structured quality control protocols, while competing boutique providers remain
              localized.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP007
              - CP008
              - CP012
      - number: '3.3'
        title: Commercial Packaging and Economic Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Commercial arrangements in the robotics data sector are characterized by high-contract-value enterprise
              partnerships rather than commoditized self-serve subscriptions. XDOF reported annualized revenue
              approaching $50 million from roughly 20 customers in mid-2026, implying an average annual contract value
              of approximately $2.5 million per account across its customer base of frontier AI labs. The company
              packages its offerings through direct enterprise sales, software licensing, hardware units, and ongoing
              support services with tiered pricing based on functionality and trajectory complexity. For frontier labs,
              contracting an external data supply chain avoids significant capital expenditure and operational
              distraction associated with hiring and managing global teleoperator teams. However, customer concentration
              remains elevated, and exact unit economics per trajectory or teleoperator labor hour are governed by
              negotiated enterprise master service agreements.
            claimRefs:
              - CP009
              - CP010
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
              - CP009
              - CP010
              - CP012
      - number: '3.4'
        title: Moat Durability and Positioning Dynamics
        blocks:
          - type: paragraph
            body: >-
              The long-term durability of XDOF's competitive moat depends on balancing operational collection efficiency
              against rapid commoditization risks. Independent expert interviews conducted by sector analysts indicate
              that customer switching costs between robotics data pipelines are modest, as frontier labs preserve data
              interoperability across multi-vendor inputs. Furthermore, well-capitalized labeling incumbents possess
              deep balance sheets and established enterprise procurement relationships that could accelerate physical
              data collection entry if market demand matures. While XDOF maintains a strong technical head start through
              its Berkeley academic pedigree and early frontier lab traction, foundation model developers may also
              expand synthetic data simulations to supplement teleoperated demonstrations. Sustainable differentiation
              will require XDOF to maintain superior trajectory quality, proprietary egocentric sensor capture tooling,
              and defensible enterprise service-level agreements.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP011
              - CP014
