  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation Context and Capital History
        blocks:
          - type: paragraph
            body: >-
              XDOF emerged from stealth in June 2026 having secured a $70.0 million Series A equity financing round
              co-led by Thrive Capital and Spark Capital, alongside Andreessen Horowitz, Lux Capital, and WndrCo. When
              combined with an earlier seed round, the company's total cumulative venture funding stands at
              approximately $78 million. Remarkably, less than three months after its public debut, market reports in
              September 2026 revealed that XDOF entered late-stage discussions to raise a Series B at a valuation of
              approximately $1.2 billion, reportedly led by 8VC. This accelerated financing trajectory was prompted by
              rapid commercial traction, with annualized revenue reportedly approaching $50 million across approximately
              20 enterprise customers, primarily frontier AI research labs and robotics developers. However, the
              proposed transaction terms remain unfinalized, creating uncertainty regarding final pre-money valuation,
              total dilution, and liquidation preference overhang.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV008
              - CV010
      - number: '8.2'
        title: Core Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for XDOF rests on the acute scarcity of physical-world interaction data
              required to train foundation models for robotics and embodied AI. Unlike large language models that
              leveraged billions of tokens from the public internet, general-purpose humanoid robots require
              high-fidelity sensor and trajectory data that must be captured directly from physical environments. By
              commercializing the UC Berkeley GELLO teleoperation architecture and distributing the open-source ABC-130K
              benchmark dataset of 130,000 manipulation episodes, XDOF has established an early lead as the specialized
              data factory for frontier labs. Conversely, the anti-thesis highlights structural operational
              vulnerabilities: collecting physical demonstrations relies on distributed human teleoperators and wearable
              sensor operators, creating a labor-intensive cost structure with modest gross margins compared to pure
              software. Furthermore, large syndicated first rounds create governance risks because distributed ownership
              can dilute lead investor accountability, leaving the company exposed if follow-on financing stalls.
            claimRefs:
              - CV003
              - CV007
              - CV010
              - CV011
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV007
              - CV010
              - CV011
              - CV013
      - number: '8.3'
        title: Scenario Analysis, Comparables, and Return Multiples
        blocks:
          - type: paragraph
            body: >-
              Evaluating XDOF requires rigorous scenario modeling against private market benchmarks in the broader
              artificial intelligence and data infrastructure ecosystem. At a rumored $1.2 billion valuation and an
              unverified $50 million annualized revenue run-rate, XDOF would trade at an implied forward revenue
              multiple of approximately 24x. This multiple commands a premium comparable to high-profile AI
              infrastructure peers such as Scale AI, which achieved a $13.8 billion valuation, and Mercor at $10
              billion, while physical AI peers like Encord have raised $60 million to tackle similar data pipelines. In
              our base case (55% probability), XDOF finalizes its Series B at $1.0B to $1.2B and stabilizes annualized
              revenue between $50M and $65M with 50% gross margins, yielding holding returns tied to execution. In the
              bull case (20% probability), revenue scales to $100M+ as teleoperation achieves semi-autonomous
              efficiency. In the bear case (25% probability), revenue proves to be non-recurring project spend, and
              heavy burn across 60+ employees and global teleoperators forces a structured down-round.
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV008
              - CV009
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV008
              - CV012
      - number: '8.4'
        title: Recommendation Stance, Diligence Asks, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Synthesizing the available evidence leads to a provisional recommendation of Track / Hold with medium
              confidence and a high risk rating. While XDOF's rapid commercial trajectory and top-tier venture backing
              validate the immense market appetite for physical robotics data, entering at an unconfirmed $1.2 billion
              valuation exposes investors to substantial multiple compression and downside risk. Public evidence does
              not yet confirm whether the $50 million revenue run rate reflects durable, recurring ARR or one-off data
              collection campaigns for initial model training runs. Crucial diligence asks include reviewing audited
              customer cohort retention, gross margin economics net of teleoperator compensation, and firm commitment
              letters from prospective Series B leads. Thesis-break triggers that would mandate an immediate Avoid
              stance include customer insourcing of teleoperation data collection, gross margins falling below 35%, or
              failure to secure an institutional lead investor before capital reserves reach a twelve-month runway
              threshold.
            claimRefs:
              - CV008
              - CV010
              - CV011
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV008
              - CV010
              - CV011
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Entry Discipline at Rumored $1.2B Series B Mark
            body: >-
              Entering XDOF at a rumored $1.2 billion valuation implies underwriting a ~24x forward multiple against
              unverified $50 million annualized revenue run-rates. Investors must require verified cohort churn and
              gross margin disclosures before agreeing to pricing.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV006
              - CV008
          - type: callout
            title: Syndicate Dispersion and Capital Burn Velocity
            body: >-
              XDOF's $70 million Series A syndicate features multiple tier-1 institutions with shared ownership. Without
              a clear lead responsible for subsequent capital needs, high operational burn on global teleoperation teams
              risks liquidity stress if Series B negotiations encounter delays.
            calloutType: risk
            claimRefs:
              - CV001
              - CV003
              - CV010
              - CV011
