  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing Tiers, and Commercial Contract Mechanics
        blocks:
          - type: paragraph
            body: >-
              XDOF commercializes physical robotics training infrastructure through a hybrid revenue model combining
              direct equipment sales, software licensing, and ongoing managed data collection services. Customers
              acquire physical teleoperation rigs alongside software subscriptions that provide continuous pipeline
              orchestration, ingestion workflows, and data processing. Pricing is structured in functional tiers, where
              proprietary high-degree-of-freedom manipulation hardware commands substantial premiums over standard
              teleoperation kits. Although commercial messaging targets broad manufacturing, logistics, and residential
              automation markets, enterprise revenue is currently driven by bespoke data generation contracts tailored
              to frontier machine learning research organizations.
            claimRefs:
              - CI001
              - CI002
              - CI003
