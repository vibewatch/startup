              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Physical AI Data Supply Bottleneck Drives Buy-Versus-Build Transition
            body: >-
              Frontier AI labs that previously insourced data collection are shifting toward outsourced physical
              teleoperation partners like XDOF due to the high operational friction and capital intensity of managing
              global sensor-equipped hardware operations.
            calloutType: insight
            claimRefs:
              - CP007
              - CP009
              - CP012
          - type: callout
            title: Modest Switching Costs and Incumbent Capital Threaten Long-Term Pricing Power
            body: >-
              While XDOF has captured early momentum with frontier labs, buyer switching costs remain modest and heavily
              capitalized labeling incumbents such as Scale AI could leverage their software tooling and balance sheets
              to erode third-party margins.
            calloutType: risk
            claimRefs:
