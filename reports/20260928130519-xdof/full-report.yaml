  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              The principal risk is pace mismatch. XDOF reportedly moved from a $70 million Series A to discussions of
              another round within roughly three months while annualized revenue approached $50 million, and it intends
              to expand a worldwide network of teleoperators and sensor-wearing collectors. Those facts indicate demand
              and access to capital, but neither reported annualized revenue nor funding raised establishes recurring
              revenue, cash availability, runway, or operating leverage. The base underwriting posture should therefore
              be high impact and medium likelihood for financing-and-scale execution until management supplies audited
              revenue composition, gross margin, burn, cash, and milestone-linked hiring plans. A second high-impact
              exposure is data security and privacy: XDOF's own policy acknowledges that no transmission or storage
              system is fully secure. The heatmap ranks residual exposure from disclosed facts and gaps; it does not
              assert that an incident has occurred.
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR008
              - CR010
              - CR013
              - CR016
