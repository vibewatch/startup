  title: "Customers"
  summary: "Independent reporting places XDOF at about 20 customers in 2026, including several frontier AI labs, but the retained public evidence names no commercial customer. Reported annualized revenue approaching $50 million signals demand without establishing recurring revenue, retention, or customer concentration."
sections:
  - id: "customer-segments"
    title: "Customer Segments and Buying Context"
    body: >-
      XDOF's public positioning and third-party coverage point to an enterprise
      customer base rather than a demonstrated consumer business. Built In's
      company-issued profile describes XDOF as an infrastructure partner to
      robotics builders, while TechCrunch coverage says its data pipelines,
      collection tools, and annotation systems are intended for frontier AI
      labs and robotics companies that cannot readily build those capabilities
      themselves. Preqin broadens the stated target set to residential users
      and businesses in manufacturing and logistics, but its profile does not
      identify a deployment in any of those segments. The investable evidence
      is therefore strongest for frontier labs and robotics developers; the
      consumer, manufacturing, and logistics categories should be treated as
      asserted targets, not verified customer cohorts.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU007"
      - "CU008"
    tableRefs:
      - "TU001"
  - id: "adoption-and-reference-proof"
    title: "Adoption and Reference Proof"
    body: >-
      The clearest adoption metric is approximately 20 customers. TechCrunch
      reported that XDOF said it was working with 20 customers, including
      several frontier AI labs; Altis separately labels the count at the
      funding announcement as about 20 active paying customers. TechCrunch also
      reported annualized revenue approaching $50 million in September 2026.
      That figure is annualized revenue, not ARR or audited recognized revenue,
      and the retained sources do not disclose its period, recurring mix, or
      customer denominator. More importantly, no commercial customer is named
      in the retained evidence. The available record supports early demand and
      paid activity, but it cannot distinguish production deployments from
      pilots, verify customer outcomes, or establish reference quality.
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU014"
      - "CU015"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "durability-and-expansion"
    title: "Durability, Expansion, and Concentration"
    body: >-
      Public evidence describes plausible expansion surfaces but not proven
      expansion. Preqin says XDOF combines direct system sales, software
      licenses, long-term service relationships, and software-update
      subscriptions. Tech Funding News describes delivery through
      teleoperation, human collectors, and annotation systems, with plans to
      expand the operator network globally. Those activities could deepen an
      account as data needs broaden, but no retained source reports renewal
      rates, contract duration, GRR, NRR, churn, cohort behavior, or expansion
      revenue. Nor does the roughly 20-customer count reveal the revenue share
      of the largest accounts. Tech Funding News explicitly leaves scaling of
      the collection model as an open question, while a fundraising analysis
      warns that the large first round creates milestones rather than customer
      validation. Durability and concentration therefore remain material
      underwriting gaps.
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU016"
    figureRefs:
      - "FU001"
