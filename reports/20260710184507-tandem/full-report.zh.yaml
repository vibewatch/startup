      - number: '1.4'
        title: 规模、牵引力与关键指标
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 5 月更名公告，Forus 已被美国 50 个州的数千家医疗实践和医疗系统使用。此前连续两年，医疗服务方采用量每年同比增长 10x，几乎完全靠口碑，而不是付费营销。Forus 覆盖美国近
              80% 的住宅邮编中的患者，其中包括服务不足社区；这些患者很多是第一次获得专科治疗。


              客户案例显示了平台在多个专科中的实际影响。Goodman Dermatology（10 个地点、35+ 名医疗服务方）称，其他机构拒批过的患者在其平台上常常能在 2-3 天内获批。服务 300+
              家独立诊所的团购组织 MedicoCX，把团队每天打给支付方的电话时间从 60-70% 降到 15% 以下。Digestive Health Specialists 的生物制剂协调员把 PA 处理量从每天约
              5-10 个完整 PA 提高到 15-30 个。Optima Dermatology 清掉了 500+ 项任务积压，现在能在同一天启动所有事先授权。OpenEvidence 每天为美国医生提供超过 1
              million 次临床咨询；2026 年 4 月 2 日，它宣布与 Forus 建立战略合作，把临床决策支持与 Forus 的处方准入自动化整合起来。


              Forus 已连续三次完成 SOC 2 Type II 审计，Sensiba LLP 均出具无保留意见；最近一次覆盖 2025 年 2 月 1 日至 2026 年 1 月 31
              日，范围包括安全性、可用性、处理完整性、保密性和隐私。公司称在纽约市约有 100 名工程师和运营人员。除 Forbes 报道的年化收入估计外，收入、利润率和流失率没有公开披露。
