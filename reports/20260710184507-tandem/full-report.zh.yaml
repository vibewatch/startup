      - number: '8.5'
        title: 附录
        blocks:
          - type: callout
            title: SaaS 与营销服务：决定倍数的问题
            body: >-
              任何 Forus 投资决策最重要的框架问题是：哪套可比框架占主导？如果 Forus 是数据平台 SaaS 业务（65–80% 毛利率、高 NRR、耐久订阅），20x 收入倍数可以实现，$1B 进入价也站得住。如果
              Forus 是生物制药营销服务业务（利润率较低、交易型收入、项目制合作），合适倍数是 5–10x，$1B 标记就明显偏高。解决这个问题需要私有财务尽调，也是整个投资分析里杠杆最高的一个问题。
            calloutType: insight
            claimRefs:
              - CV030
              - CV036
          - type: callout
            title: 倍数压缩先例：Waystar 信号
            body: >-
              Waystar 市值从 2025 年到 2026 年下降 43.5%，说明即便竞争位置强，医疗工作流平台也挡不住倍数压缩。任何以 $1B 进入 Forus
              的买方，都应在熊市情景中建模一个上市可比公司重新定价情景——不是把它当作大概率结果，而是作为一个需要写进交易结构定价的风险参数。
            calloutType: insight
            claimRefs:
              - CV007
              - CV023
