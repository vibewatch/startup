        - id: patient
          label: 患者
          detail: 收到主动短信更新；接入可负担性项目；更快启动治疗
        - id: biopharma
          label: 生物制药合作伙伴
          detail: 为药品上市支持和处方流数据洞察向 Forus 付费；是主要收入来源
      edges:
        - from: physician
          to: forus
          label: EHR 内开具处方
        - from: forus
          to: payer
          label: 自动提交 PA
        - from: payer
          to: forus
          label: 返回批准或拒绝
        - from: forus
          to: pharmacy
          label: 处方最佳路由
        - from: pharmacy
          to: patient
          label: 药物发放
        - from: forus
          to: patient
          label: 短信状态更新
        - from: biopharma
          to: forus
          label: 商业合作与数据访问
