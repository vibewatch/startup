chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >
              Tandem Technology, Inc. 于 2023 年由 Sahir Jaggi 在纽约市创立，2026 年 5 月 12 日前一直以 Tandem 名义运营；当天公司公开更名为 Forus，并正式称为
              "Forus (formerly Tandem)"。隐私政策中的法律实体名称是 "Forus, Inc."。公司的使命是拆掉医生开出处方到患者开始治疗之间的行政障碍，让患者更快用上药。


              核心平台是一个直接嵌入医生 EHR 工作流的 AI 网络。临床医生开出处方后，Forus 自动接单并处理所有下游步骤：判断是否需要事先授权（PA）、生成并向支付方提交 PA
              表单、必要时为患者登记药企援助项目、把处方分流到最合适的药房或专科药房，并通过短信向医生团队和患者同步状态。平台覆盖美国所有药品、支付方和药房，对医疗服务方和患者完全免费。


              收入模式不靠向医疗服务方或患者收费。Forus 通过与生物医药公司的商业合作变现，尤其围绕新药上市支持。Forus
              处在处方决策、支付方规则和药房履约的交汇点，能生成处方流向、获批率和患者依从性的第一方数据；生命科学公司愿意为这些数据付费，用来优化商业化策略。到 2026 年 5 月公告时，全球前十大生物医药公司中已有五家与
              Forus 合作。公司在纽约市一个办公室运营，约 100 名工程师和运营人员。更名前的网站是 withtandem.com；现在为 forus.com。
