      - number: '4.2'
        title: 单位经济、定价与基准
        blocks:
          - type: paragraph
            body: >
              Forus 没有公开披露合同定价、交易结构、单次药物上市的平均售价，或每家生物制药伙伴贡献的收入。所有单位经济指标——毛利率、生物制药端
              CAC、净收入留存、回本周期、收入成本——都仍是私有信息。以下分析用可比市场基准做三角测算，只用于框定单位经济可能长什么样；这些是推断性估计，不是已验证数字。


              医疗服务提供者端创造的价值，为生物制药合同定价划出下限。CAQH 2024 Index 量化了人工事先授权交易成本：每次 $11.58，完全电子化处理则是 $2.17，降幅 81%。AMA 2024
              医师调查显示，诊所每周约花 13 个员工小时处理 PA；若按全部人工成本计算（中等市场协调员时薪 $20–25），每次人工 PA 成本为 $20–35。使用自动化平台的诊所，首次提交批准率可超过
              95%，而行业平均为 80–85%，从而显著减少拒批后的跟进和返工成本。Forus 不向医疗服务提供者收费，因此全部 ROI
              都归诊所所有——采用决策从采购决策变成工作流整合决策。这正是生物制药伙伴愿意资助的采用加速机制：给它们商业化药物所需的开方渠道一个免费采用激励。


              生物制药商业准入市场提供定价上限和可比公司集合。Cardinal Health 的 hub 演进研究与 ICER 的 2025 上市定价报告共同表明，生物制药企业每个主要药物上市会在商业准入基础设施上投入
              $50–200 million，包括传统 hub 服务、共付援助、专科药房教育和患者支持项目。传统 hub-and-spoke 厂商——如
              Inovalon、EVERSANA、AssistRx、Sonexus——通常按登记患者、处理授权，或年度平台费收费，每个药物收费区间为 $500,000 到 $5 million。Forus
              的网络路径通过开方时点的 EHR 嵌入式工作流交付，而不是处方后的呼叫中心，相当于对 hub 模型做结构性升级。合理推断是，Forus 每个药物上市项目收费约 $1–5
              million，数据和分析组件还能带来追加销售空间。若 5 家生物制药伙伴各自管理多种药物，且每家每年跨药物组合投入 $8–15 million，$45–55 million
              的运行收入是可信的。没有合同披露前，这些估计无法验证。


              可比模型的毛利率基准支持 65–80% 毛利率的假设。采用软件交付的数字健康和数据授权平台（无实物商品，除托管和支持外单客户可变成本较低）通常能达到这个区间。Forus 的主要收入成本很可能是基础设施（EHR
              集成中间件、数据处理、支付方 API 连接）和临床运营（复核边缘案例、更新支付方规则），两者在规模化后大多是固定或近固定成本。如果毛利率假设成立，Forus 在 $50M 运行收入下每年可产生约
              $32.5–40M 毛利润。不过，缺少审计财务数据时，这仍是下游投资者必须验证的估计。


              净收入留存、队列流失、生物制药合同续约或 LTV 数据均未公开披露。官方公告中的 5 家生物制药伙伴渗透数字和 5 倍收入增长信号，与快速 NRR 扩张（现有伙伴关系增加新药物）一致，但没有 NRR
              披露就无法确认。
            claimRefs:
              - CI010
