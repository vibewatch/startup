      - CV029
      - CV031
      - CV032
      - CV037
      - CV038
      - CV039
  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 对估值为何重要
      - 尽调路径
    rows:
      - - 毛利率和 COGS 结构
        - 公开资料未披露毛利率、COGS 拆分，或按收入流计算的贡献毛利
        - 在 DCF 假设下，毛利率相差 10 个百分点（60% vs 70%）会使可持续倍数变化约 30–50%；如果毛利率低于 55%，任何基准情景都无法支撑 $1B 标记
        - 在 NDA 下索取过去四个季度经审计或管理账口径 P&L；特别要求拆出分配给 EHR 集成维护、支付方 API 成本和临床规则更新的 COGS
      - - 净留存率（NRR）
        - 公开资料没有队列留存、NRR 或生物制药合同续约率数据
        - NRR 是 SaaS 质量最强的单一指标；NRR >115% 可支撑 $1B 乐观情景入场；NRR <100% 则说明生物制药 合作伙伴收缩，公允价值降至悲观区间
        - 按合作年份索取合作伙伴队列收入表；特别询问已进入首次续约窗口的合同续约率
      - - 合同集中度和合作伙伴身份
        - 五家具名生物制药合作伙伴未公开披露；各合作伙伴收入分布未知
        - 如果两个合作伙伴贡献 $50M 收入的 >70%，单一不续约就会造成 >$17M 收入断崖——以当前运营规模看属于重大风险
        - 在 NDA 下索取前五大客户收入集中度表；另行询问每份合作协议的最低合同期限和通知期
      - - 烧钱速度和现金跑道
        - 年度现金消耗未公开披露；根据 NYC 员工数基准估算为每年 $18M–$35M
        - 现金跑道不确定会影响稀释模型；如果 Forus 在 18 个月内以平轮或降价轮再融资，$1B 入场标记会在退出前受损
        - 在 NDA 下索取最近 12 个月现金流量表和 18 个月预计现金跑道模型
      - - BAA 治理和数据去标识化
        - Forus 的商业伙伴协议（BAA）模板、去标识化标准（Safe Harbor vs Expert Determination），以及 AI 模型训练排除 PHI 的安排未公开披露
        - 生物制药分析收入依赖可合法共享的处方流数据；去标识化缺口或 BAA 缺陷可能让整个分析收入流面临合同撤销和监管执法
        - 索取与医疗系统客户及生物制药分析合作伙伴使用的 BAA 表单；要求法律意见确认 HIPAA 去标识化方法，以及 PHI 不进入模型训练
    notes: >-
      这六项尽调索取是从“观察 / 继续研究”推进到有支撑投资决策所需的最低信息集。所有项目都是私营公司标准尽调请求；Forus 处在当前阶段和规模（>$50M ARR、融资 >$160M），理应能够提供。若其无法或不愿在 NDA
      下提供，本身就是尽调信号。
    claimRefs:
