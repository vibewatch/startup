            - 低 — 主要是收入周期管理；公开材料未描述费用援助登记模块
            - 低 — 聚焦 PA 自动化；没有公开的费用援助登记模块
            - 中 — 通过语音代理监测共付卡状态并跟进患者费用可负担性
            - 低 — PA 提交工具；未描述独立的费用援助登记
        - label: EHR 工作流嵌入程度
