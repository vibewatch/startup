  - id: FM001
    title: 市场规模测算金字塔——从药品总支出到生物制药商业预算
    type: pyramid
    layout: wide
    summary: 四层嵌套市场——从最宽的美国药品总支出到最具体的生物制药患者服务中心 / 商业支出——展示 Forus 可服务市场如何嵌在每一层更宽市场中。
    data:
      nodes:
        - id: layer1
          label: 美国处方药总支出
          detail: 预计 2026 年 >$1 trillion（ASHP）；2025 年增长 12.7%
        - id: layer2
          label: 专科药品支出
          detail: 约 $263B（占处方药总额 54%；处方量 <5%）；FDA 批准自 2012 年以来约每年增长 3%
        - id: layer3
          label: PA 负担较重的专科处方药（高 PA 专科药品）
          detail: 生物制剂疗法、精准肿瘤、罕见病；按价值计占专科药支出的大部分
        - id: layer4
          label: 可能流失 / 未履约风险
          detail: 示意上限约 $13B（5% 流失 × $263B 专科药）；82% 医生报告 PA 导致弃疗 / 放弃取药
        - id: layer5
          label: 生物制药患者服务中心 / 商业上市预算
          detail: $3–6B 历史估计（未经 2026 年数据佐证）；Forus 直接商业市场；据 Cardinal Health 2026，患者服务中心 策略已进入重新评估
    approximationNotes: 所有数值均为来自二手来源（ASHP、CAQH、PMC/Tufts）的近似值。患者服务中心 市场估计标为低置信度。金字塔是概念框架；没有额外数据时，各层不能按算术直接嵌套。
    claimRefs:
      - CM008
      - CM010
      - CM011
      - CM014
      - CM035
  - id: FM002
    title: 市场估计区间——PA 自动化机会
    type: range
    layout: standard
    summary: 美国事先授权自动化节约机会的低 / 基准 / 高估计，展示不同口径定义带来的区间。
    data:
      items:
        - label: PA 直接交易成本节约（CAQH 窄口径）
          low: 0.05
          mid: 0.055
          high: 0.06
          unit: $B/year
          detail: CAQH CEO 估计；仅交易成本；不包括医生时间和药品收入影响
        - label: 更广医疗行政中的 PA 行政节约（CAQH 2025）
          low: 16.4
          mid: 18.7
          high: 21
          unit: $B/year
          detail: 低 = 2023 CAQH 基线；基准 = 2025 CAQH 估计；高 = 全电子场景（ViVE 2026）
        - label: 有流失风险的专科药品未履约收入（示意）
          low: 5
          mid: 13
          high: 26
          unit: $B/year
          detail: 低 = 2% 流失 × $263B 专科药；中 = 5% 假设；高 = 10%；均为示意——没有可验证因果率
    approximationNotes: PA 直接节约来自 CAQH ViVE 2026 访谈；更广行政节约来自 CAQH 2025 Index 和 ViVE 访谈。未履约数据由模型推导，缺少独立验证；代表通过降低 PA 摩擦可回收的生物制药收入理论上限。
