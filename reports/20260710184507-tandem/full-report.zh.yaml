      - number: '5.2'
        title: AI 与运营架构
        blocks:
          - type: paragraph
            body: >
              Forus 将其平台描述为“AI 驱动网络”，但没有公开披露技术栈、EHR 集成方式、支付方 API 连接细节或模型架构。基于官方产品描述、公司博客和投资者公告，可以以不同置信度勾勒出以下架构层。


              **临床智能层。** 公开披露最详细的是 Forus 内部 Clinical Intelligence 职能，由 Adam Harris, MD 领导（Oscar Health 应用 AI
              副总裁、Bellevue Hospital Center 主治医师、NYU 医学临床助理教授）。团队还包括 Kathleen Alvarez, NP（Yale School of Nursing，曾有风湿病 PA
              经验）。该团队的职责，是把支付方规则知识、专科 PA 细节和药物目录逻辑直接嵌入产品设计与 QA。这个职能会转化为持续更新的政策/规则引擎——它不同于自主 AI 临床决策系统，更像复制资深 PA
              协调员的判断，同时不把临床权限交给算法。


              Harris 医生表示：“我们的目标不只是使用 AI。我们的目标是支持临床医生帮助患者拿到所需药物，同时确保我们构建的一切都反映真实临床实践。”这种表述与混合的人在回路模型一致：AI
              处理模式匹配、表单生成和状态跟踪，临床人员保留对例外和申诉的判断。


              **工作流自动化与规则引擎。** Forus 通过把 EHR 处方数据映射到支付方特定 PA
              标准来自动生成表单。这需要一个持续维护的支付方规则库，覆盖美国每个支付方和每种药物的保险公司临床政策与阶梯治疗要求。维护这套规则库是一项持续且重要的运营成本，也是新进入者复制时的主要壁垒。公司没有披露规则数据库规模、更新频率或准确率。


              **EHR 集成模型。** Forus 被描述为“嵌入医生工作流”，并集成进 EHR 系统。具体集成方式没有公开披露。标准医疗 IT 集成模式包括 FHIR R4 API、HL7 v2 ADT/ORM
              feed、SMART on FHIR app launch，或专有 EHR 厂商 API（Epic App Orchard、Cerner OpenPlatform）。Waystar 开发者门户公开列出 REST
              API、HL7、X12 EDI、sFTP、Web 服务和 RPA 等集成选项，这为现代 RCM 平台会暴露什么提供了有用基准。Humata 技术页确认支持 HL7/FHIR 标准集成和专有 API。Forus
              没有发布开发者门户、API 文档或 EHR 认证名单。


              **AI 推理。** Optum Rx 的公开 AI 路线图描述了三层架构（预测式、生成式、代理式），应用于药房和 PA 工作流。Infinitus 使用语音 AI 代理处理高风险医疗电话，包括权益核验和 PA
              跟进。Forus 的路径看起来聚焦工作流编排，而不是把语音或生成式 AI 作为主要形态；但公司没有披露模型类型、训练数据来源、评估方法、幻觉/人工覆盖治理或性能基准。


              **生物制药数据架构。** 一手处方流数据资产——PA 结果、药物目录例外、依从性信号、开方医生行为——被描述为核心竞争资产，也是生物制药商业准入收入模型的基础。Forus
              没有披露去标识化方法、最小单元格抑制实践、数据治理文件，或数据是否会同时与多个生物制药客户共享、是否存在独家安排。


              未公开事项包括：确切 EHR 系统认证、支付方 API 连接名单、模型评估指标、正常运行时间/SLA 数字、BAA 模板条款、AI 治理框架、训练数据来源，以及人工覆盖/例外升级规则。
            claimRefs:
