  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与范围
        blocks:
          - type: paragraph
            body: >
              Forus 竞争的位置横跨至少四个彼此独立但紧密耦合的问题空间，其中没有一个通常被称为“PA 市场”。要做可信测算，必须先界定市场范围。


              第一层、也是最基础的一层，是事先授权行政成本。每一张需要 PA 的已投保处方或医疗程序，都会在医生、支付方、有时还有药房之间触发多步骤行政交易。AMA 2024 年医生调查发现，医生平均每周完成 39
              项事先授权，40% 的诊所雇用了专门处理 PA 的员工。美国 2024 年医疗行政交易总支出超过 $81.9 billion；CAQH 2025 Index 估算，其中仍有 $18.7 billion
              可通过自动化释放，高于两年前的 $16.4 billion。事先授权是最顽固的人工交易类别：2024 年电子化采用率只有 40%，而理赔提交为 98%，资格核验为 96%。CAQH 对直接 PA
              自动化成本节省的狭义测算为每年 $50–60 million，但这个数字低估了 PA 延迟带来的更广泛生产力和临床结果成本。


              第二层是专科药准入摩擦。专科药包括用于癌症、自身免疫病、罕见病以及现在 GLP-1 激动剂的生物制剂；它们占处方量不到 5%，却贡献了美国药品支出的约 54%，即 2024 年约 $263 billion，高于
              2019 年的 47%。2000 至 2024 年，FDA 在 897 个创新药批准中批准了 516 个专科药；自 2012 年以来，专科药在 FDA 每年批准中的占比都超过
              50%。这些药承受最高的使用管理负担，包括阶梯疗法要求、事先授权和专科药房分流，因此也是 Forus 主要处理的工作流。


              第三层是生物医药 hub 与患者支持基础设施。生命科学制造商长期资助“hub”项目，即第三方患者准入服务，用来加快治疗启动、管理事先授权，并把患者连接到共付援助项目。Cardinal Health 的 2026
              Benchmark Report 调查了 200 家生物医药制造商，发现 hub 策略、供应商整合和执行预期都在被重新评估。Forus 位于开方医生和 EHR 层，本质上是一个技术驱动的 hub
              替代方案：它原生嵌入，而不是在处方事件之后外挂。


              第四层是处方未履约和准入摩擦的规模。KFF 2026 年 1 月民调发现，47% 的参保成年人、以及 57% 的慢性病患者称，过去两年中保险公司曾拒绝、延迟或更改其处方或医疗服务。34% 的所有参保成年人、39%
              的慢性病患者把事先授权列为最大负担。因此，市场机会一部分是患者结果问题，一部分是药品支出捕获问题：被放弃或延迟的治疗，就是生物医药制造商失去的收入。


              最重要的边界，是对医疗服务方免费、由生物医药付费的模式。Forus
              不向医生或患者收费；它的经济市场是愿意为网络准入和新药上市支持付费的生物医药制造商。这限制了传统“软件市场”的框架，也把真正的市场问题改写为：药企愿意花多少钱来提高高价值专科药的首次配药率、降低放弃率？
