      - number: '6.2'
        title: 具名客户证明与结果
        blocks:
          - type: paragraph
            body: >
              Forus 在公司博客上发布了 5 个具名医疗服务提供者案例研究，每个案例对应一个不同专科分层，并记录了具体运营结果。这些案例研究是生产环境真实部署的主要公开证据，但全部由 Forus
              撰写，没有独立佐证或审计。即便如此，它们具名、具体且结果丰富，证据标准高于单纯客户标识列表。


              Goodman Dermatology（10 个地点、35+ 名医疗服务提供者、Georgia）称，曾在其他诊所无法获批的患者通过 Forus 成功获批，通常在 2–3 天内完成。Goodman 医生亲自向
              AQUA Dermatology 推荐 Forus——Goodman 隶属于这个更大的平台——随后整个 AQUA 组织采用了 Forus。这次级联是 Forus 公开记录中最大的客户扩张事件。


              Optima Dermatology 采用 Forus 后清掉了 500+ 项积压任务，现在所有事先授权都会在处方写下当天启动。创始医生 Scott Guenthner
              医生称，上线过程对临床医生透明；Cleveland 皮肤科医生 Gregory Delost 医生确认实施“绝对无缝”。


              MedicoCX GPO（300+ 家独立诊所，主要是过敏科）由总监 Briana O'Dwyer 管理；它把团队拨打支付方电话的时间从工作日的 60–70% 降到 15% 以下，并把 Forus
              嵌入新诊所的标准上线流程。该 GPO 花了三年评估替代方案，最终选择 Forus。


              Digestive Health Specialists（20+ 名 GI 开方医生）的生物制剂协调员 Ashley Flowers 采用 Forus 后，每日 PA 处理量从约 5 个完整处理的 PA
              提升到每天 15–30 个，形成 3–6 倍的阶跃式改善。


              General Catalyst 投资博客描述了一个未具名医疗服务提供者集团：PA 周转时间从超过 7 天降至中位数 1.1 天，护理行政工作量减少 70%——这是公开文件中最具体的结果指标，来源于 GC
              尽调，而非审计研究。


              5 个 Forus 博客案例研究全部发布于 2025 年 12 月至 2026 年 3 月，并包含具名管理员、医生和协调员的直接引语——这增加了真实性，但不构成独立第三方验证。
