    approximationNotes: 阶段描述综合自 Forus 博客案例研究（Goodman、MedicoCX、Allergy Houston）、GC 投资人博客和 Pulse2 文章。各阶段转化率未公开披露；阶段标签描述的是定性动态，不是量化漏斗率。
