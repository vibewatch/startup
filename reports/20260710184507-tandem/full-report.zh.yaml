            title: 打破投资论点的触发点——高容量州强制人工审核
            body: >-
              如果代表 Forus 处方量多数的州（尤其是 Texas、California、Florida 和 New York）出台 Indiana 式法律，要求每一次 AI 辅助 PA
              决定都必须由持证医生签字，Forus 全自动端到端模式就需要重做产品架构。随之而来的合规开销会压缩利润率、拖慢提交吞吐，并部分削弱推动服务方采用的零负担价值主张。投资人应按季度跟踪 Manatt Health 的
              AI Policy Tracker，并把 Forus 的监管合规路线图作为任何新资本投入的前置条件。
