  - id: FO002
    title: Forus 平台逻辑流
    type: flow
    layout: standard
    summary: Forus 如何把医生、EHR、支付方、药房和患者接入自动化处方可及性工作流，并由生物制药作为收入来源。
    data:
      nodes:
        - id: physician
          label: 医生 / 医疗服务方
          detail: 在现有 EHR 系统内开具处方；Forus 嵌入在这一步
        - id: forus
          label: Forus AI 平台
          detail: 拦截处方；生成 PA 表单，路由到最佳药房，让患者加入援助项目，并跟踪状态
        - id: payer
          label: 保险方 / 支付方
          detail: 接收自动 PA 提交；批准或要求补充信息；Forus 处理申诉
        - id: pharmacy
          label: 药房 / 专科药房
