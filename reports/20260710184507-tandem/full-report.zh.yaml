        - IRA 返利改革和 Medicaid GENEROUS 定价模型压缩生物制药商业预算；药企 hub 支出下降；若没有服务方收入兜底，Forus 的资金来源会变弱
        - 高
        - HHS 已发布 2026 GENEROUS Medicaid Model；IRA Part D 重设计正在推进；Cardinal Health hub 报告显示，药企正在重新评估 hub 策略
        - 测算 Forus 收入对生物制药商业预算下调 10–20% 的敏感性；核实 Forus 是否有收入多元化或兜底定价；查看 hub 合作伙伴财务数据，寻找早期信号
      - - 端到端工作流覆盖（授权 + 可负担性 + 路由）
        - EHR 厂商（Epic、Oracle Health）把原生 PA 模块扩展到可负担性和专科药房路由；没有第三方供应商关系，Forus 的工作流范围差异化会被抹平
        - 高
        - Epic App Orchard 和 Oracle Health 正在扩展临床工作流工具；Epic 原生 PA 模块已嵌入医疗体系工作流；EHR 原生扩展无需额外采购
        - 审核 Epic 和 Oracle Health 的 PA 路线图；盘点 Epic App Orchard 上竞争性的 PA 和可负担性应用；调研医疗体系 CIO 对 EHR 厂商 PA 扩展计划的看法
      - - CoverMyMeds 网络集中度（约 90% e-PA 份额）
        - CoverMyMeds 的网络地位占主导，支付方和 PBM 会默认走 CoverMyMeds 路由；除非 Forus 能达到或超过 CoverMyMeds 的支付方连通度，否则它只是叠加层，不是替代品
        - 高
        - Optum Rx、Surescripts 和主要 EHR 均把 CoverMyMeds 列为默认路由基础设施；独立市场指南称其占约 90% e-PA 交易量
        - 判断 Forus 是通过 CoverMyMeds 路由（互补）还是绕开它（替代）；评估支付方连通广度相对 CoverMyMeds 的差距；要求 Forus 提供支付方覆盖地图和电子 PA 提交率
      - - AI 能力（政策匹配、临床资料打包）
        - AI 功能商品化：已有 10+ 家供应商落地 AI-PA；随着 AI 变成标配而非差异点，Humata 等公司会削弱 Forus 的 AI 专属主张
        - 中
        - Neon Health 2026 指南收录 10+ 家 AI-PA 供应商；Humata 报告 96% 首次通过审批率，与 Forus 的主张可比；Myndshft 等公司也在切同一工作流
        - 核实 Forus 大规模专有支付方政策和审批数据，是否能在商品化模型能力之外构成持久 AI 护城河；在 NDA 下要求提供模型架构和训练数据来源
      - - 供应商集中 / 单点故障风险
        - Forus 基础设施若发生网络安全事件，将大规模打断生物制药药品上市工作流和服务方 PA 处理，损害集中度类似 Change Healthcare 宕机
        - 中
        - AMA 调查：Change Healthcare 宕机期间 80% 诊所收入受损；Forus 大规模处理处方准入数据；HITRUST 认证尚未公开确认
        - 核实 Forus 的基础设施冗余和灾备状态；确认 HITRUST 认证是否在推进；审查 PHI 处理和生物制药数据流的安全架构
      - - 多归属常态化
        - 服务方同时使用多个 PA 工具，会限制 Forus 捕获完整处方流数据的能力，也会削弱网络效应护城河
        - 中
        - Neon Health 2026 指南明确让多归属常态化：建议不同利益相关方使用不同平台；服务方没有动力整合到单一 PA 供应商
        - 评估 Forus 的 EHR 嵌入排他条款；判断多归属是否稀释 Forus 的数据质量或数据量；评估生物制药企业是否要求排他路由承诺
