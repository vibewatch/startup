      - number: '3.2'
        title: 竞争对手画像与能力对比
        blocks:
          - type: paragraph
            body: >
              Humata Health 将其 PAthway 平台定位为“业内最全面的事先授权解决方案”，目标客户是医疗系统收入周期、患者准入和授权管理负责人。其技术栈包括 AI
              驱动的政策匹配（PolicyLink）、自动临床资料打包、智能证明回答、自动状态跟踪、授权后监测，以及通过 Power BI 提供分析。已发布的绩效主张包括 96% 首次提交获批率、临床资料打包效率提高
              80%、授权触点减少 45%、改期减少 83%。平台通过原生 EHR 集成连接 250+ 支付方。Humata 持有 HITRUST CSF v9.5.0 r2 认证，并每年接受 SOC 2 Type II
              审计；这种安全姿态设定了医疗系统 PA 供应商采购的企业合规基线。Texas Health Resources（收入约 $6 billion，29 家医院）于 2025 年 7
              月在诊断影像、心血管服务和介入放射科部署 Humata，实现范围内量 100% 自动覆盖。UHealth 骨科部署把 68% 需要 PA 的骨科授权恢复为自动处理。Humata
              定价未公开；它通过企业医疗系统销售合同竞争。关键在于，Humata 由医疗服务方付费，并不运营生物医药付费、对医疗服务方免费的模式。


              Infinitus Systems 使用语音 AI 代理自动拨打支付方电话，处理 PA 状态、权益核验、登记跟进和续配协调。其代理在肿瘤、免疫、风湿、神经、心脏病和其他疾病领域捕捉 PA
              要求和更新。Infinitus 已完成 8 million+ 通电话，支持 125,000+ 名医疗服务方，自动化超过 100 million 分钟医疗对话，并称被 44% 的 Fortune 50
              公司采用。公司由 Andreessen Horowitz 支持，披露估值超过 $600 million。Infinitus 面向 PA
              工作流的提交后阶段；它不在开方点集成，不管理处方集分流，也不为患者登记可负担性项目。其无代码 Studio 工具允许医疗团队在合规护栏下构建和部署语音 AI
              代理。在支付方电话仍不可避免的场景中，Infinitus 模式与电子 PA 平台互补。


              CoverMyMeds（McKesson 全资持有）主导电子 PA 路由基础设施：其网络称占美国电子 PA 交易量约 90%，连接美国 94% 的处方量、96% 的药房和 950,000+
              名医疗专业人员。Optum Rx 将 CoverMyMeds 与 Surescripts、PreCheck MyScript、DrFirst、CenterX 和 Allscripts 并列，作为主要 e-PA
              提交门户。McKesson 2024 财年收入约 $309 billion，让 CoverMyMeds 能在 McKesson 的医院、专科药房和制造商客户关系中获得强大的交叉销售分发。CoverMyMeds
              路由并跟踪 PA 请求，但不独立决定获批速度；延迟由支付方系统处理决定。它没有公开描述在开方点提供可负担性登记、生物医药新药上市互动或药房分流优化。CoverMyMeds 对医疗服务方访问的定价未公开。


              Change Healthcare 目前在 UnitedHealth Group 旗下以 Optum for Business 运营；结合 Optum 能力，它支持美国 10 家医院中的 8 家和 10
              个健康计划中的 8 个。其 e-PA 门户允许当日 PA 决定，PreCheck Prior Authorization 功能降低获批时间和拒付。2024 年 2 月勒索软件攻击扰乱了约 193 million
              人的理赔处理和 PA 工作流；AMA 调查数据显示，80% 的诊所因此出现未付理赔导致的收入损失，85% 的诊所增加了用于收入周期任务的员工时间。


              Waystar 向 1 million+ 名医疗服务方提供 RCM 软件，覆盖美国 60% 的患者人群；截至 2023 年 9 月，其第三方医疗服务方净推荐值超过 74。其 Financial Clearance
              套件把 PA 管理、保险核验、价格透明和拒付预防作为集成组件。PA 集成覆盖 Epic、Cerner 和 MEDITECH。Waystar 的 PA
              定位是财务清结和拒付预防；其官方平台材料没有提到生物医药合作、可负担性登记或专科药房分流。定价未公开；PA 能力被打包进企业 RCM 合同。
