      - number: '7.2'
        title: 隐私、HIPAA 和数据权利风险
        blocks:
          - type: paragraph
            body: >
              Forus 在三类高度受监管的数据流交汇处处理受保护健康信息（PHI）：来自 EHR 系统的临床处方数据、支付方资格与覆盖数据，以及患者人口统计和福利登记数据。Foley and Lardner 2025 年 5
              月指南说得很清楚：加入 AI 不会改变 HIPAA 的核心规则；PHI 只能为允许的目的访问、使用和披露；最低必要标准适用于每一款 AI 工具；任何处理 PHI 的 AI
              供应商，都必须由业务伙伴协议（BAA）覆盖，并加入针对模型训练数据、留存、分包商链条和泄露通知的 AI 专项条款。


              Forus 的公开隐私披露（forus.com/pp）承认 BAA 结构，但没有说明它与哪些具体类别的受监管实体签署 BAA、其 AI 模型是否排除使用患者 PHI
              训练，或数据若被用于生物制药分析时采用何种去标识化标准。这个缺口很重要：生物制药商业合作依赖可以合法共享的数据；去标识化做法不披露，就无法判断 Forus 是否符合 HIPAA 的 Safe Harbor 或
              Expert Determination 标准。


              财务代价很高。IBM Security 的 2025 年 Cost of a Data Breach Report 显示，医疗数据泄露平均每起损失 $7.42 million，在所有行业中连续第 14
              年最高；医疗行业平均需要 279 天才能遏制一次泄露。OCR 已将 HIPAA Security Rule 最终定稿列入 2026 年监管议程，可能要求每年开展安全风险评估，并在 24
              小时内报告泄露。Gartner 预计，到 2026 年，60% 的医疗机构计划建立正式 AI 治理项目；剩下 40% 的暴露面会继续上升。Forus 的信任中心提到 SOC 2 认证，但没有披露 Type II
              日期或审计方。Humata Health、Infinitus AI 等竞争对手发布了更细的合规文档，这可能让大型医疗系统采购时更犹豫。
