    rows:
      - - 专科药管线扩张（FDA 批准、基因治疗、精准肿瘤）
        - 顺风
        - 持续；专科药批准量每年增长 3%
        - 每一次专科药新批准都会带来新的 PA 工作流，并扩大生物制药合作伙伴基础
        - 跟踪 Forus 专科重点领域的新 FDA 批准；确认生物制药管线覆盖
      - - 处方药支出突破 $1T（ASHP 2026）
        - 顺风
        - 2026 里程碑；预计增长 10–12%
        - 药品市场越大，PA 行政负担和制造商商业预算越大
        - 确认 Forus 在新药上市支出中的份额是否随市场增长按比例扩大
      - - CMS 互操作性强制要求（CMS-0057-F；CMS-0062-P 提案）
        - 顺风（短期）；逆风（中期）
        - 电子 PA API 的合规期限为 2027 年
        - 短期：支付方连接更容易；中期：支付方可能自建 PA 工具，削弱 Forus 杠杆
        - 梳理支付方 API 路线图；评估支付方自有 ePA 会替代还是补充 Forus
      - - Medicare Advantage PA 改革法案（H.R. 3514 / S. 1816）
        - 顺风
        - 国会待审；众议院 254 名、参议院 66 名共同提案人（2026 年 2 月）
        - 若通过，将提升 Medicare Advantage 的电子 PA 采用率，并让 Forus 工作流成为常规
        - 跟踪国会议程；评估 Forus 的 Medicare Advantage 支付方连接
      - - 州层面 PA 决策 AI 监管法
        - 逆风
        - 近期；2025–2026 年多州活跃
        - 生物制药合作伙伴合规更复杂；若 Forus 被误归类为覆盖决策 AI，会有声誉风险
        - 审阅 Forus 的 AI 治理文件；确认法律分类是提供方侧工作流工具
      - - CAQH 电子 PA 采用滞后（2024 年电子化 40%）
        - 顺风（机会）
        - 持续存在；每年小幅改善
        - 手工 PA 积压是 Forus 的核心 TAM；60% 手工量就是增长跑道
        - 对照 CAQH 电子采用地图验证 Forus 的支付方覆盖
      - - Change Healthcare 网络攻击（2024 年 2 月；影响 193M 人）
        - 多空交织：短期扰动 / 长期信任顾虑
        - 运营层面已恢复；信任影响持续
        - 暴露依赖清算所工作流的脆弱性；让市场更愿意尝试类似 Forus 的去中心化工具
        - 评估 Forus 安全态势（SOC 2 审计已确认）；确认不依赖 Change Healthcare
      - - IRA / GENEROUS Medicaid Model 对生物制药预算施压
        - 逆风
        - 2026–2028 分阶段实施
        - 制造商收入被压缩，可能削减患者准入项目商业预算和 Forus 费用
        - 建模评估 Forus 生物制药收入对平均商业药品折扣变化的敏感性
      - - 医生 AI 采用增长（每 3 名医生中 2 名使用医疗 AI；较 2023 年增长 78%）
        - 顺风
        - 当前已经发生且在加速
        - 降低医生对 AI 驱动 PA 工作流的阻力；让 Forus 更像标准实践的一部分
        - 跟踪 AMA AI 采用指标；确认 Forus EHR 集成 NPS 相对同类工具的水平
      - - 专科药房渠道权力与 Hub 既有合同
        - 逆风
        - 结构性 / 持续
        - CVS Specialty、Accredo 等专科 PBM 与制造商关系很深；Forus 必须补位或替代
        - 梳理 Forus 的专科药房路由关系；确认它强化而非冲突专科药房合同
    notes: 方向从 Forus 视角判断。时点根据 2026 年 Q1–Q2 来源估算。CMS 因素标为双向，因为短期 API 标准化帮助 Forus，但中期支付方内建工具可能减少对第三方的依赖。
