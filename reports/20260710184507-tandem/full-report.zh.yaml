      - number: '1.5'
        title: 风险版图与监管环境
        blocks:
          - type: paragraph
            body: >
              Forus 做的是医疗服务方侧的 AI 处方自动化，帮助医生生成并提交事先授权请求；它不在支付方侧，也不负责由 AI 系统审核并拒绝理赔。在当前监管环境中，这一区分很重要：争议焦点集中在保险公司用 AI
              大规模拒绝护理、且人工复核不足。即便如此，AI 事先授权的整体监管和声誉风险仍会影响整个品类。


              多个独立来源记录了 AI 辅助事先授权中的系统性风险。Stanford 研究者 2026 年 1 月在 Health Affairs 发文警告，保险公司在事先授权中使用
              AI，可能放大既有缺陷：保险公司人工审核员可能缺乏时间、专业能力和激励，无法认真复核 AI 生成的建议，从而造成错误拒付。KFF 研究发现，8-12% 的保险计划已经用 AI 支持事先授权拒付。行业分析师引用的
              2024 年 AMA 调查显示，61% 的医生担心未受监管的 AI 正被用于增加拒付。National Health Law Program（2026 年 1 月）警告，一项联邦 AI 行政令可能限制州层面对
              AI 驱动保险拒付的消费者保护。


              州层面，监管节奏正在加快。Holland and Knight 的 2026 年分析记录了 Alabama（SB 63）、Indiana（HB 1271）、Utah（SB 319）、Washington（SB
              5395）、Maryland（HB 1563）和 Georgia（SB 544）在 2026 年通过的新医疗 AI 法律；这些法律都要求 AI 辅助事先授权决定接受某种形式的医生复核。这些法律针对的是支付方侧
              AI，不是 Forus 这类医疗服务方工具，但监管趋势反映出审查升温，未来可能覆盖 PA 工作流中的所有 AI 参与者。Forus 作为对临床医生免费的医疗服务方侧工具，能降低但不能消除监管和声誉暴露。
            claimRefs:
