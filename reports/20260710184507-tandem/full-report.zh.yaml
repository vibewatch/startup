  - id: FI001
    title: 收入模式桥
    type: flow
    layout: wide
    summary: 医疗服务方网络活动如何转化为生物制药付费收入和估计毛利。
    approximationNotes: >-
      终端节点的收入和毛利估计为分析师推断，依据公开 Forbes 数据（2025 年底 $10M、2026 年中年化约
      $50M）和可比数字医疗毛利率基准（65–80%）。没有审计财务。节点标签反映机制，不代表已验证金额，除非标注为公开数据支撑。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
    data:
      nodes:
        - id: providers
          label: 医疗服务方网络（免费）
          detail: 覆盖数千家诊所和医疗系统、美国 50 个州、约 80% 美国邮编区。医疗服务方和患者均不付费。
        - id: workflow
          label: PA + 费用援助 + 分流（自动化）
          detail: 每张处方都会触发 PA 提交、药品目录检查、PAP 登记、药房分流和患者短信；全部在 EHR 工作流内自动完成。
        - id: data-asset
          label: 第一方处方流数据
          detail: 实时结果数据：PA 批准 / 拒绝、药品目录例外、依从性信号和处方医生行为。每笔交易都会沉淀。
        - id: biopharma-engagement
          label: 生物医药商业准入合作
          detail: 全球前 10 大生物医药公司中已有 5 家付费合作，换取新药上市加速、决策点处方医生网络触达和数据分析。这是主要收入来源。
        - id: revenue
          label: 收入（年化约 $50M，2026 年中）
          detail: 年化收入估算来自 Forbes（2025 年末 >$10M；到 2026 年 5 月约增长至五倍 = ~$45–55M）。全部来自生物医药端；医疗服务方不付费。
        - id: gross-profit
          label: 估算毛利（毛利率假设 65–80%）
          detail: 分析师估算：在 $50M 收入和 65–80% 毛利率下，年化毛利为 $30–44M；参照数字健康数据平台可比公司。未经验证；公司未公开披露。
  - id: FI002
    title: 单位经济性桥接图
    type: flow
    layout: wide
    summary: 从医疗服务方采用（免费、零 CAC）到数据资产沉淀，再到生物医药合约价值和毛利经济性的逻辑链条。
    approximationNotes: 凡节点数值已量化者，均为分析师基于公开基准（CAQH、AMA、Linear Health、枢纽市场报告）的估算。Forus 具体合约金额、利润率和 CAC 未公开披露。带问号的节点代表未知私有指标。
    claimRefs:
      - CI010
      - CI011
      - CI013
      - CI014
      - CI016
    data:
      nodes:
        - id: provider-adoption
          label: 医疗服务方采用（CAC ~$0）
          detail: 免费给医疗服务方使用，消除了预算阻力。AMA：诊所每周在 PA 上花 13 个员工小时，单笔 PA 的人工成本约 $20–35；Forus 以医疗服务方零成本拿下这部分 ROI。
        - id: pa-volume
          label: PA 量 + 参与信号
          detail: 每处理一笔 PA，处方流数据资产就增加一笔。CAQH 2024：手工 PA 成本 $11.58，电子 PA 为 $2.17；自动化每次节省 $9.41。覆盖数千家诊所后，聚合数据量变成专有资产。
        - id: data-value
          label: 数据资产价值
          detail: 围绕结果、药品目录动态和处方医生模式的匿名化第一方数据。网络覆盖越广（覆盖 80% 美国邮编区），价值越呈非线性增长。
        - id: deal-size
          label: 生物医药合约价值（估算每伙伴 $8–15M）
          detail: 由 5 家伙伴合计 $50M 年化收入规模推算。基准：传统枢纽服务商交易为每药 $500K–$5M；规模化的集成式准入 + 数据可以拿到溢价定价。
        - id: gross-economics
          label: 毛利经济性（利润率未知）
          detail: 主要 COGS：EHR 集成、支付方 API 连通、临床规则维护、企业销售运营。毛利率未知；数据平台 / SaaS 类比基准为 65–80%。
  - id: FI003
    title: 财务估算区间
    type: range
    layout: wide
    summary: 关键财务指标的源材料支持或基准推导区间。低 / 高边界对应保守 vs. 乐观假设；全部未经审计财务验证。
    approximationNotes: >-
      收入边界来自 Forbes（2025 年末 $10M 下限，约 6 个月内增长至五倍 = 2026 年中 ~$45–55M 区间）。毛利率边界来自可比数字健康数据平台。烧钱率边界来自纽约员工成本基准（100 名
      FTE，完全负担成本 $150–250K，加管理开销）。现金续航期边界用估算现金（假设剩余 $60–140M）除以烧钱率边界计算。除累计融资和估值外，所有指标均为分析师估算；Forus 未披露这些数字。
    claimRefs:
      - CI019
      - CI020
      - CI021
      - CI022
      - CI023
      - CI024
    data:
      items:
        - label: 年化收入 — 2025 年末
          low: 8
          high: 12
          unit: $M
          detail: Forbes：“年末年化收入超过 $10M。”低值按“超过”的保守读法；高值包含温和上行。
        - label: 年化收入 — 2026 年中（当前年化规模）
          low: 40
          high: 60
          unit: $M
          detail: Forbes：“今年迄今大约增长至五倍。”中点为 $10M × 5 = $50M；区间反映“大约”的不精确。
        - label: 累计融资额
          low: 160
          high: 165
          unit: $M
          detail: 官方公告称“已融资 $160M”。上限考虑可能存在取整或未披露轮次。
        - label: 最近估值
          low: 900
          high: 1100
          unit: $M
          detail: Forbes 称估值为 $1B。区间反映精度不确定（投后 / 投前；取整）。
        - label: 估算年度现金消耗
          low: 18
          high: 35
          unit: $M/yr
          detail: 100 名纽约 FTE × 完全负担成本 $150–250K = $15–25M + 开销。低值对应精益运营；高值对应激进扩张招聘。
        - label: 估算现金续航期（自公告日起）
          low: 4
          high: 8
          unit: years
          detail: 估算现金（$60–140M）÷ 烧钱率（$18–35M/年）。宽区间反映不确定性叠加。不假设盈利性增长抵消烧钱。
  - id: FI004
    title: 资本强度 / 现金流图
    type: flow
    layout: wide
    summary: $160M+ 已融资资本如何流经 Forus 成本结构，转化为生物医药收入和净现金头寸。
    approximationNotes: 除标注为“公开来源已确认”的项目外，节点美元值均为估算。没有公开的经审计现金流量表。节点大小仅表示方向 / 定性。
    claimRefs:
      - CI019
      - CI020
      - CI025
      - CI026
      - CI027
    data:
      nodes:
        - id: capital-raised
          label: 已融资 >$160M（已确认）
          detail: >-
            Seed（~$7M）+ Series A（~$30M）+ Series B（~$100M）+ 追加批次。投资方：Thrive Capital、General Catalyst、Accel、Bain Capital
            Ventures、Redpoint、BoxGroup、Pear VC。
        - id: headcount-opex
          label: 约 100 名纽约 FTE（主要 OpEx）
          detail: 按纽约市场薪酬估算，现金薪酬为每年 $15–25M。单一办公室；没有制造 COGS。最大成本中心。
        - id: infra-integrations
          label: EHR + 支付方基础设施
          detail: EHR 集成中间件、支付方 API 连通（所有支付方、所有药品）、数据处理。估算固定成本会随交易量增长摊薄。
        - id: enterprise-sales
          label: 生物医药企业销售
          detail: 增长支出：面向全球前 20 大生物医药公司的企业销售团队；每次药品上市做临床上线。10–20 人企业销售组织估算每年 $2–5M。
        - id: revenue-inflow
          label: 生物医药合约收入（年化约 $50M）
          detail: 主要现金流入：上市费用、数据访问、分析。按 Forbes，从 2025 年末 $10M 增至 2026 年中约 $50M。医疗服务方和患者均不付费。
        - id: net-position
          label: 净现金头寸（未披露）
          detail: 未公开报告。估算净年度现金消耗：$18–35M OpEx 减去约 $50M 收入 = 当前规模下进入正区间，但合约现金回款的利润率和时点未知。
  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Forus 平台从 EHR 触发到生物医药数据输出的分层架构。层级是分析师基于公开来源的刻画；内部技术栈细节未公开披露。
    approximationNotes: >-
      技术栈层级由官方产品描述、竞争对标（Waystar developer portal、Humata technology page、Optum AI pharmacy article）和标准医疗 IT 集成模式推断。Forus
      未发布技术文档。鉴于公开证据，层级标签和组件代表最稳妥的刻画；具体供应商选择（如已认证的 EHR 系统、SMS 提供商、云基础设施）尚未确认。
    claimRefs:
      - CE008
      - CE009
      - CE010
      - CE011
      - CE013
    data:
      layers:
        - id: biopharma-layer
          label: 生物医药互动与数据层
          detail: 顶层：第一方处方流数据供给生物医药商业准入合作。主要收入来源。去标识化方法未披露。
          sublayers:
            - id: data-asset
              label: First-Party Prescription-Flow Data Asset
              detail: >-
                Anonymized PA outcomes, formulary overrides, adherence signals, prescriber behavior. Basis of biopharma
                commercial access revenue. De-identification method not disclosed.
            - id: biopharma-analytics
              label: Biopharma Analytics and Commercial Access Reporting
              detail: >-
                Drug launch optimization, prescriber-network access, commercial analytics sold to biopharma partners.
                Five top-10 biopharma customers as of May 2026.
        - id: intelligence-layer
          label: AI 与临床智能层
          detail: 人机协同智能层：内部临床团队维护支付方规则库并监督 AI 推理；AI 自动完成模式匹配和表单生成。
          sublayers:
            - id: clinical-intelligence
              label: Clinical Intelligence Team (Adam Harris, MD; Kathleen Alvarez, NP)
              detail: >-
                In-house clinical experts maintaining payer-rule library, specialty PA nuance, and product QA.
                Human-in-the-loop model—not autonomous clinical AI.
            - id: rules-engine
              label: Policy and Rules Engine
              detail: >-
                Continuously updated database of payer step-therapy criteria, formulary rules, and clinical PA
                requirements. Core defensibility asset; update cadence not disclosed.
            - id: ai-inference
              label: AI Inference Engine (type not disclosed)
              detail: >-
                Automates form field population, denial classification, appeal drafting. Model architecture, training
                data, evaluation metrics, and hallucination governance not public.
        - id: workflow-layer
          label: 工作流自动化层
          detail: 核心运营层：自动完成 PA 提交、申诉、费用援助登记、药房分流和患者短信，对医疗服务方零收费。
          sublayers:
            - id: pa-submission
              label: PA Form Generation and Submission
              detail: >-
                Extracts clinical data from EHR prescription; maps to payer-specific PA form; submits electronically.
                Covers all payers and drugs per official description.
            - id: appeals
              label: Appeals Automation
              detail: >-
                Classifies denial reason; generates appeal letter from clinical record and payer criteria; tracks
                overturn status.
            - id: affordability
              label: Patient Affordability Enrollment
              detail: >-
                Identifies PAP/co-pay card eligibility; auto-enrolls patient in manufacturer assistance programs at
                point of prescribing.
            - id: pharmacy-routing
              label: Pharmacy Routing
              detail: >-
                Routes prescription to optimal pharmacy post-approval; sends patient confirmation text with pickup
                details.
            - id: patient-sms
              label: Patient Communication (SMS)
              detail: >-
                Proactive text updates at each workflow stage. PHI handling in SMS not documented; carrier/SLA not
                disclosed.
        - id: integration-layer
          label: 集成与连通层
          detail: 底层：把 Forus 连接到 EHR 系统、支付方、药房和临床决策支持伙伴。具体集成未公开记录。
          sublayers:
            - id: ehr-connectors
              label: EHR Connectors (specific systems not confirmed)
              detail: >-
                FHIR R4 / HL7 v2 / SMART on FHIR likely; Epic, Cerner, Athena possible—none confirmed publicly. No
                developer portal or API docs published.
            - id: payer-connectivity
              label: Payer Connectivity
              detail: >-
                Direct payer APIs, clearinghouse, X12 EDI/NCPDP routing. Da Vinci CRD/DTR/PAS FHIR IG possible given CMS
                mandate timeline.
            - id: openevidence-api
              label: OpenEvidence API Integration
              detail: >-
                Partnership announced April 2026. Connects clinical decision support (1M+ consultations/day) to Forus
                prescription initiation and access automation.
            - id: pharmacy-network
              label: Pharmacy Network (SureScripts likely)
              detail: e-Prescribing and pharmacy routing. Specific dispensing network partnerships not disclosed.
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: 从临床决策到患者开始治疗的端到端处方准入流程，显示 Forus 自动化在哪些环节替代人工步骤。
    approximationNotes: >-
      流程步骤来自 forus.com 官方产品描述、公司博客中的医疗服务方证言、OpenEvidence 合作公告和 BusinessWire
      融资新闻稿。步骤标签代表已确认的产品行为；自动化辅助相对人工的时间估算基于医疗服务方证言，未由独立基准验证。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
    data:
      nodes:
        - id: clinical-decision
          label: 临床决策（临床医生）
          detail: 临床医生在 EHR 中确定最佳治疗。OpenEvidence 临床决策支持可能提供信息（美国每日 1M+ 次咨询）。Forus 不影响临床决策。
        - id: ehr-prescription
          label: EHR 处方录入
          detail: 临床医生在原生 EHR 工作流中开具处方。Forus 嵌入其中——无需打开单独门户或工具。
        - id: forus-trigger
          label: Forus 自动识别 PA 要求
          detail: 平台拦截医嘱，根据支付方规则判断 PA 要求，并自动启动准入工作流。检测准确率未披露。
        - id: pa-submission
          label: PA 表单自动生成并提交
          detail: 临床数据映射到支付方特定 PA 标准；表单电子提交。覆盖所有支付方和药品。员工无需手工填写表单。
        - id: payer-review
          label: 支付方审核
          detail: 支付方评估 PA 请求。决策时限：按 2026 年 1 月生效的 CMS-0057-F2 互操作规则，紧急 72 小时 / 标准 7 个日历日。
        - id: pa-approved
          label: PA 批准 → 药房分流
          detail: 获批后，Forus 将处方转至最合适药房（零售、专科、邮购）。患者收到确认短信。
        - id: pa-denied
          label: PA 拒绝 → 自动申诉
          detail: Forus 归类拒绝原因，根据临床记录自动生成申诉并重新提交。员工无需手工起草申诉。
        - id: affordability-check
          label: 费用援助登记（并行）
          detail: Forus 在处理 PA 的同时检查 PAP / 共付卡资格；若费用成为障碍，自动将患者登记进药企援助计划。IRA 限制可能约束部分药品。
        - id: patient-text
          label: 患者状态更新（SMS）
          detail: 每个交接点都会主动给患者发短信：保险决定、药房分流、备药状态。减少诊所来电。SMS 处理 PHI 的方式未公开记录。
        - id: therapy-start
          label: 患者开始治疗
          detail: 终态：处方已配药、患者已知情、治疗已启动。Forus 跟踪状态，方便诊所查看。按官方说法，每年支持数百万患者。
  - id: FE003
    title: 关键依赖图
    type: dag
    layout: wide
    summary: Forus 平台运行的关键依赖：EHR 供应商、支付方连通、监管框架、临床知识和生物医药商业关系。
    approximationNotes: 依赖关系是分析师基于官方产品描述、竞争对标和医疗 IT 常态推断。Forus 未发布技术架构文档。依赖重要性评级来自分析师对产品范围和故障模式的判断。
    claimRefs:
      - CE008
      - CE009
      - CE010
      - CE014
    data:
      nodes:
        - id: forus-platform
          label: Forus 平台
          detail: 中心节点：端到端处方准入自动化需要所有依赖同时成立。
        - id: ehr-vendors
          label: EHR 供应商（Epic、Cerner、Athena 等）
          detail: 必须将 Forus 认证为获批集成。具体 EHR 认证未披露。Epic App Orchard 许可是大多数大型医疗系统部署的门槛。
        - id: payer-apis
          label: 支付方 API / 清算通道
          detail: 电子 PA 提交需要支付方连通。CMS 互操作规则要求 2027 年前开放 API 访问。当前连通名单未披露。
        - id: clinical-intelligence
          label: 临床智能团队
          detail: Adam Harris, MD + Kathleen Alvarez, NP + 团队。维护支付方规则库。存在关键人依赖；没有公开继任文件。
        - id: biopharma-partners
          label: 生物医药商业伙伴（前 10 大中的 5 家）
          detail: 产生收入的关系。集中度风险未知。合约期限和续约结构未公开。
        - id: openevidence
          label: OpenEvidence（临床决策支持）
          detail: 上游集成把循证开方连接到准入自动化。合作于 2026 年 4 月宣布；美国每日 1M+ 次临床咨询。
        - id: pharmacy-network
          label: 药房网络
          detail: 分流需要连接零售、专科和邮购药房。可能使用 SureScripts 电子处方网络。具体合作未确认。
        - id: cms-regulation
          label: CMS / 监管框架
          detail: CMS-0057-F2 要求支付方在 2027 年 1 月前提供 PA API——结构性顺风。州级 AI-in-PA 立法（25+ 项法案，H&K 2026 年 5 月）可能要求披露或调整监督。
        - id: cloud-infrastructure
          label: 云基础设施 / 安全
          detail: 已获 SOC 2 Type II 认证（三次无保留审计）。云服务商未披露。灾备和冗余架构未公开。
      edges:
        - from: ehr-vendors
          to: forus-platform
          label: 集成前提
        - from: payer-apis
          to: forus-platform
          label: PA 提交通道
        - from: clinical-intelligence
          to: forus-platform
          label: 规则库 + QA
        - from: biopharma-partners
          to: forus-platform
          label: 收入 + 数据买方
        - from: openevidence
          to: forus-platform
          label: 上游导流
        - from: pharmacy-network
          to: forus-platform
          label: 履约分流
        - from: cms-regulation
          to: forus-platform
          label: 监管顺风 / 风险
        - from: cloud-infrastructure
          to: forus-platform
          label: 托管 + 安全
  - id: FE004
    title: 产品成熟度 / 能力图
    type: matrix
    layout: wide
    summary: Forus 与主要竞争对手在端到端处方准入自动化五个维度上的能力成熟度比较。评级仅为分析师基于公开证据的评估。
    approximationNotes: >-
      能力评级（高 / 中 / 低 / 未知）是分析师基于公开产品描述、案例研究、开发者门户和信任页面的评估。没有独立基准或头对头比较。Forus 的评级在证据仅限营销文案处按保守口径处理。竞争对手评级基于 Waystar
      developer portal、Humata 技术 / 安全页面、Infinitus 资源和 Optum Rx AI pharmacy article。
    claimRefs:
      - CE021
      - CE022
      - CE023
      - CE024
      - CE025
    data:
      columns:
        - Forus
        - Waystar
        - Humata
        - Infinitus
        - Optum ePA
      rows:
        - label: PA 自动化覆盖
          values:
            - 高 — 覆盖所有药品、支付方、药房；所有专科；美国 50 个州；嵌入 EHR；医疗服务方零成本
            - 高 — PA 模块在完整 RCM 平台内；REST/HL7/EDI API；面向医疗服务方的付费平台
            - 高 — 首次提交批准率 96%；授权触点减少 45%；HITRUST 认证；付费平台
            - 中 — 通过语音 AI（电话）跟进 PA；福利核验；不是嵌入 EHR 的 PA 提交
            - 中 — 在 Optum Rx 药品目录内能力强；限于与 Optum 绑定的计划；由保险方控制
        - label: 患者费用援助登记
          values:
