  - id: TV005
    title: 投资逻辑破裂与否决触发项
    columns:
      - 触发事件
      - 可观察阈值
      - 对投资逻辑的传导
      - 建议动作
    rows:
      - - 主要生物制药合作伙伴不续约或退出
        - 任何具名前三大生物制药合作伙伴公开减少合同金额、终止合作，或公司沟通中可见收入环比下滑 >15%
        - 收入直接断崖；证明集中度风险没有管住；任何情景下都无法支撑 20x 收入倍数
        - 立即暂停任何新投资；必须全面重做承销；基准情景估值降至悲观区间（$200–420M）
      - - 监管要求重构产品架构
        - 联邦或州监管机构（FDA、OCR，或依据州 PA 法执法的 DOJ）发布执法行动或同意令，要求 Forus 在 90 天内实质性修改 AI-PA 工作流
        - 触发重大产品开发成本；拖慢新合作伙伴上线；压缩毛利率；可能限制受影响州的商业模式
        - 重新评估监管暴露深度；测算合规成本对 EBITDA 路径的影响；下调至观察
      - - PHI 数据泄露
        - 任何 OCR 调查、集体诉讼，或公开报道 Forus 或其分包商未经授权披露患者 PHI
        - 医疗数据泄露平均成本为 $7.42M（IBM/ITECS 基准）；损害生物制药合作声誉；可能引发 BAA 终止连锁反应
        - 在解决前立即放弃；泄露范围、遏制速度，以及与合作伙伴的 BAA 状态决定投资逻辑能否修复
      - - 公开市场医疗 AI 倍数压缩
        - Waystar EV/Revenue 跌破 3x（当前 4.2x），或可比私营 AI 医疗公司在 2026–2027 年出现降价轮
        - 向下重校可比估值框架；即使按乐观假设，$1B 入场也越来越难证明合理
        - 下调入场区间；推动价格调整，或等待能支撑更高倍数的财务披露
      - - CEO / CTO 层级领导离任
        - 创始人离任，或高管层非计划变动且 60 天内没有明确具备资质的继任者
        - 网络与生物制药关系可能依赖创始人；在合作伙伴关系未披露的公司里，关键人风险被放大
        - 立即与董事会沟通继任计划；在情况清晰前，暂缓部署任何已承诺资本
    notes: 触发项是根据已识别风险登记表（第 07 章风险）推导出的前瞻性观察。阈值是分析师定义的监测标准，不是合同契约。每个触发项都应纳入主动监测计划，并按季度对照指定可观察阈值复核。
    claimRefs:
