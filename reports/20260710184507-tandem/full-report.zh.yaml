      - number: '7.5'
        title: 技术和模型风险
        blocks:
          - type: paragraph
            body: >
              Forus 的 AI 模型运行在组合复杂度很高的规则空间：每一种药物、支付方和药房组合，都可能有不同的事先授权标准、用药目录层级、阶梯治疗要求和患者援助计划规则。维护这套规则库，需要 Dr. Adam
              Harris 和 Kathleen Alvarez, NP 领导的 Clinical Intelligence
              团队持续人工监督；但公开信息没有说明模型多久重训一次，支付方规则在周期中变化时如何检测漂移，或模型建议与人工审核者判断冲突时有什么覆盖治理。


              Chambers Healthcare AI 2025 将黑箱问题列为医疗 AI 最重大风险之一：模型缺乏透明度，会让审计更复杂、HIPAA PHI 使用验证更困难，并在 AI
              辅助建议导致治疗延误时引发专业责任问题。这不是理论风险：2026 年 1 月 Stanford 研究记录，医保机构在 PA 审核中使用的 AI 算法错误拒绝了必要医疗服务。Foley 律师确认，黑箱 AI
              会显著增加 HIPAA 合规审计难度，因为外部无法看清哪些 PHI 输入驱动了某个输出。Prosper AI 将模型漂移列为主要技术风险：支付方规则频繁变化，基于历史批准数据训练的模型如果不主动重训，很快会过时。


              在监管技术侧，FDA 2026 年 1 月修订的 CDS 指南只在一个条件下为 AI 临床决策支持工具提供安全港：临床医生独立审阅建议依据。Forus 的全自动 PA
              工作流如果没有额外文档，可能无法在所有使用场景满足这一条件。KFF 记录了 29 个已有或待定 AI PA 监管法律的州；这些法律叠加成碎片化合规义务，成倍扩大治理表面积。Humata Health 和
              Infinitus AI 发布的安全与合规文档，比 Forus 信任中心更细；这引出一个问题：Forus 的合规姿态能否满足医疗系统级大型企业采购标准。Forus
              使用条款包含责任限制条款，把风险转给服务方；面对成熟买家的大型企业合同谈判，这种做法可能制造摩擦。
