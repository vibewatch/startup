  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与政策风险
        blocks:
          - type: paragraph
            body: >
              在事先授权中使用 AI 的监管环境，是 Forus 变化最快的风险维度。Manatt Health 的 2026 年 AI 政策追踪显示，几乎所有州都在积极讨论 AI 立法；已有 25 个以上州提出超过 35
              项法案，专门规范支付方在事先授权和理赔审核中使用 AI。已有两部法律落地：Indiana（2026 年 7 月 1 日生效）禁止健康保险公司在未审阅患者病历的情况下仅靠 AI 下调理赔编码，要求在不利的 PA
              决定中披露 AI 使用情况，并禁止针对治疗复杂患者的服务方定向降码。Utah（2027 年 1 月 1 日生效）要求保险方公开披露是否使用 AI 审核授权请求。


              立法模式指向同一个监管判断：AI 可以辅助，但不能取代持证人员对不利覆盖决定的人工审查。Forus 的核心价值主张是自动化提交
              PA，因此这会变成产品合规层：任何触及拒付或降码决定的工作流——哪怕只是数据中介——只要缺少监督记录，就可能被认定为「单独使用 AI」。KFF 确认，截至 2026 年，已有 29 个州在这一主题上实施法律。


              联邦层面的不确定性又放大州级风险。National Health Law Program 警告，Trump 政府的去监管取向威胁事先授权改革动能；Holland and Knight 2026 年 5
              月的评论确认，州级 AI 监管正在加速填补空白。Manatt 还追踪到多州正在酝酿 AI 产品责任立法；如果 AI 生成的建议导致治疗延误，Forus 可能暴露于民事索赔。FDA 2026 年 1 月修订的
              CDS 指南扩大了不作为医疗器械监管的 AI 工具类别，前提是临床医生独立审阅建议依据；这提供了一些缓冲，但安全港收窄到有医生审阅记录的工作流，而 Forus 并未公开描述这种机制。
