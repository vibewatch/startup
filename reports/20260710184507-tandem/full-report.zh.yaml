      - number: '6.3'
        title: 买方经济性与采用路径
        blocks:
          - type: paragraph
            body: >
              Forus 的采用经济性因客户分层而差异很大。对医疗服务提供者而言，决策是零成本的，由工作流 ROI 驱动：不用每月花 $2,000–$8,000 购买竞品平台，就能消除每周 13
              个员工小时的事先授权导航工作（GC 博客引用 AMA 数据）。对医疗服务提供者免费的设计，把采购决策转化为工作流整合决策，去掉预算周期、IT 审批和 ROI 论证流程。Allergy and
              Rheumatology Specialists of Houston 案例研究展示了这种低摩擦采用模式：管理员在上线电话后立刻提交一张处方，两天内获批，并在同一周内让整个诊所上线，前 7 天发送 30–40
              张处方。


              转介绍和 GPO 渠道把这种低摩擦模型扩展到网络。MedicoCX 把 Forus 作为 GPO 范围内的标准，意味着每家新成员诊所都会在上线期间接触 Forus——Forus 无需额外销售动作。Goodman
              医生向 AQUA Dermatology 的推荐触发了覆盖整个 AQUA 网络的组织级上线推广。这类级联事件会带来不成比例的规模：一个企业级医生集团或 GPO 关系，可以同时带来数百家成员诊所。


              Surescripts、MCG 和 HealthEdge 的可比 PA 自动化研究记录了患者影响，也界定了医疗服务提供者和生物制药在购买 PA 自动化时期望看到什么。Surescripts 与 Fairview
              Health Services 的试点，把因缺失临床信息导致的授权拒批减少了 88%，且许多批准在 30 秒内完成。MCG/Regence/MultiCare 合作获得 2023 KLAS Points of
              Light 奖，把部分手术的平均患者等待时间从 15 天缩短到接近实时。Alithya 为一家大型美国健康保险公司实施的方案，每月处理 9M+ 页文件，直通处理率 80%，每年节省
              $2.5M+。HealthEdge 案例研究记录，每个自动批准的常规请求可节省合计 40 分钟员工时间。这些不是 Forus 结果；它们代表买方评估包括 Forus 在内任何 PA 自动化平台时带来的基准预期。


              大约一半慢性病患者没有按医嘱服药，每年造成估计 $528 billion 的可避免支出。近 80% 的医生报告称，患者因 PA 带来的准入摩擦而放弃治疗。General Catalyst 和 AMA
              引用的这些数字说明，为什么医疗服务提供者（工作流负担）和生物制药企业（未配药处方造成收入损失）都有动机资助和采用 Forus。
