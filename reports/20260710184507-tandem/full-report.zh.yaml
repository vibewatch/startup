      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: PA 摩擦降低与生物医药收入之间没有经验证的转换率
            body: >
              Forus 卖给生物医药的核心价值主张，是提高首次配药率并带来增量药品收入；但没有任何公开来源独立验证这一点。如果没有可信转换率，就无法从药品支出或未履约视角反推 Forus
              真实的可服务可触达市场。投资人在接受任何单一 TAM 数字前，应要求独立结果数据，或自下而上的生物医药定价模型。
            calloutType: risk
            claimRefs:
              - CM019
              - CM020
          - type: callout
            title: 生物医药预算压缩是与 Forus 收入模式最相关的结构性威胁
            body: >
              Inflation Reduction Act 的药价谈判条款和新的 GENEROUS Medicaid Model（2026）都会压缩生物医药制造商在高销量药品上留存的净收入。Forus
              的商业合作来自制造商商业预算，而不是医疗系统 IT 预算；因此，制造商收入和商业支出下降会直接威胁 Forus 的收入曲线。这一风险不同于事先授权 AI 工具通常被标注的临床或监管风险，值得单独做情景建模。
            calloutType: insight
            claimRefs:
              - CM036
              - CM037
          - type: callout
            title: 对医疗服务方免费的模式带来结构性有利的采用路径
            body: >
              Forus 向生物医药收费，而不是向医疗服务方收费，因此消除了主要用户群——医生诊所和医疗系统——的采购门槛。这个结构性选择解释了公司报告的医疗服务方采用量同比 10x 增长，且几乎完全由口碑驱动；也让
              Forus 面对需要收入周期财务团队走正式采购周期的付费 PA 自动化竞品时占优。风险在于，一旦生物医药模式受到冲击（来自预算压缩或对制造商资助工作流的监管审查），医疗服务方侧没有天然的备用收入流。
            calloutType: strength
            claimRefs:
              - CM021
              - CM022
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Forus 的竞争格局拆成五个不同类别，每类都有不同的买方关系、收入模式和能力范围。


              第一类是直接的 AI PA 自动化同业，核心产品是为医疗服务方组织自动化事先授权生命周期。Humata Health 是最相关的同业：其 PAthway 平台覆盖完整 PA
              连续体，从需求判断到临床资料打包、提交、状态监测和授权后监控。它与主要 EHR 原生集成，报告 96% 的首次提交获批率，并持有企业安全认证（HITRUST CSF、SOC 2 Type II）。Develop
              Health 面向以专科药房为中心的 PA 自动化，采用相似的医疗服务方付费模式。两家竞品都没有公开复制 Forus 的可负担性项目登记、生物医药付费经济模型，或从开方点 EHR 触发完整准入工作流的能力。


              第二类是语音 AI 相邻平台：当电子路径不可用时，它们自动化 PA 状态查询和权益核验所需的电话互动。Infinitus 是主要玩家，已完成 8 million+ 次支付方电话，服务 125,000+
              名医疗服务方，并称被 44% 的 Fortune 50 公司采用。Infinitus 在提交后启动，解决的是支付方电话队列；它不是嵌入 EHR 的开方工作流工具，也不处理可负担性登记或药房分流。


              第三类是既有清算所和网络运营商。CoverMyMeds（McKesson）称自己承载约 90% 的电子 PA 交易量，连接美国 94% 的处方量、96% 的药房和 950,000+
              名医疗专业人员。这种网络规模是最强的既有护城河：通过 CoverMyMeds 路由，已经默认嵌入 EHR 工作流、支付方门户和 PBM 系统。Change Healthcare 现隶属
              Optum/UnitedHealth Group，运营互补的 e-PA 清算所。2024 年 2 月 Change Healthcare 遭遇勒索软件攻击，这是美国医疗史上最大数据泄露事件；它扰乱了 80%
              受影响诊所的事先授权工作流，也暴露出集中式清算所基础设施的系统性脆弱。


              第四类是 RCM 平台竞品。Waystar 把 PA 授权管理作为统一收入周期管理套件中的模块，服务超过 1 million 名医疗服务方，覆盖美国 60% 的患者人群。其 PA 模块与 Epic、Cerner
              和 MEDITECH 集成，重点是财务清结和拒付预防，而不是处方准入或生物医药互动。


              第五类也是最大的类别，是替代方案池：人工员工手动穿行支付方门户、EHR 原生 PA 模块（Epic 内置 PA 功能、Oracle Health）、传统生物医药 hub
              供应商，以及大型医疗系统或药企的内部自建。CAQH 2025 Index 发现，2024 年只有 40% 的事先授权交易以电子方式处理，确认人工替代仍是所有 PA 自动化供应商竞争所面对的多数基线。根据 AMA
              2026 年行动包，医生平均每周完成 39 个 PA，消耗约 13 个员工小时。
