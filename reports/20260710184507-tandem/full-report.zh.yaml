      X 轴：工作流广度（1=提交后或仅 PA；10=覆盖 PA + 可负担性 + 路由 + 患者沟通的完整处方可及性）。Y 轴：医疗服务方端成本消除（1=完整医疗服务方付费企业合同；10=对医疗服务方免费、生物制药
      付费）。分数是有证据支撑的序数判断。CoverMyMeds 在 Y 轴得 5 分，因为其收入主要来自网络 / 支付方费用，而非 医疗服务方软件合同，但医疗服务方不能免费获得可负担性或路由优化。手工 / 现状在 Y 轴得 6
