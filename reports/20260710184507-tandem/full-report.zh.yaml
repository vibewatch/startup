  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与收入流
        blocks:
          - type: paragraph
            body: >
              Forus 的收入完全来自三边网络中的生物制药一侧（医疗服务提供者、患者、生物制药企业），这与其让临床医生和患者免费获得处方准入的使命一致。官方 2026 年 5 月公告和同期 Forbes
              专访描述的商业模型是：制药企业向 Forus
              付费，换取三类价值：（1）在临床决策时点优先触达开方医生网络；（2）来自真实工作流处理的一手数据，包括处方启动、事先授权结果、药物目录例外模式和患者依从性；（3）药物上市支持服务，借助 Forus
              的医疗服务提供者和药房网络，加快新获批药物的首次配药。公告发布时，全球收入前 10 的生物制药公司中已有 5 家与 Forus 合作——这一渗透率意味着 Forus
              已经跨过与最大制药买方开展商业合作所需的临床验证和合规门槛。


              对医疗服务提供者免费的设计本身就是商业机制，不只是市场进入补贴。可比 PA 自动化软件每月要花 $2,000–$8,000（基于 Linear Health 行业基准），人工外包每次授权要花
              $7–$15（同一来源）。Forus
              去掉医疗服务提供者这端的预算摩擦，形成采用飞轮：医疗服务提供者增长扩大处方流数据资产，反过来又提高生物制药企业对商业准入合作的估值。因而，网络规模既是产品，也是每一次生物制药销售对话里的证明点。公告时，Forus
              覆盖接近 80% 的美国居民邮编，并覆盖全美 50 个州的数千家诊所和医疗系统。


              公开来源支持或可以推断出三类收入流，另有两类仍属猜测。证据最充分的是生物制药商业上市合作费：药企付费，让自家药物上市嵌入 Forus
              的医疗服务提供者互动层，加快新获批或新纳入覆盖疗法的采用。第二类是处方流数据授权，即把匿名化真实世界数据出售或打包进商业准入合同，数据包括 PA
              批准模式、药物目录动态和依从性指标。第三类是患者费用支持项目促成费——药企资助免费的患者援助项目（PAP）和共付卡登记；Forus
              很可能因在临床工作流中简化登记而收取促成费。另两类收入流（药房路由渠道费和未来分析 SaaS）仍属猜测，当前公开证据不支持。


              Forbes 文章是唯一公开给出收入规模的来源：截至 2025 年底，年化收入超过 $10 million；截至 2026 年 5 月，当年迄今收入“约增长五倍”。取中点看，年化运行收入大约在 $45–55
              million 区间——这个数字来自生物制药合同扩张，而不是向新医疗服务提供者收费。在企业销售周期较长的 B2B 模型中，这样的增长速度更像是 5 家主要生物制药伙伴同时从初始试点扩展到多药物商业部署。
