      - number: '5.3'
        title: 安全、合规与监督
        blocks:
          - type: paragraph
            body: >
              Forus 的合规姿态比多数 Series B 阶段数字健康公司披露得更充分。公司信任中心（security.forus.com，由 SafeBase 支持）宣布，Sensiba LLP 已连续完成两次无保留
              SOC 2 Type II 审计：第一次覆盖 2024 年 2 月至 2025 年 1 月期间（以 Tandem 品牌完成），第三次覆盖 2025 年 2 月至 2026 年 1 月期间（以 Forus
              品牌完成，未注明例外）。两份报告覆盖 AICPA 信任服务标准：安全性、可用性、处理完整性、保密性和隐私。另有一项截至 2025 年 1 月期间的第二次已完成审计也被提及。


              使用条款（forus.com/tou，最后修改于 2026 年 5 月 12 日）把法律实体标识为“Forus, Inc.”，并把受治理网站列为 withtandem.com（反映品牌更名仍在进行）。ToU
              包含标准 IP 和遵守法律条款，但没有处理医疗行业特定义务。隐私政策（forus.com/pp）是最接近 HIPAA 的主要公开文件；它覆盖从医疗服务提供者、患者和网站收集的数据类型，但没有确认是否存在 BAA
              模板、子处理方名单或 HITRUST 认证。


              与 Humata Health 相比——后者公开确认 SOC 2 Type II、HIPAA 合规和 HITRUST CSF v9.5.0 r2 认证——Forus 的 HITRUST
              状态无法从公开来源确认。Humata 还列出合规和安全两个联系邮箱，而 Forus 的信任中心是主要公开面向渠道。


              前几章中的监管和法律背景仍然重要：


              KFF 调查（2025）和 Stanford AI 健康保险研究（2026）都提出了对 AI 驱动 PA 决策准确性，以及自动拒批中种族/社会经济偏见的担忧。Holland & Knight 法律分析记录，截至
              2026 年 5 月，州层面 AI 医疗法案超过 25 项。Health Law Program 的联邦 AI 政策简报（2026）指出，联邦事先授权改革可能收窄 PA
              自动化公司可运营的行政范围。虽然这些风险适用于整个品类，但 Forus 的具体治理回应没有公开披露：Clinical Intelligence
              团队如何监测偏见，申诉/人工覆盖升级路径是什么，是否发布临床决策改判比例。


              Change Healthcare 网络攻击（2024 年 2 月，AHA 报道）暴露了集中式医疗清算所架构的系统性脆弱：一次勒索软件事件就扰乱了美国医疗市场相当一部分的理赔处理。Forus
              平台位于处方工作流中同样高关键性的节点。它的灾难恢复计划、事件响应能力和冗余架构都没有公开披露。


              已确认的关键合规项目：SOC 2 Type II（三次连续审计，均为无保留意见）。未知的关键合规项目：HITRUST 状态；具体 BAA 条款和子处理方名单；正常运行时间 SLA
              和状态页；人工覆盖/升级治理；AI 偏见监测；事件响应和灾难恢复文件。
            claimRefs:
