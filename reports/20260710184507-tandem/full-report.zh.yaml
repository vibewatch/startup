        - 确认是否存在 EHR 集成费或认证成本，并在服务方基数中摊销；询问每家诊所入驻成本
      - - 净收入留存（生物制药）
        - 未知；2026 上半年收入增长 5x 表明 NRR 远高于 100%，若扩展合同占主导，可能为 150–200%
        - 很低（根据增长轨迹推断）
        - NRR 高于 120% 可确认 cohort 扩张并降低集中风险；NRR 低于 100% 会提示流失
        - 要求提供生物制药合同的 vintage cohort 数据：起始 ARR、当前 ARR、续约、流失 logo、按药品数的扩展率
      - - 估计年度现金消耗
        - 按约 100 名纽约 FTE、每人完全加载 $150–250K 估计，约 $18–35M / 年；不含增长招聘或生物制药上市 COGS
        - 很低（结构性估计，未披露）
        - 决定 $160M 融资对应的 runway；若 burn 明显高于估计，2027–2028 年可能需要 Series C
        - 在 NDA 下要求提供月度银行流水或管理账，显示实际月度现金消耗和期末现金余额
      - - 单个生物制药合作伙伴收入（平均）
        - 若 5 个合作伙伴和约 $50M run rate 平均分布，估计为 ~$9–11M；实际可能高度偏斜
        - 很低（按 Forbes 数据倒推，假设平均分布）
        - 收入集中度测试：若第一大合作伙伴 > 40% 收入，其离开会造成重大风险
        - 要求提供前 3 / 前 5 大客户占总收入百分比；确认合作伙伴 cohort 的 HHI
