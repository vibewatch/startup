  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 工作流与产品范围
        blocks:
          - type: paragraph
            body: >
              Forus 作为嵌入式处方准入层，运行在医生现有 EHR 工作流内部。触发点是临床医生在 EHR 中开出处方的瞬间；平台拦截这笔医嘱，并执行后续每一个行政步骤，临床医生不需要离开原生工作流，也不需要打开单独门户。


              已确认的产品模块覆盖四类不同任务：


              **事先授权自动化。** Forus 根据 EHR 处方数据自动生成并向支付方提交 PA 表单，套用支付方特定标准和临床指南，并管理被拒授权的申诉。Forus
              官网称，平台“自动化每一次从处方到批准的事先授权——生成申诉、把处方路由到正确药房”。公司博客中的医疗服务提供者证言称，诊所团队把电话时间从“每天 60% 到 70%……现在降到大约 15%”，一名 GI
              生物制剂协调员采用后将 PA 处理量提升至三倍。


              **患者费用支持登记。** 对因费用而可能被放弃的处方，Forus 会自动为患者登记制造商患者援助项目（PAP）、共付卡和财务支持项目。该模块完全由生物制药企业出资。


              **药房路由与履约。** 准入确认后，Forus 将每张处方路由到合适的零售药房、专科药房或邮寄药房。平台被描述为覆盖全国每一家药房。面向患者的短信会提供状态更新，包括确认哪家药房负责配药以及预计取药时间。


              **患者沟通层。** 自动短信工作流在每个交接点告知患者：保险决定、药房路由、可取药状态。这减少了打给诊所员工的来电。


              OpenEvidence 合作（2026 年 4 月 2 日宣布）正式把 Forus 连接到一个 AI 临床决策支持工具；该工具在美国每天用于超过 1 million 次临床咨询，使医生在
              OpenEvidence 中作出的循证开方决策，可以直接交接给 Forus 的准入自动化。这是唯一公开点名的 EHR 或临床工具集成伙伴。


              平台覆盖美国全部 50 个州，覆盖数千家诊所和医疗系统，每年支持数百万患者。医疗服务提供者采用量连续两年同比增长 10 倍。公司没有公开披露具体哪些 EHR 系统已正式认证或集成、有多少独立支付方连接，或提交的
              PA 中有多大比例自动获批、多少需要人工跟进。
