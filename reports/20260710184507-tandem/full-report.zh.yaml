      - number: '6.4'
        title: 留存、耐久性与集中度风险
        blocks:
          - type: paragraph
            body: >
              Forus
              的客户故事存在重大证据缺口，限制了对留存耐久性和集中度风险的判断。净收入留存（NRR）、毛收入留存（GRR）、医疗服务提供者流失率、生物制药续约率或任何队列数据均未公开披露。医疗服务提供者采用量连续两年同比增长
              10 倍，与早期快速采用一致，但无法说明早期队列是否被留住、扩张或流失。对生物制药而言，2026 年上半年的 5
              倍收入跃升，可能来自现有伙伴关系的深度扩张，也可能来自新增伙伴——二者对收入质量评估的影响截然不同。


              具名客户标识仍局限于一小组专科诊所。尽管公司称覆盖“数千家”诊所和“全美 50 个州的医疗系统”，但截至 2026 年 5 月公告，公开具名参考客户只有 5 家专科诊所和 1 家
              GPO。没有任何医院系统、学术医学中心或大型医疗系统在公开文件中被列为参考客户。同样，任何新闻稿、投资者博客或案例研究都没有出现制药公司名称。这个可参考性缺口对尽调很重要：潜在企业客户、投资者和收购方若没有
              Forus 协助，无法通过与具名账户通话来独立验证采用主张。


              截至报告日，在独立评论平台（G2、Capterra、KLAS Peer Reviews）搜索 Forus 或 Tandem Technology，没有找到公开评论或评分。5 个具名客户案例研究全部由 Forus
              自行撰写和发布，形成公司来源证据固有的利益冲突：不满意客户不太可能出现在公司撰写的内容中。


              医疗系统和生物制药客户会带来额外采购摩擦。医疗系统在部署 AI 辅助处方自动化工具前，通常要求 HIPAA BAA、IT 安全审查（SOC 2、HITRUST 或等同项）、指导委员会批准、EHR
              厂商认证审查和临床工作流验证——整个过程可能需要 6–18 个月。Forus 连续三次无保留 SOC 2 Type II 审计解决了安全信任障碍，但公司没有公开声称获得 HITRUST
              认证，这可能限制其对合规要求更严格的企业级医疗系统的吸引力。


              生物制药伙伴还面对特定隐私和数据治理顾虑。由于 Forus 汇总跨药物、支付方和开方医生的处方启动数据，每个生物制药伙伴都必须评估共享网络数据是否会给自身处方表现数据带来披露风险。反垄断审查也需要纳入：如果多家前
              10 大生物制药公司共享 Forus 的处方流数据资产，平台内部竞争信息隔离会成为问题。没有公开文件说明 Forus 如何在生物制药伙伴之间设计数据隔离。


              AMA 2024 事先授权医师调查记录，35% 的医生报告有严重不良事件与 PA 延误有关，61% 担心未受监管的 AI 被用于增加拒批——这说明医疗服务提供者采用任何 AI 辅助 PA
              工具都需要持续建立信任，也说明监管环境可能提高对 AI 嵌入式处方自动化的广泛审查，而不只是针对支付方工具。
