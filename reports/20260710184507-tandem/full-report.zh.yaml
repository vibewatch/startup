      - number: '7.4'
        title: 商业和执行风险
        blocks:
          - type: paragraph
            body: >
              Forus 收入模式在结构上集中于生物制药商业合作。截至 2026 年 5 月 $160M 融资公告，全球前十的生物制药公司中有五家被列为合作伙伴，年化收入运行率超过 $50
              million。不过，合作伙伴名称、治疗领域、合同期限、续约结构或最低承诺水平都没有公开披露。仅凭公开证据，无法独立评估客户集中度、续约风险和流失暴露。公司向服务方和患者完全免费提供平台，这有助于服务方采用，但一旦一个或多个生物制药伙伴减少支出或终止合作，公司缺少多元收入缓冲。


              按 CEO 表述，服务方采用量已连续两年同比增长 10×，但未找到 G2、KLAS、HITRUST 或 Capterra 的独立评价。缺少第三方证明会制造采购阻力，尤其是在大型医疗系统的 IT
              和安全团队那里；这些团队通常要求独立认证后才批准供应商。医疗系统还可能要求专属客户成功资源；以 Forus 约 100 人的团队规模，大规模提供这类资源并不容易。AMA 2026 年 National
              Advocacy Conference 的事先授权行动工具包记录了医生对 AI 驱动拒付风险的担忧；这种担忧直接影响服务方是否愿意信任 AI 中介，构成间接采用逆风。


              Prosper AI 市场分析将商品化和多栖风险列为紧迫问题，因为支付方网络正在内部开发自有 AI 自动化，竞争工具也在增多。CoverMyMeds、Waystar、Humata 和 Infinitus
              都服务相邻或重叠的 PA 自动化工作流；如果支付方把直接 AI PA 提交集成到自己的门户，Forus
              作为中介的价值可能被削弱。快速扩张要求——覆盖每一种药物、支付方和药房——意味着必须持续投入运营，维护支付方规则库、处理边缘案例并新增用药目录数据；即使收入扩张，这些工作也会压迫人手和烧钱。
