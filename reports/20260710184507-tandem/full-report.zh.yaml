      - number: '2.3'
        title: 买方与用户细分
        blocks:
          - type: paragraph
            body: >
              Forus 的市场包含四类不同参与者，它们的经济利益显著分化；这一复杂性会塑造获客销售路径、定价和监管暴露。


              细分 1 — 生物医药制造商（经济买方 / 商业伙伴）。Forus 的主要收入来源是生物医药公司，尤其是那些上市专科药的公司；PA 获批率、从开方到治疗的时间和患者依从性会直接影响这些药品的商业表现。截至
              2026 年 5 月，全球前十大生物医药公司中已有五家是 Forus 合作伙伴。制造商资助 Forus 合作，用的是商业预算，而不是 IT
              或医疗技术采购预算，具体来自患者服务、市场准入和现场报销团队。因此预算所有者是商业或市场准入高管，而不是 CIO 或
              CTO。触发支出的因素包括新药上市、处方集地位变化、竞争分子进入，或支付方政策调整。采用限制在于，生物医药公司已经有 hub 供应商、专科药房合同和患者服务基础设施；Forus
              必须先证明更高的首次配药率和网络广度，才可能替代既有关系。


              细分 2 — 专科诊所和医疗系统（用户 / 受益方）。肿瘤科、风湿科、皮肤科、GI 诊所、神经科中心和医疗系统专科部门中的医生、诊所管理员和临床协调员，是 Forus 平台的主要工作流用户。Forus 嵌入
              EHR，并对医疗服务方免费。采用决策人通常是事先授权协调员或诊所经理，他们按速度、EHR 集成质量和拒付降低率评估工具。AMA 2024 年调查发现，医生及其员工平均每周花 13 小时处理 PA 任务；Forus
              正面解决这个负担。采用触发因素包括护理协调痛点、员工倦怠，或同行诊所推荐。


              细分 3 — 诊所管理员和收入周期负责人（运营方 / 采购把关人）。在大型医疗系统中，收入周期管理总监、医生服务副总裁，或药房与生物制剂团队负责人，可能会正式评估并采购 PA 自动化工具。Humata
              Health 买方指南（2026）和 Develop Health 指南（2026）都指出，PA 自动化的买方评估框架关注 EHR 集成深度、支付方连接、自动化范围和拒付率改善，而不只是前期成本。由于 Forus
              对医疗服务方免费，采购阻力低于付费竞品；但企业级医疗系统在大规模部署前，仍可能要求数据安全审查、工作流集成评估和临床结果验证。


              细分 4 — 患者（受益方，不是支付方）。患者是工作流改善的下游接受者。他们不直接为 Forus 付费，也不是商业采用中的决策者。不过，患者体验结果，包括治疗启动速度、共付降低和状态透明度，是 Forus
              向医疗服务方和生物医药双方营销的价值。KFF 2026 年民调发现，患有慢性病的参保成年人更容易受到 PA 延迟影响；这个群体是 Forus 自动化的主要受益者，他们的结果数据构成了 Forus
              说服生物医药合作伙伴的最有力营销证据。


              一个重要的结构性细节是：在生物医药付费模式中，支付方和受益方彼此完全分离，用户（医生 / 协调员）也不是支付方。这种三方分离（支付方 = 生物医药，用户 = 医疗服务方团队，受益方 =
              患者）意味着采用、变现和价值交付各有不同利益相关方。指向任一层的监管审查，例如针对支付方在 PA 决策中使用 AI 的州级 AI 监督立法，都可能影响 Forus 的运营环境，哪怕 Forus
              不是支付方，也不做覆盖决定。
            claimRefs:
              - CM021
              - CM022
              - CM023
              - CM024
