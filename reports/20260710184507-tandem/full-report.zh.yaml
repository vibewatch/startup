  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层
        blocks:
          - type: paragraph
            body: >
              Forus
              运营一个三边市场，买方、用户和付费方角色不同。医疗服务提供者——主要是专科诊所及其临床员工——是平台的主要用户。患者是最终受益者，获得更快治疗准入、通过费用支持项目登记降低自付成本，并收到主动状态沟通。生物制药制造商是主要付费方：它们出资支持对医疗服务提供者免费的模型，换取临床决策时点的商业准入、处方流数据和药物上市支持服务。这个三方结构意味着“客户”一词需要看语境；本章覆盖全部三层，但会区分付费客户（生物制药）、用户客户（医疗服务提供者）和受益者（患者）。


              在医疗服务提供者中，公开记录的客户基础集中在 PA 负担高的专科类别：皮肤科（Goodman Dermatology、Optima Dermatology、AQUA
              Dermatology）、过敏与风湿科（Allergy and Rheumatology Specialists of Houston、US Allergy and Asthma），以及胃肠科/GI
              生物制剂（Digestive Health Specialists）。这些专科共享相似工作流：生物制剂开方率高、每种药物对应复杂支付方规则、PA 要求频繁，消耗过多协调员时间。肿瘤科、神经科和其他高 PA
              专科被描述为可服务市场，但没有具名案例。


              GPO 和渠道伙伴构成第二个分发分层。MedicoCX 是一家全国性 GPO，服务 300+ 家独立诊所，主要在过敏领域；它集中采用 Forus，并把 Forus 嵌入所有新成员诊所的上线流程，形成 B2B2B
              分发层。OpenEvidence 每天为美国医生提供超过 1 million 次临床咨询，并于 2026 年 4 月 2 日宣布与 Forus 建立战略合作，把临床决策支持与 Forus
              的处方准入自动化整合。这些合作把 Forus 的触达扩展到逐家诊所直销之外。


              生物制药分层只以汇总口径描述：全球收入前 10 的生物制药公司中有 5
              家是合作伙伴。公司名称、治疗领域或合同结构均未公开披露。医疗系统被描述为医疗服务提供者基础的一部分（“数千家医疗系统”），但公开案例研究或新闻稿没有点名任何系统。
