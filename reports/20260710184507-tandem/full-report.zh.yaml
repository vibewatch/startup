      - number: '3.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 结构性护城河：生物制药出资、对医疗服务提供者免费
            body: >
              在 PA
              自动化层，公开画像的竞品没有一家采用生物制药出资、对医疗服务提供者免费的经济模型。医疗服务提供者采用时不受自身预算周期限制，收入模型也与生物制药企业对齐：它们最在意首次配药率，也有财力在药物上市规模上资助这张网络。
