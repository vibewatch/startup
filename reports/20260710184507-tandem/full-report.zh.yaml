  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 从已确认的证据输入（网络规模、收入锚点、融资）到风险折扣因素（集中度、监管、利润率不透明），再到“跟踪 / 继续研究”建议以及可把结论推向买入的六项尽调闸门的决策链。
    approximationNotes: 网络规模和收入锚点已由公开来源确认。风险折扣因素由分析师根据公开监管和竞争对手证据评估。推荐节点反映基准情景估值分析；若完整 NDA 数据室解决毛利率、NRR 和集中度问题，终端节点可能转为“以 $700M–$1B 买入”。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV022
      - CV030
      - CV033
      - CV034
      - CV040
    data:
      nodes:
        - id: evidence-in
          label: 已确认的证据输入
          detail: 网络：约 80% 美国邮编区、美国 50 个州；收入：年化约 $50M（Forbes）；融资：已融资 >$160M；伙伴：全球前 10 大生物医药公司中的 5 家。
        - id: strategic-value
          label: 战略价值层（$600M–$1B+）
          detail: 处方分流网络、生物医药商业准入数据资产和医疗服务方免费护城河，使其成为清算通道、支付方或连锁药房在位者的战略收购标的。
        - id: risk-discounts
          label: 风险折扣因素
          detail: 生物医药集中度（未披露）；毛利率不透明；监管重构风险（35+ 项州法案）；Waystar 倍数压缩先例（2026 年 -43.5%）。
        - id: diligence-gate
          label: 六项阻断性尽调事项
          detail: 毛利率、烧钱率、NRR、合约集中度、BAA / 去标识化治理、清算通道冗余——均未公开可得。
        - id: base-valuation
          label: 基准情境公允价值：$500M–$750M
          detail: 按过去 12 个月收入的 10–15x、1.5–2x 增长假设、估算 55–70% 毛利率测算；在基准假设下，$1B 估值标记偏高 30–50%。
        - id: recommendation
          label: 建议：跟踪 / 继续研究
          detail: 若以 $1B 进入，需要确认乐观情境（>65% GM、>105% NRR、合作伙伴多元化）。二级市场在 $400M–$700M 进入，才有安全边际。NDA 尽调若解决六项阻断问题，投资结论可能转为买入。
  - id: FV002
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: >-
      截至 2026 年 6 月，Forus 的乐观、基准和悲观估值区间；测算依据包括收入锚点（Forbes 披露的 $50M 年化收入）、各情境的增长与倍数假设，以及可比公司区间分析。M&A
      战略退出情境单列为上行期权价值，不计入独立财务区间。
    approximationNotes: >-
      所有区间均为分析师估算。收入锚点（$50M）来自公司通过 Forbes 披露，未经审计。倍数来自 Waystar 公开市场 EV/Revenue（4.2x）、非上市 AI 医疗成长阶段区间（10–15x）以及 Abridge
      Series E ARR 倍数（约 53x）。毛利率、NRR 和集中度假设随情境而变，均未验证。M&A 溢价估计（DCF 的 2–3x）基于 Change Healthcare 收购先例和 Surescripts
      战略护城河类比，并非具有约束力的收购意向。
    claimRefs:
      - CV022
      - CV025
      - CV026
      - CV027
      - CV028
      - CV030
    data:
      items:
        - label: 悲观：独立财务 DCF
          low: 200
          high: 420
          unit: $M
          detail: 收入增长停在 $50–70M；按 4–6x EV/Revenue（Waystar 可比）计，反映监管压力和集中度风险。相对 $1B 估值标记折价 58–80%。
        - label: 基准：非上市成长阶段
          low: 500
          high: 750
          unit: $M
          detail: 以 $50M 过去 12 个月收入套用 10–15x；假设年增长 1.5–2x；毛利率估算为 55–70%。相对 $1B 估值标记折价 25–50%。$400–700M 的二级市场入场价提供安全边际。
        - label: 乐观：高增长经济性已确认
          low: 1000
          high: 1500
          unit: $M
          detail: 按 2027 年 $125–150M 远期收入的 8–10x；确认 >70% 毛利率；验证 >105% NRR；新增 3+ 个生物制药合作伙伴。可支撑 $1B 或更高入场价。
        - label: M&A 战略退出（期权价值）
          low: 1500
          high: 2500
          unit: $M
          detail: 战略收购方（清算所、支付方、药房连锁）为处方路由网络支付独立 DCF 的 2–3x 控制权溢价。不能作为基准情境承销；在战略交易进程中代表非对称上行。
  - id: FV003
    title: 估值敏感性——收入倍数情境
    type: bar
    layout: wide
    summary: >-
      在 Forus $50M 年化收入基础上，以五档收入倍数推导企业价值，范围从 Waystar 公开市场底部（4.2x）到接近 Abridge 的高增长溢价（30x）。当前披露的 $1B 估值对应 20x
      情境。敏感性分析展示投资论点里内含的倍数压缩 / 扩张风险。
    approximationNotes: >-
      收入基准 $50M 为公司通过 Forbes 披露（截至 2026 年 5 月年化），未经审计。每根柱子代表隐含企业价值 = $50M × 所示收入倍数。未假设杠杆或优先股权堆栈。30x「相邻 AI 可比」柱以 Abridge
      约 $100M ARR、$5.3B 估值作为方向性上限，不是目标价。
    claimRefs:
      - CV008
      - CV013
      - CV022
      - CV024
      - CV025
    data:
      items:
        - label: 4.2x — Waystar 公开市场 EV/Rev
          value: 210
          unit: $M
          detail: 公开市场底部：将 Waystar 当前 EV/Revenue 倍数套用到 $50M。如果增长叙事落空，代表完全按公开市场重估的风险。
        - label: 10x — 基准非上市成长
          value: 500
          unit: $M
          detail: 医疗 AI 的毛利率画像尚未验证，因此采用保守的非上市成长阶段倍数。基准情境下沿。
        - label: 15x — 高溢价非上市成长
          value: 750
          unit: $M
          detail: 适用于已确认 1.5–2x 年增长、毛利率 60–70% 的情境。基准情境上沿。
        - label: 20x — 当前 $1B 估值标记
          value: 1000
          unit: $M
          detail: $50M 收入对应披露的 $1B 估值，隐含 20x。若要在基准假设下站得住，需要确认乐观情境。
        - label: 30x — 相邻 AI 可比标的
          value: 1500
          unit: $M
          detail: 以 Abridge 约 53x ARR 作为天花板，再按 Forus 公开验证更少、收入模式不同、证据质量更低做调整，得到方向性上限。只有在 M&A 或乐观情境获确认时才可能达到。
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: standard
    summary: 面向 IC 的六项投资维度评分：市场机会、牵引力验证、竞争护城河、财务经济性、风险画像和证据质量。评分反映截至 2026 年 6 月的公开证据；私下尽调可能大幅提高经济性和证据质量得分。
    approximationNotes: 评分仅基于公开证据，由分析师判断。「高」= 有强证据支撑；「中」= 方向积极但验证不足；「低」= 公开证据不足，无法给出正面判断。收入和估值数字来自 Forbes 及公开公告。风险评分反映第 07 章分析。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV022
      - CV033
      - CV034
    data:
      items:
        - label: 市场机会
          value: High
          detail: 事前授权和处方可及性自动化瞄准每年 $530M+ 的行政浪费；生物制药商业化上市市场单个药品支出 $50–200M；TAM 大，且有结构性增长。
        - label: 牵引力验证
          value: Medium
          detail: 约 $50M 年化收入和 5 家 top-10 生物制药合作伙伴确认了商业验证，但留存、满意度和产品深度指标尚未由独立第三方验证。
        - label: 竞争护城河
          value: Medium-High
          detail: 覆盖美国 80% 邮编、生物制药付费且医疗服务方免费的模式、第一方实时 PA 数据共同形成网络效应护城河；护城河能不能耐久，还要验证 EHR 集成认证，并确认支付方连接广度。
        - label: 财务经济性
          value: Low-to-Medium
          detail: 收入增速极高（6 个月约 5x）；毛利率、NRR、烧钱速度和集中度完全属于非公开信息；NDA 尽调完成前，承销信心偏低。
        - label: 风险画像
          value: High Risk
          detail: 监管（35+ 项 AI-PA 法案）、集中度（未披露的生物制药合作伙伴）、基础设施（依赖清算所）和隐私（BAA / 去标识化缺口）风险都存在；单一风险单独看大概率都不致命。
        - label: 证据质量
          value: Low-to-Medium
          detail: 公司披露指标（Forbes）是唯一财务锚点；没有独立分析师覆盖（KLAS、G2、Gartner），没有审计财报，没有具名客户。网络规模指标原则上可独立验证，但未由第三方审计。
