      - number: '2.2'
        title: 市场规模测算：多重视角
        blocks:
          - type: paragraph
            body: >
              没有任何一个公开市场估算能干净地覆盖 Forus 的可触达机会。本节给出四个互补测算视角，并明确保留每个视角中的矛盾和限制。


              视角 1 — 事先授权行政节省机会。CAQH 2025 Index（2026 年发布，覆盖代表 63% 参保人群的 600 家医疗服务方组织和健康计划）估算，医疗行政自动化的剩余年度节省总额为 $18.7
              billion。事先授权被明确标记为自动化程度最低的主要交易类别。CAQH 另行估算，直接事先授权自动化可节省 $50–60
              million；该数字只反映文书交易成本，不包括医生时间、延迟护理成本或药物放弃成本。Chiefhealthcareexecutive.com 2026 年 3 月在 ViVE 对 CAQH CEO Sarah
              Ahmad 的采访中，把如果所有交易完全电子化后的完整行政自动化机会扩展到 $21 billion。重要限制：这些数字衡量的是行政工作流本身的成本，而不是对药品制造商的下游收入影响；后者才是 Forus
              真正的收入模式。


              视角 2 — 专科药支出与捕获上行。美国处方药支出在 2025 年达到 $915 billion，较 2024 年增长 12.7%，预计 2026 年超过 $1 trillion（ASHP/AJHP
              2026）。专科药占药品支出的约 54%（2024 年 $263 billion），尽管处方量不到 5%。仅 GLP-1 激动剂 2025 年就约为 $132 billion（约占全部处方支出的
              14%）。受专科药和注射药推动，诊所 2025 年药品支出增长 19%。Mercer 2026 drug trend report 预计，2025–2026 年专科药趋势为 7–11%，2026–2027 年为
              6.5–10.5%。重要限制：Forus 不从药品支出中分成；生物医药变现机制是商业合作费，而不是收入分成。


              视角 3 — 患者准入 hub 与支持基础设施市场。Cardinal Health 的 2026 Hub Evolution Benchmark Report 调查了 200 家生物医药制造商的外包 hub
              策略。该报告没有给出 hub / 患者服务市场规模，但将其描述为正经历供应商整合和运营重估。历史分析师估算曾把专科药患者服务市场锚定在 $3–6
              billion；这一范围无法从当前来源集中得到佐证，因此明确标记为证据缺口。ICER 2025 Launch Price and Access Report 指出，专科药准入障碍，包括事先授权和 hub
              摩擦，是不同支付方类型之间准入不平等的有记录来源。重要限制：Forus 面对的不只是独立 hub 供应商，还包括药企内部 hub 运营和嵌入专科药房的准入项目。


              视角 4 — 处方未履约作为市场问题的量级。KFF 2026 年 1 月民调发现，47% 的所有参保成年人、57% 的慢性病患者在过去两年中曾遇到处方或服务被拒绝、延迟或更改。AMA 2024 年调查发现，82%
              的医生表示 PA 要求会让患者放弃治疗。假设 $263 billion 的专科药市场中哪怕只有 5% 代表因 PA 摩擦而放弃的治疗，对应的未实现药品收入也约为每年 $13
              billion；这个数字界定了生物医药制造商可能集体为解决问题支付的理论上限。重要限制：放弃治疗的因果是多因素的，公共记录中没有经验证的转换率能把 PA 摩擦降低映射到生物医药收入增量。


              跨视角综合。Forus 的收入模式意味着，真正相关的可服务可触达市场，是生物医药在新药上市和患者准入基础设施上的商业支出的一个子集，而不是整个行政成本池或药品支出宇宙。公司 2026 年年化收入据报超过 $50
              million，说明早期渗透已具备意义。CMS 的 Medicaid 处方药支出在 2024 年超过 $100 billion（返利前），新 GENEROUS Medicaid Model（2026
              年宣布）引入最惠国定价，可能重塑制造商返利结构，并间接影响 hub 项目经济性。


              这些视角不能相加；它们衡量的是同一底层摩擦问题的不同经济层。投资人应对任何单一 TAM 数字保持怀疑，直到 Forus 披露足够细的生物医药定价模型，可以自下而上搭建 SAM。
            claimRefs:
