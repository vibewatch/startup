      - number: '1.2'
        title: 创始人与领导层
        blocks:
          - type: paragraph
            body: >
              Sahir Jaggi 现年 31 岁，是公开资料中唯一具名的创始人，并担任首席执行官。Jaggi 出生于印度移民家庭，在纽约州北部长大。他在 Columbia University
              学习生物医学工程；毕业后在保险创业公司 Oscar Health 工作约六年，Oscar Health 由 Thrive Capital 管理合伙人 Josh Kushner 联合创立。Jaggi 在 Oscar
              Health 晋升为产品战略总监，也因此直接接触到处方药覆盖和事先授权工作流中的复杂性与系统性低效。他还曾是面向学生的风投基金 Rough Draft Ventures 的合伙人。2025 年 1
              月，Forbes 将 Jaggi 评入 30 Under 30 Healthcare。


              公司没有公开列出 CTO、CFO 或 COO。公司材料中可见的运营领导包括 Adam Harris, MD，他负责 Forus 的 Clinical Intelligence 职能。Harris 医生此前是
              Oscar Health 应用 AI 副总裁，目前仍在 Bellevue Hospital Center 执业，并担任 NYU School of Medicine
              医学临床助理教授。他带领团队把临床专业能力直接嵌入产品设计和质量保证，包括支付方规则知识、专科工作流和 PA 细节。Kathleen Alvarez, NP（Yale School of Nursing）也是
              Clinical Intelligence 团队的具名成员，拥有一线护理和风湿病 PA 经验。对 Sahir Jaggi 的关键人依赖很高：他的个人品牌、Oscar Health
              背景带来的创始人-市场匹配，以及投资人关系，都是公司身份和交易流的核心。
