      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 类型
      - 规模 / 收入
      - 估值 / 倍数
      - 对 Forus 的参考意义
      - 局限
    rows:
      - - Waystar (WAY)
        - 上市公司：RCM / 医疗支付工作流
        - $1.16B TTM 收入；$3.56B 市值；$4.87B EV
        - EV/Revenue 4.21x；P/S 3.0x；远期 P/E 11x；股价较 2025 年下跌 43.5%
        - 最接近的上市可比：医疗工作流自动化、事先授权、RCM；Black Book 2026 RCM 智能体 AI 第 1 名
        - 规模不匹配（收入为 Forus 的 23x）；增长阶段和利润率画像不同；公开市场倍数反映成熟增长预期
      - - Abridge（私营）
        - 私营公司：AI 临床文档 / 环境 AI 工作流
        - ~$100M ARR（Sacra 2025 年 5 月数据）；2024 年底 $60M ARR
        - $5.3B Series E 轮（2025 年 6 月）；约 53x ARR；2026 年 4 月 Series E 延伸轮追加 $316M
        - 相邻的 AI 医疗工作流可比；已接入 EHR；KLAS 第 1；通过与 Availity 和 Highmark 的实时 PA 集成，靠近生物制药场景
        - 相邻而非直接：临床文档与处方可及性；公开第三方验证强得多（KLAS、Epic 集成）；收入模式不同：按临床医生订阅，不同于生物制药付费
      - - McKesson (MCK) / CoverMyMeds
        - 上市战略方：药品分销 / 专科处方路由
        - $94.85B 市值；>$300B 年收入；CoverMyMeds：专科处方路由
        - ~0.3x 收入（纯分销）；CoverMyMeds 未单独披露
        - 锚定战略买方图谱：处方路由网络能从大型药房渠道玩家获得控制权溢价
        - 不是财务倍数可比；分销收入模式与数据 / 工作流 SaaS 根本不同
      - - Surescripts（私营合作社）
        - 私营战略方：电子处方 / 处方福利网络
        - 年处方交易量 5.97B；收入未披露；网络所有的合作社
        - 没有公开市值或收入倍数；不出售
        - 结构性护城河基准：处方网络基础设施可以在数十年里维持根深蒂固的合作社所有权，具备近似垄断特征
        - 合作社结构意味着没有 M&A 退出；监管反垄断审查（此前 DOJ 调查）限制了直接类比
      - - Change Healthcare（UNH 收购前）
        - 已被收购：医疗交易清算平台 / 处方路由 / RCM
        - ~$3.5B 收入（UNH 收购时）；年处理 15B 笔交易
        - UnitedHealth 支付约 $13B（2022 年完成）；约 3.7x 收入
        - M&A 先例：医疗交易清算平台 / 处方路由基础设施获得显著战略溢价；UNH 10-K 记录 2024 年勒索软件攻击后的持续修复成本
        - 产品范围和监管风险画像不同；Change Healthcare 是医疗交易清算平台，不是 AI 工作流层；收购背景早于当前 AI 估值环境
      - - Infinx / Humata Health（私营同行）
        - 私营公司：AI 事先授权自动化（直接竞争对手）
        - 收入未披露；Series A-B 阶段；Infinx 为 Black Book 2026 医疗服务方端 PA 自动化第 1 名
        - 未商业化或早期收入；风投阶段倍数不适用
        - 直接竞争基准：证明 Forus 所在细分市场已获验证，至少还有一家竞品入选 Black Book 排名
        - 没有披露财务指标；无法做估值比较；只能作为市场验证，不是财务可比
    notes: >-
      所有上市公司数据截至 2026 年 6 月 11–12 日，来自 CompaniesMarketCap 和 Yahoo Finance。Abridge 私营指标来自 Sacra 分析师估计（2025 年 5
      月）；这些是第三方估计，不是审计财务。Change Healthcare 收购倍数基于公开报道近似计算。Surescripts 和 Infinx/Humata
      私营指标未公开披露。可比公司用于框定估值区间，不用于给出单一精确倍数。
    enumerationScope:
      coverage: partial
      basis: >-
        Enumeration covers the most relevant public, private, and strategic comparables available from public sources as
        of June 2026. Direct Forus competitors without public financial disclosures are included as market-validation
        benchmarks only, not financial comps.
