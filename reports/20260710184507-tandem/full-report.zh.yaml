        - label: 通过同业转介绍或 GPO 发现
          detail: 截至 2026 年 5 月没有付费获客；通过同事介绍（如 Dr. Goodman → AQUA）、GPO 协调员（MedicoCX）或 OpenEvidence 集成（OpenEvidence 合作）引入
        - label: 零阻力上线
          detail: 医疗服务方零成本；一次上线电话完成 EHR 集成；当天提交第一笔 PA；无需 IT 采购
        - label: 日常高频使用
          detail: 100% 专科 Rx 通过 Forus 分流；早晨查看仪表盘；主动给患者发状态短信；自动处理 PA、申诉和费用援助登记
        - label: 有记录的结果
          detail: PA 周转从数天到数周降至 1–3 天；积压清零；电话时间从 60–70% 降至 <15%；每名协调员吞吐量提升 3–6x
        - label: 转介绍与网络扩张
          detail: 满意的医疗服务方介绍同行、加入 GPO 网络，或触发全组织铺开（AQUA Dermatology 模式）；口碑供给下一批医疗服务方
