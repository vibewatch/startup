      - number: '7.3'
        title: 基础设施和集中度风险
        blocks:
          - type: paragraph
            body: >
              2024 年 2 月 Change Healthcare 遭遇的勒索软件攻击，是 Forus 最相关的基础设施风险案例。Change Healthcare 每年处理约 150
              亿笔医疗交易，触达三分之一患者记录。ALPHV BlackCat 加密其系统后，影响立刻在全美蔓延：74% 的医院报告直接患者护理受影响，包括必要医疗授权延误；94% 报告财务影响；33%
              表示超过一半收入受扰动。60% 需要两到三个月才恢复正常运营。AHA 称，这是美国医疗史上最重大的网络攻击。


              Forus 的架构暴露结构相似。平台依赖支付方清算所 API 和 EHR 集成来路由 PA 提交和处方数据。公司没有公开具体清算所关系，因此无法判断 Forus
              使用单一供应商清算通道（集中风险），还是多供应商备援架构（部分缓释）。如果 Forus 经由任何大型清算所路由，而该清算所发生类似 Change Healthcare 的故障，Forus
              的自动化层就会停止运转——核心服务方价值主张消失；生物制药伙伴也会在上市数据最有价值的时点遭遇处方流数据缺口。


              HIPAA Journal 记录了持续的法律后续，包括 Nebraska Attorney General 对 Change Healthcare 的诉讼在 2025 年 11
              月驳回动议中存续，说明第三方供应商的基础设施失效会制造超过运营中断期的责任。Becker's 报道确认，攻击后一些支付方合同必须重新谈判。UnitedHealth Group 2025 年 10-K（SEC
              文件）给出 Change Healthcare 财务影响最权威披露：数十亿美元整改成本和持续监管暴露。对
              Forus，这意味着一个风险：大型清算所失效可能同时损害运营、迫使紧急切换供应商，并触发监管方对中断期间数据处理的审查。
