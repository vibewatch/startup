      - number: '8.3'
        title: 牛市 / 基准 / 熊市情景
        blocks:
          - type: paragraph
            body: >
              为 Forus 构建情景分析，必须把假设和公开证据明确分开，因为毛利率、净收入留存和生物制药合同条款都没有公开。每个情景都以已确认的 $50M 年化收入为锚，再用不同的增长、利润率和倍数假设向前推。


              牛市情景假设 Forus 在未来两年维持 2.5–3x 年收入增长，到 2027 年底扩张至 $125–150M ARR；确认毛利率高于 70%（符合数据平台 SaaS 业务）；将生物制药伙伴数量扩至全球前 20
              中的 8–10 家（新增三家或更多顶级伙伴）；成功推出面向服务方或支付方的订阅收入流，降低对生物制药的依赖；且没有重大监管架构重做成本。在这些假设下，套用 10–12x
              前瞻收入倍数（符合经济性已确认的高增长私营医疗 AI），到 2027 年底估值为 $1.25B–$1.8B，支撑或超过当前 $1B 进入价。鉴于未验证财务假设较多，牛市情景概率信号为低到中：Forbes
              从方向上确认了增长，但没有审计。


              基准情景使用当前 $50M 收入运行率，假设年收入增长 1.5–2x（到 2027 年底达到 $75–100M），毛利率处于 55–70%
              区间（符合医疗工作流平台基准但未验证），生物制药伙伴数维持五家并有温和增购，监管合规成本可控。套用 10–15x 过去收入倍数——适用于经济性未经验证但可信的高增长私营医疗 AI 公司——得到当前
              $500M–$750M 估值区间。这比已披露的 $1B 标记低 20–50%。在基准情景下以 $1B 进入的买方，按折现财务基本面衡量，相当于支付 1.5–2x 公允价值。


              熊市情景建模收入停滞（$50–70M），可能来自两种情况：（a）一到两个主要生物制药伙伴减少支出或退出，形成收入断崖；或（b）监管架构重做要求（Indiana 2026 年 7
              月生效的人在环强制要求）带来重大产品开发成本，并拖慢新伙伴导入。在熊市假设下，套用与 Waystar 可比的 4–6x EV/Revenue 倍数（符合增速放缓、承受监管压力的医疗工作流平台），估值为
              $200–420M，较 $1B 折让 58–80%。熊市情景是尾部风险，但考虑到集中度结构和监管环境，并非不可想象。


              横跨各情景的不对称结果是 M&A：如果战略买方（清算所、大型支付方、大型药房连锁）在财务透明度形成前收购 Forus，可能支付 2–3x 独立 DCF 的网络控制溢价，潜在估值
              $1.5B–$2.5B。这种战略期权价值埋在网络里，但在当前证据水平下，不能写进独立财务模型的承销。
