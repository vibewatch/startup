      - number: '2.4'
        title: 增长驱动、约束与监管动态
        blocks:
          - type: paragraph
            body: >
              事先授权自动化市场正在快速扩张，但也面对真实的结构性约束，限制采用速度和市场定义的确定性。


              主要增长驱动 — 处方药量与专科复杂性。美国处方药支出在 2025 年增长 12.7% 后，预计 2026 年超过 $1 trillion（ASHP）。每一个新的专科药批准都会创造一个新的 PA 工作流；FDA
              自 2012 年以来以更快速度批准专科药，此后每年专科药都超过 FDA 全部批准的一半。基因疗法（通常每剂 $2+ million）和精准肿瘤药管线，持续扩张着一批高价值、高 PA 摩擦的处方，等待 Forus
              自动化。


              监管驱动 — CMS 互操作性要求。CMS-0057-F（2024 年 1 月最终定稿）要求支付方到 2027 年 1 月为 Medicare Advantage、Medicaid 和 CHIP 支持电子 PA
              API。2026 年 CMS 拟议规则 CMS-0062-P 将把这些要求专门扩展到药品。电子 PA API 降低 Forus 连接支付方的技术摩擦，扩大可触达网络。不过，监管方向也鼓励健康计划 IT 把 PA
              自动化建设成自有能力；中期看，这可能降低对 Forus 等第三方工具的依赖。


              监管驱动 — Medicare Advantage PA 压力。AMA 引用 HHS/OIG 称，2022 年 Medicare Advantage 拒绝的 PA 请求中，有 13% 如果放在传统
              Medicare 下本应获批。Improving Seniors' Timely Access to Care Act（H.R. 3514/S. 1816）旨在扩大 Medicare Advantage 中的电子
              PA；截至 AMA 2026 年 2 月行动包，该法案有 254 名众议院共同发起人和 66 名参议院共同发起人。如果通过，它将让电子 PA 更加常态化，并扩大 Forus 所处市场。


              监管约束 — AI 监督与错误拒付风险。多个州已经通过或提出法律，要求对 AI 驱动的覆盖决定进行人工监督。Forus 提交 PA 请求，而不是做覆盖决定；但 PA 中使用 AI
              的整体监管气候会制造声誉风险和合规复杂性。生物医药合作伙伴在签订触及患者准入工作流的商业协议时，可能会更仔细审查 AI 治理要求。ICER 2025 Launch Price and Access Report
              还记录了与使用管理（包括 PA）相关的准入不平等，正受到越来越多政策审视。


              市场约束 — 电子 PA 采用滞后。尽管行业努力了十年，2024 年事先授权仍只有 40% 电子化（CAQH 2025 Index），高于 2022 年的 31%。60%
              市场仍停留在人工工作流，反映出深层互操作性障碍：支付方系统异质、EHR 碎片化、专科药覆盖复杂，以及 Change Healthcare 网络攻击（2024 年 2 月，影响 193 million
              人）把许多医疗服务方推回人工流程。这些障碍既是 Forus 的采用机会，也是快速市场渗透的结构性逆风。


              市场约束 — Medicaid 药价改革。HHS 和 CMS 于 2026 年宣布 GENEROUS Medicaid Model，把最惠国药价引入 Medicaid。2024 年 Medicaid
              处方药支出超过 $100 billion（总额）和 $60 billion（扣除返利后）。如果 Medicaid 市场中的制造商收入被压缩，生物医药用于 hub
              项目和患者准入基础设施的商业预算可能下降。现有来源无法量化其对生物医药商业支出的长期影响。


              市场约束 — 既有基础设施。由 CVS Specialty、Accredo/Cigna 等主导的专科药房渠道，以及既有生物医药 hub 供应商，已经拥有合同关系、处方集位置和数据权利，形成切换成本。Forus
              要扩大生物医药商业合作，就必须在这些关系中穿行、互补或替代。Drug Channels Institute 2026 年报告强调，当前渠道中专科药房和 PBM 经济结构复杂，且市场力量强。


              尽调缺口。生物医药在患者准入和 hub 基础设施上的商业支出，是与 Forus 定价最直接相关的市场，但没有公开的聚合口径。hub 市场历史上曾被估计为 $3–6 billion，但在审阅来源中没有找到权威的
              2025–2026 年数字。PA 摩擦降低与增量首次配药收入之间的转换率，是面向生物医药的核心价值主张，目前也没有公开验证。投资人需要独立验证这一转换率，才能承销生物医药收入模式的大规模可行性。
