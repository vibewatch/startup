evidenceGaps:
  - type: missing-source
    severity: material
    topic: leadership
    missingEvidence: >-
      Complete executive team listing with named CFO, CTO, COO, and board composition including independent directors
      and investor board observers.
    whyItMatters: >-
      Governance quality and key-person risk cannot be fully assessed without knowing the full leadership team and board
      composition.
    diligencePath: >-
      Request org chart and board composition from company; review any state filings; check LinkedIn for self-reported
      executive titles.
    relatedQuestionRefs:
      - QO001
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: >-
      Precise headcount with breakdown between engineering, clinical, operations, and commercial functions, plus hiring
      pace in 2025-2026.
    whyItMatters: >-
      Headcount structure reveals execution capacity, burn rate range, and scalability of the workforce model relative
      to revenue growth.
    diligencePath: >-
      Request formal headcount data from company; cross-reference LinkedIn employee count; review job posting volume
      over time.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: revenue-model
    missingEvidence: >-
      Detailed biopharma contract structure, whether revenue is milestone-based, subscription, data-licensing, or
      percentage of drug sales; gross margin; contract duration; churn rate.
    whyItMatters: >-
      Revenue quality and predictability depend heavily on contract structure; without this the $50M-plus ARR figure
      cannot be benchmarked against comparable healthcare SaaS businesses.
    diligencePath: >-
      Request anonymized contract terms during due diligence; review biopharma partner contracts; request full P&L and
      cohort revenue data.
    relatedQuestionRefs:
      - QO026
  - type: missing-source
    severity: minor
    topic: scale
    missingEvidence: >-
      Third-party verification of the thousands of practices and all 50 states claims, such as an independent usage
      audit, CMS attestation, or customer reference list.
    whyItMatters: >-
      All scale metrics are company-claimed; without independent corroboration they cannot be relied upon for diligence
      judgments.
    diligencePath: >-
      Request customer list with signed permission; request independent usage audit; interview sample of named and
      unnamed customer references.
    relatedQuestionRefs:
      - QO010
  - type: missing-source
    severity: minor
    topic: AI-transparency
    missingEvidence: >-
      Public disclosure of Forus AI model governance, human oversight protocols, patient appeal rights for PA outcomes,
      and accuracy or error rate data.
    whyItMatters: >-
      As regulatory scrutiny of AI in prior authorization intensifies, absence of published governance documentation is
      a reputational and compliance risk.
    diligencePath: >-
      Review Forus trust center for AI governance docs; request internal responsible-AI policy; confirm whether Forus
      maintains a patient-facing appeals process.
    relatedQuestionRefs:
      - QO019
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table
    missingEvidence: >-
      Pre-seed milestones, early product launch dates, first customer acquisition date, and any adverse events
      (leadership departures, product failures, regulatory inquiries) from 2023-2024 are not documented in public
      sources.
    whyItMatters: >-
      The milestone table uses partial coverage; gaps in early company history could conceal adverse events or pivots
      that affect the diligence narrative.
    diligencePath: >-
      Request internal company timeline from management; interview early employees and investors; review any state/SEC
      filings for the 2023-2024 period.
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: minor
    topic: competitors
    missingEvidence: >-
      Public financial and scale data for named competitors (Lumini, Qventus, Confido Health) to enable a side-by-side
      comparison of funding, customer count, and product coverage.
    whyItMatters: Competitive benchmarking requires comparable data that is not yet publicly available for most direct peers.
    diligencePath: >-
