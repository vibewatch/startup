  - id: KP002
    type: risk
    title: "Incumbent distribution and multi-homing normalize competitive fragmentation"
    body: >
      CoverMyMeds' dominance of approximately 90% of electronic PA transaction volume and
      EHR-native PA tools are embedded in existing provider workflows before Forus begins its
      sales motion. Multi-homing is the norm—providers use multiple PA tools simultaneously—
      meaning Forus adoption does not displace incumbents. The Change Healthcare cyberattack
      raised buyer attention to concentration risk but also raised the security and resilience
      bar any new platform must clear.
