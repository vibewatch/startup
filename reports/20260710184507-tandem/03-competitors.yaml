callouts:
  - id: KP001
    type: strength
    title: "Structural moat: free-to-provider biopharma-funded economics"
    body: >
      No profiled competitor operates at the PA-automation layer with biopharma-funded,
      free-to-provider economics. Provider adoption is not constrained by provider budget cycles,
      and the revenue model aligns with biopharma manufacturers who have both the largest
      first-fill-rate incentive and the financial scale to fund the network at drug-launch scope.
    claimRefs:
