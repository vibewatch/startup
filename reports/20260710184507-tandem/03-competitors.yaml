  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing-competitor
      missingEvidence: "Published or independently verified pricing for Humata Health, Infinitus, Waystar PA module, and Develop Health. All competitors either do not disclose pricing or require a direct sales engagement."
      whyItMatters: "Without competitor pricing, a meaningful total-cost-of-ownership and ROI comparison between Forus (free to provider) and provider-funded peers cannot be made from public evidence."
      diligencePath: "Request independent price benchmarking from RCM consultants, GP Strategies, or health-system procurement teams that have received competitive quotes; cross-check with analyst coverage."
      relatedQuestionRefs:
        - QP018
        - QP019

    - type: enumeration-incomplete
      severity: material
      topic: EHR-entrant-risk
      missingEvidence: "Public roadmap or product announcements from Epic, Oracle Health, or Veradigm disclosing whether they plan to expand native EHR PA automation to cover biopharma engagement, affordability enrollment, and specialty pharmacy routing."
      whyItMatters: "If Epic or Oracle Health expand their native PA modules to cover these layers, they could foreclose Forus's EHR-embedded distribution advantage without a separate vendor relationship."
      diligencePath: "Review Epic App Orchard catalog for competitive PA and affordability apps; review Oracle Health and Veradigm product roadmaps; interview health-system CIOs who have evaluated native versus third-party PA solutions."
      relatedQuestionRefs:
        - QP022
        - QP024

    - type: private-evidence-only
      severity: material
      topic: Forus-HITRUST-status
      missingEvidence: "Public confirmation that Forus has achieved or is actively pursuing HITRUST certification comparable to Humata Health's. Only SOC 2 Type II is publicly disclosed for Forus/Tandem via withtandem.com/security."
      whyItMatters: "HITRUST certification is increasingly required by large health-system procurement teams; absence may create a competitive disadvantage specifically where Humata already holds the credential."
      diligencePath: "Request Forus's security and compliance roadmap under NDA; survey health-system IT/security teams about their PA vendor HITRUST requirements."
