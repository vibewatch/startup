  - id: s2
    title: Competitor Profiles and Capability Comparison
    body: |
      Humata Health positions its PAthway platform as "the industry's most comprehensive prior
      authorization solution" and targets health system revenue cycle, patient access, and
      authorization management leaders. Its technology stack includes AI-driven policy matching
      (PolicyLink), automated clinical bundling, smart attestation answering, automated statusing,
      post-authorization monitoring, and analytics via Power BI. Published performance claims
      include 96% first-pass approval rate, 80% improvement in clinical bundling efficiency, 45%
      fewer authorization touches, and 83% reduction in reschedules. The platform connects to 250+
      payers through native EHR integration. Humata holds HITRUST CSF v9.5.0 r2 certification and
      undergoes annual SOC 2 Type II audits—a security posture that sets the enterprise compliance
      baseline for health-system PA vendor procurement. Texas Health Resources (approximately $6
      billion in revenue, 29 hospitals) deployed Humata in July 2025 across diagnostic imaging,
      cardiovascular services, and interventional radiology, achieving 100% automated coverage of
      in-scope volume. UHealth orthopedic deployment recovered 68% of orthopedic authorizations
      needing PA to automated handling. Humata's pricing is not publicly disclosed; it competes
      through enterprise health-system sales contracts. Crucially, Humata is provider-funded and
      does not operate a biopharma-funded free-to-provider model.

      Infinitus Systems uses voice AI agents to automate payer phone calls for PA status, benefit
      verification, enrollment follow-up, and refill coordination. Its agents capture PA
      requirements and updates across oncology, immunology, rheumatology, neurology, cardiology,
      and additional disease states. Infinitus has completed 8 million-plus calls supporting
      125,000+ providers, automated over 100 million minutes of healthcare conversation, and claims
      adoption by 44% of Fortune 50 companies. The company is backed by Andreessen Horowitz at a
      disclosed valuation exceeding $600 million. Infinitus targets the post-submission phase of
      the PA workflow—it does not integrate at the point of prescribing, manage formulary routing,
      or enroll patients in affordability programs. Its no-code Studio tool allows healthcare teams
      to build and deploy voice AI agents with compliance guardrails. Infinitus's model is
      complementary to electronic PA platforms in cases where payer phone calls remain unavoidable.

      CoverMyMeds (wholly owned by McKesson) dominates the electronic PA routing infrastructure:
      its network claims approximately 90% of US electronic PA transaction volume, connecting 94%
      of US prescription volume, 96% of pharmacies, and 950,000+ healthcare professionals. Optum
      Rx references CoverMyMeds as a primary e-PA portal for submissions alongside Surescripts,
      PreCheck MyScript, DrFirst, CenterX, and Allscripts. McKesson reported approximately $309
      billion in fiscal year 2024 revenue, giving CoverMyMeds substantial cross-sell distribution
      across McKesson's hospital, specialty pharmacy, and manufacturer customer relationships.
      CoverMyMeds routes and tracks PA requests but does not independently determine approval
      speed—payer system processing governs latency. It does not publicly describe affordability
      enrollment, biopharma engagement for drug launches, or pharmacy routing optimization at the
      point of prescribing. Pricing for CoverMyMeds provider access is not publicly disclosed.

      Change Healthcare—now operating under Optum for Business within UnitedHealth Group—supports
      8 out of 10 US hospitals and 8 out of 10 US health plans through combined Optum capabilities.
      Its e-PA portal allows same-day PA determinations and the PreCheck Prior Authorization
      feature reduces approval times and denials. The February 2024 ransomware attack disrupted
      claims processing and PA workflows for approximately 193 million individuals; AMA survey data
      showed 80% of practices had lost revenue from unpaid claims and 85% had committed additional
      staff time to revenue cycle tasks as a result.

      Waystar provides RCM software to 1 million-plus providers covering 60% of the US patient
      population, earning a third-party provider net promoter score above 74 as of September 2023.
      Its Financial Clearance suite includes PA management, insurance verification, price
      transparency, and denial prevention as integrated components. PA integration spans Epic,
      Cerner, and MEDITECH. Waystar's PA positioning is financial-clearance and denial prevention;
      its official platform materials do not reference biopharma partnerships, affordability
      enrollment, or specialty pharmacy routing. Pricing is not publicly disclosed; PA capability
      is bundled within enterprise RCM contracts.
