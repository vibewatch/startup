  - id: s4
    title: Financial Verdict and Disclosure Gaps
    body: |
      The financial picture for Forus that emerges from public evidence is unusually strong for a
      three-year-old company but also unusually opaque for one seeking institutional capital at a
      $1 billion valuation. The strength case: revenue growth from $10 million to approximately
      $50 million in annualized terms in roughly six months, biopharma validation from five of the
      top 10 global companies, and a free-to-provider model that removes the most common barrier to
      digital health adoption. The opacity case: no gross margin, burn rate, cash position, NRR,
      CAC, or contract-level pricing has been publicly disclosed, and no independent analyst or
      investor publication has produced an audited or estimated P&L for the company as of the
      report date.

      The revenue quality verdict—to the extent it can be given from public sources—is cautiously
      positive. Biopharma commercial access contracts are typically multi-year commitments (biopharma
      companies do not frequently switch access partners mid-launch cycle), which suggests revenue
      stickiness once a drug is in the pipeline. The 5x growth in early 2026 is more consistent with
      pilots converting to commercial-scale contracts (a lumpy, event-driven revenue recognition) than
      with smooth SaaS-style subscription growth. This matters for NRR analysis: if the large step-up
      is driven by one or two major contract expansions, the NRR for the underlying cohort could be
      very high—but so could the concentration risk.

      The capital adequacy verdict is conditionally adequate: $160 million at a burn rate inferred
      at $18–35 million annually implies multi-year runway, and the $1 billion valuation gives the
      company strong optionality for further raises. However, because neither the actual cash balance
      nor the actual burn rate is known, these inferences could be wrong by significant multiples.
      A disclosed burn rate that exceeded $50 million annually—possible if aggressive sales and
      infrastructure build-out absorbs the Series B quickly—would reduce estimated runway below three
      years, making a Series C likely by mid-2027.

      Adverse signals bear noting. Regulatory pressure on AI-PA is intensifying: the KFF has
      documented that 8–12% of health plans use AI to support PA denials, and multiple state
      legislatures have enacted laws requiring human review before denial. If Forus's platform is
      perceived as enabling AI-driven denials rather than AI-driven approvals, reputational risk
      and legislative scrutiny could increase compliance costs and alter the biopharma trust
      relationship. Additionally, the CMS electronic prior authorization interoperability final rule
      published in early 2024 mandates electronic PA via APIs by January 2027; this mandate could
      commoditize the PA routing layer and reduce the differentiation that Forus's network provides
      to biopharma buyers.

      The overriding financial diligence conclusion is that the public evidence supports a real and
      rapidly growing revenue base with a plausible path to significant scale, but the absence of
      disclosed unit economics, audited financials, or any independent financial coverage means that
      all quantitative underwriting of Forus must occur in a private data room under NDA. The five
      diligence asks in TI005 represent the minimum required to produce an investable financial model.
