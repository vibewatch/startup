  - id: s2
    title: Market Sizing — Multiple Lenses
    body: |
      No single published market estimate cleanly captures the Forus addressable opportunity. This
      section presents four complementary sizing lenses and explicitly preserves the contradictions
      and limitations in each.

      Lens 1 — Prior-authorization administrative savings opportunity. CAQH's 2025 Index (published
      2026, covering 600 provider organizations and health plans representing 63% of insured lives)
      estimates total residual medical administrative automation savings at $18.7 billion annually.
      Prior authorization is specifically tagged as the least-automated major transaction class.
      CAQH separately estimates the direct prior-authorization automation cost savings at $50–60
      million—a figure that reflects only clerical transaction costs, not physician time, delayed-care
      costs, or drug-abandonment costs. Chiefhealthcareexecutive.com's March 2026 ViVE interview
      with CAQH CEO Sarah Ahmad extended the full administrative automation opportunity to $21 billion
      if every transaction were fully electronic. Material limitation: these figures apply to the
      cost of the administrative workflow itself, not to the downstream revenue impact on drug
      manufacturers, which is the actual Forus revenue model.

      Lens 2 — Specialty drug spending and capture upside. U.S. prescription drug spending reached
      $915 billion in 2025, a 12.7% increase over 2024, projected to exceed $1 trillion in 2026
      (ASHP/AJHP 2026). Specialty drugs account for approximately 54% of pharmaceutical spending
      ($263 billion in 2024) despite fewer than 5% of prescription volume. GLP-1 agonists alone
      were approximately $132 billion in 2025 (roughly 14% of all prescription spending). Clinics
      saw 19% drug expenditure growth in 2025 driven by specialty and injectable drugs. The Mercer
      2026 drug trend report projects specialty drug trends of 7–11% for 2025–2026 and 6.5–10.5%
      for 2026–2027. Material limitation: Forus does not receive a share of drug spending; the
      biopharma monetization mechanism is a commercial partnership fee, not a revenue-share.

      Lens 3 — Patient-access hub and support infrastructure market. Cardinal Health's 2026 Hub
      Evolution Benchmark Report surveyed 200 biopharma manufacturers on outsourced hub strategy.
      The hub/patient-services market is not sized in this report, but is described as undergoing
      vendor consolidation and operational reassessment. Historical analyst estimates have pegged
      the specialty pharma patient-services market at $3–6 billion; this range cannot be corroborated
      from the current source set and is explicitly flagged as an evidence gap. The ICER 2025 Launch
      Price and Access Report noted that specialty drug access barriers—including prior authorization
      and hub friction—are a documented source of inequitable access across payer types. Material
      limitation: Forus competes against internal manufacturer hub operations and specialty-pharmacy-
      embedded access programs, not just independent hub vendors.

      Lens 4 — Prescription nonfulfillment as market problem magnitude. KFF's January 2026 poll
      found that 47% of all insured adults and 57% of those with chronic conditions had a prescription
      or service denied, delayed, or altered in the past two years. The AMA 2024 survey found 82%
      of physicians said PA requirements lead patients to abandon treatment. If even 5% of the
      $263 billion specialty drug market represents therapy abandoned due to PA friction, that is
      approximately $13 billion in unrealized drug revenue annually—a number that defines the
      theoretical ceiling of what biopharma manufacturers might collectively pay to solve the problem.
      Material limitation: abandonment causality is multifactorial and no validated conversion rate
      between PA friction reduction and incremental biopharma revenue is available in the public record.

      Cross-lens synthesis. Forus's revenue model means the relevant serviceable addressable market
      is a subset of biopharma commercial spending on drug-launch and patient-access infrastructure,
      not the entire administrative cost base or drug-spending universe. The company's annualized
      revenue was reported above $50 million in 2026, suggesting meaningful early penetration.
      CMS's Medicaid prescription drug spending exceeded $100 billion (before rebates) in 2024,
      and the new GENEROUS Medicaid Model (announced 2026) introduces most-favored-nation pricing
      that could reshape manufacturer rebate structures and indirectly affect hub program economics.

      These lenses are not additive; they measure different economic layers of the same underlying
      friction problem. Investors should treat any single-number TAM claim with skepticism until
      Forus discloses its biopharma pricing model with enough granularity to construct a bottom-up SAM.
