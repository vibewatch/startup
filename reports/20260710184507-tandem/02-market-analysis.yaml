chapter:
  number: 2
  title: Market Analysis
  summary: |
    Forus (formerly Tandem Technology) sits at the convergence of four distinct but overlapping
    market problems: prior-authorization administrative overhead, specialty-drug access friction,
    biopharma hub and patient-support infrastructure, and prescription nonfulfillment. No single
    published estimate captures this intersection cleanly; the strongest available lens—CAQH's
    2025 Index—puts residual medical administrative cost-savings opportunity at $18.7 billion
    with prior authorization the most persistently manual transaction (40% electronic adoption in
    2024). Prescription drug spending is on course to exceed $1 trillion in 2026, with specialty
    drugs—the highest-PA-burden category—accounting for 54% of pharmaceutical spend despite fewer
    than 5% of prescriptions. Biopharma manufacturers bear most of the economic cost of access
    failure through lost first-fill rates and abandonment, making them the natural payer in Forus's
    free-to-provider model.

sections:
  - id: s1
    title: Market Definition and Scope
    body: |
      Forus competes at the intersection of at least four distinct but tightly coupled problem spaces,
      none of which is conventionally named "the PA market." Understanding market scope is a prerequisite
      for credible sizing.

      The first and most fundamental layer is prior-authorization administrative cost. Every insured
      prescription or procedure requiring PA generates a multi-step administrative transaction between
      physician, payer, and sometimes pharmacy. The AMA's 2024 physician survey found that physicians
      complete an average of 39 prior authorizations per week, and 40% of practices have hired staff
      dedicated exclusively to PA work. Total spending on medical administrative transactions in the
      United States exceeded $81.9 billion in 2024, of which the CAQH 2025 Index estimates $18.7
      billion remains achievable through automation—up from $16.4 billion two years earlier. Prior
      authorization is specifically the most persistently manual transaction class, with only 40%
      electronic adoption in 2024 versus 98% for claim submission and 96% for eligibility verification.
      CAQH's narrower calculation of direct PA automation cost savings is $50–60 million per year,
      though this figure understates the broader productivity and clinical-outcome cost of PA delays.

      The second layer is specialty-drug access friction. Specialty drugs—including biologics for
      cancer, autoimmune disease, rare conditions, and now GLP-1 agonists—represent fewer than 5%
      of prescriptions yet account for approximately 54% of U.S. pharmaceutical spending, or roughly
      $263 billion in 2024, up from 47% of spending in 2019. The FDA approved 516 specialty drugs
      between 2000 and 2024 out of 897 novel drug approvals, with specialty share exceeding 50% of
      FDA approvals in every year since 2012. These drugs carry the highest utilization-management
      burden—step-therapy requirements, prior authorizations, and specialty-pharmacy routing—making
      them the primary workflow Forus addresses.

      The third layer is biopharma hub and patient-support infrastructure. Life-sciences manufacturers
      have historically funded "hub" programs—third-party patient-access services—to accelerate
      therapy initiation, manage prior authorizations, and connect patients with copay-assistance
      programs. Cardinal Health's 2026 Benchmark Report surveyed 200 biopharma manufacturers and
      found that hub strategy, vendor consolidation, and execution expectations are under active
      reassessment. Forus, operating at the prescriber-EHR layer, functions as a tech-enabled hub
      replacement that is natively embedded rather than bolted on after the prescription event.

      The fourth layer is prescription nonfulfillment and access-friction magnitude. KFF's January
      2026 poll found that 47% of insured adults—and 57% of those with chronic conditions—reported
      that an insurer denied, delayed, or altered a prescription or health service in the past two
      years. Prior authorization is named the single biggest burden by 34% of all insured adults,
      and 39% of those with chronic conditions. The market opportunity is therefore partly a
      patient-outcome problem and partly a drug-spending capture problem: therapy that is abandoned
      or delayed is revenue lost to the biopharma manufacturer.

      The most important scope boundary is the free-to-provider, biopharma-funded model. Forus does
      not charge physicians or patients; its economic market is biopharma manufacturers who pay for
      network access and drug-launch support. This limits the conventional "software market" framing
      and makes the relevant market question: how much will manufacturers pay to improve first-fill
      rates and reduce abandonment on high-value specialty drugs?
