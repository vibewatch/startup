  - id: s3
    title: Buyer and User Segmentation
    body: |
      The Forus market involves four distinct participant categories whose economic interests diverge
      significantly—a complexity that shapes go-to-market, pricing, and regulatory exposure.

      Segment 1 — Biopharma manufacturers (economic buyer / commercial partner). The primary revenue
      source for Forus is biopharma companies, particularly those launching specialty drugs where
      PA approval rates, time-to-therapy, and patient adherence directly affect commercial performance.
      Five of the top ten global biopharma companies were Forus partners as of May 2026. Manufacturers
      fund Forus partnerships through commercial budgets rather than IT or health-technology procurement—
      specifically through patient services, market access, and field reimbursement teams. This makes
      the budget owner a commercial or market-access executive, not a CIO or CTO. Trigger for spending:
      new drug launch, formulary position change, competitive molecule entry, or payer-policy shift.
      Adoption constraint: biopharma companies have existing hub vendors, specialty-pharmacy contracts,
      and patient-services infrastructure; Forus must demonstrate superior first-fill rates and network
      breadth before displacing incumbent relationships.

      Segment 2 — Specialty clinics and health systems (user / beneficiary). Physicians, practice
      administrators, and clinical coordinators at oncology practices, rheumatology clinics, dermatology
      groups, GI practices, neurology centers, and health-system specialty departments are the primary
      workflow users of the Forus platform. Forus is embedded in the EHR and is free to providers.
      The adopting stakeholder is typically a prior-authorization coordinator or practice manager
      who evaluates the tool on speed, EHR integration quality, and denial-reduction rate. The AMA's
      2024 survey found that physicians and their staff spend an average of 13 hours per week on PA
      tasks; Forus directly attacks this burden. Adoption trigger: a care-coordination pain point,
      staff burnout, or a referral from a peer practice.

      Segment 3 — Practice administrators and revenue-cycle leaders (operator / procurement gatekeeper).
      In larger health systems, a director of revenue cycle management, VP of physician services, or
      pharmacy and biologics team lead may formally evaluate and procure PA automation tools. The
      Humata Health buyer's guide (2026) and the Develop Health guide (2026) both note that the buyer
      evaluation framework for PA automation focuses on EHR integration depth, payer connectivity,
      automation scope, and denial rate improvement—not just upfront cost. Because Forus is free to
      providers, the procurement barrier is lower than for competing paid platforms, but enterprise
      health systems may still require data security review, workflow integration evaluation, and
      clinical outcomes validation before deploying at scale.

      Segment 4 — Patients (beneficiary, not payer). Patients are the downstream recipients of the
      workflow improvement. They do not pay for Forus directly and are not a decision-maker in
      commercial adoption. However, patient-experience outcomes—therapy initiation speed, copay
      reduction, and status transparency—are the value Forus markets to both providers and biopharma.
      The KFF 2026 poll found that insured adults with chronic conditions are disproportionately
      affected by PA delays; this population is the primary beneficiary of Forus's automation,
      and their outcomes data constitute Forus's most compelling marketing evidence for biopharma
      partnerships.

      An important structural nuance: in the biopharma-funded model, the payer and the beneficiary
      are completely distinct from each other, and the user (physician/coordinator) is also not the
      payer. This three-way separation (payer = biopharma, user = provider team, beneficiary = patient)
      means adoption, monetization, and value delivery each have separate stakeholders. Regulatory
      scrutiny directed at any one layer—such as state AI oversight legislation targeting payer use
      of AI in PA determinations—could affect Forus's operating environment even though Forus is
      not a payer and does not make coverage decisions.
