      - number: '8.3'
        title: Bull / Base / Bear Scenarios
        blocks:
          - type: paragraph
            body: |
              Constructing scenario analysis for Forus requires explicit separation of assumptions from
              public evidence, since gross margin, net revenue retention, and biopharma contract terms
              are not publicly available. Each scenario uses the confirmed $50M annualized revenue as
              the anchor and builds forward from different growth, margin, and multiple assumptions.

              The bull case assumes Forus sustains 2.5-3x annual revenue growth over the next two years,
              expanding to $125-150M ARR by end-2027, achieves confirmed gross margins above 70% (consistent
              with data-platform SaaS businesses), expands biopharma partnership count to 8-10 of the
              global top 20 (adding three or more new top-tier partners), successfully launches a provider-
              or payer-side subscription revenue stream that de-concentrates biopharma dependency, and
              faces no material regulatory rearchitecture cost. Under these assumptions, applying a 10-12x
              forward revenue multiple (consistent with high-growth private healthcare AI at confirmed
              economics) yields a $1.25B-$1.8B valuation by end-2027—supporting or exceeding the current
              $1B entry. The bull case probability signal is low to medium given the number of unverified
              financial assumptions: growth is directionally confirmed by Forbes but not audited.

              The base case uses the current $50M revenue run rate, assumes 1.5-2x annual revenue growth
              (reaching $75-100M by end-2027), assumes gross margins are in the 55-70% range (consistent
              with healthcare workflow platform benchmarks but unverified), assumes biopharma partner count
              stays at five with modest upsell, and assumes regulatory compliance cost is manageable.
              Applying a 10-15x trailing revenue multiple—appropriate for a high-growth private company
              in healthcare AI with unverified but plausible economics—yields a $500M-$750M valuation
              range today. This represents a 20-50% discount to the $1B disclosed mark. A buyer entering
              at $1B in the base case scenario is paying 1.5-2x fair value as measured by discounted
              financial fundamentals.

              The bear case models revenue stagnation ($50-70M) resulting from two scenarios: (a) one or
              two major biopharma partners reduce spend or exit, creating a revenue cliff, or (b) regulatory
              rearchitecture requirements (Indiana's human-in-the-loop mandate, effective July 2026) impose
              material product development cost and delay new partner onboarding. Under bear assumptions,
              applying a Waystar-comparable 4-6x EV/Revenue multiple (consistent with a slowing healthcare
              workflow platform that is under regulatory pressure) yields a $200-420M valuation—a 58-80%
              discount to $1B. The bear case is tail risk but not implausible given concentration structure
              and regulatory environment.

              Across scenarios, the asymmetric outcome is M&A: if a strategic buyer (clearinghouse,
              major payer, large pharmacy chain) acquires Forus before financial transparency is achieved,
              they could pay a network-control premium of 2-3x standalone DCF, potentially yielding $1.5B-
              $2.5B. This strategic option value is embedded in the network but not underwriteable in a
              standalone financial model at the current evidence level.
            claimRefs:
