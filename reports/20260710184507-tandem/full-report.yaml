  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Policy Risk
        blocks:
          - type: paragraph
            body: |
              The regulatory environment for AI in prior authorization is the fastest-evolving risk
              dimension for Forus. Manatt Health's 2026 AI policy tracker documents that almost all
              states are actively debating AI legislation, with over 25 states having introduced more
              than 35 bills specifically governing payer use of AI in prior authorization and claims
              review. Two laws have already been enacted: Indiana (effective July 1, 2026) prohibits
              health insurers from using AI as the sole basis to downcode a claim without reviewing the
              patient's medical record, mandates disclosure of AI use in adverse PA determinations, and
              prohibits targeted downcoding against providers treating complex patients. Utah (effective
              January 1, 2027) requires insurers to publicly disclose whether AI is used to review
              authorization requests.

              The legislative pattern reflects a consistent regulatory thesis: AI may assist but must not
              supplant licensed human review for adverse coverage decisions. For Forus, whose core value
              proposition is automated PA submission, this creates a product compliance layer: any
              workflow touching denial or downcoding decisions—even as a data intermediary—risks being
              characterized as "sole use of AI" if oversight documentation is absent. KFF confirms that
              29 states already have operative laws on this topic as of 2026.

              Federal uncertainty compounds state risk. The National Health Law Program warns that the
              Trump administration's deregulatory posture threatens prior authorization reform momentum,
              while Holland and Knight's May 2026 review confirms that state AI regulation is accelerating
              into the gap. Manatt also tracks emerging AI product-liability legislation in multiple states,
              which could expose Forus to civil claims if an AI-generated recommendation contributed to a
              delay in care. The FDA's January 2026 revised CDS guidance—expanding categories of AI tools
              not regulated as devices when a clinician independently reviews the basis for
              recommendations—provides some relief but narrows the safe harbor to workflows with documented
              physician review, which Forus does not publicly describe.
