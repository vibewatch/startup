      - number: '6.4'
        title: Retention, Durability, and Concentration Risks
        blocks:
          - type: paragraph
            body: |
              Forus's customer story carries significant evidence gaps that limit confidence in retention
              durability and concentration risk assessment. No net revenue retention (NRR), gross revenue
              retention (GRR), provider churn rate, biopharma renewal rate, or cohort data of any kind has
              been publicly disclosed. The 10x year-over-year growth in provider adoption for two consecutive
              years is consistent with rapid early adoption but says nothing about whether early cohorts are
              retained, expanding, or churning. For biopharma, the 5x revenue step-up in H1 2026 could
              reflect either deep expansion of existing partner relationships or new partner additions—the
              distinction materially affects revenue quality assessment.

              Named customer logos remain a narrow set of specialty practices. Despite "thousands" of
              practices and "health systems across all 50 states," the only publicly named reference customers
              are five specialty practices and one GPO. No hospital system, academic medical center, or
              large health system has been named as a reference customer in any public document as of the
              May 2026 announcement. Similarly, no pharmaceutical company name appears in any press release,
              investor blog, or case study. This referenceability gap is material for due diligence: potential
              enterprise customers, investors, and acquirers cannot independently verify adoption claims
              through reference calls with named accounts without Forus's facilitation.

              A search of independent review platforms (G2, Capterra, KLAS Peer Reviews) for Forus or Tandem
              Technology yields no published reviews or ratings as of the report date. All five named customer
              case studies were authored and published by Forus itself, creating a conflict of interest
              inherent in company-sourced evidence: dissatisfied customers are unlikely to appear in
              company-authored content.

              Health system and biopharma customers impose additional procurement friction. Health systems
              typically require HIPAA Business Associate Agreements, IT security reviews (SOC 2, HITRUST or
              equivalent), steering committee approval, EHR vendor certification review, and clinical workflow
              validation before deploying an AI-assisted prescription automation tool—a process that can take
              6–18 months. Forus's three consecutive clean SOC 2 Type II audits address the security trust
              barrier, but HITRUST certification has not been publicly claimed, which may limit appeal to
              enterprise health systems with stricter compliance requirements.

              Biopharma partners face specific privacy and data-governance concerns. Because Forus aggregates
              prescription-initiation data across drugs, payers, and prescribers, each biopharma partner
              must assess whether shared-network data creates disclosure risk for their own prescription
              performance data. Antitrust review is also relevant: if multiple top-10 biopharma companies
              share access to Forus's prescription-flow data asset, questions arise about competitive
              information barriers within the platform. No public document describes how Forus structures
              data separation between biopharma partners.

              The AMA's 2024 prior authorization physician survey documented that 35% of physicians
              reported a serious adverse event linked to PA delays, and 61% expressed concern that unregulated
              AI is being used to increase denials—evidence that provider adoption of any AI-assisted PA tool
              requires sustained trust-building and that the regulatory environment may raise scrutiny of
              AI-embedded prescription automation broadly, not just payer-side tools.
