      - number: '2.4'
        title: Growth Drivers, Constraints, and Regulatory Dynamics
        blocks:
          - type: paragraph
            body: |
              The prior-authorization automation market is expanding rapidly but faces genuine structural
              constraints that limit both the pace of adoption and the certainty of market definition.

              Primary growth driver — prescription drug volume and specialty complexity. U.S. prescription
              drug spending is projected to exceed $1 trillion in 2026 (ASHP) after 12.7% growth in 2025.
              Every new specialty drug approval creates a new PA workflow; the FDA has approved specialty
              drugs at an increasing rate since 2012, with specialty drugs exceeding half of all FDA approvals
              in every year since then. The pipeline of gene therapies (often $2+ million per dose) and
              precision oncology agents creates a steadily expanding set of high-value, high-PA-friction
              prescriptions for Forus to automate.

              Regulatory driver — CMS interoperability mandates. CMS-0057-F (finalized in January 2024)
              required payers to support electronic PA APIs for Medicare Advantage, Medicaid, and CHIP by
              January 2027. The 2026 CMS proposed rule CMS-0062-P would extend these requirements to
              drugs specifically. Electronic PA APIs reduce the technical friction for Forus to connect
              to payers, expanding the addressable network. However, the regulatory direction also encourages
              health-plan IT investment in PA automation as a first-party capability—potentially reducing
              dependence on third-party tools like Forus over the medium term.

              Regulatory driver — Medicare Advantage PA pressure. The AMA cites that 13% of PA requests
              denied by Medicare Advantage in 2022 would have been approved under traditional Medicare,
              per HHS/OIG. The Improving Seniors' Timely Access to Care Act (H.R. 3514/S. 1816), with
              254 House cosponsors and 66 Senate cosponsors as of the AMA's February 2026 action kit,
              seeks to expand electronic PA in Medicare Advantage. If enacted, it would normalize electronic
              PA and expand the market Forus operates in.

              Regulatory constraint — AI oversight and wrongful-denial risk. Several states have enacted
              or proposed legislation requiring human oversight of AI-driven coverage decisions. While Forus
              submits PA requests rather than making coverage decisions, the broader AI-in-PA regulatory
              climate creates reputational risk and compliance complexity. Biopharma partners may scrutinize
              AI governance requirements when entering commercial agreements that touch patient-access
              workflows. The ICER 2025 Launch Price and Access Report further documents that access inequities
              linked to utilization management (including PA) are under growing policy scrutiny.

              Market constraint — electronic PA adoption lag. Despite a decade of industry effort, prior
              authorization was only 40% electronic in 2024 (CAQH 2025 Index), up from 31% in 2022. The
              persistence of manual workflows at 60% of the market reflects deep interoperability barriers:
              heterogeneous payer systems, EHR fragmentation, specialty-drug coverage complexity, and
              the Change Healthcare cyberattack (February 2024, affecting 193 million individuals) that
              pushed many providers back to manual processes. These barriers represent both an adoption
              opportunity for Forus and a structural headwind against rapid market penetration.

              Market constraint — Medicaid drug pricing reform. HHS and CMS announced the GENEROUS Medicaid
              Model in 2026 to bring most-favored-nation drug pricing to Medicaid. Medicaid prescription
              drug spending exceeded $100 billion (gross) and $60 billion (net of rebates) in 2024. If
              manufacturer revenues are compressed in Medicaid markets, biopharma commercial budgets for
              hub programs and patient-access infrastructure could be reduced. The long-run impact on
              biopharma commercial spending is not quantifiable from current sources.

              Market constraint — incumbent infrastructure. The specialty pharmacy channel (dominated by
              CVS Specialty, Accredo/Cigna, and others) and existing biopharma hub vendors have existing
              contractual relationships, formulary positions, and data rights that create switching costs.
              Forus must navigate, complement, or displace these relationships to expand biopharma commercial
              partnerships. The Drug Channels Institute 2026 report highlights the complexity and market
              power of specialty pharmacy and PBM economics in the current channel.

              Diligence gaps. The biopharma commercial spend on patient-access and hub infrastructure—the
              most directly relevant market for Forus pricing—is not publicly reported at an aggregate level.
              The hub market has been estimated at $3–6 billion historically, but no authoritative 2025–2026
              figure was found in the sources reviewed. The conversion rate between PA friction reduction
              and incremental first-fill revenue (the core value proposition to biopharma) is not publicly
              validated. Investors need an independent validation of this conversion rate to underwrite the
              biopharma revenue model at scale.
