  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation
        blocks:
          - type: paragraph
            body: |
              Forus operates a three-sided market with distinct buyer, user, and payer roles. Healthcare
              providers—primarily specialty practices and their clinical staff—are the primary users of the
              platform. Patients are end beneficiaries who experience faster therapy access, lower out-of-
              pocket costs through affordability program enrollment, and proactive status communication. Biopharma
              manufacturers are the primary payers: they fund the free-to-provider model in exchange for
              commercial access at the moment of clinical decision, prescription-flow data, and drug-launch
              support services. This three-party structure means that "customer" is contextually ambiguous;
              this chapter covers all three tiers but distinguishes the payer-customer (biopharma) from the
              user-customer (provider) and the beneficiary (patient).

              Among providers, the publicly documented customer base is concentrated in high-PA-burden
              specialty categories: dermatology (Goodman Dermatology, Optima Dermatology, AQUA Dermatology),
              allergy and rheumatology (Allergy and Rheumatology Specialists of Houston, US Allergy and
              Asthma), and gastroenterology/GI biologics (Digestive Health Specialists). These specialties
              share a common workflow profile: high biologic prescribing rates, complex payer rules per drug,
              and frequent PA requirements that consume disproportionate coordinator time. Oncology, neurology,
              and other high-PA specialties are described as addressable but have no named references.

              GPO and channel partners function as a second distribution segment. MedicoCX, a nationwide GPO
              serving 300+ independent practices predominantly in allergy, adopted Forus centrally and
              embedded it in onboarding for all new member practices—creating a B2B2B distribution layer.
              OpenEvidence, which delivers more than 1 million clinical consultations per day for US
              physicians, announced a strategic partnership with Forus on April 2, 2026, integrating clinical
              decision support with Forus's prescription access automation. These partnerships extend Forus's
              reach beyond direct practice-by-practice sales.

              The biopharma segment is described only in aggregate: five of the top ten global biopharma
              companies by revenue are partners. No company names, therapeutic areas, or contract structures
              have been publicly disclosed. Health systems are described as part of the provider base
              ("thousands of health systems") but no system is named in public case studies or press releases.
            claimRefs:
