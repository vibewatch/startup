      - number: '7.5'
        title: Technical and Model Risk
        blocks:
          - type: paragraph
            body: |
              Forus's AI models operate across a combinatorially complex rule space: every drug, payer,
              and pharmacy combination has potentially different prior authorization criteria, formulary
              tiers, step-therapy requirements, and patient-assistance program rules. Maintaining this
              rule library requires continuous human oversight from the Clinical Intelligence team led by
              Dr. Adam Harris and Kathleen Alvarez, NP—but no public disclosure details how often models
              are retrained, how drift is detected when payer rules change mid-cycle, or what override
              governance exists when a model's recommendation conflicts with a human reviewer's judgment.

              Chambers Healthcare AI 2025 identifies the black-box problem as one of the most significant
              risks in healthcare AI: lack of model transparency complicates audits, makes HIPAA PHI-usage
              validation difficult, and raises professional liability questions if an AI-assisted
              recommendation leads to a treatment delay. This is not theoretical: a January 2026 Stanford
              study documented that AI algorithms used by health insurers in PA review produced wrongful
              denials of medically necessary care. Foley attorneys confirm that black-box AI makes HIPAA
              compliance audits materially harder because it is unclear which PHI inputs drove any given
              output. Prosper AI identifies model drift as a leading technical risk: payer rules change
              frequently and models trained on historical approval data become stale without active
              retraining.

              On the regulatory technology side, the FDA's January 2026 revised CDS guidance creates a
              safe harbor for AI clinical decision support tools only when a clinician independently
              reviews the basis of the recommendation—a condition Forus's fully automated PA workflow may
              not satisfy for all use cases without additional documentation. KFF documents 29 states with
              existing or pending AI PA oversight laws that collectively create a patchwork of compliance
              obligations multiplying the governance surface area. Competitors Humata Health and Infinitus
              AI publish security and compliance documentation that Forus's trust center does not match in
              granularity, raising the question of whether Forus's compliance posture can satisfy enterprise
              procurement criteria at health system scale. Forus's terms of use include limitation of
              liability provisions that shift risk to providers—an approach that may create friction in
              enterprise contract negotiations with sophisticated buyers.
