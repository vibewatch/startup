  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Workflow and Product Scope
        blocks:
          - type: paragraph
            body: |
              Forus operates as an embedded prescription access layer inside existing physician EHR
              workflows. The trigger point is the moment a clinician writes a prescription in their EHR;
              the platform intercepts the order and executes every administrative step downstream without
              the clinician needing to leave their native workflow or open a separate portal.

              The confirmed product modules span four distinct job-to-be-done areas:

              **Prior Authorization Automation.** Forus generates and submits PA forms to payers
              automatically from EHR prescription data, applies payer-specific criteria and clinical
              guidelines, and manages appeals on denied authorizations. The Forus home page states the
              platform "automates every prior authorization from prescription to approval—generating
              appeals, routing prescriptions to the right pharmacy." Provider testimonials in the company's
              blog describe practice teams reducing phone time from "60 to 70% of our day…now down to
              maybe 15%," and a GI biologic coordinator tripling PA throughput after adoption.

              **Patient Affordability Enrollment.** For prescriptions at risk of abandonment due to cost,
              Forus enrolls patients in manufacturer patient assistance programs (PAPs), co-pay cards, and
              financial support programs automatically. This module is entirely biopharma-funded.

              **Pharmacy Routing and Fulfillment.** Once access is secured, Forus routes each prescription
              to the appropriate retail, specialty, or mail-order pharmacy. The platform is described as
              covering every pharmacy in the country. Patient-facing texts provide status updates including
              confirmation of which pharmacy is dispensing and expected pickup time.

              **Patient Communication Layer.** An automated text-messaging workflow keeps patients
              informed at each handoff: insurance decision, pharmacy routing, and readiness for pickup.
              This reduces inbound calls to the practice staff.

              The OpenEvidence partnership (announced April 2, 2026) formally connects Forus to an AI
              clinical decision support tool used for more than one million clinical consultations per day
              in the United States, so that a physician's evidence-based prescribing decision in
              OpenEvidence can hand off directly to Forus's access automation. This integration is the
              only publicly named EHR or clinical-tool integration partner.

              The platform is available across all 50 US states, covers thousands of practices and health
              systems, and supports millions of patients annually. Provider adoption grew 10x year-over-year
              for two consecutive years. The company has not publicly disclosed which specific EHR systems
              are formally certified or integrated, how many distinct payer connections exist, or what
              percentage of submitted PAs are auto-approved versus require human follow-up.
