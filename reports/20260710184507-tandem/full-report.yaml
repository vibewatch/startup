      - number: '5.2'
        title: AI and Operating Architecture
        blocks:
          - type: paragraph
            body: |
              Forus describes its platform as an "AI-powered network" but has not publicly disclosed its
              technology stack, EHR integration methods, payer API connectivity details, or model
              architecture. Based on official product descriptions, the company blog, and the investor
              announcement, the following architectural layers can be characterized with varying degrees
              of confidence.

              **Clinical Intelligence Layer.** The most detailed public disclosure concerns Forus's
              in-house Clinical Intelligence function led by Adam Harris, MD (VP Applied AI at Oscar
              Health, attending physician at Bellevue Hospital Center, Clinical Assistant Professor of
              Medicine at NYU). The team also includes Kathleen Alvarez, NP (Yale School of Nursing,
              prior rheumatology PA experience). The team's mandate is to embed payer-rule knowledge,
              specialty-specific PA nuance, and formulary logic directly into product design and QA.
              This function translates into a continuously updated policy/rules engine—distinct from an
              autonomous AI clinical decision system—that mirrors the judgment of an experienced PA
              coordinator without delegating clinical authority to an algorithm.

              Dr. Harris has stated: "Our goal isn't just to use AI. Our goal is to support clinicians in
              helping patients get the medication they need, while ensuring everything we build reflects
              real clinical practice." This framing is consistent with a hybrid human-in-the-loop model
              where AI handles pattern matching, form generation, and status tracking, while clinical
              staff maintain judgment over exceptions and appeals.

              **Workflow Automation and Rules Engine.** Forus automates form generation by mapping EHR
              prescription data to payer-specific PA criteria. This requires a continuously maintained
              library of payer rules—insurers' clinical policies and step-therapy requirements—across
              every payer and drug in the United States. Maintaining this library is a significant
              ongoing operational cost and the primary barrier to replication by a new entrant. The
              company has not disclosed the size of this rules database, update frequency, or accuracy
              rate.

              **EHR Integration Model.** Forus is described as "embedded in physician workflows" and
              integrated into EHR systems. The specific integration modalities are not publicly disclosed.
              Standard healthcare IT integration patterns include FHIR R4 APIs, HL7 v2 ADT/ORM feeds,
              SMART on FHIR app launch, or proprietary EHR vendor APIs (Epic App Orchard, Cerner
              OpenPlatform). Waystar's developer portal publicly documents REST APIs, HL7, X12 EDI, sFTP,
              web services, and RPA as integration options—a useful benchmark for what modern RCM
              platforms expose. Humata's technology page confirms HL7/FHIR standard integrations and
              proprietary APIs. Forus has not published a developer portal, API documentation, or EHR
              certification roster.

              **AI Inference.** Optum Rx's public AI roadmap describes a three-tier architecture
              (predictive, generative, agentic) applied to pharmacy and PA workflows. Infinitus uses
              voice AI agents for high-stakes healthcare phone calls including benefit verification and
              PA follow-up. Forus's approach appears focused on workflow orchestration rather than voice
              or generative AI as primary modalities, but the company has not disclosed model types,
              training data sourcing, evaluation methodology, hallucination/override governance, or
              performance benchmarks.

              **Biopharma Data Architecture.** The first-party prescription-flow data asset—PA outcomes,
              formulary overrides, adherence signals, prescriber behavior—is described as a core
              competitive asset and the basis of the biopharma commercial access revenue model. Forus
              has not disclosed de-identification methodology, minimum cell-size suppression practices,
              data governance documentation, or whether data is shared with multiple biopharma customers
              simultaneously or under exclusivity arrangements.

              What is not public: exact EHR system certifications, payer API connectivity roster, model
              evaluation metrics, uptime/SLA figures, BAA template terms, AI governance framework,
              training data provenance, and override/exception escalation rules.
