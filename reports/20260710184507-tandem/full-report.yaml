chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: |
              Tandem Technology, Inc. was founded in 2023 in New York City by Sahir Jaggi and operated under
              the name Tandem until May 12, 2026, when the company publicly rebranded as Forus—formally
              announced as "Forus (formerly Tandem)." The privacy policy names the legal entity "Forus, Inc."
              The company's mission is to accelerate access to medicine by removing administrative barriers
              between the moment a physician writes a prescription and the moment a patient begins therapy.

              The core platform is an AI-powered network embedded directly into physician EHR workflows. When
              a clinician writes a prescription, Forus automatically picks up the order and processes all
              downstream steps: determining prior authorization requirements, generating and submitting PA
              forms to payers, enrolling patients in manufacturer assistance programs when needed, routing
              prescriptions to the optimal pharmacy or specialty pharmacy, and communicating status updates to
              both the physician's team and the patient via text. The platform covers every drug, payer, and
              pharmacy in the country and is provided entirely free to providers and patients.

              The revenue model does not rely on fees from healthcare providers or patients. Instead, Forus
              generates revenue through commercial partnerships with biopharma companies—particularly for drug
              launch support. Because Forus sits at the intersection of prescriber decisions, payer rules, and
              pharmacy fulfillment, it generates first-party data on prescription flow, approval rates, and
              patient adherence that life-sciences companies pay for to improve commercialization strategy.
              Five of the top ten global biopharma companies had partnered with Forus by the May 2026
              announcement. The company operates from a single office of approximately 100 engineers and
              operators in New York City. The company website prior to the rebrand was withtandem.com; it now
              operates at forus.com.
