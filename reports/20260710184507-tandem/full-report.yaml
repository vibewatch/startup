      gross economics.
    approximationNotes: >-
      All node values where quantified are analyst estimates from publicly available benchmarks (CAQH, AMA, Linear
      Health, hub market reports). Forus-specific contract values, margins, and CAC are not publicly disclosed. Nodes
      with question marks represent unknown private metrics.
