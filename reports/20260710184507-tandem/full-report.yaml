      - number: '8.2'
        title: Comparable Valuation and Anchoring
        blocks:
          - type: paragraph
            body: |
              Constructing a rigorous comparable set for Forus requires care because no single public
              company or private round is a direct analog. Forus is best understood as sitting at the
              intersection of three valuation reference points: (1) public RCM and healthcare payments
              platforms, (2) private AI healthcare workflow companies, and (3) strategic/M&A precedents
              for prescription-network infrastructure.

              Waystar (WAY) is the most directly comparable public company. As of June 2026, Waystar
              trades at a $3.56B market capitalization and $4.87B enterprise value on $1.16B TTM revenue,
              implying a 4.21x EV/Revenue multiple and 3.0x Price/Sales ratio. Waystar's stock declined
              from a 2025 year-end market cap of $6.3B to $3.56B—a 43.5% compression—reflecting market
              concerns about growth and a forward P/E of 11x. Waystar was named Black Book's #1-rated
              vendor in "RCM-native agentic AI and autonomous revenue-cycle platforms" for 2026, validating
              its competitive positioning but also reflecting a mature, scaled business rather than a
              hypergrowth early-stage network. Forus at $1B and $50M revenue trades at 20x revenue—a
              4.75x premium to Waystar's multiple—which requires either 3-4x better growth visibility,
              higher gross margins, or a structural moat not reflected in Waystar's public profile.

              McKesson ($94.85B market cap, June 2026) is not a revenue-multiple comparable—its pharmacy
              distribution business trades at approximately 0.3x revenue—but it anchors the strategic
              landscape. McKesson is the dominant pharmacy supply chain player; its CoverMyMeds subsidiary
              owns prescription routing infrastructure for specialty and retail channels. A logical
              inference is that any prescription-routing network with Forus's biopharma-access angle and
              data asset would be strategically interesting to McKesson or its pharmacy channel peers.
              Strategic buyers pay 3-5x the financial DCF value for network assets they cannot build
              organically, which sets an asymmetric outcome scenario not captured in pure revenue multiples.

              Abridge, the ambient AI clinical documentation company, raised a $300M Series E at a $5.3B
              valuation in June 2025 on approximately $100M ARR—an implied ARR multiple of ~53x. By
              April 2026, Abridge had raised an additional $316M Series E extension. Abridge's multiple
              reflects Epic integration, KLAS #1-rated status, and a clearly defined subscription pricing
              model at $2,500 per clinician per year. Forus and Abridge are adjacent but not direct
              competitors: Abridge serves clinical documentation and ambient AI; Forus serves prescription
              access, PA automation, and biopharma commercial workflows. However, Abridge's valuation
              illustrates that purpose-built AI healthcare workflow tools with deep EHR integration and
              confirmed enterprise traction can command multiples of 40-60x ARR from sophisticated
              healthcare-focused investors. Forus's 20x revenue multiple is not excessive by that benchmark
              if its growth trajectory is confirmed and gross margins are above 65%.

              Surescripts, the electronic prescribing and prescription benefit network, provides a
              strategic moat benchmark: it connects virtually all US pharmacies, prescribers, and payers
              as a cooperative-owned infrastructure network and processed 5.97B prescription transactions
              in 2025. Surescripts has no public market cap, but its ability to sustain a network-effects
              moat for over two decades—despite regulatory scrutiny—illustrates that prescription-routing
              infrastructure can become entrenched with near-monopoly characteristics. Forus is building
              a different layer (PA automation and biopharma commercial access rather than routing), but
              the strategic analog is instructive: the value of a prescription-network position accrues
              non-linearly with coverage and data density.

              The overall picture from comparables is that Forus's $1B mark is defensible in a bull scenario
              (confirmed high-gross-margin, confirmed rapid NRR, confirmed partner diversification), but
              implied by a premium-to-public-comps that requires either financial confirmation or a
              strategic-acquisition exit framework to justify. A pure financial underwrite at $1B without
              disclosed metrics is speculative.
