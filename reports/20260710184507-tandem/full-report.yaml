  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Streams
        blocks:
          - type: paragraph
            body: |
              Forus generates revenue exclusively on the biopharma side of its three-sided network
              (providers, patients, biopharma), consistent with its stated mission to make prescription
              access free for clinicians and patients. The official May 2026 announcement and the Forbes
              profile published simultaneously describe a commercial model in which pharmaceutical
              manufacturers pay Forus in exchange for: (1) privileged access to the prescriber network at
              the moment of clinical decision, (2) first-party data on prescription initiation, prior
              authorization outcomes, formulary override patterns, and patient adherence derived from
              real-world workflow processing, and (3) drug-launch support services that accelerate
              time-to-first-fill for newly approved drugs across Forus's provider and pharmacy network.
              Five of the top 10 global biopharma companies had partnered with Forus by the announcement
              date—a penetration rate that implies Forus has already cleared the clinical-validation and
              compliance hurdles required for commercial engagement with the largest pharmaceutical buyers.

              The free-to-provider design is itself a commercial mechanism, not merely a market-entry
              subsidy. By removing budget friction for the provider—who would otherwise face a $2,000–$8,000
              monthly software cost for comparable PA automation (based on Linear Health industry benchmarks)
              or $7–$15 per manual authorization in outsourcing costs (per the same source)—Forus creates an
              adoption flywheel: provider growth expands the prescription-flow data asset, which in turn
              increases the value biopharma manufacturers assign to a commercial access partnership. Network
              scale is thus both the product and the proof point in every biopharma sales conversation. As of
              the announcement, Forus covers nearly 80% of US residential zip codes and thousands of practices
              and health systems across all 50 states.

              Three revenue stream hypotheses are supported or inferable from public sources, and two remain
              speculative. The most evidence-backed stream is biopharma commercial launch partnership fees:
              manufacturers pay Forus to embed their drug launch within Forus's provider engagement layer,
              accelerating uptake for newly approved or newly covered therapies. The second is prescription-
              flow data licensing, where anonymized real-world data on PA approval patterns, formulary
              dynamics, and adherence metrics is sold or bundled into commercial access contracts. The third
              is patient affordability program facilitation—manufacturers fund free patient assistance program
              (PAP) and co-pay card enrollments; Forus likely receives a facilitation fee for streamlining
              enrollment within the clinical workflow. Two additional streams (pharmacy routing channel fees
              and future analytics SaaS) are speculative and unsupported by current public evidence.

              The Forbes article is the sole public source for revenue magnitude: annualized revenue surpassed
              $10 million by year-end 2025 and "roughly quintupled so far this year" as of May 2026. Taking
              the midpoint, this implies an annualized run rate in the range of $45–55 million—a figure driven
              by biopharma contract expansion, not by charging new providers. Revenue growth of this velocity
              in a B2B model with enterprise-sales cycles is consistent with a cohort of five major biopharma
              partners scaling simultaneously from initial pilots to multi-drug commercial deployments.
