      - number: '1.5'
        title: Risk Landscape and Regulatory Environment
        blocks:
          - type: paragraph
            body: |
              Forus operates in the provider-side segment of AI prescription automation—helping doctors
              generate and submit prior authorization requests—rather than in the payer-side segment where
              AI systems evaluate and deny claims. This distinction is meaningful in the current regulatory
              environment, where the controversy centers on insurers using AI to deny care at scale with
              insufficient human review. Nonetheless, the broader regulatory and reputational risks in AI
              prior authorization affect the entire category.

              Multiple independent sources document systemic risks in AI-assisted prior authorization.
              Stanford researchers publishing in Health Affairs in January 2026 warned that AI used by
              insurers for prior authorization can amplify existing flaws: human reviewers at insurance
              companies may lack the time, expertise, and incentives to meaningfully review AI-generated
              recommendations, leading to wrongful denials. KFF research finds that 8-12% of insurer plans
              already use AI to support prior authorization denials. A 2024 AMA survey cited by industry
              analysts found that 61% of physicians fear unregulated AI is being used to increase denials.
              The National Health Law Program (January 2026) warns that a federal AI Executive Order
              threatens to limit state-level consumer protections against AI-driven insurance denials.

              At the state level, the pace of regulation is accelerating. Holland and Knight's 2026 analysis
              documents new AI-in-healthcare laws enacted in Alabama (SB 63), Indiana (HB 1271), Utah
              (SB 319), Washington (SB 5395), Maryland (HB 1563), and Georgia (SB 544)—all enacted in
              2026—each requiring some form of physician review for AI-assisted prior authorization decisions.
              These laws target payer-side AI, not provider tools like Forus, but the regulatory trend
              reflects a climate of heightened scrutiny that could eventually encompass all AI participants
              in the PA workflow. Forus's position as a provider-side tool free to clinicians reduces but
              does not eliminate regulatory and reputational exposure.
            claimRefs:
              - CO033
              - CO034
              - CO035
              - CO036
              - CO037
