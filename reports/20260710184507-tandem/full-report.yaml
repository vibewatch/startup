      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: No Validated Conversion Rate Between PA Friction Reduction and Biopharma Revenue
            body: |
              The core value proposition Forus sells to biopharma—improved first-fill rates leading to
              incremental drug revenue—is not independently validated in any public source. Without a
              credible conversion rate, it is impossible to triangulate from the drug-spending or
              nonfulfillment lens to Forus's actual serviceable addressable market. Investors should
              require independent outcomes data or a bottom-up biopharma pricing model before accepting
              any single TAM figure.
            calloutType: risk
            claimRefs:
              - CM019
              - CM020
          - type: callout
            title: Biopharma Budget Compression Is the Structural Threat Most Correlated with Forus's Revenue Model
            body: |
              The Inflation Reduction Act's drug price negotiation provisions and the new GENEROUS Medicaid
              Model (2026) both compress the net revenue biopharma manufacturers retain on high-volume drugs.
              Because Forus's commercial partnerships are funded from manufacturer commercial budgets—not
              from health system IT budgets—a reduction in manufacturer revenue and commercial spending
              directly threatens Forus's revenue trajectory. This risk is distinct from the clinical or
              regulatory risks typically flagged for prior-authorization AI tools and deserves dedicated
              scenario modeling.
            calloutType: insight
            claimRefs:
              - CM036
              - CM037
          - type: callout
            title: Free-to-Provider Model Creates a Structurally Advantaged Adoption Path
            body: |
              By charging biopharma rather than providers, Forus removes the procurement barrier for its
              primary user base—physician practices and health systems. This structural choice explains the
              company's reported 10x year-over-year provider adoption growth driven almost entirely by
              word of mouth, and positions Forus favorably against paid PA automation competitors that face
              a formal procurement cycle with a revenue-cycle finance team. The risk is that if the biopharma
              model is disrupted (by budget compression or regulatory scrutiny of manufacturer-funded
              workflows), there is no natural fallback revenue stream from providers.
            calloutType: strength
