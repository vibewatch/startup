      - number: '4.2'
        title: Unit Economics, Pricing, and Benchmarks
        blocks:
          - type: paragraph
            body: |
              Forus does not publicly disclose contract pricing, deal structure, average selling price per
              drug launch, or revenue per biopharma partner. All unit-economic metrics—gross margin, CAC for
              biopharma, net revenue retention, payback period, and cost of goods sold—remain private. The
              following analysis triangulates benchmarks from comparable markets to frame what the unit
              economics could look like; these are inferential estimates, not verified figures.

              Provider-side value creation establishes the pricing floor for biopharma contracts. The CAQH
              2024 Index quantifies the manual prior authorization transaction at $11.58 per event versus
              $2.17 for fully electronic processing—an 81% reduction. The AMA 2024 physician survey reports
              that practices spend approximately 13 staff-hours per week on PAs, and when fully loaded with
              staff time (coordinator labor at $20–25/hour in a mid-tier market), a manual PA transaction
              costs $20–35. Practices using automation platforms achieve first-pass approval rates above 95%
              versus an 80–85% industry average, reducing denial follow-up and rework costs substantially.
              Because Forus delivers this value without charging providers, the entire ROI accrues to the
              practice—making adoption a workflow-integration decision rather than a procurement decision.
              This is the adoption acceleration mechanism that biopharma partners fund: a free adoption
              incentive for the prescriber channel they need to commercialize their drugs.

              The biopharma commercial access market provides a pricing ceiling and comp set. Cardinal Health's
              hub evolution research and ICER's 2025 launch pricing report together suggest that biopharma
              manufacturers spend $50–200 million on commercial access infrastructure per major drug launch,
              including traditional hub services, co-pay assistance, specialty pharmacy education, and patient
              support programs. Traditional hub-and-spoke vendors—such as Inovalon, EVERSANA, AssistRx, and
              Sonexus—typically charge per-patient-enrolled, per-authorization-processed, or annual platform
              fees in the range of $500,000 to $5 million per drug. Forus's network approach, delivered
              through EHR-embedded workflow at the point of prescribing rather than post-prescription call
              centers, represents a structural upgrade to the hub model. A reasonable inference is that Forus
              charges in the range of $1–5 million per drug launch engagement, with data and analytics
              components creating upsell potential. At five biopharma partners managing multiple drugs each,
              a $45–55 million run rate is plausible if each partner commits $8–15 million annually across
              a portfolio of drugs. These estimates are unverifiable without contract disclosures.

              Gross margin benchmarks for comparable models support a hypothesis of 65–80% gross margin.
              Digital health and data licensing platforms with software delivery (no physical goods, minimal
              per-customer variable cost beyond hosting and support) typically achieve gross margins in this
              range. Forus's primary cost of revenue is likely infrastructure (EHR integration middleware,
              data processing, payer API connectivity) and clinical operations (reviewing edge cases, updating
              payer rules), both of which are largely fixed or near-fixed at scale. If this margin hypothesis
              holds, Forus at a $50M run rate would generate approximately $32.5–40M in gross profit annually.
              However, in the absence of audited financials, this remains an estimate that downstream
              investors must verify.

              No net revenue retention, cohort churn, biopharma contract renewal, or LTV data has been
              publicly disclosed. The five-biopharma partner penetration figure in the official announcement
              and the 5x revenue growth signal are consistent with rapid NRR expansion (new drugs being
              added to existing partner relationships), but this cannot be confirmed without NRR disclosures.
