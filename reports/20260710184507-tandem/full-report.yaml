      - number: '1.4'
        title: Scale, Traction, and Key Metrics
        blocks:
          - type: paragraph
            body: |
              As of the May 2026 rebrand announcement, Forus is used by thousands of medical practices and
              health systems across all 50 US states. Provider adoption grew 10x year-over-year for each of
              the preceding two years, driven almost entirely by word of mouth rather than paid marketing.
              Forus supports patients in nearly 80% of US residential zip codes, including underserved
              communities where patients are, in many cases, accessing specialty therapy for the first time.

              Customer case studies illustrate the practical impact across multiple specialties. Goodman
              Dermatology (10 locations, 35+ providers) reports approvals for patients who had been denied
              at other practices, often within 2-3 days. MedicoCX, a group purchasing organization serving
              300+ independent practices, reduced its team's payer phone time from 60-70% to under 15% of
              the day. Digestive Health Specialists' biologic coordinator increased PA throughput from
              approximately 5-10 fully worked-up PAs per day to 15-30. Optima Dermatology cleared a 500+
              task backlog and now initiates all prior authorizations the same day. OpenEvidence, which
              powers over 1 million clinical consultations per day for US physicians, announced a strategic
              partnership with Forus on April 2, 2026, integrating clinical decision support with Forus's
              prescription access automation.

              Forus has completed three consecutive SOC 2 Type II audits with clean opinions from Sensiba
              LLP, the most recent covering February 1, 2025 through January 31, 2026, covering security,
              availability, processing integrity, confidentiality, and privacy. The company reports
              approximately 100 engineers and operators in New York City. Revenue, margin, and churn figures
              are not publicly disclosed beyond the annualized estimates reported by Forbes.
