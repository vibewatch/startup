      optimistic assumptions; all unverified by audited financials.
    approximationNotes: >-
      Revenue bounds derived from Forbes ($10M end-2025 floor, ~quintupled in ~6 months = ~$45–55M mid-2026 range).
      Gross margin bounds from comparable digital health data platform comps. Burn rate bounds from NYC headcount
      benchmarks (100 FTEs at $150–250K fully loaded plus overhead). Runway bounds calculated from estimated cash
      (assuming $60–140M remaining) divided by burn bounds. All metrics except total raised and valuation are analyst
      estimates; Forus has not disclosed these figures.
    claimRefs:
      - CI019
      - CI020
      - CI021
      - CI022
      - CI023
      - CI024
    data:
      items:
        - label: Annualized Revenue — end-2025
          low: 8
          high: 12
          unit: $M
          detail: >-
            Forbes: 'annualized revenue surpassed $10M by yearend.' Low = conservative reading of 'surpassed'; high =
            modest upside.
        - label: Annualized Revenue — mid-2026 (run rate)
          low: 40
          high: 60
          unit: $M
          detail: >-
            Forbes: 'roughly quintupled so far this year.' Midpoint $10M × 5 = $50M; range reflects imprecision of
            'roughly.'
        - label: Total Funding Raised
          low: 160
          high: 165
          unit: $M
          detail: >-
            Official announcement states 'raised $160M.' Upper bound acknowledges possible rounding or unreported
            tranches.
        - label: Last Valuation
          low: 900
          high: 1100
          unit: $M
          detail: >-
            Forbes states '$1 billion valuation.' Range reflects precision uncertainty (post-money vs pre-money;
            rounding).
        - label: Estimated Annual Cash Burn
          low: 18
          high: 35
          unit: $M/yr
          detail: >-
            100 NYC FTEs × $150–250K fully loaded = $15–25M + overhead. Low = lean operating model; high = aggressive
            growth hiring.
        - label: Estimated Runway (from announcement date)
          low: 4
          high: 8
          unit: years
          detail: >-
            Estimated cash ($60–140M) ÷ burn ($18–35M/yr). Wide range reflects compounded uncertainty. Does not assume
            profitable growth offset.
