      - number: '1.2'
        title: Founder and Leadership
        blocks:
          - type: paragraph
            body: |
              Sahir Jaggi, age 31, is the sole publicly named founder and serves as Chief Executive Officer.
              Jaggi was born to Indian immigrants and grew up in upstate New York. He studied biomedical
              engineering at Columbia University and, after graduating, spent approximately six years at
              Oscar Health—the insurance startup co-founded by Thrive Capital managing partner Josh Kushner—
              where he rose to Director of Product Strategy. His time at Oscar gave him direct exposure to
              the complexity and systemic inefficiency of prescription drug coverage and prior authorization
              workflows. He was also a partner at Rough Draft Ventures, a student-oriented venture fund.
              In January 2025, Forbes named Jaggi to its 30 Under 30 Healthcare list.

              The company does not publicly list a CTO, CFO, or COO. The named operational leadership
              visible in company materials includes Adam Harris, MD, who leads Forus's Clinical Intelligence
              function. Dr. Harris previously served as VP of Applied AI at Oscar Health and is an active
              practicing physician at Bellevue Hospital Center and a Clinical Assistant Professor of Medicine
              at NYU School of Medicine. He oversees a team that embeds clinical expertise—including
              payer-rule knowledge, specialty-specific workflows, and PA nuance—directly into product design
              and quality assurance. Kathleen Alvarez, NP (Yale School of Nursing), is also a named member
              of the Clinical Intelligence team and brings frontline nursing and rheumatology PA experience.
              Key-person dependence on Sahir Jaggi is material: his personal brand, founder-market fit as
              an Oscar Health alum, and investor relationships are central to the company's identity and
              deal flow.
