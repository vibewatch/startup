      - number: '7.2'
        title: Privacy, HIPAA, and Data-Rights Risk
        blocks:
          - type: paragraph
            body: |
              Forus processes protected health information (PHI) at the intersection of three highly
              regulated data flows: clinical prescription data from EHR systems, payer eligibility and
              coverage data, and patient demographics and benefits enrollment. Foley and Lardner's May
              2025 guidance makes clear that none of HIPAA's core rules change because AI is involved:
              PHI can only be accessed, used, and disclosed for permissible purposes; the minimum
              necessary standard applies to every AI tool; and any AI vendor processing PHI must be
              covered by a Business Associate Agreement with AI-specific clauses addressing model
              training data, retention, sub-contractor chains, and breach notification.

              Forus's public privacy disclosures (forus.com/pp) acknowledge the BAA structure but do not
              provide detail on which specific covered-entity classes Forus executes BAAs with, whether
              its AI models are excluded from training on patient PHI, or what de-identification standard
              it uses if data is repurposed for biopharma analytics. This gap is material: biopharma
              commercial partnerships depend on data that can legally be shared, and undisclosed
              de-identification practices leave open the question of whether Forus meets HIPAA's Safe
              Harbor or Expert Determination standards.

              The financial stakes are high. IBM Security's 2025 Cost of a Data Breach Report found that
              healthcare data breaches averaged $7.42 million per incident—the highest of any industry for
              the fourteenth consecutive year—and the average time to contain a healthcare breach is 279
              days. OCR has HIPAA Security Rule finalization on its 2026 regulatory agenda, which would
              mandate annual security risk assessments and 24-hour breach reporting. Gartner projects 60%
              of healthcare organizations plan formal AI governance programs by 2026; the other 40% face
              escalating exposure. Forus's trust center references SOC 2 attestation but does not disclose
              the Type II date or auditor. Competitors including Humata Health and Infinitus AI publish
              more granular compliance documentation, which may create procurement friction with enterprise
              health systems.
