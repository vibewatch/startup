            Free-to-provider model eliminates budget friction. AMA: practices spend 13 staff-hours/week on PAs worth
            $20–35/transaction; Forus captures this ROI at zero cost to the provider.
        - id: pa-volume
          label: PA Volume + Engagement Signal
          detail: >-
            Each processed PA adds to the prescription-flow data asset. CAQH 2024: manual PA costs $11.58 vs $2.17
