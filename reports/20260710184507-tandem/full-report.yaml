  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: |
              The competitive landscape for Forus fragments into five distinct categories, each with a
              different buyer relationship, revenue model, and capability scope.

              The first category is direct AI-PA automation peers—vendors whose core product is automating
              the prior-authorization lifecycle for provider organizations. Humata Health is the most
              relevant peer: its PAthway platform covers the full PA continuum from requirements
              determination through clinical bundling, submission, status monitoring, and post-auth
              surveillance. It integrates natively with major EHRs, reports a 96% first-pass approval
              rate, and maintains enterprise security certifications (HITRUST CSF, SOC 2 Type II). Develop
              Health targets specialty-pharmacy-centric PA automation with a similar provider-payment
              model. Neither competitor publicly replicates Forus's affordability-program enrollment,
              biopharma-funded economics, or point-of-prescribing EHR trigger for the full access workflow.

              The second category is voice-AI adjacents: platforms automating telephone interactions
              required for PA status checks and benefit verification when electronic routes are
              unavailable. Infinitus is the principal player, with 8 million-plus payer calls completed,
              125,000+ providers served, and claimed adoption among 44% of Fortune 50 companies. Infinitus
              activates post-submission and addresses payer phone queues; it is not an EHR-embedded
              prescribing workflow tool and does not handle affordability enrollment or pharmacy routing.

              The third category is incumbent clearinghouse and network operators. CoverMyMeds (McKesson)
              claims approximately 90% of electronic PA transaction volume, connecting 94% of US
              prescription volume, 96% of pharmacies, and 950,000+ healthcare professionals. This network
              scale is the dominant incumbent moat: routing through CoverMyMeds is embedded by default in
              EHR workflows, payer portals, and PBM systems. Change Healthcare, now operating under
              Optum/UnitedHealth Group, operates a complementary e-PA clearinghouse. The February 2024
              ransomware attack on Change Healthcare—the largest US healthcare data breach in history—
              disrupted prior-authorization workflows for 80% of affected practices and exposed the
              systemic fragility of centralized clearinghouse infrastructure.

              The fourth category is RCM-platform competitors. Waystar offers PA authorization management
              as a module within a unified revenue cycle management suite used by more than 1 million
              providers covering 60% of the US patient population. Its PA module integrates with Epic,
              Cerner, and MEDITECH and focuses on financial clearance and denial prevention rather than
              prescription-access or biopharma engagement.

              The fifth and largest category is the substitute pool: manual staff navigating payer portals,
              EHR-native PA modules (Epic's built-in PA functionality, Oracle Health), traditional
              biopharma hub vendors, and internal build initiatives at large health systems or pharma
              companies. The CAQH 2025 Index found that only 40% of prior-authorization transactions were
              handled electronically in 2024, confirming that manual substitution remains the majority
              baseline against which all PA automation vendors compete. Physicians complete an average of
              39 PAs per week per the AMA 2026 action kit, consuming approximately 13 staff-hours weekly.
