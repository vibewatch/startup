      - number: '7.3'
        title: Infrastructure and Concentration Risk
        blocks:
          - type: paragraph
            body: |
              The February 2024 Change Healthcare ransomware attack is the most relevant infrastructure
              risk case study for Forus. Change Healthcare processes approximately 15 billion healthcare
              transactions annually, touching one in three patient records. When ALPHV BlackCat encrypted
              its systems, the cascade was immediate and national: 74% of hospitals reported direct patient
              care impact including delays in authorizations for medically necessary care, 94% reported
              financial impact, and 33% said more than half of their revenue was disrupted. Sixty percent
              required two to three months to resume normal operations. The AHA described it as the most
              significant cyberattack against US healthcare in history.

              Forus's architectural exposure is structurally similar. The platform depends on payer
              clearinghouse APIs and EHR integrations to route PA submissions and prescription data.
              No specific clearinghouse relationships are publicly disclosed, making it impossible to assess
              whether Forus uses a single-vendor clearinghouse path (concentrated risk) or a multi-vendor
              fallback architecture (partially mitigated). If Forus routes through any major clearinghouse
              that experiences an outage analogous to Change Healthcare, Forus's automation layer ceases
              to function—eliminating the core provider value proposition and exposing biopharma partners
              to prescription-flow data gaps precisely when launch data is most valuable.

              The HIPAA Journal documents ongoing legal aftermath including the Nebraska Attorney General's
              lawsuit against Change Healthcare surviving a motion to dismiss in November 2025, underscoring
              that infrastructure failures at third-party providers create liability that outlasts the
              operational disruption. Becker's reporting confirms that some payer contracts had to be
              renegotiated following the attack. UnitedHealth Group's 2025 10-K (SEC filing) provides the
              most authoritative disclosure of Change Healthcare's financial impact: billions in remediation
              costs and ongoing regulatory exposure. For Forus, this translates to a risk that a major
              clearinghouse failure could simultaneously impair operations, require emergency vendor
              switching, and trigger regulatory scrutiny of data handling during the disruption period.
