  - id: FV001
    title: Recommendation Logic
    type: flow
    layout: wide
    summary: >-
      Decision chain from confirmed evidence inputs (network scale, revenue anchor, funding) through risk-discount
      factors (concentration, regulatory, margin opacity) to the 'track / research more' recommendation and the six
      diligence gates that would move the call to buy.
    approximationNotes: >-
      Network scale and revenue anchor are public-source confirmed. Risk-discount factors are analyst-assessed from
      publicly available regulatory and competitor evidence. The recommendation node reflects the base-case valuation
      analysis; a full NDA data room resolving gross margin, NRR, and concentration could shift the terminal node to
      'buy at $700M–$1B'.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV022
      - CV030
      - CV033
      - CV034
      - CV040
    data:
      nodes:
        - id: evidence-in
          label: Confirmed Evidence Inputs
          detail: >-
            Network: ~80% US zip codes, all 50 states; Revenue: ~$50M annualized (Forbes); Funding: >$160M raised;
            Partners: 5 of top-10 global biopharma.
        - id: strategic-value
          label: Strategic Value Layer ($600M–$1B+)
          detail: >-
            Prescription-routing network, biopharma commercial access data asset, and free-to-provider moat create a
            strategic acquisition target for clearinghouse, payer, or pharmacy chain incumbents.
        - id: risk-discounts
          label: Risk-Discount Factors
          detail: >-
            Biopharma concentration (undisclosed); Gross margin opacity; Regulatory rearchitecture risk (35+ state
            bills); Waystar multiple compression precedent (-43.5% in 2026).
        - id: diligence-gate
          label: Six Blocking Diligence Items
          detail: >-
            Gross margin, burn rate, NRR, contract concentration, BAA/de-identification governance, clearinghouse
            redundancy — none publicly available.
        - id: base-valuation
          label: 'Base-Case Fair Value: $500M–$750M'
          detail: >-
            10–15x trailing revenue, 1.5-2x growth assumption, 55–70% gross margin estimated; $1B mark is 30–50%
            stretched under base assumptions.
        - id: recommendation
          label: 'Recommendation: Track / Research More'
          detail: >-
            Entry at $1B requires bull-case confirmation (>65% GM, >105% NRR, diversified partners). Secondary market
            entry at $400M–$700M provides margin of safety. NDA diligence resolving six blocking items could shift call
            to buy.
  - id: FV002
    title: Valuation / Return Range
    type: range
    layout: wide
    summary: >-
      Bull, base, and bear valuation ranges for Forus as of June 2026, derived from revenue anchor ($50M annualized per
      Forbes), scenario-specific growth and multiple assumptions, and comparable-set bracket analysis. M&A strategic
      exit scenarios shown separately as upside option value not included in standalone financial range.
    approximationNotes: >-
      All ranges are analyst estimates. Revenue anchor ($50M) is company-reported via Forbes, not audited. Multiples are
      derived from Waystar public EV/Revenue (4.2x), private AI healthcare growth-stage range (10–15x), and Abridge
      Series E ARR multiple (~53x). Gross margin, NRR, and concentration assumptions are scenario-specific and
      unverified. M&A premium estimate (2–3x DCF) is based on precedent from Change Healthcare acquisition and
      Surescripts strategic moat analogy, not a binding indication of interest.
    claimRefs:
      - CV022
      - CV025
      - CV026
      - CV027
      - CV028
      - CV030
    data:
      items:
        - label: 'Bear: Standalone Financial DCF'
          low: 200
          high: 420
          unit: $M
          detail: >-
            Revenue growth stalls at $50–70M; 4–6x EV/Revenue (Waystar-comp) reflecting regulatory pressure and
            concentration risk. Represents a 58–80% discount to $1B mark.
        - label: 'Base: Private Growth-Stage'
          low: 500
          high: 750
          unit: $M
          detail: >-
            10–15x trailing revenue on $50M; 1.5–2x annual growth assumed; 55–70% gross margin estimated. Represents
            25–50% discount to $1B mark. Secondary entry $400–700M adds margin of safety.
        - label: 'Bull: Confirmed High-Growth Economics'
          low: 1000
          high: 1500
          unit: $M
          detail: >-
            8–10x forward 2027 revenue of $125–150M; >70% gross margin confirmed; >105% NRR verified; 3+ new biopharma
            partners added. Supports $1B entry or above.
        - label: M&A Strategic Exit (Option Value)
          low: 1500
          high: 2500
          unit: $M
          detail: >-
            Strategic acquirer (clearinghouse, payer, pharmacy chain) pays 2–3x standalone DCF as control premium for
            prescription-routing network. Not underwriteable as base case; represents asymmetric upside in strategic
            process.
  - id: FV003
    title: Valuation Sensitivity — Revenue Multiple Scenarios
    type: bar
    layout: wide
    summary: >-
      Implied enterprise value at Forus's $50M annualized revenue under five revenue multiples ranging from the Waystar
      public-market floor (4.2x) to the Abridge-adjacent high-growth premium (30x). The current $1B disclosed mark
      corresponds to the 20x scenario. Sensitivity illustrates the multiple compression / expansion risk embedded in the
      investment thesis.
    approximationNotes: >-
      Revenue base of $50M is company-reported via Forbes (annualized as of May 2026); not audited. Each bar represents
      implied enterprise value = $50M × revenue multiple shown. No leverage or preference stack assumed. The 30x
      'adjacent AI comp' bar uses Abridge's ~$100M ARR at $5.3B valuation as a directional upper bound, not a price
      target.
    claimRefs:
      - CV008
      - CV013
      - CV022
      - CV024
      - CV025
    data:
      items:
        - label: 4.2x — Waystar public EV/Rev
          value: 210
          unit: $M
          detail: >-
            Public-market floor: Waystar's current EV/Revenue multiple applied to $50M. Represents full public-market
            re-rating risk if growth narrative disappoints.
        - label: 10x — Base private growth
          value: 500
          unit: $M
          detail: >-
            Conservative private growth-stage multiple for healthcare AI with unverified margin profile. Base-case lower
            bound.
        - label: 15x — Premium private growth
          value: 750
          unit: $M
          detail: Appropriate for confirmed 1.5–2x annual growth and gross margin 60–70%. Base-case upper bound.
        - label: 20x — Current $1B mark
          value: 1000
          unit: $M
          detail: >-
            Implied by the disclosed $1B valuation at $50M revenue. Requires bull-case confirmation to be defensible
            under base assumptions.
        - label: 30x — Adjacent AI comp
          value: 1500
          unit: $M
          detail: >-
            Directional upper bound using Abridge's ~53x ARR as ceiling and adjusting for Forus's less-public
            validation, different revenue model, and lower evidence quality. Achievable only in M&A or confirmed bull
            scenario.
  - id: FV004
    title: Investment KPI Scorecard
    type: kpi
    layout: standard
    summary: >-
      IC-ready scoring across six investment dimensions: market opportunity, proof of traction, competitive moat,
      financial economics, risk profile, and evidence quality. Scores reflect publicly available evidence as of June
      2026; private diligence could improve the economics and evidence-quality scores materially.
    approximationNotes: >-
      Scores are analyst assessments based on publicly available evidence only. 'High' = strong evidence-based support;
      'Medium' = directionally positive but insufficiently verified; 'Low' = insufficient public evidence to assess
      positively. Revenue and valuation figures are from Forbes and public announcements. Risk scores reflect chapter 07
      analysis.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV022
      - CV033
      - CV034
    data:
      items:
        - label: Market Opportunity
          value: High
          detail: >-
            Prior authorization and prescription-access automation address a $530M+ annual administrative waste problem;
            biopharma commercial launch market is a $50–200M per-drug spend category; TAM is large and structurally
            growing.
        - label: Proof of Traction
          value: Medium
          detail: >-
            ~$50M annualized revenue and 5 top-10 biopharma partners confirm commercial validation, but retention,
            satisfaction, and product depth metrics are unverified by independent third parties.
        - label: Competitive Moat
          value: Medium-High
          detail: >-
            80% US zip code coverage, biopharma-funded free-to-provider model, and first-party real-time PA data create
            network-effects moat; moat durability requires verified EHR integration certification and payer connectivity
            breadth confirmation.
        - label: Financial Economics
          value: Low-to-Medium
          detail: >-
            Revenue velocity is exceptional (~5x in 6 months); gross margin, NRR, burn rate, and concentration are
            entirely private; underwriting confidence is low until NDA diligence is completed.
        - label: Risk Profile
          value: High Risk
          detail: >-
            Regulatory (35+ AI-PA bills), concentration (undisclosed biopharma partners), infrastructure (clearinghouse
            dependency), and privacy (BAA/de-identification gaps) risks are all present; no single risk is likely fatal
            in isolation.
        - label: Evidence Quality
          value: Low-to-Medium
          detail: >-
            Company-reported metrics (Forbes) are the only financial anchor; no independent analyst coverage (KLAS, G2,
            Gartner), no audited financials, no named customers. Network scale metrics are independently verifiable in
            principle but not third-party audited.
