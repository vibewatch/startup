      - number: '6.3'
        title: Buyer Economics and Adoption Motion
        blocks:
          - type: paragraph
            body: |
              The economics of Forus adoption differ sharply by customer segment. For providers, the
              decision is zero-cost and driven by workflow ROI: eliminating the 13 staff-hours per week
              spent on prior authorization navigation (per GC's blog citing AMA data) without spending
              $2,000–$8,000 per month on competing platforms. The free-to-provider design converts a
              procurement decision into a workflow-integration decision, eliminating budget cycles, IT
              approvals, and ROI justification processes. The Allergy and Rheumatology Specialists of Houston
              case study illustrates the frictionless adoption pattern: the administrator submitted one
              prescription immediately after the onboarding call, received approval in two days, and
              onboarded the full practice within the same week, sending 30–40 prescriptions in the first
              seven days.

              The referral and GPO channels extend this frictionless model to networks. MedicoCX's adoption
              of Forus as a GPO-wide standard means every new member practice is introduced to Forus during
              onboarding—without any additional sales effort by Forus. Dr. Goodman's recommendation to AQUA
              Dermatology triggered an organization-wide rollout covering the entire AQUA network. These
              cascade events produce disproportionate scale: a single enterprise-level physician group or
              GPO relationship can deliver hundreds of member practices simultaneously.

              The patient impact—documented by comparable PA automation studies from Surescripts, MCG, and
              HealthEdge—establishes what providers and biopharma expect when buying PA automation. Surescripts'
              pilot with Fairview Health Services reduced authorization denials caused by missing clinical
              information by 88%, and many approvals completed in under 30 seconds. The MCG/Regence/MultiCare
              collaboration, recognized with the 2023 KLAS Points of Light award, cut average patient wait time
              from 15 days to near-real-time for some procedures. Alithya's implementation for a large
              US health insurer processed 9M+ document pages monthly at 80% straight-through processing,
              saving $2.5M+ annually. HealthEdge case studies document 40 minutes of combined staff time saved
              per auto-approved routine request. These are not Forus outcomes; they represent the benchmark
              expectations that buyers carry when evaluating any PA automation platform including Forus.

              Roughly half of patients with chronic conditions never take their medications as prescribed,
              contributing an estimated $528 billion annually in avoidable spending. Nearly 80% of physicians
              report patients abandoning treatment because of PA-related access friction. These figures, cited
              by General Catalyst and the AMA, frame why both providers (workflow burden) and biopharma
              (lost revenue from unfilled prescriptions) are motivated to fund and adopt Forus.
