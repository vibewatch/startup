      - number: '5.3'
        title: Security, Compliance, and Oversight
        blocks:
          - type: paragraph
            body: |
              Forus's compliance posture is better documented than most Series B–stage digital health
              companies. The company's trust center (security.forus.com, powered by SafeBase) announces
              two consecutive clean SOC 2 Type II audits performed by Sensiba LLP: the first for the
              period February 2024 to January 2025 (completed under the Tandem brand), and the third for
              the period February 2025 to January 2026 (completed under the Forus brand with no noted
              exceptions). Both reports cover the AICPA trust services criteria: security, availability,
              processing integrity, confidentiality, and privacy. A second completed audit in the
              period ending January 2025 is also referenced.

              The Terms of Use (forus.com/tou, last modified May 12, 2026) identify the legal entity as
              "Forus, Inc." and the governed website as withtandem.com (reflecting the rebrand in
              progress). The ToU includes standard IP and compliance-with-laws provisions but does not
              address healthcare-specific obligations. The Privacy Policy (forus.com/pp) is the primary
              HIPAA-adjacent public document; it covers data types collected from providers, patients,
              and the website but does not confirm the existence of a Business Associate Agreement
              template, subprocessor list, or HITRUST certification.

              Compared to Humata Health—which publicly confirms SOC 2 Type II, HIPAA compliance, and
              HITRUST CSF v9.5.0 r2 certification—Forus's HITRUST status is unknown from public sources.
              Humata also lists both a compliance and security contact email, whereas Forus's trust center
              is the primary public-facing channel.

              Regulatory and legal context from prior chapters remains material:

              The KFF survey (2025) and the Stanford AI health-insurance research (2026) both surface
              concerns about AI-driven PA decision accuracy and racial/socioeconomic bias in automated
              denial decisions. The Holland & Knight legal analysis documents 25+ state AI-in-healthcare
              bills as of May 2026. The Health Law Program's federal AI policy brief (2026) identifies
              federal prior authorization reform as potentially narrowing the administrative scope in
              which PA automation companies operate. While these risks apply category-wide, Forus's
              specific governance responses—how the Clinical Intelligence team monitors for bias, what
              the appeal/override escalation path is, and whether there are published clinical decision
              override rates—are not publicly disclosed.

              The Change Healthcare cyberattack (February 2024, AHA reporting) demonstrated the systemic
              fragility of centralized healthcare clearinghouse architecture: a single ransomware event
              disrupted claims processing for a significant portion of the US healthcare market. Forus's
              platform sits at a similarly high-criticality point in the prescription workflow. Its
              disaster recovery plan, incident response capability, and redundancy architecture are not
              publicly disclosed.

              Key compliance items confirmed: SOC 2 Type II (three consecutive audits, clean opinions).
              Key compliance items unknown: HITRUST status; specific BAA terms and subprocessor list;
              uptime SLAs and status page; override/escalation governance; AI bias monitoring; incident
              response and disaster recovery documentation.
