figures:
  - id: FU001
    title: "Customer Journey Map"
    type: journey-map
    layout: wide
    summary: "Stages of the Forus provider customer journey from pain state through referral and expansion, illustrating the word-of-mouth and channel mechanisms that drive adoption without paid marketing."
    approximationNotes: >-
      Stage descriptions are synthesized from Forus blog case studies (Goodman, MedicoCX, Allergy Houston),
      the GC investor blog, and the Pulse2 article. Conversion rates between stages are not publicly disclosed;
      stage labels describe qualitative dynamics, not quantified funnel rates.
    claimRefs:
      - CU007
      - CU015
      - CU022
      - CU039
      - CU040
    data:
      items:
        - label: "Provider Pain State"
          detail: "Specialty practice spending 13+ hrs/week on PA; patients abandoning treatment; staff overwhelmed with payer calls; 2–3 week starts for specialty biologics"
        - label: "Discovery via Peer Referral or GPO"
          detail: "No paid acquisition as of May 2026; introduction through colleague (e.g., Dr. Goodman → AQUA), GPO coordinator (MedicoCX), or open-evidence integration (OpenEvidence partnership)"
        - label: "Zero-Friction Onboarding"
          detail: "No provider cost; EHR integration during a single onboarding call; first PA submitted same day; no IT procurement required"
        - label: "Active Daily Use"
          detail: "100% specialty Rx routed through Forus; morning dashboard review; proactive patient text updates; automated PA, appeals, and affordability enrollment"
        - label: "Documented Outcome"
          detail: "PA turnaround drops from days-to-weeks to 1–3 days; backlog cleared; phone time cuts from 60–70% to <15%; throughput 3–6x per coordinator"
        - label: "Referral and Network Expansion"
          detail: "Satisfied provider refers peers, joins GPO network, or triggers organization-wide rollout (AQUA Dermatology model); word-of-mouth feeds next cohort of providers"

  - id: FU002
    title: "Adoption and Deployment Funnel"
    type: funnel
    layout: standard
    summary: "Estimated funnel from total US specialty prescriber base through peer-awareness, onboarding, active use, and public referenceability. Values are analyst estimates; no denominator has been publicly disclosed by Forus."
    approximationNotes: >-
      Total specialty prescriber estimate (~200K) is an analyst approximation from AMA specialty workforce data.
      Stage percentages are illustrative estimates based on 'thousands of practices' stated by Forus against the
      total specialty prescriber universe; no official Forus funnel data exists. The gap between 'onboarded' and
      'named reference' is the central evidence concern highlighted throughout this chapter.
    claimRefs:
      - CU005
      - CU015
      - CU016
      - CU029
    data:
      items:
        - label: "Total US Specialty Prescribers (~200K+)"
          value: 100
          detail: "Addressable provider universe: dermatology, allergy/rheum, GI, oncology, neurology, and other high-PA-volume specialties"
        - label: "Aware via Peer Referral (~5–15%)"
          value: 10
          detail: "Word-of-mouth only as of May 2026; no paid acquisition channel; GPO introductions structured but unquantified"
        - label: "Onboarded Practices (Thousands; est. ~1–5%)"
          value: 4
          detail: "'Thousands of practices and health systems across all 50 states'; no published absolute count; 10x YoY growth rate confirmed"
        - label: "High-Volume Active Users (est. ~0.5–2%)"
          value: 2
          detail: "Practices routing majority of specialty Rx through Forus; biologic coordinators using daily; GPO network accounts"
        - label: "Named Public References (<0.1%)"
          value: 0.2
          detail: "Fewer than 10 named provider logos in all public case studies as of May 2026; largest gap in referenceability versus adoption claims"

  - id: FU003
    title: "Customer Proof Matrix"
