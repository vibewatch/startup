  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: retention-and-churn
      missingEvidence: "Provider retention cohort data (6-month and 12-month active practice rates), biopharma NRR/GRR, renewal rates, and any cohort-level revenue data."
      whyItMatters: "The 10x YoY growth and 5x revenue step-up could reflect genuine cohort expansion or could mask early-cohort churn offset by rapid new additions; without cohort data, revenue quality cannot be assessed."
      diligencePath: "Request monthly active practice count over trailing 24 months; request biopharma cohort ARR schedule by year (2024 vs. 2025 vintage); confirm annual renewal rate for both segments."
      relatedQuestionRefs:
        - QU012
        - QU019

    - type: missing-source
      severity: material
      topic: named-biopharma-logos
      missingEvidence: "No pharmaceutical company name, therapeutic area, or contract structure has been publicly disclosed for any of the five top-10 biopharma partners."
      whyItMatters: "Revenue concentration in a handful of unnamed biopharma relationships is the primary customer risk; a single partner departure could represent a >20% revenue shortfall with no public warning signal."
      diligencePath: "Request top-3 biopharma customers as % of total revenue; request anonymized contract term sheets confirming duration, minimums, and renewal; confirm whether any partner has reduced or paused spend."
      relatedQuestionRefs:
        - QU009
        - QU018

