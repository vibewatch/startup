  - id: s2
    title: Named Customer Proof and Outcomes
    body: |
      Forus has published five named provider case studies on its blog, each featuring a distinct
      specialty segment and documenting specific operational outcomes. These case studies are the
      primary public evidence of real production deployment, but all are authored by Forus and have
      not been independently corroborated or audited. They are nonetheless specific, named, and
      outcome-rich—a higher standard of evidence than logo lists alone.

      Goodman Dermatology (10 locations, 35+ providers, Georgia) reports that patients who had been
      unable to get approvals at other practices were successfully approved through Forus, typically
      within 2–3 days. Dr. Goodman personally recommended Forus to AQUA Dermatology—the larger
      platform Goodman is part of—and the entire AQUA organization subsequently adopted Forus. This
      cascade represents the largest publicly documented customer expansion event for Forus.

      Optima Dermatology cleared a backlog of 500+ outstanding tasks after adopting Forus and now
      initiates all prior authorizations on the same day the prescription is written. The founding
      physician, Dr. Scott Guenthner, described the rollout as transparent to clinicians; Cleveland-
      based dermatologist Dr. Gregory Delost confirmed the implementation as "absolutely seamless."

      MedicoCX GPO (300+ independent practices, primarily allergy), managed by Director Briana
      O'Dwyer, reduced its team's payer phone time from 60–70% of the workday to under 15% and
      embedded Forus in its standard onboarding process for new practices. The GPO spent three years
      evaluating alternatives before selecting Forus.

      Digestive Health Specialists (20+ GI prescribers) biologic coordinator Ashley Flowers increased
      daily PA throughput from approximately 5 fully worked-up PAs per day to 15–30 per day after
      adopting Forus—a 3–6x step-function improvement.

      General Catalyst's investment blog describes one unnamed provider group that cut PA turnaround
      from more than 7 days to a median of 1.1 days and reduced nursing administrative workload by
      70%—the most specific outcome metric in any public document, sourced from GC's diligence, not
      an audited study.

      All five Forus blog case studies were published between December 2025 and March 2026 and feature
      direct quotes from named administrators, physicians, and coordinators—which adds authenticity
      but does not constitute independent third-party validation.
