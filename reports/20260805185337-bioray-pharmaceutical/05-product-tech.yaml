- id: lead-assets-and-differentiation
  title: Lead assets and technical differentiation
  body: 'BioRay''s lead proprietary assets each express a different differentiation thesis. Anruixi is positioned as an innovative anti-CD20 molecule with altered epitope binding, stronger ADCC, and encouraging phase III data versus rituximab-based control. BR105 uses a SIRPα strategy to intervene on the CD47/SIRPα axis while attempting to reduce some safety concerns associated with direct CD47 targeting. BR111 aims to differentiate through a ROR1 dual-epitope ADC design, while BRY812 uses a LIV-1 target plus BioRay''s CysLink chemistry to improve stability and potentially widen the therapeutic window. Bimzelx contributes a different kind of edge: BioRay gains a differentiated dual IL-17A/F commercial product through partnership rather than internal invention. Together these assets show that BioRay''s platform is not just broad; it is intentionally diversified across mechanism, stage, and modality.'
