- id: commercial-scale-and-footprint
  title: Commercial scale, manufacturing, and distribution footprint
  body: 'Public scale indicators are robust enough to show BioRay is already operating as a national commercial platform. The filing describes more than 450 autoimmune-focused field reps plus more than 190 oncology reps, coverage of more than 4,000 hospitals and 2,000 pharmacies across 31 provincial-level regions, and strong market presence in rheumatology, dermatology, hematology, and gastroenterology. Manufacturing scale is less cleanly disclosed: the R&D page cites eight 2,250L mammalian bioreactors while the filing refers to about 33,000L of bioreactor capacity and more than 13 million doses produced. That inconsistency does not undermine the thesis that BioRay has meaningful internal manufacturing, but it does reduce precision on current capacity utilization and expansion needs. Headcount also shows a pattern of scaling from more than 700 staff in 2019 to more than 1,400 in 2023 and over 1,800 in late 2024, although third-party databases still report materially lower estimates.'
  claimRefs:
  - CO018
  - CO019
