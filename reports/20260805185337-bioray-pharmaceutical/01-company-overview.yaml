company:
  name: BioRay Pharmaceutical
chapter:
  number: 1
  title: Company Overview
  summary: BioRay Pharmaceutical is a commercial-stage Chinese biologics company that emerged from Hisun's biologics division in 2019, remains controlled by PAG and Hisun, and has scaled from four marketed autoimmune products in 2023 to eight commercialized products by its January 2026 Hong Kong IPO filing. Public evidence supports a January 2023 strategic financing round of roughly US$218 million at a US$1.9 billion pre-money valuation, 2024 revenue of RMB1.623 billion with 79.2% gross margin, and meaningful global milestones including the UCB commercialization deal, BRY812's FDA IND approval, and the 2026 IPO application that later lapsed.
sections:
- id: identity-and-corporate-positioning
  title: Identity, origin, and operating model
  body: 'BioRay Biopharmaceutical is the biologics platform spun out from Hisun Pharmaceutical in 2019 and now presents itself as a commercial-stage immunology and oncology company with integrated discovery, development, manufacturing, registration, and commercialization capabilities. Public company materials anchor the operating footprint in Taizhou, Hangzhou, Shanghai, and San Diego, while the company''s current positioning centers on immune-mediated diseases plus oncology rather than generic contract manufacturing or pure biosimilar licensing. The listing-application coverage also indicates the company has moved well beyond its original autoimmune biosimilar base: by January 2026 public reporting described eight commercialized products and a deeper pipeline that includes innovative assets such as zuberitamab, BR2251, BRY812, and BR111. The company still leans heavily on self-disclosure for exact product counts and operating definitions, but the combination of the 2023 financing materials,
    the 2026 filing, and current website pages supports a coherent identity as a scaled China biologics company rather than an early-stage R&D shop.'
  claimRefs:
