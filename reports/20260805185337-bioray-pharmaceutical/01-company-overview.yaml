- id: leadership-and-governance
  title: Leadership, control, and governance transparency
  body: 'Public evidence consistently identifies Dr. Wang Haibin as chief executive, while PAG''s 2019 acquisition release adds a named board-level control signal through Xiao Suining''s appointment as chairman. That is enough to establish continuity of leadership and investor oversight, but not enough to resolve full governance structure. The public website, financing releases, and listing-coverage summaries do not enumerate the complete board, key committees, or minority-protection rights. Governance risk therefore sits less in leadership churn and more in information asymmetry: BioRay has clear controlling owners and a mature commercialization footprint, yet still offers only thin external detail on board composition, option dilution, and shareholder economics. For diligence purposes the company should be treated as management-stable but governance-opaque until the full IPO appendices or direct board materials are available.'
  claimRefs:
  - CO002
  - CO011
  - CO012
  - CO015
