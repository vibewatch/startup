- id: funding-ownership-and-valuation
  title: Funding, ownership, and valuation context
  body: BioRay's capital history is unusually legible for a private Chinese biologics company because the 2019 PAG buyout, the 2023 strategic financing, and the 2026 listing materials triangulate ownership and valuation. PAG acquired control at RMB3.8 billion in 2019, the January 2023 strategic round brought in more than RMB1.5 billion at a RMB13 billion pre-money valuation, and secondary databases such as Tracxn also record the same financing as a roughly US$215 million Series D at a US$1.9 billion valuation. The 2026 filing shows ownership remains concentrated, with PAG at 44.62% and Hisun at 39.62%, plus smaller strategic and local-government investors. What remains opaque are debt, liquidation preferences, employee-option dilution, and any private repricing after the lapsed 2026 IPO; those gaps limit confidence in using the last public valuation as a clean entry reference.
  claimRefs:
