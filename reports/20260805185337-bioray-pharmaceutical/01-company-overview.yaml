callouts:
- calloutType: strength
  title: Scaled private biologics platform, not a single-asset startup
  body: BioRay already combines marketed products, internal manufacturing, a national sales force, and multinational partners. That operating depth distinguishes it from pre-revenue biotech stories and partly explains why the 2023 financing could support a US$1.9 billion valuation.
  claimRefs:
  - CO007
  - CO021
  - CO022
  - CO024
  - CO025
- calloutType: risk
  title: Liquidity and governance remain less transparent than operating scale
  body: The lapsed 2026 IPO application, incomplete board disclosure, and missing public details on debt and preference terms mean BioRay still requires private diligence despite public-scale revenue and commercial breadth.
  claimRefs:
  - CO014
  - CO017
  - CO030
  - CO031
  - CO035
