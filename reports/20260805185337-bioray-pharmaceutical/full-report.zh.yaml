      - number: '3.2'
        title: 替代品、定价与切换成本
        blocks:
          - type: paragraph
            body: >-
              到产品层面，BioRay 在每个主要细分市场都面对强大的现状替代品。Anruixi 要和 rituximab 系治疗路径及更新 anti-CD20 替代品竞争；Anjianning 在成熟 adalimumab
              世界里竞争；Bimzelx 还要在已有 IL-17 在位者面前证明自己；Anruize 则处在 Herceptin、Perjeta 等可信 HER2 标准之下。Skyrizi、Rinvoq
              等相邻疗法也重要，因为自身免疫预算往往在不同机制家族之间争夺。这些替代格局推高了切换成本。肿瘤领域的障碍是治疗方案和医生信任；慢性免疫疾病里，障碍是报销、既往疗效和风险容忍度。实际价格实现的公开证据仍弱，所以竞争视角在分子重叠上更清晰，在净定价上不够清晰。这让折扣纪律变得必要。生物药决策有路径依赖；如果采购、报销和医生习惯不变，一个略好的分子并不总能推动份额迁移。
