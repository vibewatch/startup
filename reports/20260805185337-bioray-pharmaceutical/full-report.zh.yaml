  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与底层疾病需求
        blocks:
          - type: paragraph
            body: >-
              BioRay 的可触达市场更像一组相邻的专科生物药市场，而不是一个单一的生物科技 TAM。自身免疫侧，公司参与类风湿关节炎、银屑病、强直性脊柱炎、炎症性肠病等慢性免疫疾病；肿瘤侧，公司覆盖 DLBCL 和其他
              CD20 驱动的血液肿瘤、HER2 阳性肿瘤，以及创新实体瘤 ADC 项目。疾病背景资料也强化了这些市场的复诊属性。类风湿关节炎、银屑病和强直性脊柱炎都需要长期专科管理，痛风和 DLBCL
              则形成不同的高需求人群，足以支撑有针对性的溢价疗法。这一点很关键，因为 BioRay
              卖的不是一种可互换生物药：每个疾病领域都有不同医生、医院路径、支付规则和患者持续用药动态。因此，市场规模必须按治疗方式和专科渠道来框定，不能只看公司收入。
            claimRefs:
              - CM001
              - CM007
              - CM008
              - CM009
              - CM010
