            body: >-
              财务结论是：当前规模有利，毛利生成能力为正，透明度则好坏参半。BioRay 已经清楚证明了商业牵引力，也有许多私人生物科技公司不具备的利润率画像。公司还通过叠加 Anruixi 销售和 UCB
              相关服务，在既有自身免疫底座上搭出更高质量收入。问题是，公开记录没有披露现金可支撑时间、产品层面贡献毛利、销售代表生产率、客户集中度，或 IPO 申请失效后的融资应急方案。这些缺失指标很关键，因为 BioRay
              正进入一个新阶段：问题从“有没有收入？”变成“收入是否足够耐久、足够高效，能否自我资助创新？”答案出来之前，公司应被视为财务上可信，但还没有被完全验证。做投资判断时，下一步不该再查一个标题收入数字；要把已披露销售额桥接到现金生成、合作方集中度和产品层面毛利，才能用承销纪律检验表面强劲的收入韧性。
