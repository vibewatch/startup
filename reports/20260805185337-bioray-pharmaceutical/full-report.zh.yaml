      - number: '1.5'
        title: 近期里程碑、全球化与负面信号
        blocks:
          - type: paragraph
            body: >-
              BioRay 进入 2025 年时动能不弱：拿下 UCB 在中国的 Bimzelx 商业化合作，BRY812 LIV-1 ADC 获 FDA IND 临床许可，公布 zuberitamab III
              期数据，并签署覆盖 3 款生物类似药的土耳其授权交易。这些都是可信信号，说明公司正从国内自身免疫底座，向创新肿瘤和海外商业化扩张。与此同时，当前最强的负面信号不是临床，而是公司融资：2026 年 1 月 6
              日提交的香港 IPO 申请 6 个月后失效，截至报告日期 BioRay 仍是私人公司。申请失效不等于上市失败，但确实说明 BioRay
              还没有把规模和增长故事转化成已完成的公开市场交易。在管理层明确下一步之前，公司概览应读成两部分：运营进展强，流动性兑现仍不完整。
