      - number: '4.2'
        title: 成本结构与利润率路径
        blocks:
          - type: paragraph
            body: >-
              对一家商业化生物科技公司来说，BioRay 披露的经济性很强，但利润率图景比标题数字更复杂。毛利从 2023 年 RMB1.033 billion 升至 2024 年 RMB1.286
              billion，毛利率也维持在高位：2023 年 82.2%，2024 年 79.2%。不过 2025 年利润率开始走软：前 9 个月整体毛利率降至 74.4%，药品销售毛利率收窄，UCB
              相关上市工作启动后，服务毛利率大幅下滑。销售成本数据说明，这是一家有真实基础设施的制造商，因为折旧摊销数额较大，原材料、生产间接费用和制造人工也都是可见成本项。单看这些并不令人警惕，但它们意味着 BioRay
              的经济性取决于产能吞吐、产品组合和渠道结构，而不只是标题定价。
