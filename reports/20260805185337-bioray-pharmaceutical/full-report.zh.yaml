  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开牵引力
        blocks:
          - type: paragraph
            body: >-
              BioRay 已经不是单一模式的生物药卖方。申报文件显示，收入底座由产品销售和服务收入组成，后者来自商业化和制造合作。这一点重要，因为它让 BioRay 在财务上不同于许多仍只依赖融资的私人生物科技公司。披露收入
              2023 年达到 RMB1.257 billion，2024 年达到 RMB1.623 billion，2025 年前 9 个月达到 RMB1.379 billion。公开材料还显示，在 Anruixi 和
              UCB 关系完全体现之前，公司 2022 年收入已超过 RMB900 million。最明显的快速变量是 Anruixi：获批并推进报销后，收入从 2023 年几乎可忽略，跃升为 2024
              年收入中有意义的双位数占比。服务收入也越来越重要，从 2023 年中个位数收入占比，升至 2025 年前 9 个月约一成。结果是一家公司具备可信公开牵引力，收入多元化也在提升，但产品和客户层面的透明度仍有限。
