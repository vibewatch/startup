      - number: '8.5'
        title: 附录
        blocks:
          - type: callout
            title: BioRay 价值已足够重要，但清晰度还不足以追价
            body: 公司已经跨过从概念到实质的门槛。定价问题不在于 BioRay 是否做出了真实业务，而在于上一轮锚定价格已经嵌入了多少未来创新和融资信心。
            calloutType: insight
            claimRefs:
              - CV011
