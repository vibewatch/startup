  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与直接同业
        blocks:
          - type: paragraph
            body: >-
              看 BioRay
              的竞争位置，最合适的框架是：一家处在中场的中国生物药运营商，试图升级为差异化更强的平台公司。它不只是和跨国在位者竞争，也在和本地上市生物科技公司竞争；后者已经把已上市产品、公开市场通道和宽管线组合起来。Henlius
              是生物类似药加肿瘤抗体最清晰的直接模板，Innovent 是更强的公开创新品牌，Kelun-Biotech 是更难的 ADC 对标，Mabwell 和 3SBio 则让同业场更拥挤而不是更轻松。这意味着
              BioRay 不需要证明中国生物药能做大——同业已经证明。它需要证明的是，自己的渠道深度、产品宽度和创新节奏这套组合，能不能干净地放大到足够重要。于是，同业对标比品类叙事更重要。另一层含义是，BioRay
              不能指望品类成熟后竞争自然变容易；成功需要跑赢已经很能打的本地运营商，而不只是活过外资竞争。尤其是今天，在中国市场，这一点很清楚。
