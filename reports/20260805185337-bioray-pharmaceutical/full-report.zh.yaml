  - id: TV005
    title: 投资论点失效与否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 融资恶化
        - 缺乏可信的 18-24 个月资金路径
        - 抬高稀释风险，削弱议价能力
        - 后退一步，或要求结构性保护
      - - 创新进展滑坡
        - BRY812 / BR111 进展明显转弱
        - 削掉高倍数支撑
        - 按成熟可比公司框架重新定价
      - - 收入质量停滞
        - 伙伴产品与自有产品组合没有改善
        - 削弱混合质量论点
        - 降低入场价格，或放弃
      - - 公开市场可比公司估值下修
        - 同业倍数明显压缩
        - 压窄 BioRay 的合理估值区间
        - 任何交易前先刷新可比公司框架
      - - 退出路径仍受阻
        - 上市或替代流动性路径仍不清晰
        - 拉长持有期，增加治理负担
        - 要求更强权利和折价
    notes: 否决触发因素关注估值传导，而不只是经营挫折。
