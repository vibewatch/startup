      - number: '2.4'
        title: 增长驱动、约束与 BioRay 的胜出依据
        blocks:
          - type: paragraph
            body: >-
              BioRay 最清晰的增长驱动是渠道复用。一个已经触达数千家医院的平台，可以交叉销售多个自身免疫品牌，加入 Bimzelx 这样的跨国引进资产，并把 Anruixi
              等创新生物药推入部分重叠的医生网络。公司还同时拥有成熟、可产生现金的生物类似药，以及上行空间更高的创新项目。但约束同样清楚。成熟 TNF 和 HER2
              生物类似药市场天然价格敏感；创新资产仍要说服医生从可信跨国标准切换；在中国，报销和进院进展有决定性影响。公开证据也在产品层面收入、市场份额和当前价格实现上留下明显缺口，所以市场论点还不能转成干净的 SOM
              模型。结论是：规模和渠道逻辑有利，但执行负担重。BioRay 能赢在把多个产品叠进同一专科体系的地方；差异化弱或支付准入不确定的地方，上行空间会被压住。
