      - number: '1.4'
        title: 商业规模、制造与分销覆盖
        blocks:
          - type: paragraph
            body: >-
              公开规模指标已经足以说明 BioRay 在按全国性商业平台运转。申报文件披露，公司有 450 多名自身免疫条线销售代表、190 多名肿瘤条线销售代表，覆盖 31 个省级地区的 4,000 多家医院和 2,000
              多家药房，并在风湿、皮肤、血液和消化科形成较强市场存在。制造规模披露没有那么干净：R&D 页面提到 8 个 2,250L 哺乳动物细胞生物反应器，而申报文件提到约 33,000L 生物反应器产能和超过 13
              million 剂产量。这一不一致并不推翻 BioRay 拥有有意义内部制造能力的论点，但会降低对当前产能利用率和扩产需求的判断精度。员工数也显示出扩张轨迹：从 2019 年 700 多人，到 2023 年
              1,400 多人，再到 2024 年末超过 1,800 人；不过第三方数据库给出的估计仍明显更低。
