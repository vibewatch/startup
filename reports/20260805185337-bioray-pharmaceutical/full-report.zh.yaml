            body: >-
              已披露技术架构从抗体发现开始，推进到细胞株开发、分析、CMC 和商业化制造。BioRay 称自己拥有噬菌体展示库、亲和力成熟能力、重组表达系统、内部分析能力、专有无血清培养基和稳健的 PC/PV
              平台。公司还称运营 8 个 2,250L 哺乳动物细胞生物反应器和纯化套件，显示它有真实生产版图，而不是虚拟化外包。这些细节重要，因为 BioRay
              的论点要求制造成为速度和利润率来源，而不只是必要设施。申报文件和 R&D 页面还显示，这一架构用同一个运营骨架支持常规 mAbs、ADC 和多特异性项目。最强的结论是，BioRay
              有真实平台结构；较弱的结论是，公开证据还没有证明这套结构在商业压力下运行效率如何。实践中，这意味着平台已有足够可见组件，可以支撑架构尽调；但披露 KPI 还不足，无法证明从设计到商业化产出的可重复执行。
