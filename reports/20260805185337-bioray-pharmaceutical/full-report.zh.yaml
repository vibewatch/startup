  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、反论点与估值锚
        blocks:
          - type: paragraph
            body: >-
              BioRay 的估值案例从一个对私人生物科技公司少见地有用的事实开始：公司已经有有意义的收入。这意味着最后一轮公开融资可以转成隐含销售倍数，而不是只漂在叙事上。按申报 2024 年收入计算，2023
              年融资锚隐含高个位数销售倍数。这个水平并不明显荒谬，因为 BioRay
              有商业化基础设施、高毛利率和创新选项。但它也不明显便宜，因为公司仍是私人状态，公开上市路径尚未完成，关键现金质量指标仍缺失。因此，正确论点是混合型：BioRay
              不是纯科学投机，但透明度也不足以让人把它完全当成具备公开市场质量的溢价复利公司。换句话说，估值支撑存在，但它支撑的是继续接触，而不是对价格不敏感的确信。这个锚之所以有用，正是因为现在可以拿已披露收入来压力测试，而不是把它当成神话。这一区分会直接影响定价。尤其是现在。
