  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 细分与渠道结构
        blocks:
          - type: paragraph
            body: >-
              BioRay 的客户基础最适合按机构角色切分，而不是按客户名单数量切分。主要使用者是风湿、皮肤、血液 / 肿瘤和消化科的医院专科医生；主要买方是医院和渠道中介；主要支付方则是决定实际可及性的报销体系。当
              BioRay 代表合作方商业化或供应产品时，合作伙伴也可能成为准客户。公开证据显示，BioRay
              已经触达大型机构基础，并把自身免疫和肿瘤渠道的一线执行分开。这说明它有真实的多细分商业机器，而不是一支单产品销售队伍。也因此，账户质量不取决于标题医院数量，而更取决于进院目录、专科医生倡导、报销执行，以及公司能否同时维持多条治疗渠道的人力配置。客户质量是渠道纪律和执行强度的函数，而不只是产品知名度或科学新颖性。
