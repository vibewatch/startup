      - number: '1.3'
        title: 融资、所有权与估值背景
        blocks:
          - type: paragraph
            body: >-
              对一家中国私营生物药公司来说，BioRay 的资本历史少见地清晰，因为 2019 年 PAG 收购、2023 年战略融资和 2026 年上市材料可以交叉印证所有权和估值。PAG 在 2019 年以 RMB3.8
              billion 取得控制权；2023 年 1 月战略轮融资超过 RMB1.5 billion，投前估值 RMB13 billion；Tracxn 等第三方数据库也把同一轮记录为约 US$215 million 的
              Series D，估值 US$1.9 billion。2026 年申报文件显示，所有权仍高度集中，PAG 持有 44.62%，Hisun 持有
              39.62%，另有少量战略和地方政府投资人。不透明之处在于债务、清算优先权、员工期权稀释，以及 2026 年 IPO 失效后是否发生过私下重定价；这些缺口削弱了把最后公开估值当成干净入场参考的信心。
