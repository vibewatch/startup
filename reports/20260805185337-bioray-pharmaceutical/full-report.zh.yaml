          - type: callout
            title: 错误不在于买期权价值，而在于期权成熟前先付过高价格
            body: 上市可比公司显示，当市场相信或怀疑创新故事时，生物科技倍数会迅速分化。BioRay 的披露还不足以支撑按最高上行情景已被证明来付价。
            calloutType: risk
