            body: >-
              BioRay 的核心自有资产各自表达不同的差异化论点。Anruixi 被定位为创新 anti-CD20 分子，具备改变后的表位结合、更强 ADCC，以及相对 rituximab 对照有鼓励性的 III
              期数据。BR105 采用 SIRPα 策略干预 CD47/SIRPα 轴，同时试图降低直接靶向 CD47 带来的部分安全担忧。BR111 希望通过 ROR1 双表位 ADC 设计形成差异化，BRY812 则用
