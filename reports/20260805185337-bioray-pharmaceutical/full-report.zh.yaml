      - number: '3.3'
        title: 护城河、渠道与分销权力
        blocks:
          - type: paragraph
            body: >-
              BioRay 可能的护城河更偏实用，而不是优雅。公司已经有中国专科商业化底座，可以把自有免疫产品、肿瘤品牌和合作分销资产叠进重叠渠道。这比单产品故事更耐用，但不是深科学垄断。UCB
              关系就是好例子：它扩大产品宽度、提升可信度，却没有让 BioRay 对底层资产拥有专有控制权。同样，BioRay
              不太会面对客户真正“自建”的竞争，因为医院是在获批疗法中选择，而不是自己制造生物药。风险在于，执行历史更清楚的同业，可能更擅长把类似优势转成可持续份额。投资人因此要用实证测试渠道证明。这个行业里，合同经济性、医院覆盖质量和上市转化，比抽象护城河语言更重要。
