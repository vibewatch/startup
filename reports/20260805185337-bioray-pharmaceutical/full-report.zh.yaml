chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、源起与运营模式
        blocks:
          - type: paragraph
            body: >-
              BioRay Biopharmaceutical 是 2019 年从 Hisun Pharmaceutical
              分拆出来的生物药平台，如今把自己定位为商业化阶段的免疫与肿瘤公司，具备发现、开发、制造、注册和商业化一体化能力。公开公司材料把运营版图锚定在 Taizhou、Hangzhou、Shanghai 和 San
              Diego；公司当前定位则聚焦免疫介导疾病和肿瘤，而不是通用型代工制造或单纯生物类似药授权。上市申请相关报道还显示，公司已明显走出最初的自身免疫生物类似药底座：到 2026 年 1 月，公开报道提到 8
              个商业化产品，以及包括 zuberitamab、BR2251、BRY812、BR111 在内的更深管线。产品数量和运营定义仍高度依赖公司自披露，但 2023 年融资材料、2026
              年申报文件和当前官网页面合起来，已经能支撑一个清晰判断：BioRay 是一家有规模的中国生物药公司，不是早期研发公司。
