              费用仍在快速上升，行政 / 合规成本也在增加，申报文件还提到银行贷款和赎回负债。BioRay 看起来远比无收入生物科技公司健康，但资本需求也更大、更连续，因为它同时跑着商业化引擎和规模不小的后期 / 创新引擎。
