      - number: '3.4'
        title: 竞争结论
        blocks:
          - type: paragraph
            body: >-
              竞争结论是偏正面但不纯粹。BioRay 已经比尚无收入的生物科技公司更可信，因为它有真实产品、真实渠道和可信创新选项。但它还没有站到本地同业之上。最强的中国上市同业更被公开市场理解，ADC 赛道也已拥挤到
              BioRay 不能只靠新颖性。因此，正确尽调框架应该是比较式：投资人要问哪些同业用更干净的经济性、更清楚的治理或更可防守的创新证明了同一模式，再测试 BioRay 是在靠近还是远离这个标准。换句话说，BioRay
              只有在相对基础上才具备可投资性：如果执行缺口缩小得比同业优势复利更快，论点会改善。若要给溢价倍数，就必须看到明确证据，证明 BioRay 在执行上正向 Henlius / Innovent / Kelun
              这一层级靠拢，而不只是声称自己与之相邻。
            claimRefs:
              - CP021
              - CP033
              - CP034
              - CP035
