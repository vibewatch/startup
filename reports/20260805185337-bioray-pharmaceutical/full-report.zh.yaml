      - number: '2.2'
        title: 规模测算视角与可服务市场
        blocks:
          - type: paragraph
            body: >-
              最强的公开规模测算视角来自 2026 年 1 月 IPO 摘要引用的市场研究数字。报道提到，中国自身免疫生物药机会到 2030 年约 RMB180 billion，中国 CD20 抗体市场约 RMB25
              billion，中国痛风市场约 RMB12 billion，同时还有到 2032 年组合层面峰值收入约 RMB48 billion 的说法。这些数字有方向性价值，因为它们说明 BioRay
              参与的品类足够大，能够支撑多个十亿人民币级别的产品。但这些不是精确的 SAM 或 SOM 估计。公开证据没有披露 BioRay 的资产层面收入、精确份额或产品层面定价，所以可服务市场只能从商业化覆盖反推。最佳
              SAM 代理指标是 BioRay 的渠道版图：4,000 多家医院、2,000 多家药房，以及覆盖自身免疫和肿瘤的大型一线团队。换句话说，BioRay
              的实际可服务市场取决于它的渠道能在哪些地方真正转化医生和进院目录，而不只是账面疾病池有多大。
