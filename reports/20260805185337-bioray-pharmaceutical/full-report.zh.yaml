  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合定义与资产地图
        blocks:
          - type: paragraph
            body: >-
              BioRay 的产品层最好理解为分层组合。底层是已经商业化的自身免疫和肿瘤生物药底座，例如 Anbainuo、Anjianning、Anbaite、Anruize 和 Anruixi。中层加入 Bimzelx
              这类合作方挂钩商业资产，让 BioRay 无需内部发现，也能进入差异化机制和新的专科工作流。顶层是宽创新层，覆盖 BR105、BR111、BRY812、BR2060、BR2251，以及其他已披露或 pre-IND
              项目。这一点重要，因为 BioRay
              的客户工作流、制造需求和估值逻辑，都取决于这些层如何互动。公司并不是一个接一个地推出抗体，而是试图用商业化底座支撑平台向更新模态扩张。这会扩大策略范围，也让执行纪律变得核心。任何共享层——临床运营、CMC
              转移、工厂吞吐或合作方协调——出现故障，都会传导到多个资产，而不是只留在一个品牌上。
