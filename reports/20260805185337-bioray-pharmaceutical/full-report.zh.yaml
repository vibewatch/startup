      - number: '1.2'
        title: 领导层、控制权与治理透明度
        blocks:
          - type: paragraph
            body: >-
              公开证据一直把 Dr. Wang Haibin 标为首席执行官；PAG 2019 年收购公告又通过 Xiao Suining
              出任董事长，给出董事会层面的控制信号。这足以证明领导层和投资人监督具备连续性，但还不足以还原完整治理结构。官网、融资公告和上市报道摘要都没有列出完整董事会、关键委员会或少数股东保护权利。因此，治理风险不在于领导层频繁更换，而在于信息不对称：BioRay
              有清晰控股股东和成熟商业化版图，但对董事会构成、期权稀释和股东经济性仍只给出很薄的外部细节。尽调时，在完整 IPO 附录或直接董事会材料可得之前，应把公司视为管理层稳定、但治理不透明。
            claimRefs:
