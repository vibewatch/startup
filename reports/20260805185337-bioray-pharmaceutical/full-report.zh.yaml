  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险视图
        blocks:
          - type: paragraph
            body: >-
              BioRay 的风险画像更像一叠升级风险，而不是单一生死问题。商业规模和已上市产品降低了突然崩盘的概率，但并不能消除一种可能：BioRay
              无法从优秀运营商进化成耐久创新平台。最严重的风险集中在融资弹性、竞争差异化和执行宽度上。如果创新资产延误、Anruixi 放量慢于预期，或 IPO 申请失效后的融资变贵，BioRay
              仍可能继续运营，却失去大量估值上行。这一区分很重要，因为投资案例对战略失望的敏感度，高于对即时偿付能力的敏感度。投资人因此需要一个风险框架，区分存活能力和上行空间保全；BioRay
              可以继续作为一家运转中的公司存在，同时丢掉平台叙事附带的大部分溢价。因此，下行纪律要前置。它把可管理噪音和会打断论点的恶化分开。今天做承销判断，需要纪律，现在就需要。
