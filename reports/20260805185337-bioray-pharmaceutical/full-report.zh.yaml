            title: 渠道重叠比生物科技式 TAM 叙事更重要
            body: BioRay 最好的市场优势来自把同一套专科销售和医院网络复用于多个免疫疾病产品，而不是押注单个登月资产。因此，4,000 家医院覆盖比任何一个 2030 年市场规模数字都更可执行。
