            body: >-
              BioRay 模式里的监管和运营风险彼此缠绕。公司一边运行一体化制造和不断扩大的临床管线，一边必须在 NMPA、FDA 和海外质量体系上执行干净。Colombia GMP 成功、Pakistan
              批准等国际里程碑有帮助，但也扩大了合规暴露面。同样，内部制造降低外包依赖，却引入固定成本、利用率和批次质量风险，这些风险可能同时影响多个产品。公开记录对药物警戒、召回、偏差率和工厂利用率仍很薄。IP
              风险也真实存在：可见专利活动支撑可防守性，但拥挤的 ADC 和生物药市场抬高了自由实施和后期挑战风险。生物药领域尤其如此；当公司同时支撑多个项目和司法辖区时，工艺质量和监管纪律往往与分子设计同样重要。
