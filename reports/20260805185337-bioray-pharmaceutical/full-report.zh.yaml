              在生产级医疗工作流中运转，而不只是停留在新闻稿里。不过，这仍不同于公开到账户层面收入或使用率指标。因此，公开证明是真实的，但还不完整。实际读数是：BioRay
              看起来足够可信，可以进入严肃交易对手；但公开证据仍无法告诉投资人，哪些交易对手已经变成有规模、可复现、经济上重要的客户。这个区分很关键，因为在中国生物科技行业，临床声望和商业深度可能大幅背离。
