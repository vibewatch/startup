      - number: '6.3'
        title: 留存、扩张与集中度
        blocks:
          - type: paragraph
            body: >-
              客户耐久性比直接衡量更容易推断。类风湿关节炎、银屑病等慢性免疫疾病支持长期重复处方，而 DLBCL 及相关肿瘤场景可能更偏阶段性。因此，不同细分市场的客户经济性差异很大。BioRay
              的扩张逻辑很可能依赖按专科渠道先落点、再扩张：公司一旦用一个免疫或肿瘤产品站住脚，就能通过同一批机构和医生加入相邻自有或合作产品。主要公开缺口在于，所有这些判断都没有
              GRR、NRR、流失、单账户使用量或合作方经济性披露支撑。地理和合作方层面的集中度也要盯住，因为客户基础仍高度集中在中国，新服务收入又明显与 UCB
              相关。换句话说，广覆盖可能与浅渗透共存，健康的专科版图也可能掩盖对一个合作方、一个报销产品家族或少数头部医院体系的经济依赖。没有更好披露前，标题覆盖应被理解为有前景的准入能力，而不是已证明的变现宽度。
