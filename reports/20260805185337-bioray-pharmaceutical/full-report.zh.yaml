        - id: x3
          label: 合作方表现不及预期
          detail: UCB 或海外合作方不达标
          tone: warning
        - id: x4
          label: 收入结构质量
          detail: 创新资产未能改善盈利底座
          tone: warning
        - id: x5
          label: 毛利 / 资本压力
          detail: 成本持续比收入质量升得更快
          tone: warning
        - id: x6
          label: 融资杠杆
          detail: 下一次资本事件中谈判位置变弱
          tone: warning
        - id: x7
          label: 估值下行
          detail: 上行情景被下修为只看基础业务
          tone: warning
      edges:
        - from: x1
          to: x4
        - from: x2
          to: x4
        - from: x3
          to: x4
        - from: x4
          to: x5
        - from: x5
          to: x6
        - from: x6
          to: x7
    claimRefs:
      - CR006
      - CR010
      - CR023
      - CR027
      - CR033
  - id: FR003
    title: 依赖地图
    type: dag
    layout: wide
    summary: BioRay 依赖监管机构、合作方、工厂运营和少数核心资产一起运转。
    data:
      nodes:
        - id: y1
          label: UCB
          detail: 合作伙伴产品与服务费经济性
          tone: neutral
        - id: y2
          label: 海外合作伙伴
          detail: 土耳其及未来中国以外渠道
          tone: neutral
        - id: y3
          label: 制造底座
          detail: 生物反应器、QA、放行执行
          tone: warning
        - id: y4
          label: 核心资产
          detail: Anruixi、BR111、BRY812
          tone: positive
        - id: y5
          label: 中国市场准入
          detail: 报销与药品目录依赖
          tone: warning
        - id: y6
          label: 竞争组
          detail: Henlius、Innovent、Kelun、Mabwell、3SBio 等同业
          tone: warning
      edges:
        - from: y1
          to: y4
        - from: y2
          to: y4
        - from: y3
          to: y4
        - from: y5
          to: y4
        - from: y6
          to: y4
    claimRefs:
      - CR003
      - CR004
      - CR010
      - CR020
      - CR022
      - CR023
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 推荐结论看规模、证据、缺口和价格，不由任何单一里程碑决定。
    data:
      nodes:
        - id: a1
          label: 真实收入与利润率
          description: BioRay 跑出了经营实质
        - id: a2
          label: 创新期权
          description: Anruixi、BRY812、BR111 带来上行空间
        - id: a3
          label: 证据缺口
          description: 资金续航、合作伙伴经济性、产品级盈利能力仍缺证据
        - id: a4
          label: 私募定价锚
          description: 最近公开价格已计入可观价值
        - id: a5
          label: 有条件跟进
          description: 可以接触，但必须守住价格纪律或交易结构
      edges:
        - from: a1
          to: a5
        - from: a2
          to: a5
        - from: a3
          to: a5
        - from: a4
          to: a5
    claimRefs:
      - CV011
      - CV012
      - CV018
      - CV033
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: BioRay 的估值最受倍数选择和收入质量信心牵动，而不是多一个季度增长。
    data:
      items:
        - label: 基准倍数选择
          value: 10
          detail: 最大驱动项，因为上市可比公司的销售额倍数从约 2x 到约 47x
          tone: warning
        - label: 收入质量信心
          value: 8
          detail: 合作伙伴经济性和产品组合影响很大
          tone: warning
        - label: 创新成功概率
          value: 7
          detail: BRY812 / BR111 成功最能拉动上行空间
          tone: warning
        - label: 融资清晰度
          value: 6
          detail: 资金续航和退出准备度会改变所需折扣
          tone: neutral
        - label: 近期收入增长
          value: 4
          detail: 重要，但不如估值框架选择关键
          tone: neutral
    claimRefs:
      - CV014
      - CV018
      - CV020
      - CV024
      - CV035
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 有约束的估值区间会把 BioRay 放在低倍数商业化可比公司与高倍数创新同业之间。
    data:
      items:
        - label: 悲观框架
          low: 4
          mid: 5
          high: 6
          displayValue: ~4x-6x sales
          detail: 更接近成熟商业化同业逻辑
          tone: warning
        - label: 基准框架
          low: 6.5
          mid: 8
          high: 9.5
          displayValue: ~6.5x-9.5x sales
          detail: 商业化 + 期权价值的混合情形
          tone: neutral
        - label: 乐观框架
          low: 10
          mid: 12
          high: 15
          displayValue: ~10x-15x sales
          detail: 需要更清晰的创新与融资证据
          tone: positive
        - label: 上市同业区间
          low: 2.01
          mid: 9.93
          high: 46.76
          displayValue: 2.0x-46.8x sales
          detail: 观察到的同业区间覆盖 3SBio 到 Kelun-Biotech
          tone: neutral
    approximationNotes: 情景区间是分析区间，以观察到的同业倍数和 BioRay 的混合质量画像为锚，并非 BioRay 股票的市场报价。
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV008
      - CV009
      - CV020
      - CV029
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 公开证据支持继续接触，但还不足以支撑高确信度、对价格不敏感的入场。
    data:
      items:
        - label: 建议
          value: Conditional pursue
          tone: neutral
          detail: 保持接触，但要强硬议价
        - label: 信心
          value: Medium
          tone: neutral
          detail: 关键定价障碍仍在
        - label: 风险
          value: High
          tone: warning
          detail: 融资和创新证据仍不完整
        - label: 估值立场
          value: Fair-to-rich
          tone: warning
          detail: 上一轮并不明显便宜
        - label: 最佳下一步
          value: Deepen diligence
          tone: positive
          detail: 重点核查现金、合作伙伴经济性和产品经济性
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV033
      - CV035
      - CV040
