              上市可比公司让估值图景更清楚。Henlius 和 3SBio 说明市场愿意为商业化更成熟的生物药公司付多少钱；Innovent、Kelun-Biotech 和 Mabwell 则说明，当创新叙事、增长预期或
              ADC 热度占上风时，投资者还能多付多少。BioRay
              夹在两端之间。收入规模和商业化底座，使它不该被打成深度成熟生物药折价；但融资仍未厘清、合作伙伴经济性不透明、创新资产仍偏早期，也不支持按最热同业倍数付价。合理基准情景应落在中段：相对低倍数商业化可比公司有一定溢价，相对高倍数创新可比公司有一定折价；只有尽调补上证据缺口，才值得继续上调价格。这也是同业区间如此重要的原因：公开市场正在明确奖赏那些创新证据更干净的中国生物科技故事；当收入看起来真实但战略上普通时，也会惩罚另一批公司。
