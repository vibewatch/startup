      - number: '2.3'
        title: 买方、细分市场与现状替代品
        blocks:
          - type: paragraph
            body: >-
              BioRay 所在市场的预算权分散在医院采购、专科医生、国家报销渠道和跨国合作伙伴之间。不同资产因此呈现不同竞争形态。Anjianning 和 Anbaite 处在成熟 TNF 品类里，对标
              Humira、Remicade 等基准分子，医生熟悉度高，价格压力也重。Bimzelx 合作让 BioRay 进入 IL-17 细分市场，但这个市场已有 Cosentyx、Taltz
              等强势品牌在位。在血液肿瘤中，Anruixi 必须从 rituximab 系治疗标准和 Gazyva 等更新 anti-CD20 替代品中抢份额。在 HER2 肿瘤中，Anruize 和 pertuzumab
              生物类似药机会都要对标 Herceptin、Perjeta。这张替代品地图说明，BioRay 的市场机会不止一个分子，但捕获也很难：每个子赛道都有根深蒂固的跨国治疗标准、本地进院行为和专科销售工作。
