companyProfile:
  summary: >-
    BioRay Pharmaceutical 是一家商业化阶段的中国生物药公司，源自 Hisun 的生物药平台，目前主要由 PAG Highlander 和 Hisun Pharmaceutical 控制。到 2026 年 1
    月申报时，公司 2024 年收入已做到 RMB1.623 billion，毛利率 79.2%，覆盖广泛医院和药房，并形成自有产品销售、商业化 / 服务收入、制造服务收入并行的混合业务模式。核心投资吸引力在于：BioRay
    的运营已经跑实，同时 Anruixi、BR111、BRY812 等创新资产仍保留上行空间。
  foundingLocation: Taizhou, Jiangsu Province, China
  headquarters: Taizhou, Jiangsu Province, China
  productSummary: BioRay 销售已上市的自身免疫品牌和肿瘤生物药，包括 anti-CD20 产品 Anruixi；同时推进更广的平台，覆盖 ADC、双抗，以及 BR111、BRY812 等抗体项目。公司还拥有一体化发现、开发和 GMP 制造能力。
  customerFocus: 医院、专科医生、药房渠道、与报销挂钩的支付方，以及战略商业化合作伙伴。
  businessModel: 收入来自直接产品销售、UCB 相关安排等商业化 / 服务费、制造服务收入，以及选择性的授权 / 合作活动。
  stage: Late-stage private (IPO-filed, still private)
