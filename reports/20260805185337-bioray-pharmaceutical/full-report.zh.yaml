          - type: paragraph
            body: >-
              牛市情景假设 BioRay 继续放大自有产品收入，同时把 BRY812、BR111 以及伙伴绑定的商业化转化为更清晰的创新溢价。熊市情景则相反：BioRay
              商业化是真实的，但战略上仍然普通，证据不足以支撑超独角兽重估。这个价差正是交易条款重要的原因。退出准备还不完整，融资灵活性也仍有些不透明，投资者应更关注结构、下行保护和治理权，而不是只盯名义估值。真正打破投资逻辑的不是某一个里程碑失手，而是融资走弱、创新延误、收入质量又没有同步改善这一组合。在私募交易中，这些不确定性应落到条款、治理和估值护栏里，而不是被轻描淡写为暂时的市场噪音。
            claimRefs:
              - CV016
              - CV017
              - CV021
              - CV022
              - CV023
              - CV024
              - CV027
              - CV028
              - CV034
              - CV035
              - CV038
              - CV039
          - type: table
            tableRef: TV005
            claimRefs:
              - CV018
              - CV027
              - CV034
              - CV038
              - CV039
      - number: '8.4'
        title: 建议和最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              建议是有条件推进。BioRay
              已经足够有分量，不能简单排除；但披露仍不充分，也不值得追价。公司已经从愿景走到运营，投资者应愿意保持接触，但不能默认上一轮价格就是正确入场点。最佳姿态是带着不确定性谈判：争取折价、结构，或与里程碑挂钩的保护，以反映剩余融资、集中度和创新证据风险。如果
              2026
              年更新尽调显示现金可见度更强、合作伙伴经济性更干净、创新执行持续推进，价格可以上移。若这些答案恶化，正确选择是放弃，而不是摊入一个公开市场尚未完全验证的故事。仅凭公开证据看，严肃但克制是最可辩护的姿态。纪律严明的投委会仍可选择推进，但前提是谈下来的结构要明确补偿
              BioRay 已经证明的部分与上一轮私募价格对未来执行假设之间的缺口。
            claimRefs:
              - CV029
