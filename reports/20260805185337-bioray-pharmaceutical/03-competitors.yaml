- id: competitive-verdict
  title: Competitive verdict
  body: 'The competitive verdict is mixed-positive. BioRay already looks more credible than a pre-revenue biotech because it has real products, a real channel, and credible innovation options. But it does not yet stand above the local field. The best-listed Chinese peers are better understood by public markets, and the ADC race is getting crowded enough that BioRay cannot rely on novelty alone. The right diligence frame is therefore comparative: investors should ask which peers demonstrate the same model with cleaner economics, clearer governance, or more defensible innovation, then test whether BioRay is converging toward or away from that standard. In other words, BioRay is investable only on a relative basis: the thesis improves if execution gaps close faster than peer advantages compound. A premium multiple would require clear evidence that BioRay is moving toward the Henlius/Innovent/Kelun tier on execution, not just claiming adjacency to it.'
  claimRefs:
  - CP021
  - CP033
  - CP034
  - CP035
  notes: Competitive analysis is strongest on product overlap and field structure, weaker on net pricing and share data.
