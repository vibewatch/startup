  topStrengths:
    - BioRay 已是一家真实运营中的生物科技公司，2024 年收入 RMB1.623B、毛利率 79.2%，这对私营生物制剂公司并不常见。
    - 借助 Anruixi、BR111、BRY812 以及一体化生物制剂 / ADC 平台，公司把商业化规模和有意义的创新期权放在了一起。
    - 商业触达面很宽，全国医院和药房覆盖已经铺开，UCB 商业化合作也证明跨国药企对公司有一定信任。
    - 从发现、开发到生产的一体化能力，让 BioRay 比单纯授权壳公司更能掌控节奏，也支撑长期平台上行空间。
  topRisks:
    - 最近可见的 US$1.9B 私募锚点已经预设公司会持续兑现，但融资能见度、退出准备度和现金质量披露仍不完整。
    - 围绕 UCB 的合作伙伴集中和服务收入依赖能抬高故事质量，也可能掩盖集中度和经济性风险。
    - 创新上行仍要看 BR111、BRY812 等资产，能否在拥挤的中国生物制剂和 ADC 市场证明差异化临床价值。
    - 治理深度、客户留存、产品级单位经济性和上市后质量指标，公开证据仍然偏薄。
  unresolvedGaps:
    - 更新后的现金跑道、融资计划，以及 IPO 失效后的资本策略
    - 按品牌拆分的产品级毛利率、贡献利润率和销售团队效率
    - UCB 合同经济性、续约机制和服务收入耐久度
    - 活跃账户深度、重复处方行为和客户集中度指标
    - 治理细节、接班梯队，以及工厂质量 / 药物警戒运营 KPI
