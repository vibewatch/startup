- id: retention-expansion-and-concentration
  title: Retention, expansion, and concentration
  body: 'Customer durability is easier to infer than to measure directly. Chronic immune diseases such as rheumatoid arthritis and psoriasis support repeat prescribing over time, while DLBCL and related oncology settings can be more episodic. That means customer economics vary materially by segment. BioRay''s expansion logic likely depends on land-and-expand by specialty channel: once the company has a foothold with one immune or oncology product, it can add adjacent owned or partnered products through the same institutions and physicians. The main public gap is that none of this is backed by disclosed GRR, NRR, churn, per-account utilization, or partner economics. Concentration should also be watched at both the geography and partner level, because the customer base remains heavily China-centered and newer service revenue is visibly linked to UCB. In other words, broad reach may coexist with shallow penetration, and a healthy specialty footprint may still mask economic dependence on one partner, one reimbursed product family, or a handful of leading hospital systems. Without better disclosure, the headline footprint should be read as promising access capacity rather than proven monetization breadth.'
  claimRefs:
  - CU014
  - CU015
  - CU019
  - CU020
  - CU021
  - CU022
  - CU028
  - CU029
  - CU030
  - CU031
