chapter:
  number: 6
  title: Customers
  summary: BioRay serves institutions, not consumers. Its customer story runs through hospitals, specialty physicians, reimbursement systems, pharmacies, and a small number of important partners such as UCB. Public evidence supports real institutional reach and several named proof points, but still leaves material gaps around utilization depth, partner concentration, retention, and direct customer economics.
sections:
- id: segments-and-channel-structure
  title: Segments and channel structure
  body: BioRay's customer base is best segmented by institutional role rather than by logo count. The main users are hospital specialists in rheumatology, dermatology, hematology/oncology, and gastroenterology; the main buyers are hospitals and channel intermediaries; and the main payers are reimbursement systems that determine practical access. Partners can also become quasi-customers when BioRay is commercializing or supplying a product on their behalf. Public evidence suggests BioRay already reaches a large institutional base and separates field execution by autoimmune versus oncology channels. That indicates a genuine multi-segment commercial machine rather than a one-product sales team. It also means account quality depends less on headline hospital count than on formulary inclusion, specialist advocacy, reimbursement execution, and the company's ability to keep multiple therapeutic channels staffed at once. That makes customer quality a function of channel discipline and execution intensity, not just product awareness or scientific novelty.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU013
  - CU016
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: named-proof-and-adoption-quality
  title: Named proof and adoption quality
  body: The best public proof comes from institutions and partners. UCB is the clearest named partner-customer proof point because it entrusted BioRay with commercialization support for Bimzelx in China. On the clinical side, Beijing Cancer Hospital, Union Hospital of Tongji Medical College, Peking University Cancer Hospital, Sun Yat-sen-affiliated investigators, and broader trial-site networks all show that BioRay has real engagement with credible institutions. That evidence is meaningful because it suggests BioRay is operating inside production-grade medical workflows, not only inside press releases. However, it is still different from having public account-level revenue or utilization metrics. Public proof is therefore real, but still incomplete. The practical read-through is that BioRay appears credible enough to win access to serious counterparties, yet public evidence still cannot tell investors which of those counterparties have become scaled, recurring, or economically important customers. That distinction matters because clinical prestige and commercial depth can diverge sharply in China biotech.
  claimRefs:
