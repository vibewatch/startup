- id: customer-verdict
  title: Customer verdict
  body: 'The customer verdict is constructive but cautious. BioRay has enough public proof to show that it serves serious institutions, has named partners, and is not trapped in perpetual pilot mode. But the public record is much better at showing surface reach than economic depth. Investors therefore should treat customer breadth as a positive signal and customer-quality economics as an open diligence lane. Confidence would rise quickly with active-account depth, repeat-prescribing data, and partner economics; it would fall if flagship partner or hospital conversion remained shallower than the company''s broad footprint suggests. For underwriting purposes, the customer story supports belief in commercialization capability, but not yet in highly diversified, transparently measured recurring demand. The right diligence lens is therefore conversion quality: how many visible institutions translate into meaningful, repeatable purchasing behavior.'
  claimRefs:
  - CU023
  - CU025
  - CU026
  - CU032
