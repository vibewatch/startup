    layout: wide
    summary: >-
      BioRay's valuation is most sensitive to multiple selection and revenue-quality confidence rather than to one extra
      quarter of growth.
    data:
      items:
        - label: Base multiple choice
          value: 10
          detail: Largest driver because public comps span from ~2x to ~47x sales
          tone: warning
        - label: Revenue-quality confidence
          value: 8
          detail: Partner economics and product mix matter heavily
          tone: warning
        - label: Innovation probability
          value: 7
          detail: BRY812 / BR111 success affects upside most
          tone: warning
        - label: Financing clarity
          value: 6
          detail: Runway and exit readiness change required discount
          tone: neutral
