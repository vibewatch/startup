  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis, anti-thesis, and valuation anchor
        blocks:
          - type: paragraph
            body: >-
              The valuation case starts from one unusually useful fact for a private biotech: BioRay already has
              meaningful revenue. That means the last public round can be translated into an implied sales multiple
              instead of floating on narrative alone. Using filed 2024 revenue, the 2023 financing anchor implies a
              high-single-digit sales multiple. That is not obviously absurd, because BioRay has commercial
              infrastructure, high gross margin, and innovation options. But it is not obviously cheap either, because
              the company remains private, the public listing path has not yet completed, and key cash-quality metrics
              are still missing. The right thesis is therefore hybrid: BioRay is not a speculative science-only bet, yet
              it is also not transparent enough to deserve full trust as a premium public-market-quality compounder. Put
              differently, valuation support exists, but it is support for engagement rather than for price-insensitive
              conviction. The anchor is useful precisely because it can now be stress-tested against disclosed revenue
              rather than treated as mythology. That distinction matters for pricing. Right now.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
              - CV012
