      - number: '2.3'
        title: Buyers, segments, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Budget ownership in BioRay's markets is distributed across hospital procurement, specialty physicians,
              national reimbursement channels, and multinational partners. That creates different competitive shapes by
              asset. Anjianning and Anbaite sit in mature TNF categories against benchmark molecules such as Humira and
              Remicade, where physician familiarity and price pressure are intense. The Bimzelx partnership gives BioRay
              access to the IL-17 segment, but that market already contains strong branded incumbents such as Cosentyx
              and Taltz. In hematologic oncology, Anruixi must win against rituximab-based standards and newer anti-CD20
              alternatives such as Gazyva. In HER2 oncology, Anruize and the pertuzumab biosimilar opportunity are
              benchmarked against Herceptin and Perjeta. This substitute map shows why BioRay's market opportunity is
              broader than one molecule but also why it is hard to capture: every subsegment comes with entrenched
              multinational standards of care, local formulary behavior, and specialty-specific sales work.
