      - number: '3.4'
        title: Competitive verdict
        blocks:
          - type: paragraph
            body: >-
              The competitive verdict is mixed-positive. BioRay already looks more credible than a pre-revenue biotech
              because it has real products, a real channel, and credible innovation options. But it does not yet stand
              above the local field. The best-listed Chinese peers are better understood by public markets, and the ADC
              race is getting crowded enough that BioRay cannot rely on novelty alone. The right diligence frame is
              therefore comparative: investors should ask which peers demonstrate the same model with cleaner economics,
              clearer governance, or more defensible innovation, then test whether BioRay is converging toward or away
              from that standard. In other words, BioRay is investable only on a relative basis: the thesis improves if
              execution gaps close faster than peer advantages compound. A premium multiple would require clear evidence
              that BioRay is moving toward the Henlius/Innovent/Kelun tier on execution, not just claiming adjacency to
              it.
            claimRefs:
              - CP021
              - CP033
              - CP034
              - CP035
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: BioRay does not need to invent a new category to win
            body: >-
              The peer set shows the category already works. BioRay only needs to prove it can execute the model as
              cleanly as the strongest Chinese biologics companies.
            calloutType: insight
            claimRefs:
              - CP020
              - CP028
              - CP034
              - CP035
          - type: callout
            title: Competitive upside depends on proving distinction, not just participation
            body: >-
              Being credible is no longer enough in China biologics. BioRay must show why its channel-plus-portfolio
              model leads to better adoption or economics than peers can achieve.
            calloutType: risk
            claimRefs:
