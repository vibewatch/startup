  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Portfolio definition and asset map
        blocks:
          - type: paragraph
            body: >-
              BioRay's product layer is best understood as a tiered portfolio. The bottom tier is an already
              commercialized base of autoimmune and oncology biologics such as Anbainuo, Anjianning, Anbaite, Anruize,
              and Anruixi. The middle tier adds partner-linked commercial assets like Bimzelx, which give BioRay access
              to differentiated mechanisms and new specialist workflows without requiring internal discovery. The top
              tier is a broad innovation layer spanning BR105, BR111, BRY812, BR2060, BR2251, and other disclosed or
              pre-IND programs. This matters because BioRay's customer workflow, manufacturing needs, and valuation
              logic all depend on how these tiers interact. The company is not merely launching one antibody after
              another; it is trying to use a commercial base to support a platform expansion into newer modalities. That
              increases strategic scope but also makes execution discipline central. A failure in any shared
              layer—clinical operations, CMC transfer, plant throughput, or partner coordination—would therefore
              propagate across several assets rather than staying isolated to one brand.
