      - number: '1.5'
        title: Recent milestones, globalization, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              BioRay entered 2025 with meaningful momentum: it secured the UCB commercialization deal for Bimzelx in
              China, obtained FDA IND clearance for the BRY812 LIV-1 ADC, published phase III zuberitamab data, and
              signed a Turkish licensing deal covering three biosimilars. These are credible markers of a company
              expanding beyond a domestic autoimmune base into innovative oncology and overseas commercialization. At
              the same time, the strongest current adverse signal is corporate-financing rather than clinical: the Hong
              Kong IPO application filed on 6 January 2026 lapsed after six months, leaving BioRay private as of the run
              date. A lapsed application is not equivalent to a failed listing, but it does indicate that BioRay has not
              yet converted its scale and growth story into a completed public-market transaction. Until management
              clarifies next steps, the company overview should be read as strong operational progress paired with
              incomplete liquidity realization.
