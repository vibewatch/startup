      - number: '8.2'
        title: Comparable set and base case
        blocks:
          - type: paragraph
            body: >-
              Public comps sharpen the picture. Henlius and 3SBio show what the market pays for more mature commercial
              biologics businesses, while Innovent, Kelun-Biotech, and Mabwell show how much more investors will pay
              when innovation narrative, growth expectation, or ADC enthusiasm dominates. BioRay sits between those
              poles. Its revenue scale and commercial base argue against a deep mature-biologics discount, but its
              unresolved financing, partner economics, and still-early innovation assets argue against paying at the
              hottest peer multiples. A sensible base case is therefore mid-range: some premium to low-multiple
              commercial comps, some discount to high-multiple innovation comps, and a willingness to pay up only as
              diligence closes the evidence gap. This is also why the peer range matters so much: public markets are
              explicitly rewarding some Chinese biotech stories for cleaner innovation proof and punishing others when
              revenue looks real but strategically ordinary.
