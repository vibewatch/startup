            body: >-
              Public sources show BioRay allocating capital across three simultaneous priorities: commercializing
              innovative products, expanding and defending its current marketed portfolio, and funding a broad
              innovation pipeline. The 2023 strategic financing announcement explicitly tied proceeds to pipeline
              acceleration, in-licensing, and manufacturing upgrades. The IPO filing then widened that plan by
              earmarking funds for BR2251, BRY812, BR111, other pre-IND assets, technology-platform development, and
              digital infrastructure. That is strategically coherent, but it also illustrates why capital adequacy
              remains a live diligence question. R&D expense is still rising quickly, administrative/compliance costs
