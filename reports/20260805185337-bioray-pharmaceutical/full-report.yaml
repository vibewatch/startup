  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              BioRay is no longer a single-mode biologics seller. The filing shows a revenue base composed of product
              sales plus service income, with the latter coming from commercialization and manufacturing collaborations.
              That matters because it makes BioRay financially different from many private biotechs that remain
              dependent on financing alone. Reported revenue reached RMB1.257 billion in 2023, RMB1.623 billion in 2024,
              and RMB1.379 billion in the first nine months of 2025. Public materials also show that the company had
              already surpassed RMB900 million in 2022, before Anruixi and the UCB relationship were fully reflected.
              The fastest visible swing factor is Anruixi: revenue moved from de minimis in 2023 to a meaningful
              double-digit share of 2024 revenue after approval and reimbursement progress. Service revenue is also
              becoming more important, rising from a mid-single-digit share of revenue in 2023 to around one-tenth by
              the first nine months of 2025. The result is a business with credible public traction and growing
              diversification, but still limited transparency at the product and customer level.
            claimRefs:
              - CI001
              - CI002
              - CI003
