  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and direct peers
        blocks:
          - type: paragraph
            body: >-
              The right way to view BioRay competitively is as a mid-field Chinese biologics operator trying to upgrade
              into a more differentiated platform company. It is not just competing against multinational incumbents; it
              is also competing against local listed biotechs that already combine marketed products, public-market
              access, and broad pipelines. Henlius is the clearest direct template in biosimilars plus oncology
              antibodies, Innovent is the stronger public innovation brand, Kelun-Biotech is the harder ADC benchmark,
              and Mabwell and 3SBio make the peer field denser rather than easier. This means BioRay does not need to
              prove that Chinese biologics can scale—its peers already proved that. It needs to prove that its specific
              mix of channel depth, product breadth, and innovation timing can scale cleanly enough to matter. That
              makes peer benchmarking more important than category storytelling. Another implication is that BioRay
              cannot count on the category becoming easier as it matures; success requires outperforming already
              competent local operators, not merely surviving foreign competition. Today, especially. In China now.
              Clearly.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
