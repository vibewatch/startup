      - number: '3.2'
        title: Substitutes, pricing, and switching costs
        blocks:
          - type: paragraph
            body: >-
              At the product level, BioRay faces strong status-quo substitutes in every major segment. Anruixi competes
              against rituximab-family care pathways and newer anti-CD20 alternatives; Anjianning competes inside a
              mature adalimumab world; Bimzelx still has to prove itself against existing IL-17 incumbents; and Anruize
              competes under trusted HER2 standards such as Herceptin and Perjeta. Adjacent therapies such as Skyrizi
              and Rinvoq also matter because autoimmune budgets are often contested across mechanism families. These
              substitute patterns raise switching costs. In oncology the barrier is protocol and physician trust; in
              chronic immune disease it is reimbursement, history of response, and risk tolerance. Public evidence
              remains weak on actual price realization, so the competitor view is clearer on molecule overlap than on
              net pricing. This keeps discounting discipline essential. Because biologics decisions are path-dependent,
              a slightly better molecule is not always enough to move share if procurement, reimbursement, and physician
              habit remain unchanged.
            claimRefs:
              - CP007
