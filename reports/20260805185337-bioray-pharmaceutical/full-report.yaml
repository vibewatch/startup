      - number: '3.3'
        title: Moat, channel, and distribution power
        blocks:
          - type: paragraph
            body: >-
              BioRay's likely moat is practical rather than elegant. The company already has a China
              specialty-commercial base and can layer owned immune products, oncology brands, and partner-distributed
              assets through overlapping channels. That is more durable than a single-product story, but it is not a
              deep scientific monopoly. The UCB relationship is a good example: it expands product breadth and improves
              credibility, yet it does not create proprietary control over the underlying asset. Similarly, BioRay
              benefits from not facing true “internal build” competition by customers, because hospitals choose among
              approved therapies rather than manufacturing their own biologics. The risk is that peers with clearer
              public execution histories may prove better at converting similar advantages into sustainable share.
              Investors should therefore test channel proof empirically. That is why contract economics, hospital
              coverage quality, and launch conversion matter more than abstract moat language in this sector.
            claimRefs:
