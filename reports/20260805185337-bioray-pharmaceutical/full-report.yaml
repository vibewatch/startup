      - number: '4.2'
        title: Cost structure and margin path
        blocks:
          - type: paragraph
            body: >-
              BioRay's reported economics are strong for a commercial biotech, but the margin picture is more nuanced
              than the headline suggests. Gross profit rose from RMB1.033 billion in 2023 to RMB1.286 billion in 2024,
              and gross margin remained high at 82.2% in 2023 and 79.2% in 2024. However, margin softened in 2025:
              overall gross margin fell to 74.4% in the first nine months, drug-sales gross margin narrowed, and service
              margin dropped sharply as UCB-related launch work started. Cost-of-sales data suggests this is a real
              manufacturer with real infrastructure, since depreciation and amortization are large, and raw materials,
              production overhead, and manufacturing labor are all visible cost buckets. These are not alarming on their
              own, but they do mean BioRay's economics depend on throughput, product mix, and channel structure—not just
              headline pricing.
