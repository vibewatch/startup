              not undermine the thesis that BioRay has meaningful internal manufacturing, but it does reduce precision
              on current capacity utilization and expansion needs. Headcount also shows a pattern of scaling from more
              than 700 staff in 2019 to more than 1,400 in 2023 and over 1,800 in late 2024, although third-party
              databases still report materially lower estimates.
