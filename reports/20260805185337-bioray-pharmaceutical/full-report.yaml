        title: Commercial scale, manufacturing, and distribution footprint
        blocks:
          - type: paragraph
            body: >-
              Public scale indicators are robust enough to show BioRay is already operating as a national commercial
              platform. The filing describes more than 450 autoimmune-focused field reps plus more than 190 oncology
              reps, coverage of more than 4,000 hospitals and 2,000 pharmacies across 31 provincial-level regions, and
              strong market presence in rheumatology, dermatology, hematology, and gastroenterology. Manufacturing scale
