  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk view
        blocks:
          - type: paragraph
            body: >-
              BioRay's risk profile is best understood as a stack of upgrade risks rather than a single existential
              failure mode. Commercial scale and marketed products reduce the probability of sudden collapse, but they
              do not eliminate the possibility that BioRay fails to evolve from a good operator into a durable
              innovation platform. The most severe risks cluster around financing flexibility, competitive
              differentiation, and execution breadth. If innovation assets slip, Anruixi ramps more slowly than
              expected, or post-IPO-lapse funding becomes expensive, BioRay can still remain operational while losing
              much of its valuation upside. That distinction matters because the investment case is more sensitive to
              strategic disappointment than to immediate solvency. Investors therefore need a risk framework that
              distinguishes survivability from upside preservation, because BioRay can remain a functioning company
              while still losing much of the premium attached to its platform narrative. That is why downside discipline
              matters early. It separates manageable noise from thesis-breaking deterioration. For underwriting today.
              And discipline. Now.
