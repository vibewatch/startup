              BioRay's partner strategy creates both leverage and dependency. UCB-linked service revenue diversifies the
              model, but it also ties part of the growth story to a single major counterparty and to BioRay's ability to
              commercialize someone else's innovative asset effectively. International deals create similar monitoring
              needs. Competitive pressure compounds the problem: Henlius, Innovent, Kelun-Biotech, Mabwell, and 3SBio
