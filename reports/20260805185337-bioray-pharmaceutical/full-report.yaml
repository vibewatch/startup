chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, origin, and operating model
        blocks:
          - type: paragraph
            body: >-
              BioRay Biopharmaceutical is the biologics platform spun out from Hisun Pharmaceutical in 2019 and now
              presents itself as a commercial-stage immunology and oncology company with integrated discovery,
              development, manufacturing, registration, and commercialization capabilities. Public company materials
              anchor the operating footprint in Taizhou, Hangzhou, Shanghai, and San Diego, while the company's current
              positioning centers on immune-mediated diseases plus oncology rather than generic contract manufacturing
              or pure biosimilar licensing. The listing-application coverage also indicates the company has moved well
              beyond its original autoimmune biosimilar base: by January 2026 public reporting described eight
              commercialized products and a deeper pipeline that includes innovative assets such as zuberitamab, BR2251,
              BRY812, and BR111. The company still leans heavily on self-disclosure for exact product counts and
              operating definitions, but the combination of the 2023 financing materials, the 2026 filing, and current
              website pages supports a coherent identity as a scaled China biologics company rather than an early-stage
              R&D shop.
