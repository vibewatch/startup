  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segments and channel structure
        blocks:
          - type: paragraph
            body: >-
              BioRay's customer base is best segmented by institutional role rather than by logo count. The main users
              are hospital specialists in rheumatology, dermatology, hematology/oncology, and gastroenterology; the main
              buyers are hospitals and channel intermediaries; and the main payers are reimbursement systems that
              determine practical access. Partners can also become quasi-customers when BioRay is commercializing or
              supplying a product on their behalf. Public evidence suggests BioRay already reaches a large institutional
              base and separates field execution by autoimmune versus oncology channels. That indicates a genuine
              multi-segment commercial machine rather than a one-product sales team. It also means account quality
              depends less on headline hospital count than on formulary inclusion, specialist advocacy, reimbursement
              execution, and the company's ability to keep multiple therapeutic channels staffed at once. That makes
              customer quality a function of channel discipline and execution intensity, not just product awareness or
              scientific novelty.
