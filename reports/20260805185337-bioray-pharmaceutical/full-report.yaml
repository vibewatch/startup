          label: Initial use
          detail: First prescribing or deployment proves workflow fit, but early use does not guarantee durable economics.
          tone: neutral
        - id: repeat
          label: Repeat use
          detail: Chronic immune indications should support better repeat visibility than episodic oncology settings.
          tone: warning
        - id: expand
          label: Cross-sell expansion
          detail: >-
            Channel reuse across specialties and partner products is the main path to higher wallet share per
            institution.
          tone: warning
