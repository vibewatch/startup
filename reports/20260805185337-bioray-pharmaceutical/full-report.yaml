    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      BioRay's customer path runs from approval and reimbursement into hospital adoption, physician use, repeat
      prescribing, and cross-sell expansion.
    data:
      nodes:
        - id: access
          label: Approval / reimbursement
          detail: >-
            NMPA approval and NRDL coverage determine whether hospitals and physicians can realistically adopt a BioRay
            brand.
