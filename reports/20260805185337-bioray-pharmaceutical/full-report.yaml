    title: Valuation / return range
    type: range
    layout: wide
    summary: A disciplined range brackets BioRay between lower-multiple commercial comps and higher-multiple innovation peers.
    data:
      items:
        - label: Bear frame
          low: 4
          mid: 5
          high: 6
          displayValue: ~4x-6x sales
          detail: Closer to mature commercial peer logic
          tone: warning
        - label: Base frame
          low: 6.5
          mid: 8
          high: 9.5
          displayValue: ~6.5x-9.5x sales
          detail: Hybrid commercial + option-value case
          tone: neutral
        - label: Bull frame
          low: 10
          mid: 12
          high: 15
          displayValue: ~10x-15x sales
          detail: Requires cleaner innovation and financing proof
          tone: positive
        - label: Public peer spread
          low: 2.01
          mid: 9.93
          high: 46.76
          displayValue: 2.0x-46.8x sales
          detail: Observed peer range from 3SBio to Kelun-Biotech
          tone: neutral
