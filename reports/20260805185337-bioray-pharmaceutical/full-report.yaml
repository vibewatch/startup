        - id: hospital
          label: Hospital access
          detail: BioRay must win formulary, procurement, and distribution access across hospital and pharmacy channels.
          tone: neutral
        - id: physician
          label: Physician adoption
          detail: >-
            Specialist advocacy and KOL familiarity drive first use in rheumatology, dermatology, hematology, and
            oncology.
          tone: positive
