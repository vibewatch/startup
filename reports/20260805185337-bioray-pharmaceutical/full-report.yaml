            title: Channel overlap matters more than biotech-style headline TAM
            body: >-
              BioRay's best market advantages come from reusing one specialty sales and hospital network across several
              immune-disease products, not from a single moonshot asset. That makes 4,000-hospital reach more actionable
              than any one 2030 market-size statistic.
