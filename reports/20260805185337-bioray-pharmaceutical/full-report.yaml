      - number: '4.4'
        title: Financial verdict and remaining blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is favorable on current scale, positive on gross-profit generation, and mixed on
              transparency. BioRay has clearly demonstrated commercial traction and a margin profile that many private
              biotechs do not have. It also appears to be building higher-quality revenue by layering Anruixi sales and
              UCB-linked services onto an established autoimmune base. Still, the public record does not disclose cash
              runway, product-level contribution margin, rep productivity, customer concentration, or post-IPO-lapse
              financing contingency plans. Those missing metrics matter because BioRay is entering the stage where the
              question shifts from “does it have revenue?” to “is the revenue durable and efficient enough to self-fund
              innovation?” Until that is answered, the company should be viewed as financially credible but not yet
              fully underwritten. For investment work, the immediate next diligence step is not another headline revenue
              check; it is a bridge from reported sales to cash generation, partner concentration, and product-level
              gross margin so the apparent strength of the top line can be tested against actual financing resilience
              for underwriting discipline.
