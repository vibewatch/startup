      - number: '7.2'
        title: Regulatory, operational, and IP risks
        blocks:
          - type: paragraph
            body: >-
              Regulatory and operating risks are intertwined in BioRay's model. The company needs clean execution across
              NMPA, FDA, and overseas quality systems while running integrated manufacturing and a growing clinical
              pipeline. International milestones such as Colombia GMP success and Pakistan approval are helpful, but
              they also broaden the compliance surface. Likewise, internal manufacturing reduces outsourcing dependency,
              yet it introduces fixed-cost, utilization, and batch-quality risk that can affect several products
              simultaneously. The public record is still thin on pharmacovigilance, recalls, deviation rates, and plant
              utilization. IP risk is also real: visible patent activity supports defensibility, but crowded ADC and
              biologics markets raise freedom-to-operate and late-stage challenge risk. This is especially important in
              biologics, where process quality and regulatory discipline often matter as much as molecule design once
              the company is supporting several concurrent programs and jurisdictions.
