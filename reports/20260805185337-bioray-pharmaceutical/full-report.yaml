  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and underlying disease demand
        blocks:
          - type: paragraph
            body: >-
              BioRay's addressable universe is best understood as a set of adjacent specialty-biologics markets rather
              than one monolithic biotech TAM. On the autoimmune side, the company participates in chronic immune
              diseases such as rheumatoid arthritis, psoriasis, ankylosing spondylitis, and inflammatory bowel disease;
              on the oncology side, it addresses DLBCL and other CD20-driven hematologic malignancies, HER2-positive
              tumors, and innovative solid-tumor ADC programs. Disease-context sources reinforce that these are
              recurring-care markets. Rheumatoid arthritis, psoriasis, and ankylosing spondylitis all require long-term
              specialty management, while gout and DLBCL create distinct high-need populations that can justify targeted
              premium therapies. That matters because BioRay is not selling one interchangeable biologic: each disease
              area has separate physicians, hospital pathways, payer rules, and patient persistence dynamics. Market
              size therefore has to be framed by treatment modality and specialty channel, not by the company's
              corporate revenue alone.
            claimRefs:
              - CM001
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM034
