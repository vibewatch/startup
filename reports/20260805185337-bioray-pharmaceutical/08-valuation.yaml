- calloutType: insight
  title: BioRay is valuable enough to matter, but not clear enough to chase
  body: The company has crossed the threshold from speculative to substantive. The pricing problem is not whether BioRay has built something real; it is how much future innovation and financing confidence is already embedded in the last anchor.
  claimRefs:
