- id: scenarios-deal-terms-and-kill-triggers
  title: Scenarios, deal terms, and kill triggers
  body: 'The bull case assumes BioRay keeps compounding owned-product revenue while converting BRY812, BR111, and partner-linked commercialization into a cleaner innovation premium. The bear case assumes the opposite: BioRay remains commercially real but strategically ordinary, with too little proof to support a unicorn-plus rerating. That spread is why deal terms matter. Because exit readiness is incomplete and financing flexibility remains somewhat opaque, investors should care about structure, downside protections, and governance rights rather than focusing only on nominal valuation. The thesis-break is not one missed milestone; it is a pattern where financing weakens, innovation slips, and revenue quality fails to improve together. In a private deal, these uncertainties should be translated into terms, governance, and valuation guardrails instead of being waved away as temporary market noise.'
  claimRefs:
  - CV016
  - CV017
  - CV021
  - CV022
  - CV023
