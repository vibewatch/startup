- id: recommendation-and-final-asks
  title: Recommendation and final asks
  body: 'The recommendation is conditional pursue. BioRay is too substantial to dismiss and too under-disclosed to chase. Investors should be willing to stay engaged because the company has crossed from aspiration into operation, but they should not assume the last round is automatically the correct entry point. The best posture is to negotiate from uncertainty: seek either a discount, structure, or milestone-linked protection that reflects residual financing, concentration, and innovation-proof risk. If updated 2026 diligence shows stronger cash visibility, cleaner partner economics, and continued innovation execution, the price can move up. If those answers worsen, the right move is to pass rather than average into a story that public markets have not yet fully validated. That combination of seriousness and restraint is the most defensible posture from public evidence alone. A disciplined committee could still choose to proceed, but it should do so only if the negotiated structure explicitly
    compensates for the gap between what BioRay has already proven and what its last private price appears to assume about future execution.'
