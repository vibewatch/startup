- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Cash runway
    - Updated liquidity and runway model
    - Changes discount rate and financing risk immediately
    - Management / finance data room
  - - Partner economics
    - UCB and other contract economics
    - Determines revenue quality and moat value
    - Legal + finance contract review
  - - Product-level profitability
    - Brand contribution margin and gross-to-net
    - Needed to validate hybrid valuation frame
    - Commercial finance diligence
  - - Innovation milestone map
    - Updated BR111 / BRY812 timeline and readouts
    - Determines premium-multiple durability
    - Clinical diligence
  - - Governance and rights
    - Preference stack, board rights, protections
    - Key because exit readiness is incomplete
    - Legal + cap-table review
  - - Peer refresh
    - Live public comp update at term-sheet time
    - Chinese biotech multiples move quickly
    - Market-data refresh
  notes: These asks are what separates interesting from actionable on pricing.
