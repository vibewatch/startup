  - CV040
- calloutType: risk
  title: The wrong mistake is overpaying for option value before the options mature
  body: Public comps show how quickly biotech multiples diverge when markets believe or doubt the innovation story. BioRay is not yet disclosed well enough to pay as if the highest-upside case is already proven.
