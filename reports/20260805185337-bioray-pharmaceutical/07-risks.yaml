- id: mitigants-monitoring-and-kill-criteria
  title: Mitigants, monitoring, and kill criteria
  body: 'The main mitigant is that BioRay already has real revenue, marketed products, and visible platform assets; this is not a shell company or a single-preclinical-shot story. But that strength should not be mistaken for proof that every next stage will work. The key monitoring question is whether execution is compounding or fragmenting. Investors should watch milestone timing, Anruixi commercial traction, partner economics, plant-quality disclosure, and evidence that BR111 or BRY812 can stand out in crowded fields. If those markers move the wrong way together, the thesis-break is not one bad quarter: it is the realization that BioRay''s platform breadth has become a coordination burden without enough capital or differentiation to justify it. A disciplined investor should also ask which mitigation gets funded first if tradeoffs emerge between defending the current base, supporting partner launches, and preserving innovation momentum. The right monitoring cadence is monthly for financing
    and operational signals, quarterly for partner and margin evidence, and milestone-based for clinical assets, because waiting for one annual review would let several moderate risks compound into one much larger strategic problem.'
  claimRefs:
  - CR022
  - CR025
  - CR026
  - CR027
  - CR029
