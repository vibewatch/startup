- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Financing flexibility
    - No clear post-lapse financing plan
    - Management cannot show 18-24 month funding path
    - Re-cut valuation and require financing-first diligence
  - - Innovation slippage
    - BR111 / BRY812 timeline drift
    - Multiple milestone delays or weak early data
    - Shift thesis toward base-business-only case
  - - Anruixi commercialization
    - Adoption lags expectations
    - Traction fails to improve mix despite proof package
    - Lower upside assumptions and reduce conviction
  - - Partner concentration
    - UCB economics disappoint or partner revenue stalls
    - Service revenue grows slower than cost base
    - Treat diversification thesis as unproven
  - - Operational quality
    - Material deviation, recall, or visible QA problem
    - Any major quality event or persistent opacity
    - Escalate to red-flag diligence
  - - Competitive displacement
    - Peers post clearly superior data or broader approvals
    - BioRay assets no longer look differentiated
    - Compress terminal multiple / probability weights
  notes: Kill criteria focus on thesis-break transmission, not on isolated minor setbacks.
