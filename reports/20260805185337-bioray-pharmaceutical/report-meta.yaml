companyProfile:
  summary: >-
    BioRay Pharmaceutical is a commercial-stage Chinese biologics company that emerged from Hisun's
    biologics platform and is now controlled primarily by PAG Highlander and Hisun Pharmaceutical. By
    the January 2026 filing, the company had scaled to RMB1.623 billion of 2024 revenue, 79.2% gross
    margin, broad hospital and pharmacy coverage, and a hybrid business model spanning owned-product
    sales, commercialization/service revenue, and manufacturing-service revenue. The core investment
    appeal is that BioRay is already operationally real while still retaining upside from innovative
    assets such as Anruixi, BR111, and BRY812.
  foundingLocation: Taizhou, Jiangsu Province, China
  headquarters: Taizhou, Jiangsu Province, China
  productSummary: >-
    BioRay sells marketed autoimmune brands and oncology biologics, including the anti-CD20 product
    Anruixi, while advancing a broader platform spanning ADCs, bispecifics, and additional antibody
    programs such as BR111 and BRY812. It also operates integrated discovery, development, and GMP
    manufacturing capabilities.
  customerFocus: >-
    Hospitals, specialist physicians, pharmacy channels, reimbursement-linked payers, and strategic
    commercialization partners.
  businessModel: >-
    Revenue comes from direct product sales, commercialization/service fees such as the UCB-linked
    arrangement, manufacturing-service revenue, and selective licensing / partnership activity.
  stage: Late-stage private (IPO-filed, still private)
  fundingStatus: >-
    BioRay announced a January 2023 strategic financing of more than RMB1.5 billion (about US$218M)
    at a pre-money valuation of about US$1.9B. No completed IPO or later priced financing event is
    publicly confirmed through the run date.
  disclosureProfile: private-disclosed
