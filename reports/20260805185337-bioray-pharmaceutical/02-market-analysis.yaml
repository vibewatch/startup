- id: sizing-lenses-and-serviceable-market
  title: Sizing lenses and serviceable market
  body: 'The strongest public sizing lens comes from the market-study figures quoted in the January 2026 IPO summary. That coverage cites a China autoimmune-biologics opportunity of roughly RMB180 billion by 2030, a China CD20-antibody market of roughly RMB25 billion, and a China gout market of roughly RMB12 billion, alongside a portfolio-level peak-revenue story of roughly RMB48 billion by 2032. Those figures are directionally useful because they show BioRay is participating in categories large enough to support multiple billion-renminbi franchises. But they are not precise SAM or SOM estimates. Public evidence does not disclose asset-level revenue, precise share, or product-level pricing for BioRay, so the serviceable market has to be inferred from commercial reach instead. The best SAM proxy is BioRay''s channel footprint: more than 4,000 hospitals, more than 2,000 pharmacies, and large field teams in both autoimmune disease and oncology. In other words, BioRay''s practical serviceable
    market is a function of where its channel can actually convert physicians and formularies, not just how large the headline disease pools look on paper.'
