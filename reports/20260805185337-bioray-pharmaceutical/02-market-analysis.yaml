tables:
- id: TM001
  title: Market definition table
  columns:
  - Submarket
  - Included spend
  - Excluded / adjacent spend
  - Status-quo substitute
  - Why it belongs in scope
  rows:
  - - Autoimmune biologics
    - TNF, IL-17, IL-23, JAK-adjacent specialty treatment budgets for RA, psoriasis, AS and related diseases
    - Primary-care pain drugs and undifferentiated oral generics
    - Humira, Cosentyx, Taltz, Rinvoq
    - BioRay sells or partners around immune-disease therapies through rheumatology and dermatology channels
  - - Hematologic oncology CD20
    - DLBCL and related B-cell lymphoma antibody budgets
    - Broader chemotherapy-only spend outside CD20 targeting
    - Rituxan, Gazyva
    - Anruixi competes directly for lymphoma-treatment adoption
  - - HER2 oncology biologics
    - Trastuzumab and pertuzumab treatment budgets in HER2+ disease
    - Non-HER2 oncology biologics and unrelated solid-tumor agents
    - Herceptin, Perjeta
    - Anruize and HS627 sit in HER2 hospital purchasing pathways
  - - Innovative ADC / IO oncology
    - Novel targeted-antibody budgets for BRY812, BR111 and follow-ons
    - Small-molecule oncology spend outside targeted biologics
    - Novel ADC peers and internal hospital protocols
    - BioRay's innovation thesis depends on expanding beyond mature biosimilars
  - - Gout / inflammatory expansion
    - Novel gout biologics or differentiated agents such as BR2251
    - OTC pain relief and commodity urate-lowering generics
    - Standard gout care pathways
    - IPO coverage presents gout as a meaningful future value pool
  notes: Market boundary is constrained to treatment categories BioRay currently serves or publicly targets rather than all biopharma spend.
