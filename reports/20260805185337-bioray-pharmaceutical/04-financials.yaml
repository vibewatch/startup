- id: capital-allocation-and-adequacy
  title: Capital allocation and adequacy
  body: 'Public sources show BioRay allocating capital across three simultaneous priorities: commercializing innovative products, expanding and defending its current marketed portfolio, and funding a broad innovation pipeline. The 2023 strategic financing announcement explicitly tied proceeds to pipeline acceleration, in-licensing, and manufacturing upgrades. The IPO filing then widened that plan by earmarking funds for BR2251, BRY812, BR111, other pre-IND assets, technology-platform development, and digital infrastructure. That is strategically coherent, but it also illustrates why capital adequacy remains a live diligence question. R&D expense is still rising quickly, administrative/compliance costs are also increasing, and the filing references bank loans and redemption liabilities. BioRay looks much healthier than a pre-revenue biotech, yet its capital needs are also larger and more continuous because it is running both a commercial engine and a sizable late-stage / innovation engine
    at once.'
  claimRefs:
  - CI022
  - CI023
  - CI025
  - CI026
  - CI027
  - CI028
