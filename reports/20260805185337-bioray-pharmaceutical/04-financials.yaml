- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public status
  - Why it matters
  - Risk read
  - Diligence ask
  rows:
  - - Existing revenue base
    - Strong and already commercial
    - Reduces dependence on external financing relative to pre-revenue biotech
    - Positive
    - Confirm cash conversion and working-capital demands
  - - 2023 strategic financing use
    - Pipeline, in-licensing, manufacturing upgrade
    - Shows funds were directed to operating scale-up rather than purely overhead
    - Positive
    - Request post-round cash bridge
  - - Planned IPO use of proceeds
    - Commercialization, pipeline R&D, platform, digital infrastructure
    - Illustrates large ongoing capital appetite
    - Mixed
    - Request revised plan after IPO lapse
  - - Bank loans and finance cost
    - Present but partly reduced in 9M25
    - Adds leverage and interest sensitivity
    - Manageable
    - Request debt schedule and covenants
  - - Redemption liabilities
    - Present in filing
    - Can complicate equity economics and future financing
    - Negative
    - Request cap-table waterfall and preference terms
  - - Runway disclosure
    - Incomplete in public evidence
    - Blocks clean underwriting of capital adequacy
    - Negative
    - Request monthly burn and 24-month runway model
  notes: BioRay looks financeable, but the missing cash/runway disclosures keep capital adequacy from being fully confirmed.
  claimRefs:
  - CI022
  - CI023
  - CI027
  - CI028
  - CI034
- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on analysis
  - Exact diligence path
  rows:
  - - Cash balance and unrestricted liquidity
    - Without this, runway cannot be confirmed
    - Obtain balance sheet, monthly cash burn, and covenant package
  - - Brand-level revenue mix
    - Blocks precise valuation and portfolio-risk analysis
    - Request 2023-9M25 revenue by brand and geography
  - - Per-brand gross margin
    - Makes product quality and cross-subsidization invisible
    - Request COGS by major brand and service stream
  - - Sales-force productivity
    - Prevents clean CAC/payback proxy
    - Request rep productivity and launch conversion metrics
  - - Customer / partner concentration
    - Could hide dependence on a few accounts or channels
    - Request top-customer and top-partner schedules
  - - Post-IPO-lapse financing plan
    - Directly affects capital adequacy and negotiation leverage
    - Request board-approved 2026 financing plan and alternatives
  notes: These gaps are the main blockers to full underwriting rather than proof that the business lacks real financial substance.
