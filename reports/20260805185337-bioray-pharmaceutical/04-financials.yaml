- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - 2024 gross margin
    - 79.2%
    - High
    - Shows strong current economics for a commercial biologics platform
    - Confirm by audited annual statements
  - - 9M25 gross margin
    - 74.4%
    - High
    - Signals mix or ramp pressure even as revenue grows
    - Bridge to product mix and service-startup costs
  - - 9M25 R&D expense
    - RMB219.5M
    - High
    - Pipeline breadth is consuming real capital
    - Split by late-stage vs exploratory programs
  - - Sales efficiency
    - Proxy only
    - Low
    - Field-force leverage matters in a specialty-commercial model
    - Request rep count by asset, productivity, and payback
  - - Per-brand contribution margin
    - Not public
    - Low
    - Critical for valuation and capital-allocation quality
    - Request gross-to-net and manufacturing cost by key brand
  - - Customer concentration
    - Not public
    - Low
    - A few partners or channels could skew revenue quality
    - Request top-10 customer and partner exposure
  notes: Public disclosure is strong on gross margin, weak on sales efficiency and brand-level contribution economics.
