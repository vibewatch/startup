company:
  name: BioRay Pharmaceutical
chapter:
  number: 4
  title: Financials
  summary: 'Public financial evidence from BioRay''s January 2026 listing filing supports a rare profile for a private China biotech: billion-renminbi revenue, gross margins above 70%, and a business model already mixing branded biologic sales with commercialization and manufacturing services. The main diligence issue is not whether BioRay has real revenue, but how much of that revenue is durable, product-led, economically concentrated, and sufficient to fund an increasingly ambitious innovation pipeline without depending on fresh capital.'
sections:
- id: revenue-model-and-traction
  title: Revenue model and public traction
  body: 'BioRay is no longer a single-mode biologics seller. The filing shows a revenue base composed of product sales plus service income, with the latter coming from commercialization and manufacturing collaborations. That matters because it makes BioRay financially different from many private biotechs that remain dependent on financing alone. Reported revenue reached RMB1.257 billion in 2023, RMB1.623 billion in 2024, and RMB1.379 billion in the first nine months of 2025. Public materials also show that the company had already surpassed RMB900 million in 2022, before Anruixi and the UCB relationship were fully reflected. The fastest visible swing factor is Anruixi: revenue moved from de minimis in 2023 to a meaningful double-digit share of 2024 revenue after approval and reimbursement progress. Service revenue is also becoming more important, rising from a mid-single-digit share of revenue in 2023 to around one-tenth by the first nine months of 2025. The result is a business with credible
    public traction and growing diversification, but still limited transparency at the product and customer level.'
  claimRefs:
