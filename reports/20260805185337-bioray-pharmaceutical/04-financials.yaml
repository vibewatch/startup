tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality read
  - Diligence ask
  rows:
  - - Product sales
    - Direct sale of branded biologics and biosimilars
    - RMB revenue
    - Core stream; includes marketed autoimmune brands and Anruixi
    - Highest-quality visible stream but brand mix still incomplete
    - Request brand-level revenue and gross margin
  - - Promotion services
    - Commercialization support for partner asset(s), notably UCB bimekizumab
    - Quarterly service fee / sales-linked fee
    - Growing from 5.7% to 10.1% of revenue across 2023 to 9M25
    - Strategically useful but margin quality currently lower
    - Request full service-fee economics and KPI adjustments
  - - Manufacturing services
    - CMO / CDMO and royalty-linked arrangements, including bevacizumab collaboration
    - Service revenue + milestones / royalties
    - Publicly disclosed as part of service income
    - Potentially attractive but not transparently segmented
    - Request partner-level revenue and margin disclosure
  - - International licensing
    - Out-licensing / overseas commercialization agreements
    - Milestones / royalties / supply revenue
    - Visible commercially but not yet material in public revenue mix
    - Promising diversification but still early
    - Request contract economics for Turkey and other markets
  - - Future innovative launches
    - Commercialization of newer proprietary assets
    - RMB revenue
    - Depends on label expansion and pipeline progress
    - Potentially highest-value stream, still ramping
    - Request product launch plans and forecast assumptions
  notes: Revenue is clearly multi-stream, but public disclosure does not provide a clean segment P&L by stream.
  claimRefs:
  - CI001
  - CI008
  - CI010
  - CI011
  - CI032
  - CI033
- id: TI002
  title: Pricing / monetization table
  columns:
  - Product / stream
  - Price / unit / contract model
  - List vs realized pricing
  - Discounts / unknowns
  - Source-backed implication
  rows:
  - - UCB bimekizumab promotion service
    - Annual service fee linked to net sales, starting at 35% and KPI-adjusted
    - Realized economics depend on sell-through and KPI modifiers
    - Detailed fee schedule and cost base not public
    - This is a real monetization line, not just a non-binding partnership
  - - Anruixi
    - Product-sale model through hospital / reimbursement channels
    - Realized price affected by reimbursement and distribution terms
    - No public net price or per-vial realization
    - Revenue scale is visible, unit economics are not
  - - Anruize and partner-led distribution
    - Product sales with partner-led distribution in at least one arrangement
    - Realization shifted with distribution model change
    - Exact discount / transfer-price economics undisclosed
    - Channel structure can influence margin without changing end demand
  - - CMO / CDMO manufacturing service
    - Supply fee plus royalty / milestone components in some cases
    - Realized economics depend on volumes and milestones
    - No public contract margin disclosure
    - Manufacturing can create revenue diversity but may not match product margins
  - - Overseas licensing deals
    - Likely milestone, supply, and channel-sharing economics
    - Too early to infer realized pricing
    - Financial terms undisclosed
    - Internationalization is strategic today, not yet a proven revenue lever
  notes: Pricing is the weakest public area; the filing is better on aggregate revenue and margin than on realized per-unit economics.
