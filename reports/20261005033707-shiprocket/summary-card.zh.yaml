  topStrengths:
    - 上市验证了商业模式，也形成了流动性较好的估值基准。
    - 商户规模庞大，产品覆盖物流以及使用频率更高的相邻工具。
    - 新兴产品增长迅速；如果变现能力改善，交叉销售潜力可观。
  topRisks:
    - 新兴业务仍在亏损，合并口径的盈利能力尚未得到证明。
    - 如果增长放缓或价格收紧，获客成本和对快递公司的依赖可能挤压经济性。
    - 历史融资、所有权和治理细节在公开证据中仍未完全对账。
  unresolvedGaps:
    - 公开数据库和二手资料汇总之间，精确的股权结构表及累计融资金额仍未完成对账。
    - 产品层面的毛利率、贡献利润率以及分业务留存率仍未披露。
    - 商户流失率、NRR 和队列经济性仍不透明，足以限制我们对长期变现能力的信心。
    - 上市后的董事会构成、继任梯队深度以及当前所有权权利仍未完全厘清。
