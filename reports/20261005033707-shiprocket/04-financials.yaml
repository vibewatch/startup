chapter:
  number: 4
  title: "Financials"
  summary: "Shiprocket transitioned into a public company in August 2026 after posting fiscal 2026 revenue of INR 20,241.41 million (up 24% YoY) and reporting Q1 FY27 revenue of INR 592.1 crore (up 34% YoY). While its core logistics aggregation delivers positive adjusted EBITDA (INR 52.7 crore at a 12.8% margin in Q1 FY27), aggressive expansion into emerging martech, omnichannel cargo, and cross-border solutions remains loss-making (-24.3% adjusted EBITDA margin) and working-capital intensive."
sections:
  - id: "revenue-streams-and-pricing-architecture"
    title: "Revenue Streams and Pricing Architecture"
    body: "Shiprocket generates top-line revenue through two primary reporting segments: core logistics enablement and emerging multi-channel commerce services. In its core logistics operation, Shiprocket functions as an asset-light aggregator, connecting direct-to-consumer (D2C) brands, independent retailers, and MSMEs to a network of 42 courier partners across more than 19,000 to 26,000 pin codes. The core monetization structure relies primarily on per-shipment fees starting at list rates of INR 20 per 500 grams for domestic parcel delivery, B2B bulk cargo rates starting at INR 6 per kilogram, and variable platform take rates on transactional volume. In addition to transactional shipping fees, Shiprocket charges recurring software subscription tiers ranging from $24 to $36 per month for advanced routing, analytics, and automation features. Emerging business lines have scaled rapidly to account for 30% of total revenue in Q1 FY27, driven by a 193% YoY surge in marketing technology (martech) offerings and a 92% YoY increase in omnichannel and bulk B2B dark-store fulfillment. However, because emerging offerings currently produce lower realization per transaction than core shipping aggregation, top-line monetization remains dependent on volume throughput rather than fixed contractual software licenses."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI008"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "unit-economics-and-gtm-efficiency"
    title: "Unit Economics and GTM Efficiency"
    body: "The underlying unit economics of Shiprocket demonstrate clear operational leverage in the mature core shipping segment contrasted with early-stage margin dilution across emerging products. At the platform level, adjusted EBITDA per transaction expanded to INR 1.50 in Q1 FY27 from INR 0.22 in Q1 FY26, driven by procurement rate compression from 3PL courier partners and higher transaction density across 216 million trailing-twelve-month transactions. Consolidated contribution margin grew 43% year-over-year in Q1 FY27 to 15.3% in emerging bets and expanded across core logistics. However, sales efficiency proxies show emerging pressure: customer acquisition cost (CAC) for the core shipping business increased 13.5% YoY to INR 3,560 in Q1 FY27, while blended overall CAC reached INR 6,429 (compared to INR 5,829.67 in FY26 and INR 5,742.33 in FY25). While average revenue per power merchant climbed to INR 18.7 lakh from INR 15.0 lakh, the absolute pool of power merchants contracted slightly from 10,282 to 10,170. Shiprocket is attempting to counter rising acquisition costs through cross-selling emerging tools—such as Fastrr 1-click checkout and automated WhatsApp marketing—to its 2.22 lakh active merchants, raising cross-sell penetration from 7.3% to 8.8%."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI013"
    tableRefs:
      - "TI003"
  - id: "cost-structure-and-capital-adequacy"
    title: "Cost Structure, Capital Adequacy, and Diligence Verdict"
    body: "Shiprocket's cost structure is dominated by direct 3PL freight purchase obligations, customer acquisition expenses, and expanding product engineering overhead across its 1,500-person headcount. In fiscal 2026, the company posted an accounting loss for the year of INR 792.45 million on net worth of INR 15,242.89 million, following a loss of INR 744.49 million in FY25. In Q1 FY27, net loss narrowed 24% YoY to INR 13.7 crore from INR 18.0 crore. Operating losses remain heavily concentrated in emerging business lines, which recorded an adjusted EBITDA margin of negative 24.3% in Q1 FY27. On capital adequacy, Shiprocket substantially reinforced its liquidity through its August 2026 initial public offering on the BSE and NSE, which raised a total of INR 1,617.48 crore ($195M+ equivalent), comprising a fresh equity issue of INR 885.50 crore (9.13 crore shares at ₹97) and an offer for sale of INR 731.98 crore. Management designated fresh capital proceeds specifically toward technology infrastructure, platform marketing, debt repayment, and potential inorganic acquisitions. Diligence underwriting must evaluate key structural risks: carrier rate renegotiations, working-capital exposure in COD remittance advances, execution risk across emerging segments, and persistent merchant complaints regarding parcel damage claims."
    claimRefs:
      - "CI005"
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI014"
      - "CI015"
