callouts:
  - calloutType: "insight"
    title: "Emerging Services Cross-Sell Is the Key Margin Lever"
    body: "While Shiprocket's core parcel shipping business generates stable adjusted EBITDA at a 12.8% margin, corporate gross profit expansion relies on monetizing the same order across checkout, martech, and omnichannel dark-store distribution. With emerging business revenue growing 70% YoY to INR 180.4 crore, merchant cross-sell penetration (8.8%) will dictate whether Shiprocket achieves consolidated operating profitability."
    claimRefs:
      - "CI005"
      - "CI008"
