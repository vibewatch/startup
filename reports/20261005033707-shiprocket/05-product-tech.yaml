callouts:
  - calloutType: "strength"
    title: "Aggregated Network Scale and Algorithmic Carrier Orchestration"
    body: "Shiprocket's primary technological moat stems from its deep API integration across 42+ courier networks and nationwide coverage of 19,000+ pin codes. By abstracting fragmented logistics providers behind a unified recommendation engine (CORE), the platform allows small and mid-sized merchants to access enterprise-grade multi-carrier routing without negotiating individual bilateral contracts."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
  - calloutType: "risk"
    title: "Upstream Operational Blindspots in Warehouse and Inventory Control"
    body: "Because Shiprocket's architecture operates at the shipment creation layer rather than the holistic order management layer, it lacks native warehouse management capabilities (bin tracking, barcode scanning, location-sorted picklists) and cross-channel inventory synchronization. Scaling brands exceeding 1,000 monthly orders face overselling risks and often require third-party OMS/WMS platforms, relegating Shiprocket to a pure last-mile execution carrier."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE014"
      - "CE015"
