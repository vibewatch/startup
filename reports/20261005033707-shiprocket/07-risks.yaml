chapter:
  number: 7
  title: "Risks"
  summary: "Shiprocket faces severe courier partner volume concentration with top five partners handling 84.50% of shipments, persistent consumer review polarization (1.7/5 on Trustpilot) over delivery delays and disputed COD fees, and ongoing operating losses in emerging expansion lines (-24.3% adjusted EBITDA margin in Q1 FY27). Regulatory and litigation exposures across criminal complaints, director impleadments, and first-loss default guarantee (FLDG) lending commitments require structured governance oversight from the Board's Risk Management Committee."
sections:
  - id: "regulatory-and-legal-risk"
    title: "Regulatory Compliance, Licensing, and Pending Litigation"
    body: "Shiprocket operates under an evolving regulatory and legal framework governing Indian e-commerce enablement, multi-carrier transport aggregation, digital personal data protection, and capital facilitation. While Shiprocket has converted into a public limited company (Shiprocket Limited) with shares listed on BSE and NSE following its August 2026 IPO, it remains exposed to outstanding legal proceedings at multiple adjudicatory levels. Outstanding litigation detailed in its Red Herring Prospectus includes a criminal complaint in Panchkula regarding withheld merchant shipping credits (Connecting Foot Craft), a police investigation in Bengaluru regarding 56,793 allegedly unaccounted inventory units valued up to ₹85.19 million in its warehousing operations (Jagath Bhasi), and proceedings initiated by Blue Line Logistics and Warehousing LLP against the company, executive directors, and the CFO. In addition, an FIR registered in Amravati in August 2025 named company owners in connection with dangerous weapons delivered through third-party courier partner Blue Dart, prompting CEO Saahil Goel to file a quashing petition before the Bombay High Court. Beyond active disputes, Shiprocket has entered digital financial services via a pilot program providing a capped first-loss default guarantee (FLDG) to NBFC lending partners of up to ₹200.00 million (subject to a 5% portfolio cap under RBI Digital Lending Directions). Although statutory authorities have issued no material civil or tax penalties to date, expanding regulatory obligations under data protection and digital lending norms create material residual compliance friction."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR014"
    tableRefs:
      - "TR001"
    figureRefs:
      - "FR001"
  - id: "operational-and-dependency-risk"
    title: "Operational Reliability, Courier Concentration, and Platform Quality"
    body: "Operational resilience at Shiprocket is fundamentally constrained by its structural dependence on external logistics infrastructure and severe carrier concentration. As an asset-light aggregator, the company contracts with 42 active courier partners on an independent contractor basis without exclusive service commitments. Volume data disclosed in statutory filings reveals extreme concentration: the top five courier partners accounted for 84.50% of total shipment volume (149.13 million shipments) in Fiscal 2026, slightly increasing from 83.33% in Fiscal 2025 and 83.38% in Fiscal 2024. This oligopolistic carrier reliance limits Shiprocket's bargaining leverage on freight procurement margins and exposes merchants to carrier prioritization during peak festive periods. Operational execution is further strained by service quality friction: independent review analysis reveals dramatic sentiment polarization, evidenced by a 1.7/5 Trustpilot rating alongside a 3.7/5 GetApp rating. Dominant negative feedback across merchant forums documents recurring parcel delivery delays, fake delivery attempts, lost shipments, and non-delivery report (NDR) tracking failures. In its physical fulfillment vertical, Shiprocket operates 13 leased fulfillment centres (762,826 square feet) alongside 5 customer-owned and 11 third-party facilities, leaving the company vulnerable to lease escalation and warehouse inventory reconciliation disputes. While Shiprocket deploys machine learning models such as Sense for address validation and automated return-to-origin (RTO) reduction, execution gaps between software routing and physical courier delivery remain an acute operational vulnerability."
    claimRefs:
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR015"
    tableRefs:
      - "TR002"
      - "TR003"
  - id: "financial-and-governance-risk"
    title: "Financial Exposure, Emerging Bets Margin Dilution, and Governance Oversight"
    body: "Shiprocket's financial trajectory reflects substantial top-line expansion offset by persistent net losses and emerging vertical investment burn. The company recorded restated net losses of ₹792.45 million in Fiscal 2026, ₹744.49 million in Fiscal 2025, and ₹5,951.81 million in Fiscal 2024. While consolidated net loss narrowed to ₹13.7 crore in Q1 FY27, its emerging business—comprising marketing technology (martech), omnichannel dark stores, and cross-border shipping (ShiprocketX)—remains unprofitable, generating an adjusted EBITDA margin of negative 24.3% despite 70% YoY top-line growth. Customer acquisition costs (CAC) for core shipping increased 13.5% YoY to ₹3,560 in Q1 FY27, while blended platform CAC climbed to ₹6,429, highlighting mounting marketing expenses required to sustain merchant onboarding. Furthermore, total short-term borrowings stood at ₹2,420.12 million as of March 31, 2026. In cross-border operations, exporters navigating full container load (FCL) freight face global port congestion, demurrage charges, and capacity bottlenecks, which depress international logistics realization. To oversee these multifaceted operational, credit, cyber, and legal exposures, the Board of Directors constituted a Risk Management Committee (RMC) chaired by Independent Director Chetan Kumar Mathur, which reviews risk mitigation policies, ALM controls, and chief risk officer recommendations pursuant to SEBI Listing Regulations. Governance vigilance is paramount as the company navigates public market scrutiny following its primary listing."
    claimRefs:
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR016"
