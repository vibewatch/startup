callouts:
  - calloutType: "risk"
    title: "Structural Margin Vulnerability in Courier Partner Volume Concentration"
    body: "With 84.50% of Shiprocket's parcel shipment volume concentrated across just five active courier partners in Fiscal 2026, the company operates under perpetual margin risk. Because arrangements with 3PL partners are non-exclusive, carriers can prioritize proprietary volumes, raise base freight tariffs, or impose restrictive SLA conditions during peak e-commerce quarters. Multi-carrier routing algorithms provide software flexibility, but physical last-mile execution remains hostage to carrier capacity."
    claimRefs:
      - "CR006"
      - "CR007"
  - calloutType: "insight"
    title: "Governance Architecture via Board Risk Management Committee"
    body: "Shiprocket has established a formalized governance framework to manage public company risk, constituting a dedicated Risk Management Committee under SEBI Listing Regulations. Led by Independent Director Chetan Kumar Mathur, the committee oversees cybersecurity, asset-liability matching (ALM), operational resilience, and credit exposure from the FLDG lending pilot, providing critical institutional counterweight to rapid operational scaling."
    claimRefs:
      - "CR004"
      - "CR013"
