      - [Temasek, "Historical institutional investor", "Current holding and control not established", "Reconcile post-IPO ownership, lockups, and information rights"]
      - [Bertelsmann India Investments, "Historical institutional investor", "Current holding and control not established", "Confirm current ownership and any governance rights"]
      - [Lightrock, "Historical institutional investor", "Current holding and control not established", "Confirm current ownership and any governance rights"]
      - [Info Edge Ventures, "Historical institutional investor", "Current holding and control not established", "Confirm current ownership and any governance rights"]
    notes: >-
      This is a partial map of repeatedly named historical backers, not a
