callouts:
  - calloutType: strength
    title: Public-market transition is now complete
    body: >-
      The assigned evidence places Shiprocket on NSE and BSE from August 2026,
      replacing the prior pre-IPO stage framing.
    claimRefs: [CO011]
  - calloutType: risk
    title: Growth and profitability diverge
    body: >-
      Emerging-business revenue grew 70% year over year in Q1 FY2027, but the
      segment still posted a negative 24.3% adjusted EBITDA margin.
    claimRefs: [CO015, CO016]
