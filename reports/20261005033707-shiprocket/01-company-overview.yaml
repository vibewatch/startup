      - [Domestic reach, "19,000+ unique pin codes (company claim)", "Current page reviewed 2026-10-05", Low, "Service-level coverage by product not disclosed"]
      - [International reach, "220+ countries and territories (company claim)", "Current page reviewed 2026-10-05", Low, "Shipment volume by corridor not disclosed"]
      - [Revenue from operations, "INR 2,024 crore", "FY2026", Medium, "Not ARR or a current annualized run rate"]
