artifact: company-overview
slug: shiprocket
runDate: 2026-10-05
company:
  name: Shiprocket
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Shiprocket has evolved from the 2012 Kartrocket storefront product into a
    listed, Delhi-headquartered commerce-enablement platform spanning shipping,
    fulfilment, cross-border trade, checkout, marketing, and financial tools.
    Public scale and FY2026 operating metrics are substantial, but cumulative
    funding, current ownership, board composition, headcount, and current market
    valuation remain insufficiently reconciled in the assigned evidence.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Shiprocket traces its operating history to the 2012 launch of Kartrocket,
      initially intended to help small merchants establish digital storefronts.
      The business is now headquartered in Delhi and positions itself as an
      end-to-end commerce-enablement platform for MSMEs, direct-to-consumer
      brands, and larger retailers. Its offer is broader than parcel
      aggregation: the assigned sources describe domestic shipping,
      fulfilment, cross-border logistics, checkout, marketing technology,
      omnichannel tools, and financial services. This breadth creates several
      ways to monetize a merchant relationship, generally through usage tied to
      shipments or transactions, but it also makes segment economics and
      product-level adoption important diligence questions rather than treating
      Shiprocket as a single-product logistics company.
    claimRefs: [CO001, CO002, CO003]
    tableRefs: [TO001]
  - id: scale-and-operating-shape
    title: Scale and operating shape
    body: >-
      Shiprocket's own site claims more than 4 lakh businesses or sellers,
      nationwide coverage across more than 19,000 unique pin codes, and reach
      across more than 220 countries and territories. These are company-issued
      reach measures, not independently audited active-customer counts. The
      latest independent operating evidence in the assigned pool reports Q1
      FY2027 revenue from operations of INR 592.1 crore and emerging-business
      revenue of INR 180.4 crore, up 70% year over year. The emerging segment
      nevertheless remained loss-making at a negative 24.3% adjusted EBITDA
      margin, so rapid adjacency growth should not be read as segment
      profitability or as proof that all registered sellers are active,
      revenue-generating merchants.
    claimRefs: [CO004, CO005, CO006, CO015, CO016]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Saahil Goel remains the most visible executive in the available evidence:
      his public profile identifies him as managing director and chief
      executive, while IPO-oriented coverage identifies him as a co-founder.
      The same coverage names Vishesh Khurana as a co-founder, but the assigned
      sources do not establish his current operating remit, the complete
      executive team, committee structure, or a current board roster. This
      evidence supports founder continuity but not a conclusion that governance
      depth or succession planning is adequate. The combination of founder and
      chief-executive roles makes delegation, board independence, executive
      retention, and succession materials priority requests for investor
      diligence.
    claimRefs: [CO007]
    tableRefs: [TO002, TO003]
  - id: capital-history-and-public-transition
    title: Capital history and public-market transition
    body: >-
      Shiprocket completed its transition to the public market in August 2026,
      with Economic Times coverage and the chief executive's own account both
      describing an NSE and BSE listing. The IPO structure separated INR 885.50
      crore of fresh capital from roughly INR 722-732 crore of offer-for-sale
      proceeds; the latter accrued to selling shareholders rather than the
      company. Funding history before the IPO is not fully reconciled: one
      independent source reports more than USD 320 million raised, while a
      tracker totals USD 336.1 million and also displays inconsistent summary
      metadata. FY2026 revenue from operations was reported at INR 2,024 crore,
      yet the company remained loss-making, with FY2026 loss after tax of INR
      79.25 crore. Capital raised, fresh IPO proceeds, accounting loss, and
      current cash availability are therefore distinct measures and should not
      be substituted for one another.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO013, CO014]
    figureRefs: [FO001]
