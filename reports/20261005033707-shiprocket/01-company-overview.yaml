  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: cumulative-funding
      missingEvidence: >-
        Audited financing schedule reconciling gross primary capital, secondary
        transactions, debt, currency conversion, and the USD 320 million versus
        USD 336.1 million public totals.
      whyItMatters: >-
        Total capital raised is not cash available, but the reconciled history
        is needed to assess dilution, capital efficiency, and investor entry
        prices.
      diligencePath: >-
        Obtain the prospectus financing history, statutory allotment records,
        and a company-certified pre-IPO capitalization table.
      relatedQuestionRefs: [QO003]
    - type: enumeration-incomplete
      severity: material
      topic: governance-and-ownership
      missingEvidence: >-
        Complete current executive roster, board and committee composition,
        founder responsibilities, post-IPO ownership, lockups, and investor
        governance rights.
      whyItMatters: >-
        The partial founder and investor lists cannot establish succession
        readiness, board independence, control, or present economic exposure.
      diligencePath: >-
        Review current exchange filings, the final prospectus, board charters,
        employment agreements, and the latest beneficial-ownership register.
      relatedTableRefs: [TO002, TO003]
    - type: missing-source
      severity: material
      topic: cover-metrics
      missingEvidence: >-
        Current market capitalization, diluted share count, employee headcount,
        active paying merchant count, physical location count, and unrestricted
        cash after IPO uses.
      whyItMatters: >-
        These figures are necessary to distinguish registered reach from active
        scale and to assess capitalization and operating capacity at the run
        date.
      diligencePath: >-
        Obtain current exchange data, the latest filed quarterly statements,
        HRIS extracts, active-merchant cohort reports, and the post-offer cash
        bridge.
      relatedQuestionRefs: [QO004, QO007]
      relatedTableRefs: [TO001]
    - type: missing-source
      severity: minor
      topic: milestone-completeness
      missingEvidence: >-
        Primary documentation for acquisitions, material partnerships,
        regulatory milestones, leadership changes, and adverse operating events.
      whyItMatters: >-
        The timeline currently emphasizes product origin, financing, and
        listing milestones and should not be treated as a complete corporate
        chronology.
      diligencePath: >-
        Reconcile exchange announcements, statutory filings, acquisition
        agreements, board minutes, and incident registers.
      relatedQuestionRefs: [QO005]
