  topStrengths:
    - Public listing validates the business model and crystallizes a liquid valuation benchmark.
    - Merchant scale is large, and the product surface spans shipping plus higher-frequency adjacent tools.
    - Emerging products are growing quickly, suggesting meaningful cross-sell potential if monetization improves.
  topRisks:
    - Emerging segments remain loss-making and consolidated profitability is still not proven.
    - Customer-acquisition cost and courier dependence can compress economics if growth slows or pricing tightens.
    - Historical funding, ownership, and governance details remain only partially reconciled in public evidence.
  unresolvedGaps:
