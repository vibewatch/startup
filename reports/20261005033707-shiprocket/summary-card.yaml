      Exact cap-table and cumulative funding reconciliation remain unresolved across public databases and secondary
      summaries.
    - Product-level gross margin, contribution margin, and retention by segment are still undisclosed.
    - Merchant churn, NRR, and cohort economics remain opaque enough to limit confidence in long-run monetization.
    - >-
      Board composition, succession depth, and current ownership rights after the public listing are not fully
      established.
