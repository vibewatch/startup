      - number: '5.2'
        title: 商业栈扩张与 AI 平台能力
        blocks:
          - type: paragraph
            body: >-
              为了在更广泛的商户生命周期中获取更高的钱包份额，Shiprocket 已从标准国内运输积极扩展到营销技术、一键结账、跨境物流和资本赋能 [CE006, CE007]。新兴产品包括 fastrr
              Checkout——旨在把结账完成时间降至 40 秒以内的一键结账机制——以及面向 WhatsApp 营销自动化的 fastrr Identify [CE007]。公司还运营跨境运输产品 ShipX 和
              CargoX，以及 Shiprocket Capital 和信用画像工具 [CE007]。这些新兴软件推动收入快速增长，Q1 FY27 同比增长 70% 至 ₹180.4 crore，其中营销技术收入增长
              193% [CE008]。在数据和机器学习层，公司部署了 Sense 等自研模块：Sense 是一个 AI API，靠自动地址验证和自动填充降低退货至发货地（RTO）率；另有用于市场情报的 Trends
              [CE007, CE009]。Shiprocket 称其利用覆盖 15 crore 消费者、长达十年的消费行为数据，网络中 93% 的结账地址会自动填充 [CE009]。但这套新兴业务栈的调整后 EBITDA
              仍为亏损，需要核心配送利润持续补贴 [CE008]。
