              - CM012
      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              实际切入买方通常是对配送可靠性和成本负责的商户运营者，日常用户则分布在运营、仓储、客服和增长团队。付款方是商户实体，但随着产品采用增加，预算可能从物流运营转向商业软件或营销。这一角色划分是根据产品来源作出的分析推断，并非公司披露的采购研究。可观察的采用路径通常从重复发生的配送流程开始，再延伸到履约、结账、全渠道、营销技术或跨境服务。Inc42
              报道 Q1 FY27 商户网络为 2.22 lakh，但核心商户中只有 8.8% 使用了新兴产品。因此，比起宽泛的市场规模标题，如何把装机基础转化为多产品用户更关键。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 采用驱动、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              D2C 订单增长、大都市以外的需求、商户外包，以及在多家承运商之间做选择的运营复杂性，都在推动采用。Shiprocket
              无需拥有车队，只要把相邻工具嵌入高频配送流程，就有机会捕获更多商户支出。约束同样明显：官方移动数据呈现急剧的季节性下滑；Inc42 称新兴产品虽快速增长却仍在亏损；Outlook Business
              报道，商户解决方案成本占 FY26 费用的 69.39%，前十大供应商占 55.24%。历史上的承运商涨价也说明供应商拥有议价能力。因此，估值应锚定商户留存、实际费率、贡献利润率和盈利性交叉销售，而不是锚定
              Shiprocket 并不确认为收入的商品交易总额或宽泛电商预测。
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 图表与要点
        blocks:
          - type: callout
            title: 顺风因素不等于 Shiprocket 的 TAM
            body: D2C、小城市和快速商业的增长会扩大商户物流需求，但现有留存来源没有披露将这些渠道估算转化为公司收入机会所需的实际费率或符合条件的货件池。
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
          - type: callout
            title: 供应商议价能力可能吞噬市场增长
            body: 供应商集中、非独家物流关系和历史承运商涨价意味着，货件增长未必能按比例转化为贡献利润率。
            calloutType: risk
            claimRefs:
              - CM014
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与多品类动态
        blocks:
          - type: paragraph
            body: >-
              Shiprocket 位于印度不断扩张的电商物流和赋能市场的关键聚合位置，该市场 2026 年估计约为 USD 7.25 billion，预计到 2031 年扩大至 USD 11.14
              billion。但竞争格局远非单一：Shiprocket 既要面对一体化快递商，也要面对纯物流管理软件。NimbusPost、Shipyaari 等直接配送聚合商在基础价格上激烈竞争；WareIQ 等专业 3PL
              提供多城市暗仓和深度仓储网络。与此同时，ClickPost 等企业级配送管理 SaaS 面向成熟 D2C 品牌，支持直接接入承运商 API，完全绕开聚合商加价。Delhivery 等一体化承运商以及
              Shadowfax 等高速增长的物流运营商也在扩展直达消费者和超本地服务，使竞争从基础承运商费率套利转向对商户多触点工作流的控制。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
