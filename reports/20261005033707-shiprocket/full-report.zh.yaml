      - number: '8.2'
        title: IPO 结构、定价现实与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Shiprocket 于 2026 年 8 月 IPO，募资 ₹1,617.59 crore（$170 million），发行价区间为每股 ₹92–₹97；首个交易日结束时，公司估值约 ₹7,000
              crore（投后 $1.1 billion）。交易包括 ₹885 crore 新发一级股权，用于技术升级、平台扩张和偿债，另有早期机构投资者出售 ₹732 crore 老股。此次上市价格较 2022–2024
              年独角兽融资高峰期的 $1.21B–$1.30B 私募估值标记略有折让，迫使公开市场参与者接受估值纪律。首日交易中，Shiprocket 股价较发行价上涨 48%，机构投资者包括 SBI Mutual
              Fund、HDFC Mutual Fund 和 Goldman Sachs 等大型资管机构，长期锚定投资者 Bertelsmann India Investments 仍持有约 19% 股份。按 FY26
              收入运行率计算，当前交易倍数约为 5.5x，介于高增长纯 SaaS 平台和资本密集型上市配送商之间。当前价格下的入场纪律要求严格跟踪季度盈利进展，以及软件变现能否提升整体抽成率。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: 情景分析、下行风险与尽调要求
        blocks:
          - type: paragraph
            body: >-
              Shiprocket 的远期估值取决于三个关键运营变量：新兴业务调整后 EBITDA
              利润率扩张速度、核心配送网络可持续的有机交易增长，以及获客成本纪律。乐观情景下，营销技术和结账产品在商户基础中的快速采用会把新兴收入占比推过 40%，推动综合收入接近 ₹3,200 crore，并在 FY28
              前将调整后 EBITDA 转化为正的 GAAP 经营利润。在这一轨迹下，市场若给予软件式毛利率画像的奖励，企业估值可能扩大至 ₹11,500
              crore（$1.38B）。反之，若承运商同时提高批发价或扩展竞争性的自助聚合工具，Shiprocket 的抽成率会被挤压，而新兴营销技术在商户中的采用停滞，悲观情景就会出现。核心配送 CAC 在 Q1 FY27
              同比上升 13.5% 至 ₹3,560；若经营杠杆未能实现，公司可能陷入持续的季度亏损。首要尽调应聚焦营销技术产品的 cohort 贡献利润率、与主要配送商签订的合同最低货量承诺，以及历史诉讼的确切解决时间表。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV011
