              - CO011
              - CO013
      - number: '1.2'
        title: 规模与运营结构
        blocks:
          - type: paragraph
            body: >-
              Shiprocket 官网自称服务超过 4 lakh 家企业或卖家，覆盖全国 19,000 多个独立 PIN 码，并触达 220
              多个国家和地区。这些是公司口径的覆盖范围，并非独立审计的活跃客户数。指定资料池中最新的独立运营证据显示，Q1 FY2027 经营收入为 INR 592.1 crore，新兴业务收入为 INR 180.4
              crore，同比增长 70%。但新兴分部调整后 EBITDA 利润率仍为负 24.3%，处于亏损状态；因此，邻近业务的快速增长不能解读为分部已经盈利，也不能证明所有注册卖家都是活跃且产生收入的商户。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO015
              - CO016
      - number: '1.3'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              现有证据中最具代表性的管理者仍是 Saahil Goel：其公开资料显示他担任董事总经理兼首席执行官，围绕 IPO 的报道则称其为联合创始人。同一报道将 Vishesh Khurana
              列为联合创始人，但指定来源没有说明他当前的运营职责，也没有交代完整管理团队、委员会架构或最新董事会名单。这些证据支持创始人团队延续，却不足以证明治理深度或继任规划已经充分。创始人与 CEO
              角色合一，使授权、董事会独立性、高管留任和继任安排成为投资尽调的优先索取材料。
            claimRefs:
              - CO007
