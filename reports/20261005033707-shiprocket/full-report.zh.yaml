              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
              - CP013
      - number: '3.2'
        title: 竞争者架构、能力与运营取舍
        blocks:
          - type: paragraph
            body: >-
              印度电商履约的商户选择，取决于运营控制、资本支出和上线速度之间的结构性取舍。Shiprocket 的核心价值是无需预先承诺最低货量或逐一谈承运商，就能即插即用地使用多承运商配送，因此成为早期 SMB 和新兴
              D2C 品牌的默认工具。相反，数字品牌规模扩大后，会因聚合商的追踪更新延迟、承运商分配 SLA 的波动，以及货到付款（COD）回款融资费高而遇到摩擦。ClickPost 等企业级物流 SaaS 则支持直接控制
              700 多个承运商 API，通过自动轮询和 webhook 追踪，让拥有自有承运商合同的大货量商户绕过聚合商中间环节。WareIQ 则通过覆盖印度的履约中心和符合 Seller Flex
              及平台标准的暗仓，解决实体履约瓶颈，并提供 AI 驱动的库存放置和退货至发货地（RTO）保护。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP013
      - number: '3.3'
        title: 定价架构、利润率挤压与护城河韧性
        blocks:
          - type: paragraph
            body: >-
              定价透明度和利润率能否守住，是决定商户切换行为的主要分水岭。Shiprocket 采用混合模式：平台订阅从免费的 Lite 档到每月 ₹799 的 Pro 方案不等，并叠加按使用量计费的运费；国内每票 500
              克货件平均 ₹36–₹45，另收 COD 费用，快速结算的高级提前回款费最高可达 5%。当竞争聚合商把基础运费压低、将每 500 克起价宣传到 ₹19–₹28 时，Shiprocket
              的纯物流聚合业务面临结构性利润率压力。为抵御商品化并减少商户流失，公司加快拓展结账、以 WhatsApp 为中心的营销工具、跨境服务（ShipX/CargoX）和仓储履约等商户服务。但新兴业务在 Q1 FY27
              收入同比增长 70% 的同时，调整后 EBITDA 利润率仍为负 24.3%；公司一边守住核心配送利润率，一边为 SaaS 和营销技术扩张提供资金，长期竞争护城河因此仍暴露于执行风险。
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP011
              - CP012
      - number: '3.4'
        title: 图表与要点
        blocks:
          - type: callout
            title: 聚合商悖论与上游脆弱性
            body: >-
              轻资产模式让 Shiprocket 无需承担实体车队资本开支即可获得巨大运营规模，但也使平台暴露于两面夹击：承运商集中（五家承运商处理超过 80%
              的货量）和客户成熟后离开。大货量商户转向直接签约承运商，越来越多采用 ClickPost 等纯 SaaS 平台；对价格敏感的商户则尝试零订阅费聚合商，迫使 Shiprocket 演进为一体化商业操作系统。
            calloutType: insight
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP014
          - type: callout
            title: 新兴服务拖累综合利润率
            body: >-
              Shiprocket 核心配送平台的调整后 EBITDA 利润率为 12.8%–13%，而其结账、跨境、全渠道和营销技术等新兴业务在 Q1 FY27 的调整后 EBITDA 利润率为负 24.3%。新兴服务
              70% 的快速收入增长，必须先实现经营杠杆，否则配送聚合竞争加剧会侵蚀公司的核心盈利缓冲。
            calloutType: risk
            claimRefs:
              - CP014
              - CP015
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与定价架构
        blocks:
          - type: paragraph
            body: >-
              Shiprocket 的收入主要来自两个报告分部：核心物流赋能，以及新兴多渠道商业服务。在核心物流业务中，公司是轻资产聚合商，将 D2C 品牌、独立零售商和 MSME 接入覆盖 19,000–26,000 个
              PIN 码的 42 家承运商网络。核心变现主要依靠按票收费：国内包裹配送 500 克起价 INR 20，B2B 大宗货运每公斤起价 INR 6，并按交易量收取浮动平台费率。除交易型配送费外，公司还按月收取
              $24–$36 的软件订阅费，用于高级路由、分析和自动化功能。新兴业务在 Q1 FY27 已占总收入的 30%，其中营销技术收入同比增长 193%，全渠道和大宗 B2B 暗仓履约收入同比增长
              92%。但新兴产品每笔交易的实际变现目前低于核心配送聚合，因此收入增长仍依赖处理量，而非固定的软件合同。
