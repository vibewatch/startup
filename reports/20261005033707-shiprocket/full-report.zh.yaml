  - id: FI001
    title: Shiprocket 商业流程与交易变现引擎
    type: flow
    summary: 可视化呈现商户交易流程：从店面接单，到物流路由、增值变现和现金创造。
    data:
      nodes:
        - id: merchant-order
          label: 商户接单
          note: 订单通过 D2C 网站或社交商务生成
        - id: checkout-martech
          label: Fastrr Checkout 与 AI 营销科技
          note: 地址自动填充、支付优化与欺诈评分
        - id: carrier-routing
          label: 动态 3PL 路由
          note: AI 在 42 家物流合作伙伴中匹配承运商
        - id: fulfillment-delivery
          label: 履约与末端配送
          note: 仓库拣货打包、B2B 货运与包裹运输
        - id: revenue-settlement
          label: 收入获取与 COD 汇款
          note: 交易抽成率、订阅费与增值利润
        - id: operating-cash-flow
          label: 经营现金流与 EBITDA
          note: 每完成一笔交易产生 INR 1.50 的 EBITDA
      edges:
        - from: merchant-order
          to: checkout-martech
          relationship: 发起
        - from: checkout-martech
          to: carrier-routing
          relationship: 传递已验证订单
        - from: carrier-routing
          to: fulfillment-delivery
          relationship: 派送至快递网络
        - from: fulfillment-delivery
          to: revenue-settlement
          relationship: 触发计费与 COD 收款
        - from: revenue-settlement
          to: operating-cash-flow
          relationship: 产生增量利润
    approximationNotes: 流程架构按管理层业绩电话会记录及官方平台文档披露的运营顺序建模。
    claimRefs:
      - CI001
      - CI003
      - CI007
      - CI008
  - id: FE001
    title: Shiprocket 平台技术栈与商业运营架构
    type: stack
    summary: 多层架构图展示 Shiprocket 的五个主要功能层，覆盖商户界面、智能引擎、测试和承运商网络。
    approximationNotes: 架构层来自公开工程出版物、API 规范和对比系统评估。
    data:
      layers:
        - label: 商户体验与开发者集成层
          detail: 覆盖网页仪表盘、SDK 和购物车的全渠道客户界面与开发者集成
          modules:
            - 商户仪表盘与分析
            - fastrr Checkout 网页 SDK
            - 开发者 API（Node、PHP、React、Laravel、Angular）
            - 250+ 生态合作伙伴插件
        - label: 商业应用与营销技术层
          detail: 通过增值商户应用加速结账、提升 WhatsApp 互动并支持全球化
          modules:
            - fastrr Identify（WhatsApp 营销）
            - Shiprocket Promise（EDD 与信任徽章）
            - ShipX 与 CargoX 跨境支持
            - Shiprocket Capital 与信用评分
        - label: 物流智能与优化层
          detail: 用算法决策引擎优化承运商路由并降低欺诈风险
          modules:
            - CORE（快递推荐引擎）
            - Sense AI 地址清洗与 RTO 预测
            - Shiprocket Trends 市场情报
        - label: 质量工程与平台韧性层
          detail: 自动化测试与 QA 微服务基础设施，确保平台可靠性
          modules:
            - Java Spring Boot API 网关
            - Python AI 处理服务
            - LangChain 提示词与工作流编排器
            - Qdrant 向量数据库语义测试存储
        - label: 订单与运单路由层
          detail: 订单接入与派送编排，管理面单生成和承运商分配
          modules:
            - 订单确认接入网关
            - 自动生成 AWB 与运输面单
            - 费率计算器与配送时间估算器
        - label: 物理网络执行与承运商结算层
          detail: 集成端点将数字运单接入实体承运商网络并完成财务结算
          modules:
            - 42+ 多承运商 EDI 集成
            - NDR（未妥投报告）自动化
            - COD 对账与汇款引擎
    claimRefs:
      - CE001
      - CE002
      - CE007
      - CE010
      - CE012
  - id: FU001
    title: 商户采用与扩张路径
    type: journey-map
    summary: 变现路径从低门槛获客开始，通过重复发货深化使用，再扩展到更高价值的商业工具。
    data:
      nodes:
        - id: discover
          label: 发现
          detail: SMB、D2C、社交、线下和全渠道商户通过数字及辅助渠道接触 Shiprocket。
          touchpoints:
            - Search and content
            - Product demo
            - Seller events
        - id: evaluate
          label: 评估
          detail: 创始人、运营人员、财务团队和采购相关方比较工作流适配度、价格、集成能力与服务质量。
          touchpoints:
            - Reviews
            - Case studies
            - Multi-stakeholder approval
        - id: onboard
          label: 入驻
          detail: 商户注册，完成适用的 KYC，接入渠道，并配置配送或结账。
          touchpoints:
            - Self-serve signup
            - KYC
            - Storefront integration
        - id: transact
          label: 使用核心配送
          detail: 商户通过国内配送及相关订单后流程处理订单。
          touchpoints:
            - Courier selection
            - Tracking
            - COD and reconciliation
        - id: retain
          label: 重复使用并扩张
          detail: 交易队列和 Power Merchant 定义用于追踪更深度的使用，但账户流失率尚未披露。
          touchpoints:
            - Repeat transactions
            - Support
            - Key-account management
        - id: expand
          label: 采用新兴产品
          detail: 结账、营销技术、全渠道、跨境、履约、资本和支付扩大产品覆盖面。
          touchpoints:
            - Cross-sell
            - Payment enablement
            - International expansion
    approximationNotes: 该顺序综合了已披露的商户工作流；不代表已测量的阶段间转化率，也不代表所有阶段属于同一队列。
