      - 核心风险与下行触发因素
      - 概率
    rows:
      - - 乐观情景
        - 营销科技同比增长 >100%；新兴分部占总收入达到 45%；合并 EBITDA 在 Q3 FY27 转正。
        - ₹3,400 Cr 收入（$410M）；4.0x EV / sales 倍数。
        - 隐含市值 ₹13,600 Cr（$1.64B）；较 $1.1B IPO 基准上涨 +49%。
        - 垂直 SaaS 玩家激进降价竞争；监管限制运输附加费。
        - 25%
      - - 基准情景
        - 核心运输同比增长 20-22%；新兴分部同比增长 40-50%；合并 EBITDA 在 FY28 盈亏平衡。
        - ₹2,800 Cr 收入（$337M）；3.2x EV / sales 倍数。
        - 隐含市值 ₹8,960 Cr（$1.08B）；收益整合带来持平至温和 +5% 的回报。
        - 核心运输 CAC 上升；商户转向付费营销科技工具的速度放缓。
        - 55%
      - - 悲观情景
        - 快递合作方提高基础运费；跨境业务持续收缩；新兴业务年度亏损维持在 >₹100 Cr。
        - ₹2,200 Cr 收入（$265M）；2.0x EV / sales 倍数。
        - 隐含市值 ₹4,400 Cr（$530M）；倍数降至物流运营商水平，带来 -52% 下行。
        - 主要承运商去中介化；大卖家层严重流失。
        - 20%
    notes: 情景以约 83 的 INR / USD 汇率测算 FY28 预测；估值倍数参照已上市印度科技可比公司校准。
    claimRefs:
      - CV006
      - CV011
      - CV012
      - CV015
      - CV016
