            body: >-
              由于 Shiprocket 的架构运行在创建货件层，而不是完整的订单管理层，因此它缺少原生仓库管理能力（库位追踪、条码扫描、按位置排序的拣货单）和跨渠道库存同步。每月订单超过 1,000
