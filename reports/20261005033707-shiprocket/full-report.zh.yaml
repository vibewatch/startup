  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Shiprocket
              的相关市场比整个印度物流市场更窄，但又不止于包裹费率聚合。核心边界是：为需要选择并协调第三方承运商的商户提供软件驱动的商业基础设施；相邻支出包括履约、结账、营销工具、跨境服务和金融工具。Shiprocket
              自身的产品界面覆盖这些类别，独立报道则将其描述为商户与碎片化配送网络之间的一层。除非 Shiprocket
              直接从中获得收入，否则承运商车队所有权、平台消费者需求、广告媒体、商品交易总额、关税和贷款方资产负债表都不应计入市场边界。现有替代方案包括直接签约承运商、平台物流、电子表格和人工运营，以及自建物流栈；最后一种对大型零售商比对小卖家更可行。
            claimRefs:
              - CM009
              - CM010
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM009
              - CM010
              - CM015
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              证据显示需求环境有利，但无法得出一个可审计的 TAM。Economic Times 援引 20%–25% 的印度电商 CAGR，预计持续至 2030 年；其引用的 Unicommerce 衍生 D2C
              估算显示，当前规模为 $10–12 billion，2030 年可能达到 $60 billion。另一份 Equirus 口径称，2026 年数字商业规模为 ₹8 lakh crore，快速商业为 ₹1.08
              lakh crore，同比增长 40%。这些数字的币种、范围、日期和方法不同，不能相加，也不能直接视为 Shiprocket 可获得的收入。更有用的运营信号是，据报道 Tier-2 和 Tier-3 城市贡献了
              FY26 新 D2C 订单的 66%；但 Shiprocket 自有移动商业数据也显示出季节性和原因不明的 2 月低谷。公开股权价值同样是估值结果，不是市场规模。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM006
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
