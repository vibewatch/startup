      - number: '4.3'
        title: 成本结构、资本充足性与尽调结论
        blocks:
          - type: paragraph
            body: >-
              Shiprocket 的成本结构主要由直接购买 3PL 运力的义务、获客费用，以及覆盖 1,500 名员工的不断扩张的产品工程开支构成。2026 财年，公司净资产为 INR 15,242.89
              million，年度会计亏损为 INR 792.45 million；FY25 亏损为 INR 744.49 million。Q1 FY27 净亏损同比收窄 24%，从 INR 18.0 crore 降至 INR
              13.7 crore。经营亏损仍高度集中在新兴业务，后者 Q1 FY27 调整后 EBITDA 利润率为负 24.3%。资本充足性方面，公司通过 2026 年 8 月在 BSE 和 NSE 进行的 IPO
              大幅补充流动性，募资总额为 INR 1,617.48 crore（相当于 $195M 以上），包括 INR 885.50 crore 新股发行（9.13 crore 股，每股 ₹97）和 INR 731.98
              crore 老股出售。管理层指定新募资金用于技术基础设施、平台营销、偿债和潜在的无机收购。尽调应重点评估承运商费率重新谈判、COD
              回款预付带来的营运资本敞口、新兴分部执行风险，以及商户持续投诉其所称的包裹损坏索赔问题。
            claimRefs:
