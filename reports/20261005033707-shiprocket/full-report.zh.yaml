      - number: '4.2'
        title: 单位经济与 GTM 效率
        blocks:
          - type: paragraph
            body: >-
              Shiprocket 的单位经济显示，成熟核心配送业务已有明确的经营杠杆，但新兴产品仍在早期阶段并稀释利润率。就平台整体而言，单笔交易调整后 EBITDA 从 Q1 FY26 的 INR 0.22 增至 Q1
              FY27 的 INR 1.50，受 3PL 承运商采购费率压缩和过去 12 个月 216 million 笔交易的更高密度推动。Q1 FY27 综合贡献利润率同比增长 43%，新兴业务达到
              15.3%，核心物流也有所扩张。但销售效率指标显示压力上升：核心配送 CAC 在 Q1 FY27 同比增长 13.5% 至 INR 3,560，整体混合 CAC 达 INR 6,429（FY26 为 INR
              5,829.67，FY25 为 INR 5,742.33）。Power Merchant 的平均收入从 INR 15.0 lakh 升至 INR 18.7 lakh，但其绝对数量从 10,282 略降至
              10,170。Shiprocket 正通过向 2.22 lakh 活跃商户交叉销售 Fastrr 一键结账和自动 WhatsApp 营销等工具来应对获客成本上升，交叉销售渗透率也从 7.3% 提升至 8.8%。
