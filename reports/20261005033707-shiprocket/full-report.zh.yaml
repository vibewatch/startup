  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管合规、许可与未决诉讼
        blocks:
          - type: paragraph
            body: >-
              Shiprocket 处在不断变化的监管和法律框架下，涉及印度电商赋能、多承运商运输聚合、数字个人数据保护和资本促进。虽然公司已转为 Shiprocket Limited，并在 2026 年 8 月 IPO 后于
              BSE 和 NSE 上市，但仍面临多个裁判层级的未决法律程序。其红鲱鱼招股书披露的诉讼包括：Panchkula 关于扣留商户配送余额的刑事投诉（Connecting Foot Craft）；Bengaluru
              关于仓储运营中 56,793 件疑似未入账库存、价值最高 ₹85.19 million 的警方调查（Jagath Bhasi）；以及 Blue Line Logistics and Warehousing LLP
              针对公司、执行董事和 CFO 发起的程序。此外，Amravati 于 2025 年 8 月登记的一份 FIR 指称公司所有者涉及通过第三方快递合作伙伴 Blue Dart 运送危险武器，促使 CEO Saahil
              Goel 向 Bombay High Court 提交撤销申请。除活跃争议外，Shiprocket 还通过试点向 NBFC 放贷合作方提供最高 ₹200.00 million
              的有上限首次损失违约担保（FLDG），受 RBI Digital Lending Directions 下 5%
              资产组合上限约束。截至目前，法定机关没有对公司处以重大民事或税务罚款，但数据保护和数字借贷规范不断增加，仍会带来实质性的合规摩擦。
