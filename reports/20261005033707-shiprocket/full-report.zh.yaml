  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              Shiprocket 服务的是多元商户群，而非某一种狭窄的企业画像。招股书将高货量 Power Merchant
              与其他活跃商户分开，并列出品牌网站、线下品牌、中型网站、平台商户、线下零售商和社交卖家。公开产品界面同样面向 SMB 在线零售商、D2C
              品牌、贸易商、无库存卖家、社交卖家、线下门店和大型全渠道企业。独立报道将核心需求池概括为 D2C 品牌、微型创业者、本地品牌、MSME
              和数字零售商。这种广度支持庞大的获客漏斗，但买方、用户和付款方通常是同一个商户组织，终端消费者是受益者而非平台的直接客户。收入价值明显偏向 Power
              Merchant，公开证据没有按垂直行业、地理区域或商户规模披露收入。
            claimRefs:
