      - number: '7.3'
        title: 财务敞口、新兴业务利润率稀释与治理监督
        blocks:
          - type: paragraph
            body: >-
              Shiprocket 的财务轨迹体现为收入大幅扩张，但持续的净亏损和新兴业务投入消耗抵消了增长。公司 FY2026、FY2025 和 FY2024 重述后的净亏损分别为 ₹792.45
              million、₹744.49 million 和 ₹5,951.81 million。Q1 FY27 综合净亏损收窄至 ₹13.7 crore，但新兴业务——包括营销技术、全渠道暗仓和跨境配送
              ShiprocketX——仍未盈利，在收入同比增长 70% 的同时调整后 EBITDA 利润率为负 24.3%。核心配送 CAC 在 Q1 FY27 同比上升 13.5% 至 ₹3,560，平台混合 CAC 升至
              ₹6,429，说明维持商户入驻需要越来越高的营销支出。截至 2026 年 3 月 31 日，短期借款总额为 ₹2,420.12
              million。跨境业务中，整柜（FCL）货运出口商面临全球港口拥堵、滞期费和运力瓶颈，压低国际物流变现。为管理运营、信用、网络安全和法律风险，董事会依据 SEBI Listing Regulations
              成立风险管理委员会（RMC），由独立董事 Chetan Kumar Mathur 主持，负责审阅风险缓释政策、ALM 控制和首席风险官建议。公司完成首次上市、面对公开市场审视之际，治理警惕尤为重要。
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
      - number: '7.4'
        title: 图表与要点
        blocks:
          - type: callout
            title: 快递合作伙伴量集中带来的结构性利润率脆弱性
            body: >-
              FY2026 Shiprocket 的包裹货量中有 84.50% 集中在仅五家活跃快递合作伙伴手中，公司因此长期承受利润率风险。由于与 3PL
              合作伙伴的安排并非独家，承运商可在电商旺季优先处理自有货量、提高基础运费或施加限制性 SLA 条件。多承运商路由算法提供软件层面的灵活性，但实体末端交付仍受制于承运商运力。
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
          - type: callout
            title: 通过董事会风险管理委员会构建治理架构
            body: >-
              Shiprocket 已依据 SEBI Listing Regulations 建立正式治理框架，成立专门的风险管理委员会来管理上市公司风险。委员会由独立董事 Chetan Kumar Mathur
              领导，监督网络安全、资产负债匹配（ALM）、运营韧性，以及 FLDG 借贷试点带来的信用敞口，为快速扩张提供关键的制度性制衡。
            calloutType: insight
            claimRefs:
              - CR004
              - CR013
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与公开市场转型
        blocks:
          - type: paragraph
            body: >-
              Shiprocket 于 2026 年 8 月从私有物流聚合商转型为在印度国家证券交易所和 BSE 上市的企业，这是印度商业赋能领域的分水岭。核心投资逻辑在于其轻资产中间层角色：把超过 214,000
              家活跃商户连接到覆盖 19,000 个独立 PIN 码、碎片化的全国承运商生态。通过自动选快递、自动结账和集成追踪深度嵌入商户运营，Shiprocket
              形成了传统单一承运商物流商难以复制的网络引力。但反方逻辑仍落在利润率现实、快递合作伙伴集中和结构性抽成率压力上。公司本质上仍是聚合商，毛利率天然受制于与主导承运商谈下的底层运费。管理层虽积极拓展营销技术和 AI
              驱动结账等高利润率软件邻近业务，但这些新兴分部仍处于亏损状态。公开市场投资者必须在平台效用已被证明、非配送业务加速多元化，与综合净亏损持续、商户变现规模化仍有执行障碍之间权衡。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
