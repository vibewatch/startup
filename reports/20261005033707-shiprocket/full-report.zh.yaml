      - number: '7.2'
        title: 运营可靠性、快递集中度与平台质量
        blocks:
          - type: paragraph
            body: >-
              Shiprocket 的运营韧性受到对外部物流基础设施的结构性依赖和严重承运商集中度的根本限制。作为轻资产聚合商，公司以独立承包商方式与 42
              家活跃快递合作伙伴签约，没有独家服务承诺。法定文件披露的货量显示集中度极高：FY2026 前五家快递合作伙伴占总货量的 84.50%，对应 149.13 million 件，略高于 FY2025 的 83.33%
              和 FY2024 的 83.38%。这种寡头式依赖限制了 Shiprocket
              在运费采购利润率上的议价能力，也使商户在节庆旺季暴露于承运商优先级安排。服务质量摩擦进一步拖累运营：独立评论分析显示情绪两极分化，Trustpilot 评分为 1.7/5，而 GetApp 为
              3.7/5。商户论坛的大量负面反馈反复提到包裹延迟、虚假派送尝试、货件丢失和 NDR 追踪失败。在实体履约业务中，Shiprocket 运营 13 个租赁履约中心（762,826 平方英尺），另有 5
              个客户自有设施和 11 个第三方设施，因此容易受到租金上涨和仓库库存对账争议影响。虽然公司部署 Sense 等机器学习模型来做地址验证和自动减少 RTO，但软件路由与实体快递交付之间的执行缺口仍是严重运营脆弱点。
            claimRefs:
