              Shiprocket 核心包裹配送业务的调整后 EBITDA 利润率稳定在 12.8%，但公司整体毛利扩张依赖于对同一订单叠加结账、营销技术和全渠道暗仓配送的变现。新兴业务收入同比增长 70% 至 INR
