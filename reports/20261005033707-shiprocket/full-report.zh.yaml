      - number: '5.3'
        title: 运营架构、开发者生态与技术风险
        blocks:
          - type: paragraph
            body: >-
              Shiprocket 的技术基础设施围绕庞大的 API 网关和开发者集成生态构建，支持 Node.js、PHP、React、Laravel 和 Angular 的 SDK 与插件
              [CE010]。开发者及平台文档维护在结构化的内部代码库和知识库中，用于协调工程小组、减少工单负担并标准化 API 发布周期 [CE011]。在内部软件质量工程中，公司部署了自动化 QA AI
              Dashboard，后端采用 Java Spring Boot，配合 Python 处理服务、OpenAI 模型、LangChain 编排和 Qdrant 向量数据库，对测试场景做语义相似度匹配
              [CE012]。这条 AI 驱动的测试流水线将人工生成测试的工作量减少了 50%–70%，但工程评估发现其仍依赖人工输入校验参数；当 API 规范缺乏细粒度校验参数时，就会形成漏洞 [CE012,
              CE013]。除测试外，Shiprocket 的架构也存在明确上限：没有用于库位级追踪、按位置排序的拣货单和条码车核验的一体化仓库管理系统（WMS）[CE014]。此外，商户会遇到 COD 回款延迟 8–10
              天以上，以及频繁的自动称重差异争议，暴露出承运商对账链条中的运营摩擦 [CE015]。
