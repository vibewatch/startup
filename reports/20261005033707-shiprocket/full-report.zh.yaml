  - id: FM001
    title: 受证据约束的可触达市场筛选
    type: pyramid
    summary: 从广泛商业活动逐步收窄至可能采用并付费使用 Shiprocket 邻近产品的商户群体。
    data:
      items:
        - label: 印度数字商务
          value: ₹8 lakh crore
          unit: 2026 analyst estimate
          detail: 广泛的渠道活动；不等于 Shiprocket 可触达的收入。
        - label: D2C 商户经济
          value: $10-12B
          unit: current market estimate
