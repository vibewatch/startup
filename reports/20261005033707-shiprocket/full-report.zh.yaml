              - CV016
      - number: '8.4'
        title: 图表与要点
        blocks:
          - type: callout
            title: 估值重置与倍数压缩
            body: >-
              Shiprocket 于 2026 年 8 月以约 $1.1 billion 估值上市，相比私募二级市场讨论和 $1.21B–$1.30B 的独角兽估值高峰，这是更理性的重估。IPO 定价为每股
              ₹92–₹97，既吸引了顶级机构需求，也没有制造难以消化的上市后抛压。
            calloutType: insight
            claimRefs:
              - CV006
              - CV007
              - CV009
          - type: callout
            title: 新兴业务利润率困境
            body: >-
              Shiprocket 新兴业务在 Q1 FY27 同比增长 70% 至 ₹180.4 crore，其中营销技术收入增长 193%；但每笔交易的实际变现较低，调整后 EBITDA 利润率仍深陷负值，为
              -24.3%。核心配送利润（调整后 EBITDA ₹52.7 crore）目前正在补贴这项扩张；一旦核心运输利润率收缩，公司执行上的脆弱性就会暴露。
            calloutType: risk
            claimRefs:
              - CV003
              - CV011
              - CV012
              - CV013
