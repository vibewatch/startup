chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Shiprocket 的运营历史可追溯至 Kartrocket 于 2012 年推出之时；该产品最初帮助小商户建立数字店面。公司如今总部位于 Delhi，将自己定位为服务 MSME、D2C
              品牌和大型零售商的一站式商业赋能平台。它不只是包裹聚合商：来源显示，其业务还覆盖国内配送、履约、跨境物流、结账、营销技术、全渠道工具和金融服务。这种广度让公司可以围绕配送或交易使用量，从一段商户关系中获得多种收入；但也意味着，分部经济和各产品的采用深度必须单独尽调，不能把
              Shiprocket 当成单一产品物流公司。
            claimRefs:
              - CO001
              - CO002
              - CO003
