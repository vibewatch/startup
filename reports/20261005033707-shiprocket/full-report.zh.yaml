      - number: '1.4'
        title: 资本历程与公开市场转型
        blocks:
          - type: paragraph
            body: >-
              Shiprocket 于 2026 年 8 月完成公开市场转型；Economic Times 报道和 CEO 本人的说法都称公司已在 NSE 和 BSE 上市。IPO 将 INR 885.50 crore
              的新募资金与约 INR 722–732 crore 的老股出售所得分开，后者归出售股东而非公司所有。IPO 前融资历史尚未完全核对：一家独立来源称融资超过 USD 320 million，而追踪机构合计为 USD
              336.1 million，且其摘要元数据也不一致。FY2026 经营收入据报为 INR 2,024 crore，但公司仍在亏损，FY2026 税后亏损为 INR 79.25 crore。因此，融资额、IPO
              新募资金、会计亏损和当前现金可用性是不同指标，不能相互替代。
