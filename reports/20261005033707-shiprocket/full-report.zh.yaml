  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心物流引擎与配送编排
        blocks:
          - type: paragraph
            body: >-
              Shiprocket 起初是自动化国内配送平台，旨在为印度 D2C 品牌、零售商和 MSME 解决多承运商接入问题。平台在全国 19,000 个独立 PIN 码覆盖 42
              家以上承运商，让商户通过一个面板比较实时运费、配送速度和服务质量 [CE001, CE003]。物流引擎的核心是 Courier Recommendation
              Engine（CORE），它依据历史表现、价格指标和目的地评分，为每票货物优化承运商分配 [CE002]。除承运商选择外，Shiprocket
              还提供未妥投报告（NDR）自动化、品牌化包裹追踪和货到付款（COD）对账 [CE003]。但技术架构评估显示，Shiprocket 主要停留在下单后的发货层，而非上游履约层
              [CE004]。订单确认后公司才创建货件，也没有在 Amazon、Flipkart 或 Meesho 等外部平台之间维护实时的多渠道库存池 [CE004,
              CE005]。因此，促销活动中的订单激增会带来运营失同步风险，规模化商户需要并行运行企业级订单管理工具 [CE004]。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
