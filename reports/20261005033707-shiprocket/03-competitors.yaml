callouts:
  - calloutType: insight
    title: The Aggregator Paradox and Upstream Vulnerability
    body: >-
      Shiprocket's asset-light model provides massive operating scale without physical fleet capex, but leaves the platform vulnerable to two structural pincers: carrier concentration (over 80% of volume handled by 5 couriers) and customer graduation. High-volume merchants graduating to direct courier contracts increasingly adopt pure SaaS platforms like ClickPost, while price-sensitive merchants test zero-subscription aggregators, compelling Shiprocket to evolve into an all-in-one commerce operating system.
    claimRefs:
      - CP002
      - CP006
      - CP007
      - CP014
  - calloutType: risk
    title: Emerging Services Drag on Consolidated Margins
    body: >-
      While Shiprocket's core shipping platform generated an adjusted EBITDA margin of 12.8% to 13%, its emerging business bets (checkout, cross-border, omnichannel, and marketing technology) operated at a negative 24.3% adjusted EBITDA margin in Q1 FY27. Rapid top-line growth of 70% in emerging services must achieve operational leverage before intensified competition in shipping aggregation erodes the company's core profitability cushion.
    claimRefs:
      - CP014
      - CP015
