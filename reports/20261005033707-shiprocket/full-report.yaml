              Shiprocket completed its transition to the public market in August 2026, with Economic Times coverage and
              the chief executive's own account both describing an NSE and BSE listing. The IPO structure separated INR
              885.50 crore of fresh capital from roughly INR 722-732 crore of offer-for-sale proceeds; the latter
