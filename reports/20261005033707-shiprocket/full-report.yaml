  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Shiprocket's relevant market is narrower than Indian logistics as a whole and broader than parcel-rate
              aggregation. The core boundary is software-enabled commerce infrastructure for merchants that need to
              select and coordinate third-party carriers; adjacent spend includes fulfillment, checkout, marketing
              tools, cross-border enablement, and financial tools. Shiprocket presents all of those categories on its
              own product surface, while independent coverage describes its role as a layer between merchants and
              fragmented delivery networks. Carrier fleet ownership, marketplace consumer demand, advertising media,
              merchandise value, customs duties, and lender balance sheets should therefore be excluded unless
              Shiprocket directly earns revenue from them. Status-quo substitutes include direct carrier contracts,
              marketplace logistics, spreadsheets and manual operations, and an internally built logistics stack; the
              last option is more feasible for large retailers than for small sellers.
            claimRefs:
              - CM009
              - CM010
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM009
              - CM010
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The evidence indicates a favorable demand backdrop but does not yield one auditable TAM. Economic Times
              coverage cites a 20-25% Indian e-commerce CAGR through 2030 and a Unicommerce-derived D2C estimate of
              $10-12 billion today, potentially reaching $60 billion by 2030. A separate Equirus lens places 2026
              digital commerce at ₹8 lakh crore and quick commerce at ₹1.08 lakh crore, growing 40% year on year. These
              figures use different currencies, scopes, dates, and methods and cannot be added or treated as
              Shiprocket-addressable revenue. The stronger operational signal is that Tier-2 and Tier-3 cities
              reportedly supplied 66% of new FY26 D2C orders, although Shiprocket's own mobile-commerce data also shows
              seasonality and an unexplained February trough. Public equity value is likewise a valuation output, not
              market size.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
