              - CE007
              - CE010
              - CE012
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE002
              - CE010
              - CE012
              - CE013
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Aggregated Network Scale and Algorithmic Carrier Orchestration
            body: >-
              Shiprocket's primary technological moat stems from its deep API integration across 42+ courier networks
              and nationwide coverage of 19,000+ pin codes. By abstracting fragmented logistics providers behind a
              unified recommendation engine (CORE), the platform allows small and mid-sized merchants to access
              enterprise-grade multi-carrier routing without negotiating individual bilateral contracts.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: callout
            title: Upstream Operational Blindspots in Warehouse and Inventory Control
            body: >-
              Because Shiprocket's architecture operates at the shipment creation layer rather than the holistic order
              management layer, it lacks native warehouse management capabilities (bin tracking, barcode scanning,
              location-sorted picklists) and cross-channel inventory synchronization. Scaling brands exceeding 1,000
              monthly orders face overselling risks and often require third-party OMS/WMS platforms, relegating
              Shiprocket to a pure last-mile execution carrier.
            calloutType: risk
            claimRefs:
              - CE004
              - CE005
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and segmentation
        blocks:
          - type: paragraph
            body: >-
              Shiprocket serves a heterogeneous merchant base rather than one narrow enterprise persona. Its prospectus
              separates high-volume Power Merchants from other active merchants and describes brand websites, offline
              brands, midsize websites, marketplaces, offline retailers, and social sellers. The public product surface
              similarly targets SMB online retailers, D2C brands, traders, drop shippers, social sellers, offline
              stores, and larger omnichannel businesses. Independent reporting characterizes the core demand pool as D2C
              brands, micro-entrepreneurs, local brands, MSMEs, and digital retailers. This breadth supports a large
              acquisition funnel, but buyer, user, and payer are usually the same merchant organization, while end
              consumers are beneficiaries rather than direct platform customers. Revenue value is visibly skewed toward
              Power Merchants, and public evidence does not disclose revenue by vertical, geography, or merchant-size
              band.
            claimRefs:
              - CU005
              - CU015
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU005
              - CU015
      - number: '6.2'
        title: Adoption, usage, and durability
        blocks:
          - type: paragraph
            body: >-
              The latest prospectus reports 214,769 Active Merchants in Fiscal 2026, up from 165,231 in Fiscal 2025,
              alongside 202.08 million unique transactions and 69.58 million end consumers served. The 57.78% repeat
              rate is an end-consumer measure, not merchant retention. Merchant durability is better evidenced by
              transaction cohorts: the Fiscal 2024 cohort reached 1.81 times initial-year transactions by Fiscal 2026,
              and the Fiscal 2025 cohort reached 1.93 times after one year, while the Fiscal 2023 cohort was only 0.89
              times after three years and was affected by Pickrr integration. These measures indicate usage persistence
              for selected cohorts but cannot substitute for merchant GRR, NRR, logo churn, or renewal data.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU009
              - CU010
              - CU011
      - number: '6.3'
        title: Named customer proof and reference quality
        blocks:
          - type: paragraph
            body: >-
              Named proof spans checkout, domestic shipping, and cross-border use cases, but its evidentiary quality
              varies. The prospectus describes Blackberrys adopting checkout in Fiscal 2023 and later adding Domestic
              Shipping, with reported improvements in prepaid orders and conversion; the filing expressly warns that
              Shiprocket may not have been the only cause. Cuspera summarizes reported outcomes for Krishna's Herbal &
              Ayurveda, Sardarji Papadwale, and Silver Hub USA, while Shiprocket's homepage carries seller testimonials
              such as Blur India and Phool. These examples show real workflow breadth, yet most lack contract scope,
              cohort definitions, baseline methodology, or independent customer confirmation. They should be treated as
              directional adoption proof, not representative retention or ROI evidence.
            claimRefs:
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU013
              - CU014
              - CU015
      - number: '6.4'
        title: Expansion, concentration, and procurement friction
        blocks:
          - type: paragraph
            body: >-
              Expansion within the installed base is the clearest commercial opportunity and the main execution test.
              Independent reporting says the share of core merchants using emerging products rose to 8.8% from 7.3% in
              Q1 FY27 and that 48,406 merchants were served by the emerging business, but also notes that adoption
              remains limited and the segment remains loss-making. Prospectus data show Power Merchant ARPU rising
              faster than Power Merchant count and top-ten revenue concentration declining to 12.19% in Fiscal 2026 from
              16.23% in Fiscal 2024. A Decentro partner case shows payments onboarding at a smaller subset, while
              Shiprocket's own B2B guidance acknowledges multi-stakeholder, multi-touch buying cycles. This creates a
              credible land-and-expand loop, but procurement effort, partner dependence, and missing merchant-level
              churn data limit confidence in its durability.
            claimRefs:
              - CU006
              - CU007
              - CU009
              - CU010
              - CU011
              - CU012
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU011
              - CU012
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Transaction retention is not merchant retention
            body: >-
              The prospectus cohort metric compares transaction volumes with each cohort's initial year. It is useful
              evidence of usage depth, but it does not disclose retained merchant counts, GRR, NRR, logo churn, or
              contractual renewal.
            calloutType: insight
            claimRefs:
              - CU008
          - type: callout
            title: Expansion is improving from a low base
            body: >-
              Emerging-product penetration among core merchants rose to 8.8% in Q1 FY27, but most core merchants had not
              adopted those products and the emerging segment remained loss-making.
            calloutType: risk
            claimRefs:
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Compliance, Licensing, and Pending Litigation
        blocks:
          - type: paragraph
            body: >-
              Shiprocket operates under an evolving regulatory and legal framework governing Indian e-commerce
              enablement, multi-carrier transport aggregation, digital personal data protection, and capital
              facilitation. While Shiprocket has converted into a public limited company (Shiprocket Limited) with
              shares listed on BSE and NSE following its August 2026 IPO, it remains exposed to outstanding legal
              proceedings at multiple adjudicatory levels. Outstanding litigation detailed in its Red Herring Prospectus
              includes a criminal complaint in Panchkula regarding withheld merchant shipping credits (Connecting Foot
              Craft), a police investigation in Bengaluru regarding 56,793 allegedly unaccounted inventory units valued
              up to ₹85.19 million in its warehousing operations (Jagath Bhasi), and proceedings initiated by Blue Line
              Logistics and Warehousing LLP against the company, executive directors, and the CFO. In addition, an FIR
              registered in Amravati in August 2025 named company owners in connection with dangerous weapons delivered
              through third-party courier partner Blue Dart, prompting CEO Saahil Goel to file a quashing petition
              before the Bombay High Court. Beyond active disputes, Shiprocket has entered digital financial services
              via a pilot program providing a capped first-loss default guarantee (FLDG) to NBFC lending partners of up
              to ₹200.00 million (subject to a 5% portfolio cap under RBI Digital Lending Directions). Although
              statutory authorities have issued no material civil or tax penalties to date, expanding regulatory
              obligations under data protection and digital lending norms create material residual compliance friction.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR006
              - CR008
              - CR011
      - number: '7.2'
        title: Operational Reliability, Courier Concentration, and Platform Quality
        blocks:
          - type: paragraph
            body: >-
              Operational resilience at Shiprocket is fundamentally constrained by its structural dependence on external
              logistics infrastructure and severe carrier concentration. As an asset-light aggregator, the company
              contracts with 42 active courier partners on an independent contractor basis without exclusive service
              commitments. Volume data disclosed in statutory filings reveals extreme concentration: the top five
              courier partners accounted for 84.50% of total shipment volume (149.13 million shipments) in Fiscal 2026,
              slightly increasing from 83.33% in Fiscal 2025 and 83.38% in Fiscal 2024. This oligopolistic carrier
              reliance limits Shiprocket's bargaining leverage on freight procurement margins and exposes merchants to
              carrier prioritization during peak festive periods. Operational execution is further strained by service
              quality friction: independent review analysis reveals dramatic sentiment polarization, evidenced by a
              1.7/5 Trustpilot rating alongside a 3.7/5 GetApp rating. Dominant negative feedback across merchant forums
              documents recurring parcel delivery delays, fake delivery attempts, lost shipments, and non-delivery
              report (NDR) tracking failures. In its physical fulfillment vertical, Shiprocket operates 13 leased
              fulfillment centres (762,826 square feet) alongside 5 customer-owned and 11 third-party facilities,
              leaving the company vulnerable to lease escalation and warehouse inventory reconciliation disputes. While
              Shiprocket deploys machine learning models such as Sense for address validation and automated
              return-to-origin (RTO) reduction, execution gaps between software routing and physical courier delivery
              remain an acute operational vulnerability.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR006
              - CR013
      - number: '7.3'
        title: Financial Exposure, Emerging Bets Margin Dilution, and Governance Oversight
        blocks:
          - type: paragraph
            body: >-
              Shiprocket's financial trajectory reflects substantial top-line expansion offset by persistent net losses
              and emerging vertical investment burn. The company recorded restated net losses of ₹792.45 million in
              Fiscal 2026, ₹744.49 million in Fiscal 2025, and ₹5,951.81 million in Fiscal 2024. While consolidated net
              loss narrowed to ₹13.7 crore in Q1 FY27, its emerging business—comprising marketing technology (martech),
              omnichannel dark stores, and cross-border shipping (ShiprocketX)—remains unprofitable, generating an
              adjusted EBITDA margin of negative 24.3% despite 70% YoY top-line growth. Customer acquisition costs (CAC)
              for core shipping increased 13.5% YoY to ₹3,560 in Q1 FY27, while blended platform CAC climbed to ₹6,429,
              highlighting mounting marketing expenses required to sustain merchant onboarding. Furthermore, total
              short-term borrowings stood at ₹2,420.12 million as of March 31, 2026. In cross-border operations,
              exporters navigating full container load (FCL) freight face global port congestion, demurrage charges, and
              capacity bottlenecks, which depress international logistics realization. To oversee these multifaceted
              operational, credit, cyber, and legal exposures, the Board of Directors constituted a Risk Management
              Committee (RMC) chaired by Independent Director Chetan Kumar Mathur, which reviews risk mitigation
              policies, ALM controls, and chief risk officer recommendations pursuant to SEBI Listing Regulations.
              Governance vigilance is paramount as the company navigates public market scrutiny following its primary
              listing.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural Margin Vulnerability in Courier Partner Volume Concentration
            body: >-
              With 84.50% of Shiprocket's parcel shipment volume concentrated across just five active courier partners
              in Fiscal 2026, the company operates under perpetual margin risk. Because arrangements with 3PL partners
              are non-exclusive, carriers can prioritize proprietary volumes, raise base freight tariffs, or impose
              restrictive SLA conditions during peak e-commerce quarters. Multi-carrier routing algorithms provide
              software flexibility, but physical last-mile execution remains hostage to carrier capacity.
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
          - type: callout
            title: Governance Architecture via Board Risk Management Committee
            body: >-
              Shiprocket has established a formalized governance framework to manage public company risk, constituting a
              dedicated Risk Management Committee under SEBI Listing Regulations. Led by Independent Director Chetan
              Kumar Mathur, the committee oversees cybersecurity, asset-liability matching (ALM), operational
              resilience, and credit exposure from the FLDG lending pilot, providing critical institutional
              counterweight to rapid operational scaling.
            calloutType: insight
            claimRefs:
              - CR004
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Public Market Transition
        blocks:
          - type: paragraph
            body: >
              Shiprocket's transition from a privately held logistics aggregator to a publicly listed enterprise on the
              National Stock Exchange of India and BSE in August 2026 represents a watershed moment for Indian commerce
              enablement. The core investment thesis centers on Shiprocket's indispensable role as an asset-light
              middleware layer connecting more than 214,000 active merchants to a fragmented nationwide carrier
              ecosystem across 19,000 unique pin codes. By embedding deeply into merchant operations with automated
              courier selection, automated checkout, and integrated tracking, Shiprocket commands significant network
              gravity that traditional single-carrier logistics operators cannot easily match.


              However, the anti-thesis remains grounded in margin realities, courier partner concentration, and
              structural take-rate pressures. Shiprocket operates primarily as an aggregator whose gross margins are
              intrinsically bounded by the underlying shipping rates negotiated with dominant delivery carriers. While
              management has pursued aggressive expansion into high-margin software adjacencies including marketing
              technology and AI-driven checkout tools, these emerging segments continue to operate at a segment-level
              loss. Public market investors must weigh Shiprocket's proven platform utility and accelerating
              non-shipping diversification against its continuing consolidated net losses and execution hurdles in
              scaling merchant monetization.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV006
              - CV009
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV011
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV011
              - CV014
      - number: '8.2'
        title: IPO Structure, Pricing Realities, and Entry Discipline
        blocks:
          - type: paragraph
            body: >
              Shiprocket's initial public offering in August 2026 raised ₹1,617.59 crore ($170 million) at an issue
              price band of ₹92 to ₹97 per share, valuing the company at approximately ₹7,000 crore ($1.1 billion
              post-money) at the conclusion of its first trading day. The transaction comprised ₹885 crore in fresh
              primary equity earmarked for technological enhancements, platform expansion, and debt repayment, alongside
              a ₹732 crore offer for sale by early institutional backers. The public listing cleared at a modest
              discount to the $1.21B–$1.30B private marks seen during its peak unicorn funding rounds in 2022–2024,
              enforcing valuation discipline on public market entrants.


              On its debut, Shiprocket shares surged 48% above the issue price, buoyed by institutional participation
              from marquee asset managers such as SBI Mutual Fund, HDFC Mutual Fund, and Goldman Sachs, alongside
              long-term anchor Bertelsmann India Investments, which retained an approximate 19% shareholding. Trading at
              approximately 5.5x FY26 revenue run rate, Shiprocket's current market multiple sits between high-growth
              pure-play SaaS platforms and capital-intensive listed delivery providers. Entry discipline at current
              prices demands strict monitoring of quarterly progress toward sustained bottom-line profitability and
              evidence that software monetization can expand overall take rates.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Scenario Analysis, Downside Risks, and Diligence Asks
        blocks:
          - type: paragraph
            body: >
              Forward valuation for Shiprocket hinges on three critical operating variables: the speed of adjusted
              EBITDA margin expansion in emerging bets, sustainable organic transaction growth within the core shipping
              network, and customer acquisition cost discipline. In a bull case scenario, rapid adoption of martech and
              checkout offerings across the merchant base lifts the emerging revenue share beyond 40%, propelling
              consolidated revenue toward ₹3,200 crore while converting adjusted EBITDA into positive GAAP operating
              income by FY28. Under this trajectory, enterprise valuation could expand toward ₹11,500 crore ($1.38B) as
              the market rewards software-like gross margin profiles.


              Conversely, a bear case materializes if carrier partners simultaneously raise wholesale rates or expand
              competing self-serve aggregation tools, squeezing Shiprocket's take rate while emerging martech tools
              stall in merchant adoption. With customer acquisition costs for core shipping rising 13.5% year-over-year
              in Q1 FY27 to ₹3,560, failure to achieve operating leverage could trap the business in persistent
              quarterly losses. Primary diligence asks must focus on cohort-level contribution margins for martech
              products, contractual minimum volume commitments with major delivery couriers, and exact resolution
              timelines for historical litigation.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Reset and Multiple Compression
            body: >
              Shiprocket's August 2026 public listing at a valuation of approximately $1.1 billion represents a
              constructive rationalization compared to private secondary discussions and peak unicorn valuations of
              $1.21B–$1.30B. By pricing the initial public offering at ₹92–₹97 per share, the company attracted top-tier
              institutional demand without creating an onerous post-listing overhang.
            calloutType: insight
            claimRefs:
              - CV006
              - CV007
              - CV009
          - type: callout
            title: The Emerging Segment Margin Dilemma
            body: >
              While Shiprocket's emerging business line expanded 70% year-over-year in Q1 FY27 to ₹180.4 crore, driven
              by a 193% surge in martech, it generated lower realization per transaction and remained deeply
              unprofitable with an adjusted EBITDA margin of -24.3%. Core shipping profits (₹52.7 crore adjusted EBITDA)
              are currently subsidizing this expansion, creating execution vulnerability if core transport margins
              compress.
            calloutType: risk
            claimRefs:
              - CV003
              - CV011
              - CV012
              - CV013
