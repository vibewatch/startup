  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Multi-Category Dynamics
        blocks:
          - type: paragraph
            body: >-
              Shiprocket occupies a pivotal aggregation position in India's expanding e-commerce logistics and
              enablement market, estimated at approximately USD 7.25 billion in 2026 and projected to expand toward USD
              11.14 billion by 2031. However, the competitive environment is far from monolithic; Shiprocket battles
              across multiple distinct categories ranging from integrated express couriers to pure-play logistics
              management software. Direct shipping aggregators like NimbusPost and Shipyaari compete aggressively on
              baseline pricing, while specialized 3PL providers like WareIQ deliver multi-city dark stores and deep
              warehousing networks. Concurrently, enterprise shipping management SaaS platforms such as ClickPost target
              mature D2C brands by enabling direct carrier API integrations, bypassing aggregator markups entirely.
              Furthermore, integrated carrier incumbents like Delhivery and high-growth logistics operators like
              Shadowfax are expanding their direct-to-consumer and hyperlocal offerings, shifting the competitive
              battleground from basic carrier rate arbitrage to multi-touchpoint merchant workflow control.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
