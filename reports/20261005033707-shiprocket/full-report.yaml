        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Saahil Goel remains the most visible executive in the available evidence: his public profile identifies
              him as managing director and chief executive, while IPO-oriented coverage identifies him as a co-founder.
              The same coverage names Vishesh Khurana as a co-founder, but the assigned sources do not establish his
              current operating remit, the complete executive team, committee structure, or a current board roster. This
              evidence supports founder continuity but not a conclusion that governance depth or succession planning is
              adequate. The combination of founder and chief-executive roles makes delegation, board independence,
              executive retention, and succession materials priority requests for investor diligence.
