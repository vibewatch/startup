        title: Exhibits
        blocks:
          - type: callout
            title: Tailwinds do not equal Shiprocket TAM
            body: >-
              D2C, smaller-city, and quick-commerce growth expand merchant logistics demand, but no retained source
              discloses the take rate or eligible shipment pool needed to convert those channel estimates into company
              revenue opportunity.
            calloutType: insight
            claimRefs:
