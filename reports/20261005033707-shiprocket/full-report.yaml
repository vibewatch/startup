      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The practical entry buyer is usually the merchant operator responsible for shipping reliability and cost,
              while daily users sit in operations, warehouse, customer-support, and growth teams. The payer is the
              merchant entity, but the budget can migrate from logistics operations into commerce software or marketing
              as more products are adopted. This role map is an analytical inference from the sourced product set rather
              than a disclosed procurement study. The observable adoption path starts with a recurring shipping
              workflow, then extends to fulfillment, checkout, omnichannel, martech, or cross-border services. Inc42
              reported a 2.22 lakh merchant network in Q1 FY27, yet only 8.8% of core merchants used emerging products.
              That gap makes installed-base conversion more important than a broad headline market estimate.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Adoption drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption is supported by D2C order growth, demand outside major metros, merchant outsourcing, and the
              operational complexity of selecting among carriers. Shiprocket can potentially capture more spend without
              owning fleets by embedding adjacent tools in a high-frequency shipping workflow. The constraints are
              equally material: the official mobile dataset shows a sharp seasonal decline, Inc42 says emerging products
              remain loss-making despite fast growth, and Outlook Business reports that merchant-solution costs were
              69.39% of FY26 expenses with the top ten vendors contributing 55.24%. Historical carrier price increases
              show that suppliers can exert bargaining power. Valuation should therefore be tied to merchant retention,
              realized take rates, contribution margin, and profitable cross-sell—not to gross merchandise value or
              broad e-commerce forecasts that Shiprocket does not itself recognize as revenue.
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
