      - number: '4.2'
        title: Unit Economics and GTM Efficiency
        blocks:
          - type: paragraph
            body: >-
              The underlying unit economics of Shiprocket demonstrate clear operational leverage in the mature core
              shipping segment contrasted with early-stage margin dilution across emerging products. At the platform
              level, adjusted EBITDA per transaction expanded to INR 1.50 in Q1 FY27 from INR 0.22 in Q1 FY26, driven by
              procurement rate compression from 3PL courier partners and higher transaction density across 216 million
              trailing-twelve-month transactions. Consolidated contribution margin grew 43% year-over-year in Q1 FY27 to
              15.3% in emerging bets and expanded across core logistics. However, sales efficiency proxies show emerging
              pressure: customer acquisition cost (CAC) for the core shipping business increased 13.5% YoY to INR 3,560
              in Q1 FY27, while blended overall CAC reached INR 6,429 (compared to INR 5,829.67 in FY26 and INR 5,742.33
              in FY25). While average revenue per power merchant climbed to INR 18.7 lakh from INR 15.0 lakh, the
              absolute pool of power merchants contracted slightly from 10,282 to 10,170. Shiprocket is attempting to
              counter rising acquisition costs through cross-selling emerging tools—such as Fastrr 1-click checkout and
              automated WhatsApp marketing—to its 2.22 lakh active merchants, raising cross-sell penetration from 7.3%
              to 8.8%.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI009
              - CI011
      - number: '4.3'
        title: Cost Structure, Capital Adequacy, and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              Shiprocket's cost structure is dominated by direct 3PL freight purchase obligations, customer acquisition
              expenses, and expanding product engineering overhead across its 1,500-person headcount. In fiscal 2026,
              the company posted an accounting loss for the year of INR 792.45 million on net worth of INR 15,242.89
              million, following a loss of INR 744.49 million in FY25. In Q1 FY27, net loss narrowed 24% YoY to INR 13.7
              crore from INR 18.0 crore. Operating losses remain heavily concentrated in emerging business lines, which
              recorded an adjusted EBITDA margin of negative 24.3% in Q1 FY27. On capital adequacy, Shiprocket
              substantially reinforced its liquidity through its August 2026 initial public offering on the BSE and NSE,
              which raised a total of INR 1,617.48 crore ($195M+ equivalent), comprising a fresh equity issue of INR
              885.50 crore (9.13 crore shares at ₹97) and an offer for sale of INR 731.98 crore. Management designated
              fresh capital proceeds specifically toward technology infrastructure, platform marketing, debt repayment,
              and potential inorganic acquisitions. Diligence underwriting must evaluate key structural risks: carrier
              rate renegotiations, working-capital exposure in COD remittance advances, execution risk across emerging
              segments, and persistent merchant complaints regarding parcel damage claims.
            claimRefs:
              - CI005
              - CI010
              - CI011
              - CI012
              - CI014
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Emerging Services Cross-Sell Is the Key Margin Lever
            body: >-
              While Shiprocket's core parcel shipping business generates stable adjusted EBITDA at a 12.8% margin,
              corporate gross profit expansion relies on monetizing the same order across checkout, martech, and
              omnichannel dark-store distribution. With emerging business revenue growing 70% YoY to INR 180.4 crore,
              merchant cross-sell penetration (8.8%) will dictate whether Shiprocket achieves consolidated operating
              profitability.
            calloutType: insight
            claimRefs:
              - CI005
              - CI008
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core Logistics Engine and Shipping Orchestration
        blocks:
          - type: paragraph
            body: >-
              Shiprocket began as an automated domestic shipping platform designed to solve multi-carrier courier access
              for Indian direct-to-consumer (D2C) brands, retailers, and MSMEs. The platform aggregates over 42 courier
              partners across 19,000 unique pin codes nationwide, allowing merchants to compare real-time freight
              pricing, delivery speed, and service quality through a single dashboard [CE001, CE003]. At the heart of
              this logistics engine is the Courier Recommendation Engine (CORE), an algorithmic scoring system that
              evaluates courier partners based on historical performance, pricing metrics, and destination ratings to
              optimize carrier allocation for each shipment [CE002]. In addition to carrier selection, Shiprocket
              provides Non-Delivery Report (NDR) automation, branded parcel tracking, and Cash on Delivery (COD)
              reconciliation [CE003]. However, technical architecture evaluations demonstrate that Shiprocket operates
              primarily at the post-order shipment level rather than the upstream fulfillment level [CE004]. Shiprocket
              creates shipments only after orders are confirmed and does not maintain a real-time multi-channel
              inventory pool across external marketplaces like Amazon, Flipkart, or Meesho [CE004, CE005]. Consequently,
              rapid order bursts during sales events introduce operational desynchronization risks, requiring scaling
              merchants to operate parallel enterprise order management tools [CE004].
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE008
              - CE009
      - number: '5.2'
        title: Commerce Stack Expansion and AI Platform Capabilities
        blocks:
          - type: paragraph
            body: >-
              To capture higher wallet share across the broader merchant lifecycle, Shiprocket has expanded aggressively
              beyond standard domestic transport into marketing technology, one-click checkout, cross-border logistics,
              and capital enablement [CE006, CE007]. Its emerging product portfolio includes fastrr Checkout—a one-click
              checkout mechanism designed to reduce completion time below 40 seconds—and fastrr Identify for
              WhatsApp-centric marketing automation [CE007]. The company also operates ShipX and CargoX for cross-border
              transport, alongside Shiprocket Capital and credit profiling tools [CE007]. These emerging software
              offerings drove rapid top-line expansion, growing 70% year-over-year to ₹180.4 crore in Q1 FY27, led by a
              193% surge in martech revenue [CE008]. On the data and machine learning layer, Shiprocket deploys
              proprietary modules including Sense—an AI API built to reduce Return to Origin (RTO) rates through
              automated address verification and autofill—and Trends for market intelligence [CE007, CE009]. Shiprocket
              reports leveraging a decade of consumer behavior data spanning 15 crore consumers, with 93% of checkout
              addresses auto-filled on its network [CE009]. However, this emerging stack remains operating at an
              adjusted EBITDA loss, requiring ongoing subsidization from core shipping margins [CE008].
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
