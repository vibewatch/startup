              - CM003
              - CM004
              - CM005
          - type: callout
            title: Supplier leverage can absorb market growth
            body: >-
              Vendor concentration, non-exclusive logistics relationships, and historical carrier price increases mean
              that shipment growth may not translate proportionally into contribution margin.
            calloutType: risk
            claimRefs:
