        - Integrated Logistics & 3PL
        - Rapidly growing D2C delivery network expanding 2.7x YoY in Q1 FY27
        - Hyperlocal, quick-commerce, and direct-to-consumer digital brands
        - Integrated first-party delivery fleet, flat-rate shipping options, rapid D+2 COD cycle
        - Network footprint historically concentrated in urban and express delivery clusters
