      - number: '1.2'
        title: Scale and operating shape
        blocks:
          - type: paragraph
            body: >-
              Shiprocket's own site claims more than 4 lakh businesses or sellers, nationwide coverage across more than
              19,000 unique pin codes, and reach across more than 220 countries and territories. These are
              company-issued reach measures, not independently audited active-customer counts. The latest independent
              operating evidence in the assigned pool reports Q1 FY2027 revenue from operations of INR 592.1 crore and
              emerging-business revenue of INR 180.4 crore, up 70% year over year. The emerging segment nevertheless
              remained loss-making at a negative 24.3% adjusted EBITDA margin, so rapid adjacency growth should not be
              read as segment profitability or as proof that all registered sellers are active, revenue-generating
              merchants.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO015
              - CO016
