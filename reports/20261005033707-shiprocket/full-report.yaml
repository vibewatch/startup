        - Logistics Aggregator & Enabler
        - Over 200,000 orders/day; 2.22 lakh merchants; asset-light technology layer
        - D2C brands, SMBs, social commerce, omni-channel sellers
        - Unified single platform, 42+ carrier options, integrated checkout and martech stack
