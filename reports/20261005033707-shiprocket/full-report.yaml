chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Shiprocket traces its operating history to the 2012 launch of Kartrocket, initially intended to help small
              merchants establish digital storefronts. The business is now headquartered in Delhi and positions itself
              as an end-to-end commerce-enablement platform for MSMEs, direct-to-consumer brands, and larger retailers.
              Its offer is broader than parcel aggregation: the assigned sources describe domestic shipping, fulfilment,
              cross-border logistics, checkout, marketing technology, omnichannel tools, and financial services. This
              breadth creates several ways to monetize a merchant relationship, generally through usage tied to
              shipments or transactions, but it also makes segment economics and product-level adoption important
              diligence questions rather than treating Shiprocket as a single-product logistics company.
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
