      - CV011
      - CV012
      - CV013
  - id: TV003
    title: Valuation Scenario Analysis (FY27–FY28)
    columns:
      - Scenario
      - Key Assumptions & Drivers
      - Projected FY28 Revenue / Multiple
      - Implied Valuation & Return Logic
      - Key Risks & Downside Triggers
      - Probability
    rows:
      - - Bull Case
        - >-
          Martech grows >100% YoY; emerging segment reaches 45% of total revenue; consolidated EBITDA turns positive by
          Q3 FY27.
        - ₹3,400 Cr revenue ($410M); 4.0x EV/sales multiple.
        - ₹13,600 Cr ($1.64B) implied market cap; +49% upside from $1.1B IPO base.
        - Aggressive competitive discounting by vertical SaaS players; regulatory caps on shipping surcharges.
        - 25%
      - - Base Case
        - >-
          Core shipping grows 20-22% YoY; emerging segment expands at 40-50% YoY; consolidated EBITDA breaks even in
          FY28.
        - ₹2,800 Cr revenue ($337M); 3.2x EV/sales multiple.
        - ₹8,960 Cr ($1.08B) implied market cap; flat to modest +5% return reflecting earnings consolidation.
        - CAC inflation in core shipping; slower merchant transition to paid martech tools.
        - 55%
      - - Bear Case
        - >-
          Courier partners hike base freight costs; cross-border business continues contraction; emerging losses persist
          at >₹100 Cr annually.
        - ₹2,200 Cr revenue ($265M); 2.0x EV/sales multiple.
        - ₹4,400 Cr ($530M) implied market cap; -52% downside as multiple derates to logistics operator levels.
        - Major carrier disintermediation; severe merchant churn in power seller tier.
        - 20%
    notes: >-
      Scenarios model FY28 projections using INR/USD exchange rate of ~83; valuation multiples calibrated against listed
      Indian tech comparables.
