  - id: TV002
    title: Investment Thesis vs Anti-Thesis Evaluation
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counterpoint
      - Falsification / Trigger Metric
    rows:
      - - Market Leadership
        - India's largest D2C enablement network with over 214,000 active sellers and coverage across 19,000 pin codes.
        - Core aggregation moat is vulnerable to direct carrier portals and pricing squeeze from logistics partners.
        - Active merchant count dropping below 200,000 or top courier partners raising take rates by >50 bps.
      - - Product Monetization
        - >-
          Emerging businesses (martech, omnichannel, checkout) surged 70% YoY in Q1 FY27 to ₹180.4 Cr, expanding
          merchant LTV.
        - >-
          Emerging segment remains unprofitable with adjusted EBITDA margin of -24.3%, depressing overall realization
          per order.
        - Emerging segment contribution margin failing to reach 25% within four trailing fiscal quarters.
      - - Capital & Balance Sheet
        - >-
          Fresh primary proceeds of ₹885 crore from the August 2026 IPO provide robust liquidity for tech expansion and
          debt retirement.
        - Consolidated net loss of ₹13.7 Cr in Q1 FY27 and rising merchant CAC (₹6,429 overall) threaten cash burn.
        - Quarterly operating cash flow turning negative beyond ₹50 crore over two consecutive quarters.
      - - Valuation Realism
        - Listing at $1.1B successfully cleared private valuation overhang, attracting top domestic institutional funds.
        - >-
          Post-listing multiple of ~5.5x EV/sales leaves limited margin of safety if top-line growth decelerates below
          20%.
        - Consolidated YoY revenue growth slipping below 15% in subsequent FY27 quarterly reporting.
    notes: Evaluation framework cross-references reported Q1 FY27 segment financials with IPO prospectus disclosures.
    claimRefs:
