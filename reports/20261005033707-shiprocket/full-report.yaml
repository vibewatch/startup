      - number: '5.3'
        title: Operating Architecture, Developer Ecosystem, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              Shiprocket's technical infrastructure is engineered around an extensive API gateway and developer
              integration ecosystem supporting SDKs and plugins across Node.js, PHP, React, Laravel, and Angular
              [CE010]. Developer and platform documentation is maintained across structured internal repositories and
              knowledge bases to align engineering pods, reduce ticket overhead, and standardize API release cycles
              [CE011]. Within internal software quality engineering, Shiprocket has deployed an automated QA AI
              Dashboard utilizing a Java Spring Boot backend, a Python processing service, OpenAI models, LangChain
              orchestration, and a Qdrant vector database for semantic similarity matching of test scenarios [CE012].
              While this AI-driven testing pipeline reduces manual test generation effort by 50% to 70%, engineering
              evaluations reveal persistent dependencies on manual validation parameter inputs, creating vulnerabilities
              when API specifications lack granular validation parameters [CE012, CE013]. Beyond testing, Shiprocket
              exhibits defined architectural ceilings: it lacks an integrated warehouse management system (WMS) for
              bin-level tracking, location-sorted picklists, and barcode cart verification [CE014]. Furthermore,
              merchants experience 8 to 10+ day delays in COD remittance and frequent automated weight discrepancy
              disputes, exposing operational friction across the carrier reconciliation stack [CE015].
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
