  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: merchant-retention
      missingEvidence: "Merchant GRR, NRR, logo churn, renewal rates, contract duration, and retained-account cohorts by customer segment."
      whyItMatters: "Transaction-volume retention can rise even if merchant accounts churn, so it does not establish contractual or logo durability."
      diligencePath: "Request monthly merchant cohorts, gross and net revenue retention bridges, churn reasons, renewal terms, and segment-level retention from management."
      relatedQuestionRefs: [QU009]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: "A complete current customer reference list with contract status, production scope, baselines, denominators, and customer-confirmed outcomes."
      whyItMatters: "Selective company and aggregator examples cannot establish how representative outcomes are or whether deployments remain active."
      diligencePath: "Sample signed contracts and invoices, conduct reference calls across merchant sizes and products, and reconcile disclosed case-study metrics to customer records."
      relatedQuestionRefs: [QU010]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
