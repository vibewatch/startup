    claimRefs: [CU011, CU012, CU015, CU016]
callouts:
  - calloutType: insight
    title: Transaction retention is not merchant retention
    body: >-
      The prospectus cohort metric compares transaction volumes with each cohort's initial year. It is
      useful evidence of usage depth, but it does not disclose retained merchant counts, GRR, NRR, logo
      churn, or contractual renewal.
    claimRefs: [CU008]
  - calloutType: risk
    title: Expansion is improving from a low base
    body: >-
      Emerging-product penetration among core merchants rose to 8.8% in Q1 FY27, but most core merchants
      had not adopted those products and the emerging segment remained loss-making.
    claimRefs: [CU011]
