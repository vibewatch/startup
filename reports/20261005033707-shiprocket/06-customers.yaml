chapter:
  number: 6
  title: Customers
  summary: >-
    Shiprocket has broad merchant reach and rising transaction activity, but the strongest durability
    evidence is transaction-cohort and power-merchant expansion rather than disclosed account retention.
    Cross-sell is increasing from a low base, while concentration has moderated and public named-customer
    proof remains selective and largely company- or aggregator-reported.
sections:
  - id: customer-base
    title: Customer base and segmentation
    body: >-
      Shiprocket serves a heterogeneous merchant base rather than one narrow enterprise persona. Its
      prospectus separates high-volume Power Merchants from other active merchants and describes brand
      websites, offline brands, midsize websites, marketplaces, offline retailers, and social sellers.
      The public product surface similarly targets SMB online retailers, D2C brands, traders, drop
      shippers, social sellers, offline stores, and larger omnichannel businesses. Independent reporting
      characterizes the core demand pool as D2C brands, micro-entrepreneurs, local brands, MSMEs, and
      digital retailers. This breadth supports a large acquisition funnel, but buyer, user, and payer are
      usually the same merchant organization, while end consumers are beneficiaries rather than direct
      platform customers. Revenue value is visibly skewed toward Power Merchants, and public evidence
      does not disclose revenue by vertical, geography, or merchant-size band.
    claimRefs: [CU005, CU015]
    tableRefs: [TU001]
  - id: adoption-durability
    title: Adoption, usage, and durability
    body: >-
      The latest prospectus reports 214,769 Active Merchants in Fiscal 2026, up from 165,231 in Fiscal
      2025, alongside 202.08 million unique transactions and 69.58 million end consumers served. The
      57.78% repeat rate is an end-consumer measure, not merchant retention. Merchant durability is
      better evidenced by transaction cohorts: the Fiscal 2024 cohort reached 1.81 times initial-year
      transactions by Fiscal 2026, and the Fiscal 2025 cohort reached 1.93 times after one year, while the
      Fiscal 2023 cohort was only 0.89 times after three years and was affected by Pickrr integration.
      These measures indicate usage persistence for selected cohorts but cannot substitute for merchant
      GRR, NRR, logo churn, or renewal data.
    claimRefs: [CU001, CU002, CU003, CU004, CU008]
    tableRefs: [TU002]
  - id: named-proof
    title: Named customer proof and reference quality
    body: >-
      Named proof spans checkout, domestic shipping, and cross-border use cases, but its evidentiary
      quality varies. The prospectus describes Blackberrys adopting checkout in Fiscal 2023 and later
      adding Domestic Shipping, with reported improvements in prepaid orders and conversion; the filing
      expressly warns that Shiprocket may not have been the only cause. Cuspera summarizes reported
      outcomes for Krishna's Herbal & Ayurveda, Sardarji Papadwale, and Silver Hub USA, while Shiprocket's
      homepage carries seller testimonials such as Blur India and Phool. These examples show real workflow
      breadth, yet most lack contract scope, cohort definitions, baseline methodology, or independent
      customer confirmation. They should be treated as directional adoption proof, not representative
      retention or ROI evidence.
    claimRefs: [CU013, CU014]
    tableRefs: [TU003]
  - id: expansion-risk
    title: Expansion, concentration, and procurement friction
    body: >-
      Expansion within the installed base is the clearest commercial opportunity and the main execution
      test. Independent reporting says the share of core merchants using emerging products rose to 8.8%
      from 7.3% in Q1 FY27 and that 48,406 merchants were served by the emerging business, but also notes
      that adoption remains limited and the segment remains loss-making. Prospectus data show Power
      Merchant ARPU rising faster than Power Merchant count and top-ten revenue concentration declining
      to 12.19% in Fiscal 2026 from 16.23% in Fiscal 2024. A Decentro partner case shows payments
      onboarding at a smaller subset, while Shiprocket's own B2B guidance acknowledges multi-stakeholder,
      multi-touch buying cycles. This creates a credible land-and-expand loop, but procurement effort,
      partner dependence, and missing merchant-level churn data limit confidence in its durability.
    claimRefs: [CU006, CU007, CU009, CU010, CU011, CU012, CU016]
    figureRefs: [FU001]
