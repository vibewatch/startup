  - id: TM003
    title: Segment, buyer, user, and payer map
    columns:
      - Merchant segment
      - Buyer
      - Daily user
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Early D2C brand
        - Founder or head of operations
        - Shipping and customer-support staff
        - Brand entity
        - Compare carriers, print labels, track orders, and manage exceptions
        - Founder or operations
        - Order growth makes manual carrier coordination unreliable
      - - Established D2C brand
        - Operations or e-commerce leader
        - Warehouse, support, and growth teams
        - Brand entity
        - Shipping plus fulfillment, checkout, and marketing workflows
        - Operations with growth-team participation
        - Need to improve conversion, delivery reliability, or revenue per customer
      - - MSME or local online seller
        - Owner-operator
        - Owner or small operations team
        - Merchant entity
        - Nationwide parcel dispatch through a simple interface
        - Owner
        - Access to multiple carriers without direct enterprise contracts
      - - Omnichannel retailer
        - E-commerce or supply-chain leader
        - Store, warehouse, and order-management teams
        - Retail entity
        - Coordinate inventory and orders across channels
        - Supply chain or digital commerce
        - Fragmented channel operations and fulfillment complexity
      - - Cross-border seller
        - Founder, export, or operations leader
        - Trade and logistics staff
        - Exporting merchant
        - International shipping and trade enablement
        - Export or operations
        - Expansion beyond domestic demand
      - - Quick-commerce supplier
        - Supply-chain or marketplace leader
        - Inventory and dispatch teams
        - Brand or supplier
        - Scheduled movement into dark stores or fulfillment centers
        - Supply chain
        - Need for predictable replenishment and channel access
    notes: >-
      Product workflows are source-backed; buyer, user, payer, and budget-owner roles
      are analytical inferences that require customer interviews and procurement data
      before they can be treated as verified segmentation.
    claimRefs:
      - CM009
      - CM010
      - CM011
      - CM012
figures:
  - id: FM001
    title: Evidence-constrained addressability filters
    type: pyramid
    summary: >-
      A conceptual narrowing from broad commerce activity to the merchant cohort that
      could adopt and pay for Shiprocket's adjacent products.
    data:
      items:
        - label: Indian digital commerce
          value: ₹8 lakh crore
          unit: 2026 analyst estimate
          detail: Broad channel activity; not Shiprocket-addressable revenue.
        - label: D2C merchant economy
          value: $10-12B
          unit: current market estimate
          detail: Relevant merchant channel, with a separate $60B scenario for 2030.
        - label: Smaller-city D2C demand
          value: 66%
          unit: share of new FY26 D2C orders
          detail: Tier-2 and Tier-3 cities' reported share of new D2C orders.
        - label: Outsourced multi-carrier need
          value: Not publicly quantified
          unit: merchant workflow filter
          detail: Sellers that cannot efficiently build direct carrier integrations and operations.
        - label: Reachable Shiprocket merchant base
          value: 2.22 lakh
          unit: reported Q1 FY27 merchant network
          detail: Inc42's reported network; not reconciled to the company's 4 lakh+ businesses claim.
        - label: Adjacent-product adopters
          value: 8.8%
          unit: core merchants in Q1 FY27
          detail: Reported share using emerging products; the monetizable cohort is not disclosed.
    approximationNotes: >-
      Conceptual screening hierarchy only, not a proportional or mathematically nested
      TAM/SAM/SOM pyramid. Currencies, periods, populations, and definitions are not
      normalized; displayed values are repeated from TM002 or explicitly qualified.
    claimRefs:
      - CM003
      - CM004
      - CM005
      - CM009
      - CM011
      - CM012
callouts:
  - calloutType: insight
    title: Tailwinds do not equal Shiprocket TAM
    body: >-
      D2C, smaller-city, and quick-commerce growth expand merchant logistics demand,
      but no retained source discloses the take rate or eligible shipment pool needed
      to convert those channel estimates into company revenue opportunity.
    claimRefs:
      - CM001
      - CM003
      - CM004
      - CM005
  - calloutType: risk
    title: Supplier leverage can absorb market growth
    body: >-
      Vendor concentration, non-exclusive logistics relationships, and historical
      carrier price increases mean that shipment growth may not translate
      proportionally into contribution margin.
    claimRefs:
      - CM014
      - CM015
