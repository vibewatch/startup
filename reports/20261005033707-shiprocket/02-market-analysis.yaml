company:
  name: Shiprocket
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Shiprocket addresses the commerce-enablement layer between online merchants and
    third-party logistics networks, with Indian D2C, smaller-city demand, and
    quick-commerce supply flows providing growth tailwinds. Public evidence supports
    several demand lenses but not a defensible bottom-up SAM or SOM, while limited
    adjacent-product adoption and concentrated vendor costs constrain how much of the
    broad opportunity can be monetized.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Shiprocket's relevant market is narrower than Indian logistics as a whole and
      broader than parcel-rate aggregation. The core boundary is software-enabled
      commerce infrastructure for merchants that need to select and coordinate
      third-party carriers; adjacent spend includes fulfillment, checkout, marketing
      tools, cross-border enablement, and financial tools. Shiprocket presents all of
      those categories on its own product surface, while independent coverage describes
      its role as a layer between merchants and fragmented delivery networks. Carrier
      fleet ownership, marketplace consumer demand, advertising media, merchandise
      value, customs duties, and lender balance sheets should therefore be excluded
      unless Shiprocket directly earns revenue from them. Status-quo substitutes include
      direct carrier contracts, marketplace logistics, spreadsheets and manual
      operations, and an internally built logistics stack; the last option is more
      feasible for large retailers than for small sellers.
    claimRefs:
      - CM009
      - CM010
      - CM015
    tableRefs:
      - TM001
  - id: evidence-constrained-sizing
    title: Evidence-constrained sizing
    body: >-
      The evidence indicates a favorable demand backdrop but does not yield one
      auditable TAM. Economic Times coverage cites a 20-25% Indian e-commerce CAGR
      through 2030 and a Unicommerce-derived D2C estimate of $10-12 billion today,
      potentially reaching $60 billion by 2030. A separate Equirus lens places 2026
      digital commerce at ₹8 lakh crore and quick commerce at ₹1.08 lakh crore, growing
      40% year on year. These figures use different currencies, scopes, dates, and
      methods and cannot be added or treated as Shiprocket-addressable revenue. The
      stronger operational signal is that Tier-2 and Tier-3 cities reportedly supplied
      66% of new FY26 D2C orders, although Shiprocket's own mobile-commerce data also
      shows seasonality and an unexplained February trough. Public equity value is
      likewise a valuation output, not market size.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
      - CM007
      - CM008
      - CM016
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: buyers-and-adoption
    title: Buyers, users, payers, and adoption path
    body: >-
      The practical entry buyer is usually the merchant operator responsible for
      shipping reliability and cost, while daily users sit in operations, warehouse,
      customer-support, and growth teams. The payer is the merchant entity, but the
      budget can migrate from logistics operations into commerce software or marketing
      as more products are adopted. This role map is an analytical inference from the
      sourced product set rather than a disclosed procurement study. The observable
      adoption path starts with a recurring shipping workflow, then extends to
      fulfillment, checkout, omnichannel, martech, or cross-border services. Inc42
      reported a 2.22 lakh merchant network in Q1 FY27, yet only 8.8% of core merchants
      used emerging products. That gap makes installed-base conversion more important
      than a broad headline market estimate.
    claimRefs:
      - CM009
      - CM010
      - CM011
      - CM012
      - CM013
    tableRefs:
      - TM003
  - id: drivers-constraints-valuation
    title: Adoption drivers, constraints, and valuation relevance
    body: >-
      Adoption is supported by D2C order growth, demand outside major metros, merchant
      outsourcing, and the operational complexity of selecting among carriers.
      Shiprocket can potentially capture more spend without owning fleets by embedding
      adjacent tools in a high-frequency shipping workflow. The constraints are equally
      material: the official mobile dataset shows a sharp seasonal decline, Inc42 says
      emerging products remain loss-making despite fast growth, and Outlook Business
      reports that merchant-solution costs were 69.39% of FY26 expenses with the top ten
      vendors contributing 55.24%. Historical carrier price increases show that
      suppliers can exert bargaining power. Valuation should therefore be tied to
      merchant retention, realized take rates, contribution margin, and profitable
      cross-sell—not to gross merchandise value or broad e-commerce forecasts that
      Shiprocket does not itself recognize as revenue.
    claimRefs:
      - CM002
      - CM003
      - CM006
      - CM012
      - CM013
      - CM014
      - CM015
      - CM016
tables:
  - id: TM001
    title: Market definition and boundary
    columns:
      - Segment or category
      - Included spend
      - Excluded spend
      - Buyer or payer
      - Relevance to Shiprocket
    rows:
      - - Multi-carrier domestic shipping
        - Aggregation software, shipment orchestration, labels, tracking, and merchant-facing service fees
        - Carrier fleet ownership, fuel, and the carrier's unretained delivery economics
        - D2C brand, MSME, or retailer
        - Core entry workflow and recurring merchant touchpoint
      - - Fulfillment and bulk logistics
        - Warehousing, packaging, dispatch coordination, and B2B bulk-shipping services
        - Merchant inventory value and third-party warehouse assets not economically owned by Shiprocket
        - Operations or supply-chain leader
        - Adjacent operational spend sold around shipping
      - - Checkout and martech
        - Checkout, address intelligence, advertising tools, and merchant marketing software
        - Consumer merchandise value and external advertising media spend not retained by Shiprocket
        - E-commerce or growth leader
        - Higher-frequency data monetization and cross-sell opportunity
      - - Cross-border enablement
        - International shipping and trade-enablement services
        - Customs duties, taxes, and merchandise value
        - Exporting brand or merchant
        - Expands geography but adds execution and regulatory complexity
      - - Capital and financial tools
        - Financing enablement and merchant financial tools
        - Lender balance sheet and principal unless contractually borne by Shiprocket
        - Founder, owner, or finance leader
        - Adjacent monetization; public economics remain undisclosed
      - - Status quo and substitutes
        - Direct carrier contracts, marketplace logistics, manual workflows, or internally built software
        - Not applicable
        - Merchant management
        - Sets the switching threshold and caps aggregation pricing power
    notes: >-
      Boundary is synthesized from Shiprocket's current product descriptions and
      independent descriptions of its merchant-to-carrier role; excluded spend is an
      analytical boundary, not a disclosed segment-revenue reconciliation.
    claimRefs:
      - CM009
      - CM010
      - CM015
