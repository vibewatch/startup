evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: cumulative-funding
    missingEvidence: >-
      Audited financing schedule reconciling gross primary capital, secondary transactions, debt, currency conversion,
      and the USD 320 million versus USD 336.1 million public totals.
    whyItMatters: >-
      Total capital raised is not cash available, but the reconciled history is needed to assess dilution, capital
      efficiency, and investor entry prices.
    diligencePath: >-
      Obtain the prospectus financing history, statutory allotment records, and a company-certified pre-IPO
      capitalization table.
    relatedQuestionRefs:
      - QO003
  - type: enumeration-incomplete
    severity: material
    topic: governance-and-ownership
    missingEvidence: >-
      Complete current executive roster, board and committee composition, founder responsibilities, post-IPO ownership,
      lockups, and investor governance rights.
    whyItMatters: >-
      The partial founder and investor lists cannot establish succession readiness, board independence, control, or
      present economic exposure.
    diligencePath: >-
      Review current exchange filings, the final prospectus, board charters, employment agreements, and the latest
      beneficial-ownership register.
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Current market capitalization, diluted share count, employee headcount, active paying merchant count, physical
      location count, and unrestricted cash after IPO uses.
    whyItMatters: >-
      These figures are necessary to distinguish registered reach from active scale and to assess capitalization and
      operating capacity at the run date.
    diligencePath: >-
      Obtain current exchange data, the latest filed quarterly statements, HRIS extracts, active-merchant cohort
      reports, and the post-offer cash bridge.
    relatedQuestionRefs:
      - QO004
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: milestone-completeness
    missingEvidence: >-
      Primary documentation for acquisitions, material partnerships, regulatory milestones, leadership changes, and
      adverse operating events.
    whyItMatters: >-
      The timeline currently emphasizes product origin, financing, and listing milestones and should not be treated as a
      complete corporate chronology.
    diligencePath: >-
      Reconcile exchange announcements, statutory filings, acquisition agreements, board minutes, and incident
      registers.
    relatedQuestionRefs:
      - QO005
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A directly sourced shipment pool, realized take rate, eligible merchant count, and segment revenue bridge
      sufficient to calculate bottom-up TAM, SAM, and SOM.
    whyItMatters: >-
      Broad commerce GMV and growth forecasts cannot be converted into Shiprocket revenue opportunity without these
      denominators.
    diligencePath: >-
      Obtain the current prospectus and management market model, then reconcile eligible shipments, merchant cohorts,
      take rates, and retained revenue by product and geography.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Merchant-level budget ownership, product-level willingness to pay, retention, gross margin, and contribution
      economics for emerging products.
    whyItMatters: Fast adjacent revenue growth does not establish durable adoption or profitable monetization.
    diligencePath: >-
      Review cohort-level product attach, retention, pricing, and contribution-margin data and interview merchants
      across D2C, MSME, omnichannel, and cross-border segments.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: merchant-scale
    missingEvidence: >-
      Reconciled definitions for Shiprocket's company-claimed 4 lakh+ businesses or sellers and Inc42's reported 2.22
      lakh Q1 FY27 merchant network.
    whyItMatters: >-
      Unmatched registered, served, transacting, and core-merchant denominators can materially distort penetration and
      cross-sell estimates.
    diligencePath: >-
      Request monthly active, transacting, retained, core, power, and emerging-product merchant counts with explicit
      cohort and period definitions.
    relatedQuestionRefs:
      - QM004
      - QM008
      - QM009
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: mobile-commerce-methodology
    missingEvidence: >-
      Sampling, merchant coverage, order deduplication, channel inclusion, and geographic classification methodology for
      Shiprocket's mobile-commerce dataset.
    whyItMatters: >-
      The published order and city-tier values cannot be generalized to the Indian market without knowing the dataset
      boundary.
    diligencePath: >-
      Obtain the Shiprocket Trends methodology note and compare its coverage with an independent industry dataset for
      the same November 2025-February 2026 period.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: courier-take-rates
    missingEvidence: >-
      Granular breakdown of realized courier freight margin spreads and take-rates across Shiprocket's top five
      logistics partners.
    whyItMatters: >-
      Direct courier margins determine whether Shiprocket can sustain aggressive price cuts against zero-subscription
      rival aggregators.
    diligencePath: >-
      Review carrier contract schedules and merchant freight margin disclosures in IPO filings and quarterly investor
      presentations.
    relatedQuestionRefs:
      - QP004
      - QP006
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: enterprise-churn-rates
    missingEvidence: >-
      Audited merchant churn data specifically isolating high-volume D2C brands graduating from Shiprocket to direct
      carrier SaaS setups like ClickPost.
    whyItMatters: >-
      Validates whether large merchants systematically outgrow aggregator models once monthly shipment volume crosses
      enterprise thresholds.
    diligencePath: Analyze customer cohort retention metrics by order-volume tiers from merchant survey disclosures.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: gross-margin-breakout
    missingEvidence: >-
      Direct breakout of carrier freight purchase payments to 3PL couriers versus net shipping revenue retention across
      weight slabs.
    whyItMatters: >-
      Without carrier cost breakdowns, true gross margin and pricing power versus major 3PL courier partners cannot be
      precisely underwritten.
    diligencePath: Request audited segment-level cost of goods sold and courier vendor rate cards in management diligence sessions.
  - type: private-evidence-only
    severity: material
    topic: credit-default-exposure
    missingEvidence: >-
      Default rates, non-performing asset provisions, and balance-sheet risk sharing for loans originated via Shiprocket
      Capital.
    whyItMatters: >-
      Expanding working capital and revenue-based financing exposes Shiprocket to credit risk in high Cash-on-Delivery
      environments.
    diligencePath: Review NBFC partnership agreements and loan book default performance metrics under non-disclosure.
  - type: private-evidence-only
    severity: material
    topic: wms-integration-architecture
    missingEvidence: >-
      Granular technical specifications detailing how Shiprocket's fulfillment centers operate internally without a
      native proprietary WMS, or the specific commercial third-party WMS software deployed across its 42+ leased
      warehouses.
    whyItMatters: >-
      Directly affects underwriting assumptions regarding operational warehouse throughput, picking error rates, and
      capital intensity.
    diligencePath: >-
      Request warehouse management systems architecture diagrams, software vendor contracts, and picking error rate logs
      across leased fulfillment hubs during management diligence.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: minor
    topic: model-accuracy-benchmarks
    missingEvidence: >-
      Independent quantitative evaluation of Sense AI address verification error rates and RTO prediction precision
      across Tier-2 and Tier-3 Indian postal codes.
    whyItMatters: >-
      Validates whether AI address cleansing yields statistically significant conversion and return-rate improvements
      compared to standard pin-code lookups.
    diligencePath: >-
      Review internal confusion matrices and ROC-AUC benchmark reports for Sense AI and fastrr Checkout RTO scoring
      models.
    relatedQuestionRefs:
      - QE005
      - QE006
  - type: private-evidence-only
    severity: material
    topic: merchant-retention
    missingEvidence: Merchant GRR, NRR, logo churn, renewal rates, contract duration, and retained-account cohorts by customer segment.
    whyItMatters: >-
      Transaction-volume retention can rise even if merchant accounts churn, so it does not establish contractual or
      logo durability.
    diligencePath: >-
      Request monthly merchant cohorts, gross and net revenue retention bridges, churn reasons, renewal terms, and
      segment-level retention from management.
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A complete current customer reference list with contract status, production scope, baselines, denominators, and
      customer-confirmed outcomes.
    whyItMatters: >-
      Selective company and aggregator examples cannot establish how representative outcomes are or whether deployments
      remain active.
    diligencePath: >-
      Sample signed contracts and invoices, conduct reference calls across merchant sizes and products, and reconcile
      disclosed case-study metrics to customer records.
    relatedQuestionRefs:
      - QU010
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Individual top-customer shares, product and courier exposure, contract terms, and revenue concentration below the
      top-ten aggregate.
    whyItMatters: >-
      The declining top-ten percentage does not reveal dependence on a single merchant, channel, product, or partner
      relationship.
    diligencePath: Obtain anonymized top-25 merchant revenue, gross margin, product mix, tenure, renewal, and churn-risk schedules.
    relatedQuestionRefs:
      - QU006
  - type: missing-source
    severity: material
