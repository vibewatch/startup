callouts:
  - calloutType: "insight"
    title: "Valuation Reset and Multiple Compression"
    body: |
      Shiprocket's August 2026 public listing at a valuation of approximately $1.1 billion represents a constructive rationalization compared to private secondary discussions and peak unicorn valuations of $1.21B–$1.30B. By pricing the initial public offering at ₹92–₹97 per share, the company attracted top-tier institutional demand without creating an onerous post-listing overhang.
    claimRefs:
      - "CV006"
      - "CV007"
      - "CV009"

  - calloutType: "risk"
    title: "The Emerging Segment Margin Dilemma"
    body: |
      While Shiprocket's emerging business line expanded 70% year-over-year in Q1 FY27 to ₹180.4 crore, driven by a 193% surge in martech, it generated lower realization per transaction and remained deeply unprofitable with an adjusted EBITDA margin of -24.3%. Core shipping profits (₹52.7 crore adjusted EBITDA) are currently subsidizing this expansion, creating execution vulnerability if core transport margins compress.
    claimRefs:
      - "CV003"
      - "CV011"
      - "CV012"
      - "CV013"

