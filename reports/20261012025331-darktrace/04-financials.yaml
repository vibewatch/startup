"chapter":
  "number": 4
  "title": "Financials"
  "summary": "Assigned public evidence supports a custom-priced, modular enterprise platform and continued customer expansion, but it does not disclose current revenue, margins, cash, burn, leverage, or retention. That sponsor-era opacity prevents quantitative underwriting despite a reported customer footprint approaching 10,000 by August 2025."
"sections":
- "id": "revenue-model-and-pricing"
  "title": "Revenue Model and Pricing"
  "body": "Darktrace presents one behavioral-defense architecture spanning AI, people, and infrastructure, while a company-issued release says Email and OT capabilities can also be purchased as stand-alone products. A third-party review describes custom enterprise pricing tied to monitored IP addresses, cloud accounts, and email users, rather than a public rate card. The same review estimates annual prices of $30,000-$50,000 for deployments up to 300 IPs, $75,000-$200,000 for 300-2,000 IPs, and $200,000 or more above 2,000 IPs, but these are review-site estimates rather than company quotes or realized contract values. A free 30-day proof of value may lower initial evaluation friction. The evidence therefore supports a modular, usage-scaled commercial model, but not revenue mix, contract duration, discounting, revenue recognition, or realized average contract value."
  "claimRefs":
  - "CI001"
  - "CI002"
  - "CI003"
  - "CI004"
  - "CI005"
  - "CI006"
  "tableRefs":
  - "TI001"
  "figureRefs":
  - "FI001"
- "id": "distribution-traction-and-sales-efficiency"
  "title": "Distribution, Traction, and Sales-Efficiency Proxies"
  "body": "The route to market combines direct platform selling with service and reseller channels. Cyberseer markets Darktrace alongside 24/7 monitoring, investigation, and response services, while Darktrace says its Bechtle partnership provides access to Bechtle's roughly 70,000 customers and includes financial incentives for growth. These relationships can extend distribution, but the assigned evidence does not disclose referral fees, reseller discounts, channel mix, CAC, sales-cycle length, or payback. Public footprint figures show direction rather than audited economics: a company-issued April 2024 release reported more than 9,200 customers and 2,300 employees; Darktrace reported more than 9,700 customers and 2,400 employees in September 2024; and Technology Magazine reported nearly 10,000 customers with more than 2,400 employees in August 2025. The sequence suggests continued customer expansion, while the nearly flat disclosed workforce proxy could indicate operating leverage; neither\
    \ inference substitutes for revenue, retention, cohort, or cost data."
  "claimRefs":
  - "CI007"
  - "CI008"
  - "CI009"
  - "CI010"
  - "CI011"
  "tableRefs":
  - "TI002"
- "id": "capital-adequacy-and-underwriting-gaps"
  "title": "Capital Adequacy and Underwriting Gaps"
  "body": "Tracxn reports $239 million of cumulative funding, while Summit Partners describes Thoma Bravo's approximately $5.3 billion acquisition and its own exit in October 2024. Those figures establish historical financing and transaction context, not current cash available, debt capacity, or sponsor support. The assigned source set provides no verified current revenue or ARR bridge, gross margin, CAC or payback, cash balance, burn, runway, debt principal, interest cost, covenant headroom, working-capital profile, or capex. It also does not provide revenue concentration, renewal, or net-retention data. The adverse pricing review adds that the product may be infeasible for small businesses and that ROI can be difficult to quantify where buyers lack prior breach experience. Financially, Darktrace may have an attractive modular enterprise model and visible customer scale, but revenue quality, margin durability, capital intensity, and financing dependency remain unratable until sponsor-era\
    \ statements and cohort economics are produced."
  "claimRefs":
  - "CI012"
  - "CI013"
  - "CI014"
  - "CI015"
  - "CI016"
