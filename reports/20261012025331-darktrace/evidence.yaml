evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sponsor-era-financials
    missingEvidence: >-
      Audited financial statements for FY2025 and FY2026, including an exact ARR and revenue bridge from the June 2024
      public snapshot ($782.2M ARR) into current sponsor-backed private operations.
    whyItMatters: >-
      Without current audited financial disclosures, revenue growth rates, gross margins, net retention rates, and
      operational profitability cannot be independently verified.
    diligencePath: >-
      Request private sponsor financial bridge reports, lender compliance statements, or audited annual accounts filed
      with Companies House.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: debt-capital-structure
    missingEvidence: >-
      Comprehensive breakdown of debt principal, maturity dates, interest pricing margins, covenant thresholds, and
      lender syndication details behind the sponsor-backed credit facility.
    whyItMatters: >-
      Leverage and debt service obligations directly impact enterprise valuation, free cash flow generation, and
      financial risk profiles under private equity ownership.
    diligencePath: >-
      Review credit agreement disclosures, register of charges filings at Companies House, or confidential information
      memoranda from lead arrangers.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: private-governance-composition
    missingEvidence: >-
      Complete roster of Thoma Bravo operating partners, independent non-executive directors, and board committee
      assignments governing Darktrace post-delisting.
    whyItMatters: >-
      Governance transparency and committee oversight dictate strategic alignment, executive compensation incentives,
      and major transaction controls.
    diligencePath: >-
      Inspect updated statutory director filings at Companies House and corporate registry records for Darktrace Midco
      and Topco entities.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: private-operating-metrics
    missingEvidence: >-
      Audited FY2025–FY2026 revenue, Annual Recurring Revenue (ARR), module expansion breakdown, and net revenue
      retention figures under Thoma Bravo ownership.
    whyItMatters: >-
      Prevents exact empirical sizing of Darktrace's captured market share (SOM) relative to the $4.0B–$4.4B NDR
      addressable market in the current private period.
    diligencePath: >-
      Review confidential sponsor reporting, debt investor presentation packages, or future Companies House annual
      accounts.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: competitor-displacement-benchmarks
    missingEvidence: >-
      Independent, third-party win/loss benchmark studies and telemetry data comparing Darktrace's actual enterprise
      alert volume and false-positive rates directly against Vectra AI and Stellar Cyber under controlled SOC
      conditions.
    whyItMatters: >-
      Current comparative displacement claims (such as Vectra AI's cited 91% competitive win rate and 85% alert
      reduction) stem exclusively from competitor marketing collateral rather than audited independent telemetry.
    diligencePath: >-
      Request customer references who migrated to or from Darktrace during technical evaluations, and review internal
      SOC proof-of-value telemetry reports comparing alert escalations and false-positive ratios.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: underwriting-gaps
    missingEvidence: >-
      Sponsor-era audited statements and schedules for revenue, ARR, margins, cash flow, cash, debt, interest,
      maturities, covenants, capex, and working capital.
    whyItMatters: >-
      Without these inputs, revenue quality, margin durability, financing dependency, debt service, and runway cannot be
      underwritten.
    diligencePath: >-
      Request FY2025-FY2026 audited statements, monthly management accounts, ARR bridge, cash-flow statement, debt
      agreements, covenant certificates, and lender reports in the data room.
    relatedQuestionRefs:
      - QI004
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Observed customer contracts or invoices showing list price, realized price, term, discount, module mix, services,
      and renewal economics.
    whyItMatters: >-
      One review site's estimated ranges cannot establish realized ARR, discounting, contract quality, or channel
      economics.
    diligencePath: Sample direct and partner contracts by segment and reconcile bookings, billings, ARR, and recognized revenue.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI003
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: >-
      Current gross retention, net retention, churn, downsell, cohort expansion, customer concentration, and module
      attach rates.
    whyItMatters: Customer-count growth alone cannot establish recurring-revenue quality or efficient cross-sell.
    diligencePath: Obtain quarterly customer and ARR cohorts by segment, geography, route to market, and module.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: telemetry-overhead-and-false-positive-benchmarks
    missingEvidence: >-
      Audited third-party performance benchmarks documenting false-positive frequencies and processing latency/compute
      overhead for Darktrace's unsupervised models under peak enterprise traffic.
    whyItMatters: >-
      Autonomous response and behavioral anomaly detection can disrupt production systems if false-positive containment
