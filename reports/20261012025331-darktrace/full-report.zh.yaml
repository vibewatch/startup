      - number: '3.4'
        title: 切换成本、分销伙伴与防御性
        blocks:
          - type: paragraph
            body: >-
              Darktrace 的长期竞争防御力依托深度行为数据整合、专有响应自动化和战略渠道分销 CP001、CP006、CP011。部署到企业混合基础设施后，软件会建立无法替代的机构行为历史基线，无法迁移给新供应商
              CP002、CP013。替换 Darktrace 会迫使安全团队承担明显的切换成本，包括竞争者重新训练期间的盲点、SOC 运营手册中断，以及既有 Antigena 自主响应阈值的损失
              CP006、CP013。为扩大对美国终端巨头的市场覆盖，Darktrace 利用 Bechtle 等高量渠道联盟；后者可接触欧洲约 70,000 个企业和公共部门账户 CP011。此外，Cyberseer
              等托管检测伙伴把 Darktrace 直接嵌入托管 SOC 服务，提升账户黏性 CP006。不过，厂商声称的赢单率和激进的竞争营销，也凸显出持续尽调需求：需独立核实平台整合压力下的企业替换模式
              CP004、CP010、CP014。
            claimRefs:
              - CP001
