      - number: '5.3'
        title: 企业工作流、使用场景与运营遏制
        blocks:
          - type: paragraph
            body: >-
              在企业 SOC 工作流中，Darktrace
              通过改变事件的呈现、调查和中和方式，把被动告警分诊转为自动化的主动韧性。传统安全信息与事件管理（SIEM）工作流要求分析师手动查询多个仪表盘、重建事件时间线，并判断异常连接是正常管理行为还是正在发生的入侵。Darktrace
              的 Cyber AI Analyst 通过关联电子邮件、网络和终端向量中的不同异常，自动推进调查，在数秒内生成结构化自然语言摘要和根因诊断，而不是耗费数小时。威胁构成迫近风险时，Darktrace
              Antigena 自主响应技术会以机器速度实施精准遏制，例如隔离被攻陷的笔记本电脑、终止未经授权的命令与控制套接字，或暂时锁定用户会话。除实时遏制外，平台的 Attack Surface Management 和
              Proactive Exposure Management 模块持续模拟攻击者侦察路径，并按实际内部可达性排列漏洞优先级，减少对定期第三方漏洞扫描器的依赖。
            claimRefs:
              - CE002
              - CE004
              - CE009
              - CE013
              - CE014
          - type: table
