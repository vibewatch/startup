      - CM001
      - CM002
      - CM006
      - CM014
  - id: FP001
    title: 竞争定位：架构广度与自主响应深度
    type: quadrant
    summary: 按企业遥测覆盖广度和机器速度自主修复能力，绘制核心威胁检测替代方案。
    approximationNotes: 坐标是基于证据的 1.0 至 5.0 序数评估，衡量多域遥测广度和自主修复成熟度，评估依据为平台技术披露。
    claimRefs:
      - CP003
      - CP008
      - CP013
      - CP014
    data:
