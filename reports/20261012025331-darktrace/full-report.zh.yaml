    rows:
      - - 乐观情景
        - ARR 每年增长超过 25%，到 FY2027 超过 $1.2B；净留存率达到 110%；平台通过 Bechtle 和全球渠道扩大交叉销售
        - 企业价值达到 $7.5B–$9.0B（约为 ARR 的 7.0–7.5 倍）；支持发起方通过高回报二次出售或 IPO 获得回报
        - 欧洲企业 IT 支出放缓，或发生重大企业误报丑闻
        - 25%
      - - 基准情景（预期）
        - ARR 以稳定的 12%–16% CAGR 增长至 $950M–$1.0B；毛利率稳定在约 89%；适度折扣维持交易速度
        - 企业价值维持在 $5.3B–$6.2B（约为 ARR 的 5.5–6.0 倍）；偿债后为私募股权提供基准回报
        - Microsoft 和 CrowdStrike 激进捆绑销售，压缩新增客户数量
        - 50%
      - - 悲观情景
        - ARR 增长放缓至 8% 以下；年度续签涨价引发客户反弹；债务偿付负担限制研发
        - 估值压缩至 $3.5B–$4.2B（约为 ARR 的 4.0–4.5 倍）；债务悬顶在最终退出时损害股权价值
        - Darktrace 基础设施遭入侵，或违反 Goldman Sachs 债务融资契约
        - 25%
    notes: 情景预测以 Thoma Bravo 于 2024 年 10 月入场时 $5.3B 的企业价值为基准。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV011
      - CV012
      - CV015
figures:
  - id: FO001
    title: Darktrace 公司与技术演进时间线
    type: timeline
    summary: Darktrace 从剑桥大学研究项目走向私募股权所有权过程中的公司、技术、融资和监管关键节点。
    approximationNotes: 节点日期来自官方新闻稿、监管公告和投资伙伴交易日期。
    claimRefs:
      - CO001
      - CO003
      - CO004
      - CO006
      - CO007
      - CO010
      - CO011
      - CO012
      - CO014
      - CO016
    data:
      items:
        - label: 公司成立
          date: 2013-06
          tone: positive
          detail: Darktrace 由剑桥大学数学家和 GCHQ 网络情报专家在英国剑桥创立。
          claimRefs:
            - CO001
            - CO003
        - label: 企业免疫系统
          date: 2013-11
          tone: positive
          detail: Enterprise Immune System 商业化发布，采用无监督机器学习检测网络异常。
          claimRefs:
            - CO003
        - label: B 轮融资
          date: 2015-07
          tone: positive
          detail: Summit Partners 领投 $22.5 million B 轮融资，加速全球企业扩张。
          claimRefs:
            - CO010
        - label: Antigena 自主响应
          date: 2016-04
          tone: positive
          detail: Darktrace 推出 Antigena，实现以机器速度自主遏制活跃网络威胁。
          claimRefs:
            - CO003
            - CO010
        - label: C 轮成长融资
          date: 2016-07
          tone: positive
          detail: 获得 $65 million 成长轮融资，由 Summit Partners、KKR 和 SoftBank 关联基金支持。
          claimRefs:
            - CO010
            - CO012
        - label: WannaCry 勒索软件防御
          date: 2017-05
          tone: positive
          detail: 全球疫情暴发期间，Antigena 技术在数秒内成功响应并隔离客户端点。
          claimRefs:
            - CO010
        - label: 伦敦证券交易所 IPO
          date: 2021-04
          tone: positive
          detail: 在伦敦证券交易所完成首次公开募股（DARK.L），估值 £1.7 billion（$2.37 billion）。
          claimRefs:
            - CO004
            - CO010
        - label: LockBit 事件调查
          date: 2023-04
          tone: adverse
          detail: 勒索软件组织虚称内部系统遭入侵；CISO 取证调查确认系统未被攻破。
          claimRefs:
            - CO016
        - label: ActiveAI 安全平台
          date: 2024-04
          tone: positive
          detail: 发布 ActiveAI Security Platform 和 Behavioral Defense 套件，统一 AI、网络、电子邮件和云。
          claimRefs:
            - CO005
            - CO014
        - label: 领导层交接
          date: 2024-09
          tone: neutral
          detail: Jill Popelka 出任首席执行官，接替创始 CEO Poppy Gustafsson。
          claimRefs:
            - CO007
        - label: Thoma Bravo 私有化
          date: 2024-10
          tone: positive
          detail: Thoma Bravo 完成 $5.3 billion 全现金收购，Darktrace 从伦敦证券交易所退市。
          claimRefs:
            - CO004
            - CO011
  - id: FM001
    title: 市场规模金字塔：NDR 与行为遥测层
    type: pyramid
    summary: 从全球网络检测与响应支出到已捕获企业平台规模的分层市场规模。
    data:
      items:
        - label: 全球网络检测与响应（NDR）市场
          value: 4200
          unit: USD M
          detail: 独立共识估算认为，2026 年全球 NDR 市场规模为 $4.0B–$4.4B。
        - label: 托管 NDR 与外包安全服务
          value: 1470
          unit: USD M
          detail: 中型市场团队将 24/7 SOC 分诊外包，因此托管服务约占 NDR 市场总收入的 35%。
        - label: 可服务行为网络防御市场（SAM）
          value: 2250
          unit: USD M
          detail: 重点在云、电子邮件和网络遥测等多环境中部署行为异常检测的组织。
        - label: 企业软件纯 NDR 支出
          value: 1200
          unit: USD M
          detail: 用于内部流量检查的直接企业软件许可，不含外包托管监控。
        - label: 多模块行为平台采用者
          value: 650
          unit: USD M
          detail: 企业部署互联的行为检测，覆盖网络、电子邮件、云工作负载和 OT。
        - label: Darktrace 基线捕获运营规模
          value: 782
          unit: USD M ARR
          detail: 据报道，私有化交易前公开市场时期的规模超过 $782M ARR，拥有 9,700 家全球客户。
    approximationNotes: 市场分层取 Grand View Research、MarketsandMarkets 和 MarketIntelo 分析师区间的中点，并与 Darktrace 历史公开基线比较。
