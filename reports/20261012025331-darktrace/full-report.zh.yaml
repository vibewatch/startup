  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与架构基础
        blocks:
          - type: paragraph
            body: >-
              Darktrace 运营 AI
              原生行为网络安全平台，旨在保护复杂企业数字资产免受未知、多向量和机器速度威胁。平台不主要依赖静态特征数据库、规则或历史攻击哈希，而是部署无监督机器学习、异常检测模型和聚类算法，持续学习组织内每台设备、每个用户、每条网络连接及每种工作负载的正常行为。通过生成名为
              Unique Behavioral Profile 的个性化数学基线，Darktrace
              可在公开入侵指标出现前，发现暗示新型零日漏洞、内部滥用或寄生式攻击技术的细微偏差。核心算法在客户环境本地运行，确保敏感组织遥测在源头处理，而不是汇总到共享多租户数据湖。实时遥测摄取覆盖网络数据包、终端执行、云
              VPC 流量、身份提供商和消息网关，并输入 Cyber AI Analyst 引擎进行自动分诊，输入 Threat Visualizer 控制台重放调查进程。
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE005
              - CE012
