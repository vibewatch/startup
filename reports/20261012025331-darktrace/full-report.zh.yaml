      - number: '5.4'
        title: 技术栈、部署架构与技术风险
        blocks:
          - type: paragraph
            body: >-
              在混合企业环境中部署无监督自主平台，会带来独特的架构依赖、运营扩展约束和治理考量。中央管理通过 ActiveAI Security Portal 协调，提供统一单点登录、细粒度基于角色的权限，以及与
              ServiceNow 等外部 SIEM、SOAR 和 IT 服务管理系统的标准化 API 集成。在融合型工业环境中，Darktrace OT 集成针对 Fortinet FortiGate
              的专用防火墙规则分析器，以及 GE-SRTP、Mitsubishi MELSOFT
              等工业标准的原生协议解码器，让运营技术工程师能在专用仪表盘上监控厂区通信。但无需人工预批准即可自主遏制的架构能力，也构成重大运营风险：如果关键工业控制器、医院遥测设备或高吞吐支付处理流水线发生误报遏制，可能导致计划外停机。因此，企业部署需要正式的人工审核治理政策、明确的排除边界和持续的敏感度阈值校准，在机器速度防御与业务连续性之间取得平衡。
            claimRefs:
              - CE003
              - CE005
              - CE007
              - CE009
              - CE011
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
