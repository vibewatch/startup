  - id: FI001
    title: 受证据边界约束的收入模型桥接
    type: flow
    summary: 公开证据识别出商业步骤，但从合同到毛利的价值转化仍未披露。
    data:
      nodes:
        - id: evaluation
          label: 30 天价值验证
          detail: 第三方评测描述了一次免费评估；转化经济性未披露。
        - id: scope
          label: 部署范围
          detail: 据报道，受监控 IP 地址、云账户和电子邮件用户数是定价输入。
        - id: platform
          label: 平台合同
          detail: 一套行为架构覆盖 AI、人员和基础设施。
        - id: modules
          label: 独立或附加模块
          detail: 电子邮件和 OT 可独立购买；模块组合和折扣未知。
        - id: channel
          label: 直销或伙伴分销
          detail: Cyberseer 和 Bechtle 展示了服务和经销商路径；经济性未知。
        - id: recognized-revenue
          label: 已确认收入
          detail: 指定证据中未公开合同期限、收入确认、ARR 桥接和集中度。
        - id: gross-profit
          label: 毛利与现金生成
          detail: 当前毛利率、交付成本、现金流和债务偿付均未验证。
      edges:
        - from: evaluation
          to: scope
        - from: scope
          to: platform
        - from: platform
          to: modules
        - from: modules
          to: channel
        - from: channel
          to: recognized-revenue
        - from: recognized-revenue
          to: gross-profit
    approximationNotes: 仅为概念序列；未推断转化率、比例宽度或财务数值。
    claimRefs:
      - CI001
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
      - CI016
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Darktrace ActiveAI 从物理遥测接入到高管治理和威胁可视化的六层架构层级。
    data:
      layers:
        - label: 用户交互与治理层
          detail: ActiveAI Security Portal、SOC 仪表盘和基于角色的策略管理
        - label: 威胁可视化与取证回放
          detail: Threat Visualizer 3D 界面，用于回放异常时间线和攻击者多阶段推进过程
        - label: 自主调查层
          detail: Cyber AI Analyst 自动关联跨域事件并追踪根因
        - label: 威胁遏制层
          detail: 自主响应引擎执行按比例微分段和连接中断
        - label: 行为建模与机器学习核心
          detail: 自学习 AI 对每个实体执行无监督异常检测和聚类
        - label: 跨域遥测与接入层
          detail: NEXT 代理将完整数据包与主机进程遥测、云 VPC 和 OT 协议结合
    approximationNotes: 架构分层综合自已发布的专利规格和企业产品文档。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE012
  - id: FU001
    title: Darktrace 客户采用生命周期与扩张回路
    type: journey-map
    summary: 从最初的网络 / 电子邮件评估到 ActiveAI 全域扩张的多阶段客户采用路径。
    data:
      items:
        - label: 阶段 1：价值验证（POV）
          detail: 潜在客户通过 30 天被动网络或电子邮件试用评估自学习 AI，发现潜在威胁。
          touchpoints:
            - 安装被动网络传感器覆盖范围
            - 首次威胁可视化高管汇报
        - label: 阶段 2：首次商业落地
          detail: 客户承诺部署核心 Network 或 Email 模块，保护主要威胁入口。
          touchpoints:
            - CISO 签署 1 至 3 年订阅
            - 启用活跃威胁遏制策略
        - label: 阶段 3：运营集成
          detail: 安全团队将 Cyber AI Analyst 工作流接入日常 SOC 告警分诊和 SIEM 数据流。
          touchpoints:
            - CrowdStrike 或第三方 SIEM/SOAR API 连接器
            - 采用自动化事件调查运行手册
        - label: 阶段 4：多域交叉销售
          detail: 客户扩大许可范围，覆盖 Cloud 工作负载、Microsoft Teams 和 OT 基础设施。
          touchpoints:
            - 增加 Darktrace/Email 和 Darktrace/Cloud 模块
            - 企业范围的 ActiveAI 平台许可
        - label: 阶段 5：多年续签与防御
          detail: 在厂商平台整合压力下，企业建立长期自主防御姿态。
          touchpoints:
            - 对照竞品 XDR 套件开展高管续签评审
            - 扩展到定制行为合规规则
        - label: 阶段 6：企业平台标准化
          detail: 客户在所有业务部门实现标准化，并接入威胁情报数据流。
          touchpoints:
            - 在国际子公司全球部署
            - 通过 CISO 仪表盘进行高管报告
    approximationNotes: 生命周期阶段依据客户部署案例、合作伙伴分销项目以及官方 ActiveAI 平台集成简报梳理而成。
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU009
