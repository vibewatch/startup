    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、情报根基与核心运营模式
        blocks:
          - type: paragraph
            body: >-
              Darktrace 于 2013
              年在英国剑桥创立，汇集剑桥大学信号处理实验室的数学家，以及拥有英国政府通信总部（GCHQ）运营背景的网络情报专家。创始团队的技术理念拒绝依赖静态威胁特征和预编程规则数据库的传统边界安全，转而认为无监督机器学习可以构建自适应的正常运营行为基线——“企业免疫系统”，从而实时发现新型、未知和内部攻击。得到
              Invoke Capital 早期支持后，公司从最初的网络异常监控扩展为综合安全平台，覆盖企业电子邮件、多云架构、终端和运营技术。2024 年 10 月，私募股权发起人 Thoma Bravo 以约 53
              亿美元的企业价值完成全现金收购，使 Darktrace 从伦敦证券交易所退市（公司于 2021 年 4 月上市，股票代码为 DARK.L），并转为由发起人支持的私营运营架构。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
