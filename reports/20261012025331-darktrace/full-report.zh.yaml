  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 逐步串联技术平台规模、发起方收购条款、债务不透明度与最终观察立场的逻辑链。
    data:
      nodes:
        - id: step-1
          label: 市场牵引力与技术护城河
          description: 超过 9,700 家企业客户、125+ 项专利以及自学习行为检测能力，构成了较强的技术规模。
        - id: step-2
          label: 私有化基准
          description: Thoma Bravo 于 2024 年 10 月以 $5.3 billion 的估值收购 Darktrace，正式确立私募股权支持方身份。
        - id: step-3
          label: 商业执行摩擦
          description: 现场证据显示，合同价格每年上调 3-7%、季度末大幅打折，以及品类 AI 的局限。
        - id: step-4
          label: 发起方时代的不透明度
          description: 私营公司身份掩盖了债务契约、收购后的 ARR 桥接以及当前烧钱速度指标。
        - id: step-5
          label: 风险收益失衡
          description: 约 6.8x ARR 的估值倍数合理，但在财务数据未经验证前，安全边际不足。
        - id: step-6
          label: 推荐：观察
          description: 在私营公司运营表现和债务结构披露之前，维持有纪律的观察立场。
      edges:
        - from: step-1
          to: step-2
        - from: step-2
          to: step-3
        - from: step-3
          to: step-4
        - from: step-4
          to: step-5
        - from: step-5
          to: step-6
    approximationNotes: 这条逻辑链定性权衡了已验证的市场牵引力与私营公司披露缺口。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV006
      - CV013
