      - number: '5.2'
        title: ActiveAI 平台模块与 SKU 图谱
        blocks:
          - type: paragraph
            body: >-
              商业平台通过 Darktrace ActiveAI Security Platform 交付，把主要数字运营领域的功能模块整合成行为防御架构。旗舰 Darktrace Network 模块通过物理网络 TAP 或
              SPAN 端口捕获完整数据包，分析东西向横向移动和南北向出口流量。为弥合主机进程和网络流之间长期存在的可见性断点，Darktrace 推出 Network Endpoint eXtended
              Telemetry（NEXT）代理，将终端进程执行树原生绑定到异常网络套接字，无需人工在多个控制台之间关联。Darktrace Cloud 通过无代理 API 和基于代理的遥测覆盖 Amazon Web
              Services、Microsoft Azure 和 Google Cloud；Darktrace Email 则把行为分析扩展到通信、自然语言内容和 Microsoft Teams
              等协作应用，提前阻断账户接管和商业邮件入侵。针对工业基础设施，Darktrace OT 对专有监控控制协议执行深度数据包检查，并拥有在剑桥和海牙研发设施提交的国际专利组合，专利申请超过 200 件。
