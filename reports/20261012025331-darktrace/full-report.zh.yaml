      - number: '1.2'
        title: 高管领导、治理结构与管理层交接
        blocks:
          - type: paragraph
            body: >-
              2024 年 9 月，在 Thoma Bravo 交易正式交割前，Darktrace 任命 Jill Popelka 为 CEO，接替创始 CEO Poppy Gustafsson。Popelka 在 SAP
              SuccessFactors、Snap Inc. 和 Accenture 等全球企业软件公司拥有二十多年高级运营管理经验。公司的技术根基仍由联合创始人及技术负责人支撑，包括 CTO Jack
              Stockdale、联合创始人兼战略高管 Nicole Eagan，以及首席信息安全官 Mike Beck。治理监督从伦敦证券交易所上市公司的董事会，转为由 Thoma Bravo
              运营合伙人和投资专业人士主导的私募发起人治理框架。现行公司架构下，详细的委员会章程、股权激励归属安排和非发起人少数股东代表情况仍属私密且未披露。
            claimRefs:
              - CO007
              - CO008
              - CO009
