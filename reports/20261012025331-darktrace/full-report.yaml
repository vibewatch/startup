  - id: FU001
    title: Darktrace Customer Adoption Lifecycle and Expansion Loops
    type: journey-map
    summary: >-
      Multi-stage customer adoption journey from initial network/email evaluation to full ActiveAI multi-domain
      expansion.
    data:
      items:
        - label: 'Stage 1: Proof of Value (POV)'
          detail: Prospects evaluate self-learning AI via 30-day passive network or email trial to discover latent threats.
          touchpoints:
            - Passive network sensor span installation
            - Initial threat visualizer executive readout
        - label: 'Stage 2: Initial Commercial Land'
          detail: Customer commits to core Network or Email module deployment to protect primary threat vector.
          touchpoints:
            - CISO sign-off on 1- to 3-year subscription
            - Active threat containment policy enablement
        - label: 'Stage 3: Operational Integration'
          detail: Security team integrates Cyber AI Analyst workflows into daily SOC alert triage and SIEM feeds.
          touchpoints:
            - CrowdStrike or third-party SIEM/SOAR API connector
            - Automated incident investigation playbook adoption
        - label: 'Stage 4: Multi-Domain Cross-Sell'
          detail: Account expands licensing to cover Cloud workloads, Microsoft Teams, and OT infrastructure.
          touchpoints:
            - Darktrace/Email and Darktrace/Cloud module additions
            - Enterprise-wide ActiveAI platform licensing
        - label: 'Stage 5: Multi-Year Renewal & Defense'
          detail: Enterprise establishes permanent autonomous defense posture amid vendor platform consolidation pressures.
          touchpoints:
            - Executive renewal review against competitive XDR suites
            - Expansion into custom behavioral compliance rules
        - label: 'Stage 6: Enterprise Platform Standardization'
          detail: Customer standardizes across all business units and integrates threat intelligence feeds.
          touchpoints:
            - Global deployment across international subsidiaries
            - Executive reporting via CISO dashboard
    approximationNotes: >-
      Lifecycle stages structured from customer deployment case studies, partner distributor programs, and official
      ActiveAI platform integration briefs.
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU009
