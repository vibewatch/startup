  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Architectural Foundation
        blocks:
          - type: paragraph
            body: >-
              Darktrace operates an AI-native behavioral cybersecurity platform designed to protect complex enterprise
              digital estates from unknown, multi-vector, and machine-speed threats. Rather than relying primarily on
              static signature databases, rules, or historical attack hashes, the platform deploys unsupervised machine
              learning, anomaly detection models, and clustering algorithms to continuously learn what constitutes
              normal behavior for every device, user, network connection, and workload across an organization. By
              generating an individualized mathematical baseline termed a Unique Behavioral Profile, Darktrace detects
              subtle deviations that signal novel zero-day exploits, insider misuse, or living-off-the-land techniques
              before public indicators of compromise exist. Core algorithmic execution occurs locally within customer
              environments, ensuring that sensitive organizational telemetry is processed at the point of origin rather
              than aggregated in shared multi-tenant lakes. Real-time telemetry ingestion spans network packets,
              endpoint execution, cloud VPC traffic, identity providers, and messaging gateways, feeding into the Cyber
              AI Analyst engine for automated triage and the Threat Visualizer console for investigative progression
              replay.
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE005
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE012
      - number: '5.2'
        title: ActiveAI Platform Modules and SKU Map
        blocks:
          - type: paragraph
            body: >-
              The commercial platform is delivered through the Darktrace ActiveAI Security Platform, which consolidates
              functional modules across major digital operational domains into an integrated behavioral defense
              architecture. The flagship Darktrace Network module captures full packet data through physical network
              TAPs or SPAN ports to analyze East-West lateral movement and North-South egress traffic. To bridge
              historical visibility seams between host processes and network flows, Darktrace introduced the Network
              Endpoint eXtended Telemetry (NEXT) agent, which natively binds endpoint process execution trees directly
              to anomalous network sockets without requiring manual multi-console correlation. Darktrace Cloud provides
              agentless API and agent-based telemetry across Amazon Web Services, Microsoft Azure, and Google Cloud
              environments, while Darktrace Email extends behavioral analysis into communications, natural language
              content, and collaboration applications like Microsoft Teams to preemptively block account takeover and
              business email compromise. For industrial infrastructure, Darktrace OT offers deep packet inspection for
              proprietary supervisory control protocols, supported by an international portfolio of more than 200 patent
              applications filed across research facilities in Cambridge and The Hague.
            claimRefs:
              - CE001
              - CE003
              - CE006
              - CE007
              - CE008
              - CE010
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE007
              - CE008
              - CE010
      - number: '5.3'
        title: Enterprise Workflows, Use Cases, and Operational Containment
        blocks:
          - type: paragraph
            body: >-
              In enterprise security operations center workflows, Darktrace transforms reactive alert triage into
              automated, proactive resilience by altering how incidents are surfaced, investigated, and neutralized.
              Traditional Security Information and Event Management (SIEM) workflows require human analysts to manually
              query multiple dashboards, reconstruct event timelines, and verify whether anomalous connections represent
              benign administrative behavior or active intrusion. Darktrace's Cyber AI Analyst automates this
              investigative progression by correlating disparate anomalies across email, network, and endpoint vectors,
              generating structured natural language summaries and root-cause diagnoses in seconds rather than hours.
              When threats represent imminent risk, Darktrace Antigena autonomous response technology intervenes at
              machine speed to enforce surgical containment, such as isolating compromised laptops, terminating
              unauthorized command-and-control sockets, or enforcing temporary user session lockouts. Complementing
              real-time containment, the platform's Attack Surface Management and Proactive Exposure Management modules
              continuously simulate attacker reconnaissance paths and prioritize vulnerabilities based on actual
              internal reachability, reducing dependence on periodic third-party vulnerability scanners.
            claimRefs:
              - CE002
              - CE004
              - CE009
              - CE013
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE004
              - CE009
              - CE013
              - CE014
      - number: '5.4'
        title: Technology Stack, Deployment Architecture, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              Deploying an unsupervised autonomous platform across hybrid enterprise environments introduces distinct
              architectural dependencies, operational scaling constraints, and governance considerations. Central
              administration is coordinated through the ActiveAI Security Portal, providing unified single-sign-on,
              granular role-based permissions, and standardized API integration into external SIEM, SOAR, and IT service
              management systems like ServiceNow. In converged industrial environments, Darktrace OT incorporates
              specialized firewall rule analysis for Fortinet FortiGate and native protocol decoders for industrial
              standards including GE-SRTP and Mitsubishi MELSOFT, enabling operational technology engineers to monitor
              plant-floor communications on dedicated dashboards. However, the architectural capability for autonomous
              containment without human pre-approval represents a substantial operational risk: false-positive
              containment actions executed on critical industrial controllers, hospital telemetry devices, or
              high-volume payment processing pipelines can cause unplanned operational downtime. Consequently,
              enterprise implementations require formal human-reviewed governance policies, defined exclusion
              boundaries, and continuous sensitivity threshold calibration to balance machine-speed defense against
              business continuity.
            claimRefs:
              - CE003
              - CE005
              - CE007
              - CE009
              - CE011
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE007
              - CE011
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Unified Packet and Host Telemetry via NEXT Agent
            body: >-
              The integration of packet-level network data and host-level endpoint process context within Darktrace's
              NEXT agent eliminates analyst pivot latency between NDR and EDR consoles, providing deterministic
              root-cause identification at machine speed.
            calloutType: insight
            claimRefs:
              - CE003
              - CE004
          - type: callout
            title: Operational Safeguards Around Autonomous Containment
            body: >-
              While autonomous response prevents ransomware spread and lateral exfiltration within seconds, taking
              corrective network or account actions without human pre-approval introduces production outage risks if
              false positives occur on critical business infrastructure.
            calloutType: risk
            claimRefs:
              - CE002
              - CE009
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Dynamics
        blocks:
          - type: paragraph
            body: >-
              Darktrace addresses enterprise, mid-market, and public-sector organizations requiring autonomous
              cybersecurity defense across hybrid digital environments CU001, CU003. Commercial adoption spans diverse
              operational environments, including commercial banking such as Banco Galicia, healthcare institutions
              including Okayama Kyokuto Hospital, public school systems such as Merced College, and industrial
              manufacturing operations CU005, CU006. The primary economic buyer is typically the Chief Information
              Security Officer (CISO) or Chief Information Officer (CIO), who seeks to augment lean security operations
              center (SOC) personnel against machine-speed attacks and novel threats CU004, CU007. Operational users
              comprise frontline SOC security analysts and incident response teams who utilize the Cyber AI Analyst to
              correlate multi-stage alerts and automate initial triage CU001, CU008. Payer dynamics diverge between
              mid-market accounts, which purchase modular coverage or unified platform licenses via managed service
              providers and IT resellers such as Bechtle and Technologent, and enterprise accounts that negotiate
              centralized multi-year contracts across network, email, cloud, and operational technology (OT) domains
              CU003, CU005, CU009.
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
