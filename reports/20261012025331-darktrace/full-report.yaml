        title: Distribution, Traction, and Sales-Efficiency Proxies
        blocks:
          - type: paragraph
            body: >-
              The route to market combines direct platform selling with service and reseller channels. Cyberseer markets
              Darktrace alongside 24/7 monitoring, investigation, and response services, while Darktrace says its
              Bechtle partnership provides access to Bechtle's roughly 70,000 customers and includes financial
              incentives for growth. These relationships can extend distribution, but the assigned evidence does not
              disclose referral fees, reseller discounts, channel mix, CAC, sales-cycle length, or payback. Public
              footprint figures show direction rather than audited economics: a company-issued April 2024 release
              reported more than 9,200 customers and 2,300 employees; Darktrace reported more than 9,700 customers and
              2,400 employees in September 2024; and Technology Magazine reported nearly 10,000 customers with more than
              2,400 employees in August 2025. The sequence suggests continued customer expansion, while the nearly flat
              disclosed workforce proxy could indicate operating leverage; neither inference substitutes for revenue,
              retention, cohort, or cost data.
