  topStrengths:
    - Large installed base across roughly 10,000 customer organizations provides reach and cross-sell potential.
    - Behavioral-anomaly architecture and platform breadth differentiate Darktrace from point-solution security vendors.
    - Thoma Bravo ownership may support patient product investment and operational discipline.
  topRisks:
    - Private-company opacity leaves current ARR, margins, cash flow, and debt service capacity unverified.
    - Platform incumbents and unified XDR suites can pressure pricing and renewal dynamics.
    - Autonomous detection and response can still generate false positives, blind spots, and operational friction.
  unresolvedGaps:
    - Sponsor-era audited financials and an ARR bridge that show current growth, margins, and cash generation.
    - Debt principal, maturity, covenant, and interest-cost detail for the private-equity capital structure.
    - Current retention, expansion, and customer-cohort metrics after the take-private transition.
    - Clarified board, incentive, and ownership structure under Thoma Bravo control.
