companyProfile:
  summary: >-
    Darktrace is a Cambridge-founded cybersecurity company that uses unsupervised machine learning and behavioral
    anomaly detection to protect enterprise network, cloud, email, endpoint, operational technology, and AI-agent
    environments. After an April 2021 London listing and an October 2024 Thoma Bravo take-private transaction, it
    operates as a PE-backed private company with a broad global customer base and reduced public disclosure.
