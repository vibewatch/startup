- "id": "valuation-context-and-sponsor-leverage"
  "title": "Valuation Context and Sponsor-Era Leverage"
  "body": "Darktrace's capital structure and valuation trajectory shifted fundamentally with the completion of its take-private acquisition by Thoma Bravo in October 2024 at an enterprise value of approximately $5.3 billion. This transaction followed a multi-stage valuation history, starting with a $1.65 billion Series E valuation in 2018 and an initial public offering on the London Stock Exchange in 2021 that valued the business at 1.7 billion pounds ($2.37 billion). While trading as a public company, Darktrace generated approximately $616.5 million in annual revenue across global markets, but faced scrutiny over its high price-to-earnings valuation, reliance on external debt, and insider equity transactions. The $5.3 billion buyout multiple represented approximately 6.8x historical public ARR, which aligns with private equity software acquisition benchmarks but leaves limited room for multiple expansion under private sponsor leverage.\n"
  "claimRefs":
  - "CV001"
  - "CV003"
  - "CV004"
  - "CV011"
  - "CV014"
  - "CV015"
  "figureRefs":
  - "FV001"
- "id": "scenario-analysis-and-peer-multiples"
  "title": "Scenario Analysis and Peer Multiples"
  "body": "Valuation outcomes for Darktrace depend heavily on sponsor execution, revenue retention, and capital structure stability over the three-to-five year private holding period. In a bull case scenario, Darktrace accelerates ARR expansion above 25% annually through cross-domain module adoption across cloud, email, and operational technology, expanding enterprise value toward $7.5 billion to $9.0B at 7.0x to 7.5x ARR. In the base case, the business expands at a sustainable 12% to 16% CAGR to approach $1.0 billion in ARR, supporting an enterprise value of $5.3 billion to $6.2 billion under steady gross margins. Conversely, the bear case scenario projects growth deceleration below 8% as aggressive contractual renewal escalators trigger account contraction and vendor consolidation toward unified platform suites, compressing enterprise value to $3.5 billion to $4.2 billion and impairing sponsor equity returns.\n"
