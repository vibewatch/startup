- "id": "recommendation-and-diligence-path"
  "title": "Recommendation Stance and Diligence Asks"
  "body": "Based on the balance of technological scale, sponsor leverage, and disclosure opacity, Darktrace warrants a track recommendation with medium confidence, a high risk rating, and a fair valuation stance. Although the business demonstrates validated operational reach across 9,700 customers and defensible intellectual property, institutional investors face significant information asymmetry under private equity governance. Following the acquisition and departure of former sponsor Summit Partners, executive leadership transitioned to Chief Executive Officer Jill Popelka. However, absence of audited post-acquisition financial statements, debt principal terms, and detailed ARR retention bridges precludes an affirmative buy recommendation. Diligence must focus on obtaining private debt compliance certificates, verified net revenue retention metrics, and clarity regarding end-of-quarter discounting practices before revisiting capital allocation.\n"
