  "title": "Customers"
  "summary": "Darktrace serves over 9,700 customers across critical infrastructure, financial services, healthcare, and public sector verticals through a land-and-expand deployment model. While mid-market adoption and partner-led distribution provide volume, enterprise retention and contract durability face headwind risks from platform consolidation and post-take-private sponsor disclosures."
"sections":
- "id": "customer-segmentation-and-buyer-dynamics"
  "title": "Customer Base Segmentation and Buyer Dynamics"
  "body": "Darktrace addresses enterprise, mid-market, and public-sector organizations requiring autonomous cybersecurity defense across hybrid digital environments CU001, CU003. Commercial adoption spans diverse operational environments, including commercial banking such as Banco Galicia, healthcare institutions including Okayama Kyokuto Hospital, public school systems such as Merced College, and industrial manufacturing operations CU005, CU006. The primary economic buyer is typically the Chief Information Security Officer (CISO) or Chief Information Officer (CIO), who seeks to augment lean security operations center (SOC) personnel against machine-speed attacks and novel threats CU004, CU007. Operational users comprise frontline SOC security analysts and incident response teams who utilize the Cyber AI Analyst to correlate multi-stage alerts and automate initial triage CU001, CU008. Payer dynamics diverge between mid-market accounts, which purchase modular coverage or unified platform\
    \ licenses via managed service providers and IT resellers such as Bechtle and Technologent, and enterprise accounts that negotiate centralized multi-year contracts across network, email, cloud, and operational technology (OT) domains CU003, CU005, CU009."
  "claimRefs":
