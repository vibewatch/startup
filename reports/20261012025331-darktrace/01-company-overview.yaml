- "id": "executive-leadership-and-governance-transition"
  "title": "Executive Leadership, Governance Structure, and Management Transition"
  "body": "In September 2024, ahead of the formal closing of the Thoma Bravo transaction, Darktrace appointed Jill Popelka as Chief Executive Officer, succeeding founding CEO Poppy Gustafsson. Popelka brings more than two decades of senior operational leadership experience from global enterprise software organizations including SAP SuccessFactors, Snap Inc., and Accenture. The technical foundation continues to be anchored by co-founders and technical leaders such as Jack Stockdale (Chief Technology Officer) and Nicole Eagan (Co-Founder and strategic executive), alongside Chief Information Security Officer Mike Beck. Governance oversight transitioned from a publicly listed board of directors on the London Stock Exchange to a private sponsor-controlled governance framework led by Thoma Bravo operating partners and investment professionals. Detailed committee charters, equity incentive vesting arrangements, and non-sponsor minority representations remain private and undisclosed under the current\
    \ corporate structure."
  "claimRefs":
  - "CO007"
  - "CO008"
  - "CO009"
  "tableRefs":
  - "TO002"
- "id": "capitalization-ownership-and-sponsor-buyout"
  "title": "Capitalization History, Pre-IPO Financing, and Private Equity Ownership"
  "body": "Prior to its public listing, Darktrace raised approximately $230 million in primary equity capital across Series A through Series E venture rounds between 2013 and 2018. Early institutional backers included Invoke Capital, Summit Partners (which led a $22.5 million Series B financing in July 2015 and participated in a $65 million growth round in 2016), KKR, Insight Partners, TenEleven Ventures, and Samsung Ventures. Darktrace completed an initial public offering on the London Stock Exchange in April 2021, achieving an initial public market valuation of \xA31.7 billion ($2.37 billion). In April 2024, Darktrace entered into an agreement on the terms of a recommended all-cash acquisition by Thoma Bravo valuing the equity at approximately $5.3 billion, which closed formally in October 2024. Summit Partners and other pre-IPO and public shareholders fully exited their equity holdings at closing, establishing Thoma Bravo as the controlling equity holder alongside private management co-investment."
  "claimRefs":
  - "CO004"
  - "CO010"
  - "CO011"
  - "CO012"
  "tableRefs":
  - "TO003"
- "id": "operational-scale-products-and-adverse-resilience"
  "title": "Operational Scale, Product Architecture, and Adverse Security Resilience"
  "body": "Darktrace operates globally with a reported headcount of more than 2,400 employees and serves approximately 10,000 customer organizations across 110 countries. The commercial portfolio transitioned from standalone point products to the unified Darktrace ActiveAI Security Platform and Behavioral Defense Platform, encompassing / SECURE AI (monitoring and safeguarding generative AI systems and autonomous AI agents), / HYBRID NETWORK, / EMAIL, / CLOUD, and Darktrace HEAL (automated incident recovery). The company operates through direct enterprise sales and channel alliances, including managed service provider agreements such as its European partnership with Bechtle. On adverse and risk surfaces, Darktrace has navigated short-seller controversies regarding historical revenue attribution, the trial and passing of early backer Mike Lynch, and cyber threat actor targeting. In April 2023, the LockBit ransomware syndicate publicly alleged unauthorized access to Darktrace internal systems;\
    \ following an internal forensic investigation led by CISO Mike Beck, Darktrace verified that internal systems and customer environments suffered no compromise or data loss."
  "claimRefs":
  - "CO013"
  - "CO014"
  - "CO015"
  - "CO016"
