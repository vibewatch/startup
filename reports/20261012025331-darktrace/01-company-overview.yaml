  "name": "Darktrace"
"chapter":
  "number": 1
  "title": "Company Overview"
  "summary": "Darktrace is a Cambridge-headquartered AI cybersecurity pioneer founded in 2013 that applies unsupervised machine learning and behavioral anomaly detection across enterprise digital environments. Following an April 2021 London Stock Exchange listing and an October 2024 $5.3 billion take-private transaction by Thoma Bravo, the company operates as a private enterprise under Chief Executive Officer Jill Popelka, protecting approximately 10,000 customer organizations worldwide."
"sections":
- "id": "corporate-identity-and-foundational-origins"
  "title": "Corporate Identity, Intelligence Roots, and Core Operating Model"
  "body": "Darktrace was founded in 2013 in Cambridge, United Kingdom, bringing together mathematicians from the University of Cambridge signal processing laboratory and cyber intelligence specialists with operational backgrounds in the UK Government Communications Headquarters (GCHQ). The founding technical thesis rejected traditional perimeter security that depended on static threat signatures and pre-programmed rule databases, positing instead that unsupervised machine learning could construct an adaptive baseline of normal operational behavior\u2014an 'Enterprise Immune System'\u2014to detect novel, unknown, and insider attacks in real time. Following early backing by Invoke Capital, the company expanded from initial network anomaly monitoring to a comprehensive security platform protecting enterprise email, multi-cloud architectures, endpoints, and operational technology. In October 2024, private equity sponsor Thoma Bravo finalized an all-cash acquisition valuing the business at approximately\
    \ $5.3 billion, delisting Darktrace from the London Stock Exchange (where it traded under ticker DARK.L following its April 2021 flotation) and transitioning it to a sponsor-backed private operating structure."
