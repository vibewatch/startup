    title: "Baseline Poisoning and Autonomous Disruption Represent Core Operational Exposures"
    body: "Unsupervised machine learning introduces inherent operational vulnerabilities if customer environments are compromised prior to initial baseline formation. While Darktrace provides surgical containment through Antigena, enterprise customers frequently require human-confirmation mode during initial deployment to mitigate false-positive disruptions to critical business applications."
    claimRefs:
