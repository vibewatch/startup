evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A dated management-confirmed employee count or payroll-band disclosure.
    whyItMatters: >-
      Headcount is a standard maturity signal for embodied-AI startups and affects burn, hiring velocity, and execution
      capacity assessment.
    diligencePath: Request an org chart, latest board deck, or HR summary during management meetings.
    relatedQuestionRefs:
      - QO017
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board composition, investor rights, and delegated committee structure.
    whyItMatters: >-
      Capital intensity and founder concentration make governance quality important for understanding control, hiring
      authority, and financing discipline.
    diligencePath: Request charter documents, board observer list, and latest financing term sheet summary.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: customer-count
