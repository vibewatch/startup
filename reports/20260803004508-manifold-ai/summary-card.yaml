  topStrengths:
    - >-
      Rare positioning at the world-model layer for embodied AI, with public leadership claims across WorldScore,
      WorldArena, and RoboTwin.
    - >-
      Fast financing velocity and near-RMB1B cumulative Pre-A capital provide a credible capital base for continued R&D
      and deployment iteration.
    - >-
      Product narrative spans model, action, data, and benchmark layers rather than a single point solution, which could
      create infrastructure-like power if commercialization follows.
    - >-
      Early industrial relevance is visible in repeated logistics and 3C manufacturing deployment claims plus the named
      UBTECH commercialization channel.
    - >-
      Founder-market fit looks strong, with Wu Wei and the Tsinghua-linked team combining benchmark credibility and
      world-model deployment experience.
  topRisks:
    - >-
      Revenue, ARR, gross margin, customer count, and runway remain undisclosed, making late-stage-style valuation
      underwriting impossible from public evidence alone.
    - >-
      Customer proof is channel- and scenario-led, not account-led; named end-customer production deployments remain
      scarce in the public record.
    - Trust, safety, privacy, and governance artifacts are thin relative to the physical-world impact of the product.
    - >-
      Commercialization appears dependent on a small number of channels and strategic ecosystems, especially UBTECH and
      industrially connected backers.
    - >-
      The company may already be priced for category leadership before public evidence proves repeatable, software-like
      deployment economics.
  unresolvedGaps:
    - Named production customer list with deployment stage, site count, and referenceable KPI outcomes.
    - >-
