    summary: 按序位观察当前公开信息里最强和最弱的能力。
    approximationNotes: 评分来自分析师基于公开证据的判断，不是公司给出的分数。
    data:
      columns:
        - 公开技术证明
        - 商业化封装
        - 运营成熟度
        - 信任 / 安全可见度
      rows:
        - label: 世界模型研究核心
          values:
            - 高
            - 中
            - 中
            - 低
        - label: 基准 / 评测栈
          values:
            - 高
            - 中高
            - 中
            - 中低
        - label: 部署运营
          values:
            - 中
            - 中
            - 中低
            - 低
        - label: 合作伙伴集成就绪度
          values:
            - 中
            - 中
            - 中低
            - 低
        - label: 安全 / 合规表面
          values:
            - 低
            - 低
            - 低
            - 低
    claimRefs:
      - CE019
      - CE021
      - CE029
      - CE031
      - CE034
      - CE035
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 公开证据显示，企业客户旅程大致从基准发现进入试点，再走向伙伴主导的规模化。
    data:
      items:
        - label: 技术发现
          detail: 潜在客户最先通过基准胜利、论文或投资方 / 媒体曝光接触 Manifold。
          tone: neutral
        - label: 场景评估
          detail: 工业买家把技术栈映射到物流、3C 制造或汽车工作流。
          tone: neutral
        - label: 试点或伙伴集成
          detail: UBTECH 这样的伙伴，或直接工业团队，会在目标工作流中测试模型。
          tone: neutral
        - label: 部署决策
          detail: 硬件、数据、集成和安全验收必须全部对齐，才会进入生产使用。
          tone: risk
        - label: 扩张或集中
          detail: 成功可以扩展到更多站点或 OEM 渠道，但当前公开证据指向集中风险。
          tone: risk
    claimRefs:
      - CU003
      - CU020
      - CU021
      - CU024
      - CU032
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 一个定性证明漏斗：从广泛公共兴趣，收窄到少数证据更扎实的商业化信号。
    approximationNotes: 数值是证明强度指数，不是客户数量。
    data:
      items:
        - label: 行业相关性与基准认知
          value: 100
          detail: 公开叙事和 WorldArena 可见度撑起较宽的漏斗顶部认知。
        - label: 场景级部署主张
          value: 55
          detail: 多个来源提到物流和制造落地，但没有分母。
        - label: 具名商业化渠道
          value: 20
          detail: UBTECH 是最清晰的具名渠道。
        - label: 具名终端客户生产证明
          value: 5
          detail: 在已审阅公开来源中，没有找到具名终端客户的生产部署。
        - label: 留存和扩张证明
          value: 2
          detail: 续约、NRR、合同期限和多站点扩张仍未披露。
    claimRefs:
      - CU006
      - CU014
      - CU015
      - CU016
      - CU017
      - CU034
