  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              具身 AI 已经不再在真空里推进。中国 2026
              年人形机器人与具身智能标准体系，意味着安全、伦理、应用和全生命周期要求正在走向制度化。杭州地方监管又给出第二个路标：政府开始为具身机器人部署定义测试、可追溯和商业化框架。Manifold
              即便仍处早期，也会受影响：它公开讲述的产品故事已经延伸到机器人、仓储、制造产线和汽车相关工作流——这些领域一旦部署不再只是实验，政策关注通常会升温。


              全球模式也指向同一方向。英国 Automated Vehicles Act 和欧盟 AI Act 并不是直接针对 Manifold 的规则，但能看出责任归属、问责和高风险 AI
              合规讨论会往哪里走。最重要的风险不是 Manifold 现在违反了某套已披露规则；而是它的公开材料还没拿出能让未来合规更顺的安全、可审计性、隐私和治理证据。眼下没有公开诉讼是好事，但远不如证明 Manifold
              已做好治理准备重要。
