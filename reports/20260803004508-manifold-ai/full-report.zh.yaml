  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 示意估值结果更取决于商业化证明，远不只是技术叙事。
    approximationNotes: 条形为十亿美元口径的情景输出，不是市场报价。
    data:
      items:
        - label: 无具名部署 / 下轮估值下调风险
          value: 0.6
        - label: 当前独角兽锚点
          value: 1
        - label: 具名部署 + 渠道扩张
          value: 1.6
        - label: 可重复性 + 更清晰的软件经济性
          value: 2.5
        - label: 大品类领导者可比区间
          value: 5.6
    claimRefs:
      - CV007
      - CV008
      - CV023
      - CV024
      - CV025
      - CV029
      - CV030
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 基于当前公开证据，只能支撑一个较宽的估值区间。
    approximationNotes: 区间刻意拉宽，因为收入、利润率、稀释和退出时点仍未披露。
    data:
      items:
        - label: 悲观公允价值区间
          low: 0.4
          mid: 0.6
          high: 0.8
          unit: USD bn
          detail: 商业化滞后；估值向叙事重置区间压缩
        - label: 基准公允价值区间
          low: 0.9
          mid: 1.2
          high: 1.6
          unit: USD bn
          detail: 当前独角兽叙事大体守住，同时证明逐步改善
        - label: 乐观公允价值区间
          low: 2
          mid: 2.8
          high: 4
          unit: USD bn
          detail: 具名生产部署和多渠道规模化支撑重估
        - label: 总价值相对 ~US$1B 进入价格（x）
          low: 0.4
          mid: 1.2
          high: 4
          unit: x
          detail: 稀释 / 时间价值之前的示意性结果倍数
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
      - CV040
