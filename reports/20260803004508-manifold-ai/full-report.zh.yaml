      - CU030
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 公开证据最薄、系统复杂度最高的地方，残余风险最高。
    approximationNotes: 评分为分析师截至 2026-08-03 基于公开证据综合作出的判断。
    data:
