      - number: '2.2'
        title: 规模测算视角：TAM 很大，眼前的软件机会小得多
        blocks:
          - type: paragraph
            body: >-
              公开市场估算最好被当作多组镜头，而不是一个可完全调和的答案。在最宽口径下，36Kr Research Institute 估计中国具身智能市场 2025 年达到 RMB915 billion，2026 年可能超过
              RMB1 trillion。更窄口径下，ResearchInChina 估计中国 EAI 数据市场 2025 年为 RMB500 million，同比增长 203%，约占全球市场的
              40%。第三个镜头来自融资流而不是终端市场支出：Embodied Global 的 2026 年上半年统计显示，322 笔交易合计 RMB93.5 billion，且呈现强杠铃结构，大部分资本流向少数旗舰公司。


              这些估算并不彼此矛盾，只是在衡量不同对象。宽口径数字统计的是一个包含硬件、集成、服务和下游部署的经济体。窄口径数字聚焦数据基础设施和模型开发输入。融资流本身不是收入，但能显示投资人在成熟商业指标出现之前多么激进地承保未来类别领导者。对
              Manifold 来说，正确解读应更保守：头部 TAM 证明方向和政策优先级，但眼前可服务市场更接近较小、软件和数据权重更高的楔子，而不是完整的万亿元工业总量。
