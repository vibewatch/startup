      - number: '1.3'
        title: 融资历程、投资方基础与独角兽状态
        blocks:
          - type: paragraph
            body: >-
              最清晰的资本事实出现在 2026 年 6 月。AIbase、盖世汽车、腾讯新闻和新浪都称，Manifold AI 在约一年内完成六轮融资，Pre-A 累计融资接近 RMB 1
              billion。该轮新进投资方包括国新基金、Temasek 旗下怡峰资本、北汽产业投资和新能创投，组合里既有国资信用、主权相关资本，也有产业渠道价值。同一批来源还回溯到君联资本和 Huawei Hubble
              等早期投资方，说明在 2026 年 6 月融资前，股权结构表已经汇集了一线 VC 和战略投资方。


              6 月之前的时间线足以说明动能，尽管并不完全干净。2026 年春季报道包括一轮近 RMB-200 million 的 Pre-A，以及随后数亿元人民币的
              Pre-A+。公开记录尚不能支持精确完整的股权结构表、任何债务工具或任何老股交易披露。不过，在当前披露水平下，估值信号已经异常强：多个 2026 年 6 月来源明确称 Manifold
              已进入十亿美元“独角兽”行列。估值方向因此比收入质量清楚得多。所审阅公开来源没有披露 ARR、收入运行率或收入，资本市场热情目前跑在运营披露前面。
