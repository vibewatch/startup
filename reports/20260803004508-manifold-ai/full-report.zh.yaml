      - number: '3.2'
        title: 直接和相邻技术同行
        blocks:
          - type: paragraph
            body: >-
              Physical Intelligence 是最清晰的软件优先标杆。其官网营销一套可控制任何机器人完成任何任务的模型，openpi 仓库则把这一主张变成分发引擎，让开发者接触到多个 VLA
              变体和微调路径，这些模型基于 10k-plus 小时机器人数据训练。Wayve 在商业上没那么直接，但技术上相邻：它明确把具身 AI 用于自主移动，并用 GAIA-1
              展示生成式世界模型如何加速自动驾驶训练和评估。两家公司都重要，因为它们验证了一个观点：战略控制点可以在模型层，而不只在机器人本体。


              在中国同行中，X Square 和 ROBOTERA 尤其相关，因为它们把全栈叙事与大量资本和场景宽度结合起来。X Square
              称自己结合了基础模型、机器人硬件、自有数据管线，以及在家庭、工业和物流场景中的真实部署；公司还称估值超过 US$2.8 billion。ROBOTERA
              把自己营销为全栈自研具身智能公司，并称已经在十多个物流中心部署，Q2 2026 开始千台级交付。这些同行压缩了 Manifold
              的差异化空间：在这个类别里，“全栈”、“数据驱动”或“世界模型原生”已经不再是稀缺语言。
