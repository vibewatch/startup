chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与产品范围
        blocks:
          - type: paragraph
            body: >-
              Manifold AI，也以中文品牌「流形空间」出现，公开起点可追溯到
              2025-05-22：公司网站上线，公开资料里的法律主体时间线也从这里开始。所审阅来源一致把公司放在北京，并描述为较早用自研世界模型作为具身智能底层的玩家。官方定位很宽，不只是狭义的机器人软件：Manifold
              称自己在为机器人和 XR 设备等 AI 硬件应用打造下一代世界模型。2026 年 6 月的独立报道进一步收窄并强化了叙事，称公司是中国首家把自有世界模型作为具身 AI 基础模型的初创公司。


              核心产品叙事围绕 WorldScape 和 WorldScape Policy 展开。WorldScape
              反复被描述为实时世界模型，可在同一交互闭环中支持移动和操作；这点重要，因为公司不再停留在更好看的视频生成，而是走向机器人可用的状态预测。公开架构描述强调混合专家设计和强几何基础。WorldScape Policy
              把该栈延伸到动作执行，公司称其闭环表现强于现有 VLA 基线。合在一起，产品主张不只是“更好的仿真”，而是一套预训练和控制栈，目标是帮助机器人在混乱物理环境中感知、推理并行动。
