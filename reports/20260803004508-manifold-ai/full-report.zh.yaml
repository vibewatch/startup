      - number: '7.4'
        title: 缓释措施、监测与终止标准
        blocks:
          - type: paragraph
            body: >-
              好消息是，Manifold 最重要的许多风险都能监测。投资人不必马上拿到完美披露，也能知道下一步该问什么：是否出现具名生产部署，UBTECH
              及类似渠道是否真正扩张，安全与信任文档是否可见，公司能否披露哪怕基础的可靠性层，而不伤害叙事。这些都是可量化检查点。


              坏消息是，投资逻辑可能在灾难性失败前就先失效。如果下一次融资到来时仍缺少更强客户证明，或合作伙伴渠道看起来有前景却无法规模化，或治理要求上升得比公司的信任基础设施更快，下行不会表现为戏剧性崩塌，而会是商业化乏力。因此，正确的风险判断是升高但可监测。Manifold
              值得尽调，不是因为它看起来弱，而是因为它正在跨过前沿具身 AI 最容易失败的关口：从亮眼模型领先，走向可问责的工业系统。
