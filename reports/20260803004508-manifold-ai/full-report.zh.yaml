      - number: '1.4'
        title: 里程碑、基准证明与早期商业化信号
        blocks:
          - type: paragraph
            body: >-
              Manifold 的公开里程碑故事压缩且连贯。官网记录了公司在 2025 年 5 月启动、2025 年 7 月推出 RoboScape、2025 年 11 月推出 AirScape。到 2026
              年初，叙事从领域模型转向通用化栈：WorldScape 与 WorldScape Policy、WorldScore 公开第一名主张，以及 WorldArena 的发布。WorldArena
              作为基准，试图衡量模型是否真正能支撑具身任务，而不只是生成逼真的视频。WorldArena 论文和网站用 16 项指标、六个维度的基准给叙事补上实质，也提出更广泛的观点：视觉质量和具身可用性常常并不一致。


              商业证明仍比基准证明更早期。所审阅来源称，Manifold 已经在电商物流和 3C 制造中落地用例，汽车生产和混合现实娱乐更多被放在下一阶段。因此，2026 年 7 月与 UBTECH
              的合作很重要，因为它把基准领先转译为拥有制造触达能力的产业化伙伴。同时，周边行业仍有风险：MERICS 认为，中国具身 AI 栈仍依赖 Nvidia
              工具，距离充分自主、规模化部署还很远。再叠加未披露的客户数、员工数和治理细节，当前里程碑故事很有力量，但还不能等同于商业化风险已经充分出清。
