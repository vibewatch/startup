  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：具身 AI 赋能层，而不是整个机器人经济
        blocks:
          - type: paragraph
            body: >-
              最重要的框定选择，是不要把“具身 AI”、“人形机器人”、“自主移动”和“世界模型”混为一谈。对 Manifold AI
              来说，真正相关的市场是赋能层：世界模型、动作模型、数据管线和部署软件，帮助机器在真实物理工作流中感知并行动。这个层面触达更广的具身智能经济，但并不等同于完整机器人硬件市场，也不是通用视频生成 AI。BCG
              的能力框架在这里有用，因为它把物理 AI 视为一组能力栈——感知、操作、规划和推理——而不是单一机器人形态。


              这个区分直接影响估值和进入市场路径。面向中国具身智能经济的万亿元市场叙事，方向上可能正确，但 Manifold
              只能变现其中一部分支出：投向模型基础设施、数据、控制软件，以及部署到物理推理能带来可测价值的场景中的那一部分。相邻玩家有助于厘清边界。Physical Intelligence
              讲的是“适用于任何机器人”的模型故事，Wayve 把具身 AI 用于自动驾驶，AGIBOT、Unitree、X Square、ROBOTERA、Fourier 和 UBTECH
              等公司则以不同比例混合硬件、软件和场景所有权。Manifold 在这个更大领域里最接近软件与模型层。
