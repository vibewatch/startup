  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Manifold AI 面对的不是一组干净同行。格局至少分为四层。第一层是软件优先或模型优先的具身 AI 公司，例如 Physical Intelligence，以及中国语境下的 X
              Square，它们强调通用学习系统、数据闭环和基础模型宽度。第二层是全栈机器人平台厂商，例如 AGIBOT、UBTECH、Unitree 和
              ROBOTERA，它们拥有或紧密控制硬件、软件和部署。第三层是自动驾驶中的相邻具身 AI 公司，主要是 Wayve 和 Waymo；它们证明世界模型和端到端学习思想可以变成商业系统，即便终端市场不同于
              Manifold。第四层是非初创替代品：固定工业自动化，以及机器人 OEM 或大型工业集团内部自建项目。


              这种分层很重要，因为客户购买 Manifold 时，不只在比较研究排名。他们还会比较供应商是否控制硬件、能否交付工业正常运行时间、是否具备监管可信度、能否生成自有数据，以及能否借伙伴扩张。因此，Manifold
              在模型层的直接竞争很窄，但在预算层的竞争要宽得多。世界模型初创公司不只会输给另一家世界模型初创公司，也可能输给垂直整合的机器人厂商，或输给决定围绕更窄内部栈自建的客户。
            claimRefs:
              - CP001
