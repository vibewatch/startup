  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 按工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              Manifold 呈现的不是一张简单产品菜单，而是一套能力栈。按工作流看，公司出售的是一个系统，帮助机器人和其他物理 AI 智能体建模世界、预测结果，并在混乱真实环境中执行动作。公开描述一致把它放在物流、3C
              制造、汽车制造和混合现实探索中。这意味着产品不是孤立的“给机器人用的视频生成”。它是客户工作流内部的赋能层，覆盖感知、规划、数据生成、策略评估和动作控制，而这些工作流都需要物理交互。


              模块地图已经公开到足够可用。WorldScape 是实时空间世界模型。WorldScape Policy 是建立在该模型之上的动作和控制层。RoboScape 是机器人专用的模型 / 论文线。AirScape
              把路线图延伸到无人机自主。WorldArena 是公开评估层，把公司偏好的功能性框定变成基准。这是一套连贯栈：基础模型、动作层、应用变体，以及一个基准外壳，在客户和研究社区面前强化公司的世界观。
