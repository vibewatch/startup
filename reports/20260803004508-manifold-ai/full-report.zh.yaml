companyProfile:
  summary: >-
    Manifold AI（流形空间）是一家北京具身 AI 初创公司，2025-05-22 由前 SenseTime 高管吴伟博士与清华大学 FIB Lab 相关团队共同创立。公司把自己定位为物理 AI
    的世界模型基础设施提供商：WorldScape 承担实时空间世界模型，WorldScape Policy 把该栈延伸到动作和控制，WorldArena
    则提供基准层，强化公司对功能型具身智能的定义。公开证据显示，公司在技术信号和融资上推进异常迅速——到 2026 年 6 月，六轮 Pre-A 累计融资接近 RMB1B，并在
    WorldScore、WorldArena、RoboTwin 等基准中反复宣称排名第一；但运营指标和客户耐久性披露仍有限。
