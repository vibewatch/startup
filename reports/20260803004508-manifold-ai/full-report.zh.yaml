  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与买方地图
        blocks:
          - type: paragraph
            body: >-
              公开记录对用例很清楚，对账户很模糊。Manifold 一直与电商物流、3C 制造、汽车制造，以及更试探性的混合现实探索相连。这意味着企业客户基础的采购中心大概率在运营、工业自动化和创新预算里，而不是纯 IT
              或消费者渠道。产品也不太可能由一线机器人操作员自己购买。这些团队是用户，制造集团、机器人平台所有者或工业战略方才更可能是买方和付款方。


              另一类重要客户是间接客户：机器人 OEM 和生态伙伴。公开证据显示，Manifold 不只是直接卖进工厂或仓库，也在尝试把世界模型能力嵌入已经触达客户的伙伴平台。这一点重要，因为客户故事会从“Manifold
              有多少 logo？”变成“进入市场路径有多少会被硬件或产业伙伴中介？”公开层面，后者比前者更容易证明。
