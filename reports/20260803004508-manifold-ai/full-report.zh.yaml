      - number: '7.2'
        title: 运营与技术风险
        blocks:
          - type: paragraph
            body: >-
              从运营上看，Manifold
              公开证据最强的一面仍是技术验证。它在公开基准中领先或排名靠前，发布与研究相连的基础设施，并把产品叙事落在具身功能效用，而不只是视觉生成。但这些都不能证明机器人在客户现场能安全、可靠、经济地运行。已审阅来源没有披露正常运行时间、人工介入率、任务成功率或事故历史。核心运营风险就在这里：公开记录充分证明模型能在受控评测里做什么，却很少证明组织能在真实工业环境中反复交付什么。


              还有一个更隐蔽的技术风险：基准漂移。WorldArena 比纯审美基准更有用，但仍可能变成团队优化的靶子。如果 WorldArena、WorldScore 和相关榜单上的成绩，不能与现场层面的
              KPI——吞吐、错误率、节省人工——高度相关，Manifold 可能赢下品类叙事，却仍让买家失望。再叠加集成复杂度、硬件差异和边缘推理约束，“更好的模型”与“更好的客户结果”之间的距离就成了主要运营断层。
