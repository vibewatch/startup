      - number: '3.3'
        title: 商业化、分发与信任
        blocks:
          - type: paragraph
            body: >-
              Manifold 与最成熟竞争者之间最大的差距，是商业化可见度。UBTECH 是最强公开标杆，因为它有监管文件支持的收入、明确的工业应用重点、超过 6,000 台人形机器人的年化产能，以及清楚的标准制定角色。基于
              Longcheer 制造公告和“Deployment Year One”的叙事，AGIBOT 在部署曲线上也比 Manifold 走得更远。Waymo One
              证明的是另一点：运营型自动驾驶服务模式可以达到公开商业规模，即便它不是直接许可同行。


              分发能力越来越来自生态，而不只是算法。战略投资方和产业伙伴重要，是因为它们提供客户入口、供应链、集成能力和可信度。X Square、ROBOTERA、UBTECH 和 Wayve
              都在技术深度之外强调投资方和伙伴网络。NVIDIA 的 Jetson Thor 生态也提醒市场，基础算力正被全行业共享，这会削弱低层基础设施差异化，把竞争推向数据、部署和信任。对 Manifold
              来说，真正的竞赛是能否在更大、伙伴更多的玩家锁定最佳场景前，把基准关注转化为耐久渠道。
