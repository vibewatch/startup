  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 公开证据先支持战略关注，估值信心排在其次。
    data:
      nodes:
        - id: a
          label: 基准 + 产品领先
        - id: b
          label: 工业场景相关性
        - id: c
          label: 客户 / 收入不透明
        - id: d
          label: 高残余风险
        - id: e
          label: 跟踪 / 继续研究
        - id: f
          label: 等待定价纪律或证明
      edges:
        - from: a
          to: b
          label: 支撑投资论点
        - from: b
          to: e
