        title: 耐久性、留存与集中度
        blocks:
          - type: paragraph
            body: >-
              耐久性是公开记录快速变薄的地方。没有所审阅来源披露活跃账户、部署数量、利用率、客户结果、合同期限、续约率、NRR 或流失率。因此，无法判断公司是否正从技术上亮眼的试点毕业，走向可重复的生产关系。2026 年 6
              月和 7 月之间行业叙事保持连续，稍有帮助——它说明物流和制造是故事中的持续部分，而不是一次性公关实验——但不能证明同一批客户在续约或扩张。


              可见渠道结构也带来集中风险。UBTECH 显然是最具体的具名商业化路径，BAIC
              等战略投资方也指向少数具有产业重要性的交易对手，它们可能主导早期分发。短期看，这种集中度有好处，因为能加快接触设计伙伴。中期看，它有风险，因为客户扩张可能依赖少数交易对手、伙伴准备度和特定行业采购周期。公开层面，Manifold
              更像拥有少数潜在强关系的公司，而不是拥有广泛披露装机基础的公司。
