      - number: '8.3'
        title: 乐观 / 基准 / 悲观情景框架
        blocks:
          - type: paragraph
            body: >-
              Manifold 的乐观情景不能只靠“AI
              继续火”。它需要具名生产部署，需要证明公司能超越一两个战略渠道扩张，还需要让人相信模型层能拿到软件式经济性，而不是永远变成服务占比很高的集成工作。若这些条件出现，公司可以向前沿具身 AI
              可比公司的上沿重估，但很可能仍低于最成熟或资本最充足的私人领导者。


              基准情景更克制：Manifold
              仍具战略重要性，也能拿到融资，但在更好的客户证据出现前，当前独角兽叙事已经吸收了大部分已知上行。悲观情景不是技术失败，而是商业化滞后。如果下一轮融资早于具名部署、收入或可靠性证据，公司可能会发现，战略兴奋感挡不住估值压缩。换句话说，情景分歧不主要取决于原始模型质量，而取决于公司何时能证明谁付钱、多久付一次、利润率是多少。
