      - number: '8.2'
        title: 估值背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              当前估值故事有一个可信但不完整的锚。可信，是因为多家 2026 年 6 月来源称，Manifold 在 Pre-A 累计融资接近 RMB1 billion
              后进入独角兽层级。不完整，是因为公开信息仍没有收入披露、股权结构细节或优先股堆叠清晰度。也就是说，投资人应把当前估值标记看作战略期权价值，而不是已完整承销的后期运营估值。它更像对一个潜在重要基础设施层的早期索取权。


              检验这个期权价值，最好用可比公司施压。Physical Intelligence
              这类软件优先的机器人智能公司说明，当投资人相信模型层可以横跨多种具身形态时，上行溢价可以有多大。UBTECH、AgiBot、Unitree
              这类硬件较重的公司则提供反向纪律：真实部署、制造规模和最终公开市场审视，会迫使市场更尖锐地追问利润率、可靠性和复购需求。Manifold 介于这两类可比公司之间，也正因为如此，仅凭公开证据很难为激进定价辩护。
