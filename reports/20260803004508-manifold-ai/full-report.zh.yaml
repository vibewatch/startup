  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与定价可见度
        blocks:
          - type: paragraph
            body: >-
              公开证据足以推断 Manifold 收入模型的形状，但不足以判断规模。官网和 2026 年 6 月融资报道把公司定位在世界模型、具身控制，以及向机器人和 XR 相关物理 AI
              场景的部署上。这意味着收入很可能来自软件许可、集成和部署服务、伙伴驱动解决方案，以及可能与 WorldArena 生态绑定的基准或评估服务。公开来源没有给出任何订单、确认收入、ARR 或定价的硬数字。


              与相邻公司相比，这个缺口更明显。Wayve 公开把 AI Driver 描述为车辆无关的软件平台，具备经常性软件经济性；AGIBOT 的商店页面让硬件价格可见，但实现 ASP 和合同条款仍不透明。Physical
              Intelligence 和 Manifold 呈现同一模式：技术叙事具体、融资信号强，但没有公开变现数据。按尽调口径，正确姿态不是认为 Manifold 没有商业模式，而是承认其商业模式在公开市场里仍未被定价。
