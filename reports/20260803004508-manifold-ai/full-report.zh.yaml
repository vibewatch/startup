            body: Manifold 的私募市场验证已经写在融资记录里。仍缺失的是证据：这些资本是否已经产出经常性、高质量收入，而不只是高质量基准和有前景的试点。在价格、续约和利润率数据出现前，公司在财务上仍是高潜力但不透明。
