      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              近期具身 AI
              需求更多来自企业工作流痛点，而不是消费者机器人幻想。在制造和物流中，用户通常是一线工人、仓库运营人员或机器人工程师。买方在运营、自动化、制造或平台工程部门。付款方是资本开支、自动化或运营预算负责人，他们关心吞吐、换线灵活性、用工短缺和正常运行时间，而不是新奇感。因此，这个市场更像
              B2B 基础设施，而不是消费硬件。


              全行业的采用路径也越来越清晰。基准或实验室证明仍然重要——这也是 WorldArena
              和类似测试床受到关注的原因——但买方不会只凭基准分数就扩大部署。路径通常从技术证明走向受控试点，再到线体单元或站点部署，只有在运营稳定后才进入更广泛铺开。公开案例支持这一判断：UBTECH 2025
              年报显示工业人形机器人收入开始形成有意义规模；AGIBOT 把 Longcheer 消费电子部署包装为生产突破；Manifold 与 UBTECH 也明确把物流定位为商业化楔子。对 Manifold
              来说，这意味着在任何大众化软件分发模式具备可信度之前，销售很可能先由少数设计伙伴关系驱动。
