      - number: '3.4'
        title: 护城河耐久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Manifold 当前的护城河真实存在，但很脆。WorldArena 和 WorldScore
              认可可以帮公司打开工程师、研究者和早期设计伙伴的大门；与具身世界模型绑定，也给公司带来锋利的叙事优势。但同一组公开证据显示，这个市场的耐久优势正在模型、数据、硬件和部署渠道之间的整合闭环中形成。没有分发的基准领先只是可发现性，不是统治力。


              反向证据强化了这一谨慎判断。BCG 认为行业常常过度解读亮眼演示，因为灵巧度和因果推理落后于感知。MERICS 也称，中国具身 AI 生态仍依赖
              Nvidia，距离规模化充分自主还很远。整个同行集的公开定价、续约和客户集中度数据同样稀缺，这意味着许多竞争主张仍缺少硬运营验证。正确解读是，Manifold
              拥有机会窗口，而不是已经稳固的护城河：它必须先把评估领先变成可重复的工业结果，否则模型层能力会更容易被复制，或被打包进更大的全栈平台。
