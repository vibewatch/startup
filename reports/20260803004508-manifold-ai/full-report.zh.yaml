      - number: '7.5'
        title: 附录图表
        blocks:
          - type: callout
            title: 该品类最难的跃迁，正是 Manifold 所处的位置
            body: 很多具身 AI 公司失败，并不是因为模型无关紧要，而是运营可靠性、信任控制和伙伴经济性落后于技术叙事。Manifold 的公开记录显示，它现在正处在这个转折点。
