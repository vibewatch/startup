  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 技术和信任风险如何传导到客户证明、收入质量、融资和估值。
    data:
      nodes:
        - id: r1
          label: 基准与现场落差
        - id: r2
          label: 部署可靠性证明弱
        - id: r3
          label: 客户信任低 / 采购慢
        - id: r4
          label: 付费部署转化弱
        - id: r5
