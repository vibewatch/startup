        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              融资故事很清楚，尽管运营故事还不清楚。Manifold 在大约一年内完成六轮融资，到 2026 年 6 月 Pre-A 累计融资接近 RMB1 billion；此前还有 2026 年春季近 RMB200
              million 的 Pre-A 轮，以及随后更大规模融资。管理层称新资金将支持下一代模型研究、多模态基础设施，以及在物流、制造、汽车和 MR
              相邻场景中的部署。这符合一家仍在为产品市场发现和基础设施建设投入资金、而不是收割成熟经常性收入的公司。


              由于公开资料没有披露债务、信贷或项目融资义务，从外部看资本结构似乎由股权融资支撑。但资本充足性无法精确衡量，因为烧钱速度和现金跑道并不公开。实际情况是，下一轮融资触发点很可能更多取决于基准成功是否转化为可重复的工业部署和伙伴渠道，而不是会计里程碑。Embodied
              Global 的融资数据表明，资本仍会投向类别领导者；但这也意味着投资人会越来越要求运营证明，而不只是技术叙事。
