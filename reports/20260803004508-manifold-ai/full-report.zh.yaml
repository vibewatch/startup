      - number: '6.2'
        title: 公开采用证明
        blocks:
          - type: paragraph
            body: >-
              最强公开采用证明是与 UBTECH 的关系。盖世汽车和凤凰汽车都称，合作旨在把 Manifold 的世界模型与 UBTECH 的量产能力结合，从电商和物流开始推出可盈利的综合解决方案。UBTECH
              自己的解决方案页面展示了匹配的工作流——仓储、包裹处理、分拣、巡检和装配——这让合作在商业上连贯，而不是表面化。这是有意义的证明，说明 Manifold 至少拥有一个具备现实客户邻近性的具名渠道。


              UBTECH 之外，证据更分散。多个 2026 年 6 月媒体重复称，Manifold 技术已经部署或正在落地于电商物流和 3C
              制造，汽车制造则被提为下一步工业目标。但这些文章没有点名底层终端客户。WorldArena 又提供了另一层需求证据：超过 200
              份挑战赛提交，以及大型科技和研究团队参与，说明公司获得关注和技术兴趣；但这更适合归为生态采用，而不是客户采用。结论是，Manifold 的采用证明真实但分层：伙伴 /
              渠道证据最强，场景级部署主张中等，具名终端账户证明较弱。
