      - number: '1.2'
        title: 创始人、研究谱系与治理可见度
        blocks:
          - type: paragraph
            body: >-
              对一家中国民营 AI 初创公司而言，公开创始人归属异常一致：多方来源都把吴伟博士列为创始人兼 CEO，并称其曾是 SenseTime
              高管，拥有直接的世界模型经验。几篇文章还重复了更强的可信度信号——吴伟曾带队连续两次在 Waymo SimAgents Challenge
              获得第一——这说明创立故事扎根在仿真和智能体行为建模，而不是临时转向“物理 AI”。


              更大的团队故事试图把学术背书和落地可信度捏在一起。QQ、盖世汽车和百度百科的报道称，公司集合了清华 FIB Lab 研究人员、清华教授 / 长江学者，以及前大厂世界模型或自动驾驶负责人。公开材料还称团队累计发表
              200 多篇顶会论文、获得超过 100,000
              次引用。对一家重评估、基准驱动的公司来说，这是很强的创始人市场匹配信号。弱点在治理透明度：所审阅材料没有披露董事会、独立监督或更完整的高管梯队。按尽调口径，Manifold
              目前仍像一家由创始人和研究驱动的公司，关键人集中在吴伟身上，公开证据也有限，无法判断资本如何转化为正式治理控制。
