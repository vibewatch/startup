    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 按投委会式打分看，Manifold AI 志向很高，验证结果参差，价格支撑还不完整。
    approximationNotes: 分数为编辑性 1-10 分判断，依据截至 2026-08-03 留存的公开证据。
    data:
