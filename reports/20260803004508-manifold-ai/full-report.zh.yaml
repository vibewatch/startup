      - number: '4.4'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              核心财务结论是，Manifold 更容易被承保为一项资本充足、押注具身 AI
              领导地位的期权，而不是一个可量化的运营业务。资本基础可信，用途叙事连贯，竞争代理指标也显示，如果软件优先供应商能成为工业机器人里的模型和部署层，确实存在经济奖品。但完整财务视图所需的硬运营证据仍然缺席：价格实现、客户集中度、烧钱速度、毛利率、营运资金需求和续约行为。


              这些缺失数据很重要，因为如果服务、集成和一次性试点主导收入结构，具身 AI 的收入质量会迅速变差。Manifold
              最终可能证明自身经济性远好于硬件重同行，但公开来源尚未证明这个结果。在公司能展示付费部署可重复性之前，它应被视为高潜力但高不透明度的资本消耗者。因此，尽调优先级很简单：用价格、合同和单位经济证明，替代基准和融资证明。
