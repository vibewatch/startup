          value: 8
          scale: 10
        - label: 技术护城河
          value: 8
          scale: 10
        - label: 客户验证
          value: 4
          scale: 10
        - label: 经济性披露
          value: 2
          scale: 10
        - label: 风险调整后价格支撑
          value: 3
          scale: 10
        - label: 证据质量
          value: 4
          scale: 10
    claimRefs:
      - CV005
      - CV006
      - CV018
      - CV038
      - CV040
