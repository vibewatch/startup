        title: 成本结构与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              Manifold 的实体资产负债表可能比机器人制造商更轻，但默认并不是低成本纯软件业务。主要成本桶很可能包括训练和推理算力、多模态数据采集和标注、仿真和评估基础设施、部署工程，以及伙伴支持。BCG 关于传统机器人
              TCO 主要由设置和再工程主导的发现很有用，因为它解释了以模型为中心的供应商在哪里创造价值：减少工程劳动、加快换线，而不只是产出“更聪明的演示”。ResearchInChina
              也从另一侧强化了这一点，称瓶颈已转向可扩展的高质量数据和数据运营。


              代理比较有利有弊。UBTECH 的监管文件显示，即便收入增长、毛利率改善，规模化工业人形机器人公司仍可能出现有意义亏损，这提醒市场不要天真乐观地看待具身 AI
              经济性。但同一份文件也提示了软件优先供应商的上行空间：如果 Manifold 能避开大额硬件
              BOM、库存和制造成本，长期利润率结构应好于硬件主导同行。问题在服务。如果每次部署都需要定制调优、重度现场支持或劳动密集型数据工作，软件式毛利率可能永远无法充分出现。
