      - number: '5.4'
        title: 信任、安全与产品技术结论
        blocks:
          - type: paragraph
            body: >-
              信任与安全是这套栈里公开可见度最低的一层。Manifold
              所处产品类别会影响机器人移动、动作规划和工业工作流，但公开界面没有暴露通常支撑企业信心的材料：安全认证、事故报告、安全控制、与数据采集绑定的隐私政策，或部署质量指标。这并不意味着这些控制不存在，而是它们不足以支撑公开尽调。AGIBOT
              等相邻机器人厂商更清楚地发布硬件保修和认证表面，尽管这些材料也不能解决模型层安全。


              因此，产品技术结论是两面的。一面，Manifold
              看起来确实差异化：基准原生、研究产出高，并且罕见地明确强调功能型具身评估。另一面，它仍更像一个前沿技术平台，而不是文档完备的企业产品。对投资人或客户来说，下一步尽调不是争论模型是否有趣，而是要求公司披露可支持性、安全性、失效安全行为、数据治理和部署可靠性。
