          - type: callout
            title: 软件优先经济性有可能，但不会自动出现
            body: >-
              与硬件优先的人形机器人同行相比，Manifold
              的毛利率天花板在结构上应更高。但只有当世界模型部署不变成服务很重的定制项目时，这个天花板才有意义。因此，真正的经济性战斗不是“软件对硬件”，而是“可重复平台对昂贵现场工程”。
            calloutType: insight
            claimRefs:
