  - id: FU004
    title: 留存 / 复购队列
    type: cohort
    layout: standard
    summary: 真实留存数据未公开，因此本队列用公开关系可见度的延续性粗略代理耐久性。100 表示该关系或场景在相应时间段内仍保持公开可见。
    data:
      columns:
        - '2025'
        - 2026 上半年
        - 2026 下半年至今
      rows:
