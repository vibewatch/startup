      - number: '5.2'
        title: 架构与数据闭环
        blocks:
          - type: paragraph
            body: >-
              公开技术证据显示，Manifold 的架构围绕功能型具身表现设计，而不只是追求照片级输出。WorldArena 衡量的不只是视频质量，还包括合成数据可用性、策略评估质量和动作规划价值。RoboScape
              论文同样强调物理信息训练、时间深度预测和关键点动力学学习。Reportify 又补充了更大的架构叙事：LongScape 以及混合自回归 + DiT 方法支撑多个模型家族；Pedaily 则强调 MoE
              结构，把指令跟随、移动交互和操作推理等子问题拆开。


              同样重要的是数据闭环故事。公开报道称，公司拥有硬件-数据-模型闭环、自建数据采集设备、硬件在环强化学习，以及数十万小时数据。每个细节是否都被独立验证，并没有它对架构的暗示那么重要：Manifold
              把评估、数据捕获和部署反馈视为产品栈的一部分，而不是离线支持功能。对具身 AI 来说，这是可信的设计哲学，因为产品质量取决于能否从模型输出走到机器人行为，再回到训练。
