  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑 vs. 反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Manifold 的投资逻辑很直接：公司似乎在具身 AI
              中占住了稀缺战略位置。它较早在中国推进世界模型商业化，基准领先比单纯视频美学更有意义，也已经融到足够资本，在许多同行还在定义楔子时继续投入建设。公开来源还显示，它与物流、制造、机器人等场景存在可信相关性，并通过
              UBTECH 拥有可见商业化渠道。如果具身 AI 成为大型工业品类，站在模型与评估层的公司，相对当前规模可能获得不成比例的话语权。


              反向逻辑同样直接：在品类经济性被证明之前，Manifold
              可能已经按品类赢家定价。今天几乎所有高质量公开信号都在持久运营证明的上游——融资轮、基准、技术论文和伙伴公告。真正稀缺的是能告诉投资人这些信号是否滚成真实业务的数字。这个不对称让公司值得跟踪，也让追高变得危险。溢价并非不理性，只是验证不足。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV021
              - CV022
