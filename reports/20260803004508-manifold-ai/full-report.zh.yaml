      - number: '2.4'
        title: 增长动力与约束
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动都很务实。36Kr 指向老龄化、用工短缺，以及僵硬的传统自动化在柔性制造中的边界。ResearchInChina
              补充说，硬件一旦越过最早原型阶段，真正瓶颈会转向可扩展、物理上逼真的多模态数据，以及把这些数据变成持续改进模型的系统。BCG 从经济性角度强化了同一点：机器人 TCO
              主要被设置和再工程吃掉，所以软件定义的灵活性即使在通用自主尚未出现前，也能释放不成比例的价值。


              约束同样重要。MERICS 认为，中国具身 AI 推进仍高度依赖 Nvidia 生态，而精度、灵巧度和成本在许多部署中仍未解决。BCG
              在概念上更直接：今天的市场可以围绕感知和有边界的操作创造价值，但不确定性下的真正推理仍是前沿。监管是另一个慢变量。具身 AI
              一旦扩展到移动、公共服务和劳动力管理，一些系统会碰到关键基础设施或就业决策等高风险类别。结果是一个动能极强、但 ROI 边界仍不确定的市场——正是在这种环境里，Manifold
              这样的基准领先者可以早早吸引资本，但仍需客户证明，实际 SOM 才会清楚。
