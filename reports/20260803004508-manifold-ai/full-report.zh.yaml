      - number: '5.3'
        title: 部署成熟度与依赖
        blocks:
          - type: paragraph
            body: >-
              Manifold 的公开成熟度并不均衡。研究侧异常清晰：基准仓库、公开论文和挑战赛基础设施都存在。部署侧更薄。公开来源称模型正用于物流、3C 制造和机器人场景，UBTECH 合作也显示 Manifold
              希望运行在第三方机器人平台之上。Reportify
              还称公司已经为边缘部署量化并蒸馏模型，包括机器人移动和无人机导航。合在一起，这些都是有意义的产品化信号，但仍达不到企业客户充分承保生产系统所需的水平：集成文档、支持边界、正常运行时间指标、回滚工作流和现场可靠性证据。


              最重要的依赖也摆在明面上。产品需要强边缘算力，所以 NVIDIA 的 Jetson Thor 材料作为生态背景很重要。产品需要伙伴硬件或集成商渠道，所以 UBTECH
              很重要。它还可能需要来自客户环境的特权数据流，所以不能只凭榜单排名判断部署成熟度。Manifold 在具身世界模型基准上可能已经技术领先于同行，但运营成熟度仍取决于公开记录之外的基础设施、硬件伙伴和部署纪律。
