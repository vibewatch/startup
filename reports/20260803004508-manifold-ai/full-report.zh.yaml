              今天做客户尽调，应区分战略拉力和账户级证明。Manifold
              显然有战略拉力：工业领域反复出现，渠道伙伴可见，世界模型基准叙事正在吸引关注。但公司仍缺少把战略拉力转化为高置信客户逻辑的披露：具名终端客户、结果指标、部署数量、集中度细节和留存历史。


