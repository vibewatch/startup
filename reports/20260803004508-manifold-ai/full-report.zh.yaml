    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 证据质量因维度不同而差异明显：渠道证明远强于终端客户结果证明。
    approximationNotes: 矩阵取值是分析师基于公开记录具体程度作出的判断。
    data:
      columns:
        - 具名交易对手
        - 生产落地具体度
        - 结果具体度
        - 留存可见度
      rows:
