companyProfile:
  summary: >-
    Manifold AI (流形空间) is a Beijing-based embodied-AI startup founded on
    2025-05-22 by Dr. Wu Wei, a former SenseTime executive, together with a team
    linked to Tsinghua University's FIB Lab. The company is positioning itself as
    a world-model infrastructure provider for physical AI: WorldScape serves as
    the real-time spatial world model, WorldScape Policy extends that stack into
    action and control, and WorldArena gives the company a benchmark layer that
    reinforces its preferred definition of functional embodied intelligence.
    Public evidence shows unusually rapid progress in technical signaling and
    financing—near-RMB1B of cumulative Pre-A funding across six rounds by June
    2026, plus repeated top-rank claims across WorldScore, WorldArena, and
    RoboTwin—but still limited disclosure on operating metrics and customer
    durability.
  foundedDate: '2025-05-22'
  founders:
    - name: Dr. Wu Wei
      role: Founder & CEO
      background: >-
        Former SenseTime executive and public face of Manifold's world-model and
        embodied-AI strategy; repeatedly cited as having led Waymo SimAgents
        challenge-winning teams before founding the company.
      claimRefs: [CO014, CO015, CO016]
    - name: Tsinghua FIB Lab-linked founding team
      role: Research co-founders / technical leadership
      background: >-
        Public materials tie the founding roster to Tsinghua University's FIB Lab,
        described as one of China's earliest world-model research groups.
      claimRefs: [CO017]
  foundingLocation: Beijing, China
  headquarters: Beijing, China
  productSummary: >-
    WorldScape world model, WorldScape Policy world-action layer, and related
    robotics / embodied-AI infrastructure spanning benchmark tooling,
    data-collection loops, and deployment support for logistics, 3C
    manufacturing, automotive manufacturing, and adjacent physical-AI scenarios.
  customerFocus: >-
    Enterprise buyers in e-commerce logistics, 3C manufacturing, automotive
    manufacturing, and robotics OEM / integrator channels seeking embodied-AI
    control, evaluation, and deployment capability.
  businessModel: >-
    Likely mix of software licensing, integration / deployment services,
    partner-enabled solutions, and potentially benchmark / evaluation-linked
    monetization, though no public revenue or price sheet is disclosed.
  stage: Pre-A / Early Commercialization
  fundingStatus: >-
    Six financing rounds completed within roughly one year; cumulative Pre-A
    financing reached nearly RMB 1 billion by June 2026, putting the company in
    the unicorn tier while still leaving revenue, runway, and preference-stack
    detail undisclosed.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO014, CO017, CI014, CE035, CU035, CV040]
