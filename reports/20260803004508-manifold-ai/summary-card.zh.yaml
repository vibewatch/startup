  topStrengths:
    - 在具身 AI 世界模型层定位稀缺，WorldScore、WorldArena、RoboTwin 等方向都有公开领先主张。
    - 融资速度快，Pre-A 累计近 RMB1B 资本提供可信资金底座，支撑继续研发和部署迭代。
    - 产品叙事覆盖模型、动作、数据和基准层，而不是单点方案；如果商业化跟上，可能形成基础设施式权力。
    - 物流和 3C 制造部署主张反复出现，再加上 UBTECH 这一具名商业化渠道，早期工业相关性已经可见。
    - 创始人-市场匹配度强：Wu Wei 和 Tsinghua 系团队同时具备基准可信度和世界模型部署经验。
  topRisks:
    - 收入、ARR、毛利率、客户数和现金跑道均未披露，仅靠公开证据无法按后期公司口径承保估值。
    - 客户证明更多来自渠道和场景，而不是具体账户；公开记录中可点名的终端客户生产部署仍然稀少。
    - 相比产品会影响物理世界这一事实，信任、安全、隐私和治理材料偏薄。
    - 商业化似乎依赖少数渠道和战略生态，尤其是 UBTECH 以及有产业连接的支持方。
    - 公司可能已按品类领导者定价，但公开证据尚未证明可复制、接近软件的部署经济性。
  unresolvedGaps:
    - 需要具名生产客户清单，列明部署阶段、站点数量和可引用 KPI 结果。
    - 需要收入、订单、毛利、烧钱速度和现金跑道数据，以区分软件经济性与服务密集型试点。
    - 需要快速六轮融资之后的完整股权结构表、清算优先权和 side-letter 经济条款。
    - 需要 UBTECH 及其他 OEM / 集成商渠道的合作经济性和商业所有权细节。
