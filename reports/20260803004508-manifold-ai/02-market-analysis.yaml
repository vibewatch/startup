  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "Manifold AI operates in a fast-expanding but analytically messy market: broad China embodied-intelligence estimates already exceed RMB915 billion in 2025 and point above RMB1 trillion in 2026, while much narrower data-and-model infrastructure lenses remain in the hundreds of millions. The important takeaway is not one TAM number but the structure beneath it: capital is concentrating into a handful of flagship companies, manufacturing and logistics are the clearest early demand surfaces, and data plus edge-compute infrastructure are becoming the gating resources. For Manifold, this means the practical serviceable market is far smaller than the headline TAM but still attractive because world-model software sits on the critical path of deployment."
  },
  "sections": [
    {
      "id": "market-boundary",
      "title": "Market Boundary: Embodied-AI Enablement, Not the Whole Robot Economy",
      "body": "The most important framing choice is to avoid treating “embodied AI,” “humanoid robots,” “autonomous mobility,” and “world models” as interchangeable. For Manifold AI, the relevant market is the enablement layer: world models, action models, data pipelines, and deployment software that help machines perceive and act inside real physical workflows. That layer touches a much broader embodied-intelligence economy, but it is not equivalent to the full robot hardware market or to generic video-generation AI. BCG's capability-based framework is useful here because it treats physical AI as a stack of capabilities—perception, manipulation, planning, and reasoning—rather than a single robot form factor.\n\nThis distinction matters directly for valuation and go-to-market. A broad trillion-yuan market narrative may be directionally correct for the Chinese embodied-intelligence economy, but Manifold will only monetize a subset of that spend: the portion devoted to model infrastructure, data, control software, and deployment into scenarios where physical reasoning adds measurable value. Adjacent players help clarify the boundary. Physical Intelligence sells a “model for any robot” story, Wayve applies embodied AI to autonomous driving, and firms like AGIBOT, Unitree, X Square, ROBOTERA, Fourier, and UBTECH mix hardware, software, and scenario ownership in different proportions. Manifold sits closest to the software-and-model layer inside that broader field.",
