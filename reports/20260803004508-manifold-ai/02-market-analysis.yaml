    {
      "id": "buyers-and-adoption",
      "title": "Buyers, Users, Payers, and the Adoption Path",
      "body": "Near-term embodied-AI demand is being pulled less by consumer robotics fantasies than by enterprise workflow pain. In manufacturing and logistics, the user is usually line labor, warehouse operations staff, or robotics engineers. The buyer sits in operations, automation, manufacturing, or platform engineering. The payer is a capex, automation, or operations budget owner who cares about throughput, changeover flexibility, labor scarcity, and uptime rather than about novelty. That makes the market more B2B infrastructure-like than consumer-hardware-like.\n\nThe adoption path is also increasingly legible across the sector. Benchmark or lab proof still matters—hence the attention to WorldArena and similar testbeds—but buyers do not scale on benchmark scores alone. The path typically runs from technical proof to controlled pilots, then to line-cell or site deployment, and only after operational stability to broader rollout. Public examples support that reading: UBTECH's 2025 report shows industrial humanoid revenue moving into meaningful scale; AGIBOT markets its Longcheer consumer-electronics deployment as a production breakthrough; and Manifold plus UBTECH are explicitly positioning logistics as a commercialization wedge. For Manifold, that means sales are likely to be driven by a small number of design-partner relationships before any mass-market software distribution model becomes credible.",
