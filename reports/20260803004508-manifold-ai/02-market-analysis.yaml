    {
      "id": "sizing-lenses",
      "title": "Sizing Lenses: Big TAM, Much Smaller Immediate Software Opportunity",
      "body": "Public market estimates are best treated as multiple lenses rather than a single reconciled answer. On the broadest lens, 36Kr Research Institute estimates that China's embodied-intelligence market reached RMB915 billion in 2025 and could top RMB1 trillion in 2026. On a narrower lens, ResearchInChina estimates the China EAI data market at RMB500 million in 2025, growing 203% year over year and holding around 40% of the global market. A third lens comes from financing flow rather than end-market spend: Embodied Global's H1 2026 tally shows RMB93.5 billion across 322 deals, with a strong barbell structure that channels most capital toward a short list of flagship companies.\n\nThese estimates do not contradict each other so much as they measure different things. The broad figure counts an economy that includes hardware, integration, services, and downstream deployments. The narrow figure focuses on data infrastructure and model-development inputs. Financing flow is not revenue at all, but it does reveal how aggressively investors are trying to underwrite future category leaders before mature commercial metrics exist. For Manifold, the right interpretation is conservative: the headline TAM demonstrates direction of travel and policy priority, but the immediately serviceable market is closer to the smaller, software-and-data-heavy wedge than to the full trillion-yuan industrial total.",
      "claimRefs": [
        "CM003",
        "CM004",
