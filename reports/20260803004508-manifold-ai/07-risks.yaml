      ]
    },
    {
      "id": "dependency-financial-and-people",
      "title": "Dependency, Financial, and People Risk",
      "body": "Manifold’s current go-to-market posture is dependency-heavy. The clearest visible commercialization route is through UBTECH, which immediately creates channel, timing, and partner-health dependence. The broader category is also dependent on high-end compute, with MERICS and NVIDIA both reinforcing how central advanced edge hardware remains. On top of that sits the company’s own data-loop thesis: a large share of its moat depends on continued access to customer environments, sensors, and site data. If any one of those inputs—compute, partner hardware, or data rights—gets constrained, commercialization can stall even if the core model continues improving.\n\nFinancially, the risk is less insolvency than expectation pressure. Current capital mitigates near-term survival risk, but repeated fundraising without disclosed operating metrics increases the burden of proof for the next round. At the people level, the company also looks key-man dependent: the public narrative is strongly identified with founder Wu Wei, elite research credentials, and scarce world-model talent. That is an advantage while building the wedge, but it can become a scaling risk if industrial delivery, customer operations, and safety governance lag behind the research function.",
      "claimRefs": [
