  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Manifold AI (流形空间) is a Beijing-based embodied-AI startup founded in May 2025 by former SenseTime executive Dr. Wu Wei and a team linked to Tsinghua University's FIB Lab. Public evidence supports a rare combination of rapid technical signaling and rapid financing: WorldScape and WorldScape Policy are repeatedly described as top-ranked on WorldScore, WorldArena, and RoboTwin, while cumulative Pre-A funding reached nearly RMB 1 billion across six rounds by June 2026, placing the company in the billion-dollar unicorn tier. The strongest remaining gaps are around governance, exact headcount, customer count, and audited commercial metrics, so the company currently reads as a highly capitalized, benchmark-led, early-commercialization story rather than a fully disclosed operating business."
  },
  "sections": [
    {
      "id": "identity-and-product",
      "title": "Identity, Mission, and Product Scope",
      "body": "Manifold AI, also branded in Chinese as 流形空间, traces its public start to 2025-05-22, when the company site went live and the legal-entity timeline in public profiles begins. Reviewed sources consistently place the company in Beijing and describe it as an early mover in using self-developed world models as the base layer for embodied intelligence. The official positioning is broad rather than narrowly robotic-software-only: Manifold says it is building next-generation world models for AI hardware applications including robotics and XR equipment. Independent June 2026 coverage sharpens that pitch by framing the company as China's first startup to treat a proprietary world model as the foundation model for embodied AI.\n\nThe core product narrative centers on WorldScape and WorldScape Policy. WorldScape is repeatedly described as a real-time world model that supports both mobility and manipulation in a single interaction loop, which matters because it moves the company beyond prettier video generation toward robot-usable state prediction. Public descriptions of the architecture emphasize a mixture-of-experts design and strong geometric grounding. WorldScape Policy extends that stack into action execution, with the company claiming stronger closed-loop performance than existing VLA baselines. Taken together, the product claim is not just “better simulation,” but a pretraining and control stack intended to help robots perceive, reason, and act in messy physical environments.",
