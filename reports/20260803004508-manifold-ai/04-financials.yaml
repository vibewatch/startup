  "chapter": {
    "number": 4,
    "title": "Financials",
    "summary": "Manifold AI has raised enough capital to look financially significant, but not enough public disclosure to look financially transparent. The best-supported fact is cumulative Pre-A funding of nearly RMB1 billion by June 2026 across six rounds, with proceeds earmarked for model iteration, multimodal infrastructure, and scenario deployment. What remains missing are the operating numbers that turn capital into a business model: revenue, ARR, customer count, gross margin, burn, and runway. Relative to hardware-heavy peers such as UBTECH and AGIBOT, Manifold likely has a structurally better margin ceiling if it stays software-led—but that advantage will only matter if deployment and service work do not absorb most of the economics."
  },
  "sections": [
    {
      "id": "revenue-model-and-pricing",
      "title": "Revenue Model and Pricing Visibility",
      "body": "Public evidence is strong enough to infer the shape of Manifold's revenue model but not its magnitude. The official site and June 2026 financing coverage position the company around world models, embodied control, and deployment into robotics and XR-linked physical-AI scenarios. That implies revenue would likely come from a mix of software licensing, integration and deployment services, partner-enabled solutions, and possibly benchmarking or evaluation services linked to the WorldArena ecosystem. What public sources do not provide is any hard number on bookings, recognized revenue, ARR, or pricing.\n\nThat gap becomes more visible when compared with adjacent companies. Wayve openly frames its AI Driver as a vehicle-agnostic software platform with recurring software economics, while AGIBOT's store pages make hardware prices visible but still leave realized ASPs and contract terms opaque. Physical Intelligence and Manifold share the same pattern: technically specific public narratives and strong funding signals, but no public monetization data. For diligence purposes, the correct stance is therefore not that Manifold lacks a business model, but that its business model remains unpriced in public.",
      "claimRefs": [
        "CI001",
        "CI003",
        "CI004",
