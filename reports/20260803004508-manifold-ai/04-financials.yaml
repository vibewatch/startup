    },
    {
      "id": "capital-adequacy-and-dependence",
      "title": "Capital Adequacy and Financing Dependence",
      "body": "The financing story is clear even if the operating story is not. Manifold completed six rounds in roughly one year and reached nearly RMB1 billion of cumulative Pre-A financing by June 2026, after a spring 2026 near-RMB200 million Pre-A round and later larger financings. Management said the new money would support next-generation model research, multimodal infrastructure, and deployment into logistics, manufacturing, automotive, and MR-adjacent scenarios. This is consistent with a company still funding product-market discovery and infrastructure buildout rather than harvesting mature recurring revenue.\n\nBecause no debt, credit, or project-finance obligations were publicly disclosed, the capital structure appears equity funded from the outside. But capital adequacy cannot be measured precisely because burn and runway are not public. In practice, that means the next round will likely be triggered less by accounting milestones than by evidence that benchmark success is converting into repeatable industrial deployments and partner channels. Embodied Global's funding data suggests capital remains available for category leaders, but also means investors will increasingly demand operating proof rather than just technology narrative.",
      "claimRefs": [
        "CI013",
