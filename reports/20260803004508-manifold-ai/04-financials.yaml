    {
      "id": "cost-structure-and-unit-economics",
      "title": "Cost Structure and Unit Economics Proxies",
      "body": "Manifold likely has a lighter physical balance sheet than robot manufacturers, but it is not a low-cost pure-software business by default. The major cost buckets are likely compute for training and inference, multimodal data collection and labeling, simulation and evaluation infrastructure, deployment engineering, and partner support. BCG's finding that traditional robotics TCO is dominated by setup and reengineering is useful here because it explains where a model-centric vendor can create value: by reducing engineering labor and accelerating changeovers, not only by producing “smarter demos.” ResearchInChina reinforces this by arguing that the bottleneck has shifted toward scalable high-quality data and data operations.\n\nThe proxy comparisons cut both ways. UBTECH's filing shows that a scaled industrial-humanoid company can still post meaningful losses despite revenue and improving gross margin, warning against naive optimism around embodied-AI economics. But that same filing also suggests the upside for a software-first vendor: if Manifold can avoid large hardware BOM, inventory, and manufacturing costs, its long-run margin structure should be better than a hardware-led peer. The catch is services. If every deployment requires bespoke tuning, heavy on-site support, or labor-intensive data work, software-style gross margins may never fully emerge.",
      "claimRefs": [
        "CI008",
        "CI009",
