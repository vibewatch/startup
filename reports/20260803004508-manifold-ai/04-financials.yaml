    {
      "id": "financial-verdict",
      "title": "Financial Verdict and Diligence Blockers",
      "body": "The central financial conclusion is that Manifold is easier to underwrite as a capitalized option on embodied-AI leadership than as a measurable operating business. The capital base is credible. The use-of-funds story is coherent. The competitive proxies suggest there is a real economic prize if a software-first vendor can become the model and deployment layer inside industrial robotics. But the hard operating evidence required for a full financial view is still absent: price realization, customer concentration, burn, gross margin, working capital needs, and renewal behavior.\n\nThat missing data matters because revenue quality in embodied AI can deteriorate quickly if services, integrations, and one-off pilot work dominate the mix. Manifold could eventually prove much better economics than hardware-heavy peers, but public sources do not yet establish that outcome. Until the company can show repeatability of paid deployments, it should be treated as a high-potential but high-opacity capital consumer. The diligence priority is therefore simple: replace benchmark-and-funding proof with price, contract, and unit-economics proof.",
      "claimRefs": [
