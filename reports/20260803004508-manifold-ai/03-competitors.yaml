    {
      "id": "commercialization-and-distribution",
      "title": "Commercialization, Distribution, and Trust",
      "body": "The biggest gap between Manifold and the most mature rivals is commercialization visibility. UBTECH is the strongest public benchmark here because it has filing-backed revenue, named industrial application focus, annualized production capacity above 6,000 humanoids, and an explicit standards-setting role. AGIBOT also looks further down the deployment curve than Manifold based on its Longcheer manufacturing announcement and “Deployment Year One” framing. Waymo One proves a different point: operated autonomous service models can achieve public commercial scale, even if they are not direct licensing peers.\n\nDistribution power increasingly comes from ecosystems, not just algorithms. Strategic investors and industrial partners matter because they provide access to customers, supply chains, integration capacity, and credibility. X Square, ROBOTERA, UBTECH, and Wayve all emphasize investor and partner networks alongside technical depth. NVIDIA's Jetson Thor ecosystem is another reminder that foundational compute is being shared across the sector, which reduces low-level infrastructure differentiation and pushes competition upward into data, deployment, and trust. For Manifold, that means the real contest is whether benchmark attention can be converted into durable channels before larger partner-rich players lock up the best scenarios.",
      "claimRefs": [
