  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Manifold AI’s public customer record shows real industrial pull, but not yet enough transparency to underwrite customer durability. The company is repeatedly linked to e-commerce logistics, 3C manufacturing, and automotive manufacturing, and its strongest named commercialization proof is the July 2026 strategic partnership with UBTECH to bring profitable solutions into e-commerce and logistics. What is missing are the standard account-level signals: named end customers, customer count, deployment count, utilization, outcomes, renewals, and concentration data. In other words, Manifold looks like a company with channel and scenario traction, not yet a company with fully disclosed customer traction."
  },
  "sections": [
    {
      "id": "segments-and-buyer-map",
      "title": "Customer Segments and Buyer Map",
      "body": "The public record is clear on use cases but fuzzy on accounts. Manifold is consistently tied to e-commerce logistics, 3C manufacturing, automotive manufacturing, and—more tentatively—mixed reality exploration. This implies an enterprise customer base whose buying centers likely sit in operations, industrial automation, and innovation budgets rather than in IT-only or consumer channels. The product is also unlikely to be bought by frontline robot operators themselves. Those teams are users, while manufacturing groups, robotics platform owners, or industrial strategics are the likely buyers and payers.\n\nThe other important customer segment is indirect: robot OEMs and ecosystem partners. Public evidence suggests Manifold is not only selling directly into factories or warehouses, but also trying to embed its world-model capability inside partner platforms that already touch customers. That matters because it changes the customer story from “how many logos does Manifold have?” to “how much of the route to market may be mediated by hardware or industry partners?” Publicly, the latter is easier to prove than the former.",
      "claimRefs": [
        "CU001",
        "CU002",
        "CU003",
        "CU013",
        "CU033"
      ],
      "tableRefs": [
