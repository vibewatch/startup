    {
      "id": "customer-verdict",
      "title": "Customer Verdict",
      "body": "Customer diligence today should separate strategic pull from account-level proof. Manifold clearly has strategic pull: industrial sectors keep recurring, channel partners are visible, and the world-model benchmark narrative is attracting attention. But the company still lacks the disclosures that convert strategic pull into a high-confidence customer thesis: named end customers, outcome metrics, deployment counts, concentration detail, and retention history.\n\nThat does not invalidate the customer story. It means the story is in transition. A fair reading is that Manifold has likely crossed the threshold from pure research novelty into real industrial engagement, but has not yet crossed the threshold into transparently evidenced customer durability. For an investor, the next step is not to ask whether customers exist in some form. It is to force a data-room answer to how many, how active, how sticky, and how concentrated they are.",
      "claimRefs": [
        "CU024",
        "CU025",
        "CU026",
        "CU034",
        "CU035"
      ],
