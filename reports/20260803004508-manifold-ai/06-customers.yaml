    {
      "id": "durability-and-concentration",
      "title": "Durability, Retention, and Concentration",
      "body": "Durability is where the public record thins out sharply. No reviewed source discloses active accounts, deployment counts, utilization, customer outcomes, contract length, renewal rates, NRR, or churn. That makes it impossible to tell whether the company is graduating from technically impressive pilots into repeatable production relationships. Continuity of sector messaging across June and July 2026 helps a little—it suggests logistics and manufacturing are persistent parts of the story rather than one-off PR experiments—but it does not prove that the same customers are renewing or expanding.\n\nThe visible channel structure also creates concentration risk. UBTECH is clearly the most concrete named commercialization path, and strategic investors such as BAIC point toward a small set of industrially important counterparties that could dominate early distribution. That concentration can be good in the short run because it speeds design-partner access. It is risky in the medium run because customer expansion may depend on a handful of counterparties, partner readiness, and sector-specific procurement cycles. Publicly, Manifold looks more like a company with a few potentially powerful relationships than one with a broad disclosed installed base.",
      "claimRefs": [
