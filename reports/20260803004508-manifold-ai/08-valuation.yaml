      "figureRefs": [
        "FV001"
      ]
    },
    {
      "id": "valuation-context-and-entry-discipline",
      "title": "Valuation Context and Entry Discipline",
      "body": "The current valuation story rests on a credible but incomplete anchor. Credible, because multiple June 2026 sources say Manifold reached the unicorn tier after cumulative Pre-A financing near RMB1 billion. Incomplete, because there is still no public revenue disclosure, cap-table detail, or preference-stack clarity. That means investors should think about the current mark as a strategic option value, not as a fully underwritten late-stage operating valuation. It resembles an early claim on a potentially important infrastructure layer.\n\nThe best way to pressure-test that option value is through comparables. Software-first robot-intelligence companies like Physical Intelligence demonstrate how large the upside premium can become when investors believe a model layer could be horizontal across embodiments. Hardware-heavy companies like UBTECH, AgiBot, and Unitree demonstrate the opposite discipline: real-world deployment, manufacturing scale, and eventually public-market scrutiny force sharper questions on margins, reliability, and repeat demand. Manifold belongs in between those two comp families, which is precisely why aggressive pricing is hard to justify from public evidence alone.",
      "claimRefs": [
        "CV007",
