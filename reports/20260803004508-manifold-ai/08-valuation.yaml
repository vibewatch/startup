    {
      "id": "scenario-frame",
      "title": "Bull / Base / Bear Scenario Frame",
      "body": "A bull case for Manifold requires more than “AI keeps being hot.” It requires named production deployments, proof that the company can scale beyond one or two strategic channels, and some reason to believe the model layer can capture software-like economics rather than turning into perpetual services-heavy integration work. If those conditions emerge, the company could justify a rerating toward the upper end of frontier embodied-AI comps, though still likely below the most mature or best-capitalized private leaders.\n\nThe base case is more modest: Manifold remains strategically important and financing-accessible, but the current unicorn narrative already captures much of the known upside until better customer evidence appears. The bear case is not technical failure; it is commercialization lag. If the next round arrives before named deployments, revenue, or reliability evidence, the company could discover that strategic excitement does not eliminate valuation compression. In other words, the scenarios turn less on raw model quality than on when the company can prove who pays, how often, and at what margin.",
      "claimRefs": [
        "CV019",
        "CV020",
        "CV023",
        "CV024",
        "CV025",
        "CV026",
