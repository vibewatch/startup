        "FV003"
      ]
    },
    {
      "id": "recommendation-and-final-gates",
      "title": "Recommendation and Final Gates",
      "body": "The recommendation is therefore not “no.” It is “not yet at any price.” A disciplined investor can justify staying close to the story because the upside is real and the company may still be early to a large category. But a disciplined investor should also refuse to underwrite a premium late-stage mark using only benchmark wins, funding momentum, and partner narratives. The gating items are concrete: named production accounts, basic operating metrics, partner economics, cap-table clarity, and governance readiness.\n\nIf those pieces improve, Manifold could graduate from an interesting strategic option into an investable late-stage growth story. If they do not, the current narrative is likely to outrun the evidence. That is why the right public-only verdict is track / research-more with strict price discipline: keep the company in focus, but let the next tranche of operating proof—not fear of missing out—set the entry.",
