              The visible channel structure also creates concentration risk. UBTECH is clearly the most concrete named
              commercialization path, and strategic investors such as BAIC point toward a small set of industrially
              important counterparties that could dominate early distribution. That concentration can be good in the
              short run because it speeds design-partner access. It is risky in the medium run because customer
              expansion may depend on a handful of counterparties, partner readiness, and sector-specific procurement
              cycles. Publicly, Manifold looks more like a company with a few potentially powerful relationships than
