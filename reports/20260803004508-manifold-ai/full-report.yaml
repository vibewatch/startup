          - type: callout
            title: TAM inflation is the biggest analytical trap
            body: >-
              The public market narrative mixes economy-wide embodied-intelligence estimates, robot-spending forecasts,
              and financing-flow tallies. Using those numbers interchangeably would overstate Manifold's immediately
              serviceable market. The company should be underwritten against a much narrower software-and-data wedge
              until customer pricing and deployment economics become visible.
