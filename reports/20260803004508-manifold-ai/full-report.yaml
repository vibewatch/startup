companyProfile:
  summary: >-
    Manifold AI (流形空间) is a Beijing-based embodied-AI startup founded on 2025-05-22 by Dr. Wu Wei, a former SenseTime
    executive, together with a team linked to Tsinghua University's FIB Lab. The company is positioning itself as a
    world-model infrastructure provider for physical AI: WorldScape serves as the real-time spatial world model,
    WorldScape Policy extends that stack into action and control, and WorldArena gives the company a benchmark layer
    that reinforces its preferred definition of functional embodied intelligence. Public evidence shows unusually rapid
    progress in technical signaling and financing—near-RMB1B of cumulative Pre-A funding across six rounds by June 2026,
    plus repeated top-rank claims across WorldScore, WorldArena, and RoboTwin—but still limited disclosure on operating
    metrics and customer durability.
