  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market Boundary: Embodied-AI Enablement, Not the Whole Robot Economy'
        blocks:
          - type: paragraph
            body: >-
              The most important framing choice is to avoid treating “embodied AI,” “humanoid robots,” “autonomous
              mobility,” and “world models” as interchangeable. For Manifold AI, the relevant market is the enablement
              layer: world models, action models, data pipelines, and deployment software that help machines perceive
              and act inside real physical workflows. That layer touches a much broader embodied-intelligence economy,
              but it is not equivalent to the full robot hardware market or to generic video-generation AI. BCG's
              capability-based framework is useful here because it treats physical AI as a stack of
              capabilities—perception, manipulation, planning, and reasoning—rather than a single robot form factor.


              This distinction matters directly for valuation and go-to-market. A broad trillion-yuan market narrative
              may be directionally correct for the Chinese embodied-intelligence economy, but Manifold will only
              monetize a subset of that spend: the portion devoted to model infrastructure, data, control software, and
              deployment into scenarios where physical reasoning adds measurable value. Adjacent players help clarify
              the boundary. Physical Intelligence sells a “model for any robot” story, Wayve applies embodied AI to
              autonomous driving, and firms like AGIBOT, Unitree, X Square, ROBOTERA, Fourier, and UBTECH mix hardware,
              software, and scenario ownership in different proportions. Manifold sits closest to the software-and-model
              layer inside that broader field.
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM016
              - CM017
