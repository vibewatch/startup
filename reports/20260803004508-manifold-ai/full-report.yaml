        title: Customer Segments and Buyer Map
        blocks:
          - type: paragraph
            body: >-
              The public record is clear on use cases but fuzzy on accounts. Manifold is consistently tied to e-commerce
              logistics, 3C manufacturing, automotive manufacturing, and—more tentatively—mixed reality exploration.
              This implies an enterprise customer base whose buying centers likely sit in operations, industrial
              automation, and innovation budgets rather than in IT-only or consumer channels. The product is also
              unlikely to be bought by frontline robot operators themselves. Those teams are users, while manufacturing
              groups, robotics platform owners, or industrial strategics are the likely buyers and payers.


              The other important customer segment is indirect: robot OEMs and ecosystem partners. Public evidence
              suggests Manifold is not only selling directly into factories or warehouses, but also trying to embed its
              world-model capability inside partner platforms that already touch customers. That matters because it
              changes the customer story from “how many logos does Manifold have?” to “how much of the route to market
              may be mediated by hardware or industry partners?” Publicly, the latter is easier to prove than the
              former.
