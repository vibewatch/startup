  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Embodied AI is no longer operating in a vacuum. China’s 2026 standard system for humanoid robotics and
              embodied intelligence signals a shift toward formalized safety, ethics, application, and lifecycle
              expectations. Hangzhou’s local regulation adds a second signpost: governments are beginning to define
              testing, traceability, and commercialization frameworks for embodied-robot deployments. For Manifold, this
              matters even if the company is still early. Its public product story reaches into robots, warehouses,
              manufacturing lines, and automotive-adjacent workflows—domains where policy attention typically increases
              as deployments become less experimental.


              The global pattern points in the same direction. The UK Automated Vehicles Act and the EU AI Act are not
              direct Manifold-specific rules, but they illustrate where liability, accountability, and high-risk-AI
              compliance discussions are heading. The most important risk is not that Manifold is currently noncompliant
              with a disclosed rule set. It is that its public surface does not yet show the safety, auditability,
              privacy, and governance artifacts that would make future compliance smoother. The absence of public
              litigation today is helpful, but it is much less important than the absence of public proof that Manifold
              is governance-ready.
            claimRefs:
