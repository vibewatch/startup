  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition in Workflow Terms
        blocks:
          - type: paragraph
            body: >-
              Manifold does not present a simple product menu; it presents a capability stack. In workflow terms, the
              company sells a system that helps robots and other physical-AI agents model the world, predict outcomes,
              and execute actions in messy real environments. Public descriptions consistently place this in logistics,
              3C manufacturing, automotive manufacturing, and mixed-reality exploration. That means the product is not
              “video generation for robots” in isolation. It is an enabling layer for perception, planning, data
              generation, policy evaluation, and action control inside customer workflows where physical interaction
              matters.


              The module map is public enough to be usable. WorldScape is the real-time spatial world model. WorldScape
              Policy is the action and control layer built on top of that model. RoboScape is the robotics-specific
              model/paper line. AirScape extends the roadmap into drone autonomy. WorldArena is the public evaluation
              layer that turns the company’s preferred functional framing into a benchmark. This is a coherent stack: a
              base model, an action layer, application variants, and a benchmark wrapper that reinforces the company’s
              worldview in front of customers and the research community.
