  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Manifold AI does not face one clean peer set. The landscape breaks into at least four layers. First are
              software-first or model-first embodied-AI companies such as Physical Intelligence and, in a Chinese
              context, X Square, which emphasize generalized learning systems, data loops, and foundation-model breadth.
              Second are full-stack robot-platform vendors such as AGIBOT, UBTECH, Unitree, and ROBOTERA, which either
              own or tightly control hardware, software, and deployment. Third are adjacent embodied-AI companies in
              autonomous mobility, chiefly Wayve and Waymo, which prove that world-model and end-to-end learning ideas
              can become commercial systems even if their end markets differ from Manifold's. Fourth are the non-startup
              substitutes: fixed industrial automation and internal-build programs at robot OEMs or major industrial
              groups.


              This segmentation matters because a customer buying Manifold is not only comparing research rankings. They
              are also comparing whether a vendor controls hardware, can deliver industrial uptime, has regulatory
              credibility, can generate proprietary data, and can scale through partners. In that sense, Manifold's
              direct competition is narrow at the model layer but much broader at the budget layer. A world-model
              startup can lose not only to another world-model startup, but also to a vertically integrated robot vendor
              or to a customer that decides to build around narrower in-house stacks.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP017
