      - number: '3.4'
        title: Moat Durability and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              Manifold's current moat is real but brittle. WorldArena and WorldScore recognition can open doors with
              engineers, researchers, and early design partners, and being identified with embodied world models gives
              the company a sharp narrative edge. But the same public evidence shows that durable advantage in this
              market is being built through integrated loops among models, data, hardware, and deployment channels.
              Benchmark leadership without distribution is discoverability, not dominance.


              Adverse evidence strengthens that caution. BCG argues that the sector routinely overreads flashy
              demonstrations because dexterity and causal reasoning lag perception. MERICS similarly says China's
              embodied-AI ecosystem remains dependent on Nvidia and far from fully autonomous at scale. Public pricing,
              renewal, and customer-concentration data are also scarce across the peer set, which means many competitive
              claims still lack hard operating validation. The right read is that Manifold has an opportunity window,
              not a settled moat: it must turn evaluation leadership into repeatable industrial outcomes before
              model-layer capability becomes easier to copy or gets bundled into bigger full-stack platforms.
