      - number: '1.2'
        title: Founders, Research Lineage, and Governance Visibility
        blocks:
          - type: paragraph
            body: >-
              Public founder attribution is unusually consistent for a private Chinese AI startup: multiple sources
              identify Dr. Wu Wei as founder and CEO, and those same profiles describe him as a former SenseTime
              executive with direct world-model experience. Several articles also repeat a stronger credibility
              signal—that Wu Wei led teams to back-to-back first-place finishes in the Waymo SimAgents
              Challenge—suggesting that the founding story is rooted in simulation and agent-behavior modelling rather
              than a last-minute pivot into “physical AI.”


              The wider team story is designed to fuse academic legitimacy with deployment credibility. Coverage from
              QQ, Gasgoo, and Baidu Baike says the company combines Tsinghua FIB Lab researchers, a Tsinghua
              professor/Changjiang Scholar, and former big-tech world-model or autonomous-driving leads. Public
              materials further claim 200-plus top-tier papers and more than 100,000 citations across the team. That is
              a strong founder-market-fit signal for an evaluation-heavy, benchmark-led company. The weak point is
              governance transparency: reviewed materials do not disclose the board, independent oversight, or a wider
              executive bench. For diligence purposes, Manifold currently looks founder-and-research led, with
              key-person concentration around Wu Wei and limited public evidence on how capital has translated into
              formal governance controls.
