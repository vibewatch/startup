            body: >-
              The financing story is clear even if the operating story is not. Manifold completed six rounds in roughly
              one year and reached nearly RMB1 billion of cumulative Pre-A financing by June 2026, after a spring 2026
              near-RMB200 million Pre-A round and later larger financings. Management said the new money would support
