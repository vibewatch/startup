  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis vs. Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis for Manifold is straightforward: the company appears to own a scarce strategic position in
              embodied AI. It is early to world-model commercialization in China, it has benchmark leadership that
              matters more than pure video aesthetics, and it has raised enough capital to keep building while many
              peers are still defining their wedge. Public sources also show credible scenario relevance in logistics,
              manufacturing, and robotics, plus a visible commercialization channel through UBTECH. If embodied AI
              becomes a large industrial category, companies that sit at the model-and-evaluation layer could capture
              disproportionate power relative to their current size.


              The anti-thesis is just as straightforward: Manifold may already be priced like a category winner before
              category economics are proven. Nearly every high-quality public signal today is upstream of durable
              operating proof—funding rounds, benchmarks, technical papers, and partner announcements. What remains
              scarce are the numbers that tell investors whether those signals are compounding into a real business.
              That asymmetry makes the company attractive to track and dangerous to chase. The premium is not
              irrational; it is simply under-verified.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV021
              - CV022
