      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not pay for the proof gap twice
            body: >-
              The current unicorn narrative already pays Manifold for strategic importance. A new investor should not
              also pay a large execution premium unless named deployments, revenue quality, and governance readiness
              become visible.
            calloutType: recommendation
            claimRefs:
