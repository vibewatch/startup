      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The data wedge is small but strategically central
            body: >-
              The narrow data-and-model infrastructure slice is dramatically smaller than the trillion-yuan
              embodied-intelligence TAM, but it may be the highest-leverage part of the stack. If world models and
              evaluation systems become a control point for deployment quality, companies like Manifold can capture
              disproportionate strategic value before the overall robot market fully matures.
            calloutType: insight
            claimRefs:
