      - number: '5.2'
        title: Architecture and Data Loop
        blocks:
          - type: paragraph
            body: >-
              Public technical evidence suggests that Manifold’s architecture is designed around functional embodied
              performance, not only photorealistic output. WorldArena measures not just video quality but synthetic-data
              usefulness, policy evaluation quality, and action-planning value. RoboScape’s paper similarly emphasizes
              physics-informed training, temporal depth prediction, and keypoint dynamics learning. Reportify adds a
              broader architectural narrative in which LongScape and a hybrid auto-regressive + DiT approach underpin
              multiple model families, while Pedaily highlights an MoE structure that separates subproblems such as
              instruction following, mobility interaction, and manipulation reasoning.


              Just as important is the data loop story. Public reporting claims a hardware-data-model closed loop with
              self-built data collection devices, hardware-in-the-loop reinforcement learning, and hundreds of thousands
              of hours of data. Whether every detail of that claim is independently verified is less important than what
              it implies about architecture: Manifold sees evaluation, data capture, and deployment feedback as part of
              the product stack, not as offline support functions. That is a credible design philosophy for embodied AI
              because product quality depends on the ability to move from model output to robot behavior and back into
              training.
