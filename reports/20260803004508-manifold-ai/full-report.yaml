    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Product Scope
        blocks:
          - type: paragraph
            body: >-
              Manifold AI, also branded in Chinese as 流形空间, traces its public start to 2025-05-22, when the company site
              went live and the legal-entity timeline in public profiles begins. Reviewed sources consistently place the
              company in Beijing and describe it as an early mover in using self-developed world models as the base
              layer for embodied intelligence. The official positioning is broad rather than narrowly
              robotic-software-only: Manifold says it is building next-generation world models for AI hardware
              applications including robotics and XR equipment. Independent June 2026 coverage sharpens that pitch by
              framing the company as China's first startup to treat a proprietary world model as the foundation model
              for embodied AI.


              The core product narrative centers on WorldScape and WorldScape Policy. WorldScape is repeatedly described
              as a real-time world model that supports both mobility and manipulation in a single interaction loop,
              which matters because it moves the company beyond prettier video generation toward robot-usable state
              prediction. Public descriptions of the architecture emphasize a mixture-of-experts design and strong
              geometric grounding. WorldScape Policy extends that stack into action execution, with the company claiming
              stronger closed-loop performance than existing VLA baselines. Taken together, the product claim is not
              just “better simulation,” but a pretraining and control stack intended to help robots perceive, reason,
              and act in messy physical environments.
