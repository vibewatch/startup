      - number: '1.3'
        title: Funding History, Investor Base, and Unicorn Status
        blocks:
          - type: paragraph
            body: >-
              The clearest capital fact pattern arrives in June 2026. Across AIbase, Gasgoo, Tencent News, and Sina,
              Manifold AI is described as having completed six financing rounds in about one year, with cumulative Pre-A
              funding approaching RMB 1 billion. The named new investors in that round—Guoxin Fund, Yifeng Capital under
              Temasek, BAIC Industrial Investment, and Xinneng Venture Capital—show a blend of state-capital
              credibility, sovereign-linked capital, and industrial channel value. The same sources also point back to
              earlier investors such as Legend Capital and Huawei Hubble, indicating that the cap table had already
              accumulated elite venture and strategic names before the June 2026 raise.


              The chronology before June is visible enough to establish momentum even if it is not fully clean. Spring
              2026 reports include a near-RMB-200 million Pre-A and a later Pre-A+ round of several hundred million
              yuan. What the public record does not yet support is a precise full cap table, any debt facilities, or any
              disclosed secondaries. Still, the valuation signal is unusually strong for a company at this disclosure
              level: multiple June 2026 sources explicitly say Manifold had entered the billion-dollar “unicorn”
              category. That makes valuation direction far clearer than revenue quality. No reviewed public source
              disclosed ARR, run-rate, or revenue, so capital-market enthusiasm is currently outpacing operating
              disclosure.
