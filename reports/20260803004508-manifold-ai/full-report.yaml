      - number: '2.4'
        title: Growth Drivers and Constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers are practical. 36Kr points to aging demographics, labor scarcity, and the
              limits of rigid traditional automation in flexible manufacturing. ResearchInChina adds that once hardware
              matures past the earliest prototype stage, the real bottleneck shifts toward scalable, physically
              realistic multimodal data and the systems that turn that data into continuously improving models. BCG
              reinforces the same point from an economics angle: setup and reengineering dominate robotics TCO, so
              software-defined flexibility can unlock a disproportionate amount of value before full general-purpose
              autonomy exists.


              The constraints are equally important. MERICS argues China's embodied-AI push still depends heavily on
              Nvidia's ecosystem, while precision, dexterity, and cost remain unresolved across many deployments. BCG is
              blunter conceptually: today's market can create value around perception and bounded manipulation, but true
              reasoning under uncertainty remains the frontier. Regulation is another slow-burning constraint. As
              embodied AI expands into mobility, public services, and workforce management, some systems will brush
              against high-risk categories such as critical infrastructure or employment decisions. The result is a
              market with very strong momentum but a still-uncertain ROI envelope—exactly the kind of setting in which
              benchmark leaders like Manifold can attract capital early, but still need customer proof before their
              practical SOM becomes clear.
