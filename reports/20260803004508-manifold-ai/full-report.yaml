      - number: '7.4'
        title: Mitigations, Monitoring, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              The good news is that many of Manifold’s most important risks are monitorable. Investors do not need
              perfect disclosure immediately to know what to ask for next. They need to see whether named production
              deployments appear, whether UBTECH and similar channels actually expand, whether safety and trust
              documentation become visible, and whether the company can disclose even a basic reliability layer without
              damaging the story. Those are measurable checkpoints.


              The bad news is that the thesis can break before catastrophic failure. If the next financing event arrives
              without stronger customer proof, or if partner channels remain promising but non-scaling, or if governance
              demands rise faster than the company’s trust infrastructure, the downside will show up as muted
              commercialization rather than dramatic collapse. That is why the right risk verdict is elevated but
              monitorable. Manifold deserves diligence not because it looks weak, but because it is crossing the most
              failure-prone transition point in frontier embodied AI: moving from impressive model leadership into
              accountable industrial systems.
