          - type: paragraph
            body: >-
              Operationally, Manifold still looks like a company whose strongest evidence surface is technical proof. It
              leads or ranks highly in public benchmarks, publishes research-linked infrastructure, and frames the
              product around functional embodied utility rather than only visual generation. But none of that proves
              that robots behave safely, reliably, or economically under customer conditions. No reviewed source
              discloses uptime, intervention rate, task-success rate, or incident history. That is the central operating
              risk: the public record is strong on what the model can do in controlled evaluation and weak on what the
              organization can repeatedly deliver in live industrial conditions.


              There is also a more subtle technical risk: benchmark drift. WorldArena is more useful than a purely
              aesthetic benchmark, but it still risks becoming a target that teams optimize toward. If success on
              WorldArena, WorldScore, and related leaderboards does not correlate tightly with site-level KPIs like
              throughput, error rate, or labor savings, Manifold could win the category narrative while still
              disappointing buyers. Add in integration complexity, hardware variation, and edge-inference constraints,
              and the gap between “better model” and “better customer outcome” becomes the main operational fault line.
            claimRefs:
              - CR001
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
