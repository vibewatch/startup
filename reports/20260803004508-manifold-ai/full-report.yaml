      - number: '3.2'
        title: Direct and Adjacent Technical Peers
        blocks:
          - type: paragraph
            body: >-
              Physical Intelligence is the clearest software-first benchmark. Its public site markets a model that can
              control any robot for any task, and its openpi repository turns that claim into a distribution engine by
              giving developers access to multiple VLA variants and fine-tuning paths trained on 10k-plus hours of robot
              data. Wayve is less direct commercially, but technically adjacent: it explicitly positions embodied AI for
              autonomous mobility and has used GAIA-1 to show how generative world models can accelerate autonomy
              training and evaluation. Both companies matter because they validate the idea that the model layer, not
              only the robot body, can be the strategic control point.


              Among Chinese peers, X Square and ROBOTERA are especially relevant because they pair full-stack rhetoric
              with significant capital and scenario breadth. X Square says it combines foundation models, robotics
              hardware, a proprietary data pipeline, and real-world deployment across household, industrial, and
              logistics settings; it also claims a valuation above US$2.8 billion. ROBOTERA markets itself as a
              full-stack self-developed embodied-intelligence company and says it has already deployed across more than
              ten logistics centers with thousand-unit deliveries starting in Q2 2026. These peers narrow Manifold's
              differentiation space: being “full stack,” “data driven,” or “world-model native” is no longer rare
              language in the category.
