      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The category’s hardest transition is exactly where Manifold sits
            body: >-
              Many embodied-AI companies fail not because the models are irrelevant, but because operational
              reliability, trust controls, and partner economics lag the technology narrative. Manifold’s public record
              suggests it is at that transition point now.
            calloutType: risk
            claimRefs:
