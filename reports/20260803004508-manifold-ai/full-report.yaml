            body: >-
              Durability is where the public record thins out sharply. No reviewed source discloses active accounts,
              deployment counts, utilization, customer outcomes, contract length, renewal rates, NRR, or churn. That
              makes it impossible to tell whether the company is graduating from technically impressive pilots into
              repeatable production relationships. Continuity of sector messaging across June and July 2026 helps a
              little—it suggests logistics and manufacturing are persistent parts of the story rather than one-off PR
