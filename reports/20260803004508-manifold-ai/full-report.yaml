            body: >-
              Trust and safety are the weakest publicly visible layer of the stack. Manifold operates in product
              categories that can influence robot movement, action planning, and industrial workflows, yet its public
              surfaces do not expose the kinds of artifacts that would normally support enterprise confidence: safety
              certifications, incident reporting, security controls, privacy policies tied to data collection, or
              deployment quality metrics. This does not mean those controls do not exist. It means they are not visible
              enough for public diligence. Adjacent robotics vendors such as AGIBOT more clearly publish warranty and
              certification surfaces for their hardware, even if those artifacts do not solve model-level safety.


              The product-tech verdict is therefore two-sided. On one side, Manifold looks genuinely differentiated:
              benchmark-native, research-productive, and unusually explicit about functional embodied evaluation. On the
              other, it still looks more like a frontier technical platform than a fully documented enterprise product.
              For an investor or customer, the next diligence step is not to debate whether the models are interesting.
              It is to force disclosure on supportability, security, fail-safe behavior, data governance, and deployment
