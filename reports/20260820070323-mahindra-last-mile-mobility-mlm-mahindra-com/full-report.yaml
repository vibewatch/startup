            body: >-
              The financing story is materially stronger than the operating-disclosure story. IFC’s 2023 project note
              described up to INR 6,000 million of equity-linked capital for the new Mahindra LMM subsidiary and
              explicitly linked the financing to EV capex and working capital, while also saying the business expected
              to incur about US$113 million of capex over three to four years. In July 2026, Mahindra then announced a
              new primary raise of about INR 322 crore at a INR 10,822 crore valuation, with Lightrock leading and IFC
              plus India-Japan Fund participating. Parent-company investor-relations materials further show that M&M
              itself is financially strong, with Q1 FY27 revenue of ₹58,188 crore, PAT of ₹5,455 crore, annualized ROE
