  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The relevant market for MLMML is not “Indian EVs” in the abstract. It is the commercially used electric
              three-wheeler market across passenger and cargo formats, plus adjacent small-commercial categories where
              operator economics determine adoption. IMARC’s 2026-2034 market study is the clearest retained sizing
              anchor: it values the India electric three-wheeler market at $1.33 billion in 2025 and projects $3.84
              billion by 2034, implying a 12.15% CAGR. The same source also says FY2025 electric three-wheeler sales
              reached 699,073 units and 57% of overall three-wheeler sales. That is important because it reframes the
              category from an experimental subsidy play into a leading edge of actual mass electrification. Monthly
              retail-registration evidence strengthens the point. ETAuto’s July 2026 FADA-based report says June 2026
              electric three-wheeler retail sales reached 77,448 units and represented 64.1% of all three-wheeler
              registrations that month. Those sources do not give a perfect one-number TAM, but together they establish
              a robust market floor: India’s e-3W segment is already operating at national scale and still gaining
              penetration. For diligence, that makes MLMML’s category selection look structurally attractive even before
              company-specific share is layered in.
            claimRefs:
