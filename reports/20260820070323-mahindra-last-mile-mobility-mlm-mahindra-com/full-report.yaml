      - number: '2.4'
        title: Competitive structure, technology direction, and the main market constraints
        blocks:
          - type: paragraph
            body: >-
              The market is attractive precisely because competition is credible. IMARC’s competitive landscape lists
              Mahindra, TVS, Bajaj, Kinetic, Piaggio, Altigreen, and others as meaningful participants, while 2025-2026
              product launches show active escalation on range, charging time, warranty, payload, telematics, and
              safety. Bajaj’s GoGo P50 claims 212-272 km certified range and a 9.2-12.1 kWh LFP battery. TVS King EV Max
              claims a 179 km certified range, 9.2 kWh battery, connected features, and a six-year warranty. Piaggio is
              pushing both fixed-battery and swappable electric variants, while Euler and Altigreen reviews emphasize
              cargo use cases with heavier payload and higher-utilization positioning. That means MLMML cannot rely on
              “first mover in passenger e-rickshaws” forever. The market’s positive demand structure is counterbalanced
              by financing gaps, charging rollout quality, policy cliffs when incentives are exhausted, and the
              possibility that product parity compresses premium pricing. There is also a data-quality constraint:
              registration, market-value, and penetration sources are not methodologically identical, so category growth
              should be treated as directionally strong but not overfit to a single headline number.
            claimRefs:
              - CM025
              - CM026
              - CM027
              - CM028
              - CM029
              - CM030
              - CM031
              - CM033
              - CM034
              - CM036
              - CM037
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: This is already a mainstream commercial-mobility market
            body: >-
              A category that is 57% of annual three-wheeler sales in FY2025 and 64.1% of June 2026 registrations is no
              longer waiting for product-market fit. MLMML is operating inside one of India’s most advanced real-economy
              electrification markets.
            calloutType: strength
            claimRefs:
              - CM002
              - CM004
              - CM007
          - type: callout
            title: Policy helps demand, but policy can also distort timing and competition
            body: >-
              PM E-DRIVE caps, Delhi-style mandates, and scrappage incentives accelerate buying, yet they can also bunch
              demand, intensify competitive discounting, and create cliff risk when quotas or subsidies change.
            calloutType: risk
            claimRefs:
