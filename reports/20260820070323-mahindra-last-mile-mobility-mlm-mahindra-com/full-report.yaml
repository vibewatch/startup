      - number: '2.3'
        title: Buyer segments, budget ownership, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Buyer behavior in electric three-wheelers is unusually practical. The end user is often a driver or
              delivery operator, but the economic decision may be shared among the owner-driver, fleet manager, dealer,
              and financing partner. Passenger carriers tend to win on urban last-mile economics, route density, and
              air-quality policy, while cargo carriers ride the growth of e-commerce, B2B delivery, and small-business
              logistics. IMARC explicitly separates passenger carriers from load carriers and identifies passenger as a
              strong adoption segment; at the same time, PM E-DRIVE, Mahindra product pages, and competitor review pages
              all show OEMs building toward both use cases. The adoption path is therefore less about abstract “EV
              enthusiasm” and more about whether a buyer can access subsidy, financing, charging, and service with
              acceptable uptime risk. Mahindra’s product pages repeatedly market savings, warranty, and operating cost.
              ETAuto’s FADA summary and secondary market commentary cite lower running cost, improving financing
              availability, and logistics demand as the segment’s adoption engine. The diligence takeaway is that market
              demand is broadening, but it still clears through distribution, finance, and utilization math rather than
              through retail-style brand pull.
            claimRefs:
