chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and visible operating scale
        blocks:
          - type: paragraph
            body: >-
              Mahindra Last Mile Mobility is no longer just a descriptive business unit inside the broader Mahindra
              group; public sources now consistently treat it as a dedicated subsidiary with a focused last-mile
              commercial vehicle mandate. The official about page describes a portfolio spanning electric, CNG, petrol,
              and diesel three- and four-wheel passenger and cargo products, with the electric range centered on Treo,
              Zor Grand, e-Alfa, UDO, and ZEO. That breadth matters because MLMML is not only selling passenger
              e-rickshaws; it is also trying to own adjacent cargo and small-commercial use cases where operating
              economics, not consumer brand aspiration, drive demand. Official August 2026 milestone language is
              especially strong on visible scale: more than 4 lakh cumulative electric vehicle sales, 9 billion electric
              kilometres traveled, and a goal of putting one million EVs on Indian roads by 2031. Parent-company
              releases and product pages further anchor the market-share narrative, showing roughly 40% share in India’s
              L5 electric three-wheeler category and rapid growth in electrification across the segment. Together these
              sources make the company’s chapter-one identity straightforward: MLMML is a category-leading Indian
              commercial EV operator built around practical earning economics for drivers, fleets, and small businesses,
              not a speculative concept brand.
