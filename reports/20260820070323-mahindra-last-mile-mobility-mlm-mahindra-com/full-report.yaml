companyProfile:
  summary: >-
    Mahindra Last Mile Mobility is Mahindra & Mahindra’s dedicated last-mile mobility subsidiary focused on electric
    three-wheel passenger and cargo vehicles, adjacent small commercial vehicles, and a growing digital-service layer
    around ownership and fleet operations. Public 2026 disclosures show the company holds about 40% share in India’s L5
    electric three-wheeler market, crossed 1 lakh EV sales in FY2026, exceeded 4 lakh cumulative EV sales by August
    2026, and raised fresh outside capital at a roughly US$1.13 billion valuation led by Lightrock with IFC and
    India-Japan Fund participation.
  foundedDate: null
