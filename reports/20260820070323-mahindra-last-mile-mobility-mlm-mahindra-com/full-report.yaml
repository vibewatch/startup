      - number: '3.3'
        title: Mahindra’s competitive edge is breadth and ecosystem, not a single knockout spec
        blocks:
          - type: paragraph
            body: >-
              The strongest competitive argument for MLMML is portfolio breadth. Few rivals match Mahindra’s public
              spread across value e-rickshaws, premium passenger L5, low-speed cargo, high-speed cargo bodies, and
              adjacent mini-truck-style electric goods vehicles. That matters because the last-mile market is fragmented
              by route, payload, financing access, and buyer sophistication. Mahindra can sell multiple answers into
              that fragmentation rather than bet on one hero model. The ecosystem matters too: the company’s broader
              public narrative consistently includes financing partnerships, app support, insurance, and service.
              However, breadth is not the same as having the best product in every slot. Bajaj and Piaggio can point to
              stronger passenger range headlines, while Euler and Omega can point to harder cargo specs. The result is a
              competitive structure where Mahindra’s likely advantage lies in category coverage, operator familiarity,
              and installed base rather than in winning every brochure comparison. That is a good moat if service and
              financing remain strong, but it becomes vulnerable if rivals close those non-product gaps.
