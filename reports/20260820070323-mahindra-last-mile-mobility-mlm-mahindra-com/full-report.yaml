  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: The customer map is wider than “auto driver,” but livelihood operators still anchor the franchise
        blocks:
          - type: paragraph
            body: >-
              MLMML’s public customer base is not a single market. The company sells into self-employed passenger
              drivers, low-cost e-rickshaw owners, SME cargo merchants, and increasingly organized fleet or
              multi-vehicle operators. But the center of gravity remains livelihood economics. Even the more premium
              vehicles are marketed around earnings, lower running cost, financing access, and long-day usability rather
              than lifestyle appeal. That matters for diligence because buyer, user, and payer are often split: a bank
              may finance the vehicle, a dealer may originate the relationship, a driver may operate it daily, and a
              fleet owner may watch usage through NEMO. The resulting product-market fit is practical rather than
              aspirational. It also means customer quality depends heavily on financing approval, service coverage, and
              route economics, not only on demand headlines. That structure makes channel discipline unusually important
              for customer quality.
