  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory tailwinds are real, but legal and policy risk are inseparable from them
        blocks:
          - type: paragraph
            body: >-
              MLMML’s demand story is partly policy-made. Subsidies, scrappage benefits, and city-level rules reduce the
              economic friction of EV adoption. That is good for growth, but it also means the company lives close to
              the regulator. Delhi’s 2026 policy illustrates the duality: it can accelerate EV demand through bans and
              incentives, yet it also triggered incumbent pushback and creates the possibility of demand bunching around
              policy windows rather than clean organic pull. The legal layer matters as well. MLMML’s website terms
              explicitly warn that online features may differ from the physical vehicle, while NEMO’s privacy policy and
              EULA reserve broad rights around user and vehicle data. These documents do not prove misconduct, but they
              do show that disclosure, consent, and expectation management are active risk surfaces. A practical
              consequence is that compliance risk will rise as the connected layer becomes more central to onboarding,
              service and fleet management. The company cannot treat app terms as boilerplate if NEMO becomes a daily
              operating tool.
