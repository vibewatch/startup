      - number: '7.4'
        title: Management credibility is decent, but the thesis still needs explicit kill triggers
        blocks:
          - type: paragraph
            body: >-
              Public leadership evidence around Suman Mishra and Mahindra’s parent-level governance is reasonably
              reassuring, yet it does not eliminate execution risk. The upcoming IPO path itself increases the need for
              discipline: management must keep market share, refresh cadence, service quality, and disclosure quality
              intact while preparing a public-company narrative. The right investor stance is therefore to define
              measurable failure conditions up front. If subsidy support is delayed or cut, if competitor share gains
              accelerate, if service or software issues become visible at scale, or if standalone disclosure remains
              thin deep into IPO preparation, the thesis should weaken quickly. MLMML’s risk is not a single
              catastrophic flaw; it is the cumulative effect of several medium-to-high risks that can compound if
              operating discipline slips. Investors should also remember that under-disclosure itself compounds risk,
              because it delays corrective action until a problem becomes visible externally.
