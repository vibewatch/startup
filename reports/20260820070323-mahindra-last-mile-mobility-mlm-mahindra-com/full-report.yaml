      - number: '8.2'
        title: Scale, market structure and parent support argue for a premium; missing financial disclosure caps conviction
        blocks:
          - type: paragraph
            body: >-
              MLMML clearly deserves more credit than an early speculative EV startup. It has 4 lakh cumulative EV
              sales, 1 lakh FY26 sales, and about 40% share in the L5 category. India’s electric three-wheeler market is
              already mainstream, so the company is riding a proven demand curve rather than a science experiment.
              Parent support from Mahindra and prior IFC capital also reduce solvency anxiety. Those are real
              premium-supporting facts. Yet premium does not mean unlimited upside at any price. The same public record
              is still missing the core data required to test whether demand converts into attractive economics for
              outside shareholders. We still do not have clean subsidiary revenue, gross margin, EBITDA, cash burn,
              working-capital intensity, or top-customer exposure. That is why the valuation looks stretched rather than
              compelling: not because the business lacks merit, but because the price already assumes more quality than
              management has publicly shown. That is why even strong strategic logic cannot fully substitute for a real
              earnings bridge.
