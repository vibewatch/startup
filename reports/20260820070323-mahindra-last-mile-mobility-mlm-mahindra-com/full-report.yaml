      - number: '1.3'
        title: Leadership bench, governance posture, and dependence on the parent
        blocks:
          - type: paragraph
            body: >-
              Leadership evidence is reasonably strong at the executive level and materially weaker at the
              standalone-governance level. Suman Mishra’s role is corroborated across Mahindra’s 2021 appointment
              release, the World Economic Forum speaker profile, recent MLMML releases, and Mahindra’s public
              commentary, giving high confidence that she is the visible operating leader driving the EV and last-mile
              strategy. Rajesh Jejurikar remains the most important parent sponsor in public disclosures, frequently
              commenting on LMM performance, market share, and the business’s strategic role inside Mahindra’s auto
              portfolio. Governance disclosure, however, remains more parent-centric than subsidiary-centric. The
              Mahindra board and committee disclosures show a reasonably institutional public-company governance
              structure at M&M—with independent-chaired audit, governance, and risk committees—but public materials do
              not provide the same level of clarity for MLMML’s own board composition, committee architecture, or
              minority-protection terms. That asymmetry is normal for a private subsidiary but matters more now that the
              business has external investors, a unicorn mark, and a prospective IPO path. The diligence conclusion is
              that management visibility is acceptable, parent oversight appears strong, but true subsidiary-level
              governance still sits behind the curtain compared with what public-equity investors will eventually
              require.
