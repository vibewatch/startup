      - number: '2.2'
        title: Policy tailwinds and regulatory shape of demand
        blocks:
          - type: paragraph
            body: >-
              Government policy is not merely supportive background noise in this market; it is a direct shaper of buyer
              economics and technology mix. PM E-DRIVE keeps electric three-wheelers, e-rickshaws, and e-carts inside
              the commercial-incentive umbrella, while Mahindra’s own September 2025 explainer says Treo, Zor, and Zor
              Grand buyers can receive a ₹25,000 discount through the Aadhaar-linked e-voucher process. That company
              explainer is not a substitute for government documentation, but it is useful for operational detail: L5
              commercial e-3Ws must use advanced battery technology, incentives are passed through at point of sale, and
              the program includes explicit category caps and budget limits. Delhi’s EV Policy 2026 goes further by
              shifting from subsidies to mandates. Business Standard and Outlook both report that, from January 1, 2027,
              new ICE three-wheelers will no longer be eligible for registration in Delhi, while buyers of electric
              three-wheelers can receive first-year subsidies up to ₹50,000 plus scrappage incentives. This is
              strategically significant because Delhi-style rules convert EV adoption from optional TCO optimization
              into regulatory compliance. If other states follow, the market could re-rate faster than OEMs with weak EV
              product depth expect.
            claimRefs:
              - CM012
              - CM013
              - CM014
