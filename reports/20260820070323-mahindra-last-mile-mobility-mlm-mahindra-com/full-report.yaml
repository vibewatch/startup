      - number: '7.3'
        title: Dependency risk is hidden mostly in what the company does not disclose
        blocks:
          - type: paragraph
            body: >-
              The deepest underwritten risk in the public record is supplier and partner opacity. Website and app
              documents imply meaningful dependence on third-party processors and linked services, yet do not enumerate
              the core software, telematics, mapping, or charger-data vendors that would let investors score
              concentration. Financing and parent support are similar: they are clear advantages until they become
              bottlenecks. IFC and Mahindra backing reduce insolvency risk, but the business is still capital intensive
              and likely sensitive to any combination of pricing pressure, working-capital stretch, or
              slower-than-expected IPO timing. The parallel ICE portfolio is a second-order risk. It gives dealers and
              customers a fallback in immature charging markets, but it can also dilute EV focus and create transition
              friction if policy signals shift quickly by state. The lack of vendor names is especially important
              because telematics, app flows and service systems are now part of the customer promise, not optional
              add-ons. If one of those dependencies fails, the effect can travel quickly into uptime and reputation.
