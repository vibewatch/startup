        title: The product map is broad enough to cover most last-mile jobs, but it is not one coherent platform
        blocks:
          - type: paragraph
            body: >-
              MLMML’s product and technology story starts with breadth. The public portfolio is not a single electric
              three-wheeler but a layered stack: low-speed passenger e-rickshaws such as Treo Yaari and e-Alfa Plus, a
              stronger L5 passenger ladder through Treo Plus and the new UDO, low-speed and mid-duty cargo through Treo
              Zor and e-Alfa Cargo, and now a 4W adjacency through Zeo. That matters because last-mile operators in
              India buy for route economics and financing fit, not for one universal spec. It also means MLMML can
              address owner-drivers, micro-fleets, and higher-duty delivery use cases inside one distribution shell. The
              trade-off is complexity. Public materials show multiple battery sizes, multiple body formats, different
              speed classes, and distinct product narratives that likely require different dealer training, spare parts,
              and support playbooks. So the core technical takeaway is positive but not simplistic: MLMML has real
              workload coverage, yet that coverage is delivered through several platform generations rather than a
              single modular architecture.
