    {
      "id": "capitalization-and-investor-base",
      "title": "Capitalization, unicorn milestone, and investor mix",
      "body": "The July 30, 2026 funding round is the clearest public milestone in the company’s maturation from internal growth business to externally marked private company. Mahindra’s official announcement says MLMML signed a binding agreement to raise about INR 322 crore at a valuation of INR 10,822 crore, with Lightrock leading and existing investors IFC and India-Japan Fund participating. Independent reporting by Mint and NDTV Profit converts that valuation to roughly $1.13 billion and frames the event as India’s latest mobility unicorn. This matters for diligence in two ways. First, the round validates that sophisticated outside capital still sees long-duration value in India’s electric three-wheeler transition even after EV enthusiasm has become more selective globally. Second, the round does not solve the hard underwriting question, because public sources still do not disclose MLMML’s standalone revenue, gross margin, burn, or free cash flow. IFC’s earlier project-disclosure page gives useful historical context: in 2023 the new subsidiary was created to house the last-mile mobility business, and IFC described an equity-linked investment intended to support capex and working capital for EV expansion. Mint further reports that Mahindra’s ownership would dilute from 78.11% to 75.79% after the latest round, reinforcing that MLMML is being capitalized as a separately valued growth platform while still remaining parent-controlled.",
