    {
      "id": "milestones-ecosystem-and-disclosure-gaps",
      "title": "Milestones, ecosystem programs, and the main disclosure gaps",
      "body": "MLMML’s recent milestones show a company that is deliberately trying to thicken its moat beyond vehicle hardware alone. The official record moves from IFC’s 2023 subsidiary-and-capex disclosure, to the 3 lakh EV milestone in November 2025, to the UDO launch in February 2026, to more than 1 lakh EV sales and 39.7% L5 share in April 2026, to the unicorn round and 2027 IPO messaging in July, and finally to 4 lakh cumulative EV sales in August 2026. Surrounding programs such as UDAY NXT and the NEMO connected-services platform reinforce the strategy: insurance, counseling, financing access, fleet management, charging visibility, and service reminders are meant to make MLMML harder to displace on operating convenience rather than just sticker price. The disclosure gaps are still substantial. Public sources do not cleanly resolve whether current production attribution should be centered on Zaheerabad, Pune/Chakan, or wider Mahindra facilities; they also do not provide precise MLMM headcount, standalone P&L, or a fully detailed post-round governance map. Even the IPO timing is directionally consistent but not perfectly harmonized, with public references spanning “2027,” “H2 FY27,” and the second half of calendar 2027. That does not break the core thesis, but it keeps chapter-one confidence at medium rather than high.",
