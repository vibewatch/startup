    {
      "id": "vehicle-plus-network-operating-model",
      "title": "The delivered product is vehicle-plus-network-plus-app, not just a chassis and battery pack",
      "body": "The strongest non-obvious product insight is that MLMML increasingly sells an operating system around the vehicle. NEMO is now visible as a maintained layer with landing pages, app-store listings, policy documents, service hooks, charging discovery, roadside assistance, route insights, and multi-vehicle management. That does not mean MLMML is already a software company in economic terms; public evidence does not show recurring software revenue or measurable app monetization. But it does mean the user workflow has become meaningfully more digital, especially for cargo and fleet use cases where geofencing, performance insights, charger discovery, and service-booking reduce downtime. Even the owner-driver workflow appears designed around this bundle: buy via dealer and financing partner, register on NEMO, monitor battery/range, book service or RSA, and return to a dealer/service node when needed. This integrated loop should support adoption and lock-in, but it also increases dependence on app reliability, service-network execution, and responsible telemetry practices.",
      "claimRefs": [
