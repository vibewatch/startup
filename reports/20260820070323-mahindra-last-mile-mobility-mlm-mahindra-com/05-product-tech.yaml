    {
      "id": "trust-quality-and-compliance-signals",
      "title": "Public trust signals are visible on hardware safety, thinner on software performance",
      "body": "MLMML’s retained public evidence is materially stronger on hardware quality markers than on digital operating quality. Across the portfolio the company cites IP67 protection, AIS038 compliance, battery and vehicle warranties, hill-hold, monocoque construction, active liquid cooling for Zeo, and explicit real-world versus certified range distinctions. Those are useful because they show the company knows buyers care about survivability, safety, and uptime. For software, the picture is less complete. The NEMO privacy policy and EULA show the app is real, governed, and legally documented, but they also make clear that MLMML collects meaningful personal, location, and vehicle-performance data and retains broad rights over the information. App-store evidence confirms the product is shipped and available, yet not much is disclosed publicly about monthly actives, crash rates, notification usefulness, or support resolution times. Investors should therefore separate two questions: whether MLMML has credible product and compliance scaffolding—which it does—and whether its digital layer has proven operating quality at scale—which public sources still do not show.",
