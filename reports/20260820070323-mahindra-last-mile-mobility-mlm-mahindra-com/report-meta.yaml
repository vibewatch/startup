  topStrengths:
  - 'Category leadership is real: official 2026 disclosures place MLMML around 39.5%–39.7% share in India’s L5 electric three-wheeler market.'
  - Installed-base proof is unusually tangible for a private vehicle company, with more than 1 lakh EV sales in FY2026 and over 4 lakh cumulative EV sales by August 2026.
  - Mahindra parent backing plus repeat institutional capital from Lightrock, IFC, and India-Japan Fund materially reduce near-term survival risk.
  - Product breadth across passenger, cargo, and support software or service layers gives MLMML more operating depth than a single-model EV story.
  - Indian regulatory and adoption trends still support electrification in last-mile transport, especially in segments where buyer ROI is visible and frequent-use economics matter.
  topRisks:
  - 'Standalone financial opacity remains the central underwriting problem: there is still no public revenue, gross-margin, EBITDA, burn, or cash-flow bridge for the subsidiary.'
  - At roughly US$1.13 billion, the July 2026 valuation already prices in substantial execution quality before public evidence proves the margin profile.
  - The business is capital intensive and depends on continued execution across manufacturing, batteries, inventory, service, and financing support.
  - 'Customer-quality disclosure is weak: public sources do not break out retention, concentration, fleet-versus-retail mix, or regional mix of the installed base.'
  - Parent control, evolving IPO timing, and incomplete governance detail limit outside investors’ visibility into decision rights and downside protection.
  unresolvedGaps:
  - Standalone audited-style financials, including revenue mix, gross margin, EBITDA, working capital, and cash burn.
  - Full round terms, cap table, dilution path, and investor-rights package from the July 2026 financing.
  - Factory attribution, utilization, and capex detail across Zaheerabad, Pune/Chakan, Jaipur-linked references, and any other active production sites.
  - Customer-cohort quality, concentration, replacement cycle, and attach-rate data for NEMO, service, financing, or fleet-management offerings.
  - Board composition, governance protections, and exact IPO readiness milestones for the planned 2027 listing.
