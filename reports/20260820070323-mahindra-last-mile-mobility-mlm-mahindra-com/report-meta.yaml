companyProfile:
  summary: Mahindra Last Mile Mobility is Mahindra & Mahindra’s dedicated last-mile mobility subsidiary focused on electric three-wheel passenger and cargo vehicles, adjacent small commercial vehicles, and a growing digital-service layer around ownership and fleet operations. Public 2026 disclosures show the company holds about 40% share in India’s L5 electric three-wheeler market, crossed 1 lakh EV sales in FY2026, exceeded 4 lakh cumulative EV sales by August 2026, and raised fresh outside capital at a roughly US$1.13 billion valuation led by Lightrock with IFC and India-Japan Fund participation.
  foundedDate: null
  foundingLocation: Mumbai, India
  headquarters: Mumbai, India
  productSummary: Electric three-wheel passenger autos, cargo trikes, and connected owner/fleet services centered on Treo, Zor Grand, Zeo, UDO, and the NEMO support platform.
  customerFocus: Owner-drivers, fleet operators, small businesses, and last-mile delivery or urban mobility users in Indian cities and peri-urban markets.
  businessModel: Manufactures and sells electric last-mile vehicles through dealer and financing channels, then supports usage through after-sales service, financing partnerships, roadside assistance, and connected fleet or owner tools.
  stage: private (pre-IPO, targeting 2027)
  fundingStatus: Mahindra disclosed a July 2026 primary raise of about INR 322 crore at an INR 10,822 crore valuation, with Lightrock leading and IFC plus India-Japan Fund participating alongside continued parent control.
