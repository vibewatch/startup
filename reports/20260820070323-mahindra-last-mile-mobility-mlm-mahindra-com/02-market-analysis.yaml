    {
      "id": "competitive-structure-and-constraints",
      "title": "Competitive structure, technology direction, and the main market constraints",
      "body": "The market is attractive precisely because competition is credible. IMARC’s competitive landscape lists Mahindra, TVS, Bajaj, Kinetic, Piaggio, Altigreen, and others as meaningful participants, while 2025-2026 product launches show active escalation on range, charging time, warranty, payload, telematics, and safety. Bajaj’s GoGo P50 claims 212-272 km certified range and a 9.2-12.1 kWh LFP battery. TVS King EV Max claims a 179 km certified range, 9.2 kWh battery, connected features, and a six-year warranty. Piaggio is pushing both fixed-battery and swappable electric variants, while Euler and Altigreen reviews emphasize cargo use cases with heavier payload and higher-utilization positioning. That means MLMML cannot rely on “first mover in passenger e-rickshaws” forever. The market’s positive demand structure is counterbalanced by financing gaps, charging rollout quality, policy cliffs when incentives are exhausted, and the possibility that product parity compresses premium pricing. There is also a data-quality constraint: registration, market-value, and penetration sources are not methodologically identical, so category growth should be treated as directionally strong but not overfit to a single headline number.",
