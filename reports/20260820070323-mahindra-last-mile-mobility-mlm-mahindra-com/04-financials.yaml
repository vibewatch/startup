    {
      "id": "financial-verdict-and-blockers",
      "title": "Financial verdict: strong demand story, incomplete underwriting package",
      "body": "A private-market investor can form a coherent directional view from the public record. Demand appears strong, pricing power appears functional at least in newer EV platforms, channel financing is being expanded, and capital access has clearly improved. But a public-market style underwriting case is still not possible. There is no standalone revenue line, no margin history, no cash balance, no burn figure, no unit-level gross profit disclosure, and no clean revenue mix across EV, ICE, passenger, cargo, financing, or service. Even the best public traction metrics—4 lakh cumulative EV sales, 1 lakh FY26 EV sales, and ~40% L5 share—are volume facts, not quality-of-revenue facts. That means the right verdict is neither bearish nor complacent. Financial quality may ultimately prove strong, especially given scale and parent support, but the current evidence set still forces medium-to-low confidence on margin path, working-capital efficiency, and runway. The diligence blocker is simple: management must provide the subsidiary’s actual numbers.",
