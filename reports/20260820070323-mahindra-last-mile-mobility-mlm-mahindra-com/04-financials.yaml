      "id": "unit-economics-and-sales-efficiency-proxies",
      "title": "Unit economics and sales efficiency can only be proxied through customer ROI claims",
      "body": "The most usable public unit-economics evidence is framed from the buyer’s perspective, not the company’s. Treo marketing claims up to ₹4.4 lakh savings over five years; Zor Grand claims only ₹0.12 per kilometre running cost and up to ₹6 lakh savings versus diesel; Treo Zor Pickup claims annual savings up to roughly ₹1 lakh; PM E-DRIVE can cut upfront cost by another ₹25,000 for certain models; and Delhi’s policy adds even larger local incentives for eligible buyers. That stack likely supports conversion economics and dealer productivity, especially because financing friction is being explicitly addressed through PNB’s large branch network and tailored repayment language. Still, almost every classic software-style metric is absent: there is no public CAC, payback, gross margin, attach rate, lead-to-sale conversion, or distributor economics. The fair conclusion is that MLMML appears to sell into a category with strong customer ROI and good channel fit, but the company’s own take-rate and margin capture remain opaque. Sales efficiency is therefore plausible, not proven.",
