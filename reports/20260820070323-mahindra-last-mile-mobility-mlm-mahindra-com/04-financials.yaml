  "chapter": {
    "number": 4,
    "title": "Financials",
    "summary": "MLMML’s public financial picture is unusual: capital backing and commercial traction are visible, but standalone revenue, gross margin, cash burn, and runway remain undisclosed. The retained evidence supports a healthy financing position—given parent support, IFC funding, and the 2026 unicorn round—but only medium confidence on revenue quality and low confidence on margin path until management opens the books."
  },
  "sections": [
    {
      "id": "revenue-model-and-pricing",
      "title": "Revenue model and pricing are visible only through product and channel proxies",
      "body": "Public materials strongly imply that MLMML’s business is still overwhelmingly hardware-led, with monetization centered on vehicle sales across passenger and cargo formats, supported by financing access, after-sales service, and digital ecosystem tools. The company repeatedly frames each product as a commercial asset: UDO is sold as a higher-earning vehicle with EMI support, Treo and Treo Plus are sold on daily operating savings, and Zor Grand is sold on per-kilometre economics and higher annual savings versus diesel. That is informative, because it suggests the company’s commercial engine is built around asset ROI rather than subscription or software monetization. But it also leaves major blind spots. Public sources do not break out EV versus ICE revenue mix, passenger versus cargo mix, realized pricing after subsidies, or the portion of economics captured by financing and service attachments. The cleanest explicit list-price anchor in the retained set is UDO’s launch pricing at ₹3,58,999 introductory and ₹3,84,299 ex-showroom. Everything else is directional rather than audited. So the right financial reading is not “unknown business model”; it is “visible unit-sales model with limited revenue-quality disclosure.”",
