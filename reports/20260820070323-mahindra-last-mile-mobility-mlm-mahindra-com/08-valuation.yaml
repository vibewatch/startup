    {
      "id": "public-comps-and-scenarios",
      "title": "Public comparables frame the opportunity, but they also reveal how much of today’s mark rests on future execution",
      "body": "Public Indian auto comps help size the range even if none is a perfect substitute. Bajaj Auto, TVS Motor, Ashok Leyland, Tata Motors-linked public values, and M&M itself all trade on disclosed financials, live market scrutiny, and mature investor expectations. MLMML is far smaller, less disclosed, and not yet public, so it cannot simply inherit those multiples. The right use of comps is to test plausibility. On that lens the current unicorn mark is plausible, because it remains tiny relative to mature listed OEMs. But it is not obviously cheap, because even a small fraction of listed OEM value can still be a demanding entry price when the subsidiary’s own economics remain opaque. Scenario analysis therefore matters more than false precision. A bull case requires smooth IPO execution and revealed economics; a bear case requires no category collapse, only disclosure disappointment or execution wobble. Public comps should therefore discipline optimism, not automate a mark-to-market upgrade.",
