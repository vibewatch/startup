  "chapter": {
    "number": 8,
    "title": "Valuation",
    "summary": "MLMML’s July 2026 unicorn mark is credible because it was set in an external institutional round, but it is not yet easy to underwrite at high conviction because the company still withholds too many core financial details. The evidence supports research-more with medium confidence, high risk, and a stretched valuation stance: real scale and real investor appetite are offset by limited transparency on revenue quality, margins, and round terms."
  },
  "sections": [
    {
      "id": "what-the-current-price-really-says",
      "title": "The current price is credible, but it is a credibility signal more than a completed underwriting case",
      "body": "The July 2026 round matters because it is not a hypothetical fair-value guess from the outside. Mahindra publicly disclosed a fresh institutional round at INR 10,822 crore valuation with Lightrock leading and IFC plus India-Japan Fund participating. That gives investors a real market anchor. But what that anchor proves is narrower than many narratives imply. It proves that credible institutions are willing to back MLMML’s scale, leadership, and IPO path. It does not prove that public-equity-style diligence on revenue quality, gross margin, cash conversion, and customer concentration has already become easy. In other words, the mark is real, but the underwriting package is still incomplete. That distinction is the heart of the valuation call: the company may be strong, but the current public evidence still forces caution on what exactly buyers of the next round are paying for.",
