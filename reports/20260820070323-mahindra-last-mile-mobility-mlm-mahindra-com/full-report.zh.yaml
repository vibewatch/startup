      - number: '2.4'
        title: 竞争结构、技术方向与主要市场约束
        blocks:
          - type: paragraph
            body: >-
              市场有吸引力，恰恰因为竞争足够可信。IMARC 的竞争格局列出 Mahindra、TVS、Bajaj、Kinetic、Piaggio、Altigreen 等重要参与者；2025-2026
              年产品发布也显示，续航、充电时间、质保、载荷、车联网和安全都在升级。Bajaj GoGo P50 宣称认证续航 212-272 km，并配备 9.2-12.1 kWh LFP 电池。TVS King EV Max
              宣称认证续航 179 km、9.2 kWh 电池、互联功能和 6 年质保。Piaggio 同时推进固定电池和换电版电动车型，Euler 和 Altigreen
              测评则强调更重载荷、更高利用率的货运场景。也就是说，MLMML
              不能永远依赖“客运电动三轮车先发者”。市场需求结构向好，但融资缺口、充电铺设质量、激励耗尽后的政策悬崖，以及产品趋同挤压溢价定价的可能性，会形成反向约束。数据质量也有限：注册量、市场规模和渗透率来源的方法并不一致，因此品类增长应被视为方向强劲，而不能过度拟合某一个头条数字。
