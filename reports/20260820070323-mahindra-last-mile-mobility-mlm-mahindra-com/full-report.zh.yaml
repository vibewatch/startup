            body: >-
              公开记录中最难承销的风险，是供应商和伙伴不透明。网站和应用文件暗示公司对第三方处理方和链接服务有实质依赖，却没有列出核心软件、车联网、地图或充电数据供应商，投资者无法给集中度打分。融资和母公司支持也类似：在变成瓶颈之前，它们是清晰优势。IFC
              和 Mahindra 背书降低了破产风险，但业务仍是资本密集型，也很可能对价格压力、营运资金拉长或 IPO 时间慢于预期的任意组合敏感。并行 ICE
              产品组合是二阶风险。它给经销商和客户在充电不成熟市场里留出后路，但如果政策信号在各邦快速变化，也可能稀释 EV
              聚焦、制造转型摩擦。没有供应商名称尤其重要，因为车联网、应用流程和服务系统已经是客户承诺的一部分，不是可选附加项。一旦其中某个依赖失效，影响会很快传导到出勤率和声誉。
