      - number: '5.2'
        title: 交付给客户的是车辆 + 网络 + 应用，而不只是底盘和电池包
        blocks:
          - type: paragraph
            body: >-
              最不显眼但最强的产品洞察是，MLMML 越来越像是在卖一套围绕车辆的操作系统。NEMO
              现在已经是一个持续维护的层，能看到落地页、应用商店上架信息、政策文件、服务入口、充电发现、道路救援、路线洞察和多车管理。这不意味着 MLMML
              在经济意义上已经是软件公司；公开证据没有显示经常性软件收入或可衡量的应用变现。但这确实说明用户工作流已经明显更数字化，尤其是货运和车队场景，电子围栏、性能洞察、充电桩发现和服务预约都能减少停运。即便车主司机工作流也围绕这套组合设计：通过经销商和融资伙伴买车，注册
              NEMO，监控电池 / 续航，预约服务或 RSA，需要时回到经销商 / 服务节点。这一整合闭环应能支撑采用和锁定效应，但也提高了对应用可靠性、服务网络执行和负责任遥测实践的依赖。
