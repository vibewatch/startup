      - number: '8.2'
        title: 规模、市场结构和母公司支持支撑溢价；财务披露缺失限制信念
        blocks:
          - type: paragraph
            body: >-
              MLMML 显然不应被当作早期投机型 EV 初创公司看待。它累计 EV 销量达到 4 lakh，FY26 销量 1 lakh， L5 品类份额约 40%。印度电动三轮车市场已经进入主流，MLMML
              踩的是已验证的需求曲线， 不是科学实验。Mahindra 母公司支持和 IFC 此前注资，也降低了偿付能力焦虑。这些都是支撑溢价的真实事实。
              但溢价不等于任何价格都有无限上行。同一套公开记录仍缺少核心数据，无法检验需求能否转化为外部股东有吸引力的经济性。
              子公司收入、毛利率、EBITDA、烧钱速度、营运资本强度、头部客户敞口都不清晰。因此估值看起来偏高，而不是诱人；
              不是业务没有价值，而是价格已经假设了高于管理层公开证明的质量。即便战略逻辑很强，也不能完全替代真实的盈利桥。
