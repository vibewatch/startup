      - number: '1.2'
        title: 资本结构、独角兽里程碑与投资者组合
        blocks:
          - type: paragraph
            body: >-
              2026 年 7 月 30 日融资，是公司从内部增长业务走向外部定价私营公司的最清晰公开里程碑。Mahindra 官方公告称，MLMML 签署有约束力协议，将以 INR 10,822 crore 估值融资约
              INR 322 crore，Lightrock 领投，现有投资者 IFC 和 India-Japan Fund 参与。Mint 和 NDTV Profit 的独立报道将该估值折算为约 $1.13
              billion，并把这次事件称为印度最新出行独角兽。这对尽调有两层意义。第一，即使全球 EV
              热情已更挑剔，成熟外部资本仍看好印度电动三轮车转型的长周期价值。第二，这轮融资没有解决最硬的承销问题，因为公开资料仍未披露 MLMML 的独立收入、毛利率、烧钱速度或自由现金流。IFC
              早前项目披露页提供了有用历史背景：2023 年，新的子公司设立，用来承接最后一公里出行业务；IFC 将一笔股权挂钩投资描述为支持 EV 扩张所需资本支出和营运资金。Mint 进一步报道，最新一轮后
              Mahindra 持股将从 78.11% 稀释至 75.79%，这强化了一个判断：MLMML 正被作为单独估值的增长平台融资，但仍由母公司控制。
