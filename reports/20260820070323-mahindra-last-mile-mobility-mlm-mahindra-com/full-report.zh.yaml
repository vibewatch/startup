      - number: '1.3'
        title: 管理梯队、治理姿态与对母公司的依赖
        blocks:
          - type: paragraph
            body: >-
              管理层证据在高管层面相当扎实，但在独立治理层面明显更弱。Suman Mishra 的角色得到 Mahindra 2021 年任命公告、World Economic Forum 演讲者资料、近期 MLMML 公告和
              Mahindra 公开评论的交叉印证，因此可以较高置信度认定，她是推动 EV 和最后一公里战略的可见运营负责人。Rajesh Jejurikar 仍是公开披露中最重要的母公司支持者，经常评论 LMM
              表现、市占率以及该业务在 Mahindra 汽车组合中的战略角色。不过，治理披露仍更以母公司为中心，而不是以子公司为中心。Mahindra 董事会和委员会披露显示，M&M
              作为上市公司具备较制度化的治理结构，审计、治理和风险委员会均由独立人士担任主席；但公开资料没有同等清晰地说明 MLMML
              自身董事会构成、委员会架构或少数股东保护条款。私营子公司出现这种不对称很正常，但业务已有外部投资者、独角兽估值和潜在 IPO
              路径后，问题权重更高。尽调结论是：管理层可见度可以接受，母公司监督看起来较强；但与未来公开市场投资者的要求相比，真正的子公司级治理仍在幕后。
