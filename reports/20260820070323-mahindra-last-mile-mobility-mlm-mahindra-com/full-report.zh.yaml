        title: 公开采用证据真实，但强项还是规模与案例，不是深度队列
        blocks:
          - type: paragraph
            body: >-
              公开记录提供了扎实证据，证明 MLMML 确有客户采用。官方公告显示，公司从 2025 年 11 月累计 EV 销量 3 lakh，推进到 2026 年 4 月 3.4 lakh，再到 2026 年 8 月 4
              lakh，同时 FY26 EV 销量突破 1 lakh。具名客户故事提供了有用细节：Lakshmi Hot Bakers 的 Bharat Talreja、Yashraj Dairy Farms 的
              Narayan Ranade、饮料配送中的 Vimal Singh，以及 Magenta Mobility 的 Maxson Lewis，都把具体任务映射到产品收益。独立的 Magenta
              文章尤其有价值，因为它印证了正在运行的车队部署。不过，这些证明还不是广泛客户参考库。它们显示 MLMML
              能赢下微型创业者和车队场景，但没有揭示合同期限、续约行为、扩张产出或队列存活。简言之，采用已证明；耐久性还没有。
