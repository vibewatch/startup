        title: 客运电动三轮车竞争已经成了真正的产品战
        blocks:
          - type: paragraph
            body: >-
              客运竞争已经从泛泛的“EV 对 ICE”定位，升级为正面交锋的产品梯队。Mahindra 现在覆盖多个客运层级：e-Alfa Plus 面向低速高性价比路线，Treo Plus 是升级版主力车型，UDO
              则是新的高端长续航 L5 平台。但对手已有可信答案。Bajaj GoGo P50 在保留样本中以最高版本 272 km 的认证续航公开领先；TVS King EV Max 将 179 km 续航、6
              年质保和基于长期 King 车系的迁移叙事绑在一起。Piaggio 也不再只是象征性传统车企；测评和发布报道显示，它运营多款电动客运版本，从较低续航的换电配置到 236 km 的 Apé E-City
              Ultra。关键竞争结论是，Mahindra 不再只靠推出电动三轮车就能赢。它现在必须防守更会传播的续航宣称、更丰富的功能营销，以及可信的传统 ICE 品牌将既有运营者基础迁移到 EV。
