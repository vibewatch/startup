  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与受证据约束的规模测算
        blocks:
          - type: paragraph
            body: >-
              MLMML 的相关市场不是抽象意义上的“印度 EV”。它是横跨客运和货运形态的商业用途电动三轮车市场，再加上运营经济性决定采用的小型商用相邻品类。IMARC 2026-2034
              市场研究，是现有证据中最清晰的规模锚点：它估算印度电动三轮车市场 2025 年规模为 $1.33 billion，并预计 2034 年达到 $3.84 billion，隐含 12.15% CAGR。同一来源还称
              FY2025 电动三轮车销量达到 699,073 辆，占整体三轮车销量 57%。这很重要，因为它把该品类从试验性补贴赛道重构为真实大众电动化的前沿。月度零售登记证据进一步强化这一点。ETAuto 2026 年 7
              月基于 FADA 的报道称，2026 年 6 月电动三轮车零售销量达到 77,448 辆，占当月全部三轮车注册量 64.1%。这些来源无法给出完美的单一 TAM 数字，但合在一起确立了坚实的市场底线：印度
              e-3W 细分已经跑到全国规模，并且渗透率仍在上升。对尽调而言，即便还没有叠加公司自身份额，MLMML 选择的品类也具备结构吸引力。
