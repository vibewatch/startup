      - - 反向逻辑：公开财务披露前，当前价格已计入太多好消息。
        - 如果 IPO 文件显示单位经济强劲、营运资本纪律干净，价格担忧会减弱。
      - - 反向逻辑：竞争和政策风险可能压缩未来倍数扩张。
        - 如果 MLMML 保持明确份额领先，而同业未能在经济性或服务质量上跟上，该反向逻辑会削弱。
    notes: 只有把价格和披露质量放在一起评估，投资逻辑才可投。
