      - number: '2.2'
        title: 政策顺风与需求的监管形态
        blocks:
          - type: paragraph
            body: >-
              政府政策在这个市场里不只是支持性的背景噪声，而是直接塑造买方经济性和技术组合。PM E-DRIVE 把电动三轮车、客运电动三轮车和电动货运车继续放在商业激励伞下；Mahindra 2025 年 9
              月解读称，Treo、Zor 和 Zor Grand 买家可通过 Aadhaar 绑定的电子凭证流程获得 ₹25,000 折扣。公司解读不能替代政府文件，但对运营细节有用：L5 商用 e-3W
              必须使用先进电池技术，激励在销售点传导给买方，项目还设置了明确品类上限和预算限制。Delhi EV Policy 2026 则更进一步，从补贴转向强制要求。Business Standard 和 Outlook
              均报道，自 2027 年 1 月 1 日起，Delhi 新增 ICE 三轮车将不再具备注册资格；电动三轮车买家首年最高可获得 ₹50,000 补贴，另有报废激励。这在战略上很关键，因为 Delhi 式规则会把
              EV 采用从可选的 TCO 优化，变成监管合规。如果其他邦跟进，市场重估速度可能快过 EV 产品深度较弱 OEM 的预期。
