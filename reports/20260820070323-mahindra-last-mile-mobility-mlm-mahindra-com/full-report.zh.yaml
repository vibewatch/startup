  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管顺风真实存在，但法律和政策风险与之不可分
        blocks:
          - type: paragraph
            body: >-
              MLMML 的需求故事部分由政策制造。补贴、报废权益和城市级规则降低了 EV 采用的经济摩擦。这有利于增长，但也意味着公司贴着监管运行。Delhi 2026 政策展示了两面性：禁令和激励能加速 EV
              需求，却也引发既有玩家反弹，并可能让需求围绕政策窗口扎堆，而不是形成干净的有机拉动。法律层也重要。MLMML 网站条款明确提醒，在线功能可能不同于实体车辆；NEMO 隐私政策和 EULA
              则围绕用户和车辆数据保留广泛权利。这些文件不能证明不当行为，但说明披露、同意和预期管理都是活跃风险面。实际后果是，互联层在用户上手、服务和车队管理中越核心，合规风险就越高。如果 NEMO
              成为日常运营工具，公司不能把应用条款当样板文件处理。
