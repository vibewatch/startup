      - number: '6.4'
        title: 扩张逻辑可见，但集中度风险仍不透明
        blocks:
          - type: paragraph
            body: >-
              MLMML 有可见的先落地再扩张逻辑。客户可以从低成本客运形态起步，迁移到更长续航的 UDO 或 Treo Plus，或随着工作强度增长，从轻货运转向 Zor Grand 和 Zeo。NEMO
              的多车取向说明，公司希望一个车主随时间增加车辆。大城市政策顺风也能拓宽漏斗。但集中度风险至少有三类。第一，公开客户故事集中在小企业和司机画像；企业车队宽度披露稀疏。第二，对融资依赖度高，尤其是获取车主司机时。第三，公司没有披露车队与零售结构、头部客户暴露或地域集中度，投资者无法判断增量需求是广泛分布，还是集中在政策集群。客户结论因此是正面但不完整：规模和获客动能明显，集中度和续约质量仍披露不足。
