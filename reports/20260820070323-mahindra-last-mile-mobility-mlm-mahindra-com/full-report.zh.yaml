    title: 估值敏感性
    type: bar
    layout: wide
    summary: 估值最敏感的是披露质量和执行，不只是品类增长。
    data:
      items:
        - label: 强利润率 + 干净 IPO
          value: 145
        - label: 基准情景 / 当前披露
          value: 100
        - label: 份额下滑
          value: 78
        - label: 政策或融资摩擦
          value: 72
        - label: 薄弱财务披露
          value: 60
    approximationNotes: 指数化敏感性以当前轮次 base=100，只作示意，不是模型输出。
