  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户地图不止“三轮车司机”，但生计型运营者仍是基本盘
        blocks:
          - type: paragraph
            body: >-
              MLMML 的公开客户基础不是单一市场。公司卖给自雇客运司机、低成本电动三轮客运车车主、SME
              货运商户，也越来越多触达有组织车队或多车运营者。但重心仍是生计经济性。即便更高端车型，营销也围绕收入、较低运行成本、融资可得性和长时间日用能力，而非生活方式吸引力。这对尽调重要，因为买方、用户和付款方经常分离：银行可能提供车辆融资，经销商可能发起关系，司机每天运营，车队老板可能通过
              NEMO 查看使用情况。由此形成的产品市场匹配是务实型，而非愿景型。客户质量也因此高度依赖融资审批、服务覆盖和路线经济性，不只取决于需求头条。这种结构让渠道纪律对客户质量异常重要。
