      - number: '5.3'
        title: 公开信任信号在硬件安全上可见，在软件表现上更薄
        blocks:
          - type: paragraph
            body: >-
              MLMML 保留的公开证据，在硬件质量标记上明显强于数字运营质量。整个产品组合中，公司提到 IP67 防护、AIS038 合规、电池和整车质保、坡道保持、承载式车身、Zeo
              主动液冷，以及真实续航和认证续航的明确区分。这些信息有用，因为它们显示公司知道买方关心耐用性、安全和出勤率。软件侧，图景不那么完整。NEMO 隐私政策和 EULA 说明应用真实存在、有治理、有法律文件，但也明确
              MLMML 会收集有意义的个人、位置和车辆性能数据，并对这些信息保留广泛权利。应用商店证据确认产品已发布且可用，但公开资料很少披露月活、崩溃率、通知有效性或支持解决时长。投资者因此应拆开两个问题：MLMML
              是否具备可信的产品和合规脚手架——答案是有；它的数字层是否已在规模上证明运营质量——公开来源仍没有证明。
