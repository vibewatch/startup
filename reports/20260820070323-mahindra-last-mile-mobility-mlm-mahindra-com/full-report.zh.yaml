  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前价格可信，但它更像可信度信号，不是完整承销案例
        blocks:
          - type: paragraph
            body: >-
              2026 年 7 月融资重要，是因为它不是外部猜出来的假设公允价值。Mahindra 公开披露，MLMML 以 INR 10,822 crore 估值完成新一轮机构融资，Lightrock 领投，IFC 和
              India-Japan Fund 参与。这给了投资者真实市场锚。但这个锚能证明的事，比许多叙事暗示的更窄。它证明可信机构愿意押注 MLMML 的规模、领导地位和 IPO
              路径。它不能证明围绕收入质量、毛利率、现金转化和客户集中度的公开市场式尽调已经变得容易。换句话说，估值标记是真的，但承销材料仍不完整。这一区分就是估值判断的核心：公司可能很强，但当前公开证据仍迫使我们谨慎看待下一轮买家究竟在为什么付钱。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV026
