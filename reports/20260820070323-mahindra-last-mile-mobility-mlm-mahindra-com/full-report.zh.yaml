      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              电动三轮车买方行为异常务实。终端用户往往是司机或配送运营者，但经济决策可能由车主司机、车队经理、经销商和融资伙伴共同完成。客运车通常靠城市最后一公里经济性、路线密度和空气质量政策取胜；货运车则受益于电商、B2B
              配送和小企业物流增长。IMARC 明确区分客运车辆与载货车辆，并指出客运是强采用细分；同时，PM E-DRIVE、Mahindra 产品页和竞品测评页都显示 OEM
              正同时布局两类用途。因此，采用路径不是抽象的“EV 热情”，而是买方能否在可接受的车辆可用性风险下拿到补贴、融资、充电和服务。Mahindra 产品页反复营销节省、质保和运营成本。ETAuto 的 FADA
              摘要和二级市场评论则把更低运行成本、融资可得性改善和物流需求称为该细分的采用引擎。尽调结论是，市场需求在拓宽，但成交仍要经过分销、金融和利用率算账，而不是靠零售式品牌拉力。
