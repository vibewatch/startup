      - number: '1.4'
        title: 里程碑、生态项目与主要披露缺口
        blocks:
          - type: paragraph
            body: >-
              MLMML 近期里程碑显示，公司有意把护城河从车辆硬件本身加厚。官方记录从 IFC 2023 年对子公司和资本支出的披露，到 2025 年 11 月 3 lakh EV 里程碑，再到 2026 年 2 月 UDO
              发布、2026 年 4 月 EV 销量超过 1 lakh 且 L5 份额 39.7%，随后是 7 月独角兽融资和 2027 年 IPO 信息，最后到 2026 年 8 月累计 EV 销量 4 lakh。UDAY
              NXT 和 NEMO 互联服务平台等周边项目也强化了该策略：保险、咨询、融资可得性、车队管理、充电可见性和保养提醒，都是为了让 MLMML
              在运营便利性上更难被替代，而不只是价格标签更低。披露缺口仍然很大。公开资料没有清楚厘清当前生产归属应以 Zaheerabad、Pune/Chakan 还是更广泛的 Mahindra 工厂为中心；也没有提供精确的
              MLMM 员工数、独立 P&L 或完整的投后治理图。即便 IPO 时间也只是方向一致、口径未完全统一，公开说法横跨 “2027”、“H2 FY27” 和 2027
              日历年下半年。这不会推翻核心投资逻辑，但让第一章置信度停在中等而非高。
