  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 场景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - MLMML 保持接近 40% 份额，披露强劲利润率和现金纪律，并顺利提交 IPO 文件。
        - 当前独角兽估值标记会大幅上修，因为市场同时奖励品类领导力和高质量披露。
        - 竞争仍在，但经济性证明韧性足够。
        - 除非数据室异常扎实，否则概率为低到中。
      - - 基准
        - 现有规模真实，但财务披露只是勉强够用，IPO 时点大致按计划推进。
        - 当前估值标记大体合理，有一定上行，但不是明显错价。
        - 回报取决于入场价格纪律和轮次条款。
        - 基于今天公开证据，概率为中到高。
      - - 悲观
        - 份额下滑、补贴不及预期，或申报文件显示收入质量偏弱 / 资本强度更高。
        - 当前估值标记被证明已打满或偏贵；后续回报前景被压缩。
        - 不需要品类崩塌，只要执行或披露不及预期即可。
        - 概率足够显著，投资人必须认真建模。
    notes: 情景逻辑故意由披露质量和执行驱动，而不只是总需求。
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV028
      - CV029
      - CV034
      - CV037
      - CV038
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 关联度
      - 局限
    rows:
      - - MLMML July 2026 融资轮
        - 私募估值
        - ₹10,822 crore / 约 $1.13B
        - 公司自身最直接的价格锚
        - 私募轮条款和权利尚未完全公开。
      - - Mahindra & Mahindra
        - 公开市值
        - ~₹4.28 lakh crore
        - 为母公司支持能力和战略保护伞提供参照
        - 多元化母公司，不是纯最后一公里 EV 可比公司。
      - - Bajaj Auto
        - 公开市值 / TTM 市盈率
        - 约 ₹3.27 lakh crore / 约 27.8× PE
        - 最接近的大规模印度上市 2W/3W 汽车可比公司，现金生成能力强
        - 业务组合不同，披露也完整得多。
      - - TVS Motor
        - 公开市值 / TTM 市盈率
        - 约 ₹2.08 lakh crore / 约 60.8× PE
        - 电动三轮车重要上市竞争者
        - 业务组合远超与 MLMML 直接重叠的范围。
      - - Ashok Leyland
        - 公开市值 / TTM 市盈率
        - 约 ₹1.02 lakh crore / 约 29.4× PE
        - 已披露 OEM 经济性的商用车参照
        - 对最后一公里电动三轮车的直接敞口更低。
      - - Tata Motors 公开参照
        - 公开市值区间
        - ~₹1.19 lakh crore TMPV 页面 / Tata Motors 整体 ~₹1.76T
        - 显示印度汽车公开市场估值的大致区间
        - 不是直接的最后一公里 EV 或三轮车可比公司。
    notes: 可比公司的作用是建立估值合理性边界，而不是把某个倍数一步套到私募 IPO 前资产上。
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV021
      - CV035
    enumerationScope:
      coverage: sample
      basis: >-
        Rows sample the most relevant publicly observable Indian auto valuation references plus MLMML’s own July 2026
        round; they are not an exhaustive comp set.
  - id: TV005
    title: 破坏投资逻辑与放弃触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 份额领先地位被侵蚀
        - 电动 3W 零售份额连续多月失去明确领先
        - 打破溢价领导者叙事
        - 下调估值倍数和上行情景。
      - - 财务披露不及预期
        - IPO 或尽调材料显示利润率偏弱、烧钱高、营运资本纪律差
        - 当前估值标记从偏高变成昂贵
        - 价格重置或经济性改善前，暂停或回避。
      - - 政策 / 补贴重置
        - 重大补贴退坡或补贴兑付延迟不利
        - 削弱客户回本和经销商动能
        - 下调增长假设，并监控渠道压力。
      - - 服务 / 质量滑坡
        - 大规模出现保修、电池或 app 服务问题
        - 损害品牌和留存假设
        - 进一步投资前，要求经审计的服务数据。
      - - IPO 时间表滑坡
        - 未伴随更好披露的重大延迟
        - 暗示准备不足，或底层数据更弱
        - 从继续研究转向回避。
    notes: 最好的放弃触发项，是在灾难性事件出现在报表结果前就能监控的信号。
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV028
      - CV029
      - CV038
      - CV039
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 独立财务数据
        - MLMML 的收入、毛利率、EBITDA、现金、烧钱速度和营运资本指标
        - 这些指标决定当前价格是合理，还是已经偏贵
        - 管理层数据室 / 审计师资料包
      - - 融资轮条款
        - July 2026 轮次的优先股堆叠、权利、清算条款和任何 ratchet 条款
        - 私募轮经济条款可能显著改变普通股吸引力
        - 律师审阅交易文件
      - - 客户质量
        - 车队与零售占比、头部客户集中度、复购和流失数据
        - 没有耐久性的规模，仍可能只能配更低倍数
        - 商业尽调加 CRM 导出数据
      - - 服务 / 可靠性
        - 保修索赔、电池更换、app 事故、SLA 指标
        - 隐藏质量问题会很快击穿 IPO 前叙事
        - 运营尽调和服务仪表盘
      - - 资本强度
        - Capex 计划、工厂利用率，以及到 IPO 时点前的现金需求
        - 回报曲线取决于增长模型会吃掉多少新增资本
        - 财务团队和运营计划审阅
    notes: 这些问题如果回答得好，足以推动建议变化；没有这些答案，投资确信应继续受限。
    claimRefs:
      - CV007
      - CV008
      - CV027
      - CV031
      - CV039
