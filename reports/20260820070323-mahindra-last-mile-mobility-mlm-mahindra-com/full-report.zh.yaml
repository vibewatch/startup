      - number: '4.3'
        title: 资本充足性看起来扎实；资本强度也确实很高
        blocks:
          - type: paragraph
            body: >-
              融资故事明显强于运营披露故事。IFC 2023 年项目说明提到，向新的 Mahindra LMM 子公司提供最高 INR 6,000 million 的股权挂钩资本，并明确把融资与 EV
              资本支出和营运资金绑定；同时还称该业务预计未来三到四年会产生约 US$113 million 资本支出。2026 年 7 月，Mahindra 又宣布以 INR 10,822 crore 估值完成约 INR
              322 crore 新股融资，Lightrock 领投，IFC 和 India-Japan Fund 参与。母公司投资者关系材料进一步显示，M&M 本身财务强劲：Q1 FY27 收入 ₹58,188
              crore、PAT ₹5,455 crore、年化 ROE 约 23%，市值达到数万亿卢比。对尽调而言，这意味着 MLMML
              并不明显缺资本。与此同时，这个业务模式清楚是资本密集型：制造爬坡、电池系统、库存、融资支持、服务触点和产品焕新，都会在任何 IPO 之前消耗现金。公开证据因此支持“资金到位，但仍然吃资本”的判断。
