      - number: '4.4'
        title: 财务结论：需求故事强，承销材料不完整
        blocks:
          - type: paragraph
            body: >-
              私募市场投资者可以基于公开记录形成连贯的方向性判断。需求看起来强，至少在较新 EV
              平台上定价权可用，渠道融资正在扩张，资本可得性也明显改善。但公开市场式承销案例仍搭不起来。没有独立收入线，没有利润率历史，没有现金余额，没有烧钱数字，没有单车级毛利披露，也没有
              EV、ICE、客运、货运、融资或服务之间的清晰收入结构。即便最好的公开牵引指标——4 lakh 累计 EV 销量、1 lakh FY26 EV 销量和约 40% L5
              份额——也只是销量事实，不是收入质量事实。因此，正确结论既不是看空，也不是自满。财务质量最终可能很强，尤其考虑到规模和母公司支持；但当前证据集仍迫使我们对利润率路径、营运资金效率和现金跑道保持中低置信度。尽调阻塞点很简单：管理层必须给出子公司的真实数字。
