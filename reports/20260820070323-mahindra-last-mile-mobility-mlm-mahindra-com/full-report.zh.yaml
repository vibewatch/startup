  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型和定价只能通过产品与渠道代理变量看见
        blocks:
          - type: paragraph
            body: >-
              公开资料强烈暗示，MLMML 的业务仍以硬件为绝对核心，变现围绕客运和货运车辆销售展开，并由融资可得性、售后服务和数字生态工具支撑。公司反复把每款产品包装成商业资产：UDO 被卖成能提高收入、配套 EMI
              支持的车辆；Treo 和 Treo Plus 主打日常运营节省；Zor Grand 主打每公里经济性以及相对柴油更高的年度节省。这有信息量，因为它说明公司的商业引擎围绕资产
              ROI，而不是订阅或软件变现。但这也留下重大盲区。公开来源没有拆分 EV 与 ICE 收入结构、客运与货运结构、补贴后的实现价格，或融资和服务附加项捕获多少经济性。保留样本中最干净的明确标价锚点，是 UDO
              发布时 ₹3,58,999 的首发价和 ₹3,84,299 的出展厅价。其他信息都只是方向性，而非经审计。因此正确的财务解读不是“商业模式未知”，而是“单位销量模型可见，但收入质量披露有限”。
