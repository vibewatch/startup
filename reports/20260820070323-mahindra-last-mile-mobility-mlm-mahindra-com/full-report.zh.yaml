      - number: '6.3'
        title: 售后支持设计看起来周全，但公开留存数据几乎不存在
        blocks:
          - type: paragraph
            body: >-
              与许多汽车 OEM 的客户留存动作相比，MLMML 的支持栈更可见。NEMO 提供服务预约、RSA、经销商位置、充电发现、提醒和多车管理。UDAY NXT 会把买家自动纳入意外保险和顾问权益。PNB
              融资降低前置摩擦。经销商和服务网点查询页显示，全国性基础设施能在售后让车辆保持生产力。这些都是可信的留存代理指标，因为它们对应商用 EV
              用户可能流失的主要原因：融资痛点、停运和缺少支持。但公司仍未发布投资者最关心的真实指标。公开资料中没有复购率、车队扩张率、按队列划分的流失率、投诉解决 SLA 或 NPS 数据集。即使 NEMO
              公开下载量和评分信号有帮助，也只能提供方向性参考。售后架构看起来认真；它能长期留住客户的公开证据仍很薄。另一个细节是，支持闭环似乎也被设计来维护二手残值信心：质保可见性、服务记录和经销商联系路径，能帮助二级市场买家信任一项二手资产。这些都不能替代披露的队列数据，但说明
              Mahindra 没有忽视售后体验。
