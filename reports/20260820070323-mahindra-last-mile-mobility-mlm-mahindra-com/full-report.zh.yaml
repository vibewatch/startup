    type: range
    layout: wide
    summary: 围绕 2026 年 7 月锚点的情景化估值区间。
    data:
      items:
        - label: 悲观
          low: 0.8
          mid: 1
          high: 1.1
          unit: US$B
          detail: 披露不足或执行不及预期会压缩当前定价。
        - label: 基准
          low: 1.1
          mid: 1.25
          high: 1.4
          unit: US$B
          detail: 在披露增强之前，当前定价大致仍属合理。
        - label: 乐观
          low: 1.6
          mid: 1.8
          high: 2.1
          unit: US$B
          detail: 强劲公开申报和经济模型支撑重估。
    approximationNotes: 区间是锚定 2026 年 7 月融资轮的情景启发式判断，不是管理层指引。
