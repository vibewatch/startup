chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、产品边界与可见运营规模
        blocks:
          - type: paragraph
            body: >-
              Mahindra Last Mile Mobility 已经不只是 Mahindra
              集团内部的业务描述；公开资料现在普遍把它当作一家专注最后一公里商用车的子公司。官方介绍页面显示，产品组合横跨电动、CNG、汽油、柴油三轮和四轮客运 / 货运产品，电动系列以 Treo、Zor
              Grand、e-Alfa、UDO 和 ZEO 为核心。这种宽度很重要：MLMML 卖的不只是客运电动三轮车，它还想吃下相邻货运和小型商用场景；这些场景靠运营经济性拉动需求，而不是靠消费者品牌想象。2026 年 8
              月官方里程碑对可见规模给出强信号：累计电动车销量超过 4 lakh、电动行驶里程达到 9 billion kilometres，并计划到 2031 年让 1 million 辆 EV
              跑在印度道路上。母公司公告和产品页进一步托住市占率叙事，显示其在印度 L5 电动三轮车品类约有 40% 份额，且该细分的电动化快速推进。合在一起，这些来源让公司第一章身份很清楚：MLMML 是印度商用 EV
              的品类龙头，围绕司机、车队和小企业的实用赚钱逻辑搭建，而不是一个投机性概念品牌。
