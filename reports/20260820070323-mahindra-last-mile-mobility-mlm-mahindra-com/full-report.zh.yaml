              最可用的公开单位经济性证据来自买方视角，而不是公司视角。Treo 营销宣称 5 年最高可节省 ₹4.4 lakh；Zor Grand 宣称运行成本仅 ₹0.12/km，相比柴油最高可节省 ₹6 lakh；Treo
              Zor Pickup 宣称年度节省最高约 ₹1 lakh；PM E-DRIVE 还能为某些车型再削减 ₹25,000 前置成本；Delhi
              政策则为符合条件买家叠加更大的地方激励。这一组合很可能支撑转化经济性和经销商生产率，尤其是公司正通过 PNB 的大型网点和定制还款表述，明确处理融资摩擦。但几乎所有典型软件式指标都缺席：没有公开
              CAC、回本周期、毛利率、附加率、线索到成交转化率或经销商经济性。公允结论是，MLMML 似乎卖进了客户 ROI
              强、渠道匹配度好的品类；但公司自身抽成率和利润率捕获仍不透明。因此，销售效率是可信的，不是已证明的。
