      - number: '8.3'
        title: 公开市场可比公司勾勒机会边界，也暴露当前估值有多少压在未来执行上
        blocks:
          - type: paragraph
            body: >-
              印度公开上市汽车可比公司能帮助划定区间，即便没有一家是完美替代。Bajaj Auto、TVS Motor、 Ashok Leyland、Tata Motors 关联公开估值和 M&M
              本身，都基于已披露财务、实时市场审视和成熟投资者预期交易。 MLMML 规模小得多、披露更少、尚未上市，不能直接继承这些倍数。可比公司的正确用法是检验合理性。
              按这个视角，当前独角兽估值可以成立，因为相对成熟上市整车厂仍很小。但它并不显得便宜，因为子公司自身经济性仍不透明时，
              即便只是上市整车厂价值的一小部分，也可能是很高的入场价。因此情景分析比虚假精确更重要。乐观情景需要 IPO 顺利落地、
              公司披露经济性，且数据站得住；悲观情景不需要品类崩塌，只需要披露不及预期或执行摇摆。公开可比公司应约束乐观， 而不是自动触发按市值重估上调。
