    {
      "id": "cargo-competition",
      "title": "Cargo competition is where Mahindra faces the clearest spec pressure",
      "body": "On cargo, Mahindra still presents one of the broadest public body-style lineups, but specialist competitors increasingly look stronger on headline payload and range. Mahindra’s Treo Zor family covers pickup, delivery van, and flatbed formats, while e-Alfa Cargo offers a cheaper low-speed option. That gives practical breadth for different route economics. The problem is that newer or more specialist cargo EVs are now stretching the performance envelope. Euler HiLoad publicly targets materially higher payload and longer range than Treo Zor. Omega Seiki’s Rage+ and Rage+ NRG likewise show how cargo-focused players are pushing toward 151 km and 251 km claims, with heavier-duty positioning and longer warranties in the higher-range model. Mahindra’s current cargo messaging still leans heavily on savings and simplicity, which is sensible, but it also reveals that some of its most visible cargo products remain shorter-range platforms compared with newer challengers. The competitive issue is not that Mahindra lacks cargo presence; it is that cargo specialists may now be winning the most performance-sensitive fleet narratives.",
