  "chapter": {
    "number": 3,
    "title": "Competitors",
    "summary": "MLMML still has the broadest public last-mile EV portfolio in India, but its competitive position is no longer defined by being early. Bajaj, TVS, and Piaggio now press hard in passenger electric three-wheelers on claimed range and connected features, while Euler and Omega push the cargo side on payload and range beyond Mahindra’s older Treo Zor family."
  },
  "sections": [
    {
      "id": "passenger-competition",
      "title": "Passenger electric three-wheeler competition is now a real product war",
      "body": "Passenger competition has moved from generic ‘EV versus ICE’ positioning to an actual head-to-head product ladder. Mahindra now spans multiple passenger tiers: e-Alfa Plus for lower-speed value routes, Treo Plus as the upgraded workhorse, and UDO as the new premium long-range L5 platform. But rivals have credible answers. Bajaj’s GoGo P50 publicly leads the retained set on claimed certified range with a 272 km top variant, while TVS King EV Max couples 179 km range with a six-year warranty and a migration narrative rooted in its long-standing King franchise. Piaggio is also no longer a token incumbent; review and launch coverage shows it running multiple electric passenger variants from lower-range swap configurations up to the 236 km Apé E-City Ultra. The key competitive takeaway is that Mahindra no longer wins simply by showing up with an electric auto. It must now defend against better-publicized range claims, richer feature marketing, and credible legacy-ICE brands migrating their existing operator bases into EVs.",
