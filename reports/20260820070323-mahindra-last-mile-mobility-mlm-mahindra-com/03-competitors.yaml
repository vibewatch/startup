    {
      "id": "where-competition-bites-hardest",
      "title": "Where competition bites hardest: passenger premiumization and cargo fleet math",
      "body": "The highest competitive pressure does not fall evenly across the portfolio. In passenger, Mahindra’s pressure point is premiumization: customers who historically might have upgraded within the Mahindra family can now compare UDO or Treo Plus against Bajaj GoGo, TVS King EV Max, and Piaggio’s newer long-range variants. On cargo, the pressure point is harder-nosed fleet math: if a rival can show more payload or more kilometers per shift, headline savings claims are less persuasive. ETAuto’s June 2026 registration data still show Mahindra in front nationally, but Bajaj is already close enough that leadership should be treated as contested rather than permanent. In other words, MLMML remains the benchmark incumbent, yet the retained source set does not support complacency. Competition is now fast enough that Mahindra’s response likely needs to be ongoing platform refreshes plus service, financing, and uptime execution—not just defense of historical share.",
