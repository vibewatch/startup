evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: standalone-financials
    missingEvidence: Current standalone revenue, gross margin, EBITDA/burn, cash balance, and capex plan for MLMML.
    whyItMatters: The unicorn valuation and 2027 IPO narrative cannot be properly underwritten without operating financials.
    diligencePath: Request board-approved FY26 and Q1 FY27 subsidiary financial pack, budget, and cash-flow bridge.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: subsidiary-governance
    missingEvidence: A clean MLMML board roster, committee structure, and minority-investor rights after the 2026 round.
    whyItMatters: External investors and IPO preparation increase the importance of governance clarity beyond the parent level.
    diligencePath: Obtain shareholder agreement summary, board composition, reserved matters, and any observer rights.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: manufacturing-footprint
    missingEvidence: >-
      Direct official attribution of current production responsibilities across Jaipur, Pune/Chakan, and Zaheerabad
      facilities.
    whyItMatters: Plant allocation affects capex needs, ramp risk, localization analysis, and operational resilience.
    diligencePath: Request management plant map by platform, battery assembly location, and current utilization by facility.
    relatedQuestionRefs:
      - QO025
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: A current standalone employee count for MLMML.
    whyItMatters: Headcount helps evaluate operating leverage, sales intensity, and readiness for public-market disclosure.
    diligencePath: Request current org chart and employee count split by manufacturing, sales, service, and corporate roles.
    relatedQuestionRefs:
      - QO023
  - type: missing-source
    severity: material
    topic: official-national-tam
    missingEvidence: An official Indian government national market-size or long-range TAM forecast for electric three-wheelers.
    whyItMatters: >-
      Current sizing relies on analyst estimates plus registration reporting rather than one canonical official market
      model.
    diligencePath: Request SIAM/FADA methodology notes or an OEM-prepared national TAM deck with assumptions.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: passenger-cargo-split
    missingEvidence: A precise 2026 nationwide passenger-versus-cargo volume split for electric three-wheelers.
    whyItMatters: The mix affects pricing, margins, and product roadmap priority across Treo/UDO versus Zor-style cargo products.
    diligencePath: Request FY26/FY27 segment registrations by body type from FADA, SIAM, or company management.
    relatedQuestionRefs:
      - QM009
      - QM024
    relatedTableRefs:
      - TM001
      - TM003
  - type: private-evidence-only
    severity: material
    topic: route-level-unit-economics
    missingEvidence: Dated route-level ROI by city, vehicle type, utilization, and financing structure.
    whyItMatters: Market attractiveness depends on realized payback, not generic TCO claims.
    diligencePath: Request operator cohort data, lender performance data, and customer payback models by route archetype.
    relatedQuestionRefs:
      - QM013
      - QM014
      - QM022
    relatedTableRefs:
      - TM004
  - type: conflicting-data
    severity: minor
    topic: market-methodology
    missingEvidence: >-
      A reconciled bridge explaining how annual sales estimates, retail registrations, and analyst market-value
      forecasts map to one another.
    whyItMatters: Without a bridge, overly precise TAM claims can mislead valuation work.
    diligencePath: Build a methodology note comparing IMARC, FADA, VAHAN, and company-share disclosures on a like-for-like basis.
    relatedQuestionRefs:
      - QM007
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: transaction-price-comparison
    missingEvidence: >-
      Actual transaction prices after subsidies, dealer discounts, and financing terms across Mahindra and its main
      rivals.
    whyItMatters: Brochure specs can mislead if one brand closes the gap with better financing or discounting in-market.
    diligencePath: >-
      Collect dealer quotations in key cities and compare EMI, subsidy pass-through, and maintenance packages side by
      side.
    relatedQuestionRefs:
      - QP022
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: service-and-uptime-comparison
    missingEvidence: Matched service, uptime, and failure-rate data across Mahindra, Bajaj, TVS, Piaggio, Euler, and Omega fleets.
    whyItMatters: Installed-base moat is only real if it produces better uptime or lower downtime costs for operators.
    diligencePath: >-
      Request warranty-claim, parts-fill-rate, and fleet-uptime data by model and city from management and channel
      partners.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP003
      - TP004
  - type: conflicting-data
    severity: minor
    topic: matched-real-world-specs
    missingEvidence: A truly matched comparison of real-world range and payload across standardized duty cycles.
    whyItMatters: Rivals mix real-world and certified numbers, which can exaggerate or understate competitive gaps.
    diligencePath: Run or obtain third-party side-by-side route tests on matched urban passenger and cargo cycles.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP001
