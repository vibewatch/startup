    {
      "id": "post-sale-support-and-retention-proxies",
      "title": "Post-sale support looks thoughtfully designed, but public retention data is almost nonexistent",
      "body": "MLMML’s support stack is more visible than many auto OEMs’ customer-retention motions. NEMO offers service booking, RSA, dealer location, charging discovery, alerts, and multi-vehicle oversight. UDAY NXT auto-enrolls buyers into accidental insurance and advisory benefits. PNB financing reduces upfront friction. Dealer and service locator pages indicate nationwide infrastructure that can keep vehicles productive after sale. Those are credible retention proxies because they address the main reasons commercial EV users might churn: financing pain, downtime, and lack of support. Yet the company still does not publish the actual metrics that matter most to investors. There is no public repeat-purchase rate, fleet-expansion rate, churn by cohort, complaint-resolution SLA, or NPS dataset. Even NEMO’s public download and ratings signals are helpful only directionally. The post-sale architecture looks serious; the public proof that it retains customers over time remains thin. Another subtle point is that the support loop appears designed to preserve resale confidence as well: warranty visibility, service records, and dealer contact paths can help secondary-market buyers trust a used asset. None of that substitutes for disclosed cohorts, but it does mean Mahindra is not ignoring the after-sale experience.",
