    {
      "id": "expansion-loops-and-concentration-risks",
      "title": "Expansion logic is visible, but concentration risk is still opaque",
      "body": "MLMML has visible land-and-expand logic. A customer can start in a low-cost passenger format, migrate to higher-range UDO or Treo Plus, or move from light cargo toward Zor Grand and Zeo as duty cycles grow. NEMO’s multi-vehicle orientation suggests the company wants one owner to add vehicles over time. Policy tailwinds in large cities can also widen the funnel. But there are at least three concentration risks. First, public customer stories are concentrated in small-business and driver personas; enterprise fleet breadth remains sparsely disclosed. Second, financing dependence is high, particularly for owner-driver acquisition. Third, the company does not publish fleet-versus-retail mix, top-account exposure, or geographic concentration, so investors cannot tell whether incremental demand is broad-based or policy-clustered. That leaves the customer verdict as positive but incomplete: scale and acquisition momentum are evident, while concentration and renewal quality remain under-documented.",
