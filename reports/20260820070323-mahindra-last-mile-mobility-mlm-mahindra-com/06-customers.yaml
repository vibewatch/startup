  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "MLMML clearly has real customer adoption, a large installed base, and credible proof across owner-drivers, SMEs, and at least some fleets. The weak point is not acquisition—it is public visibility into retention, concentration, and repeat-purchase quality after the first vehicle sale."
  },
  "sections": [
    {
      "id": "customer-map-and-jobs-to-be-done",
      "title": "The customer map is wider than “auto driver,” but livelihood operators still anchor the franchise",
      "body": "MLMML’s public customer base is not a single market. The company sells into self-employed passenger drivers, low-cost e-rickshaw owners, SME cargo merchants, and increasingly organized fleet or multi-vehicle operators. But the center of gravity remains livelihood economics. Even the more premium vehicles are marketed around earnings, lower running cost, financing access, and long-day usability rather than lifestyle appeal. That matters for diligence because buyer, user, and payer are often split: a bank may finance the vehicle, a dealer may originate the relationship, a driver may operate it daily, and a fleet owner may watch usage through NEMO. The resulting product-market fit is practical rather than aspirational. It also means customer quality depends heavily on financing approval, service coverage, and route economics, not only on demand headlines. That structure makes channel discipline unusually important for customer quality.",
