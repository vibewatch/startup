    {
      "id": "operational-quality-and-competition-risk",
      "title": "The biggest operating risk is execution across a widening product and service stack",
      "body": "MLMML is managing several product generations and customer types at once: legacy ICE, low-speed EVs, newer L5 passenger vehicles, multiple cargo platforms, and Zeo as a 4W adjacency. That breadth is strategically powerful, but it raises coordination risk across spare parts, technician training, software support, warranty provisioning, and dealer communication. Public materials show strong hardware intent—newer platforms, richer features, and connected workflows—but not the metrics that would prove reliability at scale. There is no public claim-rate ledger, service-SLA dashboard, or battery replacement dataset in the retained set. Competition compounds the problem. Rivals keep resetting range and variant expectations, so any lag in refresh speed can translate directly into price pressure and a need for more financing support. The operational question for diligence is simple: can the organization keep field execution boring and reliable while the brochure gets more ambitious? Public sources do not yet answer that with hard operating data.",
