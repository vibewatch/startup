  topStrengths:
    - 品类领导地位真实存在：2026 年官方披露显示，MLMML 在印度 L5 电动三轮车市场份额约 39.5%–39.7%。
    - 作为私人车辆公司，MLMML 的已售车队证据少见地扎实：FY2026 EV 销量超过 1 lakh，2026 年 8 月累计 EV 销量超过 4 lakh。
    - Mahindra 母公司支持，加上 Lightrock、IFC 和 India-Japan Fund 多轮机构资金，显著降低近期生存风险。
    - 产品覆盖客运、货运，以及支撑软件或服务层，让 MLMML 比单一车型 EV 故事更有运营纵深。
    - 印度监管和采用趋势仍支持最后一英里交通电动化，尤其在买方 ROI 清晰、频繁使用经济性重要的细分场景。
  topRisks:
    - 独立财务不透明仍是投资判断的核心问题：子公司没有公开收入、毛利率、EBITDA、烧钱或现金流桥。
    - 2026 年 7 月估值约 US$1.13 billion，已经把很高执行质量计入价格，而公开证据尚未证明利润率轮廓。
    - 业务资本开支重，制造、电池、库存、服务和融资支持都需要持续执行。
    - 客户质量披露薄弱：公开来源没有拆分留存、集中度、车队与零售组合，或保有量的区域结构。
    - 母公司控制、IPO 时间仍在变化、治理细节不完整，限制外部投资者看清决策权和下行保护。
  unresolvedGaps:
    - 接近审计口径的独立财务，包括收入结构、毛利率、EBITDA、营运资本和现金消耗。
    - 2026 年 7 月融资的完整轮次条款、股权结构表、稀释路径和投资者权利包。
    - Zaheerabad、Pune/Chakan、Jaipur 相关引用以及其他任何在产基地的工厂归属、利用率和 capex 细节。
    - 客户队列质量、集中度、更换周期，以及 NEMO、服务、融资或车队管理产品的 attach-rate 数据。
    - 计划 2027 年上市前的董事会构成、治理保护和准确 IPO 准备里程碑。
