          detail: "Revenue, margins, burn, contracted fleet economics, and cap-table terms are unavailable."
        - id: "risk"
          label: "Commercialization and dilution risk"
          detail: "Demand, cost reduction, service burden, and future financing can materially change outcomes."
        - id: "decision"
          label: "Research more"
          detail: "Require primary financial, contract, fleet, and security-term evidence before pricing an entry."
      edges:
        - from: "market"
          to: "price"
        - from: "price"
          to: "proof"
        - from: "proof"
          to: "economics"
        - from: "economics"
          to: "risk"
        - from: "risk"
          to: "decision"
    approximationNotes: >-
      The sequence expresses decision dependencies only; it does not quantify probability,
      enterprise value, or expected return.
    claimRefs: ["CV003", "CV005", "CV008", "CV009", "CV014", "CV015", "CV016"]
callouts:
  - calloutType: "recommendation"
    title: "Do not confuse financing momentum with price support"
    body: >-
      The evidence supports continued diligence, not a priced commitment. A $3 billion-plus
      private mark and a large financing round demonstrate investor appetite, while the missing
      operating and security-rights data prevent a defensible return model.
    claimRefs: ["CV001", "CV004", "CV016"]
  - calloutType: "risk"
    title: "The public comparable is still loss-making"
    body: >-
      UBTECH's filing shows that measurable humanoid revenue can coexist with a substantial
      accounting loss and cash use, underscoring the need to obtain Galbot-specific margins,
      burn, and capital requirements before transferring peer enthusiasm into value.
    claimRefs: ["CV010", "CV011", "CV013"]
