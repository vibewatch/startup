company:
  name: "Galaxy Bot"
chapter:
  number: 8
  title: "Valuation"
  summary: >-
    Galbot has credible deployment and financing signals, including a reported valuation above
    $3 billion and a production-line relationship with CATL, but public evidence does not expose
    the revenue, margins, burn, cap-table rights, or contracted fleet economics needed to
    underwrite that price. The resulting recommendation is research-more with a stretched
    valuation stance and high risk until primary financial and contract evidence closes the gap.
sections:
  - id: "recommendation-and-price-discipline"
    title: "Recommendation and price discipline"
    body: >-
      The recommendation is research-more rather than buy or pass. CNBC reported an April 2026
      private valuation above $3 billion for Galbot, while CNEVPost reported a RMB2.5 billion
      ($368 million) financing announced in March. Those marks show access to capital and investor
      demand, but neither establishes enterprise value on fully diluted terms, the preferences
      attached to the latest securities, or a current operating multiple. The reviewed public
      record contains no Galbot revenue, gross margin, cash-burn, backlog, customer-concentration,
      or unit-economics disclosure. Without those denominators, a fair-value range or target
      return would be false precision. Entry should therefore remain conditional on a primary
      data room, contract-level deployment proof, and a financing-terms review.
    claimRefs: ["CV001", "CV004", "CV016"]
    tableRefs: ["TV001"]
  - id: "thesis-and-anti-thesis"
    title: "Thesis and anti-thesis"
    body: >-
      The positive case is not purely promotional: CNEVPost reported that Galbot S1 entered
      CATL's smart production line for long-running autonomous material-handling and picking work.
      That is a strategically relevant customer setting and a better proof point than a staged
      demonstration. The anti-thesis is that sector supply is advancing faster than verified
      demand. Associated Press reporting described limited use cases, more than 140 Chinese
      humanoid manufacturers and more than 330 models in 2025, while MERICS characterized most
      deployments as limited tasks and site-specific trials. A Robotics & Automation News
      homepage excerpt also framed the move from demonstrations and pilots to factories as a
      manufacturing-scale challenge. Galbot therefore has evidence of technical and partner
      progress, but not yet public proof of repeatable commercial economics.
    claimRefs: ["CV005", "CV006", "CV008", "CV015"]
    tableRefs: ["TV002"]
    figureRefs: ["FV001"]
  - id: "comparables-and-scenario-logic"
    title: "Comparables and scenario logic"
    body: >-
      Private peer marks are useful only as sentiment references. CNBC placed Figure at at least
      $39 billion, Apptronik at $5 billion, Galbot above $3 billion and AI2 Robotics at roughly
      $2.93 billion, while also reporting that US humanoid startups are perceived as broad AI
      platforms and Chinese companies more as industrial hardware plays. Those prices do not
      normalize security rights or operating maturity. UBTECH offers a more concrete operating
      reference because its 2025 filing disclosed RMB2.001 billion of revenue, RMB820.6 million
      from full-size embodied humanoid products and services, a 37.7% gross margin, and a
      RMB789.8 million accounting loss. It is still a competitor filing, not an independent
      valuation benchmark, and its diversified product mix makes direct multiple transfer
      inappropriate.
    claimRefs: ["CV002", "CV003", "CV010", "CV011", "CV012", "CV013", "CV014"]
    tableRefs: ["TV003"]
  - id: "exit-readiness-and-thesis-breaks"
    title: "Exit readiness, diligence asks, and thesis breaks"
    body: >-
      Exit readiness cannot be established from the assigned public evidence. A financing mark is
      not liquidity, and funding raised is not cash available; no reviewed source supplies a
      Galbot IPO timetable, secondary-market terms, audited financial history, or acquisition
      precedent. The key diligence asks are a fully diluted cap table with liquidation
      preferences, audited revenue and cash-flow statements, signed customer contracts, fleet
      uptime and intervention logs, warranty and service costs, and a bridge from deployments to
      gross margin. Thesis-break triggers are measurable: failure to convert CATL-related work
      into paid repeat deployments, persistent economics above viable labor substitution,
      dependence on subsidized or state-linked demand, or a financing round below the current
      mark. Until those points are tested, downside cannot be bounded and upside cannot be
      converted into a target return.
    claimRefs: ["CV005", "CV007", "CV009", "CV013", "CV016"]
tables:
  - id: "TV001"
    title: "Recommendation summary"
    columns: ["Decision field", "Assessment", "Decision implication"]
    rows:
      - ["Recommendation", "Research more", "Do not underwrite a priced entry until primary financial and contract evidence is available."]
      - ["Confidence", "Medium-low", "Deployment and financing signals are visible, but core valuation denominators are absent."]
      - ["Risk rating", "High", "Commercialization, capital intensity, demand depth, dilution, and liquidity remain material."]
      - ["Valuation stance", "Stretched", "The reported $3 billion-plus mark is not supported by disclosed Galbot operating metrics."]
      - ["Price discipline", "No defensible public fair-value range", "Require a data-room valuation using fully diluted terms and scenario-tested cash needs."]
    notes: >-
      Assessments are analyst conclusions from the assigned public source set; no Galbot audited
      financials, cap table, security terms, or current revenue denominator were available.
    claimRefs: ["CV001", "CV004", "CV006", "CV008", "CV009", "CV014", "CV016"]
  - id: "TV002"
    title: "Thesis and anti-thesis"
    columns: ["Side", "Argument", "What would change the view"]
    rows:
      - ["Thesis", "Galbot S1 has reported production-line deployment at CATL for autonomous handling and picking.", "Customer-signed uptime, intervention, throughput, safety, and paid-expansion data would strengthen the claim."]
      - ["Thesis", "A reported RMB2.5 billion financing and $3 billion-plus valuation indicate substantial investor support.", "Fully diluted terms, investor rights, remaining cash, and use-of-proceeds evidence are needed to translate funding into runway."]
      - ["Anti-thesis", "Chinese humanoid supply and model count are high while proven buyer demand and autonomous use cases remain constrained.", "Repeat orders from non-affiliated customers at disclosed economics would reduce commercialization risk."]
      - ["Anti-thesis", "Industry costs and field efficiency remain short of broad commercial viability.", "Evidence of delivered cost below the labor-substitution threshold with acceptable service burden would improve the case."]
    notes: >-
      Deployment details are reported by CNEVPost from CATL statements; financing figures are
      reported values rather than audited cash or fully diluted valuation evidence.
    claimRefs: ["CV001", "CV004", "CV005", "CV006", "CV008", "CV009"]
  - id: "TV003"
    title: "Bull, base, and bear scenario framework"
    columns: ["Case", "Assumptions", "Valuation / return logic", "Key risks", "Probability signal"]
    rows:
      - ["Bull", "CATL deployment expands into repeat paid fleets; unit cost falls; uptime and service economics validate scaled industrial use.", "The current $3 billion-plus mark may become defensible, but no public terminal range or target return can be calculated.", "Execution, customer concentration, safety, and capital intensity.", "Positive only after audited growth, repeat orders, and cohort-level fleet economics."]
      - ["Base", "Galbot remains a credible technical contender with selective deployments, but operating disclosure stays limited.", "Track rather than price; the current mark remains stretched because revenue and margin denominators are unavailable.", "Long commercialization cycles, financing dilution, and opaque preferences.", "Current public evidence most closely supports this case."]
      - ["Bear", "Demand remains pilot-led or subsidized, cost reduction stalls, or the next financing prices below the current mark.", "Downside is unbounded in public evidence; private-share illiquidity and preference overhang could amplify loss.", "Down round, weak exit market, concentration, and ongoing cash needs.", "Triggered by failed renewals, limited autonomous hours, or adverse financing terms."]
    notes: >-
      Scenarios are conditional frameworks, not forecasts; valuation ranges and probabilities are
      intentionally not quantified because Galbot financial statements and security terms are unavailable.
    claimRefs: ["CV005", "CV006", "CV007", "CV008", "CV009", "CV013", "CV016"]
