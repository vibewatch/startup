  topStrengths:
    - CATL provides a substantive production-line deployment reference.
    - The company has attracted substantial strategic and institutional financing.
    - Its product thesis combines task-specific embodied-AI models with deployed mobile-manipulation hardware.
  topRisks:
    - Revenue, gross margin, burn, runway, and unit economics are not publicly disclosed.
    - Commercial proof is concentrated in one named production customer that is also a strategic investor.
    - Fleet reliability, intervention burden, safety certification, and incident history remain unverified.
    - Dependence on foreign compute and precision components creates geopolitical and supply-chain exposure.
    - The reported valuation is not supported by disclosed operating denominators or financing rights.
  unresolvedGaps:
    - Audited revenue, gross margin, cash burn, cash balance, debt, and runway
    - Fully diluted cap table, liquidation preferences, investor rights, and use of proceeds
    - Signed customer contracts, paid unit counts, concentration, renewal, and deployment ROI
    - Fleet uptime, intervention rate, failure history, field-service cost, and warranty burden
    - Product-safety certifications, incident logs, privacy controls, insurance, and litigation status
    - Current executive bench, board composition, headcount, and succession arrangements
