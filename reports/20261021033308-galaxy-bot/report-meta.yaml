companyProfile:
  summary: >-
    Founded in 2023 by He Wang, Galaxy Bot is a privately held Chinese embodied-AI robotics company operating under the
    Galbot brand. Its public product thesis combines task-specific vision-language-action models with
    mobile-manipulation hardware, and its strongest disclosed commercialization proof is an S1 deployment on CATL
    production lines. Public reporting shows substantial financing and a valuation above $3 billion, but does not
    reconcile total capital raised or disclose revenue, margins, burn, customer concentration, fleet reliability, or
    financing rights.
  foundedDate: null
