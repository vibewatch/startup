  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable boundary is not the entire robotics or artificial-intelligence market. Galaxy Bot's
              relevant near-term market comprises embodied-AI humanoid and mobile-manipulation systems sold with
              deployment and support for bounded industrial, logistics, retail, healthcare, and research workflows.
              Conventional fixed industrial robots, robotic arms, automated guided vehicles, and human labor remain the
              principal substitutes. This distinction matters because China produced far more conventional industrial
              robots than humanoids in 2025, and many factories already automate repetitive work without needing a human
              form. Consumer household care belongs in an adjacency, not the current serviceable market, because
              available evidence still describes expensive, fragile systems that depend on structured environments.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM010
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
              - CM012
              - CM014
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The retained evidence does not support a clean TAM/SAM/SOM calculation. It mixes production, shipments,
              company sales, revenue, and long-range forecasts from different publishers and time horizons. The most
              useful current anchor is therefore adoption velocity: MERICS reported 12,800 Chinese humanoids produced in
              2025, while Associated Press reporting cited more than 13,000 global shipments and an approximately 85%
              Chinese share. Morgan Stanley's roughly 28,000-unit China forecast for 2026 suggests rapid growth, but its
              cited $5 trillion market estimate lacks a horizon in the fetched copy. UBTECH's audited 1,079-unit,
              RMB820.6 million 2025 result proves that meaningful commercial revenue is possible without establishing
              Galaxy Bot's obtainable share.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM008
              - CM015
      - number: '2.3'
        title: Buyers, users, and adoption paths
        blocks:
          - type: paragraph
            body: >-
              Industrial buyers offer the clearest path from pilot to recurring deployment. Plant automation and
              operations leaders can fund systems for material handling, picking, sorting, inspection, and other
              repetitive or hazardous tasks, while line workers and maintenance teams are the daily users. CATL's
              reported use of Galbot S1 for production-line handling and picking is a concrete workflow signal, and
              TechNode reported Galbot's claim of several thousand cumulative industrial orders. Logistics, research,
              retail, and healthcare broaden the opportunity, but their budget owners and acceptance criteria differ.
              Every sale therefore requires site integration, safety validation, service coverage, and an ROI case
              against labor or established automation rather than a generic appetite for humanoids.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM014
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              China's dense robotics and electric-vehicle supply chains, policy support, and large factory base should
              accelerate component localization, training-data collection, and deployment learning. MERICS estimated
              that Chinese companies represented 63% of key firms in the global humanoid-component supply chain and
              supplied 57% of China's industrial-robot market in 2024. The counterweight is economic and technical:
              MERICS cited typical Chinese humanoid prices of CNY300,000-500,000 versus a CNY160,000
              commercial-viability threshold, while independent reporting described limited use cases, fragile
              operation, and demand trailing manufacturing capacity. Dependence on Nvidia's training and edge-compute
              ecosystem adds geopolitical and supply risk. Valuation should therefore reward verified deployments and
              task-level economics, not broad market forecasts alone.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: A large forecast is not an obtainable market
            body: >-
              The evidence does not disclose Galaxy Bot's price, deployment revenue, renewal economics, customer
              concentration, or task-level payback. A company-specific SAM or SOM would be false precision until those
              inputs are available.
            calloutType: risk
            claimRefs:
              - CM008
              - CM011
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: A crowded field with several forms of competition
        blocks:
          - type: paragraph
            body: >-
              The buyer's choice set is broader than humanoid startups alone. Direct Chinese peers include UBTECH,
              Unitree, AgiBot, AI2 Robotics, Matrix Robotics, and EngineAI; US entrants such as Figure and Apptronik
              compete for capital, software talent, and multinational factory programs. Incumbent fixed arms, conveyors,
              and purpose-built automation remain the strongest status-quo substitutes because many plants already use
              them for repetitive tasks. Internal integration around third-party robot bodies and software is another
              viable substitute as hardware becomes cheaper and modular. The field is fragmented: Associated Press
              reported more than 140 Chinese humanoid manufacturers and more than 330 models in 2025. Shipment
              leadership is concentrated elsewhere, with AgiBot and Unitree each reported above 5,000 units in 2025
              while Figure and Tesla shipped only a few hundred or fewer. Galbot's reported $1.1 billion of disclosed
              funding and $3 billion-plus valuation provide staying power, but neither metric proves comparable
              commercial scale.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP010
              - CP011
              - CP012
      - number: '3.2'
        title: Software ambition differentiates Galbot, while peers lead visible scale
        blocks:
          - type: paragraph
            body: >-
              Galbot's clearest differentiation is an intelligence-first architecture for autonomous mobile
              manipulation. MERICS identifies separate GraspVLA, TrackVLA, and GroceryVLA models and notes Galbot's
              preference for synthetic training data. That specialization is meaningful in retail picking and
              navigation, but it also shows how narrow today's autonomy remains. UBTECH offers the strongest disclosed
              proof of industrial commercialization: its filing reports Walker S2 mass production, more than 6,000 units
              of annualized full-size production capacity at year-end 2025, and humanoid revenue of RMB820.6 million.
              Unitree and AgiBot lead reported shipment volume, while Figure retains a software-platform narrative at a
              much higher valuation. The map therefore separates visible deployment scale from autonomy orientation; it
              is an evidence-backed ordinal comparison, not a performance benchmark.
            claimRefs:
              - CP003
              - CP005
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP012
              - CP013
              - CP014
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP007
              - CP012
              - CP016
      - number: '3.3'
        title: Price pressure is visible, but Galbot's commercial terms remain opaque
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not expose Galbot's list price, realized price, contract length, service fees, or
              discounting. The available market anchors nevertheless point to intensifying price pressure: MERICS places
              China's average industrial humanoid price at RMB300,000-RMB500,000 and cites a calculated
              commercial-viability threshold of RMB160,000, while Unitree's G1 is materially below those averages.
              Galbot may offset price pressure through task performance and distribution. Its CATL relationship puts the
              S1 on a battery production line and proposes access to CATL's aftermarket service network, a potentially
              important deployment and support advantage. Trust requirements are also becoming structural rather than
              optional: China's new robot identification regime applies a no-code, no-market-access rule and lifecycle
              traceability. That raises compliance costs but may favor vendors with mature manufacturing and service
              partners.
            claimRefs:
              - CP008
              - CP009
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP015
      - number: '3.4'
        title: The moat depends on deployment data and economics that are not yet public
        blocks:
          - type: paragraph
            body: >-
              Galbot can plausibly build a learning loop from retail and industrial deployments, but public evidence
              does not quantify fleet size, task success, uptime, intervention rates, or customer retention. Chinese
              suppliers already control much of the component ecosystem and domestic robot market, reducing hardware
              scarcity as a durable moat. At the same time, reliance on Nvidia's robotics stack and imported high-end
              components limits full-stack control. Independent reporting is adverse on category economics: MERICS says
              current humanoids remain site-specific and too expensive for widespread use, while Associated Press
              reports that buyers can retain fixed automation and that many orders have come from state-owned
              enterprises. Galbot's defensibility therefore rests on proving superior task-level ROI and accumulating
              proprietary deployment data faster than scaled peers, not on funding, valuation, or a single anchor
              partnership.
            claimRefs:
              - CP006
              - CP007
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial moat remains unverified
            body: >-
              No retained source discloses Galbot's realized pricing, fleet uptime, intervention rate, retention,
              switching cost, or customer concentration; these are required to distinguish a durable learning loop from
              funded pilot activity.
            calloutType: risk
            claimRefs:
              - CP013
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Commercial proof is ahead of financial disclosure
        blocks:
          - type: paragraph
            body: >-
              The strongest public commercial signal is operational rather than financial: CnEVPost reports that the
              Galbot S1 entered CATL's production line for material-handling and picking work. The same account says the
              partners intend to extend CATL's after-sales system to embodied-intelligence robots, implying that
              deployment, maintenance, and lifecycle support may all matter to the economic model. Neither item
              establishes whether Galbot sells hardware, leases capacity, charges for integration, earns recurring
              service fees, or recognizes revenue only after acceptance. The assigned evidence also provides no contract
              value, realized unit price, customer concentration, revenue, ARR, or gross-margin figure. Accordingly,
              CATL is evidence of product use, not proof of material revenue or attractive unit economics. Underwriting
              should separate a robot placed in a factory from a paid, accepted, collectible deployment with a defined
              support burden.
            claimRefs:
              - CI001
              - CI002
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI016
      - number: '4.2'
        title: Sector price points imply a demanding ROI threshold
        blocks:
          - type: paragraph
            body: >-
              Public price evidence is available for the category but not for Galbot. Associated Press reporting cites
              roughly USD 99,000 for Matrix Robotics' MATRIX-3 and CNY 180,000 (USD 26,600) for a basic EngineAI
              humanoid. MERICS places China's average humanoid price at CNY 300,000-500,000 and cites a CNY 160,000
              commercial-viability threshold based on CNY 80,000 of annual labor cost and a two-year ROI period. Those
              figures are different products, configurations, and evidence vintages, so they define a range rather than
              a Galbot price. Both MERICS and Morgan Stanley expect major price compression before broad adoption. That
              creates a margin challenge: Galbot must reduce bill-of-materials, installation, reliability, and support
              costs at least as quickly as market prices decline. A software-AI usage model is expressly not a valid
              proxy for this hardware-and-service cost structure.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
      - number: '4.3'
        title: Capital raised does not resolve the cash and burn questions
        blocks:
          - type: paragraph
            body: >-
              CnEVPost reports a March 2026 financing of CNY 2.5 billion (USD 368 million), while CNBC reports a
              valuation above USD 3 billion. These are financing and valuation observations, not measures of cash
              currently available, operating cash consumption, debt obligations, or runway. The cost base is likely to
              combine robotics hardware, model training, field integration, maintenance, and working capital, but Galbot
              does not disclose their amounts in the assigned evidence. UBTECH offers a useful public-company boundary:
              it reported strong humanoid revenue growth and higher gross margin in 2025 while remaining loss-making and
              using cash in operations. UBTECH also reports that product revenue is recognized at a point in time and
              that undelivered or unaccepted projects deferred revenue, highlighting delivery acceptance and collection
              timing as central diligence issues. These peer data do not estimate Galbot's burn or runway.
            claimRefs:
              - CI003
              - CI004
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              Galbot has credible deployment and financing signals, but the present evidence cannot support a
              revenue-quality, margin, or capital-adequacy conclusion. Sector evidence is adverse: buyers remain
              limited, much reported Chinese demand has come from state-owned enterprises, and independent analysts
              describe current robots as too costly for widespread deployment. The investment case therefore depends on
              converting reference deployments into repeatable, paid units while containing installation and after-sales
              labor as prices fall. Before underwriting, investors need customer-level billings and collections,
              contract and acceptance terms, hardware and service gross margins, warranty and field support costs,
              inventory and receivables aging, monthly operating cash use, unrestricted cash, debt, committed capex, and
              the trigger for the next financing. Until those records are supplied, the financial profile should be
              treated as high-uncertainty and financing-dependent rather than as demonstrated scale economics.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI006
              - CI008
              - CI009
              - CI010
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding is not runway
            body: >-
              The reported CNY 2.5 billion financing does not disclose Galbot's unrestricted cash, operating cash use,
              debt, committed capex, or remaining runway.
            calloutType: risk
            claimRefs:
              - CI003
          - type: callout
            title: Underwrite collections, not placements
            body: >-
              Require invoices, acceptance records, cash collections, support obligations, and customer-level
              contribution margins before treating factory deployments as scaled revenue.
            calloutType: recommendation
            claimRefs:
              - CI001
              - CI002
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Galbot's public product surface is best understood as two related operating envelopes rather than one
              proven general-purpose robot. The G1 is described by MERICS through three narrow vision-language-action
              models: GraspVLA for hands, TrackVLA for navigation, and GroceryVLA for retail. That decomposition
              supports an intelligence-first thesis but also shows that autonomy is still organized around bounded jobs.
              The S1 supplies a heavier industrial surface: CnEVPost reports a 50-kilogram dual-arm payload and
              operation on CATL's battery production line, including material handling and picking. These sources
              establish named workflows and deployed hardware, but they do not publish task-success rates, intervention
              frequency, cycle-time distributions, or customer ROI. Product diligence should therefore treat current
              proof as task-specific deployment evidence, not evidence that one model can transfer reliably across
              retail, manufacturing, and healthcare.
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE009
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE007
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
      - number: '5.2'
        title: Architecture, data, and differentiation
        blocks:
          - type: paragraph
            body: >-
              The visible architecture combines task-level VLA policies, synthetic grasp data, Nvidia simulation and
              edge-compute tooling, and a mobile manipulation platform. MERICS reports that Galbot's DexGraspNet is a
              simulated grasp dataset built with Nvidia Isaac Sim and that Galbot was among early recipients of Jetson
              Thor modules. This gives the company a plausible data and iteration advantage for dexterous manipulation,
              while creating an external dependency at both simulation and compute layers. The architecture remains only
              partially observable: the retained sources do not disclose model evaluation protocols, data-rights
              controls, on-device versus cloud boundaries, fallback behavior, fleet orchestration, or release
              management. The architecture map is therefore an evidence-backed diligence model, not a claim that the
              listed layers reproduce Galbot's internal implementation.
            claimRefs:
              - CE003
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE007
              - CE008
              - CE011
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE006
              - CE007
              - CE008
              - CE011
      - number: '5.3'
        title: Deployment maturity, reliability, and support
        blocks:
          - type: paragraph
            body: >-
              CATL is the strongest named deployment signal in the pool. CnEVPost reports long-running autonomous work
              by S1 in module and battery-pack production, an eight-hour battery-life claim attributed to CATL, and a
              plan to extend CATL's Ning Service network from battery inspection and maintenance to
              embodied-intelligence robots. This indicates that deployment design includes energy and field-service
              considerations, not only robot capability. It does not establish uptime, mean time between failures,
              remote-assistance burden, spare-parts availability, or whether service economics are repeatable beyond
              CATL. UBTECH's 2025 filing provides a useful competitor benchmark: it links mass production to preventive
              design, manufacturing-process controls, module testing, and complete-robot testing. Galbot has not
              disclosed comparable controls in the retained evidence, so technical maturity should be underwritten below
              demonstrated deployment visibility.
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Trust, safety, standards, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Safety and quality assurance remain the least evidenced layer. ISO explains that standards set consistent
              benchmarks for reliability and trust, but the retained source set contains no Galbot-specific certificate,
              conformity assessment, formal safety test, status history, or incident register. That is an evidence gap,
              not evidence that incidents or controls do not exist. MERICS also cautions that Chinese humanoids
              generally remain limited in precision and dexterity and are commonly deployed in constrained,
              site-specific settings; the warning is a sector benchmark rather than a direct failure finding about
              Galbot. No assigned source supplies repository activity, releases, package downloads, API documentation,
              or a credible practitioner-community proxy, so developer adoption and software operating cadence cannot be
              scored. Diligence should request certification scope, hazard analyses, fail-safe behavior,
              penetration-test summaries, privacy and training-data governance, field incidents, uptime, intervention
              logs, and a versioned roadmap before assigning production-grade maturity.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Deployment proof is narrower than the general-purpose thesis
            body: >-
              CATL validates a defined industrial workflow, while independent sector analysis says humanoid autonomy
              remains constrained by dexterity, precision, cost, and site-specific operation. Require task-level
              reliability and intervention data before extrapolating to broader markets.
            calloutType: risk
            claimRefs:
              - CE002
              - CE009
              - CE010
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Customer base: industrial proof, broader positioning'
        blocks:
          - type: paragraph
            body: >-
              Galbot's strongest identifiable customer segment is large-scale industrial manufacturing. CATL has placed
              the S1 on a smart production line for module and battery-pack handling and picking, moving the
              relationship beyond a logo or demonstration. Retail remains a product-positioning segment rather than a
              verified customer cohort in the reviewed material: MERICS describes GroceryVLA as a model for retail
              scenarios, but names no Galbot retailer. Industry evidence also points to research laboratories,
              state-owned enterprises, logistics operators, factories, and malls as active humanoid buyers or deployment
              sites, yet those observations cannot be attributed to Galbot's own customer base. The resulting
              segmentation is therefore evidence-tiered rather than a claimed account census.
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU010
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU002
              - CU007
              - CU010
              - CU014
      - number: '6.2'
        title: Adoption proof and trajectory
        blocks:
          - type: paragraph
            body: >-
              CATL is the clearest marker of production adoption: CnEVPost reports that the S1 performs long-running
              autonomous work rather than a one-off pilot. The wider demand environment is credible but uneven. China
              had 470 operational industrial robots per 10,000 manufacturing employees in 2023, indicating an
              automation-literate buyer base, while 2026 reporting says Chinese humanoid vendors are already shipping
              into factories and malls. Peer disclosures show that commercialization can become financially
              material—UBTECH reported 1,079 full-size robots and RMB820.6 million of related 2025 revenue—but those
              peer figures are not evidence of Galbot volume, revenue, or repeat usage. No Galbot account count or
              installed-base series is available in the assigned evidence.
            claimRefs:
              - CU002
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU007
              - CU009
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU008
              - CU010
              - CU011
              - CU013
      - number: '6.3'
        title: Durability and expansion
        blocks:
          - type: paragraph
            body: >-
              The CATL relationship contains one credible expansion mechanism: the parties intend to fold
              embodied-intelligence robots into CATL's established Ning Service inspection, maintenance, and recycling
              network. That could lower field-support friction and enable expansion across production sites, but the
              evidence does not state a rollout schedule, committed unit count, contract term, renewal trigger, or
              economics. CATL is also described as an investor in Galbot, so deployment evidence and strategic backing
              are intertwined rather than fully independent customer validation. With no disclosed NRR, GRR, churn,
              renewal, utilization, satisfaction, or cohort data, customer durability cannot be underwritten from public
              evidence.
            claimRefs:
              - CU003
              - CU004
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU005
              - CU015
      - number: '6.4'
        title: Customer risk and underwriting implications
        blocks:
          - type: paragraph
            body: >-
              Customer risk is dominated by proof concentration and category-level commercialization uncertainty. The
              reviewed Galbot-specific evidence names CATL as the sole production reference, while independent industry
              analysis says humanoids remain expensive, constrained to limited tasks, and often deployed in
              site-specific trials. Associated Press reporting adds that 2025 Chinese humanoid orders were heavily
              supported by state-owned enterprises and research demand, and that buyers may lag manufacturing capacity.
              Galbot may still build a durable industrial wedge, but current evidence cannot distinguish paid production
              units from strategic pilots, quantify revenue concentration, or demonstrate renewal economics. An
              investment case should therefore require contract-level proof from multiple unrelated customers.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reference quality is not customer breadth
            body: >-
              CATL is a high-quality production reference, but it is also a strategic investor and the only named Galbot
              production customer in the reviewed pool. Treat it as proof of feasibility, not proof of diversified
              recurring demand.
            calloutType: risk
            claimRefs:
              - CU002
              - CU004
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              Commercialization and execution are the highest residual risks. Independent reporting says humanoid supply
              capacity may be running ahead of buyer demand and that robots remain expensive, fragile, and dependent on
              highly structured environments. MERICS separately finds that Chinese humanoids still lack precision and
              dexterity and are generally confined to limited tasks or site-specific trials. Those findings matter
              directly to Galbot because a successful CATL deployment proves access to a demanding industrial setting,
              not repeatable economics across customers or unstructured workflows. The investment case should therefore
              be conditioned on measured task success, intervention frequency, uptime, deployment cost, and renewal or
              expansion evidence rather than order announcements or technical demonstrations. Peer results reinforce the
              financial risk: UBTECH grew humanoid revenue sharply in 2025 yet remained loss-making, so sector
              commercialization can scale before operating self-sufficiency is achieved.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
              - CR012
              - CR013
              - CR015
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR007
              - CR009
              - CR011
              - CR012
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and geopolitical exposure
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not establish Galbot's product-safety certifications, privacy controls,
              incident record, insurance coverage, export-control classification, or litigation posture. That is a
              material diligence gap, not evidence that no incidents or proceedings exist. The clearest externally
              evidenced regulatory exposure is prospective: MERICS identifies dependence on Nvidia's robotics ecosystem
              and notes that increasingly capable edge-computing chips could become export-control targets. CNBC also
              reports that US-China tensions and national-security scrutiny have chilled cross-border investment. These
              conditions can constrain compute access, financing sources, overseas customers, and exit optionality even
              without a company-specific enforcement action. Investment documentation should require a jurisdiction-
              by-jurisdiction compliance matrix, safety test files, incident logs, data-governance architecture, and
              supplier substitution plan before treating this risk as mitigated.
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR010
      - number: '7.3'
        title: Operational and partner dependencies
        blocks:
          - type: paragraph
            body: >-
              Galbot's CATL relationship is both evidence of deployment and a concentration risk. Reporting says the S1
              entered CATL's smart production line for material handling and picking, while CATL's Ning Service network
              is expected to extend into embodied-robot after-sales support. This can reduce field-service friction, but
              it also leaves deployment credibility and support capacity partly dependent on one strategic
              investor-customer ecosystem. Technical concentration is broader: MERICS reports dependence on Nvidia
              software and chips and on German and Japanese precision-component suppliers. Monitoring should therefore
              separate Galbot-controlled performance from partner-provided batteries, service, compute, and components.
              Kill criteria include failure to qualify alternative compute or critical components, persistent human
              intervention above contracted thresholds, or an inability to reproduce CATL-level performance at two
              unrelated customers.
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR008
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR008
              - CR009
              - CR010
      - number: '7.4'
        title: Mitigation priorities and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The strongest visible mitigation is a structured industrial deployment with a large manufacturer and an
              announced route into that partner's service network. It does not resolve demand breadth, safety
              governance, reliability, or economics. Management should provide monthly fleet uptime, autonomous
              task-completion rate, human interventions per operating hour, mean time between failures, field-service
              cost, gross margin by deployment, receivable aging, and customer concentration. A thesis break should be
              triggered by stalled production deployments, repeated safety-critical incidents, restricted access to
              essential compute without a qualified substitute, loss of CATL service support, or unit economics that do
              not improve with deployment scale. Competitive concentration also matters: TrendForce projects Unitree and
              AgiBot to capture nearly 80% of 2026 shipments, increasing the risk that Galbot's funding and valuation
              outrun its commercial share.
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR008
              - CR011
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Decision-critical evidence gap
            body: >-
              Do not treat the absence of a public incident or legal record in this assigned pool as proof of absence;
              safety, compliance, litigation, and fleet-incident diligence remains mandatory.
            calloutType: risk
            claimRefs:
              - CR004
              - CR007
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more rather than buy or pass. CNBC reported an April 2026 private valuation
              above $3 billion for Galbot, while CNEVPost reported a RMB2.5 billion ($368 million) financing announced
              in March. Those marks show access to capital and investor demand, but neither establishes enterprise value
              on fully diluted terms, the preferences attached to the latest securities, or a current operating
              multiple. The reviewed public record contains no Galbot revenue, gross margin, cash-burn, backlog,
              customer-concentration, or unit-economics disclosure. Without those denominators, a fair-value range or
              target return would be false precision. Entry should therefore remain conditional on a primary data room,
              contract-level deployment proof, and a financing-terms review.
            claimRefs:
              - CV001
              - CV004
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV008
              - CV009
              - CV014
              - CV016
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is not purely promotional: CNEVPost reported that Galbot S1 entered CATL's smart
              production line for long-running autonomous material-handling and picking work. That is a strategically
              relevant customer setting and a better proof point than a staged demonstration. The anti-thesis is that
              sector supply is advancing faster than verified demand. Associated Press reporting described limited use
              cases, more than 140 Chinese humanoid manufacturers and more than 330 models in 2025, while MERICS
              characterized most deployments as limited tasks and site-specific trials. A Robotics & Automation News
              homepage excerpt also framed the move from demonstrations and pilots to factories as a manufacturing-scale
              challenge. Galbot therefore has evidence of technical and partner progress, but not yet public proof of
              repeatable commercial economics.
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV005
              - CV008
              - CV009
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: Comparables and scenario logic
        blocks:
          - type: paragraph
            body: >-
              Private peer marks are useful only as sentiment references. CNBC placed Figure at at least $39 billion,
              Apptronik at $5 billion, Galbot above $3 billion and AI2 Robotics at roughly $2.93 billion, while also
              reporting that US humanoid startups are perceived as broad AI platforms and Chinese companies more as
              industrial hardware plays. Those prices do not normalize security rights or operating maturity. UBTECH
              offers a more concrete operating reference because its 2025 filing disclosed RMB2.001 billion of revenue,
              RMB820.6 million from full-size embodied humanoid products and services, a 37.7% gross margin, and a
              RMB789.8 million accounting loss. It is still a competitor filing, not an independent valuation benchmark,
              and its diversified product mix makes direct multiple transfer inappropriate.
            claimRefs:
              - CV002
              - CV003
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
              - CV016
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness cannot be established from the assigned public evidence. A financing mark is not liquidity,
              and funding raised is not cash available; no reviewed source supplies a Galbot IPO timetable,
              secondary-market terms, audited financial history, or acquisition precedent. The key diligence asks are a
              fully diluted cap table with liquidation preferences, audited revenue and cash-flow statements, signed
              customer contracts, fleet uptime and intervention logs, warranty and service costs, and a bridge from
              deployments to gross margin. Thesis-break triggers are measurable: failure to convert CATL-related work
              into paid repeat deployments, persistent economics above viable labor substitution, dependence on
              subsidized or state-linked demand, or a financing round below the current mark. Until those points are
              tested, downside cannot be bounded and upside cannot be converted into a target return.
            claimRefs:
              - CV005
              - CV007
              - CV009
              - CV013
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not confuse financing momentum with price support
            body: >-
              The evidence supports continued diligence, not a priced commitment. A $3 billion-plus private mark and a
              large financing round demonstrate investor appetite, while the missing operating and security-rights data
              prevent a defensible return model.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV016
          - type: callout
            title: The public comparable is still loss-making
            body: >-
              UBTECH's filing shows that measurable humanoid revenue can coexist with a substantial accounting loss and
              cash use, underscoring the need to obtain Galbot-specific margins, burn, and capital requirements before
              transferring peer enthusiasm into value.
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV013
