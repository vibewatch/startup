  - id: FP001
    title: 'Competitive positioning: visible deployment scale vs. autonomy orientation'
    type: quadrant
    summary: >-
      Ordinal evidence-backed positions distinguish reported shipment or production scale from emphasis on autonomous
      embodied-AI software.
    data:
      xAxis:
        label: Visible deployment scale (1=limited disclosed scale, 5=leading reported scale)
        min: 1
        max: 5
      yAxis:
        label: Autonomy orientation (1=hardware-led, 5=intelligence-first)
        min: 1
        max: 5
      points:
        - label: Galbot
          x: 3
          'y': 5
          detail: CATL deployment supports mid-scale placement; named VLA models support intelligence-first placement.
        - label: UBTECH
          x: 4
          'y': 4
          detail: Mass production, disclosed revenue, and Thinker-VLA support high scores on both axes.
        - label: Unitree
          x: 5
          'y': 2
          detail: >-
            Shipment leadership and low-cost hardware support scale; assigned evidence is less specific on autonomous
            work.
        - label: AgiBot
          x: 5
          'y': 3
          detail: Shipment leadership and dedicated data facilities support scale with a balanced software orientation.
        - label: Figure
          x: 2
          'y': 5
          detail: Low reported 2025 shipments but a strong Helix VLA platform orientation.
        - label: Fixed automation
          x: 5
          'y': 1
          detail: Widely deployed for repetitive factory tasks but not positioned as general-purpose embodied autonomy.
