        title: Exhibits
        blocks:
          - type: callout
            title: Industrial proof point exceeds a demonstration
            body: >-
              CATL's reported use of Galbot S1 in module and battery-pack production is the clearest evidence that
              Galaxy Bot has progressed beyond staged demonstrations, although contract value, paid-unit count, uptime,
              and deployment concentration remain undisclosed.
            calloutType: strength
            claimRefs:
              - CO012
