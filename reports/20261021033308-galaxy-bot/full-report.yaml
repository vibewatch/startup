        - date: 2024-06
          label: Angel financing
          detail: Multiples reports a $97M angel round.
          tone: positive
        - date: 2024-11
          label: Follow-on financing
          detail: Multiples reports a $69M undisclosed-stage round.
          tone: positive
        - date: 2025-01
          label: GraspVLA launch
          detail: Robotics & Automation News reports the launch of the GraspVLA model.
          tone: neutral
        - date: '2025-06-23'
          label: CATL and Puquan-led financing
          detail: The round is reported as $151M by Robotics & Automation News and $153M by Multiples.
          tone: positive
        - date: 2025-12
          label: $300M financing and $3B valuation
