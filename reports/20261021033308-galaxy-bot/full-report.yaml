  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Evidence moves from market opportunity through deployment proof and missing economics to a research-more decision.
    data:
      nodes:
        - id: market
          label: Large policy-backed market
          detail: China has manufacturing scale and state support, but the sector remains early.
        - id: price
          label: $3B+ reported Galbot mark
          detail: The private valuation is a financing reference, not a public market price.
        - id: proof
          label: CATL deployment signal
          detail: Galbot S1 reportedly performs long-running production-line handling and picking.
        - id: economics
          label: Financial denominators missing
          detail: Revenue, margins, burn, contracted fleet economics, and cap-table terms are unavailable.
        - id: risk
          label: Commercialization and dilution risk
          detail: Demand, cost reduction, service burden, and future financing can materially change outcomes.
        - id: decision
          label: Research more
          detail: Require primary financial, contract, fleet, and security-term evidence before pricing an entry.
      edges:
        - from: market
          to: price
        - from: price
          to: proof
        - from: proof
          to: economics
        - from: economics
          to: risk
        - from: risk
          to: decision
    approximationNotes: >-
      The sequence expresses decision dependencies only; it does not quantify probability, enterprise value, or expected
      return.
    claimRefs:
      - CV003
      - CV005
      - CV008
      - CV009
      - CV014
      - CV015
      - CV016
