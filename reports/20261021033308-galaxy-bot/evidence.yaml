evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current executive roster, board composition, voting rights, succession plan, and founder ownership are absent from
      the assigned public evidence.
    whyItMatters: Governance quality, key-person exposure, and investor control cannot be assessed from the founder profile alone.
    diligencePath: >-
      Obtain a signed organization chart, board register and minutes, current cap table, shareholder agreement, and
      key-person continuity plan.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Audited Galaxy Bot revenue, gross margin, cash burn, cash balance, headcount, active customer count, paid-unit
      count, geographic site count, and service staffing are unavailable.
    whyItMatters: >-
      Financing and pilot announcements cannot establish operating scale, capital efficiency, customer concentration, or
      runway.
    diligencePath: >-
      Request audited financial statements, monthly management accounts, payroll roster, customer and site ledger,
      shipment acceptance records, and cash reconciliation.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      Retained sources do not reconcile the $619 million and $800 million cumulative-funding figures or consistently
      convert the March 2026 RMB2.5 billion round.
    whyItMatters: >-
      An incorrect cumulative total would distort dilution, capital-efficiency, and liquidity analysis, while funding
      raised still would not equal cash available.
    diligencePath: >-
      Reconstruct every financing from primary closing documents, bank receipts, currency dates, secondary components,
      debt instruments, and post-money cap tables.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: safety-and-compliance
    missingEvidence: >-
      The assigned evidence contains no company-specific safety-incident log, certifications, product-liability history,
      regulatory correspondence, or independently measured uptime.
    whyItMatters: >-
      Physical deployment in factories and public environments creates safety, reliability, and liability exposure that
      deployment announcements do not quantify.
    diligencePath: >-
      Obtain incident and near-miss registers, certification packages, insurer loss runs, customer acceptance tests,
      uptime logs, and regulator correspondence.
    relatedQuestionRefs:
      - QO007
      - QO008
  - type: private-evidence-only
    severity: material
    topic: company-sizing
    missingEvidence: >-
      Galaxy Bot pricing, unit shipments, deployment revenue, signed backlog by vertical, and renewal or expansion data
      needed to derive a serviceable and obtainable market.
    whyItMatters: >-
      Without company-specific commercial inputs, market-share and revenue scenarios would convert broad category
      forecasts into unsupported precision.
    diligencePath: >-
      Obtain a management data room extract reconciling orders, delivered units, revenue, cancellations, vertical mix,
      geography, and contract duration through 2026-09-30.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: buyer-roi
    missingEvidence: >-
      Task-level customer ROI, payback period, uptime, intervention rate, integration cost, and field-service burden for
      scaled Galaxy Bot deployments.
    whyItMatters: >-
      These metrics determine whether pilots displace labor or fixed automation and whether deployment demand persists
      without subsidies or strategic-partner support.
    diligencePath: >-
      Review cohort-level telemetry and interview procurement, plant operations, safety, and maintenance owners at CATL
      and at least two non-investor customers.
    relatedQuestionRefs:
      - QM006
      - QM007
      - QM009
  - type: private-evidence-only
    severity: material
    topic: switching and retention
    missingEvidence: Customer-level renewal, expansion, multi-homing, switching-cost, and decommissioning data for Galbot deployments.
    whyItMatters: >-
      Without retention and switching evidence, deployment announcements cannot establish durable lock-in or recurring
      demand.
    diligencePath: >-
      Request anonymized cohort retention, installed-fleet activity, contract duration, renewal, and competitor
      displacement data.
    relatedQuestionRefs:
      - QP006
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Galbot list and realized pricing, integration fees, service obligations, discounts, gross margin, and customer
      payback.
    whyItMatters: Public competitor prices cannot establish Galbot's price-performance position or deployment economics.
    diligencePath: >-
      Review recent customer contracts, bill of materials, service-level terms, deployment labor, and realized
      contribution margin.
    relatedQuestionRefs:
      - QP004
      - QP006
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: monetization
    missingEvidence: Galbot price lists, executed contracts, realized unit prices, discounts, acceptance terms, and revenue by stream.
    whyItMatters: Without contract economics, deployment evidence cannot establish revenue quality or repeatability.
    diligencePath: >-
      Review a contract sample, invoices, acceptance certificates, collections, and revenue-recognition policy by
      customer cohort.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: Sales cycle, pipeline conversion, customer-acquisition cost, deployment cost, and customer payback.
    whyItMatters: These inputs determine whether new deployments create value before financing and support costs.
    diligencePath: >-
      Obtain CRM cohort exports, sales payroll allocation, implementation hours, and customer ROI studies reconciled to
      invoices.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Unrestricted cash, monthly operating cash use, debt schedule, committed capex, working-capital needs, and downside
      runway.
    whyItMatters: Funding raised cannot be converted into cash available or runway without balance-sheet and cash-flow evidence.
    diligencePath: >-
      Review bank statements, debt agreements, board cash forecasts, capex commitments, and a monthly 24-month downside
      plan.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A public repository, package registry, API or integration forum, engineering talk, or practitioner-community
      metric attributable to Galbot.
    whyItMatters: >-
      Without a developer or practitioner signal, software release cadence, ecosystem adoption, integration burden, and
      external technical scrutiny cannot be assessed.
    diligencePath: >-
      Request the maintained repository and package inventory, release notes, API documentation, integration-partner
      references, and anonymized developer-support metrics.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: safety-evidence
    missingEvidence: >-
      Galbot-specific certification scope, hazard analyses, fail-safe tests, security assessments, privacy controls,
      reliability logs, and incident or recall history.
    whyItMatters: >-
      Robots operating around workers and customers create physical, operational, data, and compliance risk that cannot
      be underwritten from deployment announcements alone.
    diligencePath: >-
      Review certificates and underlying test reports, FMEA and hazard logs, penetration-test summaries, privacy impact
      assessments, uptime and intervention data, and the incident register.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: deployment
    missingEvidence: >-
      Task-success rates, intervention frequency, uptime, cycle-time distributions, service cost, spare-parts lead
      times, and customer ROI for each deployed workflow.
    whyItMatters: >-
      Named deployment and payload specifications do not establish repeatable performance, reliability, support
      economics, or scalable customer value.
    diligencePath: >-
      Obtain twelve months of site-level telemetry and service records for CATL and at least two unrelated deployments,
      normalized by task, shift, payload, and environmental conditions.
    relatedQuestionRefs:
      - QE004
      - QE007
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Galbot NRR, GRR, churn, renewals, contract duration, utilization cohorts, and customer-satisfaction evidence.
    whyItMatters: Without durability data, a production reference cannot establish recurring demand or expansion economics.
    diligencePath: >-
      Obtain a customer-level cohort export, signed contract samples, renewal history, deployment utilization logs, and
      reference calls with at least three unrelated production customers.
    relatedQuestionRefs:
      - QU004
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
