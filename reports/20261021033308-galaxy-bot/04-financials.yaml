callouts:
  - calloutType: risk
    title: Funding is not runway
    body: >-
      The reported CNY 2.5 billion financing does not disclose Galbot's unrestricted cash,
      operating cash use, debt, committed capex, or remaining runway.
    claimRefs: [CI003]
  - calloutType: recommendation
    title: Underwrite collections, not placements
    body: >-
      Require invoices, acceptance records, cash collections, support obligations, and
      customer-level contribution margins before treating factory deployments as scaled revenue.
    claimRefs: [CI001, CI002, CI016]
