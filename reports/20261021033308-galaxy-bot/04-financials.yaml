    notes: "Galbot values are limited to disclosed deployment status; null means no quantity or monetization term appears in the assigned prefetched evidence."
    claimRefs: [CI001, CI002]
  - id: TI002
    title: Pricing and monetization boundary
    columns: [Offering or benchmark, Price or unit, List versus realized, Discounts or unknowns, Underwriting implication]
    rows:
      - [Galbot S1, "Not disclosed", Unknown, "Contract, fleet discount, integration, and support terms unavailable", "No realized ASP or contribution margin can be calculated"]
      - [Matrix Robotics MATRIX-3, "About USD 99,000 per unit", Reported asking price, "Configuration and realized discount unknown", "High ticket price does not establish demand or margin"]
      - [EngineAI basic humanoid, "CNY 180,000 (USD 26,600)", Reported basic-edition price, "Capabilities and service bundle differ", "Entry price shows category dispersion"]
      - [China humanoid average, "CNY 300,000-500,000", Analyst market range, "Mix and specification vary", "Galbot cannot be placed in this range without a quote"]
      - [Commercial-viability threshold, "CNY 160,000", Analyst-derived threshold, "Assumes CNY 80,000 annual labor and two-year ROI", "Customer ROI depends on utilization, reliability, and service cost"]
      - [Long-run high-income-country cost path, "USD 200,000 in 2024; USD 150,000 in 2028; USD 50,000 in 2050", Morgan Stanley forecast, "Not a Galbot price and highly forecast-dependent", "Price compression raises the bar for cost reduction"]
    notes: "Peer prices and analyst ranges are not Galbot realized pricing; currencies, configurations, dates, and contract inclusions differ."
    claimRefs: [CI007, CI008, CI009, CI010]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Galbot value, Confidence, Public boundary or signal, Diligence ask]
    rows:
      - [Revenue, null, Unavailable, "Operational deployment disclosed but no Galbot revenue amount", "Audited monthly revenue by product, service, customer, and geography"]
      - [Gross margin, null, Unavailable, "UBTECH reported 37.7% group gross margin in 2025; not a Galbot estimate", "Hardware, software, integration, service, and warranty gross margin"]
      - [Operating cash use, null, Unavailable, "UBTECH used RMB 784.1 million in operations in 2025; not a Galbot proxy", "Monthly cash-flow statements and normalized operating burn"]
      - [CAC and payback, null, Unavailable, "No Galbot sales cycle, CAC, or payback evidence", "Pipeline cohorts, win rate, sales cost, deployment time, and payback"]
      - [Working capital, null, Unavailable, "Peer filing shows acceptance timing can defer robotics revenue", "Inventory, receivables aging, deposits, milestones, and collection history"]
      - [Cash and runway, null, Unavailable, "CNY 2.5 billion financing reported; proceeds are not cash-on-hand evidence", "Unrestricted cash, debt, committed capex, burn, and downside runway"]
    notes: "All Galbot nulls are explicit evidence gaps; listed-peer figures provide boundary conditions and must not be treated as Galbot estimates."
    claimRefs: [CI003, CI012, CI013, CI014, CI015, CI016]
