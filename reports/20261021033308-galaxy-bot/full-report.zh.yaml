    title: 基于证据的客户采用旅程
    type: journey-map
    summary: Galbot 已从任务选择走到一个生产示范项目，但可复制性和续约仍未得到验证。
    data:
      items:
        - label: 1. 任务选择
          detail: 瞄准结构化、重复性的搬运和拣选任务，这些场景中工业客户已经在使用自动化。
          touchpoints:
            - 工厂工作流
            - 安全和节拍要求
        - label: 2. 特定现场验证
          detail: 在客户生产环境中验证机器人；行业证据显示，许多人形机器人仍停留在局部试验阶段。
          touchpoints:
            - 试点生产线
            - 操作员接受度
        - label: 3. 生产运营
          detail: CATL 报告 Galbot S1 已在模组和电池包流程中进行常规生产线作业。
          touchpoints:
            - 物料搬运
            - 拣选
        - label: 4. 服务整合
          detail: 双方计划将 CATL 的 Ning Service 基础设施扩展到具身智能机器人。
          touchpoints:
            - 检查
            - 维护
            - 回收
        - label: 5. 多现场扩张
          detail: 规模化部署和全球扩张是既定目标，但现场、设备数量和时间安排均未披露。
          touchpoints:
            - 其他生产线
            - 其他现场
        - label: 6. 续约和价值证明
          detail: 留存、续约、利用率、回本周期和客户满意度仍未见报道。
          touchpoints:
            - 合同续约
            - ROI 测量
    approximationNotes: 各阶段描述了已有证据和缺失证据所对应的路径；不暗示转化率、时间安排或已承诺的推广量。
    claimRefs:
      - CU001
      - CU003
      - CU005
      - CU015
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 残余风险最高的领域，是行业约束与 Galbot 特定运营证据缺失交汇之处。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
      rows:
        - label: 商业需求广度
          values:
            - 高
            - 高
            - 早期
        - label: 可靠性和自主性
          values:
            - 高
            - 高
            - 早期
        - label: 外部计算资源和零部件
          values:
            - 中
            - 高
