        - label: CATL 生态集中度
          values:
            - 中
            - 高
            - 部分
        - label: 融资和地缘政治
          values:
            - 中
            - 中
            - 部分
        - label: 财务自给能力
          values:
            - 高
            - 高
            - 未验证
    approximationNotes: 可能性、影响和成熟度评级是对引用证据的定性综合；不代表任何数值概率或损失估计。
