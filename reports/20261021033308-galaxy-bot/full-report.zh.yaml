  - id: TV002
    title: 正论与反论
    columns:
      - 立场
      - 论点
      - 哪些信息会改变判断
    rows:
      - - 正论
        - 据报道，Galbot S1 已在 CATL 部署，用于自主搬运和拣选。
        - 客户签署的正常运行时间、人工干预、吞吐量、安全和付费扩张数据将增强这一说法。
      - - 正论
        - 据报道，RMB2.5 billion 融资和超过 $3 billion 的估值表明投资者支持力度较大。
        - 要把融资额转化为现金跑道判断，还需要完全摊薄条款、投资者权利、剩余现金和资金用途证据。
      - - 反论
        - 中国人形机器人供应量和模型数量都很高，但经过验证的买方需求和自主使用场景仍受限。
        - 非关联客户以已披露经济性重复下单，将降低商业化风险。
      - - 反论
        - 行业成本和现场效率仍不足以支撑广泛商业化。
        - 若有证据表明交付成本低于替代人工阈值，且服务负担可接受，投资逻辑会改善。
    notes: 部署细节由 CNEVPost 转述 CATL 的表述；融资数字是报道值，而非经审计的现金或完全摊薄估值证据。
