          - type: paragraph
            body: >-
              目前最明显的缓解措施，是与大型制造商开展结构化工业部署，并已宣布接入该伙伴的服务网络。但这不能解决需求广度、安全治理、可靠性或经济性。管理层应提供车队月度运行时间、自主任务完成率、每运行小时人工干预次数、平均故障间隔、现场服务成本、按部署计算的毛利率、应收账款账龄和客户集中度。生产部署停滞、反复发生安全关键事故、无法在没有合格替代品时获得必要计算资源、失去
              CATL 服务支持，或规模扩大后单位经济性仍不改善，都应触发论点破坏。竞争集中度也很关键：TrendForce 预计 Unitree 和 AgiBot 将拿下 2026 年出货量近 80%，这会增加 Galbot
              融资和估值跑在商业份额之前的风险。
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR008
              - CR011
              - CR014
              - CR016
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 决策关键证据缺口
            body: 不要把指定证据池中没有公开事故或法律记录视为不存在；安全、合规、诉讼和车队事故尽调仍不可缺少。
            calloutType: risk
            claimRefs:
              - CR004
              - CR007
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              建议是继续研究，而不是买入或放弃。CNBC 报道 Galbot 2026 年 4 月私有估值超过 $3 billion，CNEVPost 报道 3 月宣布 RMB2.5 billion（$368
              million）融资。这些估值显示公司能获得资本和投资人需求，但都不能确定完全摊薄口径的企业价值、最新证券附带的优先权，或当前经营倍数。审阅的公开记录没有 Galbot
              收入、毛利率、现金消耗、订单积压、客户集中度或单位经济性披露。没有这些分母，公允价值区间或目标回报都会是虚假精确。因此，入场应以取得一手数据室、合同级部署证明和融资条款审阅为条件。
            claimRefs:
              - CV001
              - CV004
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV008
              - CV009
              - CV014
              - CV016
      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              正面论点并非纯粹宣传：CNEVPost 报道 Galbot S1 进入 CATL
              智能产线，执行长期自主物料搬运和拣选。这是具有战略意义的客户环境，比阶段性演示更有说服力。反论点是，行业供给增长快于经核实的需求。Associated Press 报道 2025 年中国有超过 140
              家人形机器人制造商和超过 330 个型号，且用例有限；MERICS 将多数部署描述为有限任务和特定场地试验。Robotics & Automation News
              主页摘要也把从演示、试点走向工厂描述为制造规模挑战。因此，Galbot 有技术和伙伴进展证据，但尚无公开证据证明商业经济性可重复。
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV005
              - CV008
              - CV009
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: 可比公司与情景逻辑
        blocks:
          - type: paragraph
            body: >-
              私有同业估值只能作为情绪参考。CNBC 将 Figure 估值置于至少 $39 billion、Apptronik 为 $5 billion、Galbot 超过 $3 billion、AI2 Robotics 约
              $2.93 billion，同时报道美国人形机器人初创公司被视为广义 AI 平台，中国公司则更多被视为工业硬件企业。这些价格没有对证券权利或经营成熟度做标准化。UBTECH 提供了更具体的运营参照，因为其
              2025 年申报文件披露收入 RMB2.001 billion、全尺寸实体人形产品和服务收入 RMB820.6 million、37.7% 毛利率及 RMB789.8 million
              会计亏损。但这仍是竞争对手申报文件，不是独立估值基准；其多元化产品组合也不适合直接套用倍数。
            claimRefs:
              - CV002
              - CV003
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
              - CV016
      - number: '8.4'
        title: 退出准备度、尽调要求与论点破坏
        blocks:
          - type: paragraph
            body: >-
              仅凭指定公开证据无法确定退出准备度。融资估值不等于流动性，已募集资金也不等于可用现金；审阅来源没有 Galbot IPO
              时间表、二级市场条款、经审计财务历史或收购先例。关键尽调要求包括带清算优先权的完全摊薄股权结构表、经审计收入和现金流报表、已签署客户合同、车队运行时间和干预日志、保修及服务成本，以及从部署到毛利的桥接。论点破坏触发条件是可量化的：无法把
              CATL 相关工作转化为付费的重复部署、经济性长期高于可行的人工替代水平、依赖补贴或国资关联需求，或融资轮次低于当前估值。在这些问题验证前，下行无法界定，上行也无法转化为目标回报。
            claimRefs:
              - CV005
              - CV007
              - CV009
              - CV013
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 不要把融资势头误当成价格支撑
            body: 证据支持继续尽调，而不是按某个价格承诺投资。超过 $3 billion 的私有估值和大额融资证明投资人兴趣，但经营数据和证券权利数据缺失，无法建立可辩护的回报模型。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV016
          - type: callout
            title: 公开可比公司仍在亏损
            body: UBTECH 申报文件显示，可量化的人形机器人收入可以与巨额会计亏损及现金消耗并存；在把同业热情转化为价值前，应取得 Galbot 特定的利润率、消耗和资本需求。
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV013
