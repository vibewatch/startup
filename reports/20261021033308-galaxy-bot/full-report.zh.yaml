  summary: >-
    Galaxy Bot 于 2023 年由 He Wang 创立，是一家以 Galbot 品牌运营的中国私人实体 AI 机器人公司。其公开产品路线将任务专用的视觉—语言—动作模型与移动操作硬件结合，已披露的商业化最强证据是在 CATL
    生产线上部署 S1。公开报道显示公司融资规模可观、估值超过 $3 billion，但未能核对累计融资总额，也未披露收入、利润率、现金消耗、客户集中度、车队可靠性或融资权利。
