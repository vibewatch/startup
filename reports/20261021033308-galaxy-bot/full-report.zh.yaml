  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 商业验证领先于财务披露
        blocks:
          - type: paragraph
            body: >-
              最强的公开商业信号是运营而非财务：CnEVPost 报道 Galbot S1 已进入 CATL 生产线，执行物料搬运和拣选工作。同一报道称双方计划把 CATL
              售后体系延伸至实体智能机器人，说明部署、维护和全生命周期支持都可能影响经济模型。但这两点都不能确认 Galbot
              是销售硬件、出租产能、收取集成费、获得经常性服务费，还是只在验收后确认收入。指定证据也没有合同金额、实际单价、客户集中度、收入、ARR 或毛利率。因而，CATL
              只能证明产品被使用，不能证明收入有实质规模或单位经济性有吸引力。投资判断应把工厂里摆放的机器人，与已付费、已验收、可收款且支持负担明确的部署区分开。
            claimRefs:
              - CI001
              - CI002
