            body: >-
              CnEVPost 报道 2026 年 3 月融资 CNY 2.5 billion（USD 368 million），CNBC 报道估值超过 USD 3
              billion。这些是融资和估值观察，不是当前可用现金、经营现金消耗、债务义务或现金跑道的衡量。成本基础可能包括机器人硬件、模型训练、现场集成、维护和营运资金，但指定证据未披露金额。UBTECH
              提供了有用的上市公司边界：其 2025 年人形机器人收入增长强劲、毛利率提高，但仍亏损且经营活动使用现金。UBTECH
              还披露产品收入按某一时点确认，未交付或未验收项目会递延收入，说明交付验收和回款时点是核心尽调问题。这些同业数据不能估算 Galbot 的消耗或跑道。
