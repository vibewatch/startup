      - number: '5.3'
        title: 部署成熟度、可靠性与支持
        blocks:
          - type: paragraph
            body: >-
              CATL 是证据池中最强的已点名部署信号。CnEVPost 报道 S1 在模组和电池包生产中长期自主作业，并转述 CATL 关于八小时电池续航的说法；双方还计划把 CATL Ning Service
              网络从电池检查和维护扩展到实体智能机器人。这说明部署设计考虑了能源和现场服务，而不只是机器人能力。但这不能证明运行时间、平均故障间隔、远程协助负担、备件可得性，或服务经济性能够复制到 CATL 之外。UBTECH
              2025 年申报文件提供了有用的竞争对照：其将量产与预防性设计、制造工艺控制、模块测试和整机测试联系起来。现有证据未披露 Galbot 有可比控制，因此技术成熟度应按已证明的部署可见度保守评估。
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: 信任、安全、标准与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              安全和质量保证是证据最薄弱的一层。ISO 解释标准为可靠性和信任设定一致基准，但现有来源没有 Galbot
              特定的证书、合规评估、正式安全测试、状态历史或事故登记。这是证据缺口，不是事故或控制不存在的证据。MERICS 还提醒，中国人形机器人整体仍受精度和灵巧性限制，通常部署在受约束、特定场地；这属于行业基准，不是对
              Galbot 的直接失败结论。指定来源没有提供代码库活动、版本发布、包下载、API
              文档或可信的开发者社区代理，因此无法评分开发者采用度和软件运营节奏。尽调应在赋予生产级成熟度前，索取认证范围、危险分析、故障安全行为、渗透测试摘要、隐私和训练数据治理、现场事故、运行时间、干预日志及版本化路线图。
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
