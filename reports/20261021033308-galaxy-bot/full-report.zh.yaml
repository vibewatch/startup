            body: >-
              可见架构结合了任务级 VLA 策略、合成抓取数据、Nvidia 仿真和边缘计算工具，以及移动操作平台。MERICS 报道 Galbot 的 DexGraspNet 是使用 Nvidia Isaac Sim
              构建的模拟抓取数据集，Galbot 也是较早获得 Jetson Thor
              模块的公司之一。这为灵巧操作带来可能的数据和迭代优势，同时也在仿真和计算两层形成外部依赖。架构仍只能部分观察：现有来源未披露模型评估协议、数据权利控制、端侧与云端边界、故障回退、车队编排或版本发布管理。因此，架构图是有证据支撑的尽调模型，并不声称所列层级复现了
