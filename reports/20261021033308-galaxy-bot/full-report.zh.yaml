      - number: '4.4'
        title: 财务结论与投资判断阻碍
        blocks:
          - type: paragraph
            body: >-
              Galbot
              具备可信的部署和融资信号，但现有证据不足以判断收入质量、利润率或资本充足性。行业证据偏不利：买方仍有限，中国已报道的需求很大部分来自国有企业，独立分析师称当前机器人广泛部署的成本过高。因此，投资逻辑取决于把参考部署转化为可重复的付费单元，同时在价格下降时控制安装和售后人工。在作出投资判断前，投资人需要客户级开票和回款、合同与验收条款、硬件及服务毛利率、保修和现场支持成本、库存及应收账款账龄、月度经营现金使用、非受限现金、债务、已承诺资本开支以及下一轮融资触发条件。在这些记录交付前，财务画像应视为高度不确定且依赖融资，而不是已证明的规模经济。
