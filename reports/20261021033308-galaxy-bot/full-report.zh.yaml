  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Galbot 的公开产品更适合被理解为两个相关但尚未证明通用的运营边界，而不是一台已验证的通用机器人。MERICS 通过三个狭窄的视觉—语言—动作模型描述 G1：GraspVLA 负责手部操作，TrackVLA
              负责导航，GroceryVLA 面向零售。这种拆分支持智能优先路线，也表明自主能力仍局限于受限工作。S1 则提供更重型的工业能力：CnEVPost 报道其具备 50-kilogram 双臂负载，并在 CATL
              电池生产线上执行物料搬运和拣选。这些来源证明了明确的工作流和已部署硬件，但没有公开任务成功率、干预频率、循环时间分布或客户
              ROI。因此，产品尽调应把现有验证视为任务专用部署证据，而不是证明一个模型能可靠跨越零售、制造和医疗场景。
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE009
