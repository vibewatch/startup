      - number: '4.2'
        title: 行业价格意味着更高的 ROI 门槛
        blocks:
          - type: paragraph
            body: >-
              公开价格证据适用于行业，但不适用于 Galbot。Associated Press 报道 Matrix Robotics MATRIX-3 约为 USD 99,000，基础款 EngineAI 人形机器人为
              CNY 180,000（USD 26,600）。MERICS 将中国人形机器人平均价格置于 CNY 300,000-500,000，并以年度人工成本 CNY 80,000 和两年 ROI 周期为基础，引用 CNY
              160,000 的商业可行性门槛。这些数字对应不同产品、配置和证据时点，因此只能定义价格区间，不能代表 Galbot 价格。MERICS 和 Morgan Stanley
              都预计广泛采用前会大幅降价，这将挤压利润：Galbot 必须至少以与市场价格下降同样快的速度降低物料、安装、可靠性和支持成本。软件 AI 使用模式明确不能作为这种硬件加服务成本结构的代理。
