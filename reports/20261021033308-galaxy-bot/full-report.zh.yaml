              还报道中美紧张和国家安全审查已令跨境投资降温。即使没有针对公司的执法行动，这些条件也可能限制计算资源、融资来源、海外客户和退出选择。投资文件应要求按司法辖区编制的合规矩阵、安全测试文件、事故日志、数据治理架构和供应商替代计划，之后再视为风险已缓解。
