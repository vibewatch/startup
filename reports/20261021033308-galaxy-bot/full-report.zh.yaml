chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Galaxy Bot 成立于 2023 年，公开品牌为 Galbot。现有证据支持其采取覆盖基础模型和机器人硬件的实体 AI 路线，服务零售和工业任务，而非纯软件业务。Galbot
              官网强调由高层推理、底层控制和神经控制组成的一体化模型；独立的 MERICS 分析则将其 GraspVLA、TrackVLA 和 GroceryVLA 描述为职责范围较窄的目标系统。Multiples
              将公司列为私人持有，并把总部写为 Beijing，但其自有介绍又称公司总部在 Shenzhen。因此，Beijing 应视为工作地点，而不是已经完全核对的法定总部事实。公司在 2026 年 9
              月宣布新型原生智能体机器人的预订，说明产品仍在推进，但不能据此确认出货量、定价或收入。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              独立报道一致将 He Wang 认定为创始人，并将其与北京大学联系起来；Robotics & Automation News 还称其接受过 Stanford 训练。这一组合显示其在机器人学习和实体 AI
              领域具备可信的创始人与市场匹配度，但指定证据未披露更完整的现任高管团队、董事会构成、独立董事、投票结构或继任安排。因此，尽调应关注明显的关键人集中：公开叙事聚焦一名技术创始人，职能领导层却不可见。这并不证明其他领导人或治理机制不存在，而是说明证据存在边界；在评估治理质量前，需要当前组织架构、董事名册、股权结构表和关键人连续性方案。
            claimRefs:
              - CO001
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO006
      - number: '1.3'
        title: 融资形成与利益相关方集中度
        blocks:
          - type: paragraph
            body: >-
              融资记录显示资本积累迅速，但内部及跨来源存在不一致，无法得出可辩护的累计融资额。Robotics & Automation News 将 2025 年 6 月融资报为 $151 million，Multiples
              报为 $153 million；差异可能来自换算或四舍五入，但这里保留差异而未统一。Multiples 报道 2025 年 12 月以 $3 billion 估值完成 $300 million 轮融资，CNBC
              随后称 Galbot 估值超过 $3 billion。2026 年 3 月据报道融资 RMB2.5 billion，美元换算约为 $350 million 至 $368
              million。更重要的是，Multiples 在同一页面既称五轮合计 $619 million，又在其他位置称 2025 年 12 月、即 3 月融资前已达 $800
              million。因此，融资额不应视为可用现金，也不能根据投资人参与情况推断所有权或控制权。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
          - type: table
            tableRef: TO003
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO012
              - CO013
      - number: '1.4'
        title: 里程碑与商业化证据
        blocks:
          - type: paragraph
            body: >-
              公司层面最强的部署证据，是 CATL 据报道将 Galbot S1
              放入模组和电池包生产，用于长期自主物料搬运和拣选。更早报道还提到北京十家无人便利店试点及覆盖一百家门店的计划，但该计划不应视为已实现部署。这些信号有意义，但行业证据不支持从试点外推到广泛商业成熟。MERICS
              称中国人形机器人仍受精度、灵巧性、任务范围狭窄和成本限制；Associated Press 报道则指出需求可能落后于制造能力。作为上市公司基准而非 Galaxy Bot 指标，UBTECH 报告 1,079
              台全尺寸实体智能机器人及相关 2025 年收入 RMB820.6 million。指定证据中，Galaxy Bot 未披露可比的审计单元数、收入、利润率、事故或留存序列。
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO005
              - CO007
              - CO008
              - CO009
              - CO012
              - CO013
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 工业验证点已超越演示
            body: CATL 据报道在模组和电池包生产中使用 Galbot S1，这是 Galaxy Bot 已走出阶段性演示的最清晰证据；但合同金额、付费单元数、运行时间和部署集中度仍未披露。
            calloutType: strength
            claimRefs:
              - CO012
          - type: callout
            title: 资本规模比经营规模更清晰
            body: 融资和估值披露很多，但现有证据没有给出可核对的融资总额、Galaxy Bot 审计收入、毛利率、现金消耗、员工数、客户数或安全事故历史。
            calloutType: risk
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资边界并不是整个机器人或人工智能市场。Galaxy Bot 近期相关市场包括随部署和支持销售的实体 AI
              人形机器人及移动操作系统，服务受限的工业、物流、零售、医疗和研究流程。传统固定式工业机器人、机械臂、自动导引车和人工劳动仍是主要替代方案。这一区分很重要：2025
              年中国生产的传统工业机器人远多于人形机器人，许多工厂无需人形外观也已实现重复性工作的自动化。家庭消费照护应视为相邻市场，而不是当前可服务市场，因为现有证据仍描述了昂贵、脆弱且依赖结构化环境的系统。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM010
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
              - CM012
              - CM014
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              现有证据不足以支持清晰的 TAM/SAM/SOM 计算。不同出版方和时间范围混用了产量、出货量、公司销售额、收入和长期预测。因此，目前最有用的锚点是采用速度：MERICS 报告 2025 年中国生产了
              12,800 台人形机器人，Associated Press 报道全球出货超过 13,000 台，其中约 85% 来自中国。Morgan Stanley 对 2026 年中国约 28,000
              台的预测显示增长很快，但其引用的 $5 trillion 市场估计在抓取文本中没有时间范围。UBTECH 经审计的 1,079 台和 2025 年收入 RMB820.6 million
              证明商业收入可以有实质规模，但不能据此确定 Galaxy Bot 可获得的份额。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM008
              - CM015
      - number: '2.3'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              工业买方最容易从试点走向持续部署。工厂自动化和运营负责人可以为物料搬运、拣选、分拣、检查及其他重复或危险任务采购系统，产线工人和维护团队则是日常用户。CATL 据报道使用 Galbot S1
              进行产线搬运和拣选，是具体的工作流信号；TechNode 报道 Galbot
              声称累计工业订单达数千笔。物流、研究、零售和医疗扩大了机会空间，但预算负责人和验收标准各不相同。因此，每笔销售都需要现场集成、安全验证、服务覆盖，以及相对于人工或成熟自动化方案的 ROI
              论证，而不能只依赖对人形机器人的笼统兴趣。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM014
      - number: '2.4'
        title: 驱动因素、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              中国密集的机器人和电动车供应链、政策支持及庞大的工厂基础，应该会加快零部件国产化、训练数据收集和部署学习。MERICS 估计，2024 年中国企业占全球人形机器人关键零部件供应链主要企业的
              63%，并供应了中国工业机器人市场的 57%。制约因素在经济性和技术性两端：MERICS 引用中国人形机器人典型价格 CNY300,000-500,000，而商业可行性门槛为
              CNY160,000；独立报道则描述了有限用例、脆弱运行和需求落后于制造能力。依赖 Nvidia
              的训练和边缘计算生态，也会增加地缘政治及供应风险。因此，估值应奖励已验证的部署和任务级经济性，而不能只奖励宏观市场预测。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 大额预测不等于可获得市场
            body: 证据没有披露 Galaxy Bot 的价格、部署收入、续约经济性、客户集中度或任务级回本周期。在这些输入可得之前，计算公司特定的 SAM 或 SOM 都属于虚假精确。
            calloutType: risk
            claimRefs:
              - CM008
              - CM011
              - CM013
              - CM014
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争拥挤，竞争形式不止一种
        blocks:
          - type: paragraph
            body: >-
              买方的选择集不只包括人形机器人初创公司。中国直接同业包括 UBTECH、Unitree、AgiBot、AI2 Robotics、Matrix Robotics 和
              EngineAI；Figure、Apptronik
              等美国进入者则争夺资本、软件人才和跨国工厂项目。固定机械臂、输送线和专用自动化仍是最强的既有替代方案，因为许多工厂已用它们处理重复任务。内部整合第三方机器人本体与软件，也是硬件变得更便宜、更模块化后的可行替代方案。行业高度分散：Associated
              Press 报道 2025 年中国有超过 140 家人形机器人制造商和超过 330 个型号。出货领先者在别处，AgiBot 和 Unitree 据报道 2025 年各自超过 5,000 台，而 Figure 和
              Tesla 仅出货几百台或更少。Galbot 据报道有 $1.1 billion 已披露融资和超过 $3 billion 估值，具备持续投入的资本实力，但这两个指标都不能证明相当的商业规模。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP010
              - CP011
              - CP012
      - number: '3.2'
        title: 软件野心构成 Galbot 的差异化，但同业拥有更可见的规模
        blocks:
          - type: paragraph
            body: >-
              Galbot 最清晰的差异化，是面向自主移动操作的智能优先架构。MERICS 识别出独立的 GraspVLA、TrackVLA 和 GroceryVLA 模型，并指出 Galbot
              偏好合成训练数据。这种专业化对零售拣选和导航有意义，但也说明当前自主能力仍局限于受限任务。UBTECH 提供了最强的已披露工业商业化证据：其申报文件披露 Walker S2 量产、截至 2025
              年末年化全尺寸产能超过 6,000 台，以及人形机器人收入 RMB820.6 million。Unitree 和 AgiBot 在报道出货量上领先，Figure
              则以高得多的估值维持软件平台叙事。因此，这张图区分的是可见部署规模和自主化取向，是有证据支撑的序数比较，而不是性能基准。
            claimRefs:
              - CP003
              - CP005
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP012
              - CP013
              - CP014
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP007
              - CP012
              - CP016
      - number: '3.3'
        title: 价格压力已显现，但 Galbot 商业条款仍不透明
        blocks:
          - type: paragraph
            body: >-
              公开证据没有披露 Galbot 的标价、实际成交价、合同期限、服务费或折扣。现有市场锚点仍指向加剧的价格压力：MERICS 将中国工业人形机器人平均价格置于 RMB300,000-RMB500,000，并引用
              CNY160,000 的商业可行性门槛，而 Unitree G1 明显低于该均值。Galbot 可能通过任务表现和渠道抵消价格压力。其与 CATL 的关系使 S1 进入电池生产线，并可能接入 CATL
              售后服务网络，这或许构成重要的部署和支持优势。信任要求也正从可选项变成结构性要求：中国新的机器人识别制度实行无代码、无市场准入规则及全生命周期可追溯。这会提高合规成本，但可能偏向制造和服务伙伴成熟的供应商。
            claimRefs:
              - CP008
              - CP009
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP015
      - number: '3.4'
        title: 护城河取决于尚未公开的部署数据和经济性
        blocks:
          - type: paragraph
            body: >-
              Galbot
              可能从零售和工业部署中建立学习闭环，但公开证据没有量化车队规模、任务成功率、运行时间、人工干预率或客户留存。中国供应商已控制大量零部件生态和国内机器人市场，降低了硬件稀缺性作为持久护城河的价值。同时，依赖
              Nvidia 机器人技术栈和进口高端零部件，限制了全栈控制。独立报道对行业经济性持不利判断：MERICS 称当前人形机器人仍是场景专用且过于昂贵，Associated Press
              则报道买方可以继续使用固定式自动化，且许多订单来自国有企业。因此，Galbot 的防御力取决于证明更高的任务级 ROI，并比规模化同业更快积累专有部署数据，而不是融资、估值或单一锚定合作伙伴。
            claimRefs:
              - CP006
              - CP007
              - CP015
              - CP016
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 商业护城河仍未验证
            body: 现有来源没有披露 Galbot 的实际定价、车队运行时间、干预率、留存、切换成本或客户集中度；要区分持久学习闭环和融资支持的试点活动，必须取得这些数据。
            calloutType: risk
            claimRefs:
              - CP013
