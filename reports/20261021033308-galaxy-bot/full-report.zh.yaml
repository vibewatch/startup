              网络也预计扩展到实体机器人售后支持。这能降低现场服务摩擦，但也使部署可信度和支持能力部分依赖一个战略投资人兼客户生态。技术集中度更广：MERICS 报道公司依赖 Nvidia
              软件和芯片，以及德国和日本的精密零部件供应商。监控时应区分 Galbot
