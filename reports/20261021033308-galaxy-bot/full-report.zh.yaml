        title: 风险排序
        blocks:
          - type: paragraph
            body: >-
              商业化和执行是剩余风险中最高的部分。独立报道称人形机器人供给能力可能领先于买方需求，机器人仍昂贵、脆弱且依赖高度结构化环境。MERICS
              另称中国人形机器人仍缺乏精度和灵巧性，通常局限于有限任务或特定场地试验。这些发现直接关系到 Galbot：成功的 CATL
              部署证明其能进入高要求工业环境，却不能证明跨客户或非结构化工作流的经济性可复制。因此，投资逻辑应建立在已测量的任务成功率、干预频率、运行时间、部署成本和续约或扩张证据上，而不是订单公告或技术演示。UBTECH
              的结果也强化了财务风险：其 2025 年人形机器人收入大增但仍亏损，说明行业商业化可以先于经营自立。
