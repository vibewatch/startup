  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 证据从市场机会、部署证明和经济性缺口逐步指向继续研究的决策。
    data:
      nodes:
        - id: market
          label: 政策支持的大市场
          detail: 中国拥有制造规模和国家支持，但行业仍处于早期。
        - id: price
          label: 据报道 Galbot 估值 $3B+
          detail: 这一非上市估值是融资参考值，而非公开市场价格。
        - id: proof
          label: CATL 部署信号
          detail: 据报道，Galbot S1 长期执行生产线搬运和拣选作业。
        - id: economics
          label: 财务分母缺失
          detail: 收入、利润率、现金消耗、签约车队经济性和股权结构表条款均不可得。
        - id: risk
          label: 商业化和稀释风险
          detail: 需求、降本、服务负担和未来融资可能实质性改变结果。
        - id: decision
          label: 继续研究
          detail: 在确定入场价格前，要求一手财务、合同、车队和证券条款证据。
      edges:
        - from: market
          to: price
        - from: price
          to: proof
        - from: proof
          to: economics
        - from: economics
          to: risk
        - from: risk
          to: decision
    approximationNotes: 该顺序只表达决策依赖关系；不对概率、企业价值或预期回报作量化。
    claimRefs:
      - CV003
      - CV005
      - CV008
      - CV009
      - CV014
      - CV015
      - CV016
