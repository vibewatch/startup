  - id: TV003
    title: 乐观、基准和悲观情景框架
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - CATL 部署扩展为重复付费车队；单位成本下降；正常运行时间和服务经济性验证了工业规模化使用。
        - 当前超过 $3 billion 的估值可能变得合理，但没有公开的终值区间或目标回报可供计算。
        - 执行、客户集中度、安全和资本密集度。
        - 只有审计确认增长、重复订单和按客户队列拆分的车队经济性后，才算正面信号。
      - - 基准
        - Galbot 仍是可信的技术竞争者，拥有选择性部署，但经营披露仍然有限。
        - 应跟踪而不是定价；由于收入和利润率分母不可得，当前估值仍偏高。
        - 商业化周期长、融资稀释和不透明的优先权安排。
        - 当前公开证据最接近支持这一情景。
      - - 悲观
        - 需求仍由试点或补贴驱动，降本停滞，或下一轮融资定价低于当前估值。
        - 根据公开证据，下行空间没有上限；非上市股份缺乏流动性，加上优先权悬垂，可能放大损失。
        - 下轮降价融资、退出市场疲软、集中度和持续现金需求。
        - 续约失败、自主运行时长有限或融资条款恶化时触发。
    notes: 这些情景是条件式框架而非预测；由于 Galbot 的财务报表和证券条款不可得，估值区间和概率有意不作量化。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV013
      - CV016
