      - ["Assurance", "Standards provide a framework for reliability and trust", "Certification and conformity-assessment evidence", "No Galbot-specific certificate or formal test result in the retained pool"]
    notes: >-
      This is a source-bounded diligence decomposition, not a disclosed internal architecture;
      undisclosed implementation details are intentionally left as dependencies or risks.
    claimRefs: [CE003, CE004, CE006, CE007, CE008, CE011, CE012]
