      - ["Training data", "DexGraspNet supplies simulated grasp examples", "Nvidia Isaac Sim", "Simulation-to-reality performance is undisclosed"]
      - ["Edge compute", "Jetson Thor is an identified robotics compute input", "Nvidia hardware and software ecosystem", "Supply, export-control, and roadmap dependence"]
      - ["Perception and motion", "Vision-only positioning and obstacle avoidance are reported for S1", "Undisclosed cameras, calibration, and control stack", "No published degraded-mode or fail-safe evidence"]
