  evidenceGaps:
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: >-
        A public repository, package registry, API or integration forum, engineering talk, or
        practitioner-community metric attributable to Galbot.
      whyItMatters: >-
        Without a developer or practitioner signal, software release cadence, ecosystem adoption,
        integration burden, and external technical scrutiny cannot be assessed.
      diligencePath: >-
        Request the maintained repository and package inventory, release notes, API documentation,
        integration-partner references, and anonymized developer-support metrics.
      relatedQuestionRefs: [QE008]
    - type: private-evidence-only
      severity: material
      topic: safety-evidence
      missingEvidence: >-
        Galbot-specific certification scope, hazard analyses, fail-safe tests, security assessments,
        privacy controls, reliability logs, and incident or recall history.
      whyItMatters: >-
        Robots operating around workers and customers create physical, operational, data, and
        compliance risk that cannot be underwritten from deployment announcements alone.
      diligencePath: >-
        Review certificates and underlying test reports, FMEA and hazard logs, penetration-test
        summaries, privacy impact assessments, uptime and intervention data, and the incident register.
      relatedQuestionRefs: [QE006]
    - type: private-evidence-only
      severity: material
      topic: deployment
      missingEvidence: >-
        Task-success rates, intervention frequency, uptime, cycle-time distributions, service cost,
        spare-parts lead times, and customer ROI for each deployed workflow.
      whyItMatters: >-
        Named deployment and payload specifications do not establish repeatable performance,
        reliability, support economics, or scalable customer value.
      diligencePath: >-
        Obtain twelve months of site-level telemetry and service records for CATL and at least two
        unrelated deployments, normalized by task, shift, payload, and environmental conditions.
      relatedQuestionRefs: [QE004, QE007]
