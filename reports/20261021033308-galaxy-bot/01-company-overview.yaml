  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: >-
        Current executive roster, board composition, voting rights, succession plan, and
        founder ownership are absent from the assigned public evidence.
      whyItMatters: >-
        Governance quality, key-person exposure, and investor control cannot be assessed from
        the founder profile alone.
      diligencePath: >-
        Obtain a signed organization chart, board register and minutes, current cap table,
        shareholder agreement, and key-person continuity plan.
      relatedQuestionRefs: [QO003]
      relatedTableRefs: [TO002, TO003]
    - type: missing-source
      severity: material
      topic: cover-metrics
      missingEvidence: >-
        Audited Galaxy Bot revenue, gross margin, cash burn, cash balance, headcount, active
        customer count, paid-unit count, geographic site count, and service staffing are unavailable.
      whyItMatters: >-
        Financing and pilot announcements cannot establish operating scale, capital efficiency,
        customer concentration, or runway.
      diligencePath: >-
        Request audited financial statements, monthly management accounts, payroll roster,
        customer and site ledger, shipment acceptance records, and cash reconciliation.
      relatedQuestionRefs: [QO005]
      relatedTableRefs: [TO001]
    - type: conflicting-data
      severity: material
      topic: funding
      missingEvidence: >-
        Retained sources do not reconcile the $619 million and $800 million cumulative-funding
        figures or consistently convert the March 2026 RMB2.5 billion round.
      whyItMatters: >-
        An incorrect cumulative total would distort dilution, capital-efficiency, and liquidity
        analysis, while funding raised still would not equal cash available.
      diligencePath: >-
        Reconstruct every financing from primary closing documents, bank receipts, currency
        dates, secondary components, debt instruments, and post-money cap tables.
      relatedQuestionRefs: [QO004, QO005]
      relatedTableRefs: [TO001, TO003]
    - type: missing-source
      severity: material
      topic: safety-and-compliance
      missingEvidence: >-
        The assigned evidence contains no company-specific safety-incident log, certifications,
        product-liability history, regulatory correspondence, or independently measured uptime.
      whyItMatters: >-
        Physical deployment in factories and public environments creates safety, reliability,
        and liability exposure that deployment announcements do not quantify.
      diligencePath: >-
        Obtain incident and near-miss registers, certification packages, insurer loss runs,
        customer acceptance tests, uptime logs, and regulator correspondence.
      relatedQuestionRefs: [QO007, QO008]
