artifact: company-overview
slug: galaxy-bot
runDate: 2026-10-21
company:
  name: Galaxy Bot
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Galaxy Bot, also branded Galbot, is a privately held Chinese embodied-AI robotics
    company founded in 2023 whose strongest disclosed operating evidence is a Galbot S1
    deployment on CATL production lines. Capital formation is substantial but not cleanly
    reconcilable, while leadership breadth, revenue, headcount, customer count, and governance
    remain material diligence gaps.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Galaxy Bot was founded in 2023 and is publicly branded as Galbot. The retained
      evidence supports an embodied-AI strategy spanning foundation models and robot
      hardware for retail and industrial tasks, rather than a pure software business.
      Galbot's own site emphasizes an integrated model spanning high-level reasoning,
      lower-level control, and neural control, while independent MERICS analysis describes
      its GraspVLA, TrackVLA, and GroceryVLA models as targeted systems with narrow remits.
      Multiples classifies the company as privately held and gives Beijing as its headquarters,
      but its own introductory narrative calls the company Shenzhen-headquartered. Beijing
      should therefore be treated as the working location, not a fully reconciled legal
      headquarters fact. The company announced bookings for a new native-agent robot in
      September 2026, demonstrating continued product activity without establishing shipment
      volume, pricing, or revenue.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Independent coverage consistently identifies He Wang as founder and ties him to Peking
      University; Robotics & Automation News additionally describes him as Stanford-trained.
      That combination offers credible founder-market fit in robot learning and embodied AI,
      but the assigned evidence does not identify a broader current executive team, board
      composition, independent directors, voting structure, or succession arrangements.
      The resulting diligence posture is one of apparent key-person concentration: the public
      narrative is anchored on one technical founder while functional leadership coverage is
      not visible. This is not evidence that other leaders or governance mechanisms do not
      exist. It is an evidence boundary that requires a current organization chart, board
      register, cap table, and key-person continuity plan before underwriting governance
      quality.
    claimRefs: [CO001, CO006]
    tableRefs: [TO002]
  - id: capital-and-stakeholders
    title: Capital formation and stakeholder concentration
    body: >-
      The financing record indicates rapid capital accumulation but contains internal and
      cross-source inconsistencies that prevent a defensible total-raised figure. The June
      2025 financing is reported as $151 million by Robotics & Automation News and $153
      million by Multiples, a difference consistent with conversion or rounding but retained
      rather than normalized. Multiples reports a $300 million December 2025 round at a
      $3 billion valuation, and CNBC later described Galbot as carrying a $3 billion-plus
      valuation. A March 2026 round was reported at RMB2.5 billion, with dollar conversions
      ranging from roughly $350 million to $368 million. More importantly, Multiples states
      both $619 million across five rounds and, elsewhere on the same page, $800 million by
      December 2025 before the March financing. Funding raised is therefore not presented as
      cash available, and ownership or control cannot be inferred from investor participation.
    claimRefs: [CO007, CO008, CO009, CO010, CO011]
    tableRefs: [TO003]
  - id: milestones-and-commercial-evidence
    title: Milestones and commercialization evidence
    body: >-
      The strongest company-specific deployment evidence is CATL's reported placement of the
      Galbot S1 into module and battery-pack production for long-running autonomous material
      handling and picking. Earlier reporting also described ten unmanned convenience-store
      pilots in Beijing and a plan to reach one hundred stores, but that forward plan is not
      treated as an achieved deployment. These signals are meaningful, yet sector evidence
      argues against extrapolating from pilots to broad commercial maturity. MERICS says
      Chinese humanoids remain constrained by precision, dexterity, narrow task scope, and
      cost, while Associated Press reporting found that demand may lag manufacturing capacity.
      As a public-company benchmark rather than a Galaxy Bot metric, UBTECH reported 1,079
      full-size embodied-intelligence robot units and RMB820.6 million of associated 2025
      revenue. Galaxy Bot discloses no comparable audited unit, revenue, margin, incident, or
      retention series in the assigned evidence.
    claimRefs: [CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
