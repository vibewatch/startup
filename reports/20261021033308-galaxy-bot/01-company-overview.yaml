callouts:
  - calloutType: strength
    title: Industrial proof point exceeds a demonstration
    body: >-
      CATL's reported use of Galbot S1 in module and battery-pack production is the clearest
      evidence that Galaxy Bot has progressed beyond staged demonstrations, although contract
      value, paid-unit count, uptime, and deployment concentration remain undisclosed.
    claimRefs: [CO012]
  - calloutType: risk
    title: Capital scale is clearer than operating scale
    body: >-
      Financing and valuation disclosures are abundant, but the retained evidence does not
      provide reconciled total funding, audited Galaxy Bot revenue, gross margin, cash burn,
      headcount, customer count, or safety-incident history.
    claimRefs: [CO008, CO009, CO010, CO011]
