chapter:
  number: 7
  title: Risks
  summary: >-
    Galaxy Bot's principal underwriting risks are commercialization depth, robot reliability outside structured settings,
    dependence on foreign compute and precision components, and concentration around strategic deployment partners.
    Current evidence shows a meaningful CATL production-line foothold, but public evidence does not establish Galbot's
    safety certifications, incident history, unit economics, customer concentration, or cash-consumption profile.
sections:
  - id: ranked-risk-posture
    title: Ranked risk posture
    body: >-
      Commercialization and execution are the highest residual risks. Independent reporting says humanoid supply capacity
      may be running ahead of buyer demand and that robots remain expensive, fragile, and dependent on highly structured
      environments. MERICS separately finds that Chinese humanoids still lack precision and dexterity and are generally
      confined to limited tasks or site-specific trials. Those findings matter directly to Galbot because a successful CATL
      deployment proves access to a demanding industrial setting, not repeatable economics across customers or unstructured
      workflows. The investment case should therefore be conditioned on measured task success, intervention frequency,
      uptime, deployment cost, and renewal or expansion evidence rather than order announcements or technical demonstrations.
      Peer results reinforce the financial risk: UBTECH grew humanoid revenue sharply in 2025 yet remained loss-making, so
      sector commercialization can scale before operating self-sufficiency is achieved.
    claimRefs: [CR001, CR002, CR003, CR007, CR012, CR013, CR015, CR016]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: regulatory-legal-and-geopolitical
    title: Regulatory, legal, and geopolitical exposure
    body: >-
      The assigned evidence does not establish Galbot's product-safety certifications, privacy controls, incident record,
      insurance coverage, export-control classification, or litigation posture. That is a material diligence gap, not evidence
      that no incidents or proceedings exist. The clearest externally evidenced regulatory exposure is prospective: MERICS
      identifies dependence on Nvidia's robotics ecosystem and notes that increasingly capable edge-computing chips could
      become export-control targets. CNBC also reports that US-China tensions and national-security scrutiny have chilled
      cross-border investment. These conditions can constrain compute access, financing sources, overseas customers, and exit
      optionality even without a company-specific enforcement action. Investment documentation should require a jurisdiction-
      by-jurisdiction compliance matrix, safety test files, incident logs, data-governance architecture, and supplier substitution
      plan before treating this risk as mitigated.
    claimRefs: [CR004, CR005, CR009, CR010]
    tableRefs: [TR001]
  - id: operational-and-partner-dependencies
    title: Operational and partner dependencies
    body: >-
      Galbot's CATL relationship is both evidence of deployment and a concentration risk. Reporting says the S1 entered CATL's
      smart production line for material handling and picking, while CATL's Ning Service network is expected to extend into
      embodied-robot after-sales support. This can reduce field-service friction, but it also leaves deployment credibility and
      support capacity partly dependent on one strategic investor-customer ecosystem. Technical concentration is broader:
      MERICS reports dependence on Nvidia software and chips and on German and Japanese precision-component suppliers.
      Monitoring should therefore separate Galbot-controlled performance from partner-provided batteries, service, compute,
      and components. Kill criteria include failure to qualify alternative compute or critical components, persistent human
      intervention above contracted thresholds, or an inability to reproduce CATL-level performance at two unrelated customers.
    claimRefs: [CR004, CR005, CR007, CR008, CR016]
    tableRefs: [TR003]
  - id: mitigation-and-thesis-breaks
    title: Mitigation priorities and thesis-break triggers
    body: >-
      The strongest visible mitigation is a structured industrial deployment with a large manufacturer and an announced route
      into that partner's service network. It does not resolve demand breadth, safety governance, reliability, or economics.
      Management should provide monthly fleet uptime, autonomous task-completion rate, human interventions per operating hour,
      mean time between failures, field-service cost, gross margin by deployment, receivable aging, and customer concentration.
      A thesis break should be triggered by stalled production deployments, repeated safety-critical incidents, restricted access
      to essential compute without a qualified substitute, loss of CATL service support, or unit economics that do not improve
      with deployment scale. Competitive concentration also matters: TrendForce projects Unitree and AgiBot to capture nearly
      80% of 2026 shipments, increasing the risk that Galbot's funding and valuation outrun its commercial share.
    claimRefs: [CR001, CR006, CR007, CR008, CR011, CR014, CR016]
