company:
  name: "Galaxy Bot"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    Public evidence establishes one substantive Galbot production reference: CATL has put the
    Galbot S1 into regular battery-production work and plans to extend its service infrastructure
    to the robots. That proof is strategically meaningful but narrow; the reviewed evidence does
    not disclose retention, renewal, contract value, customer concentration, or deployment ROI.
sections:
  - id: "customer-base"
    title: "Customer base: industrial proof, broader positioning"
    body: >-
      Galbot's strongest identifiable customer segment is large-scale industrial manufacturing.
      CATL has placed the S1 on a smart production line for module and battery-pack handling and
      picking, moving the relationship beyond a logo or demonstration. Retail remains a
      product-positioning segment rather than a verified customer cohort in the reviewed material:
      MERICS describes GroceryVLA as a model for retail scenarios, but names no Galbot retailer.
      Industry evidence also points to research laboratories, state-owned enterprises, logistics
      operators, factories, and malls as active humanoid buyers or deployment sites, yet those
      observations cannot be attributed to Galbot's own customer base. The resulting segmentation
      is therefore evidence-tiered rather than a claimed account census.
    claimRefs: ["CU001", "CU002", "CU007", "CU010", "CU014"]
    tableRefs: ["TU001"]
  - id: "adoption-proof"
    title: "Adoption proof and trajectory"
    body: >-
      CATL is the clearest marker of production adoption: CnEVPost reports that the S1 performs
      long-running autonomous work rather than a one-off pilot. The wider demand environment is
      credible but uneven. China had 470 operational industrial robots per 10,000 manufacturing
      employees in 2023, indicating an automation-literate buyer base, while 2026 reporting says
      Chinese humanoid vendors are already shipping into factories and malls. Peer disclosures
      show that commercialization can become financially material—UBTECH reported 1,079 full-size
      robots and RMB820.6 million of related 2025 revenue—but those peer figures are not evidence
      of Galbot volume, revenue, or repeat usage. No Galbot account count or installed-base series
      is available in the assigned evidence.
    claimRefs: ["CU002", "CU009", "CU010", "CU011", "CU012", "CU013"]
    tableRefs: ["TU002", "TU003"]
  - id: "durability-expansion"
    title: "Durability and expansion"
    body: >-
      The CATL relationship contains one credible expansion mechanism: the parties intend to fold
      embodied-intelligence robots into CATL's established Ning Service inspection, maintenance,
      and recycling network. That could lower field-support friction and enable expansion across
      production sites, but the evidence does not state a rollout schedule, committed unit count,
      contract term, renewal trigger, or economics. CATL is also described as an investor in
      Galbot, so deployment evidence and strategic backing are intertwined rather than fully
      independent customer validation. With no disclosed NRR, GRR, churn, renewal, utilization,
      satisfaction, or cohort data, customer durability cannot be underwritten from public
      evidence.
    claimRefs: ["CU003", "CU004", "CU015"]
    figureRefs: ["FU001"]
  - id: "customer-risk"
    title: "Customer risk and underwriting implications"
    body: >-
      Customer risk is dominated by proof concentration and category-level commercialization
      uncertainty. The reviewed Galbot-specific evidence names CATL as the sole production
      reference, while independent industry analysis says humanoids remain expensive, constrained
      to limited tasks, and often deployed in site-specific trials. Associated Press reporting
      adds that 2025 Chinese humanoid orders were heavily supported by state-owned enterprises and
      research demand, and that buyers may lag manufacturing capacity. Galbot may still build a
      durable industrial wedge, but current evidence cannot distinguish paid production units from
      strategic pilots, quantify revenue concentration, or demonstrate renewal economics. An
      investment case should therefore require contract-level proof from multiple unrelated
      customers.
    claimRefs: ["CU005", "CU006", "CU007", "CU008", "CU015"]
