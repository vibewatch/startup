figures:
  - id: "FU001"
    title: "Evidence-based customer adoption journey"
    type: "journey-map"
    summary: "Galbot has crossed from task selection to one production reference, while repeatability and renewal remain unverified."
    data:
      items:
        - label: "1. Task selection"
          detail: "Target structured, repetitive handling and picking tasks where industrial buyers already use automation."
          touchpoints: ["Factory workflow", "Safety and cycle-time requirements"]
        - label: "2. Site-specific validation"
          detail: "Validate the robot in the customer's production environment; industry evidence says many humanoids remain in localized trials."
          touchpoints: ["Pilot line", "Operator acceptance"]
        - label: "3. Production operation"
          detail: "CATL reports the Galbot S1 in regular production-line work for module and battery-pack processes."
          touchpoints: ["Material handling", "Picking"]
        - label: "4. Service integration"
          detail: "The parties plan to extend CATL's Ning Service infrastructure to embodied-intelligence robots."
          touchpoints: ["Inspection", "Maintenance", "Recycling"]
        - label: "5. Multi-site expansion"
          detail: "Scaled deployment and global expansion are stated objectives, but sites, units, and timing are not disclosed."
          touchpoints: ["Additional lines", "Additional sites"]
        - label: "6. Renewal and proof of value"
          detail: "Retention, renewal, utilization, payback, and customer satisfaction remain unreported."
          touchpoints: ["Contract renewal", "Measured ROI"]
    approximationNotes: "Stages describe the evidenced and unevidenced path; they do not imply conversion rates, timing, or committed rollout volume."
    claimRefs: ["CU001", "CU003", "CU005", "CU015"]
callouts:
  - calloutType: "risk"
    title: "Reference quality is not customer breadth"
    body: >-
      CATL is a high-quality production reference, but it is also a strategic investor and the
      only named Galbot production customer in the reviewed pool. Treat it as proof of feasibility,
      not proof of diversified recurring demand.
    claimRefs: ["CU002", "CU004", "CU015"]
