figures:
  - id: FE001
    title: Anyscale Production AI Compute Platform Architecture
    type: stack
    summary: Layered technical architecture illustrating developer interaction surfaces, managed runtime orchestration, distributed compute engines, and underlying multi-cloud hardware infrastructure.
    data:
      layers:
        - label: Developer Interaction & Interface Layer
          detail: "CLI, Python SDKs, REST APIs, Model Context Protocol (MCP) surfaces, Docusaurus commercial docs, and collaborative Workspaces for interactive debugging and code submission."
        - label: Management, Governance & Control Plane
          detail: "Multi-tenant cluster scheduling, user access control (SSO, SAML, SCIM), audit logging, job monitoring, OpenTelemetry instrumentation, and environment/container image management."
        - label: High-Performance Distributed Compute Engine
          detail: "Ray Core distributed runtime, in-memory distributed object store, RDMA communication fabric, and Ray ecosystem libraries (Ray Data, Ray Train, Ray Serve, SkyRL, vLLM, SGLang)."
        - label: Accelerator & Cloud Infrastructure Fabric
          detail: "NVIDIA AI Enterprise, NIM microservices, multi-cloud compute orchestration (AWS, Azure, GCP, Nebius, CoreWeave), Kubernetes/VM runtimes, and Nscale vertically integrated data centers."
        - label: Storage, Object Cache & Data Transport Fabric
          detail: "Shared memory object store, local NVMe spill-over caching, cross-node RDMA networking, and cloud object store integration (Amazon S3, Azure Blob, Google Cloud Storage)."
        - label: Hardware Acceleration & Custom Compute Substrates
          detail: "NVIDIA HGX/DGX, NVL72 rack-scale systems, Google TPUs, and Nscale high-density green energy data center clusters."
