callouts:
  - calloutType: "risk"
    title: "Dual-Edged Nature of Open-Source Governance Protection"
    body: "The donation of Ray to the PyTorch Foundation in October 2025 provides customers with absolute protection against proprietary code capture following Anyscale's acquisition by Nscale. However, this neutrality simultaneously functions as an existential commercial vulnerability: because Ray runs identically across any cloud or Kubernetes environment, Anyscale cannot build a proprietary lock-in moat around the runtime, leaving it vulnerable to commoditization by KubeRay and hyperscaler cloud services."
    claimRefs:
      - "CR003"
      - "CR004"
      - "CR013"
