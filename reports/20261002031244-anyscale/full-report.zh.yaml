  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 分布式计算架构与托管 Ray 运行时
        blocks:
          - type: paragraph
            body: >
              Anyscale 基于开源 Ray 框架研发商业分布式计算平台，专为在异构集群上横向扩展 Python 原生 AI
              与机器学习工作负载而设计。从底层逻辑看，平台将开发者体验与底层分布式基础设施运维解耦，工程团队无需重写底层应用逻辑，即可将工作负载从单节点原型扩展至数千个节点的分布式集群。架构在职责上分为两层：集中式控制平面（负责管理集群生命周期、多租户调度、用户认证及资源配额）与优化数据平面（执行分布式任务、管理
              Actor 状态及节点间高吞吐通信）。


              核心计算引擎借助 Ray 分布式内存对象存储与 RDMA（远程直接内存访问）传输协议，提供超大规模模型训练与高吞吐批量推理所需的高带宽、低延迟进程间通信。为适配异构硬件环境，运行时支持细粒度硬件调度，允许单独的
              Python 函数和类分别指定具体的 CPU、GPU 及加速器资源需求。平台可跨 AWS、Azure、Google Cloud Platform 以及 Nebius、CoreWeave 等新兴 GPU
              算力厂商，支持基于虚拟机和基于 Kubernetes 的两类集群拓扑编排。这种多云抽象层既规避了各家云厂商的专有 API 绑定，又最大化提升了 GPU 算力资源的获取效率。
