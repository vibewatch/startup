      - number: '1.2'
        title: 管理层、公司治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              创始团队凭借一手缔造 Ray 并直接承接 Berkeley 分布式系统学术法统，拥有极高技术声誉。Forge 整理的高管资料显示，Keerti Melkote 于 July 2024
              出任首席执行官，Nishihara 则转向主抓产品与客户增长；后续竞品分析同样将 Melkote 列为 Anyscale CEO。Tracxn 披露的五人董事会包括 Ben Horowitz、Ion
              Stoica、Robert Nishihara、Peter Sonsini 及 Philipp Moritz，但现有证据无法证实该董事会是否会在交割后保留。这带来两层独立依赖：围绕 Ray
              创始人的技术延续性，以及围绕这位履新不久 CEO 的商业延续性。据报 Nscale 计划接纳全体团队，虽可缓解眼下的离职风险，但这并非长期留任或决策权不变的实证。
            claimRefs:
