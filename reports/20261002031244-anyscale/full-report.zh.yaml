      - number: '6.4'
        title: 附件图表
        blocks:
          - type: callout
            title: 开源 Ray 作为零获客成本的企业推广引擎
            body: >-
              Anyscale 的获客策略从根本上得益于开源 Ray 作为 Python 分布式计算事实标准的地位。凭借超 5 亿次下载量以及 OpenAI、Uber 等 AI 领军企业的采纳，开发者早在商业采购启动之前便已在
              Ray 上构建应用。这种动态使得 Anyscale 能够以极低的初期摩擦，将既有的技术采纳转化为企业级 BYOC 采购合同 [CU001, CU002, CU010]。
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU010
          - type: callout
            title: 未公开单客经济模型与托管环境合规短板
            body: >-
              尽管 Canva 等标杆客户的高满意度与生产提速有据可查，但由于缺乏公开的
              ARR、客户数及净金额留存率数据，非上市状态下的尽调估值受到严重制约。此外，运维层面的权衡（例如审计日志默认关闭且在托管测试云中不可用）在强监管行业构成了采购准入阻碍 [CU006, CU014, CU015,
              CU016]。
            calloutType: risk
            claimRefs:
              - CU006
              - CU014
              - CU015
