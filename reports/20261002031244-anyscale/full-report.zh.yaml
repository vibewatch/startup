      - number: '8.2'
        title: 历史融资背景、非上市二级市场与并购对标
        blocks:
          - type: paragraph
            body: >-
              2019 年至 2022 年间，Anyscale 在多轮机构融资中累计筹集 $281M，投资方包括 Andreessen Horowitz、New Enterprise
              Associates、Addition、Intel Capital 及 Foundation Capital 等顶级机构。继 2019 年 $20.6M A 轮与 2020 年 $40M B 轮之后，公司在
              October 2021 完成估值 $1.0B 的 C 轮融资跻身独角兽行列，并在 2022 年将估值推升至 $1.38B。收购前夕的非公开二级市场上，参考报价波动剧烈：Nasdaq Private Market
              等平台显示 September 2026 成交价为每股 $4.26（较 September 2024 上涨 13.86%），而 PM Insights 分析模型显示的买卖价差暗示其较此前一级市场估值存在
              99.22% 的溢价。Nscale 宣布以 $1.65B 收购，确立了明确的交易基准，化解了非上市市场的流动性难题，并为 Anyscale 约 200 名员工提供了完整的雇佣连续性保障。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: 情景估值倍数、退出落地与尽调核验
        blocks:
          - type: paragraph
            body: >-
              在乐观、基准与悲观情景下评估 Anyscale 的战略价值，凸显了主权 AI 算力整合与独立运营阻力之间的鲜明反差。在体现 Nscale 最终交易条款的基准情景下，Nscale 将 Anyscale 的 200
              名工程师及 Ray 软件技术栈直接整合进其数吉瓦规模的欧洲数据中心基础设施，按未证实的营收测算，以预估 15x 至 22x 的 EV/ARR 倍数支撑了 $1.65B
              的企业估值。在独立运营的乐观情景下，SkyRL 与 veRL 等分布式强化学习框架的超预期爆发本可支撑其维持超 70% 的环比增速，对应 $2.5B
              以上的估值。相反，悲观情景反映了潜在的反垄断审查干预、客户流失转向云厂商原生托管 Ray，或开源用户向付费客户转化失败的风险。交割前关键尽调必须重点核实经审计的确切 ARR 运行率、客户留存经济指标以及
              Nscale 整合后的治理安排。
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV011
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 附件图表
        blocks:
          - type: callout
            title: 交易确定性锚定企业价值
            body: 鉴于已与 Nscale 签署 $1.65B 的最终收购协议，投资者应将当前股权价值视为由交易执行确定性锚定，而非参照公开市场 SaaS 的投机性市销率倍数。双方纵向运营协同度高，交割确定性极高。
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV011
          - type: callout
            title: 商业披露不透明压制独立估值倍数
            body: Anyscale 无法或不愿公开披露 ARR 与单体留存指标，凸显出从开源分布式框架中捕获价值的结构性困境，促成其借助纵向并购退出的理性抉择。
            calloutType: risk
            claimRefs:
              - CV002
              - CV005
              - CV014
