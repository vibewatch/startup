  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Anyscale 历经 Ray 商业化、风投融资、CEO 更迭、Ray 移交基金会治理，以及推进中的 Nscale 战略合并。
    data:
      items:
        - date: '2019'
          label: 公司成立
          detail: Robert Nishihara、Philipp Moritz、Ion Stoica 与 Michael I. Jordan 共同创立 Anyscale。
          tone: neutral
          claimRefs:
            - CO001
        - date: 2019-12
          label: 公布 A 轮融资
          detail: 由 Andreessen Horowitz 领投 $20.6M A 轮融资，另有 6 家具名投资机构参投。
          tone: positive
          claimRefs:
