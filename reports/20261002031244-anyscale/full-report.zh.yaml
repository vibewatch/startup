              Star）为起点，逐步渗透至付费团队 Workspaces、自助用量计费及企业级大额合约 [CU001, CU004, CU010]。为支撑这种多渠道扩张，Anyscale 引入 Metronome
              整合计费体系，打通自助积分购买、按量计费以及 AWS、Azure 与 Google Cloud 云市场分发渠道 [CU005, CU011]。在 July 2026 与英国 AI 新锐云 Nscale 达成
              $1.65B 收购协议前，Anyscale 披露季度营收环比增长 70%，且核心大客的企业留存率达 90%+ [CU002, CU012]。然而，衡量客户韧性的核心指标（包括付费客户数、净金额留存率
              NRR、毛金额留存率 GRR 以及头部锚定客户的营收集中度）仍属未公开的内部数据。此外，自建 Ray 及超大规模云厂商的替代托管服务造成长期采购阻力，且托管测试云上的审计日志限制也阻碍了受监管企业合规准入
              [CU013, CU014, CU015, CU016]。
