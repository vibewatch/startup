  - id: FE001
    title: Anyscale 生产级 AI 算力平台架构
    type: stack
    summary: 分层技术架构，展示开发者交互界面、托管运行时编排、分布式计算引擎及底层多云硬件基础设施。
    data:
      layers:
        - label: 开发者交互与界面层
          detail: CLI、Python SDK、REST API、Model Context Protocol (MCP) 接口、Docusaurus 商业文档，以及用于交互式调试和代码提交的协作工作区（Workspaces）。
        - label: 管理、治理与控制平面
          detail: 多租户集群调度、用户访问控制（SSO、SAML、SCIM）、审计日志记录、作业监控、OpenTelemetry 埋点以及环境与容器镜像管理。
        - label: 高性能分布式计算引擎
          detail: Ray Core 分布式运行时、内存分布式对象存储、RDMA 通信网络，以及 Ray 生态库（Ray Data、Ray Train、Ray Serve、SkyRL、vLLM、SGLang）。
        - label: 加速器与云基础设施互联
          detail: NVIDIA AI Enterprise、NIM 微服务、多云算力编排（AWS、Azure、GCP、Nebius、CoreWeave）、Kubernetes/VM 运行时及 Nscale 垂直一体化数据中心。
        - label: 存储、对象缓存与数据传输互联
          detail: 共享内存对象存储、本地 NVMe 溢出缓存、跨节点 RDMA 网络以及云对象存储集成（Amazon S3、Azure Blob、Google Cloud Storage）。
        - label: 硬件加速与定制计算基底
          detail: NVIDIA HGX/DGX、NVL72 机架级系统、Google TPU 及 Nscale 高密度绿色能源数据中心集群。
    approximationNotes: 架构分层代表基于 Anyscale 平台文档、Ashby 基础设施工程招聘说明及 NVIDIA 合作公告的功能抽象。
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE005
      - CE008
      - CE009
      - CE010
      - CE012
  - id: FU001
    title: 客户旅程与企业采纳生命周期
    type: journey-map
    summary: 绘制机器学习团队从开源 Ray 实验到企业 BYOC 生产级合同及多云扩展的演进路径。
    data:
      items:
        - label: 开源 Ray 探索
          description: 开发者在笔记本或小型集群上使用开源 Ray 实现 Python 代码并行化并扩缩 ML 工作负载。
          touchpoints:
            - 开源 GitHub 代码仓库与 Python pip/conda 安装
            - 本地脚本编写与初始分布式任务装饰器
            - 社区论坛与文档教程
        - label: 自助试用与工作区
          description: 团队在自建集群上面临运维阻力，转而采用 Anyscale 托管工作区进行交互式云端开发。
          touchpoints:
            - 用于托管试用的促销启动额度（$100）
            - VS Code 与 JupyterLab 远程云工作区连接
            - 按需信用卡付费或借助 Metronome 的自助计量
        - label: 生产作业与服务升级
          description: 开发者将测试完毕的工作区代码直接提升为托管批处理作业、Ray Data 管线或 Ray Serve 端点。
          touchpoints:
            - 自动化集群生命周期管理与节点自动扩缩容
            - 从工作区代码直接提升为带版本控制的生产作业
            - 异构 CPU/GPU 调度与容错机制
        - label: 企业 BYOC 部署
          description: 平台工程团队将 Anyscale 部署至专属云 VPC（AWS、GCP、Azure），以维护数据主权并消耗云承诺额度。
          touchpoints:
            - 位于客户 AWS/GCP/Azure 账户内的单租户数据平面
            - 企业级安全：SSO、SAML、SCIM 及项目访问控制
            - 借助 AWS、Azure 或 GCP 云市场合同计费
        - label: 多云与新兴云扩展
          description: 企业跨异构云厂商及 Nscale GPU 基础设施扩展多模型推理与分布式训练。
          touchpoints:
            - 无需重写代码即可实现跨云工作负载可移植性
            - 跨云统一计费与合同对账
            - 协同设计的全栈 GPU 基础设施整合
        - label: 长期拓展与生态整合
          description: 企业依托 Anyscale 与 Ray 编排，将全公司分布式 AI 运营与复合智能体管线标准化。
          touchpoints:
            - 围绕全公司生成式 AI 路线图实现标准化
            - 集成大语言模型与工具的复合 AI 系统部署
            - 持续工作负载优化与专属工程 SLA
    approximationNotes: 旅程地图各阶段反映已归档的产品上手路径、Metronome 计费案例研究及企业平台架构。
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU005
      - CU011
      - CU013
  - id: FR001
    title: 风险热力图与暴露矩阵
    type: matrix
    summary: 在评估的可能性与影响维度上评估关键组织、技术和商业风险。
    data:
      columns:
        - 可忽略影响
        - 中等影响
        - 严重影响
      rows:
        - label: 关键 / 即期
          values:
            - 非关键 API 日志记录缺口
            - 按量计费 GPU 成本超支与竞价实例波动
            - 超大规模云厂商托管 Ray 的竞价压力
        - label: 高概率
          values:
            - 非关键 SDK 工具缺陷
            - 竞价实例被抢占中断
            - 企业云支出预算摩擦
        - label: 中概率
          values:
            - 遥测架构微小漂移
            - 企业 BYOC 配置开销
            - 客户流失至 Kubernetes 上的自建 KubeRay
        - label: 低概率
          values:
            - 文档格式错误
            - 开源 Ray 治理权被把持
            - 并购监管否决或反垄断交易阻拦
        - label: 极低概率
          values:
            - 核心 Ray 算法弃用
            - 多云网络隔离失效
            - 上游 PyTorch Foundation 突发解散
        - label: 假设性极端情况
          values:
            - 公有云 API 完全关闭
            - 全球 Python 运行时被淘汰
            - 多区域数据中心同时彻底瘫痪
    approximationNotes: 概率与影响评级综合了据报道的客户评价、MLOps 平台基准及交易披露信息。
