      - number: '2.3'
        title: 买方画像细分、预算归属与落地阻力
        blocks:
          - type: paragraph
            body: >-
              分布式 AI 计算平台的企业采购由两类角色共同推动：一线技术人员发起采用，集中采购部门和云工程领导层掌握决策权 [CM014,
              CM015]。机器学习工程师、基础模型构建者及数据科学负责人是核心用户与内部推手，诉求在于无缝的 Python API、Notebook 集成与免底层集群运维的多节点训练能力 [CM007,
              CM014]。相反，基础设施副总裁、首席信息官（CIO）及 FinOps 委员会掌握正式预算审批权，评估维度涵盖总体拥有成本、智能竞价实例节省效果、SOC2 合规性，以及支持自带云资源（BYOC）的 VPC
              部署，以确保企业敏感数据不离开企业防火墙边界 [CM005, CM015]。实际落地阻力依然显著：用户反馈表明，将传统 Python 代码改写为分布式 Ray Actor 和 Task
              存在中等学习门槛，Studio 环境偶发配置摩擦，且高阶多节点搭建文档尚存空白 [CM016]。此外，企业承诺折扣定价不透明，加之基于使用量的 GPU
              机时突增难以预测，加大了采购团队预算预测难度，成为阻碍全公司规模化推广的实质性壁垒 [CM015, CM016]。
            claimRefs:
