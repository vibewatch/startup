      - number: '1.4'
        title: 里程碑与并入 Nscale 的战略影响
        blocks:
          - type: paragraph
            body: >-
              里程碑演进轨迹展现出一幅完整路线图：公司从开源商业化起步，历经风投扩张与管理层职业化，最终走向战略整合。据 TechCrunch 援引 Bloomberg 及匿名信源报道，本次收购对价为
              $1.65B；双方公司在现有材料中未披露对价，因此该数字属于据报交易金额，而非经过核实的合同约定价格。从战略上看，Anyscale 表示此次整合将自身软件与 Nscale
              的加速计算算力结合，同时保持多云可移植性。Ray 由 PyTorch Foundation 独立治理，限制了对框架本身的直接所有权；但竞品分析强调，开源代码并不代表托管控制平面具备可移植性。因此，核心尽调问题并非
              Ray 是否保持开源，而是在算力供应商掌控商业化编排层之后，产品定价、路线图中立性、数据导出与云厂商选择权能否继续获得合同层面的保障。
