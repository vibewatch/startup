              - CR013
      - number: '7.2'
        title: 运维复杂度、定价不可预测性与安全开销
        blocks:
          - type: paragraph
            body: >-
              客户反馈与独立 MLOps 评测指出，Anyscale 的部署模式存在显著的运维摩擦。尽管用户评价肯定了借助竞价实例编排可大幅节省高达 60% 成本，但企业买方反映，从标准 Python 管道转向 Ray
              的分布式执行范式面临中等乃至陡峭的学习曲线。此外，Anyscale 的商业模式依赖基于使用量的 Anyscale Credits（AC），按小时对 CPU 节点与专用 GPU
              实例计费；由于不可预测的自动扩缩容尖峰与竞价实例中断，此模式给企业预算制定带来阻力。运维上，跨自带云资源（BYOC）虚拟私有云的企业级部署要求客户具备深厚的基础设施技术储备，且企业治理文档与安全配置开销过大，成为第三方评测屡次指出的短板。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
      - number: '7.3'
        title: 超大规模云平台依赖、开源替代与硬件集中度风险
        blocks:
          - type: paragraph
            body: >-
              Anyscale 面临突出的合作伙伴集中度与平台替代风险。其商业价值主张直接依赖能否获取顶级加速硬件（特别是 NVIDIA H100、A100 及下一代 GPU
              系列），在全球算力紧缺期间极易遭遇供应瓶颈。与此同时，Anyscale 与为其 BYOC 客户集群提供底层基础设施的公有云巨头构成直接竞争。AWS、Google Cloud 和 Microsoft Azure
              等主流超大规模云厂商均提供原生托管 Kubernetes 与 Ray 支持，带来持续的去中介化压力。此外，KubeRay 及社区调度 Operator
              等开源工具日臻成熟，成熟的企业工程团队完全有能力自主托管分布式 Ray 工作负载，直接制约了 Anyscale 在底层算力成本之上索取高额软件溢价的能力。
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: 附件图表
        blocks:
          - type: callout
            title: 开源治理保护的双刃剑效应
            body: >-
              October 2025 将 Ray 捐赠予 PyTorch Foundation，为客户提供了绝对屏障，防止收购后专有代码遭到垄断。然而，这种中立性同时也是致命的商业软肋：由于 Ray 在任何云平台或
              Kubernetes 环境中均能完全一致地运行，Anyscale 无法围绕运行时筑起专有锁定的护城河，极易受到 KubeRay 及超大规模云服务的同质化侵蚀。
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR013
  - number: 8
    title: 估值分析
    sections:
      - number: '8.1'
        title: 投资论点、反方论点与战略估值立场
        blocks:
          - type: paragraph
            body: >-
              看好 Anyscale 的核心投资论点在于其对 Ray 项目的底层主导权——Ray 是当下分布式 AI 工作负载与基础模型扩展的主导开源框架。凭借超 5 亿次下载量以及在一线企业中的广泛部署，Anyscale
              在分布式训练、批量 Embedding 生成与后训练编排中确立了不可或缺的生态地位。然而反方论点强调，Ray 的开源属性使大型超大规模云厂商和成熟企业能够自建或打造托管运行时服务，无需向 Anyscale
              支付商业软件许可费。尽管在交易达成前夕季度营收环比激增 70%，但由于绝对 ARR、净金额留存率和毛利率均未公开披露，估值存在结构性不确定性。鉴于 Nscale 已达成 $1.65B
              收购协议，我们的估值立场为估值合理（Fair），并给出锚定交易的持有建议，在战略估值倍数支撑与独立商业化变现受限之间取得平衡。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
