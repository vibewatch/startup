  - number: 7
    title: 风险分析
    sections:
      - number: '7.1'
        title: 并购整合、股权重组与基金会治理
        blocks:
          - type: paragraph
            body: >-
              Anyscale 于 July 2026 签署最终协议，同意由英国新锐云厂商 Nscale 以据报 $1.65B 收购，企业估值相较 2022 年 C 轮 $1.38B 上浮。该交易将 Anyscale 全体
              200 名员工吸纳并入一家纵向一体化基础设施厂商（其刚于 March 2026 斩获 $2B 的 C 轮融资），改变了交易对手方的治理架构。然而尽调显示，Anyscale
              的商业资产与其底层开源生态之间存在明确的结构性边界：Ray 的代码库、商标及技术路线图已于 October 2025 捐赠给中立的 PyTorch Foundation。因此，Nscale
              仅收购了专有商业控制平面、托管编排 API 及商业客户合同；此举虽杜绝了代码垄断，却为在 Nscale 欧洲数据中心网络之外运行工作负载的客户带来了多云中立性摩擦。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
