chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 主体定位、产品与当前企业状态
        blocks:
          - type: paragraph
            body: >-
              2019 年，Ray 创作者 Robert Nishihara、Philipp Moritz、Ion Stoica 联手 UC Berkeley 教授 Michael I. Jordan 创立
              Anyscale，独立企业资料显示其总部位于旧金山。其商业定位与开源项目不同：Anyscale 销售基于 Ray 构建的托管平台，跨云与加速芯片承接数据准备、分布式训练、Embedding
              生成、后训练及其他计算密集型 AI 工作负载。2026-07-30，Anyscale 宣布达成并入 Nscale
              的最终协议。现有官方披露文件着重描述交割后规划，未确认交易已正式完成；因此尽管商业数据库已将其标记为已收购，本章仍将 Anyscale 视为待完成收购状态。据 TechCrunch 报道，交易完成后
              Anyscale 将保留自身品牌并继续服务现有客户。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO007
