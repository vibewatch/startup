      - number: '2.4'
        title: 附件图表
        blocks:
          - type: callout
            title: 分布式计算领域的纵向一体化变革
            body: >-
              英国新锐云厂商 Nscale 以 $1.65B 收购
              Anyscale，标志着行业迎来结构性转变：独立的分布式软件层正加速与物理算力基础设施深度整合。随着摩尔定律放缓以及加速硬件供应趋紧，相比寄生于第三方超大规模云厂商之上的纯软件外挂层，将软件编排与数据中心及电力基础设施协同设计能创造更优的利润率水平。
            calloutType: insight
            claimRefs:
              - CM011
              - CM013
          - type: callout
            title: 自建部署与超大规模云厂商托管服务的双重压力
            body: >-
              开源 Ray 极高的普及度（下载量超 5 亿次）既是 Anyscale 最核心的获客引擎，也是其持续面临的商业逆风。技术成熟的工程团队通常选择在非托管 Kubernetes 上直接自建上游
              Ray，或采用超大规模云厂商的托管竞品（例如 AWS SageMaker 及 Google Cloud Vertex AI 的托管 Ray），对 Anyscale 专有企业版定价与差异化构成持续压力。
            calloutType: risk
            claimRefs:
              - CM004
              - CM007
              - CM015
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与结构性动态
        blocks:
          - type: paragraph
            body: >-
              分布式 AI 算力编排市场已分化为清晰的结构层级：超大规模云厂商一体化托管平台、原生支持 Kubernetes 的裸金属 GPU 新锐云、自主管理的开源编排体系，以及专用 Serverless AI
              执行运行时。Anyscale 的战略立足点源于其作为 Ray 缔造者的行业权威——该开源分布式 Python 框架下载量已突破 5 亿次，GitHub Star 超过 41,000。然而，Anyscale
              的商业化产品以往作为软件控制平面，寄生于 AWS、GCP 及 Azure 等第三方公有云厂商之上。这一控制平面架构面对传统云巨头暴露出结构性脆弱：AWS 占据 AI 基础设施市场 19.1% 的份额（营收
              $7,186.7M），Google Cloud 占 14.5%（营收 $5,439.8M），Microsoft Azure 占 13.7%（营收 $5,161.6M），三大超大规模云厂商合计份额近
              47%。超大规模云厂商借助 Amazon EKS 和 Google Cloud GKE 上的 KubeRay 等托管 Kubernetes Operator 提供原生 Ray
              支持，不加收第三方平台编排溢价。为摆脱对美国超大规模云厂商的依赖并截留基础设施利润，Anyscale 于 July 2026 签署最终协议，同意由英国主权 AI 新锐云 Nscale 以 $1.65B 收购，将
              Ray 软件编排能力与欧洲主权数据中心深度融合。
