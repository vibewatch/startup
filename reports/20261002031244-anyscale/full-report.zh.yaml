      - number: '3.2'
        title: 竞品画像、定价策略与技术架构
        blocks:
          - type: paragraph
            body: >-
              面对四大核心竞品阵营——公有云巨头、裸金属 GPU 专业厂商、容器平台及自建开源技术栈，企业买方面临严苛的经济效益与运维权衡。定价端，Anyscale 在底层云算力成本之上加收编排平台费，通常相比裸金属 GPU
              费率溢价 50% 至 100%。针对 8x NVIDIA H100 SXM5 集群，Spheron 等裸金属厂商按分钟计费，价格为每小时 $21.20（折合每卡每小时 $2.65），而 AWS
              p5.48xlarge 按需实例约为每小时 $32.00。叠加上 Anyscale 平台费后，实际综合费率升至每小时 $40.00 至 $64.00（折合每卡每小时 $5.00 至 $8.00）；按每月集群运行
              200 小时计算，月度支出约 $9,600，远高于裸金属云的不足 $4,500。Spheron 与 Northflank 的独立对比表明，尽管 Anyscale 在开箱即用的 Ray
              集群全生命周期管理、竞价实例自动扩缩容（间歇性负载经证实可节省 60% 算力成本）以及后训练 RLHF 环境上优势突出，但其运行时与 Ray 强绑定。对于部署 FastAPI 服务、前端微服务或自定义非 Ray
              容器的混合全栈应用团队，相比 Northflank 等容器原生平台，Anyscale 运行时约束较多；而 Modal 等 Serverless 方案则提供了无集群运维负担的更轻量 Python 并行能力。
