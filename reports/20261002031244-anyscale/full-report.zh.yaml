            body: >-
              公开融资记录趋势清晰，但具体数字存在出入。公司曾宣布完成由 Andreessen Horowitz 领投的 $20.6M A 轮融资，NEA、Intel Capital、Ant Financial、Amplify
              Partners、11.2 Capital 与 The House Fund 参投。独立数据库均记录了 2020 年 B 轮及后续 C 轮，但在轮次日期、合并口径、估值与总募资额上存在分歧：Tracxn
              记录四轮共 $281M，Multiples 记录四轮共 $259M，Forge 则显示总募资额达
