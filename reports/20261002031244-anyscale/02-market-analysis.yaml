callouts:
  - calloutType: insight
    title: "Vertical Integration Shift in Distributed Compute"
    body: "The acquisition of Anyscale by British neo-cloud Nscale for $1.65 billion signals an industry-wide transition where standalone distributed software layers are increasingly being unified with physical compute infrastructure. As Moore's Law slows and accelerator hardware tightens, co-designing software orchestration with datacenter and power infrastructure creates superior margin efficiency compared to pure software overlays operating on third-party hyperscalers."
    claimRefs:
      - CM011
      - CM013
  - calloutType: risk
    title: "Self-Hosting and Hyperscaler Managed Service Pressure"
    body: "Open-source Ray's massive popularity (over 500 million downloads) represents both Anyscale's primary distribution engine and a persistent commercial headwind. Sophisticated engineering organizations frequently opt to self-host upstream Ray directly on unmanaged Kubernetes or leverage hyperscaler managed alternatives (such as AWS SageMaker and Google Cloud Vertex AI managed Ray), placing ongoing pricing and differentiation pressure on proprietary Anyscale enterprise tiers."
    claimRefs:
      - CM004
      - CM007
      - CM015
      - CM016
