evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating scale
    missingEvidence: >-
      Current absolute revenue, ARR, customer count, customer concentration, gross margin, net retention, verified
      headcount, and cash availability are not supported by the assigned pool.
    whyItMatters: >-
      Sequential growth without a base or retention data cannot establish commercial scale, revenue quality, capital
      efficiency, or integration risk.
    diligencePath: >-
      Obtain audited financials, monthly revenue and ARR bridges, customer-level concentration schedules, HR roster, and
      cash/debt statements through a management data room.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      Public databases disagree on Series C timing and aggregation and on total funding, while reported acquisition
      consideration is not company-disclosed.
    whyItMatters: >-
      The differences prevent reliable reconstruction of invested capital, ownership, liquidation preferences, investor
      returns, and transaction value.
    diligencePath: >-
      Reconcile certificates of incorporation, financing documents, the fully diluted cap table, merger agreement, and
      closing statement with company counsel.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership and stakeholder coverage
    missingEvidence: >-
      The assigned evidence does not provide a complete current executive roster, fully diluted investor list, ownership
      percentages, or post-close board and management structure.
    whyItMatters: Retention, control, consent rights, and founder dependence cannot be fully assessed from a partial public roster.
    diligencePath: >-
      Request the current organization chart, board minutes and observer list, cap table, employment and retention
      agreements, and Nscale's post-close governance plan.
    relatedQuestionRefs:
      - QO002
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: legal and regulatory status
    missingEvidence: >-
      The assigned pool contains no primary regulator, court, or legal source that can establish current litigation,
      regulatory review, transaction approval, or incident status.
    whyItMatters: >-
      An empty adverse search result is not evidence that no dispute, review, breach, outage, or approval condition
      exists.
    diligencePath: >-
      Obtain transaction approval documents and representations, then run jurisdiction-specific court, regulator,
      security-incident, and service-status checks outside this allocated pool.
    relatedQuestionRefs:
      - QO004
      - QO008
  - type: missing-source
    severity: material
    topic: audited-arr-and-net-expansion
    missingEvidence: >-
      Audited annual recurring revenue (ARR), net revenue retention (NRR), and gross margin breakdown for standalone
      Anyscale prior to the Nscale acquisition.
    whyItMatters: >-
      Without audited ARR, bottom-up SAM and SOM calculations cannot be precisely verified, forcing reliance on
      valuation transaction multiples and heuristic profile estimates.
    diligencePath: >-
      Review formal M&A disclosure documents from Nscale or audited regulatory filings detailing Anyscale's standalone
      trailing twelve month financial performance.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: sovereign-pipeline-conversion
    missingEvidence: >-
      Empirical conversion rates and verified contract volumes of Anyscale Ray customers migrating production workloads
      to Nscale sovereign cloud data centers following the July 2026 acquisition.
    whyItMatters: >-
      Directly determines whether the Nscale acquisition creates a durable European revenue moat or remains an
      unmonetized corporate combination.
    diligencePath: >-
      Review Q4 2026 and 2027 enterprise customer disclosures from Nscale, case studies in European regulated sectors,
      and public tender awards.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: arr-and-revenue-scale
    missingEvidence: Audited GAAP financial statements, annualized run-rate revenue, and precise ending ARR.
    whyItMatters: >-
      Prevents independent determination of revenue multiple on both the $1.38B Series C valuation and the $1.65B Nscale
      acquisition price.
    diligencePath: Request confidential disclosure schedules, management P&L statements, and revenue breakdown by customer tier.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: gross-margin-and-cogs
    missingEvidence: Detailed gross margin percentage and hosting infrastructure COGS breakdown across AWS, GCP, and Azure.
    whyItMatters: >-
      Essential to evaluate whether Anyscale operates with high-margin software economics or low-margin compute
      infrastructure resale.
    diligencePath: >-
      Obtain gross profit margins by revenue stream, separating managed software subscriptions from pass-through compute
      hosting.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: retention-and-cac
    missingEvidence: Net revenue retention (NRR), gross retention, and customer acquisition cost (CAC) payback periods.
    whyItMatters: >-
      Confirms whether the 70% sequential revenue expansion is driven by sustainable enterprise Ray expansion or
      temporary compute consumption.
    diligencePath: Audit historical cohort retention curves and enterprise sales cycle metrics.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: enterprise-sla
    missingEvidence: >-
      Audited multi-cloud cluster failover recovery benchmarks and formal uptime SLAs for Anyscale-managed enterprise
      clusters.
    whyItMatters: >-
      Enterprise buyers evaluating Anyscale against native hyperscaler managed Kubernetes or Slurm clusters require
      quantitative reliability guarantees.
    diligencePath: >-
      Request customer master services agreements (MSAs), enterprise SLA terms, and incident post-mortem history under
      NDA.
    relatedQuestionRefs:
      - QE005
  - type: missing-source
    severity: material
    topic: infrastructure-codesign
    missingEvidence: >-
      Detailed technical roadmap disclosures regarding post-acquisition Nscale hardware co-design features versus
      third-party cloud portability.
    whyItMatters: >-
      Investors and customers need clarity on whether Anyscale software optimizations will prioritize Nscale data
      centers over AWS/Azure/GCP.
    diligencePath: >-
      Interview Anyscale and Nscale product leadership regarding product governance and multi-cloud engineering
      commitments.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: private-underwriting-gaps
    missingEvidence: >-
      Audited total paying customer count, customer breakdown between self-serve and enterprise BYOC, and cohort-level
      net revenue retention (NRR) figures.
    whyItMatters: >-
      Without customer counts and retention metrics, standalone unit economics, customer lifetime value (LTV), and
      revenue durability cannot be verified.
    diligencePath: >-
      Request confidential disclosure of customer cohorts, ARR retention curves, and paying account counts from Nscale
      and Anyscale management.
    relatedQuestionRefs:
