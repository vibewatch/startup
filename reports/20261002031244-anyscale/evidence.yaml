      - QU008
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
    topic: concentration-risk
    missingEvidence: Percentage of ARR and monthly GPU compute consumption generated by the top five and top ten enterprise customers.
    whyItMatters: >-
      High customer concentration among volatile foundation-model startups or large consumer platforms introduces severe
      downside revenue risk if an anchor client in-sources Ray infrastructure.
    diligencePath: >-
      Perform customer concentration audit detailing revenue contribution of top 10 accounts and contract expiration
