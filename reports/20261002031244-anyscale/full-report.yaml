      - number: '5.2'
        title: Product Modules, Developer Surfaces, and Lifecycle Tooling
        blocks:
          - type: paragraph
            body: >
              The Anyscale platform organizes its commercial capabilities into four primary product surfaces: Anyscale
              Platform (incorporating interactive collaborative Workspaces and managed cluster operations), Anyscale
              Services (model serving and production endpoint management), Anyscale Endpoints (serverless and dedicated
              model inference APIs), and open-source Ray libraries. Anyscale Workspaces functions as the primary
              developer interface, providing unified environments where practitioners configure runtime dependencies,
              manage container images, submit batch compute jobs, and debug distributed actor execution. The platform
              exposes standardized interfaces across interactive CLI tools, Python SDKs, REST APIs, and Model Context
              Protocol (MCP) surfaces, allowing automated coding agents and engineers to programmatically provision and
              monitor distributed compute tasks.


              Documentation and technical governance represent critical operational surfaces for Anyscale, spanning both
              open-source Ray documentation (built with Sphinx) and commercial product documentation (built with
              Docusaurus). The documentation engineering pipeline incorporates dynamic CLI/SDK reference generation,
              OpenAPI validation, and automated code-example continuous integration to ensure technical accuracy across
              rapidly changing distributed APIs. For model post-training and inference, Anyscale integrates native
              support for specialized machine learning libraries including PyTorch, vLLM, SGLang, and emergent
              post-training frameworks such as SkyRL and veRL, providing end-to-end coverage across the generative AI
              development lifecycle.
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE007
              - CE011
          - type: table
            tableRef: TE001
            claimRefs:
