      - number: '3.2'
        title: Competitor Profiles, Pricing, and Architecture
        blocks:
          - type: paragraph
            body: >-
              Enterprise buyers face stark economic and operational trade-offs across four primary competitor classes:
              public hyperscalers, bare-metal GPU specialists, container platforms, and self-hosted open-source stacks.
              On pricing, Anyscale charges an orchestration platform markup on top of underlying cloud compute,
              typically adding 50% to 100% over bare-metal GPU rates. For an 8x NVIDIA H100 SXM5 cluster, bare-metal
              providers such as Spheron charge $21.20 per hour ($2.65 per GPU-hour) with per-minute billing, while AWS
              p5.48xlarge instances cost roughly $32.00 per hour on-demand. When layered with Anyscale's platform fee,
              effective hourly rates reach $40.00 to $64.00 per hour ($5.00 to $8.00 per GPU-hour), driving monthly
              costs to approximately $9,600 for 200 hours of monthly cluster utilization compared to under $4,500 on
              bare-metal clouds. Independent comparisons from Spheron and Northflank demonstrate that while Anyscale
              excels in turnkey Ray cluster lifecycle management, spot instance autoscaling (delivering documented 60%
              compute cost savings for intermittent workloads), and post-training RLHF environments, its runtime is
              tightly coupled to Ray. Teams deploying mixed full-stack applications with FastAPI services, frontend
              microservices, or custom non-Ray containers find Anyscale's runtime restrictive compared to
              container-native platforms like Northflank, while serverless alternatives like Modal offer simpler Python
              parallelism without cluster management overhead.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
