      - number: '1.2'
        title: Leadership, governance, and key-person exposure
        blocks:
          - type: paragraph
            body: >-
              The founding team carries unusually concentrated technical credibility because it created Ray and links
              the company directly to Berkeley's distributed-systems lineage. Forge's curated leadership coverage says
              Keerti Melkote became chief executive in July 2024 while Nishihara shifted toward product and customer
              growth; a later competitor analysis also identifies Melkote as Anyscale CEO. Tracxn lists a five-person
              board comprising Ben Horowitz, Ion Stoica, Robert Nishihara, Peter Sonsini, and Philipp Moritz, but the
              assigned evidence does not establish whether that board will persist after closing. This creates two
              distinct dependencies: technical continuity around the Ray founders and commercial continuity around a
              relatively recent CEO. Nscale's plan for the entire reported team to join mitigates immediate loss risk,
              but it is not evidence of long-term retention or unchanged decision rights.
