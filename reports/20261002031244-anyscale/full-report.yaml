  - id: FE001
    title: Anyscale Production AI Compute Platform Architecture
    type: stack
    summary: >-
      Layered technical architecture illustrating developer interaction surfaces, managed runtime orchestration,
      distributed compute engines, and underlying multi-cloud hardware infrastructure.
    data:
      layers:
        - label: Developer Interaction & Interface Layer
          detail: >-
            CLI, Python SDKs, REST APIs, Model Context Protocol (MCP) surfaces, Docusaurus commercial docs, and
            collaborative Workspaces for interactive debugging and code submission.
        - label: Management, Governance & Control Plane
          detail: >-
            Multi-tenant cluster scheduling, user access control (SSO, SAML, SCIM), audit logging, job monitoring,
            OpenTelemetry instrumentation, and environment/container image management.
        - label: High-Performance Distributed Compute Engine
          detail: >-
            Ray Core distributed runtime, in-memory distributed object store, RDMA communication fabric, and Ray
            ecosystem libraries (Ray Data, Ray Train, Ray Serve, SkyRL, vLLM, SGLang).
        - label: Accelerator & Cloud Infrastructure Fabric
          detail: >-
            NVIDIA AI Enterprise, NIM microservices, multi-cloud compute orchestration (AWS, Azure, GCP, Nebius,
            CoreWeave), Kubernetes/VM runtimes, and Nscale vertically integrated data centers.
        - label: Storage, Object Cache & Data Transport Fabric
          detail: >-
            Shared memory object store, local NVMe spill-over caching, cross-node RDMA networking, and cloud object
            store integration (Amazon S3, Azure Blob, Google Cloud Storage).
        - label: Hardware Acceleration & Custom Compute Substrates
          detail: >-
            NVIDIA HGX/DGX, NVL72 rack-scale systems, Google TPUs, and Nscale high-density green energy data center
            clusters.
    approximationNotes: >-
      Architectural layers represent functional abstractions based on Anyscale platform documentation, Ashby
      infrastructure engineering job descriptions, and NVIDIA partnership disclosures.
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE005
      - CE008
      - CE009
      - CE010
      - CE012
  - id: FU001
    title: Customer Journey and Enterprise Adoption Lifecycle
    type: journey-map
    summary: >-
      Maps the progression of machine learning teams from open-source Ray experimentation to enterprise BYOC production
      contracts and multi-cloud expansion.
    data:
      items:
        - label: Open-Source Ray Discovery
          description: >-
            Developers adopt open-source Ray on laptops or small clusters to parallelize Python code and scale ML
            workloads.
          touchpoints:
            - Open-source GitHub repository and Python pip/conda install
            - Local scripting and initial distributed task decorators
            - Community forums and documentation tutorials
        - label: Self-Service Trial & Workspaces
          description: >-
            Teams experience operational friction with self-managed clusters and adopt Anyscale hosted workspaces for
            interactive cloud development.
          touchpoints:
            - Promotional starter credits ($100) for hosted evaluation
            - VS Code and JupyterLab remote cloud workspace connections
            - Pay-as-you-go credit card or self-service metering via Metronome
        - label: Production Job & Service Promotion
          description: >-
            Developers promote tested workspace code directly into managed batch jobs, Ray Data pipelines, or Ray Serve
            endpoints.
          touchpoints:
            - Automated cluster lifecycle management and node autoscaling
            - Direct promotion from workspace code to versioned production jobs
            - Heterogeneous CPU/GPU scheduling and fault tolerance
        - label: Enterprise BYOC Deployment
          description: >-
            Platform teams deploy Anyscale within their dedicated cloud VPC (AWS, GCP, Azure) to maintain data
            sovereignty and utilize cloud commitments.
          touchpoints:
            - Single-tenant data plane inside customer AWS/GCP/Azure account
            - 'Enterprise security: SSO, SAML, SCIM, and project access controls'
            - Cloud marketplace contract billing through AWS, Azure, or GCP
        - label: Multi-Cloud & Neocloud Expansion
          description: >-
            Organizations scale multi-model inference and distributed training across heterogeneous cloud providers and
            Nscale GPU infrastructure.
          touchpoints:
            - Multi-cloud workload portability without code rewrites
            - Unified billing and contract reconciliation across clouds
            - Co-designed full-stack GPU infrastructure integration
        - label: Long-Term Expansion & Ecosystem Integration
          description: >-
            Enterprises standardize company-wide distributed AI operations and compound agent pipelines on Anyscale and
            Ray orchestration.
          touchpoints:
            - Standardization across company-wide generative AI roadmaps
            - Compound AI system deployments integrating LLMs and tools
            - Continuous workload optimization and dedicated engineering SLAs
    approximationNotes: >-
      Journey map stages reflect documented product onboarding pathways, Metronome billing case study, and enterprise
      platform architecture.
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU005
      - CU011
      - CU013
