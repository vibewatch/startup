  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: M&A Integration, Ownership Restructuring, and Foundation Governance
        blocks:
          - type: paragraph
            body: >-
              Anyscale entered into a definitive agreement in July 2026 to be acquired by UK-based neocloud operator
              Nscale for a reported $1.65 billion, representing an enterprise valuation step-up from its $1.38 billion
              Series C valuation in 2022. The transaction alters counterparty governance by absorbing Anyscale's entire
              200-person workforce into a vertically integrated infrastructure provider that raised $2 billion in Series
              C capital in March 2026. However, diligence indicates a sharp structural boundary between Anyscale's
              commercial assets and the underlying open-source ecosystem: Ray's codebase, trademarks, and technical
              roadmap were donated to the neutral PyTorch Foundation in October 2025. Consequently, Nscale acquires only
              the proprietary commercial control plane, hosted orchestration APIs, and commercial customer contracts,
              preventing code monopolization but introducing multi-cloud neutrality friction for customers running
              workloads outside Nscale's European data center network.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
