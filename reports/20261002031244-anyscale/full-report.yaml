    summary: >-
      Anyscale progressed from Ray commercialization through venture financing, a CEO transition, foundation governance
      for Ray, and a pending strategic combination with Nscale.
    data:
      items:
        - date: '2019'
          label: Company founded
          detail: Robert Nishihara, Philipp Moritz, Ion Stoica, and Michael I. Jordan founded Anyscale.
          tone: neutral
          claimRefs:
            - CO001
        - date: 2019-12
          label: Series A announced
          detail: $20.6M Series A led by Andreessen Horowitz with six named participating investors.
          tone: positive
