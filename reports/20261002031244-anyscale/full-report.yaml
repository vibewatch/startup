            body: >-
              From an underwriting perspective, Anyscale presents substantial financial visibility gaps that prevent
              traditional DCF or revenue-multiple underwriting. Because Anyscale remained private until its pending
              acquisition by Nscale, vital financial health metrics—including gross margin, infrastructure hosting COGS,
              customer acquisition cost (CAC) payback, customer count, and burn rate—have never been publicly disclosed.
