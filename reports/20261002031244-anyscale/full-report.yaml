    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and current corporate status
        blocks:
          - type: paragraph
            body: >-
              Anyscale was founded in 2019 by Ray creators Robert Nishihara, Philipp Moritz, and Ion Stoica together
              with UC Berkeley professor Michael I. Jordan, and independent company profiles place its headquarters in
              San Francisco. Its commercial identity is distinct from the open-source project: Anyscale sells a managed
              platform built on Ray for data preparation, distributed training, embedding generation, post-training, and
              other compute-intensive AI workloads across clouds and accelerators. On July 30, 2026, Anyscale announced
              a definitive agreement to join Nscale. The available official text describes post-closing plans rather
              than confirming that closing has occurred, so the chapter treats Anyscale as acquisition- pending despite
              database pages that already label it acquired. TechCrunch reported that Anyscale would retain its brand
              and serve existing customers after the transaction.
            claimRefs:
