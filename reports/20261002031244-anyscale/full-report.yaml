      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Enterprise purchasing of distributed AI computing platforms is characterized by dual-persona dynamics
              where adoption is initiated by technical practitioners but governed by centralized procurement and cloud
              engineering leadership [CM014, CM015]. Machine learning engineers, foundation model builders, and data
              science leads serve as the primary users and champions, requiring seamless Python APIs, notebook
              integrations, and multi-node training capabilities without low-level cluster maintenance [CM007, CM014].
              Conversely, VP-level infrastructure heads, Chief Information Officers, and FinOps committees hold formal
              budget authority, evaluating platforms based on total cost of ownership, intelligent spot instance
              savings, SOC2 compliance, and support for Bring-Your-Own-Cloud (BYOC) VPC deployments to ensure sensitive
              enterprise data remains within corporate boundaries [CM005, CM015]. Adoption constraints remain
              significant: user feedback highlights moderate learning curves when adapting traditional Python code to
              distributed Ray actors and tasks, occasional studio configuration friction, and documentation gaps for
              advanced multi-node setups [CM016]. Furthermore, pricing opacity around committed enterprise discounts and
              unpredictable consumption-based GPU hour spikes complicate budget forecasting for procurement teams,
              representing a material barrier to frictionless enterprise-wide expansion [CM015, CM016].
            claimRefs:
              - CM005
              - CM007
              - CM014
              - CM015
              - CM016
