            - Hyperscaler managed Ray competitive pricing pressure
        - label: High Likelihood
          values:
            - Non-critical SDK tooling bugs
            - Spot instance preemption interruptions
            - Enterprise cloud spend budget friction
        - label: Medium Likelihood
          values:
            - Minor telemetry schema drift
            - Enterprise BYOC configuration overhead
            - Customer attrition to self-hosted KubeRay on Kubernetes
        - label: Low Likelihood
          values:
            - Documentation formatting errors
            - Open-source Ray governance capture
            - M&A regulatory veto or antitrust transaction block
        - label: Remote Likelihood
          values:
            - Core Ray algorithm deprecation
            - Multi-cloud network isolation failure
            - Sudden upstream PyTorch Foundation dissolution
        - label: Hypothetical Boundary
          values:
            - Complete public cloud API shutdown
            - Global Python runtime obsolescence
            - Simultaneous multi-region datacenter total failure
