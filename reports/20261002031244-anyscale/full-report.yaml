  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Distributed Computing Architecture and Managed Ray Runtime
        blocks:
          - type: paragraph
            body: >
              Anyscale provides a commercial distributed computing platform engineered on the open-source Ray framework,
              designed to scale Python-native artificial intelligence and machine learning workloads across
              heterogeneous clusters. At its foundation, the platform decouples the developer experience from low-level
              distributed infrastructure management, allowing engineering teams to scale workloads from single-node
              prototypes to multi-thousand-node distributed clusters without rewriting underlying application logic. The
              architecture separates responsibilities into a centralized control plane—managing cluster lifecycle,
              multi-tenant scheduling, user authentication, and resource quotas—and an optimized data plane that
              executes distributed tasks, actor state management, and high-throughput inter-node communications.


              The core computing engine leverages Ray's distributed in-memory object store and direct Remote Direct
              Memory Access (RDMA) transport protocols to deliver high-bandwidth, low-latency inter-process
              communication essential for large-scale model training and high-throughput batch inference. To accommodate
              heterogeneous hardware environments, the runtime features fine-grained hardware scheduling that enables
              individual Python functions and classes to specify distinct CPU, GPU, and accelerator requirements. The
              platform orchestrates execution across both virtual-machine and Kubernetes-based cluster topologies across
              AWS, Azure, and Google Cloud Platform, as well as alternative GPU infrastructure providers including
              Nebius and CoreWeave. This multi-cloud abstraction shields enterprise machine learning workflows from
              hyperscaler-specific APIs while optimizing GPU availability.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE008
              - CE009
