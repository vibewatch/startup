  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The commercial AI compute orchestration and distributed computing platform market sits at the critical
              intersection of modern data engineering, foundation model development, and cloud infrastructure management
              [CM001]. The addressable domain spans distributed training of foundation models, high-throughput
              multimodal data curation, large-scale batch inference, and emerging post-training alignment frameworks
              such as reinforcement learning [CM002, CM008]. It explicitly excludes undifferentiated raw infrastructure
              provisioning such as unmanaged virtual machine leases, commodity bare-metal hardware, and non-distributed
              ETL pipelines that do not require distributed Python runtime orchestration [CM003]. The principal
              status-quo substitute for commercial orchestration is self-hosted open-source framework management, where
              engineering teams deploy upstream Ray or Spark directly on raw cloud compute or unmanaged Kubernetes
              clusters [CM004]. While self-hosting avoids software platform markups, it shifts substantial hidden costs
              onto engineering payroll, operational troubleshooting, and custom autoscaling infrastructure [CM005,
              CM014]. Anyscale bridges this gap by packaging open-source Ray into a production-grade managed platform
              with fine-grained accelerator allocation, intelligent spot instance management yielding up to 60% compute
              cost reductions, and integrated developer tooling [CM005, CM007]. Recent industry developments, including
              the general availability of Anyscale Agent Skills in April 2026, extend this boundary into AI-assisted
              development lifecycles, equipping coding agents to generate, optimize, and debug distributed Ray workloads
              at 5x development speed [CM006].
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
