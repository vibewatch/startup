      - number: '2.2'
        title: Market Sizing Lenses, Growth Drivers, and Industry Consolidation
        blocks:
          - type: paragraph
            body: >-
              Evaluating the total market opportunity for distributed AI computing requires analyzing multiple distinct
              spending layers rather than relying on a single top-down estimate [CM009]. Sizing lenses differentiate
              between the broader enterprise cloud and AI infrastructure market, the specialized distributed machine
              learning platform segment, and the serviceable beachhead of commercial Ray-managed enterprise workloads
              [CM009, CM010]. Market expansion is driven by exponential growth in foundation model scale, data volumes
              expanding across enterprises, and the imperative to maximize expensive accelerator utilization across
              heterogeneous clouds [CM002, CM011]. However, rigorous market sizing faces structural visibility
              limitations because private pure-play distributed compute providers do not publish audited annual
              recurring revenue or workload segment breakdowns [CM010, CM012]. External estimates vary wildly: while
              third-party company profiling databases like LeadIQ estimate Anyscale revenue at $250 million to $500
              million, credible financial reporting from Bloomberg and TechCrunch revealed that Anyscale agreed to be
              acquired by British neo-cloud Nscale for $1.65 billion in July 2026 following a 70% sequential quarterly
              revenue increase, demonstrating strong commercial momentum alongside vertical compute consolidation
              [CM012, CM013]. This vertical integration trend underscores that standalone distributed software layers
              are increasingly coupling with neo-cloud power, datacenter, and hardware infrastructure to capture a
              larger share of enterprise AI capital expenditures [CM013].
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM007
              - CM009
              - CM010
              - CM012
