  - id: TE002
    title: Enterprise Machine Learning Workflow and Use-Case Mapping
    columns:
      - userJob
      - traditionalWorkflow
      - anyscaleSolution
      - measurableBenefit
      - operationalLimitation
    rows:
      - - Multimodal Data Curation
        - Fragmented Spark/Python batch jobs with disk serialization bottlenecks.
        - Ray Data streaming pipelines on Anyscale with shared memory object store.
        - Eliminates intermediate serialization; accelerates high-throughput video/image/audio preprocessing.
        - Requires memory-intensive node sizing; object store spills to local disk when cluster RAM is exhausted.
      - - Distributed Model Training
        - Manual MPI cluster setup, static node allocation, and brittle fault recovery.
        - Elastic Ray cluster training with PyTorch/Ray Train integration and GPU observability.
        - Automated node provisioning, pooled GPU sharing, and dynamic task scheduling across nodes.
        - >-
          Distributed training communication efficiency remains bounded by inter-node network fabric (RDMA/InfiniBand vs
          TCP).
      - - Production Model Serving
        - Static container replicas with rigid resource allocations and slow autoscaling.
        - Ray Serve continuous batching and multi-model composition with fractional GPU sharing.
        - High token throughput (up to 66 tokens/sec on LLMs) and low time-to-first-token latency (0.21s).
        - High-throughput serving performance is sensitive to model quantization and accelerator memory bandwidth.
      - - Documentation & Developer Workflow
        - Fragmented documentation wikis, manual API references, and unverified code snippets.
        - Automated docs engineering platform using Docusaurus, Sphinx, dynamic SDK generation, and executable CI.
        - Ensures developer code accuracy and synchronizes OSS Ray docs with proprietary platform APIs.
        - >-
          Maintaining dual documentation pipelines across open-source Sphinx and proprietary Docusaurus introduces
          engineering overhead.
    notes: >-
      Workflow mappings synthesized from Anyscale technical product documentation, NVIDIA partnership benchmarks, and
      Ashby developer platform specs.
