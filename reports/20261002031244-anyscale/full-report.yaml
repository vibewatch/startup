        title: Capitalization, investors, and operating scale
        blocks:
          - type: paragraph
            body: >-
              The public financing record is directionally clear but numerically inconsistent. The company announced a
              $20.6 million Series A led by Andreessen Horowitz, with NEA, Intel Capital, Ant Financial, Amplify
              Partners, 11.2 Capital, and The House Fund participating. Independent databases agree on a 2020 Series B
              and a later Series C, but they differ on dates, aggregation, valuation, and total capital: Tracxn reports
              $281 million across four rounds, Multiples reports $259 million across four rounds, and Forge displays
              $426.73 million total funding. Those figures should not be blended into a synthetic total without a cap
              table and financing documents. Operating disclosure is likewise partial: Anyscale said its most recent
              quarter before the transaction announcement grew revenue by more than 70% sequentially, but neither that
              statement nor the assigned pool discloses absolute revenue, ARR, customer count, gross margin, or cash
              availability.
