      - number: '6.3'
        title: Adoption Trajectory, Retention Durability, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Anyscale's commercial expansion is driven by a land-and-expand motion that begins with individual
              developers leveraging Ray's open-source compute engine—which has amassed over 500 million downloads and
              41,000 GitHub stars—and progresses to paid team workspaces, self-service consumption, and enterprise
              commitments [CU001, CU004, CU010]. To support this multi-channel expansion, Anyscale integrated Metronome
              to unify billing across self-service credit purchases, usage-based metering, and marketplace listings on
              AWS, Azure, and Google Cloud [CU005, CU011]. Ahead of its $1.65 billion acquisition agreement by British
              AI neocloud Nscale in July 2026, Anyscale reported 70% sequential quarterly revenue growth and
              demonstrated 90%+ enterprise retention across key accounts [CU002, CU012]. However, critical customer
              durability indicators—including total paying customer count, net revenue retention (NRR), gross revenue
              retention (GRR), and revenue concentration among top anchor accounts—remain undisclosed private metrics.
              Furthermore, self-managed Ray and alternative hyperscaler managed services create long-term procurement
              friction, while audit logging limitations on hosted evaluation clouds restrict compliance in regulated
              enterprise environments [CU013, CU014, CU015, CU016].
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
