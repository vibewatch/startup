      - number: '1.4'
        title: Milestones and implications of joining Nscale
        blocks:
          - type: paragraph
            body: >-
              The milestone sequence shows a company moving from open-source commercialization through venture scaling
              and leadership professionalization into strategic consolidation. The reported $1.65 billion purchase price
              is attributed by TechCrunch to Bloomberg and an anonymous source; the companies did not disclose
              consideration in the assigned evidence, so it is a reported transaction value rather than a verified
              contractual price. Strategically, Anyscale says the combination should pair its software with Nscale's
