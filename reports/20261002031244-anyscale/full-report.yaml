  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Structural Dynamics
        blocks:
          - type: paragraph
            body: >-
              The market for distributed AI compute orchestration has bifurcated into distinct structural layers:
              integrated hyperscaler managed platforms, bare-metal GPU neoclouds with native Kubernetes support,
              self-managed open-source orchestrators, and specialized serverless AI execution runtimes. Anyscale's
              strategic position centers on its authority as the creator of Ray, the open-source distributed Python
              framework that has reached over 500 million downloads and 41,000 GitHub stars. However, Anyscale's
              commercial offering historically operated as a software control plane layered on top of third-party public
              cloud providers including AWS, GCP, and Azure. This control-plane architecture created structural
              vulnerability against established cloud giants: AWS commands 19.1% of AI infrastructure market share
              ($7,186.7 million in revenue), Google Cloud holds 14.5% ($5,439.8 million), and Microsoft Azure controls
              13.7% ($5,161.6 million), representing a combined hyperscaler market share approaching 47%. Hyperscalers
              provide native Ray support via managed Kubernetes operators such as KubeRay on Amazon EKS and Google Cloud
              GKE without charging third-party platform orchestrator markups. To escape reliance on US hyperscalers and
              capture infrastructure margin, Anyscale entered a definitive agreement in July 2026 to be acquired by
              British sovereign AI neocloud Nscale for $1.65 billion, pairing Ray software orchestration with European
              sovereign data centers.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
