    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Mechanics
        blocks:
          - type: paragraph
            body: >-
              Anyscale monetizes the commercial adoption of the open-source Ray compute framework by offering a hosted
              enterprise control plane, managed Ray cluster orchestration, and dedicated workload management across
              public clouds and on-premises environments. While the underlying open-source Ray framework was donated to
              the PyTorch Foundation in October 2025 and remains free and community-governed, Anyscale operates on a
              subscription-based revenue model where clients pay for platform access and managed runtime compute
              management. Enterprise contracts span licensing agreements and service commitments, while self-service
              managed clusters carry an estimated 1.5x to 2x operational markup over raw bare-metal GPU rates. In its
              most recent quarterly disclosure prior to the announced acquisition by Nscale, Anyscale reported 70%
              sequential revenue growth, although exact annual recurring revenue (ARR), recognized revenue, and net
              revenue retention (NRR) remain undisclosed private metrics.
