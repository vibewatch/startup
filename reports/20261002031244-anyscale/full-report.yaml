      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Open-Source Ray as a Zero-CAC Enterprise Adoption Engine
            body: >-
              Anyscale's customer acquisition strategy benefits fundamentally from open-source Ray's position as the de
              facto distributed computing runtime in Python. With over 500 million downloads and adoption by AI leaders
              like OpenAI and Uber, developers build on Ray long before commercial procurement begins. This dynamic
              allows Anyscale to convert existing technical adoption into enterprise BYOC contracts with minimal initial
              friction [CU001, CU002, CU010].
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU010
          - type: callout
            title: Private Unit Economics and Hosted Environment Compliance Limits
            body: >-
              While customer satisfaction and production velocity gains at anchor accounts like Canva are documented,
              private underwriting is severely constrained by the absence of published ARR, customer counts, and net
              revenue retention figures. Additionally, operational trade-offs—such as audit logging being disabled by
              default and unavailable on hosted evaluation clouds—create procurement hurdles in regulated enterprise
              verticals [CU006, CU014, CU015, CU016].
            calloutType: risk
            claimRefs:
              - CU006
