      - number: '6.2'
        title: Production Deployments and Quantified Outcomes
        blocks:
          - type: paragraph
            body: >-
              Publicly verified customer case studies demonstrate significant operational acceleration and compute cost
              reductions when transitioning to Anyscale's managed Ray platform. In one prominent deployment, visual
              communication platform Canva transitioned distributed model training across its suite of over 100 machine
              learning models to Anyscale, achieving up to 12x faster innovation velocity—reducing single-epoch image
              classification training time from 90 minutes to 6 minutes—while achieving full GPU saturation at peak load
              [CU006, CU007]. Beyond Canva, enterprise technology leaders such as Coinbase utilize Anyscale for
              production ML infrastructure, Runway powers video AI generation pipelines, and Bedrock Robotics leverages
              the platform for physical simulation workloads [CU002, CU008]. Similarly, AWS architecture technical
              briefs document that enterprises deploy Anyscale alongside Ray Serve and AWS machine learning accelerators
              to reduce training and inferencing latency while eliminating the platform engineering overhead of
              self-managed KubeRay clusters [CU003, CU009].
            claimRefs:
              - CU002
              - CU003
              - CU006
              - CU007
              - CU008
              - CU009
