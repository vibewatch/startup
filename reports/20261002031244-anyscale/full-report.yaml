      - number: '3.3'
        title: Switching Costs, Lock-in, and Sovereign Defensibility
        blocks:
          - type: paragraph
            body: >-
              Anyscale's moat durability is constrained by the open-source nature of Ray itself, which remains licensed
              under Apache 2.0 within the PyTorch Foundation ecosystem. Because Ray code is portable across any
              infrastructure running KubeRay or vanilla Python head nodes, software switching costs away from Anyscale
              to self-hosted KubeRay on EKS, GKE, or bare-metal clouds are technically modest for mature engineering
              organizations. However, Anyscale retains meaningful operational stickiness through proprietary control
              plane capabilities: curated Docker environments for RLHF post-training (such as OpenRLHF and GRPO),
              turnkey Ray Serve autoscaling, and recent releases like Anyscale Agent Skills for on-call automated
              remediation across day 0 build, day 1 deploy, and day 2 operate phases. Crucially, the 2026 merger with
              Nscale repositions the combined company around sovereign AI infrastructure, targeting the 40.1% of
              enterprise AI decision-makers who require private or sovereign cloud environments and the 52.6% who cite
              data privacy compliance as a primary production bottleneck. By embedding Anyscale's orchestration into
              European sovereign GPU data centers, the combined entity creates a defensible compliance wedge against US
              hyperscalers, although retention of open-source developer goodwill post-acquisition remains an ongoing
              operational test.
            claimRefs:
              - CP002
              - CP003
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Open-Source Commoditization and Forking Threat
            body: >-
              Because Ray is governed as an open-source framework under the PyTorch Foundation, Anyscale cannot
              establish a proprietary software lock-in on Ray's foundational API. As demonstrated by Spheron, AWS, and
              GCP, enterprise customers can replicate Ray cluster orchestration using the open-source KubeRay operator
              on vanilla Kubernetes, avoiding Anyscale's 50% to 100% platform markup. Anyscale's long-term commercial
              margin durability depends entirely on value-added proprietary layers like Anyscale Runtime, Agent Skills,
              and Nscale sovereign hardware co-design.
            calloutType: risk
            claimRefs:
              - CP002
              - CP007
              - CP008
              - CP014
          - type: callout
            title: Strategic Rationale Behind the Nscale Combination
            body: >-
              The July 2026 Nscale acquisition transforms Anyscale from a pure control-plane software reseller
              vulnerable to hyperscaler margin compression into an integrated sovereign infrastructure powerhouse. By
              pairing Ray's distributed computing engine with Nscale's European sovereign data centers, the combined
              entity directly addresses the 52.6% of enterprise organizations constrained by data sovereignty
              regulations, opening a defensible non-US enterprise market.
            calloutType: insight
            claimRefs:
              - CP003
              - CP005
              - CP006
