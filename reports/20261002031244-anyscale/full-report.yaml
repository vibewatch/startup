              - CR013
              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Dual-Edged Nature of Open-Source Governance Protection
            body: >-
              The donation of Ray to the PyTorch Foundation in October 2025 provides customers with absolute protection
              against proprietary code capture following Anyscale's acquisition by Nscale. However, this neutrality
              simultaneously functions as an existential commercial vulnerability: because Ray runs identically across
              any cloud or Kubernetes environment, Anyscale cannot build a proprietary lock-in moat around the runtime,
              leaving it vulnerable to commoditization by KubeRay and hyperscaler cloud services.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Anti-Thesis, and Strategic Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for Anyscale rests on its foundational custody of Project Ray, the dominant
              open-source framework for distributed artificial intelligence workloads and foundation model scaling. With
              over 500 million downloads and pervasive deployment across tier-one enterprises, Anyscale established an
              indispensable operational position in distributed training, batch embedding generation, and post-training
              orchestration. However, the anti-thesis emphasizes that Ray's open-source accessibility enables large
              hyperscalers and sophisticated enterprises to self-host or build managed runtime offerings without paying
              commercial software licensing fees to Anyscale. While sequential quarterly revenue expanded by 70%
              immediately preceding the transaction, the absence of publicly disclosed absolute ARR, net revenue
              retention, and gross margins created structural valuation uncertainty. Given Nscale's agreed $1.65 billion
              acquisition, our valuation stance is fair with a transaction-anchored hold recommendation, balancing
              substantial strategic multiple support against standalone commercial monetization limits.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV011
      - number: '8.2'
        title: Historical Financing Context, Private Secondary Markets, and M&A Benchmarks
        blocks:
          - type: paragraph
            body: >-
              Anyscale raised a cumulative total of $281 million across institutional funding rounds from 2019 through
              2022, backed by premier investors including Andreessen Horowitz, New Enterprise Associates, Addition,
              Intel Capital, and Foundation Capital. Following its $20.6 million Series A in 2019 and $40 million Series
              B in 2020, the company achieved unicorn status with a $1.0 billion valuation in its October 2021 Series C,
              later expanded to a $1.38 billion mark in 2022. In secondary private markets prior to the acquisition,
              indicative pricing displayed significant volatility; platforms such as Nasdaq Private Market quoted
              trading prices at $4.26 per share in September 2026 (a 13.86% increase over September 2024), while
              analytical models from PM Insights indicated bid-ask spreads reflecting an implied 99.22% premium against
              prior primary rounds. The announced $1.65 billion acquisition by Nscale establishes a definitive
              transaction benchmark that resolves private market illiquidity while providing full employment continuity
              for Anyscale's approximately 200 staff members.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: Scenario Valuation Multiples, Exit Realization, and Diligence Verification
        blocks:
          - type: paragraph
            body: >-
              Evaluating Anyscale's strategic value across bull, base, and bear scenarios highlights contrasting
              outcomes between sovereign AI compute consolidation and standalone execution headwinds. Under the base
              case, which reflects the definitive Nscale transaction terms, Nscale integrates Anyscale's 200 engineers
              and Ray software stack directly with its multi-gigawatt European data center infrastructure, validating
              the $1.65 billion enterprise valuation at an estimated 15x to 22x EV/ARR multiple on unconfirmed revenue.
              In a standalone bull scenario, hyper-accelerated adoption of distributed reinforcement learning frameworks
              like SkyRL and veRL would have sustained greater than 70% sequential growth, justifying valuations
              exceeding $2.5 billion. Conversely, a bear scenario reflects potential antitrust intervention, customer
              platform churn to native cloud managed Ray distributions, or failure to convert open-source users into
              paying accounts. Critical pre-closing diligence must confirm precise audited ARR run-rates, customer
              retention economics, and Nscale integration governance.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV011
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Transaction Certainty Anchors Enterprise Value
            body: >-
              With a signed definitive acquisition agreement by Nscale at $1.65 billion, investors should treat current
              equity value as anchored to transaction execution rather than speculative public SaaS revenue multiples.
              Closing probability is high given vertical operational alignment.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV011
          - type: callout
            title: Commercial Disclosure Opacity Constrained Standalone Multiples
            body: >-
              Anyscale's inability or reluctance to disclose public ARR and unit retention metrics highlighted the
              structural difficulty of capturing value from open-source distributed frameworks, driving the rational
              decision to exit via vertical acquisition.
            calloutType: risk
            claimRefs:
              - CV002
              - CV005
              - CV014
