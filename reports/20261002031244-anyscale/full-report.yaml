              - CR010
      - number: '7.3'
        title: Hyperscaler Platform Dependency, Open-Source Substitution, and Hardware Concentration
        blocks:
          - type: paragraph
            body: >-
              Anyscale faces acute partner concentration and platform substitution exposure. Its commercial value
              proposition depends directly on access to top-tier accelerator hardware, specifically NVIDIA H100, A100,
              and next-generation GPU families, creating supply bottlenecks during global compute shortages.
              Simultaneously, Anyscale operates in direct competition with the public cloud providers upon whose
              infrastructure its BYOC customer clusters reside. Major hyperscalers including AWS, Google Cloud, and
              Microsoft Azure offer native managed Kubernetes and Ray support, creating continuous disintermediation
              pressure. In addition, the maturation of open-source tooling such as KubeRay and community scheduling
              operators enables sophisticated enterprise engineering teams to self-host distributed Ray workloads,
              directly constraining Anyscale's ability to command high software premiums over underlying compute costs.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
