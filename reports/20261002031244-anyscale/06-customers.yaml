figures:
  - id: "FU001"
    title: "Customer Journey and Enterprise Adoption Lifecycle"
    type: "journey-map"
    summary: "Maps the progression of machine learning teams from open-source Ray experimentation to enterprise BYOC production contracts and multi-cloud expansion."
    data:
      items:
        - label: "Open-Source Ray Discovery"
          description: "Developers adopt open-source Ray on laptops or small clusters to parallelize Python code and scale ML workloads."
          touchpoints:
            - "Open-source GitHub repository and Python pip/conda install"
            - "Local scripting and initial distributed task decorators"
            - "Community forums and documentation tutorials"
        - label: "Self-Service Trial & Workspaces"
          description: "Teams experience operational friction with self-managed clusters and adopt Anyscale hosted workspaces for interactive cloud development."
          touchpoints:
            - "Promotional starter credits ($100) for hosted evaluation"
            - "VS Code and JupyterLab remote cloud workspace connections"
            - "Pay-as-you-go credit card or self-service metering via Metronome"
        - label: "Production Job & Service Promotion"
          description: "Developers promote tested workspace code directly into managed batch jobs, Ray Data pipelines, or Ray Serve endpoints."
          touchpoints:
            - "Automated cluster lifecycle management and node autoscaling"
            - "Direct promotion from workspace code to versioned production jobs"
            - "Heterogeneous CPU/GPU scheduling and fault tolerance"
        - label: "Enterprise BYOC Deployment"
          description: "Platform teams deploy Anyscale within their dedicated cloud VPC (AWS, GCP, Azure) to maintain data sovereignty and utilize cloud commitments."
          touchpoints:
            - "Single-tenant data plane inside customer AWS/GCP/Azure account"
            - "Enterprise security: SSO, SAML, SCIM, and project access controls"
            - "Cloud marketplace contract billing through AWS, Azure, or GCP"
        - label: "Multi-Cloud & Neocloud Expansion"
          description: "Organizations scale multi-model inference and distributed training across heterogeneous cloud providers and Nscale GPU infrastructure."
          touchpoints:
            - "Multi-cloud workload portability without code rewrites"
            - "Unified billing and contract reconciliation across clouds"
            - "Co-designed full-stack GPU infrastructure integration"
        - label: "Long-Term Expansion & Ecosystem Integration"
          description: "Enterprises standardize company-wide distributed AI operations and compound agent pipelines on Anyscale and Ray orchestration."
          touchpoints:
            - "Standardization across company-wide generative AI roadmaps"
            - "Compound AI system deployments integrating LLMs and tools"
            - "Continuous workload optimization and dedicated engineering SLAs"
    approximationNotes: "Journey map stages reflect documented product onboarding pathways, Metronome billing case study, and enterprise platform architecture."
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU011"
      - "CU013"
callouts:
  - calloutType: "insight"
    title: "Open-Source Ray as a Zero-CAC Enterprise Adoption Engine"
    body: "Anyscale's customer acquisition strategy benefits fundamentally from open-source Ray's position as the de facto distributed computing runtime in Python. With over 500 million downloads and adoption by AI leaders like OpenAI and Uber, developers build on Ray long before commercial procurement begins. This dynamic allows Anyscale to convert existing technical adoption into enterprise BYOC contracts with minimal initial friction [CU001, CU002, CU010]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU010"
  - calloutType: "risk"
    title: "Private Unit Economics and Hosted Environment Compliance Limits"
    body: "While customer satisfaction and production velocity gains at anchor accounts like Canva are documented, private underwriting is severely constrained by the absence of published ARR, customer counts, and net revenue retention figures. Additionally, operational trade-offs—such as audit logging being disabled by default and unavailable on hosted evaluation clouds—create procurement hurdles in regulated enterprise verticals [CU006, CU014, CU015, CU016]."
    claimRefs:
      - "CU006"
      - "CU014"
      - "CU015"
      - "CU016"
