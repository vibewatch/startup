chapter:
  number: 6
  title: "Customers"
  summary: "Anyscale serves prominent AI scale-ups, enterprise tech platforms, and foundation-model developers that require distributed Ray orchestration across multi-cloud and private VPC infrastructure. Production case studies including Canva, Uber, OpenAI, and Coinbase demonstrate measurable throughput and cost gains, but aggregate customer counts, net revenue retention, and customer concentration remain private metrics."
sections:
  - id: "customer-segmentation-and-buyer-profiles"
    title: "Customer Segmentation and Buyer Personas"
    body: "Anyscale segments its commercial customer base across three primary demand tiers: large-scale consumer and enterprise digital platforms running production machine learning at scale (e.g., Canva, Uber, Spotify, Instacart), foundation-model and generative AI developers operating distributed training and inference pipelines (e.g., OpenAI, Runway, Bedrock Robotics), and enterprise IT infrastructure teams seeking managed Ray governance without managing raw Kubernetes clusters directly. Across these segments, the economic buyer is typically a VP of AI Infrastructure, Head of Machine Learning Platform, or CTO, while the primary end users are machine learning engineers and distributed Python developers. Workloads typically enter Anyscale via product-led growth trials, open-source Ray project familiarity, or cloud marketplace procurement across AWS, Google Cloud, and Microsoft Azure. In enterprise and BYOC (Bring Your Own Cloud) deployments, the platform runs directly within the customer's cloud account and virtual private cloud (VPC) to inherit corporate security boundaries and existing cloud provider discount commitments [CU001, CU002, CU003, CU004, CU005]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU001"
  - id: "production-deployments-and-customer-proof"
    title: "Production Deployments and Quantified Outcomes"
    body: "Publicly verified customer case studies demonstrate significant operational acceleration and compute cost reductions when transitioning to Anyscale's managed Ray platform. In one prominent deployment, visual communication platform Canva transitioned distributed model training across its suite of over 100 machine learning models to Anyscale, achieving up to 12x faster innovation velocity—reducing single-epoch image classification training time from 90 minutes to 6 minutes—while achieving full GPU saturation at peak load [CU006, CU007]. Beyond Canva, enterprise technology leaders such as Coinbase utilize Anyscale for production ML infrastructure, Runway powers video AI generation pipelines, and Bedrock Robotics leverages the platform for physical simulation workloads [CU002, CU008]. Similarly, AWS architecture technical briefs document that enterprises deploy Anyscale alongside Ray Serve and AWS machine learning accelerators to reduce training and inferencing latency while eliminating the platform engineering overhead of self-managed KubeRay clusters [CU003, CU009]."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
    tableRefs:
      - "TU003"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory-retention-and-concentration-risks"
    title: "Adoption Trajectory, Retention Durability, and Diligence Blockers"
    body: "Anyscale's commercial expansion is driven by a land-and-expand motion that begins with individual developers leveraging Ray's open-source compute engine—which has amassed over 500 million downloads and 41,000 GitHub stars—and progresses to paid team workspaces, self-service consumption, and enterprise commitments [CU001, CU004, CU010]. To support this multi-channel expansion, Anyscale integrated Metronome to unify billing across self-service credit purchases, usage-based metering, and marketplace listings on AWS, Azure, and Google Cloud [CU005, CU011]. Ahead of its $1.65 billion acquisition agreement by British AI neocloud Nscale in July 2026, Anyscale reported 70% sequential quarterly revenue growth and demonstrated 90%+ enterprise retention across key accounts [CU002, CU012]. However, critical customer durability indicators—including total paying customer count, net revenue retention (NRR), gross revenue retention (GRR), and revenue concentration among top anchor accounts—remain undisclosed private metrics. Furthermore, self-managed Ray and alternative hyperscaler managed services create long-term procurement friction, while audit logging limitations on hosted evaluation clouds restrict compliance in regulated enterprise environments [CU013, CU014, CU015, CU016]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
      - "CU005"
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
    tableRefs:
      - "TU002"
