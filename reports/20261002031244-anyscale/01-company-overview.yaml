callouts:
  - calloutType: insight
    title: Transaction value is reported, not disclosed
    body: >-
      The $1.65 billion figure comes from TechCrunch citing Bloomberg and an anonymous source;
      treat it as reported consideration until contractual documents or company disclosure confirm it.
    claimRefs: [CO005]
  - calloutType: risk
    title: Open-source portability does not eliminate platform lock-in
    body: >-
      Ray's foundation governance protects the framework's openness, but customers still need
      contractual protection for hosted-control-plane pricing, roadmap neutrality, and data export.
    claimRefs: [CO011, CO016]
