company:
  name: Anyscale
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Anyscale is the 2019-founded commercial company behind Ray, with a managed platform for
    distributed AI workloads and a definitive agreement announced in July 2026 to join Nscale.
    The transaction strengthens the full-stack infrastructure thesis, but reported consideration,
    total funding, current headcount, absolute revenue, customer count, and post-close governance
    remain incompletely or inconsistently disclosed.
sections:
  - id: identity-and-current-status
    title: Identity, product, and current corporate status
    body: >-
      Anyscale was founded in 2019 by Ray creators Robert Nishihara, Philipp Moritz, and Ion
      Stoica together with UC Berkeley professor Michael I. Jordan, and independent company
      profiles place its headquarters in San Francisco. Its commercial identity is distinct from
      the open-source project: Anyscale sells a managed platform built on Ray for data preparation,
      distributed training, embedding generation, post-training, and other compute-intensive AI
      workloads across clouds and accelerators. On July 30, 2026, Anyscale announced a definitive
      agreement to join Nscale. The available official text describes post-closing plans rather
      than confirming that closing has occurred, so the chapter treats Anyscale as acquisition-
      pending despite database pages that already label it acquired. TechCrunch reported that
      Anyscale would retain its brand and serve existing customers after the transaction.
    claimRefs: [CO001, CO002, CO003, CO004, CO007]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and key-person exposure
    body: >-
      The founding team carries unusually concentrated technical credibility because it created
      Ray and links the company directly to Berkeley's distributed-systems lineage. Forge's
      curated leadership coverage says Keerti Melkote became chief executive in July 2024 while
      Nishihara shifted toward product and customer growth; a later competitor analysis also
      identifies Melkote as Anyscale CEO. Tracxn lists a five-person board comprising Ben
      Horowitz, Ion Stoica, Robert Nishihara, Peter Sonsini, and Philipp Moritz, but the assigned
      evidence does not establish whether that board will persist after closing. This creates two
      distinct dependencies: technical continuity around the Ray founders and commercial
      continuity around a relatively recent CEO. Nscale's plan for the entire reported team to
      join mitigates immediate loss risk, but it is not evidence of long-term retention or
      unchanged decision rights.
    claimRefs: [CO001, CO006, CO013, CO015]
    tableRefs: [TO002]
  - id: capitalization-and-scale
    title: Capitalization, investors, and operating scale
    body: >-
      The public financing record is directionally clear but numerically inconsistent. The
      company announced a $20.6 million Series A led by Andreessen Horowitz, with NEA, Intel
      Capital, Ant Financial, Amplify Partners, 11.2 Capital, and The House Fund participating.
      Independent databases agree on a 2020 Series B and a later Series C, but they differ on
      dates, aggregation, valuation, and total capital: Tracxn reports $281 million across four
      rounds, Multiples reports $259 million across four rounds, and Forge displays $426.73
      million total funding. Those figures should not be blended into a synthetic total without
      a cap table and financing documents. Operating disclosure is likewise partial: Anyscale
      said its most recent quarter before the transaction announcement grew revenue by more than
      70% sequentially, but neither that statement nor the assigned pool discloses absolute
      revenue, ARR, customer count, gross margin, or cash availability.
    claimRefs: [CO008, CO009, CO010, CO012, CO014]
    tableRefs: [TO003]
  - id: milestones-and-transaction-implications
    title: Milestones and implications of joining Nscale
    body: >-
      The milestone sequence shows a company moving from open-source commercialization through
      venture scaling and leadership professionalization into strategic consolidation. The
      reported $1.65 billion purchase price is attributed by TechCrunch to Bloomberg and an
      anonymous source; the companies did not disclose consideration in the assigned evidence,
      so it is a reported transaction value rather than a verified contractual price. Strategically,
      Anyscale says the combination should pair its software with Nscale's accelerated-compute
      capacity while retaining multi-cloud portability. Ray's separate PyTorch Foundation
      governance limits direct ownership of the framework, yet a competitor analysis highlights
      that open-source code does not make the hosted control plane portable. The principal
      diligence issue is therefore not whether Ray remains open, but whether pricing, roadmap
      neutrality, data export, and cloud choice remain contractually protected after a compute
      supplier owns the commercial orchestration layer.
    claimRefs: [CO004, CO005, CO008, CO011, CO016]
    figureRefs: [FO001]
