      - - Google Cloud (Ray on GKE / Vertex)
        - Hyperscaler Managed Cloud
        - Hyperscaler ($5.44B AI infra revenue; 14.5% market share)
        - GCP-native enterprise ML teams, multi-modal LLM builders
        - Official KubeRay GKE add-on, TPU Multislice and A3 Mega interconnect
        - GCP platform lock-in; US jurisdiction data privacy concerns for EU firms
      - - Spheron
        - Bare-Metal GPU Neocloud
        - Emerging GPU neocloud provider
        - Cost-sensitive AI labs, pretraining teams, custom cluster operators
        - Lowest H100 pricing ($2.65/GPU-hr), per-minute billing, zero platform markup
        - Self-managed control plane; requires in-house KubeRay & ops expertise
      - - Northflank
        - Container-Native PaaS
        - Venture-backed developer platform
        - Full-stack AI app teams, multi-service engineering organizations
        - Runs Ray alongside non-Ray APIs (FastAPI), web frontends, and CI/CD pipelines
        - Lacks proprietary deep distributed ML runtime optimizations vs Ray specialists
      - - Modal
        - Serverless Python Compute
        - Venture-backed AI infrastructure startup
        - Python engineers, batch inference jobs, serverless ML workloads
        - Simple Python function decorators (@modal.function), fast scale-to-zero
        - Not Ray-native; stateless function model unsuited for long-running Ray actors
