- id: r705-people-opacity-and-kill-criteria
  title: People, opacity, and kill criteria
  body: 'Private-company opacity is a risk amplifier here because nearly every other major question flows through it. Public materials do identify founder Wang Qian, CTO Wang Hao, the funding cadence, and selected deployments, but they stay thin on the control infrastructure investors would normally want before underwriting a consumer-adjacent robotics scale story: board composition, succession planning, safety ownership, warranty reserves, customer concentration, burn, and service economics all remain outside public view. That means even when a risk is conceptually understandable — such as a safety incident, a channel failure, or a chip shock — the company-specific cushion against it is still hard to size. The right response is not blanket dismissal; there are real mitigants in policy support, strategic capital, and human-in-loop deployment. But conviction should stay conditional on kill criteria that can be monitored rather than on narrative comfort.'
