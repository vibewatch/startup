- id: r703-commercialization-valuation-and-policy-dependence
  title: Commercialization, valuation froth, and policy dependence
  body: 'The commercialization story is real but still fragile. Yicai''s test order and Xinhua''s field reporting both show a functioning service, yet they also show a robot that is slower than a cleaner, limited to simple open-area tasks, and still accompanied by a human. Public order volume looks better as product theater than as durable unit economics: the earliest customers include families curious to see a robot and content creators filming one, while X Square''s own COO still says the company lacks a true mass-market product. Meanwhile, valuation has moved far faster than disclosure. X Square crossed the US$2.8 billion mark after four consecutive rounds, while independent commentary argues the sector is crowded, buyers are unsatisfied, and many startups are being priced on future cognition rather than current revenue. Domestic subsidies and local industrial policy meaningfully reduce near-term financing risk, but they also make it harder to separate genuine demand pull from policy-assisted
    deployment.'
  claimRefs:
