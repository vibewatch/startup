- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Compliance readiness
    - Public or diligenced proof of registration, recall process, and certifications
    - No credible compliance packet before broad home or overseas rollout
    - Treat as a major diligence blocker and delay underwriting
  - - Repeat paid adoption
    - Renewals, repeat orders, and non-novelty usage
    - Orders stay curiosity-driven or pilot-only through the next scale cycle
    - Reframe X Square as demo-rich but demand-thin
  - - Safety / privacy event
    - Material in-home incident, breach, or regulator complaint
    - One serious event without fast root-cause containment
    - Pause until liability, remediation, and trust recovery are understood
  - - AI-chip access
    - Loss of a usable high-end compute path for training or deployment
    - Export-control change materially slows model releases or retraining cadence
    - Cut international optionality and lower multiple tolerance
  - - Financing discipline
    - Next round terms and disclosure depth
    - Down-round, failed raise, or valuation support from insiders only
    - Treat recent froth as impaired and reset downside case
  - - Channel concentration
    - Dependence on 58.com or one visible enterprise cluster
    - No meaningful traction outside the flagship channel or a partner pullback
    - Underwrite as concentrated channel risk rather than broad PMF
  notes: Every row is designed as a monitorable kill criterion so the chapter can drive an invest / wait / walk decision instead of ending at generic caution.
