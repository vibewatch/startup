  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: safety-certification-insurance
    missingEvidence: Certification matrix, insurance coverage, and incident-response ownership for home deployments.
    whyItMatters: Without these materials it is hard to size liability exposure or verify that the company can scale from demos into regulated shared spaces.
    diligencePath: Request safety case, insurer certificates, incident playbooks, and any third-party test or certification documents.
    relatedQuestionRefs:
    - QR003
    - QR004
    - QR024
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: home-data-governance
    missingEvidence: Consent language, retention period, access controls, and deletion policy for household data collected during service.
    whyItMatters: Privacy exposure rises sharply once robots move from factories into homes and potentially elder-care workflows.
    diligencePath: Request booking terms, privacy notices, DPA, logging policy, and any internal red-team or privacy-review output.
    relatedQuestionRefs:
    - QR003
    - QR007
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: compute-supplier-mix
    missingEvidence: Workload-by-workload compute map, Nvidia dependency by task, and domestic substitution roadmap.
    whyItMatters: Export-control risk cannot be underwritten cleanly without knowing which parts of the stack truly depend on restricted foreign compute.
    diligencePath: Request training and inference architecture, current GPU fleet, cloud providers, and fallback performance assumptions.
    relatedQuestionRefs:
    - QR009
    - QR011
    - QR023
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-repeat-usage
    missingEvidence: Repeat-order rates, top-customer share, renewal behavior, and non-58.com demand proof.
    whyItMatters: Named channels exist, but concentration and novelty-driven demand could look very different once curiosity fades.
    diligencePath: Request cohort data by scenario, top-10 customer share, and repeat paid deployment metrics.
    relatedQuestionRefs:
    - QR017
    - QR019
    - QR022
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: governance-and-succession
    missingEvidence: Board roster, committee structure, delegated authority map, and succession plan for founder and CTO roles.
    whyItMatters: Key-person risk is harder to mitigate when governance maturity is opaque and the public narrative is concentrated on a few executives.
    diligencePath: Request governance pack, investor rights summary, succession planning, and functional leadership org chart.
    relatedQuestionRefs:
    - QR027
    - QR028
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: field-reliability-and-incidents
    missingEvidence: Task success rates, exception rates, MTBF, field incident logs, and warranty reserve data.
    whyItMatters: Without reliability evidence, it is impossible to tell whether the current home-service launch is a scalable business or a carefully supervised demo.
    diligencePath: Request operating dashboards for household and enterprise deployments plus post-mortems on any material failures.
