  topStrengths:
    - 先做“大脑”的全栈定位，把 WALL 模型、自有数据工具和 Quanta 机器人拼在一起，而不是只靠硬件噱头。
    - 家庭和服务场景的真实部署构成可信的数据采集闭环，模型质量可能比只待在实验室的同行更快复利。
    - 对一家年轻机器人公司来说，股东阵容异常强，覆盖 Alibaba、Meituan、ByteDance、Xiaomi、IDG、HongShan 和国资背景资本。
    - 轮式双臂形态比纯双足人形叙事更贴近近期服务与物流任务。
  topRisks:
    - 公开资料仍未披露确认收入、毛利率、烧钱速度、跑道、员工数或单位经济性。
    - 家庭清洁服务仍需要人工监督，也带有新奇体验属性，对长期替代人工的 ROI 证明有限。
    - 公开客户证明集中在 58.com；具名机构客户、合同条款和留存仍不透明。
    - RMB 20 billion 以上估值已经相对披露更充分的同行给出溢价，一旦牵引力走弱，降轮风险不小。
    - 作为入户部署、使用前沿芯片训练的具身 AI 公司，安全、隐私、出口管制和算力供应风险仍然关键。
  unresolvedGaps:
    - 经审计或其他确认口径的收入、ARR、毛利率、烧钱速度、现金余额和跑道。
    - 58.com 家政服务渠道的复购、留存和取消行为。
    - 58.com 之外的具名机构客户、合同规模、续约结构和客户集中度。
    - 完整股权经济条款、清算优先权、董事会权利，以及近期融资后的稀释。
    - 入户部署的安全认证、事故记录、MTBF 和隐私合规控制。
    - 算力供应韧性、训练成本结构，以及依赖 Nvidia 对利润率的影响。
