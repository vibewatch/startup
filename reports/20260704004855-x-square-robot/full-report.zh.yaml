companyProfile:
  summary: >-
    X Square Robot (自变量机器人) 是一家总部在深圳的具身 AI 初创公司，Wang Qian 于 2023 年 12 月创立。公司围绕“大脑优先”论证搭建：WALL 系列具身基础模型、闭环数据栈、Quanta X1 和
    Quanta X2 等可编程轮式机器人相互配合，部署反哺模型，模型再反哺部署。公开牵引力最强的是家庭服务，来自 58.com 保洁合作和 X Family Member 居家计划；学校、酒店、养老院也释放了收入信号，但透明度更低。到
    2026 年中，公司已推进到 Series C，估值超过 RMB 20 billion，并拿到主要互联网、创投、产业和国资系投资人支持，但核心经营经济性仍大多未披露。
