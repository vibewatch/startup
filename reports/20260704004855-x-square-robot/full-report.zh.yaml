  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与排序
        blocks:
          - type: paragraph
            body: >-
              X Square
              最大的风险不是缺某一个功能，而是早期产品、已经冲到前面的估值，以及既支持又高要求的政策环境叠在一起。公开材料显示，公司确实推出了家庭服务，也有扎实融资基础；但同样显示，家庭部署仍有人监督、任务受限，部分需求来自猎奇。行业层面，Morgan
              Stanley、TrendForce、KrASIA 和 The Next Web 指向同一个张力：商业化推进快于预期，但买方满意度和可复制经济性仍弱于涌入这个赛道的资本。放到 X
              Square，政策背书的扩张、对先进芯片的依赖以及稀疏的治理披露意味着，安全、出口准入或客户转化一旦出问题，会很快传导到融资和估值压力。
