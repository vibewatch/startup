      - number: '1.2'
        title: 领导集中度与治理不透明
        blocks:
          - type: paragraph
            body: >-
              公开领导层信息足以识别核心决策者，但不足以支撑治理尽调。公司发布和独立报道都把 Wang Qian 列为创始人兼 CEO；现有履历材料把他与清华训练、USC
              博士，以及早期机器人学习、人机交互和注意力机制研究联系起来。公开材料还把 Wang Hao 标为首席技术官，Yang Qian 标为代表融资和商业化发声的运营高管。三人合在一起，支撑了 X Square
              把前沿模型工作和真实场景运营推进结合起来的叙事。问题在于公开记录到此为止：本章审阅材料中没有独立审阅过的董事会名单、投票控制图、股东权利表或接班计划。于是出现典型的早期机器人公司格局——创始人与市场契合度强，但关键人依赖高，外部对内控能见度低。后续尽调里，这一点几乎和模型主张一样重要，因为估值接近后期私募市场区间时，治理纪律和决策冗余会更关键。
