  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标锚
      - 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - X Square Robot
        - 模型优先的具身 AI，加上家庭 / 企业部署闭环
        - '>$2.8B 私募估值，2026 年 6 月'
        - 标的公司；显示投资人当前正在承销的溢价。
        - 没有公开收入、毛利、员工人数或条款披露。
      - - Unitree
        - 2024 年收入 >RMB 1B；2025 年人形机器人收入占比 >51%；综合毛利率 60%
        - Series C 轮后估值 >RMB12B / ~$1.64B，IPO 准备推进中
        - 披露商业化和上市准备纪律方面，最好的中国可比公司。
        - 相比 X Square 的大脑优先家庭服务叙事，Unitree 更偏硬件和开发者驱动。
      - - Galbot
        - 大额融资，加上宣称中的工业订单势能
        - 估值 >RMB20B，叠加 2026 年 RMB2.5B 融资
        - 在国资支持下，最接近全栈或模型主导溢价的中国同行。
        - 经济性仍不透明，公开证据仍偏叙事。
      - - Figure AI
        - Helix + BotQ + 家庭 / 商业部署叙事
        - $39B 投后估值，承诺资本 >$1B
        - 市场愿意为认知中的品类领导者支付多少，这是全球前沿上限。
        - 资本市场、投资人基础和规模不同；不能直接套用倍数。
      - - 1X
        - 家庭人形机器人定位和 $100M Series B 轮
        - 融资已披露；本资料包未披露估值
        - 可作为家庭辅助野心和较小规模资本形成的全球参考。
        - 比 X Square 或 Figure 更早期、规模更小。
      - - UBTECH
        - RMB2.001B 收入；约 RMB820M 全尺寸人形机器人收入；订单 >RMB800M
        - 上市公司公告叠加官方交付披露
        - 披露中国人形机器人经济性和工业商业化的最佳公开参考。
        - 这是上市公司基准，不是直接的私募轮估值。
    notes: 可比公司混合了私募估值、上市文件和里程碑锚点，因为 X Square 缺少建立单一干净倍数框架所需的披露。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the most decision-relevant Chinese and global humanoid or embodied-AI peers visible in the reviewed
        2025-2026 source set, but not every private round or listed robotics company.
