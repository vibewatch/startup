  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 概率信号
      - 核心假设
      - 估值 / 回报逻辑
      - 下行触发点
    rows:
      - - 乐观
        - 25%
        - 大脑溢价被验证，家庭和企业闭环转化为经常性经济性，披露质量提升到 IPO 水平。
        - $7B-$12B 价值区间，相对当前估值有吸引力的多倍回报上行空间。
        - 如果经常性经济性始终无法兑现，或 Figure / Unitree 级别同行拉大证据差距，则情景失效。
      - - 基准
        - 50%
        - 试点逐步转化，战略资本继续支持，但 X Square 仍比真正的软件平台更偏部署、也更不透明。
        - $2.2B-$4.0B 价值区间；除非条款对投资人异常友好，否则相对当前估值上行有限。
        - 如果后续融资没有更强的经营披露支撑，则基准情景被打破。
      - - 悲观
        - 25%
        - 家庭服务变现仍然单薄，企业试点停滞；同行经济性变得更清楚后，政策或算力摩擦上升。
        - $0.8B-$1.5B 价值区间，存在可信的下轮降估值风险。
        - 触发条件：没有收入桥、重复部署疲弱，或以更苛刻条款融资。
    notes: 情景区间是委员会讨论用的 USD 区间，体现里程碑逻辑，而不是带有伪精确感的 DCF 模型。
