      - number: '5.3'
        title: 数据管线与真实世界部署闭环
        blocks:
          - type: paragraph
            body: >-
              X Square 的差异化主张同样依赖数据基础设施，而不只依赖模型架构。公司称，机器人缺的不是通用互联网规模文本，而是快速、高质量的物理交互数据。因此，XRZero-G0 和更广的 QUANXTA Zero
              家族被定位成一套硬件软件工作流，用来采集、同步、清洗、标注、训练、评估和回放操作数据，成本低于传统纯机器人采集。公开代码库和行业报道描述的系统混合了无机器人采集、人体工学界面、闭环质量检查和跨本体迁移，并声称吞吐量约在每小时
              93 到 100 个示教。X Square 再通过把机器人推入在线环境来闭环。Quanta X1 食品配送、包裹分拣、58.com 家庭保洁服务和 X Family Member
              Program，都被定义为运营数据来源，而不只是商业化事件。这个设计在战略上重要，因为它让 X Square 今天就能部署部分自主机器人，在需要时保留人在环中，同时用产生的边缘案例数据训练未来版本的模型栈。
