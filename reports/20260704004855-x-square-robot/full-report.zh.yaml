        title: 竞争格局——直接同行、全球标杆与替代方案
        blocks:
          - type: paragraph
            body: >-
              X Square Robot 面对的不是一类整齐的对手。中国直接同行已经覆盖 Unitree、AgiBot、Galbot、Fourier、UBTECH 和 RobotEra，每家公司强调的边不同：Unitree
              强调公开入门价格和开发者可达性，AgiBot 强调量产组合宽度，Galbot 强调国资背书和工业订单，Fourier 强调灵巧度优先的硬件，UBTECH 强调工业交付，RobotEra
              则提出全栈主张但公开披露很薄。全球同行以另一种方式塑造愿景集合。Figure 和 1X 是最清晰的家庭辅助标杆；Boston Dynamics 即使在来源包里商业包装不透明，仍扮演信任和企业就绪度参照。


              替代方案集合同样重要。TrendForce 和 Morgan Stanley 都把 2026 年描述为中国人形机器人商业化之年，但 DirectIndustry
              仍提醒，许多公开视频更像技术演示机，而不是完全可运行系统。这个警告对 X Square 很重要，因为买家仍可以用任务专用自动化、AMR、四足机器人或人力解决许多目标工作，而不是为通用平台付费。结果是，X
              Square 必须靠工作流契合度和数据复利取胜，而不只是靠新奇感。
