      - number: '2.3'
        title: 买家分层与 X Square 目标垂直场景
        blocks:
          - type: paragraph
            body: >-
              X Square
              的公开牵引点集中在已经管理重复性室内劳动、且在全自主机器人准备好之前就能为有人监督的自动化买单的买家。在制造和物流里，可能的经济买家是运营或自动化负责人，日常用户是产线工人、仓库员工或维修人员；采用触发点是可量化的吞吐量、用工弹性或错误减少。在家庭服务里，付款逻辑不同：58.com
              承担分发和运营层，机器人首先作为服务合同里嵌入的劳动力增强工具出售，而不是独立消费电器。在养老、养老院、酒店和学校里，买家通常是寻求用工杠杆、服务一致性或品牌收益的设施或照护运营方。X Square
              已公开把自己绑定到工业制造、物流、养老照护和智能家居场景；另有披露称，公司已经从学校、酒店和养老院产生部分收入。这说明公司先从企业和托管服务渠道培育需求，大众消费者采用仍是后续可能性，而不是今天的核心计划。
