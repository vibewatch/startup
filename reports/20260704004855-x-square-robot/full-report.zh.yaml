      - number: '1.5'
        title: 不利背景、政策环境与投资判断边界
        blocks:
          - type: paragraph
            body: >-
              X Square
              最强的多头逻辑，是公司站在三股顺风的交汇处：深圳对具身智能的政策支持、中国加速推进人形机器人商业化，以及硬件商品化后投资人更偏好“大脑”而非“身体”。但公开证据也支撑真实的空头逻辑。独立报道提醒，中国具身 AI
              商业化仍然早期，估值跑在已审计收入证据前面，赛道里许多被庆祝的部署仍更接近战略绑定或数据采集练习，而不是耐久的经常性业务。X Square
              正暴露在这组张力里。它的家庭保洁试点比展会演示更商业化，但收入、客户数、员工数、毛利率和合同经济性仍未披露。公司也处在监管环境里：标准和机器人追溯体系让规则更正式；同时，海外国家安全评论越来越把中国人形平台视为战略技术。这些都不否定公司的势能，但说明当前估值更多由技术承诺、部署可选性和政策同频来支撑，而不是透明经营指标。
