      - number: '5.4'
        title: 开源触面、SDK 与硬件依赖
        blocks:
          - type: paragraph
            body: >-
              许多机器人初创公司只展示视频和营销文案，X Square 不同，它已经搭出可见的开发者触面。公开 GitHub 组织托管了 wall-x 代码库、XRZero-G0、机器人与灵巧手 SDK，以及
              X-Tokenizer，更新时间都在 2026 年 5 月或 6 月。这一点重要，因为它显示公司认真对待外部开发者、第三方机器人支持和内部工具纪律。wall-x 仓库覆盖训练、服务、评估和 LeRobot
              数据准备；sdk_robot 发布 Quanta X1 Pro 和 Quanta X2 的联网控制与数据采集流程；sdk_hand 开放灵巧手的 ROS 2 API；X-Tokenizer 则形式化了多本体动作
              token 接口。与此同时，这个触面仍是开发者级别。wall-x 发布页没有打包版本，SDK 文档假设 Ubuntu
              环境和谨慎的网络配置，一些硬件说明仍像实验室手册，而不是产品化的企业文档。本节让核心依赖变得可见：以 Nvidia 为中心的训练算力、自研数据采集、ROS 2 和 gRPC
              风格工具、触觉硬件，以及公司让模型、硬件和支持软件保持同步的能力。
