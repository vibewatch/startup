              X Square 的商业化看起来由合作伙伴牵引、重部署、重数据，而不是自助式销售。58.com 上线给了 X Square
              一个面向消费者的分发伙伴，但服务本身仍有人类辅助，更像在线田野实验室，而不是成熟家庭机器人业务。官方沟通还描述了 X Family Member
