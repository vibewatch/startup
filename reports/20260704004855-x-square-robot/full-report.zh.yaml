      - number: '8.2'
        title: 为什么溢价可以存在
        blocks:
          - type: paragraph
            body: >-
              溢价背后有真实投资逻辑。X Square 讲的不是通用人形硬件故事，而是“大脑优先”的具身 AI 故事：基础模型、数据管线、家庭试点和企业试点彼此强化。58.com 上线、X Family Member
              家庭项目，以及管理层关于学校、酒店、养老院收入的表述，都支持一个判断：X Square 正试图比纯实验室竞争者更快积累真实世界数据。中国政策背景也在帮忙。TrendForce、Morgan
              Stanley、深圳政策通知和广东新的训练场框架都指向 2026 年：商业验证、政策支持和部署基础设施正在汇合。


              股东名单强化了这个论点。四家中国大型互联网集团分别领投过不同轮次，国资相关和产业基金也加入了后期财团。这套组合重要，因为它能改善渠道触达、部署机会和资本耐久性。这也是市场愿意在收入证明完整前先讨论“大脑溢价”的原因。不过，同样的证据也显示支持有边界：政策、战略资本和合作方标识可以托住关注度，却不能替代已披露经济性，也不能替代干净的少数股东保护条款。
