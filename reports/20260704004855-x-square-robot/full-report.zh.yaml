      - number: '8.4'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              情景演练重要，因为当前入场价已经折现了相当多的成功。牛市情景下，X Square 成为极少数中国具身模型赢家之一，把家庭和企业数据闭环转成经常性服务或软件经济性，披露足够清晰以顺利推进
              IPO，并保住战略资本支持。这可以支撑相对当前估值的大幅上调。基准情景下，试点只逐步转化，国资和战略资本继续支持，但公司看起来更像资金充足的部署运营商，而不是完全验证的软件平台。在这个情景里，相比今天价格只剩中等上行；因此从风险投资回报角度看，投资并不明显有吸引力。


              熊市情景很容易想象，而且不需要灾难。如果家庭服务经济性持续偏薄，企业试点不能转成重复合同，同行继续拉开经济性或披露领先，或者出口管制和合规成本上升，公司可能很快从溢价叙事转成降价融资候选。概率权重因此更偏向基准情景，而不是牛市情景。这就是估值判断的核心：上行存在，但其中很大一部分已经在入场时被要价了。
