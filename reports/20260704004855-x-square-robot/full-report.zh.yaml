        title: 信任、合规与路线图边界
        blocks:
          - type: paragraph
            body: >-
              公开信任信号存在，但比公司的商业化叙事窄。最干净的正式材料是 Quanta X2 的 FCC 无线电授权，它确认一个具名轮式人形产品进入了真实认证流程。中国 2026 年人形标准和数字 ID
              制度，也为部署建立了更清晰的监管基线。灵巧手和机器人 SDK 还发布了具体操作约束，例如 RF
              距离规则、手指安全警告、低电量行为、建图阈值和控制频率限制。这些都说明工程严肃性，但不能填上最大尽调缺口。审阅材料没有发布系统级家庭或工业安全认证、事故历史、MTBF、远程干预率，或 WALL
              技术栈的标准化第三方基准。管理层公开承认基准框架仍弱，当前家庭部署仍依赖人类保洁员或干预路径。从 WALL-A 到 WALL-OSS、LeRobot 集成、WALL-B、WALL-WM，再到 2026
              年数据平台发布，路线图推进很快、技术野心很大；但要承销这条路线图，仍需要可靠性、安全性和可复现性的私下证明。
