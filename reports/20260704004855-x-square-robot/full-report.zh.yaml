  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与轮式双臂哲学
        blocks:
          - type: paragraph
            body: >-
              X Square Robot 卖的不是单个用来展示的人形机器人；它卖的是全栈具身 AI 平台，而当前面向客户的具身载体以轮式优先、操作优先为主。公开产品线把 WALL 系列模型与 Quanta X1、Quanta
              X2、ArtiXon
              灵巧手及配套机械臂平台配在一起，让产品能进入为人类触达而设计的家庭、物流和工业工作流，而不是为完美双足运动而设计的场景。这是一套有意选择的哲学。公司和第三方材料都认为，难题不是令人印象深刻的行走
              演示，而是在混乱真实环境中保持可靠感知、推理和操作。因此，Quanta X1 被定义为轮式双臂部署和研究平台，Quanta X2 被定义为能清洁、分拣、搬运和使用工具的轮式人形机器人。放到实际工作流里，X
              Square 试图自动化结构化家务、开放环境配送、包裹处理，以及部分服务或照护任务，同时采集数据，改善这些本体背后的模型层。
