        blocks:
          - type: paragraph
            body: >-
              成本结构很可能主要由硬件、现场人力和数据 / 算力主导，而不是由软件毛利主导。X Square 的公开材料强调自研机器人、灵巧手和端到端数据管线；CNBC 也明确称公司使用 Nvidia
              芯片做计算。这一点重要，因为付费家庭保洁仍需要人类同伴，所以 RMB 149 的标价几乎肯定不能说明独立机器人贡献毛利。上行逻辑真实存在，但仍是可选项：公司称家庭和工业部署会喂养数据飞轮，Robotics &
