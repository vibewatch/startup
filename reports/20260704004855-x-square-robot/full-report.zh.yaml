      - number: '2.5'
        title: 增长驱动、政策顺风、芯片约束与怀疑
        blocks:
          - type: paragraph
            body: >-
              中国为 X Square 所在品类提供了异常强的顺风。Morgan Stanley 称具身 AI 是未来五年的优先事项；北京已从口号进入标准和治理，2026 年 3 月推出国家标准体系，2026 年 5
              月建立数字 ID 制度；深圳又增加了 10 billion yuan AI 与机器人基金、算力补贴，以及瞄准芯片、零部件、灵巧操作和 50
              个大价值应用场景的本地行动计划。这些政策强化供应链深度，也让中国成为重复部署最可能先跑通的市场。但支持不能消除主要约束。BIS 出口管制继续瞄准先进半导体、AI 模型权重、晶圆厂尽调和流向中国的芯片；具身 AI
              进步高度依赖算力，这一点很关键。同样重要的是，X Square 和同行仍不披露分场景单位经济模型或转化率；持怀疑态度的报道还称商业化仍然模糊，赛道里一些汽车工厂部署更像 demo
