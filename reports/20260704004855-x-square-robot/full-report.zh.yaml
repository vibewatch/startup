              称保洁服务数周内预约满档，CNBC 确认存在部分收入，但没有 CAC、回本期、成交率或合同期限披露。因此，KrASIA 关于赛道内许多工厂项目仍是演示或战略绑定的警告，在判断这些部署到底有多商业化时可以直接套用。
