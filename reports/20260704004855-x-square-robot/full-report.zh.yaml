      - number: '2.2'
        title: 多重视角下的中国与全球规模
        blocks:
          - type: paragraph
            body: >-
              已发布的市场数字指向同一个方向性结论——高速增长——但它们衡量的东西不同。DirectIndustry 引用 IDC，把 2025 年全球人形市场已实现规模锚定在约 18,000 台和约 USD 440
              million 硬件收入，这说明品类仍然很早。MarketsandMarkets 给出更宽的预测镜头：全球人形收入从 2026 年 USD 5.41 billion 增至 2035 年 USD 50.27
              billion；另一个中国镜头则从 2025 年 USD 0.40 billion 增至 2030 年 USD 2.80 billion。Morgan Stanley 2026 年 6
              月的中国估算更商业、更窄：今年 50,000 台、约 USD 2 billion，并明确排除原型机和内部使用机器人。TrendForce 则强调出货加速——2026 年产出增长 94%，Unitree 与
              AgiBot 合计约 80% 份额；36Kr 的 915 billion yuan 至 1 trillion yuan 具身智能估算远宽于人形硬件，如果按字面理解会夸大 X Square 的直接
              SAM。正确结论不是挑一个赢家，而是把 X Square 的近期可服务市场视为中国快速增长的室内工作流自动化支出子集，而不是整个具身 AI 宏大叙事。
