              X Square 的公开差异点是大脑优先，而不是身体优先。ChinaBiz Insider 把故事放在 WALL-B、XR Zero 以及为公司导向家庭服务和工厂部署而设计的股东结构上；CNBC
              则显示学校、酒店和养老院带来了一些早期收入。因此，X Square 更像一家模型牵引的运营商，把机器人当作具身终端，而不是纯硬件放量玩家。Unitree 是相反原型：它直接变现硬件，发布可见的 G1
