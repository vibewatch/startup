            body: >-
              家庭渠道是 X Square Robot 公开客户验证最强的地方：它同时有具名合作方、明确价格、现场报道和可观察的机器人行为。综合公司表述、Yicai 报道，以及 Tech Xplore 转载的 AFP
              报道，这是一项在北京和深圳推出的三小时付费清洁套餐，价格约 RMB148 至 RMB149；机器人负责结构化整理，人工保洁处理深度清洁和需要判断的活。Yicai 称北京已有数十台机器人部署，上线后不久订单超过
              400 单；AFP 后来描述约 200
              户家庭预约，并引用保洁员和客户评价机器人擅长与吃力的地方。这些观察重要，因为它们让本章不只停在合作方标识层面：机器人能捡起碎屑、叠衣服、整理台面，但速度仍慢，扫地和拖地达不到人工标准，还离不开人工监督和稳定网络。因此，采用信号真实，但需要打折。客户确实在付费，服务也有人预约；但眼下价值更多来自新奇感、边际减负和训练数据采集，而不是完全自主替代人工。
