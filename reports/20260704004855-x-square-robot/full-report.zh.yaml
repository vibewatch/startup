      - number: '6.3'
        title: 机构扩张，以及从具名渠道到匿名客户的验证梯度
        blocks:
          - type: paragraph
            body: >-
              管理层把客户叙事拓宽到了家政之外，但离开 58.com 后，证据质量就下降。CNBC 引述 COO Yang Qian 称，X Square Robot
              已经从学校、酒店和养老院销售中产生收入，并正与日本、新加坡客户沟通。方向上，这很重要，因为它意味着公司已从纯演示阶段进入至少部分机构客户变现和早期海外业务拓展。不过，公开记录中，这些细分市场都没有配套具名机构、部署数量、合同金额或成效指标。工业和行业定位也类似。官方和二手材料把公司放进工业制造、物流、外卖或包裹处理流程，可信度较低的
              BigGo Finance 综合稿则更进一步，称 X Square 在半导体显示和生物医药已有批量部署。这些说法与公司更宽的“大脑优先”商业化话术，以及 58 Group
              和汽车链条投资方等产业资本的存在相吻合，但仍不到具名生产案例的程度，投资者还不能有把握地给垂直渗透打分。本章的核心客户验证梯度因此是：具名家庭渠道第一，匿名机构收入第二，广泛场景定位第三。
