              Square 自己的 COO 也还说公司缺少真正的大众市场产品。与此同时，估值跑得远快于披露。X Square 连续四轮融资后越过 US$2.8
              billion，而独立评论认为赛道拥挤、买方不满意，许多初创公司的定价押的是未来认知能力，不是当前收入。国内补贴和地方产业政策显著降低短期融资风险，但也更难分辨真实需求拉动和政策辅助部署。
