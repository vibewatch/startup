      - 反向假设
      - 改变判断的证据
    rows:
      - - 大脑 / 模型护城河
        - 如果世界模型和数据管线比硬件同行更快复利，市场可以给出软件式溢价。
        - 公司自述之外，模型领先的独立证据仍偏薄。
        - 第三方现场基准、重复任务成功率，以及披露的软件或服务经济性。
      - - 商业证明
        - 58.com、家庭项目和机构销售表述说明公司已进入真实环境。
        - 试点仍可能只是补贴型现场实验室，而不是可持续收入引擎。
        - 续约队列、重复订单、具名工业合同，以及分垂直行业收入。
