      - number: '1.4'
        title: 里程碑、机器人发布与真实世界部署
        blocks:
          - type: paragraph
            body: >-
              即便按中国人形机器人标准看，X Square 的公开里程碑弧线也很快。官方时间线从 2023 年 12 月深圳运营开始，2024 年 3 月发布首个具身智能基础模型，2024 年 10 月推出 WALL-A。到
              2025 年，公司把模型发布与硬件和商业化节点绑定：Quanta X1 在开放环境里进入早期商业部署，Wall-OSS 作为开源机器人基础模型发布，Quanta X2 与 ArtiXon 灵巧手也推出。2026
              年，公司从能力信号转向部署信号。它发布 WALL-B 和 World Unified Model 架构，推出 X Family Member 计划做最长一个月的入户机器人试用，并借助 58.com
              合作，把家庭保洁变成深圳和北京面向消费者的在线试点。其他公司关联报道把汽车制造、物流、学校、酒店、养老院和老年照护列为最可见的早期商业场景。共同主线不是已证明的规模收入，而是把真实世界环境当作数据引擎，改善下一轮模型周期。这个策略自洽，但仍留下问题：今天的部署有多少是付费生产工作，又有多少是补贴式学习和展示。
