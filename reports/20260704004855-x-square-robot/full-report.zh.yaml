        title: 资本充足度、投资人组合与估值轨迹
        blocks:
          - type: paragraph
            body: >-
              资本可得性是这个故事中最强的公开部分。官方材料显示，公司在 2026 年 1 月 RMB 1 billion A++ 轮之后，于 2026 年 4 月完成 Xiaomi 支持的 Series B；到 6
              月下旬，公司称已连续完成四轮融资，并以估值超过 RMB 20 billion（$2.8 billion）的 Series C 收尾。银团在战略上值得注意：公司声明提到 HongShan 和 Xiaomi
              继续跟投，Meituan、Alibaba 和 ByteDance 早期领投支持，IDG 新参与 Series
              C。这个组合重要，因为它把消费互联网分发、硬件生态意义和创投信号结合起来。投资判断问题在于对账和充足性。CNBC 此前报道，在 Alibaba 领投融资后，公司八轮总投资约 RMB 2 billion（$280
              million）；Tracxn 后来列出六轮 $723 million，甚至给出 2021 年成立日期，与公司称 2023 年 12
