  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 分层以及买家—用户—付款方逻辑
        blocks:
          - type: paragraph
            body: >-
              X Square Robot 的客户地图，更适合理解为一组渠道堆栈，而不是清晰的具名企业客户名单。最具体的商业细分，是通过 58.com 及其 58 Daojia
              本地服务渠道做家庭保洁：付款方是家庭或预约服务的平台，用户是人类保洁员加机器人组成的工作小组，经济逻辑是服务替代加数据采集，而不是直接卖机器人。第二个家庭细分是 X Family Member
              Program，机器人与家庭共同生活最长一个月，承担陪伴和长尾任务学习；这里的用户是家庭，但真正的经济受益者是 X Square
              自身，因为这个计划看起来是在大众硬件价格可行前生成真实世界数据。家庭之外，管理层称公司已经从学校、酒店和养老院产生收入，暗示存在机构买家和预算负责人，但公司没有点名这些账户、发布站点数量，也没有把买家与员工、学生、住客或居民等终端用户拆开。工业制造、物流、半导体显示、生物医药、零售和公共服务都出现在公司定位里，但公开记录大多把它们写成部署场景或战略方向，而不是完全归属的客户背书。因此，58.com
              是最清晰的买方渠道证明，其他多数细分的验证层级都低一层。
