      - number: '5.2'
        title: 模型栈：WALL-A、WALL-B、WALL-WM 与 WALL-OSS
        blocks:
          - type: paragraph
            body: >-
              技术故事中最强的部分，是模型栈的演进。WALL-A 被描述为 VLA 系统，把世界模型、因果推理和真实机器人强化学习整合起来，让机器人能推断隐藏或变形物体可能正在发生什么，并动态调整动作策略。WALL-B
              把这个思路继续推进，将感知、语言、动作和物理预测压缩进 World Unified Model；X Square 称它比事后拼接的模块化管线更适合长时程家务。WALL-WM
              又进一步沿同一方向，用事件级转移替代固定间隔帧建模；WALL-OSS
              则开放了技术栈的公共开源分支。技术野心很清楚：从把感知映射到动作的机器人，走向携带内部物理后果预测模型的机器人。不清楚的是独立验证。4-of-17 个任务完成率超过 80 percent
              这类公开数字来自公司自身，公司也承认具身 AI 的基准体系仍不成熟。
