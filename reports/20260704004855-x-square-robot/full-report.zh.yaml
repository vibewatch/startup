      - number: '8.5'
        title: 破坏投资逻辑的信号与最终尽调
        blocks:
          - type: paragraph
            body: >-
              X Square 仍然值得作为活跃项目跟进，因为战略格局真实；但会破坏投资逻辑的事项具体而不长。下一轮融资或 IPO 准备如果没有可信收入桥接，将是最清晰警讯，说明估值已经跑在业务成形之前。如果证据显示
              58.com 试点仍是补贴型现场实验室，而不是可复制渠道；或工业和机构部署在公关稿中很广、合同价值却很浅，也同样危险。第四个警讯，是经济性更好的同行压上来时，战略投资者停止跟投支持。


              尽调清单必须务实，不要哲学化。任何买入建议前，委员会都应要求拿到 Series C
              后股权结构和清算瀑布、按垂直场景拆分的已确认收入和毛利率、复购和续约队列、客户集中度数据，以及芯片管制收紧下算力供应韧性的清晰解释。这些要求不是内务整理；它们决定投资者是在为一个真正出现的平台付费，还是在市场正愿意为品类故事多付钱时，恰好为故事买单。
