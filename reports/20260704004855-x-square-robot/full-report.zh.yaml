  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              X Square Robot 的实际市场不是“所有机器人”，也不只是适合舞台展示的全尺寸双足机器人。边界应划在能在真实室内工作流中操作物体的通用具身机器人；只要与具身 AI
              软件、集成、维护和运营服务一起销售，轮式或腿式移动操作机器人也包括在内。MarketsandMarkets 在其人形市场分类中明确把轮驱机器人划入其中，这一点重要，因为 X Square
              的商业产品和演示是轮式双臂系统，而不是 Atlas 式双足机器人。因此，纳入支出覆盖机器人本体、具身 AI
              模型访问、遥操作或监督层、部署工程、维护，以及附着在家庭、物流、照护和工厂工作流上的经常性服务运营。排除支出包括固定工业臂、不带灵巧操作的 AMR 或 AGV、没有机器人本体的通用 AI
              软件，以及没有工作流生产力任务的玩具或陪伴设备。真正的替代方案是人力、合同保洁或照护人员，以及协作机器人、输送线、仓储点解决方案等任务专用自动化。这个边界让 X Square 的市场比登月式 AGI
              故事更可达，但也小于广义万亿元级具身智能叙事。
