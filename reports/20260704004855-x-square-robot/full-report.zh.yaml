      - number: '8.3'
        title: 反向论点与可比公司纪律
        blocks:
          - type: paragraph
            body: >-
              反向论点从一个简单问题开始：X Square 还没拿出同等经营证据，为什么估值应接近或高于披露更充分的同行？据报道，Unitree 进入 IPO 准备时估值高于 RMB 12
              billion，且已经披露收入；TrendForce 称其 2025 年招股书显示，人形机器人收入超过四足机器人，合并毛利率 60%。上市标杆 UBTECH 2025 年披露收入 RMB 2.001
              billion，全尺寸人形机器人收入约 RMB 820 million。Figure 仍是完全不同量级的参照，估值 $39
              billion；但即便在那里，估值支撑也更多来自未来家庭和商业场景自主化，而不是成熟且披露的盈利。X Square 夹在这些可比对象中间：估值高于部分已披露的中国同行，资本规模远不及
              Figure，对外透明度又明显弱于上市或准上市标杆。


              这种不透明并非 X Square 独有；Galbot 的公开材料也很薄，虽然融资和国资背书叙事在增强。但这不是为 X Square 价格辩护，而是说明中国私有具身 AI
              估值往往被战略稀缺和政策匹配推着走，速度快过已发布的单元经济。委员会因此应把可比公司分析当作纪律工具，而不是安慰毯：同业集合说明高溢价结果有空间，也说明今天的估值已经假设 X Square
              会证明一种持久模型优势，而公开证据还没有验证这一点。
