        title: 留存不透明、集中风险与仍待补齐的尽调缺口
        blocks:
          - type: paragraph
            body: >-
              X Square Robot 的公开客户证据比纯实验室阶段的人形机器人故事更进一步，但仍太薄，撑不起常规耐久性分析。在已审阅的官方和独立来源中，没有找到公开
              NRR、GRR、流失、续约、客户留存或队列数据；即使最强的 58.com
              清洁服务渠道，也未披露复购率或同一家庭扩单。这个缺口让集中风险更关键。公开验证高度集中在一个国内合作渠道和一个地理市场，其他已变现细分只以学校、酒店、养老院等匿名类别披露。日本和新加坡的国际扩张还停在沟通阶段，没有公开转化。同时，逆向报道让行业叙事保持清醒：Yicai
              和 AFP 描述的机器人速度慢、能力有限，仍部分是新奇产品和数据采集器；KrASIA
              和市场分析师的行业评论也称，人形机器人商业化仍不成熟，许多战略合作更接近演示，而非稳定收入。结论是：早期采用验证真实，但留存能见度弱。下一步尽调不该再要更多场景营销，而是要具名机构客户、合同结构、重复使用数据，以及客户结构披露——它要说明收入还有多少依赖
