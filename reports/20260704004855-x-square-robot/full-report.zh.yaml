        title: 公开财务缺口、出口管制依赖与结论
        blocks:
          - type: paragraph
            body: >-
              财务结论仍然混合，因为披露缺口压过了可见势能。X Square
              明显有真实商业化信号——付费家庭保洁试点、管理层报告的机构客户收入，以及标志性战略方反复融资——但没有任何已审阅来源披露已确认收入、ARR、毛利率、烧钱速度、手头现金、跑道、员工数、客户集中度或债务。这让资本充足度只能做定性判断，无法建模：公司看起来资金充足，但投资人无法判断它是在高效支撑快速扩张，还是只是在热门市场里激进烧钱。不利证据很实质。KrASIA
              描述的是一个估值上涨快于商业化的赛道；CNBC 提到 X Square 依赖 Nvidia 算力，这又与 BIS 和 Finnegan
              关于先进芯片管制收紧的报道交叉，给模型训练制造了不可忽视的供给侧风险。净看，如果数据飞轮产出可变现的模型优势，X Square
