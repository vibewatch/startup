      - number: '7.2'
        title: 监管、安全、隐私与责任风险
        blocks:
          - type: paragraph
            body: >-
              监管现在已是实际经营闸门，不再是未来抽象变量。中国 2026 年 3 月标准体系和 2026 年 5 月数字 ID
              制度，将人形机器人推向全生命周期治理：数据和模型流程、安全与伦理、登记、可追溯、召回、转售限制，都在进入可执行范围。纪律严的成熟企业能消化，但产品仍在适应混乱家庭环境时，成本会变高。X Square
              的家庭服务在住宅内采集数据，旁边保留人工监督，而且已被讨论为养老照护用例的前奏。相比只在工厂里的机器人，这些事实抬高了隐私、网络安全、同意、事故和产品责任敞口。已审阅的公开材料强调部署，却没有说清认证、保险或事故响应架构；即便长期政策方向在国内有利，尽调负担仍高。
