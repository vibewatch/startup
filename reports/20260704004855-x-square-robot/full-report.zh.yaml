      - number: '1.3'
        title: 融资速度、估值跃升与投资人基础
        blocks:
          - type: paragraph
            body: >-
              资本形成是本章最清晰的外部验证点，但披露缺口也在这里扩大得最快。独立报道和公司关联报道一致显示，X Square 在 2025 年 9 月融资超过 $100 million，2026 年 1 月又融到约 RMB
              1 billion / $140 million，随后在 2026 年继续多轮融资，到 7 月估值推到 RMB 20 billion（约 $2.8-2.9 billion）以上。公开报道持续把
              Alibaba、Meituan、ByteDance、HongShan / Sequoia China、Xiaomi 以及多只国资或准国资基金放在股东名单附近，后续报道还点名 CICC Capital、China
              Insurance Investment 和 China Mobile 等产业或财务投资方。因此，资本故事指向三股相互强化的力量：押注应用层的互联网战略方、押注部署的产业伙伴，以及押注具身 AI
              作为国家优先技术栈的国资系基金。缺的是投资人真正想看的底稿：2026 年 1 月之后各轮融资的准确日期和规模、完全稀释后的累计持股、董事席位、清算优先权、员工期权池规模，或任何债务 /
              老股成分。结果是一家公司看上去获得了异常强的赞助，但透明度仍然只有一部分。
