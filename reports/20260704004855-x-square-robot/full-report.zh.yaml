appendices:
  - id: A
    title: 方法论与覆盖边界
    blocks:
      - type: paragraph
        body: 本判断综合了截至 2026-07-04 完成的 X Square 各章节，依据公司公开发布的信息、独立机器人与财经报道、政策材料和同行披露。未使用管理层访谈、数据室文件或非公开财务报表。
        claimRefs: []
      - type: list
        items:
          - 没有公开来源披露确认收入、ARR、毛利率、烧钱速度、现金、跑道或员工数。
          - 公开来源尚未完全对齐 2026 年后续轮次规模和累计融资额。
          - 除 58.com 家庭渠道外，已点名客户证明仍然薄弱，续约或重复使用行为未披露。
          - 董事会构成、接班规划和详细治理权利仍不透明。
        claimRefs:
          - CI037
          - CV004
          - CU025
          - CU044
          - CR039
  - id: B
    title: 上调判断需要什么
    blocks:
      - type: callout
        title: 上调标准
        body: 若要从继续研究上调到买入，需要可审计的收入和利润率披露、58.com 之外的重复付费部署、更强的安全与合规证据，以及更清晰的股权结构和算力供应承销依据。
        calloutType: recommendation
