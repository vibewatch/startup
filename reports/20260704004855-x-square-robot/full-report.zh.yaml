chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与产品论证
        blocks:
          - type: paragraph
            body: >-
              X Square Robot (自变量机器人) 对外呈现为一家深圳具身 AI 公司，2023 年 12
              月成立，核心论证是“大脑优先”：先解决机器人脑，再围绕这个核心迭代硬件、数据和部署。官方材料强调通用具身智能，而不是单任务自动化产品；公开技术栈把自研 WALL 系列基础模型，与 QUANTA
              产品线下的轮式双臂和轮式人形本体配在一起。公司反复把自己定义为全栈系统——模型、数据管线、机器人硬件和真实世界部署——而不是套在第三方机器人上的软件壳。这个定位重要，因为它同时解释了投资人的热情，也解释了公司为何在家庭服务、物流、工业任务和照护场景上提出异常宽的场景主张。公开网站资料把总部放在深圳南山区，并明确称公司是中国最早走全端到端通用具身智能路径的团队之一。即使还处早期，公司身份也不只是另一家人形机器人初创公司；它是一家模型牵引的具身
              AI 平台，机器人既是产品，也是数据采集工具。
