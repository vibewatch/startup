  - id: TV005
    title: 假设失效与否决触发点表
    columns:
      - 触发点
      - 阈值 / 事件
      - 对投资假设的传导
      - 行动含义
    rows:
      - - 无收入桥
        - 下一轮融资或 IPO 准备动作仍缺少确认收入和毛利披露
        - 把大脑溢价变成纯叙事风险
        - 不要追加资本；立场转向回避。
      - - 58.com 试点未能复利
        - 头部试点之外，没有重复预订或城市扩张证据
        - 削弱家庭数据闭环和渠道假设
        - 从模型中剔除家庭服务溢价。
      - - 企业试点停留浅层
        - 没有具名重复工业或机构合同
        - 说明部署更像演示，而不是持久商业化证明
        - 下调基准情景概率和估值区间。
      - - 战略 / 国资后续跟投减弱
        - 下一轮融资中，关键战投或国资背景基金没有继续参与
        - 失去重要的信号和降风险支撑
        - 实质提高下行概率。
      - - 同行经济性拉开差距
        - Unitree、UBTECH 或全球同行披露更好的经济性，而 X Square 仍不透明
        - 让当前溢价越来越站不住脚
        - 要求更低入场价，或暂停尽调。
      - - 算力 / 政策摩擦上升
        - 训练或部署受到重大芯片管制、许可或合规约束
        - 抬高成本，并拖慢走向软件式利润率的路径
        - 重置毛利假设，拉长退出时间表。
    notes: 触发点按可观察事件来写，会直接改变投资建议，而不是泛泛的观察事项。
    claimRefs:
      - CV031
      - CV039
      - CV041
      - CV043
  - id: TV006
    title: 最终尽调清单表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 股权结构和优先权
        - Series C 轮后分配瀑布、期权池、清算顺位、反稀释权利
        - 如果条款让新钱处于劣后，表面估值可能误导。
        - 与管理层、领投方和律师做财务与法律尽调。
      - - 收入和毛利
        - 按垂直行业确认的收入、毛利、烧钱速度、现金续航期、员工人数
        - 这是承销当前价格的最大单一障碍。
        - NDA 下的管理账目和审计师背书明细。
      - - 重复订单队列
        - 58.com 和机构客户的续约、重复预订与扩张数据
        - 区分真实商业化引擎和数据采集试点。
        - 客户访谈和队列看板。
      - - 工业管线
        - 具名工厂客户、合同金额、验收里程碑、在手订单转化
        - 要证明相对披露更好的同行能享有溢价，这些证据不可少。
        - 通过客户和投资人引荐做商业尽调。
      - - 算力韧性
        - 芯片供应计划、训练预算、出口管制缓释、模型再训练节奏
        - 算力瓶颈会拖慢整条大脑溢价假设。
        - CTO 尽调，加上供应链和法律审查。
      - - IPO 准备度
        - 上市工作计划草案、治理升级、内控、时间表
        - 只有披露和治理跟得上，IPO 叙事才有意义。
        - 董事会、CFO 和保荐人尽调。
    notes: 在当前估值下，从继续研究转向真正买入建议前，这些问题是最低证据包。
    claimRefs:
      - CV010
      - CV028
      - CV043
      - CV044
      - CV045
