      - number: '3.3'
        title: 定价不透明，以及轮式双臂与人形机器人的取舍
        blocks:
          - type: paragraph
            body: >-
              公开定价是这个市场最清晰的不对称之一。Unitree G1 仍是唯一拥有清晰可见低端公开价格的主要直接标杆；即便比较并不完美，这一点也重要，因为它设定了买家的心理锚点。X Square
              没有在来源包里披露机器人标价；它的公开信号反而是通过 58 Group 做家庭服务合作，以及管理层评论：消费者采用可能需要更接近 $10,000 的价格点。Figure、Fourier、UBTECH 和
              Boston Dynamics 也展示了品类默认姿态：讲能力叙事和部署故事，但很少披露单机定价。这种不透明让价格性能投资判断更难，也把尽调推回到总工作流经济性上。


              对 X Square
              来说，更重要的比较是形态。它的轮式双臂路径，看起来很适配平地、重复性室内服务或工厂辅助场景；在这些场景里，更低机械复杂度和更快数据采集，可能比完美拟人移动更重要。双足同行展示的是另一套东西：Figure 和 1X
              强调家庭通用性，Unitree 和 Fourier 强调动态运动与灵巧度，AgiBot 和 UBTECH 强调可能需要更像人类的触达或跨步能力的工业工作流。因此，X Square
