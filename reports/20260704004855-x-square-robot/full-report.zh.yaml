  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              X Square Robot 战略上很容易让人喜欢，财务上却很难承销。连续四轮融资后，公司公开估值锚点已高于 RMB 20 billion，约 $2.8 billion 至 $2.9
              billion，并组建了中国具身 AI
              赛道中覆盖最广的战略股东阵容之一。这足以让公司留在持续跟踪的机会池里，但不足以在当前价格给出买入建议。公开来源仍未披露已确认收入、毛利率、烧钱速度、员工人数或融资条款；在这个价格上，这些缺口比又一轮品类热情更重要。


              投资委员会因此应落在“继续研究”、中等信心、高风险评级和估值偏高的立场上。这个判断有意对价格敏感：如果同一家公司报价显著低于当前头部估值，风险收益会更好。但在 RMB 20
              billion，举证责任转向证明机器人“大脑”叙事正在转化为可审计经济性。在证据出现前，最干净的框架是：投资者被要求买入一个战略可信的未来品类龙头期权，而不是一个已经透明承销的生意。
