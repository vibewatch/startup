evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: total-raised
    missingEvidence: >-
      A reconciled financing ledger showing each 2025-2026 round date, amount, instrument, dilution, and cumulative
      proceeds.
    whyItMatters: >-
      The public valuation narrative is strong, but without a clean cumulative financing ledger it is hard to judge
      dilution, cash runway, and round-to-round valuation step-ups.
    diligencePath: >-
      Request the board-approved financing history, cap-table summary, and signed closing notices for each round from
      Series A+ onward.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Board composition, voting-control schedule, preferred-share rights, and investor governance terms after the 2026
      financing wave.
    whyItMatters: >-
      Governance opacity limits confidence in founder control, downside protections, and whether strategic investors
      hold rights that affect future fundraising or exits.
    diligencePath: >-
      Obtain the latest cap table, shareholder agreement, board roster, and reserved-matters schedule from company
      counsel or the financing data room.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Audited or at least board-level monthly metrics covering revenue, customer count, headcount, gross margin, and
      deployment conversion from pilot to paid contract.
    whyItMatters: >-
      Current underwriting relies mainly on technical narrative and fundraising momentum because core operating metrics
      are not public.
    diligencePath: >-
      Request a current KPI pack, customer pipeline report, and management reporting deck used for the latest financing
      process.
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: >-
      Exact close dates and internal milestones behind some 2024-2026 chronology entries, especially the intermediate
      financing tranches.
    whyItMatters: >-
      The public milestone table is directionally useful, but finer sequencing could matter for assessing execution
      speed and investor signaling.
    diligencePath: >-
      Cross-check the company timeline against financing closing documents, product launch decks, and internal board
      minutes.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: x-square-sam-and-unit-economics
    missingEvidence: >-
      Segment-level pricing, unit economics, conversion rates, and revenue mix across X Square's manufacturing,
      logistics, home-service, care, and hospitality channels.
    whyItMatters: >-
      Without those numbers, any TAM-to-SAM-to-SOM bridge remains a directional wedge description instead of a
      defensible revenue model, which directly affects valuation discipline and buyer ROI confidence.
    diligencePath: >-
      Request vertical-by-vertical pricing, gross margin, retention, and conversion data from X Square and compare it
      with signed deployment volumes or service-usage metrics.
    relatedQuestionRefs:
      - QM007
      - QM024
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
