  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Wheeled-Dual-Arm Philosophy
        blocks:
          - type: paragraph
            body: >-
              X Square Robot is not selling a single humanoid showpiece; it is selling a full-stack embodied-AI platform
              whose customer-facing embodiments are currently wheel-first and manipulation-first. The public lineup
              pairs WALL-family models with Quanta X1, Quanta X2, ArtiXon dexterous hands, and related arm platforms so
              the product can work in homes, logistics, and industrial workflows built for human reach rather than for
              perfect bipedal motion. This is a deliberate philosophy. Company and third-party materials both argue that
              the hard problem is not impressive walking demos but reliable perception, reasoning, and manipulation
              across messy real environments. That is why Quanta X1 is framed as a wheeled bimanual deployment and
              research platform, while Quanta X2 is framed as a wheeled humanoid that can clean, sort, carry, and use
              tools. In practical workflow terms, X Square is trying to automate structured household chores,
              open-environment delivery, parcel handling, and selected service or care tasks while gathering data that
              improves the model layer behind those embodiments.
