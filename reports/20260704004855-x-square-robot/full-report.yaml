        title: Revenue streams, pricing, and recognition opacity
        blocks:
          - type: paragraph
            body: >-
              X Square’s public monetization looks like a hybrid of service bookings, bespoke robot sales, and
              scenario-specific deployment contracts, but the mix is not disclosed. The clearest live stream is the
              58.com household cleaning service, where a robot works beside a human cleaner; RoboHorizon reported a
              roughly RMB 149 booking price, which is useful only as a service proxy because it bundles human labor and
              does not reveal robot ASP. Management also told CNBC the company already generates some revenue from
              schools, hotels, and retirement homes, while official materials describe deployments across industrial,
              logistics, elderly-care, hospitality, retail, and public-service settings. What remains missing is
              crucial: CNBC said pricing is set by use case, there is no public list price, and no source discloses how
              X Square books hardware, service, or any eventual model/data revenue. DirectIndustry’s broader observation
              that Chinese humanoid vendors are moving toward RaaS and platform models makes the omission more
              important, because X Square’s eventual revenue quality may depend more on recurring service and data
