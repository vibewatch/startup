      - number: '7.2'
        title: Regulatory, safety, privacy, and liability risk
        blocks:
          - type: paragraph
            body: >-
              Regulation is now a real operating gate rather than a future abstraction. China's March 2026 standard
              system and May 2026 digital-ID regime push humanoid robots toward full-life-cycle governance: data and
              model processes, safety and ethics, registration, traceability, recalls, and limits on resale are all
              moving into enforceable territory. That is manageable for disciplined incumbents, but it becomes expensive
              when the product itself is still adapting to messy home environments. X Square's household service
              collects data inside homes, keeps a human supervisor nearby, and is already being discussed as a precursor
              to elder-care use cases. Those facts elevate privacy, cybersecurity, consent, incident, and
              product-liability exposure versus a factory-only robot. Reviewed public materials celebrate deployment but
              do not spell out certification, insurance, or incident-response architecture, so the diligence burden
              stays high even if the long-term policy direction is domestically favorable.
            claimRefs:
