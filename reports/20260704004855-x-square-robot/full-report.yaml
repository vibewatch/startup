  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk overview and ranking
        blocks:
          - type: paragraph
            body: >-
              X Square's highest-risk issue is not a single missing feature; it is the interaction between a still-early
              product, a valuation that has already sprinted ahead, and a policy environment that is both supportive and
              demanding. Public materials show a real household service launch and a serious funding base, but they also
              show that home deployments are still human-supervised, task-limited, and in part curiosity-driven. At the
              sector level, Morgan Stanley, TrendForce, KrASIA, and The Next Web all point to the same tension:
              commercialization is moving faster than expected, yet buyer satisfaction and repeatable economics remain
              weak relative to the capital entering the space. For X Square specifically, policy-backed scaling,
              advanced-chip dependence, and sparse governance disclosure mean a setback in safety, export access, or
              customer conversion could travel quickly into financing and valuation pressure.
            claimRefs:
