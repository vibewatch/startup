      - CV021
      - CV014
      - CV017
      - CV010
      - CV033
      - CV039
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: The largest valuation swing factors are evidence-related rather than purely market-size related.
    data:
      items:
        - label: Revenue / margin disclosure
