      - number: '6.4'
        title: Retention opacity, concentration risk, and the diligence gaps that remain
        blocks:
          - type: paragraph
            body: >-
              X Square Robot's public customer evidence is more advanced than a pure lab-stage humanoid story, but it is
              still too thin to support a conventional durability analysis. No public NRR, GRR, churn, renewal,
              logo-retention, or cohort figures were identified across reviewed official and independent sources, and
              even the strongest channel — the 58.com cleaning service — does not disclose repeat-booking rates or
              same-household expansion. That absence makes concentration risk more important. Public proof is heavily
              concentrated in one domestic partner channel and one geography, while other monetized segments are
              disclosed only as unnamed categories such as schools, hotels, and retirement homes. International
              expansion into Japan and Singapore is still conversation-stage, not public conversion. At the same time,
              adverse reporting keeps the sector grounded: Yicai and AFP describe slow, limited robots that remain
              partly novelty products and data collectors, while broader sector commentary from KrASIA and market
              analysts says commercialization across humanoids is still immature and that many strategic tie-ups are
              closer to demos than durable revenue. The result is a chapter with authentic early adoption proof but weak
              retention visibility. The next diligence step is not more scenario marketing; it is named institutional
              accounts, contract structure, repeat-usage data, and a customer mix disclosure that shows how much of
              revenue still depends on the 58.com-led household wedge.
