      - number: '1.4'
        title: Milestones, robot launches, and real-world deployments
        blocks:
          - type: paragraph
            body: >-
              X Square’s public milestone arc is fast even by China humanoid-robot standards. Official chronology starts
              with Shenzhen operations in December 2023, the first embodied-intelligence foundation-model release in
              March 2024, and the WALL-A launch in October 2024. By 2025 the company was pairing model releases with
              hardware and commercialization markers: Quanta X1 reached early commercial deployment in open
              environments, Wall-OSS was released as an open-source robotics foundation model, and Quanta X2 plus the
              ArtiXon dexterous hand were launched. In 2026 the company shifted from capability signaling to deployment
              signaling. It unveiled WALL-B and the World Unified Model architecture, launched the X Family Member
              program for month-long in-home robot trials, and used the 58.com partnership to turn household cleaning
              into a live consumer-facing pilot in Shenzhen and Beijing. Other company-linked coverage points to
              automotive manufacturing, logistics, schools, hotels, retirement homes, and eldercare settings as the most
              visible early commercial contexts. The common thread is not proven scale revenue; it is using real-world
              environments as data engines that improve the next model cycle. That is strategically coherent, but it
              still leaves open how much of today’s deployment is paid production work versus subsidized learning and
              demonstration.
