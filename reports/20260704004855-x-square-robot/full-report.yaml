      - number: '8.5'
        title: Thesis-breakers and final diligence
        blocks:
          - type: paragraph
            body: >-
              X Square is still investable as a live file because the strategic setup is real, but the list of items
              that can break the thesis is concrete and short. A next financing or IPO-prep step without a credible
              revenue bridge would be the clearest warning that valuation has outrun business formation. So would
              evidence that the 58.com pilot remains a subsidized field lab rather than a repeatable channel, or that
              industrial and institutional deployments are broad in PR but shallow in contracted value. A fourth warning
              sign would be strategic investors stopping their follow-on support just as peers with better economics
              press their advantage.


              The diligence agenda therefore has to be practical, not philosophical. Before any buy call, the committee
              should demand the post-Series-C cap table and waterfall, recognized revenue and gross margin by vertical,
              repeat-order and renewal cohorts, customer-concentration data, and a clear explanation of compute-supply
              resilience under tightening chip controls. These asks are not housekeeping; they are the difference
              between paying for a real emerging platform and paying for a category story at exactly the moment the
              market has become willing to overpay for one.
