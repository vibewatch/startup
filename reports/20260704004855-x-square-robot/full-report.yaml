      - number: '3.4'
        title: Switching costs, distribution power, and enterprise trust
        blocks:
          - type: paragraph
            body: >-
              Switching costs in embodied robotics will come less from the body itself than from the operational stack
              around it. AgiBot and UBTECH are already publishing stronger stories around repeatable solutions, workflow
              software, and factory integration than X Square is. Unitree, by contrast, deliberately keeps switching
              costs lower by behaving more like a programmable hardware platform for developers. X Square sits between
              those poles. Its current channel logic is promising — 58 Group points toward home services, while
              automotive investors point toward factory adoption — but the public record does not yet show the same
              field-service depth, installed workflow tooling, or named industrial rollout cadence that the best Chinese
              industrial peers can cite.


              That matters because trust and deployment discipline are now competitive variables of their own.
              DirectIndustry's skepticism about demo-heavy categories, plus TrendForce's use of Boston and 1X as
              commercialization benchmarks, suggests buyers will reward proof more than narrative. X Square may be able
              to accumulate data faster in household and service environments, but enterprise buyers in factories or
              regulated settings will still ask for uptime, repeatability, integration, and support evidence before they
              reward a model-first architecture.
