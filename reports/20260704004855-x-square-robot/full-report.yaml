  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              X Square Robot's practical market is not 'all robotics' and not only theatrical full-size bipeds. The
              relevant boundary is general-purpose embodied robots that can manipulate objects in real indoor workflows,
              which includes wheeled or legged mobile manipulators when they are sold with embodied-AI software,
              integration, maintenance, and operating services. MarketsandMarkets explicitly segments wheel-drive robots
              inside its humanoid market taxonomy, which matters because X Square's commercial products and demos are
              wheeled, bimanual systems rather than Atlas-style bipeds. Included spend therefore covers robot bodies,
              embodied-AI model access, teleoperation or supervision layers, deployment engineering, maintenance, and
              recurring service operations attached to home, logistics, care, and factory workflows. Excluded spend
              includes fixed industrial arms, AMRs or AGVs without dexterous manipulation, generic AI software with no
              robot attached, and toy or companion devices with no workflow productivity mission. The real substitutes
              are human labor, contract cleaning or care staff, and task-specific automation such as cobots, conveyors,
              and warehouse point solutions. That boundary makes X Square's market more attainable than a moonshot AGI
              story, but also smaller than broad trillion-yuan embodied-intelligence narratives.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM010
              - CM011
