      - number: '1.2'
        title: Leadership concentration and governance opacity
        blocks:
          - type: paragraph
            body: >-
              The public leadership picture is visible enough to identify the central decision-makers but not rich
              enough to underwrite governance. Wang Qian is the named founder and chief executive across company
              releases and independent coverage, and the available profile material links him to Tsinghua training, a
              USC doctorate, and earlier work on robot learning, human-robot interaction, and attention-mechanism
              research. Public materials also identify Wang Hao as chief technology officer and Yang Qian as the
              operating executive speaking for fundraising and commercialization. Together that trio supports the
              narrative that X Square blends frontier model work with operational push into real scenarios. The problem
              is that the public record stops there: no independently reviewed board roster, voting-control map,
              shareholder-rights schedule, or succession plan appears in the materials reviewed for this chapter. That
              leaves a classic early-stage robotics pattern — strong founder-market fit, but high key-person dependence
              and low outside visibility into internal controls. For later diligence, that matters almost as much as the
              model claims, because governance discipline and decision redundancy become more important as valuations
              approach late-stage private-market territory.
            claimRefs:
