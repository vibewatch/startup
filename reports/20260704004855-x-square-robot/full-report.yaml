      - number: '2.4'
        title: Why wheeled bimanual systems can win before full humanoids
        blocks:
          - type: paragraph
            body: >-
              The most important commercial point for X Square is not whether wheels look less human; it is whether the
              form factor removes complexity from the workflows that buyers will actually pay for in 2026. X Square's
              Quanta X1 has already been positioned around wheeled bimanual delivery and logistics tasks, and its 58.com
              cleaning service explicitly uses a robot-plus-human model in which the robot handles repetitive surface
              tasks while the human absorbs edge cases. That is a pragmatic commercialization path: keep the
              manipulation problem, but avoid spending the full autonomy budget on biped locomotion where the floor is
              already flat and the environment is mostly indoors. Competitor evidence points the same way. AGIBOT's
              compact mobile manipulator is framed for retail, hospitality, logistics, and structured industrial work;
              Figure describes the home as robotics' hardest setting; 1X says NEO Gamma is only opening the door to
              internal home testing; and Unitree's marketed bipeds still show clear endurance, payload, or size
              trade-offs. In other words, the market is paying first for useful manipulation in controlled spaces, not
              for legged purity. That favors X Square's wheeled bimanual wedge.
            claimRefs:
