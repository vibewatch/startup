companyProfile:
  summary: >-
    X Square Robot (自变量机器人) is a Shenzhen-based embodied-AI startup founded in December 2023 by Wang Qian. The company
    is built around a brain-first thesis: pair WALL-series embodied foundation models, a closed-loop data stack, and
    programmable wheeled robots such as Quanta X1 and Quanta X2 so deployments improve the models and the models improve
    deployments. Public traction is strongest in household services through the 58.com cleaning partnership and the X
    Family Member home program, with additional but less transparent revenue signals from schools, hotels, and
    retirement homes. By mid-2026 the company had reached Series C with a valuation above RMB 20 billion, backed by
    major internet, venture, strategic, and state-linked investors, while still leaving core operating economics largely
    undisclosed.
