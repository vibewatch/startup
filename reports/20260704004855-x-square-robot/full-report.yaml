        title: Open-Source Surface, SDKs, and Hardware Dependencies
        blocks:
          - type: paragraph
            body: >-
              Unlike many robotics startups that expose only videos and marketing copy, X Square has built a visible
              developer surface. The public GitHub organization hosts the wall-x codebase, XRZero-G0, robot and hand
              SDKs, and X-Tokenizer, all updated in May or June 2026. That matters because it shows the company is
              serious about external developers, third-party robot support, and internal tooling discipline. The wall-x
              repository covers training, serving, evaluation, and LeRobot data preparation; sdk_robot publishes
              networked control and data-collection flows for Quanta X1 Pro and Quanta X2; sdk_hand exposes ROS 2 APIs
              for the dexterous hand; and X-Tokenizer formalizes a multi-embodiment action-token interface. At the same
              time, the surface is still developer-grade. The wall-x releases page has no packaged releases, the SDK
              docs assume Ubuntu environments and careful network configuration, and some hardware instructions remain
              lab-like rather than productized enterprise documentation. This section is where the core dependencies
              become visible: Nvidia-centered training compute, proprietary data capture, ROS 2 and gRPC style tooling,
              tactile hardware, and the company’s ability to keep model, hardware, and support software in sync.
