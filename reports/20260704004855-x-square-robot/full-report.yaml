      - number: '3.2'
        title: Direct peer profiles and capability comparison
        blocks:
          - type: paragraph
            body: >-
              X Square's public differentiation is brain-first rather than body-first. ChinaBiz Insider centers the
              story on WALL-B, XR Zero, and a cap table designed to funnel the company toward home-service and factory
              deployments, while CNBC shows some early revenue from schools, hotels, and retirement homes. That makes X
              Square closer to a model-led operator using robots as the embodied endpoint than to a pure hardware volume
              player. Unitree is the opposite archetype: it monetizes hardware directly, publishes a visible G1 price
              point, and positions humanoids for developers. AgiBot competes through portfolio breadth and standardized
              deployment packages, while Galbot competes through scale narratives around data, capital, and industrial
              orders.


              The global peers are also distinct. Figure pairs a massive balance-sheet advantage with a VLA stack and
              home narrative, and 1X is explicitly optimizing for safe in-home assistance. Fourier publishes some of the
