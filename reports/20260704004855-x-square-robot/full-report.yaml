            body: >-
              Public trust signals exist, but they are narrower than the company's commercialization narrative. The
              cleanest formal artifact is the FCC radio authorization for Quanta X2, which confirms that a named wheeled
              humanoid product exists in a real certification process. China's 2026 humanoid standards and digital-ID
              regime also create a clearer regulatory baseline for deployment. The hand and robot SDKs additionally
