      - number: '2.5'
        title: Growth drivers, policy tailwinds, chip constraints, and skepticism
        blocks:
          - type: paragraph
            body: >-
              China offers unusually strong tailwinds for X Square's category. Morgan Stanley says embodied AI is a
              priority for the coming five years; Beijing has moved from rhetoric into standards and governance with the
              March 2026 national standard system and May 2026 digital-ID regime; and Shenzhen has added a 10 billion
              yuan AI-and-robotics fund, compute subsidies, and a local action plan aimed at chips, components,
              dexterous manipulation, and 50 large-value application scenarios. Those policies reinforce supply-chain
              depth and make China the most plausible first market for repeated deployments. But support does not remove
              the main constraints. BIS export controls continue to target advanced semiconductors, AI model weights,
              foundry due diligence, and China-bound chip flows, which matters because embodied-AI progress is
              compute-intensive. Just as importantly, X Square and peers still do not disclose segment-level unit
              economics or conversion rates, and skeptical reporting says commercialization remains murky and some
              automotive-factory deployments across the sector look more like demos than true scaled sales. Policy can
              accelerate experimentation, but it cannot manufacture ROI, reliability, or trust on its own.
