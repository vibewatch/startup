      - number: '7.4'
        title: Geopolitical, supply-chain, and dependency risk
        blocks:
          - type: paragraph
            body: >-
              X Square's dependency map is broader than a normal hardware startup's because compute, channels, and
              policy all sit outside the company. The household channel is tightly associated with 58.com, and public
              proof of repeat paid demand outside that relationship is thin. On the technology side, X Square itself
              says it uses Nvidia for compute even if some lower-end functions can be sourced domestically. U.S. rules
              since late 2024 have kept widening advanced-chip controls, and 2026 guidance extended pressure to overseas
              subsidiaries of Chinese firms. Brookings and RAND differ on how smart the policy is for Washington, but
              both reinforce the central takeaway for underwriting: Chinese developers still care deeply about access to
              high-end foreign compute, and the ecosystems are separating. If channel partners hesitate, strategic
              investors stop recycling support, or compute access tightens at the wrong moment, X Square's deployment
              and financing narratives can both weaken together.
