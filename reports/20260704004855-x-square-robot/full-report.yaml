  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The call stays cautious because strategic premium factors are real, but disclosed economics are still missing at
      the current price.
    data:
      nodes:
        - id: n1
          label: Sector tailwind
          detail: China humanoid forecasts, policy support, and deployment infrastructure are improving.
        - id: n2
          label: Brain-first premium
          detail: WALL-B, data loops, and household plus enterprise deployments can justify software-like upside.
        - id: n3
          label: Strategic + state capital
          detail: Internet majors, industrials, and state-linked funds strengthen signaling and channel access.
        - id: n4
          label: Revenue opacity
          detail: No public revenue, margin, burn, headcount, or cap-table disclosure.
        - id: n5
          label: Comparable tension
          detail: Unitree and UBTECH disclose more economics at equal or lower valuation anchors.
        - id: n6
          label: 'Recommendation: research-more'
          detail: Stay engaged, but avoid underwriting a buy at the current mark.
      edges:
        - from: n1
          to: n6
          label: supports
        - from: n2
          to: n6
          label: supports
        - from: n3
          to: n6
          label: supports
        - from: n4
          to: n6
          label: constrains
        - from: n5
          to: n6
          label: constrains
    approximationNotes: >-
      The flow highlights the few variables most likely to move the committee decision rather than every possible
      diligence thread.
    claimRefs:
