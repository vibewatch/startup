  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              X Square Robot is easy to like strategically and hard to underwrite financially. The company now carries a
              public valuation anchor above RMB 20 billion, or roughly $2.8 billion to $2.9 billion, after four
              consecutive rounds, and it has assembled one of the broadest strategic cap tables in Chinese embodied AI.
              That combination is enough to keep the company in the live opportunity set. It is not enough to justify a
              buy recommendation at the current mark. Public sources still do not disclose recognized revenue, gross
              margin, burn, headcount, or financing terms, and those omissions matter more at this price than another
              round of category enthusiasm does.


              The investment committee should therefore land on research-more with medium confidence, a high risk
              rating, and a stretched valuation stance. That call is intentionally price-sensitive: if the same company
              were offered materially below the current headline mark, the asymmetry would look better. At RMB 20
              billion, however, the burden of proof shifts toward evidence that the robot-brain narrative is converting
              into auditable economics. Until that proof appears, the cleanest framing is that investors are being asked
              to buy a strategically credible option on future category leadership, not a transparently underwritten
              business.
            claimRefs:
              - CV001
              - CV004
              - CV010
