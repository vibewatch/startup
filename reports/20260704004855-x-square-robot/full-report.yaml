chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and product thesis
        blocks:
          - type: paragraph
            body: >-
              X Square Robot (自变量机器人) presents itself as a Shenzhen embodied-AI company founded in December 2023 and
              built around a brain-first thesis: solve the robot brain first, then iterate hardware, data, and
              deployment around that core. Official materials emphasize general-purpose embodied intelligence rather
              than a single-task automation product, and the public stack pairs proprietary WALL-series foundation
              models with wheeled bimanual and wheeled humanoid bodies under the QUANTA line. The company repeatedly
              frames this as a full-stack system — model, data pipeline, robot hardware, and real-world deployment —
              rather than a software wrapper on third-party robots. That positioning matters because it explains both
              investor enthusiasm and the company’s unusually broad scenario claims across household services,
              logistics, industrial tasks, and care settings. Public website materials place the headquarters in
              Shenzhen’s Nanshan District and explicitly describe the company as one of China’s earliest teams pursuing
              a fully end-to-end path to general-purpose embodied intelligence. Even at this early stage, the company’s
              identity is not just another humanoid startup; it is a model-led embodied-AI platform using robots as both
              products and data-collection instruments.
