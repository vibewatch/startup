      - number: '2.3'
        title: Buyer segmentation and X Square target verticals
        blocks:
          - type: paragraph
            body: >-
              X Square's public traction points cluster around buyers that already manage repetitive indoor labor and
              can justify supervised automation before fully autonomous humanoids are ready. In manufacturing and
              logistics, the likely economic buyer is operations or automation leadership, while daily users are line
              workers, warehouse associates, or maintenance staff; the adoption trigger is measurable throughput, labor
              flexibility, or error reduction. In home services, payer logic is different: 58.com acts as the
              distribution and operating layer, and the robot is sold first as a labor-augmentation tool embedded in a
              service contract rather than as a stand-alone consumer appliance. In eldercare, retirement homes, hotels,
              and schools, the buyer is typically a facility or care operator seeking labor leverage, service
              consistency, or branding benefits. X Square has publicly tied itself to industrial manufacturing,
              logistics, elderly care, and smart-home scenarios, while separate disclosures say it is already generating
              some revenue from schools, hotels, and retirement homes. This suggests the company is building demand from
              enterprise and managed-service channels first, with mass consumer adoption remaining a later possibility
              rather than today's core plan.
