appendices:
  - id: A
    title: Methodology and Coverage Limits
    blocks:
      - type: paragraph
        body: >-
          This judgment synthesizes the completed X Square chapters dated 2026-07-04 and relies on public company
          releases, independent robotics and finance reporting, policy materials, and peer disclosures. No management
          interviews, data-room documents, or non-public financial statements were used.
        claimRefs: []
      - type: list
        items:
          - No public source discloses recognized revenue, ARR, gross margin, burn, cash, runway, or headcount.
          - Later 2026 round sizes and cumulative capital are not fully reconciled across public sources.
          - >-
            Named customer proof outside the 58.com household channel remains thin, and renewal or repeat-use behavior
            is undisclosed.
          - Board composition, succession planning, and detailed governance rights remain opaque.
        claimRefs:
          - CI037
          - CV004
          - CU025
          - CU044
          - CR039
  - id: B
    title: What Would Upgrade the Call
    blocks:
      - type: callout
        title: Upgrade criteria
        body: >-
          Moving from research-more to buy would require auditable revenue and margin disclosure, repeat paid
          deployments beyond 58.com, stronger safety and compliance evidence, and clearer cap-table plus compute-supply
          underwriting.
        calloutType: recommendation
        claimRefs:
          - CV039
          - CV044
          - CV045
          - CR001
          - CR031
          - CR045
      - type: list
        items:
          - Bridge recognized revenue and gross margin to current deployments.
          - Show repeat-booking or retention cohorts for household and institutional use.
          - Disclose named customer concentration, contract structure, and renewal behavior.
          - Provide stronger safety-certification, incident-reporting, and export-control resilience evidence.
        claimRefs:
          - CV044
          - CU031
          - CU032
          - CR040
          - CR045
          - CR047
          - CR048
