  evidenceGaps:
  - type: missing-source
    severity: material
    topic: benchmarking
    missingEvidence: Independent standardized benchmark results or a reproducible public evaluation harness for WALL-B, WALL-WM, and WALL-OSS against peer embodied models.
    whyItMatters: Without neutral benchmarking, it is hard to separate genuine model-generalization gains from cherry-picked demos or company-authored comparisons.
    diligencePath: Request raw task logs, task definitions, baseline configs, and evaluator-owned reruns on a public suite such as LIBERO-style tasks or equivalent internal benchmark set.
    relatedQuestionRefs:
    - QE019
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: system-safety-certification
    missingEvidence: System-level household, industrial, or manipulator safety certifications and test reports for Quanta X1, Quanta X2, and the ArtiXon hand beyond radio-equipment authorization.
    whyItMatters: Embodied robots operating around residents, cleaners, or industrial staff need more than wireless compliance; the absence of publicly named safety packs weakens deployment trust.
    diligencePath: Obtain the certification matrix, lab reports, hazard analysis, and any internal safety-case documents used for home, eldercare, logistics, or industrial rollouts.
    relatedQuestionRefs:
    - QE020
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: fleet-reliability
    missingEvidence: Public uptime, MTBF, remote-intervention rate, recovery-time, and service-staffing metrics for household, logistics, eldercare, and industrial deployments.
    whyItMatters: The model story may be compelling, but underwriting commercialization requires proof that robots can stay online, recover from faults, and be supported economically.
    diligencePath: Ask for fleet dashboards, site-level SLA summaries, service tickets, and intervention logs segmented by deployment type and robot body.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE002
    - TE004
  - type: missing-source
    severity: minor
    topic: home-data-governance
    missingEvidence: A public description of consent, privacy, retention, and safety-escalation rules for home and eldercare data gathered through the X Family and 58.com programs.
    whyItMatters: Real-home deployment is a technical differentiator, but it also creates trust risk if residents do not understand how sensory and behavioral data are collected and used.
    diligencePath: Review customer-facing consent language, retention schedules, incident-escalation playbooks, and any privacy-by-design controls attached to live-home pilots.
    relatedQuestionRefs:
    - QE020
    - QE024
