- id: section-e2
  title: 'Model Stack: WALL-A, WALL-B, WALL-WM, and WALL-OSS'
  body: 'The strongest part of the technical story is the progression of the model stack. WALL-A is described as a VLA system that integrates world models, causal inference, and real-robot reinforcement learning so a robot can infer what hidden or deformed objects are likely doing and then adapt its action policy in flight. WALL-B extends that idea by collapsing perception, language, action, and physical prediction into the World Unified Model, which X Square says is better suited to long-horizon household work than a modular pipeline stitched together after the fact. WALL-WM then pushes the same direction further by modeling event-level transitions instead of fixed-interval frames, while WALL-OSS exposes a public open-source branch of the stack. The technical ambition is clear: move from a robot that maps perception to action toward one that carries an internal predictive model of physical consequences. What is less clear is independent validation. Public numbers such as the 4-of-17 tasks
    above 80 percent completion are company-authored, and the company itself has acknowledged that embodied-AI benchmark regimes are still immature.'
  claimRefs:
  - CE010
  - CE011
  - CE015
