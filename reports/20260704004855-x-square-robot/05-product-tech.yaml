  rows:
  - - WALL-A
    - Internal model team and deployment operators
    - Live foundation model in public demos and deployments
    - VLA plus world-model and causal-feedback framing
    - Independent benchmark suite and reproducible task logs are not public
  - - WALL-B / WUM
    - Household and long-horizon task deployments
    - Released April 2026
    - Unified training of perception, language, action, and physical prediction
    - No third-party paper or standardized leaderboard verifies household generalization
  - - WALL-OSS / wall-x
    - Developers and third-party robot builders
    - Public open-source surface since 2025 with active 2026 updates
    - Open-source training plus serving stack rather than demo-only marketing
    - No packaged releases and limited enterprise support artifacts
  - - Quanta X1
    - Research, logistics, and open-environment operations teams
    - Active deployment platform
    - Wheeled bimanual body used in food-delivery and parcel-handling demos
    - Payload, uptime, and service economics remain undisclosed
  - - Quanta X2
    - Household, service, and industrial operators
    - Public flagship wheeled humanoid with FCC radio filing
    - Up to 62 DoF, 20-DoF hands, tool clamp, cleaning attachments
    - System-level safety and reliability certifications are not public
  - - ArtiXon hand
    - Manipulation developers and teleoperation workflows
    - Publicly named and SDK-supported
    - High-DOF five-finger hand with ROS 2 secondary-development surface
    - No standalone spec sheet or durability testing data is public
  - - XRZero / QUANXTA Zero
    - Data-collection and model-training teams
    - Publicly described and partly open-sourced in 2026
    - Robot-free or mixed capture workflow intended to lower embodied-data cost
    - Claims on cost ratio and transfer quality are still company-authored
  notes: Rows combine official site language, press releases, and public repositories. Maturity reflects the strongest public evidence available, not a private customer acceptance milestone.
