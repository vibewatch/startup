- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer / process / component
  - role
  - dependency
  - risk
  rows:
  - - WALL-A
    - Core VLA plus world-model manipulation policy
    - Real-robot RL, teleoperation, exoskeleton, UMI capture
    - Generalization claims are strong but externally benchmarked evidence is sparse
  - - WALL-B / WUM
    - Unified perception-language-action-physics model for home tasks
    - Large multimodal training and physical prediction within one network
    - Household generalization remains mostly company-asserted
  - - WALL-WM
    - Event-level world model for future physical-state prediction
    - Aligned language, vision, and action event segmentation
    - Benchmark superiority claims are not independently reproduced
  - - WALL-OSS / wall-x
    - Open-source training, inference, evaluation, and serving stack
    - GitHub repo, LeRobot data prep, Hugging Face checkpoints
    - No packaged releases and unclear support commitments for external adopters
  - - XRZero / QUANXTA Zero
    - Data capture, cleaning, annotation, training, inference, and evaluation pipeline
    - Ergonomic interfaces, quality checks, and cross-embodiment transfer
    - Cost and throughput claims rely on company-authored repos or trade coverage
  - - SDKs and X-Tokenizer
    - Robot APIs plus multi-embodiment action-token abstraction
    - Ubuntu tooling, ROS 2, gRPC, action-token checkpoint workflow
    - Developer-grade setup complexity may slow customer integration
  notes: This table mixes model, data, and control layers because X Square markets the system as a single closed loop. Dependencies highlight what has to work together for the stack to ship.
