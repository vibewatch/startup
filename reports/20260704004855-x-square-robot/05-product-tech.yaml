- id: TE002
  title: Workflow / use-case table
  columns:
  - user job
  - current workflow
  - x square solution
  - measurable benefit
  - limitation
  rows:
  - - Home cleaning
    - Human cleaners perform all tasks manually
    - 58.com service pairs a robot with a professional cleaner
    - Real paid deployments create household data and customer feedback loops
    - Robot still handles only structured chores and depends on human fallback
  - - Open-environment food delivery
    - Humans navigate and deliver through variable outdoor or indoor conditions
    - Quanta X1 running WALL-A
    - Company says it handled wind, deformed packaging, and occlusion without human intervention in the task loop
    - No public repeat-rate, fleet-size, or SLA statistics
  - - Parcel sorting / logistics
    - Human sorters handle irregular parcels in clutter
    - Quanta X1 with zero-shot mobile manipulation claims
    - Public demos suggest irregular-item identification without per-item scripting
    - Warehouse throughput and error rates are not public
  - - Household companion / data residency
    - No persistent robot presence in normal homes
    - X Family Member Program puts robots with families for up to one month
    - Creates long-tail real-home data for model iteration
    - Program scale, intervention rate, and retention outcomes are undisclosed
  - - Eldercare and hospitality support
    - Human staff deliver items, clean, patrol, and assist residents
    - Embodied robots in senior-care and service scenarios
    - Company claims broader deployment breadth beyond household cleaning
    - No public clinical, safety, or staffing KPI disclosure
  - - Industrial and automotive assistance
    - Manual or fixed automation for repetitive transport and handling
    - Jinbei Auto and logistics collaborations using the same model family
    - Suggests one stack may span service and industrial settings
    - No public proof yet of repeatable high-volume industrial economics
  notes: Benefits are public claims or public workflow interpretations, not audited customer ROI. Null fields are avoided by stating the public limitation directly.
