- id: section-e5
  title: Trust, Compliance, and Roadmap Limits
  body: Public trust signals exist, but they are narrower than the company's commercialization narrative. The cleanest formal artifact is the FCC radio authorization for Quanta X2, which confirms that a named wheeled humanoid product exists in a real certification process. China's 2026 humanoid standards and digital-ID regime also create a clearer regulatory baseline for deployment. The hand and robot SDKs additionally publish concrete operator constraints such as RF-distance rules, finger-safety warnings, low-battery behavior, mapping thresholds, and control-frequency limits. Those are useful signs of engineering seriousness, but they do not close the largest diligence gaps. Reviewed materials do not publish system-level household or industrial safety certifications, incident histories, MTBF, remote-intervention rates, or standardized third-party benchmarks for the WALL stack. Management has openly acknowledged that benchmark frameworks remain weak, and current household deployments still
    rely on human cleaners or intervention paths. The roadmap from WALL-A to WALL-OSS, LeRobot integration, WALL-B, WALL-WM, and the 2026 data-platform releases is fast and technically ambitious, but underwriting the roadmap still requires private proof on reliability, safety, and reproducibility.
