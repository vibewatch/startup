companyProfile:
  summary: >-
    X Square Robot (自变量机器人) is a Shenzhen-based embodied-AI startup founded in December 2023 by Wang Qian. The company is built around a brain-first thesis: pair WALL-series embodied foundation models, a closed-loop data stack, and programmable wheeled robots such as Quanta X1 and Quanta X2 so deployments improve the models and the models improve deployments. Public traction is strongest in household services through the 58.com cleaning partnership and the X Family Member home program, with additional but less transparent revenue signals from schools, hotels, and retirement homes. By mid-2026 the company had reached Series C with a valuation above RMB 20 billion, backed by major internet, venture, strategic, and state-linked investors, while still leaving core operating economics largely undisclosed.
  foundedDate: '2023-12-01'
  founders:
    - name: Wang Qian
      role: Founder & CEO
      background: Tsinghua graduate with a USC doctorate who previously worked on robot learning and attention-mechanism research.
      claimRefs:
        - CO007
        - CO008
  foundingLocation: Shenzhen, China
  headquarters: Shenzhen, China
  productSummary: >-
    X Square sells embodied-AI robotics platforms centered on Quanta X1 and Quanta X2 wheeled dual-arm robots, the ArtiXon dexterous hand, and the WALL-A / WALL-B / WALL-WM / WALL-OSS model stack, with household cleaning, logistics, industrial, and service workflows as the main visible use cases.
  customerFocus: >-
    China-based household-service channels and institutional buyers in schools, hotels, retirement homes, logistics, and industrial settings; the 58.com household channel is the clearest named proof point, while Japan and Singapore discussions appear exploratory.
  businessModel: >-
    Near-term monetization appears to combine paid household-service sessions, institutional robot deployments or sales, and partner-led commercialization; longer-term upside from RaaS, software, or data-model licensing remains thesis-driven rather than publicly proven.
  stage: Series C private
  fundingStatus: >-
    Public disclosures show a January 2026 Series A++ round of roughly $140 million and late-June/July 2026 financing waves culminating in Series C at a valuation above RMB 20 billion; public cumulative funding is substantial but not cleanly reconcilable because later round sizes were not fully disclosed.
