        title: Upgrade criteria
        body: >-
          Moving from research-more to buy would require auditable revenue and margin disclosure, repeat paid deployments beyond 58.com, stronger safety and compliance evidence, and clearer cap-table plus compute-supply underwriting.
        calloutType: recommendation
        claimRefs:
