summary:
  headline: >-
    X Square Robot is a strategically credible embodied-AI startup with a real model-and-data flywheel and elite capital backing, but opaque economics and a stretched valuation keep the right call at research-more.
  overallScore: 6.7
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 2800
