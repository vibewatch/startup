  topStrengths:
    - >-
      Brain-first full-stack positioning pairs WALL models, proprietary data tooling, and Quanta robots rather than
      relying on hardware spectacle alone.
    - >-
      Real-world household and service deployments create a credible data-collection loop that could compound model
      quality faster than lab-only peers.
    - >-
      The cap table is unusually strong for a young robotics company, spanning Alibaba, Meituan, ByteDance, Xiaomi, IDG,
      HongShan, and state-linked capital.
    - >-
      Wheeled dual-arm embodiments are better aligned with near-term service and logistics tasks than a pure
      bipedal-humanoid narrative.
  topRisks:
    - Public sources still do not disclose recognized revenue, gross margin, burn, runway, headcount, or unit economics.
    - >-
      The household cleaning offer remains human-supervised and partly novelty-driven, limiting proof of durable
      labor-substitution ROI.
    - >-
      Public customer proof is concentrated around 58.com while named institutional accounts, contract terms, and
      retention remain opaque.
    - >-
      A valuation above RMB 20 billion already prices in a premium versus better-disclosed peers and leaves material
      down-round risk if traction slips.
    - >-
      Safety, privacy, and export-control or compute-supply risks remain meaningful for an in-home embodied-AI company
      training on frontier chips.
  unresolvedGaps:
    - Audited or otherwise recognized revenue, ARR, gross margin, burn rate, cash balance, and runway.
    - Repeat-booking, retention, and cancellation behavior for the 58.com household-service channel.
    - Named institutional customers, contract sizes, renewal structure, and customer concentration outside 58.com.
    - Full cap-table economics, liquidation preferences, board rights, and dilution after the recent financing wave.
    - Safety certification, incident history, MTBF, and privacy-compliance controls for in-home deployments.
    - Compute-supply resilience, training-cost structure, and the margin impact of Nvidia dependence.
