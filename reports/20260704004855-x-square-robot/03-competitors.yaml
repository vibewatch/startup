  rows:
  - - X Square Robot
    - China model-led wheeled dual-arm embodied-AI company
    - RMB 20B+ valuation; early revenue but no public shipment total
    - Home services, hospitality, schools, retirement homes, factory pilots
    - WALL-B + XR Zero + channel-rich investor base
