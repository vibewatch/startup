- id: pricing-and-form-factor
  title: Pricing opacity and wheeled-dual-arm versus humanoid trade-offs
  body: |-
    Public pricing is one of the clearest asymmetries in this market. Unitree G1 is still the only major direct benchmark with a clearly visible low-end public price, and that matters because it sets the buyer's mental anchor even when the comparison is imperfect. X Square does not disclose robot list pricing in the source pack; instead, its public signals are home-service collaboration through 58 Group plus management commentary that consumer adoption probably needs something closer to a $10,000 price point. Figure, Fourier, UBTECH, and Boston Dynamics also show the category's default posture: capability narratives and deployment stories, but little unit-level pricing. That opacity makes price-performance underwriting harder and pushes diligence back toward total workflow economics.

    The more important comparison for X Square is form factor. Its wheeled dual-arm path looks well matched to flat-floor, repetitive indoor service or factory assistance where lower mechanical complexity and faster data collection may matter more than perfect anthropomorphic mobility. Bipedal peers advertise something different: Figure and 1X emphasize home generality, Unitree and Fourier emphasize dynamic movement and dexterity, and AgiBot and UBTECH emphasize industrial workflows that may require more humanlike reach or step-over behavior. X Square's form factor is therefore a deliberate workflow choice, not a universal substitute for humanoids.
