chapter:
  number: 3
  title: Competitors
  summary: X Square Robot is entering a crowded 2026 embodied-AI market where Unitree and AgiBot set the Chinese price-and-scale anchor, while Figure, 1X, and Boston Dynamics shape the global home and trust benchmark. X Square's best wedge is a brain-first, wheeled-dual-arm strategy built around WALL-B, XR Zero, and service or factory data loops, but moat durability is only medium because pricing, shipment scale, and enterprise proof remain materially thinner than those of several direct peers.
sections:
- id: competitive-landscape
  title: Competitive landscape — direct peers, global benchmarks, and substitutes
  body: |-
    X Square Robot is not competing against one neat class of rivals. The direct Chinese peer set already spans Unitree, AgiBot, Galbot, Fourier, UBTECH, and RobotEra, each emphasizing a different edge: Unitree on public entry pricing and developer accessibility, AgiBot on mass-produced portfolio breadth, Galbot on state-backed capital and industrial orders, Fourier on dexterity-forward hardware, UBTECH on industrial delivery, and RobotEra on a full-stack claim with thin public disclosure. Global peers shape the aspiration set differently. Figure and 1X are the clearest home-assistance benchmarks, while Boston Dynamics still functions as a trust and enterprise-readiness reference even when its commercial packaging is opaque in the source pack.

    The substitute set matters just as much. TrendForce and Morgan Stanley both describe 2026 as a commercialization year for China humanoids, but DirectIndustry still cautions that many public demos look more like technology demonstrators than fully operational systems. That warning is important for X Square because buyers can still solve many target jobs with task-specific automation, AMRs, quadrupeds, or labor instead of paying for a general-purpose platform. The result is a field where X Square must win on workflow fit and data compounding, not just on novelty.
