- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Public evidence
  - Mitigation / diligence ask
  rows:
  - - WALL-B / WUM architecture
    - Competing VLAs converge or copy the same abstraction
    - high
    - Figure Helix and other embodied-model stacks are already racing toward generalist manipulation
    - Request benchmark methodology, transfer-learning win rates, and task success versus peer baselines
  - - XR Zero data-efficiency loop
    - Home-service data proves narrow or low-value outside domestic chores
    - high
    - X Square frames XR Zero as a cost reducer, but monetization proof is still thin
    - Ask for data-to-deployment conversion evidence across home and factory tasks
  - - Channel-rich investor base
    - Strategic investors do not convert into repeat contracts
    - medium
    - 58, Chery, and auto-linked capital imply routes to market but not guaranteed revenue
    - Obtain signed commercial pipeline, conversion rates, and deployment milestones by partner
  - - Wheeled dual-arm form factor
    - Bipedal rivals win more workflows because they traverse spaces built for humans
    - medium
    - Home and factory pilots support the wheel-based thesis, but rivals market richer mobility
    - 'Stress-test where wheels stop working: stairs, mixed-floor environments, and non-structured homes'
  - - China cost structure
    - Hardware commoditization collapses differentiation and price premiums
    - high
    - Public sources already frame body hardware as commoditizing rapidly
    - Measure whether X Square can defend gross margin with software, data, or service attach
  - - Early commercialization narrative
    - Buyers default to UBTECH, AgiBot, Boston-style trust stacks, or task-specific substitutes
    - high
    - Industrial rivals disclose more delivery proof while sector skeptics still call many deployments demonstrators
    - Request customer renewals, uptime, labor displacement metrics, and integration references
  notes: This register focuses on durability, not raw technical merit. A moat can be strategically interesting and still fragile if price, trust, or deployment proof lag.
