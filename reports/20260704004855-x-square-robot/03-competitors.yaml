- id: moat-durability
  title: Moat durability and the adverse case
  body: |-
    X Square's strongest moat candidate is the combination of its World Unified Model thesis, XR Zero data-efficiency claim, and early deployment channels that can feed real-world data back into the stack. That is a meaningful differentiator because the sector is converging on the view that cognition, not metal, is the long-run scarcity. But the durability of that moat is not yet high. ChinaBiz Insider explicitly argues that hardware is commoditizing, and the broader market evidence supports that concern: Unitree weaponizes cheap public hardware access, AgiBot is normalizing large-scale portfolio deployment, Galbot is amassing capital and industrial data, and UBTECH is turning industrial deliveries into a software-and-services wedge.

    The adverse case therefore has three pieces. First, X Square still lacks the public shipment, pricing, and repeat-order evidence that would prove its model advantage is monetizing. Second, if home-service workflows remain narrower than expected, then a wheeled domestic wedge may collect less economically useful data than hoped. Third, if buyers continue to prefer task-specific automation or trust-heavy turnkey vendors, then X Square can be strategically important without becoming the default commercial winner. The fairest 2026 judgment is a real but medium-durability moat.
