  - - Unitree
    - China hardware-led humanoid and quadruped vendor
    - 2024 revenue > RMB 1B; G1 priced from about $13.5K; IPO prep reported
    - Developers, labs, price-sensitive commercial buyers
    - Visible price floor plus broad developer access
    - Enterprise workflow layer and trust depth are lighter publicly
  - - AgiBot
    - China portfolio-scale embodied-robot operator
    - 5,000 robots shipped at CES 2026; 10,000th robot by Mar 2026
    - Industrial, commercial, retail, security, hospitality
    - Broadest disclosed deployment packages and portfolio breadth
    - Realized pricing and international proof remain limited
  - - Galbot
    - China full-stack embodied-model peer
    - RMB 2.5B 2026 round; valuation > RMB 20B; thousands of industrial orders claimed
    - Industrial manufacturing, retail, healthcare
    - Large dataset and strong state-backed industrial momentum
    - Economics and pricing remain undisclosed
  - - Fourier
    - China dexterity-forward humanoid vendor
    - Mass-produced GR-1 and spec-heavy GR-2 disclosures
    - Developers, enterprise experimentation, embodied-AI research
    - Strong public dexterity and SDK narrative
    - Commercial delivery scale and pricing are not public
  - - UBTECH
    - China industrial humanoid incumbent
    - Orders > RMB 800M; Walker S2 mass delivery; 5,000-unit annual target
    - Automotive, smart factories, logistics, data centers
    - Best public industrial delivery and turnkey posture among Chinese peers in this pack
    - Less focused on home-service narrative than X Square
  - - RobotEra
    - China full-stack embodied-intelligence peer
    - Homepage-level disclosure only in supplied pack
    - General embodied-intelligence applications
    - Claims full-stack self-developed stack
    - Too little public detail to underwrite scale or economics
  - - Figure AI
    - US capital-intensive humanoid startup
    - $39B post-money valuation; >$1B committed capital
    - Home assistance and commercial workforce automation
    - Helix + BotQ + strongest capital position
    - Pricing and customer-scale disclosure remain sparse
  - - 1X
    - Nordic/US home-humanoid startup
    - $100M Series B; >$125M total disclosed
    - Consumer home assistance plus logistics and guarding
    - Safety-led in-home design with teleoperation fallback
    - Much smaller balance sheet than Figure and thin industrial proof
  - - Boston Dynamics
    - Global enterprise-trust benchmark and substitute
    - Commercial deployment cited by TrendForce but no public pricing in pack
    - Inspection, industrial automation, enterprise robotics
    - Trust, engineering rigor, and incumbent status
    - Less direct overlap with X Square home-service thesis
  - - Status-quo substitutes
    - Task-specific automation and human labor
    - Deep installed base and known ROI models
    - Warehouses, factories, inspection, household services
    - Cheaper or operationally simpler in many narrow workflows
    - Less general-purpose than embodied robots if category matures
  notes: Rows compare the best public evidence in the supplied pack; blank economics reflect disclosure gaps, not absence of business activity.
