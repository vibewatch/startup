- id: scenario-ranges-and-return-logic
  title: Bull, base, and bear cases
  body: |-
    The scenario exercise matters because the current entry price already discounts a meaningful amount of success. In the bull case, X Square becomes one of the very small number of Chinese embodied-model winners that turns household and enterprise data loops into recurring service or software economics, discloses enough to pursue an IPO cleanly, and retains strategic capital support. That can justify a large step-up from the current mark. In the base case, pilots convert only gradually, state and strategic capital remain supportive, but the company still looks more like a well-funded deployment operator than a fully proven software platform. That case supports only moderate upside from today's price, which is why the investment is not obviously attractive on a venture-return basis.

    The bear case is easy to imagine and does not require disaster. If home-service economics stay thin, enterprise pilots fail to convert into repeat contracts, peers keep extending their economics or disclosure lead, or export-control and compliance costs rise, the company can move from premium narrative to down-round candidate quickly. The probability balance therefore tilts toward the base case rather than the bull case. That is the heart of the valuation call: upside exists, but a large part of it is already being asked for at entry.
