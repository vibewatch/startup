- id: why-a-premium-can-exist
  title: Why a premium can exist at all
  body: |-
    There is a real thesis behind the premium. X Square is not selling a generic humanoid-hardware story; it is selling a brain-first embodied-AI story in which foundation models, data pipelines, household trials, and enterprise pilots reinforce each other. The 58.com launch, the X Family Member home program, and management's statements about revenue from schools, hotels, and retirement homes all support the idea that X Square is trying to accumulate real-world data faster than pure lab competitors. China's own policy backdrop also helps. TrendForce, Morgan Stanley, Shenzhen policy notices, and Guangdong's new training-ground framework all point toward 2026 as a year when commercial validation, policy support, and deployment infrastructure are converging.

    The shareholder roster strengthens that argument. Four major Chinese internet groups have led different rounds, while state-linked and industrial funds have joined the later syndicate. That combination matters because it can improve channel access, deployment opportunities, and capital durability. It is also why the market is willing to entertain a brain premium before revenue proof is complete. Still, the same evidence also shows the limits of that support: policy, strategic capital, and partner logos can create a floor under attention, but they do not substitute for disclosed economics or for clean minority-protection terms.
