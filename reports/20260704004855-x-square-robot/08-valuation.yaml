- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - No revenue bridge
    - Next round or IPO-prep step still lacks recognized revenue and gross margin disclosure
    - Turns brain premium into pure narrative risk
    - Do not add capital; move stance toward avoid.
  - - 58.com pilot fails to compound
    - No repeat-booking or city-expansion evidence beyond headline pilot
    - Weakens household data-loop and channel thesis
    - Cut home-service premium from the model.
  - - Enterprise pilots stay shallow
    - No named repeat industrial or institutional contracts
    - Suggests deployments are demos rather than durable GTM proof
    - Mark down base-case probability and valuation range.
  - - Strategic / state follow-on fades
    - No follow-on participation from key strategics or state-linked funds in next financing
    - Removes an important signaling and de-risking support
    - Increase downside probability materially.
  - - Peer economics pull away
    - Unitree, UBTECH, or global peers disclose better economics while X Square stays opaque
    - Makes the current premium look increasingly unjustified
    - Demand a lower entry price or pause diligence.
  - - Compute / policy friction rises
    - Material chip-control, licensing, or compliance constraint on training or deployment
    - Raises cost and slows the route to software-like margins
    - Rebase margin assumptions and extend exit timeline.
  notes: Triggers are framed as observable events that would directly change the investment recommendation rather than as generic watch-items.
  claimRefs:
  - CV031
  - CV039
  - CV041
  - CV043
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Cap table and preferences
    - Post-Series-C waterfall, option pool, liquidation stack, anti-dilution rights
    - Headline valuation can be misleading if terms subordinate new money.
    - Finance and legal diligence with management, lead investors, and counsel.
  - - Revenue and gross margin
    - Recognized revenue by vertical, gross margin, burn, runway, headcount
    - This is the single largest blocker to underwriting the current price.
    - Management accounts and auditor-backed schedules under NDA.
  - - Repeat-order cohorts
    - Renewal, rebooking, and expansion data for 58.com and institutional customers
    - Separates a real GTM engine from a data-collection pilot.
    - Customer reference calls and cohort dashboards.
  - - Industrial pipeline
    - Named factory customers, contract values, acceptance milestones, backlog conversion
    - Needed to justify a premium over better-disclosed peers.
    - Commercial diligence with customer and investor introductions.
  - - Compute resilience
    - Chip supply plan, training budget, export-control mitigation, model retraining cadence
    - Compute bottlenecks can slow the entire brain-premium thesis.
    - CTO diligence plus supply-chain and legal review.
  - - IPO readiness
    - Draft listing workplan, governance upgrades, internal controls, timetable
    - IPO rhetoric matters only if disclosure and governance are catching up.
    - Board, CFO, and sponsor diligence.
  notes: These asks are the minimum package required before moving from research-more toward a true buy recommendation at the current valuation.
