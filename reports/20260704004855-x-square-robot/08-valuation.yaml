    - 25%
    - Brain premium proves real, household and enterprise loops convert into recurring economics, and disclosure improves to IPO quality.
    - $7B-$12B value and attractive multi-bagger upside from today.
    - Fails if recurring economics never materialize or Figure/Unitree-class peers widen the proof gap.
  - - Base
    - 50%
    - Pilots convert gradually, strategic capital stays supportive, but X Square remains more deployment-heavy and more opaque than a true software platform.
    - $2.2B-$4.0B value; limited upside from the current mark unless terms are unusually investor-friendly.
    - Breaks if follow-on rounds happen without stronger operating disclosure.
  - - Bear
    - 25%
    - Home-service monetization stays thin, enterprise pilots stall, and policy or compute friction rises as peer economics become clearer.
    - $0.8B-$1.5B value and credible down-round risk.
    - Triggered by no revenue bridge, weak repeat deployments, or financing on harsher terms.
