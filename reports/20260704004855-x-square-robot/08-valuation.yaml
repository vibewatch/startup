- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric anchor
  - Valuation / status
  - Relevance
  - Limitation
  rows:
  - - X Square Robot
    - Model-first embodied AI plus household / enterprise deployment loops
    - '>$2.8B private valuation, June 2026'
    - Subject company; shows the premium investors are currently underwriting.
    - No public revenue, margin, headcount, or term disclosure.
  - - Unitree
    - 2024 revenue >RMB 1B; 2025 humanoids >51% of revenue; 60% combined GM
    - '>RMB12B / ~$1.64B post-Series-C with IPO prep underway'
    - Best China comp for disclosed commercialization and public-readiness discipline.
    - More hardware- and developer-led than X Square's brain-first home-service narrative.
  - - Galbot
    - Large funding plus claimed industrial-order momentum
    - '>RMB20B valuation plus RMB2.5B 2026 round'
    - Closest China peer for full-stack or model-led premium with state backing.
    - Economics remain opaque and public evidence is still narrative-heavy.
  - - Figure AI
    - Helix + BotQ + home/commercial deployment narrative
    - $39B post-money at >$1B committed capital
    - Global frontier ceiling for what markets may pay for a perceived category leader.
    - Different capital market, investor base, and scale; not a clean transfer multiple.
  - - 1X
    - Home humanoid positioning and $100M Series B
    - Funding disclosed; valuation not public in this source pack
    - Useful global benchmark for home-assistance ambition and smaller-scale capital formation.
    - Much earlier and smaller than X Square or Figure.
  - - UBTECH
    - RMB2.001B revenue; ~RMB820M full-size humanoid revenue; orders >RMB800M
    - Listed-company filing plus official delivery disclosure
    - Best public reference for disclosed Chinese humanoid economics and industrial commercialization.
    - Public-company benchmark rather than direct private-round valuation.
  notes: Comparables mix private marks, public filings, and milestone anchors because X Square lacks the disclosure needed for a single clean multiple framework.
  enumerationScope:
    coverage: partial
    basis: Rows cover the most decision-relevant Chinese and global humanoid or embodied-AI peers visible in the reviewed 2025-2026 source set, but not every private round or listed robotics company.
