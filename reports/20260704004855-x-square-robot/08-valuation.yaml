slug: x-square-robot
runDate: '2026-07-04'
company:
  name: X Square Robot
chapter:
  number: 8
  title: Valuation
  summary: 'X Square Robot is strategically interesting because investors are paying for a brain-first embodied-AI platform with unusually broad strategic and state-backed support, real household and enterprise deployment loops, and exposure to a fast-growing China humanoid market. But at RMB 20 billion / roughly $2.8 billion to $2.9 billion, public evidence still lacks disclosed revenue, gross margin, headcount, or financing-term clarity, so the current mark is supportable only as strategic optionality rather than as fully underwritten operating value. Net: research-more, medium confidence, high risk, stretched valuation.'
sections:
- id: recommendation-and-entry-discipline
  title: Recommendation and entry discipline
  body: |-
    X Square Robot is easy to like strategically and hard to underwrite financially. The company now carries a public valuation anchor above RMB 20 billion, or roughly $2.8 billion to $2.9 billion, after four consecutive rounds, and it has assembled one of the broadest strategic cap tables in Chinese embodied AI. That combination is enough to keep the company in the live opportunity set. It is not enough to justify a buy recommendation at the current mark. Public sources still do not disclose recognized revenue, gross margin, burn, headcount, or financing terms, and those omissions matter more at this price than another round of category enthusiasm does.

    The investment committee should therefore land on research-more with medium confidence, a high risk rating, and a stretched valuation stance. That call is intentionally price-sensitive: if the same company were offered materially below the current headline mark, the asymmetry would look better. At RMB 20 billion, however, the burden of proof shifts toward evidence that the robot-brain narrative is converting into auditable economics. Until that proof appears, the cleanest framing is that investors are being asked to buy a strategically credible option on future category leadership, not a transparently underwritten business.
