- id: anti-thesis-and-comparable-discipline
  title: Anti-thesis and comparable discipline
  body: |-
    The anti-thesis starts with a simple question: why should X Square trade around or above some better-disclosed peers before it has shown the same operating evidence? Unitree reportedly entered IPO prep at a valuation above RMB 12 billion while already disclosing revenue, and TrendForce says its 2025 prospectus showed humanoids overtaking quadrupeds with 60% combined gross margin. UBTECH, a listed public benchmark, disclosed RMB 2.001 billion of revenue and roughly RMB 820 million of full-size humanoid revenue in 2025. Figure remains an entirely different scale reference at $39 billion, but even there the valuation is still being justified by future home and commercial autonomy rather than by mature disclosed earnings. X Square sits awkwardly between those comps: richer than some disclosed Chinese peers, nowhere near Figure's capital scale, and still materially more opaque than public or near-public benchmarks.

    That opacity is not unique to X Square; Galbot's public materials are also thin even as its funding and state-backing narrative grows. But that is not a defense of X Square's price. It is evidence that private Chinese embodied-AI valuations are often being set by strategic scarcity and policy alignment faster than by published unit economics. The committee should therefore treat comparable analysis as a discipline tool rather than a comfort blanket: the peer set shows there is room for premium outcomes, but it also shows that today's mark already assumes X Square will prove a durable model advantage that public evidence has not yet validated.
