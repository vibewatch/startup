  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: cap-table
    missingEvidence: Exact liquidation preferences, participation rights, anti-dilution protections, employee pool size, and seniority for the recent B+/B++/C rounds.
    whyItMatters: At a stretched private entry price, terms can determine whether the headline valuation translates into attractive common-equity exposure.
    diligencePath: Request the post-Series-C cap table, term sheets, and a financing waterfall model from management and counsel.
    relatedQuestionRefs:
    - QV032
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: economics
    missingEvidence: Recognized revenue, customer mix, gross margin, burn rate, headcount, and backlog or contracted deployment metrics.
    whyItMatters: Without operating metrics, the current mark can only be judged through analogies and strategic signaling rather than through underwritten business economics.
    diligencePath: Obtain management accounts, KPI dashboards, and customer-cohort data under NDA.
    relatedQuestionRefs:
    - QV010
    - QV033
    relatedTableRefs:
    - TV001
    - TV006
  - type: conflicting-data
    severity: material
    topic: total-raised
    missingEvidence: A reconciled round-by-round ledger for every financing since inception, including round size, pre-money, post-money, and use of proceeds.
    whyItMatters: Public sources disagree on cumulative funding and later rounds disclosed valuation but not round size, making dilution and runway hard to model.
    diligencePath: Cross-check board approvals, SAIC filings, and investor-side deal memos against management's financing summary.
    relatedQuestionRefs:
    - QV006
    - QV034
    relatedTableRefs:
    - TV004
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: repeat-deployment-cohorts
    missingEvidence: Repeat booking, renewal, or cohort retention data for home-service pilots and non-58 enterprise deployments.
    whyItMatters: The valuation assumes data loops and early pilots convert into durable customer relationships rather than one-off demos or subsidized proofs of concept.
    diligencePath: Request cohort data, signed renewal contracts, and reference calls with 58.com, schools, hotels, retirement homes, and named industrial customers.
    relatedQuestionRefs:
    - QV009
    - QV011
    - QV028
    relatedTableRefs:
    - TV003
    - TV006
