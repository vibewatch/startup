- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Pillar
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Brain / model moat
    - World-model and data-pipeline story can earn software-like premium if it compounds faster than hardware peers.
    - Independent proof of model superiority is still thinner than the company-authored narrative.
    - Third-party field benchmarks, repeat task-success metrics, and disclosed software or service economics.
  - - Commercial proof
    - 58.com, home programs, and institutional sales comments show the company is in real environments.
    - Pilots can still be subsidized field labs rather than durable revenue engines.
    - Renewal cohorts, repeat bookings, named industrial contracts, and revenue by vertical.
  - - Strategic capital
    - Internet majors plus state and industrial funds can improve access to channels, policy, and follow-on capital.
    - Strategic signaling does not disclose terms, dilution, or minority-investor protections.
    - Post-Series-C cap table, liquidation stack, and evidence of commercial contracts sourced from investors.
  - - Market timing
    - 2026 sector forecasts suggest China humanoids are entering a faster commercialization phase.
    - Bubble risk and 5-10 year maturity skepticism imply the market may be paying too early.
    - Evidence that deployments are converting faster than the skeptical timeline.
  - - Comparable discipline
    - Global and Chinese peers prove investors will pay large premiums for embodied-AI leaders.
    - Unitree and UBTECH show that cleaner revenue disclosure can exist at equal or lower valuation anchors.
    - X Square closing the disclosure gap without losing momentum.
  - - Exit readiness
    - IPO preparation talk suggests management is already orienting toward capital-market credibility.
    - Current disclosure is far below what public-market comparables already show.
    - Board-ready financials, audited accounts, and a credible listing timetable.
  notes: The table separates the premium case from the underwriting gap and names the exact evidence that would resolve each tension.
