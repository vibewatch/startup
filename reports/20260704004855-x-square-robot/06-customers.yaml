- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: X Square Robot's public customer journey runs from labor pain and channel access to supervised deployment, data collection, and only then broader account or geography expansion.
  data:
    items:
    - label: Service or labor pain
      detail: Households, institutions, or operators face repetitive physical tasks that are costly or hard to staff
      tone: warning
    - label: Channel or account entry
      detail: 58.com, direct enterprise outreach, or strategic investors provide the initial route into a workflow
      tone: neutral
    - label: Human-in-the-loop deployment
      detail: Robots work alongside cleaners, staff, or operators rather than replacing them end to end
      tone: neutral
    - label: Operational data capture
      detail: Real-world edge cases become training data for the WALL model stack and future product iterations
      tone: positive
    - label: Deeper household or site expansion
      detail: Programs such as X Family Member attempt to extend from one cleaning session toward longer usage
      tone: neutral
    - label: Vertical and geographic extension
      detail: Management then points to schools, hotels, retirement homes, industrial use, and Japan/Singapore outreach
      tone: positive
  approximationNotes: This is a reconstructed commercialization path based on public deployment narratives and management commentary, not a vendor-published CRM funnel.
