- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - 58.com household channel
    - Public proof is heavily concentrated in one domestic platform relationship
    - If the partnership stalls, the clearest customer evidence disappears with it
    - Request channel economics, exclusivity terms, and city expansion data
  - - X Family Member Program
    - May create strong qualitative product learning but unclear commercial conversion
    - Could consume resources without producing durable revenue
    - Request participant count, follow-on conversion, and household satisfaction data
  - - Institutional revenue in schools / hotels / retirement homes
    - Revenue exists but no named accounts are public
    - Investors cannot underwrite concentration, churn, or renewal by customer type
    - Obtain top-account list, site counts, contract terms, and reference calls
  - - Industrial / logistics / semiconductor / biotech positioning
    - Scenario breadth may outrun verified deployments
    - Risk that strategic tie-ups are pilots or showcase projects rather than scaled contracts
    - Separate signed customers, pilots, and unpaid trials in a pipeline deck
  - - Japan / Singapore outreach
    - International expansion is still conversation-stage
    - Could signal ambition without near-term revenue contribution
    - Request pilot MOUs, local partners, and timeline by geography
  - - China-centric policy and testing base
    - Domestic testbed strength may mask geographic concentration
    - The same policy tailwinds that help pilots do not prove exportability or retention
    - Measure revenue share by geography and by channel partner
  notes: The table separates land-and-expand logic from concentration risk; most public proof still sits at the channel- and scenario-level rather than the named-account level.
  claimRefs:
  - CU017
  - CU023
  - CU024
  - CU033
  - CU034
  - CU036
  - CU040
  - CU043
  - CU044
- id: TU006
  title: Why a retention cohort figure cannot be rendered from public data
  columns:
  - Missing public field
  - Why cohort rendering fails
  - Closest proxy available
  - Implication
  - Diligence ask
  rows:
  - - Same-household repeat bookings over time
    - No month-by-month or quarter-by-quarter repeat usage is published
    - Order-count snapshots from Yicai and AFP
    - Cannot distinguish novelty demand from habit formation
    - Request repeat-booking cohorts and household reactivation rates
  - - Named institutional renewals
    - Schools / hotels / retirement homes are disclosed only as unnamed revenue categories
    - Management quote on current revenue
    - No renewal curve or account-level expansion path can be drawn
    - Obtain account list with start dates and renewal status
  - - Active installed base by vertical
    - No public counts of live robots by segment or site
    - Dozens of robots in Beijing and scenario lists elsewhere
    - Cohorts cannot be normalized across customer types
    - Request active fleet by vertical and geography
  - - Contract terms and churn events
    - No published term length, churn reason, or decommission events
    - None
    - Retention curve would be fabricated rather than evidence-based
    - Review contract templates and churn logs
  - - Customer satisfaction time series
    - No public NPS, SLA, or repeat-service score history
    - Anecdotal user comments and worker quotes
    - Durability cannot be inferred from qualitative reactions alone
    - Request customer surveys, service ratings, and complaint history
  notes: This substitution table is deliberate. Public data is sufficient for a proof-quality matrix and adoption funnel, but not for a defensible cohort figure with time-bucketed retention percentages.
