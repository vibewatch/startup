- id: institutional-expansion-and-proof-gradient
  title: Institutional expansion and the proof gradient from named channel to unnamed accounts
  body: 'Management has widened the customer story far beyond home cleaning, but the proof quality declines as the company moves away from 58.com. CNBC quoted chief operating officer Yang Qian saying X Square Robot was already generating revenue from sales to schools, hotels, and retirement homes and was speaking with customers in Japan and Singapore. That is directionally important because it implies the company has moved from pure demo mode into at least some institutional monetization and early overseas business development. However, none of those segments comes with named institutions, deployment counts, contract values, or outcome metrics in the public record. A similar pattern holds for industrial and sectoral positioning. Official and secondary materials place the company in industrial manufacturing, logistics, and food-delivery or parcel-handling workflows, while a lower-confidence BigGo Finance synthesis goes further and says X Square has batch deployments in semiconductor displays
    and biopharmaceuticals. Those claims fit the company''s broader brain-first commercialization pitch and the presence of industrial strategics such as 58 Group and auto-linked investors, but they still stop short of the sort of named production references that would let an investor score vertical penetration with confidence. The chapter''s core customer-proof gradient is therefore: named household channel first, unnamed institutional revenue second, broad scenario positioning third.'
