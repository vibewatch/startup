chapter:
  number: 6
  title: Customers
  summary: X Square Robot has crossed from prototype theater into real paid customer exposure, but its public proof is still highly uneven. The 58.com home-cleaning service provides the only named, priced, and independently observed channel with order counts, while schools, hotels, retirement homes, industrial workflows, and Japan/Singapore expansion remain mostly unnamed or scenario-level disclosures. Retention, renewal, and concentration visibility are therefore the chapter's central diligence gaps.
sections:
- id: segmentation-and-buyer-user-payer-logic
  title: Segmentation and buyer-user-payer logic
  body: X Square Robot's customer map is best understood as a stack of channels rather than a clean roster of named enterprise accounts. The most concrete commercial segment is household cleaning through 58.com and its 58 Daojia local-services channel, where the payer is the household or the platform booking the service, the user is a combined human-cleaner-plus-robot work team, and the economic logic is service-substitution plus data collection rather than outright robot sales. A second household segment is the X Family Member Program, where robots live with families for up to one month as companions and long-tail task learners; here the user is the family, but the real economic beneficiary is X Square itself because the program appears designed to generate real-world data before mass-market hardware pricing is viable. Outside the home, management says the company already generates revenue from schools, hotels, and retirement homes, implying institutional buyers and budget owners, but it
    has not named those accounts, published site counts, or separated buyers from end users such as staff, students, guests, or residents. Industrial manufacturing, logistics, semiconductor displays, biopharmaceuticals, retail, and public services all appear in company positioning, yet the public record mostly frames them as deployment scenarios or strategic directions rather than fully attributed customer references. That leaves 58.com as the clearest buyer-channel proof, while most other segments remain one layer less verified.
