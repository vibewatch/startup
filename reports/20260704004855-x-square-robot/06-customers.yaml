- id: household-proof-paid-adoption-and-observed-limitations
  title: Household proof, paid adoption, and observed limitations
  body: 'The household channel is where X Square Robot has the strongest public customer proof because it combines a named partner, a price point, field reporting, and observed robot behavior. Across company statements, Yicai reporting, and AFP coverage carried by Tech Xplore, the service is a paid three-hour cleaning package priced at roughly RMB148 to RMB149 in Beijing and Shenzhen, with robots handling structured tidying while human cleaners do deep or judgment-heavy work. Yicai reported dozens of robots deployed in Beijing and more than 400 orders soon after launch, while AFP later described roughly 200 booked households and quoted both a cleaner and a customer on what the robot did well and poorly. Those observations matter because they move the chapter beyond logos: the robot can pick up debris, fold clothes, and organize surfaces, but it remains slow, cannot sweep or mop to human standards, and still needs human supervision plus reliable connectivity. The resulting adoption signal
    is therefore real but qualified. Customers are paying for a service and the service is getting booked, yet much of the present value appears to be novelty, workload reduction at the margin, and training-data collection rather than fully autonomous labor replacement.'
  claimRefs:
