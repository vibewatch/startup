    {
      "id": "sizing-and-contradictions",
      "title": "China and global sizing through multiple lenses",
      "body": "Published market numbers point in the same directional conclusion — fast growth — but they measure different things. DirectIndustry, citing IDC, frames the realized 2025 global humanoid market at about 18,000 units and roughly USD 440 million of hardware revenue, which anchors how early the category still is. MarketsandMarkets offers broader forecast lenses: USD 5.41 billion global humanoid revenue in 2026 growing to USD 50.27 billion by 2035, and a separate China lens of USD 0.40 billion in 2025 rising to USD 2.80 billion by 2030. Morgan Stanley's June 2026 China estimate is more commercial and narrower: 50,000 units and about USD 2 billion this year, explicitly excluding prototypes and internal-use robots. TrendForce, meanwhile, emphasizes shipment acceleration — 94% output growth in 2026 and roughly 80% share for Unitree plus AgiBot — while 36Kr's 915 billion yuan to 1 trillion yuan embodied-intelligence estimate is far broader than humanoid hardware and would overstate X Square's direct SAM if read literally. The right conclusion is not to pick one winner, but to treat X Square's near-term addressable market as a subset of China's fast-growing indoor-workflow automation spend, not as the full embodied-AI macro narrative.",
