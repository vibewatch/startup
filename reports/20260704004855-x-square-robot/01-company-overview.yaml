  - TO002
- id: capital-formation-and-investor-base
  title: Funding pace, valuation step-up, and investor base
  body: 'Capital formation is the clearest external validation point in the chapter, but it is also where disclosure gaps widen fastest. Independent and company-linked reporting agree that X Square raised more than $100 million in September 2025, another roughly RMB 1 billion / $140 million in January 2026, then a further sequence of 2026 rounds that pushed the company above RMB 20 billion (~$2.8-2.9 billion) valuation by July. Public reports consistently place Alibaba, Meituan, ByteDance, HongShan / Sequoia China, Xiaomi, and multiple state or quasi-state funds around the cap table, with later reporting also naming CICC Capital, China Insurance Investment, and China Mobile among the strategic or financial backers. The capital story therefore points to three reinforcing constituencies: internet strategics betting on the application layer, industrial partners betting on deployment, and state-linked funds betting on embodied AI as a nationally prioritized technology stack. What is missing
    is the underwriting detail an investor would actually want: exact round dates and sizes after January 2026, cumulative fully diluted ownership, board seats, liquidation preferences, employee option pool size, or any debt / secondary component. The result is a company that looks exceptionally well sponsored, but still only partially transparent.'
