company:
  name: X Square Robot
chapter:
  number: 1
  title: Company Overview
  summary: X Square Robot is a Shenzhen-based embodied-AI startup founded in December 2023 that combines a brain-first foundation-model strategy with self-developed wheeled robot bodies. By July 2026 it had progressed from early model releases to household and enterprise deployment pilots and a reported valuation above RMB 20 billion, but governance, revenue, customer, and headcount disclosure still lag the pace of capital formation.
sections:
- id: identity-and-product-thesis
  title: Identity, headquarters, and product thesis
  body: 'X Square Robot (自变量机器人) presents itself as a Shenzhen embodied-AI company founded in December 2023 and built around a brain-first thesis: solve the robot brain first, then iterate hardware, data, and deployment around that core. Official materials emphasize general-purpose embodied intelligence rather than a single-task automation product, and the public stack pairs proprietary WALL-series foundation models with wheeled bimanual and wheeled humanoid bodies under the QUANTA line. The company repeatedly frames this as a full-stack system — model, data pipeline, robot hardware, and real-world deployment — rather than a software wrapper on third-party robots. That positioning matters because it explains both investor enthusiasm and the company’s unusually broad scenario claims across household services, logistics, industrial tasks, and care settings. Public website materials place the headquarters in Shenzhen’s Nanshan District and explicitly describe the company as one of China’s earliest
    teams pursuing a fully end-to-end path to general-purpose embodied intelligence. Even at this early stage, the company’s identity is not just another humanoid startup; it is a model-led embodied-AI platform using robots as both products and data-collection instruments.'
  claimRefs:
