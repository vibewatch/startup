  - CI031
  - CI032
  - CI033
- id: s3
  title: Cost structure, unit economics, and data/model upside
  body: 'The cost structure is likely dominated by hardware, field labor, and data/compute rather than by software margins. X Square’s public materials emphasize proprietary robots, dexterous hands, and an end-to-end data pipeline, while CNBC explicitly says the company uses Nvidia chips for computing. That matters because paid household cleaning still requires a human companion, so the headline RMB 149 fee almost certainly says little about standalone robot contribution margin. The upside case is real but still optional: the company says household and industrial deployments feed a data flywheel, and Robotics & Automation News says its Quanxta Zero tools can collect nearly 100 demonstrations per hour, potentially lowering model-training cost. Yet no source discloses COGS, gross margin, warranty reserve, or service labor mix. Peer benchmarks show both possibility and uncertainty: Unitree’s official G1 list price is US$13.5K at the low end, while CNBC cites an unofficial US$80,000 proxy for
    X Square and UBTECH’s HKEX filing shows that full-size humanoids can reach 37.7% gross margin at scale. X Square gives investors no way to know where within that band it sits.'
