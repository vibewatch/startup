- id: s2
  title: Go-to-market motion and commercialization proxies
  body: 'Go-to-market appears partner-led, deployment-heavy, and data-seeking rather than self-serve. The 58.com launch gives X Square a consumer-facing distribution partner, but the service itself is still human-assisted and better understood as a live field-lab than as a mature home-robot business. Official communications also describe the X Family Member Program, under which robots live with families for up to one month, reinforcing that household deployment is being used to collect long-tail interaction data as much as to monetize service hours. Outside the home, the company cites schools, hotels, retirement homes, logistics, manufacturing, eldercare, and public-service scenarios, which suggests a multi-vertical enterprise motion with custom pricing and high-touch deployment. The sales-efficiency problem is that nearly every public signal is a proxy: RoboHorizon says the cleaning service was booked solid for weeks, and CNBC confirms some revenue exists, but there is no CAC, payback,
    close-rate, or contract-duration disclosure. KrASIA’s warning that many factory projects across the sector are still demos or strategic tie-ups is therefore directly relevant when judging how commercial these deployments really are.'
  claimRefs:
  - CI010
  - CI013
  - CI014
  - CI015
