company:
  name: X Square Robot
chapter:
  number: 4
  title: Financials
  summary: X Square Robot has credible financing momentum—officially a RMB 1 billion A++ round in January 2026 and a valuation above RMB 20 billion ($2.8 billion) after four consecutive rounds by late June 2026—but public financial disclosure remains thin. Public revenue signals exist through paid home-cleaning pilots and management comments about sales to schools, hotels, and retirement homes, yet no reviewed source discloses recognized revenue, gross margin, burn, runway, cash, or headcount. The result is a business that looks well funded and commercially active, but still must be underwritten through pricing proxies, peer filings, explicit public gaps, and adverse evidence on valuation froth and compute-supply dependency.
sections:
- id: s1
  title: Revenue streams, pricing, and recognition opacity
  body: 'X Square’s public monetization looks like a hybrid of service bookings, bespoke robot sales, and scenario-specific deployment contracts, but the mix is not disclosed. The clearest live stream is the 58.com household cleaning service, where a robot works beside a human cleaner; RoboHorizon reported a roughly RMB 149 booking price, which is useful only as a service proxy because it bundles human labor and does not reveal robot ASP. Management also told CNBC the company already generates some revenue from schools, hotels, and retirement homes, while official materials describe deployments across industrial, logistics, elderly-care, hospitality, retail, and public-service settings. What remains missing is crucial: CNBC said pricing is set by use case, there is no public list price, and no source discloses how X Square books hardware, service, or any eventual model/data revenue. DirectIndustry’s broader observation that Chinese humanoid vendors are moving toward RaaS and platform models
    makes the omission more important, because X Square’s eventual revenue quality may depend more on recurring service and data economics than on one-off robot shipments.'
  claimRefs:
