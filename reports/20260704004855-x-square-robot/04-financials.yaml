- id: s4
  title: Capital adequacy, investor mix, and valuation trajectory
  body: 'Capital access is the strongest public part of the story. Official materials show a Xiaomi-backed Series B in April 2026 after a RMB 1 billion A++ in January 2026, and by late June the company said it had closed four consecutive rounds culminating in Series C at a valuation above RMB 20 billion ($2.8 billion). The syndicate is strategically notable: company statements cite follow-on backing from HongShan and Xiaomi, earlier lead support from Meituan, Alibaba, and ByteDance, and new Series C participation from IDG. That mix matters because it combines consumer internet distribution, hardware ecosystem relevance, and venture signaling. The underwriting problem is reconciliation and sufficiency. CNBC previously reported around RMB 2 billion ($280 million) of total investment across eight rounds after an Alibaba-led financing, while Tracxn later listed $723 million across six rounds and even a 2021 founding date, conflicting with official claims that the company launched in December
    2023. So the valuation trajectory is unmistakably steep, but the public capital ledger is still too noisy to back-solve precise dilution, cash balance, or runway.'
