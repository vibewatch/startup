  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: capital-total
    missingEvidence: A management-certified round-by-round financing ledger with dates, amounts, post-money valuations, and investor names.
    whyItMatters: Public sources triangulate cumulative capital only loosely, which makes dilution, cash remaining, and valuation progression difficult to underwrite.
    diligencePath: Request the cap-table bridge and board-approved financing summary used for investor reporting.
    relatedQuestionRefs:
    - QI015
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: recognized-revenue
    missingEvidence: Recognized revenue by month or quarter, split by household service, institutional sales, and industrial deployments.
    whyItMatters: Without booked revenue by line, it is impossible to tie pilot activity or deployment headlines to valuation or to revenue quality.
    diligencePath: Request management accounts and a booked-revenue bridge for the last four quarters.
    relatedQuestionRefs:
    - QI004
    - QI022
    relatedTableRefs:
    - TI001
    - TI005
  - type: missing-source
    severity: material
    topic: pricing-and-asp
    missingEvidence: Realized ASP, discounts, bundled support terms, and price ladders by use case.
    whyItMatters: Public proxies range from RMB 149 service bookings to bespoke institutional robot pricing, which is too wide to support any defensible margin model.
    diligencePath: Request signed customer contracts, top-customer invoices, and a pricing waterfall by vertical.
    relatedQuestionRefs:
    - QI002
    - QI003
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-cogs
    missingEvidence: BOM, field-service labor cost, warranty reserve, gross margin, and contribution margin by revenue line.
    whyItMatters: The entire bull case on X Square depends on whether hardware and service deployments can compound into attractive unit economics instead of perpetual subsidy.
    diligencePath: Request a unit-economics model covering hardware, household service, and institutional deployment cohorts.
    relatedQuestionRefs:
    - QI005
    - QI009
    - QI010
    - QI012
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-burn-runway-headcount
    missingEvidence: Latest cash balance, monthly burn, forward runway, and current headcount by function.
    whyItMatters: Headline fundraising strength cannot substitute for actual runway, especially in a compute-intensive and human-assisted deployment model.
    diligencePath: Request the latest balance sheet, rolling 13-week cash forecast, and departmental headcount snapshot.
    relatedQuestionRefs:
    - QI018
    - QI023
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: customer-concentration-and-debt
    missingEvidence: Top-customer concentration, backlog conversion, receivables aging, and any debt or project-finance schedule.
    whyItMatters: A company can look commercially active yet still be exposed to a few customers, slow collections, or hidden financing obligations.
    diligencePath: Request top-10 customers by revenue, receivables aging, backlog schedule, and all debt or leasing agreements.
    relatedQuestionRefs:
    - QI019
    - QI022
    relatedTableRefs:
    - TI005
