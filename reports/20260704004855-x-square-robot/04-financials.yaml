- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Public status
  - Exact diligence path
  rows:
  - - Recognized revenue by line
    - Cannot bridge pilots and deployments to valuation or price-to-sales logic
    - Undisclosed
    - Request monthly recognized revenue split across household service, institutional sales, and industrial deployments
  - - Delivered units and backlog conversion
    - Operational claims do not translate into booked revenue without acceptance data
    - Undisclosed
    - Request delivered units, signed backlog, acceptance criteria, and conversion timing by vertical
  - - Realized ASP and discounting
    - Custom pricing prevents any credible ASP waterfall
    - Use-case specific only
    - Request top-customer contracts, price cards, discounts, and support bundles
  - - Gross margin / COGS / service labor mix
    - No basis to judge whether revenue is high-quality or subsidy-like
    - Undisclosed
    - Request BOM, service labor cost, warranty reserve, and gross margin by line
  - - Cash balance
    - Runway and downside resilience cannot be modeled
    - Undisclosed
    - Request latest balance sheet and restricted-cash detail
  - - Burn rate and runway
    - Next financing risk cannot be timed
    - Undisclosed
    - Request monthly cash burn, 12-month plan, and downside scenario
  - - Headcount and functional mix
    - Operating leverage and hiring intensity cannot be tested
    - Undisclosed
    - Request headcount by R&D, manufacturing, field ops, and G&A
  - - Customer concentration / debt obligations
    - Backlog quality and balance-sheet risk remain hidden
    - Undisclosed
    - Request top-10 customer share, receivables aging, debt schedule, and any project-finance commitments
  notes: These are material underwriting gaps, not cosmetic omissions; public commercialization signals exist, but the audited financial bridge does not.
