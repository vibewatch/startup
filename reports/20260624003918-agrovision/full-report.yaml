      - number: '4.3'
        title: Capital Structure, Funding History, and Capital Adequacy
        blocks:
          - type: paragraph
            body: >-
              Fruitist's capital structure as of mid-2026 comprises $443M in cumulative equity raised and a $400M senior
              secured credit facility closed in November 2024, bringing total equity-plus-credit capital raised to over
              $843M. The company characterizes total raised at "$600M+" combining equity and credit; the $600M+ figure
              reflects that a portion of the credit facility refinanced pre-existing debt and may also reflect only a
              subset of equity rounds in the most commonly cited source. The LA Business Journal's "$600M+ since
              founding" is consistent with the pre-October-2025 capital position.

              The August 2024 $100M equity round from Aliment Capital and Steve Kaplan (Oaktree co-founder) established
              the $1B+ unicorn valuation. The October 2025 $150M equity round led by J.P. Morgan Asset Management, with
              Ray Dalio's family office doubling its position, brought total equity to $443M and signaled strong
              institutional conviction. J.P. Morgan managing director Brad Demong stated that the company had "built a
              moat around its business" and cited "control of its value chain, significant organic growth opportunity
              ahead, and positioning as a driving force of premiumization of berries."

              The $400M credit facility (November 2024), arranged by Rabobank and Banco Santander with participation
              from Goldman Sachs, Barclays, Scotiabank, BBVA, BanBif, Banco ITAU, BTG Pactual, COFIDE, and ICBC,
              replaced a prior $210M credit line plus short-term credit lines. The new facility comprises a $230M
              five-year term loan and a $150M three-year revolving credit line. Primary use of proceeds was refinancing
              of existing debt, with remaining capital directed at farm expansion, new market entry, and technology
              investment. The company has invested $550M+ since inception, a figure that materially exceeds any single
              funding round and implies capital has been deployed faster than equity alone could supply.

              Cash on hand, monthly burn, and runway are not publicly disclosed. CEO Magami stated in October 2025 that
              demand "far exceeds" available supply and that capital is being directed into production capacity — a
              signal of growth-mode spending rather than near-term profitability focus. The recent appointment of Rich
              Sullivan (ex-SurveyMonkey CFO) signals a maturation of financial governance in preparation for potential
              future strategic events, including a possible IPO.
