      - number: '2.2'
        title: 'TAM, SAM, and SOM: Multiple Sizing Lenses'
        blocks:
          - type: paragraph
            body: >-
              Market sizing for the premium fresh berry category requires careful scope definition because analyst
              estimates vary substantially depending on whether the count includes fresh-only versus processed berries,
              blueberries only versus all berry types, and global versus North American markets. Three primary sizing
              lenses are relevant to Fruitist's investment case.

              The broadest TAM lens is the global fresh berry market, sized by Mordor Intelligence at USD 36.73B in
              2026, growing to USD 45.14B by 2031 at a 4.22% CAGR. Strawberries hold the largest share (~32% in 2025)
              but blueberries carry the highest sub-segment CAGR (6.92% through 2031). The Business Research Company
              (TBRC) reports a slightly narrower global berry market — including processed forms — at USD 26.97B in
              2025, growing to USD 28.42B in 2026 at 5.4%, reflecting a scope that includes frozen, dried, and
              concentrate. These two estimates bracket the USD 25-26B range cited in canonical industry commentary for
              2024.

              Within the TAM, the blueberry sub-segment that is Fruitist's core product is sized at USD 9.84B in 2025
              and USD 10.49B in 2026 (TBRC/Research & Markets, 6.5% CAGR), while Business Research Insights places the
              2026 blueberry market at USD 10.75B with a 4.7% CAGR through 2035. The blueberry sub-segment therefore
              represents approximately 25-29% of the broader fresh berry TAM, reflecting its outsized importance
              relative to other berry types.

              The most directly relevant SAM for Fruitist is the North American premium berry retail segment plus key
              international export corridors. US retail berry dollar sales reached USD 12.5B for the 52 weeks ending
              June 2025 (Circana OmniMarket), up 7.5% year-over-year and more than twice the next leading produce
              category (grapes). Premium branded berry packs are a fast-growing sub-segment within this figure, but an
              independent third-party estimate of the premium tier's exact share is not publicly available — Fruitist's
              own claim of 22% CAGR for the premium category in 2019-2024 is company-stated and independently
              unverified. At a rough premium share of 15-25% of US retail, the North American premium berry SAM would be
              approximately USD 1.9-3.1B, to which international premium export markets add materially.

              Fruitist's SOM is defined by its current revenue: approximately USD 350M in FY2024 and USD 400M+ in the
              last-twelve-months as of April 2025, implying roughly 13-21% current penetration of the estimated North
              American premium SAM. The company's stated ambition is to grow volumes by multiples over the next several
              years.
