      - number: '2.5'
        title: Buyer, User, Payer, and Channel Segmentation
        blocks:
          - type: paragraph
            body: >-
              The fresh premium berry category has a concentrated retail channel structure dominated by national grocery
              chains, club/warehouse stores, and specialty/natural food retailers. The end consumer is the primary user
              and payer; the retailer category buyer is the immediate gatekeeper and makes the ranging decision. For
              premium berry brands, winning shelf at a relatively small number of key accounts (Costco, Walmart, Whole
              Foods, Trader Joe's, Publix, Sprouts, Albertsons, Giant/Wakefern, ShopRite) determines category reach at
              scale.

              Within the consumer base, Fresh Trends 2025 data from over 1,100 surveyed US shoppers shows that 54% of
              consumers purchased blueberries in the last 12 months — tied with strawberries for most-purchased berry.
              Higher-income consumers (HHI >USD 100K) are the most frequent purchasers at 64%, making the premium
              segment a premium-income demographic capture opportunity. Younger consumers (Gen Z 32%, Millennials 24%)
              purchase organic blueberries at substantially higher rates than older generations (9% for Baby Boomers),
              pointing toward a generational tailwind as Gen Z's purchasing power grows. Nearly half (45%) of consumers
              reported purchasing jumbo/extra-large blueberries in the last 12 months.

              The club/warehouse channel (Costco) represents a strategically important payer: high volume, large SKU
              sizes, and a member demographic that skews higher income. This channel is particularly well-suited to
              Fruitist's jumbo blueberry value proposition. Specialty natural food chains (Whole Foods, Sprouts) are
              high-affinity channels given their premium positioning and health-conscious shopper base. National grocery
              chains provide the volume scale for broad distribution.

              On the international side, Fruitist sells to retailers in 28-40 countries with China and the UK/Europe
              being key markets. China in particular is served under the Big Skye brand with direct retail
              relationships. Budget ownership for berry category decisions sits with produce directors and category
              managers at the retailer, with consumer pull data (velocity, turn, price realization) as the primary
              adoption trigger for new berry brands.
