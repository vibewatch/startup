              Fruitist's commercial scale has grown rapidly since the Fruitist consumer brand launched in 2020. The
              company recorded approximately $350 million in sales for FY2024 per the Los Angeles Business Journal, with
              trailing 12-month sales of $400 million or more as of April 2025, driven by jumbo blueberry sales that
