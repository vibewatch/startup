      - number: '7.6'
        title: Financial, Capital Intensity and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Agrovision closed a $400M senior secured credit facility in November 2024, comprising a $230M five-year
              term loan and a $150M three-year revolving credit line, arranged by Rabobank and Banco Santander with
              participation from Goldman Sachs, Barclays, Scotiabank, BBVA, and others. This refinanced a prior $210M
              facility and represents a significant increase in financial leverage for a private company whose revenue
              was approximately $350M in FY2024. Total capital invested since inception exceeds $550M. The
              debt-to-revenue ratio is approximately 1.1x, which creates material covenant and refinancing risk if
              revenues miss projections or berry prices decline. Three structural pressures could compress revenues
              simultaneously: tariff-driven market redirection, climate-driven volume shortfall, and Driscoll's
              competitive pricing pressure. The revolver matures in 2027 and the term loan in 2029, creating a
              refinancing window that aligns with anticipated IPO timing — if IPO markets are closed or the company's
              performance disappoints, refinancing on acceptable terms may be challenging. Private-company opacity means
              no public P&L or debt covenant terms are available, preventing independent verification of the company's
              financial health. The risk transmission map (FR002) shows how the six risk vectors cascade to revenue,
              margin, credit, and valuation outcomes. The kill criteria table (TR005) establishes seven monitorable
              triggers for thesis-break events, anchored to observable leading indicators so that investor monitoring is
              proactive rather than reactive.
