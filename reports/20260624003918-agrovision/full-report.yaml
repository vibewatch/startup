      - number: '7.7'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Thesis-Break Signal #1: Tariff Escalation Beyond 10%'
            body: >-
              If the US tariff on Peruvian/Mexican blueberries rises above the current 10% base, or if the Supreme Court
              challenge fails and tariffs become permanent and potentially broader, Agrovision's US revenue and margin
              would face a structural compression that its vertical integration alone cannot offset. Management's
              "minimal impact" narrative would be definitively disproved, forcing a re-underwriting of the investment
              thesis.
            calloutType: risk
