      - number: '2.3'
        title: Counter-Seasonal Supply, Peru, and Year-Round Availability
        blocks:
          - type: paragraph
            body: >-
              A structural advantage of Fruitist's vertical integration — and a key enabler of the premium berry
              category's year-round retail programming — is the counter-seasonal supply cycle from Peru. Domestic US
              blueberry production runs from April through September, with peak shipments in May through July across
              growing states including Washington, Oregon, Georgia, Michigan, and California. During the domestic
              off-season (October through March), US retailers depend almost entirely on imports; by early 2026,
              approximately 99% of US fresh blueberry shipment volume in the January-through-mid-March window came from
              imports alone.

              Peru has become the dominant supplier. In 2025, the US imported a record 719.8 million pounds of fresh
              blueberries — a 5% increase over 2024's previous record of 684 million pounds — with Peru supplying 405.9
              million pounds or 56% of import volume. Peru's coastal production regions (La Libertad, Lambayeque,
              Áncash, Piura) enable peak blueberry harvest from October through February, directly complementing the US
              domestic season. The USDA GAIN report (June 2025) forecasted Peru's MY2025/26 blueberry production at a
              record 355,000 metric tons with exports of 335,000 MT. In calendar year 2025, Peru ultimately exported
              412,239 MT valued at USD 2.563B — both record figures representing 17% volume growth year-over-year.

              This supply structure has evolved rapidly. Peru surpassed Chile as the leading US blueberry supplier in
              2019 and overtook Mexico in 2021. The growth trajectory has averaged approximately 30% annually since
              2016, supported by field expansion (~7,400 acres added annually, with ~62,000 acres now in production) and
              significant varietal innovation — next-generation varieties such as Sekoya Pop and Mágica now account for
              approximately 60% of planted acreage. The Chancay Port, opened to shorten Asia-bound transit by 10 days,
              is enabling rapid diversification of Peruvian exports toward China, which more than doubled its import
              value from Peru in 2025. Peru now exports to 66 distinct global markets (up from 52 in 2024).

              Fruitist's 2,100+ hectares in Peru represent a core operational anchor in this supply chain, giving it
              direct access to the counter-seasonal harvest window. Two-thirds of all fresh blueberries sold in the US
              are now imported, making import supply reliability a strategic imperative for any year-round premium berry
              brand.
