              RipeLocker partnership for shelf-life extension. The approximately 50% price premium commanded by Fruitist
              berries relative to commodity alternatives reflects both strong consumer acceptance and branding success.
              Brand partnerships with NFL quarterback Caleb Williams, USC Athletics, and D.C. United (official snack
              partner) extend the brand's reach into sports and lifestyle channels. The company also introduced the
              Fruitist Snack Cups single-serve format in 2025, targeting on-the-go healthy snacking.
