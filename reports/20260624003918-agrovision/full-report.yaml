      - number: '4.2'
        title: Pricing Architecture, Cost Structure, and Margin Framework
        blocks:
          - type: paragraph
            body: >-
              Fruitist's retail price of approximately $6–$8 per clamshell package positions the product at roughly a
              50% premium over commodity berry alternatives, making it what CEO Steve Magami has described as an
              "affordable luxury." This premium reflects proprietary genetics (jumbo size, crunch, flavor profile),
              year-round consistency, and extended shelf life enabled by RipeLocker postharvest technology. Retailer
              margin structures are not disclosed; standard fresh produce retail gross margins are in the 40–60% range,
              but the company's own realized margin on wholesale prices to retailers is not public.

              On the cost side, Fruitist's model is structurally more capital and operating-cost intensive than
              commodity produce peers because of vertical integration. Cost of goods sold in a model like this
              encompasses farm labor (Peru: up to 15,000 field workers), seed and genetics investment, irrigation and
              inputs, on-site cold storage, freight and logistics, and packaging — all of which Fruitist owns or
              controls rather than outsourcing. This full-stack ownership improves quality control and pricing power but
              means that working capital is heavily committed across long growing cycles and seasonal harvest windows.
              The company operates across eight countries with differing labor cost structures, currency exposures, and
              regulatory environments, adding complexity to cost management.

              Benchmarking against comparable public berry and produce companies provides the best available proxy for
              Fruitist's gross margin range. Fresh Del Monte Produce reported a 9.2% gross margin for FY2025 on $4.32B
              in revenue — a company that operates across a wide portfolio of commodity produce categories. Hortifrut,
              the Chilean berry specialist (blueberries, raspberries, strawberries), reported 12.7% gross margin on
              $1.215B in revenue for FY2025, though it posted a $77.7M net loss. Dole plc, the largest public produce
              company, reported $9.2B in FY2025 revenue with $395.4M adjusted EBITDA (approximately 4.3% EBITDA margin).
              Premium produce brands with stronger pricing power can achieve gross margins in the 15–25% range per
              industry benchmarks. Fruitist's branded, vertically integrated, premium positioning likely places its
              gross margin above Dole/FDM but its heavy capital investment may constrain EBITDA margins in the near
              term.
