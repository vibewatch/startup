        title: Exhibits
        blocks:
          - type: callout
            title: Exceptional Revenue Growth — 5-Year CAGR ~43%
            body: >-
              Revenue grew from ~$65.8M (2019) to $400M+ LTM (Apr 2025) — approximately 510% in six years or ~43% CAGR.
              This vastly outpaces the already-strong 22% CAGR for the premium berry category, indicating market-share
              capture on top of category growth. The blueberry business alone tripled in the 12 months preceding April
              2025.
            calloutType: strength
            claimRefs:
