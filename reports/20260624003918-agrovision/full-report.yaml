      - number: '1.3'
        title: Funding History, Valuation and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Fruitist has assembled a substantial capital base across multiple distinct financing events since its 2012
              founding. The most significant equity events occurred in 2024 and 2025. In March 2024 the company closed
              its largest equity round at that time, led by Los Angeles- based Aliment Capital (managed by Ben
              Belldegrun, who took a board seat), though the specific amount was not publicly disclosed. In August 2024,
              Agrovision closed a further $100 million equity round from Aliment Capital, Steve Kaplan (co-founder of
              Oaktree Capital Management), and the Ray Dalio family office (Bridgewater Associates), establishing the
              company's $1 billion-plus valuation. In November 2024, the company separately secured a $400 million
              senior secured credit facility arranged by Rabobank and Banco Santander — including a $230 million
              five-year term loan and a $150 million three-year revolving credit line — with Goldman Sachs, Barclays,
              Scotiabank, BBVA, and others participating, replacing an existing $210 million credit facility. In
              December 2024, Agrovision made its first acquisition, acquiring ZurGroup, a family-owned Chilean cherry
              grower and exporter with 250 hectares of blueberries and land for up to 500 hectares of cherry orchards,
              launching Agrovision Chile. In October 2025, now operating under the Fruitist brand, the company closed
              $150 million in equity led by a J.P. Morgan Asset Management vehicle, with the Ray Dalio family office
              increasing its stake and Caleb Williams' investment firm 888 Midas among new investors. Post-$150M round,
              total equity raised stood at approximately $443 million per public reporting; total capital (equity plus
              credit) exceeded $600 million per company and media statements. PremierAlts cited $1.3B total raised in
              2026, which may reflect additional undisclosed rounds or different accounting. Fruitist's valuation was
              established at $1B+ in August 2024 and has not been revised upward in publicly available post-October 2025
              disclosures.
