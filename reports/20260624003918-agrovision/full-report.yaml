      - number: '5.3'
        title: RipeLocker Partnership and Postharvest Cold Chain
        blocks:
          - type: paragraph
            body: >-
              Fruitist announced its partnership with Seattle-based RipeLocker in June 2024, becoming the first global
              berry producer to deploy the company's patented dynamic low-atmosphere vacuum chambers at commercial
              scale. RipeLocker creates a near-vacuum ultra-low-oxygen environment — approximately 4% of normal
              atmospheric oxygen — that suppresses fruit respiration by more than 50% on average, inhibits ethylene
              biosynthesis, and controls fungal pathogens, collectively extending berry shelf life to 8–12 weeks versus
              the approximately four weeks achievable with conventional cold chain plus modified-atmosphere packaging.
              In trials with Agrovision blueberries and raspberries, CEO Steve Magami confirmed the technology can
              "double the shelf life of a raspberry." The pallet-sized chambers integrate into existing cold-chain
              infrastructure and operate during ocean transit — 39 chambers fit inside a refrigerated shipping container
              — enabling substitution of air freight (approximately $3–4/kg) with ocean freight (approximately $0.50/kg)
              to distant markets such as China, India and Europe. The system monitors oxygen-to-CO₂ ratios at a 1:1
              target 24/7 with real-time mobile reporting. In 60-day blueberry trials, chambers so effectively prevented
              dehydration that berries actually gained weight. As of August 2024, Fruitist was "still working through
              the logistics" of commercial rollout, targeting full deployment "by next year." A container-scale system
              (the "RipeReefer"), built as a 20-foot prototype and tested with blueberries and kiwifruit, is the
              next-generation solution planned as a 40-foot commercial container holding approximately 18 tons versus
              10–11 tons for drum-packed containers, dramatically reducing per-kg freight cost. In parallel, all major
              farm locations operate on-site cold storage; berries are harvested, pre-cooled and dispatched with an
              unbroken cold chain to retailer distribution centres. The technology architecture table maps each supply
              chain layer, its role and its risk profile.
