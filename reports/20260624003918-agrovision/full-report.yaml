  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - IPO profitability disclosure below expectation
        - Gross margin < 15% or EBITDA margin < 8% in S-1
        - Destroys premium multiple argument; re-rates toward commodity range (0.3–0.5x EV/Rev)
        - Exit watch-list; do not participate in IPO
      - - Down-round or valuation markdown
        - Secondary market trades below $800M EV
        - Signals institutional loss of conviction; triggers further markdown
        - Re-evaluate thesis; size any position only at confirmed floor
      - - Growth deceleration
        - Revenue growth < 15% YoY for two consecutive periods
        - Removes primary justification for premium multiple above 2x EV/Revenue
        - Reduce conviction; move to research-more
      - - Tariff escalation on Peru / Morocco
        - US tariff on Peru imports exceeds 20% or Morocco exceeds 15%
        - Farm economics disrupted; margin compression and potential supply shortfall
        - Reassess cost structure; hold
      - - Food safety or crop failure event
        - Material recall affecting >5% of retail doors or >10% revenue disruption
        - Brand trust impaired; consumer willingness-to-pay premium at risk
        - Pause; do not invest until brand recovery demonstrated
    notes: >-
      Triggers represent diligence-critical events that would materially change the recommendation from track to sell or
      exit. Thresholds are indicative and based on publicly observable signals.
    claimRefs:
      - CV031
      - CV032
      - CV039
      - CV027
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - EBITDA and margin disclosure
        - No gross margin, EBITDA, or net income data publicly disclosed
        - Cannot validate 2–3x EV/Revenue multiple without confirming margin premium
        - Request in data room; await S-1 filing
      - - Cap-table and liquidation preferences
        - $443M equity across multiple rounds; preference stack unknown
        - High preference overhang can substantially reduce common equity value at IPO
        - Legal review of shareholder agreement; cap-table waterfall model
      - - Revenue bridge FY2024–2026
        - Only $350M FY2024 and $400M+ LTM (Apr 2025) publicly disclosed
        - Forward valuation depends on whether 15–25% growth is sustained post-2025
        - Management guidance; data-room financials
      - - Profitability of cherry / multi-berry expansion
        - New berry lines and ZurGroup (cherry) integration margins undisclosed
        - Expansion category could dilute margins if blueberry gross margin is highest
        - Segment-level P&L in data room
      - - Credit facility covenants and covenant compliance
        - $400M credit facility terms, covenants and compliance status unknown
        - Could restrict dividend or IPO distributions; covenant breach risk
        - ABF Journal facility terms; request covenant documentation
    notes: >-
      Priority order: EBITDA disclosure is the single most important input; without it, the valuation analysis cannot
      proceed beyond revenue multiples.
    claimRefs:
      - CV031
      - CV036
      - CV003
