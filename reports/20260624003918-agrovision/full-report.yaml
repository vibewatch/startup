      - number: '6.3'
        title: Sports Sponsorships and Brand Ambassador Partnerships
        blocks:
          - type: paragraph
            body: >-
              Fruitist's brand strategy deploys sports and cultural partnerships to shift consumer perception from
              "produce" to "performance snack." The company confirmed in February 2024 that it had signed a multi-year
              partnership with D.C. United, Major League Soccer's Washington D.C. franchise, making Fruitist the
              official and exclusive sleeve patch partner with its logo featured on the right sleeve of D.C. United's
              home and away kits. The deal also makes Fruitist the official snack of the team, D.C. United Summer Camps,
              and D.C. United Youth Soccer Programs. D.C. United President of Operations Danita Johnson stated:
              "Bringing health and wellness to the forefront of our community was an important priority for the club and
              our partnership with The Fruitist will allow us to best serve our team and the youth at D.C. United Summer
              Camps." This partnership provides branding throughout Audi Field (the club's 20,000-seat stadium in
              Washington D.C.), social and digital media inclusion, and premium client appreciation benefits at home
              matches. In 2025, Fruitist added two higher-profile sports partnerships: NFL quarterback Caleb Williams —
              the Chicago Bears first overall 2024 draft pick — joined as both investor and brand ambassador, and
              Fruitist became the official superfruit snack of USC Athletics (University of Southern California),
              connecting the brand to college athletics fandom and the LA market. CEO Magami described this portfolio:
              "These partnerships, combined with Fruitist's growing direct-to-consumer platform, reflect its strategy to
              meet consumers where they are, from stadiums to online storefronts, and reinforce its position as a leader
              in healthy, performance-driven snacking." The sponsorships serve a dual commercial function: first, direct
              consumer exposure to health-conscious fans and student athletes; second, brand equity building that
              supports premium pricing durability. The fruitist.com homepage confirms: "Fruitist is the Official
              Superfruit Snack of USC Athletics and D.C. United!" No formal ROI metrics, fan awareness lift measures, or
              conversion-to-retail attribution data have been publicly disclosed for these partnerships, representing a
              diligence gap.
