      - number: '3.5'
        title: Competitive Moats, Threats, and Fruitist's Positioning
        blocks:
          - type: paragraph
            body: >-
              Fruitist's primary competitive moat is its vertical integration — owning and operating 2,100+ hectares in
              Peru plus farms in Mexico, Morocco, Egypt, Oregon, Chile, China, and India allows it to control genetics,
              agronomics, harvest timing, postharvest handling, cold storage, and shelf-life technology end-to-end. This
              contrasts sharply with Driscoll's asset-light licensing model and Naturipe's cooperative structure, both
              of which introduce quality variability across independent growers. Fruitist's RipeLocker technology
              partnership (low-atmosphere vacuum chambers tripling shelf life) further widens the shelf-life moat vs.
              competitors relying on conventional cold chain. The company's 12,500+ North American retail doors
              represent significant distribution depth that new entrants would need years to replicate.

              However, Fruitist faces material threats. Driscoll's incumbency is formidable: with an estimated 33% US
              berry market share, Driscoll's commands shelf space, retailer relationships, and consumer brand
              recognition that Fruitist is still building. A direct Driscoll's counterattack in the jumbo premium
              blueberry sub-segment — deploying Sweetest Batch or a new dedicated premium line — cannot be ruled out.
              Hortifrut's ongoing varietal renewal in Peru means that as early as 2027-2028, a structurally improved
              Hortifrut production base will compete more aggressively in the premium segment. The genetics race via
              Fall Creek/Sekoya means third-party growers using premium Sekoya varieties will bring increasingly
              Fruitist-like quality to market at potentially lower retail prices, potentially commoditizing the jumbo
              blueberry premium over time. Peru's record blueberry export volumes — up 20% in 2025-26 — are increasing
              supply and putting downward pressure on blueberry wholesale prices, a risk for Fruitist's ~50% consumer
              price premium. In early 2026, imports constituted approximately 99% of US blueberry shipments through
              mid-March, underscoring how Peru-origin fruit (where Fruitist and its rivals both operate) dominates the
              supply picture.
            claimRefs:
              - CP036
              - CP037
              - CP038
              - CP039
              - CP040
              - CP046
              - CP047
              - CP048
