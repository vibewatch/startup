      - number: '7.4'
        title: Food Safety and Recall Risk
        blocks:
          - type: paragraph
            body: >-
              Fresh and frozen berries are one of the highest-priority food safety vectors for the US FDA. In January
              2025, the FDA published a new commodity-specific prevention strategy targeting enteric virus (hepatitis A,
              norovirus) contamination of fresh and frozen berries, the first such targeted strategy for this category.
              The strategy was motivated by a history of outbreaks specifically linked to imported berries: the FDA
              investigated a multistate hepatitis A outbreak in May 2022 linked to imported organic strawberries from
              Mexico (18 cases); the CDC investigated a linked frozen strawberry outbreak in 2023 (10 cases, 40%
              hospitalised). More recently, in February 2026, the FDA issued a Class I recall — its most serious
              classification — for 55,689 lbs of frozen blueberries from Oregon Potato Company/Willamette Valley Fruit
              Company due to Listeria monocytogenes contamination. These incidents collectively demonstrate that the
              berry supply chain carries endemic recall risk. A recall linked to Fruitist or Agrovision-branded products
              would immediately threaten relationships with Costco, Walmart, Whole Foods, and other premium retail
              accounts. The FSMA Produce Safety Rule requires pre-harvest agricultural water compliance from large farms
              as of April 2025, and the FDA sampled 1,558 frozen berry lots (FY2019–2023), detecting HAV or norovirus in
              a small fraction but flagging non-compliant firms with 180-day import alerts or full Import Alert 99-35
              placements. Agrovision's specific food safety certification status — GlobalGAP, Fair Trade, SCS audits —
              is not disclosed publicly, constituting a diligence gap. The company's hand-harvested model with up to
              15,000 field workers in Peru creates hygienic surface-area risk that parallels the conditions that
              generated prior outbreaks.
            claimRefs:
