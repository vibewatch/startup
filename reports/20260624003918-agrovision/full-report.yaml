      - number: '7.5'
        title: Labor, Governance and Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              Agrovision employs up to 15,000 field workers in Peru, approximately 60% of whom are women — a workforce
              statistic the company highlights for its social impact credentials. However, Peru's agricultural labor
              history introduces material risk: in December 2020, Peru's Congress repealed the Agrarian Promotion Law
              (Law 27360) following widespread protests by agricultural workers — including blueberry harvesters — who
              blocked highways demanding better wages and working conditions. The revised labor framework introduced
              higher minimum wages and stronger protections, but independent audits of Agrovision's specific labor
              compliance and working conditions are not publicly available, creating an ESG diligence gap. Wage
              inflation in Peru's agricultural sector and stricter enforcement of labor standards could materially
              increase Agrovision's operating costs. On governance, the company is founder-led by Steve Magami, who
              co-founded the business in 2012 and remains Chairman and CEO. As a private company, board composition,
              committee structures, and formal succession planning are not disclosed. Bloomberg's January 2025 report on
              a potential IPO — declined to confirm by management — underscores the opacity risk. Two new board members
              (Thomas Seifert, June Yang) and a new CFO (Rich Sullivan) were added in 2025, but the governance
              infrastructure of a PE-backed private company may not match the scrutiny standards required if an IPO
              proceeds. Competitive risk from Driscoll's — which controls approximately 33% of the US berry market,
              ranked #2 in US retail food and beverage brands with 12% growth in 2024, and appointed its first CMO in
              2025 for global expansion — creates a permanent ceiling on Agrovision's market share aspirations. The
              partner/dependency register (TR003) and people/execution register (TR004) provide the structured detail.
              The dependency map (FR003) shows single-point exposure nodes.
