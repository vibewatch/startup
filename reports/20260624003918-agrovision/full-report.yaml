  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Trajectory, and Growth Context
        blocks:
          - type: paragraph
            body: >-
              Fruitist generates substantially all revenue through direct-to-retailer sales of fresh premium berries —
              principally jumbo blueberries — to over 12,500 North American stores and retailers in 40 countries, under
              the Fruitist consumer brand in Western markets and Big Skye in China. The revenue mechanism is a
              traditional produce-sales model: the company grows, harvests, packages, and ships fruit from its owned and
              leased farms directly to retail partners without wholesale distribution intermediaries, monetizing a
              premium pricing position (~50% above commodity berries) enabled by genetic differentiation, year-round
              supply, and consistent quality. The Fruitist Snack Cup single-serve format, launched in 2025, represents a
              nascent adjacent revenue stream at premium per-gram pricing, though it was described as a small portion of
              total sales as of October 2025.

              The growth trajectory is exceptional by any produce-industry standard. The company reported revenue of
              approximately $65.8M in 2019, growing to $210.4M by 2022 — a 220% increase in three years — then reaching
              $300M by early August 2024, approximately $350M for full-year 2024 per the LA Business Journal, and
              surpassing $400M on a trailing-12-month (LTM) basis as of April 2025. Sales of jumbo blueberries alone
              tripled in the 12-month period preceding April 2025. The company noted that FY2024 revenue of ~$350M
              represented approximately 20% of the overall premium berry market, implying significant share in a
              high-growth subcategory that has itself compounded at 22% CAGR between 2019 and 2024. Blueberries dominate
              revenue; blackberries, raspberries, and cherries (the last via the late-2024 acquisition of ZurGroup) are
              characterized as strategic growth areas scaling from a small base.

              No forward revenue guidance, revenue split by channel, or revenue split by geography has been publicly
              disclosed. The company operates on a calendar-year fiscal year but does not publish interim or segment
              results. Recurring revenue (subscriptions, contracts) is not applicable in the fresh produce model; all
              revenue is transactional at shelf-level sell-through.
