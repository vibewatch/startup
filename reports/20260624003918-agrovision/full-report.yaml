      - number: '5.2'
        title: Genetics, Selective Breeding and Proprietary Varieties
        blocks:
          - type: paragraph
            body: >-
              Fruitist's upstream competitive moat begins in the breeding program. The company runs an active non-GMO
              selective breeding program targeting three simultaneous goals: exceptional flavor and eating experience
              (firmness, crunch, aroma, brix), climate resilience in a warming world, and logistics-compatible shelf
              life. CEO Steve Magami has stated that "the industry went too far away from flavor and towards production
              and yield for a long time, whereas we've been leaning in on flavor." Varieties are explicitly optimised
              for heat tolerance, a direct response to the retreat of earlier blueberry-producing nations such as
              Argentina, from which climate and water challenges have excluded producers. FMO's due diligence on
              Agrovision Peru confirmed it holds the most diverse offering of premium and proprietary commercial
              blueberry varieties among producers in Peru, with both conventional and organic options. Through licenses
              and strategic relationships with leading global breeding programs, the company produces varieties
              unavailable to fragmented grower-packer competitors. The product roadmap extends to "seedless cherries and
              blueberries with elevated antioxidant content" as next-generation R&D targets. Fruitist's genetics
              investment is embedded within a stated $400M+ cumulative capex commitment to global expansion, new
              genetics, AI and proprietary technologies, though the specific allocation to genetics R&D versus farmland
              and infrastructure is not publicly disclosed. The product architecture figure shows the genetics layer as
              the foundation of the vertically integrated technology stack.
            claimRefs:
              - CE010
              - CE011
              - CE012
