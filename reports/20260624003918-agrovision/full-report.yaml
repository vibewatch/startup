              - CR006
              - CR007
          - type: callout
            title: 'Thesis-Break Signal #2: Severe El Niño Disruption in Peru'
            body: >-
              A strong El Niño event (moderate-to-severe intensity) causing a >25% volume decline at the Peru hub during
              the September–November 2026 harvest would simultaneously compress revenues, test debt covenants, and
              expose the geographic concentration thesis. The 2023 precedent (>40% volume decline) shows this is not a
              tail scenario but a recurrent one.
            calloutType: risk
            claimRefs:
