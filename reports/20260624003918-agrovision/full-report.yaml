          - type: callout
            title: Undisclosed Financials — Core Diligence Blocker
            body: >-
              EBITDA, net income, gross margin, cash on hand, and debt covenants are all undisclosed. The company has
              invested $550M+ since inception in a business generating $400M+ LTM revenue — capital exceeding revenue —
              without public evidence of profitability. Peer Hortifrut ($1.2B revenue) posted a $77.7M net loss in 2025,
              illustrating that berry-sector scale does not guarantee earnings.
            calloutType: risk
            claimRefs:
              - CI023
              - CI031
              - CI032
              - CI035
              - CI039
          - type: callout
            title: High Leverage in a Capex-Intensive Model
            body: >-
              The $400M credit facility (including $230M term loan) adds material debt service on top of ongoing farm
              investment. Agricultural lending at current rates (~7-9%) implies $16–21M in annual interest. Debt
              covenants, interest rate terms, and coverage ratios are undisclosed. A production shortfall or pricing
              headwind could strain debt service capacity. Cornell's 2025 berry price study documented declining
              blueberry commodity prices, a potential margin headwind.
            calloutType: risk
            claimRefs:
              - CI015
              - CI016
              - CI030
              - CI033
          - type: callout
            title: Require Audited Financials and Full Credit Agreement Before Proceeding
            body: >-
              Any investment decision requires: (1) three years of audited financial statements; (2) unaudited
              management accounts for current-year periods; (3) full $400M credit agreement including covenants,
              springing triggers, and EBITDA maintenance tests; (4) a capex schedule showing farm investment pipeline;
              and (5) monthly or quarterly revenue and gross-margin data.
            calloutType: recommendation
            claimRefs:
              - CI031
              - CI032
              - CI033
              - CI034
          - type: callout
            title: J.P. Morgan AM Endorsement as Valuation Signal
            body: >-
              J.P. Morgan Asset Management's lead on the $150M October 2025 round provides an institutional imprimatur.
              JPAM's managing director cited Fruitist's "moat" and "durable expansion" thesis. For IPO underwriting
              purposes, JPAM's participation also suggests familiarity with the financial profile — the diligence
              pathway includes JPAM's investor presentation materials as a triangulation source.
            calloutType: insight
            claimRefs:
              - CI014
