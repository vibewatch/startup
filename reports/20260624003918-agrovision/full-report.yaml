companyProfile:
  summary: >-
    Agrovision Corp., which rebranded to Fruitist Holdings Inc. in April 2025, is a Los Angeles-headquartered,
    vertically integrated global berry company founded in 2012 by Steve Magami and Thomas Snyder. Under the consumer
    brand Fruitist (and Big Skye in China), it grows, packs, cold-stores, ships and markets premium 'snackable' jumbo
    blueberries, raspberries, blackberries and cherries from farms spanning roughly ten microclimates led by a
    ~2,100-hectare Peru hub. The company reached a $1B+ valuation in an August 2024 equity round, surpassed $400M in
    trailing-12-month sales by April 2025, and supplies 12,500+ North American retail doors (Costco, Walmart, Whole
    Foods, Trader Joe's, Publix and others) across roughly 40 countries. It has raised ~$443M of equity plus a $400M
    credit facility, and its vertical integration and proprietary genetics are positioned as the cure for inconsistent
    'berry roulette' quality that lets it command an estimated ~50% price premium.
