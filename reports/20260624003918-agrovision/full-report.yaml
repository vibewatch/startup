      - number: '2.6'
        title: Growth Drivers, Headwinds, and Market Constraints
        blocks:
          - type: paragraph
            body: >-
              The macro growth drivers for the premium fresh berry category are well-supported, but structural
              supply-side constraints and competitive dynamics introduce material risks that differentiate favorable
              from unfavorable market scenarios for Fruitist.

              On the demand side, the convergence of health-conscious snacking, GLP-1 pharmaceutical tailwinds, and
              younger-consumer organic orientation creates a multi-year structural demand expansion. US berry retail
              grew 7.5% in FY2025 (Circana), and the premium tier (jumbo, branded, organic) is growing faster.
              Fruitist's jumbo blueberry sales grew 3x in the 12 months to April 2025.

              The most critical constraint is the supply-demand imbalance in the global blueberry market. Peru's
              blueberry exports are growing at approximately 30% annually — a pace that dramatically outstrips
              consumption growth in core markets. The International Blueberry Organization (IBO) reported that between
              May and August 2025, Peru shipped 71,957 tons of blueberries (+137% YoY by volume), but export value grew
              only 44%, reflecting a sharp decline in average prices: July prices were 38% below 2024 levels, and August
              averaged USD 5.95/kg versus USD 10.08/kg the prior year. The 2025 full-year export average price was USD
              6.22/2.2 lbs — ~3% below 2024. If generic supply continues to expand faster than demand, price compression
              in the commodity tier could gradually erode the premium spread, making brand equity maintenance and supply
              differentiation (genetics, size, consistency) even more critical to defend margins.

              IBO's 2025 Annual Report characterizes the market as exhibiting "uneven growth dynamics" — a rising risk
              of oversupply in generic blueberries alongside a shortage of certain high-quality premium categories. This
              bifurcation is exactly the thesis Fruitist is executing: if the generic segment deflates while demand for
              premium continues to grow, Fruitist's brand investment becomes more strategically valuable. However, if
              premium pricing power erodes because of quality improvements across the commodity tier, the 50% price
              premium becomes harder to sustain.

              Tariffs and trade policy represent a secondary constraint. Peru and Chile currently face a ~10% US import
              tariff; India-sourced product faces 26%. Fruitist's management states tariff impact is "minimal" —
              partially defensible given its multi-origin diversification — but this is unverified from public financial
              disclosures. The company's Mexico and Morocco operations face different tariff treatments. Currency
              volatility in Peru (PEN vs. USD) and labor cost dynamics in Peru and Morocco are additional cost factors
              that are largely opaque in public data.
