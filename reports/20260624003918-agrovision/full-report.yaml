      - number: '1.5'
        title: Milestone Chronology and Adverse Checks
        blocks:
          - type: paragraph
            body: >-
              Fruitist's milestone timeline spans over a decade from a 2012 Los Angeles founding through to a potential
              IPO horizon. Steve Magami conceived the company while scouting biofuel feedstocks in northern coastal Peru
              around 2012 and recognized the region's exceptional growing conditions. The first blueberry crops were
              planted in Peru around 2015, with selective breeding (non-GMO), data analytics, and on-farm cold storage
              investment from early operations. The Fruitist consumer brand launched in 2020, entering major US retail
              chains. In 2024, the company accelerated with three major financing events: an undisclosed Aliment
              Capital-led round in March, the $100M equity round at $1B+ valuation in August, and the $400M credit
              facility in November. The ZurGroup cherry acquisition in December 2024 expanded the product category. The
              April 2025 corporate rebrand to Fruitist Holdings Inc. marked the alignment of the consumer brand with
              corporate identity. Named to CNBC's Disruptor 50 in June 2025 and expanding its leadership team in
              September, the company closed a further $150M from J.P. Morgan Asset Management in October 2025. Adverse
              and disconfirming checks are material: Bloomberg (August 2024) reported that Agrovision declined to
              release specific sales numbers at the time, citing its private-company status. The company faces tariff
              exposure on imports (~10% on most sourcing markets; ~26% from India), though management characterizes the
              impact as "minimal" given geographic diversification. No FDA recalls or major food safety incidents
              involving Fruitist products have been documented in public regulatory databases as of June 2026. The
              largest competitive threat is Driscoll's, which holds dominant berry market share and recorded 12% sales
              growth in 2024. Bloomberg's coverage also contextualizes agtech sector risk: prior investor era saw
              companies like AeroFarms and AppHarvest enter Chapter 11, raising legitimate questions about durable
              economics in capital-intensive fresh-produce ventures.
