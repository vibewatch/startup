            title: Gross Margin Estimated at 15–25% Based on Public Comps
            body: >-
              Gross margin is not disclosed. The estimate of 15–25% is derived from Hortifrut (12.7%), Fresh Del Monte
              (9.2%), and general premium-produce-brand benchmarks (15–25%). Fruitist's premium pricing and vertical
