      - number: '8.2'
        title: Public Comparable Companies and Sector Multiples
        blocks:
          - type: paragraph
            body: >-
              The public comparable set for Fruitist spans a spectrum from commodity commodity agricultural producers to
              premium branded food companies, none of which is a perfect analogue. Dole (NYSE: DOLE), the closest
              structural peer as a vertically integrated global produce distributor, trades at an enterprise value of
              approximately $2.4 billion on trailing revenue of approximately $9.4 billion (EV/Revenue ~0.25x) and an
              EV/EBITDA of approximately 5.9x as of June 2026. Fresh Del Monte (NYSE: FDP) carries an enterprise value
              of about $1.89 billion on $4.2 billion in revenue (EV/Revenue ~0.45x, P/S ~0.31x). Both companies benefit
              from vast scale economies but trade at structurally depressed multiples due to low commodity margins, high
              capital intensity, and perishability constraints.

              Hortifrut, the Chilean publicly listed berry specialist with revenue near $1 billion and an enterprise
              value near $1.5 billion (EV/Revenue ~1.3x), provides the most direct analogue in terms of product mix, yet
              also reported negative EBITDA and a net loss of approximately $78 million in its most recent fiscal year.
              The Hortifrut example illustrates a critical risk: pure berry producers without brand differentiation or
              margin protection can be unprofitable even at scale. Mission Produce (NASDAQ: AVO), an avocado-focused
              vertically integrated producer, trades at approximately 0.98x EV/Sales and 13.1x EV/EBITDA, while Calavo
              Growers (NASDAQ: CVGW) carries approximately 14.4x EV/EBITDA on a smaller revenue base under pending M&A
              activity. Premium branded food company Vital Farms (NASDAQ: VITL) — the closest brand-premium analogue in
              fresh food — traded at approximately 2x EV/Revenue in early 2025 but has compressed to approximately 0.59x
              by mid-2026 after multiple contraction in the consumer staples space.

              The Argo Advisory research note found that food sector EV/EBITDA multiples declined from 12.6x to 10.1x
              between 2021 and 2025 — a 20 percent compression — while beverage sector multiples compressed 36 percent
              over the same period. NYU Stern's January 2026 dataset puts the food processing sector median EV/Sales at
              approximately 1.47x and the pre-tax operating margin at 7.09 percent. The Fruits and Vegetables subsector
              sits at the bottom of the multiple distribution due to structural perishability, low pricing power, and
              limited brand leverage. For Fruitist to sustain a 2.5–3x EV/Revenue multiple as a public company, it must
              continue to demonstrate premium brand separation from commodity peers — a task made more difficult by the
              post-2021 repricing and the deterioration of Vital Farms' multiple despite that company's premium
              positioning.
