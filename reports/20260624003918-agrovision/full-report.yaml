      - number: '6.4'
        title: International Retail Expansion — China, UK, Europe, and Beyond
        blocks:
          - type: paragraph
            body: >-
              Beyond North America, Fruitist reports distribution in 28–40 countries (the count varies between $150M
              funding materials citing 40 countries and the April 2025 rebrand citing 28 countries — an evidence gap
              requiring clarification). The international markets span China, India, UK, Europe, the Middle East, and
              Southeast Asia. In China, the company has historically operated under the Big Skye brand, but CEO Magami
              confirmed that from 2025 all blueberries from Peru, Chile, and Chinese domestic production will be
              marketed under the Fruitist (美益粒) brand. Fruitist's first commercial blueberry harvest from its 80-acre
              Yunnan province farm occurred in 2024, with larger crops expected in subsequent years. The company
              acquired Chilean cherry specialist ZurGroup in December 2024 to enable direct cherry and blueberry export
              to China. Cherry production in China is expected to be introduced to North America and other markets
              within the next year. In Southeast Asia, Fruitist has active blueberry trials in Indonesia, Malaysia, the
              Philippines, and Thailand, leveraging new low-chill varieties capable of growing in tropical highlands.
              The UK launch of Fruitist GoBerry — a snackable fresh blueberry range in paper-based packaging designed
              for on-the-go eating — debuted exclusively at Whole Foods Market UK on January 28, 2026, with a prominent
              flagship window display at the Kensington High Street store. Further UK retail expansion is planned
              throughout 2026. Pascal Orphal, director of business development at Fruitist, stated: "UK consumers are
              increasingly looking for healthier snack options that fit into busy, on-the-go lifestyles. Whole Foods
              Market is known for championing quality-led, innovative brands, making it the perfect retail partner to
              introduce Fruitist GoBerry." In Spain, the Snack Cup format grew from 30 stores (April 2025) to 750+
              stores by October 2025, with Carrefour among the retailers stocking it. Globally, Perishable News and
              Fruitist confirmed that the company serves "many leading supermarkets, club stores, and high-end
              independent retailers across Asia, the Middle East, Europe, and the UK." India has land assets (~20
              hectares of blueberries) serving both local stores and export markets, though named Indian retail partners
              have not been publicly disclosed.
            claimRefs:
              - CU004
              - CU006
              - CU007
              - CU008
              - CU039
      - number: '6.5'
        title: Channel Economics, Retention Signals, and Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              Fruitist's channel economics are built around three retail layers: traditional grocery (Publix,
              Albertsons, Giant, Wakefern, ShopRite), mass-market (Walmart, Costco), and premium-natural (Whole Foods,
              Trader Joe's, Sprouts, Erewhon). No formal net revenue retention (NRR), gross revenue retention (GRR),
              churn rate, contract length, or renewal metrics have been publicly disclosed. The company's primary stated
              retention evidence is CEO Magami's claim of "strong repeat purchase behavior" and that Fruitist has
              "surpassed $1 billion in lifetime sales" driven by "consumers trust[ing] the Fruitist brand to deliver a
              consistently premium experience every time." The company's unique incremental growth per SKU claim —
              meaning Fruitist is creating new berry purchases rather than shifting shelf share — is commercially
              compelling but lacks independent verification as of the research date. From a concentration risk
              perspective, there is no public disclosure of the revenue share from any single retailer. Given that
              Costco is widely regarded as the highest-volume channel for premium produce in North America, Costco
              likely represents a disproportionate share of Fruitist volume; however, this cannot be quantified from
              available evidence. The competitive landscape presents expansion headwinds: Driscoll's, the dominant
              branded berry player, already controls approximately $400 million of a roughly $700 million super-premium
              berry segment (per Driscoll's CEO Bjorn's June 2025 Wall Street Journal Global Food Forum address). The
              Packer editorial director noted that "the market is clearly big enough to handle the competition we're
              seeing for the jumbo berry market amongst several small-to-midsize companies," indicating that new
              entrants like Fall Creek Farm & Nursery's Sekoya brand are also competing for the jumbo blueberry shelf
              placement. Renaissance Capital's Matthew Kennedy warned in CNBC's October 2025 coverage that "companies
              often go public when growth trends look most optimistic, so the biggest risk for investors is when that
              growth is unsustainable, either because it was a fad, or because there's a really devoted initial customer
              base that doesn't translate to the broader market." This concern is directly applicable to Fruitist's
              growth trajectory, underscoring the need for diligence on repeat-purchase cohort data and category
              crossover beyond the initial health-forward consumer segment.
            claimRefs:
              - CU027
              - CU028
              - CU029
              - CU030
              - CU032
              - CU033
              - CU040
      - number: '6.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Unmatched Retail Door Count for a Challenger Brand
            body: >-
              Fruitist's 12,500+ North American retail doors encompass the five largest US grocery banners plus Costco
              and Trader Joe's — a distribution breadth that most specialty produce brands take a decade to achieve.
              Multiple independent sources corroborate this figure, indicating retailer relationships are real and
              supply is reliable enough to sustain broad placement.
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
          - type: callout
            title: Price Is the Binding Constraint on Mass Adoption
            body: >-
              Circana's chief advisor explicitly named price as the "biggest limitation to broader consumer adoption" of
              premium snacking produce at the price point Fruitist charges (~$6 per clamshell). An economic downturn or
              prolonged inflation could pressure households to trade down to commodity berries at $3–4, with minimal
              switching cost for the consumer. No diligence on consumer price elasticity or income-sensitivity of repeat
              purchase has been published.
            calloutType: risk
            claimRefs:
              - CU013
              - CU023
              - CU031
          - type: callout
            title: Retail Concentration Unknown but Plausibly High at Costco
            body: >-
              Fruitist does not disclose the revenue contribution of any single retailer. Costco is widely understood to
              account for the single largest volume channel for premium produce in North America. If Costco represents
              more than 30% of Fruitist's North American volume — a threshold consistent with other premium produce
              brands in the early growth phase — a Costco delisting or repricing decision would be a material business
              event.
            calloutType: risk
            claimRefs:
              - CU030
          - type: callout
            title: GLP-1 Tailwind Adds Structural Demand Layer
            body: >-
              GLP-1 weight-loss drugs (Ozempic, Wegovy, Mounjaro) are reshaping snacking: users eat less overall but
              shift toward nutrient-dense, low-glycemic options — exactly the profile Fruitist's jumbo blueberries
              occupy. Both Fruitist's CEO and Driscoll's CEO publicly cited rising berry demand from GLP-1 users, making
              this a validated rather than speculative demand driver. The International Blueberry Organization
              independently noted the GLP-1 trend as accelerating Fruitist's 2026 expansion.
            calloutType: insight
            claimRefs:
              - CU016
              - CU017
          - type: callout
            title: Request Cohort Retention and Top-Retailer Concentration Data in Diligence
            body: >-
              Independent verification of Fruitist's repeat-purchase claim — ideally as a tracked cohort
              (first-purchase-to-third-purchase-30-60-90-day retention) from retailer scanner data — is the single most
              important consumer-demand diligence ask. Likewise, the top-3 retailer revenue concentration ratio should
              be disclosed or estimated via shipment data before any investment decision.
            calloutType: recommendation
            claimRefs:
              - CU030
          - type: callout
            title: Country Count Discrepancy (28 vs 40) Assumed to Reflect Timing
            body: >-
              Fruitist's April 2025 rebrand materials and FruitNet cite 28 countries, while the October 2025 $150M
              funding announcement materials cite 40 countries. This chapter uses the 28–40 range per CANONICAL.md and
              assumes the discrepancy reflects real expansion between April and October 2025 rather than a measurement
              inconsistency.
            calloutType: assumption
            claimRefs:
              - CU004
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Taxonomy and Severity Ranking
        blocks:
          - type: paragraph
            body: >-
              Agrovision / Fruitist presents a compounding risk profile across six primary vectors: trade and tariff,
              climate and weather, food safety and regulatory, labor and governance, competitive, and financial/capital.
              This chapter organises those vectors into a severity-ranked register, assigning likelihood and impact
              ratings grounded in primary source evidence rather than intuition. The overarching assessment is HIGH risk
              for an investor, driven by the combination of permanent tariff headwinds on the import-dependent business
              model, active El Niño conditions in the company's primary producing region, and the opacity inherent in a
              private-company structure carrying $400M of senior secured debt. The risk heatmap (FR001) positions all
              identified risks on a likelihood-impact matrix. Highest combined severity is assigned to climate/El Niño
              risk (high likelihood, critical impact) and US tariff escalation (medium-high likelihood, high-critical
              impact). Lowest severity attaches to individual certification lapse events. The taxonomy is structured so
              that each subsequent section examines one or two vectors in depth with cited evidence, mitigations, and
              kill criteria. The comprehensive regulatory risk register (TR001), operational register (TR002), partner
              register (TR003), people/execution register (TR004), and kill criteria table (TR005) provide the
              operational detail behind each rating. Callouts throughout highlight the three thesis-break triggers that
              warrant the most investor attention.
            claimRefs:
              - CR001
              - CR033
              - CR034
              - CR036
              - CR044
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR005
              - CR006
              - CR012
              - CR014
              - CR019
              - CR022
              - CR028
              - CR030
              - CR032
              - CR036
              - CR044
      - number: '7.2'
        title: Trade, Tariff and Regulatory Risk
        blocks:
          - type: paragraph
            body: >-
              The Trump administration imposed a 10% base tariff on blueberry imports from Peru, Mexico, Chile, and
              Canada effective April 2025. Agrovision's CEO publicly characterised the tariff impact as "minimal,"
              citing the company's diversified global footprint. This characterisation is directly challenged by
              independent industry analysis: the International Blueberry Organization (IBO) concluded that a 10% tariff
              is equivalent to rolling the entire export industry back approximately eight months of demand growth, and
              that the combination of continued supply growth with reduced effective demand could cause a price
              reduction of nearly 20% compared to the prior year. For a company whose premium positioning depends on
              maintaining a ~50% price premium over commodity berries, this compression is material. Evidence of
              real-world impact supports the adverse view: Peru's blueberry exports to the US grew only 5% in 2025/26
              despite an 18% production increase, while exports to Europe grew 35%, reflecting tariff-driven market
              redirection. The tariff is also subject to an ongoing legal challenge in the US Supreme Court, creating
              policy uncertainty. India faces a 26% US reciprocal tariff — relevant because Agrovision has approximately
              50 acres in India, and India's market access for Fruitist products going the other direction faces the
              same rate. In addition to tariff risk, FSMA Produce Safety Rule pre-harvest water compliance became
              mandatory for large farms in April 2025, and the FDA Berry Contamination Prevention Strategy (January
              2025) formally elevates regulatory scrutiny on imported produce. The NABC trade group actively monitors
              tariff changes and engages USTR to manage blueberry import and export impacts. The full regulatory and
              legal risk register is presented in Table TR001 below.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR024
              - CR038
              - CR042
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR022
              - CR024
              - CR026
              - CR038
              - CR042
      - number: '7.3'
        title: Climate, Weather and Operational Risk
        blocks:
          - type: paragraph
            body: >-
              Peru is the world's largest exporter of fresh blueberries, and Agrovision's primary hub with 2,100+
              hectares is located there. The concentration of production in northern coastal Peru — primarily in La
              Libertad and Lambayeque — exposes the company to Coastal El Niño, a recurrent climate pattern that brings
              above-average rainfall, temperature anomalies up to +3°C, and increased disease pressure (Botrytis,
              powdery mildew) to blueberry crops. As of June 2026, Peru's ENFEN commission has extended the Coastal El
              Niño Alert through November 2026, a period that overlaps precisely with the peak blueberry harvest season
              (September–November). The precedent for disruption is severe: El Niño in 2023/24 slashed Peru blueberry
              exports by more than 40%, though prices recovered sharply in that year. The 2026 context is different —
              volume commitments are larger, retailer programs more rigid, and logistics chains more complex — meaning a
              similar shock would have amplified consequences. ProArandanos issued only a 10-week forecast in June 2026
              (rather than the usual full-season projection), explicitly citing the uncertainty from warming
              temperatures. Road connectivity and port logistics disruptions from El Niño events in 2017 and 2024
              delayed shipments and disrupted global supply chains. Beyond Peru, Agrovision's other growing locations
              (Mexico, Morocco, Egypt, India, USA-Oregon, China, Chile-cherries) face their own climate risks: drought
              in Morocco, heat in Egypt, and frost in Oregon. The operational risk register (TR002) provides the
              structured register.
