      - number: '2.7'
        title: Exhibits
        blocks:
          - type: callout
            title: GLP-1 Pharmaceutical Tailwind Favors Fresh Premium Berries
            body: >-
              Cornell University's peer-reviewed study and Circana's retail panel data both confirm that GLP-1 drug
              users measurably increase fresh fruit spending (the only category besides yogurt to gain post-adoption).
              With global GLP-1 users projected to triple to 120 million within five years and drug prices falling to
              ~USD 150/month for oral formulations, the pool of consumers actively shifting toward premium fresh fruit
              snacks like Fruitist blueberries will expand substantially. This is a real, quantified, and growing
              structural demand driver that is largely unique to the fresh produce category.
            calloutType: strength
            claimRefs:
              - CM026
              - CM027
              - CM028
              - CM029
          - type: callout
            title: Peru Commodity Oversupply Creates Structural Price Pressure Risk
            body: >-
              Peru's blueberry export volume grew at ~30% annually from 2016, while US consumption grew at less than
              10%. In the 2025 season, Peruvian blueberry prices fell 38-41% in peak months. If this dynamic persists,
              the commodity-tier price floor could fall toward a level that makes the premium spread harder to maintain.
              Fruitist's brand equity, genetics program, and RipeLocker shelf-life technology are its primary defenses,
              but a sustained commodity price collapse could attract the 'trade-down' consumer behavior that endangers
              category premiumization broadly.
            calloutType: risk
            claimRefs:
              - CM034
              - CM035
              - CM036
              - CM037
          - type: callout
            title: 'Year-Round Supply Moat: Counter-Seasonal Peru Is a Durable Structural Advantage'
            body: >-
              By early 2026, ~99% of US fresh blueberry shipment volume during January through mid-March came from
              imports. Fruitist's vertical integration — 2,100+ ha Peru production peaking Sep-Feb, Mexico spring
              season, Oregon summer, Morocco/Egypt spring window — collectively enables the only national-scale
              year-round branded premium blueberry programme currently in the US market. This 52-week availability is
              structurally difficult to replicate by non-vertically-integrated competitors and creates meaningful
              retailer stickiness.
            calloutType: insight
            claimRefs:
              - CM020
              - CM022
              - CM039
              - CM045
              - CM049
          - type: callout
            title: 'Priority Diligence: Independently Validate the 22% Premium Berry CAGR'
            body: >-
              Fruitist's core market sizing narrative depends on the premium berry category having grown at 22% CAGR
              (2019-2024) — but this figure is company-stated and not independently corroborated by any external
              analyst, retail panel, or trade association data reviewed in this chapter. US retail berry dollar sales of
              USD 12.5B (Circana, FY2025) show strong category growth but do not segment by premium versus commodity.
              Diligence should prioritize commissioning a targeted Circana/IRI scan of premium-positioned berry SKUs
              (price >$X/lb threshold) to independently validate CAGR and confirm the premium tier's share and
              trajectory before accepting the investment thesis at face value.
            calloutType: recommendation
            claimRefs:
              - CM009
              - CM012
              - CM053
          - type: callout
            title: 'Assumption: Premium Price Spread Is Durable Against Commodity Price Deflation'
            body: >-
              The chapter's market framing assumes Fruitist's ~50% price premium versus commodity berries is
              sustainable. This is supported by brand investment, superior genetics, and consistent quality — but it is
              an assumption, not a verified durable moat. In analogous produce categories (organic produce, premium
              avocado), premiums have been compressed as the premium tier grew from niche to mainstream and as
              supply-side quality improvement eliminated quality differentiation. Active monitoring of
              commodity-to-premium price spreads over time is a key risk indicator.
