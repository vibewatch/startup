    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters and Business Model
        blocks:
          - type: paragraph
            body: >-
              Fruitist is the operating brand and parent entity of Fruitist Holdings Inc., the legal successor name
              adopted on April 22, 2025, replacing Agrovision Corp., the corporate name used since the company was
              founded in 2012. Headquartered in Century City, Los Angeles, California, Fruitist is a vertically
              integrated producer, marketer, and distributor of premium fresh berries — principally jumbo blueberries,
              raspberries, blackberries, and cherries — targeting the high-growth healthy snacking segment. The company
              markets under two consumer brands: Fruitist (global) and Big Skye (China). The Fruitist consumer brand was
              first launched in 2020, though the company operated under the Agrovision corporate identity for the
              preceding eight years. The business model is built on full vertical integration: Fruitist owns and
              operates its own farms across optimal global microclimates, breeds proprietary non-GMO fruit varieties,
              manages all logistics and cold chain, and sells directly to major retailers, eliminating the fragmented
              middleman chain that characterizes traditional produce supply. The company frames this model as solving
              "berry roulette" — the widespread consumer frustration with inconsistent berry quality under conventional
              fragmented-supply models. Its flagship product, the jumbo blueberry, retails at approximately a 50%
              premium to commodity alternatives and has demonstrated strong repeat purchase behavior. The premium berry
              category delivered a 22% compound annual growth rate between 2019 and 2024 per company data, validating
              the snacking thesis. As of the October 2025 funding announcement, Fruitist operates farms in ten global
              microclimates spanning Peru (2,100+ hectares), Mexico (~460 ha), Morocco (~160 ha), Egypt (~60 ha),
              USA-Oregon (~230 ha), China (~25 ha), India (~20 ha), Chile (~120 ha), and nursery land in Romania,
              Thailand, and Indonesia. The company is a private unicorn stage entity, never having filed publicly.
