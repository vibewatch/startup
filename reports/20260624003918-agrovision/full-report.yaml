      - number: '5.7'
        title: Exhibits
        blocks:
          - type: callout
            title: RipeLocker Partnership Triples Shelf Life and Unlocks Ocean Freight
            body: >-
              The June 2024 RipeLocker partnership gives Fruitist a postharvest technology advantage that fragmented
              grower-packer competitors cannot replicate without a comparable scale agreement. Extending shelf life to
              8–12 weeks enables ocean freight to China, India and Europe at ~$0.50/kg versus ~$3–4/kg for air,
              materially reducing logistics cost on the most lucrative distant-market routes. It also enables
              commercialisation of delicate high-flavor varieties previously ruled out by short postharvest windows.
            calloutType: strength
            claimRefs:
              - CE017
              - CE018
              - CE019
              - CE023
              - CE024
          - type: callout
            title: RipeLocker Sole-Vendor Dependency and RipeReefer Prototype Risk
            body: >-
              Fruitist has no publicly disclosed alternative postharvest technology partner. RipeLocker remains a
              startup (angel-funded to date) and the container-scale RipeReefer needed to halve per-kg freight costs was
              in a 20-foot prototype phase as of early 2026, with commercial trials targeting late 2026 or early 2027.
              Any delay in the RipeReefer rollout, or disruption to the RipeLocker partnership, would revert Fruitist to
              conventional cold-chain economics and eliminate the ocean-freight margin advantage.
            calloutType: risk
            claimRefs:
              - CE017
              - CE025
          - type: callout
            title: Peru Hub Concentration and El Niño Climate Exposure
            body: >-
              Peru's Olmos/Lambayeque hub provides 2,100+ hectares and approximately 50% of Fruitist's US export volume.
              Peru's Coastal El Niño alert was extended through November 2026, with above-average rainfall and
              temperatures up to +3°C above normal projected for the northern coast — the precise region of Fruitist's
              main operations. Previous El Niño events in 2017 and 2023–2024 disrupted road connectivity and delayed
              export shipments. With larger volumes and more complex retail programmes, any El Niño disruption now
              carries greater revenue and retailer relationship impact.
            calloutType: risk
            claimRefs:
              - CE033
              - CE037
          - type: callout
            title: Request CTO Technology Roadmap and RipeLocker Deployment Data
            body: >-
              Two high-priority diligence actions should be completed before any investment decision: (1) request from
              newly appointed CTO Jim Trahanas the specific AI platform architecture, vendor relationships and 2026–2028
              technology roadmap; and (2) obtain quantified data on the proportion of Fruitist's supply chain currently
              operating with RipeLocker drum chambers versus conventional cold chain, and a confirmed commercial launch
              timeline for the RipeReefer container. These two data points are critical to validating the technology
              moat and the ocean-freight logistics margin improvement.
            calloutType: recommendation
            claimRefs:
              - CE025
              - CE030
          - type: callout
            title: Snack Cups Signals Evolution from Produce to CPG Brand
            body: >-
              The Snack Cups launch and the Good Housekeeping 2026 Snack Award win signal that Fruitist is executing a
              strategic pivot from premium produce supplier to CPG snacking brand. This is consistent with the new
              seasoned CPG leadership team (from Nestlé, McKinsey, The Wonderful Company) and the Caleb Williams NFL
              partnership. If successful, the CPG positioning opens a much higher valuation multiple category, but also
              introduces brand management complexity and execution risk not present in pure produce supply.
            calloutType: insight
            claimRefs:
              - CE004
              - CE005
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: North American Retail Distribution Network
        blocks:
          - type: paragraph
            body: >-
              Fruitist's most important commercial proof point is its breadth of premium retail placement across North
              America. As of 2025–2026, the company's products are stocked in more than 12,500 retail locations across
              the continent, a number confirmed by the company, by CNBC, by the Produce Market Guide, and by Blue Book
              Services coverage of the October 2025 funding announcement. This figure covers the full suite of format
              types — hypermarkets such as Costco and Walmart, premium natural-grocery banners such as Whole Foods
              Market and Sprouts, conventional supermarket chains including Publix, Giant, Wakefern, ShopRite, and
              Albertsons, as well as specialty independents and Trader Joe's. The breadth of retailer coverage is
              strategically significant because it demonstrates Fruitist's ability to operate across distinct value
              tiers simultaneously: Costco shoppers skew toward club-size value while Whole Foods and Sprouts shoppers
              index higher on premium-health willingness to pay. LA Business Journal confirmed that retailers
              "immediately saw the value" of Fruitist's jumbo blueberries once the product reached shelves, and that the
              company competes on quality differentiation rather than price parity. The Packer trade publication survey
              cited in the same article found that 43–53% of shoppers (varying by age cohort) had purchased jumbo
              blueberries in the preceding 12 months, suggesting the category has reached mainstream awareness.
              Co-founder and CEO Steve Magami stated that Fruitist is "driving foot traffic" and that retailers are
              "making more money per square inch of the shelf" with Fruitist present — an uncommonly strong claim that,
              if substantiated in retailer conversations, implies the brand functions as a category growth driver rather
              than a mere substitution SKU. Inventory turns for fresh produce are exceptionally rapid — Driscoll's CEO
              noted that berries turn roughly 300 times a year with no standing inventory — which further underscores
              why consistent supply quality commands premium shelf placement. Snack Cups (single-serve fresh blueberry
              packs) launched initially in Spain in April 2025 with 30 stores, scaled to 750+ stores by October 2025,
              and are projected to top 1,000 Spanish stores; the format is also being introduced to US retail partners.
              Albertsons, confirmed in the LA Business Journal article alongside Costco, Trader Joe's, Walmart, and
              Whole Foods, extends Fruitist's reach into the conventional supermarket segment, giving it coverage of the
              largest US grocery banners by store count.
            claimRefs:
