  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Scope, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market for Fruitist (parent: Agrovision) is the global premium fresh berry category —
              vertically integrated, year-round supply of branded, differentiated berries sold at retail and,
              secondarily, through foodservice and export channels. The product boundary includes fresh blueberries
              (jumbo/large-caliber branded), fresh raspberries, fresh blackberries, and fresh cherries (added via
              ZurGroup). Excluded from the core boundary are frozen berries (a structurally separate supply chain and
              buyer), dried/processed berry ingredients, berry-based beverages and nutraceuticals, and commodity bulk
              berry packs sold without branding premiums. These adjacencies serve different buyer workflows and margin
              structures and are not currently part of Fruitist's go-to-market strategy.

              The status-quo substitute for Fruitist's premium position is the commodity berry programme: generic
              blueberries from Peru, Mexico, or Chile sourced by retailers as private-label or unbranded bulk, typically
              priced at a significant discount to Fruitist's approximately 50% price premium versus commodity. A second
              substitute is the broader snack category — chips, crackers, confectionery, and protein bars — which
              compete for the same snacking occasion and shelf budget. A third substitute is fresh-cut fruit and
              vegetable snack packs from competing produce brands.

              Adjacent markets with potential whitespace include: (1) Organic berry packs, where organic blueberries
              already represent 15% of US imports and growing; (2) value-added snack formats such as Fruitist's recently
              launched Snack Cups; (3) functional ingredients (freeze-dried, concentrated blueberry powders) used in
              nutraceuticals and food manufacturing; (4) international premium retail corridors in China, UK, Europe,
              and the Middle East. The total global snacking market is cited by Fruitist at ~USD 600B, but this is a
              highly heterogeneous addressable space; for diligence purposes, the relevant upper-bound TAM is the global
              fresh berry market.
