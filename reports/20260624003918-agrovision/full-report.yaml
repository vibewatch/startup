              - CR018
          - type: callout
            title: 'Thesis-Break Signal #3: Food Safety Recall Linked to Fruitist Brand'
            body: >-
              A Class I FDA recall linking Fruitist-branded products to Listeria, hepatitis A, or norovirus
              contamination would trigger immediate de-listing at major retailers and inflict lasting brand damage. The
              recent 2026 blueberry recall (unrelated brand) and the 2022–2023 strawberry hepatitis A outbreaks from
              imported Latin American berries demonstrate the category-level exposure Agrovision cannot fully insulate
              itself from.
            calloutType: risk
