      - number: '6.2'
        title: Consumer Demand, Premium Pricing, and Snacking Behavior
        blocks:
          - type: paragraph
            body: >-
              Fruitist's customer thesis rests on solving "berry roulette" — the frustrating consumer experience of
              purchasing a clamshell of berries only to find mushy or flavourless fruit due to fragmented supply chains.
              By owning the entire value chain from breeding through cold-chain delivery, Fruitist consistently delivers
              jumbo blueberries that the company describes as having "a snappy pop," firm texture, and high sugar
              content with a reliable eating experience every purchase. This consistency premium is captured in the ~50%
              price premium Fruitist commands over commodity blueberries — approximately $6 per clamshell versus
              approximately $4 for conventional alternatives. Named consumer Scott Hanson of Inglewood, quoted in the LA
              Business Journal, said of his Trader Joe's discovery: "My kids are insane about eating fruit. One day at
              Trader Joe's, I saw the Fruitist super-big blueberries at the end of an aisle and decided to try them. The
              blueberries were a big hit with my kids." Hanson added: "To be honest, I didn't even notice the price
              premium. I just figured with inflation, everything is more expensive anyway." This testimonial illustrates
              the premium-pricing acceptance dynamic among the target consumer segment. The GLP-1 tailwind is a
              structural demand accelerator: Fruitist's internal data shows that consumers using GLP-1 treatments
              (Ozempic, Wegovy, Mounjaro) increase berry purchases after starting the medication, as these drugs shift
              eating behaviour toward lower-glycemic, nutrient-dense, high-fibre snacks. Driscoll's CEO Soren Bjorn
              corroborated this at the Wall Street Journal Global Food Forum, describing a demand curve for berries that
              "went up at a river curve" after GLP-1 drug introduction. The Perishable News cited a 20% increase in
              fresh produce purchases by GLP-1 prescription users broadly. Tastewise data (2026) shows snacks hold 2.2%
              social share with +26.9% YoY growth; the top consumer drivers are portioned/mini (27%), tasty (24%),
              healthy (17%), and convenient (15%) — a profile Fruitist's Jumbo berry and Snack Cups format addresses
              with unusual precision. The premium berry category CAGR of 22% between 2019 and 2024 (per Fruitist)
              confirms that this is a structurally growing segment rather than a short-cycle fad, though Circana's chief
              advisor cautioned in October 2025 that "the biggest limitation to broader consumer adoption is price,"
              noting that the approximately $6 per clamshell price point restricts penetration into value-oriented
              households.
