      - number: '1.2'
        title: Founders, Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              Fruitist was co-founded by Steve Magami and Thomas Snyder, both carrying private-equity backgrounds. Steve
              Magami, co-founder, CEO, and Executive Chairman of the Board, conceived the concept while scouting biofuel
              feedstocks in northern coastal Peru and recognizing the region's exceptional berry-growing conditions. He
              subsequently recruited Thomas Snyder, a former PE colleague, to co-found the business in 2012. Magami has
              been the public face, brand narrator, and strategic driver of the company throughout its decade of growth,
              representing a significant key-person dependency: investor confidence, retailer relationships, the brand
              narrative, and the global expansion strategy are closely tied to his leadership. The company expanded its
              senior leadership bench materially in 2025 with four high-profile appointments designed to support capital
              markets readiness and technology scale. In September 2025, Rich Sullivan was named Chief Financial
              Officer, bringing over 25 years of finance experience from high-growth companies including DreamWorks,
              Twitter, STX Entertainment, and SurveyMonkey. Jim Trahanas joined as Fruitist's first Chief Technology
              Officer, strengthening AI and technology capabilities across the supply chain. Thomas Seifert joined the
              Board of Directors as Audit Committee Chair, bringing IPO and governance experience from serving as CFO of
              Cloudflare (which he guided through its IPO to a $74 billion market cap) and senior roles at AMD and
              Symantec. June Yang joined as Independent Director, contributing AI and technology leadership from her
              tenure running Google Cloud's AI and Industry Solutions, with simultaneous board service at MSCI Inc.,
              NetApp, UiPath, and AHEAD. Aliment Capital's Ben Belldegrun took a board seat following the August 2024
              equity round. The combination of seasoned CPG commercial talent (cited backgrounds from Nestlé, McKinsey,
              and The Wonderful Company) with new finance, technology, and governance leadership signals a company
              actively positioning for a potential public offering and long-term institutional ownership.
