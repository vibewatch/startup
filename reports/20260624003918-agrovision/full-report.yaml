      - number: '5.5'
        title: Global Farm Footprint as Operations and Technology Asset
        blocks:
          - type: paragraph
            body: >-
              Fruitist's global farm network is itself a technology and operations asset, engineered to provide
              counter-seasonal supply 52 weeks per year by exploiting complementary climate windows across nine
              countries. The Peruvian hub in Olmos, Lambayeque dominates at 2,100+ hectares and shipped approximately 32
              million kilograms of blueberries in the 2025/2026 season. Operations director Juan José Gal'Lino projected
              30% volume growth for the following season, driven by newer, higher-value varieties. Mexico (~460 ha)
              provides a spring shoulder window for blueberries, raspberries and blackberries. Morocco (~160 ha) and
              Egypt (~60 ha) serve European and Middle Eastern winter and early spring windows. The Oregon operation
              (~230 ha near Salem) covers the domestic US summer season and underpins the company's "imports complement
              domestic supply" tariff narrative. Chile (~120 ha) is the newly acquired cherry anchor via ZurGroup.
              Smaller operations in India (~20 ha) and China (~25 ha, Yunnan) support local market supply and brand
              development. Romania (~150 ha) is under development as a blueberry nursery, with additional expansion
              underway in Thailand, Indonesia and the Philippines. FMO (Dutch Development Bank) confirmed GlobalGAP,
              SMETA and FSMA certification for the Peruvian operations when providing subordinated financing for
              Agrovision Peru's earlier expansion. Agrovision Peru was named to the Great Place to Work Peru 2026 list
              in the agroindustrial sector. The farm footprint roadmap table summarises each geography by status and
              strategic rationale. The critical dependency diagram shows how the Peru hub, genetics partners and
              RipeLocker interlock.
