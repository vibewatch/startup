      - number: '2.4'
        title: 'Demand Drivers: Healthy Snacking Tailwind and GLP-1 Impact'
        blocks:
          - type: paragraph
            body: >-
              The structural demand environment for premium fresh berries is supported by two reinforcing megatrends:
              the secular shift toward healthy snacking, and the emerging GLP-1 pharmaceutical tailwind that is
              measurably redirecting consumer food purchasing toward fresh produce.

              The global healthy snacks market is estimated at USD 117.9B in 2026 by both Mordor Intelligence and
              Dimension Market Research, growing at 6.5-6.8% CAGR through 2031-2035. The US healthy snacks market alone
              is projected at USD 39.5B in 2026. Fruit, nuts, and seeds snacks hold the largest share within the healthy
              snacks category (33.71% in 2025 per Mordor), with organic and free-from products growing fastest at 8.11%
              CAGR. This provides the macro backdrop for Fruitist's positioning: fresh, premium, naturally healthy
              berries competing directly for the same consumer snacking occasion as packaged healthy snack brands.

              The GLP-1 drug tailwind adds a more recent and powerful vector. As of mid-2024, over 16% of US households
              had at least one GLP-1 user, with Roland Berger projecting global users to triple from ~40 million to ~120
              million within five years as prices fall and oral formulations gain approval. The key finding for the
              berry category: GLP-1 users do not reduce all food categories uniformly. A Cornell University / Numerator
              peer-reviewed study (2025) found that households with at least one GLP-1 user cut total grocery spending
              by 5.3% within six months, with the largest declines in savory snacks (-10%), sweet bakery (-9%), and soft
              drinks (-7%); however, fresh fruit spending increased — along with yogurt, nutrition bars, and meat
              snacks. Circana's analysis found that before starting GLP-1 therapy, people seeking to lower their BMI
              were only 3% more likely to buy produce than average; by end of year one on treatment, the figure rose to
              nearly 5%. UC Davis food research cites data that GLP-1 users consume 55% more fruits and vegetables
              compared to pre-treatment baselines.

              These dynamics collectively support sustained demand growth for premium, convenient, snackable berry
              formats — the exact segment Fruitist occupies with its jumbo blueberries and Snack Cups. The premium berry
              category grew at a 22% CAGR between 2019 and 2024 by Fruitist's own account, compared to the overall fresh
              berry market growth of approximately 4-5%, suggesting that market-share gains within a growing category
              underpin the investment thesis. Per-capita US blueberry consumption has grown nearly tenfold over two
              decades — from 0.26 lbs in 2000 to 2.54 lbs in 2021 — with continued growth expected.
            claimRefs:
