      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Vertical Integration as Multiple Justifier
            body: >-
              Fruitist's fully owned, tech-enabled supply chain from farm to retail shelf is the primary argument for a
              premium multiple. No other public berry specialist operates at comparable integration depth across eight
              countries. J.P. Morgan's diligence team cited this explicitly as the reason for its $150 million
              commitment, providing institutional validation.
            calloutType: strength
            claimRefs:
              - CV023
              - CV024
              - CV020
          - type: callout
            title: Private Financials Create Valuation Opacity
            body: >-
              Fruitist has released no EBITDA, gross margin, or net income data. The entire $1B+ valuation rests on
              revenue multiples applied by private round investors. At IPO, first public disclosure of margins below
              market expectations could trigger immediate multiple compression toward the commodity peer range of
              0.25–0.5x EV/Revenue.
            calloutType: risk
            claimRefs:
              - CV031
              - CV032
              - CV019
          - type: callout
            title: Track; Initiating Investment Requires Price and Margin Confirmation
            body: >-
              Do not initiate investment at the current mark without EBITDA disclosure and a verified EV/Revenue at or
              below 2x on forward revenue. Monitor IPO filing (if submitted) for S-1 financials as the primary trigger.
              Maintain watch on Once Upon a Farm's IPO as the closest comparable fresh-food public market debut.
            calloutType: recommendation
            claimRefs:
              - CV033
              - CV038
              - CV005
          - type: callout
            title: Framing Battle — Berry Grower vs. Snacking Platform
            body: >-
              The $1B+ valuation is only defensible if investors accept Magami's framing of Fruitist as a snacking
              platform competing in an $800B total addressable market rather than a berry farm. If post-IPO sell-side
              analysts benchmark Fruitist against Dole and Fresh Del Monte rather than premium consumer brands, the
              multiple will collapse regardless of revenue growth.
            calloutType: insight
            claimRefs:
              - CV025
              - CV010
              - CV012
          - type: callout
            title: Premium CAGR Sustained Through IPO Filing Window
            body: >-
              The base scenario assumes the 22 percent premium berry category CAGR continues through the IPO filing
              period. If tariff escalation on Peru or Morocco imports lifts consumer retail prices above the 50 percent
              premium threshold and volume decelerates, the valuation case degrades toward the bear scenario without any
              operating failure at the company level.
