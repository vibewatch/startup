      - number: '3.4'
        title: The Premium Genetics Race
        blocks:
          - type: paragraph
            body: >-
              The competitive battleground in premium blueberries is increasingly fought at the genetics level.
              Proprietary variety development — delivering consistent jumbo size, superior sweetness, extended shelf
              life, and firmness — has become the decisive differentiator between commodity supply and premium brand
              positioning. Three distinct genetics programs are actively competing in the same market window as
              Fruitist: Fall Creek/Sekoya, Naturipe's Berry Blue program, and Driscoll's internal breeding operation.

              Fall Creek Farm & Nursery is the world's leading blueberry genetics company, operating a commercial plant
              preview program for growers across all major growing regions. Its Sekoya brand — a B2B platform offering
              premium jumbo blueberries year-round — introduced Sekoya Nova FC15-173 at Fruit Logistica 2026 in Berlin
              in February 2026. In internal trials, Sekoya Nova showed approximately 80% of fruit exceeding 18mm
              diameter (versus 20-50% in comparable high-chill varieties) and shelf life exceeding 60 days (versus ~45
              days for newer high-chill releases). Critically, Sekoya genetics are already widespread among Peruvian
              growers: Sekoya Pop accounted for 58,710 tonnes (approximately 15.3% by volume) of Peru's record 2025-26
              blueberry exports of 382,934 tonnes. This means growers using Fall Creek genetics compete directly against
              Fruitist's vertically integrated Agrovision Peru platform in the same US and European retail channels.

              Naturipe's Berry Blue breeding program, operating for 25+ years, focuses on premium blueberry genetics at
              trial sites in Georgia and Michigan. Its proprietary offerings — Mighty Blues (jumbo), Envoy (Sweet
              Selections), Keepsake, Charisma, and Color Rush (pink blueberries) — represent a diversified genetics
              portfolio targeting multiple consumer occasion segments simultaneously. Driscoll's invests in exclusive
              non-GMO breeding for all four berry types (strawberry, blueberry, raspberry, blackberry), licensing those
              varieties exclusively to its grower network. The top five varieties in Peru — Ventura, Sekoya Pop, Biloxi,
              Mágica, and Rocío — together accounted for 67.52% of the country's total blueberry exports in 2025-26,
              confirming that premium genetics concentration has reached industrial scale at origin. Fruitist must
              continue investing in its own genetics program to maintain the quality gap that justifies its ~50%
              consumer price premium over commodity.
