            Consumer pays ~$6 clamshell vs ~$4 commodity; ~50% premium absorbed at trial. Named consumer testimonial:
            'didn't even notice the price premium.' Size and firmness signal quality.
          tone: positive
        - label: Consumption & Quality Verification
          detail: >-
            Snappy pop, firm texture, consistent sweetness confirms brand promise. RipeLocker vacuum chambers extend
            shelf life 3×, reducing household spoilage. Consumer validates that 'berry roulette' is solved.
          tone: positive
        - label: Repeat Purchase
          detail: >-
            Strong repeat purchase behavior cited by CEO; 'consumers trust the Fruitist brand.' GLP-1 users increase
            purchases over time. Retailer scanner data shows measurable lift from Fruitist presence.
          tone: positive
        - label: Brand Community & Advocacy
          detail: >-
            Exposure via D.C. United, Caleb Williams, USC Athletics reinforces healthy-snacking identity. Social media
            engagement and sports partnerships drive word-of-mouth. Snack Cups format extends consumption occasions
            beyond home.
          tone: positive
        - label: Category Expansion Loop
          detail: >-
            Consumer adds blackberries, raspberries, cherries to basket as Fruitist expands SKUs. Year-round
            availability via multi-geography supply chain sustains habit. International consumers enter via Whole Foods
            UK or Carrefour Spain.
