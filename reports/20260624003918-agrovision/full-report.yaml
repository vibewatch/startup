      - number: '8.4'
        title: Bull, Base and Bear Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              The three-scenario framework for Fruitist's enterprise value at a prospective IPO or next secondary mark
              is driven by three interlocking levers: (1) revenue trajectory, (2) the multiple the market awards based
              on brand premium and growth, and (3) profitability disclosure that either corroborates or undercuts the
              premium narrative.

              In the bull scenario, Fruitist demonstrates forward revenue approaching $500 million within twelve months
              of filing (implied 25 percent-plus year-on-year growth), discloses gross margins above 25 percent
              (consistent with a branded model rather than a commodity grower), and successfully positions itself in the
              $600 to $800 billion global snacking addressable market as articulated by CEO Magami. Under this scenario
              the market applies a 3.5x to 4.5x EV/Revenue multiple at IPO, consistent with premium food platforms.
              Implied enterprise value: $1.5 billion to $2.5 billion.

              In the base scenario, revenue is approximately $400 to $450 million at the time of filing, the market
              accepts Fruitist as a premium produce brand at a 2x to 2.5x EV/Revenue multiple — above Hortifrut (1.3x)
              but below specialty food platforms — and EBITDA margins are disclosed in the low-to-mid teens percentage.
              Implied enterprise value: $800 million to $1.1 billion, broadly confirming the current $1B+ mark. This
              base case requires the 22 percent premium berry category CAGR to continue through the IPO filing period.

              In the bear scenario, the market re-rates Fruitist toward the public produce-company multiple range as
              earnings pressure, tariff exposure or slowing growth becomes apparent. At a 0.4x to 0.6x EV/Revenue
              (consistent with Dole and Fresh Del Monte), on $350 to $400 million revenue, the implied enterprise value
              is $140 million to $240 million — a catastrophic markdown from the current mark. This scenario is
              plausible if IPO is delayed beyond 2027, growth decelerates below 15 percent, or a crop incident damages
              brand trust. The structural lesson from Vital Farms — which compressed from 2x to 0.59x EV/Revenue in
              eighteen months despite its premium brand — is a live adverse data point.
            claimRefs:
