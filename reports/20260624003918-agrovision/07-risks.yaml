company:
  name: Agrovision
chapter:
  number: 7
  title: Risks
  summary: >-
    Agrovision / Fruitist carries a multi-vector risk profile dominated by three compounding
    threats: US import tariffs (10% on Peru/Mexico/Morocco origins, 26% on India) that directly
    challenge the company's stated "minimal impact" characterisation; a Coastal El Niño alert
    active through November 2026 threatening the Peru hub that provides the majority of premium
    berry volume; and endemic food-safety recall exposure after the FDA launched a 2025 berry
    contamination prevention strategy following recurring hepatitis A and Listeria incidents.
    These headwinds compound a $400M+ senior secured debt-service obligation on a private
    company with limited transparency, key-person dependence on founder-CEO Steve Magami,
    and a single-crop/single-hub concentration that leaves the thesis exposed to any
    sector-wide shock. Risk rating is high across three of six vectors identified.

sections:
  - id: risk-taxonomy-and-severity
    title: Risk Taxonomy and Severity Ranking
    body: >-
      Agrovision / Fruitist presents a compounding risk profile across six primary vectors:
      trade and tariff, climate and weather, food safety and regulatory, labor and governance,
      competitive, and financial/capital. This chapter organises those vectors into a severity-ranked
      register, assigning likelihood and impact ratings grounded in primary source evidence rather
      than intuition. The overarching assessment is HIGH risk for an investor, driven by the
      combination of permanent tariff headwinds on the import-dependent business model, active
      El Niño conditions in the company's primary producing region, and the opacity inherent in a
      private-company structure carrying $400M of senior secured debt. The risk heatmap (FR001)
      positions all identified risks on a likelihood-impact matrix. Highest combined severity is
      assigned to climate/El Niño risk (high likelihood, critical impact) and US tariff escalation
      (medium-high likelihood, high-critical impact). Lowest severity attaches to individual
      certification lapse events. The taxonomy is structured so that each subsequent section
      examines one or two vectors in depth with cited evidence, mitigations, and kill criteria.
      The comprehensive regulatory risk register (TR001), operational register (TR002), partner
      register (TR003), people/execution register (TR004), and kill criteria table (TR005) provide
      the operational detail behind each rating. Callouts throughout highlight the three
      thesis-break triggers that warrant the most investor attention.
    claimRefs: [CR001, CR033, CR034, CR036, CR044]
    tableRefs: []
    figureRefs: [FR001]

  - id: trade-tariff-regulatory-risk
    title: 'Trade, Tariff and Regulatory Risk'
    body: >-
      The Trump administration imposed a 10% base tariff on blueberry imports from Peru, Mexico,
      Chile, and Canada effective April 2025. Agrovision's CEO publicly characterised the tariff
      impact as "minimal," citing the company's diversified global footprint. This characterisation
      is directly challenged by independent industry analysis: the International Blueberry
      Organization (IBO) concluded that a 10% tariff is equivalent to rolling the entire export
      industry back approximately eight months of demand growth, and that the combination of
      continued supply growth with reduced effective demand could cause a price reduction of
      nearly 20% compared to the prior year. For a company whose premium positioning depends
      on maintaining a ~50% price premium over commodity berries, this compression is
      material. Evidence of real-world impact supports the adverse view: Peru's blueberry
      exports to the US grew only 5% in 2025/26 despite an 18% production increase, while
      exports to Europe grew 35%, reflecting tariff-driven market redirection. The tariff
      is also subject to an ongoing legal challenge in the US Supreme Court, creating policy
      uncertainty. India faces a 26% US reciprocal tariff — relevant because Agrovision
      has approximately 50 acres in India, and India's market access for Fruitist products
      going the other direction faces the same rate. In addition to tariff risk, FSMA Produce
      Safety Rule pre-harvest water compliance became mandatory for large farms in April 2025,
      and the FDA Berry Contamination Prevention Strategy (January 2025) formally elevates
      regulatory scrutiny on imported produce. The NABC trade group actively monitors tariff
      changes and engages USTR to manage blueberry import and export impacts. The full regulatory
      and legal risk register is presented in Table TR001 below.
    claimRefs: [CR004, CR005, CR006, CR007, CR008, CR009, CR010, CR024, CR038, CR042]
    tableRefs: [TR001]
    figureRefs: []

  - id: climate-weather-operational-risk
    title: 'Climate, Weather and Operational Risk'
    body: >-
      Peru is the world's largest exporter of fresh blueberries, and Agrovision's primary hub
      with 2,100+ hectares is located there. The concentration of production in northern coastal
      Peru — primarily in La Libertad and Lambayeque — exposes the company to Coastal El Niño,
      a recurrent climate pattern that brings above-average rainfall, temperature anomalies up
      to +3°C, and increased disease pressure (Botrytis, powdery mildew) to blueberry crops.
      As of June 2026, Peru's ENFEN commission has extended the Coastal El Niño Alert through
      November 2026, a period that overlaps precisely with the peak blueberry harvest season
      (September–November). The precedent for disruption is severe: El Niño in 2023/24 slashed
      Peru blueberry exports by more than 40%, though prices recovered sharply in that year.
      The 2026 context is different — volume commitments are larger, retailer programs more
      rigid, and logistics chains more complex — meaning a similar shock would have amplified
      consequences. ProArandanos issued only a 10-week forecast in June 2026 (rather than the
      usual full-season projection), explicitly citing the uncertainty from warming temperatures.
      Road connectivity and port logistics disruptions from El Niño events in 2017 and 2024
      delayed shipments and disrupted global supply chains. Beyond Peru, Agrovision's other
      growing locations (Mexico, Morocco, Egypt, India, USA-Oregon, China, Chile-cherries) face
      their own climate risks: drought in Morocco, heat in Egypt, and frost in Oregon. The
      operational risk register (TR002) provides the structured register.
    claimRefs: [CR012, CR013, CR014, CR015, CR016, CR017, CR018, CR031, CR040, CR045]
    tableRefs: [TR002]
    figureRefs: []

  - id: food-safety-recall-risk
    title: Food Safety and Recall Risk
    body: >-
      Fresh and frozen berries are one of the highest-priority food safety vectors for the
      US FDA. In January 2025, the FDA published a new commodity-specific prevention strategy
      targeting enteric virus (hepatitis A, norovirus) contamination of fresh and frozen berries,
      the first such targeted strategy for this category. The strategy was motivated by a history
      of outbreaks specifically linked to imported berries: the FDA investigated a multistate
      hepatitis A outbreak in May 2022 linked to imported organic strawberries from Mexico (18
      cases); the CDC investigated a linked frozen strawberry outbreak in 2023 (10 cases, 40%
      hospitalised). More recently, in February 2026, the FDA issued a Class I recall — its
      most serious classification — for 55,689 lbs of frozen blueberries from Oregon Potato
      Company/Willamette Valley Fruit Company due to Listeria monocytogenes contamination.
      These incidents collectively demonstrate that the berry supply chain carries endemic recall
      risk. A recall linked to Fruitist or Agrovision-branded products would immediately threaten
      relationships with Costco, Walmart, Whole Foods, and other premium retail accounts.
      The FSMA Produce Safety Rule requires pre-harvest agricultural water compliance from
      large farms as of April 2025, and the FDA sampled 1,558 frozen berry lots (FY2019–2023),
      detecting HAV or norovirus in a small fraction but flagging non-compliant firms with
      180-day import alerts or full Import Alert 99-35 placements. Agrovision's specific food
      safety certification status — GlobalGAP, Fair Trade, SCS audits — is not disclosed
      publicly, constituting a diligence gap. The company's hand-harvested model with up to
      15,000 field workers in Peru creates hygienic surface-area risk that parallels the
      conditions that generated prior outbreaks.
    claimRefs: [CR019, CR020, CR021, CR022, CR023, CR024, CR025, CR027]
    tableRefs: []
    figureRefs: []

  - id: labor-governance-concentration-risk
    title: 'Labor, Governance and Concentration Risk'
    body: >-
      Agrovision employs up to 15,000 field workers in Peru, approximately 60% of whom are
      women — a workforce statistic the company highlights for its social impact credentials.
      However, Peru's agricultural labor history introduces material risk: in December 2020,
      Peru's Congress repealed the Agrarian Promotion Law (Law 27360) following widespread
      protests by agricultural workers — including blueberry harvesters — who blocked highways
      demanding better wages and working conditions. The revised labor framework introduced
      higher minimum wages and stronger protections, but independent audits of Agrovision's
      specific labor compliance and working conditions are not publicly available, creating
      an ESG diligence gap. Wage inflation in Peru's agricultural sector and stricter
      enforcement of labor standards could materially increase Agrovision's operating costs.
      On governance, the company is founder-led by Steve Magami, who co-founded the business
      in 2012 and remains Chairman and CEO. As a private company, board composition, committee
      structures, and formal succession planning are not disclosed. Bloomberg's January 2025
      report on a potential IPO — declined to confirm by management — underscores the opacity
      risk. Two new board members (Thomas Seifert, June Yang) and a new CFO (Rich Sullivan)
      were added in 2025, but the governance infrastructure of a PE-backed private company
      may not match the scrutiny standards required if an IPO proceeds. Competitive risk from
      Driscoll's — which controls approximately 33% of the US berry market, ranked #2 in US
      retail food and beverage brands with 12% growth in 2024, and appointed its first CMO
      in 2025 for global expansion — creates a permanent ceiling on Agrovision's market share
      aspirations. The partner/dependency register (TR003) and people/execution register (TR004)
      provide the structured detail. The dependency map (FR003) shows single-point exposure nodes.
    claimRefs: [CR025, CR026, CR027, CR028, CR029, CR035, CR036, CR043, CR044]
    tableRefs: [TR003, TR004]
    figureRefs: [FR003]

  - id: financial-capital-kill-criteria
    title: 'Financial, Capital Intensity and Kill Criteria'
    body: >-
      Agrovision closed a $400M senior secured credit facility in November 2024, comprising a
      $230M five-year term loan and a $150M three-year revolving credit line, arranged by Rabobank
      and Banco Santander with participation from Goldman Sachs, Barclays, Scotiabank, BBVA,
      and others. This refinanced a prior $210M facility and represents a significant increase
      in financial leverage for a private company whose revenue was approximately $350M in FY2024.
      Total capital invested since inception exceeds $550M. The debt-to-revenue ratio is
      approximately 1.1x, which creates material covenant and refinancing risk if revenues
      miss projections or berry prices decline. Three structural pressures could compress revenues
      simultaneously: tariff-driven market redirection, climate-driven volume shortfall, and
      Driscoll's competitive pricing pressure. The revolver matures in 2027 and the term loan
      in 2029, creating a refinancing window that aligns with anticipated IPO timing — if IPO
      markets are closed or the company's performance disappoints, refinancing on acceptable
      terms may be challenging. Private-company opacity means no public P&L or debt covenant
      terms are available, preventing independent verification of the company's financial health.
      The risk transmission map (FR002) shows how the six risk vectors cascade to revenue,
      margin, credit, and valuation outcomes. The kill criteria table (TR005) establishes
      seven monitorable triggers for thesis-break events, anchored to observable leading
      indicators so that investor monitoring is proactive rather than reactive.
    claimRefs: [CR001, CR002, CR003, CR030, CR032, CR037, CR041]
    tableRefs: [TR005]
    figureRefs: [FR002]

callouts:
  - calloutType: risk
    title: 'Thesis-Break Signal #1: Tariff Escalation Beyond 10%'
    body: >-
      If the US tariff on Peruvian/Mexican blueberries rises above the current 10% base,
      or if the Supreme Court challenge fails and tariffs become permanent and potentially
      broader, Agrovision's US revenue and margin would face a structural compression that
      its vertical integration alone cannot offset. Management's "minimal impact" narrative
      would be definitively disproved, forcing a re-underwriting of the investment thesis.
    claimRefs: [CR005, CR006, CR007]
  - calloutType: risk
    title: 'Thesis-Break Signal #2: Severe El Niño Disruption in Peru'
    body: >-
      A strong El Niño event (moderate-to-severe intensity) causing a >25% volume decline
      at the Peru hub during the September–November 2026 harvest would simultaneously compress
      revenues, test debt covenants, and expose the geographic concentration thesis. The 2023
      precedent (>40% volume decline) shows this is not a tail scenario but a recurrent one.
    claimRefs: [CR012, CR014, CR018]
  - calloutType: risk
    title: 'Thesis-Break Signal #3: Food Safety Recall Linked to Fruitist Brand'
    body: >-
      A Class I FDA recall linking Fruitist-branded products to Listeria, hepatitis A, or
      norovirus contamination would trigger immediate de-listing at major retailers and inflict
      lasting brand damage. The recent 2026 blueberry recall (unrelated brand) and the 2022–2023
      strawberry hepatitis A outbreaks from imported Latin American berries demonstrate the
      category-level exposure Agrovision cannot fully insulate itself from.
    claimRefs: [CR019, CR020, CR022]
  - calloutType: recommendation
    title: Pre-Investment Diligence Priorities
    body: >-
      Before investing, obtain: (1) audited financials and debt covenant terms for FY2024–2025;
      (2) GlobalGAP/SCS/Fair Trade certification status for all farm locations; (3) El Niño
      contingency plan from operations team; (4) independent Peru labor audit; and (5)
      insurance coverage for weather-related crop loss and recall events.
    claimRefs: [CR041, CR044, CR027]
  - calloutType: insight
    title: Company Mitigation Strengths
    body: >-
      Agrovision's genuine mitigating factors include geographic spread across 6+ growing regions,
      varietal replacement accelerating climate-resilient genetics (60% new varieties in Peru),
      RipeLocker postharvest technology extending shelf life, and a premium branded channel
      reducing commodity price exposure. These are real, but insufficient to fully offset the
      tariff and climate vectors currently active.
    claimRefs: [CR033, CR040, CR043]

