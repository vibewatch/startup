figures:
  - id: FR001
    title: Risk Heatmap — Likelihood vs. Impact
    type: matrix
    layout: wide
    summary: >-
      All identified Agrovision / Fruitist risks positioned on a likelihood-impact matrix.
      Climate/El Niño and geographic concentration dominate the high-likelihood, high-impact
      quadrant. Tariff escalation and food safety recall anchor the medium-likelihood, critical
      quadrant. Private-company opacity and key-person risk sit in the low-likelihood, high-impact
      quadrant. The matrix guides priority sequencing for diligence and monitoring.
    data:
      columns:
        - 'Low Impact'
        - 'Medium Impact'
        - 'High Impact'
        - 'Critical Impact'
      rows:
        - label: 'Very High Likelihood'
          values:
            - ''
            - 'Berry oversupply / overlapping harvest commodity pricing'
            - "Driscoll's competitive dominance; market share ceiling"
            - ''
        - label: 'High Likelihood'
          values:
            - ''
            - 'Peru labor wage inflation; India tariff (minor current volume)'
            - 'Peru geographic concentration; ongoing El Niño 2026 alert'
            - ''
        - label: 'Medium Likelihood'
          values:
            - ''
            - 'Capital-intensity / debt-service pressure'
            - 'Key-person (Magami); FSMA regulatory compliance; US tariff escalation'
            - 'Food safety recall linked to Fruitist brand'
        - label: 'Low Likelihood'
          values:
            - 'Certification lapse (minor)'
            - 'Private-company governance opacity'
            - 'Retail customer de-listing; IPO window closure'
            - 'Catastrophic El Niño >40% crop loss'
        - label: 'Very Low Likelihood'
          values:
            - 'Single-farm incidentals'
            - 'ZurGroup integration issues'
            - 'Cybersecurity / IP theft'
            - ''
    approximationNotes: >-
      Likelihood and impact placements are author assessments based on cited public evidence
      as of 2026-06-24; not a formal quantitative risk model. El Niño risk likelihood is
      elevated from Medium to High given the active ENFEN alert confirmed through November 2026.
    claimRefs: [CR005, CR006, CR012, CR014, CR019, CR022, CR028, CR030, CR032, CR036, CR044]

  - id: FR002
    title: Risk Transmission Map
    type: dag
    layout: wide
    summary: >-
      How Agrovision's six primary risk drivers cascade through the business model into
      revenue, margin, credit, and valuation outcomes. Tariff and El Niño risks converge
      on revenue; food safety risk routes through brand damage; labor and competitive risks
      compress margin; debt obligations amplify all upstream shocks into credit stress.
    data:
      nodes:
