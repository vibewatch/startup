          label: "Harvest & Packhouse"
          detail: "Hand-harvest, AI quality scanning, packaging, on-site cold chain"
        - id: n3
          label: "Cold Chain & Logistics"
          detail: "Air/sea freight, RipeLocker technology, last-mile distribution"
        - id: n4
          label: "Retail Distribution"
          detail: "12,500+ stores across 40 countries; direct-to-retail model"
        - id: n5
          label: "Consumer Revenue (~$400M LTM)"
          detail: "~$6–$8/clamshell; ~50% premium vs. commodity"
