  evidenceGaps:
    - id: EG001
      type: private-evidence-only
      severity: critical
      topic: gross-margin
      missingEvidence: "Fruitist gross margin percentage and gross profit dollar amount"
      whyItMatters: >-
        Gross margin is the single most important financial metric for validating the premium-berry
        thesis. Without it, it is impossible to determine whether the 50% retail price premium
        translates to meaningfully better farm-gate margins than commodity comps, or whether
        operating costs consume the premium. Hortifrut earned only 12.7% gross margin at $1.2B
        despite premium berry focus; if Fruitist is similar, the path to EBITDA is narrow given
        high capex.
      diligencePath: >-
        Request audited financial statements or management accounts. Require at minimum 3 years of
        annual P&L with gross margin line itemized by product and geography. Cross-check against
        farm-level profitability reports from Peru, Mexico, and Morocco operations.
      relatedQuestionRefs: [QI024]

    - id: EG002
      type: private-evidence-only
      severity: critical
      topic: ebitda-operating-cash-flow
      missingEvidence: "EBITDA, adjusted EBITDA, operating cash flow, net income or loss"
      whyItMatters: >-
        With $400M+ in credit outstanding, the debt service coverage ratio cannot be computed
        without EBITDA. Hortifrut, the closest comparable, reported a $77.7M net loss in 2025
        despite $1.2B revenue. If Fruitist is similarly loss-making, the $400M credit facility
        imposes material solvency risk in an agricultural downturn or pricing correction.
        The $550M+ cumulative capex exceeds LTM revenue, suggesting the business may not yet
        be generating free cash flow.
      diligencePath: >-
        Require LTM P&L with EBITDA reconciliation and add-back definition. Request monthly cash
        flow statements for trailing 12 months. Ask for CFO presentation on path to EBITDA breakeven
        and cash flow generation by year.
      relatedQuestionRefs: [QI024, QI028]

    - id: EG003
      type: private-evidence-only
      severity: high
      topic: cash-liquidity-burn
      missingEvidence: "Cash and cash equivalents, total current assets and liabilities, monthly burn rate"
      whyItMatters: >-
        With aggressive farm investment continuing and an October 2025 equity raise just closed,
        the company is in growth-capital mode. Without cash position and burn, the runway cannot be
        assessed. If burn exceeds $30–50M per month (plausible given $550M+ capex over 14 years),
        the $150M equity raise would provide only 3–5 months of growth runway.
      diligencePath: >-
        Request balance sheet as of most recent month-end. Require cash-flow bridge from CFO showing
        sources and uses over next 24 months. Compare to credit facility covenants on minimum liquidity.
      relatedQuestionRefs: [QI025, QI026]

    - id: EG004
      type: private-evidence-only
      severity: high
      topic: credit-facility-covenants
      missingEvidence: "Covenant terms, interest rate, EBITDA maintenance tests, leverage covenants, cross-default provisions"
      whyItMatters: >-
        The $400M credit facility is the company's primary debt instrument. Covenant breaches
        in agricultural lending (common in years with adverse weather or commodity price shocks)
        can trigger accelerated repayment. Without covenant visibility, the risk of a liquidity
        event is unquantifiable.
      diligencePath: >-
        Obtain full executed credit agreement from company counsel. Review financial maintenance
        tests (typically EBITDA/debt, current ratio). Assess risk of covenant breach in a scenario
        where blueberry prices fall 15–20% (consistent with Cornell 2025 data showing price declines).
      relatedQuestionRefs: [QI027]

    - id: EG005
      type: enumeration-incomplete
      severity: medium
      topic: revenue-mix-by-segment
      missingEvidence: "Revenue percentage by product (blueberry vs. other berries), by geography, and by retail chain"
      whyItMatters: >-
        CEO has noted blueberries dominate revenue and non-blueberry categories are 'just at the
        ground floor.' Without a segment breakdown, concentration risk cannot be assessed. If a
        single crop (blueberries) represents 90%+ of revenue, weather events or category saturation
        present outsized risk.
      diligencePath: >-
        Request trailing-12-month P&L by SKU family and by customer (anonymized if required). Ask
        for top-10 retail customer revenue concentration with Costco/Walmart separated.
      relatedQuestionRefs: [QI029]

    - id: EG006
      type: missing-source
      severity: medium
      topic: capex-run-rate-and-schedule
      missingEvidence: "Annual capex schedule itemized by farm/project for past 3 years and forward pipeline"
      whyItMatters: >-
        The since-inception figure ($550M+) is the only disclosed capex data point. This cumulative
        figure hides the acceleration or deceleration of spending in recent years. Given that the
        company is stating it is investing primarily in new planting and cold storage, current-year
        capex may be substantially higher than historical averages, affecting EBITDA-to-FCF conversion.
      diligencePath: >-
        Request itemized capex by farm, geography, and asset type for FY2022–FY2025. Distinguish
        maintenance capex vs. growth capex. Review farm development agreements and lease agreements
        for future committed spending.
      relatedQuestionRefs: [QI028]

    - id: EG007
      type: stale
      severity: low
      topic: revenue-guidance
      missingEvidence: "Any forward-looking revenue guidance or management forecast for FY2026"
      whyItMatters: >-
        The most recent revenue figure ($400M+ LTM) is from April 2025; as of the report date
