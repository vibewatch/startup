      the cost layers in Fruitist's vertically integrated model. EBITDA is marked undisclosed;
      gross profit is estimated from public benchmarks.
    approximationNotes: >-
      Cost percentages are estimated from comparable public produce companies (Dole, Fresh Del Monte,
      Hortifrut). Fruitist's actual figures are not disclosed. This figure is intended as a structural
      illustration, not a financial projection.
    data:
      nodes:
