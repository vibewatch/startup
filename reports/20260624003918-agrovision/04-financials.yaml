    summary: >-
      Shows the step-by-step revenue growth from $65.8M (2019) to $400M+ LTM (April 2025), with
      each increment labeled. The trajectory highlights the acceleration in the 2022–2025 period
      driven by the blueberry snacking category and retail expansion.
    approximationNotes: >-
      Revenue figures for 2019 and 2022 are sourced from GlobalAgInvesting (company-cited). FY2024
      ~$350M is from LA Business Journal. LTM $400M+ is company-stated as of April 2025. The $300M
      figure from August 2024 is interpolated between 2022 and FY2024. All values are in USD millions.
    data:
