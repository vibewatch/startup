runDate: '2026-06-24'
company:
  name: Agrovision
chapter:
  number: 4
  title: Financials
  summary: >-
    Fruitist (Agrovision) has delivered one of the most dramatic revenue trajectories in premium produce:
    from ~$65.8M in 2019 to ~$350M in FY2024 and $400M+ on a trailing-12-month basis as of April 2025 —
    a ~510% increase in roughly five years driven by the jumbo-blueberry snacking category. The company
    has raised $443M in equity and a $400M senior secured credit facility ($600M+ combined), funding
    vertical integration across 2,100+ hectares and eight countries. Core financial metrics — gross
    margin, EBITDA, net income, cash position, and debt covenants — are undisclosed as a private company,
    requiring benchmarking against comparable public produce issuers (Dole: ~4.3% adj. EBITDA margin;
    Fresh Del Monte: 9.2% gross margin; Hortifrut: 12.7% gross margin) for underwriting context. The
    capital intensity is high: $550M+ invested since inception against ~$400M LTM revenue, implying
    cumulative investment ahead of revenue. Key diligence blockers are audited financials, EBITDA, and
    covenant compliance terms.

sections:
  - id: revenue-model-and-trajectory
    title: "Revenue Model, Trajectory, and Growth Context"
    body: >-
      Fruitist generates substantially all revenue through direct-to-retailer sales of fresh premium
      berries — principally jumbo blueberries — to over 12,500 North American stores and retailers in
      40 countries, under the Fruitist consumer brand in Western markets and Big Skye in China. The
      revenue mechanism is a traditional produce-sales model: the company grows, harvests, packages,
      and ships fruit from its owned and leased farms directly to retail partners without wholesale
      distribution intermediaries, monetizing a premium pricing position (~50% above commodity berries)
      enabled by genetic differentiation, year-round supply, and consistent quality. The Fruitist Snack
      Cup single-serve format, launched in 2025, represents a nascent adjacent revenue stream at
      premium per-gram pricing, though it was described as a small portion of total sales as of
      October 2025.

      The growth trajectory is exceptional by any produce-industry standard. The company reported
      revenue of approximately $65.8M in 2019, growing to $210.4M by 2022 — a 220% increase in three
      years — then reaching $300M by early August 2024, approximately $350M for full-year 2024 per the
      LA Business Journal, and surpassing $400M on a trailing-12-month (LTM) basis as of April 2025.
      Sales of jumbo blueberries alone tripled in the 12-month period preceding April 2025. The company
      noted that FY2024 revenue of ~$350M represented approximately 20% of the overall premium berry
      market, implying significant share in a high-growth subcategory that has itself compounded at 22%
      CAGR between 2019 and 2024. Blueberries dominate revenue; blackberries, raspberries, and cherries
      (the last via the late-2024 acquisition of ZurGroup) are characterized as strategic growth areas
      scaling from a small base.

      No forward revenue guidance, revenue split by channel, or revenue split by geography has been
      publicly disclosed. The company operates on a calendar-year fiscal year but does not publish
      interim or segment results. Recurring revenue (subscriptions, contracts) is not applicable in
      the fresh produce model; all revenue is transactional at shelf-level sell-through.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI009, CI010]
    tableRefs: [TI001]
    figureRefs: [FI001]

  - id: pricing-and-cost-structure
    title: "Pricing Architecture, Cost Structure, and Margin Framework"
    body: >-
      Fruitist's retail price of approximately $6–$8 per clamshell package positions the product at
      roughly a 50% premium over commodity berry alternatives, making it what CEO Steve Magami has
      described as an "affordable luxury." This premium reflects proprietary genetics (jumbo size,
      crunch, flavor profile), year-round consistency, and extended shelf life enabled by RipeLocker
      postharvest technology. Retailer margin structures are not disclosed; standard fresh produce
      retail gross margins are in the 40–60% range, but the company's own realized margin on wholesale
      prices to retailers is not public.

      On the cost side, Fruitist's model is structurally more capital and operating-cost intensive than
      commodity produce peers because of vertical integration. Cost of goods sold in a model like this
      encompasses farm labor (Peru: up to 15,000 field workers), seed and genetics investment, irrigation
      and inputs, on-site cold storage, freight and logistics, and packaging — all of which Fruitist owns
      or controls rather than outsourcing. This full-stack ownership improves quality control and pricing
      power but means that working capital is heavily committed across long growing cycles and seasonal
      harvest windows. The company operates across eight countries with differing labor cost structures,
      currency exposures, and regulatory environments, adding complexity to cost management.

      Benchmarking against comparable public berry and produce companies provides the best available proxy
      for Fruitist's gross margin range. Fresh Del Monte Produce reported a 9.2% gross margin for FY2025
      on $4.32B in revenue — a company that operates across a wide portfolio of commodity produce
      categories. Hortifrut, the Chilean berry specialist (blueberries, raspberries, strawberries),
      reported 12.7% gross margin on $1.215B in revenue for FY2025, though it posted a $77.7M net loss.
      Dole plc, the largest public produce company, reported $9.2B in FY2025 revenue with $395.4M
      adjusted EBITDA (approximately 4.3% EBITDA margin). Premium produce brands with stronger pricing
      power can achieve gross margins in the 15–25% range per industry benchmarks. Fruitist's branded,
      vertically integrated, premium positioning likely places its gross margin above Dole/FDM but its
      heavy capital investment may constrain EBITDA margins in the near term.
    claimRefs: [CI019, CI020, CI021, CI022, CI023, CI024, CI025]
    tableRefs: [TI002, TI003]
    figureRefs: [FI002, FI003]

  - id: capital-structure-and-adequacy
    title: "Capital Structure, Funding History, and Capital Adequacy"
    body: >-
      Fruitist's capital structure as of mid-2026 comprises $443M in cumulative equity raised and a
      $400M senior secured credit facility closed in November 2024, bringing total equity-plus-credit
      capital raised to over $843M. The company characterizes total raised at "$600M+" combining equity
      and credit; the $600M+ figure reflects that a portion of the credit facility refinanced pre-existing
      debt and may also reflect only a subset of equity rounds in the most commonly cited source. The LA
      Business Journal's "$600M+ since founding" is consistent with the pre-October-2025 capital position.

      The August 2024 $100M equity round from Aliment Capital and Steve Kaplan (Oaktree co-founder)
      established the $1B+ unicorn valuation. The October 2025 $150M equity round led by J.P. Morgan
      Asset Management, with Ray Dalio's family office doubling its position, brought total equity to
      $443M and signaled strong institutional conviction. J.P. Morgan managing director Brad Demong
      stated that the company had "built a moat around its business" and cited "control of its value
      chain, significant organic growth opportunity ahead, and positioning as a driving force of
      premiumization of berries."

      The $400M credit facility (November 2024), arranged by Rabobank and Banco Santander with
      participation from Goldman Sachs, Barclays, Scotiabank, BBVA, BanBif, Banco ITAU, BTG Pactual,
      COFIDE, and ICBC, replaced a prior $210M credit line plus short-term credit lines. The new
      facility comprises a $230M five-year term loan and a $150M three-year revolving credit line.
      Primary use of proceeds was refinancing of existing debt, with remaining capital directed at
      farm expansion, new market entry, and technology investment. The company has invested $550M+
      since inception, a figure that materially exceeds any single funding round and implies capital
      has been deployed faster than equity alone could supply.

      Cash on hand, monthly burn, and runway are not publicly disclosed. CEO Magami stated in October
      2025 that demand "far exceeds" available supply and that capital is being directed into production
      capacity — a signal of growth-mode spending rather than near-term profitability focus. The recent
      appointment of Rich Sullivan (ex-SurveyMonkey CFO) signals a maturation of financial governance
      in preparation for potential future strategic events, including a possible IPO.
    claimRefs: [CI011, CI012, CI013, CI014, CI015, CI016, CI017, CI018, CI026, CI027, CI028, CI029]
    tableRefs: [TI004]
    figureRefs: [FI004]

  - id: unit-economics-and-capital-intensity
    title: "Unit Economics, Working Capital, and Capital Intensity"
    body: >-
      Fruitist's unit economics are not publicly disclosed; the company has never published audited
      or management accounts. The following analysis is based on public data, industry benchmarks,
      and press-release disclosures only — all figures marked as estimates should be treated as
      directional ranges pending formal diligence access.

      Revenue per retail door can be estimated: $400M LTM / 12,500+ stores = ~$32,000 per store
      annually. This is a blended figure across Costco (high volume per location), mass grocery
      (Walmart, Whole Foods), and smaller specialty chains. The per-door figure is not a substitute
      for sell-through velocity data by format.

      Working capital in fresh berry production is inherently seasonal and capital-intensive.
      Growing cycles for blueberries span approximately 10–16 weeks from planting to harvest; the
      company's multi-geography, multi-climate model (Peru, Mexico, Morocco, Egypt, Oregon, etc.)
      is specifically designed to smooth seasonality and approach 52-week supply. Even so, capital
      is committed months in advance of revenue recognition, requiring the revolving credit line for
      working-capital bridging between planting investment and retail sell-in. Cold storage
      infrastructure tied up in each geography adds further capital requirements.

      Capex intensity is high. The company has invested $550M+ since 2012 inception, implying
      average annual capex of approximately $40M (over ~14 years) though recent years are likely
      substantially higher given the growth rate. On a $400M revenue base, this suggests a capex/
      revenue ratio materially above the 5–10% typical of less-capital-intensive food companies.
      Most of this capex is productive: farmland, packhouses, cold storage, and post-harvest
      technology that enables the premium positioning and shelf-life extension. The credit facility
      term loan ($230M, 5-year) is structured to fund long-lived farm assets, consistent with
      agricultural project finance norms.

      Debt service on the $400M facility is not disclosed but represents a significant and real
      obligation. At a rough estimate, a $230M term loan at agricultural lending rates (typically
      SOFR + 200–350 bps = 7–9%) implies $16–$21M in annual interest, plus revolver drawings.
      Coverage ratio (EBITDA/interest) is unverifiable without disclosed EBITDA — a key diligence gap.
    claimRefs: [CI031, CI032, CI033, CI034, CI035, CI036, CI037, CI038, CI039, CI040]

  - id: comparative-benchmarks-and-ipo-context
    title: "Comparative Financial Benchmarks and IPO Context"
    body: >-
      Benchmarking Fruitist against listed produce peers illuminates both the opportunity and the
      challenge of the capital model. Dole plc ($9.2B FY2025 revenue, $395M adj. EBITDA, 4.3% EBITDA
      margin, market cap ~$1.3B at the time of the CNBC April 2025 article) provides a scale
      comparison: at comparable revenue, Fruitist commands a similar valuation ($1B+) as Dole despite
      being roughly 20-25x smaller by revenue — justified only if it sustains dramatically higher
      growth and margins than commodity-oriented Dole. Fresh Del Monte ($4.32B FY2025, 9.2% gross
      margin) and Hortifrut ($1.215B, 12.7% gross margin, net loss of $77.7M) confirm that even
      specialized berry operations run thin margins and can generate losses despite revenue scale.

      Fruitist's $1B+ valuation at ~$400M LTM revenue implies roughly a 2.5x revenue multiple. In
      food and beverage, premium consumer brands with strong growth can achieve 8–12x EBITDA, but
      at the company's likely margin profile, this would require strong EBITDA generation. If gross
      margins are 20–25% on $400M revenue (i.e., $80–$100M gross profit) and EBITDA margins are
      5–8% (i.e., $20–$32M EBITDA), the $1B valuation implies 30–50x EBITDA — a significant growth
      premium that must be justified by sustained revenue expansion and margin improvement.

      Bloomberg reported in January 2025 that the company was weighing an IPO as soon as June 2025;
      management declined to confirm this to CNBC. The appointment of CFO Rich Sullivan, CTO Jim
      Trahanas, and two new board members (Thomas Seifert, June Yang) reflects IPO readiness
      infrastructure being built. However, IPO analyst Matthew Kennedy of Renaissance Capital noted
      that "companies often go public when growth trends look most optimistic, so the biggest risk
      for investors is when that growth is unsustainable, either because it was a fad, or because
      there's a really devoted initial customer base that doesn't translate to the broader market."
      Critically, Cornell University's 2025 berry price survey documented that blueberry commodity
      prices declined noticeably in 2025, representing a potential headwind to Fruitist's premium
      pricing thesis if category pricing softens.
    claimRefs: [CI022, CI023, CI037, CI038, CI029, CI030, CI041]

  - id: financial-gaps-and-verdict
    title: "Financial Disclosure Gaps, Evidence Gaps, and Verdict"
    body: >-
      As a private company, Fruitist has not disclosed audited financial statements, interim results,
      or any core income-statement metrics. The diligence-critical gaps are: (1) gross margin percentage
      — central to underwriting the premium pricing thesis; (2) EBITDA and operating cash flow — needed
      to assess whether the business can self-fund or requires perpetual external financing; (3) cash on
      hand and liquidity position — needed to evaluate short-term solvency and runway; (4) debt covenants
      and interest rate terms — critical given $400M+ in outstanding credit; and (5) revenue breakdown
      by geography and product — important for concentration risk and growth quality assessment.

      The positive financial verdict rests on: (a) $400M+ LTM revenue from a standing start in 2012
      with premium pricing intact; (b) strong institutional investor validation from J.P. Morgan AM,
      Ray Dalio family office, and Aliment Capital; (c) $400M credit facility endorsed by nine global
      banks including Goldman Sachs and Barclays; and (d) explicit CEO commentary that demand exceeds
      supply, implying the constraint is capex/production, not market demand. The concerns center on:
      (a) cumulative capital investment of $550M+ against $400M revenue — the company has deployed
      more capital than it has yet earned in revenue; (b) debt service burden ($400M facility) in a
      thin-margin agricultural business; (c) undisclosed profitability in a sector where peers like
      Hortifrut generate net losses at $1.2B in revenue; and (d) price-sensitive consumer risk in
      a recessionary scenario.

      Financial verdict: Revenue quality is strong (direct-to-retail, premium branded, repeat consumer
      behavior demonstrated). The capital structure is aggressive for an agricultural business. Diligence
      must obtain management accounts (minimum 3 years), audited financials, EBITDA bridge, and full
      credit agreement terms before any investment decision can be made. The absence of this data is
      the single largest underwriting blocker in this chapter.
    claimRefs: [CI031, CI032, CI033, CI034, CI035, CI040, CI041]
    tableRefs: [TI005]

callouts:
  - calloutType: strength
    title: "Exceptional Revenue Growth — 5-Year CAGR ~43%"
    body: >-
      Revenue grew from ~$65.8M (2019) to $400M+ LTM (Apr 2025) — approximately 510% in six years
      or ~43% CAGR. This vastly outpaces the already-strong 22% CAGR for the premium berry category,
      indicating market-share capture on top of category growth. The blueberry business alone tripled
      in the 12 months preceding April 2025.
    claimRefs: [CI001, CI002, CI003, CI004]

  - calloutType: risk
    title: "Undisclosed Financials — Core Diligence Blocker"
    body: >-
      EBITDA, net income, gross margin, cash on hand, and debt covenants are all undisclosed. The
      company has invested $550M+ since inception in a business generating $400M+ LTM revenue — capital
      exceeding revenue — without public evidence of profitability. Peer Hortifrut ($1.2B revenue) posted
      a $77.7M net loss in 2025, illustrating that berry-sector scale does not guarantee earnings.
    claimRefs: [CI023, CI031, CI032, CI035, CI039]

  - calloutType: risk
    title: "High Leverage in a Capex-Intensive Model"
    body: >-
      The $400M credit facility (including $230M term loan) adds material debt service on top of ongoing
      farm investment. Agricultural lending at current rates (~7-9%) implies $16–21M in annual interest.
      Debt covenants, interest rate terms, and coverage ratios are undisclosed. A production shortfall
      or pricing headwind could strain debt service capacity. Cornell's 2025 berry price study documented
      declining blueberry commodity prices, a potential margin headwind.
    claimRefs: [CI015, CI016, CI030, CI033]

  - calloutType: recommendation
    title: "Require Audited Financials and Full Credit Agreement Before Proceeding"
    body: >-
      Any investment decision requires: (1) three years of audited financial statements; (2) unaudited
      management accounts for current-year periods; (3) full $400M credit agreement including covenants,
      springing triggers, and EBITDA maintenance tests; (4) a capex schedule showing farm investment
      pipeline; and (5) monthly or quarterly revenue and gross-margin data.
    claimRefs: [CI031, CI032, CI033, CI034]

  - calloutType: insight
    title: "J.P. Morgan AM Endorsement as Valuation Signal"
    body: >-
      J.P. Morgan Asset Management's lead on the $150M October 2025 round provides an institutional
      imprimatur. JPAM's managing director cited Fruitist's "moat" and "durable expansion" thesis.
      For IPO underwriting purposes, JPAM's participation also suggests familiarity with the financial
      profile — the diligence pathway includes JPAM's investor presentation materials as a triangulation
      source.
    claimRefs: [CI014, CI029]

  - calloutType: assumption
    title: "Gross Margin Estimated at 15–25% Based on Public Comps"
    body: >-
      Gross margin is not disclosed. The estimate of 15–25% is derived from Hortifrut (12.7%), Fresh Del
      Monte (9.2%), and general premium-produce-brand benchmarks (15–25%). Fruitist's premium pricing and
      vertical integration likely place it above commodity comps, but direct farm-operating cost data
      needed to confirm. This estimate should not be used as a financial projection.
    claimRefs: [CI021, CI022, CI023, CI024, CI025]

