          type: delta
        - label: "Revenue 2022"
          value: 210.4
          type: subtotal
        - label: "Growth 2022→Aug 2024"
          value: 89.6
          type: delta
        - label: "Revenue Aug 2024"
          value: 300.0
          type: subtotal
        - label: "Growth Aug 2024→FY2024"
          value: 50.0
          type: delta
        - label: "Revenue FY2024"
          value: 350.0
          type: subtotal
        - label: "Growth FY2024→LTM Apr 2025"
          value: 50.0
          type: delta
        - label: "LTM Revenue (Apr 2025)"
          value: 400.0
