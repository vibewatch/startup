company:
  name: Agrovision
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Fruitist (legal entity Fruitist Holdings Inc., formerly Agrovision Corp.) is a vertically
    integrated premium berry and superfruit company founded in Los Angeles in 2012, achieving
    a $1B+ valuation in August 2024 after nearly tripling sales over three years. With $600M+
    in combined equity and debt raised and $400M+ in trailing 12-month sales as of April 2025,
    Fruitist supplies 12,500+ North American retail doors and distributes to 40 countries,
    making it one of the fastest-growing names in global premium healthy snacking.

sections:
  - id: identity-and-model
    title: Identity, Headquarters and Business Model
    body: >-
      Fruitist is the operating brand and parent entity of Fruitist Holdings Inc., the legal
      successor name adopted on April 22, 2025, replacing Agrovision Corp., the corporate name
      used since the company was founded in 2012. Headquartered in Century City, Los Angeles,
      California, Fruitist is a vertically integrated producer, marketer, and distributor of
      premium fresh berries — principally jumbo blueberries, raspberries, blackberries, and
      cherries — targeting the high-growth healthy snacking segment. The company markets under
      two consumer brands: Fruitist (global) and Big Skye (China). The Fruitist consumer brand
      was first launched in 2020, though the company operated under the Agrovision corporate
      identity for the preceding eight years. The business model is built on full vertical
      integration: Fruitist owns and operates its own farms across optimal global microclimates,
      breeds proprietary non-GMO fruit varieties, manages all logistics and cold chain, and
      sells directly to major retailers, eliminating the fragmented middleman chain that
      characterizes traditional produce supply. The company frames this model as solving
      "berry roulette" — the widespread consumer frustration with inconsistent berry quality
      under conventional fragmented-supply models. Its flagship product, the jumbo blueberry,
      retails at approximately a 50% premium to commodity alternatives and has demonstrated
      strong repeat purchase behavior. The premium berry category delivered a 22% compound
      annual growth rate between 2019 and 2024 per company data, validating the snacking
      thesis. As of the October 2025 funding announcement, Fruitist operates farms in ten
      global microclimates spanning Peru (2,100+ hectares), Mexico (~460 ha), Morocco
      (~160 ha), Egypt (~60 ha), USA-Oregon (~230 ha), China (~25 ha), India (~20 ha),
      Chile (~120 ha), and nursery land in Romania, Thailand, and Indonesia. The company is
      a private unicorn stage entity, never having filed publicly.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO028, CO030, CO041]
    tableRefs: [TO001]
    figureRefs: [FO002]

  - id: leadership-governance
    title: Founders, Leadership and Governance
    body: >-
      Fruitist was co-founded by Steve Magami and Thomas Snyder, both carrying private-equity
      backgrounds. Steve Magami, co-founder, CEO, and Executive Chairman of the Board, conceived
      the concept while scouting biofuel feedstocks in northern coastal Peru and recognizing the
      region's exceptional berry-growing conditions. He subsequently recruited Thomas Snyder,
      a former PE colleague, to co-found the business in 2012. Magami has been the public face,
      brand narrator, and strategic driver of the company throughout its decade of growth,
      representing a significant key-person dependency: investor confidence, retailer
      relationships, the brand narrative, and the global expansion strategy are closely tied
      to his leadership. The company expanded its senior leadership bench materially in 2025
      with four high-profile appointments designed to support capital markets readiness and
      technology scale. In September 2025, Rich Sullivan was named Chief Financial Officer,
      bringing over 25 years of finance experience from high-growth companies including
      DreamWorks, Twitter, STX Entertainment, and SurveyMonkey. Jim Trahanas joined as
      Fruitist's first Chief Technology Officer, strengthening AI and technology capabilities
      across the supply chain. Thomas Seifert joined the Board of Directors as Audit Committee
      Chair, bringing IPO and governance experience from serving as CFO of Cloudflare (which
      he guided through its IPO to a $74 billion market cap) and senior roles at AMD and
      Symantec. June Yang joined as Independent Director, contributing AI and technology
      leadership from her tenure running Google Cloud's AI and Industry Solutions, with
      simultaneous board service at MSCI Inc., NetApp, UiPath, and AHEAD. Aliment Capital's
      Ben Belldegrun took a board seat following the August 2024 equity round. The combination
      of seasoned CPG commercial talent (cited backgrounds from Nestlé, McKinsey, and
      The Wonderful Company) with new finance, technology, and governance leadership signals
      a company actively positioning for a potential public offering and long-term institutional
      ownership.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO013, CO014, CO015]
    tableRefs: [TO002]

  - id: funding-capital
    title: Funding History, Valuation and Capital Structure
    body: >-
      Fruitist has assembled a substantial capital base across multiple distinct financing events
      since its 2012 founding. The most significant equity events occurred in 2024 and 2025.
      In March 2024 the company closed its largest equity round at that time, led by Los Angeles-
      based Aliment Capital (managed by Ben Belldegrun, who took a board seat), though the
      specific amount was not publicly disclosed. In August 2024, Agrovision closed a further
      $100 million equity round from Aliment Capital, Steve Kaplan (co-founder of Oaktree
      Capital Management), and the Ray Dalio family office (Bridgewater Associates), establishing
      the company's $1 billion-plus valuation. In November 2024, the company separately secured a
      $400 million senior secured credit facility arranged by Rabobank and Banco Santander —
      including a $230 million five-year term loan and a $150 million three-year revolving credit
      line — with Goldman Sachs, Barclays, Scotiabank, BBVA, and others participating, replacing
      an existing $210 million credit facility. In December 2024, Agrovision made its first
      acquisition, acquiring ZurGroup, a family-owned Chilean cherry grower and exporter with
      250 hectares of blueberries and land for up to 500 hectares of cherry orchards, launching
      Agrovision Chile. In October 2025, now operating under the Fruitist brand, the company
      closed $150 million in equity led by a J.P. Morgan Asset Management vehicle, with the Ray
      Dalio family office increasing its stake and Caleb Williams' investment firm 888 Midas
      among new investors. Post-$150M round, total equity raised stood at approximately $443
      million per public reporting; total capital (equity plus credit) exceeded $600 million
      per company and media statements. PremierAlts cited $1.3B total raised in 2026, which
      may reflect additional undisclosed rounds or different accounting. Fruitist's valuation
      was established at $1B+ in August 2024 and has not been revised upward in publicly
      available post-October 2025 disclosures.
    claimRefs: [CO016, CO017, CO018, CO019, CO020, CO021, CO022]
    tableRefs: [TO003]

  - id: scale-traction
    title: Scale, Traction and Cover Metrics
    body: >-
      Fruitist's commercial scale has grown rapidly since the Fruitist consumer brand launched
      in 2020. The company recorded approximately $350 million in sales for FY2024 per the
      Los Angeles Business Journal, with trailing 12-month sales of $400 million or more as of
      April 2025, driven by jumbo blueberry sales that tripled year-over-year. The company
      supplies more than 12,500 retail locations across North America, with confirmed
      distribution at Costco, Walmart, Whole Foods, Trader Joe's, Publix, Sprouts, Giant,
      Wakefern, ShopRite, and Albertsons. Internationally, distribution expanded from 28
      countries (April 2025, rebrand announcement) to 40 countries by October 2025, spanning
      North America, Asia, the Middle East, Europe, and the UK. These figures are company-stated
      and unaudited, as Fruitist remains a private company. The company employs approximately
      3,200 corporate employees and up to 15,000 seasonal field workers in Peru alone, with
      over 50% of Peru's workforce being women. Fruitist has invested $400–$550 million since
      inception in global farm expansion, proprietary genetics, AI technology, and supply-chain
      infrastructure including RipeLocker partnership for shelf-life extension. The approximately
      50% price premium commanded by Fruitist berries relative to commodity alternatives
      reflects both strong consumer acceptance and branding success. Brand partnerships with
      NFL quarterback Caleb Williams, USC Athletics, and D.C. United (official snack partner)
      extend the brand's reach into sports and lifestyle channels. The company also introduced
      the Fruitist Snack Cups single-serve format in 2025, targeting on-the-go healthy snacking.
    claimRefs: [CO006, CO007, CO023, CO024, CO025, CO026, CO027, CO032, CO035]
    figureRefs: [FO003]

  - id: milestones-adverse
    title: Milestone Chronology and Adverse Checks
    body: >-
      Fruitist's milestone timeline spans over a decade from a 2012 Los Angeles founding through
      to a potential IPO horizon. Steve Magami conceived the company while scouting biofuel
      feedstocks in northern coastal Peru around 2012 and recognized the region's exceptional
      growing conditions. The first blueberry crops were planted in Peru around 2015, with
      selective breeding (non-GMO), data analytics, and on-farm cold storage investment from
      early operations. The Fruitist consumer brand launched in 2020, entering major US retail
      chains. In 2024, the company accelerated with three major financing events: an undisclosed
      Aliment Capital-led round in March, the $100M equity round at $1B+ valuation in August,
      and the $400M credit facility in November. The ZurGroup cherry acquisition in December
      2024 expanded the product category. The April 2025 corporate rebrand to Fruitist Holdings
      Inc. marked the alignment of the consumer brand with corporate identity. Named to CNBC's
      Disruptor 50 in June 2025 and expanding its leadership team in September, the company
      closed a further $150M from J.P. Morgan Asset Management in October 2025. Adverse and
      disconfirming checks are material: Bloomberg (August 2024) reported that Agrovision
      declined to release specific sales numbers at the time, citing its private-company status.
      The company faces tariff exposure on imports (~10% on most sourcing markets; ~26% from
      India), though management characterizes the impact as "minimal" given geographic
      diversification. No FDA recalls or major food safety incidents involving Fruitist products
      have been documented in public regulatory databases as of June 2026. The largest
      competitive threat is Driscoll's, which holds dominant berry market share and recorded
      12% sales growth in 2024. Bloomberg's coverage also contextualizes agtech sector risk:
      prior investor era saw companies like AeroFarms and AppHarvest enter Chapter 11, raising
      legitimate questions about durable economics in capital-intensive fresh-produce ventures.
    claimRefs: [CO033, CO034, CO036, CO037, CO038, CO039, CO040, CO042, CO043, CO044]
    tableRefs: [TO004]
    figureRefs: [FO001]

