callouts:
  - calloutType: strength
    title: Vertical Integration as Competitive Moat
    body: >-
      Fruitist's full-stack vertical integration — owning genetics, farms, cold-chain, and
      direct retailer relationships — creates a durable moat against fragmented conventional
      competitors. By eliminating middlemen, the company can guarantee consistency and shelf
      life that commodity suppliers cannot match, supporting the ~50% price premium.
    claimRefs: [CO041, CO035, CO027]

  - calloutType: risk
    title: Key-Person Dependence on Steve Magami
    body: >-
      The company's brand narrative, retailer trust, and investor confidence are closely tied
      to co-founder and CEO Steve Magami. No documented succession plan is publicly available.
      His departure or incapacitation would represent a material adverse event given the
      founder-centric culture and private-company governance structure.
    claimRefs: [CO014, CO008]

  - calloutType: insight
    title: Leadership Composition Signals Near-Term IPO Readiness
    body: >-
      The September 2025 leadership appointments — a CFO with public-company capital markets
      experience, an Audit Committee Chair who guided Cloudflare through IPO, and an AI-
      expert Independent Director — collectively signal that Fruitist is actively preparing
      for a public offering. Bloomberg's January 2025 report of IPO exploration reinforces
      this reading.
    claimRefs: [CO010, CO012, CO013, CO033]

  - calloutType: risk
    title: Private-Company Opacity Limits Independent Verification
    body: >-
      Fruitist's revenue, margin, profitability, and precise headcount are all unaudited
      private figures. Bloomberg noted in August 2024 that the company declined to release
      specific sales numbers. This limits the ability to independently validate growth claims
      ahead of a potential IPO filing.
    claimRefs: [CO037, CO038]

  - calloutType: assumption
    title: Revenue Growth Trajectory Reflects Company Narrative
    body: >-
