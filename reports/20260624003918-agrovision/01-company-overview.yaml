  evidenceGaps:
    - type: enumeration-incomplete
      severity: minor
      topic: leadership
      missingEvidence: >-
        Full board roster, complete C-suite org chart, and current role of co-founder
        Thomas Snyder for a private company with no public director disclosures.
      whyItMatters: >-
        Key-person risk assessment and governance evaluation require knowing the complete
        leadership team and their tenure, equity stake, and voting arrangements.
      diligencePath: >-
        Request full board and management list from company; review Delaware or California
        corporate filings for director names; check LinkedIn for Snyder current role.
      relatedTableRefs: [TO002]
    - type: enumeration-incomplete
      severity: minor
      topic: milestones
      missingEvidence: >-
        Precise dates and amounts for pre-2024 operational milestones, early rounds, and
        the exact March 2024 Aliment Capital-led round amount and terms.
      whyItMatters: >-
        A complete milestone chronology is needed to understand capital efficiency and
        growth trajectory from founding through current stage.
      diligencePath: >-
        Request historical cap table and board minutes; review press release archives
        on BusinessWire and PRNewswire for pre-2024 Agrovision announcements.
      relatedTableRefs: [TO004]
    - type: private-evidence-only
      severity: blocking
      topic: IPO
      missingEvidence: >-
        Formal S-1 filing, IPO roadshow disclosure, or official company statement confirming
        an IPO timeline, underwriters, or exchange selection.
      whyItMatters: >-
        IPO readiness is the primary investment thesis signal; without a confirmed filing
        timeline, the likelihood and timing of liquidity event cannot be assessed.
      diligencePath: >-
        Request IPO preparation timeline directly from management; monitor SEC EDGAR for
        S-1 or F-1 filing; track Bloomberg/Reuters IPO pipeline reporting.
      relatedQuestionRefs: [QO023]

    - type: missing-source
      severity: material
      topic: funding
      missingEvidence: >-
        Any equity or debt financing closed between November 2025 and June 2026, including
        bridge rounds, convertible notes, or credit facility amendments.
      whyItMatters: >-
        A gap of eight months between last known financing (October 2025) and the report date
        may conceal additional capital events that affect total raised and dilution.
      diligencePath: >-
        Request complete capitalization table from management; check PitchBook and CB Insights
        for recent rounds; review company press releases and SEC filings if applicable.
      relatedQuestionRefs: [QO024]

    - type: private-evidence-only
      severity: material
      topic: revenue
      missingEvidence: >-
        Audited financial statements confirming FY2024 revenue (~$350M), gross margin,
        EBITDA, and net income or loss.
      whyItMatters: >-
        Revenue and profitability figures are central to valuation analysis; without audited
        accounts the $350M–$400M+ revenue range cannot be independently verified and could
        be misstated.
      diligencePath: >-
        Request management accounts for FY2023 and FY2024; confirm via IPO prospectus when
        filed; benchmark against credit facility covenants obtained in due diligence.
      relatedQuestionRefs: [QO007]

    - type: enumeration-incomplete
      severity: material
      topic: funding
      missingEvidence: >-
        Pre-2024 full capitalization table including all angel rounds, early institutional
        rounds, and precise amounts and dates for the March 2024 Aliment Capital-led round.
      whyItMatters: >-
        Investor ownership percentages, pro-rata rights, anti-dilution provisions, and
        preference stack cannot be modeled without the complete cap table.
      diligencePath: >-
        Request full cap table from management; verify with PitchBook and AngelList data;
        seek disclosure in IPO prospectus.
      relatedQuestionRefs: [QO003, QO010]
      relatedTableRefs: [TO003]

    - type: missing-source
      severity: material
      topic: competition
      missingEvidence: >-
        Independent competitive benchmarking comparing Fruitist's unit economics, margin
        structure, and market share against Driscoll's, Naturipe Farms, Hortifrut, and
        other vertically integrated berry operators.
      whyItMatters: >-
        Fruitist's stated 50% price premium and 22% category CAGR may not hold under
        competitive pressure if Driscoll's or well-funded entrants improve supply chain
        consistency.
      diligencePath: >-
        Commission independent market research from a produce industry analyst; review
        Nielsen/SPINS retail scanner data on berry category performance.
      relatedQuestionRefs: [QO027]

    - type: missing-source
      severity: minor
      topic: risk
      missingEvidence: >-
        Independent audit or NGO assessment of labor conditions, wages, and workers'
        rights for the up to 15,000 field workers in Peru.
      whyItMatters: >-
        Labor practices in Peru are a governance and ESG risk; reputational damage from
        a labor incident could harm brand positioning in health-conscious consumer segments.
      diligencePath: >-
        Review any third-party sustainability audit reports; check ILO and Verité databases
        for Peru labor conditions in berry farming; request supplier audit reports.
      relatedQuestionRefs: [QO021]

