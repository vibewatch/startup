figures:
  - id: FU001
    title: "Fruitist Consumer Journey Map — Discovery to Repeat Purchase"
    type: journey-map
    layout: standard
    summary: "Stages a Fruitist consumer traverses from first encountering the brand to becoming a loyal repeat buyer, highlighting the vertical integration payoffs and brand touchpoints at each step."
    data:
      items:
        - label: "Problem Awareness"
          detail: "Consumer experiences 'berry roulette' — inconsistent quality from commodity brands; mushy or bland berries. GLP-1 users seeking nutrient-dense snacks. Healthy snacking trend increases awareness of produce alternatives."
          tone: neutral
        - label: "Retail Discovery"
          detail: "First encounter at Costco, Whole Foods, Trader Joe's, Walmart, Sprouts, or Publix — often in a prominent end-cap or dedicated display. Jumbo size and premium packaging create visual standout vs commodity clamshells."
          tone: positive
        - label: "First Purchase (Trial)"
          detail: "Consumer pays ~$6 clamshell vs ~$4 commodity; ~50% premium absorbed at trial. Named consumer testimonial: 'didn't even notice the price premium.' Size and firmness signal quality."
          tone: positive
        - label: "Consumption & Quality Verification"
          detail: "Snappy pop, firm texture, consistent sweetness confirms brand promise. RipeLocker vacuum chambers extend shelf life 3×, reducing household spoilage. Consumer validates that 'berry roulette' is solved."
