chapter:
  number: 3
  title: Competitors
  summary: >-
    Fruitist (Agrovision) competes in a berry industry dominated by Driscoll's, which holds an
    estimated 33% US berry market share and ranked #2 US retail food and beverage brand in 2024
    with 12% sales growth. Fruitist's vertically integrated model directly contrasts with
    Driscoll's asset-light licensing network of 900+ independent growers, while Hortifrut
    (public, $1.2B revenue) and Naturipe Farms (grower cooperative) compete on scale and
    distribution. The premium genetics race is intensifying: Fall Creek's Sekoya Nova targets
    the same jumbo-blueberry category Fruitist dominates, and Sekoya Pop already represents
    15% of Peru's 2025-26 blueberry exports — in the same country where Agrovision Peru is
    the 4th-largest exporter.

sections:
  - id: competitive-landscape
    title: Competitive Landscape Overview
    body: >-
      The global fresh berry industry is structured around a small number of dominant brands and
      grower networks competing across two strategic axes: vertical integration depth and genetics
      proprietary control. At the apex sits Driscoll's, the world's largest fresh berry company
      by consumer brand, which ranked as the second-highest-selling retail food and beverage brand
      nationally in the United States for year-end 2024 per Circana data, with 12% growth in
      dollar sales and 13% growth in unit sales. Driscoll's controls an estimated 33% of the US
      berry market through its licensing model, partnering with more than 900 independent growers
      across 22+ countries who produce exclusively under Driscoll's patented varieties. Below
      Driscoll's, the competitive set includes Naturipe Farms (a grower-owned cooperative
      partnership between Hortifrut, MBG Marketing, Naturipe Berry Growers, and Munger Farms),
      Hortifrut (Chilean-headquartered, publicly listed, $1.2B revenue), Well Pict (premium
      organic strawberry and raspberry specialist), Fall Creek Farm & Nursery (the dominant
      blueberry genetics and nursery company behind the Sekoya brand), Alpine Fresh (top-three
      US blueberry importer with five-continent operations), and Agroberries Peru (a direct Peru-origin
      competitor to Agrovision). The berry competitive landscape also includes commodity importers
      and private-label programs at mass retailers, which together represent the status-quo
      alternative that premium brands like Fruitist must continue to displace. Peru exported a
      record 382,934 tonnes of fresh blueberries in the 2025-26 season, up 20% year-on-year,
      with Agrovision Peru ranking 4th among all exporters at 26,332 tonnes — operating in the
      same origin market as Camposol (1st, 50,462 tonnes) and Hortifrut Peru (2nd, 34,177 tonnes).
