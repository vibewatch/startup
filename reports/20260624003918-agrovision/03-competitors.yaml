  - id: driscoll-incumbent
    title: "Driscoll's: The Dominant Incumbent"
    body: >-
      Driscoll's is the unambiguous market leader in branded fresh berries and represents the
      primary incumbent threat to Fruitist's premium positioning. For year-end 2024, Circana
      confirmed Driscoll's as the #2 retail food and beverage brand in the US, behind only a
      major beverage conglomerate, climbing two spots from the prior year. This was one of only
      two brands in the top 15 to achieve double-digit growth in both unit and dollar terms,
      making it the fastest-growing brand among the top 40 in US retail. US fresh berries
      contributed $4.2 billion in sales over the last five years per Circana, a market Driscoll's
      has dominated through its flavor-innovation strategy anchored in proprietary, non-GMO
      selective breeding. The company's Sweetest Batch premium sub-brand and significant organic
      offering address the same consumer segment — premium, flavor-forward, health-conscious — that
      Fruitist targets.

      Driscoll's business model is fundamentally asset-light: rather than owning farms, it licenses
      exclusive patented varieties to 900+ independent growers in 22+ countries, with growers
      contractually restricted from supplying anyone except Driscoll's. This creates deep grower
      lock-in and supply-chain efficiency but introduces a layer of indirection that Fruitist
      argues contributes to the "berry roulette" quality inconsistency problem. Driscoll's global
      business is estimated at over $4 billion in scale. However, the company has faced persistent
      criticism: in Mexico's San Quintín Valley, farmworkers harvesting Driscoll's berries under
      subcontracted arrangements reportedly earned as little as $6 per day, creating a reputational
      vulnerability around its supply chain opacity. Critics also raise concerns about water-intensive
      monocropping and heavy pesticide use. These labor and environmental critiques stand in direct
      contrast to Fruitist's vertically integrated model, which the company markets as delivering
      traceability, safety, and worker welfare oversight.
