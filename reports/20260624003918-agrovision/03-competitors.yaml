  - id: other-berry-producers
    title: Naturipe Farms, Hortifrut, Well Pict, Alpine Fresh, and Agroberries
    body: >-
      Naturipe Farms is a grower-owned partnership between four major berry producers: Hortifrut
      S.A. (Chile), MBG Marketing (Michigan Blueberry Growers cooperative, founded 1936),
      Naturipe Berry Growers (California, founded 1917), and Munger Farms (San Joaquin Valley).
      This cooperative structure gives Naturipe Farms diversified production coverage across North
      and South America with year-round supply. In June 2026, Naturipe reported its premium Sweet
      Selections segment had grown 45% year-on-year, with organic blueberry sales up 18%
      generating $73.4M in additional category value — directly competing with Fruitist in the
      premium segment. Naturipe's proprietary Mighty Blues jumbo variety and its Color Rush pink
      blueberry line are direct competitors to Fruitist's jumbo-blueberry flagship.

      Hortifrut (Santiago, listed on Santiago Stock Exchange as HF-B) is one of the world's largest
      blueberry producers and marketers with FY2025 operating revenue of $1,215M (+5.3% YoY), but
      reported a net loss of $73.3M — widening from a $41.2M loss in 2024 — driven by a strategic
      decision to close under-performing Mexico operations and book $90.3M in asset impairments.
      North America represents 57.4% of Hortifrut's sales. Its varietal renewal in Peru and China
      (replacing older varieties with premium-genetics plants) is a multi-year investment that will
      increase competitive pressure in the premium blueberry segment where Fruitist operates.
      Hortifrut Peru ranked 2nd among Peruvian exporters in 2025-26 with 34,177 tonnes, directly
      competing with Agrovision Peru (4th, 26,332 tonnes) at origin.

      Well Pict ships premium proprietary strawberries and raspberries year-round from Watsonville,
      California and Baja California. Now part of Gem-Pack Berries, the brand maintains a
      12-month organic strawberry program and a growing year-round raspberry program, competing
      with Fruitist's raspberry and blackberry lines through premium organic positioning.

      Alpine Fresh is a market-leading grower, packer, and shipper of fresh berries with operations
      on five continents, specializing in blueberries, blackberries, raspberries, asparagus, and
      fresh-cut produce. It holds approximately 10% US blueberry import share, ranking as one of
      the top three US blueberry buyers, with over 14,000 bills of lading for blueberry imports
      since 2012. Agroberries Peru is a leading Peruvian exporter that ranked in the top 10 during
      the 2025-26 season, operating in the same La Libertad and coastal growing regions as
      Agrovision Peru.
