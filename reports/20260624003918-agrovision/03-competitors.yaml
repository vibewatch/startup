callouts:
  - calloutType: strength
    title: Vertical Integration Is Fruitist's Primary Competitive Moat
    body: >-
      Fruitist's ownership of 2,100+ hectares in Peru — the world's top blueberry export origin —
      plus farms in six other countries gives it end-to-end quality control that Driscoll's
      (licensing model) and Naturipe Farms (cooperative) cannot easily replicate. This vertical
      integration is the structural foundation of the ~50% consumer price premium.
    claimRefs:
      - CP037
      - CP039
      - CP041

  - calloutType: risk
    title: Driscoll's Incumbency and Channel Power Are the Dominant Competitive Threat
    body: >-
      Driscoll's ranked #2 US retail food and beverage brand in 2024 with 12% sales growth,
      controlled an estimated 33% US berry market share, and has entrenched retailer relationships
      built over decades. A deliberate move into the jumbo premium blueberry sub-segment via a
      dedicated Driscoll's sub-brand would directly challenge Fruitist on its home turf with
      superior distribution and consumer awareness.
    claimRefs:
      - CP001
      - CP002
      - CP040

  - calloutType: insight
    title: The Berry Genetics Race Is Accelerating
    body: >-
      Sekoya Pop already represents 15% of Peru's record 382,934-tonne 2025-26 export volume.
      Fall Creek's Sekoya Nova demonstrates 60-day shelf life and 80%+ fruit exceeding 18mm —
      approaching the quality profile that Fruitist markets as a premium differentiator.
      As premium genetics proliferate among third-party growers, the jumbo blueberry
      quality gap that supports Fruitist's price premium will narrow.
    claimRefs:
      - CP025
      - CP028
      - CP029
      - CP032

  - calloutType: recommendation
    title: Fruitist Must Protect Its Genetics IP Against Commoditization
    body: >-
      With Fall Creek Sekoya, Naturipe Berry Blue, and Driscoll's all investing in jumbo premium
      genetics, Fruitist's differentiation depends on staying ahead in proprietary variety
      development. Investors should ask for specifics on the breadth of Fruitist's genetics
      IP, patent/PVP coverage, exclusivity agreements, and time-to-commodity risk for current
      flagship varieties.
    claimRefs:
      - CP039
      - CP025
      - CP022

  - calloutType: risk
    title: Labor and ESG Critiques in the Berry Category Create Reputational Risk
    body: >-
      Driscoll's faces sustained criticism for labor conditions in its subcontracted Mexico
      supply chain and for water-intensive monocropping. While Fruitist's vertical integration
      offers more oversight, the company operates large-scale farms in Peru and Morocco where
      third-party labor and environmental audits matter. Category-wide reputational risk from
      Driscoll's controversies could spill over onto all premium berry brands.
    claimRefs:
      - CP008
      - CP009

