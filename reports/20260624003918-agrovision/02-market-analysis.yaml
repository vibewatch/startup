  - id: buyer-and-channel-segmentation
    title: Buyer, User, Payer, and Channel Segmentation
    body: >-
      The fresh premium berry category has a concentrated retail channel structure dominated by
      national grocery chains, club/warehouse stores, and specialty/natural food retailers. The
      end consumer is the primary user and payer; the retailer category buyer is the immediate
      gatekeeper and makes the ranging decision. For premium berry brands, winning shelf at a
      relatively small number of key accounts (Costco, Walmart, Whole Foods, Trader Joe's, Publix,
      Sprouts, Albertsons, Giant/Wakefern, ShopRite) determines category reach at scale.

      Within the consumer base, Fresh Trends 2025 data from over 1,100 surveyed US shoppers
      shows that 54% of consumers purchased blueberries in the last 12 months — tied with
      strawberries for most-purchased berry. Higher-income consumers (HHI >USD 100K) are the
      most frequent purchasers at 64%, making the premium segment a premium-income demographic
      capture opportunity. Younger consumers (Gen Z 32%, Millennials 24%) purchase organic
      blueberries at substantially higher rates than older generations (9% for Baby Boomers),
      pointing toward a generational tailwind as Gen Z's purchasing power grows. Nearly half
      (45%) of consumers reported purchasing jumbo/extra-large blueberries in the last 12 months.

      The club/warehouse channel (Costco) represents a strategically important payer: high
      volume, large SKU sizes, and a member demographic that skews higher income. This channel
      is particularly well-suited to Fruitist's jumbo blueberry value proposition. Specialty
      natural food chains (Whole Foods, Sprouts) are high-affinity channels given their premium
      positioning and health-conscious shopper base. National grocery chains provide the volume
      scale for broad distribution.

      On the international side, Fruitist sells to retailers in 28-40 countries with China
      and the UK/Europe being key markets. China in particular is served under the Big Skye brand
      with direct retail relationships. Budget ownership for berry category decisions sits with
      produce directors and category managers at the retailer, with consumer pull data (velocity,
      turn, price realization) as the primary adoption trigger for new berry brands.
    claimRefs: [CM010, CM013, CM014, CM015, CM040, CM051, CM052]
    tableRefs: [TM003]
  - id: growth-drivers-and-constraints
    title: Growth Drivers, Headwinds, and Market Constraints
    body: >-
      The macro growth drivers for the premium fresh berry category are well-supported, but
      structural supply-side constraints and competitive dynamics introduce material risks that
      differentiate favorable from unfavorable market scenarios for Fruitist.

      On the demand side, the convergence of health-conscious snacking, GLP-1 pharmaceutical
      tailwinds, and younger-consumer organic orientation creates a multi-year structural demand
      expansion. US berry retail grew 7.5% in FY2025 (Circana), and the premium tier (jumbo,
      branded, organic) is growing faster. Fruitist's jumbo blueberry sales grew 3x in the 12
      months to April 2025.

      The most critical constraint is the supply-demand imbalance in the global blueberry market.
      Peru's blueberry exports are growing at approximately 30% annually — a pace that dramatically
      outstrips consumption growth in core markets. The International Blueberry Organization (IBO)
      reported that between May and August 2025, Peru shipped 71,957 tons of blueberries (+137%
      YoY by volume), but export value grew only 44%, reflecting a sharp decline in average prices:
      July prices were 38% below 2024 levels, and August averaged USD 5.95/kg versus USD 10.08/kg
      the prior year. The 2025 full-year export average price was USD 6.22/2.2 lbs — ~3% below 2024.
      If generic supply continues to expand faster than demand, price compression in the commodity
      tier could gradually erode the premium spread, making brand equity maintenance and supply
      differentiation (genetics, size, consistency) even more critical to defend margins.

      IBO's 2025 Annual Report characterizes the market as exhibiting "uneven growth dynamics" —
      a rising risk of oversupply in generic blueberries alongside a shortage of certain high-quality
      premium categories. This bifurcation is exactly the thesis Fruitist is executing: if the
      generic segment deflates while demand for premium continues to grow, Fruitist's brand investment
      becomes more strategically valuable. However, if premium pricing power erodes because of quality
      improvements across the commodity tier, the 50% price premium becomes harder to sustain.

      Tariffs and trade policy represent a secondary constraint. Peru and Chile currently face a
      ~10% US import tariff; India-sourced product faces 26%. Fruitist's management states tariff
      impact is "minimal" — partially defensible given its multi-origin diversification — but this
      is unverified from public financial disclosures. The company's Mexico and Morocco operations
      face different tariff treatments. Currency volatility in Peru (PEN vs. USD) and labor cost
      dynamics in Peru and Morocco are additional cost factors that are largely opaque in public data.
    claimRefs: [CM010, CM012, CM034, CM035, CM036, CM037, CM050, CM053, CM054]
