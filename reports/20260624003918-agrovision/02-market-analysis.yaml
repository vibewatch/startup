  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: premium-berry-category-sizing
      missingEvidence: >-
        Independent third-party market research (Circana, IRI, Nielsen) quantifying the size
        and growth rate of the premium/branded berry sub-category distinct from commodity
        blueberries, with a verifiable CAGR separate from Fruitist's company-stated 22%.
      whyItMatters: >-
        The 22% premium berry CAGR is cited exclusively by Fruitist itself and underpins the
        entire TAM/SAM sizing narrative for the investment case. Without independent confirmation,
        the SAM estimate rests on unverified company data and may not be reproducible.
      diligencePath: >-
        Commission a targeted Circana/IRI retail scanner study covering berry SKUs priced at
        or above a defined premium threshold (e.g., >$3/lb) at Fruitist's key retail accounts
        over 2019-2024; request USHBC annual reports for branded blueberry ASP trend data.
      relatedQuestionRefs: [QM014, QM028]
      relatedTableRefs: [TM002]
    - type: stale
      severity: minor
      topic: per-capita-consumption
      missingEvidence: >-
        USHBC per capita blueberry consumption data for 2022-2025; the most recently available
        public figure is for 2021 (2.54 lbs/person), leaving a 4-year data gap.
      whyItMatters: >-
        Per capita consumption is a key indicator of demand depth; stale data prevents
        calibration of whether growth has accelerated, plateaued, or decelerated since 2021.
      diligencePath: >-
        Request USHBC annual report or USDA ERS blueberry demand tables for 2022-2025;
        alternatively, estimate through import volume + domestic production ÷ US population.
      relatedQuestionRefs: [QM006]
    - type: conflicting-data
      severity: material
      topic: market-sizing
      missingEvidence: >-
        A common scope definition and methodology comparison table enabling reconciliation of
        the USD 8-10B gap between Mordor Intelligence (USD 36.7B fresh berries) and TBRC
        (USD 28.4B all berry forms) for the 2026 global market.
      whyItMatters: >-
        Without resolving the scope discrepancy, selecting the wrong TAM figure overstates
        or understates Fruitist's addressable market by up to 30%, materially affecting
        SAM derivation and implied market share calculations.
      diligencePath: >-
        Review methodology section of each analyst report to confirm fresh-only vs. processed
        scope; request fresh-only sub-segment estimate from TBRC to enable like-for-like comparison.
      relatedQuestionRefs: [QM020]
      relatedTableRefs: [TM002]
    - type: enumeration-incomplete
      severity: material
      topic: buyer-segmentation
      missingEvidence: >-
        Verified revenue breakdown by retail channel (Costco, Walmart, Whole Foods, international
        export channels) and by berry type (blueberry vs. raspberry vs. blackberry vs. cherry)
        to quantify customer concentration and product mix risk.
      whyItMatters: >-
        If a single account (e.g., Costco) represents more than 30% of revenue, or if blueberries
        represent more than 80% of revenue, these concentration risks materially affect the
        risk profile and justify lower valuation multiples.
      diligencePath: >-
        Request management presentation disclosing top-5 customer revenue concentration and
        product-type revenue/GP split in formal diligence; cross-check against public retail
        program size estimates from produce industry sources.
      relatedQuestionRefs: [QM009]
      relatedTableRefs: [TM003]
    - type: access-blocked
      severity: minor
      topic: blueberry-market-data
      missingEvidence: >-
        Full IBO 2025 Annual Report data on global blueberry production by country, market share
        of top exporters, premium versus commodity segment economics, and 5-year volume projections;
        this report requires IBO membership or purchase.
      whyItMatters: >-
        IBO is the authoritative global blueberry industry data source; its 2025 data would
        confirm or challenge Fruitist's stated category position, premium segment CAGR, and
        Peru production trajectory projections.
      diligencePath: >-
        License IBO 2025 Annual Report directly, or request access through Proarándanos
        (Peru blueberry growers association) which is an IBO member; alternatively, seek
        IBO member company referral access.
      relatedQuestionRefs: [QM025]
    - type: missing-source
      severity: minor
      topic: glp1-berry-demand
      missingEvidence: >-
        Published study or retail scanner analysis specifically quantifying the GLP-1 user
        household premium berry purchase lift compared to matched non-GLP-1 households;
        current evidence addresses produce broadly, not premium berry specifically.
      whyItMatters: >-
        GLP-1 tailwind is cited as a key growth driver; if the incremental spend goes to
        bananas, citrus, and greens rather than premium blueberries, the direct benefit to
        Fruitist may be smaller than the broad produce narrative implies.
      diligencePath: >-
        Request Circana or IRI produce panel data segmented by GLP-1 user households for
        the berry sub-category specifically; monitor Fruitist's same-store velocity data
        across GLP-1 high-prevalence demographics.
      relatedQuestionRefs: [QM013]
