chapter:
  number: 2
  title: Market Analysis
  summary: >-
    The global fresh berry market stands at USD 36.7B in 2026 (Mordor Intelligence; CAGR 4.2%),
    with the blueberry sub-segment at ~USD 10.5B growing at 6.5% per year, while US retail berry
    dollar sales reached USD 12.5B in FY2025 (+7.5% YoY per Circana). Fruitist's premium
    "snackable" berry category claims 22% CAGR (2019-2024, company-stated), dramatically outpacing
    the overall market; Peru's counter-seasonal harvest provides year-round US supply enabling
    premium programming, though supply expansion running at ~30% annually versus less than 10%
    consumption growth creates structural price pressure risk in the commodity segment that
    premium operators must actively defend against.
sections:
  - id: market-boundary
    title: Market Boundary, Scope, and Substitutes
    body: >-
      The relevant market for Fruitist (parent: Agrovision) is the global premium fresh berry
      category — vertically integrated, year-round supply of branded, differentiated berries sold
      at retail and, secondarily, through foodservice and export channels. The product boundary
      includes fresh blueberries (jumbo/large-caliber branded), fresh raspberries, fresh blackberries,
      and fresh cherries (added via ZurGroup). Excluded from the core boundary are frozen berries
      (a structurally separate supply chain and buyer), dried/processed berry ingredients, berry-based
      beverages and nutraceuticals, and commodity bulk berry packs sold without branding premiums.
      These adjacencies serve different buyer workflows and margin structures and are not currently
      part of Fruitist's go-to-market strategy.

      The status-quo substitute for Fruitist's premium position is the commodity berry programme:
      generic blueberries from Peru, Mexico, or Chile sourced by retailers as private-label or
      unbranded bulk, typically priced at a significant discount to Fruitist's approximately 50%
      price premium versus commodity. A second substitute is the broader snack category — chips,
      crackers, confectionery, and protein bars — which compete for the same snacking occasion and
      shelf budget. A third substitute is fresh-cut fruit and vegetable snack packs from competing
      produce brands.

      Adjacent markets with potential whitespace include: (1) Organic berry packs, where organic
      blueberries already represent 15% of US imports and growing; (2) value-added snack formats
      such as Fruitist's recently launched Snack Cups; (3) functional ingredients (freeze-dried,
      concentrated blueberry powders) used in nutraceuticals and food manufacturing; (4) international
      premium retail corridors in China, UK, Europe, and the Middle East. The total global snacking
      market is cited by Fruitist at ~USD 600B, but this is a highly heterogeneous addressable space;
      for diligence purposes, the relevant upper-bound TAM is the global fresh berry market.
    claimRefs: [CM001, CM002, CM003, CM004, CM016, CM041, CM042, CM043]
    tableRefs: [TM001]
  - id: market-sizing
    title: "TAM, SAM, and SOM: Multiple Sizing Lenses"
    body: >-
      Market sizing for the premium fresh berry category requires careful scope definition because
      analyst estimates vary substantially depending on whether the count includes fresh-only versus
      processed berries, blueberries only versus all berry types, and global versus North American
      markets. Three primary sizing lenses are relevant to Fruitist's investment case.

      The broadest TAM lens is the global fresh berry market, sized by Mordor Intelligence at
      USD 36.73B in 2026, growing to USD 45.14B by 2031 at a 4.22% CAGR. Strawberries hold
      the largest share (~32% in 2025) but blueberries carry the highest sub-segment CAGR (6.92%
      through 2031). The Business Research Company (TBRC) reports a slightly narrower global berry
      market — including processed forms — at USD 26.97B in 2025, growing to USD 28.42B in 2026
      at 5.4%, reflecting a scope that includes frozen, dried, and concentrate. These two estimates
      bracket the USD 25-26B range cited in canonical industry commentary for 2024.

      Within the TAM, the blueberry sub-segment that is Fruitist's core product is sized at
      USD 9.84B in 2025 and USD 10.49B in 2026 (TBRC/Research & Markets, 6.5% CAGR), while
      Business Research Insights places the 2026 blueberry market at USD 10.75B with a 4.7% CAGR
      through 2035. The blueberry sub-segment therefore represents approximately 25-29% of the
      broader fresh berry TAM, reflecting its outsized importance relative to other berry types.

      The most directly relevant SAM for Fruitist is the North American premium berry retail segment
      plus key international export corridors. US retail berry dollar sales reached USD 12.5B for
      the 52 weeks ending June 2025 (Circana OmniMarket), up 7.5% year-over-year and more than
      twice the next leading produce category (grapes). Premium branded berry packs are a fast-growing
      sub-segment within this figure, but an independent third-party estimate of the premium tier's
      exact share is not publicly available — Fruitist's own claim of 22% CAGR for the premium
      category in 2019-2024 is company-stated and independently unverified. At a rough premium
      share of 15-25% of US retail, the North American premium berry SAM would be approximately
      USD 1.9-3.1B, to which international premium export markets add materially.

      Fruitist's SOM is defined by its current revenue: approximately USD 350M in FY2024 and
      USD 400M+ in the last-twelve-months as of April 2025, implying roughly 13-21% current
      penetration of the estimated North American premium SAM. The company's stated ambition
      is to grow volumes by multiples over the next several years.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM006, CM007, CM008, CM011, CM012]
    tableRefs: [TM002]
    figureRefs: [FM001, FM002]
  - id: supply-geography-seasonality
    title: Counter-Seasonal Supply, Peru, and Year-Round Availability
    body: >-
      A structural advantage of Fruitist's vertical integration — and a key enabler of the
      premium berry category's year-round retail programming — is the counter-seasonal supply
      cycle from Peru. Domestic US blueberry production runs from April through September, with
      peak shipments in May through July across growing states including Washington, Oregon, Georgia,
      Michigan, and California. During the domestic off-season (October through March), US retailers
      depend almost entirely on imports; by early 2026, approximately 99% of US fresh blueberry
      shipment volume in the January-through-mid-March window came from imports alone.

      Peru has become the dominant supplier. In 2025, the US imported a record 719.8 million pounds
      of fresh blueberries — a 5% increase over 2024's previous record of 684 million pounds — with
      Peru supplying 405.9 million pounds or 56% of import volume. Peru's coastal production regions
      (La Libertad, Lambayeque, Áncash, Piura) enable peak blueberry harvest from October through
      February, directly complementing the US domestic season. The USDA GAIN report (June 2025)
      forecasted Peru's MY2025/26 blueberry production at a record 355,000 metric tons with exports
      of 335,000 MT. In calendar year 2025, Peru ultimately exported 412,239 MT valued at USD 2.563B
      — both record figures representing 17% volume growth year-over-year.

      This supply structure has evolved rapidly. Peru surpassed Chile as the leading US blueberry
      supplier in 2019 and overtook Mexico in 2021. The growth trajectory has averaged approximately
      30% annually since 2016, supported by field expansion (~7,400 acres added annually, with
      ~62,000 acres now in production) and significant varietal innovation — next-generation
      varieties such as Sekoya Pop and Mágica now account for approximately 60% of planted acreage.
      The Chancay Port, opened to shorten Asia-bound transit by 10 days, is enabling rapid
      diversification of Peruvian exports toward China, which more than doubled its import value
      from Peru in 2025. Peru now exports to 66 distinct global markets (up from 52 in 2024).

      Fruitist's 2,100+ hectares in Peru represent a core operational anchor in this supply chain,
      giving it direct access to the counter-seasonal harvest window. Two-thirds of all fresh
      blueberries sold in the US are now imported, making import supply reliability a strategic
      imperative for any year-round premium berry brand.
    claimRefs: [CM017, CM018, CM019, CM020, CM021, CM022, CM023, CM024, CM025, CM039, CM045, CM046, CM047, CM048, CM049]
  - id: demand-drivers-and-healthy-snacking
    title: "Demand Drivers: Healthy Snacking Tailwind and GLP-1 Impact"
    body: >-
      The structural demand environment for premium fresh berries is supported by two reinforcing
      megatrends: the secular shift toward healthy snacking, and the emerging GLP-1 pharmaceutical
      tailwind that is measurably redirecting consumer food purchasing toward fresh produce.

      The global healthy snacks market is estimated at USD 117.9B in 2026 by both Mordor Intelligence
      and Dimension Market Research, growing at 6.5-6.8% CAGR through 2031-2035. The US healthy
      snacks market alone is projected at USD 39.5B in 2026. Fruit, nuts, and seeds snacks hold
      the largest share within the healthy snacks category (33.71% in 2025 per Mordor), with organic
      and free-from products growing fastest at 8.11% CAGR. This provides the macro backdrop for
      Fruitist's positioning: fresh, premium, naturally healthy berries competing directly for the
      same consumer snacking occasion as packaged healthy snack brands.

      The GLP-1 drug tailwind adds a more recent and powerful vector. As of mid-2024, over 16% of
      US households had at least one GLP-1 user, with Roland Berger projecting global users to triple
      from ~40 million to ~120 million within five years as prices fall and oral formulations gain
      approval. The key finding for the berry category: GLP-1 users do not reduce all food
      categories uniformly. A Cornell University / Numerator peer-reviewed study (2025) found that
      households with at least one GLP-1 user cut total grocery spending by 5.3% within six months,
      with the largest declines in savory snacks (-10%), sweet bakery (-9%), and soft drinks (-7%);
      however, fresh fruit spending increased — along with yogurt, nutrition bars, and meat snacks.
      Circana's analysis found that before starting GLP-1 therapy, people seeking to lower their BMI
      were only 3% more likely to buy produce than average; by end of year one on treatment, the
      figure rose to nearly 5%. UC Davis food research cites data that GLP-1 users consume 55% more
      fruits and vegetables compared to pre-treatment baselines.

      These dynamics collectively support sustained demand growth for premium, convenient,
      snackable berry formats — the exact segment Fruitist occupies with its jumbo blueberries
      and Snack Cups. The premium berry category grew at a 22% CAGR between 2019 and 2024 by
      Fruitist's own account, compared to the overall fresh berry market growth of approximately
      4-5%, suggesting that market-share gains within a growing category underpin the investment
      thesis. Per-capita US blueberry consumption has grown nearly tenfold over two decades — from
      0.26 lbs in 2000 to 2.54 lbs in 2021 — with continued growth expected.
    claimRefs: [CM009, CM026, CM027, CM028, CM029, CM030, CM031, CM032, CM033, CM044]
