  topStrengths:
    - >-
      Branded premium category leadership: Fruitist solves the 'berry roulette' consistency problem through vertical
      integration and commands an estimated ~50% price premium across 12,500+ North American doors and ~40 countries.
    - >-
      Meteoric, demand-led growth: ~$350M FY2024 sales rising to $400M+ trailing-12-month by April 2025, validated by
      repeat top-tier retail placement (Costco, Walmart, Whole Foods) and healthy-snacking tailwinds.
    - >-
      Deep capital and blue-chip backing: ~$443M equity (Aliment Capital, Steve Kaplan, Ray Dalio family office, J.P.
      Morgan Asset Management) plus a $400M credit facility funding a ten-microclimate, year-round supply base anchored
      by a ~2,100-ha Peru hub.
    - >-
      Differentiated technology moat: proprietary non-GMO genetics/breeding, AI harvest prediction, robotics and a
      RipeLocker postharvest partnership that materially extends shelf life and protects premium quality.
  topRisks:
    - >-
      Private-company opacity: no audited financials, gross margin, EBITDA or precise growth disclosed, making the $1B+
      valuation and unit economics difficult to verify and a core diligence blocker.
    - >-
      Agricultural and climate concentration: berry-only, crop- and geography-concentrated (Peru hub) operations are
      exposed to El Nino, frost, drought, disease and yield volatility.
    - >-
      Trade, food-safety and labor exposure: ~10% import tariffs (26% on India), fresh-produce recall risk
      (Listeria/Cyclospora precedents), and reliance on up to 15,000 Peru field workers amid wage and labor-practice
      scrutiny.
    - >-
      Competitive and exit risk: Driscoll's scale, genetics and brand dominance, plus an unproven IPO window where
      public produce comps (e.g., Dole at ~2x sales) trade well below Fruitist's implied premium multiple.
  unresolvedGaps:
    - >-
      No audited financials: gross margin, EBITDA, net margin, cash burn, runway and precise YoY revenue growth are
      undisclosed.
    - >-
      Capital structure detail: exact total raised (equity vs. drawn credit), debt covenants, secondary transactions and
      post-round ownership/board control are not public.
    - >-
      IPO path and valuation basis: timing, target multiple, and what underpins the $1B+ mark versus public produce
      comparables remain unconfirmed by management.
    - >-
      Operational KPIs: per-hectare yields, cost of production, customer/retailer concentration and the true scale of
      recurring vs. seasonal revenue are not disclosed.
