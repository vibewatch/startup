  summary: >-
    Fruitist's competitive position is built on six interlocking technology and operations layers, from owned land and water
    assets at the base through genetics, farm operations, postharvest technology, distribution and the consumer-facing brand
    at the top. Vertical ownership of all layers is the primary source of quality consistency and supply-chain defensibility.
  title: Fruitist Vertically Integrated Technology Stack
  type: stack
