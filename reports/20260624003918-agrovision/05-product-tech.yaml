artifact: product-tech
callouts:
- body: >-
    The June 2024 RipeLocker partnership gives Fruitist a postharvest technology advantage that fragmented grower-packer competitors
    cannot replicate without a comparable scale agreement. Extending shelf life to 8–12 weeks enables ocean freight to China,
    India and Europe at ~$0.50/kg versus ~$3–4/kg for air, materially reducing logistics cost on the most lucrative distant-market
    routes. It also enables commercialisation of delicate high-flavor varieties previously ruled out by short postharvest
    windows.
  calloutType: strength
  claimRefs:
  - CE017
  - CE018
  - CE019
  - CE023
  - CE024
  title: RipeLocker Partnership Triples Shelf Life and Unlocks Ocean Freight
- body: >-
    Fruitist has no publicly disclosed alternative postharvest technology partner. RipeLocker remains a startup (angel-funded
    to date) and the container-scale RipeReefer needed to halve per-kg freight costs was in a 20-foot prototype phase as of
    early 2026, with commercial trials targeting late 2026 or early 2027. Any delay in the RipeReefer rollout, or disruption
    to the RipeLocker partnership, would revert Fruitist to conventional cold-chain economics and eliminate the ocean-freight
    margin advantage.
  calloutType: risk
  claimRefs:
  - CE017
  - CE025
  title: RipeLocker Sole-Vendor Dependency and RipeReefer Prototype Risk
- body: >-
    Peru's Olmos/Lambayeque hub provides 2,100+ hectares and approximately 50% of Fruitist's US export volume. Peru's Coastal
    El Niño alert was extended through November 2026, with above-average rainfall and temperatures up to +3°C above normal
    projected for the northern coast — the precise region of Fruitist's main operations. Previous El Niño events in 2017 and
    2023–2024 disrupted road connectivity and delayed export shipments. With larger volumes and more complex retail programmes,
    any El Niño disruption now carries greater revenue and retailer relationship impact.
  calloutType: risk
  claimRefs:
  - CE033
  - CE037
  title: Peru Hub Concentration and El Niño Climate Exposure
- body: >-
    Two high-priority diligence actions should be completed before any investment decision: (1) request from newly appointed
    CTO Jim Trahanas the specific AI platform architecture, vendor relationships and 2026–2028 technology roadmap; and (2)
    obtain quantified data on the proportion of Fruitist's supply chain currently operating with RipeLocker drum chambers
    versus conventional cold chain, and a confirmed commercial launch timeline for the RipeReefer container. These two data
    points are critical to validating the technology moat and the ocean-freight logistics margin improvement.
  calloutType: recommendation
  claimRefs:
  - CE025
  - CE030
  title: Request CTO Technology Roadmap and RipeLocker Deployment Data
- body: >-
    The Snack Cups launch and the Good Housekeeping 2026 Snack Award win signal that Fruitist is executing a strategic pivot
    from premium produce supplier to CPG snacking brand. This is consistent with the new seasoned CPG leadership team (from
    Nestlé, McKinsey, The Wonderful Company) and the Caleb Williams NFL partnership. If successful, the CPG positioning opens
    a much higher valuation multiple category, but also introduces brand management complexity and execution risk not present
    in pure produce supply.
  calloutType: insight
  claimRefs:
  - CE004
  - CE005
  title: Snack Cups Signals Evolution from Produce to CPG Brand
chapter:
  number: 5
  summary: >-
    Fruitist (Agrovision) operates a vertically integrated agtech platform whose three interlocking pillars — proprietary
    non-GMO selective breeding, AI-driven precision operations, and the RipeLocker postharvest vacuum-chamber partnership
    — deliver premium jumbo berries 52 weeks per year across a nine-country, 3,300+ ha farm network anchored by 2,100+ Peruvian
    hectares. The June 2024 RipeLocker deal extends blueberry shelf life to 8–12 weeks (vs. ~4-week norm), unlocks ocean-freight
    logistics to distant markets, and enables commercialisation of delicate high-flavour varieties previously impractical
    to ship globally. Millions of monthly berry-level data points feed AI harvest-prediction and quality-assurance systems;
    the Snack Cups format — a Good Housekeeping 2026 Snack Award winner — validates product-format innovation capability.
    Material diligence gaps include limited public technical documentation, incomplete commercial deployment evidence for
    the RipeLocker drum rollout, and the container-scale RipeReefer system still in 20-foot prototype phase as of 2026.
  title: Product & Technology
