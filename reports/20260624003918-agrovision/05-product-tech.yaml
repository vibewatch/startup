  evidenceGaps:
  - diligencePath: >-
      Request technical due diligence from management (CTO Jim Trahanas); obtain vendor contracts or architecture summary;
      ask for independent AI performance benchmarks vs. stated "industry first" claim.
    id: EGE001
    missingEvidence: >-
      Name of the AI platform, vendor or algorithmic approach powering Fruitist's harvest prediction and berry quality scanning
      systems. CEO has confirmed AI exists but no vendor or technical specification is publicly disclosed.
    relatedQuestionRefs:
    - QE008
    severity: high
    topic: AI harvest prediction platform
    type: private-evidence-only
    whyItMatters: >-
      Without knowing the AI vendor or architecture, it is impossible to assess whether the technology is proprietary and
      defensible, third-party licensable to competitors, or early-stage with material execution risk.
  - diligencePath: >-
      Request supply chain operations data from CFO/CTO; quantify proportion of US and export shipments using RipeLocker;
      confirm logistics integration timeline for drum vs. RipeReefer.
    id: EGE002
    missingEvidence: >-
      The proportion of Fruitist's supply chain currently operating with RipeLocker drum chambers versus conventional cold
      chain as of mid-2026. CEO noted in August 2024 they were "still working through the logistics"; no update has been publicly
      confirmed.
    relatedQuestionRefs:
    - QE010
    severity: high
    topic: RipeLocker commercial deployment scale
    type: private-evidence-only
    whyItMatters: >-
      The postharvest technology moat is theoretical until commercially deployed at scale. Without deployment metrics, it
      is unclear whether the shelf-life advantage is material to the business or still aspirational.
  - diligencePath: >-
      Search USPTO and USDA Plant Variety Protection Office for Fruitist or Agrovision applications; request variety registry
      from management; confirm exclusive or non-exclusive status of licensed breeding program varieties.
    id: EGE003
    missingEvidence: >-
      Full list of Fruitist's proprietary variety names, associated patent filings or USDA Plant Variety Protection (PVP)
      certificate numbers. Only the "Legends" variety name is publicly documented.
    relatedQuestionRefs:
    - QE009
    severity: medium
    topic: Genetics IP and variety protection
    type: private-evidence-only
    whyItMatters: >-
      Without documented IP protection, the genetics moat is difficult to independently assess and could be replicated faster
      than management claims. PVP certificates are publicly searchable once filed.
  - diligencePath: >-
      Request product and technology strategy presentation from management; assess CTO background and prior technical experience
      in agtech or precision agriculture.
    id: EGE004
    missingEvidence: >-
      Jim Trahanas' specific technology priorities, platform investment plan and 2026–2028 roadmap following his appointment
      as Fruitist's first CTO. The appointment has been announced but no roadmap detail is public.
    relatedQuestionRefs:
    - QE013
    severity: medium
    topic: CTO technology roadmap
    type: private-evidence-only
    whyItMatters: >-
      First-ever CTO appointment indicates the tech strategy is still being formalised. Without a roadmap, it is difficult
      to assess whether the AI and RipeLocker integration will deliver the promised "full stack innovation" within a commercially
      relevant timeframe.
  - diligencePath: >-
      Request management accounts with geographic and brand revenue segmentation; obtain China retail sell-through data and
      competitive landscape analysis.
    id: EGE005
    missingEvidence: >-
      Revenue split between the US Fruitist brand and the China Big Skye brand, and by geography (Americas, EMEA, Asia-Pacific).
      No segmented revenue data is publicly available.
    relatedQuestionRefs:
    - QE011
    severity: medium
    topic: Revenue contribution by brand and geography
    type: private-evidence-only
    whyItMatters: >-
      Big Skye China market exposure is opaque. Concentration risk, China-specific margin profile and dependence on the Chinese
      regulatory and consumer environment cannot be assessed.
  - diligencePath: >-
      Technical site visit to Peruvian operations; request capital expenditure breakdown for farm automation; ask management
      to describe specific robotic use cases and ROI evidence.
    id: EGE006
    missingEvidence: >-
      Specific robotic platforms, vendors, deployment scale and automation rates at Fruitist farm and packhouse operations.
