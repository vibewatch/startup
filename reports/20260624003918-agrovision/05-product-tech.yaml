- body: >-
    Fruitist's quality and compliance program spans five domains: food safety certification, varietal labelling integrity,
    labour and sustainability auditing, postharvest quality control and supply chain traceability. Agrovision Peru holds GlobalGAP,
    SMETA (Sedex Members Ethical Trade Audit) and FSMA (Food Safety Modernization Act) certifications covering the Peruvian
    operations. Non-GMO labelling on all Fruitist products is central to the brand's premium and natural retail positioning;
    the selective breeding approach explicitly avoids genetic modification. The end-to-end quality process integrates AI-driven
    berry-by-berry scanning, rigorous pre-cooling within hours of harvest, and an unbroken cold chain from farm to retailer
    distribution centre. A July 2025 FDA Class I recall of 400 boxes of organic frozen blueberries from competitor Alma Pak
    International LLC for Listeria contamination illustrates the industry-wide food safety risk inherent in berry production;
    no such recall has been publicly reported for Fruitist-branded products. Peru's agricultural sector faces elevated labour
    inspection scrutiny from Sunafil (the national labour authority), which identified widespread forced labour risks and
    compliance failures across agriculture in 2025–2026 — a structural risk requiring independent monitoring for all Peru-based
    operators. The trust/quality/compliance table summarises key controls and outstanding verification gaps.
