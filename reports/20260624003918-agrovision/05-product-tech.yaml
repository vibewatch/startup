sections:
- body: >-
    Fruitist's commercial portfolio centres on five revenue-generating product lines sold under the Fruitist brand in the
    US and globally, with a parallel Big Skye brand serving China. Jumbo blueberries are the flagship and largest revenue
    contributor: the berries are two to three times the diameter of a conventional blueberry, bred for exceptional firmness,
    crunch, aroma and extended shelf life through the company's non-GMO selective breeding program. The proprietary "Legends"
    varietal has achieved cult-favourite status at Trader Joe's, Whole Foods, Sprouts and Erewhon. Raspberries and blackberries
    extend the portfolio into softer, more fragile berries where vertical integration and postharvest technology create a
    quality and consistency advantage that fragmented supply chains cannot match. Cherries entered the product mix in December
    2024 via the acquisition of Chilean specialist ZurGroup, adding a high-value stone fruit with a distinct seasonality profile;
    Fruitist began shipping cherries from its Chilean farms in the 2025–2026 season. The newest format innovation is Snack
    Cups, launched in 2025, which packages premium jumbo blueberries into portable 4-ounce grab-and-go cups designed for lunchboxes,
    gym bags and workplace environments. Snack Cups were named winners in Good Housekeeping's 2026 Snack Awards, evaluated
    by over 2,000 taste testers and registered dietitians. All Fruitist products are certified non-GMO and command approximately
    a 50% retail price premium over commodity berry counterparts; a standard 9.8-oz pack retails at $6–$8. The product module
    table enumerates all five product lines with their commercial status, differentiation and key diligence gaps.
