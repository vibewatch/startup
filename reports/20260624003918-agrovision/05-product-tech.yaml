    severity: low
    topic: Robotics deployment specifics
    type: private-evidence-only
    whyItMatters: >-
      Robotics could meaningfully reduce labour cost in the 15,000-worker Peru hub but the extent of actual deployment is
      unknown, making it impossible to model cost reduction potential.
