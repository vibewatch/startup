              Fruitist 2025 年 4 月品牌重塑材料和 FruitNet 称 28 个国家，而 2025 年 10 月 $150M 融资公告材料称 40 个国家。本章按照 CANONICAL.md 使用 28–40
              区间，并假定差异反映 2025 年 4 月至 10 月之间的真实扩张，而非计量口径不一致。
