      - number: '2.3'
        title: 反季供应、秘鲁与全年可得性
        blocks:
          - type: paragraph
            body: >-
              Fruitist 垂直一体化的一项结构性优势，也是高端浆果品类实现全年零售排期的关键，是来自秘鲁的反季供应周期。美国本土蓝莓生产期为 4 月至 9 月，华盛顿、俄勒冈、佐治亚、密歇根、加州等种植州在 5 月至 7
              月出货达到高峰。本土淡季（10 月至 3 月），美国零售商几乎完全依赖进口；到 2026 年初，1 月至 3 月中旬窗口内约 99% 的美国鲜食蓝莓出货量来自进口。

              秘鲁已成为主导供应国。2025 年，美国进口创纪录的 719.8 million pounds 鲜食蓝莓，较 2024 年此前纪录 684 million pounds 增长 5%；其中秘鲁供应 405.9
              million pounds，占进口量 56%。秘鲁沿海产区（La Libertad、Lambayeque、Áncash、Piura）使蓝莓采收高峰落在 10 月至 2 月，正好补足美国本土季。USDA GAIN
              报告（2025 年 6 月）预测，秘鲁 MY2025/26 蓝莓产量将创纪录达到 355,000 metric tons，出口 335,000 MT。2025 日历年，秘鲁最终出口 412,239 MT，价值
              USD 2.563B，二者均为纪录水平，出口量同比增长 17%。

              这一供应结构演进很快。秘鲁在 2019 年超过智利，成为美国最大蓝莓供应国，并在 2021 年超过墨西哥。自 2016 年以来，增长轨迹年均约 30%，由田间扩张（每年新增约 7,400 acres，当前约
              62,000 acres 投产）和显著品种创新支撑——Sekoya Pop、Mágica 等新一代品种已约占种植面积的 60%。Chancay Port 投运后，把通往亚洲的运输时间缩短 10
              天，推动秘鲁出口快速转向中国；2025 年中国从秘鲁进口额增长逾一倍。秘鲁现已出口至 66 个不同全球市场（2024 年为 52 个）。

              Fruitist 在秘鲁 2,100+
              公顷基地，是这条供应链的核心运营锚点，让公司直接掌握反季采收窗口。如今美国销售的所有鲜食蓝莓中有三分之二来自进口；对任何全年运营的高端浆果品牌而言，进口供应可靠性都是战略必需。
