      - number: '7.5'
        title: 劳工、治理与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Agrovision 在秘鲁最多雇用 15,000 名田间工人，其中约 60% 为女性——公司把这一劳动力数据用于展示社会影响力。但秘鲁农业劳工历史带来实质性风险：2020 年 12
              月，秘鲁国会在农业工人广泛抗议后废止 Agrarian Promotion Law（Law
              27360）；抗议者包括蓝莓采摘工，他们封锁公路，要求提高工资和改善工作条件。修订后的劳工框架提高了最低工资并强化保护，但 Agrovision 具体劳工合规和工作条件的独立审计并未公开，形成 ESG
              尽调缺口。秘鲁农业工资通胀和更严格的劳工标准执法，可能显著推高 Agrovision 运营成本。治理方面，公司由创始人 Steve Magami 领导；他 2012 年共同创立公司，现仍任董事长兼
              CEO。作为私营公司，董事会组成、委员会结构和正式接班计划均未披露。Bloomberg 2025 年 1 月关于潜在 IPO 的报道——管理层拒绝确认——凸显不透明风险。2025 年公司新增两名董事（Thomas
              Seifert、June Yang）和一名新 CFO（Rich Sullivan），但 PE 支持的私营公司治理基础设施，未必达到 IPO 推进时所需的审查标准。来自 Driscoll's 的竞争风险——其控制约
              33% 美国浆果市场，在美国零售食品饮料品牌中排名第 2，2024 年增长 12%，并于 2025 年任命首任 CMO 推动全球扩张——给 Agrovision 的市场份额目标设下长期天花板。合作伙伴 /
              依赖登记册（TR003）和人员 / 执行登记册（TR004）提供结构化细节。依赖图（FR003）展示单点暴露节点。
