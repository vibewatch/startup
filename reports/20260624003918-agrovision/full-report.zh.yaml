      - number: '6.3'
        title: 体育赞助与品牌大使合作
        blocks:
          - type: paragraph
            body: >-
              Fruitist 的品牌打法，是用体育和文化合作把消费者认知从「农产品」推向「功能零食」。公司 2024 年 2 月确认，已与 D.C. United 签下多年合作；这支华盛顿特区的 Major League
              Soccer 球队让 Fruitist 成为官方且独家的袖标合作伙伴，Logo 出现在 D.C. United 主客场球衣右袖。该协议还让 Fruitist 成为球队、D.C. United Summer
              Camps 和 D.C. United Youth Soccer Programs 的官方零食。D.C. United 运营总裁 Danita Johnson
              表示：「把健康与福祉放到社区前台，是俱乐部的重要优先事项；与 The Fruitist 的合作将帮助我们更好服务球队以及 D.C. United Summer Camps 的青少年。」这项合作带来 Audi
              Field（俱乐部位于华盛顿特区、可容纳 20,000 人的球场）全场品牌露出、社交与数字媒体权益，以及主场比赛中的高端客户答谢权益。2025 年，Fruitist 又加入两个更高曝光度的体育合作：NFL 四分卫
              Caleb Williams——Chicago Bears 2024 年状元秀——以投资人兼品牌大使身份加入；Fruitist 也成为 USC Athletics（University of Southern
              California）的官方超级水果零食，把品牌接到大学体育粉丝和洛杉矶市场。CEO Magami 这样描述这一组合：「这些合作，加上 Fruitist 不断增长的 DTC
              平台，体现了公司在消费者所在之处触达消费者的策略——从体育场到线上店铺——并强化其作为健康、功能驱动零食领导者的定位。」赞助有双重商业作用：第一，直接触达注重健康的球迷和学生运动员；第二，沉淀品牌资产，支撑高端定价的韧性。fruitist.com
              首页确认：「Fruitist is the Official Superfruit Snack of USC Athletics and D.C. United!」这些合作尚未公开正式 ROI
              指标、粉丝认知提升数据，或从合作曝光到零售转化的归因数据，这是尽调缺口。
