      - number: '2.4'
        title: 需求驱动：健康零食顺风与 GLP-1 影响
        blocks:
          - type: paragraph
            body: >-
              高端鲜食浆果的结构性需求环境由两股相互强化的超级趋势支撑：长期转向健康零食，以及新出现的 GLP-1 药物顺风，它正可衡量地把消费者食品购买转向新鲜农产品。

              Mordor Intelligence 和 Dimension Market Research 均估计，2026 年全球健康零食市场规模为 USD 117.9B，到 2031-2035 年 CAGR 为
              6.5-6.8%。仅美国健康零食市场 2026 年预计为 USD 39.5B。水果、坚果和种子零食在健康零食品类中占最大份额（Mordor 口径 2025 年 33.71%），有机和 free-from
              产品增长最快，CAGR 为 8.11%。这构成 Fruitist 定位的宏观背景：新鲜、高端、天然健康的浆果，直接争夺与包装健康零食品牌相同的消费零食场景。

              GLP-1 药物顺风带来更新、更强的变量。截至 2024 年中，美国超过 16% 的家庭至少有一名 GLP-1 用户；Roland Berger 预计，随着价格下降和口服制剂获批，全球用户将在五年内从约 40
              million 增至约 120 million。对浆果品类最关键的发现是：GLP-1 用户并不会均匀减少所有食品品类。Cornell University / Numerator 的 2025
              年同行评审研究发现，至少一名 GLP-1 用户的家庭在六个月内把总杂货支出削减
              5.3%，最大降幅出现在咸味零食（-10%）、甜烘焙（-9%）和软饮（-7%）；但鲜果支出上升，酸奶、营养棒和肉类零食也上升。Circana 分析发现，在开始 GLP-1 治疗前，试图降低 BMI
              的人购买农产品的可能性仅比平均水平高 3%；治疗第一年结束时，这一数字接近 5%。UC Davis 食品研究引用数据称，GLP-1 用户摄入的水果和蔬菜较治疗前基线高 55%。

              这些动态共同支撑高端、便利、零食化浆果形态的持续需求增长——这正是 Fruitist 以巨型蓝莓和 Snack Cups 占据的细分。按 Fruitist 自身口径，高端浆果品类在 2019 至 2024 年
              CAGR 为 22%，相比之下整体鲜食浆果市场约增长 4-5%；这说明投资论点由一个增长品类内部的份额提升支撑。美国人均蓝莓消费在二十年间增长近十倍——从 2000 年 0.26 lbs 增至 2021 年
              2.54 lbs——预计仍会继续增长。
