      - number: '1.5'
        title: 里程碑时间线与不利核查
        blocks:
          - type: paragraph
            body: >-
              Fruitist 的里程碑横跨十余年，从 2012 年洛杉矶创立走到潜在 IPO 窗口。Steve Magami 约在 2012
              年于秘鲁北部海岸考察生物燃料原料时构思出公司，并看到当地出色的种植条件。首批蓝莓约在 2015 年于秘鲁种下，早期运营即投入选择育种（非转基因）、数据分析和田间冷藏。Fruitist 消费品牌于 2020
              年推出，进入美国主要零售连锁。2024 年，公司通过三项重大融资提速：3 月由 Aliment Capital 领投的未披露金额融资、8 月以 $1B+ 估值完成 $100M 股权轮，以及 11 月 $400M
              信贷额度。2024 年 12 月收购 ZurGroup 樱桃业务，扩大产品品类。2025 年 4 月，公司更名为 Fruitist Holdings Inc.，标志消费品牌与公司身份对齐。2025 年 6 月入选
              CNBC Disruptor 50，并于 9 月扩充领导团队后，公司在 2025 年 10 月又从 J.P. Morgan Asset Management 获得
              $150M。不利和反向核查相当重要：Bloomberg（2024 年 8 月）报道，Agrovision 当时以私营公司身份为由，拒绝公布具体销售数字。公司面临进口关税敞口（多数来源市场约 10%；印度约
              26%），尽管管理层称地理多元化使影响“很小”。截至 2026 年 6 月，公开监管数据库未记录涉及 Fruitist 产品的 FDA 召回或重大食品安全事件。最大的竞争威胁是
              Driscoll's；它占据浆果市场主导份额，并在 2024 年录得 12% 销售增长。Bloomberg 的报道也给出农业科技行业风险背景：上一轮投资热潮中，AeroFarms 和 AppHarvest
              等公司进入 Chapter 11，令人有理由质疑资本密集型鲜食农产品企业的长期经济性。
