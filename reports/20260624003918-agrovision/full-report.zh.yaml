    approximationNotes: 区间由公开可比倍数应用于 $350M–$500M 收入区间构建。未使用 Fruitist 内部财务数据。基于 PremierAlts 二级市场数据和多轮融资披露，当前私人市场标记约为 $1B。
    data:
      items:
        - label: 熊市（按大宗商品重估）
          low: 140
          high: 240
        - label: 基准（高端食品品牌）
          low: 800
          high: 1100
        - label: 牛市（零食平台）
          low: 1500
          high: 2500
        - label: 当前私人市场标记
          low: 1000
          high: 1000
