  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、增长轨迹与背景
        blocks:
          - type: paragraph
            body: >-
              Fruitist 几乎全部收入来自向零售商直接销售新鲜高端浆果，核心是超大蓝莓，覆盖北美 12,500 多家门店和 40 个国家的零售商；西方市场使用 Fruitist 消费品牌，中国使用平行品牌 Big
              Skye。 收入机制是传统农产品销售模式：公司在自有和租赁农场种植、采收、包装并发货，直接交给零售合作伙伴，不经过批发分销中介；基因差异化、全年供应和稳定质量支撑高端定价，价格约高于大宗浆果 50%。 2025
              年推出的 Fruitist Snack Cup 单人份形式，是一个仍处早期的相邻收入流，按克计价更高，不过截至 2025 年 10 月，公司称其仅占总销售的小部分。

              放在任何农产品行业标准下，Fruitist 的增长轨迹都很突出。 公司披露 2019 年收入约 $65.8M，到 2022 年增至 $210.4M，三年增长 220%；随后在 2024 年 8 月初达到
              $300M，按 LA Business Journal 口径 2024 年全年约 $350M，并截至 2025 年 4 月以过去 12 个月（LTM）口径超过 $400M。 仅超大蓝莓销售额就在 2025 年 4
              月前的 12 个月内增长至三倍。 公司指出，FY2024 约 $350M 收入约占整体高端浆果市场 20%，意味着其在一个高增长子品类中拥有可观份额；该子品类 2019 至 2024 年 CAGR 为 22%。
              蓝莓主导收入；黑莓、覆盆子和樱桃（后者来自 2024 年末收购 ZurGroup）被定位为从小基数扩张的战略增长领域。

              公司没有公开披露前瞻收入指引、按渠道拆分收入或按地域拆分收入。 公司按自然年作为财政年度，但不发布中期或分部业绩。 新鲜农产品模式不适用经常性收入（订阅、合同）；所有收入都来自货架层面的交易性售出。
