      - number: '7.6'
        title: 财务、资本密集度与终止标准
        blocks:
          - type: paragraph
            body: >-
              Agrovision 于 2024 年 11 月完成 $400M 优先担保信贷额度，包括 $230M 五年期贷款和 $150M 三年期循环信贷，由 Rabobank 和 Banco Santander
              安排，Goldman Sachs、Barclays、Scotiabank、BBVA 等参与。这笔融资再融资了此前 $210M 的额度，也显著提高了一家 FY2024 收入约 $350M
              私营公司的财务杠杆。自成立以来投入的总资本超过 $550M。债务 / 收入比约
              1.1x；若收入低于预测或浆果价格下跌，将带来实质性契约和再融资风险。三股结构性压力可能同时压缩收入：关税驱动的市场转向、气候驱动的产量短缺，以及 Driscoll's 的竞争性定价压力。循环信贷 2027
              年到期，定期贷款 2029 年到期，形成一个与预期 IPO 时间相重合的再融资窗口——若 IPO 市场关闭或公司表现不及预期，按可接受条款再融资可能很难。私营公司不透明意味着没有公开 P&L
              或债务契约条款，无法独立验证公司财务健康状况。风险传导图（FR002）展示六条风险向量如何传导至收入、利润率、信用和估值结果。终止标准表（TR005）设定七个可监测的破题事件触发器，并锚定可观察先行指标，使投资者监测能主动而不是被动。
