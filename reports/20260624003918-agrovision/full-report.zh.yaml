      - number: '4.6'
        title: 财务披露缺口、证据缺口与结论
        blocks:
          - type: paragraph
            body: >-
              作为私营公司，Fruitist 尚未披露经审计财务报表、中期业绩或任何核心利润表指标。 尽调最关键的缺口包括：（1）毛利率百分比——这是承销高端定价逻辑的核心；（2）EBITDA
              和经营现金流——用于判断业务能否自我供血，还是需要持续外部融资；（3）现金余额和流动性位置——用于评估短期偿债能力和 runway；（4）债务 covenant 和利率条款——考虑到 $400M+
              未偿信贷，这一点很关键；（5）按地域和产品拆分的收入——用于判断集中度风险和增长质量。

              正面财务结论来自：（a）自 2012 年从零起步做到 $400M+ LTM 收入，且高端定价仍在；（b）J.P. Morgan AM、Ray Dalio 家族办公室和 Aliment Capital
              的强机构投资人背书；（c）由包括 Goldman Sachs 和 Barclays 在内的九家全球银行支持的 $400M 信贷额度；（d）CEO 明确表示需求超过供应，意味着瓶颈在 capex /
              产能，而不是市场需求。 担忧集中在：（a）累计资本投入 $550M+，对比 $400M 收入——公司部署资本已经超过迄今赚到的收入；（b）薄利农业业务中 $400M
              信贷额度带来的债务服务负担；（c）盈利能力未披露，而 Hortifrut 等同行在 $1.2B 收入规模下仍出现净亏损；（d）衰退场景下消费者价格敏感风险。

              财务结论：收入质量强（直连零售、高端品牌化、已显示重复消费行为）。 资本结构对农业业务而言偏激进。 任何投资决策前，尽调必须拿到管理账（至少 3 年）、经审计财务、EBITDA bridge 和完整信贷协议条款。
              本章最大的承销障碍，就是这些数据缺失。
