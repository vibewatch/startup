  - id: FU001
    title: Fruitist 消费者旅程图——从发现到复购
    type: journey-map
    layout: standard
    summary: 展示消费者从第一次接触 Fruitist 品牌，到成为忠诚复购者所经历的阶段，并标出每一步里垂直整合的回报和品牌触点。
    data:
      items:
        - label: 问题意识
          detail: 消费者遇到「莓果轮盘赌」：大宗品牌品质不稳定，果子发软或味淡。GLP-1 用户寻找营养密度高的零食。健康零食趋势让消费者更注意农产品替代选择。
          tone: neutral
        - label: 零售发现
          detail: >-
            消费者第一次在 Costco、Whole Foods、Trader Joe's、Walmart、Sprouts 或 Publix
            看到产品，通常位于醒目的端架或专属陈列区。超大颗粒和高端包装，让它在普通盒装莓果旁边更显眼。
          tone: positive
        - label: 首次购买（试吃）
          detail: 消费者为一盒支付约 $6，而大宗产品约 $4；试吃阶段吸收约 50% 溢价。具名消费者评价称「甚至没注意到价格溢价」。尺寸和硬度传递品质信号。
          tone: positive
        - label: 食用与品质验证
          detail: 清脆爆汁、质地紧实、甜度稳定，验证品牌承诺。RipeLocker 真空舱把货架期延长 3×，减少家庭损耗。消费者确认「莓果轮盘赌」已被解决。
          tone: positive
        - label: 复购
          detail: CEO 提到复购行为强劲；「消费者信任 Fruitist 品牌」。GLP-1 用户随时间增加购买。零售商扫描数据表明，Fruitist 入驻带来可衡量的提升。
          tone: positive
        - label: 品牌社区与倡导
          detail: D.C. United、Caleb Williams、USC Athletics 的曝光强化健康零食身份。社交媒体互动和体育合作推动口碑。Snack Cups 形态把消费场景从家庭延伸出去。
          tone: positive
        - label: 品类扩张循环
          detail: Fruitist 扩充 SKU 后，消费者把黑莓、树莓、樱桃也加入购物篮。多地区供应链保证全年可得，维持消费习惯。国际消费者通过 Whole Foods UK 或 Carrefour Spain 接触品牌。
          tone: positive
    approximationNotes: 旅程图为示意，综合了 CEO 访谈、具名客户评价、投资人公告和消费者行为研究。Fruitist 未披露各阶段转化率和停留时间。
