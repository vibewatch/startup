      - number: '7.4'
        title: 食品安全与召回风险
        blocks:
          - type: paragraph
            body: >-
              新鲜和冷冻浆果是美国 FDA 优先级最高的食品安全风险载体之一。2025 年 1 月，FDA
              发布新的品类专项预防策略，针对新鲜和冷冻浆果中的肠道病毒（甲肝、诺如病毒）污染，这是该品类首个定向策略。该策略的背景，是进口浆果曾多次与疫情相关：FDA 2022 年 5
              月调查了一起多州甲肝疫情，关联来自墨西哥的进口有机草莓（18 例）；CDC 2023 年调查了一起关联冷冻草莓疫情（10 例，40% 住院）。更近的 2026 年 2 月，FDA 对 Oregon Potato
              Company / Willamette Valley Fruit Company 的 55,689 磅冷冻蓝莓发布 I 级召回——最严重分类——原因是 Listeria monocytogenes
              污染。这些事件合起来说明，浆果供应链存在内生召回风险。若召回与 Fruitist 或 Agrovision 品牌产品相关，将立即威胁其与 Costco、Walmart、Whole Foods
              及其他高端零售账户的关系。FSMA Produce Safety Rule 要求大型农场自 2025 年 4 月起遵守采前农业用水合规要求；FDA 在 FY2019–2023 年抽检 1,558
              批冷冻浆果，虽仅在少数批次中检出 HAV 或诺如病毒，但对不合规企业发出 180 天进口警示或完整 Import Alert 99-35 列名。Agrovision
              具体食品安全认证状态——GlobalGAP、Fair Trade、SCS 审计——未公开披露，构成尽调缺口。公司在秘鲁最多动用 15,000
              名田间工人、依赖手工采摘的模式，带来与此前疫情发生条件相似的卫生接触面风险。
            claimRefs:
              - CR019
