      - number: '5.7'
        title: 证据
        blocks:
          - type: callout
            title: RipeLocker 合作将货架期延至三倍，并打开海运空间
            body: >-
              2024 年 6 月的 RipeLocker 合作，为 Fruitist 带来采后技术优势；碎片化种植包装竞争者若没有可比规模协议，很难复制。 将货架期延长到 8–12
              周，使水果可以用海运到达中国、印度和欧洲，成本约 $0.50/kg，而空运约 $3–4/kg，显著降低最赚钱远距离市场路线的物流成本。 它也让此前因采后窗口太短而无法商业化的精致高风味品种得以落地。
            calloutType: strength
            claimRefs:
              - CE017
              - CE018
              - CE019
              - CE023
              - CE024
          - type: callout
            title: RipeLocker 单一供应商依赖与 RipeReefer 原型风险
            body: >-
              Fruitist 没有公开披露替代采后技术伙伴。 RipeLocker 仍是一家初创公司（迄今为天使轮融资），而要将每 kg 货运成本减半所需的集装箱级 RipeReefer，截至 2026 年初仍处于
              20-foot 原型阶段，商业试验目标为 2026 年末或 2027 年初。 RipeReefer 推出任何延迟，或 RipeLocker 合作任何中断，都会让 Fruitist
              回到传统冷链经济性，并抹掉海运物流利润率优势。
            calloutType: risk
            claimRefs:
              - CE017
              - CE025
          - type: callout
            title: 秘鲁枢纽集中度与 El Niño 气候暴露
            body: >-
              秘鲁 Olmos/Lambayeque 枢纽提供 2,100+ 公顷土地，并贡献 Fruitist 美国出口量约 50%。 秘鲁 Coastal El Niño 警报已延长至 2026 年 11
              月，预计北部海岸降雨高于平均、温度最高较正常水平高 +3°C；这正是 Fruitist 主要业务所在区域。 2017 年和 2023–2024 年的 El Niño 事件曾扰乱道路连接并延误出口发货。
              如今销量更大、零售项目更复杂，任何 El Niño 扰动都会带来更大的收入和零售商关系影响。
            calloutType: risk
            claimRefs:
              - CE033
              - CE037
          - type: callout
            title: 要求 CTO 技术路线图和 RipeLocker 部署数据
            body: >-
              任何投资决策前，应完成两项高优先级尽调动作：（1）向新任 CTO Jim Trahanas 索取具体 AI 平台架构、供应商关系和 2026–2028 技术路线图；（2）获取量化数据，说明 Fruitist
              供应链目前有多大比例使用 RipeLocker 桶式舱体，多少仍采用传统冷链，并确认 RipeReefer 集装箱的商业发布时间表。 这两个数据点对验证技术护城河和海运物流利润率改善至关重要。
            calloutType: recommendation
            claimRefs:
              - CE025
              - CE030
          - type: callout
            title: Snack Cups 标志公司从农产品走向 CPG 品牌
            body: >-
              Snack Cups 上市并获得 Good Housekeeping 2026 Snack Award，说明 Fruitist 正在从高端农产品供应商转向 CPG 零食品牌。 这与新的资深 CPG 领导团队（来自
              Nestlé、McKinsey、The Wonderful Company）以及 Caleb Williams NFL 合作相一致。 如果成功，CPG
              定位会打开估值倍数更高的品类，但也引入纯农产品供应中不存在的品牌管理复杂度和执行风险。
            calloutType: insight
            claimRefs:
              - CE004
              - CE005
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 北美零售分销网络
        blocks:
          - type: paragraph
            body: >-
              Fruitist 最重要的商业证明，是其在北美高端零售渠道中的铺货广度。 截至 2025–2026 年，公司产品进入北美大陆 12,500 多个零售点；这一数字由公司、CNBC、Produce Market
              Guide，以及 Blue Book Services 对 2025 年 10 月融资公告的报道共同确认。 该数字覆盖完整业态：Costco 和 Walmart 等大型综合卖场，Whole Foods
              Market 和 Sprouts 等高端天然食品门店，Publix、Giant、Wakefern、ShopRite、Albertsons 等传统超市连锁，以及专业独立门店和 Trader Joe's。
              零售商覆盖广度具有战略意义，因为它证明 Fruitist 能同时跨不同价值层级运营：Costco 客群偏向会员仓储大包装性价比，Whole Foods 和 Sprouts 客群则在高端健康付费意愿上更高。 LA
              Business Journal 确认，Fruitist 超大蓝莓上架后，零售商「立刻看到了价值」，公司以质量差异化而不是价格平价竞争。 同一文章引用 The Packer 贸易刊物调查称，43–53%
              购物者（按年龄组不同）在过去 12 个月购买过超大蓝莓，说明该品类已进入主流认知。 联合创始人兼 CEO Steve Magami 表示，Fruitist 正在「带来客流」，且零售商因 Fruitist
              上架而「每平方英寸货架赚到更多钱」；这是一个不常见的强主张，若能在零售商访谈中得到证实，意味着该品牌不是普通替代 SKU，而是品类增长驱动器。 新鲜农产品库存周转极快——Driscoll's CEO
              提到浆果一年大约周转 300 次，几乎没有常备库存——这进一步说明，稳定供应质量为什么能拿到高端货架位置。 Snack Cups（单人份新鲜蓝莓包）2025 年 4 月先在西班牙 30 家门店推出，到 2025
              年 10 月扩至 750+ 家门店，预计超过 1,000 家西班牙门店；该形式也在引入美国零售伙伴。 Albertsons 与 Costco、Trader Joe's、Walmart 和 Whole Foods
              一同在 LA Business Journal 文章中被确认，进一步把 Fruitist 延伸到传统超市板块，覆盖按门店数计最大的美国杂货横幅。
