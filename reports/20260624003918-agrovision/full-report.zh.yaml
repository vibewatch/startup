      - number: '6.4'
        title: 国际零售扩张——中国、英国、欧洲及其他市场
        blocks:
          - type: paragraph
            body: >-
              北美之外，Fruitist 披露分销覆盖 28–40 个国家（口径不一：$150M 融资材料称 40 个国家，2025 年 4 月品牌重塑材料称 28
              个国家——这是需要澄清的证据缺口）。国际市场包括中国、印度、英国、欧洲、中东和东南亚。在中国，公司历史上使用 Big Skye 品牌，但 CEO Magami 确认，从 2025
              年起，来自秘鲁、智利和中国本土的全部蓝莓都将以 Fruitist（美益粒）品牌销售。Fruitist 位于云南省 80 英亩农场的首个商业化蓝莓收成出现在 2024 年，后续年份预计产量更大。公司 2024 年
              12 月收购智利樱桃专家 ZurGroup，以便直接向中国出口樱桃和蓝莓。中国樱桃生产预计将在未来一年内导入北美及其他市场。在东南亚，Fruitist
              正在印度尼西亚、马来西亚、菲律宾和泰国推进蓝莓试种，借助可在热带高地生长的低需冷量新品种。英国方面，Fruitist GoBerry——一款可即食的新鲜蓝莓零食系列，采用纸基包装，面向随手食用场景——于 2026
              年 1 月 28 日在 Whole Foods Market UK 独家首发，并在 Kensington High Street 门店获得醒目的旗舰橱窗展示。公司计划 2026
              年继续扩大英国零售覆盖。Fruitist 业务发展总监 Pascal Orphal 表示：「英国消费者越来越需要适合忙碌、移动生活方式的健康零食选择。Whole Foods Market
              以支持重质量、重创新的品牌而闻名，是引入 Fruitist GoBerry 的理想零售伙伴。」在西班牙，Snack Cup 规格从 2025 年 4 月的 30 家门店增至 2025 年 10 月的 750+
              家门店，Carrefour 等零售商已有铺货。全球层面，Perishable News 和 Fruitist 确认，公司服务于「亚洲、中东、欧洲和英国的多家领先超市、会员店及高端独立零售商」。印度拥有土地资产（约
              20 公顷蓝莓），同时服务本地门店和出口市场，但具名的印度零售合作伙伴尚未公开披露。
            claimRefs:
              - CU004
              - CU006
              - CU007
              - CU008
              - CU039
      - number: '6.5'
        title: 渠道经济性、留存信号与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Fruitist
              的渠道经济性围绕三层零售体系搭建：传统杂货（Publix、Albertsons、Giant、Wakefern、ShopRite）、大众市场（Walmart、Costco）和高端天然渠道（Whole
              Foods、Trader Joe's、Sprouts、Erewhon）。公司没有公开披露正式的净收入留存（NRR）、总收入留存（GRR）、流失率、合同期限或续约指标。公司主要给出的留存证据，是 CEO
              Magami 所称的「强劲复购行为」，以及 Fruitist 因「消费者信任 Fruitist 品牌每次都能交付稳定的高端体验」而「累计终身销售额已超过 $1B」。公司关于每个 SKU
              带来独特增量增长的说法——即 Fruitist 创造了新的浆果购买，而不是在货架份额中相互挪移——商业上很有吸引力，但截至研究日期缺乏独立验证。从集中度风险看，公司未公开披露任何单一零售商的收入占比。Costco
              通常被视为北美高端农产品最高量的渠道，因此 Costco 可能占 Fruitist 销量的非对称大份额；但现有证据无法量化。竞争格局也给扩张带来阻力：占主导地位的品牌浆果玩家 Driscoll's 已控制约
              $700M 超高端浆果细分市场中的约 $400M（据 Driscoll's CEO Bjorn 2025 年 6 月在 Wall Street Journal Global Food Forum 的发言）。The
              Packer 编辑总监指出，「市场显然足够大，能够容纳我们在 jumbo berry 市场看到的几家中小型公司之间的竞争」，说明 Fall Creek Farm & Nursery 的 Sekoya
              等新进入品牌也在争夺 jumbo blueberry 货架位置。Renaissance Capital 的 Matthew Kennedy 在 CNBC 2025 年 10
              月报道中警告：「公司往往在增长趋势看起来最乐观时上市，所以投资者最大的风险，是这种增长不可持续——要么因为它只是风潮，要么因为最初非常投入的客户群无法转化到更广泛的市场。」这一担忧可直接套用于 Fruitist
              的增长轨迹，也凸显了尽调复购队列数据，以及初始健康导向消费群之外品类穿透能力的必要性。
            claimRefs:
              - CU027
              - CU028
              - CU029
              - CU030
              - CU032
              - CU033
              - CU040
