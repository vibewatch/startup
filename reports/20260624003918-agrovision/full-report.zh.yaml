        - 公司声明；AgFunderNews；Bank Street Journal
        - 同比增长降至 15% 以下，或 TAM 饱和
      - - 资本质量验证
        - J.P. Morgan AM、Ray Dalio、Goldman Sachs 顾问；SEC 级机构尽调
        - CNBC 2025 年 10 月；LABizJ $150M 文章；Yahoo Finance CFO 文章
