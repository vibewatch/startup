      - number: '8.2'
        title: 上市可比公司与行业倍数
        blocks:
          - type: paragraph
            body: >-
              Fruitist 的上市可比公司横跨从普通商品农业生产商到高端品牌食品公司的一系列谱系，没有一家是完美类比。Dole（NYSE: DOLE）作为垂直整合全球农产品分销商，是结构上最接近的同业；截至 2026 年
              6 月，其企业价值约 $2.4B，过去十二个月收入约 $9.4B（EV/Revenue ~0.25x），EV/EBITDA 约 5.9x。Fresh Del Monte（NYSE: FDP）企业价值约
              $1.89B，收入 $4.2B（EV/Revenue ~0.45x，P/S ~0.31x）。两家公司受益于庞大规模经济，但因普通商品利润率低、资本密集度高和易腐约束，交易倍数长期受压。

              Hortifrut 是智利上市浆果专家，收入接近 $1B、企业价值接近 $1.5B（EV/Revenue ~1.3x），在产品组合上提供最直接类比；但该公司最近财年也报告 EBITDA 为负、净亏损约
              $78M。Hortifrut 案例揭示一个关键风险：缺少品牌差异化或利润率保护的纯浆果生产商，即便规模化也可能不盈利。Mission Produce（NASDAQ: AVO）聚焦牛油果、垂直整合，交易约为
              0.98x EV/Sales 和 13.1x EV/EBITDA；Calavo Growers（NASDAQ: CVGW）在待定 M&A 活动下，以较小收入基础对应约 14.4x
              EV/EBITDA。高端品牌食品公司 Vital Farms（NASDAQ: VITL）是在新鲜食品中最接近的品牌溢价类比——2025 年初约 2x EV/Revenue，但到 2026
              年中，在消费必需品板块倍数收缩后压缩至约 0.59x。

              Argo Advisory 研究指出，食品行业 EV/EBITDA 倍数在 2021 至 2025 年间从 12.6x 降至 10.1x——压缩 20%；同期饮料行业倍数压缩 36%。NYU Stern 2026
              年 1 月数据集显示，食品加工行业 EV/Sales 中位数约 1.47x，税前营业利润率为 7.09%。水果与蔬菜子行业处于倍数分布底部，原因是结构性易腐、定价权低、品牌杠杆有限。Fruitist
              若要作为上市公司维持 2.5–3x EV/Revenue 倍数，就必须持续证明其高端品牌与普通商品同业拉开距离——2021 年后重新定价，以及 Vital Farms 尽管定位高端却倍数恶化，使这项任务更难。
