  - id: TV005
    title: 论点破坏项与否决触发器
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - IPO 盈利披露低于预期
        - S-1 中毛利率 < 15% 或 EBITDA 利润率 < 8%
        - 摧毁高端倍数论点；重估至大宗区间（0.3–0.5x EV/Rev）
        - 退出观察名单；不参与 IPO
      - - 降价轮或估值下调
        - 二级市场交易低于 $800M EV
        - 发出机构信心流失信号；触发进一步减记
        - 重新评估论点；只有在确认底价后才定仓
      - - 增长放缓
        - 连续两个期间收入 YoY 增长 < 15%
        - 拿掉 2x EV/Revenue 以上高端倍数的核心理由
        - 下调确信度；转为继续研究
      - - Peru / Morocco 关税升级
        - 美国对 Peru 进口关税超过 20%，或 Morocco 超过 15%
        - 农场经济性被打乱；利润率压缩且可能供应短缺
        - 重新评估成本结构；持有观望
      - - 食品安全或作物失败事件
        - 影响 >5% 零售门店的重大召回，或 >10% 收入扰动
        - 品牌信任受损；消费者支付溢价意愿面临风险
        - 暂停；品牌恢复得到证明前不投资
    notes: 触发器代表会把建议从跟踪实质性改为卖出或退出的尽调关键事件。阈值为指示性，基于可公开观察的信号。
    claimRefs:
      - CV031
      - CV032
      - CV039
      - CV027
  - id: TV006
    title: 最终尽调要求
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - EBITDA 与利润率披露
        - 未公开披露毛利率、EBITDA 或净利润数据
        - 不确认利润率溢价，就无法验证 2–3x EV/Revenue 倍数
        - 在资料室要求提供；等待 S-1 递交
      - - 股权结构和清算优先权
        - 多轮股权融资合计 $443M；优先权堆栈未知
        - 高优先权悬置可能显著压低 IPO 时普通股价值
        - 法律审阅股东协议；搭建股权结构瀑布模型
      - - FY2024–2026 收入桥
        - 公开只披露 FY2024 $350M 和 LTM（2025 年 4 月）$400M+
        - 远期估值取决于 2025 年后能否维持 15–25% 增长
        - 管理层指引；资料室财务
      - - 樱桃 / 多浆果扩张盈利能力
        - 新浆果线和 ZurGroup（樱桃）整合利润率未披露
        - 若蓝莓毛利率最高，品类扩张可能摊薄利润率
        - 资料室中按分部披露的 P&L
      - - 信贷额度契约和契约合规
        - $400M 信贷额度条款、契约和合规状态未知
        - 可能限制分红或 IPO 分配；存在契约违约风险
        - ABF Journal 贷款条款；要求契约文件
    notes: 优先级：EBITDA 披露是最重要的单一输入；没有它，估值分析只能停留在收入倍数。
