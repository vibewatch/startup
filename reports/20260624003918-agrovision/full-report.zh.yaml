companyProfile:
  summary: >-
    Agrovision Corp. 于 2025 年 4 月更名为 Fruitist Holdings Inc.，是一家总部位于洛杉矶的全球垂直一体化浆果公司，由 Steve Magami 和 Thomas Snyder 于 2012
    年创立。公司以 Fruitist（中国市场为 Big Skye）作为消费品牌，在约十个微气候区域种植、包装、冷藏、运输并营销高端“零食化”巨型蓝莓、覆盆子、黑莓和樱桃，核心是秘鲁约 2,100 公顷基地。公司在 2024 年 8
    月股权轮达到 $1B+ 估值，截至 2025 年 4 月的过去 12 个月销售额超过 $400M，并向北美 12,500 多个零售门店供货（Costco、Walmart、Whole Foods、Trader Joe's、Publix
    等），覆盖约 40 个国家。公司已筹集约 $443M 股权融资，另有 $400M 信贷额度；其垂直一体化和自有种质被包装成解决“浆果 roulette”品质不稳定的解法，并支撑估计约 50% 的价格溢价。
  foundedDate: '2012-01-01'
  founders:
