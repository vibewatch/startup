  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、范围与替代品
        blocks:
          - type: paragraph
            body: >-
              Fruitist（母公司：Agrovision）的相关市场，是全球高端鲜食浆果品类——以垂直一体化、全年供应的方式，把品牌化、差异化浆果卖给零售端，其次通过餐饮服务和出口渠道销售。产品边界包括鲜食蓝莓（巨型 /
              大果径品牌化）、鲜食覆盆子、鲜食黑莓和鲜食樱桃（通过 ZurGroup 加入）。核心边界不包括冷冻浆果（供应链和买方结构都不同）、干制 /
              加工浆果原料、浆果饮料和营养保健品，以及不带品牌溢价的大宗散装浆果。这些相邻品类对应不同买方流程和利润结构，目前不属于 Fruitist 的上市路径。

              替代 Fruitist 高端定位的现状方案，是大宗浆果项目：零售商从秘鲁、墨西哥或智利采购通用蓝莓，以自有品牌或无品牌散装形式销售，价格通常大幅低于 Fruitist 相对大宗产品约 50%
              的溢价。第二类替代品是更广义的零食品类——薯片、饼干、糖果和蛋白棒——它们争夺同一零食场景和货架预算。第三类替代品是其他农产品品牌推出的鲜切水果和蔬菜零食包。

              具备潜在空白的相邻市场包括：（1）有机浆果包装，有机蓝莓已占美国进口的 15% 且仍在增长；（2）增值零食形态，例如 Fruitist 近期推出的 Snack
              Cups；（3）用于营养保健品和食品制造的功能性原料（冻干、浓缩蓝莓粉）；（4）中国、英国、欧洲和中东的国际高端零售通道。Fruitist 引用的全球零食市场总规模约为 USD
              600B，但这是一个高度异质的可服务空间；尽调口径下，相关 TAM 的上限应是全球鲜食浆果市场。
