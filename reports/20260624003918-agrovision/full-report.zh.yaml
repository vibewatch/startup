  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              全球鲜食浆果行业围绕少数主导品牌和种植网络展开竞争，核心是两条战略轴线：垂直一体化深度和自有种质控制。顶端是 Driscoll's，按消费品牌计为全球最大鲜食浆果公司；根据 Circana 数据，它在 2024
              年底位列美国全国零售食品饮料品牌销售第二，仅次于一个大型饮料集团，美元销售增长 12%，销量增长 13%。Driscoll's 通过授权模式控制估计 33% 的美国浆果市场，与 22+ 个国家的 900
              多家独立种植商合作，后者专门种植 Driscoll's 专利品种。Driscoll's 之下，竞争集包括 Naturipe Farms（由 Hortifrut、MBG Marketing、Naturipe
              Berry Growers 和 Munger Farms 组成的种植商所有合作社）、Hortifrut（智利总部、上市公司、收入 $1.2B）、Well Pict（高端有机草莓和覆盆子专家）、Fall Creek
              Farm & Nursery（Sekoya 品牌背后的主导蓝莓种质和苗圃公司）、Alpine Fresh（美国前三大蓝莓进口商，业务横跨五大洲）和 Agroberries Peru（Agrovision
              在秘鲁产地的直接竞争者）。浆果竞争格局还包括大宗进口商和大众零售商自有品牌项目，它们共同构成高端品牌如 Fruitist 必须持续替代的现状选项。秘鲁在 2025-26 产季出口创纪录的 382,934
              tonnes 鲜食蓝莓，同比增长 20%；其中 Agrovision Peru 在所有出口商中排名第 4，出口 26,332 tonnes，与 Camposol（第 1，50,462 tonnes）和
              Hortifrut Peru（第 2，34,177 tonnes）处于同一产地市场。
