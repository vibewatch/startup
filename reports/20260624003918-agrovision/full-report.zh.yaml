      - number: '5.3'
        title: RipeLocker 合作与采后冷链
        blocks:
          - type: paragraph
            body: >-
              Fruitist 于 2024 年 6 月宣布与西雅图 RipeLocker 合作，成为首家在商业规模部署该公司专利动态低气压真空舱的全球浆果生产商。 RipeLocker
              创建近真空、超低氧环境，氧气约为正常大气含量的 4%，平均抑制水果呼吸超过 50%，抑制乙烯生物合成，并控制真菌病原体；综合效果是将浆果货架期延长至 8–12 周，而传统冷链加气调包装约为四周。 在
              Agrovision 蓝莓和覆盆子试验中，CEO Steve Magami 确认该技术可以「把覆盆子的货架期延长到两倍」。 托盘大小的舱体可接入现有冷链基础设施，并在海运途中运行——一个冷藏集装箱可容纳 39
              个舱体——从而把运往中国、印度和欧洲等远距离市场的空运（约 $3–4/kg）替换为海运（约 $0.50/kg）。 系统以 1:1 目标 24/7 监控氧气与 CO₂ 比例，并提供实时移动端报告。 在 60
              天蓝莓试验中，舱体有效防止脱水，以至于浆果实际增重。 截至 2024 年 8 月，Fruitist 仍在「梳理物流环节」以推进商业化推出，目标是「到明年」全面部署。 集装箱级系统（「RipeReefer」）已建成
              20-foot 原型，并用蓝莓和奇异果测试；下一代方案计划为 40-foot 商用集装箱，装载约 18 吨，而桶装集装箱为 10–11 吨，可大幅降低每 kg 货运成本。
              同时，所有主要农场地点均运营现场冷库；浆果采收后预冷，并通过不断链冷链送至零售商配送中心。 技术架构表映射每一层供应链、其角色和风险画像。
