      - number: '6.2'
        title: 消费需求、高端定价与零食行为
        blocks:
          - type: paragraph
            body: >-
              Fruitist 的客户逻辑，建立在解决「浆果盲盒」之上：消费者买一盒浆果，打开却发现因供应链碎片化而变软、无味，这种体验令人沮丧。 Fruitist
              从育种到冷链交付拥有整条价值链，因此能稳定交付公司所称具有「清脆爆感」、质地坚实、糖度高且每次购买体验可靠的超大蓝莓。 这种一致性溢价体现在 Fruitist 相对大宗蓝莓约 50% 的价格溢价上——每盒翻盖盒约
              $6，而传统替代品约 $4。 LA Business Journal 引用的 Inglewood 消费者 Scott Hanson 谈到自己在 Trader Joe's
              的发现时说：「我的孩子特别爱吃水果。有一天在 Trader Joe's，我在过道尽头看到 Fruitist 的超大蓝莓，就决定试试。孩子们非常喜欢这些蓝莓。」 Hanson
              又说：「说实话，我甚至没注意到价格溢价。我只是觉得通胀之下，反正什么都更贵。」 这段证言说明，目标消费者群体中存在接受高端定价的动态。 GLP-1 顺风是结构性需求加速器：Fruitist 内部数据显示，使用
              GLP-1 治疗（Ozempic、Wegovy、Mounjaro）的消费者在用药后增加浆果购买，因为这些药物把饮食行为推向低升糖、营养密度高、高纤维零食。 Driscoll's CEO Soren Bjorn 在
              Wall Street Journal Global Food Forum 上印证了这一点，称 GLP-1 药物引入后，浆果需求曲线「像河流曲线一样上行」。 Perishable News 引用数据称，GLP-1
              处方用户的新鲜农产品购买量整体增加 20%。 Tastewise 数据（2026）显示，零食社交份额为 2.2%，同比增长 +26.9%；排名靠前的消费者驱动因素是分份 /
              迷你（27%）、好吃（24%）、健康（17%）和方便（15%）——Fruitist 的超大浆果和 Snack Cups 形式正好精准覆盖这一画像。 Fruitist 口径下，高端浆果品类 2019 至 2024
              年 CAGR 为 22%，确认这是结构性增长板块，而不是短周期风潮；不过 Circana 首席顾问在 2025 年 10 月提醒，「更广泛消费者采用的最大限制是价格」，并指出每盒约 $6
              的翻盖盒价格点限制了其进入价值导向家庭的渗透。
