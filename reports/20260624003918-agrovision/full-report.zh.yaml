      - number: '5.2'
        title: 基因、选择性育种与自有品种
        blocks:
          - type: paragraph
            body: >-
              Fruitist 的上游竞争护城河始于育种项目。 公司运营一个活跃的非 GMO 选择性育种项目，同时瞄准三项目标：出色风味和食用体验（硬度、脆感、香气、brix）、变暖世界中的气候韧性，以及适配物流的货架期。
              CEO Steve Magami 表示，「这个行业长期以来离风味太远、太偏向产量和出产效率，而我们一直在押注风味。」 品种明确针对耐热性优化，这是对早期蓝莓生产国（如
              Argentina）因气候和水资源挑战而退出生产的直接回应。 FMO 对 Agrovision Peru 的尽调确认，其在秘鲁生产商中拥有最多元的高端和自有商业蓝莓品种组合，并同时提供传统和有机选项。
              通过与全球领先育种项目的授权和战略关系，公司能生产碎片化种植包装竞争者无法取得的品种。 产品路线图把「无籽樱桃和抗氧化含量更高的蓝莓」列为下一代 R&D 目标。 Fruitist
              的基因投入嵌入公司对全球扩张、新基因、AI 和自有技术累计 $400M+ capex 承诺之中，不过基因 R&D 与农地、基础设施之间的具体分配未公开披露。 产品架构图把基因层展示为纵向整合技术栈的基础。
