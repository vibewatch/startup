      - number: '3.6'
        title: 证据
        blocks:
          - type: callout
            title: 纵向整合是 Fruitist 的核心竞争护城河
            body: >-
              Fruitist 在全球第一大蓝莓出口产地秘鲁拥有 2,100+ 公顷土地，并在另外六个国家运营农场，形成端到端质量控制；Driscoll's（授权模式）和 Naturipe Farms（合作社）很难复制。
              这种纵向整合构成约 50% 消费者溢价的结构基础。
            calloutType: strength
            claimRefs:
              - CP037
              - CP039
              - CP041
          - type: callout
            title: Driscoll's 的在位优势和渠道权力是最大竞争威胁
            body: >-
              Driscoll's 2024 年位列美国零售食品饮料品牌第 2，销售增长 12%，估计控制美国浆果市场 33%，并拥有数十年积累的稳固零售商关系。 若 Driscoll's
              通过专属子品牌有意切入超大高端蓝莓细分市场，它将凭更强分销和消费者认知，在 Fruitist 的主场直接挑战 Fruitist。
            calloutType: risk
            claimRefs:
              - CP001
              - CP002
              - CP040
          - type: callout
            title: 浆果基因竞赛正在加速
            body: >-
              Sekoya Pop 已占秘鲁 2025-26 年创纪录 382,934 吨出口量的 15%。 Fall Creek 的 Sekoya Nova 具备 60 天货架期，且 80%+ 果实超过 18mm，正在接近
              Fruitist 用来作为高端差异化卖点的质量曲线。 随着高端基因在第三方种植者中扩散，支撑 Fruitist 溢价的超大蓝莓质量差会收窄。
            calloutType: insight
            claimRefs:
              - CP025
              - CP028
              - CP029
              - CP032
          - type: callout
            title: Fruitist 必须保护基因 IP，避免大宗化
            body: >-
              Fall Creek Sekoya、Naturipe Berry Blue 和 Driscoll's 都在投入超大高端基因，Fruitist 的差异化取决于能否在自有品种开发上持续领先。 投资人应要求公司说明
              Fruitist 基因 IP 的广度、专利 / PVP 覆盖、排他协议，以及当前旗舰品种走向大宗化的时间风险。
            calloutType: recommendation
            claimRefs:
              - CP039
              - CP025
              - CP022
          - type: callout
            title: 浆果品类的劳工和 ESG 批评带来声誉风险
            body: >-
              Driscoll's 因其墨西哥分包供应链的劳工条件，以及耗水型单一种植模式，持续受到批评。 Fruitist 的纵向整合带来更多监督能力，但公司在秘鲁和摩洛哥运营大型农场，第三方劳工和环境审计同样重要。
              Driscoll's 争议引发的品类级声誉风险，可能外溢到所有高端浆果品牌。
            calloutType: risk
            claimRefs:
