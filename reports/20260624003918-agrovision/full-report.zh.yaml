  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值标记与隐含倍数
        blocks:
          - type: paragraph
            body: >-
              Fruitist 最新披露估值超过 $1B，来自 2024 年 8 月融资；当时 Aliment Capital、Steve Kaplan（Oaktree 联合创始人）以及 Ray Dalio 家族办公室认购了
              $100M 股权。2025 年 10 月由 J.P. Morgan Asset Management 领投的 $150M 融资中，估值维持在同一水平，并使累计股权融资达到 $443M。若计入单独安排的 $400M
              信贷额度（高于此前 $210M 额度），Pitchbook 数据显示公司自成立以来部署的总资本超过 $600M。二级市场数据提供商 PremierAlts 将 2026 年中市场隐含估值定为
              $1B，说明二级市场尚未计入融资后的估值上修。

              按 FY2024 约 $350M 披露收入（据 LA Business Journal）和截至 2025 年 4 月过去十二个月 $400M+ 收入（据 CNBC 和 AgFunderNews）计算，隐含
              EV/Revenue 约为 2.5x–3x。该倍数显著高于普通农产品公司中位数（Dole：0.25x；Fresh Del Monte：0.45x）以及全球浆果种植商 Hortifrut（约 1.3x，尽管
              EBITDA 为负），但大体符合 Argo Advisory 和 NYU Stern 数据所指的高端品牌食品公司在实现高于平均收入增长时的现实区间。公司未公开披露 EBITDA、净利润或毛利率，因此无法计算
              EV/EBITDA 倍数，分析只能依赖 EV/Revenue 和定性品牌溢价论点。Fruitist 相较普通浆果拥有约 50% 零售价格溢价，这是高于普通商品倍数最主要的经验证据。J.P. Morgan
              Asset Management 在投入 $150M 时提到「对价值链的控制、前方显著的有机增长机会，以及作为浆果高端化推动力量的定位」，显示机构资本仍把公司定价为品牌平台，而不是农场运营商。
