      - number: '8.6'
        title: 图表
        blocks:
          - type: callout
            title: 垂直整合支撑估值倍数
            body: >-
              Fruitist 从农场到零售货架的全自有、技术驱动供应链，是高端倍数的主要论据。没有其他上市浆果专家在八个国家拥有可比的整合深度。J.P. Morgan 尽调团队明确把这一点作为其 $150M
              投入的理由，提供了机构验证。
            calloutType: strength
            claimRefs:
              - CV023
              - CV024
              - CV020
          - type: callout
            title: 私营财务造成估值不透明
            body: >-
              Fruitist 未披露 EBITDA、毛利率或净利润数据。整个 $1B+ 估值都建立在私人轮投资者套用收入倍数之上。IPO 时，若首次公开披露的利润率低于市场预期，可能立即触发倍数向普通商品同业
              0.25–0.5x EV/Revenue 区间压缩。
            calloutType: risk
            claimRefs:
              - CV031
              - CV032
              - CV019
          - type: callout
            title: 跟踪；启动投资需要确认价格和利润率
            body: >-
              在披露 EBITDA 且远期收入 EV/Revenue 经验证为 2x 或以下之前，不应按当前标记启动投资。若提交 IPO 文件，应把 S-1 财务作为主要触发因素监测。继续关注 Once Upon a Farm
              的 IPO，把它作为最接近的新鲜食品公开市场首秀可比对象。
            calloutType: recommendation
            claimRefs:
              - CV033
              - CV038
              - CV005
          - type: callout
            title: 叙事之争——浆果种植商还是零食平台
            body: >-
              只有当投资者接受 Magami 将 Fruitist 定义为在 $800B 总可服务市场中竞争的零食平台，而不是浆果农场时，$1B+ 估值才站得住。如果 IPO 后卖方分析师用 Dole 和 Fresh Del
              Monte，而不是高端消费品牌来对标 Fruitist，那么无论收入增长如何，倍数都会坍塌。
            calloutType: insight
            claimRefs:
              - CV025
              - CV010
              - CV012
          - type: callout
            title: 高端 CAGR 持续穿过 IPO 申报窗口
            body: 基准情景假设 22% 高端浆果品类 CAGR 持续到 IPO 申报期。若秘鲁或摩洛哥进口关税升级，把消费者零售价推到 50% 溢价阈值以上并导致销量减速，估值论点将向熊市情景恶化，即便公司层面没有运营失败。
            calloutType: assumption
            claimRefs:
              - CV042
              - CV024
              - CV039
