      - number: '2.6'
        title: 增长驱动、逆风与市场约束
        blocks:
          - type: paragraph
            body: >-
              高端鲜食浆果品类的宏观增长驱动有充分支撑，但供给侧结构性约束和竞争动态会引入重大风险，决定 Fruitist 面临的是有利还是不利的市场情景。

              需求侧，健康意识零食、GLP-1 药物顺风和年轻消费者有机偏好交汇，带来多年结构性需求扩张。美国浆果零售在 FY2025 增长 7.5%（Circana），高端层级（巨型、品牌化、有机）增长更快。Fruitist
              巨型蓝莓销售额在截至 2025 年 4 月的 12 个月内增长 3 倍。

              最关键约束是全球蓝莓市场的供需失衡。秘鲁蓝莓出口每年约增长 30%，远快于核心市场消费增长。International Blueberry Organization（IBO）报告称，2025 年 5 月至 8
              月，秘鲁出口 71,957 tons 蓝莓（按量同比 +137%），但出口额只增长 44%，反映均价大幅下滑：7 月价格较 2024 年低 38%，8 月均价为 USD 5.95/kg，上一年为 USD
              10.08/kg。2025 全年出口均价为 USD 6.22/2.2 lbs，较 2024 年低约
              3%。如果通用供给继续快于需求扩张，大宗层级价格压缩可能逐步侵蚀高端价差，使品牌权益维护和供应差异化（种质、大小、一致性）对守住利润率更加关键。

              IBO 的 2025 Annual Report 将市场描述为呈现“uneven growth dynamics”——通用蓝莓过剩风险上升，同时某些高品质高端品类短缺。这种分化正是 Fruitist
              执行的论点：如果通用细分降价，而高端需求继续增长，Fruitist 的品牌投入会变得更有战略价值。但如果大宗层级品质改善削弱高端定价权，50% 价格溢价会更难维持。

              关税和贸易政策构成次要约束。秘鲁和智利目前面临约 10% 的美国进口关税；印度来源产品为 26%。Fruitist
              管理层称关税影响“很小”——考虑到多来源分散，这一说法部分说得通——但公开财务披露无法验证。公司的墨西哥和摩洛哥业务适用不同关税待遇。秘鲁货币波动（PEN vs.
              USD）以及秘鲁、摩洛哥劳动力成本变化，也是公开数据中高度不透明的额外成本因素。
