      - number: '1.3'
        title: 融资历史、估值与资本结构
        blocks:
          - type: paragraph
            body: >-
              Fruitist 自 2012 年创立以来，通过多次不同融资事件搭起了可观资本基础。最重要的股权事件发生在 2024 年和 2025 年。2024 年 3 月，公司完成当时最大的一轮股权融资，由洛杉矶
              Aliment Capital 领投（Ben Belldegrun 管理并取得董事席位），但具体金额未公开。2024 年 8 月，Agrovision 又完成 $100M 股权融资，投资方包括 Aliment
              Capital、Steve Kaplan（Oaktree Capital Management 联合创始人）和 Ray Dalio 家族办公室（Bridgewater Associates），并确立公司 $1B+
              估值。2024 年 11 月，公司另行获得 Rabobank 和 Banco Santander 安排的 $400M 高级担保信贷额度，其中包括 $230M 五年期贷款和 $150M
              三年期循环信贷，Goldman Sachs、Barclays、Scotiabank、BBVA 等参与，替换既有 $210M 信贷额度。2024 年 12 月，Agrovision
              完成首笔收购，买下家族所有的智利樱桃种植和出口商 ZurGroup；后者拥有 250 公顷蓝莓，以及最多可建设 500 公顷樱桃园的土地，由此启动 Agrovision Chile。2025 年 10
              月，公司已使用 Fruitist 品牌运营，并完成由 J.P. Morgan Asset Management 旗下载体领投的 $150M 股权融资；Ray Dalio 家族办公室增持，Caleb
              Williams 的投资公司 888 Midas 等成为新投资方。完成 $150M 轮后，公开报道显示累计股权融资约 $443M；按公司和媒体表述，总资本（股权加信贷）超过 $600M。PremierAlts 在
              2026 年称总融资为 $1.3B，可能反映了未披露的额外轮次或不同会计口径。Fruitist 的估值在 2024 年 8 月确立为 $1B+，公开可得的 2025 年 10 月后披露中尚未上调。
