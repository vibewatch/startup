      - number: '2.5'
        title: 买方、用户、付款方与渠道分层
        blocks:
          - type: paragraph
            body: >-
              鲜食高端浆果品类的零售渠道结构集中，由全国性杂货连锁、会员 / 仓储店和专业 /
              天然食品零售商主导。终端消费者是主要用户和付款方；零售商品类买手是直接守门人，决定是否上架。对高端浆果品牌而言，拿下少数关键大客户（Costco、Walmart、Whole Foods、Trader
              Joe's、Publix、Sprouts、Albertsons、Giant/Wakefern、ShopRite）的货架，就决定了规模化品类触达。

              消费者层面，Fresh Trends 2025 对 1,100 多名美国购物者的调查显示，54% 的消费者在过去 12 个月购买过蓝莓，与草莓并列最常购买的浆果。高收入消费者（HHI >USD
              100K）购买最频繁，比例为 64%，使高端细分成为捕捉高收入人群的机会。年轻消费者（Gen Z 32%，Millennials 24%）购买有机蓝莓的比例明显高于更年长世代（Baby Boomers 为
              9%），随着 Gen Z 购买力增长，形成代际顺风。近半数消费者（45%）表示过去 12 个月购买过巨型 / 特大蓝莓。

              会员 / 仓储渠道（Costco）是战略上重要的付款方：高销量、大 SKU 规格，会员画像偏高收入。该渠道尤其适合 Fruitist 的巨型蓝莓价值主张。专业天然食品连锁（Whole
              Foods、Sprouts）因其高端定位和健康意识较强的购物者基础，具备高契合度。全国性杂货连锁则提供广泛分销所需的销量规模。

              国际侧，Fruitist 向 28-40 个国家的零售商销售，中国和英国 / 欧洲是关键市场。中国尤其通过 Big Skye
              品牌服务，并建立直接零售关系。浆果品类决策的预算归属在零售商的农产品总监和品类经理，消费者拉动数据（动销、周转、价格实现）是新浆果品牌被采用的主要触发器。
