            title: 价格是大众采用的硬约束
            body: >-
              Circana 首席顾问明确称，价格是高端零食型农产品走向更广泛消费者的「最大限制」，尤其是在 Fruitist 当前约 $6 每盒的价位。经济下行或长期通胀可能迫使家庭降级购买 $3–4
              的普通浆果，而消费者切换成本很低。目前尚无关于消费者价格弹性或复购收入敏感性的尽调公开发布。
