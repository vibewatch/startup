      - number: '4.3'
        title: 资本结构、融资历史与资本充足性
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年中，Fruitist 的资本结构包括累计 $443M 股权融资，以及 2024 年 11 月关闭的 $400M 高级担保信贷额度，使股权加信贷累计募集资本超过 $843M。
              公司把累计融资描述为「$600M+」，口径合并股权和信贷；$600M+ 可能反映信贷额度中一部分用于再融资既有债务，也可能只包含最常被引用来源中的部分股权轮次。 LA Business Journal
              所称「创立以来 $600M+」与 2025 年 10 月前的资本状态一致。

              2024 年 8 月，Aliment Capital 和 Steve Kaplan（Oaktree 联合创始人）参与的 $100M 股权轮，确立了 $1B+ 独角兽估值。 2025 年 10 月，由 J.P.
              Morgan Asset Management 领投、Ray Dalio 家族办公室加倍持仓的 $150M 股权轮，使累计股权达到 $443M，并释放出强烈的机构信心。 J.P. Morgan 董事总经理
              Brad Demong 表示，公司已经「围绕业务筑起护城河」，并提到「对价值链的控制、前方显著的有机增长机会，以及作为浆果高端化驱动力的定位」。

              2024 年 11 月的 $400M 信贷额度由 Rabobank 和 Banco Santander 安排，Goldman Sachs、Barclays、Scotiabank、BBVA、BanBif、Banco
              ITAU、BTG Pactual、COFIDE 和 ICBC 参与，取代此前 $210M 信贷额度及短期授信。 新额度包括 $230M 五年期贷款和 $150M 三年期循环信贷。
              资金主要用于再融资既有债务，剩余资本投向农场扩张、新市场进入和技术投入。 公司自成立以来已投入 $550M+，这一数字显著高于任何单轮融资，意味着资本部署速度快于单靠股权可供给的速度。

              现金余额、月度烧钱和 runway 未公开披露。 CEO Magami 2025 年 10 月表示，需求「远超」可用供应，资本正投向产能——这指向增长模式支出，而不是短期盈利优先。 最近任命 Rich
              Sullivan（前 SurveyMonkey CFO）说明公司正在为潜在未来战略事件（包括可能 IPO）成熟财务治理。
