              - CM037
          - type: callout
            title: 全年供应护城河：反季秘鲁是持久结构性优势
            body: >-
              到 2026 年初，1 月至 3 月中旬美国鲜食蓝莓出货量约 99% 来自进口。Fruitist 的垂直一体化——2,100+ ha 秘鲁产能在 9 月至 2 月达峰、墨西哥春季产季、俄勒冈夏季、摩洛哥 /
              埃及春季窗口——共同支撑了美国市场目前唯一全国规模的全年品牌化高端蓝莓项目。这种 52 周可得性，对非垂直一体化竞争者而言结构性上难以复制，也带来有意义的零售商黏性。
            calloutType: insight
            claimRefs:
              - CM020
              - CM022
              - CM039
              - CM045
              - CM049
          - type: callout
            title: 优先尽调：独立验证 22% 高端浆果 CAGR
            body: >-
              Fruitist 的核心市场规模叙事依赖高端浆果品类在 2019-2024 年实现 22% CAGR——但该数字来自公司口径，本章审阅的外部分析师、零售面板或行业协会数据均未独立佐证。美国浆果零售额 USD
              12.5B（Circana，FY2025）显示品类增长强劲，但没有按高端与大宗分层。尽调应优先委托针对高端定位浆果 SKU 的 Circana/IRI 扫描（价格 >$X/lb 阈值），独立验证
              CAGR，并在接受投资论点表面值前确认高端层级份额和轨迹。
            calloutType: recommendation
            claimRefs:
              - CM009
              - CM012
              - CM053
          - type: callout
            title: 假设：高端价差能抵御大宗价格通缩
            body: >-
              本章市场框架假设 Fruitist 相对大宗浆果约 50%
              的价格溢价可持续。品牌投入、更优种质和稳定品质支撑这一判断，但它仍是假设，不是已经验证的持久护城河。在类似农产品品类（有机农产品、高端牛油果）中，随着高端层级从小众走向主流，以及供给侧品质改善消除品质差异，溢价曾被压缩。持续跟踪大宗与高端之间的价差，是关键风险指标。
