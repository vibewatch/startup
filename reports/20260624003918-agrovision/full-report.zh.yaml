    rows:
      - - 零售商：全年 52 周采购品质稳定的高端浆果
        - 种植商、包装商、进口商分散协作；季节性断档；品质波动（浆果盲盒）
        - 垂直整合的全球供应；覆盖 9 个国家；包装厂用 AI 做质量扫描
        - 2019–2024 年高端浆果品类 CAGR 为 22%；Fruitist 增速为品类 3 倍
        - 秘鲁集中度高（2,100+ ha）；厄尔尼诺天气风险；可能出现供应中断
      - - 消费者：购买新鲜、稳定、高端的零食浆果
        - 大宗浆果：尺寸、口味、口感不稳定；冷藏寿命短
        - 非转基因大果蓝莓；Snack Cups 形态；CEO 称冷藏寿命 3+ 周
        - Good Housekeeping 2026 Snack Award；消费者接受约 50% 价格溢价
