      - number: '4.4'
        title: 单位经济、营运资金与资本强度
        blocks:
          - type: paragraph
            body: >-
              Fruitist 未公开单位经济；公司从未发布经审计账目或管理账。 以下分析仅基于公开数据、行业基准和新闻稿披露；所有标注为估算的数字，都应在取得正式尽调资料前仅视作方向性区间。

              可估算单店收入：$400M LTM / 12,500+ 门店 = 每店每年约 $32,000。 这是覆盖 Costco（单店高销量）、大众杂货（Walmart、Whole Foods）和较小专业连锁后的混合数。
              单店数字不能替代按业态拆分的动销数据。

              新鲜浆果生产的营运资金天然具有季节性且资本密集。 蓝莓从种植到采收的生长周期约 10–16 周；公司的多地域、多气候模式（秘鲁、墨西哥、摩洛哥、埃及、俄勒冈等）正是为了平滑季节性，接近 52 周供应。
              即便如此，资本仍要在收入确认前数月投入，需要循环信贷在种植投入与零售卖入之间做营运资金桥接。 各地绑定的冷库基础设施又进一步增加资本需求。

              Capex 强度高。 公司自 2012 年成立以来已投入 $550M+，意味着约 14 年平均年 capex 约 $40M；考虑增长速度，近年实际很可能显著更高。 以 $400M 收入基数看，capex /
              revenue 比例显著高于较轻资本食品公司常见的 5–10%。 多数 capex 是生产性投入：农地、包装厂、冷库和采后技术，共同支撑高端定位和货架期延长。 信贷额度中的定期贷款（$230M，5
              年）用于长期农场资产，与农业项目融资惯例一致。

              $400M 信贷额度的债务服务未披露，但是真实且重大的义务。 粗略估算，$230M 定期贷款按农业贷款利率（通常 SOFR + 200–350 bps = 7–9%）计算，年利息约
              $16–$21M，另加循环信贷提款。 在未披露 EBITDA 的情况下，覆盖率（EBITDA / 利息）无法验证，这是关键尽调缺口。
