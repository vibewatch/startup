        - 驱动 ↑
        - 持续
        - 高端莓果相对加工零食获得结构性顺风；支撑 50% 价格溢价论点和品牌投入 ROI
        - 评估 Fruitist 关键零售客户中，莓果货架相邻位置增加与加工零食下滑的关系；确认货架空间 YoY 扩张
      - - 反季节秘鲁供应产能扩张
        - 驱动 ↑
        - 持续
        - 让全年规模化高端莓果供应成为可能，这是全国零售计划的关键；Fruitist 在秘鲁 2,100+ 公顷基地构成结构性护城河
        - 确认 Fruitist 在秘鲁的签约采收产能足以支撑 3 年计划销量增长；评估 El Niño 对秘鲁作物的天气风险
      - - 蓝莓大宗供给过剩 / 通用产品价格通缩
        - 约束 ↓
        - 现在 → 2027
        - 秘鲁供应 YoY 增长 30%，而需求增长 <10%；2025 年 7 月大宗价格较 2024 年下降 38%；如果品牌资产守不住，溢价价差有被侵蚀风险
        - 跟踪秘鲁蓝莓每周平均出口价格（USDA Market News）与 Fruitist 零售 ASP；索取公司按产品划分的毛利率趋势
      - - 美国进口关税（秘鲁 / 智利 10%；印度 26%）
        - 约束 ↓
        - 现在
        - 秘鲁进口面临 10% 成本逆风——秘鲁是主要供应来源；公司称“影响很小”，但未披露关税项目
        - 获取关税成本占 COGS 的比例；确认公司管理关税敞口的对冲或合同机制；评估墨西哥 / 摩洛哥供应作为免关税分散来源
      - - 竞争——Driscoll's 和高端莓果进入
