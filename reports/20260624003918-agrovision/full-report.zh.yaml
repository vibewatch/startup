chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              Fruitist 是运营品牌，也是 Fruitist Holdings Inc. 的母公司实体；后者是 2025 年 4 月 22 日启用的法定继承名称，取代公司自 2012 年创立以来使用的
              Agrovision Corp.。Fruitist 总部位于加州洛杉矶 Century
              City，是一家垂直一体化的高端鲜食浆果生产商、营销商和分销商，核心产品为巨型蓝莓、覆盆子、黑莓和樱桃，瞄准高速增长的健康零食场景。公司面向消费者使用两个品牌：Fruitist（全球）和 Big
              Skye（中国）。Fruitist 消费品牌最早于 2020 年推出，之前八年公司一直以 Agrovision 作为企业身份运营。商业模式建立在完整垂直一体化之上：Fruitist
              在全球最优微气候区域拥有并运营自有农场，培育自有非转基因水果品种，管理全部物流和冷链，并直接向大型零售商销售，绕开传统农产品供应中碎片化的中间商链条。公司把这一模式表述为解决“berry
              roulette”——消费者长期抱怨的常规碎片化供应模式下浆果品质不稳定问题。旗舰产品巨型蓝莓的零售价相对大宗替代品约有 50% 溢价，并展现出强复购行为。按公司数据，高端浆果品类在 2019 至 2024
              年实现 22% 复合年增长，验证了零食化论点。截至 2025 年 10 月融资公告，Fruitist 在全球十个微气候区域运营农场，覆盖秘鲁（2,100+ 公顷）、墨西哥（约 460 ha）、摩洛哥（约 160
              ha）、埃及（约 60 ha）、美国俄勒冈（约 230 ha）、中国（约 25 ha）、印度（约 20 ha）、智利（约 120
              ha），以及罗马尼亚、泰国和印度尼西亚的育苗用地。公司仍是未公开申报过的私营独角兽阶段企业。
