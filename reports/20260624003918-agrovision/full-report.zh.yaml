      - number: '3.4'
        title: 高端种质竞赛
        blocks:
          - type: paragraph
            body: >-
              高端蓝莓的竞争主战场，越来越压到基因层。 自有品种开发能否稳定做出超大果径、更高甜度、更长货架期和更硬口感，已经决定供应商是停在大宗供货，还是站上高端品牌位置。 与 Fruitist
              抢同一市场窗口的基因项目主要有三类：Fall Creek/Sekoya、Naturipe 的 Berry Blue 项目，以及 Driscoll's 的内部育种体系。

              Fall Creek Farm & Nursery 是全球领先的蓝莓基因公司，在所有主要产区为种植者运营商业化植株预览项目。 旗下 Sekoya 品牌是一个 B2B 平台，主打全年供应高端超大蓝莓；2026 年
              2 月，它在柏林 Fruit Logistica 2026 发布 Sekoya Nova FC15-173。 内部试验显示，Sekoya Nova 约 80% 果实直径超过 18mm（可比高需冷量品种为
              20-50%），货架期超过 60 天（新一代高需冷量品种约 45 天）。 关键在于，Sekoya 基因已经在秘鲁种植者中铺开：Sekoya Pop 占秘鲁 2025-26 年创纪录蓝莓出口量 382,934
              吨中的 58,710 吨，约占 15.3%。 也就是说，采用 Fall Creek 基因的种植者，正与 Fruitist 纵向整合的 Agrovision Peru 平台，在同一批美国和欧洲零售渠道里正面竞争。

              Naturipe 运营 Berry Blue 育种项目已超过 25 年，试验站位于佐治亚和密歇根，聚焦高端蓝莓基因。 其自有品种包括 Mighty Blues（超大果）、Envoy（Sweet
              Selections）、Keepsake、Charisma 和 Color Rush（粉色蓝莓），构成一个面向多个消费场景的多元基因组合。 Driscoll's 则为四类浆果（草莓、蓝莓、覆盆子、黑莓）投入独家非
              GMO 育种，并把这些品种只授权给自己的种植者网络。 秘鲁前五大品种 Ventura、Sekoya Pop、Biloxi、Mágica 和 Rocío 合计占该国 2025-26 年蓝莓出口总量的
              67.52%，说明原产地的高端基因集中度已经达到工业规模。 Fruitist 必须继续投入自己的基因项目，才能守住支撑其相对大宗产品约 50% 消费者溢价的质量差。
