  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品线地图与 SKU 架构
        blocks:
          - type: paragraph
            body: >-
              Fruitist 的商业组合围绕五条创收产品线展开，在美国和全球以 Fruitist 品牌销售，并以平行品牌 Big Skye 服务中国。
              超大蓝莓是旗舰产品，也是最大收入贡献者：果实直径为传统蓝莓的两到三倍，通过公司的非 GMO 选择性育种项目，培育出高硬度、脆感、香气和更长货架期。 自有「Legends」品种已在 Trader
              Joe's、Whole Foods、Sprouts 和 Erewhon 形成小众爆款地位。
              覆盆子和黑莓把组合延伸到更柔软、更脆弱的浆果；在这些品类里，纵向整合和采后技术带来的质量与一致性优势，是碎片化供应链难以匹配的。 樱桃在 2024 年 12 月通过收购智利专家 ZurGroup
              进入产品组合，增加了一个高价值、季节性不同的核果；Fruitist 已在 2025–2026 产季开始从其智利农场发运樱桃。 最新形式创新是 2025 年推出的 Snack Cups，把高端超大蓝莓装入便携
              4-ounce 即拿即走杯，面向午餐盒、健身包和办公场景。 Snack Cups 获得 Good Housekeeping 2026 Snack Awards，由 2,000 多名试吃者和注册营养师评估。 所有
              Fruitist 产品均为非 GMO 认证，相比大宗浆果同类产品约有 50% 零售溢价；标准 9.8-oz 包装零售价为 $6–$8。 产品模块表列出五条产品线的商业状态、差异化和关键尽调缺口。
