      - number: '2.2'
        title: TAM、SAM 与 SOM：多重测算口径
        blocks:
          - type: paragraph
            body: >-
              高端鲜食浆果品类的市场规模测算需要谨慎界定范围，因为分析师估计会随口径大幅变化：只算鲜食还是包括加工浆果，只算蓝莓还是全部浆果，统计全球还是北美。Fruitist 的投资案例主要对应三种测算口径。

              最宽的 TAM 口径是全球鲜食浆果市场。Mordor Intelligence 估算其 2026 年规模为 USD 36.73B，到 2031 年增至 USD 45.14B，CAGR 为
              4.22%。草莓占最大份额（2025 年约 32%），但蓝莓拥有最高子品类 CAGR（到 2031 年为 6.92%）。The Business Research
              Company（TBRC）给出的全球浆果市场口径略窄但包含加工形态：2025 年 USD 26.97B，2026 年增至 USD 28.42B，增速 5.4%，范围包括冷冻、干制和浓缩。这两项估计把 2024
              年权威行业评论中引用的 USD 25-26B 区间夹在中间。

              TAM 内部，Fruitist 核心产品所在的蓝莓子品类在 2025 年规模为 USD 9.84B、2026 年为 USD 10.49B（TBRC/Research & Markets，CAGR
              6.5%）；Business Research Insights 则把 2026 年蓝莓市场估为 USD 10.75B，并预计到 2035 年 CAGR 为 4.7%。因此，蓝莓子品类约占更广义鲜食浆果 TAM
              的 25-29%，相对其他浆果类型重要性更高。

              对 Fruitist 最直接相关的 SAM，是北美高端浆果零售细分，加上关键国际出口通道。截至 2025 年 6 月的 52 周内，美国浆果零售额达到 USD 12.5B（Circana
              OmniMarket），同比增长 7.5%，规模超过第二大农产品品类（葡萄）的两倍。高端品牌化浆果包装是其中快速增长的子细分，但高端层级精确份额没有公开的独立第三方估计——Fruitist 自称
              2019-2024 年高端品类 CAGR 为 22%，这是公司口径，未获独立验证。若粗略假设高端占美国零售的 15-25%，北美高端浆果 SAM 约为 USD
              1.9-3.1B，国际高端出口市场还会显著放大该空间。

              Fruitist 的 SOM 由当前收入定义：FY2024 约 USD 350M，截至 2025 年 4 月的过去 12 个月超过 USD 400M，意味着其对估算北美高端 SAM 的当前渗透率约为
              13-21%。公司公开目标是在未来几年把销量放大数倍。
