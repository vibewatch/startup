      - number: '4.2'
        title: 定价架构、成本结构与利润率框架
        blocks:
          - type: paragraph
            body: >-
              Fruitist 每盒 clamshell 包装零售价约 $6–$8，较大宗浆果替代品约有 50% 溢价，CEO Steve Magami 称之为「负担得起的奢侈」。
              这种溢价来自自有基因（超大果径、脆感、风味曲线）、全年稳定供应，以及 RipeLocker 采后技术带来的更长货架期。 零售商利润率结构未披露；标准新鲜农产品零售毛利率通常在 40–60%
              区间，但公司以批发价卖给零售商后自己实现的利润率并不公开。

              成本端，Fruitist 的模式因纵向整合，结构上比大宗农产品同行更重资本、更重运营成本。 这类模式下的销售成本包括农场劳动力（秘鲁：最多 15,000
              名田间工人）、种子和基因投入、灌溉和投入品、现场冷库、货运和物流、包装——这些环节 Fruitist 都自己拥有或控制，而非外包。
              全栈所有权提升质量控制和定价权，但也意味着营运资金要深度压在漫长种植周期和季节性采收窗口中。 公司横跨八个国家运营，劳动力成本结构、汇率敞口和监管环境各不相同，进一步增加成本管理复杂度。

              对标可比上市浆果和农产品公司，是判断 Fruitist 毛利率区间的最佳公开代理。 Fresh Del Monte Produce 在 FY2025 以 $4.32B 收入实现 9.2%
              毛利率，该公司覆盖广泛的大宗农产品组合。 智利浆果专家 Hortifrut（蓝莓、覆盆子、草莓）FY2025 收入 $1.215B，毛利率 12.7%，但净亏损 $77.7M。 最大上市农产品公司 Dole
              plc FY2025 收入 $9.2B，调整后 EBITDA 为 $395.4M，约 4.3% EBITDA 利润率。 按行业基准，定价权更强的高端农产品品牌毛利率可达到 15–25%。 Fruitist
              的品牌化、纵向整合和高端定位，可能让其毛利率高于 Dole/FDM，但重资本投入可能在近期压制 EBITDA 利润率。
