  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: compact
    summary: 截至 2026 年 6 月，面向 IC 的 Fruitist 七个投资维度评分。证据质量因私人公司不透明而被扣分。估值纪律是给出买入建议的关键约束。
    data:
      items:
        - label: 市场机会
          value: 8/10
          note: 全球莓果市场 $25B+；高端 CAGR 22%；零食化顺风；GLP-1 提振
        - label: 收入验证
          value: 8/10
          note: LTM $400M+；12,500+ 家门店；蓝莓销售额增长三倍；28+ 个国家
        - label: 竞争护城河
          value: 7/10
          note: 垂直整合 + 品牌溢价 + 育种 / 技术边；复制成本高
        - label: 单位经济
          value: 4/10
          note: 50% 价格溢价已确认；EBITDA / 利润率未披露；无盈利能力验证
        - label: 风险画像
          value: 4/10
          note: 农业周期；关税敞口；作物集中；IPO 时点风险
        - label: 估值纪律
          value: 4/10
          note: 2.5–3x EV/Rev，相比大宗 0.25–0.45x；没有利润率无法确认 $1B+ 是否合理
        - label: 证据质量
          value: 5/10
          note: 私人公司；无公开财务；收入来自公司口径
