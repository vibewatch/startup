      - number: '3.2'
        title: Driscoll's：主导性在位者
        blocks:
          - type: paragraph
            body: >-
              Driscoll's 是品牌化鲜食浆果毫无争议的市场领导者，也是 Fruitist 高端定位面临的主要在位威胁。2024 年底，Circana 确认 Driscoll's 为美国 #2
              零售食品饮料品牌，仅次于一家大型饮料集团，较上一年上升两位。它是前 15 名中仅有的两个在销量和美元销售额上都实现两位数增长的品牌之一，也是美国零售前 40 品牌中增长最快的品牌。按 Circana
              数据，过去五年美国鲜食浆果贡献 $4.2B 销售额；Driscoll's 通过锚定自有非转基因选择育种的风味创新策略主导这一市场。公司的 Sweetest Batch 高端子品牌和可观有机产品线，瞄准的正是
              Fruitist 目标消费者：高端、重风味、重健康。

              Driscoll's 的商业模式本质上轻资产：它不拥有农场，而是把独家专利品种授权给 22+ 个国家的 900 多家独立种植商，合同限制种植商只能向 Driscoll's
              供货。这带来深度种植商锁定和供应链效率，但也引入一层间接性；Fruitist 认为这正是造成“berry roulette”品质不稳定问题的原因之一。Driscoll's 全球业务规模估计超过
              $4B。不过，公司长期面临批评：在墨西哥 San Quintín Valley，以分包安排采收 Driscoll's 浆果的农场工人据称日薪低至
              $6，使其供应链不透明暴露声誉脆弱性。批评者还指出高耗水单一种植和大量使用农药的问题。这些劳工和环境批评，与 Fruitist 对外营销的垂直一体化模式形成直接对照；Fruitist
              主打可追溯、安全和工人福利监督。
