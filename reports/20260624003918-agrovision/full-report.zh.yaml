      - number: '8.4'
        title: 牛市、基准与熊市情景分析
        blocks:
          - type: paragraph
            body: >-
              Fruitist 在潜在 IPO 或下一次二级市场标记时的企业价值三情景框架，由三个互相咬合的杠杆驱动：（1）收入轨迹；（2）市场基于品牌溢价和增长给予的倍数；（3）盈利能力披露是否证实或削弱高端叙事。

              牛市情景下，Fruitist 在提交上市文件后十二个月内证明远期收入接近 $500M（隐含同比增长 25%+），披露毛利率超过 25%（符合品牌模式，而非普通商品种植商），并成功把自己定位在 CEO Magami
              所描述的 $600B–$800B 全球零食可服务市场中。在该情景下，市场在 IPO 时给予 3.5x–4.5x EV/Revenue 倍数，与高端食品平台一致。隐含企业价值：$1.5B–$2.5B。

              基准情景下，提交上市文件时收入约 $400M–$450M，市场接受 Fruitist 是高端农产品品牌，并给予 2x–2.5x EV/Revenue 倍数——高于
              Hortifrut（1.3x），但低于特色食品平台——同时 EBITDA 利润率披露为低到中双位数百分比。隐含企业价值：$800M–$1.1B，大体确认当前 $1B+ 标记。该基准情景要求 22% 的高端浆果品类
              CAGR 持续到 IPO 申报期。

              熊市情景下，当盈利压力、关税暴露或增长放缓变得明显，市场把 Fruitist 重新定价到上市农产品公司倍数区间。按 0.4x–0.6x EV/Revenue（与 Dole 和 Fresh Del Monte
              一致）、$350M–$400M 收入计算，隐含企业价值为 $140M–$240M——相对当前标记是灾难性下调。若 IPO 推迟到 2027 年以后、增长降至 15%
              以下，或作物事件伤害品牌信任，该情景就有可能发生。Vital Farms 的结构性教训——尽管拥有高端品牌，十八个月内 EV/Revenue 仍从 2x 压缩到 0.59x——是一个仍然有效的反向数据点。
