            body: >-
              Fruitist 不披露任何单一零售商的收入贡献。Costco 被广泛认为是北美高端农产品单一销量最大的渠道。若 Costco 占 Fruitist 北美销量超过
              30%——这一阈值与其他早期增长阶段高端农产品品牌相符——Costco 下架或重新定价都将构成重大业务事件。
            calloutType: risk
