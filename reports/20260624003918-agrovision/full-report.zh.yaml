          - type: callout
            title: GLP-1 顺风增加结构性需求层
            body: >-
              GLP-1 减重药（Ozempic、Wegovy、Mounjaro）正在重塑零食消费：用户总体吃得更少，却转向营养密度更高、低升糖的选择——这正是 Fruitist jumbo blueberries
              的定位。Fruitist CEO 和 Driscoll's CEO 都公开提到 GLP-1 用户推动浆果需求上升，因此这不是猜测，而是已被验证的需求驱动因素。International Blueberry
