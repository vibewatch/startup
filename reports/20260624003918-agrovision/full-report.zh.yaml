      - number: '5.5'
        title: 全球农场版图作为运营和技术资产
        blocks:
          - type: paragraph
            body: >-
              Fruitist 的全球农场网络本身就是技术和运营资产；公司利用九个国家互补的气候窗口，设计出全年 52 周反季节供应。 秘鲁 Lambayeque 的 Olmos 枢纽占主导，面积 2,100+ 公顷，并在
              2025/2026 产季发运约 3,200 万公斤蓝莓。 运营总监 Juan José Gal'Lino 预计下一季产量增长 30%，由更新、更高价值的品种驱动。 墨西哥（约 460
              ha）为蓝莓、覆盆子和黑莓提供春季衔接窗口。 摩洛哥（约 160 ha）和埃及（约 60 ha）服务欧洲和中东冬季及早春窗口。 俄勒冈业务（Salem 附近约 230
              ha）覆盖美国本土夏季，并支撑公司「进口补充本土供应」的关税叙事。 智利（约 120 ha）是通过 ZurGroup 新收购的樱桃锚点。 印度（约 20 ha）和中国（云南，约 25
              ha）的较小业务支持本地市场供应和品牌建设。 罗马尼亚（约 150 ha）正作为蓝莓苗圃开发，泰国、印度尼西亚和菲律宾也在推进扩张。 FMO（Dutch Development Bank）在为
              Agrovision Peru 早期扩张提供次级融资时，确认秘鲁业务拥有 GlobalGAP、SMETA 和 FSMA 认证。 Agrovision Peru 入选 Great Place to Work
              Peru 2026 农工业榜单。 农场版图路线图表按状态和战略理由总结各地域。 关键依赖关系图展示秘鲁枢纽、基因伙伴和 RipeLocker 如何咬合。
