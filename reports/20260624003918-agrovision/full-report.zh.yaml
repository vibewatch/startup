            body: Fruitist 的收入、利润率、盈利能力和精确员工数都属于未经审计的私营公司数据。Bloomberg 于 2024 年 8 月指出，公司拒绝公布具体销售数字。这限制了潜在 IPO 申报前独立验证增长叙事的能力。
            calloutType: risk
            claimRefs:
              - CO037
              - CO038
          - type: callout
            title: 收入增长轨迹符合公司叙事
            body: 从 FY2024 约 $350M 到 LTM（2025 年 4 月）$400M+ 的演进，来源于公司声明及媒体对这些声明的报道。没有经审计财务，意味着这些数字无法独立验证；在尽调确认前，应视为公司估计。
