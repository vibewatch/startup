      - number: '2.7'
        title: 图表
        blocks:
          - type: callout
            title: GLP-1 药物顺风利好高端鲜食浆果
            body: >-
              Cornell University 的同行评审研究和 Circana 零售面板数据均确认，GLP-1 药物用户会可衡量地增加鲜果支出（这是除酸奶外唯一在采用后增长的品类）。随着全球 GLP-1
              用户预计五年内增至三倍、达到 120 million，且口服制剂价格降至约 USD 150/month，主动转向 Fruitist
              蓝莓这类高端鲜果零食的消费者池将显著扩大。这是鲜食农产品品类较为独有、真实、可量化且仍在增长的结构性需求驱动。
            calloutType: strength
            claimRefs:
              - CM026
              - CM027
              - CM028
              - CM029
          - type: callout
            title: 秘鲁大宗供给过剩带来结构性价格压力风险
            body: >-
              秘鲁蓝莓出口量自 2016 年起每年约增长 30%，而美国消费增长不到 10%。2025 产季，秘鲁蓝莓价格在高峰月份下跌
              38-41%。如果这一动态持续，大宗层级价格底部可能下移到让高端价差更难维持的水平。Fruitist 的品牌权益、种质项目和 RipeLocker
              货架期技术是主要防线，但大宗价格持续崩落可能吸引“降级消费”行为，进而广泛威胁品类高端化。
