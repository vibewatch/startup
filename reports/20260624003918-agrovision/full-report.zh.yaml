      - number: '3.3'
        title: Naturipe Farms、Hortifrut、Well Pict、Alpine Fresh 与 Agroberries
        blocks:
          - type: paragraph
            body: >-
              Naturipe Farms 是四大浆果生产商组成的种植商所有合作体：Hortifrut S.A.（智利）、MBG Marketing（Michigan Blueberry Growers 合作社，1936
              年成立）、Naturipe Berry Growers（加州，1917 年成立）和 Munger Farms（San Joaquin Valley）。这种合作社结构让 Naturipe Farms
              在南北美拥有多元生产覆盖并实现全年供应。2026 年 6 月，Naturipe 报告其高端 Sweet Selections 细分同比增长 45%，有机蓝莓销售增长 18%，带来 $73.4M
              额外品类价值——在高端细分直接与 Fruitist 竞争。Naturipe 的自有 Mighty Blues 巨型品种和 Color Rush 粉色蓝莓产品线，都是 Fruitist 巨型蓝莓旗舰的直接竞争者。

              Hortifrut（圣地亚哥，总部；以 HF-B 在 Santiago Stock Exchange 上市）是全球最大的蓝莓生产商和营销商之一，FY2025 运营收入 $1,215M（同比 +5.3%），但净亏损
              $73.3M——较 2024 年 $41.2M 亏损扩大——原因是战略性关闭表现不佳的墨西哥业务，并计提 $90.3M 资产减值。北美占 Hortifrut 销售额
              57.4%。其在秘鲁和中国的品种更新（用高端种质植株替换旧品种）是一项多年投资，将加大 Fruitist 所在高端蓝莓细分的竞争压力。2025-26 年，Hortifrut Peru 在秘鲁出口商中排名第
              2，出口 34,177 tonnes，直接与产地端的 Agrovision Peru（第 4，26,332 tonnes）竞争。

              Well Pict 全年从加州 Watsonville 和 Baja California 发运高端自有草莓和覆盆子。如今作为 Gem-Pack Berries 的一部分，该品牌维持 12
              个月有机草莓项目，并发展全年覆盆子项目，通过高端有机定位与 Fruitist 的覆盆子和黑莓产品线竞争。

              Alpine Fresh 是领先的鲜食浆果种植商、包装商和发货商，业务横跨五大洲，专注蓝莓、黑莓、覆盆子、芦笋和鲜切农产品。它约占美国蓝莓进口份额 10%，是美国前三大蓝莓买方之一，自 2012 年以来拥有超过
              14,000 票蓝莓进口提单。Agroberries Peru 是秘鲁领先出口商，2025-26 产季排名前 10，与 Agrovision Peru 处于同一 La Libertad 和沿海种植区域。
