      - number: '1.4'
        title: 规模、牵引力与封面指标
        blocks:
          - type: paragraph
            body: >-
              自 2020 年 Fruitist 消费品牌推出以来，公司的商业规模快速增长。按 Los Angeles Business Journal 报道，公司 FY2024 销售额约 $350M；截至 2025 年 4
              月的过去 12 个月销售额达到 $400M 或以上，主要由巨型蓝莓销售额同比增长三倍推动。公司向北美超过 12,500 个零售点供货，已确认进入 Costco、Walmart、Whole Foods、Trader
              Joe's、Publix、Sprouts、Giant、Wakefern、ShopRite 和 Albertsons。国际分销从 28 个国家（2025 年 4 月更名公告）扩至 2025 年 10 月的 40
              个国家，覆盖北美、亚洲、中东、欧洲和英国。由于 Fruitist 仍为私营公司，这些数字均为公司口径且未经审计。公司拥有约 3,200 名企业员工，仅秘鲁一地最多还有 15,000
              名季节性田间工人，其中秘鲁员工中女性占比超过 50%。自创立以来，Fruitist 已在全球农场扩张、自有种质、AI 技术和供应链基础设施上投入 $400M–$550M，其中包括与 RipeLocker
              合作延长货架期。Fruitist 浆果相对大宗替代品约 50% 的价格溢价，既反映强消费者接受度，也体现品牌建设成功。与 NFL 四分卫 Caleb Williams、USC Athletics 和 D.C.
              United（官方零食伙伴）的品牌合作，把触达延伸到体育和生活方式渠道。公司还在 2025 年推出 Fruitist Snack Cups 单份装，瞄准即食健康零食。
