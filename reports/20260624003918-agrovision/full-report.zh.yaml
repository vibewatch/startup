            - 部署规模未披露；无公开技术文档或供应商披露
    id: FE004
    layout: wide
    summary: >-
      成熟度矩阵从商业成熟度、技术差异化和关键风险三个维度，梳理 Fruitist 的七项核心产品和技术能力。大颗粒蓝莓是唯一已经完全成熟并规模化的能力。RipeLocker 采后技术和 AI
      采收预测都关系到长期护城河，但商业验证仍不完整；通过 ZurGroup 切入的樱桃和机器人则处于早期，验证缺口很大。
