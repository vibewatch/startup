  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险分类与严重性排序
        blocks:
          - type: paragraph
            body: >-
              Agrovision / Fruitist 的风险画像横跨六条主要向量并相互叠加：贸易与关税、气候与天气、食品安全与监管、劳工与治理、竞争、财务 / 资本。
              本章把这些向量整理为按严重性排序的风险登记册，基于一手来源证据而非直觉，给出可能性和影响评级。总体判断是：对投资者而言风险为高，原因在于进口依赖型商业模式面临永久性关税逆风，公司的主产区处于活跃 El Niño
              条件下，同时一家背负 $400M 优先担保债务的私营公司本身存在不透明性。风险热力图（FR001）把全部已识别风险放入可能性—影响矩阵。综合严重性最高的是气候 / El Niño
              风险（高可能性、关键影响）和美国关税升级（中高可能性、高到关键影响）。严重性最低的是单项认证失效事件。分类结构的设计，是让后续每一节深入分析一到两个风险向量，并给出引用证据、缓释措施和终止标准。综合监管风险登记册（TR001）、运营登记册（TR002）、合作伙伴登记册（TR003）、人员
              / 执行登记册（TR004）和终止标准表（TR005）提供每项评级背后的操作细节。全文提示框突出三个最值得投资者关注的破题触发因素。
