      - number: '5.6'
        title: 质量控制、认证与食品安全
        blocks:
          - type: paragraph
            body: >-
              Fruitist 的质量与合规项目覆盖五个领域：食品安全认证、品种标签完整性、劳工和可持续审计、采后质量控制，以及供应链可追溯。 Agrovision Peru 持有覆盖秘鲁业务的
              GlobalGAP、SMETA（Sedex Members Ethical Trade Audit）和 FSMA（Food Safety Modernization Act）认证。 所有 Fruitist
              产品的非 GMO 标签，是品牌高端、天然零售定位的核心；选择性育种方法明确避免基因改造。 端到端质量流程整合了 AI 驱动的逐颗浆果扫描、采收后数小时内严格预冷，以及从农场到零售商配送中心的不断链冷链。 2025
              年 7 月，竞争对手 Alma Pak International LLC 因李斯特菌污染召回 400 箱有机冷冻蓝莓，FDA 将其列为 I 级召回；这说明浆果生产存在行业级食品安全风险。 Fruitist
              品牌产品没有公开报告过类似召回。 秘鲁农业部门面临 Sunafil（国家劳工机关）更严格的劳工检查；Sunafil 在 2025–2026
              年识别出农业领域广泛的强迫劳动风险和合规失败，这是所有秘鲁运营商都需要独立监测的结构性风险。 信任 / 质量 / 合规表总结关键控制和待验证缺口。
