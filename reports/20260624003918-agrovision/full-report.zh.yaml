  foundingLocation: Los Angeles, California (with Peru operating origin)
  headquarters: Century City, Los Angeles, CA
  productSummary: >-
    以 Fruitist 品牌销售的高端鲜食浆果——旗舰巨型蓝莓，以及覆盆子、黑莓和（通过 2024 年收购 ZurGroup 获得的）樱桃——还包括 “Snack Cups”
    包装形态。产品主打大小、风味和货架期稳定，背后靠垂直一体化、自有非转基因种质和 RipeLocker 采后技术支撑。
  customerFocus: >-
    北美大众高端杂货和会员制零售商（Costco、Walmart、Whole Foods、Trader
    Joe's、Publix、Sprouts、Albertsons、Wakefern/ShopRite），以及中国、印度、英国、欧洲、中东和东南亚的国际分销；终端消费者是愿意为确定性品质支付溢价、注重健康的零食用户。
  businessModel: 垂直一体化种植商、包装商和营销商：Fruitist 拥有或控制农场、种质、冷链和品牌，在全链条捕捉利润，并以品牌化高端浆果相对大宗水果获取价格溢价；资本密集的农场扩张由股权融资和大额信贷额度支撑。
  stage: Private (Series A+ / unicorn)
  fundingStatus: >-
    私营独角兽。累计股权融资约 $443M（包括 2024 年 8 月以 $1B+ 估值融资 $100M；2025 年 10 月由 J.P. Morgan Asset Management 领投 $150M），另有 $400M
    高级担保信贷额度；投资方包括 Aliment Capital、Steve Kaplan 和 Ray Dalio 家族办公室。媒体称其可能成为 IPO 候选（Bloomberg，2025 年 1 月），但管理层未确认。
