        - 现在 → 3 年
        - 'Driscoll''s（美国零售食品饮料 #2 品牌，2024 年销售增长 12%）正在投入品牌高端莓果；Naturipe、Hortifrut 也在升级遗传品种；高端货架可能被争夺'
        - 跟踪 Driscoll's/Naturipe 在巨型 / 高端层级的新 SKU 发布；监测 Fruitist 在关键零售客户处的货架面数和促销频率，并与 Driscoll's 对比
    notes: 每项驱动 / 约束的时间和幅度基于截至 2026 年 6 月的可用市场研究和新闻来源。Fruitist 财务影响数据（关税成本、按细分划分毛利率）未公开披露。竞争对手投入数据基于公开新闻稿和行业新闻。
