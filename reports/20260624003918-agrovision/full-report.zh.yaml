      - number: '7.3'
        title: 气候、天气与运营风险
        blocks:
          - type: paragraph
            body: >-
              秘鲁是全球最大的新鲜蓝莓出口国，Agrovision 的主要枢纽也位于秘鲁，面积 2,100+ 公顷。产量集中在秘鲁北部沿海——主要是 La Libertad 和 Lambayeque——使公司暴露在
              Coastal El Niño 风险下；这一周期性气候模式会给蓝莓作物带来高于平均水平的降雨、最高 +3°C 的温度异常，以及更高病害压力（灰霉病、白粉病）。截至 2026 年 6 月，秘鲁 ENFEN
              委员会已将 Coastal El Niño Alert 延长至 2026 年 11 月，正好覆盖蓝莓收获旺季（9–11 月）。历史扰动很严重：2023/24 年 El Niño 曾使秘鲁蓝莓出口减少超过
              40%，尽管当年价格大幅反弹。2026 年背景不同——销量承诺更大，零售商项目更刚性，物流链也更复杂——类似冲击会放大后果。ProArandanos 2026 年 6 月只发布了 10
              周预测（而不是通常的全季预测），并明确引用气温升高带来的不确定性。2017 年和 2024 年 El Niño 事件造成道路连通性和港口物流中断，延误出货并扰乱全球供应链。秘鲁之外，Agrovision
              的其他种植地（墨西哥、摩洛哥、埃及、印度、美国俄勒冈、中国、智利樱桃）也各有气候风险：摩洛哥干旱、埃及高温、俄勒冈霜冻。运营风险登记册（TR002）提供结构化清单。
