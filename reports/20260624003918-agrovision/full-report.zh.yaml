      - number: '7.2'
        title: 贸易、关税与监管风险
        blocks:
          - type: paragraph
            body: >-
              Trump 政府自 2025 年 4 月起对来自秘鲁、墨西哥、智利和加拿大的蓝莓进口征收 10% 基础关税。Agrovision CEO
              公开称关税影响「很小」，理由是公司拥有多元化的全球布局。但独立行业分析直接挑战这一说法：International Blueberry Organization（IBO）认为，10%
              关税相当于把整个出口行业的需求增长倒退约八个月；如果供应继续增长而有效需求下降，价格可能较上年下跌近 20%。对一家高端定位依赖相较普通浆果保持约 50%
              溢价的公司而言，这种压缩具有实质性。现实影响也支持反向观点：2025/26 年，秘鲁对美国蓝莓出口在产量增长 18% 的情况下仅增长 5%，而对欧洲出口增长
              35%，反映关税驱动的市场转向。该关税还在美国最高法院面临持续法律挑战，带来政策不确定性。印度面临 26% 的美国对等关税——这一点相关，因为 Agrovision 在印度约有 50 英亩土地，而
              Fruitist 产品反向进入印度市场也面对相同税率。除关税风险外，FSMA Produce Safety Rule 的采前用水合规要求自 2025 年 4 月起对大型农场强制生效，FDA Berry
              Contamination Prevention Strategy（2025 年 1 月）也正式提高了对进口农产品的监管审查强度。NABC 行业组织持续监测关税变化，并与 USTR
              沟通，以管理蓝莓进出口影响。完整监管与法律风险登记册见下方表 TR001。
