      - number: '3.5'
        title: 竞争护城河、威胁与 Fruitist 定位
        blocks:
          - type: paragraph
            body: >-
              Fruitist 最核心的竞争护城河是纵向整合：公司在秘鲁拥有并运营 2,100+
              公顷土地，同时在墨西哥、摩洛哥、埃及、俄勒冈、智利、中国和印度布局农场，因而能端到端控制基因、农艺、采收时间、采后处理、冷库和货架期技术。 这与 Driscoll's 的轻资产授权模式、Naturipe
              的合作社结构形成鲜明对比；后两者都要面对独立种植者带来的质量波动。 Fruitist 与 RipeLocker 的技术合作（低气压真空舱可将货架期延长至三倍）进一步拉开货架期护城河，竞争对手仍主要依赖传统冷链。
              公司在北美拥有 12,500+ 个零售门店，渠道深度可观，新进入者需要多年才能复制。

              但 Fruitist 面临的威胁也很实在。 Driscoll's 的在位优势很强：其估计占美国浆果市场 33%，掌握货架、零售商关系和消费者品牌认知，而 Fruitist 仍在搭建这些资产。 Driscoll's
              直接反击超大高端蓝莓细分市场——推出 Sweetest Batch 或新的专属高端线——不能排除。 Hortifrut 在秘鲁持续更新品种，意味着最早到 2027-2028 年，一个结构改善后的
              Hortifrut 生产基地会在高端市场更猛烈地竞争。 Fall Creek/Sekoya 推动的基因竞赛意味着，采用高端 Sekoya 品种的第三方种植者会把越来越接近 Fruitist
              的质量推向市场，零售价还可能更低，长期可能把超大蓝莓溢价大宗化。 秘鲁蓝莓出口量在 2025-26 年创纪录增长 20%，供应增加正在压低蓝莓批发价，这会威胁 Fruitist 约 50% 的消费者溢价。
              2026 年初，截至 3 月中旬进口水果约占美国蓝莓出货量 99%，进一步说明秘鲁产地水果（Fruitist 与竞争对手均在此运营）主导供应格局。
            claimRefs:
              - CP036
              - CP037
              - CP038
              - CP039
