      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Fruitist 由 Steve Magami 和 Thomas Snyder 联合创立，二人均有私募股权背景。Steve Magami 是联合创始人、CEO
              和董事会执行董事长；他在秘鲁北部海岸考察生物燃料原料时看到当地出色的浆果种植条件，由此构思出公司概念。随后，他招募前私募股权同事 Thomas Snyder，于 2012
              年共同创立公司。过去十余年增长中，Magami 一直是公司的公开面孔、品牌叙事者和战略驱动者，也形成显著关键人依赖：投资者信心、零售商关系、品牌叙事和全球扩张战略都紧密绑定其领导力。2025
              年，公司大幅扩充高级管理层，四项高规格任命意在支撑资本市场准备和技术规模化。2025 年 9 月，Rich Sullivan 出任首席财务官，带来 DreamWorks、Twitter、STX
              Entertainment、SurveyMonkey 等高增长公司超过 25 年的财务经验。Jim Trahanas 加入，成为 Fruitist 首任首席技术官，强化供应链中的 AI 和技术能力。Thomas
              Seifert 加入董事会并担任审计委员会主席，带来 IPO 和治理经验；他曾任 Cloudflare CFO，并带领其完成 IPO、走到 $74B 市值，也曾在 AMD 和 Symantec 担任高管。June
              Yang 加入担任独立董事，她曾负责 Google Cloud 的 AI 与行业解决方案，并同时在 MSCI Inc.、NetApp、UiPath 和 AHEAD 担任董事，贡献 AI 与技术领导力。2024 年
              8 月股权轮后，Aliment Capital 的 Ben Belldegrun 取得董事席位。成熟 CPG 商业人才（履历包括 Nestlé、McKinsey 和 The Wonderful
              Company）叠加新引入的财务、技术和治理领导层，显示公司正在主动为潜在公开发行和长期机构持有做准备。
