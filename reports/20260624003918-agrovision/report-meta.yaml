companyProfile:
  summary: "Agrovision Corp., which rebranded to Fruitist Holdings Inc. in April 2025, is a Los Angeles-headquartered, vertically integrated global berry company founded in 2012 by Steve Magami and Thomas Snyder. Under the consumer brand Fruitist (and Big Skye in China), it grows, packs, cold-stores, ships and markets premium 'snackable' jumbo blueberries, raspberries, blackberries and cherries from farms spanning roughly ten microclimates led by a ~2,100-hectare Peru hub. The company reached a $1B+ valuation in an August 2024 equity round, surpassed $400M in trailing-12-month sales by April 2025, and supplies 12,500+ North American retail doors (Costco, Walmart, Whole Foods, Trader Joe's, Publix and others) across roughly 40 countries. It has raised ~$443M of equity plus a $400M credit facility, and its vertical integration and proprietary genetics are positioned as the cure for inconsistent 'berry roulette' quality that lets it command an estimated ~50% price premium."
  foundedDate: "2012-01-01"
  founders:
    - name: "Steve Magami"
      role: "Co-Founder, CEO & Executive Chairman"
      background: "Private-equity background; conceived the premium-berry concept while scouting biofuel feedstocks in Peru and built Agrovision's vertically integrated model."
      claimRefs: [CO002, CO008]
    - name: "Thomas Snyder"
      role: "Co-Founder"
      background: "Private-equity colleague recruited by Magami to co-found the company in 2012."
      claimRefs: [CO002, CO009]
  foundingLocation: "Los Angeles, California (with Peru operating origin)"
  headquarters: "Century City, Los Angeles, CA"
  productSummary: "Premium fresh berries sold under the Fruitist brand — flagship jumbo blueberries plus raspberries, blackberries and (via the 2024 ZurGroup acquisition) cherries — including a 'Snack Cups' format, marketed on consistent size, flavour and shelf life enabled by vertical integration, proprietary non-GMO genetics and RipeLocker postharvest technology."
  customerFocus: "Mass-premium grocery and club retailers in North America (Costco, Walmart, Whole Foods, Trader Joe's, Publix, Sprouts, Albertsons, Wakefern/ShopRite) plus international distribution across China, India, the UK, Europe, the Middle East and Southeast Asia; the end consumer is a health-oriented snacker willing to pay a premium for guaranteed quality."
  businessModel: "Vertically integrated grower-packer-marketer: Fruitist owns or controls farms, genetics, cold chain and branding, capturing margin across the chain and selling branded premium berries at a price premium to commodity fruit, funded by equity and a large credit facility for capital-intensive farm expansion."
