  topStrengths:
    - 高端品牌品类领先：Fruitist 靠纵向整合解决「莓果抽盲盒」的一致性问题，在北美 12,500+ 门店和约 40 个国家估计拿到约 50% 溢价。
    - 需求拉动的高速增长：FY2024 销售额约 $350M，到 2025 年 4 月过去 12 个月升至 $400M+；Costco、Walmart、Whole Foods 等顶级零售商反复铺货，叠加健康零食顺风，验证了需求。
    - >-
      资本纵深和蓝筹背书强：Aliment Capital、Steve Kaplan、Ray Dalio 家办、J.P. Morgan Asset Management 等提供约 $443M 股权资金，另有 $400M
      信贷额度，支撑以秘鲁约 2,100 公顷枢纽为核心、覆盖 10 个微气候的全年供应基地。
    - 技术护城河有差异：自有非转基因遗传与育种、AI 采收预测、机器人，以及 RipeLocker 采后合作，实质延长保鲜期并守住高端品质。
  topRisks:
    - 私人公司不透明：没有披露审计财务、毛利率、EBITDA 或精确增长，$1B+ 估值和单位经济难以核验，是核心尽调阻碍。
    - 农业与气候集中度高：公司只做莓果，作物和地域都集中在秘鲁枢纽，暴露于 El Nino、霜冻、干旱、病害和产量波动。
    - 贸易、食品安全和劳工风险并存：约 10% 进口关税（印度为 26%）、鲜果召回风险（有 Listeria / Cyclospora 先例），以及在工资和用工实践受审视时依赖最多 15,000 名秘鲁田间工人。
    - 竞争和退出风险高：Driscoll's 在规模、遗传资源和品牌上占优；IPO 窗口也未跑通，Dole 等上市农产品可比公司约 2x 销售额，远低于 Fruitist 隐含的高端倍数。
  unresolvedGaps:
    - 没有审计财务：毛利率、EBITDA、净利率、现金消耗、现金跑道和精确同比收入增长均未披露。
    - 资本结构细节：精确累计融资（股权与已提款信贷拆分）、债务契约、老股交易，以及融资后股权和董事会控制权都未公开。
    - IPO 路径和估值基础：时间表、目标倍数，以及相对上市农产品可比公司支撑 $1B+ 估值的依据，管理层尚未确认。
    - 运营 KPI：每公顷产量、生产成本、客户 / 零售商集中度，以及经常性收入与季节性收入的真实规模均未披露。
