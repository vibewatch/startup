  - id: FV003
    title: Valuation Range — Bear / Base / Bull Scenarios
    type: range
    layout: standard
    summary: >-
      Low–high enterprise value range for Fruitist under three scenarios at a hypothetical
      IPO filing. Bear anchors to commodity produce multiples on current revenue; base
      applies premium branded food multiples; bull applies snacking-platform framing.
      Current $1B+ mark sits at the base–bull boundary.
