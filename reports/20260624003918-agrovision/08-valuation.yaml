company:
  name: Agrovision
chapter:
  number: 8
  title: Valuation
  summary: >-
    Fruitist (Fruitist Holdings Inc., formerly Agrovision Corp) carries a $1B+ valuation
    established in the August 2024 equity round and reconfirmed in the $150M J.P. Morgan-led
    close in October 2025, with $600M+ in total capital raised against ~$350M FY2024 revenue
    and $400M+ last-twelve-months revenue as of April 2025. The implied EV/Revenue of
    ~2.5–3x places it firmly above public commodity produce peers (Dole 0.25x; Fresh Del Monte
    0.45x; Hortifrut 1.3x) and demands investors underwrite Fruitist as a premium branded
    snacking platform rather than a berry grower. Skeptical observers — including Fruitnet and
    Renaissance Capital — flag the compressed 13-year path to IPO, execution risk in an
    agricultural cycle, and the post-2021 food sector multiple compression as material
    downside vectors. Recommendation: track with active research-more criteria; initiating
    investment requires profitability disclosure and valuation confirmation at sub-2x
    EV/Revenue on forward revenue.

sections:
  - id: valuation-context-and-current-mark
    title: Current Valuation Mark and Implied Multiples
    body: >-
      Fruitist's last disclosed valuation exceeds $1 billion, established through the August
      2024 round in which Aliment Capital, Steve Kaplan (Oaktree co-founder) and the Ray Dalio
      family office subscribed $100 million of equity. The valuation was maintained at the same
      level in the October 2025 $150 million round led by J.P. Morgan Asset Management, which
      brought total equity raised to $443 million. Including a separately arranged $400 million
      credit facility (up from a prior $210 million line), the company's total capital deployed
      since inception exceeds $600 million according to Pitchbook data. PremierAlts, a secondary
      market data provider, places the market-implied valuation at $1 billion as of mid-2026,
      indicating no post-round appreciation has been captured in secondary markets.

      On reported revenue of approximately $350 million for fiscal 2024 (per the LA Business
      Journal) and $400 million-plus in the twelve months to April 2025 (per CNBC and AgFunderNews),
      the implied EV/Revenue ratio sits at approximately 2.5x to 3x. This multiple is meaningfully
      above the median commodity produce company (Dole: 0.25x; Fresh Del Monte: 0.45x) and the
      global berry grower Hortifrut (approximately 1.3x despite negative EBITDA), but broadly
      consistent with what Argo Advisory and NYU Stern data identify as the realistic range for
      premium branded food companies achieving above-average revenue growth. The company has not
      disclosed EBITDA, net income or gross margin figures publicly, so no EV/EBITDA multiple
      can be computed, and the analysis must rely on EV/Revenue and qualitative brand premium
      arguments. Fruitist commands a roughly 50 percent retail price premium over commodity
      berries, which is the principal empirical anchor for an above-commodity multiple.
      J.P. Morgan Asset Management cited "control of its value chain, significant organic growth
      opportunity ahead, and positioning as a driving force of premiumization of berries"
      when committing its $150 million, signalling that institutional capital continues to price
      the business as a branded platform rather than a farming operation.
