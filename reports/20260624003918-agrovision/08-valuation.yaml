        - 'No gross margin, EBITDA, or net income data publicly disclosed'
        - Cannot validate 2–3x EV/Revenue multiple without confirming margin premium
        - Request in data room; await S-1 filing
      - - Cap-table and liquidation preferences
        - '$443M equity across multiple rounds; preference stack unknown'
        - High preference overhang can substantially reduce common equity value at IPO
        - Legal review of shareholder agreement; cap-table waterfall model
      - - Revenue bridge FY2024–2026
        - 'Only $350M FY2024 and $400M+ LTM (Apr 2025) publicly disclosed'
        - Forward valuation depends on whether 15–25% growth is sustained post-2025
        - Management guidance; data-room financials
      - - Profitability of cherry / multi-berry expansion
        - New berry lines and ZurGroup (cherry) integration margins undisclosed
        - Expansion category could dilute margins if blueberry gross margin is highest
        - Segment-level P&L in data room
      - - Credit facility covenants and covenant compliance
        - '$400M credit facility terms, covenants and compliance status unknown'
        - Could restrict dividend or IPO distributions; covenant breach risk
        - ABF Journal facility terms; request covenant documentation
    notes: >-
      Priority order: EBITDA disclosure is the single most important input; without it,
      the valuation analysis cannot proceed beyond revenue multiples.
    claimRefs: [CV031, CV036, CV003, CV035]

figures:
  - id: FV001
    title: Recommendation Logic Flow
    type: flow
    layout: standard
    summary: >-
      Traces the evidence chain from four input dimensions — scale proof, brand moat,
      risk profile and valuation discipline — to the track recommendation. Each node
      represents an assessed dimension; edges show how the combined weight of evidence
      flows to the final recommendation.
    data:
      nodes:
        - id: scale
