    data:
      nodes:
        - label: "Exclude unrelated namesakes"
          detail: "Real-estate house-hunter content is outside the cybersecurity market boundary."
        - label: "Define the workflow"
          detail: "IOC search, threat-cluster investigation, lead enrichment, correlation, and response support."
        - label: "Identify the data substrate"
          detail: "Existing security systems plus customer Snowflake or Oracle Cloud data paths."
        - label: "Identify the buyer group"
          detail: "Security leadership, security engineering, SOC analysts, and data-platform stakeholders."
        - label: "Use contract evidence only as a proxy"
          detail: "Vendr reports an average contract value; CostBench reports a directional median from three buyer reports."
        - label: "Keep TAM, SAM, and SOM open"
          detail: "No retained source supplies a market value, geography, growth rate, and methodology."
    approximationNotes: "Qualitative evidence funnel only; node order does not imply conversion rates or a mathematical market-size cascade."
    claimRefs:
