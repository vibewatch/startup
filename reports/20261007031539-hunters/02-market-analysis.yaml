chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Hunters is positioned in the security-operations workflow market, with its
    addressable use case centered on threat detection, investigation, correlation,
    and response over customer-controlled telemetry. The assigned evidence supports
    enterprise-scale contract proxies but not a defensible market-wide TAM, SAM, or
    SOM; pricing opacity, small benchmark samples, integration burden, and incomplete
    public operating evidence therefore constrain adoption and valuation conclusions.
sections:
  - id: "market-boundary"
    title: "Market Boundary and Substitutes"
    body: >-
      The evidence supports a narrow market boundary around security-operations
      workflows rather than cybersecurity spend as a whole. Hunters' documentation
      exposes indicator-of-compromise search, threat-cluster investigation,
      automatic investigation, and data-flow monitoring, while historical reporting
      describes integration with existing systems instead of a proprietary
      collection stack. Included spend is therefore the software and operating
      workflow used to ingest security telemetry, correlate leads, investigate
      activity, and support response. Endpoint prevention, general-purpose cloud
      storage, non-security analytics, and unrelated uses of the word "hunters" are
      outside the boundary. One allocated industry-trends result was a real-estate
      story about house hunters; it is retained only as direct evidence of search
      ambiguity and excluded from every sizing proxy. Manual analyst-led threat
      hunting is the clearest status-quo substitute in the retained evidence.
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM003"
      - "CM004"
      - "CM006"
      - "CM011"
      - "CM016"
    tableRefs:
      - "TM001"
    figureRefs:
      - "FM001"
  - id: "buyer-and-adoption"
    title: "Buyer, User, and Adoption Path"
    body: >-
      The public evidence identifies security leadership and security engineering
      roles, but it does not disclose a standardized budget owner or procurement
      path. Hunters' own homepage presents testimonials from a chief information
      security officer, a security engineering manager, and a former deputy CISO.
      Those company-controlled testimonials describe broader detection coverage,
      detection-engineering support, and timelier response as desired outcomes.
      Day-to-day users are more directly visible in the documentation: analysts
      search indicators, inspect threat clusters, and review automatically enriched
      leads, while platform or data engineers connect Snowflake and Oracle Cloud
      data paths. The adoption path is therefore best treated as a joint security
      and data-platform evaluation, not a simple seat purchase. Economic approval,
      implementation responsibility, renewal timing, and the split between security
      and cloud-infrastructure budgets remain private diligence questions.
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM003"
      - "CM012"
      - "CM013"
    tableRefs:
      - "TM003"
  - id: "sizing-evidence"
    title: "Evidence-Constrained Sizing"
    body: >-
      No retained source provides a market-wide value, growth rate, geography, or
      methodology sufficient to calculate TAM, SAM, or SOM. The available numerical
      evidence instead consists of vendor-level commercial proxies. Vendr reports a
      $277,138 average contract value and says annual pricing is approximately
      $280,000, with a maximum around $600,000, based on a very small transaction
      set. CostBench reports a $440,000 annual median from three third-party buyer
      reports and labels the figure directional. These values use different
      statistics and samples, so they are not a range and should not be averaged.
      Prospeo's $15 million annual-revenue and $48 million estimated-valuation
      figures describe the company, not market demand; the valuation is explicitly
      modeled from an industry average. The defensible conclusion is enterprise
      contract scale with substantial uncertainty, not a quantified market size.
    claimRefs:
      - "CM007"
      - "CM008"
      - "CM009"
      - "CM010"
      - "CM011"
    tableRefs:
      - "TM002"
  - id: "drivers-and-constraints"
    title: "Growth Drivers and Adoption Constraints"
    body: >-
      The strongest demand mechanism in the assigned evidence is operational
      leverage. TechCrunch described threat hunting as traditionally manual and
      quoted an investor arguing that specialized skills were difficult to hire;
      Hunters' current materials claim automated enrichment, correlation, and
      investigation can absorb part of that workload. Integration with existing
      systems and customer data platforms can lower replacement scope, but it also
      creates a dependency on telemetry quality, connector coverage, and data-flow
      health. Commercial friction is material: public prices are quote-based, the
      two available contract benchmarks have tiny samples, and RFP.wiki says public
      pricing and retention details are limited while some users want more API
      endpoints and advanced workflows may require vendor assistance. RFP.wiki's
      comparison is directional rather than an independent market benchmark.
      Adoption timing should therefore be underwritten against renewal events,
      implementation effort, and measurable analyst-hours saved.
    claimRefs:
      - "CM002"
      - "CM003"
      - "CM004"
      - "CM005"
      - "CM006"
      - "CM007"
      - "CM008"
      - "CM014"
      - "CM015"
