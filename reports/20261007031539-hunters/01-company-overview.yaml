company:
  name: "Hunters"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Hunters is a Tel Aviv-founded cybersecurity startup that has raised $118.4 million across four equity financing rounds to build an AI-driven next-generation SIEM and autonomous SOC platform. Operating on an open security data lake architecture backed by strategic investors Snowflake and Databricks, the company achieves substantial enterprise contract values while maintaining private disclosures regarding GAAP revenue, gross margins, and post-2022 cash runway."
sections:
  - id: "identity-and-mission"
    title: "Company Identity and Architectural Mission"
    body: "Hunters was founded in 2018 in Tel Aviv, Israel, to address a fundamental bottleneck in modern enterprise security operations: the manual, talent-constrained nature of threat hunting and alert triage. Rather than deploying proprietary endpoint agents or charging ingest-based data taxes common to legacy SIEM architectures, Hunters pioneered an autonomous threat-hunting machine that correlates cross-stack telemetry. The platform ingests telemetry across disparate enterprise environments and deposits normalized data feeds into customer-shared Snowflake databases, enabling security teams to run advanced threat detection, enrichment, prioritization, and automated investigation directly on open data lake infrastructure without vendor lock-in."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO001"
  - id: "founding-and-governance"
    title: "Founding Team, Leadership, and Governance"
    body: "The company was co-founded by Chief Executive Officer Uri May and Chief Technology Officer Tomer Kazaz. Both founders began their technical and operational careers as cyber intelligence officers in the Israel Defense Forces, giving the executive leadership team authentic founder-market fit in enterprise threat modeling and adversarial tactics. Corporate governance is reinforced by former Unit 8200 commander Ehud Schneerson, who joined the board of directors alongside Blumberg Capital's co-lead seed investment. Operationally, the organization maintains an estimated workforce of approximately 91 to 181 employees distributed across thirteen operational departments spanning engineering, product, threat research, and global commercial go-to-market."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-stakeholders"
    title: "Capitalization Structure, Investors, and Strategic Backing"
    body: "Hunters has raised $118.4 million in cumulative equity capital across four disclosed financing rounds, scaling from an initial $5.4 million seed round in May 2019 led by YL Ventures and Blumberg Capital to a $68.0 million Series C financing completed in January 2022 led by Stripes. The company's capitalization table reflects a rare combination of top-tier institutional cybersecurity venture capital firms and major strategic cloud infrastructure providers. Prominent institutional backers include Bessemer Venture Partners, YL Ventures, DTCP, U.S. Venture Partners, and Microsoft's venture fund M12, complemented by strategic balance-sheet investments from Snowflake, Databricks, Cisco Investments, and Okta Ventures that cement Hunters' architectural alignment with enterprise cloud data ecosystems."
    claimRefs:
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO003"
  - id: "milestones-and-market-traction"
    title: "Corporate Milestones, Commercial Traction, and Diligence Watch-Outs"
    body: "Since its 2018 inception, Hunters has evolved from an autonomous threat-hunting feature into a full-scale Next-Gen SIEM and SOC platform, integrating directly with core enterprise infrastructure including Microsoft Defender for Endpoint, AWS, CrowdStrike, and InfoBlox. Enterprise purchasing data reveals meaningful commercial contract traction, with average annual contract values reaching approximately $280,000 and verified multi-module enterprise deployments reaching median price points of $440,000 annually. However, diligence benchmarks also indicate notable watch-outs: users report limitations in API endpoint customization and ongoing vendor configuration dependencies, while the lack of updated financial disclosures since 2022 leaves GAAP revenue, gross margin, and burn rates unconfirmed."
    claimRefs:
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
