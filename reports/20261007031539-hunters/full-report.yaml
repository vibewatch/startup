      - number: '2.2'
        title: Buyer, User, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The public evidence identifies security leadership and security engineering roles, but it does not
              disclose a standardized budget owner or procurement path. Hunters' own homepage presents testimonials from
              a chief information security officer, a security engineering manager, and a former deputy CISO. Those
              company-controlled testimonials describe broader detection coverage, detection-engineering support, and
              timelier response as desired outcomes. Day-to-day users are more directly visible in the documentation:
              analysts search indicators, inspect threat clusters, and review automatically enriched leads, while
              platform or data engineers connect Snowflake and Oracle Cloud data paths. The adoption path is therefore
              best treated as a joint security and data-platform evaluation, not a simple seat purchase. Economic
              approval, implementation responsibility, renewal timing, and the split between security and
              cloud-infrastructure budgets remain private diligence questions.
