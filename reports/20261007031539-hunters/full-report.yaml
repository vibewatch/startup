      nodes:
        - id: tech-differentiation
          label: Autonomous Open XDR Architecture
          description: Integration with cloud data lakes like Snowflake and high-fidelity attack storytelling
        - id: enterprise-validation
          label: Proven Enterprise Traction
          description: Production adoption by organizations like Snowflake and average ACV near $280k
        - id: competitive-headwinds
          label: Intense SIEM Rivalry
          description: Competition against incumbent platforms like Splunk with high switching friction
        - id: financial-opacity
          label: Absence of Disclosed Metrics
          description: No current audited ARR, NRR, gross margin, or valuation disclosure since 2022
