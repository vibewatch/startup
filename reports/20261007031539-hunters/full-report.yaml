          to: competitive-headwinds
        - from: competitive-headwinds
          to: financial-opacity
        - from: financial-opacity
          to: down-round-risk
        - from: down-round-risk
          to: final-recommendation
    approximationNotes: Flow diagram maps qualitative diligence stages leading to final underwriting disposition.
