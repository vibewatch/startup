        - Architectural and funding history verified, but operating performance metrics remain private
        - Requires direct verification of customer retention and recurring revenue
      - - Risk Rating
        - high
        - Intense competition from major SIEM providers and unverified cash runway posture
        - Demand liquidation preference inspection and down-round protections
      - - Valuation Stance
        - unknown
        - No verified post-money valuation published since the 2022 Series C funding event
        - Do not accept unanchored secondary valuations or self-published revenue multiples
    notes: >-
      Recommendation and risk ratings reflect verified absence of current revenue and cap-table disclosures as of
      2026-10-07.
