        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest demand mechanism in the assigned evidence is operational leverage. TechCrunch described
              threat hunting as traditionally manual and quoted an investor arguing that specialized skills were
              difficult to hire; Hunters' current materials claim automated enrichment, correlation, and investigation
              can absorb part of that workload. Integration with existing systems and customer data platforms can lower
              replacement scope, but it also creates a dependency on telemetry quality, connector coverage, and
              data-flow health. Commercial friction is material: public prices are quote-based, the two available
              contract benchmarks have tiny samples, and RFP.wiki says public pricing and retention details are limited
              while some users want more API endpoints and advanced workflows may require vendor assistance. RFP.wiki's
              comparison is directional rather than an independent market benchmark. Adoption timing should therefore be
              underwritten against renewal events, implementation effort, and measurable analyst-hours saved.
