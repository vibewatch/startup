  - id: TV003
    title: Scenario Underwriting and Return Analysis
    columns:
      - Scenario
      - Operating & Market Assumptions
      - Valuation & Return Logic
      - Downside Triggers & Key Risks
      - Probability
    rows:
      - - Bull Case
        - Accelerated displacement of legacy SIEMs; Snowflake security ecosystem tailwinds expand gross margins
        - Strong revenue multiple expansion in strategic M&A or public market window
        - Incumbent bundling from platform security vendors caps large enterprise TAM
        - 25%
      - - Base Case
        - Steady expansion in cloud-native mid-market SOCs; average contract values hold near $280k
        - Moderate returns anchored on private peer SaaS acquisition multiples of 4x to 6x ARR
        - Elongated procurement sales cycles and customer concentration pressure margins
        - 50%
      - - Bear Case
        - Decelerating net new ARR growth; high customer acquisition costs and cash burn exhaust reserves
        - Dilutive down-round recapitalization or fire-sale distressed asset acquisition
        - Rapid churn to platform vendors offering integrated endpoint and SIEM suites
        - 25%
    notes: >-
      Scenario probabilities and multiples represent analytical underwriting frameworks subject to full financial
      confirmation.
    claimRefs:
      - CV001
      - CV006
