  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Structure
        blocks:
          - type: paragraph
            body: >-
              Hunters commercializes its autonomous threat hunting and security operations platform via multi-tier
              enterprise SaaS subscriptions centered on its core SOC Platform and Pathfinder AI offerings. According to
              third-party commercial benchmarking data from Costbench, Hunters offers two primary software plans without
              any free entry tier: the core SOC Platform and Pathfinder AI, both priced under quote-based custom
              enterprise agreements. Buyer transaction data indicates that enterprise contract sizes are substantial,
              reflecting large-scale data ingestion and centralized threat telemetry processing. Costbench reports a
              median annual contract value of $440,000 based on verified third-party enterprise purchases, while
              procurement platform Vendr records an average annual contract value of $277,138 across completed customer
              software transactions, spanning a range from entry pricing up to $600,000 annually. In addition to
              software platform licensing, Hunters offers managed detection engineering and dedicated analyst support
              through its specialized in-house research group, Team Axon, which functions as an operational add-on for
              customers seeking to outsource advanced detection authoring and threat triage.
            claimRefs:
              - CI001
