            figureRef: FI001
            claimRefs:
              - CI002
              - CI006
              - CI007
              - CI008
      - number: '4.3'
        title: Commercial Traction and Revenue Benchmark Dispersal
        blocks:
          - type: paragraph
            body: >-
              Publicly verifiable indicators of commercial traction for Hunters diverge significantly across third-party
              market estimators, highlighting the opacity of private vendor financials. Market database GetLatka
              estimated Hunters' annualized revenue at $7.7 million ARR as of late 2024 (up from an estimated $5.3
              million in 2022) with a reported headcount of 246 employees, including 18 quota-carrying sales
              representatives. In contrast, lead intelligence aggregator Prospeo estimated annual company revenue at $15
              million with an imputed revenue per employee of $75,000. These wide discrepancies reflect differing
              estimation methodologies, unverified self-reporting, and the absence of regulatory SEC filings. Enterprise
              adoption is corroborated qualitatively by enterprise case studies and customer references, including
              deployments at Booking.com, Snowflake, Netgear, Cimpress, Pennymac, and Unzer. However, authoritative
              software metrics such as Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and Annual Recurring
              Revenue (ARR) remain unverified private data.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Capital Adequacy, Cash Burn, and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              Hunters has accumulated $118 million in total venture financing across five disclosed investment rounds
              since its founding in 2018, culminating in a $68 million Series C funding round announced in January 2022
              led by Stripes alongside Bessemer Venture Partners, YL Ventures, Blumberg Capital, USVP, and strategic
              investors Microsoft M12, Databricks, Snowflake, and Okta. At the time of the Series C round, Hunters
              reported a team size of 110 employees, which expanded to approximately 185 employees by August 2026
              according to Tracxn records (and 246 according to GetLatka estimates). Crucially, the public record
              reveals no subsequent equity financings or venture debt facilities completed between January 2022 and late
              2026. Sizing a 180-to-240 person international engineering and enterprise sales organization across Tel
              Aviv and North America indicates an annual cash burn rate that likely consumed substantial Series C
              reserves over the intervening four-year operating window. With no audited financial statements or
              follow-on capital disclosed, capital efficiency cannot be verified, creating acute financing risk if
              operational cash flows do not sustain ongoing overhead.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing Dependency and Uncorroborated Runway Duration
            body: >-
              Hunters raised $118 million through its January 2022 Series C financing round, but has recorded no
              subsequent equity or venture debt capitalization over the subsequent four-year operating window. Operating
              a global enterprise headcount estimated between 185 and 246 personnel implies substantial annual operating
              expenditures that exceed third-party revenue estimates ($7.7M to $15M). Without fresh capital or validated
              operating cash flow break-even, Hunters faces severe runway pressure and potential recapitalization or
              acquisition risk.
            calloutType: risk
            claimRefs:
              - CI013
              - CI014
              - CI015
          - type: callout
            title: Divergence Between Ingestion Pricing and Realized Unit Margins
            body: >-
              While Hunters positions its platform as a cost-effective alternative to legacy SIEM licensing models by
              standardizing data on open OCSF formats, the operational requirement to maintain the Team Axon threat
              research service creates a semi-variable human cost structure. Unlike pure-play SaaS platforms that
              achieve incremental gross margins above 85%, Hunters must continuously fund advanced research personnel to
              tune detection rules, which threatens to compress unit margins as client counts scale.
            calloutType: insight
            claimRefs:
              - CI005
              - CI007
              - CI008
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Architecture & Customer Workflow Transformation
        blocks:
          - type: paragraph
            body: >-
              Hunters positions its SOC Platform as a direct next-generation SIEM alternative targeted at lean and
              enterprise security teams burdened by alert fatigue and escalating log licensing costs. Traditional
              Security Operations Center (SOC) workflows require tier-1 analysts to manually inspect fragmented security
              alerts across disparate endpoint, identity, and cloud monitoring tools, followed by labor-intensive query
              construction in vendor-specific languages. Hunters re-engineers this operational model by establishing an
              open security data lake architecture, standardizing all ingested security telemetry onto the Open
              Cybersecurity Schema Framework (OCSF). Rather than capturing alerts in isolated vendor silos, the platform
              continuously correlates disparate events across the IT and cloud estate into unified, multi-stage attack
              stories. By leveraging machine-powered enrichment, correlation, and automated scoring, the platform
              resolves false positives and surfaces high-risk threats, reportedly reducing manual alert triage volume by
              80% without requiring hand-crafted playbook maintenance. Furthermore, the architecture permits enterprises
              to either supply their own data lake—such as a dedicated Snowflake database instance—or utilize a
              Hunters-managed repository, freeing security organizations from punitive ingestion-based vendor lock-in.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE006
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE003
              - CE005
              - CE008
              - CE010
      - number: '5.2'
        title: Operating Architecture, Detection Engineering & Cloud Ingestion
        blocks:
          - type: paragraph
            body: >-
              The core technical differentiator of Hunters lies in eliminating routine in-house detection engineering
              and decoupling data storage from analytic execution. In legacy SIEM environments, security engineering
              teams spend substantial operational cycles authoring, testing, and updating detection logic to account for
              evolving adversary tradecraft. Hunters absorbs this operational burden through Team Axon, a dedicated
              internal research group that develops, tests, and pushes continuous out-of-the-box detection rules across
              enterprise cloud and on-premises environments, reducing excessive alert volume by 90%. Under the hood, the
              backend distributed processing infrastructure is implemented primarily in Python microservices utilizing
              frameworks such as FastAPI, containerized on Kubernetes, and orchestrated across cloud environments
              including Amazon Web Services (AWS). Telemetry pipelines support real-time streaming via message buses
              such as Apache Kafka and asynchronous pub-sub channels, standardizing semi-structured data before writing
              into columnar data warehouses like Snowflake. This open data lake strategy enables customer security
              engineering teams to query the raw standardized feed directly, execute custom SQL models, and build
              bespoke security applications alongside Hunters' automated investigation engine.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE008
              - CE009
              - CE010
      - number: '5.3'
        title: Deployment, Ecosystem Integrations & Technical Limitations
        blocks:
          - type: paragraph
            body: >-
              Deployment of Hunters is engineered for rapid time-to-value, achieving operational readiness in days
              without requiring professional services engagements or proprietary endpoint sensors. Instead of deploying
              custom collection agents, Hunters gathers telemetry through API-based connectors and native integrations
              spanning major identity, endpoint, and cloud infrastructure providers. However, independent user
              evaluations and competitive RFP benchmarks indicate notable operational boundaries and adoption friction.
              While user sentiment commends Hunters' AI-driven investigation triage and correlation effectiveness
              (holding a 3.6 RFP.wiki composite rating across 42 reviews), practitioner feedback highlights that
              advanced investigation workflows still require vendor assistance and specialized analyst proficiency.
              Reviewers also report documentation gaps for long-tail custom parsers, and independent uptime SLAs or
              large-scale latency benchmarks remain undisclosed. Furthermore, third-party buyer guides indicate an
              average annual contract value of approximately $280,000, creating a significant budget hurdle if
              enterprise teams encounter unexpected data lake query costs or require premium incident response services
              from Team Axon during complex multi-cloud deployments.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE004
              - CE007
              - CE013
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Impact of Open Security Data Lake Architecture
            body: >-
              By standardizing data on the Open Cybersecurity Schema Framework (OCSF) and leveraging Snowflake as an
              open security data lake, Hunters sidesteps the predatory data ingestion tax imposed by legacy SIEM
              providers. Enterprise customers like Pennymac and Snowflake can query raw standardized security feeds
              directly for custom analytics, transforming the SIEM from a closed operational black box into an open
              enterprise telemetry asset.
            calloutType: insight
            claimRefs:
              - CE002
              - CE005
              - CE009
          - type: callout
            title: Market Transparency and Independent Verification Gaps
            body: >-
              Despite positive customer feedback regarding AI triage speed, independent technical reviews on RFP.wiki
              note that advanced threat hunting workflows continue to depend heavily on senior analyst expertise or
              vendor support. In addition, the lack of public uptime SLAs, latency benchmarks, and granular pricing
              transparency necessitates rigorous technical proof-of-concept testing prior to enterprise commitment.
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Target Buyers
        blocks:
          - type: paragraph
            body: >-
              Hunters primarily targets enterprise security operations centers (SOCs) and security engineering teams
              seeking an autonomous threat-hunting and next-gen SIEM platform. The economic buyer is typically the Chief
              Information Security Officer (CISO) or VP of Security Operations, while the daily operational users
              include security engineering managers, threat hunters, and SOC detection engineers. Commercial adoption
              spans diverse enterprise sectors, prominently including financial services, digital commerce, mass
              customization technology, and cloud data platforms. Enterprises choose Hunters to replace manual alert
              triage and fragmented alert correlation with machine-powered detection, investigation, and automated
              attack-story synthesis, directly ingesting telemetry into modern security data lakes like Snowflake and
              Databricks [CU001, CU002, CU003, CU004]. However, public disclosures do not segment revenue by industry
              vertical, customer tier, or geography, obscuring the precise distribution of annual recurring revenue
              across mid-market versus large enterprise accounts [CU011].
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU011
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU008
      - number: '6.2'
        title: Adoption Trajectory and Deal Economics
        blocks:
          - type: paragraph
            body: >-
              Publicly accessible deal intelligence reveals an enterprise-oriented commercial profile with meaningful
              price dispersion and high annual contract commitments. Transaction benchmarking from procurement platforms
              indicates an average annual contract value of approximately $277,138, with enterprise deployments ranging
              from lower entry pricing up to $600,000 annually across negotiated multi-year agreements [CU005, CU006].
              Early commercialization in 2019 began with a closed set of pilot accounts following initial seed funding,
              before expanding into enterprise production deployments across cloud-forward organizations [CU007]. While
              third-party directory listings attribute estimated annual revenues of $15 million, official verifiable
              disclosures regarding net revenue retention (NRR), gross revenue retention (GRR), and logo churn rates
              remain undisclosed by the company [CU008, CU009]. Consequently, validating whether customer accounts
              expand their annual commitments or experience contract contraction requires private diligence underwriting
              [CU012].
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU014
      - number: '6.3'
        title: Named Deployments and Production Outcomes
        blocks:
          - type: paragraph
            body: >-
              Verified customer testimonials confirm active production utilization of Hunters for core threat detection,
              engineering automation, and incident mitigation across global enterprise environments. At mortgage lender
              Pennymac, the security operations team uses Hunters to handle detection engineering and stream normalized
              raw feeds into a shared Snowflake database for custom data modeling [CU002]. At payment service provider
              Unzer, security engineering utilizes Hunters to manage alert events, accelerate incident response, and
              reduce downstream business disruption [CU003]. At technology conglomerate Cimpress, deployment eliminated
              manual alert maintenance, expanding threat detection coverage while reducing security operations overhead
              [CU004]. Strategic enterprise references also include Booking.com and Snowflake, which deploy the platform
              across complex cloud footprints [CU008]. Despite these validated production deployments, public case
              studies are largely vendor-curated without independent customer audit metrics or negative review
              benchmarks [CU010, CU013].
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU008
              - CU010
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU008
              - CU010
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
      - number: '6.4'
        title: Retention, Expansion, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              The sustainability of Hunters' commercial model is exposed to ecosystem dependency and customer
              concentration risks. Analysis of technology partnerships indicates extensive technical integrations across
              over 100 enterprise software vendors, including Amazon Web Services, Microsoft, Google Cloud, Snowflake,
              Databricks, Okta, and CrowdStrike [CU001, CU014]. Hunters relies heavily on customers maintaining cloud
              data lake infrastructure, such as Snowflake, to achieve cost efficiency in security log analytics. High
              average contract values ($277k+) create long enterprise sales cycles and procurement friction, where
              budget ownership is scrutinized against competing native SIEM offerings from hyperscalers and established
              vendors [CU005, CU006]. Because cohort churn, account retention rates, and top-customer revenue
              concentration are private, investors face uncertainty regarding gross margin resilience and customer
              lifetime value [CU012, CU015].
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU012
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Customer Alignment with Data Lake Infrastructure
            body: >-
              Hunters' primary commercial differentiator in the enterprise SOC market is its architectural synergy with
              cloud data lake platforms like Snowflake and Databricks. Rather than locking customer data in proprietary
              SIEM silos, Hunters allows enterprise customers like Pennymac to stream normalized threat data directly
              into Snowflake, enabling customer teams to construct custom data analytics and optimize log storage costs.
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU004
          - type: callout
            title: High Contract Values and Hidden Retention Volatility
            body: >-
              With average contract commitments hovering around $277k and peaking up to $600k annually, Hunters operates
              in an enterprise tier vulnerable to rigorous procurement scrutiny. The complete absence of public net
              revenue retention (NRR) or customer churn figures represents a material diligence gap, particularly given
              intense competitive pressure from hyperscaler SIEM solutions and strategic SIEM consolidators.
            calloutType: risk
            claimRefs:
              - CU005
              - CU006
              - CU009
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Evidence-weighted risk ranking
        blocks:
          - type: paragraph
            body: >
              Hunters' public risk profile is defined as much by what cannot be verified as by disclosed product
              attributes. The strongest current adverse signal is RFP.wiki's synthesis that public pricing, retention,
              reliability, and financial transparency are limited, while some users want more API endpoints and
              customization and advanced workflows can require vendor assistance. SoftwareSuggest provides no
              counterweight from its own user base because its Hunters page has no reviews. These observations do not
              prove weak reliability or retention; they raise the residual diligence risk because investors cannot
              calibrate failure frequency, renewal durability, or mitigation maturity from the assigned public evidence.


              The qualitative ranking below therefore separates observed dependencies from unknown event rates.
              Assurance and incident-history verification, connector continuity, and commercial transparency carry the
              highest residual exposure. API and customization limits are a narrower execution risk. Every rating is an
              analytical synthesis tied to a cited public disclosure or an explicit evidence gap, not a measured
              probability. Unknown likelihood is deliberately not scored as low.
            claimRefs:
              - CR006
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR010
              - CR011
              - CR012
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR006
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
              - CR016
      - number: '7.2'
        title: Operational and platform dependencies
        blocks:
          - type: paragraph
            body: >
              Hunters' architecture depends on telemetry produced by other systems. TechCrunch reported that the product
              gathers information by integrating with existing systems, and Hunters' integration catalog specifically
              describes ingestion from AWS Config, AWS Cloudtrail, AWS VPC Flow, AWS WAF, CrowdStrike Falcon, and many
              other sources. A customer quotation published on Hunters' site says raw feeds are placed into a shared
              Snowflake database. These disclosures support a real dependency risk: API changes, connector defects,
              upstream outages, entitlement changes, or data-quality degradation could reduce visibility or delay
              investigation even if Hunters itself remains available.


              The public material does not disclose customer-level concentration by connector or warehouse, contractual
              service levels, tested failover behavior, or recovery objectives. RFP.wiki's report that some users seek
              more API endpoints and customization, and that advanced workflows may require vendor assistance, increases
              implementation and support sensitivity. The mitigation is not merely a broad connector catalog;
              underwriting should require connector-health telemetry, replay and reconciliation tests, documented
              degradation modes, change-notice obligations, and exit procedures for customer data.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR011
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR013
      - number: '7.3'
        title: Commercial and financial model risk
        blocks:
          - type: paragraph
            body: >
              Pricing evidence is directional and materially sample-dependent. Vendr reports an approximate annual cost
              of $280,000 and a maximum around $600,000 from its internal transaction data. Costbench instead reports a
              $440,000 per-year median from three third-party buyer reports as of October 2026 and labels the figure
              directional. An average, a maximum, and a median from different samples are not interchangeable, so these
              observations support custom, high-value enterprise contracting but not a defensible list price, average
              contract value, or renewal forecast.


              Prospeo reports $15 million of annual revenue, $68 million of total funding, and a $48 million estimated
              valuation based on industry averages and estimated revenue. These figures are low-confidence third-party
              estimates: revenue is not ARR, total funding is not cash available, and neither provides burn, runway,
              gross margin, renewal, or working-capital evidence. Public sources also name a historical seed round and
              multiple strategic investors without current capitalization or preference terms. The investment model
              should remain unpriced until management supplies period-specific financials, cash, debt, cap-table, and
              cohort evidence.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR013
      - number: '7.4'
        title: Regulatory, legal, and assurance gaps
        blocks:
          - type: paragraph
            body: >
              The relevant assigned sources do not provide current SOC 2 or ISO evidence, a data-processing agreement, a
              subprocessor inventory, data-residency commitments, an AI-governance package, or a regulatory and
              litigation history for Hunters. This is a limitation of the evidence set, not proof that controls,
              certifications, incidents, litigation, or enforcement are absent. The adverse search returned no retained
              relevant result, and the unrelated Hunters Financial Group and job-hunter pages were excluded rather than
              misattributed to the company.


              Because Hunters processes or analyzes enterprise security telemetry through many integrations, the missing
              assurance package is decision-relevant. Diligence should trace data categories, processing locations,
              subprocessors, retention and deletion controls, model-use boundaries, incident-notification obligations,
              audit rights, and contractual liability. Counsel should independently search relevant corporate entities
              and jurisdictions. Until those steps are complete, likelihood remains unknown and residual exposure
              remains high for assurance failure and any undisclosed material incident or proceeding.
            claimRefs:
              - CR001
              - CR010
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR010
              - CR015
              - CR016
      - number: '7.5'
        title: Mitigations, monitoring, and kill criteria
        blocks:
          - type: paragraph
            body: >
              The principal mitigations are evidence-producing controls rather than narrative assurances. Before
              investment committee review, Hunters should provide current third-party assurance reports,
              penetration-test remediation status, subprocessor and residency documentation, a five-year incident and
              claims schedule, connector service-level history, and a customer-data exit plan. A representative proof of
              concept should test telemetry completeness, delayed-event replay, connector schema changes, warehouse
              interruption, detection accuracy, investigation latency, and support escalation against thresholds agreed
              before testing.


              Thesis-break triggers are measurable: refusal or inability to provide the assurance and incident package;
              a proof of concept that breaches agreed completeness, latency, or recovery thresholds without timely
              remediation; material incidents, proceedings, or control exceptions inconsistent with management
              representations; verified gross margin, burn, runway, renewal, or concentration data that cannot meet the
              fund's return hurdle at the proposed price; or undisclosed preference and governance terms that impair
              downside protection. Until these checks clear, the correct posture is research-more rather than treating
              public silence as comfort.
            claimRefs:
              - CR006
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
              - CR016
      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not underwrite silence as safety
            body: >-
              The assigned public evidence does not establish current assurance coverage, incident history, litigation
              or enforcement status, connector service levels, audited economics, or capital terms. Treat those items as
              closing diligence with pre-agreed proof standards; failure to provide them, or material exceptions against
              management representations, should stop or reprice the investment.
            calloutType: risk
            claimRefs:
              - CR006
              - CR010
              - CR012
              - CR013
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Core Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The central investment thesis for Hunters rests on its modern architectural positioning as an AI-driven,
              vendor-agnostic SOC platform that leverages cloud data lakes like Snowflake Computing rather than
              proprietary, high-cost ingestion silos (CV001, CV002). Enterprise validation from prominent organizations
              demonstrates genuine technical differentiation in correlating threat signals into actionable incident
              stories without requiring mandatory endpoint agent deployment (CV003, CV004). However, the critical
              anti-thesis is driven by severe financial opacity and market crowding (CV005). The company has disclosed
              no verified revenue or ARR metrics since its early commercial milestones, leaving underwriting dependent
              on unverified third-party estimates (CV006, CV007). Moreover, competing directly against established
              incumbent platforms such as Splunk and next-generation cloud SIEM providers introduces structural
              displacement friction and elevated renewal risk (CV008, CV009).
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV008
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: Recommendation Stance and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              We assign Hunters a definitive recommendation of research-more with medium confidence, a high risk rating,
              and an unknown valuation stance (CV010). Although historical venture financing reached $98.0M through a
              $68.0M Series C round in January 2022 following a $30.0M Series B in August 2021, no subsequent equity
              valuation or price discovery has been publicly established (CV011, CV012). Entering an investment or
              private secondary transaction without verified subscription retention rates, gross margin profiles, and
              cash runway data creates unquantified downside exposure (CV006, CV010). Enterprise procurement benchmarks
              indicate substantial contract size dispersion with an average annual contract value of approximately
              $280,000 and top-tier agreements reaching up to $600,000, but these point-in-time deal points cannot
              substitute for comprehensive audited financial performance (CV013, CV014).
            claimRefs:
              - CV006
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV006
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV008
              - CV010
              - CV013
      - number: '8.3'
        title: Scenario Analysis, Downside Triggers, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Underwriting scenarios for Hunters span bull, base, and bear trajectories shaped by commercial expansion
              velocity and market retention (CV015). In a bull scenario, sustained enterprise SOC displacements
              capitalize on open data lake cost advantages, scaling high ACV deployments toward a successful strategic
              trade sale or IPO window (CV001, CV013). In the base case, steady growth among mid-market and
              cloud-forward security teams is counterbalanced by heavy sales cycles, resulting in moderate ARR expansion
              and multiple compression (CV008, CV014). In the bear case, aggressive bundling from platform incumbents
              and lack of transparent enterprise renewal traction induce down-round recapitalization or dilutive
              liquidation overhang (CV009, CV015). Rigorous confirmatory diligence requires full cap-table review,
              customer renewal cohorts, and verified cash burn metrics prior to thesis validation (CV006, CV016).
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV009
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV009
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital Allocation Discipline
            body: >-
              While Hunters demonstrates architectural innovation and credible early adoption by forward-leaning
              enterprises, investment committees should refuse unanchored valuation asks until unaudited operating
              metrics are replaced by audited GAAP statements and cap-table waterfall models.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV010
              - CV016
          - type: callout
            title: Platform Incumbent Counter-Attack
            body: >-
              Security operations teams evaluating next-gen SIEM tools face persistent pressure from consolidated
              platform vendors offering aggressive bundling discounts and deep ecosystem integration, elevating
              long-term customer acquisition cost.
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV015
