      - number: '4.2'
        title: Cost Structure and Gross Margin Dynamics
        blocks:
          - type: paragraph
            body: >-
              The economic profile and delivery cost structure of Hunters are governed by three primary cost centers:
              multi-cloud infrastructure compute, data lake storage coordination, and human threat research overhead.
              The platform ingests security telemetry across endpoint, network, identity, and cloud layers into an Open
              Cybersecurity Schema Framework (OCSF) standardized data lake. Under customer deployments where raw
              telemetry is fed into managed or customer-owned cloud data warehouses such as Snowflake, infrastructure
              compute expenses scale directly with data retention periods, daily ingestion gigabytes, and real-time
              query complexity. Concurrently, Hunters differentiates its software by delivering pre-built, continuously
              tuned detection rules developed by Team Axon. Because Team Axon provides managed detection engineering and
              analyst-driven threat hunting services, scaling the enterprise customer base without proportionally
              expanding specialized human security engineering staff risks diluting threat coverage or compressing
              software gross margins. Consequently, while pure-play cloud security software typically exhibits gross
              margins of 70% to 80%, blended service-delivery costs and intensive telemetry parsing represent downward
              pressure on Hunters' realized unit margins.
            claimRefs:
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI014
