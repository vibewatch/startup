  - id: TV002
    title: Investment Thesis versus Core Anti-Thesis
    columns:
      - Lens
      - Thesis Element
      - Core Anti-Thesis Argument
      - What Would Change the View
    rows:
      - - Architecture
        - Open data lake integration with Snowflake reduces customer ingest and data silos
        - Enterprise customers may resist configuring and maintaining external cloud data lakes
        - Verified net revenue retention and low deployment failure rates in large accounts
      - - Detection & TDIR
        - Autonomous threat hunting correlates raw security telemetry into actionable attack stories
        - Crowded SIEM and XDR market with legacy incumbents adding automated analytics
        - Independent win-loss data showing sustained technical displacement of tier-1 incumbents
      - - Commercials
        - Average enterprise ACV of $280k demonstrates willingness to pay significant contract value
        - Deal size dispersion ($280k avg, up to $600k max) across few recorded deals implies customer concentration
        - Audited customer count and cohort retention demonstrating expanding enterprise adoption
      - - Capitalization
        - Raised $98.0M across disclosed rounds with backing from prominent enterprise venture firms
        - No primary capital raised since January 2022 raises dilution and bridge-financing questions
        - Confirmatory evidence of positive operating cash flow or extended cash runway
    notes: Evaluation synthesizes architectural advantages against disclosed competitive benchmarks and funding history.
