          - type: paragraph
            body: >-
              The evidence suggests useful workflow differentiation but does not establish a durable moat. Integrating
              across existing controls can reduce rip-and-replace friction and accommodate heterogeneous environments,
              while customer-owned data models may create practical workflow embedding. The same openness, however,
              means Hunters competes wherever buyers can assemble detection, investigation, and response from incumbent
              SIEMs, cloud suites, open-source tools, or internal engineering. RFP.wiki's Hunters snapshot shows a 3.6
