chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Architectural Mission
        blocks:
          - type: paragraph
            body: >-
              Hunters was founded in 2018 in Tel Aviv, Israel, to address a fundamental bottleneck in modern enterprise
              security operations: the manual, talent-constrained nature of threat hunting and alert triage. Rather than
              deploying proprietary endpoint agents or charging ingest-based data taxes common to legacy SIEM
              architectures, Hunters pioneered an autonomous threat-hunting machine that correlates cross-stack
              telemetry. The platform ingests telemetry across disparate enterprise environments and deposits normalized
              data feeds into customer-shared Snowflake databases, enabling security teams to run advanced threat
              detection, enrichment, prioritization, and automated investigation directly on open data lake
              infrastructure without vendor lock-in.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO006
              - CO008
              - CO010
              - CO013
              - CO014
      - number: '1.2'
        title: Founding Team, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              The company was co-founded by Chief Executive Officer Uri May and Chief Technology Officer Tomer Kazaz.
              Both founders began their technical and operational careers as cyber intelligence officers in the Israel
              Defense Forces, giving the executive leadership team authentic founder-market fit in enterprise threat
              modeling and adversarial tactics. Corporate governance is reinforced by former Unit 8200 commander Ehud
              Schneerson, who joined the board of directors alongside Blumberg Capital's co-lead seed investment.
              Operationally, the organization maintains an estimated workforce of approximately 91 to 181 employees
              distributed across thirteen operational departments spanning engineering, product, threat research, and
              global commercial go-to-market.
