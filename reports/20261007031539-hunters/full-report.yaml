        title: Capitalization Structure, Investors, and Strategic Backing
        blocks:
          - type: paragraph
            body: >-
              Hunters has raised $118.4 million in cumulative equity capital across four disclosed financing rounds,
              scaling from an initial $5.4 million seed round in May 2019 led by YL Ventures and Blumberg Capital to a
              $68.0 million Series C financing completed in January 2022 led by Stripes. The company's capitalization
              table reflects a rare combination of top-tier institutional cybersecurity venture capital firms and major
              strategic cloud infrastructure providers. Prominent institutional backers include Bessemer Venture
              Partners, YL Ventures, DTCP, U.S. Venture Partners, and Microsoft's venture fund M12, complemented by
              strategic balance-sheet investments from Snowflake, Databricks, Cisco Investments, and Okta Ventures that
