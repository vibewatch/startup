  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a narrow market boundary around security-operations workflows rather than
              cybersecurity spend as a whole. Hunters' documentation exposes indicator-of-compromise search,
              threat-cluster investigation, automatic investigation, and data-flow monitoring, while historical
              reporting describes integration with existing systems instead of a proprietary collection stack. Included
              spend is therefore the software and operating workflow used to ingest security telemetry, correlate leads,
              investigate activity, and support response. Endpoint prevention, general-purpose cloud storage,
              non-security analytics, and unrelated uses of the word "hunters" are outside the boundary. One allocated
              industry-trends result was a real-estate story about house hunters; it is retained only as direct evidence
              of search ambiguity and excluded from every sizing proxy. Manual analyst-led threat hunting is the
              clearest status-quo substitute in the retained evidence.
