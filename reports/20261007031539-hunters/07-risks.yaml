chapter:
  number: 7
  title: "Risks"
  summary: "The largest underwritable risks are evidence quality, connector and data-platform dependency, opaque enterprise pricing, and unverified assurance and incident history. Public evidence supports a diligence-intensive posture rather than a conclusion that a breach, compliance failure, or operating failure has occurred."
sections:
  - id: "evidence-weighted-risk-ranking"
    title: "Evidence-weighted risk ranking"
    body: |
      Hunters' public risk profile is defined as much by what cannot be verified as by disclosed product attributes. The strongest current adverse signal is RFP.wiki's synthesis that public pricing, retention, reliability, and financial transparency are limited, while some users want more API endpoints and customization and advanced workflows can require vendor assistance. SoftwareSuggest provides no counterweight from its own user base because its Hunters page has no reviews. These observations do not prove weak reliability or retention; they raise the residual diligence risk because investors cannot calibrate failure frequency, renewal durability, or mitigation maturity from the assigned public evidence.

      The qualitative ranking below therefore separates observed dependencies from unknown event rates. Assurance and incident-history verification, connector continuity, and commercial transparency carry the highest residual exposure. API and customization limits are a narrower execution risk. Every rating is an analytical synthesis tied to a cited public disclosure or an explicit evidence gap, not a measured probability. Unknown likelihood is deliberately not scored as low.
    claimRefs:
      - "CR006"
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR015"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"

  - id: "operational-and-platform-dependencies"
    title: "Operational and platform dependencies"
    body: |
      Hunters' architecture depends on telemetry produced by other systems. TechCrunch reported that the product gathers information by integrating with existing systems, and Hunters' integration catalog specifically describes ingestion from AWS Config, AWS Cloudtrail, AWS VPC Flow, AWS WAF, CrowdStrike Falcon, and many other sources. A customer quotation published on Hunters' site says raw feeds are placed into a shared Snowflake database. These disclosures support a real dependency risk: API changes, connector defects, upstream outages, entitlement changes, or data-quality degradation could reduce visibility or delay investigation even if Hunters itself remains available.

      The public material does not disclose customer-level concentration by connector or warehouse, contractual service levels, tested failover behavior, or recovery objectives. RFP.wiki's report that some users seek more API endpoints and customization, and that advanced workflows may require vendor assistance, increases implementation and support sensitivity. The mitigation is not merely a broad connector catalog; underwriting should require connector-health telemetry, replay and reconciliation tests, documented degradation modes, change-notice obligations, and exit procedures for customer data.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR011"
      - "CR014"
    tableRefs:
      - "TR003"

  - id: "commercial-and-financial-model-risk"
    title: "Commercial and financial model risk"
    body: |
      Pricing evidence is directional and materially sample-dependent. Vendr reports an approximate annual cost of $280,000 and a maximum around $600,000 from its internal transaction data. Costbench instead reports a $440,000 per-year median from three third-party buyer reports as of October 2026 and labels the figure directional. An average, a maximum, and a median from different samples are not interchangeable, so these observations support custom, high-value enterprise contracting but not a defensible list price, average contract value, or renewal forecast.

      Prospeo reports $15 million of annual revenue, $68 million of total funding, and a $48 million estimated valuation based on industry averages and estimated revenue. These figures are low-confidence third-party estimates: revenue is not ARR, total funding is not cash available, and neither provides burn, runway, gross margin, renewal, or working-capital evidence. Public sources also name a historical seed round and multiple strategic investors without current capitalization or preference terms. The investment model should remain unpriced until management supplies period-specific financials, cash, debt, cap-table, and cohort evidence.
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR013"

  - id: "regulatory-legal-and-assurance-gaps"
    title: "Regulatory, legal, and assurance gaps"
    body: |
      The relevant assigned sources do not provide current SOC 2 or ISO evidence, a data-processing agreement, a subprocessor inventory, data-residency commitments, an AI-governance package, or a regulatory and litigation history for Hunters. This is a limitation of the evidence set, not proof that controls, certifications, incidents, litigation, or enforcement are absent. The adverse search returned no retained relevant result, and the unrelated Hunters Financial Group and job-hunter pages were excluded rather than misattributed to the company.

      Because Hunters processes or analyzes enterprise security telemetry through many integrations, the missing assurance package is decision-relevant. Diligence should trace data categories, processing locations, subprocessors, retention and deletion controls, model-use boundaries, incident-notification obligations, audit rights, and contractual liability. Counsel should independently search relevant corporate entities and jurisdictions. Until those steps are complete, likelihood remains unknown and residual exposure remains high for assurance failure and any undisclosed material incident or proceeding.
    claimRefs:
      - "CR001"
      - "CR010"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR001"

  - id: "mitigations-monitoring-and-kill-criteria"
    title: "Mitigations, monitoring, and kill criteria"
    body: |
      The principal mitigations are evidence-producing controls rather than narrative assurances. Before investment committee review, Hunters should provide current third-party assurance reports, penetration-test remediation status, subprocessor and residency documentation, a five-year incident and claims schedule, connector service-level history, and a customer-data exit plan. A representative proof of concept should test telemetry completeness, delayed-event replay, connector schema changes, warehouse interruption, detection accuracy, investigation latency, and support escalation against thresholds agreed before testing.

      Thesis-break triggers are measurable: refusal or inability to provide the assurance and incident package; a proof of concept that breaches agreed completeness, latency, or recovery thresholds without timely remediation; material incidents, proceedings, or control exceptions inconsistent with management representations; verified gross margin, burn, runway, renewal, or concentration data that cannot meet the fund's return hurdle at the proposed price; or undisclosed preference and governance terms that impair downside protection. Until these checks clear, the correct posture is research-more rather than treating public silence as comfort.
    claimRefs:
      - "CR006"
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR015"
      - "CR016"

