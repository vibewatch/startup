  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "assurance-gap"
      missingEvidence: "Current SOC 2 or ISO reports, penetration-test remediation, DPA, subprocessor inventory, residency map, retention and deletion controls, and AI-governance documentation."
      whyItMatters: "Hunters analyzes enterprise security telemetry, so control exceptions, processing scope, and data-location commitments can create contractual, security, and compliance exposure."
      diligencePath: "Review complete reports and policies under NDA, map exceptions to architecture, and obtain counsel review for target customer jurisdictions."
      relatedQuestionRefs:
        - "QR002"
      relatedTableRefs:
        - "TR001"
    - type: "missing-source"
      severity: "material"
      topic: "incident-and-legal-history"
      missingEvidence: "Entity-specific incident, outage, litigation, claims, and enforcement history reconciled to management representations."
      whyItMatters: "The assigned source set cannot distinguish no event from no public or retained evidence, while a material undisclosed event could change risk and valuation."
      diligencePath: "Request a five-year management schedule and independently search courts, regulators, status records, customer notices, and insurer claims."
      relatedQuestionRefs:
        - "QR003"
      relatedTableRefs:
        - "TR001"
        - "TR002"
    - type: "private-evidence-only"
      severity: "material"
      topic: "reliability-risk"
      missingEvidence: "Customer-level uptime, connector health, delayed-event replay, detection quality, support escalation, recovery tests, and incident response metrics."
      whyItMatters: "Public product and review evidence identifies dependencies but does not quantify their event frequency, customer concentration, or mitigation effectiveness."
      diligencePath: "Run a representative proof of concept with pre-agreed completeness, latency, detection, failover, recovery, and support thresholds."
      relatedQuestionRefs:
        - "QR004"
        - "QR005"
        - "QR008"
        - "QR009"
      relatedTableRefs:
        - "TR002"
        - "TR003"
    - type: "private-evidence-only"
      severity: "material"
      topic: "financial-model-risk"
      missingEvidence: "Period-specific revenue and ARR bridge, gross margin, services mix, burn, cash, debt, runway, retention cohorts, concentration, pipeline conversion, and renewal economics."
      whyItMatters: "Directional third-party pricing and company estimates do not establish recurring revenue quality, capital efficiency, cash availability, or downside funding needs."
      diligencePath: "Reconcile audited or board-approved financials to bank balances, billing cohorts, contracts, deferred revenue, and the operating plan."
      relatedQuestionRefs:
        - "QR006"
        - "QR009"
      relatedTableRefs:
        - "TR002"
        - "TR003"
    - type: "private-evidence-only"
      severity: "material"
      topic: "capital-provider-risk"
      missingEvidence: "Fully diluted cap table, option pool, debt, liquidation preferences, participation rights, anti-dilution terms, board rights, and future financing plan."
      whyItMatters: "Named investors and historical funding do not establish ownership, governance control, preference overhang, cash, or the dilution required to reach the next milestone."
      diligencePath: "Review signed financing documents, board materials, capitalization records, debt agreements, and a preference waterfall tied to downside scenarios."
      relatedQuestionRefs:
        - "QR010"
      relatedTableRefs:
        - "TR003"
