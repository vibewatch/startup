callouts:
  - calloutType: "risk"
    title: "Financing Dependency and Uncorroborated Runway Duration"
    body: "Hunters raised $118 million through its January 2022 Series C financing round, but has recorded no subsequent equity or venture debt capitalization over the subsequent four-year operating window. Operating a global enterprise headcount estimated between 185 and 246 personnel implies substantial annual operating expenditures that exceed third-party revenue estimates ($7.7M to $15M). Without fresh capital or validated operating cash flow break-even, Hunters faces severe runway pressure and potential recapitalization or acquisition risk."
    claimRefs:
      - "CI013"
      - "CI014"
      - "CI015"
  - calloutType: "insight"
    title: "Divergence Between Ingestion Pricing and Realized Unit Margins"
    body: "While Hunters positions its platform as a cost-effective alternative to legacy SIEM licensing models by standardizing data on open OCSF formats, the operational requirement to maintain the Team Axon threat research service creates a semi-variable human cost structure. Unlike pure-play SaaS platforms that achieve incremental gross margins above 85%, Hunters must continuously fund advanced research personnel to tune detection rules, which threatens to compress unit margins as client counts scale."
    claimRefs:
      - "CI005"
      - "CI007"
      - "CI008"
