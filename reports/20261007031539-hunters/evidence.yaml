evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: >-
      Audited financial statements confirming GAAP revenue, current annual recurring revenue (ARR), gross margin, and
      net burn rate post-Series C.
    whyItMatters: >-
      Without primary revenue disclosures, underwriting valuation or benchmarking capital efficiency relies on
      unverified algorithmic estimates.
    diligencePath: >-
      Request confidential sponsor financial disclosures including FY2024-FY2026 management accounts and audited revenue
      statements.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-governance
    missingEvidence: Comprehensive C-suite and VP executive roster disclosing current heads of sales, marketing, and finance.
    whyItMatters: Validates functional executive coverage and identifies any vacant executive seats impacting GTM execution.
    diligencePath: Request executive organization chart and key-person insurance schedules during confirmatory diligence.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-mapping
    missingEvidence: >-
      Fully diluted cap table showing exact percentage ownership, preferred share liquidation preferences, and secondary
      transaction history.
    whyItMatters: >-
      Affects waterfall modeling and understanding the economic voting control between founders and later-stage growth
      investors.
    diligencePath: Obtain current cap table summary and investor rights agreement during formal confirmatory due diligence.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      A current market study with category boundary, geography, base-year value, CAGR, methodology, and an
      eligible-buyer denominator for Hunters' addressable workflow.
    whyItMatters: >-
      Without a denominator and category methodology, enterprise contract values cannot support TAM, SAM, SOM,
      penetration, or valuation-growth assumptions.
    diligencePath: >-
      Obtain current analyst-market data and management's bottom-up account universe, then reconcile both to the
      workflow boundary and disclosed contract statistics.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: competitor-scale
    missingEvidence: >-
      Current primary or independently verified scale, funding, target-segment, and strategic-direction data for each
      named competitor.
    whyItMatters: >-
      Without normalized scale and direction evidence, the analysis cannot distinguish durable enterprise reach from a
      feature-level shortlist.
    diligencePath: >-
      Request a current competitor tear sheet using filings, official pricing, primary product documentation, and dated
      funding or ownership records.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: trust-posture
    missingEvidence: >-
      Independent or primary audit evidence for Hunters' claimed SOC 2, ISO 27001, GDPR, residency, and subprocessor
      posture.
    whyItMatters: >-
      Security and compliance posture can decide enterprise shortlists and switching feasibility, but the pool contains
      only a directory assertion.
    diligencePath: >-
      Obtain current certificates, audit scope, bridge letters, subprocessor inventory, data-flow diagrams, and customer
      security-review artifacts.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: financial-underwriting-gaps
    missingEvidence: Audited financial statements, GAAP revenue, annual recurring revenue (ARR) breakdown, and gross margin schedule.
    whyItMatters: >-
      Essential to underwrite enterprise valuation multiples, assess operational cash burn, and evaluate path to
      profitability.
    diligencePath: >-
      Request historical audited income statements, balance sheets, and current ARR contract schedules directly from
      management.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: retention-and-expansion-metrics
    missingEvidence: Historical Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and logo retention by annual cohort.
    whyItMatters: >-
      Validates long-term product-market fit, enterprise expansion dynamics, and displacement resistance against
      incumbent SIEM vendors.
    diligencePath: Request anonymized cohort renewal data and churn root-cause analysis from executive management.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: stale
    severity: blocking
    topic: capital-runway-and-cash-balance
    missingEvidence: Current cash on hand, monthly net cash burn rate, outstanding debt obligations, and projected runway duration.
    whyItMatters: >-
      With no new equity round recorded since January 2022, determining liquidity cushion is vital to evaluate
      refinancing or down-round risk.
    diligencePath: Inspect current treasury bank statements, operating budget models, and board reporting decks.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: operational-performance-benchmarks
    missingEvidence: >-
      Independent public service-level agreements (SLAs), verified uptime records, and large-scale query latency
      benchmarks under peak enterprise log ingestion.
    whyItMatters: >-
      Without independent latency and throughput verification, enterprise buyers cannot validate whether decoupled data
      lake queries experience operational slowdowns during active security incidents.
    diligencePath: >-
      Request customer deployment architecture reviews, contractual SLA commitments, and query latency performance logs
      from production reference accounts.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: customer-retention
    missingEvidence: >-
      Audited cohort net revenue retention (NRR), gross revenue retention (GRR), and logo churn metrics across
      enterprise customer tiers.
    whyItMatters: >-
      Without retention data, underwriters cannot determine whether high ACVs translate into compounding lifetime value
      or suffer high renewal drop-off.
    diligencePath: Request historical cohort renewal tables and customer churn logs under NDA during private management diligence.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top 5 and top 10 customer revenue concentration percentages and annual spend breakdown.
    whyItMatters: >-
      High average contract values mean losing two or three key enterprise accounts could materially impair revenue
      run-rate and gross margins.
    diligencePath: Obtain anonymized customer revenue contribution schedules and contract expiration schedules from management.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-table
    missingEvidence: Comprehensive listing of all active enterprise production customers beyond publicly highlighted brand logos.
    whyItMatters: >-
      Public testimonials may suffer from survivorship bias and fail to capture dissolved pilot accounts or unhappy
      deployments.
    diligencePath: Request full active customer reference roster and interview non-advocate customer accounts.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: assurance-gap
    missingEvidence: >-
      Current SOC 2 or ISO reports, penetration-test remediation, DPA, subprocessor inventory, residency map, retention
      and deletion controls, and AI-governance documentation.
    whyItMatters: >-
      Hunters analyzes enterprise security telemetry, so control exceptions, processing scope, and data-location
      commitments can create contractual, security, and compliance exposure.
    diligencePath: >-
      Review complete reports and policies under NDA, map exceptions to architecture, and obtain counsel review for
      target customer jurisdictions.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: incident-and-legal-history
    missingEvidence: >-
      Entity-specific incident, outage, litigation, claims, and enforcement history reconciled to management
      representations.
    whyItMatters: >-
      The assigned source set cannot distinguish no event from no public or retained evidence, while a material
      undisclosed event could change risk and valuation.
    diligencePath: >-
      Request a five-year management schedule and independently search courts, regulators, status records, customer
      notices, and insurer claims.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: material
    topic: reliability-risk
    missingEvidence: >-
      Customer-level uptime, connector health, delayed-event replay, detection quality, support escalation, recovery
      tests, and incident response metrics.
    whyItMatters: >-
      Public product and review evidence identifies dependencies but does not quantify their event frequency, customer
      concentration, or mitigation effectiveness.
    diligencePath: >-
      Run a representative proof of concept with pre-agreed completeness, latency, detection, failover, recovery, and
      support thresholds.
    relatedQuestionRefs:
      - QR004
      - QR005
      - QR008
      - QR009
    relatedTableRefs:
      - TR002
      - TR003
  - type: private-evidence-only
    severity: material
    topic: financial-model-risk
    missingEvidence: >-
      Period-specific revenue and ARR bridge, gross margin, services mix, burn, cash, debt, runway, retention cohorts,
      concentration, pipeline conversion, and renewal economics.
    whyItMatters: >-
      Directional third-party pricing and company estimates do not establish recurring revenue quality, capital
      efficiency, cash availability, or downside funding needs.
    diligencePath: >-
      Reconcile audited or board-approved financials to bank balances, billing cohorts, contracts, deferred revenue, and
      the operating plan.
    relatedQuestionRefs:
      - QR006
      - QR009
    relatedTableRefs:
      - TR002
      - TR003
  - type: private-evidence-only
    severity: material
    topic: capital-provider-risk
    missingEvidence: >-
      Fully diluted cap table, option pool, debt, liquidation preferences, participation rights, anti-dilution terms,
      board rights, and future financing plan.
    whyItMatters: >-
      Named investors and historical funding do not establish ownership, governance control, preference overhang, cash,
      or the dilution required to reach the next milestone.
    diligencePath: >-
      Review signed financing documents, board materials, capitalization records, debt agreements, and a preference
      waterfall tied to downside scenarios.
    relatedQuestionRefs:
      - QR010
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: blocking
    topic: financial-metrics
    missingEvidence: Current audited financial statements disclosing GAAP ARR, gross margins, net retention rate, and quarterly burn.
    whyItMatters: >-
      Without primary revenue scale and margin economics, underwriting valuation and cash runway relies entirely on
      secondary estimates.
    diligencePath: Request confidential audited income statements and cohort renewal schedules under non-disclosure agreement.
    relatedQuestionRefs:
      - QV008
