callouts:
  - calloutType: "insight"
    title: "Strategic Customer Alignment with Data Lake Infrastructure"
    body: "Hunters' primary commercial differentiator in the enterprise SOC market is its architectural synergy with cloud data lake platforms like Snowflake and Databricks. Rather than locking customer data in proprietary SIEM silos, Hunters allows enterprise customers like Pennymac to stream normalized threat data directly into Snowflake, enabling customer teams to construct custom data analytics and optimize log storage costs."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
  - calloutType: "risk"
    title: "High Contract Values and Hidden Retention Volatility"
    body: "With average contract commitments hovering around $277k and peaking up to $600k annually, Hunters operates in an enterprise tier vulnerable to rigorous procurement scrutiny. The complete absence of public net revenue retention (NRR) or customer churn figures represents a material diligence gap, particularly given intense competitive pressure from hyperscaler SIEM solutions and strategic SIEM consolidators."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU009"
      - "CU012"
