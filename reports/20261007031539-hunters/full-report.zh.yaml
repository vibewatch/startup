      - number: '2.3'
        title: 受证据约束的市场规模测算
        blocks:
          - type: paragraph
            body: >-
              没有任何保留来源提供足够的全市场价值、增长率、地域范围或方法论来计算 TAM、SAM 或 SOM。现有数字证据反而是供应商层面的商业代理。Vendr 报告平均合同金额为 $277,138，并称年费约为
              $280,000、最高约 $600,000，但样本交易极少。CostBench 根据三份第三方买方报告给出 $440,000
              的年费中位数，并标注为方向性数据。这些数值使用不同统计口径和样本，因此不是一个区间，也不应取平均。Prospeo 的 $15 million 年收入和 $48 million
              估算估值是对公司的描述，不是市场需求；其估值明确按行业平均值建模。可辩护的结论是企业合同规模较大但不确定性很高，而不是得出量化市场规模。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
