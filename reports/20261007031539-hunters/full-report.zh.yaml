      - number: '5.2'
        title: 运营架构、检测工程与云摄入
        blocks:
          - type: paragraph
            body: >-
              Hunters 的核心技术差异化在于消除日常内部检测工程，并把数据存储与分析执行解耦。在传统 SIEM
              环境中，安全工程团队需要投入大量运营周期来编写、测试和更新检测逻辑，以应对不断变化的攻击者手法。Hunters 通过 Team Axon
              吸收这项负担：这个专门的内部研究团队在企业云和本地环境中开发、测试并持续推送开箱即用的检测规则，使过量告警减少 90%。底层分布式处理基础设施主要由 Python 微服务实现，采用 FastAPI 等框架，在
              Kubernetes 上容器化，并在包括 Amazon Web Services（AWS）在内的云环境中编排。遥测管道通过 Apache Kafka 等消息总线和异步发布订阅通道支持实时流式处理，在写入
              Snowflake 等列式数据仓库前先标准化半结构化数据。开放数据湖战略让客户安全工程团队可以直接查询原始标准化数据流、执行定制 SQL 模型，并在 Hunters 自动调查引擎旁构建定制安全应用。
            claimRefs:
