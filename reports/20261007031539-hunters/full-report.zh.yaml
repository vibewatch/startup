        title: 公司里程碑、商业进展与尽调警示
        blocks:
          - type: paragraph
            body: >-
              自 2018 年成立以来，Hunters 已从自主威胁搜寻功能发展为完整的新一代 SIEM 与 SOC 平台，并直接接入 Microsoft Defender for
              Endpoint、AWS、CrowdStrike 和 InfoBlox 等企业核心基础设施。企业采购数据显示其合同商业化已有明显进展：平均年合同金额约为 $280,000，经过验证的多模块企业部署年费中位数达到
