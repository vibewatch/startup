      - number: '4.2'
        title: 成本结构与毛利率变化
        blocks:
          - type: paragraph
            body: >-
              Hunters 的经济画像和交付成本结构受三个主要成本中心支配：多云基础设施计算、数据湖存储协调，以及人工威胁研究开支。平台将终端、网络、身份和云层的安全遥测摄入采用 Open Cybersecurity
              Schema Framework（OCSF）标准化的数据湖。在客户部署中，原始遥测进入 Snowflake
              等托管或客户自有的云数据仓库，基础设施计算费用会随数据保留期、每日摄入千兆字节数和实时查询复杂度直接增长。同时，Hunters 通过 Team Axon 开发并持续调优的预构建检测规则实现软件差异化。由于
              Team Axon 提供托管检测工程和分析师驱动的威胁搜寻服务，如果企业客户扩大而专业安全工程人员没有同比增加，威胁覆盖可能被稀释，软件毛利率也可能受到挤压。因此，尽管纯云安全软件的毛利率通常为 70% 至
              80%，混合服务交付成本和密集遥测解析会压低 Hunters 的实际单位利润率。
            claimRefs:
              - CI006
              - CI007
              - CI008
