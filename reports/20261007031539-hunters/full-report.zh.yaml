            body: >-
              Hunters 通过 2022 年 1 月 Series C 累计融资 $118 million，但在随后四年的运营期内没有记录到后续股权或风险债务资本化。运营一支估计为 185 至 246
              人的全球企业团队，意味着年度运营支出很可能超过第三方收入估算（$7.7M 至 $15M）。没有新资本或经过验证的经营现金流盈亏平衡，Hunters 面临严重的现金跑道压力，以及潜在的资本重组或被收购风险。
