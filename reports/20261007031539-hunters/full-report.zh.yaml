figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Hunters 自 2018 年创立至 2026 年的公司、融资、产品和架构关键里程碑。
    approximationNotes: 里程碑日期来自公开融资公告、厂商遥测集成信息和第三方买家评价。
    claimRefs:
      - CO001
      - CO009
      - CO010
      - CO013
      - CO015
      - CO016
    data:
      items:
        - label: 特拉维夫公司创立
          date: '2018'
          detail: Hunters 由前 IDF 网络情报官 Uri May 和 Tomer Kazaz 在特拉维夫创立。
          tone: neutral
        - label: 种子轮融资（$5.4M）
          date: 2019-05
          detail: YL Ventures 和 Blumberg Capital 领投 $5.4M 种子轮，用于打造自主威胁狩猎。
          tone: positive
        - label: 自主引擎正式商用
          date: 2019-11
          detail: 发布自主威胁狩猎机器，正式面向企业环境商用。
          tone: neutral
        - label: 战略投资方扩展
          date: 2020-10
          detail: Snowflake Ventures 和 Okta Ventures 加入，扩大了战略投资方阵容。
          tone: positive
        - label: C 轮融资（$68.0M）
          date: 2022-01
          detail: Stripes 领投 $68.0M C 轮融资，累计融资达到 $118.4M。
          tone: positive
        - label: 下一代 SIEM 与 TDIR 平台发布
          date: 2023-06
          detail: 核心定位从独立威胁狩猎转向完整的下一代 SIEM 与 TDIR 平台。
          tone: positive
        - label: 商业规模与企业 ACV 增长
          date: 2025-04
          detail: 平均年度合同金额约为 ~$280,000，最高企业合同金额达 $600,000。
          tone: neutral
        - label: 平台评价与 API 定制摩擦
          date: 2026-07
          detail: 第三方评价肯定平台效果，同时客户要求增加 API 端点并提高财务透明度。
          tone: warning
  - id: FM001
    title: 市场规模证据漏斗
    type: pyramid
    summary: 从宽泛的安全运营类别逐步收窄到能够支持 Hunters 投资判断的证据。
    data:
      nodes:
        - label: 排除无关同名对象
          detail: 房地产寻屋内容不属于网络安全市场边界。
        - label: 定义工作流
          detail: IOC 搜索、威胁集群调查、线索补充、关联分析和响应支持。
        - label: 确定数据底座
          detail: 现有安全系统，加上客户 Snowflake 或 Oracle Cloud 数据路径。
        - label: 确定买方群体
          detail: 安全负责人、安全工程团队、SOC 分析师和数据平台相关方。
        - label: 合同证据只作代理指标
          detail: Vendr 报告平均合同金额；CostBench 根据三份买家报告给出方向性中位数。
        - label: TAM、SAM 和 SOM 暂不下定论
          detail: 留存来源没有提供市场价值、地域、增长率或方法论。
    approximationNotes: 这只是定性证据漏斗；节点顺序不代表转化率，也不代表数学意义上的市场规模级联。
    claimRefs:
      - CM001
      - CM003
      - CM007
      - CM008
      - CM011
      - CM012
  - id: FP001
    title: 序数定位：生态广度与运营简洁度
    type: quadrant
    summary: 六个已点名替代方案的定性地图；位置体现来源所描述的取舍，不代表实测产品表现。
    data:
      points:
        - label: Hunters
          x: 4
          'y': 4
          detail: 主张跨工具集成、部署简便，但 API 和厂商协助存在限制。
        - label: Splunk
          x: 5
          'y': 2
          detail: 功能和生态广泛，但设置与管理负担沉重。
        - label: Microsoft Sentinel
          x: 4
          'y': 3
          detail: 原生 Microsoft 集成和自动化能力强，但 KQL、成本和调优都较复杂。
        - label: Wazuh
          x: 3
          'y': 2
          detail: 开源且灵活、覆盖面广，但技术设置和调优负担较重。
        - label: Elastic Security
          x: 4
          'y': 2
          detail: 搜索和集成具备扩展性，但需要专业能力和数据治理。
        - label: Blumira
          x: 3
          'y': 5
          detail: 易于设置，适合精简团队，但企业级能力和高级分析的证据较薄。
    approximationNotes: 分析师赋予的序数分数为 1（低）至 5（高）：x 轴表示来源描述的生态广度，y 轴表示运营简洁度。这些分数不是基准结果、市场份额或功效测量。
    claimRefs:
      - CP003
      - CP007
      - CP008
      - CP010
      - CP016
  - id: FI001
    title: 客户遥测摄取与价值兑现路径
    type: flow
    summary: 将企业安全数据依次转化为订阅变现和毛利率。
    data:
      nodes:
        - label: 企业遥测摄取（日志、云、身份、EDR）
        - label: OCSF 数据湖管道（Snowflake / 托管数据湖）
        - label: 自动威胁关联与调查引擎
        - label: Team Axon 威胁狩猎与托管检测层
        - label: 企业年度订阅（$277k-$440k ACV）
        - label: 毛利率（扣除云计算与分析师间接成本）
      edges:
        - from: Enterprise Telemetry Ingestion (Logs, Cloud, Identity, EDR)
          to: OCSF Data Lake Pipeline (Snowflake / Managed Lake)
        - from: OCSF Data Lake Pipeline (Snowflake / Managed Lake)
          to: Automated Threat Correlation & Investigation Engine
        - from: Automated Threat Correlation & Investigation Engine
          to: Team Axon Threat Hunting & Managed Detection Layer
        - from: Team Axon Threat Hunting & Managed Detection Layer
          to: Annual Enterprise Subscription ($277k-$440k ACV)
        - from: Annual Enterprise Subscription ($277k-$440k ACV)
          to: Gross Profit Margin (Net of Cloud Compute & Analyst Overhead)
    approximationNotes: 基于平台架构文档、采购基准合同金额和服务交付动态绘制的示意性运营流程。
    claimRefs:
      - CI002
      - CI006
      - CI007
      - CI008
  - id: FE001
    title: Hunters SOC 平台分层架构栈
    type: stack
    summary: 展示数据摄取、开放数据湖存储、自主分析和用户响应界面的六层架构。
    data:
      layers:
        - label: 响应编排
          detail: 一键执行响应，并与工单系统双向集成
          modules:
            - 自动响应触发器
            - 工单与 SOAR 生态连接
        - label: 展示与用户体验
          detail: 分析师调查控制台和生成式 AI 威胁摘要
          modules:
            - SecOps 分析师控制台
            - 生成式 AI 威胁解释与摘要
        - label: 关联与威胁调查
          detail: 机器驱动的自主告警分诊和攻击故事图聚类
          modules:
            - 自主攻击故事图引擎
            - 多告警实体关联管道
        - label: 检测工程与分析
          detail: Team Axon 持续维护、测试的检测规则
          modules:
            - Team Axon 持续维护的检测规则
            - 预打包云端与本地规则
        - label: 开放安全数据湖
          detail: 构建于客户或托管 Snowflake 实例之上的标准化 OCSF 事件存储
          modules:
            - OCSF 标准化事件存储
            - Snowflake 列式安全数据仓库
        - label: 遥测摄取与连接器
          detail: 不绑定厂商的 API 连接器，摄取终端、身份及多云遥测
          modules:
            - 多云 API 与身份连接器
            - 终端与网络遥测流
    approximationNotes: 根据 Hunters 官方架构概览和技术披露综合出的逻辑架构拆解。
    claimRefs:
      - CE002
      - CE003
      - CE005
      - CE008
      - CE010
  - id: FU001
    title: 客户旅程图：企业 SOC 采用与扩张
    type: journey-map
    summary: 展示 Hunters 客户从评估数据摄取到多年数据湖 SecOps 扩张的典型企业生命周期。
    data:
      nodes:
        - id: evaluation
          label: 发现与架构适配
          stage: Initial Evaluation
          touchpoints:
            - Integration assessment with cloud data lake (Snowflake/Databricks)
            - Review of legacy SIEM cost bottlenecks and alert fatigue points
          tone: neutral
        - id: pilot
          label: 遥测摄取试点
          stage: Validation
          touchpoints:
            - Sample telemetry connector testing across EDR, identity, and cloud logs
            - Benchmarking detection engineering automation against historical alerts
          tone: neutral
        - id: procurement
          label: 企业采购与定价
          stage: Contracting
          touchpoints:
            - Negotiation of annual software contract value ($277k benchmark average)
            - Multi-year commitment structuring up to $600k enterprise tier
          tone: risk
        - id: deployment
          label: 切入生产与 TDIR
          stage: Deployment
          touchpoints:
            - Full deployment of automated detection engineering and alert correlation
            - Transition from manual alert triage to consolidated attack-story response
          tone: positive
        - id: modeling
          label: 数据湖建模与定制分析
          stage: Operational Integration
          touchpoints:
            - Streaming normalized feeds into shared Snowflake database
            - Empowering customer security teams to construct custom data models
          tone: positive
        - id: expansion
          label: 生态扩张与续约
          stage: Retention & Scale
          touchpoints:
            - Annual contract renewal and multi-year commitment expansion
            - Expanding telemetry ingestion across additional business units
          tone: opportunity
    approximationNotes: 框架综合自企业部署证言（Pennymac、Unzer、Cimpress）和采购交易动态；各客户的上线时间可能不同。
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU005
  - id: FR001
    title: 剩余风险分诊矩阵
    type: matrix
    summary: 定性分诊将已观察到的依赖项，与未知的可能性和未经验证的缓释成熟度区分开来。
    data:
      columns:
        - label: 可能性
          detail: 这是对公开证据的评估，不是测得的概率。
        - label: 影响
          detail: 故障模式发生时可能造成的投资判断后果。
        - label: 缓释成熟度
          detail: 指定来源集中可获得的缓释证据程度。
        - label: 剩余严重性
          detail: 仅考虑已有证据支持的缓释措施后剩余的风险。
      rows:
        - label: 保障与合规验证
          note: 指定的相关来源中没有当前的信任与治理材料。
          values:
            - label: Unknown
            - label: 高
            - label: 未验证
            - label: 高
        - label: 连接器与遥测连续性
          note: 该架构与外部系统及已点名的遥测提供方集成。
          values:
            - label: 中等（定性）
            - label: 高
            - label: 未验证
            - label: 高
        - label: 数据平台连续性
          note: 一则已发布的客户证言描述了共享 Snowflake 数据库的部署。
          values:
            - label: 中等（定性）
            - label: 高
            - label: 未验证
            - label: 高
        - label: 定价与采购不透明
          note: 第三方样本报告了不同的统计口径和分母。
          values:
            - label: 中等（定性）
            - label: 中高
            - label: 部分
            - label: 高
        - label: API 与定制化限制
          note: RFP.wiki 报告称，用户要求增加端点，并希望厂商协助高级工作流。
          values:
            - label: 中等（定性）
            - label: 中
            - label: 部分
            - label: 中
        - label: 资本条款与现金续航
          note: 已点名的融资证据无法证明当前现金、优先权或现金续航。
          values:
            - label: Unknown
            - label: 中
            - label: 未验证
            - label: 中高
    approximationNotes: 截至 2026-10-07 的定性综合；未知不等于低，缺少公开证据也不证明控制措施或事件不存在。
    claimRefs:
      - CR001
      - CR006
      - CR010
      - CR011
      - CR012
      - CR013
      - CR015
      - CR016
  - id: FV001
    title: 推荐逻辑决策链
    type: flow
    summary: 从技术差异化一路推导到因财务不透明而建议继续研究的逻辑决策路径。
    data:
      nodes:
        - id: tech-differentiation
          label: 自主开放式 XDR 架构
          description: 与 Snowflake 等云数据湖集成，并提供高保真的攻击故事呈现
        - id: enterprise-validation
          label: 已验证的企业客户进展
          description: Snowflake 等组织已在生产环境采用，平均 ACV 接近 $280k
        - id: competitive-headwinds
          label: 激烈的 SIEM 竞争
          description: 与 Splunk 等既有平台竞争，客户切换阻力很高
        - id: financial-opacity
          label: 缺少已披露指标
          description: 自 2022 年以来，尚未披露最新的经审计 ARR、NRR、毛利率或估值
        - id: down-round-risk
          label: 下行资本风险
          description: 在增长进展不透明的情况下，资本悬置以及潜在的稀释性融资
        - id: final-recommendation
          label: 立场：继续研究
          description: 在核实一手财务数据和股权结构表尽调前，暂不投入新增资本
      edges:
        - from: tech-differentiation
          to: enterprise-validation
        - from: enterprise-validation
          to: competitive-headwinds
        - from: competitive-headwinds
          to: financial-opacity
        - from: financial-opacity
          to: down-round-risk
        - from: down-round-risk
          to: final-recommendation
    approximationNotes: 流程图展示定性尽调阶段如何推进至最终投资判断。
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV008
      - CV010
      - CV013
