      - number: '3.3'
        title: 定价、打包与采购不确定性
        blocks:
          - type: paragraph
            body: >-
              保留证据中没有 Hunters 可直接比较的公开标价。Vendr 列出 $277,138 的平均合同金额，并称其定价洞察来自超过两名独立买方和四笔已完成交易。CostBench
              则报告定制定价、两个套餐、无免费层，以及基于三份第三方买方报告的方向性 $440,000
              年费中位数。这些数字不是有效价格区间：一个是平均合同金额，另一个是年度中位数，样本都很小且标准化方式不清楚。竞争对手证据同样不均衡。PeerSpot 描述了部署成本和许可取舍，包括 Elastic
              的免费开源使用、Wazuh 的开源灵活性，以及 Microsoft Sentinel 的订阅捆绑，但没有提供合同级、同口径报价。
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              证据显示其工作流有实用差异化，但没有证明存在持久护城河。接入现有控制系统可以减少全面替换的摩擦，并适应异构环境；客户自有数据模型也可能形成实际的工作流嵌入。但同样的开放性意味着，只要买方能用现有
              SIEM、云套件、开源工具或内部工程拼出检测、调查和响应，Hunters 就会面临竞争。RFP.wiki 的 Hunters 快照显示总评分 3.6、功能评分 4.1、评测网站平均评分 4.2，共 42
              条评价，同时指出公开定价、留存、可靠性和财务透明度有限。这些是发布方指标，不是市场份额，但强化了尽调结论：持久性取决于可证明的分析师生产率和检测结果，而分配来源没有独立进行基准测量。
            claimRefs:
              - CP005
              - CP009
              - CP010
              - CP016
