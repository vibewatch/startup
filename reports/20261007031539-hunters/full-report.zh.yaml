  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按证据加权的风险排序
        blocks:
          - type: paragraph
            body: >
              Hunters 的公开风险画像，既由已披露的产品属性定义，也由无法核验的事项定义。当前最强的不利信号来自 RFP.wiki 的综合判断：公开定价、留存、可靠性和财务透明度有限；部分用户希望增加 API
              端点和定制能力，高级工作流可能需要供应商协助。SoftwareSuggest 的 Hunters
              页面没有评价，因此没有来自其用户群的反向证据。这些观察不证明可靠性或留存较弱；但由于投资者无法根据分配到的公开证据校准故障频率、续约韧性或缓解措施成熟度，剩余尽调风险因此上升。


              因此，下面的定性排序将已观察到的依赖与未知事件发生率分开。保证措施和事件历史核验、连接器连续性以及商业透明度承担最高剩余风险。API
              和定制限制属于更窄的执行风险。每个评级都是与引用的公开披露或明确证据缺口相连的分析综合，而不是测得的概率。未知可能性不会被刻意打成低风险。
            claimRefs:
              - CR006
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
