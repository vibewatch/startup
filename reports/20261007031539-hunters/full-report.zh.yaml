      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              分配证据中最强的需求机制是运营杠杆。TechCrunch 称威胁搜寻传统上依赖人工，并引用投资者观点说专业人才很难招聘；Hunters
              当前材料则称，自动丰富、关联和调查能够吸收部分工作量。与现有系统和客户数据平台集成可以缩小替换范围，但也会带来对遥测质量、连接器覆盖和数据流健康度的依赖。商业摩擦不小：公开价格按报价确定，两个可用合同基准的样本都很小；RFP.wiki
              表示公开价格和留存细节有限，部分用户希望增加 API 端点，高级工作流可能还需要供应商协助。RFP.wiki
              的比较是方向性的，不是独立市场基准。因此，采用时点应围绕续约事件、实施工作量和可量化的分析师工时节省来评估。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM014
              - CM015
