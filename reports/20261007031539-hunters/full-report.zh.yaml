  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              证据支持的市场边界较窄，围绕安全运营工作流，而不是整个网络安全支出。Hunters
              的文档展示了失陷指标搜索、威胁集群调查、自动调查和数据流监控；历史报道则描述了与现有系统的集成，而非专有采集栈。因此，纳入的支出是用于摄入安全遥测、关联线索、调查活动和支持响应的软件与运营工作流。终端防护、通用云存储、非安全分析，以及
              “hunters”
              一词的无关用法，都不在边界内。一条分配到的行业趋势结果其实是关于看房者的房地产报道；保留它只是为了直接证明搜索存在歧义，不纳入任何规模代理。人工分析师主导的威胁搜寻，是保留证据中最清晰的现状替代方案。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM006
              - CM011
              - CM016
