  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现结构
        blocks:
          - type: paragraph
            body: >-
              Hunters 通过多层级企业 SaaS 订阅，将自主威胁搜寻和安全运营平台商业化，核心产品是 SOC Platform 和 Pathfinder AI。根据 Costbench
              的第三方商业基准数据，Hunters 提供两个主要软件套餐，没有免费入门层：核心 SOC Platform 和 Pathfinder
              AI，均按报价确定的定制企业协议收费。买方交易数据表明企业合同金额较大，反映出大规模数据摄入和集中式威胁遥测处理。Costbench 根据已验证的第三方企业采购报告 $440,000 的年合同金额中位数；采购平台
              Vendr 则记录已完成客户软件交易的平均年合同金额为 $277,138，范围从入门价格到每年 $600,000。除软件平台许可外，Hunters 还通过内部专业研究团队 Team Axon
              提供托管检测工程和专门分析师支持，为希望外包高级检测编写和威胁分流的客户提供运营增值服务。
