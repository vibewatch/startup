      - number: '5.3'
        title: 部署、生态集成与技术限制
        blocks:
          - type: paragraph
            body: >-
              Hunters 的部署以快速实现价值为目标，数日内即可具备运营条件，无需专业服务项目或专有终端传感器。Hunters 不部署定制采集代理，而是通过基于 API
              的连接器和原生集成，从主要身份、终端和云基础设施供应商处收集遥测。然而，独立用户评价和竞争性 RFP 基准显示出明显的运营边界与采用摩擦。用户认可 Hunters AI 驱动的调查分流和关联效果（42 条评价的
              RFP.wiki 综合评分为 3.6），但从业者反馈指出，高级调查工作流仍需供应商协助，并要求分析师具备专业能力。评测者还指出长尾定制解析器的文档存在缺口，独立正常运行时间 SLA
              和大规模延迟基准也未披露。此外，第三方买方指南显示平均年合同金额约为 $280,000；如果企业团队在复杂多云部署中遇到意外数据湖查询成本，或需要 Team Axon 的高级事件响应服务，这会形成明显预算门槛。
