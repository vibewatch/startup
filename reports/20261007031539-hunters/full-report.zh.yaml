  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局、替代方案与买方路径
        blocks:
          - type: paragraph
            body: >-
              相关竞争集合比一份短小的新一代 SIEM 厂商名单更广。PeerSpot 将 Hunters 与 Cortex XDR、Splunk Enterprise Security、Wazuh、Microsoft
              Sentinel、Elastic Security、Rapid7、Exabeam 等安全运营产品比较；RFP.wiki 则把 Splunk、Blumira、Sumo Logic 和 Elastic
              排在其同类排名前列。这些名单显示，买方可以选择现有
              SIEM、云平台产品、开源栈，或托管及自动化导向的替代方案。内部自建和延续现有工具链也是决策路径，但分配到的证据没有量化其人员成本或普及程度。因此，画像表将这些路径视为明确缺口，而不是给出没有依据的规模、融资或市场份额数值。
            claimRefs:
              - CP002
              - CP003
              - CP006
