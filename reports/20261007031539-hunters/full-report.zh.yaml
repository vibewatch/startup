  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品架构与客户工作流转型
        blocks:
          - type: paragraph
            body: >-
              Hunters 将 SOC Platform 定位为新一代 SIEM
              的直接替代方案，面向被告警疲劳和不断上涨的日志许可成本拖累的精干及大型企业安全团队。传统安全运营中心（SOC）工作流要求一级分析师手动检查分散在不同终端、身份和云监控工具中的安全告警，随后还要用供应商专有语言编写繁琐查询。Hunters
              通过建立开放式安全数据湖架构重做这一运营模式，把所有摄入的安全遥测统一为 Open Cybersecurity Schema Framework（OCSF）。平台不再把告警困在各供应商孤岛中，而是持续关联 IT
              和云环境中的不同事件，形成统一的多阶段攻击故事。借助机器驱动的丰富、关联和自动评分，平台消除误报并找出高风险威胁；据报道，在不要求手工维护 playbook 的情况下，人工告警分流量可减少
              80%。此外，企业既可以提供自己的数据湖，例如专用 Snowflake 数据库实例，也可以使用 Hunters 管理的存储库，从而摆脱按摄入量收费的供应商锁定。
