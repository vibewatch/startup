      - number: '7.2'
        title: 运营与平台依赖
        blocks:
          - type: paragraph
            body: >
              Hunters 的架构依赖其他系统产生的遥测数据。TechCrunch 报道称，该产品通过接入现有系统收集信息；Hunters 的集成目录则明确描述了从 AWS Config、AWS Cloudtrail、AWS
              VPC Flow、AWS WAF、CrowdStrike Falcon 及许多其他来源摄入数据。Hunters 网站发布的客户引语称，原始数据流会进入共享 Snowflake
              数据库。这些披露支持一个真实的依赖风险：即使 Hunters 自身仍可用，API 变化、连接器缺陷、上游中断、权限变化或数据质量下降，也可能降低可见性或延迟调查。


              公开材料没有披露按连接器或数据仓库划分的客户级集中度、合同服务水平、经过测试的故障转移行为或恢复目标。RFP.wiki 报告部分用户希望增加 API
              端点和定制能力，高级工作流可能需要供应商协助，这进一步提高了实施和支持敏感度。缓解措施不能只是拥有广泛连接器目录；投资评估应要求连接器健康遥测、重放与核对测试、记录在案的降级模式、变更通知义务，以及客户数据退出流程。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR011
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR013
      - number: '7.3'
        title: 商业与财务模型风险
        blocks:
          - type: paragraph
            body: >
              定价证据是方向性的，并且高度依赖样本。Vendr 根据内部交易数据报告约 $280,000 的年费，最高约 $600,000。Costbench 则根据截至 2026 年 10 月的三份第三方买方报告给出
              $440,000 年费中位数，并标注为方向性数据。来自不同样本的平均值、最高值和中位数不能互换，因此这些观察支持定制、高金额的企业合同，但不足以得出可辩护的标价、平均合同金额或续约预测。


              Prospeo 报告年收入 $15 million、累计融资 $68 million，并基于行业平均值和估计收入给出 $48 million 的估值。这些都是低置信度的第三方估计：收入不等于
              ARR，累计融资不等于可用现金，二者都没有提供现金消耗、跑道、毛利率、续约或营运资本证据。公开来源还提到历史种子轮和多家战略投资者，但没有当前资本结构或优先权条款。在管理层提供特定期间的财务数据、现金、债务、股权结构表和队列证据之前，投资模型应保持不定价。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR013
      - number: '7.4'
        title: 监管、法律与保证措施缺口
        blocks:
          - type: paragraph
            body: >
              相关分配来源没有提供 Hunters 当前的 SOC 2 或 ISO 证据、数据处理协议、子处理商清单、数据驻留承诺、AI
              治理方案，或监管与诉讼历史。这是证据集的局限，不代表控制措施、认证、事件、诉讼或执法不存在。不利搜索没有返回保留的相关结果；无关的 Hunters Financial Group 和 job-hunter
              页面被排除，而没有误归因给该公司。


              由于 Hunters
              通过多个集成处理或分析企业安全遥测数据，缺少保证措施材料会直接影响决策。尽调应追踪数据类别、处理地点、子处理商、保留与删除控制、模型使用边界、事件通知义务、审计权和合同责任。法律顾问应独立搜索相关公司实体和司法辖区。在这些步骤完成之前，保证措施失败以及任何未披露的重大事件或诉讼程序，其发生可能性仍未知，剩余风险仍高。
            claimRefs:
              - CR001
              - CR010
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR010
              - CR015
              - CR016
      - number: '7.5'
        title: 缓解措施、监控与退出标准
        blocks:
          - type: paragraph
            body: >
              主要缓解措施应是能产出证据的控制，而不是叙事性保证。在投资委员会审议前，Hunters
              应提供最新第三方保证报告、渗透测试整改状态、子处理商和数据驻留文件、五年事件与索赔主张清单、连接器服务水平历史，以及客户数据退出计划。代表性概念验证（PoC）应根据测试前约定的阈值，测试遥测完整性、延迟事件重放、连接器模式变化、数据仓库中断、检测准确性、调查延迟和支持升级。


              触发投资论点失效的条件是可衡量的：拒绝或无法提供保证措施与事件材料；概念验证（PoC）未达到约定的完整性、延迟或恢复阈值且未及时整改；出现与管理层陈述不一致的重大事件、诉讼程序或控制例外；经过核验的毛利率、现金消耗、跑道、续约或集中度数据无法让基金在拟议价格下达到回报门槛；或未披露的优先权和治理条款损害下行保护。在这些核查通过前，正确姿态是继续研究，而不是把公开沉默视为安全信号。
            claimRefs:
              - CR006
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
              - CR016
      - number: '7.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 不要把沉默当成安全
            body: >-
              分配到的公开证据无法确认当前保证措施覆盖、事件历史、诉讼或执法状态、连接器服务水平、经审计经济数据或资本条款。应将这些事项作为交割前尽调，并预先约定证明标准；如果无法提供，或出现与管理层陈述相冲突的重大例外，就应停止投资或重新定价。
            calloutType: risk
            claimRefs:
              - CR006
