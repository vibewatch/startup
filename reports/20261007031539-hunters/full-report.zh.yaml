        title: 展示材料
        blocks:
          - type: callout
            title: 市场规模尚未完成投资评估
            body: 合同金额证明了企业采购规模，但没有有来源的买方数量、符合条件的客户群、地域范围、渗透率假设和续约基础，就不能外推 TAM 或 SOM。
            calloutType: risk
            claimRefs:
