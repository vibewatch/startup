  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与核心反论点
        blocks:
          - type: paragraph
            body: >-
              Hunters 的核心投资论点，建立在其现代架构定位之上：这是一个 AI 驱动、供应商无关的 SOC 平台，利用 Snowflake Computing
              等云数据湖，而不是专有且高成本的数据摄入孤岛（CV001、CV002）。知名企业的验证表明，平台无需强制部署终端代理，就能将威胁信号关联为可行动的事件故事，确实具备技术差异化（CV003、CV004）。但核心反论点来自严重的财务不透明和拥挤的市场（CV005）。公司自早期商业里程碑以来没有披露经过核验的收入或
              ARR 指标，投资评估因而依赖未经核验的第三方估计（CV006、CV007）。此外，直接与 Splunk 等成熟现有平台及新一代云 SIEM
              供应商竞争，会带来结构性替代摩擦和更高续约风险（CV008、CV009）。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV008
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: 建议立场与进入纪律
        blocks:
          - type: paragraph
            body: >-
              我们对 Hunters 的明确建议是继续研究，置信度中等，风险评级高，估值立场未知（CV010）。尽管历史风险融资在 2021 年 8 月 $30.0M Series B 后，于 2022 年 1 月通过
              $68.0M Series C 累计达到
              $98.0M，但公开信息没有形成后续股权估值或价格发现（CV011、CV012）。在没有核验订阅留存率、毛利率画像和现金跑道数据的情况下进入投资或私募二级交易，会带来无法量化的下行敞口（CV006、CV010）。企业采购基准显示合同金额差异很大，平均年合同金额约
              $280,000，顶级协议最高达到 $600,000；但这些时点交易数据不能替代完整的经审计财务表现（CV013、CV014）。
            claimRefs:
              - CV006
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV006
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV008
              - CV010
              - CV013
      - number: '8.3'
        title: 情景分析、下行触发因素与尽调要求
        blocks:
          - type: paragraph
            body: >-
              Hunters 的投资判断覆盖乐观、基准和悲观三种路径，核心变量是商业扩张速度与市场留存（CV015）。乐观情景下，企业客户持续用 Hunters 替换现有 SOC 方案，开放数据湖的成本优势得以兑现，高 ACV
              部署规模扩大，最终打开战略出售或 IPO 窗口（CV001、CV013）。基准情景下，中端市场和偏好云方案的安全团队稳步增长，但销售周期较长，ARR
              温和扩张、估值倍数承压（CV008、CV014）。悲观情景下，平台巨头激进打包销售，加上企业续约表现缺乏透明证据，可能触发折价轮重组或稀释性清算风险（CV009、CV015）。在验证投资论点前，必须完成完整
              股权结构表审阅、客户续约分群分析，并核实现金消耗指标（CV006、CV016）。
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV009
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV009
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 资本配置纪律
            body: Hunters 展现了架构创新，也获得了前瞻性企业的可信早期采用；但在用经审计的 GAAP 报表和股权结构表清算瀑布模型替代未经审计的经营指标之前，投资委员会不应接受没有依据的估值要求。
            calloutType: recommendation
            claimRefs:
              - CV001
