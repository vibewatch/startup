      - number: '3.2'
        title: 能力取舍与运营模式
        blocks:
          - type: paragraph
            body: >-
              现有证据最清楚地支持的是架构差异，而不是经验证的检测基准。历史报道称，该产品通过接入现有系统收集信息，并将多个告警关联为可行动的攻击故事；当前产品目录将其描述为开放、供应商无关的 XDR 平台；Hunters
              自己的客户引语则称原始数据会进入共享 Snowflake 数据库，供客户构建模型和应用。与这一主张相对，PeerSpot 认为 Splunk 的功能和分析范围更广，但部署更重；Wazuh
              提供开源灵活性，却需要不同的运营模式。RFP.wiki 还记录了增加 Hunters API 端点和定制能力的需求，并指出高级工作流可能需要供应商协助。这些来源支持定性的定位图，不足以声称检测准确率更高。
