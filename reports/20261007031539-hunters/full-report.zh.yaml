chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司定位与架构使命
        blocks:
          - type: paragraph
            body: >-
              Hunters 于 2018 年在以色列特拉维夫成立，旨在解决现代企业安全运营的根本瓶颈：威胁搜寻和告警分流高度依赖人工，且人才受限。不同于部署专有终端代理、或像传统 SIEM
              架构那样按摄入量收取数据费用，Hunters 首创了能够跨技术栈关联遥测数据的自主威胁搜寻引擎。平台从不同企业环境摄入遥测数据，将标准化数据流写入客户共享的 Snowflake
              数据库，让安全团队直接在开放数据湖基础设施上完成高级威胁检测、线索丰富、排序和自动调查，避免供应商锁定。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO006
              - CO008
              - CO010
              - CO013
              - CO014
      - number: '1.2'
        title: 创始团队、管理层与治理
        blocks:
          - type: paragraph
            body: >-
              公司由 CEO Uri May 和 CTO Tomer Kazaz
              共同创立。两位创始人都在以色列国防军担任网络情报军官，随后开启技术与运营职业生涯，使管理层在企业威胁建模和对抗战术上具备真实的创始团队与市场匹配度。前 8200 部队指挥官 Ehud Schneerson
              加入董事会，与 Blumberg Capital 共同领投种子轮，进一步强化公司治理。运营层面，公司预计有约 91 至 181 名员工，分布在工程、产品、威胁研究和全球商业拓展等 13 个运营部门。
            claimRefs:
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO007
      - number: '1.3'
        title: 资本结构、投资者与战略支持
        blocks:
          - type: paragraph
            body: >-
              Hunters 在四轮已披露融资中累计募集 $118.4 million 股权资本：2019 年 5 月由 YL Ventures 和 Blumberg Capital 领投的 $5.4 million
              种子轮，最终发展到 2022 年 1 月由 Stripes 领投的 $68.0 million Series
              C。公司的股权结构表呈现出少见的组合：顶级机构型网络安全创投与大型战略云基础设施供应商并列支持。主要机构投资者包括 Bessemer Venture Partners、YL Ventures、DTCP、U.S.
              Venture Partners，以及 Microsoft 的风险投资基金 M12；Snowflake、Databricks、Cisco Investments 和 Okta Ventures
              的战略性资产负债表投资，则进一步巩固了 Hunters 与企业云数据生态的架构协同。
