  topStrengths:
    - Integrated training-plus-inference breadth creates real workflow stickiness and expansion paths.
    - Public evidence shows strong scale proof, including more than 10,000 companies and 40T+ tokens per day.
    - Founder-market fit and enterprise distribution are unusually credible for infrastructure software.
  topRisks:
    - Public valuation already reflects aggressive growth assumptions.
    - Gross margin, burn, runway, NRR, and concentration remain undisclosed.
    - GPU economics, partner-channel dependence, and open-model commoditization could compress margins.
  unresolvedGaps:
    - No audited financials or reconciled margin, burn, and runway data are public.
    - No full cap table or waterfall details for the July 2026 Series D are public.
    - Customer concentration, NRR, churn, and contract minima remain undisclosed.
    - GPU-supply, licensing, and partner-channel economics are still opaque.
