schemaVersion: report-v2
artifact: customers
slug: fireworks-ai
runDate: 2026-10-15
company:
  name: Fireworks AI
chapter:
  number: 6
  title: Customers
  summary: >-
    Fireworks shows credible production adoption with named customers, partner case studies,
    and customer testimonials, but the strongest public proof still comes from company- or
    partner-controlled materials rather than independently audited retention data. The evidence
    supports a developer-to-enterprise land-and-expand motion, while leaving NRR, churn,
    contract duration, and customer concentration unresolved.
sections:
  - id: customer-footprint
    title: Customer footprint and who appears to buy
    body: >-
      Public evidence points to two overlapping customer groupings. The first is AI-native
      software teams and developer-led product groups that need fast open-model inference,
      lower latency, and an easy migration path from OpenAI-style APIs. The second is larger
      enterprise or regulated buyers that care about data sovereignty, compliance posture, and
      the ability to move from experimentation to dedicated or reserved capacity without
      rebuilding the stack. Fireworks' own materials name customers such as Samsung, Uber,
      DoorDash, Notion, Shopify, and Upwork, while current testimonials skew heavily toward
      AI-native software companies such as Cursor, Sourcegraph, Vercel, Gumloop, Quora, and
      Genspark. That mix suggests the company wins first with performance-sensitive builders,
      then tries to move upmarket through infrastructure, security, and partner distribution.
    claimRefs: [CU001, CU004, CU007, CU008, CU009]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Named production proof and adoption trajectory
    body: >-
      The strongest named customer proof is qualitative, but it is still meaningful. Fireworks'
      site includes attributed quotes from buyers describing concrete production outcomes, and
      AWS supplies third-party corroboration for at least one end-customer outcome and for
      Sourcegraph's Cody deployment. The October 2025 Series C announcement adds broader scale
      signals: more than 10,000 companies, hundreds of thousands of developers, more than 10
      trillion tokens per day, and annualized revenue above $280 million. Those figures show
      commercial traction and deployment breadth, but they are not retention metrics, and they
      do not reveal how much of the customer base is paying at enterprise scale versus using
      lighter self-serve or experimental workloads.
    claimRefs: [CU003, CU005, CU006, CU011, CU013, CU014, CU015]
    tableRefs: [TU002, TU003]
  - id: durability-and-expansion
    title: Expansion path is clear; durability and concentration are not
    body: >-
      Fireworks presents a coherent expansion motion: developers can start on serverless usage,
      move to dedicated deployments, then add reserved capacity and training on the same
      platform as workloads mature. That packaging creates a plausible land-and-expand loop,
      especially when paired with partner ecosystems such as AWS, NVIDIA, and MongoDB. The
      gap is that public evidence stops short of proving durability. Retention metrics, renewal
      terms, churn, contract length, and top-customer concentration are not disclosed in the
      retained public materials. Independent review material also highlights friction points:
      a minimal free-credit entry point and pricing that often moves into sales-led enterprise
      conversations. Together, the public record supports real adoption and expansion logic,
      but not the resilience or concentration profile of that revenue base.
    claimRefs: [CU002, CU009, CU010, CU012]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale evidence
      - Revenue / strategic value
      - Gap
    rows:
      - - AI-native software builders
        - Product and engineering teams use the APIs; platform or product leaders approve usage spend
        - Coding assistants, search, agent workflows, and application AI features
        - Cursor, Sourcegraph, Notion, Quora, Vercel, Gumloop, and Genspark are cited in current testimonials
        - Strongest public proof for Fireworks' performance-led wedge and production relevance
        - No disclosed segment revenue mix, geography split, or renewal profile
      - - Enterprise and regulated deployments
        - Platform, data, or IT teams evaluate; enterprise procurement pays
        - Hosted APIs or customer-controlled deployments for data-sensitive workloads
        - Series C customer list includes Samsung, Uber, DoorDash, Shopify, and Upwork; MongoDB says data can stay on customer premises
        - Supports the move from developer self-serve into compliance-sensitive enterprise use cases
        - No named contract sizes, vertical penetration, or production seat counts
      - - Partner-assisted channel motion
        - Cloud, hardware, and data-platform partners influence technical buyers and procurement paths
        - Infrastructure optimization, secure enterprise deployment, and integrated RAG / cloud control planes
        - AWS, NVIDIA, and MongoDB case material is used to explain customer outcomes and enterprise readiness
        - Partnerships can accelerate trust and standardization in larger accounts
        - Attach economics, partner-sourced pipeline share, and dependence on a few channels are undisclosed
    notes: >-
      Segment rows synthesize named logos, partner case studies, and current product packaging;
      they are directional rather than an exhaustive census of the installed base.
    claimRefs: [CU001, CU004, CU007, CU009]
  - id: TU002
