      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Customer count
        - over 10,000 companies
        - "2025-10-28"
        - Fireworks Series C blog
        - medium
        - Broad customer footprint supports real commercial adoption
        - Paying versus active versus trial users is not disclosed
      - - Developer reach
        - hundreds of thousands of developers
        - "2025-10-28"
        - Fireworks Series C blog
        - medium
        - Suggests wide top-of-funnel and ecosystem reach
        - No active-monthly or retained-developer metric is disclosed
      - - Usage scale
        - more than 10 trillion tokens per day
        - "2025-10-28"
        - Fireworks Series C blog
        - medium
        - Indicates meaningful production traffic at platform scale
        - Public sources do not separate customer traffic from internal, benchmark, or burst load
      - - Revenue run rate
        - annualized revenue surpassed $280 million
        - "2025-10-28"
        - Fireworks Series C blog
        - medium
        - Customer spend is scaling with production usage
        - No ARR, cohort retention, churn, or margin bridge is disclosed
    notes: >-
      All figures are company-disclosed point-in-time metrics from the Series C announcement;
      they show traction, but not customer quality, retention, or concentration.
    claimRefs: [CU003, CU011, CU012]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Sourcegraph
        - Developer tools
        - Cody coding-assistant inference on Fireworks
        - production
        - AWS says completion acceptance doubled and backend latency improved by more than two times
        - Outcome is strong, but contract value and timing are undisclosed
      - - Notion
        - Enterprise software
        - Fine-tuned models and AI feature serving
        - production
        - Notion says latency fell from about 2 seconds to 350 milliseconds
        - Proof is a current vendor-curated testimonial with no workload or spend denominator
      - - Quora
        - Consumer internet
        - Hosting open-source models including SDXL, Llama, and Mistral
        - production
        - Quora says one migrated model became 3x faster and boosted engagement metrics
        - No date, volume, or revenue impact is disclosed
      - - Cursor
        - AI developer tools
        - Composer 2 RL inference and production inference
        - production
        - Cursor says Fireworks is more performant than open-source engines and its RL inference scales elastically and globally
        - Claim is from a vendor-hosted quote and does not quantify contract size or retention
    notes: >-
      This is a partial sample of named public proof, not an exhaustive customer list. Public
      evidence is strongest for production usage and performance anecdotes, weaker for retention,
      contract expansion, and revenue concentration.
    enumerationScope:
      coverage: sample
      basis: >-
        Sample of named customer proof available in retained 2025-2026 public materials,
        emphasizing sources with attributed quotes or concrete outcomes rather than logos alone.
    claimRefs: [CU006, CU013, CU014, CU015]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      The public journey runs from developer trial to enterprise standardization, with the
      strongest proof on adoption steps and less proof on long-term retention.
    data:
      items:
        - label: Prototype evaluation
          actor: Developer
          touchpoints:
            - OpenAI-compatible API
            - Serverless, pay-per-token entry point
        - label: Production integration
          actor: Product and ML teams
          touchpoints:
            - Dedicated GPUs with autoscaling
            - Structured outputs, function calling, and model choice
        - label: Security and compliance review
          actor: Enterprise buyer
          touchpoints:
            - SOC 2 Type II, HIPAA-ready, and GDPR-compliant posture
            - Deploy into customer-controlled environments for sensitive data
        - label: Named customer expansion
          actor: AI-native software teams
          touchpoints:
            - Sourcegraph doubled completion acceptance and improved latency
            - Notion cut latency from about 2 seconds to 350 milliseconds
        - label: Partner-led enterprise trust
          actor: Platform and procurement stakeholders
          touchpoints:
            - AWS and NVIDIA optimization narrative
            - MongoDB RAG and data-sovereignty packaging
        - label: Spend expansion loop
          actor: Platform owner
          touchpoints:
            - Serverless -> on-demand -> reserved
            - Training and inference on one stack
    approximationNotes: >-
      The sequence is an analytical synthesis of publicly described adoption surfaces, not a
      disclosed funnel with conversion rates.
    claimRefs: [CU002, CU009]
