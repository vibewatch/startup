  evidenceGaps:
    - type: missing-source
      severity: material
      topic: durability-gap
      missingEvidence: Public NRR, GRR, churn, renewal-rate, and contract-length disclosure by cohort or customer segment
      whyItMatters: >-
        The chapter can show adoption and point-in-time traction, but without durability data it
        cannot distinguish sticky enterprise revenue from bursty or experimental usage.
      diligencePath: >-
        Request board materials or data-room cohort analyses showing gross retention, net
        retention, logo churn, contract terms, and renewal behavior for the last four quarters.
      relatedQuestionRefs: [QU005]
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: Top-customer revenue share, cloud-credit dependence, and partner-sourced pipeline concentration
      whyItMatters: >-
        A small number of large AI-native accounts or channel partners could drive outsized
        revenue, materially changing the risk profile versus the headline customer count.
      diligencePath: >-
        Obtain customer concentration schedules, top-20 account ARR, and pipeline attribution by
        direct sales versus partner channel from management.
      relatedQuestionRefs: [QU006]
    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof
      missingEvidence: A fuller named customer list with deployment status, go-live dates, and measurable outcomes
      whyItMatters: >-
        Public proof is sufficient to show real usage, but not to estimate how representative the
        visible wins are across geographies, industries, or account sizes.
      diligencePath: >-
        Ask management for a referenceable customer list segmented by industry, region, contract
        tier, and production status, then reconcile it to the public testimonial set.
      relatedQuestionRefs: [QU002, QU008]
      relatedTableRefs: [TU003]
