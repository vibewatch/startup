figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: The ordinal map separates open-model specialization from managed lifecycle breadth; it does not rank measured speed, price, quality, or market share.
    data:
      xAxis:
        label: Open-model specialization
        min: 1
        max: 5
        low: Broad or multi-provider platform
        high: Dedicated open-model focus
        description: Analyst ordinal based only on the retained product-scope descriptions.
        scale: ordinal
      yAxis:
        label: Managed lifecycle breadth
        min: 1
        max: 5
        low: Self-operated or stock inference
        high: Integrated training-to-serving lifecycle
        description: Analyst ordinal based on retained evidence for managed training, inference, and deployment modes.
        scale: ordinal
      points:
        - label: Fireworks AI
          x: 5
          y: 5
          tone: positive
          context: Open-model focus with serverless, dedicated, reserved, and managed training modes.
        - label: Together AI
          x: 5
          y: 4
          tone: neutral
          context: Broad open-model catalog and combined training plus inference in retained comparisons.
        - label: Groq
          x: 4
          y: 1
          tone: risk
          context: Specialized hardware-led inference with narrower catalog and no fine-tuning in the retained review.
        - label: Replicate
          x: 3
          y: 2
          tone: neutral
          context: Broad specialty-model marketplace with less emphasis on production LLM lifecycle depth.
        - label: AWS Bedrock
          x: 2
          y: 3
          tone: neutral
          context: Hyperscaler control-plane route; detailed training and serving breadth was not established here.
        - label: Internal build
          x: 5
          y: 1
          tone: risk
          context: Maximum workload-specific control, but the buyer operates the complete lifecycle.
    approximationNotes: "Coordinates are 1-5 analyst ordinal judgments from qualitative retained evidence. They are not benchmark results; unavailable comparison fields remain explicit in the tables."
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP009]
callouts:
  - calloutType: risk
    title: Portability cuts both ways
    body: Compatibility can shorten migration into Fireworks, but it also makes provider switching and multi-homing more feasible. Retention therefore has to come from workload performance, reliability, customization workflow, and commercial execution rather than API lock-in alone.
    claimRefs: [CP006, CP012, CP013]
  - calloutType: assumption
    title: Published comparisons are not buyer-specific benchmarks
    body: The retained independent sources offer useful competitor taxonomy and pricing signals, but they do not provide a same-model, same-region, same-prompt benchmark across Fireworks, Together AI, Groq, Replicate, Bedrock, and self-hosting.
    claimRefs: [CP013]
