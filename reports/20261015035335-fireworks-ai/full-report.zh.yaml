      - number: '3.2'
        title: 能力广度有用，但并不独占
        blocks:
          - type: paragraph
            body: >-
              Fireworks 提供从无服务器试验到专用或预留容量，再到模型训练的广泛托管路径。官方页面还声称兼容 OpenAI 和
              Anthropic，这可以降低应用团队的迁移成本。便利性的竞争代价是切换摩擦更低：一份独立指南指出，兼容 API 让供应商之间相对容易迁移。目录广度总体方向积极，但公司自有页面给出超过 100 个和超过 250
              个模型两种无法核对的数量，因此在没有有日期的定义前，任何一个数字都不应视为唯一标准库存。定位图使用的是关于专业化和生命周期广度的透明序数判断，而不是速度、质量、成本或市场份额测量。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP012
