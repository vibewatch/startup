  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Fireworks 看起来是高质量资产，但当前公开投资判断更多关乎价格纪律，而非公司质量。独立的 2026 年来源将 D 轮描述为融资约 $1.505B、投后估值约 $17.5B–$18B；Multiples 和
              Value Add VC 都按约 $1B 收入运行率，把该轮估值描述为接近 17.5x 收入倍数。Fireworks 似乎已从 2025 年末每日超过 10T tokens、年化收入 $280M，增长到 2026
              年 7 月每日 40T+ tokens、收入运行率
              $1B；对这样的公司而言，这一价格并非明显不合理，但也意味着容易获得的上行已经预先支付。由于公开证据仍不足以精确确定轮次经济性、利润率持久性或留存质量，不足以支持虚假精确度，因此建议观察而非买入，除非尽调结果或价格改善。
            claimRefs:
              - CV003
