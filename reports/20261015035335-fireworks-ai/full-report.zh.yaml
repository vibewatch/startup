chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、产品范围与当前规模
        blocks:
          - type: paragraph
            body: >-
              Fireworks AI 对自身的定位不是通用模型托管商，而是“专业智能”的基础设施层：在同一套服务技术栈上整合训练、微调和生产推理。保留的官方及第三方更新来源一贯显示，其产品包括无服务器推理、专用 /
              按需部署、预留容量、模型定制以及兼容 OpenAI 的接口。因此，后续尽调应把公司视为兼具开发者和企业销售路径的 AI
              基础设施平台，而不是纯应用厂商。相同来源还显示，公司通过具名客户和合作伙伴获得了较广泛的采用；但客户数和收入质量披露，仍远少于标题所宣称的增长规模。
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
