            body: >-
              Fireworks 获得高溢价最有力的支撑，是产品广度加上真实生产用量证据。公司材料显示，Fireworks 不只是 token 服务
              API：它把训练、微调、评估和推理连接在无服务器、专用和预留部署中；客户一旦标准化，切换成本可能随之上升。2025 年 10 月的 C 轮文章披露超过 10,000 家企业、每日超过 10T tokens 和超过
              $280M 的年化收入；后来的独立摘要称，2026 年 7 月规模超过 $1B 收入运行率和每日 40T tokens，且大多数用量来自客户定制模型。Microsoft 推出 Foundry
              也很重要，因为它可以扩大企业分销和治理可信度，而无需 Fireworks 从零赢得每段企业关系。
