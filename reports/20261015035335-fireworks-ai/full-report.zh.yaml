      - number: '4.3'
        title: 资本充足性仍取决于外部融资和算力纪律
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，公司正在扩大资本需求，而不是摆脱资本需求。Fireworks 曾表示，C 轮资金将用于研究、更广泛的生命周期工具，以及把算力占用扩大 3–4 倍，同时降低每 token 成本、提高利用率；2026
              年 7 月的资料随后又报道了规模大得多的 D 轮。这符合推理基础设施公司的特征：收入可以快速扩大，但现金需求仍与 GPU
              获取、利用率和云经济性紧密相关。因此，现有公开记录支持“融资渠道强”的判断，却不支持“能够自我造血且持久”的判断。
            claimRefs:
              - CI005
              - CI009
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: 财务结论：增长可信，但投资判断的阻塞项仍很严重
        blocks:
          - type: paragraph
            body: >-
              财务结论对需求方向积极，但对收入质量不够放心。Fireworks
              似乎已经形成了围绕生产推理、训练和容量承诺的真实商业引擎，最新第三方融资资料也意味着投资者正在按非常大的规模评估它。问题在于，利润率路径、资本效率和集中度仍不透明。独立评论指出定价不透明，以及超大规模云厂商或定制芯片竞争者可能挤压推理利润率；而所审阅的公开材料没有披露毛利率、烧钱速度、现金
              runway、NRR、流失率、头部客户集中度，或债务与项目融资义务。在这些缺口被尽调补齐之前，相比于一个已充分纳入投资判断、能够持续复利的现金生成器，公司更容易被相信是一个增长很快的业务。
            claimRefs:
              - CI015
              - CI016
              - CI017
      - number: '4.5'
        title: 展示
        blocks:
          - type: callout
            title: 收入可能靠工作负载深度增长，而非席位数
            body: 已披露的变现阶梯表明，Fireworks 会把同一客户从试验推进到更高吞吐量部署、预留容量以及相邻训练支出，以此增加收入。
            calloutType: insight
            claimRefs:
              - CI002
              - CI003
              - CI004
          - type: callout
            title: 增长指标公开，利润率指标不公开
            body: 已报道的收入规模和融资能力很强，但公开材料仍未展示毛利率、烧钱速度、现金 runway 或客户集中度，因此利润率路径和融资依赖程度仍无法确定。
            calloutType: risk
            claimRefs:
              - CI012
              - CI016
          - type: callout
            title: 尽调应聚焦收入质量和容量经济性
            body: 在把估值纳入投资判断前，应索取 cohort 毛利率、GPU 或云最低承诺、按部署模式拆分的实际价格、头部客户集中度，以及多种利用率假设下的现金 runway。
            calloutType: recommendation
            claimRefs:
              - CI009
              - CI015
              - CI016
              - CI017
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 从客户工作流看产品范围
        blocks:
          - type: paragraph
            body: >-
              Fireworks 把自己呈现为完整的模型生命周期平台，而不是单点推理 API。已核实的公开产品面从面向原型的按 token
              计费无服务器访问开始，扩展到专用和预留式生产容量，再延伸到托管训练与编码工作流路由工具。这种广度很重要：团队可以在同一供应商产品面上，把实验性开放模型工作负载迁移到控制力更强的生产环境；但这里最有力的证据仍是官方文档，而非独立审计的产品拆解。因此，尽调重点应从确认端点存在，转为测试流量和模型要求变化时容量、调优资格与路由控制是否保持一致。来源证明了这些产品面存在，却没有证明各产品
