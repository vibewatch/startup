      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 训练与推理一体化的采用扩大，Foundry 拓展企业触达，而毛利率和留存数据证明溢价合理。
        - 估值溢价可以维持甚至重估，因为公司把真实使用量转化为持久的经济性，而不是吃一次性的 AI 热潮。
        - 伙伴依赖、GPU 经济性和同业追赶仍然是关键变量。
        - 需要私有证据证明毛利率和留存优于公开市场怀疑者的预期。
      - - 基准
        - Fireworks 继续赢得关键工作负载，但经济性的公开证据仍不完整，市场已经计入大规模经营得到证明的预期。
        - 当前估值大致足以支持继续跟踪，但新资金的上行空间有限。
        - 执行仍然不错，但估值倍数扩张带来的上行空间有限。
        - 这是最符合当前公开证据集的情景。
      - - 悲观
        - 超大规模云厂商或同业压低价格，伙伴渠道截留更多价值，或者取得私有数据后发现留存和毛利率令人失望。
        - 倍数压缩可能超过持续收入增长的贡献，把回报压到风险投资式门槛收益率以下。
        - 竞争、渠道控制和单位经济性不透明相互强化。
        - 负面评论已经把这条路径指向主要下行触发因素。
    notes: 报告没有给出精确的 IRR 目标，因为公开材料没有披露足够的毛利率、留存、集中度或股权结构表分层信息，无法支撑虚假的精确度。
    claimRefs:
      - CV005
