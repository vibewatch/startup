              detail: 按需容量，适合生产隔离和后训练模型
            - label: 预留容量
              detail: 为更稳定的高用量提供有保障的容量
        - label: 开发者界面
          detail: 多个启动和运营界面封装了同一套底层任务。
          modules:
            - label: UI
              detail: 引导式配置和可视化监控
            - label: CLI / API
              detail: 通过脚本创建任务并管理部署
            - label: Agent 界面
              detail: 借助 Agent 配置训练并排查问题
        - label: 服务运行时
          detail: 推理被定位为基础模型和适配模型共用的运行时。
          modules:
            - label: 兼容层
              detail: 兼容 OpenAI 和 Anthropic 的 API
            - label: 性能引擎
              detail: 批处理、缓存、投机解码和内核优化
            - label: 扩展层
              detail: 跨区域自动扩缩容和流量管理
        - label: 生命周期控制
          detail: 模型晋级和路由属于产品本身，而不是独立技术栈。
          modules:
            - label: 上传 / 优化 / 部署
              detail: 从模型资产到线上端点的一致路径
            - label: 版本与金丝雀
              detail: 在大范围发布前测试新模型或配置
            - label: Nexus / 路由
              detail: 在开放和闭源模型选项之间路由工作负载
        - label: 训练平面
          detail: 托管路径与底层路径和推理并列，而不是藏在另一家供应商的边界之后。
          modules:
            - label: 托管训练
              detail: 使用 OpenAI 格式数据，由 Fireworks 负责调度、检查点和输出
            - label: 支持的模型系列
              detail: DeepSeek、Qwen、Kimi、Gemma、GLM 和 Llama 系列
            - label: 训练 API 备用路径
              detail: 全参数调优和自定义逻辑不在托管 LoRA 路径中
        - label: 信任与运营
          detail: 公开信任信号可见，但深层运营证明仍是尽调事项。
          modules:
            - label: 安全态势
              detail: 定位为 SOC 2 Type II、HIPAA-ready，并符合 GDPR
            - label: 数据处理承诺
              detail: Fireworks 称推理输入和输出不会用于其他目的
            - label: 待尽调事项
              detail: 指定材料包中没有公开 SLA、事故历史或审计范围细节
    approximationNotes: 这是由来源支撑的运营地图，而不是代码级系统图；仅保留指定证据明确描述的层级。
    claimRefs:
      - CE003
      - CE004
      - CE007
      - CE009
      - CE010
      - CE011
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开旅程从开发者试用走向企业标准化；采用步骤的证据最充分，长期留存的证据较少。
    data:
      items:
        - label: 原型评估
          actor: 开发者
          touchpoints:
            - OpenAI 兼容 API
            - 无服务器、按 token 付费的入口
        - label: 生产集成
          actor: 产品和 ML 团队
          touchpoints:
            - 带自动扩缩容的专用 GPU
            - 结构化输出、函数调用和模型选择
        - label: 安全与合规审查
          actor: 企业买方
          touchpoints:
            - SOC 2 Type II、HIPAA-ready，并符合 GDPR
            - 对敏感数据部署到客户控制的环境中
        - label: 已披露客户扩张
          actor: AI 原生软件团队
          touchpoints:
            - Sourcegraph 将补全接受率提高一倍并改善延迟
            - Notion 将延迟从约 2 秒降至 350 毫秒
        - label: 伙伴驱动的企业信任
          actor: 平台和采购相关方
          touchpoints:
            - AWS 和 NVIDIA 的优化叙事
            - MongoDB RAG 和数据主权方案
        - label: 支出扩张闭环
          actor: 平台所有者
          touchpoints:
            - 无服务器 -> 按需 -> 预留
            - 在同一技术栈上训练和推理
    approximationNotes: 该顺序是对公开描述的采用界面的分析综合，不是披露了转化率的漏斗。
    claimRefs:
      - CU002
      - CU009
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 估值压缩、服务连续性和容量经济性仍是最高的剩余风险。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重程度
      rows:
        - label: 估值和利润率压缩
          note: 已报告估值很高，但经审计的利润率、烧钱速度和容量承诺仍无法获得。
          values:
            - 高
            - 高
            - 低
            - 高
        - label: 服务连续性和模型下架
          note: 官方可靠性声明与有限的公开可用性及下架投诉并存。
          values:
            - 中
            - 高
            - 中
            - 高
        - label: GPU 容量和成本依赖
          note: 专用和预留产品缓解了访问风险，但没有披露供应商集中度。
          values:
            - 中
            - 高
            - 中
            - 高
        - label: 隐私、许可和监管尽调
          note: 合规声明可见，但该证据池中缺少一手法律和合同证据。
          values:
            - 中
            - 高
            - 低
            - 高
        - label: 多轮 RL 执行质量
          note: Fireworks 自身描述了工具不稳定、奖励稀疏和奖励投机等失败模式。
          values:
            - 中
            - 高
            - 中
            - 中高
        - label: 支持和买方成本摩擦
          note: 评论汇总显示支持质量存在波动，且使用成本预测具有不确定性。
          values:
            - 中
            - 中
            - 中低
            - 中
    approximationNotes: 矩阵数值是结合引用证据和缺口作出的分析师定性判断，不是实测概率、第三方评分或精算估计。
    claimRefs:
      - CR003
      - CR004
      - CR005
      - CR006
      - CR008
      - CR010
      - CR013
      - CR014
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 公开证据支持对公司作出高质量判断，但不足以在观察到的 2026 年价格区间自动买入。
    data:
      nodes:
        - id: breadth
          label: 一体化产品广度
          detail: 训练、微调、路由和推理位于同一平台。
          claimRefs:
            - CV001
            - CV007
        - id: scale
          label: 规模证明
          detail: Series C 到 Series D 的证据显示，规模从 >10T tokens/$280M 年化收入提升至 40T+ tokens 和约 $1B 运行率。
          claimRefs:
            - CV003
            - CV004
            - CV008
        - id: channels
          label: 企业分销杠杆
          detail: Microsoft Foundry 增加了治理能力和控制平面触达。
          claimRefs:
            - CV009
        - id: pricing
          label: 溢价已被定价
          detail: 2026 年 7 月的公开估值集中在 17.5x 收入倍数附近。
          claimRefs:
            - CV004
            - CV005
            - CV012
        - id: pressure
          label: 利润率和竞争压力
          detail: 负面来源强调超大规模云厂商、模型商品化和由伙伴控制的入口。
          claimRefs:
            - CV010
            - CV011
            - CV015
        - id: call
          label: 推荐 = 跟踪
          detail: 等待更强的私有经济性证据或更好的入场价格。
          claimRefs:
            - CV014
            - CV015
      edges:
        - from: breadth
          to: scale
          label: 广泛产品供给转化为使用量证明
          claimRefs:
            - CV001
            - CV003
        - from: scale
          to: channels
          label: 规模吸引企业渠道
          claimRefs:
            - CV008
            - CV009
        - from: channels
          to: pricing
          label: 分销有助于支撑估值溢价
          claimRefs:
            - CV004
            - CV009
        - from: pricing
          to: pressure
          label: 溢价必须经受更严峻的经济性考验
          claimRefs:
            - CV005
            - CV011
        - from: pressure
          to: call
          label: 下行不对称决定入场纪律
          claimRefs:
            - CV014
            - CV015
    approximationNotes: 仅为定性顺序，不是按概率加权的估值模型。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV009
      - CV010
      - CV011
      - CV014
      - CV015
