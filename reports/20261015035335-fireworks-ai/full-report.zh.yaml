      - number: '4.2'
        title: 公开牵引力强，但单位经济性大多只是代理指标
        blocks:
          - type: paragraph
            body: >-
              Fireworks 的公开收入故事在规模指标上很亮眼，但单位经济性披露很薄。在 2025 年 10 月的 C 轮公告中，公司称服务超过 10,000 家企业，每日处理超过 10 trillion
              tokens，年化收入超过 $280 million。2026 年 7 月的第三方资料进一步描述了约 $1.5 billion 的 D 轮融资、$17.5 billion 的估值和超过 $1 billion
              的收入运行率。这些数字意味着扩张极快，但效率信息只是间接的：Swellpulse 把扩张描述为客户增加 GPU 容量并把试点推入生产。这可以作为销售路径的代理指标，却不能证明毛利率、CAC 回收期或持久的
              cohort 经济性。
            claimRefs:
              - CI004
              - CI006
              - CI007
              - CI008
              - CI011
              - CI012
