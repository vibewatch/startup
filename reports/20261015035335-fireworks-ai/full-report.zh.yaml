      - number: '8.3'
        title: 反论点与估值脆弱性
        blocks:
          - type: paragraph
            body: >-
              反论点很直接：Fireworks 可能正在证明需求，但推理仍是竞争残酷、算力密集的层。Simplify 的反向摘要认为，OpenAI、Anthropic 和 Microsoft Foundry
              可以控制开发者入口，从而压缩利润率；Value Add VC 则指出，随着超大规模云厂商、Together AI、Baseten 及其他推理专业厂商争夺同一企业预算，token
              定价可能陷入竞相压价。即使轮次价格也没有在公开市场完全确定：Forge 的 2026 年 7 月融资页面与融资额方向一致，却显示较低的 $15.54B
              投后估值，且只能部分看到优先权条款。这些因素不会推翻公司逻辑，但会让“估值过高”的判断比干净的买入建议更站得住脚。
            claimRefs:
              - CV006
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.4'
        title: 情景与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              根据公开证据判断 Fireworks，正确方法是给情景划范围，而不是假装能够知道精确目标回报。乐观情景要求一体化产品技术栈以及 Foundry/Nvidia
              关联分销转化为持久留存、可接受的毛利率和相对同业的持续份额增长。基准情景更简单：Fireworks
              仍是重要基础设施，但当前估值已折现了大部分证明过程，新投资者主要等待更好的入场价格或更好的证据。悲观情景不是需求崩溃，而是当合作伙伴控制的分销、定价压力或疲弱单位经济性让 Fireworks
              看起来比本轮价格假设的更容易替代时，估值倍数收缩。因此，最终尽调应集中在毛利率、NRR / 流失率、客户集中度和完整的股权结构表 waterfall 上。
            claimRefs:
              - CV009
              - CV011
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV009
              - CV011
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: 展示
        blocks:
          - type: callout
            title: 观察，不买入
            body: Fireworks 在战略上似乎重要，在运营上也确实存在，但公开估值支撑已经足够昂贵，新资金要么需要看到更好的私有经济性，要么需要更好的入场价格。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV012
              - CV014
          - type: callout
            title: 利润率证明是尽调门槛
            body: 最可信的下行风险，是在 Fireworks 证明持久毛利率和留存之前，合作伙伴控制的分销与 token 价格竞争导致估值倍数收缩。
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV015
