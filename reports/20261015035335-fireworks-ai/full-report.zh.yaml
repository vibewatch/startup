      - number: '3.3'
        title: 产品打包降低进入摩擦；实际经济性仍属私有信息
        blocks:
          - type: paragraph
            body: >-
              公开证据显示 Fireworks 有三种主要产品模式：按 token 计费的无服务器推理、专用 GPU 部署和预留容量，另有托管训练。2026 年 7 月的一份评测列出专用 H100 和 H200 容量为每
              GPU 小时 $7、B200 为 $10、B300 为 $12；但这些是第三方公布的费率，不是客户发票，不应外推到企业折扣或承诺支出经济性。独立指南还称，微调模型可以按基础模型 token
              价格提供服务。分销可能不止来自直销，因为一份通讯把大型云厂商描述为供应商和渠道，但指定证据没有量化渠道来源订单或合作伙伴依赖度。
            claimRefs:
              - CP005
              - CP010
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP010
              - CP014
      - number: '3.4'
        title: 护城河取决于执行，而非强锁定
        blocks:
          - type: paragraph
            body: >-
              最有力的防御性论据来自运营：模型上线快、训练和服务共用一个平台、买方所需基础设施工作更少。这不是独家资产逻辑。Fireworks
              不拥有旗舰基础模型，第三方评测因此警告，其输出质量上限取决于所托管的开放模型和外部模型。独立指引还称，供应商的速度声明必须用代表性
              prompt、上下文长度、函数调用和流式行为测试，因为生产工作负载可能偏离营销演示。这些事实构成了可信的商品化路径：兼容接口支持多云并用，模型供应商仍握有议价权；除非 Fireworks
              的可靠性、定制工作流和分销增长速度快于切换成本下降，否则更快的同业或打包式超大规模云路径都可能取代它。
            claimRefs:
              - CP006
              - CP011
              - CP012
              - CP013
              - CP015
      - number: '3.5'
        title: 展示
        blocks:
          - type: callout
            title: 可迁移性是一把双刃剑
            body: 兼容性可以缩短迁入 Fireworks 的时间，但也让供应商切换和多云并用更容易。因此，留存必须靠工作负载表现、可靠性、定制工作流和商业执行，而不能只靠 API 锁定。
            calloutType: risk
            claimRefs:
              - CP006
              - CP012
              - CP013
          - type: callout
            title: 已发布的比较不是买方专属基准
            body: 保留的独立来源提供了有用的竞争分类和定价信号，但没有在 Fireworks、Together AI、Groq、Replicate、Bedrock 和自托管方案之间提供同模型、同区域、同 prompt 的基准测试。
            calloutType: assumption
            claimRefs:
              - CP013
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与公开变现范围
        blocks:
          - type: paragraph
            body: >-
              Fireworks 对外定位是训练与推理结合的平台，而不是单一 API 端点供应商。其官方页面展示了清晰的变现阶梯：用按 token
              计费的无服务器用量支持快速原型，用按需专用部署服务高性能工作负载，用预留容量承接可预测规模，并在同一技术栈上提供付费微调或训练工作负载。这种架构意味着，收入既可以靠 token
              量增长，也可以靠客户迁移到承诺度更高的容量产品来扩大。缺失的是投资者通常用来判断质量的商业细节——已实现价格、折扣安排、合同最低额，以及自助用量和协商式企业承诺的拆分，都没有在所审阅的公开材料中披露。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI017
