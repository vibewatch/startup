  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Fireworks 的市场边界比“全部 AI”更窄，又比单一推理 API
              更宽。公司将自身描述为覆盖训练、微调和生产推理的专业智能基础设施；其文档和推理页面则展示了无服务器、专用和预留部署模式。因此，纳入的支出是生产环境中用于适配、服务和运营开放模型的技术栈支出。排除的支出同样重要：继续自托管的通用云计算、从未迁移到开放模型的闭源模型订阅，以及不需要模型运营的应用层
              SaaS 预算。实践中，现状替代方案包括闭源模型 API、自行管理的开源服务技术栈，以及把模型访问、治理和合同都纳入既有云关系的超大规模云控制平面。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM012
      - number: '2.2'
        title: 需求代理指标有力，但品类总额薄弱
        blocks:
          - type: paragraph
            body: >-
              指定资料池中最有力的公开规模证据是公司需求，而不是有边界的市场模型。Fireworks 在 2025 年 10 月表示，公司已覆盖 10,000 家企业、数十万名开发者，每日处理超过 10 trillion
              tokens，年化收入达到 $280M。随后 Microsoft 介绍该一体化技术栈每日处理超过 13 trillion tokens、每秒约 180 thousand requests；Sacra 则估计截至
              2026 年 5 月年化收入约 $800M。这些数据点说明公司已经承载大型生产工作负载，但无法证明更广泛的开放模型推理、后训练或企业 AI 运营市场中还有多少需求未被满足。结论是需求视角可信，但还不是完整的
              TAM/SAM/SOM。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM008
              - CM009
              - CM013
              - CM016
      - number: '2.3'
        title: 买方图谱与采用路径
        blocks:
          - type: paragraph
            body: >-
              采用路径从开发者开始，因为 Fireworks 被定位为兼容 OpenAI 和 Anthropic
              的即插即用服务，并提供自助式无服务器访问。但当工作负载变得持续、受治理或对延迟敏感时，预算所有者会转向高端市场。需求从快速原型转向专用容量、预留基础设施、数据驻留以及统一模型评估和部署后，企业 AI
              与平台团队就会成为买方。随着产品范围扩展，可服务市场也随之扩大：如今同一平台还覆盖多模态服务、嵌入、重排序、语音和强化微调，而不只是文本补全。支出池因此从开发者 API
              用量扩大到企业平台、合规与工作流自动化预算。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 采用驱动因素、约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              主要采用驱动因素是控制力：Microsoft 围绕成本、定制、治理和降低锁定来阐释开放模型采用，Fireworks 则用模型首日支持和便于迁移的 API
              强化这一叙事。关键约束是结构性的，而不是教育不足。超大规模云厂商可以把开放模型嵌入既有云采购和治理流程，从同一预算中夺取很大份额；Fireworks
              自身的经济模型也仍部分像基础设施业务，而非纯软件。独立评论还指出定价不透明，以及缺少长期免费层，这会阻碍业余用户或重视透明度的买方。最重要的是，指定证据仍缺少独立公开的
              TAM/SAM/SOM，因此市场规模和份额应被视为待尽调事项，而不是已解决的事实。
            claimRefs:
              - CM005
              - CM010
              - CM014
              - CM015
              - CM016
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接同业、相邻市场与现状方案
        blocks:
          - type: paragraph
            body: >-
              Fireworks 争夺的是模型开发者与应用团队之间的运营层，而不是专有前沿模型的所有权。保留的比较材料一贯把 Together AI 和 Groq 放在直接托管推理同业中：Together
              强调广泛模型访问以及训练与推理一体化，Groq 强调硬件驱动的服务速度。Replicate 是相邻的多模态市场，AWS Bedrock 是面向 AWS
              标准化买方的超大规模云控制平面替代方案，内部自建则是控制力最高的替代方案。本章只有 Fireworks
              有可用的规模证据，而且该证据是有日期的公司声明，而非当前独立测量；竞争对手的融资、收入、用量和客户数仍是缺口，而不是估算值。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
