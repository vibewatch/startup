        - Token 规模和企业采用度表明，开放模型推理确有真实的生产需求。
        - 如果 token 定价商品化，需求可以保持强劲，但经济性会恶化。
        - 按客户群披露 cohort 层面的毛利率和留存率。
      - - 产品范围
        - Fireworks 把训练、微调、路由和推理放在同一技术栈上，提升了工作流粘性。
        - 如果客户只购买服务层，集成广度未必能形成真正的切换成本。
        - 提供客户案例，证明多产品绑定以及迁移难度。
      - - 商业模式
        - 按使用量定价，让收入随客户流量和模型部署增长而增长。
        - 使用量收入会随模型路由选择和基准驱动的重新定价而波动。
        - 披露实际价格实现、贡献毛利和净留存趋势。
      - - 渠道杠杆
        - Microsoft Foundry 延伸了企业分销，也增强了治理可信度。
        - 平台伙伴也可能掌握计费、开发者入口和路线图话语权。
        - 证明在伙伴渠道之外，直接获客需求和续约能力仍然强。
      - - 估值基准
        - 收入规模快速增长，相比尚未产生收入的 AI 融资，更能支撑高估值倍数。
        - Fireworks 已处于同业推理估值的高端，执行稍有失误，留给估值的缓冲就更少。
        - 要么降低入场倍数，要么提供新证据，证明其可持续经济性超过同业。
      - - 资本结构
        - Forge 显示，最新一轮融资显然没有包含惩罚性参与式优先权。
        - 公开来源仍未展示完整的清算分配顺序、稀释结构或投资者权利包。
        - 审阅 Series D 章程、股权结构表和附函摘要。
    notes: 正反论点是基于引用证据面向读者的综合判断；最后一列列出会改变确信度的具体尽调事项。
