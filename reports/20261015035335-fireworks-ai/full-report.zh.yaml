      - number: '1.2'
        title: 创始人、领导层覆盖与治理可见度
        blocks:
          - type: paragraph
            body: >-
              保留资料中最可靠、可复用的事实是领导层履历：多家独立来源和公司关联来源都把 Fireworks 与曾参与 PyTorch 及相关机器学习基础设施建设的 Meta
              前工程师联系起来，这显著增强了其在推理工具领域的创始人与市场匹配度。目前公开点名的经营层主要集中在联合创始人兼 CEO Lin Qiao、联合创始人兼 CTO Dmytro Dzhulgakov 和总裁
              George
              Hu。该信息足以支撑后续章节判断谁公开负责产品、技术和市场执行，但不足以单凭公开证据核实当前董事会构成、财务领导层深度或正式治理检查。因此，本章把领导层质量视为相对优势，把治理透明度视为待尽调事项，而不是既定事实。
            claimRefs:
              - CO002
              - CO006
              - CO007
              - CO008
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
      - number: '1.3'
        title: 融资历史、关键利益相关方与本轮更新的变化
        blocks:
          - type: paragraph
            body: >-
              本轮更新最大的变化在于财务和战略规模。Fireworks 自己在 2026 年 7 月的公告将公司从此前的 C 轮阶段推向更晚期定位：D 轮融资 $1.505 billion、估值 $17.5
              billion，同时声称年化收入运行率达到 $1 billion、日处理 token 达到 40 trillion。保留的第三方来源大体呼应这一跃升，并把融资时间线向前延伸至 A、B、C 轮；Microsoft
              推出
              Foundry，也让超大规模云关系从愿景变成了具体合作。即便如此，利益相关方图谱仍不完整：重复投资者和战略生态名称清晰可见，但公开来源没有披露所有权集中度、董事会权利、优先股堆叠或经核对的股权结构表。独立评论还持续质疑利润率的持久性和护城河强度；解读这次高溢价估值跃升时，这一点很关键。
