        blocks:
          - type: paragraph
            body: >-
              公开证据显示有两类重叠客户。第一类是 AI 原生软件团队和开发者主导的产品团队，需要快速开放模型推理、更低延迟，以及从 OpenAI 风格 API
              轻松迁移的路径。第二类是更大型的企业或受监管买方，关注数据主权、合规态势，以及无需重建技术栈就能从试验转向专用或预留容量的能力。Fireworks 自有材料点名
              Samsung、Uber、DoorDash、Notion、Shopify 和 Upwork 等客户；当前客户证言则明显偏向 Cursor、Sourcegraph、Vercel、Gumloop、Quora 和
