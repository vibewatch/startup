evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leadership-governance
    missingEvidence: Current board composition, committee structure, executive roster completeness, and formal CFO/finance authority.
    whyItMatters: Governance quality and depth matter more after a step-change financing round and valuation reset.
    diligencePath: Request the latest board deck, org chart, and financing-governance summary from management.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Full cap table, ownership concentration, preference stack, board rights, observer rights, and any secondary
      component of recent financings.
    whyItMatters: Control rights and liquidation structure can materially change effective valuation and decision power.
    diligencePath: Review financing documents, cap-table software export, and lead-investor side letters.
    relatedQuestionRefs:
      - QO006
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: tam-sizing
    missingEvidence: >-
      An independent category study or public-company disclosure that isolates open-model inference, post-training, and
      governed deployment budgets.
    whyItMatters: >-
      Without a bounded market denominator, valuation and share arguments rely on company operating proxies rather than
      category totals.
    diligencePath: >-
      Obtain current analyst research or public-company segment data that separates open-model operations spend from
      broader AI software budgets.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: segment-mix
    missingEvidence: Revenue or usage mix by developer self-serve, enterprise platform, and regulated-workload cohorts.
    whyItMatters: >-
      Segment mix determines how much of current demand is durable enterprise budget versus transient experimentation
      volume.
    diligencePath: Request cohort-level customer, reserved-capacity, or revenue mix from management or investor materials.
  - type: missing-source
    severity: material
    topic: comparable-benchmark
    missingEvidence: >-
      A current independent benchmark using the same model, region, prompt distribution, context length, concurrency,
      output length, and reliability definition across each retained alternative.
    whyItMatters: >-
      Without a common workload and denominator, vendor and review speed statements cannot support a measured
      competitive ranking.
    diligencePath: >-
      Commission a blinded load test using the buyer's production traces and publish latency percentiles, throughput,
      error rate, and total cost for every route.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Customer invoices or contracts showing realized token rates, GPU commitments, volume discounts, minimums, credits,
      and egress charges for Fireworks and matched alternatives.
    whyItMatters: >-
      Public list prices do not establish the buyer's total cost, Fireworks's pricing power, or the durability of
      fine-tuned-model economics.
    diligencePath: >-
      Request anonymized order forms for three usage bands and reprice the same production workload across all
      shortlisted providers and internal build.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: material
    topic: competitor-scale
    missingEvidence: >-
      Dated and comparable funding, revenue, customer, token-volume, headcount, and capacity figures for Together AI,
      Groq, Replicate, and AWS Bedrock.
    whyItMatters: >-
      The available pool cannot determine whether Fireworks's operating scale is larger, smaller, or more
      capital-efficient than its alternatives.
    diligencePath: >-
      Collect each competitor's latest financing announcement, audited filing where available, customer disclosures, and
      capacity statements using consistent dates and units.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: switching-and-distribution
    missingEvidence: >-
      Customer-level churn, multi-homing, migration time, cloud-channel bookings, GPU supply commitments, and partner
      concentration.
    whyItMatters: >-
      API compatibility indicates technical portability but does not quantify commercial lock-in, retention, channel
      power, or supply risk.
    diligencePath: >-
      Review cohort retention and provider-routing telemetry, interview recent wins and losses, and inspect cloud and
      GPU partner agreements.
    relatedQuestionRefs:
      - QP005
      - QP006
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-burn
    missingEvidence: Current gross margin, monthly burn, unrestricted cash balance, and runway sensitivity by utilization case.
    whyItMatters: >-
      These numbers determine whether rapid topline growth is creating durable cash generation or simply financing
      larger compute commitments.
    diligencePath: >-
      Request the latest board pack or lender package with gross margin by product, monthly burn bridge, cash balance,
      and runway cases.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Realized price per token, discount ladder, contract minima, and gross margin by serverless, on-demand, and
      reserved products.
    whyItMatters: >-
      List mechanisms do not show whether enterprise growth is coming from profitable pricing or discounted committed
      capacity.
    diligencePath: Request cohort pricing waterfalls, standard MSA or order-form terms, and realized revenue by deployment mode.
    relatedQuestionRefs:
      - QI002
      - QI004
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, sales cycle, and revenue concentration by top customers or channel.
    whyItMatters: >-
      Public workload and customer counts do not show whether growth is repeatable, concentrated, or expensive to
      acquire.
    diligencePath: >-
      Request funnel conversion, payback by segment, top-customer concentration, and renewal or expansion rates by
      deployment mode.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: compute-obligations
    missingEvidence: >-
      Debt facilities, cloud minimum commitments, GPU reservation liabilities, and any project-finance-like obligations
      tied to compute expansion.
    whyItMatters: >-
      Inference infrastructure businesses can look asset-light in revenue terms while carrying meaningful
      off-balance-sheet or contracted capacity obligations.
    diligencePath: >-
      Review cloud and hardware commitments, any debt or credit agreements, and management's downside plan for
      underutilized reserved capacity.
    relatedQuestionRefs:
      - QI006
      - QI008
  - type: missing-source
    severity: material
    topic: reliability-evidence
    missingEvidence: Public SLA terms, uptime history, and incident disclosures for Fireworks-managed production service.
    whyItMatters: >-
      Buyers cannot underwrite reliability commitments from curated product pages alone when the platform is selling
      mission-critical inference.
    diligencePath: Request the status-page history, SLA language, and enterprise support commitments during diligence.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: deployment-benchmarks
    missingEvidence: >-
      Comparable workload-level latency, throughput, and cost benchmarks across serverless, dedicated, and reserved
      deployment modes.
    whyItMatters: >-
      Product positioning is strongest on speed and efficiency, but the public pack does not quantify which deployment
      mode is best for a buyer's traffic profile.
    diligencePath: Ask for customer-specific benchmark data and model-by-model operating envelopes under production load.
    relatedQuestionRefs:
      - QE007
      - QE008
  - type: missing-source
    severity: minor
    topic: compliance-scope
    missingEvidence: Audit-report scope, data-residency options, and boundary detail behind the public compliance claims.
    whyItMatters: >-
      Compliance badges are useful signals, but enterprise procurement will care about scope boundaries and operational
      responsibility splits.
    diligencePath: Review the trust-center materials and contract schedules that define control scope and regional commitments.
    relatedQuestionRefs:
      - QE006
      - QE008
  - type: missing-source
    severity: material
    topic: durability-gap
    missingEvidence: Public NRR, GRR, churn, renewal-rate, and contract-length disclosure by cohort or customer segment
    whyItMatters: >-
      The chapter can show adoption and point-in-time traction, but without durability data it cannot distinguish sticky
      enterprise revenue from bursty or experimental usage.
    diligencePath: >-
      Request board materials or data-room cohort analyses showing gross retention, net retention, logo churn, contract
      terms, and renewal behavior for the last four quarters.
    relatedQuestionRefs:
      - QU005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, cloud-credit dependence, and partner-sourced pipeline concentration
    whyItMatters: >-
      A small number of large AI-native accounts or channel partners could drive outsized revenue, materially changing
      the risk profile versus the headline customer count.
    diligencePath: >-
      Obtain customer concentration schedules, top-20 account ARR, and pipeline attribution by direct sales versus
      partner channel from management.
    relatedQuestionRefs:
      - QU006
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: A fuller named customer list with deployment status, go-live dates, and measurable outcomes
    whyItMatters: >-
      Public proof is sufficient to show real usage, but not to estimate how representative the visible wins are across
      geographies, industries, or account sizes.
    diligencePath: >-
      Ask management for a referenceable customer list segmented by industry, region, contract tier, and production
      status, then reconcile it to the public testimonial set.
    relatedQuestionRefs:
      - QU002
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: legal-regulatory-visibility
    missingEvidence: Primary audit, DPA, court, regulator, sanctions, export-control, privacy, and model-license indemnity records.
    whyItMatters: >-
      Company compliance claims do not establish litigation cleanliness, regulator posture, license provenance, or
      contractual loss allocation.
    diligencePath: >-
      Request audit and contract packages, then run docket, regulator, sanctions, export-control, and IP searches before
      investment committee.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-capital
    missingEvidence: >-
      Gross margin, burn, runway, committed GPU capacity, enterprise discount schedules, hard spend controls, and cash
      availability.
    whyItMatters: >-
      Annualized revenue run rate and funding raised cannot establish margin durability, liquidity, or downside
      resilience at the reported valuation.
    diligencePath: >-
      Obtain audited or board-level financials, capacity contracts, pricing waterfalls, cash balances, and
      workload-level contribution margins.
    relatedQuestionRefs:
      - QR005
      - QR008
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: reliability-and-concentration
    missingEvidence: >-
      Incident history, penalty-backed SLAs, deprecation notices, recovery metrics, support response distributions, and
      customer or supplier concentration.
    whyItMatters: >-
      Limited complaints identify plausible failure modes but do not quantify their frequency, while missing
      concentration denominators obscure shock exposure.
    diligencePath: >-
      Review status history, incident postmortems, support cohorts, top-customer revenue, GPU supplier mix, and
      model-provider dependencies.
    relatedQuestionRefs:
      - QR003
      - QR004
      - QR006
      - QR008
    relatedTableRefs:
      - TR002
      - TR003
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: >-
      A current gross-margin bridge, contribution-margin trend, net retention, churn, and monthly burn/runway for the
      post-Series-D business.
    whyItMatters: >-
      The public case supports revenue scale but not whether that scale earns durable economics at a 17.5x-type revenue
      multiple.
    diligencePath: >-
      Request the last 12 months of board or lender reporting with gross margin, contribution margin, NRR, logo churn,
      and burn by month.
    relatedQuestionRefs:
      - QV008
  - type: missing-source
    severity: material
    topic: cap-table
    missingEvidence: >-
      A full cap table, option pool, liquidation waterfall, investor-rights summary, and any side letters attached to
      the Series D.
    whyItMatters: >-
      Forge gives only a partial view into latest-round preferences, which is not enough to underwrite dilution and
      downside recovery.
    diligencePath: >-
      Review the Series D charter, capitalization table, pro forma ownership model, and counsel summary of preference
      terms.
    relatedQuestionRefs:
      - QV007
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: >-
      Top-customer revenue concentration, GPU-supply commitments, cloud-partner dependence, and direct versus
      partner-sourced bookings.
    whyItMatters: >-
      Distribution and infrastructure concentration can turn a strong operating story into faster margin compression
      than the current price implies.
    diligencePath: >-
      Request customer-concentration schedules, cloud/GPU commitment summaries, and channel-attribution data for the
      most recent two quarters.
    relatedQuestionRefs:
      - QV005
      - QV006
