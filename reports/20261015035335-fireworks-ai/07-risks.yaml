      - Jurisdiction / scope
      - Public status
      - Likelihood
      - Severity
      - Visible mitigation
      - Residual exposure
      - Diligence path
    rows:
      - ["Privacy and security obligations", "US and EU enterprise workloads", "Official materials claim SOC 2 Type II, HIPAA readiness, GDPR compliance, and non-use of inference inputs or outputs.", "Medium", "High", "Multi-region service and stated compliance controls.", "Medium-High", "Review audit reports, DPA, subprocessors, retention settings, breach history, and incident-response obligations."]
      - ["Open-model licensing, provenance, and indemnity", "Models and custom weights deployed through the platform", "The public catalog covers more than 100 models and customer-trained versions, but assigned evidence contains no model-by-model license review or indemnity terms.", "Medium", "High", "Managed training and deployment create a centralized control point.", "High", "Sample model intake controls, license lineage, takedown process, export screening, and customer-contract indemnities."]
      - ["Litigation and regulatory enforcement visibility", "Company-level legal posture", "No court, regulator, sanctions, or enforcement record is present in the assigned pool; this is an evidence gap, not proof of absence.", "Unknown", "High", "Official compliance posture may reduce exposure but does not establish legal cleanliness.", "High", "Run primary docket, privacy-regulator, sanctions, export-control, and IP-dispute searches before investment committee."]
    notes: >-
      Partial register based only on the assigned prefetched sources; likelihood is qualitative and no row asserts
      the absence of litigation, enforcement, or security incidents.
    enumerationScope:
      coverage: partial
      basis: Public compliance, product, review, and analyst evidence in the assigned source pool as of 2026-10-15.
    claimRefs: [CR002, CR004, CR008, CR011, CR012, CR013]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - ["Serverless outage or abrupt model removal", "Medium", "High", "Medium", "High", "Review aggregation identifies this failure mode, but incident frequency, duration, notice periods, and affected workloads are not disclosed."]
      - ["Support degradation outside enterprise tiers", "Medium", "Medium", "Low-Medium", "Medium", "Public complaints are low-volume; support SLAs, response-time distributions, and escalation outcomes are unavailable."]
      - ["Multi-turn training or agent failure from unstable tools and rewards", "Medium", "High", "Medium", "Medium-High", "Fireworks describes environment drift, API failure, sparse rewards, and reward hacking; production benchmark and recovery-rate evidence is not public."]
      - ["Capacity or autoscaling shortfall on dedicated workloads", "Medium", "High", "Medium", "Medium-High", "Dedicated and reserved modes are offered, but capacity reservation terms, regional failover evidence, and penalty-backed SLAs are not in the pool."]
    notes: >-
      Risk levels combine company-described architecture with limited independent buyer feedback; they are
      qualitative judgments, not measured incident probabilities.
    claimRefs: [CR002, CR003, CR004, CR009, CR010]
  - id: TR003
    title: Partner / dependency and financial-model risk register
    columns:
      - Dependency / risk
      - Counterparty or driver
      - Failure scenario
      - Likelihood
      - Severity
      - Visible mitigation
      - Residual exposure
      - Kill criterion or diligence ask
    rows:
      - ["GPU capacity and economics", "GPU suppliers and capacity providers", "Scarcity or higher unit costs impair latency, availability, or gross margin.", "Medium", "High", "Serverless, dedicated, multi-region, and reserved deployment modes.", "High", "Obtain capacity commitments, utilization, gross margin by deployment type, and supplier concentration."]
      - ["Model ecosystem churn", "Open-weight model providers and licenses", "A model removal, license change, or quality regression breaks a production dependency.", "Medium", "High", "Broad catalog and compatible APIs can support migration.", "Medium-High", "Require model-change notice, deprecation policy, license review, and tested fallback coverage."]
      - ["Usage-based cost volatility", "Token volume, tier choice, and dedicated GPU hours", "Customer bills or Fireworks' costs rise faster than workload value.", "Medium", "High", "Published usage modes and batch or capacity choices offer optimization levers.", "Medium-High", "Model workload-level unit economics, hard spend controls, discount schedules, and renewal behavior."]
      - ["Valuation and margin compression", "Competition, hyperscalers, and custom silicon", "Price-performance convergence reduces margins before growth supports the reported valuation.", "High", "High", "Training-plus-inference integration and performance optimization may preserve differentiation.", "High", "Treat loss of performance leadership, repeated price cuts without margin proof, or weaker growth quality as thesis breaks."]
    notes: >-
      Concentration percentages, contractual minimums, gross margin, burn, runway, and customer retention are not
      public in the assigned pool and are intentionally recorded as diligence gaps rather than estimated.
    claimRefs: [CR005, CR006, CR007, CR008, CR009, CR010, CR011, CR014]
figures:
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: Valuation compression, service continuity, and capacity economics remain the highest residual risks.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Valuation and margin compression
          note: Reported valuation is high while audited margin, burn, and capacity commitments remain unavailable.
          values: [High, High, Low, High]
        - label: Service continuity and model removal
          note: Official reliability claims coexist with limited public complaints about availability and removals.
          values: [Medium, High, Medium, High]
        - label: GPU capacity and cost dependence
          note: Dedicated and reserved products mitigate access risk but do not disclose supplier concentration.
          values: [Medium, High, Medium, High]
        - label: Privacy, licensing, and regulatory diligence
          note: Compliance claims are visible, while primary legal and contract evidence is absent from this pool.
          values: [Medium, High, Low, High]
        - label: Multi-turn RL execution quality
          note: Fireworks itself describes unstable tools, sparse rewards, and reward-hacking failure modes.
          values: [Medium, High, Medium, Medium-High]
        - label: Support and buyer cost friction
          note: Review aggregation identifies support variability and usage-cost forecasting uncertainty.
          values: [Medium, Medium, Low-Medium, Medium]
    approximationNotes: >-
      Matrix values are qualitative analyst judgments tied to cited evidence and gaps; they are not measured
      probabilities, third-party scores, or actuarial estimates.
    claimRefs: [CR003, CR004, CR005, CR006, CR008, CR010, CR013, CR014]
callouts:
  - calloutType: risk
    title: Public scale does not resolve downside economics
    body: >-
      Annualized revenue run rate and funding are not ARR, margin, cash availability, or runway; gross margin,
      burn, committed capacity, and concentration remain material diligence gaps.
    claimRefs: [CR006, CR007, CR014]
  - calloutType: recommendation
    title: Gate underwriting on primary legal and operating evidence
    body: >-
      Require audit artifacts, incident and deprecation history, contract protections, concentration data, and
      workload-level unit economics before treating the current risk stack as mitigated.
    claimRefs: [CR002, CR004, CR005, CR013, CR014]
