schemaVersion: report-v2
artifact: company-overview
slug: fireworks-ai
runDate: 2026-10-15
company:
  name: Fireworks AI
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Fireworks AI entered a new phase in July 2026 with a self-reported $1.505
    billion Series D at a $17.5 billion valuation and more than $1 billion in
    annualized revenue run rate. The retained refresh evidence also reinforces
    unusually strong founder-market fit around ex-Meta PyTorch leaders, but it
    still leaves governance detail, audited financial quality, and investor
    control terms under-documented.
sections:
  - id: identity-and-scale
    title: Identity, product surface, and current scale
    body: >-
      Fireworks AI describes itself less as a generic model host and more as an
      infrastructure layer for "specialized intelligence" that combines
      training, fine-tuning, and production inference on one serving stack.
      Across the retained official and third-party refresh sources, the product
      surface consistently includes serverless inference, dedicated/on-demand
      deployments, reserved capacity, model customization, and OpenAI-compatible
      interfaces. That identity matters because later diligence should treat the
      company as an AI infrastructure platform with both developer and
      enterprise sales motions, not as a pure application vendor. The same
      sources also show meaningful adoption breadth through named customers and
      partners, but customer-count and revenue-quality disclosures remain far
      thinner than the headline growth claims.
    claimRefs:
      - CO001
      - CO003
      - CO004
      - CO005
      - CO013
    tableRefs:
      - TO001
  - id: leadership-and-governance
    title: Founders, leadership coverage, and governance visibility
    body: >-
      The strongest reusable ground truth in the retained pool is the
      leadership pedigree: multiple independent and company-adjacent sources tie
      Fireworks to former Meta engineers who built PyTorch and related ML
      infrastructure, which materially increases founder-market fit for
      inference tooling. Publicly named operating leadership in this pool is
      still concentrated around co-founder/CEO Lin Qiao, co-founder/CTO Dmytro
      Dzhulgakov, and President George Hu. That is enough to anchor later
      chapters on who visibly owns product, technical, and go-to-market
      execution, but not enough to verify current board composition, finance
      leadership depth, or formal governance checks from public evidence alone.
      The chapter therefore treats leadership quality as a relative strength and
      governance transparency as an open diligence item rather than an
      established fact.
    claimRefs:
      - CO002
      - CO006
      - CO007
      - CO008
      - CO014
    tableRefs:
      - TO002
  - id: financing-stakeholders-and-refresh-deltas
    title: Funding history, key stakeholders, and what changed in the refresh
    body: >-
      The biggest refresh delta is financial and strategic scale. Fireworks'
      own July 2026 announcement moved the company from the prior Series C
      framing into a much later-stage posture, pairing a $1.505 billion Series
      D and $17.5 billion valuation with new claims around $1 billion annualized
      revenue run rate and 40 trillion daily tokens. Third-party retained
      sources broadly echo that jump and help extend the funding chronology back
      through Series A, B, and C, while Microsoft's Foundry launch makes the
      hyperscaler relationship concrete rather than aspirational. Even so, the
      stakeholder picture is still incomplete: repeat investors and strategic
      ecosystem names are visible, but public sources do not disclose ownership
      concentration, board rights, preference stack, or a reconciled cap table.
      Independent commentary also keeps margin durability and moat strength in
      question, which is important context when interpreting the premium
      valuation step-up.
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO012
      - CO015
    tableRefs:
      - TO003
    figureRefs:
      - FO001
