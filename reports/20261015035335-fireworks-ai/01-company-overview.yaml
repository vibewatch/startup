      - [Dmytro Dzhulgakov, "Co-founder & CTO", "Former Meta PyTorch/Caffe2 engineer and named co-founder in retained sources", "Anchors inference-stack and training-architecture credibility", "High: technical roadmap concentration remains visible in public evidence."]
      - [George Hu, President, "Publicly described in retained third-party funding profile as go-to-market leader with Salesforce/Twilio scaling background", "Adds enterprise GTM coverage beyond founder bench", "Medium: useful operating depth, but still within a small named leadership set."]
      - [Steven Wu, "SVP of Finance and Business Operations", "Named only in retained third-party profile as finance/billing contact point", "Suggests finance function exists below a publicly visible CFO", "Medium-high: public finance ownership remains thinner than expected for current scale."]
    notes: >-
      Partial public roster only; retained sources do not verify the full executive bench, board
      composition, or committee structure.
    enumerationScope:
      coverage: partial
      basis: >-
        Built from the retained 2026 public leadership references in AI Engineer, Toflow,
