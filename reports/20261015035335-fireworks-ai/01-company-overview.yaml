      - [Customer count, "No reconciled current public count; 10K+ appears in independent summaries", "2026 refresh pool", low, "Request dated active-customer, enterprise-account, and NRR definitions."]
      - [Headcount, "201-500 employees listed by Toflow; plan toward 600 by end-2026 is secondary", "2026-07-17", low, "Confirm fully loaded headcount, hiring pace, and location mix from HR/finance data."]
      - [Locations / office footprint, "Not enumerated in retained public evidence", "2026 refresh pool", low, "Ask management for office list, GPU-region footprint, and entity map."]
    notes: >-
      Mixes official company claims with retained third-party summaries; low-confidence rows mark
      unsupported or non-reconciled public metrics rather than verified KPIs.
    claimRefs:
      - CO002
      - CO006
      - CO009
      - CO010
      - CO011
      - CO012
