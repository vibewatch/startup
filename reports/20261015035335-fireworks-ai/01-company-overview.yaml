      - [Latest valuation, "$17.5B post-money announced with Series D", "2026-07-15", high, "Obtain board/investor documents to confirm final close terms and any structure."]
      - [Total raised, "$1.83B reported by retained third-party funding tracker", "2026-07-17", medium, "Reconcile cumulative raise against signed financing history and secondaries."]
      - [Annualized revenue run rate, ">$1B company claim", "2026-07-15", high, "Request audited revenue, ARR bridge, and concentration detail."]
