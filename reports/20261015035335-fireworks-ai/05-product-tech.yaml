  evidenceGaps:
    - type: missing-source
      severity: material
      topic: reliability-evidence
      missingEvidence: Public SLA terms, uptime history, and incident disclosures for Fireworks-managed production service.
      whyItMatters: Buyers cannot underwrite reliability commitments from curated product pages alone when the platform is selling mission-critical inference.
      diligencePath: Request the status-page history, SLA language, and enterprise support commitments during diligence.
      relatedQuestionRefs: [QE008]
    - type: private-evidence-only
      severity: material
      topic: deployment-benchmarks
      missingEvidence: Comparable workload-level latency, throughput, and cost benchmarks across serverless, dedicated, and reserved deployment modes.
      whyItMatters: Product positioning is strongest on speed and efficiency, but the public pack does not quantify which deployment mode is best for a buyer's traffic profile.
      diligencePath: Ask for customer-specific benchmark data and model-by-model operating envelopes under production load.
      relatedQuestionRefs: [QE007, QE008]
    - type: missing-source
      severity: minor
      topic: compliance-scope
      missingEvidence: Audit-report scope, data-residency options, and boundary detail behind the public compliance claims.
      whyItMatters: Compliance badges are useful signals, but enterprise procurement will care about scope boundaries and operational responsibility splits.
      diligencePath: Review the trust-center materials and contract schedules that define control scope and regional commitments.
      relatedQuestionRefs: [QE006, QE008]
