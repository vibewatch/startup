      - Current workflow
      - Fireworks solution
      - Measurable benefit
      - Limitation
    rows:
      - [Prototype with open models, Stand up a compatible endpoint and test quality quickly, Serverless inference, Pay-per-token access and API compatibility lower migration friction, Assigned evidence does not provide comparable per-model cost curves]
      - [Move a hot workload into production, Reserve predictable capacity and isolate traffic, On-Demand or Reserved deployments, Dedicated capacity plus same-stack serving avoid a second runtime migration, Public SLA and residency specifics remain undisclosed]
      - [Adapt a base model to proprietary data, Prepare a supervised or preference dataset and launch training, Managed training or lower-level Training API, OpenAI-compatible training format and immediate serving handoff compress iteration, Managed path is LoRA-only and deeper telemetry is limited]
      - [Route coding or mixed-model workflows, "Choose models by task, traffic profile, or user surface", FireRouter / FireConnect / Nexus, Routing expands the platform from serving into workflow orchestration, Independent evidence of breadth of developer adoption is thin in this pack]
    notes: >-
      Benefits are sourced from official product descriptions and independent
      research summaries; limitations mark where public diligence still needs
      customer-reference or contract review.
    claimRefs: [CE002, CE003, CE004, CE005, CE010, CE011, CE012, CE013]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - [Client compatibility layer, Lets existing applications call models through familiar interfaces, OpenAI and Anthropic compatibility plus coding-tool connectors, Compatibility is official positioning rather than independent benchmark evidence]
      - [Serving runtime, "Executes inference with batching, caching, speculative decoding, and kernel optimization", GPU availability and Fireworks engine implementation, External validation is qualitative rather than audited]
      - [Capacity and control plane, "Provides autoscaling, multi-region routing, and deployment choices", Scheduler quality plus cloud and GPU footprint, Region granularity and uptime commitments are not public]
      - [Training plane, Schedules managed jobs and passes outputs back into serving, Supported training shapes and optional external observability, Managed mode is LoRA-only and full-parameter work requires Training API]
      - [Lifecycle and routing, "Supports model upload, versioning, canarying, and workload-aware routing", Nexus and internal model-management surfaces, Customer-specific policy logic remains opaque from public materials]
    notes: >-
      Architecture combines official product surfaces with independent operating
      descriptions; nulls are avoided by stating the visible dependency or risk
      instead of inferring unseen internals.
    claimRefs: [CE002, CE005, CE007, CE008, CE009, CE010, CE013]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Publicly described layers show Fireworks as one surface spanning
      developer entry points, inference runtime, lifecycle controls, training,
      and trust controls.
    data:
      layers:
        - label: Customer entry points
          detail: Teams can start self-serve and graduate into higher-control deployments.
          modules:
            - label: Serverless API
              detail: Pay-per-token entry path for prototyping and bursty workloads
            - label: Dedicated deployments
              detail: On-Demand capacity for production isolation and post-trained models
            - label: Reserved capacity
              detail: Guaranteed capacity for steadier high-volume usage
        - label: Developer interfaces
          detail: Multiple launch and operating surfaces wrap the same underlying jobs.
          modules:
            - label: UI
              detail: Guided configuration and visual monitoring
            - label: CLI / API
              detail: Scripted job creation and deployment management
            - label: Agent surfaces
              detail: Agent-assisted training configuration and troubleshooting
        - label: Serving runtime
          detail: Inference is positioned as the common runtime for both foundation and adapted models.
          modules:
            - label: Compatibility layer
              detail: OpenAI and Anthropic compatible APIs
            - label: Performance engine
              detail: Batching, caching, speculative decoding, and kernel optimization
            - label: Scaling layer
              detail: Autoscaling across regions with traffic management
        - label: Lifecycle controls
          detail: Model promotion and routing are part of the product story, not a separate stack.
          modules:
            - label: Upload / optimize / deploy
              detail: Consistent path from model asset to live endpoint
            - label: Version and canary
              detail: Test new models or configs before broad rollout
            - label: Nexus / routing
              detail: Route workloads across open and closed model options
        - label: Training plane
          detail: Managed and lower-level paths sit next to inference rather than behind a separate vendor boundary.
          modules:
            - label: Managed training
              detail: OpenAI-format data with Fireworks-run scheduling, checkpointing, and output
            - label: Supported families
              detail: DeepSeek, Qwen, Kimi, Gemma, GLM, and Llama families
            - label: Training API fallback
              detail: Full-parameter tuning and custom logic live outside the managed LoRA path
        - label: Trust and operations
          detail: Public trust signals are visible, but deep operating proof remains a diligence task.
          modules:
            - label: Security posture
              detail: SOC 2 Type II, HIPAA-ready, and GDPR-compliant positioning
            - label: Data handling promise
              detail: Fireworks says inference inputs and outputs are not used for other purposes
            - label: Open diligence items
              detail: No public SLA, incident-history, or audit-scope detail in the assigned pack
    approximationNotes: >-
      This is a source-backed operating map rather than a code-level system
      diagram; it preserves only the layers explicitly described in the
      assigned evidence.
    claimRefs: [CE003, CE004, CE007, CE009, CE010, CE011, CE013]
