              - CM013
              - CM016
      - number: '2.3'
        title: Buyer map and adoption path
        blocks:
          - type: paragraph
            body: >
              The adoption path starts with developers because Fireworks is positioned as an OpenAI- and
              Anthropic-compatible drop-in with self-serve serverless access. But the budget owner moves upmarket as
              workloads become persistent, governed, or latency-sensitive. Enterprise AI and platform teams become the
              buyer when the need shifts from quick prototyping to dedicated capacity, reserved infrastructure, data
              residency, and unified model evaluation and deployment. The serviceable market also broadens with the
              product surface itself: the same platform now reaches multimodal serving, embeddings, reranking, voice,
              and reinforcement fine-tuning rather than only text completion. That widens the spend pool from developer
              API usage into enterprise platform, compliance, and workflow-automation budgets.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Adoption drivers, constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >
              The main adoption driver is control: Microsoft frames open-model adoption around cost, customization,
              governance, and reduced lock-in, and Fireworks reinforces that story with day-zero model support and
              migration-friendly APIs. The key constraints are structural rather than educational. Hyperscalers can
              capture a large share of the same budget by embedding open models into existing cloud procurement and
              governance flows, while Fireworks' own economics still look partly infrastructure-like rather than pure
              software. Independent commentary also points to pricing opacity and the lack of an enduring free tier as
              friction for hobbyist or transparency-sensitive buyers. Most importantly, the assigned evidence still
              lacks an independent public TAM/SAM/SOM, so market size and share must be treated as an open diligence
              item rather than a solved fact.
            claimRefs:
              - CM005
              - CM010
              - CM014
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct peers, adjacencies, and the status quo
        blocks:
          - type: paragraph
            body: >-
              Fireworks competes for the operating layer between model developers and application teams, not for
              ownership of a proprietary frontier model. The retained comparisons consistently place Together AI and
              Groq in the direct managed-inference peer set: Together emphasizes broad model access and combined
              training plus inference, while Groq emphasizes hardware-led serving speed. Replicate is an adjacent
              multimodal marketplace, AWS Bedrock is a hyperscaler control-plane alternative for AWS-standardized
              buyers, and internal build remains the highest-control substitute. Only Fireworks has usable scale
              evidence in this chapter, and that evidence is a dated company statement rather than a current independent
              measurement; competitor funding, revenue, usage, and customer counts remain gaps rather than estimated
              values.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP016
