              - CI008
              - CI012
              - CI016
      - number: '4.3'
        title: Capital adequacy still depends on external financing and compute discipline
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a business that is scaling into large capital needs rather than outgrowing them.
              Fireworks said its Series C capital would fund research, broader lifecycle tooling, and a 3–4x expansion
              in compute footprint while minimizing cost per token and maximizing utilization; July 2026 profiles then
              reported a much larger Series D. That pattern is consistent with an inference infrastructure company whose
              topline can scale quickly but whose cash requirements remain tightly coupled to GPU access, utilization,
              and cloud economics. The available public record therefore supports a view of strong financing access, but
              not a view of self-funding durability.
            claimRefs:
              - CI005
              - CI009
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: 'Financial verdict: credible growth, but underwriting blockers remain material'
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is directionally positive on demand and less comfortable on quality of revenue.
              Fireworks appears to have a real commercial engine built around production inference, training, and
              capacity commitments, and the latest third-party financing profiles imply investors are underwriting very
              large scale. The problem is that margin path, capital efficiency, and concentration are still opaque.
              Independent commentary flags pricing opacity and the risk that hyperscalers or custom-silicon rivals
              compress inference margins, while the reviewed public materials do not disclose gross margin, burn,
              runway, NRR, churn, top-customer concentration, or debt and project-finance obligations. Until diligence
              closes those gaps, the business is easier to believe as a fast grower than as a fully underwritten
              compounding cash generator.
            claimRefs:
              - CI015
              - CI016
              - CI017
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Revenue likely expands by workload depth, not seat count
            body: >-
              The disclosed monetization ladder suggests Fireworks grows revenue by pushing the same customer from
              experimentation into higher-throughput deployments, reserved capacity, and adjacent training spend.
            calloutType: insight
            claimRefs:
              - CI002
              - CI003
              - CI004
          - type: callout
            title: Growth metrics are public; margin metrics are not
            body: >-
              Reported revenue scale and financing access are strong, but public materials still do not show gross
              margin, burn, runway, or customer concentration, which leaves the margin path and financing dependency
              underdetermined.
            calloutType: risk
            claimRefs:
              - CI012
              - CI016
          - type: callout
            title: Diligence should focus on revenue quality and capacity economics
            body: >-
              Before underwriting valuation, request cohort gross margin, GPU or cloud minimum commitments, realized
              price by deployment mode, top-customer concentration, and cash runway under multiple utilization
              assumptions.
            calloutType: recommendation
            claimRefs:
              - CI009
              - CI015
              - CI016
              - CI017
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope in customer workflow terms
        blocks:
          - type: paragraph
            body: >-
              Fireworks is presenting itself as a full model-lifecycle platform rather than a point inference API. The
              verified public surface starts with pay-per-token serverless access for prototyping, expands into
              dedicated and reserved-style production capacity, and then extends into managed training plus
              coding-workflow routing tools. That breadth matters because it lets a team keep the same vendor surface
              while moving from an experimental open-model workload into a higher-control production environment, but
              the strongest evidence here is still official documentation rather than independently audited product
              teardown. The product structure therefore shifts diligence from confirming that an endpoint exists to
              testing whether capacity, tuning eligibility, and routing controls remain consistent as traffic and model
              requirements change. The sources establish the available surfaces, but not adoption or usage by product
              cohort.
