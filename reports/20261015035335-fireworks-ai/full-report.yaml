      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The architecture story is internally coherent across the official and independent sources. Fireworks says
              trained checkpoints serve on the same stack with no migration handoff, while external research attributes
              the performance claims to batching, prompt caching, speculative decoding, TensorRT-LLM, and custom CUDA
              kernel work. The caveat is that the managed path is narrower than the broad marketing message suggests:
              managed training is LoRA-only, model eligibility varies by family and method, and customers that need
              fuller control still drop into the lower-level training surface. The same-stack promise can shorten
              operational handoffs, but it also concentrates portability and performance risk in Fireworks' runtime and
              scheduler. The assigned evidence does not isolate the contribution of each optimization or demonstrate
              reproducibility across representative customer workloads.
            claimRefs:
