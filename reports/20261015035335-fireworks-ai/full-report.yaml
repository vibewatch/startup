        title: Capability breadth is useful but not exclusive
        blocks:
          - type: paragraph
            body: >-
              Fireworks offers a broad managed path from serverless experimentation through dedicated or reserved
              capacity and model training. Official pages also claim OpenAI and Anthropic compatibility, which can
              reduce migration effort for application teams. The competitive cost of that convenience is lower switching
              friction: an independent guide notes that compatible APIs make movement among providers relatively easy.
              Catalog breadth is directionally strong, but the company's own pages present unreconciled counts of more
              than 100 and more than 250 models, so neither number should be treated as a single canonical inventory
              without a dated definition. The positioning map therefore uses transparent ordinal judgments about
              specialization and lifecycle breadth, not speed, quality, cost, or market-share measurements.
            claimRefs:
