              - CI017
      - number: '4.2'
        title: Public traction is strong, but unit economics are mostly proxies
        blocks:
          - type: paragraph
            body: >-
              Fireworks' public revenue story is impressive on scale metrics even though it is thin on unit economics.
              In the October 2025 Series C announcement, the company said it served more than 10,000 companies,
              processed over 10 trillion tokens per day, and had annualized revenue above $280 million. July 2026
              third-party profiles pushed that picture further, reporting a roughly $1.5 billion Series D, a $17.5
              billion valuation, and revenue run rate above $1 billion. Those figures imply very rapid expansion, but
              the main efficiency read-through is indirect: Swellpulse frames expansion as customers adding GPU capacity
              and moving pilots into production. That is useful as a sales-motion proxy, not as proof of gross margin,
              CAC payback, or durable cohort economics.
            claimRefs:
              - CI004
              - CI006
              - CI007
              - CI008
              - CI011
              - CI012
