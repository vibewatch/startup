      - number: '5.3'
        title: Maturity, controls, and open product risks
        blocks:
          - type: paragraph
            body: >-
              Maturity signals are credible but incomplete. Public sources support familiar enterprise control points
              such as autoscaling across regions, compliance positioning, model versioning, and routing for specialized
              workloads, and the developer-facing materials suggest Fireworks is trying to own the transition from
              training to production operations. But the reviewed pack still leaves implementation diligence open on
              uptime commitments, incident history, and the scope of published control evidence, so buyer confidence
              should come from direct diligence rather than from curated customer or partner narratives alone.
            claimRefs:
              - CE007
              - CE010
              - CE011
              - CE013
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Same-stack promotion is the clearest product advantage
            body: >-
              The strongest technical through-line is that Fireworks markets training, optimization, deployment, and
              routing as one continuous operating surface, which reduces handoff friction when a team moves an adapted
              model into production.
            calloutType: strength
            claimRefs:
              - CE003
              - CE009
              - CE010
          - type: callout
            title: Public control evidence is shallower than the product surface
            body: >-
              The assigned public materials make a credible case that Fireworks exposes enterprise controls, but they
              stop short of publishing the operational detail a buyer would need to underwrite uptime, control scope,
              and incident-response maturity.
            calloutType: risk
            claimRefs:
