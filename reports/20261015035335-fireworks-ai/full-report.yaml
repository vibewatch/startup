  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >
              Fireworks' market boundary is narrower than "all AI" and broader than a single inference API. The company
              describes itself as infrastructure for specialized intelligence spanning training, fine-tuning, and
              production inference, while its docs and inference pages show serverless, dedicated, and reserved
              deployment modes. That means the included spend is the stack used to adapt, serve, and operate open models
              in production. The excluded spend is just as important: general cloud compute that stays self-hosted,
              closed-model subscriptions that never move to open models, and application-layer SaaS budgets that do not
              require model operations. In practice, the status-quo alternatives are closed-model APIs, self-managed
              open-source serving stacks, and hyperscaler control planes that bundle model access, governance, and
              contracting into an existing cloud relationship.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM012
      - number: '2.2'
        title: Sizing evidence is strong on demand proxies and weak on category totals
        blocks:
          - type: paragraph
            body: >
              The strongest public sizing evidence in the assigned pool is company demand rather than a bounded market
              model. Fireworks said in October 2025 that it had crossed 10,000 companies, hundreds of thousands of
              developers, more than 10 trillion tokens per day, and $280M in annualized revenue. Microsoft later
              described the integrated stack as processing more than 13 trillion tokens daily and about 180 thousand
              requests per second, while Sacra estimated roughly $800M in annualized revenue by May 2026. Those
              datapoints show that the company is already serving a large production workload, but they do not establish
              how much of the broader open-model inference, post-training, or enterprise AI operations market remains
              unserved. The result is a credible demand lens but not a full TAM/SAM/SOM.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM016
