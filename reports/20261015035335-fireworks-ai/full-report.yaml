      - number: '6.2'
        title: Named production proof and adoption trajectory
        blocks:
          - type: paragraph
            body: >-
              The strongest named customer proof is qualitative, but it is still meaningful. Fireworks' site includes
              attributed quotes from buyers describing concrete production outcomes, and AWS supplies third-party
              corroboration for at least one end-customer outcome and for Sourcegraph's Cody deployment. The October
              2025 Series C announcement adds broader scale signals: more than 10,000 companies, hundreds of thousands
              of developers, more than 10 trillion tokens per day, and annualized revenue above $280 million. Those
              figures show commercial traction and deployment breadth, but they are not retention metrics, and they do
              not reveal how much of the customer base is paying at enterprise scale versus using lighter self-serve or
              experimental workloads.
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU011
              - CU013
              - CU014
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU013
              - CU014
              - CU015
      - number: '6.3'
        title: Expansion path is clear; durability and concentration are not
        blocks:
          - type: paragraph
            body: >-
              Fireworks presents a coherent expansion motion: developers can start on serverless usage, move to
              dedicated deployments, then add reserved capacity and training on the same platform as workloads mature.
              That packaging creates a plausible land-and-expand loop, especially when paired with partner ecosystems
              such as AWS, NVIDIA, and MongoDB. The gap is that public evidence stops short of proving durability.
              Retention metrics, renewal terms, churn, contract length, and top-customer concentration are not disclosed
              in the retained public materials. Independent review material also highlights friction points: a minimal
              free-credit entry point and pricing that often moves into sales-led enterprise conversations. Together,
              the public record supports real adoption and expansion logic, but not the resilience or concentration
              profile of that revenue base.
            claimRefs:
              - CU002
              - CU009
              - CU010
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: The risk stack is led by execution under a premium valuation
        blocks:
          - type: paragraph
            body: >-
              Fireworks entered a materially less forgiving underwriting regime in July 2026. Wikipedia reports a $1.51
              billion Series D at a $17.5 billion valuation, while Enera reports a $1.505 billion round, a $1 billion
              annualized revenue run rate, and fivefold year-over-year growth. Those figures are not audited financial
              statements, and annualized revenue run rate is not ARR, cash, or profitability. The principal downside is
              therefore a mismatch between the valuation and still-undisclosed gross margin, burn, runway, customer
              concentration, and capacity commitments. Independent commentary also identifies GPU dependence, pricing
              opacity, crowded competition, and possible inference-margin compression, leaving little room for a
              reliability or cost-control miss.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR008
              - CR010
              - CR013
              - CR014
      - number: '7.2'
        title: Compliance marketing does not close legal and regulatory diligence
        blocks:
          - type: paragraph
            body: >-
              Fireworks states that its inference service is SOC 2 Type II, HIPAA-ready, and GDPR-compliant, and that it
              does not reuse inference inputs or outputs. That is a relevant control signal, but the assigned evidence
              does not contain audit reports, a data-processing addendum, subprocessor terms, model-license indemnities,
              court records, or regulator files. The platform's support for more than 100 models, custom weights,
              training, and rapid model launches broadens the licensing, provenance, privacy, and export-control surface
              that customers must govern. The correct investment posture is not to infer a clean record from the absence
              of adverse primary documents in this pool; it is to keep residual exposure elevated until contract and
              regulator diligence is completed.
            claimRefs:
              - CR002
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR004
              - CR008
              - CR011
              - CR012
              - CR013
      - number: '7.3'
        title: Public reliability assurances face specific operating counter-signals
        blocks:
          - type: paragraph
            body: >-
              Official materials describe multi-region autoscaling, dedicated deployments, reserved capacity, and
              production-grade reliability. Against that, RFP.wiki's review aggregation cites a small Trustpilot sample
              reporting reliability concerns, abrupt serverless model removals, and slower support for non-enterprise
              users. Those observations are low-volume and not an incident census, but they identify concrete failure
              modes that matter to production buyers. Fireworks' own multi-turn reinforcement-learning guidance
              separately acknowledges that APIs can change, rate-limit, or fail, that external tool latency varies, and
              that reward design can produce proxy gaming. The mitigations are credible architecture choices, yet public
              SLA, incident, change-notice, recovery-time, and support-cohort data remain unavailable.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR009
              - CR010
      - number: '7.4'
        title: Capacity, ecosystem, and economics define monitorable thesis breaks
        blocks:
          - type: paragraph
            body: >-
              Fireworks' operating model depends on GPUs, external model families, and customers graduating from
              serverless usage to dedicated or reserved capacity. The broad catalog and compatible APIs reduce
              dependence on any single model, but they also create model-availability, license, quality, and migration
              obligations. Thesis-break signals should be measured rather than inferred: repeated unplanned removals,
              rising incident frequency, material support deterioration, capacity shortages, shrinking price-performance
              advantage, or financing without disclosure of margins and committed capacity. Diligence should also test
              top-customer, cloud, GPU-supplier, and model-provider concentration. Without those denominators and
              contract terms, funding raised cannot be treated as cash available or as proof that partner risk is
              diversified.
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR009
              - CR010
              - CR011
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public scale does not resolve downside economics
            body: >-
              Annualized revenue run rate and funding are not ARR, margin, cash availability, or runway; gross margin,
              burn, committed capacity, and concentration remain material diligence gaps.
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR014
          - type: callout
            title: Gate underwriting on primary legal and operating evidence
            body: >-
              Require audit artifacts, incident and deprecation history, contract protections, concentration data, and
              workload-level unit economics before treating the current risk stack as mitigated.
            calloutType: recommendation
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Fireworks looks like a high-quality asset, but the current public underwriting case is more about price
              discipline than company quality. Independent 2026 sources place the Series D at roughly $1.505B raised and
              about $17.5B-$18B post-money, while Multiples and Value Add VC both frame that round near a 17.5x revenue
              multiple on about $1B of run-rate revenue. That is not obviously irrational for a business that appears to
              have moved from more than 10T tokens per day and $280M annualized revenue in late 2025 to 40T+ tokens and
              $1B run-rate by July 2026, but it does mean the easy upside is already prepaid. Because public evidence
              still does not settle exact round economics, margin durability, or retention quality tightly enough to
              support false precision, the recommendation is track rather than buy unless diligence or price improves.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV012
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV012
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
      - number: '8.2'
        title: What supports the bull case
        blocks:
          - type: paragraph
            body: >-
              The strongest support for Fireworks' premium comes from product breadth plus evidence of real production
              usage. Company materials show Fireworks is not only a token-serving API: it links training, fine-tuning,
              evaluation, and inference across serverless, dedicated, and reserved deployments, which can raise
              switching costs once a customer standardizes. The October 2025 Series C post disclosed more than 10,000
              companies, more than 10T tokens per day, and annualized revenue above $280M, while later independent
              summaries say July 2026 scale exceeded $1B of run-rate revenue and 40T tokens per day, with most volume
              tied to customer-specialized models. Microsoft's Foundry launch also matters because it can widen
              enterprise distribution and governance credibility without Fireworks having to win every enterprise
              relationship from scratch.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV013
      - number: '8.3'
        title: Anti-thesis and valuation fragility
        blocks:
          - type: paragraph
            body: >-
              The anti-thesis is straightforward: Fireworks may be proving demand, but inference remains a brutally
              competitive and compute-heavy layer. Simplify's adverse summary argues that OpenAI, Anthropic, and
              Microsoft Foundry can compress margins by controlling the developer entry point, while Value Add VC flags
              a race to the bottom in token pricing as hyperscalers, Together AI, Baseten, and other inference
              specialists chase the same enterprise budget. Even round precision is not fully settled in public markets:
              Forge's July 2026 financing page is directionally consistent with the raise but shows a lower $15.54B
              post-money mark and only a partial view into preference terms. That mix does not invalidate the business,
              but it does make a stretched-valuation call more defensible than a clean buy recommendation.
            claimRefs:
              - CV006
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.4'
        title: Scenarios and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The right way to handle Fireworks from public evidence is to bracket scenarios rather than pretend exact
              target returns are knowable. The bull case requires the integrated product stack and
              Foundry/Nvidia-adjacent distribution to translate into durable retention, acceptable gross margins, and
              continued share gains versus peers. The base case is simpler: Fireworks remains important infrastructure,
              but the current mark already discounts much of that proof, so a new investor mostly waits for a better
              entry or better evidence. The bear case is not demand collapse; it is multiple compression if
              partner-controlled distribution, pricing pressure, or weak unit economics make Fireworks look more
              interchangeable than the current round price assumes. The final diligence asks therefore center on gross
              margin, NRR/churn, customer concentration, and a full cap-table waterfall.
            claimRefs:
              - CV009
              - CV011
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV009
              - CV011
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, not buy
            body: >-
              Fireworks appears strategically important and operationally real, but public valuation support is already
              rich enough that new money needs either better private economics or a better entry.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV012
              - CV014
          - type: callout
            title: Margin proof is the gating diligence item
            body: >-
              The most credible downside is multiple compression from partner-controlled distribution and token-price
              competition before Fireworks proves durable gross margins and retention.
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV015
