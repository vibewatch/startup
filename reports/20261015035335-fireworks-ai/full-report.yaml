  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer footprint and who appears to buy
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to two overlapping customer groupings. The first is AI-native software teams and
              developer-led product groups that need fast open-model inference, lower latency, and an easy migration
              path from OpenAI-style APIs. The second is larger enterprise or regulated buyers that care about data
              sovereignty, compliance posture, and the ability to move from experimentation to dedicated or reserved
              capacity without rebuilding the stack. Fireworks' own materials name customers such as Samsung, Uber,
              DoorDash, Notion, Shopify, and Upwork, while current testimonials skew heavily toward AI-native software
              companies such as Cursor, Sourcegraph, Vercel, Gumloop, Quora, and Genspark. That mix suggests the company
              wins first with performance-sensitive builders, then tries to move upmarket through infrastructure,
              security, and partner distribution.
            claimRefs:
              - CU001
              - CU004
              - CU007
              - CU008
              - CU009
