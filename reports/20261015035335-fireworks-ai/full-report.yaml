      - CP002
      - CP003
      - CP004
      - CP005
      - CP009
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public product surfaces describe a usage-led bridge from prototyping into committed capacity and adjacent training
      spend, with gross profit still dependent on GPU cost and utilization rather than disclosed software-like margin.
    data:
      nodes:
        - id: workload
          label: Customer AI workload
          detail: Prototype or production need for open-model inference
        - id: serverless
          label: Serverless entry
          detail: Pay-per-token usage for rapid testing and early production
        - id: dedicated
          label: Dedicated deployment
          detail: On-demand or reserved capacity for higher throughput and predictability
        - id: training
          label: Training and fine-tuning
          detail: Supervised and reinforcement fine-tuning on the same infrastructure
        - id: loop
          label: Deploy and iterate loop
          detail: What customers train on Fireworks also serves on Fireworks
        - id: expansion
          label: Volume and commitment expansion
          detail: More tokens, more capacity, and deeper model lifecycle spend
        - id: gross-profit
          label: Gross profit outcome
          detail: Depends on cost per token, utilization, and undisclosed enterprise discounts
      edges:
        - from: workload
          to: serverless
        - from: serverless
          to: dedicated
        - from: dedicated
          to: training
        - from: training
          to: loop
        - from: loop
          to: expansion
        - from: expansion
          to: gross-profit
    approximationNotes: >-
      This is a public-product-surface flow, not a quantified funnel; realized conversion rates, discounting, and gross
      margin are unavailable.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI009
      - CI017
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Publicly described layers show Fireworks as one surface spanning developer entry points, inference runtime,
      lifecycle controls, training, and trust controls.
    data:
      layers:
        - label: Customer entry points
          detail: Teams can start self-serve and graduate into higher-control deployments.
          modules:
            - label: Serverless API
              detail: Pay-per-token entry path for prototyping and bursty workloads
            - label: Dedicated deployments
              detail: On-Demand capacity for production isolation and post-trained models
            - label: Reserved capacity
              detail: Guaranteed capacity for steadier high-volume usage
        - label: Developer interfaces
          detail: Multiple launch and operating surfaces wrap the same underlying jobs.
          modules:
            - label: UI
              detail: Guided configuration and visual monitoring
            - label: CLI / API
              detail: Scripted job creation and deployment management
            - label: Agent surfaces
              detail: Agent-assisted training configuration and troubleshooting
        - label: Serving runtime
          detail: Inference is positioned as the common runtime for both foundation and adapted models.
          modules:
            - label: Compatibility layer
              detail: OpenAI and Anthropic compatible APIs
            - label: Performance engine
              detail: Batching, caching, speculative decoding, and kernel optimization
            - label: Scaling layer
              detail: Autoscaling across regions with traffic management
        - label: Lifecycle controls
          detail: Model promotion and routing are part of the product story, not a separate stack.
          modules:
            - label: Upload / optimize / deploy
              detail: Consistent path from model asset to live endpoint
            - label: Version and canary
              detail: Test new models or configs before broad rollout
            - label: Nexus / routing
              detail: Route workloads across open and closed model options
        - label: Training plane
          detail: Managed and lower-level paths sit next to inference rather than behind a separate vendor boundary.
          modules:
            - label: Managed training
              detail: OpenAI-format data with Fireworks-run scheduling, checkpointing, and output
            - label: Supported families
              detail: DeepSeek, Qwen, Kimi, Gemma, GLM, and Llama families
            - label: Training API fallback
              detail: Full-parameter tuning and custom logic live outside the managed LoRA path
        - label: Trust and operations
          detail: Public trust signals are visible, but deep operating proof remains a diligence task.
          modules:
            - label: Security posture
              detail: SOC 2 Type II, HIPAA-ready, and GDPR-compliant positioning
            - label: Data handling promise
              detail: Fireworks says inference inputs and outputs are not used for other purposes
            - label: Open diligence items
              detail: No public SLA, incident-history, or audit-scope detail in the assigned pack
    approximationNotes: >-
      This is a source-backed operating map rather than a code-level system diagram; it preserves only the layers
      explicitly described in the assigned evidence.
    claimRefs:
      - CE003
      - CE004
      - CE007
      - CE009
      - CE010
      - CE011
      - CE013
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      The public journey runs from developer trial to enterprise standardization, with the strongest proof on adoption
      steps and less proof on long-term retention.
    data:
      items:
        - label: Prototype evaluation
          actor: Developer
          touchpoints:
            - OpenAI-compatible API
            - Serverless, pay-per-token entry point
        - label: Production integration
          actor: Product and ML teams
          touchpoints:
            - Dedicated GPUs with autoscaling
            - Structured outputs, function calling, and model choice
        - label: Security and compliance review
          actor: Enterprise buyer
          touchpoints:
            - SOC 2 Type II, HIPAA-ready, and GDPR-compliant posture
            - Deploy into customer-controlled environments for sensitive data
        - label: Named customer expansion
          actor: AI-native software teams
          touchpoints:
            - Sourcegraph doubled completion acceptance and improved latency
            - Notion cut latency from about 2 seconds to 350 milliseconds
        - label: Partner-led enterprise trust
          actor: Platform and procurement stakeholders
          touchpoints:
            - AWS and NVIDIA optimization narrative
            - MongoDB RAG and data-sovereignty packaging
        - label: Spend expansion loop
          actor: Platform owner
          touchpoints:
            - Serverless -> on-demand -> reserved
            - Training and inference on one stack
    approximationNotes: >-
      The sequence is an analytical synthesis of publicly described adoption surfaces, not a disclosed funnel with
      conversion rates.
    claimRefs:
      - CU002
      - CU009
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: Valuation compression, service continuity, and capacity economics remain the highest residual risks.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Valuation and margin compression
          note: Reported valuation is high while audited margin, burn, and capacity commitments remain unavailable.
          values:
            - High
            - High
            - Low
            - High
        - label: Service continuity and model removal
          note: Official reliability claims coexist with limited public complaints about availability and removals.
          values:
            - Medium
            - High
            - Medium
            - High
        - label: GPU capacity and cost dependence
          note: Dedicated and reserved products mitigate access risk but do not disclose supplier concentration.
          values:
            - Medium
            - High
            - Medium
            - High
        - label: Privacy, licensing, and regulatory diligence
          note: Compliance claims are visible, while primary legal and contract evidence is absent from this pool.
          values:
            - Medium
            - High
            - Low
            - High
        - label: Multi-turn RL execution quality
          note: Fireworks itself describes unstable tools, sparse rewards, and reward-hacking failure modes.
          values:
            - Medium
            - High
            - Medium
            - Medium-High
        - label: Support and buyer cost friction
          note: Review aggregation identifies support variability and usage-cost forecasting uncertainty.
          values:
            - Medium
            - Medium
            - Low-Medium
            - Medium
    approximationNotes: >-
      Matrix values are qualitative analyst judgments tied to cited evidence and gaps; they are not measured
      probabilities, third-party scores, or actuarial estimates.
    claimRefs:
      - CR003
      - CR004
      - CR005
      - CR006
