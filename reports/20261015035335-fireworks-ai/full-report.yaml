  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Public evidence supports a high-quality company view, but not an automatic buy at the observed 2026 price band.
    data:
      nodes:
        - id: breadth
          label: Integrated product breadth
          detail: Training, fine-tuning, routing, and inference live on one platform.
          claimRefs:
            - CV001
            - CV007
        - id: scale
          label: Scale proof
          detail: >-
            Series C to Series D evidence shows a move from >10T tokens/$280M annualized revenue to 40T+ tokens and ~$1B
            run-rate.
          claimRefs:
            - CV003
            - CV004
            - CV008
        - id: channels
          label: Enterprise distribution leverage
          detail: Microsoft Foundry adds governance and control-plane reach.
          claimRefs:
            - CV009
        - id: pricing
          label: Premium price already set
          detail: Public July 2026 marks cluster around a 17.5x revenue multiple.
          claimRefs:
            - CV004
            - CV005
            - CV012
        - id: pressure
          label: Margin and competition pressure
          detail: Adverse sources highlight hyperscalers, model commoditization, and partner-controlled entry points.
          claimRefs:
            - CV010
            - CV011
            - CV015
        - id: call
          label: Recommendation = track
          detail: Wait for stronger private economics or a better entry price.
          claimRefs:
            - CV014
            - CV015
      edges:
        - from: breadth
          to: scale
          label: broad offering converts into usage proof
          claimRefs:
            - CV001
            - CV003
        - from: scale
          to: channels
          label: scale attracts enterprise channels
          claimRefs:
            - CV008
            - CV009
        - from: channels
          to: pricing
          label: distribution helps support premium marks
          claimRefs:
            - CV004
            - CV009
        - from: pricing
          to: pressure
          label: premium must survive harder economics
          claimRefs:
            - CV005
            - CV011
        - from: pressure
          to: call
          label: downside asymmetry drives entry discipline
          claimRefs:
            - CV014
            - CV015
    approximationNotes: Qualitative sequence only; this is not a probability-weighted valuation model.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV009
      - CV010
      - CV011
      - CV014
      - CV015
