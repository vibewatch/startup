      - number: '3.3'
        title: Packaging lowers entry friction; realized economics remain private
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows three principal Fireworks packaging modes: pay-per-token serverless inference,
              dedicated GPU deployments, and reserved capacity, with managed training alongside them. A July 2026 review
              listed dedicated H100 and H200 capacity at $7 per GPU-hour, B200 at $10, and B300 at $12, but these are
              third-party published rates rather than customer invoices and should not be generalized to enterprise
              discounts or committed-spend economics. Independent guides also report that fine-tuned models can be
              served at base-model token prices. Distribution may extend beyond direct sales because one newsletter
              characterized large clouds as both suppliers and channels, yet the assigned evidence does not quantify
              channel-sourced bookings or partner dependence.
            claimRefs:
              - CP005
              - CP010
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP010
              - CP014
      - number: '3.4'
        title: The moat depends on execution, not hard lock-in
        blocks:
          - type: paragraph
            body: >-
              The strongest defensibility case is operational: rapid model availability, one platform spanning training
              and serving, and reduced infrastructure work for the buyer. It is not an exclusive-asset case. Fireworks
              does not own a flagship foundation model, and a third-party review warns that its output-quality ceiling
              therefore depends on the open and external models it hosts. Independent guidance also says vendor speed
              claims must be tested with representative prompts, context lengths, function calls, and streaming behavior
              because production workloads can diverge from marketing demonstrations. Those facts create a credible
              commoditization path: compatible interfaces support multi-homing, model suppliers retain leverage, and a
              faster peer or bundled hyperscaler route can displace Fireworks unless its reliability, customization
              workflow, and distribution compound faster than switching costs fall.
            claimRefs:
              - CP006
              - CP011
              - CP012
              - CP013
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Portability cuts both ways
            body: >-
              Compatibility can shorten migration into Fireworks, but it also makes provider switching and multi-homing
              more feasible. Retention therefore has to come from workload performance, reliability, customization
              workflow, and commercial execution rather than API lock-in alone.
            calloutType: risk
            claimRefs:
              - CP006
              - CP012
              - CP013
          - type: callout
            title: Published comparisons are not buyer-specific benchmarks
            body: >-
              The retained independent sources offer useful competitor taxonomy and pricing signals, but they do not
              provide a same-model, same-region, same-prompt benchmark across Fireworks, Together AI, Groq, Replicate,
              Bedrock, and self-hosting.
            calloutType: assumption
            claimRefs:
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public monetization surface
        blocks:
          - type: paragraph
            body: >-
              Fireworks publicly positions itself as a combined training-and-inference platform rather than a single API
              endpoint vendor. Its official surfaces show a clear monetization ladder: serverless pay-per-token usage
              for fast prototyping, on-demand dedicated deployments for higher-performance workloads, reserved capacity
              for predictable scale, and paid fine-tuning or training workloads on the same stack. That architecture
              matters because it suggests revenue can expand both by growing token volume and by moving customers into
              more committed capacity constructs. What remains missing is the commercial detail investors normally use
              to judge quality—realized pricing, discount schedules, contract minima, and the split between self-serve
              usage and negotiated enterprise commitments are not disclosed in the reviewed public materials.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI017
