    notes: >
      This chapter uses demand proxies because the assigned pool does not contain an independent,
      source-backed TAM/SAM/SOM for Fireworks' serviceable market.
    claimRefs: [CM006, CM007, CM008, CM009, CM016]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - AI-native developer teams
        - Engineering lead or product engineer
        - Developers shipping model features
        - Product / engineering budget
        - Start with serverless, OpenAI-compatible inference and iterate quickly
        - Local product or platform engineering
        - Need faster open-model performance without rewriting clients
      - - Enterprise AI platform teams
        - AI platform lead or CTO office
        - ML engineers and internal app teams
        - Centralized AI or cloud budget
        - Evaluate, deploy, govern, and monitor open models inside a common control plane
        - Platform / procurement owner
        - Governance, observability, and contracting become as important as raw speed
      - - Regulated or multinational operators
        - Security, data, or infrastructure leader
        - Internal AI application teams
        - IT / compliance-backed platform budget
        - Dedicated or reserved deployments with data residency and enterprise controls
        - Security / infrastructure organization
        - Compliance, privacy, and regional serving requirements
      - - Model-adaptation and agent builders
        - Applied AI or ML infra lead
        - Model engineers
        - AI infrastructure or R&D budget
        - Train, fine-tune, evaluate, and serve on one stack
        - AI infrastructure owner
        - Need to shorten the loop from tuning to production operation
    notes: >
      Buyer roles are inferred from product packaging, Microsoft Foundry positioning, and cited
      customer use cases; the pool does not disclose segment-level revenue mix.
    claimRefs: [CM004, CM010, CM011, CM012, CM013]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >
      Public evidence supports a layered demand lens from current operating scale to broader
      enterprise control-plane budgets, but not a defensible standalone TAM/SAM/SOM.
    data:
      items:
        - label: Enterprise open-model operations
          value: "Unquantified in assigned evidence"
          note: Broadest reachable layer includes evaluation, governance, deployment, and ongoing optimization rather than all enterprise AI spend.
          tone: neutral
        - label: Governed cloud control plane
          value: "Unquantified in assigned evidence"
          note: Microsoft Foundry places Fireworks inside existing enterprise evaluation, governance, and procurement workflows.
          tone: opportunity
        - label: Managed training and inference lifecycle
          value: "Unquantified in assigned evidence"
          note: Fireworks addresses training, fine-tuning, production serving, and iteration on one platform.
          tone: opportunity
        - label: Production inference capacity
          value: "Unquantified in assigned evidence"
          note: Serverless, on-demand, and reserved modes map to progressively larger and more durable deployment budgets.
          tone: neutral
        - label: Observed workload proxy
          value: "10,000+ companies and 10T-13T+ tokens/day"
          note: Company and Microsoft figures show scaled production usage, but not category share.
          tone: positive
        - label: Observed monetization proxy
          value: "$280M+ reported in Oct. 2025 to ~$800M estimated in May 2026"
          note: Company disclosure plus Sacra estimate show monetized demand, not a market ceiling or SOM.
          tone: risk
    approximationNotes: >
      The layers combine reported and estimated operating proxies rather than a single
      source-backed TAM/SAM/SOM framework.
    claimRefs: [CM004, CM006, CM007, CM008, CM009, CM013, CM016]
