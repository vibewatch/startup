  evidenceGaps:
    - type: missing-source
      severity: material
      topic: tam-sizing
      missingEvidence: An independent category study or public-company disclosure that isolates open-model inference, post-training, and governed deployment budgets.
      whyItMatters: Without a bounded market denominator, valuation and share arguments rely on company operating proxies rather than category totals.
      diligencePath: Obtain current analyst research or public-company segment data that separates open-model operations spend from broader AI software budgets.
      relatedQuestionRefs: [QM007]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: segment-mix
      missingEvidence: Revenue or usage mix by developer self-serve, enterprise platform, and regulated-workload cohorts.
      whyItMatters: Segment mix determines how much of current demand is durable enterprise budget versus transient experimentation volume.
      diligencePath: Request cohort-level customer, reserved-capacity, or revenue mix from management or investor materials.
