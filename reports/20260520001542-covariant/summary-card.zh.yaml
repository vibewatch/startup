  headline: Covariant 是一家技术有差异化的 AI 机器人软件公司，正站在拐点上：创始团队离开后，$2.7B 估值很难自圆其说，但装机基础和 RFM-1 技术对收购方和有耐心的投资人仍有真实战略价值。
