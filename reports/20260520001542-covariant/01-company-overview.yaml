  - id: capital-and-stakeholders
    title: Funding history, valuation evidence, and stakeholder map
    body: |
      Capital history is well evidenced through April 2023 and much murkier after that. The last
      locally verified public financing event in the fetched source set is an additional $75
      million Series C extension announced in April 2023. Multiple sources say that round brought
      total disclosed funding to $222 million and was co-led by Index Ventures and Radical
      Ventures, with CPP Investments, Amplify Partners, Gates Frontier Holdings, AIX Ventures, and
      Northgate Capital also named. Public coverage around the Amazon deal in late 2024 still
      referenced that 2023 round and a reported roughly $625 million valuation.

      Earlier history is also visible. Global Venturing and Wikipedia support an $80 million Series
      C in July 2021, taking disclosed funding to $147 million at that point, and Wikipedia also
      references a $40 million Series B in May 2020 after a prior $20 million Series A. What is
      not visible in this local source pack is an independently fetched primary or high-quality
      public source verifying a later 2024 round or a materially higher late-stage valuation.

      Stakeholder importance therefore extends beyond the cap table. Amazon matters because it now
      holds the license and much of the original founder talent; Index and Radical matter because
      they repeatedly underwrote the AI-software thesis; KNAPP matters because it is a live go-to-
      market and deployment partner; and named enterprise users matter because customer proof is
      more visible than financial disclosure.
    claimRefs:
      - CO020
      - CO021
