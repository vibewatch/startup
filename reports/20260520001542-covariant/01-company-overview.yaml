company:
  name: Covariant
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Covariant is a 2017 AI robotics company with public location signals spanning Emeryville,
    Berkeley, and the broader Bay Area. Its core commercial asset is AI software for industrial
    and warehouse robots, historically marketed as the Covariant Brain and expanded in March 2024
    with the RFM-1 robotics foundation model. The August 2024 Amazon transaction was not a full
    acquisition in the fetched public record: Amazon hired three founders and licensed the models,
    while Covariant stayed private and continued operating under Ted Stinson and Tianhao Zhang.
    Public product and customer evidence is meaningful, but board visibility, exact current
    headcount, revenue, and any post-April-2023 valuation beyond the last locally verified $75M /
    $222M funding data remain private or conflicting.
sections:
  - id: identity-and-stage
    title: Identity, stage, and operating model
    body: |
      Covariant was founded in 2017 and is still best understood as a private AI robotics software
      company rather than a robot OEM. The company is repeatedly described as Bay Area-based, but
      local identity signals are not perfectly harmonized. Chamber of Commerce, Craft, and
      Wikipedia point to 5905 Christie Avenue in Emeryville, while LinkedIn still labels the
      company as Berkeley-based and Amazon/TechCrunch use broader Bay Area language. The prudent
      reading is that Covariant sits in the Berkeley-to-Emeryville corridor and should not be
      over-anchored to one marketing label.

      The business model is clearer than the address. Covariant sells AI software that powers
      industrial robotic cells for picking, sortation, induction, depalletization, and related
      warehouse workflows. The installed-base product has long been the Covariant Brain, and in
      March 2024 the company used that deployment base to launch RFM-1, a robotics foundation
      model that Peter Chen described as a large language model for robot language. Public sources
      consistently position the company as software-first, partner-enabled, and aimed at
      production automation in logistics before broader manufacturing and service use cases.
    claimRefs:
