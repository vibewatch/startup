      - number: '1.2'
        title: Founders, succession, and governance visibility
        blocks:
          - type: paragraph
            body: |
              Covariant's founding bench is unusually strong for a robotics application company. The public
              record consistently names Pieter Abbeel, Peter Chen, Rocky Duan, and Tianhao Zhang as the
              founding team, with Berkeley Robot Learning Lab and OpenAI ties showing why the company could
              credibly build a foundation-model narrative. That founder pedigree matters because the
              company's differentiation depends more on model quality, deployment learning, and technical
              credibility than on commodity hardware.

              Leadership changed materially in August 2024 when Amazon hired Chen, Abbeel, and Duan along
              with about a quarter of Covariant's employees. Fetched sources agree that Ted Stinson moved
              from COO to CEO and that co-founder Tianhao Zhang remained to help lead the standalone
              company. That preserved operational continuity, but it also created obvious key-person risk:
              the public face of the original thesis moved to Amazon while the remaining company had to
              prove it could keep selling, supporting customers, and advancing the technical roadmap
              without three marquee founders.

              Governance disclosure remains thin. Public materials identify the current executive handoff,
              but they do not provide a current board roster, current investor control rights, or a clean
              post-deal ownership map. For diligence, that means leadership continuity is visible but
              governance transparency is not.
