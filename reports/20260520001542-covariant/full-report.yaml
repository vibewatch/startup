        title: Revenue model is legible, but realized pricing is opaque
        blocks:
          - type: paragraph
            body: >
              Covariant's public materials consistently describe the company as selling intelligence for warehouse
              robots rather

              than a full-stack automation system. BusinessWire, Index Ventures, Amazon's 2024 announcement, and older
              product

              coverage all point to the same commercial shape: the company provides the Covariant Brain or
              robotics-foundation-

              model layer, deploys it through partner and customer installations, and then stays involved through
              commissioning,

              support, and model improvement. That makes the business financially more complex than a clean SaaS
              subscription.

              There is likely a software or platform fee, a deployment or integration workstream, and some recurring
              support or

              usage component once cells are live.


              What public evidence does not provide is the pricing waterfall. Covariant's current website has no list
              prices,

              partner press releases do not disclose realized contract terms, and the strongest monetization clue after
              2024 is

              strategic licensing: Amazon said it signed a non-exclusive license for Covariant's robotic foundation
