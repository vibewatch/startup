      - number: '8.2'
        title: Price context and comparable read-through
        blocks:
          - type: paragraph
            body: >
              Public financing evidence for Covariant is solid up to a point and weak exactly where valuation judgment
              becomes decisive. SEC filings and round coverage corroborate the 2021 Series C, the 2023 $75M extension,
              and total disclosed funding of about $222M. After that, however, fetched public sources do not produce a
              clear, verified standalone valuation together with the revenue and retention metrics needed to judge
              whether Covariant deserves a software premium, a hardware discount, or a restructuring haircut. That
              absence is not a minor data inconvenience; it is the central valuation problem.


              The most useful anchors therefore come from comparable outcomes. Yahoo's May 2026 valuation screen for
              Symbotic lists roughly $5.99B market cap, $2.52B trailing revenue, and about 2.26x sales, giving a public
              benchmark for a much more scaled warehouse-automation company. Berkshire Grey's March 2023 sale to
              SoftBank at about $375M demonstrates how quickly warehouse-automation equity can compress when scale and
              independence disappoint. Dexterity's March 2025 $95M round at a $1.65B post-money valuation shows that
              private investors will still pay up for physical-AI winners, but that premium is typically attached to a
              fresh financing event and a traction narrative, not to opaque legacy marks.


              Put together, these comps imply that Covariant should be valued with wide ranges and scenario discounts,
              not with a single heroic price target. The company may deserve more than a distressed automation multiple
              because the technology is distinctive and the customer base is real. But without disclosed economics, any
              multi-billion entry would ask investors to pay software-platform pricing while accepting unusually high
              governance, leadership, and commercialization uncertainty.
            claimRefs:
              - CV001
              - CV002
              - CV024
