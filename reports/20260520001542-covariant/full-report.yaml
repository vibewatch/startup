      - number: '5.2'
        title: >-
          RFM-1's public architecture is multimodal, simulation-oriented, and aimed at reducing task-specific
          programming
        blocks:
          - type: paragraph
            body: >
              The most important technical change in Covariant's public narrative is the move from fixed workflow
              automation to a multimodal reasoning interface. MIT Technology Review reported that RFM-1 can take five
              input types—text, images, video, robot instructions, and measurements—while TechCrunch described the
              customer-facing interaction as a text or voice prompt that feels intentionally LLM-like. Public demos
              reported by both outlets show the model not only identifying requested items but also generating predicted
              post-action images or videos before executing. That matters because the product claim is not just “better
              perception”; it is an attempt to make robot behavior programmable through higher-level intent plus learned
              prediction of physical outcomes.


              Covariant and partner materials consistently argue that this matters because traditional industrial
              automation breaks when the environment or object set changes. Radical's technical write-up says RFM-1
              combines general internet data with multimodal physical-interaction data and uses learned world-model
              behavior to reason under tight accuracy constraints. MIT's reporting adds that the model can ask for help
              when it cannot get a good grip, which is a subtle but important product signal: Covariant is trying to
              make warehouse robots interactive and recoverable, not merely autonomous in the narrow sense. The core
              diligence question is therefore not whether RFM-1 sounds impressive in prose—it does—but how much of the
              reasoning layer is now in routine production versus still in guided demo mode.
