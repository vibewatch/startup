  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Covariant's public product stack runs from operator inputs at the top to robot-cell execution at customer sites,
      with fleet learning connecting deployments back into model improvement.
    data:
      layers:
        - label: Operator and task interface
          detail: >-
            Text, image, video, robot-instruction, and measurement inputs let users describe tasks at a higher level
            than traditional robot programming.
          modules:
            - Natural-language prompts
            - Visual task context
            - Operator feedback
        - label: RFM-1 reasoning core
          detail: >-
            Robotics foundation model positioned as an LLM-like reasoning layer for robot language and manipulation
            tasks.
          modules:
            - Multimodal embeddings
            - Task interpretation
            - Action proposal
        - label: Predicted outcome / world-model layer
          detail: >-
            Public demos show RFM-1 generating likely post-action images or videos before execution and requesting help
            when grasp confidence is low.
          modules:
            - Outcome generation
            - Physical reasoning
            - Help-seeking loop
        - label: Fleet learning and model ops
          detail: >-
            Connected robots learn as a fleet, with site telemetry and customer-consented data feeding the shared
            improvement loop.
          modules:
            - Telemetry ingestion
            - Dataset growth
            - Cross-site updates
        - label: Customer-site robot cell execution
          detail: >-
            Covariant intelligence is deployed on industrial arms and partner-integrated warehouse cells rather than
            sold as a public open-source stack.
          modules:
            - Industrial robot arm
            - Vision system
            - Suction end effector
            - Warehouse integration layer
    approximationNotes: >-
      Public sources describe the layers and behaviors but do not publish a formal architecture diagram or module
      boundary spec; this figure is a synthesis of repeated signals across official, news, and technical-docs sources.
    claimRefs:
      - CE003
      - CE005
      - CE007
      - CE008
      - CE009
      - CE016
      - CE019
      - CE027
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: standard
    summary: >-
      Covariant's workflow begins with a warehouse task and ends with execution plus telemetry, reinforcing the
      company's fleet-learning moat.
    data:
      nodes:
        - id: task
          label: Warehouse task arrives (pick, sort, induct, kit, depalletize)
        - id: prompt
          label: Operator or system provides prompt / workflow context
        - id: rfm
          label: RFM-1 or Covariant Brain interprets task and candidate action
        - id: predict
          label: Model predicts likely outcome and grasp / motion plan
        - id: execute
          label: Industrial arm executes in customer-site robot cell
        - id: result
          label: Task outcome recorded for customer workflow
        - id: telemetry
          label: Telemetry feeds shared fleet-learning loop
      edges:
        - from: task
          to: prompt
          label: work order
        - from: prompt
          to: rfm
          label: multimodal input
        - from: rfm
          to: predict
          label: candidate action
        - from: predict
          to: execute
          label: selected plan
        - from: execute
          to: result
          label: completed move
        - from: result
          to: telemetry
          label: outcome data
        - from: telemetry
          to: rfm
          label: model improvement
    approximationNotes: >-
      Flow synthesizes how public demos, warehouse deployments, and fleet-learning claims fit together; exact middleware
      handoffs and latency budgets are not disclosed in the public source pack.
