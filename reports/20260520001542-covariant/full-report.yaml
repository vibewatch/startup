  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: >-
          Covariant Brain remains the commercial wedge while RFM-1 expands the product into a more general robot
          reasoning layer
        blocks:
          - type: paragraph
            body: >
              Public evidence points to a clear product evolution rather than a hard product reset. Covariant's
              long-running commercial asset is the Covariant Brain, a unified AI layer used inside warehouse robotic
              cells rather than a standalone robot hardware SKU. BusinessWire, Index Ventures, Engineering.com, and
              LinkedIn all describe the company as building software that lets robots see, reason, and act in dynamic
              fulfillment settings. By 2023, official materials said that same platform had already expanded from core
              picking into piece picking, case picking, order sortation, item induction, good-to-person order picking,
              kitting, and depalletization. That breadth matters because it suggests Covariant's differentiation is less
              about a single demo and more about reusing one learning stack across adjacent manual warehouse tasks.


              RFM-1 adds a second layer on top of that installed base. March 2024 coverage from TechCrunch, MIT
              Technology Review, and Radical Ventures positioned it as a robotics foundation model analogous to an LLM
              for robot language, but trained on data from real deployed warehouse systems rather than only web-scale
              text. The prudent read is that Covariant did not replace the Covariant Brain so much as reframe and extend
              it: the older commercial platform supplies deployment data, customer workflow fit, and live execution
              context, while RFM-1 is meant to make those systems more generalizable and easier to task. That is
              strategically attractive because it ties a frontier-model story to an existing revenue-bearing fleet
              instead of to an unreleased lab prototype.
