      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation
            body: >-
              Research-more. Covariant is strategically valuable enough to watch, but not transparent enough to
              underwrite at a premium private price from public evidence alone.
            calloutType: recommendation
            claimRefs:
