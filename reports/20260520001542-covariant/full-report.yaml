          - type: callout
            title: Why the valuation stance is stretched
            body: >-
              The core issue is not that Covariant lacks technology or customers; it is that the investor is being asked
              to bridge too many unknowns — current revenue, renewals, cap table, and Amazon-license scope — with a
              post-founder story that now deserves a larger discount.
            calloutType: risk
