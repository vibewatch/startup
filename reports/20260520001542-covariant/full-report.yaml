        - Attractive only if entry is far below the top of the range or if a new round proves the economics.
        - Bull case requires strong post-Amazon execution that public evidence does not yet show.
      - - Base
        - 50%
        - >-
          Company remains viable, but growth and fundraising reset until renewal quality, revenue mix, and leadership
          stability are visible.
        - $0.8B-$1.8B
        - Flat to negative from a premium multi-billion entry; acceptable only after a price reset.
        - Base case is dominated by opacity rather than by category collapse.
      - - Bear
        - 30%
        - >-
          Amazon becomes the superior commercialization path, partner momentum slows, and Covariant needs capital before
          re-establishing proof.
        - $0.2B-$0.8B
        - Permanent capital impairment from a premium entry; distressed strategic sale becomes plausible.
        - Leadership loss and customer hesitation transmit quickly into financing stress.
    notes: >-
      Scenario values are analytical ranges derived from comparable outcomes, revenue-opacity discounts, and milestone
      risk rather than from disclosed company guidance.
    claimRefs:
      - CV034
      - CV038
      - CV039
      - CV040
      - CV048
