companyProfile:
  summary: >-
    Covariant is an AI robotics software company founded in 2017 in Berkeley, California, by Pieter Abbeel, Peter Chen,
    Rocky Duan, and Tianhao Zhang. The company builds RFM-1 (Robot Foundation Model), a large-scale AI model trained on
    robotic manipulation data that enables industrial robots to handle novel, unstructured items in warehouse and
    logistics environments. Covariant's software operates as an intelligence layer on top of third-party robot hardware
    from manufacturers such as FANUC, ABB, Universal Robots, and Kuka. Key customers include DHL, GEODIS, Knapp AG, and
    Obeta. In August 2024, Amazon hired all four co-founders and licensed Covariant's AI models; Covariant continued
    operating as an independent private company under new leadership, retaining its customer contracts and workforce.
