  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: >-
          Customer segmentation is warehouse-first and split between direct enterprise accounts and integrator-led
          channels
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a focused but meaningful customer base rather than a broad horizontal software
              footprint. Covariant’s buyers are primarily warehouse operators, retailers, 3PLs, and healthcare or
              industrial distributors trying to automate piece picking, sortation, induction, and related fulfillment
              bottlenecks. The user is typically an operations or automation team at the site level, while the economic
              buyer sits with supply-chain leadership or with a systems integrator leading a broader
              warehouse-modernization program.


              The channel mix matters. Some proof points look like direct enterprise wins—Otto Group, Capacity, and
              Radial—while others come through deployment partners such as KNAPP and ABB. That channel structure expands
              reach and speeds deployment, but it also means a meaningful share of Covariant’s public customer proof is
              mediated by partner case studies rather than by directly disclosed customer contracts. The result is a
              customer base that looks commercially real and internationally distributed, but still partially opaque on
              customer ownership, pricing power, and revenue concentration.
