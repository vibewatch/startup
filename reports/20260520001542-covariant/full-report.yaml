  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Further leadership attrition
        - Loss of another core technical or commercial leader within 12 months
        - Raises the probability that value migrated with the founders rather than staying with the company
        - Pause underwriting and increase execution discount immediately.
      - - Customer or KNAPP retrenchment
        - Named partner or lighthouse customer pauses, churns, or materially re-scopes deployments
        - Damages both revenue-floor assumptions and the data-flywheel thesis
        - Haircut base-case value and revisit standalone viability.
      - - Amazon product overlap
        - Amazon launches clearly overlapping warehouse-AI capability using similar model logic
        - Compresses neutrality premium and shifts best commercialization path outside Covariant
        - Move the thesis toward strategic-sale rather than growth-equity underwriting.
      - - Financing pressure before proof
        - Company needs fresh capital before showing renewed customer momentum or clear 2026 KPIs
        - Turns valuation risk into dilution and control risk
        - Assume down-round or structured financing terms in the base case.
      - - IP or license dispute
        - Any public contradiction over licensed versus retained model rights
        - Undermines the idea that Covariant still owns a clean monetizable platform
        - Suspend valuation work until legal boundaries are externally validated.
      - - No progress on disclosure
        - Management still cannot show revenue mix, renewals, concentration, and support metrics in diligence
        - Keeps the company in narrative mode rather than evidence mode
        - Keep recommendation at research-more regardless of product enthusiasm.
    notes: >-
      These triggers are designed to be externally monitorable and to map directly into valuation impairment rather than
      into generic operating concern.
    claimRefs:
      - CV035
      - CV037
      - CV040
      - CV043
      - CV045
      - CV049
      - CV050
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Current ARR and revenue mix
        - Monthly revenue bridge by software, services, support, and strategic licensing
        - Determines whether Covariant deserves software-style or deployment-style valuation treatment
        - Management + CFO packet; reconcile to board materials and contracts.
      - - Customer renewal and concentration
        - Gross retention, NRR, top-5 / top-10 revenue concentration, and post-Amazon renewal behavior
        - Tests whether the customer base is a durable asset or just installed revenue inertia
        - Customer success and finance diligence with cohort exports.
      - - Amazon license scope
        - Field of use, exclusivity, term, economics, and any future development obligations
        - Defines how much of the strategic upside still belongs to Covariant
        - Legal review of the commercial agreement and schedules.
      - - Post-deal organization and retention
        - Current org chart, retention packages, leadership decision rights, and key technical owners
        - Shows whether the company can still execute without the departed founders
        - CEO/board diligence plus HR retention data.
      - - Cap table and preference stack
        - Current ownership, liquidation preference stack, option pool, SAFEs, and any structured instruments
        - Needed for real downside math and return modeling
        - Finance/legal room with latest cap-table export and financing docs.
      - - Exit readiness and financing plan
        - Updated 2026 operating plan, fundraising timing, banker feedback, and strategic-interest map
        - Separates a survivable standalone case from a forced-sale path
        - Board deck, fundraising timeline, and strategic outreach summary.
    notes: >-
      These are the exact missing facts most likely to move the recommendation from research-more to track or, if
      disappointing, from research-more to pass.
    claimRefs:
      - CV013
