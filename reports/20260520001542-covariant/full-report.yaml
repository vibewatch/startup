      - number: '8.3'
        title: Scenario analysis and downside discipline
        blocks:
          - type: paragraph
            body: >
              A scenario framework is more defensible than a point estimate because Covariant's outcome distribution is
              being driven by milestone risk, not by a disclosed operating baseline. In the bull case, the remaining
              team keeps customers, converts the Amazon validation into continued external demand, and eventually proves
              that the company can grow as a neutral software-and-model layer. In that world, Covariant could plausibly
              support a multi-billion standalone value. But the bull case is not today's base case because investors
              still lack evidence on revenue mix, renewal quality, and how much of the original technical edge stayed
              outside Amazon.


              The base case is more conservative. It assumes Covariant remains alive and strategically relevant, but
              that the market re-prices the business around customer continuity rather than frontier-AI mystique. That
              means either flat value from a premium entry or a reset to a lower private valuation until new financial
              disclosure arrives. The bear case is not theoretical either: if Amazon's hiring and license deal turns
              into direct competitive displacement, or if partners slow deployments while management needs fresh
              capital, the likely outcome looks less like a software unicorn and more like a pressured strategic-sale
              candidate.


              For a new investor, the implication is straightforward. The key question is not whether Covariant has
              upside; it clearly does. The question is whether enough of that upside belongs to outside shareholders
              after leadership disruption, financing risk, and possible value migration to Amazon are priced in. On
              today's public evidence, the expected-value math only improves at a materially lower entry or after a new
              round of proof points.
            claimRefs:
              - CV034
              - CV035
              - CV038
              - CV039
              - CV040
