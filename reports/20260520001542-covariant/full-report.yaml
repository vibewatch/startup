          Public trust signals are thinner at the software layer than the product marketing, and the external developer
          footprint is notably sparse
        blocks:
          - type: paragraph
            body: >
              The fetched source pack shows an asymmetry between product ambition and public technical governance.
              Covariant and its partners describe stronger reasoning, natural-language tasking, fleet learning, and wide
              workflow coverage, but no fetched official source disclosed a product-specific software certification
              regime, public safety case, model card, benchmark sheet, versioning policy, or external security audit for
              RFM-1 or the Covariant Brain. That absence does not prove weak internal controls; it does mean an investor
              cannot validate from public evidence how the company handles model rollback, upgrade validation, human
              override boundaries, or data retention across sites.


              The developer signal is even more restrained. GitHub's robot-foundation-model topic page had no public
              repositories, repository search for “covariant” robotics surfaced only an unrelated motion-planning
              project, and Hugging Face model search for “covariant” returned zero models. Direct organization URLs on
              GitHub and Hugging Face also returned 404s in the fetched pack. The implication is straightforward:
              Covariant is operating as a closed commercial stack with minimal public developer surface. That can
              protect IP and customer-specific know-how, but it also means ecosystem validation, third-party tooling,
              and public reproducibility lag the broader robotics foundation-model conversation.
