      - number: '1.4'
        title: Milestones, customer proof, and adverse context
        blocks:
          - type: paragraph
            body: |
              Covariant's public chronology is coherent even if some commercial metrics are not. The arc
              runs from a 2017 founding, to an early live deployment at Obeta by late 2019, to public
              Series B and Series C financings in 2020 and 2021, to the April 2023 capital extension, to
              the March 2024 RFM-1 launch, to the August 2024 KNAPP partnership renewal and Amazon
              licensing/talent transaction. That is enough to establish a real operating company with live
              deployments, repeat financings, and a product evolution from task-specific warehouse AI into
              a broader foundation-model story.

              Customer and partner proof are strong by private-company standards. KNAPP publicly names
              McKesson and Obeta, GeekWire names Otto Group and Radial, and company-linked post-deal
              reporting says Covariant has worked with over 50 customers and partners on hundreds of
              AI-powered robotic solutions. Those claims are not audited, but they are directionally useful
              because they come with named counterparties and concrete use cases.

              The main adverse lens is structural. Amazon's deal validates the technology, but it also left
              Covariant with founder-transition risk and placed the transaction inside a broader 2025-2026
              debate about reverse acquihires and antitrust scrutiny. More importantly for investors,
              revenue, ARR, debt, board composition, current employee count, and any post-2023 valuation
              remain only partially visible in public sources.
