        title: Public traction signals are real, but they stop short of ARR or revenue disclosure
        blocks:
          - type: paragraph
            body: >
              The best financial signals in public are operational rather than accounting-based. Covariant's 2023
              funding

              release and investor coverage said the company grew 6x in 2022, had customers in 15 countries, and had
              nearly 300

              robots powered by the Covariant Brain. Amazon's 2024 announcement added that Covariant would continue
              serving

              dozens of customers after the founder transition, while KNAPP-linked material still showed the software
              inside live

              warehouse programs across multiple geographies. Those are meaningful signs that the company is
              commercially real,

              not a research-only robotics startup.


              Even so, those same sources leave the decisive operating metrics unstated. No fetched source gives ARR,
              GAAP

              revenue, gross margin, customer concentration, or retention. That forces a distinction between traction
              and

              underwriting: public evidence supports an analytical revenue frame in the tens of millions, because the
