      - number: '7.5'
        title: Competitive and financial risk
        blocks:
          - type: paragraph
            body: >-
              Competition risk is now asymmetric. Covariant still has real customer proof and a recognizable technology
              story, but Amazon can attack from superior scale, Intrinsic can attack from tooling and ecosystem depth,
              Dexterity can attack from production metrics and physical-AI branding, and ABB remains relevant through
              installed-base trust. That does not mean Covariant cannot compete; it means the company now needs to win
              against counterparties that either control more deployment surface area, have deeper balance sheets, or
              can be adopted by the same integrators and warehouse operators that Covariant depends on.


              Financially, the public record proves historical capital raised but not present solvency. SEC filings and
              financing coverage support a large prior funding base, yet current cash, burn, runway, and debt remain
              undisclosed. That is especially important because the Amazon deal likely changed both revenue opportunity
              and expense structure at once. The company may be leaner after the employee transfer, but it also may face
              a harder next fundraise if investors interpret the transaction as technology validation paired with
              standalone-company impairment. For a deep-tech company still tied to deployment pace and warehouse capex,
              that combination creates real financing risk even without evidence of immediate distress.
            claimRefs:
