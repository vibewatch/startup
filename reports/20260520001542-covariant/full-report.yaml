      - number: '8.4'
        title: Exit readiness and the final diligence burden
        blocks:
          - type: paragraph
            body: >
              Public evidence does not support an IPO-underwriting frame today. A credible IPO path for a deep-tech
              automation company usually requires disclosed revenue scale, growth durability, margin trajectory,
              customer concentration control, and enough independence that public investors can evaluate management
              without guessing at a dominant partner's influence. Covariant does not meet that public-information
              standard. Its strongest visible assets are technology relevance, a real deployment footprint, and
              continued customer operations after the Amazon transaction — all valuable, but still more consistent with
              strategic optionality than with near-term listing readiness.


              That makes strategic M&A or continued private operation the more realistic path. Covariant could still
              become attractive to industrial, logistics, or cloud buyers that want proven warehouse-AI models, customer
              references, and partner integrations. But even that thesis depends on diligence that is still missing from
              public sources: current cap table and preference stack, revenue composition, retention, support staffing,
              the exact scope of Amazon's license, and whether outside customers still view Covariant as neutral.


              Those missing facts are precisely why the chapter ends with a research-more call. The public record is
              sufficient to say the business has value and that the market is large. It is not sufficient to say how
              much of that value remains with minority shareholders, how quickly it can compound, or whether the next
              financing would happen from strength. Until those questions are answered, disciplined investors should
              treat Covariant as a monitored opportunity rather than a conviction buy.
            claimRefs:
              - CV041
              - CV042
              - CV043
              - CV044
              - CV049
              - CV050
