- id: RP002
  title: Leadership, technology, and customer-continuity risk
  body: |-
    The largest risk to Covariant is not that the product suddenly stopped working; it is that the original technical nucleus moved inside Amazon. Publicly accessible sources clearly verify that Amazon hired three named founders and roughly a quarter of Covariant’s employees while taking a non-exclusive license to the robotic foundation models. At the same time, Covariant said Ted Stinson and Tianhao Zhang would continue leading the company. That continuity matters, but it does not erase the asymmetry: the remaining organization now has to defend customer trust and continue roadmap execution without the same concentration of founding authority, while its best-capitalized ecosystem counterparty gained both model access and key builders.

    This is where people risk becomes technology risk. RFM-1 was described as the product of years of real-world robot data and accumulated deployment learning. If Amazon can combine those assets with its own robotics fleet, research budget, and infrastructure, Covariant faces the danger that the acquirer-of-talent becomes the superior independent competitor. The company’s best visible counterweight is that customer-serving operations continued and KNAPP extended the relationship shortly after the deal. But that is a continuity floor, not a moat. The core diligence question is whether customers renew because Covariant still has differentiated capabilities, or merely because existing deployments are already installed.
  claimRefs:
