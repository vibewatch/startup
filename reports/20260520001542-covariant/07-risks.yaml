chapter:
  number: 7
  title: Risks
  summary: 'Covariant’s largest risk is the post-Amazon leadership and technology transfer: public sources verify that Amazon hired three named founders and about a quarter of employees while licensing Covariant’s robotic foundation models. That event compounds customer-continuity, competitive, IP-boundary, and fundraising risk rather than creating a single isolated people issue. Additional material risks include partner concentration around KNAPP and OEM channels, worker-safety and AI-governance obligations, unresolved public IP scope, and limited visibility into current runway, retention, and post-deal execution quality.'
sections:
- id: RP001
  title: Severity-ranked risk overview
  body: |-
    Covariant’s risk profile is dominated by a single transmission chain: Amazon hired the most visible technical leaders, licensed the company’s flagship model assets, and now competes from a far larger robotics platform. That sequence turns a classic key-person problem into a compound strategic risk touching technology ownership, customer confidence, hiring, and future fundraising. Even if Covariant remains operational, the center of gravity for embodied-AI talent and model iteration has shifted toward a counterparty that already had material robotics scale.

    The second tier of risk is concentration: Covariant’s public customer proof is real, but it is heavily mediated by partners such as KNAPP and ABB, and public retention metrics remain absent. That makes the company unusually sensitive to any post-deal hesitation from channel partners, lighthouse accounts, or prospective investors. The third tier is compliance and safety. Warehouse robotics deployments sit inside OSHA-style worker-safety expectations and industrial-robot safety standards, while AI governance obligations are tightening through NIST guidance and the EU AI Act. None of those factors alone breaks the thesis, but together they make Covariant a high-monitoring, low-forgiveness situation where leadership continuity, customer renewal evidence, and IP scope clarity matter more than headline technology validation.
  claimRefs:
  - CR001
  - CR002
  - CR004
  - CR017
