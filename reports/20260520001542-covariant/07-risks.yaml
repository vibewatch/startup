- id: RP006
  title: Mitigations, monitoring indicators, and kill criteria
  body: |-
    The public evidence does show mitigating factors. Covariant remained operational after the deal, customer service continuity was stated explicitly, and KNAPP extended the partnership at almost the same moment the founder transition became public. The company also appears less hardware-capex exposed than a full robot OEM because it rides partner platforms. Those are meaningful offsets. They imply Covariant still has a plausible path as a focused software-and-model layer for warehouse robotics if it can retain customer trust, keep the remaining technical team productive, and avoid losing deployment data momentum.

    But investors should treat those mitigations as provisional until they are tested by observable triggers. The most important near-term indicators are: retention of named partners and lighthouse customers, evidence that new deployments continue after 2024, any disclosure that clarifies licensed-versus-retained IP boundaries, and proof of a financing plan that does not rely on narrative alone. Thesis-break events are also straightforward. If a major partner switches away, if a large customer pauses or churns because of support concerns, if Amazon launches a clearly superior overlapping offer using the same talent/model lineage, if a safety incident materially harms customer trust, or if fundraising becomes necessary before management can reestablish the post-deal roadmap, the standalone case for Covariant would weaken sharply.
