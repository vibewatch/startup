- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Leadership and talent attrition
    - Further senior departures after the Amazon deal
    - Loss of another core technical or commercial leader within 12 months
    - Re-underwrite standalone execution capacity and slow any investment process
  - - Customer confidence shock
    - Named partner or lighthouse customer pauses, churns, or publicly re-scopes deployment
    - Any materially adverse partner or customer continuity disclosure
    - Escalate customer diligence and haircut growth / data-flywheel assumptions
  - - Amazon competitive displacement
    - Amazon launches overlapping warehouse-robotics capability using similar model logic
    - Clear public product overlap with stronger Amazon operating proof
    - Treat moat as impaired and revisit valuation / ownership thesis
  - - IP boundary dispute
    - Disagreement, complaint, or legal action around licensed versus retained rights
    - Any formal dispute, injunction risk, or contradictory IP claim
    - Pause until contract scope and remedies are externally validated
  - - Safety incident
    - Serious deployment-site injury, recall, or public compliance failure
    - Any high-profile incident tied to Covariant-enabled workflow
    - Assume longer sales cycles and higher insurance / compliance burden
  - - Financing pressure
    - Need for capital before continuity and roadmap confidence are reestablished
    - Fundraise initiated without disclosed customer-momentum proof
    - Increase dilution / down-round risk in the base case
  - - Channel concentration
    - KNAPP or another major partner slows or reprices rollout
    - Meaningful reduction in rollout pace or partner enthusiasm
    - Haircut deployment growth and model-data accumulation assumptions
  notes: These triggers are intentionally observable from outside the data room. The goal is to define events that would force a materially different underwriting stance.
