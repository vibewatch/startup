- id: RP003
  title: Regulatory and legal risk
  body: |-
    Covariant’s regulatory and legal exposure is broader than a simple “AI company” label suggests. Its software influences physical systems that work around people, so the relevant framework includes OSHA’s robotics guidance, machine-guarding obligations, industrial-robot safety standards such as ISO 10218, and broader AI-governance developments such as the EU AI Act. Public sources do not show a Covariant-specific, investor-ready compliance stack that cleanly maps these regimes into a disclosed safety case. That does not prove non-compliance, but it does mean buyers and investors must assume the burden of checking deployment protocols, OEM interfaces, training practices, and incident handling at site level.

    The legal/IP side is even less settled publicly. Amazon’s deal structure combined talent transfer and model licensing, and 2026 legal commentary plus congressional scrutiny show that reverse-acquihire structures are receiving antitrust attention. Meanwhile, public patent-search tools do not themselves resolve which IP Amazon can exploit immediately, which assets Covariant retained, and whether the accessible patent trail cleanly belongs to the warehouse-robotics company rather than similarly named entities. The result is not a proven lawsuit today; it is a material diligence gap around IP boundaries, competition law optics, and long-tail dispute risk if the two companies’ product roadmaps diverge or if former customers allege unfair competitive advantage.
