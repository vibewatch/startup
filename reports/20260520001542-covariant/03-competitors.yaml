  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - Covariant moat claim
      - Threat
      - Severity
      - Why credible now
      - Mitigation / diligence ask
    rows:
      - - Proprietary robot-learning data and generalization
        - Amazon internalizes model talent and rivals improve world-model performance
        - High
        - Amazon licensed Covariant models; Dexterity and Intrinsic both sharpened public model narratives in 2025-2026
        - Request benchmark win/loss data on novel-SKU performance and retraining burden versus top rivals
      - - Neutral software layer on partner hardware
        - Buyers shift toward full-stack platforms that own more budget and accountability
        - High
        - Symbotic and Berkshire Grey sell more packaged outcomes; OEMs bundle hardware and service
        - Quantify how often Covariant wins as a modular attach versus loses to turnkey procurement
      - - Brownfield flexibility and partner-led deployment
        - Incumbents and Mujin make deterministic, lower-change-management alternatives good enough
        - Medium-High
        - Mujin, ABB, Yaskawa, and OEM ecosystems emphasize speed, support, and easier operator adoption
        - Ask for deployment time, integrator burden, and post-go-live support metrics by workflow
      - - Foundation-model leadership narrative
        - Intrinsic and Dexterity narrow the perception gap with stronger capital and ecosystem support
        - Medium-High
        - Intrinsic now shows Google/FANUC adjacency; Dexterity claims 100M+ production actions and interpretable world models
        - Validate whether Covariant still has measurable product advantage beyond messaging
      - - Customer neutrality after Amazon transaction
        - Operators fear roadmap bias, data leakage, or future unavailability to non-Amazon networks
        - High
        - Amazon hired founders and licensed the models while running its own large robotics fleet
        - Seek contract language on data rights, exclusivity, roadmap governance, and customer references after the deal
      - - Pricing power as a software layer
        - Opaque negotiated market plus service-style alternatives compress software margins
        - Medium
        - Few vendors publish prices; Berkshire Grey and turnkey platforms can simplify procurement; OEM software is often hidden in the bundle
        - Rebuild pricing by workflow and compare labor, uptime, and service assumptions to alternatives
