        - Flowstate, perception, motion planning, sensor-based control
        - Commercial packaging may still be evolving; unclear whether priced like software seats, deployment projects, or runtime licenses
      - - Dexterity
        - Enterprise Physical AI solution sales
        - Not publicly disclosed
        - World-model-driven logistics automation and orchestration
