callouts:
  - calloutType: strength
    title: Covariant still occupies a real middle ground in the market
    body: >-
      Covariant is not just another robot OEM add-on and not yet a capital-heavy warehouse integrator. Its
      strongest comparative position is a neutral, partner-led software layer that can improve brownfield
      workflows without forcing customers into a full facility rebuild.
    claimRefs:
      - CP001
      - CP021
      - CP022
      - CP028
  - calloutType: insight
    title: Amazon turned product validation into a front-rank competitive threat
    body: >-
      The August 2024 deal did not erase Covariant, but it changed the market logic. Amazon now has the
      founders, the model license, and an enormous robotics deployment surface, which means one of
      Covariant's best validation sources is also one of its most intimidating competitors.
    claimRefs:
      - CP003
      - CP019
      - CP029
  - calloutType: risk
    title: Full-stack vendors can out-bundle Covariant even if they trail on model elegance
    body: >-
      Symbotic, Berkshire Grey, OEM ecosystems, and some adjacent platforms do not need to match Covariant
      on foundation-model language if they can own more of the budget, simplify procurement, and reduce
      perceived integration risk for operators.
    claimRefs:
