  - id: pricing-packaging-and-substitutes
    title: Pricing, packaging, and the buyer's practical alternatives
    body: |
      Public pricing is one of the weakest parts of the competitive record. Covariant, Intrinsic,
      Dexterity, Mujin, OSARO, and Realtime Robotics all market outcomes, capabilities, and ROI rather
      than transparent list prices. That usually means negotiated enterprise software-plus-integration
      deals, with the commercial question shifting from sticker price to workflow economics and deployment
      risk.

      The visible exceptions make the contrast sharper. Symbotic's public Walmart agreement shows a custom
      platform model measured in hundreds of millions of dollars and multi-year site commitments.
      Berkshire Grey and adjacent warehouse vendors are more willing to discuss lower-upfront or service-
      oriented structures, while OEM incumbents often bury the economics of software inside a robot,
      controller, and service bundle. Those models change the comparison point for Covariant: buyers may
      not ask whether Covariant is cheaper than Symbotic on a per-site basis, but whether a modular AI
      layer beats a bundled or service-heavy alternative on payback and risk.

      The most persistent substitute is still labor or deterministic automation. If a site can tolerate
      labor variability or can solve the workflow with a simpler fixed cell, Covariant's generalized AI
      advantage may not be compelling enough to overcome procurement inertia.
