  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Retention metrics remain private
    missingEvidence: No public NRR, GRR, churn, contract-length, or cohort retention tables were recovered for Covariant customers.
    whyItMatters: Without formal retention evidence, the chapter can only infer durability from partner renewals and long-lived reference accounts rather than from actual renewal economics.
    diligencePath: Request annual retention cohorts, logo churn, lost-site counts, and renewal calendar detail for 2022-2025 split by direct and partner-led accounts.
    relatedQuestionRefs:
    - QU013
    - QU014
    - QU028
  - type: private-evidence-only
    severity: material
    topic: Customer concentration by account and channel is undisclosed
    missingEvidence: No public source disclosed top-customer ARR, top-site robot concentration, or revenue split between direct accounts and KNAPP-led deployments.
    whyItMatters: A small set of lighthouse accounts or one dominant channel partner could drive disproportionate revenue and support risk while remaining invisible in public marketing materials.
    diligencePath: Request top-5 and top-10 customer revenue share, installed robot/site share, and direct-versus-partner channel ARR mix.
    relatedQuestionRefs:
    - QU015
    - QU016
    - QU028
  - type: enumeration-incomplete
    severity: material
    topic: TU003 named customer proof table is necessarily partial
    missingEvidence: The fetched public pack contains a meaningful but incomplete set of named customers, with some leads only indirect and others uncorroborated.
    whyItMatters: Investors could overread a curated public customer list as the full installed base when most accounts are private or partner-mediated.
    diligencePath: Obtain a live customer list that distinguishes direct accounts, partner-mediated accounts, inferred stack participation, churned accounts, and current referenceability.
    relatedQuestionRefs:
    - QU005
    - QU021
    - QU022
    - QU028
    relatedTableRefs:
    - TU003
