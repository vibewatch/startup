- calloutType: insight
  title: Installed customers are part of the moat because they generate the data flywheel
  body: Covariant’s installed base matters strategically because the same live sites that create revenue and references also generate the interaction data behind the company’s fleet-learning and foundation-model claims. Customer durability therefore affects not just near-term sales but also model quality and future product advantage.
  claimRefs:
