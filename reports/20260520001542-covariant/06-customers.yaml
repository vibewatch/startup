- id: TU003
  title: Named customer proof table
  enumerationScope:
    coverage: partial
    basis: Named publicly disclosed Covariant customers as of May 2026, based on press releases and case studies, plus screened lead accounts where direct proof remained incomplete or indirect.
  columns:
  - Customer / account
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Documented outcome
  - Limitation / caveat
  rows:
  - - KNAPP AG
    - Warehouse automation integrator / channel partner
    - Pick-it-Easy Robot channel for single-item picking and related logistics automation
    - Production and extended multi-year partnership
    - KNAPP says the robot is live at 26 customers across Europe, North America, and Australia
    - Primarily a channel partner rather than a clean end-customer reference; revenue split and customer ownership are not disclosed
  - - Obeta
    - German electrical wholesaler / industrial distribution
    - Pick-it-Easy Robot handling thousands of warehouse customer orders daily
    - Production
    - KNAPP says the robot operates up to 14 hours per day and Obeta cited reliability as a major benefit
    - Public proof is partner-led and trade-press-led rather than a direct Obeta-authored case study
  - - McKesson
    - Healthcare / pharmaceutical distribution
    - Covariant-powered KNAPP robot for complex medication-package picking
    - Production
    - KNAPP says McKesson relies on the robot around the clock and highlighted handling of complex U.S. medicine packaging
    - Public sources do not provide site count, robot count, or contract scope
  - - Brødrene Dahl
    - Industrial supply / building products distribution
    - Pick-it-Easy Robot inside LOGSTAR distribution center
    - Production
    - KNAPP case study says one robot handles roughly 1,100 order lines / 7,000 items daily and contributed to lower error rates
    - Outcome data is from partner case-study material, not an audited customer filing
  - - Otto Group
    - Large European e-commerce retailer
    - Hundreds of Covariant picking robots planned across multiple fulfillment centers
    - Production rollout / multi-site deployment
    - Long-term strategic partnership with installations beginning in Germany and an eventual fleet in the hundreds
    - Sources emphasize rollout intent and strategic scope more than completed unit counts
  - - Radial
    - 3PL fulfillment operator
    - Robotic putwalls for health-and-beauty order sorting
    - Production
    - AiThority reported 12 Covariant robotic putwalls in use; GeekWire showed the system sorting items for a major retailer at a Radial site
    - Public evidence does not disclose retention, margin, or number of facilities
  - - Capacity
    - 3PL fulfillment operator
    - Robotic putwall for demand-spike handling and labor-shortage relief
    - Production and expanded
    - Case study says the station hit up to 515 picks per hour and expanded to five robots
    - Case-study source is a customer-story aggregator and not a primary customer filing
  - - GEODIS
    - Global logistics / contract logistics
    - Two U.S. omnichannel fulfillment centers with KNAPP automation including Pick-it-Easy Robots
    - Production facility announcement; Covariant linkage inferred
    - MMH says the two sites were designed for >270,000 units/day across >850,000 square feet with Pick-it-Easy Robots in scope
    - GEODIS and MMH name KNAPP and Pick-it-Easy Robots but do not name Covariant directly; treat as inferred Covariant-enabled proof
  - - DHL Supply Chain
    - Global logistics / contract logistics
    - Prompt-suggested warehouse robotics lead screened during source review
    - Unverified from accessible public sources
    - The run recovered only DHL’s general press library plus a dead specific URL, not a live Covariant-named customer announcement
    - Do not treat DHL as confirmed public customer proof until a live direct source is recovered
  notes: Rows intentionally distinguish direct named customer proof, partner-mediated customer proof, inferred stack participation, and uncorroborated lead screening. The strongest evidence sits with KNAPP-linked accounts and detailed case-study references, while GEODIS is indirect and DHL remains unconfirmed in this fetched pack.
