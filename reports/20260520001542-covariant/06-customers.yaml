- id: named-customer-proof-and-reference-quality
  title: Named customer proof is strongest where KNAPP or customer-case-study material provides operational detail
  body: |-
    Covariant clears the basic adoption bar because the fetched pack contains more than logos. KNAPP’s official materials name McKesson, Obeta, Würth, and Brødrene Dahl; MIT Technology Review adds Crate & Barrel and Bonprix; GeekWire adds Otto Group and Radial; Capacity is documented through a detailed case-study page with explicit throughput and expansion language; and Material Handling 24/7 identifies Active Ants as the first ABB-and-Covariant installation. That mix is enough to show the company has real production references across retail, 3PL, healthcare distribution, and industrial wholesale.

    Still, not every prompt-suggested lead is equally strong. GEODIS is best treated as an inferred Covariant-enabled site because the fetched GEODIS/KNAPP coverage names Pick-it-Easy Robots without directly naming Covariant, and the DHL linkage could not be corroborated from accessible fetched public sources. In other words, the public pack establishes real customer proof, but it also shows why diligence should separate direct named proof, partner-mediated proof, inferred stack participation, and uncorroborated leads.
