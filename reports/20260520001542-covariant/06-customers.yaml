  - CU003
  - CU017
  - CU033
- calloutType: risk
  title: Retention quality and concentration are still largely private
  body: The public pack never resolves NRR, GRR, top-customer exposure, or contract duration. That opacity matters more after the Amazon reverse-acquihire, because partner dependence and customer-confidence risk could be concentrated in a few lighthouse accounts without being visible in public sources.
