  body: McKesson, Obeta, Brødrene Dahl, Capacity, Otto Group, Radial, and KNAPP-linked sites give Covariant more concrete public customer proof than many private robotics software companies. The best proof points include explicit throughput, uptime, or expansion language, which is more meaningful than simple logo walls.
