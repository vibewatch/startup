- id: concentration-and-adverse-context
  title: The biggest customer risks are channel dependence, concentration opacity, and post-Amazon confidence risk
  body: |-
    Covariant’s customer story is strongest in the exact place that also creates risk: the company’s public proof is heavily concentrated in partner-led warehouse deployments, especially through KNAPP. That creates leverage—KNAPP had 26 live customers by August 2024—but it also means a meaningful share of Covariant’s public market access, referenceability, and deployment credibility sits with one channel partner. Public sources do not resolve how much of installed revenue comes through KNAPP, how sticky those deployments are at contract renewal, or whether a few lighthouse accounts dominate ARR.

    The Amazon transaction adds a second layer of risk. The deal validated the technology, but it also removed three high-profile founders and about a quarter of the workforce, then placed the structure inside a broader 2025-2026 reverse-acquihire scrutiny cycle. Amazon, MMH, and KNAPP all provide reasons to believe customer-serving operations continued, but until Covariant discloses renewal cohorts, support metrics, or concentrated-account exposure, customer durability should be treated as partially proven rather than fully resolved.
