- id: durability-reviews-and-retention-gaps
  title: Durability signals exist, but formal retention disclosure is almost entirely absent
  body: |-
    Public durability evidence is qualitative rather than contractual. Obeta appears in 2020 reporting and then again in later KNAPP material, KNAPP itself renewed and extended the relationship in August 2024, and Amazon explicitly said Covariant would continue serving dozens of customers after the founder transition. FeaturedCustomers and CB Insights also indicate a broader testimonial and reference surface than the deep case studies alone.

    What is missing is the classic SaaS or enterprise-metrics layer: no public NRR, GRR, churn, standard contract length, or top-customer exposure was recovered from the fetched pack. That means the chapter can score Covariant as having credible customer proof and reasonable continuity indicators, but not as having publicly proven retention quality. Any investment or acquisition diligence should require cohort tables, renewal history, installed-base ARR by channel, and top-10 customer concentration before leaning too hard on the public reference set.
