- id: adoption-scale-and-expansion
  title: Adoption scale is credible and expansion signals are visible even if the full customer count remains partly blended with partners
  body: |-
    The best scale datapoint remains the April 2023 company-and-investor claim that Covariant had customers in 15 countries and nearly 300 robots powered by the Covariant Brain. That is reinforced by the later statement that the company had collaborated with over 50 customers and partners on hundreds of AI-powered robotic solutions, plus KNAPP’s 2024 disclosure that 26 of its own customers were already using the Pick-it-Easy Robot. Those numbers should not be treated as audited ARR metrics, but they do support the conclusion that Covariant is beyond pilot stage.

    Expansion signals are also tangible. Otto Group’s long-term partnership contemplates hundreds of robots across multiple fulfillment centers, Capacity expanded from one successful robotic putwall to five robots, and Brødrene Dahl added a Pick-it-Easy Robot into an already automated distribution center. These are exactly the types of references that matter for an enterprise robotics company: multi-site, multi-robot, and post-proof expansion into adjacent workflows or higher volumes.
