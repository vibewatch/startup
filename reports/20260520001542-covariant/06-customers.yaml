- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - KNAPP channel with 26 disclosed customers
    - Meaningful partner dependence on one deployment channel
    - Could accelerate growth but also compress bargaining power or mask end-customer concentration
    - Split ARR, gross margin, and active-site count by KNAPP vs direct accounts
  - - Otto and Capacity land-and-expand signals
    - Large reference accounts may dominate the public story more than the revenue base
    - Public proof may overstate diversification if a few lighthouse accounts carry most value
    - Request top-customer ARR and installed-robot concentration
  - - Fleet-learning from many customer environments
    - Support, roadmap, or data-rights disruption after Amazon deal
    - Could weaken partner confidence and slow upgrades or expansions
    - Review support SLAs, model-roadmap ownership, and data-rights terms
  - - International installed base and sector breadth
    - Most named proof remains inside warehouse and fulfillment categories
    - Customer diversity by end-market may be lower than logos imply
    - Break out active accounts by vertical, geography, and workflow
  - - Customer-reference ecosystem (case studies, reviews, videos)
    - Curated references can hide churned or inactive accounts
    - Reference quality can be overstated if old logos remain marketed after churn
    - Ask for current reference list, date last active, and renewal status by named account
  - - Prompt-suggested DHL / indirect GEODIS leads
    - Potential mismatch between market narrative and directly fetched public proof
    - Could lead to overstatement if investor materials rely on unverified logos
    - Require a board-approved live customer list with proof of production status and contract owner
  notes: The risks here are not that Covariant lacks customer proof; it has real proof. The risk is that public evidence over-indexes on partner-mediated lighthouse accounts while leaving concentration, contract durability, and post-Amazon support economics largely opaque.
