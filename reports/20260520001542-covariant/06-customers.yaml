figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Covariant’s typical customer journey starts with a warehouse labor or SKU-variability problem, moves through partner-led technical validation, then expands through live production proof and fleet-learning confidence.
  data:
    nodes:
    - id: awareness
      label: Awareness
      detail: Retailers, 3PLs, distributors, or integrators identify manual picking, sortation, or labor-shortage pain points.
    - id: evaluation
      label: Evaluation
      detail: Integrator and site teams validate SKU mix, throughput needs, and brownfield fit for robot cells.
    - id: integration
      label: Integration
      detail: KNAPP, ABB, or direct Covariant teams integrate the AI layer into warehouse hardware and workflow.
    - id: go-live
      label: Go-live
      detail: Production robot cells begin handling live orders, totes, or sortation flows at customer sites.
    - id: expansion
      label: Expansion
      detail: Additional robots, sites, or workflows are added once throughput and reliability are proven.
    - id: renewal
      label: Renewal / Continuity
      detail: Customers and partners judge support quality, roadmap continuity, and ROI before further expansion.
  approximationNotes: The stages are synthesized from KNAPP partner motions, direct enterprise announcements such as Otto and Capacity, and Amazon/TechCrunch continuity statements. Exact conversion rates and pilot-to-production win rates are not publicly disclosed.
