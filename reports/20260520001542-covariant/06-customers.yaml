tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / User / Payer
  - Primary use case
  - Observed scale
  - Revenue / strategic value
  - Key gap
  rows:
  - - Warehouse automation integrators
    - Integrator engineering / commercial lead (buyer); warehouse operator (user); integrator or end customer (payer)
    - Bundle Covariant intelligence into robot cells such as Pick-it-Easy Robot or ABB-integrated systems
    - KNAPP disclosed 26 customer sites by Aug 2024; ABB disclosed Active Ants as first installation
    - Scales reach and speeds deployment into brownfield projects
    - Revenue-share terms and customer ownership are undisclosed
  - - Retail and e-commerce operators
    - Supply-chain executive (buyer); site operations team (user); retailer (payer)
    - Piece picking, fulfillment-center picking, sortation, and service-level improvement
    - Otto plans hundreds of robots across Europe; Crate & Barrel and Bonprix named in MIT coverage
    - Large multi-site expansion potential and strong lighthouse value
    - No disclosed per-account ARR or payback periods
  - - 3PL and fulfillment providers
    - Operations VP (buyer); warehouse supervisors and labor teams (user); 3PL operator (payer)
    - Robotic putwalls, order sortation, and labor-flexibility relief
    - Radial deployed 12 putwalls; Capacity expanded to five robots; GEODIS has inferred Covariant-enabled KNAPP sites
    - 3PL references support broad applicability across customer end-markets
    - Direct vs inferred Covariant ownership varies by account
  - - Healthcare and pharma distribution
    - Distribution operations leader (buyer); pharmacy/DC team (user); distributor (payer)
    - High-accuracy single-item picking under safety and compliance constraints
    - McKesson is explicitly named; KNAPP cites pharma and healthcare as core sectors
    - Strategically valuable proof that complex packaging and compliance-heavy SKUs can be automated
    - No disclosed renewal rate or economics by healthcare customer
  - - Industrial and electrical wholesale
    - Logistics or DC leader (buyer); warehouse teams (user); wholesaler (payer)
    - Single-piece picking and repetitive order processing
    - Obeta is a long-running proof point; Würth and Brødrene Dahl are publicly named references
    - Good fit for repetitive long-tail SKU environments
    - Public proof is operational, not financial
  - - Direct enterprise reference accounts
    - Enterprise operations leader (buyer); automation team (user); end customer (payer)
    - Purpose-built Covariant deployments without an explicitly disclosed integrator in the public story
    - Otto, Capacity, and Radial are the clearest examples
    - Better signal for direct product pull and land-and-expand
    - Contract terms, software pricing, and service model remain private
  notes: Observed scale intentionally mixes direct enterprise references and integrator-mediated installations because the fetched pack does not fully separate end-customer count, site count, and partner count. Where buyer/user/payer roles are inferred, the gap is called out explicitly.
