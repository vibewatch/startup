    topic: Retention metrics remain private
    missingEvidence: No public NRR, GRR, churn, contract-length, or cohort retention tables were recovered for Covariant customers.
    whyItMatters: >-
      Without formal retention evidence, the chapter can only infer durability from partner renewals and long-lived
      reference accounts rather than from actual renewal economics.
    diligencePath: >-
      Request annual retention cohorts, logo churn, lost-site counts, and renewal calendar detail for 2022-2025 split by
