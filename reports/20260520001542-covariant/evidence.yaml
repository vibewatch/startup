evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, observer rights, and post-Amazon control map.
    whyItMatters: Founder departure and licensing complexity make control and escalation paths central to diligence.
    diligencePath: Request board materials, voting agreements, and a current cap table from management or lead investors.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: >-
      A directly fetched primary or high-quality public source verifying any post-April-2023 round or materially higher
      valuation.
    whyItMatters: The investment case changes materially if Covariant closed a later round at a much higher price.
    diligencePath: >-
      Re-fetch any later financing announcement, investor post, or paid-database export with publication metadata and
      exact terms.
    relatedQuestionRefs:
      - QO011
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: Exact current employee count and office footprint after the founder transfer to Amazon.
    whyItMatters: >-
      Operating capacity, customer support coverage, and burn assumptions depend on the real post-deal organization
      size.
    diligencePath: Request an org chart, payroll range, or current LinkedIn export reconciled to HR records.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Revenue, ARR, gross margin, burn, debt, and customer concentration.
    whyItMatters: >-
      These metrics determine unit economics, runway, and whether public customer proof translates into venture-quality
      scale.
    diligencePath: Ask for management accounts, board decks, and cohort-level customer revenue reports.
    relatedQuestionRefs:
      - QO024
      - QO025
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: customers
    missingEvidence: Exact current paying-customer count and share of deployments represented by the named reference accounts.
    whyItMatters: Publicly named logos prove relevance but not concentration, retention, or breadth of monetization.
    diligencePath: Request the live customer roster, ARR by account, and deployment count by customer and partner.
    relatedQuestionRefs:
      - QO012
      - QO022
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: >-
      Private internal milestone detail for later product releases, customer additions, and any financing events after
      April 2023.
    whyItMatters: >-
      The public chronology is strong enough to orient diligence, but it is not exhaustive and may miss later strategic
      or capital events.
    diligencePath: >-
      Request a management timeline that reconciles product launches, customer wins, financing, and leadership decisions
      from 2023 onward.
    relatedQuestionRefs:
      - QO011
      - QO023
    relatedTableRefs:
      - TO004
