  - id: market-sizing-and-contradictions
    title: Multiple Sizing Lenses, Contradictory Estimates, and the Software Wedge
    body: |
      Published market sizes for warehouse robotics are directionally consistent on growth but inconsistent on absolute
      dollars. Grand View Research places the market at $4.93B in 2023 and $17.29B by 2030 at a 19.6% CAGR, while
      MarketsandMarkets estimates $6.1B in 2023 and $10.5B by 2028 at 11.4% CAGR. Allied Market Research is notably
      more bullish at $7.07B in 2023 and $31.34B by 2032, and Mordor Intelligence places the market at $9.33B in 2025
      rising to $24.55B by 2031. These are not minor editing differences: they reflect different category definitions,
      forecast windows, component boundaries, and sometimes different mixes of robotic systems versus broader
      warehouse-automation infrastructure.

      The most defensible read is not to pick one number, but to preserve the estimate range and anchor on a cautious
      consensus cluster. For 2023, the overlapping analyst range is roughly $4.9B-$7.1B, which implies a mid-point
      around $6B for pure warehouse robotics. Above that sits the far larger warehouse automation layer: Precedence
      Research estimates $25.27B in 2025, reinforcing that robot intelligence vendors benefit from a broader spending
      ecosystem even if they do not capture all of it. For Covariant, the more decision-useful lens is the software
      wedge inside warehouse robotics. Grand View says software grows at about 21% CAGR through 2030; Mordor says
      hardware still takes about 70% of 2025 spend while software is the fastest-growing layer; Precedence says
      hardware commands 80% of 2025 warehouse automation revenue. Together, those data points imply that Covariant is
      pursuing a minority share of total market dollars, but a strategically valuable and potentially higher-margin one.

      That logic supports an evidence-constrained pyramid rather than a heroic TAM/SAM/SOM model. Broad warehouse
      automation is the outer ring, warehouse robotics is the direct system market, the software/orchestration slice is
      the narrower layer where Covariant actually captures value, and the current obtainable wedge is narrower still,
      centered on software-led picking, induction, sortation, depalletization, and goods transfer inside brownfield and
      greenfield distribution operations. The exact software-only SAM is not directly published in the local source
      pack, so the charted values below are deliberately labeled as approximations rather than company-backed forecasts.
