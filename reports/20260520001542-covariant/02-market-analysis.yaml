      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance to Covariant
    rows:
      - - AI software / intelligence layer for warehouse robots
        - Perception, reasoning, orchestration, workflow integration, monitoring, updates, support
        - Robot hardware, conveyors, AS/RS steel, facility redesign
        - Operations / supply chain budget with automation and IT stakeholders
        - Core addressable wedge; this is the layer Covariant actually monetizes
      - - Full warehouse robotics systems
        - Picking, sortation, induction, depalletization, AMRs, robot cells, control software
        - Non-robot warehouse management overhead and unrelated fixed infrastructure
        - Distribution, fulfillment, or plant operators buying automation cells
        - Immediate adjacent market that determines partner ecosystem and deployment volume
      - - Broader warehouse automation
        - Robotics, conveyors, storage, WMS/WES, sensors, AI, and site automation programs
        - Enterprise software outside warehouse operations and non-warehouse capex
        - CFO / COO / VP Supply Chain
        - Useful outer TAM, but materially broader than Covariant's revenue capture layer
      - - Adjacent industrial / manufacturing AI
        - Vision, robotic tasking, flexible automation in manufacturing and process industries
        - Pure consumer robotics and unrelated enterprise AI
        - Plant operations, automation engineering, industrial tech budgets
        - Expansion adjacency named in Covariant and RFM-1 materials
      - - Status-quo substitute spend
        - Human picking labor, legacy automation maintenance, rules-based robotics programming
        - New generalized robot intelligence
        - Operating budgets and labor lines rather than software budgets
        - Primary displacement pool that creates the ROI case for adoption
    notes: >-
      Boundary logic separates Covariant's AI software wedge from the much larger warehouse automation stack. Included
      and excluded spend are synthesized from analyst market definitions, Hy-Tek's software-centric warehouse view, and
      Covariant/KNAPP evidence on how AI is deployed in live robotic workflows.
