    - {id: CE001, statement: Covariant's core commercial asset is the Covariant Brain, a unified AI platform for warehouse robot manipulation rather than a robot hardware SKU, type: company-claimed, topic: product-core, sourceRefs: [SE002, SE004], confidence: high, freshness: recent, answersQuestionRefs: [QE001, QE004]}
