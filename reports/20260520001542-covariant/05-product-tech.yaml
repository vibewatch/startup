figures:
  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: Covariant's public product stack runs from operator inputs at the top to robot-cell execution at customer sites, with fleet learning connecting deployments back into model improvement.
    data:
      layers:
        - label: Operator and task interface
          detail: Text, image, video, robot-instruction, and measurement inputs let users describe tasks at a higher level than traditional robot programming.
          modules:
            - Natural-language prompts
            - Visual task context
            - Operator feedback
        - label: RFM-1 reasoning core
          detail: Robotics foundation model positioned as an LLM-like reasoning layer for robot language and manipulation tasks.
          modules:
            - Multimodal embeddings
            - Task interpretation
            - Action proposal
        - label: Predicted outcome / world-model layer
          detail: Public demos show RFM-1 generating likely post-action images or videos before execution and requesting help when grasp confidence is low.
          modules:
            - Outcome generation
            - Physical reasoning
            - Help-seeking loop
        - label: Fleet learning and model ops
          detail: Connected robots learn as a fleet, with site telemetry and customer-consented data feeding the shared improvement loop.
          modules:
            - Telemetry ingestion
            - Dataset growth
            - Cross-site updates
        - label: Customer-site robot cell execution
          detail: Covariant intelligence is deployed on industrial arms and partner-integrated warehouse cells rather than sold as a public open-source stack.
          modules:
            - Industrial robot arm
            - Vision system
            - Suction end effector
            - Warehouse integration layer
    approximationNotes: >-
      Public sources describe the layers and behaviors but do not publish a formal architecture diagram or module boundary spec; this figure is a synthesis of repeated signals across official, news, and technical-docs sources.
    claimRefs: [CE003, CE005, CE007, CE008, CE009, CE016, CE019, CE027]
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: standard
    summary: Covariant's workflow begins with a warehouse task and ends with execution plus telemetry, reinforcing the company's fleet-learning moat.
    data:
      nodes:
        - id: task
          label: Warehouse task arrives (pick, sort, induct, kit, depalletize)
        - id: prompt
          label: Operator or system provides prompt / workflow context
        - id: rfm
          label: RFM-1 or Covariant Brain interprets task and candidate action
        - id: predict
          label: Model predicts likely outcome and grasp / motion plan
        - id: execute
          label: Industrial arm executes in customer-site robot cell
        - id: result
          label: Task outcome recorded for customer workflow
        - id: telemetry
          label: Telemetry feeds shared fleet-learning loop
      edges:
        - {from: task, to: prompt, label: work order}
        - {from: prompt, to: rfm, label: multimodal input}
        - {from: rfm, to: predict, label: candidate action}
        - {from: predict, to: execute, label: selected plan}
        - {from: execute, to: result, label: completed move}
        - {from: result, to: telemetry, label: outcome data}
        - {from: telemetry, to: rfm, label: model improvement}
    approximationNotes: >-
      Flow synthesizes how public demos, warehouse deployments, and fleet-learning claims fit together; exact middleware handoffs and latency budgets are not disclosed in the public source pack.
    claimRefs: [CE002, CE008, CE009, CE014, CE018, CE019, CE026, CE027]
  - id: FE003
    title: Critical dependency map
    type: dag
    layout: standard
    summary: Covariant's product performance depends on real customer data, partner-integrated robot cells, and a post-2024 roadmap that now also includes Amazon's model license.
    data:
      nodes:
        - id: customer-sites
          label: Customer warehouse sites
        - id: data-rights
          label: Customer consent / data rights
        - id: robot-cells
          label: Industrial robot cells
        - id: partners
          label: KNAPP / system integrators
        - id: brain
          label: Covariant Brain installed base
        - id: rfm1
          label: RFM-1 model layer
        - id: amazon
          label: Amazon non-exclusive model license
        - id: telemetry
          label: Fleet telemetry / training data
      edges:
        - {from: customer-sites, to: robot-cells, label: operating environment}
        - {from: partners, to: robot-cells, label: deployment integration}
        - {from: robot-cells, to: brain, label: execution substrate}
        - {from: customer-sites, to: data-rights, label: consent process}
        - {from: data-rights, to: telemetry, label: permitted data use}
        - {from: brain, to: telemetry, label: live operational traces}
        - {from: telemetry, to: rfm1, label: training moat}
        - {from: amazon, to: rfm1, label: external strategic pull}
    approximationNotes: >-
      Dependencies are drawn from public operating signals rather than internal architecture disclosures; the figure emphasizes the commercial and technical chokepoints most relevant to diligence.
    claimRefs: [CE014, CE018, CE019, CE020, CE021, CE024, CE027, CE037]
  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: Covariant's strongest maturity is in deployed warehouse workflows and proprietary data accumulation; public openness and external technical documentation are materially weaker.
    data:
      columns:
        - Workflow breadth
        - Generalization signal
        - Deployment proof
        - Developer openness
      rows:
        - label: Covariant Brain
          values: [High, Medium, High, Low]
        - label: RFM-1
          values: [Medium, High, Medium, Low]
        - label: Fleet-learning data layer
          values: [High, High, High, Low]
        - label: Public developer surface
          values: [Low, Low, Low, Low]
    approximationNotes: >-
      Ratings are analyst judgments based only on fetched public evidence; they separate installed-base maturity from openness and from broader generalization ambition.
    claimRefs: [CE004, CE013, CE014, CE027, CE031, CE034, CE035, CE036, CE038]
