  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: current valuation
      missingEvidence: Exact current cap table, latest primary or secondary transaction price, liquidation stack, and any structured terms after the Amazon transaction.
      whyItMatters: Without the actual price and preference stack, the chapter cannot convert strategic interest into an investable return profile.
      diligencePath: Request the latest cap-table export, board-approved financing materials, and any 2024-2026 secondary transaction summary.
      relatedQuestionRefs: [QV008, QV029]
      relatedTableRefs: [TV001, TV004]
    - type: private-evidence-only
      severity: material
      topic: revenue quality
      missingEvidence: ARR or revenue run rate, gross margin by software versus services, renewal rates, expansion rates, and customer concentration.
      whyItMatters: These metrics determine whether Covariant deserves software-style multiples or a heavier deployment discount.
      diligencePath: Obtain the management KPI pack, customer cohort analysis, and product-line revenue bridge.
      relatedQuestionRefs: [QV007, QV030]
      relatedTableRefs: [TV001, TV006]
    - type: private-evidence-only
      severity: material
      topic: amazon-license scope
      missingEvidence: Field of use, economics, exclusivity, development obligations, and retained-rights boundaries in the Amazon agreement.
      whyItMatters: License scope directly shapes how much strategic value remains with Covariant versus with Amazon.
      diligencePath: Review the commercial agreement and supporting legal memo with management and counsel.
      relatedQuestionRefs: [QV003, QV031]
      relatedTableRefs: [TV002, TV006]
    - type: missing-source
      severity: material
      topic: preference overhang
      missingEvidence: Current ownership, option pool, SAFEs, warrants, and liquidation preferences by round.
      whyItMatters: The return to a new investor could diverge sharply from enterprise value if the stack is heavy or structured.
      diligencePath: Request full financing history, security terms, and a pro forma waterfall.
      relatedQuestionRefs: [QV005, QV025]
      relatedTableRefs: [TV003, TV006]
    - type: enumeration-incomplete
      severity: minor
      topic: comparable valuation table
      missingEvidence: Public valuation anchors for some private model-layer peers such as Intrinsic and better recent price transparency for Covariant itself.
      whyItMatters: A narrower peer set reduces confidence in any point estimate and forces wider scenario ranges.
      diligencePath: Supplement with paid private-market data or management-provided financing comps under NDA.
      relatedQuestionRefs: [QV015, QV029]
      relatedTableRefs: [TV004]
    - type: missing-source
      severity: material
      topic: exit readiness
      missingEvidence: Audited growth history, banker feedback, financing timeline, and strategic-interest map.
      whyItMatters: Exit plausibility affects both holding period and downside protection in the scenario model.
      diligencePath: Review the 2026 operating plan, fundraising schedule, and any banker or strategic-party materials.
      relatedQuestionRefs: [QV023, QV024, QV027]
      relatedTableRefs: [TV003, TV006]
