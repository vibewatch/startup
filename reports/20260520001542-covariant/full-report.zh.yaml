        - 企业实体 AI 解决方案销售
        - 未公开披露
        - 基于世界模型的物流自动化与编排
        - 买方大概率按吞吐量和劳动力替代来测算，而不是看透明的软件标价
      - - Mujin
        - 带实施经济性的无代码自动化平台
        - 未公开披露
        - MujinOS 控制层、配置、多品牌部署支持
        - 买方偏好确定性自动化、且希望集成商责任更清晰时，Mujin 可能更有吸引力
      - - OSARO
        - 面向特定应用的机器人方案和支持
        - 未公开披露
        - SightWorks 感知、单件拣选、装袋、配套拣配、拆垛、HyperCare 支持
        - 更窄的工作流包装能简化 ROI，但会限制单站点上行空间
      - - Symbotic
        - 定制化交钥匙平台和资助开发项目
        - 公开参照点是 Walmart 的 $520M 开发项目以及 400-APD 承诺
        - 端到端仓储自动化、AI 软件、密集存储和部署服务
        - 经济性是平台级，难以和 Covariant 的模块化层直接对比
      - - Berkshire Grey
        - 交钥匙系统；2026 年行业报道中出现低前期投入 / 服务式定位
        - 未公开标价
        - 拣选、分拣、包装、卡车卸货
        - 如果客户想要更简单的采购路径，服务重的方案会挤压 Covariant
      - - OEM 既有厂商
        - 硬件、控制器和软件捆绑
        - 软件很少作为独立行项目展示
        - 机器人硬件、仿真 / 控制软件、服务、应用工具
