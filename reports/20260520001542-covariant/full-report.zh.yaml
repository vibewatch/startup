  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Covariant 的公开产品栈从顶部操作员输入一路延伸到客户现场机器人单元执行，部署之间通过车队学习回流，推动模型改进。
    data:
      layers:
        - label: 操作员与任务接口
          detail: 文本、图像、视频、机器人指令和测量输入让用户以高于传统机器人编程的抽象层级描述任务。
          modules:
            - 自然语言提示
            - 视觉任务上下文
            - 操作员反馈
        - label: RFM-1 推理核心
          detail: 机器人基础模型定位为类似 LLM 的推理层，用于机器人语言和操作任务。
          modules:
            - 多模态向量嵌入
            - 任务理解
            - 动作提议
        - label: 预测结果 / 世界模型层
          detail: 公开演示显示，RFM-1 会在执行前生成可能的动作后图像或视频，并在抓取置信度低时请求帮助。
          modules:
            - 结果生成
            - 物理推理
            - 求助闭环
        - label: 车队学习与模型运营
          detail: 联网机器人以车队方式学习，站点遥测和客户同意的数据进入共享改进闭环。
          modules:
            - 遥测摄取
            - 数据集增长
            - 跨站点更新
        - label: 客户现场机器人单元执行
          detail: Covariant 智能层部署在工业机械臂和合作伙伴集成的仓储单元上，而不是作为公开开源栈出售。
          modules:
            - 工业机械臂
            - 视觉系统
            - 吸附末端执行器
            - 仓储集成层
    approximationNotes: 公开来源描述了这些层级和行为，但没有发布正式架构图或模块边界规范；该图综合了官方、新闻和技术文档来源中反复出现的信号。
