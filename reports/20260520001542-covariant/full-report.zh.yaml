      - CE034
      - CE035
      - CE036
      - CE038
  - id: FU001
    title: 客户旅程地图
    type: journey-map
    layout: wide
    summary: Covariant 的典型客户旅程始于仓储用工或 SKU 变异性问题，经合作伙伴主导的技术验证，再通过实产证明和车队学习信心扩张。
    data:
      nodes:
        - id: awareness
          label: 认知
          detail: 零售商、3PL、分销商或集成商识别人工拣选、分拣或用工短缺痛点。
        - id: evaluation
          label: 评估
          detail: 集成商和站点团队验证 SKU 组合、吞吐需求，以及机器人单元对存量仓的适配。
        - id: integration
          label: 集成
          detail: KNAPP、ABB 或 Covariant 直属团队将 AI 层接入仓储硬件和工作流。
        - id: go-live
          label: 上线
          detail: 生产机器人单元开始在客户现场处理实单、周转箱或分拣流。
        - id: expansion
          label: 扩张
          detail: 吞吐量和可靠性得到证明后，客户增加机器人、站点或工作流。
        - id: renewal
          label: 续约 / 延续
          detail: 在进一步扩张前，客户和合作伙伴会评估支持质量、路线图延续性和 ROI。
    approximationNotes: 这些阶段综合自 KNAPP 合作伙伴动作、Otto 和 Capacity 等直接企业公告，以及 Amazon/TechCrunch 的延续性表述。准确转化率和试点到生产的赢率没有公开披露。
    claimRefs:
      - CU001
      - CU003
      - CU012
      - CU017
      - CU028
      - CU033
      - CU034
      - CU036
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 公开部署证据从宽泛装机基础主张，逐步收窄到有明确具名证明和量化结果的较小账户子集。
    data:
      items:
        - stage: 已部署机器人
          value: 300
          label: 截至 2023 年 4 月，公开提及近 300 台 Covariant 驱动机器人
        - stage: 已提及客户 + 合作伙伴
          value: 50
          label: 50+ 家客户和合作伙伴使用数百套 AI 驱动机器人解决方案
        - stage: KNAPP 客户站点
          value: 26
          label: 截至 2024 年 8 月，26 家 KNAPP 客户公开使用 Pick-it-Easy Robot
        - stage: 具名标杆账户
          value: 9
          label: 本章证明表中有 9 个具名或筛选账户，包括 1 个间接线索和 1 个未佐证线索
        - stage: 有量化结果的账户
          value: 4
          label: Obeta、Brødrene Dahl、Capacity 以及 GEODIS 相关设施带有明确吞吐量、正常运行时间或规模指标
    approximationNotes: 该漏斗混合了机器人、客户 / 合作伙伴组织、具名标杆账户和结果丰富的案例研究，因为 Covariant 没有披露一个干净的活跃付费客户分母。因此最好把它看作证明深度漏斗，而不是合同销售管道漏斗。
    claimRefs:
      - CU002
      - CU011
      - CU015
      - CU021
      - CU023
      - CU041
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 证据质量最强的是 KNAPP 相关账户和详细案例研究账户；Otto、Radial 等大型企业 logo 处于中等；GEODIS 和 DHL 等间接或未佐证线索最弱。
    data:
      columns:
        - 具名证据（1-3）
        - 生产证明（1-3）
        - 结果具体性（1-3）
        - 扩张 / 延续（1-3）
        - 留存可见度（1-3）
      rows:
