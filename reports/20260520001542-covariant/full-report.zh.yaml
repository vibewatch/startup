      - number: '3.4'
        title: 定价、打包与买方的现实替代选择
        blocks:
          - type: paragraph
            body: >
              公开定价是竞争记录里最弱的部分之一。Covariant、Intrinsic、Dexterity、Mujin、OSARO 和 Realtime Robotics 都营销结果、能力和
              ROI，而不是透明标价。通常这意味着企业软件加集成的谈判式交易，商业问题也从标价转向工作流经济性和部署风险。


              可见例外让对比更尖锐。Symbotic 公开的 Walmart 协议显示，其定制平台模式以数亿美元和多年场地承诺来衡量。Berkshire Grey 和相邻仓储供应商更愿意讨论低前置成本或服务导向结构，而 OEM
              既有厂商常把软件经济性埋进机器人、控制器和服务包里。这些模式改变了 Covariant 的比较点：买方可能不会问 Covariant 单场地是否比 Symbotic 便宜，而会问模块化 AI
              层在回收期和风险上，是否胜过捆绑或重服务替代方案。


              最持久的替代仍是人工或确定性自动化。若一个场地能容忍人工波动，或能用更简单的固定工作站解决流程，Covariant 的通用 AI 优势可能不足以打破采购惯性。
