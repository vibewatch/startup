      - number: '7.2'
        title: 领导层、技术和客户连续性风险
        blocks:
          - type: paragraph
            body: >-
              Covariant 最大风险不是产品突然失效，而是原始技术核心转入 Amazon。可公开访问来源清楚验证，Amazon 招走三位具名创始人和约四分之一 Covariant
              员工，同时取得机器人基础模型的非独家许可。与此同时，Covariant 表示 Ted Stinson 和 Tianhao Zhang
              将继续领导公司。连续性很重要，但不能抹平不对称：剩余组织现在必须在没有同等创始权威集中的情况下守住客户信任、继续执行路线图，而其资本最充足的生态交易对手同时获得了模型访问权和关键建设者。


              人事风险在这里变成技术风险。RFM-1 被描述为多年真实世界机器人数据和部署学习沉淀的产物。如果 Amazon 能把这些资产与自有机器人车队、研究预算和基础设施结合，Covariant
              面临的危险是：人才收购方会成为更强的独立竞争者。公司最清楚的可见制衡，是客户服务运营持续，且 KNAPP 在交易后不久延长了合作关系。但这只是连续性底线，不是护城河。核心尽调问题是：客户续约，是因为
              Covariant 仍有差异化能力，还是仅仅因为现有部署已经装好。
