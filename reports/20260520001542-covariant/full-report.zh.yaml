      - number: '3.5'
        title: 护城河耐久性与真正决定市场的因素
        blocks:
          - type: paragraph
            body: >
              Covariant 最强的公开护城河主张不是硬件所有权，而是模型质量加上从真实仓储部署中学到的数据。TechCrunch、MIT Technology Review、Radical Ventures 和
              KNAPP 相关材料都指向一家公司：它试图比僵硬仓储自动化系统更快地泛化操作能力。这也解释了为什么 Amazon 即使没有买下整家公司，也想要模型和创始人。


              但 Amazon 交易也制造了本章的核心竞争风险。Amazon 现在既是验证者，也是渠道冲突威胁；Amazon 之外的买方有理由追问，路线图、中立性和数据边界是否仍然偏向自己。与此同时，Intrinsic 有
              Google 和 FANUC 相邻关系，Dexterity 展现出强于典型创业公司演示的生产牵引，Symbotic 和 Berkshire Grey 能用交钥匙系统拿走更多预算，既有厂商也能把改进中的 AI
              包进既有关系。


              因此，实用尽调测试很简单：Covariant
              是否仍能凭数据和泛化能力显著更好而赢下足够多真实交易？还是资本更充足的对手追上来，同时全栈平台和既有厂商吸走经济价值？答案不会主要出现在营销语言里，而会体现在工作流层面的胜率、定价韧性、伙伴经济性，以及
              Amazon 重置后客户购买中立层的意愿上。
