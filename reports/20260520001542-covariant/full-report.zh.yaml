      - number: '1.3'
        title: 融资历史、估值证据与利益相关方地图
        blocks:
          - type: paragraph
            body: >
              资本历史到 2023 年 4 月之前证据扎实，之后明显模糊。本地抓取来源中，最后一个可验证的公开融资事件，是 2023 年 4 月宣布的额外 $75M Series C 扩展轮。多方来源称，该轮使披露累计融资达到
              $222M，由 Index Ventures 和 Radical Ventures 共同领投，CPP Investments、Amplify Partners、Gates Frontier
              Holdings、AIX Ventures 和 Northgate Capital 也被点名。2024 年末围绕 Amazon 交易的公开报道，仍在引用 2023 年那轮融资和约 $625M 的报道估值。


              更早的历史也能看见。Global Venturing 和 Wikipedia 支持 2021 年 7 月 $80M Series C，使当时披露融资达到 $147M；Wikipedia 还提到，此前有 2020
              年 5 月 $40M Series B 和更早 $20M Series A。本地来源包里看不到的，是能独立验证 2024 年更晚融资或显著更高后期估值的原始来源或高质量公开来源。


              因此，利益相关方的重要性不止在股权表上。Amazon 重要，因为它现在持有授权，并带走很多原始创始人才；Index 和 Radical 重要，因为它们多次支持 AI 软件逻辑；KNAPP
              重要，因为它是活跃的进入市场和部署伙伴；被点名企业用户重要，因为客户证明比财务披露更可见。
