      - number: '4.5'
        title: 财务结论：软件经济性有吸引力，但决定性投资判断输入仍不公开
        blocks:
          - type: paragraph
            body: >
              Covariant 的公开财务逻辑在轮廓上有吸引力。公司似乎把软件牵引的机器人 AI 层卖进真实仓储运营；拥有已验证的大额融资历史；Amazon
              交易之后仍显示伙伴和客户连续性。这些要素与一种业务相符：未来可能获得强劲的经常性软件利润率，同时用服务和伙伴部署作为进入新账户的切口。

              问题在于，公开记录停在了能把轮廓变成投资观点的数字之前。实际定价、收入结构、毛利率、烧钱、资金跑道、集中度、流失和债务义务，在抓取到的公开证据中都缺失。即使最强的公开增长信号——管理层称 2022 年增长
              6x——也没有告诉投资人，公司现在拥有高质量经常性
              ARR，还是只是更大但仍重服务的项目收入。因此，本章的实用结论偏谨慎：收入质量有可能好，但未证实；对软件优先的机器人公司来说，资本强度可能可控，但还没低到可以忽略；围绕缺失指标的管理层尽调，将决定
              Covariant 应按可扩张软件公司，还是按更依赖资本的机器人部署业务来判断。
