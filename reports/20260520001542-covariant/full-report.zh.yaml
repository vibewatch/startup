        - 只适合采用高下行折减，并按里程碑控制仓位规模。
      - - 估值立场
        - 偏高
        - 若按溢价的后期轮价格进入，会高于公开可比公司和公开指标目前能支撑的水平。
        - 透明的 2026 年收入、续约和新一轮定价。
        - 价格重置或证据更充分之前，只做监控，不要进一步推进。
      - - 决策含义
        - 观察，不投入
        - 下一步信息优势在尽调里，不在市场叙事里。
        - 股权结构表、ARR 桥、客户集中度和 Amazon 之后运营计划。
        - 先跟踪；只有新证据收窄下行空间并支撑更清晰的回报路径，才上调判断。
    notes: 建议对价格和证据都敏感。本表假设投资人在没有经审计的当前经营指标时，评估以溢价进入这家私人公司。
    claimRefs:
      - CV013
      - CV024
      - CV034
      - CV043
      - CV044
      - CV045
      - CV050
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 投资逻辑
      - 反向逻辑
      - 为什么影响估值
      - 哪些证据会改变判断
    rows:
      - - Covariant 处在规模大且仍在增长的仓库自动化赛道。
        - 硬件强度和竞争持续高企时，大市场不保证有吸引力的股权回报。
        - TAM 支撑期权价值，但不能自动给软件溢价。
        - 拿出软件分成率、毛利率爬升和可复制部署经济性的证据。
      - - RFM-1 以及现场仓库部署积累的数据，指向真实的技术差异化。
        - Amazon 聘走创始人并获得模型许可，部分独特优势可能已经流向更强的平台。
        - 差异化技术抬高战略价值，但创始人流失也抬高折现率。
        - 证明交易后路线图推进速度和客户赢单明确独立于 Amazon。
      - - 公开资料显示，通过数十个客户和 KNAPP 渠道，装机基础真实存在。
        - 公开资料仍未显示 ARR、留存、集中度或支持质量指标。
        - 商业真实性托住底部价值，但不足以支撑清晰的后期入场倍数。
        - 提供续约队列、扩张历史和客户集中度数据。
      - - 软件和模型层最终可能拿到好于交钥匙自动化厂商的经济性。
        - 公开记录目前仍过于不透明，也与服务绑定太深，无法证明其已是纯软件画像。
        - 如果业务仍偏重部署，按公开软件公司框架估值就过于宽松。
        - 披露经常性收入占比、毛利率，以及价值中有多少来自服务、软件或许可。
    notes: 每行都把看多理由连到具体条件：只有满足这些条件，才有理由给出更积极的估值立场。
    claimRefs:
      - CV012
      - CV013
      - CV023
      - CV035
      - CV036
      - CV037
