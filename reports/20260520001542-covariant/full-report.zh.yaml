      - number: '7.6'
        title: 缓释因素、监测指标和终止标准
        blocks:
          - type: paragraph
            body: >-
              公开证据确实显示了一些缓释因素。交易后 Covariant 仍在运营，客户服务连续性被明确写出，KNAPP 也几乎在创始人交接公开的同一时点延长了合作。公司看起来还比完整机器人 OEM
              更少暴露于硬件资本开支，因为它搭在合作伙伴平台之上。这些抵消因素有意义。它们说明，只要 Covariant
              能留住客户信任、让剩余技术团队保持产出，并避免丢掉部署数据动能，公司仍有一条作为仓库机器人软件与模型层的聚焦路径。


              但投资人应把这些缓释因素视为临时性的，直到可观察触发点完成检验。最重要的近期指标包括：具名合作伙伴和灯塔客户是否留存；2024 年后新部署是否继续；是否有披露澄清许可 IP 与保留 IP
              边界；以及不只依赖叙事的融资计划证明。打破投资逻辑的事件也很直接：如果主要合作伙伴转向别处，如果大客户因支持担忧暂停或流失，如果 Amazon 借同一批人才 / 模型谱系
              推出明显更强的重叠产品，如果安全事件实质伤害客户信任，或如果管理层在重新确立交易后路线图前就必须融资，Covariant 的独立公司逻辑会明显削弱。
