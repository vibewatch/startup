      - number: '6.3'
        title: 采用规模可信，扩张信号可见，尽管完整客户数仍部分混在合作伙伴口径里
        blocks:
          - type: paragraph
            body: >-
              最佳规模数据点仍是 2023 年 4 月公司和投资人说法：Covariant 的客户遍布 15 个国家，近 300 台机器人由 Covariant Brain 驱动。后续说法进一步支撑这一点：公司已与 50
              多个客户和合作伙伴合作，落地数百个 AI 驱动机器人解决方案；KNAPP 2024 年披露，其自有客户中已有 26 家使用 Pick-it-Easy Robot。这些数字不应被当作经审计 ARR 指标，但确实支持
              Covariant 已超出试点阶段的结论。


              扩张信号也很具体。Otto Group 的长期合作关系设想在多个履约中心部署数百台机器人；Capacity 从一个成功的机器人 putwall 扩到五台机器人；Brødrene Dahl
              在已有自动化配送中心里又加入一台 Pick-it-Easy Robot。这正是企业机器人公司最重要的参考类型：多站点、多机器人，以及完成验证后向相邻工作流或更高量级扩张。
